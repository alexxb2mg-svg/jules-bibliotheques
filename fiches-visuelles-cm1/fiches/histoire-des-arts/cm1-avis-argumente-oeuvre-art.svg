<circle cx="104.0" cy="226.0" r="12" fill="#185FA5" stroke="#ffffff" stroke-width="2"/>
<text x="104.0" y="226.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
<circle cx="300.0" cy="214.0" r="12" fill="#185FA5" stroke="#ffffff" stroke-width="2"/>
<text x="300.0" y="214.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
<text class="ts" x="194.0" y="306.0" text-anchor="middle" dominant-baseline="central">Schéma de lecture simplifié : ce n'est pas l'œuvre.</text>
<text class="tl" x="392.0" y="66.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">Je vois</text>
<circle cx="402.0" cy="100.0" r="12" fill="#185FA5" stroke="#ffffff" stroke-width="2"/>
<text x="402.0" y="100.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
<text class="t" x="422.0" y="100.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">une vague géante,</text>
<text class="t" x="422.0" y="120.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">courbée comme une griffe</text>
<circle cx="402.0" cy="152.0" r="12" fill="#185FA5" stroke="#ffffff" stroke-width="2"/>
<text x="402.0" y="152.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
<text class="t" x="422.0" y="152.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">trois barques minuscules,</text>
<text class="t" x="422.0" y="172.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">pleines de rameurs</text>
<circle cx="402.0" cy="204.0" r="12" fill="#185FA5" stroke="#ffffff" stroke-width="2"/>
<text x="402.0" y="204.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
<text class="t" x="422.0" y="204.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">le mont Fuji, tout petit,</text>
<text class="t" x="422.0" y="224.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">très loin derrière</text>
<text class="tl" x="392.0" y="252.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">Je ressens</text>
<text class="t" x="392.0" y="280.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">de la peur, du danger</text>
<rect x="24.0" y="330.0" width="632.0" height="96.0" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="tl" x="340" y="362" text-anchor="middle" dominant-baseline="central"><tspan fill="#C2410C">Je trouve cette image effrayante</tspan> parce que</text>
<text class="tl" x="340" y="394" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">la vague géante va retomber sur les barques.</tspan></text>
<text class="ts" x="340.0" y="440.0" text-anchor="middle" dominant-baseline="central">orange : mon avis · bleu : la preuve vue dans l'œuvre · les deux reliés par « parce que »</text>
</svg>
