<text class="t" x="336.0" y="84.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11" font-weight="700">Rectangles</text>
<text class="t" x="336.0" y="103.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11">les 2 tours, au sommet plat</text>
<text class="t" x="336.0" y="134.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="700">Un cercle</text>
<text class="t" x="336.0" y="153.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">la rosace : un grand vitrail rond</text>
<text class="t" x="336.0" y="184.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="700">Des petits rectangles alignés</text>
<text class="t" x="336.0" y="203.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">la galerie de 28 statues de rois</text>
<text class="t" x="336.0" y="234.0" text-anchor="start" dominant-baseline="central" fill="#C2410C" font-weight="700">Des arcs brisés (pointus)</text>
<text class="t" x="336.0" y="253.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">les 3 portails : celui du milieu est le plus grand</text>
<text class="t" x="336.0" y="284.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="700">Presque un carré (pointillés)</text>
<text class="t" x="336.0" y="303.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">le bas de la façade, sans les tours</text>
<text class="t" x="336.0" y="334.0" text-anchor="start" dominant-baseline="central" fill="#534AB7" font-weight="700">Un axe de symétrie</text>
<text class="t" x="336.0" y="353.0" text-anchor="start" dominant-baseline="central" fill="#534AB7">la gauche ressemble à la droite</text>
<rect x="330.0" y="376.0" width="342.0" height="64.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="t" x="340.0" y="396.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="700">Ce que ça donne à ressentir :</text>
<text class="t" x="340.0" y="418.0" text-anchor="start" dominant-baseline="central">de l'ordre, du calme, de la solidité.</text>
<text class="ts" x="170.0" y="462.0" text-anchor="middle" dominant-baseline="central">Dessin simplifié, pas à l'échelle.</text>
</svg>
