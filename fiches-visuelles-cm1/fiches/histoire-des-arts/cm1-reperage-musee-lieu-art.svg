<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg"><title>Plan très simplifié du Louvre : trois ailes et trois œuvres célèbres</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="340.0" y="16.0" text-anchor="middle" dominant-baseline="central">rue de Rivoli (au nord)</text>
<line x1="34.0" y1="92.0" x2="34.0" y2="52.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round" marker-end="url(#fl)"/>
<text class="t" x="34.0" y="104.0" text-anchor="middle" dominant-baseline="central" font-weight="700">N</text>
<rect x="60.0" y="36.0" width="410.0" height="52.0" rx="0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/>
<text class="tl" x="265.0" y="62.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">aile Richelieu</text>
<rect x="60.0" y="250.0" width="410.0" height="52.0" rx="0" fill="#FAECE7" stroke="#C2410C" stroke-width="2"/>
<text class="tl" x="170.0" y="276.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">aile Denon</text>
<rect x="470.0" y="36.0" width="170.0" height="266.0" rx="0" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<rect x="512.0" y="80.0" width="86.0" height="178.0" rx="0" fill="#ffffff" stroke="#185FA5" stroke-width="1.5"/>
<text class="tl" x="555.0" y="58.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">aile Sully</text>
<text class="ts" x="555.0" y="160.0" text-anchor="middle" dominant-baseline="central">Cour</text>
<text class="ts" x="555.0" y="176.0" text-anchor="middle" dominant-baseline="central">Carrée</text>
<text class="ts" x="230.0" y="130.0" text-anchor="middle" dominant-baseline="central">Cour Napoléon</text>
<polygon points="312.0,186.0 340.0,146.0 368.0,186.0" fill="#FFF6DC" stroke="#1a1a18" stroke-width="2" stroke-linejoin="round"/>
<line x1="340.0" y1="146.0" x2="340.0" y2="186.0" stroke="#1a1a18" stroke-width="1" stroke-linecap="round"/>
<text class="t" x="300.0" y="176.0" text-anchor="end" dominant-baseline="central" fill="#1a1a18" font-weight="700">entrée : la Pyramide</text>
<path d="M372 180 C 405 192, 430 215, 440 240 L 440 268" fill="none" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<path d="M432 276 L 318 276" fill="none" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#fl)"/>
<circle cx="300.0" cy="276.0" r="13" fill="#C2410C" stroke="#ffffff" stroke-width="2"/>
<text x="300" y="276" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
<circle cx="446.0" cy="276.0" r="13" fill="#C2410C" stroke="#ffffff" stroke-width="2"/>
<text x="446" y="276" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
<circle cx="555.0" cy="280.0" r="13" fill="#185FA5" stroke="#ffffff" stroke-width="2"/>
<text x="555" y="280" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
<line x1="300.0" y1="290.0" x2="300.0" y2="322.0" stroke="#C2410C" stroke-width="1.2" stroke-linecap="round"/>
<line x1="446.0" y1="290.0" x2="446.0" y2="322.0" stroke="#C2410C" stroke-width="1.2" stroke-linecap="round"/>
<line x1="555.0" y1="294.0" x2="555.0" y2="322.0" stroke="#185FA5" stroke-width="1.2" stroke-linecap="round"/>
<text class="t" x="300.0" y="336.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">① La Joconde</text>
<text class="t" x="300.0" y="354.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">1er étage</text>
<text class="t" x="434.0" y="336.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">② Victoire de Samothrace</text>
<text class="t" x="434.0" y="354.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">en haut de l'escalier Daru</text>
<text class="t" x="592.0" y="336.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">③ Vénus de Milo</text>
<text class="t" x="592.0" y="354.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">rez-de-chaussée</text>
<rect x="60.0" y="382.0" width="580.0" height="20.0" rx="0" fill="#CFE3F5" stroke="none" stroke-width="0"/>
<text class="ts" x="350.0" y="392.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">la Seine (au sud)</text>
<text class="ts" x="20.0" y="426.0" text-anchor="start" dominant-baseline="central">Pointillés : un chemin possible de l'entrée à La Joconde (on monte l'escalier Daru, on passe devant la Victoire).</text>
<text class="ts" x="20.0" y="442.0" text-anchor="start" dominant-baseline="central">Plan très simplifié, pas à l'échelle : sur place, suis le plan du musée et les panneaux.</text>
