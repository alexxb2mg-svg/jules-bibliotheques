    jules: "Le **patrimoine**, ce sont les œuvres et les monuments que les générations d'avant nous ont laissés. On les garde en bon état pour les enfants qui viendront après toi."

  - id: schema-plan
    type: schema
    titre: "Le Louvre en plan très simplifié : trois ailes, trois œuvres célèbres"
    svg: "cm1-reperage-musee-lieu-art.svg"
    jules: "Au Louvre, on se repère avec le nom de l'aile, puis l'étage, puis le numéro de la salle. Le plan distribué à l'entrée et les panneaux dans les couloirs donnent tout cela."

  - id: schema-cartel
    type: schema
    titre: "Lire un cartel : la carte d'identité de l'œuvre"
    svg: "cm1-reperage-musee-lieu-art-cartel.svg"
    jules: "Le **cartel** répond toujours aux mêmes questions. Quand tu cherches une œuvre dans un livre ou sur le site d'un musée, tu retrouves les mêmes informations."

  - id: schema-fragile
    type: schema
    titre: "Les œuvres sont fragiles : ce qui les abîme, ce qui les protège"
    svg: "cm1-reperage-musee-lieu-art-fragile.svg"
    jules: "La Joconde a été volée au Louvre en 1911 et retrouvée en Italie deux ans plus tard. Aujourd'hui, elle est derrière une vitre spéciale, très solide."

  - id: methode
    type: methode
    etapes:
      - "**Avant** la sortie, avec la classe : je cherche sur le site du musée où se trouvent les œuvres à voir (aile, étage, salle) et je prépare une ou deux questions."
      - "À l'entrée, je prends le **plan** et je repère sa légende : les ailes en couleur, les étages, les escaliers, les toilettes."
      - "Je pose le doigt sur l'entrée, puis sur la salle à trouver, et je suis un chemin avec les **panneaux**."
      - "Devant l'œuvre, je lis le **cartel**, je regarde sans toucher, je parle doucement et je ne fais pas de flash."
    jules: "Sur un plan, cherche toujours d'abord le point « Vous êtes ici » ou l'entrée. Sans point de départ, on ne peut pas trouver le chemin."

  - id: piege
    type: piege
    mauvaise_idee: "Les œuvres d'un musée sont solides : elles ne risquent rien, on peut les effleurer."
    pourquoi_faux: "Les œuvres sont **fragiles** : la lumière fait pâlir les couleurs, le gras des doigts tache, un choc peut tout casser. Des milliers de doigts, même propres, finissent par user une statue."
    bonne_idee: "On protège le **patrimoine** : pas de doigts, pas de flash, on marche. Même un monument peut brûler, comme Notre-Dame de Paris le 15 avril 2019."
    jules: "Notre-Dame a rouvert en décembre 2024, après plus de cinq ans de travaux. Des centaines d'artisans ont travaillé pour la réparer."

  - id: exemple-sortie
    type: exemple
    situation: "La classe de Maé va au Louvre voir la Vénus de Milo et La Joconde. Avant la sortie, chaque groupe cherche sur le site du musée où elles se trouvent. Que doivent-ils noter pour ne pas se perdre ?"
    calcul: "Vénus de Milo : aile Sully, rez-de-chaussée. La Joconde : aile Denon, 1er étage. Sur le plan, on entre par la Pyramide, on visite d'abord le rez-de-chaussée, puis on monte à l'étage."
    conclusion: "Avec l'aile et l'étage de chaque œuvre, la classe prépare son **parcours** : pas de temps perdu, et on sait quoi chercher."
    jules: "Note aussi une question par œuvre, par exemple : « Pourquoi la Vénus n'a-t-elle pas de bras ? » (elle a été retrouvée ainsi, en 1820, sur l'île grecque de Milo). Tu regarderas l'œuvre avec plus d'attention."

  - id: exemple-metiers
    type: exemple
    situation: "Devant La Joconde, Enzo se demande qui s'occupe de ce tableau de plus de 500 ans. Quels métiers protègent les œuvres d'un musée ?"
    calcul: "Le **conservateur** étudie les œuvres et décide comment les exposer. Le **restaurateur** répare et nettoie avec des gestes très précis. L'agent de surveillance veille dans les salles. Le médiateur explique les œuvres aux visiteurs."
    conclusion: "Une œuvre est protégée par toute une équipe : ces métiers servent à la faire **durer** et à la faire connaître."
    jules: "Un restaurateur travaille parfois avec une loupe et un pinceau minuscule. Il n'ajoute rien qu'on ne puisse enlever plus tard."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine le plan de ton école comme un plan de musée, avec une légende et un point « Vous êtes ici ». Invente un cartel pour un dessin de ta classe."
