blocs:
  - id: phrase
    type: formule
    expression: "[Je trouve…] parce que [je vois…]"
    termes:
      "Je trouve…": {couleur: orange, legende: "ton **avis** : ce que tu penses ou ressens, dit avec un mot précis (effrayant, calme, joyeux, triste, étrange)"}
      "je vois…": {couleur: bleu, legende: "ta **preuve** : un détail vrai de l'œuvre (une couleur, une forme, un geste, un son), que tout le monde peut vérifier"}
    jules: "Un avis tout seul, c'est comme une réponse sans calcul. Le « parce que » montre d'où vient ton idée."

  - id: carte
    type: carte
    noeuds:
      - {id: avis, titre: "Un avis argumenté", sous_titre: "ce que je ressens + la preuve que je vois", principal: true}
      - {id: observer, titre: "J'observe", sous_titre: "personnages, objets, lieu, lumière, couleurs"}
      - {id: resumer, titre: "Je résume l'action", sous_titre: "qui fait quoi, en une phrase"}
      - {id: ressentir, titre: "Je choisis un mot", sous_titre: "effrayant, calme, joyeux, étrange..."}
      - {id: prouver, titre: "Je dis parce que", sous_titre: "un détail précis de l'œuvre comme preuve"}
    liens:
      - {de: avis, vers: observer}
      - {de: avis, vers: resumer}
      - {de: avis, vers: ressentir}
      - {de: avis, vers: prouver}
    jules: "Tu as le droit de ne pas aimer une œuvre célèbre. Ce qui compte, c'est de dire pourquoi, avec ce que tu as vu ou entendu."

  - id: schema-vague
    type: schema
    titre: "La Grande Vague de Hokusai : je vois, je ressens, parce que"
    svg: "cm1-avis-argumente-oeuvre-art.svg"
    jules: "Hokusai était un artiste japonais. Une **estampe** est une image imprimée : on grave le dessin dans une planche de bois, on l'encre, puis on la presse sur le papier. On peut donc en tirer beaucoup d'exemplaires."

  - id: schema-nuit
    type: schema
    titre: "La Nuit étoilée de Van Gogh : un avis sans preuve, un avis argumenté"
    svg: "cm1-avis-argumente-oeuvre-art-nuit-etoilee.svg"
    jules: "Van Gogh a peint ce tableau en 1889, dans le sud de la France. Les couleurs **froides** (bleu, vert) font penser à la nuit et au calme ; les couleurs **chaudes** (jaune, orange) au feu et à la lumière."

  - id: methode
    type: methode
    etapes:
      - "**J'observe** en silence : qui est là (personnages, animaux) ? Quels objets ? Quel lieu : dehors, dedans, la mer, la ville ? D'où vient la lumière ?"
      - "Je **résume** en une phrase ce qui se passe : « Des pêcheurs dans leurs barques affrontent une vague géante. »"
      - "Je choisis **un mot précis** pour ce que je ressens : pas seulement « beau », mais effrayant, calme, joyeux, triste, étrange."
      - "Je relie ce mot à **un détail** de l'œuvre avec « parce que » : une couleur, une taille, un geste, un son."
    jules: "Le mot « beau » ne dit pas grand-chose. « Effrayant » ou « paisible », c'est déjà une vraie idée à défendre."

  - id: piege
    type: piege
    mauvaise_idee: "Donner son avis, c'est dire « j'aime » ou « je n'aime pas », et c'est tout."
    pourquoi_faux: "Sans « parce que », personne ne sait d'où vient ton avis. Dire seulement « C'est moche » devant La Nuit étoilée, ce n'est pas un **avis argumenté**."
    bonne_idee: "« Je trouve ce ciel agité parce que Van Gogh a peint de grands **tourbillons** bleus autour des étoiles. » L'avis est appuyé sur ce qu'on voit."
    jules: "Autre piège : inventer une histoire qui n'est pas dans l'œuvre. Ta preuve doit être visible par quelqu'un qui regarde la même image que toi."

  - id: exemple-venus
    type: exemple
    situation: "Au Louvre, Nora regarde la Vénus de Milo, une statue en marbre blanc d'environ 2 m de haut, sculptée en Grèce il y a plus de 2 000 ans. Il lui manque les deux bras. On pense qu'elle représente Aphrodite, la déesse de l'amour et de la beauté. Quel avis argumenté Nora peut-elle donner ?"
    calcul: "Elle observe : une femme debout, calme, le visage paisible, le corps un peu tourné, un drapé de tissu autour des jambes. Elle choisit un mot : « majestueuse »."
    conclusion: "« Je trouve cette statue **majestueuse** parce que la déesse se tient debout, calme, même sans ses bras, et que le drapé semble être du vrai tissu. »"
    jules: "Aphrodite est un **personnage mythologique** : elle vient des récits de la Grèce antique. Les Romains l'appelaient Vénus, d'où le nom de la statue."

  - id: exemple-musique
    type: exemple
    situation: "En classe, Samuel écoute « L'Éléphant », un morceau du Carnaval des animaux de Camille Saint-Saëns (1886). Une contrebasse (un instrument à cordes géant, joué debout) joue avec un piano. Comment donner un avis sur un morceau de musique ?"
    calcul: "Il écoute : des sons très **graves** (très bas), une danse qui semble lourde et un peu maladroite. Il choisit un mot : « drôle »."
    conclusion: "« Je trouve ce morceau **drôle** parce que la contrebasse joue une danse avec des sons très graves et lourds : on imagine un gros éléphant qui essaie de danser. »"
    jules: "Pour la musique, ta preuve est un son : grave ou aigu, fort ou doux, lent ou rapide, et quels instruments tu reconnais."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
