<text class="t" x="24.0" y="318.0" text-anchor="start" dominant-baseline="central">① le cyprès sombre, au premier plan</text>
<text class="t" x="24.0" y="338.0" text-anchor="start" dominant-baseline="central">② le ciel qui tourbillonne</text>
<text class="t" x="24.0" y="358.0" text-anchor="start" dominant-baseline="central">③ les étoiles et la lune jaunes</text>
<text class="t" x="24.0" y="378.0" text-anchor="start" dominant-baseline="central">④ le village calme, tout en bas</text>
<text class="t" x="24.0" y="404.0" text-anchor="start" dominant-baseline="central" fill="#854F0B">jaune : couleur chaude · bleu : couleur froide</text>
<text class="ts" x="24.0" y="426.0" text-anchor="start" dominant-baseline="central">Schéma de lecture simplifié : ce n'est pas l'œuvre.</text>
<text class="th" x="506.0" y="24.0" text-anchor="middle" dominant-baseline="central">Deux élèves, deux avis</text>
<circle cx="360.0" cy="78.0" r="13" fill="#F5D7B8" stroke="#1a1a18" stroke-width="1.2"/>
