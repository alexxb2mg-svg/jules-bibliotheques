<polygon points="395.0,210.0 380.0,222.0 395.0,226.0" fill="#ffffff" stroke="#5F5E5A" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="395.0" y1="211.0" x2="395.0" y2="225.0" stroke="#ffffff" stroke-width="3" stroke-linecap="butt"/>
<text class="t" x="408.0" y="172.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">Je trouve ce ciel agité,</text>
<text class="t" x="408.0" y="192.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">comme s'il bougeait,</text>
<text class="t" x="408.0" y="212.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="700">parce que Van Gogh a peint</text>
<text class="t" x="408.0" y="232.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">de grands tourbillons bleus</text>
<text class="t" x="408.0" y="252.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">autour d'étoiles jaunes.</text>
<text class="t" x="400.0" y="312.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11">✓ un avis argumenté :</text>
<text class="t" x="400.0" y="332.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11">  mon ressenti + ce que je vois</text>
</svg>
