<text class="tl" x="529.0" y="78.0" text-anchor="middle" dominant-baseline="central">C'est moche.</text>
<text class="t" x="400.0" y="126.0" text-anchor="start" dominant-baseline="central" fill="#A32D2D">✗ un avis, mais aucune preuve</text>
