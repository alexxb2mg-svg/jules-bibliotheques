notion: cm1-contexte-historique-culturel-oeuvre
titre: "Replacer une œuvre dans son époque : quand, où, pour quoi faire ?"
matiere: histoire-des-arts
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 53-54", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: questions
    type: formule
    expression: "le contexte d'une œuvre = [quand ?] + [où ?] + [pour quoi faire ?]"
    termes:
      "quand ?": {couleur: orange, legende: "**l'époque** où l'œuvre a été fabriquée : Moyen Âge, Renaissance, règne de Louis XIV..."}
      "où ?": {couleur: bleu, legende: "le **lieu** et les gens autour : une église, un château, un roi, une ville"}
      "pour quoi faire ?": {couleur: vert, legende: "son **usage** : raconter une histoire, prier, décorer, montrer la puissance d'un roi"}
    jules: "Ces trois questions, ce sont celles d'un détective. Avec les réponses, une œuvre n'est plus une simple image : elle devient un témoin de son temps."

  - id: carte
    type: carte
    noeuds:
      - {id: contexte, titre: "Le contexte d'une œuvre", sous_titre: "l'époque, le lieu et les événements de sa création", principal: true}
      - {id: epoque, titre: "Son époque", sous_titre: "je la place sur la frise"}
      - {id: histoire, titre: "Au même moment", sous_titre: "un roi, une guerre, une découverte vus en histoire"}
      - {id: usage, titre: "Son usage", sous_titre: "à quoi elle servait, pour qui"}
      - {id: texte, titre: "Un texte illustré", sous_titre: "un même récit, des images différentes selon l'époque"}
    liens:
      - {de: contexte, vers: epoque}
      - {de: contexte, vers: histoire}
      - {de: contexte, vers: usage}
      - {de: contexte, vers: texte}
    jules: "Tes leçons d'histoire t'aident en arts : le Moyen Âge, la Renaissance et Louis XIV ont chacun leurs œuvres célèbres."

  - id: schema-frise
    type: schema
    titre: "Trois œuvres sur la frise, et ce qui se passe au même moment en histoire"
    svg: "cm1-contexte-historique-culturel-oeuvre.svg"
    jules: "Léonard de Vinci a apporté La Joconde en France quand François Ier l'a invité. Il est mort à Amboise en 1519, et le tableau est resté en France : c'est pour ça qu'il est aujourd'hui au Louvre."

  - id: schema-dates
    type: schema
    titre: "Deux dates à ne pas confondre : l'événement raconté et l'œuvre fabriquée"
    svg: "cm1-contexte-historique-culturel-oeuvre-deux-dates.svg"
    jules: "Une œuvre faite longtemps après montre surtout comment on imaginait le passé à l'époque du peintre. Une œuvre faite au même moment est un **témoin** bien plus proche."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 1000, max: 1900, pas: 1, depart: 1429}
      - {id: curseur-intervalle, nom: intervalle, min: 0, max: 500, pas: 1, depart: 425}
      - {id: curseur-debut, nom: début, min: 1000, max: 1000, pas: 1, depart: 1000}
      - {id: curseur-fin, nom: fin, min: 1900, max: 1900, pas: 1, depart: 1900}
    lectures:
      - {si: "intervalle == 0", texte: "Œuvre faite **au moment** de l'événement : c'est un **témoin** de son temps."}
      - {si: "intervalle > 0 && intervalle < 100", texte: "L'œuvre est faite **après** l'événement : il faut écrire deux dates."}
      - {si: "intervalle >= 100", texte: "Plusieurs siècles plus tard : le peintre n'a pas vu ce qu'il peint, il l'**imagine**."}
      - {si: "date == 1429 && intervalle == 425", texte: "C'est l'exemple de la fiche : **1429**, le sacre de Charles VII ; **1854**, le tableau d'Ingres."}
    jules: "Le repère bleu, c'est l'événement raconté ; le vert, c'est l'œuvre. Plus la bande orange est longue, plus le peintre imagine."

  - id: methode
    type: methode
    etapes:
      - "Je cherche la **date** de l'œuvre, sur le cartel ou dans le livre, et je la place sur la frise : Moyen Âge ? Temps modernes ?"
      - "Je me demande ce qui se passe **au même moment** en histoire : quel roi, quelle guerre, quelle découverte ?"
      - "Je cherche son **usage** : où était-elle, qui la regardait, à quoi servait-elle ?"
      - "Je fais une phrase qui relie l'œuvre à son époque : « La Galerie des Glaces montre la puissance de Louis XIV. »"
    jules: "Si l'œuvre raconte une histoire plus ancienne, écris deux dates : celle de l'histoire racontée et celle de l'œuvre."

  - id: piege
    type: piege
    mauvaise_idee: "Le tableau d'Ingres Jeanne d'Arc au sacre du roi Charles VII date de 1429, puisqu'il montre le sacre de 1429."
    pourquoi_faux: "1429, c'est **l'événement raconté**. Ingres a peint le tableau en 1854, soit 1854 − 1429 = 425 ans plus tard. Il n'a jamais vu Jeanne d'Arc."
    bonne_idee: "Deux dates : 1429 pour le sacre, 1854 pour le **tableau**. Les habits et le décor sont imaginés par un peintre du XIXe siècle."
    jules: "Pose-toi la question : « Le peintre a-t-il pu voir ce qu'il peint ? » Si non, l'œuvre montre surtout ce qu'on imaginait à son époque."

  - id: exemple-galerie
    type: exemple
    situation: "En sortie à Versailles, Malik traverse la Galerie des Glaces, construite de 1678 à 1684 pour Louis XIV. Elle mesure 73 m de long et compte 357 miroirs. Le plafond est peint de scènes à la gloire du roi. À quoi servait cette salle ?"
    calcul: "Époque : le règne de Louis XIV, roi de 1643 à 1715. Lieu : le château où il installe sa cour en 1682. Usage : le roi la traverse chaque jour, et on y reçoit les ambassadeurs étrangers. À cette époque, les miroirs coûtent très cher."
    conclusion: "La Galerie des Glaces servait à **impressionner** les visiteurs et à montrer la **puissance** du roi."
    jules: "Un meuble ou un objet ancien raconte aussi un mode de vie. Au Moyen Âge, un coffre servait d'armoire, de banc et de valise : on emportait ses affaires en voyage."

  - id: exemple-fable
    type: exemple
    situation: "Lina compare deux illustrations de la fable « Le Corbeau et le Renard » de Jean de La Fontaine, publiée en 1668 sous Louis XIV. La première est une gravure de François Chauveau, de 1668. La seconde est une gravure de Gustave Doré, de 1867. Que remarque-t-elle ?"
    calcul: "Le texte est le même. Mais chaque artiste le dessine avec le style de son époque : une petite image simple en 1668, une grande image très détaillée, pleine d'ombres et de lumière, en 1867."
    conclusion: "Un même **texte** peut avoir plusieurs **illustrations** : chacune montre le regard de son époque sur l'histoire."
    jules: "On fait pareil aujourd'hui : un conte connu peut devenir un dessin animé, un album illustré ou une pièce de théâtre."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : sur la frise de ta classe, colle une petite image de chaque œuvre étudiée, à sa date. Tu verras les époques se remplir."
