<svg width="100%" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg"><title>Lire un cartel de musée : la carte d'identité de La Joconde</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="300.0" y="24.0" width="360.0" height="258.0" rx="4" fill="#ffffff" stroke="#1a1a18" stroke-width="2"/>
<rect x="306.0" y="30.0" width="348.0" height="246.0" rx="2" fill="none" stroke="#D3D1C7" stroke-width="1"/>
<text class="t" x="320.0" y="58.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="700">Léonard de Vinci (1452-1519)</text>
<text class="t" x="264.0" y="58.0" text-anchor="end" dominant-baseline="central" fill="#C2410C" font-weight="700">Qui l'a faite ?</text>
<line x1="270.0" y1="58.0" x2="312.0" y2="58.0" stroke="#C2410C" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fl)"/>
<text class="t" x="320.0" y="96.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="400">Portrait de Lisa Gherardini,</text>
<text class="t" x="264.0" y="96.0" text-anchor="end" dominant-baseline="central" fill="#C2410C" font-weight="700">Comment s'appelle-t-elle ?</text>
<line x1="270.0" y1="96.0" x2="312.0" y2="96.0" stroke="#C2410C" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fl)"/>
<text class="t" x="320.0" y="116.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="700">dite La Joconde</text>
<text class="t" x="320.0" y="152.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="400">Vers 1503-1519</text>
<text class="t" x="264.0" y="152.0" text-anchor="end" dominant-baseline="central" fill="#C2410C" font-weight="700">Quand ?</text>
<line x1="270.0" y1="152.0" x2="312.0" y2="152.0" stroke="#C2410C" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fl)"/>
<text class="t" x="320.0" y="188.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="400">Peinture à l'huile sur bois</text>
<text class="t" x="264.0" y="188.0" text-anchor="end" dominant-baseline="central" fill="#C2410C" font-weight="700">Avec quoi ?</text>
<line x1="270.0" y1="188.0" x2="312.0" y2="188.0" stroke="#C2410C" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fl)"/>
<text class="t" x="320.0" y="224.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="400">77 cm de haut, 53 cm de large</text>
<text class="t" x="264.0" y="224.0" text-anchor="end" dominant-baseline="central" fill="#C2410C" font-weight="700">Quelle taille ?</text>
<line x1="270.0" y1="224.0" x2="312.0" y2="224.0" stroke="#C2410C" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fl)"/>
<text class="t" x="320.0" y="260.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="400">Paris, musée du Louvre</text>
<text class="t" x="264.0" y="260.0" text-anchor="end" dominant-baseline="central" fill="#C2410C" font-weight="700">Où est-elle ?</text>
<line x1="270.0" y1="260.0" x2="312.0" y2="260.0" stroke="#C2410C" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fl)"/>
<text class="ts" x="480.0" y="12.0" text-anchor="middle" dominant-baseline="central"></text>
<text class="t" x="440.0" y="306.0" text-anchor="middle" dominant-baseline="central">Le cartel (ici simplifié) : l'étiquette posée à côté de l'œuvre.</text>
<text class="ts" x="440.0" y="328.0" text-anchor="middle" dominant-baseline="central">77 cm de haut : à peu près la hauteur d'une table.</text>
</svg>
