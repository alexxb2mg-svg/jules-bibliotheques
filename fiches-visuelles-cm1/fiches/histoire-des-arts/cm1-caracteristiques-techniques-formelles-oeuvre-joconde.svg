<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg"><title>La Joconde : premier plan, arrière-plan et triangle</title>
<text class="th" x="140.0" y="18.0" text-anchor="middle" dominant-baseline="central">Léonard de Vinci, La Joconde</text>
<text class="ts" x="140.0" y="38.0" text-anchor="middle" dominant-baseline="central">vers 1503-1519 · huile sur bois</text>
<rect x="40.0" y="60.0" width="200.0" height="290.0" rx="0" fill="#D9E6EE" stroke="none" stroke-width="0"/>
<path d="M40 170 L60 140 L84 164 L102 130 L120 158 L160 138 L190 156 L216 126 L240 152 L240 350 L40 350 Z" fill="#A9C1D6" stroke="#6F8FAE" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M40 220 C 60 200, 80 210, 70 190 C 62 176, 88 172, 94 164" fill="none" stroke="#8A7A5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M196 210 A 8 8 0 0 1 212 210 A 8 8 0 0 1 228 210 A 8 8 0 0 1 240 210" fill="none" stroke="#6F8FAE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="194.0" y1="206.0" x2="240.0" y2="206.0" stroke="#6F8FAE" stroke-width="2" stroke-linecap="round"/>
<path d="M50 350 C 60 260, 94.0 200, 116.0 178 L164.0 178 C 186.0 200, 220 260, 230 350 Z" fill="#6B4A2B" stroke="#3E2A15" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M120.0 182 C 130.0 210, 150.0 210, 160.0 182 Z" fill="#E8C8A0" stroke="#8A6A3A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="140.0" cy="142" rx="30" ry="36" fill="#3E2A15" stroke="none"/>
<ellipse cx="140.0" cy="144" rx="21" ry="28" fill="#E8C8A0" stroke="#8A6A3A" stroke-width="1"/>
<rect x="133.0" y="168.0" width="14.0" height="14.0" rx="0" fill="#E8C8A0" stroke="none" stroke-width="0"/>
<ellipse cx="126.0" cy="322" rx="22" ry="11" fill="#E8C8A0" stroke="#8A6A3A" stroke-width="1"/>
<ellipse cx="154.0" cy="314" rx="22" ry="11" fill="#E8C8A0" stroke="#8A6A3A" stroke-width="1"/>
<polygon points="140.0,100.0 54.0,338.0 226.0,338.0" fill="none" stroke="#C2410C" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 5"/>
<text class="ts" x="140.0" y="372.0" text-anchor="middle" dominant-baseline="central">Schéma simplifié : ce n'est pas l'œuvre.</text>
<rect x="276.0" y="60.0" width="390.0" height="82.0" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text class="t" x="290.0" y="80.0" text-anchor="start" dominant-baseline="central" fill="#854F0B" font-weight="700">Au premier plan : la femme</text>
<text class="t" x="290.0" y="102.0" text-anchor="start" dominant-baseline="central" fill="#854F0B">tout près de nous, peinte en couleurs</text>
<text class="t" x="290.0" y="122.0" text-anchor="start" dominant-baseline="central" fill="#854F0B">chaudes : brun, ocre, doré</text>
<rect x="276.0" y="154.0" width="390.0" height="82.0" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="t" x="290.0" y="174.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="700">À l'arrière-plan : un paysage</text>
<text class="t" x="290.0" y="196.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">montagnes, chemin, rivière, un pont :</text>
<text class="t" x="290.0" y="216.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">des couleurs bleutées et floues</text>
<rect x="276.0" y="248.0" width="390.0" height="82.0" rx="8" fill="#FAECE7" stroke="#C2410C" stroke-width="1.2"/>
<text class="t" x="290.0" y="268.0" text-anchor="start" dominant-baseline="central" fill="#C2410C" font-weight="700">Une forme : le triangle</text>
<text class="t" x="290.0" y="290.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">la tête en haut, les mains en bas :</text>
<text class="t" x="290.0" y="310.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">une forme stable, qui donne du calme</text>
<text class="t" x="276.0" y="356.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="700">Au loin, tout devient bleu et flou :</text>
<text class="t" x="276.0" y="376.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-weight="700">c'est ce qui crée la profondeur.</text>
</svg>
