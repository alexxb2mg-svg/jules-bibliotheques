blocs:
  - id: technique
    type: formule
    expression: "[marbre] + [sculpter] → une statue"
    termes:
      "marbre": {couleur: orange, legende: "le **matériau** : la matière dont l'œuvre est faite (pierre, bois, peinture, laine, et même des sons en musique)"}
      "sculpter": {couleur: bleu, legende: "la **technique** : le geste de l'artiste pour donner forme au matériau (tailler, peindre, broder, jouer d'un instrument)"}
    jules: "Même recette pour La Joconde : de la peinture à l'huile, posée au pinceau sur une planche de bois. Matériau + geste, c'est la carte d'identité technique de l'œuvre."

  - id: carte
    type: carte
    noeuds:
      - {id: oeuvre, titre: "Comment l'œuvre est faite", sous_titre: "sa fabrication et son organisation", principal: true}
      - {id: materiau, titre: "Le matériau", sous_titre: "huile, marbre, laine, bois, sons"}
      - {id: geste, titre: "La technique", sous_titre: "peindre, sculpter, broder, jouer"}
      - {id: formes, titre: "Les formes", sous_titre: "cercles, triangles, carrés, lignes qui se répètent"}
      - {id: sens, titre: "Le sens", sous_titre: "ce que cette organisation fait ressentir"}
    liens:
      - {de: oeuvre, vers: materiau}
      - {de: oeuvre, vers: geste}
      - {de: oeuvre, vers: formes}
      - {de: oeuvre, vers: sens}
    jules: "Le matériau et la technique, c'est le côté **technique**. Les formes et leur place, c'est le côté **formel**. Les deux aident à comprendre ce que l'artiste voulait montrer."

  - id: schema-techniques
    type: schema
    titre: "Quatre techniques à reconnaître, avec une œuvre célèbre pour chacune"
    svg: "cm1-caracteristiques-techniques-formelles-oeuvre.svg"
    jules: "La **fresque** se peint vite, avant que l'enduit sèche : Michel-Ange a peint le plafond de la chapelle Sixtine, à Rome, de 1508 à 1512. Une **ronde-bosse** se regarde de tous les côtés ; un **bas-relief**, seulement de face."

  - id: schema-facade
    type: schema
    titre: "La façade de Notre-Dame de Paris : des formes géométriques bien rangées"
    svg: "cm1-caracteristiques-techniques-formelles-oeuvre-facade.svg"
    jules: "La façade est presque symétrique, pas tout à fait : les deux tours et les trois portails ne sont pas exactement pareils. Regarde bien, les bâtisseurs du Moyen Âge n'avaient pas de machines pour tout rendre identique."

  - id: schema-joconde
    type: schema
    titre: "La Joconde : premier plan, arrière-plan et un triangle caché"
    svg: "cm1-caracteristiques-techniques-formelles-oeuvre-joconde.svg"
    jules: "Léonard de Vinci peignait par couches si fines que les contours du visage deviennent doux, presque flous. Au loin, les montagnes bleutées donnent l'impression d'un paysage immense."

  - id: methode
    type: methode
    etapes:
      - "Je cherche le **matériau** : de quoi l'œuvre est-elle faite ? Le cartel du musée le dit souvent (huile sur toile, marbre, bronze)."
      - "Je cherche la **technique** : peinte, sculptée, brodée, construite, jouée ? Pour une sculpture, je regarde si on peut en faire le tour."
      - "Je repère les **formes** avec le doigt : cercles, triangles, rectangles, lignes droites ou courbes. Se répètent-elles ? Y a-t-il une symétrie ?"
      - "Je dis ce que cela donne : des formes bien rangées donnent du calme ; des courbes et des tourbillons donnent du mouvement."
    jules: "Pour une peinture, cherche aussi ce qui est tout près (le premier plan) et ce qui est loin (l'arrière-plan)."

  - id: piege
    type: piege
    mauvaise_idee: "Le matériau de La Nuit étoilée, c'est le ciel et les étoiles."
    pourquoi_faux: "Le ciel et les étoiles, c'est le **sujet** : ce que l'œuvre représente. Le **matériau**, c'est la matière utilisée pour la fabriquer."
    bonne_idee: "La Nuit étoilée est une **peinture à l'huile sur toile** : Van Gogh a posé une peinture épaisse, en petites touches, sur un tissu tendu sur un cadre."
    jules: "Pour ne pas confondre, pose-toi deux questions : « Qu'est-ce que je vois dessus ? » (le sujet) et « Avec quoi c'est fait ? » (le matériau)."

  - id: exemple-bayeux
    type: exemple
    situation: "Dans son livre d'histoire, Hugo découvre la « tapisserie » de Bayeux, faite à la fin du XIe siècle. C'est une bande de toile de près de 70 m de long et d'environ 50 cm de haut, qui raconte en images la conquête de l'Angleterre en 1066. De quoi est-elle faite, et comment ?"
    calcul: "Matériau : des fils de laine de plusieurs couleurs, sur une toile de lin. Technique : les fils sont cousus à l'aiguille sur la toile. Formes : des scènes les unes après les autres, comme une bande dessinée très longue."
    conclusion: "Ce n'est pas une vraie tapisserie mais une **broderie** : on a cousu des fils de laine sur une toile de lin."
    jules: "Dans une vraie tapisserie, l'image est tissée en même temps que le tissu. Ici, elle a été brodée par-dessus : le vieux nom est resté."

  - id: exemple-cygne
    type: exemple
    situation: "Chloé écoute « Le Cygne », un morceau du Carnaval des animaux de Camille Saint-Saëns (1886). De quoi cette musique est-elle « faite », et comment est-elle organisée ?"
    calcul: "Matériaux sonores : un **violoncelle**, dont on frotte les cordes avec un archet, accompagné par deux pianos. Organisation : une mélodie lente et douce, de longues notes qui glissent, pendant que les pianos font comme des vaguelettes."
    conclusion: "Les longues notes du violoncelle font penser au cygne qui glisse sur l'eau : la forme de la musique donne du **sens**."
    jules: "En musique, les instruments et les voix sont les matériaux. Le compositeur les organise : lent ou rapide, doux ou fort, sons qui se répètent ou qui changent."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : regarde la façade de ton école ou de ta mairie. Trouve trois formes géométriques et dis si la façade est symétrique."
