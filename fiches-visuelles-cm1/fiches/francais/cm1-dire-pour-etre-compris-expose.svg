<svg width="100%" viewBox="0 0 680 476" xmlns="http://www.w3.org/2000/svg"><title>Un mini-exposé en 3 parties sur les abeilles, avec ses mots de liaison</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Mon exposé : les abeilles</text>
<text x="486.0" y="18.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Ma fiche, dans ma main</text>
<rect x="16.0" y="36.0" width="446.0" height="104.0" rx="10" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.6"/>
<text x="30.0" y="56.0" font-size="16" fill="#7048E8" font-weight="700" text-anchor="start" dominant-baseline="central">1. Le début : j'annonce</text>
<text x="30.0" y="82.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Je vais vous présenter</tspan><tspan fill="#1a1a18"> les abeilles.</tspan></text>
<text x="30.0" y="104.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">D'abord</tspan><tspan fill="#1a1a18">, je parlerai de leur maison,</tspan></text>
<text x="30.0" y="126.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">puis</tspan><tspan fill="#1a1a18"> de leur travail.</tspan></text>
<rect x="16.0" y="164.0" width="446.0" height="150.0" rx="10" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.6"/>
<text x="30.0" y="184.0" font-size="16" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">2. Le milieu : j'explique</text>
<text x="30.0" y="210.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">D'abord</tspan><tspan fill="#1a1a18">, les abeilles vivent dans une</tspan></text>
<text x="30.0" y="232.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">ruche, avec une reine et des milliers</tspan></text>
<text x="30.0" y="254.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">d'ouvrières. </tspan><tspan fill="#D9480F" font-weight="700">Ensuite</tspan><tspan fill="#1a1a18">, les ouvrières</tspan></text>
<text x="30.0" y="276.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">butinent les fleurs et fabriquent</tspan></text>
<text x="30.0" y="298.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">le miel.</tspan></text>
<rect x="16.0" y="338.0" width="446.0" height="104.0" rx="10" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="30.0" y="358.0" font-size="16" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">3. La fin : je conclus</text>
<text x="30.0" y="384.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Pour conclure</tspan><tspan fill="#1a1a18">, les abeilles sont très</tspan></text>
<text x="30.0" y="406.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">utiles : en transportant le pollen, elles</tspan></text>
<text x="30.0" y="428.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">aident les fleurs à donner des fruits.</tspan></text>
<path d="M239.0 142.0 L239.0 162.0" fill="none" stroke="#1a1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<path d="M239.0 316.0 L239.0 336.0" fill="none" stroke="#1a1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="239.0" y="460.0" font-size="13.5" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">En orange : les mots de liaison. Ils disent au public où on en est.</text>
<rect x="486.0" y="36.0" width="178.0" height="406.0" rx="6" fill="#FFFDF6" stroke="#b9b6aa" stroke-width="1.2"/>
<text x="500.0" y="66.0" font-size="14" fill="#7048E8" font-weight="700" text-anchor="start" dominant-baseline="central">début</text>
<text x="508.0" y="92.0" font-size="16" fill="#3a3a38" font-weight="600" text-anchor="start" dominant-baseline="central" font-style="italic">abeilles :</text>
<text x="508.0" y="118.0" font-size="16" fill="#3a3a38" font-weight="600" text-anchor="start" dominant-baseline="central" font-style="italic">maison, travail</text>
<text x="500.0" y="156.0" font-size="14" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">milieu</text>
<text x="508.0" y="182.0" font-size="16" fill="#3a3a38" font-weight="600" text-anchor="start" dominant-baseline="central" font-style="italic">ruche</text>
<text x="508.0" y="208.0" font-size="16" fill="#3a3a38" font-weight="600" text-anchor="start" dominant-baseline="central" font-style="italic">reine, ouvrières</text>
<text x="508.0" y="234.0" font-size="16" fill="#3a3a38" font-weight="600" text-anchor="start" dominant-baseline="central" font-style="italic">butiner → miel</text>
<text x="500.0" y="272.0" font-size="14" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">fin</text>
<text x="508.0" y="298.0" font-size="16" fill="#3a3a38" font-weight="600" text-anchor="start" dominant-baseline="central" font-style="italic">pollen → fruits</text>
<text x="575.0" y="350.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">des mots-clés,</text>
<text x="575.0" y="370.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">pas tout le texte :</text>
<text x="575.0" y="390.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">je jette un œil,</text>
<text x="575.0" y="410.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">puis je regarde</text>
<text x="575.0" y="430.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">le public</text>
</svg>
