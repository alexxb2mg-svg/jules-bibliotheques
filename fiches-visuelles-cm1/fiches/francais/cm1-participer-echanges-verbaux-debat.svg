<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Un vrai débat en classe : avis, reformulation, répétition, idée nouvelle</title>
<text x="20.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Débat en classe : faut-il un potager dans la cour ?</text>
<circle cx="46.0" cy="58.0" r="18" fill="#F1EFE8" stroke="#6B7686" stroke-width="2"/>
<text x="46.0" y="58.0" font-size="17" fill="#6B7686" font-weight="700" text-anchor="middle" dominant-baseline="central">M</text>
<text x="46.0" y="88.0" font-size="12.5" fill="#6B7686" font-weight="700" text-anchor="middle" dominant-baseline="central">maîtresse</text>
<rect x="86.0" y="40.0" width="380.0" height="43.0" rx="12" fill="#F1EFE8" stroke="#6B7686" stroke-width="1.5"/>
<polyline points="86.0,52.0 74.0,58.0 86.0,66.0" fill="#F1EFE8" stroke="#6B7686" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="84.5" y1="52.0" x2="87.5" y2="66.0" stroke="#F1EFE8" stroke-width="2.9" stroke-linecap="butt"/>
<text x="100.0" y="60.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Qui veut commencer ? Tom.</tspan></text>
<circle cx="46.0" cy="124.0" r="18" fill="#E3EEF9" stroke="#1D4E89" stroke-width="2"/>
<text x="46.0" y="124.0" font-size="17" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">T</text>
<text x="46.0" y="154.0" font-size="12.5" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">Tom</text>
<rect x="86.0" y="106.0" width="380.0" height="64.0" rx="12" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.5"/>
<polyline points="86.0,118.0 74.0,124.0 86.0,132.0" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="84.5" y1="118.0" x2="87.5" y2="132.0" stroke="#E3EEF9" stroke-width="2.9" stroke-linecap="butt"/>
<text x="100.0" y="126.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Je pense que oui, </tspan><tspan fill="#D9480F" font-weight="700">parce qu'</tspan><tspan fill="#1a1a18">on</tspan></text>
<text x="100.0" y="147.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">verrait comment poussent les légumes.</tspan></text>
<line x1="472.0" y1="138.0" x2="488.0" y2="138.0" stroke="#1D4E89" stroke-width="2" stroke-linecap="butt"/>
<text x="500.0" y="128.0" font-size="14.5" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">donne son avis</text>
<text x="500.0" y="148.0" font-size="14.5" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">et une raison</text>
<circle cx="46.0" cy="196.0" r="18" fill="#EEE9FD" stroke="#7048E8" stroke-width="2"/>
<text x="46.0" y="196.0" font-size="17" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">A</text>
<text x="46.0" y="226.0" font-size="12.5" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">Awa</text>
<rect x="86.0" y="178.0" width="380.0" height="106.0" rx="12" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.5"/>
<polyline points="86.0,190.0 74.0,196.0 86.0,204.0" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="84.5" y1="190.0" x2="87.5" y2="204.0" stroke="#EEE9FD" stroke-width="2.9" stroke-linecap="butt"/>
<text x="100.0" y="198.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#7048E8" font-weight="700">Si j'ai bien compris</tspan><tspan fill="#1a1a18">, Tom, tu veux</tspan></text>
<text x="100.0" y="219.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">un potager pour apprendre. Moi, je</tspan></text>
<text x="100.0" y="240.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">ne suis pas d'accord, </tspan><tspan fill="#D9480F" font-weight="700">parce qu'</tspan><tspan fill="#1a1a18">on</tspan></text>
<text x="100.0" y="261.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">aurait moins de place pour jouer.</tspan></text>
<line x1="472.0" y1="231.0" x2="488.0" y2="231.0" stroke="#7048E8" stroke-width="2" stroke-linecap="butt"/>
<text x="500.0" y="221.0" font-size="14.5" fill="#7048E8" font-weight="700" text-anchor="start" dominant-baseline="central">reformule, puis</text>
<text x="500.0" y="241.0" font-size="14.5" fill="#7048E8" font-weight="700" text-anchor="start" dominant-baseline="central">donne un autre avis</text>
<circle cx="46.0" cy="310.0" r="18" fill="#FBE4E4" stroke="#C92A2A" stroke-width="2"/>
<text x="46.0" y="310.0" font-size="17" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">L</text>
<text x="46.0" y="340.0" font-size="12.5" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">Léo</text>
<rect x="86.0" y="292.0" width="380.0" height="43.0" rx="12" fill="#FBE4E4" stroke="#C92A2A" stroke-width="1.5"/>
<polyline points="86.0,304.0 74.0,310.0 86.0,318.0" fill="#FBE4E4" stroke="#C92A2A" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="84.5" y1="304.0" x2="87.5" y2="318.0" stroke="#FBE4E4" stroke-width="2.9" stroke-linecap="butt"/>
<text x="100.0" y="312.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Oui, un potager, c'est bien !</tspan></text>
<line x1="472.0" y1="313.5" x2="488.0" y2="313.5" stroke="#C92A2A" stroke-width="2" stroke-linecap="butt"/>
<text x="500.0" y="303.5" font-size="14.5" fill="#C92A2A" font-weight="700" text-anchor="start" dominant-baseline="central">répète, sans raison :</text>
<text x="500.0" y="323.5" font-size="14.5" fill="#C92A2A" font-weight="700" text-anchor="start" dominant-baseline="central">le débat n'avance pas</text>
<circle cx="46.0" cy="376.0" r="18" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="2"/>
<text x="46.0" y="376.0" font-size="17" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">I</text>
<text x="46.0" y="406.0" font-size="12.5" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">Inès</text>
<rect x="86.0" y="358.0" width="380.0" height="85.0" rx="12" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.5"/>
<polyline points="86.0,370.0 74.0,376.0 86.0,384.0" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="84.5" y1="370.0" x2="87.5" y2="384.0" stroke="#E3F3E6" stroke-width="2.9" stroke-linecap="butt"/>
<text x="100.0" y="378.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">On pourrait le mettre le long du</tspan></text>
<text x="100.0" y="399.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">grillage : il ne prendrait pas</tspan></text>
<text x="100.0" y="420.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">la place du foot.</tspan></text>
<line x1="472.0" y1="400.5" x2="488.0" y2="400.5" stroke="#2B8A3E" stroke-width="2" stroke-linecap="butt"/>
<text x="500.0" y="390.5" font-size="14.5" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">idée nouvelle :</text>
<text x="500.0" y="410.5" font-size="14.5" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">le débat avance !</text>
</svg>
