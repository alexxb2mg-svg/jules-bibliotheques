<text class="ts" x="536.0" y="162.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">Tout flatteur vit</text>
<text class="ts" x="536.0" y="177.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">aux dépens de celui</text>
<text class="ts" x="536.0" y="192.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">qui l'écoute.</text>
<text class="t" x="565.0" y="318.0" text-anchor="middle" dominant-baseline="central">Le Renard dit la leçon.</text>
<text class="t" x="565.0" y="338.0" text-anchor="middle" dominant-baseline="central">La morale est écrite :</text>
<text class="t" x="565.0" y="358.0" text-anchor="middle" dominant-baseline="central">on peut la souligner.</text>
<text class="t" x="340.0" y="408.0" text-anchor="middle" dominant-baseline="central">« Flatter » : faire des compliments qu'on ne pense pas, pour obtenir quelque chose.</text>
<text class="t" x="340.0" y="432.0" text-anchor="middle" dominant-baseline="central">« Vivre aux dépens de quelqu'un » : profiter de lui, lui prendre ce qui est à lui.</text>
<text class="ts" x="340.0" y="458.0" text-anchor="middle" dominant-baseline="central">Le Corbeau et le Renard, fable de Jean de La Fontaine (1668).</text>
</svg>
