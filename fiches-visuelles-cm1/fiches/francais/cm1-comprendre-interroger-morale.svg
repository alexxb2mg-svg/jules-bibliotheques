<text class="ts" x="331.0" y="193.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">Que vous êtes joli !</text>
<text class="t" x="340.0" y="318.0" text-anchor="middle" dominant-baseline="central">Le Renard le flatte.</text>
<text class="t" x="340.0" y="338.0" text-anchor="middle" dominant-baseline="central">Le Corbeau ouvre le bec</text>
<text class="t" x="340.0" y="358.0" text-anchor="middle" dominant-baseline="central">pour chanter : le fromage</text>
<text class="t" x="340.0" y="378.0" text-anchor="middle" dominant-baseline="central">tombe.</text>
