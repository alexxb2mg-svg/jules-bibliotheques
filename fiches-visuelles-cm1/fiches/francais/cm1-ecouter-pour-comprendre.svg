<svg width="100%" viewBox="0 0 680 474" xmlns="http://www.w3.org/2000/svg"><title>Écouter un reportage sur le renard : avant, pendant, après</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="18.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">① Avant : je sais ce que je cherche</text>
<rect x="20.0" y="34.0" width="230.0" height="120.0" rx="4" fill="#FFF9DB" stroke="#E6C84B" stroke-width="1.2"/>
<text x="34.0" y="56.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Mes questions :</text>
<text x="34.0" y="82.0" font-size="16" fill="#7048E8" font-weight="700" text-anchor="start" dominant-baseline="central">Quand sort-il ?</text>
<text x="34.0" y="106.0" font-size="16" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">Que mange-t-il ?</text>
<text x="34.0" y="130.0" font-size="16" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">Où vit-il ?</text>
<rect x="282.0" y="58.0" width="64.0" height="44.0" rx="8" fill="#F1EFE8" stroke="#6B7686" stroke-width="1.8"/>
<circle cx="302.0" cy="80.0" r="12" fill="#FFFFFF" stroke="#6B7686" stroke-width="1.8"/>
<line x1="322.0" y1="70.0" x2="338.0" y2="70.0" stroke="#6B7686" stroke-width="2" stroke-linecap="round"/>
<line x1="322.0" y1="80.0" x2="338.0" y2="80.0" stroke="#6B7686" stroke-width="2" stroke-linecap="round"/>
<line x1="322.0" y1="90.0" x2="338.0" y2="90.0" stroke="#6B7686" stroke-width="2" stroke-linecap="round"/>
<line x1="294.0" y1="58.0" x2="312.0" y2="40.0" stroke="#6B7686" stroke-width="2" stroke-linecap="round"/>
<path d="M352 70 Q362 80 352 90" fill="none" stroke="#6B7686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M352 62 Q370 80 352 98" fill="none" stroke="#6B7686" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="314.0" y="120.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">le reportage</text>
<rect x="372.0" y="26.0" width="292.0" height="128.0" rx="12" fill="#FFFFFF" stroke="#6B7686" stroke-width="1.5"/>
<polyline points="372.0,70.0 356.0,80.0 372.0,90.0" fill="#FFFFFF" stroke="#6B7686" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="370.5" y1="70.0" x2="373.5" y2="90.0" stroke="#FFFFFF" stroke-width="2.9" stroke-linecap="butt"/>
<text x="386.0" y="48.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">« Le renard sort surtout </tspan><tspan fill="#7048E8" font-weight="700">la nuit</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="386.0" y="69.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Il mange des </tspan><tspan fill="#2B8A3E" font-weight="700">petits animaux</tspan><tspan fill="#1a1a18">,</tspan></text>
<text x="386.0" y="90.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">comme les souris, et aussi des</tspan></text>
<text x="386.0" y="111.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#2B8A3E" font-weight="700">fruits</tspan><tspan fill="#1a1a18">. Il creuse un </tspan><tspan fill="#1D4E89" font-weight="700">terrier</tspan><tspan fill="#1a1a18"> pour</tspan></text>
<text x="386.0" y="132.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">se cacher et élever ses petits. »</tspan></text>
<line x1="20.0" y1="176.0" x2="660.0" y2="176.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="198.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">② Pendant : je note des mots-clés</text>
<rect x="20.0" y="214.0" width="300.0" height="196.0" rx="4" fill="#FFFDF6" stroke="#b9b6aa" stroke-width="1.2"/>
<line x1="21.0" y1="244.0" x2="319.0" y2="244.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="21.0" y1="274.0" x2="319.0" y2="274.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="21.0" y1="304.0" x2="319.0" y2="304.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="21.0" y1="334.0" x2="319.0" y2="334.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="21.0" y1="364.0" x2="319.0" y2="364.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="21.0" y1="394.0" x2="319.0" y2="394.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="50.0" y1="215.0" x2="50.0" y2="409.0" stroke="#E8A0A0" stroke-width="1.3" stroke-linecap="butt"/>
<text x="70.0" y="232.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central" font-style="italic">le renard</text>
<text x="62.0" y="262.0" font-size="16.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic"><tspan fill="#3a3a38">- quand : </tspan><tspan fill="#7048E8" font-weight="700">la nuit</tspan></text>
<text x="62.0" y="292.0" font-size="16.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic"><tspan fill="#3a3a38">- mange : </tspan><tspan fill="#2B8A3E" font-weight="700">souris</tspan><tspan fill="#3a3a38">, </tspan><tspan fill="#2B8A3E" font-weight="700">fruits</tspan></text>
<text x="62.0" y="322.0" font-size="16.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic"><tspan fill="#3a3a38">- vit : </tspan><tspan fill="#1D4E89" font-weight="700">terrier</tspan></text>
<text x="62.0" y="352.0" font-size="16.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic"><tspan fill="#3a3a38">  → se cacher, les petits</tspan></text>
<text x="170.0" y="388.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">des mots-clés, pas des phrases</text>
<text x="350.0" y="198.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">③ Après : je redis avec mes mots</text>
<circle cx="380.0" cy="258.0" r="12.35" fill="#FFFFFF" stroke="#1a1a18" stroke-width="2"/>
<line x1="380.0" y1="270.4" x2="380.0" y2="302.7" stroke="#1a1a18" stroke-width="2.4" stroke-linecap="round"/>
<line x1="380.0" y1="278.0" x2="365.8" y2="298.9" stroke="#1a1a18" stroke-width="2.4" stroke-linecap="round"/>
<line x1="380.0" y1="278.0" x2="394.2" y2="298.9" stroke="#1a1a18" stroke-width="2.4" stroke-linecap="round"/>
<line x1="380.0" y1="302.7" x2="368.6" y2="329.2" stroke="#1a1a18" stroke-width="2.4" stroke-linecap="round"/>
<line x1="380.0" y1="302.7" x2="391.4" y2="329.2" stroke="#1a1a18" stroke-width="2.4" stroke-linecap="round"/>
<rect x="420.0" y="216.0" width="244.0" height="150.0" rx="12" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.5"/>
<polyline points="420.0,240.0 400.0,250.0 420.0,260.0" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="418.5" y1="240.0" x2="421.5" y2="260.0" stroke="#E3F3E6" stroke-width="2.9" stroke-linecap="butt"/>
<text x="434.0" y="242.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Le renard est un animal</tspan></text>
<text x="434.0" y="267.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#7048E8" font-weight="700">nocturne</tspan><tspan fill="#1a1a18"> : il sort la nuit.</tspan></text>
<text x="434.0" y="292.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Il mange des </tspan><tspan fill="#2B8A3E" font-weight="700">souris</tspan></text>
<text x="434.0" y="317.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">et des </tspan><tspan fill="#2B8A3E" font-weight="700">fruits</tspan><tspan fill="#1a1a18">, et il vit</tspan></text>
<text x="434.0" y="342.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">dans un </tspan><tspan fill="#1D4E89" font-weight="700">terrier</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="542.0" y="388.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">les 3 réponses, reliées en 2 phrases</text>
<line x1="20.0" y1="410.0" x2="660.0" y2="410.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="432.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="700">Même couleur</tspan><tspan fill="#1a1a18"> = même information : la question, ce qu'on entend, ce qu'on note, ce qu'on redit.</tspan></text>
<text x="20.0" y="456.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="700">« Nocturne »</tspan><tspan fill="#1a1a18"> n'est pas dans le reportage : je l'ai trouvé en reliant les idées.</tspan></text>
</svg>
