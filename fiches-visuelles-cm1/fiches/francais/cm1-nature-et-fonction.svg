<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg"><title>Le nom « chat » garde sa nature, mais change de fonction d'une phrase à l'autre</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M340.0 32.0 Q270.0 20.0 190.0 32.0 L190.0 112.0 Q270.0 100.0 340.0 112.0 Z" fill="#F1EFE8" stroke="#6B7686" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M340.0 32.0 Q410.0 20.0 490.0 32.0 L490.0 112.0 Q410.0 100.0 340.0 112.0 Z" fill="#F1EFE8" stroke="#6B7686" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="265.0" y="56.0" font-size="24" fill="#1a1a18" font-weight="800" text-anchor="middle" dominant-baseline="central">chat</text>
<text x="265.0" y="86.0" font-size="15" fill="#6B7686" font-weight="700" text-anchor="middle" dominant-baseline="central">nom masculin</text>
<line x1="362.0" y1="52.0" x2="468.0" y2="52.0" stroke="#c9c6bb" stroke-width="2" stroke-linecap="round"/>
<line x1="362.0" y1="68.0" x2="468.0" y2="68.0" stroke="#c9c6bb" stroke-width="2" stroke-linecap="round"/>
<line x1="362.0" y1="84.0" x2="468.0" y2="84.0" stroke="#c9c6bb" stroke-width="2" stroke-linecap="round"/>
<text x="20.0" y="58.0" font-size="16" fill="#6B7686" font-weight="700" text-anchor="start" dominant-baseline="central">Sa nature,</text>
<text x="20.0" y="78.0" font-size="15" fill="#6B7686" font-weight="600" text-anchor="start" dominant-baseline="central">écrite dans le</text>
<text x="20.0" y="96.0" font-size="15" fill="#6B7686" font-weight="600" text-anchor="start" dominant-baseline="central">dictionnaire :</text>
<rect x="33.9" y="193.7" width="91.4" height="32.6" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.6"/>
<text x="39.9" y="210.0" font-size="21" fill="#1D4E89" font-weight="600" text-anchor="start" dominant-baseline="central">Le chat</text>
<text x="129.3" y="210.0" font-size="21" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">dort sur le canapé.</text>
<text x="404.8" y="210.0" font-size="21" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Mia caresse</text>
<rect x="535.7" y="193.7" width="85.4" height="32.6" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="541.7" y="210.0" font-size="21" fill="#2B8A3E" font-weight="600" text-anchor="start" dominant-baseline="central">le chat</text>
<text x="623.2" y="210.0" font-size="21" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">.</text>
<path d="M230.0 116.0 Q134.8 152.0 99.6 188.0" fill="none" stroke="#6B7686" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<path d="M300.0 116.0 Q469.2 152.0 578.4 188.0" fill="none" stroke="#6B7686" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="250.0" y="140.0" font-size="15" fill="#6B7686" font-weight="700" text-anchor="middle" dominant-baseline="central">nom</text>
<text x="450.0" y="140.0" font-size="15" fill="#6B7686" font-weight="700" text-anchor="middle" dominant-baseline="central">nom</text>
<text x="79.6" y="250.0" font-size="20" fill="#1D4E89" font-weight="800" text-anchor="middle" dominant-baseline="central">sujet</text>
<text x="100.0" y="272.0" font-size="14" fill="#1D4E89" font-weight="600" text-anchor="middle" dominant-baseline="central">(qui est-ce qui dort ?)</text>
<text x="578.4" y="250.0" font-size="20" fill="#2B8A3E" font-weight="800" text-anchor="middle" dominant-baseline="central">COD</text>
<text x="578.4" y="272.0" font-size="14" fill="#2B8A3E" font-weight="600" text-anchor="middle" dominant-baseline="central">(Mia caresse qui ?)</text>
<line x1="340.0" y1="180.0" x2="340.0" y2="290.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="20.0" y1="300.0" x2="660.0" y2="300.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="340.0" y="328.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#6B7686" font-weight="800">Nature : </tspan><tspan fill="#1a1a18">nom, dans les deux phrases. </tspan><tspan fill="#6B7686" font-weight="700">Elle ne change jamais.</tspan></text>
<text x="340.0" y="360.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="800">Fonction : </tspan><tspan fill="#1D4E89" font-weight="800">sujet</tspan><tspan fill="#1a1a18"> ici, </tspan><tspan fill="#2B8A3E" font-weight="800">COD</tspan><tspan fill="#1a1a18"> là. </tspan><tspan fill="#1a1a18" font-weight="700">Elle dépend de la phrase.</tspan></text>
<text x="340.0" y="388.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Gris = la nature (ce que le mot est). Couleur = la fonction (son rôle dans la phrase).</text>
</svg>
