<text x="586.0" y="68.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Demain...</text>
<text x="586.0" y="104.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">je </tspan><tspan fill="#185FA5">joue</tspan><tspan fill="#C2410C">r</tspan><tspan fill="#2F6B12">ai</tspan></text>
<text x="586.0" y="136.0" font-size="16" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">au tennis</text>
<text x="586.0" y="170.0" font-size="13.5" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">plus tard</text>
<line x1="586.0" y1="190.0" x2="586.0" y2="236.0" stroke="#9a998f" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="586.0" cy="244.0" r="6" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<rect x="14.0" y="228.0" width="328.0" height="32.0" rx="8" fill="#EFEDE6" stroke="none" stroke-width="1.5"/>
<rect x="508.0" y="228.0" width="158.0" height="32.0" rx="8" fill="#E6F1FB" stroke="none" stroke-width="1.5"/>
<line x1="20.0" y1="244.0" x2="666.0" y2="244.0" stroke="#1a1a18" stroke-width="3" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="178.0" y="278.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">le passé</text>
