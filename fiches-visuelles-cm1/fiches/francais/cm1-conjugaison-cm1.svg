<text x="586.0" y="278.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">le futur</text>
<line x1="424.0" y1="230.0" x2="424.0" y2="258.0" stroke="#A32D2D" stroke-width="3" stroke-linecap="round"/>
<rect x="14.0" y="302.0" width="652.0" height="108.0" rx="10" fill="#FAFAF7" stroke="#d6d4cc" stroke-width="1"/>
<rect x="36.0" y="321.0" width="18.0" height="18.0" rx="4" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<text x="64.0" y="329.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">le radical</text>
<text x="64.0" y="348.0" font-size="13.5" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">jou-, joue-</text>
<rect x="356.0" y="321.0" width="18.0" height="18.0" rx="4" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="384.0" y="329.0" font-size="15" fill="#C2410C" font-weight="700" text-anchor="start" dominant-baseline="central">la marque de temps</text>
<text x="384.0" y="348.0" font-size="13.5" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">ai ou i (imparfait), r (futur)</text>
<rect x="36.0" y="367.0" width="18.0" height="18.0" rx="4" fill="#2F6B12" stroke="none" stroke-width="1.5"/>
<text x="64.0" y="375.0" font-size="15" fill="#2F6B12" font-weight="700" text-anchor="start" dominant-baseline="central">la marque de personne</text>
<text x="64.0" y="394.0" font-size="13.5" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">s, e, ai, ons, ez, ent...</text>
<rect x="356.0" y="367.0" width="18.0" height="18.0" rx="4" fill="#6D28D9" stroke="none" stroke-width="1.5"/>
<text x="384.0" y="375.0" font-size="15" fill="#6D28D9" font-weight="700" text-anchor="start" dominant-baseline="central">l'auxiliaire</text>
<text x="384.0" y="394.0" font-size="13.5" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">avoir ou être, au présent</text>
</svg>
