<text x="424.0" y="136.0" font-size="16" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">au basket</text>
<text x="424.0" y="170.0" font-size="13.5" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">en ce moment</text>
<line x1="424.0" y1="190.0" x2="424.0" y2="236.0" stroke="#9a998f" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/>
