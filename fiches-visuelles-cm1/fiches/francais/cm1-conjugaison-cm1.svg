<text x="258.0" y="68.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Hier...</text>
<text x="258.0" y="104.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">j'</tspan><tspan fill="#6D28D9">ai</tspan><tspan fill="#1a1a18"> joué</tspan></text>
<text x="258.0" y="136.0" font-size="16" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">au foot</text>
<text x="258.0" y="170.0" font-size="13.5" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">c'est fini</text>
