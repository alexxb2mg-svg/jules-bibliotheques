<text x="96.0" y="136.0" font-size="16" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">aux billes</text>
<text x="96.0" y="170.0" font-size="13.5" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">une habitude</text>
