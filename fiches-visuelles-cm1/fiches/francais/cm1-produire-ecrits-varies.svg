<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg"><title>Cinq écrits côte à côte : récit, recette, lettre, affiche, compte rendu</title>
<text x="20.0" y="10.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Un récit</text>
<text x="224.0" y="10.0" font-size="13" fill="#7048E8" font-weight="700" text-anchor="end" dominant-baseline="central">raconter</text>
<rect x="20.0" y="24.0" width="204.0" height="170.0" rx="4" fill="#FFFFFF" stroke="#b9b6aa" stroke-width="1.2"/>
<text x="122.0" y="44.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">La cabane</tspan></text>
<text x="32.0" y="64.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Mercredi, Tom et Lila</tspan></text>
<text x="32.0" y="82.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">partent dans le bois.</tspan></text>
<text x="32.0" y="100.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">D'abord</tspan><tspan fill="#1a1a18">, ils ramassent</tspan></text>
<text x="32.0" y="118.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">des branches. </tspan><tspan fill="#D9480F" font-weight="700">Ensuite</tspan><tspan fill="#1a1a18">,</tspan></text>
<text x="32.0" y="136.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">ils font un toit. </tspan><tspan fill="#D9480F" font-weight="700">Enfin</tspan><tspan fill="#1a1a18">,</tspan></text>
<text x="32.0" y="154.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">il pleut, mais la cabane</tspan></text>
<text x="32.0" y="172.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">tient bon !</tspan></text>
<text x="122.0" y="204.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">un titre · les faits dans l'ordre</text>
<text x="122.0" y="218.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">d'abord, ensuite, enfin</text>
<text x="238.0" y="10.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Une recette</text>
<text x="442.0" y="10.0" font-size="13" fill="#1D4E89" font-weight="700" text-anchor="end" dominant-baseline="central">expliquer</text>
<rect x="238.0" y="24.0" width="204.0" height="170.0" rx="4" fill="#FFFFFF" stroke="#b9b6aa" stroke-width="1.2"/>
<text x="340.0" y="44.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Salade de fruits</tspan></text>
<text x="250.0" y="64.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Ingrédients :</tspan></text>
<text x="250.0" y="82.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">- 2 pommes</tspan></text>
<text x="250.0" y="100.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">- 1 banane</tspan></text>
<text x="250.0" y="122.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Étapes :</tspan></text>
<text x="250.0" y="140.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">1. </tspan><tspan fill="#1a1a18">Épluche les fruits.</tspan></text>
<text x="250.0" y="158.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">2. </tspan><tspan fill="#1a1a18">Coupe-les en dés.</tspan></text>
<text x="250.0" y="176.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">3. </tspan><tspan fill="#1a1a18">Mélange tout.</tspan></text>
<text x="340.0" y="204.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">un titre · la liste de ce qu'il faut</text>
<text x="340.0" y="218.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">des étapes numérotées</text>
<text x="456.0" y="10.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Une lettre</text>
<text x="660.0" y="10.0" font-size="13" fill="#7048E8" font-weight="700" text-anchor="end" dominant-baseline="central">raconter</text>
<rect x="456.0" y="24.0" width="204.0" height="170.0" rx="4" fill="#FFFFFF" stroke="#b9b6aa" stroke-width="1.2"/>
<text x="648.0" y="44.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="end" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Nice, le 12 mars</tspan></text>
<text x="468.0" y="66.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Chère Mamie,</tspan></text>
<text x="468.0" y="88.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Hier, en classe de mer,</tspan></text>
<text x="468.0" y="106.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">j'ai vu des dauphins !</tspan></text>
<text x="468.0" y="124.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Je te montrerai mes</tspan></text>
<text x="468.0" y="142.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">photos dimanche.</tspan></text>
<text x="468.0" y="162.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Grosses bises,</tspan></text>
<text x="648.0" y="178.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="end" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Nina</tspan></text>
<text x="558.0" y="204.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">le lieu et la date · « Chère… »</text>
<text x="558.0" y="218.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">une formule de fin · la signature</text>
<text x="20.0" y="252.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Une affiche</text>
<text x="224.0" y="252.0" font-size="13" fill="#2B8A3E" font-weight="700" text-anchor="end" dominant-baseline="central">informer</text>
<rect x="20.0" y="266.0" width="204.0" height="170.0" rx="4" fill="#FFF8E6" stroke="#b9b6aa" stroke-width="1.2"/>
<text x="122.0" y="296.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">GRANDE</text>
<text x="122.0" y="322.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">KERMESSE</text>
<text x="122.0" y="352.0" font-size="14" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">samedi 13 juin, 14 h</text>
<text x="122.0" y="372.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">dans la cour de l'école</text>
<ellipse cx="82" cy="398" rx="10" ry="13" fill="#E03131" stroke="none"/>
<path d="M82 411 Q78 420 82 430" fill="none" stroke="#6B7686" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="122" cy="398" rx="10" ry="13" fill="#1971C2" stroke="none"/>
<path d="M122 411 Q118 420 122 430" fill="none" stroke="#6B7686" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="162" cy="398" rx="10" ry="13" fill="#2F9E44" stroke="none"/>
<path d="M162 411 Q158 420 162 430" fill="none" stroke="#6B7686" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="122.0" y="446.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">un titre en très gros · quand ? où ?</text>
<text x="122.0" y="460.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">peu de mots, lus de loin</text>
<text x="238.0" y="252.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Un compte rendu</text>
<text x="442.0" y="252.0" font-size="13" fill="#1D4E89" font-weight="700" text-anchor="end" dominant-baseline="central">expliquer</text>
<rect x="238.0" y="266.0" width="204.0" height="170.0" rx="4" fill="#FFFFFF" stroke="#b9b6aa" stroke-width="1.2"/>
<text x="340.0" y="286.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Visite de la ferme</tspan></text>
<text x="250.0" y="310.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Ce que nous avons fait :</tspan></text>
<text x="250.0" y="330.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">- nourrir les poules</tspan></text>
<text x="250.0" y="350.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">- voir traire les vaches</tspan></text>
<text x="250.0" y="374.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">Ce que nous avons appris :</tspan></text>
<text x="250.0" y="394.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">- une poule pond presque</tspan></text>
<text x="250.0" y="414.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">un œuf par jour.</tspan></text>
<text x="340.0" y="446.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">un titre · ce qu'on a fait</text>
<text x="340.0" y="460.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">ce qu'on a appris</text>
<rect x="456.0" y="266.0" width="204.0" height="170.0" rx="8" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="470.0" y="292.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Je me demande :</text>
<text x="470.0" y="314.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">à quoi sert mon texte ?</text>
<text x="470.0" y="346.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#7048E8" font-weight="700">raconter</tspan><tspan fill="#1a1a18"> : récit, lettre</tspan></text>
<text x="470.0" y="372.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1D4E89" font-weight="700">expliquer</tspan><tspan fill="#1a1a18"> : recette,</tspan></text>
<text x="470.0" y="392.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">compte rendu</text>
<text x="470.0" y="420.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#2B8A3E" font-weight="700">informer</tspan><tspan fill="#1a1a18"> : affiche</tspan></text>
<text x="558.0" y="446.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">en orange : les marques</text>
<text x="558.0" y="460.0" font-size="12.5" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">qui font reconnaître l'écrit</text>
</svg>
