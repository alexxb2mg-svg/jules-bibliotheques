<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg"><title>La chaîne d'accords : le nom noyau commande le déterminant et les adjectifs</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g transform="translate(0,-24)">
<rect x="350.0" y="166.0" width="140.0" height="60.0" rx="12" fill="#E3F0D3" stroke="#2F6B12" stroke-width="2.5"/>
<text x="128.0" y="196.0" font-size="36" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#C2410C">les</tspan></text>
<text x="262.0" y="196.0" font-size="36" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">petit</tspan><tspan fill="#6D28D9">e</tspan><tspan fill="#C2410C">s</tspan></text>
<text x="420.0" y="196.0" font-size="36" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">souris</tspan></text>
<text x="574.0" y="196.0" font-size="36" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">gris</tspan><tspan fill="#6D28D9">e</tspan><tspan fill="#C2410C">s</tspan></text>
<path d="M362.0 164.0 C362.0 108.0 262.0 108.0 262.0 170.0" fill="none" stroke="#2F6B12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<path d="M412.0 164.0 C412.0 14.0 128.0 14.0 128.0 170.0" fill="none" stroke="#2F6B12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<path d="M470.0 164.0 C470.0 94.0 574.0 94.0 574.0 170.0" fill="none" stroke="#2F6B12" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="128.0" y="242.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">déterminant</text>
<text x="262.0" y="242.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">adjectif</text>
<text x="420.0" y="242.0" font-size="15" fill="#2F6B12" font-weight="700" text-anchor="middle" dominant-baseline="central">nom noyau</text>
<text x="574.0" y="242.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">adjectif</text>
<text x="128.0" y="266.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#C2410C">pluriel</tspan></text>
<text x="262.0" y="266.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#6D28D9">e</tspan><tspan fill="#1a1a18"> féminin, </tspan><tspan fill="#C2410C">s</tspan><tspan fill="#1a1a18"> pluriel</tspan></text>
<text x="420.0" y="266.0" font-size="14" fill="#2F6B12" font-weight="600" text-anchor="middle" dominant-baseline="central">donneur d'accord :</text>
<text x="420.0" y="285.0" font-size="14" fill="#2F6B12" font-weight="600" text-anchor="middle" dominant-baseline="central">féminin pluriel</text>
<text x="574.0" y="266.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#6D28D9">e</tspan><tspan fill="#1a1a18"> féminin, </tspan><tspan fill="#C2410C">s</tspan><tspan fill="#1a1a18"> pluriel</tspan></text>
<rect x="20.0" y="306.0" width="640.0" height="108.0" rx="10" fill="#FAFAF7" stroke="#d6d4cc" stroke-width="1"/>
<text x="40.0" y="326.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Au singulier, le même groupe :</text>
<text x="340.0" y="356.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#6D28D9">la</tspan><tspan fill="#1a1a18"> petit</tspan><tspan fill="#6D28D9">e</tspan><tspan fill="#1a1a18"> souris</tspan><tspan fill="#1a1a18"> gris</tspan><tspan fill="#6D28D9">e</tspan></text>
<text x="340.0" y="386.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">« souris » s'écrit pareil au singulier et au pluriel :</text>
<text x="340.0" y="403.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">ce sont les autres mots qui montrent le pluriel.</text>
</g>
</svg>
