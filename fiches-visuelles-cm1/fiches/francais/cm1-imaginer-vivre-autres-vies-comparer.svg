<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg"><title>Ce qui rapproche Léna de Rémi, et ce qui les sépare</title>
<circle cx="250.0" cy="190.0" r="160" fill="#FCEFD9" stroke="#854F0B" stroke-width="2.2"/>
<circle cx="430.0" cy="190.0" r="160" fill="#E6F1FB" stroke="#185FA5" stroke-width="2.2"/>
<path d="M340 58 A160 160 0 0 1 340 322 A160 160 0 0 1 340 58 Z" fill="#E4EED6" stroke="#3B6D11" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="200.0" y="60.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">RÉMI</text>
<text class="tl" x="470.0" y="66.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">LÉNA</text>
<text class="t" x="185.0" y="126.0" text-anchor="middle" dominant-baseline="central">marche des</text>
<text class="t" x="185.0" y="145.0" text-anchor="middle" dominant-baseline="central">kilomètres</text>
<text class="t" x="185.0" y="164.0" text-anchor="middle" dominant-baseline="central">chaque jour</text>
<text class="t" x="185.0" y="206.0" text-anchor="middle" dominant-baseline="central">dort dans</text>
<text class="t" x="185.0" y="225.0" text-anchor="middle" dominant-baseline="central">les granges</text>
<text class="t" x="185.0" y="244.0" text-anchor="middle" dominant-baseline="central">ou dehors</text>
<text class="t" x="185.0" y="280.0" text-anchor="middle" dominant-baseline="central">ne va pas</text>
<text class="t" x="185.0" y="299.0" text-anchor="middle" dominant-baseline="central">à l'école</text>
<text class="t" x="495.0" y="126.0" text-anchor="middle" dominant-baseline="central">prend le bus</text>
<text class="t" x="495.0" y="145.0" text-anchor="middle" dominant-baseline="central">pour l'école</text>
<text class="t" x="495.0" y="196.0" text-anchor="middle" dominant-baseline="central">vit avec</text>
<text class="t" x="495.0" y="215.0" text-anchor="middle" dominant-baseline="central">sa famille</text>
<text class="t" x="495.0" y="266.0" text-anchor="middle" dominant-baseline="central">dort dans</text>
<text class="t" x="495.0" y="285.0" text-anchor="middle" dominant-baseline="central">son lit</text>
<text class="th" x="340.0" y="120.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">aime</text>
<text class="th" x="340.0" y="139.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">son chien</text>
<text class="th" x="340.0" y="172.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">a peur de</text>
<text class="th" x="340.0" y="191.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">perdre</text>
<text class="th" x="340.0" y="210.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">ses amis</text>
<text class="th" x="340.0" y="252.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">aime la</text>
<text class="th" x="340.0" y="271.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">musique</text>
<text class="th" x="340.0" y="374.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">au milieu : je m'identifie, il me ressemble</text>
<text class="th" x="150.0" y="404.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">je m'en démarque :</text>
<text class="t" x="150.0" y="424.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">je découvre une autre vie</text>
<text class="th" x="530.0" y="404.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">ma vie à moi,</text>
<text class="t" x="530.0" y="424.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">aujourd'hui</text>
</svg>
