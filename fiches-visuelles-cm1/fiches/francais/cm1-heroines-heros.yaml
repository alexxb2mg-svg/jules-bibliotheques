notion: cm1-heroines-heros
titre: "Héroïnes et héros : une quête, des épreuves, et du courage malgré la peur"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 6", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: quete
    type: formule
    expression: "[le héros] veut [sa quête] ; [des alliés] l'aident, [des obstacles] le gênent"
    termes:
      "le héros": {couleur: bleu, legende: "le **personnage principal**, celui qu'on suit : le Petit Poucet, le plus petit de 7 frères."}
      "sa quête": {couleur: bleu, legende: "ce qu'il veut réussir, son but : ramener ses 6 frères sains et saufs à la maison."}
      "des alliés": {couleur: vert, legende: "ce qui l'**aide** : les cailloux blancs, la femme de l'ogre qui les cache, les bottes de sept lieues."}
      "des obstacles": {couleur: orange, legende: "ce qui le **gêne** : la forêt, les oiseaux qui mangent son pain, l'ogre."}
    jules: "Cette phrase marche pour presque tous les contes. Essaie avec Cendrillon : elle veut aller au bal, la fée l'aide, la belle-mère et ses filles la gênent."

  - id: carte
    type: carte
    noeuds:
      - {id: heros, titre: "Une héroïne, un héros", sous_titre: "le personnage qu'on suit et qu'on admire", principal: true}
      - {id: quete, titre: "Une quête", sous_titre: "un but : sauver, retrouver, réparer une injustice"}
      - {id: epreuves, titre: "Des épreuves", sous_titre: "des obstacles à franchir, qui le font changer"}
      - {id: fragilites, titre: "Des fragilités", sous_titre: "il peut avoir peur, douter, être petit ou faible"}
      - {id: valeurs, titre: "Des valeurs", sous_titre: "le courage, l'entraide, la justice, la loyauté"}
    liens:
      - {de: heros, vers: quete}
      - {de: heros, vers: epreuves}
      - {de: heros, vers: fragilites}
      - {de: heros, vers: valeurs}
    jules: "Un héros n'est pas un superhéros. Ce qui compte, c'est ce qu'il fait malgré ses faiblesses, et pourquoi il le fait."

  - id: schema-poucet
    type: schema
    titre: "Le Petit Poucet : le héros, sa quête, ceux qui l'aident et ceux qui le gênent"
    svg: "cm1-heroines-heros.svg"
    jules: "Sa vraie force ne se voit pas sur le dessin : c'est sa **ruse**. Il pense aux cailloux avant de partir, et il échange les bonnets de ses frères pour tromper l'ogre."

  - id: schema-epreuves
    type: schema
    titre: "Du plus petit au héros : les épreuves le transforment"
    svg: "cm1-heroines-heros-epreuves.svg"
    jules: "Au début, dans sa famille, on se moque de lui parce qu'il est tout petit. À la fin, c'est lui qui sauve tout le monde : c'est cette **transformation** qui fait le héros."

  - id: methode
    type: methode
    etapes:
      - "Trouve le **personnage principal** : celui qu'on suit du début à la fin. Que réussit-il ?"
      - "Cherche sa **motivation** : pourquoi agit-il ? Pour sauver quelqu'un, pour réparer une injustice, pour protéger sa famille…"
      - "Repère ses **fragilités** : un moment où il a peur, où il doute, où il est plus faible que les autres."
      - "Nomme la **valeur** qu'il défend (courage, entraide, justice, loyauté) et prouve-la avec une action précise du livre."
    jules: "Motivation, c'est le « pourquoi » du personnage. Le Petit Poucet ne va pas chez l'ogre pour s'amuser : il cherche un abri pour ses frères perdus dans la nuit."

  - id: piege
    type: piege
    mauvaise_idee: "Un vrai héros n'a jamais peur, il ne doute jamais et il est plus fort que tout le monde."
    pourquoi_faux: "Le Petit Poucet est le plus petit et le plus faible de sa famille. Il a peur dans la forêt et chez l'ogre. Pourtant, c'est lui le **héros** du conte."
    bonne_idee: "Le **courage**, ce n'est pas ne pas avoir peur : c'est agir malgré sa peur. Un héros a souvent une fragilité, et c'est ce qui le rend touchant."
    jules: "Deuxième piège : raconter seulement ce que fait le héros. Dis aussi pourquoi il le fait : c'est là qu'on voit ses valeurs."

  - id: exemple-gerda
    type: exemple
    situation: "Dans La Reine des neiges, un conte d'Andersen, un éclat de miroir magique entre dans l'œil et le cœur de Kay : il devient froid et méchant. La Reine des neiges l'emmène dans son palais de glace. Son amie Gerda, une petite fille, part seule à sa recherche. Est-ce une héroïne ?"
    calcul: "Sa quête : retrouver Kay. Sa motivation : l'**amitié**. Sa fragilité : elle est petite, seule, elle marche pieds nus dans le froid. Son action : elle ne renonce jamais, et ses larmes font fondre la glace dans le cœur de Kay."
    conclusion: "Oui, Gerda est une **héroïne** : fragile, mais fidèle à son ami jusqu'au bout. La valeur qu'elle porte, c'est la loyauté."
    jules: "Gerda n'a ni épée ni pouvoir magique. Son arme, c'est sa **fidélité** : elle montre qu'on peut être une héroïne sans être forte."

  - id: exemple-sami
    type: exemple
    situation: "Petit texte : « Sami avait peur du chien du voisin. Mais quand le chien a coincé sa petite sœur contre la grille, Sami s'est avancé en tremblant et a appelé le voisin. » Sami est-il un héros ?"
    calcul: "Sa fragilité : il a peur du chien. Sa motivation : protéger sa petite sœur. Son action : il s'avance quand même, en tremblant."
    conclusion: "Oui : sa peur ne l'empêche pas d'agir. Sami porte deux valeurs, le **courage** et l'**entraide**."
    jules: "Le petit détail « en tremblant » est important. L'auteur nous montre que Sami a peur, pour que son geste paraisse encore plus courageux."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : choisis le héros de ton livre préféré. Dessine son schéma comme celui du Petit Poucet, avec sa quête, ses alliés et ses obstacles."
