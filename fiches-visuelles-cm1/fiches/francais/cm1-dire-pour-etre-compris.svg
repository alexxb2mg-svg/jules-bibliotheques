<text x="506.0" y="206.0" font-size="13.5" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Je respire à chaque point.</text>
<text x="32.0" y="268.0" font-size="17" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">③ L'articulation</text>
<text x="42.0" y="324.0" font-size="30" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">hé</text>
