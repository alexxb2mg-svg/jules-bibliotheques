<text x="88.0" y="324.0" font-size="30" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">ris</text>
<path d="M86.0 346 Q106.8 362 127.6 346" fill="none" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="135.6" y="324.0" font-size="30" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">son</text>
<path d="M133.6 346 Q161.9 362 190.2 346" fill="none" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="204.2" y="316.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">3 syllabes,</text>
<text x="204.2" y="336.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">3 petits arcs</text>
<text x="32.0" y="394.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">J'ouvre bien la bouche : chaque</text>
<text x="32.0" y="416.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">syllabe s'entend, même la dernière.</text>
<text x="174.0" y="448.0" font-size="13.5" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Je ne « mange » pas les fins de mots.</text>
