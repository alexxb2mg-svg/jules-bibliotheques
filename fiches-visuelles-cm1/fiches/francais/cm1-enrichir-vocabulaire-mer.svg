<text x="488.0" y="62.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Aussi dans le thème :</text>
<text x="488.0" y="92.0" font-size="15" fill="#7048E8" font-weight="700" text-anchor="start" dominant-baseline="central">des verbes</text>
<text x="498.0" y="116.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">nager, naviguer,</text>
<text x="498.0" y="138.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">plonger</text>
<text x="488.0" y="170.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">des adjectifs</text>
<text x="498.0" y="194.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">salé, marin</text>
<text x="488.0" y="226.0" font-size="15" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">d'autres noms</text>
<text x="498.0" y="250.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">la marée, l'écume,</text>
<text x="498.0" y="272.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">le port, le marin</text>
<line x1="488.0" y1="296.0" x2="650.0" y2="296.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="488.0" y="322.0" font-size="14.5" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">Ces mots ne se</text>
<text x="488.0" y="342.0" font-size="14.5" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">ressemblent pas :</text>
<text x="488.0" y="366.0" font-size="14.5" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">ce n'est pas une</text>
<text x="488.0" y="386.0" font-size="14.5" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">famille, c'est un</text>
<text x="488.0" y="406.0" font-size="14.5" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">même thème.</text>
<text x="340.0" y="434.0" font-size="13.5" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">En bleu : les noms des choses qu'on voit sur le dessin.</text>
