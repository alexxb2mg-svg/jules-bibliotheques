<svg width="100%" viewBox="0 0 680 462" xmlns="http://www.w3.org/2000/svg"><title>Les déterminants changent avec le genre et le nombre du nom</title>
<g class="c-blue"><rect x="183.0" y="8" width="158" height="50" rx="8" stroke-width="0.8"/><text class="th" x="262" y="25" text-anchor="middle" dominant-baseline="central">masculin</text><text class="ts" x="262" y="44" text-anchor="middle" dominant-baseline="central">singulier</text></g>
<g class="c-purple"><rect x="348.0" y="8" width="158" height="50" rx="8" stroke-width="0.8"/><text class="th" x="427" y="25" text-anchor="middle" dominant-baseline="central">féminin</text><text class="ts" x="427" y="44" text-anchor="middle" dominant-baseline="central">singulier</text></g>
<g class="c-coral"><rect x="513.0" y="8" width="158" height="50" rx="8" stroke-width="0.8"/><text class="th" x="592" y="25" text-anchor="middle" dominant-baseline="central">pluriel</text><text class="ts" x="592" y="44" text-anchor="middle" dominant-baseline="central">masculin ou féminin</text></g>
<rect x="14.0" y="66.0" width="652.0" height="90.0" rx="10" fill="#FAFAF7" stroke="#e2e0d8" stroke-width="1"/>
<text x="24.0" y="111.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">les articles</text>
<text x="262.0" y="92.0" font-size="21" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">le, un</text>
<text x="427.0" y="92.0" font-size="21" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">la, une</text>
<text x="592.0" y="92.0" font-size="21" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">les, des</text>
<text class="ts" x="262.0" y="140.0" text-anchor="middle" dominant-baseline="central">le vélo</text>
<text class="ts" x="427.0" y="140.0" text-anchor="middle" dominant-baseline="central">la trousse</text>
<text class="ts" x="592.0" y="140.0" text-anchor="middle" dominant-baseline="central">les billes</text>
<rect x="14.0" y="164.0" width="652.0" height="122.0" rx="10" fill="#FAFAF7" stroke="#e2e0d8" stroke-width="1"/>
<text x="24.0" y="216.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">les possessifs</text>
<text class="ts" x="24.0" y="237.0" text-anchor="start" dominant-baseline="central">à qui est-ce ?</text>
<text x="262.0" y="190.0" font-size="21" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">mon, ton, son</text>
<text x="427.0" y="190.0" font-size="21" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">ma, ta, sa</text>
<text x="592.0" y="190.0" font-size="21" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">mes, tes, ses</text>
<text x="262.0" y="224.0" font-size="17" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">notre, votre, leur</text>
<text x="427.0" y="224.0" font-size="17" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">notre, votre, leur</text>
<text x="592.0" y="224.0" font-size="17" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">nos, vos, leurs</text>
<text class="ts" x="262.0" y="270.0" text-anchor="middle" dominant-baseline="central">mon vélo</text>
<text class="ts" x="427.0" y="270.0" text-anchor="middle" dominant-baseline="central">ma trousse</text>
<text class="ts" x="592.0" y="270.0" text-anchor="middle" dominant-baseline="central">mes billes</text>
<rect x="14.0" y="294.0" width="652.0" height="90.0" rx="10" fill="#FAFAF7" stroke="#e2e0d8" stroke-width="1"/>
<text x="24.0" y="330.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">les démonstratifs</text>
<text class="ts" x="24.0" y="351.0" text-anchor="start" dominant-baseline="central">on montre du doigt</text>
<text x="262.0" y="320.0" font-size="21" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">ce, cet</text>
<text x="427.0" y="320.0" font-size="21" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">cette</text>
<text x="592.0" y="320.0" font-size="21" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">ces</text>
<text class="ts" x="262.0" y="368.0" text-anchor="middle" dominant-baseline="central">ce vélo, cet ami</text>
<text class="ts" x="427.0" y="368.0" text-anchor="middle" dominant-baseline="central">cette trousse</text>
<text class="ts" x="592.0" y="368.0" text-anchor="middle" dominant-baseline="central">ces billes</text>
<rect x="14.0" y="394.0" width="652.0" height="62.0" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text x="340.0" y="410.0" font-size="15" fill="#854F0B" font-weight="700" text-anchor="middle" dominant-baseline="central">Devant une voyelle, le déterminant s'adapte pour bien se dire :</text>
<text x="340.0" y="436.0" font-size="19" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#6D28D9">mon</tspan><tspan fill="#1a1a18"> amie (pas « ma amie »)  ·  </tspan><tspan fill="#185FA5">cet</tspan><tspan fill="#1a1a18"> arbre  ·  </tspan><tspan fill="#6D28D9">l'</tspan><tspan fill="#1a1a18">école</tspan></text>
</svg>
