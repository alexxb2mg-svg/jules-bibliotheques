<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg"><title>Un texte préparé, découpé en groupes de souffle, avec les liaisons</title>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Un texte préparé au crayon : pauses et liaisons</text>
<rect x="16.0" y="44.0" width="648.0" height="268.0" rx="10" fill="#FFFDF6" stroke="#D9D4C3" stroke-width="1.2"/>
<text x="36.0" y="84.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Ce matin,</text>
<line x1="146.7" y1="97.0" x2="156.7" y2="69.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<text x="168.7" y="84.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">les</text>
<path d="M193.9 98 Q200.3 114 206.7 98" fill="none" stroke="#185FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200.3" y="116.0" font-size="14" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">z</text>
<text x="203.7" y="84.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">enfants attendent le car</text>
<line x1="460.6" y1="97.0" x2="470.6" y2="69.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<text x="36.0" y="134.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">devant l'école.</text>
<line x1="192.7" y1="147.0" x2="202.7" y2="119.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<line x1="201.7" y1="147.0" x2="211.7" y2="119.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<text x="223.7" y="134.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Il fait très froid.</text>
<line x1="393.7" y1="147.0" x2="403.7" y2="119.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<line x1="402.7" y1="147.0" x2="412.7" y2="119.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<rect x="420.7" y="118.0" width="97.4" height="32.0" rx="6" fill="#FBE7C2" stroke="#854F0B" stroke-width="1.5"/>
<text x="469.4" y="163.0" font-size="12.5" fill="#854F0B" font-weight="700" text-anchor="middle" dominant-baseline="central">on dit « meu-ssieu »</text>
<text x="424.7" y="134.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Monsieur</text>
<text x="528.9" y="134.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Martin,</text>
<line x1="613.7" y1="147.0" x2="623.7" y2="119.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<text x="36.0" y="184.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">le chauffeur,</text>
<line x1="177.6" y1="197.0" x2="187.6" y2="169.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<text x="199.6" y="184.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">est en retard.</text>
<line x1="347.9" y1="197.0" x2="357.9" y2="169.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<line x1="356.9" y1="197.0" x2="366.9" y2="169.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<text x="36.0" y="234.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Nina souffle dans ses mains</text>
<line x1="330.1" y1="247.0" x2="340.1" y2="219.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<text x="36.0" y="284.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">et</text>
<text x="62.7" y="284.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">ses</text>
<path d="M92.4 298 Q98.8 314 105.2 298" fill="none" stroke="#185FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98.8" y="316.0" font-size="14" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">z</text>
<text x="102.2" y="284.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">amis sautent sur place</text>
<line x1="344.3" y1="297.0" x2="354.3" y2="269.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<text x="366.3" y="284.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">pour se réchauffer.</text>
<line x1="569.6" y1="297.0" x2="579.6" y2="269.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<line x1="578.6" y1="297.0" x2="588.6" y2="269.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<line x1="40.0" y1="364.0" x2="50.0" y2="340.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<text x="64.0" y="344.0" font-size="15" fill="#C2410C" font-weight="700" text-anchor="start" dominant-baseline="central">petite pause</text>
<text x="64.0" y="363.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">virgule ou fin d'un groupe de mots</text>
<line x1="34.0" y1="414.0" x2="44.0" y2="390.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<line x1="43.0" y1="414.0" x2="53.0" y2="390.0" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
<text x="64.0" y="394.0" font-size="15" fill="#C2410C" font-weight="700" text-anchor="start" dominant-baseline="central">grande pause</text>
<text x="64.0" y="413.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">un point : la voix descend, je respire</text>
<path d="M350 346 Q364 362 378 346" fill="none" stroke="#185FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="364.0" y="366.0" font-size="14" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">z</text>
<text x="392.0" y="344.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">liaison : je relie les deux mots</text>
<text x="392.0" y="363.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">« les enfants » se dit « lé-zenfants »</text>
<rect x="348.0" y="388.0" width="30.0" height="24.0" rx="5" fill="#FBE7C2" stroke="#854F0B" stroke-width="1.5"/>
<text x="392.0" y="394.0" font-size="15" fill="#854F0B" font-weight="700" text-anchor="start" dominant-baseline="central">mot irrégulier, repéré avant</text>
<text x="392.0" y="413.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">il ne se lit pas comme il s'écrit</text>
</svg>
