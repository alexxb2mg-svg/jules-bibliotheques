<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg"><title>La même phrase lue avec un point, un point d'interrogation, un point d'exclamation</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">La même phrase, trois ponctuations, trois voix</text>
<rect x="14.0" y="60.0" width="652.0" height="100.0" rx="12" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<circle cx="52.0" cy="112.0" r="26" fill="#FFFFFF" stroke="#444441" stroke-width="2.5"/>
<text x="52.0" y="112.0" font-size="34" fill="#444441" font-weight="700" text-anchor="middle" dominant-baseline="central">.</text>
<text x="96.0" y="126.0" font-size="23" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Tu as mangé tout le gâteau.</text>
<path d="M96.0 86.0 C104.1 85.3 126.8 83.0 144.5 82.0 C162.2 81.0 181.2 80.0 202.2 80.0 C223.3 80.0 252.7 80.7 271.1 82.0 C289.5 83.3 296.5 85.3 312.7 88.0 C328.9 90.7 351.8 93.7 368.4 98.0 C385.0 102.3 404.9 111.3 412.2 114.0" fill="none" stroke="#444441" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<circle cx="468.0" cy="112.0" r="30" fill="#FFE9B8" stroke="#8a6d2b" stroke-width="1.8"/>
<circle cx="458.0" cy="106.0" r="3.2" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="478.0" cy="106.0" r="3.2" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<line x1="458.0" y1="124.0" x2="478.0" y2="124.0" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="round"/>
<text x="510.0" y="92.0" font-size="16" fill="#444441" font-weight="700" text-anchor="start" dominant-baseline="central">Je constate.</text>
<text x="510.0" y="114.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">La voix descend</text>
<text x="510.0" y="133.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">à la fin, calmement.</text>
<rect x="14.0" y="172.0" width="652.0" height="100.0" rx="12" fill="#E6F1FB" stroke="none" stroke-width="0"/>
<circle cx="52.0" cy="224.0" r="26" fill="#FFFFFF" stroke="#185FA5" stroke-width="2.5"/>
<text x="52.0" y="224.0" font-size="34" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">?</text>
<text x="96.0" y="238.0" font-size="23" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Tu as mangé tout le gâteau ?</text>
<path d="M96.0 204.0 C104.1 204.0 126.8 204.2 144.5 204.0 C162.2 203.8 181.2 203.2 202.2 203.0 C223.3 202.8 252.7 203.3 271.1 203.0 C289.5 202.7 296.5 202.5 312.7 201.0 C328.9 199.5 349.4 198.5 368.4 194.0 C387.3 189.5 416.7 177.3 426.4 174.0" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<circle cx="468.0" cy="224.0" r="30" fill="#FFE9B8" stroke="#8a6d2b" stroke-width="1.8"/>
<circle cx="458.0" cy="219.0" r="3.2" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="478.0" cy="219.0" r="3.2" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<path d="M452 210 Q458 204 464 209" fill="none" stroke="#1a1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M472 205 Q478 201 484 205" fill="none" stroke="#1a1a18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M460 237 Q470 232 478 236" fill="none" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="510.0" y="204.0" font-size="16" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Je demande.</text>
<text x="510.0" y="226.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">La voix monte</text>
<text x="510.0" y="245.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">sur le dernier mot.</text>
<rect x="14.0" y="284.0" width="652.0" height="100.0" rx="12" fill="#FAECE7" stroke="none" stroke-width="0"/>
<circle cx="52.0" cy="336.0" r="26" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.5"/>
<text x="52.0" y="336.0" font-size="34" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">!</text>
<text x="96.0" y="350.0" font-size="23" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Tu as mangé </text>
<text x="247.4" y="350.0" font-size="23" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">tout</text>
<text x="303.4" y="350.0" font-size="23" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">le gâteau !</text>
<path d="M96.0 306.0 C104.1 305.3 126.8 303.2 144.5 302.0 C162.2 300.8 181.2 302.3 202.2 299.0 C223.3 295.7 252.7 282.3 271.1 282.0 C289.5 281.7 296.5 294.8 312.7 297.0 C328.9 299.2 350.3 296.2 368.4 295.0 C386.4 293.8 412.2 290.8 421.0 290.0" fill="none" stroke="#C2410C" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<circle cx="468.0" cy="336.0" r="30" fill="#FFE9B8" stroke="#8a6d2b" stroke-width="1.8"/>
<circle cx="458.0" cy="330.0" r="4.2" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="478.0" cy="330.0" r="4.2" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<path d="M451 319 L463 317" fill="none" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M473 317 L485 319" fill="none" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="468" cy="349" rx="7" ry="8" fill="#1a1a18" stroke="none"/>
<text x="510.0" y="316.0" font-size="16" fill="#C2410C" font-weight="700" text-anchor="start" dominant-baseline="central">Je m'exclame.</text>
<text x="510.0" y="338.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">La voix est forte,</text>
<text x="510.0" y="357.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">j'appuie sur « tout ».</text>
<text x="340.0" y="404.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">La ligne au-dessus des mots : la mélodie de la voix. Plus elle est épaisse, plus on parle fort.</text>
</svg>
