notion: cm1-cours-moyen-sept-oeuvres
titre: "Au cours moyen, au moins sept œuvres complètes par an, de genres variés"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 3", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: regle
    type: formule
    expression: "[au moins 7] [œuvres complètes] par an, en [CM1 et en CM2]"
    termes:
      "au moins 7": {couleur: vert, legende: "sept, c'est le **minimum** : la classe peut en lire davantage"}
      "œuvres complètes": {couleur: bleu, legende: "des livres lus **en entier**, du début à la fin, pas des extraits"}
      "CM1 et en CM2": {couleur: orange, legende: "le **cours moyen** : les deux années de CM. La règle vaut chaque année."}
    jules: "C'est le programme qui demande aux enseignants de faire lire ces sept œuvres à la classe. Toi, tu les découvres en classe, et tu peux en lire d'autres chez toi."

  - id: carte
    type: carte
    noeuds:
      - {id: sept, titre: "7 œuvres complètes par an", sous_titre: "au cours moyen, lues avec la classe", principal: true}
      - {id: complete, titre: "Une œuvre complète", sous_titre: "le livre entier, pas un extrait d'une page"}
      - {id: genres, titre: "Des genres variés", sous_titre: "contes, récits, fables, poèmes, théâtre, albums, documentaires"}
      - {id: origine, titre: "Patrimoine et jeunesse", sous_titre: "des textes anciens et des livres récents"}
      - {id: facons, titre: "Quatre façons de lire", sous_titre: "offerte, à voix haute, silencieuse, enregistrée"}
    liens:
      - {de: sept, vers: complete}
      - {de: sept, vers: genres}
      - {de: sept, vers: origine}
      - {de: sept, vers: facons}
    jules: "Une **œuvre**, c'est un livre créé par un auteur : un roman, un recueil de poèmes, une pièce de théâtre. Le mot vient du latin « opera », qui veut dire « travail »."

  - id: schema-genres
    type: schema
    titre: "Les familles de livres citées par le programme, à reconnaître d'un coup d'œil"
    svg: "cm1-cours-moyen-sept-oeuvres.svg"
    jules: "Il y a sept familles et sept œuvres, mais ce n'est pas obligatoire d'en lire une de chaque. Le programme demande de la variété : pas seulement des contes, pas seulement des romans."

  - id: schema-lire
    type: schema
    titre: "Œuvre complète ou extrait, et quatre façons de lire en classe"
    svg: "cm1-cours-moyen-sept-oeuvres-lire.svg"
    jules: "La **lecture offerte**, c'est quand l'enseignant lit pour la classe : tu découvres ainsi des livres longs ou difficiles, que tu n'aurais pas pu lire seul. Ils comptent aussi comme œuvres lues."

  - id: methode
    type: methode
    etapes:
      - "Repère, au fil de l'année, les **œuvres complètes** étudiées en classe."
      - "Pour chacune, trouve son **genre** : conte, récit, fable, poème, théâtre, album ou documentaire."
      - "Note-les dans ton carnet de lecteur pour suivre la progression vers les **sept œuvres** de l'année."
    jules: "Pour trouver le genre, regarde la mise en page : des vers pour un poème, des noms de personnages en majuscules pour le théâtre, une morale pour une fable."

  - id: piege
    type: piege
    mauvaise_idee: "Cette année, on a lu en classe deux pages de « Pinocchio » : je compte « Pinocchio » dans mes sept œuvres."
    pourquoi_faux: "Deux pages, c'est un **extrait**, un morceau du livre. Une œuvre ne compte que si on l'a lue **en entier**."
    bonne_idee: "Si la classe lit ensuite tout le livre, chapitre après chapitre, alors « Pinocchio » devient une **œuvre complète** lue dans l'année."
    jules: "Autre piège : croire que sept contes suffisent. Sept œuvres toutes du même genre ne respectent pas l'idée du programme, qui veut des genres variés."

  - id: exemple-classe
    type: exemple
    situation: "En mai, la classe de CM1 de Yanis a lu en entier : un recueil de fables, un album, une pièce de théâtre, un roman, un recueil de poèmes et un documentaire sur les volcans. Où en est la classe ?"
    calcul: "Cela fait 6 œuvres complètes : 1 + 1 + 1 + 1 + 1 + 1 = 6. Il manque 7 − 6 = 1 œuvre. Les genres sont bien variés : six familles différentes."
    conclusion: "Il reste **1 œuvre** à lire d'ici juin, par exemple un recueil de contes. La classe aura alors lu **7 œuvres complètes** de genres variés."
    jules: "Un **recueil**, c'est un livre qui rassemble plusieurs textes courts du même genre : plusieurs fables, plusieurs contes ou plusieurs poèmes. Le recueil entier compte pour une œuvre."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : fais la liste des œuvres lues en entier en classe depuis la rentrée, et écris le genre de chacune. Tu verras combien de familles de livres tu as déjà rencontrées."
