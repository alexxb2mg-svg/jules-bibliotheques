<svg width="100%" viewBox="0 0 680 465" xmlns="http://www.w3.org/2000/svg"><title>La conjonction de coordination relie, l'adverbe précise le verbe et reste invariable</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="17" fill="#7048E8" font-weight="700" text-anchor="start" dominant-baseline="central">La conjonction de coordination : un pont entre deux groupes</text>
<text x="60.0" y="96.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">À la cantine, je prends</text>
<rect x="288.0" y="78.0" width="118.7" height="36.0" rx="8" fill="#F1EFE8" stroke="#6B7686" stroke-width="1.6"/>
<text x="294.0" y="96.0" font-size="22" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">des frites</text>
<text x="450.7" y="96.0" font-size="22" fill="#7048E8" font-weight="800" text-anchor="start" dominant-baseline="central">ou</text>
<rect x="522.3" y="78.0" width="120.3" height="36.0" rx="8" fill="#F1EFE8" stroke="#6B7686" stroke-width="1.6"/>
<text x="528.3" y="96.0" font-size="22" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">des pâtes</text>
<text x="644.6" y="96.0" font-size="22" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">.</text>
<path d="M347.3 76.0 Q464.5 32.0 582.4 76.0" fill="none" stroke="#7048E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="464.5" y1="54.0" x2="464.5" y2="80.0" stroke="#7048E8" stroke-width="2" stroke-linecap="round"/>
<text x="60.0" y="138.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Elle relie deux mots, deux groupes ou deux phrases qui ont le même rôle.</text>
<text x="60.0" y="168.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="600">Les six à connaître : </tspan><tspan fill="#7048E8" font-weight="800">mais, ou, et, or, ni, car</tspan></text>
<text x="60.0" y="194.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">Toutes invariables : elles ne changent jamais d'orthographe.</text>
<line x1="20.0" y1="222.0" x2="660.0" y2="222.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="246.0" font-size="17" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">L'adverbe : un mot qui précise le verbe, et qui ne change jamais</text>
<text x="60.0" y="314.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Tom</text>
<text x="126.2" y="314.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">court</text>
<rect x="198.8" y="295.4" width="56.2" height="37.2" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="203.8" y="314.0" font-size="24" fill="#2B8A3E" font-weight="600" text-anchor="start" dominant-baseline="central">vite</text>
<text x="257.9" y="314.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">.</text>
<text x="60.0" y="374.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Les filles</text>
<text x="182.5" y="374.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">courent</text>
<rect x="284.7" y="355.4" width="56.2" height="37.2" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="289.7" y="374.0" font-size="24" fill="#2B8A3E" font-weight="600" text-anchor="start" dominant-baseline="central">vite</text>
<text x="343.9" y="374.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">.</text>
<path d="M226.9 296.0 Q192.9 270.0 159.0 296.0" fill="none" stroke="#2B8A3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="253.9" y="278.0" font-size="14" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">court comment ?</text>
<text x="60.0" y="416.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">Un seul coureur ou plusieurs : vite ne bouge pas.</text>
<line x1="440.0" y1="270.0" x2="440.0" y2="425.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="560.0" y="272.0" font-size="15" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Compare avec</text>
<text x="560.0" y="292.0" font-size="15" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">un adjectif :</text>
<text x="560.0" y="338.0" font-size="19" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">Tom est rapide.</text>
<text x="560.0" y="384.0" font-size="19" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Elles sont rapide</tspan><tspan fill="#C92A2A" font-weight="800">s</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="560.0" y="416.0" font-size="15" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">l'adjectif s'accorde</text>
<text x="340.0" y="452.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Adverbes fréquents : vite, bien, mal, très, trop, souvent, toujours, jamais, hier, demain, ici…</text>
</svg>
