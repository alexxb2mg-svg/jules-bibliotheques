<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg"><title>La forme négative en sandwich autour du verbe, et la forme exclamative</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">La forme négative : ne… pas, en sandwich autour du verbe</text>
<text x="227.1" y="72.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Lina</text>
<text x="292.8" y="72.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">joue</text>
<text x="358.4" y="72.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">au foot.</text>
<line x1="292.8" y1="89.0" x2="344.4" y2="89.0" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round"/>
<text x="318.6" y="106.0" font-size="14" fill="#5f5e5a" font-weight="700" text-anchor="middle" dominant-baseline="central">verbe</text>
<path d="M340.0 118.0 L340.0 150.0" fill="none" stroke="#5f5e5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<rect x="219.5" y="158.0" width="48.1" height="44.0" rx="14" fill="#F7E3C0" stroke="#B7791F" stroke-width="2"/>
<rect x="351.5" y="158.0" width="62.6" height="44.0" rx="14" fill="#F7E3C0" stroke="#B7791F" stroke-width="2"/>
<text x="149.5" y="180.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Lina</text>
<text x="227.5" y="180.0" font-size="26" fill="#C92A2A" font-weight="700" text-anchor="start" dominant-baseline="central">ne</text>
<text x="281.6" y="180.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">joue</text>
<text x="359.5" y="180.0" font-size="26" fill="#C92A2A" font-weight="700" text-anchor="start" dominant-baseline="central">pas</text>
<text x="428.1" y="180.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">au foot.</text>
<line x1="281.6" y1="200.0" x2="337.5" y2="200.0" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round"/>
<path d="M219.5 210.0 Q219.5 218.0 229.5 218.0 L306.8 218.0 Q316.8 218.0 316.8 226.0 Q316.8 218.0 326.8 218.0 L404.1 218.0 Q414.1 218.0 414.1 210.0" fill="none" stroke="#C92A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="316.8" y="242.0" font-size="15" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">le verbe est pris entre ne et pas</text>
<text x="340.0" y="270.0" font-size="15" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Devant une voyelle, ne devient n' : Lina n'aime pas le foot.</text>
<text x="340.0" y="292.0" font-size="15" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Autres sandwichs : ne… jamais, ne… plus, ne… rien.</text>
<line x1="20.0" y1="322.0" x2="660.0" y2="322.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="344.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">La forme exclamative : une émotion forte</text>
<text x="340.0" y="380.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Lina joue au foot </tspan><tspan fill="#7048E8" font-weight="800">!</tspan></text>
<text x="340.0" y="408.0" font-size="15" fill="#7048E8" font-weight="600" text-anchor="middle" dominant-baseline="central">On crie sa joie ou sa surprise : la phrase finit par un point d'exclamation.</text>
</svg>
