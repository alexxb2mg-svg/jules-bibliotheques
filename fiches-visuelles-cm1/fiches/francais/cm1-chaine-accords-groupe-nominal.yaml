notion: cm1-chaine-accords-groupe-nominal
titre: "La chaîne d'accords : le nom noyau commande tout le groupe"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 18", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, guide fondamental « La grammaire du français du CP à la 6e », p. 99", url: "https://eduscol.education.gouv.fr/sites/default/files/document/guide-la-grammaire-du-francais-du-cp-la-6e-97251.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: essentiel
    type: formule
    expression: "[les] petit[es] [souris] gris[es]"
    termes:
      "souris": {couleur: vert, legende: "le **nom noyau** : c'est le **donneur d'accord**. Il est féminin pluriel, et il le transmet aux autres mots."}
      "les": {couleur: orange, legende: "le déterminant s'accorde avec le nom : les, car il y a plusieurs souris"}
      "es": {couleur: violet, legende: "les marques des adjectifs : e pour le féminin, s pour le pluriel"}
    jules: "« souris » ne change pas au pluriel, car il finit déjà par un s. Ce sont les autres mots du groupe qui montrent qu'il y en a plusieurs : les, petites, grises."

  - id: carte
    type: carte
    noeuds:
      - {id: chaine, titre: "La chaîne d'accords", sous_titre: "tous les mots du GN s'accordent avec le nom noyau", principal: true}
      - {id: noyau, titre: "Le nom noyau", sous_titre: "le donneur d'accord : il décide du genre et du nombre"}
      - {id: det, titre: "Le déterminant", sous_titre: "le, la, les, un, une, des, mon, ce... suit le nom"}
      - {id: adj, titre: "L'adjectif", sous_titre: "+ e au féminin, + s au pluriel : petit, petite, petits"}
      - {id: speciaux, titre: "Les pluriels spéciaux", sous_titre: "cheval → chevaux, gâteau → gâteaux, souris → souris"}
    liens:
      - {de: chaine, vers: noyau}
      - {de: chaine, vers: det}
      - {de: chaine, vers: adj}
      - {de: chaine, vers: speciaux}
    jules: "Imagine le nom noyau comme le chef d'une cordée en montagne : là où il va, tous les autres le suivent. S'il passe au féminin pluriel, le déterminant et les adjectifs passent au féminin pluriel avec lui."

  - id: schema-chaine
    type: schema
    titre: "Le nom noyau envoie son genre et son nombre aux autres mots du groupe"
    svg: "cm1-chaine-accords-groupe-nominal.svg"
    jules: "Les flèches partent toujours du nom, jamais de l'adjectif. Pour trouver le nom noyau, demande-toi de quoi on parle : ici, on parle des souris, pas de la couleur grise."

  - id: schema-formes
    type: schema
    titre: "Un groupe nominal sous ses quatre formes, et les pluriels spéciaux"
    svg: "cm1-chaine-accords-groupe-nominal-formes.svg"
    jules: "La plupart du temps, on ajoute juste e pour le féminin et s pour le pluriel. Les mots de la bande orange sont des exceptions : relis-les souvent, ils reviennent dans tes rédactions."

  - id: graphe-chaine
    type: graphe
    gabarit: chaine-accords
    curseurs:
      - {id: curseur-exemple, nom: exemple, min: 1, max: 3, pas: 1, depart: 1}
      - {id: curseur-genre, nom: genre, min: 0, max: 1, pas: 1, depart: 0}
      - {id: curseur-nombre, nom: nombre, min: 0, max: 1, pas: 1, depart: 0}
    lectures:
      - {si: "nombre == 1", texte: "Le **nom noyau** passe au pluriel : le déterminant et chaque adjectif prennent la **marque du pluriel**."}
      - {si: "genre == 1", texte: "Le nom noyau est féminin : les adjectifs prennent un **e** (petite, noire), parfois plus (belle, blanche, grosse)."}
      - {si: "exemple >= 2 && genre == 0 && nombre == 1", texte: "Mots spéciaux : cheval devient **chevaux**, beau devient **beaux** ; gros et gris finissent déjà par s, ils ne changent pas."}
      - {si: "genre == 0 && nombre == 0", texte: "Masculin singulier : **aucune marque**. Bouge genre ou nombre et suis chaque flèche."}
    jules: "Genre 1 veut dire féminin, nombre 1 veut dire pluriel. Toutes les flèches partent du nom noyau vert : c'est lui qui décide, et chaque mot au bout d'une flèche prend sa marque orange."

  - id: methode
    type: methode
    etapes:
      - "Trouve le **nom noyau** du groupe : c'est le mot dont on parle (les petites souris grises → souris)."
      - "Donne son **genre** et son **nombre** : masculin ou féminin ? singulier ou pluriel ? Mets « un » ou « une » devant pour t'aider."
      - "Relie le nom au **déterminant** avec une flèche, et accorde-le : le, la ou les ; mon, ma ou mes."
      - "Relie le nom à chaque **adjectif** et accorde-le : ajoute e au féminin, s au pluriel."
      - "Relis tout le groupe, mot par mot, avec le doigt : chaque mot doit porter les mêmes marques que le nom."
    jules: "Le petit dessin de flèches sur ton brouillon est une vraie méthode de grand : il t'oblige à regarder chaque mot. Avec l'habitude, tu le feras dans ta tête."

  - id: piege
    type: piege
    mauvaise_idee: "J'ai mis un s à « chaussures », c'est suffisant : « mes chaussures noir »."
    pourquoi_faux: "Le s ne se met pas qu'au nom : toute la **chaîne d'accords** doit suivre. **L'adjectif** noir dépend de chaussures, qui est féminin pluriel : il doit l'être aussi."
    bonne_idee: "mes chaussures noires : mes (pluriel), chaussures (féminin pluriel), noires (e du féminin + s du pluriel). Chaque mot porte la marque."
    jules: "À l'oral, on n'entend pas le e ni le s de « noires » : c'est pour ça qu'on les oublie. Ton oreille ne peut pas t'aider, alors ce sont tes flèches qui vérifient."

  - id: exemple-cheval
    type: exemple
    situation: "Au centre équestre, Maël écrit dans son carnet : « Je brosse le beau cheval blanc. » Le lendemain, il brosse trois chevaux. Comment écrire le groupe au pluriel ?"
    calcul: "Nom noyau : cheval, qui devient chevaux (-al devient -aux). Déterminant : le → les. Adjectifs : beau → beaux (-eau prend un x), blanc → blancs (+ s)."
    conclusion: "Je brosse les **beaux chevaux blancs**. Le nom, le déterminant et les deux adjectifs sont tous au masculin pluriel."
    jules: "Chevaux et beaux prennent un x, pas un s : c'est une marque du pluriel, elle aussi. Mais blanc suit la règle normale, avec un s."

  - id: exemple-trousse
    type: exemple
    situation: "Lou a un stylo vert. Sa sœur Jade a une règle de la même couleur. Comment écrire le groupe nominal avec « règle » et l'adjectif « vert » ?"
    calcul: "Nom noyau : règle, féminin singulier (on dit « une règle »). Déterminant : une. Adjectif : vert + e → verte."
    conclusion: "une **règle verte** : le déterminant et l'adjectif sont au féminin, comme le nom. Pour une gomme rose, rien ne change : rose finit déjà par e."
    jules: "Si un adjectif finit déjà par e au masculin (rose, rouge, jaune), il ne change pas au féminin. Tu n'ajoutes rien."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : décris ta chambre avec trois groupes nominaux (« le grand lit bleu »), puis mets-les au pluriel. Dessine les flèches qui partent du nom noyau."
