<svg width="100%" viewBox="0 0 680 452" xmlns="http://www.w3.org/2000/svg"><title>Avec l'auxiliaire être, le participe passé s'accorde avec le sujet</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="218.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">singulier</text>
<text x="512.0" y="18.0" font-size="17" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">pluriel</text>
<text x="10.0" y="72.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">masculin</text>
<text x="10.0" y="172.0" font-size="15" fill="#6D28D9" font-weight="700" text-anchor="start" dominant-baseline="central">féminin</text>
<rect x="100.0" y="30.0" width="236.0" height="84.0" rx="12" fill="#FFFFFF" stroke="#b9b7ae" stroke-width="1.4"/>
<text x="218.0" y="62.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">Tom</tspan><tspan fill="#854F0B"> est</tspan><tspan fill="#1a1a18"> tombé.</tspan></text>
<text x="218.0" y="94.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">rien à ajouter</text>
<rect x="356.0" y="30.0" width="312.0" height="84.0" rx="12" fill="#FFFFFF" stroke="#b9b7ae" stroke-width="1.4"/>
<text x="512.0" y="62.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">Les garçons</tspan><tspan fill="#854F0B"> sont</tspan><tspan fill="#1a1a18"> tombé</tspan><tspan fill="#C2410C">s</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="512.0" y="94.0" font-size="16" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">+ s</text>
<rect x="100.0" y="130.0" width="236.0" height="84.0" rx="12" fill="#FFFFFF" stroke="#b9b7ae" stroke-width="1.4"/>
<text x="218.0" y="162.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">Anna</tspan><tspan fill="#854F0B"> est</tspan><tspan fill="#1a1a18"> tombé</tspan><tspan fill="#6D28D9">e</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="218.0" y="194.0" font-size="16" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">+ e</text>
<rect x="356.0" y="130.0" width="312.0" height="84.0" rx="12" fill="#FFFFFF" stroke="#b9b7ae" stroke-width="1.4"/>
<text x="512.0" y="162.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">Les filles</tspan><tspan fill="#854F0B"> sont</tspan><tspan fill="#1a1a18"> tombé</tspan><tspan fill="#6D28D9">e</tspan><tspan fill="#C2410C">s</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="512.0" y="194.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#6D28D9">+ e</tspan><tspan fill="#C2410C"> + s</tspan></text>
<text x="340.0" y="238.0" font-size="16" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">avec l'auxiliaire </tspan><tspan fill="#854F0B">être</tspan><tspan fill="#1a1a18">, le participe passé s'accorde avec le </tspan><tspan fill="#185FA5">sujet</tspan></text>
<rect x="14.0" y="262.0" width="652.0" height="70.0" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="340.0" y="284.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">Léa et Hugo</tspan><tspan fill="#854F0B"> sont</tspan><tspan fill="#1a1a18"> parti</tspan><tspan fill="#C2410C">s</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="340.0" y="314.0" font-size="14" fill="#185FA5" font-weight="600" text-anchor="middle" dominant-baseline="central">Une fille et un garçon : on accorde au masculin pluriel.</text>
<rect x="14.0" y="346.0" width="652.0" height="96.0" rx="10" fill="#F1EFE8" stroke="#8a8980" stroke-width="1"/>
<text x="340.0" y="366.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Avec l'auxiliaire avoir : pas d'accord avec le sujet</text>
<text x="340.0" y="398.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">Anna</tspan><tspan fill="#854F0B"> a</tspan><tspan fill="#1a1a18"> mangé une pomme.</tspan><tspan fill="#5f5e5a">   ·   </tspan><tspan fill="#185FA5">Les filles</tspan><tspan fill="#854F0B"> ont</tspan><tspan fill="#1a1a18"> mangé.</tspan></text>
<text x="340.0" y="426.0" font-size="13.5" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">« mangé » reste pareil</text>
</svg>
