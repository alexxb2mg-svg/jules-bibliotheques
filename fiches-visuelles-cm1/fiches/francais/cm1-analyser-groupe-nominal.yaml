notion: cm1-analyser-groupe-nominal
titre: "Le groupe nominal : le nom noyau et ses adjectifs épithètes"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 18", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, guide fondamental « La grammaire du français du CP à la 6e », p. 75-76", url: "https://eduscol.education.gouv.fr/sites/default/files/document/guide-la-grammaire-du-francais-du-cp-la-6e-97251.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: modele
    type: formule
    expression: "[une] [grande] [maison] [blanche]"
    termes:
      une: {couleur: orange, legende: "le **déterminant** : il ouvre le groupe nominal"}
      grande: {couleur: vert, legende: "un adjectif placé avant le nom, sans préposition : il est **épithète**"}
      maison: {couleur: bleu, legende: "le **nom noyau** : le mot principal, celui dont on parle"}
      blanche: {couleur: vert, legende: "un autre adjectif épithète, placé après le nom"}
    jules: "Un seul groupe, un seul noyau : ici, on parle d'une maison. Grande et blanche disent comment elle est, une annonce qu'elle arrive."

  - id: carte
    type: carte
    noeuds:
      - {id: gn, titre: "Le groupe nominal", sous_titre: "un groupe de mots construit autour d'un nom", principal: true}
      - {id: det, titre: "Le déterminant", sous_titre: "le, une, mon, ce… : toujours au début"}
      - {id: noyau, titre: "Le nom noyau", sous_titre: "le mot principal : on ne peut pas l'enlever"}
      - {id: epithete, titre: "L'adjectif épithète", sous_titre: "collé au nom, avant ou après, sans préposition"}
    liens:
      - {de: gn, vers: det}
      - {de: gn, vers: noyau}
      - {de: gn, vers: epithete}
      - {de: epithete, vers: noyau, libelle: "précise"}
    jules: "Épithète vient d'un mot grec qui veut dire « ajouté » : l'adjectif épithète s'ajoute au nom, tout contre lui, sans petit mot entre les deux."

  - id: schema-boites
    type: schema
    titre: "Le groupe nominal « le petit chat noir » en boîtes, et l'accord commandé par le nom noyau"
    svg: "cm1-analyser-groupe-nominal.svg"
    jules: "Le noyau est le chef du groupe : s'il passe au féminin ou au pluriel, le déterminant et les adjectifs le suivent. C'est pour ça qu'il faut toujours le trouver avant d'accorder."

  - id: schema-constructions
    type: schema
    titre: "Trois constructions du groupe nominal, et le test pour trouver le nom noyau"
    svg: "cm1-analyser-groupe-nominal-constructions.svg"
    jules: "Petit, grand, gros, beau, joli, jeune, vieux se placent souvent avant le nom. Les couleurs et les formes (rouge, rond) se placent presque toujours après."

  - id: methode
    type: methode
    etapes:
      - "Repère le **déterminant** (le, un, mon, ce…) : c'est souvent là que le groupe nominal commence."
      - "Trouve le **nom noyau** : c'est le mot qu'on ne peut pas enlever. Demande-toi « de quoi parle-t-on ? »"
      - "Cherche les adjectifs collés au nom, avant ou après : ce sont des **épithètes**."
      - "Nomme la construction : déterminant + nom, déterminant + nom + adjectif, ou déterminant + adjectif + nom."
    jules: "Pour vérifier le noyau, enlève les autres mots un par un. Tant que le groupe veut encore dire quelque chose, le noyau est toujours là."

  - id: piege
    type: piege
    mauvaise_idee: "Dans « le petit chat noir », le seul adjectif épithète est noir, celui qui est après le nom."
    pourquoi_faux: "Petit est aussi un adjectif, et il est lui aussi directement relié au nom chat. Il est **épithète**, même s'il est placé avant."
    bonne_idee: "Noyau : **chat**. Adjectifs épithètes : petit (avant le nom) et noir (après le nom). Déterminant : le."
    jules: "Autre erreur fréquente : prendre l'adjectif pour le noyau. Dans « un gros ballon », on parle d'un ballon, pas d'un gros : le noyau, c'est ballon."

  - id: exemple-cour
    type: exemple
    situation: "Dans la cour, un grand garçon blond lance un ballon rouge. Trouve les trois groupes nominaux, leur noyau et leurs adjectifs épithètes."
    calcul: "La cour : déterminant + nom, noyau **cour**. Un grand garçon blond : déterminant + adjectif + nom + adjectif, noyau **garçon**. Un ballon rouge : déterminant + nom + adjectif, noyau **ballon**."
    conclusion: "Trois groupes nominaux. Les adjectifs épithètes sont grand et blond (pour garçon), puis rouge (pour ballon)."
    jules: "Un nom peut avoir deux épithètes en même temps, une de chaque côté : un grand garçon blond."

  - id: exemple-chien
    type: exemple
    situation: "Emma veut décrire son chien dans sa rédaction. Elle part du groupe nominal « un chien ». Enrichis-le avec un adjectif avant et un adjectif après."
    calcul: "On garde le noyau chien. On ajoute un adjectif avant, comme petit, et un adjectif après, comme noir : déterminant + adjectif + nom + adjectif."
    conclusion: "« Un **petit chien noir** » : le noyau reste chien, petit et noir sont épithètes."
    jules: "Si le chien est une chienne, tout le groupe change : une petite chienne noire. C'est le noyau qui décide."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Jeu du portrait : décris un objet de ta trousse avec un groupe nominal à deux épithètes, comme « un vieux crayon bleu ». Ton voisin doit le retrouver."
