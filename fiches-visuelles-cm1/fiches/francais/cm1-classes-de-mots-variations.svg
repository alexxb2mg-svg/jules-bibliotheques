<svg width="100%" viewBox="0 0 680 418" xmlns="http://www.w3.org/2000/svg"><title>Une même phrase au pluriel puis au féminin : les mots variables changent, l'adverbe reste</title>
<g transform="translate(0,-34)">
<rect x="104.0" y="46.0" width="114.0" height="262.0" rx="10" fill="#F7FAFD" stroke="none" stroke-width="1.5"/>
<g class="c-blue"><rect x="108.0" y="50" width="106.0" height="34" rx="8" stroke-width="0.8"/><text class="th" x="161.0" y="67" text-anchor="middle" dominant-baseline="central">déterminant</text></g>
<rect x="222.0" y="46.0" width="102.0" height="262.0" rx="10" fill="#F7FAFD" stroke="none" stroke-width="1.5"/>
<g class="c-blue"><rect x="226.0" y="50" width="94.0" height="34" rx="8" stroke-width="0.8"/><text class="th" x="273.0" y="67" text-anchor="middle" dominant-baseline="central">adjectif</text></g>
<rect x="328.0" y="46.0" width="114.0" height="262.0" rx="10" fill="#F7FAFD" stroke="none" stroke-width="1.5"/>
<g class="c-blue"><rect x="332.0" y="50" width="106.0" height="34" rx="8" stroke-width="0.8"/><text class="th" x="385.0" y="67" text-anchor="middle" dominant-baseline="central">nom</text></g>
<rect x="446.0" y="46.0" width="102.0" height="262.0" rx="10" fill="#F7FAFD" stroke="none" stroke-width="1.5"/>
<g class="c-blue"><rect x="450.0" y="50" width="94.0" height="34" rx="8" stroke-width="0.8"/><text class="th" x="497.0" y="67" text-anchor="middle" dominant-baseline="central">verbe</text></g>
<rect x="552.0" y="46.0" width="118.0" height="262.0" rx="10" fill="#F1EFE8" stroke="none" stroke-width="1.5"/>
<g class="c-gray"><rect x="556.0" y="50" width="110.0" height="34" rx="8" stroke-width="0.8"/><text class="th" x="611.0" y="67" text-anchor="middle" dominant-baseline="central">adverbe</text></g>
<text x="10.0" y="115.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Au départ</text>
<text class="ts" x="10.0" y="135.0" text-anchor="start" dominant-baseline="central">un garçon</text>
<text x="161.0" y="124.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Mon</tspan></text>
<text x="273.0" y="124.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">petit</tspan></text>
<text x="385.0" y="124.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">voisin</tspan></text>
<text x="497.0" y="124.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">joue</tspan></text>
<text x="611.0" y="124.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#8a8980">souvent</tspan></text>
<text x="10.0" y="187.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Au pluriel</text>
<text class="ts" x="10.0" y="207.0" text-anchor="start" dominant-baseline="central">plusieurs</text>
<text x="161.0" y="196.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#C2410C">Mes</tspan></text>
<text x="273.0" y="196.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">petit</tspan><tspan fill="#C2410C">s</tspan></text>
<text x="385.0" y="196.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">voisin</tspan><tspan fill="#C2410C">s</tspan></text>
<text x="497.0" y="196.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">jou</tspan><tspan fill="#C2410C">ent</tspan></text>
<text x="611.0" y="196.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#8a8980">souvent</tspan></text>
<text x="10.0" y="259.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Au féminin</text>
<text class="ts" x="10.0" y="279.0" text-anchor="start" dominant-baseline="central">une fille</text>
<text x="161.0" y="268.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#6D28D9">Ma</tspan></text>
<text x="273.0" y="268.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">petit</tspan><tspan fill="#6D28D9">e</tspan></text>
<text x="385.0" y="268.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">voisin</tspan><tspan fill="#6D28D9">e</tspan></text>
<text x="497.0" y="268.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">joue</tspan></text>
<text x="611.0" y="268.0" font-size="25" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#8a8980">souvent</tspan></text>
<text class="ts" x="497.0" y="292.0" text-anchor="middle" dominant-baseline="central">pas de féminin</text>
<text class="ts" x="611.0" y="292.0" text-anchor="middle" dominant-baseline="central">toujours pareil</text>
<line x1="10.0" y1="160.0" x2="670.0" y2="160.0" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="10.0" y1="232.0" x2="670.0" y2="232.0" stroke="#dfe3e8" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<rect x="20.0" y="322.0" width="640.0" height="122.0" rx="10" fill="#FFFFFF" stroke="#d6d4cc" stroke-width="1"/>
<rect x="38.0" y="336.0" width="18.0" height="18.0" rx="4" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="66.0" y="345.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#C2410C">orange</tspan><tspan fill="#1a1a18"> : le mot change avec le </tspan><tspan fill="#C2410C">nombre</tspan><tspan fill="#1a1a18"> (singulier → pluriel)</tspan></text>
<rect x="38.0" y="364.0" width="18.0" height="18.0" rx="4" fill="#6D28D9" stroke="none" stroke-width="1.5"/>
<text x="66.0" y="373.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#6D28D9">violet</tspan><tspan fill="#1a1a18"> : le mot change avec le </tspan><tspan fill="#6D28D9">genre</tspan><tspan fill="#1a1a18"> (masculin → féminin)</tspan></text>
<rect x="38.0" y="392.0" width="18.0" height="18.0" rx="4" fill="#8a8980" stroke="none" stroke-width="1.5"/>
<text x="66.0" y="401.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#8a8980">gris</tspan><tspan fill="#1a1a18"> : mot </tspan><tspan fill="#8a8980">invariable</tspan><tspan fill="#1a1a18">, il ne change jamais (souvent, vite, très, dans, avec)</tspan></text>
<text x="38.0" y="429.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Le verbe change aussi avec la personne et le temps : nous jou</tspan><tspan fill="#C2410C">ons</tspan><tspan fill="#1a1a18">, je jou</tspan><tspan fill="#C2410C">ais</tspan><tspan fill="#1a1a18">.</tspan></text>
</g>
</svg>
