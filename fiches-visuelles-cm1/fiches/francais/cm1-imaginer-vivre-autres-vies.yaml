relecture: {statut: a_relire}
blocs:
  - id: deux-facons
    type: formule
    expression: "[s'identifier] : « comme moi » · [se démarquer] : « pas comme moi »"
    termes:
      "s'identifier": {couleur: vert, legende: "se reconnaître dans le personnage : Rémi aime son chien Capi, Léna aussi aime son chien. On **ressent** avec lui."}
      "se démarquer": {couleur: orange, legende: "voir ce qui est **différent** : Rémi marche des kilomètres et ne va pas à l'école. Léna découvre une vie qu'elle ne connaît pas."}
    jules: "Les deux font vivre une autre vie. Quand tu t'identifies, tu partages ses émotions ; quand tu te démarques, tu découvres un monde nouveau."

  - id: carte
    type: carte
    noeuds:
      - {id: lire, titre: "Vivre une autre vie en lisant", sous_titre: "entrer dans la vie d'un personnage", principal: true}
      - {id: univers, titre: "Un autre univers", sous_titre: "une autre époque, un autre pays, une île déserte"}
      - {id: place, titre: "Se mettre à sa place", sous_titre: "« à sa place, j'aurais eu peur, j'aurais… »"}
      - {id: pareil, titre: "S'identifier", sous_titre: "ce qui me ressemble chez lui"}
      - {id: different, titre: "Se démarquer", sous_titre: "ce qui est différent, et ce que ça m'apprend"}
    liens:
      - {de: lire, vers: univers}
      - {de: lire, vers: place}
      - {de: lire, vers: pareil}
      - {de: lire, vers: different}
    jules: "Pas besoin de ressembler au personnage pour aimer le livre. C'est souvent quand il est très différent de toi que le voyage est le plus beau."

  - id: schema-entrer
    type: schema
    titre: "Entrer dans la vie de Rémi : ce que Léna découvre en lisant Sans famille"
    svg: "cm1-imaginer-vivre-autres-vies.svg"
    jules: "Dans Sans famille, Rémi est un **enfant trouvé**. À 8 ans, il est confié à Vitalis, un vieux musicien qui voyage avec ses chiens et son singe."

  - id: schema-comparer
    type: schema
    titre: "Ce qui rapproche Léna de Rémi, et ce qui les sépare"
    svg: "cm1-imaginer-vivre-autres-vies-comparer.svg"
    jules: "Le milieu du dessin, c'est là que tu t'identifies. Les côtés, c'est là que tu voyages : une vie sans école, sur les routes, il y a 150 ans."

  - id: methode
    type: methode
    etapes:
      - "Repère le **personnage principal** et son univers : quand vit-il, où, avec qui ?"
      - "Compare avec ta vie : cherche au moins une chose pareille et deux choses différentes."
      - "Mets-toi à sa place à un moment précis du livre. Écris au « je » : « À sa place, j'aurais… », « je me sentirais… »."
      - "Dis si tu **t'identifies** à lui ou si tu **te démarques**, et explique pourquoi avec un exemple du livre."
    jules: "Le « je » est un bon truc : il t'oblige à penser à ce que le personnage ressent, et pas seulement à ce qu'il fait."

  - id: piege
    type: piege
    mauvaise_idee: "Pour parler d'un personnage, je raconte l'histoire : « Rémi part avec Vitalis. Ils marchent. Ils jouent sur les places. »"
    pourquoi_faux: "Ça, c'est un **résumé**. On sait ce que fait Rémi, mais on ne sait pas ce que ça fait de vivre sa vie."
    bonne_idee: "J'ajoute **ce que je ressentirais** à sa place : « Si je devais quitter ma maison avec un inconnu, j'aurais le cœur serré. Heureusement, Capi le chien serait mon ami. »"
    jules: "Autre idée fausse : « Je n'ai jamais vécu ça, alors ce livre n'est pas pour moi. » Au contraire, un livre sert justement à vivre ce que tu n'as jamais vécu."

  - id: exemple-ile
    type: exemple
    situation: "Dans Deux ans de vacances, de Jules Verne, quinze garçons de 8 à 14 ans se retrouvent seuls sur une île, après que leur bateau a dérivé en mer. Yanis, 9 ans, lit le livre. Comment peut-il vivre leur vie ?"
    calcul: "Il se met à leur place la première nuit : « À leur place, j'aurais eu peur du noir et des bruits de la forêt. Mais j'aurais aussi aimé explorer l'île et construire un abri. »"
    conclusion: "Yanis n'a jamais été naufragé, mais il **se projette** dans leur vie : il ressent leur peur et leur envie d'aventure."
    jules: "Un naufragé, c'est quelqu'un dont le bateau a fait naufrage : il a été perdu ou détruit en mer. Les garçons de Jules Verne s'organisent pour survivre, un peu comme une classe sans maîtresse."

  - id: exemple-lettres
    type: exemple
    situation: "Rémi n'est jamais allé à l'école. Vitalis lui apprend à lire avec des lettres gravées sur de petits morceaux de bois, pendant les pauses sur la route. Maëlle, qui apprend à lire en classe, s'identifie-t-elle ou se démarque-t-elle ?"
    calcul: "Pareil : Rémi apprend à lire, comme Maëlle l'a fait. Différent : pas de classe, pas de cahier, pas de maîtresse, des lettres en bois au bord du chemin."
    conclusion: "Les deux à la fois : Maëlle **s'identifie** à l'enfant qui apprend, et **se démarque** de sa vie sans école. Elle découvre qu'autrefois tous les enfants n'allaient pas en classe."
    jules: "Comparer, c'est la clé : sans la ressemblance, on ne s'attache pas au personnage ; sans la différence, on n'apprend rien de nouveau."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine deux cercles qui se croisent, comme pour Rémi et Léna, avec le héros de ton livre et toi. Remplis le milieu en premier."
