notion: cm1-volume-annuel-lectures
titre: "Mes lectures de l'année de CM1 : 2 œuvres du patrimoine et 5 livres de jeunesse, au moins"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 3-4", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: objectif
    type: formule
    expression: "[2 œuvres du patrimoine] + [5 ouvrages de jeunesse] = [7 livres] au moins"
    termes:
      "2 œuvres du patrimoine": {couleur: orange, legende: "des textes **anciens**, connus depuis longtemps : des fables, des contes… Au moins 2 dans l'année."}
      "5 ouvrages de jeunesse": {couleur: bleu, legende: "des livres de **littérature de jeunesse** : plus récents, écrits pour les enfants. Au moins 5 dans l'année."}
      "7 livres": {couleur: vert, legende: "le minimum de l'année de CM1, fixé par le **programme officiel**. Tu peux en lire bien plus !"}
    jules: "Les deux nombres comptent chacun de leur côté : 7 livres de jeunesse ne remplacent pas les 2 œuvres du patrimoine. Il faut au moins 2 d'un côté, et au moins 5 de l'autre."

  - id: carte
    type: carte
    noeuds:
      - {id: annee, titre: "Mes lectures de CM1", sous_titre: "un nombre de livres fixé par le programme", principal: true}
      - {id: patrimoine, titre: "Au moins 2 œuvres du patrimoine", sous_titre: "des textes anciens et connus : fables, contes"}
      - {id: jeunesse, titre: "Au moins 5 livres de jeunesse", sous_titre: "des livres récents, écrits pour les enfants"}
      - {id: trace, titre: "Garder une trace", sous_titre: "un carnet ou une liste : titre, auteur, avis"}
      - {id: partager, titre: "Partager", sous_titre: "en parler en classe, conseiller un livre"}
    liens:
      - {de: annee, vers: patrimoine}
      - {de: annee, vers: jeunesse}
      - {de: annee, vers: trace}
      - {de: annee, vers: partager}
    jules: "Le **patrimoine**, c'est ce qu'on reçoit des générations d'avant, comme une maison de famille. Les fables de La Fontaine, tes grands-parents les ont lues aussi."

  - id: schema-etagere
    type: schema
    titre: "L'étagère de l'année : 2 livres du patrimoine, 5 livres de jeunesse, et plus si tu veux"
    svg: "cm1-volume-annuel-lectures.svg"
    jules: "Les Fables de La Fontaine et les Contes de Perrault ont été écrits il y a plus de 300 ans : ce sont des œuvres du patrimoine. Les livres bleus sont des exemples de genres de jeunesse."

  - id: schema-calendrier
    type: schema
    titre: "Le calendrier de lecture de Léa : ce qui est lu, ce qui reste à lire"
    svg: "cm1-volume-annuel-lectures-calendrier.svg"
    jules: "Un livre par mois environ, de septembre à juin, et l'objectif est atteint sans effort. Le calendrier montre aussi les mois où l'on a oublié de lire, comme décembre pour Léa."

  - id: methode
    type: methode
    etapes:
      - "Note **chaque livre** lu dans ton carnet ou sur une liste, avec la date."
      - "Écris à côté si c'est une **œuvre du patrimoine** ou un **livre de jeunesse**."
      - "Compte régulièrement : combien de chaque sorte ? Combien en manque-t-il ?"
      - "Partage tes lectures : un petit résumé à l'oral, un conseil à un camarade."
    jules: "Si tu hésites sur la sorte d'un livre, regarde la date où il a été écrit, ou demande à ton enseignant : un texte connu depuis des siècles est du patrimoine."

  - id: piege
    type: piege
    mauvaise_idee: "Sofia a lu 9 romans de jeunesse depuis la rentrée : elle pense avoir dépassé l'objectif de 7 livres."
    pourquoi_faux: "Elle a bien plus de 5 livres de jeunesse, mais **aucune œuvre du patrimoine**. L'objectif n'est pas seulement un total : il faut les deux sortes."
    bonne_idee: "Il manque encore **2 œuvres du patrimoine** à Sofia, par exemple un recueil de fables et un recueil de contes."
    jules: "Varier, c'est aussi le but : lire seulement des romans de jeunesse, ou seulement des contes anciens, c'est passer à côté de la moitié des découvertes."

  - id: exemple-lea
    type: exemple
    situation: "En février, Léa a lu 1 œuvre du patrimoine et 3 ouvrages de littérature de jeunesse. A-t-elle atteint l'objectif de l'année ?"
    calcul: "Patrimoine : il faut au moins 2, elle en a 1. 2 − 1 = 1. Jeunesse : il faut au moins 5, elle en a 3. 5 − 3 = 2."
    conclusion: "Pas encore : il lui manque **1 œuvre du patrimoine** et **2 livres de jeunesse**, soit 3 livres. Il lui reste 4 mois : c'est tout à fait possible."
    jules: "Calcule toujours séparément pour chaque sorte de livre, puis additionne ce qui manque : 1 + 2 = 3 livres."

  - id: exemple-tom
    type: exemple
    situation: "En juin, Tom compte les livres de sa liste : 3 œuvres du patrimoine et 6 livres de jeunesse. A-t-il atteint l'objectif ?"
    calcul: "Patrimoine : 3, c'est plus que 2. Jeunesse : 6, c'est plus que 5. En tout : 3 + 6 = 9 livres."
    conclusion: "Oui : Tom a atteint l'objectif dans les deux sortes, et il a même lu **9 livres**, 2 de plus que le minimum."
    jules: "« Au moins », ça veut dire « pas moins que » : c'est un minimum, jamais un maximum. Rien ne t'empêche d'en lire 15 !"

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine ton étagère de l'année au dos de ton carnet de lecteur. Colorie un livre chaque fois que tu en finis un, d'une couleur pour le patrimoine et d'une autre pour la jeunesse."
