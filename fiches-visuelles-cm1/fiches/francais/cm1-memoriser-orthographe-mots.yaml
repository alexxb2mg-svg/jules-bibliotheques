  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 14", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 11-12", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: ecrire, titre: "Bien écrire un mot fréquent", sous_titre: "on s'appuie sur ce qu'on sait déjà", principal: true}
      - {id: famille, titre: "Sa famille", sous_titre: "dent, dentiste, dentifrice : la même base s'écrit pareil"}
      - {id: muette, titre: "La lettre muette", sous_titre: "petit → petite : le mot de la famille la fait entendre"}
      - {id: groupe, titre: "Les mots d'un même groupe", sous_titre: "acteur → actrice, moniteur → monitrice"}
      - {id: coeur, titre: "Les mots à apprendre par cœur", sous_titre: "femme, beaucoup, aujourd'hui : pas de règle, on les photographie"}
    liens:
      - {de: ecrire, vers: famille}
      - {de: ecrire, vers: muette}
      - {de: ecrire, vers: groupe}
      - {de: ecrire, vers: coeur}
    jules: "Un mot n'est presque jamais tout seul : il a une famille, des cousins qui lui ressemblent. Quand tu hésites, appelle un membre de sa famille, il te soufflera la bonne lettre."

  - id: schema-muette
    type: schema
    titre: "Petit, gourmand, lait, progrès : la lettre muette s'entend dans un mot de la famille"
    svg: "cm1-memoriser-orthographe-mots.svg"
    jules: "Une lettre **muette** s'écrit mais ne se prononce pas. Le féminin (petite) ou un mot plus long (laitier) la fait sortir de son silence."

  - id: schema-familles
    type: schema
    titre: "L'arbre de la famille de dent, et la régularité -teur, -trice"
    svg: "cm1-memoriser-orthographe-mots-familles.svg"
    jules: "Attention, la régularité ne marche que pour les mots du même groupe : chanteur fait chanteuse, pas chantrice. Dans le doute, vérifie dans le dictionnaire."

  - id: methode
    type: methode
    etapes:
      - "Tu hésites sur la fin d'un mot ? Cherche son féminin ou un mot plus long de sa **famille** : la lettre muette s'entendra."
      - "Regarde si le mot ressemble à d'autres mots du même **groupe** : acteur, actrice ; moniteur, monitrice."
      - "Pour un mot sans règle, **photographie-le** : regarde-le, épelle-le à voix haute, cache-le, écris-le, puis compare avec le modèle."
      - "Relis ton texte en pointant chaque mot appris avec ton crayon."
    jules: "Découpe les longs mots en syllabes pour les apprendre : au-jour-d'hui, beau-coup. Et ces mots-là s'écrivent toujours pareil, sans e ni s ajoutés : ils sont invariables."

  - id: piege
    type: piege
    mauvaise_idee: "J'entends « gourman », alors j'écris : « Mon chat est gourman. »"
    pourquoi_faux: "La dernière lettre de ce mot est **muette** : on ne l'entend pas. Au féminin, gourmande, on l'entend : c'est un d."
    bonne_idee: "Mon chat est **gourmand**, avec un d, comme gourmande et gourmandise."
    jules: "Même réflexe pour un chat gris (grise), un grand chien (grande) ou un gros lapin (grosse) : fais parler la famille."

  - id: exemple-judo
    type: exemple
    situation: "Au judo, Lila a gagné sa ceinture jaune. Elle écrit dans son cahier : « J'ai fait des progrè. » Il manque une lettre. Laquelle ?"
    calcul: "On cherche un mot de la même famille : le verbe progresser. Dans progresser, on entend le son [s] juste après progre."
    conclusion: "On écrit **progrès**, avec un s final muet (et un accent grave sur le e) : « J'ai fait des progrès. »"
    jules: "Le s de progrès est là même quand on parle d'un seul progrès : un progrès, des progrès. Ce n'est pas la marque du pluriel, c'est la fin du mot."

  - id: exemple-factrice
    type: exemple
    situation: "La maman de Yanis distribue le courrier. Un homme qui fait ce métier est un facteur. Comment écrire le mot pour la maman de Yanis ?"
    calcul: "Facteur finit par -teur, comme acteur ou moniteur. Dans ce groupe, -teur devient **-trice** au féminin."
    conclusion: "La maman de Yanis est **factrice**."
    jules: "Tu peux vérifier avec d'autres métiers que tu connais : directeur, directrice ; conducteur, conductrice."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Fais ton carnet de familles : écris un mot en haut d'une page (terre, chant, bois) et ajoute tous les mots de sa famille que tu rencontres."
