<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg"><title>La phrase « Chaque soir, Léa promène son chien au parc. » découpée en groupes</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Chaque question trouve son groupe</text>
<rect x="35.9" y="130.6" width="170.0" height="38.8" rx="8" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.6"/>
<text x="41.9" y="150.0" font-size="25" fill="#7048E8" font-weight="600" text-anchor="start" dominant-baseline="central">Chaque soir,</text>
<rect x="209.8" y="130.6" width="57.3" height="38.8" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.6"/>
<text x="215.8" y="150.0" font-size="25" fill="#1D4E89" font-weight="600" text-anchor="start" dominant-baseline="central">Léa</text>
<rect x="271.1" y="130.6" width="124.7" height="38.8" rx="8" fill="#FBE4E4" stroke="#C92A2A" stroke-width="1.6"/>
<text x="277.1" y="150.0" font-size="25" fill="#C92A2A" font-weight="600" text-anchor="start" dominant-baseline="central">promène</text>
<rect x="399.8" y="130.6" width="133.4" height="38.8" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="405.8" y="150.0" font-size="25" fill="#2B8A3E" font-weight="600" text-anchor="start" dominant-baseline="central">son chien</text>
<rect x="537.2" y="130.6" width="106.9" height="38.8" rx="8" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.6"/>
<text x="543.2" y="150.0" font-size="25" fill="#7048E8" font-weight="600" text-anchor="start" dominant-baseline="central">au parc</text>
<text x="646.1" y="150.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">.</text>
<text x="120.8" y="96.0" font-size="16" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">Quand ?</text>
<path d="M120.8 108.0 L120.8 125.0" fill="none" stroke="#7048E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="256.5" y="60.0" font-size="16" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">Qui est-ce qui promène ?</text>
<path d="M242.5 72.0 L238.5 125.0" fill="none" stroke="#1D4E89" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="456.5" y="96.0" font-size="16" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">Léa promène qui ?</text>
<path d="M456.5 108.0 L466.5 125.0" fill="none" stroke="#2B8A3E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="590.7" y="60.0" font-size="16" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">Où ?</text>
<path d="M590.7 72.0 L590.7 125.0" fill="none" stroke="#7048E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="120.8" y="191.0" font-size="15" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">complément</text>
<text x="120.8" y="210.0" font-size="15" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">circonstanciel</text>
<text x="238.5" y="191.0" font-size="15" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">groupe</text>
<text x="238.5" y="210.0" font-size="15" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">sujet</text>
<text x="333.5" y="191.0" font-size="15" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">verbe</text>
<text x="333.5" y="210.0" font-size="15" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">conjugué</text>
<text x="466.5" y="191.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">COD</text>
<text x="590.7" y="191.0" font-size="15" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">complément</text>
<text x="590.7" y="210.0" font-size="15" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">circonstanciel</text>
<line x1="20.0" y1="250.0" x2="660.0" y2="250.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="170.0" y="274.0" font-size="16" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">Le verbe change avec le temps</text>
<text x="170.0" y="308.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Hier, Léa </tspan><tspan fill="#C92A2A" font-weight="700">promenait</tspan><tspan fill="#1a1a18"> son chien.</tspan></text>
<text x="170.0" y="338.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Aujourd'hui, Léa </tspan><tspan fill="#C92A2A" font-weight="700">promène</tspan><tspan fill="#1a1a18"> son chien.</tspan></text>
<text x="170.0" y="368.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Demain, Léa </tspan><tspan fill="#C92A2A" font-weight="700">promènera</tspan><tspan fill="#1a1a18"> son chien.</tspan></text>
<text x="170.0" y="404.0" font-size="15" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Le mot qui change, c'est le verbe.</text>
<line x1="340.0" y1="264.0" x2="340.0" y2="420.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="510.0" y="274.0" font-size="16" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">Le sujet : encadrer ou remplacer</text>
<rect x="353.5" y="302.0" width="123.2" height="28.0" rx="6" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.6"/>
<text x="359.5" y="316.0" font-size="17" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">C'est Léa qui</text>
<text x="484.7" y="316.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">promène son chien.</text>
<text x="510.0" y="364.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1D4E89" font-weight="700">Elle</tspan><tspan fill="#1a1a18"> promène son chien.</tspan></text>
<text x="510.0" y="404.0" font-size="15" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Léa → Elle : un pronom remplace le sujet.</text>
<text x="340.0" y="436.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Couleurs : bleu = sujet, rouge = verbe, vert = COD, violet = complément circonstanciel.</text>
</svg>
