notion: cm1-comprendre-interroger-morale
titre: "La morale d'une histoire : la trouver, puis se demander si elle est juste"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 7", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: trois-temps
    type: formule
    expression: "[la situation] → [l'action] → [la morale]"
    termes:
      "la situation": {couleur: bleu, legende: "le début : qui est là, où, avec quoi. Le Corbeau, sur un arbre, tient un **fromage**."}
      "l'action": {couleur: orange, legende: "ce qui se passe : le Renard **flatte** le Corbeau, qui ouvre le bec pour chanter et lâche le fromage."}
      "la morale": {couleur: vert, legende: "la **leçon** pour le lecteur : « tout flatteur vit aux dépens de celui qui l'écoute »."}
    jules: "Dans une fable, les animaux parlent et agissent comme des humains. La Fontaine s'en sert pour nous montrer nos défauts sans vexer personne."

  - id: carte
    type: carte
    noeuds:
      - {id: morale, titre: "La morale d'une histoire", sous_titre: "la leçon de vie que le lecteur en tire", principal: true}
      - {id: explicite, titre: "Explicite", sous_titre: "écrite dans le texte, on peut la souligner"}
      - {id: implicite, titre: "Implicite", sous_titre: "pas écrite : le lecteur la devine"}
      - {id: valeurs, titre: "Des valeurs", sous_titre: "justice, honnêteté, respect des différences"}
      - {id: discuter, titre: "On peut la discuter", sous_titre: "est-ce juste ? qu'aurait-il pu faire ?"}
    liens:
      - {de: morale, vers: explicite}
      - {de: morale, vers: implicite}
      - {de: morale, vers: valeurs}
      - {de: morale, vers: discuter}
    jules: "Explicite veut dire « dit clairement ». Implicite veut dire « pas dit, mais compris quand même », comme quand ta mère regarde ta chambre en désordre sans rien dire."

  - id: schema-fable
    type: schema
    titre: "La fable en 3 temps : Le Corbeau et le Renard"
    svg: "cm1-comprendre-interroger-morale.svg"
    jules: "À la fin, le Corbeau, honteux, jure qu'on ne l'y prendra plus. Il a compris la **leçon**, mais un peu tard : le fromage est déjà mangé."

  - id: schema-implicite
    type: schema
    titre: "Morale explicite ou implicite : écrite dans la fable, ou devinée dans le conte"
    svg: "cm1-comprendre-interroger-morale-implicite.svg"
    jules: "Andersen n'écrit jamais « il ne faut pas se moquer de ceux qui sont différents ». Il te laisse le découvrir en suivant le caneton, et c'est plus fort que si on te le disait."

  - id: methode
    type: methode
    etapes:
      - "Repère l'**action importante** d'un personnage : ce qu'il fait qui change l'histoire."
      - "Demande-toi si cette action est **juste** ou injuste, et dis pourquoi avec un « parce que »."
      - "Cherche les **conséquences** : qui gagne, qui perd, qu'arrive-t-il aux autres personnages ?"
      - "Trouve la morale : écrite à la fin (explicite) ou à deviner (implicite). Puis donne ton avis : le personnage aurait-il pu faire autrement ?"
    jules: "La morale n'est pas une règle qu'on apprend par cœur. On a le droit de la discuter, tant qu'on donne ses raisons."

  - id: piege
    type: piege
    mauvaise_idee: "Le Renard est méchant. Point."
    pourquoi_faux: "C'est un jugement sans raison. On ne dit ni ce que le Renard a fait de mal, ni ce que ça a changé pour le Corbeau."
    bonne_idee: "Le Renard est **malhonnête** parce qu'il fait de faux compliments pour voler le fromage. Conséquence : le Corbeau perd son repas et ne fera plus confiance aux flatteurs."
    jules: "Retiens la formule : je juge + « parce que » + une conséquence. Avec ces trois morceaux, ton avis tient debout."

  - id: exemple-cigale
    type: exemple
    situation: "Dans La Cigale et la Fourmi, de La Fontaine, la Cigale a chanté tout l'été. L'hiver venu, elle n'a rien à manger et demande à la Fourmi de lui prêter du grain. La Fourmi refuse : « Vous chantiez ? j'en suis fort aise. Eh bien ! dansez maintenant. » Est-ce juste ?"
    calcul: "Il n'y a pas de morale écrite à la fin : elle est **implicite**. On peut comprendre « il faut prévoir l'avenir ». Mais La Fontaine écrit aussi : « La Fourmi n'est pas prêteuse : c'est là son moindre défaut. » Il se moque un peu d'elle."
    conclusion: "On peut défendre les deux avis. La Fourmi est prévoyante, mais elle manque de **générosité**. Un avis possible : la Cigale aurait dû prévoir, et la Fourmi aurait pu partager un peu, puis l'aider à faire ses réserves."
    jules: "« J'en suis fort aise » veut dire « j'en suis bien contente ». La Fourmi répond avec moquerie, et c'est ce ton qui fait réfléchir."

  - id: exemple-cour
    type: exemple
    situation: "Dans la cour, Hugo dit à Inès : « Ton dessin est le plus beau de la classe ! Tu me donnes la moitié de ton goûter ? » Inès donne son goûter, puis entend Hugo dire l'inverse à un autre élève. Quelle fable cela te rappelle-t-il ?"
    calcul: "Hugo fait des compliments qu'il ne pense pas, pour obtenir un goûter : c'est un **flatteur**, comme le Renard. Inès l'a écouté et a perdu son goûter, comme le Corbeau son fromage."
    conclusion: "C'est la morale du Corbeau et du Renard : « tout flatteur vit aux dépens de celui qui l'écoute ». Inès apprend à se méfier des compliments intéressés."
    jules: "Une morale de 1668 marche encore dans ta cour de récréation. C'est pour ça qu'on lit toujours les fables de La Fontaine aujourd'hui."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : relis un conte que tu connais bien et trouve sa morale implicite. Écris-la en une phrase qui commence par « Il ne faut pas… » ou « Il vaut mieux… »."
