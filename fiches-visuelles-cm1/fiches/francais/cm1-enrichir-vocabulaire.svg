<text x="480.0" y="52.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">terr</tspan><tspan fill="#1a1a18"> : le morceau</tspan></text>
