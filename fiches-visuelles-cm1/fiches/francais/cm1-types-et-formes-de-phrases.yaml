notion: cm1-types-et-formes-de-phrases
titre: "Les types de phrases (déclaratif, interrogatif, impératif) et leurs formes"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 17", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, guide « La grammaire du français — Terminologie grammaticale », p. 67-68", url: "https://eduscol.education.gouv.fr/sites/default/files/document/guide-la-grammaire-du-francais-terminologie-grammaticale-67998.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: phrase, titre: "Une phrase", sous_titre: "toujours un type, et parfois une forme en plus", principal: true}
      - {id: declaratif, titre: "Type déclaratif", sous_titre: "je donne une information. Point final"}
      - {id: interrogatif, titre: "Type interrogatif", sous_titre: "je pose une question. Point d'interrogation"}
      - {id: imperatif, titre: "Type impératif", sous_titre: "je donne un ordre ou un conseil, sans sujet écrit"}
      - {id: formes, titre: "Les formes", sous_titre: "négative (ne… pas) ou exclamative (!), en plus du type"}
    liens:
      - {de: phrase, vers: declaratif}
      - {de: phrase, vers: interrogatif}
      - {de: phrase, vers: imperatif}
      - {de: phrase, vers: formes, libelle: "en plus"}
    jules: "Le type, c'est ce que la phrase fait : informer, questionner, ordonner. La forme, c'est un habit qu'on lui met par-dessus : on peut mettre une phrase de n'importe quel type à la forme négative."

  - id: schema-types
    type: schema
    titre: "Trois phrases du goûter : une information, une question, un ordre"
    svg: "cm1-types-et-formes-de-phrases.svg"
    jules: "Dans « Lave-toi les mains ! », personne n'est écrit devant le verbe : c'est la marque de l'impératif. On sait quand même à qui Papa parle, c'est à toi."

  - id: schema-formes
    type: schema
    titre: "La forme négative en sandwich autour du verbe, et la forme exclamative"
    svg: "cm1-types-et-formes-de-phrases-formes.svg"
    jules: "À l'oral, on avale souvent le ne : « Je joue pas ». À l'écrit, il ne faut jamais l'oublier : un sandwich sans sa tranche du dessus, ça ne tient pas !"

  - id: schema-questions
    type: schema
    titre: "Trois façons de poser la même question"
    svg: "cm1-types-et-formes-de-phrases-questions.svg"
    jules: "Tu peux aussi commencer par un mot interrogatif : qui, quand, où, pourquoi, comment. Par exemple : « Quand viens-tu au parc ? »"

  - id: graphe
    type: graphe
    gabarit: phrase-en-blocs
    curseurs:
      - {id: curseur-phrase, nom: phrase, min: 1, max: 1, pas: 1, depart: 1}
      - {id: curseur-type, nom: type, min: 1, max: 4, pas: 1, depart: 1}
      - {id: curseur-negatif, nom: negatif, min: 0, max: 1, pas: 1, depart: 0}
    lectures:
      - {si: "type == 1", texte: "Type **déclaratif** : on donne une information. La phrase finit par un point."}
      - {si: "type >= 2 && type <= 3", texte: "Type **interrogatif** : le sujet passe après le verbe (ranges-tu), ou on ajoute « est-ce que ». On finit par un **point d'interrogation**."}
      - {si: "type == 4", texte: "Type **impératif** : on donne un ordre. Le sujet tu disparaît, et range perd son s."}
      - {si: "negatif == 1", texte: "Forme **négative** : « ne » et « pas » entourent le verbe conjugué, comme les deux tranches d'un sandwich."}
    jules: "Bouge type pour changer ce que fait la phrase, puis negatif pour lui mettre l'habit négatif. Regarde le dernier signe : point, point d'interrogation ou point d'exclamation."

  - id: methode
    type: methode
    etapes:
      - "Demande-toi ce que fait la phrase : elle informe, elle questionne ou elle ordonne ? Tu as trouvé son **type**."
      - "Cherche ensuite s'il y a ne… pas (ou ne… jamais, ne… plus) autour du verbe : c'est la **forme négative**."
      - "Regarde le point final. Un point d'exclamation qui montre une émotion forte : c'est la **forme exclamative**."
      - "Pour transformer une phrase en question, choisis une des trois façons : la voix qui monte, « est-ce que », ou le sujet après le verbe."
    jules: "Une phrase peut cumuler : « Ne cours pas dans le couloir ! » est de type impératif, de forme négative et de forme exclamative à la fois."

  - id: piege
    type: piege
    mauvaise_idee: "« Ne cours pas dans le couloir ! » est une phrase négative. Ce n'est donc pas une phrase impérative."
    pourquoi_faux: "Négative n'est pas un type : c'est une **forme**, qui s'ajoute au type. Cette phrase donne un ordre, sans sujet écrit : son type est **impératif**."
    bonne_idee: "Type impératif (un ordre), forme négative (ne… pas autour de cours) et forme exclamative (le point d'exclamation)."
    jules: "Autre piège : « Je me demande si tu viens. » n'est pas une vraie question, elle ne prend pas de point d'interrogation. Elle raconte qu'on se pose une question : c'est une phrase déclarative."

  - id: exemple-piscine
    type: exemple
    situation: "Samia va à la piscine. Transforme cette phrase déclarative en phrase interrogative, de trois façons."
    calcul: "La voix qui monte : « Samia va à la piscine ? » Avec est-ce que : « Est-ce que Samia va à la piscine ? » Avec le sujet après le verbe : « Samia va-t-elle à la piscine ? »"
    conclusion: "Trois questions, toutes de **type interrogatif**, toutes avec un point d'interrogation."
    jules: "Dans « va-t-elle », le t sert à ne pas buter entre deux voyelles : va-elle serait dur à prononcer. Quand le sujet est un prénom, on le garde et on ajoute il ou elle après le verbe."

  - id: exemple-devoirs
    type: exemple
    situation: "Le soir, Maxime dit : « J'ai fini mes devoirs. » Mets cette phrase à la forme négative, puis à la forme exclamative."
    calcul: "Négative : on met ne… pas autour du verbe, et ne devient n' devant la voyelle : « Je n'ai pas fini mes devoirs. » Exclamative : « J'ai fini mes devoirs ! »"
    conclusion: "Les deux phrases restent de **type déclaratif** : seule la **forme** a changé."
    jules: "Quand le verbe est en deux morceaux (ai fini), le sandwich se fait autour du premier morceau : n'ai pas fini."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Jeu à faire à deux : l'un dit une phrase, l'autre la retourne en question, puis à la forme négative. Changez de rôle à chaque tour."
