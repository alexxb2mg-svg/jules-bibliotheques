<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Un groupe nominal sous ses quatre formes, et les pluriels spéciaux</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="224.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">singulier</text>
<text x="538.0" y="18.0" font-size="17" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">pluriel</text>
<text x="10.0" y="78.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">masculin</text>
<text x="10.0" y="204.0" font-size="15" fill="#6D28D9" font-weight="700" text-anchor="start" dominant-baseline="central">féminin</text>
<rect x="101.0" y="40.0" width="246.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#b9b7ae" stroke-width="1.4"/>
<text x="224.0" y="78.0" font-size="24" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">le lapin gris</tspan></text>
<rect x="415.0" y="40.0" width="246.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#b9b7ae" stroke-width="1.4"/>
<text x="538.0" y="68.0" font-size="24" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">le</tspan><tspan fill="#C2410C">s</tspan><tspan fill="#1a1a18"> lapin</tspan><tspan fill="#C2410C">s</tspan><tspan fill="#1a1a18"> gris</tspan></text>
<rect x="101.0" y="166.0" width="246.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#b9b7ae" stroke-width="1.4"/>
<text x="224.0" y="204.0" font-size="24" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#6D28D9">la</tspan><tspan fill="#1a1a18"> lapin</tspan><tspan fill="#6D28D9">e</tspan><tspan fill="#1a1a18"> gris</tspan><tspan fill="#6D28D9">e</tspan></text>
<rect x="415.0" y="166.0" width="246.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#b9b7ae" stroke-width="1.4"/>
<text x="538.0" y="204.0" font-size="24" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">le</tspan><tspan fill="#C2410C">s</tspan><tspan fill="#1a1a18"> lapin</tspan><tspan fill="#6D28D9">e</tspan><tspan fill="#C2410C">s</tspan><tspan fill="#1a1a18"> gris</tspan><tspan fill="#6D28D9">e</tspan><tspan fill="#C2410C">s</tspan></text>
<text class="ts" x="538.0" y="98.0" text-anchor="middle" dominant-baseline="central">« gris » finit déjà par un s</text>
<line x1="351.0" y1="78.0" x2="409.0" y2="78.0" stroke="#C2410C" stroke-width="2.4" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="381.0" y="62.0" font-size="17" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">+ s</text>
<line x1="351.0" y1="204.0" x2="409.0" y2="204.0" stroke="#C2410C" stroke-width="2.4" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="381.0" y="188.0" font-size="17" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">+ s</text>
<line x1="224.0" y1="120.0" x2="224.0" y2="160.0" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="238.0" y="141.0" font-size="17" fill="#6D28D9" font-weight="700" text-anchor="start" dominant-baseline="central">+ e</text>
<line x1="538.0" y1="120.0" x2="538.0" y2="160.0" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="552.0" y="141.0" font-size="17" fill="#6D28D9" font-weight="700" text-anchor="start" dominant-baseline="central">+ e</text>
<rect x="14.0" y="262.0" width="652.0" height="200.0" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text x="340.0" y="282.0" font-size="16" fill="#854F0B" font-weight="700" text-anchor="middle" dominant-baseline="central">Des mots qui ne suivent pas la règle : à apprendre</text>
<text x="180.0" y="318.0" font-size="19" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">un cheval → des chevaux</text>
<text x="180.0" y="338.0" font-size="13.5" fill="#854F0B" font-weight="600" text-anchor="middle" dominant-baseline="central">-al devient -aux</text>
<text x="500.0" y="318.0" font-size="19" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">un gâteau → des gâteaux</text>
<text x="500.0" y="338.0" font-size="13.5" fill="#854F0B" font-weight="600" text-anchor="middle" dominant-baseline="central">-eau prend un x</text>
<text x="180.0" y="372.0" font-size="19" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">un jeu → des jeux</text>
<text x="180.0" y="392.0" font-size="13.5" fill="#854F0B" font-weight="600" text-anchor="middle" dominant-baseline="central">-eu prend un x</text>
<text x="500.0" y="372.0" font-size="19" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">une souris → des souris</text>
<text x="500.0" y="392.0" font-size="13.5" fill="#854F0B" font-weight="600" text-anchor="middle" dominant-baseline="central">s, x, z : rien ne change</text>
<line x1="40.0" y1="416.0" x2="640.0" y2="416.0" stroke="#d9b98a" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="340.0" y="440.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#854F0B">Au féminin : </tspan><tspan fill="#1a1a18">rouge → rouge</tspan><tspan fill="#5f5e5a">  ·  </tspan><tspan fill="#1a1a18">bon → bon</tspan><tspan fill="#6D28D9">ne</tspan><tspan fill="#5f5e5a">  ·  </tspan><tspan fill="#1a1a18">gentil → gentil</tspan><tspan fill="#6D28D9">le</tspan></text>
</svg>
