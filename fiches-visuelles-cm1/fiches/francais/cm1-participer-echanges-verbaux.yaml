notion: cm1-participer-echanges-verbaux
titre: "Participer à un débat : attendre son tour, reformuler, argumenter, faire avancer l'échange"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 12", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 10", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: phrases
    type: formule
    expression: "[Si j'ai bien compris]… [je pense]… [parce que]…"
    termes:
      "Si j'ai bien compris": {couleur: violet, legende: "je **reformule** l'idée de l'autre avant de répondre : il voit que je l'ai écouté"}
      "je pense": {couleur: bleu, legende: "« Je pense que… » : je donne **mon avis**, d'accord, pas d'accord, ou une autre idée"}
      "parce que": {couleur: orange, legende: "j'**argumente** : je donne la raison de mon avis"}
    jules: "Ces trois débuts de phrase sont tes outils de débat. Tu peux aussi dire « Je suis d'accord avec Tom, et j'ajoute que… » pour apporter une idée nouvelle."

  - id: carte
    type: carte
    noeuds:
      - {id: echange, titre: "Un échange en classe", sous_titre: "on construit une idée tous ensemble", principal: true}
      - {id: tour, titre: "Chacun son tour", sous_titre: "je lève la main, je ne coupe pas la parole"}
      - {id: ecouter, titre: "J'écoute et je reformule", sous_titre: "« Si j'ai bien compris, tu dis que… »"}
      - {id: argumenter, titre: "J'argumente", sous_titre: "mon avis + « parce que » + une raison"}
      - {id: avancer, titre: "Je fais avancer", sous_titre: "une idée nouvelle, pas une répétition"}
    liens:
      - {de: echange, vers: tour}
      - {de: echange, vers: ecouter}
      - {de: echange, vers: argumenter}
      - {de: echange, vers: avancer}
    jules: "Dans un débat, le but n'est pas de gagner contre les autres. C'est de trouver ensemble une meilleure idée que celle du début."

  - id: schema-regles
    type: schema
    titre: "Les règles du débat dessinées : lever la main, ne pas couper, reformuler, argumenter"
    svg: "cm1-participer-echanges-verbaux.svg"
    jules: "Pas d'accord avec quelqu'un ? C'est permis ! On critique l'idée, jamais la personne : « Je ne suis pas d'accord avec ton idée », et pas « Tu dis n'importe quoi »."

  - id: schema-debat
    type: schema
    titre: "Un vrai débat en classe : avis, reformulation, répétition, idée nouvelle"
    svg: "cm1-participer-echanges-verbaux-debat.svg"
    jules: "Regarde Inès : elle a écouté Tom ET Awa, et elle trouve une idée qui les met d'accord. C'est ça, faire avancer un débat."

  - id: methode
    type: methode
    etapes:
      - "J'écoute jusqu'au bout la personne qui parle, en la regardant."
      - "Je lève la main et j'attends qu'on me donne la parole : c'est mon **tour**."
      - "Je parle assez fort et j'articule pour que tout le groupe m'entende."
      - "J'apporte une idée **nouvelle** ou une raison, sans répéter ce qui a déjà été dit."
      - "Après l'échange, je repère un point à améliorer : ma vitesse, ma clarté, mon écoute."
    jules: "Si tu as peur d'oublier ton idée en attendant ton tour, note-la en un mot sur ton brouillon. Tu la retrouveras quand ce sera à toi."

  - id: piege
    type: piege
    mauvaise_idee: "Mon idée est super importante : je la dis tout de suite, même si Tom n'a pas fini sa phrase."
    pourquoi_faux: "Quand on **coupe la parole**, deux voix se mélangent et personne ne comprend. Et Tom n'a pas pu dire la fin de son idée, qui était peut-être importante aussi."
    bonne_idee: "Je lève la main et j'attends que Tom ait fini. Puis je commence par « Si j'ai bien compris, Tom… » avant de donner mon idée."
    jules: "Autre piège : répéter ce qu'un camarade vient de dire, comme Léo dans le débat. Avant de parler, demande-toi : « Est-ce que j'apporte quelque chose de nouveau ? »"

  - id: exemple-cantine
    type: exemple
    situation: "Débat sur le gaspillage à la cantine. Sofia vient de dire : « On jette trop de pain. » Karim veut participer. Que peut-il dire ?"
    calcul: "Répéter « Oui, on jette trop de pain » n'apporterait rien. Karim cherche une idée nouvelle : « Je suis d'accord avec Sofia, et on pourrait couper le pain en petits morceaux, parce qu'on en reprendrait seulement si on a encore faim. »"
    conclusion: "Karim s'appuie sur l'idée de Sofia et apporte une **proposition** avec sa raison : le débat avance."
    jules: "« Je suis d'accord avec…, et j'ajoute que… » est une formule parfaite pour ne pas répéter : tu relies ton idée à celle d'avant."

  - id: exemple-situation
    type: exemple
    situation: "Nathan a vu un nid d'oiseau dans la cour. Il le raconte d'abord à son copain Hugo, puis à toute la classe pendant le « Quoi de neuf ? »."
    calcul: "À Hugo, tout près : « T'as vu ? Y a un nid dans l'arbre ! » Devant la classe, Nathan parle plus fort, plus lentement, et en phrases complètes : « Ce matin, j'ai vu un nid d'oiseau dans le grand arbre de la cour. »"
    conclusion: "Nathan **adapte** sa façon de parler : avec un copain, on parle comme entre amis ; devant la classe, on choisit la langue de l'école et une voix pour tout le groupe."
    jules: "Ce n'est pas que la première phrase soit interdite : elle est faite pour les copains. En classe, « Il y a » remplace « Y a », et tout le monde comprend."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi au dîner : lancez un petit débat en famille, par exemple « Chien ou chat ? ». Chacun doit dire « parce que » et reformuler l'avis de l'autre avant de répondre."
