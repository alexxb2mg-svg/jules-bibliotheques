<svg width="100%" viewBox="0 0 680 472" xmlns="http://www.w3.org/2000/svg"><title>Du texte surligné à la carte mentale du brouillon : le hérisson</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="20.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">① Je lis et je surligne les mots-clés</text>
<text x="358.0" y="20.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">② Je les range au brouillon</text>
<rect x="16.0" y="42.0" width="312.0" height="318.0" rx="6" fill="#FFFFFF" stroke="#b9b6aa" stroke-width="1.2"/>
<text x="34.0" y="68.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Le hérisson</text>
<line x1="34.0" y1="80.0" x2="136.1" y2="80.0" stroke="#1D4E89" stroke-width="2.5" stroke-linecap="round"/>
<text x="34.0" y="108.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Le hérisson est un petit mammifère</text>
<text x="34.0" y="138.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">couvert de</text>
<rect x="118.6" y="126.8" width="71.2" height="22.3" rx="3" fill="#FFE066" stroke="none" stroke-width="0"/>
<text x="120.6" y="138.0" font-size="15.5" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">piquants</text>
<text x="187.8" y="138.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">. Il sort</text>
<text x="34.0" y="168.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">surtout</text>
<rect x="93.2" y="156.8" width="53.0" height="22.3" rx="3" fill="#FFE066" stroke="none" stroke-width="0"/>
<text x="95.2" y="168.0" font-size="15.5" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">la nuit</text>
<text x="144.2" y="168.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">. Il mange des</text>
<rect x="32.0" y="186.8" width="68.2" height="22.3" rx="3" fill="#FFE066" stroke="none" stroke-width="0"/>
<text x="34.0" y="198.0" font-size="15.5" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">insectes</text>
<text x="98.2" y="198.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">, des</text>
<rect x="137.7" y="186.8" width="102.2" height="22.3" rx="3" fill="#FFE066" stroke="none" stroke-width="0"/>
<text x="139.7" y="198.0" font-size="15.5" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">vers de terre</text>
<text x="243.2" y="198.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">et</text>
<text x="34.0" y="228.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">des</text>
<rect x="64.1" y="216.8" width="63.2" height="22.3" rx="3" fill="#FFE066" stroke="none" stroke-width="0"/>
<text x="66.1" y="228.0" font-size="15.5" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">limaces</text>
<text x="125.3" y="228.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">. Il vit dans les</text>
<text x="34.0" y="258.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">jardins et les haies. En hiver, il</text>
<rect x="32.0" y="276.8" width="62.1" height="22.3" rx="3" fill="#FFE066" stroke="none" stroke-width="0"/>
<text x="34.0" y="288.0" font-size="15.5" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">hiberne</text>
<text x="97.3" y="288.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">: il dort dans un nid</text>
<text x="34.0" y="318.0" font-size="15.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">de feuilles jusqu'au printemps.</text>
<text x="172.0" y="376.0" font-size="15" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">6 mots-clés surlignés,</text>
<text x="172.0" y="395.0" font-size="15" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">pas des lignes entières</text>
<path d="M332.0 200.0 L352.0 200.0" fill="none" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<rect x="358.0" y="42.0" width="306.0" height="318.0" rx="4" fill="#FFFDF6" stroke="#b9b6aa" stroke-width="1.2"/>
<line x1="359.0" y1="70.0" x2="663.0" y2="70.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="359.0" y1="98.0" x2="663.0" y2="98.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="359.0" y1="126.0" x2="663.0" y2="126.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="359.0" y1="154.0" x2="663.0" y2="154.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="359.0" y1="182.0" x2="663.0" y2="182.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="359.0" y1="210.0" x2="663.0" y2="210.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="359.0" y1="238.0" x2="663.0" y2="238.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="359.0" y1="266.0" x2="663.0" y2="266.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="359.0" y1="294.0" x2="663.0" y2="294.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="359.0" y1="322.0" x2="663.0" y2="322.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="359.0" y1="350.0" x2="663.0" y2="350.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="388.0" y1="43.0" x2="388.0" y2="359.0" stroke="#E8A0A0" stroke-width="1.3" stroke-linecap="butt"/>
<text x="395.0" y="56.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">brouillon</text>
<ellipse cx="530" cy="204" rx="62" ry="26" fill="#E3EEF9" stroke="#1D4E89" stroke-width="2"/>
<text x="530.0" y="204.0" font-size="19" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">hérisson</text>
<path d="M470.0 180.0 L455.0 143.0" fill="none" stroke="#3a3a38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="455.0" y="108.0" font-size="15" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central" font-style="italic">corps :</text>
<text x="455.0" y="130.0" font-size="16" fill="#3a3a38" font-weight="700" text-anchor="middle" dominant-baseline="central" font-style="italic">piquants</text>
<path d="M585.0 180.0 L606.0 143.0" fill="none" stroke="#3a3a38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="606.0" y="108.0" font-size="15" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central" font-style="italic">quand ?</text>
<text x="606.0" y="130.0" font-size="16" fill="#3a3a38" font-weight="700" text-anchor="middle" dominant-baseline="central" font-style="italic">la nuit</text>
<path d="M478.0 228.0 L455.0 268.0" fill="none" stroke="#3a3a38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="455.0" y="280.0" font-size="15" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central" font-style="italic">mange :</text>
<text x="455.0" y="302.0" font-size="16" fill="#3a3a38" font-weight="700" text-anchor="middle" dominant-baseline="central" font-style="italic">insectes, vers,</text>
<text x="455.0" y="324.0" font-size="16" fill="#3a3a38" font-weight="700" text-anchor="middle" dominant-baseline="central" font-style="italic">limaces</text>
<path d="M580.0 228.0 L608.0 268.0" fill="none" stroke="#3a3a38" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="608.0" y="280.0" font-size="15" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central" font-style="italic">l'hiver :</text>
<text x="608.0" y="302.0" font-size="16" fill="#3a3a38" font-weight="700" text-anchor="middle" dominant-baseline="central" font-style="italic">hiberne</text>
<text x="608.0" y="324.0" font-size="16" fill="#3a3a38" font-weight="700" text-anchor="middle" dominant-baseline="central" font-style="italic">(il dort)</text>
<text x="511.0" y="376.0" font-size="15" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">une carte mentale : le sujet au milieu,</text>
<text x="511.0" y="395.0" font-size="15" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">une branche par idée</text>
<line x1="20.0" y1="412.0" x2="660.0" y2="412.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="431.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">③ Sans regarder le texte, je redis avec mes mots :</text>
<text x="20.0" y="456.0" font-size="15.5" fill="#1D4E89" font-weight="600" text-anchor="start" dominant-baseline="central">« Le hérisson a des piquants. Il sort la nuit, mange des petites bêtes et hiberne. »</text>
</svg>
