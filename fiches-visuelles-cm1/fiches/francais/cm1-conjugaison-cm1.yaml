notion: cm1-conjugaison-cm1
titre: "Conjuguer au CM1 : radical, terminaison et passé composé"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 18", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, guide fondamental « La grammaire du français du CP à la 6e », p. 149", url: "https://eduscol.education.gouv.fr/sites/default/files/document/guide-la-grammaire-du-francais-du-cp-la-6e-97251.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: essentiel
    type: formule
    expression: "nous [chant][i][ons]"
    termes:
      "chant": {couleur: bleu, legende: "le **radical** : la partie qui reste presque toujours pareille (chanter → chant-)"}
      "i": {couleur: orange, legende: "la **marque de temps** : i (ou ai) pour l'imparfait, r pour le futur"}
      "ons": {couleur: vert, legende: "la **marque de personne** : -ons va avec nous, -ez avec vous, -ent avec ils"}
    jules: "La terminaison a deux morceaux : d'abord le temps, puis la personne. Dans « nous chantions », le i dit « c'est l'imparfait » et le -ons dit « c'est nous »."

  - id: carte
    type: carte
    noeuds:
      - {id: verbe, titre: "Un verbe conjugué", sous_titre: "radical + terminaison (temps + personne)", principal: true}
      - {id: present, titre: "Le présent", sous_titre: "maintenant, ou tout le temps : je joue, nous jouons"}
      - {id: imparfait, titre: "L'imparfait", sous_titre: "avant, une habitude : je jouais (marque ai ou i)"}
      - {id: futur, titre: "Le futur", sous_titre: "plus tard : je jouerai (marque r)"}
      - {id: pc, titre: "Le passé composé", sous_titre: "c'est fini : j'ai joué = auxiliaire + participe passé"}
    liens:
      - {de: verbe, vers: present}
      - {de: verbe, vers: imparfait}
      - {de: verbe, vers: futur}
      - {de: verbe, vers: pc}
    jules: "Le présent, l'imparfait et le futur sont des temps simples : un seul mot pour le verbe. Le passé composé est un temps composé : il faut deux mots, l'auxiliaire et le participe passé."

  - id: schema-frise
    type: schema
    titre: "Les quatre temps sur la frise : avant, hier, maintenant, demain"
    svg: "cm1-conjugaison-cm1.svg"
    jules: "Les deux temps du passé ne racontent pas la même chose. **L'imparfait** décrit ce qui durait ou se répétait (je jouais aux billes chaque jour), le **passé composé** une action terminée (hier, j'ai joué au foot)."

  - id: schema-tableau
    type: schema
    titre: "Le verbe jouer aux quatre temps, en couleurs"
    svg: "cm1-conjugaison-cm1-tableau.svg"
    jules: "Lis le tableau en colonnes : à l'imparfait, tu vois ai ou i à chaque ligne ; au futur, le r revient à chaque ligne. Lis-le aussi en lignes : avec nous, la marque de personne est toujours -ons."

  - id: schema-passe-compose
    type: schema
    titre: "Le passé composé : l'auxiliaire, le participe passé, et ne... pas autour"
    svg: "cm1-conjugaison-cm1-passe-compose.svg"
    jules: "Pour retrouver l'infinitif d'un participe, fais une phrase avec « il faut » : « pris », il faut prendre ; « vu », il faut voir. Aller et venir se conjuguent avec être : nous sommes allés, elle est venue."

  - id: graphe-temps
    type: graphe
    gabarit: frise-temps-verbaux
    curseurs:
      - {id: curseur-moment, nom: moment, min: -3, max: 3, pas: 1, depart: 0}
      - {id: curseur-habitude, nom: habitude, min: 0, max: 1, pas: 1, depart: 0}
      - {id: curseur-personne, nom: personne, min: 1, max: 6, pas: 1, depart: 4}
    lectures:
      - {si: "moment == 0", texte: "**Présent** : maintenant, ou tout le temps (nous jouons)."}
      - {si: "moment < 0 && habitude == 1", texte: "**Imparfait** : une habitude, une action qui durait ; marque de temps **ai** ou **i** (nous jouions)."}
      - {si: "moment < 0 && habitude == 0", texte: "**Passé composé** : une action finie ; **auxiliaire + participe passé** (nous avons joué)."}
      - {si: "moment > 0", texte: "**Futur** : plus tard ; marque de temps **r** (nous jouerons)."}
    jules: "Personne 1 c'est je, 2 tu, 3 il, 4 nous, 5 vous, 6 ils. Change seulement la personne : le radical bleu jou- ne bouge pas, c'est la marque verte qui change. Le curseur habitude ne compte que dans le passé."

  - id: methode
    type: methode
    etapes:
      - "Trouve **l'infinitif** du verbe (il faut... jouer, finir, prendre) : il te dit le groupe. 1er groupe : -er ; 2e groupe : -ir avec nous finissons."
      - "Sépare le **radical** et la **terminaison** : jou-ais, fin-issons."
      - "Dans la terminaison, cherche la **marque de temps** (ai ou i pour l'imparfait, r pour le futur), puis la marque de personne."
      - "Au **passé composé**, écris l'auxiliaire avoir ou être au présent, puis le participe passé : j'ai joué, je suis allé."
      - "À la forme négative, écris ne (ou n') juste avant l'auxiliaire, et le mot « pas » juste après lui : je n'ai pas joué."
    jules: "Les verbes à savoir par cœur au CM1 : être, avoir, les verbes en -er et en -ir comme finir, et faire, aller, dire, venir, pouvoir, voir, vouloir, prendre. Même quand leur radical change, au futur on retrouve le r : j'irai, je ferai, je serai."

  - id: piege
    type: piege
    mauvaise_idee: "À la forme négative, j'écris comme je parle : « J'ai pas fini. », ou je mets pas après le participe : « Je n'ai fini pas. »"
    pourquoi_faux: "À l'écrit, il faut les deux mots de la **négation**, ne et pas. Au passé composé, ils entourent **l'auxiliaire**, car c'est lui qui est conjugué."
    bonne_idee: "Je n'ai pas fini mes devoirs. Nous ne sommes pas allés à la piscine. Le participe passé reste toujours à la fin."
    jules: "Pense à un sandwich : ne et pas sont les deux tranches de pain, l'auxiliaire est au milieu. Le participe passé attend juste après le sandwich."

  - id: exemple-classe-verte
    type: exemple
    situation: "Sacha raconte sa classe verte : « Le matin, nous marchions dans la forêt. Demain, nous irons voir les chevaux. » À quels temps sont les verbes ?"
    calcul: "marchions : infinitif marcher. Radical march-, marque de temps i, marque de personne ons : c'est **l'imparfait**. irons : infinitif aller. Radical i-, marque de temps r, marque de personne ons : c'est le **futur**."
    conclusion: "Nous marchions est à l'imparfait (une habitude, chaque matin) ; nous irons est au futur (demain). Le radical d'aller change beaucoup, mais le r du futur est bien là."
    jules: "Pour ne pas confondre les deux, cherche la marque de temps : i ou ai, c'est l'imparfait ; r, c'est le futur. Je jouais, c'est hier ; je jouerai, c'est demain."

  - id: exemple-crepes
    type: exemple
    situation: "Nour écrit le programme de la fête de l'école : « Nous (manger) des crêpes et nous (commencer) le spectacle à 16 h. » Comment conjuguer ces deux verbes au présent ?"
    calcul: "manger : nous mang + ons. Pour garder le son « je » devant o, on ajoute un e : nous mangeons. commencer : nous commenc + ons. Pour garder le son « s » devant o, le c prend une cédille : nous commençons."
    conclusion: "Nous **mangeons** des crêpes et nous **commençons** le spectacle à 16 h. Le radical change un peu pour que le verbe se prononce bien."
    jules: "D'autres verbes en -er changent aussi de radical : j'appelle mais nous appelons, j'achète mais nous achetons, je nettoie mais nous nettoyons. Vérifie-les dans ton tableau de conjugaison."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : écris trois phrases sur tes week-ends, une à l'imparfait, une au passé composé, une au futur pour le prochain. Colorie le radical en bleu, la marque de temps en orange et la marque de personne en vert."
