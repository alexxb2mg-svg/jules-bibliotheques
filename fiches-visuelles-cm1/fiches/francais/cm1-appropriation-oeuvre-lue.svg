<text x="34.0" y="64.0" font-size="14.5" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Titre :</text>
<text x="84.0" y="64.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">Le phare aux mouettes</text>
<text x="34.0" y="90.0" font-size="14.5" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Auteur :</text>
<text x="98.0" y="90.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">(histoire inventée)</text>
<text x="34.0" y="116.0" font-size="14.5" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Genre :</text>
<text x="92.0" y="116.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">un roman d'aventure</text>
<text x="34.0" y="142.0" font-size="14.5" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Lu du :</text>
<text x="90.0" y="142.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">3 au 20 octobre</text>
<text x="34.0" y="176.0" font-size="14.5" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Mon moment préféré :</text>
