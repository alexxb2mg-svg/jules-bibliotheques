<text x="44.0" y="384.0" font-size="14.5" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">La tempête : Mila et Ferdinand</text>
<text x="44.0" y="406.0" font-size="14.5" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">rallument le phare, le bateau</text>
<text x="44.0" y="428.0" font-size="14.5" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">rentre au port.</text>
<text x="360.0" y="64.0" font-size="14.5" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">L'histoire en deux phrases :</text>
<text x="360.0" y="88.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">Mila passe l'été sur une île.</text>
<text x="360.0" y="110.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">Avec le gardien du phare, elle</text>
<text x="360.0" y="132.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">sauve un bateau de la tempête.</text>
<text x="360.0" y="166.0" font-size="14.5" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Ce que j'ai ressenti :</text>
<text x="360.0" y="190.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">J'ai eu peur pendant la tempête,</text>
<text x="360.0" y="212.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">puis j'étais fière de Mila.</text>
<text x="360.0" y="246.0" font-size="14.5" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Ça me fait penser à…</text>
<text x="360.0" y="270.0" font-size="14.5" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">ma vie :</text>
<text x="422.0" y="270.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">les vacances chez ma</text>
<text x="360.0" y="292.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">mamie, au bord de la mer.</text>
<text x="360.0" y="318.0" font-size="14.5" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">un autre livre :</text>
<text x="476.0" y="318.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">Hansel et Gretel :</text>
<text x="360.0" y="340.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">des cailloux qui brillent la nuit.</text>
<text x="360.0" y="376.0" font-size="14.5" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Ma note :</text>
<polygon points="450.0,364.0 447.4,370.4 440.5,370.9 445.7,375.4 444.1,382.1 450.0,378.5 455.9,382.1 454.3,375.4 459.5,370.9 452.6,370.4" fill="#F7C948" stroke="#B8860B" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="476.0,364.0 473.4,370.4 466.5,370.9 471.7,375.4 470.1,382.1 476.0,378.5 481.9,382.1 480.3,375.4 485.5,370.9 478.6,370.4" fill="#F7C948" stroke="#B8860B" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="502.0,364.0 499.4,370.4 492.5,370.9 497.7,375.4 496.1,382.1 502.0,378.5 507.9,382.1 506.3,375.4 511.5,370.9 504.6,370.4" fill="#F7C948" stroke="#B8860B" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="528.0,364.0 525.4,370.4 518.5,370.9 523.7,375.4 522.1,382.1 528.0,378.5 533.9,382.1 532.3,375.4 537.5,370.9 530.6,370.4" fill="#F7C948" stroke="#B8860B" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="554.0,364.0 551.4,370.4 544.5,370.9 549.7,375.4 548.1,382.1 554.0,378.5 559.9,382.1 558.3,375.4 563.5,370.9 556.6,370.4" fill="#FFFFFF" stroke="#B8860B" stroke-width="1.2" stroke-linejoin="round"/>
<text x="360.0" y="404.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">J'ai aimé. Je le conseille à Tom,</text>
<text x="360.0" y="426.0" font-size="15" fill="#2b2a26" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">il adore les bateaux.</text>
</svg>
