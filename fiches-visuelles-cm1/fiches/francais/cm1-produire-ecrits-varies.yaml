notion: cm1-produire-ecrits-varies
titre: "Écrire des textes variés : chaque écrit a sa forme, et le brouillon sert à l'améliorer"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 9", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 9", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: ecrire, titre: "Écrire un texte", sous_titre: "d'abord savoir à quoi il va servir", principal: true}
      - {id: raconter, titre: "Raconter", sous_titre: "un récit, une lettre : les faits dans l'ordre"}
      - {id: expliquer, titre: "Expliquer", sous_titre: "une recette, un compte rendu : des étapes claires"}
      - {id: perso, titre: "Un texte personnel", sous_titre: "mon avis, une suite d'histoire, une hypothèse"}
      - {id: brouillon, titre: "Le brouillon", sous_titre: "préparer, relire, corriger, puis recopier au propre"}
    liens:
      - {de: ecrire, vers: raconter}
      - {de: ecrire, vers: expliquer}
      - {de: ecrire, vers: perso}
      - {de: ecrire, vers: brouillon}
    jules: "Avant d'écrire la première ligne, demande-toi : « Qui va me lire, et pour quoi faire ? » Une recette sert à cuisiner, une lettre à donner des nouvelles : ça change tout."

  - id: schema-formes
    type: schema
    titre: "Cinq écrits côte à côte : récit, recette, lettre, affiche, compte rendu"
    svg: "cm1-produire-ecrits-varies.svg"
    jules: "Ces marques orange permettent de reconnaître un écrit de loin, avant même de le lire. Une liste avec des numéros ? C'est sûrement une recette ou une règle de jeu."

  - id: schema-brouillon
    type: schema
    titre: "Du brouillon corrigé au texte au propre : la sortie au musée"
    svg: "cm1-produire-ecrits-varies-brouillon.svg"
    jules: "Sur un brouillon, on a le droit de barrer, d'ajouter au-dessus, de numéroter. Saute une ligne sur deux : tu auras la place d'écrire tes corrections."

  - id: graphe
    type: graphe
    gabarit: schema-narratif
    curseurs:
      - {id: curseur-moment, nom: moment, min: 1, max: 5, pas: 1, depart: 1}
      - {id: curseur-peripeties, nom: peripeties, min: 1, max: 3, pas: 1, depart: 2}
      - {id: curseur-anglais, nom: anglais, min: 0, max: 0, pas: 1, depart: 0}
    lectures:
      - {si: "moment == 1", texte: "**Situation initiale** : qui ? où ? quand ? Tout est calme, la courbe est basse."}
      - {si: "moment == 2", texte: "**Élément perturbateur** : un problème arrive, l'histoire démarre et la tension monte."}
      - {si: "moment == 3", texte: "**Péripéties** : le héros essaie, échoue, recommence. Chaque essai fait un pic sur la courbe."}
      - {si: "moment >= 4", texte: "**Résolution** puis **situation finale** : le problème est réglé, la courbe redescend, l'histoire se referme."}
    jules: "Avant d'écrire ton histoire, fais glisser moment de 1 à 5 : tu as ton plan en cinq cases. Avec peripeties, choisis combien d'aventures ton héros va vivre."

  - id: methode
    type: methode
    etapes:
      - "Je comprends ce que je dois écrire : **raconter**, **expliquer** ou donner mon avis ? Pour qui ?"
      - "Au brouillon, je note mes idées en mots-clés et je les **numérote** dans l'ordre."
      - "J'écris mon texte en suivant cet ordre, avec les marques de l'écrit (titre, étapes, formule de politesse…)."
      - "Je **relis** : chaque phrase commence par une majuscule et finit par un point ? Les mots sont bien écrits ? On comprend l'histoire ?"
      - "J'écoute les remarques du professeur ou d'un camarade, je corrige, puis je recopie au propre."
    jules: "Relis ton texte deux fois : une fois pour le sens (on comprend ?), une fois pour l'orthographe et les points. On ne voit pas tout en même temps."

  - id: piege
    type: piege
    mauvaise_idee: "J'écris directement au propre : je gagne du temps, et je n'aurai pas à tout recopier."
    pourquoi_faux: "Sans **brouillon**, les idées arrivent dans le désordre et on ne peut plus rien changer. Le texte au propre se remplit de ratures, et on n'ose plus l'améliorer."
    bonne_idee: "Au brouillon, Emma écrit « on a vu des dinosaures » avant « le bus est arrivé ». Elle numérote ses phrases 2, 1, 3 et recopie au propre dans le bon ordre."
    jules: "Autre piège : refuser de changer son texte après une remarque. Ce n'est pas une punition : même les écrivains réécrivent leurs pages plusieurs fois !"

  - id: exemple-suite
    type: exemple
    situation: "Imagine la suite de ce début d'histoire, en deux phrases : « Le chien de Léo s'arrête devant le vieux puits et se met à aboyer très fort. »"
    calcul: "Je garde les mêmes personnages et le même lieu (Léo, le chien, le puits). Je me demande pourquoi le chien aboie. Suite possible : « Léo se penche : au fond, un petit chat miaule, trempé. Il court chercher son père, qui descend un seau pour le remonter. »"
    conclusion: "La suite est **cohérente** : elle répond à la question posée par le début (pourquoi le chien aboie-t-il ?) et reprend les mêmes personnages."
    jules: "Une suite qui n'a aucun lien avec le début, comme « Ensuite, Léo mange une glace », n'est pas cohérente. Cherche toujours ce que le début laisse en suspens."

  - id: exemple-expliquer
    type: exemple
    situation: "Adam doit expliquer à un élève d'une autre classe comment jouer à « 1, 2, 3, soleil ». Il choisit la forme d'une règle du jeu, avec des étapes."
    calcul: "1. Un joueur se place contre un mur, dos aux autres. 2. Il crie « 1, 2, 3, soleil ! », puis se retourne. 3. Ceux qu'il voit bouger retournent au départ. 4. Le premier qui touche le mur a gagné."
    conclusion: "Pour **expliquer**, Adam utilise des étapes numérotées, dans l'ordre où on les fait, avec des phrases courtes."
    jules: "Pour vérifier ton texte explicatif, fais-le lire à quelqu'un qui ne connaît pas le jeu. S'il arrive à jouer sans te poser de question, c'est gagné."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : raconte ton dernier mercredi en 4 phrases, au brouillon d'abord. Numérote-les, ajoute « d'abord, ensuite, puis, enfin », puis recopie au propre."
