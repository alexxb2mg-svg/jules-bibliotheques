<svg width="100%" viewBox="0 0 680 476" xmlns="http://www.w3.org/2000/svg"><title>Vers, strophes, rimes et syllabes : un poème en couleurs</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="120.0" y="18.0" text-anchor="start" dominant-baseline="central" font-weight="700">Premier flocon</text>
<text class="ts" x="236.0" y="18.0" text-anchor="start" dominant-baseline="central">(poème inventé pour cette fiche)</text>
<text class="tl" x="120" y="52" text-anchor="start" dominant-baseline="central">Un flocon tout pe<tspan fill="#185FA5" font-weight="700">tit</tspan></text>
<text class="tl" x="446.0" y="52.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">i</text>
<circle cx="508.0" cy="52.0" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="508.0" y="52.0" text-anchor="middle" dominant-baseline="central">6</text>
<text class="tl" x="120" y="84" text-anchor="start" dominant-baseline="central">Descend sur mon cha<tspan fill="#C2410C" font-weight="700">peau,</tspan></text>
<text class="tl" x="446.0" y="84.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">o</text>
<circle cx="508.0" cy="84.0" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="508.0" y="84.0" text-anchor="middle" dominant-baseline="central">6</text>
<text class="tl" x="120" y="116" text-anchor="start" dominant-baseline="central">Il fait un bruit jo<tspan fill="#185FA5" font-weight="700">li,</tspan></text>
<text class="tl" x="446.0" y="116.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">i</text>
<circle cx="508.0" cy="116.0" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="508.0" y="116.0" text-anchor="middle" dominant-baseline="central">6</text>
<text class="tl" x="120" y="148" text-anchor="start" dominant-baseline="central">Plus doux qu'un pas d'oi<tspan fill="#C2410C" font-weight="700">seau.</tspan></text>
<text class="tl" x="446.0" y="148.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">o</text>
<circle cx="508.0" cy="148.0" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="508.0" y="148.0" text-anchor="middle" dominant-baseline="central">6</text>
<text class="tl" x="120" y="204" text-anchor="start" dominant-baseline="central">Le ciel est un mou<tspan fill="#185FA5" font-weight="700">lin</tspan></text>
<text class="tl" x="446.0" y="204.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">in</text>
<circle cx="508.0" cy="204.0" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="508.0" y="204.0" text-anchor="middle" dominant-baseline="central">6</text>
<text class="tl" x="120" y="236" text-anchor="start" dominant-baseline="central">Qui moud du blanc su<tspan fill="#C2410C" font-weight="700">cré,</tspan></text>
<text class="tl" x="446.0" y="236.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">é</text>
<circle cx="508.0" cy="236.0" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="508.0" y="236.0" text-anchor="middle" dominant-baseline="central">6</text>
<text class="tl" x="120" y="268" text-anchor="start" dominant-baseline="central">Et dès le grand ma<tspan fill="#185FA5" font-weight="700">tin</tspan></text>
<text class="tl" x="446.0" y="268.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">in</text>
<circle cx="508.0" cy="268.0" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="508.0" y="268.0" text-anchor="middle" dominant-baseline="central">6</text>
<text class="tl" x="120" y="300" text-anchor="start" dominant-baseline="central">Mon jardin est pou<tspan fill="#C2410C" font-weight="700">dré.</tspan></text>
<text class="tl" x="446.0" y="300.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">é</text>
<circle cx="508.0" cy="300.0" r="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="508.0" y="300.0" text-anchor="middle" dominant-baseline="central">6</text>
<text class="ts" x="446.0" y="30.0" text-anchor="middle" dominant-baseline="central">rime</text>
<text class="ts" x="508.0" y="30.0" text-anchor="middle" dominant-baseline="central">syllabes</text>
<path d="M92.0 38.0 Q100.0 38.0 100.0 46.0 L100.0 94.0 Q100.0 100.0 108.0 100.0 Q100.0 100.0 100.0 106.0 L100.0 154.0 Q100.0 162.0 92.0 162.0" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="th" x="52.0" y="90.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">strophe</text>
<text class="th" x="52.0" y="110.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">1</text>
<path d="M92.0 190.0 Q100.0 190.0 100.0 198.0 L100.0 246.0 Q100.0 252.0 108.0 252.0 Q100.0 252.0 100.0 258.0 L100.0 306.0 Q100.0 314.0 92.0 314.0" fill="none" stroke="#534AB7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="th" x="52.0" y="242.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">strophe</text>
<text class="th" x="52.0" y="262.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">2</text>
<text class="th" x="572.0" y="60.0" text-anchor="start" dominant-baseline="central" fill="#534AB7">vers :</text>
<text class="t" x="572.0" y="79.0" text-anchor="start" dominant-baseline="central">une ligne</text>
<text class="t" x="572.0" y="98.0" text-anchor="start" dominant-baseline="central">du poème</text>
<text class="th" x="572.0" y="150.0" text-anchor="start" dominant-baseline="central" fill="#534AB7">strophe :</text>
<text class="t" x="572.0" y="169.0" text-anchor="start" dominant-baseline="central">un groupe</text>
<text class="t" x="572.0" y="188.0" text-anchor="start" dominant-baseline="central">de vers</text>
<text class="th" x="572.0" y="240.0" text-anchor="start" dominant-baseline="central" fill="#534AB7">rime :</text>
<text class="t" x="572.0" y="259.0" text-anchor="start" dominant-baseline="central">le même son</text>
<text class="t" x="572.0" y="278.0" text-anchor="start" dominant-baseline="central">à la fin</text>
<text class="t" x="572.0" y="297.0" text-anchor="start" dominant-baseline="central">des vers</text>
<rect x="20.0" y="334.0" width="640.0" height="132.0" rx="10" fill="#F6F5F0" stroke="#D3D1C7" stroke-width="1"/>
<text class="t" x="340.0" y="354.0" text-anchor="middle" dominant-baseline="central">Le vers 1 compté en tapant dans les mains : une syllabe, un clap.</text>
<text class="th" x="70.0" y="380.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">1</text>
<rect x="36.0" y="394.0" width="68.0" height="44.0" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="1.5"/>
<text class="tl" x="70.0" y="416.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">Un</text>
<text class="th" x="152.0" y="380.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">2</text>
<rect x="118.0" y="394.0" width="68.0" height="44.0" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="1.5"/>
<text class="tl" x="152.0" y="416.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">flo</text>
<text class="th" x="234.0" y="380.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">3</text>
<rect x="200.0" y="394.0" width="68.0" height="44.0" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="1.5"/>
<text class="tl" x="234.0" y="416.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">con</text>
<text class="th" x="316.0" y="380.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">4</text>
<rect x="282.0" y="394.0" width="68.0" height="44.0" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="1.5"/>
<text class="tl" x="316.0" y="416.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">tout</text>
<text class="th" x="398.0" y="380.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">5</text>
<rect x="364.0" y="394.0" width="68.0" height="44.0" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="1.5"/>
<text class="tl" x="398.0" y="416.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">pe</text>
<text class="th" x="480.0" y="380.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">6</text>
<rect x="446.0" y="394.0" width="68.0" height="44.0" rx="8" fill="#ffffff" stroke="#534AB7" stroke-width="1.5"/>
<text class="tl" x="480.0" y="416.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">tit</text>
<text class="tx" x="590.0" y="416.0" text-anchor="start" dominant-baseline="central" fill="#534AB7">= 6</text>
<text class="ts" x="340.0" y="454.0" text-anchor="middle" dominant-baseline="central">Les 8 vers ont chacun 6 syllabes : c'est ce qui donne au poème son rythme régulier.</text>
</svg>
