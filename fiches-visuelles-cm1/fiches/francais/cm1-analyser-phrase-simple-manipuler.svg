<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg"><title>Déplacer et supprimer les groupes pour distinguer COD, COI et compléments circonstanciels</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Déplacer, supprimer : qui peut bouger ?</text>
<text x="20.0" y="62.0" font-size="16" fill="#7048E8" font-weight="700" text-anchor="start" dominant-baseline="central">1. J'enlève les compléments circonstanciels :</text>
<text x="60.0" y="94.0" font-size="20" fill="#A99BE6" font-weight="600" text-anchor="start" dominant-baseline="central">Chaque soir,</text>
<text x="200.4" y="94.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Léa promène</text>
<rect x="341.6" y="78.5" width="107.1" height="31.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="346.6" y="94.0" font-size="20" fill="#2B8A3E" font-weight="600" text-anchor="start" dominant-baseline="central">son chien</text>
<text x="457.8" y="94.0" font-size="20" fill="#A99BE6" font-weight="600" text-anchor="start" dominant-baseline="central">au parc</text>
<line x1="58.0" y1="94.0" x2="188.4" y2="94.0" stroke="#7048E8" stroke-width="2.2" stroke-linecap="round"/>
<line x1="455.8" y1="94.0" x2="535.7" y2="94.0" stroke="#7048E8" stroke-width="2.2" stroke-linecap="round"/>
<path d="M27.2 94.0 L33.8 100.6 L45.9 86.3" fill="none" stroke="#2B8A3E" stroke-width="3.3000000000000003" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60.0" y="124.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Il reste « Léa promène son chien. » : </tspan><tspan fill="#2B8A3E">la phrase est correcte.</tspan></text>
<text x="20.0" y="162.0" font-size="16" fill="#7048E8" font-weight="700" text-anchor="start" dominant-baseline="central">2. Je déplace les compléments circonstanciels :</text>
<rect x="55.0" y="178.5" width="93.9" height="31.0" rx="8" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.6"/>
<text x="60.0" y="194.0" font-size="20" fill="#7048E8" font-weight="600" text-anchor="start" dominant-baseline="central">Au parc,</text>
<rect x="152.9" y="178.5" width="134.0" height="31.0" rx="8" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.6"/>
<text x="157.9" y="194.0" font-size="20" fill="#7048E8" font-weight="600" text-anchor="start" dominant-baseline="central">chaque soir,</text>
<text x="296.0" y="194.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Léa promène</text>
<rect x="437.2" y="178.5" width="107.1" height="31.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="442.2" y="194.0" font-size="20" fill="#2B8A3E" font-weight="600" text-anchor="start" dominant-baseline="central">son chien</text>
<text x="546.4" y="194.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">.</text>
<path d="M27.2 194.0 L33.8 200.6 L45.9 186.3" fill="none" stroke="#2B8A3E" stroke-width="3.3000000000000003" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60.0" y="224.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Ils changent de place : </tspan><tspan fill="#2B8A3E">la phrase est encore correcte.</tspan></text>
<text x="20.0" y="262.0" font-size="16" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">3. J'enlève le COD :</text>
<rect x="55.0" y="278.5" width="136.4" height="31.0" rx="8" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.6"/>
<text x="60.0" y="294.0" font-size="20" fill="#7048E8" font-weight="600" text-anchor="start" dominant-baseline="central">Chaque soir,</text>
<text x="200.4" y="294.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Léa promène</text>
<text x="346.6" y="294.0" font-size="20" fill="#9CC7A5" font-weight="600" text-anchor="start" dominant-baseline="central">son chien</text>
<rect x="452.8" y="278.5" width="86.0" height="31.0" rx="8" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.6"/>
<text x="457.8" y="294.0" font-size="20" fill="#7048E8" font-weight="600" text-anchor="start" dominant-baseline="central">au parc</text>
<text x="540.7" y="294.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">.</text>
<line x1="344.6" y1="294.0" x2="445.8" y2="294.0" stroke="#C92A2A" stroke-width="2.2" stroke-linecap="round"/>
<line x1="28.3" y1="286.3" x2="43.7" y2="301.7" stroke="#C92A2A" stroke-width="3.3000000000000003" stroke-linecap="round"/>
<line x1="28.3" y1="301.7" x2="43.7" y2="286.3" stroke="#C92A2A" stroke-width="3.3000000000000003" stroke-linecap="round"/>
<text x="60.0" y="324.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Léa promène… qui ? </tspan><tspan fill="#C92A2A">Il manque quelque chose : c'est un complément d'objet.</tspan></text>
<line x1="20.0" y1="355.0" x2="660.0" y2="355.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="378.0" font-size="16" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">COD ou COI ? Regarde s'il y a une préposition.</text>
<text x="30.0" y="416.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Léa promène</text>
<rect x="169.3" y="400.5" width="107.1" height="31.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="174.3" y="416.0" font-size="20" fill="#2B8A3E" font-weight="600" text-anchor="start" dominant-baseline="central">son chien</text>
<text x="278.4" y="416.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">.</text>
<text x="30.0" y="448.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">promène qui ? son chien</text>
<text x="30.0" y="468.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">→ COD : pas de préposition</text>
<line x1="340.0" y1="398.0" x2="340.0" y2="475.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="365.0" y="416.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Léa parle</text>
<text x="466.5" y="416.0" font-size="20" fill="#D9480F" font-weight="600" text-anchor="start" dominant-baseline="central">à</text>
<text x="485.4" y="416.0" font-size="20" fill="#2B8A3E" font-weight="600" text-anchor="start" dominant-baseline="central">son chien</text>
<rect x="460.5" y="400.5" width="128.1" height="31.0" rx="8" fill="none" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="591.6" y="416.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">.</text>
<text x="365.0" y="448.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">parle à qui ? à son chien</text>
<text x="365.0" y="468.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#2B8A3E">→ COI : avec la préposition </tspan><tspan fill="#D9480F">à</tspan></text>
</svg>
