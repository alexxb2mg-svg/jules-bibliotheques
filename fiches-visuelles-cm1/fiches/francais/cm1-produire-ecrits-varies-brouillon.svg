<svg width="100%" viewBox="0 0 680 452" xmlns="http://www.w3.org/2000/svg"><title>Du brouillon corrigé au texte au propre : la sortie au musée</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Mon brouillon, relu et corrigé</text>
<text x="420.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Au propre</text>
<rect x="16.0" y="34.0" width="370.0" height="300.0" rx="4" fill="#FFFDF6" stroke="#b9b6aa" stroke-width="1.2"/>
<line x1="17.0" y1="58.0" x2="385.0" y2="58.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="106.0" x2="385.0" y2="106.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="154.0" x2="385.0" y2="154.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="202.0" x2="385.0" y2="202.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="250.0" x2="385.0" y2="250.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="298.0" x2="385.0" y2="298.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="46.0" y1="35.0" x2="46.0" y2="333.0" stroke="#E8A0A0" stroke-width="1.3" stroke-linecap="butt"/>
<text x="211.0" y="58.0" font-size="16" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">La sortie au musée</text>
<text x="372.0" y="80.0" font-size="13" fill="#2B8A3E" font-weight="700" text-anchor="end" dominant-baseline="central">+ un titre</text>
<text x="60.0" y="126.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">on</text>
<text x="86.0" y="126.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">a</text>
<text x="102.2" y="126.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">vu</text>
<text x="126.5" y="126.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">des</text>
<text x="161.1" y="126.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">dinosaures</text>
<text x="256.3" y="126.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">au</text>
<text x="282.7" y="126.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">musé</text>
<circle cx="32.0" cy="126.0" r="11" fill="#FFFFFF" stroke="#7048E8" stroke-width="1.8"/>
<text x="32.0" y="126.0" font-size="14" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<line x1="58.0" y1="126.0" x2="82.3" y2="126.0" stroke="#C92A2A" stroke-width="2.2" stroke-linecap="round"/>
<text x="70.2" y="100.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">Ensuite, on</text>
<ellipse cx="304.9" cy="126.0" rx="28.2" ry="12" fill="none" stroke="#C92A2A" stroke-width="1.8"/>
<text x="304.9" y="102.0" font-size="15" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">musée</text>
<text x="337.2" y="128.0" font-size="22" fill="#C92A2A" font-weight="700" text-anchor="start" dominant-baseline="central">.</text>
<text x="60.0" y="222.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">Le</text>
<text x="85.4" y="222.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">bus</text>
<text x="120.5" y="222.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">est</text>
<text x="151.4" y="222.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">arrivé</text>
<text x="203.3" y="222.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">à</text>
<text x="219.5" y="222.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">9 h.</text>
<circle cx="32.0" cy="222.0" r="11" fill="#FFFFFF" stroke="#7048E8" stroke-width="1.8"/>
<text x="32.0" y="222.0" font-size="14" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<line x1="58.0" y1="222.0" x2="81.7" y2="222.0" stroke="#C92A2A" stroke-width="2.2" stroke-linecap="round"/>
<text x="69.8" y="196.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">D'abord, le</text>
<text x="60.0" y="318.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">Après</text>
<text x="112.1" y="318.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">on</text>
<text x="138.2" y="318.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">a</text>
<text x="154.3" y="318.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">mangé</text>
<text x="216.8" y="318.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">dans</text>
<text x="262.3" y="318.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">le</text>
<text x="282.9" y="318.0" font-size="17" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">parc</text>
<circle cx="32.0" cy="318.0" r="11" fill="#FFFFFF" stroke="#7048E8" stroke-width="1.8"/>
<text x="32.0" y="318.0" font-size="14" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<line x1="58.0" y1="318.0" x2="108.4" y2="318.0" stroke="#C92A2A" stroke-width="2.2" stroke-linecap="round"/>
<text x="83.2" y="292.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">Enfin,</text>
<polyline points="208.9,334.0 213.9,324.0 218.9,334.0" fill="none" stroke="#2B8A3E" stroke-width="2" stroke-linejoin="round"/>
<text x="213.9" y="292.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">notre pique-nique</text>
<text x="323.6" y="320.0" font-size="22" fill="#C92A2A" font-weight="700" text-anchor="start" dominant-baseline="central">.</text>
<rect x="30.0" y="356.0" width="340.0" height="50.0" rx="12" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.5"/>
<polyline points="80.0,356.0 70.0,340.0 100.0,356.0" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="81.5" y1="356.0" x2="98.5" y2="356.0" stroke="#EEE9FD" stroke-width="2.9" stroke-linecap="butt"/>
<text x="200.0" y="372.0" font-size="14" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">Lucas : « Le bus arrive d'abord ! Mets</text>
<text x="200.0" y="391.0" font-size="14" fill="#7048E8" font-weight="700" text-anchor="middle" dominant-baseline="central">les étapes dans l'ordre et relis-toi. »</text>
<text x="20.0" y="434.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#C92A2A" font-weight="700">rouge</tspan><tspan fill="#1a1a18"> : orthographe, point</tspan></text>
<text x="230.3" y="434.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#2B8A3E" font-weight="700">vert</tspan><tspan fill="#1a1a18"> : ajouter, remplacer</tspan></text>
<text x="428.7" y="434.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#7048E8" font-weight="700">violet</tspan><tspan fill="#1a1a18"> : l'ordre des idées</tspan></text>
<path d="M390.0 190.0 L410.0 190.0" fill="none" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<rect x="414.0" y="34.0" width="250.0" height="300.0" rx="4" fill="#FFFFFF" stroke="#b9b6aa" stroke-width="1.2"/>
<line x1="415.0" y1="74.0" x2="663.0" y2="74.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="415.0" y1="108.0" x2="663.0" y2="108.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="415.0" y1="142.0" x2="663.0" y2="142.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="415.0" y1="176.0" x2="663.0" y2="176.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="415.0" y1="210.0" x2="663.0" y2="210.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="415.0" y1="244.0" x2="663.0" y2="244.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="415.0" y1="278.0" x2="663.0" y2="278.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="415.0" y1="312.0" x2="663.0" y2="312.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<text x="539.0" y="56.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">La sortie au musée</text>
<text x="426.0" y="90.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#2B8A3E" font-weight="700">D'abord</tspan><tspan fill="#1a1a18">, le bus est arrivé</tspan></text>
<text x="426.0" y="124.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">à 9 h. </tspan><tspan fill="#2B8A3E" font-weight="700">Ensuite</tspan><tspan fill="#1a1a18">, on a vu</tspan></text>
<text x="426.0" y="158.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">des dinosaures au </tspan><tspan fill="#C92A2A" font-weight="700">musée</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="426.0" y="192.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#2B8A3E" font-weight="700">Enfin</tspan><tspan fill="#1a1a18">, on a mangé</tspan></text>
<text x="426.0" y="226.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#2B8A3E" font-weight="700">notre pique-nique</tspan></text>
<text x="426.0" y="260.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">dans le parc.</tspan></text>
<text x="539.0" y="356.0" font-size="14" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">Les idées sont dans l'ordre,</text>
<text x="539.0" y="374.0" font-size="14" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">et plus aucune erreur.</text>
</svg>
