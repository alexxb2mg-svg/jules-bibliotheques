notion: cm1-lecture-expressive
titre: "Lire à voix haute avec expression : la ponctuation et les indices guident ta voix"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 3", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 4", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: ponctuation
    type: formule
    expression: "La voix : [.] descend,  [?] monte,  [!] s'anime"
    termes:
      ".": {couleur: gris, legende: "le **point** : la phrase est finie, la voix redescend et tu fais une pause"}
      "?": {couleur: bleu, legende: "le **point d'interrogation** : on pose une question, la voix monte sur le dernier mot"}
      "!": {couleur: orange, legende: "le **point d'exclamation** : surprise, joie, colère ou peur. La voix est plus forte, plus vivante."}
    jules: "Avant de lire une phrase à voix haute, jette un coup d'œil à sa fin : c'est le signe de ponctuation qui te dit quelle voix prendre dès le premier mot."

  - id: carte
    type: carte
    noeuds:
      - {id: expressif, titre: "Lire avec expression", sous_titre: "faire vivre un texte qu'on a déjà préparé", principal: true}
      - {id: ponct, titre: "La ponctuation", sous_titre: "la voix descend au point, monte à la question, s'anime à l'exclamation"}
      - {id: groupes, titre: "Les groupes de sens", sous_titre: "des pauses aux bons endroits, sans couper les mots qui vont ensemble"}
      - {id: volume, titre: "Le volume et le débit", sous_titre: "plus fort ou plus doux, plus vite ou plus lentement"}
      - {id: persos, titre: "Les personnages", sous_titre: "une voix pour chacun dans les dialogues"}
    liens:
      - {de: expressif, vers: ponct}
      - {de: expressif, vers: groupes}
      - {de: expressif, vers: volume}
      - {de: expressif, vers: persos}
    jules: "Le **débit**, c'est la vitesse à laquelle tu parles. Un bon lecteur ne lit pas pour lui : il lit pour que ceux qui écoutent comprennent et voient l'histoire."

  - id: schema-trois-voix
    type: schema
    titre: "« Tu as mangé tout le gâteau » : un point, une question, une exclamation"
    svg: "cm1-lecture-expressive.svg"
    jules: "Les mots sont exactement les mêmes dans les trois phrases. Seul le signe de la fin change, et pourtant le sens n'est plus du tout le même : c'est ta voix qui le fait entendre."

  - id: schema-indices
    type: schema
    titre: "Un petit dialogue : six indices qui disent comment lire"
    svg: "cm1-lecture-expressive-indices.svg"
    jules: "Les verbes placés après une réplique (chuchota, cria, soupira) sont de précieux indices : ils te disent comment le personnage parle. Toi, tu lis ces petits morceaux d'une voix normale, celle du narrateur."

  - id: methode
    type: methode
    etapes:
      - "Lis le texte **plusieurs fois** pour toi, avant de le lire aux autres."
      - "Repère les points d'exclamation, les points d'interrogation et les **tirets** des dialogues."
      - "Choisis où faire des **pauses** : à la ponctuation et entre les groupes de mots qui vont ensemble."
      - "Entraîne-toi à voix haute en changeant le volume et la vitesse selon les personnages et les émotions."
      - "Fais-toi écouter par quelqu'un : vérifie qu'il comprend l'histoire sans voir le texte."
    jules: "Un truc de comédien : enregistre-toi avec une tablette ou un téléphone, puis réécoute. Tu entendras tout de suite si ta voix monte bien sur les questions."

  - id: piege
    type: piege
    mauvaise_idee: "Je lis tout le texte sur le même ton, comme un robot : « Au secours ! Le loup est là ! » d'une voix plate et régulière."
    pourquoi_faux: "Avec une voix plate, ceux qui écoutent n'entendent pas que le personnage **a peur**. Le point d'exclamation est là pour être entendu."
    bonne_idee: "Je lis « Au secours ! » plus fort et plus vite, avec une **voix inquiète**, puis je fais une petite pause avant « Le loup est là ! »."
    jules: "Autre piège : lire très vite pour avoir fini plus tôt. Ceux qui écoutent décrochent : garde un rythme régulier, un peu plus lent que quand tu parles."

  - id: exemple-dialogue
    type: exemple
    situation: "Lou doit lire ce dialogue à la classe : « — Tu viens jouer au foot ? demanda Malik. — Pas maintenant ! répondit Inès. Je finis mon dessin… »"
    calcul: "Réplique de Malik : la voix monte sur « foot ? ». Réplique d'Inès : une autre voix, plus forte sur « Pas maintenant ! », puis plus lente sur « mon dessin… ». « demanda Malik » et « répondit Inès » : voix normale du narrateur."
    conclusion: "Rien qu'en écoutant, la classe reconnaît **deux personnages** différents et comprend qu'Inès est occupée."
    jules: "Pour distinguer deux personnages, pas besoin d'imiter : une voix un peu plus grave pour l'un, un peu plus aiguë pour l'autre suffit."

  - id: exemple-suspense
    type: exemple
    situation: "Adam lit la fin de son histoire au coin lecture : « Dans le grenier, quelque chose bougea… Lentement, la porte s'ouvrit. »"
    calcul: "Il baisse un peu le **volume** et **ralentit** : « Dans le grenier, » (pause) « quelque chose bougea… » (longue pause) « Lentement, » (pause) « la porte s'ouvrit. »"
    conclusion: "Les pauses et la voix plus basse créent le **suspense** : tout le monde attend la suite. Adam parle quand même assez fort pour être entendu du fond de la classe."
    jules: "Parler plus bas ne veut pas dire chuchoter : ta voix doit toujours arriver jusqu'au dernier rang. Lève les yeux de temps en temps vers ceux qui t'écoutent."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Jeu à faire en famille : dis « Il pleut » avec un point, puis avec un point d'interrogation, puis avec un point d'exclamation. Les autres doivent deviner quel signe tu as choisi."
