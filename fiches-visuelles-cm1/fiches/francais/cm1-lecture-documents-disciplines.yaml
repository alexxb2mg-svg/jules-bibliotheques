      - {de: document, vers: source}
      - {de: document, vers: composite}
      - {de: document, vers: question}
    jules: "Un document **composite**, c'est un document fait de plusieurs morceaux, comme une page de ton manuel. « Composite » veut dire « composé de plusieurs parties »."

  - id: schema-page
    type: schema
    titre: "Une page de manuel de sciences : six parties, un ordre pour les lire"
    svg: "cm1-lecture-documents-disciplines.svg"
    jules: "Sur une page de manuel, on ne lit pas forcément tout de haut en bas. On part de la question, puis le titre, les images et leurs légendes : ce sont eux qui disent où chercher."

  - id: schema-nature
    type: schema
    titre: "Six natures de documents à reconnaître d'un coup d'œil"
    svg: "cm1-lecture-documents-disciplines-nature.svg"
    jules: "Une photographie montre la réalité, un schéma la simplifie pour expliquer. Un nuage avec des flèches, ce n'est pas une photo du ciel : c'est un schéma du trajet de l'eau."

  - id: methode
    type: methode
    etapes:
      - "Dis la **nature** du document : texte, photographie, schéma, tableau, graphique, carte."
      - "Cherche sa **source**, souvent écrite en petit dessous : auteur, livre, site, date."
      - "Lis la **question** avant de chercher dans le document."
      - "Parcours le document en t'aidant du titre et des légendes, pour trouver l'endroit utile."
      - "Réponds en disant où tu as trouvé l'information : « dans le Doc. 2, le graphique »."
    jules: "Pas besoin de tout lire pour répondre : si la question parle de la hauteur de la tige, le graphique « Hauteur de la tige » est le bon endroit."

  - id: piege
    type: piege
    mauvaise_idee: "Je regarde seulement le dessin du Doc. 1 : la plante a l'air grande, je réponds qu'elle mesure 30 cm."
    pourquoi_faux: "Un dessin n'est pas à la taille réelle. Je n'ai lu ni la **légende** ni le graphique, qui donnent les vraies mesures."
    bonne_idee: "Je lis la légende et le graphique : au 10e jour, la tige mesure **9 cm**, pas 30 cm."
    jules: "Autre piège : confondre la nature des documents, par exemple dire « le texte » en parlant du tableau. Nomme bien chaque partie avant de répondre."

  - id: exemple-haricot
    type: exemple
    situation: "Question de Chloé sur la page du haricot : « Combien mesure la tige au 8e jour ? Et quelle partie sort en premier de la graine ? »"
    calcul: "Pour la mesure, je vais au Doc. 2, le **graphique** : la barre du jour 8 monte jusqu'à 6. Pour la partie qui sort en premier, je vais au Doc. 1 : la **légende** dit « La racine sort en premier »."
    conclusion: "Au 8e jour, la tige mesure **6 cm**. C'est la **racine** qui sort en premier. Deux réponses, trouvées dans deux parties différentes du même document composite."
    jules: "Pour lire une barre, suis son sommet avec ton doigt jusqu'à l'axe des nombres, à gauche. Vérifie aussi l'unité écrite en haut de l'axe : ici, des centimètres."

  - id: exemple-source
    type: exemple
    situation: "En histoire, Sami trouve sous une image : « Photographie du château de la ville, prise par la classe de CM1 en octobre 2025 ». Quelle est la nature du document ? Quelle est sa source ?"
    calcul: "Nature : c'est une **photographie**, une image prise en vrai. Source : la classe de CM1, en octobre 2025. C'est écrit dans la phrase sous l'image."
    conclusion: "Sami peut écrire : « Doc. : photographie du château, source : classe de CM1, octobre 2025 »."
    jules: "La source te dit si tu peux faire confiance au document et de quand il date. Une photo de 2025 montre le château d'aujourd'hui, pas celui du Moyen Âge."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : ouvre ton manuel de sciences ou d'histoire à n'importe quelle page. Pour chaque document, dis sa nature et cherche sa source, écrite en petit : presque chaque document a la sienne."
