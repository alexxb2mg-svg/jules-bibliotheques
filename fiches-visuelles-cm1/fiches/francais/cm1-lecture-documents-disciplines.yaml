blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: document, titre: "Lire un document", sous_titre: "pour apprendre en sciences, en histoire, en géographie", principal: true}
      - {id: nature, titre: "Sa nature", sous_titre: "texte, photo, schéma, tableau, graphique ou carte"}
      - {id: source, titre: "Sa source", sous_titre: "qui l'a fait, d'où il vient, quand : souvent en petit, dessous"}
      - {id: composite, titre: "Le document composite", sous_titre: "plusieurs parties à relier : texte, image, graphique"}
