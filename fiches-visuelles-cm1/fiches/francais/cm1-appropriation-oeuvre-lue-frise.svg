<text x="70.0" y="180.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Mila arrive</text>
<text x="70.0" y="198.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">sur l'île, chez</text>
<text x="70.0" y="216.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">tante Rose.</text>
