<circle cx="502.0" cy="150.0" r="13" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="502.0" y="150.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
<text x="502.0" y="180.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Tempête :</text>
<text x="502.0" y="198.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">ils rallument</text>
<text x="502.0" y="216.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">le phare.</text>
<polygon points="588.0,108.0 632.0,108.0 625.0,120.0 595.0,120.0" fill="#8a5a2b" stroke="#1a1a18" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="610.0" y1="108.0" x2="610.0" y2="78.0" stroke="#1a1a18" stroke-width="1.5" stroke-linecap="round"/>
<polygon points="612.0,80.0 612.0,104.0 630.0,104.0" fill="#FFFFFF" stroke="#1a1a18" stroke-width="1" stroke-linejoin="round"/>
<path d="M572 124 Q590 118 610 124 T648 124" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="610.0" cy="150.0" r="13" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="610.0" y="150.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text>
<text x="610.0" y="180.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Mila repart</text>
<text x="610.0" y="198.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">et promet</text>
<text x="610.0" y="216.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">de revenir.</text>
<path d="M20 244 Q20 252 28 252 L62.0 252 Q70.0 252 70.0 260 Q70.0 252 78.0 252 L112 252 Q120 252 120 244" fill="none" stroke="#3B6D11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70.0" y="276.0" font-size="15" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">le début</text>
<path d="M128 244 Q128 252 136 252 L332.0 252 Q340.0 252 340.0 260 Q340.0 252 348.0 252 L544 252 Q552 252 552 244" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="340.0" y="276.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">les péripéties : ce qui arrive</text>
<path d="M560 244 Q560 252 568 252 L602.0 252 Q610.0 252 610.0 260 Q610.0 252 618.0 252 L652 252 Q660 252 660 244" fill="none" stroke="#3B6D11" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="610.0" y="276.0" font-size="15" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">la fin</text>
<text x="340.0" y="330.0" font-size="13.5" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Six cases suffisent pour garder en mémoire toute une histoire.</text>
