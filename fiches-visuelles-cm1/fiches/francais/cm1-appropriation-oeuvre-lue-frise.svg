<text x="178.0" y="180.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Sur la plage,</text>
<text x="178.0" y="198.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">elle trouve une</text>
<text x="178.0" y="216.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">vieille clé.</text>
