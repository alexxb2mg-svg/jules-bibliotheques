<line x1="192.0" y1="100.0" x2="192.0" y2="109.0" stroke="#8a6d2b" stroke-width="4" stroke-linecap="butt"/>
<line x1="198.0" y1="100.0" x2="198.0" y2="107.0" stroke="#8a6d2b" stroke-width="4" stroke-linecap="butt"/>
<circle cx="178.0" cy="150.0" r="13" fill="#C2410C" stroke="none" stroke-width="1.5"/>
