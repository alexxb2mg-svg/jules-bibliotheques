<polygon points="381.0,78.0 400.0,84.0 400.0,126.0 381.0,120.0" fill="#C98F55" stroke="#1a1a18" stroke-width="1.2" stroke-linejoin="round"/>
<circle cx="396.0" cy="102.0" r="2.4" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="394.0" cy="150.0" r="13" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="394.0" y="150.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text x="394.0" y="180.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">La clé ouvre</text>
<text x="394.0" y="198.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">la porte du</text>
<text x="394.0" y="216.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">phare fermé.</text>
