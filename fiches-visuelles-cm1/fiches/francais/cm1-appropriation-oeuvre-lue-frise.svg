<text x="286.0" y="150.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text x="286.0" y="180.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Elle rencontre</text>
<text x="286.0" y="198.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Ferdinand,</text>
<text x="286.0" y="216.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">le gardien.</text>
