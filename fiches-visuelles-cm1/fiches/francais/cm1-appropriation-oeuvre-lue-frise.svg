<svg width="100%" viewBox="0 0 680 345" xmlns="http://www.w3.org/2000/svg"><title>La frise des six événements du « Phare aux mouettes »</title>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">La frise des événements : début, péripéties, fin</text>
