notion: cm1-relations-entre-mots
titre: "Les relations entre les mots : synonymes, contraires, familles, mot générique"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 14", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, guide « La grammaire du français — Terminologie grammaticale », p. 173-174", url: "https://eduscol.education.gouv.fr/sites/default/files/document/guide-la-grammaire-du-francais-terminologie-grammaticale-67998.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: morceaux
    type: formule
    expression: "[in] + [cass] + [able] → incassable"
    termes:
      in: {couleur: bleu, legende: "le **préfixe**, placé avant : ici « in- » veut dire « pas »"}
      cass: {couleur: orange, legende: "le **radical**, le cœur du mot, qu'on retrouve dans casser, cassure, casse-noix"}
      able: {couleur: vert, legende: "le **suffixe**, placé après : ici « -able » veut dire « qu'on peut »"}
    jules: "Incassable, c'est donc « qu'on ne peut pas casser ». Avec les mêmes morceaux, tu comprends lavable, mangeable ou invisible."

  - id: carte
    type: carte
    noeuds:
      - {id: liens, titre: "Les mots ont des liens", sous_titre: "par leur sens ou par leur forme", principal: true}
      - {id: synonymes, titre: "Synonymes", sous_titre: "sens proche : jouer et s'amuser"}
      - {id: contraires, titre: "Antonymes (contraires)", sous_titre: "sens opposé : monter et descendre"}
      - {id: famille, titre: "Famille de mots", sous_titre: "même radical : coller, décoller, collage"}
      - {id: generique, titre: "Générique et spécifiques", sous_titre: "fruit : pomme, poire, cerise"}
    liens:
      - {de: liens, vers: synonymes}
      - {de: liens, vers: contraires}
      - {de: liens, vers: famille}
      - {de: liens, vers: generique}
    jules: "Synonymes et contraires se reconnaissent au sens. Une famille se reconnaît à la forme : on voit le même morceau dans tous les mots."

  - id: schema-echelles
    type: schema
    titre: "Synonymes et contraires rangés sur deux échelles : la température et la voix"
    svg: "cm1-relations-entre-mots.svg"
    jules: "Deux synonymes n'ont presque jamais exactement le même sens : l'un est souvent plus fort que l'autre. « Hurler », c'est crier très fort."

  - id: schema-generique
    type: schema
    titre: "Mot générique et mots spécifiques rangés en boîtes : aliments, fruits, légumes"
    svg: "cm1-relations-entre-mots-generique.svg"
    jules: "Le mot générique évite les répétitions : « J'ai acheté des pommes, des poires et des cerises. Ces fruits sont délicieux. »"

  - id: schema-affixes
    type: schema
    titre: "Préfixes et suffixes en couleur : la famille de coller"
    svg: "cm1-relations-entre-mots-affixes.svg"
    jules: "Un préfixe comme « dé- » ou « im- » fabrique souvent un contraire : décoller est l'antonyme de coller, impossible celui de possible."

  - id: graphe
    type: graphe
    gabarit: echelle-intensite
    curseurs:
      - {id: curseur-serie, nom: serie, min: 1, max: 2, pas: 1, depart: 1}
      - {id: curseur-degre, nom: degre, min: 0, max: 4, pas: 1, depart: 1}
    lectures:
      - {si: "serie == 1 && degre <= 1", texte: "En bas de l'échelle : glacé, froid. Leur **antonyme** (le contraire) s'allume en orange en haut : chaud, brûlant."}
      - {si: "serie == 2 && degre <= 1", texte: "En bas de l'échelle : minuscule, petit. Leur **antonyme** (le contraire) s'allume en orange en haut : grand, immense."}
      - {si: "degre == 2", texte: "Au milieu : un mot **nuancé**, ni à un bout ni à l'autre, qui n'a pas vraiment de contraire."}
      - {si: "degre >= 3", texte: "En haut de l'échelle : deux mots voisins sont presque des **synonymes**. Leur contraire s'allume en orange en bas."}
    jules: "Serie 1 parle de température, serie 2 de taille. Monte degre une case à la fois : chaque mot est un peu plus fort que celui du dessous."

  - id: methode
    type: methode
    etapes:
      - "Je regarde la **classe** du mot de départ : un nom, un verbe ou un adjectif ?"
      - "Pour un **synonyme**, je cherche un mot de sens proche, de la même classe."
      - "Pour un **contraire**, je cherche un mot de sens opposé, de la même classe."
      - "Pour une famille, je cherche le morceau commun à tous les mots : le **radical**."
      - "Je remplace le mot dans la phrase : si la phrase garde un sens, c'est bon. En cas de doute, je vérifie dans le dictionnaire."
    jules: "Le test du remplacement ne ment pas : « Le chat saute sur le mur » devient « Le chat bondit sur le mur ». La phrase marche, donc bondir est un synonyme de sauter."

  - id: piege
    type: piege
    mauvaise_idee: "Un synonyme de « courir » ? Je propose « rapide »."
    pourquoi_faux: "« Courir » est un **verbe**, « rapide » est un **adjectif**. Essaie de remplacer : « Le chien rapide dans le jardin » ne veut rien dire."
    bonne_idee: "Je cherche un verbe : « foncer » ou « filer ». « Le chien file dans le jardin » : la phrase garde son sens."
    jules: "Autre piège : croire que les contraires sont toujours deux bouts opposés. Entre chaud et froid, il y a tiède, qui n'est ni l'un ni l'autre."

  - id: exemple-joyeux
    type: exemple
    situation: "Trouve un synonyme et un contraire de l'adjectif « joyeux » dans la phrase : « Le clown est joyeux. »"
    calcul: "Je cherche des adjectifs. Sens proche : gai, content. Sens opposé : triste. Je remplace pour vérifier : « Le clown est gai. » « Le clown est triste. »"
    conclusion: "Synonyme : **gai** (ou content). Contraire : **triste**. Tous sont des adjectifs, comme « joyeux »."
    jules: "Et « joie » ? C'est un nom de la même famille que joyeux, pas un synonyme. Ne mélange pas les deux relations !"

  - id: exemple-trier
    type: exemple
    situation: "Range ces mots : chanter, chanson, chanteur, fredonner. Lesquels sont de la même famille ? Lequel est un synonyme de chanter ?"
    calcul: "Chanter, chanson, chanteur ont le même radical « chant » : c'est une famille. « Fredonner » ne lui ressemble pas, mais il veut dire chanter doucement, bouche fermée."
    conclusion: "Famille de chanter : **chanson**, **chanteur**. Synonyme de chanter : **fredonner** (un verbe, sens proche)."
    jules: "Même famille : les mots se ressemblent à l'œil. Synonymes : ils ne se ressemblent pas forcément, mais ils veulent dire presque la même chose."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine une échelle de « minuscule » à « gigantesque » avec au moins 5 adjectifs (petit, moyen, grand…). Entoure deux contraires en rouge."
