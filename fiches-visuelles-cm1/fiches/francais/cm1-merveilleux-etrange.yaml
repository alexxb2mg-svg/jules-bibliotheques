notion: cm1-merveilleux-etrange
titre: "Le merveilleux et l'étrange : quand l'impossible entre dans l'histoire"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 6", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: deux-mondes
    type: formule
    expression: "[merveilleux] : la magie est normale · [étrange] : l'impossible inquiète"
    termes:
      merveilleux: {couleur: violet, legende: "dans un monde lointain, fées et objets magiques existent. Les personnages ne s'en étonnent pas : c'est le monde des **contes**."}
      "étrange": {couleur: orange, legende: "dans un monde comme le nôtre, il arrive une chose impossible. Personne ne peut l'expliquer : on **doute** et on a peur."}
    jules: "Pose-toi une seule question : est-ce que le personnage trouve ça normal ? S'il dit merci à la fée, c'est du merveilleux ; s'il tremble et se demande s'il rêve, c'est de l'étrange."

  - id: carte
    type: carte
    noeuds:
      - {id: impossible, titre: "Ce qui n'existe pas en vrai", sous_titre: "une magie, une créature, un événement impossible", principal: true}
      - {id: merveilleux, titre: "Le merveilleux", sous_titre: "« Il était une fois » : fées, ogres, objets magiques"}
      - {id: etrange, titre: "L'étrange", sous_titre: "chez nous, un soir, une chose inexplicable"}
      - {id: sentiments, titre: "Ce qu'on ressent", sous_titre: "la peur, la curiosité, l'envie de s'évader"}
      - {id: inventer, titre: "Inventer à son tour", sous_titre: "un objet magique, une horloge qui parle…"}
    liens:
      - {de: impossible, vers: merveilleux}
      - {de: impossible, vers: etrange}
      - {de: impossible, vers: sentiments}
      - {de: impossible, vers: inventer}
    jules: "Les deux parlent de choses impossibles. La différence, c'est l'effet : le merveilleux fait rêver, l'étrange donne des frissons."

  - id: schema-comparer
    type: schema
    titre: "Merveilleux ou étrange : le personnage accepte la magie, ou il a peur"
    svg: "cm1-merveilleux-etrange.svg"
    jules: "Regarde les visages : Cendrillon sourit devant son carrosse, Théo ouvre de grands yeux dans son lit. Le même impossible, deux réactions opposées."

  - id: schema-ingredients
    type: schema
    titre: "Les ingrédients du merveilleux : formules, objets magiques et créatures"
    svg: "cm1-merveilleux-etrange-ingredients.svg"
    jules: "Ces contes viennent de Charles Perrault et des frères Grimm. Tu peux en inventer un en piochant une formule, un objet magique et une créature."

  - id: methode
    type: methode
    etapes:
      - "Cherche ce qui n'existe pas dans la **réalité** : un objet magique, une créature, une transformation, un bruit que personne n'explique."
      - "Regarde le monde de l'histoire : un royaume lointain (« Il était une fois ») ou un lieu comme chez toi (une maison, une école, aujourd'hui) ?"
      - "Observe le personnage : trouve-t-il la magie normale (**merveilleux**) ou a-t-il peur et doute-t-il (**étrange**) ?"
      - "Dis ce que tu ressens en lisant (la peur, la curiosité, l'envie de t'évader) et montre le passage qui te le fait sentir."
    jules: "Dans un récit étrange, l'auteur aime les mots du doute : « soudain », « il me sembla », « impossible », « je crus voir ». Ils t'aident à le repérer."

  - id: piege
    type: piege
    mauvaise_idee: "Dans Le Petit Chaperon rouge, le loup est un animal de la forêt, comme dans la vraie vie : c'est une histoire réaliste."
    pourquoi_faux: "Un vrai loup ne parle pas et ne se déguise pas en grand-mère. Dès qu'un élément impossible est accepté par tous les personnages, on est dans le **merveilleux**."
    bonne_idee: "Pose la question : « Est-ce que ça pourrait arriver en vrai ? » Si la réponse est non et que personne ne s'en étonne, c'est un **conte merveilleux**."
    jules: "Un récit réaliste, c'est l'inverse : tout pourrait arriver, comme une dispute à la cantine ou un match de foot."

  - id: exemple-fees
    type: exemple
    situation: "Dans Les Fées, de Charles Perrault, une jeune fille gentille donne à boire à une vieille femme à la fontaine. C'est une fée déguisée : à chaque mot que la jeune fille prononce, il lui sort de la bouche une fleur ou une pierre précieuse. Merveilleux ou étrange ?"
    calcul: "Des fleurs qui sortent de la bouche : c'est impossible en vrai. Mais personne n'a peur : la mère veut même le même cadeau pour son autre fille."
    conclusion: "C'est du **merveilleux** : dans ce monde, les fées existent et leurs dons paraissent normaux."
    jules: "La sœur méchante, elle, reçoit le don inverse : des crapauds et des serpents à chaque mot. Le merveilleux sert souvent à récompenser les gentils et à punir les méchants."

  - id: exemple-piano
    type: exemple
    situation: "Petit texte : « Dans la maison de vacances, le vieux piano joue trois notes chaque nuit, à minuit pile. Pourtant, la pièce est fermée à clé. Emma se lève, le cœur battant. » Merveilleux ou étrange ?"
    calcul: "Le lieu ressemble à notre monde : une maison, des vacances. Un piano qui joue tout seul, c'est impossible. Emma ne trouve pas ça normal : elle a peur, mais elle veut savoir."
    conclusion: "C'est de l'**étrange** : un monde réel, un événement inexplicable, de la peur et de la **curiosité**."
    jules: "L'auteur ne donne pas l'explication tout de suite, exprès. Tant que tu ne sais pas, tu as envie de lire la suite : c'est le suspense."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : invente un objet de ta trousse qui devient magique. Écris deux phrases où ton personnage le trouve normal, puis deux phrases où il a peur."
