<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Un personnage qui grandit : Pinocchio au début, pendant et à la fin</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="340.0" y="18.0" text-anchor="middle" dominant-baseline="central" font-weight="700">Pinocchio : un pantin de bois qui devient un vrai petit garçon</text>
<rect x="5.0" y="40.0" width="180.0" height="300.0" rx="10" fill="#FBFAF7" stroke="#5F5E5A" stroke-width="1.6"/>
<text class="th" x="95.0" y="60.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">AU DÉBUT</text>
<rect x="250.0" y="40.0" width="180.0" height="300.0" rx="10" fill="#FBFAF7" stroke="#C2410C" stroke-width="1.6"/>
<text class="th" x="340.0" y="60.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">PENDANT</text>
<rect x="495.0" y="40.0" width="180.0" height="300.0" rx="10" fill="#FBFAF7" stroke="#3B6D11" stroke-width="1.6"/>
<text class="th" x="585.0" y="60.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">À LA FIN</text>
