<line x1="592.2" y1="129.0" x2="606.3" y2="156.4" stroke="#1a1a18" stroke-width="4.538461538461538" stroke-linecap="round"/>
<circle cx="578.0" cy="104.5" r="16.520000000000003" fill="#F6D7B8" stroke="#9A6B45" stroke-width="1.4"/>
<polygon points="561.5,96.3 594.5,96.3 581.3,69.8" fill="#3B6D11" stroke="#1a1a18" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="592.9,105.3 598.9,107.8 592.9,110.3" fill="#F6D7B8" stroke="#9A6B45" stroke-width="1.2" stroke-linejoin="round"/>
<circle cx="583.8" cy="102.0" r="2.4" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<path d="M573.0 112.0 Q581.3 117.7 587.9 112.8" fill="none" stroke="#1a1a18" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="585.0" y="234.0" text-anchor="middle" dominant-baseline="central">il sauve son père</text>
<text class="t" x="585.0" y="253.0" text-anchor="middle" dominant-baseline="central">Geppetto et travaille</text>
<text class="t" x="585.0" y="272.0" text-anchor="middle" dominant-baseline="central">pour le soigner</text>
<text class="th" x="95.0" y="306.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">content de lui,</text>
<text class="th" x="95.0" y="324.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">insouciant</text>
<text class="th" x="340.0" y="306.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">la honte,</text>
<text class="th" x="340.0" y="324.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">la peur</text>
<text class="th" x="585.0" y="306.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">la fierté,</text>
<text class="th" x="585.0" y="324.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">l'amour pour son père</text>
<line x1="187.0" y1="150.0" x2="248.0" y2="150.0" stroke="#5f5e5a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fl)"/>
<line x1="432.0" y1="150.0" x2="493.0" y2="150.0" stroke="#5f5e5a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fl)"/>
<line x1="20.0" y1="380.0" x2="650.0" y2="380.0" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fl)"/>
<circle cx="95.0" cy="380.0" r="6" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="340.0" cy="380.0" r="6" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="585.0" cy="380.0" r="6" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text class="t" x="95.0" y="402.0" text-anchor="middle" dominant-baseline="central">il désobéit, il ment</text>
<text class="t" x="340.0" y="402.0" text-anchor="middle" dominant-baseline="central">rencontres : la Fée, le Chat et le Renard</text>
<text class="t" x="585.0" y="402.0" text-anchor="middle" dominant-baseline="central">il a changé</text>
<text class="ts" x="340.0" y="432.0" text-anchor="middle" dominant-baseline="central">Violet : les émotions nommées. Ce qui compte, c'est ce qui change entre le début et la fin.</text>
<text class="ts" x="340.0" y="454.0" text-anchor="middle" dominant-baseline="central">Les Aventures de Pinocchio, roman de Carlo Collodi (1883).</text>
</svg>
