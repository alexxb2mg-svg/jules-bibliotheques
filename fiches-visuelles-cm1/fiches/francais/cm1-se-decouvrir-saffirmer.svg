<text class="t" x="95.0" y="234.0" text-anchor="middle" dominant-baseline="central">un pantin de bois</text>
<text class="t" x="95.0" y="253.0" text-anchor="middle" dominant-baseline="central">qui n'en fait</text>
<text class="t" x="95.0" y="272.0" text-anchor="middle" dominant-baseline="central">qu'à sa tête</text>
<line x1="322.0" y1="161.2" x2="310.2" y2="206.0" stroke="#8B5A2B" stroke-width="4.538461538461538" stroke-linecap="round"/>
<line x1="322.0" y1="161.2" x2="333.8" y2="206.0" stroke="#8B5A2B" stroke-width="4.538461538461538" stroke-linecap="round"/>
