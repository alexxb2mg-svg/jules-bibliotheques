<text class="t" x="340.0" y="234.0" text-anchor="middle" dominant-baseline="central">il ment à la Fée :</text>
<text class="t" x="340.0" y="253.0" text-anchor="middle" dominant-baseline="central">son nez s'allonge</text>
<line x1="578.0" y1="161.2" x2="566.2" y2="206.0" stroke="#1a1a18" stroke-width="4.538461538461538" stroke-linecap="round"/>
<line x1="578.0" y1="161.2" x2="589.8" y2="206.0" stroke="#1a1a18" stroke-width="4.538461538461538" stroke-linecap="round"/>
