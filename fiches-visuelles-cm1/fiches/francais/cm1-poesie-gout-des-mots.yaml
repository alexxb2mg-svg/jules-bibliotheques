relecture: {statut: a_relire}
blocs:
  - id: mots-du-poeme
    type: formule
    expression: "une [strophe] = des [vers] qui finissent par des [rimes]"
    termes:
      strophe: {couleur: violet, legende: "un **groupe de vers**, séparé du suivant par une ligne blanche. « Premier flocon » a 2 strophes de 4 vers."}
      vers: {couleur: gris, legende: "une **ligne** du poème. Il commence souvent par une majuscule, même au milieu d'une phrase."}
      rimes: {couleur: bleu, legende: "le **même son** à la fin de deux vers : petit et joli (i), chapeau et oiseau (o)."}
    jules: "Une rime, c'est un son, pas des lettres : « chapeau » et « oiseau » riment alors qu'ils ne finissent pas pareil à l'écrit."

  - id: carte
    type: carte
    noeuds:
      - {id: poeme, titre: "Un poème", sous_titre: "des mots choisis pour leur sens et pour leur musique", principal: true}
      - {id: forme, titre: "Sa forme", sous_titre: "des vers groupés en strophes"}
      - {id: sons, titre: "Ses sons", sous_titre: "rimes, syllabes comptées, sons qui reviennent"}
      - {id: images, titre: "Ses images", sous_titre: "« le ciel est un moulin » : deux choses rapprochées"}
      - {id: emotion, titre: "Ce qu'on ressent", sous_titre: "la douceur, la tristesse, la joie… sans tout expliquer"}
    liens:
      - {de: poeme, vers: forme}
      - {de: poeme, vers: sons}
      - {de: poeme, vers: images}
      - {de: poeme, vers: emotion}
    jules: "Un poème se lit à voix haute, comme on écoute une chanson. On goûte les sons des mots avant même de tout comprendre."

  - id: schema-poeme
    type: schema
    titre: "Vers, strophes, rimes et syllabes : un poème en couleurs"
    svg: "cm1-poesie-gout-des-mots.svg"
    jules: "Ici, les rimes sont **croisées** : le vers 1 rime avec le 3, le vers 2 avec le 4. Quand deux vers qui se suivent riment, comme dans une comptine, on dit qu'elles sont suivies."

  - id: schema-image
    type: schema
    titre: "Une image poétique : le ciel devient un moulin qui moud la neige"
    svg: "cm1-poesie-gout-des-mots-image.svg"
    jules: "La neige est blanche et fine comme de la farine ou du sucre en poudre. Le poète garde cette ressemblance et invente tout le reste : le ciel qui tourne ses ailes comme un moulin."

  - id: methode
    type: methode
    etapes:
      - "Lis le poème à voix haute une première fois, sans t'arrêter, pour sentir son **ambiance** : calme, triste, joyeuse ?"
      - "Colorie la fin des vers qui ont le même son : ce sont les **rimes**. Compte les syllabes d'un vers en tapant dans tes mains."
      - "Cherche les **images** et les tournures bizarres : un ciel qui moud, un flocon qui fait du bruit. Demande-toi ce qu'elles rapprochent."
      - "Dis ce que le poème te fait ressentir, avec un mot ou un vers précis, même si tu ne comprends pas tout."
    jules: "Dans les poèmes anciens, on compte parfois un « e » qu'on ne prononce plus à l'oral. Pour t'entraîner, commence par des vers comme ceux de « Premier flocon », où chaque syllabe s'entend bien."

  - id: piege
    type: piege
    mauvaise_idee: "« Le ciel est un moulin » : c'est faux, un ciel n'est pas un moulin. Ce poème ne veut rien dire."
    pourquoi_faux: "Un poème ne s'explique pas comme une leçon de sciences. Le poète s'écarte **exprès** du sens habituel des mots pour faire voir les choses autrement."
    bonne_idee: "On cherche ce que l'**image** rapproche : la neige ressemble à de la farine qui tombe d'un moulin. On ressent la douceur et la blancheur de la neige."
    jules: "Autre oubli fréquent : ne pas écouter les sons. Les rimes et les syllabes régulières font aussi partie du sens d'un poème."

  - id: exemple-verlaine
    type: exemple
    situation: "Un poème de Paul Verlaine (1874) commence par deux vers : « Il pleure dans mon cœur », puis « Comme il pleut sur la ville ». Qu'a-t-il de bizarre, ce premier vers ?"
    calcul: "D'habitude, on dit « je pleure » ou « il pleure » en parlant d'une personne. Verlaine écrit « il pleure » comme on écrit « il pleut », sans personne qui pleure. Et « pleure » et « pleut » se ressemblent à l'oreille."
    conclusion: "C'est un **écart** avec la grammaire habituelle, fait exprès : la tristesse tombe sur le cœur du poète comme la pluie sur la ville, sans qu'il sache pourquoi."
    jules: "Ce poème fait partie du **recueil** Romances sans paroles. Un recueil, c'est un livre qui rassemble plusieurs poèmes, comme un album rassemble des chansons."

  - id: exemple-recre
    type: exemple
    situation: "Nour veut écrire deux vers qui riment sur la récréation. Elle a une première idée : « Dans la cour, les ballons », puis « Volent comme des papillons. » Est-ce réussi ?"
    calcul: "Rime : ballons et papillons finissent par le même son (on). Image : des ballons qui volent comme des papillons, c'est une **comparaison** avec le mot « comme »."
    conclusion: "Oui : les deux vers **riment** et créent une image. Nour a rapproché deux choses qui bougent en l'air."
    jules: "Pour trouver une rime, dis le son final à voix haute et cherche d'autres mots : on, ballon, bonbon, papillon, violon, maison."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : écris une image sur le modèle « Le ciel est un moulin ». Choisis un objet de ta vie : « La lune est… », « Mon cartable est… »."
