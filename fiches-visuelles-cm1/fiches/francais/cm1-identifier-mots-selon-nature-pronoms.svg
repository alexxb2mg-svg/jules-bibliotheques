<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg"><title>Lucas devient il, la pomme devient la : pronom sujet et pronom complément</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Le pronom personnel remplace un groupe nominal</text>
<rect x="169.9" y="59.8" width="89.7" height="40.3" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.6"/>
<text x="175.9" y="80.0" font-size="26" fill="#1D4E89" font-weight="600" text-anchor="start" dominant-baseline="central">Lucas</text>
<text x="269.6" y="80.0" font-size="26" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">mange</text>
<rect x="367.4" y="59.8" width="142.7" height="40.3" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="373.4" y="80.0" font-size="26" fill="#2B8A3E" font-weight="600" text-anchor="start" dominant-baseline="central">la pomme</text>
<text x="513.1" y="80.0" font-size="26" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">.</text>
<rect x="253.3" y="169.8" width="29.3" height="40.3" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.6"/>
<text x="259.3" y="190.0" font-size="26" fill="#1D4E89" font-weight="600" text-anchor="start" dominant-baseline="central">Il</text>
<rect x="286.6" y="169.8" width="36.3" height="40.3" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.6"/>
<text x="292.6" y="190.0" font-size="26" fill="#2B8A3E" font-weight="600" text-anchor="start" dominant-baseline="central">la</text>
<text x="332.9" y="190.0" font-size="26" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">mange</text>
<text x="418.7" y="190.0" font-size="26" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">.</text>
<path d="M214.8 102.0 L268.0 166.0" fill="none" stroke="#1D4E89" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<path d="M438.7 102.0 Q384.7 134.0 310.7 166.0" fill="none" stroke="#2B8A3E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="120.0" y="135.0" font-size="16" fill="#1D4E89" font-weight="800" text-anchor="middle" dominant-baseline="central">pronom sujet</text>
<text x="575.0" y="135.0" font-size="16" fill="#2B8A3E" font-weight="800" text-anchor="middle" dominant-baseline="central">pronom complément</text>
<text x="340.0" y="232.0" font-size="16" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">Attention : le pronom complément se place devant le verbe.</text>
<line x1="20.0" y1="262.0" x2="660.0" y2="262.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="284.0" font-size="16" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">Deux « la » qui ne sont pas pareils</text>
<text x="60.0" y="322.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#D9480F" font-weight="800">la</tspan><tspan fill="#1a1a18"> pomme</tspan></text>
<text x="180.0" y="322.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">devant un nom → déterminant</text>
<text x="60.0" y="356.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Il </tspan><tspan fill="#2B8A3E" font-weight="800">la</tspan><tspan fill="#1a1a18"> mange</tspan></text>
<text x="180.0" y="356.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">devant un verbe → pronom complément</text>
<line x1="20.0" y1="382.0" x2="660.0" y2="382.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="408.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1D4E89" font-weight="800">Pronoms sujets : </tspan><tspan fill="#1a1a18">je, tu, il, elle, on, nous, vous, ils, elles</tspan></text>
<text x="20.0" y="436.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#2B8A3E" font-weight="800">Pronoms compléments : </tspan><tspan fill="#1a1a18">me, te, le, la, l', lui, nous, vous, les, leur</tspan></text>
</svg>
