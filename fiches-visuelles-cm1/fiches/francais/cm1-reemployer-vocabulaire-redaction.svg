<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg"><title>Dans une rédaction, remplacer « dit » par des mots appris plus précis</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Relire sa rédaction : « dit » trois fois, c'est trop !</text>
