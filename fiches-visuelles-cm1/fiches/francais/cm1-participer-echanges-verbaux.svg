<circle cx="259.5" cy="106.3" r="4.05" fill="#1D4E89" stroke="none" stroke-width="1.5"/>
<line x1="246.0" y1="160.3" x2="235.2" y2="185.5" stroke="#1D4E89" stroke-width="2.4" stroke-linecap="round"/>
<line x1="246.0" y1="160.3" x2="256.8" y2="185.5" stroke="#1D4E89" stroke-width="2.4" stroke-linecap="round"/>
<text x="222.0" y="142.0" font-size="14" fill="#1D4E89" font-weight="700" text-anchor="end" dominant-baseline="central">j'attends</text>
<text x="174.0" y="204.0" font-size="14.5" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">J'attends que l'autre ait fini</text>
<text x="174.0" y="222.0" font-size="14.5" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">et qu'on me donne la parole.</text>
<text x="364.0" y="30.0" font-size="17" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">② Je ne coupe pas la parole</text>
<circle cx="408.0" cy="128.0" r="11.700000000000001" fill="#FFFFFF" stroke="#1a1a18" stroke-width="2"/>
