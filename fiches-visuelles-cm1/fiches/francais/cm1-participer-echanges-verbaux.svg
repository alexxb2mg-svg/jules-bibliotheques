<text x="101.0" y="69.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">… et voilà.</tspan></text>
<circle cx="246.0" cy="118.0" r="11.700000000000001" fill="#E3EEF9" stroke="#1D4E89" stroke-width="2"/>
<line x1="246.0" y1="129.7" x2="246.0" y2="160.3" stroke="#1D4E89" stroke-width="2.4" stroke-linecap="round"/>
