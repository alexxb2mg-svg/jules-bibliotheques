<polyline points="404.0,94.0 408.0,108.0 422.0,94.0" fill="#FFFFFF" stroke="#1a1a18" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="405.5" y1="94.0" x2="420.5" y2="94.0" stroke="#FFFFFF" stroke-width="3.0" stroke-linecap="butt"/>
<text x="445.0" y="72.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Moi, je pense…</tspan></text>
<rect x="494.0" y="66.0" width="150.0" height="44.0" rx="14" fill="#FFFFFF" stroke="#1a1a18" stroke-width="1.6"/>
<polyline points="586.0,110.0 598.0,120.0 604.0,110.0" fill="#FFFFFF" stroke="#1a1a18" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="587.5" y1="110.0" x2="602.5" y2="110.0" stroke="#FFFFFF" stroke-width="3.0" stroke-linecap="butt"/>
<text x="569.0" y="88.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Non, mais moi…</tspan></text>
<line x1="494.8" y1="136.8" x2="517.2" y2="159.2" stroke="#C92A2A" stroke-width="4.800000000000001" stroke-linecap="round"/>
<line x1="494.8" y1="159.2" x2="517.2" y2="136.8" stroke="#C92A2A" stroke-width="4.800000000000001" stroke-linecap="round"/>
<text x="506.0" y="204.0" font-size="14.5" fill="#C92A2A" font-weight="600" text-anchor="middle" dominant-baseline="central">Deux voix en même temps :</text>
<text x="506.0" y="222.0" font-size="14.5" fill="#C92A2A" font-weight="600" text-anchor="middle" dominant-baseline="central">personne ne comprend rien.</text>
<text x="32.0" y="266.0" font-size="17" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">③ J'écoute et je reformule</text>
<circle cx="86.0" cy="384.0" r="7.8" fill="#FFFFFF" stroke="#1a1a18" stroke-width="2"/>
