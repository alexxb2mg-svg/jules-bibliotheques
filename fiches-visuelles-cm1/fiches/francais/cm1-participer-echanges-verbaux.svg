<line x1="77.5" y1="348.0" x2="92.5" y2="348.0" stroke="#FFFFFF" stroke-width="3.0" stroke-linecap="butt"/>
<text x="90.0" y="308.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Il faut un</tspan></text>
<text x="90.0" y="328.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">potager.</tspan></text>
<rect x="166.0" y="280.0" width="156.0" height="78.0" rx="14" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.6"/>
<polyline points="252.0,358.0 264.0,372.0 274.0,358.0" fill="#EEE9FD" stroke="#7048E8" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="253.5" y1="358.0" x2="272.5" y2="358.0" stroke="#EEE9FD" stroke-width="3.0" stroke-linecap="butt"/>
<text x="244.0" y="299.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#7048E8" font-weight="700">Si j'ai bien</tspan></text>
<text x="244.0" y="319.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#7048E8" font-weight="700">compris,</tspan><tspan fill="#1a1a18"> tu veux</tspan></text>
<text x="244.0" y="339.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">un potager ?</tspan></text>
<text x="174.0" y="440.0" font-size="14.5" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">Je redis l'idée de l'autre avec mes</text>
<text x="174.0" y="458.0" font-size="14.5" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">mots : il voit que je l'ai écouté.</text>
<text x="364.0" y="266.0" font-size="17" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">④ J'argumente</text>
<circle cx="396.0" cy="364.0" r="11.700000000000001" fill="#FDEBDD" stroke="#D9480F" stroke-width="2"/>
<line x1="396.0" y1="375.7" x2="396.0" y2="406.3" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round"/>
