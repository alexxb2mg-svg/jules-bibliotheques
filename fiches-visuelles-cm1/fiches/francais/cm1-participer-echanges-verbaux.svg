<text x="32.0" y="30.0" font-size="17" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">① Je lève la main</text>
<circle cx="76.0" cy="118.0" r="11.700000000000001" fill="#FFFFFF" stroke="#1a1a18" stroke-width="2"/>
