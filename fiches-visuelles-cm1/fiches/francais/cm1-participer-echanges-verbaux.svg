<line x1="396.0" y1="382.9" x2="409.5" y2="402.7" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round"/>
<line x1="396.0" y1="406.3" x2="385.2" y2="431.5" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round"/>
<line x1="396.0" y1="406.3" x2="406.8" y2="431.5" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round"/>
<rect x="434.0" y="288.0" width="214.0" height="104.0" rx="14" fill="#FDEBDD" stroke="#D9480F" stroke-width="1.6"/>
<polyline points="434.0,352.0 414.0,362.0 434.0,368.0" fill="#FDEBDD" stroke="#D9480F" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="432.5" y1="352.0" x2="435.5" y2="368.0" stroke="#FDEBDD" stroke-width="3.0" stroke-linecap="butt"/>
<text x="541.0" y="310.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="600">Je ne suis pas d'accord</tspan></text>
<text x="541.0" y="330.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F" font-weight="700">parce qu'</tspan><tspan fill="#1a1a18">il y aurait</tspan></text>
<text x="541.0" y="350.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">moins de place</tspan></text>
<text x="541.0" y="370.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">pour jouer au ballon.</tspan></text>
<text x="506.0" y="440.0" font-size="14.5" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">Mon avis + « parce que » + ma raison.</text>
<text x="506.0" y="458.0" font-size="14.5" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">Sans raison, un avis ne convainc pas.</text>
</svg>
