notion: cm1-appropriation-oeuvre-lue
titre: "Lire une œuvre et se l'approprier : garder la trace d'un livre et le relier à sa vie"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
