  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 4", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 4", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: approprier, titre: "S'approprier un livre", sous_titre: "en garder la mémoire, pas seulement le lire une fois", principal: true}
      - {id: carnet, titre: "Le carnet de lecteur", sous_titre: "titre, auteur, résumé, ce que j'ai ressenti"}
      - {id: vie, titre: "Des liens avec ma vie", sous_titre: "« moi aussi, j'ai déjà… »"}
      - {id: livres, titre: "Des liens avec d'autres livres", sous_titre: "comparer personnages, thèmes, fins"}
      - {id: varier, titre: "Varier et persévérer", sous_titre: "d'autres genres, et aller au bout même si c'est dur"}
    liens:
      - {de: approprier, vers: carnet}
      - {de: approprier, vers: vie}
      - {de: approprier, vers: livres}
      - {de: approprier, vers: varier}
    jules: "S'approprier un livre, c'est un peu le faire devenir « à soi » : même rendu à la bibliothèque, il reste dans ta mémoire et dans ton carnet."

  - id: schema-carnet
    type: schema
    titre: "Le carnet de lecteur d'Inès pour « Le phare aux mouettes », une histoire inventée"
    svg: "cm1-appropriation-oeuvre-lue.svg"
    jules: "Un carnet de lecteur n'est pas une évaluation : tu peux y dessiner, coller un ticket, noter une phrase que tu as aimée. L'important, c'est de pouvoir t'en souvenir dans six mois."

  - id: schema-personnages
    type: schema
    titre: "La carte des personnages : le héros au centre, les autres autour"
    svg: "cm1-appropriation-oeuvre-lue-personnages.svg"
    jules: "Quand un livre a beaucoup de personnages, dessine cette carte au début de ta lecture et complète-la au fil des chapitres. Tu ne te perdras plus."

  - id: schema-frise
    type: schema
    titre: "La frise des événements : toute l'histoire en six cases"
    svg: "cm1-appropriation-oeuvre-lue-frise.svg"
    jules: "Les **péripéties**, ce sont les événements qui font avancer l'histoire entre le début et la fin. Avec la frise, tu peux raconter le livre à quelqu'un sans rien oublier."

  - id: methode
    type: methode
    etapes:
      - "Note dans ton **carnet de lecteur** le titre, l'auteur et l'histoire en deux phrases."
      - "Écris ce que tu as **ressenti** : peur, joie, colère, surprise… et à quel moment."
      - "Cherche un **lien** avec ta propre vie, ou avec ce que tu sais déjà."
      - "Compare avec un autre livre lu : les personnages, le thème, la fin."
      - "Partage ta lecture : présente le livre à la classe ou conseille-le à un camarade."
    jules: "Deux phrases pour résumer, c'est un bon exercice : la première dit la situation, la deuxième ce qui arrive d'important."

  - id: piege
    type: piege
    mauvaise_idee: "Je finis le livre, je le referme et je passe au suivant, sans rien noter."
    pourquoi_faux: "En juin, Léo ne se souvient plus du livre lu en octobre : ni le titre, ni les personnages. Il ne peut **ni le comparer, ni le conseiller**."
    bonne_idee: "Trois lignes suffisent dans le carnet : le **titre**, ce que j'ai aimé ou pas, et un lien avec ma vie ou un autre livre."
    jules: "Autre piège : abandonner un livre dès que le début paraît long. Beaucoup d'histoires démarrent vraiment au deuxième ou au troisième chapitre."

  - id: exemple-liens
    type: exemple
    situation: "Inès a fini « Le phare aux mouettes ». Dans son carnet, à « Ça me fait penser à… », elle doit trouver un lien avec sa vie et un lien avec un autre livre."
    calcul: "Lien avec sa vie : comme Mila, elle passe ses vacances chez sa mamie au bord de la mer. Lien avec un livre : dans le conte « Hansel et Gretel », des cailloux blancs brillent au clair de lune et guident les enfants, comme la lumière du phare guide le bateau."
    conclusion: "Inès a fait deux **vrais liens**, précis et expliqués. C'est bien plus riche que « c'était bien »."
    jules: "Un lien peut aussi être une différence : « Mila est courageuse pendant la tempête, moi j'ai peur de l'orage. » Ça compte tout autant."

  - id: exemple-perseverer
    type: exemple
    situation: "Nathan trouve le début de son roman ennuyeux. Il a lu 20 pages sur 120 et veut abandonner."
    calcul: "Il se fixe un petit objectif : 10 pages chaque soir. Il note dans son carnet une question à la fin de chaque chapitre : « Qui a écrit la lettre ? ». En 10 soirs, il lit les 100 pages qui restent, car 10 × 10 = 100."
    conclusion: "Nathan a **persévéré** : au chapitre 3, l'histoire l'a attrapé, et il a fini le livre."
    jules: "Se poser une question sur la suite donne envie de continuer. Et si un livre ne te plaît vraiment pas, parles-en à ton enseignant : il t'aidera à en choisir un autre."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : pour ton livre en cours, dessine la frise des événements en six cases, sans regarder le livre. Puis vérifie dans le livre si tu n'as rien oublié."
