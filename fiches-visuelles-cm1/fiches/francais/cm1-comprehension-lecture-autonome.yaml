notion: cm1-comprehension-lecture-autonome
titre: "Comprendre seul un texte : ce qui est écrit, et ce que les indices laissent deviner"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 3", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 4", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: deviner
    type: formule
    expression: "[indices du texte] + [ce que je sais déjà] → [information implicite]"
    termes:
      "indices du texte": {couleur: violet, legende: "des mots précis, écrits dans le texte : « clapier », « deux longues oreilles », « derrière les salades »"}
      "ce que je sais déjà": {couleur: orange, legende: "ce que tu connais de la vie : un clapier est la cabane des lapins, les lapins ont de longues oreilles et mangent des salades"}
      "information implicite": {couleur: vert, legende: "ce qui n'est **pas écrit** mais qu'on peut prouver : « Caramel est un lapin »"}
    jules: "Deviner, en lecture, ce n'est pas inventer : c'est comme un détective qui relie des indices. Si tu ne peux montrer aucun mot du texte pour prouver ton idée, ce n'est pas une information implicite."

  - id: carte
    type: carte
    noeuds:
      - {id: comprendre, titre: "Comprendre seul un texte", sous_titre: "pas seulement lire les mots : voir ce qui se passe", principal: true}
      - {id: film, titre: "Se faire le film", sous_titre: "qui ? où ? quand ? que se passe-t-il ? pourquoi ?"}
      - {id: explicite, titre: "L'explicite", sous_titre: "écrit noir sur blanc : je le retrouve et je le cite"}
      - {id: implicite, titre: "L'implicite", sous_titre: "pas écrit, mais deviné grâce à des indices"}
      - {id: genre, titre: "Le genre du texte", sous_titre: "récit, poème ou théâtre : la mise en page aide"}
    liens:
      - {de: comprendre, vers: film}
      - {de: comprendre, vers: explicite}
      - {de: comprendre, vers: implicite}
      - {de: comprendre, vers: genre}
    jules: "Explicite et implicite : pense à « expliquer ». Ce qui est explicite, le texte te l'explique ; ce qui est implicite, c'est à toi de le trouver."

  - id: schema-questions
    type: schema
    titre: "Le texte de Hugo : les réponses écrites (bleu) et les réponses devinées (violet)"
    svg: "cm1-comprehension-lecture-autonome.svg"
    jules: "Un **clapier**, c'est une petite cabane où l'on élève des lapins. Remarque la colonne « Je prouve » : chaque réponse, même devinée, s'appuie sur des mots du texte."

  - id: schema-indices
    type: schema
    titre: "Qui est Caramel ? Trois indices pour une information implicite"
    svg: "cm1-comprehension-lecture-autonome-indices.svg"
    jules: "Un seul indice ne suffit pas toujours : un chien peut aussi avoir de longues oreilles. C'est en réunissant les trois indices qu'on est sûr que Caramel est un lapin."

  - id: schema-genres
    type: schema
    titre: "Récit, poème ou théâtre : reconnaître le genre à la mise en page"
    svg: "cm1-comprehension-lecture-autonome-genres.svg"
    jules: "Avant même de lire, regarde la forme de la page : des lignes courtes qui riment annoncent un poème, des noms en majuscules suivis d'un tiret annoncent du théâtre."

  - id: methode
    type: methode
    etapes:
      - "Lis le texte **en entier** une première fois, pour comprendre l'histoire dans les grandes lignes."
      - "Repère ce qui est **écrit** : qui, où, quand, ce qui se passe. Souligne-le."
      - "Cherche ce qui n'est **pas écrit** : relie les indices à ce que tu sais pour deviner."
      - "Regarde la mise en page (paragraphes, vers, répliques) pour savoir si c'est un récit, un poème ou du théâtre."
      - "Pour répondre à une question, retourne dans le texte et appuie-toi sur une phrase précise."
    jules: "Retourner dans le texte n'est pas tricher, c'est ce que font les bons lecteurs. Répondre de mémoire, c'est risquer de confondre avec une autre histoire."

  - id: piege
    type: piege
    mauvaise_idee: "Dans le texte de Hugo, je réponds : « Hugo a oublié de fermer le clapier ce matin. »"
    pourquoi_faux: "Aucun mot du texte ne dit qui a ouvert le clapier. C'est une idée **imaginée sans indice**, pas une information implicite."
    bonne_idee: "Je peux dire : « Caramel s'est échappé », car le texte dit que le clapier était **ouvert et vide**. Qui l'a ouvert ? Le texte ne permet pas de le savoir."
    jules: "Pour chaque idée, demande-toi : quels mots du texte le prouvent ? Si tu n'en trouves aucun, laisse tomber cette idée."

  - id: exemple-anniversaire
    type: exemple
    situation: "Lis : « Maëlle souffla les dix bougies sous les applaudissements, puis déchira le papier doré du paquet. » Le texte dit-il que c'est l'anniversaire de Maëlle ? Quel âge a-t-elle ?"
    calcul: "Le mot « anniversaire » n'est pas écrit. Mais les indices sont là : des bougies qu'on souffle, des applaudissements, un paquet emballé, donc un cadeau. Et il y a dix bougies."
    conclusion: "On devine que c'est **son anniversaire** et qu'elle a **10 ans** : ce sont deux informations implicites, prouvées par des mots du texte."
    jules: "Sur un gâteau d'anniversaire, on met en général autant de bougies que l'âge qu'on fête : c'est ce que tu sais déjà qui te permet de deviner l'âge."

  - id: exemple-theatre
    type: exemple
    situation: "Un texte commence ainsi : « LA SORCIÈRE. — Qui ose entrer chez moi ? (Elle lève sa baguette.) » Est-ce un récit, un poème ou du théâtre ?"
    calcul: "Le nom du personnage est en majuscules, suivi d'un tiret et de ses paroles : c'est une **réplique**. La phrase entre parenthèses dit ce que fait le personnage : c'est une **didascalie**."
    conclusion: "C'est un extrait de **théâtre** : un texte écrit pour être joué par des acteurs."
    jules: "Dans une pièce de théâtre, il n'y a pas de narrateur qui raconte : on découvre l'histoire uniquement par ce que disent et font les personnages."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dans ton livre de lecture, trouve une phrase qui laisse deviner une émotion sans la nommer (peur, joie, colère). Écris l'émotion, puis les mots qui la prouvent."
