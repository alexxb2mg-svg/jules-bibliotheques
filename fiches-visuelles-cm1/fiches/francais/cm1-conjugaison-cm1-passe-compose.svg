<svg width="100%" viewBox="0 0 680 462" xmlns="http://www.w3.org/2000/svg"><title>Le passé composé : auxiliaire + participe passé, et la négation autour de l'auxiliaire</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Le passé composé = 2 morceaux</text>
<text x="150.0" y="78.0" font-size="30" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Nina</text>
<rect x="214.0" y="52.0" width="62.0" height="52.0" rx="10" fill="#EEEDFE" stroke="#6D28D9" stroke-width="2"/>
<text x="245.0" y="78.0" font-size="30" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">a</text>
<rect x="290.0" y="52.0" width="142.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#1a1a18" stroke-width="2"/>
<text x="361.0" y="78.0" font-size="30" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">mangé</text>
<text x="520.0" y="78.0" font-size="30" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">sa crêpe.</text>
<text x="245.0" y="122.0" font-size="14" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">auxiliaire avoir</text>
<text x="245.0" y="140.0" font-size="14" fill="#6D28D9" font-weight="500" text-anchor="middle" dominant-baseline="central">au présent</text>
<text x="361.0" y="122.0" font-size="14" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">participe passé</text>
<text x="361.0" y="140.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">de manger</text>
<text x="40.0" y="170.0" font-size="15" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">À la forme négative, ne... pas entoure l'auxiliaire :</text>
<text x="104.0" y="232.0" font-size="30" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Nina</text>
<rect x="156.0" y="208.0" width="44.0" height="48.0" rx="9" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.6"/>
<text x="178.0" y="232.0" font-size="30" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">n'</text>
<rect x="206.0" y="206.0" width="62.0" height="52.0" rx="10" fill="#EEEDFE" stroke="#6D28D9" stroke-width="2"/>
<text x="237.0" y="232.0" font-size="30" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">a</text>
<rect x="274.0" y="208.0" width="70.0" height="48.0" rx="9" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.6"/>
<text x="309.0" y="232.0" font-size="30" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">pas</text>
<rect x="352.0" y="206.0" width="142.0" height="52.0" rx="10" fill="#FFFFFF" stroke="#1a1a18" stroke-width="2"/>
<text x="423.0" y="232.0" font-size="30" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">mangé</text>
<text x="574.0" y="232.0" font-size="30" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">sa crêpe.</text>
<path d="M178 204 L178 196 L309 196 L309 204" fill="none" stroke="#A32D2D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="423.0" y="274.0" font-size="14" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">le participe reste après</text>
<rect x="14.0" y="304.0" width="652.0" height="150.0" rx="10" fill="#FAFAF7" stroke="#d6d4cc" stroke-width="1"/>
<text x="340.0" y="324.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Des participes passés à connaître par cœur</text>
<text x="98.0" y="356.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">être → </tspan><tspan fill="#1a1a18">été</tspan></text>
<text x="258.0" y="356.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">avoir → </tspan><tspan fill="#1a1a18">eu</tspan></text>
<text x="418.0" y="356.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">faire → </tspan><tspan fill="#1a1a18">fait</tspan></text>
<text x="578.0" y="356.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">dire → </tspan><tspan fill="#1a1a18">dit</tspan></text>
<text x="98.0" y="386.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">prendre → </tspan><tspan fill="#1a1a18">pris</tspan></text>
<text x="258.0" y="386.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">voir → </tspan><tspan fill="#1a1a18">vu</tspan></text>
<text x="418.0" y="386.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">pouvoir → </tspan><tspan fill="#1a1a18">pu</tspan></text>
<text x="578.0" y="386.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">vouloir → </tspan><tspan fill="#1a1a18">voulu</tspan></text>
<text x="98.0" y="416.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">finir → </tspan><tspan fill="#1a1a18">fini</tspan></text>
<text x="258.0" y="416.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">aller → </tspan><tspan fill="#1a1a18">allé *</tspan></text>
<text x="418.0" y="416.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">venir → </tspan><tspan fill="#1a1a18">venu *</tspan></text>
<text x="578.0" y="416.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">jouer → </tspan><tspan fill="#1a1a18">joué</tspan></text>
<text x="340.0" y="440.0" font-size="13.5" fill="#6D28D9" font-weight="600" text-anchor="middle" dominant-baseline="central">* avec l'auxiliaire être : je suis allé, elle est venue.</text>
</svg>
