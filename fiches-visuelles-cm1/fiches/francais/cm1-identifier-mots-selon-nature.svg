<text x="581.0" y="84.0" font-size="14" fill="#D9480F" font-weight="700" text-anchor="end" dominant-baseline="central">celui-là</text>
<text x="85.0" y="172.0" font-size="22" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F" font-weight="800">le </tspan><tspan fill="#1a1a18" font-weight="600">cartable</tspan></text>
<text x="85.0" y="200.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">celui qu'on</text>
<text x="85.0" y="219.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">connaît déjà</text>
<text x="85.0" y="250.0" font-size="14" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">article</text>
<text x="85.0" y="268.0" font-size="14" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">défini</text>
<text x="255.0" y="172.0" font-size="22" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F" font-weight="800">un </tspan><tspan fill="#1a1a18" font-weight="600">cartable</tspan></text>
<text x="255.0" y="200.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">n'importe</text>
<text x="255.0" y="219.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">lequel</text>
<text x="255.0" y="250.0" font-size="14" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">article</text>
<text x="255.0" y="268.0" font-size="14" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">indéfini</text>
<text x="425.0" y="172.0" font-size="22" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F" font-weight="800">mon </tspan><tspan fill="#1a1a18" font-weight="600">cartable</tspan></text>
<text x="425.0" y="200.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">il est</text>
<text x="425.0" y="219.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">à moi</text>
<text x="425.0" y="250.0" font-size="14" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">déterminant</text>
<text x="425.0" y="268.0" font-size="14" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">possessif</text>
<text x="595.0" y="172.0" font-size="22" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F" font-weight="800">ce </tspan><tspan fill="#1a1a18" font-weight="600">cartable</tspan></text>
<text x="595.0" y="200.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">celui qu'on</text>
<text x="595.0" y="219.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">montre</text>
