<text x="20.0" y="314.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Les formes à connaître</text>
<text x="20.0" y="344.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">articles définis</text>
<text x="250.0" y="344.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">le, la, l', les</text>
<text x="20.0" y="370.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">articles indéfinis</text>
<text x="250.0" y="370.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">un, une, des</text>
<text x="20.0" y="396.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">déterminants possessifs</text>
<text x="250.0" y="396.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">mon, ton, son, ma, ta, sa, mes, tes, ses, notre, votre, leur…</text>
<text x="20.0" y="422.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">déterminants démonstratifs</text>
<text x="250.0" y="422.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">ce, cet, cette, ces</text>
