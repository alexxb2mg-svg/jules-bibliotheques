blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: ecoute, titre: "L'écoute active", sous_titre: "entendre, et en plus chercher quelque chose", principal: true}
      - {id: avant, titre: "Avant", sous_titre: "je sais ce que je cherche : qui ? où ? quand ? quoi ?"}
      - {id: pendant, titre: "Pendant", sous_titre: "je note des mots-clés, pas des phrases"}
      - {id: voix, titre: "La voix", sous_titre: "le ton, les pauses, les mots appuyés sont des indices"}
      - {id: apres, titre: "Après", sous_titre: "je redis avec mes mots et je dis ce que j'ai ressenti"}
    liens:
      - {de: ecoute, vers: avant}
      - {de: ecoute, vers: pendant}
      - {de: ecoute, vers: voix}
      - {de: ecoute, vers: apres}
    jules: "Entendre, ça se fait tout seul, même en dormant. Écouter, c'est un travail : ton cerveau cherche les réponses à tes questions pendant que l'autre parle."

  - id: schema-renard
    type: schema
    titre: "Écouter un reportage sur le renard : avant, pendant, après"
    svg: "cm1-ecouter-pour-comprendre.svg"
    jules: "Le mot « nocturne » (qui vit la nuit) n'a jamais été prononcé : c'est l'élève qui l'a trouvé en comprenant « il sort la nuit ». Reformuler, c'est ça : redire la même idée avec ses mots à soi."

  - id: schema-voix
    type: schema
    titre: "Les indices de la voix : question, suspense, mot important, émotion"
    svg: "cm1-ecouter-pour-comprendre-voix.svg"
    jules: "À l'écrit, on voit les points d'interrogation et les points d'exclamation. À l'oral, on ne les voit pas : c'est la voix qui les remplace, alors tends bien l'oreille."

  - id: methode
    type: methode
    etapes:
      - "Avant d'écouter, je me demande ce que je cherche : une **information** précise, une histoire, un avis ?"
      - "Pendant l'écoute, je regarde la personne qui parle et je reste concentré sur mon but."
      - "Je repère les personnages, le lieu, le moment et les événements. Si je peux, je note des **mots-clés**."
      - "J'écoute aussi la voix : une pause, un mot appuyé, un ton triste m'aident à comprendre."
      - "Après, je **reformule** avec mes mots, en reliant les informations entre elles."
    jules: "Si tu ne peux pas écrire pendant l'écoute, compte les informations sur tes doigts : un doigt pour chaque réponse trouvée."

  - id: piege
    type: piege
    mauvaise_idee: "Pour montrer que j'ai compris, je répète mot pour mot : « Le renard sort surtout la nuit. Il mange des petits animaux… »"
    pourquoi_faux: "Répéter comme un perroquet montre qu'on a **retenu**, pas qu'on a **compris**. On peut réciter une phrase sans savoir ce qu'elle veut dire."
    bonne_idee: "Je redis avec mes mots, en reliant les idées : « Le renard est un animal nocturne. Il mange des souris et des fruits, et il vit dans un terrier. »"
    jules: "Autre piège : ne retenir qu'un détail amusant (les souris) et oublier le reste. Reviens à tes questions de départ : as-tu une réponse pour chacune ?"

  - id: exemple-conte
    type: exemple
    situation: "La maîtresse lit un conte : « Petit Loup rentre à la tanière. Ses poils sont trempés, il claque des dents et il éternue trois fois. » Que s'est-il passé dehors ? Ce n'est pas dit."
    calcul: "Je relie les indices entendus : poils trempés, dents qui claquent, éternuements. Ils vont tous dans le même sens."
    conclusion: "Il a sûrement plu et Petit Loup a eu **froid**. Je l'ai **deviné** en mettant bout à bout plusieurs informations."
    jules: "Les auteurs ne disent pas tout, exprès : ils te laissent deviner. C'est comme une enquête, et les indices sont dans les mots entendus."

  - id: exemple-interview
    type: exemple
    situation: "À la radio, une journaliste interroge une boulangère : « À quelle heure commencez-vous ? » « À 4 heures du matin, pour que le pain soit prêt à 7 heures. » Lina doit dire quel genre d'émission c'est."
    calcul: "Il y a deux voix : l'une pose des **questions**, l'autre répond. La personne interrogée parle de son métier."
    conclusion: "C'est une **interview**. Lina retient : la boulangère commence à 4 heures pour que le pain soit prêt à 7 heures."
    jules: "Un reportage, lui, décrit un lieu ou un événement, souvent avec une seule voix qui raconte. Un conte commence souvent par « Il était une fois »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : écoute la météo à la radio ou à la télévision avec une seule question en tête, « Quel temps fera-t-il demain chez moi ? ». Puis redis la réponse à quelqu'un, avec tes mots."
