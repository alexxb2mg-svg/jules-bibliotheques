  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 9-10", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
