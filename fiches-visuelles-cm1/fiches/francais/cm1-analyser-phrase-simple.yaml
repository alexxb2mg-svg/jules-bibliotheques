    jules: "Commence toujours par le verbe : c'est le pivot de la phrase, tous les autres groupes tournent autour de lui. Une fois le verbe trouvé, les questions « qui est-ce qui ? », « quoi ? », « où ? » font apparaître les autres groupes."

  - id: schema-groupes
    type: schema
    titre: "Une phrase découpée en groupes, avec la question qui trouve chacun"
    svg: "cm1-analyser-phrase-simple.svg"
    jules: "Le sujet n'est pas toujours une seule personne : dans « Tom et Zoé jouent », le sujet, c'est Tom et Zoé, et le verbe se met au pluriel. Il peut aussi être un pronom (Elle) ou un long groupe (Le chien de ma voisine)."

  - id: schema-manipuler
    type: schema
    titre: "Enlever, déplacer : le test qui sépare le complément d'objet du complément circonstanciel"
    svg: "cm1-analyser-phrase-simple-manipuler.svg"
    jules: "Enlever, déplacer, remplacer, encadrer : ce sont des **manipulations**. Tu fais bouger les groupes comme des wagons, et tu écoutes si la phrase veut encore dire quelque chose."

  - id: methode
    type: methode
    etapes:
      - "Trouve le **verbe conjugué** : c'est le mot qui change si tu dis la phrase avec « hier » ou « demain »."
      - "Trouve le **groupe sujet** : pose la question « qui est-ce qui + verbe ? », ou encadre avec « c'est… qui »."
      - "Cherche le **complément d'objet** : « verbe + qui ? » ou « verbe + quoi ? ». Sans préposition, c'est un COD. Avec à, de…, c'est un COI."
      - "Essaie d'enlever ou de déplacer les autres groupes. Si la phrase reste correcte, ce sont des **compléments circonstanciels**."
    jules: "Pour vérifier le sujet, remplace-le par il, elle, ils ou elles : « Tom et Zoé jouent » devient « Ils jouent ». Si ça marche, tu as trouvé le bon groupe."

  - id: piege
    type: piege
    mauvaise_idee: "Dans « Léa mange à la cantine. », le groupe « à la cantine » est un COI, puisqu'il commence par la préposition à."
    pourquoi_faux: "On peut le déplacer (« À la cantine, Léa mange. ») et même l'enlever (« Léa mange. »). Il répond à « où ? » : c'est un **complément circonstanciel**."
    bonne_idee: "Fais d'abord le test : si le groupe s'enlève ou se déplace, c'est un complément circonstanciel. Sinon, c'est un **complément d'objet** : COD sans préposition, COI avec."
    jules: "La préposition ne suffit pas à dire COI : « à la cantine », « dans le jardin », « avec son frère » ont une préposition, mais ce sont souvent des compléments circonstanciels. Le vrai juge, c'est le test : enlever ou déplacer."

  - id: exemple-ballon
    type: exemple
    situation: "Pendant la récréation, Sami prête son ballon à Inès. Trouve le verbe, le groupe sujet, le COD, le COI et le complément circonstanciel."
    calcul: "Verbe : **prête** (hier, il prêtait). Qui est-ce qui prête ? Sami. Prête quoi ? son ballon, sans préposition. Prête à qui ? à Inès, avec la préposition à. Quand ? pendant la récréation : on peut l'enlever."
    conclusion: "Groupe sujet : Sami. COD : son ballon. COI : à Inès. Complément circonstanciel : pendant la récréation."
    jules: "« Pendant la récréation » peut aller à la fin : « Sami prête son ballon à Inès pendant la récréation. » La phrase reste juste, c'est la preuve qu'il s'agit d'un complément circonstanciel."

  - id: exemple-sujet
    type: exemple
    situation: "Chaque matin, Tom et sa sœur prennent le bus devant l'école. Quel est le groupe sujet ? Pourquoi le verbe finit-il par -ent ?"
    calcul: "Qui est-ce qui prend le bus ? Tom et sa sœur. On encadre : « C'est Tom et sa sœur qui prennent le bus. » On remplace : « Ils prennent le bus. »"
    conclusion: "Le groupe sujet est **Tom et sa sœur** : deux personnes, donc le verbe est au pluriel, comme avec « ils ». Le bus est le COD, chaque matin et devant l'école sont des compléments circonstanciels."
    jules: "Ne prends pas juste le mot placé devant le verbe : ici, c'est « sœur », mais le sujet, c'est tout le groupe « Tom et sa sœur »."

