<text class="t" x="260.0" y="362.0" text-anchor="middle" dominant-baseline="central">sur les routes</text>
<text class="t" x="260.0" y="382.0" text-anchor="middle" dominant-baseline="central">de France, à pied</text>
<rect x="344.0" y="318.0" width="152.0" height="112.0" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text class="th" x="420.0" y="338.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">SA VIE ?</text>
<text class="t" x="420.0" y="362.0" text-anchor="middle" dominant-baseline="central">il joue de la harpe</text>
<text class="t" x="420.0" y="382.0" text-anchor="middle" dominant-baseline="central">sur les places</text>
<text class="t" x="420.0" y="402.0" text-anchor="middle" dominant-baseline="central">pour manger</text>
<rect x="504.0" y="318.0" width="152.0" height="112.0" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text class="th" x="580.0" y="338.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">CE QU'IL SENT ?</text>
<text class="t" x="580.0" y="362.0" text-anchor="middle" dominant-baseline="central">la fatigue, le froid,</text>
<text class="t" x="580.0" y="382.0" text-anchor="middle" dominant-baseline="central">et l'amitié</text>
<text class="t" x="580.0" y="402.0" text-anchor="middle" dominant-baseline="central">de Capi</text>
<text class="ts" x="340.0" y="448.0" text-anchor="middle" dominant-baseline="central">Sans famille, roman d'Hector Malot (1878). Dessin pas à l'échelle.</text>
