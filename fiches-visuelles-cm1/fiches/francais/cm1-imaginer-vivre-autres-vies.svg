<text class="th" x="100.0" y="338.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B">QUAND ?</text>
<text class="t" x="100.0" y="362.0" text-anchor="middle" dominant-baseline="central">il y a environ</text>
