<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg"><title>Trois façons de poser la même question</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Une question, trois façons de la poser</text>
<text x="20.0" y="62.0" font-size="18" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#5f5e5a">Au départ : </tspan><tspan fill="#1a1a18" font-weight="700">Tu viens au parc.</tspan></text>
<circle cx="36.0" cy="112.0" r="14" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="36.0" y="113.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text x="62.0" y="112.0" font-size="22" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Tu viens au parc </tspan><tspan fill="#D9480F" font-weight="800">?</tspan></text>
<path d="M290.1 122.0 Q330.1 120.0 350.1 100.0" fill="none" stroke="#D9480F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="366.1" y="112.0" font-size="15" fill="#D9480F" font-weight="600" text-anchor="start" dominant-baseline="central">à l'oral, la voix monte</text>
<circle cx="36.0" cy="178.0" r="14" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="36.0" y="179.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="56.0" y="160.0" width="134.0" height="36.0" rx="8" fill="#FDEBDD" stroke="#D9480F" stroke-width="1.8"/>
<text x="62.0" y="178.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">Est-ce que</text>
<text x="200.0" y="178.0" font-size="22" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">tu viens au parc </tspan><tspan fill="#D9480F" font-weight="800">?</tspan></text>
<text x="421.3" y="178.0" font-size="15" fill="#D9480F" font-weight="600" text-anchor="start" dominant-baseline="central">on ajoute « est-ce que »</text>
<circle cx="36.0" cy="296.0" r="14" fill="#D9480F" stroke="none" stroke-width="1.5"/>
<text x="36.0" y="297.0" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text x="62.0" y="296.0" font-size="22" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Viens</tspan><tspan fill="#D9480F">-tu</tspan><tspan fill="#1a1a18"> au parc </tspan><tspan fill="#D9480F" font-weight="800">?</tspan></text>
<text x="62.0" y="236.0" font-size="18" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">Tu</text>
<text x="97.6" y="236.0" font-size="18" fill="#5f5e5a" font-weight="700" text-anchor="start" dominant-baseline="central">viens</text>
<path d="M73.8 248.0 L144.9 278.0" fill="none" stroke="#D9480F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<path d="M121.5 248.0 L92.7 278.0" fill="none" stroke="#5f5e5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="299.5" y="286.0" font-size="15" fill="#D9480F" font-weight="600" text-anchor="start" dominant-baseline="central">le sujet passe après le verbe,</text>
<text x="299.5" y="306.0" font-size="15" fill="#D9480F" font-weight="600" text-anchor="start" dominant-baseline="central">avec un trait d'union</text>
<text x="340.0" y="342.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">À l'écrit, les trois se terminent par un point d'interrogation.</text>
</svg>
