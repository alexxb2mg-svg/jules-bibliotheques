<text x="20.0" y="262.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">La </tspan><tspan fill="#2B8A3E" font-weight="800">feuille</tspan><tspan fill="#1a1a18"> du platane</tspan></text>
<text x="20.0" y="286.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">tombe dans la cour.</tspan></text>
<text x="20.0" y="330.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Je prends une </tspan><tspan fill="#1D4E89" font-weight="800">feuille</tspan></text>
<text x="20.0" y="354.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">pour écrire mon poème.</tspan></text>
<text x="360.0" y="262.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">La </tspan><tspan fill="#2B8A3E" font-weight="800">souris</tspan><tspan fill="#1a1a18"> grignote</tspan></text>
<text x="360.0" y="286.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">le fromage.</tspan></text>
<text x="360.0" y="330.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Je clique avec</tspan></text>
<text x="360.0" y="354.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">la </tspan><tspan fill="#1D4E89" font-weight="800">souris</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="340.0" y="402.0" font-size="14" fill="#5f5e5a" font-weight="700" text-anchor="middle" dominant-baseline="central">Le mot est le même. C'est la phrase autour (le contexte) qui dit quel sens choisir.</text>
