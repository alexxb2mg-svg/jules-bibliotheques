<svg width="100%" viewBox="0 0 680 465" xmlns="http://www.w3.org/2000/svg"><title>Trois constructions du groupe nominal, et le test pour trouver le nom noyau</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Trois façons de construire un groupe nominal</text>
<rect x="30.0" y="52.0" width="44.5" height="40.0" rx="8" fill="#FDEBDD" stroke="#D9480F" stroke-width="1.8"/>
<text x="52.3" y="72.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">le</text>
<rect x="82.5" y="52.0" width="93.8" height="40.0" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="3"/>
<text x="129.4" y="72.0" font-size="22" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">ballon</text>
<text x="330.0" y="72.0" font-size="16" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">déterminant + nom</text>
<rect x="30.0" y="110.0" width="44.5" height="40.0" rx="8" fill="#FDEBDD" stroke="#D9480F" stroke-width="1.8"/>
<text x="52.3" y="130.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">le</text>
<rect x="82.5" y="110.0" width="93.8" height="40.0" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="3"/>
<text x="129.4" y="130.0" font-size="22" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">ballon</text>
<rect x="184.3" y="110.0" width="87.2" height="40.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.8"/>
<text x="227.9" y="130.0" font-size="22" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">rouge</text>
<text x="330.0" y="130.0" font-size="16" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">déterminant + nom + adjectif</text>
<rect x="30.0" y="168.0" width="44.5" height="40.0" rx="8" fill="#FDEBDD" stroke="#D9480F" stroke-width="1.8"/>
<text x="52.3" y="188.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">le</text>
<rect x="82.5" y="168.0" width="72.1" height="40.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.8"/>
<text x="118.6" y="188.0" font-size="22" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">gros</text>
<rect x="162.6" y="168.0" width="93.8" height="40.0" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="3"/>
<text x="209.5" y="188.0" font-size="22" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">ballon</text>
<text x="330.0" y="188.0" font-size="16" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">déterminant + adjectif + nom</text>
<line x1="20.0" y1="232.0" x2="660.0" y2="232.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="256.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Pour trouver le noyau : on enlève, il doit rester</text>
<rect x="60.0" y="281.0" width="61.5" height="38.0" rx="8" fill="#FDEBDD" stroke="#D9480F" stroke-width="1.8"/>
<text x="90.7" y="300.0" font-size="20" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">une</text>
<rect x="129.5" y="281.0" width="93.9" height="38.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.8"/>
<text x="176.4" y="300.0" font-size="20" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">grande</text>
<rect x="231.4" y="281.0" width="97.4" height="38.0" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="3"/>
<text x="280.1" y="300.0" font-size="20" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">maison</text>
<rect x="336.8" y="281.0" width="104.7" height="38.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.8"/>
<text x="389.2" y="300.0" font-size="20" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">blanche</text>
<text x="457.5" y="300.0" font-size="15" fill="#5f5e5a" font-weight="700" text-anchor="start" dominant-baseline="central">On enlève…</text>
<text x="30.0" y="356.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">…les adjectifs :</text>
<rect x="170.0" y="337.0" width="61.5" height="38.0" rx="8" fill="#FDEBDD" stroke="#D9480F" stroke-width="1.8"/>
<text x="200.7" y="356.0" font-size="20" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">une</text>
<rect x="239.5" y="337.0" width="97.4" height="38.0" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="3"/>
<text x="288.1" y="356.0" font-size="20" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">maison</text>
<path d="M350.0 356.0 L356.6 362.6 L368.7 348.3" fill="none" stroke="#2B8A3E" stroke-width="3.3000000000000003" stroke-linecap="round" stroke-linejoin="round"/>
<text x="378.8" y="356.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">ça reste un groupe nominal</text>
<text x="30.0" y="412.0" font-size="15" fill="#C92A2A" font-weight="700" text-anchor="start" dominant-baseline="central">…le nom :</text>
<rect x="170.0" y="393.0" width="61.5" height="38.0" rx="8" fill="#FDEBDD" stroke="#D9480F" stroke-width="1.8"/>
<text x="200.7" y="412.0" font-size="20" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">une</text>
<rect x="239.5" y="393.0" width="93.9" height="38.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.8"/>
<text x="286.4" y="412.0" font-size="20" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">grande</text>
<rect x="341.4" y="393.0" width="97.4" height="38.0" rx="8" fill="none" stroke="#1D4E89" stroke-width="1.8" stroke-dasharray="5 4"/>
<rect x="446.8" y="393.0" width="104.7" height="38.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.8"/>
<text x="499.2" y="412.0" font-size="20" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">blanche</text>
<line x1="565.8" y1="404.3" x2="581.2" y2="419.7" stroke="#C92A2A" stroke-width="3.3000000000000003" stroke-linecap="round"/>
<line x1="565.8" y1="419.7" x2="581.2" y2="404.3" stroke="#C92A2A" stroke-width="3.3000000000000003" stroke-linecap="round"/>
<text x="170.0" y="448.0" font-size="15" fill="#C92A2A" font-weight="700" text-anchor="start" dominant-baseline="central">plus rien ne tient : maison est le noyau</text>
</svg>
