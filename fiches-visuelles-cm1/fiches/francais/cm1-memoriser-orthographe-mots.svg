<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg"><title>Petit, gourmand, lait, progrès : la lettre muette s'entend dans un mot de la famille</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340.0" y="20.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">La lettre muette se réveille dans un mot de la famille</text>
<text x="57.2" y="88.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">peti</tspan><tspan fill="#A8A6A0" font-weight="800">t</tspan><tspan fill="#1a1a18"></tspan></text>
<circle cx="112.1" cy="89.0" r="17.16" fill="none" stroke="#A8A6A0" stroke-width="1.8"/>
<text x="113.1" y="124.0" font-size="13" fill="#A8A6A0" font-weight="700" text-anchor="middle" dominant-baseline="central">chut !</text>
<line x1="113.1" y1="138.0" x2="113.1" y2="186.0" stroke="#D9480F" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="49.6" y="214.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">peti</tspan><tspan fill="#D9480F" font-weight="800">t</tspan><tspan fill="#1a1a18">e</tspan></text>
<text x="88.0" y="250.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">on entend [t]</text>
<text x="187.3" y="88.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">gourman</tspan><tspan fill="#A8A6A0" font-weight="800">d</tspan><tspan fill="#1a1a18"></tspan></text>
<circle cx="307.5" cy="89.0" r="17.16" fill="none" stroke="#A8A6A0" stroke-width="1.8"/>
<text x="308.5" y="124.0" font-size="13" fill="#A8A6A0" font-weight="700" text-anchor="middle" dominant-baseline="central">chut !</text>
<line x1="308.5" y1="138.0" x2="308.5" y2="186.0" stroke="#D9480F" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="179.8" y="214.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">gourman</tspan><tspan fill="#D9480F" font-weight="800">d</tspan><tspan fill="#1a1a18">e</tspan></text>
<text x="252.0" y="250.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">on entend [d]</text>
<text x="402.8" y="88.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">lai</tspan><tspan fill="#A8A6A0" font-weight="800">t</tspan><tspan fill="#1a1a18"></tspan></text>
<circle cx="438.6" cy="89.0" r="17.16" fill="none" stroke="#A8A6A0" stroke-width="1.8"/>
<text x="439.6" y="124.0" font-size="13" fill="#A8A6A0" font-weight="700" text-anchor="middle" dominant-baseline="central">chut !</text>
<line x1="439.6" y1="138.0" x2="439.6" y2="186.0" stroke="#D9480F" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="385.9" y="214.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">lai</tspan><tspan fill="#D9480F" font-weight="800">t</tspan><tspan fill="#1a1a18">ier</tspan></text>
<text x="424.0" y="250.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">on entend [t]</text>
<text x="543.1" y="88.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">progrè</tspan><tspan fill="#A8A6A0" font-weight="800">s</tspan><tspan fill="#1a1a18"></tspan></text>
<circle cx="632.9" cy="89.0" r="17.16" fill="none" stroke="#A8A6A0" stroke-width="1.8"/>
<text x="633.9" y="124.0" font-size="13" fill="#A8A6A0" font-weight="700" text-anchor="middle" dominant-baseline="central">chut !</text>
<line x1="633.9" y1="138.0" x2="633.9" y2="186.0" stroke="#D9480F" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="523.1" y="214.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">progre</tspan><tspan fill="#D9480F" font-weight="800">s</tspan><tspan fill="#1a1a18">ser</tspan></text>
<text x="592.0" y="250.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">on entend [s]</text>
<line x1="170.0" y1="50.0" x2="170.0" y2="262.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="338.0" y1="50.0" x2="338.0" y2="262.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="508.0" y1="50.0" x2="508.0" y2="262.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="20.0" y1="280.0" x2="660.0" y2="280.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="340.0" y="306.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">En haut, la dernière lettre ne se prononce pas : on ne l'entend pas.</text>
<text x="340.0" y="330.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">En bas, dans un mot de la même famille, elle se prononce : on sait qu'elle est là.</text>
<text x="340.0" y="368.0" font-size="16" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F" font-weight="800">Astuce : </tspan><tspan fill="#1a1a18">mets le mot au féminin, ou cherche un mot plus long de sa famille.</tspan></text>
</svg>
