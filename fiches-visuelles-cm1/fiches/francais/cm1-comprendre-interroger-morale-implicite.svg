<text class="t" x="340.0" y="398.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Le lecteur devine :</text>
<text class="th" x="340.0" y="420.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">on ne juge pas quelqu'un sur son apparence.</text>
<text class="ts" x="340.0" y="456.0" text-anchor="middle" dominant-baseline="central">Le Vilain Petit Canard, conte de Hans Christian Andersen (1843).</text>
