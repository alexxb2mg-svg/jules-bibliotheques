<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Morale explicite ou implicite : écrite dans la fable, ou devinée dans le conte</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tl" x="20.0" y="22.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11">EXPLICITE : la morale est écrite dans le texte</text>
<rect x="20.0" y="42.0" width="400.0" height="132.0" rx="6" fill="#FFFDF5" stroke="#B7AE98" stroke-width="1.2"/>
<rect x="30.0" y="76.0" width="380.0" height="48.0" rx="0" fill="#FFF0A8" stroke="none" stroke-width="0"/>
<text class="t" x="40.0" y="64.0" text-anchor="start" dominant-baseline="central" font-style="italic">« Mon bon Monsieur,</text>
<text class="t" x="40.0" y="88.0" text-anchor="start" dominant-baseline="central" font-style="italic">Apprenez que tout flatteur</text>
<text class="t" x="40.0" y="112.0" text-anchor="start" dominant-baseline="central" font-style="italic">Vit aux dépens de celui qui l'écoute.</text>
<text class="t" x="40.0" y="136.0" text-anchor="start" dominant-baseline="central" font-style="italic">Cette leçon vaut bien un fromage, sans doute. »</text>
<text class="t" x="440.0" y="70.0" text-anchor="start" dominant-baseline="central">La Fontaine l'écrit</text>
<text class="t" x="440.0" y="92.0" text-anchor="start" dominant-baseline="central">à la fin de la fable :</text>
<text class="t" x="440.0" y="114.0" text-anchor="start" dominant-baseline="central">on la surligne.</text>
<text class="ts" x="440.0" y="142.0" text-anchor="start" dominant-baseline="central" font-style="italic">Le Corbeau et le Renard</text>
<line x1="20.0" y1="196.0" x2="660.0" y2="196.0" stroke="#D3D1C7" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 5"/>
<text class="tl" x="20.0" y="222.0" text-anchor="start" dominant-baseline="central" fill="#534AB7">IMPLICITE : la morale n'est pas écrite, on la devine</text>
