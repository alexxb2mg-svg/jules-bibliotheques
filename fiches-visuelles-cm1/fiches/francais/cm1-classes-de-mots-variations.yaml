notion: cm1-classes-de-mots-variations
titre: "Les mots qui changent de forme : genre, nombre, personne et temps"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 18", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 13", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: varient, titre: "5 classes de mots qui varient", sous_titre: "déterminant, nom, adjectif, pronom personnel, verbe", principal: true}
      - {id: genre, titre: "Le genre", sous_titre: "masculin ou féminin : petit → petite, il → elle"}
      - {id: nombre, titre: "Le nombre", sous_titre: "singulier ou pluriel : un chat → des chats"}
      - {id: personne, titre: "La personne et le temps", sous_titre: "pour le verbe : je joue, nous jouons, je jouais"}
      - {id: invariables, titre: "Les mots invariables", sous_titre: "vite, très, souvent, dans, avec : jamais de changement"}
    liens:
      - {de: varient, vers: genre}
      - {de: varient, vers: nombre}
      - {de: varient, vers: personne}
      - {de: varient, vers: invariables}
    jules: "Un mot qui **varie**, c'est un mot qui change de forme selon la phrase, comme un caméléon change de couleur. Le **genre** et le **nombre** concernent le déterminant, le nom, l'adjectif et le pronom ; la personne et le temps concernent surtout le verbe."

  - id: schema-phrase
    type: schema
    titre: "Une même phrase au pluriel puis au féminin : qui change, qui reste pareil ?"
    svg: "cm1-classes-de-mots-variations.svg"
    jules: "Regarde la colonne grise : « souvent » ne bouge jamais, c'est un **adverbe**. Regarde aussi le verbe : il change au pluriel (jouent), mais pas au féminin, car un verbe n'a pas de genre."

  - id: schema-determinants
    type: schema
    titre: "Les déterminants changent avec le genre et le nombre du nom"
    svg: "cm1-classes-de-mots-variations-determinants.svg"
    jules: "Au pluriel, il n'y a qu'une forme pour les garçons et les filles : mes vélos, mes trousses. Pour choisir entre son, sa et ses, regarde le nom qui suit, jamais la personne à qui il appartient : Tom range sa trousse."

  - id: graphe-variations
    type: graphe
    gabarit: chaine-accords
    curseurs:
      - {id: curseur-genre, nom: genre, min: 0, max: 1, pas: 1, depart: 0}
      - {id: curseur-nombre, nom: nombre, min: 0, max: 1, pas: 1, depart: 0}
    lectures:
      - {si: "nombre == 1", texte: "Au pluriel, **déterminant, nom, adjectif et verbe** changent (les petits chats dorment) ; l'**adverbe** bien reste pareil."}
      - {si: "genre == 1", texte: "Au féminin, le **déterminant** et l'**adjectif** changent, et ici le nom aussi (la petite chatte) ; le verbe, lui, ne varie pas en genre."}
      - {si: "genre == 0 && nombre == 0", texte: "Bouge un curseur : regarde quels mots **varient** (en orange) et lesquels restent **invariables** (en gris)."}
    jules: "Genre 1 veut dire féminin, nombre 1 veut dire pluriel. Un mot qui ne change jamais, quoi qu'on fasse, est invariable : c'est le cas de l'adverbe bien."

  - id: methode
    type: methode
    etapes:
      - "Trouve la **classe** du mot : est-ce un déterminant, un nom, un adjectif, un pronom, un verbe, ou un autre mot ?"
      - "Essaie de changer le **genre** : remplace un garçon par une fille (mon voisin → ma voisine). Le mot change-t-il ?"
      - "Essaie de changer le **nombre** : passe à plusieurs (le chat → les chats). Le mot change-t-il ?"
      - "Pour un verbe, change aussi la **personne** (je, nous) et le **temps** (hier, demain) : je joue, nous jouons, je jouerai."
      - "Si rien ne change jamais, c'est un mot **invariable**. En cas de doute, vérifie dans ton tableau de conjugaison ou ton dictionnaire."
    jules: "Les mots invariables les plus fréquents s'apprennent par cœur, comme une liste de courses : très, vite, souvent, toujours, dans, avec, pour, sous. Ils ne prennent jamais de s, même au milieu d'un groupe au pluriel."

  - id: piege
    type: piege
    mauvaise_idee: "« Amie » est un nom féminin, donc j'écris « ma amie », comme « ma sœur »."
    pourquoi_faux: "Devant un nom féminin qui commence par une **voyelle**, le **déterminant possessif** ma devient mon. On entendrait sinon « ma-amie », difficile à dire."
    bonne_idee: "On écrit mon amie, ton école, son histoire. Mais on garde ma devant une consonne : ma meilleure amie. Même idée pour ce : cet arbre, cet ami."
    jules: "Mon amie reste un nom féminin : l'adjectif le montre, « mon amie est gentille ». Autre piège : croire qu'un adverbe varie. Elles courent vite, sans s, car « vite » est **invariable**."

  - id: exemple-cartable
    type: exemple
    situation: "Transforme la phrase en remplaçant le garçon par plusieurs filles : « Il range son cartable dans le placard. »"
    calcul: "Il → Elles : le pronom change de genre et de nombre. Range → rangent : le verbe s'accorde avec « elles ». Son cartable → leurs cartables : plusieurs filles, chacune son cartable. « dans » ne change pas."
    conclusion: "Elles **rangent** leurs cartables dans le placard. Le pronom, le verbe, le déterminant et le nom ont changé ; la préposition « dans » est restée pareille."
    jules: "« le placard » ne change pas ici, car ce groupe ne dépend pas des filles : il n'y a toujours qu'un placard. On ne transforme que les mots qui dépendent de la personne qui agit."

  - id: exemple-trier
    type: exemple
    situation: "Dans la phrase « Nos petits chiens aboient très souvent. », quels mots peuvent changer de forme ?"
    calcul: "Au singulier : « Notre petit chien aboie très souvent. » Nos → notre (déterminant), petits → petit (adjectif), chiens → chien (nom), aboient → aboie (verbe). Très et souvent restent pareils."
    conclusion: "Quatre mots **varient** : nos, petits, chiens, aboient. Deux mots sont **invariables** : les adverbes très et souvent."
    jules: "Pour trier, transforme la phrase et compare les deux versions mot par mot, avec ton doigt. Ce qui bouge varie, ce qui reste identique est invariable."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : pars de « Mon petit frère est gourmand », puis écris « Mes petits frères sont gourmands » et « Ma petite sœur est gourmande ». Entoure en couleur tout ce qui a changé."
