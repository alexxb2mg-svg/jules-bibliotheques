  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 10", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: mot, titre: "Un mot nouveau", sous_titre: "je cherche son sens au lieu de le sauter", principal: true}
      - {id: morceaux, titre: "Ses morceaux", sous_titre: "sous + terre : souterrain, sous la terre"}
      - {id: contexte, titre: "Le contexte", sous_titre: "les mots autour m'aident à deviner"}
      - {id: sens, titre: "Plusieurs sens", sous_titre: "une belle vue, une bonne vue, un point de vue"}
      - {id: theme, titre: "Un même thème", sous_titre: "vague, sable, phare : le champ lexical de la mer"}
    liens:
      - {de: mot, vers: morceaux}
      - {de: mot, vers: contexte}
      - {de: mot, vers: sens}
      - {de: mot, vers: theme}
    jules: "Les mots nouveaux arrivent dans toutes les matières : « affluent » en géographie, « nocturne » en sciences, « château fort » en histoire. Chaque leçon est une chasse aux mots !"

  - id: schema-famille
    type: schema
    titre: "La famille du mot terre dessinée en arbre"
    svg: "cm1-enrichir-vocabulaire.svg"
    jules: "Si tu connais un mot de la famille, tu as une clé pour tous les autres. Tu ne connais pas « terrestre » ? Tu y vois « terre » : ça parle de la Terre ou du sol."

  - id: schema-sens
    type: schema
    titre: "Le mot vue et ses trois sens selon la phrase"
    svg: "cm1-enrichir-vocabulaire-sens.svg"
    jules: "Dans le dictionnaire, les différents sens d'un mot sont numérotés 1, 2, 3. Lis-les tous, puis choisis celui qui va avec ta phrase."

  - id: schema-mer
    type: schema
    titre: "Le champ lexical de la mer, sur un dessin de plage"
    svg: "cm1-enrichir-vocabulaire-mer.svg"
    jules: "Avant d'écrire un texte sur la mer, fais la liste de ces mots au brouillon. Ton texte sera plus précis : « les vagues » plutôt que « l'eau qui bouge »."

  - id: methode
    type: methode
    etapes:
      - "Je repère le **mot inconnu** dans la phrase, au lieu de le sauter."
      - "J'observe ses morceaux : est-ce que j'y reconnais un mot que je connais déjà ?"
      - "Je relis la phrase entière et celle d'avant : le **contexte** m'aide à deviner de quoi on parle."
      - "Je vérifie mon idée dans le **dictionnaire** et je choisis le sens qui va avec la phrase."
      - "Je réutilise le mot dans une phrase à moi, à l'oral ou à l'écrit, pour le garder."
    jules: "Un mot entendu une seule fois s'oublie vite. Un mot que tu as employé toi-même trois fois, dans trois phrases différentes, reste dans ta tête."

  - id: piege
    type: piege
    mauvaise_idee: "Dans « Le navire quitte le port », je ne connais pas « navire », alors je le saute et je continue ma lecture."
    pourquoi_faux: "En sautant le mot, je peux mal comprendre toute l'histoire. Pourtant, le **contexte** aide : un navire « quitte le port »."
    bonne_idee: "Les mots autour (quitte, port) me font penser à un bateau. Je vérifie dans le dictionnaire : un navire est un grand bateau."
    jules: "Autre piège : croire qu'un mot n'a qu'un seul sens. « Une souris » peut être un animal… ou l'objet qu'on tient pour faire bouger la flèche d'un ordinateur !"

  - id: exemple-morceaux
    type: exemple
    situation: "Dans un livre, Maëlle lit : « Ce bateau est insubmersible. » Elle ne connaît pas ce mot. Comment le comprendre ?"
    calcul: "Elle cherche les morceaux : in- (qui veut dire « pas »), submerger (être recouvert par l'eau), -ible (qu'on peut). Donc « qu'on ne peut pas recouvrir d'eau »."
    conclusion: "Un bateau **insubmersible** est un bateau qui ne peut pas couler. Le dictionnaire le confirme."
    jules: "Le même début « in- » se retrouve dans invisible, inutile, incroyable. Quand tu l'as repéré une fois, tu le reconnais partout."

  - id: exemple-contexte
    type: exemple
    situation: "En sciences, Ilyes lit : « La grenouille est un amphibien : elle vit dans l'eau quand elle est têtard, puis sur la terre ferme. » Que veut dire « amphibien » ?"
    calcul: "La suite de la phrase explique le mot, après les deux points : l'animal vit dans l'eau, puis sur la terre."
    conclusion: "Un **amphibien** est un animal qui vit une partie de sa vie dans l'eau et une partie sur terre, comme la grenouille ou le crapaud."
    jules: "Les deux points « : » annoncent souvent une explication. Quand un mot difficile est suivi de « : », lis la suite, la réponse est souvent là."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine l'arbre de la famille du mot « dent » (dentiste, dentier, dentifrice, édenté…). Colorie le radical « dent » dans chaque mot."
