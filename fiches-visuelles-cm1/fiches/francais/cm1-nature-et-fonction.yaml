notion: cm1-nature-et-fonction
titre: "Nature et fonction : ce qu'est un mot, et le rôle qu'il joue"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 17", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 12", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: mot, titre: "Un mot dans une phrase", sous_titre: "il a une nature et une fonction", principal: true}
      - {id: nature, titre: "Sa nature", sous_titre: "ce qu'il est : nom, verbe, adjectif, déterminant, pronom…"}
      - {id: fixe, titre: "La nature ne change pas", sous_titre: "chat est un nom dans toutes les phrases"}
      - {id: fonction, titre: "Sa fonction", sous_titre: "le rôle qu'il joue dans cette phrase : sujet, COD…"}
      - {id: bouge, titre: "La fonction change", sous_titre: "le même mot peut être sujet, puis COD"}
    liens:
      - {de: mot, vers: nature}
      - {de: nature, vers: fixe}
      - {de: mot, vers: fonction}
      - {de: fonction, vers: bouge}
    jules: "Pense à un joueur de foot : c'est toujours un enfant, c'est sa nature. Mais un jour il joue gardien, un autre jour attaquant : c'est sa fonction dans le match."

  - id: schema-chat
    type: schema
    titre: "Le nom « chat » garde sa nature, mais change de fonction d'une phrase à l'autre"
    svg: "cm1-nature-et-fonction.svg"
    jules: "La nature, tu la trouves dans le dictionnaire, sans phrase autour. La fonction, impossible de la trouver seule : il faut regarder la phrase et le verbe."

  - id: schema-sujets
    type: schema
    titre: "Un groupe nominal, un nom propre et un pronom peuvent tous être sujets"
    svg: "cm1-nature-et-fonction-sujets.svg"
    jules: "Le verbe est le **pivot** de la phrase : c'est à lui qu'on pose les questions. Quel que soit le mot mis devant, ma sœur, Inès ou elle, c'est lui qui range."

  - id: graphe
    type: graphe
    gabarit: phrase-en-blocs
    curseurs:
      - {id: curseur-phrase, nom: phrase, min: 3, max: 3, pas: 1, depart: 3}
      - {id: curseur-position, nom: position, min: 0, max: 2, pas: 1, depart: 0}
    lectures:
      - {si: "position == 0", texte: "« Le matin est calme. » : le groupe est **sujet** du verbe est."}
      - {si: "position == 1", texte: "« Léa aime le matin. » : Léa aime quoi ? le matin, sans préposition : c'est un **COD**."}
      - {si: "position == 2", texte: "« Léa lit le matin. » : Léa lit quand ? le matin. On peut l'enlever : **complément circonstanciel**."}
      - {si: "position >= 0", texte: "Dans les trois phrases, sa **nature** ne change pas : « le matin » est toujours un **groupe nominal**."}
    jules: "Regarde les deux étiquettes : celle du haut (la fonction) change avec la phrase, celle du bas (la nature) ne bouge jamais. C'est toute la différence entre les deux."

  - id: methode
    type: methode
    etapes:
      - "Pour la **nature**, regarde le mot tout seul : qu'est-ce que c'est ? Un nom, un verbe, un adjectif, un déterminant, un pronom ?"
      - "Pour la **fonction**, regarde la phrase : trouve d'abord le verbe, puis demande-toi quel rôle le mot ou le groupe joue pour lui."
      - "Pose les questions au verbe : « qui est-ce qui ? » donne le sujet, « qui ? » ou « quoi ? » après le verbe donne le COD."
      - "Vérifie le sujet en le remplaçant par un pronom : ma sœur devient elle, la fonction ne bouge pas."
    jules: "Dans ta réponse, dis toujours les deux : « chat est un nom (nature) ; ici, le chat est sujet du verbe dort (fonction). » Tu ne mélangeras plus jamais les deux."

  - id: piege
    type: piege
    mauvaise_idee: "« Chat » est un sujet. C'est sa nature."
    pourquoi_faux: "Sujet n'est pas une nature, c'est une **fonction**. Dans « Mia caresse le chat. », le même mot n'est plus sujet : il est COD. Sa **nature**, elle, reste la même : nom."
    bonne_idee: "Chat est un **nom** (nature). Dans « Le chat dort. », le chat est sujet du verbe dort (fonction)."
    jules: "Petit test : si ta réponse change quand la phrase change, c'est une fonction. Si elle reste la même partout, c'est une nature."

  - id: exemple-lucas
    type: exemple
    situation: "Lucas écrit : « Il mange une pomme. » Quelle est la nature du mot il ? Quelle est sa fonction ?"
    calcul: "Nature : il remplace un nom (Lucas), c'est un **pronom personnel**. Fonction : qui est-ce qui mange ? Il. C'est le sujet du verbe mange."
    conclusion: "Il est un pronom personnel (nature), sujet du verbe mange (fonction)."
    jules: "Si on remet Lucas à la place de il, la nature change (un nom propre au lieu d'un pronom), mais la fonction reste sujet."

  - id: exemple-livre
    type: exemple
    situation: "Deux phrases de Nina : « Je prête mon livre. » et « Mon livre traîne sous la table. » Donne la nature et la fonction de « mon livre » dans chacune."
    calcul: "Nature : mon est un déterminant, livre est un nom, c'est un **groupe nominal** dans les deux phrases. Première phrase : je prête quoi ? mon livre, COD. Deuxième phrase : qu'est-ce qui traîne ? mon livre, sujet."
    conclusion: "Même nature (groupe nominal), deux **fonctions** différentes : COD, puis sujet."
    jules: "Quand le sujet n'est pas une personne, la question devient « qu'est-ce qui ? » au lieu de « qui est-ce qui ? »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : écris deux phrases avec le mot ballon, une où il est sujet, une où il est COD. Sa nature, elle, reste nom."
