<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg"><title>Le groupe nominal « le petit chat noir » en boîtes, et l'accord commandé par le nom noyau</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Le groupe nominal : des boîtes autour d'un noyau</text>
<rect x="161.0" y="123.0" width="50.1" height="54.0" rx="8" fill="#FDEBDD" stroke="#D9480F" stroke-width="1.8"/>
<text x="186.1" y="150.0" font-size="28" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">le</text>
<rect x="227.1" y="123.0" width="92.4" height="54.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.8"/>
<text x="273.3" y="150.0" font-size="28" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">petit</text>
<rect x="335.5" y="123.0" width="87.5" height="54.0" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="3"/>
<text x="379.3" y="150.0" font-size="28" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">chat</text>
<rect x="439.0" y="123.0" width="79.9" height="54.0" rx="8" fill="#E3F3E6" stroke="#2B8A3E" stroke-width="1.8"/>
<text x="479.0" y="150.0" font-size="28" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">noir</text>
<rect x="145.0" y="102.0" width="390.0" height="96.0" rx="14" fill="none" stroke="#6B7686" stroke-width="2" stroke-dasharray="7 5"/>
<text x="145.0" y="90.0" font-size="15" fill="#6B7686" font-weight="700" text-anchor="start" dominant-baseline="central">groupe nominal</text>
<path d="M273.3 120.0 Q319.3 62.0 365.3 120.0" fill="none" stroke="#2B8A3E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<path d="M479.0 120.0 Q436.2 62.0 393.3 120.0" fill="none" stroke="#2B8A3E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="379.3" y="58.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">épithètes : collés au nom</text>
<text x="186.1" y="212.0" font-size="15" fill="#D9480F" font-weight="800" text-anchor="middle" dominant-baseline="central">déterminant</text>
<text x="273.3" y="212.0" font-size="15" fill="#2B8A3E" font-weight="800" text-anchor="middle" dominant-baseline="central">adjectif</text>
<text x="379.3" y="212.0" font-size="15" fill="#1D4E89" font-weight="800" text-anchor="middle" dominant-baseline="central">NOM NOYAU</text>
<text x="479.0" y="212.0" font-size="15" fill="#2B8A3E" font-weight="800" text-anchor="middle" dominant-baseline="central">adjectif</text>
<text x="273.3" y="232.0" font-size="13" fill="#2B8A3E" font-weight="600" text-anchor="middle" dominant-baseline="central">avant le nom</text>
<text x="479.0" y="232.0" font-size="13" fill="#2B8A3E" font-weight="600" text-anchor="middle" dominant-baseline="central">après le nom</text>
<text x="379.3" y="232.0" font-size="13" fill="#1D4E89" font-weight="600" text-anchor="middle" dominant-baseline="central">le mot principal</text>
<line x1="20.0" y1="262.0" x2="660.0" y2="262.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="286.0" font-size="16" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">Le noyau donne son genre et son nombre à tout le groupe</text>
<text x="340.0" y="340.0" font-size="28" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F">les</tspan><tspan fill="#2B8A3E"> petit</tspan><tspan fill="#C92A2A" font-weight="800">es</tspan><tspan fill="#1D4E89"> chatt</tspan><tspan fill="#C92A2A" font-weight="800">es</tspan><tspan fill="#2B8A3E"> noir</tspan><tspan fill="#C92A2A" font-weight="800">es</tspan></text>
<path d="M368.2 360.0 Q277.1 430.0 184.0 360.0" fill="none" stroke="#C92A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<path d="M346.2 360.0 Q315.5 386.0 260.9 360.0" fill="none" stroke="#C92A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<path d="M380.2 360.0 Q421.8 396.0 473.4 360.0" fill="none" stroke="#C92A2A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="340.0" y="420.0" font-size="15" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">chattes est au féminin pluriel : le déterminant et les adjectifs aussi.</text>
<text x="340.0" y="448.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Orange = déterminant, bleu = nom noyau, vert = adjectif épithète.</text>
</svg>
