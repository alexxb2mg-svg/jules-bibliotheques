notion: cm1-accorder-sujet-verbe
titre: "Accorder le verbe avec son sujet, même quand il se cache"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 18", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, guide fondamental « La grammaire du français du CP à la 6e », p. 149", url: "https://eduscol.education.gouv.fr/sites/default/files/document/guide-la-grammaire-du-francais-du-cp-la-6e-97251.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations: {Mme: "Madame"}
blocs:
  - id: essentiel
    type: formule
    expression: "[Les enfants] de ma classe [jouent] au foot."
    termes:
      "Les enfants": {couleur: bleu, legende: "le **sujet**. Son nom noyau est « enfants » : pluriel, 3e personne, comme « ils »."}
      "jouent": {couleur: orange, legende: "le **verbe**, accordé avec « ils » : terminaison -ent. « de ma classe » ne compte pas."}
    jules: "Le verbe s'accorde toujours avec son sujet, en **personne** et en **nombre**. Pour trouver le sujet, pose la question « Qui est-ce qui joue ? » : la réponse est « les enfants »."

  - id: carte
    type: carte
    noeuds:
      - {id: accord, titre: "Le verbe s'accorde avec son sujet", sous_titre: "en personne et en nombre", principal: true}
      - {id: trouver, titre: "Trouver le sujet", sous_titre: "« Qui est-ce qui... ? » ou « C'est... qui »"}
      - {id: ecran, titre: "Les mots écrans", sous_titre: "Les enfants de ma classe jouent : on saute « de ma classe »"}
      - {id: apres, titre: "Le sujet après le verbe", sous_titre: "Dans la cour jouent les enfants"}
      - {id: etre, titre: "Avec l'auxiliaire être", sous_titre: "le participe s'accorde aussi : Anna est tombée"}
    liens:
      - {de: accord, vers: trouver}
      - {de: accord, vers: ecran}
      - {de: accord, vers: apres}
      - {de: accord, vers: etre}
    jules: "Le sujet, c'est celui qui fait l'action, ou dont on parle. Remplace-le par un pronom (il, elle, ils, elles) : tu sauras tout de suite quelle terminaison mettre."

  - id: schema-sujet
    type: schema
    titre: "La flèche va du sujet vers le verbe, même s'il est loin ou placé après"
    svg: "cm1-accorder-sujet-verbe.svg"
    jules: "Dans la phrase 2, le verbe est collé à « ma classe », mais ce n'est pas son sujet : ce n'est pas la classe qui joue. Dans la phrase 3, le sujet arrive après le verbe : la question « Qui est-ce qui joue ? » le retrouve quand même."

  - id: schema-etre
    type: schema
    titre: "Avec l'auxiliaire être, le participe passé s'accorde avec le sujet"
    svg: "cm1-accorder-sujet-verbe-etre.svg"
    jules: "Avec **être**, le participe passé se comporte comme un adjectif : il prend e au féminin et s au pluriel. Avec **avoir**, il ne s'accorde pas avec le sujet."

  - id: methode
    type: methode
    etapes:
      - "Trouve le **verbe** conjugué : c'est le mot qui change quand tu dis la phrase hier ou demain."
      - "Trouve le **sujet** : demande « Qui est-ce qui... ? » devant le verbe. La réponse peut être avant ou après le verbe."
      - "Si le sujet est un groupe nominal, garde son **nom noyau** et saute les mots écrans (de ma classe, de Lina...)."
      - "Remplace le sujet par un pronom (il, elle, ils, elles) et écris la terminaison qui va avec : il joue, ils jouent."
      - "Au passé composé avec **être**, accorde aussi le participe passé avec le sujet : elles sont parties."
    jules: "Trace la flèche du sujet vers le verbe sur ton brouillon, comme sur le schéma. Si la flèche part d'un mot comme « classe » ou « Lina », c'est que tu t'es trompé de sujet."

  - id: piege
    type: piege
    mauvaise_idee: "Au passé composé, le participe passé ne change jamais : « Les filles sont tombé dans la cour. »"
    pourquoi_faux: "Avec l'auxiliaire **être**, le participe passé s'accorde avec le **sujet**. Ici, le sujet « les filles » est féminin pluriel : le participe prend e et s."
    bonne_idee: "Les filles sont tombées dans la cour. Mais avec avoir, pas d'accord avec le sujet : Les filles ont joué dans la cour."
    jules: "Pour savoir si tu dois accorder, regarde l'auxiliaire juste avant le participe : est, sont, suis → j'accorde ; a, ont, ai → je n'accorde pas avec le sujet."

  - id: exemple-ecran
    type: exemple
    situation: "Samir écrit l'invitation de son anniversaire : « Les copines de Lina (arriver) à 14 h. » Comment accorder le verbe arriver au présent ?"
    calcul: "Qui est-ce qui arrive ? Les copines de Lina. Le nom noyau est « copines », pas « Lina » : c'est un mot écran. Les copines = elles, donc la terminaison est -ent."
    conclusion: "Les copines de Lina **arrivent** à 14 h. Le verbe s'accorde avec « copines » (pluriel), et non avec « Lina » (singulier)."
    jules: "À l'oral, arrive et arrivent se prononcent pareil : seule ta flèche peut te sauver. Barre les mots écrans au crayon à papier pour mieux voir le vrai sujet."

  - id: exemple-eleves
    type: exemple
    situation: "Dans la classe de Mme Roy, les élèves élèvent des phasmes. Pourquoi « élèves » et « élèvent » ne s'écrivent-ils pas pareil ?"
    calcul: "« les élèves » est un **nom** au pluriel : il prend s (une élève, des élèves). « élèvent » est un **verbe** conjugué avec « ils » : il prend -ent (il élève, ils élèvent)."
    conclusion: "Le nom prend un s au pluriel, le verbe prend -ent. Pour savoir lequel écrire, cherche si le mot est un nom (on peut mettre « les » devant) ou un verbe (on peut mettre « ils »)."
    jules: "Un phasme est un insecte qui ressemble à une brindille : on en élève souvent en classe. Avec « ils » ou « elles », le verbe conjugué finit toujours par -nt : ils élèvent, ils sont, ils iront."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : écris trois phrases sur la récréation avec un mot écran, comme « Les ballons de la classe roulent ». Trace la flèche du sujet vers le verbe à chaque fois."
