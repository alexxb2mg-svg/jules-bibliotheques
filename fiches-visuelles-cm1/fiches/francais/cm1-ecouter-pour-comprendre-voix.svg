<svg width="100%" viewBox="0 0 680 462" xmlns="http://www.w3.org/2000/svg"><title>Les indices de la voix : question, suspense, mot important, émotion</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Ce qu'on entend</text>
<text x="430.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Ce que ça m'apprend</text>
<line x1="410.0" y1="34.0" x2="410.0" y2="450.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="20.0" y1="140.0" x2="400.0" y2="140.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="420.0" y1="140.0" x2="660.0" y2="140.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="20.0" y1="244.0" x2="400.0" y2="244.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="420.0" y1="244.0" x2="660.0" y2="244.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="20.0" y1="348.0" x2="400.0" y2="348.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="420.0" y1="348.0" x2="660.0" y2="348.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="30.0" y="96.0" font-size="22" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Tu viens au parc ?</text>
<path d="M30 70 L149 70 Q212 69 242 46" fill="none" stroke="#D9480F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="254.2" y="52.0" font-size="13" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">la voix monte</text>
<text x="430.0" y="76.0" font-size="16" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">C'est une question :</text>
<text x="430.0" y="100.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">on attend une réponse.</text>
<text x="30.0" y="194.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Il ouvre la porte</text>
<text x="187.2" y="194.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">…</text>
<line x1="192.4" y1="164.0" x2="192.4" y2="176.0" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round"/>
<line x1="198.4" y1="164.0" x2="198.4" y2="176.0" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round"/>
<text x="211.7" y="194.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">et</text>
<text x="238.6" y="194.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">…</text>
<line x1="243.9" y1="164.0" x2="243.9" y2="176.0" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round"/>
<line x1="249.9" y1="164.0" x2="249.9" y2="176.0" stroke="#D9480F" stroke-width="2.4" stroke-linecap="round"/>
<text x="263.1" y="194.0" font-size="30" fill="#C92A2A" font-weight="700" text-anchor="start" dominant-baseline="central">BOUM !</text>
<text x="30.0" y="226.0" font-size="13" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">‖ = une pause : on retient son souffle</text>
<text x="430.0" y="168.0" font-size="16" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">Du suspense, puis</text>
<text x="430.0" y="192.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">une surprise : il va se</text>
<text x="430.0" y="216.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">passer quelque chose !</text>
<text x="30.0" y="290.0" font-size="18" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="500">C'est </tspan><tspan fill="#C92A2A" font-weight="700">TRÈS</tspan><tspan fill="#1a1a18" font-weight="500"> important : départ à </tspan><tspan fill="#C92A2A" font-weight="700">8 h</tspan><tspan fill="#1a1a18" font-weight="500">.</tspan></text>
<line x1="80.1" y1="304.0" x2="127.2" y2="304.0" stroke="#D9480F" stroke-width="2.6" stroke-linecap="round"/>
<line x1="319.3" y1="304.0" x2="346.9" y2="304.0" stroke="#D9480F" stroke-width="2.6" stroke-linecap="round"/>
<text x="30.0" y="328.0" font-size="13" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">la voix appuie plus fort sur ces deux mots</text>
<text x="430.0" y="284.0" font-size="16" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">L'information</text>
<text x="430.0" y="308.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">à retenir absolument.</text>
<text x="30.0" y="406.0" font-size="18" fill="#6B7686" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">Snif… mon chat… est parti…</text>
<path d="M30 372 Q167 368 285 392" fill="none" stroke="#D9480F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="30.0" y="436.0" font-size="13" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">voix basse, lente, qui descend</text>
<text x="430.0" y="376.0" font-size="16" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">Le personnage est triste,</text>
<text x="430.0" y="400.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">et moi, ça me rend triste</text>
<text x="430.0" y="424.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">aussi : je le ressens.</text>
</svg>
