<svg width="100%" viewBox="0 0 680 456" xmlns="http://www.w3.org/2000/svg"><title>Préfixes et suffixes en couleur : la famille de coller</title>
<text x="20.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">La famille de « coller » : on ajoute des morceaux</text>
<text x="20.0" y="46.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1D4E89" font-weight="700">préfixe</tspan><tspan fill="#1a1a18"> (avant)  +  </tspan><tspan fill="#D9480F" font-weight="700">radical</tspan><tspan fill="#1a1a18"> (le cœur du mot)  +  </tspan><tspan fill="#2B8A3E" font-weight="700">suffixe</tspan><tspan fill="#1a1a18"> (après)</tspan></text>
