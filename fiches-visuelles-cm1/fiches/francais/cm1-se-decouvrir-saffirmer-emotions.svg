<text class="t" x="532.0" y="217.0" text-anchor="start" dominant-baseline="central">bien droit,</text>
<text class="t" x="532.0" y="236.0" text-anchor="start" dominant-baseline="central">je souris</text>
<rect x="12.0" y="282.0" width="656.0" height="146.0" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4"/>
<text class="th" x="340.0" y="304.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Dans un récit de soi, j'écris au « je » et je montre l'émotion :</text>
<text class="t" x="40.0" y="336.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">moins fort :</text>
<text class="t" x="150.0" y="336.0" text-anchor="start" dominant-baseline="central" font-style="italic">« J'avais peur. »</text>
<text class="t" x="40.0" y="368.0" text-anchor="start" dominant-baseline="central" fill="#534AB7">plus fort :</text>
<text class="t" x="150.0" y="368.0" text-anchor="start" dominant-baseline="central" font-style="italic">« J'avais si peur que mes mains tremblaient</text>
<text class="t" x="150.0" y="390.0" text-anchor="start" dominant-baseline="central" font-style="italic">sur l'échelle du plongeoir. »</text>
<text class="ts" x="340.0" y="416.0" text-anchor="middle" dominant-baseline="central">On nomme l'émotion, puis on dit ce que le corps ressent.</text>
