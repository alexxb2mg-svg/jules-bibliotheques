<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg"><title>Récit, poème ou théâtre : reconnaître le genre d'un texte à sa mise en page</title>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Récit, poème ou théâtre : la mise en page te le dit</text>
<rect x="20.0" y="50.0" width="200.0" height="250.0" rx="4" fill="#FFFFFF" stroke="#bdb8aa" stroke-width="1.5"/>
<text x="120.0" y="322.0" font-size="18" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">Un récit</text>
<rect x="240.0" y="50.0" width="200.0" height="250.0" rx="4" fill="#FFFFFF" stroke="#bdb8aa" stroke-width="1.5"/>
<text x="340.0" y="322.0" font-size="18" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">Un poème</text>
<rect x="460.0" y="50.0" width="200.0" height="250.0" rx="4" fill="#FFFFFF" stroke="#bdb8aa" stroke-width="1.5"/>
<text x="560.0" y="322.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">Du théâtre</text>
<text x="50.0" y="80.0" font-size="12.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Mercredi midi, Hugo</text>
<rect x="32.0" y="97.0" width="176.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="32.0" y="115.0" width="176.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="32.0" y="133.0" width="176.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="32.0" y="151.0" width="110.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="50.0" y="175.0" width="158.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="32.0" y="193.0" width="176.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="32.0" y="211.0" width="176.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="32.0" y="229.0" width="176.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="32.0" y="247.0" width="176.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="32.0" y="265.0" width="90.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<line x1="30.0" y1="80.0" x2="46.0" y2="80.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<line x1="30.0" y1="74.0" x2="30.0" y2="86.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<line x1="46.0" y1="74.0" x2="46.0" y2="86.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<text x="256.0" y="94.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Dans le jardin tout</text>
<text x="384.1" y="94.0" font-size="13.5" fill="#3B6D11" font-weight="700" text-anchor="start" dominant-baseline="central">vert</text>
<text x="411.2" y="94.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">,</text>
<text x="256.0" y="120.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Il croque ses</text>
<text x="345.7" y="120.0" font-size="13.5" fill="#3B6D11" font-weight="700" text-anchor="start" dominant-baseline="central">salades</text>
<text x="396.4" y="120.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">,</text>
<text x="256.0" y="146.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Le nez au vent, à l'</text>
<text x="381.6" y="146.0" font-size="13.5" fill="#3B6D11" font-weight="700" text-anchor="start" dominant-baseline="central">air</text>
<text x="399.1" y="146.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">,</text>
<text x="256.0" y="172.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Il part en</text>
<text x="321.4" y="172.0" font-size="13.5" fill="#3B6D11" font-weight="700" text-anchor="start" dominant-baseline="central">promenade</text>
<text x="396.7" y="172.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">.</text>
<rect x="256.0" y="211.0" width="120.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="256.0" y="229.0" width="104.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="256.0" y="259.0" width="132.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="256.0" y="277.0" width="96.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<path d="M426 82 Q433 82 433 90 L433 127.0 Q433 133.0 439 133.0 Q433 133.0 433 139.0 L433 176 Q433 184 426 184" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="472.0" y="80.0" font-size="13" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">HUGO. </tspan><tspan fill="#1a1a18" font-weight="500">— Caramel !</tspan></text>
<text x="472.0" y="100.0" font-size="13" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="500">Où es-tu ?</tspan></text>
<text x="472.0" y="124.0" font-size="13" fill="#5f5e5a" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">Il cherche derrière</text>
<text x="472.0" y="142.0" font-size="13" fill="#5f5e5a" font-weight="500" font-style="italic" text-anchor="start" dominant-baseline="central">les salades.</text>
<text x="472.0" y="168.0" font-size="13" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">MAMAN. </tspan><tspan fill="#1a1a18" font-weight="500">— Regarde,</tspan></text>
<text x="472.0" y="188.0" font-size="13" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="500">là-bas !</tspan></text>
<text x="472.0" y="214.0" font-size="13" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">HUGO. </tspan><tspan fill="#1a1a18" font-weight="500">— Ouf !</tspan></text>
<rect x="472.0" y="235.0" width="150.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="472.0" y="253.0" width="120.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<rect x="472.0" y="271.0" width="160.0" height="6.0" rx="3" fill="#C9C4B6" stroke="none" stroke-width="0"/>
<text x="120.0" y="348.0" font-size="14" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">des paragraphes</text>
<text x="120.0" y="367.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">un retrait au début :</text>
<text x="120.0" y="386.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">l'alinéa</text>
<text x="120.0" y="405.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">des lignes pleines</text>
<text x="340.0" y="348.0" font-size="14" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">des vers : lignes courtes</text>
<text x="340.0" y="367.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">des rimes : vert, air</text>
<text x="340.0" y="386.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">des strophes :</text>
<text x="340.0" y="405.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">groupes de vers</text>
<text x="560.0" y="348.0" font-size="14" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">le NOM du personnage</text>
<text x="560.0" y="367.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">puis sa réplique</text>
<text x="560.0" y="386.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">en italique : ce qu'il fait</text>
<text x="560.0" y="405.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">(la didascalie)</text>
</svg>
