notion: cm1-ecriture-cursive-et-copie
titre: "L'écriture attachée et la copie : bonnes hauteurs, bon sens, groupes de mots"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 8", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 8", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: hauteurs
    type: formule
    expression: "[a, e, u] : 1 interligne · [t, d, p] : 2 · [l, b, h] : 3"
    termes:
      "a, e, u": {couleur: bleu, legende: "les **petites lettres** montent d'un interligne, jusqu'à la première petite ligne : 2 millimètres (mm) sur ton cahier."}
      "t, d, p": {couleur: vert, legende: "t et d montent de **2 interlignes** ; p descend de 2 interlignes sous la ligne d'écriture."}
      "l, b, h": {couleur: orange, legende: "les lettres à **boucle** montent de 3 interlignes, presque jusqu'à la grande ligne suivante."}
    jules: "Sur un cahier à grands carreaux (Seyès), un grand carreau fait 8 mm de haut, partagé par 3 petites lignes en 4 interlignes de 2 mm. Les hauteurs peuvent varier un peu selon ta classe : suis le modèle de ta maîtresse ou de ton maître."

  - id: carte
    type: carte
    noeuds:
      - {id: cursive, titre: "Écrire en cursive et copier", sous_titre: "lisible, régulier, sans erreur", principal: true}
      - {id: attache, titre: "Lettres attachées", sous_titre: "un mot d'un seul trait, sans lever le crayon"}
      - {id: hauteur, titre: "La bonne hauteur", sous_titre: "1, 2 ou 3 interlignes selon la lettre"}
      - {id: sens, titre: "Le bon sens", sous_titre: "a, c, d, o : on tourne vers la gauche"}
      - {id: groupes, titre: "Copier par groupes", sous_titre: "lire, garder en tête, écrire, vérifier"}
    liens:
      - {de: cursive, vers: attache}
      - {de: cursive, vers: hauteur}
      - {de: cursive, vers: sens}
      - {de: cursive, vers: groupes}
    jules: "Cursive vient d'un mot latin qui veut dire « courir » : c'est une écriture faite pour que la main coure sur la feuille sans s'arrêter."

  - id: schema-lettres
    type: schema
    titre: "Les lettres attachées sur les lignes Seyès : hauteur et sens du tracé"
    svg: "cm1-ecriture-cursive-et-copie.svg"
    jules: "Pour les lettres rondes (a, d, o, c), commence en haut à droite et tourne vers la gauche, dans le sens inverse des aiguilles d'une montre. Si tu tournes dans l'autre sens, la lettre ne s'attache plus bien à la suivante."

  - id: schema-copie
    type: schema
    titre: "Copier par groupes de mots : lire, garder en tête, écrire, vérifier"
    svg: "cm1-ecriture-cursive-et-copie-strategie.svg"
    jules: "Un bon groupe, c'est ce que tu peux garder en tête d'un coup : 3 à 5 mots qui vont ensemble. Les virgules t'aident souvent à couper."

  - id: methode
    type: methode
    etapes:
      - "Lis d'abord toute la **phrase** du modèle, pour comprendre ce qu'elle raconte."
      - "Choisis un **groupe de mots** (3 à 5 mots qui vont ensemble) et répète-le dans ta tête, avec ses accents et sa ponctuation."
      - "Écris ce groupe sans regarder le modèle, en attachant les lettres, sur la ligne et à la bonne hauteur."
      - "Passe au groupe suivant. À la fin de la phrase, **compare** mot par mot avec le modèle : lettres, accents, virgules, point."
      - "Soigne la présentation : la marge respectée, une écriture régulière, une ligne sautée si le modèle en saute."
    jules: "Comprendre ce qu'on copie aide beaucoup : une phrase qui a un sens se retient bien mieux qu'une suite de lettres."

  - id: piege
    type: piege
    mauvaise_idee: "Pour ne pas me tromper, je copie lettre par lettre en regardant le modèle à chaque fois : C, e, espace, m, a, t…"
    pourquoi_faux: "C'est très lent : pour « Ce matin, Chloé a oublié son goûter dans le car. », cela fait 37 allers-retours des yeux. Et à force de changer de place, l'œil saute ou double des lettres."
    bonne_idee: "Je copie par **groupes de mots** : « Ce matin, » puis « Chloé a oublié son goûter » puis « dans le car. ». Seulement 3 allers-retours, et je **vérifie** à la fin."
    jules: "Les erreurs de copie les plus fréquentes sont les oublis : un accent, une virgule, le point final. C'est exactement ce que la vérification finale doit chercher."

  - id: exemple-verifier
    type: exemple
    situation: "Le modèle au tableau : « Le loup, affamé, entra dans la maison. » La copie de Gabin : « Le loup affamé entra dans la maison » Quelles erreurs a-t-il faites ?"
    calcul: "Je compare mot par mot : Le, loup, affamé, entra, dans, la, maison sont justes. Je compare la ponctuation : il manque les deux **virgules** autour de « affamé » et le **point** final."
    conclusion: "Gabin a fait 3 erreurs, toutes de ponctuation. Les mots étaient justes : c'est la vérification finale qui les trouve."
    jules: "Astuce : relis ta copie en suivant le modèle avec le doigt, et pose un petit point au crayon sous chaque signe de ponctuation vérifié."

  - id: exemple-quinze
    type: exemple
    situation: "La maîtresse demande de copier un texte de 15 lignes. Inès copie un groupe de 4 mots en moyenne à chaque regard. Son texte fait environ 120 mots. Combien de fois doit-elle regarder le modèle ?"
    calcul: "120 ÷ 4 = 30 regards. Lettre par lettre, avec environ 5 lettres par mot, il en faudrait près de 600."
    conclusion: "Avec les **groupes de mots**, Inès regarde le modèle environ 30 fois au lieu de 600 : elle va plus vite et se fatigue moins."
    jules: "Au CM1, l'objectif est de copier une quinzaine de lignes, vite et sans erreur. Chronomètre-toi de temps en temps : tu verras le temps baisser."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : recopie une phrase de ton livre de lecture en 3 groupes de mots, sans regarder le modèle pendant que tu écris. Puis vérifie la ponctuation."
