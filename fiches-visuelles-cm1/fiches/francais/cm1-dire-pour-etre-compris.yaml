notion: cm1-dire-pour-etre-compris
titre: "Dire pour être compris : régler sa voix et ranger son exposé en 3 parties"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 12", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 9", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: plan
    type: formule
    expression: "[le début] → [le milieu] → [la fin]"
    termes:
      "le début": {couleur: violet, legende: "j'**annonce** mon sujet et mon plan : « Je vais vous présenter… D'abord…, puis… »"}
      "le milieu": {couleur: bleu, legende: "j'**explique**, une idée après l'autre : « D'abord… Ensuite… »"}
      "la fin": {couleur: vert, legende: "je **conclus** en une phrase : « Pour conclure… »"}
    jules: "Le public ne peut pas revenir en arrière comme dans un livre. Annoncer ton plan au début, c'est lui donner la carte du chemin."

  - id: carte
    type: carte
    noeuds:
      - {id: dire, titre: "Parler devant la classe", sous_titre: "pour que tout le monde comprenne", principal: true}
      - {id: voix, titre: "Ma voix", sous_titre: "assez forte, posée, bien articulée"}
      - {id: regard, titre: "Mon regard", sous_titre: "vers le public, pas vers ma feuille"}
      - {id: plan, titre: "Mon plan", sous_titre: "début, milieu, fin, avec des mots de liaison"}
      - {id: lire, titre: "Lire à voix haute", sous_titre: "le ton et les pauses font vivre le texte"}
    liens:
      - {de: dire, vers: voix}
      - {de: dire, vers: regard}
      - {de: dire, vers: plan}
      - {de: dire, vers: lire}
    jules: "Un exposé se prépare comme un match : on s'entraîne avant. Répète-le une fois à voix haute devant un miroir ou quelqu'un de ta famille."

  - id: schema-voix
    type: schema
    titre: "Les 4 réglages de la voix : volume, débit, articulation, regard"
    svg: "cm1-dire-pour-etre-compris.svg"
    jules: "Le **débit**, c'est la vitesse à laquelle tu parles. Quand on a le trac, on accélère sans s'en rendre compte : ralentis exprès, ça paraîtra normal au public."

  - id: schema-expose
    type: schema
    titre: "Un mini-exposé en 3 parties sur les abeilles, avec ses mots de liaison"
    svg: "cm1-dire-pour-etre-compris-expose.svg"
    jules: "Sur ta fiche, écris seulement des mots-clés, en gros. Si tu écris tout ton texte, tu vas le lire, et ton public va décrocher."

  - id: graphe-voix
    type: graphe
    gabarit: jauge-voix
    curseurs:
      - {id: curseur-volume, nom: volume, min: 1, max: 5, pas: 1, depart: 3}
      - {id: curseur-debit, nom: debit, min: 60, max: 180, pas: 10, depart: 110}
      - {id: curseur-public, nom: public, min: 1, max: 3, pas: 1, depart: 3}
      - {id: curseur-pauses, nom: pauses, min: 2, max: 2, pas: 1, depart: 2}
    lectures:
      - {si: "public == 3 && volume <= 2", texte: "Devant toute la classe, parle plus fort : **adapte ta voix** au public."}
      - {si: "public == 1 && volume >= 4", texte: "Pour un seul camarade, inutile de parler si fort : baisse le **volume**."}
      - {si: "debit > 130", texte: "Trop vite : ton exposé devient difficile à **suivre**."}
      - {si: "debit >= 90 && debit <= 130 && volume == 3 && public >= 2", texte: "Rythme et volume adaptés : on te **comprend**."}
    jules: "Il n'y a pas une seule bonne voix : la zone verte du volume monte quand le public grandit (public 1 = un camarade, 2 = un groupe, 3 = la classe). Le débit, lui, reste autour de 110 mots par minute."

  - id: methode
    type: methode
    etapes:
      - "Je prépare mes idées et je les range dans l'ordre : le **début**, le **milieu**, la **fin**."
      - "J'utilise les mots appris en classe sur le sujet (ruche, butiner, pollen…)."
      - "Je note des mots-clés sur une petite fiche et je m'entraîne à voix haute."
      - "Devant la classe, je parle assez fort, pas trop vite, et je regarde le public."
      - "Après, j'écoute les remarques et je vérifie les critères donnés par le professeur pour progresser."
    jules: "Avant de commencer, respire une fois lentement et attends que la classe soit silencieuse. Les premiers mots seront bien entendus."

  - id: piege
    type: piege
    mauvaise_idee: "Pour lire le conte à la classe, je lis toutes les phrases de la même voix, bien régulière, sans m'arrêter."
    pourquoi_faux: "Une voix plate endort le public, et on ne sait plus qui parle ni ce qui est important. Les **signes de ponctuation** te disent comment lire."
    bonne_idee: "« Attention ! Le loup arrive. » : je lis « Attention ! » plus fort, je fais une petite pause au point, et ma voix descend à la fin de la phrase. Devant un « ? », ma voix monte."
    jules: "Entraîne-toi en exagérant d'abord, comme un comédien. Ensuite, tu trouveras le bon ton, ni trop plat ni trop fort."

  - id: exemple-tableau
    type: exemple
    situation: "Chloé présente à la classe le résultat d'un sondage : sur 25 élèves, 12 préfèrent la pomme, 8 la banane et 5 la fraise. Comment le dire clairement ?"
    calcul: "Elle commence par « Ce tableau montre que… », puis elle donne le résultat le plus important avant les détails. Elle vérifie le total : 12 + 8 + 5 = 25 élèves."
    conclusion: "« Ce tableau montre que la **pomme** est le fruit préféré de la classe : 12 élèves sur 25 l'ont choisie. Viennent ensuite la banane, avec 8 élèves, et la fraise, avec 5 élèves. »"
    jules: "Des débuts de phrase tout prêts t'aident beaucoup : « Ce tableau montre que… », « Le plus grand nombre, c'est… », « On remarque que… »."

  - id: exemple-reflexif
    type: exemple
    situation: "Yanis a trouvé 75 pour le calcul 48 + 37. La maîtresse lui demande d'expliquer à voix haute comment il a fait."
    calcul: "« J'ai d'abord ajouté les unités : 8 + 7 = 15. J'ai écrit 5, mais j'ai oublié de retenir 1 dizaine. Ensuite, 4 + 3 = 7 dizaines, donc 75. »"
    conclusion: "En le disant à voix haute, Yanis trouve lui-même son **erreur**, la retenue oubliée. Avec la retenue : 4 + 3 + 1 = 8 dizaines, donc 48 + 37 = 85."
    jules: "Parler de sa façon de faire aide à réfléchir : c'est l'oral qui sert d'outil. Tu peux dire « Je me suis sûrement trompé parce que… »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : présente ton animal préféré en 1 minute, avec un début, deux idées et une fin. Fais-toi écouter par quelqu'un qui vérifie le volume, la vitesse et le regard."
