<svg width="100%" viewBox="0 0 680 372" xmlns="http://www.w3.org/2000/svg"><title>Le mot vue et ses trois sens selon la phrase</title>
<text x="20.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Le même mot « vue », trois sens différents</text>
<line x1="20.0" y1="144.0" x2="660.0" y2="144.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="20.0" y1="254.0" x2="660.0" y2="254.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<rect x="24.0" y="44.0" width="120.0" height="88.0" rx="6" fill="#E7F5FF" stroke="#6B7686" stroke-width="1.2"/>
<polygon points="30.0,128.0 70.0,70.0 100.0,110.0 118.0,86.0 140.0,128.0" fill="#8CA67B" stroke="#4E6B3A" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="62.0,82.0 70.0,70.0 78.0,82.0" fill="#FFFFFF" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="133.0" y1="64.0" x2="138.0" y2="64.0" stroke="#E67700" stroke-width="1.8" stroke-linecap="round"/>
<line x1="129.8" y1="71.8" x2="133.3" y2="75.3" stroke="#E67700" stroke-width="1.8" stroke-linecap="round"/>
<line x1="122.0" y1="75.0" x2="122.0" y2="80.0" stroke="#E67700" stroke-width="1.8" stroke-linecap="round"/>
<line x1="114.2" y1="71.8" x2="110.7" y2="75.3" stroke="#E67700" stroke-width="1.8" stroke-linecap="round"/>
<line x1="111.0" y1="64.0" x2="106.0" y2="64.0" stroke="#E67700" stroke-width="1.8" stroke-linecap="round"/>
<line x1="114.2" y1="56.2" x2="110.7" y2="52.7" stroke="#E67700" stroke-width="1.8" stroke-linecap="round"/>
<line x1="122.0" y1="53.0" x2="122.0" y2="48.0" stroke="#E67700" stroke-width="1.8" stroke-linecap="round"/>
<line x1="129.8" y1="56.2" x2="133.3" y2="52.7" stroke="#E67700" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="122.0" cy="64.0" r="8" fill="#FFD43B" stroke="#E67700" stroke-width="1.5"/>
<text x="168.0" y="72.0" font-size="18" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Du sommet, on a une belle </tspan><tspan fill="#D9480F" font-weight="700">vue</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="168.0" y="106.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">→ le </tspan><tspan fill="#1D4E89" font-weight="700">paysage</tspan><tspan fill="#1a1a18"> que l'on voit</tspan></text>
<rect x="24.0" y="154.0" width="120.0" height="88.0" rx="6" fill="#FFFFFF" stroke="#6B7686" stroke-width="1.2"/>
<text x="84.0" y="176.0" font-size="26" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">E</text>
<text x="84.0" y="200.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">F P</text>
<text x="84.0" y="224.0" font-size="12" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">T O Z</text>
<text x="168.0" y="182.0" font-size="18" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Mamie a une bonne </tspan><tspan fill="#D9480F" font-weight="700">vue</tspan><tspan fill="#1a1a18"> : elle lit tout.</tspan></text>
<text x="168.0" y="216.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">→ la </tspan><tspan fill="#1D4E89" font-weight="700">capacité de voir</tspan><tspan fill="#1a1a18">, avec ses yeux</tspan></text>
<rect x="24.0" y="264.0" width="120.0" height="88.0" rx="6" fill="#FFFFFF" stroke="#6B7686" stroke-width="1.2"/>
<circle cx="50.0" cy="330.0" r="11" fill="#F1EFE8" stroke="#6B7686" stroke-width="1.6"/>
<circle cx="118.0" cy="330.0" r="11" fill="#F1EFE8" stroke="#6B7686" stroke-width="1.6"/>
<rect x="30.0" y="274.0" width="42.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#1a1a18" stroke-width="1.6"/>
<polyline points="44.0,304.0 48.0,314.0 56.0,304.0" fill="#FFFFFF" stroke="#1a1a18" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="45.5" y1="304.0" x2="54.5" y2="304.0" stroke="#FFFFFF" stroke-width="3.0" stroke-linecap="butt"/>
<text x="51.0" y="289.0" font-size="13" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">oui</text>
<rect x="96.0" y="274.0" width="42.0" height="30.0" rx="8" fill="#FFFFFF" stroke="#1a1a18" stroke-width="1.6"/>
<polyline points="108.0,304.0 116.0,314.0 120.0,304.0" fill="#FFFFFF" stroke="#1a1a18" stroke-width="1.6" stroke-linejoin="round"/>
<line x1="109.5" y1="304.0" x2="118.5" y2="304.0" stroke="#FFFFFF" stroke-width="3.0" stroke-linecap="butt"/>
<text x="117.0" y="289.0" font-size="13" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">non</text>
<text x="168.0" y="292.0" font-size="18" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Chacun donne son point de </tspan><tspan fill="#D9480F" font-weight="700">vue</tspan><tspan fill="#1a1a18">.</tspan></text>
<text x="168.0" y="326.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">→ son </tspan><tspan fill="#1D4E89" font-weight="700">avis</tspan><tspan fill="#1a1a18">, ce qu'il pense</tspan></text>
<text x="340.0" y="360.0" font-size="13.5" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Pour choisir le bon sens, je regarde les mots autour : c'est le contexte.</text>
</svg>
