<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg"><title>Le texte de Hugo et Caramel, avec les réponses écrites et les réponses devinées</title>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Le bon lecteur se pose des questions… et vérifie dans le texte</text>
<rect x="16.0" y="42.0" width="648.0" height="142.0" rx="10" fill="#FFFDF6" stroke="#D9D4C3" stroke-width="1.2"/>
<line x1="34.0" y1="82.0" x2="152.9" y2="82.0" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round"/>
<line x1="158.7" y1="82.0" x2="200.9" y2="82.0" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round"/>
<line x1="203.1" y1="113.0" x2="351.1" y2="113.0" stroke="#185FA5" stroke-width="2.6" stroke-linecap="round"/>
<line x1="356.9" y1="113.0" x2="629.7" y2="113.0" stroke="#534AB7" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="346.8" y1="144.0" x2="632.6" y2="144.0" stroke="#534AB7" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="34.0" y1="175.0" x2="205.2" y2="175.0" stroke="#534AB7" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="211.0" y1="175.0" x2="536.1" y2="175.0" stroke="#534AB7" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="34.0" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Mercredi</text>
<text x="112.5" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">midi,</text>
<text x="158.7" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Hugo</text>
<text x="206.7" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">rentra</text>
<text x="263.5" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">de</text>
<text x="289.7" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">l'école</text>
<text x="349.3" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">en</text>
<text x="375.4" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">courant.</text>
<text x="450.1" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Il</text>
<text x="466.2" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">jeta</text>
<text x="503.0" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">son</text>
<text x="538.5" y="70.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">cartable</text>
<text x="34.0" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">dans</text>
<text x="79.6" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">l'entrée</text>
<text x="148.5" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">et</text>
<text x="171.3" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">fila</text>
<text x="203.1" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">au</text>
<text x="229.0" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">fond</text>
<text x="272.9" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">du</text>
<text x="299.8" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">jardin.</text>
<text x="356.9" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Le</text>
<text x="382.7" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">clapier</text>
<text x="444.8" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">était</text>
<text x="488.8" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">ouvert…</text>
<text x="562.7" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">et</text>
<text x="585.5" y="101.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">vide !</text>
<text x="34.0" y="132.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">« Caramel !</text>
<text x="133.4" y="132.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Caramel ! »</text>
<text x="232.9" y="132.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">appela</text>
<text x="294.3" y="132.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Hugo.</text>
<text x="346.8" y="132.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Derrière</text>
<text x="419.6" y="132.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">les</text>
<text x="449.4" y="132.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">salades,</text>
<text x="522.5" y="132.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">deux</text>
<text x="568.3" y="132.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">longues</text>
<text x="34.0" y="163.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">oreilles</text>
<text x="100.4" y="163.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">dépassaient.</text>
<text x="211.0" y="163.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Hugo</text>
<text x="259.0" y="163.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">sourit</text>
<text x="313.1" y="163.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">et</text>
<text x="335.8" y="163.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">poussa</text>
<text x="400.5" y="163.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">un</text>
<text x="427.3" y="163.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">grand</text>
<text x="479.9" y="163.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">soupir.</text>
<text x="30.0" y="208.0" font-size="14" fill="#5f5e5a" font-weight="700" text-anchor="start" dominant-baseline="central">Je me demande…</text>
<text x="230.0" y="208.0" font-size="14" fill="#5f5e5a" font-weight="700" text-anchor="start" dominant-baseline="central">Je réponds</text>
<text x="418.0" y="208.0" font-size="14" fill="#5f5e5a" font-weight="700" text-anchor="start" dominant-baseline="central">Je prouve</text>
<rect x="22.0" y="226.0" width="636.0" height="38.0" rx="7" fill="#E6F1FB" stroke="none" stroke-width="0"/>
<text x="32.0" y="245.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Qui ?</text>
<text x="230.0" y="245.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Hugo, et Caramel</text>
<text x="418.0" y="245.0" font-size="14.5" fill="#185FA5" font-weight="600" text-anchor="start" dominant-baseline="central">écrit : « Hugo rentra… »</text>
<rect x="22.0" y="268.0" width="636.0" height="38.0" rx="7" fill="#E6F1FB" stroke="none" stroke-width="0"/>
<text x="32.0" y="287.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Quand ?</text>
<text x="230.0" y="287.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">mercredi midi</text>
<text x="418.0" y="287.0" font-size="14.5" fill="#185FA5" font-weight="600" text-anchor="start" dominant-baseline="central">écrit : « Mercredi midi »</text>
<rect x="22.0" y="310.0" width="636.0" height="38.0" rx="7" fill="#E6F1FB" stroke="none" stroke-width="0"/>
<text x="32.0" y="329.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Où ?</text>
<text x="230.0" y="329.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">chez Hugo, au jardin</text>
<text x="418.0" y="329.0" font-size="14.5" fill="#185FA5" font-weight="600" text-anchor="start" dominant-baseline="central">écrit : « au fond du jardin »</text>
<rect x="22.0" y="352.0" width="636.0" height="38.0" rx="7" fill="#EEEDFE" stroke="none" stroke-width="0"/>
<text x="32.0" y="371.0" font-size="15" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">Que se passe-t-il ?</text>
<text x="230.0" y="371.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Caramel s'est échappé</text>
<text x="418.0" y="371.0" font-size="14.5" fill="#534AB7" font-weight="600" text-anchor="start" dominant-baseline="central">deviné : « ouvert… et vide ! »</text>
<rect x="22.0" y="394.0" width="636.0" height="38.0" rx="7" fill="#EEEDFE" stroke="none" stroke-width="0"/>
<text x="32.0" y="413.0" font-size="15" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">Pourquoi Hugo soupire ?</text>
<text x="230.0" y="413.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">il est soulagé</text>
<text x="418.0" y="413.0" font-size="14.5" fill="#534AB7" font-weight="600" text-anchor="start" dominant-baseline="central">deviné : Caramel est retrouvé</text>
</svg>
