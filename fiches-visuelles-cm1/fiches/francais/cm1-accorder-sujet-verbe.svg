<svg width="100%" viewBox="0 0 680 458" xmlns="http://www.w3.org/2000/svg"><title>La flèche va toujours du sujet (son nom noyau) vers le verbe</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="24.0" cy="20.0" r="12" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="24.0" y="20.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text x="44.0" y="20.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Le sujet est juste avant le verbe</text>
<text x="92.2" y="80.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">Les</tspan></text>
<rect x="134.8" y="60.0" width="124.8" height="40.0" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="197.2" y="80.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">oiseaux</tspan></text>
<rect x="267.6" y="60.0" width="133.9" height="40.0" rx="9" fill="#FBE3D3" stroke="#C2410C" stroke-width="2"/>
<text x="334.5" y="80.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">chant</tspan><tspan fill="#C2410C">ent</tspan></text>
<text x="516.0" y="80.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">dans le jardin.</tspan></text>
<path d="M207.2 58.0 C207.2 24.0 324.5 24.0 324.5 56.0" fill="none" stroke="#185FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="340.0" y="118.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">Qui est-ce qui chante ? </tspan><tspan fill="#185FA5">les oiseaux</tspan><tspan fill="#1a1a18"> = ils → </tspan><tspan fill="#C2410C">-ent</tspan></text>
<circle cx="24.0" cy="152.0" r="12" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="24.0" y="152.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<text x="44.0" y="152.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Des mots écrans entre le sujet et le verbe</text>
<text x="54.7" y="226.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">Les</tspan></text>
<rect x="97.4" y="206.0" width="117.3" height="40.0" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="156.0" y="226.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">enfants</tspan></text>
<rect x="224.7" y="207.0" width="197.5" height="38.0" rx="9" fill="#F1EFE8" stroke="#8a8980" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="323.4" y="226.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#8a8980">de ma classe</tspan></text>
<rect x="432.1" y="206.0" width="100.7" height="40.0" rx="9" fill="#FBE3D3" stroke="#C2410C" stroke-width="2"/>
<text x="482.5" y="226.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">jou</tspan><tspan fill="#C2410C">ent</tspan></text>
<text x="600.4" y="226.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">au foot.</tspan></text>
<path d="M156.0 204.0 C156.0 160.0 482.5 160.0 482.5 202.0" fill="none" stroke="#185FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="323.4" y="260.0" font-size="14" fill="#8a8980" font-weight="600" text-anchor="middle" dominant-baseline="central">on saute par-dessus</text>
<text x="340.0" y="284.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">Qui est-ce qui joue ? </tspan><tspan fill="#185FA5">les enfants</tspan><tspan fill="#1a1a18"> (pas « ma classe ») = ils → </tspan><tspan fill="#C2410C">-ent</tspan></text>
<circle cx="24.0" cy="324.0" r="12" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="24.0" y="324.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text x="44.0" y="324.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Le sujet est placé après le verbe</text>
<text x="189.8" y="398.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Dans la cour</tspan></text>
<rect x="292.2" y="378.0" width="100.7" height="40.0" rx="9" fill="#FBE3D3" stroke="#C2410C" stroke-width="2"/>
<text x="342.6" y="398.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">jou</tspan><tspan fill="#C2410C">ent</tspan></text>
<text x="430.1" y="398.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">les</tspan></text>
<rect x="467.3" y="378.0" width="117.3" height="40.0" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
<text x="526.0" y="398.0" font-size="25" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5">enfants</tspan></text>
<path d="M526.0 376.0 C526.0 336.0 342.6 336.0 342.6 374.0" fill="none" stroke="#185FA5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="340.0" y="440.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#5f5e5a">Qui est-ce qui joue ? </tspan><tspan fill="#185FA5">les enfants</tspan><tspan fill="#1a1a18"> = ils → </tspan><tspan fill="#C2410C">-ent</tspan></text>
</svg>
