<text x="20.0" y="384.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1D4E89" font-weight="700">Mots spécifiques</tspan><tspan fill="#1a1a18"> : ce qu'il y a dedans (pomme, poire, carotte…).</tspan></text>
<text x="20.0" y="414.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Une pomme </tspan><tspan fill="#1D4E89" font-weight="700">est un</tspan><tspan fill="#1a1a18"> fruit. Un fruit </tspan><tspan fill="#1D4E89" font-weight="700">est un</tspan><tspan fill="#1a1a18"> aliment. Mais un fruit</tspan></text>
<text x="20.0" y="436.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">n'est pas toujours une pomme !</tspan></text>
</svg>
