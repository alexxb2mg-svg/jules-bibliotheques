<text x="100.0" y="298.0" font-size="14" fill="#534AB7" font-weight="600" text-anchor="middle" dominant-baseline="central">« Le clapier était</text>
<text x="100.0" y="316.0" font-size="14" fill="#534AB7" font-weight="600" text-anchor="middle" dominant-baseline="central">ouvert… et vide ! »</text>
<text x="278.0" y="150.0" font-size="14" fill="#534AB7" font-weight="600" text-anchor="middle" dominant-baseline="central">« deux longues oreilles »</text>
<line x1="272.0" y1="160.0" x2="272.0" y2="168.0" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
<text x="262.0" y="298.0" font-size="14" fill="#534AB7" font-weight="600" text-anchor="middle" dominant-baseline="central">« Derrière les salades »</text>
<text x="360.0" y="70.0" font-size="16" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">Les indices</text>
<circle cx="368.0" cy="100.0" r="5" fill="#534AB7" stroke="none" stroke-width="1.5"/>
<text x="382.0" y="100.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">un clapier : la cabane des lapins</text>
<circle cx="368.0" cy="130.0" r="5" fill="#534AB7" stroke="none" stroke-width="1.5"/>
<text x="382.0" y="130.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">deux longues oreilles</text>
<circle cx="368.0" cy="160.0" r="5" fill="#534AB7" stroke="none" stroke-width="1.5"/>
<text x="382.0" y="160.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">caché derrière les salades</text>
<line x1="500.0" y1="180.0" x2="500.0" y2="212.0" stroke="#534AB7" stroke-width="2.5" stroke-linecap="round" marker-end="url(#fl)"/>
<rect x="360.0" y="222.0" width="296.0" height="62.0" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text x="508.0" y="243.0" font-size="15" fill="#534AB7" font-weight="700" text-anchor="middle" dominant-baseline="central">Je devine :</text>
<text x="508.0" y="266.0" font-size="19" fill="#534AB7" font-weight="700" text-anchor="middle" dominant-baseline="central">Caramel est un lapin.</text>
<text x="360.0" y="318.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">C'est une information implicite :</text>
<text x="360.0" y="338.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">pas écrite, mais prouvée par les indices.</text>
<text x="340.0" y="384.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Bleu : écrit dans le texte (explicite). Violet : deviné grâce aux indices (implicite).</text>
</svg>
