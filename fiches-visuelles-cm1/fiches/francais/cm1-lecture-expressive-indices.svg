<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg"><title>Les indices du texte qui guident ta voix : tiret, points de suspension, majuscules, gras</title>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Les indices du texte qui guident ta voix</text>
<rect x="16.0" y="44.0" width="648.0" height="196.0" rx="10" fill="#FFFDF6" stroke="#D9D4C3" stroke-width="1.2"/>
<text x="40.0" y="100.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">—</text>
<text x="68.5" y="100.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Chut</text>
<text x="117.6" y="100.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">…</text>
<text x="143.0" y="100.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Le bébé dort,</text>
<text x="288.5" y="100.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">chuchota</text>
<text x="391.4" y="100.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Papa.</text>
<rect x="37.0" y="85.0" width="27.3" height="30.0" rx="6" fill="none" stroke="#534AB7" stroke-width="2"/>
<circle cx="50.6" cy="69.0" r="11" fill="#534AB7" stroke="none" stroke-width="1.5"/>
<text x="50.6" y="69.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="114.6" y="85.0" width="24.3" height="30.0" rx="6" fill="none" stroke="#185FA5" stroke-width="2"/>
<circle cx="126.8" cy="69.0" r="11" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<text x="126.8" y="69.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="285.5" y="85.0" width="101.8" height="30.0" rx="6" fill="none" stroke="#185FA5" stroke-width="2"/>
<circle cx="336.4" cy="69.0" r="11" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<text x="336.4" y="69.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text x="40.0" y="160.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">— Papa ! Le chien est dans la</text>
<text x="353.6" y="160.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">CUISINE</text>
<text x="444.7" y="160.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">!</text>
<text x="457.6" y="160.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">cria Lou.</text>
<rect x="350.6" y="145.0" width="90.0" height="30.0" rx="6" fill="none" stroke="#C2410C" stroke-width="2"/>
<circle cx="395.6" cy="129.0" r="11" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="395.6" y="129.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="441.7" y="145.0" width="11.7" height="30.0" rx="6" fill="none" stroke="#C2410C" stroke-width="2"/>
<circle cx="447.6" cy="129.0" r="11" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="447.6" y="129.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
<text x="40.0" y="220.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">— Oh non… Il a mangé</text>
<text x="282.6" y="220.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">tout</text>
<text x="333.6" y="220.0" font-size="21" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">le gâteau ! soupira Papa.</text>
<rect x="279.6" y="205.0" width="49.9" height="30.0" rx="6" fill="none" stroke="#C2410C" stroke-width="2"/>
<circle cx="304.5" cy="189.0" r="11" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="304.5" y="189.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text>
<circle cx="42.0" cy="284.0" r="11" fill="#534AB7" stroke="none" stroke-width="1.5"/>
<text x="42.0" y="284.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text x="62.0" y="276.0" font-size="15" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">le tiret</text>
<text x="62.0" y="295.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">un autre personnage parle : je change de voix</text>
<circle cx="42.0" cy="338.0" r="11" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<text x="42.0" y="338.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<text x="62.0" y="330.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">les points de suspension</text>
<text x="62.0" y="349.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">je ralentis, je laisse la phrase en suspens</text>
<circle cx="42.0" cy="392.0" r="11" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<text x="42.0" y="392.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text x="62.0" y="384.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">le verbe « chuchota »</text>
<text x="62.0" y="403.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">il dit comment parler : tout bas</text>
<circle cx="402.0" cy="284.0" r="11" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="402.0" y="284.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text x="422.0" y="276.0" font-size="15" fill="#C2410C" font-weight="700" text-anchor="start" dominant-baseline="central">les MAJUSCULES</text>
<text x="422.0" y="295.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">je parle plus fort</text>
<circle cx="402.0" cy="338.0" r="11" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="402.0" y="338.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
<text x="422.0" y="330.0" font-size="15" fill="#C2410C" font-weight="700" text-anchor="start" dominant-baseline="central">le point d'exclamation</text>
<text x="422.0" y="349.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">la voix s'anime</text>
<circle cx="402.0" cy="392.0" r="11" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<text x="402.0" y="392.0" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text>
<text x="422.0" y="384.0" font-size="15" fill="#C2410C" font-weight="700" text-anchor="start" dominant-baseline="central">le mot en gras</text>
<text x="422.0" y="403.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">j'appuie sur ce mot</text>
<text x="340.0" y="428.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Violet : je change de voix. Bleu : plus doux, plus lent. Orange : plus fort, plus animé.</text>
</svg>
