<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Recopier la leçon ou la reformuler : le cycle de l'eau</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="16.0" y="10.0" width="648.0" height="136.0" rx="8" fill="#F1EFE8" stroke="#6B7686" stroke-width="1.2"/>
<text x="32.0" y="30.0" font-size="16" fill="#6B7686" font-weight="700" text-anchor="start" dominant-baseline="central">La leçon du manuel</text>
<text x="32.0" y="54.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Sous l'effet de la chaleur du soleil, l'eau des mers, des lacs et des rivières</text>
<text x="32.0" y="73.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">s'évapore : elle devient de la vapeur d'eau invisible qui monte dans l'air. En</text>
<text x="32.0" y="92.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">altitude, la vapeur se refroidit et forme de minuscules gouttelettes : les nuages.</text>
<text x="32.0" y="111.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Les gouttelettes grossissent et retombent en pluie ou en neige ; l'eau rejoint</text>
<text x="32.0" y="130.0" font-size="14.5" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">ensuite les rivières, puis la mer.</text>
<line x1="27.0" y1="165.0" x2="41.0" y2="179.0" stroke="#C92A2A" stroke-width="3.0" stroke-linecap="round"/>
<line x1="27.0" y1="179.0" x2="41.0" y2="165.0" stroke="#C92A2A" stroke-width="3.0" stroke-linecap="round"/>
<text x="52.0" y="172.0" font-size="17" fill="#C92A2A" font-weight="700" text-anchor="start" dominant-baseline="central">Je recopie tout</text>
<rect x="16.0" y="190.0" width="310.0" height="196.0" rx="4" fill="#FFFDF6" stroke="#b9b6aa" stroke-width="1.2"/>
<line x1="17.0" y1="214.0" x2="325.0" y2="214.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="238.0" x2="325.0" y2="238.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="262.0" x2="325.0" y2="262.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="286.0" x2="325.0" y2="286.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="310.0" x2="325.0" y2="310.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="334.0" x2="325.0" y2="334.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="17.0" y1="358.0" x2="325.0" y2="358.0" stroke="#C9D6E8" stroke-width="1" stroke-linecap="butt"/>
<line x1="46.0" y1="191.0" x2="46.0" y2="385.0" stroke="#E8A0A0" stroke-width="1.3" stroke-linecap="butt"/>
<text x="54.0" y="207.0" font-size="14" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">Sous l'effet de la chaleur du soleil,</text>
<text x="54.0" y="231.0" font-size="14" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">l'eau des mers, des lacs et des</text>
<text x="54.0" y="255.0" font-size="14" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">rivières s'évapore : elle devient de</text>
<text x="54.0" y="279.0" font-size="14" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">la vapeur d'eau invisible qui monte</text>
<text x="54.0" y="303.0" font-size="14" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">dans l'air. En altitude, la vapeur se</text>
<text x="54.0" y="327.0" font-size="14" fill="#3a3a38" font-weight="500" text-anchor="start" dominant-baseline="central" font-style="italic">refroidit et forme de minuscules...</text>
<text x="171.0" y="406.0" font-size="15" fill="#C92A2A" font-weight="600" text-anchor="middle" dominant-baseline="central">Long, fatigant, et rien n'est trié :</text>
<text x="171.0" y="426.0" font-size="15" fill="#C92A2A" font-weight="600" text-anchor="middle" dominant-baseline="central">ai-je compris ? Je ne le sais pas.</text>
<path d="M362.0 172.0 L368.0 178.0 L379.0 165.0" fill="none" stroke="#2B8A3E" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="388.0" y="172.0" font-size="17" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">Je note et je reformule</text>
