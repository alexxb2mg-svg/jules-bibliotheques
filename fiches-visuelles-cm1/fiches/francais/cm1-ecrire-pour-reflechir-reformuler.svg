<text x="590.0" y="338.0" font-size="14" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">rivière</text>
<path d="M430.0 316.0 Q465.0 277.0 520.0 238.0" fill="none" stroke="#D9480F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="452.0" y="262.0" font-size="14" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central" font-style="italic">s'évapore</text>
<path d="M610.0 272.0 L616.0 284.0" fill="none" stroke="#1D4E89" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<text x="640.0" y="262.0" font-size="14" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central" font-style="italic">pluie</text>
<text x="509.0" y="406.0" font-size="15" fill="#2B8A3E" font-weight="600" text-anchor="middle" dominant-baseline="central">L'eau s'évapore, forme des nuages,</text>
<text x="509.0" y="426.0" font-size="15" fill="#2B8A3E" font-weight="600" text-anchor="middle" dominant-baseline="central">retombe en pluie, puis rejoint les rivières.</text>
<line x1="340.0" y1="160.0" x2="340.0" y2="440.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="340.0" y="456.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">À droite : un petit dessin, quelques mots-clés, et une phrase à moi que je peux redire.</text>
</svg>
