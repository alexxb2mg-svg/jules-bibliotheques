<rect x="14.0" y="52.0" width="652.0" height="36.0" rx="6" fill="#F6F5F0" stroke="none" stroke-width="1.5"/>
<text x="98.0" y="70.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">je </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#2F6B12">e</tspan></text>
<text x="258.0" y="70.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">je </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#C2410C">ai</tspan><tspan fill="#2F6B12">s</tspan></text>
<text x="418.0" y="70.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">je </tspan><tspan fill="#185FA5">joue</tspan><tspan fill="#C2410C">r</tspan><tspan fill="#2F6B12">ai</tspan></text>
<text x="578.0" y="70.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">j'</tspan><tspan fill="#6D28D9">ai</tspan><tspan fill="#1a1a18"> joué</tspan></text>
<text x="98.0" y="110.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">tu </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#2F6B12">es</tspan></text>
<text x="258.0" y="110.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">tu </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#C2410C">ai</tspan><tspan fill="#2F6B12">s</tspan></text>
<text x="418.0" y="110.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">tu </tspan><tspan fill="#185FA5">joue</tspan><tspan fill="#C2410C">r</tspan><tspan fill="#2F6B12">as</tspan></text>
<text x="578.0" y="110.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">tu </tspan><tspan fill="#6D28D9">as</tspan><tspan fill="#1a1a18"> joué</tspan></text>
<rect x="14.0" y="132.0" width="652.0" height="36.0" rx="6" fill="#F6F5F0" stroke="none" stroke-width="1.5"/>
<text x="98.0" y="150.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">il </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#2F6B12">e</tspan></text>
<text x="258.0" y="150.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">il </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#C2410C">ai</tspan><tspan fill="#2F6B12">t</tspan></text>
<text x="418.0" y="150.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">il </tspan><tspan fill="#185FA5">joue</tspan><tspan fill="#C2410C">r</tspan><tspan fill="#2F6B12">a</tspan></text>
<text x="578.0" y="150.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">il </tspan><tspan fill="#6D28D9">a</tspan><tspan fill="#1a1a18"> joué</tspan></text>
<text x="98.0" y="190.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">nous </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#2F6B12">ons</tspan></text>
<text x="258.0" y="190.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">nous </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#C2410C">i</tspan><tspan fill="#2F6B12">ons</tspan></text>
<text x="418.0" y="190.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">nous </tspan><tspan fill="#185FA5">joue</tspan><tspan fill="#C2410C">r</tspan><tspan fill="#2F6B12">ons</tspan></text>
<text x="578.0" y="190.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">nous </tspan><tspan fill="#6D28D9">avons</tspan><tspan fill="#1a1a18"> joué</tspan></text>
<rect x="14.0" y="212.0" width="652.0" height="36.0" rx="6" fill="#F6F5F0" stroke="none" stroke-width="1.5"/>
<text x="98.0" y="230.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">vous </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#2F6B12">ez</tspan></text>
<text x="258.0" y="230.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">vous </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#C2410C">i</tspan><tspan fill="#2F6B12">ez</tspan></text>
<text x="418.0" y="230.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">vous </tspan><tspan fill="#185FA5">joue</tspan><tspan fill="#C2410C">r</tspan><tspan fill="#2F6B12">ez</tspan></text>
<text x="578.0" y="230.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">vous </tspan><tspan fill="#6D28D9">avez</tspan><tspan fill="#1a1a18"> joué</tspan></text>
<text x="98.0" y="270.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">ils </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#2F6B12">ent</tspan></text>
<text x="258.0" y="270.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">ils </tspan><tspan fill="#185FA5">jou</tspan><tspan fill="#C2410C">ai</tspan><tspan fill="#2F6B12">ent</tspan></text>
<text x="418.0" y="270.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">ils </tspan><tspan fill="#185FA5">joue</tspan><tspan fill="#C2410C">r</tspan><tspan fill="#2F6B12">ont</tspan></text>
<text x="578.0" y="270.0" font-size="20" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">ils </tspan><tspan fill="#6D28D9">ont</tspan><tspan fill="#1a1a18"> joué</tspan></text>
<text x="340.0" y="316.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">« elle » et « on » se conjuguent comme « il », « elles » comme « ils ».</text>
<text x="340.0" y="342.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Au futur, on garde l'infinitif entier : </tspan><tspan fill="#185FA5">joue</tspan><tspan fill="#C2410C">r</tspan><tspan fill="#1a1a18"> + </tspan><tspan fill="#2F6B12">ai</tspan><tspan fill="#1a1a18">. Le </tspan><tspan fill="#C2410C">r</tspan><tspan fill="#1a1a18"> est la marque du futur.</tspan></text>
</svg>
