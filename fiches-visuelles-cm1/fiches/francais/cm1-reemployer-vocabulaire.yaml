      - {id: juste, titre: "Choisir le mot juste", sous_titre: "raconter une histoire dit mieux que dire une histoire"}
      - {id: sens, titre: "Vérifier le sens", sous_titre: "feuille, souris : un mot polysémique a plusieurs sens"}
