    jules: "Un mot, c'est comme un outil : le connaître ne suffit pas, il faut s'en servir. Un mot que tu as employé trois fois dans tes phrases, tu le gardes pour longtemps."

  - id: schema-polysemie
    type: schema
    titre: "Feuille et souris : deux mots polysémiques, deux sens chacun"
    svg: "cm1-reemployer-vocabulaire.svg"
    jules: "Un mot **polysémique** a plusieurs sens : poly veut dire « plusieurs ». Pour choisir le bon sens, regarde les autres mots de la phrase : un platane, c'est un arbre, alors la feuille est une feuille d'arbre."

  - id: schema-redaction
    type: schema
    titre: "Dans une rédaction, remplacer « dit » par des mots appris plus précis"
    svg: "cm1-reemployer-vocabulaire-redaction.svg"
    jules: "Garde une liste de mots appris au dos de ton cahier : quand tu relis ta rédaction, pioches-y. Chaque mot coché, c'est un mot qui devient vraiment le tien."

  - id: methode
    type: methode
    etapes:
      - "Avant d'écrire, relis la liste des mots appris sur le sujet (en sciences, en histoire, en lecture)."
      - "Choisis le mot qui dit exactement ce que tu veux dire. S'il a plusieurs sens, vérifie que c'est le **bon sens** pour ta phrase."
      - "Emploie-le dans une **phrase entière**, à l'oral ou à l'écrit."
      - "Relis-toi : un mot répété trop souvent ? Remplace-le par un **synonyme** de ta liste."
    jules: "Un **synonyme** est un mot de sens très proche : raconter, dire. Un antonyme dit le contraire : grand, petit. Les deux t'aident à varier tes phrases."

  - id: piege
    type: piege
    mauvaise_idee: "Dans la liste, grand a pour synonyme haut. Alors « mon grand frère a 12 ans » devient « mon haut frère a 12 ans »."
    pourquoi_faux: "Grand a plusieurs sens. Ici, mon grand frère veut dire mon frère plus âgé, pas mon frère de grande taille. Le synonyme haut ne convient qu'à la **taille**."
    bonne_idee: "Vérifie le sens dans la phrase avant de remplacer : mon grand frère, c'est mon frère **aîné**. Une grande tour, elle, peut devenir une haute tour."
    jules: "Un synonyme ne marche jamais partout : il faut toujours relire la phrase entière pour voir s'il a le même sens que le mot remplacé."

  - id: exemple-operation
    type: exemple
    situation: "En maths, Chloé pose une opération. Le soir, elle raconte que son grand-père a eu une opération du genou. Le mot opération a-t-il le même sens ?"
    calcul: "En maths, une opération, c'est un calcul : une addition, une soustraction, une multiplication. À l'hôpital, c'est le travail du chirurgien qui soigne le genou."
    conclusion: "Même mot, deux sens : opération est un mot **polysémique**. Chaque matière lui donne son sens."
    jules: "Beaucoup de mots de maths ont un autre sens ailleurs : une droite, un produit, une base. En classe de maths, pense toujours au sens de la leçon de maths."

  - id: exemple-chateau
    type: exemple
    situation: "Après la leçon d'histoire sur le château fort, Nour écrit : « Le château a de hauts murs et un fossé plein d'eau autour. » Elle a appris les mots remparts et douves. Comment les réemployer ?"
    calcul: "Les hauts murs qui protègent le château sont les remparts. Le fossé rempli d'eau qui l'entoure, ce sont les douves."
    conclusion: "« Le château a de hauts **remparts** entourés de **douves**. » La phrase est plus courte et plus précise."
    jules: "Réemployer un mot d'une leçon dans ta rédaction prouve que tu l'as compris, pas seulement appris pour le contrôle."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi de la semaine : choisis trois mots nouveaux et place-les dans tes conversations à la maison. Au bout de sept jours, ils seront à toi."
