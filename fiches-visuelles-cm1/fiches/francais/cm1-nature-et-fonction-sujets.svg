<svg width="100%" viewBox="0 0 680 345" xmlns="http://www.w3.org/2000/svg"><title>Un groupe nominal, un nom propre et un pronom peuvent tous être sujets</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Trois natures différentes, une seule fonction : sujet</text>
<rect x="135.7" y="61.0" width="122.3" height="38.0" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.8"/>
<text x="250.0" y="80.0" font-size="24" fill="#1D4E89" font-weight="700" text-anchor="end" dominant-baseline="central">Ma sœur</text>
<text x="268.0" y="80.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">range sa chambre.</text>
<text x="196.9" y="112.0" font-size="14" fill="#6B7686" font-weight="700" text-anchor="middle" dominant-baseline="central">groupe nominal (déterminant + nom)</text>
<rect x="191.3" y="141.0" width="66.7" height="38.0" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.8"/>
<text x="250.0" y="160.0" font-size="24" fill="#1D4E89" font-weight="700" text-anchor="end" dominant-baseline="central">Inès</text>
<text x="268.0" y="160.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">range sa chambre.</text>
<text x="224.7" y="192.0" font-size="14" fill="#6B7686" font-weight="700" text-anchor="middle" dominant-baseline="central">nom propre</text>
<rect x="195.9" y="221.0" width="62.1" height="38.0" rx="8" fill="#E3EEF9" stroke="#1D4E89" stroke-width="1.8"/>
<text x="250.0" y="240.0" font-size="24" fill="#1D4E89" font-weight="700" text-anchor="end" dominant-baseline="central">Elle</text>
<text x="268.0" y="240.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">range sa chambre.</text>
<text x="227.0" y="272.0" font-size="14" fill="#6B7686" font-weight="700" text-anchor="middle" dominant-baseline="central">pronom personnel</text>
<path d="M60.0 58.0 Q48.0 58.0 48.0 80.0 L48.0 150.0 Q48.0 160.0 36.0 160.0 Q48.0 160.0 48.0 170.0 L48.0 240.0 Q48.0 262.0 60.0 262.0" fill="none" stroke="#1D4E89" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="26" y="160.0" font-size="16" fill="#1D4E89" font-weight="800" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 26 160.0)">sujet</text>
<line x1="268.0" y1="96.0" x2="336.4" y2="96.0" stroke="#C92A2A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="268.0" y1="176.0" x2="336.4" y2="176.0" stroke="#C92A2A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="268.0" y1="256.0" x2="336.4" y2="256.0" stroke="#C92A2A" stroke-width="2.5" stroke-linecap="round"/>
<text x="340.0" y="300.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Le verbe </tspan><tspan fill="#C92A2A" font-weight="800">range</tspan><tspan fill="#1a1a18"> est le même : on lui demande « qui est-ce qui range ? »</tspan></text>
<text x="340.0" y="328.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Gris = la nature. Bleu = la fonction sujet. Rouge = le verbe, le pivot de la phrase.</text>
</svg>
