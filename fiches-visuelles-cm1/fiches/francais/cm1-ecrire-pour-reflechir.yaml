notion: cm1-ecrire-pour-reflechir
titre: "Écrire pour réfléchir : surligner, noter en mots-clés, redire avec mes mots"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 8", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1-francaispdf-111546.pdf", licence: etalab-2.0}
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 9", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: avis
    type: formule
    expression: "[Je pense que] + avis + [parce que] + raison"
    termes:
      "Je pense que": {couleur: bleu, legende: "j'annonce **mon avis**. On peut aussi écrire « J'ai aimé… » ou « Je n'ai pas aimé… »."}
      "parce que": {couleur: orange, legende: "j'explique **pourquoi** : un avis sans raison ne dit rien à celui qui te lit"}
    jules: "C'est la phrase la plus utile de ton cahier de brouillon ! Elle marche pour un livre, un film, une expérience de sciences ou un débat."

  - id: carte
    type: carte
    noeuds:
      - {id: ecrire, titre: "Écrire pour réfléchir", sous_titre: "le crayon aide à trier, comprendre et retenir", principal: true}
      - {id: trier, titre: "Trier", sous_titre: "je surligne 2 ou 3 infos importantes, pas tout"}
      - {id: noter, titre: "Noter en mots-clés", sous_titre: "une liste, des flèches, une carte mentale"}
      - {id: redire, titre: "Reformuler", sous_titre: "l'essentiel de la leçon, avec mes propres mots"}
      - {id: avis, titre: "Donner mon avis", sous_titre: "« J'ai aimé… parce que… »"}
    liens:
      - {de: ecrire, vers: trier}
      - {de: ecrire, vers: noter}
      - {de: ecrire, vers: redire}
      - {de: ecrire, vers: avis}
    jules: "Ces écrits-là ne sont pas notés et personne ne les recopie au propre. Ils servent à ta tête : une rature ou une flèche y sont permises."

  - id: schema-herisson
    type: schema
    titre: "Du texte surligné à la carte mentale du brouillon : le hérisson"
    svg: "cm1-ecrire-pour-reflechir.svg"
    jules: "Un **mot-clé**, c'est un mot qui porte une idée à lui tout seul : « piquants », « la nuit », « hiberne ». Les petits mots comme « il », « des » ou « et » ne se surlignent jamais."

  - id: schema-reformuler
    type: schema
    titre: "Recopier la leçon ou la reformuler : le cycle de l'eau"
    svg: "cm1-ecrire-pour-reflechir-reformuler.svg"
    jules: "Reformuler, c'est redire la même idée avec d'autres mots, les tiens. Si tu arrives à l'expliquer sans regarder le manuel, c'est que tu l'as comprise."

  - id: methode
    type: methode
    etapes:
      - "Je lis le texte ou la leçon **en entier** une première fois, sans rien écrire."
      - "Je relis et je **surligne** seulement les mots qui portent les idées importantes."
      - "Je range ces mots au brouillon : une liste avec des tirets, ou une **carte mentale** avec le sujet au milieu."
      - "Je ferme le livre et j'écris l'essentiel en une ou deux phrases, avec mes mots."
      - "Je compare ma phrase avec celle d'un camarade ou du professeur, et je la complète si besoin."
    jules: "Fermer le livre à l'étape 4, c'est le secret : ta phrase vient alors de ta tête, pas du manuel. C'est comme ça qu'on retient."

  - id: piege
    type: piege
    mauvaise_idee: "Pour résumer la leçon sur le cycle de l'eau, je recopie tout le texte : comme ça, je n'oublie rien."
    pourquoi_faux: "Recopier, ce n'est pas **trier**. La main travaille, mais la tête ne choisit rien. À la fin, l'essentiel est noyé au milieu des détails."
    bonne_idee: "Je garde 3 ou 4 mots-clés (s'évapore, nuages, pluie, rivières) et j'écris une phrase à moi : « L'eau s'évapore, forme des nuages, retombe en pluie, puis rejoint les rivières. »"
    jules: "Autre piège : surligner presque toute la page. Si tout est jaune, plus rien ne ressort ! Deux ou trois mots par phrase, c'est déjà beaucoup."

  - id: exemple-avis
    type: exemple
    situation: "Inès a lu l'histoire d'un chat perdu qui retrouve sa maison. La maîtresse demande : « Qu'as-tu pensé de ce livre ? » Inès écrit d'abord : « J'ai aimé ce livre. »"
    calcul: "Il manque la raison. Inès ajoute « parce que » et cherche ce qui lui a plu : « J'ai aimé ce livre parce que le chat trouve des idées rusées pour rentrer, et j'avais peur qu'il reste perdu. »"
    conclusion: "Son avis est maintenant **justifié** : on sait ce qu'elle a aimé et pourquoi."
    jules: "Pour trouver ta raison, pense à un moment précis de l'histoire : un passage drôle, une peur, une surprise. Une raison précise vaut mieux que « parce que c'était bien »."

  - id: exemple-lexique
    type: exemple
    situation: "En sciences, Sami a appris deux mots nouveaux : « nocturne » (qui vit la nuit) et « hiberner » (dormir tout l'hiver). Pour les retenir, il écrit une phrase avec chacun."
    calcul: "« La chouette est un oiseau nocturne : elle chasse la nuit. » « La marmotte hiberne dans son terrier jusqu'au printemps. »"
    conclusion: "En écrivant ses propres phrases, Sami **emploie** les mots : il les retiendra bien mieux qu'en lisant seulement leur définition."
    jules: "Choisis un exemple que tu connais bien, un animal ou un moment de ta vie. Le mot nouveau s'accroche alors à un souvenir."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : après ta prochaine leçon d'histoire ou de sciences, fais une carte mentale de 4 branches, puis explique-la à quelqu'un à la maison sans regarder ton cahier."
