    jules: "Pour retenir les six conjonctions, pense à « Mais où est Ornicar ? » : on y entend mais, ou, et, or, ni, car. Attention, donc n'en fait pas partie : c'est un adverbe."

  - id: schema-determinants
    type: schema
    titre: "Le, un, mon, ce : quatre déterminants devant le même nom"
    svg: "cm1-identifier-mots-selon-nature.svg"
    jules: "Le déterminant annonce le nom et montre souvent son genre et son nombre : la trousse, les trousses. Si tu peux le remplacer par un, mon ou ce, c'est bien un déterminant."

  - id: schema-relier
    type: schema
    titre: "La conjonction de coordination relie, l'adverbe précise le verbe et reste invariable"
    svg: "cm1-identifier-mots-selon-nature-relier.svg"
    jules: "Beaucoup d'adverbes finissent par -ment : doucement, lentement, gentiment. Invariable veut dire qu'on ne lui ajoute jamais de e ni de s, même si le sujet est au pluriel."

  - id: schema-pronoms
    type: schema
    titre: "Lucas devient il, la pomme devient la : pronom sujet et pronom complément"
    svg: "cm1-identifier-mots-selon-nature-pronoms.svg"
    jules: "Le pronom évite de répéter : « Lucas mange la pomme. Lucas trouve la pomme bonne » devient « Il la trouve bonne ». Ton texte respire mieux."

  - id: methode
    type: methode
    etapes:
      - "Le mot est juste devant un nom ? Essaie le, un, mon ou ce à sa place : si ça marche, c'est un **déterminant**."
      - "Le mot relie deux mots, deux groupes ou deux phrases ? S'il est dans la liste mais, ou, et, or, ni, car, c'est une **conjonction de coordination**."
      - "Mets le sujet au pluriel. Le mot ne change pas et il dit comment, quand ou où se passe l'action ? C'est un **adverbe**."
      - "Le mot remplace un groupe nominal ? C'est un **pronom personnel** : sujet s'il fait l'action (il, elle), complément s'il est placé juste devant le verbe (le, la, lui)."
    jules: "Le même mot peut changer de nature selon sa place : la devant un nom est un déterminant, la devant un verbe est un pronom. Regarde toujours le mot qui suit."

  - id: piege
    type: piege
    mauvaise_idee: "Dans « Mon chien aboie. », mon est un pronom personnel, parce qu'il parle de moi."
    pourquoi_faux: "Mon ne remplace pas le nom : il est devant le nom chien et l'accompagne. C'est un **déterminant possessif**. Un pronom, lui, prend la place du nom."
    bonne_idee: "Mon chien aboie : mon est un **déterminant possessif**. Il aboie : il est un **pronom personnel** sujet, qui remplace mon chien."
    jules: "Mon, ton, son vont toujours avec un nom : mon vélo, ta trousse. Je, tu, il, elle se tiennent tout seuls devant le verbe."

  - id: exemple-sac
    type: exemple
    situation: "Ce matin, ma sœur marche doucement, car elle porte un gros sac. Trouve les déterminants, la conjonction de coordination, l'adverbe et le pronom personnel."
    calcul: "Devant un nom : ce (matin), ma (sœur), un (sac). Le mot qui relie : car. Le mot qui dit comment elle marche : doucement. Le mot qui remplace ma sœur : elle."
    conclusion: "Déterminants : ce (démonstratif), ma (possessif), un (article indéfini). Conjonction : **car**. Adverbe : **doucement**. Pronom personnel sujet : **elle**."
    jules: "Vérifie l'adverbe en passant au pluriel : « mes sœurs marchent doucement ». Doucement ne bouge pas : c'est bien un adverbe."

  - id: exemple-voiture
    type: exemple
    situation: "Remplace chaque groupe nominal par un pronom personnel : « Papa lave la voiture. » puis « Les enfants regardent le dessin animé. »"
    calcul: "Papa, sujet, devient il. La voiture, complément, devient la, et passe devant le verbe. Les enfants deviennent ils ; le dessin animé devient le, devant le verbe."
    conclusion: "On obtient « Il la lave. » et « Ils le regardent. » : les **pronoms compléments** la et le se placent devant le verbe."
    jules: "Choisis le pronom qui a le même genre et le même nombre que le groupe remplacé : la voiture (féminin) donne la, le dessin animé (masculin) donne le."

  - id: renfort
    type: renfort
    liens:
