notion: cm1-se-decouvrir-saffirmer
titre: "Se découvrir, s'affirmer : le personnage qui grandit, et moi qui raconte"
matiere: francais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de français pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 7", url: "https://www.education.gouv.fr/sites/default/files/programme-de-fran-ais-pour-le-cycle-3-439824.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: changement
    type: formule
    expression: "[au début] + [une rencontre, une épreuve] → [à la fin]"
    termes:
      "au début": {couleur: gris, legende: "comment est le personnage : Pinocchio, pantin de bois, désobéit et **ment**."}
      "une rencontre, une épreuve": {couleur: orange, legende: "ce qui le fait changer : la Fée, le Chat et le Renard qui le trompent, son père perdu dans le ventre d'un **requin**."}
      "à la fin": {couleur: vert, legende: "ce qu'il est devenu : courageux et généreux, il s'occupe de son père. Il devient un **vrai petit garçon**."}
    jules: "Pour voir qu'un personnage grandit, il faut toujours deux photos : une au début et une à la fin. Et entre les deux, l'événement qui explique le changement."

  - id: carte
    type: carte
    noeuds:
      - {id: grandir, titre: "Se découvrir, s'affirmer", sous_titre: "apprendre qui on est, et oser le montrer", principal: true}
      - {id: change, titre: "Un personnage qui change", sous_titre: "timide, menteur, peureux… puis différent"}
      - {id: rencontre, titre: "Grâce aux autres", sous_titre: "une rencontre, un ami, une épreuve"}
      - {id: emotions, titre: "Des émotions nommées", sous_titre: "peur, honte, colère, fierté, joie"}
      - {id: recit, titre: "Le récit de soi", sous_titre: "je raconte un moment où j'ai changé"}
    liens:
      - {de: grandir, vers: change}
      - {de: grandir, vers: rencontre}
      - {de: grandir, vers: emotions}
      - {de: grandir, vers: recit}
    jules: "S'affirmer, ce n'est pas crier plus fort que les autres. C'est oser dire ce qu'on pense ou faire ce qu'on croit juste, même quand c'est difficile."

  - id: schema-pinocchio
    type: schema
    titre: "Un personnage qui grandit : Pinocchio au début, pendant et à la fin"
    svg: "cm1-se-decouvrir-saffirmer.svg"
    jules: "Son nez qui s'allonge quand il ment, c'est son corps qui montre la vérité. À la fin, il n'a plus besoin de mentir : il a appris à être honnête."

  - id: schema-emotions
    type: schema
    titre: "Nommer ses émotions : le visage, le corps, et les mots pour le dire"
    svg: "cm1-se-decouvrir-saffirmer-emotions.svg"
    jules: "Plus tu connais de mots pour tes émotions, mieux tu les comprends. Au lieu de « ça ne va pas », tu peux dire « j'ai honte » ou « je suis déçu » : c'est plus précis."

  - id: methode
    type: methode
    etapes:
      - "Repère un personnage qui **change** au cours de l'histoire."
      - "Décris-le au début, puis à la fin, avec un mot pour chaque moment : timide, puis confiant ; menteur, puis honnête."
      - "Trouve l'**événement précis** ou la rencontre qui a provoqué ce changement."
      - "Relie-le à ta vie : as-tu déjà changé comme lui ? Raconte ce moment au « je », en nommant tes **émotions**."
    jules: "Dans un récit de soi, suis le même chemin que pour le personnage : comment j'étais, ce qui s'est passé, comment je suis devenu."

  - id: piege
    type: piege
    mauvaise_idee: "« Pinocchio est un pantin menteur. » Et c'est tout."
    pourquoi_faux: "Cette phrase ne parle que du début. Elle oublie ce qui lui arrive et ce qu'il devient : on ne voit pas son **évolution**."
    bonne_idee: "« Au début, Pinocchio ment et désobéit. Après avoir sauvé son père du requin, il travaille pour le soigner. À la fin, il est devenu **honnête** et courageux. »"
    jules: "Autre oubli : dire qu'il a changé sans dire pourquoi. Cite toujours un moment précis de l'histoire."

  - id: exemple-alice
    type: exemple
    situation: "Dans Alice au pays des merveilles, de Lewis Carroll, Alice grandit et rapetisse sans arrêt. Quand la Chenille lui demande « Qui es-tu ? », elle ne sait plus quoi répondre. À la fin, au procès, elle ose dire à la Reine de cœur : « Vous n'êtes qu'un jeu de cartes ! » Comment s'est-elle affirmée ?"
    calcul: "Au début : Alice est perdue, elle ne sait plus qui elle est. Pendant : des rencontres étranges et des personnages qui la commandent. À la fin : elle n'a plus peur de la Reine et dit ce qu'elle pense."
    conclusion: "Alice s'est **affirmée** : elle passe de « je ne sais plus qui je suis » à « je dis ce que je pense », même devant une reine."
    jules: "Carroll joue avec la taille d'Alice : on peut y voir une image de ce qu'on ressent quand on grandit. Au procès, elle se met à grandir à nouveau, et son courage grandit avec elle."

  - id: exemple-plongeoir
    type: exemple
    situation: "Récit de soi de Sofiane : « En septembre, je n'osais pas monter sur le plongeoir. J'avais le ventre noué. Puis Lucas m'a dit : on saute ensemble ? En juin, j'ai sauté seul. J'étais fier. » Qu'est-ce qui en fait un bon récit de soi ?"
    calcul: "Il écrit au « je ». Le début (il n'ose pas), l'événement (Lucas l'encourage) et la fin (il saute seul) sont clairs. Il nomme ses émotions : la **peur** (le ventre noué), puis la **fierté**."
    conclusion: "C'est un récit de soi réussi : Sofiane raconte comment il a changé, grâce à une rencontre, en disant ce qu'il ressentait."
    jules: "Remarque « le ventre noué » : au lieu d'écrire seulement « j'avais peur », Sofiane dit ce que son corps ressentait. Le lecteur sent la peur avec lui."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : raconte en cinq phrases un moment où tu as osé faire quelque chose pour la première fois. Nomme au moins deux émotions."
