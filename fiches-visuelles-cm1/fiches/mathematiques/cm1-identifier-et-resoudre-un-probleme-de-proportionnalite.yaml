    liens:
      - {de: propor, vers: plus}
      - {de: propor, vers: moins}
      - {de: propor, vers: phrase}
      - {de: propor, vers: pas}
    jules: "Une grandeur, c'est ce qui se mesure ou se compte : un prix, une masse, une longueur, un nombre de personnes. La proportionnalité relie toujours deux grandeurs de sortes différentes, comme des personnes et des grammes de farine."

  - id: schema-recette
    type: schema
    titre: "La recette de crêpes pour 4 personnes, puis pour 8 et pour 2 personnes"
    svg: "cm1-identifier-et-resoudre-un-probleme-de-proportionnalite.svg"
    jules: "Regarde les œufs : on les voit doubler d'une carte à l'autre, comme les personnes. Tous les ingrédients suivent la même règle, sinon les crêpes seraient ratées."

  - id: schema-ou-pas
    type: schema
    titre: "Proportionnel ou pas : la masse des manuels, la taille d'un enfant"
    svg: "cm1-identifier-et-resoudre-un-probleme-de-proportionnalite-ou-pas.svg"
    jules: "Les tailles du dessin sont des tailles moyennes, environ 110 cm à 5 ans et 140 cm à 10 ans. Pour savoir si c'est proportionnel, demande-toi : « 2 fois plus de l'un donne-t-il toujours 2 fois plus de l'autre ? »"

  - id: methode
    type: methode
    etapes:
      - "Vérifie que c'est bien une situation de **proportionnalité** : 2 fois plus de l'un donne 2 fois plus de l'autre."
      - "Compare les deux nombres de la même sorte : combien de **fois plus**, ou de **fois moins** ? Par exemple, 8 personnes, c'est 2 fois 4 personnes."
      - "Fais la même chose à l'autre grandeur : 2 fois plus de personnes, donc 2 fois plus de farine. 250 g × 2 = 500 g."
      - "Vérifie que la réponse a du sens : pour plus de personnes, il faut plus de farine, pas moins."
    jules: "Au CM1, on raisonne avec des phrases, sans tableau. Dis-la à voix haute : « 3 fois plus de paquets, donc 3 fois plus cher »."

  - id: piege
    type: piege
    mauvaise_idee: "Pour 4 personnes, il faut 250 g de farine. Pour 8 personnes, il y a 4 personnes de plus, alors j'ajoute 4 : il faut 254 g de farine."
    pourquoi_faux: "On a ajouté au lieu de multiplier. 8 personnes, ce n'est pas « 4 de plus » qu'il faut regarder, c'est « **2 fois plus** ». Avec 254 g, il y aurait presque autant de farine pour 8 que pour 4 : pas assez de crêpes !"
    bonne_idee: "8 personnes, c'est 2 fois plus que 4 personnes. Il faut donc **2 fois plus** de farine : 250 g × 2 = 500 g."
    jules: "Un autre piège : croire que tout est proportionnel. À 10 ans, on n'est pas 2 fois plus grand qu'à 5 ans : il faut toujours vérifier d'abord."

  - id: exemple-biscuits
    type: exemple
    situation: "Pour le goûter de la classe, Maya achète des paquets de biscuits tous pareils. 5 paquets coûtent 3 €. Combien coûtent 15 paquets ?"
    calcul: "15 paquets, c'est 3 fois plus que 5 paquets, car 5 × 3 = 15. Donc on paie 3 fois plus : 3 × 3 = 9, soit 9 euros."
    conclusion: "15 paquets de biscuits coûtent **9 €**."
    jules: "Pas besoin de chercher le prix d'un seul paquet : ici, « 3 fois plus » suffit et le calcul reste facile."

  - id: exemple-cookies
    type: exemple
    situation: "Une recette de cookies demande 300 g de chocolat pour faire 24 cookies. Léo veut seulement en faire 6. Combien de chocolat lui faut-il ?"
    calcul: "6 cookies, c'est 4 fois moins que 24 cookies, car 6 × 4 = 24. Il faut donc 4 fois moins de chocolat : 300 g ÷ 4 = 75 g."
    conclusion: "Pour 6 cookies, Léo a besoin de **75 g** de chocolat."
    jules: "Vérifie avec l'autre sens : 75 g × 4 = 300 g. On retrouve bien la recette pour 24 cookies."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Dans la cuisine, prends une vraie recette et calcule-la pour 2 fois plus de personnes. Vérifie chaque ingrédient avec la phrase « 2 fois plus de personnes, 2 fois plus de... »."
