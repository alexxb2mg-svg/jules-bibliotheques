blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: propor, titre: "Deux grandeurs proportionnelles", sous_titre: "si l'une est multipliée par 3, l'autre aussi", principal: true}
      - {id: plus, titre: "Fois plus", sous_titre: "3 fois plus de manuels, 3 fois plus lourd"}
      - {id: moins, titre: "Fois moins", sous_titre: "2 fois moins de personnes, 2 fois moins de farine"}
      - {id: phrase, titre: "Raisonner en phrases", sous_titre: "« j'achète 3 fois plus, je paie 3 fois plus »"}
