<rect x="20.0" y="350.0" width="310.0" height="80.0" rx="10" fill="#F1EFE8" stroke="#6B7686" stroke-width="1"/>
<text x="175.0" y="374.0" font-size="16" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">« de plus », « de moins »</text>
<text x="175.0" y="402.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">on ajoute ou on retire : + ou −</text>
<rect x="350.0" y="350.0" width="310.0" height="80.0" rx="10" fill="#F1EFE8" stroke="#6B7686" stroke-width="1"/>
<text x="505.0" y="374.0" font-size="16" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">« fois plus », « fois moins »</text>
<text x="505.0" y="402.0" font-size="15" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">on multiplie ou on divise : × ou ÷</text>
</svg>
