<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg"><title>Comparer : « 3 de plus » ajoute 3, « 3 fois plus » multiplie par 3</title>
<text x="340.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">« 3 de plus » ou « 3 fois plus » : pas du tout pareil !</text>
