sources:
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de mathématiques en CM1 — Exemples de réussite » (2025), p. 10", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1mathspdf-111543.pdf", licence: etalab-2.0}
  - {titre: "Programme de mathématiques pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 7", url: "https://www.education.gouv.fr/sites/default/files/programme-de-math-matiques-pour-le-cycle-3-439827.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: nombre-rond
    type: formule
    expression: "47 + [38] = 47 + [40] − [2] = 85"
    termes:
      "38": {couleur: orange, legende: "le nombre à ajouter : il est **presque rond**, il lui manque 2 pour faire 40"}
      "40": {couleur: bleu, legende: "le **nombre rond** juste au-dessus : 47 + 40, c'est facile, on ajoute 4 dizaines"}
      "2": {couleur: vert, legende: "la **correction** : on a ajouté 2 de trop, alors on les retire"}
    jules: "Ça marche avec 8, 9, 18, 19, 28, 29, 38 et 39 : ils sont tous tout près d'un nombre rond. Pour 9 ou 19, la correction est de 1 ; pour 8 ou 18, elle est de 2."

  - id: carte
    type: carte
    noeuds:
      - {id: mental, titre: "Calculer dans sa tête", sous_titre: "changer le calcul pour le rendre facile", principal: true}
      - {id: rond, titre: "+ 9, + 19, + 38...", sous_titre: "passer par le nombre rond, puis corriger"}
      - {id: doubles, titre: "× 4, × 8, × 5", sous_titre: "doubler 2 ou 3 fois ; × 10 puis la moitié"}
      - {id: centaines, titre: "× 300, × 40...", sous_titre: "d'abord × 3, ensuite × 100"}
      - {id: distrib, titre: "Couper en deux paquets", sous_titre: "10 × 7 + 2 × 7, pour 12 × 7"}
    liens:
      - {de: mental, vers: rond}
      - {de: mental, vers: doubles}
      - {de: mental, vers: centaines}
      - {de: mental, vers: distrib}
    jules: "Avant de calculer, regarde bien les nombres : un 9, un 5 ou un 300 te donnent déjà une idée de raccourci. Le calcul mental, c'est choisir le bon chemin."

  - id: schema-sauts
    type: schema
    titre: "Passer par le nombre rond, puis corriger : pour ajouter et pour retirer"
    svg: "cm1-procedures-de-calcul-mental.svg"
    jules: "Regarde le sens de la correction. Pour ajouter 38, on a sauté trop loin, donc on recule. Pour retirer 29, on a reculé trop loin, donc on avance de 1."

  - id: schema-doubles
    type: schema
    titre: "Doubler, prendre la moitié, passer par 10 ou par 100"
    svg: "cm1-procedures-de-calcul-mental-doubles.svg"
    jules: "Doubler 3 fois, c'est multiplier par 2 × 2 × 2, donc par 8. Et × 5 marche bien avec les nombres pairs : la moitié de 460 tombe juste, 230."

  - id: schema-distributivite
    type: schema
    titre: "La distributivité : 12 rangées, c'est 10 rangées plus 2 rangées"
    svg: "cm1-procedures-de-calcul-mental-distributivite.svg"
    jules: "Ce grand mot, **distributivité**, dit une chose simple : on peut couper les rangées en deux paquets, compter chaque paquet, puis tout additionner. Le nombre de chaises ne change pas."

  - id: methode
    type: methode
    etapes:
      - "Regarde les nombres : lequel est **presque rond** (19, 38, 99) ? lequel se double facilement ?"
      - "Pour + 8, + 9, + 18... + 39 : ajoute le **nombre rond** juste au-dessus, puis retire la différence. 156 + 19 = 156 + 20 − 1 = 175."
      - "Pour − 9, − 19, − 29... : retire le nombre rond, puis **rajoute** la différence. 63 − 29 = 63 − 30 + 1 = 34."
      - "Pour × 4 : double 2 fois. Pour × 8 : double 3 fois. Pour × 5 : fais × 10, puis prends la **moitié**."
      - "Pour × 300 : fais × 3, puis × 100. Pour 12 × 7 : coupe 12 en 10 + 2, calcule 10 × 7 et 2 × 7, puis **additionne**."
    jules: "Dis les étapes à voix basse, comme une petite histoire : « 47 plus 40, 87 ; moins 2, 85 ». Retenir le résultat du milieu, c'est la moitié du travail."

  - id: piege
    type: piege
    mauvaise_idee: "Pour 47 + 38, j'ajoute 40 : 47 + 40 = 87. C'est fini."
    pourquoi_faux: "On a ajouté 40 au lieu de 38 : c'est **2 de trop**. Sans la correction, le résultat est faux de 2."
    bonne_idee: "47 + 38 = 47 + 40 − 2 = 87 − 2 = **85**. Pour une soustraction, on corrige dans l'autre sens : 63 − 29 = 63 − 30 + 1 = 34."
    jules: "Autre piège : mélanger les doubles. Doubler 2 fois fait × 4, doubler 3 fois fait × 8 : compte tes doubles sur tes doigts."

  - id: exemple-cantine
    type: exemple
    situation: "À la cantine, il y a 14 tables. À chaque table, 8 élèves mangent. Combien d'élèves mangent à la cantine ? Il faut calculer 8 × 14."
    calcul: "× 8, c'est doubler 3 fois. 14 × 2 = 28, puis 28 × 2 = 56, puis 56 × 2 = 112."
    conclusion: "**112 élèves** mangent à la cantine."
    jules: "Tu peux vérifier avec les rangées : 14 × 8 = 10 × 8 + 4 × 8 = 80 + 32 = 112. Deux chemins, le même résultat : tu peux être sûr de toi."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi pour le trajet de l'école : pars de 100 et ajoute 19 dans ta tête, cinq fois de suite. Tu dois trouver 195."
