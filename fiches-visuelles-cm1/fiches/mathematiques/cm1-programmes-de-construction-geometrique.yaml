    noeuds:
      - {id: programme, titre: "Un programme de construction", sous_titre: "des instructions à tracer une par une, dans l'ordre", principal: true}
      - {id: regle, titre: "La règle graduée", sous_titre: "segments et longueurs : [AB] de 5 cm"}
      - {id: equerre, titre: "L'équerre", sous_titre: "angles droits et perpendiculaires"}
      - {id: compas, titre: "Le compas", sous_titre: "cercles : un centre et un rayon"}
