<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg"><title>Le tout et les parts : une soustraction pour la part cachée, une multiplication pour les parts égales</title>
<text x="20.0" y="22.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Réunir ou séparer : le tout et les parts</text>
<text x="20.0" y="50.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Dans le car, il y a 32 élèves. 17 sont des filles. Combien de garçons ?</text>
<text x="340.0" y="80.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">32 élèves : le tout</text>
<path d="M60.0 114.0 Q60.0 105.0 70.0 105.0 L330.0 105.0 Q340.0 105.0 340.0 96.0 Q340.0 105.0 350.0 105.0 L610.0 105.0 Q620.0 105.0 620.0 114.0" fill="none" stroke="#1a1a18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60.0" y="118.0" width="297.5" height="44.0" rx="0" fill="#E6F1FB" stroke="#1D4E89" stroke-width="2"/>
<rect x="357.5" y="118.0" width="262.5" height="44.0" rx="0" fill="#FDEBDD" stroke="#D9480F" stroke-width="2" stroke-dasharray="6 4"/>
<text x="208.8" y="140.0" font-size="18" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">17 filles</text>
<text x="488.8" y="140.0" font-size="18" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">? garçons</text>
<text x="340.0" y="192.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">On cherche une part : </tspan><tspan fill="#D9480F">32 − 17 = 15</tspan><tspan fill="#1a1a18">. Il y a 15 garçons.</tspan></text>
<line x1="20.0" y1="222.0" x2="660.0" y2="222.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text x="20.0" y="246.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Des parts toutes pareilles : la multiplication</text>
<text x="20.0" y="274.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Le fermier range ses œufs dans 4 boîtes de 6. Combien d'œufs en tout ?</text>
