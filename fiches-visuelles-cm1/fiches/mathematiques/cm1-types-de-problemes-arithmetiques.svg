<text x="340.0" y="392.0" font-size="17" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">? œufs en tout</text>
<text x="340.0" y="420.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#D9480F">4 × 6 = 24</tspan><tspan fill="#1a1a18"> œufs. À l'envers : 24 œufs en 4 boîtes, </tspan><tspan fill="#1D4E89">24 ÷ 4 = 6</tspan><tspan fill="#1a1a18">.</tspan></text>
