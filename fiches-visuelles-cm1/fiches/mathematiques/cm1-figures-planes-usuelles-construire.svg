<line x1="190.0" y1="260.0" x2="190.0" y2="272.0" stroke="#1a1a18" stroke-width="1" stroke-linecap="butt"/>
<text class="ts" x="190.0" y="283.0" text-anchor="middle" dominant-baseline="central">7</text>
<text class="t" x="120.0" y="150.0" text-anchor="middle" dominant-baseline="central">à la règle graduée,</text>
<text class="t" x="120.0" y="170.0" text-anchor="middle" dominant-baseline="central">du 0 jusqu'au 7</text>
<line x1="270.0" y1="230.0" x2="410.0" y2="230.0" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round"/>
