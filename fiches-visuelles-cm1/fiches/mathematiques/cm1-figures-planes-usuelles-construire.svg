<line x1="630.0" y1="230.0" x2="630.0" y2="170.0" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="502.0,230.0 502.0,218.0 490.0,218.0" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"/>
<polyline points="618.0,230.0 618.0,218.0 630.0,218.0" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"/>
<text x="478.0" y="166.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">D</text>
<text x="642.0" y="166.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">C</text>
<line x1="490.0" y1="170.0" x2="630.0" y2="170.0" stroke="#185FA5" stroke-width="3" stroke-linecap="round"/>
<polyline points="502.0,170.0 502.0,182.0 490.0,182.0" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"/>
<polyline points="618.0,170.0 618.0,182.0 630.0,182.0" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"/>
<g class="c-blue"><text class="t" x="560.0" y="280.0" text-anchor="middle" dominant-baseline="central">vérifie : DC mesure 7 cm</text></g>
<g class="c-coral"><text class="t" x="560.0" y="300.0" text-anchor="middle" dominant-baseline="central">et 4 angles droits</text></g>
<line x1="230.0" y1="45.0" x2="230.0" y2="310.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<line x1="450.0" y1="45.0" x2="450.0" y2="310.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text class="ts" x="340.0" y="322.0" text-anchor="middle" dominant-baseline="central">Dessin pas à l'échelle.</text>
</svg>
