<line x1="110.0" y1="260.0" x2="110.0" y2="272.0" stroke="#1a1a18" stroke-width="1" stroke-linecap="butt"/>
<text class="ts" x="110.0" y="283.0" text-anchor="middle" dominant-baseline="central">3</text>
<line x1="130.0" y1="260.0" x2="130.0" y2="272.0" stroke="#1a1a18" stroke-width="1" stroke-linecap="butt"/>
<text class="ts" x="130.0" y="283.0" text-anchor="middle" dominant-baseline="central">4</text>
<line x1="150.0" y1="260.0" x2="150.0" y2="272.0" stroke="#1a1a18" stroke-width="1" stroke-linecap="butt"/>
<text class="ts" x="150.0" y="283.0" text-anchor="middle" dominant-baseline="central">5</text>
<line x1="170.0" y1="260.0" x2="170.0" y2="272.0" stroke="#1a1a18" stroke-width="1" stroke-linecap="butt"/>
