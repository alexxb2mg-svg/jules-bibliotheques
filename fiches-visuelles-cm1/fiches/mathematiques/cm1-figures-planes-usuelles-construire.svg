<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg"><title>Construire un rectangle de 7 cm sur 3 cm</title>
<text class="th" x="120.0" y="26.0" text-anchor="middle" dominant-baseline="central">1. Trace [AB] = 7 cm</text>
<text class="th" x="340.0" y="26.0" text-anchor="middle" dominant-baseline="central">2. Angles droits en A et B</text>
<text class="th" x="560.0" y="26.0" text-anchor="middle" dominant-baseline="central">3. Relie C et D</text>
<line x1="50.0" y1="230.0" x2="190.0" y2="230.0" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round"/>
<text x="38.0" y="246.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">A</text>
<text x="202.0" y="246.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">B</text>
<rect x="42.0" y="260.0" width="170.0" height="34.0" rx="0" fill="#F1EFE8" stroke="#8a8880" stroke-width="1.2"/>
