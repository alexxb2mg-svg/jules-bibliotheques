<text x="422.0" y="246.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">B</text>
<line x1="270.0" y1="230.0" x2="270.0" y2="170.0" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round"/>
<line x1="410.0" y1="230.0" x2="410.0" y2="170.0" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="282.0,230.0 282.0,218.0 270.0,218.0" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"/>
