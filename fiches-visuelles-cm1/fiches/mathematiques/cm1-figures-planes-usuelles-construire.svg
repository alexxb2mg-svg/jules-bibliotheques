<text x="422.0" y="166.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">C</text>
<polygon points="410.0,230.0 350.0,230.0 410.0,140.0" fill="none" stroke="#8a8880" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 3"/>
<g class="c-blue"><text class="t" x="280.0" y="200.0" text-anchor="start" dominant-baseline="central">3 cm</text></g>
<text class="t" x="340.0" y="280.0" text-anchor="middle" dominant-baseline="central">équerre en A, puis en B :</text>
<text class="t" x="340.0" y="300.0" text-anchor="middle" dominant-baseline="central">deux côtés de 3 cm</text>
<line x1="490.0" y1="230.0" x2="630.0" y2="230.0" stroke="#1a1a18" stroke-width="2.5" stroke-linecap="round"/>
