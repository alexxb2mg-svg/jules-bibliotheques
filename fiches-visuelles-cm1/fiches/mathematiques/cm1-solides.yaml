notion: cm1-solides
titre: "Les solides : faces, arêtes, sommets, et le patron du cube"
matiere: mathematiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Exemples pour la mise en œuvre du programme de mathématiques en CM1 — Exemples de réussite » (2025), p. 21-22", url: "https://eduscol.education.gouv.fr/sites/default/files/document/exemplesmiseenoeuvrecm1mathspdf-111543.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: solide, titre: "Un solide", sous_titre: "un objet en 3 dimensions, qu'on peut prendre dans la main", principal: true}
      - {id: vocabulaire, titre: "Face, arête, sommet", sous_titre: "la face est plate, l'arête est un bord, le sommet est un coin"}
      - {id: plats, titre: "Cube, pavé, pyramide, prisme", sous_titre: "toutes leurs faces sont plates"}
      - {id: rouler, titre: "Boule, cône, cylindre", sous_titre: "une surface courbe : ils peuvent rouler"}
      - {id: patron, titre: "Le patron", sous_titre: "la figure à plat qu'on plie pour fabriquer le solide"}
    liens:
      - {de: solide, vers: vocabulaire}
      - {de: solide, vers: plats}
      - {de: solide, vers: rouler}
      - {de: plats, vers: patron}
    jules: "Imagine un dé : chaque côté plat où il y a des points est une **face**, chaque bord où deux faces se touchent est une **arête**, chaque coin pointu est un **sommet**."

  - id: schema-solides
    type: schema
    titre: "Cube, pavé, pyramide, prisme droit : on compte faces, arêtes et sommets"
    svg: "cm1-solides.svg"
    jules: "Les pointillés montrent les arêtes cachées derrière le solide : on les dessine pour savoir qu'elles existent. Une boîte à chaussures est un pavé, un dé est un cube, une tente canadienne est un prisme."

  - id: schema-patron
    type: schema
    titre: "Un patron du cube, et 6 carrés qui n'en sont pas un"
    svg: "cm1-solides-patron.svg"
    jules: "Un patron de cube a toujours 6 carrés identiques, mais toutes les dispositions ne marchent pas. Si tu vois un bloc de 2 carrés sur 2, ce n'est jamais un patron du cube."

  - id: graphe
    type: graphe
    gabarit: patron-cube
    curseurs:
      - {id: curseur-pliage, nom: pliage, min: 0, max: 10, pas: 1, depart: 0}
      - {id: curseur-modele, nom: modele, min: 1, max: 3, pas: 1, depart: 1}
    lectures:
      - {si: "pliage == 0", texte: "À plat, compte les carrés : un patron de cube en a toujours **6**, tous pareils."}
      - {si: "pliage > 0 && pliage < 10", texte: "Les faces tournent autour de leurs **arêtes** communes ; la face foncée reste posée sur la table."}
      - {si: "pliage == 10 && modele <= 2", texte: "Le cube est fermé : 6 faces carrées, aucune ne se superpose. C'est bien un **patron** du cube."}
      - {si: "pliage == 10 && modele == 3", texte: "Deux faces arrivent au même endroit et un côté reste ouvert : avec un bloc de 2 carrés sur 2, ce n'est **pas** un patron du cube."}
    jules: "Choisis un modèle, puis avance « pliage » doucement : regarde quelle face vient se coller sur quelle autre. Le modèle 3 a bien 6 carrés, et pourtant il ne ferme pas le cube."

  - id: methode
    type: methode
    etapes:
      - "Regarde si le solide a une surface courbe (boule, cône, cylindre) ou seulement des **faces** plates."
      - "Observe la forme des faces : que des carrés (cube), des rectangles (pavé), des triangles qui se rejoignent en haut (pyramide) ?"
      - "Cherche les **bases** : une seule pour la pyramide, deux superposables face à face pour le prisme droit."
      - "Compte avec le doigt : les faces, puis les arêtes, puis les sommets, en marquant ce que tu as déjà compté."
    jules: "Pour ne rien oublier, compte les arêtes par étage : sur un cube, 4 en haut, 4 en bas et 4 debout, soit 12 arêtes."

  - id: piege
    type: piege
    mauvaise_idee: "Une tente canadienne a un toit pointu avec des triangles : c'est une pyramide."
    pourquoi_faux: "Dans une **pyramide**, toutes les faces de côté sont des triangles qui se rejoignent en un seul point. La tente a 2 triangles face à face et des rectangles sur les côtés : c'est un **prisme droit**."
    bonne_idee: "Pyramide : 1 base, des triangles tout autour, un sommet en haut. Prisme droit : 2 bases identiques face à face, reliées par des **rectangles**."
    jules: "Petit truc : une pyramide finit en pointe, comme les pyramides d'Égypte. Un prisme a la même forme d'un bout à l'autre, comme une barre de chocolat en triangle."

  - id: exemple-pailles
    type: exemple
    situation: "En classe, Maëlle fabrique un cube avec des pailles de même longueur et des boules de pâte à modeler pour les coins. Combien lui faut-il de pailles et de boules ?"
    calcul: "Une paille par arête : 4 en haut, 4 en bas, 4 debout, 12 pailles. Une boule par sommet : 4 en haut et 4 en bas, 8 boules."
    conclusion: "Il faut **12 pailles** et **8 boules** de pâte à modeler."
    jules: "Pour un pavé, ce serait aussi 12 pailles et 8 boules, mais avec des pailles de 3 longueurs différentes."

  - id: exemple-boite
    type: exemple
    situation: "Noah observe une boîte de céréales fermée. Toutes ses faces sont des rectangles. Combien a-t-elle de faces, et comment s'appelle ce solide ?"
    calcul: "On compte : devant et derrière, 2 faces ; dessus et dessous, 2 faces ; les deux côtés, 2 faces. 2 + 2 + 2 = 6."
    conclusion: "La boîte a **6 faces** rectangulaires : c'est un **pavé droit**."
    jules: "Les faces d'un pavé vont par paires identiques, face à face. Un cube est un pavé spécial : ses 6 faces sont des carrés identiques."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi bricolage : dessine la croix de 6 carrés sur du papier cartonné, découpe-la et plie-la. Tu tiendras un vrai cube dans ta main !"
