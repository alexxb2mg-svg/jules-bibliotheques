<text x="125.0" y="30.0" font-size="19" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">angle aigu</text>
<g class="c-blue"><text class="t" x="125.0" y="262.0" text-anchor="middle" dominant-baseline="central">l'autre côté passe</text></g>
<g class="c-blue"><text class="t" x="125.0" y="281.0" text-anchor="middle" dominant-baseline="central">SUR l'équerre</text></g>
<text class="ts" x="125.0" y="305.0" text-anchor="middle" dominant-baseline="central">plus fermé qu'un angle droit</text>
<polygon points="300.0,225.0 420.0,225.0 300.0,105.0" fill="#F1EFE8" stroke="#8a8880" stroke-width="1.5" stroke-linejoin="round"/>
