<svg width="100%" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg"><title>Angle aigu, droit et obtus vérifiés avec l'équerre</title>
<polygon points="70.0,225.0 190.0,225.0 70.0,105.0" fill="#F1EFE8" stroke="#8a8880" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="88.0,207.0 128.0,207.0 88.0,167.0" fill="#ffffff" stroke="#8a8880" stroke-width="1" stroke-linejoin="round"/>
<polyline points="70.0,213.0 82.0,213.0 82.0,225.0" fill="none" stroke="#8a8880" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="70.0" y1="225.0" x2="215.0" y2="225.0" stroke="#185FA5" stroke-width="3.5" stroke-linecap="round"/>
<line x1="70.0" y1="225.0" x2="161.8" y2="93.9" stroke="#185FA5" stroke-width="3.5" stroke-linecap="round"/>
<path d="M100.0 225.0 A30 30 0 0 0 87.2 200.4" fill="none" stroke="#185FA5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
