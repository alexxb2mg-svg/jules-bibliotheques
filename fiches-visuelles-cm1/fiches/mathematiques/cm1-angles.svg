<line x1="300.0" y1="225.0" x2="445.0" y2="225.0" stroke="#3B6D11" stroke-width="3.5" stroke-linecap="round"/>
<line x1="300.0" y1="225.0" x2="300.0" y2="65.0" stroke="#3B6D11" stroke-width="3.5" stroke-linecap="round"/>
<polyline points="300.0,209.0 316.0,209.0 316.0,225.0" fill="none" stroke="#3B6D11" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="300.0" cy="225.0" r="4.5" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="355.0" y="30.0" font-size="19" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">angle droit</text>
<g class="c-green"><text class="t" x="355.0" y="262.0" text-anchor="middle" dominant-baseline="central">l'autre côté suit</text></g>
<g class="c-green"><text class="t" x="355.0" y="281.0" text-anchor="middle" dominant-baseline="central">le bord de l'équerre</text></g>
<text class="ts" x="355.0" y="305.0" text-anchor="middle" dominant-baseline="central">le coin d'une feuille</text>
<polygon points="520.0,225.0 640.0,225.0 520.0,105.0" fill="#F1EFE8" stroke="#8a8880" stroke-width="1.5" stroke-linejoin="round"/>
<polygon points="538.0,207.0 578.0,207.0 538.0,167.0" fill="#ffffff" stroke="#8a8880" stroke-width="1" stroke-linejoin="round"/>
<polyline points="520.0,213.0 532.0,213.0 532.0,225.0" fill="none" stroke="#8a8880" stroke-width="1.2" stroke-linejoin="round"/>
<line x1="520.0" y1="225.0" x2="665.0" y2="225.0" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round"/>
<line x1="520.0" y1="225.0" x2="428.2" y2="93.9" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round"/>
<path d="M550.0 225.0 A30 30 0 0 0 502.8 200.4" fill="none" stroke="#C2410C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="520.0" cy="225.0" r="4.5" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="575.0" y="30.0" font-size="19" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">angle obtus</text>
<g class="c-coral"><text class="t" x="575.0" y="262.0" text-anchor="middle" dominant-baseline="central">l'autre côté passe</text></g>
<g class="c-coral"><text class="t" x="575.0" y="281.0" text-anchor="middle" dominant-baseline="central">EN DEHORS de l'équerre</text></g>
<text class="ts" x="575.0" y="305.0" text-anchor="middle" dominant-baseline="central">plus ouvert qu'un angle droit</text>
<text class="ts" x="70.0" y="245.0" text-anchor="middle" dominant-baseline="central">sommet</text>
<text class="ts" x="340.0" y="335.0" text-anchor="middle" dominant-baseline="central">L'équerre est en gris : on pose son coin droit sur le sommet, un bord le long d'un côté.</text>
