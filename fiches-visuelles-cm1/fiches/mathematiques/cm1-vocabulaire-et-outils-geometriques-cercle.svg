<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg"><title>Cercle et disque, segment, droite et demi-droite</title>
<text class="tl" x="170.0" y="24.0" text-anchor="middle" dominant-baseline="central">Cercle ou disque ?</text>
<circle cx="150.0" cy="200.0" r="110" fill="#E6F1FB" stroke="#185FA5" stroke-width="4"/>
<line x1="150.0" y1="200.0" x2="260.0" y2="200.0" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/>
<g class="c-coral"><text class="t" x="205.0" y="186.0" text-anchor="middle" dominant-baseline="central">rayon 3 cm</text></g>
<line x1="145.0" y1="195.0" x2="155.0" y2="205.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<line x1="145.0" y1="205.0" x2="155.0" y2="195.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<text x="146.0" y="220.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">O</text>
<line x1="175.0" y1="255.0" x2="185.0" y2="265.0" stroke="#3B6D11" stroke-width="2" stroke-linecap="round"/>
<line x1="175.0" y1="265.0" x2="185.0" y2="255.0" stroke="#3B6D11" stroke-width="2" stroke-linecap="round"/>
<text x="196.0" y="260.0" font-size="17" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">P</text>
<line x1="215.7" y1="279.3" x2="225.7" y2="289.3" stroke="#185FA5" stroke-width="2" stroke-linecap="round"/>
<line x1="215.7" y1="289.3" x2="225.7" y2="279.3" stroke="#185FA5" stroke-width="2" stroke-linecap="round"/>
<text x="234.7" y="298.3" font-size="17" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">M</text>
<line x1="295.0" y1="85.0" x2="305.0" y2="95.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<line x1="295.0" y1="95.0" x2="305.0" y2="85.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<text x="316.0" y="90.0" font-size="17" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">E</text>
<g class="c-blue"><text class="t" x="170.0" y="342.0" text-anchor="middle" dominant-baseline="central">le cercle : le trait du tour (M dessus)</text></g>
<g class="c-green"><text class="t" x="170.0" y="364.0" text-anchor="middle" dominant-baseline="central">le disque : le tour + l'intérieur (P dedans)</text></g>
<g class="c-coral"><text class="t" x="170.0" y="386.0" text-anchor="middle" dominant-baseline="central">E, à plus de 3 cm de O : hors du disque</text></g>
<line x1="345.0" y1="15.0" x2="345.0" y2="390.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text class="tl" x="510.0" y="24.0" text-anchor="middle" dominant-baseline="central">Segment, droite, demi-droite</text>
<line x1="420.0" y1="90.0" x2="580.0" y2="90.0" stroke="#185FA5" stroke-width="3" stroke-linecap="round"/>
<line x1="415.0" y1="85.0" x2="425.0" y2="95.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<line x1="415.0" y1="95.0" x2="425.0" y2="85.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<text x="420.0" y="70.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">A</text>
<line x1="575.0" y1="85.0" x2="585.0" y2="95.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<line x1="575.0" y1="95.0" x2="585.0" y2="85.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<text x="580.0" y="70.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">B</text>
<text class="th" x="510.0" y="120.0" text-anchor="middle" dominant-baseline="central">un segment [AB]</text>
<text class="t" x="510.0" y="140.0" text-anchor="middle" dominant-baseline="central">il s'arrête en A et en B</text>
<line x1="372.0" y1="200.0" x2="650.0" y2="200.0" stroke="#185FA5" stroke-width="3" stroke-linecap="round"/>
<line x1="356.0" y1="200.0" x2="372.0" y2="200.0" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="650.0" y1="200.0" x2="668.0" y2="200.0" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="415.0" y1="195.0" x2="425.0" y2="205.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<line x1="415.0" y1="205.0" x2="425.0" y2="195.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<text x="420.0" y="180.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">A</text>
<line x1="575.0" y1="195.0" x2="585.0" y2="205.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<line x1="575.0" y1="205.0" x2="585.0" y2="195.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<text x="580.0" y="180.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">B</text>
<text class="th" x="510.0" y="230.0" text-anchor="middle" dominant-baseline="central">une droite (AB)</text>
<text class="t" x="510.0" y="250.0" text-anchor="middle" dominant-baseline="central">elle continue sans fin des deux côtés</text>
<line x1="420.0" y1="310.0" x2="650.0" y2="310.0" stroke="#185FA5" stroke-width="3" stroke-linecap="round"/>
<line x1="650.0" y1="310.0" x2="668.0" y2="310.0" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
<line x1="415.0" y1="305.0" x2="425.0" y2="315.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<line x1="415.0" y1="315.0" x2="425.0" y2="305.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<text x="420.0" y="290.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">A</text>
<line x1="575.0" y1="305.0" x2="585.0" y2="315.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<line x1="575.0" y1="315.0" x2="585.0" y2="305.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<text x="580.0" y="290.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">B</text>
<text class="th" x="510.0" y="340.0" text-anchor="middle" dominant-baseline="central">une demi-droite [AB)</text>
<text class="t" x="510.0" y="360.0" text-anchor="middle" dominant-baseline="central">elle part de A et continue après B</text>
</svg>
