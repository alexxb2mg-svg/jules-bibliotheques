notion: cm1-reperage-dans-espace
titre: "Se déplacer avec les bons mots, et compter les cubes d'un assemblage"
matiere: mathematiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
