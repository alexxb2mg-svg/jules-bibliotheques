<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg"><title>Chaque instruction a son outil : règle, équerre, compas</title>
<text class="t" x="113.3" y="22.0" text-anchor="middle" dominant-baseline="central">« Trace le segment [EF]</text>
<text class="t" x="113.3" y="41.0" text-anchor="middle" dominant-baseline="central">de 4 cm. »</text>
<text x="113.3" y="300.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">règle graduée</text>
<line x1="226.7" y1="16.0" x2="226.7" y2="316.0" stroke="#e0ded6" stroke-width="1" stroke-linecap="butt"/>
<text class="t" x="340.0" y="22.0" text-anchor="middle" dominant-baseline="central">« Trace la droite</text>
<text class="t" x="340.0" y="41.0" text-anchor="middle" dominant-baseline="central">perpendiculaire à (EF)</text>
<text class="t" x="340.0" y="60.0" text-anchor="middle" dominant-baseline="central">qui passe par F. »</text>
<text x="340.0" y="300.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">équerre</text>
<line x1="453.3" y1="16.0" x2="453.3" y2="316.0" stroke="#e0ded6" stroke-width="1" stroke-linecap="butt"/>
<text class="t" x="566.7" y="22.0" text-anchor="middle" dominant-baseline="central">« Trace le cercle de</text>
<text class="t" x="566.7" y="41.0" text-anchor="middle" dominant-baseline="central">centre O et de rayon</text>
<text class="t" x="566.7" y="60.0" text-anchor="middle" dominant-baseline="central">2 cm. »</text>
<text x="566.7" y="300.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">compas</text>
