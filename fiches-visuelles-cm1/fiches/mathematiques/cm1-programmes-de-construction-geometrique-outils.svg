<text x="45.7" y="172.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">E</text>
<circle cx="180.9" cy="190.0" r="3.5" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="180.9" y="172.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">F</text>
<text x="113.3" y="150.0" font-size="16" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">[EF] : 4 cm</text>
<text class="ts" x="113.3" y="250.0" text-anchor="middle" dominant-baseline="central">un segment s'arrête</text>
<text class="ts" x="113.3" y="265.0" text-anchor="middle" dominant-baseline="central">à ses deux bouts</text>
<line x1="240.0" y1="215.0" x2="420.0" y2="215.0" stroke="#8a8880" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="370.0,215.0 326.0,215.0 370.0,145.0" fill="#DCEBF8" stroke="#185FA5" stroke-width="1.5" stroke-linejoin="round"/>
