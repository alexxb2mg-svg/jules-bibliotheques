<text x="79.5" y="219.0" font-size="11" fill="#185FA5" font-weight="600" text-anchor="middle" dominant-baseline="central">1</text>
<line x1="113.3" y1="198.0" x2="113.3" y2="211.0" stroke="#185FA5" stroke-width="1.5" stroke-linecap="butt"/>
<text x="113.3" y="219.0" font-size="11" fill="#185FA5" font-weight="600" text-anchor="middle" dominant-baseline="central">2</text>
<line x1="147.1" y1="198.0" x2="147.1" y2="211.0" stroke="#185FA5" stroke-width="1.5" stroke-linecap="butt"/>
<text x="147.1" y="219.0" font-size="11" fill="#185FA5" font-weight="600" text-anchor="middle" dominant-baseline="central">3</text>
<line x1="180.9" y1="198.0" x2="180.9" y2="211.0" stroke="#185FA5" stroke-width="1.5" stroke-linecap="butt"/>
<text x="180.9" y="219.0" font-size="11" fill="#185FA5" font-weight="600" text-anchor="middle" dominant-baseline="central">4</text>
<line x1="45.7" y1="190.0" x2="180.9" y2="190.0" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round"/>
