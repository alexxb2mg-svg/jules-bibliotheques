<text x="542.7" y="199.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">O</text>
<line x1="556.7" y1="185.0" x2="624.3" y2="185.0" stroke="#C2410C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="594.5" y="201.0" font-size="14" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">2 cm</text>
<text class="ts" x="566.7" y="262.0" text-anchor="middle" dominant-baseline="central">on écarte le compas de 2 cm</text>
<text class="ts" x="566.7" y="277.0" text-anchor="middle" dominant-baseline="central">sur la règle, pointe sur O</text>
</svg>
