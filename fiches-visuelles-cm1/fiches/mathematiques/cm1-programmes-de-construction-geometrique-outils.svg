<polyline points="382.0,215.0 382.0,203.0 370.0,203.0" fill="none" stroke="#C2410C" stroke-width="1.8" stroke-linejoin="round"/>
<circle cx="270.0" cy="215.0" r="3.5" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="270.0" y="233.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">E</text>
<circle cx="370.0" cy="215.0" r="3.5" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="386.0" y="233.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">F</text>
<text class="ts" x="340.0" y="258.0" text-anchor="middle" dominant-baseline="central">une droite ne s'arrête pas :</text>
<text class="ts" x="340.0" y="273.0" text-anchor="middle" dominant-baseline="central">on la trace au-delà des points</text>
<circle cx="556.6666666666666" cy="185" r="67.6" fill="none" stroke="#C2410C" stroke-width="3.5"/>
