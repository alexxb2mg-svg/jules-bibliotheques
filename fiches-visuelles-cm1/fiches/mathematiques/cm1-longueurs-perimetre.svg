<text x="262.0" y="90.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Le périmètre, c'est la longueur du tour.</text>
<text x="262.0" y="124.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">On part du point rouge, on fait tout le tour</text>
<text x="262.0" y="146.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">de la maison et on revient au départ.</text>
<text x="262.0" y="184.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Puis on « déroule » le tour sur une ligne droite :</text>
<text x="262.0" y="206.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">on met les 5 côtés bout à bout.</text>
