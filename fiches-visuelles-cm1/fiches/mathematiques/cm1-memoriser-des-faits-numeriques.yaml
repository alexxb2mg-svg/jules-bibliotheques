  - {titre: "Programme de mathématiques pour le cycle 3, arrêté du 10-4-2025, BO n° 16 du 17/04/2025, p. 7", url: "https://www.education.gouv.fr/sites/default/files/programme-de-math-matiques-pour-le-cycle-3-439827.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: essentiel
    type: formule
    expression: "60 = [6 × 10] = [5 × 12] = [4 × 15] = [2 × 30]"
    termes:
      "6 × 10": {couleur: bleu, legende: "c'est 6 **dizaines**"}
      "5 × 12": {couleur: violet, legende: "comme 5 boîtes de 12 œufs"}
      "4 × 15": {couleur: vert, legende: "comme 4 **quarts d'heure** de 15 min : 1 h, c'est-à-dire 60 min"}
      "2 × 30": {couleur: orange, legende: "comme 2 **demi-heures** de 30 min : 1 h aussi"}
    jules: "Le nombre 60 est partout : 60 minutes dans une heure, 60 secondes dans une minute. Connaître ses décompositions t'aide à lire l'heure et à partager."

  - id: carte
    type: carte
    noeuds:
      - {id: coeur, titre: "Savoir par cœur", sous_titre: "répondre tout de suite, sans recompter", principal: true}
      - {id: tables, titre: "Les tables", sous_titre: "d'addition et de multiplication : 7 × 8 = 56"}
      - {id: doubles, titre: "Doubles et moitiés", sous_titre: "doubles de 1 à 20, moitiés des nombres pairs jusqu'à 40"}
      - {id: vingtcinq, titre: "25 et 60", sous_titre: "25, 50, 75, 100 ; 60 = 4 × 15 = 5 × 12"}
      - {id: fractions, titre: "Fractions usuelles", sous_titre: "1/4 + 1/4 = 1/2 ; 1/10 = 0,1 ; 1/100 = 0,01"}
    liens:
      - {de: coeur, vers: tables}
      - {de: coeur, vers: doubles}
      - {de: coeur, vers: vingtcinq}
      - {de: coeur, vers: fractions}
    jules: "Un fait su par cœur, c'est comme ton prénom : tu ne le recalcules pas, il sort tout seul. Ta tête est alors libre pour réfléchir au problème."

  - id: schema-pythagore
    type: schema
    titre: "La table de Pythagore : 7 × 8 et 8 × 7 donnent le même résultat"
    svg: "cm1-memoriser-des-faits-numeriques.svg"
    jules: "Pour lire la grille, pose un doigt sur la ligne 7 et un autre sur la colonne 8 : ils se rejoignent sur 56. Grâce au miroir, apprendre 7 × 8, c'est aussi apprendre 8 × 7."

  - id: schema-horloge
    type: schema
    titre: "Un quart d'heure, une barre de 100 : des fractions qu'on rencontre tous les jours"
    svg: "cm1-memoriser-des-faits-numeriques-horloge.svg"
    jules: "Deux quarts font une moitié : 15 min + 15 min = 30 min, une demi-heure. Et deux moitiés font le tout : 1/2 + 1/2 = 1."

  - id: methode
    type: methode
    etapes:
      - "Récite les tables en disant seulement le résultat : « 7 fois 8, 56 », sans passer par 8 + 8 + 8..."
      - "Commence par les tables faciles (2, 5, 10), puis utilise le **miroir** : 3 × 7, c'est 7 × 3."
      - "Pour un **double**, ajoute le nombre à lui-même : double de 17 = 34. Pour une **moitié**, partage en 2 : moitié de 34 = 17."
      - "Relie ce que tu apprends à ce que tu sais : 4 × 25 = 100, donc 3 × 25 = 100 − 25 = 75."
      - "Revois un peu chaque jour : 5 minutes tous les jours valent mieux qu'une heure une seule fois."
    jules: "Le double et la moitié se défont l'un l'autre : le double de 18 est 36, et la moitié de 36 revient à 18."

  - id: piege
    type: piege
    mauvaise_idee: "La moitié de 40, c'est 80."
    pourquoi_faux: "La **moitié**, c'est partager en 2 parts égales : on obtient un nombre plus petit. 80, c'est le **double** de 40 (40 + 40), un nombre plus grand."
    bonne_idee: "La moitié de 40 est 20, car 20 + 20 = 40. Le double de 40 est 80, car 40 + 40 = 80."
    jules: "Pour ne pas les mélanger : la moitié d'une pizza, c'est une demi-pizza, plus petite que la pizza. Le double, c'est deux pizzas."

  - id: exemple-images
    type: exemple
    situation: "Lucie a 18 images d'animaux. Son grand frère en a le double. Lucie donne ensuite la moitié de ses 18 images à son ami Tom. Combien d'images a le frère ? Combien Tom en reçoit-il ?"
    calcul: "Double de 18 : 18 + 18 = 36. Moitié de 18 : 18 partagé en 2, c'est 9, car 9 + 9 = 18."
    conclusion: "Le frère de Lucie a **36 images**, et Tom en reçoit **9**. Il en reste 9 à Lucie."
    jules: "Pour le double de 18, pense à 10 + 10 = 20 et 8 + 8 = 16 : 20 + 16 = 36. On découpe en dizaines et unités."

  - id: exemple-lait
    type: exemple
    situation: "Rayan ouvre une bouteille de 1 L de lait. Il en boit 1/4 L au petit-déjeuner et 1/4 L au goûter. Quelle quantité a-t-il bue ? Combien en reste-t-il ?"
    calcul: "1/4 + 1/4 = 1/2 : deux quarts font une moitié. Il reste 1 − 1/2 = 1/2."
    conclusion: "Rayan a bu **un demi-litre**, et il reste un demi-litre dans la bouteille."
    jules: "Ces égalités se savent sans calculer, comme les tables : 1/4 + 1/4 = 1/2 et 1/2 + 1/2 = 1. Et 1/10, c'est 0,1 ; 1/100, c'est 0,01."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Fabrique des cartes : la question d'un côté (7 × 8), la réponse de l'autre (56). Trie-les en deux tas, « je sais » et « je ne sais pas encore », et reprends chaque jour le deuxième tas."
