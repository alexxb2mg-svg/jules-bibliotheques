<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg"><title>Une figure peut avoir un axe de symétrie, plusieurs, ou aucun</title>
<text x="85.0" y="262.0" font-size="17" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">1 axe</text>
<text class="ts" x="85.0" y="288.0" text-anchor="middle" dominant-baseline="central">vertical</text>
<text class="ts" x="85.0" y="306.0" text-anchor="middle" dominant-baseline="central">(de haut en bas)</text>
<polygon points="85.0,40.0 35.0,120.0 60.0,120.0 25.0,190.0 145.0,190.0 110.0,120.0 135.0,120.0" fill="#D3ECCB" stroke="#2B8A3E" stroke-width="2" stroke-linejoin="round"/>
<rect x="75.0" y="190.0" width="20.0" height="30.0" rx="0" fill="#E8D5B5" stroke="#854F0B" stroke-width="2"/>
<line x1="85.0" y1="28.0" x2="85.0" y2="232.0" stroke="#C92A2A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 5"/>
<text x="255.0" y="262.0" font-size="17" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">1 axe</text>
<text class="ts" x="255.0" y="288.0" text-anchor="middle" dominant-baseline="central">horizontal</text>
<text class="ts" x="255.0" y="306.0" text-anchor="middle" dominant-baseline="central">(de gauche à droite)</text>
<polygon points="215.0,50.0 295.0,50.0 295.0,80.0 245.0,80.0 245.0,120.0 280.0,120.0 280.0,150.0 245.0,150.0 245.0,190.0 295.0,190.0 295.0,220.0 215.0,220.0" fill="#CFE2F6" stroke="#1D4E89" stroke-width="2" stroke-linejoin="round"/>
<line x1="193.0" y1="135.0" x2="317.0" y2="135.0" stroke="#C92A2A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 5"/>
<text x="425.0" y="262.0" font-size="17" fill="#C92A2A" font-weight="700" text-anchor="middle" dominant-baseline="central">2 axes</text>
<text class="ts" x="425.0" y="288.0" text-anchor="middle" dominant-baseline="central">un vertical</text>
<text class="ts" x="425.0" y="306.0" text-anchor="middle" dominant-baseline="central">et un horizontal</text>
<rect x="365.0" y="75.0" width="120.0" height="100.0" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
<line x1="425.0" y1="55.0" x2="425.0" y2="195.0" stroke="#C92A2A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 5"/>
<line x1="347.0" y1="125.0" x2="503.0" y2="125.0" stroke="#C92A2A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="8 5"/>
<text x="595.0" y="262.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">aucun axe</text>
<text class="ts" x="595.0" y="288.0" text-anchor="middle" dominant-baseline="central">en pliant, les deux moitiés</text>
<text class="ts" x="595.0" y="306.0" text-anchor="middle" dominant-baseline="central">ne se superposent jamais</text>
<polygon points="555.0,50.0 635.0,50.0 635.0,80.0 585.0,80.0 585.0,120.0 620.0,120.0 620.0,150.0 585.0,150.0 585.0,220.0 555.0,220.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2" stroke-linejoin="round"/>
<line x1="170.0" y1="30.0" x2="170.0" y2="310.0" stroke="#e0ded6" stroke-width="1" stroke-linecap="butt"/>
<line x1="340.0" y1="30.0" x2="340.0" y2="310.0" stroke="#e0ded6" stroke-width="1" stroke-linecap="butt"/>
<line x1="510.0" y1="30.0" x2="510.0" y2="310.0" stroke="#e0ded6" stroke-width="1" stroke-linecap="butt"/>
</svg>
