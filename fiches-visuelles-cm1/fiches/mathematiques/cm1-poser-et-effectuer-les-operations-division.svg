<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg"><title>La division euclidienne posée : 857 ÷ 6</title>
<text x="100.0" y="60.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">8</text>
<text x="121.0" y="60.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">5</text>
<text x="142.0" y="60.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">7</text>
<line x1="168.0" y1="46.0" x2="168.0" y2="120.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="butt"/>
<line x1="168.0" y1="76.0" x2="268.0" y2="76.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="butt"/>
<text x="192.0" y="60.0" font-size="24" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text>
<text x="192.0" y="100.0" font-size="24" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text x="213.0" y="100.0" font-size="24" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text x="234.0" y="100.0" font-size="24" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<text x="79.0" y="92.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">−</text>
<text x="100.0" y="92.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">6</text>
<line x1="71.0" y1="110.0" x2="110.0" y2="110.0" stroke="#1a1a18" stroke-width="1.6" stroke-linecap="butt"/>
<text x="100.0" y="128.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">2</text>
<text x="121.0" y="128.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">5</text>
<text x="79.0" y="160.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">−</text>
<text x="100.0" y="160.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">2</text>
<text x="121.0" y="160.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">4</text>
<line x1="71.0" y1="178.0" x2="131.0" y2="178.0" stroke="#1a1a18" stroke-width="1.6" stroke-linecap="butt"/>
<text x="121.0" y="196.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">1</text>
<text x="142.0" y="196.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">7</text>
<text x="100.0" y="228.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">−</text>
<text x="121.0" y="228.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">1</text>
<text x="142.0" y="228.0" font-size="24" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">2</text>
<line x1="92.0" y1="246.0" x2="152.0" y2="246.0" stroke="#1a1a18" stroke-width="1.6" stroke-linecap="butt"/>
<text x="142.0" y="264.0" font-size="24" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
<circle cx="142.0" cy="264.0" r="15" fill="none" stroke="#C2410C" stroke-width="1.8"/>
<line x1="121.0" y1="40.0" x2="320.0" y2="30.0" stroke="#88877f" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="4 3"/>
<text class="t" x="330.0" y="30.0" text-anchor="start" dominant-baseline="central">dividende 857 : le nombre qu'on partage</text>
<line x1="204.0" y1="54.0" x2="320.0" y2="62.0" stroke="#88877f" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="4 3"/>
<g class="c-blue"><text class="t" x="330.0" y="62.0" text-anchor="start" dominant-baseline="central">diviseur 6 : le nombre de parts</text></g>
<line x1="248.0" y1="100.0" x2="320.0" y2="100.0" stroke="#88877f" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="4 3"/>
<g class="c-green"><text class="t" x="330.0" y="100.0" text-anchor="start" dominant-baseline="central">quotient 142 : ce que reçoit chaque part</text></g>
<line x1="160.0" y1="264.0" x2="320.0" y2="140.0" stroke="#88877f" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="4 3"/>
<g class="c-coral"><text class="t" x="330.0" y="140.0" text-anchor="start" dominant-baseline="central">reste 5 : ce qu'on ne peut plus partager</text></g>
<text class="ts" x="330.0" y="186.0" text-anchor="start" dominant-baseline="central">8 centaines ÷ 6 : 1 fois, reste 2</text>
<text class="ts" x="330.0" y="206.0" text-anchor="start" dominant-baseline="central">25 dizaines ÷ 6 : 4 fois (24), reste 1</text>
<text class="ts" x="330.0" y="226.0" text-anchor="start" dominant-baseline="central">17 unités ÷ 6 : 2 fois (12), reste 5</text>
<g class="c-gray"><rect x="320" y="256" width="340" height="80" rx="8" stroke-width="0.8"/><text class="th" x="490.0" y="286.5" text-anchor="middle" dominant-baseline="central">On vérifie : 6 × 142 + 5 = 857</text><text class="t" x="490.0" y="305.5" text-anchor="middle" dominant-baseline="central">et le reste 5 est plus petit que 6</text></g>
<text class="ts" x="340.0" y="372.0" text-anchor="middle" dominant-baseline="central">Avant de commencer : 6 × 100 = 600 et 6 × 200 = 1 200, donc le quotient est entre 100 et 200.</text>
</svg>
