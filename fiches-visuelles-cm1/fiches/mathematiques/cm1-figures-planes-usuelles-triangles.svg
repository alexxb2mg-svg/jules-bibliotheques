<text class="tl" x="90.0" y="52.0" text-anchor="middle" dominant-baseline="central">quelconque</text>
<text class="t" x="90.0" y="216.0" text-anchor="middle" dominant-baseline="central">rien de</text>
<text class="t" x="90.0" y="234.0" text-anchor="middle" dominant-baseline="central">particulier</text>
