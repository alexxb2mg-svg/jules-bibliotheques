      - {id: parties, titre: "Le tout et les parts", sous_titre: "réunir, séparer, ou des parts toutes pareilles"}
      - {id: comparer, titre: "Comparer", sous_titre: "« de plus » : + ou − ; « fois plus » : × ou ÷"}
