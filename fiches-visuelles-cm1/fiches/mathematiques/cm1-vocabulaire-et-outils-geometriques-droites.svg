<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg"><title>Droites sécantes, perpendiculaires et parallèles</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="tl" x="115.0" y="24.0" text-anchor="middle" dominant-baseline="central">Sécantes</text>
<text class="t" x="115.0" y="48.0" text-anchor="middle" dominant-baseline="central">elles se coupent en un point</text>
<text class="tl" x="340.0" y="24.0" text-anchor="middle" dominant-baseline="central">Perpendiculaires</text>
<text class="t" x="340.0" y="48.0" text-anchor="middle" dominant-baseline="central">elles se coupent en angle droit</text>
<text class="tl" x="565.0" y="24.0" text-anchor="middle" dominant-baseline="central">Parallèles</text>
<text class="t" x="565.0" y="48.0" text-anchor="middle" dominant-baseline="central">elles ne se coupent jamais</text>
<line x1="35.0" y1="199.0" x2="195.0" y2="101.0" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<line x1="35.0" y1="128.0" x2="195.0" y2="172.0" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="115.0" cy="150.0" r="5" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<g class="c-coral"><text class="t" x="125.0" y="222.0" text-anchor="middle" dominant-baseline="central">point d'intersection</text></g>
<line x1="250.0" y1="150.0" x2="430.0" y2="150.0" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
