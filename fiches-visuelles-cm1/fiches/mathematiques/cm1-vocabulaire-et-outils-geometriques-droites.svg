<polyline points="353.0,150.0 353.0,137.0 340.0,137.0" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"/>
<g class="c-coral"><text class="t" x="350.0" y="180.0" text-anchor="start" dominant-baseline="central">4 angles droits</text></g>
<line x1="470.0" y1="190.0" x2="660.0" y2="190.0" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round"/>
<text class="t" x="665.0" y="190.0" text-anchor="start" dominant-baseline="central">d</text>
<line x1="510.0" y1="75.0" x2="510.0" y2="220.0" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="523.0,190.0 523.0,177.0 510.0,177.0" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"/>
<line x1="620.0" y1="75.0" x2="620.0" y2="220.0" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="633.0,190.0 633.0,177.0 620.0,177.0" fill="none" stroke="#C2410C" stroke-width="2" stroke-linejoin="round"/>
<line x1="512.0" y1="120.0" x2="618.0" y2="120.0" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fl)" marker-start="url(#fl)"/>
<line x1="512.0" y1="160.0" x2="618.0" y2="160.0" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" marker-end="url(#fl)" marker-start="url(#fl)"/>
<g class="c-green"><text class="t" x="565.0" y="140.0" text-anchor="middle" dominant-baseline="central">même écart</text></g>
<line x1="15.0" y1="262.0" x2="665.0" y2="262.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text class="t" x="340.0" y="284.0" text-anchor="middle" dominant-baseline="central">Ne pas se couper sur la feuille, ce n'est pas être parallèles !</text>
<rect x="40.0" y="312.0" width="300.0" height="112.0" rx="0" fill="none" stroke="#5F5E5A" stroke-width="1.2" stroke-dasharray="6 4"/>
<text class="ts" x="190.0" y="440.0" text-anchor="middle" dominant-baseline="central">la feuille : elles ne se touchent pas</text>
<line x1="60.0" y1="329.0" x2="320.0" y2="355.0" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<line x1="60.0" y1="411.0" x2="320.0" y2="395.4" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
