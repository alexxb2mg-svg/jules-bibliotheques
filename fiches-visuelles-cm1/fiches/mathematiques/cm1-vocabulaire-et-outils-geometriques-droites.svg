<line x1="320.0" y1="395.4" x2="570.0" y2="380.4" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<circle cx="570.0" cy="380.0" r="6" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<g class="c-blue"><text class="t" x="500.0" y="318.0" text-anchor="middle" dominant-baseline="central">prolongées à la règle,</text></g>
<g class="c-blue"><text class="t" x="500.0" y="338.0" text-anchor="middle" dominant-baseline="central">elles se coupent ici</text></g>
<g class="c-coral"><text class="tl" x="575.0" y="415.0" text-anchor="middle" dominant-baseline="central">elles sont sécantes</text></g>
