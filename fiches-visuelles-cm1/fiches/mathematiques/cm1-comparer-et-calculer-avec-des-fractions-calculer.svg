<rect x="270.0" y="104.0" width="40.0" height="40.0" rx="0" fill="#B9DB9A" stroke="#1a1a18" stroke-width="1.5"/>
<rect x="310.0" y="104.0" width="40.0" height="40.0" rx="0" fill="#B9DB9A" stroke="#1a1a18" stroke-width="1.5"/>
