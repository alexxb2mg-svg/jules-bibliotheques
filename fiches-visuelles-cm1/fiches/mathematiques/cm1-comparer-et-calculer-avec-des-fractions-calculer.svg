<text x="576.5" y="310.0" font-size="13" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">75 m</text>
<line x1="642.0" y1="270.0" x2="642.0" y2="294.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="butt"/>
<text x="642.0" y="310.0" font-size="13" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">100 m</text>
<line x1="380.0" y1="282.0" x2="445.5" y2="282.0" stroke="#2B8A3E" stroke-width="7" stroke-linecap="butt"/>
<path d="M382.0 270.0 L382.0 262.0 L443.5 262.0 L443.5 270.0" fill="none" stroke="#2B8A3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="412.8" y="246.0" font-size="16" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">25 m</text>
<text class="t" x="511.0" y="350.0" text-anchor="middle" dominant-baseline="central">100 m coupés en 4 parts égales</text>
<text x="380.8" y="379.5" font-size="17.0" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<line x1="371.5" y1="390.0" x2="390.1" y2="390.0" stroke="#1a1a18" stroke-width="1.6" stroke-linecap="butt"/>
<text x="380.8" y="401.2" font-size="17.0" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text x="439.7" y="390.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">de 100 m</text>
<text x="495.5" y="390.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">=</text>
<text x="545.1" y="390.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">100 ÷ 4</text>
<text x="594.7" y="390.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">=</text>
<text x="629.1" y="390.0" font-size="20" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">25 m</text>
<g class="c-red"><text class="t" x="340.0" y="438.0" text-anchor="middle" dominant-baseline="central">Une fraction d'une quantité : on partage, on ne multiplie pas.</text></g>
