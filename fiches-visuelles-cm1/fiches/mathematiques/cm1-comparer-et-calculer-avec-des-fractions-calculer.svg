<rect x="350.0" y="42.0" width="80.0" height="40.0" rx="0" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
<text x="58.0" y="48.4" font-size="22" fill="#2B8A3E" font-weight="600" text-anchor="middle" dominant-baseline="central">3</text>
<line x1="47.2" y1="62.0" x2="68.8" y2="62.0" stroke="#1a1a18" stroke-width="2.0" stroke-linecap="butt"/>
