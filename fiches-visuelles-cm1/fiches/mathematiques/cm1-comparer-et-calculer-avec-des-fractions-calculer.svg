<rect x="390.0" y="104.0" width="40.0" height="40.0" rx="0" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
<text x="58.0" y="110.4" font-size="22" fill="#2B8A3E" font-weight="600" text-anchor="middle" dominant-baseline="central">6</text>
<line x1="47.2" y1="124.0" x2="68.8" y2="124.0" stroke="#1a1a18" stroke-width="2.0" stroke-linecap="butt"/>
<text x="58.0" y="138.5" font-size="22" fill="#1D4E89" font-weight="600" text-anchor="middle" dominant-baseline="central">8</text>
<line x1="350.0" y1="34.0" x2="350.0" y2="152.0" stroke="#C92A2A" stroke-width="2" stroke-linecap="butt" stroke-dasharray="6 4"/>
<text x="370.0" y="124.0" font-size="14" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">+1</text>
<text class="t" x="444.0" y="48.0" text-anchor="start" dominant-baseline="central">on change les quarts</text>
<text class="t" x="444.0" y="66.0" text-anchor="start" dominant-baseline="central">en huitièmes :</text>
<g class="c-green"><text class="th" x="444.0" y="84.0" text-anchor="start" dominant-baseline="central">3 quarts = 6 huitièmes</text></g>
<text x="453.8" y="114.4" font-size="18.7" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text>
<line x1="444.0" y1="126.0" x2="463.6" y2="126.0" stroke="#1a1a18" stroke-width="1.7" stroke-linecap="butt"/>
<text x="453.8" y="138.3" font-size="18.7" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">8</text>
<text x="477.9" y="126.0" font-size="22" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text>
<text x="502.0" y="114.4" font-size="18.7" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<line x1="492.2" y1="126.0" x2="511.8" y2="126.0" stroke="#1a1a18" stroke-width="1.7" stroke-linecap="butt"/>
<text x="502.0" y="138.3" font-size="18.7" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">8</text>
<text x="526.1" y="126.0" font-size="22" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">=</text>
<text x="550.2" y="114.4" font-size="18.7" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">7</text>
<line x1="540.4" y1="126.0" x2="560.0" y2="126.0" stroke="#1a1a18" stroke-width="1.7" stroke-linecap="butt"/>
<text x="550.2" y="138.3" font-size="18.7" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">8</text>
<g class="c-green"><text class="t" x="270.0" y="166.0" text-anchor="middle" dominant-baseline="central">même sorte de parts : on ajoute les numérateurs, 6 + 1 = 7</text></g>
<line x1="20.0" y1="190.0" x2="660.0" y2="190.0" stroke="#e2e0d8" stroke-width="1.2" stroke-linecap="butt"/>
<text x="20.0" y="214.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Un tiers de 12 billes</text>
