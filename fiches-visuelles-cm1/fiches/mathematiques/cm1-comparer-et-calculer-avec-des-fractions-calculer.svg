<svg width="100%" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg"><title>Additionner des huitièmes, puis prendre un tiers et un quart</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Additionner trois quarts et un huitième</text>
<rect x="110.0" y="42.0" width="80.0" height="40.0" rx="0" fill="#B9DB9A" stroke="#1a1a18" stroke-width="1.5"/>
<rect x="190.0" y="42.0" width="80.0" height="40.0" rx="0" fill="#B9DB9A" stroke="#1a1a18" stroke-width="1.5"/>
