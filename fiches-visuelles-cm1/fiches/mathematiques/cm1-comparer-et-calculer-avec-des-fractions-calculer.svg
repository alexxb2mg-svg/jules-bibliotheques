<circle cx="262.0" cy="256.0" r="10" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<circle cx="294.0" cy="256.0" r="10" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<circle cx="262.0" cy="286.0" r="10" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<circle cx="294.0" cy="286.0" r="10" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<text x="70.0" y="322.0" font-size="14" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">1 part</text>
<text class="t" x="170.0" y="350.0" text-anchor="middle" dominant-baseline="central">12 billes en 3 parts égales : 4 billes par part</text>
<text x="71.7" y="378.9" font-size="17.849999999999998" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<line x1="62.2" y1="390.0" x2="81.3" y2="390.0" stroke="#1a1a18" stroke-width="1.6227272727272726" stroke-linecap="butt"/>
<text x="71.7" y="401.8" font-size="17.849999999999998" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text x="117.4" y="390.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">de 12</text>
<text x="160.0" y="390.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">=</text>
<text x="205.6" y="390.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">12 ÷ 3</text>
<text x="251.1" y="390.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">=</text>
<text x="271.3" y="390.0" font-size="21" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text x="372.0" y="214.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Un quart de 100 m</text>
<line x1="380.0" y1="282.0" x2="642.0" y2="282.0" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="butt"/>
