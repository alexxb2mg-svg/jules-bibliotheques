<text x="638.0" y="276.0" font-size="15" fill="#1D4E89" font-weight="700" text-anchor="start" dominant-baseline="central">9 cm</text>
<polygon points="257.0,246.0 275.0,246.0 266.0,260.0" fill="#D9480F" stroke="#D9480F" stroke-width="1" stroke-linejoin="round"/>
<text x="282.0" y="248.0" font-size="14" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">le bout du crayon</text>
<text x="370.0" y="340.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">Loupe : 1 cm coupé en 10 millimètres (mm)</text>
<text x="340.0" y="380.0" font-size="19" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Le crayon mesure </tspan><tspan fill="#1D4E89">8 cm</tspan><tspan fill="#1a1a18"> et </tspan><tspan fill="#D9480F">3 mm</tspan><tspan fill="#1a1a18">, soit 83 mm ou 8,3 cm.</tspan></text>
<text x="340.0" y="410.0" font-size="16" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">8 cm = 80 mm, et 80 mm + 3 mm = 83 mm</text>
<text x="340.0" y="436.0" font-size="15" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">Toute la règle, de 0 à 10 : 10 cm = 1 décimètre (dm)</text>
<text class="ts" x="340.0" y="458.0" text-anchor="middle" dominant-baseline="central">Dessin agrandi : sur ta vraie règle, 1 cm est bien plus petit.</text>
