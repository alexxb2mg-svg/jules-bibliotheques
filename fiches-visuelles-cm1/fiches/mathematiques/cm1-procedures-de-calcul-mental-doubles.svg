<text x="390.0" y="110.0" font-size="22" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">140</text>
<line x1="276.0" y1="110.0" x2="344.0" y2="110.0" stroke="#1D4E89" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="310.0" y="94.0" font-size="15" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">× 2</text>
<rect x="517.0" y="88.0" width="86.0" height="44.0" rx="10" fill="#FDEBDD" stroke="#D9480F" stroke-width="2"/>
<text x="560.0" y="110.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">280</text>
<line x1="436.0" y1="110.0" x2="514.0" y2="110.0" stroke="#1D4E89" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="475.0" y="94.0" font-size="15" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">× 2</text>
<path d="M70.0 78.0 Q70.0 69.0 80.0 69.0 L220.0 69.0 Q230.0 69.0 230.0 60.0 Q230.0 69.0 240.0 69.0 L380.0 69.0 Q390.0 69.0 390.0 78.0" fill="none" stroke="#1D4E89" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="230.0" y="48.0" font-size="15" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">4 × 35 = 140 : 2 doubles</text>
<path d="M70.0 140.0 Q70.0 149.0 80.0 149.0 L305.0 149.0 Q315.0 149.0 315.0 158.0 Q315.0 149.0 325.0 149.0 L550.0 149.0 Q560.0 149.0 560.0 140.0" fill="none" stroke="#D9480F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="315.0" y="174.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">8 × 35 = 280 : 3 doubles</text>
<text x="20.0" y="212.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">× 5 : on fait × 10, puis on prend la moitié</text>
<rect x="27.0" y="240.0" width="86.0" height="44.0" rx="10" fill="#ffffff" stroke="#1a1a18" stroke-width="2"/>
<text x="70.0" y="262.0" font-size="22" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">46</text>
