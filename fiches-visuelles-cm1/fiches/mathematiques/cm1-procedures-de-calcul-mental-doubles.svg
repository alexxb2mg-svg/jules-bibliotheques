<text x="430.0" y="262.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">230</text>
<text class="t" x="490.0" y="262.0" text-anchor="start" dominant-baseline="central">5 × 46 = 230</text>
<text class="ts" x="490.0" y="282.0" text-anchor="start" dominant-baseline="central">car 5, c'est la moitié de 10</text>
<text x="20.0" y="330.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">× 300 : on fait × 3, puis × 100</text>
