<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg"><title>Doubler, prendre la moitié, passer par 10 ou par 100</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="20.0" y="24.0" font-size="18" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">× 4 et × 8 : on double, on double encore</text>
<rect x="27.0" y="88.0" width="86.0" height="44.0" rx="10" fill="#ffffff" stroke="#1a1a18" stroke-width="2"/>
