<text x="160.0" y="364.0" font-size="15" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">× 3</text>
<rect x="207.0" y="358.0" width="86.0" height="44.0" rx="10" fill="#E6F1FB" stroke="#1D4E89" stroke-width="2"/>
<text x="250.0" y="380.0" font-size="22" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">21</text>
<line x1="296.0" y1="380.0" x2="384.0" y2="380.0" stroke="#1D4E89" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="340.0" y="364.0" font-size="15" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">× 100</text>
<rect x="382.0" y="358.0" width="96.0" height="44.0" rx="10" fill="#FDEBDD" stroke="#D9480F" stroke-width="2"/>
<text x="430.0" y="380.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">2 100</text>
<text class="t" x="490.0" y="380.0" text-anchor="start" dominant-baseline="central">7 × 300 = 2 100</text>
<text class="ts" x="490.0" y="400.0" text-anchor="start" dominant-baseline="central">car 300 = 3 × 100</text>
</svg>
