<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg"><title>Tourner à droite : la droite du robot n'est pas toujours la tienne</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="170.0" y="24.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Le robot regarde vers le haut</text>
<g class="c-coral"><text class="t" x="170.0" y="48.0" text-anchor="middle" dominant-baseline="central">instruction : « tourner à droite »</text></g>
<g transform="rotate(0 170 140)"><rect x="150.0" y="120.0" width="40" height="40" rx="9" fill="none" stroke="#5F5E5A" stroke-width="2.2" stroke-dasharray="4 3"/><polygon points="162,121.0 178,121.0 170,110.0" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="1"/></g>
<g transform="rotate(90 170 140)"><rect x="150.0" y="120.0" width="40" height="40" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="2.2"/><polygon points="162,121.0 178,121.0 170,110.0" fill="#534AB7" stroke="#534AB7" stroke-width="1"/><circle cx="162" cy="131.0" r="4" fill="#534AB7"/><circle cx="178" cy="131.0" r="4" fill="#534AB7"/></g>
<path d="M170 82 A58 58 0 0 1 227.1 130.1" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<line x1="244.0" y1="140.0" x2="320.0" y2="140.0" stroke="#185FA5" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#fl)"/>
<g class="c-blue"><text class="th" x="170.0" y="232.0" text-anchor="middle" dominant-baseline="central">il part vers la droite de l'écran</text></g>
<line x1="340.0" y1="20.0" x2="340.0" y2="245.0" stroke="#e0ded6" stroke-width="1" stroke-linecap="butt"/>
<text x="510.0" y="24.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Le robot regarde vers le bas</text>
<g class="c-coral"><text class="t" x="510.0" y="48.0" text-anchor="middle" dominant-baseline="central">instruction : « tourner à droite »</text></g>
<g transform="rotate(180 510 140)"><rect x="490.0" y="120.0" width="40" height="40" rx="9" fill="none" stroke="#5F5E5A" stroke-width="2.2" stroke-dasharray="4 3"/><polygon points="502,121.0 518,121.0 510,110.0" fill="#5F5E5A" stroke="#5F5E5A" stroke-width="1"/></g>
<g transform="rotate(270 510 140)"><rect x="490.0" y="120.0" width="40" height="40" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="2.2"/><polygon points="502,121.0 518,121.0 510,110.0" fill="#534AB7" stroke="#534AB7" stroke-width="1"/><circle cx="502" cy="131.0" r="4" fill="#534AB7"/><circle cx="518" cy="131.0" r="4" fill="#534AB7"/></g>
<path d="M510 198 A58 58 0 0 1 452.9 149.9" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<line x1="436.0" y1="140.0" x2="360.0" y2="140.0" stroke="#185FA5" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#fl)"/>
<g class="c-blue"><text class="th" x="510.0" y="232.0" text-anchor="middle" dominant-baseline="central">il part vers la GAUCHE de l'écran</text></g>
<text class="t" x="340.0" y="270.0" text-anchor="middle" dominant-baseline="central">Triangle gris : où regardait le robot avant. Il tourne toujours vers SA droite à lui.</text>
