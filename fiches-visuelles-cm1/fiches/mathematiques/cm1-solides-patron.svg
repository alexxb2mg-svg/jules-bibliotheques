<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg"><title>Un patron du cube, et un assemblage de 6 carrés qui n'en est pas un</title>
<text class="tl" x="185.0" y="24.0" text-anchor="middle" dominant-baseline="central">Un patron du cube</text>
<rect x="78.0" y="70.0" width="58.0" height="58.0" rx="0" fill="#FAEEDA" stroke="#854F0B" stroke-width="2"/>
<rect x="20.0" y="128.0" width="58.0" height="58.0" rx="0" fill="#CFE2F6" stroke="#185FA5" stroke-width="2"/>
