<rect x="194.0" y="128.0" width="58.0" height="58.0" rx="0" fill="none" stroke="#1a1a18" stroke-width="2"/>
<rect x="78.0" y="186.0" width="58.0" height="58.0" rx="0" fill="none" stroke="#1a1a18" stroke-width="2"/>
<g class="c-amber"><text class="tl" x="107.0" y="99.0" text-anchor="middle" dominant-baseline="central">1</text></g>
<g class="c-amber"><text class="tl" x="107.0" y="215.0" text-anchor="middle" dominant-baseline="central">1</text></g>
<g class="c-blue"><text class="tl" x="49.0" y="157.0" text-anchor="middle" dominant-baseline="central">2</text></g>
<g class="c-blue"><text class="tl" x="165.0" y="157.0" text-anchor="middle" dominant-baseline="central">2</text></g>
<g class="c-green"><text class="tl" x="107.0" y="157.0" text-anchor="middle" dominant-baseline="central">3</text></g>
<g class="c-green"><text class="tl" x="223.0" y="157.0" text-anchor="middle" dominant-baseline="central">3</text></g>
<text class="t" x="185.0" y="262.0" text-anchor="middle" dominant-baseline="central">6 carrés de même taille.</text>
<text class="t" x="185.0" y="284.0" text-anchor="middle" dominant-baseline="central">Une fois plié, les 2 carrés de même</text>
<text class="t" x="185.0" y="304.0" text-anchor="middle" dominant-baseline="central">couleur et même numéro sont face à face.</text>
<g class="c-green"><text class="tl" x="185.0" y="334.0" text-anchor="middle" dominant-baseline="central">Oui, c'est un patron du cube</text></g>
<line x1="372.0" y1="20.0" x2="372.0" y2="350.0" stroke="#d6d4cc" stroke-width="1" stroke-linecap="butt"/>
<text class="tl" x="525.0" y="24.0" text-anchor="middle" dominant-baseline="central">Pas un patron du cube</text>
<rect x="440.0" y="100.0" width="58.0" height="58.0" rx="0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/>
<rect x="440.0" y="158.0" width="58.0" height="58.0" rx="0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/>
<rect x="498.0" y="100.0" width="58.0" height="58.0" rx="0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/>
<rect x="498.0" y="158.0" width="58.0" height="58.0" rx="0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/>
<rect x="556.0" y="100.0" width="58.0" height="58.0" rx="0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/>
<rect x="556.0" y="158.0" width="58.0" height="58.0" rx="0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/>
<text class="t" x="525.0" y="262.0" text-anchor="middle" dominant-baseline="central">6 carrés aussi, mais en pliant,</text>
<text class="t" x="525.0" y="284.0" text-anchor="middle" dominant-baseline="central">deux faces se superposent</text>
<text class="t" x="525.0" y="304.0" text-anchor="middle" dominant-baseline="central">et il reste un trou.</text>
<g class="c-red"><text class="tl" x="525.0" y="334.0" text-anchor="middle" dominant-baseline="central">Non, ce n'est pas un patron</text></g>
<text class="ts" x="340.0" y="378.0" text-anchor="middle" dominant-baseline="central">Pour vérifier : découpe et plie, ou plie dans ta tête carré par carré.</text>
</svg>
