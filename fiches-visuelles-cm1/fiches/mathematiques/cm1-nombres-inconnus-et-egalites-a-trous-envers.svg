<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg"><title>Retrouver le nombre de départ : défaire les opérations à l'envers</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340.0" y="22.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Inès choisit un nombre, ajoute 5, puis multiplie par 4. Elle trouve 48.</text>
<text x="20.0" y="62.0" font-size="15" fill="#2B8A3E" font-weight="700" text-anchor="start" dominant-baseline="central">Inès calcule dans ce sens :</text>
<rect x="50.0" y="84.0" width="80.0" height="52.0" rx="10" fill="#FDEBDD" stroke="#D9480F" stroke-width="2.2"/>
<text x="90.0" y="110.0" font-size="24" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">?</text>
<rect x="300.0" y="84.0" width="80.0" height="52.0" rx="10" fill="#ffffff" stroke="#1a1a18" stroke-width="2.2"/>
<text x="340.0" y="110.0" font-size="24" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">12</text>
<rect x="550.0" y="84.0" width="80.0" height="52.0" rx="10" fill="#E6F1FB" stroke="#1D4E89" stroke-width="2.2"/>
<text x="590.0" y="110.0" font-size="24" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">48</text>
<line x1="134.0" y1="110.0" x2="294.0" y2="110.0" stroke="#2B8A3E" stroke-width="2.6" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="215.0" y="90.0" font-size="22" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">+ 5</text>
<line x1="384.0" y1="110.0" x2="544.0" y2="110.0" stroke="#2B8A3E" stroke-width="2.6" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="465.0" y="90.0" font-size="22" fill="#2B8A3E" font-weight="700" text-anchor="middle" dominant-baseline="central">× 4</text>
<line x1="590.0" y1="140.0" x2="590.0" y2="220.0" stroke="#8a8880" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="20.0" y="196.0" font-size="15" fill="#D9480F" font-weight="700" text-anchor="start" dominant-baseline="central">Toi, tu remontes à l'envers :</text>
<rect x="50.0" y="224.0" width="80.0" height="52.0" rx="10" fill="#FDEBDD" stroke="#D9480F" stroke-width="2.2"/>
<text x="90.0" y="250.0" font-size="24" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">7</text>
<rect x="300.0" y="224.0" width="80.0" height="52.0" rx="10" fill="#ffffff" stroke="#1a1a18" stroke-width="2.2"/>
<text x="340.0" y="250.0" font-size="24" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">12</text>
<rect x="550.0" y="224.0" width="80.0" height="52.0" rx="10" fill="#E6F1FB" stroke="#1D4E89" stroke-width="2.2"/>
<text x="590.0" y="250.0" font-size="24" fill="#1D4E89" font-weight="700" text-anchor="middle" dominant-baseline="central">48</text>
<line x1="546.0" y1="250.0" x2="386.0" y2="250.0" stroke="#D9480F" stroke-width="2.6" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="465.0" y="230.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">÷ 4</text>
<text x="465.0" y="272.0" font-size="14" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">d'abord</text>
<line x1="296.0" y1="250.0" x2="136.0" y2="250.0" stroke="#D9480F" stroke-width="2.6" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="215.0" y="230.0" font-size="22" fill="#D9480F" font-weight="700" text-anchor="middle" dominant-baseline="central">− 5</text>
<text x="215.0" y="272.0" font-size="14" fill="#D9480F" font-weight="600" text-anchor="middle" dominant-baseline="central">ensuite</text>
<path d="M142.0 336.0 L148.0 342.0 L159.0 329.0" fill="none" stroke="#2B8A3E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="170.0" y="334.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18">Vérification : 7 + 5 = 12, puis 12 × 4 = 48. Le nombre d'Inès est </tspan><tspan fill="#D9480F">7</tspan><tspan fill="#1a1a18">.</tspan></text>
</svg>
