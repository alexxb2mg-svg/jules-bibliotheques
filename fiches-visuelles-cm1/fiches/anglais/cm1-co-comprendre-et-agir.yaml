notion: cm1-co-comprendre-et-agir
titre: "Comprendre une consigne en anglais et faire ce qu'elle demande"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 5", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: consigne
    type: formule
    expression: "[Open] your [book]. → d'abord l'action, puis l'objet"
    termes:
      Open: {couleur: bleu, legende: "le **verbe à l'impératif**, en premier : il dit ce que tu dois faire tout de suite (ouvre)"}
      book: {couleur: orange, legende: "l'objet de l'action : ton livre. Avec your (ton), la consigne te parle à toi"}
    jules: "En anglais, une consigne commence presque toujours par le **verbe** : Stand up, Listen, Open. Attrape le premier mot, et tu sais déjà quoi faire."

  - id: carte
    type: carte
    noeuds:
      - {id: agir, titre: "Comprendre et agir", sous_titre: "j'écoute la consigne, je fais le geste", principal: true}
      - {id: imperatif, titre: "Le verbe en premier", sous_titre: "Listen! Jump! Add the milk!"}
      - {id: dont, titre: "Don't... = ne... pas", sous_titre: "Don't run! Ne cours pas !"}
      - {id: lieu, titre: "Les mots de lieu", sous_titre: "in dans, on sur, under sous, next to à côté de"}
      - {id: can, titre: "can ou can't", sous_titre: "j'ai le droit, ou c'est interdit"}
    liens:
      - {de: agir, vers: imperatif}
      - {de: agir, vers: dont}
      - {de: agir, vers: lieu}
      - {de: agir, vers: can}
    jules: "Tu n'as pas besoin de traduire la consigne en français : si tu te lèves quand on dit « Stand up! », c'est que tu as compris. Ton geste est la preuve."

  - id: schema-consignes
    type: schema
    titre: "Six consignes de classe, et le geste qui va avec"
    svg: "cm1-co-comprendre-et-agir.svg"
    jules: "Ta maîtresse fait souvent le geste en même temps qu'elle parle : le bras qui monte pour « Stand up », le doigt sur la bouche pour « Don't talk ». Regarde ses mains, elles traduisent pour toi."

  - id: schema-lieu
    type: schema
    titre: "Où ? Les petits mots de lieu avec un chat, et can ou can't"
    svg: "cm1-co-comprendre-et-agir-ou.svg"
    jules: "Attention à **on** et **in** : on, c'est dessus (on the box), in, c'est dedans (in the box). Un seul petit mot, et le chat change de place."

  - id: graphe-lieu
    type: graphe
    gabarit: position-objet
    curseurs:
      - {id: curseur-place, nom: place, min: -1, max: 1, pas: 1, depart: 0}
      - {id: curseur-hauteur, nom: hauteur, min: -1, max: 1, pas: 1, depart: 1}
    lectures:
      - {si: "place == 0 && hauteur == 0", texte: "The cat is **in** the box : le chat est dans la boîte."}
      - {si: "place == 0 && hauteur > 0", texte: "The cat is **on** the box : le chat est sur la boîte."}
      - {si: "place == 0 && hauteur < 0", texte: "The cat is **under** the box : le chat est sous la boîte."}
      - {si: "place != 0", texte: "The cat is **next to** the box : le chat est à côté de la boîte."}
    jules: "Avant de lire la phrase, dis toi-même où est le chat, en anglais. Place 0 met le chat au niveau de la boîte, puis hauteur le fait passer dessous, dedans ou dessus ; place -1 ou 1 le met à côté."

  - id: methode
    type: methode
    etapes:
      - "Je repère le **verbe** au début : c'est l'action (Open, Sit, Jump, Put)."
      - "Je cherche s'il y a **Don't** devant : alors c'est le contraire, je ne dois pas le faire."
      - "Je repère le **mot de lieu** (in, on, under, next to) pour savoir où agir."
      - "J'écoute si j'entends can (permis) ou can't (interdit)."
      - "Si j'hésite, je regarde le geste ou l'image, puis je fais l'action et je vérifie avec les autres."
    jules: "Regarder ce que font les autres élèves, c'est permis pour vérifier. Mais essaie d'abord seul : ton oreille progresse à chaque consigne comprise."

  - id: piege
    type: piege
    mauvaise_idee: "« You can't run in the classroom. » J'ai entendu can et run : j'ai le droit de courir dans la classe."
    pourquoi_faux: "**can't** n'est pas can ! can /kæn/ veut dire « peut », can't /kɑːnt/ veut dire « ne peut pas ». Can't est plus long, avec un a long, et finit par un t."
    bonne_idee: "You can't run in the classroom : tu **n'as pas le droit** de courir dans la classe. You can play in the playground : tu peux jouer dans la cour."
    jules: "Écoute la fin du mot : si tu entends un t, c'est can't, donc c'est interdit. Et regarde le visage : un non de la tête accompagne souvent can't."

  - id: exemple-simon
    type: exemple
    situation: "En sport, la classe joue à « Simon says » (Jacques a dit). Règle : on fait l'action seulement si on entend Simon says avant. Le maître dit : « Simon says: touch your nose! » puis « Jump! »."
    calcul: "Simon says: touch your nose! Il y a Simon says, et touch (touche) + nose (nez) : je touche mon nez. Jump! Pas de Simon says : je ne saute pas, je reste immobile."
    conclusion: "Julia touche son nez, puis **ne bouge pas** au mot Jump : elle a compris les deux consignes, et elle reste dans le jeu."
    jules: "Ce jeu entraîne exactement ce qu'il faut : comprendre vite le verbe et agir. Les parties du corps (nose, ears, head, feet) y reviennent tout le temps."

  - id: exemple-recette
    type: exemple
    situation: "En classe, on fait des pancakes (des crêpes épaisses) avec une recette en anglais : « Take two eggs. Add the milk. Mix! Don't eat the batter! »"
    calcul: "Take (prends) two eggs (deux œufs). Add (ajoute) the milk (le lait). Mix (mélange). Don't eat (ne mange pas) the batter (la pâte)."
    conclusion: "Chaque étape commence par un **verbe d'action** : Nino prend 2 œufs, ajoute le lait, mélange, et ne goûte pas la pâte crue."
    jules: "Dans une recette, les verbes s'enchaînent comme des étapes de méthode. Si tu connais take, add et mix, tu sais déjà suivre beaucoup de recettes."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "À la maison, joue à Simon says avec ta famille en anglais : c'est toi qui donnes les consignes, et les autres doivent obéir... ou pas !"
