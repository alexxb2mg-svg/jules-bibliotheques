<text x="546.0" y="215.0" font-size="13" fill="#C2410C" font-weight="700" text-anchor="end" dominant-baseline="central">Non ? « Sorry, can you repeat, please? »</text>
<line x1="458.0" y1="325.0" x2="442.0" y2="325.0" stroke="#5F5E5A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fl)"/>
