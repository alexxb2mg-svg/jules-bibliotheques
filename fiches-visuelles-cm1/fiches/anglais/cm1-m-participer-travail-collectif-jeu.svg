<text x="340.0" y="432.0" font-size="13.5" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Bleu : organiser.  Violet : vérifier qu'on a compris.  Orange : le temps.  Vert : encourager.</text>
<text x="340.0" y="452.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">(« Pardon, tu peux répéter, s'il te plaît ? » : si on n'a pas compris, on le dit.)</text>
