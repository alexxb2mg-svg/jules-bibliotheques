notion: cm1-eoc-se-presenter-exprimer-gouts
titre: "Me présenter et présenter un copain : My name's Léa, His name is Tom"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 12", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "I'm": "I am : je suis (I'm 9 years old : j'ai 9 ans)"
  "name's": "name is : mon nom est (My name's Léa : je m'appelle Léa)"
  "don't": "do not : ne... pas (I don't like : je n'aime pas)"
  "doesn't": "does not : ne... pas, avec he ou she (He doesn't like : il n'aime pas)"
blocs:
  - id: formule
    type: formule
    expression: "[I] like cats.  →  [She] like[s] cats."
    termes:
      I: {couleur: bleu, legende: "**je** : tu parles de toi. Le verbe reste tout simple : I like, I live, I play."}
      She: {couleur: orange, legende: "**elle** (he : il) : tu présentes quelqu'un d'autre, un copain, ta sœur, ton chat."}
      s: {couleur: orange, legende: "le **-s** qu'on ajoute au verbe après he, she ou un prénom : she likes, Tom plays, he lives."}
    jules: "Pour ne pas oublier le -s, pense à un serpent qui siffle derrière he et she : « he likesss ». Avec I et you, le serpent dort : pas de -s."

  - id: carte
    type: carte
    noeuds:
      - {id: moi, titre: "Me présenter en anglais", sous_titre: "3 ou 4 phrases courtes, apprises et répétées", principal: true}
      - {id: nom, titre: "Mon nom, mon âge, ma ville", sous_titre: "My name's Léa. I'm 9 years old. I live in Poitiers."}
      - {id: famille, titre: "Ma famille, mes animaux", sous_titre: "I have a brother and a cat."}
      - {id: gouts, titre: "Ce que j'aime ou pas", sous_titre: "I like pizza. I don't like spinach."}
      - {id: copain, titre: "Présenter un copain", sous_titre: "I devient he ou she : His name is Tom. He likes football."}
    liens:
      - {de: moi, vers: nom}
      - {de: moi, vers: famille}
      - {de: moi, vers: gouts}
      - {de: moi, vers: copain}
    jules: "Pour ton âge, l'anglais ne dit pas « j'ai » mais « je suis » : **I'm 9** (years old), jamais « I have 9 years ». Years se prononce /jɪəz/, avec le son y du début de yes."

  - id: schema-carte-identite
    type: schema
    titre: "La carte d'identité de Léa : ce qu'elle dit pour se présenter"
    svg: "cm1-eoc-se-presenter-exprimer-gouts.svg"
    jules: "Chaque ligne de la carte donne une phrase : tu peux fabriquer ta propre carte, puis la lire à voix haute. Le pouce levé, c'est **I like** ; le pouce baissé, c'est **I don't like**."

  - id: schema-copain
    type: schema
    titre: "Tom se présente, puis Léa présente Tom : ce qui change"
    svg: "cm1-eoc-se-presenter-exprimer-gouts-copain.svg"
    jules: "Trois changements seulement : I devient he, my devient his (pour un garçon) ou her (pour une fille), et le verbe prend un -s. Les autres mots ne bougent pas."

  - id: methode
    type: methode
    etapes:
      - "Choisis 4 informations : ton **nom**, ton âge, ta ville, et ce que tu aimes."
      - "Fais une phrase courte pour chacune : My name's…, I'm… years old, I live in…, I like…"
      - "Pour un copain, remplace I par **he** (un garçon) ou **she** (une fille), my par his ou her, et ajoute le -s au verbe."
      - "Ajoute un détail qui te ressemble : un animal (I have a rabbit), un sport (I play basketball)."
      - "Répète à voix haute trois fois, devant un miroir ou pour ta famille, avant de parler devant la classe."
    jules: "Commence par « Hello » et termine par « Thank you », comme une vraie petite présentation. Sourire et regarder la classe, ça aide aussi à être compris."

  - id: piege
    type: piege
    mauvaise_idee: "Tom plays football, alors je dis : « He play football. »"
    pourquoi_faux: "Avec he, she ou un prénom, le verbe au présent prend un **-s** à la fin. Sans lui, on croit que tu parles de toi ou de plusieurs personnes."
    bonne_idee: "He plays football. She likes cats. Tom lives in Lyon. Mais I play, I like, I live : jamais de -s après I."
    jules: "Attention à deux verbes spéciaux : I have devient **he has**, et I go devient **he goes** /gəʊz/, avec -es."

  - id: exemple-ines
    type: exemple
    situation: "Inès a 9 ans et habite à Marseille. Elle a une sœur et un chien. Elle adore nager, mais elle n'aime pas les carottes. Elle se présente à la classe."
    calcul: "Hello! My name's Inès. I'm 9 years old. I live in Marseille. I have a sister and a dog. I like swimming. I don't like carrots. Thank you!"
    conclusion: "Six phrases très courtes, toutes avec **I** et un verbe sans -s. Traduction : Je m'appelle Inès. J'ai 9 ans. J'habite à Marseille. J'ai une sœur et un chien. J'aime nager. Je n'aime pas les carottes."
    jules: "Pour dire ce que tu aimes faire, on ajoute -ing au verbe : swim (nager) donne **I like swimming**, play donne I like playing."

  - id: exemple-paul
    type: exemple
    situation: "Présente ton camarade Paul. Il a 10 ans, il habite à Bordeaux, il a un hamster et il aime le basket."
    calcul: "This is my friend Paul. His name is Paul. He is 10 years old. He lives in Bordeaux. He has a hamster. He likes basketball."
    conclusion: "On dit **he** car Paul est un garçon, et **his name** (son nom à lui). Chaque verbe prend son -s : lives, has, likes."
    jules: "This is my friend veut dire « voici mon copain » : c'est la phrase parfaite pour commencer. Pour une fille, on dit This is my friend Lina, puis Her name is Lina et She likes…"

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : présente ton animal ou ton doudou comme un copain, avec he ou she et le -s. Pour un lapin, cela donne « This is Pistache, he likes carrots » (voici Pistache, il aime les carottes)."
