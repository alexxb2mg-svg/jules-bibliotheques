<text x="334.0" y="139.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Son nom est Tom.</text>
<rect x="14.0" y="156.0" width="652.0" height="56.0" rx="8" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="30.0" y="178.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">I</tspan><tspan font-weight="700"> am 10 years old.</tspan></text>
<line x1="266.0" y1="178.0" x2="318.0" y2="178.0" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="334.0" y="178.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#C2410C" font-weight="700">He</tspan><tspan fill="#C2410C" font-weight="700"> is</tspan><tspan font-weight="700"> 10 years old.</tspan></text>
<text x="334.0" y="199.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Il a 10 ans.</text>
<rect x="14.0" y="216.0" width="652.0" height="56.0" rx="8" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="30.0" y="238.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">I</tspan><tspan font-weight="700"> live in Lyon.</tspan></text>
<line x1="266.0" y1="238.0" x2="318.0" y2="238.0" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="334.0" y="238.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#C2410C" font-weight="700">He</tspan><tspan font-weight="700"> live</tspan><tspan fill="#C2410C" font-weight="700">s</tspan><tspan font-weight="700"> in Lyon.</tspan></text>
<text x="334.0" y="259.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Il habite à Lyon.</text>
<rect x="14.0" y="276.0" width="652.0" height="56.0" rx="8" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="30.0" y="298.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">I</tspan><tspan font-weight="700"> like football.</tspan></text>
<line x1="266.0" y1="298.0" x2="318.0" y2="298.0" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="334.0" y="298.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#C2410C" font-weight="700">He</tspan><tspan font-weight="700"> like</tspan><tspan fill="#C2410C" font-weight="700">s</tspan><tspan font-weight="700"> football.</tspan></text>
<text x="334.0" y="319.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Il aime le foot.</text>
<rect x="14.0" y="336.0" width="652.0" height="56.0" rx="8" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="30.0" y="358.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">I</tspan><tspan fill="#185FA5" font-weight="700"> don't</tspan><tspan font-weight="700"> like rain.</tspan></text>
<line x1="266.0" y1="358.0" x2="318.0" y2="358.0" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="334.0" y="358.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#C2410C" font-weight="700">He</tspan><tspan fill="#C2410C" font-weight="700"> doesn't</tspan><tspan font-weight="700"> like rain.</tspan></text>
<text x="334.0" y="379.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Il n'aime pas la pluie.</text>
<text x="340.0" y="424.0" font-size="14" fill="#C2410C" font-weight="600" text-anchor="middle" dominant-baseline="central">Orange : ce qui change quand tu parles de quelqu'un d'autre.</text>
<text x="340.0" y="443.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Pour une fille : She, Her name is…  (she likes, she lives).</text>
