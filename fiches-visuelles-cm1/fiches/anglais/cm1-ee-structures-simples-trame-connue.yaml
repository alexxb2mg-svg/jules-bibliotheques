notion: cm1-ee-structures-simples-trame-connue
titre: "Écrire en anglais sur une trame connue : je garde le modèle, je change mes informations"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 24", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "I'm": "I am : je suis (I'm in London : je suis à Londres)"
  "It's": "it is : c'est, ou il fait (It's cold : il fait froid)"
blocs:
  - id: trame
    type: formule
    expression: "[Dear] [Mum], I'm in [Edinburgh]. It's [cold]. [Love], Inès"
    termes:
      Dear: {couleur: bleu, legende: "**Cher**, **Chère** : le début de la lettre. Il fait partie de la trame : on le garde toujours."}
      Mum: {couleur: vert, legende: "à qui tu écris : Mum (maman), Dad (papa), Grandma (mamie), ou un prénom. Tu le changes."}
      Edinburgh: {couleur: vert, legende: "où tu es : Édimbourg, en Écosse. Tu mets ta ville à toi : I'm in Nice, I'm in Lille."}
      cold: {couleur: vert, legende: "le temps qu'il fait : cold (froid), hot (chaud), sunny (ensoleillé), rainy (pluvieux)."}
      Love: {couleur: bleu, legende: "**la fin** : Love, (bisous, affectueusement), puis ton prénom sur la ligne suivante. On le garde."}
    jules: "Une trame, c'est comme un coloriage : les traits sont déjà dessinés, toi tu choisis les couleurs. Les mots en bleu restent, les mots en vert sont à toi."

  - id: carte
    type: carte
    noeuds:
      - {id: trame, titre: "Écrire sur une trame", sous_titre: "je reprends un modèle vu en classe et j'y mets mes informations", principal: true}
      - {id: carte-postale, titre: "La carte postale", sous_titre: "Dear… I'm in… It's… Love,…"}
      - {id: message, titre: "Le petit message", sous_titre: "Hi Sam! Happy birthday! See you soon."}
      - {id: devinette, titre: "La devinette", sous_titre: "She is a girl. She has got black hair. Who is it?"}
      - {id: lieu, titre: "Décrire un lieu", sous_titre: "This is my bedroom. It is small."}
    liens:
      - {de: trame, vers: carte-postale}
      - {de: trame, vers: message}
      - {de: trame, vers: devinette}
      - {de: trame, vers: lieu}
    jules: "Tu n'inventes pas tout : tu t'appuies sur des phrases que tu connais déjà. C'est comme ça que les enfants anglais apprennent aussi à écrire leurs premières cartes."

  - id: schema-carte-postale
    type: schema
    titre: "Le modèle à trous de la classe, puis la carte postale écrite par Inès"
    svg: "cm1-ee-structures-simples-trame-connue.svg"
    jules: "Inès a gardé les 5 morceaux de la trame et changé 5 mots, un dans chaque trou. Sa carte a le même squelette que le modèle, mais elle raconte **son** voyage."

  - id: schema-devinette
    type: schema
    titre: "Une devinette sur la même trame : He is… He has got… Who is it?"
    svg: "cm1-ee-structures-simples-trame-connue-devinette.svg"
    jules: "Pour une fille, He devient **She**. Le reste de la trame ne bouge pas : she is, she has got, Who is it?"

  - id: methode
    type: methode
    etapes:
      - "Relis le **modèle** vu en classe et repère les morceaux qui reviennent : Dear…, I'm in…, It's…, Love,…"
      - "Souligne dans le modèle les mots que tu vas changer : le prénom, la ville, le temps, ce que tu aimes."
      - "Recopie la trame en mettant **tes informations** à la place. Cherche l'orthographe des mots dans ton cahier."
      - "Vérifie que rien ne manque : le début (Dear…), le milieu, la fin (Love, et ton prénom)."
      - "Relis chaque mot anglais lettre par lettre, en le comparant à ton cahier."
    jules: "Si un mot te manque, cherche-le dans ton cahier ou dans le dictionnaire illustré de la classe. Garde des phrases courtes : une idée, une phrase."

  - id: piege
    type: piege
    mauvaise_idee: "En vacances à Nice, Hugo recopie le modèle tel quel : « Dear Grandma, I'm in London. It's sunny. Love, Léo »."
    pourquoi_faux: "Hugo n'est pas à Londres et il ne s'appelle pas Léo ! La trame sert à porter **ses informations à lui**. Si on ne change rien, le message est faux."
    bonne_idee: "Dear Grandma, I'm in Nice. It's hot. I like the beach. Love, Hugo. (Chère mamie, je suis à Nice. Il fait chaud. J'aime la plage. Bisous, Hugo.)"
    jules: "L'autre oubli fréquent : la formule du début (Dear…) ou celle de la fin (Love,). Sans elles, ta carte ressemble à une liste, pas à une lettre."

  - id: exemple-anniversaire
    type: exemple
    situation: "Sacha écrit à son copain Sam, qui a 10 ans aujourd'hui. Le modèle de la classe est : « Hi Lily! Happy birthday! You are 9 today. See you soon, Tom »."
    calcul: "Hi Sam! Happy birthday! You are 10 today. See you soon, Sacha"
    conclusion: "Sacha a changé **3 informations** : le prénom de Sam, l'âge (10) et la signature. Traduction : Salut Sam ! Joyeux anniversaire ! Tu as 10 ans aujourd'hui. À bientôt, Sacha."
    jules: "Happy birthday se dit /ˈhæpi ˈbɜːθdeɪ/ : le th se fait avec la langue entre les dents. See you soon, c'est « à bientôt »."

  - id: exemple-lieu
    type: exemple
    situation: "Le modèle décrit une chambre : « This is my bedroom. It is small. There is a bed and a desk. I like my bedroom. » Nour s'en sert pour décrire sa classe."
    calcul: "This is my classroom. It is big. There are 24 desks and a board. I like my classroom."
    conclusion: "Voici ma classe. Elle est grande. Il y a 24 tables et un tableau. J'aime ma classe. Nour a gardé la trame, et a écrit **There are** car il y a plusieurs tables."
    jules: "There is pour une seule chose (There is a bed : il y a un lit), **There are** pour plusieurs (There are 24 desks : il y a 24 tables)."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : écris une carte postale depuis le lieu de tes rêves, avec la trame Dear…, I'm in…, It's…, I like…, Love,. Tu peux la dessiner au dos, comme une vraie carte."
