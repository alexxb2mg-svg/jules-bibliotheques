<text x="586.0" y="126.0" font-size="16" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">Well done, Ali!</text>
<text x="586.0" y="150.0" font-size="12.5" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Bravo, Ali !</text>
<text x="340.0" y="400.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Vert : partager le matériel.  Bleu : le tour de parole.  Orange : encourager.</text>
<text x="340.0" y="424.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Dans un groupe, chacun a sa phrase : personne ne reste sans rien dire.</text>
