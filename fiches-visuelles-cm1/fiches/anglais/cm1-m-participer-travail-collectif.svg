<text x="94.0" y="76.0" font-size="16" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">Can I have the</text>
<text x="94.0" y="98.0" font-size="16" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">glue, please?</text>
<text x="94.0" y="124.0" font-size="12.5" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">Je peux avoir la colle ?</text>
