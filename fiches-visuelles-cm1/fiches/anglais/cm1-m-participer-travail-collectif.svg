<text x="428.0" y="76.0" font-size="16" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">It's my turn!</text>
<text x="428.0" y="100.0" font-size="12.5" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">C'est mon tour !</text>
