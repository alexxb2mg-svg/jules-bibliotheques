notion: cm1-m-expliciter-message-pour-autrui
titre: "Aider quelqu'un à comprendre : dire son besoin, montrer une information, redire une consigne"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 29", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "I'm": "I am : je suis (I'm cold : j'ai froid)"
  "He's": "he is : il est (He's hungry : il a faim)"
  "She's": "she is : elle est (She's thirsty : elle a soif)"
  pm: "post meridiem (en latin : après midi). 3 pm = 15 h"
blocs:
  - id: phrase
    type: formule
    expression: "[She's] [thirsty]. [Look!] The water is [there]."
    termes:
      "She's": {couleur: violet, legende: "**elle est** : tu parles pour quelqu'un d'autre. Pour un garçon : He's (il est)."}
      thirsty: {couleur: bleu, legende: "**le besoin** : thirsty (soif), hungry (faim), cold (froid), hot (chaud), tired (fatigué), scared (peur)."}
      "Look!": {couleur: vert, legende: "**Regarde !** Un verbe pour attirer l'attention. Pour un son : Listen! (Écoute !)"}
      there: {couleur: orange, legende: "**là-bas**, un peu loin : tu tends le bras. Tout près, on dit here (ici)."}
    jules: "En anglais, on ne dit pas « elle a soif » mais « elle **est** assoiffée » : She's thirsty. C'est le verbe be (être), jamais have (avoir)."

  - id: carte
    type: carte
    noeuds:
      - {id: aider, titre: "Aider quelqu'un à comprendre", sous_titre: "je transmets un besoin ou une information, avec des mots et des gestes", principal: true}
      - {id: besoin, titre: "Dire le besoin d'un autre", sous_titre: "He's hungry. She's cold."}
      - {id: affiche, titre: "Montrer une information", sous_titre: "Look! The show is at 3 pm."}
      - {id: situer, titre: "Dire où", sous_titre: "here (ici), there (là-bas)"}
      - {id: consigne, titre: "Redire une consigne", sous_titre: "en français, avec le geste qui va avec"}
    liens:
      - {de: aider, vers: besoin}
      - {de: aider, vers: affiche}
      - {de: aider, vers: situer}
      - {de: aider, vers: consigne}
    jules: "Aider quelqu'un à comprendre en passant d'une langue à l'autre s'appelle la **médiation**. Tu deviens un petit pont entre deux personnes."

  - id: schema-besoins
    type: schema
    titre: "Six besoins, chacun avec son geste et sa phrase"
    svg: "cm1-m-expliciter-message-pour-autrui.svg"
    jules: "Le geste aide autant que le mot : la main sur le ventre pour hungry, le verre à la bouche pour thirsty, les bras croisés qui tremblent pour cold."

  - id: schema-consigne
    type: schema
    titre: "Tim ne comprend pas la consigne : Sarah la redit en français, avec le geste"
    svg: "cm1-m-expliciter-message-pour-autrui-consigne.svg"
    jules: "Sarah ne traduit pas chaque mot : elle redit **l'idée**, et elle la montre. Le geste suffit parfois, même sans parler."

  - id: methode
    type: methode
    etapes:
      - "Repère ce qu'il faut transmettre : un **besoin** (il a faim), une information (l'heure, le lieu), une consigne."
      - "Choisis un mot simple que tu connais : hungry, thirsty, cold, hot, tired, scared."
      - "Ajoute le geste : mime le besoin, pointe l'affiche, dis here (ici) ou there (là-bas) en montrant."
      - "Vérifie que la personne a compris : OK? ou, en français, « Tu as compris ? »"
    jules: "Commence la phrase par He's ou She's quand tu parles pour quelqu'un d'autre, et par I'm quand c'est pour toi."

  - id: piege
    type: piege
    mauvaise_idee: "Au restaurant, Lina a très soif. Paul veut aider et dit au serveur : « She's hungry. »"
    pourquoi_faux: "**Hungry** veut dire avoir faim. La soif, c'est **thirsty**. Le serveur risque d'apporter un sandwich au lieu d'un verre d'eau !"
    bonne_idee: "She's thirsty. Can she have some water, please? (Elle a soif. Est-ce qu'elle peut avoir de l'eau, s'il vous plaît ?)"
    jules: "Astuce : thirsty commence par th, comme « thé », une boisson. Hungry se dit /ˈhʌŋgri/ et thirsty /ˈθɜːsti/."

  - id: exemple-chocolat
    type: exemple
    situation: "À Londres, Adam, le petit frère de Samia, a froid. Il ne parle pas anglais. Samia parle pour lui à la dame du café."
    calcul: "He's cold. Can he have a hot chocolate, please? (Il a froid. Est-ce qu'il peut avoir un chocolat chaud, s'il vous plaît ?)"
    conclusion: "Samia a transmis **le besoin** d'Adam (cold) avec He's, puis une demande polie avec please."
    jules: "Can I have… ? (est-ce que je peux avoir… ?) devient Can he have… ? quand tu demandes pour quelqu'un d'autre."

  - id: exemple-affiche
    type: exemple
    situation: "Au zoo, Samia et sa mamie voient une affiche : « Sea lion show – 3 pm – This way → ». Mamie ne lit pas l'anglais."
    calcul: "Samia pointe l'affiche : « Look! » Puis elle explique : « Regarde, le spectacle des otaries est à 15 h, par là ! » en tendant le bras dans le sens de la flèche."
    conclusion: "Samia a attiré l'attention sur **l'information utile** : quoi (le spectacle des otaries), quand (15 h) et où (par là, avec le geste)."
    jules: "Sea lion veut dire otarie, mot à mot « lion de mer ». This way, c'est « par ici » : suis la flèche."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Jeu à deux : l'un mime un besoin sans parler, l'autre dit la phrase en anglais (He's tired!, She's scared!). Puis on échange les rôles."
