  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: formule
    type: formule
    expression: "Emma  →  [E], [double M], [A]"
    termes:
      E: {couleur: orange, legende: "se dit « i » /iː/, comme dans see : c'est le piège numéro 1, car en français on dirait « e »."}
      double M: {couleur: vert, legende: "deux **lettres pareilles** à la suite : on dit double, puis la lettre (double L, double S, double O)."}
      A: {couleur: bleu, legende: "se dit « éï » /eɪ/, comme dans day. Le I, lui, se dit « aï » /aɪ/."}
    jules: "Petit truc pour E et I : en anglais, ils ont échangé leurs costumes. Le E se déguise en « i », et le I se déguise en « aï »."

  - id: carte
    type: carte
    noeuds:
      - {id: ecrire, titre: "Épeler, copier, écrire sous la dictée", sous_titre: "des mots que je connais déjà", principal: true}
      - {id: epeler, titre: "Épeler", sous_titre: "dire les lettres une par une : H, U, G, O"}
      - {id: pieges, titre: "Les lettres pièges", sous_titre: "A « éï », E « i », I « aï », G « dji », J « djéï », R « âr »"}
      - {id: copier, titre: "Copier", sous_titre: "lettre par lettre, puis comparer avec le modèle"}
      - {id: dictee, titre: "Écrire sous la dictée", sous_titre: "j'écoute, je répète dans ma tête, j'écris"}
    liens:
      - {de: ecrire, vers: epeler}
      - {de: ecrire, vers: pieges}
      - {de: ecrire, vers: copier}
      - {de: ecrire, vers: dictee}
    jules: "En anglais, on épelle très souvent, même entre adultes, car un mot ne s'écrit pas comme il se prononce. How do you spell it veut dire : comment ça s'écrit ?"

  - id: schema-alphabet
    type: schema
    titre: "Les 26 lettres rangées par familles de sons"
    svg: "cm1-ee-epeler-copier-ecrire-sous-dictee.svg"
    jules: "Apprends l'alphabet par familles : B, C, D, E, G, P, T, V finissent toutes par « i ». Et G /dʒiː/ et J /dʒeɪ/ sont deux jumeaux inversés : attention à ne pas les échanger."

  - id: schema-copier
    type: schema
    titre: "Épeler son prénom, puis copier sans oublier de lettre"
    svg: "cm1-ee-epeler-copier-ecrire-sous-dictee-copier.svg"
    jules: "Quand deux lettres pareilles se suivent, on ne les dit pas deux fois : on dit **double**. Emma, c'est E, double M, A ; Anna, c'est A, double N, A."

  - id: methode
    type: methode
    etapes:
      - "Pour copier, lis d'abord le **mot entier** au tableau, et dis-le dans ta tête."
      - "Copie-le **lettre par lettre**, en regardant le modèle souvent, pas seulement une fois au début."
      - "Relis en pointant chaque lettre du modèle, puis la même lettre dans ton cahier."
      - "Sous la dictée, écoute bien chaque lettre ou chaque mot, répète-le dans ta tête, puis écris."
    jules: "Coupe les mots longs en morceaux pour les copier : scis-sors, pen-cil, rul-er. Deux petits morceaux, c'est plus facile à retenir qu'un grand mot."

  - id: piege
    type: piege
    mauvaise_idee: "Au tableau, il y a « a pair of scissors ». Je copie « a pair of sissors »."
    pourquoi_faux: "J'ai **oublié une lettre** : le c. On ne l'entend pas quand on dit le mot, mais il est bien écrit au tableau."
    bonne_idee: "Je compare lettre à lettre avec le modèle : s, c, i, double S, o, r, s. **scissors** a 8 lettres, et mon mot doit en avoir 8 aussi."
    jules: "Autre piège fréquent : confondre b et d, qui sont comme des reflets dans un miroir. Pense au mot bed (lit) : écrit en minuscules, il ressemble à un lit, avec le b et le d comme montants, leurs grands traits à l'extérieur."

  - id: exemple-girafe
    type: exemple
    situation: "La maîtresse épelle un mot sans le dire : « dji, aï, âr, éï, double èf, i ». Liam l'écrit lettre par lettre."
    calcul: "dji = G. aï = I. âr = R. éï = A. double èf = FF. i = E."
    conclusion: "Liam écrit **GIRAFFE**, avec deux F. C'est un mot transparent : une girafe !"
    jules: "Ici, trois lettres pièges d'un coup : le G (dji), le I (aï) et le E (i). Si tu les connais, tu peux écrire n'importe quel mot épelé."

  - id: exemple-correspondante
    type: exemple
    situation: "Au téléphone, la correspondante anglaise de Rose épelle son prénom : « kéï, ouaï, èl, aï, i ». Comment s'écrit-il ?"
    calcul: "kéï = K. ouaï = Y. èl = L. aï = I. i = E."
    conclusion: "Elle s'appelle **Kylie**. Rose peut maintenant écrire son prénom sans faute sur sa lettre."
    jules: "Pour épeler ton propre prénom, entraîne-toi à l'avance : c'est la question qu'on te posera le plus souvent en anglais. Hugo, par exemple, se dit « éïtch, you, dji, ôou »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : épelle à voix haute les prénoms de ta famille, puis demande à quelqu'un de t'épeler un mot anglais que tu connais (cat, dog, apple) et écris-le."
