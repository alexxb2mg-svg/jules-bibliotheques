<text class="tl" x="510.0" y="310.0" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">She </tspan><tspan fill="#A32D2D" font-weight="700">has</tspan><tspan fill="#1a1a18"> a cat.</tspan></text>
<text class="t" x="340.0" y="360.0" text-anchor="middle" dominant-baseline="central">Avec he, she ou un prénom, le verbe prend un -s.</text>
<text class="t" x="340.0" y="382.0" text-anchor="middle" dominant-baseline="central">Deux verbes changent un peu plus : go devient goes, have devient has.</text>
