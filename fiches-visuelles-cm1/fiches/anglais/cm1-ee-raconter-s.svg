<text class="tl" x="510.0" y="264.0" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">She go</tspan><tspan fill="#A32D2D" font-weight="700">es</tspan><tspan fill="#1a1a18"> to school.</tspan></text>
<rect x="24.0" y="292.0" width="292.0" height="36.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="tl" x="170.0" y="310.0" text-anchor="middle" dominant-baseline="central" fill="#0C447C">I have a cat.</text>
