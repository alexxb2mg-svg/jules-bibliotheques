<text class="tl" x="510.0" y="126.0" text-anchor="middle" dominant-baseline="central"><tspan fill="#1a1a18">Sarah live</tspan><tspan fill="#A32D2D" font-weight="700">s</tspan><tspan fill="#1a1a18"> in Lyon.</tspan></text>
<rect x="24.0" y="154.0" width="292.0" height="36.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
