  - id: schema-message
    type: schema
    titre: "Le message vocal de Sarah, et les 4 infos qu'on attrape"
    svg: "cm1-co-comprendre-message-oral-court.svg"
    jules: "Imagine que tu tiens un **filet** : les salutations ouvrent et ferment le message, et entre les deux, tu attrapes qui, quoi, quand, combien. Les autres mots peuvent passer à travers."

  - id: schema-questions
    type: schema
    titre: "Les mots qui annoncent une question, et ceux qui disent de qui on parle"
    svg: "cm1-co-comprendre-message-oral-court-questions.svg"
    jules: "Presque tous les mots-questions commencent par **wh** (who, what, where, when), et les autres par **how** (how old, how many). Dès que tu en entends un, prépare-toi : on attend une réponse de toi."

  - id: methode
    type: methode
    etapes:
      - "J'écoute le début : une **salutation** (Hello, Hi, Good morning) me dit que le message commence."
      - "Je guette les mots-questions : Who? What? Where? When? How old? Ils disent ce qu'on me demande."
      - "Je repère **de qui on parle** : I (je), you (tu), he (il), she (elle), et à qui est la chose : my (mon), your (ton)."
      - "J'écoute le ton de la voix : content, triste ou en colère ? Il m'aide à comprendre le sens."
      - "Si c'est trop rapide, je demande poliment : « Can you repeat, please? » (Tu peux répéter, s'il te plaît ?)"
    jules: "Ces messages sont compréhensibles si la personne parle **lentement** et clairement. Demander de répéter, ce n'est pas un échec : même les adultes le font dans une langue étrangère."

  - id: piege
    type: piege
    mauvaise_idee: "« He et she, c'est pareil : les deux veulent dire « il ». »"
    pourquoi_faux: "**he** /hiː/ veut dire « il » (un garçon, un homme). **she** /ʃiː/ veut dire « elle » (une fille, une femme). Un seul son change, mais ce n'est pas la même personne."
    bonne_idee: "« This is Ben. He is 9. » : Ben est un garçon de 9 ans. « This is Lucy. She is 10. » : Lucy est une fille de 10 ans."
    jules: "Astuce : she a une lettre de plus que he, comme « elle » a plus de lettres que « il ». Et she commence par le son ch, comme « chérie »."

  - id: exemple-sarah
    type: exemple
    situation: "Tom écoute un message vocal : « Hi Tom! It's Sarah. My birthday party is on Saturday. Come at 3 o'clock! I'm 10! Bye! » Que doit-il retenir ?"
    calcul: "Qui ? It's Sarah : c'est Sarah qui appelle. Quoi ? birthday party : sa fête d'anniversaire. Quand ? Saturday, 3 o'clock : samedi, à 3 heures. Quel âge ? I'm 10 : elle a 10 ans."
    conclusion: "Tom sait l'essentiel : **samedi à 3 heures**, il va à la fête des 10 ans de Sarah."
    jules: "Saturday ressemble à « samedi » par le début : sa-, sa-. Les jours anglais s'écrivent toujours avec une majuscule : Monday, Tuesday, Saturday."

  - id: exemple-lucy
    type: exemple
    situation: "À la cantine d'une école anglaise, Lucy dit d'une voix fâchée, en tapant du pied : « No! That's my apple! » Rayan ne connaît pas le mot apple."
    calcul: "La voix forte et le pied qui tape : Lucy est en colère. No! : non. My : mon, ma. Elle montre une pomme sur son plateau."
    conclusion: "Rayan comprend que Lucy est **en colère** et que la pomme est **à elle**, même sans connaître apple (une pomme)."
    jules: "Le ton de la voix et les gestes disent l'humeur avant les mots. Une voix douce et un sourire avec « Thank you! » (merci), c'est tout le contraire."

  - id: renfort
    type: renfort
