<text x="30.0" y="184.0" font-size="16" fill="#3B6D11" font-weight="700" text-anchor="start" dominant-baseline="central">La devinette de Chloé</text>
<text x="30.0" y="216.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#3B6D11" font-weight="700">She</tspan><tspan fill="#185FA5" font-weight="700"> is </tspan><tspan fill="#3B6D11" font-weight="700">a girl</tspan><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="30.0" y="246.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#3B6D11" font-weight="700">She</tspan><tspan fill="#3B6D11" font-weight="700"> wears </tspan><tspan fill="#3B6D11" font-weight="700">a blue jumper</tspan><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="30.0" y="276.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#3B6D11" font-weight="700">She</tspan><tspan fill="#185FA5" font-weight="700"> has got </tspan><tspan fill="#3B6D11" font-weight="700">black hair</tspan><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="30.0" y="306.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">Who is it?</tspan></text>
<text x="30.0" y="338.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">C'est une fille. Elle porte un pull bleu.</text>
<text x="30.0" y="356.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Elle a les cheveux noirs. Qui est-ce ?</text>
