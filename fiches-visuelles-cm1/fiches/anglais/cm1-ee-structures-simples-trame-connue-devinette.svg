<text x="30.0" y="66.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">He is </tspan><tspan fill="#1a1a18" font-weight="700">a boy</tspan><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="30.0" y="94.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">He has got </tspan><tspan fill="#1a1a18" font-weight="700">red hair</tspan><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="30.0" y="122.0" font-size="19" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">Who is it?</tspan></text>
