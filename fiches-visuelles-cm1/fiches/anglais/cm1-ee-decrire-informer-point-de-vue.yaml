notion: cm1-ee-decrire-informer-point-de-vue
titre: "Décrire et donner mon avis par écrit : It is… I like… I think it's… because…"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 25-26", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "it's": "it is : c'est, il est, elle est (it's funny : c'est drôle)"
  "It's": "it is : c'est, il est, elle est (It's funny : c'est drôle)"
  "can't": "cannot : ne sait pas, ne peut pas (It can't fly : il ne sait pas voler)"
  "don't": "do not : ne... pas (I don't like : je n'aime pas)"
blocs:
  - id: avis
    type: formule
    expression: "[I like] it. It's [very] [funny]! [I agree] or [I disagree]"
    termes:
      "I like": {couleur: vert, legende: "**mon goût** : I love (j'adore), I like (j'aime), I don't like (je n'aime pas), I hate (je déteste)."}
      very: {couleur: orange, legende: "**très** : il rend l'adjectif plus fort. It's good (c'est bien), it's very good (c'est très bien)."}
      funny: {couleur: bleu, legende: "**l'adjectif** qui dit pourquoi : funny (drôle), nice (joli, gentil), good (bien), boring (ennuyeux)."}
      "I agree": {couleur: violet, legende: "**je suis d'accord** avec ce que quelqu'un a écrit ou dit."}
      "I disagree": {couleur: rouge, legende: "**je ne suis pas d'accord**. Dis ensuite ton avis à toi : I disagree! It's great!"}
    jules: "Un avis complet, c'est un goût + une raison. « I like it » tout seul ne dit pas pourquoi : ajoute un adjectif comme funny ou boring."

  - id: carte
    type: carte
    noeuds:
      - {id: avis, titre: "Décrire et donner mon avis", sous_titre: "des phrases courtes, apprises en classe", principal: true}
      - {id: decrire, titre: "Décrire", sous_titre: "It is black. It has got two wings. It can swim."}
      - {id: gouts, titre: "Dire mes goûts", sous_titre: "I love, I like, I don't like, I hate"}
      - {id: pourquoi, titre: "Dire pourquoi", sous_titre: "It's funny. It's very boring. because…"}
      - {id: reagir, titre: "Réagir à un avis", sous_titre: "I agree. I disagree."}
    liens:
      - {de: avis, vers: decrire}
      - {de: avis, vers: gouts}
      - {de: avis, vers: pourquoi}
      - {de: avis, vers: reagir}
    jules: "Décrire, c'est dire ce que tout le monde peut voir (it is black). Donner son avis, c'est dire ce que **toi**, tu penses (I think it's funny)."

  - id: schema-animal
    type: schema
    titre: "Ma fiche My favourite animal : je décris le manchot, puis je donne mon avis"
    svg: "cm1-ee-decrire-informer-point-de-vue.svg"
    jules: "Petit piège de vocabulaire : penguin se traduit par **manchot**. En français, le pingouin est un autre oiseau, qui sait voler !"

  - id: schema-gouts
    type: schema
    titre: "L'échelle des goûts, puis réagir à l'avis d'un camarade"
    svg: "cm1-ee-decrire-informer-point-de-vue-avis.svg"
    jules: "Pour dire que tu aimes faire quelque chose, ajoute -ing au verbe : I like swimming (j'aime nager), I love drawing (j'adore dessiner)."

  - id: graphe
    type: graphe
    gabarit: echelle-intensite
    curseurs:
      - {id: curseur-serie, nom: serie, min: 7, max: 7, pas: 1, depart: 7}
      - {id: curseur-degre, nom: degre, min: 0, max: 4, pas: 1, depart: 3}
    lectures:
      - {si: "degre == 0", texte: "**I hate it!** : je déteste. Le visage est tout triste."}
      - {si: "degre == 1", texte: "**I don't like it.** : je n'aime pas."}
      - {si: "degre == 2", texte: "**It's OK.** : c'est pas mal, bof."}
      - {si: "degre >= 3", texte: "**I like it.** (j'aime), puis **I love it!** (j'adore) : le sourire s'agrandit."}
    jules: "Pour donner ton avis en anglais, choisis la marche qui te va. Le point d'exclamation des deux bouts montre que l'avis est très fort."

  - id: methode
    type: methode
    etapes:
      - "Choisis de quoi tu parles : un animal, un plat, un sport, un livre, un tableau."
      - "Décris-le en phrases courtes : It is… (couleur, taille), It has got… (ce qu'il a), It can… (ce qu'il sait faire)."
      - "Donne **ton goût** : I love, I like, I don't like ou I hate."
      - "Dis pourquoi avec un **adjectif** : It's funny, it's boring. Ajoute very pour le renforcer."
      - "Si tu réponds à quelqu'un, commence par I agree ou I disagree, puis relis : ta phrase est-elle courte et claire ?"
    jules: "Garde les phrases que tu connais par cœur. Une phrase simple et juste vaut mieux qu'une longue phrase traduite mot à mot du français."

  - id: piege
    type: piege
    mauvaise_idee: "Pour donner son avis sur un dessin animé, Zoé écrit seulement : « I like it. »"
    pourquoi_faux: "On sait que Zoé aime, mais on ne sait pas **pourquoi**. Un avis complet donne une raison, avec un adjectif."
    bonne_idee: "I like it. It's very funny and the songs are great. (Je l'aime bien. Il est très drôle et les chansons sont géniales.)"
    jules: "Autre piège venu du français : « je suis d'accord » se dit **I agree**, sans am. « I am agree » est faux."

  - id: exemple-haring
    type: exemple
    situation: "En arts, la classe de Malik regarde une œuvre de l'artiste américain Keith Haring : des petits bonshommes rouges, jaunes et bleus qui dansent. Malik écrit son avis en anglais."
    calcul: "I love it! It's very colourful. It's funny. I like the red man."
    conclusion: "J'adore ! C'est très coloré. C'est drôle. J'aime le bonhomme rouge. Malik a donné **son goût** (I love it), **deux adjectifs** (colourful, funny) et un détail qu'il a vu."
    jules: "Colourful veut dire « plein de couleurs » : c'est colour (couleur) + ful (plein de). Aux États-Unis, on l'écrit colorful, sans u."

  - id: exemple-fiche
    type: exemple
    situation: "Jade complète une fiche de renseignements pour sa correspondante anglaise, Amy."
    calcul: "Name: Jade. Age: 9. Favourite colour: green. Favourite animal: the fox. I'm very good at drawing."
    conclusion: "Nom : Jade. Âge : 9 ans. Couleur préférée : le vert. Animal préféré : le renard. Je suis très forte en dessin. Jade n'écrit que **des mots isolés** pour les cases, puis une seule phrase."
    jules: "Dans une fiche, pas besoin de phrases : un mot suffit après Name, Age ou Favourite. Favourite veut dire « préféré »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : fais la fiche My favourite animal de ton animal préféré, avec It is, It has got, It can et I think it's… because… Dessine-le à côté."
