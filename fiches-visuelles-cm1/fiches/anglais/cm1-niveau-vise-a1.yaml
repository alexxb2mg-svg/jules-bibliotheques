notion: cm1-niveau-vise-a1
titre: "Le niveau A1 en fin de CM1 : ce que je sais dire et comprendre en anglais"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de langues vivantes étrangères et régionales pour le cours moyen, arrêté du 26-2-2026, BO n° 12 du 19/03/2026, p. 2", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "A1+": "un peu plus que A1 : visé en compréhension et en expression par les classes en parcours renforcé, bilingue ou EMILE"
  EMILE: "enseignement d'une matière par l'intégration d'une langue étrangère : par exemple, faire du sport en anglais"
  CO: "compréhension de l'oral : écouter et comprendre"
  EOC: "expression orale en continu : parler seul"
  EOI: "expression orale en interaction : dialoguer"
  CE: "compréhension de l'écrit : lire et comprendre"
  EE: "expression écrite : écrire"
  M: "médiation : aider quelqu'un à comprendre, d'une langue à l'autre"
blocs:
  - id: definition
    type: formule
    expression: "Niveau A1 : des [phrases très simples] sur des [sujets familiers]"
    termes:
      "phrases très simples": {couleur: orange, legende: "courtes et déjà apprises en classe : « I'm 9. » (J'ai 9 ans.), « I like pizza. » (J'aime la pizza.)"}
      "sujets familiers": {couleur: bleu, legende: "toi, ta **famille**, ton **école**, tes goûts : « I've got a sister. » (J'ai une sœur.)"}
    jules: "A1, c'est la **première marche** de l'échelle des langues. Personne ne te demande de parler comme un Anglais : on te demande de te faire comprendre avec des mots simples."

  - id: carte
    type: carte
    noeuds:
      - {id: a1, titre: "Le niveau A1", sous_titre: "la 1re marche de l'échelle des langues", principal: true}
      - {id: cecrl, titre: "Le CECRL", sous_titre: "6 marches, de A1 à C2, les mêmes pour toutes les langues"}
      - {id: tous, titre: "En fin de CM1", sous_titre: "A1 pour tous les élèves, dans les 6 activités"}
      - {id: plus, titre: "A1+", sous_titre: "un pas de plus en classe bilingue ou renforcée (pas pour la médiation)"}
      - {id: comprendre, titre: "Se faire comprendre", sous_titre: "une petite erreur, ce n'est pas grave si le message passe"}
    liens:
      - {de: a1, vers: cecrl}
      - {de: a1, vers: tous}
      - {de: a1, vers: plus}
      - {de: a1, vers: comprendre}
    jules: "Le CECRL sert partout en Europe : un élève allemand qui apprend le français, ou toi qui apprends l'anglais, vous montez le même escalier. Tu pourras continuer à grimper au collège."

  - id: schema-escalier
    type: schema
    titre: "L'escalier des langues : A1 est la première marche"
    svg: "cm1-niveau-vise-a1.svg"
    jules: "La lettre dit la famille (A : je découvre, B : je me débrouille, C : je maîtrise) et le chiffre dit la marche dans la famille. Le petit + de **A1+** veut dire « un peu plus loin que A1 », pas encore A2."

  - id: schema-je-sais
    type: schema
    titre: "Au niveau A1, je sais... : une vraie phrase pour chaque activité"
    svg: "cm1-niveau-vise-a1-je-sais.svg"
    jules: "Relis ces six cartes comme une liste de réussites : si tu sais déjà dire « My name is... I'm 9 », tu as un pied sur la marche A1. Les autres phrases viendront au fil de l'année."

  - id: methode
    type: methode
    etapes:
      - "Je repère ce que la tâche me demande : **comprendre**, parler, lire, écrire, ou aider quelqu'un."
      - "Je fais des phrases courtes : « I'm 9. I like football. » vaut mieux qu'une longue phrase que je ne sais pas finir."
      - "J'utilise d'abord les **mots appris en classe** (les couleurs, les nombres, la famille), au lieu d'en inventer."
      - "Je ne me décourage pas si je ne comprends pas tout : au niveau A1, comprendre **l'essentiel** suffit."
    jules: "Une phrase courte et juste se comprend mieux qu'une longue phrase compliquée. Avec « I like » (j'aime) et « I've got » (j'ai), tu peux déjà dire beaucoup de choses sur toi."

  - id: piege
    type: piege
    mauvaise_idee: "« Pour avoir le niveau A1, il faut parler anglais sans aucune erreur. Tom a dit I have 9 years, donc il n'a pas le niveau. »"
    pourquoi_faux: "Au niveau A1, on attend d'abord de **se faire comprendre**. Tout le monde a compris que Tom a 9 ans : son message est passé, même avec une erreur."
    bonne_idee: "On le félicite, puis on apprend la forme juste : en anglais, on dit « I'm 9. » (je suis 9), et pas « I have 9 years »."
    jules: "C'est l'erreur de presque tous les Français : ils traduisent « j'ai 9 ans » mot à mot. En anglais, l'âge se dit avec « I'm », comme si on disait « je suis 9 »."

  - id: exemple-yanis
    type: exemple
    situation: "En fin d'année, Yanis se présente à la classe : « Hello! My name is Yanis. I'm 10. I've got a little sister. I like football. » A-t-il le niveau A1 en expression orale en continu ?"
    calcul: "Ses phrases sont courtes et simples. Elles parlent de lui, de sa famille, de ce qu'il aime : ce sont des sujets familiers. On le comprend sans effort."
    conclusion: "Oui : Yanis a atteint le **niveau A1** attendu en fin de CM1 pour parler seul."
    jules: "En français, cela donne : « bonjour, je m'appelle Yanis, j'ai 10 ans, j'ai une petite sœur, j'aime le football ». Tu peux faire pareil en changeant les mots."

  - id: exemple-parcours
    type: exemple
    situation: "Emma est dans une classe bilingue : une partie des cours se fait en anglais. Hugo est dans une classe qui fait les heures d'anglais habituelles. Quel niveau vise chacun en fin de CM1 ?"
    calcul: "Hugo, parcours habituel : A1 dans toutes les activités. Emma, parcours bilingue : A1+ pour comprendre et s'exprimer, mais A1 pour la médiation (M)."
    conclusion: "Hugo vise **A1 partout**. Emma vise **A1+** en compréhension et en expression, et **A1 en médiation**."
    jules: "Retiens l'exception : même en classe bilingue, le programme fixe la **médiation** au niveau A1. Le + ne concerne que comprendre et s'exprimer."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : présente-toi en 4 phrases anglaises devant un miroir, ton nom, ton âge, ta famille, ce que tu aimes. Si tu y arrives sans t'arrêter, tu es bien sur la marche A1."
