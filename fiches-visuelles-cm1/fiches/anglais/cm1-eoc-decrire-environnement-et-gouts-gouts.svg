<circle cx="257.0" cy="110.0" r="36" fill="#FCE7A8" stroke="#8A6A12" stroke-width="1.6"/>
<circle cx="244.0" cy="103.5" r="2.88" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="270.0" cy="103.5" r="2.88" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<path d="M241.9 129.7 Q257.0 115.7 272.1 129.7" fill="none" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="257.0" y="170.0" font-size="20" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">I don't like</text>
<text x="257.0" y="196.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">rain.</text>
<text x="257.0" y="224.0" font-size="12" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Je n'aime pas</text>
<text x="257.0" y="240.0" font-size="12" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">la pluie.</text>
