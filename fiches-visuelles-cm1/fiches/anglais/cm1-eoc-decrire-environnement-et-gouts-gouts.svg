<text x="92.0" y="170.0" font-size="20" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">I hate</text>
<text x="92.0" y="196.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">spiders.</text>
<text x="92.0" y="224.0" font-size="12" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Je déteste</text>
<text x="92.0" y="240.0" font-size="12" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">les araignées.</text>
<text x="92.0" y="268.0" font-size="13" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">hate = /heɪt/</text>
