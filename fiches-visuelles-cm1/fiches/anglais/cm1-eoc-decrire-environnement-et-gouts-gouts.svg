<text x="422.0" y="196.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">pizza.</text>
<text x="422.0" y="224.0" font-size="12" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">J'aime la pizza.</text>
