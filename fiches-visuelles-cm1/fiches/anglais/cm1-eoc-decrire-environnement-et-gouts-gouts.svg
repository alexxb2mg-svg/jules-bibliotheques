<text x="587.0" y="170.0" font-size="20" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">I love</text>
<text x="587.0" y="196.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">cats!</text>
<text x="587.0" y="224.0" font-size="12" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">J'adore les chats !</text>
<text x="587.0" y="268.0" font-size="13" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">love = /lʌv/</text>
<rect x="14.0" y="306.0" width="652.0" height="100.0" rx="10" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2"/>
<text x="30.0" y="330.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan font-weight="700">Encore plus fort : </tspan><tspan fill="#3B6D11" font-weight="700">I like it very much!</tspan><tspan fill="#5f5e5a">  (J'aime beaucoup !)</tspan></text>
<text x="30.0" y="358.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan font-weight="700">Relier : </tspan><tspan>I like pizza </tspan><tspan fill="#185FA5" font-weight="700">and</tspan><tspan> pasta.</tspan><tspan> Tea </tspan><tspan fill="#185FA5" font-weight="700">or</tspan><tspan> milk? </tspan><tspan fill="#5f5e5a">(Du thé ou du lait ?)</tspan></text>
<text x="30.0" y="386.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan font-weight="700">S'exclamer : </tspan><tspan fill="#3B6D11" font-weight="700">Great!</tspan><tspan fill="#5f5e5a"> (Génial !) — </tspan><tspan fill="#A32D2D" font-weight="700">Yuck!</tspan><tspan fill="#5f5e5a"> (Beurk !)</tspan></text>
