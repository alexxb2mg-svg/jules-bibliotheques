<svg width="100%" viewBox="0 0 680 406" xmlns="http://www.w3.org/2000/svg"><title>Un message vocal de Sarah, et les 4 infos qu'on attrape</title>
<defs><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#5F5E5A" stroke="none"/></marker></defs>
<rect x="14.0" y="30.0" width="44.0" height="78.0" rx="8" fill="#444441" stroke="#1a1a18" stroke-width="1.2"/>
<rect x="19.0" y="40.0" width="34.0" height="56.0" rx="2" fill="#E6F1FB" stroke="none" stroke-width="0"/>
<circle cx="36.0" cy="102.0" r="3" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<path d="M64.6 63.9 A6 6 0 0 0 64.6 56.1" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M69.2 67.7 A12 12 0 0 0 69.2 52.3" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="ts" x="36.0" y="128.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">message</text>
<text class="ts" x="36.0" y="144.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">vocal</text>
<rect x="84.0" y="14.0" width="346.0" height="324.0" rx="14" fill="#ffffff" stroke="#444441" stroke-width="1.5"/>
<text class="tl" x="102.0" y="44.0" text-anchor="start" dominant-baseline="central"><tspan fill="#5F5E5A" font-weight="700">Hi</tspan><tspan> Tom! It's </tspan><tspan fill="#185FA5" font-weight="700">Sarah</tspan><tspan>.</tspan></text>
<text class="t" x="102.0" y="68.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Salut Tom ! C'est Sarah.</text>
<text class="tl" x="102.0" y="98.0" text-anchor="start" dominant-baseline="central"><tspan>My </tspan><tspan fill="#3B6D11" font-weight="700">birthday party</tspan></text>
<text class="tl" x="102.0" y="122.0" text-anchor="start" dominant-baseline="central"><tspan>is on </tspan><tspan fill="#C2410C" font-weight="700">Saturday</tspan><tspan>.</tspan></text>
<text class="t" x="102.0" y="146.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Ma fête d'anniversaire est samedi.</text>
<text class="tl" x="102.0" y="176.0" text-anchor="start" dominant-baseline="central"><tspan>Come at </tspan><tspan fill="#C2410C" font-weight="700">3 o'clock</tspan><tspan>!</tspan></text>
<text class="t" x="102.0" y="200.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Viens à 3 heures !</text>
<text class="tl" x="102.0" y="230.0" text-anchor="start" dominant-baseline="central"><tspan>I'm </tspan><tspan fill="#534AB7" font-weight="700">10</tspan><tspan>!</tspan></text>
<text class="t" x="102.0" y="254.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">J'ai 10 ans !</text>
<text class="tl" x="102.0" y="284.0" text-anchor="start" dominant-baseline="central"><tspan fill="#5F5E5A" font-weight="700">Bye!</tspan></text>
<text class="t" x="102.0" y="308.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Au revoir !</text>
<line x1="436.0" y1="176.0" x2="464.0" y2="176.0" stroke="#5F5E5A" stroke-width="3" stroke-linecap="round" marker-end="url(#ag)"/>
<rect x="470.0" y="14.0" width="200.0" height="324.0" rx="6" fill="#FFFDF5" stroke="#854F0B" stroke-width="1.5"/>
<text class="t" x="570.0" y="36.0" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-weight="700">Ce que j'attrape</text>
<text class="t" x="484.0" y="64.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="700">Qui ?</text>
<text class="t" x="500.0" y="84.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="700">Sarah</text>
<text class="t" x="500.0" y="102.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">(à Tom)</text>
<line x1="480.0" y1="116.0" x2="660.0" y2="116.0" stroke="#e8dcc0" stroke-width="1" stroke-linecap="round"/>
<text class="t" x="484.0" y="128.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11" font-weight="700">Quoi ?</text>
<text class="t" x="500.0" y="148.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11" font-weight="700">sa fête</text>
<text class="t" x="500.0" y="166.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11">d'anniversaire</text>
<line x1="480.0" y1="180.0" x2="660.0" y2="180.0" stroke="#e8dcc0" stroke-width="1" stroke-linecap="round"/>
<text class="t" x="484.0" y="192.0" text-anchor="start" dominant-baseline="central" fill="#C2410C" font-weight="700">Quand ?</text>
<text class="t" x="500.0" y="212.0" text-anchor="start" dominant-baseline="central" fill="#C2410C" font-weight="700">samedi,</text>
<text class="t" x="500.0" y="230.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">à 3 heures</text>
<line x1="480.0" y1="244.0" x2="660.0" y2="244.0" stroke="#e8dcc0" stroke-width="1" stroke-linecap="round"/>
<text class="t" x="484.0" y="256.0" text-anchor="start" dominant-baseline="central" fill="#534AB7" font-weight="700">Quel âge ?</text>
<text class="t" x="500.0" y="276.0" text-anchor="start" dominant-baseline="central" fill="#534AB7" font-weight="700">10 ans</text>
<text class="t" x="340.0" y="360.0" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">Qui</tspan><tspan> · </tspan><tspan fill="#3B6D11" font-weight="700">Quoi</tspan><tspan> · </tspan><tspan fill="#C2410C" font-weight="700">Quand</tspan><tspan> · </tspan><tspan fill="#534AB7" font-weight="700">Combien, quel âge</tspan><tspan> · </tspan><tspan fill="#5F5E5A" font-weight="700">Salutations</tspan><tspan> (début et fin)</tspan></text>
<text class="t" x="340.0" y="390.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">Je n'ai pas besoin de tous les mots : 4 petites infos suffisent.</text>
</svg>
