<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg"><title>Cinq mots pour poser une question, et ce qu'on répond</title>
<rect x="14.0" y="8.0" width="652.0" height="80.0" rx="8" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<circle cx="50.0" cy="34.0" r="11" fill="#F6D7B8" stroke="#B98A63" stroke-width="1.2"/>
<path d="M32 64 Q34 46 50 46 Q66 46 68 64 Z" fill="#A7C7E7" stroke="#1a1a18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90.0" y="34.0" font-size="24" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Who?</text>
<text x="90.0" y="60.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">qui ?</text>
<text x="214.0" y="34.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">/huː/</text>
<text x="290.0" y="34.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Who is your teacher?</text>
<text x="290.0" y="62.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#5f5e5a">→ </tspan><tspan fill="#3B6D11" font-weight="700">It's Mrs Martin.</tspan><tspan fill="#5f5e5a">  C'est Mme Martin.</tspan></text>
<rect x="14.0" y="92.0" width="652.0" height="80.0" rx="8" fill="#ffffff" stroke="none" stroke-width="0"/>
<rect x="34.0" y="114.0" width="32.0" height="32.0" rx="4" fill="#F7C948" stroke="#1a1a18" stroke-width="1.3"/>
<text x="50.0" y="130.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">?</text>
<text x="90.0" y="118.0" font-size="24" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">What?</text>
<text x="90.0" y="144.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">quoi ? quel ?</text>
<text x="214.0" y="118.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">/wɒt/</text>
<text x="290.0" y="118.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">What's your favourite colour?</text>
<text x="290.0" y="146.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#5f5e5a">→ </tspan><tspan fill="#3B6D11" font-weight="700">Blue.</tspan><tspan fill="#5f5e5a">  Bleu.</tspan></text>
<rect x="14.0" y="176.0" width="652.0" height="80.0" rx="8" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<path d="M50 234 Q32 212 34 206 A16 16 0 1 1 66 206 Q68 212 50 234 Z" fill="#E05A6D" stroke="#1a1a18" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="50.0" cy="206.0" r="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="90.0" y="202.0" font-size="24" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Where?</text>
<text x="90.0" y="228.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">où ?</text>
<text x="214.0" y="202.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">/weə/</text>
<text x="290.0" y="202.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Where is my rubber?</text>
<text x="290.0" y="230.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#5f5e5a">→ </tspan><tspan fill="#3B6D11" font-weight="700">It's under your chair.</tspan><tspan fill="#5f5e5a">  Sous ta chaise.</tspan></text>
<rect x="14.0" y="260.0" width="652.0" height="80.0" rx="8" fill="#ffffff" stroke="none" stroke-width="0"/>
<circle cx="50.0" cy="298.0" r="18" fill="#ffffff" stroke="#1a1a18" stroke-width="1.6"/>
<line x1="50.0" y1="298.0" x2="50.0" y2="286.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<line x1="50.0" y1="298.0" x2="59.0" y2="302.0" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<circle cx="50.0" cy="298.0" r="2" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="90.0" y="286.0" font-size="24" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">When?</text>
<text x="90.0" y="312.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">quand ?</text>
<text x="214.0" y="286.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">/wen/</text>
<text x="290.0" y="286.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">When is your birthday?</text>
<text x="290.0" y="314.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#5f5e5a">→ </tspan><tspan fill="#3B6D11" font-weight="700">In May.</tspan><tspan fill="#5f5e5a">  En mai.</tspan></text>
<rect x="14.0" y="344.0" width="652.0" height="80.0" rx="8" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<rect x="30.0" y="380.0" width="40.0" height="20.0" rx="3" fill="#F4B6C6" stroke="#1a1a18" stroke-width="1.3"/>
<rect x="30.0" y="380.0" width="40.0" height="6.0" rx="2" fill="#ffffff" stroke="#1a1a18" stroke-width="1.0"/>
<rect x="38.0" y="366.0" width="4.0" height="14.0" rx="0" fill="#E6F1FB" stroke="#1a1a18" stroke-width="0.8"/>
<path d="M40 358 Q44 363 40 366 Q36 363 40 358 Z" fill="#F28C28" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="48.0" y="366.0" width="4.0" height="14.0" rx="0" fill="#E6F1FB" stroke="#1a1a18" stroke-width="0.8"/>
<path d="M50 358 Q54 363 50 366 Q46 363 50 358 Z" fill="#F28C28" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="58.0" y="366.0" width="4.0" height="14.0" rx="0" fill="#E6F1FB" stroke="#1a1a18" stroke-width="0.8"/>
<path d="M60 358 Q64 363 60 366 Q56 363 60 358 Z" fill="#F28C28" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90.0" y="370.0" font-size="24" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">How old?</text>
<text x="90.0" y="396.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">quel âge ?</text>
<text x="214.0" y="370.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">/haʊ/</text>
<text x="290.0" y="370.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">How old is your brother?</text>
<text x="290.0" y="398.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#5f5e5a">→ </tspan><tspan fill="#3B6D11" font-weight="700">He's 12.</tspan><tspan fill="#5f5e5a">  Il a 12 ans.</tspan></text>
</svg>
