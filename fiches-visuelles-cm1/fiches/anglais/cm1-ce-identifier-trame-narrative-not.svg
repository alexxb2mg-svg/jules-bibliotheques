<text class="tl" x="356.0" y="238.0" text-anchor="start" dominant-baseline="central">Max likes the garden, <tspan fill="#0C447C" font-weight="700">but</tspan></text>
<text class="tl" x="356.0" y="264.0" text-anchor="start" dominant-baseline="central">he does<tspan fill="#A32D2D" font-weight="700">n't</tspan> like rain.</text>
<text class="t" x="356.0" y="290.0" text-anchor="start" dominant-baseline="central">but annonce le contraire : le jardin oui,</text>
<text class="t" x="356.0" y="310.0" text-anchor="start" dominant-baseline="central">la pluie non.</text>
<text class="t" x="170.0" y="214.0" text-anchor="middle" dominant-baseline="central">Attention, not se cache aussi</text>
