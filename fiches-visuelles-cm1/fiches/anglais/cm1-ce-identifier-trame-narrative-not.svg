<text class="tl" x="170.0" y="260.0" text-anchor="middle" dominant-baseline="central">is<tspan fill="#A32D2D" font-weight="700">n't</tspan> = is <tspan fill="#A32D2D" font-weight="700">not</tspan></text>
<text class="tl" x="170.0" y="288.0" text-anchor="middle" dominant-baseline="central">does<tspan fill="#A32D2D" font-weight="700">n't</tspan> = does <tspan fill="#A32D2D" font-weight="700">not</tspan></text>
<text class="tl" x="170.0" y="316.0" text-anchor="middle" dominant-baseline="central">do<tspan fill="#A32D2D" font-weight="700">n't</tspan> = do <tspan fill="#A32D2D" font-weight="700">not</tspan></text>
<text class="t" x="340.0" y="346.0" text-anchor="middle" dominant-baseline="central">Un seul petit mot peut changer tout le sens de la phrase : cherche-le !</text>
