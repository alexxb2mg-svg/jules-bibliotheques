sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 13-14", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: formule
    type: formule
    expression: "[First], … [Then], … [Finally], …"
    termes:
      First: {couleur: orange, legende: "**d'abord** : la première image, le début de l'histoire. Se dit /fɜːst/."}
      Then: {couleur: orange, legende: "**ensuite** : ce qui se passe après. Le th se dit /ð/, la langue entre les dents."}
      Finally: {couleur: orange, legende: "**enfin** : la dernière image, la fin de l'histoire. Se dit /ˈfaɪnəli/."}
    jules: "Ces trois mots sont comme les numéros des cases d'une BD : ils disent dans quel ordre ça se passe. Tu peux ajouter And then entre deux cases pour une histoire plus longue."

  - id: carte
    type: carte
    noeuds:
      - {id: raconter, titre: "Raconter en anglais", sous_titre: "des phrases courtes, une par image", principal: true}
      - {id: ordre, titre: "L'ordre des images", sous_titre: "First, Then, Finally"}
      - {id: quand, titre: "Dire quand", sous_titre: "today, this morning, on Saturday"}
      - {id: compter, titre: "Compter", sous_titre: "one frog, two frogs : le -s du pluriel"}
      - {id: relier, titre: "Relier deux phrases", sous_titre: "and (et), but (mais)"}
    liens:
      - {de: raconter, vers: ordre}
      - {de: raconter, vers: quand}
      - {de: raconter, vers: compter}
      - {de: raconter, vers: relier}
    jules: "Pas besoin de longues phrases : qui, fait quoi, en regardant l'image. Au CM1, on raconte au **présent**, comme si l'histoire se passait devant toi."

  - id: schema-bd
    type: schema
    titre: "La journée au parc de Max et Nina, en trois images"
    svg: "cm1-eoc-raconter.svg"
    jules: "Max and Nina play, sans -s : ils sont deux, c'est un pluriel. Mais it rains prend un -s, comme he plays, car it est un seul « il »."

  - id: schema-randonnee
    type: schema
    titre: "Une histoire qui se répète : chaque jour, une grenouille de plus"
    svg: "cm1-eoc-raconter-randonnee.svg"
    jules: "Dans une histoire en **randonnée**, la même phrase revient et une seule chose change à chaque fois. On la retient vite, et on peut inventer la fin : ici, un serpent surprise !"

  - id: methode
    type: methode
    etapes:
      - "Pose les images devant toi, dans l'ordre de l'histoire."
      - "Pour chaque image, fais une phrase courte : **qui** + ce qu'il fait. Max plays football."
      - "Commence chaque phrase par un mot d'ordre ou de temps : First, Then, Finally, ou Today, On Saturday."
      - "Relie deux petites phrases avec **and** (et) ou **but** (mais) : It's sunny but it's cold."
      - "Entraîne-toi à voix haute en montrant chaque image du doigt."
    jules: "Si tu bloques sur un mot, montre-le sur l'image et dis ce que tu sais. Le dessin t'aide à ne rien oublier, c'est pour ça qu'on raconte avec des images."

  - id: piege
    type: piege
    mauvaise_idee: "Il y a trois grenouilles, alors je dis : « I see three frog. »"
    pourquoi_faux: "Quand il y en a plusieurs, le nom prend un **-s** en anglais, comme en français. Et en anglais, on l'entend : frogs se dit /frɒgz/."
    bonne_idee: "I see three frogs. One frog, two frogs. One cat, four cats. One dog, five dogs."
    jules: "Quelques mots changent en entier au pluriel : one **foot** (un pied), two feet (deux pieds). Ceux-là, on les apprend par cœur."

  - id: exemple-anna
    type: exemple
    situation: "Raconte la journée d'Anna en trois images : elle va à l'école, elle mange à la cantine, puis elle rentre chez elle et joue avec son chien."
    calcul: "Picture 1 : First, Anna goes to school. Picture 2 : Then, she eats at the canteen. Picture 3 : Finally, she goes home and she plays with her dog."
    conclusion: "Une phrase par image, un mot d'ordre au début de chacune. Traduction : D'abord, Anna va à l'école. Ensuite, elle mange à la cantine. Enfin, elle rentre et joue avec son chien."
    jules: "Anna est une seule personne, alors ses verbes prennent un -s : **goes**, eats, plays. Picture veut dire « image »."

  - id: exemple-anniversaire
    type: exemple
    situation: "Aujourd'hui, c'est mercredi 12 juin, et c'est l'anniversaire de Tom. Il y a un gâteau avec 10 bougies, et 6 copains. Commence l'histoire en disant la date."
    calcul: "Today is Wednesday, the 12th of June. It's Tom's birthday! There is a big cake with ten candles. There are six friends."
    conclusion: "La date se dit **the 12th of June** (le douzième de juin). On compte avec les nombres anglais, et on met le -s : candles, friends."
    jules: "12th se lit twelfth, et 1st, 2nd, 3rd se lisent first, second, third. Pour Wednesday, le premier d ne se prononce pas : /ˈwenzdeɪ/."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine ton week-end en trois cases, puis raconte-le avec First, Then et Finally. Trois phrases suffisent pour une vraie histoire."
