<text x="591.0" y="248.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">UK, USA… et France</text>
<text x="591.0" y="276.0" font-size="13" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">Merry Christmas!</text>
<text x="591.0" y="306.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Comme chez nous !</text>
<text x="591.0" y="326.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Au repas, on tire</text>
<text x="591.0" y="346.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">des crackers : des</text>
<text x="591.0" y="366.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">papillotes qui</text>
<text x="591.0" y="386.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">font « pan ! ».</text>
