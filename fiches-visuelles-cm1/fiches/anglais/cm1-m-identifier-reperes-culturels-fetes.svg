<text x="93.0" y="228.0" font-size="14" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">31 October</text>
<text x="93.0" y="248.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">UK, USA</text>
<text x="93.0" y="276.0" font-size="13" fill="#E8792B" font-weight="700" text-anchor="middle" dominant-baseline="central">Trick or treat!</text>
<text x="93.0" y="306.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Les enfants se</text>
<text x="93.0" y="326.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">déguisent et vont</text>
<text x="93.0" y="346.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">sonner aux portes</text>
<text x="93.0" y="366.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">pour avoir des</text>
<text x="93.0" y="386.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">bonbons.</text>
