<text x="259.0" y="206.0" font-size="17" fill="#C2410C" font-weight="800" text-anchor="middle" dominant-baseline="central">Bonfire Night</text>
<text x="259.0" y="228.0" font-size="14" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">5 November</text>
<text x="259.0" y="248.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">UK</text>
<text x="259.0" y="276.0" font-size="13" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">Look, fireworks!</text>
<text x="259.0" y="306.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Feux de joie et</text>
<text x="259.0" y="326.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">feux d'artifice : on</text>
<text x="259.0" y="346.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">se souvient d'un</text>
<text x="259.0" y="366.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">complot raté contre</text>
<text x="259.0" y="386.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">le roi, en 1605.</text>
