<text x="425.0" y="248.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">USA (le 4e jeudi)</text>
<text x="425.0" y="276.0" font-size="13" fill="#854F0B" font-weight="700" text-anchor="middle" dominant-baseline="central">Happy Thanksgiving!</text>
<text x="425.0" y="306.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">Un grand repas en</text>
<text x="425.0" y="326.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">famille pour dire</text>
<text x="425.0" y="346.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">merci : dinde, tarte</text>
<text x="425.0" y="366.0" font-size="13.5" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">à la citrouille.</text>
