<text x="26.0" y="392.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#C2410C" font-weight="700">Pièges</tspan><tspan> : E se dit /iː/ (comme « i »), I se dit /aɪ/ (comme « aï »),</tspan></text>
<text x="26.0" y="414.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan>G se dit /dʒiː/ (« dji ») et J se dit /dʒeɪ/ (« djé ») : l'inverse du français !</tspan></text>
<text x="26.0" y="446.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">H-U-G-O</tspan><tspan> : /eɪtʃ/ /juː/ /dʒiː/ /əʊ/</tspan></text>
<text x="380.0" y="446.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">E-M-M-A</tspan><tspan> : E, double M, A</tspan></text>
