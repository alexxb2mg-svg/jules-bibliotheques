notion: cm1-m-participer-travail-collectif
titre: "Travailler en groupe en anglais : Welcome! It's my turn! Can I have the glue, please? Well done!"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 30-31", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "It's": "it is : c'est (It's my turn : c'est mon tour)"
  "Let's": "let us : allons-y, faisons (Let's play! : jouons !)"
  "Time's": "time is : Time's up! veut dire « le temps est écoulé »"
  "don't": "do not : ne... pas (I don't understand : je ne comprends pas)"
blocs:
  - id: rituel
    type: formule
    expression: "[Welcome]! [Your turn]. [Do you understand?] [Yes, I do!] [Well done]!"
    termes:
      Welcome: {couleur: vert, legende: "**Bienvenue !** pour accueillir un nouveau camarade ou un correspondant."}
      "Your turn": {couleur: bleu, legende: "**À toi !** pour donner la parole ou le dé. Pour toi : It's my turn (c'est mon tour)."}
      "Do you understand?": {couleur: violet, legende: "**Tu as compris ?** On le demande après chaque consigne."}
      "Yes, I do!": {couleur: violet, legende: "**Oui !** Si tu n'as pas compris : No, I don't. Can you repeat, please? (Tu peux répéter ?)"}
      "Well done": {couleur: orange, legende: "**Bravo !** pour encourager. On dit aussi Good job! (bon travail)."}
    jules: "Ce sont des phrases toutes faites : on les apprend par cœur, comme une formule magique. Au bout de quelques jeux, elles viennent toutes seules."

  - id: carte
    type: carte
    noeuds:
      - {id: groupe, titre: "Coopérer en anglais", sous_titre: "des petites phrases pour que le groupe avance ensemble", principal: true}
      - {id: accueillir, titre: "Accueillir", sous_titre: "Hello! Welcome! Come and sit here."}
      - {id: organiser, titre: "Organiser", sous_titre: "Let's start! Your turn. Time's up!"}
      - {id: partager, titre: "Partager le matériel", sous_titre: "Can I have the glue, please? Here you are!"}
      - {id: verifier, titre: "Vérifier et encourager", sous_titre: "Do you understand? Well done!"}
    liens:
      - {de: groupe, vers: accueillir}
      - {de: groupe, vers: organiser}
      - {de: groupe, vers: partager}
      - {de: groupe, vers: verifier}
    jules: "Le sourire, un signe de la main ou le pouce levé font aussi partie de la phrase : ils montrent que tu es content de travailler avec les autres."

  - id: schema-table
    type: schema
    titre: "Autour de la table : chacun sa phrase pour faire l'affiche du groupe"
    svg: "cm1-m-participer-travail-collectif.svg"
    jules: "Can I have… please? sert à demander n'importe quel objet : the scissors (les ciseaux), a pencil (un crayon). La réponse polie est toujours **Here you are!**"

  - id: schema-jeu
    type: schema
    titre: "Un jeu en groupe, étape par étape, avec les phrases à dire"
    svg: "cm1-m-participer-travail-collectif-jeu.svg"
    jules: "Si tu n'as pas compris, ce n'est pas grave : **dis-le**. Sorry, can you repeat, please? est une phrase aussi utile que Yes, I do!"

  - id: methode
    type: methode
    etapes:
      - "Accueille les autres avec un mot simple et un sourire : **Hello! Welcome!**"
      - "Lance le travail ou le jeu : Let's start! (on commence !) ou Let's play! (jouons !)"
      - "Donne la parole chacun son tour : Your turn, Ali. Et quand c'est toi : It's my turn!"
      - "Après une consigne, **vérifie** : Do you understand? Chacun répond Yes, I do ou No, I don't."
      - "À la fin, annonce Time's up! (le temps est écoulé) et encourage : Well done, everybody!"
    jules: "Dans un groupe, chaque élève peut avoir un rôle : celui qui donne la parole, celui qui surveille le temps, celui qui vérifie que tout le monde a compris."

  - id: piege
    type: piege
    mauvaise_idee: "Ali explique vite la règle du jeu à Emily, la correspondante anglaise, puis lance le dé sans rien lui demander."
    pourquoi_faux: "Emily n'a peut-être rien compris, mais elle n'ose pas le dire. Sans **vérifier**, le groupe va se tromper ou se disputer."
    bonne_idee: "Ali demande : « Do you understand? » Emily répond « Yes, I do! » ou « Sorry, can you repeat, please? ». Ali répète, en montrant avec les mains."
    jules: "Do you understand? se dit /duː juː ˌʌndəˈstænd/ : la syllabe forte est la dernière, stand."

  - id: exemple-accueil
    type: exemple
    situation: "Des élèves anglais visitent l'école de Mia. Mia accueille Oliver, qui a l'air intimidé."
    calcul: "Hello! Welcome to our school! My name is Mia. Come and sit here, with us."
    conclusion: "Bonjour ! Bienvenue dans notre école ! Je m'appelle Mia. Viens t'asseoir ici, avec nous. Mia a **accueilli** Oliver avec des phrases toutes faites et un geste vers la chaise."
    jules: "En France, on se fait souvent la bise. Au Royaume-Uni, pour une première rencontre, on dit plutôt Hello avec un sourire : c'est une petite différence de politesse."

  - id: exemple-affiche
    type: exemple
    situation: "Le groupe de Léo prépare une affiche sur les animaux. Léo répartit le travail, puis la maîtresse annonce la fin."
    calcul: "Léo : « Inès, you cut. Tom, you glue. I write. Let's start! » Puis : « Time's up! » Léo : « Well done, everybody! »"
    conclusion: "Inès, tu découpes. Tom, tu colles. Moi, j'écris. On commence ! Puis : le temps est écoulé ! Bravo à tous ! Chacun a **son rôle**, et Léo encourage le groupe à la fin."
    jules: "You cut, you glue : pour donner une tâche, il suffit du prénom, de you et du verbe. Court et clair, comme une consigne de sport."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : pendant un jeu de société en famille, utilise au moins trois phrases de la fiche : Let's play!, Your turn!, Well done!"
