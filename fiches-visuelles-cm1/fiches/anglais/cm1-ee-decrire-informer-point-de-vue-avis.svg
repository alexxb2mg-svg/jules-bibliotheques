<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>L'échelle des goûts, puis réagir à un avis : I agree, I disagree</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">De « je déteste » à « j'adore »</text>
<rect x="14.0" y="36.0" width="156.0" height="170.0" rx="10" fill="#FAECE7" stroke="#C2410C" stroke-width="1.5"/>
<circle cx="92.0" cy="76.0" r="26" fill="#FFE9A8" stroke="#C2410C" stroke-width="2.5"/>
<circle cx="82.9" cy="70.8" r="2.34" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="101.1" cy="70.8" r="2.34" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<path d="M81.1 89.0 Q92.0 79.1 102.9 89.0" fill="none" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="77.7" y1="63.0" x2="87.3" y2="66.6" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<line x1="106.3" y1="63.0" x2="96.7" y2="66.6" stroke="#1a1a18" stroke-width="2" stroke-linecap="round"/>
<text x="92.0" y="124.0" font-size="19" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">I hate</text>
<text x="92.0" y="148.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">spinach.</text>
<text x="92.0" y="174.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Je déteste</text>
<text x="92.0" y="192.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">les épinards.</text>
<rect x="178.0" y="36.0" width="156.0" height="170.0" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<circle cx="256.0" cy="76.0" r="26" fill="#FFE9A8" stroke="#854F0B" stroke-width="2.5"/>
<circle cx="246.9" cy="70.8" r="2.34" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="265.1" cy="70.8" r="2.34" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<path d="M247.3 87.7 Q256.0 83.3 264.7 87.7" fill="none" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="256.0" y="124.0" font-size="19" fill="#854F0B" font-weight="700" text-anchor="middle" dominant-baseline="central">I don't like</text>
<text x="256.0" y="148.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">carrots.</text>
<text x="256.0" y="174.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Je n'aime pas</text>
<text x="256.0" y="192.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">les carottes.</text>
<rect x="342.0" y="36.0" width="156.0" height="170.0" rx="10" fill="#EEF5E4" stroke="#5E8E2E" stroke-width="1.5"/>
<circle cx="420.0" cy="76.0" r="26" fill="#FFE9A8" stroke="#5E8E2E" stroke-width="2.5"/>
<circle cx="410.9" cy="70.8" r="2.34" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="429.1" cy="70.8" r="2.34" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<path d="M411.3 83.8 Q420.0 89.0 428.7 83.8" fill="none" stroke="#1a1a18" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420.0" y="124.0" font-size="19" fill="#5E8E2E" font-weight="700" text-anchor="middle" dominant-baseline="central">I like</text>
<text x="420.0" y="148.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">apples.</text>
<text x="420.0" y="174.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">J'aime</text>
<text x="420.0" y="192.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">les pommes.</text>
<rect x="506.0" y="36.0" width="156.0" height="170.0" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<circle cx="584.0" cy="76.0" r="26" fill="#FFE9A8" stroke="#3B6D11" stroke-width="2.5"/>
<circle cx="574.9" cy="70.8" r="2.34" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="593.1" cy="70.8" r="2.34" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<path d="M573.1 81.2 Q584.0 96.8 594.9 81.2 Z" fill="#1a1a18" stroke="#1a1a18" stroke-width="1.5" stroke-linejoin="round"/>
<text x="584.0" y="124.0" font-size="19" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">I love</text>
<text x="584.0" y="148.0" font-size="17" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">chocolate!</text>
<text x="584.0" y="174.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">J'adore le</text>
<text x="584.0" y="192.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">chocolat !</text>
<line x1="40.0" y1="218.0" x2="640.0" y2="218.0" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="340.0" y="236.0" font-size="13" fill="#5f5e5a" font-weight="600" text-anchor="middle" dominant-baseline="central">j'aime de plus en plus</text>
<text x="340.0" y="266.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan font-weight="700">It's good.</tspan><tspan fill="#5f5e5a">  →  </tspan><tspan font-weight="700">It's </tspan><tspan fill="#C2410C" font-weight="700">very</tspan><tspan font-weight="700"> good!</tspan><tspan fill="#5f5e5a">   (c'est bien → c'est très bien !)</tspan></text>
<rect x="14.0" y="290.0" width="652.0" height="170.0" rx="12" fill="#F1EFE8" stroke="none" stroke-width="0"/>
<text x="30.0" y="308.0" font-size="14" fill="#5f5e5a" font-weight="700" text-anchor="start" dominant-baseline="central">Sur le blog de la classe</text>
<rect x="30.0" y="322.0" width="300.0" height="44.0" rx="12" fill="#ffffff" stroke="#185FA5" stroke-width="1.5"/>
<polygon points="52.0,365.0 56.0,382.0 68.0,365.0" fill="#ffffff" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="56.0" y1="382.0" x2="52.0" y2="365.0" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round"/>
<line x1="56.0" y1="382.0" x2="68.0" y2="365.0" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round"/>
<text x="46.0" y="344.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">Léna :</tspan><tspan font-weight="700">  Football is boring.</tspan></text>
<text x="345.0" y="344.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Le foot, c'est ennuyeux.</text>
<circle cx="58.0" cy="416.0" r="16" fill="#3B6D11" stroke="none" stroke-width="1.5"/>
<path d="M50 416 L56 423 L67 408" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="90.0" y="404.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#3B6D11" font-weight="700">Zoé :</tspan><tspan fill="#3B6D11" font-weight="700">  I agree!</tspan></text>
<text x="90.0" y="428.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Je suis d'accord !</text>
<circle cx="368.0" cy="416.0" r="16" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<path d="M361 409 L375 423 M375 409 L361 423" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="400.0" y="404.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#C2410C" font-weight="700">Tim :</tspan><tspan fill="#C2410C" font-weight="700">  I disagree!</tspan><tspan font-weight="700"> It's great!</tspan></text>
<text x="400.0" y="428.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Je ne suis pas d'accord ! C'est génial !</text>
</svg>
