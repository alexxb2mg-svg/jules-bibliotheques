<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg"><title>Question, affirmation, exclamation : la voix dessine la phrase</title>
<defs><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#185FA5" stroke="none"/></marker><marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#C2410C" stroke="none"/></marker><marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9Z" fill="#3B6D11" stroke="none"/></marker></defs>
<text class="tl" x="20.0" y="48.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">Une question</text>
<text class="t" x="20.0" y="74.0" text-anchor="start" dominant-baseline="central" fill="#C2410C" font-weight="700">la voix monte</text>
<text class="t" x="20.0" y="98.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Est-ce que c'est un chat ?</text>
<text class="tx" x="330.0" y="78.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">Is</text>
<text class="tx" x="380.0" y="78.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">it</text>
<text class="tx" x="430.0" y="74.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">a</text>
<text class="tx" x="464.0" y="44.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">cat?</text>
<path d="M330.0 100.0 L366.0 100.0 L380.0 100.0 L416.0 100.0 L430.0 96.0 L450.0 96.0 L464.0 66.0 L532.0 66.0" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ac)"/>
<line x1="20.0" y1="146.0" x2="660.0" y2="146.0" stroke="#e3e1da" stroke-width="1" stroke-linecap="round"/>
<text class="tl" x="20.0" y="178.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">Une affirmation</text>
<text class="t" x="20.0" y="204.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="700">la voix descend</text>
<text class="t" x="20.0" y="228.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">C'est un chien.</text>
<text class="tx" x="330.0" y="208.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">It's</text>
<text class="tx" x="412.0" y="208.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">a</text>
<text class="tx" x="446.0" y="238.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">dog.</text>
<path d="M330.0 230.0 L398.0 230.0 L412.0 230.0 L432.0 230.0 L446.0 260.0 L514.0 260.0" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ab)"/>
<line x1="20.0" y1="276.0" x2="660.0" y2="276.0" stroke="#e3e1da" stroke-width="1" stroke-linecap="round"/>
<text class="tl" x="20.0" y="308.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11">Une exclamation</text>
<text class="t" x="20.0" y="334.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11" font-weight="700">la voix part fort, puis retombe</text>
<text class="t" x="20.0" y="358.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Oh non ! (surprise, peur)</text>
<text class="tx" x="330.0" y="312.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">Oh</text>
<text class="tx" x="380.0" y="346.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">no!</text>
<path d="M330.0 334.0 L366.0 334.0 L380.0 368.0 L432.0 368.0" fill="none" stroke="#3B6D11" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag)"/>
<text class="t" x="340.0" y="408.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">Le trait de couleur suit la hauteur de la voix, mot après mot.</text>
</svg>
