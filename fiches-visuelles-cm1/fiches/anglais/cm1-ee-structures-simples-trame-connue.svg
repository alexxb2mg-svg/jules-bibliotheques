<text x="34.0" y="84.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">Dear</tspan></text>
<rect x="92.0" y="71.0" width="110.0" height="26.0" rx="5" fill="#ffffff" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="206.0" y="84.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">,</tspan></text>
<text x="34.0" y="128.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">I'm in</tspan></text>
<rect x="108.0" y="115.0" width="120.0" height="26.0" rx="5" fill="#ffffff" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="232.0" y="128.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="34.0" y="172.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">It's</tspan></text>
<rect x="84.0" y="159.0" width="100.0" height="26.0" rx="5" fill="#ffffff" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="188.0" y="172.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="34.0" y="216.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">I like</tspan></text>
<rect x="102.0" y="203.0" width="150.0" height="26.0" rx="5" fill="#ffffff" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="256.0" y="216.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="34.0" y="260.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">Love,</tspan></text>
<rect x="34.0" y="291.0" width="110.0" height="26.0" rx="5" fill="#ffffff" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="184.0" y="304.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">(ton prénom)</text>
<text x="386.0" y="84.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">Dear </tspan><tspan fill="#3B6D11" font-weight="700">Mum</tspan><tspan fill="#185FA5" font-weight="700">,</tspan></text>
<text x="386.0" y="128.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">I'm in </tspan><tspan fill="#3B6D11" font-weight="700">Edinburgh</tspan><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="386.0" y="172.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">It's </tspan><tspan fill="#3B6D11" font-weight="700">cold</tspan><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="386.0" y="216.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">I like </tspan><tspan fill="#3B6D11" font-weight="700">the castle</tspan><tspan fill="#185FA5" font-weight="700">.</tspan></text>
<text x="386.0" y="260.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">Love,</tspan></text>
<text x="386.0" y="304.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#3B6D11" font-weight="700">Inès</tspan></text>
<line x1="320.0" y1="196.0" x2="358.0" y2="196.0" stroke="#5F5E5A" stroke-width="2.2" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="340.0" y="374.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">« Chère maman, je suis à Édimbourg. Il fait froid.</text>
<text x="340.0" y="396.0" font-size="16" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">J'aime le château. Bisous, Inès. »</text>
<text x="340.0" y="430.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">Bleu</tspan><tspan> : la trame, qu'on garde.   </tspan><tspan fill="#3B6D11" font-weight="700">Vert</tspan><tspan> : les mots qu'Inès a changés.</tspan></text>
</svg>
