    type: carte
    noeuds:
      - {id: reperes, titre: "Repères culturels", sous_titre: "ce qui est pareil et ce qui change entre la France et les pays où l'on parle anglais", principal: true}
      - {id: uk, titre: "Le Royaume-Uni", sous_titre: "4 nations : England, Scotland, Wales, Northern Ireland"}
      - {id: fetes, titre: "Les fêtes", sous_titre: "Halloween le 31 octobre, Bonfire Night le 5 novembre"}
      - {id: heure, titre: "L'heure", sous_titre: "half past seven = 7 h 30 ; 7 pm = 19 h"}
