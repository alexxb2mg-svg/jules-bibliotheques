    liens:
      - {de: reperes, vers: uk}
      - {de: reperes, vers: fetes}
      - {de: reperes, vers: heure}
      - {de: reperes, vers: date}
    jules: "Une **différence culturelle**, c'est une façon de faire qui change d'un pays à l'autre. Elle n'est ni mieux ni moins bien : elle est juste différente."

  - id: schema-carte
    type: schema
    titre: "Le Royaume-Uni : quatre nations et leurs capitales"
    svg: "cm1-m-identifier-reperes-culturels.svg"
    jules: "Attention : England n'est qu'une partie du Royaume-Uni. Un habitant d'Édimbourg est **Scottish** (écossais), pas English. Pour tout le pays, on dit British (britannique)."

  - id: schema-drapeau
    type: schema
    titre: "Le drapeau du Royaume-Uni, the Union Jack : trois croix l'une sur l'autre"
    svg: "cm1-m-identifier-reperes-culturels-drapeau.svg"
    jules: "Le mot union veut dire que plusieurs pays se sont **unis** : c'est pour ça que leurs croix sont réunies sur un seul drapeau."

  - id: schema-fetes
    type: schema
    titre: "Quatre fêtes de l'automne et de l'hiver dans les pays anglophones"
    svg: "cm1-m-identifier-reperes-culturels-fetes.svg"
    jules: "Bonfire Night ressemble à notre 14 Juillet : des **feux d'artifice** le soir. Mais on ne fête pas la même chose, et pas le même jour."

  - id: methode
    type: methode
    etapes:
      - "Observe le document anglais : une date, une heure, une fête, une carte, un drapeau."
      - "Cherche ce qui est **pareil** qu'en France : Christmas le 25 décembre, des feux d'artifice…"
      - "Cherche ce qui est **différent** : la façon d'écrire la date, de dire l'heure, une fête qu'on ne connaît pas."
      - "Dis-le en une phrase : « En France…, alors qu'au Royaume-Uni… »"
    jules: "Méfie-toi des phrases avec « tous » : « tous les Anglais boivent du thé » n'est pas vrai. Beaucoup de Britanniques aiment le thé, mais pas tous."

  - id: piege
    type: piege
    mauvaise_idee: "L'invitation de Harry dit : « My birthday party: Saturday at 4 pm. » Chloé croit que la fête commence à 4 h du matin."
    pourquoi_faux: "En anglais, on compte souvent les heures de 1 à 12, **deux fois par jour** : am le matin, pm l'après-midi et le soir. 4 pm, c'est donc l'après-midi."
    bonne_idee: "4 pm = 16 h. Pour une heure pm, ajoute 12 : 4 + 12 = 16. La fête commence à **16 h**."
    jules: "Moyen de t'en souvenir : a comme « avant midi », p comme « passé midi ». 9 am, c'est 9 h du matin, l'heure de l'école."

  - id: exemple-date
    type: exemple
    situation: "Emily, une correspondante américaine, écrit : « My birthday is on 03/08. » Tom, qui vit en France, pense qu'elle est née le 3 août."
    calcul: "Aux États-Unis, on écrit **le mois d'abord**, puis le jour : 03/08 = mois 3, jour 8 = March 8th. Au Royaume-Uni, comme en France, 03/08 serait le 3 août."
    conclusion: "Emily est née le **8 mars**. Les mêmes chiffres donnent deux dates différentes : c'est une différence culturelle."
    jules: "À l'oral, on lit la date avec -th : March 8th se dit « March the eighth » ou « the eighth of March »."

  - id: exemple-heure
    type: exemple
    situation: "Dans un livre anglais, Harry dit : « School starts at quarter to nine. » À quelle heure commence son école ?"
    calcul: "quarter = un quart d'heure (15 minutes), to = avant. Un quart d'heure avant 9 h : 9 h − 15 min = 8 h 45."
    conclusion: "L'école de Harry commence à **8 h 45**. Ici, les deux langues se ressemblent : en français, on dit aussi « neuf heures moins le quart »."
    jules: "Et half past seven ? Half, c'est la moitié, past veut dire « après » : une demi-heure après 7 h, donc 7 h 30."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : sur une carte muette du Royaume-Uni, place les 4 nations et leurs capitales. Puis colorie le Union Jack en retrouvant les trois croix."
