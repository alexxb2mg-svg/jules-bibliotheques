<svg width="100%" viewBox="0 0 680 476" xmlns="http://www.w3.org/2000/svg"><title>La recette des pancakes : verbes d'action et ingrédients</title>
<text class="tl" x="340.0" y="16.0" text-anchor="middle" dominant-baseline="central">Pancakes : je lis la recette, je fais les gestes</text>
<rect x="12.0" y="36.0" width="196.0" height="404.0" rx="8" fill="#FAFAF7" stroke="#5F5E5A" stroke-width="1"/>
<text class="tl" x="110.0" y="56.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">You need:</text>
<text class="ts" x="110.0" y="78.0" text-anchor="middle" dominant-baseline="central">(il te faut)</text>
<ellipse cx="40.0" cy="110.0" rx="7.2" ry="9.0" fill="#FFF7E6" stroke="#854F0B" stroke-width="1.3"/>
<ellipse cx="58.0" cy="110.0" rx="7.2" ry="9.0" fill="#FFF7E6" stroke="#854F0B" stroke-width="1.3"/>
<text class="tl" x="80.0" y="110.0" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="700">2</tspan> <tspan fill="#0C447C" font-weight="700">eggs</tspan></text>
<text class="ts" x="80.0" y="132.0" text-anchor="start" dominant-baseline="central">2 œufs</text>
<rect x="28.0" y="152.0" width="40.0" height="36.0" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="ts" x="48.0" y="170.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">flour</text>
<text class="tl" x="80.0" y="166.0" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="700">120 g</tspan></text>
<text class="t" x="80.0" y="188.0" text-anchor="start" dominant-baseline="central">of <tspan fill="#0C447C" font-weight="700">flour</tspan></text>
<text class="ts" x="80.0" y="206.0" text-anchor="start" dominant-baseline="central">120 g de farine</text>
<rect x="38.0" y="226.0" width="20.0" height="36.0" rx="4" fill="#ffffff" stroke="#185FA5" stroke-width="1.5"/>
<rect x="43.0" y="216.0" width="10.0" height="10.0" rx="0" fill="#ffffff" stroke="#185FA5" stroke-width="1.5"/>
<text class="tl" x="80.0" y="240.0" text-anchor="start" dominant-baseline="central"><tspan fill="#1a1a18" font-weight="700">25 cL</tspan></text>
<text class="t" x="80.0" y="262.0" text-anchor="start" dominant-baseline="central">of <tspan fill="#0C447C" font-weight="700">milk</tspan></text>
<text class="ts" x="80.0" y="280.0" text-anchor="start" dominant-baseline="central">25 cL de lait</text>
<line x1="28.0" y1="304.0" x2="192.0" y2="304.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="butt"/>
<path d="M28 330 Q50 356.4 72 330 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t" x="86.0" y="324.0" text-anchor="start" dominant-baseline="central">a <tspan fill="#0C447C" font-weight="700">bowl</tspan></text>
<text class="ts" x="86.0" y="342.0" text-anchor="start" dominant-baseline="central">un saladier</text>
<line x1="34.0" y1="386.0" x2="62.0" y2="372.0" stroke="#5F5E5A" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="62.0" cy="372.0" rx="7" ry="5" fill="#ffffff" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="t" x="86.0" y="370.0" text-anchor="start" dominant-baseline="central">a <tspan fill="#0C447C" font-weight="700">spoon</tspan></text>
<text class="ts" x="86.0" y="388.0" text-anchor="start" dominant-baseline="central">une cuillère</text>
<ellipse cx="44" cy="420" rx="16" ry="5" fill="#5F5E5A" stroke="#1a1a18" stroke-width="1"/>
<line x1="60.0" y1="420.0" x2="76.0" y2="417.0" stroke="#1a1a18" stroke-width="3" stroke-linecap="round"/>
<text class="t" x="86.0" y="412.0" text-anchor="start" dominant-baseline="central">a <tspan fill="#0C447C" font-weight="700">pan</tspan></text>
<text class="ts" x="86.0" y="430.0" text-anchor="start" dominant-baseline="central">une poêle</text>
<rect x="220.0" y="36.0" width="220.0" height="196.0" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="240.0" cy="56.0" r="13" fill="#FAECE7" stroke="#C2410C" stroke-width="1.5"/>
<text class="th" x="240.0" y="56.0" text-anchor="middle" dominant-baseline="central" fill="#B23A0E">1</text>
<text class="tl" x="232.0" y="164.0" text-anchor="start" dominant-baseline="central"><tspan fill="#B23A0E" font-weight="700">Put</tspan> the <tspan fill="#0C447C" font-weight="700">flour</tspan></text>
<text class="tl" x="232.0" y="190.0" text-anchor="start" dominant-baseline="central"> in the <tspan fill="#0C447C" font-weight="700">bowl</tspan>.</text>
<text class="ts" x="232.0" y="216.0" text-anchor="start" dominant-baseline="central">Mets la farine dans le saladier.</text>
<rect x="448.0" y="36.0" width="220.0" height="196.0" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="468.0" cy="56.0" r="13" fill="#FAECE7" stroke="#C2410C" stroke-width="1.5"/>
<text class="th" x="468.0" y="56.0" text-anchor="middle" dominant-baseline="central" fill="#B23A0E">2</text>
<text class="tl" x="460.0" y="164.0" text-anchor="start" dominant-baseline="central"><tspan fill="#B23A0E" font-weight="700">Add</tspan> the <tspan fill="#0C447C" font-weight="700">eggs</tspan>.</text>
<text class="ts" x="460.0" y="216.0" text-anchor="start" dominant-baseline="central">Ajoute les œufs.</text>
<rect x="220.0" y="244.0" width="220.0" height="196.0" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="240.0" cy="264.0" r="13" fill="#FAECE7" stroke="#C2410C" stroke-width="1.5"/>
<text class="th" x="240.0" y="264.0" text-anchor="middle" dominant-baseline="central" fill="#B23A0E">3</text>
<text class="tl" x="232.0" y="372.0" text-anchor="start" dominant-baseline="central"><tspan fill="#B23A0E" font-weight="700">Pour</tspan> the <tspan fill="#0C447C" font-weight="700">milk</tspan>.</text>
<text class="tl" x="232.0" y="398.0" text-anchor="start" dominant-baseline="central"><tspan fill="#B23A0E" font-weight="700">Mix</tspan> with a <tspan fill="#0C447C" font-weight="700">spoon</tspan>.</text>
<text class="ts" x="232.0" y="424.0" text-anchor="start" dominant-baseline="central">Verse le lait. Mélange.</text>
<rect x="448.0" y="244.0" width="220.0" height="196.0" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="468.0" cy="264.0" r="13" fill="#FAECE7" stroke="#C2410C" stroke-width="1.5"/>
<text class="th" x="468.0" y="264.0" text-anchor="middle" dominant-baseline="central" fill="#B23A0E">4</text>
<text class="tl" x="460.0" y="372.0" text-anchor="start" dominant-baseline="central"><tspan fill="#B23A0E" font-weight="700">Cook</tspan> in a <tspan fill="#0C447C" font-weight="700">pan</tspan>.</text>
<text class="tl" x="460.0" y="398.0" text-anchor="start" dominant-baseline="central"><tspan fill="#B23A0E" font-weight="700">Ask</tspan> an adult!</text>
<text class="ts" x="460.0" y="424.0" text-anchor="start" dominant-baseline="central">Fais cuire. Demande à un adulte !</text>
