notion: cm1-ce-traiter-informations-et-agir
titre: "Lire une consigne et agir : Take, Mix, Cut, Turn left"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 9", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "It's": "It is : c'est (It's on your right : c'est sur ta droite)"
blocs:
  - id: formule
    type: formule
    expression: "[Mix] the [eggs].  =  Mélange les œufs."
    termes:
      Mix: {couleur: orange, legende: "le **verbe d'action** : il dit quoi faire. Il est tout au début de la phrase, sans I ni you devant."}
      eggs: {couleur: bleu, legende: "l'**objet** ou l'ingrédient : ce qu'il faut prendre ou utiliser (eggs : des œufs)."}
    jules: "En français aussi, une consigne commence par le verbe : « Mélange », « Découpe », « Tourne ». En anglais, c'est pareil, et le verbe ne change jamais : Mix, Cut, Turn."

  - id: carte
    type: carte
    noeuds:
      - {id: agir, titre: "Lire pour agir", sous_titre: "une recette, un bricolage, un chemin : je fais ce qui est écrit", principal: true}
      - {id: verbes, titre: "Les verbes d'action", sous_titre: "Take, Put, Mix, Cut, Turn : au début de la phrase"}
      - {id: objets, titre: "Les objets", sous_titre: "a pencil, scissors, a bowl, a spoon : quoi prendre ?"}
      - {id: nombres, titre: "Les nombres", sous_titre: "2 eggs, 120 g : combien ?"}
      - {id: ordre, titre: "L'ordre des étapes", sous_titre: "1, 2, 3… : on n'en saute aucune"}
    liens:
      - {de: agir, vers: verbes}
      - {de: agir, vers: objets}
      - {de: agir, vers: nombres}
      - {de: agir, vers: ordre}
    jules: "Ici, tu n'as pas besoin de traduire à voix haute : si ton geste est le bon, c'est que tu as compris. Le geste est la preuve."

  - id: schema-recette
    type: schema
    titre: "La recette des pancakes : un verbe, un objet, un geste"
    svg: "cm1-ce-traiter-informations-et-agir.svg"
    jules: "Les images numérotées sont là pour t'aider : si un mot te bloque, regarde le dessin de la même étape. Pour, par exemple, se devine grâce au lait qui coule : verser."

  - id: schema-plan
    type: schema
    titre: "Suivre un chemin sur un plan : Go straight on, Turn left"
    svg: "cm1-ce-traiter-informations-et-agir-plan.svg"
    jules: "Mets-toi à la place de celui qui marche. En allant vers la gauche du plan, la bibliothèque est en haut, donc sur **ta droite** : fais-le avec ton doigt sur le plan."

  - id: methode
    type: methode
    etapes:
      - "Regarde les **images** et les numéros : ils montrent l'ordre des étapes."
      - "Dans chaque phrase, trouve le **verbe d'action** : c'est le premier mot (Take, Put, Mix, Cut, Fold)."
      - "Trouve ensuite l'objet ou l'ingrédient et le nombre : combien, et de quoi ?"
      - "Fais le geste, une étape après l'autre, sans en sauter aucune."
    jules: "Mémorise les verbes en les mimant : Take (tu prends), Cut (tu fais des ciseaux avec tes doigts), Fold (tu plies), Mix (tu tournes la cuillère)."

  - id: piege
    type: piege
    mauvaise_idee: "Je lis toute la recette d'un coup, puis je mets tout dans le saladier en même temps : œufs, lait et farine."
    pourquoi_faux: "L'**ordre des étapes** compte. Si on verse tout le lait d'un coup sur la farine, la pâte fait des grumeaux (des petites boules)."
    bonne_idee: "Je fais une étape, puis je lis la suivante : Put the flour… puis Add the eggs… puis Pour the milk… et enfin Mix."
    jules: "Attention aussi à deux ustensiles qu'on confond : a spoon, c'est une cuillère ; a knife, c'est un couteau. Dans une recette, se tromper d'outil, ça se voit tout de suite !"

  - id: exemple-bricolage
    type: exemple
    situation: "En classe, Inès lit la fiche de bricolage : « Take a sheet of paper. Fold it in two. Draw a heart. Colour it red. Cut it out with your scissors. » Que doit-elle faire ?"
    calcul: "Take : elle prend une feuille. Fold : elle la plie en deux. Draw : elle dessine un cœur. Colour : elle le colorie en rouge. Cut out : elle le découpe avec ses ciseaux."
    conclusion: "Inès obtient un **cœur rouge** en papier. Cinq phrases, cinq verbes, cinq gestes, dans l'ordre."
    jules: "Scissors (les ciseaux) est toujours au pluriel en anglais, comme en français : on dit your scissors ou a pair of scissors (une paire de ciseaux)."

  - id: exemple-classe
    type: exemple
    situation: "La maîtresse écrit au tableau : « Open your book at page 12. Take your green pencil. Circle the animals. » Que fait Noah ?"
    calcul: "Open your book at page 12 : il ouvre son livre à la page 12. Take your green pencil : il prend son crayon vert. Circle the animals : il entoure les animaux."
    conclusion: "Noah entoure les **animaux** de la page 12 en vert. Il a trouvé le verbe, l'objet et le nombre de chaque consigne."
    jules: "Circle ressemble à « cercle » : entourer, c'est tracer un cercle autour. Beaucoup de consignes se devinent comme ça."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Jeu à deux : l'un donne une consigne en anglais, comme Stand up, Touch your nose ou Turn left. L'autre fait le geste, puis on échange les rôles."
