<svg width="100%" viewBox="0 0 680 446" xmlns="http://www.w3.org/2000/svg"><title>Ma fiche My favourite animal : le manchot décrit, puis mon avis</title>
<rect x="14.0" y="14.0" width="652.0" height="420.0" rx="12" fill="#FBFAF6" stroke="#1a1a18" stroke-width="1.5"/>
<text x="340.0" y="42.0" font-size="21" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">My favourite animal: the penguin</text>
<text x="340.0" y="68.0" font-size="15" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">(mon animal préféré : le manchot)</text>
<rect x="30.0" y="92.0" width="180.0" height="330.0" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
