<ellipse cx="120.0" cy="268.0" rx="31.0" ry="50.0" fill="#ffffff"/>
<circle cx="120.0" cy="186.0" r="32.0" fill="#23272e" stroke="none" stroke-width="1.5"/>
<ellipse cx="108.0" cy="188.0" rx="10.0" ry="12.0" fill="#ffffff"/>
<ellipse cx="132.0" cy="188.0" rx="10.0" ry="12.0" fill="#ffffff"/>
<circle cx="109.0" cy="188.0" r="4.0" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="131.0" cy="188.0" r="4.0" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<polygon points="111.0,200.0 129.0,200.0 120.0,214.0" fill="#E8912D" stroke="#1a1a18" stroke-width="1" stroke-linejoin="round"/>
<line x1="66.0" y1="282.0" x2="80.0" y2="372.0" stroke="#3B6D11" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="80.0" y="386.0" font-size="17" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">a wing</text>
<text x="80.0" y="405.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">(une aile)</text>
<line x1="136.0" y1="296.0" x2="160.0" y2="372.0" stroke="#185FA5" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="160.0" y="386.0" font-size="17" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">white</text>
<text x="160.0" y="405.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">(blanc)</text>
<rect x="226.0" y="92.0" width="426.0" height="68.0" rx="8" fill="#E6F1FB" stroke="none" stroke-width="0"/>
<rect x="226.0" y="92.0" width="6.0" height="68.0" rx="0" fill="#185FA5" stroke="none" stroke-width="0"/>
<text x="244.0" y="107.0" font-size="13" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">comment il est</text>
<text x="244.0" y="128.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">It is</tspan><tspan font-weight="700"> black and white.</tspan></text>
<text x="244.0" y="148.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Il est noir et blanc.</text>
<rect x="226.0" y="168.0" width="426.0" height="68.0" rx="8" fill="#EAF3DE" stroke="none" stroke-width="0"/>
<rect x="226.0" y="168.0" width="6.0" height="68.0" rx="0" fill="#3B6D11" stroke="none" stroke-width="0"/>
<text x="244.0" y="183.0" font-size="13" fill="#3B6D11" font-weight="700" text-anchor="start" dominant-baseline="central">ce qu'il a</text>
<text x="244.0" y="204.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#3B6D11" font-weight="700">It has got</tspan><tspan font-weight="700"> two wings.</tspan></text>
<text x="244.0" y="224.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Il a deux ailes.</text>
<rect x="226.0" y="244.0" width="426.0" height="68.0" rx="8" fill="#FAECE7" stroke="none" stroke-width="0"/>
<rect x="226.0" y="244.0" width="6.0" height="68.0" rx="0" fill="#C2410C" stroke="none" stroke-width="0"/>
<text x="244.0" y="259.0" font-size="13" fill="#C2410C" font-weight="700" text-anchor="start" dominant-baseline="central">ce qu'il sait faire</text>
<text x="244.0" y="280.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#C2410C" font-weight="700">It can</tspan><tspan font-weight="700"> swim. </tspan><tspan fill="#C2410C" font-weight="700">It can't</tspan><tspan font-weight="700"> fly.</tspan></text>
<text x="244.0" y="300.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Il sait nager. Il ne sait pas voler.</text>
<rect x="226.0" y="320.0" width="426.0" height="108.0" rx="8" fill="#EEEDFE" stroke="none" stroke-width="0"/>
<rect x="226.0" y="320.0" width="6.0" height="108.0" rx="0" fill="#534AB7" stroke="none" stroke-width="0"/>
<text x="244.0" y="335.0" font-size="13" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">mon avis</text>
<text x="244.0" y="356.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#534AB7" font-weight="700">I think it's</tspan><tspan font-weight="700"> funny</tspan></text>
<text x="244.0" y="382.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#534AB7" font-weight="700">because</tspan><tspan font-weight="700"> it slides on its tummy.</tspan></text>
<text x="244.0" y="408.0" font-size="14" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Je pense qu'il est drôle parce qu'il glisse sur le ventre.</text>
</svg>
