notion: cm1-eoi-echanger-informations
titre: "Poser des questions et répondre : What's your name? Where do you live?"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 16-17", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "What's": "What is : qu'est-ce que, quel est (What's your name? : quel est ton nom ?)"
  "I'm": "I am : je suis (I'm 10 : j'ai 10 ans)"
  "can't": "cannot : ne peux pas, ne sais pas (No, I can't : non, je ne peux pas)"
  "haven't": "have not : n'ai pas (No, I haven't : non, je n'en ai pas)"
blocs:
  - id: formule
    type: formule
    expression: "[Can] you swim?  →  Yes, I [can].  ou  No, I [can't]."
    termes:
      Can: {couleur: bleu, legende: "le petit mot qui ouvre la question : **sais-tu**, peux-tu. Can you swim? (sais-tu nager ?)"}
      can: {couleur: vert, legende: "la **réponse courte** reprend le même petit mot : Yes, I can (oui)."}
      can't: {couleur: rouge, legende: "pour dire non, on ajoute la négation : No, I can't (non). Se dit /kɑːnt/."}
    jules: "C'est un jeu d'écho : Have you got a pet? donne Yes, I have ou No, I haven't. On renvoie le petit mot de la question, pas toute la phrase."

  - id: carte
    type: carte
    noeuds:
      - {id: echanger, titre: "Échanger en anglais", sous_titre: "poser une question, répondre court, rester poli", principal: true}
      - {id: who, titre: "Who? qui ?", sous_titre: "Who is it? It's my sister."}
      - {id: what, titre: "What? quoi ? quel ?", sous_titre: "What's your name? My name's Hugo."}
      - {id: where, titre: "Where? où ?", sous_titre: "Where do you live? I live in Lille."}
      - {id: when, titre: "When? quand ?", sous_titre: "When is your birthday? In May."}
      - {id: poli, titre: "Please, thank you", sous_titre: "Can I have a pen, please? Thank you!"}
    liens:
      - {de: echanger, vers: who}
      - {de: echanger, vers: what}
      - {de: echanger, vers: where}
      - {de: echanger, vers: when}
      - {de: echanger, vers: poli}
    jules: "Les mots des questions commencent presque tous par **wh** : who, what, where, when. Dans who, le w ne se prononce pas : /huː/."

  - id: schema-dialogue
    type: schema
    titre: "Dans la cour, Emma pose quatre questions à Hugo"
    svg: "cm1-eoi-echanger-informations.svg"
    jules: "Hugo répond court, et c'est très bien : I'm 10 suffit, pas besoin de years old. Ensuite, Hugo peut renvoyer la question avec **And you?** (et toi ?)."

  - id: schema-mots
    type: schema
    titre: "Cinq mots pour poser une question, et ce qu'on répond"
    svg: "cm1-eoi-echanger-informations-mots.svg"
    jules: "Chaque mot attend une réponse précise : une personne pour **Who**, une chose pour What, un lieu pour Where, un moment pour When, un âge pour How old."

  - id: methode
    type: methode
    etapes:
      - "Demande-toi ce que tu veux savoir : une personne, une chose, un lieu, un moment, un âge."
      - "Choisis le mot de la question : **Who**, What, Where, When ou How old."
      - "Pose la question en regardant l'autre, avec la voix qui interroge, puis attends sa réponse."
      - "Pour répondre, fais court : Yes, I can. No, I haven't. In May. I'm 10."
      - "Ajoute un mot poli : **please** pour demander, thank you pour remercier."
    jules: "Si c'est ton tour de répondre et que tu n'es pas sûr, une réponse d'un seul mot, comme Blue ou Lille, est déjà une vraie réponse."

  - id: piege
    type: piege
    mauvaise_idee: "Pour savoir qui est sur la photo, je demande : « What is in the picture? »"
    pourquoi_faux: "**What** demande une chose (quoi ?). Pour une personne, c'est **Who** (qui ?). Avec What, on te répondrait : a dog, a tree."
    bonne_idee: "Who is in the picture? It's my grandma (c'est ma mamie). What is in the picture? A dog (un chien)."
    jules: "Pour t'en souvenir : à **Who**, on répond par un prénom ; à What, par un objet. What se dit /wɒt/, un peu comme « ouate »."

  - id: exemple-photo
    type: exemple
    situation: "Mila montre une photo de vacances à Sacha. Sacha veut savoir qui est dessus, et où elle a été prise."
    calcul: "Sacha : Who is in the picture? Mila : It's my cousin Léo. Sacha : Where is it? Mila : It's in Brittany. Sacha : Wow, it's beautiful!"
    conclusion: "**Who** pour la personne, **Where** pour le lieu. Traduction : Qui est sur la photo ? C'est mon cousin Léo. C'est où ? C'est en Bretagne. Waouh, c'est beau !"
    jules: "Brittany, c'est la Bretagne, et Britain, c'est la Grande-Bretagne. Attention à ne pas les mélanger en vacances !"

  - id: exemple-classe
    type: exemple
    situation: "En classe d'anglais, Yanis a oublié sa gomme. Il demande poliment à Inès s'il peut emprunter la sienne."
    calcul: "Yanis : Can I have your rubber, please? Inès : Yes, here you are. Yanis : Thank you! Inès : You're welcome."
    conclusion: "On demande une permission avec **Can I…, please?** Traduction : Est-ce que je peux avoir ta gomme, s'il te plaît ? Oui, tiens. Merci ! De rien."
    jules: "Rubber, c'est la gomme en anglais britannique. Here you are se dit quand on tend un objet : c'est le « tiens » ou le « voilà » du français."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi à deux : pose 4 questions à un copain (name, age, town, pet) et note ses réponses. Puis échangez les rôles."
