<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>La carte postale de Chloé : mots transparents, nombres, qui ? où ? quand ?</title>
<text class="tl" x="250.0" y="18.0" text-anchor="middle" dominant-baseline="central">La carte postale de Chloé</text>
<rect x="20.0" y="40.0" width="470.0" height="292.0" rx="6" fill="#FFFDF6" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="322.0" y1="60.0" x2="322.0" y2="312.0" stroke="#5F5E5A" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text class="tl" x="36.0" y="66.0" text-anchor="start" dominant-baseline="central">Dear Grandma,</text>
<text class="tl" x="36.0" y="95.0" text-anchor="start" dominant-baseline="central">I am in <tspan fill="#27500A" font-weight="700">London</tspan> with</text>
<text class="tl" x="36.0" y="124.0" text-anchor="start" dominant-baseline="central">my <tspan fill="#27500A" font-weight="700">family</tspan>. It is sunny!</text>
<text class="tl" x="36.0" y="153.0" text-anchor="start" dominant-baseline="central"><tspan fill="#0C447C" font-weight="700">Today</tspan>, we visit the <tspan fill="#27500A" font-weight="700">zoo</tspan>.</text>
<text class="tl" x="36.0" y="182.0" text-anchor="start" dominant-baseline="central">I see a <tspan fill="#27500A" font-weight="700">giraffe</tspan> and</text>
<text class="tl" x="36.0" y="211.0" text-anchor="start" dominant-baseline="central"><tspan fill="#B23A0E" font-weight="700">two</tspan> <tspan fill="#27500A" font-weight="700">lions</tspan>.</text>
<text class="tl" x="36.0" y="240.0" text-anchor="start" dominant-baseline="central"><tspan fill="#0C447C" font-weight="700">Tomorrow</tspan>, we go to</text>
<text class="tl" x="36.0" y="269.0" text-anchor="start" dominant-baseline="central">the <tspan fill="#27500A" font-weight="700">museum</tspan>.</text>
<text class="tl" x="36.0" y="298.0" text-anchor="start" dominant-baseline="central">Love, Chloé</text>
<rect x="410.0" y="54.0" width="62.0" height="74.0" rx="0" fill="#FAECE7" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="3 2"/>
<rect x="432.0" y="76.0" width="18.0" height="44.0" rx="0" fill="#ffffff" stroke="#C2410C" stroke-width="1.2"/>
<polygon points="430.0,76.0 441.0,60.0 452.0,76.0" fill="#ffffff" stroke="#C2410C" stroke-width="1.2" stroke-linejoin="round"/>
<circle cx="441.0" cy="88.0" r="5" fill="none" stroke="#C2410C" stroke-width="1.2"/>
<circle cx="378.0" cy="92.0" r="22" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="378.0" y="92.0" text-anchor="middle" dominant-baseline="central">UK</text>
<line x1="336.0" y1="196.0" x2="478.0" y2="196.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="butt"/>
<text class="t" x="340.0" y="186.0" text-anchor="start" dominant-baseline="central">Mrs Martin</text>
<line x1="336.0" y1="226.0" x2="478.0" y2="226.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="butt"/>
<text class="t" x="340.0" y="216.0" text-anchor="start" dominant-baseline="central">12 rue des Lilas</text>
<line x1="336.0" y1="256.0" x2="478.0" y2="256.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="butt"/>
<text class="t" x="340.0" y="246.0" text-anchor="start" dominant-baseline="central">35000 Rennes</text>
<line x1="336.0" y1="286.0" x2="478.0" y2="286.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="butt"/>
<text class="t" x="340.0" y="276.0" text-anchor="start" dominant-baseline="central">FRANCE</text>
<line x1="474.0" y1="90.0" x2="504.0" y2="90.0" stroke="#88877f" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<text class="t" x="510.0" y="72.0" text-anchor="start" dominant-baseline="central">Un timbre et</text>
<text class="t" x="510.0" y="90.0" text-anchor="start" dominant-baseline="central">une adresse :</text>
<text class="th" x="510.0" y="110.0" text-anchor="start" dominant-baseline="central">une carte postale !</text>
<line x1="492.0" y1="228.0" x2="504.0" y2="228.0" stroke="#88877f" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<text class="t" x="510.0" y="210.0" text-anchor="start" dominant-baseline="central">Dear = cher, chère</text>
<text class="t" x="510.0" y="228.0" text-anchor="start" dominant-baseline="central">Love = je t'embrasse</text>
<text class="ts" x="510.0" y="246.0" text-anchor="start" dominant-baseline="central">(au début et à la fin)</text>
<text class="t" x="510.0" y="270.0" text-anchor="start" dominant-baseline="central" fill="#27500A">vert = mots</text>
<text class="t" x="510.0" y="288.0" text-anchor="start" dominant-baseline="central" fill="#27500A">transparents</text>
<text class="t" x="510.0" y="310.0" text-anchor="start" dominant-baseline="central" fill="#B23A0E">orange = nombre</text>
<text class="t" x="510.0" y="330.0" text-anchor="start" dominant-baseline="central" fill="#0C447C">bleu = quand ?</text>
<rect x="20.0" y="350.0" width="152.0" height="100.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="tl" x="96.0" y="372.0" text-anchor="middle" dominant-baseline="central">Qui ?</text>
<text class="t" x="96.0" y="402.0" text-anchor="middle" dominant-baseline="central">Chloé et sa famille</text>
<text class="t" x="96.0" y="424.0" text-anchor="middle" dominant-baseline="central">(my family)</text>
<rect x="184.0" y="350.0" width="152.0" height="100.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="tl" x="260.0" y="372.0" text-anchor="middle" dominant-baseline="central">Où ?</text>
<text class="t" x="260.0" y="402.0" text-anchor="middle" dominant-baseline="central">à Londres</text>
<text class="t" x="260.0" y="424.0" text-anchor="middle" dominant-baseline="central">(London), au zoo</text>
<rect x="348.0" y="350.0" width="152.0" height="100.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="tl" x="424.0" y="372.0" text-anchor="middle" dominant-baseline="central">Quand ?</text>
<text class="t" x="424.0" y="402.0" text-anchor="middle" dominant-baseline="central">aujourd'hui : le zoo</text>
<text class="t" x="424.0" y="424.0" text-anchor="middle" dominant-baseline="central">demain : le musée</text>
<rect x="512.0" y="350.0" width="152.0" height="100.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="tl" x="588.0" y="372.0" text-anchor="middle" dominant-baseline="central">Quoi ?</text>
<text class="t" x="588.0" y="402.0" text-anchor="middle" dominant-baseline="central">une girafe</text>
<text class="t" x="588.0" y="424.0" text-anchor="middle" dominant-baseline="central">et deux lions</text>
</svg>
