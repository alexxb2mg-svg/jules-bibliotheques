notion: cm1-ce-identifier-trame-narrative
titre: "Suivre une histoire en anglais : Once upon a time, One day, Suddenly, In the end"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 8", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "isn't": "is not : n'est pas (He isn't happy : il n'est pas content)"
  "doesn't": "does not : ne… pas, avec he, she, it (He doesn't like rain : il n'aime pas la pluie)"
  "don't": "do not : ne… pas, avec I, you, we, they (I don't like rain : je n'aime pas la pluie)"
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: trame, titre: "La trame d'une histoire", sous_titre: "le chemin de l'histoire, du début à la fin", principal: true}
      - {id: debut, titre: "Le début", sous_titre: "Once upon a time… qui ? où ?"}
      - {id: probleme, titre: "Le problème", sous_titre: "One day… Suddenly… il se passe quelque chose"}
      - {id: fin, titre: "La fin", sous_titre: "In the end… comment ça se termine"}
      - {id: mots, titre: "Les petits mots qui comptent", sous_titre: "and ajoute, but oppose, not dit le contraire"}
    liens:
      - {de: trame, vers: debut}
      - {de: trame, vers: probleme}
      - {de: trame, vers: fin}
      - {de: trame, vers: mots}
    jules: "La **trame**, c'est le squelette de l'histoire : un début, un problème, une fin. Les contes français suivent le même chemin : Il était une fois… Un jour… Soudain… À la fin…"

  - id: schema-vignettes
    type: schema
    titre: "L'histoire de Max en 4 images : chaque étape a son mot de départ"
    svg: "cm1-ce-identifier-trame-narrative.svg"
    jules: "Regarde les images avant de lire : le soleil, puis la pluie, puis le lit racontent déjà l'histoire. Le texte anglais vient confirmer ce que tu as deviné."

  - id: schema-not
    type: schema
    titre: "not dit le contraire ; and ajoute, but s'oppose"
    svg: "cm1-ce-identifier-trame-narrative-not.svg"
    jules: "Quand tu vois n't collé à un verbe, c'est **not** raccourci. Imagine un panneau rouge STOP : la phrase dit le contraire de ce qu'elle dirait sans lui."

  - id: methode
    type: methode
    etapes:
      - "Regarde toutes les **images** dans l'ordre, et raconte-toi l'histoire en français."
      - "Repère les **mots de départ** de chaque étape : Once upon a time, One day, Suddenly, In the end."
      - "Cherche les petits mots **not** (ou n't), and et but, et regarde ce qu'ils changent."
      - "Résume l'histoire en trois phrases : le début, le problème, la fin."
    jules: "Les verbes de tous les jours t'aident aussi : eat (manger), drink (boire), sleep (dormir), play (jouer). Mime-les en lisant pour t'en souvenir."

  - id: piege
    type: piege
    mauvaise_idee: "Je lis « The rabbit doesn't want to play. » et je comprends : le lapin veut jouer."
    pourquoi_faux: "Dans doesn't, il y a **not** caché (does not). La phrase est **négative** : elle dit le contraire."
    bonne_idee: "The rabbit doesn't want to play : le lapin ne veut pas jouer. Je cherche toujours not ou n't avant de répondre."
    jules: "Compare avec « The rabbit wants to play » (le lapin veut jouer) : un seul petit n't change tout. C'est le piège numéro 1 des histoires en anglais."

  - id: exemple-gateau
    type: exemple
    situation: "Remets l'histoire de Tom dans l'ordre. A. In the end, they make a new cake and they eat it. B. Once upon a time, there is a boy. His name is Tom. C. Suddenly, the cake falls on the floor! D. One day, Tom and his dad make a chocolate cake."
    calcul: "Once upon a time ouvre l'histoire : B. One day lance l'action : D. Suddenly amène le problème : C. In the end donne la fin : A."
    conclusion: "L'ordre est **B, D, C, A**. Tom et son papa font un gâteau au chocolat, il tombe par terre, alors ils en font un nouveau et le mangent."
    jules: "Chocolate est un mot transparent : il ressemble à « chocolat ». Floor (le sol), tu peux le deviner : quand un gâteau tombe, il tombe par terre !"

  - id: exemple-lily
    type: exemple
    situation: "Tu lis : « Lily has a little brother. He is funny, but he doesn't like school. » Le petit frère de Lily aime-t-il l'école ?"
    calcul: "He is funny : il est drôle. But annonce une idée contraire. Doesn't contient not : he doesn't like school, il n'aime pas l'école."
    conclusion: "Non : le petit frère de Lily est **drôle**, mais il **n'aime pas** l'école."
    jules: "Les mots du caractère reviennent souvent dans les histoires : funny (drôle), nice (gentil), friendly (sympa), sad (triste)."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : raconte un conte que tu connais bien (Le Petit Chaperon rouge) en commençant chaque étape par Once upon a time, One day, Suddenly, In the end."
