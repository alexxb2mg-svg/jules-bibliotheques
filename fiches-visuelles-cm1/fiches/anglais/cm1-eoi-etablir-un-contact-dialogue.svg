<svg width="100%" viewBox="0 0 680 468" xmlns="http://www.w3.org/2000/svg"><title>Un dialogue dans la cour : ouvrir, relancer, être poli, se quitter</title>
<rect x="56.0" y="8.0" width="476.0" height="50.0" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<polygon points="74.0,57.0 60.0,70.0 90.0,57.0" fill="#E6F1FB" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<path d="M74 58 L60 70 L90 58" fill="none" stroke="#185FA5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="70.0" y="26.0" text-anchor="start" dominant-baseline="central"><tspan fill="#5F5E5A" font-weight="700">Léo : </tspan><tspan fill="#0C447C" font-weight="700">Hi! I'm Léo. What's your name?</tspan></text>
<text class="t" x="70.0" y="45.0" text-anchor="start" dominant-baseline="central">Salut ! Je suis Léo. Comment t'appelles-tu ?</text>
<circle cx="26.0" cy="60.0" r="13" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
<text class="th" x="26.0" y="60.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">L</text>
<text class="t" x="544.0" y="34.0" text-anchor="start" dominant-baseline="central" fill="#0C447C">saluer</text>
<rect x="148.0" y="70.0" width="476.0" height="50.0" rx="14" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<polygon points="606.0,119.0 620.0,132.0 590.0,119.0" fill="#E6F1FB" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<path d="M606 120 L620 132 L590 120" fill="none" stroke="#185FA5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="162.0" y="88.0" text-anchor="start" dominant-baseline="central"><tspan fill="#5F5E5A" font-weight="700">Emma : </tspan><tspan fill="#0C447C" font-weight="700">Hello Léo! My name is Emma.</tspan></text>
<text class="t" x="162.0" y="107.0" text-anchor="start" dominant-baseline="central">Bonjour Léo ! Je m'appelle Emma.</text>
<circle cx="654.0" cy="122.0" r="13" fill="#ffffff" stroke="#C2410C" stroke-width="2"/>
<text class="th" x="654.0" y="122.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">E</text>
<text class="t" x="136.0" y="87.5" text-anchor="end" dominant-baseline="central" fill="#0C447C">saluer,</text>
<text class="t" x="136.0" y="104.5" text-anchor="end" dominant-baseline="central" fill="#0C447C">se présenter</text>
<rect x="56.0" y="132.0" width="476.0" height="50.0" rx="14" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
<polygon points="74.0,181.0 60.0,194.0 90.0,181.0" fill="#EAF3DE" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<path d="M74 182 L60 194 L90 182" fill="none" stroke="#3B6D11" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="70.0" y="150.0" text-anchor="start" dominant-baseline="central"><tspan fill="#5F5E5A" font-weight="700">Léo : </tspan><tspan fill="#27500A" font-weight="700">Nice to meet you! Where are you from?</tspan></text>
<text class="t" x="70.0" y="169.0" text-anchor="start" dominant-baseline="central">Enchanté ! D'où viens-tu ?</text>
<circle cx="26.0" cy="184.0" r="13" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
<text class="th" x="26.0" y="184.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">L</text>
<text class="t" x="544.0" y="149.5" text-anchor="start" dominant-baseline="central" fill="#27500A">relancer par</text>
<text class="t" x="544.0" y="166.5" text-anchor="start" dominant-baseline="central" fill="#27500A">une question</text>
<rect x="148.0" y="194.0" width="476.0" height="50.0" rx="14" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
<polygon points="606.0,243.0 620.0,256.0 590.0,243.0" fill="#EAF3DE" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<path d="M606 244 L620 256 L590 244" fill="none" stroke="#3B6D11" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="162.0" y="212.0" text-anchor="start" dominant-baseline="central"><tspan fill="#5F5E5A" font-weight="700">Emma : </tspan><tspan fill="#27500A" font-weight="700">I'm from London.</tspan></text>
<text class="t" x="162.0" y="231.0" text-anchor="start" dominant-baseline="central">Je viens de Londres.</text>
<circle cx="654.0" cy="246.0" r="13" fill="#ffffff" stroke="#C2410C" stroke-width="2"/>
<text class="th" x="654.0" y="246.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">E</text>
<text class="t" x="136.0" y="220.0" text-anchor="end" dominant-baseline="central" fill="#27500A">répondre</text>
<rect x="56.0" y="256.0" width="476.0" height="50.0" rx="14" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
<polygon points="74.0,305.0 60.0,318.0 90.0,305.0" fill="#EAF3DE" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<path d="M74 306 L60 318 L90 306" fill="none" stroke="#3B6D11" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="70.0" y="274.0" text-anchor="start" dominant-baseline="central"><tspan fill="#5F5E5A" font-weight="700">Léo : </tspan><tspan fill="#27500A" font-weight="700">Do you want a cookie?</tspan></text>
<text class="t" x="70.0" y="293.0" text-anchor="start" dominant-baseline="central">Tu veux un biscuit ?</text>
<circle cx="26.0" cy="308.0" r="13" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
<text class="th" x="26.0" y="308.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">L</text>
<text class="t" x="544.0" y="282.0" text-anchor="start" dominant-baseline="central" fill="#27500A">proposer</text>
<rect x="148.0" y="318.0" width="476.0" height="50.0" rx="14" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.2"/>
<polygon points="606.0,367.0 620.0,380.0 590.0,367.0" fill="#EAF3DE" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<path d="M606 368 L620 380 L590 368" fill="none" stroke="#3B6D11" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="162.0" y="336.0" text-anchor="start" dominant-baseline="central"><tspan fill="#5F5E5A" font-weight="700">Emma : </tspan><tspan fill="#27500A" font-weight="700">Yes, please! Thank you!</tspan></text>
<text class="t" x="162.0" y="355.0" text-anchor="start" dominant-baseline="central">Oui, s'il te plaît ! Merci !</text>
<circle cx="654.0" cy="370.0" r="13" fill="#ffffff" stroke="#C2410C" stroke-width="2"/>
<text class="th" x="654.0" y="370.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C">E</text>
<text class="t" x="136.0" y="335.5" text-anchor="end" dominant-baseline="central" fill="#27500A">accepter</text>
<text class="t" x="136.0" y="352.5" text-anchor="end" dominant-baseline="central" fill="#27500A">poliment</text>
<rect x="56.0" y="380.0" width="476.0" height="50.0" rx="14" fill="#FAECE7" stroke="#C2410C" stroke-width="1.2"/>
<polygon points="74.0,429.0 60.0,442.0 90.0,429.0" fill="#FAECE7" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<path d="M74 430 L60 442 L90 430" fill="none" stroke="#C2410C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="70.0" y="398.0" text-anchor="start" dominant-baseline="central"><tspan fill="#5F5E5A" font-weight="700">Léo : </tspan><tspan fill="#B23A0E" font-weight="700">Oh, the bell! Bye, Emma! See you!</tspan></text>
<text class="t" x="70.0" y="417.0" text-anchor="start" dominant-baseline="central">Oh, la sonnerie ! Au revoir, Emma ! À plus !</text>
<circle cx="26.0" cy="432.0" r="13" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
<text class="th" x="26.0" y="432.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5">L</text>
<text class="t" x="544.0" y="406.0" text-anchor="start" dominant-baseline="central" fill="#B23A0E">se quitter</text>
<text class="t" x="340.0" y="454.0" text-anchor="middle" dominant-baseline="central">Bleu : ouvrir l'échange. Vert : relancer, être poli. Orange : se quitter.</text>
</svg>
