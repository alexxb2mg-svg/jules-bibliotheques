<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Au niveau A1, je sais... : une vraie phrase pour chaque activité</title>
<rect x="10.0" y="8.0" width="326.0" height="138.0" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="34.0" cy="32.0" r="12" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<path d="M28 32 L33 37 L41 27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="54.0" y="32.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">CO · j'écoute</text>
<text class="t" x="26.0" y="60.0" text-anchor="start" dominant-baseline="central" font-weight="600">Je comprends une consigne dite lentement.</text>
<text class="t" x="26.0" y="84.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="700">« Sit down, please. »</text>
<text class="t" x="26.0" y="105.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Assieds-toi, s'il te plaît.</text>
<rect x="344.0" y="8.0" width="326.0" height="138.0" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="368.0" cy="32.0" r="12" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<path d="M362 32 L367 37 L375 27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="388.0" y="32.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">EOC · je parle seul</text>
<text class="t" x="360.0" y="60.0" text-anchor="start" dominant-baseline="central" font-weight="600">Je me présente en phrases très simples.</text>
<text class="t" x="360.0" y="84.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="700">« My name is Jade. I'm 9.</text>
<text class="t" x="360.0" y="103.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="700">I like horses. »</text>
<text class="ts" x="360.0" y="124.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Je m'appelle Jade. J'ai 9 ans. J'aime les chevaux.</text>
<rect x="10.0" y="154.0" width="326.0" height="138.0" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="34.0" cy="178.0" r="12" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<path d="M28 178 L33 183 L41 173" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="54.0" y="178.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">EOI · je dialogue</text>
<text class="t" x="26.0" y="206.0" text-anchor="start" dominant-baseline="central" font-weight="600">Je réponds à une question simple.</text>
<text class="t" x="26.0" y="230.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="700">« What's your name? »</text>
<text class="t" x="26.0" y="249.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="700">« Adam. And you? »</text>
<text class="t" x="26.0" y="270.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Comment t'appelles-tu ? Adam. Et toi ?</text>
<rect x="344.0" y="154.0" width="326.0" height="138.0" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<circle cx="368.0" cy="178.0" r="12" fill="#3B6D11" stroke="none" stroke-width="1.5"/>
<path d="M362 178 L367 183 L375 173" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="388.0" y="178.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11">CE · je lis</text>
<text class="t" x="360.0" y="206.0" text-anchor="start" dominant-baseline="central" font-weight="600">Je lis des mots et des phrases très courtes.</text>
<text class="t" x="360.0" y="230.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11" font-weight="700">« Happy birthday! »</text>
<text class="t" x="360.0" y="251.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Joyeux anniversaire !</text>
<rect x="10.0" y="300.0" width="326.0" height="138.0" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<circle cx="34.0" cy="324.0" r="12" fill="#3B6D11" stroke="none" stroke-width="1.5"/>
<path d="M28 324 L33 329 L41 319" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="54.0" y="324.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11">EE · j'écris</text>
<text class="t" x="26.0" y="352.0" text-anchor="start" dominant-baseline="central" font-weight="600">Je remplis une fiche sur moi.</text>
<text class="t" x="26.0" y="376.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11" font-weight="700">Name: Jade</text>
<text class="t" x="26.0" y="395.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11" font-weight="700">Age: 9</text>
<text class="t" x="26.0" y="416.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">Nom : Jade, âge : 9 ans</text>
<rect x="344.0" y="300.0" width="326.0" height="138.0" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<circle cx="368.0" cy="324.0" r="12" fill="#534AB7" stroke="none" stroke-width="1.5"/>
<path d="M362 324 L367 329 L375 319" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="388.0" y="324.0" text-anchor="start" dominant-baseline="central" fill="#534AB7">M · j'aide à comprendre</text>
<text class="t" x="360.0" y="352.0" text-anchor="start" dominant-baseline="central" font-weight="600">Je dis en français le sens d'un mot affiché.</text>
<text class="t" x="360.0" y="376.0" text-anchor="start" dominant-baseline="central" fill="#534AB7" font-weight="700">« Closed » sur la porte</text>
<text class="t" x="360.0" y="397.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">→ « C'est fermé ! »</text>
<text class="t" x="340.0" y="456.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">Au niveau A1 : des phrases courtes, apprises en classe, sur toi et ton entourage.</text>
</svg>
