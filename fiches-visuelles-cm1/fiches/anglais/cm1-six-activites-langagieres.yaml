notion: cm1-six-activites-langagieres
titre: "Écouter, parler, dialoguer, lire, écrire, aider : les six activités en anglais"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de langues vivantes étrangères et régionales pour le cours moyen, arrêté du 26-2-2026, BO n° 12 du 19/03/2026, p. 1", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  CO: "compréhension de l'oral : écouter et comprendre"
  EOC: "expression orale en continu : parler seul, sans que quelqu'un réponde"
  EOI: "expression orale en interaction : parler avec quelqu'un, chacun son tour"
  CE: "compréhension de l'écrit : lire et comprendre"
  EE: "expression écrite : écrire"
  M: "médiation : aider quelqu'un à comprendre, en passant d'une langue à l'autre"
blocs:
  - id: sigles
    type: formule
    expression: "[CO] [CE] je comprends · [EOC] [EOI] [EE] je m'exprime · [M] j'aide"
    termes:
      CO: {couleur: bleu, legende: "**compréhension de l'oral** : j'écoute une histoire, une chanson, une consigne comme « Listen! » (Écoute !)"}
      CE: {couleur: vert, legende: "**compréhension de l'écrit** : je lis une carte, un menu, une petite BD en anglais"}
      EOC: {couleur: bleu, legende: "**expression orale en continu** : je parle seul, par exemple pour me présenter devant la classe"}
      EOI: {couleur: bleu, legende: "**expression orale en interaction** : je parle avec quelqu'un, il me répond, je lui réponds"}
      EE: {couleur: vert, legende: "**expression écrite** : je copie un mot, j'écris une phrase simple sur une carte"}
      M: {couleur: violet, legende: "**médiation** : j'aide quelqu'un à comprendre, en disant en français ce que veut dire une phrase anglaise"}
    jules: "Les lettres se devinent : C comme **comprendre**, E comme **expression**, O comme oral. EOC et EOI commencent pareil : c'est la dernière lettre qui dit si tu parles seul (continu) ou avec quelqu'un (interaction)."

  - id: carte
    type: carte
    noeuds:
      - {id: anglais, titre: "Six activités en anglais", sous_titre: "on ne fait pas qu'apprendre des mots", principal: true}
      - {id: ecouter, titre: "Écouter (CO)", sous_titre: "une consigne, une histoire, une chanson"}
      - {id: parler, titre: "Parler seul ou à deux (EOC, EOI)", sous_titre: "« I'm 9. » ou « How old are you? »"}
      - {id: ecrit, titre: "Lire et écrire (CE, EE)", sous_titre: "une carte d'anniversaire, un petit mot"}
      - {id: aider, titre: "Aider à comprendre (M)", sous_titre: "dire en français ce que veut dire un panneau"}
    liens:
      - {de: anglais, vers: ecouter}
      - {de: anglais, vers: parler}
      - {de: anglais, vers: ecrit}
      - {de: anglais, vers: aider}
    jules: "Dans une même séance d'anglais, tu passes souvent par plusieurs activités : tu écoutes une chanson, tu la chantes, puis tu lis les paroles. Chaque activité entraîne une partie différente de toi : tes oreilles, ta bouche, tes yeux, ta main."

  - id: schema-situations
    type: schema
    titre: "Six situations de classe, six activités, une vraie phrase anglaise pour chacune"
    svg: "cm1-six-activites-langagieres.svg"
    jules: "Regarde la couleur : bleu quand ça passe par la voix et les oreilles, vert quand ça passe par les yeux et la main. La médiation est à part, en violet : elle sert de pont entre l'anglais et le français."

  - id: schema-tete
    type: schema
    titre: "Ce qui entre dans ta tête (comprendre) et ce qui en sort (s'exprimer)"
    svg: "cm1-six-activites-langagieres-tete.svg"
    jules: "Comprendre vient toujours avant : on ne peut pas dire « I'm 9 » avant de l'avoir entendu plusieurs fois. C'est pour cela qu'en anglais, on **écoute beaucoup** avant de parler."

  - id: methode
    type: methode
    etapes:
      - "Est-ce que j'**écoute** (CO) ou est-ce que je **lis** (CE) ? Oreilles ou yeux ?"
      - "Est-ce que je **parle seul** (EOC), ou est-ce que quelqu'un me répond (EOI) ?"
      - "Est-ce que j'écris (EE), même un seul mot, comme le nom d'une couleur sous un dessin ?"
      - "Est-ce que j'aide quelqu'un à comprendre, en disant le sens en français (M) ?"
      - "Je choisis ma façon de faire : à l'oral, j'écoute la voix et je regarde les gestes ; à l'écrit, je relis et je regarde les images."
    jules: "Savoir quelle activité tu fais t'aide à choisir la bonne astuce. Une chanson, tu peux la réécouter ; une carte, tu peux la relire autant de fois que tu veux."

  - id: piege
    type: piege
    mauvaise_idee: "« Je me présente devant la classe : Hello, my name is Lucas. Quelqu'un m'écoute, donc c'est un dialogue (EOI). »"
    pourquoi_faux: "Pour dialoguer, il faut que l'autre **te réponde**. Si tu parles seul et que la classe écoute sans rien dire, c'est de l'**expression orale en continu** (EOC)."
    bonne_idee: "Lucas se présente seul : EOC. Lucas demande « What's your name? » à Jade, elle répond « My name is Jade. » : EOI."
    jules: "Un truc simple : compte les personnes qui parlent. Une seule voix, c'est EOC ; deux voix qui se répondent, c'est EOI."

  - id: exemple-journee
    type: exemple
    situation: "Mardi, en anglais, Chloé écoute la chanson « Hello, how are you? ». Puis elle lit une carte postale de Londres : « Hi! London is great! ». Enfin, Hugo lui demande « What's your favourite colour? » et elle répond « Blue! »."
    calcul: "La chanson : elle écoute, c'est de la CO. La carte postale : elle lit, c'est de la CE. Hugo pose une question et Chloé répond : deux personnes qui se parlent, c'est de l'EOI."
    conclusion: "En une seule séance, Chloé a travaillé **trois activités** : CO, CE et EOI."
    jules: "La question « What's your favourite colour » veut dire « quelle est ta couleur préférée », et la réponse « Blue » veut dire « bleu ». En anglais, le point d'interrogation se colle au dernier mot, sans espace."

  - id: exemple-mediation
    type: exemple
    situation: "En vacances à Londres, Nathan et sa mamie arrivent devant les singes du zoo. Un panneau dit : « Please don't feed the animals ». Mamie ne parle pas anglais."
    calcul: "Nathan connaît don't (ne... pas) et animals (les animaux). Il voit des gens avec de la nourriture sur le dessin du panneau, barré d'une croix. Il dit à Mamie : « Il ne faut pas donner à manger aux animaux. »"
    conclusion: "Nathan a fait de la **médiation** (M) : il n'a pas traduit chaque mot, il a fait passer **le sens** du panneau en français."
    jules: "La médiation, ce n'est pas traduire mot à mot. Nathan n'a pas dit « s'il vous plaît », et Mamie a quand même tout compris."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi pour la prochaine séance d'anglais : note sur ton cahier de brouillon les activités que tu fais, avec leurs lettres. Tu verras vite lesquelles reviennent le plus souvent."
