notion: cm1-eoc-decrire-environnement-et-gouts
titre: "Décrire ma chambre ou ma cour : There is, There are, et ce que j'aime"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
