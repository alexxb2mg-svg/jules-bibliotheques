sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 15-16", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "don't": "do not : ne... pas (I don't like : je n'aime pas)"
blocs:
  - id: formule
    type: formule
    expression: "[There is] a bed.   [There are] two chairs."
    termes:
      There is: {couleur: bleu, legende: "**il y a**, pour UN seul objet : There is a bed (il y a un lit)."}
      There are: {couleur: vert, legende: "**il y a** aussi, mais pour PLUSIEURS objets : There are two chairs (il y a deux chaises)."}
    jules: "En français, on dit « il y a » dans les deux cas. En anglais, on compte d'abord : un seul, c'est **is** ; deux ou plus, c'est **are**. There se dit /ðeə/, avec le th de this."

  - id: carte
    type: carte
    noeuds:
      - {id: decrire, titre: "Décrire ce qui m'entoure", sous_titre: "ma chambre, ma cour, ma ville", principal: true}
      - {id: combien, titre: "Un ou plusieurs ?", sous_titre: "There is a desk. There are two posters."}
      - {id: ou, titre: "Où est-ce ?", sous_titre: "on (sur), under (sous), next to (à côté de), in (dans)"}
      - {id: gouts, titre: "Ce que j'en pense", sous_titre: "I love, I like, I don't like, I hate"}
      - {id: relier, titre: "Relier", sous_titre: "and (et), or (ou) : a park and a pool"}
    liens:
      - {de: decrire, vers: combien}
      - {de: decrire, vers: ou}
      - {de: decrire, vers: gouts}
      - {de: decrire, vers: relier}
    jules: "Une bonne description suit ton regard : d'abord le plus gros objet, puis ce qui est dessus, dessous, à côté. Et tu finis par ce que tu aimes."

  - id: schema-chambre
    type: schema
    titre: "La chambre de Nina : il y a quoi, et où ?"
    svg: "cm1-eoc-decrire-environnement-et-gouts.svg"
    jules: "Regarde le chat et le ballon : même lit, mais **on** (dessus) pour l'un et **under** (dessous) pour l'autre. Under se dit /ˈʌndə/ : le r final ne s'entend presque pas."

  - id: schema-gouts
    type: schema
    titre: "L'échelle des goûts : de I hate à I love"
    svg: "cm1-eoc-decrire-environnement-et-gouts-gouts.svg"
    jules: "Varie tes verbes : dire toujours I like, c'est comme tout colorier avec le même feutre. Love se dit /lʌv/ : le o sonne comme un a très bref, jamais comme le o de « lotto »."

  - id: graphe
    type: graphe
    gabarit: pres-loin
    curseurs:
      - {id: curseur-d, nom: d, min: 1, max: 6, pas: 1, depart: 2}
      - {id: curseur-q, nom: q, min: 1, max: 3, pas: 1, depart: 1}
    lectures:
      - {si: "d <= 3 && q == 1", texte: "Près de moi, une seule : **this** ball."}
      - {si: "d <= 3 && q >= 2", texte: "Près de moi, plusieurs : **these** balls."}
      - {si: "d >= 4 && q == 1", texte: "Loin de moi, une seule : **that** ball."}
      - {si: "d >= 4 && q >= 2", texte: "Loin de moi, plusieurs : **those** balls."}
    jules: "Éloigne les balles avec d et ajoutes-en avec q : près de toi, c'est this ou these ; loin de toi, that ou those. Les mots en -se (these, those) servent pour plusieurs."

  - id: methode
    type: methode
    etapes:
      - "Regarde bien ce que tu décris : ta chambre, ta cour ou ta rue."
      - "Compte : un seul objet, dis **There is** a… ; plusieurs, dis **There are** two, three…"
      - "Dis où il est avec un petit mot : on, under, next to, in."
      - "Termine par ton avis : I love, I like, I don't like ou I hate, et relie avec **and** ou or."
    jules: "Prépare ta description avec un dessin légendé : c'est permis, et c'est ce que font aussi les grands pour parler devant les autres."

  - id: piege
    type: piege
    mauvaise_idee: "Dans ma cour, « there is two benches »."
    pourquoi_faux: "Two, c'est plusieurs : il faut **are**, pas is. Is ne va qu'avec un seul objet."
    bonne_idee: "There are two benches. There is a tree. There are three goals."
    jules: "Deuxième piège : oublier le petit mot **a** (un, une) devant l'objet. On dit There is a tree, jamais There is tree."

  - id: exemple-cour
    type: exemple
    situation: "Décris ta cour d'école : il y a un terrain de basket, deux bancs et un grand arbre à côté de la cantine. Tu adores le terrain de basket, tu n'aimes pas les bancs."
    calcul: "In my playground, there is a basketball court and there are two benches. There is a big tree next to the canteen. I love the basketball court! I don't like the benches."
    conclusion: "Un seul terrain et un seul arbre : **there is**. Deux bancs : **there are**. Traduction : Dans ma cour, il y a un terrain de basket et deux bancs. Il y a un grand arbre à côté de la cantine."
    jules: "Playground veut dire « la cour de récréation » : play (jouer) et ground (le sol). Un mot à deux morceaux, facile à retenir."

  - id: exemple-visio
    type: exemple
    situation: "Pendant un appel vidéo avec sa correspondante anglaise, Chloé montre sa chambre. Il y a un lit, deux étagères, et un hamster dans sa cage."
    calcul: "This is my bedroom. There is a bed and there are two shelves. Look! There is a hamster in the cage. I love my hamster, he's so cute!"
    conclusion: "**This is** sert à montrer (voici). Look! veut dire « regarde ! ». Traduction de la fin : J'adore mon hamster, il est trop mignon !"
    jules: "So veut dire « tellement » : so cute (tellement mignon), so big. Avec very (très), c'est une manière simple de dire que tu aimes **beaucoup**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : cache un objet dans ta chambre et décris où il est à quelqu'un, en anglais. Par exemple « The ball is under the bed » (le ballon est sous le lit)."
