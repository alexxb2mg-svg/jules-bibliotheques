notion: cm1-eoi-etablir-un-contact
titre: "Saluer, être poli, dire au revoir : Hello, Thank you, Goodbye"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 20", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "I'm": "I am : je suis (I'm Léo : je suis Léo)"
  "What's": "What is : qu'est-ce que, quel est (What's your name? : comment t'appelles-tu ?)"
  "Mr": "Mister : Monsieur, devant le nom de famille (Mr Brown)"
  "Mrs": "Madame, devant le nom de famille (Mrs Smith)"
blocs:
  - id: formule
    type: formule
    expression: "[Hello!]  →  [Please… Thank you!]  →  [Goodbye!]"
    termes:
      "Hello!": {couleur: bleu, legende: "**ouvrir** l'échange : on salue (Hello, Hi, Good morning, Good afternoon)."}
      "Please… Thank you!": {couleur: vert, legende: "**être poli** pendant l'échange : please (s'il te plaît), thank you (merci), sorry (pardon)."}
      "Goodbye!": {couleur: orange, legende: "**clore** l'échange : on se quitte (Goodbye, Bye, See you soon, Good night)."}
    jules: "Une conversation, c'est comme une porte : on l'ouvre avec Hello, on reste poli pendant la visite, et on la ferme avec Goodbye. Une porte qu'on laisse ouverte, ça fait un courant d'air !"

  - id: carte
    type: carte
    noeuds:
      - {id: contact, titre: "Établir un contact en anglais", sous_titre: "des petites phrases toutes faites, à connaître par cœur", principal: true}
      - {id: saluer, titre: "Saluer", sous_titre: "Hi ! (copains) Hello ! (tout le monde) Good morning ! (le matin)"}
      - {id: poli, titre: "Être poli", sous_titre: "Please, Thank you, Sorry, Excuse me"}
      - {id: relancer, titre: "Relancer", sous_titre: "What's your name? Where are you from? And you?"}
      - {id: quitter, titre: "Se quitter", sous_titre: "Goodbye! Bye! See you soon! Good night!"}
    liens:
      - {de: contact, vers: saluer}
      - {de: contact, vers: poli}
      - {de: contact, vers: relancer}
      - {de: contact, vers: quitter}
    jules: "Ces phrases s'apprennent comme des blocs, sans les découper mot à mot. Par exemple, à How are you (comment vas-tu), on répond : I'm fine, thank you (je vais bien, merci)."

  - id: schema-moments
    type: schema
    titre: "Le soleil avance : Good morning, Good afternoon, Good evening, Good night"
    svg: "cm1-eoi-etablir-un-contact.svg"
    jules: "Good night est la seule qui sert à se quitter : on la dit le soir, en partant ou avant d'aller dormir. Pour dire bonsoir en arrivant, c'est **Good evening**."

  - id: schema-dialogue
    type: schema
    titre: "Léo rencontre Emma dans la cour : un vrai petit dialogue"
    svg: "cm1-eoi-etablir-un-contact-dialogue.svg"
    jules: "Nice to meet you veut dire « enchanté de te rencontrer » : on ne le dit que la première fois qu'on voit quelqu'un. Le lendemain, un simple « Hi, Emma! » suffit."

  - id: graphe
    type: graphe
    gabarit: horloge
    curseurs:
      - {id: curseur-h, nom: h, min: 6, max: 21, pas: 1, depart: 9}
      - {id: curseur-m, nom: m, min: 0, max: 0, pas: 5, depart: 0}
      - {id: curseur-duree, nom: duree, min: 0, max: 0, pas: 5, depart: 0}
    lectures:
      - {si: "h < 12", texte: "Le matin, jusqu'à midi : **Good morning!**"}
      - {si: "h >= 12 && h < 18", texte: "L'après-midi : **Good afternoon!**"}
      - {si: "h >= 18", texte: "Le soir, en arrivant : **Good evening!** Mais **Good night!** ne sert pas à dire bonjour : on le dit pour se quitter le soir, ou avant d'aller dormir."}
    jules: "Avance l'heure et regarde quand la salutation change : à midi, Good morning devient Good afternoon. Et si tu hésites, Hello! marche à toute heure."

  - id: methode
    type: methode
    etapes:
      - "Regarde l'heure et la personne : le matin, dis **Good morning** ; l'après-midi, **Good afternoon** ; à un copain, Hi !"
      - "Présente-toi : « I'm Léo » ou « My name is Léo »."
      - "Pendant l'échange, ajoute **please** quand tu demandes, et **thank you** quand on te donne quelque chose."
      - "Pour continuer, pose une question courte avec le ton qui monte : What's your name? Where are you from? And you?"
      - "Avant de partir, dis au revoir : **Goodbye!** ou See you soon! (à bientôt !)."
    jules: "À l'oral, une question anglaise se reconnaît au ton : la voix monte à la fin, comme en français quand tu demandes à un copain s'il vient jouer."

  - id: piege
    type: piege
    mauvaise_idee: "Il est 15 h, la maîtresse d'anglais arrive. Paul lui dit : « Good morning! »"
    pourquoi_faux: "Morning veut dire **le matin**. Après midi, ce n'est plus le matin : l'après-midi se dit afternoon (after = après, noon = midi)."
    bonne_idee: "À 15 h, on dit **Good afternoon!** Le matin, Good morning. Et si tu hésites, Hello! marche à toute heure."
    jules: "Coupe le mot en deux pour t'en souvenir : after + noon, c'est « après midi », exactement comme en français."

  - id: exemple-assistante
    type: exemple
    situation: "Mardi, à 14 h, Miss Taylor, l'assistante d'anglais, entre dans la classe de Nina. Elle distribue des cartes, puis repart à 15 h. Que dit Nina à chaque moment ?"
    calcul: "Quand elle arrive (14 h, l'après-midi) : Good afternoon, Miss Taylor! Quand elle reçoit sa carte : Thank you! Quand elle repart : Goodbye! See you next week!"
    conclusion: "Nina a **ouvert**, été **polie** et **clos** l'échange. Traduction : Bonjour, Miss Taylor ! Merci ! Au revoir ! À la semaine prochaine !"
    jules: "Devant un adulte, on ajoute son nom après la salutation : Good afternoon, Mrs Smith. C'est plus poli que Hi, qu'on garde pour les copains."

  - id: exemple-gouter
    type: exemple
    situation: "À la récréation, Sam propose des bonbons à ses copains : « Do you want a sweet? » (Tu veux un bonbon ?). Aïcha en veut un, Hugo n'en veut pas. Puis Hugo bouscule Sam sans faire exprès."
    calcul: "Aïcha accepte : Yes, please! Hugo refuse : No, thank you. Hugo s'excuse : Sorry, Sam!"
    conclusion: "On accepte avec **Yes, please**, on refuse avec **No, thank you**, et on s'excuse avec **Sorry**. Traduction : Oui, s'il te plaît ! Non, merci. Pardon, Sam !"
    jules: "Sorry sert après une bêtise (pardon, désolé). Excuse me sert avant de déranger quelqu'un, pour demander ton chemin par exemple : Excuse me, please (excusez-moi, s'il vous plaît)."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi pour ce soir : dis « Good evening » en rentrant chez toi, et « Good night » avant d'aller te coucher. Ta famille va être surprise !"
