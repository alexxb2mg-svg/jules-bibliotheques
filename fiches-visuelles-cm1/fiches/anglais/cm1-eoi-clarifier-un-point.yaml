notion: cm1-eoi-clarifier-un-point
titre: "Quand je ne comprends pas : les phrases de secours et l'alphabet"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 18-19", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "don't": "do not : ne... pas (I don't understand : je ne comprends pas)"
  "What's": "What is : qu'est-ce que, quel est (What's the English for… : comment dit-on… en anglais)"
blocs:
  - id: formule
    type: formule
    expression: "How do you say [trousse] in English?  →  It's [pencil case]."
    termes:
      trousse: {couleur: orange, legende: "le **mot français** que tu cherches, dit entre les deux morceaux de la question"}
      pencil case: {couleur: bleu, legende: "la **réponse en anglais**, que tu répètes tout de suite pour la retenir : pencil case"}
    jules: "Cette question, c'est ton dictionnaire de poche : elle marche pour tous les mots. Une autre façon de la poser : What's the English for « trousse »?"

  - id: carte
    type: carte
    noeuds:
      - {id: secours, titre: "Les phrases de secours", sous_titre: "je ne suis pas perdu, je demande !", principal: true}
      - {id: pas-compris, titre: "Je n'ai pas compris", sous_titre: "Sorry, I don't understand."}
      - {id: repeter, titre: "Fais-le répéter", sous_titre: "Can you repeat, please?"}
      - {id: mot, titre: "Il me manque un mot", sous_titre: "How do you say « gomme » in English?"}
      - {id: epeler, titre: "Épeler", sous_titre: "Can you spell it, please? R-U-B-B-E-R"}
    liens:
      - {de: secours, vers: pas-compris}
      - {de: secours, vers: repeter}
      - {de: secours, vers: mot}
      - {de: secours, vers: epeler}
    jules: "Demander de l'aide en anglais, c'est déjà parler anglais ! Même les adultes en voyage utilisent ces phrases tous les jours."

  - id: schema-bd
    type: schema
    titre: "Zoé n'a pas compris la consigne : elle ose demander"
    svg: "cm1-eoi-clarifier-un-point.svg"
    jules: "Commence par **Sorry** (pardon) : c'est poli, et ça prévient que tu vas poser une question. Understand se dit /ʌndəˈstænd/, avec la voix plus forte sur stand."

  - id: schema-alphabet
    type: schema
    titre: "L'alphabet anglais rangé par familles de sons"
    svg: "cm1-eoi-clarifier-un-point-alphabet.svg"
    jules: "Apprends les lettres par familles : toutes celles de la ligne /iː/ finissent comme see. Pour **épeler**, c'est-à-dire dire un mot lettre par lettre, deux lettres pareilles se disent double : double M."

  - id: methode
    type: methode
    etapes:
      - "Tu n'as pas compris ? Dis-le tout de suite, sans honte : **Sorry, I don't understand.**"
      - "Tu as mal entendu ? Demande de répéter : **Can you repeat, please?**"
      - "Il te manque un mot ? Demande-le : How do you say « … » in English?"
      - "Tu dois écrire un mot inconnu ? Demande Can you spell it, please? et écris les lettres une par une."
      - "Pour vérifier une consigne, répète-la : « Page 12? » On te répondra Yes ou No."
    jules: "Répéter la consigne à voix haute, c'est aussi une façon de montrer que tu as compris. La maîtresse sait tout de suite si c'est bon."

  - id: piege
    type: piege
    mauvaise_idee: "Je ne sais pas ce que veut dire le mot « scissors », alors je demande : « Can you repeat, please? »"
    pourquoi_faux: "Repeat fait **redire** la même phrase : tu entendras encore « scissors », sans savoir ce que c'est. Il faut demander le **sens** du mot."
    bonne_idee: "What does « scissors » mean? (ça veut dire quoi ?) On te montre ou on te traduit : ce sont des ciseaux."
    jules: "Repeat : je n'ai pas bien entendu. Mean : j'ai entendu, mais je ne connais pas le mot. Deux problèmes, deux phrases."

  - id: exemple-consigne
    type: exemple
    situation: "La maîtresse dit « Stick the picture in your notebook ». Lucas n'a pas compris. Que dit-il ?"
    calcul: "Lucas : Sorry, I don't understand. Can you repeat, please? La maîtresse répète en montrant la colle : Stick the picture in your notebook. Lucas : Stick… with glue? OK!"
    conclusion: "Lucas **demande**, puis répète les mots qu'il a reconnus pour vérifier. Traduction : Colle l'image dans ton cahier. Coller… avec de la colle ? D'accord !"
    jules: "Les gestes aident beaucoup : si la maîtresse montre un objet en répétant, regarde ses mains autant que tu écoutes sa voix."

  - id: exemple-epeler
    type: exemple
    situation: "Au téléphone, la correspondante anglaise de Hugo lui demande d'épeler son prénom. « How do you spell your name? »"
    calcul: "Hugo : H-U-G-O. Il dit chaque lettre à l'anglaise : H /eɪtʃ/, U /juː/, G /dʒiː/, O /əʊ/."
    conclusion: "Le G anglais se dit « dji », pas « gé ». Pour Emma, on dirait : E, **double M**, A."
    jules: "Entraîne-toi avec ton propre prénom, c'est celui qu'on te demandera le plus souvent d'épeler. Attention au **E**, qui se dit /iː/ comme un « i »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Colle les phrases de secours sur la couverture de ton cahier d'anglais. Au bout de quelques semaines, tu les diras sans les lire."
