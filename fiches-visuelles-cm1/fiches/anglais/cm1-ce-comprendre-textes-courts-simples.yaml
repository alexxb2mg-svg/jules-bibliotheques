    jules: "Lire en anglais, c'est comme mener une enquête : tu ramasses des indices (une image, un mot connu, un nombre) et tu les assembles. À la fin, tu sais qui, où et quand."

  - id: schema-carte-postale
    type: schema
    titre: "La carte postale de Chloé : ce qu'on repère sans dictionnaire"
    svg: "cm1-ce-comprendre-textes-courts-simples.svg"
    jules: "Sunny, tu ne le connais peut-être pas : mais sun veut dire soleil, alors It is sunny veut dire « il fait **soleil** ». Un mot connu caché dans un mot inconnu, c'est un super indice."

  - id: schema-types
    type: schema
    titre: "Avant de lire : la forme du texte dit ce que c'est"
    svg: "cm1-ce-comprendre-textes-courts-simples-types.svg"
    jules: "Une carte postale raconte des vacances, une invitation donne un jour et une adresse, une publicité donne un prix. Dès que tu reconnais la forme, tu sais quoi chercher."

  - id: methode
    type: methode
    etapes:
      - "Regarde d'abord les **images** et le titre : de quoi le texte parle-t-il ?"
      - "Reconnais la **forme** du texte : carte postale, bande dessinée, invitation, publicité…"
      - "Souligne en vert les **mots transparents**, ceux qui ressemblent au français (family, giraffe, museum)."
      - "Entoure les nombres et les mots de temps : two, 10, Saturday, today (aujourd'hui), tomorrow (demain)."
      - "Réponds aux questions Qui ? Où ? Quand ? avec les mots que tu as repérés."
    jules: "Un mot transparent se reconnaît en le lisant à voix haute à la française : chocolate, animal, pizza, giraffe. Ton oreille fait le lien toute seule."

  - id: piege
    type: piege
    mauvaise_idee: "Dans la carte de Chloé, je ne connais pas sunny ni visit : je m'arrête, je ne comprends rien."
    pourquoi_faux: "On n'a pas besoin de **traduire chaque mot**. Les mots connus et les **mots transparents** suffisent pour comprendre l'essentiel."
    bonne_idee: "Je m'appuie sur ce que je reconnais : London, family, zoo, giraffe, two lions. Chloé est à Londres en famille et elle va au zoo."
    jules: "Méfie-toi de quelques faux amis, des mots qui ressemblent au français mais n'ont pas le même sens. Par exemple, a car veut dire « une voiture », pas un car."

  - id: exemple-invitation
    type: exemple
    situation: "Lucas reçoit ce carton : « Come to my birthday party! I am 10! Saturday 12 October, at 3 o'clock, 7 Green Street. Pizza, chocolate cake and games! From Olivia ». Qui l'invite ? Quand ? Où ?"
    calcul: "Qui ? From Olivia : c'est Olivia, qui a 10 ans (I am 10). Quand ? Saturday 12 October : samedi 12 octobre, à 3 heures de l'après-midi (15 h). Où ? au 7 Green Street. Mots transparents : pizza, chocolate, October."
    conclusion: "Olivia invite Lucas à son **anniversaire** (birthday party), samedi 12 octobre à 15 h, au 7 Green Street. Il y aura une pizza, un gâteau au chocolat et des jeux."
    jules: "Birthday se coupe en deux : birth (la naissance) et day (le jour). Le jour de ta naissance, c'est ton anniversaire !"

  - id: exemple-zoo
    type: exemple
    situation: "Mia, 9 ans, lit cette affiche : « Welcome to Oakwood Zoo! Open every day, from 9 to 5. Children: £4. Come and see the elephants, the kangaroos and the crocodile! » Peut-elle y aller à 10 h ? Combien paie-t-elle ?"
    calcul: "Open every day, from 9 to 5 : ouvert tous les jours, de 9 h à 17 h. 10 h est entre 9 h et 17 h. Children: £4 : les enfants paient 4 livres."
    conclusion: "Oui, Mia peut entrer à 10 h, et elle paie **4 livres** (£4). Elle verra des éléphants, des kangourous et un crocodile : trois mots transparents !"
    jules: "Le signe £ se lit pound : c'est la livre, l'argent des Anglais, comme l'euro chez nous. Sur une affiche, il se place devant le nombre : £4."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : cherche un emballage en anglais à la maison (céréales, jeu, jouet) et trouve cinq mots transparents dessus."
