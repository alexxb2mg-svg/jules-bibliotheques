<svg width="100%" viewBox="0 0 680 478" xmlns="http://www.w3.org/2000/svg"><title>Le modèle en 5 phrases : quand, où, ce que je fais, ensuite, mon avis</title>
<text class="tl" x="340.0" y="16.0" text-anchor="middle" dominant-baseline="central">Le modèle de Léna : 5 phrases pour raconter son samedi</text>
<rect x="12.0" y="38.0" width="656.0" height="74.0" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="34.0" cy="62.0" r="13" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="34.0" y="62.0" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="85.0" y="76.0" width="6.0" height="16.0" rx="0" fill="#8A5A1A" stroke="none" stroke-width="0"/>
<circle cx="88.0" cy="70.0" r="14" fill="#8DBF5A" stroke="#3B6D11" stroke-width="1"/>
<text class="tl" x="124.0" y="64.0" text-anchor="start" dominant-baseline="central"><tspan fill="#0C447C" font-weight="700">On Saturday</tspan>, I go <tspan fill="#0C447C" font-weight="700">to the park</tspan> with my dad.</text>
<text class="t" x="124.0" y="92.0" text-anchor="start" dominant-baseline="central">Le samedi, je vais au parc avec mon papa.</text>
<text class="ts" x="656.0" y="92.0" text-anchor="end" dominant-baseline="central">quand ? où ?</text>
<rect x="12.0" y="120.0" width="656.0" height="74.0" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="34.0" cy="144.0" r="13" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="34.0" y="144.0" text-anchor="middle" dominant-baseline="central">2</text>
<polygon points="79.0,154.0 97.0,154.0 88.0,176.0" fill="#E0B070" stroke="#854F0B" stroke-width="1" stroke-linejoin="round"/>
<circle cx="88.0" cy="148.0" r="10" fill="#F4B6C8" stroke="#993556" stroke-width="1"/>
<text class="tl" x="124.0" y="146.0" text-anchor="start" dominant-baseline="central">I play football <tspan fill="#B23A0E" font-weight="700">and</tspan> I eat an ice cream.</text>
<text class="t" x="124.0" y="174.0" text-anchor="start" dominant-baseline="central">Je joue au foot et je mange une glace.</text>
<text class="ts" x="656.0" y="174.0" text-anchor="end" dominant-baseline="central">ce que je fais</text>
<rect x="12.0" y="202.0" width="656.0" height="74.0" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="34.0" cy="226.0" r="13" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="34.0" y="226.0" text-anchor="middle" dominant-baseline="central">3</text>
<path d="M68 232 q5 -5 10 0 t10 0 t10 0 t10 0" fill="none" stroke="#3F8FD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M68 241 q5 -5 10 0 t10 0 t10 0 t10 0" fill="none" stroke="#3F8FD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M68 250 q5 -5 10 0 t10 0 t10 0 t10 0" fill="none" stroke="#3F8FD2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="124.0" y="228.0" text-anchor="start" dominant-baseline="central"><tspan fill="#B23A0E" font-weight="700">Then</tspan>, we go <tspan fill="#0C447C" font-weight="700">to the swimming pool</tspan>.</text>
<text class="t" x="124.0" y="256.0" text-anchor="start" dominant-baseline="central">Ensuite, nous allons à la piscine.</text>
<text class="ts" x="656.0" y="256.0" text-anchor="end" dominant-baseline="central">ensuite</text>
<rect x="12.0" y="284.0" width="656.0" height="74.0" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="34.0" cy="308.0" r="13" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="34.0" y="308.0" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="84.0" y="302.0" width="8.0" height="30.0" rx="4" fill="#ffffff" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="88.0" cy="334.0" r="7" fill="#3F8FD2" stroke="#185FA5" stroke-width="1.5"/>
<line x1="88.0" y1="318.0" x2="88.0" y2="330.0" stroke="#3F8FD2" stroke-width="3" stroke-linecap="round"/>
<text class="tl" x="124.0" y="310.0" text-anchor="start" dominant-baseline="central">The water is cold, <tspan fill="#B23A0E" font-weight="700">but</tspan> <tspan fill="#27500A" font-weight="700">it is fun!</tspan></text>
<text class="t" x="124.0" y="338.0" text-anchor="start" dominant-baseline="central">L'eau est froide, mais c'est rigolo !</text>
<text class="ts" x="656.0" y="338.0" text-anchor="end" dominant-baseline="central">un détail</text>
<rect x="12.0" y="366.0" width="656.0" height="74.0" rx="8" fill="#ffffff" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="34.0" cy="390.0" r="13" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="th" x="34.0" y="390.0" text-anchor="middle" dominant-baseline="central">5</text>
<path d="M88 416 C66 402 78 386 88 398 C98 386 110 402 88 416 Z" fill="#F4B6C8" stroke="#993556" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="tl" x="124.0" y="392.0" text-anchor="start" dominant-baseline="central"><tspan fill="#27500A" font-weight="700">I love Saturdays!</tspan></text>
<text class="t" x="124.0" y="420.0" text-anchor="start" dominant-baseline="central">J'adore les samedis !</text>
<text class="ts" x="656.0" y="420.0" text-anchor="end" dominant-baseline="central">mon avis</text>
<text class="t" x="340.0" y="456.0" text-anchor="middle" dominant-baseline="central">Bleu : quand et où. Orange : les mots qui relient (and, then, but). Vert : ce que j'en pense.</text>
</svg>
