<text x="52.0" y="294.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">There is</tspan><tspan font-weight="700"> a bed.</tspan></text>
<text x="52.0" y="314.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Il y a un lit.</text>
<circle cx="362.0" cy="294.0" r="11" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text class="ts" x="362.0" y="294.5" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-weight="700">2</text>
<text x="382.0" y="294.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">There is</tspan><tspan font-weight="700"> a cat </tspan><tspan fill="#C2410C" font-weight="700">on</tspan><tspan font-weight="700"> the bed.</tspan></text>
<text x="382.0" y="314.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">un chat sur le lit</text>
<circle cx="32.0" cy="346.0" r="11" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text class="ts" x="32.0" y="346.5" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-weight="700">3</text>
<text x="52.0" y="346.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">There is</tspan><tspan font-weight="700"> a ball </tspan><tspan fill="#C2410C" font-weight="700">under</tspan><tspan font-weight="700"> the bed.</tspan></text>
<text x="52.0" y="366.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">un ballon sous le lit</text>
<circle cx="362.0" cy="346.0" r="11" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text class="ts" x="362.0" y="346.5" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-weight="700">4</text>
<text x="382.0" y="346.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">There is</tspan><tspan font-weight="700"> a lamp </tspan><tspan fill="#C2410C" font-weight="700">on</tspan><tspan font-weight="700"> the desk.</tspan></text>
<text x="382.0" y="366.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">une lampe sur le bureau</text>
<circle cx="32.0" cy="398.0" r="11" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text class="ts" x="32.0" y="398.5" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-weight="700">5</text>
<text x="52.0" y="398.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#3B6D11" font-weight="700">There are</tspan><tspan font-weight="700"> two posters.</tspan></text>
<text x="52.0" y="418.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">deux posters (plusieurs : are)</text>
<circle cx="362.0" cy="398.0" r="11" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text class="ts" x="362.0" y="398.5" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-weight="700">6</text>
<text x="382.0" y="398.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">There is</tspan><tspan font-weight="700"> a chair </tspan><tspan fill="#C2410C" font-weight="700">next to</tspan><tspan font-weight="700"> the desk.</tspan></text>
<text x="382.0" y="418.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">une chaise à côté du bureau</text>
<text x="340.0" y="456.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Bleu : un seul objet (is).  Vert : plusieurs objets (are).  Orange : où il est.</text>
