<text x="610.0" y="100.0" font-size="16" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">Yummy!</text>
<text x="118.0" y="272.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#854F0B" font-weight="700">First,</tspan><tspan font-weight="700"> Max and Nina</tspan></text>
<text x="118.0" y="296.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">play</tspan><tspan font-weight="700"> football.</tspan></text>
<text x="118.0" y="320.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Ils jouent au foot.</text>
<text x="340.0" y="272.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#854F0B" font-weight="700">Then,</tspan><tspan font-weight="700"> it</tspan></text>
<text x="340.0" y="296.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">rains</tspan><tspan font-weight="700">!</tspan></text>
<text x="340.0" y="320.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Il pleut !</text>
<text x="562.0" y="272.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#854F0B" font-weight="700">Finally,</tspan><tspan font-weight="700"> they</tspan></text>
<text x="562.0" y="296.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">drink</tspan><tspan font-weight="700"> hot chocolate.</tspan></text>
<text x="562.0" y="320.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Ils boivent un chocolat.</text>
<line x1="16.0" y1="350.0" x2="664.0" y2="350.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round"/>
<text x="340.0" y="366.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#854F0B" font-weight="700">Marron</tspan><tspan> : les mots du temps, qui mettent l'histoire en ordre.</tspan></text>
<text x="340.0" y="388.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">Bleu</tspan><tspan> : le verbe de l'action, au présent.</tspan></text>
<text x="340.0" y="410.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">first se dit /fɜːst/, then se dit /ðen/, finally se dit /ˈfaɪnəli/</text>
