  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  pm: "post meridiem (en latin : après midi). 2 pm = 14 h, 5 pm = 17 h"
  "£": "la livre sterling, la monnaie du Royaume-Uni (£1 : une livre)"
blocs:
  - id: questions
    type: formule
    expression: "[Who?]  [What?]  [When?]  [Where?]  [How much?]"
    termes:
      "Who?": {couleur: violet, legende: "**Qui ?** un prénom, une personne : Tom, Mrs Smith, the teacher."}
      "What?": {couleur: gris, legende: "**Quoi ?** ce qui se passe : a fair (une fête), a football club, a trip (une sortie)."}
      "When?": {couleur: bleu, legende: "**Quand ?** un jour, une date, une heure : Saturday, 12th June, 2 pm."}
      "Where?": {couleur: vert, legende: "**Où ?** un lieu : at school, in the park, at the swimming pool."}
      "How much?": {couleur: orange, legende: "**Combien ?** un prix ou un nombre : £1, 7 years old, 25 children."}
    jules: "Ces cinq questions sont tes filets à pêcher : tu ne gardes que les mots qui répondent à l'une d'elles. Tout le reste peut repartir à l'eau."

  - id: carte
    type: carte
    noeuds:
      - {id: notes, titre: "Prendre des notes", sous_titre: "garder l'essentiel pour le transmettre à quelqu'un", principal: true}
      - {id: mots-cles, titre: "Relever les mots-clés", sous_titre: "noms, nombres, prix, jours : Tom, 7, £1, Saturday"}
      - {id: copier, titre: "Recopier sans erreur", sous_titre: "lettre par lettre : r-u-b-b-e-r"}
      - {id: dictee, titre: "Écrire sous la dictée", sous_titre: "des mots déjà connus : pencil, blue, Monday"}
      - {id: redire, titre: "Redire avec mes mots", sous_titre: "une phrase courte, en français ou en anglais simple"}
    liens:
      - {de: notes, vers: mots-cles}
      - {de: notes, vers: copier}
      - {de: notes, vers: dictee}
      - {de: notes, vers: redire}
    jules: "Redire avec ses propres mots s'appelle **paraphraser**. Ce n'est pas traduire chaque mot : c'est dire la même information, plus simplement."

  - id: schema-affiche
    type: schema
    titre: "Une affiche en anglais : les mots-clés relevés, puis l'information redite avec mes mots"
    svg: "cm1-m-prendre-notes-paraphraser.svg"
    jules: "La couleur relie l'affiche et les notes : bleu pour **quand**, vert pour **où**, orange pour **combien**. 2 pm, c'est 2 heures de l'après-midi, donc 14 h."

  - id: schema-copier
    type: schema
    titre: "Recopier une liste sans erreur : comparer avec le modèle, lettre par lettre"
    svg: "cm1-m-prendre-notes-paraphraser-copier.svg"
    jules: "Pour épeler un mot avec deux lettres pareilles, les Anglais disent « double » : rubber, c'est r-u-double b-e-r."

  - id: methode
    type: methode
    etapes:
      - "Avant de lire ou d'écouter, prépare tes cinq questions : Who? What? When? Where? How much?"
      - "Pendant, ne note que les **mots-clés** : un prénom, un nombre, un prix, un jour. Pas de phrases entières."
      - "Écris les nombres en chiffres (7, pas seven). Une flèche ou un petit dessin peut remplacer un mot."
      - "Relis tes notes en les comparant au modèle, **lettre par lettre** : un mot mal recopié peut changer le sens."
      - "Transmets l'information avec **tes mots** : une phrase courte, en français ou en anglais simple."
    jules: "Tes notes ne sont pas une rédaction : personne ne te demande de belles phrases. Ce qui compte, c'est qu'aucune information importante ne manque."

  - id: piege
    type: piege
    mauvaise_idee: "La maîtresse lit : « The bus leaves at nine from the school gate. Don't forget your lunch! » Lucas essaie de tout écrire, mot à mot, et n'a pas le temps de noter l'heure."
    pourquoi_faux: "En voulant tout copier, on rate l'essentiel. Ici, il suffit de trois ou quatre **mots-clés** : le bus, l'heure, le lieu, le pique-nique."
    bonne_idee: "Notes : bus – 9 h – school gate (portail de l'école) – lunch (pique-nique). Quatre mots, et rien d'important n'est oublié."
    jules: "Si un mot est long, note seulement son début, puis complète-le juste après la fin de l'annonce, tant que tu t'en souviens."

  - id: exemple-club
    type: exemple
    situation: "La maîtresse lit une annonce : « Football club: every Wednesday at 3 pm. It costs £5. Bring your trainers! » Yanis prend des notes pour sa maman, qui ne parle pas anglais."
    calcul: "Notes de Yanis : foot – mercredi – 3 pm = 15 h – 5 £ – trainers (baskets)."
    conclusion: "Yanis le redit à sa maman : « Le club de foot, c'est tous les mercredis à 15 h. Ça coûte 5 livres, et il faut des baskets. » Il a **paraphrasé** l'annonce."
    jules: "Trainers, ce sont les baskets en anglais du Royaume-Uni. Aux États-Unis, on dit plutôt sneakers."

  - id: exemple-dictee
    type: exemple
    situation: "Pour la sortie, la maîtresse dicte en anglais ce qu'il faut apporter : « a cap, a bottle of water, a pencil ». Emma écrit sous la dictée. Pour bottle, la maîtresse épelle : b-o-double t-l-e."
    calcul: "Liste d'Emma : a cap, a bottle of water, a pencil."
    conclusion: "Emma a écrit **3 objets** sans faute : une casquette, une bouteille d'eau, un crayon. Pour bottle, elle a bien mis deux t, comme on l'a épelé."
    jules: "Dans une dictée d'anglais, on n'entend pas toujours toutes les lettres. C'est pour ça qu'on dicte surtout des mots déjà vus : tu as leur image dans la tête."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : regarde l'étiquette d'un produit ou une affiche en anglais, relève-y un prix, un nombre et un lieu, puis explique-les à quelqu'un de ta famille."
