<svg width="100%" viewBox="0 0 680 478" xmlns="http://www.w3.org/2000/svg"><title>L'histoire de Max en 4 vignettes : Once upon a time, One day, Suddenly, In the end</title>
<text class="tl" x="340.0" y="16.0" text-anchor="middle" dominant-baseline="central">L'histoire de Max, en 4 images</text>
<rect x="12.0" y="34.0" width="324.0" height="206.0" rx="6" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
<rect x="12.0" y="34.0" width="324.0" height="34.0" rx="6" fill="#FAECE7" stroke="#1a1a18" stroke-width="1.5"/>
<rect x="13.0" y="54.0" width="322.0" height="14.0" rx="0" fill="#FAECE7" stroke="none" stroke-width="0"/>
<line x1="12.0" y1="68.0" x2="336.0" y2="68.0" stroke="#1a1a18" stroke-width="1.5" stroke-linecap="round"/>
<text class="tl" x="24.0" y="51.0" text-anchor="start" dominant-baseline="central" fill="#B23A0E">1. Once upon a time…</text>
<text class="t" x="324.0" y="224.0" text-anchor="end" dominant-baseline="central" fill="#B23A0E">= Il était une fois</text>
<text class="t" x="148.0" y="88.0" text-anchor="start" dominant-baseline="central">There is a little cat.</text>
<text class="t" x="148.0" y="108.0" text-anchor="start" dominant-baseline="central">His name is Max.</text>
<text class="t" x="148.0" y="128.0" text-anchor="start" dominant-baseline="central">He is funny.</text>
<text class="ts" x="148.0" y="158.0" text-anchor="start" dominant-baseline="central">Il y a un petit chat.</text>
<text class="ts" x="148.0" y="175.0" text-anchor="start" dominant-baseline="central">Il s'appelle Max.</text>
<text class="ts" x="148.0" y="192.0" text-anchor="start" dominant-baseline="central">Il est drôle.</text>
<text class="th" x="82.0" y="224.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">le début</text>
<rect x="344.0" y="34.0" width="324.0" height="206.0" rx="6" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
<rect x="344.0" y="34.0" width="324.0" height="34.0" rx="6" fill="#FAECE7" stroke="#1a1a18" stroke-width="1.5"/>
<rect x="345.0" y="54.0" width="322.0" height="14.0" rx="0" fill="#FAECE7" stroke="none" stroke-width="0"/>
<line x1="344.0" y1="68.0" x2="668.0" y2="68.0" stroke="#1a1a18" stroke-width="1.5" stroke-linecap="round"/>
<text class="tl" x="356.0" y="51.0" text-anchor="start" dominant-baseline="central" fill="#B23A0E">2. One day…</text>
<text class="t" x="656.0" y="224.0" text-anchor="end" dominant-baseline="central" fill="#B23A0E">= Un jour</text>
<text class="t" x="480.0" y="88.0" text-anchor="start" dominant-baseline="central">Max plays in the</text>
<text class="t" x="480.0" y="108.0" text-anchor="start" dominant-baseline="central">garden with a ball.</text>
<text class="t" x="480.0" y="128.0" text-anchor="start" dominant-baseline="central">He is happy.</text>
<text class="ts" x="480.0" y="158.0" text-anchor="start" dominant-baseline="central">Max joue dans le jardin</text>
<text class="ts" x="480.0" y="175.0" text-anchor="start" dominant-baseline="central">avec une balle.</text>
<text class="ts" x="480.0" y="192.0" text-anchor="start" dominant-baseline="central">Il est content.</text>
<text class="th" x="414.0" y="224.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">l'histoire démarre</text>
<rect x="12.0" y="252.0" width="324.0" height="206.0" rx="6" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
<rect x="12.0" y="252.0" width="324.0" height="34.0" rx="6" fill="#FAECE7" stroke="#1a1a18" stroke-width="1.5"/>
<rect x="13.0" y="272.0" width="322.0" height="14.0" rx="0" fill="#FAECE7" stroke="none" stroke-width="0"/>
<line x1="12.0" y1="286.0" x2="336.0" y2="286.0" stroke="#1a1a18" stroke-width="1.5" stroke-linecap="round"/>
<text class="tl" x="24.0" y="269.0" text-anchor="start" dominant-baseline="central" fill="#B23A0E">3. Suddenly…</text>
<text class="t" x="324.0" y="442.0" text-anchor="end" dominant-baseline="central" fill="#B23A0E">= Soudain</text>
<text class="t" x="148.0" y="306.0" text-anchor="start" dominant-baseline="central">It is raining!</text>
<text class="t" x="148.0" y="326.0" text-anchor="start" dominant-baseline="central">Max is wet.</text>
<text class="t" x="148.0" y="346.0" text-anchor="start" dominant-baseline="central">He is <tspan fill="#A32D2D" font-weight="700">not</tspan> happy.</text>
<text class="ts" x="148.0" y="376.0" text-anchor="start" dominant-baseline="central">Il pleut !</text>
<text class="ts" x="148.0" y="393.0" text-anchor="start" dominant-baseline="central">Max est mouillé.</text>
<text class="ts" x="148.0" y="410.0" text-anchor="start" dominant-baseline="central">Il n'est pas content.</text>
<text class="th" x="82.0" y="442.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">le problème</text>
<rect x="344.0" y="252.0" width="324.0" height="206.0" rx="6" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
<rect x="344.0" y="252.0" width="324.0" height="34.0" rx="6" fill="#FAECE7" stroke="#1a1a18" stroke-width="1.5"/>
<rect x="345.0" y="272.0" width="322.0" height="14.0" rx="0" fill="#FAECE7" stroke="none" stroke-width="0"/>
<line x1="344.0" y1="286.0" x2="668.0" y2="286.0" stroke="#1a1a18" stroke-width="1.5" stroke-linecap="round"/>
<text class="tl" x="356.0" y="269.0" text-anchor="start" dominant-baseline="central" fill="#B23A0E">4. In the end…</text>
<text class="t" x="656.0" y="442.0" text-anchor="end" dominant-baseline="central" fill="#B23A0E">= À la fin</text>
<text class="t" x="480.0" y="306.0" text-anchor="start" dominant-baseline="central">Max is at home.</text>
<text class="t" x="480.0" y="326.0" text-anchor="start" dominant-baseline="central">He drinks milk</text>
<text class="t" x="480.0" y="346.0" text-anchor="start" dominant-baseline="central"><tspan fill="#0C447C" font-weight="700">and</tspan> he sleeps.</text>
<text class="ts" x="480.0" y="376.0" text-anchor="start" dominant-baseline="central">Max est à la maison.</text>
<text class="ts" x="480.0" y="393.0" text-anchor="start" dominant-baseline="central">Il boit du lait</text>
<text class="ts" x="480.0" y="410.0" text-anchor="start" dominant-baseline="central">et il dort.</text>
<text class="th" x="414.0" y="442.0" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">la solution</text>
