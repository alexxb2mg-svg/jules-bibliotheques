<text x="340.0" y="160.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">en colère</text>
<text x="340.0" y="182.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">/ˈæŋgri/</text>
