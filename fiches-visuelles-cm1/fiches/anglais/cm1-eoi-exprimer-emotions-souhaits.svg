<text x="608.0" y="136.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">I'm scared.</text>
<text x="608.0" y="160.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central">j'ai peur</text>
<text x="608.0" y="182.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">/skeəd/</text>
<rect x="14.0" y="210.0" width="652.0" height="190.0" rx="10" fill="#FAECE7" stroke="#C2410C" stroke-width="1.2"/>
<text x="340.0" y="234.0" font-size="16" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">Attention : en français « j'ai », en anglais « I'm » (je suis)</text>
<text x="40.0" y="270.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">j'ai peur</text>
<line x1="136.0" y1="270.0" x2="164.0" y2="270.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<polygon points="164.0,265.0 172.0,270.0 164.0,275.0" fill="#C2410C" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<text x="182.0" y="270.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">I'm scared.</text>
<text x="360.0" y="270.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">j'ai faim</text>
<line x1="456.0" y1="270.0" x2="484.0" y2="270.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<polygon points="484.0,265.0 492.0,270.0 484.0,275.0" fill="#C2410C" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<text x="502.0" y="270.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">I'm hungry.</text>
<text x="40.0" y="306.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">j'ai soif</text>
<line x1="136.0" y1="306.0" x2="164.0" y2="306.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<polygon points="164.0,301.0 172.0,306.0 164.0,311.0" fill="#C2410C" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<text x="182.0" y="306.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">I'm thirsty.</text>
<text x="360.0" y="306.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">j'ai froid</text>
<line x1="456.0" y1="306.0" x2="484.0" y2="306.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<polygon points="484.0,301.0 492.0,306.0 484.0,311.0" fill="#C2410C" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<text x="502.0" y="306.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">I'm cold.</text>
<text x="40.0" y="342.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">j'ai chaud</text>
<line x1="136.0" y1="342.0" x2="164.0" y2="342.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<polygon points="164.0,337.0 172.0,342.0 164.0,347.0" fill="#C2410C" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<text x="182.0" y="342.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">I'm hot.</text>
<text x="360.0" y="342.0" font-size="17" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">j'ai 9 ans</text>
<line x1="456.0" y1="342.0" x2="484.0" y2="342.0" stroke="#C2410C" stroke-width="2" stroke-linecap="round"/>
<polygon points="484.0,337.0 492.0,342.0 484.0,347.0" fill="#C2410C" stroke="none" stroke-width="1.5" stroke-linejoin="round"/>
<text x="502.0" y="342.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">I'm 9.</text>
<text x="340.0" y="380.0" font-size="15" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan>jamais « </tspan><tspan fill="#C2410C" font-weight="700">I have hungry</tspan><tspan> » : on ne traduit pas « j'ai faim » mot à mot.</tspan></text>
</svg>
