<text x="526.8" y="13.0" font-size="12" fill="#5f5e5a" font-weight="700" text-anchor="middle" dominant-baseline="central">z</text>
<text x="474.0" y="136.0" font-size="18" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">I'm tired.</text>
