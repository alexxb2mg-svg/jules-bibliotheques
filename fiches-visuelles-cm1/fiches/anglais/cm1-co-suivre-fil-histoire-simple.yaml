    jules: "Tu fais déjà ça devant un dessin animé dans une langue que tu ne connais pas : tu regardes, tu écoutes le ton, et tu devines l'histoire. En anglais, tu as en plus tous les mots appris en classe."

  - id: schema-histoire
    type: schema
    titre: "Max and the red ball : une histoire en 4 images, les mots-clés repérés"
    svg: "cm1-co-suivre-fil-histoire-simple.svg"
    jules: "Le mot **pushes** (pousse) est nouveau, mais l'image 3 montre l'oiseau qui fait tomber la balle. Et à l'image 4, la balle est par terre : tu as compris la fin sans dictionnaire."

  - id: schema-intonation
    type: schema
    titre: "Question, affirmation ou exclamation : la voix dessine la phrase"
    svg: "cm1-co-suivre-fil-histoire-simple-intonation.svg"
    jules: "Même sans comprendre un seul mot, la **musique de la voix** te dit si le personnage demande quelque chose, raconte, ou a peur. C'est un indice gratuit : écoute-le à chaque fois."

  - id: methode
    type: methode
    etapes:
      - "Avant d'écouter, je regarde l'image et le titre : je devine le **thème** (un animal, la météo, la famille)."
      - "Première écoute : je ne cherche pas tout, j'écoute l'ambiance (joyeuse, triste, qui fait peur)."
      - "Deuxième écoute : je repère les **mots que je connais** et les nombres, en suivant les images du doigt."
      - "J'écoute la voix : une question qui monte, une exclamation de surprise, un bruit d'animal."
      - "Dernière écoute : je vérifie mon histoire. Qui ? Quel problème ? Comment ça finit ?"
    jules: "Écouter trois fois la même histoire, ce n'est pas de la triche : même les bons élèves ont besoin de plusieurs écoutes. À chaque fois, tu attrapes des mots nouveaux."

  - id: piege
    type: piege
    mauvaise_idee: "« J'ai entendu pushes et je ne connais pas ce mot : je ne comprends rien à l'histoire, j'arrête d'écouter. »"
    pourquoi_faux: "Un mot inconnu ne bloque pas toute l'histoire. Les **images** et les mots autour (bird, ball) aident à deviner, et la phrase suivante (Max is happy!) donne la fin."
    bonne_idee: "Je continue d'écouter. Je regarde l'image : l'oiseau touche la balle, elle tombe. Donc pushes veut sûrement dire « pousse »."
    jules: "Vouloir traduire chaque mot, c'est comme s'arrêter à chaque caillou sur un chemin : on n'arrive jamais au bout. Garde l'**essentiel** et avance."

  - id: exemple-max
    type: exemple
    situation: "La maîtresse lit « Max and the red ball » en montrant les 4 images. Lila doit dire en français de quoi parle l'histoire."
    calcul: "Qui ? dog, Max : un petit chien. Quel problème ? Oh no! + tree + sad : la balle est dans l'arbre, Max est triste. Comment ça finit ? bird + happy + Woof! : un oiseau aide, Max est content."
    conclusion: "Lila raconte : « La balle de Max, un petit chien, est coincée dans un arbre. Un **oiseau** la fait tomber et Max est content. » Elle a suivi **le fil de l'histoire**."
    jules: "Qui, quel problème, comment ça finit : ces trois questions marchent pour presque toutes les histoires, en anglais comme en français."

  - id: exemple-comptine
    type: exemple
    situation: "Dans une comptine anglaise très connue, Sami entend : « One, two, three, four, five, once I caught a fish alive ». L'image montre un enfant qui pêche. Sami ne connaît pas caught ni alive."
    calcul: "Il repère les nombres one, two, three, four, five (1, 2, 3, 4, 5) et le mot fish (poisson). L'image montre une canne à pêche."
    conclusion: "Sami comprend qu'on **compte jusqu'à 5** et qu'on attrape un poisson. Caught veut dire « j'ai attrapé » et alive « vivant », mais il n'en avait pas besoin pour suivre."
    jules: "Les nombres et les couleurs sont des mots faciles à attraper au vol : repère-les en premier, ils servent de points d'appui."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "À la maison, regarde un dessin animé court en anglais que tu connais déjà en français. Compte les mots que tu reconnais : tu seras surpris d'en trouver autant."
