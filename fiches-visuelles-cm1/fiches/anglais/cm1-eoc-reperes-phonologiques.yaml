  - id: accent
    type: formule
    expression: "teacher → [TEA]-[cher] /ˈtiːtʃə/"
    termes:
      TEA: {couleur: orange, legende: "la **syllabe forte** : on la dit plus fort et plus longtemps. Dans l'écriture entre barres obliques, le petit trait ˈ se place juste avant elle"}
      cher: {couleur: gris, legende: "une syllabe faible : on la dit vite et doucement, presque avalée"}
    jules: "Les signes entre barres obliques, comme /ˈtiːtʃə/, sont l'alphabet des sons : chaque signe est un son. Le dictionnaire les utilise pour te dire comment on prononce un mot."

  - id: carte
