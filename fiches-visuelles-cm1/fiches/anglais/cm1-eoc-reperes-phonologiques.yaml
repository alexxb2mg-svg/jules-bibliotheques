      - {de: prononcer, vers: preparer}
    jules: "On ne te demande pas d'avoir l'accent d'un Anglais : on te demande d'être **compris**. Les trois repères de cette fiche suffisent pour faire une grande différence."

  - id: schema-sons
    type: schema
    titre: "Trois sons anglais qui n'existent pas en français : th, h, r"
    svg: "cm1-eoc-reperes-phonologiques.svg"
    jules: "Le th a deux versions : /θ/ sans voix (three) et /ð/ avec la voix (this, mother). Pour les deux, la langue se glisse entre les dents, comme un petit bout de langue tiré pour rire."

  - id: schema-accent
    type: schema
    titre: "La syllabe forte de chaque mot, et la voix qui monte ou descend"
    svg: "cm1-eoc-reperes-phonologiques-accent.svg"
    jules: "Tape dans tes mains en disant le mot : un grand clap sur la syllabe forte, des petits sur les autres. BA-na-na n'est pas juste, ba-NA-na oui."

  - id: methode
    type: methode
    etapes:
      - "J'écoute d'abord le **modèle** (la maîtresse, l'enregistrement) deux ou trois fois, sans parler."
      - "Je repère les sons difficiles (th, h, r) et la **syllabe forte** de chaque mot long."
      - "Je répète à voix basse, seul, plusieurs fois, d'abord mot par mot, puis la phrase entière."
      - "Je vérifie ma voix : elle monte à la fin d'une question comme « Are you ready? », elle descend à la fin d'une phrase qui affirme."
      - "Je lis à voix haute devant les autres, puis je demande : est-ce qu'on m'a compris ?"
    jules: "Lire un texte anglais sans l'avoir préparé, c'est le piège à fautes de prononciation. Avec deux ou trois répétitions avant, ta lecture devient claire."

  - id: piege
    type: piege
    mauvaise_idee: "« Je dis ba-na-NA, comme banane en français, avec la voix qui appuie sur la fin. »"
    pourquoi_faux: "En français, la voix appuie sur la fin du mot. En anglais, chaque mot a sa propre **syllabe forte**, souvent au début ou au milieu : banana se dit /bəˈnɑːnə/, fort au milieu."
    bonne_idee: "ba-NA-na, TEA-cher, E-le-phant, com-PU-ter : j'apprends chaque mot nouveau avec sa **syllabe forte**."
    jules: "Quand tu apprends un mot, apprends-le avec sa musique : écoute où la voix tape, et tape dans tes mains au même endroit."

  - id: exemple-comptine
    type: exemple
    situation: "Ambre doit réciter devant la classe la comptine « Twinkle, twinkle, little star » (Brille, brille, petite étoile). Comment se prépare-t-elle ?"
    calcul: "Elle écoute l'enregistrement 3 fois. Elle repère les syllabes fortes : TWIN-kle, TWIN-kle, LIT-tle STAR. Elle répète chaque ligne à voix basse, puis toute la comptine, 4 ou 5 fois."
    conclusion: "Le jour J, Ambre récite en tapant le rythme dans sa tête : sa diction est **claire** et on comprend chaque mot."
    jules: "Les comptines sont faites pour ça : leur rythme met les syllabes fortes au bon endroit. En les chantant, tu apprends la musique de l'anglais sans effort."

  - id: exemple-three
    type: exemple
    situation: "Nolan veut dire son numéro de maillot : « I'm number three. » Mais il prononce three comme tree, sans mettre la langue entre les dents."
    calcul: "three /θriː/ veut dire trois. tree /triː/ veut dire arbre. En oubliant le th, Nolan a dit « Je suis le numéro arbre »."
    conclusion: "Un seul son peut changer le sens : il faut glisser **la langue entre les dents** pour dire three."
    jules: "C'est la même chose avec hungry (j'ai faim) et angry (en colère) : oublie le h soufflé, et « I'm hungry » devient « I'm angry » !"

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Mets ta main devant ta bouche et dis hello : tu dois sentir un petit souffle chaud sur ta main. Si tu ne sens rien, recommence en soufflant plus fort."
