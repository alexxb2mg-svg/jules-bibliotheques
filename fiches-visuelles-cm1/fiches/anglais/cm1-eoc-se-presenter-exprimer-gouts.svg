<svg width="100%" viewBox="0 0 680 452" xmlns="http://www.w3.org/2000/svg"><title>La carte d'identité de Léa et ses goûts</title>
<rect x="14.0" y="12.0" width="652.0" height="300.0" rx="14" fill="#FBFAF6" stroke="#185FA5" stroke-width="2"/>
<rect x="14.0" y="12.0" width="652.0" height="40.0" rx="14" fill="#185FA5" stroke="#185FA5" stroke-width="2"/>
<rect x="14.0" y="38.0" width="652.0" height="14.0" rx="0" fill="#185FA5" stroke="none" stroke-width="0"/>
<text x="340.0" y="32.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle" dominant-baseline="central">MY ID CARD  (ma carte d'identité)</text>
<rect x="34.0" y="70.0" width="150.0" height="170.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<path d="M65.0 184.0 Q59.0 92.0 109.0 95.2 Q159.0 92.0 153.0 184.0 Z" fill="#6B4226" stroke="none"/>
<circle cx="109.0" cy="140.0" r="40" fill="#F6D7B8" stroke="#B98A63" stroke-width="1.2"/>
<path d="M69.0 134.0 Q73.0 94.0 109.0 98.0 Q145.0 94.0 149.0 134.0 Q125.0 118.0 69.0 134.0 Z" fill="#6B4226" stroke="none"/>
<circle cx="95.0" cy="142.0" r="3.5999999999999996" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="123.0" cy="142.0" r="3.5999999999999996" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<path d="M95.0 156.0 Q109.0 168.0 123.0 156.0" fill="none" stroke="#1a1a18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M54 240 Q60 190 109 188 Q158 190 164 240 Z" fill="#E86F8E" stroke="#1a1a18" stroke-width="1.2"/>
<text x="109.0" y="264.0" font-size="22" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">Léa</text>
<text x="109.0" y="290.0" font-size="15" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">9 ans</text>
<text x="212.0" y="82.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">name</text>
<text x="290.0" y="81.0" font-size="20" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">My name's Léa.</text>
<text x="290.0" y="101.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Je m'appelle Léa.</text>
<line x1="212.0" y1="115.0" x2="646.0" y2="115.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round"/>
<text x="212.0" y="128.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">age</text>
<text x="290.0" y="127.0" font-size="20" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">I'm 9 years old.</text>
<text x="290.0" y="147.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">J'ai 9 ans.  (years se dit /jɪəz/)</text>
<line x1="212.0" y1="161.0" x2="646.0" y2="161.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round"/>
<text x="212.0" y="174.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">town</text>
<text x="290.0" y="173.0" font-size="20" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">I live in Poitiers.</text>
<text x="290.0" y="193.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">J'habite à Poitiers.</text>
<line x1="212.0" y1="207.0" x2="646.0" y2="207.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round"/>
<text x="212.0" y="220.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">family</text>
<text x="290.0" y="219.0" font-size="20" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">I have a brother.</text>
<text x="290.0" y="239.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">J'ai un frère.</text>
<line x1="212.0" y1="253.0" x2="646.0" y2="253.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round"/>
<text x="212.0" y="266.0" font-size="14" fill="#5f5e5a" font-weight="600" text-anchor="start" dominant-baseline="central">pet</text>
<text x="290.0" y="265.0" font-size="20" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">I have a cat.</text>
<text x="290.0" y="285.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">J'ai un chat.</text>
<line x1="212.0" y1="299.0" x2="646.0" y2="299.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="round"/>
<text x="20.0" y="336.0" font-size="16" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Mes goûts :</text>
<g transform="translate(50.0 378.0) scale(1.25)"><rect x="-11" y="-3" width="24" height="20" rx="5" fill="#EAF3DE" stroke="#1a1a18" stroke-width="1.3"/><rect x="-11" y="-19" width="10" height="20" rx="5" fill="#EAF3DE" stroke="#1a1a18" stroke-width="1.3"/><line x1="-1" y1="3" x2="13" y2="3" stroke="#1a1a18" stroke-width="1"/><line x1="-1" y1="8" x2="13" y2="8" stroke="#1a1a18" stroke-width="1"/><line x1="-1" y1="13" x2="13" y2="13" stroke="#1a1a18" stroke-width="1"/><rect x="-17" y="-2" width="7" height="18" rx="2" fill="#F1EFE8" stroke="#1a1a18" stroke-width="1.3"/></g>
<text x="82.0" y="372.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#3B6D11" font-weight="700">I like</tspan><tspan font-weight="700"> pizza.</tspan></text>
<text x="82.0" y="395.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">J'aime la pizza.</text>
<g transform="translate(360.0 374.0) scale(1.25) rotate(180)"><rect x="-11" y="-3" width="24" height="20" rx="5" fill="#FAECE7" stroke="#1a1a18" stroke-width="1.3"/><rect x="-11" y="-19" width="10" height="20" rx="5" fill="#FAECE7" stroke="#1a1a18" stroke-width="1.3"/><line x1="-1" y1="3" x2="13" y2="3" stroke="#1a1a18" stroke-width="1"/><line x1="-1" y1="8" x2="13" y2="8" stroke="#1a1a18" stroke-width="1"/><line x1="-1" y1="13" x2="13" y2="13" stroke="#1a1a18" stroke-width="1"/><rect x="-17" y="-2" width="7" height="18" rx="2" fill="#F1EFE8" stroke="#1a1a18" stroke-width="1.3"/></g>
<text x="392.0" y="372.0" font-size="20" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central"><tspan fill="#C2410C" font-weight="700">I don't like</tspan><tspan font-weight="700"> spinach.</tspan></text>
<text x="392.0" y="395.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="start" dominant-baseline="central">Je n'aime pas les épinards.</text>
<text x="340.0" y="432.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Vert : ce que j'aime (pouce levé). Orange : ce que je n'aime pas (pouce baissé).</text>
</svg>
