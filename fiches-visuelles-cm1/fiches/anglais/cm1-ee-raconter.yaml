  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "doesn't": "does not : ne… pas, avec he, she, it (He doesn't like carrots : il n'aime pas les carottes)"
blocs:
  - id: formule
    type: formule
    expression: "[On Saturday], I play football [and] I eat an ice cream."
    termes:
      On Saturday: {couleur: bleu, legende: "**quand** : un repère de temps pour commencer (on Saturday : le samedi ; today : aujourd'hui)."}
      and: {couleur: orange, legende: "un **mot de liaison** : il relie deux idées. And ajoute, then dit ce qui vient après, but annonce un contraire."}
    jules: "Sans mots de liaison, ton texte ressemble à une liste de courses. Avec and, then et but, il devient une vraie petite histoire."

  - id: carte
    type: carte
    noeuds:
      - {id: raconter, titre: "Raconter en anglais", sous_titre: "des phrases courtes que je connais déjà, mises bout à bout", principal: true}
      - {id: quand, titre: "Quand ? Où ?", sous_titre: "On Saturday, today… in the park, at school"}
      - {id: verbe, titre: "Un verbe au présent", sous_titre: "I play, I go, I eat ; she plays, he goes"}
      - {id: liaison, titre: "Les mots de liaison", sous_titre: "and (et), then (ensuite), but (mais)"}
      - {id: avis, titre: "Mon avis", sous_titre: "It is fun! It is great! I love…"}
    liens:
      - {de: raconter, vers: quand}
      - {de: raconter, vers: verbe}
      - {de: raconter, vers: liaison}
      - {de: raconter, vers: avis}
    jules: "Tu n'inventes pas de phrases compliquées : tu réutilises celles que tu as apprises en classe, et tu changes les mots (park devient zoo, football devient tennis)."

  - id: schema-modele
    type: schema
    titre: "Le modèle de Léna : 5 phrases pour raconter son samedi"
    svg: "cm1-ee-raconter.svg"
    jules: "Chaque phrase a son rôle : quand et où, ce que je fais, ensuite, un détail, mon avis. Garde ce plan en tête, et tu pourras raconter n'importe quelle journée."

  - id: schema-s
    type: schema
    titre: "Raconter pour quelqu'un d'autre : le verbe prend un -s"
    svg: "cm1-ee-raconter-s.svg"
    jules: "Seul le verbe change, tout le reste de la phrase reste pareil. Relis chaque verbe après she, he ou un prénom et vérifie qu'il a son -s."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-mois, nom: mois, min: 1, max: 12, pas: 1, depart: 10}
      - {id: curseur-debut, nom: debut, min: 1, max: 1, pas: 1, depart: 1}
      - {id: curseur-fin, nom: fin, min: 12, max: 12, pas: 1, depart: 12}
    lectures:
      - {si: "mois <= 2", texte: "January, February : en anglais, le mois prend toujours une **majuscule** (in January)."}
      - {si: "mois >= 3 && mois <= 6", texte: "March, April, May, June : on dit **in** devant un mois seul (in May), **on** devant une date (on May 3rd)."}
      - {si: "mois >= 7 && mois <= 9", texte: "July, August, September : pour raconter tes vacances, commence par **In July**, puis dis où tu étais."}
      - {si: "mois >= 10", texte: "October, November, December : le 1er s'écrit **1st**, le 2 **2nd**, le 3 **3rd**, les autres jours **th** (10th), sauf 21st, 22nd, 23rd et 31st."}
    jules: "Choisis un mois et commence ton histoire par lui : In October, I went to the park. N'oublie pas la majuscule au mois."

  - id: methode
    type: methode
    etapes:
      - "Choisis ce que tu racontes : un samedi, un anniversaire, une sortie, ou une histoire inventée."
      - "Écris la 1re phrase avec **quand** et **où** : On Saturday, I go to the park."
      - "Ajoute 2 ou 3 phrases sur ce que tu fais, reliées par and, then ou but."
      - "Termine par ton **avis** : It is fun! ou I love… (j'adore)."
      - "Relis chaque verbe : après he, she ou un prénom, ajoute le **-s** (she plays, Tom likes)."
    jules: "Pour la date du jour, les Anglais écrivent par exemple Monday 14 October (lundi 14 octobre). Les jours et les mois prennent une majuscule en anglais."

  - id: piege
    type: piege
    mauvaise_idee: "Je raconte le samedi de mon frère Tom : « Tom play football and he like pizza. »"
    pourquoi_faux: "Avec Tom, he ou she, le verbe au présent prend un **-s**. Sans lui, la phrase est fausse."
    bonne_idee: "Tom plays football and he likes pizza. Mais pour moi : I play football and I like pizza, sans -s."
    jules: "Deux verbes font exception : go devient **goes** (he goes to the park) et have devient **has** (she has a cat)."

  - id: exemple-tom
    type: exemple
    situation: "Écris 3 phrases sur ton cousin Tom : il habite à Nantes, il aime le basket, il a un chien et il le promène au parc."
    calcul: "Tom lives in Nantes. He likes basketball. He has a dog and he walks it in the park."
    conclusion: "Chaque verbe a sa marque : **lives**, **likes**, **has**. Traduction : Tom habite à Nantes. Il aime le basket. Il a un chien et il le promène au parc."
    jules: "Quand le prénom a déjà été dit, on le remplace par he (garçon) ou she (fille), comme en français avec « il » et « elle »."

  - id: exemple-dragon
    type: exemple
    situation: "Raconter, c'est aussi inventer ! Yanis écrit une histoire sur un dragon imaginaire."
    calcul: "My dragon is big and green. His name is Fuego. He lives in my garden. He eats pizza, but he doesn't like carrots. Then he sleeps under my bed."
    conclusion: "Cinq phrases, trois **mots de liaison** : and, but, then. Traduction : Mon dragon est grand et vert. Il s'appelle Fuego. Il habite dans mon jardin. Il mange de la pizza, mais il n'aime pas les carottes. Ensuite, il dort sous mon lit."
    jules: "En anglais, l'adjectif se place avant le nom et ne s'accorde jamais : a green dragon, two green dragons. Pas de -s à green !"

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : reprends le modèle de Léna et change les mots bleus et verts pour raconter TON samedi. Tu as déjà un texte de 5 phrases !"
