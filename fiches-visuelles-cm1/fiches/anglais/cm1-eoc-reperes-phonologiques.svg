<text class="t" x="116.0" y="190.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-weight="700">la langue sort un peu</text>
<text class="t" x="116.0" y="209.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-weight="700">entre les dents,</text>
<text class="t" x="116.0" y="228.0" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-weight="700">et on souffle</text>
<text class="tl" x="116.0" y="255.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">three</text>
<text class="t" x="116.0" y="279.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">/θriː/  trois</text>
