<text class="t" x="340.0" y="424.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-weight="700">hungry ≠ angry</text>
<text class="t" x="340.0" y="444.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">j'ai faim ≠ en colère</text>
