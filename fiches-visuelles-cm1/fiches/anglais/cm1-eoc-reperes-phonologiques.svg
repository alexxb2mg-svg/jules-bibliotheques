<text class="t" x="340.0" y="190.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-weight="700">on souffle fort,</text>
<text class="t" x="340.0" y="209.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-weight="700">comme pour faire de</text>
<text class="t" x="340.0" y="228.0" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-weight="700">la buée sur une vitre</text>
<text class="tl" x="340.0" y="255.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">hello</text>
<text class="t" x="340.0" y="279.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">/həˈləʊ/  bonjour</text>
<text class="tl" x="340.0" y="305.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">happy</text>
<text class="t" x="340.0" y="329.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">/ˈhæpi/  content</text>
