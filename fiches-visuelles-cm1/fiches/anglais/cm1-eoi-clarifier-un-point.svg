<text x="116.0" y="330.0" font-size="14" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">La maîtresse dit :</text>
<text x="116.0" y="350.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">« Sors ta règle ! »</text>
<text x="116.0" y="368.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Zoé ne comprend pas.</text>
<text x="340.0" y="330.0" font-size="14" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">Zoé le dit poliment :</text>
<text x="340.0" y="350.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">« Pardon, je ne comprends</text>
<text x="340.0" y="368.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">pas. Tu peux répéter ? »</text>
<text x="564.0" y="330.0" font-size="14" fill="#1a1a18" font-weight="600" text-anchor="middle" dominant-baseline="central">La maîtresse répète</text>
<text x="564.0" y="350.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">en montrant la règle.</text>
<text x="564.0" y="368.0" font-size="13" fill="#5f5e5a" font-weight="500" text-anchor="middle" dominant-baseline="central">Zoé a compris !</text>
<text x="340.0" y="406.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="middle" dominant-baseline="central"><tspan fill="#C2410C" font-weight="700">Orange</tspan><tspan> : la phrase de secours. </tspan><tspan fill="#1a1a18" font-weight="700">understand</tspan><tspan fill="#5f5e5a"> = /ʌndəˈstænd/ — </tspan><tspan fill="#1a1a18" font-weight="700">repeat</tspan><tspan fill="#5f5e5a"> = /rɪˈpiːt/</tspan></text>
