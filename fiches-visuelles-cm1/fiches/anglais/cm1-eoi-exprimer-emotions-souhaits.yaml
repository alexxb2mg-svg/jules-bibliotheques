notion: cm1-eoi-exprimer-emotions-souhaits
titre: "Dire comment je me sens et ce que je veux : I'm happy, I'd like…"
matiere: anglais
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Éduscol, « Anglais CM1 — Attendus de fin d'année », p. 17-18", url: "https://eduscol.education.gouv.fr/sites/default/files/document/c3langues-vivantes-cm1-attendusanglais-v1pdf-104457.pdf", licence: etalab-2.0}
  - {titre: "Programme de langues vivantes étrangères et régionales pour les classes de cours moyen (cycle 3)", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%202%20%E2%80%93%20Programme%20de%20langues%20vivantes%20%C3%A9trang%C3%A8res%20et%20r%C3%A9gionales%20pour%20les%20classes%20de%20cours%20moyen%20%28cycle%203%29-481190.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  "I'm": "I am : je suis (I'm happy : je suis content)"
  "I'd": "I would : je voudrais, dans I'd like (poli)"
  "It's": "It is : c'est (It's easy : c'est facile)"
blocs:
  - id: formule
    type: formule
    expression: "[I'm] happy.  [I want] a dog.  [I'd like] a drink."
    termes:
      I'm: {couleur: bleu, legende: "**je suis** : pour dire ce que tu ressens. I'm happy (je suis content), I'm tired (je suis fatigué)."}
      I want: {couleur: orange, legende: "**je veux** : un souhait dit tout droit, entre copains ou en famille. I want a dog!"}
      I'd like: {couleur: vert, legende: "**je voudrais** : la manière polie de demander, au magasin ou à un adulte. I'd se dit /aɪd/."}
    jules: "I want, c'est comme « je veux » : un peu sec si on parle à un adulte. Avec I'd like… please, tu es sûr d'être poli partout."

  - id: carte
    type: carte
    noeuds:
      - {id: ressentir, titre: "Dire ce que je ressens", sous_titre: "avec I'm, et le ton de la voix", principal: true}
      - {id: nouvelles, titre: "How are you?", sous_titre: "I'm fine, thank you. And you?"}
      - {id: emotions, titre: "Mes émotions", sous_titre: "happy, sad, angry, tired, scared"}
      - {id: onomato, titre: "Les onomatopées", sous_titre: "Yummy! Ouch! Wow! Yuck!"}
      - {id: souhaits, titre: "Mes souhaits", sous_titre: "I want… (je veux), I'd like… (je voudrais)"}
    liens:
      - {de: ressentir, vers: nouvelles}
      - {de: ressentir, vers: emotions}
      - {de: ressentir, vers: onomato}
      - {de: ressentir, vers: souhaits}
    jules: "Ta voix parle autant que tes mots : un « I'm happy » dit d'une voix triste, personne n'y croit. Monte la voix pour la joie, baisse-la pour la tristesse."

  - id: schema-visages
    type: schema
    titre: "Cinq visages, cinq émotions, et le piège du « j'ai »"
    svg: "cm1-eoi-exprimer-emotions-souhaits.svg"
    jules: "Pour la faim, la soif, le froid ou la peur, le français dit « j'ai » et l'anglais dit **I'm** (je suis). Dans happy et hungry, le h se prononce : on souffle, comme sur une vitre."

  - id: schema-onomatopees
    type: schema
    titre: "Les onomatopées anglaises : miam se dit Yummy!"
    svg: "cm1-eoi-exprimer-emotions-souhaits-onomatopees.svg"
    jules: "Une **onomatopée**, c'est un mot qui imite un bruit ou une réaction. Chaque langue a les siennes : un Anglais qui se cogne ne dit pas « aïe », mais « Ouch ! »."

  - id: methode
    type: methode
    etapes:
      - "Demande-toi ce que tu ressens : de la joie, de la tristesse, de la colère, de la fatigue, de la peur ?"
      - "Choisis le mot : I'm **happy**, sad, angry, tired ou scared."
      - "Pour une réaction rapide, prends une onomatopée : Wow! Yummy! Ouch! Oh no!"
      - "Pour un souhait, dis **I'd like** + ce que tu veux, et termine par please."
      - "Écoute la réponse de l'autre et réagis à ton tour : Great! Oh no! Me too!"
    jules: "Me too! veut dire « moi aussi ! » : c'est la réaction parfaite quand un copain dit I'm hungry à 11 h 30, juste avant la cantine."

  - id: piege
    type: piege
    mauvaise_idee: "À chaque « How are you? », je réponds « I'm fine », même quand je suis fatigué ou triste."
    pourquoi_faux: "I'm fine veut dire « ça va bien ». Si tu es fatigué, triste ou en colère, il existe un mot pour le dire : l'autre pourra **réagir** à ce que tu ressens vraiment."
    bonne_idee: "How are you? I'm tired (je suis fatigué). I'm great! (super bien !). I'm sad (je suis triste). Oh no, why? (oh non, pourquoi ?)"
    jules: "Deuxième piège, celui du schéma : « j'ai faim » ne se dit pas I have hungry, mais **I'm hungry**. Pareil pour I'm thirsty (j'ai soif) et I'm scared (j'ai peur)."

  - id: exemple-gouter
    type: exemple
    situation: "Au goûter, Nour goûte pour la première fois un muffin aux myrtilles. Il est délicieux, et elle en voudrait un deuxième."
    calcul: "Nour : Yummy! It's delicious! I'd like another muffin, please. Maman : Here you are! Nour : Thank you, I'm so happy!"
    conclusion: "Une **onomatopée** pour réagir, **I'd like** pour demander poliment. Traduction : Miam ! C'est délicieux ! Je voudrais un autre muffin, s'il te plaît. Tiens ! Merci, je suis trop contente !"
    jules: "Another veut dire « un autre » : I'd like another one (j'en voudrais un autre) marche pour tout, un gâteau, une histoire, une partie."

  - id: exemple-rituel
    type: exemple
    situation: "C'est le rituel du début de la séance d'anglais. La maîtresse demande « How are you today? » à Ethan, qui a mal dormi."
    calcul: "Ethan : I'm tired. La maîtresse : Oh, poor Ethan! Ethan : But I'm happy, it's Friday!"
    conclusion: "Ethan dit **vraiment** ce qu'il ressent, puis ajoute une bonne nouvelle avec but (mais). Traduction : Je suis fatigué. Oh, mon pauvre Ethan ! Mais je suis content, c'est vendredi !"
    jules: "Tired se dit /ˈtaɪəd/, comme « taïeud » : le r ne s'entend presque pas. Et Friday commence comme « fraï »."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi miroir : mime chaque émotion devant une glace en disant la phrase (I'm angry, I'm scared…). Ton visage et ta voix doivent dire la même chose que tes mots."
