notion: cm1-inegal-acces-eau-sante-education
titre: "L'eau, la santé, l'école : tout le monde n'y a pas accès de la même façon"
matiere: geographie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p. 11", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: acces
    type: formule
    expression: "[accès facile] : proche, rapide  ≠  [accès difficile] : loin, rare, cher"
    termes:
      "accès facile": {couleur: vert, legende: "le service est **près** de chez soi : l'eau au robinet, l'école au bout de la rue, un médecin dans la ville"}
      "accès difficile": {couleur: orange, legende: "il faut aller **loin**, attendre, ou payer trop cher : marcher longtemps pour trouver de l'eau propre ou un hôpital"}
    jules: "Avoir **accès** à quelque chose, c'est pouvoir s'en servir facilement. Une école qui existe mais qui est à des heures de marche, c'est un accès difficile."

  - id: carte
    type: carte
    noeuds:
      - {id: inegal, titre: "Un accès inégal", sous_titre: "pas le même pour tout le monde, selon l'endroit où l'on vit", principal: true}
      - {id: eau, titre: "L'eau potable", sous_titre: "l'eau qu'on peut boire sans tomber malade"}
      - {id: sante, titre: "La santé", sous_titre: "pouvoir se faire soigner : médecin, hôpital, médicaments"}
      - {id: education, titre: "L'éducation", sous_titre: "pouvoir aller à l'école et apprendre"}
      - {id: niveau, titre: "Le niveau de vie", sous_titre: "ces différences montrent des pays et des lieux plus ou moins riches"}
    liens:
      - {de: inegal, vers: eau}
      - {de: inegal, vers: sante}
      - {de: inegal, vers: education}
      - {de: inegal, vers: niveau, libelle: "signe des inégalités de"}
    jules: "Le **niveau de vie**, c'est la façon dont on peut vivre avec l'argent et les services dont on dispose. L'accès à l'eau, aux soins et à l'école en est un bon signe."

  - id: schema-eau
    type: schema
    titre: "Aller chercher l'eau : au robinet, ou à pied loin de la maison"
    svg: "cm1-inegal-acces-eau-sante-education.svg"
    jules: "Ouvrir le robinet te paraît normal, mais ce n'est pas le cas partout. Dans les villages sans eau courante, ce sont souvent les enfants et les femmes qui font le trajet."

  - id: schema-plans
    type: schema
    titre: "Eau, santé, éducation : près ou loin de la maison"
    svg: "cm1-inegal-acces-eau-sante-education-plans.svg"
    jules: "Les trois domaines ne vont pas toujours ensemble : un village peut avoir une école toute proche, mais pas d'hôpital ni d'eau au robinet. Il faut regarder chaque domaine un par un."

  - id: graphe
    type: graphe
    gabarit: journee-repartition
    curseurs:
      - {id: curseur-distance, nom: distance, min: 0, max: 5, pas: 0.5, depart: 2}
      - {id: curseur-trajets, nom: trajets, min: 1, max: 3, pas: 1, depart: 1}
    lectures:
      - {si: "distance == 0", texte: "L'eau arrive au **robinet** : aller la chercher ne prend pas de temps."}
      - {si: "distance > 0", texte: "Le point d'eau est loin : la **corvée d'eau** grignote le temps libre ; ce sont souvent les filles et les femmes qui la font."}
      - {si: "distance >= 3 && trajets >= 2", texte: "Plusieurs allers-retours : la corvée d'eau prend au moins 3 heures par jour, autant que la moitié de la journée d'école."}
      - {si: "distance >= 4.5 && trajets == 3", texte: "Plus de temps libre du tout : la corvée d'eau prend même du temps d'**école**. L'accès à l'eau et l'accès à l'éducation sont liés."}
    jules: "Éloigne le point d'eau, puis ajoute des trajets : les cases orange mangent d'abord le temps libre en vert, puis l'école en bleu. Compte les cases."

  - id: methode
    type: methode
    etapes:
      - "Trouve le domaine dont on parle : l'**eau**, la **santé** ou l'**éducation**."
      - "Regarde si l'accès est facile (proche, rapide) ou difficile (loin, rare, cher)."
      - "Explique la conséquence : du temps perdu, des maladies, des enfants qui ne vont pas à l'école."
      - "Relie cette difficulté aux **inégalités de niveau de vie** dans le monde."
    jules: "Un bon réflexe : pense d'abord à ta propre vie, par exemple au temps qu'il te faut pour boire, aller à l'école ou voir un médecin. Puis compare avec la situation étudiée."

  - id: piege
    type: piege
    mauvaise_idee: "Si un village manque d'eau, il manque forcément aussi d'école et d'hôpital."
    pourquoi_faux: "Les trois domaines ne vont pas **toujours ensemble**. Un village peut avoir une école toute neuve et devoir quand même marcher loin pour trouver de l'eau potable."
    bonne_idee: "On regarde **chaque domaine** séparément : l'eau, puis la santé, puis l'éducation. Dans le village B du schéma, l'école est près, mais l'eau et l'hôpital sont loin."
    jules: "Autre erreur : croire que ces inégalités n'existent que sur un seul continent. On en trouve sur plusieurs continents, et même en France, certains villages sont loin d'un médecin."

  - id: exemple-eau
    type: exemple
    situation: "Dans un village, les habitants marchent plusieurs heures pour trouver de l'eau potable. Dans la ville de Nathan, l'eau arrive directement au robinet. Que montre cette comparaison ?"
    calcul: "Domaine : l'eau. Au village, l'accès est difficile (loin, long). Chez Nathan, il est facile (dans la maison, tout de suite)."
    conclusion: "C'est une manifestation de l'**inégal accès à l'eau**, donc des **inégalités de niveau de vie** dans le monde."
    jules: "Une **manifestation**, ici, c'est un signe qu'on peut voir. La longue marche pour l'eau est un signe visible de l'inégalité."

  - id: exemple-ecole
    type: exemple
    situation: "Samir met 5 minutes à pied pour aller à l'école. Un enfant d'un autre pays doit marcher très longtemps chaque matin pour rejoindre l'école la plus proche. Pourquoi parle-t-on d'inégalité ?"
    calcul: "Domaine : l'éducation. Pour Samir, l'école est proche. Pour l'autre enfant, elle est loin : il arrive fatigué, et quand il pleut ou qu'il doit aider sa famille, il ne peut pas y aller."
    conclusion: "L'**accès à l'éducation** n'est pas le même pour tous les enfants du monde : c'est une **inégalité**."
    jules: "Ces deux enfants ont le même droit d'aller à l'école. Ce qui change, c'est la facilité pour y arriver."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine ton propre plan en cercles, avec ta maison au centre. Place ton école, le point d'eau le plus proche (ton robinet !) et le médecin, puis compare avec le village B."
