<text class="th" x="432.0" y="130.0" text-anchor="start" dominant-baseline="central">peu ou pas de 5G :</text>
<text class="t" x="432.0" y="148.0" text-anchor="start" dominant-baseline="central">beaucoup de campagnes</text>
