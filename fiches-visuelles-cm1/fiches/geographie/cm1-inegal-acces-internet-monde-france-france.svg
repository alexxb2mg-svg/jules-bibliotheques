<text class="t" x="432.0" y="198.0" text-anchor="start" dominant-baseline="central">par endroits, surtout en</text>
<text class="t" x="432.0" y="216.0" text-anchor="start" dominant-baseline="central">montagne, le réseau mobile</text>
<text class="t" x="432.0" y="234.0" text-anchor="start" dominant-baseline="central">ne passe presque pas</text>
<g class="c-blue"><rect x="396" y="262" width="264" height="96" rx="8" stroke-width="0.8"/><text class="th" x="528.0" y="281.5" text-anchor="middle" dominant-baseline="central">Pourquoi ?</text><text class="t" x="528.0" y="300.5" text-anchor="middle" dominant-baseline="central">Il y a beaucoup d'habitants dans</text><text class="t" x="528.0" y="319.5" text-anchor="middle" dominant-baseline="central">les villes : on y installe les</text><text class="t" x="528.0" y="338.5" text-anchor="middle" dominant-baseline="central">antennes en premier.</text></g>
<text class="t" x="200.0" y="386.0" text-anchor="middle" dominant-baseline="central">La France entière n'est pas reliée de la même façon :</text>
