notion: cm1-inegal-acces-internet-monde-france
titre: "Internet n'arrive pas partout pareil : dans le monde et en France"
matiere: geographie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p. 12", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  5G: "la 5e génération de réseau mobile : un réseau pour téléphones plus rapide que la 4G"
  4G: "la 4e génération de réseau mobile, plus ancienne que la 5G"
blocs:
  - id: echelles
    type: formule
    expression: "l'inégal accès à Internet se voit à 2 échelles : [le monde] et [la France]"
    termes:
      "le monde": {couleur: vert, legende: "à l'**échelle mondiale**, on compare des aires régionales : certaines très bien reliées, d'autres faiblement"}
      "la France": {couleur: violet, legende: "à l'**échelle de la France**, on compare des lieux : les grandes villes et les campagnes, par exemple avec la 5G"}
    jules: "Une **échelle**, c'est la taille de l'espace qu'on regarde : le monde entier, ou un seul pays. Dis toujours de quelle échelle tu parles."

  - id: carte
    type: carte
    noeuds:
      - {id: inegal, titre: "Un accès inégal à Internet", sous_titre: "pas le même partout dans le monde, ni partout en France", principal: true}
      - {id: bien, titre: "Très bien reliées", sous_titre: "l'Amérique du Nord, l'Europe, l'Asie de l'Est"}
      - {id: faible, titre: "Faiblement reliée", sous_titre: "l'Afrique subsaharienne"}
      - {id: villes, titre: "En France : les villes", sous_titre: "la 5G y est installée en premier"}
      - {id: campagnes, titre: "En France : les campagnes", sous_titre: "moins de 5G, et quelques zones blanches en montagne"}
    liens:
      - {de: inegal, vers: bien, libelle: "dans le monde"}
      - {de: inegal, vers: faible, libelle: "dans le monde"}
      - {de: inegal, vers: villes, libelle: "en France"}
      - {de: inegal, vers: campagnes, libelle: "en France"}
    jules: "Ces inégalités ressemblent à celles des câbles : là où il y a beaucoup de câbles et d'antennes, Internet arrive facilement."

  - id: schema-monde
    type: schema
    titre: "L'accès à Internet dans le monde, par aire régionale"
    svg: "cm1-inegal-acces-internet-monde-france.svg"
    jules: "Le vert foncé montre les aires les mieux reliées, l'orange l'aire la moins reliée. À l'intérieur d'une même aire, il y a aussi des différences entre les villes et les campagnes."

  - id: schema-france
    type: schema
    titre: "Le déploiement de la 5G en France : les villes d'abord"
    svg: "cm1-inegal-acces-internet-monde-france-france.svg"
    jules: "**Déployer**, c'est installer petit à petit, un endroit après l'autre. Les antennes 5G sont d'abord posées là où vivent le plus de gens."

  - id: methode
    type: methode
    etapes:
      - "Précise d'abord l'**échelle** : le monde entier, ou la France."
      - "À l'échelle mondiale, compare une aire **très bien reliée** (l'Amérique du Nord, l'Europe) et une aire **faiblement reliée** (l'Afrique subsaharienne)."
      - "À l'échelle de la France, compare les grandes villes, où la 5G est très présente, et les campagnes ou la montagne."
      - "Conclus avec le bon mot : ce sont des **inégalités d'accès** à Internet."
    jules: "Pour lire la carte, regarde d'abord la légende : elle te dit ce que veut dire chaque couleur. Ensuite seulement, cherche où sont les couleurs."

  - id: piege
    type: piege
    mauvaise_idee: "L'inégal accès à Internet, ça concerne les autres pays, pas la France."
    pourquoi_faux: "En France aussi, l'accès **change selon les endroits** : la 5G est très présente dans les grandes villes, moins dans beaucoup de campagnes, et certaines zones de montagne captent à peine."
    bonne_idee: "L'inégal accès existe aux **deux échelles** : dans le monde (Europe très bien reliée, Afrique subsaharienne faiblement) et en France (villes et campagnes)."
    jules: "Autre erreur : mélanger les échelles dans une même réponse. Écris « dans le monde » ou « en France » au début de ta phrase."

  - id: exemple-monde
    type: exemple
    situation: "Sur une carte du monde, l'Europe est en vert foncé (très bien reliée à Internet) et l'Afrique subsaharienne en orange (faiblement reliée). Que montre cette carte ?"
    calcul: "Échelle : le monde. Une aire régionale très bien reliée : l'Europe. Une aire régionale faiblement reliée : l'Afrique subsaharienne."
    conclusion: "Cette carte montre l'inégal accès à Internet à l'**échelle mondiale** : des aires très bien reliées, d'autres faiblement."
    jules: "Faiblement reliée ne veut pas dire « sans Internet » : dans les grandes villes africaines, beaucoup de gens se connectent, surtout avec leur téléphone portable."

  - id: exemple-france
    type: exemple
    situation: "Gabriel habite à Lyon : son téléphone capte la 5G partout dans son quartier. En vacances chez sa tante, dans un village de montagne, il capte à peine et ne peut pas regarder de vidéo. Qu'est-ce que cela montre ?"
    calcul: "Échelle : la France. À Lyon, une grande ville, le réseau est très présent. Dans le village de montagne, peu d'antennes : le réseau passe mal."
    conclusion: "Cela montre l'**inégal accès à Internet** à l'**échelle de la France**, entre une grande ville et une zone de montagne."
    jules: "Un endroit où le téléphone ne capte presque pas le réseau s'appelle une **zone blanche**. En montagne, les reliefs gênent les ondes, et il y a peu d'habitants."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : demande à un adulte si son téléphone capte bien partout où vous allez, en ville, à la campagne, en vacances. Note les endroits où ça capte mal."
