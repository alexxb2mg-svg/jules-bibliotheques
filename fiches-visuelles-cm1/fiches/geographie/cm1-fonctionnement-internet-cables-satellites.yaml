notion: cm1-fonctionnement-internet-cables-satellites
titre: "Internet : un réseau de câbles, jusqu'au fond des océans, et de satellites"
matiere: geographie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p. 12", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: reseau
    type: formule
    expression: "Internet = un réseau de [câbles] + des [satellites]"
    termes:
      "câbles": {couleur: orange, legende: "des **câbles continentaux**, sous la terre, et des **câbles sous-marins**, posés au fond des océans : ils relient les aires régionales"}
      "satellites": {couleur: violet, legende: "des appareils qui **tournent autour de la Terre** et renvoient les données, surtout là où il n'y a pas de câble"}
    jules: "Un **réseau**, c'est un ensemble de lignes reliées entre elles, comme les routes d'une carte. Sur Internet, ce sont des informations qui circulent, pas des voitures."

  - id: carte
    type: carte
    noeuds:
      - {id: internet, titre: "Internet", sous_titre: "un réseau qui relie le monde entier", principal: true}
      - {id: usages, titre: "Ses usages", sous_titre: "chercher pour un exposé, regarder une vidéo, appeler sa famille, jouer"}
      - {id: cables, titre: "Les câbles", sous_titre: "sous les rues et au fond des océans : l'essentiel du trafic"}
      - {id: satellites, titre: "Les satellites", sous_titre: "autour de la Terre : pour les bateaux, les lieux isolés"}
      - {id: centres, titre: "Les centres de données", sous_titre: "des bâtiments remplis d'ordinateurs qui gardent les vidéos, les sites..."}
    liens:
      - {de: internet, vers: usages}
      - {de: internet, vers: cables}
      - {de: internet, vers: satellites}
      - {de: cables, vers: centres, libelle: "arrivent aux"}
    jules: "Chaque fois que tu regardes une vidéo, elle vient d'un **centre de données**, parfois sur un autre continent. Elle voyage jusqu'à toi par les câbles, en une fraction de seconde."

  - id: schema-voyage
    type: schema
    titre: "Le voyage d'un message : wifi, box, câbles, et satellite"
    svg: "cm1-fonctionnement-internet-cables-satellites.svg"
    jules: "Le wifi ne fait qu'un tout petit bout du trajet : de ta tablette à la box. Ensuite, le message voyage dans des câbles, jusque sous l'océan."

  - id: schema-carte
    type: schema
    titre: "Les grandes concentrations de câbles sous-marins"
    svg: "cm1-fonctionnement-internet-cables-satellites-carte.svg"
    jules: "Les câbles sont les plus nombreux entre les aires régionales très reliées : Europe, Amérique du Nord et Asie de l'Est. Retiens surtout l'océan **Atlantique Nord**, le **Pacifique Nord** et la route **Europe-Asie**."

  - id: methode
    type: methode
    etapes:
      - "Distingue les deux sortes d'équipements du réseau : les **câbles** et les **satellites**."
      - "Pour les câbles, précise où ils passent : sous la terre (**continentaux**) ou au fond des océans (**sous-marins**)."
      - "Pour les satellites, rappelle qu'ils tournent autour de la Terre et qu'ils complètent les câbles, là où il n'y en a pas."
      - "Situe les grandes concentrations de câbles sur le planisphère : Atlantique Nord, Pacifique Nord, Europe-Asie."
    jules: "Pour t'en souvenir, pense aux marchandises qui traversent l'océan en bateau, à la surface. Le message, lui, traverse l'océan dans un câble, posé tout au fond."

  - id: piege
    type: piege
    mauvaise_idee: "Internet passe dans les airs, par les satellites et le wifi, sans câbles."
    pourquoi_faux: "L'essentiel d'Internet voyage dans des **câbles**, dont des câbles **sous-marins** posés au fond des océans. Le wifi ne relie que la tablette à la box, dans la maison."
    bonne_idee: "Internet repose sur **deux** équipements : un grand réseau de câbles, complété par des satellites là où il n'y a pas de câble (un bateau en pleine mer, un refuge en montagne)."
    jules: "Autre erreur : croire que les câbles ne passent que sur la terre. Pour aller d'un continent à l'autre, ils passent sous l'eau, au fond des océans."

  - id: exemple-message
    type: exemple
    situation: "Depuis la France, Léa envoie une photo à son cousin Sam, qui habite au Canada. La photo arrive presque tout de suite. Par où est-elle passée ?"
    calcul: "Tablette → box (wifi, dans la maison) → câble sous la rue → câble sous-marin au fond de l'océan Atlantique → centre de données en Amérique du Nord → ordinateur de Sam."
    conclusion: "La photo a surtout voyagé dans des **câbles**, dont un **câble sous-marin** qui relie l'Europe à l'Amérique du Nord."
    jules: "Elle aurait aussi pu passer par un **satellite**, mais entre l'Europe et l'Amérique du Nord, les câbles sont très nombreux : c'est le chemin le plus courant."

  - id: exemple-usages
    type: exemple
    situation: "En classe, on fait la liste des usages d'Internet. Nour cherche des informations pour un exposé sur les baleines. Tom appelle sa grand-mère en vidéo. Jade joue en ligne avec un ami. Qu'ont-ils en commun ?"
    calcul: "Trois usages différents : s'informer, communiquer, se divertir. Mais à chaque fois, des données voyagent entre leur appareil et d'autres ordinateurs, par le réseau."
    conclusion: "Les **usages d'Internet** sont très variés, mais ils reposent tous sur le même **réseau** de câbles et de satellites."
    jules: "Un appel vidéo avec quelqu'un à l'autre bout du monde traverse souvent un océan par un câble sous-marin, en moins d'une seconde."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : explique à quelqu'un de ta famille le trajet d'un message, de ta tablette jusqu'à un autre continent, sans oublier le câble au fond de l'océan."
