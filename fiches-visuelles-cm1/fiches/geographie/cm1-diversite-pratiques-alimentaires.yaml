notion: cm1-diversite-pratiques-alimentaires
titre: "Manger dans le monde : des repas différents, et tout le monde ne mange pas à sa faim"
matiere: geographie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p. 11", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: mots
    type: formule
    expression: "[sous-nutrition] : pas assez à manger ; [malnutrition] : manger mal"
    termes:
      "sous-nutrition": {couleur: orange, legende: "ne pas avoir **assez** à manger pour rester en bonne santé. « Sous » veut dire « en dessous » : en dessous de ce qu'il faut."}
      "malnutrition": {couleur: violet, legende: "une alimentation **mal équilibrée** : pas assez, trop, ou de mauvaise qualité (trop gras, trop sucré)."}
    jules: "La sous-nutrition est une sorte de malnutrition : celle où l'on n'a pas assez. Mais on peut aussi être en malnutrition en mangeant trop, ou trop de sucreries."

  - id: carte
    type: carte
    noeuds:
      - {id: manger, titre: "Manger dans le monde", sous_titre: "pas la même chose, ni en même quantité", principal: true}
      - {id: repas, titre: "Des repas différents", sous_titre: "riz, maïs, pain, poisson... selon le pays"}
      - {id: raisons, titre: "Pourquoi ?", sous_titre: "le climat, l'agriculture, la culture"}
      - {id: riche, titre: "Pays riche", sous_titre: "on mange en général à sa faim, beaucoup de produits transformés"}
      - {id: pauvre, titre: "Pays en développement", sous_titre: "une partie des habitants n'a pas assez à manger"}
    liens:
      - {de: manger, vers: repas}
      - {de: repas, vers: raisons}
      - {de: manger, vers: riche}
      - {de: manger, vers: pauvre}
    jules: "Les différences de quantité viennent surtout de la **richesse du pays**, pas d'un choix des habitants. Personne ne choisit d'avoir faim."

  - id: schema-repas
    type: schema
    titre: "Un repas possible dans quatre pays, sur quatre continents"
    svg: "cm1-diversite-pratiques-alimentaires.svg"
    jules: "Ce ne sont que des exemples : au Japon, on mange aussi des pâtes, et en France, du riz ! Ce qui compte, c'est de comprendre pourquoi certains aliments sont plus courants dans un pays."

  - id: schema-faim
    type: schema
    titre: "Manger à sa faim, pas assez, ou mal : et les pays à retenir"
    svg: "cm1-diversite-pratiques-alimentaires-faim.svg"
    jules: "La **ration alimentaire**, c'est la quantité de nourriture qu'un habitant mange en moyenne chaque jour. Aux États-Unis et en France, elle est très riche ; à Haïti et à Madagascar, elle est insuffisante pour beaucoup d'habitants."

  - id: methode
    type: methode
    etapes:
      - "Repère où se passe la situation : dans un **pays riche** ou dans un **pays en développement** ?"
      - "Cherche de quoi on parle : manger trop, manger mal, ou ne pas manger assez."
      - "Utilise le bon mot : **sous-nutrition** si ce n'est pas assez, **malnutrition** si l'alimentation est déséquilibrée."
      - "Pour comparer, prends toujours deux exemples sur deux continents différents."
    jules: "Pour expliquer un repas, pense aux trois raisons : le climat (ce qui peut pousser), l'agriculture (ce qu'on cultive et élève) et la culture (les habitudes et les fêtes)."

  - id: piege
    type: piege
    mauvaise_idee: "La faim dans le monde, ça ne touche que l'Afrique."
    pourquoi_faux: "La **sous-nutrition** existe sur plusieurs continents : à Madagascar en Afrique, mais aussi à Haïti en Amérique, ou dans certains pays d'Asie."
    bonne_idee: "On compare deux pays à ration insuffisante sur **deux continents différents** : Haïti (Amérique) et Madagascar (Afrique). Même chose pour la ration très riche : États-Unis (Amérique) et France (Europe)."
    jules: "Et dans un pays riche, tout le monde ne mange pas à sa faim : en France aussi, des familles ont besoin d'aide pour se nourrir. C'est pour cela que des associations distribuent des repas."

  - id: exemple-secheresse
    type: exemple
    situation: "En classe, Awa lit deux textes. Dans un pays, les récoltes sont bonnes presque toute l'année et les habitants mangent en général à leur faim. Dans un autre, la pluie manque souvent : les récoltes sèchent, et une partie des habitants n'a pas assez à manger. Quel mot utiliser pour le deuxième pays ?"
    calcul: "Le problème, c'est la quantité : « pas assez à manger ». Ce n'est pas « trop » ni « mal », c'est « pas assez »."
    conclusion: "C'est de la **sous-nutrition** : une partie des habitants n'a pas une alimentation suffisante pour rester en bonne santé."
    jules: "Une **sécheresse**, c'est un long moment sans assez de pluie. Sans eau, les plantes ne poussent pas, et la nourriture manque."

  - id: exemple-cantine
    type: exemple
    situation: "À la cantine, Léo repousse ses épinards : « Je n'aime pas ça, je vais mourir de faim ! » Est-ce que Léo est en sous-nutrition ?"
    calcul: "Léo a un repas complet dans son assiette : il choisit de ne pas manger un aliment. La sous-nutrition, c'est ne pas avoir assez à manger, sans l'avoir choisi."
    conclusion: "Non : **ne pas aimer** un aliment, ce n'est pas **ne pas avoir assez** à manger. Léo n'est pas en sous-nutrition."
    jules: "Pour ne pas te tromper, demande-toi : est-ce que la personne a de quoi manger ? Si oui, ce n'est pas de la sous-nutrition."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : note ton repas de ce soir, puis cherche d'où vient chaque aliment et pourquoi on le mange en France. Tu verras le climat, l'agriculture et la culture dans ton assiette."
