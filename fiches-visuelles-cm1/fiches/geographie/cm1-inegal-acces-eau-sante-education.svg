<g class="c-blue"><text class="t" x="125.0" y="246.0" text-anchor="middle" dominant-baseline="central">l'eau potable arrive</text></g>
<g class="c-blue"><text class="t" x="125.0" y="264.0" text-anchor="middle" dominant-baseline="central">au robinet, dans la maison</text></g>
<g class="c-blue"><text class="th" x="125.0" y="286.0" text-anchor="middle" dominant-baseline="central">quelques secondes</text></g>
<rect x="252.0" y="10.0" width="418.0" height="290.0" rx="10" fill="#FDF7EE" stroke="#ead9bd" stroke-width="1"/>
<text class="tl" x="461.0" y="34.0" text-anchor="middle" dominant-baseline="central">Dans un village sans eau courante</text>
<text class="ts" x="461.0" y="56.0" text-anchor="middle" dominant-baseline="central">par exemple dans certaines régions d'Afrique subsaharienne</text>
