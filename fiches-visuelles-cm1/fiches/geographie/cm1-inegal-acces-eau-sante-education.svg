<g class="c-amber"><text class="t" x="461.0" y="246.0" text-anchor="middle" dominant-baseline="central">on marche jusqu'au point d'eau, puis on</text></g>
<g class="c-amber"><text class="t" x="461.0" y="264.0" text-anchor="middle" dominant-baseline="central">revient en portant l'eau, qui est lourde</text></g>
<g class="c-amber"><text class="th" x="461.0" y="286.0" text-anchor="middle" dominant-baseline="central">parfois plusieurs heures par jour</text></g>
<g class="c-gray"><rect x="20" y="312" width="640" height="50" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="327.5" text-anchor="middle" dominant-baseline="central">Le temps passé à chercher l'eau, c'est du temps en moins pour l'école ou pour jouer.</text><text class="ts" x="340.0" y="346.5" text-anchor="middle" dominant-baseline="central">Et une eau qui n'est pas potable peut rendre malade : l'eau touche aussi la santé.</text></g>
