notion: cm1-localiser-nommer-aires-regionales
titre: "Les 8 aires régionales du monde : les situer et les nommer sur le planisphère"
matiere: geographie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p. 11", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Supports cartographiques pour la mise en œuvre du programme d'histoire-géographie, premier degré, cycles 2-3 » (2026), p. 3", url: "https://eduscol.education.gouv.fr/sites/default/files/document/fichehgcartoc2c32026-127502.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: aires, titre: "Les aires régionales", sous_titre: "des grandes parties de continents, plus précises que le continent entier", principal: true}
      - {id: amerique, titre: "Amérique : 2 aires", sous_titre: "l'Amérique du Nord et l'Amérique du Sud"}
      - {id: afrique, titre: "Afrique : 2 aires", sous_titre: "le Maghreb au nord, l'Afrique subsaharienne au sud du Sahara"}
      - {id: asie, titre: "Asie : 2 aires", sous_titre: "l'Asie de l'Est (Chine, Japon) et l'Asie du Sud-Est, plus bas"}
      - {id: entiers, titre: "Europe et Océanie", sous_titre: "une aire chacune : le continent entier"}
      - {id: planisphere, titre: "Le planisphère", sous_titre: "la carte du monde entier, mis à plat"}
    liens:
      - {de: aires, vers: amerique}
      - {de: aires, vers: afrique}
      - {de: aires, vers: asie}
      - {de: aires, vers: entiers}
      - {de: aires, vers: planisphere, libelle: "on les situe sur"}
    jules: "Compte sur tes doigts : 2 en Amérique, 2 en Afrique, 2 en Asie, puis l'Europe et l'Océanie. 2 + 2 + 2 + 1 + 1 = 8 aires régionales."

  - id: schema-planisphere
    type: schema
    titre: "Les 8 aires régionales sur le planisphère"
    svg: "cm1-localiser-nommer-aires-regionales.svg"
    jules: "Les couleurs t'aident : les deux aires d'un même continent ont deux teintes de la même couleur. La France est en **Europe**, en bleu : pars de là pour te repérer."

  - id: schema-zoom
    type: schema
    titre: "Zoom : l'Afrique et l'Asie ont chacune deux aires régionales"
    svg: "cm1-localiser-nommer-aires-regionales-zoom.svg"
    jules: "« Sub » veut dire « sous » : l'Afrique **subsaharienne**, c'est l'Afrique sous le Sahara, quand on regarde la carte avec le nord en haut."

  - id: methode
    type: methode
    etapes:
      - "Pose ton doigt sur l'Europe, là où est la France : c'est ton point de départ."
      - "Trouve le **continent** : l'Amérique à gauche, de l'autre côté de l'océan Atlantique ; l'Afrique juste en dessous de l'Europe ; l'Asie à droite ; l'Océanie en bas à droite."
      - "Précise la **partie** du continent : le nord ou le sud, l'est ou le sud-est, au-dessus ou au-dessous du Sahara."
      - "Écris le nom en entier, avec les majuscules : Afrique subsaharienne, Asie du Sud-Est, Amérique du Nord."
    jules: "**Localiser**, c'est montrer au bon endroit sur la carte. **Nommer**, c'est dire ou écrire le bon nom. Il faut savoir faire les deux."

  - id: piege
    type: piege
    mauvaise_idee: "Le Maghreb, c'est un autre nom pour l'Afrique."
    pourquoi_faux: "Le Maghreb n'est qu'une **partie** du continent africain : le nord-ouest, au bord de la mer Méditerranée. Au sud du Sahara, c'est une autre aire : l'**Afrique subsaharienne**."
    bonne_idee: "Un **continent** peut contenir plusieurs **aires régionales**. Le Maroc est en Afrique (le continent) et dans le Maghreb (l'aire). Le Sénégal est en Afrique aussi, mais dans l'Afrique subsaharienne."
    jules: "Autre confusion fréquente : l'Asie de l'Est et l'Asie du Sud-Est. La Chine et le Japon sont à l'Est ; l'Asie du Sud-Est est plus au sud, avec beaucoup d'îles."

  - id: exemple-maroc
    type: exemple
    situation: "Cet été, Inès est partie chez sa grand-mère, au Maroc. Sur le planisphère de la classe, elle cherche le Maroc : il est au nord-ouest de l'Afrique, au bord de la mer Méditerranée et de l'océan Atlantique. Dans quelle aire régionale est-il ?"
    calcul: "Le continent : l'Afrique. La partie : le nord-ouest, au-dessus du Sahara, au bord de la Méditerranée."
    conclusion: "Le Maroc est dans le **Maghreb**, une aire régionale du continent africain."
    jules: "Le Maghreb regroupe surtout le Maroc, l'Algérie et la Tunisie. L'Égypte, plus à l'est, est aussi au nord de l'Afrique, mais elle ne fait pas partie du Maghreb."

  - id: exemple-drapeaux
    type: exemple
    situation: "Pour la Coupe du monde, Lucas colle des drapeaux sur un planisphère : Brésil, Canada, Sénégal, Australie. Dans quelle aire régionale va chaque drapeau ?"
    calcul: "Le Brésil : Amérique, partie sud. Le Canada : Amérique, partie nord. Le Sénégal : Afrique, au sud du Sahara. L'Australie : le continent Océanie, en bas à droite."
    conclusion: "Brésil : **Amérique du Sud**. Canada : Amérique du Nord. Sénégal : **Afrique subsaharienne**. Australie : Océanie."
    jules: "La Nouvelle-Calédonie, une île française, se trouve en Océanie, de l'autre côté de la Terre. La France a des territoires dans plusieurs aires régionales."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : sur un planisphère vierge, colorie les 8 aires sans regarder la fiche, puis vérifie avec elle. Recommence le lendemain : tu iras plus vite."
