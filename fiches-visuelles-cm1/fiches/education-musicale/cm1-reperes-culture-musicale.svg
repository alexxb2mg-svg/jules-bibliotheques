<svg width="100%" viewBox="0 0 680 462" xmlns="http://www.w3.org/2000/svg"><title>Frise des grandes périodes de la musique, avec une œuvre pour chacune</title>
<text x="340.0" y="16.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Six grandes périodes, une œuvre à écouter pour chacune</text>
<rect x="20.0" y="190.0" width="104.0" height="46.0" rx="0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="72.0" y="205" text-anchor="middle" dominant-baseline="central">Moyen Âge</text>
<text class="ts" x="72.0" y="223.0" text-anchor="middle" dominant-baseline="central">avant 1500</text>
<rect x="124.0" y="190.0" width="104.0" height="46.0" rx="0" fill="#E4E1D6" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="176.0" y="205" text-anchor="middle" dominant-baseline="central">Renaissance</text>
<text class="ts" x="176.0" y="223.0" text-anchor="middle" dominant-baseline="central">1500 – 1600</text>
<rect x="228.0" y="190.0" width="104.0" height="46.0" rx="0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="280.0" y="205" text-anchor="middle" dominant-baseline="central">Baroque</text>
<text class="ts" x="280.0" y="223.0" text-anchor="middle" dominant-baseline="central">1600 – 1750</text>
<rect x="332.0" y="190.0" width="104.0" height="46.0" rx="0" fill="#E4E1D6" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="384.0" y="205" text-anchor="middle" dominant-baseline="central">Classique</text>
<text class="ts" x="384.0" y="223.0" text-anchor="middle" dominant-baseline="central">1750 – 1820</text>
<rect x="436.0" y="190.0" width="104.0" height="46.0" rx="0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="488.0" y="205" text-anchor="middle" dominant-baseline="central">Romantique</text>
<text class="ts" x="488.0" y="223.0" text-anchor="middle" dominant-baseline="central">1820 – 1900</text>
<rect x="540.0" y="190.0" width="104.0" height="46.0" rx="0" fill="#E4E1D6" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="592.0" y="205" text-anchor="middle" dominant-baseline="central">XXe siècle</text>
<text class="ts" x="592.0" y="223.0" text-anchor="middle" dominant-baseline="central">1900 – 2000</text>
<polygon points="644.0,184.0 664.0,213.0 644.0,242.0" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-linejoin="round"/>
<g class="c-coral"><rect x="20" y="36" width="206" height="116" rx="10" stroke-width="2"/></g>
<g class="c-coral"><text class="th" x="123.0" y="56" text-anchor="middle" dominant-baseline="central">Le chant grégorien</text></g>
<text class="t" x="123.0" y="80.0" text-anchor="middle" dominant-baseline="central">des moines chantent, sans</text>
<text class="t" x="123.0" y="100.0" text-anchor="middle" dominant-baseline="central">instrument, à l'église</text>
<text class="ts" x="123.0" y="130.0" text-anchor="middle" dominant-baseline="central">lien : l'Église au Moyen Âge</text>
<line x1="123.0" y1="152.0" x2="72.0" y2="190.0" stroke="#C2410C" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="72.0" cy="190.0" r="4" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<g class="c-blue"><rect x="237" y="36" width="206" height="116" rx="10" stroke-width="2"/></g>
<g class="c-blue"><text class="th" x="340.0" y="56" text-anchor="middle" dominant-baseline="central">Vivaldi, 1725</text></g>
<text class="t" x="340.0" y="80.0" text-anchor="middle" dominant-baseline="central">« Les Quatre Saisons »</text>
<text class="t" x="340.0" y="100.0" text-anchor="middle" dominant-baseline="central">violon soliste + orchestre</text>
<text class="ts" x="340.0" y="130.0" text-anchor="middle" dominant-baseline="central">lien : les saisons, l'Italie</text>
<line x1="340.0" y1="152.0" x2="280.0" y2="190.0" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="280.0" cy="190.0" r="4" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<g class="c-purple"><rect x="454" y="36" width="206" height="116" rx="10" stroke-width="2"/></g>
<g class="c-purple"><text class="th" x="557.0" y="56" text-anchor="middle" dominant-baseline="central">Bizet, 1875</text></g>
<text class="t" x="557.0" y="80.0" text-anchor="middle" dominant-baseline="central">« Carmen », un opéra</text>
<text class="t" x="557.0" y="100.0" text-anchor="middle" dominant-baseline="central">des chanteurs + l'orchestre</text>
<text class="ts" x="557.0" y="130.0" text-anchor="middle" dominant-baseline="central">lien : l'Espagne, Séville</text>
<line x1="557.0" y1="152.0" x2="488.0" y2="190.0" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="488.0" cy="190.0" r="4" fill="#534AB7" stroke="none" stroke-width="1.5"/>
<g class="c-coral"><rect x="20" y="290" width="206" height="116" rx="10" stroke-width="2"/></g>
<g class="c-coral"><text class="th" x="123.0" y="310" text-anchor="middle" dominant-baseline="central">Janequin, « La Guerre »</text></g>
<text class="t" x="123.0" y="334.0" text-anchor="middle" dominant-baseline="central">un chœur imite la bataille</text>
<text class="t" x="123.0" y="354.0" text-anchor="middle" dominant-baseline="central">avec des voix seulement</text>
<text class="ts" x="123.0" y="384.0" text-anchor="middle" dominant-baseline="central">lien : Marignan, François Ier</text>
<line x1="176.0" y1="236.0" x2="123.0" y2="290.0" stroke="#C2410C" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="176.0" cy="236.0" r="4" fill="#C2410C" stroke="none" stroke-width="1.5"/>
<g class="c-blue"><rect x="237" y="290" width="206" height="116" rx="10" stroke-width="2"/></g>
<g class="c-blue"><text class="th" x="340.0" y="310" text-anchor="middle" dominant-baseline="central">Mozart (1756 – 1791)</text></g>
<text class="t" x="340.0" y="334.0" text-anchor="middle" dominant-baseline="central">« Une petite musique</text>
<text class="t" x="340.0" y="354.0" text-anchor="middle" dominant-baseline="central">de nuit », pour cordes</text>
<text class="ts" x="340.0" y="384.0" text-anchor="middle" dominant-baseline="central">lien : le temps de Louis XVI</text>
<line x1="384.0" y1="236.0" x2="340.0" y2="290.0" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="384.0" cy="236.0" r="4" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<g class="c-blue"><rect x="454" y="290" width="206" height="116" rx="10" stroke-width="2"/></g>
<g class="c-blue"><text class="th" x="557.0" y="310" text-anchor="middle" dominant-baseline="central">Prokofiev, 1936</text></g>
<text class="t" x="557.0" y="334.0" text-anchor="middle" dominant-baseline="central">« Pierre et le loup »</text>
<text class="t" x="557.0" y="354.0" text-anchor="middle" dominant-baseline="central">un conteur + l'orchestre</text>
<text class="ts" x="557.0" y="384.0" text-anchor="middle" dominant-baseline="central">lien : un conte, la Russie</text>
<line x1="592.0" y1="236.0" x2="557.0" y2="290.0" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="592.0" cy="236.0" r="4" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<g class="c-coral"><rect x="20" y="419" width="26" height="18" rx="4" stroke-width="2"/></g>
<text class="t" x="54.0" y="428.0" text-anchor="start" dominant-baseline="central">vocale : des voix</text>
<g class="c-blue"><rect x="228" y="419" width="26" height="18" rx="4" stroke-width="2"/></g>
<text class="t" x="262.0" y="428.0" text-anchor="start" dominant-baseline="central">instrumentale</text>
<g class="c-purple"><rect x="436" y="419" width="26" height="18" rx="4" stroke-width="2"/></g>
<text class="t" x="470.0" y="428.0" text-anchor="start" dominant-baseline="central">voix + instruments</text>
<text class="ts" x="340.0" y="452.0" text-anchor="middle" dominant-baseline="central">Pas à l'échelle : chaque case a la même largeur, mais le Moyen Âge dure environ 1 000 ans.</text>
</svg>
