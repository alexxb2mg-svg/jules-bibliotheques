notion: cm1-argumentation-jugement-musical
titre: "Donner son avis sur une musique, et dire pourquoi"
matiere: education-musicale
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 49", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: avis-raison
    type: formule
    expression: "[mon avis] + parce que + [ce que j'entends]"
    termes:
      "mon avis": {couleur: orange, legende: "ce que je ressens : j'aime, je n'aime pas, ça me fait peur, ça me donne envie de danser..."}
      "ce que j'entends": {couleur: bleu, legende: "un mot précis sur la musique : le **tempo**, un instrument, grave ou aigu, doux ou fort, les paroles"}
    jules: "Le **tempo**, c'est la vitesse de la musique : lent comme une berceuse, rapide comme une poursuite. C'est un des mots les plus utiles pour expliquer ton avis."

  - id: carte
    type: carte
    noeuds:
      - {id: argumenter, titre: "Argumenter un jugement", sous_titre: "dire son avis ET expliquer pourquoi", principal: true}
      - {id: ressenti, titre: "Le ressenti", sous_titre: "ce que la musique me fait : peur, joie, calme, ennui"}
      - {id: raisons, titre: "Les raisons", sous_titre: "des mots précis : tempo, instruments, nuances, paroles"}
      - {id: respect, titre: "Le respect", sous_titre: "écouter l'avis des autres, sans se moquer"}
      - {id: choisir, titre: "Choisir ensemble", sous_titre: "chacun argumente, puis le groupe décide"}
    liens:
      - {de: argumenter, vers: ressenti}
      - {de: argumenter, vers: raisons}
      - {de: argumenter, vers: respect}
      - {de: argumenter, vers: choisir}
    jules: "Deux personnes peuvent entendre exactement la même chose et ne pas ressentir la même chose. Personne n'a tort d'aimer ou de ne pas aimer : ce qui compte, c'est la raison que tu donnes."

  - id: schema-grille
    type: schema
    titre: "La grille « j'entends, je ressens, parce que » remplie pour une œuvre de Grieg"
    svg: "cm1-argumentation-jugement-musical.svg"
    jules: "Commence toujours par la colonne bleue : ce que tu entends, tout le monde peut le vérifier en réécoutant. Ton ressenti devient alors un vrai argument."

  - id: schema-debat
    type: schema
    titre: "Un débat pour choisir comment chanter : des avis différents, chacun avec sa raison"
    svg: "cm1-argumentation-jugement-musical-debat.svg"
    jules: "Un **canon**, c'est quand des groupes chantent la même mélodie en commençant les uns après les autres, comme dans « Frère Jacques ». Inès et Yanis ne sont pas d'accord, mais chacun donne une vraie raison."

  - id: methode
    type: methode
    etapes:
      - "Écoute la musique **en entier**, sans parler, même si le début ne te plaît pas."
      - "Repère ton ressenti immédiat : j'aime, je n'aime pas, ça me fait quelque chose."
      - "Cherche une **raison** dans ce que tu entends : le tempo, un instrument, les nuances, les paroles, l'ambiance."
      - "Dis une phrase complète : « J'aime (ou je n'aime pas) cette musique **parce que**... »"
      - "Écoute l'avis des autres jusqu'au bout et compare-le au tien, sans te moquer."
    jules: "Réécouter change parfois l'avis : une musique qui semblait bizarre la première fois devient souvent plus agréable quand on la connaît mieux."

  - id: piege
    type: piege
    mauvaise_idee: "« C'est nul ! » ou « C'est génial ! » : ça suffit pour donner son avis."
    pourquoi_faux: "Ce sont des **ressentis**, pas des arguments : personne ne sait pourquoi tu penses cela. Un **argument** parle de ce qu'on entend dans la musique."
    bonne_idee: "« Je n'aime pas trop, **parce que** c'est très lent et très doux : ça me donne envie de dormir. »"
    jules: "Autre piège : changer d'avis juste pour être d'accord avec tout le monde. Tu peux changer d'avis, mais seulement si une raison t'a vraiment convaincu."

  - id: exemple-grieg
    type: exemple
    situation: "Hugo écoute « Dans l'antre du roi de la montagne », de Grieg. Au début, il dit juste : « Ça fait peur. » Comment transformer ce ressenti en argument ?"
    calcul: "Ce qu'il entend : un petit air grave, répété sans arrêt, qui va de plus en plus vite (accel.) et de plus en plus fort (cresc.) jusqu'à ff. Ce qu'il ressent : du suspense et un peu de peur."
    conclusion: "Hugo dit : « Cette musique me fait peur, **parce que** le même air revient **de plus en plus vite et fort**, comme une poursuite. »"
    jules: "Le mot « antre » veut dire une grotte, un repaire. Grieg a écrit cette musique pour une pièce de théâtre où un jeune homme, Peer Gynt, s'enfuit de chez le roi des trolls."

  - id: exemple-bolero
    type: exemple
    situation: "Rose adore le « Boléro » de Ravel. Adam, lui, le trouve ennuyeux. Comment peuvent-ils en parler sans se disputer ?"
    calcul: "Adam explique : « Je le trouve ennuyeux, parce que c'est toujours la même mélodie. » Rose répond : « Moi j'aime, parce que les instruments changent à chaque fois et que ça devient de plus en plus fort. »"
    conclusion: "Chacun garde son avis, mais chacun a donné une **raison** entendue dans la musique : c'est ça, **argumenter** dans le **respect**."
    jules: "Les deux ont raison sur ce qu'ils entendent : Ravel fait revenir sans cesse ses deux mélodies, en changeant d'instruments à chaque fois. Ils ne ressentent simplement pas la même chose."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : à la maison, écoutez une musique en famille et remplissez chacun la grille « j'entends, je ressens, parce que ». Comparez ensuite vos colonnes, sans vous moquer."
