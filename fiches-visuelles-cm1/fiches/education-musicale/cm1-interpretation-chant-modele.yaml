notion: cm1-interpretation-chant-modele
titre: "Interpréter un chant : imiter le modèle, puis y mettre ton expression"
matiere: education-musicale
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 48", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: interpreter
    type: formule
    expression: "interpréter = [la mélodie] + [le rythme] + [une intention]"
    termes:
      "la mélodie": {couleur: bleu, legende: "la suite des **notes** : ça monte, ça descend, ça tient. C'est ce qu'on dessine au-dessus des paroles."}
      "le rythme": {couleur: vert, legende: "la **durée** des notes (courtes ou longues), posée sur la pulsation, le battement régulier comme un cœur"}
      "une intention": {couleur: violet, legende: "le **sentiment** que tu mets dans ta voix : doux, joyeux, triste, énergique..."}
    jules: "Les deux premiers, tu les prends au modèle, sans rien changer. Le troisième, c'est ta part à toi : c'est lui qui transforme une récitation en vraie chanson."

  - id: carte
    type: carte
    noeuds:
      - {id: chant, titre: "Interpréter un chant", sous_titre: "le chanter comme le modèle, avec du sentiment", principal: true}
      - {id: imiter, titre: "Imiter le modèle", sous_titre: "écouter en entier, puis répéter comme un miroir"}
      - {id: juste, titre: "Chanter juste", sous_titre: "chaque note ni trop haute, ni trop basse"}
      - {id: intention, titre: "Une intention", sous_titre: "doux, joyeux, calme... on le choisit"}
      - {id: corps, titre: "Avec ton corps", sous_titre: "taper la pulsation, bouger, jouer d'un instrument"}
    liens:
      - {de: chant, vers: imiter}
      - {de: chant, vers: juste}
      - {de: chant, vers: intention}
      - {de: chant, vers: corps}
    jules: "Le modèle, c'est la personne ou l'enregistrement qui chante en premier : ta maîtresse, ton maître, un CD. On l'écoute d'abord, on chante ensuite."

  - id: schema-melodie
    type: schema
    titre: "« Frère Jacques » : la mélodie, la pulsation et les respirations"
    svg: "cm1-interpretation-chant-modele.svg"
    jules: "Suis la ligne bleue avec ton doigt en chantant : ta voix monte quand la ligne monte. Sur « vous ? », garde le son pendant 2 pulsations, sans le couper trop tôt."

  - id: schema-juste
    type: schema
    titre: "Chanter juste, puis choisir une intention"
    svg: "cm1-interpretation-chant-modele-juste.svg"
    jules: "Quand ta voix tombe trop bas, écoute à nouveau le modèle et chante tout doucement : on s'entend mieux quand on ne force pas. L'intention change la force et la vitesse, jamais les notes."

  - id: methode
    type: methode
    etapes:
      - "Écoute le modèle **en entier**, au moins deux fois, sans chanter."
      - "Repère la **mélodie** (ce qui monte, ce qui descend) et les notes longues à tenir."
      - "Tape doucement la **pulsation** sur ta cuisse, puis chante en imitant exactement le modèle."
      - "Choisis une **intention** (calme, joyeuse...) et fais-la entendre avec ta voix et ton visage."
      - "Ajoute ton corps : balance-toi sur la pulsation, ou joue un petit instrument en même temps."
    jules: "Imiter d'abord, s'exprimer ensuite : si tu mets ton intention trop tôt, tu risques de changer des notes sans t'en rendre compte."

  - id: piege
    type: piege
    mauvaise_idee: "Je connais déjà le début : je chante tout de suite avec la maîtresse, sans écouter la suite."
    pourquoi_faux: "Tu n'as pas entendu tout le **modèle**. Tu risques d'inventer des notes, d'oublier une note longue ou de perdre la **pulsation** au milieu."
    bonne_idee: "Écoute le chant en entier, au moins deux fois, en tapant la pulsation. Chante seulement quand tu as bien entendu où ça monte, où ça descend et où ça tient."
    jules: "Autre erreur fréquente : chanter tout avec la même voix plate, du début à la fin. Même juste, le chant paraît alors sans vie."

  - id: exemple-automne
    type: exemple
    situation: "La classe de Nina apprend une chanson sur l'automne. La maîtresse la chante deux fois, lentement et doucement. Que doit faire Nina avant de chanter à son tour ?"
    calcul: "Nina écoute les deux fois en entier et tape la pulsation sur sa cuisse. Elle repère les notes qui montent et celles qu'il faut tenir. Puis elle chante en imitant, avec une voix douce, comme la maîtresse."
    conclusion: "Nina reproduit la **mélodie** et le **rythme** du modèle, et elle garde son **intention douce**. Ensuite seulement, elle peut ajouter sa propre expression."
    jules: "La maîtresse a chanté lentement et doucement exprès : cela fait partie du modèle. Si Nina chantait vite et fort, les notes seraient justes, mais l'interprétation ne le serait pas."

  - id: exemple-berceuse
    type: exemple
    situation: "Samuel chante « Au clair de la lune » deux fois : d'abord pour endormir sa petite sœur, puis pour la fête de fin d'année. Qu'est-ce qui change, et qu'est-ce qui reste pareil ?"
    calcul: "Pour sa sœur : voix douce (nuance p), tempo lent, intention calme. Pour la fête : voix plus forte (nuance f), tempo plus vif, intention joyeuse, et il frappe la pulsation dans ses mains."
    conclusion: "Les **notes** et les **paroles** restent les mêmes. Seule **l'intention** change : ce sont deux interprétations du même chant."
    jules: "C'est comme lire une histoire à voix haute : les mots ne changent pas, mais tu ne lis pas une histoire de fantômes comme une blague."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : chante « Frère Jacques » en marchant, un pas par pulsation. Si tes pas et ta voix restent ensemble jusqu'au bout, ton rythme est solide."
