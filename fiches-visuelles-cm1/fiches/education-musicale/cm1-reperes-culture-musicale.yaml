notion: cm1-reperes-culture-musicale
titre: "Repères de culture musicale : des œuvres, des époques et l'orchestre"
matiere: education-musicale
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 49", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Construire une séquence en éducation musicale au cycle 3 », p. 8", url: "https://eduscol.education.gouv.fr/sites/default/files/document/ra16c3eartemusconstruire-sequence-dm613816pdf-74919.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: retenir
    type: formule
    expression: "un repère = [le titre] + [le compositeur] + [l'époque]"
    termes:
      "le titre": {couleur: bleu, legende: "le nom de l'œuvre, par exemple « **Les Quatre Saisons** »"}
      "le compositeur": {couleur: orange, legende: "celui qui a inventé et écrit la musique : ici **Vivaldi**, un musicien italien"}
      "l'époque": {couleur: vert, legende: "le moment où l'œuvre a été écrite : 1725, pendant la période **baroque**"}
    jules: "Trois petites informations suffisent pour ranger une œuvre dans ta mémoire, comme un livre sur la bonne étagère. Ajoute un lien avec ce que tu sais déjà : l'œuvre sera encore plus facile à retrouver."

  - id: carte
    type: carte
    noeuds:
      - {id: reperes, titre: "Se faire des repères", sous_titre: "reconnaître des œuvres et les relier à ce qu'on sait", principal: true}
      - {id: production, titre: "Vocale ou instrumentale", sous_titre: "chantée par des voix, jouée par des instruments, ou les deux"}
      - {id: soliste, titre: "Soliste ou ensemble", sous_titre: "un seul interprète, ou beaucoup qui jouent ensemble"}
      - {id: orchestre, titre: "L'orchestre symphonique", sous_titre: "cordes, vents et percussions jouent ensemble"}
      - {id: liens, titre: "Des liens", sous_titre: "une époque, un pays, une histoire apprise en classe"}
    liens:
      - {de: reperes, vers: production}
      - {de: reperes, vers: soliste}
      - {de: reperes, vers: orchestre}
      - {de: reperes, vers: liens}
    jules: "Un **soliste**, c'est un musicien ou un chanteur qui joue seul, parfois devant tout un orchestre. Dans « Les Quatre Saisons », le violon soliste joue la mélodie et l'orchestre l'accompagne."

  - id: schema-frise
    type: schema
    titre: "Frise des grandes périodes de la musique, avec une œuvre pour chacune"
    svg: "cm1-reperes-culture-musicale.svg"
    jules: "Au temps de Louis XIV, le musicien Lully compose pour les fêtes et les ballets de Versailles : c'est la période baroque, comme Vivaldi. La musique suit l'histoire que tu apprends en classe."

  - id: schema-orchestre
    type: schema
    titre: "Le plan de l'orchestre symphonique, avec les personnages de Pierre et le loup"
    svg: "cm1-reperes-culture-musicale-orchestre.svg"
    jules: "Dans « Pierre et le loup » (1936), Prokofiev donne un instrument à chaque personnage, pour faire découvrir l'orchestre aux enfants. Écoute bien : les trois cors du loup ont un son grave et inquiétant."

  - id: methode
    type: methode
    etapes:
      - "Écoute l'œuvre et demande-toi : j'entends des **voix**, des **instruments**, ou les deux ?"
      - "Compte les interprètes : un seul (un **soliste**) ou beaucoup (un ensemble, un chœur, un orchestre) ?"
      - "Si c'est un orchestre, cherche une famille : les cordes, les vents ou les percussions."
      - "Place l'œuvre sur la frise et fais un lien avec une autre matière : une époque, un pays, un roi, un conte."
      - "Note le **titre**, le **compositeur** et **l'époque** sur ton cahier de musique."
    jules: "Un **chœur**, c'est un groupe de chanteurs qui chantent ensemble, comme la chorale de l'école. Un orchestre, c'est la même idée avec des instruments."

  - id: piege
    type: piege
    mauvaise_idee: "Un orchestre symphonique, ce sont des violons."
    pourquoi_faux: "Les violons ne sont qu'une partie des **cordes**. L'orchestre réunit plusieurs familles : les **cordes**, les **vents** (les bois et les cuivres) et les **percussions**."
    bonne_idee: "Dans « Pierre et le loup », l'oiseau est une flûte (un vent), Pierre est joué par les cordes, et les coups de fusil des chasseurs par les timbales (des percussions)."
    jules: "Autre confusion à éviter : une œuvre est **vocale** quand des voix chantent. S'il n'y a que des instruments, elle est **instrumentale**, même si elle raconte une histoire."

  - id: exemple-carmen
    type: exemple
    situation: "La classe de Chloé écoute la « Habanera », un air de l'opéra « Carmen » de Bizet. Une chanteuse chante la mélodie, avec tout l'orchestre derrière elle. Qu'est-ce que Chloé peut retenir ?"
    calcul: "Une voix chante : l'œuvre est **vocale**. L'orchestre joue : elle est aussi **instrumentale**. La mélodie est chantée par une seule personne : c'est une **soliste**."
    conclusion: "Chloé retient : « Carmen », un opéra de Bizet, écrit en 1875, avec des chanteurs et un orchestre. L'histoire se passe à Séville, en **Espagne**."
    jules: "Un **opéra**, c'est une pièce de théâtre où les acteurs chantent au lieu de parler, avec un orchestre. On le joue sur une scène, avec des costumes et des décors."

  - id: exemple-janequin
    type: exemple
    situation: "En histoire, Nour apprend que le roi François Ier a gagné la bataille de Marignan en 1515. En musique, elle écoute « La Guerre », une chanson de Clément Janequin. Quel lien peut-elle faire ?"
    calcul: "La chanson raconte cette bataille : les voix imitent les trompettes, les tambours et le bruit des combats. Elle est écrite pour des voix seules, sans instrument : l'œuvre est **vocale**, chantée par un **chœur**."
    conclusion: "Nour range l'œuvre sur sa frise : « La Guerre », Janequin, à la **Renaissance**, au temps de François Ier."
    jules: "Les chanteurs imitent les bruits de la bataille avec des syllabes rapides, un peu comme toi quand tu fais le bruit d'une voiture ou d'une explosion en jouant."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : écoute « Pierre et le loup » et lève la main à chaque fois que tu reconnais un personnage à son instrument. À la fin, essaie de les nommer tous les sept."
