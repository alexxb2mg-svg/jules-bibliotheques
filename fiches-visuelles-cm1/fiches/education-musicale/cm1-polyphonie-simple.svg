<text class="t" x="385.0" y="288.0" fill="#854F0B" font-weight="600" text-anchor="middle" dominant-baseline="central">au même moment :</text>
<text class="t" x="385.0" y="306.0" fill="#854F0B" text-anchor="middle" dominant-baseline="central">deux phrases différentes</text>
<text class="t" x="385.0" y="324.0" fill="#854F0B" text-anchor="middle" dominant-baseline="central">qui vont bien ensemble</text>
<line x1="40.0" y1="346.0" x2="640.0" y2="346.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="butt"/>
<text class="t" x="340.0" y="364.0" font-weight="600" text-anchor="middle" dominant-baseline="central">Chaque voix chante tout le chant, du début à la fin.</text>
<text class="t" x="340.0" y="384.0" text-anchor="middle" dominant-baseline="central">Quand l'autre voix entre, on ne s'arrête pas : on continue SA phrase.</text>
