<text class="ts" x="605.0" y="130.0" fill="#185FA5" text-anchor="middle" dominant-baseline="central">a fini, ou</text>
<text class="ts" x="605.0" y="146.0" fill="#185FA5" text-anchor="middle" dominant-baseline="central">recommence</text>
