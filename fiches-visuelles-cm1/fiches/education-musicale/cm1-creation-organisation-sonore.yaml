notion: cm1-creation-organisation-sonore
titre: "Créer une organisation sonore : choisir des sons, les ordonner, les dessiner"
matiere: education-musicale
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 49", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: deux-postures
    type: formule
    expression: "d'abord [explorateur du son], puis [compositeur]"
    termes:
      "explorateur du son": {couleur: vert, legende: "tu **cherches** des sons avec ta voix, ton corps, des objets, et tu les **écoutes**, sans encore rien créer"}
      "compositeur": {couleur: violet, legende: "tu **tries**, tu choisis quelques sons, tu décides de leur **ordre** et tu en gardes une trace"}
    jules: "Un compositeur, c'est celui qui invente une musique et décide où va chaque son. Mozart ou Vivaldi l'ont fait avec des notes ; toi, tu peux le faire avec une règle, une boîte et ta voix."

  - id: carte
    type: carte
    noeuds:
      - {id: organiser, titre: "Organiser des sons", sous_titre: "choisir des sons et décider de leur ordre", principal: true}
      - {id: sources, titre: "Les sources sonores", sous_titre: "la voix, le corps, des objets, des instruments"}
      - {id: ordre, titre: "Un ordre choisi", sous_titre: "doux puis fort, court puis long, un silence au bon moment"}
      - {id: partition, titre: "Une partition inventée", sous_titre: "des dessins qui gardent la trace des sons"}
      - {id: interpreter, titre: "Interpréter", sous_titre: "jouer en suivant la partition, comme prévu"}
    liens:
      - {de: organiser, vers: sources}
      - {de: organiser, vers: ordre}
      - {de: organiser, vers: partition}
      - {de: organiser, vers: interpreter}
    jules: "Une **source sonore**, c'est tout ce qui peut produire un son : un crayon qui tape, une feuille qu'on froisse, tes mains, ta voix. Le silence aussi compte : c'est une pause voulue."

  - id: schema-code
    type: schema
    titre: "Une partition inventée : un code simple pour noter l'ordre des sons"
    svg: "cm1-creation-organisation-sonore.svg"
    jules: "Ta partition doit pouvoir être lue par quelqu'un d'autre. Écris ton code (ta légende) en haut de la feuille, comme sur une carte de géographie."

  - id: schema-orage
    type: schema
    titre: "La partition graphique de l'orage : quatre sons du corps, organisés dans le temps"
    svg: "cm1-creation-organisation-sonore-orage.svg"
    jules: "Regarde la forme de l'orage : calme, puis tempête, puis de nouveau calme. C'est une forme **ABA**, comme dans les chansons, et les nuances pp, ff, pp la rendent bien visible."

  - id: methode
    type: methode
    etapes:
      - "**Explore** : essaie au moins cinq sons différents avec ta voix, ton corps et des objets."
      - "**Trie** : garde les 3 ou 4 sons que tu préfères ou qui vont bien ensemble."
      - "Choisis un **ordre** : par exemple doux puis fort, ou court puis long, avec un silence au milieu."
      - "Dessine ta partition de gauche à droite, avec un symbole pour chaque son et une légende."
      - "Interprète ta création en suivant ton dessin du doigt, puis rejoue-la : elle doit rester la même."
    jules: "Si tu hésites entre deux ordres, joue les deux et écoute la différence. Le compositeur choisit en écoutant, pas au hasard."

  - id: piege
    type: piege
    mauvaise_idee: "Pour composer, il suffit d'enchaîner tous les sons trouvés, dans n'importe quel ordre."
    pourquoi_faux: "Sans ordre choisi, tu ne pourras pas rejouer la même chose une deuxième fois, et celui qui écoute n'entend rien se construire. **Composer**, c'est **trier** puis **organiser**."
    bonne_idee: "Garde peu de sons, décide de leur place et **dessine-la** avant de jouer. Ensuite, suis ton dessin sans le changer."
    jules: "Deux autres pièges : oublier de garder une trace, et changer l'ordre sans le vouloir au moment de jouer. La partition sert justement à éviter les deux."

  - id: exemple-lina
    type: exemple
    situation: "Lina invente une petite musique avec sa voix : un son grave et long, puis trois sons aigus et courts, puis un silence, puis un « HOP ! » court et très fort. Comment l'écrire ?"
    calcul: "Son grave et long : un trait long, en bas. Trois sons aigus et courts : trois points, en haut. Silence : une case vide. « HOP ! » très fort : un gros point."
    conclusion: "Lina lit sa **partition inventée** de gauche à droite : trait, trois points, case vide, gros point. Elle peut la rejouer à l'identique."
    jules: "Si Lina donne sa partition à Tom, il pourra jouer sa musique sans l'avoir jamais entendue. C'est exactement à ça que sert une partition."

  - id: exemple-orage
    type: exemple
    situation: "La classe de M. Diallo crée « l'orage » avec 4 groupes : doigts sur la table (pluie fine), mains frottées (vent), mains sur les cuisses (grosse pluie), pieds sur le sol (tonnerre). Dans quel ordre les faire entrer ?"
    calcul: "La pluie fine commence, tout doucement (pp). Le vent entre, puis la grosse pluie, puis le tonnerre : c'est le plus fort (ff). Ensuite les groupes s'arrêtent dans l'ordre inverse, et la pluie fine finit seule."
    conclusion: "Les sons sont **organisés** : ils entrent un par un, puis ressortent un par un. On entend un **crescendo** (de plus en plus fort), puis un **decrescendo** (de moins en moins fort)."
    jules: "Le chef, c'est l'élève qui montre la partition du doigt et fait entrer chaque groupe. Sans chef, tout le monde commencerait en même temps et l'orage éclaterait d'un coup."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : invente « la musique du matin » avec trois sons de ta maison (réveil, porte, bol). Dessine-la, puis fais-la jouer à quelqu'un de ta famille en suivant ton dessin."
