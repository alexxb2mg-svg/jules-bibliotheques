relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: coeur, titre: "Chanter par cœur", sous_titre: "sans lire les paroles, sans le modèle qui chante avec toi", principal: true}
      - {id: imitation, titre: "Par imitation", sous_titre: "écouter, répéter, plusieurs fois"}
      - {id: morceaux, titre: "Morceau par morceau", sous_titre: "une phrase, puis la suivante"}
      - {id: difficultes, titre: "Tes difficultés", sous_titre: "le mot qui coince, la note trop haute"}
      - {id: solo, titre: "Le solo", sous_titre: "chanter seul, quelques secondes"}
    liens:
      - {de: coeur, vers: imitation}
      - {de: coeur, vers: morceaux}
      - {de: coeur, vers: difficultes}
      - {de: coeur, vers: solo}
    jules: "« Solo », c'est un mot italien qui veut dire « seul ». Un solo peut durer une seule phrase : ce n'est pas tout le chant."

  - id: schema-blocs
    type: schema
    titre: "Couplets et refrain en blocs, et le couplet appris en escalier"
    svg: "cm1-memorisation-chant-solo.svg"
    jules: "Commence par le refrain : il revient à chaque fois, tu le sauras vite. Dans l'escalier, on repart toujours du début, pour que les phrases s'accrochent les unes aux autres."

  - id: schema-posture
    type: schema
    titre: "La posture et la respiration du chanteur soliste"
    svg: "cm1-memorisation-chant-solo-posture.svg"
    jules: "Avant ton solo, une grande inspiration calme, le ventre qui se gonfle : cela donne de l'air et calme le trac. Garde les yeux vers le public, pas vers tes pieds."

  - id: methode
    type: methode
    etapes:
      - "Écoute et chante le chant **en entier** plusieurs fois avec le modèle."
      - "Découpe-le en **phrases**. Apprends la phrase 1, puis 1 et 2, puis 1, 2 et 3 : c'est l'escalier."
      - "Chante **sans regarder le texte**. Au début, quelqu'un peut te souffler le premier mot."
      - "Note les endroits où tu hésites : ce sont tes **difficultés**. Répète ces passages seuls."
      - "Essaie un petit **solo** : une phrase, tout seul, devant quelqu'un de ta famille."
    jules: "Ta mémoire travaille aussi pendant que tu dors : chante ton couplet le soir, puis le lendemain matin. Tu verras qu'il est souvent mieux su que la veille."

  - id: piege
    type: piege
    mauvaise_idee: "Pour retenir la chanson, je la lis et je la chante en entier dix fois de suite, d'un seul coup."
    pourquoi_faux: "Tout d'un coup, c'est trop à la fois : les passages faciles passent bien, mais la **phrase difficile** reste floue. Et tu ne sais pas où tu bloques."
    bonne_idee: "Travaille **morceau par morceau**, en escalier. Quand une phrase coince, répète-la seule 3 fois, puis rechante depuis le début."
    jules: "Autre piège : chanter toujours avec les autres. Dans le groupe, on suit les voix voisines sans s'en rendre compte. Chanter seul une phrase montre si tu la sais vraiment."

  - id: exemple-couplet
    type: exemple
    situation: "Mardi, Yanis doit savoir par cœur le couplet 1 de « À la claire fontaine ». Il a 4 soirs pour s'entraîner. Comment peut-il s'organiser ?"
    calcul: "Soir 1 : il écoute et chante avec l'enregistrement, puis il apprend le refrain. Soir 2 : phrases 1 et 2 en escalier. Soir 3 : il ajoute les phrases 3 et 4. Soir 4 : il chante tout le couplet et le refrain sans le texte."
    conclusion: "Yanis mémorise **un morceau à la fois**. Le dernier soir, il vérifie qu'il sait tout **par cœur**, sans lire et sans l'enregistrement."
    jules: "Un peu chaque soir vaut mieux qu'une heure la veille : la mémoire aime qu'on revienne souvent vers ce qu'on apprend."

  - id: exemple-solo
    type: exemple
    situation: "À la fête de l'école, Lou chante en solo la phrase « J'ai trouvé l'eau si belle ». Aux répétitions, elle s'arrête toujours avant « belle » : elle n'a plus d'air. Que peut-elle faire ?"
    calcul: "Lou a trouvé sa **difficulté** : elle manque de souffle à la fin de la phrase. Avant de chanter, elle prend une grande inspiration calme, le ventre qui se gonfle. Puis elle répète la phrase seule 3 fois."
    conclusion: "Lou sait dire précisément ce qui la gêne. En travaillant seulement ce passage, elle peut **tenir son solo** jusqu'au bout, sans s'arrêter."
    jules: "Dire « je ne sais pas le chant » ne t'aide pas. Dire « je n'ai plus d'air avant belle » te dit exactement quoi travailler."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : chante un chant appris en classe à quelqu'un de ta famille, sans le texte. Demande-lui de lever la main à chaque hésitation : ce sont tes passages à retravailler."
