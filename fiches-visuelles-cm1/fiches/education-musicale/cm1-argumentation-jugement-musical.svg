<svg width="100%" viewBox="0 0 680 472" xmlns="http://www.w3.org/2000/svg"><title>La grille « j'entends, je ressens, parce que » remplie pour une œuvre de Grieg</title>
<text x="340.0" y="16.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">« Dans l'antre du roi de la montagne », Grieg, 1876</text>
<circle cx="40.0" cy="62.0" r="3.0" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="112.0" cy="62.0" r="3.33" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="176.8" cy="62.0" r="3.66" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="235.1" cy="62.0" r="3.99" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="287.6" cy="62.0" r="4.32" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="334.8" cy="62.0" r="4.65" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="377.4" cy="62.0" r="4.98" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="415.6" cy="62.0" r="5.3100000000000005" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="450.1" cy="62.0" r="5.640000000000001" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="481.1" cy="62.0" r="5.970000000000001" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="509.0" cy="62.0" r="6.300000000000001" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="534.1" cy="62.0" r="6.630000000000001" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="556.7" cy="62.0" r="6.96" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="577.0" cy="62.0" r="7.29" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="595.3" cy="62.0" r="7.62" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="611.8" cy="62.0" r="7.95" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<circle cx="626.6" cy="62.0" r="8.280000000000001" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="30" y="96" font-size="20" font-style="italic" font-weight="700" fill="#1a1a18" text-anchor="start" dominant-baseline="central">p</text>
<text class="t" x="52.0" y="96.0" text-anchor="start" dominant-baseline="central" fill="#5f5e5a">lent, grave, doux</text>
<text x="650" y="96" font-size="20" font-style="italic" font-weight="700" fill="#1a1a18" text-anchor="end" dominant-baseline="central">ff</text>
<text class="t" x="620.0" y="96.0" text-anchor="end" dominant-baseline="central" fill="#5f5e5a">très rapide, très fort</text>
<g class="c-blue"><rect x="20" y="124" width="202" height="46" rx="10" stroke-width="1.5"/><text class="tl" x="121.0" y="147" text-anchor="middle" dominant-baseline="central">J'entends…</text></g>
<rect x="20.0" y="176.0" width="202.0" height="234.0" rx="10" fill="#FBFAF7" stroke="#D3D1C7" stroke-width="1"/>
<text class="t" x="121.0" y="198.0" text-anchor="middle" dominant-baseline="central">au début, des sons</text>
<text class="t" x="121.0" y="220.0" text-anchor="middle" dominant-baseline="central">graves : bassons,</text>
<text class="t" x="121.0" y="242.0" text-anchor="middle" dominant-baseline="central">contrebasses</text>
<text class="t" x="121.0" y="286.0" text-anchor="middle" dominant-baseline="central">le même petit air,</text>
<text class="t" x="121.0" y="308.0" text-anchor="middle" dominant-baseline="central">répété sans arrêt</text>
<text class="t" x="121.0" y="352.0" text-anchor="middle" dominant-baseline="central">de plus en plus vite</text>
<text class="t" x="121.0" y="374.0" text-anchor="middle" dominant-baseline="central">et de plus en plus fort</text>
<g class="c-coral"><rect x="239" y="124" width="202" height="46" rx="10" stroke-width="1.5"/><text class="tl" x="340.0" y="147" text-anchor="middle" dominant-baseline="central">Je ressens…</text></g>
<rect x="239.0" y="176.0" width="202.0" height="234.0" rx="10" fill="#FBFAF7" stroke="#D3D1C7" stroke-width="1"/>
<text class="t" x="340.0" y="198.0" text-anchor="middle" dominant-baseline="central">du suspense</text>
<text class="t" x="340.0" y="242.0" text-anchor="middle" dominant-baseline="central">un peu de peur</text>
<text class="t" x="340.0" y="286.0" text-anchor="middle" dominant-baseline="central">l'envie de courir</text>
<text class="ts" x="340.0" y="374.0" text-anchor="middle" dominant-baseline="central">(un autre peut ressentir</text>
<text class="ts" x="340.0" y="396.0" text-anchor="middle" dominant-baseline="central">autre chose : c'est permis)</text>
<g class="c-green"><rect x="458" y="124" width="202" height="46" rx="10" stroke-width="1.5"/><text class="tl" x="559.0" y="147" text-anchor="middle" dominant-baseline="central">… parce que</text></g>
<rect x="458.0" y="176.0" width="202.0" height="234.0" rx="10" fill="#FBFAF7" stroke="#D3D1C7" stroke-width="1"/>
<text class="t" x="559.0" y="198.0" text-anchor="middle" dominant-baseline="central">l'air revient toujours,</text>
<text class="t" x="559.0" y="220.0" text-anchor="middle" dominant-baseline="central">mais de plus en plus</text>
<text class="t" x="559.0" y="242.0" text-anchor="middle" dominant-baseline="central">vite et fort : on dirait</text>
<text class="t" x="559.0" y="264.0" text-anchor="middle" dominant-baseline="central">une poursuite qui finit</text>
<text class="t" x="559.0" y="286.0" text-anchor="middle" dominant-baseline="central">en tempête</text>
<text class="th" x="20.0" y="430.0" text-anchor="start" dominant-baseline="central">Mots utiles :</text>
<text class="t" x="116.0" y="430.0" text-anchor="start" dominant-baseline="central" fill="#185FA5">grave, aigu · court, long · doux, fort · lent, rapide · le timbre d'un instrument</text>
<text class="ts" x="340.0" y="456.0" text-anchor="middle" dominant-baseline="central">Colonne bleue : ce que tout le monde peut entendre. Colonne orange : ce que toi, tu ressens.</text>
</svg>
