<text class="t" x="210.0" y="56.0" fill="#3B6D11" font-weight="600" text-anchor="end" dominant-baseline="central">Tête droite,</text>
<text class="t" x="210.0" y="74.0" fill="#3B6D11" text-anchor="end" dominant-baseline="central">regard devant toi</text>
<line x1="216.0" y1="56.0" x2="304.0" y2="78.0" stroke="#3B6D11" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<text class="t" x="200.0" y="150.0" fill="#3B6D11" font-weight="600" text-anchor="end" dominant-baseline="central">Épaules basses</text>
<text class="t" x="200.0" y="168.0" fill="#3B6D11" text-anchor="end" dominant-baseline="central">et détendues</text>
<line x1="206.0" y1="150.0" x2="290.0" y2="150.0" stroke="#3B6D11" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<text class="t" x="200.0" y="290.0" fill="#3B6D11" font-weight="600" text-anchor="end" dominant-baseline="central">Bras souples,</text>
<text class="t" x="200.0" y="308.0" fill="#3B6D11" text-anchor="end" dominant-baseline="central">le long du corps</text>
<line x1="206.0" y1="290.0" x2="270.0" y2="290.0" stroke="#3B6D11" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<text class="t" x="200.0" y="400.0" fill="#3B6D11" font-weight="600" text-anchor="end" dominant-baseline="central">Pieds à plat, écartés</text>
<text class="t" x="200.0" y="418.0" fill="#3B6D11" text-anchor="end" dominant-baseline="central">comme les épaules</text>
<line x1="206.0" y1="400.0" x2="280.0" y2="408.0" stroke="#3B6D11" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<text class="t" x="470.0" y="60.0" fill="#C2410C" font-weight="600" text-anchor="start" dominant-baseline="central">Inspire calmement,</text>
<text class="t" x="470.0" y="78.0" fill="#C2410C" text-anchor="start" dominant-baseline="central">sans lever les épaules</text>
<line x1="464.0" y1="60.0" x2="346.0" y2="94.0" stroke="#C2410C" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<text class="t" x="470.0" y="112.0" fill="#3B6D11" font-weight="600" text-anchor="start" dominant-baseline="central">Bouche bien ouverte :</text>
<text class="t" x="470.0" y="130.0" fill="#3B6D11" text-anchor="start" dominant-baseline="central">le son sort en avant</text>
<line x1="464.0" y1="112.0" x2="350.0" y2="106.0" stroke="#3B6D11" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<text class="t" x="470.0" y="236.0" fill="#C2410C" font-weight="600" text-anchor="start" dominant-baseline="central">Le ventre se gonfle</text>
<text class="t" x="470.0" y="254.0" fill="#C2410C" text-anchor="start" dominant-baseline="central">quand l'air entre</text>
<line x1="464.0" y1="236.0" x2="400.0" y2="250.0" stroke="#C2410C" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<text class="t" x="470.0" y="340.0" fill="#3B6D11" font-weight="600" text-anchor="start" dominant-baseline="central">Genoux souples,</text>
<text class="t" x="470.0" y="358.0" fill="#3B6D11" text-anchor="start" dominant-baseline="central">jamais bloqués</text>
<line x1="464.0" y1="340.0" x2="366.0" y2="350.0" stroke="#3B6D11" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/>
<text class="ts" x="340.0" y="446.0" text-anchor="middle" dominant-baseline="central">Vert : la posture.   Orange : la respiration, avant la première note.</text>
</svg>
