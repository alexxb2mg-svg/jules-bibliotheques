<text class="th" x="170.0" y="360.0" text-anchor="middle" dominant-baseline="central">1. « ouuuu »</text>
<text class="t" x="170.0" y="380.0" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a">grave et long</text>
