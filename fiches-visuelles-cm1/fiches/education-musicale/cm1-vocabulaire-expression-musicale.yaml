notion: cm1-vocabulaire-expression-musicale
titre: "Nuance, tempo, caractère : les mots pour dire comment on chante"
matiere: education-musicale
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 48", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: nuances
    type: formule
    expression: "[pp] < [p] < [mf] < [f] < [ff]"
    termes:
      "pp": {couleur: bleu, legende: "pianissimo : **très doux**, comme un secret à l'oreille"}
      "p": {couleur: bleu, legende: "piano : **doux**"}
      "mf": {couleur: violet, legende: "mezzo forte : **assez fort**, comme quand on se parle normalement"}
      "f": {couleur: orange, legende: "forte : **fort**"}
      "ff": {couleur: orange, legende: "fortissimo : **très fort**"}
    jules: "Ces lettres viennent de l'italien : piano veut dire « doucement », forte veut dire « fort ». Le piano s'appelle ainsi parce qu'il peut jouer piano ou forte."

  - id: carte
    type: carte
    noeuds:
      - {id: interpretation, titre: "L'interprétation", sous_titre: "la façon de chanter ou de jouer une musique", principal: true}
      - {id: nuance, titre: "La nuance", sous_titre: "fort ou doux (p, f)"}
      - {id: tempo, titre: "Le tempo", sous_titre: "la vitesse : lent, modéré, rapide"}
      - {id: caractere, titre: "Le caractère", sous_titre: "l'ambiance : joyeux, triste, calme, solennel"}
      - {id: parties, titre: "Les parties", sous_titre: "dans une polyphonie, elles se complètent"}
    liens:
      - {de: interpretation, vers: nuance}
      - {de: interpretation, vers: tempo}
      - {de: interpretation, vers: caractere}
      - {de: interpretation, vers: parties}
    jules: "Deux chorales peuvent chanter la même chanson de deux façons différentes : ce sont deux interprétations. Aucune n'est « la seule bonne »."

  - id: schema-nuances
    type: schema
    titre: "L'échelle des nuances, de pp à ff"
    svg: "cm1-vocabulaire-expression-musicale.svg"
    jules: "Entre p et mf, il existe aussi mp (mezzo piano), assez doux. Le dessin du cresc. (on l'appelle un soufflet) s'ouvre de plus en plus, comme le son qui grandit."

  - id: schema-tempo
    type: schema
    titre: "Tempo et nuance : quatre combinaisons"
    svg: "cm1-vocabulaire-expression-musicale-tempo.svg"
    jules: "Un tempo de 60 BPM, c'est une pulsation par seconde, comme la trotteuse d'une horloge. À 120 BPM, il y en a deux par seconde."

  - id: graphe
    type: graphe
    gabarit: frise-pulsations
    curseurs:
      - {id: curseur-tempo, nom: tempo, min: 40, max: 200, pas: 20, depart: 80}
      - {id: curseur-nuance, nom: nuance, min: 1, max: 6, pas: 1, depart: 2}
    lectures:
      - {si: "tempo < 70", texte: "Les ronds sont espacés : le **tempo** est lent."}
      - {si: "tempo >= 120", texte: "Les ronds sont serrés : le **tempo** est rapide."}
      - {si: "nuance <= 2", texte: "Petits ronds : on chante **piano**, doucement."}
      - {si: "nuance >= 5", texte: "Gros ronds : on chante **forte**, fort. Le tempo, lui, n'a pas changé !"}
    jules: "Deux curseurs, deux réglages : le **tempo** écarte ou serre les ronds, la **nuance** les grossit ou les rapetisse (1 = pp, 6 = ff). Bouger l'un ne change pas l'autre."

  - id: methode
    type: methode
    etapes:
      - "Écoute en te demandant : est-ce fort ou doux ? C'est la **nuance**."
      - "Tape la pulsation : est-ce lent, modéré ou rapide ? C'est le **tempo**."
      - "Demande-toi ce que la musique te fait ressentir : c'est le **caractère**."
      - "Si plusieurs voix ou instruments jouent ensemble, repère ce que fait chacun."
      - "Décris avec une phrase complète : « Cette **interprétation** est lente, douce et calme. »"
    jules: "Pour trouver le tempo, ne regarde pas si le son est fort : tape la pulsation avec ta main. Ta main va vite si le tempo est rapide, lentement s'il est lent."

  - id: piege
    type: piege
    mauvaise_idee: "Cette musique est rapide, donc elle est forte. Et si on chante doucement, c'est qu'on chante lentement."
    pourquoi_faux: "La **nuance** dit fort ou doux. Le **tempo** dit lent ou rapide. Ce sont deux réglages différents, qu'on peut changer séparément."
    bonne_idee: "Une souris qui trotte, c'est rapide et doux. Un hymne chanté par un stade, c'est plutôt lent et fort. On donne toujours les deux : nuance et tempo."
    jules: "Pense à une télécommande : un bouton pour le volume (la nuance), un autre pour la vitesse (le tempo). Tourner l'un ne tourne pas l'autre."

  - id: exemple-versions
    type: exemple
    situation: "Chloé écoute deux versions de « Au clair de la lune ». La première est chantée vite et fort. La deuxième est chantée lentement et doucement. Compare-les avec les mots de la musique."
    calcul: "Version 1 : tempo rapide, nuance f, caractère joyeux. Version 2 : tempo lent, nuance p, caractère calme, comme une berceuse."
    conclusion: "Ce sont deux **interprétations** différentes du même chant : la mélodie et les paroles sont pareilles, mais le **tempo**, la **nuance** et le caractère changent."
    jules: "Dire « la version 1 est mieux » ne suffit pas. Avec les mots nuance, tempo et caractère, tu expliques ce que tu entends."

  - id: exemple-partition
    type: exemple
    situation: "Sur le chant de la classe, le maître a écrit p au début, puis cresc. au milieu, puis f à la fin. Comment Malik doit-il chanter ?"
    calcul: "Au début, p : il chante doucement. Au milieu, cresc. : il chante de plus en plus fort, petit à petit. À la fin, f : il chante fort, sans crier."
    conclusion: "Malik part **doux** et arrive **fort**, comme une vague qui grossit. Le tempo, lui, ne change pas : ce n'est pas écrit."
    jules: "Chanter fort, ce n'est pas crier : la voix reste belle et juste. Si ta gorge serre, tu es allé trop loin."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : chante « Frère Jacques » de 4 façons, une par case du schéma : lent et doux, lent et fort, rapide et doux, rapide et fort. Tu entendras quatre caractères : calme, solennel, léger, joyeux."
