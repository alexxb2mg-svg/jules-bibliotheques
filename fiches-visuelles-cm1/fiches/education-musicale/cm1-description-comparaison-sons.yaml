notion: cm1-description-comparaison-sons
titre: "Décrire un son et comparer deux musiques avec les mots justes"
matiere: education-musicale
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 48", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: quatre-mots
    type: formule
    expression: "un son : [hauteur] · [durée] · [intensité] · [timbre]"
    termes:
      "hauteur": {couleur: bleu, legende: "**grave** (comme la grosse caisse) ou **aigu** (comme le triangle)"}
      "durée": {couleur: vert, legende: "**long** (un son tenu) ou **court** (un son sec, « toc »)"}
      "intensité": {couleur: orange, legende: "**doux** ou **fort** : c'est la nuance, p ou f"}
      "timbre": {couleur: violet, legende: "la « couleur » du son, qui dit **qui joue** : une flûte, une voix, un oiseau..."}
    jules: "Ne confonds pas hauteur et intensité : un son aigu n'est pas forcément fort. Un petit oiseau chante aigu et doux, un lion rugit grave et fort."

  - id: carte
    type: carte
    noeuds:
      - {id: decrire, titre: "Décrire ce qu'on entend", sous_titre: "des mots précis, pas seulement « j'aime »", principal: true}
      - {id: mots, titre: "Les 4 mots du son", sous_titre: "hauteur, durée, intensité, timbre"}
      - {id: ressemblance, titre: "Une ressemblance", sous_titre: "ce qui est pareil dans les deux extraits"}
      - {id: difference, titre: "Une différence", sous_titre: "ce qui change d'un extrait à l'autre"}
      - {id: origine, titre: "D'où vient le son", sous_titre: "la nature, un pays, une époque"}
    liens:
      - {de: decrire, vers: mots}
      - {de: decrire, vers: ressemblance}
      - {de: decrire, vers: difference}
      - {de: decrire, vers: origine}
    jules: "On peut comparer toutes sortes de sons : le chant d'un oiseau, une musique d'un autre pays, une chanson très ancienne ou une chanson d'aujourd'hui."

  - id: schema-parametres
    type: schema
    titre: "Les 4 mots pour décrire un son"
    svg: "cm1-description-comparaison-sons.svg"
    jules: "Le timbre, c'est ce qui te fait reconnaître la voix d'un copain au téléphone, même sans le voir. Chaque instrument a sa voix à lui."

  - id: schema-comparer
    type: schema
    titre: "Le merle et la flûte : ressemblances et différences"
    svg: "cm1-description-comparaison-sons-comparer.svg"
    jules: "Le musicien imite la hauteur et la durée des notes de l'oiseau. Mais le timbre le trahit : on entend que c'est une flûte."

  - id: methode
    type: methode
    etapes:
      - "Écoute le premier extrait **en entier**, une fois, sans rien dire."
      - "Réécoute-le en cherchant les **4 mots** : grave ou aigu, long ou court, doux ou fort, qui joue."
      - "Fais pareil avec le deuxième extrait."
      - "Cherche une **ressemblance** (ce qui est pareil), puis une **différence** (ce qui change)."
      - "Dis-les avec des phrases complètes : « Les deux sont aigus, mais le premier est joué par… »"
    jules: "Deux colonnes sur ton brouillon aident beaucoup : une par extrait. Tu relies ensuite ce qui est pareil et tu entoures ce qui change."

  - id: piege
    type: piege
    mauvaise_idee: "Pour comparer deux musiques, je dis : « J'aime la première, je n'aime pas la deuxième. »"
    pourquoi_faux: "Tu donnes ton **goût**, mais tu ne dis pas ce que tu **entends**. Quelqu'un qui n'a pas écouté ne peut rien imaginer."
    bonne_idee: "Décris avec les 4 mots : « La première est lente et douce, jouée par un violon. La deuxième est rapide et forte, jouée par des tambours. »"
    jules: "Tu as le droit de dire ce que tu aimes, mais après avoir décrit. Et attention à ne pas mélanger : une ressemblance, c'est pareil ; une différence, c'est ce qui change."

  - id: exemple-merle
    type: exemple
    situation: "Adam écoute un merle chanter dans le jardin. En classe, il écoute ensuite un musicien qui imite ce chant à la flûte. Compare les deux."
    calcul: "Hauteur : aigu pour les deux. Durée : notes courtes pour les deux. Timbre : une voix d'oiseau d'un côté, un son de flûte de l'autre. Origine : la nature d'un côté, un musicien de l'autre."
    conclusion: "**Ressemblance** : les deux sont aigus, avec des notes courtes. **Différence** : le premier son vient de la nature, le second d'un instrument joué par un musicien."
    jules: "Les sons de la nature (oiseaux, pluie, vent) se décrivent avec les mêmes 4 mots que la musique."

  - id: exemple-epoques
    type: exemple
    situation: "Inès compare une danse ancienne, jouée à la flûte et au tambourin, avec une chanson d'aujourd'hui, jouée à la batterie et à la guitare électrique."
    calcul: "Pareil : dans les deux, on peut taper une pulsation régulière, et elles donnent envie de danser. Différent : le timbre (instruments anciens d'un côté, électriques de l'autre) et l'intensité (la chanson d'aujourd'hui est plus forte)."
    conclusion: "Inès nomme une **ressemblance** (la pulsation qui fait danser) et deux **différences** (le timbre et l'intensité), avec des mots précis."
    jules: "Comparer des musiques d'époques ou de pays différents, c'est un peu voyager avec les oreilles."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : ferme les yeux une minute à la récréation. Choisis deux sons, un ballon et un cri par exemple, et décris-les avec les 4 mots."
