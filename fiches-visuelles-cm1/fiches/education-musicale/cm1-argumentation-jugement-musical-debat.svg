<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Un débat pour choisir comment chanter : des avis différents, chacun avec sa raison</title>
<text x="340.0" y="16.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Pour la fête de l'école : « Frère Jacques » en canon, ou tous ensemble ?</text>
<circle cx="40.0" cy="63.0" r="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="ts" x="40.0" y="63.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18" font-weight="600">Malo</text>
<path d="M94 40 H454 Q464 40 464 50 V76 Q464 86 454 86 H118 L92 98 L102 86 H94 Q84 86 84 76 V50 Q84 40 94 40 Z" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.6" stroke-linejoin="round"/>
<text class="t" x="274.0" y="63.0" text-anchor="middle" dominant-baseline="central">C'est nul, Frère Jacques !</text>
<text class="t" x="660.0" y="63.0" text-anchor="end" dominant-baseline="central" fill="#A32D2D" font-weight="600">✗ pas de raison</text>
<circle cx="640.0" cy="149.0" r="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="ts" x="640.0" y="149.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18" font-weight="600">Inès</text>
<path d="M226 116 H586 Q596 116 596 126 V172 Q596 182 586 182 H582 L576 194 L562 182 H226 Q216 182 216 172 V126 Q216 116 226 116 Z" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.6" stroke-linejoin="round"/>
<text class="t" x="406.0" y="139.0" text-anchor="middle" dominant-baseline="central">En canon ! Les trois groupes se suivent,</text>
<text class="t" x="406.0" y="159.0" text-anchor="middle" dominant-baseline="central">on entend la mélodie en écho.</text>
<text class="t" x="20.0" y="149.0" text-anchor="start" dominant-baseline="central" fill="#3B6D11" font-weight="600">✓ un avis + une raison</text>
<circle cx="40.0" cy="245.0" r="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="ts" x="40.0" y="245.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18" font-weight="600">Yanis</text>
<path d="M94 212 H454 Q464 212 464 222 V268 Q464 278 454 278 H118 L92 290 L102 278 H94 Q84 278 84 268 V222 Q84 212 94 212 Z" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.6" stroke-linejoin="round"/>
<text class="t" x="274.0" y="235.0" text-anchor="middle" dominant-baseline="central">Moi, tous ensemble : en canon, on risque</text>
<text class="t" x="274.0" y="255.0" text-anchor="middle" dominant-baseline="central">de se perdre, c'est plus difficile.</text>
<text class="t" x="660.0" y="245.0" text-anchor="end" dominant-baseline="central" fill="#3B6D11" font-weight="600">✓ un avis + une raison</text>
<circle cx="640.0" cy="341.0" r="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="ts" x="640.0" y="341.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18" font-weight="600">Inès</text>
<path d="M226 308 H586 Q596 308 596 318 V364 Q596 374 586 374 H582 L576 386 L562 374 H226 Q216 374 216 364 V318 Q216 308 226 308 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6" stroke-linejoin="round"/>
<text class="t" x="406.0" y="331.0" text-anchor="middle" dominant-baseline="central">Tu as raison, c'est difficile. On l'apprend</text>
<text class="t" x="406.0" y="351.0" text-anchor="middle" dominant-baseline="central">d'abord ensemble, puis on essaie en canon ?</text>
<text class="t" x="20.0" y="341.0" text-anchor="start" dominant-baseline="central" fill="#185FA5" font-weight="600">✓ respecte l'autre avis</text>
<g class="c-purple"><rect x="60" y="404" width="560" height="58" rx="10" stroke-width="1.5"/><text class="th" x="340" y="424" text-anchor="middle" dominant-baseline="central">Décision de la classe : on apprend le chant tous ensemble,</text><text class="th" x="340" y="444" text-anchor="middle" dominant-baseline="central">puis on le chante en canon le jour de la fête.</text></g>
</svg>
