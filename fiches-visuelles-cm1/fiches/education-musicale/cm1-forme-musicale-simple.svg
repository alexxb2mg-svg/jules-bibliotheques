<text class="ts" x="347.8" y="118.0" text-anchor="middle" dominant-baseline="central">les messieurs</text>
<g class="c-blue"><rect x="396.4" y="46" width="85.2" height="56" rx="8" stroke-width="1.2"/><text class="th" x="439.0" y="74" text-anchor="middle" dominant-baseline="central">refrain</text></g>
<text class="ts" x="439.0" y="118.0" text-anchor="middle" dominant-baseline="central">Sur le pont</text>
