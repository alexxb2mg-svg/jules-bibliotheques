<text class="ts" x="530.2" y="118.0" text-anchor="middle" dominant-baseline="central">les dames</text>
<g class="c-blue"><rect x="578.8" y="46" width="85.2" height="56" rx="8" stroke-width="1.2"/><text class="th" x="621.4" y="74" text-anchor="middle" dominant-baseline="central">refrain</text></g>
<text class="ts" x="621.4" y="118.0" text-anchor="middle" dominant-baseline="central">Sur le pont</text>
