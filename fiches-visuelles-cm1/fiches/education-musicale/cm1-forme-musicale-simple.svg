<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Quatre formes en blocs de couleur, chacune avec une œuvre à écouter</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="340.0" y="18.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Une couleur = une partie. La même couleur revient = la même musique revient.</text>
<text class="tl" x="20" y="62" text-anchor="start" dominant-baseline="central">Couplet-refrain</text>
<text class="t" x="20.0" y="88.0" text-anchor="start" dominant-baseline="central">« Sur le pont d'Avignon »</text>
<text class="ts" x="20.0" y="108.0" text-anchor="start" dominant-baseline="central">chanson traditionnelle</text>
<g class="c-blue"><rect x="214.0" y="46" width="85.2" height="56" rx="8" stroke-width="1.2"/><text class="th" x="256.6" y="74" text-anchor="middle" dominant-baseline="central">refrain</text></g>
