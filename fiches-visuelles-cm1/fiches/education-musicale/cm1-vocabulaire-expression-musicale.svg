<text class="t" x="143.0" y="404.0" fill="#C2410C" font-weight="600" text-anchor="middle" dominant-baseline="central">cresc. : de plus en plus fort</text>
<line x1="444.0" y1="346.0" x2="630.0" y2="364.0" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<line x1="444.0" y1="382.0" x2="630.0" y2="364.0" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<text class="t" x="537.0" y="404.0" fill="#185FA5" font-weight="600" text-anchor="middle" dominant-baseline="central">decresc. : de moins en moins fort</text>
<text class="ts" x="340.0" y="364.0" text-anchor="middle" dominant-baseline="central">comme une vague</text>
<text class="ts" x="340.0" y="380.0" text-anchor="middle" dominant-baseline="central">qui grossit ou qui s'éteint</text>
