<text x="340.0" y="318.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Changer de nuance petit à petit</text>
<line x1="50.0" y1="364.0" x2="236.0" y2="346.0" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/>
