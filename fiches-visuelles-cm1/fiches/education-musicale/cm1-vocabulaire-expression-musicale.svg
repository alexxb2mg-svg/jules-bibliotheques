<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg"><title>L'échelle des nuances, de pp à ff</title>
<text x="340.0" y="20.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Les nuances : du plus doux au plus fort</text>
<rect x="40.0" y="166.0" width="68.0" height="20.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
<text class="tx" x="74.0" y="212.0" fill="#185FA5" font-weight="700" font-style="italic" text-anchor="middle" dominant-baseline="central">pp</text>
<text class="t" x="74.0" y="240.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">très doux</text>
<text class="t" x="74.0" y="262.0" text-anchor="middle" dominant-baseline="central">un secret</text>
<text class="t" x="74.0" y="280.0" text-anchor="middle" dominant-baseline="central">à l'oreille</text>
<rect x="173.0" y="140.0" width="68.0" height="46.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/>
<text class="tx" x="207.0" y="212.0" fill="#185FA5" font-weight="700" font-style="italic" text-anchor="middle" dominant-baseline="central">p</text>
<text class="t" x="207.0" y="240.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">doux</text>
<text class="t" x="207.0" y="262.0" text-anchor="middle" dominant-baseline="central">une berceuse</text>
<text class="t" x="207.0" y="280.0" text-anchor="middle" dominant-baseline="central">pour un bébé</text>
<rect x="306.0" y="114.0" width="68.0" height="72.0" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/>
<text class="tx" x="340.0" y="212.0" fill="#534AB7" font-weight="700" font-style="italic" text-anchor="middle" dominant-baseline="central">mf</text>
<text class="t" x="340.0" y="240.0" fill="#534AB7" font-weight="700" text-anchor="middle" dominant-baseline="central">assez fort</text>
<text class="t" x="340.0" y="262.0" text-anchor="middle" dominant-baseline="central">on se parle</text>
<text class="t" x="340.0" y="280.0" text-anchor="middle" dominant-baseline="central">à table</text>
<rect x="439.0" y="88.0" width="68.0" height="98.0" rx="6" fill="#FAECE7" stroke="#C2410C" stroke-width="1.6"/>
<text class="tx" x="473.0" y="212.0" fill="#C2410C" font-weight="700" font-style="italic" text-anchor="middle" dominant-baseline="central">f</text>
<text class="t" x="473.0" y="240.0" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">fort</text>
<text class="t" x="473.0" y="262.0" text-anchor="middle" dominant-baseline="central">on appelle</text>
<text class="t" x="473.0" y="280.0" text-anchor="middle" dominant-baseline="central">dans la cour</text>
<rect x="572.0" y="62.0" width="68.0" height="124.0" rx="6" fill="#FAECE7" stroke="#C2410C" stroke-width="1.6"/>
<text class="tx" x="606.0" y="212.0" fill="#C2410C" font-weight="700" font-style="italic" text-anchor="middle" dominant-baseline="central">ff</text>
<text class="t" x="606.0" y="240.0" fill="#C2410C" font-weight="700" text-anchor="middle" dominant-baseline="central">très fort</text>
<text class="t" x="606.0" y="262.0" text-anchor="middle" dominant-baseline="central">un stade entier</text>
<text class="t" x="606.0" y="280.0" text-anchor="middle" dominant-baseline="central">qui encourage</text>
