<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Couplets et refrain en blocs, et le couplet appris en escalier</title>
<text x="340.0" y="20.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">« À la claire fontaine » : couplets et refrain</text>
<g class="c-blue"><rect x="22" y="44" width="100" height="50" rx="8" stroke-width="1.2"/><text class="th" x="72" y="62" text-anchor="middle" dominant-baseline="central">Couplet 1</text><text class="tl" x="72" y="82" text-anchor="middle" dominant-baseline="central">A</text></g>
<g class="c-amber"><rect x="129" y="44" width="100" height="50" rx="8" stroke-width="1.2"/><text class="th" x="179" y="62" text-anchor="middle" dominant-baseline="central">Refrain</text><text class="tl" x="179" y="82" text-anchor="middle" dominant-baseline="central">B</text></g>
<g class="c-blue"><rect x="236" y="44" width="100" height="50" rx="8" stroke-width="1.2"/><text class="th" x="286" y="62" text-anchor="middle" dominant-baseline="central">Couplet 2</text><text class="tl" x="286" y="82" text-anchor="middle" dominant-baseline="central">A</text></g>
<g class="c-amber"><rect x="343" y="44" width="100" height="50" rx="8" stroke-width="1.2"/><text class="th" x="393" y="62" text-anchor="middle" dominant-baseline="central">Refrain</text><text class="tl" x="393" y="82" text-anchor="middle" dominant-baseline="central">B</text></g>
<g class="c-blue"><rect x="450" y="44" width="100" height="50" rx="8" stroke-width="1.2"/><text class="th" x="500" y="62" text-anchor="middle" dominant-baseline="central">Couplet 3</text><text class="tl" x="500" y="82" text-anchor="middle" dominant-baseline="central">A</text></g>
<g class="c-amber"><rect x="557" y="44" width="100" height="50" rx="8" stroke-width="1.2"/><text class="th" x="607" y="62" text-anchor="middle" dominant-baseline="central">Refrain</text><text class="tl" x="607" y="82" text-anchor="middle" dominant-baseline="central">B</text></g>
<text class="t" x="340.0" y="114.0" text-anchor="middle" dominant-baseline="central">A = même air, paroles nouvelles à chaque couplet.   B = même air ET mêmes paroles.</text>
<rect x="64.0" y="132.0" width="552.0" height="44.0" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text class="t" x="340.0" y="146.0" fill="#854F0B" font-weight="600" text-anchor="middle" dominant-baseline="central">Refrain : « Il y a longtemps que je t'aime, jamais je ne t'oublierai. »</text>
<text class="ts" x="340.0" y="164.0" fill="#854F0B" text-anchor="middle" dominant-baseline="central">Tu l'apprends une seule fois, et tu le chantes 3 fois !</text>
<line x1="40.0" y1="194.0" x2="640.0" y2="194.0" stroke="#cfd8e3" stroke-width="1" stroke-linecap="butt"/>
<text x="340.0" y="214.0" font-size="17" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Le couplet 1 en escalier : on ajoute une phrase à la fois</text>
<text class="t" x="30.0" y="262.0" font-weight="600" text-anchor="start" dominant-baseline="central">Étape 1</text>
<rect x="110.0" y="246.0" width="46.0" height="32.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="tl" x="133.0" y="262.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text class="t" x="172.0" y="262.0" fill="#185FA5" text-anchor="start" dominant-baseline="central">+ « À la claire fontaine »</text>
<text class="t" x="30.0" y="312.0" font-weight="600" text-anchor="start" dominant-baseline="central">Étape 2</text>
<rect x="110.0" y="296.0" width="46.0" height="32.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="tl" x="133.0" y="312.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="162.0" y="296.0" width="46.0" height="32.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="tl" x="185.0" y="312.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<text class="t" x="224.0" y="312.0" fill="#185FA5" text-anchor="start" dominant-baseline="central">+ « M'en allant promener »</text>
<text class="t" x="30.0" y="362.0" font-weight="600" text-anchor="start" dominant-baseline="central">Étape 3</text>
<rect x="110.0" y="346.0" width="46.0" height="32.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="tl" x="133.0" y="362.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="162.0" y="346.0" width="46.0" height="32.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="tl" x="185.0" y="362.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="214.0" y="346.0" width="46.0" height="32.0" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.6"/>
<text class="tl" x="237.0" y="362.0" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text class="t" x="276.0" y="362.0" fill="#185FA5" text-anchor="start" dominant-baseline="central">+ « J'ai trouvé l'eau si belle »</text>
<text class="t" x="30.0" y="412.0" font-weight="600" text-anchor="start" dominant-baseline="central">Étape 4</text>
<rect x="110.0" y="396.0" width="46.0" height="32.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="tl" x="133.0" y="412.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<rect x="162.0" y="396.0" width="46.0" height="32.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="tl" x="185.0" y="412.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="214.0" y="396.0" width="46.0" height="32.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="tl" x="237.0" y="412.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="266.0" y="396.0" width="46.0" height="32.0" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<text class="tl" x="289.0" y="412.0" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text class="t" x="328.0" y="412.0" fill="#185FA5" text-anchor="start" dominant-baseline="central">+ « Que je m'y suis baigné »</text>
<text class="t" x="470.0" y="258.0" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">J'hésite sur la phrase 3 ?</text>
<text class="t" x="470.0" y="276.0" fill="#A32D2D" text-anchor="start" dominant-baseline="central">Je la répète seule 3 fois,</text>
<text class="t" x="470.0" y="294.0" fill="#A32D2D" text-anchor="start" dominant-baseline="central">puis je reprends l'étape.</text>
<text class="ts" x="340.0" y="454.0" text-anchor="middle" dominant-baseline="central">Chaque étape se chante depuis le début : 1, puis 1-2, puis 1-2-3, puis tout le couplet.</text>
</svg>
