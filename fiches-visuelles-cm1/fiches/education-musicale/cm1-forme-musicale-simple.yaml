notion: cm1-forme-musicale-simple
titre: "La forme d'une musique : ce qui revient, ce qui change"
matiere: education-musicale
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 48", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Éducation musicale — Repères pour l'écoute » (cycles 2, 3, 4), p. 4", url: "https://eduscol.education.gouv.fr/sites/default/files/document/ra16c2c3emusecouterepere-ecoute837653pdf-74949.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: refrain-couplet
    type: formule
    expression: "[refrain] : revient identique · [couplet] : change à chaque fois"
    termes:
      "refrain": {couleur: bleu, legende: "la partie qui revient avec les **mêmes paroles** et la **même mélodie**, plusieurs fois dans la chanson"}
      "couplet": {couleur: orange, legende: "la partie qui garde souvent sa mélodie, mais qui a des **paroles nouvelles** à chaque fois"}
    jules: "Le refrain, c'est le morceau que toute la classe sait chanter après une seule écoute. Normal : on l'a entendu plusieurs fois !"

  - id: carte
    type: carte
    noeuds:
      - {id: forme, titre: "La forme d'une musique", sous_titre: "comment elle est organisée dans le temps", principal: true}
      - {id: repetition, titre: "Une répétition", sous_titre: "une mélodie, un rythme ou un thème qui revient"}
      - {id: couplet, titre: "Couplet-refrain", sous_titre: "le refrain revient, pareil, entre des couplets différents"}
      - {id: aba, titre: "A B A", sous_titre: "une partie A, une partie B différente, puis A revient"}
      - {id: lettres, titre: "Des lettres pour noter", sous_titre: "même lettre = même musique ; lettre nouvelle = partie nouvelle"}
    liens:
      - {de: forme, vers: repetition}
      - {de: forme, vers: couplet}
      - {de: forme, vers: aba}
      - {de: forme, vers: lettres}
    jules: "La forme, c'est un peu le plan d'une maison : on ne voit pas les briques, mais on repère les pièces. En musique, les pièces sont les parties qui reviennent ou qui changent."

  - id: schema-formes
    type: schema
    titre: "Quatre formes en blocs de couleur, chacune avec une œuvre à écouter"
    svg: "cm1-forme-musicale-simple.svg"
    jules: "Le **rondeau** est un cousin du couplet-refrain : le refrain A revient entre des couplets toujours nouveaux, B puis C. Dans le « Rondeau » de Mouret, écrit en 1729, les trompettes font sonner ce refrain."

  - id: schema-clair-de-lune
    type: schema
    titre: "Au clair de la lune : les phrases A ont le même dessin, la phrase B est différente"
    svg: "cm1-forme-musicale-simple-clair-de-lune.svg"
    jules: "Chante la chanson en suivant les traits avec ton doigt. Les phrases 1, 2 et 4 ont la même mélodie, seules les paroles changent : c'est pour ça qu'on leur donne la même lettre A."

  - id: graphe
    type: graphe
    gabarit: forme-musicale
    curseurs:
      - {id: curseur-forme, nom: forme, min: 1, max: 4, pas: 1, depart: 2}
      - {id: curseur-lecture, nom: lecture, min: 0, max: 100, pas: 5, depart: 0}
    lectures:
      - {si: "forme == 2", texte: "**A B A** : la première partie revient à la fin, pareille."}
      - {si: "forme == 3", texte: "**Couplet-refrain** : le refrain (même couleur) revient avec les mêmes paroles."}
      - {si: "forme == 4", texte: "**Rondeau** : le refrain A revient entre des couplets toujours nouveaux."}
      - {si: "lecture == 0", texte: "Fais avancer la lecture et lève la main quand une **couleur revient**."}
    jules: "Suis la tête de lecture rouge avec ton doigt. Quand une couleur que tu as déjà vue se rallume, c'est la même musique qui **revient**."

  - id: methode
    type: methode
    etapes:
      - "Écoute la musique **en entier**, une première fois, sans rien noter."
      - "Réécoute-la et lève la main quand un morceau de mélodie ou de rythme **revient** : c'est une répétition."
      - "Donne une lettre à chaque partie : A pour la première, B pour une partie nouvelle, et encore A si la première revient **identique**."
      - "Écris les lettres dans l'ordre sur ton cahier : A B A, A A B A..."
      - "Nomme la forme : **couplet-refrain** si une partie revient avec les mêmes paroles, **ABA** si la première partie revient à la fin."
    jules: "Une seule écoute ne suffit presque jamais. À la deuxième écoute, tu sais déjà ce qui arrive, alors tu remarques plus facilement ce qui revient."

  - id: piege
    type: piege
    mauvaise_idee: "Le couplet, c'est le début de la chanson ; le refrain, c'est la fin."
    pourquoi_faux: "Ce n'est pas la place qui compte. « Sur le pont d'Avignon » commence par le refrain ! Le **refrain** revient avec les mêmes paroles ; le **couplet**, lui, change de paroles."
    bonne_idee: "Compare les paroles : si elles reviennent **identiques**, c'est le refrain ; si elles sont nouvelles sur la même mélodie, c'est un couplet."
    jules: "Autre piège : dire « ABA » trop vite. Vérifie que la dernière partie est vraiment la même que la première, et pas seulement un peu ressemblante."

  - id: exemple-aba
    type: exemple
    situation: "En classe, Sacha écoute « Ah ! vous dirai-je, maman ». Il entend une première mélodie, puis une mélodie nouvelle, puis la toute première mélodie revient, pareille. Quelle forme reconnaît-il ?"
    calcul: "Première mélodie : A. Mélodie nouvelle : B. La première revient identique : c'est encore A. Dans l'ordre : A, puis B, puis A."
    conclusion: "C'est une **forme ABA** : la partie A revient après la partie B."
    jules: "Mozart a écrit douze variations sur cette mélodie, pour le piano. Tu la connais aussi sous le nom de « Twinkle, twinkle, little star » en anglais !"

  - id: exemple-refrain
    type: exemple
    situation: "À la chorale, Emma chante « Sur le pont d'Avignon » avec 3 couplets : les beaux messieurs, les belles dames, puis les musiciens. La chanson commence et finit par le refrain. Combien de fois chante-t-elle le refrain ?"
    calcul: "L'ordre est : refrain, couplet 1, refrain, couplet 2, refrain, couplet 3, refrain. On compte les refrains : 1, 2, 3, 4."
    conclusion: "Emma chante le refrain **4 fois** et **3 couplets** différents : c'est une forme couplet-refrain."
    jules: "Ici, il y a un refrain de plus que de couplets, parce que la chanson commence et se termine par le refrain."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : choisis ta chanson préférée et dessine sa forme avec des carrés de couleur, une couleur par partie. Compte ensuite combien de fois la couleur du refrain revient."
