notion: cm1-parametres-son-exploration
titre: "Les paramètres du son : hauteur, durée, intensité et timbre"
matiere: education-musicale
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 49", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Éducation musicale — Repères pour l'écoute » (cycles 2, 3, 4), p. 2", url: "https://eduscol.education.gouv.fr/sites/default/files/document/ra16c2c3emusecouterepere-ecoute837653pdf-74949.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: quatre-parametres
    type: formule
    expression: "un son = [hauteur] + [durée] + [intensité] + [timbre]"
    termes:
      "hauteur": {couleur: bleu, legende: "**grave** ou **aigu** : une grosse caisse est grave, un sifflet est aigu"}
      "durée": {couleur: vert, legende: "**court** ou **long** : le « tac » des claves est court, le triangle résonne longtemps"}
      "intensité": {couleur: orange, legende: "**doux** ou **fort** : on l'écrit avec des nuances, p pour doux, f pour fort"}
      "timbre": {couleur: violet, legende: "la **couleur du son** : ce qui fait reconnaître une flûte, un violon ou la voix d'un copain"}
    jules: "Ces quatre mots sont comme quatre boutons : tu peux tourner l'un sans toucher aux autres. Un même son peut être aigu, long, doux et joué par une flûte, tout à la fois."

  - id: carte
    type: carte
    noeuds:
      - {id: son, titre: "Transformer un son", sous_titre: "on change un paramètre, on écoute ce qui change", principal: true}
      - {id: hauteur, titre: "La hauteur", sous_titre: "grave comme un ours, aigu comme un oiseau"}
      - {id: duree, titre: "La durée", sous_titre: "court comme un « tac », long comme une sirène"}
      - {id: intensite, titre: "L'intensité", sous_titre: "doux comme un chuchotement, fort comme un cri"}
      - {id: timbre, titre: "Le timbre", sous_titre: "ce qui fait dire : c'est une flûte, c'est la voix de Léo"}
    liens:
      - {de: son, vers: hauteur}
      - {de: son, vers: duree}
      - {de: son, vers: intensite}
      - {de: son, vers: timbre}
    jules: "Les mots pour décrire le timbre sont souvent des images : un son **métallique**, **sourd**, doux comme du velours, qui gratte, qui claque. Plus tu as de mots, mieux tu décris ce que tu entends."

  - id: schema-objets
    type: schema
    titre: "Les quatre paramètres du son, explorés avec des objets de la maison"
    svg: "cm1-parametres-son-exploration.svg"
    jules: "Attention, si tu **souffles** au-dessus d'une bouteille au lieu de la frapper, c'est l'inverse : plus il y a d'eau, plus le son est aigu. Dans ce cas, c'est l'air au-dessus de l'eau qui fait le son."

  - id: schema-grave-fort
    type: schema
    titre: "Grave ou aigu, doux ou fort : quatre sons de la vie de tous les jours"
    svg: "cm1-parametres-son-exploration-grave-fort.svg"
    jules: "Le tonnerre est grave et pourtant très fort ; le moustique est aigu et pourtant tout doux. La hauteur et l'intensité sont donc deux choses bien différentes."

  - id: graphe
    type: graphe
    gabarit: onde-sonore
    curseurs:
      - {id: curseur-hauteur, nom: hauteur, min: 3, max: 10, pas: 1, depart: 6}
      - {id: curseur-intensite, nom: intensite, min: 1, max: 5, pas: 1, depart: 3}
      - {id: curseur-duree, nom: duree, min: 1, max: 4, pas: 1, depart: 2}
    lectures:
      - {si: "hauteur <= 5", texte: "Vagues larges : le son est **grave**, comme une grosse caisse."}
      - {si: "hauteur >= 6 && hauteur <= 7", texte: "Vagues moyennes : le son est **médium**, ni grave ni aigu, comme une voix qui parle."}
      - {si: "hauteur >= 8", texte: "Vagues serrées : le son est **aigu**, comme un sifflet."}
      - {si: "intensite >= 4", texte: "Vagues hautes : le son est **fort**. Fort et aigu, ce n'est pas la même chose !"}
    jules: "Bouge un seul curseur à la fois. La hauteur serre ou écarte les vagues, l'intensité les rend plus hautes, la durée les allonge (trait vert) : trois réglages qui ne dépendent pas les uns des autres."

  - id: methode
    type: methode
    etapes:
      - "Choisis un objet qui fait du bruit : une règle, un verre, une boîte, ou simplement ta voix."
      - "Change la **hauteur** : tends plus ou moins un élastique, chante plus haut ou plus bas."
      - "Change la **durée** : fais un son très court, puis laisse-le résonner le plus longtemps possible."
      - "Change **l'intensité** : joue tout doucement (p), puis fort (f), sans changer autre chose."
      - "Change le **timbre** : frotte, tape, gratte ou souffle, ou prends un autre objet."
      - "Note chaque découverte avec le bon mot : grave, aigu, court, long, doux, fort, métallique..."
    jules: "Essaie ensuite de changer deux boutons à la fois : un son aigu et fort, puis grave et doux. C'est comme ça que les musiciens inventent de nouvelles idées."

  - id: piege
    type: piege
    mauvaise_idee: "« Monte le son ! » : un son plus fort, c'est un son plus aigu."
    pourquoi_faux: "« Monter le son », c'est changer **l'intensité** : le son devient plus fort. Un son **aigu**, c'est une autre chose : c'est la **hauteur**. Une grosse caisse frappée fort reste grave."
    bonne_idee: "Pose-toi deux questions séparées. Grave ou aigu : c'est la **hauteur**. Doux ou fort : c'est **l'intensité**."
    jules: "Autre confusion : le timbre n'est pas la hauteur. Une flûte et un violon peuvent jouer exactement la même note, et tu les reconnais quand même : c'est grâce au timbre."

  - id: exemple-casserole
    type: exemple
    situation: "Après le goûter, Ilyes frappe la même casserole deux fois, avec la même force : d'abord avec une cuillère en bois, puis avec une cuillère en métal. Quel paramètre du son change surtout ?"
    calcul: "La casserole est la même, la force aussi : l'intensité ne change pas. Seule la matière de la cuillère change. Avec le bois, on entend un « toc » sourd ; avec le métal, un « ding » qui sonne."
    conclusion: "C'est surtout le **timbre** qui change : la couleur du son n'est plus la même."
    jules: "Pour bien comparer, on ne change qu'une seule chose à la fois, comme un savant qui fait une expérience. Sinon, on ne sait plus ce qui a transformé le son."

  - id: exemple-verres
    type: exemple
    situation: "Jade remplit trois verres identiques : un plein d'eau, un à moitié, un presque vide. Elle frappe chacun doucement avec une petite cuillère. Lequel donne le son le plus aigu ?"
    calcul: "Le verre plein donne le son le plus grave. Le verre à moitié plein donne un son au milieu. Le verre presque vide donne le son le plus aigu : moins il y a d'eau, plus le son est aigu."
    conclusion: "Le verre **presque vide** donne le son le plus aigu. En changeant l'eau, Jade change la **hauteur** du son."
    jules: "Avec huit verres bien remplis, on peut jouer une petite gamme, do ré mi fa sol la si do. C'est un vrai instrument de cuisine !"

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : pose une règle au bord de la table et fais-la vibrer. Plus la partie qui dépasse est courte, plus le son est aigu : vérifie-le toi-même !"
