notion: cm1-polyphonie-simple
titre: "La polyphonie : tenir sa partie quand les autres chantent autre chose"
matiere: education-musicale
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 48", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Construire une séquence en éducation musicale au cycle 3 », p. 6", url: "https://eduscol.education.gouv.fr/sites/default/files/document/ra16c3eartemusconstruire-sequence-dm613816pdf-74919.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: polyphonie
    type: formule
    expression: "polyphonie = [partie 1] + [partie 2], en même temps"
    termes:
      "partie 1": {couleur: bleu, legende: "ce que chante (ou joue) un premier groupe : par exemple la **mélodie**"}
      "partie 2": {couleur: vert, legende: "ce que fait un autre groupe au même moment, mais **pas la même chose** : la même mélodie décalée, ou un rythme tapé"}
    jules: "« Poly » veut dire « plusieurs », et « phonie » veut dire « son » ou « voix ». Tout le monde qui chante pareil, ce n'est pas une polyphonie : c'est un chant à l'unisson."

  - id: carte
    type: carte
    noeuds:
      - {id: poly, titre: "La polyphonie", sous_titre: "plusieurs parties en même temps, pas la même chose", principal: true}
      - {id: canon, titre: "Le canon", sous_titre: "le même chant, avec des départs décalés"}
      - {id: ostinato, titre: "L'ostinato", sous_titre: "une petite boucle répétée sous le chant"}
      - {id: tenir, titre: "Tenir sa partie", sous_titre: "continuer la sienne sans suivre l'autre"}
      - {id: ensemble, titre: "S'écouter", sous_titre: "ni trop fort, ni trop vite : on s'accorde"}
    liens:
      - {de: poly, vers: canon}
      - {de: poly, vers: ostinato}
      - {de: poly, vers: tenir}
      - {de: poly, vers: ensemble}
    jules: "Les parties ont des rôles qui se complètent, comme dans une équipe de foot : chacun a son poste, et c'est ensemble que ça marche."

  - id: schema-canon
    type: schema
    titre: "Le canon « Frère Jacques » à 2 voix"
    svg: "cm1-polyphonie-simple.svg"
    jules: "La voix 2 entre quand la voix 1 attaque « Dormez-vous ? ». Dans la bande orange, les deux voix chantent deux phrases différentes, et pourtant ça sonne bien."

  - id: schema-ostinato
    type: schema
    titre: "Un ostinato rythmique sous « Au clair de la lune »"
    svg: "cm1-polyphonie-simple-ostinato.svg"
    jules: "Un ostinato, c'est un petit motif qu'on répète en boucle, sans s'arrêter. « Ta » dure une pulsation ; « ti-ti », ce sont deux sons rapides dans une seule pulsation."

  - id: graphe
    type: graphe
    gabarit: pistes-superposees
    curseurs:
      - {id: curseur-voix, nom: voix, min: 1, max: 3, pas: 1, depart: 2}
      - {id: curseur-decalage, nom: decalage, min: 0, max: 4, pas: 1, depart: 2}
      - {id: curseur-lecture, nom: lecture, min: 0, max: 100, pas: 5, depart: 25}
    lectures:
      - {si: "voix == 1", texte: "Un seul groupe : tout le monde chante la même chose, à **l'unisson**."}
      - {si: "voix >= 2 && decalage == 0", texte: "Chaque groupe **tient sa partie** : par exemple un ostinato (orange) sous la mélodie (bleue)."}
      - {si: "voix >= 2 && decalage >= 1", texte: "Le 2e groupe commence plus tard la même mélodie : c'est un **canon**."}
    jules: "Suis ta ligne avec le doigt : la barre rouge montre où chaque groupe en est, au même moment."

  - id: methode
    type: methode
    etapes:
      - "Écoute d'abord **chaque partie** séparément, pour bien la connaître."
      - "Chante ta partie **seul**, plusieurs fois, jusqu'à la savoir sans hésiter."
      - "Écoute l'autre partie pendant que quelqu'un la chante, sans chanter la tienne."
      - "Essaie de **tenir ta partie** pendant que l'autre est chantée en même temps."
      - "Recommence en gardant ton attention sur ta partie, sans te laisser entraîner par l'autre."
    jules: "Beaucoup de choristes posent une main contre une oreille : ils entendent mieux leur propre voix. Tu peux essayer, ça marche aussi en classe."

  - id: piege
    type: piege
    mauvaise_idee: "Dans le canon, j'entends très fort l'autre groupe chanter « Frère Jacques » : je me mets à chanter avec lui."
    pourquoi_faux: "Tu as quitté **ta partie**. Il n'y a plus deux voix différentes, donc plus de **polyphonie** : le canon s'écroule."
    bonne_idee: "Sache ta partie par cœur avant d'essayer à plusieurs. Pendant le canon, écoute d'abord ta voix et continue ta phrase, même si l'autre groupe chante plus fort."
    jules: "Autre erreur : chanter plus fort pour « couvrir » l'autre groupe. Au contraire, on garde sa nuance et on s'écoute : les deux parties doivent s'entendre."

  - id: exemple-canon
    type: exemple
    situation: "Pour le canon « Frère Jacques », le groupe de Jade commence. Le groupe de Sami entre 2 mesures plus tard. Quand le groupe de Sami chante « Sonnez les matines », que chante le groupe de Jade ?"
    calcul: "Chaque phrase dure 2 mesures. Le groupe de Sami a 2 mesures de retard, soit une phrase entière. Quand il chante la phrase 3 (« Sonnez les matines »), le groupe de Jade est déjà à la phrase 4."
    conclusion: "Le groupe de Jade chante « **Ding, ding, dong** ». Chaque groupe tient sa partie : c'est ce décalage qui fait le **canon**."
    jules: "Pour entrer au bon moment, le groupe 2 écoute le groupe 1 : il démarre juste quand celui-ci arrive sur « Dormez-vous ? »."

  - id: exemple-ostinato
    type: exemple
    situation: "Dans un jeu vocal, le groupe A chante « Au clair de la lune ». Emma est dans le groupe B : elle tape « ta, ta, ti-ti, ta » en boucle. Elle entend la mélodie et a envie de la chanter. Que doit-elle faire ?"
    calcul: "Emma compte la pulsation dans sa tête (1, 2, 3, 4) et garde sa boucle, sans accélérer. Elle ne s'arrête pas quand le groupe A chante une note longue, comme sur « lu-ne »."
    conclusion: "Emma **tient sa partie** jusqu'au bout : sa boucle et la mélodie se complètent. C'est une **polyphonie** entre les mains et les voix."
    jules: "Ce genre de polyphonie mêle chant et percussions corporelles : taper dans les mains, sur les cuisses, frapper du pied."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi à la maison : quelqu'un chante « Frère Jacques », toi tu tapes « ta, ta, ti-ti, ta » en boucle. Tenez jusqu'à la fin, puis échangez les rôles."
