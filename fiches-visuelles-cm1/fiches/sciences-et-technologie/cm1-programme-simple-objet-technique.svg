<text class="t" x="525.0" y="348.0" text-anchor="middle" dominant-baseline="central">▲ : le robot, au départ et à l'arrivée</text>
<text class="t" x="525.0" y="368.0" text-anchor="middle" dominant-baseline="central">1 2 3 4 : les 4 passages dans « répéter »</text>
<g class="c-amber"><rect x="340" y="390" width="320" height="52" rx="8" stroke-width="0.8"/><text class="t" x="500.0" y="406.5" text-anchor="middle" dominant-baseline="central">4 passages × 2 cases = 8 cases</text><text class="t" x="500.0" y="425.5" text-anchor="middle" dominant-baseline="central">parcourues en tout</text></g>
</svg>
