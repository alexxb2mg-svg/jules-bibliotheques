<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Un programme en blocs traduit en français : le robot trace un carré</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="150.0" y="18.0" text-anchor="middle" dominant-baseline="central">Le programme (en blocs)</text>
<path d="M20 48 Q60 26 100 44 L324 44 Q330 44 330 50 L330 78 Q330 82 326 82 L24 82 Q20 82 20 78 Z" fill="#F6C667" stroke="#9A6A06" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t code" x="32" y="63.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-size="14" font-weight="600">quand le drapeau vert est cliqué</text>
<path d="M24 84 L326 84 Q330 84 330 88 L330 116 Q330 120 326 120 L38 120 L38 210 L326 210 Q330 210 330 214 L330 228 Q330 232 326 232 L24 232 Q20 232 20 228 L20 88 Q20 84 24 84 Z" fill="#F6C667" stroke="#9A6A06" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t code" x="32" y="103.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-size="14" font-weight="600">répéter 4 fois</text>
<path d="M42 122 L52 122 L56 127 L68 127 L72 122 L324 122 Q328 122 328 126 L328 156 Q328 160 324 160 L42 160 Q38 160 38 156 L38 126 Q38 122 42 122 Z" fill="#7FAEE8" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t code" x="50" y="143.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-size="14" font-weight="600">avancer de 2 cases</text>
<path d="M42 162 L52 162 L56 167 L68 167 L72 162 L324 162 Q328 162 328 166 L328 196 Q328 200 324 200 L42 200 Q38 200 38 196 L38 166 Q38 162 42 162 Z" fill="#7FAEE8" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="t code" x="50" y="183.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18" font-size="14" font-weight="600">tourner à droite (quart de tour)</text>
<rect x="20.0" y="250.0" width="310.0" height="170.0" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th" x="36.0" y="268.0" text-anchor="start" dominant-baseline="central">En français :</text>
<text class="t" x="36.0" y="296.0" text-anchor="start" dominant-baseline="central">Quand on clique sur le drapeau vert,</text>
<text class="t" x="36.0" y="317.0" text-anchor="start" dominant-baseline="central">le robot avance de 2 cases,</text>
<text class="t" x="36.0" y="338.0" text-anchor="start" dominant-baseline="central">puis il tourne d'un quart de tour</text>
<text class="t" x="36.0" y="359.0" text-anchor="start" dominant-baseline="central">vers sa droite.</text>
<text class="t" x="36.0" y="380.0" text-anchor="start" dominant-baseline="central">Il fait cela 4 fois de suite :</text>
<text class="t" x="36.0" y="401.0" text-anchor="start" dominant-baseline="central">il trace un carré et revient au départ.</text>
<text class="th" x="525.0" y="18.0" text-anchor="middle" dominant-baseline="central">Ce que fait le robot</text>
