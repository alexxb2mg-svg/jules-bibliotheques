notion: cm1-phases-de-la-lune
titre: "Les phases de la Lune : observer, dessiner, nommer"
matiere: sciences-et-technologie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de sciences et technologie du cycle 3, arrêté du 5-6-2026, BO n° 24 du 11/06/2026, p. 5", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-2-programme-de-sciences-et-technologie-du-cycle-3-517292.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: lune, titre: "Les phases de la Lune", sous_titre: "les formes que prend la Lune vue depuis la Terre", principal: true}
      - {id: cycle, titre: "Un cycle", sous_titre: "les mêmes formes reviennent dans le même ordre, environ tous les 29 jours et demi"}
      - {id: croissante, titre: "Croissante", sous_titre: "de la nouvelle lune à la pleine lune : la partie éclairée grandit"}
      - {id: decroissante, titre: "Décroissante", sous_titre: "de la pleine lune à la nouvelle lune : elle rapetisse"}
      - {id: carnet, titre: "Le carnet d'observation", sous_titre: "un dessin daté à chaque observation, pendant deux lunaisons"}
    liens:
      - {de: lune, vers: cycle}
      - {de: lune, vers: croissante}
      - {de: lune, vers: decroissante}
      - {de: lune, vers: carnet}
    jules: "Une lunaison, c'est un cycle complet : d'une nouvelle lune à la suivante. Elle dure environ 29 jours et demi, presque un mois. C'est pour cela qu'on dit parfois « il y a trois lunes » pour dire « il y a trois mois »."

  - id: schema-carnet
    type: schema
    titre: "Le carnet d'observation : la Lune jour après jour"
    svg: "cm1-phases-de-la-lune.svg"
    jules: "Les quatre phases à connaître par cœur : **nouvelle lune** (on ne la voit pas), **premier quartier**, **pleine lune**, **dernier quartier**. Entre elles, il y a environ une semaine."

  - id: schema-soleil
    type: schema
    titre: "Pourquoi la forme change : la Lune tourne autour de la Terre"
    svg: "cm1-phases-de-la-lune-soleil.svg"
    jules: "La Lune ne fait pas sa propre lumière : elle est éclairée par le Soleil, toujours à moitié. En tournant autour de la Terre, elle nous montre un morceau plus ou moins grand de sa moitié éclairée."

  - id: graphe-lune
    type: graphe
    gabarit: cycle-lune
    curseurs:
      - {id: curseur-jour, nom: jour, min: 0, max: 29, pas: 1, depart: 7}
    lectures:
      - {si: "jour <= 1", texte: "**Nouvelle lune** : la face éclairée est tournée vers le Soleil, on ne voit rien depuis la Terre."}
      - {si: "jour >= 6 && jour <= 8", texte: "**Premier quartier** : la moitié droite est éclairée, la Lune est **croissante**."}
      - {si: "jour >= 14 && jour <= 16", texte: "**Pleine lune** : on voit toute la moitié éclairée, la Lune est à l'opposé du Soleil."}
      - {si: "jour >= 21 && jour <= 23", texte: "**Dernier quartier** : la moitié gauche est éclairée, la Lune est **décroissante**."}
    jules: "En haut, la Terre et la Lune vues de très haut : le Soleil, à droite, éclaire toujours la moitié de la Lune. En bas, ce que tu vois depuis la Terre. Avance les jours : la partie éclairée grandit, puis rapetisse."

  - id: methode
    type: methode
    etapes:
      - "Observe la Lune le plus souvent possible, par exemple chaque soir sans nuages, du même endroit."
      - "**Dessine** la partie éclairée que tu vois, dans un rond, et écris la date à côté."
      - "Continue pendant **deux lunaisons**, environ deux mois, même si certains soirs tu ne la vois pas."
      - "Compare tes dessins : les mêmes formes reviennent dans le même ordre. **Nomme** chaque phase."
    jules: "Tu peux aussi voir la Lune le matin ou l'après-midi, dans le ciel bleu ! Une seule observation ne suffit jamais : elle montre une forme, pas le cycle."

  - id: piege
    type: piege
    mauvaise_idee: "Une demi-lune, c'est toujours le premier quartier."
    pourquoi_faux: "Il y a **deux** demi-lunes. Éclairée à droite, c'est le **premier quartier** : la Lune grandit. Éclairée à gauche, c'est le **dernier quartier** : elle rapetisse."
    bonne_idee: "Premier quartier : environ 7 jours après la nouvelle lune, côté droit éclairé. Dernier quartier : environ 22 jours après, côté gauche éclairé."
    jules: "L'astuce : « la Lune est menteuse ». Quand elle a la forme d'un C, elle ne croît pas, elle décroît. Quand on peut en faire un D en ajoutant une barre, elle croît."

  - id: exemple-croissant
    type: exemple
    situation: "Ce soir, Emma voit un fin croissant de Lune, éclairé sur le côté droit. Elle le dessine dans son carnet. Quelle phase verra-t-elle ensuite ?"
    calcul: "Côté droit éclairé et partie éclairée petite : c'est le **premier croissant**, environ 4 jours après la nouvelle lune. La Lune est croissante, la partie éclairée va grandir."
    conclusion: "Dans environ 3 jours, Emma verra le **premier quartier**. Environ une semaine plus tard, la **pleine lune**."
    jules: "Si le croissant avait été éclairé à gauche, en forme de C, ce serait le dernier croissant : la prochaine phase serait la nouvelle lune."

  - id: exemple-pleine
    type: exemple
    situation: "Samir voit la pleine lune le 5 octobre. Vers quelle date la reverra-t-il ?"
    calcul: "Une lunaison dure environ 29 jours et demi. Octobre a 31 jours : du 5 octobre au 5 novembre, il y a 31 jours. La lunaison est un peu plus courte, d'un jour et demi environ."
    conclusion: "Samir reverra la **pleine lune** vers le 3 ou le 4 novembre, un peu avant le 5."
    jules: "C'est pour cela que la pleine lune ne tombe pas à la même date chaque mois : le cycle de la Lune est un peu plus court que la plupart des mois."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : prépare un carnet avec un rond par jour pendant un mois. Dessine la Lune chaque soir où tu la vois, et note la date. À la fin, tu auras ton propre calendrier lunaire."
