<text class="t" x="36.0" y="406.0" text-anchor="start" dominant-baseline="central">Si oui, elle s'allume.</text>
<text class="t" x="36.0" y="426.0" text-anchor="start" dominant-baseline="central">Sinon, elle s'éteint.</text>
