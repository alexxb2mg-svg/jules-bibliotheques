<polygon points="88.0,359.0 110.0,350.0 110.0,390.0 88.0,381.0" fill="#8a94a3" stroke="#1a1a18" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="109.0" y="350.0" width="4.0" height="40.0" rx="0" fill="#E0B400" stroke="#1a1a18" stroke-width="1"/>
<rect x="520.0" y="320.0" width="12.0" height="100.0" rx="0" fill="#ffffff" stroke="#1a1a18" stroke-width="1.8"/>
<rect x="521.0" y="324.0" width="10.0" height="92.0" rx="0" fill="#4a4a48" stroke="none" stroke-width="0"/>
<g class="c-gray"><text class="t" x="544.0" y="360.0" text-anchor="start" dominant-baseline="central">ombre sur</text></g>
<g class="c-gray"><text class="t" x="544.0" y="380.0" text-anchor="start" dominant-baseline="central">l'écran</text></g>
<g class="c-gray"><text class="t" x="300.0" y="424.0" text-anchor="middle" dominant-baseline="central">carton, bois, métal, ton corps</text></g>
</svg>
