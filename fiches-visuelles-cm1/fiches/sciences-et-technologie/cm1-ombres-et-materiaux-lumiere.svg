<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg"><title>Transparent, translucide, opaque : ce que la lumière traverse</title>
<g class="c-blue"><text class="th" x="20.0" y="20.0" text-anchor="start" dominant-baseline="central">TRANSPARENT</text></g>
<g class="c-blue"><text class="t" x="140.0" y="20.0" text-anchor="start" dominant-baseline="central">la lumière passe, on voit net à travers</text></g>
<polygon points="112.0,52.0 300.0,36.0 300.0,104.0 112.0,88.0" fill="#FCE9A6" stroke="none" stroke-width="0" stroke-linejoin="round"/>
