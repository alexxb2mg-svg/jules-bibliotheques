<rect x="521.0" y="24.0" width="10.0" height="92.0" rx="0" fill="#FCE9A6" stroke="none" stroke-width="0"/>
<g class="c-blue"><text class="t" x="544.0" y="60.0" text-anchor="start" dominant-baseline="central">écran bien</text></g>
<g class="c-blue"><text class="t" x="544.0" y="80.0" text-anchor="start" dominant-baseline="central">éclairé</text></g>
<g class="c-blue"><text class="t" x="300.0" y="124.0" text-anchor="middle" dominant-baseline="central">vitre, verre, film plastique</text></g>
<g class="c-purple"><text class="th" x="20.0" y="170.0" text-anchor="start" dominant-baseline="central">TRANSLUCIDE</text></g>
<g class="c-purple"><text class="t" x="140.0" y="170.0" text-anchor="start" dominant-baseline="central">un peu de lumière passe, on ne voit pas net</text></g>
<polygon points="112.0,202.0 300.0,186.0 300.0,254.0 112.0,238.0" fill="#FCE9A6" stroke="none" stroke-width="0" stroke-linejoin="round"/>
