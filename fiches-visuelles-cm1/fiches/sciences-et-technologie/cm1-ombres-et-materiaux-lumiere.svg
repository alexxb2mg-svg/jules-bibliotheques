<rect x="296.0" y="182.0" width="8.0" height="76.0" rx="0" fill="#E7E4F8" stroke="#534AB7" stroke-width="2" stroke-dasharray="3 2"/>
<rect x="40.0" y="209.0" width="50.0" height="22.0" rx="4" fill="#6b7686" stroke="#1a1a18" stroke-width="1.5"/>
<polygon points="88.0,209.0 110.0,200.0 110.0,240.0 88.0,231.0" fill="#8a94a3" stroke="#1a1a18" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="109.0" y="200.0" width="4.0" height="40.0" rx="0" fill="#E0B400" stroke="#1a1a18" stroke-width="1"/>
<rect x="520.0" y="170.0" width="12.0" height="100.0" rx="0" fill="#ffffff" stroke="#1a1a18" stroke-width="1.8"/>
<rect x="521.0" y="174.0" width="10.0" height="92.0" rx="0" fill="#FDF6DC" stroke="none" stroke-width="0"/>
<g class="c-purple"><text class="t" x="544.0" y="210.0" text-anchor="start" dominant-baseline="central">écran peu</text></g>
<g class="c-purple"><text class="t" x="544.0" y="230.0" text-anchor="start" dominant-baseline="central">éclairé</text></g>
<g class="c-purple"><text class="t" x="300.0" y="274.0" text-anchor="middle" dominant-baseline="central">papier calque, verre dépoli</text></g>
<g class="c-gray"><text class="th" x="20.0" y="320.0" text-anchor="start" dominant-baseline="central">OPAQUE</text></g>
<g class="c-gray"><text class="t" x="140.0" y="320.0" text-anchor="start" dominant-baseline="central">la lumière ne passe pas : il y a une ombre</text></g>
