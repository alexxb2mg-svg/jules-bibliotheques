    jules: "Les mots de cette fiche sont des mots de sciences : on les dit simplement, sans se moquer, comme on dirait « genou » ou « coude ». Tout le monde passe par la puberté, les adultes autour de toi aussi."

  - id: schema-corps
    type: schema
    titre: "Du corps d'enfant au corps d'adulte : ce qui change à la puberté"
    svg: "cm1-changements-morphologiques-puberte.svg"
    jules: "Les **organes génitaux externes**, ce sont les parties du sexe que l'on voit à l'extérieur du corps : la vulve chez la fille, le pénis et les testicules chez le garçon. Le pubis, c'est le bas du ventre, juste au-dessus."

  - id: schema-courbes
    type: schema
    titre: "Deux courbes de croissance : la poussée n'arrive pas au même âge"
    svg: "cm1-changements-morphologiques-puberte-courbes.svg"
    jules: "Une **courbe de croissance** montre la taille d'une personne à chaque anniversaire. Là où la courbe monte le plus fort, la personne grandit le plus vite : c'est la **poussée de croissance** de la puberté."

  - id: methode
    type: methode
    etapes:
      - "Sur un dessin ou une photo, repère ce qui change entre l'enfant et l'adulte : la **taille**, la silhouette, les **poils**."
      - "Range chaque changement : chez tout le monde, chez les filles, ou chez les garçons."
      - "Sur une courbe de croissance, suis la ligne avec ton doigt : cherche l'endroit où elle monte le plus fort. C'est la **poussée de croissance**."
      - "Lis en bas l'âge du début et de la fin de cette poussée. Compare avec une autre courbe : l'âge n'est pas le même."
    jules: "Pour trouver la partie la plus raide, calcule combien de centimètres la personne a pris chaque année. Là où le nombre est le plus grand, c'est la puberté."

  - id: piege
    type: piege
    mauvaise_idee: "Léo a 11 ans. Ses copains ont déjà beaucoup grandi, lui pas encore : il n'est pas normal."
    pourquoi_faux: "La **puberté** ne commence pas au même âge pour tout le monde. Certains commencent tôt, d'autres plus tard, et les changements ne sont pas les mêmes pour chacun."
    bonne_idee: "Léo est tout à fait normal : sa poussée de croissance arrivera plus tard. Sur les courbes, Nina a grandi très vite entre 10 et 12 ans, Yanis entre 12 et 15 ans."
    jules: "En général, la puberté commence entre 8 et 14 ans environ, souvent un peu plus tôt chez les filles. Mais chaque corps a son propre calendrier."

  - id: exemple-courbe
    type: exemple
    situation: "Sur sa courbe de croissance, Nina mesure 131 cm à 9 ans, 136 cm à 10 ans, 143 cm à 11 ans et 151 cm à 12 ans. Quand a eu lieu sa poussée de croissance ?"
    calcul: "De 9 à 10 ans : 136 − 131 = 5 cm. De 10 à 11 ans : 143 − 136 = 7 cm. De 11 à 12 ans : 151 − 143 = 8 cm."
    conclusion: "Entre 10 et 12 ans, Nina grandit bien plus vite qu'avant : c'est sa **poussée de croissance**, le signe de sa **puberté**."
    jules: "Yanis, lui, prend 8 cm par an entre 12 et 15 ans : sa poussée arrive plus tard que celle de Nina. Les deux courbes sont normales."

  - id: exemple-tri
    type: exemple
    situation: "Samir, 13 ans, note ce qui lui arrive cette année : il a pris 9 cm, des poils poussent sous ses bras, il a bronzé cet été, et il a perdu sa dernière dent de lait. Quels changements viennent de la puberté ?"
    calcul: "Grandir de 9 cm en un an : c'est la poussée de croissance. Les poils sous les bras : c'est la pilosité de la puberté. Le bronzage vient du soleil. Les dents de lait commencent à tomber vers 6 ans, bien avant la puberté : c'est un autre changement."
    conclusion: "Deux changements viennent de la **puberté** : la taille et les poils. Le bronzage et la dent de lait n'y sont pas liés."
    jules: "Le corps change toute la vie, pas seulement à la puberté. Pour trier, demande-toi si c'est un des changements de la liste : taille, masse, poils, seins, hanches, organes génitaux."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
