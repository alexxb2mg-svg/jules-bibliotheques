notion: cm1-melanges-homogenes-heterogenes
titre: "Les mélanges : homogène ou hétérogène, séparer, dissoudre"
matiere: sciences-et-technologie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de sciences et technologie du cycle 3, arrêté du 5-6-2026, BO n° 24 du 11/06/2026, p. 4", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-2-programme-de-sciences-et-technologie-du-cycle-3-517292.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: melange, titre: "Un mélange", sous_titre: "plusieurs constituants mis ensemble : eau + sel, eau + sable", principal: true}
      - {id: homogene, titre: "Homogène", sous_titre: "on ne voit qu'une seule chose : l'eau salée, la grenadine"}
      - {id: heterogene, titre: "Hétérogène", sous_titre: "on voit encore les constituants : l'eau et le sable, l'eau et l'huile"}
      - {id: separer, titre: "Séparer", sous_titre: "tamiser, décanter, filtrer (pour ce qui n'est pas dissous)"}
      - {id: dissoudre, titre: "Dissoudre", sous_titre: "le sel devient invisible dans l'eau, jusqu'à la saturation"}
    liens:
      - {de: melange, vers: homogene}
      - {de: melange, vers: heterogene}
      - {de: melange, vers: separer}
      - {de: melange, vers: dissoudre}
    jules: "Les constituants, ce sont les ingrédients du mélange : dans l'eau salée, il y a deux constituants, l'eau et le sel. Pour retenir : « homo » veut dire « pareil », partout pareil ; « hétéro » veut dire « différent »."

  - id: schema-verres
    type: schema
    titre: "Homogène ou hétérogène : que vois-tu dans le verre ?"
    svg: "cm1-melanges-homogenes-heterogenes.svg"
    jules: "Le mot clé, c'est « voir ». Si tu peux montrer du doigt les grains ou la couche d'huile, le mélange est **hétérogène**. Si tout est pareil partout, même de près, il est **homogène**."

  - id: schema-separer
    type: schema
    titre: "Tamiser, décanter, filtrer : trois façons de séparer"
    svg: "cm1-melanges-homogenes-heterogenes-separer.svg"
    jules: "Décanter demande de la patience : il ne faut plus toucher la bouteille. Souvent, on décante d'abord, puis on filtre l'eau presque claire, pour que le filtre ne se bouche pas."

  - id: schema-saturation
    type: schema
    titre: "Dissoudre du sel cuillère par cuillère, jusqu'à la saturation"
    svg: "cm1-melanges-homogenes-heterogenes-saturation.svg"
    jules: "Pour que ton résultat soit juste, mesure toujours pareil : une cuillère bien rase, et la même quantité d'eau au verre doseur. Sinon, tu trouveras un nombre différent à chaque essai."

  - id: graphe
    type: graphe
    gabarit: verre-dissolution
    curseurs:
      - {id: curseur-sel, nom: sel, min: 0, max: 72, pas: 6, depart: 18}
      - {id: curseur-volume, nom: volume, min: 100, max: 100, pas: 100, depart: 100}
    lectures:
      - {si: "sel <= 36", texte: "Le sel s'est **dissous** : on ne le voit plus, le mélange est **homogène**."}
      - {si: "sel > 36", texte: "L'eau est **saturée** : elle ne dissout plus de sel, les grains restent au fond. Le mélange est devenu **hétérogène**."}
    jules: "Chaque cran du curseur sel, c'est une cuillère rase de plus (environ 6 g). Compte les cuillères : avec 10 cL d'eau, les 6 premières disparaissent, à la 7e des grains restent au fond."

  - id: methode
    type: methode
    etapes:
      - "Regarde le mélange de près. Tu vois les constituants ? Il est **hétérogène**. Tu n'en vois qu'un ? Il est **homogène**."
      - "Des solides de tailles différentes : **tamise**, en commençant par le tamis aux plus grosses mailles."
      - "De l'eau avec de la terre : laisse reposer sans bouger (**décantation**), puis verse doucement l'eau claire."
      - "Un solide qui n'est pas dissous dans un liquide : **filtre** avec un filtre à café, un tissu ou du papier absorbant."
      - "Pour la saturation : ajoute le solide une cuillère rase à la fois, mélange, et compte les cuillères jusqu'à ce qu'il en reste au fond."
    jules: "Les mailles, ce sont les trous du tamis. Si tu commences par les petites mailles, le premier tamis garde tout : les cailloux, le gravier et le sable restent mélangés."

  - id: piege
    type: piege
    mauvaise_idee: "Le sel a disparu dans l'eau. Si je filtre l'eau salée, je vais retrouver le sel dans le filtre."
    pourquoi_faux: "Le sel est **dissous** : il est toujours là, mais en morceaux si petits qu'on ne les voit plus. Ils passent à travers le filtre avec l'eau."
    bonne_idee: "Pour revoir le sel, on laisse l'eau salée **s'évaporer** dans une soucoupe pendant quelques jours : l'eau s'en va, le sel reste au fond."
    jules: "C'est comme cela qu'on récolte le sel dans les marais salants : le soleil et le vent font partir l'eau de mer, et le sel reste."

  - id: exemple-flaque
    type: exemple
    situation: "Après la pluie, Maya remplit un bocal avec l'eau boueuse d'une flaque de la cour. Elle veut récupérer de l'eau la plus claire possible."
    calcul: "Elle laisse le bocal sans le bouger jusqu'au lendemain : la terre se dépose au fond, c'est la **décantation**. Elle verse doucement l'eau du dessus dans un filtre à café posé sur un verre : c'est la **filtration**."
    conclusion: "L'eau du verre est **claire** : la terre est restée au fond du bocal et dans le filtre. Attention, claire ne veut pas dire bonne à boire."
    jules: "L'eau claire peut encore contenir des choses dissoutes ou des microbes invisibles. On ne boit jamais une eau qu'on a filtrée soi-même en classe."

  - id: exemple-saturation
    type: exemple
    situation: "Hugo met 10 centilitres (cL) d'eau dans un verre. Il ajoute du sel, une cuillère rase à la fois, et mélange. Les 6 premières cuillères se dissolvent. À la 7e, des grains restent au fond. Et avec 20 cL d'eau ?"
    calcul: "10 cL d'eau dissolvent 6 cuillères. 20 cL, c'est 2 fois plus d'eau : 6 × 2 = 12 cuillères."
    conclusion: "Avec 20 cL d'eau, Hugo peut dissoudre **environ 12 cuillères** de sel avant la **saturation** : deux fois plus d'eau dissout deux fois plus de sel."
    jules: "Ton nombre peut être un peu différent de celui d'Hugo : il dépend de la taille de ta cuillère. Ce qui ne change pas, c'est qu'il existe toujours une limite."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi à la cuisine : mets une cuillère de sucre dans un verre d'eau et une cuillère de riz dans un autre, puis mélange. Le sucre disparaît à la vue (homogène), le riz reste visible au fond (hétérogène)."
