notion: cm1-ombres-et-materiaux-lumiere
titre: "Les ombres : transparent, translucide, opaque, ombre propre et ombre portée"
matiere: sciences-et-technologie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de sciences et technologie du cycle 3, arrêté du 5-6-2026, BO n° 24 du 11/06/2026, p. 5", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-2-programme-de-sciences-et-technologie-du-cycle-3-517292.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: lumiere, titre: "La lumière et les objets", sous_titre: "une source (lampe, Soleil) éclaire un objet", principal: true}
      - {id: transparent, titre: "Transparent", sous_titre: "la lumière passe, on voit net à travers : la vitre"}
      - {id: translucide, titre: "Translucide", sous_titre: "un peu de lumière passe, on voit flou : le papier calque"}
      - {id: opaque, titre: "Opaque", sous_titre: "la lumière ne passe pas : le carton fait une ombre"}
      - {id: ombre, titre: "Deux ombres", sous_titre: "propre sur l'objet, portée sur l'écran ou le sol"}
    liens:
      - {de: lumiere, vers: transparent}
      - {de: lumiere, vers: translucide}
      - {de: lumiere, vers: opaque}
      - {de: lumiere, vers: ombre}
    jules: "Une ombre, ce n'est pas une chose : c'est un endroit où la lumière manque, parce qu'un objet opaque lui barre le chemin. Sans source de lumière, il n'y a pas d'ombre."

  - id: schema-materiaux
    type: schema
    titre: "Transparent, translucide, opaque : la lumière passe-t-elle ?"
    svg: "cm1-ombres-et-materiaux-lumiere.svg"
    jules: "Pour tester un matériau, regarde une lampe à travers (jamais le Soleil). Lampe bien nette : il est **transparent** ; simple lueur floue : **translucide** ; rien du tout : **opaque**."

  - id: schema-propre-portee
    type: schema
    titre: "Ombre propre sur l'objet, ombre portée sur l'écran"
    svg: "cm1-ombres-et-materiaux-lumiere-propre-portee.svg"
    jules: "« Propre » veut dire ici « à lui » : c'est l'ombre qui reste sur l'objet lui-même. « Portée » veut dire « emportée plus loin » : elle est projetée sur le sol ou sur le mur."

  - id: schema-taille
    type: schema
    titre: "Rapprocher l'objet de la lampe agrandit l'ombre portée"
    svg: "cm1-ombres-et-materiaux-lumiere-taille.svg"
    jules: "Les rayons partent tous de la lampe et s'écartent en avançant. Plus l'objet est près de la lampe, plus les rayons qui le frôlent sont écartés quand ils arrivent à l'écran : l'ombre est plus grande."

  - id: graphe-ombre
    type: graphe
    gabarit: ombre-portee
    curseurs:
      - {id: curseur-distance, nom: distance, min: 0.5, max: 2.5, pas: 0.25, depart: 1.5}
      - {id: curseur-hauteur, nom: hauteur, min: 5, max: 20, pas: 5, depart: 10}
      - {id: curseur-matiere, nom: matiere, min: 1, max: 3, pas: 1, depart: 3}
    lectures:
      - {si: "matiere == 3 && distance < 1.5", texte: "L'objet est près de la lampe : les rayons s'écartent beaucoup, l'**ombre portée** est très **grande**."}
      - {si: "matiere == 3 && distance >= 1.5", texte: "L'objet est loin de la lampe, près de l'écran : l'ombre portée est plus **petite**."}
      - {si: "matiere == 2", texte: "Matériau **translucide** : un peu de lumière passe, l'ombre est pâle."}
      - {si: "matiere == 1", texte: "Matériau **transparent** : la lumière passe, il n'y a presque pas d'ombre."}
    jules: "distance : de la lampe à l'objet, en mètres (l'écran reste à 3 m) ; hauteur : la taille de l'objet, en centimètres ; matiere : 1 transparent, 2 translucide, 3 opaque. Bouge un seul curseur à la fois !"

  - id: methode
    type: methode
    etapes:
      - "Pour classer un matériau : mets-le entre une lampe et ton œil. Note s'il est **transparent**, **translucide** ou **opaque**."
      - "Pour produire une ombre : place un objet opaque entre la lampe et un écran (un mur blanc, un drap)."
      - "Repère les deux ombres : l'**ombre propre** sur le côté de l'objet que la lampe n'éclaire pas, l'**ombre portée** sur l'écran."
      - "Pour changer la taille de l'ombre, ne bouge **qu'une seule chose** : la lampe, ou l'objet, ou l'écran. Les deux autres restent à leur place."
    jules: "Ne regarde jamais directement une lampe très forte ni le Soleil : cela abîme les yeux. Si tu bouges deux choses à la fois, tu ne sauras pas laquelle a changé l'ombre."

  - id: piege
    type: piege
    mauvaise_idee: "Quand je suis au soleil dans la cour, mon ombre, c'est seulement la forme noire par terre."
    pourquoi_faux: "La forme par terre, c'est l'**ombre portée**. Mais ton corps a aussi une **ombre propre** : le côté de toi que le Soleil n'éclaire pas."
    bonne_idee: "Si le Soleil est devant toi, ton dos est dans l'ombre : c'est ton ombre propre. L'ombre portée est au sol, derrière toi."
    jules: "Pour ne plus confondre : l'ombre propre touche toujours l'objet, elle est sur lui. L'ombre portée peut être loin de l'objet, sur le sol, un mur ou un écran."

  - id: exemple-theatre
    type: exemple
    situation: "Pour le spectacle de fin d'année, Lou prépare un théâtre d'ombres. La lampe est à 3 m du drap blanc. Sa marionnette de dragon mesure 10 cm. À 2 m de la lampe, l'ombre du dragon mesure 15 cm. Lou veut une ombre plus grande, sans bouger la lampe ni le drap."
    calcul: "Elle rapproche la marionnette de la lampe, à 1 m. Les rayons qui frôlent le dragon s'écartent davantage avant d'arriver au drap : l'ombre mesure maintenant 30 cm."
    conclusion: "Pour une **grande ombre**, on rapproche l'objet de la lampe. Pour une **petite ombre**, on l'approche du drap."
    jules: "Ici, une seule chose a bougé : la marionnette. C'est pour cela que Lou est sûre que c'est sa place qui a changé la taille de l'ombre."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi le soir, avec une lampe de poche : fais une ombre de lapin avec tes mains sur le mur. Approche tes mains de la lampe, puis du mur : le lapin grandit, puis rapetisse."
