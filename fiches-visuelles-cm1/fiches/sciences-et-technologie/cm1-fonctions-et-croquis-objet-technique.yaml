relecture: {statut: a_relire}
blocs:
  - id: relation
    type: formule
    expression: "[une solution technique] assure [une fonction technique]"
    termes:
      "une solution technique": {couleur: bleu, legende: "un **composant**, une forme ou un matériau choisi : la pile, le ressort, la mousse du casque, le manche en bois."}
      "une fonction technique": {couleur: vert, legende: "le travail que fait cette partie dans l'objet : fournir l'énergie, appuyer, amortir un choc, ne pas brûler la main."}
    jules: "Pour trouver une fonction technique, demande-toi à quoi sert cette partie, et réponds par un verbe : protéger, tenir, allumer, amortir. Autre astuce : imagine l'objet sans cette partie, et cherche ce qui ne marcherait plus."

  - id: carte
    type: carte
    noeuds:
      - {id: objet, titre: "Un objet technique", sous_titre: "une fonction d'usage : ce à quoi il sert pour nous", principal: true}
      - {id: composant, titre: "Les composants", sous_titre: "chaque pièce a une fonction technique"}
      - {id: sous-ensemble, titre: "Les sous-ensembles", sous_titre: "plusieurs pièces qui travaillent ensemble"}
      - {id: materiau, titre: "Formes et matériaux", sous_titre: "choisis pour une raison : rigide, souple, transparent"}
      - {id: croquis, titre: "Le croquis légendé", sous_titre: "dessin à main levée qui explique comment ça marche"}
    liens:
      - {de: objet, vers: composant}
      - {de: objet, vers: sous-ensemble}
      - {de: objet, vers: materiau}
      - {de: objet, vers: croquis}
    jules: "La **fonction d'usage**, c'est ce à quoi sert l'objet tout entier : une lampe de poche sert à éclairer. Les **fonctions techniques**, ce sont les petits travaux de chaque partie pour y arriver."

  - id: schema-lampe
    type: schema
    titre: "Croquis légendé d'une lampe de poche, vue en coupe"
    svg: "cm1-fonctions-et-croquis-objet-technique.svg"
    jules: "Suis le courant avec ton doigt : il part des piles, passe dans la lamelle de métal, traverse l'interrupteur et arrive à l'ampoule. Quand l'interrupteur est ouvert, le chemin est coupé : la lampe reste éteinte."

  - id: schema-stylo
    type: schema
    titre: "Un stylo à bille démonté : composants et sous-ensemble"
    svg: "cm1-fonctions-et-croquis-objet-technique-stylo.svg"
    jules: "La recharge est un **sous-ensemble** : la bille, la pointe et le tube d'encre travaillent ensemble pour écrire. Le bouchon, lui, est un **composant** tout seul."

  - id: methode
    type: methode
    etapes:
      - "Observe l'objet et écris sa **fonction d'usage** en une phrase : « il sert à… »."
      - "Montre chaque partie du doigt et dis ce qu'elle fait avec un verbe : c'est sa **fonction technique**."
      - "Regroupe les pièces qui travaillent ensemble : ce sont les **sous-ensembles**. Donne à chacun une couleur."
      - "Fais le croquis à main levée, puis ajoute les légendes : le nom de chaque partie et sa fonction, reliés par un trait."
    jules: "Un croquis n'a pas besoin d'être beau : il doit être clair. Des traits de légende bien droits, qui ne se croisent pas, valent mieux qu'un joli dessin."

  - id: piege
    type: piege
    mauvaise_idee: "Pour décrire le casque de vélo, j'écris la liste : une coque, une mousse, une sangle. C'est fini."
    pourquoi_faux: "Une liste de pièces ne dit pas à quoi elles servent. Il faut **justifier** chaque partie par sa **fonction technique**."
    bonne_idee: "La coque rigide résiste au choc. La mousse amortit le choc et protège la tête. La sangle et sa boucle tiennent le casque sur la tête."
    jules: "Autre confusion : un composant, c'est une seule pièce ; un sous-ensemble, ce sont plusieurs pièces qui marchent ensemble. La sangle et sa boucle forment un petit sous-ensemble."

  - id: exemple-casserole
    type: exemple
    situation: "Chez Lucas, la casserole est en métal, mais son manche est en bois. Pourquoi ne pas l'avoir faite toute en métal ?"
    calcul: "Le métal laisse bien passer la chaleur : il chauffe vite l'eau des pâtes. Le bois laisse très peu passer la chaleur : le manche reste presque froid."
    conclusion: "Le **matériau** est choisi pour sa fonction : le métal pour chauffer, le bois pour **tenir sans se brûler**."
    jules: "Beaucoup de manches de casseroles sont aussi en plastique dur, pour la même raison. Une même fonction peut avoir plusieurs solutions techniques."

  - id: exemple-lampe
    type: exemple
    situation: "La lampe de poche de Zoé ne s'allume plus. En l'ouvrant, elle voit que le ressort est tordu et ne touche plus la pile. Pourquoi la lampe ne marche-t-elle plus ?"
    calcul: "Le ressort a pour fonction d'appuyer sur les piles et de faire passer le courant. S'il ne touche plus la pile, le chemin du courant est coupé, même si l'interrupteur est fermé."
    conclusion: "Une seule pièce qui ne fait plus sa **fonction technique** suffit à empêcher l'objet de faire sa **fonction d'usage** : éclairer."
    jules: "C'est pour cela que le croquis aide à réparer : en suivant le chemin sur le dessin, on trouve la pièce qui bloque."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : fais le croquis légendé de ta trousse ou de ta gourde. Pour chaque partie, écris un verbe qui dit sa fonction."
