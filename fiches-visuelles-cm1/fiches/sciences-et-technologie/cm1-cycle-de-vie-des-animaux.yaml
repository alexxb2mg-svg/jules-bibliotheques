notion: cm1-cycle-de-vie-des-animaux
titre: "De la fécondation à la naissance : ovipare ou vivipare ?"
matiere: sciences-et-technologie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de sciences et technologie du cycle 3, arrêté du 5-6-2026, BO n° 24 du 11/06/2026, p. 11", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-2-programme-de-sciences-et-technologie-du-cycle-3-517292.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: etapes
    type: formule
    expression: "[fécondation] → [embryon] → [éclosion] ou [naissance]"
    termes:
      "fécondation": {couleur: violet, legende: "la cellule du mâle (le **spermatozoïde**) s'unit à la cellule de la femelle (**l'ovule**) : c'est le tout début du petit"}
      "embryon": {couleur: orange, legende: "le futur petit, qui **se développe** : dans un œuf, ou dans le ventre de sa mère"}
      "éclosion": {couleur: vert, legende: "le petit sort de **l'œuf** : le poussin, le têtard"}
      "naissance": {couleur: bleu, legende: "le petit sort du **ventre de sa mère** : le chaton, le bébé"}
    jules: "N'oublie pas l'étape du milieu : entre la fécondation et la sortie du petit, **l'embryon** grandit pendant des jours, des semaines ou des mois."

  - id: carte
    type: carte
    noeuds:
      - {id: dev, titre: "Le développement d'un animal", sous_titre: "fécondation, embryon, puis sortie du petit", principal: true}
      - {id: ovipare, titre: "Ovipare", sous_titre: "l'embryon grandit dans un œuf pondu"}
      - {id: vivipare, titre: "Vivipare", sous_titre: "l'embryon grandit dans le ventre de sa mère"}
      - {id: interne, titre: "Fécondation interne", sous_titre: "dans le corps de la femelle : poule, chatte"}
      - {id: externe, titre: "Fécondation externe", sous_titre: "dehors, dans l'eau : grenouille, truite"}
    liens:
      - {de: dev, vers: ovipare}
      - {de: dev, vers: vivipare}
      - {de: dev, vers: interne}
      - {de: dev, vers: externe}
    jules: "« Ovi » vient d'un mot latin qui veut dire « œuf », et « vivi » de « vivant ». L'ovipare pond des œufs ; le vivipare met au monde des petits déjà vivants."

  - id: schema-frises
    type: schema
    titre: "De la fécondation au petit : la poule, la grenouille et la chatte"
    svg: "cm1-cycle-de-vie-des-animaux.svg"
    jules: "Regarde la colonne 1 : la poule et la chatte ont une fécondation **interne**, la grenouille une fécondation **externe**. Pourtant, la poule pond des œufs, comme la grenouille."

  - id: schema-tableau
    type: schema
    titre: "Fécondation interne ou externe, ovipare ou vivipare : le tableau à 4 cases"
    svg: "cm1-cycle-de-vie-des-animaux-tableau.svg"
    jules: "Une case reste vide : un vivipare a toujours une fécondation **interne**. Retiens aussi le dauphin : il vit dans l'eau, mais il est vivipare, comme la chatte."

  - id: methode
    type: methode
    etapes:
      - "Cherche où a lieu la **fécondation** : dans le corps de la femelle (interne) ou dehors, dans l'eau (externe)."
      - "Cherche où grandit **l'embryon** : dans un œuf pondu (ovipare) ou dans le ventre de sa mère (vivipare)."
      - "Regarde comment sort le petit : s'il sort de l'œuf, c'est une **éclosion** ; s'il sort du ventre de sa mère, c'est une **naissance**."
      - "Range l'animal dans le tableau à 4 cases. S'il tombe dans la case vide, tu t'es trompé quelque part : recommence."
    jules: "En sciences, on garde le mot **naissance** pour le petit qui sort du ventre de sa mère. Pour le poussin qui sort de l'œuf, on parle **d'éclosion**."

  - id: piege
    type: piege
    mauvaise_idee: "La poule pond des œufs, comme la grenouille. Donc, comme pour la grenouille, la fécondation se passe dehors."
    pourquoi_faux: "Les ovipares ne sont pas tous pareils. Chez la poule, la fécondation est **interne** : elle a lieu dans son corps, avant la ponte. Chez la grenouille, elle est **externe** : dans l'eau, au moment de la ponte."
    bonne_idee: "« Pond des œufs » dit seulement où grandit l'embryon. Pour la fécondation, on cherche à part : poule et tortue, interne ; grenouille et truite, externe."
    jules: "C'est pour ça que l'œuf de poule a une coquille dure : elle se forme autour de l'œuf déjà fécondé, dans le corps de la poule. Les œufs de grenouille, eux, n'ont pas de coquille."

  - id: exemple-poule
    type: exemple
    situation: "Chez sa grand-mère, Mila voit une poule couver ses œufs. 21 jours plus tard, des poussins cassent la coquille. La poule est-elle ovipare ou vivipare ? Sa fécondation est-elle interne ou externe ?"
    calcul: "Le coq a fécondé l'ovule dans le corps de la poule : fécondation interne. Puis l'embryon a grandi dans l'œuf pondu, pendant 21 jours. Enfin, le poussin est sorti de l'œuf : c'est une éclosion."
    conclusion: "La poule est **ovipare**, avec une **fécondation interne**."
    jules: "Les œufs du supermarché viennent souvent de poules qui vivent sans coq : ils ne sont pas fécondés, et aucun poussin ne peut en sortir."

  - id: exemple-chatte
    type: exemple
    situation: "La chatte de Rayan attend des petits. Environ 2 mois plus tard, elle met au monde 4 chatons, sans aucun œuf. Ovipare ou vivipare ?"
    calcul: "La fécondation a eu lieu dans le corps de la chatte : elle est interne. Les embryons ont grandi dans son ventre pendant environ 2 mois. Puis les chatons sont sortis du ventre : c'est une naissance."
    conclusion: "La chatte est **vivipare**, avec une **fécondation interne**, comme tous les vivipares."
    jules: "Toi aussi, tu es vivipare : tu as grandi environ 9 mois dans le ventre de ta mère avant ta naissance."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : place le canard, le lapin et le saumon dans le tableau à 4 cases. Réponses : canard, ovipare à fécondation interne ; lapin, vivipare à fécondation interne ; saumon, ovipare à fécondation externe."
