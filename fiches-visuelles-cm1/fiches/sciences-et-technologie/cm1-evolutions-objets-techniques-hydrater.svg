<g class="c-blue"><rect x="20" y="12" width="640" height="40" rx="8" stroke-width="0.8"/><text class="tl" x="340.0" y="32.0" text-anchor="middle" dominant-baseline="central">Le même besoin : boire (s'hydrater)</text></g>
<path d="M51 210 L55 140 Q51 118 63 104 L61 92 L83 92 L81 104 Q93 118 89 140 L93 210 Z" fill="#F4FAFD" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
