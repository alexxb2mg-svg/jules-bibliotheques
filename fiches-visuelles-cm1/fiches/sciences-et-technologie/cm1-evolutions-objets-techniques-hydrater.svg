<rect x="231.0" y="110.0" width="48.0" height="100.0" rx="14" fill="none" stroke="#0F6E56" stroke-width="1.8"/>
<rect x="389.0" y="96.0" width="72.0" height="114.0" rx="16" fill="#E8D7B5" stroke="#854F0B" stroke-width="1.8"/>
<path d="M403 98 C395 70 375 80 381 120 L387 150" fill="none" stroke="#854F0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="401.0" y="112.0" width="48.0" height="80.0" rx="10" fill="#BFD9F2" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M435 112 C445 80 469 80 475 100 L477 150" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
