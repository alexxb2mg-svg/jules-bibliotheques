<rect x="576.0" y="146.0" width="10.0" height="16.0" rx="2" fill="#F4FAFD" stroke="#5F5E5A" stroke-width="1.2"/>
<path d="M581 140 L581 146 M581 162 C581 190 545 180 545 206" fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="545.0" cy="208.0" r="4" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<g class="c-coral"><text class="tl" x="95" y="252" text-anchor="middle" dominant-baseline="central">à table</text></g>
<text x="95.0" y="282.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">un verre, une carafe</text>
<text class="t" x="95.0" y="310.0" text-anchor="middle" dominant-baseline="central">on se sert,</text>
<text class="t" x="95.0" y="329.0" text-anchor="middle" dominant-baseline="central">assis à table</text>
<g class="c-coral"><text class="tl" x="255" y="252" text-anchor="middle" dominant-baseline="central">à l'école</text></g>
<text x="255.0" y="282.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">une gourde</text>
<text class="t" x="255.0" y="310.0" text-anchor="middle" dominant-baseline="central">fermée, elle ne</text>
<text class="t" x="255.0" y="329.0" text-anchor="middle" dominant-baseline="central">coule pas dans le sac</text>
<g class="c-coral"><text class="tl" x="425" y="252" text-anchor="middle" dominant-baseline="central">en randonnée</text></g>
<text x="425.0" y="282.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">une poche à eau</text>
<text class="t" x="425.0" y="310.0" text-anchor="middle" dominant-baseline="central">on boit en marchant,</text>
<text class="t" x="425.0" y="329.0" text-anchor="middle" dominant-baseline="central">les mains libres</text>
<g class="c-coral"><text class="tl" x="585" y="252" text-anchor="middle" dominant-baseline="central">à l'hôpital</text></g>
<text x="585.0" y="282.0" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">une perfusion</text>
<text class="t" x="585.0" y="310.0" text-anchor="middle" dominant-baseline="central">le liquide entre dans</text>
<text class="t" x="585.0" y="329.0" text-anchor="middle" dominant-baseline="central">le sang par une veine</text>
<g class="c-gray"><rect x="20" y="356" width="640" height="52" rx="8" stroke-width="0.8"/><text class="t" x="340.0" y="372.5" text-anchor="middle" dominant-baseline="central">Le contexte change (le lieu, ce qu'on fait) : l'objet technique change aussi.</text><text class="t" x="340.0" y="391.5" text-anchor="middle" dominant-baseline="central">À l'hôpital, la personne malade ne peut pas toujours boire seule.</text></g>
</svg>
