<text class="ts" x="330.0" y="188.0" text-anchor="start" dominant-baseline="central">la recharge se glisse dans le corps</text>
<g class="c-blue"><text class="th" x="92" y="40" text-anchor="middle" dominant-baseline="central">bouchon</text><text class="t" x="92" y="60" text-anchor="middle" dominant-baseline="central">protège la pointe ;</text></g>
<line class="leader" x1="92" y1="94" x2="80" y2="124"/>
<g class="c-blue"><text class="th" x="310" y="40" text-anchor="middle" dominant-baseline="central">corps</text><text class="t" x="310" y="60" text-anchor="middle" dominant-baseline="central">on le tient ; il est</text></g>
<line class="leader" x1="310" y1="94" x2="310" y2="138"/>
<g class="c-blue"><text class="th" x="560" y="40" text-anchor="middle" dominant-baseline="central">bouchon arrière</text><text class="t" x="560" y="60" text-anchor="middle" dominant-baseline="central">ferme le corps</text></g>
<line class="leader" x1="560" y1="72" x2="511" y2="141"/>
<g class="c-blue"><text class="t" x="92" y="78" text-anchor="middle" dominant-baseline="central">s'accroche à la poche</text></g>
<g class="c-blue"><text class="t" x="310" y="78" text-anchor="middle" dominant-baseline="central">transparent : on voit l'encre</text></g>
<g class="c-purple"><text class="th" x="110" y="318" text-anchor="middle" dominant-baseline="central">bille</text><text class="t" x="110" y="338" text-anchor="middle" dominant-baseline="central">tourne et dépose</text><text class="t" x="110" y="356" text-anchor="middle" dominant-baseline="central">l'encre sur la feuille</text></g>
<line class="leader" x1="110" y1="306" x2="188" y2="255"/>
<g class="c-purple"><text class="th" x="262" y="318" text-anchor="middle" dominant-baseline="central">pointe</text><text class="t" x="262" y="338" text-anchor="middle" dominant-baseline="central">tient la bille</text></g>
<line class="leader" x1="262" y1="306" x2="214" y2="257"/>
<g class="c-purple"><text class="th" x="400" y="318" text-anchor="middle" dominant-baseline="central">tube d'encre</text><text class="t" x="400" y="338" text-anchor="middle" dominant-baseline="central">contient</text><text class="t" x="400" y="356" text-anchor="middle" dominant-baseline="central">l'encre</text></g>
<line class="leader" x1="400" y1="306" x2="360" y2="256"/>
<g class="c-purple"><text class="th" x="590" y="242" text-anchor="middle" dominant-baseline="central">la recharge :</text><text class="t" x="590" y="262" text-anchor="middle" dominant-baseline="central">un sous-ensemble</text></g>
<text class="ts" x="340.0" y="386.0" text-anchor="middle" dominant-baseline="central">Bleu : un composant tout seul. Violet : un sous-ensemble (plusieurs composants qui marchent ensemble).</text>
