<text class="t" x="340.0" y="304.0" text-anchor="middle" dominant-baseline="central">Vers le jour 29 ou 30 : de nouveau la nouvelle lune, et le cycle recommence.</text>
<text class="ts" x="340.0" y="322.0" text-anchor="middle" dominant-baseline="central">Dessins de ce qu'on voit depuis la France. En gras : les 4 phases principales.</text>
