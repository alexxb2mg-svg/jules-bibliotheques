notion: cm1-definir-un-ecosysteme
titre: "Un écosystème : des êtres vivants, leur milieu et leurs relations"
matiere: sciences-et-technologie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de sciences et technologie du cycle 3, arrêté du 5-6-2026, BO n° 24 du 11/06/2026, p. 11", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-2-programme-de-sciences-et-technologie-du-cycle-3-517292.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: definition
    type: formule
    expression: "[écosystème] = [êtres vivants] + [milieu de vie] + [relations]"
    termes:
      "écosystème": {couleur: violet, legende: "un morceau de nature qu'on étudie en entier : une mare, une haie, une forêt"}
      "êtres vivants": {couleur: vert, legende: "les animaux, les plantes, les champignons qui vivent là : toutes ces espèces, c'est la **biodiversité** du lieu"}
      "milieu de vie": {couleur: bleu, legende: "l'endroit et ce qu'on y mesure : **température**, lumière, humidité, pluie, altitude"}
      "relations": {couleur: orange, legende: "qui mange qui (la **prédation**), qui s'entraide (la **coopération**)"}
    jules: "Il faut les trois morceaux. Une liste d'animaux et de plantes toute seule, ce n'est pas encore un écosystème : c'est seulement la **biodiversité** du lieu."

  - id: carte
    type: carte
    noeuds:
      - {id: eco, titre: "La mare, un écosystème", sous_titre: "êtres vivants + milieu de vie + relations", principal: true}
      - {id: vivants, titre: "Les êtres vivants", sous_titre: "grenouille, libellule, héron, algues, roseaux"}
      - {id: milieu, titre: "Le milieu de vie", sous_titre: "eau à 14 °C, lumière du soleil, air humide, vase"}
      - {id: cooperation, titre: "La coopération", sous_titre: "deux espèces s'entraident : la fourmi et les pucerons"}
      - {id: predation, titre: "La prédation", sous_titre: "une espèce mange l'autre : le héron mange la grenouille"}
    liens:
      - {de: eco, vers: vivants}
      - {de: eco, vers: milieu}
      - {de: eco, vers: cooperation}
      - {de: eco, vers: predation}
    jules: "Dans « écosystème », il y a « éco », qui veut dire « maison » en grec. C'est la maison des êtres vivants, avec tous ceux qui l'habitent et tout ce qui s'y passe."

  - id: schema-mare
    type: schema
    titre: "L'écosystème de la mare : êtres vivants, milieu de vie et relations"
    svg: "cm1-definir-un-ecosysteme.svg"
    jules: "Les flèches orange vont de celui qui est mangé vers celui qui mange : le moustique est mangé par la libellule. Les étiquettes bleues ne sont pas vivantes, mais sans elles, personne ne pourrait vivre là."

  - id: schema-relations
    type: schema
    titre: "Coopération ou prédation : la fourmi, les pucerons et la coccinelle"
    svg: "cm1-definir-un-ecosysteme-relations.svg"
    jules: "Dans la **coopération**, les deux espèces gagnent quelque chose. Dans la **prédation**, une seule gagne : le prédateur, qui mange sa **proie**."

  - id: methode
    type: methode
    etapes:
      - "**Observe** le milieu et fais la liste des êtres vivants que tu vois : animaux et plantes."
      - "**Mesure** le milieu : la température (thermomètre), la lumière, l'humidité, la pluie tombée (pluviomètre)."
      - "**Relie** : pourquoi ces êtres vivants vivent-ils ici ? Cherche ce que ce milieu leur apporte."
      - "Cherche les **relations** entre espèces : qui mange qui (prédation), qui s'entraide (coopération)."
    jules: "Pour comparer deux endroits, fais les mêmes mesures, le même jour et à la même heure. Sinon, tu compares le matin et l'après-midi, pas les deux endroits."

  - id: piege
    type: piege
    mauvaise_idee: "Un écosystème, c'est la liste des animaux et des plantes qui vivent dans la mare."
    pourquoi_faux: "Il manque deux morceaux : le **milieu de vie** (l'eau, sa température, la lumière, la vase) et les **relations** entre les êtres vivants (qui mange qui, qui s'entraide)."
    bonne_idee: "L'écosystème de la mare, c'est : grenouilles, libellules, algues... + l'eau à 14 °C, la lumière, la vase + le héron qui mange la grenouille, la libellule qui mange le moustique."
    jules: "Pour ne pas confondre **coopération** et **prédation**, demande-toi si les deux espèces y gagnent : si oui, c'est une coopération ; si l'une mange l'autre, c'est une prédation."

  - id: exemple-haie
    type: exemple
    situation: "À 10 h, la classe de Léna mesure deux coins de l'école. Sous la haie : 16 °C, de l'ombre, un sol humide. Sur la pelouse au soleil : 24 °C, un sol sec. Sous la haie, ils trouvent 12 cloportes et 3 escargots ; sur la pelouse, aucun."
    calcul: "Les cloportes et les escargots ont besoin d'humidité : au soleil, leur corps se dessèche vite. Le coin de la haie, frais, sombre et humide, leur convient."
    conclusion: "La présence des êtres vivants dépend des **caractéristiques du milieu** : ici l'humidité, la lumière et la température."
    jules: "C'est ça, relier les êtres vivants à leur milieu : on ne trouve pas n'importe quel animal n'importe où."

  - id: exemple-rosier
    type: exemple
    situation: "Sur le rosier de la cour, Sacha voit des fourmis qui montent et descendent au milieu de pucerons verts. Les fourmis boivent un jus sucré que font les pucerons, et chassent les coccinelles."
    calcul: "La fourmi gagne de la nourriture : le miellat. Les pucerons gagnent une protection contre les coccinelles, qui les mangent."
    conclusion: "Entre les fourmis et les pucerons : **coopération**. Entre les coccinelles et les pucerons : **prédation**."
    jules: "Les jardiniers le savent : pour débarrasser un rosier de ses pucerons, on peut y poser des coccinelles et empêcher les fourmis de grimper."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : choisis un coin de ton école ou de ton jardin. Note trois êtres vivants, deux mesures du milieu et une relation entre deux espèces : tu viens de décrire un écosystème !"
