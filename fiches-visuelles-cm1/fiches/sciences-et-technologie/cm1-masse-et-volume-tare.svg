<text class="t" x="340.0" y="322.0" text-anchor="middle" dominant-baseline="central">Sans bouton TARE : on pèse deux fois, puis on soustrait.</text>
<text x="340.0" y="352.0" font-size="20" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">bol plein 420 g  −  bol vide 150 g  =  farine 270 g</text>
