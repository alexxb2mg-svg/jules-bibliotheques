<g class="c-blue"><text class="t" x="448" y="86.0" text-anchor="start" dominant-baseline="central">on grandit et on grossit vite</text></g>
<circle cx="432.0" cy="108.0" r="9" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<text class="ts" x="432.0" y="108.5" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-weight="700">2</text>
<g class="c-blue"><text class="t" x="448" y="108.0" text-anchor="start" dominant-baseline="central">des poils sous les bras</text></g>
