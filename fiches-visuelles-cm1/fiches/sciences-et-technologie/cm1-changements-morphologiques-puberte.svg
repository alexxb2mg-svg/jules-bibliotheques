<g class="c-blue"><text class="t" x="448" y="130.0" text-anchor="start" dominant-baseline="central">des poils au pubis ;</text></g>
<g class="c-blue"><text class="t" x="448" y="152.0" text-anchor="start" dominant-baseline="central">les organes génitaux</text></g>
<g class="c-blue"><text class="t" x="448" y="174.0" text-anchor="start" dominant-baseline="central">externes grandissent</text></g>
