notion: cm1-evolutions-objets-techniques
titre: "Un même besoin, des objets qui changent selon l'époque et le lieu"
matiere: sciences-et-technologie
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme de sciences et technologie du cycle 3, arrêté du 5-6-2026, BO n° 24 du 11/06/2026, p. 17", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-2-programme-de-sciences-et-technologie-du-cycle-3-517292.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: relation
    type: formule
    expression: "[un besoin] + [un contexte] → [un objet technique]"
    termes:
      "un besoin": {couleur: bleu, legende: "ce que les gens veulent faire : s'éclairer, boire, se déplacer. Le **besoin** reste le même."}
      "un contexte": {couleur: orange, legende: "l'époque, le lieu, l'argent, la culture, les techniques connues, le respect de la planète : le **contexte** change."}
      "un objet technique": {couleur: vert, legende: "un objet fabriqué par l'être humain pour répondre au besoin : la **réponse** change avec le contexte."}
    jules: "Un objet technique, c'est un objet inventé et fabriqué par des humains : une lampe, un vélo, une gourde. Un caillou ou une pomme ne sont pas des objets techniques."

  - id: carte
    type: carte
    noeuds:
      - {id: evoluer, titre: "Un objet évolue", sous_titre: "sa forme, ses matériaux, son énergie changent", principal: true}
      - {id: besoin, titre: "Le besoin reste", sous_titre: "s'éclairer, boire, se déplacer : on garde le même"}
      - {id: contextes, titre: "Les contextes", sous_titre: "époque, lieu, argent, culture, techniques, planète"}
      - {id: comparer, titre: "Comparer", sous_titre: "les matériaux, la forme, l'énergie, l'usage"}
      - {id: hydrater, titre: "Même besoin, lieux différents", sous_titre: "verre à table, gourde à l'école, perfusion à l'hôpital"}
    liens:
      - {de: evoluer, vers: besoin}
      - {de: evoluer, vers: contextes}
      - {de: evoluer, vers: comparer}
      - {de: evoluer, vers: hydrater}
    jules: "Pour voir une évolution, on compare deux objets qui font le même travail. Une bougie et une lampe LED, oui ; une bougie et une trottinette, non."

  - id: schema-lampe
    type: schema
    titre: "La lampe au fil du temps : même besoin, solutions différentes"
    svg: "cm1-evolutions-objets-techniques.svg"
    jules: "Une ampoule à filament transforme la plus grande partie de l'électricité en chaleur : touche-la allumée et tu te brûles. La LED chauffe bien moins, c'est pour cela qu'elle consomme peu : c'est le contexte du **développement durable**."

  - id: schema-hydrater
    type: schema
    titre: "S'hydrater : un même besoin, quatre objets selon le contexte"
    svg: "cm1-evolutions-objets-techniques-hydrater.svg"
    jules: "Ici, ce n'est pas l'époque qui change, c'est la situation : le lieu et ce qu'on est en train de faire. Les quatre objets existent en même temps, aujourd'hui."

  - id: methode
    type: methode
    etapes:
      - "Choisis un **besoin** et écris-le en haut : par exemple « s'éclairer la nuit »."
      - "Trouve deux objets qui répondent à ce besoin, à deux époques ou dans deux lieux différents."
      - "Compare-les point par point : les **matériaux**, la forme, l'énergie utilisée, la façon de s'en servir."
      - "Explique le changement par le **contexte** : une invention nouvelle, un autre pays, le prix, la protection de la planète."
    jules: "Un tableau à deux colonnes aide beaucoup : une colonne par objet, une ligne par point comparé. Les différences sautent aux yeux."

  - id: piege
    type: piege
    mauvaise_idee: "Pour étudier l'évolution de l'éclairage, je compare une vieille lampe à pétrole et un radiateur électrique tout neuf."
    pourquoi_faux: "Le radiateur sert à chauffer, pas à éclairer. Les deux objets ne répondent pas au **même besoin** : on ne peut pas voir d'évolution."
    bonne_idee: "On compare une lampe à pétrole et une lampe LED : même besoin (s'éclairer), mais le pétrole brûle alors que la LED marche à l'électricité, sans flamme ni fumée."
    jules: "Autre oubli fréquent : ne pas dire le contexte de chaque objet. Écris toujours à côté de l'objet quand ou où il est utilisé."

  - id: exemple-train
    type: exemple
    situation: "Le grand-père de Rayan lui montre une photo d'un train à vapeur des années 1900. Rayan, lui, prend le TGV pour aller voir sa tante. Qu'est-ce qui a changé, et pourquoi ?"
    calcul: "Le besoin est le même : voyager loin avec beaucoup de passagers. Le train à vapeur brûle du charbon pour faire de la vapeur. Le TGV roule à l'électricité, jusqu'à 300 km/h, sur des voies spéciales."
    conclusion: "L'**énergie**, la vitesse et le confort ont changé : c'est une évolution dans un contexte **historique** et **technologique**."
    jules: "Le premier TGV a transporté des voyageurs en 1981, entre Paris et Lyon. Pense à un objet que tes grands-parents utilisaient : lequel l'a remplacé chez toi ?"

  - id: exemple-cantine
    type: exemple
    situation: "À la cantine, Emma mange son riz avec une fourchette. Au Japon, Kenji mange le sien avec des baguettes. Est-ce que l'un des deux fait mieux que l'autre ?"
    calcul: "Le besoin est le même : porter la nourriture à la bouche. Les deux objets y répondent très bien. Ce qui change, c'est l'habitude du pays."
    conclusion: "Aucun n'est « mieux » : ce sont deux **réponses** au même besoin, dans deux contextes **géographique** et **culturel** différents."
    jules: "Une évolution n'est pas toujours un progrès pour tout le monde. On compare pour comprendre, pas pour dire que les autres ont tort."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : fais la frise d'un autre objet, par exemple pour écouter de la musique ou pour écrire. Écris le besoin en haut, puis dessine au moins trois objets dans l'ordre."
