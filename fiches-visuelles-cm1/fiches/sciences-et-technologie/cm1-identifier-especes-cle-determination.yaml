    jules: "Une clé de détermination, c'est comme le jeu « Qui est-ce ? » : chaque question élimine une partie des animaux, jusqu'à ce qu'il n'en reste plus qu'un."

  - id: schema-cle
    type: schema
    titre: "Une clé de détermination pour les petites bêtes du jardin"
    svg: "cm1-identifier-especes-cle-determination.svg"
    jules: "Pour répondre, compte les pattes avec la pointe de ton crayon, sans deviner. Attention, une clé ne marche que pour les êtres vivants qu'elle contient : avec un papillon (6 pattes, pas de carapace à points), celle-ci te dirait « fourmi » !"

  - id: schema-appli
    type: schema
    titre: "Observer d'abord, puis comparer avec une application"
    svg: "cm1-identifier-especes-cle-determination-appli.svg"
    jules: "L'application ne voit qu'une photo : un reflet ou un flou peut la tromper. C'est **ton observation** qui permet de choisir le bon nom parmi ses propositions."

  - id: methode
    type: methode
    etapes:
      - "**Observe** l'être vivant, avec une loupe si tu peux : compte ses pattes, regarde sa forme, sa couleur, sa taille."
      - "Lis la **première question** de la clé. Réponds « oui » ou « non » en regardant ton animal, pas en devinant."
      - "Suis la flèche de ta réponse jusqu'à la question suivante. Continue jusqu'à arriver à un **nom**."
      - "Si tu peux, **vérifie** avec une application : elle propose plusieurs noms. Garde celui qui correspond à ce que tu as observé."
    jules: "Si tu arrives à un nom qui ne ressemble pas du tout à ton animal, remonte d'une question : tu as sûrement mal compté ou mal regardé quelque chose."

  - id: piege
    type: piege
    mauvaise_idee: "Pas besoin d'observer : je prends une photo, et l'application me donne le nom, c'est sûr."
    pourquoi_faux: "L'application ne donne pas une réponse sûre : elle propose **plusieurs noms possibles**, classés du plus probable au moins probable. Pour choisir le bon, il faut avoir observé soi-même."
    bonne_idee: "J'observe et je suis la clé d'abord. Ensuite, je compare avec l'appli : si elle propose « coccinelle à 7 points » et « coccinelle à 2 points », je compte les points pour choisir."
    jules: "Autre confusion : **classer** et **identifier**. Mettre ensemble tous les animaux à 6 pattes, c'est classer ; trouver que cette petite bête grise s'appelle « cloporte », c'est identifier."

  - id: exemple-cloporte
    type: exemple
    situation: "En soulevant une pierre dans le jardin de l'école, Nour découvre une petite bête grise, toute plate. Elle la met dans une boîte-loupe et compte ses pattes : il y en a 14. Quel est son nom ?"
    calcul: "Avec la clé : « A-t-il des pattes ? » oui. « A-t-il 6 pattes ? » non, il en a 14. « A-t-il 8 pattes ? » non plus. La flèche « non » mène à un nom."
    conclusion: "C'est un **cloporte**. Nour a trouvé son nom grâce à son observation (14 pattes) et aux questions de la clé."
    jules: "Le cloporte n'est ni un insecte (6 pattes), ni une araignée (8 pattes). Il aime les coins sombres et humides : c'est pour ça qu'on le trouve sous les pierres."

  - id: exemple-paquerette
    type: exemple
    situation: "Hugo photographie une petite fleur blanche et jaune dans la pelouse de la cour. L'application propose deux noms : pâquerette (très probable) et marguerite (possible). Laquelle est-ce ?"
    calcul: "Hugo observe : la fleur mesure à peine 2 cm, et toutes ses feuilles sont posées au ras du sol, en rond. La marguerite, elle, est bien plus grande, avec des feuilles le long de sa tige."
    conclusion: "C'est une **pâquerette**. L'application a aidé, mais c'est l'observation de Hugo qui a permis de **valider** le nom."
    jules: "Sur une photo prise de près, on ne voit pas la taille : pâquerette et marguerite se ressemblent beaucoup. Pose ta gomme à côté de la fleur avant de la photographier."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : invente ta propre clé pour 4 objets de ta trousse (gomme, crayon, règle, taille-crayon), avec des questions « oui ou non ». Fais-la essayer à un camarade !"
