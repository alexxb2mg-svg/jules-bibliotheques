relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: vivant, titre: "Classer le vivant", sous_titre: "ranger les êtres vivants selon ce qu'ils ont en commun", principal: true}
      - {id: espece, titre: "Une espèce", sous_titre: "des individus qui peuvent avoir ensemble des petits, eux-mêmes capables d'avoir des petits"}
      - {id: attributs, titre: "Des attributs", sous_titre: "ce qu'on voit et que l'animal possède : des os, 4 membres, des poils, des plumes"}
      - {id: boites, titre: "Des boîtes emboîtées", sous_titre: "chaque boîte regroupe ceux qui partagent un même attribut"}
      - {id: parente, titre: "Les liens de parenté", sous_titre: "plus on partage de boîtes, plus on est proches parents"}
    liens:
      - {de: vivant, vers: espece}
      - {de: vivant, vers: attributs}
      - {de: vivant, vers: boites}
      - {de: vivant, vers: parente}
    jules: "Le mot savant pour une espèce est « interféconds » : les individus peuvent se reproduire entre eux, et leurs petits aussi. Un attribut, c'est un caractère que l'on peut observer : « a des plumes », « a des os »."

  - id: schema-espece
    type: schema
    titre: "Même espèce ou pas : les petits pourront-ils avoir des petits ?"
    svg: "cm1-espece-et-classification-emboitee.svg"
    jules: "Stérile veut dire « qui ne peut pas avoir de petits ». La mule, née d'un âne et d'une jument, est presque toujours stérile : le cheval et l'âne sont donc deux espèces différentes."

  - id: schema-boites
    type: schema
    titre: "Les boîtes emboîtées : ce que les animaux ont en commun"
    svg: "cm1-espece-et-classification-emboitee-boites.svg"
    jules: "Le chat et le pigeon sont ensemble dans 3 boîtes : yeux et bouche, os, 4 membres. Le chat et la truite n'en partagent que 2. Le chat est donc plus proche parent du **pigeon** que de la truite."

  - id: methode
    type: methode
    etapes:
      - "Observe chaque animal et fais la liste de ses **attributs** : ce qu'il a, et qu'on peut voir (des os, des membres, des poils, des plumes)."
      - "Cherche l'attribut que **tous** partagent : c'est la plus grande boîte."
      - "Dans cette boîte, trace une boîte plus petite pour ceux qui partagent un autre attribut. Recommence jusqu'à ce que chaque animal soit rangé."
      - "Lis les liens de parenté : deux animaux enfermés ensemble dans une **petite boîte** sont plus proches parents."
    jules: "On range seulement selon ce que les animaux ont, jamais selon ce qu'ils n'ont pas. Une boîte « n'a pas de poils » ne veut rien dire : l'escargot et le pigeon n'ont pas de poils, et pourtant ils n'ont presque rien en commun."

  - id: piege
    type: piege
    mauvaise_idee: "Le chihuahua et le berger allemand ne se ressemblent pas du tout : ce sont deux espèces différentes."
    pourquoi_faux: "Une **espèce** ne se reconnaît pas à l'aspect. Ce qui compte, c'est de pouvoir avoir des petits ensemble, qui pourront à leur tour avoir des petits."
    bonne_idee: "Un chihuahua et un berger peuvent avoir des chiots, et ces chiots pourront avoir des chiots : ce sont des chiens, **une seule espèce**."
    jules: "Le piège marche aussi dans l'autre sens : le cheval et l'âne se ressemblent beaucoup, mais ce sont deux espèces, car la mule ne peut pas avoir de petits."

  - id: exemple-souris
    type: exemple
    situation: "Nina étudie une souris, un moineau et une truite. Qui est le plus proche parent de la souris : le moineau ou la truite ?"
    calcul: "Tous ont des yeux, une bouche et des os. La souris et le moineau ont en plus 4 membres (pour le moineau, 2 pattes et 2 ailes). La truite n'a pas de membres, mais des nageoires. La souris partage donc 3 attributs avec le moineau, et 2 seulement avec la truite."
    conclusion: "La souris et le moineau sont dans la même boîte « 4 membres » : le **moineau** est le plus proche parent de la souris."
    jules: "Ce n'est pas l'endroit où ils vivent qui compte : la souris ne vole pas comme le moineau. Ce qui compte, ce sont les attributs qu'ils possèdent tous les deux."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : ajoute une grenouille dans les boîtes. Elle a des os et 4 membres, mais ni plumes ni poils : elle va dans la boîte « 4 membres », à côté du lézard."
