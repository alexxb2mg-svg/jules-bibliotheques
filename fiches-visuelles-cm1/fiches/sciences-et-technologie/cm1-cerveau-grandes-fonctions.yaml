    jules: "Ton cerveau ne s'arrête jamais, même quand tu dors : c'est lui qui fabrique tes **rêves**."

  - id: schema-trajet
    type: schema
    titre: "Recevoir, traiter, commander : le trajet d'un message dans le corps"
    svg: "cm1-cerveau-grandes-fonctions.svg"
    jules: "Tout cela se passe en une fraction de seconde. Les **nerfs** sont comme des fils qui relient le cerveau à tout le corps : ils portent les messages dans les deux sens."

  - id: schema-zones
    type: schema
    titre: "Quelques zones du cerveau et leur travail (vu de côté)"
    svg: "cm1-cerveau-grandes-fonctions-zones.svg"
    jules: "Chaque zone a son travail, mais elles travaillent ensemble. Pour apprendre, te souvenir ou avoir peur, plusieurs parties du cerveau s'activent en même temps."

  - id: schema-illusion
    type: schema
    titre: "L'illusion des deux traits : ce que je vois et ce que mesure la règle"
    svg: "cm1-cerveau-grandes-fonctions-illusion.svg"
    jules: "Tes yeux voient bien les traits : c'est ton **cerveau** qui interprète les chevrons et se trompe. Même quand on sait que c'est une illusion, on continue de la voir !"

  - id: methode
    type: methode
    etapes:
      - "Pour te **concentrer** : range ce qui te distrait (écran, jouet) et fais une seule chose à la fois."
      - "Pour retenir une information quelques secondes (un numéro à recopier), répète-la dans ta tête : c'est la **mémoire à court terme**."
      - "Pour la garder longtemps, **revois-la plusieurs fois** : le soir même, le lendemain, puis quelques jours plus tard."
      - "Explique-la à quelqu'un ou fais-en un dessin : ton cerveau la range mieux. Et dors bien : le **sommeil** aide à garder les souvenirs."
    jules: "Relire une seule fois la veille marche beaucoup moins bien que revoir un peu, plusieurs jours de suite. Essaie avec ta prochaine leçon !"

  - id: piege
    type: piege
    mauvaise_idee: "Le cerveau, ça sert seulement à réfléchir, par exemple pour faire les calculs en classe."
    pourquoi_faux: "Le cerveau travaille tout le temps : il reçoit ce que tu **perçois**, il **commande** tes muscles, il te fait parler, il fabrique tes **émotions** et tes rêves."
    bonne_idee: "Quand tu joues au ballon, ton cerveau voit le ballon, décide et commande ton bras. Quand tu as peur, ou quand tu rêves, c'est encore lui qui travaille."
    jules: "Autre piège : croire que ce qu'on voit est toujours vrai. L'illusion des deux traits montre que le cerveau peut se tromper."

  - id: exemple-illusion
    type: exemple
    situation: "Jade montre l'illusion des deux traits à Malo. Malo est sûr que le trait A est plus long que le trait B. Jade pose sa règle sur chaque trait : les deux mesurent 6 cm."
    calcul: "Ce que Malo perçoit : A est plus long que B. Ce que mesure la règle : 6 cm pour A, 6 cm pour B, la même longueur."
    conclusion: "Notre **perception** du monde peut être **différente de la réalité** : on vérifie avec un instrument de mesure."
    jules: "Montre-la à plusieurs camarades : presque tous voient le trait A plus long. Ce n'est pas une question de bons yeux, c'est la façon dont le cerveau fonctionne."

  - id: exemple-dictee
    type: exemple
    situation: "Pour la dictée de vendredi, Yanis lit ses 10 mots une seule fois, le matin même. Ambre relit les siens 5 minutes chaque soir, trois soirs de suite. Qui en retiendra le plus ?"
    calcul: "Yanis a gardé les mots peu de temps, dans sa mémoire à court terme : elle oublie vite. Ambre les a revus plusieurs fois, avec une nuit de sommeil entre chaque fois."
    conclusion: "Ambre en retiendra le plus : ses mots sont passés dans sa **mémoire à long terme**."
    jules: "La mémoire à court terme, c'est comme un mot griffonné sur ta main : pratique, mais il s'efface vite. La mémoire à long terme, c'est comme un classeur bien rangé."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine l'illusion des deux traits sur ton cahier et montre-la à ta famille. Ensuite, mesure les deux traits devant eux avec ta règle."
