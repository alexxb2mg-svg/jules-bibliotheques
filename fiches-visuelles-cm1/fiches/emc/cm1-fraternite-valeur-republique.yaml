notion: cm1-fraternite-valeur-republique
titre: "La fraternité : la troisième valeur de la devise, de l'entraide au débat"
matiere: emc
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'enseignement moral et civique, arrêté du 29-5-2024, BO n° 24 du 13/06/2024, p. 12", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20d%E2%80%99enseignement%20moral%20et%20civique%20du%20cours%20pr%C3%A9paratoire%20%C3%A0%20la%20classe%20terminale%20des%20voies%20g%C3%A9n%C3%A9rale%2C%20technologique%20et%20professionnelle%20et%20des%20classes%20pr%C3%A9parant%20au%20CAP-402159.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: devise
    type: formule
    expression: "[Liberté], [Égalité], [Fraternité]"
    termes:
      Liberté: {couleur: bleu, legende: "**penser, parler**, agir librement, en respectant les autres et la loi"}
      Égalité: {couleur: bleu, legende: "les **mêmes droits** et la même loi pour tous"}
      Fraternité: {couleur: vert, legende: "voir les autres comme des membres d'une **même communauté**, et s'entraider"}
    jules: "Le mot vient de « frère » : la fraternité, c'est se traiter un peu comme une grande famille. Pas besoin d'être amis pour s'entraider."

  - id: carte
    type: carte
    noeuds:
      - {id: fraternite, titre: "La fraternité", sous_titre: "une valeur et un principe de la République", principal: true}
      - {id: devise, titre: "Dans la devise", sous_titre: "Liberté, Égalité, Fraternité"}
      - {id: entraide, titre: "S'entraider", sous_titre: "aider un camarade, partager, accueillir un nouveau"}
      - {id: debat, titre: "Débattre sans blesser", sous_titre: "donner son avis en pensant à ce que ressentent les autres"}
      - {id: symboles, titre: "Les symboles", sous_titre: "drapeau, Marianne, Marseillaise, 14 Juillet"}
    liens:
      - {de: fraternite, vers: devise}
      - {de: fraternite, vers: entraide}
      - {de: fraternite, vers: debat}
      - {de: fraternite, vers: symboles}
    jules: "Une valeur, c'est une idée à laquelle on tient. Un principe, c'est une règle qui guide la République : la fraternité est les deux à la fois."

  - id: schema-symboles
    type: schema
    titre: "La devise et les symboles de la République"
    svg: "cm1-fraternite-valeur-republique.svg"
    jules: "Regarde la façade de ton école ou de ta mairie : la devise y est souvent gravée, avec le drapeau tricolore. Le 14 Juillet, c'est la fête nationale."

  - id: schema-debat
    type: schema
    titre: "Un débat réglé : donner son avis sans blesser"
    svg: "cm1-fraternite-valeur-republique-debat.svg"
    jules: "Dans la bulle rouge, l'élève s'attaque à la personne, pas à l'idée. Dans les vertes, chacun peut être en désaccord tout en restant respectueux."

  - id: methode
    type: methode
    etapes:
      - "Retiens la **devise** dans l'ordre : Liberté, Égalité, Fraternité. La fraternité est le troisième mot."
      - "Pour reconnaître la **fraternité**, cherche l'**entraide** : quelqu'un aide un autre sans y être obligé, parce qu'ils font partie du même groupe."
      - "Dans un **débat réglé** : lève la main, attends ton tour, écoute jusqu'au bout."
      - "Pour donner ton avis, dis « je pense que… parce que… », et parle de l'idée, jamais de la personne."
    jules: "Pour nuancer, garde en poche quelques petits mots : « peut-être », « parfois », « dans certains cas ». Ils rendent ton avis plus juste et moins blessant."

  - id: piege
    type: piege
    mauvaise_idee: "Dans un débat, il faut gagner : parler plus fort que les autres et montrer qu'ils ont tort."
    pourquoi_faux: "Un **débat réglé** n'est pas un match. On y apprend à **nuancer** et à écouter. Si on blesse les autres, ils n'osent plus parler, et le débat s'arrête."
    bonne_idee: "On donne son avis avec des raisons, on écoute, et on peut même changer d'avis : c'est la **fraternité** en action."
    jules: "Autre oubli fréquent : la fraternité fait bien partie de la devise, avec la liberté et l'égalité. Trois mots, dans cet ordre, sur toutes les mairies."

  - id: exemple-nouveau
    type: exemple
    situation: "En janvier, Amir arrive dans la classe. Il vient d'une autre ville et ne connaît personne. À la cantine, Clara et Enzo lui gardent une place et lui expliquent les jeux de la cour."
    calcul: "Clara et Enzo ne sont pas obligés de le faire. Ils considèrent Amir comme un membre de la classe, et ils l'aident à trouver sa place."
    conclusion: "C'est de la **fraternité** : de l'**entraide** entre les membres d'une même communauté."
    jules: "Être nouveau, c'est souvent être un peu perdu. Un simple « viens avec nous » peut changer toute la première semaine d'Amir."

  - id: exemple-debat
    type: exemple
    situation: "Débat en classe : « Faut-il des jeux de ballon dans la cour ? » Zoé pense que non : elle a reçu un ballon au visage. Lucas pense que oui. Il dit : « Je comprends que tu aies eu mal. Mais on pourrait faire une zone pour le ballon. »"
    calcul: "Lucas donne son avis (oui), mais il tient compte de ce qu'a vécu Zoé. Et il propose une solution qui convient à tout le monde."
    conclusion: "Lucas **nuance** son propos et respecte la sensibilité de Zoé : il met en pratique la **fraternité** dans un débat."
    jules: "Lucas ne dit pas « t'as qu'à faire attention ». Il reconnaît d'abord ce que Zoé a ressenti, puis il donne son idée."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Au prochain débat en classe, essaie de commencer une phrase par « Je comprends ton idée, mais… ». Tu verras que les autres t'écoutent mieux."
