<text class="t" x="170.0" y="351.5" text-anchor="middle" dominant-baseline="central">les mairies et les écoles.</text>
<text class="tl" x="24.0" y="396.0" fill="#185FA5" text-anchor="start" dominant-baseline="central">Liberté</text>
<text class="t" x="138.0" y="396.0" text-anchor="start" dominant-baseline="central">penser et parler librement</text>
<text class="tl" x="24.0" y="422.0" fill="#185FA5" text-anchor="start" dominant-baseline="central">Égalité</text>
<text class="t" x="138.0" y="422.0" text-anchor="start" dominant-baseline="central">les mêmes droits pour tous</text>
<text class="tl" x="24.0" y="448.0" fill="#2F6B12" text-anchor="start" dominant-baseline="central">Fraternité</text>
<text class="t" x="138.0" y="448.0" text-anchor="start" dominant-baseline="central">s'entraider entre tous</text>
