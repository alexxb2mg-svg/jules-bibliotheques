notion: cm1-civisme-action-bien-public
titre: "Le civisme : agir pour le bien de tous, en respectant les règles"
matiere: emc
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'enseignement moral et civique, arrêté du 29-5-2024, BO n° 24 du 13/06/2024, p. 11", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20d%E2%80%99enseignement%20moral%20et%20civique%20du%20cours%20pr%C3%A9paratoire%20%C3%A0%20la%20classe%20terminale%20des%20voies%20g%C3%A9n%C3%A9rale%2C%20technologique%20et%20professionnelle%20et%20des%20classes%20pr%C3%A9parant%20au%20CAP-402159.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  ENT: "espace numérique de travail : le site de la classe, où l'on trouve les devoirs et les messages"
blocs:
  - id: definition
    type: formule
    expression: "[civisme] = agir pour [le bien public] + respecter [les règles]"
    termes:
      civisme: {couleur: vert, legende: "ce que fait une personne pour que la **vie en commun** se passe bien, pour tous"}
      le bien public: {couleur: bleu, legende: "ce qui est **utile à tous** : une cour propre, un parc en bon état, une bibliothèque calme"}
      les règles: {couleur: orange, legende: "celles de la classe, de l'école, de la rue, et aussi la **loi** : elles valent pour tous"}
    jules: "Il faut les deux en même temps. Ramasser un papier dans la cour, c'est utile à tous, et c'est la règle : c'est un geste civique."

  - id: carte
    type: carte
    noeuds:
      - {id: civisme, titre: "Le civisme", sous_titre: "agir pour tous, dans le respect des règles", principal: true}
      - {id: classe, titre: "Dans la classe", sous_titre: "ranger le matériel commun, laisser parler les autres"}
      - {id: ecole, titre: "À l'école et dans la rue", sous_titre: "garder la cour propre, ne pas abîmer les bancs"}
      - {id: ligne, titre: "En ligne", sous_titre: "écrire des messages respectueux"}
      - {id: planete, titre: "Pour l'environnement", sous_titre: "trier, éteindre la lumière, ne pas gaspiller l'eau"}
    liens:
      - {de: civisme, vers: classe}
      - {de: civisme, vers: ecole}
      - {de: civisme, vers: ligne}
      - {de: civisme, vers: planete}
    jules: "Le civisme n'est pas un exploit : ce sont surtout des petits gestes de tous les jours. Si chacun en fait un, tout le monde en profite."

  - id: schema-commune
    type: schema
    titre: "Les biens publics de la commune : gratuits pour toi, payés par tous"
    svg: "cm1-civisme-action-bien-public.svg"
    jules: "Un **bien public** n'appartient pas à une seule personne : il est à la commune, donc un peu à chacun de ses habitants. L'abîmer, c'est abîmer quelque chose qui est aussi à toi."

  - id: schema-gestes
    type: schema
    titre: "Des petits gestes civiques partout : classe, cour, parc, en ligne, planète"
    svg: "cm1-civisme-action-bien-public-gestes.svg"
    jules: "Regarde la dernière case : ce test marche pour n'importe quel geste. Deux fois oui, et c'est du **civisme**."

  - id: methode
    type: methode
    etapes:
      - "Regarde **à qui profite** l'action : à une seule personne, ou à tout le monde (la classe, l'école, les habitants) ?"
      - "Vérifie qu'elle **respecte les règles** communes : celles de la classe, de l'école, de la rue."
      - "Si c'est **oui aux deux**, c'est un geste civique. S'il manque l'un des deux, ce n'en est pas un."
    jules: "Prendre le dernier ballon pour jouer seul, c'est permis, mais ça ne profite qu'à toi. Le rapporter dans le bac à la fin de la récré, pour que les autres le trouvent, c'est civique."

  - id: piege
    type: piege
    mauvaise_idee: "Dire « bonjour » et « merci » à la dame de la cantine, c'est ça, le civisme."
    pourquoi_faux: "C'est de la **politesse** : c'est très bien, mais ça concerne surtout la personne à qui tu parles. Le **civisme**, c'est agir pour ce qui sert à tous."
    bonne_idee: "Débarrasser son plateau et ne pas gaspiller le pain, pour que la cantine reste propre pour les suivants : ça, c'est du **civisme**."
    jules: "Autre erreur : croire qu'il faut faire une grande action. Fermer un robinet qui coule dans les toilettes de l'école, c'est déjà du civisme."

  - id: exemple-cour
    type: exemple
    situation: "À la fin de la récré, Yanis voit trois papiers de goûter par terre, près du banc. Ce n'est pas lui qui les a jetés. Il les ramasse et les met à la poubelle. Est-ce du civisme ?"
    calcul: "À qui ça profite ? À tous les élèves qui jouent dans la cour. Est-ce que ça respecte les règles ? Oui : les déchets vont à la poubelle."
    conclusion: "Oui, c'est un geste **civique** : Yanis agit pour le **bien public**, sans y être obligé."
    jules: "Personne ne l'a vu faire, et ce n'est pas grave. Le civisme ne sert pas à être félicité : il sert à ce que la cour soit agréable pour tous."

  - id: exemple-parc
    type: exemple
    situation: "Samedi, au parc de la commune, Lila et Mehdi voient qu'une balançoire est cassée : la chaîne pend. Mehdi dit : « On s'en fiche, on va au toboggan. » Lila prévient son père, qui appelle la mairie. Qui agit avec civisme ?"
    calcul: "La balançoire est un **bien public** : elle sert à tous les enfants de la commune. Prévenir la mairie, c'est permettre qu'on la répare, et éviter qu'un petit se blesse."
    conclusion: "C'est **Lila** qui agit avec civisme. Mehdi ne fait rien de mal, mais il ne pense qu'à son jeu à lui."
    jules: "Prévenir un adulte quand quelque chose de commun est cassé ou dangereux, c'est un vrai geste civique. Tu n'as pas besoin de réparer toi-même."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi de la semaine : repère un petit geste civique par jour, à l'école ou dans ta rue. Passe-le au test des deux questions : utile à tous, et dans les règles ?"
