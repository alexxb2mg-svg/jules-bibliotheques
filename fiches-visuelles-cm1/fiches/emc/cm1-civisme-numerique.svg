<text class="ts" x="366.0" y="302.0" text-anchor="start" dominant-baseline="central">Joueur inconnu</text>
<rect x="362.0" y="316.0" width="114.3" height="27.5" rx="9" fill="#FDE4E1" stroke="#B42318" stroke-width="1.2"/>
<text class="t" x="371.0" y="329.7" text-anchor="start" dominant-baseline="central">T'habites où ?</text>
<rect x="362.0" y="349.5" width="81.6" height="45.0" rx="9" fill="#FDE4E1" stroke="#B42318" stroke-width="1.2"/>
<text class="t" x="371.0" y="363.2" text-anchor="start" dominant-baseline="central">Envoie ta</text>
<text class="t" x="371.0" y="380.7" text-anchor="start" dominant-baseline="central">photo !</text>
<circle cx="507.0" cy="302.0" r="12" fill="#2F6B12" stroke="none" stroke-width="1.5"/>
<path d="M501.6 302.2 L505.8 306.6 L513.0 297.8" fill="none" stroke="#fff" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"/>
<text x="525.0" y="302.0" font-size="16" fill="#2F6B12" font-weight="700" text-anchor="start" dominant-baseline="central">Bonne réaction</text>
<text class="t" x="499.0" y="347.5" text-anchor="start" dominant-baseline="central">Je ne donne ni mon</text>
<text class="t" x="499.0" y="366.5" text-anchor="start" dominant-baseline="central">adresse ni ma photo. Je</text>
<text class="t" x="499.0" y="385.5" text-anchor="start" dominant-baseline="central">préviens tout de suite</text>
<text class="t" x="499.0" y="404.5" text-anchor="start" dominant-baseline="central">un adulte.</text>
