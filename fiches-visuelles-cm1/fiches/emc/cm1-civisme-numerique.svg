<text class="ts" x="29.0" y="302.0" text-anchor="start" dominant-baseline="central">Groupe CM1</text>
<rect x="25.0" y="316.0" width="103.0" height="62.5" rx="9" fill="#FDE4E1" stroke="#B42318" stroke-width="1.2"/>
<text class="t" x="34.0" y="329.7" text-anchor="start" dominant-baseline="central">T'es nul.</text>
<text class="t" x="34.0" y="347.2" text-anchor="start" dominant-baseline="central">Personne ne</text>
<text class="t" x="34.0" y="364.7" text-anchor="start" dominant-baseline="central">veut de toi.</text>
<rect x="25.0" y="408.0" width="116.0" height="22.0" rx="11" fill="#F5F5F5" stroke="#c9c9c9" stroke-width="1"/>
<text class="ts" x="35.0" y="419.0" text-anchor="start" dominant-baseline="central">Répondre…</text>
<circle cx="170.0" cy="302.0" r="12" fill="#2F6B12" stroke="none" stroke-width="1.5"/>
<path d="M164.6 302.2 L168.8 306.6 L176.0 297.8" fill="none" stroke="#fff" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"/>
<text x="188.0" y="302.0" font-size="16" fill="#2F6B12" font-weight="700" text-anchor="start" dominant-baseline="central">Bonne réaction</text>
<text class="t" x="162.0" y="357.0" text-anchor="start" dominant-baseline="central">Je ne réponds pas. Je</text>
<text class="t" x="162.0" y="376.0" text-anchor="start" dominant-baseline="central">garde le message et je</text>
<text class="t" x="162.0" y="395.0" text-anchor="start" dominant-baseline="central">le montre à un adulte.</text>
<rect x="343.0" y="236.0" width="331.0" height="222.0" rx="12" fill="#FFFFFF" stroke="#9aa5b1" stroke-width="1.2"/>
