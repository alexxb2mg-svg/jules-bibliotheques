<rect x="366.0" y="174.0" width="108.0" height="22.0" rx="4" fill="#185FA5" stroke="none" stroke-width="0"/>
<text class="t" x="420.0" y="185.0" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">entrer</text>
<circle cx="507.0" cy="72.0" r="12" fill="#2F6B12" stroke="none" stroke-width="1.5"/>
<path d="M501.6 72.2 L505.8 76.6 L513.0 67.8" fill="none" stroke="#fff" stroke-width="2.64" stroke-linecap="round" stroke-linejoin="round"/>
<text x="525.0" y="72.0" font-size="16" fill="#2F6B12" font-weight="700" text-anchor="start" dominant-baseline="central">Bonne réaction</text>
<text class="t" x="499.0" y="117.5" text-anchor="start" dominant-baseline="central">Je le garde secret,</text>
<text class="t" x="499.0" y="136.5" text-anchor="start" dominant-baseline="central">même pour mon</text>
<text class="t" x="499.0" y="155.5" text-anchor="start" dominant-baseline="central">meilleur ami. Seuls mes</text>
<text class="t" x="499.0" y="174.5" text-anchor="start" dominant-baseline="central">parents le connaissent.</text>
<rect x="6.0" y="236.0" width="331.0" height="222.0" rx="12" fill="#FFFFFF" stroke="#9aa5b1" stroke-width="1.2"/>
<rect x="6.0" y="236.0" width="331.0" height="32.0" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
