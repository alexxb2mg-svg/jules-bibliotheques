<text x="171.5" y="252.0" font-size="16" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">3. Un message méchant</text>
<rect x="16.0" y="276.0" width="134.0" height="176.0" rx="12" fill="#2E3440" stroke="#2E3440" stroke-width="1"/>
<rect x="21.0" y="290.0" width="124.0" height="148.0" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/>
