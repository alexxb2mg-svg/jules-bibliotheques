<text x="188.0" y="72.0" font-size="16" fill="#2F6B12" font-weight="700" text-anchor="start" dominant-baseline="central">Bonne réaction</text>
<text class="t" x="162.0" y="117.5" text-anchor="start" dominant-baseline="central">Je demande d'abord :</text>
<text class="t" x="162.0" y="136.5" text-anchor="start" dominant-baseline="central">« Je peux l'envoyer ? »</text>
<text class="t" x="162.0" y="155.5" text-anchor="start" dominant-baseline="central">Si c'est non, je ne</text>
<text class="t" x="162.0" y="174.5" text-anchor="start" dominant-baseline="central">l'envoie pas.</text>
<rect x="343.0" y="6.0" width="331.0" height="222.0" rx="12" fill="#FFFFFF" stroke="#9aa5b1" stroke-width="1.2"/>
<rect x="343.0" y="6.0" width="331.0" height="32.0" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
<rect x="344.0" y="26.0" width="329.0" height="12.0" rx="0" fill="#E6F1FB" stroke="none" stroke-width="0"/>
<text x="508.5" y="22.0" font-size="16" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">2. Mon mot de passe</text>
