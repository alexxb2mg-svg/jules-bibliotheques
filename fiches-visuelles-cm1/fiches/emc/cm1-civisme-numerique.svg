<text x="508.5" y="252.0" font-size="16" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">4. Un inconnu me parle</text>
<rect x="353.0" y="276.0" width="134.0" height="176.0" rx="12" fill="#2E3440" stroke="#2E3440" stroke-width="1"/>
<rect x="358.0" y="290.0" width="124.0" height="148.0" rx="4" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<line x1="412.0" y1="283.0" x2="428.0" y2="283.0" stroke="#8a8f98" stroke-width="2.5" stroke-linecap="round"/>
