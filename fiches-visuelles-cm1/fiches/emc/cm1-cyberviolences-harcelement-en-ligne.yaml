notion: cm1-cyberviolences-harcelement-en-ligne
titre: "Cyberviolences et harcèlement en ligne : les reconnaître, et savoir quoi faire"
matiere: emc
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'enseignement moral et civique, arrêté du 29-5-2024, BO n° 24 du 13/06/2024, p. 12", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20d%E2%80%99enseignement%20moral%20et%20civique%20du%20cours%20pr%C3%A9paratoire%20%C3%A0%20la%20classe%20terminale%20des%20voies%20g%C3%A9n%C3%A9rale%2C%20technologique%20et%20professionnelle%20et%20des%20classes%20pr%C3%A9parant%20au%20CAP-402159.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  MDR: "« mort de rire » : ce qu'on écrit en ligne quand on trouve quelque chose très drôle"
blocs:
  - id: definition
    type: formule
    expression: "[cyberviolences] répétées contre [la même personne] = [harcèlement en ligne]"
    termes:
      cyberviolences: {couleur: rouge, legende: "un **acte violent** commis en ligne (insulte, moquerie, photo partagée sans accord, rumeur, exclusion d'un groupe)"}
      la même personne: {couleur: bleu, legende: "toujours la même **cible**, souvent attaquée par plusieurs autres à la fois"}
      harcèlement en ligne: {couleur: violet, legende: "des attaques **répétées**, qui **durent**, et que la victime n'arrive pas à arrêter seule"}
    jules: "« Cyber » veut dire « en ligne ». Une cyberviolence, c'est donc une violence qui passe par un écran : téléphone, tablette, ordinateur, console."

  - id: carte
    type: carte
    noeuds:
      - {id: cyber, titre: "Les cyberviolences", sous_titre: "des violences en ligne, de vraies violences", principal: true}
      - {id: exemples, titre: "Des exemples", sous_titre: "insultes, moqueries, photo partagée sans accord, exclusion"}
      - {id: harcelement, titre: "Le harcèlement en ligne", sous_titre: "répété, qui dure, plusieurs contre un"}
      - {id: loi, titre: "La loi", sous_titre: "les interdit, comme les violences dans la cour"}
      - {id: agir, titre: "Que faire ?", sous_titre: "garder les messages, bloquer, parler à un adulte"}
    liens:
      - {de: cyber, vers: exemples}
      - {de: cyber, vers: harcelement}
      - {de: cyber, vers: loi}
      - {de: cyber, vers: agir}
    jules: "Ce qui rend les cyberviolences si dures : elles entrent jusque dans la chambre, le soir et le week-end. C'est pour ça qu'il ne faut jamais rester seul avec."

  - id: schema-repete
    type: schema
    titre: "Une fois, ou encore et encore : quand ça devient du harcèlement"
    svg: "cm1-cyberviolences-harcelement-en-ligne.svg"
    jules: "Pas besoin d'attendre qu'il y ait les trois signes pour en parler. Dès le premier message qui fait mal, tu as le droit d'aller voir un adulte."

  - id: schema-triangle
    type: schema
    titre: "Victime, auteurs, témoins : chacun peut agir"
    svg: "cm1-cyberviolences-harcelement-en-ligne-triangle.svg"
    jules: "Les **témoins** sont souvent les plus nombreux. S'ils ne rient plus et préviennent un adulte, le harcèlement perd son public et peut s'arrêter."

  - id: graphe
    type: graphe
    gabarit: arbre-multiplication
    curseurs:
      - {id: curseur-etapes, nom: etapes, min: 1, max: 4, pas: 1, depart: 1}
      - {id: curseur-facteur, nom: facteur, min: 1, max: 4, pas: 1, depart: 2}
      - {id: curseur-frein, nom: frein, min: 0, max: 1, pas: 1, depart: 0}
    lectures:
      - {si: "etapes == 1 && frein == 0", texte: "Au début, quelques personnes seulement ont vu le message : c'est le **moment d'arrêter**, ne le transfère pas."}
      - {si: "etapes >= 3 && frein == 0", texte: "Le message a été vu par **beaucoup** de monde : en ligne, on ne peut plus le rattraper, et la moquerie répétée devient du **harcèlement**."}
      - {si: "facteur >= 3 && etapes >= 3 && frein == 0", texte: "Celui qui transfère participe aussi : parles-en à un adulte, ou appelle le **3018**, numéro gratuit contre le harcèlement en ligne."}
      - {si: "frein == 1", texte: "Ceux qui reçoivent ne transfèrent pas (en vert) : le message **s'arrête**. Ne pas partager, c'est protéger."}
    jules: "Un message moqueur « juste transféré » touche vite beaucoup de monde : chaque personne qui ne le partage pas arrête une branche."

  - id: methode
    type: methode
    etapes:
      - "Vérifie que ça se passe **en ligne** : messages, jeu, vidéo, groupe de discussion."
      - "Demande-toi si c'est **une fois** ou **répété** contre la même personne, souvent par plusieurs : si ça se répète et dure, c'est du **harcèlement**."
      - "Ne réponds pas par d'autres insultes. **Garde les messages** (fais une capture d'écran avec un adulte) et bloque la personne."
      - "**Parles-en à un adulte de confiance** : parent, enseignant, directeur ou directrice. C'est lui qui peut faire arrêter."
    jules: "Tu n'y es pour rien, et tu ne seras pas puni pour avoir parlé. Si le premier adulte ne t'écoute pas, va en voir un autre."

  - id: piege
    type: piege
    mauvaise_idee: "Ce ne sont que des messages sur un écran : ce n'est pas de la vraie violence, personne n'est frappé."
    pourquoi_faux: "Les mots et les images blessent aussi : la victime a peur, a honte, dort mal, n'a plus envie d'aller à l'école. Et en ligne, ça la suit **jusqu'à la maison**."
    bonne_idee: "Une **cyberviolence** est une vraie violence. La **loi** l'interdit, en ligne comme dans la cour."
    jules: "Autre idée fausse : « sur internet, on fait ce qu'on veut ». Non, la règle et le droit s'appliquent aussi en ligne, et on peut retrouver l'auteur d'un message."

  - id: exemple-jeu
    type: exemple
    situation: "Depuis trois semaines, sur un jeu en ligne, Lou reçoit chaque soir des messages de trois élèves de sa classe : « nul », « personne t'aime », « quitte le jeu ». Lou n'ose plus se connecter et a mal au ventre le matin."
    calcul: "En ligne ? Oui, sur un jeu. Répété ? Oui, chaque soir. Ça dure ? Trois semaines. Rapport de force ? Trois contre un."
    conclusion: "C'est du **harcèlement en ligne**. Lou n'y est pour rien : il doit **en parler à un adulte**, qui gardera les messages et fera arrêter."
    jules: "Avoir mal au ventre ou ne plus vouloir aller à l'école, ce sont des signaux d'alerte. Si ça t'arrive, dis-le : on peut t'aider."

  - id: exemple-temoin
    type: exemple
    situation: "Dans le groupe de messages de la classe, quelqu'un envoie une photo de Sofia en pyjama, prise à la classe verte, avec des émojis moqueurs. Plusieurs élèves envoient « MDR ». Kenza ne sait pas quoi faire."
    calcul: "Kenza est **témoin**. Si elle rit ou partage, elle aggrave. Si elle ne fait rien, ça peut continuer."
    conclusion: "Kenza ne rit pas et ne partage pas. Elle écrit à Sofia qu'elle est avec elle, et montre le message à un adulte : c'est un **témoin** qui aide."
    jules: "Envoyer la photo de Sofia sans son accord, c'est déjà une cyberviolence. La trouver drôle ne change rien pour Sofia, qui a honte."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Choisis dès maintenant ton adulte de confiance, à la maison et à l'école. Comme ça, si un jour ça arrive, à toi ou à un copain, tu sais déjà à qui parler."
