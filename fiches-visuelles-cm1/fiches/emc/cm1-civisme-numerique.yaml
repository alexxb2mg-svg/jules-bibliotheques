notion: cm1-civisme-numerique
titre: "Le civisme numérique : en ligne, les mêmes règles que dans la cour"
matiere: emc
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'enseignement moral et civique, arrêté du 29-5-2024, BO n° 24 du 13/06/2024, p. 11", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20d%E2%80%99enseignement%20moral%20et%20civique%20du%20cours%20pr%C3%A9paratoire%20%C3%A0%20la%20classe%20terminale%20des%20voies%20g%C3%A9n%C3%A9rale%2C%20technologique%20et%20professionnelle%20et%20des%20classes%20pr%C3%A9parant%20au%20CAP-402159.pdf", licence: etalab-2.0}
  - {titre: "Éduscol, « Enseignement moral et civique — Livret d'accompagnement de programme, CM1 » (2025), p. 6", url: "https://eduscol.education.gouv.fr/sites/default/files/document/2025livretaccompagnementemccm1-112047.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  ENT: "espace numérique de travail : le site de la classe, où l'on trouve les devoirs et les messages"
  APS: "apprendre à porter secours"
  APER: "attestation de première éducation à la route"
blocs:
  - id: definition
    type: formule
    expression: "[civisme numérique] = [les règles de la cour] + [sobriété numérique]"
    termes:
      civisme numérique: {couleur: vert, legende: "le civisme appliqué à ce que tu fais **en ligne** : ENT, blog de la classe, jeu, groupe de messages"}
      les règles de la cour: {couleur: bleu, legende: "respecter les autres et les règles communes : ce qui est interdit dans la cour l'est aussi sur un écran"}
      sobriété numérique: {couleur: orange, legende: "**ne pas gaspiller** les écrans (les éteindre, s'en servir moins), pour respecter l'environnement"}
    jules: "Le mot « sobriété » veut dire « ne pas gaspiller ». La sobriété numérique, c'est éteindre l'écran quand on a fini, comme on éteint la lumière en sortant."

  - id: carte
    type: carte
    noeuds:
      - {id: numerique, titre: "Le civisme numérique", sous_titre: "être civique quand on est en ligne", principal: true}
      - {id: respect, titre: "Respecter les autres", sous_titre: "pas d'insulte ni de moquerie, même derrière un écran"}
      - {id: permission, titre: "Demander la permission", sous_titre: "avant d'envoyer la photo de quelqu'un"}
      - {id: proteger, titre: "Se protéger", sous_titre: "mot de passe secret, rien donné à un inconnu"}
      - {id: sobriete, titre: "Ne pas gaspiller", sous_titre: "éteindre l'écran quand on a fini"}
    liens:
      - {de: numerique, vers: respect}
      - {de: numerique, vers: permission}
      - {de: numerique, vers: proteger}
      - {de: numerique, vers: sobriete}
    jules: "Un bon réflexe : imagine que tu dis la même chose en face, dans la cour. Si ce n'est pas permis dans la cour, ce n'est pas permis en ligne."

  - id: schema-situations
    type: schema
    titre: "Quatre situations en ligne, et la bonne réaction"
    svg: "cm1-civisme-numerique.svg"
    jules: "Dans les cas 3 et 4, tu n'as rien fait de mal : tu as le droit, et même le devoir, d'en parler à un adulte. C'est lui qui saura quoi faire, et tu ne seras pas grondé pour avoir prévenu."

  - id: schema-regles
    type: schema
    titre: "Dans la cour ou en ligne : les mêmes règles"
    svg: "cm1-civisme-numerique-regles.svg"
    jules: "Un inconnu en ligne peut mentir sur son âge ou son prénom : on ne sait jamais vraiment qui il est. C'est pour ça que la règle est la même qu'à la sortie de l'école."

  - id: methode
    type: methode
    etapes:
      - "Imagine la même scène **dans la cour** : est-ce que ce serait permis ?"
      - "Relis ton message ou regarde ta photo : est-ce qu'elle **respecte** la personne ? Aimerais-tu la recevoir ?"
      - "Si quelque chose te gêne ou te fait peur, n'y réponds pas : **parles-en à un adulte** (parent, enseignant)."
      - "Quand tu as fini, **éteins l'écran** : c'est la sobriété numérique."
    jules: "Un message envoyé ne se rattrape pas : il peut être copié et montré à d'autres. Avant d'appuyer sur « envoyer », prends deux secondes pour te relire."

  - id: piege
    type: piege
    mauvaise_idee: "Sur le groupe de messages, personne ne me voit : je peux écrire ce que je veux."
    pourquoi_faux: "Derrière l'écran, il y a une **vraie personne** qui lit et qui ressent. Et un message écrit reste : il peut être copié et montré à d'autres."
    bonne_idee: "En ligne, on garde les **mêmes règles** que dans la cour : on respecte les autres, on ne se moque pas, on n'insulte personne."
    jules: "Autre idée fausse : « le numérique, ça ne pollue pas ». Les vidéos sont gardées dans d'immenses ordinateurs qui consomment de l'électricité jour et nuit."

  - id: exemple-ent
    type: exemple
    situation: "Sur l'ENT de la classe, Emma écrit qu'elle ne comprend pas l'exercice 4 de maths. Hugo lui répond : « Regarde l'exemple de la leçon, page 12, c'est le même. » Est-ce du civisme numérique ?"
    calcul: "Hugo aide une camarade (c'est utile au groupe), avec un message poli, dans un espace de la classe. Il respecte les règles, en ligne comme en classe."
    conclusion: "Oui, c'est du **civisme numérique** : c'est le même geste que d'aider Emma en classe, mais en ligne."
    jules: "Hugo ne donne pas la réponse : il montre où la trouver. Aider, c'est aussi laisser l'autre réussir par lui-même."

  - id: exemple-photo
    type: exemple
    situation: "Au goûter d'anniversaire de Nathan, Inès prend une photo de lui avec de la crème plein le nez. Elle veut l'envoyer au groupe de la classe, où il y a 25 élèves. Que doit-elle faire ?"
    calcul: "Une photo envoyée à 25 personnes peut être renvoyée à d'autres : Inès ne pourra plus la retirer. Nathan pourrait avoir honte ou être moqué."
    conclusion: "Inès **demande d'abord à Nathan**. S'il dit non, elle ne l'envoie pas : cette photo, c'est aussi **son image** à lui."
    jules: "C'est une règle, pas seulement de la gentillesse : chacun a le droit de décider si on montre son image. Même pour une photo drôle, on demande."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Avec un adulte, fais la liste des règles de l'écran à la maison. Tu verras que presque toutes existent déjà dans le règlement de la cour."
