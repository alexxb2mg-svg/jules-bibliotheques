<text class="t" x="91.0" y="80.1" text-anchor="middle" dominant-baseline="central">Je pense que oui,</text>
<text class="t" x="91.0" y="98.0" text-anchor="middle" dominant-baseline="central">parce qu'on a</text>
<text class="t" x="91.0" y="115.9" text-anchor="middle" dominant-baseline="central">besoin de courir.</text>
<rect x="176.0" y="54.0" width="160.0" height="88.0" rx="12" fill="#E3F0D3" stroke="#2F6B12" stroke-width="1.4"/>
<polyline points="238.0,141.0 246.0,190.0 254.0,141.0" fill="#E3F0D3" stroke="#2F6B12" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="238.0" y1="141.0" x2="254.0" y2="141.0" stroke="#E3F0D3" stroke-width="2.5999999999999996" stroke-linecap="butt"/>
<text class="t" x="256.0" y="71.1" text-anchor="middle" dominant-baseline="central">Je ne suis pas</text>
<text class="t" x="256.0" y="89.0" text-anchor="middle" dominant-baseline="central">d'accord avec ton</text>
<text class="t" x="256.0" y="107.0" text-anchor="middle" dominant-baseline="central">idée, mais je</text>
<text class="t" x="256.0" y="124.9" text-anchor="middle" dominant-baseline="central">comprends.</text>
<rect x="346.0" y="54.0" width="150.0" height="88.0" rx="12" fill="#E3F0D3" stroke="#2F6B12" stroke-width="1.4"/>
<polyline points="406.0,141.0 414.0,190.0 422.0,141.0" fill="#E3F0D3" stroke="#2F6B12" stroke-width="1.4" stroke-linejoin="round"/>
<line x1="406.0" y1="141.0" x2="422.0" y2="141.0" stroke="#E3F0D3" stroke-width="2.5999999999999996" stroke-linecap="butt"/>
<text class="t" x="421.0" y="80.1" text-anchor="middle" dominant-baseline="central">Peut-être qu'on</text>
<text class="t" x="421.0" y="98.0" text-anchor="middle" dominant-baseline="central">pourrait faire</text>
<text class="t" x="421.0" y="115.9" text-anchor="middle" dominant-baseline="central">une zone ballon ?</text>
<rect x="506.0" y="54.0" width="164.0" height="88.0" rx="12" fill="#FDE4E1" stroke="#B42318" stroke-width="1.4"/>
<polyline points="572.0,141.0 580.0,190.0 588.0,141.0" fill="#FDE4E1" stroke="#B42318" stroke-width="1.4" stroke-linejoin="round"/>
