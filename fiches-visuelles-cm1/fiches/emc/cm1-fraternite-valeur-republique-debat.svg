<text x="340.0" y="338.0" font-size="17" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">Les règles du débat réglé</text>
<circle cx="23.3" cy="372.0" r="13" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<text x="23.3" y="372.5" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text class="t" x="131.3" y="372.0" text-anchor="middle" dominant-baseline="central">Je lève la main</text>
<text class="t" x="131.3" y="392.0" text-anchor="middle" dominant-baseline="central">et j'attends mon tour.</text>
<circle cx="246.0" cy="372.0" r="13" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<text x="246.0" y="372.5" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<text class="t" x="354.0" y="372.0" text-anchor="middle" dominant-baseline="central">J'écoute jusqu'au bout,</text>
<text class="t" x="354.0" y="392.0" text-anchor="middle" dominant-baseline="central">sans couper la parole.</text>
<circle cx="468.7" cy="372.0" r="13" fill="#185FA5" stroke="none" stroke-width="1.5"/>
<text x="468.7" y="372.5" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text class="t" x="576.7" y="372.0" text-anchor="middle" dominant-baseline="central">Je critique l'idée,</text>
<text class="t" x="576.7" y="392.0" text-anchor="middle" dominant-baseline="central">jamais la personne.</text>
<text class="tl" x="340.0" y="423.0" fill="#2F6B12" text-anchor="middle" dominant-baseline="central">On peut nuancer (« peut-être », « parfois ») et même</text>
<text class="tl" x="340.0" y="449.0" fill="#2F6B12" text-anchor="middle" dominant-baseline="central">changer d'avis.</text>
</svg>
