notion: cm1-egalite-en-droit-dignite-personne
titre: "L'égalité en droit et la dignité : les mêmes droits pour tous, le respect pour chacun"
matiere: emc
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'enseignement moral et civique, arrêté du 29-5-2024, BO n° 24 du 13/06/2024, p. 11", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20d%E2%80%99enseignement%20moral%20et%20civique%20du%20cours%20pr%C3%A9paratoire%20%C3%A0%20la%20classe%20terminale%20des%20voies%20g%C3%A9n%C3%A9rale%2C%20technologique%20et%20professionnelle%20et%20des%20classes%20pr%C3%A9parant%20au%20CAP-402159.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
abreviations:
  CM2: "cours moyen deuxième année : la classe qui vient après le CM1"
blocs:
  - id: definition
    type: formule
    expression: "[égalité en droit] : mêmes droits pour tous · [dignité] : respect pour chacun"
    termes:
      égalité en droit: {couleur: bleu, legende: "toutes les personnes ont les **mêmes droits**, quelles que soient leurs différences"}
      dignité: {couleur: vert, legende: "chaque être humain, enfant ou adulte, doit être **respecté**, sans exception"}
    jules: "Quand l'une des deux n'est pas respectée, on parle de **discrimination** ou d'**atteinte à la personne**. Ces deux mots sont expliqués dans les schémas plus bas."

  - id: carte
    type: carte
    noeuds:
      - {id: egalite, titre: "Égalité et dignité", sous_titre: "valables pour chaque personne, sans exception", principal: true}
      - {id: droits, titre: "Les mêmes droits", sous_titre: "aller à l'école, jouer, être soigné, donner son avis"}
      - {id: aide, titre: "Pas forcément pareil", sous_titre: "une aide en plus pour que le droit soit réel"}
      - {id: dignite, titre: "La dignité", sous_titre: "ne jamais humilier, ni se moquer de ce qu'est quelqu'un"}
      - {id: discrimination, titre: "Une discrimination", sous_titre: "traiter quelqu'un moins bien à cause d'une différence"}
    liens:
      - {de: egalite, vers: droits}
      - {de: egalite, vers: aide}
      - {de: egalite, vers: dignite}
      - {de: egalite, vers: discrimination}
    jules: "Les différences ne changent rien aux droits : fille ou garçon, d'ici ou d'ailleurs, avec ou sans handicap, croyant ou non, chacun a les mêmes."

  - id: schema-rampe
    type: schema
    titre: "Même droit pour tous, mais pas forcément le même chemin"
    svg: "cm1-egalite-en-droit-dignite-personne.svg"
    jules: "La rampe ne donne pas un droit en plus à Aya : elle lui permet d'avoir le même droit que Malo, entrer à l'école. Sans rampe, ce droit n'existerait que sur le papier."

  - id: schema-cour
    type: schema
    titre: "Dans la cour : égalité et dignité respectées, ou pas"
    svg: "cm1-egalite-en-droit-dignite-personne-cour.svg"
    jules: "Respecter la dignité, c'est aussi respecter les **croyances** de chacun : on a le droit de croire ou de ne pas croire. Personne ne doit être moqué pour cela."

  - id: methode
    type: methode
    etapes:
      - "Regarde si **tout le monde a les mêmes droits** dans la situation : jouer, parler, participer."
      - "Si quelqu'un est mis à part, cherche **pourquoi** : est-ce à cause d'une différence (fille ou garçon, origine, handicap, religion, apparence) ?"
      - "Vérifie que chacun est **respecté** : personne n'est humilié ni moqué pour ce qu'il est."
      - "Si l'égalité ou la dignité ne sont pas respectées, c'est une **discrimination** ou une **atteinte à la personne** : on le dit à un adulte."
    jules: "Être mis à part parce qu'on joue mal au foot n'est pas une discrimination, mais ce n'est pas gentil. Être mis à part parce qu'on est une fille, c'en est une."

  - id: piege
    type: piege
    mauvaise_idee: "L'égalité, c'est donner exactement la même chose à tout le monde. Donc Léna, qui voit mal, n'a pas droit à une feuille écrite plus gros."
    pourquoi_faux: "Léna a le **même droit** que les autres : apprendre. Avec la même petite feuille, elle ne pourrait pas lire. L'aide en plus lui permet d'avoir **vraiment** ce droit."
    bonne_idee: "L'**égalité en droit**, c'est les mêmes droits pour tous. Parfois, pour que ce droit soit réel, certains ont besoin d'une aide différente."
    jules: "Autre erreur : croire que la dignité, c'est seulement pour les adultes. Un enfant aussi a droit au respect : on ne l'humilie pas, on ne se moque pas de son corps."

  - id: exemple-foot
    type: exemple
    situation: "Dans la cour, Adam organise un match. Il dit à Maëlys : « Toi, tu ne joues pas, t'es une fille. » Pourtant, Maëlys joue au foot en club le mercredi."
    calcul: "Tous les élèves ont le même droit de jouer dans la cour. Maëlys n'est pas écartée à cause de son jeu, mais seulement parce qu'elle est une fille."
    conclusion: "C'est une **discrimination** : l'**égalité en droit** n'est pas respectée. Maëlys doit pouvoir jouer, comme tout le monde."
    jules: "Si tu es témoin, tu peux dire simplement : « Tout le monde a le droit de jouer. » Et si ça continue, préviens un adulte de la cour."

  - id: exemple-video
    type: exemple
    situation: "À la sortie de l'école, Timéo glisse dans une flaque et se met à pleurer. Un grand de CM2 le filme avec son téléphone et dit qu'il va montrer la vidéo à tout le monde."
    calcul: "Timéo a mal, et il a honte. Montrer la vidéo, ce serait l'humilier devant tout le monde : rire de lui au lieu de l'aider."
    conclusion: "C'est une **atteinte à la dignité** de Timéo. Le bon réflexe : ne pas regarder, ne pas partager, aider Timéo à se relever et prévenir un adulte."
    jules: "Timéo n'y est pour rien : tomber, ça arrive à tout le monde. Celui qui a tort, c'est celui qui veut se moquer."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Cherche autour de toi ce qui aide chacun à avoir les mêmes droits : une rampe, un ascenseur, des livres en gros caractères, un passage piéton sonore. Chacun est une petite part d'égalité."
