notion: cm1-incivilites-regles-civilite
titre: "Incivilités et règles de civilité : ce qui rend la vie en commun agréable, ou pénible"
matiere: emc
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'enseignement moral et civique, arrêté du 29-5-2024, BO n° 24 du 13/06/2024, p. 11", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20d%E2%80%99enseignement%20moral%20et%20civique%20du%20cours%20pr%C3%A9paratoire%20%C3%A0%20la%20classe%20terminale%20des%20voies%20g%C3%A9n%C3%A9rale%2C%20technologique%20et%20professionnelle%20et%20des%20classes%20pr%C3%A9parant%20au%20CAP-402159.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: definition
    type: formule
    expression: "[incivilité] = ne pas respecter [une règle de civilité]"
    termes:
      incivilité: {couleur: rouge, legende: "un comportement qui **gêne les autres**, comme bousculer sans s'excuser ou salir un lieu commun"}
      une règle de civilité: {couleur: vert, legende: "une règle de **politesse** et de **respect** : dire pardon, attendre son tour, parler doucement, garder les lieux propres"}
    jules: "Civilité et incivilité, c'est le même mot avec « in » devant, qui veut dire « pas ». Comme poli et impoli, ou juste et injuste."

  - id: carte
    type: carte
    noeuds:
      - {id: civilite, titre: "La civilité", sous_titre: "politesse et respect dans la vie en société", principal: true}
      - {id: politesse, titre: "Les mots magiques", sous_titre: "bonjour, s'il te plaît, merci, pardon"}
      - {id: tour, titre: "Attendre son tour", sous_titre: "à la cantine, au toboggan, pour parler"}
      - {id: lieux, titre: "Respecter les lieux communs", sous_titre: "le car, la bibliothèque, les toilettes de l'école"}
      - {id: incivilite, titre: "Une incivilité", sous_titre: "gêne tout le monde, même si la loi ne l'interdit pas"}
    liens:
      - {de: civilite, vers: politesse}
      - {de: civilite, vers: tour}
      - {de: civilite, vers: lieux}
      - {de: civilite, vers: incivilite}
    jules: "Une incivilité seule, ça paraît petit. Mais quand tout le monde en fait, la cantine devient bruyante, la cour sale, et plus personne n'est bien."

  - id: schema-paires
    type: schema
    titre: "Incivilité ou civilité : quatre scènes, deux façons de faire"
    svg: "cm1-incivilites-regles-civilite.svg"
    jules: "Regarde les visages : dans les cases rouges, quelqu'un est triste ou fâché. Une incivilité, c'est toujours quelqu'un d'autre qui en paie le prix."

  - id: schema-expres
    type: schema
    titre: "Exprès ou par accident : ce n'est pas la même chose"
    svg: "cm1-incivilites-regles-civilite-expres.svg"
    jules: "Tout le monde peut être maladroit. Ce qui compte, c'est ce qu'on fait juste après : s'excuser et réparer, c'est déjà de la **civilité**."

  - id: graphe
    type: graphe
    gabarit: effet-cumule
    curseurs:
      - {id: curseur-personnes, nom: personnes, min: 1, max: 25, pas: 1, depart: 1}
      - {id: curseur-jours, nom: jours, min: 1, max: 5, pas: 1, depart: 1}
    lectures:
      - {si: "personnes == 1 && jours == 1", texte: "Un seul papier : « ce n'est rien », pense celui qui le jette. Pourtant c'est déjà une **incivilité**."}
      - {si: "personnes >= 10 && jours >= 3", texte: "Si chacun se dit « ce n'est qu'un papier », la cour devient sale pour **tout le monde** : l'incivilité gêne la vie en commun."}
      - {si: "jours == 5", texte: "Au bout de cinq jours, quelqu'un doit ramasser à la place des autres : respecter les règles de **civilité**, c'est penser aux autres."}
    jules: "Un papier par terre, ce n'est pas grand-chose ? Augmente le nombre d'élèves, puis le nombre de jours : la cour appartient à tout le monde."

  - id: methode
    type: methode
    etapes:
      - "Repère ce qui s'est passé, et la **règle de civilité** qui n'a pas été respectée."
      - "Demande-toi **qui est gêné** : une personne, un groupe, ou tous ceux qui utilisent le lieu ?"
      - "Vérifie si c'est **voulu** (ou fait sans faire attention aux autres), ou si c'est un **accident**."
      - "Trouve le geste de civilité qui répare : s'excuser, ramasser, attendre son tour, baisser la voix."
    jules: "Un désaccord n'est pas une incivilité non plus. Ne pas être d'accord avec quelqu'un, c'est permis, tant qu'on le dit poliment."

  - id: piege
    type: piege
    mauvaise_idee: "Couper la file à la cantine, ce n'est pas grave : ce n'est pas interdit par la loi."
    pourquoi_faux: "Beaucoup d'**incivilités** ne sont pas punies par la loi. Mais elles gênent les autres : ceux qui attendaient passent après, s'énervent, et l'ambiance se gâte."
    bonne_idee: "Une règle de **civilité** se respecte parce qu'elle rend la vie en commun agréable, pas seulement par peur d'être puni."
    jules: "Certaines incivilités sont en plus interdites : jeter un déchet par terre dans la rue peut coûter une amende. Mais même sans amende, elles abîment la vie de tous."

  - id: exemple-car
    type: exemple
    situation: "Dans le car de la sortie scolaire, Maël pose ses baskets pleines de boue sur le siège. Puis il crie d'un bout à l'autre du car pour parler à son copain Sami. Est-ce une incivilité ?"
    calcul: "Règles non respectées : on garde les pieds par terre, et on parle sans crier. Qui est gêné ? L'élève qui s'assoira sur le siège sale, et tous ceux qui voulaient discuter ou se reposer."
    conclusion: "Oui, ce sont deux **incivilités**. La civilité : les pieds par terre, et changer de place (si c'est permis) pour parler à Sami à voix normale."
    jules: "Le car, la bibliothèque ou la cantine sont des **lieux communs** : ils servent à beaucoup de gens, l'un après l'autre. On les laisse comme on voudrait les trouver."

  - id: exemple-bibli
    type: exemple
    situation: "À la médiathèque, Jade se retourne trop vite et fait tomber une pile de livres. Elle dit « oh, pardon ! » à la bibliothécaire et ramasse tout. Est-ce une incivilité ?"
    calcul: "Jade ne l'a pas fait exprès : c'est une **maladresse**. Et elle a réparé : elle s'est excusée et a tout ramassé."
    conclusion: "Non, ce n'est pas une incivilité. Au contraire : s'excuser et ramasser, c'est appliquer une règle de **civilité**."
    jules: "Si Jade était partie en laissant les livres par terre, en riant, ce serait différent : on ne répare pas, on laisse le travail aux autres."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Petit jeu : pendant une journée, compte les « merci » et les « pardon » que tu entends. Tu verras qu'ils changent l'ambiance autour de toi."
