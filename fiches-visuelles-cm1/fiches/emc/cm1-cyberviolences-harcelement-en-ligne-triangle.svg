<rect x="372.0" y="8.0" width="300.0" height="116.0" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.4"/>
<text x="522.0" y="24.0" font-size="16" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">La victime</text>
<text class="t" x="384.0" y="48.0" text-anchor="start" dominant-baseline="central">Tu n'y es pour rien.</text>
<text class="t" x="384.0" y="67.0" text-anchor="start" dominant-baseline="central">Ne réponds pas, garde les messages.</text>
<text class="t" x="384.0" y="86.0" text-anchor="start" dominant-baseline="central">Bloque, et parles-en à un adulte :</text>
<text class="t" x="384.0" y="105.0" text-anchor="start" dominant-baseline="central">tu as le droit, et c'est ce qui aide.</text>
<rect x="8.0" y="360.0" width="300.0" height="108.0" rx="10" fill="#FDE4E1" stroke="#B42318" stroke-width="1.4"/>
<text x="158.0" y="376.0" font-size="16" fill="#B42318" font-weight="700" text-anchor="middle" dominant-baseline="central">Les auteurs</text>
<text class="t" x="20.0" y="400.0" text-anchor="start" dominant-baseline="central">Ils doivent arrêter : ça fait très mal.</text>
<text class="t" x="20.0" y="419.0" text-anchor="start" dominant-baseline="central">C'est interdit par la loi,</text>
<text class="t" x="20.0" y="438.0" text-anchor="start" dominant-baseline="central">à l'école comme en ligne.</text>
<rect x="372.0" y="360.0" width="300.0" height="108.0" rx="10" fill="#E3F0D3" stroke="#2F6B12" stroke-width="1.4"/>
<text x="522.0" y="376.0" font-size="16" fill="#2F6B12" font-weight="700" text-anchor="middle" dominant-baseline="central">Les témoins</text>
<text class="t" x="384.0" y="400.0" text-anchor="start" dominant-baseline="central">Je ne like pas, je ne partage pas.</text>
<text class="t" x="384.0" y="419.0" text-anchor="start" dominant-baseline="central">Je soutiens la victime.</text>
<text class="t" x="384.0" y="438.0" text-anchor="start" dominant-baseline="central">Je préviens un adulte.</text>
<rect x="8.0" y="8.0" width="220.0" height="116.0" rx="10" fill="#FFFFFF" stroke="#9aa5b1" stroke-width="1.2"/>
<text class="tl" x="118.0" y="30.0" fill="#1a1a18" text-anchor="middle" dominant-baseline="central">Tout le monde peut</text>
<text class="tl" x="118.0" y="54.0" fill="#1a1a18" text-anchor="middle" dominant-baseline="central">agir. Le bon chemin</text>
<text class="tl" x="118.0" y="78.0" fill="#1a1a18" text-anchor="middle" dominant-baseline="central">mène toujours à un</text>
<text class="tl" x="118.0" y="102.0" fill="#1a1a18" text-anchor="middle" dominant-baseline="central">adulte.</text>
</svg>
