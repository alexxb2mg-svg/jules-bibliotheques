notion: cm1-empathie-lutte-discriminations-harcelement
titre: "L'empathie : se mettre à la place de l'autre pour ne pas laisser faire"
matiere: emc
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'enseignement moral et civique, arrêté du 29-5-2024, BO n° 24 du 13/06/2024, p. 12", url: "https://www.education.gouv.fr/sites/default/files/document/Annexe%20%E2%80%94%20Programme%20d%E2%80%99enseignement%20moral%20et%20civique%20du%20cours%20pr%C3%A9paratoire%20%C3%A0%20la%20classe%20terminale%20des%20voies%20g%C3%A9n%C3%A9rale%2C%20technologique%20et%20professionnelle%20et%20des%20classes%20pr%C3%A9parant%20au%20CAP-402159.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: definition
    type: formule
    expression: "[empathie] = [comprendre ce que l'autre ressent] + [s'en soucier]"
    termes:
      empathie: {couleur: vert, legende: "se mettre **à la place de l'autre** pour sentir ce qu'il vit"}
      comprendre ce que l'autre ressent: {couleur: bleu, legende: "lire ses **émotions** : joie, tristesse, colère, peur, sur son visage et dans ses gestes"}
      s'en soucier: {couleur: orange, legende: "ne pas rester indifférent : ce que ressent l'autre compte pour moi, alors j'agis"}
    jules: "On dit souvent « se mettre dans ses chaussures ». Tu ne deviens pas l'autre, mais tu imagines ce que tu ressentirais à sa place."

  - id: carte
    type: carte
    noeuds:
      - {id: empathie, titre: "L'empathie", sous_titre: "comprendre ce que ressent l'autre, et s'en soucier", principal: true}
      - {id: emotions, titre: "Lire les émotions", sous_titre: "joie, tristesse, colère, peur"}
      - {id: altruisme, titre: "Altruisme ou égoïsme", sous_titre: "penser aux autres, ou seulement à soi"}
      - {id: discriminations, titre: "Contre les discriminations", sous_titre: "ne pas rejeter quelqu'un parce qu'il est différent"}
      - {id: harcelement, titre: "Contre le harcèlement", sous_titre: "défendre celui qui souffre, prévenir un adulte"}
    liens:
      - {de: empathie, vers: emotions}
      - {de: empathie, vers: altruisme}
      - {de: empathie, vers: discriminations}
      - {de: empathie, vers: harcelement}
    jules: "Quand on sent vraiment la peine de quelqu'un, on n'a plus envie de lui faire du mal. C'est pour ça que l'empathie aide à lutter contre la violence et le harcèlement."

  - id: schema-emotions
    type: schema
    titre: "Lire les émotions et se mettre à la place de l'autre"
    svg: "cm1-empathie-lutte-discriminations-harcelement.svg"
    jules: "Les indices ne sont pas toujours sur le visage : quelqu'un qui reste seul, qui ne parle plus ou qui ne mange plus envoie aussi un message. L'empathie, c'est d'abord remarquer."

  - id: schema-bd
    type: schema
    titre: "L'empathie en trois cases : je remarque, je me mets à sa place, j'agis"
    svg: "cm1-empathie-lutte-discriminations-harcelement-bd.svg"
    jules: "L'**altruisme** est le contraire de l'**égoïsme**. Léo aurait pu continuer à jouer sans penser à Nora ; il a choisi de penser aussi à elle."

  - id: methode
    type: methode
    etapes:
      - "**Observe** : le visage, les gestes, ce que la personne dit, ou ne dit plus."
      - "**Imagine-toi à sa place** : « si c'était moi, qu'est-ce que je ressentirais ? »"
      - "Choisis entre penser **seulement à toi** (l'égoïsme) et penser aussi **à l'autre** (l'altruisme)."
      - "**Agis** : un mot gentil, une invitation, ou prévenir un adulte si c'est grave (moqueries, coups, harcèlement)."
    jules: "Tu n'as pas besoin de tout régler toi-même. Parfois, agir avec empathie, c'est juste aller chercher un adulte."

  - id: piege
    type: piege
    mauvaise_idee: "Avoir de l'empathie pour Tom, qui est en colère parce qu'il a perdu, c'est lui donner raison quand il tape dans la porte."
    pourquoi_faux: "L'**empathie**, c'est **comprendre** ce que Tom ressent (il est déçu et en colère). Ce n'est pas être d'accord avec tout ce qu'il fait."
    bonne_idee: "« Je comprends que tu sois en colère. Mais taper, non. Viens, on respire. » On comprend l'émotion, sans approuver le geste."
    jules: "Autre confusion : l'empathie n'est pas juste être gentil. On peut sourire à tout le monde sans remarquer que quelqu'un est triste ; l'empathie commence par remarquer."

  - id: exemple-lunettes
    type: exemple
    situation: "Au centre de loisirs, le groupe prépare un spectacle. Deux enfants refusent que Yasmine y participe « parce qu'elle a des lunettes épaisses », et l'appellent « la taupe ». Yasmine ne veut plus venir."
    calcul: "Si on se met à sa place : être rejetée pour ses lunettes, c'est être rejetée pour ce qu'on est, pas pour ce qu'on a fait. Elle se sent seule, triste et humiliée."
    conclusion: "L'**empathie** aide à voir que ce rejet est une **discrimination** : Yasmine n'a rien fait. Les témoins peuvent la défendre et prévenir l'animateur."
    jules: "On parle de discrimination quand on traite quelqu'un moins bien à cause de son origine, sa couleur de peau, son sexe, son handicap, sa religion ou son apparence. Aucune de ces raisons n'est valable."

  - id: exemple-gouter
    type: exemple
    situation: "À la récré, Sami a un paquet de 8 biscuits. Chloé a oublié son goûter et regarde les autres manger. Sami peut tout manger, ou lui en proposer 2."
    calcul: "Sami se met à la place de Chloé : avoir faim et voir les autres manger, ce n'est pas agréable. S'il partage 2 biscuits, il lui en reste 8 − 2 = 6."
    conclusion: "Partager, c'est de l'**altruisme** : penser au bien-être de Chloé, pas seulement au sien. Tout garder sans même la regarder serait de l'**égoïsme**."
    jules: "Sami n'est pas obligé de tout donner : l'altruisme, ce n'est pas s'oublier soi-même. Avec 6 biscuits, il a encore un bon goûter, et Chloé aussi."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Jeu des émotions : regarde un dessin animé sans le son, et devine ce que ressent chaque personnage. C'est un très bon entraînement à l'empathie."
