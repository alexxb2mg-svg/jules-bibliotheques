abreviations:
  Mme: "Madame"
blocs:
  - id: definition
    type: formule
    expression: "[démocratie] : les [citoyens] participent aux décisions, par le [vote]"
    termes:
      démocratie: {couleur: bleu, legende: "le pouvoir vient du **peuple** (en grec, « dêmos » veut dire le peuple, et « kratos » le pouvoir)"}
      citoyens: {couleur: vert, legende: "en France, les **Français** de 18 ans et plus peuvent voter ; dans la classe, tous les élèves"}
      vote: {couleur: orange, legende: "au **suffrage direct**, chacun vote lui-même pour la personne élue, sans intermédiaire"}
    jules: "« Suffrage » est un autre mot pour « vote ». Suffrage direct : ta voix va directement à la personne que tu choisis."

  - id: carte
    type: carte
    noeuds:
      - {id: democratie, titre: "La démocratie", sous_titre: "le pouvoir vient du peuple, de tous les citoyens", principal: true}
      - {id: voter, titre: "Voter", sous_titre: "au suffrage direct, chacun choisit lui-même"}
      - {id: participer, titre: "Participer", sous_titre: "proposer et débattre, au conseil d'élèves par exemple"}
      - {id: loi, titre: "La même loi pour tous", sous_titre: "article 6 de la Déclaration de 1789"}
      - {id: pouvoirs, titre: "Des pouvoirs séparés", sous_titre: "faire les lois, les appliquer, juger (article 16)"}
    liens:
      - {de: democratie, vers: voter}
      - {de: democratie, vers: participer}
      - {de: democratie, vers: loi}
      - {de: democratie, vers: pouvoirs}
    jules: "L'article 3 de la Déclaration des droits de l'homme et du citoyen dit que le pouvoir vient de la nation, c'est-à-dire de tous les citoyens. Personne ne peut le prendre pour lui tout seul."

  - id: schema-election
    type: schema
    titre: "L'élection des délégués, pas à pas : des candidats au résultat"
    svg: "cm1-democratie-suffrage-direct.svg"
    jules: "Le **bulletin secret** protège ton choix : personne ne peut te forcer ni se moquer de ton vote. C'est pour ça qu'on passe derrière un rideau ou qu'on plie son bulletin."

  - id: schema-direct
    type: schema
    titre: "Suffrage direct ou pas : qui vote pour qui"
    svg: "cm1-democratie-suffrage-direct-direct.svg"
    jules: "Séparer les pouvoirs, c'est ne pas tout confier aux mêmes personnes. Ceux qui font les lois ne sont pas ceux qui jugent : ainsi, personne ne décide de tout."

  - id: methode
    type: methode
    etapes:
      - "Cherche **qui décide** : une seule personne, ou tout le groupe par un vote ?"
      - "Regarde **comment** on vote : si chacun choisit lui-même la personne élue, c'est le **suffrage direct**."
      - "Vérifie les règles d'un vote juste : **bulletin secret**, une seule voix par personne, on compte devant tout le monde."
      - "Après le vote, on respecte le résultat, même si son candidat a perdu."
    jules: "Un bon candidat ne fait pas de promesses impossibles : « plus de devoirs », le délégué ne peut pas le décider. Il porte les idées de la classe au conseil d'élèves."

  - id: piege
    type: piege
    mauvaise_idee: "La démocratie, c'est juste voter une fois pour le délégué. Après, on n'a plus rien à dire."
    pourquoi_faux: "Le vote compte beaucoup, mais la démocratie, c'est aussi **participer** : proposer des idées, débattre au **conseil d'élèves**, respecter les règles décidées ensemble."
    bonne_idee: "En démocratie, chacun participe aux décisions : en votant, mais aussi en donnant son avis et en écoutant celui des autres."
    jules: "Autre confusion : voter, ce n'est pas obéir au plus fort ou au plus populaire. Chaque bulletin vaut une voix, celui du plus timide comme celui du plus bavard."

  - id: exemple-delegues
    type: exemple
    situation: "Dans la classe de CM1 de Mme Roux, 26 élèves votent pour élire leur délégué. Au dépouillement : Inès a 12 voix, Noé 9 voix, Sacha 4 voix, et il y a 1 bulletin blanc. Qui est élu ? Le compte est-il juste ?"
    calcul: "12 + 9 + 4 + 1 = 26 : il y a bien un bulletin par élève. Inès a le plus de voix : 12, contre 9 pour Noé et 4 pour Sacha."
    conclusion: "**Inès** est élue déléguée, au **suffrage direct** : chaque élève a voté lui-même, sans intermédiaire."
    jules: "Un **bulletin blanc**, c'est un vote où l'on ne choisit personne. On le compte, mais il ne donne de voix à aucun candidat."

  - id: exemple-maire
    type: exemple
    situation: "Le papa de Tom dit : « Dimanche, je vais voter pour élire le président de la République. » Tom demande : « Et le maire, tu l'élis directement aussi ? »"
    calcul: "Pour le président de la République, chaque citoyen vote lui-même : c'est le suffrage direct. Pour le maire, les habitants élisent d'abord les conseillers municipaux ; ce sont eux qui choisissent ensuite le maire."
    conclusion: "Le président est élu au **suffrage direct**. Le maire, non : il est élu par le **conseil municipal**."
    jules: "Pour voter, le papa de Tom passe par l'isoloir, puis met son enveloppe dans l'urne : c'est la même démarche que pour les délégués de la classe."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "À la prochaine élection des délégués, observe bien chaque étape. Tu pourras cocher sur le schéma : candidats, isoloir, urne, dépouillement, résultat."
