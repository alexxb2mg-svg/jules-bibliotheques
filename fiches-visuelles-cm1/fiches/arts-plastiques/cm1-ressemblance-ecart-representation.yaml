notion: cm1-ressemblance-ecart-representation
titre: "Ressembler ou s'écarter du réel : imiter, accentuer, interpréter, s'éloigner"
matiere: arts-plastiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 43", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: essentiel
    type: formule
    expression: "[ressemblance] + [écart voulu] → une image qui dit quelque chose"
    termes:
      "ressemblance": {couleur: vert, legende: "ce qui fait **reconnaître** la chose réelle : sa forme, ses parties (les oreilles d'un chat, la queue d'une pomme)"}
      "écart voulu": {couleur: orange, legende: "la **différence choisie** avec le réel : une couleur inventée, une forme déformée, un détail agrandi"}
    jules: "Le peintre René Magritte a écrit « Ceci n'est pas une pipe » sous un tableau de pipe, en 1929. Il a raison : on ne peut pas prendre une image de pipe dans sa main ! Une image n'est jamais la chose elle-même, c'est toujours un choix."

  - id: carte
    type: carte
    noeuds:
      - {id: representer, titre: "Représenter le réel", sous_titre: "ce n'est pas recopier : c'est choisir", principal: true}
      - {id: imiter, titre: "Imiter", sous_titre: "copier au plus près : forme, couleurs, ombre"}
      - {id: accentuer, titre: "Accentuer", sous_titre: "exagérer un détail : plus grand, plus vif"}
      - {id: interpreter, titre: "Interpréter", sous_titre: "à sa façon : touches, contours, couleurs à soi"}
      - {id: eloigner, titre: "S'éloigner", sous_titre: "tout inventer, ou presque : on reconnaît à peine"}
    liens:
      - {de: representer, vers: imiter}
      - {de: representer, vers: accentuer}
      - {de: representer, vers: interpreter}
      - {de: representer, vers: eloigner}
    jules: "Ces quatre mots vont du plus proche au plus loin du réel. Aucun n'est meilleur que les autres : chacun sert à dire autre chose."

  - id: schema-pommes
    type: schema
    titre: "La même pomme, de la plus ressemblante à la plus éloignée du réel"
    svg: "cm1-ressemblance-ecart-representation.svg"
    jules: "Paul Cézanne a peint des pommes toute sa vie, par exemple « Pommes et oranges », vers 1899 (musée d'Orsay, Paris). Il les construisait par petites touches de couleur posées côte à côte, avec des contours souvent bleutés."

  - id: schema-chat
    type: schema
    titre: "Le chat de Nina : ce qui reste du réel, ce qui change"
    svg: "cm1-ressemblance-ecart-representation-chat.svg"
    jules: "Pour vérifier qu'un écart est réussi, pose deux questions. Est-ce qu'on reconnaît encore la chose ? Qu'est-ce que l'écart fait ressentir de plus ?"

  - id: graphe-ecart
    type: graphe
    gabarit: figuratif-abstrait
    curseurs:
      - {id: curseur-ecart, nom: ecart, min: 0, max: 3, pas: 1, depart: 0}
      - {id: curseur-motif, nom: motif, min: 1, max: 3, pas: 1, depart: 3}
    lectures:
      - {si: "ecart == 0", texte: "**Imiter** : forme, couleurs et ombre copiées au plus près du réel."}
      - {si: "ecart == 1", texte: "**Accentuer** : un détail est exagéré, plus grand ou plus vif."}
      - {si: "ecart == 2", texte: "**Interpréter** : l'artiste garde le modèle mais avec ses propres couleurs et contours."}
      - {si: "ecart == 3", texte: "**S'éloigner** : on reconnaît à peine le modèle, il reste des formes et des couleurs."}
    jules: "Aucune de ces images n'est « ratée » : s'éloigner du réel, c'est un choix de l'artiste. Change de motif avec le deuxième curseur (1 visage, 2 arbre, 3 pomme) : c'est la même idée."

  - id: methode
    type: methode
    etapes:
      - "J'**observe** la chose réelle : sa forme, ses parties, ses couleurs. Je repère ce qui la fait reconnaître (pour un chat : les oreilles pointues, les moustaches)."
      - "Je **choisis** : imiter, accentuer un détail, interpréter à ma façon, ou m'éloigner du réel."
      - "Je garde ce choix jusqu'au bout, sans « corriger » mon dessin pour le rapprocher du réel."
      - "Je me demande ce que mon **écart** fait comprendre ou ressentir : la peur, le calme, la force, le mystère."
    jules: "Si tu accentues, choisis un seul détail. Une seule feuille géante se remarque bien plus que dix détails exagérés en même temps."

  - id: piege
    type: piege
    mauvaise_idee: "Mon dessin ne ressemble pas exactement au modèle : il est raté."
    pourquoi_faux: "Un dessin n'a pas besoin d'être une copie. Un **écart voulu** (une couleur, une forme, une taille) n'est pas une erreur : c'est un choix qui exprime quelque chose."
    bonne_idee: "Les chevaux de Franz Marc sont bleus, les pommes de Cézanne sont faites de touches : on les reconnaît quand même. Un **écart assumé** est réussi quand on reconnaît la chose et qu'il ajoute un sens."
    jules: "Un écart est une erreur seulement quand il n'est pas voulu. Si tu sais dire pourquoi tu l'as fait, c'est un choix."

  - id: exemple-cheval
    type: exemple
    situation: "Dans un livre d'art, Inès découvre « Le Cheval bleu I », peint par Franz Marc en 1911 (musée Lenbachhaus, Munich). Le cheval est tout bleu. Le peintre s'est-il trompé ?"
    calcul: "Ressemblance : on reconnaît un cheval (la tête, la crinière, les quatre pattes). Écart : la couleur bleue, qui n'existe pas chez les vrais chevaux."
    conclusion: "Non, c'est un **écart voulu**. Franz Marc choisissait ses couleurs pour les sentiments qu'elles donnent, pas pour copier la nature. Son cheval bleu paraît calme et rêveur."
    jules: "Essaie avec ton animal préféré : dessine-le d'une couleur qui n'est pas la sienne. Rouge, il paraît en colère ; vert, il paraît étrange ; bleu, il paraît calme."

  - id: exemple-tasse
    type: exemple
    situation: "Hugo dessine deux fois la tasse de son petit déjeuner. Dessin 1 : il la copie avec son anse, ses rayures et son ombre. Dessin 2 : il dessine une anse immense, trois fois plus grande que la tasse."
    calcul: "Dessin 1 : c'est une **imitation**, tout est à sa place et de la bonne taille. Dessin 2 : c'est une **accentuation**, un seul détail est exagéré, et on reconnaît toujours la tasse."
    conclusion: "Les deux dessins sont réussis. Le deuxième dit quelque chose en plus : cette tasse est faite pour être attrapée, même par un géant."
    jules: "Les dessinateurs de caricatures font pareil : ils agrandissent un détail qu'on remarque tout de suite. C'est de l'accentuation."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine un fruit de ta cuisine quatre fois, comme les pommes de la fiche. Imiter, accentuer, interpréter, s'éloigner : mets-les dans l'ordre sur ta feuille."
