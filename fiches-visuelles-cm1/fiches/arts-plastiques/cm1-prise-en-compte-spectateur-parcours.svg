<text class="t" x="508.0" y="194.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">tourner autour pour tout voir</text>
<text class="tl" x="12.0" y="228.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">Le rapport d'échelle</text>
<text class="ts" x="12.0" y="252.0" text-anchor="start" dominant-baseline="central" fill="#5F5E5A">(tout est dessiné à la même échelle)</text>
