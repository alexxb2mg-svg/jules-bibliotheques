<text class="t" x="156.0" y="320.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">(Vermeer)</text>
<text class="t" x="156.0" y="338.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">24 cm × 21 cm :</text>
<text class="t" x="156.0" y="356.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">on s'approche</text>
<text class="t" x="156.0" y="374.0" text-anchor="start" dominant-baseline="central" fill="#C2410C">tout près</text>
