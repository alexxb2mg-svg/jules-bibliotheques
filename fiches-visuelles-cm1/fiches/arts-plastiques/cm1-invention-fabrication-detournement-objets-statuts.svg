<svg width="100%" viewBox="0 0 680 345" xmlns="http://www.w3.org/2000/svg"><title>Une cuillère, quatre statuts</title>
<rect x="10.0" y="8.0" width="156.0" height="300.0" rx="10" fill="#FBFAF7" stroke="#D8D5CC" stroke-width="1.2"/>
<text x="88.0" y="32.0" font-size="18" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">Utilitaire</text>
<text class="t" x="88.0" y="232.0" text-anchor="middle" dominant-baseline="central">elle sert</text>
<text class="t" x="88.0" y="254.0" text-anchor="middle" dominant-baseline="central">à manger</text>
<text class="t" x="88.0" y="276.0" text-anchor="middle" dominant-baseline="central">la soupe</text>
<rect x="178.0" y="8.0" width="156.0" height="300.0" rx="10" fill="#FBFAF7" stroke="#D8D5CC" stroke-width="1.2"/>
<text x="256.0" y="32.0" font-size="18" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">Symbolique</text>
<text class="t" x="256.0" y="232.0" text-anchor="middle" dominant-baseline="central">gravée pour la</text>
<text class="t" x="256.0" y="254.0" text-anchor="middle" dominant-baseline="central">naissance de Léa :</text>
<text class="t" x="256.0" y="276.0" text-anchor="middle" dominant-baseline="central">un souvenir</text>
<rect x="346.0" y="8.0" width="156.0" height="300.0" rx="10" fill="#FBFAF7" stroke="#D8D5CC" stroke-width="1.2"/>
<text x="424.0" y="32.0" font-size="18" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">Communication</text>
<text class="t" x="424.0" y="232.0" text-anchor="middle" dominant-baseline="central">sur l'enseigne,</text>
<text class="t" x="424.0" y="254.0" text-anchor="middle" dominant-baseline="central">elle dit : « ici,</text>
<text class="t" x="424.0" y="276.0" text-anchor="middle" dominant-baseline="central">on mange »</text>
<rect x="514.0" y="8.0" width="156.0" height="300.0" rx="10" fill="#FBFAF7" stroke="#D8D5CC" stroke-width="1.2"/>
<text x="592.0" y="32.0" font-size="18" fill="#712B13" font-weight="500" text-anchor="middle" dominant-baseline="central">Artistique</text>
<text class="t" x="592.0" y="232.0" text-anchor="middle" dominant-baseline="central">sur un socle,</text>
<text class="t" x="592.0" y="254.0" text-anchor="middle" dominant-baseline="central">au musée : on la</text>
<text class="t" x="592.0" y="276.0" text-anchor="middle" dominant-baseline="central">regarde</text>
