notion: cm1-heterogeneite-coherence-plastiques
titre: "Des matériaux très différents qui vont ensemble : hétérogène et cohérent"
matiere: arts-plastiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 44", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: lien
    type: formule
    expression: "[éléments hétérogènes] + [un lien choisi] → un ensemble cohérent"
    termes:
      "éléments hétérogènes": {couleur: orange, legende: "des matériaux, objets ou images **très différents** : tissu, plastique, papier, bois, photos"}
      "un lien choisi": {couleur: vert, legende: "ce qui les relie : une **couleur**, une **forme**, un **thème** commun"}
    jules: "**Hétérogène** veut dire « fait de choses différentes ». **Cohérent** veut dire « qui va ensemble et a du sens ». Les deux mots ne sont pas contraires : un bon collage est souvent les deux à la fois."

  - id: carte
    type: carte
    noeuds:
      - {id: associer, titre: "Associer des éléments différents", sous_titre: "à plat (collage) ou en volume (assemblage)", principal: true}
      - {id: couleur, titre: "Par la couleur", sous_titre: "une ou deux couleurs qui reviennent partout"}
      - {id: forme, titre: "Par la forme", sous_titre: "des formes qui se ressemblent, ou une grande forme d'ensemble"}
      - {id: theme, titre: "Par le thème", sous_titre: "tous les éléments parlent du même sujet"}
      - {id: hasard, titre: "Pas au hasard", sous_titre: "sans lien, on voit des objets, pas une œuvre"}
    liens:
      - {de: associer, vers: couleur}
      - {de: associer, vers: forme}
      - {de: associer, vers: theme}
      - {de: associer, vers: hasard}
    jules: "Un **assemblage**, c'est un collage en volume : on fixe ensemble des objets, avec de la colle, de la ficelle ou du fil de fer. En 1942, Picasso a fait une tête de taureau avec une selle et un guidon de vélo."

  - id: schema-collages
    type: schema
    titre: "Les mêmes matériaux, deux collages : au hasard ou organisé"
    svg: "cm1-heterogeneite-coherence-plastiques.svg"
    jules: "Dans le collage 2, chaque matière garde son aspect : on reconnaît encore le tissu, le journal, les boutons. Mais chacune a une place et un rôle dans le bateau."

  - id: schema-liens
    type: schema
    titre: "Trois façons de faire tenir ensemble des éléments différents"
    svg: "cm1-heterogeneite-coherence-plastiques-liens.svg"
    jules: "Tu peux combiner les liens : même thème et mêmes couleurs, par exemple. Plus il y a de liens, plus l'ensemble paraît solide."

  - id: methode
    type: methode
    etapes:
      - "Je rassemble 3 à 5 **matériaux très différents** : un bouchon, du tissu, du papier journal, des boutons, de la ficelle."
      - "Je choisis **un lien** : une couleur commune, une grande forme à fabriquer (un bateau, un visage), ou un thème (la mer, la forêt)."
      - "Je place chaque élément pour qu'il ait un **rôle** : le bouton devient un œil, la ficelle devient une vague."
      - "Je recule et je vérifie : est-ce qu'on voit un tout, ou encore des objets posés au hasard ?"
    jules: "Place tout sans coller, prends une photo, puis déplace et compare. Tu colles seulement quand l'ensemble te plaît."

  - id: piege
    type: piege
    mauvaise_idee: "Mes matériaux sont trop différents : ils ne peuvent pas aller ensemble. Je ne garde que des papiers de couleur."
    pourquoi_faux: "**Différent** ne veut pas dire **incohérent**. La cohérence ne vient pas des matières elles-mêmes, mais du **lien** que tu crées entre elles."
    bonne_idee: "Je garde le tissu, le bouchon et le journal, et je les relie : même couleurs (bleu et blanc) et même forme d'ensemble (un bateau)."
    jules: "Si tu ne prends que des matériaux qui se ressemblent, tu n'explores pas l'hétérogénéité : l'exercice perd tout son intérêt."

  - id: exemple-arcimboldo
    type: exemple
    situation: "Au musée du Louvre, Maël regarde « L'Été », peint par Giuseppe Arcimboldo en 1573. De loin, il voit le portrait d'une personne de profil. De près, il ne voit que des fruits et des légumes."
    calcul: "Les éléments sont hétérogènes : des pêches, des cerises, des légumes, tous différents. Deux liens les relient : le **thème** (ce qui pousse en été) et la **forme** d'ensemble (un visage de profil)."
    conclusion: "Le tableau est **hétérogène** (des dizaines d'éléments différents) et **cohérent** (ils forment un visage et parlent tous de l'été)."
    jules: "Arcimboldo a peint les quatre saisons de cette façon. L'Hiver, par exemple, est un visage fait d'un vieux tronc d'arbre."

  - id: exemple-palais
    type: exemple
    situation: "Ferdinand Cheval était facteur dans la Drôme. Pendant sa tournée, il ramassait des pierres aux formes étranges. De 1879 à 1912, il a construit seul son « Palais idéal », à Hauterives. Combien d'années de travail ?"
    calcul: "1912 − 1879 = 33. Il a travaillé 33 ans, avec des pierres, des coquillages, du ciment, du fil de fer."
    conclusion: "Des matériaux très **hétérogènes**, mais un **palais cohérent** : partout, les mêmes formes de pierres arrondies, de grottes, d'animaux et de tours."
    jules: "Le Palais idéal est aujourd'hui un monument historique. Un facteur, sans être architecte, a créé une œuvre qu'on vient voir du monde entier."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : vide ta trousse ou ton bol de bricolage et choisis 5 objets très différents. Invente un lien (une couleur, une forme, un thème) et fais-en un visage sur ta table."
