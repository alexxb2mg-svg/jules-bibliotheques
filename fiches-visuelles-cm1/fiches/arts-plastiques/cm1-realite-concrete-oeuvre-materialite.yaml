    jules: "Une photo de La Joconde dans un livre, c'est du papier et de l'encre. La vraie Joconde, au Louvre, c'est de la peinture à l'huile sur une planche de bois : une autre **matérialité**."

  - id: schema-tableau
    type: schema
    titre: "Un tableau : une image de loin, de la matière de près"
    svg: "cm1-realite-concrete-oeuvre-materialite.svg"
    jules: "Van Gogh posait une peinture si épaisse que ses coups de pinceau font du relief. Dans La Nuit étoilée (1889), on voit les tourbillons du ciel, et aussi la **pâte** elle-même."

  - id: schema-hasard
    type: schema
    titre: "Du hasard à l'intention, et une image qui devient matériau"
    svg: "cm1-realite-concrete-oeuvre-materialite-hasard.svg"
    jules: "En 1912, Picasso colle un morceau de toile cirée imprimée dans un tableau et l'entoure d'une corde : c'est Nature morte à la chaise cannée. Un objet tout fait devient un morceau de l'œuvre."

  - id: methode
    type: methode
    etapes:
      - "Avant de commencer, je touche et j'essaie la **matière** : est-elle épaisse, fine, lisse, brillante ?"
      - "Je la manipule pour voir ce qu'elle permet : étaler, plier, froisser, empiler, déchirer."
      - "Pendant le travail, j'observe les accidents, une tache ou une coulure, au lieu de les effacer tout de suite."
      - "À la fin, je sépare ce qui vient du **hasard** et ce qui vient de mon **intention**, et je l'explique à voix haute."
    jules: "Garder un accident, c'est aussi une décision : à ce moment-là, le hasard devient une intention."

  - id: piege
    type: piege
    mauvaise_idee: "Une tache est tombée sur mon dessin : il est raté, je le jette."
    pourquoi_faux: "La tache vient du **hasard**, mais elle fait maintenant partie de la matière de ton dessin. Elle a une forme et une couleur : elle peut servir."
    bonne_idee: "Je regarde la tache et je cherche ce qu'elle me rappelle. Avec quelques traits, elle devient un nuage, un oiseau ou un monstre : j'en fais une **intention**."
    jules: "Victor Hugo, l'écrivain, faisait exprès des taches d'encre sur ses feuilles. Il y voyait des châteaux et des paysages, puis il les complétait."

  - id: exemple-paille
    type: exemple
    situation: "En arts plastiques, Léo fait tomber trois gouttes d'encre sur sa feuille, puis il souffle dessus avec une paille. L'encre part dans tous les sens. Il ajoute ensuite deux yeux et une bouche au feutre. Qu'est-ce qui vient du hasard, et qu'est-ce qui vient de Léo ?"
    calcul: "Hasard : la forme des gouttes, et le chemin de l'encre quand il souffle. Intention : le choix de souffler, les yeux, la bouche, et la décision de garder les traces."
    conclusion: "Le monstre de Léo mélange **hasard** et **intention** : la matière a proposé une forme, Léo a décidé ce qu'elle devenait."
    jules: "Le peintre Max Ernst posait une feuille sur un vieux parquet et frottait dessus au crayon : c'est le frottage, qu'il invente en 1925. Les veines du bois dessinaient des formes, et il y voyait des forêts et des animaux."

  - id: exemple-collage
    type: exemple
    situation: "Pour faire un poisson, Awa découpe des bandes dans un vieux magazine : du jaune, du rouge, un morceau d'écriture. Elle les colle côte à côte. Le magazine est-il encore un magazine ?"
    calcul: "Les bandes ne servent plus à lire. Elles apportent leurs **couleurs**, leurs lettres, leur papier brillant : elles sont devenues le matériau du poisson."
    conclusion: "Une image qui existait déjà peut devenir le **matériau** d'une nouvelle œuvre : c'est le principe du **collage**."
    jules: "Laisse un morceau d'écriture visible : on reconnaît que c'était un magazine, et ton poisson gagne une histoire."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : pose une feuille sur l'écorce d'un arbre ou sur une semelle de basket, et frotte avec le côté d'une craie grasse. Regarde ce que la matière a dessiné, puis complète-le pour en faire un animal."
