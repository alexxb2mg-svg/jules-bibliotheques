<circle cx="19.0" cy="222.0" r="12" fill="#1a1a18" stroke="#ffffff" stroke-width="2"/>
<text x="19.0" y="222.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">1</text>
<text class="tl" x="93.0" y="222.0" text-anchor="middle" dominant-baseline="central">Imiter</text>
<text class="t" x="85.0" y="252.0" text-anchor="middle" dominant-baseline="central">je copie ce que je vois :</text>
<text class="t" x="85.0" y="272.0" text-anchor="middle" dominant-baseline="central">forme, couleurs, ombre</text>
<circle cx="189.0" cy="222.0" r="12" fill="#1a1a18" stroke="#ffffff" stroke-width="2"/>
<text x="189.0" y="222.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">2</text>
<text class="tl" x="263.0" y="222.0" text-anchor="middle" dominant-baseline="central">Accentuer</text>
<text class="t" x="255.0" y="252.0" text-anchor="middle" dominant-baseline="central">j'exagère un détail :</text>
<text class="t" x="255.0" y="272.0" text-anchor="middle" dominant-baseline="central">ici, la feuille géante</text>
<circle cx="359.0" cy="222.0" r="12" fill="#1a1a18" stroke="#ffffff" stroke-width="2"/>
<text x="359.0" y="222.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">3</text>
<text class="tl" x="433.0" y="222.0" text-anchor="middle" dominant-baseline="central">Interpréter</text>
<text class="t" x="425.0" y="252.0" text-anchor="middle" dominant-baseline="central">je peins à ma façon :</text>
<text class="t" x="425.0" y="272.0" text-anchor="middle" dominant-baseline="central">touches, contour bleu</text>
<text class="t" x="425.0" y="292.0" text-anchor="middle" dominant-baseline="central">(comme Cézanne)</text>
<circle cx="529.0" cy="222.0" r="12" fill="#1a1a18" stroke="#ffffff" stroke-width="2"/>
<text x="529.0" y="222.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">4</text>
<text class="tl" x="603.0" y="222.0" text-anchor="middle" dominant-baseline="central">S'éloigner</text>
<text class="t" x="595.0" y="252.0" text-anchor="middle" dominant-baseline="central">forme et couleur</text>
<text class="t" x="595.0" y="272.0" text-anchor="middle" dominant-baseline="central">inventées : on la</text>
<text class="t" x="595.0" y="292.0" text-anchor="middle" dominant-baseline="central">reconnaît à sa queue</text>
