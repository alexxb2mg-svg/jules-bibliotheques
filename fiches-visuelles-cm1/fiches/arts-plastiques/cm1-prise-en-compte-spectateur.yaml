notion: cm1-prise-en-compte-spectateur
titre: "Penser à celui qui regarde : point de vue, parcours, taille et effet"
matiere: arts-plastiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 44", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: effet
    type: formule
    expression: "[d'où on regarde] + [la taille de l'œuvre] → [l'effet]"
    termes:
      "d'où on regarde": {couleur: bleu, legende: "le **point de vue** du spectateur : d'en bas, de face, d'en haut, en tournant autour"}
      "la taille de l'œuvre": {couleur: violet, legende: "le **rapport d'échelle** : l'œuvre est-elle plus petite ou plus grande que toi ?"}
      "l'effet": {couleur: orange, legende: "ce que ressent le **spectateur** : la surprise, la peur, le rire, le calme"}
    jules: "Le **spectateur**, c'est la personne qui regarde l'œuvre. Un artiste pense à lui avant même de commencer : où sera-t-il, et que doit-il ressentir ?"

  - id: carte
    type: carte
    noeuds:
      - {id: spectateur, titre: "Penser au spectateur", sous_titre: "pour produire l'effet voulu", principal: true}
      - {id: pointdevue, titre: "Le point de vue", sous_titre: "d'en bas : géant ; d'en haut : tout petit"}
      - {id: frontalite, titre: "Frontalité ou parcours", sous_titre: "regarder en face, ou tourner autour"}
      - {id: echelle, titre: "L'échelle", sous_titre: "minuscule : on s'approche ; immense : on est dedans"}
      - {id: accrochage, titre: "L'accrochage", sous_titre: "la hauteur, la lumière, la place dans la salle"}
    liens:
      - {de: spectateur, vers: pointdevue}
      - {de: spectateur, vers: frontalite}
      - {de: spectateur, vers: echelle}
      - {de: spectateur, vers: accrochage}
    jules: "Le spectateur peut rester immobile, ou devoir bouger, toucher, chercher. Plus il doit agir, plus il participe à l'œuvre."

  - id: schema-pointdevue
    type: schema
    titre: "Vu d'en bas, de face, d'en haut : le même robot, trois effets"
    svg: "cm1-prise-en-compte-spectateur.svg"
    jules: "Les gargouilles des cathédrales sont placées tout en haut : on les voit d'en bas, avec leur gueule ouverte au-dessus de nous. Vues ainsi, elles paraissent bien plus effrayantes."

  - id: schema-parcours
    type: schema
    titre: "Frontalité, parcours et rapport d'échelle"
    svg: "cm1-prise-en-compte-spectateur-parcours.svg"
    jules: "« Le Radeau de la Méduse » de Géricault (1818-1819, musée du Louvre) mesure 4,91 m sur 7,16 m. Les naufragés sont presque aussi grands que de vraies personnes : le spectateur a l'impression d'être au bord du radeau."

  - id: graphe-point-de-vue
    type: graphe
    gabarit: point-de-vue
    curseurs:
      - {id: curseur-hauteur, nom: hauteur, min: -2, max: 2, pas: 1, depart: 0}
      - {id: curseur-taille, nom: taille, min: 0.5, max: 10, pas: 0.5, depart: 5}
      - {id: curseur-distance, nom: distance, min: 5, max: 5, pas: 1, depart: 5}
    lectures:
      - {si: "hauteur < 0", texte: "Vu **d'en bas** : l'œuvre paraît grande, puissante, impressionnante."}
      - {si: "hauteur > 0", texte: "Vu **d'en haut** : l'œuvre paraît petite, fragile."}
      - {si: "taille <= 1", texte: "Plus petite que toi : on doit **s'approcher** pour la regarder."}
      - {si: "taille >= 5", texte: "Bien plus grande que toi : on se sent tout petit à côté, c'est le **rapport d'échelle**."}
    jules: "Le petit personnage mesure 1,5 m, à peu près ta taille : compare la sculpture à lui pour sentir son effet."

  - id: methode
    type: methode
    etapes:
      - "Je choisis l'**effet** que je veux produire : faire peur, faire rire, surprendre, apaiser."
      - "Je décide d'où le spectateur va regarder : **de face**, d'en bas, d'en haut, ou en **tournant autour**."
      - "Je choisis la **taille** : minuscule pour qu'on s'approche, immense pour impressionner."
      - "Je me mets à la place du spectateur : je recule, je me baisse, je tourne autour. Je vérifie que l'effet marche, sinon je change."
    jules: "Demande à un copain de regarder ta production sans rien lui dire. S'il ressent ce que tu voulais, ton effet est réussi."

  - id: piege
    type: piege
    mauvaise_idee: "Pour impressionner toute l'école dans le hall, je fais un dessin minuscule de 5 cm, que je pose sur une table basse."
    pourquoi_faux: "Pour **impressionner de loin**, l'œuvre doit se voir de loin. Un dessin de 5 cm posé bas, personne ne le remarque en passant. La **taille** et l'**accrochage** ne vont pas avec l'effet voulu."
    bonne_idee: "Grand, accroché en hauteur et bien éclairé : on le voit dès l'entrée. Minuscule et posé bas : c'est bien pour un effet secret, qui oblige à s'approcher."
    jules: "Petit n'est pas raté : « La Dentellière » de Vermeer mesure 24 cm sur 21 cm. Elle oblige le spectateur à venir tout près, comme pour regarder par-dessus l'épaule de la jeune femme."

  - id: exemple-ambassadeurs
    type: exemple
    situation: "Dans « Les Ambassadeurs » de Hans Holbein (1533, National Gallery de Londres), deux hommes posent debout. À leurs pieds flotte une grande tache allongée et bizarre. Si on regarde le tableau de face, on ne comprend pas ce que c'est."
    calcul: "Le spectateur se déplace : il se place sur le côté, tout près du mur, et regarde le tableau de biais. La tache se redresse et devient un crâne."
    conclusion: "Holbein a pensé au **parcours** du spectateur : l'œuvre garde une **surprise** pour celui qui bouge."
    jules: "Une image déformée qu'on ne comprend que d'un point de vue précis s'appelle une **anamorphose**. Tu peux en voir sur certains trottoirs : de loin, un trou dessiné semble vraiment creuser le sol."

  - id: exemple-dragon
    type: exemple
    situation: "Pour la kermesse, Élias peint un dragon sur un grand carton de 2 m de haut. Il veut faire peur aux petits de maternelle, pour rire. Où et comment le placer ?"
    calcul: "Un enfant de maternelle mesure environ 1 m. Le carton de 2 m, posé debout, est deux fois plus grand que lui. Élias peint le dragon comme s'il était vu d'en bas, la gueule ouverte vers le spectateur."
    conclusion: "Posé debout près de l'entrée, le dragon **domine** les petits : l'effet de peur (pour rire) est réussi grâce au **rapport d'échelle** et au point de vue."
    jules: "Pour faire rire au lieu de faire peur, Élias pourrait peindre le même dragon vu d'en haut, tout petit, avec de grands yeux ronds."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : photographie ton jouet préféré avec l'appareil posé par terre (vu d'en bas), puis tenu bien au-dessus de lui (vu d'en haut). Compare les deux photos : lequel paraît le plus fort ?"
