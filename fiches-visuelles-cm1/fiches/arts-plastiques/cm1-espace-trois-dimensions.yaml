notion: cm1-espace-trois-dimensions
titre: "Créer en volume : une œuvre qu'on regarde de tous les côtés"
matiere: arts-plastiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 44", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: volume, titre: "Créer en volume", sous_titre: "une forme en 3 dimensions : hauteur, largeur et profondeur", principal: true}
      - {id: techniques, titre: "Quatre façons de faire", sous_titre: "modeler, assembler, construire, installer"}
      - {id: pleinvide, titre: "Plein et vide", sous_titre: "une boule est pleine, un bol a un creux"}
      - {id: enveloppe, titre: "Enveloppe et structure", sous_titre: "la toile de la tente, et les piquets dessous"}
      - {id: equilibre, titre: "L'équilibre", sous_titre: "le plus grand et le plus lourd en bas pour tenir debout"}
    liens:
      - {de: volume, vers: techniques}
      - {de: volume, vers: pleinvide}
      - {de: volume, vers: enveloppe}
      - {de: volume, vers: equilibre}
    jules: "Un dessin est plat : il a une hauteur et une largeur. Une sculpture a en plus une **profondeur** : tu peux passer ta main derrière."

  - id: schema-vues
    type: schema
    titre: "Une sculpture vue de face, de côté, de dessus ; ronde-bosse et bas-relief"
    svg: "cm1-espace-trois-dimensions.svg"
    jules: "De face, le bras tendu vers toi n'est qu'un rond : il faut tourner autour pour le voir en entier. Le Penseur de Rodin est une **ronde-bosse** ; le côté face d'une pièce de monnaie est un petit **bas-relief**."

  - id: schema-plein-vide
    type: schema
    titre: "Plein et vide, enveloppe et structure, équilibre"
    svg: "cm1-espace-trois-dimensions-plein-vide.svg"
    jules: "La tour Eiffel, construite pour l'Exposition universelle de 1889, est une **structure** en fer : on voit le ciel à travers. Elle est pleine de vides, et pourtant elle tient debout depuis plus de 130 ans."

  - id: graphe-equilibre
    type: graphe
    gabarit: equilibre-empilement
    curseurs:
      - {id: curseur-decalage, nom: decalage, min: -4, max: 4, pas: 0.5, depart: 0}
    lectures:
      - {si: "decalage == 0", texte: "Bloc bien centré : la construction est **en équilibre**, très stable."}
      - {si: "decalage >= -2 && decalage <= 2 && decalage != 0", texte: "Le point rouge est encore au-dessus de la base : ça **tient**, même si c'est moins stable."}
      - {si: "decalage > 2", texte: "Le point rouge est sorti de la base : la construction **bascule** à droite (**déséquilibre**)."}
      - {si: "decalage < -2", texte: "Le point rouge est sorti de la base : la construction **bascule** à gauche (**déséquilibre**)."}
    jules: "Avant de coller ou d'empiler, cherche où est le milieu de ton bloc : tant qu'il reste au-dessus de ce qui le porte, ta construction tient."

  - id: methode
    type: methode
    etapes:
      - "Je choisis ma technique : **modeler** de la pâte, **assembler** des objets, construire avec du carton ou des baguettes."
      - "Je décide : une forme fermée, toute pleine, ou une forme ouverte, avec du **vide** qu'on voit."
      - "Je construis en pensant à **l'équilibre** : une base large, le plus grand et le plus lourd en bas."
      - "Je tourne autour de ma production : devant, les deux côtés, le dos, le dessus. Chaque côté doit être travaillé."
    jules: "Pose ta sculpture sur une feuille et fais tourner la feuille : c'est plus facile que de tourner autour de la table."

  - id: piege
    type: piege
    mauvaise_idee: "Mon chat en pâte à modeler est réussi : vu de face, il est parfait."
    pourquoi_faux: "Une sculpture se regarde de **tous les côtés**. Si le dos est plat ou oublié, c'est comme un dessin posé debout, pas un vrai volume."
    bonne_idee: "Je tourne autour et je modèle aussi le dos, la queue et le dessous des pattes : mon chat est une **ronde-bosse**."
    jules: "Le bas-relief est l'exception : il est fait pour être vu de face, car il sort à peine d'un mur ou d'un fond."

  - id: exemple-bol
    type: exemple
    situation: "Avec la même quantité de pâte à modeler, Chloé fait une boule. Puis elle creuse la boule avec son pouce pour en faire un petit bol. Qu'est-ce qui a changé ?"
    calcul: "La boule est une **forme fermée** : que du plein, on ne voit pas l'intérieur. Le bol est une **forme ouverte** : un creux, du vide, entouré d'une paroi de pâte."
    conclusion: "Même pâte, même quantité, mais pas la même organisation : le bol fait entrer le **vide** dans la sculpture."
    jules: "La paroi du bol, c'est son **enveloppe** : une peau de matière tout autour du vide."

  - id: exemple-tour
    type: exemple
    situation: "Karim et Jade doivent construire la tour la plus haute avec 6 boîtes : 2 grandes, 2 moyennes et 2 petites. La tour de Karim tombe à la troisième boîte. Pourquoi ? Comment faire ?"
    calcul: "Karim a mis les petites boîtes en bas : la base est étroite, le haut est trop lourd, la tour penche. Jade pose les 2 grandes en bas, puis les 2 moyennes, puis les 2 petites."
    conclusion: "La tour de Jade tient debout avec les 6 boîtes : une **base large** et le plus lourd en bas donnent **l'équilibre**."
    jules: "Les bâtisseurs font pareil : les pyramides d'Égypte sont larges en bas et pointues en haut, et elles tiennent depuis plus de 4 000 ans."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Une installation, c'est une œuvre où l'on marche au milieu, comme Les Deux Plateaux de Daniel Buren (1986), au Palais-Royal à Paris : des colonnes rayées de hauteurs différentes. Défi : installe des boîtes et des rouleaux dans ta chambre, puis fais visiter ton installation à ta famille."
