notion: cm1-autonomie-geste-graphique
titre: "Le geste : la trace de ta main, original, copie, multiple et série"
matiere: arts-plastiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 42-43", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: trace
    type: formule
    expression: "[vitesse] + [pression] + [outil] → la trace"
    termes:
      "vitesse": {couleur: orange, legende: "le **geste** rapide ou lent : un trait vif s'effile, un trait lent peut trembler"}
      "pression": {couleur: violet, legende: "appuyer fort ou léger : un trait **appuyé** est foncé et épais, un trait léger est pâle et fin"}
      "outil": {couleur: bleu, legende: "crayon, feutre, pinceau, craie, doigts : chaque **outil** laisse sa propre trace"}
    jules: "Le **geste**, c'est la façon dont ta main bouge : vite ou lentement, fort ou doucement, d'un seul trait ou par petites touches. Change un seul de ces trois ingrédients, et la trace change."

  - id: carte
    type: carte
    noeuds:
      - {id: geste, titre: "Le geste", sous_titre: "la façon dont la main bouge", principal: true}
      - {id: traces, titre: "Des traces variées", sous_titre: "points, hachures, taches, traits vifs ou lents"}
      - {id: volume, titre: "En volume aussi", sous_titre: "pincer, lisser, creuser la pâte à modeler"}
      - {id: original, titre: "Original et copie", sous_titre: "l'œuvre unique, et celle qui l'imite"}
      - {id: serie, titre: "Multiple et série", sous_titre: "plusieurs exemplaires, ou plusieurs œuvres liées"}
    liens:
      - {de: geste, vers: traces}
      - {de: geste, vers: volume}
      - {de: geste, vers: original}
      - {de: geste, vers: serie}
    jules: "Le geste laisse une trace qu'aucune autre main ne refait pareil. C'est pour cela qu'un dessin fait à la main est toujours unique."

  - id: schema-traces
    type: schema
    titre: "Une page de traces : chaque geste, avec l'outil qui le fait"
    svg: "cm1-autonomie-geste-graphique.svg"
    jules: "Georges Seurat a peint « Un dimanche après-midi à l'île de la Grande Jatte » (1884-1886) avec des milliers de petits points de couleur. Van Gogh, lui, a peint « La Nuit étoilée » (1889) avec des touches épaisses qui tourbillonnent."

  - id: schema-serie
    type: schema
    titre: "Original, copie, multiple, série : quatre mots, quatre vagues"
    svg: "cm1-autonomie-geste-graphique-serie.svg"
    jules: "« La Grande Vague » d'Hokusai (vers 1831) est une estampe : l'image est gravée dans une planche de bois, encrée, puis imprimée sur papier, comme un tampon géant. Il en existe des exemplaires dans plusieurs musées du monde."

  - id: methode
    type: methode
    etapes:
      - "Je choisis un **sujet** simple : une vague, un rond, un arbre."
      - "Je le trace une première fois avec un **geste lent** et léger."
      - "Je le trace une deuxième fois avec un **geste rapide** et appuyé, ou avec un autre outil."
      - "Je compare : épaisseur, couleur, régularité. Je dis ce que le geste a changé, et ce que chaque trace fait ressentir (calme, énergie, colère)."
    jules: "Avec de la pâte à modeler, c'est pareil : un même oiseau pincé du bout des doigts ou lissé avec le pouce n'a pas du tout le même air."

  - id: piege
    type: piege
    mauvaise_idee: "Il existe un seul bon geste pour bien dessiner : le trait lent, propre et régulier."
    pourquoi_faux: "Chaque **geste** donne un effet différent. Un trait lent donne du calme, un trait vif donne de l'énergie, des points donnent de la lumière. Aucun n'est « le bon » : on le choisit selon ce qu'on veut montrer."
    bonne_idee: "Seurat peignait par petits points, Van Gogh par touches épaisses et tourbillonnantes : deux gestes opposés, deux **grands peintres**."
    jules: "Varie la vitesse et la pression. Si tu dessines toujours pareil, tu te prives de la moitié des effets possibles."

  - id: exemple-vague
    type: exemple
    situation: "Malo trace trois fois la même vague au feutre : une fois très vite, une fois lentement, une fois en appuyant très fort. Les trois vagues sont-elles identiques ?"
    calcul: "Vite : le trait est fin, tendu, et s'effile au bout. Lentement : le trait est régulier mais tremble un peu. Appuyé : le trait est épais et foncé."
    conclusion: "Non : les trois vagues sont **uniques**. Mises côte à côte, elles forment une petite **série** : le même sujet, un geste différent à chaque fois."
    jules: "Même si Malo essayait de refaire deux fois exactement la même vague, il n'y arriverait pas : aucune main ne refait jamais le même tracé."

  - id: exemple-monet
    type: exemple
    situation: "Dans un livre d'art, Jade voit plusieurs tableaux de Claude Monet qui représentent tous des meules de foin dans un champ. Pourquoi peindre le même sujet plusieurs fois ?"
    calcul: "En 1890 et 1891, Monet a peint plus de vingt tableaux des meules, près de chez lui, à Giverny. Il les peignait le matin, le soir, en été, sous la neige, avec des touches rapides, car la lumière change vite."
    conclusion: "C'est une **série** : le même sujet, et chaque tableau est un **original** différent, avec sa lumière et ses couleurs."
    jules: "Une série n'est pas un multiple. Un multiple, ce sont des exemplaires presque identiques (des estampes, des bronzes coulés dans le même moule). Une série, ce sont des œuvres différentes sur un même sujet."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : fabrique ta page de traces. Avec un seul crayon, trouve au moins six traces différentes, et écris sous chacune le geste qui l'a faite."
