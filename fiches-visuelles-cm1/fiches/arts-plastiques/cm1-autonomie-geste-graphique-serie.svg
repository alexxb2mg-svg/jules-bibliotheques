<text class="ts" x="438.0" y="152.0" text-anchor="middle" dominant-baseline="central">l'original</text>
<text class="ts" x="578.0" y="152.0" text-anchor="middle" dominant-baseline="central">la copie d'Emma</text>
<text class="t" x="508.0" y="178.0" text-anchor="middle" dominant-baseline="central">Elle lui ressemble, mais le geste</text>
<text class="t" x="508.0" y="198.0" text-anchor="middle" dominant-baseline="central">n'est jamais tout à fait le même.</text>
