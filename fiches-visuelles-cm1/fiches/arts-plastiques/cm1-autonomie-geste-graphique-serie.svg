<text class="ts" x="408.0" y="352.0" text-anchor="middle" dominant-baseline="central">vite</text>
<text class="ts" x="508.0" y="352.0" text-anchor="middle" dominant-baseline="central">lent</text>
<text class="ts" x="608.0" y="352.0" text-anchor="middle" dominant-baseline="central">appuyé</text>
<text class="t" x="508.0" y="380.0" text-anchor="middle" dominant-baseline="central">Le même sujet, un geste différent</text>
<text class="t" x="508.0" y="400.0" text-anchor="middle" dominant-baseline="central">à chaque fois : 3 œuvres liées,</text>
<text class="t" x="508.0" y="420.0" text-anchor="middle" dominant-baseline="central">comme les Meules de Monet.</text>
