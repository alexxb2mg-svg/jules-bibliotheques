<text class="t" x="172.0" y="368.0" text-anchor="middle" dominant-baseline="central">Un même tampon imprime des</text>
<text class="t" x="172.0" y="388.0" text-anchor="middle" dominant-baseline="central">exemplaires presque identiques,</text>
<text class="t" x="172.0" y="408.0" text-anchor="middle" dominant-baseline="central">comme les estampes d'Hokusai.</text>
