<text class="t" x="172.0" y="168.0" text-anchor="middle" dominant-baseline="central">Léo peint une vague.</text>
<text class="t" x="172.0" y="188.0" text-anchor="middle" dominant-baseline="central">Elle est unique : faite à la main,</text>
<text class="t" x="172.0" y="208.0" text-anchor="middle" dominant-baseline="central">une seule fois.</text>
<rect x="378.0" y="52.0" width="120.0" height="90.0" rx="0" fill="#ffffff" stroke="#1a1a18" stroke-width="1.5"/>
<path d="M388.0 114.0 C 411.4 114.0, 415.0 81.6, 443.8 78.0 C 470.8 76.2, 478.0 103.2, 461.8 108.6 C 451.0 112.2, 447.4 97.8, 456.4 96.0" fill="none" stroke="#1E3F8A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
