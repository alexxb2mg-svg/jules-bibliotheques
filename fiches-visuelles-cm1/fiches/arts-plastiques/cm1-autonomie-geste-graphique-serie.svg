<text class="tl" x="28.0" y="252.0" text-anchor="start" dominant-baseline="central" fill="#854F0B">Multiple</text>
<rect x="348.0" y="230.0" width="320.0" height="214.0" rx="10" fill="#FBFAF6" stroke="#D8D5CB" stroke-width="1"/>
<text class="tl" x="364.0" y="252.0" text-anchor="start" dominant-baseline="central" fill="#854F0B">Série</text>
