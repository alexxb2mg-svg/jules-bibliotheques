notion: cm1-narration-visuelle
titre: "Raconter avec des images : cases, cadrages, hors-champ et images animées"
matiere: arts-plastiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 43", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: recit
    type: formule
    expression: "[début] → [milieu] → [fin] : une histoire en images"
    termes:
      "début": {couleur: bleu, legende: "on présente le **lieu** et les personnages : souvent en plan large"}
      "milieu": {couleur: orange, legende: "il se passe quelque chose : un **problème**, une action, une surprise"}
      "fin": {couleur: vert, legende: "ce que l'action a changé : on doit **comprendre** comment l'histoire se termine"}
    jules: "La **narration visuelle**, c'est raconter une histoire ou un souvenir avec des images, même sans aucun texte. L'ordre des images fait tout : mélange-les, et l'histoire ne veut plus rien dire."

  - id: carte
    type: carte
    noeuds:
      - {id: raconter, titre: "Raconter en images", sous_titre: "une histoire ou un témoignage, sans forcément écrire", principal: true}
      - {id: ordre, titre: "L'ordre", sous_titre: "avant, pendant, après : on lit de gauche à droite"}
      - {id: cadrage, titre: "Le cadrage", sous_titre: "plan large pour le lieu, gros plan pour l'émotion"}
      - {id: horschamp, titre: "Le hors-champ", sous_titre: "ce qu'on ne voit pas, mais qu'on devine"}
      - {id: anime, titre: "Les images animées", sous_titre: "séquençage, ralenti, accéléré"}
    liens:
      - {de: raconter, vers: ordre}
      - {de: raconter, vers: cadrage}
      - {de: raconter, vers: horschamp}
      - {de: raconter, vers: anime}
    jules: "On peut aussi raconter en volume : avec des figurines ou de la pâte à modeler, on installe une petite scène et on la prend en photo."

  - id: schema-bd
    type: schema
    titre: "Une bande dessinée en 3 cases : plan large, gros plan, hors-champ"
    svg: "cm1-narration-visuelle.svg"
    jules: "Le **hors-champ**, c'est tout ce qui existe dans l'histoire mais reste en dehors de la case. Ici, on ne voit ni Lou ni le chien en train de manger : pourtant, tout le monde a compris !"

  - id: schema-ralenti
    type: schema
    titre: "Ralenti et accéléré : le même rebond en 6, 12 ou 3 images"
    svg: "cm1-narration-visuelle-ralenti.svg"
    jules: "Au cinéma, on projette 24 images par seconde : l'œil ne voit plus les images une par une, il voit un mouvement. Un folioscope (un petit carnet qu'on feuillette très vite) marche de la même façon."

  - id: graphe-images
    type: graphe
    gabarit: decomposition-mouvement
    curseurs:
      - {id: curseur-images, nom: images, min: 3, max: 12, pas: 1, depart: 12}
      - {id: curseur-vitesse, nom: vitesse, min: 0.5, max: 2, pas: 0.5, depart: 1}
    lectures:
      - {si: "images <= 4", texte: "Peu d'images : la balle saute d'une place à l'autre, le mouvement est **saccadé**."}
      - {si: "images >= 10", texte: "Beaucoup d'images : la balle glisse, le mouvement paraît **fluide**."}
      - {si: "vitesse < 1", texte: "Défilement lent : c'est un **ralenti**, l'action dure plus longtemps à l'écran."}
      - {si: "vitesse > 1", texte: "Défilement rapide : c'est un **accéléré**, l'action semble pressée."}
    jules: "Regarde les deux barres du bas : la grise, c'est le temps du vrai rebond ; la bleue, le temps à l'écran."

  - id: methode
    type: methode
    etapes:
      - "Je choisis l'histoire, ou le souvenir, que je veux raconter. Je la dis en une phrase."
      - "Je la découpe en **moments clés** : un début, un milieu, une fin (3 cases, c'est un bon départ)."
      - "Pour chaque case, je choisis un **cadrage** : plan large pour montrer le lieu, gros plan pour montrer un détail ou une émotion."
      - "Je place les images dans l'**ordre**, je les numérote, puis je fais lire mon histoire à quelqu'un sans rien expliquer."
    jules: "Si ton lecteur a besoin de tes explications pour comprendre, il manque une image, ou une image est mal placée. Ajoute-la, ou change l'ordre."

  - id: piege
    type: piege
    mauvaise_idee: "Une seule image suffit pour raconter toute mon histoire : le réveil, l'école, le goûter et le match de foot."
    pourquoi_faux: "Une image montre un seul moment. Pour une histoire avec plusieurs étapes, il faut **plusieurs images**, dans l'ordre, avec un début et une fin bien visibles."
    bonne_idee: "Je découpe : case 1, le réveil ; case 2, l'école ; case 3, le goûter ; case 4, le match. Chaque case montre **un seul moment**."
    jules: "Pour vérifier l'ordre, mélange tes cases et demande à un copain de les remettre en place. S'il y arrive, ton histoire est claire."

  - id: exemple-bayeux
    type: exemple
    situation: "Dans son livre d'histoire, Nour découvre la « tapisserie » de Bayeux, une broderie de la fin du XIe siècle. C'est une bande de toile de près de 70 m de long et d'environ 50 cm de haut. Comment peut-elle raconter une guerre sans bulles ?"
    calcul: "Les scènes se suivent de gauche à droite, comme des cases sans cadre : les bateaux qui traversent la mer, l'arrivée en Angleterre, la bataille d'Hastings en 1066. Au-dessus des scènes, quelques mots en latin nomment les personnages et les lieux."
    conclusion: "C'est une **narration visuelle** : les images, placées dans l'**ordre**, racontent la conquête de l'Angleterre par Guillaume, duc de Normandie."
    jules: "Presque mille ans avant les bandes dessinées, on racontait déjà des histoires en images qui se suivent. Rodolphe Töpffer, un dessinateur de Genève, est souvent présenté comme l'inventeur de la bande dessinée, vers 1830."

  - id: exemple-trajet
    type: exemple
    situation: "Léna veut raconter son trajet du matin, de la maison jusqu'à l'école, en 3 images, sans écrire un seul mot. Que doit-elle dessiner ?"
    calcul: "Case 1, plan large : sa maison, et Léna qui sort avec son cartable. Case 2 : le passage piéton, le feu est rouge, elle attend. Case 3, plan large : la grille de l'école et les copains dans la cour."
    conclusion: "Trois **moments clés** dans l'ordre : départ, trajet, arrivée. Quelqu'un qui regarde ses cases comprend le trajet sans explication."
    jules: "Pour montrer qu'elle est pressée, Léna peut ajouter un gros plan sur une horloge qui marque 8 h 25. Un seul détail bien cadré raconte beaucoup."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dans le coin d'un vieux cahier, dessine sur 10 pages une balle qui descend un peu à chaque page, puis remonte. Feuillette vite : ta balle rebondit !"
