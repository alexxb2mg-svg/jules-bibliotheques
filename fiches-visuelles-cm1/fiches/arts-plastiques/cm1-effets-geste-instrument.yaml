notion: cm1-effets-geste-instrument
titre: "Le geste et l'instrument : chaque outil laisse sa trace"
matiere: arts-plastiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 45", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: trace, titre: "La trace", sous_titre: "la marque laissée sur le support par un outil et un geste", principal: true}
      - {id: outils, titre: "Les instruments", sous_titre: "pinceau, brosse, éponge, couteau, doigt, outil inventé"}
      - {id: effets, titre: "Les effets", sous_titre: "touche, traînée, texture, griffure, coulure"}
      - {id: ample, titre: "Ample ou retenu", sous_titre: "tout le bras bouge, ou seulement le poignet"}
      - {id: maitrise, titre: "Maîtrisé ou imprévisible", sous_titre: "je décide tout, ou je laisse la peinture faire"}
    liens:
      - {de: trace, vers: outils}
      - {de: trace, vers: effets}
      - {de: trace, vers: ample}
      - {de: trace, vers: maitrise}
    jules: "Le mot « instrument » est plus large que « pinceau » : ta main, un bâton, une vieille carte en plastique ou une plume peuvent aussi peindre."

  - id: schema-outils
    type: schema
    titre: "La même peinture, six instruments, six traces"
    svg: "cm1-effets-geste-instrument.svg"
    jules: "Pour comparer, garde la même peinture et la même feuille : seul l'instrument change. Une **griffure** se fait dans la peinture encore fraîche, en grattant avec des dents ou une pointe."

  - id: schema-geste
    type: schema
    titre: "Geste ample ou retenu, maîtrisé ou imprévisible"
    svg: "cm1-effets-geste-instrument-ample.svg"
    jules: "Vers 1947-1950, Jackson Pollock pose sa toile au sol et fait couler la peinture d'un bâton en marchant autour. Son geste est **ample**, et la peinture décide une partie de la trace."

  - id: graphe
    type: graphe
    gabarit: trace-geste
    curseurs:
      - {id: curseur-amplitude, nom: amplitude, min: 1, max: 5, pas: 1, depart: 2}
      - {id: curseur-pression, nom: pression, min: 1, max: 5, pas: 1, depart: 3}
      - {id: curseur-hasard, nom: hasard, min: 0, max: 5, pas: 1, depart: 0}
    lectures:
      - {si: "amplitude >= 4", texte: "Geste **ample** : la trace s'étire sur toute la feuille, elle est énergique."}
      - {si: "amplitude <= 2", texte: "Geste **retenu** : la trace est petite et précise."}
      - {si: "pression >= 4", texte: "Tu **appuies** fort : la trace devient plus épaisse et plus foncée."}
      - {si: "hasard >= 3", texte: "Geste **libre** : coulures et éclaboussures apparaissent, à toi de choisir ce que tu gardes."}
    jules: "Amplitude 1, c'est un petit geste du poignet ; 5, un grand geste de tout le bras. Change un seul curseur à la fois pour voir ce que fait chaque réglage sur la trace."

  - id: methode
    type: methode
    etapes:
      - "Je choisis un **médium**, c'est-à-dire la matière qui colore (peinture, encre), et plusieurs instruments pour le poser."
      - "J'essaie chaque instrument sur la même feuille, en variant le geste : grand ou petit, rapide ou lent, appuyé ou léger."
      - "J'observe et je nomme les traces : **touche**, traînée, **texture**, griffure, coulure."
      - "Je garde l'instrument et le geste qui donnent l'effet que je cherche : du vent, de l'herbe, de la pluie."
    jules: "Un nuage doux se tamponne à l'éponge, des herbes se griffent à la fourchette, et la pluie se fait avec des coulures, feuille debout."

  - id: piege
    type: piege
    mauvaise_idee: "Pour bien peindre, il faut toujours un pinceau, et faire toujours le même petit geste bien propre."
    pourquoi_faux: "Chaque instrument et chaque geste donnent une **trace** différente. Avec un seul outil et un seul geste, tous tes dessins se ressemblent."
    bonne_idee: "J'essaie l'éponge, le couteau, le doigt et un grand geste du bras, puis je choisis **l'effet** qui va avec mon idée."
    jules: "Pierre Soulages peignait avec des brosses de peintre en bâtiment, des raclettes et des outils qu'il fabriquait lui-même. Ses grandes toiles noires sont pleines de sillons laissés par ces outils."

  - id: exemple-eponge
    type: exemple
    situation: "Nina trace la même ligne bleue deux fois : une fois au pinceau fin, une fois en tamponnant avec une éponge. Les deux traces sont-elles pareilles ?"
    calcul: "Pinceau fin : une ligne nette, fine et régulière. Éponge : une bande pleine de petits points et de trous, avec des bords flous."
    conclusion: "Non : c'est la même peinture, mais **l'instrument** change la trace. L'éponge donne une **texture**, le pinceau une ligne nette."
    jules: "Les trous de l'éponge laissent passer le blanc du papier : c'est ce qui crée la texture."

  - id: exemple-tourbillon
    type: exemple
    situation: "Sur une grande feuille au mur, Hugo peint un tourbillon en bougeant tout le bras. Puis, sur son cahier, il en peint un petit en bougeant seulement le poignet. Qu'est-ce qui change ?"
    calcul: "Tout le bras : un geste **ample**, la trace est grande, large, pleine d'élan. Le poignet seul : un geste **retenu**, la trace est petite, précise et serrée."
    conclusion: "Le même motif ne donne pas la même impression : **l'amplitude** du geste change la trace."
    jules: "Pour un geste ample, mets-toi debout devant une grande feuille. Assis devant un petit cahier, ton bras n'a pas la place de bouger."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : invente un outil ! Une pince à linge qui tient un bout de laine, une ficelle ou une plume feront l'affaire. Teste-le, puis donne un nom à sa trace."
