<text class="t" x="567.0" y="404.0" text-anchor="middle" dominant-baseline="central">Pablo Picasso, 1942</text>
<text class="ts" x="567.0" y="424.0" text-anchor="middle" dominant-baseline="central">(schéma, pas l'œuvre)</text>
<g class="c-gray"><text class="t" x="226.0" y="404.0" text-anchor="middle" dominant-baseline="central">Même objet, autre usage ou autre sens :</text></g>
