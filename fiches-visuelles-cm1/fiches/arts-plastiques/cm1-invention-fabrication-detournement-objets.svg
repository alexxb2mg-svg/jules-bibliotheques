<text class="tl" x="567.0" y="22.0" text-anchor="middle" dominant-baseline="central">Selle et guidon</text>
<g class="c-blue"><text class="t" x="567.0" y="158.0" text-anchor="middle" dominant-baseline="central">ils servent à rouler</text></g>
