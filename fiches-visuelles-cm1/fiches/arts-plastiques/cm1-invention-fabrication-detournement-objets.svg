<text class="tl" x="113.0" y="22.0" text-anchor="middle" dominant-baseline="central">Boîte à chaussures</text>
<g class="c-blue"><text class="t" x="113.0" y="158.0" text-anchor="middle" dominant-baseline="central">elle sert à ranger</text></g>
