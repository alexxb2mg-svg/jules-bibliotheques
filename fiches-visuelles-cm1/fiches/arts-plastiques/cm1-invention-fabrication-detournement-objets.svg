<g class="c-gray"><text class="t" x="113.0" y="218.0" text-anchor="middle" dominant-baseline="central">on la tourne, on peint</text></g>
<text class="tl" x="340.0" y="22.0" text-anchor="middle" dominant-baseline="central">Cuillère en bois</text>
<g class="c-blue"><text class="t" x="340.0" y="158.0" text-anchor="middle" dominant-baseline="central">elle sert à cuisiner</text></g>
<line x1="340.0" y1="172.0" x2="340.0" y2="204.0" stroke="#5f5e5a" stroke-width="2" stroke-linecap="round" marker-end="url(#fl)"/>
