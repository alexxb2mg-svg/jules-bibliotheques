notion: cm1-invention-fabrication-detournement-objets
titre: "Détourner un objet : lui donner un autre usage ou un autre sens"
matiere: arts-plastiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 44", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: recette
    type: formule
    expression: "[objet du quotidien] + [nouveau sens] = objet détourné"
    termes:
      "objet du quotidien": {couleur: bleu, legende: "un objet fabriqué pour **servir** à quelque chose : une boîte, une cuillère, une selle de vélo"}
      "nouveau sens": {couleur: orange, legende: "un autre usage ou une autre histoire : la boîte devient un **théâtre**, la selle devient une tête de taureau"}
    jules: "Le mot vient de « tourner » : on fait prendre à l'objet un autre chemin que celui prévu. On le reconnaît encore, mais il raconte autre chose."

  - id: carte
    type: carte
    noeuds:
      - {id: detourner, titre: "Détourner un objet", sous_titre: "lui donner un autre usage ou un autre sens", principal: true}
      - {id: forme, titre: "Forme et fonction", sous_titre: "la forme fait penser à autre chose : un guidon ressemble à des cornes"}
      - {id: statuts, titre: "Quatre statuts", sous_titre: "utilitaire, symbolique, de communication, artistique"}
      - {id: gestes, titre: "Les gestes", sous_titre: "retourner, peindre, assembler, déformer"}
      - {id: raconter, titre: "Pour raconter", sous_titre: "une histoire, une idée, un rêve"}
    liens:
      - {de: detourner, vers: forme}
      - {de: detourner, vers: statuts}
      - {de: detourner, vers: gestes}
      - {de: detourner, vers: raconter}
    jules: "En 1913, Marcel Duchamp fixe une roue de vélo, avec sa fourche, sur un tabouret de cuisine : c'est la Roue de bicyclette. On ne peut plus ni rouler ni s'asseoir, on regarde : l'objet est devenu une **œuvre**."

  - id: schema-avant-apres
    type: schema
    titre: "Avant, après : trois objets du quotidien détournés"
    svg: "cm1-invention-fabrication-detournement-objets.svg"
    jules: "En 1942, Picasso retourne une vieille selle de vélo et pose un guidon au-dessus : c'est Tête de taureau, au musée Picasso, à Paris. Le dessin montre seulement l'idée, pas l'œuvre. Cherche sa photo avec ton enseignant : tu reconnaîtras la selle et le guidon."

  - id: schema-statuts
    type: schema
    titre: "Une même cuillère, quatre statuts"
    svg: "cm1-invention-fabrication-detournement-objets-statuts.svg"
    jules: "Le **statut** d'un objet, c'est le rôle qu'on lui donne. Il change selon l'endroit où l'objet est placé et selon ce qu'on en fait."

  - id: methode
    type: methode
    etapes:
      - "Je choisis un objet du quotidien et j'observe sa **forme** : à quoi me fait-elle penser ? Une tête, un bateau, un chapeau ?"
      - "Je dis sa **fonction** de départ : à quoi sert-il vraiment ? Une boîte sert à ranger, une cuillère sert à manger."
      - "J'imagine un nouvel usage ou un nouveau sens, puis je le **transforme** : je le retourne, je le peins, je l'assemble à un autre objet."
      - "Je vérifie : l'objet de départ se reconnaît encore, mais il **raconte** autre chose. Je sais le dire en une phrase."
    jules: "Commence toujours par regarder la forme : Picasso a vu des cornes dans un guidon avant de fabriquer quoi que ce soit."

  - id: piege
    type: piege
    mauvaise_idee: "Je colle trois bouchons sur une boîte de mouchoirs : j'ai fait un détournement."
    pourquoi_faux: "La boîte sert toujours à ranger des mouchoirs, et les bouchons ne veulent rien dire. Coller ne suffit pas : il faut un **nouveau sens** ou un **nouvel usage**."
    bonne_idee: "Les bouchons deviennent deux yeux et un nez, l'ouverture devient une bouche : la boîte est un **monstre glouton** qui avale les papiers de la classe."
    jules: "Pour vérifier, raconte ton objet en une phrase qui commence par « C'est un… qui… ». Si tu ne trouves rien à dire, il manque le nouveau sens."

  - id: exemple-theatre
    type: exemple
    situation: "Pour la fête de l'école, Inès récupère une vieille boîte à chaussures. Elle la pose sur le côté, peint l'intérieur, colle deux rideaux en papier rouge et fait bouger des personnages en papier. Qu'a-t-elle fait ?"
    calcul: "Avant : un objet **utilitaire**, qui sert à ranger des chaussures. Après : un décor qui sert à raconter une histoire. La forme a peu changé, mais la fonction a changé."
    conclusion: "Inès a **détourné** la boîte : elle est devenue un petit théâtre, un objet artistique qui raconte."
    jules: "Plus l'objet de départ se reconnaît, plus le détournement surprend : tout le monde voit une boîte à chaussures, et pourtant c'est un théâtre."

  - id: exemple-arbre
    type: exemple
    situation: "Pour la journée de l'environnement, la classe de Malo assemble 30 bouteilles en plastique vides pour construire un grand arbre dans le hall de l'école. Quel est le sens de cet objet ?"
    calcul: "Les bouteilles sont des **déchets** : elles ne servent plus. Assemblées en arbre, elles rappellent la nature qu'on veut protéger. Les visiteurs comprennent le message sans lire un seul mot."
    conclusion: "Les bouteilles ont changé de statut : de déchets, elles sont devenues un objet **symbolique** et de **communication**."
    jules: "Un objet symbolique représente une idée plus grande que lui, comme la colombe représente la paix."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi à la maison : prends une passoire, un gant ou une pince à linge. Cherche ce que sa forme te rappelle, puis dessine l'objet avant et après sa transformation."
