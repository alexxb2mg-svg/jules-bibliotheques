<text class="t" x="115.0" y="386.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C" font-weight="600">il paraît géant :</text>
<text class="t" x="115.0" y="406.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C" font-weight="600">il impressionne,</text>
<text class="t" x="115.0" y="426.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C" font-weight="600">il fait peur</text>
<text class="t" x="340.0" y="386.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C" font-weight="600">d'égal à égal :</text>
<text class="t" x="340.0" y="406.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C" font-weight="600">on se regarde,</text>
<text class="t" x="340.0" y="426.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C" font-weight="600">c'est calme</text>
<text class="t" x="565.0" y="386.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C" font-weight="600">il paraît petit :</text>
<text class="t" x="565.0" y="406.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C" font-weight="600">fragile, ou drôle</text>
<text class="ts" x="340.0" y="458.0" text-anchor="middle" dominant-baseline="central">bleu : d'où je regarde  ·  orange : l'effet sur le spectateur</text>
