blocs:
  - id: recette
    type: formule
    expression: "[pigment] + [liant] = de la peinture"
    termes:
      "pigment": {couleur: bleu, legende: "la **poudre colorée** : de la terre (les ocres), une pierre broyée (le lapis-lazuli du bleu outremer), une plante, un insecte"}
      "liant": {couleur: orange, legende: "ce qui colle la poudre au support : de la **gomme arabique** pour la gouache et l'aquarelle, de l'huile de lin pour la peinture à l'huile"}
    jules: "Sans liant, le pigment retomberait en poussière en séchant. Certains peintres ajoutent aussi un **siccatif**, qui fait sécher la peinture plus vite."

  - id: carte
    type: carte
    noeuds:
      - {id: couleur, titre: "La couleur", sous_titre: "une sensation, et une vraie matière", principal: true}
      - {id: matiere, titre: "La matière colorée", sous_titre: "pigment + liant, parfois un siccatif"}
      - {id: melanges, titre: "Les mélanges", sous_titre: "bleu + jaune = vert ; les complémentaires face à face"}
      - {id: usages, titre: "Les usages", sous_titre: "jus, glacis, aplat, empâtement, giclure"}
      - {id: quantite, titre: "Quantité et qualité", sous_titre: "une petite touche ou un grand aplat de la même couleur"}
    liens:
      - {de: couleur, vers: matiere}
      - {de: couleur, vers: melanges}
      - {de: couleur, vers: usages}
      - {de: couleur, vers: quantite}
    jules: "La même couleur peut être pâle ou intense, transparente ou couvrante, selon la façon dont tu la poses et la quantité que tu en mets."

  - id: schema-cercle
    type: schema
    titre: "Le cercle des couleurs : primaires, secondaires, complémentaires"
    svg: "cm1-materialite-qualite-couleur.svg"
    jules: "Avec les trois **primaires**, tu fabriques les trois **secondaires**, mais aucun mélange ne donne une primaire. Dans les tubes, le « rouge » primaire est souvent un rose vif, le magenta, et le bleu un bleu clair, le cyan."

  - id: schema-usages
    type: schema
    titre: "Jus, glacis, aplat, empâtement : le même bleu, quatre effets"
    svg: "cm1-materialite-qualite-couleur-usages.svg"
    jules: "Dans Les Tournesols (1888), Van Gogh peint en **empâtement** : la peinture fait du relief. Henri Matisse, lui, découpe des papiers peints à la gouache en **aplats** de couleur pure, comme dans Icare (1946)."

  - id: methode
    type: methode
    etapes:
      - "Je choisis une couleur et un **médium** : gouache, aquarelle ou encre."
      - "J'essaie plusieurs usages : beaucoup d'eau (un **jus**), un peu d'eau (un **aplat**), presque pas d'eau (un **empâtement**)."
      - "Je compare aussi la **quantité** : une petite touche, puis une grande surface de la même couleur."
      - "Je choisis l'usage qui va avec mon idée : un ciel léger en jus, un mur solide en aplat, un soleil qui brille en empâtement."
    jules: "La gouache est faite pour couvrir, l'aquarelle pour laisser voir le papier à travers : c'est surtout la quantité d'eau qui fait la différence."

  - id: piege
    type: piege
    mauvaise_idee: "Un bleu, c'est un bleu : peu importe l'eau ou la quantité, il fera toujours le même effet."
    pourquoi_faux: "La **teinte** ne fait pas tout. L'épaisseur (jus ou empâtement), la **quantité** (une touche ou un grand aplat) et le support changent l'effet."
    bonne_idee: "Un bleu très dilué est pâle et transparent ; le même bleu épais est intense et en relief. Une petite touche attire l'œil ; un grand aplat remplit tout l'espace."
    jules: "Yves Klein a peint des tableaux entièrement bleus, d'un seul bleu très intense : l'IKB, dont il a déposé la recette en 1960. Devant une si grande surface, on a l'impression de plonger dans la couleur."

  - id: exemple-prairie
    type: exemple
    situation: "Pour peindre une prairie, Lucas n'a que trois pots de gouache : bleu, jaune et rouge. Comment obtenir du vert, puis un vert plus clair pour l'herbe au soleil ?"
    calcul: "Bleu + jaune = vert. Pour un vert plus clair, Lucas met plus de jaune que de bleu : par exemple 3 pinceaux de jaune pour 1 pinceau de bleu."
    conclusion: "Avec deux **primaires**, Lucas fabrique une **secondaire**, le vert, et ses nuances en changeant les quantités."
    jules: "Commence par la couleur claire, le jaune, et ajoute le bleu petit à petit : un peu de bleu suffit à foncer beaucoup de jaune."

  - id: exemple-jus
    type: exemple
    situation: "Zoé pose du bleu très dilué avec beaucoup d'eau. Juste à côté, elle étale au couteau du bleu épais sorti du tube. Les deux bleus donnent-ils la même impression ?"
    calcul: "Le bleu dilué est un **jus** : pâle, transparent, on voit le papier dessous. Le bleu épais est un **empâtement** : intense, en relief, il accroche la lumière."
    conclusion: "Même teinte, mais pas la même matière : la **qualité** de la couleur change complètement l'effet."
    jules: "Un **glacis**, c'est entre les deux : une couche fine et transparente posée sur une couleur déjà sèche, qui la change sans la cacher."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : avec une seule couleur, peins 5 cases qui vont de la plus diluée à la plus épaisse. Écris « jus » sous la première et « empâtement » sous la dernière."
