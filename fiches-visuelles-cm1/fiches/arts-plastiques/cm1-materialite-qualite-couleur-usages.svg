<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg"><title>Jus, glacis, aplat, empâtement : le même bleu, quatre effets</title>
<text class="tl" x="340.0" y="16.0" text-anchor="middle" dominant-baseline="central">Le même bleu, quatre usages</text>
<text class="tl" x="85.0" y="46.0" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Jus</text>
<text class="t" x="85.0" y="246.0" text-anchor="middle" dominant-baseline="central">beaucoup d'eau :</text>
<text class="t" x="85.0" y="266.0" text-anchor="middle" dominant-baseline="central">on voit le papier</text>
<text class="tl" x="255.0" y="46.0" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Glacis</text>
<text class="t" x="255.0" y="246.0" text-anchor="middle" dominant-baseline="central">bleu fin, transparent,</text>
<text class="t" x="255.0" y="266.0" text-anchor="middle" dominant-baseline="central">sur du jaune sec</text>
<text class="tl" x="425.0" y="46.0" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Aplat</text>
<text class="t" x="425.0" y="246.0" text-anchor="middle" dominant-baseline="central">couleur unie :</text>
<text class="t" x="425.0" y="266.0" text-anchor="middle" dominant-baseline="central">elle couvre tout</text>
<text class="tl" x="595.0" y="46.0" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Empâtement</text>
<text class="t" x="595.0" y="246.0" text-anchor="middle" dominant-baseline="central">pâte épaisse,</text>
<text class="t" x="595.0" y="266.0" text-anchor="middle" dominant-baseline="central">en relief</text>
