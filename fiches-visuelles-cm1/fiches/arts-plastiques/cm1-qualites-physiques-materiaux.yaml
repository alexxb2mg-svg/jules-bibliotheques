    jules: "Tu es un détective des matériaux : tes outils sont tes doigts, tes yeux et quelques gouttes d'eau. L'artiste britannique Andy Goldsworthy teste ainsi feuilles, galets et glace, puis crée avec eux dans la nature."

  - id: schema-qualites
    type: schema
    titre: "Les qualités des matériaux, et leur contraire"
    svg: "cm1-qualites-physiques-materiaux.svg"
    jules: "Ne confonds pas : la **rugosité** se sent avec le doigt, la **porosité** se voit avec une goutte d'eau. Une pâte malléable se modèle, un matériau rigide se construit."

  - id: schema-origines
    type: schema
    titre: "Récupérés, naturels ou transformés : d'où viennent les matériaux"
    svg: "cm1-qualites-physiques-materiaux-origines.svg"
    jules: "Quand on scie du bois, on change sa forme, mais c'est toujours du bois. Quand on cuit l'argile au four, elle devient de la **terre cuite** : on ne pourra plus jamais la modeler."

  - id: methode
    type: methode
    etapes:
      - "Je rassemble plusieurs matériaux : papier, carton, tissu, pâte à modeler, plastique."
      - "Je les teste : je touche (**rugosité**), je plie ou j'appuie (malléabilité), je pose une goutte d'eau (**porosité**)."
      - "Je nomme ce que j'observe avec les mots justes : poreux, lisse, rugueux, malléable, rigide, transparent, opaque."
      - "Je choisis le matériau qui convient : une pâte malléable pour modeler, un carton **rigide** pour construire, un papier épais pour peindre à l'eau."
    jules: "Fais le test de la goutte sur un petit coin du matériau. Si la goutte disparaît dans la matière, il est poreux ; si elle reste ronde dessus, il ne l'est pas."

  - id: piege
    type: piege
    mauvaise_idee: "Le papier buvard est doux et lisse, donc l'eau va glisser dessus comme sur du plastique."
    pourquoi_faux: "**Lisse** parle de la surface, sous le doigt. **Poreux** parle de l'eau qui entre dans la matière. Le buvard est lisse au toucher, mais plein de minuscules trous qui boivent l'eau."
    bonne_idee: "Deux qualités, deux tests : le doigt pour la **rugosité**, la goutte d'eau pour la **porosité**. Le buvard est lisse et très poreux."
    jules: "Toutes les combinaisons existent : un galet de rivière est lisse et presque pas poreux, une brique est rugueuse et poreuse."

  - id: exemple-aquarelle
    type: exemple
    situation: "Sofia peint deux fois le même coucher de soleil à l'aquarelle : sur une page de journal, puis sur une feuille de papier épais pour aquarelle. Pourquoi les deux peintures sont-elles si différentes ?"
    calcul: "Le papier journal est fin et très **poreux** : il boit l'eau d'un coup, la couleur s'étale toute seule et la feuille gondole. Le papier à aquarelle est épais : il boit l'eau plus lentement et reste plat."
    conclusion: "Même peinture, même geste : c'est la **qualité du support** qui change l'effet."
    jules: "Une feuille gondole quand elle fait des vagues en séchant. C'est pour l'éviter que les peintres à l'aquarelle choisissent des papiers épais."

  - id: exemple-herisson
    type: exemple
    situation: "Tom veut fabriquer un hérisson. Il hésite entre un galet, de la pâte à sel et une feuille de carton. Quel matériau choisir pour le corps, et quoi ajouter pour les piquants ?"
    calcul: "Le galet est **rigide** : on ne peut pas le déformer. Le carton plié tient mal en boule. La pâte à sel est **malléable** : Tom la modèle en boule allongée et y plante des cure-dents."
    conclusion: "Tom choisit la pâte à sel pour le corps, grâce à sa **malléabilité**, et des cure-dents rigides pour les piquants."
    jules: "En 1936, l'artiste Meret Oppenheim recouvre une tasse, sa soucoupe et une cuillère de fourrure. Le lisse de la porcelaine devient poilu, et on n'a plus du tout envie d'y boire !"

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : prépare une boîte à toucher avec 6 matériaux, comme de la laine, du papier de verre, du papier aluminium, du carton ondulé, du coton et une feuille d'arbre. Les yeux fermés, un camarade devine chaque matériau en disant sa qualité."
