      - {id: porosite, titre: "La porosité", sous_titre: "il boit l'eau, comme le buvard, ou non, comme le plastique"}
      - {id: rugosite, titre: "La rugosité", sous_titre: "il râpe, comme le papier de verre, ou il est lisse"}
