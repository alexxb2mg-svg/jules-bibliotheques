relecture: {statut: a_relire}
blocs:
  - id: image
    type: formule
    expression: "une image = [comment elle est faite] + [à quoi elle sert]"
    termes:
      "comment elle est faite": {couleur: orange, legende: "son **procédé de fabrication** : dessinée, peinte, photographiée, filmée, collée, faite sur écran"}
      "à quoi elle sert": {couleur: bleu, legende: "**exprimer** (une image artistique) ou **informer** (une image documentaire ou scientifique)"}
    jules: "Deux questions suffisent pour classer une image : avec quoi a-t-elle été faite, et pourquoi ? Une photo peut être une œuvre d'art ou un document : c'est l'intention qui décide."

  - id: carte
    type: carte
    noeuds:
      - {id: images, titre: "Les images", sous_titre: "on les fabrique, on les transforme", principal: true}
      - {id: artistique, titre: "Image artistique", sous_titre: "elle exprime une émotion, une idée"}
      - {id: documentaire, titre: "Image documentaire", sous_titre: "elle informe : schéma, photo de reportage"}
      - {id: fabriquer, titre: "Fabriquer", sous_titre: "dessiner, peindre, photographier, filmer"}
      - {id: transformer, titre: "Transformer", sous_titre: "coller, dessiner par-dessus, monter, retoucher"}
    liens:
      - {de: images, vers: artistique}
      - {de: images, vers: documentaire}
      - {de: images, vers: fabriquer}
      - {de: images, vers: transformer}
    jules: "Un **montage**, c'est assembler plusieurs images, ou des morceaux d'images, pour en faire une nouvelle. On peut le faire aux ciseaux ou sur une tablette."

  - id: schema-arbre
    type: schema
    titre: "Un même arbre, six façons de fabriquer une image"
    svg: "cm1-categories-images-fabrication.svg"
    jules: "La plus ancienne photographie conservée a été prise par Nicéphore Niépce vers 1827, depuis sa fenêtre. Il a fallu laisser l'appareil ouvert pendant des heures ! Aujourd'hui, une tablette prend une photo en une fraction de seconde."

  - id: schema-transformer
    type: schema
    titre: "Transformer une photo pour changer son sens"
    svg: "cm1-categories-images-fabrication-transformer.svg"
    jules: "L'arbre n'a pas bougé : c'est ce qui l'entoure qui a changé. En ajoutant peu de choses, mais bien choisies, on raconte une tout autre histoire."

  - id: methode
    type: methode
    etapes:
      - "Je regarde l'**image de départ** : qu'est-ce qu'elle montre exactement ? Je le dis en une phrase."
      - "Je décide ce que je veux lui faire dire de **nouveau** : une autre heure, une autre saison, une histoire drôle ou étrange."
      - "Je choisis ma **technique** : coller, dessiner ou peindre par-dessus, découper, monter, retoucher sur tablette."
      - "Je compare l'avant et l'après, et je dis en une phrase comment le sens a changé."
    jules: "Si tu travailles sur une photo que tu n'as pas prise, fais-en d'abord une photocopie ou une copie sur la tablette : l'image de départ reste intacte."

  - id: piege
    type: piege
    mauvaise_idee: "Une photo dit toujours la vérité, plus qu'un dessin."
    pourquoi_faux: "Le photographe choisit le **cadrage** : ce qu'il laisse hors de l'image, on ne le voit pas. Il choisit aussi le moment. Et une photo peut être **retouchée** ou montée."
    bonne_idee: "Un dessin peut être très exact : « Le Lièvre » d'Albrecht Dürer (1502), une aquarelle, montre chaque poil de l'animal. Une photo, comme un dessin, est une **image choisie**."
    jules: "Essaie : photographie ta chambre en cadrant seulement le coin bien rangé. La photo est vraie, mais elle ne montre pas tout !"

  - id: exemple-cheval
    type: exemple
    situation: "Dans un livre, Samir compare deux images de chevaux au galop. La peinture « Le Derby d'Epsom » de Théodore Géricault (1821, musée du Louvre) et une série de photos d'Eadweard Muybridge (1878). Laquelle est artistique, laquelle est scientifique ?"
    calcul: "Géricault peint les chevaux les pattes étirées devant et derrière, comme s'ils volaient : il veut faire ressentir la **vitesse**. Muybridge aligne plusieurs appareils photo pour décomposer le galop, image par image : il veut **savoir** comment bougent les pattes."
    conclusion: "La peinture est une image **artistique** : elle exprime. Les photos de Muybridge sont des images **scientifiques** : elles montrent qu'à un moment, le cheval a les quatre sabots en l'air, repliés sous le ventre."
    jules: "Les photos ont prouvé que la « pose volante » de Géricault n'existe pas dans la réalité. Pourtant, sa peinture donne toujours une forte impression de vitesse : c'était son but."

  - id: exemple-cantine
    type: exemple
    situation: "Zoé photographie deux fois son plateau de cantine. Photo 1 : tout le plateau, bien net, pour le journal de l'école, avec la légende « Le menu du jeudi ». Photo 2 : un seul petit pois en très gros plan, posé sur la purée comme une planète verte sur la Lune."
    calcul: "Même appareil, même plateau. Photo 1 : elle **informe** sur le menu. Photo 2 : elle fait **rêver** et sourire, on ne sait même plus que c'est la cantine."
    conclusion: "La photo 1 est une image **documentaire**. La photo 2 est une image **artistique**. C'est l'intention de Zoé qui fait la différence."
    jules: "Le gros plan est un bon moyen de rendre étrange un objet banal : on ne reconnaît plus sa taille, alors l'imagination prend le relais."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : découpe une photo dans un vieux magazine et ajoute-lui un seul élément dessiné ou collé. Demande à quelqu'un de dire ce que l'image raconte maintenant."
