notion: cm1-mise-en-regard-espace
titre: "Présenter une œuvre : cadre, socle, vitrine, et le lieu qui change tout"
matiere: arts-plastiques
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 43-44", url: "https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: presenter
    type: formule
    expression: "même œuvre + autre [présentation] + autre [lieu] → un autre regard"
    termes:
      "présentation": {couleur: orange, legende: "le **dispositif** : un cadre, un socle, un piédestal, une vitrine, ou rien du tout"}
      "lieu": {couleur: bleu, legende: "l'**endroit** où on la montre : chez soi, dans la rue, sur un écran, au musée"}
    jules: "Ton dessin ne change pas d'un seul trait, et pourtant on ne le regarde pas pareil sur le frigo et au musée. C'est ça, la **mise en regard** : choisir comment et où on montre une œuvre."

  - id: carte
    type: carte
    noeuds:
      - {id: montrer, titre: "Montrer une œuvre", sous_titre: "comment, et où ?", principal: true}
      - {id: cadre, titre: "Le cadre", sous_titre: "une bordure qui entoure et isole l'image"}
      - {id: socle, titre: "Le socle, le piédestal", sous_titre: "ils soulèvent une sculpture pour la montrer"}
      - {id: lieux, titre: "Le lieu", sous_titre: "privé ou public, écran, vitrine, musée"}
      - {id: insitu, titre: "In situ", sous_titre: "l'œuvre est faite pour un lieu précis"}
    liens:
      - {de: montrer, vers: cadre}
      - {de: montrer, vers: socle}
      - {de: montrer, vers: lieux}
      - {de: montrer, vers: insitu}
    jules: "Un **piédestal**, c'est un socle très haut, souvent en pierre. Au musée Rodin, à Paris, « Le Penseur » est posé sur un haut piédestal, dans le jardin : on le regarde d'en bas, comme un géant."

  - id: schema-expo
    type: schema
    titre: "L'exposition de la classe : cadre, socle, vitrine et cartels"
    svg: "cm1-mise-en-regard-espace.svg"
    jules: "Le **cartel** est la carte d'identité de l'œuvre. Au musée, lis-le toujours : il te donne le titre, l'artiste, la date et la technique."

  - id: schema-lieux
    type: schema
    titre: "Le même dessin, quatre lieux de présentation"
    svg: "cm1-mise-en-regard-espace-lieux.svg"
    jules: "Au musée du Louvre, « La Joconde » est protégée derrière une vitre : c'est aussi une vitrine. On la regarde de loin, et beaucoup de visiteurs la trouvent plus petite qu'ils ne l'imaginaient."

  - id: methode
    type: methode
    etapes:
      - "Je regarde ma production : est-elle **à plat** (dessin, peinture, collage) ou **en volume** (sculpture, objet) ?"
      - "Je choisis le **lieu** : un mur, une table, une vitrine, un écran, un coin de la cour."
      - "Je décide du **dispositif** : un cadre pour une image, un socle pour un volume, une vitrine pour un objet fragile, ou rien du tout."
      - "J'ajoute un cartel, puis je recule et j'observe : qu'est-ce qu'on remarque en premier ?"
    jules: "Place le centre des images à hauteur des yeux de ceux qui regardent. Pour une exposition d'élèves, c'est plus bas que dans un musée pour adultes."

  - id: piege
    type: piege
    mauvaise_idee: "Une vraie œuvre a toujours un cadre ou un socle."
    pourquoi_faux: "Le cadre et le socle sont des **choix**, pas des obligations. Beaucoup d'œuvres n'en ont pas : une fresque peinte sur un mur, une affiche collée dans la rue, un dessin à la craie dans la cour."
    bonne_idee: "Je choisis le dispositif selon l'**effet voulu**. Sans cadre, le dessin se mêle au mur ; avec un cadre, il est isolé et on le remarque comme une œuvre."
    jules: "Parfois, c'est même le socle qui change tout. En 1913, Marcel Duchamp a fixé une roue de vélo sur un tabouret : l'objet ordinaire, présenté ainsi, est devenu une œuvre."

  - id: exemple-tortue
    type: exemple
    situation: "Yanis a modelé une tortue en argile de 12 cm de long. Pour l'exposition de fin d'année, il hésite : la poser par terre, sur une table au milieu des cahiers, ou sur un socle fait d'une boîte à chaussures retournée, peinte en blanc."
    calcul: "Par terre : on ne la voit pas, on risque de marcher dessus. Sur la table : elle se perd au milieu des objets. Sur le **socle** blanc : elle est isolée, plus haute, et rien ne la cache."
    conclusion: "Yanis choisit le **socle** : il montre que sa tortue est une œuvre à regarder. Il colle un cartel sur la face avant de la boîte."
    jules: "Un socle blanc et simple est le plus discret : il met l'œuvre en valeur sans attirer le regard sur lui."

  - id: exemple-accrochage
    type: exemple
    situation: "La classe de Chloé accroche 9 dessins sur un mur de 6 m de long. Chaque dessin est collé sur un carton de 40 cm de large. Les élèves veulent le même espace partout, aussi entre le mur et le premier dessin, et après le dernier. Combien d'espace laisser ?"
    calcul: "6 m = 600 cm. Les 9 cartons prennent 9 × 40 = 360 cm. Il reste 600 − 360 = 240 cm, partagés en 10 espaces : 240 ÷ 10 = 24 cm."
    conclusion: "Ils laissent **24 cm** entre chaque dessin, et aux deux bouts. L'**accrochage** est régulier : aucun dessin n'a l'air plus important qu'un autre."
    jules: "Pour 9 dessins, il y a 10 espaces et pas 9 : un avant chaque dessin, plus un après le dernier. Vérifie avec 2 dessins : il y a 3 espaces."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : fabrique un cadre avec quatre bandes de carton pour un de tes dessins. Pose-le à côté du même dessin sans cadre, et demande à ta famille lequel attire le regard en premier."
