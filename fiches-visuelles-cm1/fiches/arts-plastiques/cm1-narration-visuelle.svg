<text class="t" x="560.0" y="290.0" text-anchor="middle" dominant-baseline="central">Lou crie, mais elle est</text>
<text class="t" x="560.0" y="309.0" text-anchor="middle" dominant-baseline="central">hors de la case : on devine</text>
