<text class="t" x="340.0" y="290.0" text-anchor="middle" dominant-baseline="central">on voit un détail :</text>
<text class="t" x="340.0" y="309.0" text-anchor="middle" dominant-baseline="central">le chien a flairé le goûter</text>
