<text class="t" x="36" y="390" dominant-baseline="central"><tspan fill="#C2410C" font-weight="700">bulle :</tspan><tspan fill="#1a1a18"> ce que dit un personnage ; sa pointe montre qui parle</tspan></text>
<text class="t" x="36" y="412" dominant-baseline="central"><tspan fill="#185FA5" font-weight="700">ellipse :</tspan><tspan fill="#1a1a18"> entre les cases 2 et 3, le vol du goûter n’est pas</tspan></text>
<text class="t" x="36.0" y="434.0" text-anchor="start" dominant-baseline="central" fill="#1a1a18">dessiné. C'est toi qui l'imagines.</text>
