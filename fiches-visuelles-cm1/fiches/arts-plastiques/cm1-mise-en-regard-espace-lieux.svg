<text class="t" x="28.0" y="26.0" text-anchor="start" dominant-baseline="central" fill="#854F0B" font-weight="700">Chez moi, sur le frigo</text>
<text class="t" x="172.0" y="184.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">espace privé : seule ma famille</text>
<text class="t" x="172.0" y="206.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">le voit, entre les aimants</text>
<g transform="translate(135.9 3.7) scale(0.84)"><rect x="368.0" y="46.0" width="150.0" height="130.0" rx="0" fill="#C9C1B2" stroke="#8A8880" stroke-width="1.5"/><rect x="382.0" y="66.0" width="122.0" height="92.0" rx="0" fill="#E6F1FB" stroke="#5A8BC0" stroke-width="2"/><rect x="414.0" y="88.0" width="58.0" height="48.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><circle cx="459.2" cy="100.0" r="6.24" fill="#F2C14E" stroke="none" stroke-width="1.5"/><rect x="425.6" y="112.0" width="23.2" height="17.3" rx="0" fill="#E58A3A" stroke="#1a1a18" stroke-width="1"/><polygon points="422.1,113.0 437.2,100.5 452.3,113.0" fill="#C0392B" stroke="#1a1a18" stroke-width="1" stroke-linejoin="round"/><line x1="414.0" y1="129.3" x2="472.0" y2="129.3" stroke="#3B6D11" stroke-width="3" stroke-linecap="round"/><line x1="392.0" y1="76.0" x2="410.0" y2="96.0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/><rect x="358.0" y="176.0" width="170.0" height="12.0" rx="0" fill="#B9B4A8" stroke="none" stroke-width="0"/></g>
<text class="t" x="364.0" y="26.0" text-anchor="start" dominant-baseline="central" fill="#854F0B" font-weight="700">Dans une vitrine</text>
<text class="t" x="508.0" y="184.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">espace public : les passants le voient,</text>
<text class="t" x="508.0" y="206.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">derrière la vitre, sans le toucher</text>
<g transform="translate(72.1 34.3) scale(0.9)"><rect x="36.0" y="278.0" width="150.0" height="110.0" rx="10" fill="#1a1a18" stroke="#1a1a18" stroke-width="1"/><rect x="46.0" y="288.0" width="130.0" height="90.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><rect x="72.0" y="296.0" width="78.0" height="70.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><circle cx="132.8" cy="313.5" r="9.1" fill="#F2C14E" stroke="none" stroke-width="1.5"/><rect x="87.6" y="331.0" width="31.2" height="25.2" rx="0" fill="#E58A3A" stroke="#1a1a18" stroke-width="1"/><polygon points="82.9,332.4 103.2,314.2 123.5,332.4" fill="#C0392B" stroke="#1a1a18" stroke-width="1" stroke-linejoin="round"/><line x1="72.0" y1="356.2" x2="150.0" y2="356.2" stroke="#3B6D11" stroke-width="3" stroke-linecap="round"/><circle cx="170.0" cy="368.0" r="11" fill="#ffffff" stroke="#1a1a18" stroke-width="2"/><line x1="178.0" y1="376.0" x2="186.0" y2="384.0" stroke="#1a1a18" stroke-width="3" stroke-linecap="round"/><text class="t" x="170.0" y="368.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18" font-weight="700">+</text></g>
<text class="t" x="28.0" y="258.0" text-anchor="start" dominant-baseline="central" fill="#854F0B" font-weight="700">Sur un écran</text>
<text class="t" x="172.0" y="416.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">il brille, on peut l'agrandir, mais</text>
<text class="t" x="172.0" y="438.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">on ne voit plus le grain du papier</text>
