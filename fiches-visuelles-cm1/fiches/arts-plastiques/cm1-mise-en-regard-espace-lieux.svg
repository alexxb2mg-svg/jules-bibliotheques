<text class="t" x="364.0" y="258.0" text-anchor="start" dominant-baseline="central" fill="#854F0B" font-weight="700">Au musée</text>
<text class="t" x="508.0" y="416.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">encadré, éclairé, avec un cartel :</text>
<text class="t" x="508.0" y="438.0" text-anchor="middle" dominant-baseline="central" fill="#1a1a18">on le regarde comme une œuvre</text>
