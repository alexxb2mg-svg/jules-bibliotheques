<text class="ts" x="300.0" y="120.0" text-anchor="middle" dominant-baseline="central">elle dessine</text>
<text class="t" x="424.0" y="62.0" text-anchor="end" dominant-baseline="central" fill="#3B6D11" font-weight="600">oreilles pointues</text>
<line x1="428.0" y1="62.0" x2="444.0" y2="62.0" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round"/>
<text class="t" x="662.0" y="72.0" text-anchor="end" dominant-baseline="central" fill="#C2410C" font-weight="600">moustaches</text>
<text class="t" x="662.0" y="90.0" text-anchor="end" dominant-baseline="central" fill="#C2410C" font-weight="600">immenses</text>
<text class="t" x="412.0" y="222.0" text-anchor="end" dominant-baseline="central" fill="#C2410C" font-weight="600">tout bleu</text>
<line x1="416.0" y1="220.0" x2="436.0" y2="210.0" stroke="#C2410C" stroke-width="1.5" stroke-linecap="round"/>
<rect x="20.0" y="262.0" width="310.0" height="150.0" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<text class="t" x="175.0" y="288.0" text-anchor="middle" dominant-baseline="central" fill="#3B6D11" font-weight="700">Ce qui reste : la ressemblance</text>
<text class="t" x="40.0" y="320.0" text-anchor="start" dominant-baseline="central" fill="#27500A">• les oreilles pointues</text>
<text class="t" x="40.0" y="342.0" text-anchor="start" dominant-baseline="central" fill="#27500A">• les yeux, le nez, les moustaches</text>
<text class="t" x="40.0" y="364.0" text-anchor="start" dominant-baseline="central" fill="#27500A">• assis, avec sa longue queue</text>
<text class="t" x="40.0" y="386.0" text-anchor="start" dominant-baseline="central" fill="#27500A" font-weight="700">→ on reconnaît un chat</text>
<rect x="350.0" y="262.0" width="310.0" height="150.0" rx="12" fill="#FAECE7" stroke="#C2410C" stroke-width="1.5"/>
<text class="t" x="505.0" y="288.0" text-anchor="middle" dominant-baseline="central" fill="#C2410C" font-weight="700">Ce qui change : l'écart</text>
<text class="t" x="370.0" y="320.0" text-anchor="start" dominant-baseline="central" fill="#712B13">• tout bleu</text>
<text class="t" x="370.0" y="364.0" text-anchor="start" dominant-baseline="central" fill="#712B13">• moustaches immenses</text>
<text class="t" x="390.0" y="342.0" text-anchor="start" dominant-baseline="central" fill="#712B13" font-weight="700">→ il a l'air mystérieux</text>
<text class="t" x="390.0" y="386.0" text-anchor="start" dominant-baseline="central" fill="#712B13" font-weight="700">→ il sent tout, de très loin</text>
</svg>
