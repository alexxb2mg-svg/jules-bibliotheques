notion: cm1-francois-1er-mecene-renaissance
titre: "François Ier, roi mécène de la Renaissance, et Léonard de Vinci"
matiere: histoire
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p.5", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: mecene
    type: formule
    expression: "[un mécène] aide et paie [des artistes] pour qu'ils créent"
    termes:
      "un mécène": {couleur: bleu, legende: "une personne riche et puissante, ici le roi **François Ier**, qui soutient les artistes sans être artiste lui-même"}
      "des artistes": {couleur: orange, legende: "peintres, sculpteurs, architectes, comme **Léonard de Vinci**, venu d'Italie"}
    jules: "Le mécène donne de l'argent, une maison, des commandes ; l'artiste donne son talent. Tout le royaume profite ensuite des œuvres."

  - id: carte
    type: carte
    noeuds:
      - {id: roi, titre: "François Ier (1515-1547)", sous_titre: "un roi mécène de la Renaissance", principal: true}
      - {id: mecene, titre: "Mécène", sous_titre: "il aide et paie les artistes"}
      - {id: leonard, titre: "Léonard de Vinci", sous_titre: "invité en France, il y vit jusqu'à sa mort en 1519"}
      - {id: renaissance, titre: "La Renaissance", sous_titre: "un renouveau des arts, né en Italie"}
      - {id: chateaux, titre: "Des châteaux", sous_titre: "Chambord, Fontainebleau : l'art italien en France"}
    liens:
      - {de: roi, vers: mecene}
      - {de: roi, vers: leonard}
      - {de: roi, vers: renaissance}
      - {de: roi, vers: chateaux}
    jules: "Renaissance veut dire « naître de nouveau ». Les artistes italiens redécouvrent l'art des Grecs et des Romains de l'Antiquité, et inventent de nouvelles façons de peindre et de construire."

  - id: schema-voyage
    type: schema
    titre: "De l'Italie à la France : Léonard de Vinci invité par le roi"
    svg: "cm1-francois-1er-mecene-renaissance.svg"
    jules: "La Joconde, peinte par Léonard, est restée en France après sa mort. C'est pour ça qu'on peut la voir aujourd'hui au musée du Louvre, à Paris."

  - id: schema-mecene
    type: schema
    titre: "Comment un roi mécène fait connaître la Renaissance dans son royaume"
    svg: "cm1-francois-1er-mecene-renaissance-mecene.svg"
    jules: "Sans l'argent et la protection du roi, un artiste ne peut pas passer des années sur un tableau ou un château. En admirant et en copiant ces œuvres, les artistes français font entrer la Renaissance dans tout le royaume."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 1500, max: 1560, pas: 1, depart: 1516}
      - {id: curseur-debut, nom: début, min: 1500, max: 1500, pas: 1, depart: 1500}
      - {id: curseur-fin, nom: fin, min: 1560, max: 1560, pas: 1, depart: 1560}
      - {id: curseur-de, nom: de, min: 1515, max: 1515, pas: 1, depart: 1515}
      - {id: curseur-a, nom: à, min: 1547, max: 1547, pas: 1, depart: 1547}
    lectures:
      - {si: "date < 1515", texte: "François Ier n'est pas encore roi."}
      - {si: "date >= 1515 && date <= 1519", texte: "**1515** : François Ier devient roi et invite **Léonard de Vinci**, qui vit près d'Amboise jusqu'à sa mort en 1519. Le roi est un **mécène**."}
      - {si: "date > 1519 && date <= 1547", texte: "Léonard est mort, mais le roi fait construire **Chambord** à partir de 1519 : la **Renaissance** arrive en France."}
      - {si: "date > 1547", texte: "Le règne de François Ier est terminé (1515-1547)."}
    jules: "La bande orange, c'est le règne de François Ier : 32 ans. Léonard de Vinci n'y vit que les premières années."

  - id: methode
    type: methode
    etapes:
      - "Retiens les dates du règne : **1515-1547**."
      - "Retiens le mot **mécène** : quelqu'un qui aide et paie des artistes, sans être artiste lui-même."
      - "Relie François Ier à **Léonard de Vinci** : invité en France, il y vit jusqu'à sa mort, en 1519."
      - "Pour expliquer le rôle du roi : il fait venir des artistes, leur commande des œuvres, et les Français les imitent. La **Renaissance** se diffuse."
    jules: "Une phrase à retenir : « En 1515, François Ier devient roi et accueille Léonard de Vinci. » Elle contient la date, le roi, le mécène et l'artiste."

  - id: piege
    type: piege
    mauvaise_idee: "1519, c'est le début du règne de François Ier."
    pourquoi_faux: "Le règne commence en **1515**. **1519**, c'est la mort de Léonard de Vinci en France, 4 ans plus tard (1519 − 1515 = 4)."
    bonne_idee: "1515 : François Ier devient roi, Léonard vient en France à son invitation. 1519 : Léonard meurt près d'Amboise. 1547 : fin du règne."
    jules: "Autre piège : croire que François Ier peignait lui-même. Un mécène n'est pas l'artiste : c'est celui qui l'aide et le paie."

  - id: exemple-clos-luce
    type: exemple
    situation: "En visite près d'Amboise, Louise lit sur un panneau : « Léonard de Vinci a vécu ici, au Clos Lucé, invité par François Ier, jusqu'à sa mort en 1519. » Pourquoi dit-on que François Ier est un roi mécène ?"
    calcul: "Le roi invite un grand artiste italien, lui offre une maison tout près de son château d'Amboise et le soutient jusqu'à la fin de sa vie."
    conclusion: "François Ier est un **mécène** : il aide et soutient des artistes, comme **Léonard de Vinci**."
    jules: "Au Clos Lucé, Léonard continue d'inventer : il dessine des machines et des plans, et il prépare des fêtes pour le roi."

  - id: exemple-durees
    type: exemple
    situation: "Nathan veut comparer deux durées. Combien d'années a duré le règne de François Ier ? Et combien d'années Léonard de Vinci a-t-il passées en France ?"
    calcul: "Règne : 1547 − 1515 = 32 ans. Léonard en France : 1519 − 1515 = 4 ans."
    conclusion: "François Ier règne **32 ans**. Léonard passe les **4 dernières années** de sa vie en France, au début de ce règne."
    jules: "Pour calculer une durée entre deux dates, on fait toujours la date la plus récente moins la plus ancienne."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : sur la carte, suis du doigt le voyage de Léonard, de Rome à Amboise, en nommant les Alpes au passage."
