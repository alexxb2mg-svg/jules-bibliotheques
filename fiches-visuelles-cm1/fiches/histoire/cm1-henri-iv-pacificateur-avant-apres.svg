<line x1="488.0" y1="106.0" x2="540.0" y2="106.0" stroke="#C9A15A" stroke-width="1.5" stroke-linecap="round"/>
<line x1="488.0" y1="116.0" x2="540.0" y2="116.0" stroke="#C9A15A" stroke-width="1.5" stroke-linecap="round"/>
<line x1="488.0" y1="126.0" x2="540.0" y2="126.0" stroke="#C9A15A" stroke-width="1.5" stroke-linecap="round"/>
