<circle cx="530.0" cy="158.0" r="8" fill="#C94A3A" stroke="#854F0B" stroke-width="1"/>
<text x="514.0" y="80.0" font-size="14" fill="#854F0B" font-weight="700" text-anchor="middle" dominant-baseline="central">l'édit de Nantes</text>
<text x="416.0" y="196.0" font-size="14" fill="#534AB7" font-weight="700" text-anchor="middle" dominant-baseline="central">catholiques</text>
<text x="601.0" y="196.0" font-size="14" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">protestants</text>
<circle cx="376.0" cy="242.0" r="5" fill="#3B6D11" stroke="none" stroke-width="1.5"/>
<text x="388.0" y="234.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Les protestants peuvent prier</text>
<text x="388.0" y="252.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">à leur façon, dans certains lieux.</text>
<circle cx="376.0" cy="292.0" r="5" fill="#3B6D11" stroke="none" stroke-width="1.5"/>
<text x="388.0" y="284.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">Ils peuvent avoir les mêmes</text>
<text x="388.0" y="302.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">emplois que les catholiques.</text>
<circle cx="376.0" cy="342.0" r="5" fill="#3B6D11" stroke="none" stroke-width="1.5"/>
<text x="388.0" y="334.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">La religion catholique reste</text>
<text x="388.0" y="352.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">la religion du roi et du royaume.</text>
<text x="514.0" y="390.0" font-size="15" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">Chacun garde sa religion.</text>
</svg>
