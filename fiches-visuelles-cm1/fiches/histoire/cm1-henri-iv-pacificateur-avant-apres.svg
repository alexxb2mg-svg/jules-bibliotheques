<text x="70.0" y="196.0" font-size="14" fill="#534AB7" font-weight="700" text-anchor="middle" dominant-baseline="central">catholiques</text>
<text x="261.0" y="196.0" font-size="14" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">protestants</text>
<text x="167.0" y="236.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">Catholiques et protestants sont</text>
<text x="167.0" y="256.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">tous chrétiens, mais ils ne</text>
<text x="167.0" y="276.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">prient pas de la même façon.</text>
<text x="167.0" y="296.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">Ils se battent pendant 36 ans :</text>
<text x="167.0" y="316.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">villages brûlés, massacres.</text>
<text x="167.0" y="350.0" font-size="15" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">Le royaume est déchiré.</text>
<line x1="330.0" y1="210.0" x2="352.0" y2="210.0" stroke="#1a1a18" stroke-width="3" stroke-linecap="round" marker-end="url(#fl)"/>
<rect x="356.0" y="8.0" width="316.0" height="404.0" rx="12" fill="#FAFDF8" stroke="#3B6D11" stroke-width="1.5"/>
<text x="514.0" y="32.0" font-size="18" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">Après 1598 : la paix</text>
