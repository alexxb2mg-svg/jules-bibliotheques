notion: cm1-traite-esclaves-plantations
titre: "La traite des esclaves et la vie dans les plantations"
matiere: histoire
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p.5", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: triangle
    type: formule
    expression: "[Europe] → [Afrique] → [Amériques] → [Europe]"
    termes:
      Europe: {couleur: gris, legende: "→ les navires partent de ports comme Nantes ou Bordeaux, chargés de tissus, d'armes, d'alcool"}
      Afrique: {couleur: rouge, legende: "→ ces objets sont échangés contre des **captifs** : des Africains arrachés à leur famille"}
      Amériques: {couleur: orange, legende: "→ les captifs sont vendus comme esclaves aux planteurs ; les navires repartent avec du **sucre**, du café, du coton"}
    jules: "Les trois trajets dessinent un triangle sur la carte : c'est pour cela qu'on parle de **commerce triangulaire**. Il enrichit les marchands et les ports d'Europe, grâce à la souffrance de millions de personnes."

  - id: carte
    type: carte
    noeuds:
      - {id: traite, titre: "La traite des esclaves", sous_titre: "des Africains déportés de force en Amérique", principal: true}
      - {id: triangle, titre: "Le commerce triangulaire", sous_titre: "Europe, Afrique, Amériques, puis retour"}
      - {id: plantations, titre: "Les plantations", sous_titre: "canne à sucre, café, coton : un travail forcé"}
      - {id: codenoir, titre: "Le Code noir (1685)", sous_titre: "l'édit de Louis XIV qui fixe les règles de l'esclavage"}
      - {id: denrees, titre: "Les denrées des colonies", sous_titre: "sucre de canne, chocolat, tomate, haricot, pomme de terre"}
    liens:
      - {de: traite, vers: triangle}
      - {de: traite, vers: plantations}
      - {de: traite, vers: codenoir}
      - {de: traite, vers: denrees}
    jules: "Une **traite**, c'est un commerce. Ici, c'est un commerce d'êtres humains : on vend des femmes, des hommes et des enfants comme s'ils étaient des objets, et c'est un crime."

  - id: schema-triangle
    type: schema
    titre: "Le commerce triangulaire : ce qui voyage sur chaque trajet"
    svg: "cm1-traite-esclaves-plantations.svg"
    jules: "Pendant la traversée, les captifs sont entassés, enchaînés, au fond des navires. Beaucoup meurent de maladie, de faim ou de mauvais traitements avant d'arriver."

  - id: schema-plantation
    type: schema
    titre: "Une plantation de canne à sucre, et la vie des esclaves"
    svg: "cm1-traite-esclaves-plantations-plantation.svg"
    jules: "Les esclaves résistent comme ils peuvent. Certains s'enfuient dans les forêts et les montagnes : on les appelle les « marrons ». Tous gardent en secret leurs chants, leurs danses et leurs contes."

  - id: methode
    type: methode
    etapes:
      - "Trace le triangle avec ton doigt sur la carte : Europe, puis Afrique, puis Amériques, puis retour en Europe."
      - "Sur chaque côté, dis ce qui voyage : des objets vers l'Afrique, des **captifs africains** vers l'Amérique, les produits des plantations vers l'Europe."
      - "Décris la vie dans une **plantation** : travail forcé du lever au coucher du soleil, punitions, ni salaire ni liberté."
      - "Relie 1685 au **Code noir**, puis cite au moins une denrée venue des colonies."
    jules: "Dans une réponse, parle des esclaves comme de personnes : des femmes, des hommes, des enfants à qui on a volé leur liberté. Ce sont des victimes, pas des marchandises."

  - id: piege
    type: piege
    mauvaise_idee: "La tomate, la pomme de terre et le chocolat ont toujours existé en France : ce sont des produits d'Europe."
    pourquoi_faux: "Ces plantes viennent **d'Amérique** : les Européens ne les connaissaient pas avant les grands voyages. Le **sucre de canne** est produit en grand dans les plantations des colonies."
    bonne_idee: "Tomate, chocolat, haricot, pomme de terre : venus d'Amérique. Sucre de canne : produit dans les plantations des colonies, par le travail forcé des esclaves."
    jules: "Autre piège, la date du Code noir : 1685. Pense à Louis XIV, le roi du château de Versailles : c'est sous son règne qu'il est signé."

  - id: exemple-gouter
    type: exemple
    situation: "Pour son anniversaire, Chloé prépare un gâteau au chocolat bien sucré. À l'époque de Louis XIV, d'où venaient le cacao et le sucre, et qui les produisait ?"
    calcul: "Le cacao vient d'Amérique. Le sucre de canne était produit dans les plantations des Antilles. Dans ces plantations, ce sont des esclaves africains qui coupaient la canne et faisaient le sucre."
    conclusion: "Ces **denrées** arrivaient en Europe grâce aux échanges avec les **colonies**, et derrière elles il y avait le travail forcé des esclaves."
    jules: "À cette époque, le sucre et le chocolat étaient des produits de luxe, réservés aux plus riches. Aujourd'hui, le sucre de France vient surtout de la betterave."

  - id: exemple-code-noir
    type: exemple
    situation: "Le Code noir est signé par Louis XIV en 1685. L'esclavage est aboli pour de bon dans les colonies françaises en 1848. Combien d'années séparent ces deux dates ?"
    calcul: "On fait une soustraction : 1848 − 1685 = 163."
    conclusion: "**163 ans** séparent le Code noir de l'abolition définitive. Pendant tout ce temps, des générations d'enfants sont nés esclaves dans les colonies."
    jules: "Le **Code noir** est une loi injuste : il traite les esclaves comme des biens qui appartiennent à leur maître, et il prévoit des punitions très dures pour ceux qui s'enfuient."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🕰️", titre: "Frise chronologique", description: "1685, 1848", outil: "frise-chronologique"}
      - {icone: "📖", titre: "Lexique", description: "traite, plantation, commerce triangulaire", outil: "lexique"}
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
    jules: "Défi : dessine le triangle sur une carte muette de l'océan Atlantique. Écris sur chaque flèche ce qui voyage, et colorie en rouge le trajet de la traversée."
