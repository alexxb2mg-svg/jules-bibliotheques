<text x="214.0" y="212.0" font-size="14" fill="#C2410C" font-weight="700" text-anchor="start" dominant-baseline="central">Piège : ce clocher est pointu...</text>
<text x="214.0" y="232.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">mais le portail et les fenêtres</text>
<text x="214.0" y="250.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="start" dominant-baseline="central">sont en demi-cercle :</text>
<text x="214.0" y="272.0" font-size="15" fill="#854F0B" font-weight="700" text-anchor="start" dominant-baseline="central">cette église est romane !</text>
<text x="370.0" y="330.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="end" dominant-baseline="central">deux tours,</text>
<text x="370.0" y="348.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="end" dominant-baseline="central">une rosace (vitrail rond),</text>
<text x="370.0" y="366.0" font-size="14" fill="#1a1a18" font-weight="500" text-anchor="end" dominant-baseline="central">des portails pointus :</text>
<text x="370.0" y="388.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="end" dominant-baseline="central">gothique, comme</text>
<text x="370.0" y="406.0" font-size="15" fill="#185FA5" font-weight="700" text-anchor="end" dominant-baseline="central">Notre-Dame de Paris</text>
