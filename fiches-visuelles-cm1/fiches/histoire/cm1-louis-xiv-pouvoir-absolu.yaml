    liens:
      - {de: louis, vers: absolu}
      - {de: louis, vers: versailles}
      - {de: versailles, vers: cour}
      - {de: cour, vers: femmes}
      - {de: louis, vers: frise}
    jules: "Louis XIV devient roi à 4 ans, en 1643 : sa mère gouverne à sa place en attendant. À partir de 1661, il décide de gouverner seul."

  - id: schema-frise
    type: schema
    titre: "Trois rois sur la frise : François Ier, Henri IV et Louis XIV"
    svg: "cm1-louis-xiv-pouvoir-absolu.svg"
    jules: "Pour comparer des règnes, regarde la longueur des barres : plus elle est longue, plus le règne a duré. François Ier règne au XVIe siècle, Henri IV à cheval sur le XVIe et le XVIIe, et Louis XIV surtout au XVIIe siècle."

  - id: schema-versailles
    type: schema
    titre: "Le plan de Versailles : tout mène à la chambre du roi"
    svg: "cm1-louis-xiv-pouvoir-absolu-versailles.svg"
    jules: "Tout est pensé pour que le roi soit au centre, comme le Soleil au milieu des planètes : c'est pour ça qu'on l'appelle le Roi-Soleil. Chaque matin, des nobles se pressent pour assister à son lever."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 1500, max: 1720, pas: 1, depart: 1680}
      - {id: curseur-debut, nom: début, min: 1500, max: 1500, pas: 1, depart: 1500}
      - {id: curseur-fin, nom: fin, min: 1720, max: 1720, pas: 1, depart: 1720}
      - {id: curseur-de, nom: de, min: 1643, max: 1643, pas: 1, depart: 1643}
      - {id: curseur-a, nom: à, min: 1715, max: 1715, pas: 1, depart: 1715}
    lectures:
      - {si: "date >= 1515 && date <= 1547", texte: "Règne de **François Ier** (1515-1547) : 32 ans."}
      - {si: "date > 1547 && date < 1589", texte: "Aucun des trois rois de la leçon ne règne : d'autres rois sont sur le trône."}
      - {si: "date >= 1589 && date <= 1610", texte: "Règne d'**Henri IV** (1589-1610) : 21 ans."}
      - {si: "date >= 1643 && date <= 1715", texte: "Règne de **Louis XIV** (1643-1715), la bande orange : **72 ans**, plus que François Ier et Henri IV réunis."}
    jules: "Compare les longueurs : 32 ans, 21 ans, 72 ans. Le règne de Louis XIV est le plus long des trois."

  - id: methode
    type: methode
    etapes:
      - "Retiens les dates du règne : **1643-1715**, soit 72 ans (1715 − 1643 = 72)."
      - "Associe Louis XIV au **pouvoir absolu** : il décide de tout, seul."
      - "Pour Versailles, donne des preuves : sa taille, sa richesse, le roi au centre, les nobles qui vivent autour de lui."
      - "N'oublie pas les **femmes** de la Cour : fêtes, mode, conversation, lettres, et parfois des conseils au roi."
      - "Sur la frise, range les trois rois dans l'ordre : François Ier, Henri IV, puis Louis XIV."
    jules: "Pour ranger les trois rois, pense à leurs chiffres : Ier, IV, XIV. Ils vont dans le même ordre que les dates, du plus ancien au plus récent."

  - id: piege
    type: piege
    mauvaise_idee: "Versailles, c'est seulement une très belle maison pour le roi."
    pourquoi_faux: "Versailles est fait pour **montrer la puissance** du roi : tout y mène à lui, et les nobles y vivent sous ses yeux. C'est un **symbole du pouvoir absolu**."
    bonne_idee: "Les trois grandes avenues, la cour et le grand axe des jardins mènent tous à la chambre du roi, placée au centre du château."
    jules: "Autre piège : oublier la durée du règne. 72 ans, c'est plus longtemps que François Ier et Henri IV réunis : 32 + 21 = 53 ans."

  - id: exemple-versailles
    type: exemple
    situation: "Emma visite le château de Versailles. Elle traverse la galerie des Glaces, voit des soleils dorés partout, et apprend que le roi attirait les grands nobles pour qu'ils vivent près de lui. Comment le château montre-t-il le pouvoir absolu ?"
    calcul: "Sa taille et sa richesse : tout le monde voit la puissance du roi. Les soleils : le roi se présente comme le Roi-Soleil. Les nobles près de lui : il les surveille, et ils attendent ses faveurs."
    conclusion: "Versailles est un **symbole du pouvoir absolu** : par sa taille, sa richesse et le roi au centre, il montre que tout tourne autour de Louis XIV."
    jules: "La galerie des Glaces a 357 miroirs. À l'époque, un miroir coûte très cher : en mettre autant, c'est montrer qu'on est le plus riche."

  - id: exemple-femmes
    type: exemple
    situation: "En 1686, Madame de Maintenon, très proche de Louis XIV, fonde à Saint-Cyr, près de Versailles, une école pour 250 jeunes filles nobles sans fortune. Quel rôle les femmes peuvent-elles avoir à la Cour ?"
    calcul: "La Cour, ce sont les nobles, hommes et femmes, qui entourent le roi. Les femmes y organisent des fêtes, donnent le ton de la mode, écrivent des lettres et des livres ; certaines conseillent le roi."
    conclusion: "Les **femmes** ont un vrai **rôle à la Cour** : elles font vivre Versailles, et certaines, comme Madame de Maintenon, ont une grande influence."
    jules: "La reine a aussi sa propre maison, avec des dames d'honneur qui l'accompagnent. Ces places sont très recherchées par les familles nobles."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : sur le plan de Versailles, pose ton doigt au bout d'une avenue et suis-la. Tu arrives toujours au même endroit : la chambre du roi."
