  - id: absolu
    type: formule
    expression: "[pouvoir absolu] : le roi décide de tout, seul"
    termes:
      "pouvoir absolu": {couleur: rouge, legende: "le roi fait les **lois**, rend la **justice**, décide de la guerre et des impôts, sans partager son pouvoir"}
    jules: "Louis XIV pense que son pouvoir lui vient de Dieu. Personne n'a donc le droit de le contester."

  - id: carte
    type: carte
    noeuds:
      - {id: louis, titre: "Louis XIV (1643-1715)", sous_titre: "72 ans : le plus long règne de l'histoire de France", principal: true}
      - {id: absolu, titre: "Le pouvoir absolu", sous_titre: "le roi décide de tout, seul"}
      - {id: versailles, titre: "Versailles", sous_titre: "un château immense qui montre sa puissance"}
      - {id: cour, titre: "La Cour", sous_titre: "les nobles, hommes et femmes, qui vivent autour du roi"}
      - {id: femmes, titre: "Les femmes à la Cour", sous_titre: "fêtes, mode, lettres, et parfois une grande influence"}
