<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg"><title>La marche des femmes sur Versailles, les 5 et 6 octobre 1789</title>
<defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="560.0" cy="150.0" r="58" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
<text class="tl" x="560.0" y="144.0" text-anchor="middle" dominant-baseline="central">Paris</text>
<text class="ts" x="560.0" y="168.0" text-anchor="middle" dominant-baseline="central">le peuple a faim</text>
<rect x="80.0" y="216.0" width="140.0" height="50.0" rx="0" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<rect x="90.0" y="226.0" width="8.0" height="14.0" rx="0" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<rect x="108.0" y="226.0" width="8.0" height="14.0" rx="0" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<rect x="126.0" y="226.0" width="8.0" height="14.0" rx="0" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<rect x="144.0" y="226.0" width="8.0" height="14.0" rx="0" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<rect x="162.0" y="226.0" width="8.0" height="14.0" rx="0" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<rect x="180.0" y="226.0" width="8.0" height="14.0" rx="0" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<rect x="198.0" y="226.0" width="8.0" height="14.0" rx="0" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/>
<polygon points="132.4,208.0 130.8,190.4 140.4,200.0 150.0,187.2 159.6,200.0 169.2,190.4 167.6,208.0" fill="#EEEDFE" stroke="#534AB7" stroke-width="2" stroke-linejoin="round"/>
<circle cx="130.8" cy="187.4" r="3.2" fill="#534AB7" stroke="none" stroke-width="1.5"/>
<circle cx="150.0" cy="184.2" r="3.2" fill="#534AB7" stroke="none" stroke-width="1.5"/>
<circle cx="169.2" cy="187.4" r="3.2" fill="#534AB7" stroke="none" stroke-width="1.5"/>
<text class="tl" x="150.0" y="284.0" text-anchor="middle" dominant-baseline="central">Versailles</text>
<text class="ts" x="150.0" y="306.0" text-anchor="middle" dominant-baseline="central">le château du roi</text>
<path d="M504 168 Q380 290 226 246" fill="none" stroke="#C2410C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fl)"/>
<g class="c-coral"><text class="th" x="380.0" y="300.0" text-anchor="middle" dominant-baseline="central">5 octobre : l'aller</text></g>
<text class="t" x="380.0" y="320.0" text-anchor="middle" dominant-baseline="central">des milliers de femmes marchent</text>
<text class="t" x="380.0" y="338.0" text-anchor="middle" dominant-baseline="central">sous la pluie pour réclamer du pain</text>
<path d="M210 208 Q350 110 498 138" fill="none" stroke="#534AB7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 6" marker-end="url(#fl)"/>
<g class="c-purple"><text class="th" x="360.0" y="60.0" text-anchor="middle" dominant-baseline="central">6 octobre : le retour</text></g>
<text class="t" x="360.0" y="80.0" text-anchor="middle" dominant-baseline="central">elles ramènent le roi, la reine</text>
<text class="t" x="360.0" y="98.0" text-anchor="middle" dominant-baseline="central">et leur fils à Paris</text>
<text class="t" x="340.0" y="372.0" text-anchor="middle" dominant-baseline="central">De Paris à Versailles : environ 20 km, soit 5 à 6 heures de marche.</text>
<text class="ts" x="340.0" y="392.0" text-anchor="middle" dominant-baseline="central">Schéma simplifié, pas à l'échelle.</text>
</svg>
