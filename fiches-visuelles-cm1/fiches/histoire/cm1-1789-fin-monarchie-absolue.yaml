notion: cm1-1789-fin-monarchie-absolue
titre: "1789, l'année qui met fin à la monarchie absolue"
matiere: histoire
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p.6", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: avant-apres
    type: formule
    expression: "avant 1789 : le [roi] décide de tout ; après 1789 : les [députés] votent la loi"
    termes:
      roi: {couleur: violet, legende: "→ la **monarchie absolue** : le roi fait les lois, les fait appliquer et rend la justice, seul"}
      députés: {couleur: vert, legende: "→ **l'Assemblée nationale** : des députés élus écrivent les lois, et le roi doit les respecter"}
    jules: "Attention, en 1789 la France a encore un roi, Louis XVI. Mais il n'a plus tous les pouvoirs : c'est la fin de la monarchie **absolue**, pas encore la fin de la monarchie."

  - id: carte
    type: carte
    noeuds:
      - {id: annee, titre: "1789, une année révolutionnaire", sous_titre: "fin de la monarchie absolue et de l'Ancien Régime", principal: true}
      - {id: bastille, titre: "14 juillet", sous_titre: "le peuple de Paris prend la Bastille"}
      - {id: aout, titre: "Nuit du 4 août", sous_titre: "les députés abolissent les privilèges"}
      - {id: femmes, titre: "5-6 octobre", sous_titre: "des femmes marchent jusqu'à Versailles"}
      - {id: assemblee, titre: "L'Assemblée nationale", sous_titre: "les députés du tiers état décident de faire les lois"}
    liens:
      - {de: annee, vers: assemblee}
      - {de: annee, vers: bastille}
      - {de: annee, vers: aout}
      - {de: annee, vers: femmes}
    jules: "**L'Ancien Régime**, c'est le nom qu'on a donné après 1789 à l'ancienne façon d'organiser le royaume : un roi tout-puissant et une société de trois ordres avec des privilèges."

  - id: schema-frise
    type: schema
    titre: "L'année 1789 sur une frise, de mai à octobre"
    svg: "cm1-1789-fin-monarchie-absolue.svg"
    jules: "Le 20 juin, les députés du tiers état jurent de ne pas se séparer avant d'avoir écrit une **constitution**, un texte qui fixe les règles du pays. Ils se réunissent dans la salle du Jeu de paume, un jeu de balle ancêtre du tennis."

  - id: schema-femmes
    type: schema
    titre: "Les 5 et 6 octobre 1789, la marche des femmes sur Versailles"
    svg: "cm1-1789-fin-monarchie-absolue-femmes.svg"
    jules: "Beaucoup de ces femmes sont des marchandes des Halles de Paris. En ramenant le roi à Paris, elles l'obligent à vivre au milieu du peuple, et non plus à l'écart, à Versailles."

  - id: methode
    type: methode
    etapes:
      - "Trace une ligne pour l'année 1789 et découpe-la en mois, de mai à octobre."
      - "Place d'abord les trois repères du programme : **14 juillet**, **nuit du 4 août**, **5-6 octobre**."
      - "Ajoute les autres dates : 5 mai (États généraux), 20 juin (serment du Jeu de paume), 26 août (Déclaration des droits de l'homme et du citoyen)."
      - "Sous chaque date, écris l'évènement en quelques mots, et vérifie que les mois se suivent dans l'ordre."
    jules: "Juillet vient avant août, et août avant octobre : si tes dates sont bien rangées par mois, ta frise est dans le bon ordre."

  - id: piege
    type: piege
    mauvaise_idee: "Le 14 juillet, les privilèges sont abolis, et le 4 août, on prend la Bastille."
    pourquoi_faux: "C'est l'inverse. Le **14 juillet**, le peuple de Paris attaque la Bastille, dans la rue. La **nuit du 4 août**, les députés votent la fin des privilèges, dans leur Assemblée."
    bonne_idee: "Juillet : la foule agit, la Bastille tombe. Août : les députés votent, les privilèges disparaissent. Juillet vient d'abord, comme dans le calendrier."
    jules: "Le 14 juillet est aujourd'hui notre fête nationale, avec son défilé et ses feux d'artifice : c'est le jour de la Bastille. Le 4 août vient trois semaines plus tard."

  - id: exemple-jours
    type: exemple
    situation: "Sacha veut savoir combien de jours séparent la prise de la Bastille (14 juillet) de la nuit du 4 août, comme il compte les jours avant les vacances. Le mois de juillet a 31 jours."
    calcul: "Du 14 juillet au 31 juillet : 31 − 14 = 17 jours. Puis on ajoute les 4 premiers jours d'août : 17 + 4 = 21."
    conclusion: "La nuit du 4 août arrive **21 jours**, soit **3 semaines**, après la prise de la Bastille."
    jules: "Refais le calcul du 4 août au 26 août : 26 − 4 = 22 jours. En moins de deux mois, les députés changent toute l'organisation de la société."

  - id: exemple-femmes
    type: exemple
    situation: "Raconte l'action des femmes en 1789. Le 5 octobre, à Paris, le pain manque et il coûte très cher. Que font les femmes ?"
    calcul: "Des milliers de femmes se rassemblent et marchent sous la pluie jusqu'à Versailles, à environ 20 km, pour demander du pain au roi. Le lendemain, le 6 octobre, elles ramènent le roi, la reine et leur fils à Paris."
    conclusion: "Par la **marche des femmes**, le peuple de Paris oblige le roi à quitter Versailles et à vivre à Paris."
    jules: "À Paris, on surnomme alors la famille royale « le boulanger, la boulangère et le petit mitron » (l'apprenti boulanger). Les femmes espèrent qu'avec le roi près d'elles, le pain ne manquera plus."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🕰️", titre: "Frise chronologique", description: "14 juillet, 4 août, 5-6 octobre 1789", outil: "frise-chronologique"}
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : fabrique ta propre frise de 1789 sur une bande de papier, avec un petit dessin pour chaque date : une forteresse, un parchemin barré, un pain."
