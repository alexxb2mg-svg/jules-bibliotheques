notion: cm1-contexte-royaume-1789
titre: "Le royaume de France en 1789 : un pays prêt à changer"
matiere: histoire
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p.6", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: trois-aspects
    type: formule
    expression: "le contexte de 1789 = [social] + [économique] + [intellectuel]"
    termes:
      social: {couleur: gris, legende: "→ la société : le tiers état paie les impôts, le clergé et la noblesse gardent leurs **privilèges**"}
      économique: {couleur: orange, legende: "→ l'argent : les caisses du roi sont vides, la récolte de 1788 est perdue, le **pain** est très cher"}
      intellectuel: {couleur: vert, legende: "→ les idées : les philosophes des **Lumières** défendent la liberté et l'égalité"}
    jules: "Le **contexte**, c'est la situation du pays juste avant un évènement. Pour 1789, pense à trois mots : la société, l'argent, les idées."

  - id: carte
    type: carte
    noeuds:
      - {id: royaume, titre: "Le royaume en 1789", sous_titre: "un pays mécontent, où les idées changent", principal: true}
      - {id: social, titre: "Social", sous_titre: "le tiers état paie, les privilégiés presque pas"}
      - {id: economique, titre: "Économique", sous_titre: "caisses vides, récolte perdue, pain cher"}
      - {id: intellectuel, titre: "Intellectuel", sous_titre: "les Lumières : liberté, égalité, tolérance"}
      - {id: printemps, titre: "Printemps 1789", sous_titre: "cahiers de doléances, puis États généraux le 5 mai"}
    liens:
      - {de: royaume, vers: social}
      - {de: royaume, vers: economique}
      - {de: royaume, vers: intellectuel}
      - {de: royaume, vers: printemps}
    jules: "Les trois problèmes arrivent en même temps : c'est pour cela que la colère grandit si vite. Pour trouver de l'argent, le roi doit réunir les États généraux."

  - id: schema-aspects
    type: schema
    titre: "Social, économique, intellectuel : le royaume en 1789"
    svg: "cm1-contexte-royaume-1789.svg"
    jules: "Les **Lumières**, ce sont des philosophes qui veulent « éclairer » les esprits avec la raison. Montesquieu veut séparer les pouvoirs du roi, Voltaire se bat pour la tolérance, Rousseau pour l'égalité."

  - id: schema-printemps
    type: schema
    titre: "Printemps 1789 : les cahiers de doléances, puis les États généraux"
    svg: "cm1-contexte-royaume-1789-printemps.svg"
    jules: "Les **États généraux** sont une grande réunion des députés des trois ordres, que seul le roi peut convoquer. Il n'y en avait plus eu depuis 1614, soit 175 ans."

  - id: methode
    type: methode
    etapes:
      - "Compte sur trois doigts : **social**, **économique**, **intellectuel**. N'en oublie aucun."
      - "Pour chaque doigt, donne un fait : les privilèges et les impôts ; les caisses vides et le pain cher ; les idées des Lumières."
      - "Cite une idée des Lumières (la liberté, l'égalité, la tolérance) et un philosophe, par exemple Voltaire ou Montesquieu."
      - "Pour le printemps 1789, suis la frise : cahiers de doléances en mars-avril, puis ouverture des États généraux le 5 mai, à Versailles."
    jules: "Une femme aussi a marqué les Lumières : Émilie du Châtelet, une savante qui a traduit en français les travaux du grand physicien Newton."

  - id: piege
    type: piege
    mauvaise_idee: "Les cahiers de doléances sont écrits après la prise de la Bastille, pour se plaindre de la Révolution."
    pourquoi_faux: "Ils sont rédigés **avant**, au **printemps 1789** (mars et avril), pour préparer la réunion des États généraux. La prise de la Bastille arrive plus tard, le 14 juillet."
    bonne_idee: "Dans l'ordre : cahiers de doléances (mars-avril), ouverture des États généraux (5 mai), prise de la Bastille (14 juillet)."
    jules: "« Doléance » vient d'un vieux mot qui veut dire « se plaindre ». Un cahier de doléances, c'est un cahier de plaintes et de demandes adressé au roi."

  - id: exemple-cahier
    type: exemple
    situation: "En mars 1789, dans le village de Marie, 10 ans, les chefs de famille se réunissent à l'église pour écrire leur cahier de doléances. Le père de Marie paie la taille, la dîme et des droits au seigneur. Que va-t-il demander ?"
    calcul: "Il trouve injuste de payer autant d'impôts, alors que le clergé et la noblesse ne paient pas la taille."
    conclusion: "Il demande que **tout le monde paie l'impôt**, chacun selon ses moyens. C'est une demande que l'on retrouve dans de très nombreux cahiers."
    jules: "Il y a eu des dizaines de milliers de cahiers, un par village ou par ville, et d'autres pour chaque ordre. C'est comme si tout le royaume écrivait au roi en même temps."

  - id: exemple-pain
    type: exemple
    situation: "Imagine Paul, ouvrier à Paris au printemps 1789. Il gagne 20 sous par jour (le sou est une pièce de monnaie de l'époque). Le pain de sa famille lui coûte 12 sous par jour. Combien lui reste-t-il pour tout le reste ?"
    calcul: "20 − 12 = 8. Il lui reste 8 sous pour le loyer, les vêtements, le bois pour se chauffer."
    conclusion: "Plus de la moitié de son salaire part dans le **pain**. Quand le prix du pain monte encore, la famille a faim, et la colère gronde."
    jules: "Les nombres de cet exemple sont arrondis pour faciliter le calcul. Mais c'est vrai : en 1789, le pain est la nourriture principale, et son prix n'a jamais été aussi haut depuis longtemps."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🕰️", titre: "Frise chronologique", description: "printemps 1789, 5 mai 1789", outil: "frise-chronologique"}
      - {icone: "📖", titre: "Lexique", description: "Lumières, doléance, États généraux", outil: "lexique"}
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
    jules: "Défi : écris ton propre cahier de doléances pour l'école, avec trois demandes. Tu verras que ce n'est pas si simple de se mettre d'accord !"
