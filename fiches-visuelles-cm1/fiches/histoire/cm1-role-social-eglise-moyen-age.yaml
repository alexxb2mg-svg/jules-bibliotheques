      - {id: pauvres, titre: "Aider les pauvres", sous_titre: "l'aumône : du pain donné à la porte"}
      - {id: malades, titre: "Soigner les malades", sous_titre: "à l'infirmerie de l'abbaye, à l'Hôtel-Dieu"}
      - {id: enseigner, titre: "Enseigner", sous_titre: "les écoles des abbayes et des cathédrales"}
