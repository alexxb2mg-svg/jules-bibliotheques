    jules: "Au Moyen Âge, l'école n'est pas pour tout le monde et il n'y a pas d'hôpital comme aujourd'hui. C'est surtout l'Église qui aide les pauvres, soigne les malades et enseigne."

  - id: schema-abbaye
    type: schema
    titre: "Une abbaye vue d'en haut : où l'on prie, où l'on aide, où l'on enseigne"
    svg: "cm1-role-social-eglise-moyen-age.svg"
    jules: "Les moines suivent une règle de vie : prier, travailler et accueillir. Celui qui frappe à la porte, pauvre, malade ou voyageur, doit être reçu."

  - id: schema-reperes
    type: schema
    titre: "Abbaye ou cathédrale ? Deux repères : Cluny et Notre-Dame de Paris"
    svg: "cm1-role-social-eglise-moyen-age-reperes.svg"
    jules: "Une abbaye, c'est la maison des moines ; une cathédrale, c'est l'église de l'évêque, en ville. Notre-Dame de Paris a brûlé en 2019 et a rouvert en décembre 2024, après plus de cinq ans de travaux."

  - id: methode
    type: methode
    etapes:
      - "Lis ce que fait l'Église dans le document : elle prie, ou elle **aide** les gens ?"
      - "Donner à manger, accueillir, soigner : c'est l'**assistance** aux pauvres et aux malades."
      - "Apprendre à lire, à écrire, copier des livres : c'est l'**enseignement**."
      - "Pour un repère : l'**abbaye**, ce sont des moines, souvent à la campagne (Cluny) ; la **cathédrale**, c'est l'évêque, en ville (Notre-Dame de Paris)."
    jules: "Le rôle social de l'Église tient en deux mots : **assister** et **enseigner**. Si tu les cites avec un exemple chacun, ta réponse est complète."

  - id: piege
    type: piege
    mauvaise_idee: "Au Moyen Âge, l'Église sert seulement à prier et à dire la messe."
    pourquoi_faux: "L'Église a aussi un **rôle social** : elle **assiste** les pauvres et les malades, et elle assure l'**enseignement**."
    bonne_idee: "À la porte de l'abbaye, les moines donnent du pain aux pauvres ; à l'infirmerie, ils soignent les malades ; à l'école, ils apprennent à lire aux enfants."
    jules: "Autre confusion : l'abbaye et la cathédrale. Pense « moines » pour l'abbaye, et « évêque » pour la cathédrale."

  - id: exemple-pelerin
    type: exemple
    situation: "Au XIIe siècle, Guillaume, un pèlerin, tombe malade sur la route. Il frappe à la porte de l'abbaye de Cluny, en Bourgogne. Que vont faire les moines pour lui ?"
    calcul: "L'abbaye a une hôtellerie pour les voyageurs et une infirmerie pour les malades. Accueillir et soigner font partie du rôle social de l'Église."
    conclusion: "Les moines l'accueillent et le soignent : c'est l'**assistance aux malades**, un des deux rôles sociaux de l'Église."
    jules: "Un pèlerin est quelqu'un qui fait un long voyage à pied jusqu'à un lieu saint. Les abbayes sur son chemin sont un peu ses hôtels."

  - id: exemple-ecole
    type: exemple
    situation: "Au XIIIe siècle, à Paris, Étienne, 10 ans, va chaque matin à l'école de la cathédrale Notre-Dame. Un religieux lui apprend à lire le latin et à chanter. Quel rôle de l'Église cela montre-t-il ?"
    calcul: "Apprendre à lire et à chanter, c'est apprendre à l'école. Et cette école est tenue par l'Église, près de la cathédrale."
    conclusion: "C'est l'**enseignement** : au Moyen Âge, les écoles sont tenues par l'Église, près des cathédrales et dans les abbayes."
    jules: "Les livres sont copiés à la main par des moines, lettre par lettre : il faut parfois des mois pour un seul livre. C'est pour ça qu'ils sont si précieux."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : cherche une abbaye ou une cathédrale près de chez toi, et trouve en quel siècle elle a été construite."
