<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg"><title>Les grands articles de la Déclaration des droits de l'homme et du citoyen</title>
<path d="M8 470 L8 70 Q8 14 171.0 14 Q334 14 334 70 L334 470 Z" fill="#F7F4EC" stroke="#8a8272" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M346 470 L346 70 Q346 14 509.0 14 Q672 14 672 70 L672 470 Z" fill="#F7F4EC" stroke="#8a8272" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text class="th" x="171.0" y="44.0" text-anchor="middle" dominant-baseline="central">Déclaration des droits</text>
<text class="th" x="509.0" y="44.0" text-anchor="middle" dominant-baseline="central">de l'homme et du citoyen</text>
<rect x="20.0" y="74.0" width="302.0" height="118.0" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1.8"/>
<g class="c-green"><text class="tl" x="30.0" y="94.0" text-anchor="start" dominant-baseline="central">Article 1</text></g>
<rect x="204.0" y="83.0" width="108.0" height="22.0" rx="11" fill="#3B6D11" stroke="#3B6D11" stroke-width="1"/>
<text x="258.0" y="94.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">ÉGALITÉ</text>
<text class="t" x="30.0" y="124.0" text-anchor="start" dominant-baseline="central">« Les hommes naissent et demeurent</text>
<text class="t" x="30.0" y="143.0" text-anchor="start" dominant-baseline="central">libres et égaux en droits. »</text>
<line x1="30.0" y1="158.0" x2="312.0" y2="158.0" stroke="#dddbd2" stroke-width="1" stroke-linecap="round"/>
<g class="c-green"><text class="t" x="30.0" y="176.0" text-anchor="start" dominant-baseline="central">→ fin des privilèges</text></g>
<rect x="20.0" y="206.0" width="302.0" height="118.0" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.8"/>
<g class="c-blue"><text class="tl" x="30.0" y="226.0" text-anchor="start" dominant-baseline="central">Article 4</text></g>
<rect x="204.0" y="215.0" width="108.0" height="22.0" rx="11" fill="#185FA5" stroke="#185FA5" stroke-width="1"/>
<text x="258.0" y="226.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">LIBERTÉ</text>
<text class="t" x="30.0" y="256.0" text-anchor="start" dominant-baseline="central">« La liberté consiste à pouvoir faire</text>
<text class="t" x="30.0" y="275.0" text-anchor="start" dominant-baseline="central">tout ce qui ne nuit pas à autrui. »</text>
<line x1="30.0" y1="290.0" x2="312.0" y2="290.0" stroke="#dddbd2" stroke-width="1" stroke-linecap="round"/>
<g class="c-blue"><text class="t" x="30.0" y="308.0" text-anchor="start" dominant-baseline="central">→ autrui = les autres</text></g>
<rect x="20.0" y="338.0" width="302.0" height="118.0" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1.8"/>
<g class="c-blue"><text class="tl" x="30.0" y="358.0" text-anchor="start" dominant-baseline="central">Article 10</text></g>
<rect x="204.0" y="347.0" width="108.0" height="22.0" rx="11" fill="#185FA5" stroke="#185FA5" stroke-width="1"/>
<text x="258.0" y="358.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">LIBERTÉ</text>
<text class="t" x="30.0" y="388.0" text-anchor="start" dominant-baseline="central">« Nul ne doit être inquiété pour</text>
<text class="t" x="30.0" y="407.0" text-anchor="start" dominant-baseline="central">ses opinions, même religieuses »</text>
<line x1="30.0" y1="422.0" x2="312.0" y2="422.0" stroke="#dddbd2" stroke-width="1" stroke-linecap="round"/>
<g class="c-blue"><text class="t" x="30.0" y="440.0" text-anchor="start" dominant-baseline="central">→ chacun croit ce qu'il veut</text></g>
<rect x="358.0" y="74.0" width="302.0" height="118.0" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.8"/>
<g class="c-purple"><text class="tl" x="368.0" y="94.0" text-anchor="start" dominant-baseline="central">Article 3</text></g>
<rect x="542.0" y="83.0" width="108.0" height="22.0" rx="11" fill="#534AB7" stroke="#534AB7" stroke-width="1"/>
<text x="596.0" y="94.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">SOUVERAINETÉ</text>
<text class="t" x="368.0" y="124.0" text-anchor="start" dominant-baseline="central">« Le principe de toute souveraineté</text>
<text class="t" x="368.0" y="143.0" text-anchor="start" dominant-baseline="central">réside essentiellement dans la Nation. »</text>
<line x1="368.0" y1="158.0" x2="650.0" y2="158.0" stroke="#dddbd2" stroke-width="1" stroke-linecap="round"/>
<g class="c-purple"><text class="t" x="368.0" y="176.0" text-anchor="start" dominant-baseline="central">→ le pouvoir vient du peuple</text></g>
<rect x="358.0" y="206.0" width="302.0" height="118.0" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1.8"/>
<g class="c-purple"><text class="tl" x="368.0" y="226.0" text-anchor="start" dominant-baseline="central">Article 6</text></g>
<rect x="542.0" y="215.0" width="108.0" height="22.0" rx="11" fill="#534AB7" stroke="#534AB7" stroke-width="1"/>
<text x="596.0" y="226.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">LA LOI</text>
<text class="t" x="368.0" y="256.0" text-anchor="start" dominant-baseline="central">« La loi est l'expression</text>
<text class="t" x="368.0" y="275.0" text-anchor="start" dominant-baseline="central">de la volonté générale. »</text>
<line x1="368.0" y1="290.0" x2="650.0" y2="290.0" stroke="#dddbd2" stroke-width="1" stroke-linecap="round"/>
<g class="c-purple"><text class="t" x="368.0" y="308.0" text-anchor="start" dominant-baseline="central">→ la même loi pour tous</text></g>
<rect x="358.0" y="338.0" width="302.0" height="118.0" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1.8"/>
<g class="c-green"><text class="tl" x="368.0" y="358.0" text-anchor="start" dominant-baseline="central">Article 13</text></g>
<rect x="542.0" y="347.0" width="108.0" height="22.0" rx="11" fill="#3B6D11" stroke="#3B6D11" stroke-width="1"/>
<text x="596.0" y="358.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">ÉGALITÉ</text>
<text class="t" x="368.0" y="388.0" text-anchor="start" dominant-baseline="central">l'impôt doit être « également réparti</text>
<text class="t" x="368.0" y="407.0" text-anchor="start" dominant-baseline="central">entre tous les citoyens »</text>
<line x1="368.0" y1="422.0" x2="650.0" y2="422.0" stroke="#dddbd2" stroke-width="1" stroke-linecap="round"/>
<g class="c-green"><text class="t" x="368.0" y="440.0" text-anchor="start" dominant-baseline="central">→ chacun paie, selon ses moyens</text></g>
</svg>
