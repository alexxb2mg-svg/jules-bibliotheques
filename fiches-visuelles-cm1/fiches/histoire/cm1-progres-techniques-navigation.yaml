notion: cm1-progres-techniques-navigation
titre: "Caravelle, boussole : partir au grand large"
matiere: histoire
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p.5", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: reperes
    type: formule
    expression: "[1492] Colomb arrive en Amérique ; [1519-1522] tour du monde de Magellan"
    termes:
      "1492": {couleur: orange, legende: "→ une seule **année** : Christophe Colomb traverse l'océan Atlantique et débarque en Amérique"}
      "1519-1522": {couleur: violet, legende: "→ une **période** de 3 ans : le voyage de l'expédition de Magellan, du départ au retour"}
    jules: "Naviguer au **grand large**, c'est aller loin des côtes, en pleine mer, là où l'on ne voit plus la terre. Avant le XVe siècle, les marins européens restaient le plus souvent près des côtes."

  - id: carte
    type: carte
    noeuds:
      - {id: large, titre: "Naviguer au grand large", sous_titre: "loin des côtes, à partir du XVe siècle", principal: true}
      - {id: caravelle, titre: "La caravelle", sous_titre: "un bateau léger aux voiles carrées et triangulaires"}
      - {id: boussole, titre: "La boussole", sous_titre: "son aiguille montre toujours le nord"}
      - {id: reperer, titre: "L'astrolabe et la carte", sous_titre: "pour savoir où l'on est sur la mer"}
      - {id: voyages, titre: "Les grands voyages", sous_titre: "1492 Colomb, 1498 Gama, 1519-1522 Magellan"}
    liens:
      - {de: large, vers: caravelle}
      - {de: large, vers: boussole}
      - {de: large, vers: reperer}
      - {de: large, vers: voyages}
    jules: "Chaque invention règle un problème du marin : avancer (la caravelle), garder sa direction (la boussole), savoir où il est (l'astrolabe et la carte). Ensemble, elles rendent les très longs voyages possibles."

  - id: schema-caravelle
    type: schema
    titre: "La caravelle : chaque partie a son rôle"
    svg: "cm1-progres-techniques-navigation.svg"
    jules: "Avec seulement une voile carrée, un bateau ne va bien que si le vent souffle de derrière. Les **voiles triangulaires** permettent d'avancer avec un vent de côté : c'est ce qui rend la caravelle si utile."

  - id: schema-instruments
    type: schema
    titre: "Trois instruments pour se repérer en pleine mer"
    svg: "cm1-progres-techniques-navigation-instruments.svg"
    jules: "La boussole vient de Chine, et l'astrolabe a été perfectionné par des savants arabes. Les marins européens les reprennent et les adaptent à la mer."

  - id: schema-carte
    type: schema
    titre: "Les routes des grands voyages : 1492, 1498, 1519-1522"
    svg: "cm1-progres-techniques-navigation-carte.svg"
    jules: "Colomb croyait arriver en Inde, en Asie, en allant vers l'ouest. C'est pour cela qu'on a d'abord appelé « Indiens » les habitants de l'Amérique."

  - id: graphe
    type: graphe
    gabarit: itineraire-carte
    curseurs:
      - {id: curseur-avancee, nom: avancee, min: 0, max: 100, pas: 5, depart: 0}
      - {id: curseur-jeu, nom: jeu, min: 1, max: 1, pas: 1, depart: 1}
    lectures:
      - {si: "avancee < 10", texte: "Septembre **1519** : cinq navires quittent l'Espagne ; la **boussole** indique le cap pour traverser l'Atlantique."}
      - {si: "avancee >= 10 && avancee < 45", texte: "Ils longent l'Amérique du Sud et franchissent en 1520 le détroit qui porte aujourd'hui le nom de **Magellan**."}
      - {si: "avancee >= 45 && avancee < 75", texte: "La traversée du **Pacifique** dure plus de trois mois sans escale ; Magellan est tué aux Philippines en 1521."}
      - {si: "avancee >= 95", texte: "Septembre **1522** : un seul navire revient en Espagne avec 18 hommes. C'est le premier **tour du monde**."}
    jules: "Fais avancer le navire : il part vers l'ouest et revient par l'est, sans jamais faire demi-tour. Le voyage dure trois ans."

  - id: methode
    type: methode
    etapes:
      - "Pour chaque invention, demande-toi à quoi elle sert : avancer, garder sa direction, ou savoir où l'on est."
      - "Cite au moins deux inventions du programme : la **boussole** et la **caravelle**."
      - "Pose ton doigt sur la frise : 1492, Colomb arrive en Amérique ; puis 1519-1522, l'expédition de Magellan fait le tour du monde."
      - "Pour une durée, fais une soustraction : 1522 − 1519 = 3, donc le voyage dure **3 ans**."
    jules: "Retiens l'ordre : Colomb (1492), puis Gama (1498), puis Magellan (1519). Les voyages sont de plus en plus longs : quelques semaines pour traverser l'Atlantique, presque un an jusqu'en Inde, 3 ans pour le tour du monde."

  - id: piege
    type: piege
    mauvaise_idee: "1492 et 1519-1522, c'est la même sorte de repère : deux dates où un navigateur arrive quelque part."
    pourquoi_faux: "1492 est une seule **année** : celle où Colomb débarque en Amérique. 1519-1522 est une **période** : le voyage de Magellan commence en 1519 et se termine en 1522."
    bonne_idee: "Colomb : 1492. Magellan : de 1519 à 1522, un voyage de 1522 − 1519 = 3 ans. Et 1519 − 1492 = 27 : Colomb arrive 27 ans avant le départ de Magellan."
    jules: "Autre piège : Magellan lui-même ne revient pas, il meurt aux Philippines en 1521. Ce sont ses marins qui terminent le tour du monde : c'est pour cela qu'on dit « l'expédition de Magellan »."

  - id: exemple-orientation
    type: exemple
    situation: "Au centre de loisirs, Léa fait une course d'orientation dans la forêt. Elle ne voit plus le chemin, et elle doit aller vers l'ouest. Comment la boussole l'aide-t-elle, comme les marins de 1492 ?"
    calcul: "L'aiguille de la boussole montre toujours le nord. Quand on regarde vers l'ouest, le nord est à droite. Léa tourne jusqu'à avoir l'aiguille sur sa droite, puis elle avance tout droit."
    conclusion: "Léa garde sa direction sans voir le chemin. En pleine mer, sans côte en vue, le marin fait pareil avec la **boussole**."
    jules: "L'aiguille de la boussole est un petit aimant. Elle est attirée vers le nord de la Terre, même la nuit et même quand il y a des nuages."

  - id: exemple-magellan
    type: exemple
    situation: "Noé lit que l'expédition de Magellan quitte l'Espagne en septembre 1519 avec 5 navires, et revient en septembre 1522. Combien de temps dure le voyage ? Combien de navires reviennent ?"
    calcul: "1522 − 1519 = 3. Le voyage dure 3 ans. Sur les 5 navires, un seul revient, avec 18 marins."
    conclusion: "Le premier **tour du monde** dure **3 ans**. Il montre qu'on peut faire le tour de la Terre en bateau."
    jules: "Au retour, les marins ont un jour de retard sur le calendrier. En faisant le tour de la Terre vers l'ouest, ils ont « perdu » un jour sans s'en rendre compte."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🕰️", titre: "Frise chronologique", description: "1492, 1498, 1519-1522", outil: "frise-chronologique"}
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : sur un globe ou une carte du monde, suis avec ton doigt la route de Magellan. Tu passeras par trois océans : l'Atlantique, le Pacifique et l'océan Indien."
