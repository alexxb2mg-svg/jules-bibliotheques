notion: cm1-modes-de-vie-seigneurs-paysans-villes
titre: "Seigneurs, paysans, gens des villes : trois façons de vivre au Moyen Âge"
matiere: histoire
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p.4-5", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: vivre, titre: "Vivre au Moyen Âge", sous_titre: "on ne vit pas pareil selon qui l'on est", principal: true}
      - {id: seigneur, titre: "Le seigneur", sous_titre: "au château : chasse, guerre, justice"}
      - {id: paysans, titre: "Les paysannes et les paysans", sous_titre: "la plupart des gens : aux champs toute l'année"}
      - {id: obligations, titre: "Leurs obligations", sous_titre: "corvée et redevances au seigneur, dîme à l'Église"}
      - {id: ville, titre: "Les habitants des villes", sous_titre: "marché, foire, artisans dans leurs ateliers"}
    liens:
      - {de: vivre, vers: seigneur}
      - {de: vivre, vers: paysans}
      - {de: paysans, vers: obligations}
      - {de: vivre, vers: ville}
    jules: "Au Moyen Âge, presque tout le monde vit à la campagne et cultive la terre : environ 9 personnes sur 10. Les seigneurs et les habitants des villes sont beaucoup moins nombreux."

  - id: schema-calendrier
    type: schema
    titre: "Le calendrier des travaux des paysans : un an, puis on recommence"
    svg: "cm1-modes-de-vie-seigneurs-paysans-villes.svg"
    jules: "Le travail suit les saisons : on sème, on attend que ça pousse, on récolte, puis on recommence. En hiver, quand les champs se reposent, on répare les outils et on tue le cochon pour avoir de la viande salée."

  - id: schema-obligations
    type: schema
    titre: "Ce que les paysans doivent au seigneur et à l'Église"
    svg: "cm1-modes-de-vie-seigneurs-paysans-villes-obligations.svg"
    jules: "La **dîme** vient du mot « dixième » : sur 10 gerbes, environ 1 va à l'Église. Le mot **corvée** existe encore : c'est un travail qu'on doit faire sans en avoir envie !"

  - id: schema-trois-vies
    type: schema
    titre: "Trois façons de vivre : au château, au village, en ville"
    svg: "cm1-modes-de-vie-seigneurs-paysans-villes-trois-vies.svg"
    jules: "Au marché, on vend les produits de la campagne toute proche ; à la foire, des marchands venus de loin apportent des tissus, des épices ou du sel. Dans certaines villes, des rues gardent encore le nom d'un métier, comme la rue des Tanneurs."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-mois, nom: mois, min: 1, max: 12, pas: 1, depart: 7}
      - {id: curseur-debut, nom: debut, min: 1, max: 1, pas: 1, depart: 1}
      - {id: curseur-fin, nom: fin, min: 12, max: 12, pas: 1, depart: 12}
    lectures:
      - {si: "mois <= 2", texte: "En **hiver**, on répare les outils, on file la laine à la maison, on coupe du bois."}
      - {si: "mois >= 3 && mois <= 5", texte: "Au **printemps**, les paysans labourent et sèment ; les paysannes s'occupent du jardin et des bêtes."}
      - {si: "mois >= 6 && mois <= 8", texte: "En **été**, c'est la **moisson** : on coupe les blés à la faucille ; une partie revient au seigneur et à l'Église (la **dîme**)."}
      - {si: "mois >= 9", texte: "À l'**automne**, les **vendanges** et les semailles ; à la fin de l'automne, on tue le cochon pour avoir de la viande l'hiver."}
    jules: "Fais avancer les mois de janvier à décembre : les travaux des champs suivent les saisons, puis tout recommence l'année suivante."

  - id: methode
    type: methode
    etapes:
      - "Cherche **où** se passe la scène : au château, aux champs ou en ville."
      - "Aux champs, pense au **calendrier des travaux** : labourer, semer, moissonner, vendanger, et on recommence chaque année."
      - "Liste ce que les paysans doivent : au **seigneur** (corvée, redevances, moulin et four) ET à l'**Église** (la dîme)."
      - "En ville, cherche le **marché** ou la **foire** (on vend, on achète) et l'**artisanat** (on fabrique à la main)."
    jules: "Retiens « deux maîtres » pour les paysans : le seigneur et l'Église. S'il en manque un dans ta réponse, elle est incomplète."

  - id: piege
    type: piege
    mauvaise_idee: "Les paysans ne donnent qu'au seigneur, puisque c'est lui le maître de la terre."
    pourquoi_faux: "Ils ont **deux** sortes d'obligations : envers le **seigneur** (corvée, redevances, payer le moulin et le four) et envers l'**Église** (la dîme, environ un dixième de la récolte)."
    bonne_idee: "Sur 20 gerbes de blé, environ 2 partent à l'Église pour la dîme, et une autre part va au seigneur. La famille garde le reste pour manger et pour semer l'année suivante."
    jules: "Autre piège : croire que tout le monde vivait dans un château. Le château, c'est pour le seigneur et sa famille ; les paysans vivent au village, dans des chaumières."

  - id: exemple-moisson
    type: exemple
    situation: "C'est le mois de juillet, au XIIe siècle. Jeanne, une paysanne, se lève avant le soleil et part aux champs avec sa faucille. Que fait-elle ? Et que devra-t-elle faire ensuite avec sa récolte ?"
    calcul: "Dans le calendrier des travaux, juillet, c'est la **moisson** : on coupe le blé. En août, on le bat pour séparer les grains de la paille."
    conclusion: "Jeanne moissonne. Ensuite, elle donnera une part de sa récolte au **seigneur**, et environ 1 gerbe sur 10 à l'**Église** : la dîme."
    jules: "La faucille est une lame en forme de croissant de lune : on attrape les tiges de blé d'une main et on coupe de l'autre."

  - id: exemple-ville
    type: exemple
    situation: "Au XIIIe siècle, Hugo habite en ville : son père est cordonnier. Le samedi, sa mère fait ses courses au marché. Deux fois par an, une grande foire s'installe sur la place. Quelles activités de la ville médiévale vois-tu dans sa vie ?"
    calcul: "Son père fabrique des chaussures à la main dans son atelier : c'est l'**artisanat**. Au marché et à la foire, on vend et on achète."
    conclusion: "Hugo vit au milieu des activités de la ville : l'**artisanat**, le **marché** et la **foire**."
    jules: "La différence : le marché revient souvent, pour les produits de tous les jours. La foire est plus rare et plus grande, avec des marchands venus de loin."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine ta propre roue des mois, avec un petit dessin pour chaque travail des champs. Commence par juillet, le mois de la moisson."
