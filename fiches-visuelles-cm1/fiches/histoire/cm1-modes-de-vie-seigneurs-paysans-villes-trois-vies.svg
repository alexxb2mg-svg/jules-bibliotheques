<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg"><title>Trois façons de vivre au Moyen Âge</title>
<rect x="10.0" y="8.0" width="212.0" height="380.0" rx="12" fill="#ffffff" stroke="#993C1D" stroke-width="1.4"/>
<text x="116.0" y="30.0" font-size="16" fill="#993C1D" font-weight="700" text-anchor="middle" dominant-baseline="central">le seigneur</text>
<rect x="18.0" y="178.0" width="196.0" height="62.0" rx="8" fill="#FAECE7" stroke="none" stroke-width="1.5"/>
<text x="28.0" y="192.0" font-size="13" fill="#993C1D" font-weight="700" text-anchor="start" dominant-baseline="central">sa maison</text>
<text x="116.0" y="210.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">un château fort en pierre,</text>
<text x="116.0" y="227.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">avec une grande salle</text>
<rect x="18.0" y="248.0" width="196.0" height="62.0" rx="8" fill="#FAECE7" stroke="none" stroke-width="1.5"/>
<text x="28.0" y="262.0" font-size="13" fill="#993C1D" font-weight="700" text-anchor="start" dominant-baseline="central">sa journée</text>
<text x="116.0" y="280.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">il chasse, s'entraîne à</text>
<text x="116.0" y="297.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">la guerre, rend la justice</text>
<rect x="18.0" y="318.0" width="196.0" height="62.0" rx="8" fill="#FAECE7" stroke="none" stroke-width="1.5"/>
<text x="28.0" y="332.0" font-size="13" fill="#993C1D" font-weight="700" text-anchor="start" dominant-baseline="central">ses repas</text>
<text x="116.0" y="350.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">viande, gibier, pain blanc,</text>
<text x="116.0" y="367.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">épices venues de loin</text>
<rect x="234.0" y="8.0" width="212.0" height="380.0" rx="12" fill="#ffffff" stroke="#3B6D11" stroke-width="1.4"/>
<text x="340.0" y="30.0" font-size="16" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">la paysanne, le paysan</text>
<rect x="242.0" y="178.0" width="196.0" height="62.0" rx="8" fill="#EAF3DE" stroke="none" stroke-width="1.5"/>
<text x="252.0" y="192.0" font-size="13" fill="#3B6D11" font-weight="700" text-anchor="start" dominant-baseline="central">sa maison</text>
<text x="340.0" y="210.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">une chaumière : murs de</text>
<text x="340.0" y="227.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">torchis, toit de paille</text>
<rect x="242.0" y="248.0" width="196.0" height="62.0" rx="8" fill="#EAF3DE" stroke="none" stroke-width="1.5"/>
<text x="252.0" y="262.0" font-size="13" fill="#3B6D11" font-weight="700" text-anchor="start" dominant-baseline="central">sa journée</text>
<text x="340.0" y="280.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">aux champs, du lever</text>
<text x="340.0" y="297.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">au coucher du soleil</text>
<rect x="242.0" y="318.0" width="196.0" height="62.0" rx="8" fill="#EAF3DE" stroke="none" stroke-width="1.5"/>
<text x="252.0" y="332.0" font-size="13" fill="#3B6D11" font-weight="700" text-anchor="start" dominant-baseline="central">ses repas</text>
<text x="340.0" y="350.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">pain noir, soupe, bouillie ;</text>
<text x="340.0" y="367.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">de la viande rarement</text>
<rect x="458.0" y="8.0" width="212.0" height="380.0" rx="12" fill="#ffffff" stroke="#854F0B" stroke-width="1.4"/>
<text x="564.0" y="30.0" font-size="16" fill="#854F0B" font-weight="700" text-anchor="middle" dominant-baseline="central">l'habitant de la ville</text>
<rect x="466.0" y="178.0" width="196.0" height="62.0" rx="8" fill="#FAEEDA" stroke="none" stroke-width="1.5"/>
<text x="476.0" y="192.0" font-size="13" fill="#854F0B" font-weight="700" text-anchor="start" dominant-baseline="central">sa maison</text>
<text x="564.0" y="210.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">serrée contre les autres,</text>
<text x="564.0" y="227.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">à l'abri des remparts</text>
<rect x="466.0" y="248.0" width="196.0" height="62.0" rx="8" fill="#FAEEDA" stroke="none" stroke-width="1.5"/>
<text x="476.0" y="262.0" font-size="13" fill="#854F0B" font-weight="700" text-anchor="start" dominant-baseline="central">sa journée</text>
<text x="564.0" y="280.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">l'artisan fabrique à la main</text>
<text x="564.0" y="297.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">et vend dans sa boutique</text>
<rect x="466.0" y="318.0" width="196.0" height="62.0" rx="8" fill="#FAEEDA" stroke="none" stroke-width="1.5"/>
<text x="476.0" y="332.0" font-size="13" fill="#854F0B" font-weight="700" text-anchor="start" dominant-baseline="central">ses repas</text>
<text x="564.0" y="350.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">il achète sa nourriture</text>
<text x="564.0" y="367.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">au marché</text>
