<text x="340.0" y="413.0" font-size="14" fill="#854F0B" font-weight="700" text-anchor="middle" dominant-baseline="central">En ville : le marché, chaque semaine ; la foire, quelques fois par an,</text>
<text x="340.0" y="435.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">avec des marchands venus de loin. Les artisans (boulanger, forgeron,</text>
<text x="340.0" y="456.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">cordonnier, tisserand) travaillent dans des rues de leur métier.</text>
