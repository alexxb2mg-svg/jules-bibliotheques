<text class="tl" x="20.0" y="280.0" text-anchor="start" dominant-baseline="central">La plantation</text>
<circle cx="30.0" cy="308.0" r="9" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="30.0" y="308.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<text class="t" x="46.0" y="308.0" text-anchor="start" dominant-baseline="central">la maison du maître, le propriétaire</text>
<circle cx="30.0" cy="332.0" r="9" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="30.0" y="332.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text>
<text class="t" x="46.0" y="332.0" text-anchor="start" dominant-baseline="central">les cases où dorment les esclaves</text>
<circle cx="30.0" cy="356.0" r="9" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="30.0" y="356.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text>
<text class="t" x="46.0" y="356.0" text-anchor="start" dominant-baseline="central">les champs de canne à sucre</text>
<circle cx="30.0" cy="380.0" r="9" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="30.0" y="380.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text class="t" x="46.0" y="380.0" text-anchor="start" dominant-baseline="central">le moulin écrase la canne : le jus coule</text>
<circle cx="30.0" cy="404.0" r="9" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="30.0" y="404.0" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text>
<text class="t" x="46.0" y="404.0" text-anchor="start" dominant-baseline="central">la sucrerie : on cuit le jus pour faire le sucre</text>
<g class="c-red"><text class="tl" x="370.0" y="280.0" text-anchor="start" dominant-baseline="central">La vie des esclaves</text></g>
<text class="t" x="370.0" y="308.0" text-anchor="start" dominant-baseline="central">• travail forcé du lever au coucher du soleil</text>
<text class="t" x="370.0" y="332.0" text-anchor="start" dominant-baseline="central">• surveillés, punis à coups de fouet</text>
<text class="t" x="370.0" y="356.0" text-anchor="start" dominant-baseline="central">• ni salaire, ni liberté ; les enfants travaillent</text>
<text class="t" x="370.0" y="380.0" text-anchor="start" dominant-baseline="central">• cases petites, nourriture insuffisante</text>
