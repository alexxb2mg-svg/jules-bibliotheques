<polygon points="135.2,17.2 163.3,44.8 191.4,55.6 229.4,67.6 219.5,101.2 194.7,134.8 209.6,142.0 207.9,166.0 217.8,192.4 196.3,209.2 173.2,202.0 145.1,209.2 146.8,226.0 122.0,223.6 64.2,202.0 74.1,170.8 74.1,134.8 57.6,110.8 16.3,91.6 16.3,77.2 44.3,72.4 67.5,77.2 62.5,50.8 74.1,58.0 95.6,56.8 117.0,41.2 120.3,22.0" fill="#EEF3F9" stroke="#185FA5" stroke-width="1.6" stroke-linejoin="round"/>
