<path d="M163.3 167.2 L160.8 149.2 L161.6 137.2 L151.7 125.2 L145.9 115.8 L141.8 106.0 L131.9 96.4 L125.3 94.0 L115.9 101.4 L110.1 105.8 L105.3 106.2 L84.8 106.0 L68.3 110.3 L57.6 108.9" fill="none" stroke="#5B9BD5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="192.3,179.2 201.3,164.2 210.3,179.2" fill="#D9D5CA" stroke="#8a8578" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="200.6,148.0 209.6,133.0 218.6,148.0" fill="#D9D5CA" stroke="#8a8578" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="222.0,133.6 231.0,118.6 240.0,133.6" fill="#D9D5CA" stroke="#8a8578" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="245.2,131.2 254.2,116.2 263.2,131.2" fill="#D9D5CA" stroke="#8a8578" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="268.3,128.8 277.3,113.8 286.3,128.8" fill="#D9D5CA" stroke="#8a8578" stroke-width="1.2" stroke-linejoin="round"/>
<polygon points="289.8,126.4 298.8,111.4 307.8,126.4" fill="#D9D5CA" stroke="#8a8578" stroke-width="1.2" stroke-linejoin="round"/>
<text x="259.1" y="101.2" font-size="14" fill="#6b6860" font-weight="700" text-anchor="middle" dominant-baseline="central">les Alpes</text>
<text x="108.8" y="151.6" font-size="16" fill="#185FA5" font-weight="700" text-anchor="middle" dominant-baseline="central">FRANCE</text>
<text x="379.7" y="218.8" font-size="16" fill="#854F0B" font-weight="700" text-anchor="middle" dominant-baseline="central">ITALIE</text>
<circle cx="132.7" cy="71.0" r="4.5" fill="#1a1a18" stroke="none" stroke-width="1.5"/>
<text x="140.7" y="71.0" font-size="14" fill="#1a1a18" font-weight="600" text-anchor="start" dominant-baseline="central">Paris</text>
<circle cx="279.8" cy="193.1" r="4.5" fill="#854F0B" stroke="none" stroke-width="1.5"/>
<text x="287.8" y="193.1" font-size="14" fill="#854F0B" font-weight="600" text-anchor="start" dominant-baseline="central">Florence</text>
<circle cx="300.4" cy="238.0" r="4.5" fill="#854F0B" stroke="none" stroke-width="1.5"/>
<text x="308.4" y="238.0" font-size="14" fill="#854F0B" font-weight="600" text-anchor="start" dominant-baseline="central">Rome</text>
<circle cx="245.7" cy="152.6" r="4.5" fill="#854F0B" stroke="none" stroke-width="1.5"/>
<text x="253.7" y="152.6" font-size="14" fill="#854F0B" font-weight="600" text-anchor="start" dominant-baseline="central">Milan</text>
<circle cx="110.1" cy="105.8" r="7" fill="#185FA5" stroke="#ffffff" stroke-width="2"/>
<text x="100.1" y="91.8" font-size="15" fill="#185FA5" font-weight="700" text-anchor="end" dominant-baseline="central">Amboise</text>
<rect x="115.0" y="96.7" width="8.0" height="8.0" rx="0" fill="#185FA5" stroke="#ffffff" stroke-width="1.5"/>
<text x="127.0" y="88.7" font-size="13" fill="#185FA5" font-weight="600" text-anchor="start" dominant-baseline="central">Chambord</text>
<path d="M297.4 232.0 C 270.4 218.0, 277.0 217.2, 269.0 197.2 S 241.0 174.0, 231.0 166.0 S 210.9 156.4, 202.9 156.4 S 186.6 136.4, 166.6 132.4 S 130.1 109.8, 120.1 107.8" fill="none" stroke="#854F0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fl)"/>
<rect x="430.0" y="16.0" width="240.0" height="368.0" rx="10" fill="#ffffff" stroke="#d6d4cc" stroke-width="1"/>
<text x="444.0" y="40.0" font-size="20" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">1515</text>
<text x="444.0" y="64.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">François Ier devient roi.</text>
<text x="444.0" y="82.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">Il admire les artistes</text>
<text x="444.0" y="100.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">italiens et invite</text>
<text x="444.0" y="118.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">Léonard de Vinci.</text>
<line x1="444.0" y1="140.0" x2="472.0" y2="140.0" stroke="#854F0B" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#fl)"/>
<text x="480.0" y="140.0" font-size="14" fill="#854F0B" font-weight="700" text-anchor="start" dominant-baseline="central">le voyage de Léonard :</text>
<text x="444.0" y="162.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">il passe les Alpes avec ses</text>
<text x="444.0" y="180.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">tableaux, dont la Joconde.</text>
<circle cx="450.0" cy="212.0" r="6" fill="#185FA5" stroke="#ffffff" stroke-width="2"/>
<text x="462.0" y="212.0" font-size="14" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Amboise :</text>
<text x="444.0" y="234.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">le roi l'installe près de</text>
<text x="444.0" y="252.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">son château, au Clos Lucé.</text>
<text x="444.0" y="270.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">Léonard y vit jusqu'à sa</text>
<text x="444.0" y="288.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">mort, en 1519.</text>
<rect x="446.0" y="318.0" width="8.0" height="8.0" rx="0" fill="#185FA5" stroke="#ffffff" stroke-width="1.5"/>
<text x="462.0" y="322.0" font-size="14" fill="#185FA5" font-weight="700" text-anchor="start" dominant-baseline="central">Chambord :</text>
<text x="444.0" y="344.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">le roi le fait construire</text>
<text x="444.0" y="362.0" font-size="14" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">à partir de 1519.</text>
<text x="215.0" y="392.0" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">Carte simplifiée, pas à l'échelle exacte.</text>
</svg>
