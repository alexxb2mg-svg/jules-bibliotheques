notion: cm1-societe-ordres-clerge-noblesse-tiers-etat
titre: "Clergé, noblesse, tiers état : les trois ordres"
matiere: histoire
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p.5", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: devise
    type: formule
    expression: "ceux qui [prient], ceux qui [combattent], ceux qui [travaillent]"
    termes:
      prient: {couleur: violet, legende: "→ le **clergé**, 1er ordre : les gens d'Église (curés, moines, religieuses, évêques)"}
      combattent: {couleur: bleu, legende: "→ la **noblesse**, 2e ordre : les nobles, qui défendent le royaume à la guerre"}
      travaillent: {couleur: vert, legende: "→ le **tiers état**, 3e ordre : tous les autres, et d'abord les paysans"}
    jules: "« Tiers » est un vieux mot qui veut dire « troisième » : le tiers état, c'est le troisième ordre. Un ordre, c'est un grand groupe de personnes qui ont les mêmes droits et les mêmes devoirs."

  - id: carte
    type: carte
    noeuds:
      - {id: societe, titre: "La société d'ordres", sous_titre: "avant 1789, sous l'Ancien Régime", principal: true}
      - {id: clerge, titre: "Le clergé", sous_titre: "prie, soigne, fait l'école ; reçoit la dîme"}
      - {id: noblesse, titre: "La noblesse", sous_titre: "combat ; on naît noble, comme ses parents"}
      - {id: tiers, titre: "Le tiers état", sous_titre: "travaille ; environ 98 habitants sur 100"}
      - {id: privileges, titre: "Les privilèges", sous_titre: "des droits en plus, pour le clergé et la noblesse"}
    liens:
      - {de: societe, vers: clerge}
      - {de: societe, vers: noblesse}
      - {de: societe, vers: tiers}
      - {de: societe, vers: privileges}
    jules: "Un **privilège**, c'est un droit réservé à quelques-uns, un peu comme un passe-droit à la cantine. Le clergé et la noblesse en ont beaucoup, le tiers état n'en a pas."

  - id: schema-ordres
    type: schema
    titre: "Qui prie, qui combat, qui travaille : les trois ordres"
    svg: "cm1-societe-ordres-clerge-noblesse-tiers-etat.svg"
    jules: "La **taille** est l'impôt payé au roi, en argent. La **dîme** est une part de la récolte donnée à l'Église. Seul le tiers état paie la taille."

  - id: schema-impots
    type: schema
    titre: "Sur 100 habitants, presque tous sont du tiers état, et c'est lui qui paie"
    svg: "cm1-societe-ordres-clerge-noblesse-tiers-etat-impots.svg"
    jules: "Le paysan paie trois fois : la taille au roi, la dîme au clergé, et des droits à son seigneur. Il doit même travailler gratuitement quelques jours pour le seigneur : c'est la **corvée**."

  - id: methode
    type: methode
    etapes:
      - "Demande-toi ce que fait la personne : est-ce qu'elle prie, est-ce qu'elle combat, ou est-ce qu'elle travaille ?"
      - "Elle sert l'Église (curé, moine, religieuse) : elle est du **clergé**."
      - "Elle est née dans une famille noble (seigneur, chevalier) : elle est de la **noblesse**."
      - "Sinon, elle est du **tiers état** : paysan, artisan, marchand, et même bourgeois riche."
      - "Récite les trois ordres dans l'ordre du programme : clergé, noblesse, tiers état. Compte sur tes doigts : il en faut trois."
    jules: "Pour ne pas en oublier un, retiens « P, C, T » : Prier, Combattre, Travailler. C'est le même ordre que clergé, noblesse, tiers état."

  - id: piege
    type: piege
    mauvaise_idee: "Au temps des rois, il y avait surtout des nobles et des gens d'Église, comme les princes et les châteaux des contes."
    pourquoi_faux: "Le clergé et la noblesse sont très peu nombreux : environ 2 habitants sur 100. On les voit beaucoup dans les livres, car ils sont riches et puissants."
    bonne_idee: "Sur 100 habitants, environ 98 sont du **tiers état**, et environ 80 sont des **paysans**. La société d'ordres est surtout une société de paysans."
    jules: "Imagine ta classe de 25 élèves en 1780 : presque tous seraient des enfants de paysans. Il n'y aurait peut-être aucun enfant noble."

  - id: exemple-village
    type: exemple
    situation: "En 1780, dans le village de Saint-Martin, vivent le curé Antoine, le seigneur du château, Jeanne qui cultive le blé, et Paul le forgeron. À quel ordre appartient chacun ?"
    calcul: "Le curé prie : il est du clergé. Le seigneur est noble : il est de la noblesse. Jeanne et Paul travaillent : ils sont du tiers état."
    conclusion: "Les **trois ordres** vivent dans ce village. Jeanne et Paul sont les plus nombreux, et ce sont eux qui paient la **taille**."
    jules: "À l'école du village, c'est souvent le curé ou un religieux qui apprend à lire aux enfants. C'est pour cela que le clergé fait aussi l'école."

  - id: exemple-banquier
    type: exemple
    situation: "Monsieur Durand est un banquier très riche de Bordeaux. Il a une grande maison, un carrosse et des domestiques. Est-il noble ?"
    calcul: "Il n'est pas né dans une famille noble, et il ne sert pas l'Église. Il gagne son argent en travaillant."
    conclusion: "Il est du **tiers état**, comme les paysans. Ce n'est pas l'argent qui décide de l'ordre : c'est la **naissance**, ou le choix de servir l'Église."
    jules: "On appelle ces riches habitants des villes les **bourgeois**. Ils sont riches, mais ils n'ont pas les privilèges des nobles, et cela les rend souvent mécontents."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "📖", titre: "Lexique", description: "ordre, privilège, taille, dîme", outil: "lexique"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine une pyramide en trois étages et place les trois ordres dedans. Le tiers état est tout en bas, et c'est l'étage le plus grand."
