<text class="t" x="115.0" y="236.0" text-anchor="middle" dominant-baseline="central">le tiers état paie</text>
<text class="t" x="115.0" y="257.0" text-anchor="middle" dominant-baseline="central">les impôts, les privilégiés</text>
<text class="t" x="115.0" y="278.0" text-anchor="middle" dominant-baseline="central">presque pas</text>
<g class="c-gray"><text class="th" x="115.0" y="312.0" text-anchor="middle" dominant-baseline="central">c'est injuste</text></g>
<text class="t" x="340.0" y="236.0" text-anchor="middle" dominant-baseline="central">les caisses du roi</text>
<text class="t" x="340.0" y="257.0" text-anchor="middle" dominant-baseline="central">sont vides ; en 1788,</text>
<text class="t" x="340.0" y="278.0" text-anchor="middle" dominant-baseline="central">la récolte est perdue</text>
<g class="c-amber"><text class="th" x="340.0" y="312.0" text-anchor="middle" dominant-baseline="central">le pain est très cher</text></g>
<text class="t" x="565.0" y="236.0" text-anchor="middle" dominant-baseline="central">les Lumières :</text>
<text class="t" x="565.0" y="257.0" text-anchor="middle" dominant-baseline="central">liberté, égalité,</text>
<text class="t" x="565.0" y="278.0" text-anchor="middle" dominant-baseline="central">tolérance, raison</text>
<g class="c-teal"><text class="th" x="565.0" y="312.0" text-anchor="middle" dominant-baseline="central">des idées nouvelles</text></g>
<text class="ts" x="115.0" y="350.0" text-anchor="middle" dominant-baseline="central">les bourgeois riches</text>
<text class="ts" x="115.0" y="366.0" text-anchor="middle" dominant-baseline="central">veulent les mêmes droits</text>
<text class="ts" x="340.0" y="350.0" text-anchor="middle" dominant-baseline="central">le royaume est endetté,</text>
<text class="ts" x="340.0" y="366.0" text-anchor="middle" dominant-baseline="central">surtout à cause des guerres</text>
<text class="ts" x="565.0" y="350.0" text-anchor="middle" dominant-baseline="central">Voltaire, Montesquieu,</text>
<text class="ts" x="565.0" y="366.0" text-anchor="middle" dominant-baseline="central">Rousseau, Diderot...</text>
</svg>
