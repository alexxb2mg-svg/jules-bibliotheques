<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg"><title>Le royaume en 1789 : social, économique, intellectuel</title>
<g class="c-gray"><text class="tl" x="115.0" y="24.0" text-anchor="middle" dominant-baseline="central">social</text></g>
<g class="c-amber"><text class="tl" x="340.0" y="24.0" text-anchor="middle" dominant-baseline="central">économique</text></g>
<g class="c-teal"><text class="tl" x="565.0" y="24.0" text-anchor="middle" dominant-baseline="central">intellectuel</text></g>
<text class="ts" x="115.0" y="48.0" text-anchor="middle" dominant-baseline="central">la société</text>
<text class="ts" x="340.0" y="48.0" text-anchor="middle" dominant-baseline="central">l'argent, le pain</text>
<text class="ts" x="565.0" y="48.0" text-anchor="middle" dominant-baseline="central">les idées</text>
