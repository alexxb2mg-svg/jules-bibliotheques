<text class="t" x="115.0" y="226.0" text-anchor="middle" dominant-baseline="central">curés, moines, religieuses,</text>
<text class="t" x="115.0" y="245.0" text-anchor="middle" dominant-baseline="central">évêques</text>
<text class="ts" x="115.0" y="270.0" text-anchor="middle" dominant-baseline="central">aussi : soigne les malades,</text>
<text class="ts" x="115.0" y="286.0" text-anchor="middle" dominant-baseline="central">fait l'école</text>
