<text class="t" x="340.0" y="226.0" text-anchor="middle" dominant-baseline="central">seigneurs, chevaliers,</text>
<text class="t" x="340.0" y="245.0" text-anchor="middle" dominant-baseline="central">nobles de la cour du roi</text>
<text class="ts" x="340.0" y="270.0" text-anchor="middle" dominant-baseline="central">défend le royaume</text>
<text class="ts" x="340.0" y="286.0" text-anchor="middle" dominant-baseline="central">à la guerre</text>
