<g class="c-blue"><text class="tl" x="340.0" y="22.0" text-anchor="middle" dominant-baseline="central">La noblesse</text></g>
<g class="c-blue"><text class="ts" x="340.0" y="46.0" text-anchor="middle" dominant-baseline="central">2e ordre</text></g>
