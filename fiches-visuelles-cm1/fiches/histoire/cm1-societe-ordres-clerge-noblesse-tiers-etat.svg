<text x="565.0" y="196.0" font-size="20" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">il TRAVAILLE</text>
<text class="t" x="565.0" y="226.0" text-anchor="middle" dominant-baseline="central">paysans, artisans,</text>
<text class="t" x="565.0" y="245.0" text-anchor="middle" dominant-baseline="central">marchands, bourgeois</text>
<text class="ts" x="565.0" y="270.0" text-anchor="middle" dominant-baseline="central">nourrit tout le royaume</text>
<text class="ts" x="565.0" y="286.0" text-anchor="middle" dominant-baseline="central">et fabrique les objets</text>
