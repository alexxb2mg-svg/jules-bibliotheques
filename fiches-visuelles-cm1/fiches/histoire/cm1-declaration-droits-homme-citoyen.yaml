blocs:
  - id: article-1
    type: formule
    expression: "« Les hommes naissent et demeurent [libres] et [égaux en droits]. »"
    termes:
      libres: {couleur: bleu, legende: "→ la **liberté** : pouvoir faire tout ce qui ne nuit pas aux autres, penser et dire ce qu'on veut"}
      égaux en droits: {couleur: vert, legende: "→ **l'égalité** : les mêmes droits et la même loi pour tous, donc la fin des privilèges"}
    jules: "C'est l'article 1, le plus célèbre. « Demeurer » veut dire « rester » : on naît libre et on le reste toute sa vie."

  - id: carte
    type: carte
    noeuds:
      - {id: declaration, titre: "La Déclaration, 26 août 1789", sous_titre: "les nouveaux principes de la société", principal: true}
      - {id: liberte, titre: "Liberté", sous_titre: "faire ce qui ne nuit pas aux autres, avoir ses opinions"}
      - {id: egalite, titre: "Égalité", sous_titre: "les mêmes droits pour tous, l'impôt payé par tous"}
      - {id: souverainete, titre: "Souveraineté nationale", sous_titre: "le pouvoir vient de la nation, pas du roi"}
      - {id: citoyen, titre: "Citoyenneté", sous_titre: "le citoyen participe à faire la loi"}
    liens:
      - {de: declaration, vers: liberte}
      - {de: declaration, vers: egalite}
      - {de: declaration, vers: souverainete}
      - {de: declaration, vers: citoyen}
    jules: "La **nation**, c'est l'ensemble des citoyens du pays. Dire que la souveraineté est dans la nation, c'est dire que le vrai chef, ce n'est plus le roi, mais le peuple."

  - id: schema-articles
    type: schema
    titre: "Six articles clés de la Déclaration, et ce qu'ils veulent dire"
    svg: "cm1-declaration-droits-homme-citoyen.svg"
    jules: "La Déclaration compte 17 articles. Les députés l'ont écrite pour servir de début à une **constitution**, le texte qui fixe les règles de fonctionnement du pays."

  - id: schema-avant-apres
    type: schema
    titre: "Ce qui change avec la Déclaration : avant et après"
    svg: "cm1-declaration-droits-homme-citoyen-avant-apres.svg"
    jules: "Avant 1789, le roi pouvait faire enfermer quelqu'un sans procès, avec une simple lettre signée de sa main, appelée **lettre de cachet**. L'article 7 met fin à cela."

  - id: methode
    type: methode
    etapes:
      - "Retiens la date : **26 août 1789**, trois semaines après la nuit du 4 août."
      - "Récite l'article 1 : les hommes naissent et demeurent **libres** et **égaux en droits**."
      - "Ajoute un autre principe : la loi est la même pour tous, l'impôt est payé par tous, chacun peut avoir ses opinions."
      - "Explique pourquoi c'est nouveau : avant, il y avait des privilèges et un roi qui décidait seul."
    jules: "Deux mots suffisent pour commencer une bonne réponse : liberté et égalité. Ce sont aussi les deux premiers mots de la devise de la France."

  - id: piege
    type: piege
    mauvaise_idee: "La Déclaration des droits de l'homme et du citoyen a été votée pendant la nuit du 4 août."
    pourquoi_faux: "La nuit du 4 août, les députés **abolissent les privilèges**. La Déclaration est adoptée plus tard, le **26 août 1789**."
    bonne_idee: "4 août : on supprime les privilèges, on démolit l'ancien. 26 août : on écrit les nouveaux principes, on construit le nouveau."
    jules: "D'abord on démolit, ensuite on reconstruit : c'est l'ordre du mois d'août 1789. Et le 4 vient avant le 26, comme sur le calendrier."

  - id: exemple-cour
    type: exemple
    situation: "À la récréation, Inès veut jouer au ballon à l'endroit où les petits jouent aux billes. En a-t-elle le droit ? Aide-toi de l'article 4."
    calcul: "L'article 4 dit que la liberté, c'est pouvoir faire tout ce qui ne nuit pas aux autres. Si le ballon casse le jeu des petits ou risque de les blesser, il leur nuit."
    conclusion: "Inès est libre de jouer au ballon, mais pas là où elle gêne les autres : sa **liberté** s'arrête là où elle nuirait à autrui."
    jules: "« Autrui » est un vieux mot qui veut dire « les autres ». La liberté de chacun a donc une limite : la liberté des autres."

  - id: exemple-reglement
    type: exemple
    situation: "Dans la classe de Lucas, les élèves écrivent ensemble le règlement de la classe : chacun propose, puis on vote. Quel article de la Déclaration cela rappelle-t-il ?"
    calcul: "La règle est décidée par tous, et elle s'applique à tous, même au délégué de classe."
    conclusion: "C'est l'article 6 : la **loi** est l'expression de la **volonté générale**, et elle doit être la même pour tous."
    jules: "Attention, en 1789, les femmes n'ont pas les mêmes droits que les hommes : elles ne votent pas. En 1791, Olympe de Gouges écrit une Déclaration des droits de la femme et de la citoyenne pour le dénoncer."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🕰️", titre: "Frise chronologique", description: "4 août, 26 août 1789", outil: "frise-chronologique"}
      - {icone: "📖", titre: "Lexique", description: "citoyen, constitution, souveraineté", outil: "lexique"}
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
    jules: "La Déclaration de 1789 est toujours en vigueur : elle fait partie des textes de notre Constitution d'aujourd'hui. Elle doit être affichée dans chaque école : cherche-la dans la tienne."
