<g class="c-red"><text class="tl" x="115.0" y="204.0" text-anchor="middle" dominant-baseline="central">la boussole</text></g>
<text class="t" x="115.0" y="230.0" text-anchor="middle" dominant-baseline="central">son aiguille montre</text>
<text class="t" x="115.0" y="248.0" text-anchor="middle" dominant-baseline="central">toujours le nord</text>
<g class="c-amber"><text class="tl" x="340.0" y="204.0" text-anchor="middle" dominant-baseline="central">l'astrolabe</text></g>
<text class="t" x="340.0" y="230.0" text-anchor="middle" dominant-baseline="central">on vise le soleil :</text>
<text class="t" x="340.0" y="248.0" text-anchor="middle" dominant-baseline="central">on sait si on est plus au nord</text>
<g class="c-green"><text class="tl" x="565.0" y="204.0" text-anchor="middle" dominant-baseline="central">la carte marine</text></g>
<text class="t" x="565.0" y="230.0" text-anchor="middle" dominant-baseline="central">les côtes connues</text>
<text class="t" x="565.0" y="248.0" text-anchor="middle" dominant-baseline="central">et les directions à suivre</text>
<text class="t" x="340.0" y="266.0" text-anchor="middle" dominant-baseline="central">ou plus au sud</text>
<text class="ts" x="115.0" y="266.0" text-anchor="middle" dominant-baseline="central">même sans voir la côte</text>
