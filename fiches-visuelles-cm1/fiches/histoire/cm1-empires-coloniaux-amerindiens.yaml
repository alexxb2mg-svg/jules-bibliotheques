notion: cm1-empires-coloniaux-amerindiens
titre: "Les premiers empires coloniaux en Amérique et les Amérindiens"
matiere: histoire
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p.5", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: definition
    type: formule
    expression: "empire colonial = des [terres conquises] dominées par un [pays d'Europe]"
    termes:
      "terres conquises": {couleur: orange, legende: "→ des territoires pris par la force aux peuples qui y vivaient : ici, les **Amérindiens**"}
      "pays d'Europe": {couleur: bleu, legende: "→ d'abord **l'Espagne** et **le Portugal**, au XVIe siècle ; plus tard la France et l'Angleterre"}
    jules: "Les terres d'un empire colonial s'appellent des **colonies**. Elles sont gouvernées de très loin, depuis l'Europe, par le roi du pays qui les a conquises."

  - id: carte
    type: carte
    noeuds:
      - {id: empires, titre: "Les premiers empires coloniaux", sous_titre: "en Amérique, après 1492", principal: true}
      - {id: espagne, titre: "L'Espagne", sous_titre: "Mexique, Caraïbes, Pérou : le plus grand empire"}
      - {id: portugal, titre: "Le Portugal", sous_titre: "le Brésil, à partir de 1500"}
      - {id: amerindiens, titre: "Les Amérindiens", sous_titre: "les premiers habitants, déjà là depuis des milliers d'années"}
      - {id: consequences, titre: "Les conséquences", sous_titre: "maladies, guerres, travail forcé : des millions de morts"}
    liens:
      - {de: empires, vers: espagne}
      - {de: empires, vers: portugal}
      - {de: empires, vers: amerindiens, libelle: "terres prises aux"}
      - {de: empires, vers: consequences}
    jules: "« Amérindien » veut dire « Indien d'Amérique ». Les peuples d'Amérique étaient très nombreux et très différents : les Aztèques au Mexique, les Mayas, les Incas dans les montagnes des Andes, et bien d'autres."

  - id: schema-carte
    type: schema
    titre: "Localiser les empires de l'Espagne et du Portugal, vers 1600"
    svg: "cm1-empires-coloniaux-amerindiens.svg"
    jules: "En 1494, l'Espagne et le Portugal se partagent les terres à découvrir avec une ligne tracée sur la carte. Le Brésil est à l'est de cette ligne : c'est pour cela qu'on y parle portugais aujourd'hui, et espagnol presque partout ailleurs en Amérique du Sud."

  - id: schema-consequences
    type: schema
    titre: "Ce que la conquête change pour les Amérindiens"
    svg: "cm1-empires-coloniaux-amerindiens-consequences.svg"
    jules: "La **variole** est une maladie que les Amérindiens n'avaient jamais connue : leur corps ne savait pas s'en défendre. Elle a tué bien plus de personnes que les armes."

  - id: methode
    type: methode
    etapes:
      - "Lis d'abord la légende de la carte : chaque couleur correspond à un pays d'Europe."
      - "Pose ton doigt sur le Mexique, puis descends jusqu'au Pérou : c'est l'empire de **l'Espagne**."
      - "Va à l'est de l'Amérique du Sud, le long de la côte : le Brésil, c'est l'empire du **Portugal**."
      - "Pour les conséquences, pense à trois mots : **maladies**, guerres, travail forcé. Ajoute que les terres ont été prises aux Amérindiens."
    jules: "Un moyen de t'en souvenir : le Portugal est un petit pays, mais il a eu le Brésil, le plus grand pays d'Amérique du Sud aujourd'hui."

  - id: piege
    type: piege
    mauvaise_idee: "Christophe Colomb a découvert une terre vide, et les Européens se sont installés là où il n'y avait personne."
    pourquoi_faux: "L'Amérique était habitée depuis des milliers d'années par les **Amérindiens**. Il y avait des villages, des villes et de grands empires, comme celui des Aztèques et celui des Incas."
    bonne_idee: "Les Européens ont **conquis** des terres qui appartenaient déjà à des peuples. Tenochtitlan, la capitale des Aztèques, était une immense ville, avec des canaux, des temples et des marchés."
    jules: "Le mot « découverte » est vrai pour les Européens, qui ne connaissaient pas ce continent. Pour les Amérindiens, c'est une **invasion** de leurs terres."

  - id: exemple-cantine
    type: exemple
    situation: "À la cantine, Yanis mange des frites, des épis de maïs et un carré de chocolat au dessert. Qui cultivait ces plantes avant l'arrivée des Européens ?"
    calcul: "La pomme de terre vient des Andes, chez les Incas. Le maïs vient du Mexique. Le cacao, qui sert à faire le chocolat, était cultivé par les Aztèques et les Mayas."
    conclusion: "Ces aliments ont été cultivés d'abord par les **Amérindiens**. Les Européens les ont rapportés en Europe, et on les mange encore aujourd'hui."
    jules: "Dans l'autre sens, les Européens apportent en Amérique le cheval, le blé et la vache, que les Amérindiens ne connaissaient pas. Mais ils apportent aussi des maladies terribles."

  - id: exemple-village
    type: exemple
    situation: "Imagine un village du centre du Mexique qui compte 500 habitants amérindiens en 1519. Sur 10 habitants, il en reste environ 1 vers 1600. Combien d'habitants reste-t-il environ ?"
    calcul: "Il reste 1 habitant sur 10, donc on partage 500 en 10 : 500 ÷ 10 = 50."
    conclusion: "Il reste environ **50 habitants** sur 500. En moins d'un siècle, 9 habitants sur 10 ont disparu, surtout à cause des **maladies**."
    jules: "Ces chiffres sont des estimations : personne ne comptait tous les habitants à l'époque. Mais tous les historiens sont d'accord : c'est une catastrophe immense pour les Amérindiens."

  - id: renfort
    type: renfort
    liens:
      - {icone: "🗺️", titre: "Carte de l'Amérique", description: "colorier l'Espagne et le Portugal", outil: "lecon"}
      - {icone: "🕰️", titre: "Frise chronologique", description: "1492, 1521, 1533", outil: "frise-chronologique"}
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
    jules: "Défi : sur une carte muette de l'Amérique, colorie en orange l'empire de l'Espagne et en vert celui du Portugal. Place ensuite une étoile sur Mexico (l'ancienne Tenochtitlan) et une sur Cuzco."
