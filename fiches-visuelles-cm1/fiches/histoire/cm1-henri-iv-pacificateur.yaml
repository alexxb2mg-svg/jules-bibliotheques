    jules: "Pacificateur vient du latin « pax », qui veut dire la paix : pacifier, c'est ramener la paix. Tu retrouves ce mot dans l'océan Pacifique, l'océan « paisible »."

  - id: schema-frise
    type: schema
    titre: "Les guerres de religion, le règne d'Henri IV et l'édit de Nantes sur la frise"
    svg: "cm1-henri-iv-pacificateur.svg"
    jules: "L'édit de Nantes n'arrive pas au début du règne : Henri IV est déjà roi depuis 9 ans. Il lui a fallu tout ce temps pour se faire accepter et ramener la paix."

  - id: schema-avant-apres
    type: schema
    titre: "Avant et après l'édit de Nantes : de la guerre à la paix"
    svg: "cm1-henri-iv-pacificateur-avant-apres.svg"
    jules: "Un édit, c'est une loi décidée par le roi. Celui de Nantes ne force personne à changer de religion : il permet aux catholiques et aux protestants de vivre dans le même royaume sans se battre."

  - id: methode
    type: methode
    etapes:
      - "Retiens les dates du règne : **1589-1610**."
      - "Rappelle le contexte : les **guerres de religion** entre catholiques et protestants, de 1562 à 1598."
      - "Place **1598** au milieu du règne : c'est l'**édit de Nantes**."
      - "Explique le mot « pacificateur » : avec l'édit, les protestants peuvent prier à leur façon, et la guerre s'arrête."
    jules: "Catholiques et protestants sont tous chrétiens. Ce qui les sépare, c'est la façon de prier et le rôle du pape, que les protestants refusent."

  - id: piege
    type: piege
    mauvaise_idee: "Henri IV signe l'édit de Nantes dès qu'il devient roi, en 1589."
    pourquoi_faux: "Le règne commence en **1589**, mais l'**édit de Nantes** date de **1598** : 9 ans plus tard (1598 − 1589 = 9), au milieu du règne."
    bonne_idee: "1589 : il devient roi. 1593 : il devient catholique. 1598 : l'édit de Nantes. 1610 : il meurt, assassiné."
    jules: "Autre piège : oublier le mot « pacificateur ». Henri IV a dû se battre pour devenir roi, mais on se souvient de lui pour la paix."

  - id: exemple-voisines
    type: exemple
    situation: "En 1600, dans la même ville, Marie, catholique, va à la messe, et sa voisine Suzanne, protestante, va au temple. Trente ans plus tôt, en pleine guerre de religion, c'était dangereux pour Suzanne. Qu'est-ce qui a changé ?"
    calcul: "Entre les deux dates, en 1598, Henri IV a signé l'édit de Nantes : les protestants ont le droit de prier à leur façon, dans certains lieux."
    conclusion: "C'est l'**édit de Nantes** : Henri IV, **roi pacificateur**, permet aux deux religions de vivre en paix."
    jules: "C'est un peu comme dans la cour : quand deux groupes se disputent le terrain, une règle juste permet à chacun de jouer. L'édit de Nantes est cette règle, décidée par le roi."

  - id: exemple-durees
    type: exemple
    situation: "Rayan veut mesurer deux durées sur sa frise. Combien de temps ont duré les guerres de religion (1562-1598) ? Et le règne d'Henri IV (1589-1610) ?"
    calcul: "Guerres de religion : 1598 − 1562 = 36 ans. Règne d'Henri IV : 1610 − 1589 = 21 ans."
    conclusion: "Après **36 ans** de guerres, Henri IV y met fin avec l'édit de Nantes, pendant son règne de **21 ans**."
    jules: "Sur la frise, les deux bandes se chevauchent de 1589 à 1598 : ce sont les années où Henri IV est roi pendant la guerre."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : trace une frise de 1550 à 1620 sur ton cahier, avec 1 cm pour 10 ans. Place 1562, 1589, 1598 et 1610."
