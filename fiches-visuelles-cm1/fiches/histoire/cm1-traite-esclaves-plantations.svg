<g class="c-amber"><text class="th" x="304.0" y="110.7" text-anchor="start" dominant-baseline="central">Amériques → Europe</text></g>
<text class="t" x="304.0" y="129.7" text-anchor="start" dominant-baseline="central">sucre, café, cacao,</text>
<text class="t" x="304.0" y="148.7" text-anchor="start" dominant-baseline="central">coton, tabac</text>
<circle cx="286.0" cy="179.8" r="11" fill="#5F5E5A" stroke="none" stroke-width="1.5"/>
<text x="286.0" y="179.8" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text>
<g class="c-gray"><text class="th" x="304.0" y="179.8" text-anchor="start" dominant-baseline="central">Europe → Afrique</text></g>
<text class="t" x="304.0" y="198.8" text-anchor="start" dominant-baseline="central">tissus, armes,</text>
<text class="t" x="304.0" y="217.8" text-anchor="start" dominant-baseline="central">alcool, objets</text>
<circle cx="373.0" cy="302.7" r="11" fill="#A32D2D" stroke="none" stroke-width="1.5"/>
