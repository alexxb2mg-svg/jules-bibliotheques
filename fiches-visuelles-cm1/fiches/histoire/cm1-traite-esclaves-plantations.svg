<g class="c-red"><text class="th" x="391.0" y="302.7" text-anchor="start" dominant-baseline="central">Afrique → Amériques</text></g>
<g class="c-red"><text class="t" x="391.0" y="321.7" text-anchor="start" dominant-baseline="central">des femmes, des hommes,</text></g>
<g class="c-red"><text class="t" x="391.0" y="340.7" text-anchor="start" dominant-baseline="central">des enfants africains,</text></g>
<g class="c-red"><text class="t" x="391.0" y="359.7" text-anchor="start" dominant-baseline="central">déportés de force.</text></g>
<g class="c-red"><text class="ts" x="391.0" y="378.7" text-anchor="start" dominant-baseline="central">Traversée de 1 à 3 mois :</text></g>
<g class="c-red"><text class="ts" x="391.0" y="397.7" text-anchor="start" dominant-baseline="central">beaucoup meurent.</text></g>
<text class="ts" x="340.0" y="454.0" text-anchor="middle" dominant-baseline="central">Carte simplifiée. Du XVIe au XIXe siècle, plus de 12 millions d'Africains sont déportés.</text>
