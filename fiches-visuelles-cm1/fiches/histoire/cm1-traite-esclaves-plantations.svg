<text class="th" x="235.0" y="364.2" text-anchor="middle" dominant-baseline="central">DU SUD</text>
<text class="th" x="81.4" y="105.6" text-anchor="middle" dominant-baseline="central">DU NORD</text>
<circle cx="286.0" cy="110.7" r="11" fill="#854F0B" stroke="none" stroke-width="1.5"/>
