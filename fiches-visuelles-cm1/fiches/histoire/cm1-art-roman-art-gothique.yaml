notion: cm1-art-roman-art-gothique
titre: "L'art roman et l'art gothique : reconnaître une église du Moyen Âge"
matiere: histoire
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p.5", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: indice
    type: formule
    expression: "[arc rond] → roman · [arc pointu] → gothique"
    termes:
      "arc rond": {couleur: orange, legende: "l'arc en **plein cintre** : un demi-cercle en haut des portes, des fenêtres et des voûtes romanes"}
      "arc pointu": {couleur: bleu, legende: "l'**arc brisé** : deux morceaux de cercle qui se rejoignent en pointe, typique de l'art gothique"}
    jules: "Pour t'en souvenir : « roman » et « rond » commencent tous les deux par R-O. Le gothique, lui, pointe vers le ciel."

  - id: carte
    type: carte
    noeuds:
      - {id: eglises, titre: "Les églises du Moyen Âge", sous_titre: "deux grands styles à savoir reconnaître", principal: true}
      - {id: roman, titre: "L'art roman", sous_titre: "XIe-XIIe siècles : massif, murs épais, sombre"}
      - {id: gothique, titre: "L'art gothique", sous_titre: "à partir du XIIe siècle : très haut, lumineux"}
      - {id: arcs, titre: "Le meilleur indice", sous_titre: "la forme des arcs : ronde ou pointue"}
      - {id: arcs-boutants, titre: "Le secret du gothique", sous_titre: "des arcs-boutants tiennent les murs de dehors"}
    liens:
      - {de: eglises, vers: roman}
      - {de: eglises, vers: gothique}
      - {de: eglises, vers: arcs}
      - {de: gothique, vers: arcs-boutants}
    jules: "Le style gothique vient après le style roman : les bâtisseurs ont trouvé comment construire plus haut, avec plus de lumière. Mais pendant un temps, on construit encore des deux façons."

  - id: schema-coupe
    type: schema
    titre: "Coupées en deux : pourquoi l'église romane est sombre et la gothique lumineuse"
    svg: "cm1-art-roman-art-gothique.svg"
    jules: "Une voûte en pierre est lourde : elle pousse les murs vers l'extérieur. Les bâtisseurs romans font donc des murs très épais ; les gothiques posent des arcs-boutants dehors, et les murs peuvent devenir fins et remplis de vitraux."

  - id: schema-reconnaitre
    type: schema
    titre: "Reconnaître le style : regarde les arcs, pas le clocher"
    svg: "cm1-art-roman-art-gothique-reconnaitre.svg"
    jules: "Une église romane peut très bien avoir un clocher pointu. C'est la forme du haut des portes et des fenêtres qui compte."

  - id: methode
    type: methode
    etapes:
      - "Regarde le haut des portes et des fenêtres : un **demi-cercle**, c'est roman ; une **pointe**, c'est gothique."
      - "Regarde les murs : **épais** avec de petites fenêtres, c'est roman ; **fins** avec de grands vitraux, c'est gothique."
      - "Cherche dehors des **arcs-boutants**, ou sur la façade une grande **rosace** : ce sont des indices gothiques."
      - "Justifie avec au moins deux indices : « Elle est gothique, car ses arcs sont pointus et elle a de grands vitraux. »"
    jules: "Deux indices valent mieux qu'un. Certaines églises ont été agrandies des siècles plus tard et mélangent les deux styles."

  - id: piege
    type: piege
    mauvaise_idee: "Toutes les églises du Moyen Âge sont du même style."
    pourquoi_faux: "Il y a **deux** grands styles : l'**art roman** (XIe-XIIe siècles), massif et sombre, puis l'**art gothique** (à partir du XIIe siècle), haut et lumineux."
    bonne_idee: "On observe avant de répondre : arcs en demi-cercle et murs épais, c'est roman ; arcs pointus, arcs-boutants et grands vitraux, c'est gothique."
    jules: "Attention aussi au clocher pointu : il ne prouve pas que l'église est gothique. Regarde les arcs."

  - id: exemple-chloe
    type: exemple
    situation: "En vacances, Chloé visite une vieille église de village. Les murs sont très épais, les fenêtres petites, et le haut du portail forme un demi-cercle. À l'intérieur, il fait plutôt sombre. De quel style est cette église ?"
    calcul: "Haut du portail en demi-cercle : arc en plein cintre. Murs épais et petites fenêtres : peu de lumière. Les trois indices vont dans le même sens."
    conclusion: "C'est une église **romane**, sans doute construite aux XIe ou XIIe siècles."
    jules: "Si tu vois des chapiteaux sculptés en haut des colonnes, avec des animaux ou des monstres, regarde-les bien : les sculpteurs romans adoraient ça."

  - id: exemple-notre-dame
    type: exemple
    situation: "Sur une photo de Notre-Dame de Paris, Yanis voit deux grandes tours, une rosace, des portails pointus et, sur les côtés, des arcs de pierre qui s'appuient contre les murs. De quel style est-elle ?"
    calcul: "Portails pointus : arcs brisés. Arcs de pierre dehors : arcs-boutants. Rosace : un grand vitrail rond. Tous les indices sont gothiques."
    conclusion: "Notre-Dame de Paris est une cathédrale **gothique**, commencée en 1163."
    jules: "Les vitraux racontent des histoires en images. Ils aidaient aussi les gens qui ne savaient pas lire à connaître les récits de la Bible."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : dessine une fenêtre romane et une fenêtre gothique côte à côte. Puis regarde l'église la plus proche de chez toi, et note si ses arcs sont ronds ou pointus."
