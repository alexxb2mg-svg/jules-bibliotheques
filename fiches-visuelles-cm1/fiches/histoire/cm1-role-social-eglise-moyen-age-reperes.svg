<text x="450.0" y="34.0" font-size="18" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">une abbaye</text>
<text x="450.0" y="58.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">des moines (ou des moniales)</text>
<text x="450.0" y="75.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">y vivent et y prient,</text>
<text x="450.0" y="92.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">guidés par un abbé</text>
<text x="450.0" y="109.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">(ou une abbesse) ;</text>
<text x="450.0" y="126.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">souvent à la campagne</text>
<text x="450.0" y="150.0" font-size="14" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">Cluny : fondée en 910,</text>
<text x="450.0" y="168.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">une des plus grandes</text>
<text x="450.0" y="185.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">abbayes d'Europe</text>
