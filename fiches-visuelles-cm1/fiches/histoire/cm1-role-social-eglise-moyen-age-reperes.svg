<text x="450.0" y="242.0" font-size="18" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">une cathédrale</text>
<text x="450.0" y="266.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">la grande église de l'évêque,</text>
<text x="450.0" y="283.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">au cœur d'une ville ;</text>
<text x="450.0" y="300.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">à côté : une école et un</text>
<text x="450.0" y="317.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">hôpital, l'Hôtel-Dieu</text>
<text x="450.0" y="350.0" font-size="14" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">Notre-Dame de Paris :</text>
<text x="450.0" y="368.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="start" dominant-baseline="central">commencée en 1163</text>
</svg>
