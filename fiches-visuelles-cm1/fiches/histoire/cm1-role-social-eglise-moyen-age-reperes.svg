<text x="150.0" y="26.0" font-size="13" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">carte simplifiée de la France</text>
<circle cx="164.7" cy="133.7" r="7" fill="#534AB7" stroke="#ffffff" stroke-width="2"/>
<text x="176.7" y="119.7" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="start" dominant-baseline="central">Paris</text>
<text x="176.7" y="137.7" font-size="13" fill="#534AB7" font-weight="600" text-anchor="start" dominant-baseline="central">Notre-Dame</text>
<circle cx="210.8" cy="204.1" r="7" fill="#534AB7" stroke="#ffffff" stroke-width="2"/>
<rect x="203.8" y="197.1" width="14.0" height="14.0" rx="0" fill="none" stroke="none" stroke-width="1.5"/>
<text x="198.8" y="196.1" font-size="15" fill="#1a1a18" font-weight="700" text-anchor="end" dominant-baseline="central">Cluny</text>
<text x="198.8" y="214.1" font-size="13" fill="#534AB7" font-weight="600" text-anchor="end" dominant-baseline="central">en Bourgogne</text>
<text x="150.0" y="360.0" font-size="14" fill="#1a1a18" font-weight="700" text-anchor="middle" dominant-baseline="central">Et près de chez toi ?</text>
<text x="150.0" y="380.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">Cherche une abbaye ou une</text>
<text x="150.0" y="397.0" font-size="13" fill="#1a1a18" font-weight="400" text-anchor="middle" dominant-baseline="central">cathédrale dans ta région.</text>
