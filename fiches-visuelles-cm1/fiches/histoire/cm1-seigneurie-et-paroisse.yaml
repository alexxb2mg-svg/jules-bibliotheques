notion: cm1-seigneurie-et-paroisse
titre: "La seigneurie et la paroisse : les deux cadres de la vie au Moyen Âge"
matiere: histoire
niveau: CM1
auteurs: ["jules-ia"]
licence: CC-BY-SA-4.0
generation: {par: "jules-ia", le: "2026-09-27", paquet: "fiche-visuelle/86372909b5"}
sources:
  - {titre: "Programme d'histoire-géographie du cycle 3, arrêté du 22-4-2026, BO n° 22 du 28/05/2026, p.4", url: "https://www.education.gouv.fr/sites/default/files/document/annexe-4-programme-d-histoire-geographie-cycle-3-516779.pdf", licence: etalab-2.0}
relecture: {statut: a_relire}
blocs:
  - id: deux-cadres
    type: formule
    expression: "[seigneurie] : le seigneur commande · [paroisse] : l'Église encadre"
    termes:
      seigneurie: {couleur: orange, legende: "la domination d'un **seigneur** sur un territoire et sur les femmes et les hommes qui y vivent"}
      paroisse: {couleur: violet, legende: "l'encadrement par l'**Église** de la vie de chacun, de sa naissance à sa mort"}
    jules: "Un même village fait partie des deux en même temps. Le seigneur, au château, commande la terre ; le curé, à l'église, baptise, marie et enterre les habitants."

  - id: carte
    type: carte
    noeuds:
      - {id: moyen-age, titre: "Le Moyen Âge (XIe-XIIIe siècles)", sous_titre: "deux cadres organisent la vie des gens", principal: true}
      - {id: seigneurie, titre: "La seigneurie", sous_titre: "un seigneur domine une terre et ses habitants"}
      - {id: chateau, titre: "Le château fort", sous_titre: "il protège, loge le seigneur, montre sa puissance"}
      - {id: paroisse, titre: "La paroisse", sous_titre: "l'Église accompagne chacun, du baptême à la tombe"}
      - {id: frise, titre: "476 → 1492", sous_titre: "le début et la fin du Moyen Âge sur la frise"}
    liens:
      - {de: moyen-age, vers: seigneurie}
      - {de: seigneurie, vers: chateau}
      - {de: moyen-age, vers: paroisse}
      - {de: moyen-age, vers: frise}
    jules: "Pour ne pas les mélanger, cherche qui commande la terre, puis qui baptise, marie et enterre les gens. Le premier, c'est le seigneur (la seigneurie) ; le second, c'est l'Église (la paroisse)."

  - id: schema-plan
    type: schema
    titre: "Le plan d'une seigneurie : qui vit où, et qui travaille pour qui"
    svg: "cm1-seigneurie-et-paroisse.svg"
    jules: "Le moulin et le four appartiennent au seigneur : les paysans doivent s'en servir et payer pour ça. On les appelle le moulin et le four **banals**, un mot qui veut dire aujourd'hui « ordinaire »."

  - id: schema-chateau
    type: schema
    titre: "Les trois rôles du château fort : protéger, y vivre, montrer sa puissance"
    svg: "cm1-seigneurie-et-paroisse-chateau.svg"
    jules: "En cas d'attaque, les paysans du village viennent s'abriter derrière les murailles. Le donjon, lui, est si haut qu'on le voit de très loin : tout le monde sait qui commande."

  - id: schema-frise
    type: schema
    titre: "Le Moyen Âge sur la frise : de 476 à 1492, et les XIe-XIIIe siècles au milieu"
    svg: "cm1-seigneurie-et-paroisse-frise.svg"
    jules: "Pour trouver le siècle d'une date, prends le nombre de centaines et ajoute 1 : 1150, c'est 11 centaines, donc le XIIe siècle. Attention aux années rondes : 1100 est la dernière année du XIe siècle."

  - id: graphe
    type: graphe
    gabarit: frise
    curseurs:
      - {id: curseur-date, nom: date, min: 400, max: 1600, pas: 1, depart: 1100}
      - {id: curseur-debut, nom: début, min: 400, max: 400, pas: 1, depart: 400}
      - {id: curseur-fin, nom: fin, min: 1600, max: 1600, pas: 1, depart: 1600}
      - {id: curseur-de, nom: de, min: 1000, max: 1000, pas: 1, depart: 1000}
      - {id: curseur-a, nom: à, min: 1300, max: 1300, pas: 1, depart: 1300}
    lectures:
      - {si: "date < 476", texte: "Avant 476, c'est l'**Antiquité** : le Moyen Âge n'a pas encore commencé."}
      - {si: "date >= 476 && date < 1000", texte: "Le **Moyen Âge** commence en 476, à la fin de l'Empire romain d'Occident."}
      - {si: "date >= 1000 && date <= 1300", texte: "XIe-XIIIe siècles, la bande orange : le temps des **seigneurs**, des châteaux forts et des **paroisses**."}
      - {si: "date > 1300", texte: "Le Moyen Âge finit en **1492**, quand Christophe Colomb arrive en Amérique. Après, ce sont les Temps modernes."}
    jules: "Le Moyen Âge dure 1 016 ans (1492 − 476). Les seigneuries et les paroisses, c'est la bande orange, au milieu."

  - id: methode
    type: methode
    etapes:
      - "Lis le document et cherche qui agit. Un **seigneur** qui commande une terre et ses habitants : c'est la **seigneurie**."
      - "L'Église qui accompagne les gens (baptême, mariage, messe du dimanche, enterrement) : c'est la **paroisse**."
      - "Pour le château, pense à trois verbes : **protéger**, **loger** le seigneur, **impressionner**."
      - "Pour une date, place-la sur la frise : entre 476 et 1492, c'est le **Moyen Âge** ; entre 1001 et 1300, ce sont les XIe-XIIIe siècles."
    jules: "Les trois verbes du château tiennent dans ta main : un doigt pour la muraille qui protège, un pour la maison du seigneur, un pour le donjon qui impressionne."

  - id: piege
    type: piege
    mauvaise_idee: "La paroisse et la seigneurie, c'est pareil : c'est le village du seigneur."
    pourquoi_faux: "La **seigneurie** parle du pouvoir : qui commande la terre et les gens. La **paroisse** parle de la religion : l'Église qui encadre la vie de chacun, de la naissance à la mort."
    bonne_idee: "Dans le même village, il y a deux cadres : le seigneur, au château, fait payer les redevances ; le curé, à l'église, baptise les bébés et enterre les morts."
    jules: "Autre piège : croire que le château sert seulement à faire la guerre. Il protège, oui, mais c'est aussi la maison du seigneur et le signe de sa puissance."

  - id: exemple-four
    type: exemple
    situation: "Dans un texte écrit en 1150, Inès lit : « Les habitants doivent cuire leur pain au four du seigneur et lui donner une part de leur blé. » Ce texte parle-t-il de la seigneurie ou de la paroisse ? En quel siècle a-t-il été écrit ?"
    calcul: "Le texte dit ce que les habitants doivent au seigneur : c'est son pouvoir sur une terre et ses habitants. Pour le siècle : 1150 contient 11 centaines, et 11 + 1 = 12."
    conclusion: "C'est la **seigneurie**, au **XIIe siècle** : en plein Moyen Âge, entre 476 et 1492."
    jules: "Le four n'est pas un détail : le seigneur se fait payer chaque fois qu'un paysan y fait cuire son pain."

  - id: exemple-eglise
    type: exemple
    situation: "En sortie scolaire, Malik visite l'église de son village, construite au XIIe siècle. Le guide lui montre les fonts baptismaux, la grande cuve de pierre où l'on baptisait les bébés, puis le vieux cimetière autour de l'église. Quel cadre de la vie médiévale ces deux endroits montrent-ils ?"
    calcul: "Les fonts baptismaux : le baptême, juste après la naissance. Le cimetière : l'enterrement, après la mort. Entre les deux, le mariage et la messe se faisaient aussi à l'église."
    conclusion: "C'est la **paroisse** : l'Église accompagnait chacun **de sa naissance à sa mort**."
    jules: "Au Moyen Âge, les cloches de l'église rythment la journée du village : elles sonnent pour la prière, les fêtes et les enterrements."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Défi : invente le plan de ta seigneurie, avec un château, une église, un moulin, un four et des champs. Colorie en rouge tout ce qui appartient au seigneur."
