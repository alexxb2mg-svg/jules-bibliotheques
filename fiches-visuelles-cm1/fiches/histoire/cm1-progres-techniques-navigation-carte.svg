<line x1="24.0" y1="306.0" x2="64.0" y2="306.0" stroke="#C2410C" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="76.0" y="306.0" font-size="17" fill="#C2410C" font-weight="700" text-anchor="start" dominant-baseline="central">1492</text>
<text class="t" x="176.0" y="306.0" text-anchor="start" dominant-baseline="central">Christophe Colomb part d'Espagne et arrive en Amérique.</text>
<line x1="24.0" y1="340.0" x2="64.0" y2="340.0" stroke="#3B6D11" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="76.0" y="340.0" font-size="17" fill="#3B6D11" font-weight="700" text-anchor="start" dominant-baseline="central">1498</text>
<text class="t" x="176.0" y="340.0" text-anchor="start" dominant-baseline="central">Vasco de Gama contourne l'Afrique et arrive en Inde.</text>
<line x1="24.0" y1="374.0" x2="64.0" y2="374.0" stroke="#534AB7" stroke-width="3.5" stroke-linecap="round" marker-end="url(#fl)"/>
<text x="76.0" y="374.0" font-size="17" fill="#534AB7" font-weight="700" text-anchor="start" dominant-baseline="central">1519-1522</text>
<text class="t" x="176.0" y="374.0" text-anchor="start" dominant-baseline="central">L'expédition de Magellan fait le premier tour du monde.</text>
<g class="c-purple"><text class="t" x="340.0" y="410.0" text-anchor="middle" dominant-baseline="central">5 navires partent avec Magellan : un seul revient, en 1522, avec 18 marins.</text></g>
<text class="ts" x="340.0" y="432.0" text-anchor="middle" dominant-baseline="central">Carte simplifiée. La Terre est ronde : la route de Magellan sort à gauche et rentre à droite.</text>
