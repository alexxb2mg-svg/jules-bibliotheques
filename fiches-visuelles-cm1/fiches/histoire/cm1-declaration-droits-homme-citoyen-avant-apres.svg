<g class="c-red"><text class="tl" x="260.0" y="60.0" text-anchor="start" dominant-baseline="central">Avant 1789</text></g>
<g class="c-green"><text class="tl" x="600.0" y="60.0" text-anchor="start" dominant-baseline="central">Après</text></g>
<g class="c-green"><text class="ts" x="600.0" y="84.0" text-anchor="start" dominant-baseline="central">le 26 août</text></g>
<rect x="16.0" y="128.0" width="648.0" height="48.0" rx="0" fill="#F7F6F2" stroke="none" stroke-width="0"/>
<text class="th" x="24.0" y="152.0" text-anchor="start" dominant-baseline="central">la naissance</text>
<text x="150.0" y="152.0" font-size="18" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">✗</text>
<text class="t" x="166.0" y="152.0" text-anchor="start" dominant-baseline="central">noble ou non : des privilèges</text>
<text x="422.0" y="152.0" font-size="18" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">✓</text>
<text class="t" x="438.0" y="152.0" text-anchor="start" dominant-baseline="central">libres et égaux en droits (1)</text>
<rect x="16.0" y="186.0" width="648.0" height="48.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text class="th" x="24.0" y="210.0" text-anchor="start" dominant-baseline="central">les impôts</text>
<text x="150.0" y="210.0" font-size="18" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">✗</text>
<text class="t" x="166.0" y="210.0" text-anchor="start" dominant-baseline="central">surtout le tiers état</text>
<text x="422.0" y="210.0" font-size="18" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">✓</text>
<text class="t" x="438.0" y="210.0" text-anchor="start" dominant-baseline="central">tous, selon leurs moyens (13)</text>
<rect x="16.0" y="244.0" width="648.0" height="48.0" rx="0" fill="#F7F6F2" stroke="none" stroke-width="0"/>
<text class="th" x="24.0" y="268.0" text-anchor="start" dominant-baseline="central">la loi</text>
<text x="150.0" y="268.0" font-size="18" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">✗</text>
<text class="t" x="166.0" y="268.0" text-anchor="start" dominant-baseline="central">le roi décide seul</text>
<text x="422.0" y="268.0" font-size="18" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">✓</text>
<text class="t" x="438.0" y="268.0" text-anchor="start" dominant-baseline="central">la volonté des citoyens (6)</text>
<rect x="16.0" y="302.0" width="648.0" height="48.0" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/>
<text class="th" x="24.0" y="326.0" text-anchor="start" dominant-baseline="central">être arrêté</text>
<text x="150.0" y="326.0" font-size="18" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">✗</text>
<text class="t" x="166.0" y="326.0" text-anchor="start" dominant-baseline="central">sur ordre du roi, sans procès</text>
<text x="422.0" y="326.0" font-size="18" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">✓</text>
<text class="t" x="438.0" y="326.0" text-anchor="start" dominant-baseline="central">seulement selon la loi (7)</text>
<rect x="16.0" y="360.0" width="648.0" height="48.0" rx="0" fill="#F7F6F2" stroke="none" stroke-width="0"/>
<text class="th" x="24.0" y="384.0" text-anchor="start" dominant-baseline="central">ses opinions</text>
<text x="150.0" y="384.0" font-size="18" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">✗</text>
<text class="t" x="166.0" y="384.0" text-anchor="start" dominant-baseline="central">on peut être puni</text>
<text x="422.0" y="384.0" font-size="18" fill="#3B6D11" font-weight="700" text-anchor="middle" dominant-baseline="central">✓</text>
<text class="t" x="438.0" y="384.0" text-anchor="start" dominant-baseline="central">liberté d'opinion (10 et 11)</text>
<text class="ts" x="340.0" y="440.0" text-anchor="middle" dominant-baseline="central">Entre parenthèses : le numéro de l'article de la Déclaration.</text>
</svg>
