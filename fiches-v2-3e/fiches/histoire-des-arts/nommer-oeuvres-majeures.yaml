# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: nommer-oeuvres-majeures
version: 3
etat: verifiee
declencheurs:
- chefs-d'œuvre à connaître
- quel artiste a peint
- dater une œuvre
- repères en histoire des arts
- mouvement artistique
- carte d'identité d'une œuvre
- broderie de la conquête de 1066
- Vénus de Milo
- œuvres à retenir pour le brevet
prerequis: []
essentiel: 'En fin de 3e, il faut savoir nommer quelques œuvres majeures et les rattacher à une époque et à une aire de production
  (le pays, la région, la civilisation où elles ont été créées).


  Pour chaque œuvre, on retient sa carte d''identité (titre, artiste, date, lieu de conservation) et ses éléments constitutifs
  : le matériau (marbre, huile sur toile, broderie…), la forme (composition, couleurs, style), le sens (ce qu''elle représente,
  son message) et la fonction (à quoi elle servait : décorer, raconter, célébrer un pouvoir, dénoncer).


  Quelques repères, dans l''ordre du temps :

  - la Vénus de Milo, statue grecque en marbre de l''époque hellénistique (vers le IIe siècle avant J.-C.), musée du Louvre
  ;

  - la Tapisserie de Bayeux, longue broderie de laine sur toile de lin de la fin du XIe siècle, qui raconte la conquête de
  l''Angleterre par Guillaume de Normandie en 1066, conservée à Bayeux ;

  - La Joconde, de Léonard de Vinci, huile sur panneau de bois peinte au début du XVIe siècle, pendant la Renaissance italienne,
  musée du Louvre ;

  - La Liberté guidant le peuple, d''Eugène Delacroix, 1830, peinture romantique qui évoque la révolution de juillet 1830,
  musée du Louvre ;

  - Le Radeau de la Méduse, de Théodore Géricault, 1818-1819, huile sur toile qui montre des naufragés sur un radeau, musée
  du Louvre ;

  - Impression, soleil levant, de Claude Monet, 1872, qui a donné son nom à l''impressionnisme, musée Marmottan Monet à Paris
  ;

  - Les Demoiselles d''Avignon, de Pablo Picasso, 1907, huile sur toile, Museum of Modern Art de New York ;

  - Guernica, de Pablo Picasso, 1937, qui dénonce le bombardement d''une ville basque pendant la guerre d''Espagne, musée
  Reina Sofía à Madrid ;

  - Marilyn Diptych, d''Andy Warhol, 1962, œuvre du pop art américain, Tate à Londres.


  Astuce de mémoire : associer chaque œuvre à une époque (Antiquité, Moyen Âge, Renaissance, XIXe siècle, XXe siècle) et à
  un mot-clé (marbre, broderie, portrait, révolution, lumière, guerre, pop art).


  Ce qu''on attend au brevet : nommer l''œuvre et l''artiste, donner l''époque et le pays, et dire son matériau, sa forme,
  son sens et sa fonction.

  '
methode:
- Donner la carte d'identité de l'œuvre (titre, artiste, date, lieu de conservation).
- La situer dans une époque (Antiquité, Moyen Âge, Renaissance, XIXe siècle, XXe siècle…) et une aire de production (pays,
  civilisation).
- 'Dégager ses éléments constitutifs : matériau, forme, sens, fonction.'
- Relier l'œuvre à un mouvement artistique quand c'est possible (romantisme, impressionnisme, pop art…).
- Apprendre une œuvre par grande période (Antiquité, Moyen Âge, Renaissance, XIXe, XXe) avec un mot-clé pour chacune.
vocabulaire:
- terme: aire de production
  definition: le lieu (pays, région, civilisation) où une œuvre a été créée
- terme: mouvement artistique
  definition: un groupe d'artistes d'une même époque qui partagent des idées et une manière de faire (impressionnisme, pop
    art…)
- terme: fonction
  definition: ce à quoi sert une œuvre (décorer, raconter, célébrer un pouvoir, prier, dénoncer)
- terme: carte d'identité
  definition: 'les informations de base d''une œuvre : titre, artiste, date, lieu de conservation'
- terme: matériau
  definition: la matière dans laquelle l'œuvre est réalisée (marbre, huile sur toile, laine…)
- terme: pop art
  definition: un mouvement artistique né dans les années 1950-1960 qui s'inspire de la publicité et de la culture populaire
- terme: époque
  definition: une période de l'histoire (Antiquité, Moyen Âge, Renaissance…)
erreurs_frequentes:
- Confondre les siècles, par exemple placer La Joconde au Moyen Âge au lieu de la Renaissance.
- Retenir le titre sans l'artiste ni la date.
- Oublier le matériau et la fonction de l'œuvre.
- Attribuer une œuvre au mauvais artiste (Guernica est de Picasso, pas de Dalí).
exemple:
  enonce: Présente la Tapisserie de Bayeux en donnant ses éléments constitutifs.
  solution: 'La Tapisserie de Bayeux date de la fin du XIe siècle et se trouve à Bayeux, en Normandie. Matériau : malgré son
    nom, c''est une broderie de laines de couleur sur une longue toile de lin. Forme : une très longue bande où les scènes
    se suivent comme une bande dessinée. Sens : elle raconte la conquête de l''Angleterre par Guillaume de Normandie en 1066.
    Fonction : raconter et célébrer cette victoire.'
exercices:
- id: oeuvre-artiste
  type: association
  difficulte: 1
  enonce: Relie chaque œuvre à son artiste.
  reponse:
    gauche:
    - id: a
      texte: La Joconde
    - id: b
      texte: Guernica
    - id: c
      texte: La Liberté guidant le peuple
    - id: d
      texte: Impression, soleil levant
    droite:
    - id: w
      texte: Léonard de Vinci
    - id: x
      texte: Pablo Picasso
    - id: y
      texte: Eugène Delacroix
    - id: z
      texte: Claude Monet
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Quelle œuvre connais-tu le mieux ? Commence par elle.
    methode: Pense à la nationalité ou à l'époque de chaque artiste, puis cherche l'œuvre qui lui correspond.
    etape: Guernica est une ville d'Espagne. Quel peintre de cette liste est espagnol ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle des œuvres a donné son nom à un mouvement de peintres ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'artiste de la Renaissance italienne, puis le peintre espagnol, puis les deux peintres français.
  solution: 'La Joconde : Léonard de Vinci. Guernica : Pablo Picasso. La Liberté guidant le peuple : Eugène Delacroix. Impression,
    soleil levant : Claude Monet.'
- id: oeuvre-epoque
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à son époque et à son aire de production.
  reponse:
    gauche:
    - id: a
      texte: La Vénus de Milo
    - id: b
      texte: La Tapisserie de Bayeux
    - id: c
      texte: La Joconde
    - id: d
      texte: Marilyn Diptych d'Andy Warhol
    droite:
    - id: w
      texte: Grèce antique, époque hellénistique
    - id: x
      texte: Europe du Moyen Âge, fin du XIe siècle
    - id: y
      texte: Italie de la Renaissance, début du XVIe siècle
    - id: z
      texte: États-Unis, pop art des années 1960
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Laquelle de ces œuvres raconte une bataille de 1066 ?
    methode: Pour chaque œuvre, retrouve d'abord son matériau (marbre, broderie, peinture, sérigraphie), puis l'époque qui
      lui correspond.
    etape: Vénus est le nom romain d'une déesse de l'Antiquité. Place cette statue, puis continue avec les autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux œuvres les plus anciennes.
  - si:
      diagnostic: associations_fausses
    relance: Range d'abord les œuvres dans l'ordre du temps, puis relie chacune à son époque.
  solution: 'Vénus de Milo : Grèce antique, époque hellénistique. Tapisserie de Bayeux : Moyen Âge, fin du XIe siècle. La
    Joconde : Renaissance italienne, début du XVIe siècle. Marilyn Diptych : pop art américain, 1962.'
- id: frise-oeuvres
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: venus
      texte: La Vénus de Milo
    - id: bayeux
      texte: La Tapisserie de Bayeux
    - id: joconde
      texte: La Joconde
    - id: liberte
      texte: La Liberté guidant le peuple
    - id: guernica
      texte: Guernica
  indices:
    relance: Laquelle de ces œuvres date de l'Antiquité ? Et laquelle du XXe siècle ?
    methode: Place d'abord chaque œuvre dans une grande période (Antiquité, Moyen Âge, Renaissance, XIXe siècle, XXe siècle),
      puis range les périodes.
    etape: La Tapisserie de Bayeux raconte un événement de 1066. La Joconde est peinte pendant la Renaissance. Laquelle vient
      avant l'autre ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux œuvres voisines sont inversées. Replace-les dans leur siècle.
  - si:
      diagnostic: ordre_faux
    relance: Associe chaque œuvre à une grande période de l'histoire avant de les ranger.
  solution: Vénus de Milo (époque hellénistique, vers le IIe siècle av. J.-C.), Tapisserie de Bayeux (fin du XIe siècle),
    La Joconde (début du XVIe siècle), La Liberté guidant le peuple (1830), Guernica (1937).
- id: annee-guernica
  type: nombre
  difficulte: 2
  enonce: En quelle année Pablo Picasso peint-il Guernica ?
  reponse:
    valeur: 1937
    forme: entier
  indices:
    relance: Le tableau réagit au bombardement d'une ville pendant la guerre d'Espagne. Quand a lieu cette guerre ?
    methode: La guerre d'Espagne commence en 1936 et se termine en 1939. Le bombardement a lieu au printemps de la deuxième
      année de la guerre.
    etape: Le tableau est peint la même année que le bombardement, pour l'Exposition internationale de Paris. Compte une année
      après le début de la guerre.
  pieges:
  - si:
      valeur: 1936
    relance: En 1936, la guerre d'Espagne commence. Le bombardement de Guernica a lieu un peu plus tard. Quelle année ?
  - si:
      valeur: 1939
    relance: En 1939, la guerre d'Espagne se termine. Le tableau a été peint avant, l'année du bombardement.
  - si:
      valeur: 1914
    relance: 1914, c'est le début de la Première Guerre mondiale. Guernica dénonce un bombardement de la guerre d'Espagne.
  solution: Picasso peint Guernica en 1937, quelques semaines après le bombardement de la ville basque (26 avril 1937), pour
    le pavillon espagnol de l'Exposition internationale de Paris.
- id: materiau-joconde
  type: choix
  difficulte: 2
  enonce: Sur quel support Léonard de Vinci a-t-il peint La Joconde, à l'huile ?
  reponse:
    options:
    - id: a
      texte: Un panneau de bois
    - id: b
      texte: Une toile de lin
    - id: c
      texte: Un mur enduit de plâtre frais (fresque)
    - id: d
      texte: Une feuille de papier
    bonnes:
    - a
  indices:
    relance: Au début du XVIe siècle, en Italie, sur quoi peignait-on souvent les tableaux de petite taille ?
    methode: Avant que la toile ne devienne courante, les peintres de la Renaissance utilisaient souvent un support rigide,
      préparé avec un enduit.
    etape: Le support de La Joconde est rigide et vient d'un arbre, le peuplier.
  pieges:
  - si:
      contient:
      - b
    relance: Beaucoup de tableaux sont sur toile, mais pas celui-ci. Son support est rigide. Lequel ?
  - si:
      contient:
      - c
    relance: La fresque est peinte sur un mur, elle ne peut pas être déplacée. La Joconde, elle, est un tableau transportable.
  - si:
      contient:
      - d
    relance: Le papier sert aux dessins. La Joconde est une peinture à l'huile sur un support rigide.
  solution: La Joconde est peinte à l'huile sur un panneau de bois de peuplier, au début du XVIe siècle. Elle est conservée
    au musée du Louvre.
- id: presenter-oeuvre-majeure
  type: ouverte
  difficulte: 3
  enonce: 'Choisis une œuvre majeure que tu as étudiée cette année. Présente-la en quelques phrases : carte d''identité, époque
    et aire de production, puis ses éléments constitutifs (matériau, forme, sens, fonction).'
  criteres:
  - L'élève donne une carte d'identité exacte (titre, artiste, date ou période, lieu de conservation).
  - L'élève situe l'œuvre dans une époque et une aire de production.
  - L'élève dégage au moins trois éléments constitutifs parmi le matériau, la forme, le sens et la fonction.
  indices:
    relance: Quelle œuvre as-tu étudiée en classe et connais-tu le mieux ?
    methode: Fais quatre lignes, une par élément constitutif, et écris pour chacune une phrase courte.
    etape: Tu peux commencer par « [titre] est une œuvre de [artiste], créée en [date], conservée à [lieu]. Elle appartient
      à… ».
  solution: 'Exemple : La Liberté guidant le peuple est une huile sur toile d''Eugène Delacroix, peinte en 1830 et conservée
    au musée du Louvre. C''est une œuvre du romantisme français. Matériau : peinture à l''huile sur une grande toile. Forme
    : une composition en pyramide, au sommet de laquelle flotte le drapeau tricolore. Sens : elle évoque la révolution de
    juillet 1830 à Paris et montre la Liberté guidant le peuple. Fonction : célébrer ce combat pour la liberté.'
- id: nblm-quel-artiste-a-peint-la-celebre-toile-gu-1
  type: choix
  difficulte: 2
  enonce: Quel artiste a peint la célèbre toile Guernica (1937) pour dénoncer le bombardement subit par une ville basque pendant
    la guerre d'Espagne ?
  reponse:
    options:
    - id: o1
      texte: Pablo Picasso
    - id: o2
      texte: Salvador Dalí
    - id: o3
      texte: Claude Monet
    - id: o4
      texte: Eugène Delacroix
    bonnes:
    - o1
  indices:
    relance: Pense au célèbre artiste espagnol qui a fondé le cubisme au début du XXe siècle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur fréquente d'attribuer cette œuvre à Dalí. Bien qu'il soit aussi un peintre espagnol renommé,
      l'auteur de Guernica est Picasso.
  - si:
      contient:
      - o3
    relance: Faux. Claude Monet est le peintre impressionniste du XIXe siècle qui a réalisé Impression, soleil levant.
  - si:
      contient:
      - o4
    relance: Faux. Eugène Delacroix est un peintre romantique du XIXe siècle, auteur de La Liberté guidant le peuple.
  solution: Pablo Picasso. C'est exact ! Pablo Picasso a réalisé ce tableau monumental en 1937 pour dénoncer la violence de
    ce bombardement.
- id: nblm-a-quelle-periode-historique-et-artistiqu-2
  type: choix
  difficulte: 2
  enonce: À quelle période historique et artistique faut-il rattacher La Joconde de Léonard de Vinci ?
  reponse:
    options:
    - id: o1
      texte: La Renaissance italienne (début du XVIe siècle)
    - id: o2
      texte: Le Moyen Âge (fin du XIe siècle)
    - id: o3
      texte: L'Antiquité grecque (IIe siècle avant J.-C.)
    - id: o4
      texte: Le romantisme du XIXe siècle
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi du grand mouvement culturel né en Italie marquant le renouveau artistique après le Moyen Âge.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention à ne pas confondre les siècles ! Le XIe siècle correspond à la Tapisserie de Bayeux, alors que La Joconde
      date de la Renaissance.
  - si:
      contient:
      - o3
    relance: Faux. L'Antiquité grecque est la période de création de sculptures comme la Vénus de Milo.
  - si:
      contient:
      - o4
    relance: Faux. Le romantisme caractérise des peintures du XIXe siècle comme La Liberté guidant le peuple de Delacroix.
  solution: La Renaissance italienne (début du XVIe siècle). Excellente réponse. La Joconde a été peinte au début du XVIe
    siècle par Léonard de Vinci durant la Renaissance en Italie.
- id: nblm-quel-mouvement-artistique-tire-son-nom-d-3
  type: choix
  difficulte: 2
  enonce: Quel mouvement artistique tire son nom du tableau Impression, soleil levant (1872) de Claude Monet ?
  reponse:
    options:
    - id: o1
      texte: L'impressionnisme
    - id: o2
      texte: Le pop art
    - id: o3
      texte: Le romantisme
    - id: o4
      texte: Le cubisme
    bonnes:
    - o1
  indices:
    relance: Le nom de ce mouvement dérive directement du tout premier mot du titre du tableau de Monet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. Le pop art est un mouvement américain du XXe siècle (1962) illustré par Andy Warhol.
  - si:
      contient:
      - o3
    relance: Faux. Le romantisme est un mouvement de la première moitié du XIXe siècle représenté par Delacroix.
  - si:
      contient:
      - o4
    relance: Faux. Le cubisme est un mouvement d'avant-garde du début du XXe siècle inventé par Picasso et Braque.
  solution: L'impressionnisme. Bravo ! C'est le titre de cette toile exposée par Claude Monet qui a donné son nom au mouvement
    impressionniste.
- id: nblm-quelle-est-la-veritable-technique-materi-4
  type: choix
  difficulte: 2
  enonce: Quelle est la véritable technique matérielle de la Tapisserie de Bayeux (fin du XIe siècle) ?
  reponse:
    options:
    - id: o1
      texte: Une broderie de laines de couleur sur une toile de lin
    - id: o2
      texte: Une tapisserie tissée sur un métier à tisser
    - id: o3
      texte: Une peinture à l'huile sur un panneau de bois
    - id: o4
      texte: Une sculpture en bas-relief sur bloc de marbre
    bonnes:
    - o1
  indices:
    relance: 'Ne te fie pas seulement au titre historique de l''œuvre : les motifs ont été ajoutés à l''aiguille sur du tissu.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention au piège du nom ! Elle est appelée tapisserie par tradition, mais elle n'a pas été tissée.
  - si:
      contient:
      - o3
    relance: Faux. La peinture sur bois est le support utilisé par Léonard de Vinci pour La Joconde.
  - si:
      contient:
      - o4
    relance: Faux. Le marbre est le matériau d'œuvres sculptées comme la Vénus de Milo.
  solution: Une broderie de laines de couleur sur une toile de lin. Très bien ! Malgré l'appellation usuelle de « tapisserie
    », il s'agit techniquement d'une broderie en fils de laine sur une bande de lin.
- id: nblm-en-histoire-des-arts-que-designe-l-aire-5
  type: choix
  difficulte: 2
  enonce: En histoire des arts, que désigne l'« aire de production » d'une œuvre ?
  reponse:
    options:
    - id: o1
      texte: Le lieu (pays, région, civilisation) où l'œuvre a été créée
    - id: o2
      texte: Le musée dans lequel l'œuvre est conservée aujourd'hui
    - id: o3
      texte: La surface physique mesurée en mètres carrés du tableau
    - id: o4
      texte: Le groupe d'artistes partageant les mêmes règles esthétiques
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la notion géographique et civilisationnelle liée au lieu de fabrication de l'œuvre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. Le musée actuel (comme le Louvre ou la Tate) correspond au lieu de conservation de l'œuvre.
  - si:
      contient:
      - o3
    relance: Faux. L'aire de production n'est pas une mesure géométrique de la surface matérielle de l'objet.
  - si:
      contient:
      - o4
    relance: Faux. Un regroupement d'artistes partageant une vision esthétique est un mouvement artistique.
  solution: Le lieu (pays, région, civilisation) où l'œuvre a été créée. C'est la bonne définition. L'aire de production situe
    la création dans son espace géographique, régional ou culturel d'origine.
- id: nblm-parmi-les-elements-suivants-lesquels-con-6
  type: choix
  difficulte: 3
  enonce: Parmi les éléments suivants, lesquels constituent deux des quatre « éléments constitutifs » essentiels d'une œuvre
    majeure ? (Sélectionne les 2 bonnes réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le matériau (marbre, huile sur bois, broderie...)
    - id: o2
      texte: La fonction (décorer, raconter, célébrer un pouvoir, dénoncer...)
    - id: o3
      texte: Le prix de vente estimé aux enchères
    - id: o4
      texte: Le nombre annuel de visiteurs du musée
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie d'une part la matière physique utilisée et d'autre part le rôle/objectif d'origine de l'œuvre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Faux. La valeur financière sur le marché de l'art ne fait pas partie des critères d'analyse constitutifs d'une
      œuvre.
  - si:
      contient:
      - o4
    relance: Faux. La fréquentation touristique du lieu de conservation n'est pas un élément constitutif de l'œuvre elle-même.
  solution: Le matériau (marbre, huile sur bois, broderie...) ; La fonction (décorer, raconter, célébrer un pouvoir, dénoncer...).
    C'est juste. Le matériau fait partie des quatre éléments constitutifs essentiels retenus par la méthode (avec la forme,
    le sens et la fonction).
- id: nblm-a-quel-mouvement-artistique-du-xxe-siecl-7
  type: texte_court
  difficulte: 1
  enonce: À quel mouvement artistique du XXe siècle appartient l'œuvre Marilyn Diptych (1962) d'Andy Warhol ?
  reponse:
    acceptees:
    - pop art
    fautes_tolerees: 1
  indices:
    relance: Ce courant artistique né dans les années 1950-1960 s'inspire de la culture populaire et des objets de consommation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: pop art. C'est exact. Marilyn Diptych d'Andy Warhol (1962) est une œuvre phare du pop art américain.
- id: nblm-quel-terme-de-deux-mots-designe-un-group-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme de deux mots désigne un groupe d'artistes d'une même époque qui partagent des idées et une manière de
    faire ?
  reponse:
    acceptees:
    - mouvement artistique
    fautes_tolerees: 1
  indices:
    relance: Cette notion du vocabulaire réunit par exemple l'impressionnisme, le pop art ou le romantisme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: mouvement artistique. C'est exact. Un mouvement artistique rassemble des créateurs d'une même période partageant
    des idées et une technique communes.
- id: mouvement-warhol
  type: texte_court
  difficulte: 2
  enonce: À quel mouvement artistique américain des années 1960 rattache-t-on Marilyn Diptych d'Andy Warhol ?
  reponse:
    acceptees:
    - pop art
    - pop-art
    - le pop art
    fautes_tolerees: 1
  indices:
    relance: Warhol s'inspire de la publicité et des vedettes populaires. Quel mouvement est-ce ?
    methode: Le nom de ce mouvement est formé de deux mots ; le premier est un diminutif anglais de « populaire ».
    etape: Le premier mot est « pop » ; trouve le second, qui désigne les arts plastiques.
  pieges:
  - si:
      valeur: impressionnisme
    relance: L'impressionnisme est du XIXe siècle, avec Monet. Warhol travaille en 1962, à New York.
  solution: 'C''est le pop art : Warhol reprend des images de la culture de masse.'
- id: technique-bayeux
  type: choix
  difficulte: 2
  enonce: Quelle est la technique de la Tapisserie de Bayeux, qui raconte la conquête de l'Angleterre en 1066 ?
  reponse:
    options:
    - id: a
      texte: Une broderie de laine sur une toile de lin
    - id: b
      texte: Une peinture à l'huile sur toile
    - id: c
      texte: Une sculpture en marbre
    - id: d
      texte: Une mosaïque de petits cubes
    bonnes:
    - a
  indices:
    relance: Malgré son nom, cette œuvre n'est pas tissée mais faite avec du fil. Comment ?
    methode: Le fil de laine est piqué à l'aiguille sur un tissu de lin, comme pour une broderie.
    etape: 'Élimine la peinture, la pierre et les cubes collés : une seule technique utilise du fil.'
  pieges:
  - si:
      contient:
      - b
    relance: L'huile est apparue bien plus tard, et ici on n'utilise pas de pinceau. Quel matériau textile ?
  - si:
      contient:
      - c
    relance: Le marbre est de la pierre. Ici l'œuvre est longue et souple. Quelle matière utilise-t-on ?
  - si:
      contient:
      - d
    relance: Les mosaïques se font avec des cubes de pierre ou de verre. Ici, quelle matière est piquée à l'aiguille ?
  solution: La Tapisserie de Bayeux est une broderie de laine sur toile de lin, réalisée à la fin du XIe siècle.
