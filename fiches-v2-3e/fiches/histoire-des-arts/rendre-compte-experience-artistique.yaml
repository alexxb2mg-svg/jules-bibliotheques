# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: rendre-compte-experience-artistique
version: 4
etat: verifiee
declencheurs:
- ce que j'ai ressenti
- mon ressenti pendant le spectacle
- spectacle que j'ai vu
- raconter une sortie au théâtre
- avis sur un concert
- sortie au cinéma
- ma pratique artistique
- parler de ma chorale
prerequis:
- decrire-oeuvre-lexique
essentiel: 'Le programme demande de savoir rendre compte, en termes personnels, d''une expérience artistique vécue : soit
  comme spectateur (un concert, une pièce de théâtre, un ballet, un film, une exposition), soit par la pratique (chanter dans
  une chorale, jouer une pièce, danser, créer une œuvre en arts plastiques).


  « En termes personnels » veut dire : parler à la première personne (« je »), dire ce que l''on a ressenti, mais toujours
  en le justifiant par un élément précis de l''œuvre ou de la pratique. On écrit au passé pour raconter, au présent pour donner
  un avis.


  Un bon compte rendu suit quatre étapes. D''abord, présenter l''expérience : quoi, où, quand, avec qui. Ensuite, décrire
  ce que l''on a vu, entendu ou fait, avec un vocabulaire précis. Puis exprimer ses ressentis, en les justifiant. Enfin, dire
  ce que cette expérience nous a appris ou a changé pour nous.


  Quelques mots utiles. En musique : tempo (la vitesse), nuances (fort, doux), crescendo (le son augmente peu à peu), timbre
  (la couleur d''un instrument). Au théâtre : mise en scène, décor, costumes, lumières, jeu des comédiens. En danse : chorégraphie,
  mouvements, rythme. Au cinéma : plan, bande-son, montage.


  Exemple d''une phrase justifiée : « J''ai été ému quand la musique s''est arrêtée d''un coup et que la danseuse est restée
  immobile : ce silence m''a fait sentir sa solitude. » L''émotion est donnée, puis expliquée par un moment précis.


  Si l''expérience est une pratique, on peut aussi parler de ses difficultés, de ce qu''on a réussi, du travail en groupe.


  Ce qu''on attend au brevet : un récit clair et organisé, un vocabulaire précis, des ressentis expliqués par des détails,
  et un regard sur ce que l''expérience a apporté.

  '
methode:
- 'Présenter l''expérience : quoi, où, quand, avec qui.'
- Décrire ce que tu as vu, entendu ou fait, avec le vocabulaire de l'art concerné.
- Exprimer tes ressentis en les justifiant par un moment ou un détail précis.
- Dire ce que cette expérience t'a appris ou a changé pour toi.
- Écrire à la première personne, au passé pour raconter et au présent pour donner ton avis.
vocabulaire:
- terme: mise en scène
  definition: la manière dont une pièce est montée (décor, lumières, déplacements des comédiens)
- terme: chorégraphie
  definition: l'ensemble des pas et des mouvements d'une danse
- terme: tempo
  definition: la vitesse d'un morceau de musique
- terme: nuance
  definition: l'intensité du son en musique (très doux, doux, fort, très fort)
- terme: timbre
  definition: la couleur propre à un instrument ou à une voix
- terme: crescendo
  definition: en musique, une augmentation progressive de l'intensité du son
- terme: spectateur
  definition: celui qui assiste à un spectacle ou regarde une œuvre, sans y participer
- terme: pratique artistique
  definition: 'le fait de créer ou d''interpréter soi-même : chanter, jouer, danser, dessiner'
erreurs_frequentes:
- 'Donner un avis sans raison : « c''était nul », « j''ai adoré ».'
- Raconter toute l'histoire de la pièce ou du film au lieu de parler de son expérience.
- Oublier de présenter l'expérience (quoi, où, quand).
- Parler au nom des autres (« tout le monde a aimé ») au lieu de parler de soi.
- 'Mélanger récit, avis et vocabulaire sans ordre : suis les quatre étapes.'
exemple:
  enonce: Rends compte en quelques phrases d'un concert entendu avec ta classe.
  solution: 'En décembre, avec ma classe, j''ai assisté à un concert de l''orchestre de ma ville, qui jouait le Boléro de
    Maurice Ravel (1928). Au début, une caisse claire répète un rythme très doux, puis les instruments entrent un par un.
    Le son augmente peu à peu jusqu''à la fin, où tout l''orchestre joue très fort. J''ai d''abord trouvé la répétition monotone,
    puis j''ai été emporté par cette montée : à la fin, j''avais des frissons. J''ai compris qu''une mélodie répétée pouvait
    créer beaucoup d''émotion.'
exercices:
- id: ressenti-justifie
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases rend compte d'une expérience en termes personnels et justifiés ?
  reponse:
    options:
    - id: a
      texte: 'J''ai eu des frissons quand tout l''orchestre s''est mis à jouer très fort d''un seul coup : je ne m''y attendais
        pas.'
    - id: b
      texte: C'était nul.
    - id: c
      texte: Le concert a eu lieu le 12 mars.
    - id: d
      texte: Tout le monde a aimé le spectacle.
    bonnes:
    - a
  indices:
    relance: Quelle phrase dit à la fois ce que tu as ressenti et pourquoi ?
    methode: Une phrase personnelle et justifiée contient un « je », un ressenti et une raison précise.
    etape: Écarte la phrase qui donne seulement une information, celle qui parle des autres et celle qui n'a pas de raison.
  pieges:
  - si:
      contient:
      - b
    relance: C'est un avis, mais sans aucune raison. Qu'est-ce qui était nul, et pourquoi ?
  - si:
      contient:
      - c
    relance: C'est une information utile pour présenter l'expérience, mais ce n'est pas un ressenti.
  - si:
      contient:
      - d
    relance: Tu parles des autres, pas de toi. Quelle phrase dit « je » ?
  solution: La phrase a est personnelle (« j'ai eu des frissons ») et justifiée par un moment précis du concert (l'orchestre
    qui joue très fort d'un seul coup).
- id: mot-crescendo
  type: texte_court
  difficulte: 2
  enonce: En musique, comment appelle-t-on une augmentation progressive du volume sonore, comme dans le Boléro de Maurice
    Ravel (1928), qui commence très doucement et finit très fort ?
  reponse:
    acceptees:
    - crescendo
    fautes_tolerees: 1
  indices:
    relance: Ce mot est italien, comme beaucoup de mots de la musique. Il veut dire « en grandissant ».
    methode: Les nuances indiquent l'intensité du son. Un mot italien désigne le passage progressif du doux au fort.
    etape: Le mot commence par « cresc- ».
  pieges:
  - si:
      valeur: forte
    relance: Forte veut dire « fort », mais d'un coup. On cherche le mot qui dit que le son augmente peu à peu.
  - si:
      valeur: decrescendo
    relance: C'est l'inverse, le son diminue peu à peu. Or, dans le Boléro, il augmente.
  - si:
      valeur: tempo
    relance: Le tempo, c'est la vitesse. On cherche le mot qui parle du volume du son qui augmente peu à peu.
  solution: 'C''est un crescendo : le volume du son augmente peu à peu, du très doux au très fort.'
- id: metier-theatre
  type: texte_court
  difficulte: 2
  enonce: Au théâtre, comment appelle-t-on la personne qui dirige les comédiens et décide du décor, des lumières et des déplacements
    sur scène ?
  reponse:
    acceptees:
    - metteur en scène
    - metteuse en scène
    fautes_tolerees: 1
  indices:
    relance: Ce n'est pas l'auteur de la pièce, ni un comédien. Qui organise tout sur la scène ?
    methode: Son travail s'appelle la « mise en scène ». Forme le nom de la personne qui fait ce travail.
    etape: Le nom commence par « metteur ».
  pieges:
  - si:
      valeur: réalisateur
    relance: Le réalisateur dirige un film, au cinéma. Au théâtre, comment appelle-t-on cette personne ?
  - si:
      valeur: auteur
    relance: L'auteur écrit le texte de la pièce. Qui décide de la façon de la jouer sur scène ?
  - si:
      valeur: comédien
    relance: Le comédien joue un rôle. Qui le dirige ?
  solution: 'C''est le metteur en scène (ou la metteuse en scène) : il fait la mise en scène de la pièce.'
- id: vocabulaire-arts
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Chorégraphie
    - id: b
      texte: Tempo
    - id: c
      texte: Décor
    - id: d
      texte: Nuance
    droite:
    - id: w
      texte: L'ensemble des pas et des mouvements d'une danse
    - id: x
      texte: La vitesse d'un morceau de musique
    - id: y
      texte: Ce qui représente le lieu de l'action sur une scène
    - id: z
      texte: L'intensité du son, du très doux au très fort
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lequel de ces mots concerne la danse ?
    methode: Classe d'abord chaque mot dans son art (danse, musique, théâtre), puis cherche sa définition.
    etape: Deux mots concernent la musique. L'un parle de vitesse, l'autre de volume. Lequel est lequel ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux mots de la musique.
  - si:
      diagnostic: associations_fausses
    relance: Classe chaque mot dans son art (danse, musique, théâtre) avant de chercher la définition.
  solution: 'Chorégraphie : les pas d''une danse. Tempo : la vitesse. Décor : le lieu représenté sur scène. Nuance : l''intensité
    du son.'
- id: etapes-compte-rendu-personnel
  type: ordre
  difficulte: 1
  enonce: Range dans l'ordre les étapes pour rendre compte d'une expérience artistique.
  reponse:
    elements:
    - id: presenter
      texte: 'Présenter l''expérience : quoi, où, quand, avec qui'
    - id: decrire
      texte: Décrire ce que tu as vu, entendu ou fait
    - id: ressentir
      texte: Exprimer tes ressentis en les justifiant
    - id: retenir
      texte: Pour finir, dire ce que cette expérience t'a appris
  indices:
    relance: Ton lecteur n'était pas là. Que doit-il savoir en tout premier ?
    methode: On va des faits (ce qui s'est passé) vers toi (ce que tu as ressenti, ce que tu retiens).
    etape: Pour justifier un ressenti, il faut que le lecteur sache déjà ce que tu as vu ou entendu. Place la description
      avant.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle a besoin de l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par les informations pratiques, et termine par ce que tu retiens.
  solution: Présenter l'expérience, décrire ce que l'on a vu, entendu ou fait, exprimer ses ressentis justifiés, puis dire
    ce que l'on en retient.
- id: rediger-experience
  type: ouverte
  difficulte: 3
  enonce: 'Rends compte, en 8 à 10 lignes, d''une expérience artistique que tu as vécue : un spectacle, un concert, un film,
    une exposition, ou une pratique (chorale, théâtre, danse, arts plastiques).'
  criteres:
  - L'élève présente l'expérience (quoi, où, quand, avec qui).
  - L'élève décrit l'œuvre ou la pratique avec au moins deux mots de vocabulaire précis (nuance, tempo, mise en scène, décor,
    chorégraphie…).
  - L'élève exprime des ressentis personnels, à la première personne, justifiés par des moments précis, et dit ce que l'expérience
    lui a appris.
  indices:
    relance: Quelle expérience artistique t'a le plus marqué cette année ?
    methode: Suis les quatre étapes, présenter, décrire, ressentir, retenir, en écrivant « je ».
    etape: Tu peux commencer par « Le …, avec …, j'ai assisté à … / j'ai participé à … ».
  solution: 'Exemple : cette année, j''ai chanté dans la chorale du collège, pour le concert de fin d''année dans la salle
    des fêtes. Nous étions trois voix, et le chef de chœur nous demandait de bien respecter les nuances. Au début, j''avais
    peur de chanter faux devant le public. Au moment du crescendo final, quand toutes les voix se sont rejointes, j''ai ressenti
    une grande fierté. J''ai appris qu''en musique, écouter les autres est aussi important que chanter soi-même.'
- id: nblm-que-signifie-s-exprimer-en-termes-person-1
  type: choix
  difficulte: 2
  enonce: Que signifie s'exprimer « en termes personnels » lorsque l'on souhaite raconter un spectacle que j'ai vu ?
  reponse:
    options:
    - id: o1
      texte: Parler à la première personne (« je »), exprimer ce que j'ai ressenti et le justifier par un élément précis de
        l'œuvre.
    - id: o2
      texte: Raconter toute l'histoire et le scénario du spectacle du début à la fin sans parler de soi.
    - id: o3
      texte: Exprimer ce que l'ensemble de la classe a ressenti en utilisant toujours le pronom « nous » ou « tout le monde
        ».
    - id: o4
      texte: Donner un avis brutal comme « c'était nul » ou « j'ai adoré » sans expliquer pourquoi.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au mode d'expression personnel et à la nécessité de s'appuyer sur une observation concrète.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Raconter toute l'histoire au lieu de faire part de son expérience personnelle est une erreur classique.
  - si:
      contient:
      - o3
    relance: Parler au nom des autres au lieu d'assumer son propre ressenti personnel est un piège à éviter.
  - si:
      contient:
      - o4
    relance: Donner un avis tranché sans justification n'est pas une démarche personnelle argumentée.
  solution: 'Parler à la première personne (« je »), exprimer ce que j''ai ressenti et le justifier par un élément précis
    de l''œuvre. C''est la définition exacte : employer la première personne pour exprimer ses émotions tout en les appuyant
    sur un détail concret du spectacle.'
- id: nblm-quelle-est-la-toute-premiere-etape-a-res-2
  type: choix
  difficulte: 2
  enonce: Quelle est la toute première étape à respecter pour réussir le compte rendu d'une sortie au théâtre ?
  reponse:
    options:
    - id: o1
      texte: Présenter l'expérience en précisant quoi, où, quand et avec qui.
    - id: o2
      texte: Commencer directement par expliquer ce que cette expérience nous a appris.
    - id: o3
      texte: Décrire immédiatement le décor et les éclairages sans situer la sortie.
    - id: o4
      texte: Raconter la vie du metteur en scène avant le jour de la représentation.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux informations pratiques indispensables pour situer le cadre du spectacle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Placer le bilan personnel au tout début inverse l'ordre logique des étapes.
  - si:
      contient:
      - o3
    relance: Oublier d'introduire le contexte de l'événement est un manque de méthode fréquent.
  - si:
      contient:
      - o4
    relance: Le compte rendu vise à restituer l'expérience vécue le jour du spectacle, pas la biographie des artistes.
  solution: Présenter l'expérience en précisant quoi, où, quand et avec qui. La présentation précise du contexte (quoi, où,
    quand, avec qui) constitue la première étape de la méthode.
- id: nblm-comment-un-eleve-doit-il-analyser-mon-re-3
  type: choix
  difficulte: 2
  enonce: Comment un élève doit-il analyser mon ressenti pendant le spectacle lors d'un compte rendu ?
  reponse:
    options:
    - id: o1
      texte: En exprimant ses impressions et en les justifiant par un moment ou un détail précis de la représentation.
    - id: o2
      texte: En affirmant que sa réaction est la seule interprétation valable du spectacle.
    - id: o3
      texte: En évitant d'évoquer ses émotions pour ne rédiger qu'une fiche technique neutre.
    - id: o4
      texte: En se contentant d'écrire « j'ai bien aimé » sans apporter de précision.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au lien nécessaire entre une émotion ressentie et un élément concret de la représentation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le compte rendu est une appréciation personnelle argumentée, pas un jugement absolu à imposer.
  - si:
      contient:
      - o3
    relance: L'exercice demande expressément d'exprimer ses ressentis et émotions, pas uniquement des faits techniques.
  - si:
      contient:
      - o4
    relance: Fournir un avis sans justification est une erreur méthodique centrale.
  solution: En exprimant ses impressions et en les justifiant par un moment ou un détail précis de la représentation. Un ressenti
    personnel doit toujours être étayé par une preuve visuelle, sonore ou scénique précise.
- id: nblm-lorsqu-on-veut-raconter-une-sortie-au-th-4
  type: choix
  difficulte: 2
  enonce: Lorsqu'on veut raconter une sortie au théâtre, quel vocabulaire spécifique faut-il privilégier pour décrire la représentation
    ?
  reponse:
    options:
    - id: o1
      texte: Des notions comme la mise en scène, le décor, les costumes, les lumières et le jeu des comédiens.
    - id: o2
      texte: Des notions musicales comme le tempo, le crescendo et les nuances d'intensité.
    - id: o3
      texte: Des termes issus de la danse comme la chorégraphie et l'enchaînement des pas.
    - id: o4
      texte: Des termes de peinture comme la perspective, le point de fuite et le premier plan.
    bonnes:
    - o1
  indices:
    relance: Pense aux termes qui désignent l'organisation visuelle et le jeu sur un plateau de théâtre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Ces termes appartiennent au vocabulaire de la musique et du concert.
  - si:
      contient:
      - o3
    relance: Ce lexique est spécifique aux spectacles de danse et de ballet.
  - si:
      contient:
      - o4
    relance: Ce vocabulaire s'applique aux arts plastiques et visuels, pas à la description du jeu théâtral.
  solution: Des notions comme la mise en scène, le décor, les costumes, les lumières et le jeu des comédiens. Ces termes constituent
    le vocabulaire propre au théâtre pour décrire ce qui se passe sur scène.
- id: nblm-quelle-est-l-une-des-erreurs-frequentes-5
  type: choix
  difficulte: 2
  enonce: Quelle est l'une des erreurs fréquentes à éviter absolument quand on rédige le compte rendu d'un spectacle que j'ai
    vu ?
  reponse:
    options:
    - id: o1
      texte: Raconter toute l'histoire de la pièce au lieu de rendre compte de son expérience.
    - id: o2
      texte: Utiliser le pronom « je » pour partager ses impressions.
    - id: o3
      texte: Associer une émotion à un choix particulier d'éclairage ou de mise en scène.
    - id: o4
      texte: Conclure en expliquant ce que l'expérience nous a apporté.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui distingue un compte rendu d’expérience d’un simple résumé de pièce.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'emploi de la première personne est au contraire vivement préconisé.
  - si:
      contient:
      - o3
    relance: C'est la méthode attendue pour justifier correctement son ressenti.
  - si:
      contient:
      - o4
    relance: Il s'agit de la quatrième étape obligatoire de la démarche.
  solution: 'Raconter toute l''histoire de la pièce au lieu de rendre compte de son expérience. Raconter toute l''intrigue
    fait perdre de vue l''objectif principal : analyser sa propre expérience de spectateur.'
- id: nblm-parmi-les-propositions-suivantes-quelles-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes, quelles sont DEUX des quatre étapes méthodologiques d'un bon compte rendu d'expérience
    artistique ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Présenter l'expérience en précisant quoi, où, quand et avec qui.
    - id: o2
      texte: Exprimer ses ressentis en les justifiant par un élément précis.
    - id: o3
      texte: Rédiger une biographie exhaustive de tous les acteurs de la pièce.
    - id: o4
      texte: Résumer l'intégralité du texte dramatique scène par scène.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense à l'organisation chronologique du compte rendu, de l'introduction du contexte au bilan final.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: La biographie des interprètes ne constitue pas une étape du compte rendu d'expérience.
  - si:
      contient:
      - o4
    relance: Résumer tout le texte est une erreur fréquente et non une étape méthodique.
  solution: Présenter l'expérience en précisant quoi, où, quand et avec qui ; Exprimer ses ressentis en les justifiant par
    un élément précis. Il s'agit de la première étape indispensable pour situer le cadre du spectacle.
- id: nblm-pour-rendre-compte-d-une-experience-arti-7
  type: texte_court
  difficulte: 1
  enonce: Pour rendre compte d'une expérience artistique en termes personnels, l'élève doit exprimer ce qu'il a __________
    tout en le justifiant par un élément précis.
  reponse:
    acceptees:
    - ressenti
    fautes_tolerees: 1
  indices:
    relance: Pense au terme qui désigne les émotions ou impressions éprouvées pendant la représentation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: ressenti. Le mot « ressenti » désigne l'émotion ou l'impression personnelle éprouvée lors de l'expérience artistique.
- id: nblm-au-theatre-l-ensemble-des-choix-artistiq-8
  type: texte_court
  difficulte: 1
  enonce: Au théâtre, l'ensemble des choix artistiques concernant le décor, les lumières et le jeu des comédiens s'appelle
    la __________ en scène.
  reponse:
    acceptees:
    - mise
    fautes_tolerees: 1
  indices:
    relance: Pense au terme qui qualifie l'organisation globale du spectacle sur la scène.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: mise. La « mise en scène » désigne l'organisation matérielle et artistique du spectacle sur le plateau.
- id: pratique-ou-spectateur
  type: choix
  difficulte: 2
  enonce: Laquelle de ces phrases décrit une expérience artistique vécue par la pratique ?
  reponse:
    options:
    - id: a
      texte: J'ai chanté avec ma chorale pendant le concert de fin d'année.
    - id: b
      texte: J'ai regardé un ballet depuis mon fauteuil.
    - id: c
      texte: J'ai écouté un concert dans une salle.
    - id: d
      texte: J'ai visité une exposition de peinture.
    bonnes:
    - a
  indices:
    relance: Dans quelle phrase est-ce toi qui produis ou interprètes ?
    methode: 'Par la pratique, on fait soi-même : on chante, on joue, on danse, on dessine. Comme spectateur, on regarde ou
      on écoute.'
    etape: Trois phrases parlent de quelqu'un qui assiste. Une seule parle de quelqu'un qui fait.
  pieges:
  - si:
      contient:
      - b
    relance: 'Ici, tu regardes un spectacle : tu es spectateur. Où est-ce toi qui interprètes ?'
  - si:
      contient:
      - c
    relance: Écouter un concert, c'est en être spectateur. Cherche la phrase où l'on interprète.
  - si:
      contient:
      - d
    relance: Visiter une exposition, c'est regarder des œuvres. Quelle phrase parle de faire soi-même ?
  solution: 'La phrase a : chanter dans une chorale est une pratique artistique. Les autres décrivent des expériences de spectateur.'
- id: mot-timbre
  type: texte_court
  difficulte: 2
  enonce: En musique, comment appelle-t-on la couleur propre d'un instrument, qui permet de distinguer une flûte d'un violon
    jouant la même note ?
  reponse:
    acceptees:
    - timbre
    - le timbre
    fautes_tolerees: 1
  indices:
    relance: Une même note ne sonne pas de la même façon selon l'instrument. Comment nomme-t-on cette différence ?
    methode: Ce n'est ni la hauteur, ni la vitesse, ni la force du son, mais sa « couleur ».
    etape: Le mot est aussi celui d'un petit papier qu'on colle sur une lettre… et il commence par « tim- ».
  pieges:
  - si:
      valeur: tempo
    relance: Le tempo est la vitesse. On cherche le mot qui désigne la couleur du son.
  - si:
      valeur: nuance
    relance: La nuance est l'intensité, fort ou doux. On cherche la couleur propre à l'instrument.
  solution: 'C''est le timbre : il distingue le son d''une flûte de celui d''un violon.'
