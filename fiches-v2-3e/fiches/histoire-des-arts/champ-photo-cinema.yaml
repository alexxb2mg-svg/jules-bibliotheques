# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: champ-photo-cinema
version: 3
etat: verifiee
declencheurs:
- analyser un plan de cinéma
- plongée et contre-plongée
- champ-contrechamp
- mouvement de caméra
- cadrage d'une photo
- frères Lumière
- daguerréotype de Daguerre
- gros plan et plan d'ensemble
- photographie noir et blanc
prerequis:
- decrire-oeuvre-lexique
- 4e-champ-photo-cinema
couverture: Présente le champ de la photographie et du cinéma, ses grandes inventions et le vocabulaire de base de l'image
  (plan, cadrage, angle de prise de vue, montage). L'étude complète d'un film ou d'un genre n'est pas traitée.
essentiel: 'La photographie et le cinéma sont des arts de l''image enregistrée par un appareil. Ils naissent au XIXe siècle.
  Vers 1826, Nicéphore Niépce obtient l''une des toutes premières images photographiques. En 1839, le daguerréotype, mis au
  point par Louis Daguerre à partir de ses recherches, est présenté à Paris. Le 28 décembre 1895, à Paris, les frères Auguste
  et Louis Lumière organisent la première projection publique payante de leur cinématographe. Le cinéma est d''abord muet
  ; en 1927, Le Chanteur de jazz est le premier long métrage parlant. À la fin du XXe siècle, la photographie devient numérique.


  Une photographie est une image fixe ; un film est une suite de plans assemblés au montage. Pour analyser une image, on regarde
  :

  - le cadrage : ce que l''on choisit de montrer dans le cadre, et ce que l''on laisse dehors ;

  - la taille du plan : plan d''ensemble (un vaste décor), plan moyen (un personnage en pied), gros plan (un visage) ;

  - l''angle de prise de vue : en plongée, la caméra filme de haut en bas et le personnage paraît petit ou écrasé ; en contre-plongée,
  elle filme de bas en haut et le personnage paraît grand ou menaçant ;

  - les mouvements de caméra : le panoramique (la caméra pivote sur place), le travelling (la caméra se déplace, par exemple
  sur des rails) ;

  - le montage : l''ordre et la durée des plans. Le champ-contrechamp alterne deux personnages qui se font face, par exemple
  pendant un dialogue ;

  - la lumière, le noir et blanc ou la couleur, la netteté et le flou en photographie.


  Une photographie peut témoigner : Migrant Mother de Dorothea Lange (1936) montre la misère de familles américaines pendant
  la crise des années 1930.


  Quelques repères : Le Voyage dans la Lune de Georges Méliès (1902), Le Cuirassé Potemkine de Sergueï Eisenstein (1925),
  Citizen Kane d''Orson Welles (1941) ; en photographie, Le Baiser de l''hôtel de ville de Robert Doisneau (1950).


  Au brevet, on attend que tu présentes l''œuvre (auteur, date), que tu décrives avec le vocabulaire de l''image et que tu
  relies chaque choix technique à son effet sur le spectateur.

  '
methode:
- 'Présenter l''œuvre : photographie ou film, titre, auteur (photographe ou réalisateur), date.'
- 'Pour une photographie : décrire le cadrage, les plans (premier plan, arrière-plan), la lumière, le noir et blanc ou la
  couleur, la netteté.'
- 'Pour un film : choisir un plan ou une séquence et nommer la taille du plan, l''angle de prise de vue, les mouvements de
  caméra, puis le montage et le son.'
- Relier chaque choix technique à l'effet produit sur le spectateur.
- 'Conclure par une interprétation : ce que l''image raconte ou dénonce.'
vocabulaire:
- terme: plan
  definition: au cinéma, portion de film tournée sans interruption ; aussi la taille de ce qui est montré (plan d'ensemble,
    gros plan)
- terme: cadrage
  definition: choix de ce qui est montré à l'intérieur du cadre de l'image
- terme: plongée
  definition: 'prise de vue de haut en bas : le sujet paraît petit, écrasé'
- terme: contre-plongée
  definition: 'prise de vue de bas en haut : le sujet paraît grand, puissant ou menaçant'
- terme: travelling
  definition: mouvement de la caméra qui se déplace pendant la prise de vue
- terme: montage
  definition: étape où l'on choisit, coupe et assemble les plans dans un ordre donné
- terme: champ-contrechamp
  definition: alternance de deux plans filmés en sens opposé, souvent pour un dialogue
- terme: panoramique
  definition: mouvement de la caméra qui pivote sur elle-même sans se déplacer
- terme: plan d'ensemble
  definition: plan qui montre un vaste décor, où les personnages sont petits
- terme: gros plan
  definition: plan qui montre de très près un visage ou un objet
erreurs_frequentes:
- 'Inverser plongée et contre-plongée : en plongée, la caméra est au-dessus du sujet et regarde vers le bas.'
- Confondre le plan (un morceau de film) et la scène ou la séquence (un ensemble de plans).
- Décrire une image sans dire l'effet des choix techniques sur le spectateur.
- 'Croire que le cinéma est né parlant : pendant plus de trente ans, les films sont muets, souvent accompagnés d''un pianiste
  dans la salle.'
exemple:
  enonce: Dans Citizen Kane d'Orson Welles (1941), le personnage de Kane est souvent filmé en contre-plongée. Quel effet cela
    produit-il ?
  solution: 'En contre-plongée, la caméra est placée plus bas que le personnage et le filme de bas en haut. Kane paraît alors
    immense et dominateur : l''image montre sa puissance et son orgueil. Le choix de l''angle de prise de vue aide le spectateur
    à comprendre le personnage.'
exercices:
- id: mot-angle-haut
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la prise de vue où la caméra, placée au-dessus du personnage, le filme de haut en bas, si bien
    qu'il paraît petit ou écrasé ?
  reponse:
    acceptees:
    - plongée
    - plan en plongée
    - vue en plongée
    fautes_tolerees: 0
  indices:
    relance: Imagine que tu regardes quelqu'un depuis un balcon. Où est ton regard par rapport à lui ?
    methode: 'Il existe deux angles de prise de vue opposés : l''un de haut en bas, l''autre de bas en haut. Cherche le nom
      du premier.'
    etape: Le mot évoque le geste d'un nageur qui saute du haut d'un plongeoir vers l'eau.
  pieges:
  - si:
      valeur: contre-plongée
    relance: 'C''est l''inverse : dans cet angle-là, la caméra est en bas et regarde vers le haut. Ici, elle est au-dessus
      du personnage.'
  - si:
      valeur: gros plan
    relance: Le gros plan dit la taille de ce qui est montré (un visage), pas la position de la caméra. Quel mot désigne une
      caméra placée au-dessus ?
  solution: 'C''est une plongée : la caméra filme de haut en bas, et le personnage paraît petit, fragile ou écrasé.'
- id: mot-dialogue-alterne
  type: texte_court
  difficulte: 2
  enonce: Pendant un dialogue, le film montre un personnage de face, puis celui qui lui répond, en face de lui, et ainsi de
    suite. Comment s'appelle ce procédé de montage ?
  reponse:
    acceptees:
    - champ-contrechamp
    - champ contre-champ
    - champ et contrechamp
    - champ et contre-champ
    fautes_tolerees: 1
  indices:
    relance: La caméra filme d'abord un personnage, puis se place dans la direction opposée. Comment appelle-t-on l'espace
      filmé par la caméra ?
    methode: 'Le nom est formé de deux mots : l''espace que filme la caméra, puis le même mot précédé d''un préfixe qui veut
      dire « en face ».'
    etape: Le premier mot est « champ ». Quel mot désigne l'espace situé en face de lui ?
  pieges:
  - si:
      valeur: travelling
    relance: Un travelling est un déplacement de la caméra pendant un même plan. Ici, on alterne deux plans filmés face à
      face.
  - si:
      valeur: panoramique
    relance: Un panoramique fait pivoter la caméra pendant un plan. Ici, on passe d'un plan à un autre, dans des directions
      opposées.
  solution: 'C''est le champ-contrechamp : on alterne le plan d''un personnage et le plan de celui qui lui fait face.'
- id: etapes-film
  type: ordre
  difficulte: 1
  enonce: Range ces étapes de la fabrication d'un film dans l'ordre.
  reponse:
    elements:
    - id: scenario
      texte: Écrire le scénario
    - id: storyboard
      texte: Dessiner le storyboard, plan par plan
    - id: tournage
      texte: Tourner les plans avec la caméra
    - id: montage
      texte: Choisir, couper et assembler les plans
    - id: projection
      texte: Projeter le film en salle
  indices:
    relance: 'Par quoi commence-t-on : par écrire l''histoire ou par filmer ? Et que fait-on en tout dernier ?'
    methode: Sépare ce qui se fait avant de filmer (préparer), pendant (filmer) et après (assembler, montrer au public).
    etape: L'histoire s'écrit en premier, puis on la dessine plan par plan pour préparer le tournage. Que fait-on des plans
      une fois tournés ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Peut-on assembler des plans qui n''ont pas encore été tournés
      ?'
  - si:
      diagnostic: ordre_faux
    relance: 'Sépare les étapes en trois temps : avant le tournage, le tournage, après le tournage.'
  solution: Écrire le scénario, dessiner le storyboard, tourner les plans, les monter (choisir, couper, assembler), puis projeter
    le film en salle.
- id: oeuvre-image
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre au type d'image auquel elle appartient.
  reponse:
    gauche:
    - id: a
      texte: Le Baiser de l'hôtel de ville, Robert Doisneau, 1950
    - id: b
      texte: Le Voyage dans la Lune, Georges Méliès, 1902
    - id: c
      texte: Citizen Kane, Orson Welles, 1941
    - id: d
      texte: Migrant Mother, Dorothea Lange, 1936
    - id: e
      texte: Le Cuirassé Potemkine, Sergueï Eisenstein, 1925
    droite:
    - id: x
      texte: photographie
    - id: y
      texte: film muet
    - id: z
      texte: film parlant
    paires:
      a: x
      b: y
      c: z
      d: x
      e: y
  indices:
    relance: Lesquels de ces auteurs sont photographes ? Lesquels sont réalisateurs de films ?
    methode: 'Sépare d''abord les photographies des films. Pour les films, sers-toi de la date : le premier long métrage parlant
      sort en 1927.'
    etape: Doisneau et Dorothea Lange sont photographes. Parmi les trois films, lequel est sorti après 1927 ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Regarde les dates des films : avant 1927, le cinéma est muet.'
  - si:
      diagnostic: associations_fausses
    relance: Sépare d'abord les deux photographes des trois réalisateurs, puis classe les films avec la date de 1927.
  solution: 'Photographies : Le Baiser de l''hôtel de ville et Migrant Mother. Films muets : Le Voyage dans la Lune (1902)
    et Le Cuirassé Potemkine (1925). Film parlant : Citizen Kane (1941).'
- id: chronologie-image
  type: ordre
  difficulte: 2
  enonce: Range ces événements de l'histoire de la photographie et du cinéma du plus ancien au plus récent.
  reponse:
    elements:
    - id: daguerreotype
      texte: Le daguerréotype est présenté à Paris
    - id: lumiere
      texte: Les frères Lumière organisent la première projection publique payante du cinématographe
    - id: jazz
      texte: Le Chanteur de jazz, premier long métrage parlant, sort en salle
    - id: doisneau
      texte: Robert Doisneau prend la photographie Le Baiser de l'hôtel de ville
  indices:
    relance: Pour faire du cinéma, il faut savoir enregistrer des images. Qu'est-ce qui a donc été inventé en premier ?
    methode: 'Place les inventions dans l''ordre logique : l''image fixe, puis l''image animée, puis l''image animée avec
      le son. Place ensuite la photographie du XXe siècle.'
    etape: Le daguerréotype date de 1839, la projection des frères Lumière de la fin du XIXe siècle. Où placer les deux autres
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux événements voisins sont inversés. Le cinéma a-t-il pu parler avant d''exister ?'
  - si:
      diagnostic: ordre_faux
    relance: Commence par l'invention de l'image fixe, puis celle de l'image animée ; le son et la photographie de Doisneau
      viennent au XXe siècle.
  solution: Le daguerréotype (1839), la projection des frères Lumière (28 décembre 1895), Le Chanteur de jazz (1927), Le Baiser
    de l'hôtel de ville (1950).
- id: analyse-doisneau
  type: ouverte
  difficulte: 3
  enonce: Voici la description d'une photographie. Le Baiser de l'hôtel de ville, de Robert Doisneau (1950), est une photographie
    en noir et blanc prise dans une rue de Paris. Au premier plan, un jeune couple s'embrasse en marchant sur le trottoir,
    au milieu des passants qui ne le regardent pas. Derrière eux, on voit la terrasse d'un café, et au fond, un peu flou,
    le bâtiment de l'Hôtel de Ville. Présente et analyse cette photographie en quelques phrases.
  criteres:
  - L'élève situe l'œuvre dans le champ de la photographie, avec l'auteur et la date.
  - L'élève emploie le vocabulaire de l'image (cadrage, premier plan, arrière-plan, noir et blanc, netteté ou flou) pour décrire
    la photographie.
  - 'L''élève propose une interprétation : le couple se détache de la foule pressée, l''image célèbre l''amour et la vie quotidienne
    à Paris après la guerre.'
  indices:
    relance: Où ton regard va-t-il en premier ? Qu'est-ce qui est net, et qu'est-ce qui est flou ?
    methode: Présente l'œuvre, décris-la du premier plan à l'arrière-plan, puis dis ce que le photographe veut montrer.
    etape: 'Tu peux commencer ainsi : « Le Baiser de l''hôtel de ville est une photographie en noir et blanc de Robert Doisneau,
      prise en 1950… »'
  solution: 'Le Baiser de l''hôtel de ville est une photographie en noir et blanc de Robert Doisneau, prise à Paris en 1950.
    Le cadrage place au premier plan un couple qui s''embrasse en marchant, net, au milieu de passants indifférents. À l''arrière-plan,
    la terrasse d''un café et l''Hôtel de Ville, flou, situent la scène à Paris. Le couple semble seul au monde au milieu
    de la foule : la photographie célèbre l''amour et la vie quotidienne dans la ville, quelques années après la guerre.'
- id: nblm-quel-evenement-majeur-marquant-l-histoir-1
  type: choix
  difficulte: 2
  enonce: Quel événement majeur marquant l'histoire du cinéma s'est déroulé le 28 décembre 1895 à Paris ?
  reponse:
    options:
    - id: o1
      texte: La première projection publique payante du cinématographe organisée par les frères Lumière.
    - id: o2
      texte: La sortie en salle du premier long métrage parlant de l'histoire du cinéma.
    - id: o3
      texte: La présentation officielle du daguerréotype par Louis Daguerre.
    - id: o4
      texte: La création de la première œuvre d'art vidéo sur écran de télévision.
    bonnes:
    - o1
  indices:
    relance: Pense aux deux frères inventeurs à l'origine des premières représentations cinématographiques payantes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de date : le premier film parlant (Le Chanteur de jazz) est sorti en 1927, plus de trente ans plus tard.'
  - si:
      contient:
      - o3
    relance: 'Erreur de procédé et d''époque : le daguerréotype est un procédé photographique présenté à Paris en 1839.'
  - si:
      contient:
      - o4
    relance: 'Erreur de domaine : l''art vidéo est une forme artistique apparue beaucoup plus tard, au XXe siècle.'
  solution: La première projection publique payante du cinématographe organisée par les frères Lumière. C'est exact. Auguste
    et Louis Lumière ont organisé la première projection publique payante du cinématographe à Paris le 28 décembre 1895.
- id: nblm-dans-un-film-quel-effet-produit-une-pris-2
  type: choix
  difficulte: 2
  enonce: Dans un film, quel effet produit une prise de vue réalisée en contre-plongée sur un personnage ?
  reponse:
    options:
    - id: o1
      texte: Le personnage paraît grand, puissant, dominateur ou menaçant.
    - id: o2
      texte: Le personnage paraît petit, vulnérable ou écrasé par le décor.
    - id: o3
      texte: Le personnage s'efface pour laisser place à un mouvement de rotation.
    - id: o4
      texte: Le personnage est filmé de dos pour alterner avec un autre plan.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'impression produite lorsque la caméra est placée plus bas que le sujet et filme vers le haut.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : c''est la prise de vue en plongée (de haut en bas) qui produit cet effet d''écrasement ou
      de petitesse.'
  - si:
      contient:
      - o3
    relance: 'Confusion : l''angle de vue vertical ne fait pas disparaître le sujet et ne doit pas être confondu avec un mouvement
      de caméra.'
  - si:
      contient:
      - o4
    relance: 'Confusion de notion : l''alternance de plans opposés est un champ-contrechamp, pas un angle de vue vertical.'
  solution: Le personnage paraît grand, puissant, dominateur ou menaçant. C'est exact. Filmer de bas en haut (en contre-plongée)
    grandit le sujet et lui donne un air puissant ou menaçant, comme pour le personnage de Kane dans Citizen Kane.
- id: nblm-comment-appelle-t-on-le-mouvement-de-cam-3
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on le mouvement de caméra où celle-ci se déplace réellement pendant la prise de vue (par exemple
    sur des rails) ?
  reponse:
    options:
    - id: o1
      texte: Le travelling
    - id: o2
      texte: Le panoramique
    - id: o3
      texte: Le cadrage
    - id: o4
      texte: Le champ-contrechamp
    bonnes:
    - o1
  indices:
    relance: Cherche un terme évoquant le déplacement ou le voyage de la caméra.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le panoramique est une rotation de la caméra sur son axe, sans déplacement de l''appareil.'
  - si:
      contient:
      - o3
    relance: 'Confusion de vocabulaire : le cadrage définit la délimitation de ce qui est montré dans l''image, pas un mouvement.'
  - si:
      contient:
      - o4
    relance: 'Confusion de notion : le champ-contrechamp est un procédé de montage alternant deux prises de vue opposées.'
  solution: Le travelling. C'est exact. Le travelling désigne un mouvement de prise de vue où la caméra se déplace physiquement
    dans l'espace.
- id: nblm-quelle-technique-de-montage-consiste-a-a-4
  type: choix
  difficulte: 2
  enonce: Quelle technique de montage consiste à alterner deux plans filmés dans des sens opposés, fréquemment utilisée pour
    filmer un dialogue ?
  reponse:
    options:
    - id: o1
      texte: Le champ-contrechamp
    - id: o2
      texte: La contre-plongée
    - id: o3
      texte: Le plan d'ensemble
    - id: o4
      texte: Le travelling
    bonnes:
    - o1
  indices:
    relance: Pense au procédé qui bascule le point de vue d'un interlocuteur à l'autre dans une conversation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : la contre-plongée est un angle de prise de vue (de bas en haut), pas une technique d''assemblage
      des plans.'
  - si:
      contient:
      - o3
    relance: 'Confusion : le plan d''ensemble indique la taille de la portion filmée (un vaste décor), pas un montage alterné.'
  - si:
      contient:
      - o4
    relance: 'Confusion : le travelling est un déplacement physique de la caméra lors de la prise de vue, pas un montage d''échanges.'
  solution: Le champ-contrechamp. C'est exact. Le champ-contrechamp alterne les vues de deux personnes qui se font face, notamment
    lors d'un dialogue.
- id: nblm-en-photographie-et-au-cinema-que-designe-5
  type: choix
  difficulte: 2
  enonce: En photographie et au cinéma, que désigne précisément la notion de « cadrage » ?
  reponse:
    options:
    - id: o1
      texte: Le choix de ce qui est montré à l'intérieur du cadre et de ce qui est laissé en dehors.
    - id: o2
      texte: L'assemblage des différents plans dans un ordre précis lors de la finition du film.
    - id: o3
      texte: Le fait de faire pivoter la caméra de gauche à droite sur un pied fixe.
    - id: o4
      texte: Le réglage de la couleur et de la lumière sur le plateau de tournage.
    bonnes:
    - o1
  indices:
    relance: Demande-toi ce que l'opérateur choisit d'inclure ou d'exclure lorsqu'il regarde à travers son objectif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''étape où l''on choisit, coupe et assemble les plans s''appelle le montage.'
  - si:
      contient:
      - o3
    relance: 'Erreur de terme : la rotation de la caméra sur elle-même est un panoramique.'
  - si:
      contient:
      - o4
    relance: 'Confusion : l''éclairage et la couleur sont des éléments d''ambiance, pas la sélection des limites de l''image.'
  solution: Le choix de ce qui est montré à l'intérieur du cadre et de ce qui est laissé en dehors. C'est exact. Le cadrage
    consiste à sélectionner les éléments visibles dans l'image et à déterminer le hors-champ.
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant les angles de prise de vue (plongée et contre-plongée) ? [2-4]
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: En plongée, la caméra filme de haut en bas et le sujet paraît petit ou écrasé.
    - id: o2
      texte: En contre-plongée, la caméra filme de bas en haut et le sujet paraît grand, puissant ou menaçant.
    - id: o3
      texte: En plongée, la caméra se déplace physiquement sur des rails le long de la scène.
    - id: o4
      texte: La contre-plongée consiste à faire pivoter la caméra sur elle-même pour balayer un paysage.
    bonnes:
    - o1
    - o2
  indices:
    relance: Repère les deux propositions qui décrivent correctement la direction de la prise de vue (vers le haut ou vers
      le bas) et son effet visuel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur de définition : le déplacement sur des rails correspond au travelling, pas à la plongée.'
  - si:
      contient:
      - o4
    relance: 'Erreur de définition : faire pivoter la caméra sur son axe fixe définit le panoramique.'
  solution: En plongée, la caméra filme de haut en bas et le sujet paraît petit ou écrasé ; En contre-plongée, la caméra filme
    de bas en haut et le sujet paraît grand, puissant ou menaçant. C'est exact. La plongée est une prise de vue orientée vers
    le bas qui rapetisse ou écrase visuellement le sujet.
- id: nblm-quel-terme-designe-le-mouvement-de-camer-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne le mouvement de caméra où celle-ci pivote sur place sans se déplacer ?
  reponse:
    acceptees:
    - panoramique
    fautes_tolerees: 1
  indices:
    relance: Ce mot dérive de la notion de vue d'ensemble sur un paysage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: panoramique. C'est exact. Le panoramique est la rotation de la caméra sur son pied ou son axe, sans déplacement
    de l'appareil.
- id: nblm-quel-est-le-titre-du-tout-premier-long-m-8
  type: texte_court
  difficulte: 1
  enonce: Quel est le titre du tout premier long métrage parlant, sorti en 1927 ?
  reponse:
    acceptees:
    - Le Chanteur de jazz
    fautes_tolerees: 1
  indices:
    relance: Ce film fait référence à un style musical emblématique né aux États-Unis.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: Le Chanteur de jazz. C'est exact. Le Chanteur de jazz, sorti en 1927, est historiquement le premier long métrage
    parlant.
- id: annee-lumiere
  type: nombre
  difficulte: 1
  enonce: En quelle année les frères Lumière organisent-ils à Paris la première projection publique payante de leur cinématographe
    ?
  reponse:
    valeur: 1895
    forme: entier
  indices:
    relance: Le cinéma naît à la fin du XIXe siècle, quelques années avant le XXe siècle.
    methode: Place cette date après le daguerréotype (1839) et bien avant le premier film parlant (1927).
    etape: La réponse est une année des années 1890, à la fin du XIXe siècle.
  pieges:
  - si:
      valeur: 1839
    relance: 1839 est l'année du daguerréotype, une invention de la photographie. Le cinéma est plus tardif.
  - si:
      valeur: 1927
    relance: 1927 est l'année du premier long métrage parlant, Le Chanteur de jazz. Le cinéma existe déjà depuis plus de trente
      ans.
  solution: La première projection publique payante a lieu le 28 décembre 1895 à Paris.
- id: types-de-plan
  type: association
  difficulte: 2
  enonce: Relie chaque terme à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Plan d'ensemble
    - id: b
      texte: Gros plan
    - id: c
      texte: Travelling
    - id: d
      texte: Panoramique
    droite:
    - id: w
      texte: Montre un vaste décor, où les personnages sont petits
    - id: x
      texte: Montre de très près un visage ou un objet
    - id: y
      texte: La caméra se déplace pendant la prise de vue
    - id: z
      texte: La caméra pivote sur place sans se déplacer
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Deux termes parlent de la taille de ce qu'on voit, deux termes parlent d'un mouvement de la caméra.
    methode: Pour les mouvements, demande-toi si la caméra change de place ou si elle reste au même endroit en tournant.
    etape: Un plan d'ensemble montre le décor en grand. Le gros plan est l'opposé. Il reste les deux mouvements.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie les deux mouvements : lequel déplace la caméra, lequel la fait tourner
      sur place ?'
  - si:
      diagnostic: associations_fausses
    relance: Sépare d'abord les tailles de plan des mouvements de caméra, puis relie chaque terme à sa définition.
  solution: 'Plan d''ensemble : un vaste décor. Gros plan : un visage ou un objet de très près. Travelling : la caméra se
    déplace. Panoramique : la caméra pivote sur place.'
