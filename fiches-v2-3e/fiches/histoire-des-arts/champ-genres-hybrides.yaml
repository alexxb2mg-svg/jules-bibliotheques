# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: champ-genres-hybrides
version: 3
etat: verifiee
declencheurs:
- street art
- art vidéo
- installation d'art contemporain
- œuvre éphémère
- roman graphique
- happening d'artiste
- calligramme d'Apollinaire
- emballer le Pont-Neuf
- art de la rue
- Christo et Jeanne-Claude
prerequis:
- decrire-oeuvre-lexique
- 4e-champ-genres-hybrides
essentiel: 'Aux XXe et XXIe siècles, des artistes inventent des formes qui ne rentrent pas dans les catégories classiques
  (peinture, sculpture). Elles sont hybrides quand elles mélangent plusieurs arts, éphémères quand elles ne durent qu''un
  temps.


  - La bande dessinée raconte une histoire par une suite d''images dessinées, en cases et en planches, avec des bulles pour
  les paroles. Elle mêle dessin et récit. Exemples : Tintin d''Hergé (à partir de 1929), Maus d''Art Spiegelman (années 1980).

  - La performance est une action réalisée par l''artiste, souvent devant un public : l''œuvre, c''est l''action elle-même.
  En 1960, Yves Klein fait appliquer de la peinture bleue sur le corps de modèles qui s''impriment sur des toiles, devant
  des spectateurs (les Anthropométries). Dans un happening, le public participe.

  - L''art vidéo utilise la caméra et l''écran comme matériaux d''art. Dans TV Buddha (1974), Nam June Paik place une statue
  de Bouddha face à un téléviseur qui montre sa propre image filmée en direct.

  - L''installation dispose des objets et des matériaux dans un lieu ; le spectateur la parcourt ou y entre. Ce n''est pas
  une sculpture : il n''y a pas un objet unique, mais tout un espace.

  - Les arts de la rue et le street art investissent l''espace public : graffitis, pochoirs, collages, spectacles de rue.
  Christo et Jeanne-Claude emballent le Pont-Neuf à Paris en 1985, pendant environ deux semaines.


  Beaucoup de ces œuvres disparaissent après avoir été montrées : on les connaît alors par des photographies, des films ou
  des témoignages. Leur courte durée fait partie de leur sens.


  Le programme associe aussi aux champs artistiques trois arts de la parole et de l''écrit :

  - la poésie joue avec les mots, les sons et le rythme. Elle rejoint parfois l''image : dans Calligrammes (1918), Guillaume
  Apollinaire dispose les mots du poème pour dessiner une forme (un calligramme) ;

  - l''éloquence est l''art de bien parler en public pour convaincre ou émouvoir (discours, plaidoirie). Le 17 septembre 1981,
  Robert Badinter défend devant l''Assemblée nationale l''abolition de la peine de mort ;

  - la littérature regroupe les romans, pièces de théâtre, poèmes et récits écrits pour leur qualité. Elle dialogue avec les
  arts visuels, comme dans la bande dessinée.


  Au brevet, on attend que tu nommes le genre, que tu dises ce qui rend l''œuvre hybride ou éphémère, que tu la situes (artiste,
  date, lieu) et que tu proposes une interprétation.

  '
methode:
- 'Nommer le genre : bande dessinée, performance, art vidéo, installation, art de la rue.'
- Dire ce qui rend l'œuvre hybride (quels arts elle mélange) ou éphémère (combien de temps elle dure).
- 'Décrire le rôle du lieu et du public : musée, rue, écran ; spectateur qui regarde, qui entre, qui participe.'
- 'Pour une œuvre disparue, préciser comment on la connaît : photographie, vidéo, récit.'
- 'Proposer une interprétation : ce que l''artiste veut faire réfléchir ou ressentir.'
- 'Situer l''œuvre : artiste, date, lieu, et le contexte de sa création (musée, rue, salle de ventes).'
- 'Pour un texte ou un discours (poésie, éloquence, littérature), dire le lien avec l''art : rythme, forme sur la page, effet
  sur le public.'
vocabulaire:
- terme: bande dessinée
  definition: récit en images dessinées, organisées en cases et en planches, avec des bulles
- terme: performance
  definition: action réalisée par l'artiste, souvent devant un public, qui constitue l'œuvre elle-même
- terme: art vidéo
  definition: art qui utilise la caméra, l'image vidéo et l'écran comme matériaux
- terme: installation
  definition: œuvre faite d'objets et de matériaux disposés dans un lieu, que le spectateur parcourt
- terme: street art
  definition: art réalisé dans la rue, sur les murs de la ville (graffiti, pochoir, collage)
- terme: éphémère
  definition: qui ne dure qu'un temps court
- terme: happening
  definition: performance dans laquelle le public participe à l'action
- terme: hybride
  definition: qui mélange plusieurs arts ou plusieurs techniques
- terme: éloquence
  definition: art de bien parler en public pour convaincre ou émouvoir
- terme: calligramme
  definition: poème dont les mots sont disposés pour dessiner une forme
erreurs_frequentes:
- 'Croire qu''une œuvre éphémère n''est pas une vraie œuvre : sa courte durée fait partie de son sens.'
- 'Confondre art vidéo et cinéma : l''art vidéo se montre souvent dans une exposition, sans raconter d''histoire comme un
  film.'
- Confondre installation (des objets disposés dans un lieu) et sculpture (un objet unique en volume).
- Oublier que la bande dessinée est un art à part entière, étudié en histoire des arts.
exemple:
  enonce: Explique pourquoi Le Pont-Neuf empaqueté de Christo et Jeanne-Claude (1985) est une œuvre éphémère.
  solution: 'En 1985, Christo et Jeanne-Claude recouvrent le Pont-Neuf, le plus vieux pont de Paris, d''une toile tenue par
    des cordes. L''œuvre ne reste en place qu''environ deux semaines, puis elle est démontée. Elle est donc éphémère : on
    la connaît aujourd''hui par les photographies et les films. En cachant le pont, les artistes invitent les passants à regarder
    autrement un monument qu''ils ne voyaient plus.'
exercices:
- id: mot-objets-dans-un-lieu
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une œuvre faite d'objets et de matériaux disposés dans un lieu, que le spectateur parcourt
    ou dans laquelle il entre ?
  reponse:
    acceptees:
    - installation
    - installation artistique
    fautes_tolerees: 1
  indices:
    relance: 'Que fait l''artiste avec ses objets dans la salle du musée : il les peint, ou il les dispose, il les installe
      ?'
    methode: Cherche un nom formé sur un verbe qui veut dire « mettre en place, disposer dans un lieu ».
    etape: Le nom se termine par « -ation » et vient du verbe « installer ».
  pieges:
  - si:
      valeur: sculpture
    relance: Une sculpture est un objet en volume que l'on regarde. Ici, plusieurs objets sont disposés dans tout un lieu,
      où l'on entre. Quel mot ?
  - si:
      valeur: exposition
    relance: Une exposition présente plusieurs œuvres. On cherche le nom d'une seule œuvre qui occupe un lieu.
  solution: 'C''est une installation : une œuvre faite d''objets disposés dans un lieu, que le spectateur parcourt.'
- id: mot-action-artiste
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on une œuvre qui est une action réalisée par l'artiste, souvent devant un public, et qui ne dure
    que le temps de cette action ?
  reponse:
    acceptees:
    - performance
    - happening
    fautes_tolerees: 1
  indices:
    relance: Dans ce genre d'œuvre, reste-t-il un objet à la fin, ou l'œuvre est-elle ce que fait l'artiste ?
    methode: Pense à un mot qui désigne aussi, en sport ou au spectacle, un exploit accompli devant des spectateurs.
    etape: Le mot est le même en français et en anglais ; il commence par « perf ».
  pieges:
  - si:
      valeur: théâtre
    relance: Au théâtre, des comédiens jouent un texte écrit à l'avance. Ici, c'est l'artiste lui-même qui agit, et l'action
      est l'œuvre. Quel mot ?
  - si:
      valeur: installation
    relance: Une installation dispose des objets dans un lieu. Ici, l'œuvre est une action. Quel mot ?
  solution: 'C''est une performance (on parle aussi de happening quand le public participe) : l''œuvre est l''action de l''artiste.'
- id: oeuvre-genre
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à son genre.
  reponse:
    gauche:
    - id: a
      texte: Maus, Art Spiegelman, années 1980
    - id: b
      texte: TV Buddha, Nam June Paik, 1974
    - id: c
      texte: The Artist Is Present, Marina Abramović, 2010, où l'artiste reste assise en silence face aux visiteurs du musée
    - id: d
      texte: Le Pont-Neuf empaqueté, Christo et Jeanne-Claude, 1985
    droite:
    - id: w
      texte: bande dessinée
    - id: x
      texte: art vidéo
    - id: y
      texte: performance
    - id: z
      texte: œuvre éphémère dans l'espace public
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Laquelle de ces œuvres se lit dans un livre ? Laquelle se trouve dehors, dans une ville ?
    methode: 'Demande-toi quel est le matériau de chaque œuvre : des dessins, un écran, le corps de l''artiste, un monument
      de la ville.'
    etape: Dans TV Buddha, une statue regarde un téléviseur. Dans The Artist Is Present, c'est l'artiste elle-même qui est
      l'œuvre. Place les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Relis le matériau de chaque œuvre : dessins, écran, corps, monument.'
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'œuvre qui se lit dans un livre et par celle qui recouvre un pont, puis place les deux autres.
  solution: Maus est une bande dessinée ; TV Buddha, une œuvre d'art vidéo ; The Artist Is Present, une performance ; Le Pont-Neuf
    empaqueté, une œuvre éphémère dans l'espace public.
- id: classer-hybrides
  type: choix
  difficulte: 1
  enonce: Parmi ces œuvres, lesquelles appartiennent au champ des genres hybrides ou éphémères des XXe et XXIe siècles ? Plusieurs
    réponses possibles.
  reponse:
    options:
    - id: a
      texte: Le Pont-Neuf empaqueté, Christo et Jeanne-Claude, 1985
    - id: b
      texte: Les Anthropométries, Yves Klein, 1960
    - id: c
      texte: La Création d'Adam, Michel-Ange, 1508-1512
    - id: d
      texte: Le Lac des cygnes, Piotr Ilitch Tchaïkovski, 1877
    bonnes:
    - a
    - b
  indices:
    relance: 'Regarde d''abord les dates : ce champ concerne les XXe et XXIe siècles.'
    methode: Élimine les œuvres des siècles anciens, puis vérifie que les autres mélangent plusieurs arts ou ne durent qu'un
      temps.
    etape: La Création d'Adam est une fresque de la Renaissance ; Le Lac des cygnes, un ballet du XIXe siècle. Que reste-t-il
      ?
  pieges:
  - si:
      contient:
      - c
    relance: 'La Création d''Adam est une fresque du XVIe siècle, peinte au plafond de la chapelle Sixtine : elle appartient
      aux beaux-arts.'
  - si:
      contient:
      - d
    relance: 'Le Lac des cygnes est un ballet du XIXe siècle, rejoué depuis sur scène : c''est du spectacle vivant.'
  - si:
      diagnostic: incomplet
    relance: Il en manque une. Une action réalisée devant un public en 1960 fait aussi partie de ce champ.
  solution: Le Pont-Neuf empaqueté (une œuvre éphémère, 1985) et les Anthropométries d'Yves Klein (une performance, 1960)
    appartiennent à ce champ. La Création d'Adam relève des beaux-arts, Le Lac des cygnes du spectacle vivant.
- id: chronologie-hybrides
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: tintin
      texte: Hergé publie la première aventure de Tintin, Tintin au pays des Soviets
    - id: klein
      texte: Yves Klein réalise ses Anthropométries devant un public
    - id: paik
      texte: Nam June Paik crée TV Buddha
    - id: christo
      texte: Christo et Jeanne-Claude emballent le Pont-Neuf à Paris
    - id: abramovic
      texte: Marina Abramović présente The Artist Is Present à New York
  indices:
    relance: Laquelle de ces œuvres date d'avant la Seconde Guerre mondiale ? Laquelle date du XXIe siècle ?
    methode: 'Associe chaque œuvre à une décennie, puis range les décennies. Pense aussi aux techniques : la vidéo n''existe
      pas au temps des débuts de Tintin.'
    etape: 'Tintin naît en 1929 et Abramović présente son œuvre en 2010. Range les trois autres : 1960, 1974, 1985.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux œuvres voisines sont inversées. Retrouve la décennie de chacune.'
  - si:
      diagnostic: ordre_faux
    relance: Place d'abord la bande dessinée d'Hergé et la performance de 2010, puis range les trois autres entre elles.
  solution: Tintin au pays des Soviets (1929), les Anthropométries (1960), TV Buddha (1974), Le Pont-Neuf empaqueté (1985),
    The Artist Is Present (2010).
- id: analyse-banksy
  type: ouverte
  difficulte: 3
  enonce: Voici la description d'une œuvre. Le 5 octobre 2018, dans une salle de ventes aux enchères de Londres, un tableau
    de l'artiste de rue Banksy, Girl with Balloon, vient d'être vendu pour plus d'un million de livres. L'image, peinte au
    pochoir, montre une petite fille qui tend la main vers un ballon rouge en forme de cœur. Juste après la vente, une broyeuse
    cachée dans le cadre découpe en lanières la moitié de la toile, devant le public stupéfait. Banksy rebaptise alors l'œuvre
    Love is in the Bin (« L'amour est dans la poubelle »). Présente et analyse cette œuvre en quelques phrases.
  criteres:
  - L'élève situe l'œuvre dans le champ des genres hybrides ou éphémères, en nommant l'artiste, la date et le lien avec le
    street art (le pochoir).
  - 'L''élève explique ce qui rend l''œuvre hybride : un tableau transformé par une action inattendue devant un public, proche
    de la performance.'
  - 'L''élève propose une interprétation : l''artiste critique le marché de l''art et le prix donné aux œuvres.'
  indices:
    relance: L'œuvre est-elle seulement l'image, ou aussi ce qui s'est passé dans la salle ce jour-là ?
    methode: Présente l'œuvre, décris l'image puis l'événement de la vente, et dis ce que Banksy veut dénoncer.
    etape: 'Tu peux commencer ainsi : « En 2018, lors d''une vente aux enchères à Londres, l''artiste de rue Banksy… »'
  solution: 'Girl with Balloon est une image au pochoir de Banksy, un artiste du street art. Le 5 octobre 2018, à Londres,
    juste après sa vente aux enchères pour plus d''un million de livres, une broyeuse cachée dans le cadre la découpe à moitié
    devant le public. L''œuvre devient hybride : un tableau transformé par une action spectaculaire, comme une performance.
    Rebaptisée Love is in the Bin, elle se moque du marché de l''art, où des acheteurs paient très cher des œuvres nées dans
    la rue.'
- id: annee-pont-neuf
  type: nombre
  difficulte: 2
  enonce: En quelle année Christo et Jeanne-Claude emballent-ils le Pont-Neuf à Paris ?
  reponse:
    valeur: 1985
    forme: entier
  indices:
    relance: Cette œuvre ne reste en place qu'environ deux semaines. Dans la leçon, elle est plus récente que TV Buddha.
    methode: 'Classe les œuvres de la leçon par ordre chronologique : la bande dessinée d''Hergé, la performance de Klein,
      l''art vidéo de Paik, puis celle-ci.'
    etape: La réponse est une année de la seconde moitié du XXe siècle.
  pieges:
  - si:
      valeur: 1974
    relance: 1974, c'est l'année de TV Buddha, l'œuvre d'art vidéo de Nam June Paik. Le Pont-Neuf est emballé plus tard.
  - si:
      valeur: 1960
    relance: 1960, c'est l'année des Anthropométries d'Yves Klein, une performance. Le Pont-Neuf est emballé bien après.
  - si:
      valeur: 2010
    relance: 2010 est l'année de The Artist Is Present de Marina Abramović. Le Pont-Neuf est emballé avant.
  solution: 'Le Pont-Neuf est emballé en 1985 : c''est une œuvre éphémère dans l''espace public, qui reste en place environ
    deux semaines.'
- id: definitions-champ
  type: choix
  difficulte: 2
  enonce: Parmi ces phrases, lesquelles sont exactes ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: L'éloquence est l'art de bien parler en public pour convaincre ou émouvoir.
    - id: b
      texte: Un calligramme est un poème dont les mots dessinent une forme.
    - id: c
      texte: Une installation est une action de l'artiste qui ne laisse aucun objet.
    - id: d
      texte: La bande dessinée est un livre sans aucune image.
    bonnes:
    - a
    - b
  indices:
    relance: Pour chaque phrase, demande-toi de quel genre elle parle et si la définition correspond bien à ce genre.
    methode: Relis les définitions du vocabulaire, puis vérifie chaque phrase une par une.
    etape: Une des phrases fausses décrit en réalité la performance. L'autre oublie ce qui fait la bande dessinée.
  pieges:
  - si:
      contient:
      - c
    relance: Cette phrase décrit une performance. Dans une installation, des objets sont disposés dans un lieu.
  - si:
      contient:
      - d
    relance: 'La bande dessinée raconte une histoire par des images dessinées, avec des bulles : elle est faite d''images.'
  - si:
      diagnostic: incomplet
    relance: Il y a une autre phrase exacte. Pense à l'art de la parole et à la poésie qui dessine.
  solution: 'Sont exactes : l''éloquence (art de bien parler en public) et le calligramme (poème dont les mots dessinent une
    forme). Une installation dispose des objets dans un lieu (la phrase c décrit une performance), et la bande dessinée est
    faite d''images.'
