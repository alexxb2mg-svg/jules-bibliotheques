format: 2
notion: theme-2-formes-circulations-medievales
version: 2
etat: verifiee
declencheurs:
- cathédrale gothique
- église romane
- Tapisserie de Bayeux
- vitraux de la Sainte-Chapelle
- Très Riches Heures du duc de Berry
- chant grégorien
- château fort
- querelle des images
- iconoclastes byzantins
prerequis:
- decrire-oeuvre-lexique
- nommer-oeuvres-majeures
essentiel: 'Du IXe au XVe siècle, l''art du Moyen Âge est surtout au service de la foi chrétienne, mais aussi des seigneurs
  et des villes.


  L''architecture religieuse connaît deux grands styles. L''art roman (XIe-XIIe siècles) : murs épais, petites fenêtres, arcs
  en plein cintre (en demi-cercle), voûtes en berceau ; les églises sont sombres et massives, comme la basilique de Vézelay.
  L''art gothique (du milieu du XIIe au XVe siècle) : la voûte d''ogives et l''arc brisé permettent de monter plus haut et
  d''ouvrir de grandes fenêtres garnies de vitraux, qui font entrer la lumière. La cathédrale de Chartres (reconstruite après
  1194) et la Sainte-Chapelle de Paris (1248) en sont des exemples.


  L''image sert à enseigner la foi à des fidèles qui, pour la plupart, ne savent pas lire. À Byzance, aux VIIIe et IXe siècles,
  une querelle oppose ceux qui veulent détruire les images religieuses (les iconoclastes) à ceux qui les défendent ; les images
  sont finalement rétablies en 843.


  Les formes circulent autour de la Méditerranée, entre mondes chrétien et musulman : arcs, décors géométriques, soieries
  et ivoires voyagent avec les marchands, les pèlerins et les croisés. La mosquée de Cordoue, en Espagne musulmane, en est
  un grand témoin.


  Les livres sont des manuscrits, copiés à la main sur du parchemin (peau d''animal) et décorés d''enluminures, des peintures
  en couleurs et à l''or. Les Très Riches Heures du duc de Berry, peintes par les frères de Limbourg vers 1411-1416, montrent
  les travaux des mois.


  La Tapisserie de Bayeux (fin du XIe siècle) est une longue broderie de près de 70 mètres qui raconte la conquête de l''Angleterre
  par Guillaume de Normandie en 1066.


  En musique, le chant grégorien est chanté à une voix, en latin. Au XIe siècle, le moine Guido d''Arezzo perfectionne la
  portée et donne des noms aux notes. Au XIVe siècle, Guillaume de Machaut compose la Messe de Nostre Dame, à plusieurs voix
  (polyphonie).


  L''architecture ne sert pas qu''à prier : elle protège et organise la vie. Un château fort a un donjon, des remparts, des
  tours et un fossé pour la défense. Dans les villes, les habitants construisent des maisons à pans de bois, des halles et
  des beffrois, les tours qui symbolisent la ville. Le palais des Papes à Avignon (XIVe siècle) mêle forteresse et résidence.


  Au brevet, on attend que tu saches : distinguer art roman et art gothique, expliquer le rôle de l''image dans l''Église,
  décrire un manuscrit enluminé, citer une circulation de formes autour de la Méditerranée, et dire ce qu''est une écriture
  musicale.

  '
methode:
- 'Repérer le style d''une église : arcs en demi-cercle et murs épais (roman) ou arcs brisés, voûtes d''ogives et grands vitraux
  (gothique).'
- 'Identifier le support : parchemin (manuscrit), verre (vitrail), toile brodée, pierre sculptée.'
- 'Dire la fonction : enseigner la foi, glorifier Dieu, raconter une victoire, montrer la richesse d''un prince.'
- 'Situer dans le temps : XIe-XIIe siècles pour le roman, XIIe-XVe siècles pour le gothique.'
- Pour distinguer roman et gothique, regarder l'arc (plein cintre ou brisé), la voûte, la taille des fenêtres et la lumière.
- Pour un manuscrit, relever le support (parchemin), l'écriture, les images (enluminures) et le sujet.
vocabulaire:
- terme: voûte d'ogives
  definition: une voûte portée par des arcs qui se croisent, typique de l'art gothique
- terme: vitrail
  definition: une composition de morceaux de verre colorés assemblés par des baguettes de plomb
- terme: enluminure
  definition: une peinture qui décore un manuscrit, souvent rehaussée d'or
- terme: iconoclasme
  definition: le refus des images religieuses, qui peut aller jusqu'à leur destruction
- terme: polyphonie
  definition: une musique à plusieurs voix qui chantent des lignes différentes en même temps
- terme: château fort
  definition: une construction militaire avec donjon, remparts et tours, qui protège un seigneur et ses habitants
- terme: parchemin
  definition: une peau d'animal préparée sur laquelle on écrit et on peint les manuscrits
- terme: iconoclaste
  definition: celui qui veut détruire les images religieuses, comme à Byzance aux VIIIe et IXe siècles
erreurs_frequentes:
- 'Confondre roman et gothique : le roman est plus ancien, plus massif et plus sombre ; le gothique est plus haut et plus
  lumineux.'
- 'Croire que la Tapisserie de Bayeux est tissée : c''est une broderie de laine sur une toile de lin.'
- 'Croire qu''un manuscrit est imprimé : au Moyen Âge, avant l''imprimerie, les livres sont copiés à la main.'
- 'Oublier la fonction des images : elles enseignent la foi à des fidèles qui ne savent pas lire.'
exemple:
  enonce: Explique en trois phrases pourquoi une cathédrale gothique est plus lumineuse qu'une église romane.
  solution: 'Dans une église romane, les murs épais portent le poids de la voûte : on ne peut y percer que de petites fenêtres.
    Dans une cathédrale gothique, la voûte d''ogives et les arcs-boutants reportent le poids sur des piliers. Les murs peuvent
    donc s''ouvrir sur de grandes fenêtres garnies de vitraux, qui font entrer une lumière colorée, symbole de la présence
    de Dieu.'
exercices:
- id: style-roman
  type: choix
  difficulte: 1
  enonce: Une église a des murs très épais, de petites fenêtres, des arcs en demi-cercle et une voûte en berceau. À l'intérieur,
    il fait plutôt sombre. De quel style est-elle ?
  reponse:
    options:
    - id: a
      texte: Le style roman
    - id: b
      texte: Le style gothique
    - id: c
      texte: Le style baroque
    bonnes:
    - a
  indices:
    relance: 'Des petites fenêtres et des murs épais : ce style est-il le plus ancien ou le plus récent du Moyen Âge ?'
    methode: 'Compare les arcs : en demi-cercle (plein cintre) ou pointus (brisés) ?'
    etape: Le style gothique, plus tardif, se reconnaît à ses arcs brisés et à ses grands vitraux. Ce n'est donc pas lui.
  pieges:
  - si:
      contient:
      - b
    relance: Le gothique ouvre de grandes fenêtres et fait entrer la lumière. La description parle-t-elle de lumière ?
  - si:
      contient:
      - c
    relance: Le baroque date des XVIIe et XVIIIe siècles, bien après le Moyen Âge. Quel style médiéval est massif et sombre
      ?
  solution: 'C''est le style roman (XIe-XIIe siècles) : murs épais, petites fenêtres, arcs en plein cintre (demi-cercle),
    voûte en berceau.'
- id: mot-vitrail
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une fenêtre d'église faite de morceaux de verre colorés, assemblés par des baguettes de plomb
    ?
  reponse:
    acceptees:
    - vitrail
    - vitraux
    fautes_tolerees: 0
  indices:
    relance: Pense aux grandes fenêtres colorées de la Sainte-Chapelle ou de Chartres.
    methode: Le mot vient de « verre ». Quel nom désigne cette fenêtre décorée ?
    etape: Le mot commence par « vit- ».
  pieges:
  - si:
      valeur: mosaïque
    relance: Une mosaïque est collée sur un mur ou un sol et ne laisse pas passer la lumière. Ici, la lumière traverse le
      verre.
  - si:
      valeur: rosace
    relance: Une rosace est une grande fenêtre ronde. Quel mot désigne la technique du verre coloré assemblé au plomb, quelle
      que soit la forme ?
  solution: 'Un vitrail (des vitraux) : des verres colorés assemblés au plomb, qui font entrer une lumière colorée dans les
    églises gothiques.'
- id: mot-enluminure
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on une peinture en couleurs, souvent rehaussée d'or, qui décore une page de manuscrit au Moyen
    Âge ?
  reponse:
    acceptees:
    - enluminure
    - enluminures
    - miniature
    fautes_tolerees: 1
  indices:
    relance: 'Pense aux pages des Très Riches Heures du duc de Berry : que les frères de Limbourg y ont-ils peint ?'
    methode: 'Le mot contient l''idée de « lumière » : l''or et les couleurs font briller la page.'
    etape: Le mot commence par « enlu- ».
  pieges:
  - si:
      valeur: calligraphie
    relance: La calligraphie, c'est l'art de bien former les lettres. Quel mot désigne les images peintes du manuscrit ?
  solution: 'Une enluminure : une peinture qui décore un manuscrit, comme celles des Très Riches Heures du duc de Berry (vers
    1411-1416).'
- id: oeuvre-technique
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre médiévale à ce qu'elle est.
  reponse:
    gauche:
    - id: a
      texte: La Tapisserie de Bayeux
    - id: b
      texte: Les Très Riches Heures du duc de Berry
    - id: c
      texte: La Sainte-Chapelle de Paris
    - id: d
      texte: La Messe de Nostre Dame de Guillaume de Machaut
    droite:
    - id: w
      texte: Une broderie qui raconte une conquête
    - id: x
      texte: Un manuscrit décoré de peintures
    - id: y
      texte: Une chapelle gothique aux immenses vitraux
    - id: z
      texte: Une œuvre musicale à plusieurs voix
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Laquelle de ces œuvres s'écoute ? Laquelle se visite ?
    methode: 'Place d''abord l''œuvre musicale et le bâtiment, puis départage les deux dernières : un livre ou une longue
      toile ?'
    etape: Une « messe » est chantée. Un livre d'« heures » sert à prier. Place-les, puis les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Demande-toi pour chaque œuvre : se lit-elle, s''écoute-t-elle, se visite-t-elle
      ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : une messe est une œuvre musicale. Place ensuite les autres.'
  solution: 'Tapisserie de Bayeux : broderie qui raconte la conquête de l''Angleterre (1066). Très Riches Heures : manuscrit
    enluminé (vers 1411-1416). Sainte-Chapelle : chapelle gothique aux vitraux (1248). Messe de Nostre Dame : polyphonie du
    XIVe siècle.'
- id: chronologie-medievale
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: bayeux
      texte: La Tapisserie de Bayeux
    - id: chartres
      texte: La reconstruction gothique de la cathédrale de Chartres
    - id: machaut
      texte: La Messe de Nostre Dame de Guillaume de Machaut
    - id: berry
      texte: Les Très Riches Heures du duc de Berry
  indices:
    relance: Laquelle de ces œuvres raconte un événement de 1066 ?
    methode: Associe chaque œuvre à un siècle (XIe, XIIIe, XIVe, XVe), puis range les siècles.
    etape: La Tapisserie de Bayeux date de la fin du XIe siècle et la cathédrale de Chartres est reconstruite après 1194.
      Où placer l'œuvre musicale du XIVe siècle ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux œuvres voisines sont inversées. Laquelle des deux est la plus ancienne ?
  - si:
      diagnostic: ordre_faux
    relance: Donne un siècle à chaque œuvre avant de les ranger.
  solution: Tapisserie de Bayeux (fin du XIe siècle), cathédrale de Chartres (reconstruite après 1194, surtout au début du
    XIIIe siècle), Messe de Nostre Dame de Machaut (XIVe siècle), Très Riches Heures du duc de Berry (vers 1411-1416, XVe
    siècle).
- id: analyse-cathedrale
  type: ouverte
  difficulte: 3
  enonce: Voici une œuvre décrite. La cathédrale de Chartres a été reconstruite après un incendie en 1194. Sa nef est très
    haute, couverte de voûtes d'ogives. À l'extérieur, des arcs-boutants soutiennent les murs. De grandes fenêtres et des
    rosaces garnies de vitraux bleus et rouges racontent la vie du Christ, de la Vierge et des saints. Décris cette cathédrale
    et explique à quoi servaient ses vitraux, en la reliant à son époque.
  criteres:
  - L'élève utilise au moins deux mots précis du style gothique (voûte d'ogives, arc-boutant, vitrail, rosace, arc brisé).
  - 'L''élève explique la fonction des vitraux : faire entrer une lumière colorée, symbole de Dieu, et enseigner la Bible
    aux fidèles qui ne savent pas lire.'
  - 'L''élève situe l''œuvre : l''art gothique, fin du XIIe et XIIIe siècles, dans une société chrétienne.'
  indices:
    relance: Comment ce bâtiment peut-il avoir de si grandes fenêtres sans s'écrouler ?
    methode: Décris l'architecture, puis les vitraux, puis explique leur rôle pour les fidèles du Moyen Âge.
    etape: 'Tu peux commencer ainsi : « La cathédrale de Chartres est une église gothique reconstruite après 1194... »'
  solution: 'La cathédrale de Chartres est une église gothique reconstruite après 1194. Grâce aux voûtes d''ogives et aux
    arcs-boutants, les murs peuvent être percés de grandes fenêtres et de rosaces. Les vitraux font entrer une lumière colorée,
    vue comme un signe de la présence de Dieu. Ils racontent aussi, en images, la vie du Christ et des saints : ils enseignent
    la foi à des fidèles qui, au Moyen Âge, ne savent souvent pas lire.'
- id: iconoclasme
  type: choix
  difficulte: 2
  enonce: Aux VIIIe et IXe siècles, dans l'Empire byzantin, les iconoclastes s'opposent aux défenseurs des images. Que veulent
    les iconoclastes ?
  reponse:
    options:
    - id: a
      texte: Détruire les images religieuses
    - id: b
      texte: Copier des manuscrits enluminés
    - id: c
      texte: Construire des églises gothiques
    - id: d
      texte: Imprimer des livres en série
    bonnes:
    - a
  indices:
    relance: Le mot « iconoclaste » se compose de « icône » et d'un mot grec qui veut dire « briser ».
    methode: 'Pense à l''étymologie : « icône » veut dire image, et le second élément veut dire « briser ».'
    etape: Trois options ne concernent pas un conflit sur les images. Il en reste une seule qui parle de s'en prendre aux
      images.
  pieges:
  - si:
      contient:
      - b
    relance: Copier des manuscrits, c'est au contraire produire des images. Que veulent faire les iconoclastes des images
      ?
  - si:
      contient:
      - c
    relance: L'art gothique apparaît bien plus tard, au XIIe siècle.
  - si:
      contient:
      - d
    relance: L'imprimerie apparaît au XVe siècle en Europe, bien après cette querelle.
  solution: Les iconoclastes veulent détruire les images religieuses ; elles sont rétablies en 843.
- id: mot-gregorien
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le chant religieux du Moyen Âge chanté à une seule voix, en latin, sans instrument ?
  reponse:
    acceptees:
    - chant grégorien
    - grégorien
    - le chant grégorien
    fautes_tolerees: 1
  indices:
    relance: Ce chant est celui des moines et des églises. Son nom vient d'un pape.
    methode: Le nom rappelle un pape nommé Grégoire. Ajoute-le au mot « chant ».
    etape: Le mot commence par « gré- » et se termine par « -ien ».
  pieges:
  - si:
      valeur: polyphonie
    relance: 'La polyphonie, c''est le chant à plusieurs voix. Ici, il n''y en a qu''une : quel nom ?'
  solution: Le chant grégorien est chanté à une voix, en latin, sans instrument.
