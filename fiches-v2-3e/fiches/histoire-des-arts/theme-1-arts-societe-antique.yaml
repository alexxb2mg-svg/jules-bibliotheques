- id: nblm-comment-appelle-t-on-la-partie-superieur-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la partie supérieure d'une colonne antique dont la forme permet de reconnaître l'ordre architectural
    (dorique, ionique ou corinthien) ?
  reponse:
    acceptees:
    - Chapiteau
    fautes_tolerees: 1
  indices:
    relance: C'est la pièce sculptée qui surmonte le fût de la colonne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Chapiteau. C''est exact : le chapiteau couronne la colonne et permet d''identifier son ordre architectural.'
