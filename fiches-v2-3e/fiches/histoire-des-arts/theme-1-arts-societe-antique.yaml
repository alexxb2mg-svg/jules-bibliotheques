- id: ville-antique-medievale
  type: choix
  difficulte: 3
  enonce: Quels éléments marquent le passage de la ville antique à la ville médiévale au haut Moyen Âge ?
  reponse:
    options:
    - id: a
      texte: Des remparts entourent la ville.
    - id: b
      texte: L'église devient le cœur de la ville.
    - id: c
      texte: Le forum reste le seul centre de la vie de la cité.
    - id: d
      texte: Les thermes se multiplient dans chaque quartier.
    bonnes:
    - a
    - b
  indices:
    relance: Qu'est-ce qui protège la ville et qu'est-ce qui la rassemble au Moyen Âge ?
    methode: La ville antique est organisée autour du forum. Au haut Moyen Âge, la ville se replie et un bâtiment religieux
      devient central.
    etape: Cherche un élément de défense et un élément religieux.
  pieges:
  - si:
      contient:
      - c
    relance: Le forum est le centre de la ville antique. Quel bâtiment prend sa place au Moyen Âge ?
  - si:
      contient:
      - d
    relance: Les thermes sont des bains publics de la ville romaine. Ils ne caractérisent pas la ville médiévale.
  - si:
      diagnostic: incomplet
    relance: 'Tu as trouvé un changement, mais il y en a un autre : défense ou religion ?'
  solution: Au haut Moyen Âge, les villes se rétractent derrière des remparts et l'église devient le centre. Le forum et les
    thermes appartiennent à la ville antique.
- id: deesse-parthenon
  type: texte_court
  difficulte: 2
  enonce: Le Parthénon, sur l'Acropole, est dédié à une déesse de la sagesse et de la guerre, protectrice de la cité. Comment
    s'appelle-t-elle ?
  reponse:
    acceptees:
    - Athéna
    - Athena
    fautes_tolerees: 1
  indices:
    relance: Dans la mythologie grecque, quelle déesse est née de la tête de Zeus ?
    methode: Cette déesse donne son nom à la ville grecque dont l'Acropole est le cœur.
    etape: Son nom commence par « Ath- » et se termine par « -na ».
  pieges:
  - si:
      valeur: Aphrodite
    relance: Aphrodite est la déesse de l'amour. On cherche la déesse de la sagesse et de la guerre.
  - si:
      valeur: Artémis
    relance: Artémis est la déesse de la chasse. On cherche la protectrice de la cité, déesse de la sagesse.
  solution: 'C''est Athéna : le Parthénon est son temple, et les frontons racontent des épisodes de sa légende.'
