      texte: Le Parthénon et le Colisée ont tous deux été bâtis pendant la période du haut Moyen Âge
    bonnes:
    - o1
  indices:
    relance: Pense à l'ordre chronologique entre la Grèce classique d'Athènes et l'Empire romain.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
