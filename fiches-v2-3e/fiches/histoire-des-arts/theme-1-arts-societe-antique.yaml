format: 2
notion: theme-1-arts-societe-antique
version: 3
etat: verifiee
declencheurs:
- Parthénon
- Colisée
- colonnes grecques
- temple grec
- mosaïque romaine
- ordre dorique
- ville antique
- mosaïques de Ravenne
- pont du Gard
- art byzantin
prerequis:
- decrire-oeuvre-lexique
- nommer-oeuvres-majeures
essentiel: 'Dans l''Antiquité, l''art sert la cité, les dieux et le pouvoir.


  En Grèce, le temple est la maison d''un dieu. Le Parthénon, construit sur l''Acropole d''Athènes au Ve siècle avant J.-C.
  (447-432 av. J.-C.), est dédié à la déesse Athéna. Ses colonnes suivent l''ordre dorique : pas de base, un chapiteau simple.
  Il existe aussi l''ordre ionique (chapiteau à volutes, en spirale) et l''ordre corinthien (chapiteau à feuilles d''acanthe).
  Ses frontons et ses frises sculptés illustrent des mythes, comme la naissance d''Athéna : les mythes fondateurs racontent
  l''origine des dieux et de la cité.


  Les sculpteurs grecs cherchent à représenter un corps humain idéal, équilibré et en mouvement : le Discobole de Myron (vers
  450 av. J.-C.) nous est connu par des copies romaines en marbre. Les Romains, eux, aiment aussi le portrait réaliste, par
  exemple les bustes d''empereurs, qui montrent un visage précis pour affirmer le pouvoir.


  Rome reprend les modèles grecs et construit pour la vie de la cité : amphithéâtres pour les spectacles (le Colisée, inauguré
  en 80 après J.-C.), aqueducs (le pont du Gard, Ier siècle après J.-C.), thermes, forums (les places publiques). Les Romains
  aiment aussi la mosaïque, une image faite de petits cubes colorés.


  Au haut Moyen Âge, l''art devient surtout chrétien. À Ravenne, en Italie, l''église Saint-Vital (VIe siècle) est décorée
  de mosaïques à fond d''or qui montrent l''empereur byzantin Justinien et l''impératrice Théodora : les personnages, vus
  de face et immobiles, unissent pouvoir et religion.


  De la ville antique à la ville médiévale : la ville antique s''organise autour du forum, avec des rues droites, des thermes
  et des monuments pour les spectacles. Au haut Moyen Âge, beaucoup de villes se rétractent derrière des remparts et l''église
  devient le cœur de la ville médiévale.


  Ce qu''on attend au brevet : identifier une œuvre antique, la situer (Grèce ou Rome, avant ou après J.-C.), la décrire avec
  le bon vocabulaire et dire à quoi elle servait.

  '
methode:
- 'Identifier l''œuvre : titre, lieu, civilisation, date (avant ou après J.-C.).'
- 'Décrire avec le vocabulaire précis : colonne, chapiteau, fronton, frise, mosaïque, amphithéâtre.'
- 'Dire à quoi servait l''œuvre : honorer un dieu, divertir le peuple, montrer la puissance d''un empereur.'
- 'Relier l''œuvre à son contexte : la cité grecque, l''Empire romain, l''Empire byzantin chrétien.'
- 'Pour une ville, comparer les lieux importants : forum et thermes dans la ville antique, remparts et église dans la ville
  médiévale.'
vocabulaire:
- terme: ordre architectural
  definition: un style de colonne (dorique, ionique ou corinthien) reconnaissable surtout à son chapiteau
- terme: fronton
  definition: le triangle au-dessus des colonnes, sur la façade d'un temple, souvent décoré de sculptures
- terme: mosaïque
  definition: une image faite de petits cubes de pierre, de verre ou de terre cuite colorés
- terme: amphithéâtre
  definition: un édifice romain de forme ovale où l'on assiste à des spectacles, comme les combats de gladiateurs
- terme: Acropole
  definition: la colline fortifiée d'Athènes où se dressent les grands temples, dont le Parthénon
- terme: chapiteau
  definition: la partie haute d'une colonne, dont la forme permet de reconnaître l'ordre
- terme: frise
  definition: une bande sculptée ou peinte qui court le long d'un mur ou d'un temple
- terme: forum
  definition: la grande place publique d'une ville romaine, centre de la vie civique
erreurs_frequentes:
- 'Confondre avant et après J.-C. : le Parthénon (Ve siècle av. J.-C.) est bien plus ancien que le Colisée (Ier siècle apr.
  J.-C.).'
- 'Confondre grec et romain : le Parthénon est grec, le Colisée et le pont du Gard sont romains.'
- 'Oublier la fonction de l''œuvre : un temple, un amphithéâtre ou une mosaïque d''église servent la religion ou le pouvoir.'
- 'Confondre les trois ordres : dorique (simple), ionique (volutes), corinthien (feuilles d''acanthe).'
exemple:
  enonce: Explique en trois phrases à quoi servait le Colisée de Rome.
  solution: Le Colisée est un amphithéâtre romain inauguré en 80 après J.-C. Il accueillait des spectacles gratuits, comme
    des combats de gladiateurs ou des chasses d'animaux, devant des dizaines de milliers de spectateurs. En offrant ces jeux
    au peuple, l'empereur montrait sa générosité et sa puissance.
exercices:
- id: ordre-parthenon
  type: choix
  difficulte: 1
  enonce: Les colonnes extérieures du Parthénon n'ont pas de base et ont un chapiteau très simple, sans décor. À quel ordre
    architectural appartiennent-elles ?
  reponse:
    options:
    - id: a
      texte: L'ordre dorique
    - id: b
      texte: L'ordre ionique
    - id: c
      texte: L'ordre corinthien
    bonnes:
    - a
  indices:
    relance: Parmi les trois ordres grecs, lequel est le plus sobre ?
    methode: 'Regarde le chapiteau : des volutes en spirale, des feuilles, ou rien du tout ?'
    etape: Les volutes appartiennent à un ordre, les feuilles d'acanthe à un autre. Il reste celui au chapiteau nu.
  pieges:
  - si:
      contient:
      - b
    relance: L'ordre ionique a des chapiteaux en forme de spirales. En vois-tu dans la description ?
  - si:
      contient:
      - c
    relance: L'ordre corinthien est décoré de feuilles d'acanthe. La description parle-t-elle de feuilles ?
  solution: 'Les colonnes extérieures du Parthénon sont d''ordre dorique : pas de base, un chapiteau simple. L''ordre ionique
    a des volutes, l''ordre corinthien des feuilles d''acanthe.'
- id: chronologie-antique
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: pyramides
      texte: Les pyramides de Gizeh, en Égypte
    - id: parthenon
      texte: Le Parthénon d'Athènes
    - id: colisee
      texte: Le Colisée de Rome
    - id: ravenne
      texte: Les mosaïques de Justinien à Saint-Vital de Ravenne
  indices:
    relance: Lesquelles de ces œuvres datent d'avant J.-C. ?
    methode: Place d'abord l'Égypte des pharaons, puis la Grèce, puis Rome, puis l'Empire byzantin chrétien.
    etape: Les pyramides datent d'environ 2500 av. J.-C. Le Parthénon est du Ve siècle av. J.-C. Où placer les deux œuvres
      d'après J.-C. ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux œuvres voisines sont inversées. Laquelle des deux est la plus ancienne ?
  - si:
      diagnostic: ordre_faux
    relance: Sépare d'abord les œuvres d'avant J.-C. et celles d'après J.-C., puis range chaque groupe.
  solution: Pyramides de Gizeh (vers 2500 av. J.-C.), Parthénon (447-432 av. J.-C.), Colisée (inauguré en 80 apr. J.-C.),
    mosaïques de Saint-Vital de Ravenne (VIe siècle apr. J.-C.).
- id: oeuvre-civilisation
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à la civilisation qui l'a produite.
  reponse:
    gauche:
    - id: a
      texte: Le Parthénon
    - id: b
      texte: Le pont du Gard
    - id: c
      texte: Les pyramides de Gizeh
    - id: d
      texte: Les mosaïques de Justinien et Théodora à Ravenne
    droite:
    - id: w
      texte: L'Égypte des pharaons
    - id: x
      texte: La Grèce antique
    - id: y
      texte: L'Empire romain
    - id: z
      texte: L'Empire byzantin chrétien
    paires:
      a: x
      b: y
      c: w
      d: z
  indices:
    relance: Quelle œuvre se trouve à Athènes ? Laquelle en Gaule, dans le sud de la France ?
    methode: 'Pour chaque œuvre, pense au lieu puis à la période : Athènes, la Gaule conquise par Rome, le Nil, l''Italie
      du VIe siècle.'
    etape: Justinien est un empereur chrétien de Constantinople au VIe siècle. Place-le d'abord, puis les trois autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends le lieu de chaque œuvre.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : les pyramides sont au bord du Nil. Place ensuite les autres.'
  solution: 'Parthénon : Grèce antique. Pont du Gard : Empire romain (aqueduc du Ier siècle en Gaule). Pyramides de Gizeh
    : Égypte des pharaons. Mosaïques de Ravenne : Empire byzantin chrétien (VIe siècle).'
- id: mot-mosaique
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une image faite de petits cubes de pierre, de verre ou de terre cuite colorés, collés les uns
    à côté des autres ?
  reponse:
    acceptees:
    - mosaïque
    - mosaïques
    fautes_tolerees: 1
  indices:
    relance: Pense aux sols des villas romaines et aux murs dorés des églises de Ravenne.
    methode: Les petits cubes s'appellent des tesselles. Quel mot désigne l'image entière ?
    etape: Le mot commence par « mos- ».
  pieges:
  - si:
      valeur: fresque
    relance: Une fresque est peinte sur un enduit frais. Ici, l'image est faite de petits morceaux assemblés. Quel est le
      mot ?
  - si:
      valeur: vitrail
    relance: Un vitrail laisse passer la lumière à travers du verre. Ici, les cubes sont collés sur un mur ou un sol.
  solution: 'Une mosaïque : une image faite de petits cubes colorés (les tesselles), très utilisée par les Romains et dans
    les églises byzantines.'
- id: fonction-colisee
  type: choix
  difficulte: 2
  enonce: À quoi servait le Colisée de Rome, inauguré en 80 après J.-C. ?
  reponse:
    options:
    - id: a
      texte: Offrir des spectacles au peuple, comme des combats de gladiateurs
    - id: b
      texte: Honorer la déesse Athéna
    - id: c
      texte: Conduire l'eau jusqu'à la ville
    - id: d
      texte: Enterrer un pharaon
    bonnes:
    - a
  indices:
    relance: Le Colisée est un amphithéâtre. Que fait-on dans un amphithéâtre romain ?
    methode: 'Élimine les fonctions d''autres monuments : le temple, l''aqueduc, la pyramide.'
    etape: Les empereurs offraient des jeux gratuits aux habitants de Rome. Où avaient-ils lieu ?
  pieges:
  - si:
      contient:
      - b
    relance: Athéna est honorée dans un temple grec, le Parthénon. Le Colisée est romain et n'est pas un temple.
  - si:
      contient:
      - c
    relance: Conduire l'eau, c'est le rôle d'un aqueduc comme le pont du Gard. Et le Colisée ?
  - si:
      contient:
      - d
    relance: Les tombeaux de pharaons sont en Égypte. Le Colisée est à Rome.
  solution: 'Le Colisée est un amphithéâtre : il accueillait des spectacles gratuits (gladiateurs, chasses d''animaux). En
    les offrant, l''empereur montrait sa générosité et sa puissance.'
- id: analyse-mosaique-justinien
  type: ouverte
  difficulte: 3
  enonce: Voici une œuvre décrite. Dans l'église Saint-Vital de Ravenne (VIe siècle), une mosaïque à fond d'or montre l'empereur
    Justinien au centre, de face, vêtu de pourpre, la tête entourée d'un cercle de lumière (une auréole). Il porte une coupe
    d'offrande. Autour de lui, des soldats, des hommes de sa cour et un évêque. Décris cette œuvre et explique ce qu'elle
    veut montrer, en la reliant à son contexte.
  criteres:
  - L'élève décrit l'œuvre avec au moins deux mots précis (mosaïque, fond d'or, auréole, position centrale, de face).
  - 'L''élève explique le message : l''empereur est présenté comme un chef tout-puissant et protégé par Dieu, qui unit pouvoir
    politique et religion.'
  - 'L''élève situe l''œuvre dans son contexte : l''Empire byzantin chrétien du VIe siècle, au début du Moyen Âge.'
  indices:
    relance: Où est placé l'empereur, et qu'a-t-il autour de la tête ?
    methode: Décris d'abord (technique, couleurs, composition), puis interprète (quel message ?), puis situe (où, quand, quel
      empire ?).
    etape: 'Tu peux commencer ainsi : « Cette mosaïque du VIe siècle montre l''empereur Justinien au centre, sur un fond d''or...
      »'
  solution: 'Cette mosaïque du VIe siècle, dans l''église Saint-Vital de Ravenne, montre l''empereur byzantin Justinien au
    centre, de face, sur un fond d''or. Il porte la pourpre, couleur réservée à l''empereur, et une auréole comme un saint.
    Il est entouré de soldats, de sa cour et d''un évêque : il commande à la fois l''armée, l''État et l''Église. Placée dans
    une église, l''image montre que le pouvoir de l''empereur vient de Dieu. Elle illustre l''union du pouvoir et de la religion
    chrétienne au début du Moyen Âge.'
- id: nblm-a-quelle-divinite-le-parthenon-temple-gr-1
  type: choix
  difficulte: 2
  enonce: À quelle divinité le Parthénon, temple grec construit au Ve siècle avant J.-C. sur l'Acropole d'Athènes, est-il
    dédié ?
  reponse:
    options:
    - id: o1
      texte: Athéna
    - id: o2
      texte: Aphrodite
    - id: o3
      texte: Héra
    - id: o4
      texte: Théodora
    bonnes:
    - o1
  indices:
    relance: Pense au nom de la cité grecque dans laquelle ce temple a été construit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o4
    relance: Théodora n'est pas une divinité grecque, mais une impératrice byzantine du VIe siècle associée aux mosaïques
      de Ravenne.
  solution: 'Athéna. C''est exact : le Parthénon est un temple grec dédié à la déesse Athéna.'
- id: nblm-quel-ordre-architectural-caracterise-les-2
  type: choix
  difficulte: 2
  enonce: Quel ordre architectural caractérise les colonnes grecques du Parthénon, reconnaissable à l'absence de base et à
    son chapiteau simple ?
  reponse:
    options:
    - id: o1
      texte: L'ordre dorique
    - id: o2
      texte: L'ordre ionique
    - id: o3
      texte: L'ordre corinthien
    - id: o4
      texte: L'ordre gothique
    bonnes:
    - o1
  indices:
    relance: Il s'agit du plus ancien et du plus simple des trois ordres architecturaux grecs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : l''ordre ionique se distingue par un chapiteau à volutes en spirale.'
  - si:
      contient:
      - o3
    relance: 'Attention : l''ordre corinthien se reconnaît à ses motifs de feuilles d''acanthe sur le chapiteau.'
  - si:
      contient:
      - o4
    relance: 'Erreur d''époque : le gothique est un style architectural du Moyen Âge, pas un ordre grec antique.'
  solution: 'L''ordre dorique. C''est exact : les colonnes du Parthénon suivent l''ordre dorique, caractérisé par un chapiteau
    simple et l''absence de base.'
- id: nblm-quelle-etait-la-fonction-principale-du-c-3
  type: choix
  difficulte: 2
  enonce: Quelle était la fonction principale du Colisée, grand édifice romain inauguré à Rome en 80 après J.-C. ?
  reponse:
    options:
    - id: o1
      texte: Accueillir des spectacles publics comme des combats de gladiateurs
    - id: o2
      texte: Rendre un culte religieux au dieu de la guerre Mars
    - id: o3
      texte: Acheminer l'eau potable jusqu'au centre de la cité
    - id: o4
      texte: Abriter le palais et les appartements de l'empereur
    bonnes:
    - o1
  indices:
    relance: Réfléchis au type de divertissement populaire organisé dans un amphithéâtre de forme ovale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le Colisée est un édifice de spectacle (amphithéâtre) et non un temple religieux.'
  - si:
      contient:
      - o3
    relance: 'Confusion : l''acheminement de l''eau est la fonction d''un aqueduc (comme le pont du Gard), pas d''un amphithéâtre.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : le Colisée est une arène publique pour le divertissement de la population romaine.'
  solution: 'Accueillir des spectacles publics comme des combats de gladiateurs. C''est exact : le Colisée est un amphithéâtre
    conçu pour offrir des spectacles gratuits (combats de gladiateurs, chasses) au peuple.'
- id: nblm-quelle-est-la-definition-d-une-mosaique-4
  type: choix
  difficulte: 2
  enonce: Quelle est la définition d'une mosaïque romaine, un art décoratif très répandu dans l'Antiquité ?
  reponse:
    options:
    - id: o1
      texte: Une image formée par l'assemblage de petits cubes colorés
    - id: o2
      texte: Une peinture murale réalisée directement sur un enduit frais
    - id: o3
      texte: Une sculpture en relief taillée dans un bloc de marbre
    - id: o4
      texte: Une gravure imprimée à partir d'une plaque de cuivre encrée
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi les éléments fragmentés (cubes ou tesselles) qui composent cette décoration au sol ou murale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : une peinture sur enduit frais est la définition d''une fresque.'
  - si:
      contient:
      - o3
    relance: 'Faux : une sculpture se détachant d''un fond est un bas-relief ou haut-relief, pas une mosaïque.'
  - si:
      contient:
      - o4
    relance: 'Faux : cela désigne la technique d''impression de la gravure.'
  solution: 'Une image formée par l''assemblage de petits cubes colorés. C''est exact : la mosaïque est une œuvre réalisée
    en assemblant de petits cubes de pierre, de verre ou de terre cuite.'
- id: nblm-parmi-ces-propositions-laquelle-associe-5
  type: choix
  difficulte: 2
  enonce: Parmi ces propositions, laquelle associe correctement le monument, la civilisation et l'époque ? [1-3]
  reponse:
    options:
    - id: o1
