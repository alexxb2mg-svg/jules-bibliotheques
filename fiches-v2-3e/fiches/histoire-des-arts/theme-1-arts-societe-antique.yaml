      - o4
    relance: 'Incorrect : ces deux édifices datent de l''Antiquité, et non de la période médiévale.'
  solution: 'Le Parthénon est grec (Ve siècle av. J.-C.) et le Colisée est romain (Ier siècle apr. J.-C.). C''est exact :
    le Parthénon appartient à la Grèce antique classique, tandis que le Colisée est un monument de l''Empire romain [1-3].'
- id: nblm-quels-sont-les-deux-elements-sculptes-ou-6
