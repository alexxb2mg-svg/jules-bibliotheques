format: 2
notion: theme-3-sacre-artiste
version: 1
etat: verifiee
declencheurs:
- Léonard de Vinci
- Michel-Ange
- La Joconde
- Naissance de Vénus
- Bible de Gutenberg
- Laurent de Médicis
prerequis:
- nommer-oeuvres-majeures
- theme-2-formes-circulations-medievales
couverture: Couvre les artistes et mécènes italiens du Trecento au Cinquecento, la circulation des styles entre Flandres,
  France et Italie, la perspective, l'imprimerie et la gravure. La musique (motets, madrigaux) et les arts du spectacle ne
  sont présentés que dans l'essentiel, sans exercice dédié.
essentiel: 'Du XIVe au début du XVIIe siècle, l''artiste change de statut : d''artisan anonyme, il devient un créateur admiré,
  qui signe ses œuvres. C''est la Renaissance, née en Italie.


  Les villes italiennes (Florence, Venise, Rome...) sont riches. Des mécènes, comme la famille Médicis à Florence ou les papes
  à Rome, commandent et financent des œuvres pour montrer leur puissance et leur goût. On distingue le Trecento (XIVe siècle),
  le Quattrocento (XVe siècle) et le Cinquecento (XVIe siècle).


  Quelques repères : Giotto peint les fresques de la chapelle Scrovegni à Padoue (vers 1305) ; Brunelleschi élève la coupole
  de la cathédrale de Florence (1420-1436) ; Botticelli peint La Naissance de Vénus (vers 1485) ; Léonard de Vinci commence
  La Joconde vers 1503 ; Michel-Ange sculpte le David (1501-1504) puis peint le plafond de la chapelle Sixtine pour le pape
  Jules II (1508-1512).


  Les artistes redécouvrent l''Antiquité (mythes, corps nus, colonnes) et utilisent la perspective, qui donne l''illusion
  de la profondeur grâce à un point de fuite.


  Les formes circulent : en Flandres, Jan van Eyck peint Les Époux Arnolfini (1434) avec une peinture à l''huile très précise
  ; le roi de France François Ier invite Léonard de Vinci, qui meurt à Amboise en 1519.


  Vers 1455, Gutenberg imprime à Mayence une Bible avec des caractères mobiles : c''est la naissance de l''imprimerie. La
  gravure permet aussi de reproduire une image en de nombreux exemplaires, comme Melencolia I de l''Allemand Albrecht Dürer
  (1514). Les œuvres et les idées circulent plus vite dans toute l''Europe.


  En musique, les compositeurs écrivent des motets (religieux), des chansons et des madrigaux (profanes) à plusieurs voix,
  où la musique suit le sens du poème. Le théâtre et les fêtes de cour se développent.

  '
methode:
- 'Identifier l''œuvre : titre, artiste, ville, date ou siècle.'
- 'Chercher le mécène : qui a commandé ou payé l''œuvre, et pourquoi ?'
- 'Repérer les nouveautés de la Renaissance : perspective, corps inspiré de l''Antiquité, portrait, peinture à l''huile.'
- 'Relier l''œuvre à la circulation des idées : voyages d''artistes, imprimerie, gravure.'
vocabulaire:
- terme: Renaissance
  definition: le renouveau des arts et des idées, né en Italie aux XIVe et XVe siècles, inspiré par l'Antiquité
- terme: mécène
  definition: une personne riche et puissante qui finance et protège des artistes
- terme: perspective
  definition: une technique qui donne l'illusion de la profondeur sur une surface plane, grâce à des lignes qui se rejoignent
    en un point de fuite
- terme: gravure
  definition: une image creusée dans du bois ou du métal, encrée puis imprimée sur papier en plusieurs exemplaires
- terme: fresque
  definition: une peinture faite sur un enduit encore frais, sur un mur ou un plafond
erreurs_frequentes:
- 'Croire que la Renaissance commence avec l''imprimerie : elle commence en Italie dès le XIVe siècle.'
- 'Confondre Léonard de Vinci et Michel-Ange : La Joconde est de Léonard, le David et le plafond de la Sixtine sont de Michel-Ange.'
- 'Oublier le rôle du mécène : sans commande ni argent, pas d''œuvre.'
- 'Confondre gravure et imprimerie : l''imprimerie reproduit surtout des textes, la gravure des images.'
exemple:
  enonce: Explique en trois phrases le rôle d'un mécène à la Renaissance, avec un exemple.
  solution: Un mécène est une personne riche et puissante qui commande et finance des œuvres. Par exemple, le pape Jules II
    commande à Michel-Ange le plafond de la chapelle Sixtine, peint de 1508 à 1512. En finançant des chefs-d'œuvre, le mécène
    montre sa richesse, sa puissance et son goût, et l'artiste gagne en prestige.
exercices:
- id: invention-gutenberg
  type: choix
  difficulte: 1
  enonce: Vers 1455, à Mayence, Gutenberg réalise une Bible grâce à une nouvelle technique. Laquelle ?
  reponse:
    options:
    - id: a
      texte: L'imprimerie à caractères mobiles
    - id: b
      texte: La photographie
    - id: c
      texte: La peinture à fresque
    - id: d
      texte: L'enluminure à la main
    bonnes:
    - a
  indices:
    relance: Cette technique permet de produire beaucoup de livres identiques, bien plus vite qu'avant. Laquelle ?
    methode: Élimine ce qui existait déjà au Moyen Âge, puis ce qui n'existe pas encore au XVe siècle.
    etape: Gutenberg utilise de petites lettres en métal qu'on peut déplacer et réutiliser. Quel nom porte cette technique
      ?
  pieges:
  - si:
      contient:
      - b
    relance: La photographie est inventée au XIXe siècle, quatre siècles plus tard.
  - si:
      contient:
      - d
    relance: L'enluminure décore des manuscrits copiés un par un à la main. Gutenberg invente justement autre chose.
  - si:
      contient:
      - c
    relance: La fresque est une peinture murale. On parle ici de fabriquer des livres.
  solution: 'Gutenberg imprime la Bible vers 1455 grâce à l''imprimerie à caractères mobiles : des lettres en métal qu''on
    assemble, encre et réutilise. Les livres deviennent plus nombreux et moins chers.'
- id: oeuvre-artiste
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à son artiste.
  reponse:
    gauche:
    - id: a
      texte: La Naissance de Vénus (vers 1485)
    - id: b
      texte: Le David, statue de marbre (1501-1504)
    - id: c
      texte: La Joconde (commencée vers 1503)
    - id: d
      texte: Les Époux Arnolfini (1434)
    - id: e
      texte: Melencolia I, gravure (1514)
    droite:
    - id: v
      texte: Sandro Botticelli
    - id: w
      texte: Michel-Ange
    - id: x
      texte: Léonard de Vinci
    - id: y
      texte: Jan van Eyck
    - id: z
      texte: Albrecht Dürer
    paires:
      a: v
      b: w
      c: x
      d: y
      e: z
  indices:
    relance: Quel artiste est surtout connu comme sculpteur ? Lesquels ne sont pas italiens ?
    methode: Place d'abord les deux artistes du Nord (un Flamand, un Allemand), puis les trois Italiens.
    etape: La gravure est une spécialité de l'Allemand Dürer ; le Flamand van Eyck est un maître de la peinture à l'huile.
      Reste à départager les trois Florentins.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier les œuvres des artistes italiens.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : Melencolia I est une gravure, faite par un artiste allemand.'
  solution: 'La Naissance de Vénus : Botticelli. Le David : Michel-Ange. La Joconde : Léonard de Vinci. Les Époux Arnolfini
    : Jan van Eyck. Melencolia I : Albrecht Dürer.'
- id: chronologie-renaissance
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: giotto
      texte: Les fresques de Giotto dans la chapelle Scrovegni à Padoue
    - id: coupole
      texte: La coupole de la cathédrale de Florence, par Brunelleschi
    - id: gutenberg
      texte: La Bible imprimée par Gutenberg
    - id: sixtine
      texte: Le plafond de la chapelle Sixtine, par Michel-Ange
  indices:
    relance: Laquelle de ces œuvres appartient au Trecento, le XIVe siècle ?
    methode: Donne un siècle ou une date à chaque œuvre, puis range-les.
    etape: Les fresques de Giotto datent du tout début du XIVe siècle ; le plafond de la Sixtine date du début du XVIe. Range
      les deux œuvres du XVe siècle entre elles.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux œuvres voisines sont inversées. Laquelle des deux est la plus ancienne ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par l'œuvre du Trecento et finis par celle du Cinquecento.
  solution: Fresques de Giotto (vers 1305), coupole de Brunelleschi (1420-1436), Bible de Gutenberg (vers 1455), plafond de
    la Sixtine (1508-1512).
- id: mot-mecene
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une personne riche et puissante, comme Laurent de Médicis ou le pape Jules II, qui finance
    et protège des artistes ?
  reponse:
    acceptees:
    - mécène
    - mécènes
    fautes_tolerees: 0
  indices:
    relance: Ce mot vient du nom d'un Romain de l'Antiquité, ami des poètes et protecteur des arts.
    methode: Cherche un nom commun de six lettres pour « celui qui paie les artistes ».
    etape: Le mot commence par « méc- ».
  pieges:
  - si:
      valeur: commanditaire
    relance: Un commanditaire commande une œuvre. Quel mot désigne celui qui protège et finance les artistes de façon durable
      ?
  - si:
      valeur: roi
    relance: Un roi peut jouer ce rôle, mais ce n'est pas obligatoire. Quel mot désigne ce protecteur des arts ?
  solution: 'Un mécène : une personne riche qui finance et protège des artistes, comme les Médicis à Florence ou le pape Jules
    II à Rome.'
- id: mot-perspective
  type: texte_court
  difficulte: 2
  enonce: Quelle technique, mise au point à Florence au XVe siècle, donne l'illusion de la profondeur sur une surface plane,
    avec des lignes qui se rejoignent en un point de fuite ?
  reponse:
    acceptees:
    - perspective
    - perspective linéaire
    - perspective géométrique
    fautes_tolerees: 1
  indices:
    relance: Sur un tableau de la Renaissance, les dalles du sol semblent s'éloigner vers le fond. Comment s'appelle ce procédé
      ?
    methode: 'Pense au vocabulaire des arts plastiques : ligne d''horizon, point de fuite, profondeur...'
    etape: Le mot commence par « pers- ».
  pieges:
  - si:
      valeur: trompe-l'œil
    relance: Le trompe-l'œil utilise ce procédé, mais c'est un effet. Quel mot désigne la technique avec un point de fuite
      ?
  - si:
      valeur: relief
    relance: Le relief concerne la sculpture ou les ombres. Quel mot désigne la construction avec un point de fuite ?
  solution: 'La perspective : les lignes fuyantes se rejoignent en un point de fuite et donnent l''illusion de la profondeur.
    Brunelleschi et Alberti la mettent au point à Florence au XVe siècle.'
- id: analyse-david
  type: ouverte
  difficulte: 3
  enonce: Voici une œuvre décrite. Le David de Michel-Ange est une statue de marbre de plus de cinq mètres, sculptée à Florence
    de 1501 à 1504. Elle représente le jeune héros biblique, nu, debout, le regard concentré, juste avant son combat contre
    le géant Goliath. En 1504, elle est installée devant le palais du gouvernement de la ville. Décris cette œuvre et explique
    pourquoi elle est typique de la Renaissance, en la reliant à son contexte.
  criteres:
  - L'élève décrit l'œuvre avec des mots précis (statue, marbre, nu, taille monumentale, attitude).
  - 'L''élève relie l''œuvre à la Renaissance : modèle antique du corps nu idéal, artiste célèbre, commande d''une cité riche.'
  - 'L''élève explique le sens politique : le petit David qui défie le géant symbolise Florence, prête à défendre sa liberté.'
  indices:
    relance: Pourquoi placer un héros qui a vaincu un géant devant le palais du gouvernement ?
    methode: Décris d'abord la statue, puis cherche ce qui vient de l'Antiquité, puis explique son message pour les Florentins.
    etape: 'Tu peux commencer ainsi : « Le David est une statue de marbre sculptée par Michel-Ange à Florence entre 1501 et
      1504... »'
  solution: 'Le David est une statue de marbre de plus de cinq mètres sculptée par Michel-Ange à Florence entre 1501 et 1504.
    Le héros est représenté nu, avec un corps idéal et puissant, comme les statues de l''Antiquité que les artistes de la
    Renaissance admirent. Il est concentré, juste avant d''affronter Goliath. Placé devant le palais du gouvernement, il symbolise
    Florence, petite cité riche et libre, prête à se défendre contre des ennemis plus puissants. L''œuvre rend aussi Michel-Ange
    célèbre : l''artiste devient une personnalité admirée.'
