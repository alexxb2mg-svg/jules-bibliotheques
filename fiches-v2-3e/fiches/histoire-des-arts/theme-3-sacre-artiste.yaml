    relance: 'Erreur : les commandes religieuses émanant de l''Église et des papes restent très importantes.'
  solution: 'L''artiste passe du statut d''artisan anonyme à celui de créateur admiré qui signe ses œuvres ; L''utilisation
    de la perspective pour donner l''illusion de la profondeur. C''est exact : l''artiste quitte l''anonymat du Moyen Âge
    pour devenir un créateur célébré.'
- id: nblm-comment-appelle-t-on-une-personne-riche-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une personne riche et puissante, comme Laurent de Médicis à Florence, qui finance et protège
    les artistes ?
  reponse:
    acceptees:
    - mécène
    fautes_tolerees: 1
  indices:
    relance: Cherche le terme spécifique désignant un protecteur et commanditaire financier des arts.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'mécène. C''est exact : un mécène est une personne fortunée qui finance et protège les artistes.'
- id: nblm-quelle-technique-elaboree-a-la-renaissan-8
  type: texte_court
  difficulte: 1
  enonce: Quelle technique élaborée à la Renaissance permet de donner l'illusion de la profondeur grâce à des lignes se rejoignant
    en un point de fuite ?
  reponse:
    acceptees:
    - la perspective
    fautes_tolerees: 1
  indices:
    relance: Pense au procédé géométrique utilisé par les peintres pour créer l'illusion de la 3D.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'la perspective. C''est exact : la perspective est la technique de représentation géométrique de la profondeur
    sur une surface plane.'
- id: mot-madrigal
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qu'un madrigal à la Renaissance ?
  reponse:
    options:
    - id: a
      texte: Une chanson profane à plusieurs voix
    - id: b
      texte: Un chant religieux à plusieurs voix
    - id: c
      texte: Une sculpture en marbre
    - id: d
      texte: Une image gravée sur une plaque de métal
    bonnes:
    - a
  indices:
    relance: Le madrigal appartient au domaine de la musique. Est-il religieux ou non ?
    methode: Compare avec le motet, l'œuvre religieuse à plusieurs voix, et élimine ce qui n'est pas de la musique.
    etape: Deux options ne sont pas de la musique. Parmi les deux autres, choisis celle qui n'est pas religieuse.
  pieges:
  - si:
      contient:
      - b
    relance: C'est la définition du motet. Le madrigal, lui, n'est pas religieux.
  - si:
      contient:
      - c
    relance: Une sculpture est une œuvre d'art de l'espace, pas de la musique.
  - si:
      contient:
      - d
    relance: C'est une gravure, pas de la musique.
  solution: Un madrigal est une chanson profane à plusieurs voix ; le motet est l'équivalent religieux.
- id: mot-quattrocento
  type: texte_court
  difficulte: 2
  enonce: Comment nomme-t-on en italien le XVe siècle, celui de Brunelleschi et de Botticelli ?
  reponse:
    acceptees:
    - Quattrocento
    fautes_tolerees: 2
  indices:
    relance: Ces noms viennent du nombre de centaines d'années, en italien.
    methode: Le XVe siècle correspond aux années 1400. « Quattro » veut dire « quatre ».
    etape: Le mot commence par « Quattro- » et se termine par « -cento ».
  pieges:
  - si:
      valeur: Trecento
    relance: Le Trecento est le XIVe siècle (les années 1300). Quel mot désigne les années 1400 ?
  - si:
      valeur: Cinquecento
    relance: Le Cinquecento est le XVIe siècle (les années 1500). Quel mot désigne les années 1400 ?
  solution: 'Quattrocento : le XVe siècle italien (années 1400).'
