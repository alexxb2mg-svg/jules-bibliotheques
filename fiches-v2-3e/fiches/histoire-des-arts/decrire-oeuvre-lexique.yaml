# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: decrire-oeuvre-lexique
version: 3
etat: verifiee
declencheurs:
- premier plan
- arrière-plan
- contre-plongée
- nature morte
- décrire un tableau
- lignes de fuite du tableau
- perspective d'un tableau
- ronde-bosse et bas-relief
- décrire la technique d'un tableau
prerequis:
- 4e-decrire-oeuvre-lexique
essentiel: 'Décrire une œuvre, c''est dire ce que l''on voit, avec des mots précis, avant de chercher ce qu''elle veut dire.


  On commence par sa « carte d''identité » : titre, artiste, date, technique et lieu de conservation. Techniques courantes
  : huile sur toile, fresque (peinture sur un mur recouvert d''un enduit frais), mosaïque (petits cubes colorés), photographie,
  gravure. En sculpture, la ronde-bosse est une statue que l''on peut voir sous tous les angles, et le bas-relief est une
  sculpture en faible saillie sur un fond. Le marbre et le bronze sont deux matériaux fréquents.


  On précise ensuite le genre : portrait (une personne), paysage (un lieu, la nature), nature morte (des objets, des fruits,
  des fleurs), scène d''histoire ou scène religieuse.


  On décrit l''espace plan par plan : le premier plan (le plus proche, en bas de l''image), le second plan, puis l''arrière-plan
  (le fond). La perspective donne l''illusion de la profondeur ; ses lignes se rejoignent en un point de fuite.


  On décrit la composition : lignes de force (verticales, horizontales, diagonales), formes géométriques (triangle, pyramide),
  centre de l''image. Puis les couleurs (chaudes ou froides, contrastes), la lumière et le point de vue : en plongée, on voit
  d''en haut ; en contre-plongée, on voit d''en bas et le sujet paraît plus grand.


  Les éléments observés (technique, style, sujet) aident à rattacher l''œuvre à une époque et à une civilisation. Par exemple,
  des hiéroglyphes renvoient à l''Égypte antique, des vitraux et des arcs brisés à l''art gothique du Moyen Âge.


  Ce qu''on attend au brevet : une description organisée, avec du vocabulaire précis, qui ne donne pas encore d''interprétation.

  '
methode:
- 'Présenter l''œuvre : titre, artiste, date, technique, lieu de conservation.'
- Nommer le genre de l'œuvre (portrait, paysage, nature morte, scène d'histoire…).
- Décrire l'espace plan par plan, du premier plan à l'arrière-plan.
- Décrire la composition (lignes de force, formes, centre), puis les couleurs et la lumière.
- Utiliser les indices observés pour situer l'œuvre dans une époque.
- Pour une sculpture, préciser le matériau et si elle est en ronde-bosse ou en bas-relief.
vocabulaire:
- terme: premier plan
  definition: la partie de l'image la plus proche du spectateur, en général en bas
- terme: arrière-plan
  definition: la partie de l'image la plus éloignée, le fond
- terme: composition
  definition: la manière dont l'artiste organise les formes, les lignes et les couleurs dans l'image
- terme: ligne de force
  definition: une ligne (réelle ou imaginaire) qui guide le regard dans l'image
- terme: point de fuite
  definition: le point où se rejoignent les lignes de la perspective, qui donne l'illusion de la profondeur
- terme: contre-plongée
  definition: un point de vue d'en bas vers le haut, qui grandit le sujet
- terme: nature morte
  definition: une œuvre qui représente des objets inanimés (fruits, vases, fleurs coupées…)
- terme: perspective
  definition: la technique qui donne l'illusion de la profondeur sur une surface plane
- terme: bas-relief
  definition: une sculpture en faible saillie sur un fond, comme sur une frise
- terme: ronde-bosse
  definition: une sculpture que l'on peut contourner et voir sous tous les angles
erreurs_frequentes:
- Donner son avis ou le sens de l'œuvre avant de l'avoir décrite.
- Décrire au hasard, sans ordre, au lieu d'aller plan par plan.
- Confondre plongée (vue d'en haut) et contre-plongée (vue d'en bas).
- Employer des mots vagues (« il y a des gens ») au lieu du vocabulaire précis (personnages au premier plan, diagonale…).
exemple:
  enonce: Décris en quelques phrases le début de La Liberté guidant le peuple d'Eugène Delacroix.
  solution: La Liberté guidant le peuple est une huile sur toile peinte par Eugène Delacroix en 1830, conservée au musée du
    Louvre. C'est une scène d'histoire. Au premier plan, des corps sont étendus au sol. Au centre, une femme coiffée d'un
    bonnet rouge brandit un drapeau tricolore et avance sur une barricade, entourée d'insurgés. À l'arrière-plan, à droite,
    on devine les tours de Notre-Dame dans la fumée. La composition forme une pyramide dont le drapeau est le sommet.
exercices:
- id: nom-premier-plan
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la partie d'un tableau la plus proche du spectateur, en général en bas de l'image ?
  reponse:
    acceptees:
    - premier plan
    fautes_tolerees: 1
  indices:
    relance: Imagine que le tableau est une scène de théâtre. Quelle partie est la plus près de toi ?
    methode: On découpe l'espace d'un tableau en couches successives, numérotées depuis le bas de l'image jusqu'au fond.
    etape: 'C''est la couche numéro un : un nombre ordinal suivi du mot « plan ».'
  pieges:
  - si:
      valeur: arrière-plan
    relance: L'arrière-plan, c'est le fond, la partie la plus éloignée. Cherche la partie la plus proche de toi.
  - si:
      valeur: second plan
    relance: Le second plan est au milieu. Quelle partie vient avant lui, tout près de toi ?
  solution: 'Le premier plan : c''est la partie la plus proche du spectateur. Viennent ensuite le second plan, puis l''arrière-plan.'
- id: genre-nature-morte
  type: texte_court
  difficulte: 2
  enonce: Un peintre représente sur une table des fruits, un pichet et un couteau, sans aucun personnage. Quel est le genre
    de ce tableau ?
  reponse:
    acceptees:
    - nature morte
    fautes_tolerees: 1
  indices:
    relance: Y a-t-il une personne ou un lieu à représenter ici, ou seulement des objets ?
    methode: Les genres principaux sont le portrait, le paysage, la scène d'histoire et un genre réservé aux objets inanimés.
    etape: Le nom de ce genre dit que les objets représentés ne bougent pas, qu'ils sont sans vie.
  pieges:
  - si:
      valeur: paysage
    relance: Un paysage représente un lieu, la nature. Ici, on ne voit que des objets posés sur une table.
  - si:
      valeur: portrait
    relance: Un portrait représente une personne. Or il n'y a aucun personnage dans ce tableau.
  solution: 'C''est une nature morte : un tableau qui représente des objets inanimés (fruits, vaisselle, fleurs coupées…).'
- id: point-de-vue-bas
  type: texte_court
  difficulte: 2
  enonce: 'Un photographe se place en bas et vise vers le haut : le monument photographié paraît immense et imposant. Comment
    s''appelle ce point de vue ?'
  reponse:
    acceptees:
    - contre-plongée
    - contreplongée
    fautes_tolerees: 1
  indices:
    relance: D'où regarde le photographe, d'en haut ou d'en bas ?
    methode: La plongée désigne une vue d'en haut vers le bas. Le point de vue inverse porte le même nom, avec un mot en plus
      devant.
    etape: Le mot ajouté devant « plongée » veut dire « à l'opposé ».
  pieges:
  - si:
      valeur: plongée
    relance: La plongée, c'est une vue d'en haut vers le bas. Ici, l'appareil est placé en dessous du sujet. Quel mot faut-il
      ajouter ?
  - si:
      valeur: perspective
    relance: La perspective donne l'illusion de la profondeur. On cherche ici le nom du point de vue d'en bas vers le haut.
  solution: 'C''est une contre-plongée : on regarde le sujet d''en bas, ce qui le fait paraître plus grand et plus puissant.'
- id: description-ou-interpretation
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases sur La Liberté guidant le peuple (Delacroix, 1830) est une description, et non une interprétation
    ?
  reponse:
    options:
    - id: a
      texte: Au centre, une femme tient un drapeau tricolore dans sa main levée.
    - id: b
      texte: Delacroix veut montrer que le peuple a raison de se révolter.
    - id: c
      texte: La femme est un symbole de la France qui se libère.
    - id: d
      texte: Le tableau donne une impression d'élan et d'espoir.
    bonnes:
    - a
  indices:
    relance: Quelle phrase dit seulement ce que l'on voit, sans donner d'avis ni de sens ?
    methode: 'Pour chaque phrase, demande-toi : un autre spectateur pourrait-il la contester ? Une description se vérifie
      en regardant le tableau.'
    etape: Les mots « veut montrer », « symbole » et « impression » expriment un sens ou un ressenti. Écarte ces phrases.
  pieges:
  - si:
      contient:
      - b
    relance: Tu donnes ici l'intention de l'artiste. Peut-on la voir directement sur la toile ?
  - si:
      contient:
      - c
    relance: Un symbole, c'est déjà un sens que l'on donne. Cherche une phrase qui dit seulement ce que l'on voit.
  - si:
      contient:
      - d
    relance: Une impression est un ressenti personnel. Quelle phrase peut se vérifier en regardant l'image ?
  solution: 'La phrase a est une description : on peut vérifier en regardant la toile qu''une femme tient un drapeau tricolore
    au centre. Les autres phrases interprètent (intention de l''artiste, symbole) ou expriment un ressenti.'
- id: indices-epoques
  type: association
  difficulte: 2
  enonce: Relie chaque ensemble d'indices observés à l'époque de l'œuvre.
  reponse:
    gauche:
    - id: a
      texte: Hiéroglyphes, personnages représentés de profil, peinture sur les murs d'un tombeau
    - id: b
      texte: Vitraux colorés, arcs brisés, sculptures de saints au portail d'une cathédrale
    - id: c
      texte: Perspective avec un point de fuite, peinture à l'huile, sujets religieux et antiques
    - id: d
      texte: Touches rapides de couleurs pures, scène en plein air, lumière changeante
    droite:
    - id: w
      texte: Égypte antique
    - id: x
      texte: Moyen Âge (art gothique)
    - id: y
      texte: Renaissance (XVe-XVIe siècles)
    - id: z
      texte: Impressionnisme (fin du XIXe siècle)
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Quel indice te semble le plus facile à reconnaître ? Commence par lui.
    methode: Pour chaque ligne, repère l'indice le plus caractéristique (une écriture, un type de bâtiment, une technique),
      puis cherche l'époque qui lui correspond.
    etape: Les hiéroglyphes sont l'écriture d'une civilisation antique du bord du Nil. Place-la, puis continue avec les cathédrales.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare les deux dernières lignes, laquelle parle de peinture en plein air
      ?
  - si:
      diagnostic: associations_fausses
    relance: Range d'abord les époques dans l'ordre du temps, puis cherche pour chacune l'indice qui lui correspond.
  solution: 'Hiéroglyphes et profils : Égypte antique. Vitraux et arcs brisés : Moyen Âge gothique. Perspective et peinture
    à l''huile : Renaissance. Touches rapides en plein air : impressionnisme.'
- id: decrire-radeau
  type: ouverte
  difficulte: 3
  enonce: Voici une présentation du Radeau de la Méduse, huile sur toile de Théodore Géricault (1818-1819), conservée au musée
    du Louvre. Le tableau montre les survivants du naufrage de la frégate la Méduse (1816), entassés sur un radeau. En bas,
    des corps sans vie glissent dans l'eau. Au-dessus, des hommes se redressent les uns sur les autres ; tout en haut à droite,
    l'un d'eux agite un tissu vers un minuscule navire à l'horizon. Le ciel est sombre, les couleurs sont brunes et terreuses.
    À partir de ces éléments, rédige une description organisée de 5 à 6 phrases, en employant le vocabulaire de la description.
  criteres:
  - L'élève présente l'œuvre (titre, artiste, date, technique, lieu de conservation).
  - L'élève organise sa description par plans ou suit une direction précise (du bas vers le haut, du premier plan à l'horizon).
  - L'élève emploie au moins trois mots du lexique (premier plan, arrière-plan, composition, diagonale, pyramide, couleurs
    sombres…) et ne donne pas encore d'interprétation.
  indices:
    relance: Par quoi commence-t-on toujours avant de décrire ce que l'on voit ?
    methode: Présente l'œuvre, puis décris en partant du bas (les corps) vers le haut (l'homme qui agite le tissu), et termine
      par les couleurs.
    etape: Tu peux commencer par « Le Radeau de la Méduse est une huile sur toile peinte par Théodore Géricault… », puis continuer
      avec le premier plan.
  solution: 'Le Radeau de la Méduse est une huile sur toile de Théodore Géricault (1818-1819), conservée au Louvre. C''est
    une scène d''histoire qui représente les survivants d''un naufrage. Au premier plan, des corps sans vie glissent dans
    l''eau. Au centre, des hommes se redressent les uns sur les autres : la composition monte en pyramide du bas à gauche
    vers le haut à droite. Au sommet, un homme agite un tissu vers un minuscule navire à l''horizon, à l''arrière-plan. Les
    couleurs sont sombres, brunes et terreuses, sous un ciel menaçant.'
- id: nblm-lorsqu-on-cherche-a-decrire-un-tableau-d-1
  type: choix
  difficulte: 2
  enonce: Lorsqu'on cherche à décrire un tableau de manière méthodique, dans quel ordre convient-il de présenter les différents
    plans de l'espace ?
  reponse:
    options:
    - id: o1
      texte: Du premier plan à l'arrière-plan.
    - id: o2
      texte: De l'arrière-plan au premier plan.
    - id: o3
      texte: Au hasard selon les éléments qui attirent le regard.
    - id: o4
      texte: En donnant d'abord son interprétation personnelle du fond de la toile.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la démarche ordonnée qui part du niveau le plus proche du spectateur vers le fond.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur de méthode : commencer par le fond risque de faire manquer l''organisation d''ensemble qui
      part du sujet principal.'
  - si:
      contient:
      - o3
    relance: 'C''est l''erreur fréquente signalée par la fiche : décrire au hasard au lieu d''avancer de façon ordonnée plan
      par plan.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : la méthode précise qu''il faut décrire objectivement ce que l''on voit avant d''interpréter
      le sens ou de donner son avis.'
  solution: 'Du premier plan à l''arrière-plan. C''est exact : la méthode demande de décrire l''espace plan par plan, en allant
    du premier plan (le plus proche) vers l''arrière-plan (le fond).'
- id: nblm-selon-le-vocabulaire-d-analyse-d-une-uvr-2
  type: choix
  difficulte: 2
  enonce: Selon le vocabulaire d'analyse d'une œuvre, comment se définit précisément le genre de la nature morte ?
  reponse:
    options:
    - id: o1
      texte: Une œuvre qui représente des objets inanimés comme des fruits, des vases ou des fleurs coupées.
    - id: o2
      texte: Un tableau représentant le portrait d'une personne réelle identifiée.
    - id: o3
      texte: Un tableau représentant un espace naturel ou un paysage urbain.
    - id: o4
      texte: Une peinture illustrant un événement historique ou une scène de bataille.
    bonnes:
    - o1
  indices:
    relance: Ce genre pictural se caractérise par la représentation de sujets inanimés du quotidien.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est la définition du genre du portrait, et non de la nature morte.
  - si:
      contient:
      - o3
    relance: C'est la définition du genre du paysage.
  - si:
      contient:
      - o4
    relance: Il s'agit d'une scène d'histoire (ou peinture d'histoire), pas d'une nature morte.
  solution: 'Une œuvre qui représente des objets inanimés comme des fruits, des vases ou des fleurs coupées. C''est exact
    : la nature morte est définie comme la représentation d''objets inanimés.'
- id: nblm-quel-est-l-effet-produit-par-un-point-de-3
  type: choix
  difficulte: 2
  enonce: Quel est l'effet produit par un point de vue en contre-plongée lors de la description d'une œuvre ?
  reponse:
    options:
    - id: o1
      texte: Elle montre le sujet d'en bas vers le haut, ce qui le grandit ou lui donne de la puissance.
    - id: o2
      texte: Elle montre le sujet d'en haut vers le bas, ce qui le rend petit ou écrasé.
    - id: o3
      texte: Elle place l'œil du spectateur à la même hauteur exacte que le sujet.
    - id: o4
      texte: Elle annule toute impression de profondeur dans le tableau.
    bonnes:
    - o1
  indices:
    relance: 'Pense au sens de la prise de vue : le regard se dirige du bas vers le haut.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention à l''erreur fréquente de confusion : la vue d''en haut vers le bas s''appelle la plongée.'
  - si:
      contient:
      - o3
    relance: C'est une prise de vue neutre à hauteur d'yeux, et non une contre-plongée.
  - si:
      contient:
      - o4
    relance: L'angle de vue modifie la perception de la taille et de la puissance du sujet, il n'efface pas la profondeur.
  solution: 'Elle montre le sujet d''en bas vers le haut, ce qui le grandit ou lui donne de la puissance. C''est exact : la
    contre-plongée est un point de vue d''en bas vers le haut qui donne l''impression de grandir le sujet.'
- id: nblm-quelle-est-la-toute-premiere-etape-preco-4
  type: choix
  difficulte: 2
  enonce: Quelle est la toute première étape préconisée pour décrire un tableau ?
  reponse:
    options:
    - id: o1
      texte: Présenter sa « carte d'identité » (titre, artiste, date, technique, lieu de conservation).
    - id: o2
      texte: Rédiger directement sa critique personnelle pour dire si l'œuvre est réussie.
    - id: o3
      texte: Interpréter immédiatement le sens caché et les symboles du tableau.
    - id: o4
      texte: Décrire les détails secondaires en ignorant le nom du peintre.
    bonnes:
    - o1
  indices:
    relance: Il s'agit des éléments fondamentaux d'identification figurant sur le cartel d'un musée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est l''erreur fréquente indiquée dans la fiche : donner son opinion avant d''avoir présenté et décrit l''œuvre.'
  - si:
      contient:
      - o3
    relance: L'interprétation constitue l'étape finale, qui vient après la description objective et l'analyse.
  - si:
      contient:
      - o4
    relance: Il est indispensable d'identifier clairement l'œuvre et son auteur dès le début.
  solution: 'Présenter sa « carte d''identité » (titre, artiste, date, technique, lieu de conservation). C''est exact : toute
    description méthodique commence par donner la carte d''identité de l''œuvre.'
- id: nblm-comment-nomme-t-on-le-point-geometrique-5
  type: choix
  difficulte: 2
  enonce: Comment nomme-t-on le point géométrique où se rejoignent les lignes de la perspective dans un tableau ?
  reponse:
    options:
    - id: o1
      texte: Le point de fuite.
    - id: o2
      texte: Le premier plan.
    - id: o3
      texte: La ligne de force.
    - id: o4
      texte: La contre-plongée.
    bonnes:
    - o1
  indices:
    relance: Ce terme désigne l'endroit où convergent les lignes guidant le regard vers la profondeur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le premier plan désigne la zone visuelle la plus proche du spectateur, pas le point de convergence.
  - si:
      contient:
      - o4
    relance: La contre-plongée est un point de vue orienté du bas vers le haut, et non un point géométrique sur la toile.
  solution: 'Le point de fuite. C''est exact : la fiche définit le point de fuite comme le point où se rejoignent les lignes
    de la perspective.'
- id: nblm-quels-elements-font-partie-de-la-descrip-6
  type: choix
  difficulte: 3
  enonce: Quels éléments font partie de la description de la composition d'un tableau ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Les lignes de force (verticales, horizontales, diagonales).
    - id: o2
      texte: Les formes géométriques de la structure (triangle, pyramide).
    - id: o3
      texte: Le prix d'achat du tableau par le musée.
    - id: o4
      texte: La marque des pinceaux employés par l'artiste.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les éléments qui décrivent la structure géométrique et l'organisation visuelle de l'image.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: La valeur financière d'une œuvre ne constitue pas un élément visuel de sa composition.
  - si:
      contient:
      - o4
    relance: La marque du matériel n'est pas un élément d'organisation visuelle de l'image.
  solution: 'Les lignes de force (verticales, horizontales, diagonales) ; Les formes géométriques de la structure (triangle,
    pyramide). C''est exact : la fiche indique que l''on décrit les lignes de force qui guident le regard.'
- id: nblm-quel-terme-designe-la-partie-de-l-image-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne la partie de l'image la plus éloignée du spectateur, qui constitue le fond d'un tableau ?
  reponse:
    acceptees:
    - arrière-plan
    fautes_tolerees: 1
  indices:
    relance: Ce mot composé désignant le fond s'oppose au premier plan.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'arrière-plan. C''est exact : l''arrière-plan désigne la partie de l''image la plus éloignée, c''est-à-dire le
    fond.'
