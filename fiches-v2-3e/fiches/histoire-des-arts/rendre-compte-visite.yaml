# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: rendre-compte-visite
version: 3
etat: verifiee
declencheurs:
- sortie scolaire au musée
- compte rendu de visite
- conservateur de musée
- restaurateur de tableaux
- guide-conférencier
- lieu de conservation
- visite d'un musée
- rencontre avec un professionnel
- métier du patrimoine
prerequis:
- decrire-oeuvre-lexique
essentiel: 'Le programme demande de savoir rendre compte d''une visite : un lieu de conservation (musée, archives, bibliothèque,
  monument, site archéologique) ou un lieu de diffusion (théâtre, salle de concert, opéra, cinéma), ou bien la rencontre avec
  un métier du patrimoine.


  Le patrimoine, ce sont les biens hérités du passé que l''on protège pour les transmettre : œuvres, monuments, objets, documents.
  Un lieu de conservation garde et protège ; un lieu de diffusion présente au public.


  Quelques métiers du patrimoine. Le conservateur étudie et gère les collections d''un musée, choisit les œuvres à acquérir
  et prépare les expositions. Le restaurateur soigne les œuvres abîmées sans les transformer. Le guide-conférencier (ou médiateur)
  fait découvrir un lieu au public. L''archéologue fouille le sol pour retrouver les traces du passé. Le régisseur organise
  le transport et le rangement des œuvres.


  Un compte rendu suit un plan simple. D''abord, présenter le lieu et les circonstances : nom, ville, date, type de lieu,
  avec qui. Ensuite, rendre compte du contenu : une ou deux œuvres décrites précisément, ce que l''on a appris sur le lieu
  ou sur le métier. Enfin, conclure par un avis personnel argumenté.


  On écrit au passé (« nous avons visité… ») et on justifie son avis par des détails précis, pas par « c''était bien ». On
  choisit ce qui a le plus marqué : mieux vaut décrire une œuvre en détail que les citer toutes.


  Exemple de début : « Le 12 mars, ma classe a visité le musée des Beaux-Arts de notre ville, un lieu de conservation. »


  Ce qu''on attend au brevet : un compte rendu organisé, précis sur le lieu ou le métier, avec un vocabulaire juste et un
  avis justifié.

  '
methode:
- 'Présenter le lieu : nom, ville, date de la visite, type de lieu (conservation ou diffusion).'
- Rendre compte du contenu en décrivant précisément une ou deux œuvres, ou le métier rencontré.
- Dire ce que la visite ou la rencontre t'a appris.
- Conclure par un avis personnel justifié par un détail précis.
- Écrire au passé (« nous avons visité… ») et choisir une ou deux œuvres seulement pour les décrire en détail.
vocabulaire:
- terme: lieu de conservation
  definition: un lieu qui garde et protège des œuvres ou des documents (musée, archives, bibliothèque)
- terme: lieu de diffusion
  definition: un lieu où l'on présente des œuvres au public (théâtre, salle de concert, cinéma, opéra)
- terme: patrimoine
  definition: l'ensemble des biens (œuvres, monuments, objets) hérités du passé et que l'on protège
- terme: collection
  definition: l'ensemble des œuvres que possède un musée
- terme: conservateur
  definition: le professionnel qui étudie, gère et fait connaître les collections d'un musée
- terme: restaurateur
  definition: le professionnel qui soigne les œuvres abîmées sans les transformer
- terme: guide-conférencier
  definition: le professionnel qui fait découvrir un lieu ou des œuvres au public
- terme: archéologue
  definition: le professionnel qui fouille le sol pour retrouver les traces du passé
erreurs_frequentes:
- Raconter la journée (le trajet, le pique-nique) au lieu de parler des œuvres et du lieu.
- Oublier de présenter le lieu (nom, ville, date).
- 'Donner un avis sans le justifier : « c''était bien », « c''était long ».'
- Confondre le conservateur (qui gère les collections) et le restaurateur (qui soigne les œuvres).
exemple:
  enonce: Rédige le début d'un compte rendu de visite au musée du Louvre.
  solution: 'Le 14 mars, ma classe a visité le musée du Louvre, à Paris, un des plus grands musées du monde, installé dans
    un ancien palais royal. Une guide-conférencière nous a présenté les grandes peintures françaises du XIXe siècle. L''œuvre
    qui m''a le plus marqué est Le Radeau de la Méduse de Théodore Géricault (1818-1819) : ses personnages sont presque grandeur
    nature, et l''on a l''impression d''être sur le radeau avec les naufragés.'
exercices:
- id: metiers-patrimoine
  type: association
  difficulte: 1
  enonce: Relie chaque métier du patrimoine à son rôle.
  reponse:
    gauche:
    - id: a
      texte: Conservateur
    - id: b
      texte: Restaurateur
    - id: c
      texte: Guide-conférencier
    - id: d
      texte: Archéologue
    droite:
    - id: w
      texte: Étudie et gère les collections d'un musée, prépare les expositions
    - id: x
      texte: Soigne et répare les œuvres abîmées sans les transformer
    - id: y
      texte: Fait découvrir un lieu ou des œuvres au public
    - id: z
      texte: Fouille le sol pour retrouver les traces du passé
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Quel métier as-tu déjà rencontré lors d'une visite, en suivant un groupe ?
    methode: Cherche dans chaque nom de métier un verbe caché (conserver, restaurer, guider…), puis relie-le à l'action qui
      lui correspond.
    etape: « Restaurer », c'est remettre en bon état. Quelle ligne parle de réparer ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie le conservateur et le restaurateur, qu'on confond souvent.
  - si:
      diagnostic: associations_fausses
    relance: Cherche le verbe caché dans chaque nom de métier, puis relie-le à son action.
  solution: 'Conservateur : étudie et gère les collections. Restaurateur : soigne les œuvres abîmées. Guide-conférencier :
    fait découvrir un lieu au public. Archéologue : fouille le sol.'
- id: plan-compte-rendu
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les trois parties d'un compte rendu de visite.
  reponse:
    elements:
    - id: presenter
      texte: 'Présenter le lieu et les circonstances : nom, ville, date'
    - id: contenu
      texte: Décrire une ou deux œuvres vues et ce que l'on a appris
    - id: avis
      texte: Conclure par un avis personnel argumenté
  indices:
    relance: Ton lecteur n'était pas avec toi. Que doit-il savoir en premier ?
    methode: Un compte rendu va des informations pratiques vers le contenu, puis vers ton jugement.
    etape: L'avis personnel ne peut être justifié que si le lecteur connaît déjà les œuvres dont tu parles.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux parties voisines sont inversées. Laquelle a besoin de l'autre pour être comprise ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par ce qui permet au lecteur de se situer, et finis par ton jugement.
  solution: D'abord présenter le lieu (nom, ville, date), ensuite décrire les œuvres et ce que l'on a appris, enfin conclure
    par un avis argumenté.
- id: lieux-conservation
  type: choix
  difficulte: 2
  enonce: Parmi ces lieux, lesquels sont des lieux de conservation, qui gardent des œuvres ou des documents ?
  reponse:
    options:
    - id: a
      texte: Un musée des beaux-arts
    - id: b
      texte: Un service d'archives départementales
    - id: c
      texte: Une salle de concert
    - id: d
      texte: Un cinéma
    bonnes:
    - a
    - b
  indices:
    relance: Dans quels lieux les objets restent-ils rangés et protégés, même quand le public est parti ?
    methode: Un lieu de conservation garde des objets. Un lieu de diffusion présente un spectacle ou une projection au public.
    etape: Une salle où l'on écoute un orchestre présente de la musique, elle ne la garde pas. Continue avec les autres lieux.
  pieges:
  - si:
      contient:
      - c
    relance: Une salle de concert présente de la musique au public. C'est un lieu de diffusion. Garde-t-elle des œuvres ?
  - si:
      contient:
      - d
    relance: Un cinéma projette des films au public. C'est un lieu de diffusion. Lesquels gardent des œuvres ou des documents
      ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé un. Il y a un autre lieu qui garde, lui, des documents anciens. Lequel ?
  solution: 'Le musée et les archives sont des lieux de conservation : ils gardent et protègent des œuvres ou des documents.
    La salle de concert et le cinéma sont des lieux de diffusion.'
- id: metier-soigne-oeuvre
  type: texte_court
  difficulte: 2
  enonce: Quel professionnel du patrimoine soigne une œuvre abîmée (toile déchirée, vernis jauni), sans la transformer ?
  reponse:
    acceptees:
    - restaurateur
    - restauratrice
    fautes_tolerees: 1
  indices:
    relance: Ce métier remet une œuvre en bon état. Quel verbe signifie « remettre en bon état » ?
    methode: Pars du verbe « restaurer », puis forme le nom de la personne qui fait cette action.
    etape: Le nom commence par « restaur- ».
  pieges:
  - si:
      valeur: conservateur
    relance: Le conservateur gère les collections et prépare les expositions. Qui intervient sur l'œuvre elle-même pour la
      réparer ?
  - si:
      valeur: guide-conférencier
    relance: Le guide fait découvrir les œuvres au public. Qui les répare quand elles sont abîmées ?
  solution: 'C''est le restaurateur (ou la restauratrice) : il soigne les œuvres abîmées en respectant ce que l''artiste a
    fait.'
- id: avis-argumente
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases donne un avis personnel argumenté sur une visite au Louvre ?
  reponse:
    options:
    - id: a
      texte: 'J''ai été impressionné par Le Radeau de la Méduse : les personnages sont presque grandeur nature, on a l''impression
        d''être sur le radeau.'
    - id: b
      texte: C'était bien.
    - id: c
      texte: Le Louvre se trouve à Paris.
    - id: d
      texte: Tout le monde a aimé la visite.
    bonnes:
    - a
  indices:
    relance: Quelle phrase dit ce que tu as ressenti, et aussi pourquoi ?
    methode: Un avis argumenté contient un ressenti personnel et une raison précise liée à une œuvre.
    etape: Cherche la phrase qui contient un « je » et une explication après les deux-points.
  pieges:
  - si:
      contient:
      - b
    relance: C'est un avis, mais sans aucune raison. Qu'est-ce qui était bien ?
  - si:
      contient:
      - c
    relance: C'est une information, pas un avis personnel.
  - si:
      contient:
      - d
    relance: Tu parles des autres, pas de toi, et sans donner de raison.
  solution: La phrase a donne un ressenti (« j'ai été impressionné ») et le justifie par un détail précis de l'œuvre (la taille
    des personnages).
- id: rediger-compte-rendu
  type: ouverte
  difficulte: 3
  enonce: 'Rédige le compte rendu (8 à 10 lignes) d''une visite que tu as faite : un musée, un monument, un théâtre, ou la
    rencontre avec un professionnel du patrimoine.'
  criteres:
  - L'élève présente le lieu ou le métier (nom, ville, date, type de lieu).
  - L'élève décrit précisément au moins une œuvre ou une activité du métier, avec du vocabulaire adapté.
  - L'élève donne un avis personnel justifié par un détail précis.
  indices:
    relance: Quel est le nom exact du lieu, et dans quelle ville se trouve-t-il ?
    methode: Suis le plan en trois parties, présenter, rendre compte, donner un avis, et écris au passé.
    etape: Tu peux commencer par « Le …, ma classe a visité …, à … ».
  solution: 'Exemple : le 3 février, ma classe a visité le musée d''Orsay, à Paris, installé dans une ancienne gare. Une médiatrice
    nous a présenté les peintres impressionnistes. J''ai observé Le Déjeuner sur l''herbe d''Édouard Manet (1863) : au premier
    plan, deux hommes habillés discutent à côté d''une femme nue qui regarde le spectateur. La médiatrice nous a expliqué
    que ce tableau avait fait scandale. J''ai aimé cette visite, car j''ai compris qu''un tableau pouvait choquer en montrant
    une scène de son époque de façon nouvelle.'
- id: nblm-quel-est-le-role-principal-d-un-conserva-1
  type: choix
  difficulte: 2
  enonce: Quel est le rôle principal d'un conservateur de musée dans la gestion du patrimoine ?
  reponse:
    options:
    - id: o1
      texte: Étudier et gérer les collections d'un musée, choisir les œuvres à acquérir et préparer les expositions.
    - id: o2
      texte: Soigner les tableaux et objets abîmés pour les remettre en état sans les transformer.
    - id: o3
      texte: Faire visiter le musée et présenter directement les œuvres au public scolaire.
    - id: o4
      texte: Organiser uniquement le transport, le stockage et la manutention physique des œuvres.
    bonnes:
    - o1
  indices:
    relance: Pense au spécialiste qui étudie la collection, décide des acquisitions et conçoit la scénographie des expositions.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : soigner et réparer les œuvres abîmées est la mission du restaurateur de tableaux, pas du conservateur.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : accueillir le public et expliquer les œuvres pendant la visite est le rôle du guide-conférencier.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la logistique du transport et du rangement des œuvres est assurée par le régisseur.'
  solution: 'Étudier et gérer les collections d''un musée, choisir les œuvres à acquérir et préparer les expositions. C''est
    la définition exacte du conservateur de musée : il est responsable de l''étude, de la gestion des collections et de la
    préparation des expositions.'
- id: nblm-quelle-est-la-mission-specifique-d-un-re-2
  type: choix
  difficulte: 2
  enonce: Quelle est la mission spécifique d'un restaurateur de tableaux au sein d'un musée ?
  reponse:
    options:
    - id: o1
      texte: Soigner et réparer les œuvres abîmées pour les préserver sans les transformer.
    - id: o2
      texte: Acheter de nouvelles œuvres d'art pour enrichir la collection du musée.
    - id: o3
      texte: Guider les élèves lors d'une sortie scolaire au musée en commentant les tableaux.
    - id: o4
      texte: Effectuer des fouilles archéologiques dans le sol pour trouver des objets anciens.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au professionnel qui intervient physiquement sur la matière des peintures endommagées pour les sauvegarder.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le choix des nouvelles acquisitions appartient au conservateur de musée.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : l''animation de la visite pour les élèves est assurée par le guide-conférencier.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la recherche d''objets enfouis dans le sol relève du métier d''archéologue.'
  solution: 'Soigner et réparer les œuvres abîmées pour les préserver sans les transformer. Exact : le restaurateur de tableaux
    ou d''objets intervient techniquement pour conserver et réparer les œuvres détériorées.'
- id: nblm-lors-d-une-sortie-scolaire-au-musee-quel-3
  type: choix
  difficulte: 2
  enonce: Lors d'une sortie scolaire au musée, quel professionnel accompagne les élèves pour leur faire découvrir les œuvres
    ?
  reponse:
    options:
    - id: o1
      texte: Le guide-conférencier (ou médiateur).
    - id: o2
      texte: Le conservateur de musée.
    - id: o3
      texte: Le restaurateur de tableaux.
    - id: o4
      texte: Le régisseur des œuvres.
    bonnes:
    - o1
  indices:
    relance: Cherche le professionnel du patrimoine spécialisé dans la transmission orale et le guidage des visiteurs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le conservateur gère la collection scientifique et administrative, mais n''anime pas quotidiennement
      les visites scolaires.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le restaurateur travaille en atelier sur la restauration physique des pièces détériorées.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le régisseur est en charge du déplacement et du rangement matériel des pièces du musée.'
  solution: 'Le guide-conférencier (ou médiateur). Exact : le guide-conférencier (ou médiateur culturel) est le professionnel
    formé pour transmettre et faire découvrir le lieu et ses collections au public.'
- id: nblm-parmi-les-lieux-culturels-suivants-leque-4
  type: choix
  difficulte: 2
  enonce: Parmi les lieux culturels suivants, lequel entre dans la catégorie des lieux de conservation ?
  reponse:
    options:
    - id: o1
      texte: Un musée d'art ou un centre d'archives.
    - id: o2
      texte: Une salle de cinéma.
    - id: o3
      texte: Un théâtre municipal.
    - id: o4
      texte: Une salle de concert.
    bonnes:
    - o1
  indices:
    relance: Identifie le bâtiment dont l'objectif premier est de conserver et préserver des collections physiques du passé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la salle de cinéma est un lieu de diffusion audiovisuelle, pas un lieu de conservation.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le théâtre est un lieu de diffusion du spectacle vivant.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la salle de concert sert à diffuser des prestations musicales.'
  solution: 'Un musée d''art ou un centre d''archives. Exact : un lieu de conservation a pour fonction de garder, protéger
    et conserver des œuvres ou des documents historiques.'
- id: nblm-quelle-erreur-classique-faut-il-eviter-l-5
  type: choix
  difficulte: 2
  enonce: Quelle erreur classique faut-il éviter lors de la rédaction d'un compte rendu de visite ?
  reponse:
    options:
    - id: o1
      texte: Raconter les détails logistiques de la journée comme le trajet ou le pique-nique.
    - id: o2
      texte: Décrire précisément une ou deux œuvres marquantes observées sur place.
    - id: o3
      texte: Mentionner la date, la ville et le nom du musée dans l'introduction.
    - id: o4
      texte: Formuler un avis personnel argumenté appuyé sur des observations précises.
    bonnes:
    - o1
  indices:
    relance: Pense aux événements personnels hors du sujet culturel qu'un élève a tendance à raconter inutilement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est au contraire une consigne essentielle du compte rendu de visite.
  - si:
      contient:
      - o3
    relance: C'est un élément indispensable de la présentation initiale du lieu.
  - si:
      contient:
      - o4
    relance: C'est la méthode recommandée pour conclure correctement le compte rendu.
  solution: 'Raconter les détails logistiques de la journée comme le trajet ou le pique-nique. Exact : la fiche signale que
    raconter le trajet ou le repas est un piège ; le compte rendu doit porter sur les œuvres, le lieu et les enseignements.'
- id: nblm-quelles-sont-les-deux-etapes-indispensab-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux étapes indispensables pour bien construire un compte rendu de visite ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Présenter le lieu et les circonstances (nom du musée, ville, date et type de lieu).
    - id: o2
      texte: Donner un avis très rapide sans le justifier, comme « c'était super ».
    - id: o3
      texte: Rendre compte du contenu en décrivant précisément une ou deux œuvres ou le métier rencontré.
    - id: o4
      texte: Décrire en détail le déroulement du trajet en transport scolaire.
    bonnes:
    - o1
    - o3
  indices:
    relance: Sélectionne les deux choix qui correspondent au plan méthodique (introduction du lieu et analyse du contenu).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : donner une appréciation sans argumentation est un manque de rigueur méthodologique.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : raconter le voyage ou les anecdotes personnelles fait perdre de vue l''analyse culturelle.'
  solution: 'Présenter le lieu et les circonstances (nom du musée, ville, date et type de lieu) ; Rendre compte du contenu
    en décrivant précisément une ou deux œuvres ou le métier rencontré. Exact : la première étape de la méthode consiste à
    contextualiser clairement la visite (nom, ville, date, cadre).'
- id: nblm-un-etablissement-comme-un-musee-ou-une-b-7
  type: texte_court
  difficulte: 1
  enonce: Un établissement comme un musée ou une bibliothèque, qui garde et protège des collections, est un lieu de ____________.
  reponse:
    acceptees:
    - conservation
    fautes_tolerees: 1
  indices:
    relance: Complète par le nom commun correspondant au rôle de garder et préserver les œuvres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: conservation. Un lieu de conservation a pour rôle de protéger et conserver des collections du patrimoine (musées,
    archives, bibliothèques).
- id: nblm-apres-une-sortie-scolaire-au-musee-l-ele-8
  type: texte_court
  difficulte: 1
  enonce: Après une sortie scolaire au musée, l'élève rédige un document méthodique appelé un compte rendu de ____________.
  reponse:
    acceptees:
    - visite
    fautes_tolerees: 1
  indices:
    relance: Complète par le mot désignant l'action de se rendre dans un musée pour découvrir ses collections.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: visite. Le compte rendu de visite est l'exercice écrit qui permet de rendre compte d'un lieu culturel, de ses
    œuvres ou de ses métiers.
- id: mot-collection
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on l'ensemble des œuvres que possède un musée ?
  reponse:
    acceptees:
    - collection
    - collections
    - la collection
    fautes_tolerees: 1
  indices:
    relance: Un musée possède beaucoup d'œuvres. Comment appelle-t-on tout ce qu'il garde ?
    methode: Le conservateur est chargé d'étudier et de gérer cet ensemble.
    etape: Le mot commence par « col- » et se termine par « -tion ».
  pieges:
  - si:
      valeur: patrimoine
    relance: 'Le patrimoine est plus large : il concerne tous les biens hérités du passé. Quel mot désigne les œuvres d''un
      musée ?'
  solution: 'C''est la collection : l''ensemble des œuvres que possède un musée.'
- id: presentation-lieu
  type: choix
  difficulte: 2
  enonce: Quels éléments faut-il donner en présentant un lieu visité ?
  reponse:
    options:
    - id: a
      texte: Le nom du lieu et sa ville
    - id: b
      texte: La date de la visite
    - id: c
      texte: Le menu du pique-nique
    - id: d
      texte: Le trajet en bus
    bonnes:
    - a
    - b
  indices:
    relance: Que doit savoir le lecteur pour identifier le lieu et le moment ?
    methode: La présentation donne le nom, la ville, la date et le type de lieu. Elle ne raconte pas la journée.
    etape: Deux propositions parlent de la journée, pas du lieu. Écarte-les.
  pieges:
  - si:
      contient:
      - c
    relance: Le repas ne dit rien sur le lieu visité. Que faut-il donner à la place ?
  - si:
      contient:
      - d
    relance: Le trajet fait partie de la journée, pas du lieu. Que doit-on donner pour situer le lieu ?
  - si:
      diagnostic: incomplet
    relance: 'Tu as trouvé un bon élément, mais il y en a un autre : le lieu ou le moment ?'
  solution: Il faut donner le nom du lieu, sa ville et la date. Le pique-nique et le trajet racontent la journée, pas la visite.
