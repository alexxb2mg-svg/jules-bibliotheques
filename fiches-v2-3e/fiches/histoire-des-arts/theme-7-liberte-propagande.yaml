format: 2
notion: theme-7-liberte-propagande
version: 1
etat: verifiee
declencheurs:
- Guernica de Picasso
- affiche de propagande soviétique
- Carré noir sur fond blanc
- La Fée Électricité
- réalisme socialiste
- Le Dictateur de Chaplin
prerequis:
- analyse-critique-interpretation
- theme-6-belle-epoque-annees-folles
couverture: Couvre la naissance de l'abstraction, l'art de dénonciation et l'art de propagande, quelques femmes artistes et
  La Fée Électricité de Dufy. Les œuvres de propagande sont décrites de façon distanciée, sans reproduire leurs slogans.
essentiel: 'De 1910 à 1945, les arts sont pris entre deux forces : la liberté de créer et la volonté des pouvoirs de les contrôler.


  Naissance de l''abstraction : vers 1910-1915, des peintres cessent de représenter des objets reconnaissables. Ils travaillent
  avec les formes, les lignes et les couleurs pour elles-mêmes. Vassily Kandinsky est l''un des pionniers de l''art abstrait
  ; Kasimir Malevitch expose en 1915 son Carré noir sur fond blanc ; Piet Mondrian compose, dans les années 1920, des tableaux
  de lignes noires et de rectangles de couleurs primaires.


  Art et pouvoir : les régimes totalitaires utilisent l''art pour la propagande. En URSS, le réalisme socialiste impose des
  images héroïques d''ouvriers et de paysans, comme la statue géante de Vera Moukhina L''Ouvrier et la Kolkhozienne (1937).
  Dans l''Allemagne nazie, le pouvoir fait appel au cinéma et aux grands rassemblements filmés, et il persécute l''art moderne
  : en 1937, à Munich, il organise une exposition pour ridiculiser des œuvres qu''il qualifie d''« art dégénéré ».


  D''autres artistes dénoncent la guerre et les dictatures. L''Allemand Otto Dix peint les horreurs des tranchées dans son
  triptyque La Guerre (1929-1932). Pablo Picasso peint Guernica (1937) après le bombardement de cette ville basque pendant
  la guerre d''Espagne. Charlie Chaplin ridiculise Hitler dans le film Le Dictateur (1940).


  L''émancipation de la femme artiste : des femmes s''imposent comme créatrices, comme Sonia Delaunay (peinture, tissus, mode),
  Frida Kahlo au Mexique (autoportraits) ou la sculptrice soviétique Vera Moukhina.


  La « Fée électricité » : l''électricité transforme la ville et inspire les artistes. Pour l''Exposition internationale de
  Paris en 1937, Raoul Dufy peint La Fée Électricité, une immense peinture qui raconte l''histoire de l''électricité et de
  ses inventeurs.

  '
methode:
- 'Identifier l''œuvre : titre, artiste, date, pays, technique (peinture, affiche, film, sculpture).'
- Dire si l'œuvre est libre ou commandée par un pouvoir.
- 'Dire sa fonction : glorifier un régime (propagande), dénoncer une violence, ridiculiser un dictateur, célébrer le progrès.'
- 'Relier l''œuvre à son contexte : Première Guerre mondiale, régimes totalitaires, guerre d''Espagne, Seconde Guerre mondiale.'
vocabulaire:
- terme: art abstrait
  definition: un art qui ne représente pas d'objets reconnaissables, mais joue avec les formes, les lignes et les couleurs
- terme: propagande
  definition: l'ensemble des moyens (affiches, films, discours, œuvres) utilisés par un pouvoir pour imposer ses idées à la
    population
- terme: réalisme socialiste
  definition: le style artistique imposé en URSS, qui montre de façon héroïque et optimiste les travailleurs et le régime
- terme: dénoncer
  definition: montrer publiquement une injustice ou une violence pour la condamner
erreurs_frequentes:
- 'Croire qu''un tableau abstrait est « raté » : l''artiste choisit volontairement de ne pas représenter d''objets.'
- 'Confondre dénonciation et propagande : Guernica dénonce une violence, L''Ouvrier et la Kolkhozienne glorifie un régime.'
- 'Croire que Guernica montre la Seconde Guerre mondiale : le tableau dénonce un bombardement de 1937, pendant la guerre d''Espagne.'
- Oublier que les régimes totalitaires ont aussi persécuté des artistes et interdit des œuvres.
exemple:
  enonce: Explique en trois phrases la différence entre une œuvre de propagande et une œuvre de dénonciation.
  solution: 'Une œuvre de propagande est commandée ou contrôlée par un pouvoir pour faire accepter ses idées : L''Ouvrier
    et la Kolkhozienne de Vera Moukhina (1937) glorifie l''URSS. Une œuvre de dénonciation est faite librement par un artiste
    pour condamner une violence ou une injustice : Guernica de Picasso (1937) dénonce le bombardement d''une ville. La première
    sert le pouvoir, la seconde le critique.'
exercices:
- id: guernica-evenement
  type: choix
  difficulte: 1
  enonce: Quel événement Pablo Picasso dénonce-t-il dans Guernica, peint en 1937 ?
  reponse:
    options:
    - id: a
      texte: Le bombardement d'une ville basque pendant la guerre d'Espagne
    - id: b
      texte: La bataille de Verdun
    - id: c
      texte: La bombe atomique sur Hiroshima
    - id: d
      texte: La révolution russe
    bonnes:
    - a
  indices:
    relance: Guernica est le nom d'une ville. Dans quel pays se trouve-t-elle ?
    methode: 'Vérifie les dates : quels événements proposés ont eu lieu avant 1937 ? Lequel concerne l''Espagne, le pays de
      Picasso ?'
    etape: En avril 1937, pendant la guerre civile qui déchire l'Espagne, des avions alliés de Franco détruisent une petite
      ville. Quelle option correspond ?
  pieges:
  - si:
      contient:
      - c
    relance: Hiroshima est bombardée en 1945, huit ans après ce tableau. Que s'est-il passé en 1937 ?
  - si:
      contient:
      - b
    relance: Verdun est une bataille de 1916, en France. Guernica est une ville d'un autre pays.
  - si:
      contient:
      - d
    relance: La révolution russe a lieu en 1917. Guernica évoque un événement de 1937, dans le pays natal de Picasso.
  solution: Guernica dénonce le bombardement de la ville basque de Guernica, le 26 avril 1937, par des avions allemands et
    italiens alliés de Franco, pendant la guerre d'Espagne.
- id: oeuvre-fonction
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à sa fonction principale.
  reponse:
    gauche:
    - id: a
      texte: Picasso, Guernica (1937)
    - id: b
      texte: Vera Moukhina, L'Ouvrier et la Kolkhozienne (1937), statue géante d'un ouvrier et d'une paysanne brandissant
        un marteau et une faucille
    - id: c
      texte: Chaplin, Le Dictateur (1940), film où un dictateur est tourné en ridicule
    - id: d
      texte: Dufy, La Fée Électricité (1937)
    droite:
    - id: w
      texte: Dénoncer la violence d'un bombardement
    - id: x
      texte: Glorifier un régime (propagande)
    - id: y
      texte: Ridiculiser un dictateur par la satire
    - id: z
      texte: Célébrer une invention et le progrès
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Laquelle de ces œuvres a été placée au sommet du pavillon de l'URSS en 1937 ?
    methode: 'Pour chaque œuvre, demande-toi : qui l''a voulue (un artiste libre ou un État) et que ressent le spectateur
      (horreur, admiration, rire) ?'
    etape: Le marteau et la faucille sont les symboles de l'URSS. Place cette statue, puis le film comique de Chaplin.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Demande-toi pour chaque œuvre ce que ressent le spectateur.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : La Fée Électricité raconte l''histoire d''une invention.'
  solution: 'Guernica : dénoncer un bombardement. L''Ouvrier et la Kolkhozienne : glorifier l''URSS (propagande). Le Dictateur
    : ridiculiser Hitler par la satire. La Fée Électricité : célébrer l''électricité et le progrès.'
- id: chronologie-1910-1945
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: malevitch
      texte: Malevitch expose le Carré noir sur fond blanc
    - id: potemkine
      texte: Eisenstein réalise le film Le Cuirassé Potemkine
    - id: guernica
      texte: Picasso peint Guernica
    - id: dictateur
      texte: Chaplin sort le film Le Dictateur
  indices:
    relance: Laquelle de ces œuvres date de la Première Guerre mondiale ?
    methode: 'Donne une date à chaque œuvre : pendant la Première Guerre mondiale, dans les années 1920, pendant la guerre
      d''Espagne, pendant la Seconde Guerre mondiale.'
    etape: Le Carré noir est exposé en 1915 et Guernica est peint en 1937. Place les deux films.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux œuvres voisines sont inversées. Laquelle des deux est la plus ancienne ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par l'œuvre exposée pendant la Première Guerre mondiale et finis par celle qui sort pendant la Seconde.
  solution: Carré noir sur fond blanc (1915), Le Cuirassé Potemkine (1925), Guernica (1937), Le Dictateur (1940).
- id: mot-abstraction
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un art qui ne représente aucun objet reconnaissable, mais seulement des formes, des lignes
    et des couleurs, comme celui de Kandinsky ou de Malevitch ?
  reponse:
    acceptees:
    - art abstrait
    - abstrait
    - abstraction
    - peinture abstraite
    - art non figuratif
    fautes_tolerees: 1
  indices:
    relance: C'est le contraire d'un art figuratif, qui représente des personnages ou des objets.
    methode: 'Le mot vient du latin et veut dire « détaché » : l''art se détache de la réalité visible.'
    etape: Le mot commence par « abs- ».
  pieges:
  - si:
      valeur: cubisme
    relance: Dans le cubisme, on reconnaît encore des objets et des personnages découpés. Quel art n'en montre plus du tout
      ?
  - si:
      valeur: surréalisme
    relance: Le surréalisme montre des scènes de rêve, avec des objets reconnaissables. Quel art n'en représente aucun ?
  solution: 'L''art abstrait (l''abstraction) : il ne représente pas d''objets reconnaissables. Kandinsky, Malevitch et Mondrian
    en sont des pionniers dans les années 1910.'
- id: analyse-guernica
  type: ouverte
  difficulte: 3
  enonce: Voici une œuvre décrite. Guernica est une immense toile peinte par Pablo Picasso en 1937, presque huit mètres de
    long, uniquement en noir, blanc et gris. On y voit, dans des formes déformées et découpées, une mère qui hurle en tenant
    son enfant mort, un cheval blessé qui crie, un taureau, un soldat à terre tenant une épée brisée, une femme qui s'échappe
    d'une maison en flammes et, en haut, une lampe qui éclaire la scène. Décris cette œuvre et explique son message, en la
    reliant à son contexte.
  criteres:
  - L'élève décrit l'œuvre avec des mots précis (toile monumentale, noir et blanc, formes déformées ou cubistes, personnages
    et animaux qui souffrent).
  - 'L''élève explique le message : dénoncer la violence de la guerre contre des civils et l''horreur du bombardement.'
  - 'L''élève relie l''œuvre à son contexte : le bombardement de Guernica en avril 1937, pendant la guerre d''Espagne, et
    sa présentation au pavillon espagnol de l''Exposition internationale de Paris en 1937.'
  indices:
    relance: Pourquoi Picasso a-t-il choisi le noir, le blanc et le gris, comme dans une photographie de journal ?
    methode: Décris les personnages un par un, puis dis ce qu'ils ressentent, puis explique ce que Picasso veut faire comprendre
      au monde.
    etape: 'Tu peux commencer ainsi : « Guernica est une toile immense peinte par Picasso en 1937, après le bombardement d''une
      ville basque... »'
  solution: Guernica est une toile immense peinte par Picasso en 1937, après le bombardement de la ville basque de Guernica,
    le 26 avril, pendant la guerre d'Espagne. Les couleurs noir, blanc et gris rappellent les photographies des journaux et
    donnent une impression de deuil. Les corps déformés d'une mère et de son enfant mort, d'un cheval qui hurle, d'un soldat
    à terre montrent la souffrance des civils. Présenté à l'Exposition internationale de Paris en 1937, le tableau dénonce
    la violence de la guerre et devient un symbole universel contre la guerre.
