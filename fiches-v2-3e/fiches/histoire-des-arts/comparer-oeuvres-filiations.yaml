# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: comparer-oeuvres-filiations
version: 3
etat: verifiee
declencheurs:
- comparer deux tableaux
- points communs entre deux œuvres
- s'inspire d'un tableau
- reprise d'une œuvre célèbre
- influence d'un peintre
- filiation entre deux œuvres
- parenté entre deux œuvres
- ressemblances et différences
- comparer deux œuvres
prerequis:
- decrire-oeuvre-lexique
- analyse-critique-interpretation
essentiel: 'Comparer deux œuvres, c''est chercher leurs points communs et leurs différences, puis expliquer le lien qui les
  unit, avec des arguments tirés de l''observation. Ce n''est pas décrire l''une puis l''autre : il faut les mettre face à
  face.


  Une filiation relie deux œuvres d''époques différentes : l''œuvre la plus récente reprend, cite ou transforme la plus ancienne.
  Par exemple, Olympia d''Édouard Manet (1863, musée d''Orsay) reprend la pose de la Vénus d''Urbin de Titien (1538, galerie
  des Offices à Florence) : une femme nue allongée sur un lit, qui regarde le spectateur. Mais Manet remplace la déesse par
  une femme de son temps, et le petit chien endormi par un chat noir.


  Autre filiation : en 1951, dans Massacre en Corée, Picasso reprend la composition de Tres de mayo de Goya (1814) : un groupe
  de soldats face à des victimes sans défense. Les artistes se réfèrent à leurs prédécesseurs pour dire quelque chose de nouveau.


  Une reprise peut aussi être un détournement, quand l''artiste transforme l''œuvre pour s''en moquer ou la critiquer : en
  1919, Marcel Duchamp ajoute une moustache et une barbiche à une reproduction de La Joconde (L.H.O.O.Q.).


  Une parenté relie deux œuvres de natures différentes (une peinture et une musique, un film et une affiche…), créées à la
  même époque, qui partagent un thème ou une manière de faire. Au début du XXe siècle, le ballet Le Sacre du printemps d''Igor
  Stravinsky (1913) et Les Demoiselles d''Avignon de Pablo Picasso (1907) rompent tous deux avec les règles de beauté traditionnelles.


  Ce qu''on attend au brevet : un raisonnement fondé. On nomme le lien (filiation ou parenté), on cite au moins un point commun
  et une différence, et on les appuie sur des éléments précis des deux œuvres.

  '
methode:
- Présenter les deux œuvres (titre, artiste, date, nature de l'œuvre).
- Relever les points communs (sujet, composition, couleurs, message).
- Relever les différences, qui montrent ce que le second artiste apporte de nouveau.
- 'Nommer le lien : filiation (époques différentes) ou parenté (natures différentes, même époque).'
- Justifier ce lien par des éléments précis observés dans les deux œuvres.
- 'Conclure en disant ce que la comparaison montre : ce que le second artiste garde et ce qu''il change.'
vocabulaire:
- terme: filiation
  definition: le lien entre une œuvre et une œuvre plus ancienne qu'elle reprend, cite ou transforme
- terme: parenté
  definition: la ressemblance entre deux œuvres de natures différentes créées à la même époque
- terme: détournement
  definition: la reprise d'une œuvre connue, transformée pour en changer le sens, souvent avec humour ou critique
- terme: citation
  definition: la reprise visible, dans une œuvre, d'un élément d'une œuvre plus ancienne
- terme: influence
  definition: l'effet qu'une œuvre ou un artiste a sur d'autres artistes qui s'en inspirent
- terme: œuvres contemporaines
  definition: des œuvres créées à la même époque
- terme: point de comparaison
  definition: un critère précis (sujet, composition, couleurs, message) sur lequel on compare deux œuvres
erreurs_frequentes:
- Décrire les deux œuvres l'une après l'autre sans jamais les comparer.
- Ne voir que les points communs et oublier les différences.
- Confondre filiation (époques différentes) et parenté (natures différentes, même époque).
- Affirmer un lien sans le justifier par des éléments observés.
- 'Comparer sans critère précis : « les deux sont beaux » n''est pas une comparaison.'
exemple:
  enonce: Compare Olympia de Manet et la Vénus d'Urbin de Titien.
  solution: 'Les deux tableaux sont des huiles sur toile. La Vénus d''Urbin est peinte par Titien en 1538, Olympia par Manet
    en 1863. Points communs : une femme nue allongée sur un lit, qui regarde le spectateur, avec un animal à ses pieds et
    une ou deux servantes près d''elle. Différences : Titien peint une déesse dans un décor doux ; Manet peint une femme de
    son époque, avec un chat noir au lieu d''un petit chien endormi, et une lumière crue. C''est une filiation : Manet reprend
    un modèle de la Renaissance pour montrer la réalité de son temps, ce qui a fait scandale.'
exercices:
- id: filiation-ou-parente
  type: choix
  difficulte: 1
  enonce: En 1863, Manet reprend dans Olympia la pose de la Vénus d'Urbin peinte par Titien en 1538. Quel lien unit ces deux
    tableaux ?
  reponse:
    options:
    - id: a
      texte: Une filiation
    - id: b
      texte: Une parenté
    - id: c
      texte: Aucun lien
    bonnes:
    - a
  indices:
    relance: Les deux œuvres ont-elles été créées à la même époque ?
    methode: Un lien entre deux œuvres d'époques différentes, dont l'une reprend l'autre, n'a pas le même nom qu'un lien entre
      deux œuvres de même époque et de natures différentes.
    etape: Plus de trois siècles séparent les deux tableaux, et ce sont deux peintures. Laquelle des deux définitions convient
      ?
  pieges:
  - si:
      contient:
      - b
    relance: Une parenté relie deux œuvres de même époque et de natures différentes. Ici, ce sont deux peintures séparées
      par plus de trois siècles.
  - si:
      contient:
      - c
    relance: Manet reprend volontairement la pose de Titien. Il y a donc bien un lien. Lequel ?
  solution: 'C''est une filiation : Olympia (1863) reprend une œuvre plus ancienne, la Vénus d''Urbin (1538).'
- id: points-communs-olympia
  type: choix
  difficulte: 2
  enonce: Quels sont les points communs entre la Vénus d'Urbin de Titien et Olympia de Manet ?
  reponse:
    options:
    - id: a
      texte: Une femme nue est allongée sur un lit
    - id: b
      texte: La femme regarde le spectateur
    - id: c
      texte: Un chat noir se tient au pied du lit
    - id: d
      texte: Les deux tableaux sont peints à la même époque
    bonnes:
    - a
    - b
  indices:
    relance: Qu'est-ce que Manet a gardé du tableau de Titien, et qu'a-t-il changé ?
    methode: Vérifie chaque proposition pour les deux tableaux. Un point commun doit être vrai pour les deux.
    etape: Chez Titien, l'animal au pied du lit est un petit chien endormi. Et les dates, 1538 et 1863, sont-elles proches
      ?
  pieges:
  - si:
      contient:
      - c
    relance: Le chat noir est chez Manet seulement. Quel animal Titien a-t-il peint ?
  - si:
      contient:
      - d
    relance: Titien peint en 1538, Manet en 1863. Est-ce la même époque ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé un point commun. Il y en a un autre, qui concerne le regard du personnage.
  solution: Dans les deux tableaux, une femme nue est allongée sur un lit et regarde le spectateur. Le chat noir est propre
    à Olympia (Titien a peint un petit chien), et plus de trois siècles séparent les deux œuvres.
- id: filiations-oeuvres
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à l'œuvre plus ancienne dont elle s'inspire.
  reponse:
    gauche:
    - id: a
      texte: Olympia, Édouard Manet, 1863
    - id: b
      texte: Les Ménines, série de Pablo Picasso, 1957
    - id: c
      texte: L.H.O.O.Q., Marcel Duchamp, 1919
    droite:
    - id: x
      texte: Vénus d'Urbin, Titien, 1538
    - id: y
      texte: Les Ménines, Diego Velázquez, 1656
    - id: z
      texte: La Joconde, Léonard de Vinci, début du XVIe siècle
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une des paires porte le même titre à droite et à gauche. Laquelle ?
    methode: Pour chaque œuvre récente, rappelle-toi ce qu'elle représente, puis cherche le modèle ancien qui représente la
      même chose.
    etape: Duchamp a ajouté une moustache au portrait le plus célèbre du monde. Lequel ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une association est fausse. Laquelle des œuvres anciennes montre une femme nue allongée ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par la paire qui porte le même titre, puis pense au portrait moustachu de Duchamp.
  solution: Olympia reprend la Vénus d'Urbin de Titien. La série Les Ménines de Picasso reprend Les Ménines de Velázquez.
    L.H.O.O.Q. détourne La Joconde.
- id: nom-detournement
  type: texte_court
  difficulte: 2
  enonce: En 1919, Marcel Duchamp ajoute une moustache et une barbiche à une reproduction de La Joconde. Comment appelle-t-on
    une reprise qui transforme une œuvre célèbre pour s'en moquer ou en changer le sens ?
  reponse:
    acceptees:
    - détournement
    - parodie
    fautes_tolerees: 0
  indices:
    relance: Duchamp respecte-t-il l'œuvre de Léonard, ou la fait-il dévier de son sens ?
    methode: Le mot vient d'un verbe qui veut dire « faire changer de direction », comme on le fait d'un avion ou d'une rivière.
    etape: Le nom se forme à partir du verbe « détourner ».
  pieges:
  - si:
      valeur: copie
    relance: Une copie reproduit l'œuvre sans la changer. Ici, Duchamp la transforme. Quel mot convient ?
  - si:
      valeur: hommage
    relance: Un hommage montre du respect. Duchamp, lui, se moque de l'œuvre. Quel mot convient ?
  solution: 'C''est un détournement : Duchamp transforme La Joconde pour s''en moquer et interroger l''idée de chef-d''œuvre.'
- id: frise-filiations
  type: ordre
  difficulte: 2
  enonce: Range ces tableaux, reliés par des filiations, du plus ancien au plus récent.
  reponse:
    elements:
    - id: titien
      texte: Vénus d'Urbin, Titien
    - id: goya
      texte: Tres de mayo, Francisco de Goya
    - id: manet
      texte: Olympia, Édouard Manet
    - id: picasso
      texte: Guernica, Pablo Picasso
  indices:
    relance: Lequel de ces peintres appartient à la Renaissance ? Et lequel au XXe siècle ?
    methode: Place d'abord chaque tableau dans son siècle, puis range les siècles.
    etape: Titien peint au XVIe siècle et Picasso au XXe siècle. Goya et Manet sont entre les deux. Lequel des deux peint
      au début du XIXe siècle ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux tableaux voisins sont inversés. Pense aux siècles de Goya et de Manet.
  - si:
      diagnostic: ordre_faux
    relance: Commence par placer le peintre de la Renaissance et celui du XXe siècle, puis range les deux autres.
  solution: Vénus d'Urbin (Titien, 1538), Tres de mayo (Goya, 1814), Olympia (Manet, 1863), Guernica (Picasso, 1937).
- id: parente-sacre-demoiselles
  type: ouverte
  difficulte: 3
  enonce: Compare deux œuvres de natures différentes du début du XXe siècle. Les Demoiselles d'Avignon (Pablo Picasso, 1907,
    huile sur toile, Museum of Modern Art de New York) montrent cinq femmes nues aux corps anguleux, découpés en facettes,
    dont certains visages ressemblent à des masques. Le Sacre du printemps (Igor Stravinsky, 1913) est un ballet dont la musique
    a des rythmes brutaux et irréguliers, avec des danseurs aux gestes lourds et saccadés ; la première, à Paris, provoque
    un scandale. Explique en quelques phrases leurs points communs, leurs différences et le lien qui les unit.
  criteres:
  - L'élève relève au moins deux points communs (rupture avec la beauté traditionnelle, formes ou rythmes brisés, inspiration
    primitive, effet de choc sur le public).
  - L'élève relève au moins une différence liée à la nature des œuvres (peinture qui se regarde, ballet et musique qui se
    voient et s'entendent dans le temps).
  - L'élève nomme le lien (une parenté entre deux œuvres de natures différentes de la même époque) et le justifie.
  indices:
    relance: Qu'est-ce qui, dans ces deux œuvres, a pu choquer le public de l'époque ?
    methode: Fais deux colonnes, points communs et différences, puis conclus en nommant le lien entre les deux œuvres.
    etape: Tu peux commencer par « Ces deux œuvres ont été créées à quelques années d'écart, au début du XXe siècle, mais
      ce ne sont pas des œuvres de même nature… ».
  solution: 'Les Demoiselles d''Avignon (1907) et Le Sacre du printemps (1913) sont créées à six ans d''écart, au début du
    XXe siècle. L''une est une peinture, l''autre un ballet avec sa musique. Toutes deux rompent avec la beauté traditionnelle
    : Picasso découpe les corps en facettes et peint des visages comme des masques, Stravinsky utilise des rythmes brutaux
    et irréguliers. Toutes deux ont choqué. La peinture se regarde d''un coup d''œil, alors que le ballet se déroule dans
    le temps. C''est une parenté : deux œuvres de natures différentes, de la même époque, qui partagent la même volonté de
    rupture.'
- id: nblm-comment-appelle-t-on-le-lien-entre-une-u-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on le lien entre une œuvre récente et une œuvre plus ancienne qu'elle reprend, cite ou transforme
    ?
  reponse:
    options:
    - id: o1
      texte: Une filiation
    - id: o2
      texte: Une parenté
    - id: o3
      texte: Une rupture
    - id: o4
      texte: Une allégorie
    bonnes:
    - o1
  indices:
    relance: Pense au terme qui évoque la ligne de transmission ou de descendance à travers les époques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la parenté concerne deux œuvres de natures différentes créées à la même époque, et non à
      des époques différentes.'
  - si:
      contient:
      - o3
    relance: La rupture désigne un rejet des règles ou des traditions, et non un lien de reprise d'une œuvre ancienne.
  - si:
      contient:
      - o4
    relance: Une allégorie est la représentation d'une idée abstraite sous les traits d'un personnage, ce n'est pas une relation
      entre deux œuvres.
  solution: 'Une filiation. C''est la définition exacte : la filiation désigne le lien entre une œuvre et une œuvre plus ancienne
    dont elle s''inspire ou qu''elle transforme.'
- id: nblm-lorsque-deux-uvres-de-natures-differente-2
  type: choix
  difficulte: 2
  enonce: Lorsque deux œuvres de natures différentes (par exemple une peinture et un ballet) créées à la même époque partagent
    un thème ou une manière de faire, de quoi s'agit-il ?
  reponse:
    options:
    - id: o1
      texte: D'une parenté
    - id: o2
      texte: D'une filiation
    - id: o3
      texte: D'un détournement
    - id: o4
      texte: D'une citation
    bonnes:
    - o1
  indices:
    relance: Observe attentivement si les créations appartiennent à la même époque ou à des siècles différents.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La filiation suppose un écart dans le temps entre une œuvre ancienne et une œuvre plus récente qui s'en s'inspire.
  - si:
      contient:
      - o3
    relance: Un détournement est une parodie ou modification critique d'une œuvre célèbre, pas un lien de contemporanéité.
  - si:
      contient:
      - o4
    relance: Une citation est la reprise d'un détail précis d'une œuvre ancienne, et non un lien global entre deux arts différents.
  solution: D'une parenté. La parenté relie deux œuvres de natures différentes réalisées à la même époque qui partagent un
    thème ou un style commun.
- id: nblm-en-analysant-l-influence-d-un-peintre-qu-3
  type: choix
  difficulte: 2
  enonce: En analysant l'influence d'un peintre, quel point commun montre qu'Olympia d'Édouard Manet s'inspire du tableau
    La Vénus d'Urbin de Titien ?
  reponse:
    options:
    - id: o1
      texte: La pose d'une femme nue allongée sur un lit qui regarde le spectateur
    - id: o2
      texte: La présence d'un petit chien endormi au pied du lit
    - id: o3
      texte: La représentation d'une déesse mythologique de la Renaissance
    - id: o4
      texte: Une composition dominée par une lumière très douce
    bonnes:
    - o1
  indices:
    relance: Recherche l'élément de posture physique et de regard qui est strictement identique dans les deux tableaux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Il s''agit d''une différence : Manet remplace le petit chien de Titien par un chat noir.'
  - si:
      contient:
      - o3
    relance: 'C''est une différence : Manet remplace la déesse antique par une femme contemporaine du XIXe siècle.'
  - si:
      contient:
      - o4
    relance: Manet utilise une lumière crue qui contraste avec la lumière douce de Titien, constituant une divergence.
  solution: 'La pose d''une femme nue allongée sur un lit qui regarde le spectateur. C''est le point commun fondamental :
    Manet reprend exactement la posture de la femme allongée fixant le spectateur.'
- id: nblm-comment-appelle-t-on-la-reprise-d-une-uv-4
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on la reprise d'une œuvre célèbre lorsqu'un artiste la transforme avec humour ou critique pour
    en changer le sens, comme Marcel Duchamp avec La Joconde ?
  reponse:
    options:
    - id: o1
      texte: Un détournement
    - id: o2
      texte: Une parenté
    - id: o3
      texte: Une rupture académique
    - id: o4
      texte: Une mise en abyme
    bonnes:
    - o1
  indices:
    relance: Ce terme désigne l'action de modifier la fonction ou la signification originale d'un objet ou d'une image.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La parenté concerne deux œuvres contemporaines de disciplines différentes, sans intention de caricature.
  - si:
      contient:
      - o3
    relance: La rupture désigne un abandon général des conventions, alors qu'ici l'artiste réutilise précisément une œuvre
      ciblée.
  - si:
      contient:
      - o4
    relance: La mise en abyme est l'inclusion d'une œuvre dans une œuvre du même type, ce n'est pas la parodie d'un tableau.
  solution: Un détournement. Le détournement consiste à reprendre une œuvre connue en la modifiant pour s'en moquer, la critiquer
    ou en changer le sens.
- id: nblm-quelle-erreur-typique-faut-il-eviter-lor-5
  type: choix
  difficulte: 2
  enonce: Quelle erreur typique faut-il éviter lorsque tu dois comparer deux tableaux en histoire des arts ?
  reponse:
    options:
    - id: o1
      texte: Décrire les deux œuvres l'une après l'autre sans jamais les comparer
    - id: o2
      texte: Mettre en valeur à la fois les points communs et les différences
    - id: o3
      texte: Prouver le lien d'influence par des éléments visuels précis
    - id: o4
      texte: Identifier les auteurs et les dates de création
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui empêche d'établir un vrai dialogue visuel entre deux œuvres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est la méthode correcte : une bonne comparaison étudie les ressemblances ainsi que les nouveautés.'
  - si:
      contient:
      - o3
    relance: 'C''est une exigence de l''analyse : il faut toujours justifier le lien par des faits observés dans l''œuvre.'
  - si:
      contient:
      - o4
    relance: Donner la carte d'identité des œuvres est une étape obligatoire au début de la comparaison.
  solution: 'Décrire les deux œuvres l''une après l''autre sans jamais les comparer. C''est l''erreur la plus fréquente :
    juxtaposer deux descriptions isolées ne constitue pas une étude comparative.'
- id: nblm-quelles-sont-les-deux-demarches-indispen-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX démarches indispensables pour réussir l'étude comparative et prouver la filiation entre deux
    œuvres ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Relever les points communs et les différences entre les deux œuvres
    - id: o2
      texte: Justifier le lien d'influence par des éléments précis observés dans les œuvres
    - id: o3
      texte: Décrire uniquement la première œuvre et ignorer la seconde
    - id: o4
      texte: Exprimer ses goûts personnels sans analyser la composition
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux actions méthodologiques qui consistent à confronter les tableaux et à apporter des preuves
      visuelles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est une erreur grave qui empêche toute mise en relation entre les deux créations.
  - si:
      contient:
      - o4
    relance: Donner une opinion sans argument visuel ne permet pas d'établir ni d'expliquer un lien d'influence.
  solution: Relever les points communs et les différences entre les deux œuvres ; Justifier le lien d'influence par des éléments
    précis observés dans les œuvres. Une comparaison réussie doit obligatoirement dégager les ressemblances et les apports
    nouveaux de la seconde œuvre.
- id: nblm-comment-appelle-t-on-la-reprise-visible-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la reprise visible, dans une œuvre, d'un élément précis appartenant à une œuvre plus ancienne
    ?
  reponse:
    acceptees:
    - citation
    fautes_tolerees: 1
  indices:
    relance: Ce mot s'utilise aussi en français lorsque l'on rapporte le passage exact d'un texte littéraire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: citation. La citation désigne le fait d'insérer de manière visible un élément précis d'une œuvre antérieure dans
    une création nouvelle.
- id: nblm-quel-mot-designe-la-ressemblance-entre-d-8
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la ressemblance entre deux œuvres de natures différentes créées à la même époque ?
  reponse:
    acceptees:
    - parenté
    fautes_tolerees: 1
  indices:
    relance: Ce nom commun exprime un lien d'affinité ou de proximité familiale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: parenté. La parenté est la ressemblance reliant deux œuvres de disciplines différentes produites à la même période.
- id: nom-lien-parente
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on la ressemblance entre deux œuvres de natures différentes (par exemple une peinture et un ballet),
    créées à la même époque ?
  reponse:
    acceptees:
    - parenté
    - une parenté
    - la parenté
    fautes_tolerees: 1
  indices:
    relance: 'Pense aux liens d''une famille : ce mot désigne un lien de ressemblance, sans que l''une soit la fille de l''autre.'
    methode: Ce lien relie des œuvres de même époque, alors que la filiation relie des époques différentes.
    etape: Le mot commence par « paren- » comme dans le mot désignant la famille.
  pieges:
  - si:
      valeur: filiation
    relance: La filiation relie des œuvres d'époques différentes. Ici, les œuvres sont de la même époque.
  solution: 'C''est une parenté : deux œuvres de natures différentes, contemporaines l''une de l''autre, partagent un thème
    ou une manière de faire.'
- id: phrase-comparaison
  type: choix
  difficulte: 3
  enonce: Laquelle de ces phrases compare réellement Olympia de Manet et la Vénus d'Urbin de Titien ?
  reponse:
    options:
    - id: a
      texte: Les deux tableaux montrent une femme nue allongée qui regarde le spectateur, mais Manet peint une femme de son
        temps alors que Titien peint une déesse.
    - id: b
      texte: Le premier tableau est de Titien. Le second est de Manet.
    - id: c
      texte: Je préfère le tableau de Manet.
    - id: d
      texte: Manet est plus célèbre que Titien.
    bonnes:
    - a
  indices:
    relance: Quelle phrase met les deux œuvres en relation avec un point commun et une différence ?
    methode: Une vraie comparaison contient un point commun, une différence et des éléments précis des deux tableaux.
    etape: Trois phrases citent une seule œuvre à la fois ou donnent un avis. Une seule les met face à face.
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase présente les deux œuvres l'une après l'autre. Où est le lien entre elles ?
  - si:
      contient:
      - c
    relance: C'est un avis personnel sans argument. Quelle phrase met les œuvres face à face ?
  - si:
      contient:
      - d
    relance: Cela ne dit rien sur les œuvres elles-mêmes. Cherche une phrase avec un point commun et une différence.
  solution: 'La phrase a compare : point commun (pose), différence (déesse ou femme de son temps). Les autres se contentent
    de présenter ou de donner un avis.'
