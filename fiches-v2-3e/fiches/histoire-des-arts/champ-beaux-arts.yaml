- id: outils-dessin
  type: choix
  difficulte: 2
  enonce: Quels moyens sont utilisés pour dessiner ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: Le fusain
    - id: b
      texte: La sanguine
    - id: c
      texte: Le burin
    - id: d
      texte: Le ciseau
    bonnes:
    - a
    - b
  indices:
    relance: Pense à ce qu'on peut tenir dans la main pour tracer sur du papier.
    methode: 'Deux outils servent à d''autres domaines : l''un à graver une plaque, l''autre à sculpter la pierre.'
    etape: Le burin sert à la gravure. Il reste à écarter l'outil du sculpteur.
  pieges:
  - si:
      contient:
      - c
    relance: 'Le burin creuse une plaque de métal : c''est un outil de gravure.'
  - si:
      contient:
      - d
    relance: 'Le ciseau sert à tailler la pierre ou le bois : c''est un outil de sculpteur.'
  solution: Le fusain et la sanguine servent à dessiner ; le burin est l'outil de la gravure et le ciseau celui du sculpteur.
- id: mot-bas-relief
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on une sculpture qui ne dépasse que peu d'un fond, comme la frise du Parthénon ?
  reponse:
    acceptees:
    - bas-relief
    - bas relief
    - un bas-relief
    fautes_tolerees: 1
  indices:
    relance: 'Cette sculpture n''est pas détachée : elle est liée à un mur ou à un fond.'
    methode: Le nom précise, par un adjectif, que la saillie est faible. Le contraire s'appelle « haut-relief ».
    etape: Le mot commence par « bas- » et se termine par « -relief ».
  pieges:
  - si:
      valeur: haut-relief
    relance: Le haut-relief dépasse beaucoup du fond. Ici, la sculpture dépasse peu.
  solution: Un bas-relief est une sculpture qui dépasse peu du fond, comme la frise du Parthénon.
