    relance: 'Erreur typique : bien que certaines œuvres anciennes soient sur bois (comme La Joconde), l''huile sur toile
      utilise du tissu tendu.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le dessin est un domaine distinct qui n''emploie pas de liant à l''huile.'
  solution: 'Une peinture faite de pigments mêlés d''huile, posée sur une toile tendue sur un châssis. C''est juste : cette
    technique combine un liant huileux et un support textile tendu.'
