format: 2
notion: champ-beaux-arts
version: 3
etat: verifiee
declencheurs:
- huile sur toile
- sculpture en ronde-bosse
- peinture à fresque
- bas-relief
- gravure au burin
- tableau de maître
- esquisse dessin
- fusain sanguine
- plan et façade
prerequis:
- decrire-oeuvre-lexique
- 4e-champ-beaux-arts
essentiel: 'Le champ classique des « Beaux-Arts » regroupe cinq domaines : l''architecture, la peinture, la sculpture, le
  dessin et la gravure. Ce sont des arts de l''espace : l''œuvre est un objet ou un bâtiment que l''on regarde, et non un
  spectacle qui se déroule dans le temps.


  La peinture se reconnaît à son support et à sa technique. Une fresque est peinte sur un enduit encore frais, sur un mur
  ou un plafond. Une huile sur toile est peinte avec des couleurs mêlées d''huile, sur une toile tendue sur un châssis.


  La sculpture peut être en ronde-bosse (on peut en faire le tour) ou en relief (elle se détache d''un fond : bas-relief si
  elle dépasse peu, haut-relief si elle dépasse beaucoup). On sculpte en taillant la pierre ou le bois, ou on coule le bronze
  dans un moule.


  La gravure permet d''imprimer plusieurs fois la même image : l''artiste creuse une plaque (le métal au burin ou à l''eau-forte,
  ou le bois), l''encre, puis la presse sur une feuille.


  L''architecture est l''art de concevoir des bâtiments : on étudie leur plan, leurs matériaux, leur fonction et leur style.


  Quelques repères : la frise du Parthénon d''Athènes (bas-relief, Ve siècle av. J.-C.), Melencolia I d''Albrecht Dürer (gravure
  au burin, 1514), La Liberté guidant le peuple d''Eugène Delacroix (huile sur toile, 1830), la Villa Savoye de Le Corbusier
  (architecture, 1928-1931).


  Le dessin est l''art de tracer des lignes sur une surface, souvent du papier, avec un crayon, du fusain, de la sanguine
  ou de l''encre. Il sert d''esquisse (un premier essai) ou d''œuvre à part entière.


  Pour décrire une œuvre de beaux-arts, on donne toujours : le domaine, la technique, le support (mur, toile, papier, pierre,
  bronze), l''artiste, la date et le lieu.


  Au brevet, on attend que tu saches nommer les cinq domaines, reconnaître une technique d''après une description et employer
  le mot juste (fresque, ronde-bosse, bas-relief, gravure).

  '
methode:
- 'Nommer d''abord le domaine : architecture, peinture, sculpture, dessin ou gravure.'
- 'Préciser la technique et le support : fresque, huile sur toile, ronde-bosse, bas-relief, burin, eau-forte…'
- 'Situer l''œuvre : titre, artiste, date (ou siècle), lieu de conservation si on le connaît.'
- Décrire ce que l'on voit avec le vocabulaire du domaine (plans, couleurs, lumière pour une peinture ; matériau, volume,
  point de vue pour une sculpture ; plan, façade, matériaux pour un bâtiment).
- 'Finir par une interprétation : ce que l''œuvre veut montrer ou faire ressentir.'
- 'Pour identifier le domaine, se demander : l''œuvre est-elle un bâtiment, une image sur un support plat, un volume ou une
  image imprimée en plusieurs exemplaires ?'
- Pour nommer la technique, chercher le matériau (pierre, bronze, huile, encre, plaque de métal) et l'outil (pinceau, ciseau,
  burin, crayon).
vocabulaire:
- terme: fresque
  definition: peinture réalisée sur un enduit encore frais (mur, plafond) ; les couleurs pénètrent l'enduit en séchant
- terme: huile sur toile
  definition: peinture faite de pigments mêlés d'huile, posée sur une toile tendue sur un châssis
- terme: ronde-bosse
  definition: sculpture en trois dimensions dont on peut faire le tour
- terme: bas-relief
  definition: sculpture qui se détache peu d'un fond auquel elle reste attachée
- terme: gravure
  definition: image imprimée à partir d'une plaque (métal ou bois) creusée par l'artiste, que l'on peut tirer en plusieurs
    exemplaires
- terme: burin
  definition: l'outil pointu du graveur pour creuser une plaque de métal
- terme: esquisse
  definition: un premier dessin rapide qui prépare une œuvre
- terme: haut-relief
  definition: une sculpture fixée sur un fond mais qui en dépasse beaucoup
- terme: fusain
  definition: un bâton de bois brûlé qui laisse des traits noirs, utilisé pour dessiner
erreurs_frequentes:
- 'Appeler « fresque » n''importe quelle grande peinture : une fresque est peinte sur un enduit frais, sur un mur ou un plafond.'
- 'Confondre ronde-bosse et bas-relief : on peut faire le tour d''une ronde-bosse, pas d''un bas-relief.'
- 'Croire que toutes les peintures anciennes sont sur toile : La Joconde, par exemple, est peinte sur un panneau de bois.'
- Oublier que l'architecture et la gravure font partie des beaux-arts, au même titre que la peinture.
- 'Confondre dessin et peinture : le dessin trace des lignes sur du papier, la peinture couvre une surface de couleur.'
exemple:
  enonce: Présente Le Penseur d'Auguste Rodin en nommant son domaine et sa technique.
  solution: 'Le Penseur est une sculpture d''Auguste Rodin, conçue vers 1880 pour La Porte de l''Enfer. C''est une ronde-bosse
    en bronze : on peut en faire le tour. Elle représente un homme assis, penché en avant, le menton sur la main, les muscles
    tendus : il semble concentré dans une réflexion intense.'
exercices:
- id: mot-fresque
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une peinture réalisée sur un enduit encore frais, sur un mur ou un plafond, comme La Création
    d'Adam de Michel-Ange dans la chapelle Sixtine ?
  reponse:
    acceptees:
    - fresque
    - peinture à fresque
    fautes_tolerees: 0
  indices:
    relance: 'Sur quoi l''artiste peint-il ici : une toile, un panneau de bois ou le mur lui-même ?'
    methode: 'Cherche le mot qui désigne une peinture murale posée sur un enduit humide : les couleurs sèchent avec lui.'
    etape: Le mot vient de l'italien et veut dire « frais ». Il commence par « fr ».
  pieges:
  - si:
      valeur: mosaïque
    relance: 'Une mosaïque est faite de petits morceaux de pierre ou de verre assemblés. Ici, l''artiste peint avec un pinceau
      sur un enduit humide : quel mot ?'
  - si:
      valeur: huile sur toile
    relance: 'Michel-Ange ne peint pas sur une toile : il peint directement sur le plafond, dans un enduit encore frais. Quel
      mot désigne cette technique ?'
  solution: 'C''est une fresque : les pigments sont posés sur un enduit frais et font corps avec le mur en séchant. Michel-Ange
    a peint le plafond de la chapelle Sixtine à fresque de 1508 à 1512.'
- id: mot-ronde-bosse
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on une sculpture en trois dimensions, détachée de tout fond, dont on peut faire le tour, comme
    Le Penseur d'Auguste Rodin ?
  reponse:
    acceptees:
    - ronde-bosse
    - sculpture en ronde-bosse
    fautes_tolerees: 1
  indices:
    relance: Peux-tu tourner autour du Penseur et le voir de dos ? Est-il attaché à un mur ?
    methode: 'Il existe deux grandes façons de sculpter : en relief, attaché à un fond, ou libre dans l''espace. Cherche le
      nom de la seconde.'
    etape: Le mot est composé de deux mots reliés par un tiret. Le premier est un adjectif qui évoque le cercle.
  pieges:
  - si:
      valeur: bas-relief
    relance: Un bas-relief reste attaché à un fond, on ne peut pas en faire le tour. Or on peut faire le tour du Penseur.
      Quel est le mot juste ?
  - si:
      valeur: haut-relief
    relance: Même un haut-relief reste attaché à un fond. Le Penseur, lui, est libre de tous côtés. Quel mot ?
  solution: 'C''est une ronde-bosse : une sculpture libre dans l''espace, dont on peut faire le tour. Le Penseur de Rodin
    est une ronde-bosse en bronze.'
- id: oeuvre-technique
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à son domaine et à sa technique.
  reponse:
    gauche:
    - id: a
      texte: La Liberté guidant le peuple, Eugène Delacroix, 1830
    - id: b
      texte: La Création d'Adam, Michel-Ange, plafond de la chapelle Sixtine, 1508-1512
    - id: c
      texte: Melencolia I, Albrecht Dürer, 1514
    - id: d
      texte: Le Penseur, Auguste Rodin, conçu vers 1880
    - id: e
      texte: La Villa Savoye, Le Corbusier, 1928-1931
    droite:
    - id: v
      texte: peinture à l'huile sur toile
    - id: w
      texte: peinture à fresque
    - id: x
      texte: gravure au burin
    - id: y
      texte: sculpture en ronde-bosse, en bronze
    - id: z
      texte: architecture
    paires:
      a: v
      b: w
      c: x
      d: y
      e: z
  indices:
    relance: Laquelle de ces œuvres est un bâtiment ? Laquelle est peinte sur un plafond ?
    methode: 'Place d''abord les œuvres dont tu es sûr (le bâtiment, la sculpture), puis départage les deux peintures par
      leur support : un plafond ou une toile.'
    etape: Le Penseur est un personnage en bronze dont on fait le tour. Melencolia I est une image en noir et blanc imprimée
      à partir d'une plaque de cuivre. Place maintenant les deux peintures.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie les deux peintures : laquelle est sur un plafond, laquelle sur une
      toile ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par les repères sûrs : un bâtiment, une sculpture qu''on peut contourner, une image imprimée. Il reste
      alors deux peintures.'
  solution: La Liberté guidant le peuple est une huile sur toile ; La Création d'Adam, une fresque ; Melencolia I, une gravure
    au burin ; Le Penseur, une ronde-bosse en bronze ; la Villa Savoye, une œuvre d'architecture.
- id: classer-oeuvres
  type: choix
  difficulte: 1
  enonce: Parmi ces œuvres, lesquelles appartiennent au champ des beaux-arts (architecture, peinture, sculpture, dessin, gravure)
    ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: Guernica, Pablo Picasso, 1937
    - id: b
      texte: La cathédrale Notre-Dame de Paris
    - id: c
      texte: Le Lac des cygnes, Piotr Ilitch Tchaïkovski, 1877
    - id: d
      texte: Les Temps modernes, Charlie Chaplin, 1936
    - id: e
      texte: L'Homme de Vitruve, Léonard de Vinci, vers 1490
    bonnes:
    - a
    - b
    - e
  indices:
    relance: 'Pour chaque œuvre, demande-toi : est-ce un objet ou un bâtiment que l''on regarde, ou un spectacle qui se déroule
      dans le temps ?'
    methode: 'Cherche le domaine de chaque œuvre : un tableau, un bâtiment, un dessin appartiennent aux beaux-arts ; un ballet
      ou un film appartiennent à d''autres champs.'
    etape: Le Lac des cygnes se danse sur une scène. Les Temps modernes se regarde sur un écran. Que sont les trois autres
      ?
  pieges:
  - si:
      contient:
      - c
    relance: 'Le Lac des cygnes est un ballet : il se danse sur une scène, devant un public. À quel champ appartient-il vraiment
      ?'
  - si:
      contient:
      - d
    relance: Les Temps modernes est un film. Le cinéma forme un champ à part, avec la photographie.
  - si:
      diagnostic: incomplet
    relance: Il en manque. Un bâtiment et un dessin font aussi partie des beaux-arts.
  solution: Guernica (une peinture), Notre-Dame de Paris (architecture) et L'Homme de Vitruve (un dessin) appartiennent aux
    beaux-arts. Le Lac des cygnes est un ballet (spectacle vivant) et Les Temps modernes un film (cinéma).
- id: chronologie-beaux-arts
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: parthenon
      texte: La frise des Panathénées, bas-relief du Parthénon d'Athènes
    - id: sixtine
      texte: La Création d'Adam, fresque de Michel-Ange
    - id: liberte
      texte: La Liberté guidant le peuple, d'Eugène Delacroix
    - id: guernica
      texte: Guernica, de Pablo Picasso
  indices:
    relance: Laquelle de ces œuvres date de l'Antiquité grecque ? Laquelle date du XXe siècle ?
    methode: 'Associe chaque œuvre à une époque : Antiquité, Renaissance, XIXe siècle, XXe siècle. Puis range les époques.'
    etape: Michel-Ange est un artiste de la Renaissance, au début du XVIe siècle. Delacroix peint la révolution de juillet
      1830. Où se placent-ils ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux œuvres voisines sont inversées. Rappelle-toi le siècle de chacune.'
  - si:
      diagnostic: ordre_faux
    relance: Place d'abord l'œuvre de l'Antiquité et celle du XXe siècle, puis range les deux autres entre elles.
  solution: La frise du Parthénon (Ve siècle av. J.-C.), La Création d'Adam (1508-1512), La Liberté guidant le peuple (1830),
    Guernica (1937).
- id: analyse-liberte
  type: ouverte
  difficulte: 3
  enonce: Voici la description d'une œuvre. La Liberté guidant le peuple, d'Eugène Delacroix (1830), est une grande peinture
    à l'huile sur toile (environ 2,60 m sur 3,25 m), conservée au musée du Louvre. Au centre, une femme coiffée d'un bonnet
    phrygien brandit le drapeau tricolore et avance sur une barricade couverte de corps. Autour d'elle, un homme en chapeau
    haut-de-forme tient un fusil et un jeune garçon brandit des pistolets. Au fond, dans la fumée, on aperçoit les tours de
    Notre-Dame. Présente et analyse cette œuvre en quelques phrases.
  criteres:
  - L'élève situe l'œuvre dans le champ des beaux-arts et nomme sa technique (peinture à l'huile sur toile), avec l'artiste
    et la date.
  - L'élève décrit la composition avec un vocabulaire précis (premier plan, arrière-plan, personnage central, couleurs du
    drapeau).
  - 'L''élève propose une interprétation : la femme est une allégorie de la Liberté, et le tableau évoque la révolution de
    juillet 1830 à Paris.'
  indices:
    relance: 'Qui est cette femme au bonnet phrygien : une personne réelle ou une idée représentée comme une personne ?'
    methode: Présente l'œuvre (domaine, technique, artiste, date), décris-la du premier plan à l'arrière-plan, puis dis ce
      qu'elle veut montrer.
    etape: 'Tu peux commencer ainsi : « La Liberté guidant le peuple est une huile sur toile peinte par Eugène Delacroix en
      1830… »'
  solution: 'La Liberté guidant le peuple est une huile sur toile d''Eugène Delacroix, peinte en 1830 et conservée au Louvre
    : elle appartient au champ des beaux-arts. Au premier plan, des corps gisent sur une barricade. Au centre, une femme au
    bonnet phrygien lève le drapeau tricolore et entraîne des combattants de milieux différents : un bourgeois en haut-de-forme,
    un gamin des rues. Au fond, les tours de Notre-Dame situent la scène à Paris. Cette femme est une allégorie de la Liberté
    : Delacroix célèbre la révolution de juillet 1830, où le peuple de Paris se soulève contre le roi Charles X.'
- id: nblm-quelle-est-la-caracteristique-essentiell-1
  type: choix
  difficulte: 2
  enonce: Quelle est la caractéristique essentielle d'une peinture à fresque ?
  reponse:
    options:
    - id: o1
      texte: Elle est réalisée sur un enduit encore frais, sur un mur ou un plafond.
    - id: o2
      texte: C'est n'importe quelle peinture murale de grande dimension.
    - id: o3
      texte: C'est une peinture réalisée avec des pigments mélangés à l'huile sur du bois.
    - id: o4
      texte: C'est une image imprimée à partir d'une plaque de métal creusée au burin.
    bonnes:
    - o1
  indices:
    relance: Pense au support mural particulier et à l'état du plâtre au moment de l'application.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : appeler « fresque » n''importe quelle grande peinture. La vraie fresque exige un enduit frais.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : ceci décrit la peinture à l''huile sur panneau et non la fresque.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ceci correspond à la définition d''une gravure.'
  solution: 'Elle est réalisée sur un enduit encore frais, sur un mur ou un plafond. C''est exact : les couleurs pénètrent
    l''enduit frais en séchant sur un mur ou un plafond.'
- id: nblm-comment-se-caracterise-une-sculpture-en-2
  type: choix
  difficulte: 2
  enonce: Comment se caractérise une sculpture en ronde-bosse, comme Le Penseur d'Auguste Rodin ?
  reponse:
    options:
    - id: o1
      texte: C'est une sculpture en trois dimensions dont le spectateur peut faire le tour.
    - id: o2
      texte: C'est une sculpture qui reste attachée à un fond et qui dépasse peu.
    - id: o3
      texte: C'est un dessin d'architecture gravé dans la pierre d'un bâtiment.
    - id: o4
      texte: C'est une figure conçue en bois courbé fabriquée en série pour le design.
    bonnes:
    - o1
  indices:
    relance: Observe si le spectateur peut se déplacer librement autour de la statue.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la sculpture qui se détache peu d''un fond est un bas-relief, pas une ronde-bosse.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la ronde-bosse est une œuvre sculptée en volume, pas un dessin architectural.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ceci fait référence au domaine des arts décoratifs et du design, pas à la sculpture classique.'
  solution: 'C''est une sculpture en trois dimensions dont le spectateur peut faire le tour. C''est juste : la ronde-bosse
    est un volume entièrement dégagé qu''on peut observer sous tous les angles.'
- id: nblm-la-frise-du-parthenon-d-athenes-est-un-r-3
  type: choix
  difficulte: 2
  enonce: La frise du Parthénon d'Athènes est un repère majeur de l'histoire des arts. À quelle catégorie de sculpture appartient-elle
    ?
  reponse:
    options:
    - id: o1
      texte: Un bas-relief, car la sculpture se détache peu du fond auquel elle reste attachée.
    - id: o2
      texte: Une ronde-bosse, car le spectateur peut en faire le tour complet.
    - id: o3
      texte: Une peinture à fresque réalisée sur du marbre frais.
    - id: o4
      texte: Une gravure au burin destinée à être imprimée sur du papier.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au fait que les figures restent rattachées au mur de pierre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : confondre bas-relief et ronde-bosse. Une frise murale ne permet pas d''en faire le tour.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : il s''agit d''une œuvre sculptée dans la pierre, pas d''une peinture.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la gravure est une technique d''impression, pas une sculpture monumentale.'
  solution: 'Un bas-relief, car la sculpture se détache peu du fond auquel elle reste attachée. C''est exact : la frise du
    Parthénon est un bas-relief sculpté qui se détache peu de son fond.'
- id: nblm-en-quoi-consiste-la-technique-de-la-grav-4
  type: choix
  difficulte: 2
  enonce: En quoi consiste la technique de la gravure au burin, utilisée par Albrecht Dürer pour son œuvre Melencolia I ?
  reponse:
    options:
    - id: o1
      texte: L'artiste creuse une plaque de métal avec un outil tranchant pour imprimer l'image en plusieurs exemplaires.
    - id: o2
      texte: L'artiste peint avec des pigments à l'huile sur une toile tendue sur un châssis.
    - id: o3
      texte: L'artiste coule du bronze liquide dans un moule pour former une statue.
    - id: o4
      texte: L'artiste dessine des plans de bâtiments destinés à la construction.
    bonnes:
    - o1
  indices:
    relance: Pense à l'outil métallique tranchant qui entaille une matrice pour multiplier les images.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ceci est la définition de la peinture à l''huile sur toile.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : ceci est une technique de fonderie de sculpture, pas de gravure.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ceci relève de l''architecture et non des arts graphiques.'
  solution: 'L''artiste creuse une plaque de métal avec un outil tranchant pour imprimer l''image en plusieurs exemplaires.
    C''est exact : la gravure au burin consiste à inciser le métal puis à encrer la plaque pour tirer des épreuves sur papier.'
