format: 2
notion: theme-5-lumieres-revolutions
version: 1
etat: verifiee
declencheurs:
- La Liberté guidant le peuple
- Radeau de la Méduse
- Serment des Horaces
- peinture néoclassique
- peintre romantique
- Salon de peinture
prerequis:
- analyse-critique-interpretation
- theme-4-etat-societe-modes-vie
couverture: Couvre le néoclassicisme et le romantisme, l'art comme expression politique (David, Goya, Delacroix), le Salon
  et la naissance de la critique d'art. La musique (Beethoven) et l'architecture néoclassique sont évoquées dans l'essentiel,
  sans exercice dédié.
essentiel: 'De 1750 à 1850, l''Europe vit le temps des Lumières puis des révolutions. L''art devient un moyen d''exprimer
  des idées politiques et de toucher un public plus large.


  Un public nouveau : à Paris, le Salon, exposition de peinture organisée au Louvre par l''Académie, attire des milliers de
  visiteurs. Des écrivains commentent les tableaux dans des journaux ou des revues : c''est la naissance de la critique d''art,
  avec Diderot à partir de 1759. Diderot et d''Alembert publient l''Encyclopédie (premier volume en 1751), qui diffuse les
  savoirs.


  Recours au passé : le néoclassicisme s''inspire de l''Antiquité grecque et romaine, avec des lignes nettes, des compositions
  calmes et des sujets de vertu et de courage. Jacques-Louis David peint Le Serment des Horaces (1784), puis, pendant la Révolution,
  La Mort de Marat (1793), et enfin Le Sacre de Napoléon (1805-1807). Des monuments comme le Panthéon de Paris ou l''Arc de
  triomphe de l''Étoile reprennent les formes antiques.


  Sensation et sensibilité : le romantisme, au début du XIXe siècle, privilégie l''émotion, le drame, les couleurs vives et
  le mouvement. Théodore Géricault peint Le Radeau de la Méduse (1818-1819) d''après un naufrage réel. Francisco de Goya dénonce
  la répression des Espagnols par les soldats de Napoléon dans Le Trois Mai 1808 (1814). Eugène Delacroix peint La Liberté
  guidant le peuple (1830) après les Trois Glorieuses, la révolution de juillet 1830.


  En musique, Beethoven compose sa Symphonie n° 3 « Héroïque » (1804), d''abord dédiée à Bonaparte, puis il retire cette dédicace
  quand celui-ci se fait empereur.

  '
methode:
- 'Identifier le mouvement : néoclassique (lignes nettes, modèle antique, calme) ou romantique (émotion, mouvement, couleurs,
  drame).'
- 'Repérer l''événement ou l''idée politique derrière l''œuvre : Révolution, Empire, révolution de 1830, guerre.'
- 'Dire la fonction : célébrer (un héros, un régime) ou dénoncer (une violence, une injustice).'
- 'Penser au public : l''œuvre a été montrée au Salon, commentée par des critiques.'
vocabulaire:
- terme: néoclassicisme
  definition: 'un mouvement artistique de la fin du XVIIIe siècle qui imite l''art antique : lignes nettes, calme, sujets
    de vertu'
- terme: romantisme
  definition: un mouvement du début du XIXe siècle qui met en avant l'émotion, l'imagination et le drame
- terme: Salon
  definition: la grande exposition officielle de peinture et de sculpture, organisée à Paris au Louvre
- terme: allégorie
  definition: une idée abstraite représentée par un personnage, comme la Liberté sous les traits d'une femme
erreurs_frequentes:
- 'Croire que La Liberté guidant le peuple représente la Révolution de 1789 : elle montre la révolution de juillet 1830.'
- 'Confondre néoclassicisme et romantisme : David est néoclassique, Géricault et Delacroix sont romantiques.'
- 'Oublier le public : à cette époque, les tableaux sont exposés au Salon et discutés dans la presse.'
- 'Prendre la femme au drapeau pour une vraie personne : c''est une allégorie de la Liberté.'
exemple:
  enonce: Explique en trois phrases ce qui distingue un tableau néoclassique d'un tableau romantique.
  solution: 'Un tableau néoclassique, comme Le Serment des Horaces de David (1784), imite l''Antiquité : les lignes sont nettes,
    la composition est calme et le sujet exalte la vertu. Un tableau romantique, comme Le Radeau de la Méduse de Géricault
    (1818-1819), cherche l''émotion : mouvement, contrastes d''ombre et de lumière, drame. Le premier parle surtout à la raison,
    le second aux sentiments.'
exercices:
- id: fonction-liberte
  type: choix
  difficulte: 1
  enonce: Eugène Delacroix peint La Liberté guidant le peuple en 1830, juste après les Trois Glorieuses, trois jours de révolution
    à Paris. Quelle est la fonction principale de ce tableau ?
  reponse:
    options:
    - id: a
      texte: Célébrer le peuple de Paris qui se soulève au nom de la liberté
    - id: b
      texte: Glorifier le roi Charles X
    - id: c
      texte: Vendre un produit au public
    - id: d
      texte: Montrer la vie paisible à la campagne
    bonnes:
    - a
  indices:
    relance: Qui est représenté en train d'avancer sur les barricades ?
    methode: Demande-toi si le peintre est du côté des insurgés ou du côté du pouvoir renversé.
    etape: Une femme tient le drapeau tricolore et entraîne des Parisiens de tous les milieux. Que veut faire le peintre ?
  pieges:
  - si:
      contient:
      - b
    relance: Charles X est justement le roi renversé en juillet 1830. Le tableau prend-il sa défense ?
  - si:
      contient:
      - c
    relance: C'est une peinture exposée au Salon, pas une publicité. Quel événement raconte-t-elle ?
  - si:
      contient:
      - d
    relance: Le tableau montre des barricades et des combats à Paris. Est-ce une scène paisible ?
  solution: Le tableau célèbre le peuple de Paris soulevé au nom de la liberté pendant les Trois Glorieuses (juillet 1830),
    qui renversent Charles X. La femme au drapeau est une allégorie de la Liberté.
- id: oeuvre-artiste
  type: association
  difficulte: 2
  enonce: Relie chaque tableau à son peintre.
  reponse:
    gauche:
    - id: a
      texte: Le Serment des Horaces (1784)
    - id: b
      texte: Le Radeau de la Méduse (1818-1819)
    - id: c
      texte: Le Trois Mai 1808 (1814)
    - id: d
      texte: La Liberté guidant le peuple (1830)
    droite:
    - id: w
      texte: Jacques-Louis David
    - id: x
      texte: Théodore Géricault
    - id: y
      texte: Francisco de Goya
    - id: z
      texte: Eugène Delacroix
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lequel de ces peintres est espagnol ? Lequel est le grand peintre néoclassique ?
    methode: Place d'abord le peintre espagnol (un événement en Espagne), puis le peintre néoclassique (un sujet antique).
    etape: 'Les Horaces sont des héros romains : c''est un sujet néoclassique. Il reste à départager les deux romantiques
      français.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux tableaux romantiques français.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : le Trois Mai 1808 montre un événement en Espagne, peint par un Espagnol.'
  solution: 'Le Serment des Horaces : David. Le Radeau de la Méduse : Géricault. Le Trois Mai 1808 : Goya. La Liberté guidant
    le peuple : Delacroix.'
- id: chronologie-lumieres
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: encyclopedie
      texte: Le premier volume de l'Encyclopédie de Diderot et d'Alembert
    - id: horaces
      texte: Le Serment des Horaces de David
    - id: sacre
      texte: Le Sacre de Napoléon de David
    - id: liberte
      texte: La Liberté guidant le peuple de Delacroix
  indices:
    relance: Laquelle de ces œuvres date d'avant la Révolution de 1789, en plein siècle des Lumières ?
    methode: 'Situe chaque œuvre par rapport à trois repères : la Révolution de 1789, l''Empire de Napoléon, la révolution
      de 1830.'
    etape: L'Encyclopédie commence en 1751. Napoléon est sacré empereur en 1804. Place les deux autres autour de ces repères.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux œuvres voisines sont inversées. Laquelle des deux est la plus ancienne ?
  - si:
      diagnostic: ordre_faux
    relance: Repère l'œuvre du milieu du XVIIIe siècle et celle qui suit la révolution de 1830, puis range les deux autres.
  solution: Encyclopédie (premier volume en 1751), Le Serment des Horaces (1784), Le Sacre de Napoléon (1805-1807), La Liberté
    guidant le peuple (1830).
- id: mot-neoclassicisme
  type: texte_court
  difficulte: 2
  enonce: Quel mouvement artistique de la fin du XVIIIe siècle, auquel appartient David, imite l'art de la Grèce et de la
    Rome antiques avec des lignes nettes et des sujets de vertu ?
  reponse:
    acceptees:
    - néoclassicisme
    - néo-classicisme
    - néoclassique
    - art néoclassique
    fautes_tolerees: 1
  indices:
    relance: L'art grec et romain est appelé l'art « classique ». Comment nommer un retour à cet art ?
    methode: Ajoute au mot « classicisme » un préfixe qui veut dire « nouveau ».
    etape: Le préfixe grec qui veut dire « nouveau » est « néo- ».
  pieges:
  - si:
      valeur: romantisme
    relance: Le romantisme vient après et privilégie l'émotion. Quel mouvement imite l'Antiquité ?
  - si:
      valeur: classicisme
    relance: 'Tu y es presque : le classicisme est l''art du XVIIe siècle. Pour son retour à la fin du XVIIIe siècle, quel
      préfixe ajouter ?'
  solution: 'Le néoclassicisme : il imite l''Antiquité (lignes nettes, composition calme, sujets de vertu), comme Le Serment
    des Horaces de David (1784).'
- id: mouvement-romantique
  type: choix
  difficulte: 2
  enonce: Le Radeau de la Méduse de Géricault montre des naufragés entassés sur un radeau, certains morts, d'autres tendus
    vers un bateau au loin, avec de forts contrastes d'ombre et de lumière. Quels traits font de ce tableau une œuvre romantique
    ?
  reponse:
    options:
    - id: a
      texte: L'émotion et le drame
    - id: b
      texte: Le mouvement et les contrastes de lumière
    - id: c
      texte: Un sujet tiré de la mythologie grecque
    - id: d
      texte: Une composition calme et immobile
    bonnes:
    - a
    - b
  indices:
    relance: 'Que ressent-on devant ces naufragés : du calme ou de l''angoisse ?'
    methode: Deux réponses sont justes. Élimine les traits qui décrivent plutôt le néoclassicisme.
    etape: Le sujet vient d'un naufrage réel de 1816. Élimine l'option qui parle d'un sujet antique, puis celle qui parle
      de calme.
  pieges:
  - si:
      contient:
      - c
    relance: Le naufrage de la Méduse est un fait réel de 1816, pas un mythe. Quelle option parle d'un sujet antique ?
  - si:
      contient:
      - d
    relance: Les corps se tordent et se tendent vers l'horizon. Est-ce calme ?
  - si:
      diagnostic: incomplet
    relance: C'est juste, mais il y a deux bonnes réponses. Laquelle manque ?
  solution: 'L''émotion et le drame, le mouvement et les contrastes de lumière sont des traits du romantisme. Le sujet est
    un naufrage réel de 1816, et la composition est agitée : ce n''est pas un tableau néoclassique.'
- id: analyse-liberte
  type: ouverte
  difficulte: 3
  enonce: Voici une œuvre décrite. Dans La Liberté guidant le peuple (1830), Eugène Delacroix peint une femme, le sein nu
    et coiffée d'un bonnet phrygien, qui brandit le drapeau tricolore au sommet d'une barricade. Autour d'elle avancent un
    bourgeois en chapeau haut-de-forme avec un fusil, un ouvrier armé d'un sabre, un jeune garçon avec des pistolets. Au premier
    plan, des corps de combattants morts. Au fond, dans la fumée, les tours de Notre-Dame. Décris ce tableau et explique son
    message, en le reliant à son contexte.
  criteres:
  - L'élève décrit le tableau avec des mots précis (allégorie, barricade, drapeau tricolore, composition en triangle, premier
    plan).
  - 'L''élève explique le message : le peuple de toutes les classes sociales, uni et guidé par la Liberté, se bat contre un
    pouvoir injuste.'
  - 'L''élève relie l''œuvre à son contexte : les Trois Glorieuses de juillet 1830 à Paris, et le romantisme (émotion, mouvement).'
  indices:
    relance: La femme au drapeau est-elle une vraie Parisienne, ou représente-t-elle une idée ?
    methode: Décris le centre, puis les personnages autour, puis le premier plan ; interprète ensuite ; termine par le contexte.
    etape: 'Tu peux commencer ainsi : « Ce tableau romantique d''Eugène Delacroix montre, en 1830, une femme qui représente
      la Liberté... »'
  solution: 'Ce tableau romantique d''Eugène Delacroix montre une femme qui représente la Liberté : c''est une allégorie,
    reconnaissable au bonnet phrygien et au drapeau tricolore. Elle entraîne des combattants de tous les milieux, un bourgeois,
    un ouvrier, un enfant : le peuple est uni. Les morts du premier plan rappellent la violence des combats. Le tableau célèbre
    les Trois Glorieuses de juillet 1830, qui renversent le roi Charles X. Le mouvement, les couleurs et l''émotion sont typiques
    du romantisme.'
