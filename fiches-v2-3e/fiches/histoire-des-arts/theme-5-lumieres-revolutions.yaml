    options:
    - id: o1
      texte: Le Serment des Horaces
    - id: o2
      texte: Le Radeau de la Méduse
    - id: o3
      texte: La Liberté guidant le peuple
    - id: o4
      texte: Le Trois Mai 1808
    bonnes:
    - o1
  indices:
    relance: Ce tableau s'inspire de l'histoire romaine et prône l'héroïsme et le sens du devoir.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
