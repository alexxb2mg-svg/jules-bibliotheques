  indices:
    relance: Pense aux modèles grecs et romains ainsi qu'à la clarté de la composition.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur de mouvement : la quête du drame et des émotions intenses est propre au romantisme.'
  - si:
      contient:
      - o4
    relance: 'Confusion : la primauté de la couleur expressive et du mouvement caractérise la peinture romantique.'
  solution: 'Des compositions calmes aux lignes nettes ; Des sujets inspirés de l''Antiquité prônant la vertu. C''est exact
    : le néoclassicisme privilégie la clarté du dessin, l''ordre et le calme de la composition.'
- id: nblm-quel-mouvement-artistique-du-debut-du-xi-7
  type: texte_court
  difficulte: 1
  enonce: Quel mouvement artistique du début du XIXe siècle privilégie l'émotion, le drame et le mouvement, représenté notamment
    par Géricault et Delacroix ?
  reponse:
    acceptees:
    - Romantisme
    fautes_tolerees: 1
  indices:
    relance: C'est le courant passionné qui s'oppose à la rigueur du néoclassicisme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Romantisme. C''est juste : le romantisme est le mouvement artistique axé sur la sensibilité et l''émotion.'
- id: nblm-quel-terme-designe-la-representation-d-u-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne la représentation d'une idée abstraite (comme la Liberté chez Delacroix) sous les traits d'un
    personnage humain ?
  reponse:
    acceptees:
    - Allégorie
    fautes_tolerees: 1
  indices:
    relance: C'est la figure artistique utilisée pour personnifier une valeur abstraite.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Allégorie. C''est juste : une allégorie est l''incarnation d''une notion abstraite par une figure humaine ou
    un symbole.'
- id: mot-diderot
  type: texte_court
  difficulte: 2
  enonce: Quel philosophe, qui dirige l'Encyclopédie avec d'Alembert, écrit à partir de 1759 des comptes rendus du Salon et
    invente ainsi la critique d'art ?
  reponse:
    acceptees:
    - Diderot
    - Denis Diderot
    fautes_tolerees: 1
  indices:
    relance: 'Cet écrivain ne peint pas : il raconte et juge les tableaux qu''il voit.'
    methode: Cherche, dans ta leçon, le nom associé à l'Encyclopédie et à la critique d'art.
    etape: Son nom commence par « Did- » et compte sept lettres.
  pieges:
  - si:
      valeur: d'Alembert
    relance: D'Alembert dirige l'Encyclopédie avec lui, mais c'est l'autre nom qui est lié aux comptes rendus du Salon.
  solution: 'Denis Diderot écrit ses comptes rendus du Salon à partir de 1759 : c''est la naissance de la critique d''art.'
- id: monuments-antiques
  type: choix
  difficulte: 2
  enonce: Quels monuments parisiens reprennent les formes de l'architecture antique à la fin du XVIIIe siècle et au début
    du XIXe siècle ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: Le Panthéon de Paris
    - id: b
      texte: L'Arc de triomphe de l'Étoile
    - id: c
      texte: La cathédrale de Chartres
    - id: d
      texte: Le Centre Pompidou
    bonnes:
    - a
    - b
  indices:
    relance: Quels bâtiments ont des colonnes ou des arcs qui rappellent Rome ou la Grèce ?
    methode: Deux monuments sont néoclassiques. Élimine celui du Moyen Âge et celui du XXe siècle.
    etape: La cathédrale de Chartres est gothique (Moyen Âge). Il reste à écarter un bâtiment moderne.
  pieges:
  - si:
      contient:
      - c
    relance: Chartres est une cathédrale gothique du Moyen Âge, pas un monument inspiré de l'Antiquité.
  - si:
      contient:
      - d
    relance: Le Centre Pompidou date de 1977, bien après la période étudiée.
  solution: 'Le Panthéon et l''Arc de triomphe de l''Étoile reprennent les formes antiques : c''est le néoclassicisme.'
