- id: nblm-quelle-revolution-est-representee-dans-l-4
  type: choix
  difficulte: 2
  enonce: Quelle révolution est représentée dans le tableau romantique La Liberté guidant le peuple d'Eugène Delacroix ?
  reponse:
    options:
    - id: o1
      texte: La révolution de juillet 1830 (les Trois Glorieuses)
    - id: o2
      texte: La Révolution française de 1789
    - id: o3
      texte: La prise de pouvoir par Napoléon en 1799
    - id: o4
      texte: La Révolution de 1848
    bonnes:
    - o1
  indices:
    relance: Attention à ne pas confondre la Révolution de 1789 avec les trois journées révolutionnaires de juillet 1830.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est l''erreur fréquente classique : le tableau évoque les Trois Glorieuses de juillet 1830 et non la Révolution
