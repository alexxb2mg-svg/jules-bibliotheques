format: 2
notion: champ-spectacle-vivant
version: 2
etat: verifiee
declencheurs:
- mise en scène d'une pièce
- livret d'opéra
- chorégraphie d'un ballet
- didascalie
- spectacle de marionnettes
- arts du cirque
- metteur en scène
- Guignol de Lyon
- concert d'orchestre
prerequis:
- decrire-oeuvre-lexique
- 4e-champ-spectacle-vivant
couverture: Présente le champ du spectacle vivant (musique, théâtre, opéra, danse, cirque, marionnette) et son vocabulaire
  de base. L'analyse musicale détaillée relève de l'éducation musicale et n'est pas traitée ici.
essentiel: 'Le spectacle vivant regroupe les arts qui se jouent devant un public, en direct : la musique, le théâtre, l''opéra,
  la danse, le cirque et la marionnette. L''œuvre n''existe pleinement qu''au moment de la représentation : chaque soir, elle
  est un peu différente.


  Plusieurs personnes créent ensemble. L''auteur écrit le texte ; le compositeur écrit la musique ; le metteur en scène décide
  du jeu des comédiens, des décors, des costumes et des lumières ; le chorégraphe invente les pas et les mouvements des danseurs
  ; les interprètes (comédiens, chanteurs, danseurs, musiciens, acrobates, marionnettistes) jouent devant le public.


  La musique : un orchestre réunit des familles d''instruments (cordes, vents, percussions) sous la direction d''un chef.
  Un concert se joue devant un public.


  Le théâtre : le texte contient des répliques, que disent les personnages, et des didascalies, indications de l''auteur sur
  les gestes, le ton ou le décor, qui ne sont pas prononcées. Une comédie fait rire ; une tragédie montre des héros face à
  un destin funeste.


  L''opéra est une œuvre de théâtre entièrement ou en grande partie chantée, accompagnée par un orchestre ; son texte s''appelle
  le livret. Le ballet est une œuvre de danse sur une musique, qui raconte souvent une histoire. La danse classique repose
  sur des gestes codifiés (les pointes) ; au XXe siècle, la danse moderne et contemporaine cherchent d''autres mouvements.


  Le cirque moderne naît à Londres au XVIIIe siècle avec Philip Astley. Il réunit acrobates, jongleurs, clowns et dresseurs,
  souvent sous un chapiteau. La marionnette est une figure animée par un artiste : à gaine (la main), à fils, etc. Guignol,
  marionnette à gaine créée à Lyon par Laurent Mourguet au début du XIXe siècle, en est un repère.


  Quelques repères : Le Bourgeois gentilhomme de Molière, avec une musique de Lully (comédie-ballet, 1670) ; Les Noces de
  Figaro de Mozart (opéra, 1786) ; Carmen de Georges Bizet (opéra, 1875) ; Le Lac des cygnes de Tchaïkovski (ballet, 1877)
  ; Cyrano de Bergerac d''Edmond Rostand (théâtre, 1897) ; Le Sacre du printemps, musique d''Igor Stravinsky et chorégraphie
  de Vaslav Nijinski (ballet, 1913).


  Au brevet, on attend que tu nommes la forme du spectacle, que tu identifies ses créateurs et sa date, que tu décrives la
  représentation (scène, décor, costumes, lumières, gestes) et que tu proposes une interprétation.

  '
methode:
- 'Nommer la forme du spectacle : pièce de théâtre, opéra, ballet, concert, spectacle de cirque ou de marionnettes.'
- 'Identifier les créateurs : auteur, compositeur, librettiste, chorégraphe, metteur en scène, et la date de création.'
- 'Décrire la représentation : lieu (scène, chapiteau, rue), décor, costumes, lumières, musique, gestes et déplacements des
  interprètes.'
- Distinguer l'œuvre écrite (texte, partition, livret) de sa mise en scène, qui change d'une représentation ou d'une époque
  à l'autre.
- Dire l'effet produit sur le public et proposer une interprétation.
- Pour un texte de théâtre, séparer les répliques (dites) des didascalies (non dites) avant de décrire le jeu.
vocabulaire:
- terme: mise en scène
  definition: 'ensemble des choix faits pour représenter une œuvre sur scène : jeu des interprètes, décor, costumes, lumières,
    son'
- terme: didascalie
  definition: indication de l'auteur dans le texte d'une pièce (gestes, ton, décor), qui n'est pas prononcée par les comédiens
- terme: livret
  definition: texte d'un opéra, écrit par un librettiste et mis en musique par le compositeur
- terme: chorégraphie
  definition: art de composer les pas et les mouvements d'une danse ; la danse ainsi composée
- terme: opéra
  definition: œuvre de théâtre chantée, accompagnée par un orchestre
- terme: ballet
  definition: œuvre de danse sur une musique, souvent pour raconter une histoire
- terme: metteur en scène
  definition: artiste qui décide du jeu, du décor, des costumes et des lumières d'un spectacle
- terme: chapiteau
  definition: grande tente sous laquelle se joue un spectacle de cirque
- terme: réplique
  definition: ce que dit un personnage dans une pièce de théâtre
erreurs_frequentes:
- 'Confondre l''auteur d''une pièce et le metteur en scène : Molière a écrit Le Bourgeois gentilhomme, mais chaque mise en
  scène actuelle est l''œuvre d''un autre artiste.'
- Confondre opéra (on y chante) et ballet (on y danse, sans paroles).
- 'Croire que les didascalies sont dites par les comédiens : elles guident le jeu, mais on ne les entend pas.'
- Oublier que le cirque et la marionnette font aussi partie du spectacle vivant.
exemple:
  enonce: Explique pourquoi Carmen de Georges Bizet appartient au champ du spectacle vivant.
  solution: 'Carmen est un opéra de Georges Bizet, créé à Paris en 1875. C''est une histoire jouée sur scène par des chanteurs,
    accompagnés par un orchestre, devant un public. Chaque représentation est unique et dépend de la mise en scène choisie
    : décors, costumes, jeu des chanteurs. C''est donc une œuvre du spectacle vivant.'
exercices:
- id: mot-didascalie
  type: texte_court
  difficulte: 1
  enonce: Dans le texte d'une pièce de théâtre, comment appelle-t-on les indications de l'auteur, souvent en italique, sur
    les gestes, le ton ou le décor, que les comédiens ne prononcent pas ?
  reponse:
    acceptees:
    - didascalie
    - didascalies
    fautes_tolerees: 1
  indices:
    relance: Dans ton livre, qu'y a-t-il entre parenthèses ou en italique, à côté des répliques des personnages ?
    methode: 'Une pièce contient deux sortes de texte : ce que disent les personnages (les répliques) et ce qui guide le jeu.
      Cherche le nom du second.'
    etape: Le mot vient du grec et signifie « enseignement ». Il commence par « didas ».
  pieges:
  - si:
      valeur: réplique
    relance: Une réplique est prononcée par un personnage. Ici, on cherche les indications qu'on ne prononce pas.
  - si:
      valeur: mise en scène
    relance: La mise en scène est le travail du metteur en scène. Mais comment s'appellent les indications écrites par l'auteur
      dans son texte ?
  solution: 'Ce sont les didascalies : des indications de l''auteur sur les gestes, le ton, le décor, que les comédiens ne
    disent pas.'
- id: mot-livret
  type: texte_court
  difficulte: 2
  enonce: Comment s'appelle le texte d'un opéra, écrit par un librettiste et mis en musique par le compositeur ?
  reponse:
    acceptees:
    - livret
    fautes_tolerees: 0
  indices:
    relance: L'auteur de ce texte s'appelle un « librettiste ». Quel mot se cache dans ce nom ?
    methode: Pense au petit livre que l'on vendait au public pour suivre les paroles pendant le spectacle.
    etape: C'est un mot de six lettres, un diminutif de « livre ».
  pieges:
  - si:
      valeur: partition
    relance: La partition, c'est la musique écrite par le compositeur. On cherche le texte des paroles.
  - si:
      valeur: scénario
    relance: Le scénario est le texte d'un film. Pour un opéra, quel mot emploie-t-on ?
  solution: C'est le livret. Par exemple, le livret des Noces de Figaro de Mozart a été écrit par Lorenzo Da Ponte.
- id: oeuvre-forme
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à la forme de spectacle vivant à laquelle elle appartient.
  reponse:
    gauche:
    - id: a
      texte: Cyrano de Bergerac, Edmond Rostand, 1897
    - id: b
      texte: Carmen, Georges Bizet, 1875
    - id: c
      texte: Le Lac des cygnes, Piotr Ilitch Tchaïkovski, 1877
    - id: d
      texte: Guignol, créé à Lyon par Laurent Mourguet au début du XIXe siècle
    droite:
    - id: w
      texte: théâtre (pièce jouée par des comédiens)
    - id: x
      texte: opéra (théâtre chanté avec orchestre)
    - id: y
      texte: ballet (danse sur une musique)
    - id: z
      texte: marionnette
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lequel de ces créateurs est un écrivain ? Lesquels sont des compositeurs de musique ?
    methode: 'Pour chaque œuvre, demande-toi ce que fait l''interprète sur scène : il parle, il chante, il danse, ou il anime
      un personnage ?'
    etape: 'Cyrano de Bergerac est une pièce en vers. Guignol est un personnage animé par la main d''un artiste. Il reste
      deux œuvres de compositeurs : l''une est chantée, l''autre dansée.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie les deux œuvres musicales : dans laquelle chante-t-on, dans laquelle
      danse-t-on ?'
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'écrivain et par le personnage animé à la main, puis départage les deux œuvres musicales.
  solution: Cyrano de Bergerac est une pièce de théâtre ; Carmen est un opéra ; Le Lac des cygnes est un ballet ; Guignol
    est une marionnette.
- id: classer-spectacle
  type: choix
  difficulte: 1
  enonce: Parmi ces œuvres, lesquelles appartiennent au champ du spectacle vivant ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: Carmen, Georges Bizet, 1875
    - id: b
      texte: Le Radeau de la Méduse, Théodore Géricault, 1818-1819
    - id: c
      texte: Le Sacre du printemps, Igor Stravinsky et Vaslav Nijinski, 1913
    - id: d
      texte: Le Voyage dans la Lune, Georges Méliès, 1902
    bonnes:
    - a
    - c
  indices:
    relance: 'Pour chaque œuvre, demande-toi : faut-il des interprètes en chair et en os devant un public pour qu''elle existe
      ?'
    methode: 'Cherche le domaine de chaque œuvre : un tableau et un film sont des œuvres fixées une fois pour toutes ; un
      opéra et un ballet se rejouent à chaque représentation.'
    etape: Le Radeau de la Méduse est accroché au Louvre. Le Voyage dans la Lune est projeté sur un écran. Et les deux autres
      ?
  pieges:
  - si:
      contient:
      - b
    relance: 'Le Radeau de la Méduse est un tableau : il appartient au champ des beaux-arts. Personne ne le joue sur scène.'
  - si:
      contient:
      - d
    relance: 'Le Voyage dans la Lune est un film : les acteurs ont été filmés une fois, puis on projette le film. À quel champ
      appartient-il ?'
  - si:
      diagnostic: incomplet
    relance: Il en manque une. Une œuvre dansée sur scène fait aussi partie du spectacle vivant.
  solution: Carmen (un opéra) et Le Sacre du printemps (un ballet) appartiennent au spectacle vivant. Le Radeau de la Méduse
    est une peinture (beaux-arts) et Le Voyage dans la Lune un film (cinéma).
- id: chronologie-spectacle
  type: ordre
  difficulte: 2
  enonce: Range ces créations de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: bourgeois
      texte: Le Bourgeois gentilhomme, comédie-ballet de Molière et Lully
    - id: noces
      texte: Les Noces de Figaro, opéra de Mozart
    - id: carmen
      texte: Carmen, opéra de Georges Bizet
    - id: sacre
      texte: Le Sacre du printemps, ballet de Stravinsky et Nijinski
  indices:
    relance: Lequel de ces créateurs a vécu à l'époque du roi Louis XIV ? Lequel a créé son œuvre au XXe siècle ?
    methode: Associe chaque œuvre à un siècle (XVIIe, XVIIIe, XIXe, XXe), puis range les siècles.
    etape: Molière écrit pour Louis XIV, au XVIIe siècle. Mozart meurt à la fin du XVIIIe siècle. Où se placent les deux autres
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux créations voisines sont inversées. Retrouve le siècle de chacune.'
  - si:
      diagnostic: ordre_faux
    relance: Place d'abord l'œuvre du XVIIe siècle et celle du XXe siècle, puis range les deux autres entre elles.
  solution: Le Bourgeois gentilhomme (1670), Les Noces de Figaro (1786), Carmen (1875), Le Sacre du printemps (1913).
- id: analyse-sacre
  type: ouverte
  difficulte: 3
  enonce: 'Voici la description d''une création. Le 29 mai 1913, au théâtre des Champs-Élysées à Paris, les Ballets russes
    de Serge Diaghilev présentent Le Sacre du printemps : musique d''Igor Stravinsky, chorégraphie de Vaslav Nijinski. La
    musique est très rythmée, avec des accents brutaux. Les danseurs, en costumes inspirés de la Russie ancienne, sautent
    lourdement, les pieds tournés vers l''intérieur. L''histoire évoque un rite païen où une jeune fille danse jusqu''à la
    mort. Pendant la représentation, une partie du public siffle et crie : c''est un scandale. Présente et analyse ce spectacle
    en quelques phrases.'
  criteres:
  - L'élève situe l'œuvre dans le spectacle vivant et précise sa forme (un ballet), avec les créateurs (compositeur, chorégraphe)
    et la date.
  - L'élève emploie le vocabulaire du champ (chorégraphie, représentation, costumes, musique, public) pour décrire ce qui
    se passe sur scène.
  - 'L''élève explique le scandale : musique et danse rompent avec le ballet classique que le public attend (pointes, gestes
    gracieux).'
  indices:
    relance: À quoi le public de 1913 s'attend-il quand il vient voir un ballet ? Qu'est-ce qui le surprend ici ?
    methode: Présente l'œuvre (forme, créateurs, date, lieu), décris la musique puis la danse, et explique la réaction du
      public.
    etape: 'Tu peux commencer ainsi : « Le Sacre du printemps est un ballet créé à Paris en 1913 par les Ballets russes… »'
  solution: 'Le Sacre du printemps est un ballet, donc une œuvre du spectacle vivant, créé à Paris le 29 mai 1913 par les
    Ballets russes, sur une musique d''Igor Stravinsky et une chorégraphie de Vaslav Nijinski. La musique est violente et
    très rythmée ; les danseurs sautent lourdement, pieds en dedans, loin des gestes gracieux et des pointes du ballet classique.
    Le sujet, un sacrifice païen, est lui aussi inattendu. Le public, choqué, siffle : ce scandale montre que l''œuvre rompt
    avec les habitudes et ouvre la danse moderne.'
- id: nblm-au-theatre-quel-est-le-role-principal-du-1
  type: choix
  difficulte: 2
  enonce: Au théâtre, quel est le rôle principal du metteur en scène lors de la création d'un spectacle ?
  reponse:
    options:
    - id: o1
      texte: Décider du jeu des comédiens, des décors, des costumes, des lumières et du son
    - id: o2
      texte: Écrire le texte intégral et la suite des répliques des personnages
    - id: o3
      texte: Composer la musique d'accompagnement jouée par l'orchestre
    - id: o4
      texte: Créer uniquement les pas et les mouvements des danseurs
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la personne qui orchestre la représentation visuelle et le jeu des comédiens sur le plateau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : c''est l''auteur qui rédige le texte théâtral, non le metteur en scène.'
  - si:
      contient:
      - o3
    relance: La création de la musique est confiée au compositeur.
  - si:
      contient:
      - o4
    relance: La création des pas de danse relève du travail du chorégraphe.
  solution: 'Décider du jeu des comédiens, des décors, des costumes, des lumières et du son. C''est exact : le metteur en
    scène orchestre l''ensemble des choix artistiques et scéniques pour représenter l''œuvre sur plateau.'
- id: nblm-comment-appelle-t-on-le-texte-ecrit-d-un-2
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on le texte écrit d'un opéra, rédigé par un librettiste et mis en musique par un compositeur ?
  reponse:
    options:
    - id: o1
      texte: Le livret
    - id: o2
      texte: La partition
    - id: o3
      texte: La didascalie
    - id: o4
      texte: La chorégraphie
    bonnes:
    - o1
  indices:
    relance: Ce mot désigne l'ouvrage littéraire qui sert de base au texte chanté dans un opéra.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La partition regroupe les notes et la musique écrites par le compositeur, pas le texte littéraire.
  - si:
      contient:
      - o3
    relance: Une didascalie est une indication scénique non prononcée dans une pièce de théâtre.
  - si:
      contient:
      - o4
    relance: La chorégraphie désigne la composition des mouvements de danse, pas un texte littéraire.
  solution: 'Le livret. C''est la bonne réponse : le livret contient tout le texte chanté ou parlé d''un opéra.'
- id: nblm-dans-le-cadre-d-un-ballet-en-quoi-consis-3
  type: choix
  difficulte: 2
  enonce: Dans le cadre d'un ballet, en quoi consiste la chorégraphie ?
  reponse:
    options:
    - id: o1
      texte: L'art de composer les pas et les mouvements des danseurs sur une musique
    - id: o2
      texte: L'écriture du texte chanté par les solistes
    - id: o3
      texte: La fabrication matérielle des marionnettes et de leurs décors
    - id: o4
      texte: La direction instrumentale de l'orchestre pendant la représentation
    bonnes:
    - o1
  indices:
    relance: Pense au travail de création centré sur les mouvements du corps et la danse.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un ballet est une œuvre de danse sur musique, généralement sans paroles ni chant.
  - si:
      contient:
      - o3
    relance: Cela concerne l'art de la marionnette, pas la danse.
  - si:
      contient:
      - o4
    relance: La direction de l'orchestre est assurée par le chef d'orchestre.
  solution: 'L''art de composer les pas et les mouvements des danseurs sur une musique. C''est exact : la chorégraphie est
    la création structurée des mouvements dansés.'
- id: nblm-au-theatre-quelle-est-la-specificite-des-4
  type: choix
  difficulte: 2
  enonce: Au théâtre, quelle est la spécificité des didascalies dans le texte d'une pièce ? [2-4]
  reponse:
    options:
    - id: o1
      texte: Ce sont des indications de l'auteur (gestes, ton, décor) qui ne sont pas prononcées par les comédiens
    - id: o2
      texte: Ce sont les paroles que les comédiens doivent déclamer à voix haute
    - id: o3
      texte: Ce sont les morceaux de musique joués entre les actes
    - id: o4
      texte: Ce sont les interventions chantées par le chœur dans un opéra
    bonnes:
    - o1
  indices:
    relance: Ces indications écrites par l'auteur donnent des consignes mais restent silencieuses sur scène.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Les paroles dites par les comédiens sont appelées des répliques.
  - si:
      contient:
      - o3
    relance: Les didascalies sont des indications textuelles écrites, pas de la musique.
  - si:
      contient:
      - o4
    relance: Il s'agit là d'éléments du livret d'opéra, pas de didascalies théâtrales.
  solution: 'Ce sont des indications de l''auteur (gestes, ton, décor) qui ne sont pas prononcées par les comédiens. C''est
    juste : elles servent à guider la mise en scène et le jeu sans être dites sur scène.'
- id: nblm-quel-personnage-emblematique-cree-a-lyon-5
  type: choix
  difficulte: 2
  enonce: Quel personnage emblématique, créé à Lyon au début du XIXe siècle par Laurent Mourguet, constitue un repère majeur
    pour le spectacle de marionnettes ?
  reponse:
    options:
    - id: o1
      texte: Guignol
    - id: o2
      texte: Cyrano
    - id: o3
      texte: Figaro
    - id: o4
      texte: Carmen
    bonnes:
    - o1
  indices:
    relance: Cherche le nom de la marionnette en bois originaire de la région lyonnaise.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Cyrano de Bergerac est le héros d'une pièce de théâtre écrite par Edmond Rostand.
  - si:
      contient:
      - o3
    relance: Figaro est le personnage principal de l'opéra Les Noces de Figaro de Mozart.
  - si:
      contient:
      - o4
    relance: Carmen est l'héroïne de l'opéra éponyme composé par Georges Bizet.
  solution: 'Guignol. C''est exact : Guignol est la marionnette lyonnaise la plus célèbre de l''histoire du théâtre populaire.'
- id: nblm-parmi-les-propositions-suivantes-quelles-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes, quelles sont les deux caractéristiques ou formes d'art qui appartiennent au champ
    du spectacle vivant ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Les arts du cirque (incluant les prouesses des acrobates)
    - id: o2
      texte: Le fait que chaque représentation se déroule en direct et soit un peu différente chaque soir
    - id: o3
      texte: La projection d'un film de cinéma muet en salle
    - id: o4
      texte: La sculpture en ronde-bosse exposée dans un musée
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux prestations qui se déroulent en direct face au public et aux disciplines associées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Attention : le cinéma appartient au champ de la photographie et du cinéma (images enregistrées).'
  - si:
      contient:
      - o4
    relance: La sculpture fait partie du champ des Beaux-Arts (art de l'espace).
  solution: 'Les arts du cirque (incluant les prouesses des acrobates) ; Le fait que chaque représentation se déroule en direct
    et soit un peu différente chaque soir. C''est juste : le cirque est une forme majeure du spectacle vivant joué en direct
    devant un public.'
- id: nblm-quel-terme-designe-l-art-de-composer-les-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne l'art de composer les pas et les mouvements d'un ballet ou d'un spectacle de danse ?
  reponse:
    acceptees:
    - chorégraphie
    fautes_tolerees: 1
  indices:
    relance: Ce terme commence par les lettres 'choré'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: chorégraphie. Bravo ! La chorégraphie désigne la création et l'enchaînement des pas de danse.
- id: nblm-quel-terme-designe-l-indication-ecrite-p-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne l'indication écrite par l'auteur dans le texte d'une pièce pour guider le jeu ou le décor sans
    être prononcée sur scène ?
  reponse:
    acceptees:
    - didascalie
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne les remarques scéniques écrites par l'auteur dramatique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: didascalie. Parfait ! La didascalie est l'indication scénique écrite destinée à la mise en scène.
- id: mot-choregraphe
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'artiste qui invente les pas et les mouvements d'un ballet ?
  reponse:
    acceptees:
    - chorégraphe
    - chorégraphes
    fautes_tolerees: 1
  indices:
    relance: 'Ce n''est pas celui qui danse : c''est celui qui compose la danse à l''avance.'
    methode: Pour la musique, le créateur s'appelle le compositeur. Cherche le mot qui joue le même rôle pour la danse.
    etape: Le mot vient du grec « choros » (la danse) et commence par « chor ».
  pieges:
  - si:
      valeur: danseur
    relance: Le danseur interprète les mouvements devant le public. Qui les a inventés avant lui ?
  - si:
      valeur: metteur en scène
    relance: Le metteur en scène dirige l'ensemble du spectacle. On cherche celui qui invente précisément la danse.
  solution: C'est le chorégraphe. Par exemple, Vaslav Nijinski est le chorégraphe du Sacre du printemps.
- id: qui-fait-quoi
  type: association
  difficulte: 2
  enonce: Relie chaque tâche à la personne qui l'accomplit dans un spectacle vivant.
  reponse:
    gauche:
    - id: a
      texte: Écrit le texte d'une pièce
    - id: b
      texte: Écrit la musique d'un opéra
    - id: c
      texte: Décide du décor, des costumes et de la façon de jouer
    - id: d
      texte: Joue ou chante devant le public
    droite:
    - id: w
      texte: L'auteur
    - id: x
      texte: Le compositeur
    - id: y
      texte: Le metteur en scène
    - id: z
      texte: L'interprète
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Deux tâches se passent avant le spectacle, une pendant la préparation, une devant le public. Commence par la
      dernière.
    methode: 'Pour chaque tâche, cherche le métier dont le nom la décrit : écrire un texte, composer de la musique, mettre
      en scène, interpréter.'
    etape: Le compositeur compose de la musique. Qui écrit les mots ? Et qui organise tout le reste ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Relis le nom de chaque métier : il dit souvent ce qu''on fait.'
  - si:
      diagnostic: associations_fausses
    relance: Place d'abord celui qui joue devant le public et celui qui écrit la musique, puis les deux autres.
  solution: L'auteur écrit le texte ; le compositeur écrit la musique ; le metteur en scène décide du décor, des costumes
    et du jeu ; l'interprète joue ou chante devant le public.
