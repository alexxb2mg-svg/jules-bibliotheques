format: 2
notion: theme-4-etat-societe-modes-vie
version: 2
etat: verifiee
declencheurs:
- hiérarchie des genres
- galerie des Glaces
- portrait de Louis XIV
- ballet de cour
- scène de genre
prerequis:
- decrire-oeuvre-lexique
- theme-3-sacre-artiste
couverture: Couvre la hiérarchie des genres et l'Académie, le portrait royal, le paysage et la nature morte, Versailles et
  la danse de cour. Les bestiaires, les classifications savantes et le lien entre sciences et arts ne sont évoqués que dans
  l'essentiel.
essentiel: 'Du XIIIe au XVIIIe siècle, l''art reflète l''organisation de la société et la puissance de l''État, surtout celle
  du roi.


  En France, l''Académie royale de peinture et de sculpture est fondée en 1648. Elle forme les artistes et fixe des règles,
  dont une hiérarchie des genres. Du plus prestigieux au moins prestigieux : la peinture d''histoire (sujets religieux, mythologiques
  ou historiques), le portrait, puis des genres jugés plus modestes comme la scène de genre (la vie quotidienne), le paysage
  et, tout en bas, la nature morte (objets, fruits, fleurs, gibier).


  Le portrait royal sert le pouvoir : Hyacinthe Rigaud peint Louis XIV en costume de sacre (1701), en manteau fleurdelisé,
  avec la couronne, le sceptre et l''épée.


  Le roi fait aussi de son palais un modèle. À Versailles, où la cour s''installe en 1682, la galerie des Glaces (1678-1684)
  célèbre ses victoires, et les jardins d''André Le Nôtre dessinent une nature ordonnée. L''habitat, le décor et le mobilier
  des nobles copient ce goût.


  Les modes de vie apparaissent aussi dans les scènes de genre, comme La Laitière de Vermeer (vers 1658), et le rapport à
  la nature change : Pieter Bruegel l''Ancien peint Les Chasseurs dans la neige (1565), Chardin peint La Raie (1728), une
  nature morte. Les savants décrivent et classent les animaux et les plantes.


  La danse va de la danse populaire, dans les villages, à la danse de cour, codifiée. Louis XIV danse lui-même : en 1653,
  à 14 ans, il incarne le Soleil levant dans le Ballet royal de la Nuit. Lully et Molière créent des comédies-ballets comme
  Le Bourgeois gentilhomme (1670).

  '
methode:
- 'Identifier le genre de l''œuvre : histoire, portrait, scène de genre, paysage ou nature morte.'
- Chercher qui commande l'œuvre (le roi, un noble, un bourgeois) et pour quoi faire.
- 'Relever les symboles du pouvoir : couronne, sceptre, fleurs de lys, décor grandiose.'
- 'Relier l''œuvre à la société de son temps : cour, ville, campagne.'
vocabulaire:
- terme: académie
  definition: une institution qui réunit et forme les artistes et fixe les règles de l'art officiel
- terme: genre (en peinture)
  definition: 'une catégorie de tableaux selon leur sujet : histoire, portrait, scène de genre, paysage, nature morte'
- terme: scène de genre
  definition: un tableau qui montre une scène de la vie quotidienne de gens ordinaires
- terme: nature morte
  definition: 'un tableau qui représente des objets inanimés : fruits, fleurs, vaisselle, gibier'
erreurs_frequentes:
- 'Croire que tous les genres se valent pour l''Académie : la peinture d''histoire est au sommet, la nature morte en bas.'
- 'Confondre portrait et scène de genre : un portrait montre une personne précise, une scène de genre montre des anonymes
  au quotidien.'
- Oublier que le portrait du roi est un outil de pouvoir, pas une simple ressemblance.
- 'Croire que la danse de cour est un simple loisir : sous Louis XIV, elle montre la place de chacun et la gloire du roi.'
exemple:
  enonce: Explique en trois phrases ce qu'est la hiérarchie des genres.
  solution: La hiérarchie des genres est un classement des sujets de peinture fixé par l'Académie royale de peinture et de
    sculpture, fondée en 1648. Au sommet se trouve la peinture d'histoire, qui demande de l'imagination et du savoir, puis
    le portrait. Viennent ensuite des genres jugés plus modestes, comme la scène de genre et le paysage, et tout en bas la
    nature morte.
exercices:
- id: fonction-portrait-royal
  type: choix
  difficulte: 1
  enonce: Dans son portrait de 1701, Hyacinthe Rigaud peint Louis XIV en pied, dans un immense manteau bleu à fleurs de lys
    doublé d'hermine, avec la couronne, le sceptre et l'épée. Quelle est la fonction principale de ce tableau ?
  reponse:
    options:
    - id: a
      texte: Célébrer la puissance et la majesté du roi
    - id: b
      texte: Dénoncer les dépenses du roi
    - id: c
      texte: Montrer la vie quotidienne des paysans
    - id: d
      texte: Vendre des vêtements de luxe
    bonnes:
    - a
  indices:
    relance: Qui a commandé ce tableau, à ton avis, et qu'est-ce que le roi veut qu'on pense de lui ?
    methode: 'Relève les objets du tableau : à quoi servent la couronne, le sceptre, l''épée ?'
    etape: Ces objets sont les symboles du pouvoir royal, reçus lors du sacre. Que veut donc montrer l'image ?
  pieges:
  - si:
      contient:
      - b
    relance: 'Un peintre officiel du roi pouvait-il le critiquer ? Regarde le ton du tableau : moqueur ou grandiose ?'
  - si:
      contient:
      - c
    relance: Le personnage est le roi en habit de sacre, pas un paysan. Que veut-il montrer ?
  - si:
      contient:
      - d
    relance: La publicité n'existe pas encore sous cette forme. Ce portrait est une image du pouvoir.
  solution: 'Ce portrait célèbre la puissance et la majesté du roi : les regalia (couronne, sceptre, épée) et le manteau fleurdelisé
    rappellent qu''il est roi de droit divin. C''est une image officielle du pouvoir.'
- id: hierarchie-genres
  type: ordre
  difficulte: 2
  enonce: Range ces genres de peinture du plus prestigieux au moins prestigieux, selon l'Académie royale au XVIIe siècle.
  reponse:
    elements:
    - id: histoire
      texte: La peinture d'histoire (sujets religieux, mythologiques, historiques)
    - id: portrait
      texte: Le portrait
    - id: paysage
      texte: Le paysage
    - id: nature
      texte: La nature morte
  indices:
    relance: Pour l'Académie, peindre des êtres humains est-il plus noble que peindre des objets ?
    methode: Plus le sujet demande d'imagination, de savoir et de figures humaines, plus il est prestigieux.
    etape: Le genre le moins prestigieux représente des objets immobiles. Lequel est tout en haut, avec de grands récits ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux genres voisins sont inversés. Lequel des deux montre des êtres humains ?
  - si:
      diagnostic: ordre_faux
    relance: Place d'abord le genre le plus noble (de grands récits) et le plus modeste (des objets), puis les deux autres.
  solution: Peinture d'histoire, portrait, paysage, nature morte. La scène de genre, elle aussi jugée modeste, se place entre
    le portrait et la nature morte.
- id: oeuvre-genre
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à son genre.
  reponse:
    gauche:
    - id: a
      texte: 'Vermeer, La Laitière (vers 1658) : une servante verse du lait dans une cuisine'
    - id: b
      texte: Rigaud, Louis XIV en costume de sacre (1701)
    - id: c
      texte: 'Bruegel l''Ancien, Les Chasseurs dans la neige (1565) : une vallée enneigée, un village, des patineurs'
    - id: d
      texte: 'Chardin, La Raie (1728) : un poisson suspendu, des huîtres, un chat, des ustensiles'
    droite:
    - id: w
      texte: Scène de genre
    - id: x
      texte: Portrait
    - id: y
      texte: Paysage
    - id: z
      texte: Nature morte
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lequel de ces tableaux montre une personne précise, que l'on peut nommer ?
    methode: 'Pour chaque tableau, demande-toi : une personne connue, une scène de tous les jours, un lieu, ou des objets
      ?'
    etape: Le roi est une personne précise. La servante de Vermeer est anonyme. Continue avec les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Regarde ce qui occupe le plus de place dans chaque tableau.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : le roi Louis XIV est une personne précise. Place ensuite les autres.'
  solution: 'La Laitière : scène de genre. Louis XIV en costume de sacre : portrait. Les Chasseurs dans la neige : paysage.
    La Raie : nature morte (le chat vivant est un détail ; le sujet principal, ce sont les objets et le poisson).'
- id: mot-academie
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on l'institution royale fondée en France en 1648 pour former les peintres et les sculpteurs et
    fixer les règles de l'art ?
  reponse:
    acceptees:
    - académie
    - Académie royale
    - Académie royale de peinture et de sculpture
    fautes_tolerees: 1
  indices:
    relance: Aujourd'hui encore, des institutions de ce nom réunissent des écrivains ou des savants sous une coupole, à Paris.
    methode: Le mot vient d'un jardin d'Athènes où enseignait le philosophe Platon.
    etape: Le mot commence par « acad- ».
  pieges:
  - si:
      valeur: école des beaux-arts
    relance: L'École des beaux-arts viendra plus tard. Quel nom porte l'institution royale créée en 1648 ?
  - si:
      valeur: salon
    relance: Le Salon est l'exposition organisée par cette institution. Quel est le nom de l'institution elle-même ?
  solution: L'Académie royale de peinture et de sculpture, fondée en 1648. Elle forme les artistes, organise le Salon et fixe
    la hiérarchie des genres.
- id: danse-louis-xiv
  type: choix
  difficulte: 2
  enonce: En 1653, à 14 ans, Louis XIV apparaît dans le Ballet royal de la Nuit dans le rôle du Soleil levant. Que montre
    cet épisode ?
  reponse:
    options:
    - id: a
      texte: La danse de cour sert à mettre en scène la gloire du roi
    - id: b
      texte: Le roi se moque de la danse populaire
    - id: c
      texte: La danse est interdite à la cour
    bonnes:
    - a
  indices:
    relance: Quel surnom Louis XIV a-t-il reçu, et quel astre évoque-t-il ?
    methode: Demande-toi pourquoi un roi choisit de danser lui-même, en public, un rôle lumineux.
    etape: Le Soleil éclaire tout, comme le roi est placé au centre de la cour. Quel message le ballet transmet-il ?
  pieges:
  - si:
      contient:
      - b
    relance: 'Le ballet n''a rien d''une moquerie : c''est un spectacle somptueux. Que dit-il du roi ?'
  - si:
      contient:
      - c
    relance: Si la danse était interdite, le roi danserait-il lui-même devant la cour ?
  solution: La danse de cour met en scène la gloire du roi. En dansant le Soleil, Louis XIV se présente comme le centre de
    la cour et du royaume ; il gardera le surnom de Roi-Soleil.
- id: analyse-portrait-louis-xiv
  type: ouverte
  difficulte: 3
  enonce: Voici une œuvre décrite. Dans Louis XIV en costume de sacre (1701), Hyacinthe Rigaud peint le roi debout, en pied,
    dans un décor de palais avec une colonne et un rideau rouge. Il porte un immense manteau bleu semé de fleurs de lys, doublé
    d'hermine blanche. Il tient le sceptre, la couronne est posée à côté de lui et l'épée est à sa ceinture. Il regarde le
    spectateur de haut. Décris ce portrait et explique ce qu'il veut montrer, en le reliant au règne de Louis XIV.
  criteres:
  - L'élève décrit le tableau avec des mots précis (portrait en pied, manteau fleurdelisé, hermine, sceptre, couronne, décor).
  - L'élève explique que les symboles montrent un roi tout-puissant, choisi par Dieu (monarchie absolue de droit divin).
  - 'L''élève relie l''œuvre à son contexte : un portrait officiel commandé à la fin du règne de Louis XIV, dans la tradition
    de l''art au service du pouvoir (Versailles, Académie).'
  indices:
    relance: Pourquoi le roi porte-t-il son costume du sacre, et non un habit de tous les jours ?
    methode: Décris (pose, vêtements, objets, décor), puis interprète chaque symbole, puis situe l'œuvre.
    etape: 'Tu peux commencer ainsi : « Ce portrait officiel peint par Rigaud en 1701 montre Louis XIV debout... »'
  solution: 'Ce portrait officiel peint par Rigaud en 1701 montre Louis XIV debout, en pied, dans un décor de palais. Il porte
    le manteau bleu à fleurs de lys doublé d''hermine du sacre, et il est entouré des regalia : sceptre, couronne, épée. Ces
    symboles rappellent que son pouvoir vient de Dieu et qu''il commande seul : c''est la monarchie absolue. Son regard de
    haut impose le respect. Comme Versailles, ce tableau est un instrument de la gloire du roi.'
- id: nblm-selon-la-hierarchie-des-genres-etablie-e-1
  type: choix
  difficulte: 2
  enonce: Selon la hiérarchie des genres établie en 1648 par l'Académie royale, quel genre pictural est considéré comme le
    plus prestigieux, situé tout au sommet ?
  reponse:
    options:
    - id: o1
      texte: La peinture d'histoire
    - id: o2
      texte: Le portrait
    - id: o3
      texte: La scène de genre
    - id: o4
      texte: La nature morte
    bonnes:
    - o1
  indices:
    relance: Pense au genre qui illustre les grands récits religieux, mythologiques ou historiques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : la scène de genre représente la vie quotidienne et fait partie des genres jugés plus modestes.'
  - si:
      contient:
      - o4
    relance: 'Faux : la nature morte se trouve tout en bas de la hiérarchie fixée par l''Académie.'
  solution: 'La peinture d''histoire. C''est exact : la peinture d''histoire (sujets religieux, mythologiques ou historiques)
    exige du savoir et de l''imagination, ce qui la place au sommet.'
- id: nblm-en-1701-hyacinthe-rigaud-peint-le-portra-2
  type: choix
  difficulte: 2
  enonce: En 1701, Hyacinthe Rigaud peint le portrait officiel de Louis XIV en costume de sacre. Quelle est la fonction principale
    de cette œuvre ?
  reponse:
    options:
    - id: o1
      texte: Servir d'outil de pouvoir et glorifier la monarchie absolue
    - id: o2
      texte: Proposer une simple ressemblance physique sans mise en scène politique
    - id: o3
      texte: Illustrer une scène de genre de la vie quotidienne de la cour
    - id: o4
      texte: Représenter une légende mythologique pour le Salon de l'Académie
    bonnes:
    - o1
  indices:
    relance: Observes les symboles politiques présents sur le tableau comme la couronne et le sceptre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le portrait du roi n''est pas qu''une recherche d''exactitude physique, c''est avant tout
      un instrument de propagande politique.'
  - si:
      contient:
      - o3
    relance: 'Faux : une scène de genre montre des anonymes dans la vie quotidienne, alors qu''il s''agit d''un portrait royal
      officiel.'
  - si:
      contient:
      - o4
    relance: 'Faux : il s''agit d''un portrait de pouvoir visant à célébrer le roi, et non d''une peinture d''histoire mythologique.'
  solution: 'Servir d''outil de pouvoir et glorifier la monarchie absolue. C''est juste : le portrait royal montre le monarque
    avec les symboles du pouvoir (couronne, sceptre, manteau fleurdelisé) pour affirmer sa puissance.'
- id: nblm-situee-au-palais-de-versailles-que-celeb-3
  type: choix
  difficulte: 2
  enonce: Située au palais de Versailles, que célèbre principalement la galerie des Glaces réalisée entre 1678 et 1684 ?
  reponse:
    options:
    - id: o1
      texte: Les victoires militaires de Louis XIV
    - id: o2
      texte: La vie quotidienne et le travail des paysans
    - id: o3
      texte: La fondation de l'Académie royale de peinture
    - id: o4
      texte: Les découvertes scientifiques sur la classification des plantes
    bonnes:
    - o1
  indices:
    relance: Recherche l'élément qui contribue directement à la gloire politique et militaire du roi.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : la vie du peuple relève des scènes de genre, pas du décor d''un palais royal.'
  - si:
      contient:
      - o3
    relance: 'Faux : l''Académie a été créée en 1648, bien avant l''aménagement de la galerie des Glaces.'
  - si:
      contient:
      - o4
    relance: 'Faux : les recherches des savants concernent les sciences, alors que la galerie a un programme d''exaltation
      politique.'
  solution: 'Les victoires militaires de Louis XIV. C''est exact : le décor grandiose de la galerie des Glaces a été conçu
    pour glorifier les victoires du Roi-Soleil.'
- id: nblm-quel-role-le-jeune-louis-xiv-incarne-t-i-4
  type: choix
  difficulte: 2
  enonce: Quel rôle le jeune Louis XIV incarne-t-il en 1653, à l'âge de 14 ans, dans le Ballet royal de la Nuit ?
  reponse:
    options:
    - id: o1
      texte: Le Soleil levant
    - id: o2
      texte: Un paysan pratiquant une danse populaire
    - id: o3
      texte: Un comédien anonyme de théâtre de foire
    - id: o4
      texte: Un empereur romain de l'Antiquité
    bonnes:
    - o1
  indices:
    relance: Pense au surnom le plus célèbre attribué à ce monarque français.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : la danse de cour est codifiée et sert à théâtraliser le pouvoir de la personne royale.'
  - si:
      contient:
      - o3
    relance: 'Faux : le monarque participe lui-même à ce ballet de cour dans un rôle allégorique central.'
  - si:
      contient:
      - o4
    relance: 'Faux : même si le symbole est grandiose, le rôle interprété est précisément l''incarnation du Soleil levant.'
  solution: 'Le Soleil levant. C''est exact : cette prestation scénique est à l''origine de son célèbre surnom de Roi-Soleil.'
- id: nblm-quelle-est-la-definition-exacte-d-une-sc-5
  type: choix
  difficulte: 2
  enonce: Quelle est la définition exacte d'une scène de genre selon l'Académie royale ?
  reponse:
    options:
    - id: o1
      texte: Un tableau montrant une scène de la vie quotidienne de personnages anonymes
    - id: o2
      texte: Un portrait officiel d'un roi ou d'un grand personnage historique
    - id: o3
      texte: Une peinture composée uniquement d'objets inanimés, de fleurs ou de fruits
    - id: o4
      texte: Une grande fresque représentant des événements de l'Antiquité
    bonnes:
    - o1
  indices:
    relance: Souviens-toi de la différence entre représenter un personnage célèbre et représenter la vie ordinaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la représentation d''un personnage précis et identifiable est un portrait, pas une scène
      de genre.'
  - si:
      contient:
      - o3
    relance: 'Faux : la représentation d''objets inanimés correspond à une nature morte.'
  - si:
      contient:
      - o4
    relance: 'Faux : les sujets antiques ou religieux font partie de la peinture d''histoire.'
  solution: 'Un tableau montrant une scène de la vie quotidienne de personnages anonymes. C''est correct : la scène de genre
    illustre la vie de tous les jours de personnes ordinaires (comme La Laitière de Vermeer).'
- id: nblm-parmi-les-affirmations-suivantes-sur-les-6
  type: choix
  difficulte: 3
  enonce: Parmi les affirmations suivantes sur les arts de la scène et la danse sous le règne de Louis XIV, lesquelles sont
