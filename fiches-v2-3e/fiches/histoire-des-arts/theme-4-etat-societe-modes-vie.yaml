  - si:
      contient:
      - o4
    relance: 'Faux : il s''agit d''un ballet de cour mêlant musique et danse, auquel le jeune roi a lui-même participé.'
  solution: 'Molière et Lully s''associent pour créer des comédies-ballets comme Le Bourgeois gentilhomme ; La danse de cour
