  reponse:
    options:
    - id: o1
      texte: Molière et Lully s'associent pour créer des comédies-ballets comme Le Bourgeois gentilhomme.
    - id: o2
      texte: La danse de cour est une pratique codifiée qui reflète le rang de chaque courtisan.
    - id: o3
      texte: Sous le règne de Louis XIV, la danse de cour est un simple loisir sans rôle politique.
    - id: o4
      texte: Le Ballet royal de la Nuit est une pièce de théâtre uniquement parlée, sans séquence dansée.
    bonnes:
    - o1
    - o2
  indices:
