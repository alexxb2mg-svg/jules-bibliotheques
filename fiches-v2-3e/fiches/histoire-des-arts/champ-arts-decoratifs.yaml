format: 2
notion: champ-arts-decoratifs
version: 1
etat: verifiee
declencheurs:
- objet Art déco
- style Art nouveau
- affiche publicitaire
- caricature de presse
- métiers d'art
- mobilier design
prerequis:
- decrire-oeuvre-lexique
- 4e-champ-arts-decoratifs
couverture: Présente le champ des arts décoratifs et appliqués (mobilier, objets, vêtement, design, métiers d'art, affiche,
  publicité, caricature) et deux grands styles, l'Art nouveau et l'Art déco. L'histoire de la mode n'est qu'évoquée.
essentiel: 'Les arts décoratifs, ou arts appliqués, créent des objets et des images qui ont une fonction dans la vie de tous
  les jours tout en cherchant la beauté : meubles, vaisselle, bijoux, vêtements, tissus, affiches. On y range le design, les
  métiers d''art, l''affiche, la publicité et la caricature.


  Les métiers d''art (ébéniste, verrier, orfèvre, brodeur, tapissier…) fabriquent à la main des objets souvent uniques. Le
  design, lui, conçoit des objets fabriqués en série par l''industrie, qui doivent être à la fois utiles, pratiques et beaux.
  Exemple : la chaise n° 14 de Michael Thonet (1859), en bois courbé, fabriquée à des millions d''exemplaires.


  Deux styles marquent le début du XXe siècle. L''Art nouveau, vers 1900, s''inspire des plantes et des lignes courbes : les
  entrées du métro de Paris dessinées par Hector Guimard en sont un exemple. L''Art déco, dans les années 1920-1930, préfère
  les formes géométriques, la symétrie et les matériaux précieux ; il tire son nom de l''Exposition internationale des arts
  décoratifs et industriels modernes, à Paris, en 1925.


  L''affiche et la publicité doivent attirer le regard et être comprises en un instant : grandes formes simples, couleurs
  vives en aplats, texte court et lisible. Exemples : Moulin Rouge – La Goulue d''Henri de Toulouse-Lautrec (1891), l''affiche
  Normandie de Cassandre (1935).


  La caricature exagère les traits d''une personne pour s''en moquer ou la critiquer, souvent dans la presse. En 1831, Honoré
  Daumier caricature le roi Louis-Philippe en Gargantua, un géant qui dévore l''argent du peuple.

  '
methode:
- 'Nommer l''objet ou l''image et sa fonction : s''asseoir, servir, s''habiller, annoncer, vendre, critiquer.'
- 'Préciser le domaine : mobilier, objet, vêtement, métier d''art, design, affiche, publicité ou caricature.'
- Décrire la forme, les matériaux et les couleurs, et dire si l'objet est fait à la main ou fabriqué en série.
- 'Reconnaître un style (Art nouveau, Art déco…) à ses formes : courbes végétales ou lignes géométriques.'
- 'Montrer comment la forme sert la fonction : une affiche lisible de loin, une chaise légère et solide.'
vocabulaire:
- terme: arts décoratifs
  definition: arts qui créent des objets et des images utiles dans la vie quotidienne, tout en cherchant la beauté (on dit
    aussi arts appliqués)
- terme: design
  definition: conception d'objets fabriqués en série, qui doivent être à la fois utiles et beaux
- terme: métier d'art
  definition: métier où un artisan fabrique à la main des objets de grande qualité (ébéniste, verrier, brodeur…)
- terme: Art nouveau
  definition: style né vers 1900, inspiré des plantes, aux lignes courbes et souples
- terme: Art déco
  definition: style des années 1920-1930, aux formes géométriques et symétriques
- terme: caricature
  definition: dessin qui exagère les traits d'une personne pour s'en moquer ou la critiquer
- terme: aplat
  definition: surface de couleur uniforme, sans dégradé
erreurs_frequentes:
- 'Croire qu''un objet utile ne peut pas être une œuvre d''art : une chaise ou une affiche peuvent être étudiées comme des
  œuvres.'
- Confondre Art nouveau (courbes inspirées des plantes, vers 1900) et Art déco (formes géométriques, années 1920-1930).
- Confondre métier d'art (objet fait à la main, souvent unique) et design (objet conçu pour être fabriqué en série).
- 'Décrire une affiche sans parler de son texte et de son but : annoncer, vendre, convaincre.'
exemple:
  enonce: Explique pourquoi la chaise n° 14 de Michael Thonet (1859) est un objet de design.
  solution: 'La chaise n° 14 est un objet utilitaire : elle sert à s''asseoir, notamment dans les cafés. Thonet l''a conçue
    pour être fabriquée en série, avec quelques pièces de bois courbé à la vapeur et des vis ; on pouvait l''expédier en pièces
    détachées. Elle est légère, solide, bon marché et élégante : elle allie l''utile et le beau, ce qui est le but du design.'
exercices:
- id: mot-style-vegetal
  type: texte_court
  difficulte: 1
  enonce: Quel style, né vers 1900, s'inspire des plantes et des lignes courbes, comme les entrées du métro de Paris dessinées
    par Hector Guimard ?
  reponse:
    acceptees:
    - Art nouveau
    - style Art nouveau
    - Modern style
    fautes_tolerees: 1
  indices:
    relance: Vers 1900, ce style se veut en rupture avec les styles anciens. Quel adjectif exprime cette idée de nouveauté
      ?
    methode: 'Deux styles décoratifs marquent le début du XXe siècle : l''un tout en courbes, vers 1900, l''autre géométrique,
      dans les années 1920. Cherche le nom du premier.'
    etape: 'Son nom est formé de deux mots : « Art », suivi d''un adjectif qui est le contraire de « ancien ».'
  pieges:
  - si:
      valeur: Art déco
    relance: L'Art déco vient plus tard, dans les années 1920-1930, avec des formes géométriques. Quel style, vers 1900, préfère
      les courbes des plantes ?
  - si:
      valeur: baroque
    relance: Le baroque date des XVIIe et XVIIIe siècles. On cherche un style né autour de 1900.
  solution: 'C''est l''Art nouveau : vers 1900, il s''inspire des tiges, des feuilles et des fleurs, comme les entrées du
    métro de Guimard.'
- id: mot-objets-serie
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on la conception d'objets fabriqués en série par l'industrie, qui doivent être à la fois utiles
    et beaux, comme la chaise n° 14 de Thonet ?
  reponse:
    acceptees:
    - design
    - design industriel
    fautes_tolerees: 0
  indices:
    relance: Qui dessine la forme d'une chaise, d'une lampe ou d'un téléphone avant qu'une usine les fabrique ?
    methode: 'Distingue deux façons de créer des objets : à la main, en pièce unique (les métiers d''art), ou pour l''industrie,
      en série. Cherche le mot pour la seconde.'
    etape: C'est un mot anglais de six lettres, qui veut dire « dessin, conception ».
  pieges:
  - si:
      valeur: artisanat
    relance: L'artisan fabrique à la main, souvent en pièce unique. Ici, les objets sont fabriqués en série par l'industrie.
      Quel mot ?
  - si:
      valeur: métier d'art
    relance: Un métier d'art produit à la main des objets souvent uniques. On cherche la conception d'objets fabriqués en
      série.
  solution: 'C''est le design : concevoir des objets fabriqués en série, à la fois utiles, pratiques et beaux.'
- id: oeuvre-domaine
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à son domaine.
  reponse:
    gauche:
    - id: a
      texte: Moulin Rouge – La Goulue, Henri de Toulouse-Lautrec, 1891
    - id: b
      texte: Gargantua, Honoré Daumier, 1831, qui représente le roi Louis-Philippe en géant glouton
    - id: c
      texte: La chaise n° 14, Michael Thonet, 1859
    - id: d
      texte: La Tapisserie de Bayeux, broderie de laine sur toile de lin, fin du XIe siècle
    droite:
    - id: w
      texte: affiche
    - id: x
      texte: caricature
    - id: y
      texte: mobilier fabriqué en série
    - id: z
      texte: métier d'art (broderie)
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Laquelle de ces œuvres se moque d'un roi ? Laquelle sert à s'asseoir ?
    methode: 'Pour chaque œuvre, demande-toi à quoi elle sert : annoncer un spectacle, critiquer, s''asseoir, raconter une
      histoire en images brodées.'
    etape: 'Le Moulin Rouge est un cabaret parisien : l''œuvre de Toulouse-Lautrec l''annonce sur les murs. Place maintenant
      les trois autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Relis la fonction de chaque œuvre : annoncer, se moquer, s''asseoir, broder.'
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'objet qui sert à s'asseoir et par le dessin qui se moque du roi, puis place les deux autres.
  solution: Moulin Rouge – La Goulue est une affiche ; Gargantua, une caricature ; la chaise n° 14, un meuble fabriqué en
    série ; la Tapisserie de Bayeux, une broderie, œuvre d'un métier d'art.
- id: classer-arts-decoratifs
  type: choix
  difficulte: 1
  enonce: Parmi ces œuvres, lesquelles appartiennent au champ des arts décoratifs et du design ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: L'affiche Normandie de Cassandre, 1935, pour un paquebot
    - id: b
      texte: Le fauteuil Wassily de Marcel Breuer, en tube d'acier, vers 1925
    - id: c
      texte: La Liberté guidant le peuple, tableau d'Eugène Delacroix, 1830
    - id: d
      texte: Carmen, opéra de Georges Bizet, 1875
    bonnes:
    - a
    - b
  indices:
    relance: 'Pour chaque œuvre, demande-toi : a-t-elle une fonction pratique dans la vie de tous les jours ?'
    methode: 'Les arts décoratifs créent des objets et des images utiles : meubles, objets, vêtements, affiches. Un tableau
      de musée ou un spectacle relèvent d''autres champs.'
    etape: Un opéra se joue sur une scène ; un tableau d'histoire s'accroche au musée. Que font les deux autres œuvres dans
      la vie quotidienne ?
  pieges:
  - si:
      contient:
      - c
    relance: 'La Liberté guidant le peuple est une peinture à l''huile, sans fonction pratique : elle appartient aux beaux-arts.'
  - si:
      contient:
      - d
    relance: 'Carmen est un opéra, joué sur scène devant un public : c''est du spectacle vivant.'
  - si:
      diagnostic: incomplet
    relance: Il en manque une. Un meuble et une affiche ont tous deux une fonction pratique.
  solution: L'affiche Normandie (elle fait la publicité d'un paquebot) et le fauteuil Wassily (un meuble) appartiennent aux
    arts décoratifs et au design. La Liberté guidant le peuple relève des beaux-arts, Carmen du spectacle vivant.
- id: chronologie-objets
  type: ordre
  difficulte: 2
  enonce: Range ces créations et ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: thonet
      texte: Michael Thonet crée la chaise n° 14 en bois courbé
    - id: guimard
      texte: Hector Guimard dessine les entrées du métro de Paris, de style Art nouveau
    - id: expo
      texte: L'Exposition internationale des arts décoratifs se tient à Paris et donne son nom à l'Art déco
    - id: starck
      texte: Philippe Starck crée le presse-agrumes Juicy Salif
  indices:
    relance: Le métro de Paris ouvre pour l'Exposition universelle de 1900. Lesquelles de ces créations sont plus anciennes,
      lesquelles plus récentes ?
    methode: 'Associe chaque création à un moment : milieu du XIXe siècle, vers 1900, années 1920, fin du XXe siècle.'
    etape: La chaise de Thonet date du milieu du XIXe siècle, et l'Art déco vient après l'Art nouveau. Où placer le presse-agrumes
      de Starck ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux éléments voisins sont inversés. Rappelle-toi que l''Art nouveau précède l''Art déco.'
  - si:
      diagnostic: ordre_faux
    relance: Place d'abord la création du XIXe siècle et celle de la fin du XXe siècle, puis range les deux styles entre elles.
  solution: La chaise n° 14 de Thonet (1859), les entrées du métro de Guimard (vers 1900), l'Exposition internationale des
    arts décoratifs (1925), le Juicy Salif de Philippe Starck (1990).
- id: analyse-affiche-moulin-rouge
  type: ouverte
  difficulte: 3
  enonce: Voici la description d'une affiche. Moulin Rouge – La Goulue, d'Henri de Toulouse-Lautrec (1891), est une lithographie
    en couleurs, collée sur les murs de Paris pour annoncer le cabaret du Moulin Rouge. Au centre, la danseuse La Goulue lève
    la jambe dans un jupon blanc. Au premier plan, un danseur est représenté en silhouette grise. Derrière, les spectateurs
    forment des silhouettes noires. En haut, les mots « MOULIN ROUGE » sont écrits en grandes lettres, répétées. Les couleurs
    sont posées en aplats, sans dégradés. Présente et analyse cette affiche en quelques phrases.
  criteres:
  - 'L''élève situe l''œuvre dans le champ des arts décoratifs (une affiche), avec l''auteur, la date et sa fonction : annoncer
    un lieu de spectacle.'
  - L'élève décrit les choix plastiques avec un vocabulaire précis (aplats, silhouettes, premier plan, texte en grandes lettres).
  - 'L''élève explique comment ces choix servent la fonction : attirer le regard et être compris d''un coup d''œil dans la
    rue.'
  indices:
    relance: À quoi sert cette image, collée sur un mur de Paris ? Que doit comprendre un passant en quelques secondes ?
    methode: Présente l'œuvre et sa fonction, décris les formes, les couleurs et le texte, puis montre comment ils attirent
      le regard.
    etape: 'Tu peux commencer ainsi : « Moulin Rouge – La Goulue est une affiche réalisée par Henri de Toulouse-Lautrec en
      1891 pour annoncer… »'
  solution: 'Moulin Rouge – La Goulue est une affiche en lithographie réalisée par Henri de Toulouse-Lautrec en 1891 pour
    annoncer le cabaret du Moulin Rouge : c''est une œuvre des arts décoratifs, faite pour la rue. La danseuse La Goulue,
    au centre, attire l''œil par son jupon blanc ; un danseur en silhouette grise occupe le premier plan, et le public est
    réduit à des ombres noires. Les couleurs en aplats et les formes simples se voient de loin, et le nom du cabaret, répété
    en grandes lettres, se lit d''un coup d''œil. L''affiche donne envie de venir voir le spectacle : la forme sert la fonction.'
