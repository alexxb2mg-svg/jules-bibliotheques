- id: annee-expo-arts-deco
  type: nombre
  difficulte: 1
  enonce: En quelle année se tient à Paris l'Exposition internationale des arts décoratifs et industriels modernes, qui donne
    son nom à l'Art déco ?
  reponse:
    valeur: 1925
    forme: entier
  indices:
    relance: L'Art déco est le style des années 1920-1930. L'exposition qui lui donne son nom est au milieu de cette période.
    methode: Place l'exposition entre l'Art nouveau (vers 1900) et la fin des années 1930, dans les « années folles ».
    etape: L'exposition a lieu dans les années 1920.
  pieges:
  - si:
      valeur: 1900
    relance: 1900 est la date de l'Exposition universelle et de l'Art nouveau. L'Art déco vient environ vingt-cinq ans plus
      tard.
  - si:
      valeur: 1935
    relance: 1935 est l'année de l'affiche Normandie de Cassandre, dans le style Art déco. L'exposition qui lui donne son
      nom est plus ancienne.
  solution: L'exposition a lieu à Paris en 1925 et donne son nom au style Art déco.
- id: bonne-affiche
  type: choix
  difficulte: 2
  enonce: Quelles caractéristiques rendent une affiche efficace dans la rue ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: Un texte court et lisible de loin
    - id: b
      texte: Des couleurs vives posées en aplats
    - id: c
      texte: Un long paragraphe en petits caractères
    - id: d
      texte: Des dizaines de détails très fins
    bonnes:
    - a
    - b
  indices:
    relance: Un passant regarde l'affiche quelques secondes en marchant. Que doit-il pouvoir faire ?
    methode: 'L''affiche doit être comprise d''un coup d''œil : cherche ce qui la rend lisible de loin.'
    etape: Deux propositions demandent du temps pour être lues ou regardées ; les deux autres se voient tout de suite.
  pieges:
  - si:
      contient:
      - c
    relance: Personne ne lit un long paragraphe en petits caractères en passant dans la rue.
  - si:
      contient:
      - d
    relance: Des détails très fins disparaissent quand on regarde de loin.
  - si:
      diagnostic: incomplet
    relance: 'Il y a une autre bonne réponse : pense aux couleurs de l''affiche de Toulouse-Lautrec.'
  solution: 'Une affiche efficace a un texte court et lisible et des couleurs vives en aplats : elle est comprise d''un coup
    d''œil, de loin.'
