      contient:
      - o3
    relance: 'Erreur classique : la géométrie et la symétrie caractérisent l''Art déco des années 1920, non l''Art nouveau.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''utilisation des objets de consommation de masse concerne le Pop art apparu après 1945.'
  solution: Il s'inspire directement des formes de la nature, des lignes courbes et des motifs végétaux ; Il est illustré
    par les édicules et bouches de métro de Guimard à Paris. C'est exact. Les courbes végétales sont la marque de fabrique
    de l'Art nouveau.
- id: nblm-nomme-le-mouvement-artistique-ne-dans-le-7
  type: texte_court
  difficulte: 1
  enonce: Nomme le mouvement artistique né dans les années 1870 dont le nom provient du titre d'un tableau de Claude Monet.
  reponse:
    acceptees:
    - impressionnisme
    fautes_tolerees: 1
  indices:
    relance: Ce mot est dérivé du premier terme du titre de la toile peinte au Havre en 1872.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: impressionnisme. C'est exact. L'impressionnisme tire son nom de la toile 'Impression, soleil levant' présentée
    lors de l'exposition de 1874.
- id: nblm-quel-terme-designe-l-interet-des-artiste-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne l'intérêt des artistes européens du début du XXe siècle pour les arts d'Afrique ou d'Océanie,
    visible dans Les Demoiselles d'Avignon ?
  reponse:
    acceptees:
    - primitivisme
    fautes_tolerees: 1
  indices:
    relance: Ce mot vient du terme utilisé autrefois pour qualifier ces arts extra-européens.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: primitivisme. C'est exact. Le primitivisme désigne cette fascination pour les arts africains et océaniens qui
    a nourri les avant-gardes comme le cubisme.
- id: mot-jazz
  type: texte_court
  difficulte: 1
  enonce: Quelle musique née aux États-Unis, très rythmée et pleine d'improvisation, triomphe dans les music-halls de Paris
    dans les années 1920 ?
  reponse:
    acceptees:
    - jazz
    - le jazz
    fautes_tolerees: 1
  indices:
    relance: Joséphine Baker en est l'une des grandes figures sur scène à Paris.
    methode: C'est une musique venue des États-Unis, jouée par des orchestres avec des solos improvisés.
    etape: Le mot compte quatre lettres et commence par « j ».
  pieges:
  - si:
      valeur: blues
    relance: Le blues est un style proche, mais la mode des années folles a un autre nom, plus large.
  solution: Le jazz, venu des États-Unis, triomphe à Paris dans les années 1920.
- id: duchamp-fontaine
  type: choix
  difficulte: 2
  enonce: En 1917, Marcel Duchamp propose Fontaine à une exposition. Que fait-il ?
  reponse:
    options:
    - id: a
      texte: Il présente un objet ordinaire signé et le déclare œuvre d'art
    - id: b
      texte: Il peint un paysage en plein air
    - id: c
      texte: Il compose un opéra
    - id: d
      texte: Il construit une cathédrale
    bonnes:
    - a
  indices:
    relance: Cette œuvre appartient à Dada, un mouvement qui se moque de l'art et de la société.
    methode: Dada provoque le public. Cherche l'option qui bouscule l'idée habituelle de l'œuvre d'art.
    etape: 'Duchamp ne fabrique pas l''objet lui-même : il le choisit et le signe.'
  pieges:
  - si:
      contient:
      - b
    relance: Peindre en plein air, c'est ce que font les impressionnistes. Duchamp appartient à un autre mouvement.
  - si:
      contient:
      - c
    relance: Duchamp n'est pas compositeur. Il agit dans le domaine des arts plastiques.
  - si:
      contient:
      - d
    relance: Construire une cathédrale n'a aucun rapport avec Fontaine.
  solution: 'Avec Fontaine (1917), Duchamp présente un objet ordinaire signé et le déclare œuvre d''art : c''est Dada.'
