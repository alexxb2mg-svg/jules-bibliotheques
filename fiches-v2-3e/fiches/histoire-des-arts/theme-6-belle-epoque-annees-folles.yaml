format: 2
notion: theme-6-belle-epoque-annees-folles
version: 3
etat: generee
declencheurs:
- tableau impressionniste
- Impression, soleil levant
- Demoiselles d'Avignon
- bouches de métro de Guimard
- Sacre du printemps
- Van Gogh Nuit étoilée
- cinématographe des Lumière
- Fontaine de Duchamp
- Le Cri de Munch
prerequis:
- nommer-oeuvres-majeures
- theme-5-lumieres-revolutions
essentiel: |
  De 1870 à 1930, les artistes rompent avec les règles de l'Académie : c'est l'ère des avant-gardes, des groupes qui inventent de nouvelles façons de créer.

  Paysages du réel : les impressionnistes peignent en plein air, par petites touches de couleur, pour saisir la lumière d'un instant. Claude Monet peint Impression, soleil levant (1872), qui donne son nom au mouvement après une exposition en 1874. Paysages intérieurs : d'autres peintres expriment leurs émotions, comme Vincent van Gogh (La Nuit étoilée, 1889) ou Edvard Munch (Le Cri, 1893), précurseur de l'expressionnisme.

  L'Art nouveau (vers 1890-1910) s'inspire des formes de la nature : lignes courbes, motifs de plantes. Hector Guimard dessine les entrées du métro de Paris (1900).

  Un nouveau rapport au réel : la photographie se répand, puis les frères Lumière organisent à Paris, le 28 décembre 1895, une des premières projections publiques et payantes du cinématographe. Georges Méliès invente les effets spéciaux avec Le Voyage dans la Lune (1902). Le phonographe permet d'enregistrer et d'écouter la musique chez soi.

  Recherche des racines : des artistes s'inspirent d'arts venus d'ailleurs (masques d'Afrique, arts d'Océanie), c'est le primitivisme. Pablo Picasso peint Les Demoiselles d'Avignon (1907), puis invente le cubisme avec Georges Braque : les objets sont découpés en formes géométriques et montrés sous plusieurs angles à la fois.

  Pendant la Première Guerre mondiale naît Dada (1916), qui se moque de l'art et de la société : en 1917, Marcel Duchamp propose à une exposition un urinoir signé, intitulé Fontaine. André Breton publie le Manifeste du surréalisme en 1924, qui explore les rêves et l'inconscient.

  Métropoles et spectacles : Paris est la capitale des spectacles. Le Sacre du printemps de Stravinsky, dansé par les Ballets russes, fait scandale en 1913. Dans les années 1920, les « années folles », le jazz venu des États-Unis triomphe, et Joséphine Baker devient une vedette du music-hall.

  Au brevet, on attend que tu saches : reconnaître un tableau impressionniste, expressionniste ou cubiste, situer l'invention du cinéma (1895), expliquer le primitivisme, et citer un exemple de spectacle ou de musique nouveaux des années 1920.

  Attention à ne pas mélanger : l'impressionnisme cherche la lumière d'un instant, l'expressionnisme montre une émotion intérieure, le cubisme décompose les formes, Dada provoque et le surréalisme explore les rêves.
methode:
- 'Identifier le mouvement grâce à des indices visibles : petites touches et lumière (impressionnisme), lignes courbes végétales (Art nouveau), formes géométriques (cubisme), rêve (surréalisme).'
- 'Situer l''œuvre dans le temps : Belle Époque avant 1914, années folles dans les années 1920.'
- Dire ce que l'œuvre a de nouveau par rapport à l'art académique.
- 'Relier l''œuvre aux changements du monde : villes, techniques nouvelles (photographie, cinéma, phonographe), ouverture aux autres cultures.'
- 'Pour reconnaître un mouvement, chercher son trait principal : lumière et touches (impressionnisme), émotion déformée (expressionnisme), formes géométriques (cubisme), rêve (surréalisme).'
- 'Pour situer une œuvre, la placer par rapport à trois repères : 1874 (impressionnisme), 1907 (Demoiselles d''Avignon), 1924 (surréalisme).'
vocabulaire:
- terme: avant-garde
  definition: un groupe d'artistes qui rompt avec la tradition et invente des formes nouvelles
- terme: impressionnisme
  definition: un mouvement de peinture né dans les années 1870, qui cherche à saisir la lumière et l'instant par petites touches de couleur
- terme: cubisme
  definition: un mouvement inventé par Picasso et Braque vers 1907-1908, qui décompose les objets en formes géométriques vues sous plusieurs angles
- terme: primitivisme
  definition: l'intérêt des artistes européens pour des arts jugés alors « primitifs », comme les masques d'Afrique ou d'Océanie
- terme: Art nouveau
  definition: un style vers 1890-1910 inspiré de la nature, avec des lignes courbes et des motifs de plantes
- terme: cinématographe
  definition: l'appareil des frères Lumière qui filme et projette des images en mouvement
- terme: Dada
  definition: un mouvement né en 1916 qui se moque de l'art et de la société
- terme: surréalisme
  definition: un mouvement des années 1920 qui explore les rêves et l'inconscient
erreurs_frequentes:
- 'Croire que l''impressionnisme est un art du flou raté : les touches visibles sont voulues pour rendre la lumière et le mouvement.'
- 'Confondre cubisme et surréalisme : le cubisme découpe les formes, le surréalisme montre le monde des rêves.'
- 'Oublier que le cinéma naît en 1895 : il fait partie des nouveautés de la Belle Époque.'
- Confondre Art nouveau (lignes courbes, vers 1900) et Art déco (formes géométriques, années 1920).
exemple:
  enonce: Explique en trois phrases ce qui était nouveau dans Impression, soleil levant de Monet.
  solution: Monet peint en 1872 le port du Havre à l'aube, avec des touches de couleur rapides et visibles. Il ne cherche pas à dessiner chaque détail, mais à saisir la lumière et l'atmosphère d'un instant. Cette façon de peindre choque le public habitué à l'art académique, et le titre du tableau donne son nom à l'impressionnisme.
exercices:
- id: invention-lumiere
  type: choix
  difficulte: 1
  enonce: Le 28 décembre 1895, à Paris, les frères Lumière organisent une séance publique et payante devant des spectateurs. Qu'est-ce qui est présenté ?
  reponse:
    options:
    - id: a
      texte: Des films projetés grâce au cinématographe
    - id: b
      texte: Une émission de télévision
    - id: c
      texte: Un concert de jazz enregistré
    - id: d
      texte: Une exposition de tableaux impressionnistes
    bonnes:
    - a
  indices:
    relance: Les spectateurs voient, sur un écran, des images qui bougent. De quel art s'agit-il ?
    methode: Élimine ce qui n'existe pas encore en 1895, puis ce qui n'a rien à voir avec des images projetées.
    etape: Parmi leurs premiers films, il y a La Sortie de l'usine Lumière à Lyon. Quel appareil permet de les montrer ?
  pieges:
  - si:
      contient:
      - b
    relance: La télévision n'apparaît que plusieurs décennies plus tard. Que peut-on projeter en 1895 ?
  - si:
      contient:
      - c
    relance: Le jazz n'arrive en France qu'à la fin de la Première Guerre mondiale. Et les frères Lumière montrent des images.
  - si:
      contient:
      - d
    relance: Les frères Lumière ne sont pas peintres. Qu'ont-ils inventé ?
  solution: 'Les frères Lumière projettent des films grâce au cinématographe, un appareil qui filme et projette. Cette séance du 28 décembre 1895 est l''une des premières projections publiques payantes : c''est la naissance du cinéma.'
- id: oeuvre-mouvement
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre au mouvement artistique auquel on la rattache.
  reponse:
    gauche:
    - id: a
      texte: Monet, Impression, soleil levant (1872)
    - id: b
      texte: Guimard, les entrées du métro de Paris (1900)
    - id: c
      texte: Munch, Le Cri (1893)
    - id: d
      texte: Duchamp, Fontaine (1917), un urinoir signé proposé à une exposition
    droite:
    - id: w
      texte: Impressionnisme
    - id: x
      texte: Art nouveau
    - id: y
      texte: Expressionnisme
    - id: z
      texte: Dada
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Quelle œuvre a donné son nom à un mouvement ? Laquelle se moque de l'art ?
    methode: 'Pense à ce que chaque mouvement cherche : la lumière, les courbes de la nature, l''émotion forte, la provocation.'
    etape: Les entrées de métro de Guimard ont des formes de tiges et de fleurs en fonte verte. Place-les, puis le tableau de Munch, un cri d'angoisse.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Demande-toi ce que chaque œuvre cherche à montrer ou à provoquer.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : le titre du tableau de Monet a donné son nom à son mouvement.'
  solution: 'Impression, soleil levant : impressionnisme. Entrées du métro de Guimard : Art nouveau. Le Cri : expressionnisme (Munch en est un précurseur). Fontaine : Dada.'
- id: chronologie-avant-gardes
  type: ordre
  difficulte: 2
  enonce: Range ces événements artistiques du plus ancien au plus récent.
  reponse:
    elements:
    - id: monet
      texte: Monet peint Impression, soleil levant
    - id: lumiere
      texte: Les frères Lumière projettent leurs films à Paris
    - id: demoiselles
      texte: Picasso peint Les Demoiselles d'Avignon
    - id: surrealisme
      texte: André Breton publie le Manifeste du surréalisme
  indices:
    relance: Lequel de ces événements a lieu après la Première Guerre mondiale ?
    methode: Donne une décennie à chaque événement (années 1870, 1890, 1900, 1920), puis range-les.
    etape: Monet peint son tableau au début des années 1870 et le cinéma naît en 1895. Place les deux autres.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux événements voisins sont inversés. Lequel des deux est le plus ancien ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement du début des années 1870 et celui des années 1920.
  solution: Impression, soleil levant (1872), projection des frères Lumière (1895), Les Demoiselles d'Avignon (1907), Manifeste du surréalisme (1924).
- id: mot-cubisme
  type: texte_court
  difficulte: 2
  enonce: Quel mouvement, inventé par Picasso et Braque vers 1907-1908, décompose les objets et les personnages en formes géométriques vues sous plusieurs angles à la fois ?
  reponse:
    acceptees:
    - cubisme
    - cubiste
    fautes_tolerees: 0
  indices:
    relance: Un critique a dit que Braque réduisait tout à de petits volumes géométriques. Lesquels ?
    methode: Le nom du mouvement vient d'une forme géométrique à six faces carrées.
    etape: Cette forme s'appelle un cube. Transforme ce mot en nom de mouvement.
  pieges:
  - si:
      valeur: surréalisme
    relance: Le surréalisme, né dans les années 1920, explore les rêves. Quel mouvement découpe les formes ?
  - si:
      valeur: impressionnisme
    relance: L'impressionnisme cherche la lumière par petites touches. Quel mouvement construit avec des formes géométriques ?
  solution: 'Le cubisme : Picasso et Braque décomposent les objets en formes géométriques et les montrent sous plusieurs angles à la fois.'
- id: primitivisme-demoiselles
  type: choix
  difficulte: 2
  enonce: Dans Les Demoiselles d'Avignon (1907), Picasso peint certains visages comme des masques, aux traits simplifiés et anguleux. De quoi s'inspire-t-il notamment ?
  reponse:
    options:
    - id: a
      texte: Des masques d'Afrique et de la sculpture ibérique ancienne
    - id: b
      texte: Des statues grecques classiques
    - id: c
      texte: Des tableaux impressionnistes
    bonnes:
    - a
  indices:
    relance: Au début du XXe siècle, les artistes de Paris découvrent dans les musées des arts venus d'autres continents. Lesquels ?
    methode: 'Élimine les modèles qui cherchent la beauté idéale ou la lumière : les visages de Picasso sont durs et simplifiés.'
    etape: Cet intérêt pour les arts extra-européens s'appelle le primitivisme. Quelle option en parle ?
  pieges:
  - si:
      contient:
      - b
    relance: Les statues grecques classiques cherchent un visage idéal et harmonieux. Est-ce le cas ici ?
  - si:
      contient:
      - c
    relance: Les impressionnistes peignent la lumière par petites touches. Les visages-masques de Picasso y ressemblent-ils ?
  solution: 'Picasso s''inspire notamment des masques d''Afrique et de la sculpture ibérique ancienne : c''est le primitivisme. Le tableau ouvre la voie au cubisme.'
- id: analyse-impression
  type: ouverte
  difficulte: 3
  enonce: Voici une œuvre décrite. Dans Impression, soleil levant (1872), Claude Monet peint le port du Havre à l'aube. Le ciel et l'eau sont faits de touches rapides de bleu, de gris et d'orange. Les bateaux et les grues ne sont que des silhouettes. Un petit soleil orange se reflète dans l'eau en traits horizontaux. Décris ce tableau et explique pourquoi il a marqué l'histoire de l'art, en le reliant à son contexte.
  criteres:
  - L'élève décrit le tableau avec des mots précis (touches, couleurs, reflet, silhouettes, paysage portuaire).
  - 'L''élève explique la nouveauté : saisir la lumière et l''impression d''un instant plutôt que dessiner les détails, loin des règles de l''Académie.'
  - 'L''élève relie l''œuvre à son contexte : la naissance de l''impressionnisme (exposition de 1874), un port moderne à la fin du XIXe siècle.'
  indices:
    relance: 'Qu''est-ce qui intéresse le plus Monet ici : les bateaux ou la lumière ?'
    methode: Décris, puis compare avec un tableau académique très détaillé, puis explique le nom du mouvement.
    etape: 'Tu peux commencer ainsi : « Ce tableau de Claude Monet, peint en 1872, montre le port du Havre au lever du soleil... »'
  solution: 'Ce tableau de Claude Monet, peint en 1872, montre le port du Havre au lever du soleil. Les touches sont rapides et visibles, les bateaux ne sont que des silhouettes, et le reflet orange du soleil anime l''eau. Monet ne cherche pas les détails : il veut saisir la lumière et l''atmosphère d''un instant. Exposé en 1874, le tableau choque les critiques, et l''un d''eux s''en moque en parlant d''« impressionnistes ». Le mot donne son nom à une avant-garde qui rompt avec l''art académique.'
- id: mot-jazz
  type: texte_court
  difficulte: 1
  enonce: Quelle musique née aux États-Unis, très rythmée et pleine d'improvisation, triomphe dans les music-halls de Paris dans les années 1920 ?
  reponse:
    acceptees:
    - jazz
    - le jazz
    fautes_tolerees: 1
  indices:
    relance: Joséphine Baker en est l'une des grandes figures sur scène à Paris.
    methode: C'est une musique venue des États-Unis, jouée par des orchestres avec des solos improvisés.
    etape: Le mot compte quatre lettres et commence par « j ».
  pieges:
  - si:
      valeur: blues
    relance: Le blues est un style proche, mais la mode des années folles a un autre nom, plus large.
  solution: Le jazz, venu des États-Unis, triomphe à Paris dans les années 1920.
- id: duchamp-fontaine
  type: choix
  difficulte: 2
  enonce: En 1917, Marcel Duchamp propose Fontaine à une exposition. Que fait-il ?
  reponse:
    options:
    - id: a
      texte: Il présente un objet ordinaire signé et le déclare œuvre d'art
    - id: b
      texte: Il peint un paysage en plein air
    - id: c
      texte: Il compose un opéra
    - id: d
      texte: Il construit une cathédrale
    bonnes:
    - a
  indices:
    relance: Cette œuvre appartient à Dada, un mouvement qui se moque de l'art et de la société.
    methode: Dada provoque le public. Cherche l'option qui bouscule l'idée habituelle de l'œuvre d'art.
    etape: 'Duchamp ne fabrique pas l''objet lui-même : il le choisit et le signe.'
  pieges:
  - si:
      contient:
      - b
    relance: Peindre en plein air, c'est ce que font les impressionnistes. Duchamp appartient à un autre mouvement.
  - si:
      contient:
      - c
    relance: Duchamp n'est pas compositeur. Il agit dans le domaine des arts plastiques.
  - si:
      contient:
      - d
    relance: Construire une cathédrale n'a aucun rapport avec Fontaine.
  solution: 'Avec Fontaine (1917), Duchamp présente un objet ordinaire signé et le déclare œuvre d''art : c''est Dada.'
