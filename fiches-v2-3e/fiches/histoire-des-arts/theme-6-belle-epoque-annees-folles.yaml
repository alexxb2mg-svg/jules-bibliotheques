    - id: o2
      texte: La Nuit étoilée
    - id: o3
      texte: Le Cri
    - id: o4
      texte: Les Demoiselles d'Avignon
    bonnes:
    - o1
  indices:
    relance: Pense au titre qui contient le mot clé donnant son nom à ce courant fondé sur la lumière et l'instant.
