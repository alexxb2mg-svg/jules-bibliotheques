format: 2
notion: theme-6-belle-epoque-annees-folles
version: 3
etat: verifiee
declencheurs:
- tableau impressionniste
- Impression, soleil levant
- Demoiselles d'Avignon
- bouches de métro de Guimard
- Sacre du printemps
- Van Gogh Nuit étoilée
- cinématographe des Lumière
- Fontaine de Duchamp
- Le Cri de Munch
prerequis:
- nommer-oeuvres-majeures
- theme-5-lumieres-revolutions
essentiel: 'De 1870 à 1930, les artistes rompent avec les règles de l''Académie : c''est l''ère des avant-gardes, des groupes
  qui inventent de nouvelles façons de créer.


  Paysages du réel : les impressionnistes peignent en plein air, par petites touches de couleur, pour saisir la lumière d''un
  instant. Claude Monet peint Impression, soleil levant (1872), qui donne son nom au mouvement après une exposition en 1874.
  Paysages intérieurs : d''autres peintres expriment leurs émotions, comme Vincent van Gogh (La Nuit étoilée, 1889) ou Edvard
  Munch (Le Cri, 1893), précurseur de l''expressionnisme.


  L''Art nouveau (vers 1890-1910) s''inspire des formes de la nature : lignes courbes, motifs de plantes. Hector Guimard dessine
  les entrées du métro de Paris (1900).


  Un nouveau rapport au réel : la photographie se répand, puis les frères Lumière organisent à Paris, le 28 décembre 1895,
  une des premières projections publiques et payantes du cinématographe. Georges Méliès invente les effets spéciaux avec Le
  Voyage dans la Lune (1902). Le phonographe permet d''enregistrer et d''écouter la musique chez soi.


  Recherche des racines : des artistes s''inspirent d''arts venus d''ailleurs (masques d''Afrique, arts d''Océanie), c''est
  le primitivisme. Pablo Picasso peint Les Demoiselles d''Avignon (1907), puis invente le cubisme avec Georges Braque : les
  objets sont découpés en formes géométriques et montrés sous plusieurs angles à la fois.


  Pendant la Première Guerre mondiale naît Dada (1916), qui se moque de l''art et de la société : en 1917, Marcel Duchamp
  propose à une exposition un urinoir signé, intitulé Fontaine. André Breton publie le Manifeste du surréalisme en 1924, qui
  explore les rêves et l''inconscient.


  Métropoles et spectacles : Paris est la capitale des spectacles. Le Sacre du printemps de Stravinsky, dansé par les Ballets
  russes, fait scandale en 1913. Dans les années 1920, les « années folles », le jazz venu des États-Unis triomphe, et Joséphine
  Baker devient une vedette du music-hall.


  Au brevet, on attend que tu saches : reconnaître un tableau impressionniste, expressionniste ou cubiste, situer l''invention
  du cinéma (1895), expliquer le primitivisme, et citer un exemple de spectacle ou de musique nouveaux des années 1920.


  Attention à ne pas mélanger : l''impressionnisme cherche la lumière d''un instant, l''expressionnisme montre une émotion
  intérieure, le cubisme décompose les formes, Dada provoque et le surréalisme explore les rêves.

  '
methode:
- 'Identifier le mouvement grâce à des indices visibles : petites touches et lumière (impressionnisme), lignes courbes végétales
  (Art nouveau), formes géométriques (cubisme), rêve (surréalisme).'
- 'Situer l''œuvre dans le temps : Belle Époque avant 1914, années folles dans les années 1920.'
- Dire ce que l'œuvre a de nouveau par rapport à l'art académique.
- 'Relier l''œuvre aux changements du monde : villes, techniques nouvelles (photographie, cinéma, phonographe), ouverture
  aux autres cultures.'
- 'Pour reconnaître un mouvement, chercher son trait principal : lumière et touches (impressionnisme), émotion déformée (expressionnisme),
  formes géométriques (cubisme), rêve (surréalisme).'
- 'Pour situer une œuvre, la placer par rapport à trois repères : 1874 (impressionnisme), 1907 (Demoiselles d''Avignon), 1924
  (surréalisme).'
vocabulaire:
- terme: avant-garde
  definition: un groupe d'artistes qui rompt avec la tradition et invente des formes nouvelles
- terme: impressionnisme
  definition: un mouvement de peinture né dans les années 1870, qui cherche à saisir la lumière et l'instant par petites touches
    de couleur
- terme: cubisme
  definition: un mouvement inventé par Picasso et Braque vers 1907-1908, qui décompose les objets en formes géométriques vues
    sous plusieurs angles
- terme: primitivisme
  definition: l'intérêt des artistes européens pour des arts jugés alors « primitifs », comme les masques d'Afrique ou d'Océanie
- terme: Art nouveau
  definition: un style vers 1890-1910 inspiré de la nature, avec des lignes courbes et des motifs de plantes
- terme: cinématographe
  definition: l'appareil des frères Lumière qui filme et projette des images en mouvement
- terme: Dada
  definition: un mouvement né en 1916 qui se moque de l'art et de la société
- terme: surréalisme
  definition: un mouvement des années 1920 qui explore les rêves et l'inconscient
erreurs_frequentes:
- 'Croire que l''impressionnisme est un art du flou raté : les touches visibles sont voulues pour rendre la lumière et le
  mouvement.'
- 'Confondre cubisme et surréalisme : le cubisme découpe les formes, le surréalisme montre le monde des rêves.'
- 'Oublier que le cinéma naît en 1895 : il fait partie des nouveautés de la Belle Époque.'
- Confondre Art nouveau (lignes courbes, vers 1900) et Art déco (formes géométriques, années 1920).
exemple:
  enonce: Explique en trois phrases ce qui était nouveau dans Impression, soleil levant de Monet.
  solution: Monet peint en 1872 le port du Havre à l'aube, avec des touches de couleur rapides et visibles. Il ne cherche
    pas à dessiner chaque détail, mais à saisir la lumière et l'atmosphère d'un instant. Cette façon de peindre choque le
    public habitué à l'art académique, et le titre du tableau donne son nom à l'impressionnisme.
exercices:
- id: invention-lumiere
  type: choix
  difficulte: 1
  enonce: Le 28 décembre 1895, à Paris, les frères Lumière organisent une séance publique et payante devant des spectateurs.
    Qu'est-ce qui est présenté ?
  reponse:
    options:
    - id: a
      texte: Des films projetés grâce au cinématographe
    - id: b
      texte: Une émission de télévision
    - id: c
      texte: Un concert de jazz enregistré
    - id: d
      texte: Une exposition de tableaux impressionnistes
    bonnes:
    - a
  indices:
    relance: Les spectateurs voient, sur un écran, des images qui bougent. De quel art s'agit-il ?
    methode: Élimine ce qui n'existe pas encore en 1895, puis ce qui n'a rien à voir avec des images projetées.
    etape: Parmi leurs premiers films, il y a La Sortie de l'usine Lumière à Lyon. Quel appareil permet de les montrer ?
  pieges:
  - si:
      contient:
      - b
    relance: La télévision n'apparaît que plusieurs décennies plus tard. Que peut-on projeter en 1895 ?
  - si:
      contient:
      - c
    relance: Le jazz n'arrive en France qu'à la fin de la Première Guerre mondiale. Et les frères Lumière montrent des images.
  - si:
      contient:
      - d
    relance: Les frères Lumière ne sont pas peintres. Qu'ont-ils inventé ?
  solution: 'Les frères Lumière projettent des films grâce au cinématographe, un appareil qui filme et projette. Cette séance
    du 28 décembre 1895 est l''une des premières projections publiques payantes : c''est la naissance du cinéma.'
