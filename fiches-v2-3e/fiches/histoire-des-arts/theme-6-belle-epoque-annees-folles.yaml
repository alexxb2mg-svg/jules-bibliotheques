  - si:
      contient:
      - o4
    relance: Non, Les Demoiselles d'Avignon (1907) est une œuvre de Pablo Picasso marquant les débuts du cubisme.
  solution: Impression, soleil levant. C'est exact. Ce tableau de Monet représentant le port du Havre a donné son nom à l'impressionnisme.
