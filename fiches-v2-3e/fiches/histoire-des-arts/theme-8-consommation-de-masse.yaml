- id: chronologie-depuis-1945
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: cite
      texte: La Cité radieuse de Le Corbusier est achevée à Marseille
    - id: warhol
      texte: Andy Warhol peint les boîtes de soupe Campbell
    - id: pompidou
      texte: Le Centre Pompidou est inauguré à Paris
    - id: bilbao
      texte: Le musée Guggenheim de Frank Gehry ouvre à Bilbao
  indices:
    relance: Laquelle de ces œuvres est construite juste après la Seconde Guerre mondiale ?
    methode: Donne une décennie à chaque œuvre (années 1950, 1960, 1970, 1990), puis range-les.
    etape: La Cité radieuse est achevée en 1952 et le musée de Bilbao ouvre en 1997. Place les deux autres entre elles.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux œuvres voisines sont inversées. Laquelle des deux est la plus ancienne ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'œuvre de l'après-guerre et celle de la fin du XXe siècle.
  solution: Cité radieuse (1947-1952), Campbell's Soup Cans (1962), Centre Pompidou (1977), musée Guggenheim de Bilbao (1997).
- id: ice-watch
  type: choix
  difficulte: 2
  enonce: En décembre 2015, pendant la conférence internationale sur le climat de Paris (COP21), l'artiste Olafur Eliasson
    installe sur une place de Paris douze gros blocs de glace venus du Groenland, qui fondent peu à peu devant les passants.
    Quelle est la fonction principale de cette œuvre, Ice Watch ?
  reponse:
    options:
    - id: a
      texte: Alerter sur le réchauffement climatique et la fonte des glaces
    - id: b
      texte: Vendre de la glace aux passants
    - id: c
      texte: Célébrer la puissance d'un chef d'État
    - id: d
      texte: Décorer la place pour les fêtes de fin d'année
    bonnes:
    - a
  indices:
    relance: Pourquoi l'artiste a-t-il choisi le moment de la conférence sur le climat ?
    methode: Demande-toi ce que le spectateur voit se passer jour après jour et à quoi cela lui fait penser.
    etape: Les blocs viennent des glaces du Groenland, qui fondent aujourd'hui plus vite. Quel message l'œuvre transmet-elle
      ?
  pieges:
  - si:
      contient:
      - b
    relance: 'Rien n''est à vendre : les blocs fondent sur place. Que veut faire comprendre l''artiste ?'
  - si:
      contient:
      - c
    relance: 'L''œuvre ne représente aucun dirigeant. Pense au lieu et au moment : la conférence sur le climat.'
  - si:
      contient:
      - d
    relance: 'Des blocs de glace qui disparaissent : est-ce une décoration ? Pense à la conférence qui a lieu au même moment.'
  solution: 'Ice Watch alerte sur le réchauffement climatique : en voyant fondre de vrais blocs de glace du Groenland pendant
    la COP21, les passants prennent conscience de la fonte des glaces. L''art devient un moyen d''agir pour le développement
    durable.'
- id: analyse-cite-radieuse
  type: ouverte
  difficulte: 3
  enonce: Voici une œuvre décrite. La Cité radieuse, construite à Marseille par Le Corbusier de 1947 à 1952, est un très grand
    immeuble en béton brut, posé sur de gros poteaux (des pilotis). Il compte plus de 300 appartements, la plupart sur deux
    niveaux, une rue intérieure avec des commerces, et un toit-terrasse avec une école maternelle et un gymnase. Les balcons
    sont peints de couleurs vives. Décris ce bâtiment et explique en quoi il propose une nouvelle façon de vivre, en le reliant
    à son époque.
  criteres:
  - L'élève décrit le bâtiment avec des mots précis (béton brut, pilotis, toit-terrasse, rue intérieure, logements en série).
  - 'L''élève explique le projet : réunir logement, commerces et services dans un seul bâtiment, une « ville verticale » pour
    une vie collective et plus confortable.'
  - 'L''élève relie l''œuvre à son contexte : la reconstruction et le manque de logements après la Seconde Guerre mondiale,
    l''essor de la vie moderne.'
  indices:
    relance: Pourquoi construire, juste après 1945, un seul immeuble qui loge des centaines de familles ?
    methode: Décris le bâtiment de bas en haut (pilotis, appartements, rue intérieure, toit), puis explique son projet, puis
      situe-le.
    etape: 'Tu peux commencer ainsi : « La Cité radieuse est un immeuble construit par Le Corbusier à Marseille entre 1947
      et 1952... »'
  solution: La Cité radieuse est un immeuble construit par Le Corbusier à Marseille entre 1947 et 1952. En béton brut, posé
    sur des pilotis, il réunit plus de 300 appartements, une rue intérieure avec des commerces et un toit-terrasse avec une
    école et un gymnase. Le Corbusier veut créer une « ville verticale » où l'on trouve tout sur place. Construite après la
    Seconde Guerre mondiale, quand beaucoup de familles manquent de logement, elle propose un mode de vie moderne, collectif
    et plus confortable.
