- id: nblm-quelle-technique-d-impression-au-travers-7
  type: texte_court
  difficulte: 1
  enonce: Quelle technique d'impression au travers d'un écran de tissu permet aux artistes du Pop Art de reproduire une image
    en série ?
  reponse:
    acceptees:
    - Sérigraphie
    fautes_tolerees: 1
  indices:
    relance: Ce terme désigne une technique d'impression pochoir utilisant un écran de soie ou de tissu synthétique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Sérigraphie. C''est exact : la sérigraphie est une technique d''impression sur écran de tissu privilégiée par
    Andy Warhol pour créer des œuvres en série.'
