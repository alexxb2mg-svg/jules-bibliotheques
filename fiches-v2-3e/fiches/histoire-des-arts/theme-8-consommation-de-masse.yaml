format: 2
notion: theme-8-consommation-de-masse
version: 1
etat: verifiee
declencheurs:
- Andy Warhol
- boîtes de soupe Campbell
- Cité radieuse
- Centre Pompidou
- Pont-Neuf emballé
- Ice Watch
prerequis:
- nommer-oeuvres-majeures
- theme-7-liberte-propagande
couverture: Couvre le pop art, l'abstraction et les nouveaux réalistes, l'architecture de Le Corbusier au Centre Pompidou
  et à Bilbao, le land art urbain de Christo et Jeanne-Claude et un exemple d'art engagé pour le climat. Les métissages artistiques
  de la mondialisation ne sont présentés que dans l'essentiel.
essentiel: 'Depuis 1945, les sociétés occidentales entrent dans l''ère de la consommation de masse : publicité, supermarchés,
  télévision, voitures, objets fabriqués en série. Les artistes réagissent à ce monde nouveau.


  Réalismes et abstractions : après la guerre, l''Américain Jackson Pollock projette et fait couler la peinture sur des toiles
  posées au sol (l''action painting). En France, les nouveaux réalistes (1960) utilisent de vrais objets : César compresse
  des voitures, Arman accumule des objets du quotidien. Yves Klein peint des monochromes d''un bleu intense. Le pop art, né
  au Royaume-Uni au milieu des années 1950 puis développé aux États-Unis, reprend les images de la publicité, de la bande
  dessinée et des vedettes : Andy Warhol peint les Campbell''s Soup Cans (1962), 32 toiles représentant des boîtes de soupe
  ; Roy Lichtenstein agrandit des cases de bande dessinée.


  Architecture et design : Le Corbusier construit la Cité radieuse de Marseille (1947-1952), un grand immeuble en béton sur
  pilotis, avec des appartements, une rue commerçante intérieure et un toit-terrasse : une « ville verticale ». À Paris, le
  Centre Pompidou de Renzo Piano et Richard Rogers (inauguré en 1977) montre à l''extérieur ses tuyaux colorés. Le musée Guggenheim
  de Bilbao, de Frank Gehry (1997), est couvert de titane aux formes courbes. Le design crée des objets en plastique colorés,
  fabriqués en série.


  Arts et environnement : des artistes interviennent dans la ville ou la nature. Christo et Jeanne-Claude emballent le Pont-Neuf
  à Paris en 1985. En 2015, pendant la conférence sur le climat de Paris (COP21), Olafur Eliasson installe Ice Watch : des
  blocs de glace venus du Groenland fondent sur une place de Paris, pour alerter sur le réchauffement climatique.


  Un monde ouvert : la mondialisation mêle les cultures ; le hip-hop, né à New York dans les années 1970, se diffuse dans
  le monde entier, et de nombreux artistes mêlent traditions de leur pays et formes contemporaines.

  '
methode:
- 'Identifier l''œuvre : titre, artiste, date, technique (peinture, sérigraphie, architecture, installation, objet).'
- 'Chercher le lien avec la société de consommation : objets en série, publicité, vedettes, ville moderne.'
- 'Dire la fonction : critiquer, célébrer, interroger, alerter (sur le climat par exemple).'
- Distinguer représenter la réalité (réalismes, pop art) et s'en détacher (abstraction).
vocabulaire:
- terme: pop art
  definition: un mouvement né dans les années 1950-1960 qui reprend les images de la publicité, de la bande dessinée et des
    vedettes
- terme: sérigraphie
  definition: une technique d'impression au travers d'un écran de tissu, qui permet de reproduire une image en série
- terme: design
  definition: la conception d'objets utiles, beaux et fabriqués en série
- terme: installation
  definition: une œuvre qui occupe un espace, dans lequel le spectateur peut circuler
erreurs_frequentes:
- 'Croire que Warhol fait de la publicité pour la soupe : il transforme en art un objet banal pour interroger la société de
  consommation.'
- 'Confondre l''architecte et l''œuvre : la Cité radieuse est de Le Corbusier, le Centre Pompidou de Renzo Piano et Richard
  Rogers.'
- 'Penser qu''une œuvre éphémère n''est pas de l''art : le Pont-Neuf emballé ou Ice Watch sont des œuvres, conservées par
  des photos et des films.'
- Confondre pop art (images de la consommation) et art abstrait (formes et couleurs sans objet reconnaissable).
exemple:
  enonce: Explique en trois phrases pourquoi on dit que le pop art est lié à la société de consommation.
  solution: 'Le pop art, né dans les années 1950 et 1960, reprend les images que tout le monde voit chaque jour : publicités,
    produits de supermarché, bandes dessinées, vedettes. Andy Warhol peint par exemple des boîtes de soupe Campbell en 1962,
    toutes presque identiques, comme des produits fabriqués en série. Il fait ainsi entrer la consommation de masse dans l''art,
    et pousse le spectateur à s''interroger sur ce monde d''objets et d''images.'
exercices:
- id: mot-pop-art
  type: texte_court
  difficulte: 1
  enonce: Quel mouvement artistique, né dans les années 1950-1960 et dont Andy Warhol est la figure la plus connue, reprend
    les images de la publicité, de la bande dessinée et des vedettes ?
  reponse:
    acceptees:
    - pop art
    - pop-art
    - popart
    fautes_tolerees: 0
  indices:
    relance: Le nom de ce mouvement est anglais et vient d'un mot qui veut dire « populaire ».
    methode: 'Le nom est formé de deux mots anglais courts : l''abréviation de « populaire » et le mot « art ».'
    etape: Le premier mot a trois lettres et commence par « p ».
  pieges:
  - si:
      valeur: surréalisme
    relance: Le surréalisme, dans les années 1920, explore les rêves. Quel mouvement reprend la publicité et les vedettes
      ?
  - si:
      valeur: street art
    relance: Le street art se fait sur les murs de la ville. Quel mouvement de Warhol reprend les images de la consommation
      ?
  solution: 'Le pop art : il reprend les images de la société de consommation (publicité, bande dessinée, vedettes), comme
    les boîtes de soupe Campbell d''Andy Warhol (1962).'
- id: fonction-soupe-warhol
  type: choix
  difficulte: 1
  enonce: En 1962, Andy Warhol expose 32 toiles presque identiques qui représentent chacune une boîte de soupe Campbell, un
    produit vendu dans tous les supermarchés américains. Que fait-il surtout ?
  reponse:
    options:
    - id: a
      texte: Il fait entrer un objet banal de la consommation de masse dans l'art
    - id: b
      texte: Il réalise une publicité commandée par la marque
    - id: c
      texte: Il dénonce un bombardement
    - id: d
      texte: Il glorifie un régime politique
    bonnes:
    - a
  indices:
    relance: Une boîte de soupe est-elle un sujet habituel pour un tableau de musée ?
    methode: Élimine les fonctions qui ne correspondent pas à un produit de supermarché peint en série.
    etape: Warhol n'a pas été payé par la marque. Il choisit ce produit parce que tout le monde le connaît. Quelle option
      correspond ?
  pieges:
  - si:
      contient:
      - b
    relance: Ces toiles ont été exposées dans une galerie d'art, pas sur des affiches de la marque. Que fait donc Warhol ?
  - si:
      contient:
      - c
    relance: Une boîte de soupe n'a rien d'une scène de guerre. Pourquoi peindre un produit de supermarché ?
  - si:
      contient:
      - d
    relance: Aucun pouvoir politique n'a commandé ces toiles. Que représentent-elles ?
  solution: Warhol fait entrer un objet banal de la consommation de masse dans l'art. En peignant 32 boîtes presque identiques,
    comme des produits en série, il interroge la place de la publicité et des objets dans la société.
