    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Parmi ces auteurs, lesquels sont architectes ? Lequel est le peintre du pop art ?
    methode: Place d'abord le peintre américain, puis le couple d'artistes qui emballe des monuments, puis départage les deux
