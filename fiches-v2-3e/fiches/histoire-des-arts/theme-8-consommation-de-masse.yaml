  difficulte: 2
  enonce: Relie chaque œuvre à son ou ses auteurs.
  reponse:
    gauche:
    - id: a
      texte: La Cité radieuse de Marseille (1947-1952)
    - id: b
      texte: Campbell's Soup Cans (1962)
    - id: c
