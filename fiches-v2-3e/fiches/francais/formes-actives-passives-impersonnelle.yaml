# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: formes-actives-passives-impersonnelle
version: 3
etat: verifiee
declencheurs:
- phrase avec est suivi d'un participe passé
- sujet qui ne fait pas vraiment l'action
- verbe impersonnel comme il pleut
- mettre une phrase à la forme passive
- transformer actif en passif
- complément d'agent
- il ne remplace personne
- sujet réel après le verbe
prerequis:
- voix-passive-effets-de-sens
essentiel: 'Une phrase peut être construite de trois manières qui ne disent pas la même chose : active, passive ou impersonnelle.


  1. La forme active.

  Le sujet fait l''action. « Le vent a cassé la branche. » Le sujet est « le vent », le COD est « la branche ».


  2. La forme passive.

  Le sujet subit l''action. Elle se forme avec l''auxiliaire être, au même temps que le verbe actif, suivi du participe passé,
  accordé avec le sujet.

  « La branche a été cassée par le vent. »

  Pour passer de l''actif au passif :

  - le COD de la phrase active devient le sujet ;

  - le sujet de la phrase active devient le complément d''agent, introduit par par (parfois de) ;

  - le verbe se met à l''auxiliaire être + participe passé.

  Seuls les verbes qui ont un COD ont un passif. Le complément d''agent peut être supprimé : « La branche a été cassée. »

  Le temps se lit sur l''auxiliaire être : « sera cassée » (futur), « était cassée » (imparfait).


  3. Les valeurs du passif.

  Le passif met en valeur ce qui subit l''action. Il permet aussi de ne pas dire qui agit : l''agent est inconnu (« Le magasin
  a été cambriolé »), sans importance, ou on veut le cacher. On l''emploie souvent dans les articles et les textes administratifs
  ou scientifiques.


  4. La phrase impersonnelle.

  Le sujet est le pronom neutre il, qui ne remplace personne. Deux cas :

  - verbes toujours impersonnels : il pleut, il neige, il faut, il s''agit de ;

  - verbes personnels employés à la forme impersonnelle : il arrive un accident, il manque deux élèves, il y a, il est interdit
  de.

  Le vrai sujet, appelé sujet réel, se place après le verbe (« deux élèves »). Le verbe s''accorde avec il, donc reste au
  singulier.


  5. Les valeurs de la phrase impersonnelle.

  Elle évoque un phénomène naturel (il pleut), une nécessité (il faut), ou présente un fait en s''effaçant derrière lui, sans
  dire qui agit. Elle met aussi en valeur le sujet réel placé en fin de phrase.


  Au brevet, on attend de reconnaître ces formes, de transformer une phrase et de dire l''effet produit.

  '
methode:
- 'Cherche le verbe conjugué et son sujet : le sujet fait-il l''action ou la subit-il ?'
- 'Repère l''auxiliaire être suivi d''un participe passé : c''est un signe de passif.'
- 'Cherche un complément d''agent (par, de) : il confirme le passif s''il est présent.'
- 'Pour passer de l''actif au passif : COD devient sujet, sujet devient complément d''agent, verbe à être + participe accordé,
  même temps.'
- 'Pour une phrase avec « il », vérifie que « il » ne remplace aucun nom : s''il est neutre, la phrase est impersonnelle.'
- 'Dis l''effet produit : insister sur celui qui subit, cacher l''agent, décrire un phénomène, présenter un fait sans acteur.'
vocabulaire:
- terme: voix active
  definition: construction où le sujet fait l'action
- terme: voix passive
  definition: construction où le sujet subit l'action (être + participe passé)
- terme: complément d'agent
  definition: complément du verbe passif qui indique qui fait l'action (introduit par « par » ou « de »)
- terme: phrase impersonnelle
  definition: phrase dont le sujet est le pronom neutre « il », qui ne désigne personne
- terme: sujet apparent
  definition: le pronom « il » d'une phrase impersonnelle
- terme: sujet réel
  definition: le groupe qui suit le verbe impersonnel et dit de quoi on parle (il manque deux élèves)
- terme: verbe transitif direct
  definition: verbe qui peut avoir un COD, et donc un passif
- terme: participe passé
  definition: forme du verbe qui suit l'auxiliaire être et s'accorde avec le sujet
erreurs_frequentes:
- 'Croire que toute phrase avec « être » est passive : « Elle est contente » n''a pas de participe passé de verbe d''action.'
- 'Oublier d''accorder le participe passé avec le nouveau sujet : « les branches ont été cassées ».'
- 'Changer le temps du verbe en passant au passif : il faut garder le même temps, porté par être.'
- 'Prendre « il » pour un vrai pronom personnel : dans « il pleut » ou « il faut », il ne désigne personne.'
- 'Accorder le verbe impersonnel avec le sujet réel : on écrit « il manque deux élèves », pas « ils manquent ».'
exemple:
  enonce: 'Transforme cette phrase active en phrase passive : « Le vent a cassé la branche. »'
  solution: La branche a été cassée par le vent. Le COD « la branche » devient sujet, et le sujet « le vent » devient complément
    d'agent, introduit par « par ».
exercices:
- id: reconnaitre-passif
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases est à la forme passive ?
  reponse:
    options:
    - id: a
      texte: Le gâteau a été mangé par les enfants.
    - id: b
      texte: Les enfants ont mangé le gâteau.
    - id: c
      texte: Les enfants mangent un gâteau.
    bonnes:
    - a
  indices:
    relance: Cherche la phrase où le sujet ne fait pas l'action, mais la subit.
    methode: Repère l'auxiliaire « être » suivi d'un participe passé, avec un complément introduit par « par ».
    etape: Dans une seule phrase, le gâteau (sujet) est mangé, il ne mange pas lui-même.
  pieges:
  - si:
      contient:
      - b
    relance: 'Ici, « les enfants » (sujet) mangent : ils font l''action, ce n''est pas la forme passive.'
  - si:
      contient:
      - c
    relance: 'Ici encore, le sujet fait l''action au présent : c''est la forme active.'
  solution: '« Le gâteau a été mangé par les enfants » est à la forme passive : le sujet « le gâteau » subit l''action, faite
    en réalité par « les enfants », complément d''agent.'
- id: reconnaitre-impersonnelle
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases est une phrase impersonnelle ?
  reponse:
    options:
    - id: a
      texte: Il pleut depuis ce matin.
    - id: b
      texte: Il court depuis ce matin.
    - id: c
      texte: Il a mangé depuis ce matin.
    bonnes:
    - a
  indices:
    relance: Demande-toi, dans chaque phrase, si « il » remplace une personne précise ou non.
    methode: Dans une phrase impersonnelle, on ne peut pas remplacer « il » par un prénom sans perdre le sens.
    etape: Une seule phrase parle d'un phénomène météo, sans personne précise qui agit.
  pieges:
  - si:
      contient:
      - b
    relance: 'Ici, « il » remplace une personne précise qui court : ce n''est pas une phrase impersonnelle.'
  - si:
      contient:
      - c
    relance: 'Ici aussi, « il » désigne une personne précise qui a mangé : ce n''est pas impersonnel.'
  solution: '« Il pleut depuis ce matin » est une phrase impersonnelle : le pronom « il » ne désigne aucune personne, il ne
    fait que représenter le phénomène météorologique.'
- id: transformer-actif-passif
  type: texte_court
  difficulte: 2
  enonce: Dans la phrase passive « La lettre a été écrite par Paul », qui est le sujet grammatical (celui qui subit l'action)
    ? Réponds par le groupe nominal complet.
  reponse:
    acceptees:
    - la lettre
    fautes_tolerees: 1
  indices:
    relance: Cherche ce qui est écrit dans la phrase, pas celui qui écrit.
    methode: Le sujet d'une phrase passive subit l'action ; l'auteur réel est dans le complément d'agent, après « par ».
    etape: Pose la question « qu'est-ce qui a été écrit ? » pour trouver le sujet.
  pieges:
  - si:
      valeur: paul
    relance: Paul est le complément d'agent, celui qui fait vraiment l'action. Le sujet grammatical est ce qui est écrit.
  solution: 'Le sujet grammatical est « la lettre » : c''est elle qui subit l''action d''être écrite. Paul, introduit par
    « par », est le complément d''agent.'
- id: effet-passif
  type: ouverte
  difficulte: 3
  enonce: Explique en une ou deux phrases pourquoi un journaliste pourrait écrire « Le magasin a été cambriolé » plutôt que
    « Des inconnus ont cambriolé le magasin ».
  criteres:
  - L'élève explique que la forme passive met en valeur le magasin (la victime) plutôt que les auteurs.
  - L'élève relie cette explication au fait que les auteurs sont inconnus ou moins importants ici.
  - La réponse est rédigée en une ou deux phrases correctes, avec un vocabulaire précis (sujet, complément d'agent, forme
    passive).
  indices:
    relance: Que sait-on, dans cette phrase, des personnes qui ont commis le cambriolage ?
    methode: 'Compare ce que chaque forme met en avant : le lieu cambriolé, ou les auteurs du cambriolage.'
    etape: Tu peux commencer par « La forme passive met en valeur... » puis expliquer pourquoi.
  solution: La forme passive met en valeur le magasin, victime du cambriolage, plutôt que les auteurs, qui restent inconnus
    ou secondaires dans l'information donnée. Elle permet de parler du fait sans avoir à préciser qui l'a commis.
- id: nblm-dans-la-phrase-passive-la-souris-est-man-1
  type: choix
  difficulte: 2
  enonce: Dans la phrase passive « La souris est mangée par le chat », quel est le rôle du sujet grammatical « La souris »,
    sachant qu'il s'agit d'un sujet qui ne fait pas vraiment l'action ?
  reponse:
    options:
    - id: o1
      texte: Il subit l'action exprimée par le verbe.
    - id: o2
      texte: Il fait activement l'action de manger.
    - id: o3
      texte: Il joue le rôle de sujet impersonnel sans réalité.
    - id: o4
      texte: Il constitue le complément d'agent du verbe.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'être qui subit l'action par opposition à celui qui l'accomplit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : à la voix passive, ce n''est pas le sujet qui fait l''action, mais le complément d''agent
      (le chat).'
  - si:
      contient:
      - o3
    relance: 'Confusion de notion : « La souris » est un groupe nominal réel et désigné, pas un pronom impersonnel.'
  - si:
      contient:
      - o4
    relance: 'Confusion de fonction : le complément d''agent est « par le chat », tandis que « La souris » est le sujet.'
  solution: 'Il subit l''action exprimée par le verbe. C''est la définition exacte de la voix passive : le sujet grammatical
    ne fait pas l''action, il la subit.'
- id: nblm-comment-se-construit-le-verbe-dans-une-p-2
  type: choix
  difficulte: 2
  enonce: Comment se construit le verbe dans une phrase avec « est » suivi d'un participe passé à la voix passive ?
  reponse:
    options:
    - id: o1
      texte: Avec l'auxiliaire « être » suivi du participe passé du verbe.
    - id: o2
      texte: Avec l'auxiliaire « avoir » suivi d'un verbe à l'infinitif.
    - id: o3
      texte: Avec le seul pronom impersonnel « il » devant le verbe.
    - id: o4
      texte: Uniquement avec un verbe d'action simple sans auxiliaire.
    bonnes:
    - o1
  indices:
    relance: Identifie l'auxiliaire obligatoire associé au participe passé pour former le passif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de conjugaison : la voix passive nécessite l''auxiliaire « être » et un participe passé, non l''auxiliaire
      « avoir ».'
  - si:
      contient:
      - o3
    relance: 'Confusion avec la forme impersonnelle : la tournure passive repose sur la structure être + participe passé.'
  - si:
      contient:
      - o4
    relance: 'Erreur : un verbe seul sans l''auxiliaire « être » reste à la forme active.'
  solution: 'Avec l''auxiliaire « être » suivi du participe passé du verbe. C''est exact : le verbe passif se forme systématiquement
    avec l''auxiliaire « être » conjugué et le participe passé.'
- id: nblm-dans-une-phrase-avec-un-verbe-impersonne-3
  type: choix
  difficulte: 2
  enonce: Dans une phrase avec un verbe impersonnel comme « il pleut », quelle est la particularité du sujet « il » ?
  reponse:
    options:
    - id: o1
      texte: Il ne désigne personne ni aucune chose précise.
    - id: o2
      texte: Il désigne le ciel ou les nuages qui font tomber la pluie.
    - id: o3
      texte: Il subit l'action de pleuvoir de manière passive.
    - id: o4
      texte: Il remplit la fonction de complément d'agent.
    bonnes:
    - o1
  indices:
    relance: Demande-toi si le pronom « il » peut être remplacé par un nom précis d'être ou d'objet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que le pronom « il » impersonnel remplace un nom réel du contexte.'
  - si:
      contient:
      - o3
    relance: 'Confusion entre forme impersonnelle et voix passive : « il pleut » est une tournure impersonnelle, pas un passif.'
  - si:
      contient:
      - o4
    relance: 'Erreur de fonction grammaticale : « il » est le sujet grammatical apparent du verbe impersonnel.'
  solution: 'Il ne désigne personne ni aucune chose précise. C''est exact : dans la phrase impersonnelle, « il » est un sujet
    grammatical apparent qui ne représente rien de réel.'
- id: nblm-comment-mettre-une-phrase-a-la-forme-pas-4
  type: choix
  difficulte: 2
  enonce: Comment mettre une phrase à la forme passive lors de la transformation active-passive de « Le vent a cassé la branche
    » ?
  reponse:
    options:
    - id: o1
      texte: La branche a été cassée par le vent.
    - id: o2
      texte: Le vent est cassé par la branche.
    - id: o3
      texte: Il a été cassé la branche par le vent.
    - id: o4
      texte: La branche cassera par le vent.
    bonnes:
    - o1
  indices:
    relance: Transforme le COD de la phrase active en sujet et utilise l'auxiliaire « être » au passé composé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de sens : les rôles du sujet et du COD ont été inversés à tort, modifiant complètement l''action.'
  - si:
      contient:
      - o3
    relance: 'Mélange incorrect de structures : cette formulation tente de fusionner forme impersonnelle et voix passive de
      façon erronée.'
  - si:
      contient:
      - o4
    relance: 'Erreur de voix et de temps : le verbe n''est pas conjugué avec l''auxiliaire « être » au temps composé correspondant.'
  solution: 'La branche a été cassée par le vent. C''est exact : le COD « la branche » devient sujet, le verbe prend la forme
    passive et le sujet actif devient complément d''agent.'
- id: nblm-quelle-erreur-classique-faut-il-eviter-c-5
  type: choix
  difficulte: 2
  enonce: Quelle erreur classique faut-il éviter concernant le complément d'agent à la voix passive ?
  reponse:
    options:
    - id: o1
      texte: Oublier que le complément d'agent, introduit par « par », peut être absent.
    - id: o2
      texte: Croire que le verbe passif s'accorde toujours avec le complément d'agent.
    - id: o3
      texte: Confondre le sujet actif avec le verbe impersonnel.
    - id: o4
      texte: Penser qu'une phrase passive nécessite obligatoirement la négation.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi si le groupe de mots précisant qui agit réellement doit toujours être écrit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le verbe s'accorde avec son sujet grammatical ; l'erreur répertoriée est d'oublier que le complément d'agent
      peut être sous-entendu ou absent.
  - si:
      contient:
      - o3
    relance: Les tournures impersonnelles et passives sont distinctes, mais cette option ne décrit pas l'erreur spécifique
      du complément d'agent.
  - si:
      contient:
      - o4
    relance: La forme négative n'a pas de lien obligatoire avec le complément d'agent de la voix passive.
  solution: 'Oublier que le complément d''agent, introduit par « par », peut être absent. C''est exact : une phrase passive
    n''a pas obligatoirement de complément d''agent exprimé.'
- id: nblm-quelles-sont-les-deux-affirmations-vraie-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations vraies sur la voix passive et la forme impersonnelle ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La voix passive met en valeur celui qui subit l'action plutôt que celui qui la fait.
    - id: o2
      texte: La voix passive permet de ne pas nommer l'auteur de l'action si on l'ignore ou si on veut rester vague.
    - id: o3
      texte: Dans une phrase impersonnelle comme « il pleut », le pronom « il » désigne une personne précise.
    - id: o4
      texte: Toute phrase contenant l'auxiliaire « être » au passé composé (« il est parti ») est à la voix passive.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux propositions qui décrivent correctement les effets de sens du passif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : le pronom « il » dans une phrase impersonnelle est un sujet apparent qui ne représente personne.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : certains verbes intransitifs se conjuguent avec « être » aux temps composés à la voix active.'
  solution: 'La voix passive met en valeur celui qui subit l''action plutôt que celui qui la fait ; La voix passive permet
    de ne pas nommer l''auteur de l''action si on l''ignore ou si on veut rester vague. C''est exact : le changement de voix
    permet de modifier le point de vue en insistant sur le sujet qui subit l''action.'
- id: nblm-dans-une-phrase-passive-comment-appelle-7
  type: texte_court
  difficulte: 1
  enonce: 'Dans une phrase passive, comment appelle-t-on le complément (introduit par « par » ou « de ») qui indique qui fait
    vraiment l''action ? Réponds par un mot : l''______.'
  reponse:
    acceptees:
    - agent
    fautes_tolerees: 1
  indices:
    relance: Ce mot complète le terme « complément d'... ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'agent. C''est exact : le complément d''agent est le groupe prépositionnel qui désigne l''auteur réel de l''action
    à la voix passive.'
- id: nblm-pour-mettre-une-phrase-active-a-la-forme-8
  type: texte_court
  difficulte: 1
  enonce: Pour mettre une phrase active à la forme passive, le complément d'objet direct (COD) de la phrase active devient
    le ______ de la phrase passive.
  reponse:
    acceptees:
    - sujet
    fautes_tolerees: 1
  indices:
    relance: Indique la fonction grammaticale principale qui commande l'accord du verbe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'sujet. C''est exact : lors de la transformation passive, l''ancien COD passe en début de phrase et devient le
    sujet grammatical.'
- id: accord-participe-passif
  type: texte_court
  difficulte: 2
  enonce: 'Complète avec le participe passé de « casser » : « Les branches ont été ... par le vent. »'
  reponse:
    acceptees:
    - cassées
    - cassees
    fautes_tolerees: 0
  indices:
    relance: Avec quel mot le participe passé s'accorde-t-il dans une phrase passive ?
    methode: Le participe passé d'un verbe passif s'accorde avec le sujet en genre et en nombre.
    etape: 'Le sujet est « les branches » : féminin pluriel. Écris le participe avec les marques correspondantes.'
  pieges:
  - si:
      valeur: cassé
    relance: Le sujet est féminin pluriel. Ajoute les marques d'accord.
  - si:
      valeur: cassés
    relance: Le sujet est un nom féminin. Vérifie le genre.
  solution: 'Le sujet « les branches » est féminin pluriel : le participe s''écrit cassées.'
- id: temps-du-passif
  type: choix
  difficulte: 2
  enonce: Dans « La porte sera fermée à minuit. », à quel temps est le verbe ?
  reponse:
    options:
    - id: a
      texte: le futur simple (forme passive)
    - id: b
      texte: le passé composé (forme passive)
    - id: c
      texte: l'imparfait (forme passive)
    bonnes:
    - a
  indices:
    relance: Pour le temps d'une phrase passive, quelle forme d'« être » faut-il regarder ?
    methode: 'On lit le temps sur l''auxiliaire être : présent, imparfait, futur, passé composé...'
    etape: 'L''auxiliaire est « sera » : à quel temps ce mot est-il conjugué ?'
  pieges:
  - si:
      contient:
      - b
    relance: Au passé composé passif, on aurait « a été ». Repère l'auxiliaire.
  - si:
      contient:
      - c
    relance: À l'imparfait passif, on aurait « était ». Repère l'auxiliaire.
  solution: L'auxiliaire « sera » est au futur simple, donc le verbe est au futur simple, à la forme passive.
- id: reconnaitre-forme
  type: association
  difficulte: 3
  enonce: Relie chaque phrase à sa forme.
  reponse:
    gauche:
    - id: a
      texte: Le facteur distribue le courrier.
    - id: b
      texte: Le courrier est distribué par le facteur.
    - id: c
      texte: Il manque deux élèves dans la classe.
    - id: d
      texte: Il faut partir avant la nuit.
    droite:
    - id: y
      texte: forme passive
    - id: z
      texte: impersonnelle avec sujet réel
    - id: w
      texte: impersonnelle avec verbe toujours impersonnel
    - id: x
      texte: forme active
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Pour chaque phrase, cherche si le sujet agit, subit ou si « il » est neutre.
    methode: Repère l'auxiliaire être + participe pour le passif, et le pronom « il » neutre pour l'impersonnel.
    etape: 'Commence par la phrase avec « par le facteur » : le sujet y subit l''action.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Recherche laquelle en vérifiant le sujet de chaque phrase.
  - si:
      diagnostic: associations_fausses
    relance: Classe d'abord les phrases où le sujet fait l'action, celles où il la subit, puis celles avec « il » neutre.
  solution: 'Phrase 1 : active ; phrase 2 : passive (être + participe, complément d''agent) ; phrases 3 et 4 : impersonnelles
    (il est neutre ; « manque » est un verbe personnel employé ainsi, « falloir » est toujours impersonnel).'
- id: transformer-passif
  type: ordre
  difficulte: 3
  enonce: Range les étapes pour transformer « Le vent a cassé la branche » en phrase passive.
  reponse:
    elements:
    - id: a
      texte: Repérer le COD (la branche) et le sujet (le vent)
    - id: b
      texte: Faire du COD le sujet de la nouvelle phrase
    - id: c
      texte: Mettre le verbe à « être » au même temps + participe passé accordé
    - id: d
      texte: Ajouter le sujet d'origine comme complément d'agent introduit par « par »
  indices:
    relance: 'Par quoi commence-t-on : repérer les mots ou écrire le verbe ?'
    methode: On repère d'abord les deux groupes, puis on change leurs fonctions, puis le verbe, et on termine par l'agent.
    etape: La première étape est de repérer le COD et le sujet.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Tu as inversé deux étapes voisines. Vérifie l'ordre entre changer le verbe et ajouter l'agent.
  - si:
      diagnostic: ordre_faux
    relance: 'L''ordre logique est : repérer, nouveau sujet, verbe passif, complément d''agent.'
  solution: Repérer COD et sujet ; COD devient sujet ; verbe à être + participe accordé (« a été cassée ») ; sujet d'origine
    en complément d'agent.
