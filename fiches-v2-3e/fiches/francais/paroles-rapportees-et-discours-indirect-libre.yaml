      a: x
      b: y
      c: z
  indices:
    relance: Cherche les guillemets, puis le mot « que », puis la voix du personnage sans marque.
    methode: Le discours indirect libre n'a ni guillemets ni « que », mais garde des questions ou des exclamations.
    etape: La phrase avec guillemets est au direct. La phrase avec « que » est à l'indirect. Il reste la dernière.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie celle qui contient une exclamation sans guillemets.
  - si:
      diagnostic: associations_fausses
    relance: 'Repars des marques : guillemets, « que », ou pensée du personnage sans verbe introducteur.'
  solution: La phrase avec guillemets est au discours direct, celle avec « que » au discours indirect, et celle avec exclamation
    sans guillemets au discours indirect libre.
