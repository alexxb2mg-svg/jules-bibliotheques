- id: transposer-demain
  type: texte_court
  difficulte: 1
  enonce: 'Marc a dit : « Je viendrai demain. » Au discours indirect, « demain » devient quelle expression ? (deux mots)'
  reponse:
    acceptees:
    - le lendemain
    - lendemain
    fautes_tolerees: 1
  indices:
    relance: Le repère de temps doit s'adapter, car on ne parle plus depuis le même jour.
    methode: Au passé, « hier » devient « la veille ». Cherche le repère qui correspond à « demain ».
    etape: L'expression commence par « le » et désigne le jour qui suit celui dont on parle.
  pieges:
  - si:
      valeur: demain
    relance: 'On ne peut pas garder « demain » : le récit est raconté après coup. Quelle expression désigne le jour suivant
      ?'
  solution: '« demain » devient « le lendemain » : Marc a dit qu''il viendrait le lendemain.'
- id: temps-transposition
  type: choix
  difficulte: 2
  enonce: 'Léa a dit : « Je partirai tôt. » Quelle phrase est correcte au discours indirect ?'
  reponse:
    options:
    - id: a
      texte: Léa a dit qu'elle partirait tôt.
    - id: b
      texte: Léa a dit qu'elle partira tôt.
    - id: c
      texte: Léa a dit que je partirai tôt.
    - id: d
      texte: 'Léa a dit : elle partirait tôt.'
    bonnes:
    - a
  indices:
    relance: Regarde à la fois le pronom et le temps du verbe dans chaque option.
    methode: 'Le verbe introducteur est au passé composé : le futur se transforme en conditionnel présent, et « je » devient
      « elle ».'
    etape: Deux options gardent une erreur (pronom ou temps), une garde les deux-points du discours direct. Élimine-les.
  pieges:
  - si:
      contient:
      - b
    relance: Le pronom est bon, mais le futur doit changer quand le verbe introducteur est au passé.
  - si:
      contient:
      - c
    relance: 'Le temps est bon, mais « je » désignait Léa : il faut un pronom de la troisième personne.'
  - si:
      contient:
      - d
    relance: 'Il ne faut plus de deux-points : c''est la conjonction « que » qui introduit le discours indirect.'
  solution: '« je » devient « elle », le futur « partirai » devient le conditionnel « partirait » : Léa a dit qu''elle partirait
    tôt.'
