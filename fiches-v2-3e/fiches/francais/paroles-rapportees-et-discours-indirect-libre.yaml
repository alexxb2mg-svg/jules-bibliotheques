format: 2
notion: paroles-rapportees-et-discours-indirect-libre
version: 3
etat: verifiee
declencheurs:
- transformer une phrase au discours indirect
- guillemets de dialogue
- changer je en il dans une phrase rapportée
- parole d'un personnage sans guillemets
- passer du direct à l'indirect
- verbe introducteur de parole
- il dit que demain devient le lendemain
- pensées du personnage sans guillemets
prerequis:
- transposition-oral-ecrit
essentiel: 'Il y a trois façons de rapporter les paroles ou les pensées de quelqu''un.


  Le discours direct reproduit les paroles telles quelles, entre guillemets, avec un verbe introducteur (dire, demander, répondre,
  s''écrier) : Léa a dit : « Je suis fatiguée. » Dans un dialogue, on utilise des tirets et des retours à la ligne.


  Le discours indirect rapporte les paroles sans guillemets, dans une proposition subordonnée. Elle est introduite par « que
  » (déclaration), « si » (question fermée), un mot interrogatif (question ouverte) ou « de » + infinitif (ordre) : Léa a
  dit qu''elle était fatiguée.


  Quand on passe du direct à l''indirect, il faut adapter.

  Les personnes : « je » devient « il » ou « elle », « votre » devient « leur ».

  Les temps, si le verbe introducteur est au passé : présent → imparfait, futur → conditionnel présent, passé composé → plus-que-parfait.

  Les repères : demain → le lendemain, hier → la veille, ici → là, aujourd''hui → ce jour-là.

  La ponctuation : plus de guillemets, plus de point d''interrogation ni d''exclamation.


  Exemple : Marc a dit : « Je viendrai demain. » → Marc a dit qu''il viendrait le lendemain.


  Le discours indirect libre rapporte les paroles ou les pensées d''un personnage sans guillemets, sans verbe introducteur
  ni « que ». Il garde le ton du personnage (exclamations, questions, mots familiers) mais utilise les personnes et les temps
  du récit : Léa soupira. Elle était si fatiguée ! Pourquoi devait-elle encore travailler ?


  Comment le reconnaître ? Les temps sont ceux du récit (imparfait, conditionnel), mais la ponctuation expressive et le vocabulaire
  révèlent la voix du personnage. On l''emploie souvent dans le roman pour faire entendre les pensées.


  Au brevet, on demande de reconnaître le type de discours, de transposer une phrase du direct à l''indirect, et d''expliquer
  l''effet du discours indirect libre.

  '
methode:
- 'Repère le type de discours : guillemets et verbe introducteur (direct), « que » sans guillemets (indirect), ou voix du
  personnage sans marque (indirect libre).'
- Pour transposer, supprime les guillemets et choisis la conjonction (que, si, de).
- Change les pronoms et les possessifs selon celui qui parle.
- Si le verbe introducteur est au passé, change le temps du verbe rapporté.
- Adapte les indicateurs de temps et de lieu (demain, hier, ici).
- 'Relis : la phrase doit être correcte et garder le sens de départ.'
vocabulaire:
- terme: discours direct
  definition: paroles rapportées telles quelles, entre guillemets
- terme: discours indirect
  definition: paroles rapportées dans une subordonnée, sans guillemets
- terme: discours indirect libre
  definition: paroles ou pensées rapportées sans marque, avec les temps du récit
- terme: verbe introducteur
  definition: verbe qui annonce une parole (dire, demander, répondre)
- terme: proposition subordonnée
  definition: proposition qui dépend d'une autre proposition
- terme: concordance des temps
  definition: adaptation du temps du verbe rapporté au temps du verbe introducteur
- terme: narrateur
  definition: voix qui raconte l'histoire
erreurs_frequentes:
- Garder les temps et les pronoms du discours direct quand on passe à l'indirect.
- Oublier de changer « demain », « hier » ou « ici ».
- Laisser un point d'interrogation dans une question au discours indirect.
- 'Confondre le discours indirect libre avec le discours direct : il n''a ni guillemets ni verbe introducteur, mais on entend
  la voix du personnage.'
exemple:
  enonce: 'Transpose au discours indirect : Marc a dit : « Je viendrai demain. »'
  solution: Marc a dit qu'il viendrait le lendemain. Le pronom « je » devient « il », le futur « viendrai » devient un conditionnel
    « viendrait », et « demain » devient « le lendemain ».
exercices:
- id: reconnaitre-discours-direct
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases est au discours direct ?
  reponse:
    options:
    - id: a
      texte: 'Il a dit : « Je pars ce soir. »'
    - id: b
      texte: Il a dit qu'il partait ce soir.
    - id: c
      texte: Il partait ce soir, enfin !
    bonnes:
    - a
  indices:
    relance: Cherche la phrase qui contient des guillemets et un verbe introducteur juste avant.
    methode: Le discours direct reproduit les paroles exactement, entre guillemets.
    etape: 'Une seule phrase a des guillemets après « a dit : ».'
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase n''a pas de guillemets et utilise « que » : c''est le discours indirect, pas le discours direct.'
  - si:
      contient:
      - c
    relance: 'Cette phrase n''a ni guillemets ni verbe introducteur : c''est du discours indirect libre, mêlé au récit.'
  solution: '« Il a dit : « Je pars ce soir. » » est au discours direct : les paroles sont reproduites exactement, entre guillemets,
    avec le verbe introducteur « a dit ».'
- id: transposer-pronom
  type: texte_court
  difficulte: 1
  enonce: 'Transpose au discours indirect : Léa a dit : « J''ai faim. » (Complète : Léa a dit qu''... faim. Donne uniquement
    le pronom et le verbe avoir conjugué à l''imparfait, par exemple « il avait ».)'
  reponse:
    acceptees:
    - elle avait
    fautes_tolerees: 1
  indices:
    relance: Le pronom « je » de Léa doit changer, puisque ce n'est plus elle qui parle directement.
    methode: « Je » devient « elle » (c'est Léa), et le présent « ai » devient l'imparfait dans le discours indirect passé.
    etape: Léa est une fille, donc le pronom à utiliser est « elle », pas « il ».
  pieges:
  - si:
      valeur: il avait
    relance: 'Léa est un prénom féminin : quel pronom personnel utilise-t-on pour elle ?'
  - si:
      valeur: elle a
    relance: Le verbe doit changer de temps aussi, pas seulement le pronom. Le présent devient l'imparfait après un verbe
      introducteur au passé.
  solution: Léa a dit qu'elle avait faim. Le pronom « je » devient « elle », et le présent « ai » devient l'imparfait « avait
    ».
- id: reperer-indirect-libre
  type: choix
  difficulte: 2
  enonce: Dans quelle phrase les paroles d'un personnage sont-elles rapportées au discours indirect libre ?
  reponse:
    options:
    - id: a
      texte: Elle se leva. Quelle idée stupide avait-elle eue là !
    - id: b
      texte: 'Elle se leva et dit : « Quelle idée stupide j''ai eue ! »'
    - id: c
      texte: Elle se leva et dit qu'elle avait eu une idée stupide.
    bonnes:
    - a
  indices:
    relance: Cherche la phrase qui n'a ni guillemets ni « que », mais qui garde le ton du personnage.
    methode: 'Le discours indirect libre est mêlé au récit : pas de verbe introducteur juste avant, pas de guillemets.'
    etape: Une phrase garde une exclamation, comme si le personnage pensait tout haut, sans marque de rapport.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase a des guillemets et un verbe introducteur : c''est du discours direct, pas indirect libre.'
  - si:
      contient:
      - c
    relance: 'Cette phrase utilise « que » après « dit » : c''est du discours indirect classique, pas du discours indirect
      libre.'
  solution: '« Elle se leva. Quelle idée stupide avait-elle eue là ! » est au discours indirect libre : la pensée du personnage
    se glisse dans le récit, sans guillemets ni « que ».'
- id: reecrire-au-passe
  type: ouverte
  difficulte: 3
  enonce: 'Transpose entièrement au discours indirect, en commençant par « Le professeur a expliqué que... » : Le professeur
    a dit : « Demain, vous rendrez votre exposé. »'
  criteres:
  - L'élève supprime les guillemets et introduit la parole par « que ».
  - L'élève change correctement le temps du verbe (futur devenant conditionnel) et l'indicateur de temps « demain » en « le
    lendemain ».
  indices:
    relance: 'Repère les trois éléments à transformer : le temps du verbe, le pronom, l''indicateur de temps « demain ».'
    methode: Après un verbe introducteur au passé, le futur devient un conditionnel, et « demain » devient « le lendemain
      ».
    etape: 'Tu peux commencer ainsi : « Le professeur a expliqué que le lendemain... ».'
  solution: Le professeur a expliqué que le lendemain, ils rendraient leur exposé. Le futur « rendrez » devient un conditionnel
    « rendraient », « demain » devient « le lendemain », et « vous » devient « ils » (les élèves dont on parle).
- id: nblm-quelle-est-la-particularite-principale-d-1
  type: choix
  difficulte: 2
  enonce: Quelle est la particularité principale du discours direct pour rapporter des paroles ?
  reponse:
    options:
    - id: o1
      texte: Il reproduit les paroles exactes entre guillemets, précédées ou suivies d'un verbe introducteur.
    - id: o2
      texte: Il supprime les guillemets et intègre les paroles dans une subordonnée introduite par « que ».
    - id: o3
      texte: Il insère les paroles dans le récit sans aucun verbe introducteur ni guillemets.
    - id: o4
      texte: Il transforme systématiquement les pronoms personnels de la première personne en troisième personne.
    bonnes:
    - o1
  indices:
    relance: Pense à la ponctuation qui entoure les paroles exactes prononcées par le personnage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la suppression des guillemets et l''utilisation de la subordonnée introduite par « que »
      caractérisent le discours indirect.'
  - si:
      contient:
      - o3
    relance: 'Erreur : l''absence totale de guillemets et de verbe introducteur est la définition du discours indirect libre.'
  - si:
      contient:
      - o4
    relance: 'Faux : au discours direct, la première personne (« je ») est conservée telle quelle.'
  solution: 'Il reproduit les paroles exactes entre guillemets, précédées ou suivies d''un verbe introducteur. Exactement
    : le discours direct rapporte les paroles telles qu''elles ont été prononcées, en utilisant les guillemets et un verbe
    de parole.'
- id: nblm-lorsqu-on-transpose-au-discours-indirect-2
  type: choix
  difficulte: 2
  enonce: 'Lorsqu''on transpose au discours indirect la phrase : Marc a dit : « Je viendrai demain », quelle est la forme
    correcte ?'
  reponse:
    options:
    - id: o1
      texte: Marc a dit qu'il viendrait le lendemain.
    - id: o2
      texte: Marc a dit qu'il viendra demain.
    - id: o3
      texte: 'Marc a dit : « qu''il viendrait le lendemain ».'
    - id: o4
      texte: Marc a dit que je viendrais le lendemain.
    bonnes:
    - o1
  indices:
    relance: Fais attention aux changements combinés des pronoms, du temps verbal et de l'indicateur de temps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : oublier d''adapter la concordance des temps (le futur devient conditionnel) et l''indicateur
      temporel (« demain » devient « le lendemain »).'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : conserver les guillemets de dialogue alors qu''ils doivent être supprimés au discours indirect.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le pronom personnel sujet « je » n''a pas été changé en « il » lors de la transposition.'
  solution: 'Marc a dit qu''il viendrait le lendemain. Correct : le pronom « je » devient « il », le futur « viendrai » devient
    un conditionnel « viendrait », et « demain » devient « le lendemain ».'
- id: nblm-comment-se-caracterisent-les-paroles-d-u-3
  type: choix
  difficulte: 2
  enonce: Comment se caractérisent les paroles d'un personnage rédigées au discours indirect libre ?
  reponse:
    options:
    - id: o1
      texte: Elles sont intégrées au récit sans guillemets ni verbe introducteur, tout en gardant le ton et le style du personnage.
    - id: o2
      texte: Elles sont obligatoirement encadrées par des guillemets de dialogue.
    - id: o3
      texte: Elles dépendent toujours d'une proposition subordonnée introduite par la conjonction « que ».
    - id: o4
      texte: Elles conservent systématiquement les pronoms personnels de première personne (« je »).
    bonnes:
    - o1
  indices:
    relance: Pense à la manière dont le discours conserve l'expressivité sans utiliser de marqueur de subordination.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : l''absence de guillemets est précisément la marque fondamentale du discours indirect libre.'
  - si:
      contient:
      - o3
    relance: 'Erreur : c''est le discours indirect classique qui utilise une proposition subordonnée introduite par « que
      ».'
  - si:
      contient:
      - o4
    relance: 'Faux : au discours indirect libre, les pronoms s''alignent sur la narration (troisième personne).'
  solution: 'Elles sont intégrées au récit sans guillemets ni verbe introducteur, tout en gardant le ton et le style du personnage.
    Exactement : le discours indirect libre combine les temps et pronoms du récit avec l''expressivité et la liberté du discours
    direct, sans guillemets.'
- id: nblm-quel-changement-de-pronom-doit-on-effect-4
  type: choix
  difficulte: 2
  enonce: 'Quel changement de pronom doit-on effectuer pour transformer la phrase « Léa a dit : "Je suis fatiguée" » au discours
    indirect ?'
  reponse:
    options:
    - id: o1
      texte: Changer le pronom « je » en « elle ».
    - id: o2
      texte: Conserver obligatoirement le pronom « je ».
    - id: o3
      texte: Remplacer le pronom « je » par le pronom relatif « qui ».
    - id: o4
      texte: Effacer complètement le pronom sujet sans le remplacer.
    bonnes:
    - o1
  indices:
    relance: Prends en compte le sujet du verbe introducteur pour adapter la personne grammaticale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : oublier d''adapter les pronoms personnels lors du passage du discours direct au discours
      indirect.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la proposition subordonnée d''un discours indirect nécessite un pronom personnel sujet (elle), non
      un pronom relatif.'
  - si:
      contient:
      - o4
    relance: 'Faux : la forme verbale dans la subordonnée exige un sujet exprimé.'
  solution: 'Changer le pronom « je » en « elle ». Correct : en rapportant les paroles de Léa au discours indirect, la première
    personne (« je ») devient la troisième personne du féminin (« elle »).'
- id: nblm-parmi-les-propositions-suivantes-laquell-5
  type: choix
  difficulte: 2
  enonce: Parmi les propositions suivantes, laquelle illustre la parole d'un personnage au discours indirect libre ?
  reponse:
    options:
    - id: o1
      texte: Paul soupira. Comme cette journée était longue !
    - id: o2
      texte: 'Paul soupira : « Comme cette journée est longue ! »'
    - id: o3
      texte: Paul soupira que cette journée était longue.
    - id: o4
      texte: Paul déclara qu'il trouvait la journée très longue.
    bonnes:
    - o1
  indices:
    relance: Recherche la phrase qui exprime l'émotion du personnage sans utiliser de guillemets ni de conjonction de subordination.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : les deux-points et les guillemets indiquent clairement un discours direct.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la présence de la subordonnée introduite par « que » caractérise le discours indirect classique.'
  - si:
      contient:
      - o4
    relance: 'Erreur : il s''agit d''un discours indirect avec verbe introducteur (« déclara ») et proposition subordonnée.'
  solution: 'Paul soupira. Comme cette journée était longue !. Exact : la ponctuation exclamative et le style spontané expriment
    directement la pensée du personnage à l''imparfait, sans guillemets ni verbe introducteur.'
- id: nblm-quelles-sont-les-deux-erreurs-frequentes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux erreurs fréquentes commises lors de la transformation d'une phrase au discours indirect ?
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Garder les guillemets de dialogue dans la phrase transposée au discours indirect.
    - id: o2
      texte: Oublier de modifier les pronoms personnels (par exemple garder « je » au lieu de mettre « il » ou « elle »).
    - id: o3
      texte: Supprimer complètement le verbe introducteur de parole.
    - id: o4
      texte: Remplacer l'indicateur de temps « demain » par « le lendemain ».
    bonnes:
    - o1
    - o2
  indices:
    relance: Considère la ponctuation de dialogue et l'adaptation des pronoms personnels.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Incorrect : au discours indirect classique, le verbe introducteur doit être conservé pour introduire la subordonnée.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : ce n''est pas une erreur, c''est au contraire la transformation correcte de l''indicateur temporel.'
  solution: 'Garder les guillemets de dialogue dans la phrase transposée au discours indirect ; Oublier de modifier les pronoms
    personnels (par exemple garder « je » au lieu de mettre « il » ou « elle »). Correct : c''est une erreur fréquente ; au
    discours indirect, les guillemets doivent obligatoirement être supprimés.'
- id: nblm-quel-signe-de-ponctuation-entoure-les-pa-7
