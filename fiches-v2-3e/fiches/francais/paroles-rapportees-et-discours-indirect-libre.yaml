format: 2
notion: paroles-rapportees-et-discours-indirect-libre
version: 1
etat: verifiee
declencheurs:
- transformer une phrase au discours indirect
- guillemets de dialogue
- changer je en il dans une phrase rapportée
- parole d'un personnage sans guillemets
prerequis:
- transposition-oral-ecrit
essentiel: 'Il y a plusieurs façons de rapporter les paroles de quelqu''un.


  Le discours direct reproduit les paroles exactement, entre guillemets, avec un verbe introducteur :

  Léa a dit : « Je suis fatiguée. »


  Le discours indirect rapporte les paroles sans guillemets, dans une proposition subordonnée

  introduite par « que » (ou un autre mot). Les pronoms et les temps changent souvent :

  Léa a dit qu''elle était fatiguée.


  Le discours indirect libre mélange les deux : il garde le ton et les mots du personnage, mais sans

  guillemets ni verbe introducteur, comme s''il faisait partie du récit du narrateur :

  Léa soupira. Elle était si fatiguée !

  '
methode:
- 'Repère d''abord s''il y a des guillemets et un verbe introducteur : c''est le signe du discours direct.'
- Au discours indirect, change les pronoms (je devient il/elle) et adapte le temps du verbe si besoin.
- Au discours indirect libre, cherche des marques du personnage (exclamation, mots familiers) sans guillemets ni « que ».
- Pour transposer, commence par repérer qui parle, puis adapte pronoms, temps et repères de lieu ou de temps.
vocabulaire:
- terme: discours direct
  definition: paroles rapportées exactement, entre guillemets, avec un verbe introducteur
- terme: discours indirect libre
  definition: paroles d'un personnage insérées dans le récit, sans guillemets ni verbe introducteur
erreurs_frequentes:
- Oublier de changer les pronoms personnels en passant du discours direct au discours indirect.
- Garder les guillemets dans une phrase transposée au discours indirect.
- Confondre le discours indirect libre (pas de « que », pas de guillemets) avec le discours indirect classique.
exemple:
  enonce: 'Transpose au discours indirect : Marc a dit : « Je viendrai demain. »'
  solution: Marc a dit qu'il viendrait le lendemain. Le pronom « je » devient « il », le futur « viendrai » devient un conditionnel
    « viendrait », et « demain » devient « le lendemain ».
exercices:
- id: reconnaitre-discours-direct
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases est au discours direct ?
  reponse:
    options:
    - id: a
      texte: 'Il a dit : « Je pars ce soir. »'
    - id: b
      texte: Il a dit qu'il partait ce soir.
    - id: c
      texte: Il partait ce soir, enfin !
    bonnes:
    - a
  indices:
    relance: Cherche la phrase qui contient des guillemets et un verbe introducteur juste avant.
    methode: Le discours direct reproduit les paroles exactement, entre guillemets.
    etape: 'Une seule phrase a des guillemets après « a dit : ».'
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase n''a pas de guillemets et utilise « que » : c''est le discours indirect, pas le discours direct.'
  - si:
      contient:
      - c
    relance: 'Cette phrase n''a ni guillemets ni verbe introducteur : c''est du discours indirect libre, mêlé au récit.'
  solution: '« Il a dit : « Je pars ce soir. » » est au discours direct : les paroles sont reproduites exactement, entre guillemets,
    avec le verbe introducteur « a dit ».'
- id: transposer-pronom
  type: texte_court
  difficulte: 1
  enonce: 'Transpose au discours indirect : Léa a dit : « J''ai faim. » (Complète : Léa a dit qu''... faim. Donne uniquement
    le pronom et le verbe avoir conjugué à l''imparfait, par exemple « il avait ».)'
  reponse:
    acceptees:
    - elle avait
    fautes_tolerees: 1
  indices:
    relance: Le pronom « je » de Léa doit changer, puisque ce n'est plus elle qui parle directement.
    methode: « Je » devient « elle » (c'est Léa), et le présent « ai » devient l'imparfait dans le discours indirect passé.
    etape: Léa est une fille, donc le pronom à utiliser est « elle », pas « il ».
  pieges:
  - si:
      valeur: il avait
    relance: 'Léa est un prénom féminin : quel pronom personnel utilise-t-on pour elle ?'
  - si:
      valeur: elle a
    relance: Le verbe doit changer de temps aussi, pas seulement le pronom. Le présent devient l'imparfait après un verbe
      introducteur au passé.
  solution: Léa a dit qu'elle avait faim. Le pronom « je » devient « elle », et le présent « ai » devient l'imparfait « avait
    ».
- id: reperer-indirect-libre
  type: choix
  difficulte: 2
  enonce: Dans quelle phrase les paroles d'un personnage sont-elles rapportées au discours indirect libre ?
  reponse:
    options:
    - id: a
      texte: Elle se leva. Quelle idée stupide avait-elle eue là !
    - id: b
      texte: 'Elle se leva et dit : « Quelle idée stupide j''ai eue ! »'
    - id: c
      texte: Elle se leva et dit qu'elle avait eu une idée stupide.
    bonnes:
    - a
  indices:
    relance: Cherche la phrase qui n'a ni guillemets ni « que », mais qui garde le ton du personnage.
    methode: 'Le discours indirect libre est mêlé au récit : pas de verbe introducteur juste avant, pas de guillemets.'
    etape: Une phrase garde une exclamation, comme si le personnage pensait tout haut, sans marque de rapport.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase a des guillemets et un verbe introducteur : c''est du discours direct, pas indirect libre.'
  - si:
      contient:
      - c
    relance: 'Cette phrase utilise « que » après « dit » : c''est du discours indirect classique, pas du discours indirect
      libre.'
  solution: '« Elle se leva. Quelle idée stupide avait-elle eue là ! » est au discours indirect libre : la pensée du personnage
    se glisse dans le récit, sans guillemets ni « que ».'
- id: reecrire-au-passe
  type: ouverte
  difficulte: 3
  enonce: 'Transpose entièrement au discours indirect, en commençant par « Le professeur a expliqué que... » : Le professeur
    a dit : « Demain, vous rendrez votre exposé. »'
  criteres:
  - L'élève supprime les guillemets et introduit la parole par « que ».
  - L'élève change correctement le temps du verbe (futur devenant conditionnel) et l'indicateur de temps « demain » en « le
    lendemain ».
  indices:
    relance: 'Repère les trois éléments à transformer : le temps du verbe, le pronom, l''indicateur de temps « demain ».'
    methode: Après un verbe introducteur au passé, le futur devient un conditionnel, et « demain » devient « le lendemain
      ».
    etape: 'Tu peux commencer ainsi : « Le professeur a expliqué que le lendemain... ».'
  solution: Le professeur a expliqué que le lendemain, ils rendraient leur exposé. Le futur « rendrez » devient un conditionnel
    « rendraient », « demain » devient « le lendemain », et « vous » devient « ils » (les élèves dont on parle).
