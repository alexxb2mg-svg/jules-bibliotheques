# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: voix-passive-effets-de-sens
version: 3
etat: verifiee
declencheurs:
- transformer en phrase passive
- être + participe passé sujet
- qui fait l'action complément d'agent
- passer de l'actif au passif
- phrase sans dire qui agit
- mettre en valeur celui qui subit
- complément d'agent introduit par par
prerequis: []
essentiel: 'À la voix active, le sujet fait l''action. À la voix passive, le sujet subit l''action. Le complément d''agent,
  introduit par « par » (parfois « de »), indique qui fait l''action.


  Pour passer de l''actif au passif :

  1. Le COD de la phrase active devient le sujet.

  2. Le verbe devient « être » au même temps que le verbe actif, suivi du participe passé.

  3. Le sujet actif devient complément d''agent, avec « par » (ou « de »).


  Exemple : « Le chat mange la souris. » devient « La souris est mangée par le chat. » Le verbe « mange » est au présent :
  « est » aussi.


  Autres temps : « Le vent a renversé l''arbre. » (passé composé) devient « L''arbre a été renversé par le vent. » « Les ouvriers
  construisaient un pont. » (imparfait) devient « Un pont était construit par les ouvriers. »


  Le participe passé s''accorde avec le sujet de la phrase passive, comme un adjectif : « Les souris sont mangées par le chat.
  »


  Seuls les verbes transitifs directs (qui ont un COD) peuvent passer au passif. On ne peut pas passiver « dormir » ni « arriver
  ».


  Le complément d''agent peut être supprimé : « La ville a été détruite. » On ne dit pas qui a agi.


  Effets de sens. Le passif met en valeur celui qui subit l''action (il devient le sujet, en début de phrase). Il permet de
  ne pas nommer l''auteur, si on l''ignore, s''il n''est pas important ou si on veut rester vague. Il est fréquent dans la
  presse, les textes scientifiques et les récits historiques.


  Au brevet, on attend que tu transformes une phrase de l''actif au passif (et inversement) et que tu expliques l''effet produit.

  '
methode:
- Repère le sujet, le verbe et le COD de la phrase active, et identifie le temps du verbe.
- Fais du COD le nouveau sujet de la phrase passive.
- Mets « être » au même temps que le verbe actif, puis ajoute le participe passé du verbe.
- Accorde le participe passé avec le nouveau sujet (genre et nombre).
- Transforme l'ancien sujet en complément d'agent, introduit par « par » (ou « de » pour certains sentiments ou états).
- 'Explique l''effet du passif : mise en valeur de ce qui est subi, ou agent non nommé.'
vocabulaire:
- terme: voix active
  definition: construction où le sujet fait l'action exprimée par le verbe
- terme: voix passive
  definition: construction où le sujet subit l'action exprimée par le verbe
- terme: complément d'agent
  definition: groupe qui indique qui fait l'action dans une phrase passive
- terme: verbe transitif direct
  definition: verbe qui se construit avec un COD, sans préposition
- terme: participe passé
  definition: forme du verbe utilisée avec « être » ou « avoir » aux temps composés et au passif
- terme: transformation
  definition: changement de construction d'une phrase sans en changer le sens général
erreurs_frequentes:
- Oublier d'accorder le participe passé avec le nouveau sujet à la voix passive.
- Mettre l'auxiliaire « être » à un autre temps que celui du verbe actif.
- 'Chercher à passiver un verbe qui n''a pas de COD : seul un verbe transitif direct peut être mis au passif.'
- Confondre voix passive et temps composé d'un verbe intransitif conjugué avec être (« elle est partie »).
- Oublier que le complément d'agent peut être absent sans que la phrase soit fausse.
exemple:
  enonce: 'Transforme à la voix passive : « Les ouvriers construisent ce pont. »'
  solution: '« Ce pont est construit par les ouvriers. » : « ce pont » (ancien COD) devient sujet, « construisent » devient
    « est construit », « les ouvriers » (ancien sujet) devient complément d''agent.'
exercices:
- id: transformer-passif
  type: choix
  difficulte: 1
  enonce: Quelle phrase est la transformation passive correcte de « Le vent a renversé l'arbre. » ?
  reponse:
    options:
    - id: a
      texte: L'arbre a été renversé par le vent.
    - id: b
      texte: L'arbre renverse le vent.
    - id: c
      texte: Le vent est renversé par l'arbre.
    bonnes:
    - a
  indices:
    relance: 'Cherche d''abord le COD de la phrase active : que renverse le vent ?'
    methode: Le COD « l'arbre » devient le sujet ; le sujet « le vent » devient complément d'agent.
    etape: Le verbe « a renversé » (passé composé) devient « a été renversé » au passif.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase inverse le sens : ce n''est pas l''arbre qui renverse le vent.'
  - si:
      contient:
      - c
    relance: 'Cette phrase inverse aussi les rôles : c''est le vent qui agit sur l''arbre, pas l''inverse.'
  solution: '« L''arbre a été renversé par le vent. » : le COD devient sujet, le sujet devient complément d''agent.'
- id: agent-texte-court
  type: texte_court
  difficulte: 1
  enonce: Dans « Le gâteau a été mangé par les enfants. », quel groupe de mots est le complément d'agent ?
  reponse:
    acceptees:
    - les enfants
    - par les enfants
    fautes_tolerees: 1
  indices:
    relance: 'Le complément d''agent indique qui fait réellement l''action : qui a mangé le gâteau ?'
    methode: Il est introduit par la préposition « par ».
    etape: Cherche le groupe juste après « par ».
  pieges:
  - si:
      valeur: le gâteau
    relance: « le gâteau » est le sujet de la phrase passive, pas le complément d'agent.
  solution: 'Le complément d''agent est « les enfants » (ou « par les enfants ») : ce sont eux qui font l''action de manger.'
- id: temps-du-passif
  type: texte_court
  difficulte: 2
  enonce: 'Complète la phrase passive : « Les élèves sont félicités » devient à l''imparfait « Les élèves ... félicités par
    le professeur. » Écris seulement la forme d''« être » qui manque.'
  reponse:
    acceptees:
    - étaient
    - etaient
    fautes_tolerees: 1
  indices:
    relance: Le verbe « être » se conjugue au temps du verbe actif. Ici, ce temps est l'imparfait.
    methode: Conjugue « être » à l'imparfait, à la troisième personne du pluriel puisque le sujet est « les élèves ».
    etape: 'À l''imparfait, « être » donne : j''étais, tu étais, il était, nous étions, vous étiez, ils ... .'
  pieges:
  - si:
      valeur: sont
    relance: « sont » est au présent. Le temps demandé ici est l'imparfait.
  solution: 'À l''imparfait, « être » à la 3e personne du pluriel donne « étaient » : « Les élèves étaient félicités par le
    professeur. »'
- id: effet-de-sens-passif
  type: choix
  difficulte: 2
  enonce: Pourquoi peut-on préférer écrire « La ville a été détruite. » plutôt que « Des soldats ont détruit la ville. » ?
  reponse:
    options:
    - id: a
      texte: pour mettre en valeur la ville et ne pas préciser qui a fait l'action
    - id: b
      texte: parce que la phrase active est incorrecte
    - id: c
      texte: parce que le passif est toujours plus court
    bonnes:
    - a
  indices:
    relance: 'Compare ce que chaque phrase met en avant : l''auteur de l''action, ou celui qui la subit ?'
    methode: Le passif permet de ne pas nommer l'auteur de l'action, par exemple quand on ne le connaît pas ou qu'on ne veut
      pas le préciser.
    etape: 'Dans la phrase passive, « la ville » est en position de sujet : elle est mise en valeur.'
  pieges:
  - si:
      contient:
      - b
    relance: La phrase active « des soldats ont détruit la ville » est parfaitement correcte.
  - si:
      contient:
      - c
    relance: 'Le passif n''est pas toujours plus court : ici, les deux phrases ont une longueur proche.'
  solution: Le passif met en valeur « la ville » (ce qui est subi) et permet de ne pas préciser qui a fait l'action, si on
    l'ignore ou si ce n'est pas important.
- id: ordre-transformation
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour passer de l'actif au passif.
  reponse:
    elements:
    - id: a
      texte: Repérer le sujet, le verbe et le COD de la phrase active
    - id: b
      texte: Faire du COD le nouveau sujet et mettre « être » au temps du verbe actif
    - id: c
      texte: Ajouter le participe passé, accordé avec le nouveau sujet
    - id: d
      texte: Transformer l'ancien sujet en complément d'agent avec « par »
  indices:
    relance: On ne peut pas changer un COD en sujet avant de l'avoir repéré.
    methode: 'Pense à construire la phrase de gauche à droite : le nouveau sujet, le verbe, puis le complément d''agent.'
    etape: Le participe passé vient juste après « être », avant le complément d'agent.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Laquelle doit être faite avant l''autre pour pouvoir construire
      la phrase ?'
  - si:
      diagnostic: ordre_faux
    relance: Commence par ce qu'il faut repérer dans la phrase active, puis construis la phrase passive de gauche à droite.
  solution: Repérer sujet, verbe et COD ; faire du COD le sujet et mettre « être » au temps du verbe actif ; ajouter le participe
    passé accordé ; transformer l'ancien sujet en complément d'agent.
- id: transitif-ou-pas
  type: choix
  difficulte: 3
  enonce: Quel verbe, dans cette liste, ne peut PAS être mis à la voix passive ?
  reponse:
    options:
    - id: a
      texte: dormir
    - id: b
      texte: écrire
    - id: c
      texte: manger
    bonnes:
    - a
  indices:
    relance: 'Seul un verbe qui a un COD peut être mis au passif. Teste chaque verbe : peut-on lui trouver un COD ?'
    methode: 'Essaie de construire un COD pour chaque verbe : lequel n''accepte jamais de complément d''objet direct ?'
    etape: 'Un seul de ces trois verbes ne se construit jamais avec un COD : lequel ?'
  pieges:
  - si:
      contient:
      - b
    relance: '« écrire » a un COD possible (écrire une lettre) : il peut être mis au passif (une lettre est écrite).'
  - si:
      contient:
      - c
    relance: '« manger » a un COD possible (manger un gâteau) : il peut être mis au passif (un gâteau est mangé).'
  solution: '« dormir » ne peut pas être mis au passif, car il n''a jamais de COD : seul un verbe transitif direct peut être
    passivé.'
- id: nblm-a-la-voix-passive-quel-est-le-role-du-su-1
  type: choix
  difficulte: 2
  enonce: À la voix passive, quel est le rôle du sujet et quelle est la forme verbale utilisée ?
  reponse:
    options:
    - id: o1
      texte: Le sujet subit l'action et le verbe est formé de l'auxiliaire être + le participe passé.
    - id: o2
      texte: Le sujet fait l'action et le verbe est formé de l'auxiliaire avoir + le participe passé.
    - id: o3
      texte: Le sujet subit l'action et le verbe est à l'infinitif sans auxiliaire.
    - id: o4
      texte: Le sujet fait l'action et le verbe est au présent de l'indicatif sans auxiliaire.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au rôle du sujet (fait ou subit) et au verbe auxiliaire utilisé au passif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : c''est à la voix active que le sujet fait l''action, et la voix passive requiert l''auxiliaire
      être.'
  - si:
      contient:
      - o3
    relance: 'Faux : une forme passive conjuguée nécessite l''auxiliaire être suivi d''un participe passé, pas un infinitif
      seul.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : cela correspond à une phrase active simple, non à une tournure passive.'
  solution: 'Le sujet subit l''action et le verbe est formé de l''auxiliaire être + le participe passé. C''est exact : à la
    voix passive, le sujet ne fait pas l''action mais la subit, et le verbe se construit avec l''auxiliaire être suivi du
    participe passé.'
- id: nblm-dans-une-phrase-passive-quelle-est-la-fo-2
  type: choix
  difficulte: 2
  enonce: Dans une phrase passive, quelle est la fonction du groupe introduit par « par » ou « de » qui désigne celui qui
    fait l'action ?
  reponse:
    options:
    - id: o1
      texte: Le complément d'agent
    - id: o2
      texte: Le complément d'objet direct (COD)
    - id: o3
      texte: Le sujet apparent
    - id: o4
      texte: Le complément circumstantial de lieu
    bonnes:
    - o1
  indices:
    relance: Pense au terme grammatical désignant l'agent réel de l'action dans la voix passive.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : le COD n''est pas introduit par une préposition et il devient le sujet lors de la passivation.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la notion de sujet apparent concerne les phrases impersonnelles, pas le passif.'
  - si:
      contient:
      - o4
    relance: 'Faux : la préposition « par » introduit ici l''agent de l''action et non une indication de lieu.'
  solution: 'Le complément d''agent. C''est exact : le complément d''agent indique l''auteur réel de l''action subie par le
    sujet.'
- id: nblm-lorsqu-on-cherche-a-transformer-en-phras-3
  type: choix
  difficulte: 2
  enonce: Lorsqu'on cherche à transformer en phrase passive une phrase active, quelle est la règle d'accord du participe passé
    ?
  reponse:
    options:
    - id: o1
      texte: Le participe passé s'accorde en genre et en nombre avec le nouveau sujet.
    - id: o2
      texte: Le participe passé reste toujours invariable.
    - id: o3
      texte: Le participe passé s'accorde toujours avec le complément d'agent.
    - id: o4
      texte: Le participe passé s'accorde seulement si le sujet est un pronom relatif.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la règle d'accord fondamentale du participe passé employé avec l'auxiliaire être.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : oublier d''accorder le participe passé avec le sujet est une faute classique au passif.'
  - si:
      contient:
      - o3
    relance: 'Faux : l''accord de l''auxiliaire être se fait avec le sujet de la phrase, jamais avec le complément d''agent.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : le participe passé s''accorde systématiquement avec le sujet au passif, quelle que soit sa nature.'
  solution: 'Le participe passé s''accorde en genre et en nombre avec le nouveau sujet. C''est exact : le verbe passif étant
    construit avec l''auxiliaire être, le participe passé s''accorde toujours avec son sujet.'
- id: nblm-quel-est-l-un-des-principaux-effets-de-s-4
  type: choix
  difficulte: 2
  enonce: Quel est l'un des principaux effets de sens apportés par l'emploi de la voix passive ?
  reponse:
    options:
    - id: o1
      texte: Mettre en valeur celui qui subit l'action ou ne pas nommer l'auteur de l'action.
    - id: o2
      texte: Exprimer obligatoirement un doute ou un souhait.
    - id: o3
      texte: Transformé systématiquement la phrase en une phrase impersonnelle.
    - id: o4
      texte: Indiquer que l'action s'est déroulée dans un temps du passé uniquement.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que le changement d'ordre des éléments met en relief dans l'énoncé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : l''expression du doute ou du souhait relève du mode subjonctif, pas de la voix passive.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la forme passive et la forme impersonnelle sont deux constructions distinctes.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : la voix passive existe à tous les temps (présent, futur, imparfait, etc.).'
  solution: 'Mettre en valeur celui qui subit l''action ou ne pas nommer l''auteur de l''action. C''est exact : le passif
    déplace le centre d''attention sur le sujet qui subit l''action et permet d''omettre l''agent.'
- id: nblm-quel-type-de-verbe-est-indispensable-dan-5
  type: choix
  difficulte: 2
  enonce: Quel type de verbe est indispensable dans la phrase active pour pouvoir la transformer en phrase passive ?
  reponse:
    options:
    - id: o1
      texte: Un verbe transitif direct (qui accepte un COD).
    - id: o2
      texte: Un verbe intransitif sans aucun complément d'objet.
    - id: o3
      texte: Un verbe impersonnel désignant la météo.
    - id: o4
      texte: Un verbe d'état comme être ou paraître.
    bonnes:
    - o1
  indices:
    relance: Demande-toi quel élément de la phrase active devient le sujet de la phrase passive.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : sans COD à transformer en sujet, un verbe intransitif ne peut pas être passivé.'
  - si:
      contient:
      - o3
    relance: 'Faux : les verbes impersonnels n''ont pas de COD et ne s''emploient pas à la voix passive.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : les verbes d''état sont suivis d''un attribut du sujet et n''ont jamais de COD.'
  solution: 'Un verbe transitif direct (qui accepte un COD). C''est exact : seul un verbe ayant un COD peut être mis au passif,
    car c''est le COD actif qui devient le sujet passif.'
- id: nblm-quelles-sont-les-deux-affirmations-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations correctes concernant la transformation passive de la phrase « Les ouvriers construisent
    ce pont » ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La phrase passive exacte est « Ce pont est construit par les ouvriers ».
    - id: o2
      texte: Le groupe « par les ouvriers » a pour fonction complément d'agent.
    - id: o3
      texte: Le groupe « ce pont » reste le complément d'objet direct (COD) dans la phrase passive.
    - id: o4
      texte: La phrase passive doit obligatoirement utiliser l'auxiliaire avoir.
    bonnes:
    - o1
    - o2
  indices:
    relance: Examine la fonction de « ce pont » et de « par les ouvriers » dans la phrase transformée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : dans la phrase passive, « ce pont » prend la fonction de sujet.'
  - si:
      contient:
      - o4
    relance: 'Faux : la construction de la voix passive se fait avec l''auxiliaire être.'
  solution: 'La phrase passive exacte est « Ce pont est construit par les ouvriers » ; Le groupe « par les ouvriers » a pour
    fonction complément d''agent. C''est exact : le COD « ce pont » devient sujet, le verbe est conjugué au présent passif,
    et l''ancien sujet devient complément d''agent.'
- id: nblm-dans-une-phrase-passive-quel-groupe-gram-7
  type: texte_court
  difficulte: 1
  enonce: Dans une phrase passive, quel groupe grammatical indique qui fait l'action (par exemple introduit par la préposition
    « par ») ?
  reponse:
    acceptees:
    - complément d'agent
    fautes_tolerees: 1
  indices:
    relance: C'est une expression de deux mots désignant la fonction de l'auteur réel de l'action au passif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: complément d'agent. « Complément d'agent » est le nom exact de cette fonction grammaticale.
- id: nblm-quel-auxiliaire-est-systematiquement-com-8
  type: texte_court
  difficulte: 1
  enonce: Quel auxiliaire est systématiquement combiné avec le participe passé pour former un verbe à la voix passive ?
  reponse:
    acceptees:
    - être
    fautes_tolerees: 1
  indices:
    relance: Il s'agit de l'auxiliaire servant à marquer un état ou une construction passive.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: être. L'auxiliaire être est obligatoire pour construire la voix passive (être + participe passé).
- id: transformer-et-justifier
  type: ouverte
  difficulte: 3
  enonce: Transforme « Les habitants ont accueilli les voyageurs. » à la voix passive en gardant le complément d'agent. Puis
    explique l'effet obtenu, et dis dans quel cas tu pourrais supprimer le complément d'agent.
  criteres:
  - 'L''élève écrit une phrase passive correcte, avec « être » au passé composé et le participe accordé : « Les voyageurs
    ont été accueillis par les habitants ».'
  - L'élève explique que le passif met en valeur celui qui subit l'action (les voyageurs).
  - L'élève indique que le complément d'agent peut être supprimé quand on ignore l'auteur de l'action ou qu'il n'est pas important.
  indices:
    relance: Repère le COD de la phrase active et le temps du verbe.
    methode: Applique la transformation étape par étape, puis compare l'élément mis en tête de phrase dans chaque version.
    etape: Commence par « Les voyageurs... » puis mets « avoir » au passé composé sous la forme « ont été » et accorde le
      participe.
  solution: '« Les voyageurs ont été accueillis par les habitants. » Le COD est devenu sujet : le passif met en valeur les
    voyageurs, qui subissent l''action. On peut supprimer « par les habitants » si l''on ignore qui les a accueillis ou si
    ce n''est pas important.'
