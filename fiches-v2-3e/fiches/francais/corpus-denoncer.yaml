format: 2
notion: corpus-denoncer
version: 2
etat: generee
declencheurs:
- dessin de presse qui critique
- fable qui dénonce un défaut
- bande dessinée satirique
- pamphlet contre une injustice
- satire à la manière de Voltaire
- texte qui attaque violemment
- critique de la société
- satire dans un journal
- humoriste et émission satirique
prerequis:
- visee-satirique
essentiel: |
  Ce corpus de référence porte sur la dénonciation des travers de la société. Le programme demande d'étudier des œuvres de l'Antiquité à nos jours, de genres différents, qui critiquent la société par le rire ou par la violence des mots.

  Les genres à connaître : la poésie satirique (poème qui se moque), le roman, la fable (court récit avec une morale, souvent avec des animaux), le conte philosophique (récit qui fait réfléchir sur une idée), le conte drolatique (comique et un peu grivois) et le pamphlet (texte court et violent qui attaque une personne, une idée ou une institution).

  Des œuvres et des images aussi : dessins de presse, affiches, caricatures, albums de bande dessinée. On peut y ajouter des extraits de spectacles, d'émissions de radio ou de télévision, ou des créations numériques à visée satirique.

  Repères. Antiquité : Ésope et Phèdre écrivent des fables. XVIIe siècle : La Fontaine reprend la fable (Fables), La Bruyère écrit Les Caractères. XVIe siècle : Rabelais écrit des textes comiques et satiriques. XVIIIe siècle : Voltaire publie Candide (1759), conte philosophique qui se moque de l'optimisme et dénonce la guerre, l'intolérance, l'esclavage. XIXe siècle : Victor Hugo publie Les Châtiments (1853), recueil de poésie satirique contre Napoléon III. Aujourd'hui : dessins de presse, bande dessinée, humoristes, émissions satiriques.

  Ce qui est dénoncé : l'injustice, l'hypocrisie, la guerre, l'intolérance, l'abus de pouvoir, la flatterie, la vanité. Les moyens : ironie, exagération, déplacement (animaux, pays imaginaires), parodie.

  Comparer les œuvres du corpus montre que les mêmes défauts sont dénoncés à des siècles différents, avec des formes différentes. Un texte demande de lire des mots, un dessin de presse se lit en un coup d'œil, avec un dessin exagéré et parfois une légende.

  Ce qu'on attend au brevet : situer l'œuvre (auteur, époque, genre), dire ce qu'elle dénonce et par quels procédés, et comparer avec une autre œuvre ou une autre forme.
methode:
- Repérer le genre ou la forme de chaque œuvre du corpus (fable, conte, pamphlet, dessin de presse, roman...).
- 'Situer l''œuvre : auteur, époque, contexte historique.'
- Identifier ce que chaque œuvre dénonce dans la société de son époque.
- 'Relever les procédés : ironie, exagération, animaux, situation absurde, parodie.'
- Pour une image (dessin de presse, caricature, affiche), observer ce qui est exagéré, déformé ou dit dans la légende,
  et pourquoi.
- 'Comparer les œuvres entre elles : mêmes cibles ? mêmes moyens ? forme différente ?'
vocabulaire:
- terme: pamphlet
  definition: texte court et violent qui attaque une personne, une idée ou une institution
- terme: conte philosophique
  definition: récit court, parfois avec des aventures étonnantes, qui fait réfléchir sur une idée ou critique la
    société
- terme: fable
  definition: court récit en vers ou en prose, avec une morale, où les animaux représentent souvent les hommes
- terme: conte drolatique
  definition: conte comique, un peu grivois, qui se moque des comportements humains
- terme: poésie satirique
  definition: poème qui se moque de défauts ou de personnes pour les critiquer
- terme: dessin de presse
  definition: dessin publié dans un journal qui commente l'actualité, souvent avec humour
- terme: caricature
  definition: portrait qui exagère certains traits d'une personne pour la rendre ridicule
- terme: dénoncer
  definition: révéler publiquement quelque chose de mal pour le critiquer
- terme: morale
  definition: leçon que l'on tire d'une fable ou d'un conte
erreurs_frequentes:
- Croire que la satire n'existe que dans les textes anciens, alors que le corpus va de l'Antiquité à nos jours.
- Ne pas faire de lien entre les œuvres du corpus, alors que le but est de comparer les manières de dénoncer.
- Oublier qu'une image (dessin de presse, caricature) peut aussi avoir une visée satirique, pas seulement un texte.
- Confondre pamphlet (violent, direct) et fable (récit imagé avec une morale).
- Résumer l'histoire de l'œuvre sans dire ce qu'elle dénonce.
exemple:
  enonce: Cite deux formes différentes qu'un corpus de référence sur la dénonciation sociale peut réunir.
  solution: Un tel corpus peut réunir, par exemple, un conte philosophique comme Candide de Voltaire et un dessin
    de presse contemporain, deux formes très différentes mais qui dénoncent toutes deux des défauts de la société.
exercices:
- id: definir-pamphlet
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un pamphlet ?
  reponse:
    options:
    - id: a
      texte: Un texte court et violent qui attaque une personne, une idée ou une institution
    - id: b
      texte: Un long roman qui raconte une histoire d'amour
    - id: c
      texte: Un poème qui décrit un beau paysage
    - id: d
      texte: Un dictionnaire de mots rares
    bonnes:
    - a
  indices:
    relance: Ce type de texte est souvent court, et il ne cherche pas à plaire mais à attaquer quelque chose ou
      quelqu'un.
    methode: Élimine les définitions qui ne parlent ni d'attaque ni de critique violente.
    etape: La bonne réponse parle d'un texte court qui attaque directement.
  pieges:
  - si:
      contient:
      - b
    relance: Un pamphlet est court et violent, pas un long roman d'amour.
  - si:
      contient:
      - c
    relance: 'Décrire un beau paysage n''a rien d''une attaque : ce n''est pas un pamphlet.'
  - si:
      contient:
      - d
    relance: 'Un dictionnaire ne critique rien : ce n''est pas un pamphlet.'
  solution: Un pamphlet est un texte court et violent qui attaque une personne, une idée ou une institution.
- id: auteur-candide
  type: texte_court
  difficulte: 2
  enonce: Quel est le nom de famille de l'auteur du conte philosophique Candide, publié en 1759 ?
  reponse:
    acceptees:
    - voltaire
    fautes_tolerees: 1
  indices:
    relance: Cet auteur est un philosophe des Lumières, connu pour ses contes qui critiquent la société avec humour.
    methode: Cherche le nom d'un écrivain du XVIIIe siècle célèbre pour ses contes philosophiques et son ironie.
    etape: Son nom commence par « Vol- ».
  pieges:
  - si:
      valeur: rousseau
    relance: Rousseau écrit Les Confessions, pas Candide. Cherche un autre philosophe des Lumières.
  - si:
      valeur: la fontaine
    relance: La Fontaine écrit des fables, pas Candide. Cherche l'auteur de ce conte philosophique.
  solution: L'auteur de Candide est Voltaire, qui publie ce conte philosophique en 1759.
- id: formes-du-corpus-satire
  type: ordre
  difficulte: 2
  enonce: Range ces formes satiriques de la plus ancienne à la plus récente en histoire de la littérature et des
    médias.
  reponse:
    elements:
    - id: fable
      texte: La fable antique ou classique
    - id: conte
      texte: Le conte philosophique du XVIIIe siècle
    - id: dessin
      texte: Le dessin de presse dans un journal moderne
  indices:
    relance: La fable existe depuis l'Antiquité. Le dessin de presse suppose l'existence de journaux, qui sont plus
      récents.
    methode: Range d'abord la forme la plus ancienne, puis celle du XVIIIe siècle, puis la plus récente.
    etape: La fable est très ancienne, le conte philosophique se développe au XVIIIe siècle, le dessin de presse
      suppose des journaux modernes.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux formes voisines sont inversées. Laquelle des deux existe depuis le plus longtemps ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la forme la plus ancienne (la fable), puis la plus récente (le dessin de presse).
  solution: La fable est la forme la plus ancienne, le conte philosophique se développe au XVIIIe siècle, le dessin
    de presse est la forme la plus récente.
- id: forme-et-support
  type: association
  difficulte: 2
  enonce: Associe chaque forme satirique à son support principal.
  reponse:
    gauche:
    - id: a
      texte: Le pamphlet
    - id: b
      texte: La caricature
    - id: c
      texte: Le conte philosophique
    droite:
    - id: x
      texte: Un texte en prose, souvent narratif
    - id: y
      texte: Un dessin
    paires:
      a: x
      b: y
      c: x
  indices:
    relance: Deux de ces formes sont des textes écrits ; une seule est une image.
    methode: Repère d'abord la forme qui est un dessin, puis range les deux formes textuelles.
    etape: La caricature est un dessin ; le pamphlet et le conte philosophique sont des textes en prose.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien laquelle des trois formes est un dessin.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque forme un par un : est-ce un texte écrit, ou un dessin ?'
  solution: Le pamphlet et le conte philosophique sont des textes en prose ; la caricature est un dessin.
- id: comparer-oeuvres-satiriques
  type: ouverte
  difficulte: 3
  enonce: Choisis deux oeuvres satiriques de siècles différents étudiées en classe et explique ce qu'elles dénoncent
    toutes les deux.
  criteres:
  - L'élève cite deux oeuvres ou auteurs précis, de siècles ou d'époques différentes.
  - L'élève identifie un défaut ou une injustice dénoncé par chacune de ces oeuvres.
  - L'élève montre un point commun entre les deux oeuvres, malgré la distance dans le temps.
  indices:
    relance: Pense à deux textes ou images qui se moquent tous les deux d'un même genre de défaut, à des époques
      différentes.
    methode: Choisis une première oeuvre et le défaut qu'elle critique, puis une seconde oeuvre qui critique un
      défaut proche.
    etape: Tu peux commencer ainsi « Ces deux oeuvres dénoncent toutes les deux... », puis expliquer avec un exemple
      pour chacune.
  solution: Par exemple, Candide de Voltaire, au XVIIIe siècle, dénonce la guerre et le fanatisme à travers les
    aventures absurdes de son héros, tandis qu'un dessin de presse contemporain peut dénoncer les mêmes travers
    avec une seule image, montrant que la satire s'adapte aux formes de son époque tout en gardant les mêmes cibles.
- id: genres-satire
  type: association
  difficulte: 2
  enonce: Associe chaque genre à sa définition.
  reponse:
    gauche:
    - id: a
      texte: La fable
    - id: b
      texte: Le pamphlet
    - id: c
      texte: Le conte philosophique
    droite:
    - id: x
      texte: Un court récit avec une morale, souvent avec des animaux
    - id: y
      texte: Un texte court et violent qui attaque
    - id: z
      texte: Un récit d'aventures qui fait réfléchir sur des idées
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces genres se reconnaît à sa morale, un autre à sa violence, un autre à ses aventures qui font
      réfléchir.
    methode: Associe d'abord le genre qui attaque directement, puis celui qui a une morale.
    etape: Le pamphlet est le plus direct dans l'attaque.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque genre en pensant à un exemple.
  - si:
      diagnostic: associations_fausses
    relance: Pense à La Fontaine, à Voltaire, puis à un texte qui attaque directement.
  solution: 'La fable : récit à morale. Le pamphlet : texte violent qui attaque. Le conte philosophique : récit
    d''aventures qui fait réfléchir.'
- id: candide-denonce
  type: choix
  difficulte: 2
  enonce: Parmi ces réalités, laquelle Voltaire dénonce-t-il dans Candide ?
  reponse:
    options:
    - id: a
      texte: La guerre et l'intolérance
    - id: b
      texte: Le bonheur de la vie à la campagne
    - id: c
      texte: Les bienfaits de la technologie moderne
    - id: d
      texte: La beauté des paysages d'Amérique
    bonnes:
    - a
  indices:
    relance: Candide voit des horreurs pendant ses voyages. Quelle idée de son maître se moque-t-il ?
    methode: Le conte critique un optimisme trop simple, qui prétend que tout va pour le mieux.
    etape: Cherche parmi les propositions la réalité que l'on peut critiquer.
  pieges:
  - si:
      contient:
      - b
    relance: Le conte montre au contraire que le monde est dur.
  - si:
      contient:
      - c
    relance: Ce thème n'appartient pas à ce conte du XVIIIe siècle.
  - si:
      contient:
      - d
    relance: Le conte n'a pas pour but de décrire des paysages.
  solution: Voltaire dénonce notamment la guerre, l'intolérance et l'optimisme aveugle.
- id: comparer-corpus-satire
  type: ouverte
  difficulte: 3
  enonce: 'Compare une fable et un dessin de presse : que dénoncent-ils, et par quels moyens différents ?'
  criteres:
  - L'élève identifie ce que dénonce chacune des deux formes (défaut humain, injustice, pouvoir).
  - L'élève décrit le moyen propre à chaque forme (animaux et morale pour la fable ; exagération dessinée et légende
    pour le dessin).
  - L'élève conclut par un point commun ou une différence entre les deux.
  indices:
    relance: Que critiquent ces deux formes ? Comment le disent-elles ?
    methode: Une fable raconte, un dessin se voit en un coup d'œil. Compare le moyen utilisé.
    etape: Tu peux commencer ainsi « Une fable et un dessin de presse dénoncent tous deux..., mais... ».
  solution: Une fable et un dessin de presse dénoncent tous deux des défauts humains ou des abus de pouvoir. La
    fable passe par un récit court avec des animaux et une morale ; le dessin de presse exagère les traits d'un
    personnage et s'appuie parfois sur une légende. Les deux utilisent le rire pour rendre la critique plus facile
    à comprendre.
