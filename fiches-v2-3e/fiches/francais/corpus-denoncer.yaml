format: 2
notion: corpus-denoncer
version: 1
etat: verifiee
declencheurs:
- dessin de presse qui critique
- fable qui dénonce un défaut
- bande dessinée satirique
- pamphlet contre une injustice
prerequis:
- visee-satirique
essentiel: 'Un corpus de référence sur la dénonciation sociale réunit des oeuvres, de l''Antiquité à nos jours, qui se moquent

  de la société pour la critiquer. Ces oeuvres appartiennent à des genres très différents : poésie satirique,

  roman, fable, conte philosophique ou conte drolatique (comique et un peu grivois), pamphlet (texte court et

  violent qui attaque une personne ou une idée).

  Le corpus peut aussi réunir des images : dessins de presse, affiches, caricatures, planches de bande dessinée.

  On peut également étudier des extraits de spectacles, d''émissions de radio ou de télévision, ou des créations

  numériques à visée satirique.

  Un exemple célèbre est Candide, conte philosophique de Voltaire publié en 1759, qui se moque de l''optimisme

  et dénonce plusieurs injustices de son époque à travers les aventures absurdes de son héros.

  Comparer ces oeuvres permet de voir comment, à travers les siècles et les formes, les auteurs utilisent le rire

  pour dénoncer les mêmes travers : l''injustice, l''hypocrisie, la guerre, l''intolérance.

  '
methode:
- Repérer le genre ou la forme de chaque oeuvre du corpus (fable, conte, pamphlet, dessin de presse...).
- Identifier ce que chaque oeuvre dénonce dans la société de son époque.
- 'Comparer les oeuvres entre elles : les mêmes défauts sont-ils dénoncés à des siècles différents ?'
- Pour une image (dessin de presse, caricature), observer ce qui est exagéré ou déformé et pourquoi.
vocabulaire:
- terme: pamphlet
  definition: texte court et violent qui attaque une personne, une idée ou une institution
- terme: conte philosophique
  definition: récit court, parfois avec des aventures étonnantes, qui fait réfléchir sur une idée ou critique la société
erreurs_frequentes:
- Croire que la satire n'existe que dans les textes anciens, alors que le corpus va de l'Antiquité à nos jours.
- Ne pas faire de lien entre les oeuvres du corpus, alors que le but est de comparer les manières de dénoncer.
- Oublier qu'une image (dessin de presse, caricature) peut aussi avoir une visée satirique, pas seulement un texte.
exemple:
  enonce: Cite deux formes différentes qu'un corpus de référence sur la dénonciation sociale peut réunir.
  solution: Un tel corpus peut réunir, par exemple, un conte philosophique comme Candide de Voltaire et un dessin de presse
    contemporain, deux formes très différentes mais qui dénoncent toutes deux des défauts de la société.
exercices:
- id: definir-pamphlet
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un pamphlet ?
  reponse:
    options:
    - id: a
      texte: Un texte court et violent qui attaque une personne, une idée ou une institution
    - id: b
      texte: Un long roman qui raconte une histoire d'amour
    - id: c
      texte: Un poème qui décrit un beau paysage
    - id: d
      texte: Un dictionnaire de mots rares
    bonnes:
    - a
  indices:
    relance: Ce type de texte est souvent court, et il ne cherche pas à plaire mais à attaquer quelque chose ou quelqu'un.
    methode: Élimine les définitions qui ne parlent ni d'attaque ni de critique violente.
    etape: La bonne réponse parle d'un texte court qui attaque directement.
  pieges:
  - si:
      contient:
      - b
    relance: Un pamphlet est court et violent, pas un long roman d'amour.
  - si:
      contient:
      - c
    relance: 'Décrire un beau paysage n''a rien d''une attaque : ce n''est pas un pamphlet.'
  - si:
      contient:
      - d
    relance: 'Un dictionnaire ne critique rien : ce n''est pas un pamphlet.'
  solution: Un pamphlet est un texte court et violent qui attaque une personne, une idée ou une institution.
- id: auteur-candide
  type: texte_court
  difficulte: 2
  enonce: Quel est le nom de famille de l'auteur du conte philosophique Candide, publié en 1759 ?
  reponse:
    acceptees:
    - voltaire
    fautes_tolerees: 1
  indices:
    relance: Cet auteur est un philosophe des Lumières, connu pour ses contes qui critiquent la société avec humour.
    methode: Cherche le nom d'un écrivain du XVIIIe siècle célèbre pour ses contes philosophiques et son ironie.
    etape: Son nom commence par « Vol- ».
  pieges:
  - si:
      valeur: rousseau
    relance: Rousseau écrit Les Confessions, pas Candide. Cherche un autre philosophe des Lumières.
  - si:
      valeur: la fontaine
    relance: La Fontaine écrit des fables, pas Candide. Cherche l'auteur de ce conte philosophique.
  solution: L'auteur de Candide est Voltaire, qui publie ce conte philosophique en 1759.
- id: formes-du-corpus-satire
  type: ordre
  difficulte: 2
  enonce: Range ces formes satiriques de la plus ancienne à la plus récente en histoire de la littérature et des médias.
  reponse:
    elements:
    - id: fable
      texte: La fable antique ou classique
    - id: conte
      texte: Le conte philosophique du XVIIIe siècle
    - id: dessin
      texte: Le dessin de presse dans un journal moderne
  indices:
    relance: La fable existe depuis l'Antiquité. Le dessin de presse suppose l'existence de journaux, qui sont plus récents.
    methode: Range d'abord la forme la plus ancienne, puis celle du XVIIIe siècle, puis la plus récente.
    etape: La fable est très ancienne, le conte philosophique se développe au XVIIIe siècle, le dessin de presse suppose des
      journaux modernes.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux formes voisines sont inversées. Laquelle des deux existe depuis le plus longtemps ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la forme la plus ancienne (la fable), puis la plus récente (le dessin de presse).
  solution: La fable est la forme la plus ancienne, le conte philosophique se développe au XVIIIe siècle, le dessin de presse
    est la forme la plus récente.
- id: forme-et-support
  type: association
  difficulte: 2
  enonce: Associe chaque forme satirique à son support principal.
  reponse:
    gauche:
    - id: a
      texte: Le pamphlet
    - id: b
      texte: La caricature
    - id: c
      texte: Le conte philosophique
    droite:
    - id: x
      texte: Un texte en prose, souvent narratif
    - id: y
      texte: Un dessin
    paires:
      a: x
      b: y
      c: x
  indices:
    relance: Deux de ces formes sont des textes écrits ; une seule est une image.
    methode: Repère d'abord la forme qui est un dessin, puis range les deux formes textuelles.
    etape: La caricature est un dessin ; le pamphlet et le conte philosophique sont des textes en prose.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien laquelle des trois formes est un dessin.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque forme un par un : est-ce un texte écrit, ou un dessin ?'
  solution: Le pamphlet et le conte philosophique sont des textes en prose ; la caricature est un dessin.
- id: comparer-oeuvres-satiriques
  type: ouverte
  difficulte: 3
  enonce: Choisis deux oeuvres satiriques de siècles différents étudiées en classe et explique ce qu'elles dénoncent toutes
    les deux.
  criteres:
  - L'élève cite deux oeuvres ou auteurs précis, de siècles ou d'époques différentes.
  - L'élève identifie un défaut ou une injustice dénoncé par chacune de ces oeuvres.
  - L'élève montre un point commun entre les deux oeuvres, malgré la distance dans le temps.
  indices:
    relance: Pense à deux textes ou images qui se moquent tous les deux d'un même genre de défaut, à des époques différentes.
    methode: Choisis une première oeuvre et le défaut qu'elle critique, puis une seconde oeuvre qui critique un défaut proche.
    etape: Tu peux commencer ainsi « Ces deux oeuvres dénoncent toutes les deux... », puis expliquer avec un exemple pour
      chacune.
  solution: Par exemple, Candide de Voltaire, au XVIIIe siècle, dénonce la guerre et le fanatisme à travers les aventures
    absurdes de son héros, tandis qu'un dessin de presse contemporain peut dénoncer les mêmes travers avec une seule image,
    montrant que la satire s'adapte aux formes de son époque tout en gardant les mêmes cibles.
