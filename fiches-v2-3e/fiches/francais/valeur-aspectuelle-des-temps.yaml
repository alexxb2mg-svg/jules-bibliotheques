# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: valeur-aspectuelle-des-temps
version: 2
etat: verifiee
declencheurs:
- premier plan ou arrière-plan
- action terminée ou en cours
- borné ou non borné
- imparfait ou passé simple
- décor et action dans un récit
- action qui se répète au passé
- action ponctuelle ou qui dure
- pourquoi ce temps dans un récit
prerequis: []
essentiel: 'L''aspect d''un verbe indique comment on regarde une action dans le temps. Il ne dit pas quand l''action a lieu
  (c''est le rôle du temps), mais comment elle est présentée.


  Accompli / non accompli. Une action accomplie est vue comme terminée. Une action non accomplie est vue en train de se dérouler,
  sans son résultat final.


  Borné / non borné. Une action bornée a un début et une fin marqués. Une action non bornée est vue sans limite précise, elle
  peut durer ou se répéter.


  Le passé simple présente une action accomplie et bornée : « Il ferma la porte. » L''action est ponctuelle, terminée.


  Le passé composé présente aussi une action accomplie : « Il a fermé la porte. » Il montre le résultat acquis (la porte est
  fermée).


  Le plus-que-parfait présente une action accomplie, antérieure à une autre action passée : « Il avait fermé la porte quand
  elle arriva. »


  L''imparfait présente une action non accomplie et non bornée : « Il pleuvait. » On ne sait ni quand cela a commencé ni quand
  cela a fini. Il exprime aussi une habitude ou une répétition : « Chaque été, nous allions à la mer. »


  Effets dans un récit. Le passé simple et le passé composé font avancer l''histoire : c''est le premier plan. L''imparfait
  décrit le décor, la situation, les habitudes : c''est l''arrière-plan.


  Exemple : « Il pleuvait depuis le matin (arrière-plan). Soudain, la foudre tomba sur un arbre (premier plan). »


  Au brevet, on attend que tu expliques le choix d''un temps dans un texte en parlant d''aspect (terminé ou en cours, borné
  ou non) et de plan (premier ou arrière).

  '
methode:
- Identifie le temps du verbe et son infinitif.
- Demande-toi si l'action est présentée comme terminée (accompli) ou en cours (non accompli).
- Demande-toi si l'action a un début et une fin marqués (borné) ou si elle dure ou se répète (non borné).
- Dans un récit, sépare les verbes qui font avancer l'histoire (premier plan) de ceux qui décrivent le décor ou une habitude
  (arrière-plan).
- Pour justifier, utilise les mots de la fiche (accompli, non accompli, borné, non borné) et cite le verbe.
- Pour écrire, choisis le temps selon l'effet voulu (décrire une situation ou raconter un événement).
vocabulaire:
- terme: aspect
  definition: manière dont une action est présentée dans le temps (terminée ou en cours, limitée ou non)
- terme: accompli
  definition: aspect d'une action présentée comme terminée
- terme: non accompli
  definition: aspect d'une action présentée comme en cours, non terminée
- terme: borné
  definition: qui a des limites précises dans le temps (un début et une fin marqués)
- terme: non borné
  definition: sans limites précises dans le temps ; l'action dure ou se répète
- terme: premier plan
  definition: dans un récit, les actions qui font avancer l'histoire
- terme: arrière-plan
  definition: dans un récit, ce qui décrit le décor, la situation ou les habitudes
erreurs_frequentes:
- Confondre le temps grammatical (imparfait, passé simple) avec l'aspect (accompli, non accompli).
- Penser que l'imparfait ne sert qu'à décrire, alors qu'il peut aussi exprimer une habitude répétée.
- Mettre au premier plan une action qui décrit seulement le décor, à l'imparfait.
- Croire que le passé simple est plus « lointain » que l'imparfait, alors qu'il se distingue par l'aspect.
exemple:
  enonce: Explique la différence d'aspect entre « Elle lisait un livre. » et « Elle lut un livre. »
  solution: '« Elle lisait un livre » (imparfait) montre une action non accomplie, en train de se dérouler, sans limite précise
    : on ne sait pas si elle a fini. « Elle lut un livre » (passé simple) montre une action accomplie et bornée : elle a commencé
    et terminé sa lecture.'
exercices:
- id: accompli-ou-non
  type: choix
  difficulte: 1
  enonce: Dans « Le train arriva à l'heure. », l'action est-elle accomplie ou non accomplie ?
  reponse:
    options:
    - id: a
      texte: accomplie
    - id: b
      texte: non accomplie
    bonnes:
    - a
  indices:
    relance: Le passé simple présente-t-il en général une action terminée ou en train de se dérouler ?
    methode: Demande-toi si l'arrivée du train a un début et une fin marqués, ou si elle est vue sans limite.
    etape: '« arriva » est au passé simple : l''action est vue comme terminée, avec un début et une fin précis.'
  pieges:
  - si:
      contient:
      - b
    relance: Le passé simple montre en général une action terminée, pas en cours de déroulement.
  solution: 'L''action est accomplie : le passé simple « arriva » présente un fait ponctuel et terminé.'
- id: temps-et-aspect
  type: association
  difficulte: 1
  enonce: Associe chaque temps à l'aspect qu'il exprime le plus souvent dans un récit.
  reponse:
    gauche:
    - id: a
      texte: imparfait
    - id: b
      texte: passé simple
    - id: c
      texte: plus-que-parfait
    droite:
    - id: x
      texte: non accompli, non borné
    - id: y
      texte: accompli et borné
    - id: z
      texte: accompli, avant une autre action passée
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Cherche d'abord le temps qui décrit une action en train de se dérouler, sans limite.
    methode: 'Le plus-que-parfait se forme avec un auxiliaire à l''imparfait : il indique une action achevée avant une autre.'
    etape: 'Le passé simple raconte des faits ponctuels qui font avancer l''histoire : place-le d''abord.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à l'aspect de chaque temps dans un récit.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le temps qui décrit le décor et dure, puis par celui qui marque un fait ponctuel.
  solution: L'imparfait est non accompli et non borné ; le passé simple est accompli et borné ; le plus-que-parfait est accompli
    et antérieur à une autre action passée.
- id: premier-plan-arriere-plan
  type: association
  difficulte: 2
  enonce: 'Dans ce court récit, associe chaque phrase à son rôle : « Il pleuvait depuis le matin. Soudain, la foudre tomba
    sur un arbre. »'
  reponse:
    gauche:
    - id: a
      texte: Il pleuvait depuis le matin.
    - id: b
      texte: la foudre tomba sur un arbre
    droite:
    - id: x
      texte: arrière-plan (décor, à l'imparfait)
    - id: y
      texte: premier plan (action qui avance, au passé simple)
    paires:
      a: x
      b: y
  indices:
    relance: Cherche quel verbe décrit le décor et quel verbe fait avancer l'histoire.
    methode: L'imparfait décrit souvent une situation qui dure ; le passé simple marque un événement précis qui interrompt
      cette situation.
    etape: '« pleuvait » est à l''imparfait : c''est le décor. « tomba » est au passé simple : c''est l''événement.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère quel verbe est à l'imparfait et lequel est au passé simple.
  - si:
      diagnostic: associations_fausses
    relance: Le décor qui dure va à l'arrière-plan ; l'événement ponctuel qui fait avancer l'histoire va au premier plan.
  solution: « Il pleuvait » (imparfait) est l'arrière-plan, le décor qui dure. « la foudre tomba » (passé simple) est le premier
    plan, l'événement ponctuel.
- id: borne-ou-non-borne
  type: choix
  difficulte: 2
  enonce: Quelle phrase présente une action non bornée, sans limite précise dans le temps ?
  reponse:
    options:
    - id: a
      texte: Autrefois, les habitants cultivaient la vigne sur ces collines.
    - id: b
      texte: En 1850, les habitants plantèrent de nouvelles vignes.
    - id: c
      texte: Ils ont fini les vendanges hier.
    bonnes:
    - a
  indices:
    relance: Cherche la phrase où l'action semble durer, sans début ni fin précis, comme une habitude ancienne.
    methode: Le passé simple et le passé composé marquent en général des actions bornées, avec une date ou un moment précis.
    etape: « cultivaient » est à l'imparfait et exprime une habitude qui a duré, sans limite exacte.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase donne une date précise (1850) et un verbe au passé simple : l''action est bornée.'
  - si:
      contient:
      - c
    relance: 'Cette phrase, au passé composé, marque un fait terminé et daté (hier) : l''action est bornée.'
  solution: '« Autrefois, les habitants cultivaient la vigne » exprime une habitude qui a duré sans limite précise : c''est
    une action non bornée.'
- id: valeur-de-limparfait
  type: choix
  difficulte: 2
  enonce: Dans « Chaque dimanche, ma grand-mère préparait un gâteau. », quelle valeur prend l'imparfait ?
  reponse:
    options:
    - id: a
      texte: une habitude, une action qui se répète
    - id: b
      texte: une action ponctuelle qui fait avancer l'histoire
    - id: c
      texte: une action terminée et bornée
    bonnes:
    - a
  indices:
    relance: 'Repère le groupe « chaque dimanche » : que dit-il sur le nombre de fois où l''action a lieu ?'
    methode: Une action ponctuelle et bornée se raconte plutôt au passé simple. Ici, l'action revient régulièrement.
    etape: 'L''imparfait est un temps non borné : il peut décrire une situation qui dure, mais aussi une action qui se répète.'
  pieges:
  - si:
      contient:
      - b
    relance: Une action qui fait avancer l'histoire est ponctuelle, au premier plan. Ici, l'action revient chaque semaine.
  - si:
      contient:
      - c
    relance: 'Une action bornée a un début et une fin précis. Ici, il n''y a pas de limite : l''action se reproduit régulièrement.'
  solution: 'L''imparfait exprime ici une habitude : l''action se répète chaque dimanche, sans début ni fin marqués. C''est
    un aspect non borné.'
- id: classer-les-verbes
  type: choix
  difficulte: 2
  enonce: Dans « La nuit tombait. Un cri retentit. », quel verbe fait avancer l'histoire (premier plan) ?
  reponse:
    options:
    - id: a
      texte: retentit
    - id: b
      texte: tombait
    bonnes:
    - a
  indices:
    relance: Cherche le verbe qui exprime un événement ponctuel plutôt qu'une situation qui dure.
    methode: 'Regarde le temps des deux verbes : l''un est à l''imparfait, l''autre au passé simple.'
    etape: Le verbe au passé simple marque un fait précis et terminé, le verbe à l'imparfait installe le décor.
  pieges:
  - si:
      contient:
      - b
    relance: '« tombait » est à l''imparfait : il décrit le moment de la journée, c''est l''arrière-plan.'
  solution: '« Un cri retentit » est au passé simple : événement ponctuel, premier plan. « La nuit tombait » est à l''imparfait
    : décor, arrière-plan.'
- id: aspect-libre
  type: ouverte
  difficulte: 3
  enonce: 'Écris deux phrases sur le même sujet : une avec un verbe à l''imparfait qui décrit une situation non accomplie,
    une avec un verbe au passé simple ou composé qui marque une action accomplie et bornée. Explique ensuite en une phrase
    pourquoi tu as choisi ces temps.'
  criteres:
  - La première phrase utilise l'imparfait pour une action non accomplie, sans limite précise dans le temps.
  - La seconde phrase utilise le passé simple ou le passé composé pour une action accomplie et bornée.
  - L'explication emploie le vocabulaire de l'aspect (accompli, non accompli, borné ou non borné) ou parle d'arrière-plan
    et de premier plan.
  indices:
    relance: 'Pense à une scène : d''abord le décor qui dure, puis un événement précis qui s''y produit.'
    methode: Choisis un lieu ou une situation, décris-le à l'imparfait, puis raconte un fait précis qui s'y déroule au passé
      simple ou composé.
    etape: 'Par exemple : « Le ciel était gris. » puis « Soudain, il se mit à pleuvoir. »'
  solution: 'Exemple possible : « Le village dormait sous la neige. » (imparfait, non accompli, non borné) puis « Un renard
    traversa la place déserte. » (passé simple, accompli, borné). Le premier temps installe le décor (arrière-plan), le second
    fait avancer l''histoire (premier plan).'
