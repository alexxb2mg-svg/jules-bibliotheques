# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: propositions-subordonnees
version: 2
etat: verifiee
declencheurs:
- qui, que, dont
- phrase avec deux verbes conjugués
- trouver l'antécédent
- que conjonction ou pronom
- analyser une phrase complexe
- proposition principale et subordonnée
- fonction de dont ou où
- proposition introduite par que
prerequis: []
essentiel: 'Une phrase complexe contient plusieurs verbes conjugués, donc plusieurs propositions. La proposition principale
  a du sens seule. La proposition subordonnée dépend d''elle : elle ne peut pas exister seule.


  Trois grands types de subordonnées.


  1. La subordonnée relative commence par un pronom relatif (qui, que, dont, où, lequel...). Elle complète un nom ou un pronom,
  l''antécédent. « Le livre que j''ai lu m''a plu. » Antécédent : le livre.


  2. La subordonnée conjonctive complétive commence par « que » conjonction, sans antécédent. Elle est le plus souvent COD
  du verbe : « Je pense que tu as raison. »


  3. La subordonnée conjonctive circonstancielle commence par une conjonction comme « quand », « parce que », « si », « dès
  que ». Elle est complément circonstanciel de la principale (temps, cause, condition...). On peut souvent la déplacer : «
  Dès que la pluie cessera, nous sortirons. »


  Le pronom relatif remplace l''antécédent et a une fonction dans SA proposition :

  - qui = sujet (« l''élève qui chante »)

  - que = COD (« le film que j''ai vu »)

  - où = complément circonstanciel de lieu ou de temps (« la maison où j''ai grandi »)

  - dont = complément introduit par « de » : complément du verbe (« le livre dont je parle », on parle DE ce livre) ou complément
  du nom (« l''auteur dont j''admire les livres »).


  Le pronom relatif est du même genre et du même nombre que son antécédent : le verbe ou le participe s''accorde avec lui.


  Au brevet, on attend que tu identifies les propositions, la principale, le type de chaque subordonnée, l''antécédent et
  la fonction du pronom relatif.

  '
methode:
- 'Repère tous les verbes conjugués de la phrase : il y a une proposition par verbe conjugué.'
- Trouve la proposition principale (celle qui a du sens toute seule) et la ou les subordonnées.
- 'Regarde le mot qui introduit chaque subordonnée : pronom relatif, « que » conjonction, autre conjonction.'
- Pour une relative, trouve l'antécédent (le nom repris, souvent juste avant le pronom) et remplace le pronom par lui pour
  tester.
- Cherche la fonction du pronom relatif dans SA proposition (sujet, COD, complément de lieu, complément introduit par de).
- Écris l'analyse avec des phrases courtes, du type « la proposition ... est une subordonnée relative ; elle complète ...
  ».
vocabulaire:
- terme: proposition principale
  definition: proposition dont dépendent les subordonnées ; elle a du sens toute seule
- terme: proposition subordonnée
  definition: proposition qui dépend d'une autre et ne peut pas exister seule
- terme: pronom relatif
  definition: pronom (qui, que, dont, où, lequel...) qui reprend un antécédent et introduit une subordonnée
- terme: antécédent
  definition: nom ou pronom que le pronom relatif reprend et remplace
- terme: proposition subordonnée relative
  definition: proposition introduite par un pronom relatif, qui complète un antécédent
- terme: subordonnée conjonctive
  definition: subordonnée introduite par une conjonction de subordination (que, quand, parce que...)
- terme: analyse logique
  definition: étude des propositions d'une phrase complexe et de leurs relations
erreurs_frequentes:
- Confondre « que » pronom relatif (il a un antécédent) et « que » conjonction de subordination (il n'en a pas).
- Chercher la fonction du pronom relatif dans la principale, alors qu'elle se cherche dans SA proposition.
- Prendre le mot juste avant « qui/que » pour l'antécédent sans vérifier le sens.
- Oublier qu'une phrase peut avoir plusieurs subordonnées, l'une dépendant d'une autre.
- 'Croire que « dont » est toujours complément du nom : il peut compléter un verbe (parler de).'
exemple:
  enonce: Dans « La maison où j'ai grandi est à vendre. », identifie l'antécédent, le pronom relatif et sa fonction.
  solution: 'Antécédent = la maison. Pronom relatif = où. Fonction de « où » dans la subordonnée : complément de lieu de «
    ai grandi » (j''ai grandi OÙ ? où, c''est-à-dire dans la maison).'
exercices:
- id: reperer-subordonnee
  type: choix
  difficulte: 1
  enonce: Dans « Le chat qui dort sur le canapé s'appelle Mistigri. », quelle est la proposition subordonnée relative ?
  reponse:
    options:
    - id: a
      texte: qui dort sur le canapé
    - id: b
      texte: le chat
    - id: c
      texte: s'appelle Mistigri
    - id: d
      texte: sur le canapé
    bonnes:
    - a
  indices:
    relance: 'Cherche le pronom relatif dans la phrase : quel petit mot introduit une proposition ?'
    methode: La subordonnée relative commence au pronom relatif et va jusqu'à la fin du groupe qui dépend de lui.
    etape: Le pronom relatif est « qui ». La subordonnée commence à « qui » et se termine avant « s'appelle ».
  pieges:
  - si:
      contient:
      - b
    relance: « le chat » est l'antécédent, pas la subordonnée elle-même.
  - si:
      contient:
      - c
    relance: « s'appelle Mistigri » est la proposition principale, celle qui a du sens toute seule.
  - si:
      contient:
      - d
    relance: « sur le canapé » n'est qu'un morceau de la subordonnée, pas la proposition entière.
  solution: 'La subordonnée relative est « qui dort sur le canapé » : elle complète l''antécédent « le chat ».'
- id: antecedent-texte-court
  type: texte_court
  difficulte: 1
  enonce: Dans « La ville que nous avons visitée est magnifique. », quel est l'antécédent du pronom relatif « que » ? (un
    seul mot, sans article)
  reponse:
    acceptees:
    - ville
    fautes_tolerees: 0
  indices:
    relance: L'antécédent est juste avant le pronom relatif, dans la proposition principale.
    methode: 'Cherche le nom que « que » remplace : nous avons visité QUOI ?'
    etape: Repère le nom, juste avant « que », que le pronom relatif remplace.
  pieges:
  - si:
      valeur: la ville magnifique
    relance: 'N''écris que le nom, sans article ni adjectif : quel est ce nom ?'
  solution: 'L''antécédent est « ville » : « que » le reprend, et « visitée » s''accorde avec lui au féminin.'
- id: pronoms-et-fonctions
  type: association
  difficulte: 1
  enonce: Associe chaque pronom relatif à sa fonction la plus fréquente dans sa proposition.
  reponse:
    gauche:
    - id: a
      texte: qui
    - id: b
      texte: que
    - id: c
      texte: où
    droite:
    - id: x
      texte: sujet
    - id: y
      texte: COD
    - id: z
      texte: complément de lieu
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chacun, remplace le pronom par son antécédent et regarde quelle fonction ce nom aurait.
    methode: « qui » remplace le sujet du verbe ; « que » répond à la question « quoi ? » après le verbe ; « où » répond à
      « où ? ».
    etape: 'Commence par « où » : c''est le pronom qu''on emploie pour parler d''un lieu.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends le pronom que tu as le moins bien placé et essaie-le dans une phrase.
  - si:
      diagnostic: associations_fausses
    relance: 'Essaie chaque pronom dans une phrase : « l''élève qui chante », « le livre que j''ai lu », « la ville où j''habite
      ».'
  solution: qui = sujet ; que = COD ; où = complément de lieu.
- id: fonction-pronom-relatif
  type: choix
  difficulte: 2
  enonce: Dans « Le livre dont je parle est passionnant. », quelle est la fonction de « dont » dans sa proposition ?
  reponse:
    options:
    - id: a
      texte: complément d'objet indirect de parle (complément introduit par de)
    - id: b
      texte: sujet du verbe parle
    - id: c
      texte: COD du verbe parle
    - id: d
      texte: complément de lieu
    bonnes:
    - a
  indices:
    relance: 'Remplace « dont » par ce qu''il reprend : « je parle DE ce livre ».'
    methode: « dont » reprend un complément introduit par « de ». Cherche le verbe qui se construit avec « de ».
    etape: 'Le verbe est « parler de ». Le complément introduit par « de » n''est ni sujet, ni COD direct : quelle est sa
      fonction ?'
  pieges:
  - si:
      contient:
      - b
    relance: Le sujet de « parle » est « je », pas « dont ».
  - si:
      contient:
      - c
    relance: '« parler » se construit avec « de » : son complément n''est pas un COD direct.'
  - si:
      contient:
      - d
    relance: '« dont » ne répond pas à la question « où ? » ici : il reprend « de ce livre ».'
  solution: '« dont » reprend « de ce livre » : je parle DE ce livre. Il est complément d''objet indirect du verbe « parle
    » (complément introduit par « de »). Il peut aussi compléter un nom : « l''auteur dont j''admire les livres ».'
- id: nombre-propositions
  type: nombre
  difficulte: 2
  enonce: Combien de propositions contient la phrase « Je sais que le chien que tu as vu dort. » ?
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Il y a une proposition par verbe conjugué. Repère chaque verbe conjugué.
    methode: 'Attention aux temps composés : « as vu » est un seul verbe conjugué, formé de deux mots.'
    etape: Repère d'abord « sais » et « dort ». Il y en a encore un dans la partie « que tu as vu ».
  pieges:
  - si:
      valeur: 4
    relance: '« as vu » est un temps composé : c''est un seul verbe conjugué, donc une seule proposition.'
  - si:
      valeur: 2
    relance: 'Tu as trouvé « sais » et « dort ». Relis la partie « que tu as vu » : y a-t-il un verbe conjugué ?'
  solution: 'Verbes conjugués : « sais », « as vu », « dort ». Donc 3 propositions : « Je sais » (principale), « que le chien
    dort » (subordonnée complétive) et « que tu as vu » (relative qui complète « le chien »).'
- id: subordonnee-circonstancielle
  type: choix
  difficulte: 2
  enonce: Dans « Nous sortirons dès que la pluie cessera. », quelle est la nature de la proposition « dès que la pluie cessera
    » ?
  reponse:
    options:
    - id: a
      texte: subordonnée circonstancielle de temps
    - id: b
      texte: subordonnée relative
    - id: c
      texte: subordonnée complétive COD
    bonnes:
    - a
  indices:
    relance: Quel mot introduit la subordonnée, et exprime-t-elle le lieu, le temps, la cause ?
    methode: Vérifie si le mot introducteur reprend un nom (relative) ou s'il est une conjonction qui donne une circonstance.
    etape: 'Essaie de déplacer la subordonnée au début de la phrase : cela marche-t-il pour une complétive ?'
  pieges:
  - si:
      contient:
      - b
    relance: '« dès que » n''est pas un pronom relatif : il ne reprend aucun nom de la principale, il n''y a pas d''antécédent.'
  - si:
      contient:
      - c
    relance: 'Une complétive est objet du verbe et ne se déplace pas. Ici on peut dire « Dès que la pluie cessera, nous sortirons
      » : quelle circonstance est exprimée ?'
  solution: '« dès que » est une locution conjonctive de temps : la subordonnée indique quand on sortira. C''est une subordonnée
    circonstancielle de temps, complément circonstanciel de la principale.'
- id: relative-vs-conjonctive
  type: association
  difficulte: 3
  enonce: Associe chaque phrase au type de subordonnée qu'elle contient.
  reponse:
    gauche:
    - id: a
      texte: Le stylo que j'utilise est cassé.
    - id: b
      texte: Je pense que tu as raison.
    droite:
    - id: x
      texte: 'subordonnée relative (que a un antécédent : le stylo)'
    - id: y
      texte: subordonnée conjonctive (que n'a pas d'antécédent)
    paires:
      a: x
      b: y
  indices:
    relance: Dans une des deux phrases, « que » remplace un nom précis. Dans l'autre, non.
    methode: 'Cherche si « que » a un antécédent : un nom qu''il reprend et qui existe avant lui dans la phrase.'
    etape: 'Dans la phrase b, « que » n''a pas de nom à reprendre : c''est une conjonction, pas un pronom relatif.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie laquelle des deux phrases a un antécédent avant « que ».
  - si:
      diagnostic: associations_fausses
    relance: Demande-toi, pour chaque phrase, si « que » remplace un nom précis ou non.
  solution: 'Dans « le stylo que j''utilise », « que » reprend « le stylo » (relative). Dans « je pense que tu as raison »,
    « que » n''a pas d''antécédent : c''est une conjonctive.'
- id: nblm-combien-de-verbes-conjugues-trouve-t-on-1
  type: choix
  difficulte: 2
  enonce: Combien de verbes conjugués trouve-t-on au minimum dans une phrase contenant une proposition subordonnée ?
  reponse:
    options:
    - id: o1
      texte: Deux verbes conjugués
    - id: o2
      texte: Un seul verbe conjugué
    - id: o3
      texte: Aucun verbe conjugué
    - id: o4
      texte: Au moins trois verbes conjugués
    bonnes:
    - o1
  indices:
    relance: Pense à la définition d'une phrase complexe et au nombre de propositions qu'elle comporte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : une phrase avec un seul verbe conjugué est une phrase simple, elle ne peut pas contenir de
      proposition subordonnée.'
  - si:
      contient:
      - o3
    relance: Une proposition s'organise autour d'un verbe conjugué ; sans verbe conjugué, il n'y a pas de proposition subordonnée.
  solution: 'Deux verbes conjugués. C''est exact : une proposition s''organisant autour d''un verbe conjugué, la présence
    d''une subordonnée dépendante d''une principale implique d''avoir au moins deux verbes conjugués dans la phrase complexe.'
- id: nblm-dans-la-phrase-le-roman-que-jules-lit-es-2
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Le roman que Jules lit est passionnant », quel est l'antécédent complété par la proposition subordonnée
    relative ?
  reponse:
    options:
    - id: o1
      texte: Le roman
    - id: o2
      texte: Jules
    - id: o3
      texte: que
    - id: o4
      texte: est passionnant
    bonnes:
    - o1
  indices:
    relance: Cherche le nom placé juste avant le pronom relatif qui désigne le récit qu'on lit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre l''antécédent avec le sujet du verbe de la subordonnée (Jules).'
  - si:
      contient:
      - o3
    relance: 'Erreur : « que » est le pronom relatif introduisant la subordonnée, et non le nom antécédent qu''il remplace.'
  - si:
      contient:
      - o4
    relance: 'Erreur : « est passionnant » est le groupe verbal de la proposition principale, pas l''antécédent.'
  solution: 'Le roman. C''est juste : l''antécédent est le nom placé avant le pronom relatif « que », qui est repris et complété
    par la subordonnée relative.'
- id: nblm-dans-la-proposition-subordonnee-relative-3
  type: choix
  difficulte: 2
  enonce: Dans la proposition subordonnée relative « dont le professeur m'a parlé », quelle est la fonction du pronom relatif
    « dont » ?
  reponse:
    options:
    - id: o1
      texte: Complément du nom ou du verbe (introduit par 'de')
    - id: o2
      texte: Sujet du verbe
    - id: o3
      texte: Complément d'objet direct (COD)
    - id: o4
      texte: Complément circonstanciel de lieu
    bonnes:
    - o1
  indices:
    relance: Pense à la préposition « de » que l'on retrouve quand on décompose la phrase (parler DE quelque chose).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le pronom relatif sujet est « qui », alors que « dont » reprend un complément introduit par
      ''de''.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le pronom relatif COD est « que », pas « dont ».'
  - si:
      contient:
      - o4
    relance: 'Erreur : le pronom relatif pour le lieu ou le temps est « où ».'
  solution: 'Complément du nom ou du verbe (introduit par ''de''). C''est exact : le pronom relatif « dont » remplace un antécédent
    précédé de la préposition ''de'' et exerce la fonction de complément du nom ou du verbe dans la subordonnée.'
- id: nblm-quelle-est-la-fonction-grammaticale-du-p-4
  type: choix
  difficulte: 2
  enonce: Quelle est la fonction grammaticale du pronom relatif « qui » dans la proposition subordonnée « qui chante dans
    la chorale » ?
  reponse:
    options:
    - id: o1
      texte: Sujet du verbe « chante »
    - id: o2
      texte: Complément d'objet direct (COD)
    - id: o3
      texte: Complément de l'antécédent
    - id: o4
      texte: Attribut du sujet
    bonnes:
    - o1
  indices:
    relance: Pose la question 'qui est-ce qui chante ?' pour trouver la fonction du pronom dans sa proposition.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : le pronom relatif COD est « que », non « qui ».'
  - si:
      contient:
      - o3
    relance: 'Attention : c''est la proposition subordonnée relative tout entière qui est complément de l''antécédent, alors
      que le pronom « qui » lui-même est sujet dans la subordonnée.'
  - si:
      contient:
      - o4
    relance: 'Erreur : « qui » ne relie pas un sujet à une qualité via un verbe d''état, il réalise l''action d''être sujet
      du verbe conjugué.'
  solution: 'Sujet du verbe « chante ». C''est exact : le pronom relatif « qui » occupe la fonction de sujet du verbe de la
    proposition subordonnée relative.'
- id: nblm-comment-distingue-t-on-le-pronom-relatif-5
  type: choix
  difficulte: 2
  enonce: Comment distingue-t-on le pronom relatif « que » de la conjonction de subordination « que » ?
  reponse:
    options:
    - id: o1
      texte: Le pronom relatif « que » complète un nom antécédent, alors que la conjonction « que » suit un verbe sans antécédent.
    - id: o2
      texte: Le pronom relatif « que » est toujours placé au début de la phrase principale.
    - id: o3
      texte: La conjonction « que » s'accorde en genre et en nombre avec le sujet.
    - id: o4
      texte: Il n'y a aucune différence, ils ont exactement la même nature et la même fonction.
    bonnes:
    - o1
  indices:
    relance: 'Regarde la nature du mot situé juste avant « que » : est-ce un nom ou un verbe ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : le pronom relatif se place après son antécédent, à l''intérieur de la phrase complexe.'
  - si:
      contient:
      - o3
    relance: 'Erreur : une conjonction est un mot invariable qui ne s''accorde jamais.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre pronom relatif (remplace un nom) et conjonction de subordination (mot d''enchaînement).'
  solution: 'Le pronom relatif « que » complète un nom antécédent, alors que la conjonction « que » suit un verbe sans antécédent.
    C''est parfait : le pronom relatif introduit une relative et a un antécédent nominal, tandis que la conjonction introduit
    une conjonctive et suit un verbe.'
- id: nblm-quels-mots-parmi-les-suivants-sont-des-p-6
  type: choix
  difficulte: 3
  enonce: Quels mots parmi les suivants sont des pronoms relatifs pouvant introduire une proposition subordonnée relative
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: dont
    - id: o2
      texte: qui
    - id: o3
      texte: parce que
    - id: o4
      texte: mais
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux mots qui remplacent un nom antécédent dans une phrase complexe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : « parce que » est une locution conjonctive de subordination, pas un pronom relatif.'
  - si:
      contient:
      - o4
    relance: 'Faux : « mais » est une conjonction de coordination, pas un pronom relatif.'
  solution: 'dont ; qui. C''est juste : « dont » est un pronom relatif qui reprend un antécédent et introduit une subordonnée
    relative.'
- id: nblm-complete-la-phrase-suivante-avec-le-pron-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase suivante avec le pronom relatif qui convient : « Les exercices _____ le professeur a donnés
    sont faciles. »'
  reponse:
    acceptees:
    - que
    fautes_tolerees: 1
  indices:
    relance: Ce pronom relatif est COD du verbe 'a donnés' et reprend l'antécédent 'les exercices'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'que. C''est exact : ''que'' est le pronom relatif complément d''objet direct qui reprend l''antécédent ''les
    exercices''.'
- id: nblm-comment-appelle-t-on-le-nom-ou-pronom-pl-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le nom ou pronom placé avant le pronom relatif et que ce dernier remplace ?
  reponse:
    acceptees:
    - l'antécédent
    fautes_tolerees: 1
  indices:
    relance: Ce terme grammatical désigne le mot qui 'marche devant' le pronom relatif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'l''antécédent. C''est exact : l''antécédent est le mot complété par la proposition subordonnée relative et remplacé
    par le pronom relatif.'
- id: analyse-logique-complete
  type: ouverte
  difficulte: 3
  enonce: 'Fais l''analyse logique de la phrase « Je crois que le livre dont tu m''as parlé est épuisé. » : relève les propositions,
    dis laquelle est la principale, donne le type de chaque subordonnée, puis, pour la relative, l''antécédent, le pronom
    relatif et sa fonction.'
  criteres:
  - 'L''élève identifie les trois propositions et la principale : « Je crois ».'
  - L'élève identifie la subordonnée conjonctive complétive « que le livre ... est épuisé » (introduite par la conjonction
    « que », COD de « crois »).
  - L'élève identifie la subordonnée relative « dont tu m'as parlé », qui complète l'antécédent « le livre ».
  - 'L''élève donne la fonction du pronom « dont » dans sa proposition : complément introduit par « de » du verbe « as parlé
    » (tu m''as parlé DE ce livre).'
  indices:
    relance: Compte d'abord les verbes conjugués, puis cherche laquelle des propositions a du sens seule.
    methode: Regarde le mot qui introduit chaque subordonnée (que conjonction ? pronom relatif ?), puis cherche l'antécédent
      du pronom relatif.
    etape: Commence par « La phrase contient trois propositions. La principale est... » puis traite les deux subordonnées
      l'une après l'autre.
  solution: 'Trois propositions. Principale : « Je crois ». Subordonnée conjonctive complétive : « que le livre ... est épuisé
    » (COD de « crois »). Subordonnée relative : « dont tu m''as parlé », antécédent « le livre » ; « dont » = « de ce livre
    », complément d''objet indirect de « as parlé ».'
