# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: analyse-image-et-documents-composites
version: 2
etat: verifiee
declencheurs:
- lire une image
- décrire une photo
- comprendre un plan de film
- document avec image et texte
- regarder un tableau
- extrait de film à analyser
- plongée ou contre-plongée
- légende et illustration
- document texte et graphique
prerequis: []
essentiel: 'Lire une image, c''est la décrire avec précision, puis comprendre ce qu''elle veut dire. Le programme de 3e demande
  de décrire une image fixe (photographie, affiche, tableau) ou mobile (film) avec un vocabulaire adapté : formes, couleurs,
  contrastes, plans, cadrage, point de vue.


  Le cadrage est ce que l''image montre, dans son cadre. Ce qui est laissé de côté est le hors-champ : on devine ce qui est
  à côté, par un regard, une ombre, un son. Le hors-champ crée du mystère ou de la tension.


  Les plans (distance) : plan d''ensemble ou large (on voit tout le décor, les personnages sont petits), plan moyen (on voit
  le personnage en entier ou à la taille), gros plan (on voit un visage), très gros plan (un détail : un œil, une main). Le
  gros plan montre une émotion ; le plan large situe un lieu.


  Les angles (point de vue) : à hauteur d''œil (regard neutre), en plongée (caméra en haut, vue de haut : le sujet paraît
  petit, écrasé, fragile) et en contre-plongée (caméra en bas, vue de bas : le sujet paraît grand, puissant, menaçant). Un
  film ajoute des mouvements de caméra, la bande son, le montage.


  Les couleurs et les contrastes : couleurs chaudes (rouge, orange : énergie, danger) ou froides (bleu : calme, tristesse)
  ; contraste de lumière (ombre et lumière) qui dramatise une scène.


  Un document composite associe plusieurs éléments : texte, image, légende, graphique, tableau. Chacun apporte quelque chose
  : le texte explique, l''image montre, la légende situe, le graphique donne des chiffres. Il faut les mettre en relation.
  On lit aussi sur papier ou sur écran (page web avec liens et vidéos).


  L''implicite est ce que l''image suggère sans le dire : un détail, une couleur, un regard.


  Ce qu''on attend au brevet : décrire, puis interpréter avec le vocabulaire précis (plan, cadrage, point de vue), en prouvant
  par un détail.

  '
methode:
- 'Identifier la nature du document : photo, tableau, affiche, extrait de film, document composite. Lire le titre, la date,
  la légende.'
- 'Décrire ce que l''on voit : personnages, décor, formes, couleurs, en commençant par l''ensemble puis les détails.'
- Identifier le cadrage et le plan (large, moyen, gros plan) et ce qui est laissé hors champ.
- Identifier le point de vue (plongée, contre-plongée, hauteur d'œil) et son effet.
- Repérer les couleurs et les contrastes dominants et l'impression qu'ils donnent.
- Dans un document composite, relier chaque élément (texte, image, légende) à ce qu'il apporte.
- Formuler ce que l'image suggère (l'implicite), en citant un détail précis pour le justifier.
vocabulaire:
- terme: cadrage
  definition: manière de délimiter ce que l'image montre dans son cadre
- terme: plan
  definition: distance entre l'appareil ou la caméra et ce qui est représenté
- terme: gros plan
  definition: plan très rapproché qui montre un visage ou un détail
- terme: plan large
  definition: plan qui montre un grand espace avec des personnages petits
- terme: hors-champ
  definition: ce qui n'est pas montré dans le cadre de l'image, mais que l'on devine
- terme: plongée
  definition: prise de vue depuis un point haut, qui regarde le sujet vers le bas
- terme: contre-plongée
  definition: prise de vue depuis un point bas, qui regarde le sujet vers le haut
- terme: document composite
  definition: document qui associe plusieurs types d'éléments (texte, image, tableau) qui se complètent
- terme: implicite
  definition: ce qu'un document suggère sans le dire directement
erreurs_frequentes:
- Décrire seulement ce que montre l'image sans dire ce qu'elle suggère (l'implicite).
- Confondre plongée et contre-plongée.
- Dans un document composite, ne lire que le texte sans regarder ce que l'image ou la légende ajoutent.
- Confondre plan (la distance) et angle de vue (la hauteur de la caméra).
- Interpréter sans citer de détail précis de l'image.
exemple:
  enonce: Une affiche montre un enfant, vu de très bas, qui lève les bras vers un ciel orageux. Explique en deux phrases l'effet
    donné par ce point de vue.
  solution: L'enfant est photographié en contre-plongée, depuis un point bas. Ce point de vue le fait paraître plus grand
    et plus fort qu'il ne l'est réellement, ce qui peut suggérer du courage ou de la détermination face à l'orage.
exercices:
- id: plan-vocabulaire
  type: choix
  difficulte: 1
  enonce: Une photo montre uniquement le visage d'une personne, très proche, on ne voit ni ses épaules ni le décor. Comment
    appelle-t-on ce type de plan ?
  reponse:
    options:
    - id: a
      texte: Un gros plan
    - id: b
      texte: Un plan large
    - id: c
      texte: Un plan d'ensemble
    - id: d
      texte: Une plongée
    bonnes:
    - a
  indices:
    relance: Est-ce qu'on voit beaucoup de décor autour de la personne, ou presque rien ?
    methode: Le nom du plan dépend de la distance entre l'appareil et le sujet, pas de l'angle de vue.
    etape: Ici on ne voit que le visage, de très près. C'est la distance la plus proche possible.
  pieges:
  - si:
      contient:
      - b
    relance: Un plan large montre beaucoup de décor autour du sujet. Est-ce le cas ici, où l'on ne voit que le visage ?
  - si:
      contient:
      - c
    relance: Un plan d'ensemble montre tout un lieu avec les personnes en petit. Ici, on est très proche du visage.
  - si:
      contient:
      - d
    relance: La plongée est un angle de vue, pas une distance. La question porte sur la distance à la personne.
  solution: 'C''est un gros plan : l''appareil est très proche du sujet et ne montre qu''un détail, ici le visage.'
- id: mot-hors-champ
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne ce qui n'est pas montré dans le cadre d'une image, mais que l'on devine (un bruit, une ombre, une
    personne dont on ne voit que l'ombre) ?
  reponse:
    acceptees:
    - hors champ
    - hors-champ
    fautes_tolerees: 1
  indices:
    relance: Pense à ce qui se passe juste à côté du cadre, mais que la photo ne montre pas directement.
    methode: Le mot est composé de deux mots reliés par un trait d'union, qui indiquent qu'on est en dehors du champ visible.
    etape: Le mot commence par « hors » et se termine par « champ ».
  pieges:
  - si:
      valeur: décor
    relance: Le décor est ce qu'on voit dans l'image. Le mot cherché désigne au contraire ce qu'on ne voit pas.
  solution: 'Le hors-champ : tout ce qui existe en dehors du cadre de l''image, et que l''on devine sans le voir.'
- id: elements-document-composite
  type: association
  difficulte: 2
  enonce: Un document composite sur les dangers du bruit associe un texte, un graphique et une photo. Relie chaque élément
    à ce qu'il apporte.
  reponse:
    gauche:
    - id: a
      texte: Le texte
    - id: b
      texte: Le graphique
    - id: c
      texte: La photo
    droite:
    - id: x
      texte: Explique les causes et les conséquences du bruit avec des phrases
    - id: y
      texte: Montre des chiffres précis, par exemple l'évolution du niveau sonore dans le temps
    - id: z
      texte: Montre une situation concrète, par exemple des ouvriers sans protection auditive
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Demande-toi lequel de ces trois éléments donne des chiffres, lequel donne des explications, lequel montre une
      scène réelle.
    methode: Le texte explique avec des mots, le graphique montre des données chiffrées, l'image montre une situation concrète.
    etape: Commence par le graphique, qui est le plus facile à repérer grâce aux chiffres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à ce que chaque type d'élément apporte de particulier.
  - si:
      diagnostic: associations_fausses
    relance: Repars du graphique, qui donne forcément des chiffres, puis distingue le texte de la photo.
  solution: Le texte explique avec des mots. Le graphique montre des données chiffrées. La photo montre une situation concrète.
- id: etapes-lecture-image
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour analyser une image.
  reponse:
    elements:
    - id: a
      texte: J'identifie le cadrage et ce que l'image montre ou laisse hors champ
    - id: b
      texte: J'identifie le point de vue (plongée, contre-plongée, hauteur d'œil)
    - id: c
      texte: Je repère les couleurs et les contrastes dominants
    - id: d
      texte: Je formule ce que l'image suggère, en citant un détail précis
  indices:
    relance: Quelle est la toute première chose à observer dans une image, avant l'angle de vue ou les couleurs ?
    methode: On commence toujours par ce qui est montré (le cadrage), puis on affine avec l'angle, les couleurs, et enfin
      l'interprétation.
    etape: On commence par le cadrage, la première information visible.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle vient logiquement avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape la plus simple (le cadrage) et la dernière (l'interprétation), puis range les deux autres
      entre elles.
  solution: On commence par le cadrage, puis le point de vue, puis les couleurs et contrastes, et on termine par l'interprétation
    appuyée sur un détail précis.
- id: effet-plongee
  type: choix
  difficulte: 2
  enonce: Une caméra filme un personnage depuis le haut, en le regardant vers le bas. Quel effet cela peut-il produire ?
  reponse:
    options:
    - id: a
      texte: Le personnage paraît petit, fragile ou écrasé
    - id: b
      texte: Le personnage paraît très grand et puissant
    - id: c
      texte: Le personnage devient invisible
    - id: d
      texte: L'image devient forcément en couleur
    bonnes:
    - a
  indices:
    relance: Quand on regarde quelqu'un de haut, le voit-on plus grand ou plus petit ?
    methode: La plongée est l'inverse de la contre-plongée.
    etape: Un point de vue en hauteur rapetisse ce que l'on regarde.
  pieges:
  - si:
      contient:
      - b
    relance: C'est l'effet de la contre-plongée, où la caméra est en bas.
  - si:
      contient:
      - c
    relance: Une plongée ne rend pas invisible, elle change l'impression donnée.
  - si:
      contient:
      - d
    relance: Le point de vue n'a aucun rapport avec les couleurs.
  solution: La plongée peut donner une impression de petitesse ou de fragilité.
- id: plans-vocabulaire
  type: association
  difficulte: 2
  enonce: Associe chaque plan à ce qu'il montre.
  reponse:
    gauche:
    - id: a
      texte: Le plan large
    - id: b
      texte: Le plan moyen
    - id: c
      texte: Le gros plan
    droite:
    - id: x
      texte: Un grand décor avec des personnages petits
    - id: y
      texte: Un personnage vu à la taille
    - id: z
      texte: Un visage de très près
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Classe les plans du plus éloigné au plus rapproché.
    methode: Le plan large montre l'espace, le plan moyen un personnage, le gros plan un visage.
    etape: Le gros plan est le plus proche du sujet.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Classe du plus éloigné au plus rapproché.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque plan en pensant à la distance de la caméra.
  solution: 'Plan large : grand décor. Plan moyen : personnage à la taille. Gros plan : visage.'
- id: effet-couleurs
  type: choix
  difficulte: 2
  enonce: Une affiche est presque entièrement rouge et orange, avec un personnage qui crie. Quelle impression les couleurs
    donnent-elles surtout ?
  reponse:
    options:
    - id: a
      texte: Une impression d'énergie, de danger ou de colère
    - id: b
      texte: Une impression de calme et de sérénité
    - id: c
      texte: Une impression de froid et de tristesse
    - id: d
      texte: Aucune impression particulière
    bonnes:
    - a
  indices:
    relance: 'Le rouge et l''orange sont des couleurs chaudes : à quoi les associe-t-on ?'
    methode: Compare avec les couleurs froides comme le bleu, qui donnent une impression différente.
    etape: Le personnage qui crie renforce l'idée d'une émotion forte.
  pieges:
  - si:
      contient:
      - b
    relance: Le calme est plutôt suggéré par des couleurs froides ou douces.
  - si:
      contient:
      - c
    relance: Le froid et la tristesse sont associés au bleu, pas au rouge.
  - si:
      contient:
      - d
    relance: Les couleurs dominantes ont toujours un effet sur le lecteur.
  solution: Les couleurs chaudes donnent une impression d'énergie, de danger ou de colère.
- id: decrire-photo
  type: ouverte
  difficulte: 3
  enonce: Une photographie montre, en contre-plongée, un enfant qui se dresse devant un immense mur sombre. Le hors-champ
    laisse deviner un cri. Décris l'image avec le vocabulaire du cours et explique ce qu'elle suggère.
  criteres:
  - L'élève emploie au moins deux termes précis du cours (contre-plongée, plan, cadrage, hors-champ, contraste).
  - L'élève décrit l'effet du point de vue (l'enfant paraît grand et déterminé malgré le mur).
  - L'élève formule ce que l'image suggère (courage, révolte) en citant un détail précis (mur sombre, cri deviné).
  indices:
    relance: Que dit la position de la caméra ? Que devines-tu de ce qu'on ne voit pas ?
    methode: 'Décris d''abord, puis interprète : point de vue, cadrage, hors-champ, contraste.'
    etape: Tu peux commencer ainsi « Cette photo en contre-plongée montre... ce qui donne l'impression que... ».
  solution: Cette photo en contre-plongée montre un enfant devant un immense mur sombre. Le point de vue le fait paraître
    grand et déterminé malgré le mur, qui domine pourtant l'image. Le hors-champ laisse deviner un cri, ce qui suggère la
    révolte. Le contraste entre l'enfant et le mur sombre renforce l'idée du courage d'un faible face à un obstacle.
