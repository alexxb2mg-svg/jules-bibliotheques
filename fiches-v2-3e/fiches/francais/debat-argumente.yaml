# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: debat-argumente
version: 1
etat: verifiee
declencheurs:
- participer à un débat en classe
- animer une discussion
- réagir à une opinion différente
- arbitrer un échange entre élèves
prerequis: []
essentiel: 'Un débat argumenté est un échange oral où plusieurs personnes défendent des opinions parfois différentes sur

  un même sujet. Participer à un débat, c''est exprimer son opinion avec des arguments, mais aussi écouter les

  autres et réagir à leurs propos sans les couper ni les insulter.


  Réagir à une opinion différente ne veut pas dire l''ignorer ou se fâcher : cela veut dire reformuler ce que

  l''autre a dit pour montrer qu''on l''a compris, puis expliquer en quoi on est d''accord ou pas d''accord, avec des

  arguments.


  Animer un débat, c''est donner la parole à tour de rôle, veiller à ce que chacun puisse s''exprimer, et recentrer

  la discussion si elle s''éloigne du sujet. Arbitrer, c''est vérifier que les règles du débat sont respectées

  (temps de parole, respect des personnes) sans donner son propre avis sur le sujet.

  '
methode:
- Écouter attentivement l'opinion de l'autre avant de répondre.
- Reformuler brièvement ce que l'autre a dit, pour montrer qu'on l'a compris.
- Exprimer son propre avis avec un argument précis, en expliquant pourquoi on est d'accord ou pas d'accord.
- Si l'on anime le débat, distribuer la parole à tour de rôle et recentrer la discussion si elle s'éloigne du sujet.
- Si l'on arbitre, rester neutre sur le sujet et vérifier seulement que les règles sont respectées.
vocabulaire:
- terme: animer un débat
  definition: distribuer la parole à tour de rôle et recentrer la discussion sur le sujet
- terme: arbitrer
  definition: vérifier que les règles d'un débat sont respectées, sans donner son propre avis sur le sujet
erreurs_frequentes:
- Couper la parole d'un camarade au lieu d'attendre son tour pour répondre.
- Répondre à une opinion différente par une attaque personnelle plutôt que par un argument.
- Confondre animer un débat (organiser la parole) et participer à un débat (défendre une opinion).
exemple:
  enonce: 'Un camarade dit : « Les téléphones devraient être interdits partout au collège. » Tu n''es pas complètement d''accord.
    Écris une réponse qui reformule son idée puis exprime ton désaccord avec un argument.'
  solution: Si je comprends bien, tu penses que les téléphones distraient trop les élèves. Je ne suis pas complètement d'accord,
    car un téléphone peut aussi servir d'outil pendant certains cours, par exemple pour chercher une information rapidement.
exercices:
- id: reconnaitre-reaction-argumentee
  type: choix
  difficulte: 1
  enonce: 'Pendant un débat, un camarade dit : « Le sport devrait être obligatoire tous les jours. » Quelle réponse est une
    réaction argumentée et respectueuse ?'
  reponse:
    options:
    - id: a
      texte: Je comprends ton idée, mais je pense que ce serait trop fatigant pour certains élèves qui ont d'autres activités
        le soir
    - id: b
      texte: N'importe quoi, tais-toi
    - id: c
      texte: Je m'en fiche complètement de ce sujet
    - id: d
      texte: Tu as toujours des idées bizarres
    bonnes:
    - a
  indices:
    relance: Est-ce que la réponse écoute l'autre et donne un argument, ou est-ce qu'elle attaque la personne ?
    methode: Une réaction argumentée montre qu'on a compris l'autre, puis explique un désaccord avec une raison précise, sans
      attaquer la personne.
    etape: Élimine d'abord les réponses qui attaquent la personne plutôt que l'idée.
  pieges:
  - si:
      contient:
      - b
    relance: Cette réponse attaque la personne sans donner d'argument. Que manque-t-il pour que ce soit une réaction argumentée
      ?
  - si:
      contient:
      - c
    relance: Cette réponse n'exprime aucune opinion sur le sujet du débat.
  - si:
      contient:
      - d
    relance: Cette réponse attaque la personne plutôt que de discuter de son idée sur le sport obligatoire.
  solution: La réponse a est une réaction argumentée car elle reconnaît l'idée de l'autre puis explique un désaccord avec
    une raison précise, sans attaquer la personne.
- id: mot-arbitrer
  type: texte_court
  difficulte: 2
  enonce: Quel verbe désigne le fait de vérifier que les règles d'un débat sont respectées (temps de parole, respect des personnes),
    sans donner son propre avis sur le sujet ?
  reponse:
    acceptees:
    - arbitrer
    fautes_tolerees: 1
  indices:
    relance: C'est le mot qu'on utilise aussi pour la personne neutre dans un match de sport.
    methode: Le mot commence par « arbi- » et se termine par « -trer ».
    etape: Pense à la personne, dans un match de football, qui siffle les fautes sans jouer elle-même.
  pieges:
  - si:
      valeur: animer
    relance: Animer consiste à distribuer la parole. Le mot cherché insiste plutôt sur le contrôle du respect des règles,
      en restant neutre sur le sujet.
  solution: 'Arbitrer : vérifier que les règles d''un débat sont respectées (temps de parole, respect des personnes), en restant
    neutre sur le sujet débattu.'
- id: etapes-reaction-debat
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour réagir à une opinion différente pendant un débat.
  reponse:
    elements:
    - id: a
      texte: J'écoute attentivement l'opinion de l'autre sans l'interrompre
    - id: b
      texte: Je reformule brièvement ce qu'il a dit pour montrer que j'ai compris
    - id: c
      texte: J'exprime mon propre avis avec un argument précis
    - id: d
      texte: J'explique en quoi je suis d'accord ou pas d'accord
  indices:
    relance: Quelle est la toute première chose à faire quand quelqu'un exprime une opinion différente de la tienne ?
    methode: On écoute d'abord, puis on reformule, puis on exprime son avis, puis on explique son accord ou son désaccord.
    etape: On commence toujours par écouter sans interrompre.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la réaction (écouter) et celle qui la ferme (expliquer son accord ou désaccord).
  solution: On écoute d'abord sans interrompre, puis on reformule, puis on exprime son avis, puis on explique son accord ou
    son désaccord.
- id: role-debat
  type: association
  difficulte: 3
  enonce: Relie chaque rôle dans un débat à sa fonction principale.
  reponse:
    gauche:
    - id: a
      texte: Un participant au débat
    - id: b
      texte: Celui qui anime le débat
    - id: c
      texte: Celui qui arbitre le débat
    droite:
    - id: x
      texte: Exprime une opinion argumentée et réagit aux autres opinions
    - id: y
      texte: Distribue la parole à tour de rôle et recentre la discussion sur le sujet
    - id: z
      texte: Vérifie que les règles (temps de parole, respect) sont suivies, sans donner son avis sur le sujet
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque rôle, demande-toi s'il défend une opinion, organise la parole, ou surveille les règles.
    methode: Le participant défend une opinion, l'animateur organise la parole, l'arbitre surveille les règles sans prendre
      parti.
    etape: Commence par le participant, le rôle le plus facile à repérer.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la fonction précise de chaque rôle.
  - si:
      diagnostic: associations_fausses
    relance: Repars du participant, qui défend une opinion, puis distingue animateur et arbitre.
  solution: Le participant défend une opinion argumentée. L'animateur distribue la parole et recentre le débat. L'arbitre
    vérifie le respect des règles, sans prendre parti sur le sujet.
- id: nblm-lors-d-un-debat-en-classe-que-signifie-e-1
  type: choix
  difficulte: 2
  enonce: Lors d'un débat en classe, que signifie exactement réagir à une opinion différente selon la fiche du cours ?
  reponse:
    options:
    - id: o1
      texte: Reformuler ce que l'autre a dit pour montrer qu'on l'a compris, puis expliquer son accord ou désaccord avec des
        arguments.
    - id: o2
      texte: Ignorer la remarque de son camarade et répéter immédiatement sa propre idée pour imposer sa position.
    - id: o3
      texte: Attaquer personnellement le camarade qui exprime une idée opposée pour le déstabiliser.
    - id: o4
      texte: Changer immédiatement d'avis pour éviter tout conflit avec les autres élèves de la classe.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'étape préalable indispensable avant d'exprimer ton propre point de vue face à un interlocuteur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : réagir nécessite de prendre en compte la parole de l''autre au lieu de la passer
      sous silence.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur typique : le débat d''idées porte sur les arguments et non sur les personnes.'
  - si:
      contient:
      - o4
    relance: Participer à un débat implique de défendre son opinion de manière argumentée tout en restant à l'écoute.
  solution: 'Reformuler ce que l''autre a dit pour montrer qu''on l''a compris, puis expliquer son accord ou désaccord avec
    des arguments. C''est la démarche préconisée : écouter, reformuler pour prouver sa compréhension, puis argumenter son
    point de vue.'
- id: nblm-en-classe-de-3e-quel-est-le-role-princip-2
  type: choix
  difficulte: 2
  enonce: En classe de 3e, quel est le rôle principal d'un élève qui anime un débat ?
  reponse:
    options:
    - id: o1
      texte: Distribuer la parole à tour de rôle et recentrer la discussion si elle s'éloigne du sujet.
    - id: o2
      texte: Donner systématiquement son avis personnel sur chaque argument présenté par les camarades.
    - id: o3
      texte: Sanctionner la discipline et donner des notes aux participants pendant l'échange.
    - id: o4
      texte: Rédiger seul le bilan écrit sans laisser les autres s'exprimer oralement.
    bonnes:
    - o1
  indices:
    relance: Pense aux fonctions d'organisation de la parole et de maintien du sujet principal.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Confondre animer (organiser la parole) et participer (défendre son opinion) est une erreur fréquente.
  - si:
      contient:
      - o3
    relance: L'élève animateur régule la discussion entre pairs mais n'a pas de rôle d'évaluation disciplinaire.
  - si:
      contient:
      - o4
    relance: Animer concerne la gestion de la parole orale collective pendant la séance.
  solution: Distribuer la parole à tour de rôle et recentrer la discussion si elle s'éloigne du sujet. L'animateur gère l'organisation
    des échanges pour assurer une prise de parole fluide et cadrée.
- id: nblm-quelle-est-la-responsabilite-essentielle-3
  type: choix
  difficulte: 2
  enonce: Quelle est la responsabilité essentielle de l'élève qui arbitre un échange entre élèves ?
  reponse:
    options:
    - id: o1
      texte: Vérifier que les règles du débat (temps de parole, respect) sont respectées, sans donner son propre avis.
    - id: o2
      texte: Déclarer qui a gagné le débat selon ses préférences personnelles.
    - id: o3
      texte: Couper la parole à tout le monde pour imposer sa propre opinion.
    - id: o4
      texte: Remplacer l'enseignant pour faire un cours de grammaire en direct.
    bonnes:
    - o1
  indices:
    relance: Considère la posture de neutralité nécessaire pour veiller au respect des règles et des personnes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'arbitre ne prend pas parti sur le fond du sujet et doit rester neutre vis-à-vis des opinions.
  - si:
      contient:
      - o3
    relance: L'arbitre garantit le temps de parole des autres et ne cherche pas à imposer sa voix.
  - si:
      contient:
      - o4
    relance: Le rôle de l'arbitre se limite au respect des règles du débat oral.
  solution: Vérifier que les règles du débat (temps de parole, respect) sont respectées, sans donner son propre avis. L'arbitre
    veille au respect du cadre et des règles du débat tout en conservant une parfaite neutralité.
- id: nblm-selon-les-attendus-du-programme-de-3e-co-4
  type: choix
  difficulte: 2
  enonce: Selon les attendus du programme de 3e, comment l'élève doit-il participer de façon constructive à un débat ?
  reponse:
    options:
    - id: o1
      texte: En exprimant une opinion argumentée et illustrée d'exemples, tout en travaillant sa posture et sa voix.
    - id: o2
      texte: En utilisant un vocabulaire familier et en coupant la parole pour être certain d'être entendu.
    - id: o3
      texte: En se contentant de dire 'je suis d'accord' ou 'c'est nul' sans justification.
    - id: o4
      texte: En lisant un texte écrit à l'avance sans jamais regarder ses camarades ni réagir à ce qu'ils disent.
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments qui distinguent une simple réaction spontanée d'une prise de parole orale argumentée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'oral scolaire exige un niveau de langue adapté et le respect strict du tour de parole.
  - si:
      contient:
      - o3
    relance: Donner un avis sans explication ne constitue pas une opinion argumentée.
  - si:
      contient:
      - o4
    relance: Le débat oral demande une écoute active et une interaction en direct avec l'auditoire.
  solution: En exprimant une opinion argumentée et illustrée d'exemples, tout en travaillant sa posture et sa voix. Les programmes
    attendent des arguments étayés d'exemples, une voix posée et une attitude expressive adaptée.
- id: nblm-parmi-les-attitudes-suivantes-laquelle-r-5
  type: choix
  difficulte: 2
  enonce: Parmi les attitudes suivantes, laquelle représente une erreur fréquente lors d'un débat argumenté ?
  reponse:
    options:
    - id: o1
      texte: Répondre à une opinion différente par une attaque personnelle plutôt que par un argument.
    - id: o2
      texte: Poser clairement la problématique au début de la discussion lorsqu'on anime.
    - id: o3
      texte: Utiliser des modalisateurs pour nuancer son propos et des connecteurs pour l'organiser.
    - id: o4
      texte: Distribuer la parole de manière équitable et impartiale entre les camarades.
    bonnes:
    - o1
  indices:
    relance: Identifie le comportement négatif qui altère la qualité d'un échange constructif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est au contraire une excellente pratique attendue de l'élève qui anime.
  - si:
      contient:
      - o3
    relance: C'est une qualité d'expression orale vivement recommandée.
  - si:
      contient:
      - o4
    relance: C'est l'objectif clé d'une bonne animation de débat.
  solution: 'Répondre à une opinion différente par une attaque personnelle plutôt que par un argument. Il s''agit d''un travers
    fréquent : le débat doit cibler l''idée défendue et non la personne.'
- id: nblm-quelles-sont-les-deux-actions-qui-caract-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux actions qui caractérisent un élève qui anime un débat avec efficacité ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Poser clairement la problématique du débat dès le début de la séance.
    - id: o2
      texte: Distribuer la parole de manière équitable et impartiale pour que chacun s'exprime.
    - id: o3
      texte: Confondre la gestion du débat avec la défense exclusive de ses propres convictions.
    - id: o4
      texte: Laisser la discussion s'éloigner du sujet sans jamais intervenir.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les deux missions d'organisation et de cadrage attribuées à l'animateur du débat.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est une erreur fréquente : l''animateur ne doit pas monopoliser l''échange pour imposer son avis.'
  - si:
      contient:
      - o4
    relance: L'animateur a pour devoir de recentrer le débat dès que les propos s'écartent du thème.
  solution: Poser clairement la problématique du débat dès le début de la séance ; Distribuer la parole de manière équitable
    et impartiale pour que chacun s'exprime. Animer un débat commence par l'explication claire du sujet et de ses enjeux.
- id: nblm-complete-la-phrase-avant-d-expliquer-pou-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : Avant d''expliquer pourquoi on est d''accord ou pas d''accord avec un camarade, il faut d''abord
    _____ ce qu''il a dit pour montrer qu''on l''a compris.'
  reponse:
    acceptees:
    - reformuler
    fautes_tolerees: 1
  indices:
    relance: Action d'exprimer avec ses propres mots la pensée que l'interlocuteur vient de manifester.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: reformuler. Reformuler permet de prouver son écoute et d'éviter les malentendus avant de contre-argumenter.
- id: nblm-complete-la-phrase-l-eleve-charge-d-un-d-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : L''élève chargé d''_____ un débat veille au respect des règles et du temps de parole, sans
    donner son propre avis.'
  reponse:
    acceptees:
    - arbitrer
    fautes_tolerees: 1
  indices:
    relance: Verbe désignant l'action d'assurer le respect du règlement d'un échange sans prendre parti.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: arbitrer. Arbitrer consiste à garantir le respect du cadre du débat en restant neutre sur le fond.
