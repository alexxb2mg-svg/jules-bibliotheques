# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: debat-argumente
version: 2
etat: generee
declencheurs:
- participer à un débat en classe
- animer une discussion
- réagir à une opinion différente
- arbitrer un échange entre élèves
- donner mon avis avec des arguments
- débat sur un sujet de société
- tour de parole
- répondre poliment à un désaccord
prerequis: []
essentiel: |-
  Un débat argumenté est un échange oral organisé sur une question qui fait discuter (« Faut-il interdire les téléphones au collège ? »). Chacun défend une opinion, l'explique et écoute celle des autres. Le but n'est pas de « gagner », mais de mieux comprendre la question.

  Exprimer une opinion argumentée : on donne son opinion (la thèse), puis au moins un argument (une raison), souvent un exemple. « Je pense que les devoirs devraient être limités, car les élèves ont aussi besoin de repos. Par exemple, après une longue journée, beaucoup sont fatigués. » Une opinion sans argument (« C'est nul ») ne suffit pas.

  On relie les idées avec des connecteurs : car, parce que (cause) ; donc, c'est pourquoi (conséquence) ; par exemple (illustration) ; mais, cependant, en revanche (opposition) ; d'abord, ensuite, enfin (ordre). On nuance son avis avec des modalisateurs : je pense que, il me semble que, peut-être, sans doute, certainement.

  Réagir à une opinion différente :
  1) écouter sans couper la parole ;
  2) reformuler (« Si je comprends bien, tu penses que... ») ;
  3) dire son accord ou son désaccord, même partiel (« Je suis d'accord avec toi sur ce point, mais... ») ;
  4) donner son argument.
  On critique une idée, jamais la personne.

  Animer un débat : présenter le sujet, donner la parole à tour de rôle, faire respecter le temps de parole, relancer si le débat s'essouffle, recentrer si on s'éloigne du sujet, conclure en résumant les points de vue.

  Arbitrer un débat : vérifier que les règles sont respectées (tour de parole, temps de parole, respect des personnes) sans donner son avis sur le sujet. L'animateur organise la parole ; l'arbitre veille aux règles. Ces rôles peuvent être tenus par des élèves de la classe.

  Ce qu'on attend : une prise de parole claire, argumentée et respectueuse, une écoute réelle des autres, et la capacité de tenir un rôle d'animateur ou d'arbitre.
methode:
- Écouter attentivement l'opinion de l'autre avant de répondre, sans couper la parole.
- Reformuler brièvement ce que l'autre a dit, pour montrer qu'on l'a compris.
- Exprimer son avis avec au moins un argument précis, relié par un connecteur (car, donc, par exemple).
- Nuancer si besoin avec un modalisateur (il me semble que, peut-être) ; critiquer l'idée, jamais la personne.
- 'Si l''on anime : présenter le sujet, donner la parole à tour de rôle, recentrer, conclure.'
- 'Si l''on arbitre : rester neutre sur le sujet et vérifier seulement que les règles sont respectées.'
vocabulaire:
- terme: animer un débat
  definition: distribuer la parole à tour de rôle et recentrer la discussion sur le sujet
- terme: arbitrer
  definition: vérifier que les règles d'un débat sont respectées, sans donner son propre avis sur le sujet
- terme: argument
  definition: raison donnée pour soutenir une opinion
- terme: opinion
  definition: avis personnel sur une question, qui doit être expliqué par des arguments
- terme: reformuler
  definition: redire avec ses propres mots ce que l'autre a dit, pour montrer qu'on l'a compris
- terme: connecteur
  definition: mot qui relie des idées et indique un lien logique (cause, conséquence, opposition...)
- terme: modalisateur
  definition: mot ou expression qui nuance un avis (peut-être, il me semble que)
erreurs_frequentes:
- Couper la parole d'un camarade au lieu d'attendre son tour pour répondre.
- Répondre à une opinion différente par une attaque personnelle plutôt que par un argument.
- Confondre animer un débat (organiser la parole) et participer à un débat (défendre une opinion).
- Donner une opinion sans argument (« c'est nul », « je suis contre »).
- 'Croire que l''arbitre doit défendre un camp : il vérifie seulement les règles.'
exemple:
  enonce: 'Un camarade dit : « Les téléphones devraient être interdits partout au collège. » Tu n''es pas complètement d''accord. Écris une réponse qui reformule son idée puis exprime ton désaccord avec un argument.'
  solution: Si je comprends bien, tu penses que les téléphones distraient trop les élèves. Je ne suis pas complètement d'accord, car un téléphone peut aussi servir d'outil pendant certains cours, par exemple pour chercher une information rapidement.
exercices:
- id: reconnaitre-reaction-argumentee
  type: choix
  difficulte: 1
  enonce: 'Pendant un débat, un camarade dit : « Le sport devrait être obligatoire tous les jours. » Quelle réponse est une réaction argumentée et respectueuse ?'
  reponse:
    options:
    - id: a
      texte: Je comprends ton idée, mais je pense que ce serait trop fatigant pour certains élèves qui ont d'autres activités le soir
    - id: b
      texte: N'importe quoi, tais-toi
    - id: c
      texte: Je m'en fiche complètement de ce sujet
    - id: d
      texte: Tu as toujours des idées bizarres
    bonnes:
    - a
  indices:
    relance: Est-ce que la réponse écoute l'autre et donne un argument, ou est-ce qu'elle attaque la personne ?
    methode: Une réaction argumentée montre qu'on a compris l'autre, puis explique un désaccord avec une raison précise, sans attaquer la personne.
    etape: Élimine d'abord les réponses qui attaquent la personne plutôt que l'idée.
  pieges:
  - si:
      contient:
      - b
    relance: Cette réponse attaque la personne sans donner d'argument. Que manque-t-il pour que ce soit une réaction argumentée ?
  - si:
      contient:
      - c
    relance: Cette réponse n'exprime aucune opinion sur le sujet du débat.
  - si:
      contient:
      - d
    relance: Cette réponse attaque la personne plutôt que de discuter de son idée sur le sport obligatoire.
  solution: La réponse a est une réaction argumentée car elle reconnaît l'idée de l'autre puis explique un désaccord avec une raison précise, sans attaquer la personne.
- id: mot-arbitrer
  type: texte_court
  difficulte: 2
  enonce: Quel verbe désigne le fait de vérifier que les règles d'un débat sont respectées (temps de parole, respect des personnes), sans donner son propre avis sur le sujet ?
  reponse:
    acceptees:
    - arbitrer
    fautes_tolerees: 1
  indices:
    relance: C'est le mot qu'on utilise aussi pour la personne neutre dans un match de sport.
    methode: Le mot commence par « arbi- » et se termine par « -trer ».
    etape: Pense à la personne, dans un match de football, qui siffle les fautes sans jouer elle-même.
  pieges:
  - si:
      valeur: animer
    relance: Animer consiste à distribuer la parole. Le mot cherché insiste plutôt sur le contrôle du respect des règles, en restant neutre sur le sujet.
  solution: 'Arbitrer : vérifier que les règles d''un débat sont respectées (temps de parole, respect des personnes), en restant neutre sur le sujet débattu.'
- id: etapes-reaction-debat
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour réagir à une opinion différente pendant un débat.
  reponse:
    elements:
    - id: a
      texte: J'écoute attentivement l'opinion de l'autre sans l'interrompre
    - id: b
      texte: Je reformule brièvement ce qu'il a dit pour montrer que j'ai compris
    - id: c
      texte: J'exprime mon propre avis avec un argument précis
    - id: d
      texte: J'explique en quoi je suis d'accord ou pas d'accord
  indices:
    relance: Quelle est la toute première chose à faire quand quelqu'un exprime une opinion différente de la tienne ?
    methode: On écoute d'abord, puis on reformule, puis on exprime son avis, puis on explique son accord ou son désaccord.
    etape: On commence toujours par écouter sans interrompre.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la réaction (écouter) et celle qui la ferme (expliquer son accord ou désaccord).
  solution: On écoute d'abord sans interrompre, puis on reformule, puis on exprime son avis, puis on explique son accord ou son désaccord.
- id: role-debat
  type: association
  difficulte: 3
  enonce: Relie chaque rôle dans un débat à sa fonction principale.
  reponse:
    gauche:
    - id: a
      texte: Un participant au débat
    - id: b
      texte: Celui qui anime le débat
    - id: c
      texte: Celui qui arbitre le débat
    droite:
    - id: x
      texte: Exprime une opinion argumentée et réagit aux autres opinions
    - id: y
      texte: Distribue la parole à tour de rôle et recentre la discussion sur le sujet
    - id: z
      texte: Vérifie que les règles (temps de parole, respect) sont suivies, sans donner son avis sur le sujet
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque rôle, demande-toi s'il défend une opinion, organise la parole, ou surveille les règles.
    methode: Le participant défend une opinion, l'animateur organise la parole, l'arbitre surveille les règles sans prendre parti.
    etape: Commence par le participant, le rôle le plus facile à repérer.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la fonction précise de chaque rôle.
  - si:
      diagnostic: associations_fausses
    relance: Repars du participant, qui défend une opinion, puis distingue animateur et arbitre.
  solution: Le participant défend une opinion argumentée. L'animateur distribue la parole et recentre le débat. L'arbitre vérifie le respect des règles, sans prendre parti sur le sujet.
- id: distinguer-argument-opinion
  type: choix
  difficulte: 1
  enonce: Quelle prise de parole contient une opinion ET un argument ?
  reponse:
    options:
    - id: a
      texte: Je suis contre.
    - id: b
      texte: Je suis contre les devoirs le week-end, car les élèves ont besoin de se reposer.
    - id: c
      texte: Les devoirs, c'est nul.
    - id: d
      texte: Tout le monde pense comme moi.
    bonnes:
    - b
  indices:
    relance: Cherche la phrase qui donne une raison, pas seulement un avis.
    methode: Un argument répond à la question « pourquoi ? ». Il est souvent introduit par un mot comme « car » ou « parce que ».
    etape: Quelle phrase explique pourquoi son auteur est contre ?
  pieges:
  - si:
      contient:
      - a
    relance: Cette phrase donne un avis mais aucune raison. Où est le « pourquoi » ?
  - si:
      contient:
      - c
    relance: Cette phrase exprime un jugement sans l'expliquer.
  - si:
      contient:
      - d
    relance: Dire que tout le monde pense pareil n'est pas une raison précise.
  solution: La phrase b donne l'opinion (contre les devoirs le week-end) et l'argument (le besoin de repos).
- id: connecteurs-debat
  type: association
  difficulte: 2
  enonce: Relie chaque connecteur à ce qu'il permet d'exprimer dans un débat.
  reponse:
    gauche:
    - id: a
      texte: car
    - id: b
      texte: par exemple
    - id: c
      texte: cependant
    - id: d
      texte: donc
    droite:
    - id: w
      texte: donner une cause, une raison
    - id: x
      texte: illustrer une idée
    - id: y
      texte: marquer une opposition
    - id: z
      texte: indiquer une conséquence
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Pour chaque mot, imagine une phrase où tu l'utilises et vois ce qu'il relie.
    methode: « Car » explique pourquoi ; « donc » annonce ce qui en résulte ; « cependant » corrige ou contredit ; « par exemple » donne un cas précis.
    etape: Commence par « cependant », qui s'oppose à ce qui précède.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien la cause (pourquoi) et la conséquence (ce qui en résulte).
  - si:
      diagnostic: associations_fausses
    relance: Repars du mot qui marque l'opposition, puis distingue cause et conséquence.
  solution: 'Car : cause. Par exemple : illustration. Cependant : opposition. Donc : conséquence.'
- id: situation-animateur
  type: choix
  difficulte: 2
  enonce: Dans un débat, deux élèves parlent en même temps et un troisième n'a pas encore pu s'exprimer. Que doit faire l'animateur ?
  reponse:
    options:
    - id: a
      texte: Donner son propre avis sur le sujet pour trancher
    - id: b
      texte: Rétablir le tour de parole et donner la parole à l'élève qui n'a pas encore parlé
    - id: c
      texte: Exclure les deux élèves qui parlent en même temps
    - id: d
      texte: Arrêter le débat et laisser la classe partir
    bonnes:
    - b
  indices:
    relance: Le rôle de l'animateur est d'organiser la parole.
    methode: L'animateur distribue la parole à tour de rôle et veille à ce que chacun puisse s'exprimer.
    etape: Cherche la réponse qui organise la parole sans prendre parti.
  pieges:
  - si:
      contient:
      - a
    relance: 'L''animateur ne défend pas d''opinion : il organise le débat. Que doit-il organiser ?'
  - si:
      contient:
      - c
    relance: Exclure est une sanction disproportionnée. L'animateur commence par rétablir l'ordre de la parole.
  - si:
      contient:
      - d
    relance: Arrêter le débat ne règle pas le problème du tour de parole.
  solution: L'animateur rétablit le tour de parole et donne la parole à celui qui n'a pas encore parlé, sans donner son avis.
- id: reaction-argumentee-redaction
  type: ouverte
  difficulte: 3
  enonce: 'Un camarade affirme : « Les élèves devraient pouvoir choisir toutes leurs matières. » Écris (5 à 7 lignes) l''intervention que tu ferais dans un débat : reformule son idée, exprime ton accord ou ton désaccord et justifie-le avec deux arguments, dont un exemple.'
  criteres:
  - L'élève reformule correctement l'idée du camarade avant de réagir.
  - L'élève exprime clairement son opinion (accord, désaccord ou accord partiel) et la justifie par deux arguments dont un exemple, reliés par des connecteurs.
  - Le ton reste respectueux (aucune attaque personnelle) et le niveau de langue convient à un débat en classe.
  indices:
    relance: Que dois-tu faire avant de donner ton avis ?
    methode: 'Suis les étapes : reformuler, donner son avis, argumenter avec un exemple, garder un ton respectueux.'
    etape: Tu peux commencer par « Si je comprends bien, tu penses que... »
  solution: 'Exemple : Si je comprends bien, tu penses que chacun devrait tout choisir. Je ne suis pas d''accord, car certaines matières, comme les mathématiques, sont utiles à tous. Par exemple, savoir calculer sert dans la vie de tous les jours. En revanche, je suis d''accord pour laisser un choix limité, donc des options.'
