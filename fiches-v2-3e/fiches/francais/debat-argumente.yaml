- id: distinguer-argument-opinion
  type: choix
  difficulte: 1
  enonce: Quelle prise de parole contient une opinion ET un argument ?
  reponse:
    options:
    - id: a
      texte: Je suis contre.
    - id: b
      texte: Je suis contre les devoirs le week-end, car les élèves ont besoin de se reposer.
    - id: c
      texte: Les devoirs, c'est nul.
    - id: d
      texte: Tout le monde pense comme moi.
    bonnes:
    - b
  indices:
    relance: Cherche la phrase qui donne une raison, pas seulement un avis.
    methode: Un argument répond à la question « pourquoi ? ». Il est souvent introduit par un mot comme « car » ou « parce
      que ».
    etape: Quelle phrase explique pourquoi son auteur est contre ?
  pieges:
  - si:
      contient:
      - a
    relance: Cette phrase donne un avis mais aucune raison. Où est le « pourquoi » ?
  - si:
      contient:
      - c
    relance: Cette phrase exprime un jugement sans l'expliquer.
  - si:
      contient:
      - d
    relance: Dire que tout le monde pense pareil n'est pas une raison précise.
  solution: La phrase b donne l'opinion (contre les devoirs le week-end) et l'argument (le besoin de repos).
- id: connecteurs-debat
  type: association
  difficulte: 2
  enonce: Relie chaque connecteur à ce qu'il permet d'exprimer dans un débat.
  reponse:
    gauche:
    - id: a
      texte: car
    - id: b
      texte: par exemple
    - id: c
      texte: cependant
    - id: d
      texte: donc
    droite:
    - id: w
      texte: donner une cause, une raison
    - id: x
      texte: illustrer une idée
    - id: y
      texte: marquer une opposition
    - id: z
      texte: indiquer une conséquence
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Pour chaque mot, imagine une phrase où tu l'utilises et vois ce qu'il relie.
    methode: « Car » explique pourquoi ; « donc » annonce ce qui en résulte ; « cependant » corrige ou contredit ; « par exemple
      » donne un cas précis.
    etape: Commence par « cependant », qui s'oppose à ce qui précède.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien la cause (pourquoi) et la conséquence (ce qui en résulte).
  - si:
      diagnostic: associations_fausses
    relance: Repars du mot qui marque l'opposition, puis distingue cause et conséquence.
  solution: 'Car : cause. Par exemple : illustration. Cependant : opposition. Donc : conséquence.'
- id: situation-animateur
  type: choix
  difficulte: 2
  enonce: Dans un débat, deux élèves parlent en même temps et un troisième n'a pas encore pu s'exprimer. Que doit faire l'animateur
    ?
  reponse:
    options:
    - id: a
      texte: Donner son propre avis sur le sujet pour trancher
    - id: b
      texte: Rétablir le tour de parole et donner la parole à l'élève qui n'a pas encore parlé
    - id: c
      texte: Exclure les deux élèves qui parlent en même temps
    - id: d
      texte: Arrêter le débat et laisser la classe partir
    bonnes:
    - b
  indices:
    relance: Le rôle de l'animateur est d'organiser la parole.
    methode: L'animateur distribue la parole à tour de rôle et veille à ce que chacun puisse s'exprimer.
    etape: Cherche la réponse qui organise la parole sans prendre parti.
  pieges:
  - si:
      contient:
      - a
    relance: 'L''animateur ne défend pas d''opinion : il organise le débat. Que doit-il organiser ?'
  - si:
      contient:
      - c
    relance: Exclure est une sanction disproportionnée. L'animateur commence par rétablir l'ordre de la parole.
  - si:
      contient:
      - d
    relance: Arrêter le débat ne règle pas le problème du tour de parole.
  solution: L'animateur rétablit le tour de parole et donne la parole à celui qui n'a pas encore parlé, sans donner son avis.
- id: reaction-argumentee-redaction
  type: ouverte
  difficulte: 3
  enonce: 'Un camarade affirme : « Les élèves devraient pouvoir choisir toutes leurs matières. » Écris (5 à 7 lignes) l''intervention
    que tu ferais dans un débat : reformule son idée, exprime ton accord ou ton désaccord et justifie-le avec deux arguments,
    dont un exemple.'
  criteres:
  - L'élève reformule correctement l'idée du camarade avant de réagir.
  - L'élève exprime clairement son opinion (accord, désaccord ou accord partiel) et la justifie par deux arguments dont un
    exemple, reliés par des connecteurs.
  - Le ton reste respectueux (aucune attaque personnelle) et le niveau de langue convient à un débat en classe.
  indices:
    relance: Que dois-tu faire avant de donner ton avis ?
    methode: 'Suis les étapes : reformuler, donner son avis, argumenter avec un exemple, garder un ton respectueux.'
    etape: Tu peux commencer par « Si je comprends bien, tu penses que... »
  solution: 'Exemple : Si je comprends bien, tu penses que chacun devrait tout choisir. Je ne suis pas d''accord, car certaines
    matières, comme les mathématiques, sont utiles à tous. Par exemple, savoir calculer sert dans la vie de tous les jours.
    En revanche, je suis d''accord pour laisser un choix limité, donc des options.'
