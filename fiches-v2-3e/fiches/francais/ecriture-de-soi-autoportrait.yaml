format: 2
notion: ecriture-de-soi-autoportrait
version: 2
etat: verifiee
declencheurs:
- raconter sa propre vie
- écrire son journal intime
- faire son autoportrait
- parler de son enfance dans un livre
- se raconter dans un livre
- récit de sa propre vie
- lettres qu'un auteur écrit
- portrait de soi en peinture
prerequis: []
essentiel: 'L''écriture de soi rassemble les textes où un auteur parle de lui-même, de sa vie ou de sa personnalité. Le programme
  de 3e demande de découvrir différentes formes de cette écriture et de comprendre pourquoi on se raconte ou on se représente.


  Les formes à connaître : l''autobiographie raconte la vie de l''auteur, écrite par lui-même après coup, à la première personne.
  Les mémoires racontent surtout les événements publics dont l''auteur a été témoin ou acteur. Le journal intime note, jour
  après jour, ce que l''on pense et vit, sans savoir la suite. La correspondance est un ensemble de lettres où l''on se confie.
  L''autoportrait est un portrait de soi, en mots ou en image (peinture, dessin). L''essai peut devenir une réflexion sur
  soi.


  Dans l''autobiographie, l''auteur, le narrateur et le personnage principal sont la même personne. On appelle parfois « pacte
  autobiographique » l''engagement de l''auteur à dire la vérité sur sa vie.


  Repères : au XVIe siècle, Montaigne écrit Les Essais, où il se peint lui-même et réfléchit sur l''homme. Au XVIIIe siècle,
  Rousseau écrit Les Confessions, publiées après sa mort (1782 et 1789). Au XIXe siècle, Chateaubriand rédige Les Mémoires
  d''outre-tombe, publiées après sa mort. Au XXe siècle, Sartre écrit Les Mots (1964) sur son enfance, et Le Journal d''Anne
  Frank est un célèbre journal intime.


  Pourquoi se raconter ? Pour se comprendre, se justifier, garder une trace, transmettre une expérience. Se raconter est un
  effort de vérité. Mais on ne peut pas tout dire : l''auteur choisit, organise, embellit parfois, et écrit après les faits,
  avec le recul. Un récit de soi est donc aussi une construction.


  Ce qu''on attend au brevet : reconnaître la forme d''un texte, expliquer pourquoi l''auteur se raconte, et montrer que le
  récit est à la fois recherche de vérité et composition.

  '
methode:
- 'Repérer qui parle : l''auteur, le narrateur et le personnage sont-ils la même personne ? Cherche les marques de la 1re
  personne (je, mon, moi).'
- 'Identifier la forme du texte : autobiographie, mémoires, journal intime, lettre, autoportrait.'
- 'Relever le moment de l''écriture : sur le vif (journal) ou après coup, avec du recul (autobiographie, mémoires).'
- Chercher ce que l'auteur veut comprendre, prouver ou transmettre en se racontant.
- 'Se demander si le texte est sincère, flatteur ou critique : que choisit-il de dire, de cacher, de mettre en valeur ?'
- Conclure sur l'effort de vérité et sur la façon dont le texte est composé.
vocabulaire:
- terme: autobiographie
  definition: récit de la vie d'une personne, écrit par elle-même
- terme: mémoires
  definition: récit qu'un auteur fait de sa vie, souvent tourné vers les événements publics qu'il a vécus
- terme: journal intime
  definition: texte où l'on note, jour après jour, ses pensées et les événements de sa vie
- terme: correspondance
  definition: ensemble de lettres échangées entre des personnes
- terme: autoportrait
  definition: portrait qu'une personne fait d'elle-même, en mots ou en image
- terme: essai
  definition: texte libre où un auteur réfléchit sur un sujet en donnant son point de vue
- terme: pacte autobiographique
  definition: engagement de l'auteur à dire la vérité sur sa vie
- terme: narrateur
  definition: celui qui raconte l'histoire dans un texte
erreurs_frequentes:
- Confondre l'auteur et un simple narrateur de fiction, alors que dans l'écriture de soi les deux ne font qu'un.
- Croire qu'un texte autobiographique dit toute la vérité sans aucun choix de l'auteur.
- Oublier que les mémoires et l'autobiographie sont écrites après les faits racontés, pas au moment même.
- Confondre autobiographie (la vie de l'auteur) et biographie (la vie d'un autre racontée par quelqu'un d'autre).
- Confondre journal intime, écrit au jour le jour, et mémoires, écrites avec du recul.
exemple:
  enonce: Explique en deux phrases pourquoi Les Confessions de Rousseau sont considérées comme une des premières autobiographies.
  solution: Rousseau y raconte sa propre vie, de son enfance à l'âge adulte, en cherchant à tout dire, y compris ses fautes.
    Le livre est publié après sa mort, en 1782 puis en 1789.
exercices:
- id: titre-montaigne
  type: choix
  difficulte: 1
  enonce: Quel est le titre du livre où Montaigne se peint lui-même et réfléchit sur l'homme en général ?
  reponse:
    options:
    - id: a
      texte: Les Essais
    - id: b
      texte: Les Confessions
    - id: c
      texte: Les Caractères
    - id: d
      texte: Candide
    bonnes:
    - a
  indices:
    relance: Cet auteur vit au XVIe siècle et donne son nom à un genre littéraire encore utilisé aujourd'hui.
    methode: Le titre du livre est aussi le nom d'un genre littéraire où l'auteur réfléchit librement, par petits textes.
    etape: Le titre commence par « Les E... ».
  pieges:
  - si:
      contient:
      - b
    relance: Ce titre est celui de Rousseau, un siècle plus tard. Cherche le titre du XVIe siècle.
  - si:
      contient:
      - c
    relance: Ce titre est celui de La Bruyère, qui peint la société de son temps, pas sa propre vie.
  - si:
      contient:
      - d
    relance: C'est un conte de Voltaire, pas un texte sur la vie de son auteur.
  solution: Montaigne écrit Les Essais, où il s'interroge sur lui-même et sur l'homme en général.
- id: auteur-confessions
  type: texte_court
  difficulte: 2
  enonce: Quel est le nom de famille de l'auteur des Confessions, autobiographie publiée après sa mort au XVIIIe siècle ?
  reponse:
    acceptees:
    - rousseau
    fautes_tolerees: 1
  indices:
    relance: Cet écrivain est aussi philosophe. Il a vécu au XVIIIe siècle et a beaucoup réfléchi à l'éducation et à la nature.
    methode: Cherche le nom d'un philosophe des Lumières qui a aussi écrit sur sa propre vie.
    etape: Son prénom est Jean-Jacques.
  pieges:
  - si:
      valeur: montaigne
    relance: Montaigne vit au XVIe siècle et écrit Les Essais, pas Les Confessions.
  - si:
      valeur: chateaubriand
    relance: Chateaubriand écrit ses Mémoires d'outre-tombe, pas Les Confessions.
  solution: Il s'agit de Jean-Jacques Rousseau, dont les Confessions sont publiées après sa mort, en 1782 puis en 1789.
- id: chronologie-oeuvres
  type: ordre
  difficulte: 2
  enonce: Range ces trois oeuvres de l'écriture de soi de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: essais
      texte: Les Essais de Montaigne
    - id: confessions
      texte: Les Confessions de Rousseau
    - id: memoires
      texte: Les Mémoires d'outre-tombe de Chateaubriand
  indices:
    relance: Laquelle de ces oeuvres est écrite la première, au XVIe siècle ?
    methode: Range d'abord l'oeuvre du XVIe siècle, puis celle du XVIIIe siècle, puis celle du XIXe siècle.
    etape: Montaigne écrit au XVIe siècle, avant les deux autres auteurs.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux oeuvres voisines dans le temps sont inversées. Laquelle des deux est écrite en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'oeuvre la plus ancienne, du XVIe siècle, puis la plus récente, du XIXe siècle.
  solution: Les Essais de Montaigne datent du XVIe siècle, Les Confessions de Rousseau sont écrites au XVIIIe siècle, et Les
    Mémoires d'outre-tombe de Chateaubriand sont rédigées au XIXe siècle.
- id: auteur-oeuvre
  type: association
  difficulte: 2
  enonce: Associe chaque auteur au titre de son oeuvre autobiographique.
  reponse:
    gauche:
    - id: a
      texte: Montaigne
    - id: b
      texte: Rousseau
    - id: c
      texte: Chateaubriand
    droite:
    - id: x
      texte: Les Essais
    - id: y
      texte: Les Confessions
    - id: z
      texte: Les Mémoires d'outre-tombe
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces auteurs vit au XVIe siècle, un autre au XVIIIe siècle, et le dernier au XIXe siècle.
    methode: Retrouve d'abord le titre de l'auteur le plus ancien, puis celui du XVIIIe siècle, puis celui du XIXe siècle.
    etape: 'Montaigne écrit au XVIe siècle : associe-le à Les Essais. Range ensuite les deux autres auteurs selon leur siècle.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout les deux auteurs les plus proches dans le temps.
  - si:
      diagnostic: associations_fausses
    relance: Reprends un auteur à la fois, en te souvenant de son siècle.
  solution: Montaigne écrit Les Essais, Rousseau écrit Les Confessions, Chateaubriand écrit Les Mémoires d'outre-tombe.
- id: pourquoi-se-raconter
  type: ouverte
  difficulte: 3
  enonce: Explique en quelques phrases pourquoi un auteur peut choisir de raconter sa propre vie, et donne un exemple d'oeuvre
    étudiée en classe.
  criteres:
  - L'élève cite une forme de l'écriture de soi (autobiographie, mémoires, journal intime ou correspondance).
  - L'élève explique une raison de se raconter (comprendre sa vie, se justifier, garder une trace, transmettre une expérience).
  - L'élève donne un exemple précis d'auteur ou d'oeuvre vu en classe.
  indices:
    relance: Pourquoi quelqu'un voudrait-il expliquer sa propre vie aux autres ?
    methode: Pense à un texte étudié en classe qui parle de la vie de son auteur, et demande-toi ce que cet auteur cherche
      à faire comprendre.
    etape: Commence par nommer la forme du texte (autobiographie, journal, mémoires...), puis explique une raison de se raconter.
  solution: Par exemple, dans Les Confessions, Rousseau raconte sa vie depuis son enfance pour être compris et jugé tel qu'il
    est vraiment, avec ses qualités et ses fautes.
- id: nblm-dans-un-texte-relevant-de-l-ecriture-de-1
  type: choix
  difficulte: 2
  enonce: Dans un texte relevant de l'écriture de soi (comme l'autobiographie), quelle est la particularité essentielle concernant
    l'auteur, le narrateur et le personnage principal ?
  reponse:
    options:
    - id: o1
      texte: L'auteur, le narrateur et le personnage principal ne font qu'un.
    - id: o2
      texte: L'auteur invente un narrateur fictif distinct de lui-même.
    - id: o3
      texte: Le personnage principal doit obligatoirement être un personnage fictif.
    - id: o4
      texte: Le narrateur s'exprime uniquement à la troisième personne du pluriel.
    bonnes:
    - o1
  indices:
    relance: Pense à l'identité de la personne qui écrit, de celle qui raconte et de celle dont parle le texte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : confondre l''auteur réel et un narrateur de fiction. Dans l''autobiographie, l''auteur raconte
      sa propre vie.'
  - si:
      contient:
      - o3
    relance: 'Faux : le personnage principal est l''auteur lui-même, il ne s''agit pas d''un personnage d''invention.'
  - si:
      contient:
      - o4
    relance: 'Faux : le récit de soi s''écrit principalement à la première personne du singulier (« je »).'
  solution: 'L''auteur, le narrateur et le personnage principal ne font qu''un. C''est exact : dans l''écriture de soi, la
    même personne réelle écrit (auteur), raconte (narrateur) et constitue le sujet du récit (personnage principal).'
- id: nblm-quelle-est-la-caracteristique-principale-2
  type: choix
  difficulte: 2
  enonce: Quelle est la caractéristique principale du journal intime par rapport à une autobiographie rédigée à la fin de
    sa vie ?
  reponse:
    options:
    - id: o1
      texte: Il permet de noter ses pensées jour après jour, sans savoir ce qui va suivre.
    - id: o2
      texte: Il est composé de lettres envoyées régulièrement à un destinataire réel.
    - id: o3
      texte: Il est toujours écrit par un narrateur entièrement fictif inventé par un romancier.
    - id: o4
      texte: Il est rédigé des décennies plus tard pour retracer uniquement la grande Histoire.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au rythme d'écriture au quotidien et au fait de ne pas connaître le futur au moment où l'on écrit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la rédaction de lettres adressées à quelqu''un définit la correspondance, pas le journal intime.'
  - si:
      contient:
      - o3
    relance: 'Faux : un journal intime authentique est une forme d''écriture de soi où l''auteur note ses propres pensées.'
  - si:
      contient:
      - o4
    relance: 'Erreur : un récit rédigé très longtemps après et centré sur les événements publics correspond aux mémoires.'
  solution: 'Il permet de noter ses pensées jour après jour, sans savoir ce qui va suivre. Exact : le journal intime est rédigé
    au quotidien, au fil des événements, sans connaître l''avenir.'
- id: nblm-comment-definit-on-la-notion-d-autoportr-3
  type: choix
  difficulte: 2
  enonce: Comment définit-on la notion d'autoportrait en littérature et dans les arts ?
  reponse:
    options:
    - id: o1
      texte: C'est le portrait qu'un artiste ou un auteur fait de lui-même.
    - id: o2
      texte: C'est la biographie d'un roi écrite par un historien neutre.
    - id: o3
      texte: C'est la description objective d'un paysage naturel sans présence humaine.
    - id: o4
      texte: C'est un texte violent rédigé pour critiquer un adversaire politique.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la signification du préfixe « auto- » associé au mot « portrait ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : si une autre personne écrit la biographie d''un tiers, il ne s''agit pas d''un autoportrait.'
  - si:
      contient:
      - o3
    relance: 'Faux : l''autoportrait est centré sur la personne même de l''artiste, pas sur un paysage.'
  - si:
      contient:
      - o4
    relance: 'Faux : ceci décrirait un pamphlet ou un texte satirique, non un autoportrait.'
  solution: 'C''est le portrait qu''un artiste ou un auteur fait de lui-même. Exact : l''autoportrait consiste pour un artiste
    ou un auteur à se représenter lui-même (en peinture, photo ou texte).'
- id: nblm-dans-quelle-uvre-du-xviiie-siecle-jean-j-4
  type: choix
  difficulte: 2
  enonce: Dans quelle œuvre du XVIIIe siècle Jean-Jacques Rousseau raconte-t-il sa propre vie, de son enfance à l'âge adulte,
    en cherchant à tout dire ?
  reponse:
    options:
    - id: o1
      texte: Les Confessions
    - id: o2
      texte: Les Essais
    - id: o3
      texte: Les Mémoires d'outre-tombe
    - id: o4
      texte: Candide
    bonnes:
    - o1
  indices:
    relance: Pense au titre de l'œuvre où l'auteur avoue en toute sincérité ses souvenirs d'enfance et ses fautes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : Les Essais ont été écrits par Montaigne au XVIe siècle.'
  - si:
      contient:
      - o3
    relance: 'Erreur : cet ouvrage a été rédigé par Chateaubriand au XIXe siècle.'
  - si:
      contient:
      - o4
    relance: 'Erreur : Candide est un conte philosophique de Voltaire et non un récit autobiographique de Rousseau.'
  solution: 'Les Confessions. Exact : Les Confessions de Jean-Jacques Rousseau sont considérées comme l''une des premières
    autobiographies modernes.'
- id: nblm-quelle-est-la-specificite-des-memoires-p-5
  type: choix
  difficulte: 2
  enonce: Quelle est la spécificité des « mémoires » par rapport aux autres formes d'écriture de soi ?
  reponse:
    options:
    - id: o1
      texte: C'est un récit de vie souvent tourné vers les événements publics vécus par l'auteur.
    - id: o2
      texte: C'est une courte lettre anonyme adressée à un journal intime.
    - id: o3
      texte: C'est un texte rédigé durant la petite enfance de l'auteur.
    - id: o4
      texte: C'est une histoire totalement féerique peuplée de personnages créés de toutes pièces.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la place accordée à la grande Histoire et à la vie publique dans ce type de récit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : les mémoires constituent un ouvrage structuré et assumé par son auteur.'
  - si:
      contient:
      - o3
    relance: 'Faux : les mémoires sont écrites plus tard, avec un recul temporel à l''âge adulte.'
  - si:
      contient:
      - o4
    relance: 'Faux : les mémoires reposent sur des faits réels vécus par l''auteur.'
  solution: 'C''est un récit de vie souvent tourné vers les événements publics vécus par l''auteur. Exact : les mémoires privilégient
    les événements historiques et publics dont l''auteur a été le témoin ou l''acteur.'
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant la démarche de se raconter dans un livre ou un récit d'enfance
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Se raconter implique de composer un texte et de choisir ce que l'on raconte.
    - id: o2
      texte: L'autobiographie et les mémoires sont rédigées après les faits racontés.
    - id: o3
      texte: Un récit autobiographique restituera toujours la vérité absolue sans aucun oubli.
    - id: o4
      texte: L'auteur d'une autobiographie crée un narrateur fictif sans aucun lien avec lui.
    bonnes:
    - o1
    - o2
  indices:
    relance: Coche les deux propositions qui rappellent la prise de recul dans le temps et le choix des souvenirs lors de
      l'écriture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : croire qu''un texte autobiographique dit tout sans aucun choix ni déformation liée à la mémoire.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : dans l''écriture de soi, l''auteur et le narrateur ne font qu''un.'
  solution: 'Se raconter implique de composer un texte et de choisir ce que l''on raconte ; L''autobiographie et les mémoires
    sont rédigées après les faits racontés. Exact : raconter sa vie nécessite un travail d''écriture et de sélection parmi
    ses souvenirs.'
- id: nblm-complete-la-phrase-le-recit-de-la-vie-d-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : Le récit de la vie d''une personne, écrit par elle-même, est une.'
  reponse:
    acceptees:
    - autobiographie
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par le préfixe 'auto-' et désigne l'écriture de sa propre vie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: autobiographie. Le terme 'autobiographie' désigne le récit où une personne raconte sa propre vie.
- id: nblm-quel-genre-de-l-ecriture-de-soi-permet-d-8
  type: texte_court
  difficulte: 1
  enonce: Quel genre de l'écriture de soi permet de noter, jour après jour, ses pensées et les événements de sa vie ?
  reponse:
    acceptees:
    - journal intime
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'une expression de deux mots désignant un écrit quotidien très personnel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
