  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les définitions en pensant au moment de l'écriture.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque forme une par une, en te demandant si l'auteur écrit à quelqu'un, ou pour lui-même, et quand.
  solution: L'autobiographie raconte une vie après coup, le journal intime note les jours, la correspondance rassemble des
    lettres.
- id: identite-auteur-narrateur
  type: choix
  difficulte: 2
  enonce: Dans une autobiographie, quelle affirmation est exacte ?
  reponse:
    options:
    - id: a
      texte: L'auteur, le narrateur et le personnage principal sont la même personne
    - id: b
      texte: Le narrateur est toujours un personnage inventé
    - id: c
      texte: L'auteur écrit la vie de quelqu'un d'autre
    - id: d
      texte: Le texte ne peut jamais contenir d'erreur
    bonnes:
    - a
  indices:
    relance: Qui raconte, et de qui parle-t-on ? Compare avec un roman où le narrateur est inventé.
    methode: 'L''écriture de soi repose sur une identité : celui qui écrit parle de sa propre vie.'
    etape: Élimine les réponses qui parlent d'un personnage inventé ou de la vie d'un autre.
  pieges:
  - si:
      contient:
      - b
    relance: Dans un roman, le narrateur peut être inventé. Dans une autobiographie, il s'agit de l'auteur.
  - si:
      contient:
      - c
    relance: Raconter la vie de quelqu'un d'autre s'appelle une biographie.
  - si:
      contient:
      - d
    relance: 'Même sincère, un auteur peut se tromper ou oublier : le récit est écrit avec du recul.'
  solution: Dans une autobiographie, l'auteur, le narrateur et le personnage principal sont la même personne.
- id: mot-journal
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le texte où l'on note, jour après jour, ses pensées et sa vie ? Réponds avec deux mots.
  reponse:
    acceptees:
    - journal intime
    fautes_tolerees: 2
  indices:
    relance: Ce texte ressemble à un carnet que l'on écrit chaque jour et que l'on garde secret.
    methode: Le premier mot est celui qu'on donne aussi à un quotidien d'information, le second veut dire « très personnel
      ».
    etape: Le premier mot commence par « jour- », le second par « int- ».
  pieges:
  - si:
      valeur: autobiographie
    relance: Une autobiographie est écrite après coup pour raconter toute une vie. Ici, on écrit au jour le jour.
  solution: 'Le journal intime : on y note ses pensées jour après jour, sans savoir la suite.'
