format: 2
notion: ecriture-de-soi-autoportrait
version: 1
etat: verifiee
declencheurs:
- raconter sa propre vie
- écrire son journal intime
- faire son autoportrait
- parler de son enfance dans un livre
prerequis: []
essentiel: 'Un écrivain peut choisir de parler de lui-même, de sa vie ou de son caractère. C''est l''écriture de soi.

  Elle prend plusieurs formes. L''autobiographie raconte la vie de l''auteur, écrite par lui-même, comme un récit.

  Le journal intime note les pensées du jour, sans savoir ce qui va suivre. La correspondance regroupe des lettres.

  Les mémoires racontent une vie, souvent tournée vers les événements publics vécus par l''auteur.

  L''essai peut aussi devenir un texte sur soi, quand l''auteur réfléchit sur sa propre pensée.

  Au XVIe siècle, Montaigne écrit Les Essais pour se peindre lui-même et réfléchir sur l''homme en général.

  Au XVIIIe siècle, Jean-Jacques Rousseau écrit Les Confessions, une des premières autobiographies, publiée après sa mort.

  Au XIXe siècle, François-René de Chateaubriand rédige ses Mémoires d''outre-tombe, publiées elles aussi après sa mort.

  Se raconter, c''est chercher à dire la vérité sur soi, mais c''est aussi composer un texte, choisir ce qu''on raconte et
  comment.

  '
methode:
- 'Repérer qui parle dans le texte : l''auteur, le narrateur et le personnage principal ne font qu''un dans l''écriture de
  soi.'
- 'Identifier la forme du texte : journal intime, lettre, autobiographie ou mémoires.'
- Chercher ce que l'auteur essaie de comprendre ou d'expliquer sur lui-même.
- Se demander si le texte donne une image flatteuse ou au contraire sincère et critique de l'auteur.
vocabulaire:
- terme: autobiographie
  definition: récit de la vie d'une personne, écrit par elle-même
- terme: mémoires
  definition: récit qu'un auteur fait de sa vie, souvent tourné vers les événements publics qu'il a vécus
- terme: journal intime
  definition: texte où l'on note, jour après jour, ses pensées et les événements de sa vie
erreurs_frequentes:
- Confondre l'auteur et un simple narrateur de fiction, alors que dans l'écriture de soi les deux ne font qu'un.
- Croire qu'un texte autobiographique dit toute la vérité sans aucun choix de l'auteur.
- Oublier que les mémoires et l'autobiographie sont écrites après les faits racontés, pas au moment même.
exemple:
  enonce: Explique en deux phrases pourquoi Les Confessions de Rousseau sont considérées comme une des premières autobiographies.
  solution: Rousseau y raconte sa propre vie, de son enfance à l'âge adulte, en cherchant à tout dire, y compris ses fautes.
    Le livre est publié après sa mort, en 1782 puis en 1789.
exercices:
- id: titre-montaigne
  type: choix
  difficulte: 1
  enonce: Quel est le titre du livre où Montaigne se peint lui-même et réfléchit sur l'homme en général ?
  reponse:
    options:
    - id: a
      texte: Les Essais
    - id: b
      texte: Les Confessions
    - id: c
      texte: Les Caractères
    - id: d
      texte: Candide
    bonnes:
    - a
  indices:
    relance: Cet auteur vit au XVIe siècle et donne son nom à un genre littéraire encore utilisé aujourd'hui.
    methode: Le titre du livre est aussi le nom d'un genre littéraire où l'auteur réfléchit librement, par petits textes.
    etape: Le titre commence par « Les E... ».
  pieges:
  - si:
      contient:
      - b
    relance: Ce titre est celui de Rousseau, un siècle plus tard. Cherche le titre du XVIe siècle.
  - si:
      contient:
      - c
    relance: Ce titre est celui de La Bruyère, qui peint la société de son temps, pas sa propre vie.
  - si:
      contient:
      - d
    relance: C'est un conte de Voltaire, pas un texte sur la vie de son auteur.
  solution: Montaigne écrit Les Essais, où il s'interroge sur lui-même et sur l'homme en général.
- id: auteur-confessions
  type: texte_court
  difficulte: 2
  enonce: Quel est le nom de famille de l'auteur des Confessions, autobiographie publiée après sa mort au XVIIIe siècle ?
  reponse:
    acceptees:
    - rousseau
    fautes_tolerees: 1
  indices:
    relance: Cet écrivain est aussi philosophe. Il a vécu au XVIIIe siècle et a beaucoup réfléchi à l'éducation et à la nature.
    methode: Cherche le nom d'un philosophe des Lumières qui a aussi écrit sur sa propre vie.
    etape: Son prénom est Jean-Jacques.
  pieges:
  - si:
      valeur: montaigne
    relance: Montaigne vit au XVIe siècle et écrit Les Essais, pas Les Confessions.
  - si:
      valeur: chateaubriand
    relance: Chateaubriand écrit ses Mémoires d'outre-tombe, pas Les Confessions.
  solution: Il s'agit de Jean-Jacques Rousseau, dont les Confessions sont publiées après sa mort, en 1782 puis en 1789.
- id: chronologie-oeuvres
  type: ordre
  difficulte: 2
  enonce: Range ces trois oeuvres de l'écriture de soi de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: essais
      texte: Les Essais de Montaigne
    - id: confessions
      texte: Les Confessions de Rousseau
    - id: memoires
      texte: Les Mémoires d'outre-tombe de Chateaubriand
  indices:
    relance: Laquelle de ces oeuvres est écrite la première, au XVIe siècle ?
    methode: Range d'abord l'oeuvre du XVIe siècle, puis celle du XVIIIe siècle, puis celle du XIXe siècle.
    etape: Montaigne écrit au XVIe siècle, avant les deux autres auteurs.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux oeuvres voisines dans le temps sont inversées. Laquelle des deux est écrite en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'oeuvre la plus ancienne, du XVIe siècle, puis la plus récente, du XIXe siècle.
  solution: Les Essais de Montaigne datent du XVIe siècle, Les Confessions de Rousseau sont écrites au XVIIIe siècle, et Les
    Mémoires d'outre-tombe de Chateaubriand sont rédigées au XIXe siècle.
- id: auteur-oeuvre
  type: association
  difficulte: 2
  enonce: Associe chaque auteur au titre de son oeuvre autobiographique.
  reponse:
    gauche:
    - id: a
      texte: Montaigne
    - id: b
      texte: Rousseau
    - id: c
      texte: Chateaubriand
    droite:
    - id: x
      texte: Les Essais
    - id: y
      texte: Les Confessions
    - id: z
      texte: Les Mémoires d'outre-tombe
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces auteurs vit au XVIe siècle, un autre au XVIIIe siècle, et le dernier au XIXe siècle.
    methode: Retrouve d'abord le titre de l'auteur le plus ancien, puis celui du XVIIIe siècle, puis celui du XIXe siècle.
    etape: 'Montaigne écrit au XVIe siècle : associe-le à Les Essais. Range ensuite les deux autres auteurs selon leur siècle.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout les deux auteurs les plus proches dans le temps.
  - si:
      diagnostic: associations_fausses
    relance: Reprends un auteur à la fois, en te souvenant de son siècle.
  solution: Montaigne écrit Les Essais, Rousseau écrit Les Confessions, Chateaubriand écrit Les Mémoires d'outre-tombe.
- id: pourquoi-se-raconter
  type: ouverte
  difficulte: 3
  enonce: Explique en quelques phrases pourquoi un auteur peut choisir de raconter sa propre vie, et donne un exemple d'oeuvre
    étudiée en classe.
  criteres:
  - L'élève cite une forme de l'écriture de soi (autobiographie, mémoires, journal intime ou correspondance).
  - L'élève explique une raison de se raconter (comprendre sa vie, se justifier, garder une trace, transmettre une expérience).
  - L'élève donne un exemple précis d'auteur ou d'oeuvre vu en classe.
  indices:
    relance: Pourquoi quelqu'un voudrait-il expliquer sa propre vie aux autres ?
    methode: Pense à un texte étudié en classe qui parle de la vie de son auteur, et demande-toi ce que cet auteur cherche
      à faire comprendre.
    etape: Commence par nommer la forme du texte (autobiographie, journal, mémoires...), puis explique une raison de se raconter.
  solution: Par exemple, dans Les Confessions, Rousseau raconte sa vie depuis son enfance pour être compris et jugé tel qu'il
    est vraiment, avec ses qualités et ses fautes.
