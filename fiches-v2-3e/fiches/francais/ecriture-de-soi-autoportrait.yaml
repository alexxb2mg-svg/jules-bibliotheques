format: 2
notion: ecriture-de-soi-autoportrait
version: 2
etat: generee
declencheurs:
- raconter sa propre vie
- écrire son journal intime
- faire son autoportrait
- parler de son enfance dans un livre
- se raconter dans un livre
- récit de sa propre vie
- lettres qu'un auteur écrit
- portrait de soi en peinture
prerequis: []
essentiel: |
  L'écriture de soi rassemble les textes où un auteur parle de lui-même, de sa vie ou de sa personnalité. Le programme de 3e demande de découvrir différentes formes de cette écriture et de comprendre pourquoi on se raconte ou on se représente.

  Les formes à connaître : l'autobiographie raconte la vie de l'auteur, écrite par lui-même après coup, à la première personne. Les mémoires racontent surtout les événements publics dont l'auteur a été témoin ou acteur. Le journal intime note, jour après jour, ce que l'on pense et vit, sans savoir la suite. La correspondance est un ensemble de lettres où l'on se confie. L'autoportrait est un portrait de soi, en mots ou en image (peinture, dessin). L'essai peut devenir une réflexion sur soi.

  Dans l'autobiographie, l'auteur, le narrateur et le personnage principal sont la même personne. On appelle parfois « pacte autobiographique » l'engagement de l'auteur à dire la vérité sur sa vie.

  Repères : au XVIe siècle, Montaigne écrit Les Essais, où il se peint lui-même et réfléchit sur l'homme. Au XVIIIe siècle, Rousseau écrit Les Confessions, publiées après sa mort (1782 et 1789). Au XIXe siècle, Chateaubriand rédige Les Mémoires d'outre-tombe, publiées après sa mort. Au XXe siècle, Sartre écrit Les Mots (1964) sur son enfance, et Le Journal d'Anne Frank est un célèbre journal intime.

  Pourquoi se raconter ? Pour se comprendre, se justifier, garder une trace, transmettre une expérience. Se raconter est un effort de vérité. Mais on ne peut pas tout dire : l'auteur choisit, organise, embellit parfois, et écrit après les faits, avec le recul. Un récit de soi est donc aussi une construction.

  Ce qu'on attend au brevet : reconnaître la forme d'un texte, expliquer pourquoi l'auteur se raconte, et montrer que le récit est à la fois recherche de vérité et composition.
methode:
- 'Repérer qui parle : l''auteur, le narrateur et le personnage sont-ils la même personne ? Cherche les marques
  de la 1re personne (je, mon, moi).'
- 'Identifier la forme du texte : autobiographie, mémoires, journal intime, lettre, autoportrait.'
- 'Relever le moment de l''écriture : sur le vif (journal) ou après coup, avec du recul (autobiographie, mémoires).'
- Chercher ce que l'auteur veut comprendre, prouver ou transmettre en se racontant.
- 'Se demander si le texte est sincère, flatteur ou critique : que choisit-il de dire, de cacher, de mettre en valeur
  ?'
- Conclure sur l'effort de vérité et sur la façon dont le texte est composé.
vocabulaire:
- terme: autobiographie
  definition: récit de la vie d'une personne, écrit par elle-même
- terme: mémoires
  definition: récit qu'un auteur fait de sa vie, souvent tourné vers les événements publics qu'il a vécus
- terme: journal intime
  definition: texte où l'on note, jour après jour, ses pensées et les événements de sa vie
- terme: correspondance
  definition: ensemble de lettres échangées entre des personnes
- terme: autoportrait
  definition: portrait qu'une personne fait d'elle-même, en mots ou en image
- terme: essai
  definition: texte libre où un auteur réfléchit sur un sujet en donnant son point de vue
- terme: pacte autobiographique
  definition: engagement de l'auteur à dire la vérité sur sa vie
- terme: narrateur
  definition: celui qui raconte l'histoire dans un texte
erreurs_frequentes:
- Confondre l'auteur et un simple narrateur de fiction, alors que dans l'écriture de soi les deux ne font qu'un.
- Croire qu'un texte autobiographique dit toute la vérité sans aucun choix de l'auteur.
- Oublier que les mémoires et l'autobiographie sont écrites après les faits racontés, pas au moment même.
- Confondre autobiographie (la vie de l'auteur) et biographie (la vie d'un autre racontée par quelqu'un d'autre).
- Confondre journal intime, écrit au jour le jour, et mémoires, écrites avec du recul.
exemple:
  enonce: Explique en deux phrases pourquoi Les Confessions de Rousseau sont considérées comme une des premières
    autobiographies.
  solution: Rousseau y raconte sa propre vie, de son enfance à l'âge adulte, en cherchant à tout dire, y compris
    ses fautes. Le livre est publié après sa mort, en 1782 puis en 1789.
exercices:
- id: titre-montaigne
  type: choix
  difficulte: 1
  enonce: Quel est le titre du livre où Montaigne se peint lui-même et réfléchit sur l'homme en général ?
  reponse:
    options:
    - id: a
      texte: Les Essais
    - id: b
      texte: Les Confessions
    - id: c
      texte: Les Caractères
    - id: d
      texte: Candide
    bonnes:
    - a
  indices:
    relance: Cet auteur vit au XVIe siècle et donne son nom à un genre littéraire encore utilisé aujourd'hui.
    methode: Le titre du livre est aussi le nom d'un genre littéraire où l'auteur réfléchit librement, par petits
      textes.
    etape: Le titre commence par « Les E... ».
  pieges:
  - si:
      contient:
      - b
    relance: Ce titre est celui de Rousseau, un siècle plus tard. Cherche le titre du XVIe siècle.
  - si:
      contient:
      - c
    relance: Ce titre est celui de La Bruyère, qui peint la société de son temps, pas sa propre vie.
  - si:
      contient:
      - d
    relance: C'est un conte de Voltaire, pas un texte sur la vie de son auteur.
  solution: Montaigne écrit Les Essais, où il s'interroge sur lui-même et sur l'homme en général.
- id: auteur-confessions
  type: texte_court
  difficulte: 2
  enonce: Quel est le nom de famille de l'auteur des Confessions, autobiographie publiée après sa mort au XVIIIe
    siècle ?
  reponse:
    acceptees:
    - rousseau
    fautes_tolerees: 1
  indices:
    relance: Cet écrivain est aussi philosophe. Il a vécu au XVIIIe siècle et a beaucoup réfléchi à l'éducation
      et à la nature.
    methode: Cherche le nom d'un philosophe des Lumières qui a aussi écrit sur sa propre vie.
    etape: Son prénom est Jean-Jacques.
  pieges:
  - si:
      valeur: montaigne
    relance: Montaigne vit au XVIe siècle et écrit Les Essais, pas Les Confessions.
  - si:
      valeur: chateaubriand
    relance: Chateaubriand écrit ses Mémoires d'outre-tombe, pas Les Confessions.
  solution: Il s'agit de Jean-Jacques Rousseau, dont les Confessions sont publiées après sa mort, en 1782 puis en
    1789.
- id: chronologie-oeuvres
  type: ordre
  difficulte: 2
  enonce: Range ces trois oeuvres de l'écriture de soi de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: essais
      texte: Les Essais de Montaigne
    - id: confessions
      texte: Les Confessions de Rousseau
    - id: memoires
      texte: Les Mémoires d'outre-tombe de Chateaubriand
  indices:
    relance: Laquelle de ces oeuvres est écrite la première, au XVIe siècle ?
    methode: Range d'abord l'oeuvre du XVIe siècle, puis celle du XVIIIe siècle, puis celle du XIXe siècle.
    etape: Montaigne écrit au XVIe siècle, avant les deux autres auteurs.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux oeuvres voisines dans le temps sont inversées. Laquelle des deux est écrite en premier
      ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'oeuvre la plus ancienne, du XVIe siècle, puis la plus récente, du XIXe siècle.
  solution: Les Essais de Montaigne datent du XVIe siècle, Les Confessions de Rousseau sont écrites au XVIIIe siècle,
    et Les Mémoires d'outre-tombe de Chateaubriand sont rédigées au XIXe siècle.
- id: auteur-oeuvre
  type: association
  difficulte: 2
  enonce: Associe chaque auteur au titre de son oeuvre autobiographique.
  reponse:
    gauche:
    - id: a
      texte: Montaigne
    - id: b
      texte: Rousseau
    - id: c
      texte: Chateaubriand
    droite:
    - id: x
      texte: Les Essais
    - id: y
      texte: Les Confessions
    - id: z
      texte: Les Mémoires d'outre-tombe
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces auteurs vit au XVIe siècle, un autre au XVIIIe siècle, et le dernier au XIXe siècle.
    methode: Retrouve d'abord le titre de l'auteur le plus ancien, puis celui du XVIIIe siècle, puis celui du XIXe
      siècle.
    etape: 'Montaigne écrit au XVIe siècle : associe-le à Les Essais. Range ensuite les deux autres auteurs selon
      leur siècle.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout les deux auteurs les plus proches dans le temps.
  - si:
      diagnostic: associations_fausses
    relance: Reprends un auteur à la fois, en te souvenant de son siècle.
  solution: Montaigne écrit Les Essais, Rousseau écrit Les Confessions, Chateaubriand écrit Les Mémoires d'outre-tombe.
- id: pourquoi-se-raconter
  type: ouverte
  difficulte: 3
  enonce: Explique en quelques phrases pourquoi un auteur peut choisir de raconter sa propre vie, et donne un exemple
    d'oeuvre étudiée en classe.
  criteres:
  - L'élève cite une forme de l'écriture de soi (autobiographie, mémoires, journal intime ou correspondance).
  - L'élève explique une raison de se raconter (comprendre sa vie, se justifier, garder une trace, transmettre une
    expérience).
  - L'élève donne un exemple précis d'auteur ou d'oeuvre vu en classe.
  indices:
    relance: Pourquoi quelqu'un voudrait-il expliquer sa propre vie aux autres ?
    methode: Pense à un texte étudié en classe qui parle de la vie de son auteur, et demande-toi ce que cet auteur
      cherche à faire comprendre.
    etape: Commence par nommer la forme du texte (autobiographie, journal, mémoires...), puis explique une raison
      de se raconter.
  solution: Par exemple, dans Les Confessions, Rousseau raconte sa vie depuis son enfance pour être compris et jugé
    tel qu'il est vraiment, avec ses qualités et ses fautes.
- id: formes-ecriture-de-soi
  type: association
  difficulte: 2
  enonce: Associe chaque forme de l'écriture de soi à sa définition.
  reponse:
    gauche:
    - id: a
      texte: L'autobiographie
    - id: b
      texte: Le journal intime
    - id: c
      texte: La correspondance
    droite:
    - id: x
      texte: Le récit de sa propre vie, écrit après coup
    - id: y
      texte: Des notes personnelles écrites jour après jour
    - id: z
      texte: Un ensemble de lettres échangées
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une forme s'écrit au jour le jour, une autre s'adresse à un destinataire, une autre raconte toute une
      vie.
    methode: Pour chaque définition, demande-toi si le texte est écrit sur le moment ou après, et s'il s'adresse
      à quelqu'un.
    etape: Le journal s'écrit sur le moment. La correspondance suppose un destinataire.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les définitions en pensant au moment de l'écriture.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque forme une par une, en te demandant si l'auteur écrit à quelqu'un, ou pour lui-même,
      et quand.
  solution: L'autobiographie raconte une vie après coup, le journal intime note les jours, la correspondance rassemble
    des lettres.
- id: identite-auteur-narrateur
  type: choix
  difficulte: 2
  enonce: Dans une autobiographie, quelle affirmation est exacte ?
  reponse:
    options:
    - id: a
      texte: L'auteur, le narrateur et le personnage principal sont la même personne
    - id: b
      texte: Le narrateur est toujours un personnage inventé
    - id: c
      texte: L'auteur écrit la vie de quelqu'un d'autre
    - id: d
      texte: Le texte ne peut jamais contenir d'erreur
    bonnes:
    - a
  indices:
    relance: Qui raconte, et de qui parle-t-on ? Compare avec un roman où le narrateur est inventé.
    methode: 'L''écriture de soi repose sur une identité : celui qui écrit parle de sa propre vie.'
    etape: Élimine les réponses qui parlent d'un personnage inventé ou de la vie d'un autre.
  pieges:
  - si:
      contient:
      - b
    relance: Dans un roman, le narrateur peut être inventé. Dans une autobiographie, il s'agit de l'auteur.
  - si:
      contient:
      - c
    relance: Raconter la vie de quelqu'un d'autre s'appelle une biographie.
  - si:
      contient:
      - d
    relance: 'Même sincère, un auteur peut se tromper ou oublier : le récit est écrit avec du recul.'
  solution: Dans une autobiographie, l'auteur, le narrateur et le personnage principal sont la même personne.
- id: mot-journal
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le texte où l'on note, jour après jour, ses pensées et sa vie ? Réponds avec deux
    mots.
  reponse:
    acceptees:
    - journal intime
    fautes_tolerees: 2
  indices:
    relance: Ce texte ressemble à un carnet que l'on écrit chaque jour et que l'on garde secret.
    methode: Le premier mot est celui qu'on donne aussi à un quotidien d'information, le second veut dire « très
      personnel ».
    etape: Le premier mot commence par « jour- », le second par « int- ».
  pieges:
  - si:
      valeur: autobiographie
    relance: Une autobiographie est écrite après coup pour raconter toute une vie. Ici, on écrit au jour le jour.
  solution: 'Le journal intime : on y note ses pensées jour après jour, sans savoir la suite.'
