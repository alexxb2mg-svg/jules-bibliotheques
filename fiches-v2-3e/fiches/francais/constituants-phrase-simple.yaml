format: 2
notion: constituants-phrase-simple
version: 1
etat: verifiee
declencheurs:
- trouver le sujet caché
- complément circonstanciel de lieu
- distinguer COD et COI
- type de phrase interrogative
prerequis: []
essentiel: 'Une phrase simple contient un seul verbe conjugué. Elle s''organise autour de constituants :

  le sujet (qui fait l''action ou dont on parle), le verbe, et des compléments.


  Le complément d''objet direct (COD) suit le verbe sans préposition (« Il mange une pomme. »). Le

  complément d''objet indirect (COI) est introduit par une préposition (« Il pense à ses vacances. »).

  Le complément circonstanciel (de lieu, de temps, de manière...) peut se déplacer ou se supprimer.


  Le sujet est parfois éloigné du verbe, séparé par un groupe de mots : « Le chat de ma voisine, qui

  dort tout le temps, ronronne. » Le sujet reste « le chat », malgré la distance.


  Une phrase a un type (déclaratif, interrogatif, impératif) et une forme (négative, passive,

  exclamative, impersonnelle) : le type et la forme peuvent se combiner dans une même phrase.

  '
methode:
- Pour trouver le sujet, pose la question « qui est-ce qui... ? » ou « qu'est-ce qui... ? » devant le verbe.
- Pour distinguer COD et COI, regarde s'il y a une préposition juste avant le complément.
- Pour un complément circonstanciel, vérifie qu'il peut être déplacé ou supprimé sans rendre la phrase incorrecte.
- Pour le type de phrase, regarde la ponctuation finale et la construction (point, point d'interrogation, verbe à l'impératif).
vocabulaire:
- terme: COD
  definition: 'complément d''objet direct : complément du verbe placé sans préposition'
- terme: COI
  definition: 'complément d''objet indirect : complément du verbe introduit par une préposition'
erreurs_frequentes:
- Confondre COD (sans préposition) et COI (avec préposition) devant un verbe.
- Croire que le sujet est toujours juste avant le verbe, même quand un groupe de mots les sépare.
- Confondre le type de phrase (déclaratif, interrogatif, impératif) et sa forme (négative, exclamative...).
exemple:
  enonce: Dans la phrase « Le vieux chien de mon grand-père, fatigué par la promenade, dort », quel est le sujet du verbe
    « dort » ?
  solution: 'Le sujet est « le vieux chien de mon grand-père » : malgré le groupe intercalé « fatigué par la promenade »,
    c''est bien le chien qui dort.'
exercices:
- id: cod-ou-coi
  type: choix
  difficulte: 1
  enonce: Dans la phrase « Elle pense à ses vacances », quelle est la fonction de « à ses vacances » ?
  reponse:
    options:
    - id: a
      texte: complément d'objet indirect (COI)
    - id: b
      texte: complément d'objet direct (COD)
    - id: c
      texte: sujet
    bonnes:
    - a
  indices:
    relance: 'Regarde bien : y a-t-il un mot entre le verbe et le complément ?'
    methode: Le COD suit directement le verbe, le COI est introduit par une préposition comme « à » ou « de ».
    etape: 'Ici, la préposition « à » introduit le complément : c''est le signe du COI.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Le COD n''a pas de préposition devant lui. Ici, il y a « à » avant « ses vacances » : ce n''est pas un COD.'
  - si:
      contient:
      - c
    relance: Le sujet fait l'action et se trouve avant le verbe. « À ses vacances » est un complément, pas le sujet.
  solution: '« À ses vacances » est complément d''objet indirect (COI) : il est introduit par la préposition « à », placée
    entre le verbe et le complément.'
- id: trouver-sujet-eloigne
  type: texte_court
  difficulte: 1
  enonce: Dans la phrase « Le chat de ma voisine, qui dort tout le temps, ronronne », quel est le sujet du verbe « ronronne
    » ? Réponds par le groupe nominal minimal.
  reponse:
    acceptees:
    - le chat
    - le chat de ma voisine
    fautes_tolerees: 1
  indices:
    relance: Pose la question « qu'est-ce qui ronronne ? » pour trouver le sujet.
    methode: 'Ignore le groupe intercalé entre virgules (« qui dort tout le temps ») : il n''est pas le sujet.'
    etape: Le sujet est un animal, cité au tout début de la phrase.
  pieges:
  - si:
      valeur: ma voisine
    relance: Ma voisine est la propriétaire de l'animal, mais ce n'est pas elle qui ronronne. Cherche l'être vivant qui fait
      l'action.
  solution: 'Le sujet du verbe « ronronne » est « le chat » (ou « le chat de ma voisine ») : malgré la proposition intercalée
    « qui dort tout le temps », c''est bien le chat qui ronronne.'
- id: type-de-phrase
  type: association
  difficulte: 2
  enonce: Associe chaque phrase à son type.
  reponse:
    gauche:
    - id: a
      texte: Ferme la porte.
    - id: b
      texte: Quelle heure est-il ?
    - id: c
      texte: Il fait beau aujourd'hui.
    droite:
    - id: x
      texte: type impératif
    - id: y
      texte: type interrogatif
    - id: z
      texte: type déclaratif
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Regarde la ponctuation finale et la construction du verbe dans chaque phrase.
    methode: Un ordre sans sujet exprimé est de type impératif ; une question se termine par un point d'interrogation.
    etape: '« Ferme la porte » est un ordre, sans sujet exprimé : c''est le type impératif.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la ponctuation et à la construction de chaque phrase.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la phrase qui donne un ordre, puis celle qui pose une question, puis celle qui énonce un fait.
  solution: « Ferme la porte » est de type impératif, « Quelle heure est-il ? » de type interrogatif, « Il fait beau aujourd'hui
    » de type déclaratif.
- id: constituants-ordre
  type: ordre
  difficulte: 2
  enonce: Dans l'analyse d'une phrase simple, range ces trois étapes dans l'ordre logique de la méthode.
  reponse:
    elements:
    - id: a
      texte: Repérer le verbe conjugué
    - id: b
      texte: Trouver le sujet en posant « qui est-ce qui + verbe »
    - id: c
      texte: Identifier les compléments du verbe (COD, COI, circonstanciels)
  indices:
    relance: Sans le verbe, on ne peut pas poser la question qui permet de trouver le sujet.
    methode: La méthode commence toujours par repérer le verbe conjugué, pivot de la phrase.
    etape: La première étape est de repérer le verbe conjugué de la phrase.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Laquelle doit-on faire juste après avoir trouvé le verbe ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui vient en tout premier (le verbe), puis celle qui vient en dernier (les compléments).
  solution: On repère d'abord le verbe conjugué, puis on trouve le sujet en posant la question « qui est-ce qui + verbe »,
    puis on identifie les compléments du verbe.
