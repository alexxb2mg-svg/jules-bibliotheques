    bonnes:
    - o1
  indices:
    relance: Regarde la ponctuation finale et la structure inversée du verbe et du sujet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre le type impératif (qui donne un ordre) avec le type interrogatif.'
  - si:
      contient:
