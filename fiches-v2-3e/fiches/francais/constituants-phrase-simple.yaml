- id: complement-du-nom
  type: choix
  difficulte: 2
  enonce: Dans « La petite fille de ma voisine sourit. », quel groupe est le complément du nom « fille » ?
  reponse:
    options:
    - id: a
      texte: de ma voisine
    - id: b
      texte: petite
    - id: c
      texte: sourit
    bonnes:
    - a
  indices:
    relance: Cherche le groupe introduit par une préposition et qui précise le nom « fille ».
    methode: Le complément du nom est introduit par une préposition ; l'adjectif directement lié au nom est une épithète.
    etape: Le complément du nom suit « fille » et commence par une préposition.
  pieges:
  - si:
      contient:
      - b
    relance: '« Petite » est un adjectif directement lié au nom : c''est une épithète, pas un complément du nom.'
  - si:
      contient:
      - c
    relance: « Sourit » est le verbe. On cherche une expansion du nom « fille ».
  solution: « de ma voisine » est le complément du nom « fille » (préposition « de » + groupe nominal).
- id: complement-lieu
  type: texte_court
  difficulte: 2
  enonce: Dans « Hier, les enfants jouaient dans le jardin. », donne le complément circonstanciel de lieu.
  reponse:
    acceptees:
    - dans le jardin
    fautes_tolerees: 1
  indices:
    relance: Pose la question « où ? » après le verbe.
    methode: Le complément de lieu répond à « où ? », le complément de temps à « quand ? ».
    etape: Le groupe commence par une préposition qui indique la position.
  pieges:
  - si:
      valeur: hier
    relance: 'Ce mot répond à « quand ? » : c''est un complément de temps. Cherche celui qui répond à « où ? ».'
  - si:
      valeur: les enfants
    relance: C'est le sujet, pas un complément. Cherche celui qui répond à « où ? ».
  solution: '« dans le jardin » répond à « où ? » : c''est le complément circonstanciel de lieu.'
- id: analyser-phrase-simple
  type: ouverte
  difficulte: 3
  enonce: 'Analyse la phrase « Depuis lundi, le voisin de ma tante offre des fleurs à sa fille. » : donne le verbe, le sujet,
    le COD, le COI et le complément circonstanciel, avec la fonction de chacun.'
  criteres:
  - Le verbe (« offre »), le sujet (« le voisin de ma tante ») et le COD (« des fleurs ») sont correctement identifiés.
  - Le COI (« à sa fille ») et le complément circonstanciel de temps (« depuis lundi ») sont correctement identifiés.
  - Les fonctions sont justifiées par une question ou un test (« qui est-ce qui... ? », déplacement, préposition).
  indices:
    relance: Quel est le verbe conjugué ? Pose ensuite les questions qui, quoi, à qui, quand.
    methode: 'Sujet : qui est-ce qui offre ? COD : offre quoi ? COI : offre à qui ? CC : quand ?'
    etape: Le verbe est « offre ». Cherche le sujet avec « qui est-ce qui offre ? ».
  solution: 'Verbe : offre. Sujet : le voisin de ma tante. COD : des fleurs (offre quoi ?). COI : à sa fille (offre à qui
    ?). CC de temps : depuis lundi (déplaçable : « Le voisin de ma tante offre des fleurs à sa fille depuis lundi »).'
