- id: nblm-qu-est-ce-qui-caracterise-le-nombre-de-v-5
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qui caractérise le nombre de verbes conjugués dans une phrase simple ?
  reponse:
    options:
    - id: o1
      texte: Elle ne contient qu'un seul verbe conjugué
    - id: o2
      texte: Elle contient au moins deux verbes conjugués
    - id: o3
      texte: Elle ne contient aucun verbe conjugué
    - id: o4
      texte: Elle contient uniquement des verbes à l'infinitif
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la règle fondamentale qui distingue la phrase simple de la phrase complexe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre la phrase simple avec la phrase complexe qui réunit plusieurs verbes conjugués.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre la phrase simple verbale avec une phrase nominale.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre les modes non personnels avec un verbe conjugué noyau de la phrase.'
  solution: 'Elle ne contient qu''un seul verbe conjugué. C''est exact : la phrase simple se définit par la présence d''un
    unique verbe conjugué, formant une seule proposition.'
- id: nblm-quelles-sont-les-deux-caracteristiques-q-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux caractéristiques qui permettent de reconnaître un complément d'objet direct (COD) dans la
    phrase simple ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Il est directement rattaché au verbe sans préposition
    - id: o2
      texte: Il est un complément essentiel que l'on ne peut généralement ni supprimer ni déplacer
    - id: o3
      texte: Il est toujours précédé de la préposition « à » ou « de »
    - id: o4
      texte: Il indique obligatoirement le lieu ou le temps de l'action
    bonnes:
    - o1
    - o2
  indices:
    relance: Réfléchis à l'absence de préposition et à l'impossibilité de supprimer ce complément sans changer le sens.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : c''est la caractéristique du COI (complément d''objet indirect) et non du COD.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre un complément d''objet avec un complément circonstanciel.'
  solution: 'Il est directement rattaché au verbe sans préposition ; Il est un complément essentiel que l''on ne peut généralement
    ni supprimer ni déplacer. C''est exact : le COD complète le verbe directement, sans préposition intermédiaire.'
- id: nblm-quel-sigle-designe-le-complement-d-objet-7
