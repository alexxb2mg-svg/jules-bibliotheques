format: 2
notion: constituants-phrase-simple
version: 2
etat: verifiee
declencheurs:
- trouver le sujet caché
- complément circonstanciel de lieu
- distinguer COD et COI
- type de phrase interrogative
- nature et fonction des mots
- groupe nominal sujet
- expansion du nom
- phrase à la forme négative
prerequis: []
essentiel: 'Analyser une phrase simple, c''est repérer ses constituants (les groupes de mots qui la composent) et leur fonction.


  1. Les classes de mots.

  - nom, déterminant, adjectif (et ses degrés : petit, plus petit, le plus petit), pronom, verbe, adverbe (invariable), préposition
  (à, de, dans, pour...), conjonction de coordination (mais, ou, et, donc, or, ni, car).

  - Le groupe nominal (GN) est formé d''un déterminant et d''un nom, avec ou sans expansion.


  2. Le verbe et le sujet.

  Une phrase simple a un seul verbe conjugué. Le sujet se trouve avec « qui est-ce qui... ? » ou « qu''est-ce qui... ? » +
  verbe. Il peut être éloigné du verbe : « Le chat de ma voisine, qui dort tout le temps, ronronne. » Le sujet est « le chat
  de ma voisine ».


  3. Les compléments du verbe.

  - COD : sans préposition (« Elle lit un livre »), on trouve « quoi ? » ou « qui ? ».

  - COI : avec la préposition à ou de (« Elle pense à ses vacances »), on trouve « à quoi ? à qui ? de quoi ? ».

  - Attribut du sujet : après être, paraître, sembler, devenir : « Elle est contente. »

  - Compléments circonstanciels (CC) : lieu, temps, manière, cause... Ils sont déplaçables et supprimables : « Hier, les enfants
  jouaient dans le jardin. »


  4. Les expansions du nom.

  - L''épithète : adjectif directement lié au nom (« une petite fille »).

  - Le complément du nom : groupe introduit par une préposition (« la fille de ma voisine »).

  - L''apposition : groupe séparé par des virgules (« Paul, mon frère, sourit »).


  5. Types et formes de phrase.

  Types : déclaratif (point), interrogatif (?), impératif (ordre, pas de sujet). Formes : négative (ne... pas), passive, exclamative
  (!), impersonnelle (il pleut). Une phrase a un type et peut avoir plusieurs formes : « Ne touche pas à ce fil ! » est de
  type impératif et de forme négative.


  Au brevet, on demande de nommer la nature et la fonction d''un mot ou d''un groupe de mots.

  '
methode:
- 'Repère le verbe conjugué : il est le centre de la phrase.'
- Trouve le sujet avec « qui est-ce qui... ? » ou « qu'est-ce qui... ? » + verbe, même s'il est éloigné.
- 'Cherche les compléments du verbe : pas de préposition = COD, préposition à ou de = COI ; après être = attribut.'
- 'Repère les compléments circonstanciels : ils se déplacent ou se suppriment (lieu, temps, manière...).'
- 'Regarde les expansions du nom : épithète, complément du nom, apposition.'
- Détermine le type de phrase (déclaratif, interrogatif, impératif) et ses formes (négative, passive, exclamative, impersonnelle).
vocabulaire:
- terme: COD
  definition: 'complément d''objet direct : complément du verbe construit sans préposition'
- terme: COI
  definition: 'complément d''objet indirect : complément du verbe construit avec à ou de'
- terme: complément circonstanciel
  definition: complément qui indique où, quand, comment ou pourquoi ; il est déplaçable et supprimable
- terme: attribut du sujet
  definition: mot ou groupe qui dit comment est le sujet, après être, paraître, sembler, devenir
- terme: épithète
  definition: adjectif directement lié au nom qu'il complète
- terme: complément du nom
  definition: groupe introduit par une préposition qui complète un nom
- terme: apposition
  definition: mot ou groupe de mots séparé du nom par des virgules qui apporte une précision
- terme: type de phrase
  definition: déclaratif, interrogatif ou impératif
- terme: groupe nominal
  definition: nom accompagné de son déterminant, avec ou sans expansion
erreurs_frequentes:
- Prendre pour sujet le mot le plus proche du verbe, alors que le vrai sujet est plus loin dans la phrase.
- 'Confondre COD et COI : le COI est introduit par « à » ou « de », le COD ne l''est pas.'
- 'Confondre complément circonstanciel et complément d''objet : le CC se déplace ou se supprime, pas le COD.'
- 'Confondre type et forme de phrase : « Ne pars pas ! » est de type impératif et de forme négative.'
- Croire que « de ma voisine » est toujours un complément du verbe alors qu'il peut compléter un nom.
exemple:
  enonce: Dans la phrase « Le vieux chien de mon grand-père, fatigué par la promenade, dort », quel est le sujet du verbe
    « dort » ?
  solution: 'Le sujet est « le vieux chien de mon grand-père » : malgré le groupe intercalé « fatigué par la promenade »,
    c''est bien le chien qui dort.'
exercices:
- id: cod-ou-coi
  type: choix
  difficulte: 1
  enonce: Dans la phrase « Elle pense à ses vacances », quelle est la fonction de « à ses vacances » ?
  reponse:
    options:
    - id: a
      texte: complément d'objet indirect (COI)
    - id: b
      texte: complément d'objet direct (COD)
    - id: c
      texte: sujet
    bonnes:
    - a
  indices:
    relance: 'Regarde bien : y a-t-il un mot entre le verbe et le complément ?'
    methode: Le COD suit directement le verbe, le COI est introduit par une préposition comme « à » ou « de ».
    etape: 'Ici, la préposition « à » introduit le complément : c''est le signe du COI.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Le COD n''a pas de préposition devant lui. Ici, il y a « à » avant « ses vacances » : ce n''est pas un COD.'
  - si:
      contient:
      - c
    relance: Le sujet fait l'action et se trouve avant le verbe. « À ses vacances » est un complément, pas le sujet.
  solution: '« À ses vacances » est complément d''objet indirect (COI) : il est introduit par la préposition « à », placée
    entre le verbe et le complément.'
- id: trouver-sujet-eloigne
  type: texte_court
  difficulte: 1
  enonce: Dans la phrase « Le chat de ma voisine, qui dort tout le temps, ronronne », quel est le sujet du verbe « ronronne
    » ? Réponds par le groupe nominal minimal.
  reponse:
    acceptees:
    - le chat
    - le chat de ma voisine
    fautes_tolerees: 1
  indices:
    relance: Pose la question « qu'est-ce qui ronronne ? » pour trouver le sujet.
    methode: 'Ignore le groupe intercalé entre virgules (« qui dort tout le temps ») : il n''est pas le sujet.'
    etape: Le sujet est un animal, cité au tout début de la phrase.
  pieges:
  - si:
      valeur: ma voisine
    relance: Ma voisine est la propriétaire de l'animal, mais ce n'est pas elle qui ronronne. Cherche l'être vivant qui fait
      l'action.
  solution: 'Le sujet du verbe « ronronne » est « le chat » (ou « le chat de ma voisine ») : malgré la proposition intercalée
    « qui dort tout le temps », c''est bien le chat qui ronronne.'
- id: type-de-phrase
  type: association
  difficulte: 2
  enonce: Associe chaque phrase à son type.
  reponse:
    gauche:
    - id: a
      texte: Ferme la porte.
    - id: b
      texte: Quelle heure est-il ?
    - id: c
      texte: Il fait beau aujourd'hui.
    droite:
    - id: x
      texte: type impératif
    - id: y
      texte: type interrogatif
    - id: z
      texte: type déclaratif
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Regarde la ponctuation finale et la construction du verbe dans chaque phrase.
    methode: Un ordre sans sujet exprimé est de type impératif ; une question se termine par un point d'interrogation.
    etape: '« Ferme la porte » est un ordre, sans sujet exprimé : c''est le type impératif.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la ponctuation et à la construction de chaque phrase.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la phrase qui donne un ordre, puis celle qui pose une question, puis celle qui énonce un fait.
  solution: « Ferme la porte » est de type impératif, « Quelle heure est-il ? » de type interrogatif, « Il fait beau aujourd'hui
    » de type déclaratif.
- id: constituants-ordre
  type: ordre
  difficulte: 2
  enonce: Dans l'analyse d'une phrase simple, range ces trois étapes dans l'ordre logique de la méthode.
  reponse:
    elements:
    - id: a
      texte: Repérer le verbe conjugué
    - id: b
      texte: Trouver le sujet en posant « qui est-ce qui + verbe »
    - id: c
      texte: Identifier les compléments du verbe (COD, COI, circonstanciels)
  indices:
    relance: Sans le verbe, on ne peut pas poser la question qui permet de trouver le sujet.
    methode: La méthode commence toujours par repérer le verbe conjugué, pivot de la phrase.
    etape: La première étape est de repérer le verbe conjugué de la phrase.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Laquelle doit-on faire juste après avoir trouvé le verbe ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui vient en tout premier (le verbe), puis celle qui vient en dernier (les compléments).
  solution: On repère d'abord le verbe conjugué, puis on trouve le sujet en posant la question « qui est-ce qui + verbe »,
    puis on identifie les compléments du verbe.
- id: nblm-dans-la-phrase-les-eleves-de-cette-class-1
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Les élèves de cette classe de troisième, malgré la fatigue accumulée, révisent attentivement »,
    quel est le sujet éloigné du verbe « révisent » ?
  reponse:
    options:
    - id: o1
      texte: Les élèves de cette classe de troisième
    - id: o2
      texte: la fatigue accumulée
    - id: o3
      texte: cette classe de troisième
    - id: o4
      texte: attentivement
    bonnes:
    - o1
  indices:
    relance: Pose la question « qui est-ce qui révise ? » pour retrouver le groupe nominal sujet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : prendre le groupe nominal situé juste devant le verbe pour son sujet, sans chercher qui accomplit
      réellement l''action.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre le complément du nom « classe » avec le nom noyau « élèves » qui régit l''accord
      du verbe.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre un adverbe complément circonstanciel de manière avec le sujet.'
  solution: Les élèves de cette classe de troisième. C'est la bonne réponse car c'est le groupe nominal qui fait l'action
    de réviser, bien qu'il soit séparé du verbe par un groupe de mots intercalé.
- id: nblm-dans-la-phrase-jules-parle-de-son-projet-2
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Jules parle de son projet à son professeur », comment distingue-t-on la fonction du groupe « de
    son projet » de celle d'un COD ?
  reponse:
    options:
    - id: o1
      texte: C'est un COI car il est relié au verbe par la préposition « de »
    - id: o2
      texte: C'est un COD car il complète directement le verbe
    - id: o3
      texte: C'est un complément circonstanciel de lieu
    - id: o4
      texte: C'est un attribut du sujet
    bonnes:
    - o1
  indices:
    relance: Observe la présence d'un petit mot de liaison (préposition) placé juste après le verbe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ignorer la préposition « de » et considérer à tort que le complément est directement rattaché
      au verbe.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre la préposition d''un COI avec un indice de provenance ou de lieu.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre un complément d''objet d''un verbe d''action avec un attribut relié par un verbe
      d''état.'
  solution: C'est un COI car il est relié au verbe par la préposition « de ». C'est exact, la présence de la préposition «
    de » indique que le complément est construit de façon indirecte (COI).
- id: nblm-dans-la-phrase-chaque-matin-les-oiseaux-3
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Chaque matin, les oiseaux chantent sous les fenêtres de la maison », quel groupe exerce la fonction
    de complément circonstanciel de lieu ?
  reponse:
    options:
    - id: o1
      texte: sous les fenêtres de la maison
    - id: o2
      texte: Chaque matin
    - id: o3
      texte: les oiseaux
    - id: o4
      texte: de la maison
    bonnes:
    - o1
  indices:
    relance: Cherche le groupe de mots qui répond à la question « où chantent les oiseaux ? ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre le complément circonstanciel de temps (quand ?) avec le complément circonstanciel
      de lieu (où ?).'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre le sujet de la phrase avec un complément circonstanciel.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : isoler un complément du nom « fenêtres » au lieu de prendre l''ensemble du groupe circonstanciel.'
  solution: 'sous les fenêtres de la maison. C''est correct : ce groupe indique l''endroit de l''action, répond à la question
    « où ? » et peut être déplacé ou supprimé.'
- id: nblm-parmi-les-phrases-suivantes-laquelle-app-4
  type: choix
  difficulte: 2
  enonce: Parmi les phrases suivantes, laquelle appartient au type interrogatif ?
