# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: emplois-du-subjonctif
version: 3
etat: verifiee
declencheurs:
- bien que + subjonctif
- je souhaite que tu
- pour que il faut le subjonctif
- il faut que tu sois
- quoique ou bien que
- à condition que verbe
- de crainte qu'il vienne
prerequis: []
essentiel: 'Le subjonctif est un mode. Il exprime une action seulement envisagée, souhaitée, voulue ou douteuse, et non un
  fait certain. On l''emploie surtout dans une proposition subordonnée introduite par « que ».


  Les principaux emplois, selon le sens de la principale.

  Le souhait ou le désir : « Je souhaite que tu réussisses. » « Je voudrais qu''il vienne. »

  Le commandement, l''ordre, la volonté : « Il faut que tu partes. » « J''exige qu''il se taise. »

  Le doute : « Je doute qu''il ait raison. » « Il est possible qu''elle soit là. »

  Le sentiment : « Je suis content qu''elle réussisse. » « Je crains qu''il pleuve. »

  Le souhait sans « que » de la principale : « Vive la République ! » « Qu''il entre ! » (ordre à la 3e personne).


  Après certaines conjonctions, le subjonctif est obligatoire.

  But : pour que, afin que.

  Concession : bien que, quoique.

  Condition : à condition que, pourvu que.

  Crainte : de crainte que, de peur que.

  Temps : avant que, jusqu''à ce que.

  Manière : sans que.


  Attention : après un verbe qui exprime une certitude, on emploie l''indicatif : « Je sais qu''il viendra. » « Il est certain
  qu''elle a raison. » Après « après que », on emploie l''indicatif.

  Après « espérer que », on emploie l''indicatif : « J''espère qu''il viendra. »


  Des formes utiles au présent : que je sois, que tu aies, qu''il fasse, qu''il aille, qu''il puisse, que nous soyons, qu''ils
  aient.


  Au brevet, on demande de conjuguer correctement au subjonctif après un verbe ou une conjonction, et d''expliquer pourquoi
  ce mode est employé.

  '
methode:
- Repère la proposition subordonnée et le mot qui l'introduit (que ou une conjonction).
- 'Regarde le sens de la principale : souhait, ordre, doute, sentiment ou certitude ?'
- Vérifie si la conjonction fait partie de celles qui exigent le subjonctif.
- Si le sens est une certitude, garde l'indicatif.
- Conjugue le verbe au subjonctif présent (que je sois, que tu aies, qu'il fasse...).
- 'Relis : le verbe est-il cohérent avec le sujet ?'
vocabulaire:
- terme: subjonctif
  definition: mode qui exprime une action envisagée, souhaitée, voulue ou douteuse
- terme: indicatif
  definition: mode qui présente une action comme certaine
- terme: proposition subordonnée
  definition: proposition qui dépend d'une proposition principale
- terme: conjonction de subordination
  definition: mot qui introduit une subordonnée (bien que, pour que, avant que)
- terme: proposition principale
  definition: proposition dont dépend la subordonnée
- terme: concession
  definition: idée d'opposition attendue (bien que...)
erreurs_frequentes:
- Mettre l'indicatif après bien que, pour que ou avant que.
- Employer le subjonctif après un verbe de certitude (je sais que, il est sûr que).
- Confondre les formes du subjonctif avec celles de l'indicatif (qu'il est / qu'il soit).
- Oublier le « que » qui accompagne le subjonctif dans la conjugaison.
exemple:
  enonce: Choisis le bon mode dans « Bien qu'il (pleuvoir), nous sommes sortis. »
  solution: '« Bien qu''il pleuve, nous sommes sortis. » : la conjonction « bien que » demande toujours le subjonctif, ici
    « pleuve ».'
exercices:
- id: apres-bien-que
  type: texte_court
  difficulte: 1
  enonce: 'Complète : « Bien qu''elle (être) fatiguée, elle continue à travailler. » (subjonctif présent ; écris seulement
    le verbe conjugué)'
  reponse:
    acceptees:
    - soit
    fautes_tolerees: 0
  indices:
    relance: '« bien que » est une conjonction qui demande toujours le même mode : lequel ?'
    methode: Le subjonctif présent de être, 3e personne du singulier, est une forme courte et irrégulière.
    etape: La forme correcte commence par « s » et se termine par « t ».
  pieges:
  - si:
      valeur: est
    relance: « est » est l'indicatif présent. La conjonction « bien que » demande toujours le subjonctif.
  solution: '« Bien qu''elle soit fatiguée » : « bien que » impose le subjonctif présent de être, soit.'
- id: souhait-ou-certitude
  type: choix
  difficulte: 1
  enonce: Dans quelle phrase le verbe de la subordonnée doit-il être au subjonctif ?
  reponse:
    options:
    - id: a
      texte: Je souhaite qu'il (réussir) son examen.
    - id: b
      texte: Je sais qu'il (réussir) son examen.
    - id: c
      texte: Je vois qu'il (réussir) son examen.
    bonnes:
    - a
  indices:
    relance: Cherche le verbe principal qui exprime un souhait, et non un fait constaté.
    methode: '« souhaiter » exprime un désir, pas un fait certain : il demande le subjonctif dans la subordonnée.'
    etape: '« savoir » et « voir » expriment une certitude ou un constat : ils gardent l''indicatif.'
  pieges:
  - si:
      contient:
      - b
    relance: '« savoir » exprime une certitude : la subordonnée reste à l''indicatif.'
  - si:
      contient:
      - c
    relance: '« voir » exprime un constat : la subordonnée reste à l''indicatif.'
  solution: '« Je souhaite qu''il réussisse » : « souhaiter » exprime un désir, donc la subordonnée est au subjonctif.'
- id: conjonctions-subjonctif
  type: association
  difficulte: 2
  enonce: Associe chaque conjonction au mode qu'elle demande le plus souvent dans la subordonnée.
  reponse:
    gauche:
    - id: a
      texte: pour que
    - id: b
      texte: parce que
    - id: c
      texte: avant que
    droite:
    - id: x
      texte: subjonctif
    - id: y
      texte: indicatif
    paires:
      a: x
      b: y
      c: x
  indices:
    relance: « parce que » exprime une cause certaine. Les autres expriment un but ou une antériorité incertaine.
    methode: '« pour que » exprime un but, « avant que » une antériorité non réalisée : les deux demandent le subjonctif.'
    etape: Classe d'abord « parce que » à part, car il exprime une cause constatée.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie laquelle des trois conjonctions exprime un fait certain.
  - si:
      diagnostic: associations_fausses
    relance: 'Repense au sens de chaque conjonction : exprime-t-elle un but, une antériorité, ou une cause déjà réalisée ?'
  solution: « pour que » et « avant que » demandent le subjonctif (but, antériorité incertaine) ; « parce que » demande l'indicatif
    (cause certaine).
- id: doute-subjonctif
  type: choix
  difficulte: 3
  enonce: Dans « Je doute qu'il (avoir) raison. », pourquoi faut-il le subjonctif ?
  reponse:
    options:
    - id: a
      texte: parce que « douter » exprime une incertitude, pas un fait constaté
    - id: b
      texte: parce que le sujet de la principale est je
    - id: c
      texte: parce que le verbe avoir est irrégulier
    bonnes:
    - a
  indices:
    relance: Le verbe « douter » exprime-t-il une certitude ou une incertitude ?
    methode: 'Le doute est l''un des emplois principaux du subjonctif : le fait n''est pas présenté comme certain.'
    etape: « je doute que » place le fait dans l'incertitude, donc au subjonctif.
  pieges:
  - si:
      contient:
      - b
    relance: Le sujet de la principale n'a pas d'influence directe sur le mode de la subordonnée.
  - si:
      contient:
      - c
    relance: L'irrégularité du verbe n'explique pas le choix du subjonctif, c'est le sens de « douter ».
  solution: '« Je doute qu''il ait raison » : « douter » exprime une incertitude, un des emplois principaux du subjonctif.'
- id: nblm-quel-mode-verbal-doit-on-utiliser-dans-u-1
  type: choix
  difficulte: 2
  enonce: Quel mode verbal doit-on utiliser dans une proposition subordonnée introduite par une formule de souhait comme «
    Je souhaite que tu... » ?
  reponse:
    options:
    - id: o1
      texte: Le subjonctif
    - id: o2
      texte: L'indicatif
    - id: o3
      texte: Le conditionnel
    - id: o4
      texte: L'impératif
    bonnes:
    - o1
  indices:
    relance: Pense au mode qui présente une action comme désirée ou envisagée, et non comme un fait certain.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : l''indicatif s''utilise pour exprimer des faits certains ou réels, pas un souhait simplement
      envisagé.'
  - si:
      contient:
      - o4
    relance: 'Erreur de confusion : l''impératif s''emploie pour donner un ordre direct, sans subordonnée introduite par «
      que ».'
  solution: 'Le subjonctif. C''est exact : les verbes exprimant un souhait ou un désir exigent l''emploi du subjonctif dans
    la subordonnée.'
- id: nblm-quelle-est-la-forme-correcte-du-verbe-ve-2
  type: choix
  difficulte: 2
  enonce: 'Quelle est la forme correcte du verbe « venir » dans la phrase : « Bien qu''il ___ tard, il assiste à la réunion.
    » ?'
  reponse:
    options:
    - id: o1
      texte: vienne
    - id: o2
      texte: vient
    - id: o3
      texte: viendra
    - id: o4
      texte: venait
    bonnes:
    - o1
  indices:
    relance: Repère la conjonction « bien que » et rappelle-toi quel mode elle exige obligatoirement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : utiliser l''indicatif « vient » après « bien que », alors que cette conjonction impose le subjonctif.'
  - si:
      contient:
      - o3
    relance: 'Erreur d''emploi : le futur de l''indicatif ne convient pas après une conjonction comme « bien que ».'
  - si:
      contient:
      - o4
    relance: 'Erreur de mode : l''imparfait de l''indicatif ne remplace pas le subjonctif requis par « bien que ».'
  solution: 'vienne. C''est exact : la conjonction de subordination « bien que » exige toujours l''emploi du subjonctif.'
- id: nblm-dans-la-phrase-il-revise-regulierement-p-3
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Il révise régulièrement pour que son élève ___ de bons résultats », comment faut-il conjuguer le
    verbe « avoir » ?
  reponse:
    options:
    - id: o1
      texte: ait
    - id: o2
      texte: a
    - id: o3
      texte: aura
    - id: o4
      texte: aurait
    bonnes:
    - o1
  indices:
    relance: Observe la conjonction de but « pour que » qui impose un mode spécifique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : employer l''indicatif présent « a » au lieu du subjonctif après « pour que ».'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : mettre le futur de l''indicatif « aura », alors que « pour que » impose le subjonctif.'
  solution: 'ait. C''est exact : la conjonction de but « pour que » exige l''emploi du subjonctif (« ait »).'
- id: nblm-parmi-les-expressions-suivantes-laquelle-4
  type: choix
  difficulte: 2
  enonce: Parmi les expressions suivantes, laquelle doit être suivie du subjonctif dans la proposition subordonnée ?
  reponse:
    options:
    - id: o1
      texte: Je doute que...
    - id: o2
      texte: Je sais que...
    - id: o3
      texte: Je suis sûr que...
    - id: o4
      texte: Il est certain que...
    bonnes:
    - o1
  indices:
    relance: Cherche l'expression qui indique une incertitude plutôt qu'un fait certain.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le verbe « savoir » exprime un fait certain et exige donc l''indicatif.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la certitude (« je suis sûr que ») appelle l''indicatif, pas le subjonctif.'
  - si:
      contient:
      - o4
    relance: 'Erreur d''analyse : une tournure affirmant une certitude est suivie de l''indicatif.'
  solution: 'Je doute que. C''est exact : le verbe exprimant un doute (« je doute que ») demande l''emploi du subjonctif.'
- id: nblm-quelle-valeur-du-subjonctif-est-illustre-5
  type: choix
  difficulte: 2
  enonce: 'Quelle valeur du subjonctif est illustrée par l''expression de l''obligation dans : « Pour réussir, il faut que
    tu apprennes ta leçon » ?'
  reponse:
    options:
    - id: o1
      texte: Le commandement ou la volonté
    - id: o2
      texte: La certitude constatée
    - id: o3
      texte: L'hypothèse irréelle du passé
    - id: o4
      texte: L'action achevée et bornée
    bonnes:
    - o1
  indices:
    relance: Interprète la formule impersonnelle d'obligation « il faut que ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de sens : le subjonctif n''exprime pas un fait certain ou constaté, qui relève de l''indicatif.'
  - si:
      contient:
      - o3
    relance: 'Erreur d''interprétation : l''obligation au présent « il faut que » ne constitue pas une hypothèse passée.'
  - si:
      contient:
      - o4
    relance: 'Erreur de catégorie : l''aspect accompli/borné concerne l''étude des temps, pas la valeur modale de l''obligation.'
  solution: 'Le commandement ou la volonté. C''est exact : la formule « il faut que » exprime une volonté, une nécessité ou
    un commandement suivi du subjonctif.'
- id: nblm-quelles-sont-les-deux-conjonctions-de-su-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux conjonctions de subordination qui demandent toujours l'emploi du subjonctif ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Bien que
    - id: o2
      texte: Pour que
    - id: o3
      texte: Parce que
    - id: o4
      texte: Pendant que
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne la conjonction de concession et la conjonction de but qui imposent ce mode.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « parce que » exprime une cause certaine et s''emploie avec l''indicatif.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : « pendant que » exprime la simultanéité dans le temps et demande l''indicatif.'
  solution: 'Bien que ; Pour que. C''est exact : « bien que » est une conjonction de concession exigeant le subjonctif.'
- id: nblm-complete-la-phrase-avec-le-verbe-reussir-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase avec le verbe « réussir » conjugué au subjonctif présent : « Je souhaite que tu ___ ton évaluation
    de français. »'
  reponse:
    acceptees:
    - réussisses
    fautes_tolerees: 1
  indices:
    relance: Accorde le verbe au subjonctif présent avec la deuxième personne du singulier (tu).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'réussisses. Après l''expression d''un souhait (« je souhaite que »), le verbe « réussir » se conjugue au subjonctif
    présent à la 2e personne du singulier : « réussisses ».'
- id: nblm-quel-mode-verbal-faut-il-obligatoirement-8
  type: texte_court
  difficulte: 1
  enonce: Quel mode verbal faut-il obligatoirement employer dans la subordonnée après l'expression d'obligation « il faut
    que » ?
  reponse:
    acceptees:
    - subjonctif
    fautes_tolerees: 1
  indices:
    relance: Donne le nom du mode étudié dans cette leçon, exprimant le doute, la volonté ou le souhait.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: subjonctif. L'expression de l'obligation ou du commandement (« il faut que ») exige le mode subjonctif.
- id: apres-pour-que
  type: choix
  difficulte: 1
  enonce: Quelle phrase est correcte ?
  reponse:
    options:
    - id: a
      texte: Je parle doucement pour que tu comprennes.
    - id: b
      texte: Je parle doucement pour que tu comprends.
    - id: c
      texte: Je parle doucement pour que tu comprendras.
    - id: d
      texte: Je parle doucement pour que tu comprenais.
    bonnes:
    - a
  indices:
    relance: 'La conjonction « pour que » exprime un but : quel mode demande-t-elle ?'
    methode: Après « pour que », on emploie le subjonctif. Repère la forme qui n'est ni du présent, ni du futur, ni de l'imparfait
      de l'indicatif.
    etape: Au subjonctif présent, la terminaison de « tu » ajoute un s, comme pour « tu prennes ».
  pieges:
  - si:
      contient:
      - b
    relance: C'est une forme de l'indicatif présent. Après « pour que », il faut le subjonctif.
  - si:
      contient:
      - c
    relance: Le futur est un temps de l'indicatif, or « pour que » demande le subjonctif.
  - si:
      contient:
      - d
    relance: L'imparfait est aussi un temps de l'indicatif. Cherche une forme de subjonctif.
  solution: '« pour que » est suivi du subjonctif : « pour que tu comprennes ».'
- id: avoir-subjonctif-il-faut
  type: texte_court
  difficulte: 2
  enonce: 'Complète : « Il faut que nous (avoir) du courage. » (subjonctif présent ; écris seulement le verbe conjugué)'
  reponse:
    acceptees:
    - ayons
    fautes_tolerees: 0
  indices:
    relance: '« Il faut que » exprime une volonté : le verbe se met au subjonctif.'
    methode: 'Au subjonctif présent, « avoir » a un radical particulier : que j''aie, que tu aies, qu''il ait, que nous...'
    etape: 'Le radical change : il ne ressemble ni à « av- » ni à « a- ». Termine par la terminaison habituelle de « nous
      ».'
  pieges:
  - si:
      valeur: avons
    relance: C'est la forme de l'indicatif présent. Après « il faut que », il faut le subjonctif.
  solution: 'Après « il faut que », subjonctif présent d''« avoir » à la 1re personne du pluriel : « il faut que nous ayons
    du courage ».'
- id: expliquer-mode
  type: ouverte
  difficulte: 3
  enonce: Écris deux phrases. La première contient « bien que » ou « à condition que » et un verbe au subjonctif. La seconde
    contient « je suis certain que » suivi d'un verbe à l'indicatif. Explique pourquoi le mode change.
  criteres:
  - La première phrase emploie une conjonction qui exige le subjonctif avec un verbe correctement conjugué.
  - La seconde phrase emploie l'indicatif après un verbe de certitude.
  - L'élève explique que le subjonctif marque une idée envisagée ou voulue et l'indicatif un fait certain.
  indices:
    relance: Pour la première phrase, choisis une conjonction qui exprime une concession ou une condition.
    methode: Conjugue le verbe au subjonctif après la conjonction. Dans la seconde phrase, un fait certain demande l'indicatif.
    etape: Commence par « Bien qu'il... » et cherche la forme du subjonctif présent du verbe choisi.
  solution: 'Exemples : « Bien qu''il pleuve, nous sortons. » (subjonctif : la pluie est une opposition.) « Je suis certain
    qu''il viendra. » (indicatif : fait certain.) Le subjonctif marque une idée envisagée ou voulue, l''indicatif un fait
    présenté comme sûr.'
