format: 2
notion: transposition-oral-ecrit
version: 1
etat: verifiee
declencheurs:
- rapporter les paroles de quelqu'un
- transformer une phrase parlée en phrase écrite
- discours direct ou indirect
- passer de l'oral à l'écrit
prerequis: []
essentiel: 'L''oral et l''écrit ne suivent pas les mêmes règles. À l''oral, on utilise souvent des phrases incomplètes, des

  répétitions, un vocabulaire familier. À l''écrit, on attend des phrases complètes et un vocabulaire plus soutenu.

  Transposer, c''est passer d''une forme à l''autre : réécrire à l''écrit un énoncé oral en le rendant plus correct

  et plus clair, ou inversement adapter un texte écrit pour le dire à l''oral.


  Insérer des paroles rapportées dans un texte se fait de plusieurs façons. Le discours direct rapporte les

  paroles exactes, entre guillemets, avec un verbe introducteur (il dit : « Je pars »). Le discours indirect

  rapporte le sens des paroles, sans guillemets, avec une subordonnée (il dit qu''il part). Le discours indirect

  libre mélange les deux : il rapporte les pensées ou les paroles d''un personnage sans guillemets ni verbe

  introducteur, en gardant le style parlé du personnage à l''intérieur du récit.


  À l''oral scolaire (exposé, débat), on peut utiliser un niveau de langue plus soutenu que dans une conversation

  familière, avec un vocabulaire plus précis.

  '
methode:
- Repérer si un énoncé est à l'oral (phrases incomplètes, familier) ou à l'écrit (phrases complètes, plus soutenu).
- Pour transposer à l'écrit, compléter les phrases incomplètes et remplacer le vocabulaire trop familier.
- Pour insérer des paroles rapportées, choisir le discours direct (guillemets, paroles exactes), le discours indirect (subordonnée,
  sens des paroles) ou le discours indirect libre (sans guillemets ni verbe introducteur).
- 'Repérer les marques du discours indirect libre : pas de guillemets, pas de verbe introducteur, mais le style du personnage
  est conservé.'
vocabulaire:
- terme: discours direct
  definition: rapporte les paroles exactes d'une personne, entre guillemets, avec un verbe introducteur
- terme: discours indirect
  definition: rapporte le sens des paroles d'une personne, sans guillemets, dans une subordonnée
- terme: discours indirect libre
  definition: rapporte les paroles ou pensées d'un personnage sans guillemets ni verbe introducteur, en gardant son style
erreurs_frequentes:
- Oublier de changer les temps et les pronoms quand on passe du discours direct au discours indirect.
- Mettre des guillemets à un discours indirect, qui n'en prend jamais.
- Confondre discours indirect (avec subordonnée) et discours indirect libre (sans marque grammaticale visible).
exemple:
  enonce: 'Transforme cette phrase de discours direct en discours indirect : « Elle a dit : "Je viendrai demain." »'
  solution: Elle a dit qu'elle viendrait le lendemain. (Le verbe introducteur reste, mais les guillemets disparaissent, le
    pronom et le temps du verbe changent, et « demain » devient « le lendemain » car on rapporte la parole plus tard.)
exercices:
- id: reconnaitre-discours-direct
  type: choix
  difficulte: 1
  enonce: Parmi ces phrases, laquelle est écrite au discours direct ?
  reponse:
    options:
    - id: a
      texte: 'Le professeur a dit : « Rangez vos affaires. »'
    - id: b
      texte: Le professeur a dit de ranger les affaires
    - id: c
      texte: Le professeur a demandé si les élèves avaient rangé leurs affaires
    - id: d
      texte: Les élèves ont rangé leurs affaires
    bonnes:
    - a
  indices:
    relance: Cherche la phrase qui contient des guillemets et rapporte les paroles exactes prononcées.
    methode: Le discours direct se reconnaît toujours à la présence de guillemets et d'un verbe introducteur suivi des deux-points.
    etape: Regarde quelle phrase contient des guillemets.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase rapporte le sens des paroles dans une subordonnée, sans guillemets : c''est du discours indirect,
      pas direct.'
  - si:
      contient:
      - c
    relance: Cette phrase rapporte une question de façon indirecte, sans guillemets. Cherche la phrase avec des guillemets.
  - si:
      contient:
      - d
    relance: Cette phrase ne rapporte aucune parole, elle décrit une action. Cherche la phrase avec des guillemets.
  solution: La phrase a est au discours direct car elle rapporte les paroles exactes entre guillemets, avec un verbe introducteur
    suivi des deux-points.
- id: mot-discours-indirect-libre
  type: texte_court
  difficulte: 3
  enonce: Quelle expression désigne la façon de rapporter les pensées ou paroles d'un personnage sans guillemets ni verbe
    introducteur, en gardant son style propre à l'intérieur du récit ?
  reponse:
    acceptees:
    - discours indirect libre
    fautes_tolerees: 2
  indices:
    relance: 'Ce n''est ni le discours direct (avec guillemets) ni le discours indirect classique (avec subordonnée et verbe
      introducteur) : c''est un mélange des deux, sans marque grammaticale visible.'
    methode: L'expression contient trois mots, le premier désigne la parole rapportée, le deuxième indique l'absence de guillemets,
      le troisième indique l'absence de marque grammaticale.
    etape: Les trois mots sont « discours », « indirect » et « libre ».
  pieges:
  - si:
      valeur: discours indirect
    relance: Le discours indirect classique utilise un verbe introducteur et une subordonnée. L'expression cherchée va plus
      loin, elle n'a ni guillemets ni verbe introducteur.
  solution: 'Le discours indirect libre : il rapporte les pensées ou paroles d''un personnage sans guillemets ni verbe introducteur,
    en gardant son style à l''intérieur du récit.'
- id: etapes-transposition-direct-indirect
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour transformer une phrase de discours direct en discours indirect.
  reponse:
    elements:
    - id: a
      texte: Je supprime les guillemets et le deux-points
    - id: b
      texte: J'ajoute une conjonction de subordination (que, si) après le verbe introducteur
    - id: c
      texte: Je change les pronoms personnels si nécessaire (je devient il ou elle)
    - id: d
      texte: J'adapte le temps du verbe et les indicateurs de temps si nécessaire
  indices:
    relance: Quelle est la toute première transformation à faire sur la phrase, avant de s'occuper des pronoms ?
    methode: On enlève d'abord la marque visible du discours direct (guillemets), puis on ajoute la subordination, puis on
      adapte les pronoms, puis les temps.
    etape: On commence toujours par supprimer les guillemets et le deux-points.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la transformation (supprimer les guillemets) et celle qui la ferme (adapter
      les temps).
  solution: On supprime d'abord les guillemets, puis on ajoute la conjonction de subordination, puis on change les pronoms,
    puis on adapte les temps et les indicateurs de temps.
- id: type-discours-exemple
  type: association
  difficulte: 3
  enonce: Relie chaque exemple à son type de discours rapporté.
  reponse:
    gauche:
    - id: a
      texte: 'Il a crié : « Attention, ça glisse ! »'
    - id: b
      texte: Il a crié qu'il fallait faire attention parce que ça glissait
    - id: c
      texte: Attention, ça glissait vraiment trop ici, pensa-t-elle en accélérant le pas
    droite:
    - id: x
      texte: Discours direct
    - id: y
      texte: Discours indirect
    - id: z
      texte: Discours indirect libre
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Repère la présence ou l'absence de guillemets, et la présence ou l'absence d'un verbe introducteur suivi d'une
      subordonnée.
    methode: Le discours direct a des guillemets, le discours indirect a une subordonnée sans guillemets, le discours indirect
      libre n'a ni guillemets ni subordination visible.
    etape: Commence par repérer la phrase avec des guillemets, c'est le discours direct.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la présence des guillemets et de la subordination dans chaque exemple.
  - si:
      diagnostic: associations_fausses
    relance: Repars de la phrase avec des guillemets (discours direct), puis distingue indirect et indirect libre.
  solution: La phrase avec guillemets est au discours direct. La phrase avec subordonnée sans guillemets est au discours indirect.
    La phrase sans guillemets ni subordination, qui garde le style parlé, est au discours indirect libre.
- id: nblm-quel-changement-essentiel-doit-on-effect-1
  type: choix
  difficulte: 2
  enonce: 'Quel changement essentiel doit-on effectuer pour transposer à l''écrit la phrase orale : « Ouais, chuis venu hier
    » ?'
  reponse:
    options:
    - id: o1
      texte: Oui, je suis venu hier.
    - id: o2
      texte: Ouais, je suis venu hier.
    - id: o3
      texte: Oui, chuis venu hier.
    - id: o4
      texte: Ouais, chuis venu hier.
    bonnes:
    - o1
  indices:
    relance: Pense au niveau de langue attendu à l'écrit et à l'élimination des contractions orales.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : conserver le terme familier « ouais » ne respecte pas le niveau de langue attendu à l''écrit.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : garder la contraction orale « chuis » au lieu de réécrire « je suis ».'
  - si:
      contient:
      - o4
    relance: 'Erreur : ne faire aucune modification conserve un niveau de langue familier propre à l''oral.'
  solution: 'Oui, je suis venu hier. C''est exact : à l''écrit, on rétablit la forme correcte « Oui » et « je suis » pour
    remplacer le vocabulaire familier et la contraction orale.'
- id: nblm-comment-se-caracterise-le-discours-indir-2
  type: choix
  difficulte: 2
  enonce: Comment se caractérise le discours indirect lorsque l'on rapporte les paroles de quelqu'un ?
  reponse:
    options:
    - id: o1
      texte: Il rapporte le sens des paroles sans guillemets, dans une proposition subordonnée.
    - id: o2
      texte: Il rapporte les paroles exactes entre guillemets avec un verbe introducteur.
    - id: o3
      texte: Il rapporte les paroles entre guillemets mais sans verbe introducteur.
    - id: o4
      texte: Il utilise des tirets et conserve la ponctuation expressive de l'oral.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'usage des guillemets et des propositions subordonnées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion fréquente : ceci est la définition du discours direct.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le discours indirect ne comporte jamais de guillemets.'
  - si:
      contient:
      - o4
    relance: 'Erreur : les tirets et la ponctuation expressive appartiennent au discours direct ou au dialogue.'
  solution: 'Il rapporte le sens des paroles sans guillemets, dans une proposition subordonnée. C''est la définition exacte
    : le discours indirect intègre les paroles dans une proposition subordonnée sans utiliser de guillemets.'
- id: nblm-si-l-on-transpose-la-phrase-de-discours-3
  type: choix
  difficulte: 2
  enonce: 'Si l''on transpose la phrase de discours direct « Elle a dit : "Je viendrai demain." » au discours indirect dans
    un récit au passé, quelle est la forme correcte ?'
  reponse:
    options:
    - id: o1
      texte: Elle a dit qu'elle viendrait le lendemain.
    - id: o2
      texte: Elle a dit qu'elle viendra demain.
    - id: o3
      texte: 'Elle a dit : qu''elle viendrait demain.'
    - id: o4
      texte: Elle a dit qu'je viendrais le lendemain.
    bonnes:
    - o1
  indices:
    relance: Pense aux modifications de temps, de pronom et de repère temporel lors du passage au passé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : oublier de modifier le temps du verbe et le repère temporel dans un récit au passé.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : conserver la ponctuation du discours direct (les deux-points) au discours indirect.'
  - si:
      contient:
      - o4
    relance: 'Erreur : conserver le pronom de la 1re personne au lieu de le transposer à la 3e personne.'
  solution: 'Elle a dit qu''elle viendrait le lendemain. C''est correct : les guillemets disparaissent, le pronom « je » devient
    « elle », le futur devient un conditionnel présent « viendrait », et « demain » devient « le lendemain ».'
- id: nblm-quelle-est-la-particularite-du-discours-4
  type: choix
  difficulte: 2
  enonce: Quelle est la particularité du discours indirect libre par rapport au discours indirect classique ?
  reponse:
    options:
    - id: o1
      texte: Il rapporte les paroles ou pensées d'un personnage sans guillemets ni verbe introducteur, en gardant son style
        parlé.
    - id: o2
      texte: Il exige l'emploi de guillemets et d'une subordonnée introduite par « que ».
    - id: o3
      texte: Il exige un niveau de langue toujours soutenu et supprime l'émotion du personnage.
    - id: o4
      texte: Il s'emploie uniquement à l'oral lors d'un exposé devant la classe.
    bonnes:
    - o1
  indices:
    relance: Cherche ce qui caractérise l'absence combinée de guillemets et de verbe introducteur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : les guillemets appartiennent au discours direct et la subordonnée introduite par « que » au discours
      indirect.'
  - si:
      contient:
      - o3
    relance: 'Faux : le discours indirect libre conserve la tonalité, l''émotion et les tournures propres au personnage.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le discours indirect libre est un procédé littéraire écrit.'
  solution: 'Il rapporte les paroles ou pensées d''un personnage sans guillemets ni verbe introducteur, en gardant son style
    parlé. C''est la définition exacte : le discours indirect libre s''insère dans le récit sans marqueur grammatical explicite
    tout en conservant l''expressivité de l''oral.'
- id: nblm-lors-d-un-oral-scolaire-expose-ou-compte-5
  type: choix
  difficulte: 2
  enonce: Lors d'un oral scolaire (exposé ou compte rendu), quel niveau de langue est-il recommandé d'adopter ?
  reponse:
    options:
    - id: o1
      texte: Un niveau de langue courant ou soutenu, avec un vocabulaire précis, en excluant le registre familier.
    - id: o2
      texte: Le niveau familier pour paraître plus naturel devant ses camarades.
    - id: o3
      texte: Le langage SMS abrégé pour gagner du temps lors de la prise de parole.
    - id: o4
      texte: Le discours indirect libre à chaque phrase pour supprimer les verbes introducteurs.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au niveau de langue adapté à une présentation évaluée en classe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la situation d''évaluation orale scolaire exige de dépasser le registre familier.'
  - si:
      contient:
      - o3
    relance: 'Faux : le style abréviatif de type SMS n''est pas un registre acceptable à l''oral scolaire.'
  - si:
      contient:
      - o4
    relance: 'Confusion : le discours indirect libre est un procédé littéraire d''écriture, pas un niveau de langue orale.'
  solution: 'Un niveau de langue courant ou soutenu, avec un vocabulaire précis, en excluant le registre familier. C''est
    exact : les attentes officielles indiquent qu''il faut exclure le registre familier au profit d''une langue maîtrisée
    et d''un lexique précis.'
- id: nblm-quelles-sont-les-deux-erreurs-les-plus-f-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux erreurs les plus fréquentes commises lors de la transposition du discours direct au discours
    indirect ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Conserver des guillemets dans la phrase au discours indirect.
    - id: o2
      texte: Oublier de modifier les temps verbaux et les pronoms personnels.
    - id: o3
      texte: Remplacer un mot familier par un terme de niveau courant.
    - id: o4
      texte: Conserver un verbe introducteur avant la proposition subordonnée.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie la marque de ponctuation à supprimer absolument et les éléments grammaticaux à adapter.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Ce n''est pas une erreur : c''est au contraire une modification tout à fait correcte lors d''une transposition.'
  - si:
      contient:
      - o4
    relance: 'Ce n''est pas une erreur : le discours indirect s''articule généralement autour d''un verbe introducteur suivi
      d''une subordonnée.'
  solution: 'Conserver des guillemets dans la phrase au discours indirect ; Oublier de modifier les temps verbaux et les pronoms
    personnels. C''est bien une erreur fréquente : le discours indirect ne comporte jamais de guillemets.'
- id: nblm-comment-appelle-t-on-le-mode-de-paroles-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le mode de paroles rapportées qui reproduit les paroles exactes d'une personne, entre guillemets
    et avec un verbe introducteur ?
  reponse:
    acceptees:
    - discours direct
    fautes_tolerees: 1
  indices:
    relance: Pense au nom de la forme qui cite directement les paroles entre guillemets.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: discours direct. Le discours direct est le terme exact qui désigne la restitution fidèle des paroles entre guillemets.
- id: nblm-quel-signe-de-ponctuation-encadrant-les-8
  type: texte_court
  difficulte: 1
  enonce: Quel signe de ponctuation encadrant les paroles au discours direct doit obligatoirement être supprimé au discours
    indirect ?
  reponse:
    acceptees:
    - guillemets
    fautes_tolerees: 1
  indices:
    relance: Il s'agit des signes de ponctuation qui entourent la citation exacte des paroles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: guillemets. Les guillemets sont réservés au discours direct et doivent disparaître lors de la transposition au
    discours indirect.
