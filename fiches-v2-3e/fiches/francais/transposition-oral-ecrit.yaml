# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: transposition-oral-ecrit
version: 2
etat: generee
declencheurs:
- rapporter les paroles de quelqu'un
- transformer une phrase parlée en phrase écrite
- discours direct ou indirect
- passer de l'oral à l'écrit
- reformuler des paroles au passé
- réécrire un dialogue en récit
- supprimer les guillemets d'un dialogue
- langage familier à l'écrit
prerequis: []
essentiel: |-
  À l'oral, on parle avec le ton, les gestes et le contexte. On fait des phrases incomplètes (« Viens ! »), des répétitions, des hésitations (« euh »), des mots familiers (« un truc », « ça craint »). L'interlocuteur peut réagir tout de suite.

  À l'écrit, le lecteur n'a que le texte. On attend des phrases complètes, une ponctuation soignée, des mots précis et une syntaxe correcte.

  Transposer, c'est passer de l'un à l'autre. De l'oral à l'écrit : on complète les phrases, on supprime les hésitations et les répétitions inutiles, on remplace le vocabulaire familier par un vocabulaire courant ou soutenu. De l'écrit à l'oral : on raccourcit, on rend le texte facile à suivre pour un auditeur et on le dit avec le ton.

  Rapporter des paroles dans un texte se fait de trois façons.
  1) Le discours direct rapporte les paroles exactes, entre guillemets, avec un verbe introducteur et le deux-points. Il a dit : « Je pars demain. »
  2) Le discours indirect rapporte le sens des paroles dans une subordonnée, sans guillemets. Il a dit qu'il partait le lendemain.
  3) Le discours indirect libre n'a ni guillemets, ni verbe introducteur, ni subordonnée. Les paroles ou les pensées du personnage se mêlent au récit et gardent son style (exclamations, questions). Il regardait la pluie. Quelle journée gâchée !

  Passer du direct à l'indirect change plusieurs choses, surtout quand le verbe introducteur est au passé :
  - les pronoms et les possessifs : « je » devient « il », « mon » devient « son » ;
  - les temps : présent → imparfait, futur → conditionnel, passé composé → plus-que-parfait ;
  - les repères de temps et de lieu : demain → le lendemain, hier → la veille, aujourd'hui → ce jour-là, ici → là ;
  - la forme de la phrase : une question devient une subordonnée (il demandait si...), un ordre devient « de » + infinitif (il m'a dit de partir).

  À l'oral scolaire (exposé, débat), on emploie un niveau de langue plus soutenu qu'entre amis : vocabulaire précis, phrases construites (« je considère que » plutôt que « moi je trouve que c'est nul »).

  Ce qu'on attend au brevet : reconnaître le type de discours rapporté, transformer correctement un passage, et insérer des paroles rapportées dans un récit.
methode:
- Repérer si un énoncé est oral (phrases incomplètes, hésitations, mots familiers) ou écrit (phrases complètes, vocabulaire précis).
- Pour transposer de l'oral à l'écrit, compléter les phrases, supprimer hésitations et répétitions, remplacer le vocabulaire familier.
- Pour rapporter des paroles, choisir le discours direct (guillemets, deux-points), indirect (subordonnée) ou indirect libre (ni guillemets ni verbe introducteur).
- 'Du direct à l''indirect : supprimer guillemets et deux-points, ajouter « que » ou « si », changer les pronoms.'
- Adapter ensuite les temps (présent → imparfait, futur → conditionnel) et les repères (demain → le lendemain).
- 'Se relire : la phrase est-elle complète, correcte et au bon niveau de langue ?'
vocabulaire:
- terme: discours direct
  definition: rapporte les paroles exactes d'une personne, entre guillemets, avec un verbe introducteur
- terme: discours indirect
  definition: rapporte le sens des paroles d'une personne, sans guillemets, dans une subordonnée
- terme: discours indirect libre
  definition: rapporte les paroles ou pensées d'un personnage sans guillemets ni verbe introducteur, en gardant son style
- terme: verbe introducteur
  definition: verbe (dire, demander, crier...) qui annonce les paroles rapportées
- terme: niveau de langue
  definition: 'manière de parler ou d''écrire : familier, courant ou soutenu'
- terme: transposition
  definition: passage d'un énoncé de l'oral à l'écrit, ou de l'écrit à l'oral, en adaptant la forme
- terme: subordonnée
  definition: proposition qui dépend d'un verbe principal, introduite ici par « que » ou « si »
erreurs_frequentes:
- Oublier de changer les temps et les pronoms quand on passe du discours direct au discours indirect.
- Mettre des guillemets à un discours indirect, qui n'en prend jamais.
- Confondre discours indirect (avec subordonnée) et discours indirect libre (sans marque grammaticale visible).
- Garder « demain » ou « ici » au discours indirect au lieu de « le lendemain » ou « là ».
- Recopier tels quels des mots familiers de l'oral dans un texte écrit.
exemple:
  enonce: 'Transforme cette phrase de discours direct en discours indirect : « Elle a dit : "Je viendrai demain." »'
  solution: Elle a dit qu'elle viendrait le lendemain. (Le verbe introducteur reste, mais les guillemets disparaissent, le pronom et le temps du verbe changent, et « demain » devient « le lendemain » car on rapporte la parole plus tard.)
exercices:
- id: reconnaitre-discours-direct
  type: choix
  difficulte: 1
  enonce: Parmi ces phrases, laquelle est écrite au discours direct ?
  reponse:
    options:
    - id: a
      texte: 'Le professeur a dit : « Rangez vos affaires. »'
    - id: b
      texte: Le professeur a dit de ranger les affaires
    - id: c
      texte: Le professeur a demandé si les élèves avaient rangé leurs affaires
    - id: d
      texte: Les élèves ont rangé leurs affaires
    bonnes:
    - a
  indices:
    relance: Cherche la phrase qui contient des guillemets et rapporte les paroles exactes prononcées.
    methode: Le discours direct se reconnaît toujours à la présence de guillemets et d'un verbe introducteur suivi des deux-points.
    etape: Regarde quelle phrase contient des guillemets.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase rapporte le sens des paroles dans une subordonnée, sans guillemets : c''est du discours indirect, pas direct.'
  - si:
      contient:
      - c
    relance: Cette phrase rapporte une question de façon indirecte, sans guillemets. Cherche la phrase avec des guillemets.
  - si:
      contient:
      - d
    relance: Cette phrase ne rapporte aucune parole, elle décrit une action. Cherche la phrase avec des guillemets.
  solution: La phrase a est au discours direct car elle rapporte les paroles exactes entre guillemets, avec un verbe introducteur suivi des deux-points.
- id: mot-discours-indirect-libre
  type: texte_court
  difficulte: 3
  enonce: Quelle expression désigne la façon de rapporter les pensées ou paroles d'un personnage sans guillemets ni verbe introducteur, en gardant son style propre à l'intérieur du récit ?
  reponse:
    acceptees:
    - discours indirect libre
    fautes_tolerees: 2
  indices:
    relance: 'Ce n''est ni le discours direct (avec guillemets) ni le discours indirect classique (avec subordonnée et verbe introducteur) : c''est un mélange des deux, sans marque grammaticale visible.'
    methode: L'expression contient trois mots, le premier désigne la parole rapportée, le deuxième indique l'absence de guillemets, le troisième indique l'absence de marque grammaticale.
    etape: Les trois mots sont « discours », « indirect » et « libre ».
  pieges:
  - si:
      valeur: discours indirect
    relance: Le discours indirect classique utilise un verbe introducteur et une subordonnée. L'expression cherchée va plus loin, elle n'a ni guillemets ni verbe introducteur.
  solution: 'Le discours indirect libre : il rapporte les pensées ou paroles d''un personnage sans guillemets ni verbe introducteur, en gardant son style à l''intérieur du récit.'
- id: etapes-transposition-direct-indirect
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour transformer une phrase de discours direct en discours indirect.
  reponse:
    elements:
    - id: a
      texte: Je supprime les guillemets et le deux-points
    - id: b
      texte: J'ajoute une conjonction de subordination (que, si) après le verbe introducteur
    - id: c
      texte: Je change les pronoms personnels si nécessaire (je devient il ou elle)
    - id: d
      texte: J'adapte le temps du verbe et les indicateurs de temps si nécessaire
  indices:
    relance: Quelle est la toute première transformation à faire sur la phrase, avant de s'occuper des pronoms ?
    methode: On enlève d'abord la marque visible du discours direct (guillemets), puis on ajoute la subordination, puis on adapte les pronoms, puis les temps.
    etape: On commence toujours par supprimer les guillemets et le deux-points.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la transformation (supprimer les guillemets) et celle qui la ferme (adapter les temps).
  solution: On supprime d'abord les guillemets, puis on ajoute la conjonction de subordination, puis on change les pronoms, puis on adapte les temps et les indicateurs de temps.
- id: type-discours-exemple
  type: association
  difficulte: 3
  enonce: Relie chaque exemple à son type de discours rapporté.
  reponse:
    gauche:
    - id: a
      texte: 'Il a crié : « Attention, ça glisse ! »'
    - id: b
      texte: Il a crié qu'il fallait faire attention parce que ça glissait
    - id: c
      texte: Attention, ça glissait vraiment trop ici, pensa-t-elle en accélérant le pas
    droite:
    - id: x
      texte: Discours direct
    - id: y
      texte: Discours indirect
    - id: z
      texte: Discours indirect libre
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Repère la présence ou l'absence de guillemets, et la présence ou l'absence d'un verbe introducteur suivi d'une subordonnée.
    methode: Le discours direct a des guillemets, le discours indirect a une subordonnée sans guillemets, le discours indirect libre n'a ni guillemets ni subordination visible.
    etape: Commence par repérer la phrase avec des guillemets, c'est le discours direct.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la présence des guillemets et de la subordination dans chaque exemple.
  - si:
      diagnostic: associations_fausses
    relance: Repars de la phrase avec des guillemets (discours direct), puis distingue indirect et indirect libre.
  solution: La phrase avec guillemets est au discours direct. La phrase avec subordonnée sans guillemets est au discours indirect. La phrase sans guillemets ni subordination, qui garde le style parlé, est au discours indirect libre.
- id: temps-discours-indirect
  type: texte_court
  difficulte: 2
  enonce: 'Complète avec le verbe qui convient. Discours direct : « Nous partons demain. » Discours indirect : Il a annoncé qu''ils ___ le lendemain.'
  reponse:
    acceptees:
    - partaient
    fautes_tolerees: 1
  indices:
    relance: 'Le verbe introducteur (« a annoncé ») est au passé : le verbe de la subordonnée doit s''accorder avec ce passé.'
    methode: Après un verbe introducteur au passé, le présent du discours direct devient un imparfait.
    etape: 'Le verbe est « partir » : mets-le à l''imparfait, 3e personne du pluriel.'
  pieges:
  - si:
      valeur: partent
    relance: 'Tu as gardé le présent. Quand le verbe introducteur est au passé, le temps change : lequel remplace le présent ?'
  - si:
      valeur: partiront
    relance: Le futur est un temps du discours direct. Ici, après un verbe introducteur au passé, quel temps faut-il ?
  solution: 'Le présent « partons » devient un imparfait après le verbe introducteur au passé : « Il a annoncé qu''ils partaient le lendemain. »'
- id: reperes-temps-indirect
  type: association
  difficulte: 2
  enonce: Au discours indirect (verbe introducteur au passé), relie chaque repère du discours direct à son équivalent.
  reponse:
    gauche:
    - id: a
      texte: demain
    - id: b
      texte: hier
    - id: c
      texte: aujourd'hui
    - id: d
      texte: ici
    droite:
    - id: w
      texte: le lendemain
    - id: x
      texte: la veille
    - id: y
      texte: ce jour-là
    - id: z
      texte: là
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Demande-toi si le repère renvoie à un moment après ou avant celui où l'on parle.
    methode: Au discours indirect, on ne se repère plus par rapport au moment où l'on parle, mais par rapport au moment de la parole rapportée.
    etape: Commence par « ici », le seul repère de lieu.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux repères qui parlent du passé et de l'avenir proche.
  - si:
      diagnostic: associations_fausses
    relance: Repars du repère de lieu, puis place le futur et le passé.
  solution: demain → le lendemain ; hier → la veille ; aujourd'hui → ce jour-là ; ici → là.
- id: registre-oral-scolaire
  type: choix
  difficulte: 1
  enonce: Pendant un exposé devant la classe, quelle formulation convient le mieux à l'oral scolaire ?
  reponse:
    options:
    - id: a
      texte: Ce truc, franchement, c'est nul, quoi.
    - id: b
      texte: Cette proposition me paraît peu convaincante.
    - id: c
      texte: Bof, j'sais pas trop, c'est pas terrible.
    - id: d
      texte: Ben moi, j'dis que ça craint.
    bonnes:
    - b
  indices:
    relance: Cherche la phrase complète, au vocabulaire précis, sans mots de conversation.
    methode: L'oral scolaire demande un niveau de langue plus soutenu que la conversation entre amis.
    etape: Élimine les phrases qui contiennent « quoi », « bof » ou « ben ».
  pieges:
  - si:
      contient:
      - a
    relance: « Truc » et « quoi » appartiennent à la conversation familière. Cherche un vocabulaire plus précis.
  - si:
      contient:
      - c
    relance: Cette phrase est hésitante et familière. À l'oral scolaire, on cherche une formulation construite.
  - si:
      contient:
      - d
    relance: « Ben » et « ça craint » sont familiers. Quelle phrase est plus soutenue ?
  solution: 'La phrase b est complète, construite et son vocabulaire est soutenu : elle convient à l''oral scolaire.'
- id: developpement-dialogue-recit
  type: ouverte
  difficulte: 3
  enonce: 'Voici un dialogue oral : — Tu viens au cinéma demain ? — Ben non, j''peux pas, j''ai un contrôle. Réécris-le à l''écrit, dans un court récit, en utilisant du discours indirect pour la première réplique, du discours direct pour la seconde, puis une phrase de discours indirect libre exprimant la déception du personnage qui a invité.'
  criteres:
  - L'élève transforme correctement la première réplique en discours indirect (pronoms, temps et repères adaptés, pas de guillemets).
  - L'élève rapporte la seconde réplique au discours direct (guillemets, verbe introducteur, deux-points) dans une langue écrite correcte, sans mots familiers.
  - L'élève écrit une phrase de discours indirect libre (ni guillemets ni verbe introducteur, ton du personnage) et le récit est cohérent.
  indices:
    relance: Quelle réplique doit rester entre guillemets, laquelle doit être intégrée à une phrase ?
    methode: 'Traite chaque partie séparément : indirect, direct, puis indirect libre.'
    etape: Pour l'indirect libre, écris directement la pensée du personnage dans le récit, sans « pensa-t-il ».
  solution: 'Exemple : Léa a proposé à Tom d''aller au cinéma le lendemain. Tom a répondu : « Je ne peux pas, j''ai un contrôle. » Léa soupira. Encore un rendez-vous manqué ! Elle aurait tant voulu cette sortie. (Réplique 1 au discours indirect avec « le lendemain » ; réplique 2 au discours direct ; phrases finales au discours indirect libre.)'
