format: 2
notion: structuration-du-texte-argumentatif
version: 1
etat: verifiee
declencheurs:
- convaincre ou persuader
- organiser un paragraphe argumenté
- donner un exemple pour appuyer une idée
- structurer mes arguments
prerequis: []
essentiel: 'Un texte argumentatif défend une opinion à l''aide d''arguments et d''exemples. On distingue deux façons d''agir
  sur

  un lecteur ou un auditeur : convaincre s''adresse à la raison, avec des arguments logiques ; persuader s''adresse

  aux émotions, avec des images fortes ou un vocabulaire qui touche les sentiments. Un bon texte argumentatif utilise

  souvent les deux, mais il faut savoir les distinguer.


  Un paragraphe argumenté bien structuré suit un ordre logique : on annonce l''idée principale (l''argument), puis

  on l''explique, puis on l''illustre avec un exemple précis, puis on peut ajouter une phrase de transition vers l''idée

  suivante. La modalisation permet de nuancer une affirmation avec des mots comme « sans doute », « certainement »,

  « il semble que », pour montrer le degré de certitude de celui qui parle.


  Pour donner de la cohérence à un texte argumentatif, on utilise des connecteurs logiques (d''abord, ensuite,

  cependant, donc, en effet) qui montrent les liens entre les idées.

  '
methode:
- Identifier l'idée principale (l'argument) que l'on veut défendre.
- Choisir si l'on veut convaincre (arguments logiques) ou persuader (appel aux émotions), ou combiner les deux.
- Illustrer chaque argument par un exemple précis et concret.
- Utiliser des connecteurs logiques pour relier les arguments entre eux.
- Nuancer certaines affirmations avec des modalisateurs si l'on n'est pas totalement certain.
vocabulaire:
- terme: convaincre
  definition: s'adresser à la raison du lecteur avec des arguments logiques
- terme: persuader
  definition: s'adresser aux émotions du lecteur pour l'amener à partager une opinion
- terme: modalisateur
  definition: mot ou expression qui montre le degré de certitude de celui qui parle (sans doute, certainement)
erreurs_frequentes:
- Donner un argument sans aucun exemple pour l'illustrer.
- Confondre convaincre (la raison) et persuader (les émotions).
- Enchaîner les arguments sans connecteurs logiques, ce qui rend le texte confus.
exemple:
  enonce: 'Écris un exemple concret pour illustrer cet argument : « Le sport en équipe apprend à coopérer. »'
  solution: Par exemple, lors d'un match de basket, chaque joueur doit faire des passes à ses coéquipiers et accepter de ne
    pas toujours marquer lui-même, pour que l'équipe gagne ensemble.
exercices:
- id: convaincre-ou-persuader
  type: choix
  difficulte: 1
  enonce: 'Une phrase dit : « Chaque année, des milliers d''enfants souffrent en silence à cause du harcèlement, et personne
    ne les entend pleurer. » Cette phrase cherche-t-elle surtout à convaincre ou à persuader ?'
  reponse:
    options:
    - id: a
      texte: Elle cherche surtout à persuader, en utilisant des images fortes qui touchent les émotions
    - id: b
      texte: Elle cherche surtout à convaincre, avec un raisonnement logique et des chiffres précis
    - id: c
      texte: Elle ne cherche ni à convaincre ni à persuader
    - id: d
      texte: Elle donne seulement un exemple sans opinion
    bonnes:
    - a
  indices:
    relance: Est-ce que cette phrase te donne des chiffres et des faits vérifiables, ou plutôt une image qui touche l'émotion
      ?
    methode: Convaincre s'appuie sur la raison et des preuves ; persuader s'appuie sur des mots qui font ressentir une émotion,
      comme « souffrent en silence », « personne ne les entend pleurer ».
    etape: Repère les mots qui évoquent une souffrance et une émotion plutôt qu'un fait chiffré.
  pieges:
  - si:
      contient:
      - b
    relance: La phrase ne donne aucun chiffre précis ni preuve vérifiable. Cherche plutôt les mots qui touchent l'émotion.
  - si:
      contient:
      - c
    relance: La phrase exprime clairement une opinion sur le harcèlement, avec des mots forts. Regarde-les de plus près.
  - si:
      contient:
      - d
    relance: Cette phrase ne donne pas un exemple neutre, elle utilise des mots qui suscitent une émotion forte.
  solution: Cette phrase cherche à persuader, en utilisant des mots qui suscitent une émotion forte (« souffrent en silence
    », « personne ne les entend pleurer ») plutôt que des preuves logiques.
- id: mot-modalisateur
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne une expression comme « sans doute » ou « il semble que », qui montre le degré de certitude de celui
    qui parle ?
  reponse:
    acceptees:
    - modalisateur
    fautes_tolerees: 2
  indices:
    relance: Ce mot est de la même famille que « modaliser », qui signifie nuancer une affirmation.
    methode: Le mot commence par « modal- » et se termine par « -isateur ».
    etape: Pense à ce qui « module », c'est-à-dire nuance, une phrase.
  pieges:
  - si:
      valeur: connecteur
    relance: Un connecteur relie deux idées (donc, cependant). Le mot cherché nuance plutôt le degré de certitude d'une affirmation.
  solution: 'Un modalisateur : un mot ou une expression (sans doute, certainement, il semble que) qui montre le degré de certitude
    de celui qui parle.'
- id: structure-paragraphe-argumente
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les éléments d'un paragraphe argumenté bien structuré.
  reponse:
    elements:
    - id: a
      texte: J'annonce mon idée principale, l'argument
    - id: b
      texte: J'explique cet argument avec mes propres mots
    - id: c
      texte: Je l'illustre avec un exemple précis et concret
    - id: d
      texte: Je fais une transition vers l'idée suivante
  indices:
    relance: Quelle est la toute première chose à dire dans un paragraphe argumenté ?
    methode: On annonce d'abord l'idée, puis on l'explique, puis on l'illustre par un exemple, puis on relie à la suite du
      texte.
    etape: On commence toujours par annoncer l'argument principal.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre le paragraphe (l'argument) et celle qui le ferme (la transition).
  solution: On annonce d'abord l'argument, puis on l'explique, puis on l'illustre avec un exemple, puis on fait une transition
    vers l'idée suivante.
- id: connecteur-fonction
  type: association
  difficulte: 3
  enonce: Relie chaque connecteur logique à la fonction qu'il exprime dans un texte argumentatif.
  reponse:
    gauche:
    - id: a
      texte: Cependant
    - id: b
      texte: Donc
    - id: c
      texte: D'abord
    droite:
    - id: x
      texte: Introduit une opposition ou une nuance par rapport à ce qui précède
    - id: y
      texte: Introduit une conséquence ou une conclusion logique
    - id: z
      texte: Introduit le premier élément d'une liste ou d'un raisonnement
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque connecteur, demande-toi s'il oppose, conclut, ou ouvre une liste d'idées.
    methode: « Cependant » marque un contraste, « donc » marque une conséquence, « d'abord » marque le début d'une énumération.
    etape: Commence par « d'abord », le plus facile à repérer car il ouvre toujours une liste.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la fonction logique précise de chaque connecteur.
  - si:
      diagnostic: associations_fausses
    relance: Repars du connecteur « d'abord », qui ouvre toujours une énumération, puis distingue opposition et conséquence.
  solution: « Cependant » introduit une opposition. « Donc » introduit une conséquence. « D'abord » introduit le premier élément
    d'une liste.
