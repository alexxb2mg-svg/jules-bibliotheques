# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: structuration-du-texte-argumentatif
version: 3
etat: verifiee
declencheurs:
- convaincre ou persuader
- organiser un paragraphe argumenté
- donner un exemple pour appuyer une idée
- structurer mes arguments
- défendre une opinion
- thèse et arguments
- plan d'un paragraphe
- rédiger une argumentation
- paragraphe d'analyse littéraire
- exemples pour argumenter
prerequis: []
essentiel: 'Argumenter, c''est défendre une opinion (une thèse) avec des arguments et des exemples, pour amener quelqu''un
  à la partager. Le programme distingue plusieurs fonctions de l''argumentation : convaincre, persuader, délibérer.


  Convaincre s''adresse à la raison : on donne des arguments logiques, des faits, des exemples vérifiables. Persuader s''adresse
  aux émotions : on utilise des images fortes, des mots qui touchent, un ton qui émeut. Délibérer, c''est peser le pour et
  le contre avant de choisir. Un bon texte mêle souvent convaincre et persuader.


  Les mots-clés à connaître : la thèse est l''opinion défendue ; l''argument est la raison qui la soutient ; l''exemple illustre
  l''argument avec un fait précis. On peut aussi présenter la thèse adverse (l''opinion contraire) pour la réfuter, ou faire
  une concession (« certes... mais... »).


  Structure d''un paragraphe argumenté : on annonce l''idée (l''argument), on l''explique, on l''illustre avec un exemple
  précis, puis on relie à la suite avec une transition. Un texte entier suit un plan clair : une introduction qui présente
  le sujet et la thèse, des paragraphes (un argument par paragraphe), une conclusion qui répond à la question.


  Les connecteurs logiques montrent les liens entre les idées : d''abord, ensuite, enfin (ordre) ; mais, cependant, pourtant
  (opposition) ; donc, ainsi, par conséquent (conséquence) ; car, en effet (cause). Le choix des exemples compte aussi : ils
  doivent être précis, vrais et adaptés à l''argument.


  La modalisation nuance ce qu''on affirme : sans doute, il semble que, certainement, peut-être. Elle montre le degré de certitude.


  Même logique pour un paragraphe d''analyse littéraire : une idée claire, un exemple tiré du texte (citation courte), une
  explication de l''effet produit.


  Ce qu''on attend au brevet : rédiger un paragraphe argumenté cohérent, avec une idée, un exemple précis et des connecteurs
  bien choisis.

  '
methode:
- 'Formuler d''abord la thèse : quelle opinion défends-tu ? Une phrase claire.'
- Chercher deux ou trois arguments différents, puis choisir l'ordre le plus logique.
- Décider si tu veux convaincre (raison), persuader (émotions) ou combiner les deux.
- 'Pour chaque argument, écrire un paragraphe : idée, explication, exemple précis, transition.'
- Relier les idées avec des connecteurs logiques bien choisis, sans en abuser.
- Nuancer avec quelques modalisateurs, et envisager l'objection adverse avec une concession si le sujet s'y prête.
- 'Relire : chaque paragraphe a-t-il une idée et un exemple ? La conclusion répond-elle à la question ?'
vocabulaire:
- terme: thèse
  definition: opinion que l'on défend dans un texte argumentatif
- terme: argument
  definition: raison donnée pour soutenir une thèse
- terme: exemple
  definition: fait précis qui illustre un argument et le rend concret
- terme: convaincre
  definition: s'adresser à la raison du lecteur avec des arguments logiques
- terme: persuader
  definition: s'adresser aux émotions du lecteur pour l'amener à partager une opinion
- terme: délibérer
  definition: peser le pour et le contre avant de prendre une décision
- terme: modalisateur
  definition: mot ou expression qui montre le degré de certitude de celui qui parle (sans doute, certainement)
- terme: connecteur logique
  definition: mot qui relie deux idées en montrant leur rapport (cause, conséquence, opposition)
- terme: réfuter
  definition: montrer qu'une opinion adverse est fausse ou peu solide
erreurs_frequentes:
- Donner un argument sans aucun exemple pour l'illustrer.
- Confondre convaincre (la raison) et persuader (les émotions).
- Enchaîner les arguments sans connecteurs logiques, ce qui rend le texte confus.
- Répéter la même idée avec d'autres mots au lieu d'apporter un nouvel argument.
- Donner un exemple vague (« comme tout le monde le sait ») au lieu d'un fait précis.
exemple:
  enonce: 'Écris un exemple concret pour illustrer cet argument : « Le sport en équipe apprend à coopérer. »'
  solution: Par exemple, lors d'un match de basket, chaque joueur doit faire des passes à ses coéquipiers et accepter de ne
    pas toujours marquer lui-même, pour que l'équipe gagne ensemble.
exercices:
- id: convaincre-ou-persuader
  type: choix
  difficulte: 1
  enonce: 'Une phrase dit : « Chaque année, des milliers d''enfants souffrent en silence à cause du harcèlement, et personne
    ne les entend pleurer. » Cette phrase cherche-t-elle surtout à convaincre ou à persuader ?'
  reponse:
    options:
    - id: a
      texte: Elle cherche surtout à persuader, en utilisant des images fortes qui touchent les émotions
    - id: b
      texte: Elle cherche surtout à convaincre, avec un raisonnement logique et des chiffres précis
    - id: c
      texte: Elle ne cherche ni à convaincre ni à persuader
    - id: d
      texte: Elle donne seulement un exemple sans opinion
    bonnes:
    - a
  indices:
    relance: Est-ce que cette phrase te donne des chiffres et des faits vérifiables, ou plutôt une image qui touche l'émotion
      ?
    methode: Convaincre s'appuie sur la raison et des preuves ; persuader s'appuie sur des mots qui font ressentir une émotion,
      comme « souffrent en silence », « personne ne les entend pleurer ».
    etape: Repère les mots qui évoquent une souffrance et une émotion plutôt qu'un fait chiffré.
  pieges:
  - si:
      contient:
      - b
    relance: La phrase ne donne aucun chiffre précis ni preuve vérifiable. Cherche plutôt les mots qui touchent l'émotion.
  - si:
      contient:
      - c
    relance: La phrase exprime clairement une opinion sur le harcèlement, avec des mots forts. Regarde-les de plus près.
  - si:
      contient:
      - d
    relance: Cette phrase ne donne pas un exemple neutre, elle utilise des mots qui suscitent une émotion forte.
  solution: Cette phrase cherche à persuader, en utilisant des mots qui suscitent une émotion forte (« souffrent en silence
    », « personne ne les entend pleurer ») plutôt que des preuves logiques.
- id: mot-modalisateur
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne une expression comme « sans doute » ou « il semble que », qui montre le degré de certitude de celui
    qui parle ?
  reponse:
    acceptees:
    - modalisateur
    fautes_tolerees: 2
  indices:
    relance: Ce mot est de la même famille que « modaliser », qui signifie nuancer une affirmation.
    methode: Le mot commence par « modal- » et se termine par « -isateur ».
    etape: Pense à ce qui « module », c'est-à-dire nuance, une phrase.
  pieges:
  - si:
      valeur: connecteur
    relance: Un connecteur relie deux idées (donc, cependant). Le mot cherché nuance plutôt le degré de certitude d'une affirmation.
  solution: 'Un modalisateur : un mot ou une expression (sans doute, certainement, il semble que) qui montre le degré de certitude
    de celui qui parle.'
- id: structure-paragraphe-argumente
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les éléments d'un paragraphe argumenté bien structuré.
  reponse:
    elements:
    - id: a
      texte: J'annonce mon idée principale, l'argument
    - id: b
      texte: J'explique cet argument avec mes propres mots
    - id: c
      texte: Je l'illustre avec un exemple précis et concret
    - id: d
      texte: Je fais une transition vers l'idée suivante
  indices:
    relance: Quelle est la toute première chose à dire dans un paragraphe argumenté ?
    methode: On annonce d'abord l'idée, puis on l'explique, puis on l'illustre par un exemple, puis on relie à la suite du
      texte.
    etape: On commence toujours par annoncer l'argument principal.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre le paragraphe (l'argument) et celle qui le ferme (la transition).
  solution: On annonce d'abord l'argument, puis on l'explique, puis on l'illustre avec un exemple, puis on fait une transition
    vers l'idée suivante.
- id: connecteur-fonction
  type: association
  difficulte: 3
  enonce: Relie chaque connecteur logique à la fonction qu'il exprime dans un texte argumentatif.
  reponse:
    gauche:
    - id: a
      texte: Cependant
    - id: b
      texte: Donc
    - id: c
      texte: D'abord
    droite:
    - id: x
      texte: Introduit une opposition ou une nuance par rapport à ce qui précède
    - id: y
      texte: Introduit une conséquence ou une conclusion logique
    - id: z
      texte: Introduit le premier élément d'une liste ou d'un raisonnement
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque connecteur, demande-toi s'il oppose, conclut, ou ouvre une liste d'idées.
    methode: « Cependant » marque un contraste, « donc » marque une conséquence, « d'abord » marque le début d'une énumération.
    etape: Commence par « d'abord », le plus facile à repérer car il ouvre toujours une liste.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la fonction logique précise de chaque connecteur.
  - si:
      diagnostic: associations_fausses
    relance: Repars du connecteur « d'abord », qui ouvre toujours une énumération, puis distingue opposition et conséquence.
  solution: « Cependant » introduit une opposition. « Donc » introduit une conséquence. « D'abord » introduit le premier élément
    d'une liste.
- id: nblm-quelle-est-la-definition-exacte-du-fait-1
  type: choix
  difficulte: 2
  enonce: Quelle est la définition exacte du fait de « convaincre » dans un texte argumentatif ?
  reponse:
    options:
    - id: o1
      texte: S'adresser à la raison du lecteur en utilisant des arguments logiques.
    - id: o2
      texte: S'adresser aux émotions et aux sentiments du lecteur pour le toucher.
    - id: o3
      texte: Raconter une histoire fictive sans chercher à défendre une opinion.
    - id: o4
      texte: Donner son avis personnel sans apporter aucune explication.
    bonnes:
    - o1
  indices:
    relance: Pense à la faculté humaine liée à la logique et aux preuves rationnelles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : cela correspond à la définition de ''persuader'', et non de ''convaincre.'''
  - si:
      contient:
      - o3
    relance: 'Erreur typique : cela décrit le récit narratif, pas la démarche argumentative.'
  - si:
      contient:
      - o4
    relance: 'Confusion fréquente : une simple affirmation sans argument ne permet pas de convaincre.'
  solution: 'S''adresser à la raison du lecteur en utilisant des arguments logiques. C''est exact : convaincre repose sur
    le raisonnement logique, les preuves et la démonstration rationnelle.'
- id: nblm-quel-procede-est-specifiquement-utilise-2
  type: choix
  difficulte: 2
  enonce: Quel procédé est spécifiquement utilisé lorsqu'un auteur cherche à « persuader » son destinataire ?
  reponse:
    options:
    - id: o1
      texte: Faire appel aux émotions, aux sentiments et aux images fortes.
    - id: o2
      texte: Utiliser uniquement des chiffres et des démonstrations scientifiques neutres.
    - id: o3
      texte: Supprimer tous les modalisateurs pour rendre le texte neutre.
    - id: o4
      texte: Éviter d'exprimer la moindre opinion personnelle.
    bonnes:
    - o1
  indices:
    relance: Cherche ce qui touche le cœur et la sensibilité plutôt que la seule logique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de confusion : la démonstration neutre relève du fait de convaincre par la raison.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la persuasion utilise souvent une forte modalisation expressive pour susciter des émotions.'
  - si:
      contient:
      - o4
    relance: 'Fausse idée : un texte persuasif défend fermement une thèse en cherchant à toucher le lecteur.'
  solution: 'Faire appel aux émotions, aux sentiments et aux images fortes. C''est juste : persuader vise à toucher la sensibilité
    et l''affectivité du destinataire.'
- id: nblm-selon-les-regles-de-structuration-dans-q-3
  type: choix
  difficulte: 2
  enonce: Selon les règles de structuration, dans quel ordre logique doit-on organiser un paragraphe argumenté ?
  reponse:
    options:
    - id: o1
      texte: Annoncer l'argument, l'expliquer, puis l'illustrer par un exemple précis.
    - id: o2
      texte: Commencer par un exemple concret, puis donner la conclusion sans expliquer l'argument.
    - id: o3
      texte: Aligner plusieurs exemples sans jamais formuler d'idée générale ou d'argument.
    - id: o4
      texte: Terminer par l'explication et placer l'argument en toute fin de paragraphe.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au déroulement qui va de l'idée générale (l'argument) vers son illustration concrète.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : commencer directement par un exemple sans poser l''argument rend le propos confus.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : accumuler des exemples ne remplace pas la formulation d''un argument.'
  - si:
      contient:
      - o4
    relance: 'Problème de structure : l''argument constitue l''idée directrice et doit être affirmé dès le début.'
  solution: 'Annoncer l''argument, l''expliquer, puis l''illustrer par un exemple précis. Exact : un paragraphe argumenté
    commence par l''idée principale, la développe, puis l''appuie sur un exemple concret.'
- id: nblm-quel-est-le-role-essentiel-d-un-exemple-4
  type: choix
  difficulte: 2
  enonce: Quel est le rôle essentiel d'un exemple pour appuyer une idée dans un texte argumentatif ?
  reponse:
    options:
    - id: o1
      texte: Illustrer de manière concrète et précise un argument pour le rendre plus convaincant.
    - id: o2
      texte: Remplacer l'argument pour éviter d'avoir à rédiger une explication.
    - id: o3
      texte: Divertir le lecteur en s'éloignant du sujet principal de la thèse.
    - id: o4
      texte: Servir uniquement de formule de politesse au début du texte.
    bonnes:
    - o1
  indices:
    relance: Pense au lien entre une idée abstraite et un fait réel ou précis qui la prouve.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur courante : un exemple ne remplace pas l''argumentation, il vient seulement l''illustrer.'
  - si:
      contient:
      - o3
    relance: 'Attention : l''exemple doit rester strictement lié à l''argument et ne pas constituer un hors-sujet.'
  - si:
      contient:
      - o4
    relance: 'Inexact : l''exemple est un procédé d''étayage situé au cœur du paragraphe argumenté.'
  solution: 'Illustrer de manière concrète et précise un argument pour le rendre plus convaincant. C''est juste : l''exemple
    vient étayer l''argument abstrait en le rendant concret et vérifiable.'
- id: nblm-quel-est-le-role-des-connecteurs-logique-5
  type: choix
  difficulte: 2
  enonce: Quel est le rôle des connecteurs logiques dans la structuration des arguments ?
  reponse:
    options:
    - id: o1
      texte: Rendre le texte cohérent en marquant clairement les liens logiques entre les idées.
    - id: o2
      texte: Remplacer les arguments par des mots de liaison pour raccourcir le paragraphe.
    - id: o3
      texte: Indiquer uniquement le niveau de langue et le registre du vocabulaire employé.
    - id: o4
      texte: Transformer automatiquement un argument rationnel en un argument persuasif.
    bonnes:
    - o1
  indices:
    relance: Pense aux mots de liaison qui organisent le fil des idées et évitent qu'un texte soit confus.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de raisonnement : les connecteurs relient des idées, ils ne les remplacent pas.'
  - si:
      contient:
      - o3
    relance: 'Confusion : le niveau de langue dépend du lexique, pas de la fonction logique des connecteurs.'
  - si:
      contient:
      - o4
    relance: 'Fausse interprétation : le statut convaincant ou persuasif dépend de la nature des arguments, pas du connecteur.'
  solution: 'Rendre le texte cohérent en marquant clairement les liens logiques entre les idées. Exact : les connecteurs articulent
    les étapes du raisonnement (addition, cause, opposition, conséquence).'
- id: nblm-quels-sont-deux-elements-indispensables-6
  type: choix
  difficulte: 3
  enonce: Quels sont deux éléments indispensables pour bien structurer mes arguments dans un texte argumentatif ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Enchaîner les paragraphes de façon logique avec des transitions et des connecteurs.
    - id: o2
      texte: Appuyer chaque argument rédigé sur un exemple précis et adapté.
    - id: o3
      texte: Rédiger tout le devoir sous la forme d'un seul bloc sans aucun paragraphe.
    - id: o4
      texte: Multiplier les jugements de valeur personnels sans jamais donner d'explications.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux choix qui garantissent à la fois l'organisation logique et l'illustration concrète des idées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : l''absence de paragraphes rend la structure illisible et désordonnée.'
  - si:
      contient:
      - o4
    relance: 'Erreur : aligner des opinions non justifiées ne constitue pas une structure argumentative.'
  solution: 'Enchaîner les paragraphes de façon logique avec des transitions et des connecteurs ; Appuyer chaque argument
    rédigé sur un exemple précis et adapté. C''est exact : les connecteurs et la progression logique garantissent la cohérence
    de la structuration.'
- id: nblm-quel-terme-designe-un-mot-ou-une-express-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne un mot ou une expression (comme « sans doute ») permettant de nuancer son propos et d'exprimer
    son degré de certitude ?
  reponse:
    acceptees:
    - modalisateur
    fautes_tolerees: 1
  indices:
    relance: Ce mot qualifie l'outil linguistique servant à nuancer une certitude ou un jugement dans un texte argumentatif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'modalisateur. C''est la bonne réponse : un modalisateur permet de nuancer une affirmation et d''exprimer l''attitude
    du locuteur.'
- id: nblm-lorsqu-un-eleve-construit-un-raisonnemen-8
  type: texte_court
  difficulte: 1
  enonce: Lorsqu'un élève construit un raisonnement logique s'adressant à la raison du destinataire, quelle visée argumentative
    met-il en œuvre (verbe à l'infinitif) ?
  reponse:
    acceptees:
    - convaincre
    fautes_tolerees: 1
  indices:
    relance: Ce verbe exprime l'action de faire adhérer par la logique, par opposition à 'persuader'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'convaincre. Exact : le verbe ''convaincre'' désigne l''action d''agir sur la raison par des preuves et une logique
    rigoureuse.'
- id: repere-modalisateur
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Cette mesure sera sans doute utile aux élèves », quelle expression est un modalisateur ?
  reponse:
    options:
    - id: a
      texte: sans doute
    - id: b
      texte: cette mesure
    - id: c
      texte: aux élèves
    - id: d
      texte: sera utile
    bonnes:
    - a
  indices:
    relance: Cherche l'expression qui nuance le degré de certitude de celui qui parle.
    methode: Un modalisateur peut se retirer sans changer le contenu de la phrase, mais la phrase devient plus affirmative.
    etape: Retire chaque groupe de mots l'un après l'autre et vois lequel enlève seulement le doute.
  pieges:
  - si:
      contient:
      - b
    relance: Ce groupe désigne le sujet de la phrase. Il ne dit rien sur la certitude.
  - si:
      contient:
      - c
    relance: Ce groupe indique à qui la mesure est utile. Il ne nuance pas la certitude.
  - si:
      contient:
      - d
    relance: Ce groupe dit ce que la mesure sera. Ce n'est pas lui qui exprime le doute.
  solution: '« Sans doute » est un modalisateur : il montre que celui qui parle n''est pas totalement sûr.'
- id: pieces-argumentation
  type: association
  difficulte: 2
  enonce: Relie chaque élément d'un texte argumentatif à sa définition.
  reponse:
    gauche:
    - id: a
      texte: La thèse
    - id: b
      texte: L'argument
    - id: c
      texte: L'exemple
    droite:
    - id: x
      texte: L'opinion défendue dans tout le texte
    - id: y
      texte: La raison qui soutient cette opinion
    - id: z
      texte: Le fait précis qui illustre la raison
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Va du plus général (l'opinion) au plus précis (le fait).
    methode: La thèse est l'idée de tout le texte, l'argument soutient cette idée, l'exemple soutient l'argument.
    etape: Commence par la définition qui concerne le texte entier.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Classe du plus général au plus précis.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends dans l''ordre : opinion de tout le texte, raison, fait précis.'
  solution: La thèse est l'opinion défendue, l'argument la raison qui la soutient, l'exemple le fait précis qui illustre l'argument.
- id: plan-texte-argumentatif
  type: ordre
  difficulte: 2
  enonce: Range ces parties d'un texte argumentatif dans l'ordre.
  reponse:
    elements:
    - id: a
      texte: 'Introduction : je présente le sujet et ma thèse'
    - id: b
      texte: 'Premier paragraphe : un premier argument avec un exemple'
    - id: c
      texte: 'Deuxième paragraphe : un second argument avec un exemple'
    - id: d
      texte: 'Conclusion : je réponds à la question posée'
  indices:
    relance: Par quoi commence-t-on un texte, et par quoi le termine-t-on ?
    methode: Introduction, puis les arguments un par un, puis conclusion.
    etape: Les deux paragraphes d'arguments sont au milieu. Le premier argument passe avant le second.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux parties voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Place d'abord l'introduction et la conclusion, puis les deux arguments entre les deux.
  solution: Introduction, premier argument, second argument, puis conclusion.
- id: paragraphe-argumente
  type: ouverte
  difficulte: 3
  enonce: 'Rédige un paragraphe argumenté (6 à 10 lignes) pour défendre cette thèse : « Le sport à l''école est utile à tous
    les élèves. » Utilise un argument, un exemple précis et au moins deux connecteurs logiques.'
  criteres:
  - L'élève énonce une idée claire qui soutient la thèse.
  - L'élève illustre cette idée avec un exemple précis et concret.
  - L'élève emploie au moins deux connecteurs logiques bien choisis et enchaîne les phrases de façon cohérente.
  indices:
    relance: Quelle raison peux-tu donner pour dire que le sport est utile ?
    methode: 'Suis l''ordre : idée, explication, exemple, transition ou conclusion. Choisis des connecteurs qui montrent le
      lien entre les phrases.'
    etape: Tu peux commencer ainsi « D'abord, le sport à l'école apprend à... », puis donner un exemple précis, puis « Ainsi...
      ».
  solution: D'abord, le sport à l'école apprend à travailler en équipe. En effet, dans un match de handball, chaque joueur
    doit passer le ballon et accepter que le point soit marqué par un autre. Ainsi, les élèves timides ou moins habiles y
    trouvent leur place. Cependant, il faut que les règles soient claires pour éviter les conflits. Le sport à l'école est
    donc utile à tous.
