format: 2
notion: accord-verbe-cas-complexes
version: 3
etat: verifiee
declencheurs:
- la plupart ont ou a
- chacun est ou sont
- sujet collectif difficile
- personne n'a ou n'ont
- beaucoup sont ou est
- verbe après aucun ou chacun
- sujet pronom indéfini
prerequis: []
essentiel: 'Le verbe s''accorde avec son sujet en nombre et en personne. Certains sujets posent problème : ce sont des pronoms
  collectifs ou distributifs.


  Les pronoms collectifs désignent un ensemble : la plupart, beaucoup, peu, plusieurs, certains, un grand nombre. Suivis d''un
  complément au pluriel, ou employés seuls, ils veulent le verbe au pluriel.

  « La plupart des élèves ONT compris. » « Beaucoup sont venus. » « Plusieurs ont refusé. »


  Les pronoms distributifs désignent les éléments un par un : chacun, aucun, nul, personne, tout le monde, quiconque. Le verbe
  reste au singulier, même si un complément pluriel suit.

  « Chacun des élèves A son cahier. » « Aucun de ces livres n''EST intéressant. » « Personne n''A vu le film. » « Tout le
  monde EST là. »


  Le sujet réel est le pronom, pas le nom du complément. Dans « Chacun des candidats a une chance », le sujet est « chacun
  » et non « les candidats ».


  Cas de « la plupart » avec un complément singulier : « la plupart du temps » est une locution. Retiens surtout que « la
  plupart des + nom pluriel » se construit avec le verbe au pluriel.


  Ne confonds pas « personne » pronom (« Personne n''est venu », singulier) et « personne » nom commun féminin (« Les personnes
  sont venues », pluriel).


  Astuce : remplace le sujet par « ils » ou « il ». Si « il » convient (chacun, aucun, personne), le verbe est au singulier
  ; si « ils » convient (la plupart, beaucoup), il est au pluriel.


  Au brevet, on attend que tu accordes correctement ces verbes en dictée ou en réécriture et que tu justifies ton accord.

  '
methode:
- Identifie le sujet réel du verbe en le trouvant avec « Qui est-ce qui ... ? ».
- Repère si ce sujet est un pronom collectif (la plupart, beaucoup, plusieurs) ou distributif (chacun, aucun, personne).
- Si le pronom est distributif, écris le verbe au singulier, même si un complément pluriel suit.
- Si le pronom est collectif, écris le verbe au pluriel.
- Vérifie en remplaçant le sujet par « il » ou par « ils ».
- Accorde aussi le participe passé ou l'attribut qui dépend du sujet.
vocabulaire:
- terme: sujet
  definition: mot ou groupe de mots qui commande l'accord du verbe
- terme: pronom collectif
  definition: pronom qui désigne un ensemble de personnes ou de choses (la plupart, beaucoup, plusieurs)
- terme: pronom distributif
  definition: pronom qui désigne les éléments d'un ensemble un par un (chacun, aucun, personne)
- terme: pronom indéfini
  definition: pronom qui désigne de façon imprécise des personnes ou des choses
- terme: accord
  definition: modification d'un mot pour qu'il prenne le genre, le nombre ou la personne d'un autre mot
- terme: complément
  definition: groupe de mots qui complète un autre mot, sans être le sujet du verbe
erreurs_frequentes:
- Accorder « chacun » au pluriel parce qu'il est suivi d'un complément pluriel (chacun DES élèves).
- Laisser « la plupart » au singulier alors qu'elle demande un verbe au pluriel.
- Confondre « personne » pronom (toujours singulier) avec le nom commun « une personne ».
- Accorder le verbe avec le nom du complément (« les élèves ») au lieu du pronom sujet.
- Oublier d'accorder le participe passé après le pronom collectif (« ils sont arrivés »).
exemple:
  enonce: 'Choisis le bon accord : « La plupart des invités (arriver) en retard. »'
  solution: '« La plupart des invités sont arrivés en retard. » : « la plupart » suivi d''un complément pluriel demande un
    verbe au pluriel.'
exercices:
- id: chacun-singulier
  type: texte_court
  difficulte: 1
  enonce: 'Complète : « Chacun des candidats (avoir, présent) une chance. » (écris seulement le verbe conjugué)'
  reponse:
    acceptees:
    - a
    fautes_tolerees: 0
  indices:
    relance: '« chacun » désigne les candidats un par un : est-ce un pronom collectif ou distributif ?'
    methode: '« chacun » est un pronom distributif : il veut toujours un verbe au singulier.'
    etape: 'Le sujet est de la troisième personne du singulier : quelle terminaison prend « avoir » au présent pour « il/elle
      » ?'
  pieges:
  - si:
      valeur: ont
    relance: '« chacun » n''accorde pas avec le complément pluriel « des candidats » : c''est un pronom distributif, singulier.'
  solution: '« Chacun des candidats a une chance. » : « chacun » est distributif, le verbe reste au singulier.'
- id: plupart-pluriel
  type: choix
  difficulte: 2
  enonce: Quelle phrase est correctement accordée ?
  reponse:
    options:
    - id: a
      texte: La plupart des spectateurs ont applaudi.
    - id: b
      texte: La plupart des spectateurs a applaudi.
    - id: c
      texte: Chacun des spectateurs ont applaudi.
    bonnes:
    - a
  indices:
    relance: « la plupart » suivie d'un complément pluriel demande en général un verbe au pluriel.
    methode: 'Regarde le pronom sujet de chaque phrase : est-il collectif ou distributif ?'
    etape: 'Une des phrases utilise un pronom distributif avec un verbe au pluriel : elle est fausse. Cherche l''autre erreur.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Le complément « des spectateurs » est pluriel et « la plupart » est collectif : le verbe doit être au pluriel.'
  - si:
      contient:
      - c
    relance: '« chacun » est distributif : il veut un verbe au singulier, pas au pluriel.'
  solution: '« La plupart des spectateurs ont applaudi. » est correcte : « la plupart » est collectif, le verbe est au pluriel.
    « Chacun » exige un verbe au singulier.'
- id: personne-singulier
  type: choix
  difficulte: 2
  enonce: Dans « Personne n'a vu le film. », pourquoi le verbe est-il au singulier ?
  reponse:
    options:
    - id: a
      texte: parce que « personne » est un pronom distributif, toujours singulier
    - id: b
      texte: parce que « le film » est singulier
    - id: c
      texte: parce que le verbe est à la forme négative
    bonnes:
    - a
  indices:
    relance: « personne » ici n'est pas un nom, mais un pronom. À quel groupe de pronoms appartient-il ?
    methode: 'Comme « chacun », « aucun » et « nul », « personne » est un pronom distributif : il veut toujours un verbe au
      singulier.'
    etape: Le sujet du verbe « a vu » est « personne », pas « le film ».
  pieges:
  - si:
      contient:
      - b
    relance: « le film » est COD du verbe, pas son sujet. Le sujet est « personne ».
  - si:
      contient:
      - c
    relance: La négation ne change pas l'accord du verbe avec son sujet.
  solution: '« personne » est un pronom distributif comme « chacun » ou « aucun » : il impose toujours un verbe au singulier.'
- id: beaucoup-texte-court
  type: texte_court
  difficulte: 2
  enonce: 'Complète : « Beaucoup de passants (s''arrêter, passé composé) devant la vitrine. » (écris seulement l''auxiliaire
    et le participe : ...)'
  reponse:
    acceptees:
    - se sont arrêtés
    - se sont arretes
    - sont arrêtés
    fautes_tolerees: 1
  indices:
    relance: '« beaucoup de passants » est collectif : le verbe est au pluriel, et le participe s''accorde avec le sujet.'
    methode: 'Le verbe « s''arrêter » est pronominal : il se conjugue avec l''auxiliaire « être » et le participe s''accorde
      avec le sujet.'
    etape: 'Le sujet est à la 3e personne du pluriel et est masculin (des passants) : accorde l''auxiliaire et le participe.'
  pieges:
  - si:
      valeur: s'est arrêté
    relance: '« beaucoup de passants » désigne plusieurs personnes : l''auxiliaire et le participe se mettent au pluriel.'
  solution: '« Beaucoup de passants se sont arrêtés devant la vitrine. » : le sujet est collectif et pluriel, l''auxiliaire
    « être » et le participe s''accordent au pluriel.'
- id: collectifs-et-distributifs
  type: association
  difficulte: 3
  enonce: Associe chaque pronom à l'accord du verbe qu'il impose le plus souvent.
  reponse:
    gauche:
    - id: a
      texte: chacun
    - id: b
      texte: beaucoup (suivi d'un pluriel)
    - id: c
      texte: aucun
    droite:
    - id: x
      texte: verbe au singulier
    - id: y
      texte: verbe au pluriel
    paires:
      a: x
      b: y
      c: x
  indices:
    relance: Deux de ces pronoms sont distributifs, un est collectif.
    methode: '« chacun » et « aucun » désignent les éléments un par un : verbe au singulier. « beaucoup » suivi d''un pluriel
      prend le verbe au pluriel.'
    etape: Classe d'abord « chacun » et « aucun » ensemble, puis place « beaucoup » à part.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie si le pronom est distributif ou collectif.
  - si:
      diagnostic: associations_fausses
    relance: 'Repense à la règle : les distributifs veulent un verbe singulier, les collectifs pluriels veulent un verbe pluriel.'
  solution: '« chacun » et « aucun » sont distributifs : verbe au singulier. « beaucoup » suivi d''un complément pluriel :
    verbe au pluriel.'
- id: nblm-dans-la-phrase-la-plupart-des-eleves-avo-1
  type: choix
  difficulte: 2
  enonce: Dans la phrase « La plupart des élèves (avoir) compris la leçon », quelle est la forme correcte du verbe au présent
    de l'indicatif ?
  reponse:
    options:
    - id: o1
      texte: ont
    - id: o2
      texte: a
    - id: o3
      texte: avaient
    - id: o4
      texte: aurait
    bonnes:
    - o1
  indices:
    relance: Pense au nombre du complément qui suit le pronom collectif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur classique de laisser le verbe au singulier avec « la plupart », alors que ce pronom collectif
      suivi d'un complément pluriel exige le pluriel.
  - si:
      contient:
      - o3
    relance: L'imparfait ne respecte pas le temps présent demandé par la phrase.
  - si:
      contient:
      - o4
    relance: Le conditionnel présente le fait comme une hypothèse, ce qui ne convient pas à cette phrase déclarative.
  solution: 'ont. C''est la bonne réponse : avec le pronom collectif « la plupart » suivi d''un complément au pluriel, le
    verbe s''accorde au pluriel.'
- id: nblm-dans-la-phrase-chacun-des-candidats-etre-2
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Chacun des candidats (être) convoqué à dix heures », quelle est la forme correcte du verbe au présent
    de l'indicatif ?
  reponse:
    options:
    - id: o1
      texte: est
    - id: o2
      texte: sont
    - id: o3
      texte: soient
    - id: o4
      texte: seront
    bonnes:
    - o1
  indices:
    relance: Attention au rôle du pronom distributif qui prend en compte les personnes une par une.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Le mode subjonctif n'a pas lieu d'être dans cette phrase déclarative simple à l'indicatif.
  - si:
      contient:
      - o4
    relance: Le futur simple modifie inutilement le temps présent de la phrase.
  solution: 'est. C''est la bonne réponse : le pronom distributif « chacun » désigne les éléments un par un et demande toujours
    un verbe au singulier.'
- id: nblm-quelle-regle-s-applique-pour-l-accord-du-3
  type: choix
  difficulte: 2
  enonce: Quelle règle s'applique pour l'accord du verbe lorsque le sujet est un pronom distributif comme « aucun » ou « personne
    » ?
  reponse:
    options:
    - id: o1
      texte: Le verbe reste toujours au singulier, même si un complément au pluriel suit le pronom.
    - id: o2
      texte: Le verbe s'accorde toujours au pluriel dès qu'un complément au pluriel est présent.
    - id: o3
      texte: L'accord est laissé au choix de l'auteur, au singulier ou au pluriel.
    - id: o4
      texte: Le verbe se met au pluriel si le sujet contient la négation « ne ».
    bonnes:
    - o1
  indices:
    relance: Demande-toi si ce type de pronom désigne un ensemble global ou chaque élément séparément.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Accorder avec le complément pluriel au lieu de faire l'accord avec le sujet distributif réel est l'erreur la
      plus courante.
  - si:
      contient:
      - o3
    relance: L'accord avec un pronom distributif répond à une règle stricte et n'est pas facultatif.
  - si:
      contient:
      - o4
    relance: La négation « ne » n'altère en rien la règle du singulier imposée par le pronom distributif.
  solution: 'Le verbe reste toujours au singulier, même si un complément au pluriel suit le pronom. C''est la règle exacte
    : les pronoms distributifs désignent les éléments un par un et imposent le singulier au verbe.'
- id: nblm-dans-la-phrase-un-grand-nombre-de-specta-4
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Un grand nombre de spectateurs (avoir) applaudi à la fin du spectacle », quel est l'accord du verbe
    selon les règles des sujets collectifs ?
  reponse:
    options:
    - id: o1
      texte: ont
    - id: o2
      texte: a
    - id: o3
      texte: aura
    - id: o4
      texte: ayant
    bonnes:
    - o1
  indices:
    relance: Réfléchis au sens collectif pluriel porté par l'expression et son complément.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Garder le verbe au singulier en se focalisant uniquement sur le mot « un » est une erreur d'analyse du sujet
      collectif.
  - si:
      contient:
      - o3
    relance: Le futur simple ne convient pas pour exprimer un fait accompli au présent.
  - si:
      contient:
      - o4
    relance: Le participe présent ne permet pas de conjuguer le verbe principal de la phrase.
  solution: 'ont. C''est correct : les pronoms ou locutions collectives comme « un grand nombre de » suivis d''un complément
    pluriel entraînent l''accord du verbe au pluriel.'
- id: nblm-pourquoi-la-phrase-personne-des-particip-5
  type: choix
  difficulte: 2
  enonce: Pourquoi la phrase « Personne des participants n'est venu » comporte-t-elle un verbe au singulier ?
  reponse:
    options:
    - id: o1
      texte: Parce que « personne » est un pronom distributif qui signifie « aucune personne » et exige toujours un verbe
        au singulier.
    - id: o2
      texte: Parce que le mot « participants » est un nom au féminin singulier.
    - id: o3
      texte: Parce qu'il s'agit du nom commun « une personne » employé au singulier.
    - id: o4
      texte: Parce que le verbe « venir » est ici employé sous forme impersonnelle.
    bonnes:
    - o1
  indices:
    relance: Distingue la nature grammaticale du mot « personne » employé ici sans déterminant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : « participants » est un nom masculin pluriel.'
  - si:
      contient:
      - o3
    relance: Confondre le pronom invariable « personne » avec le nom commun « une personne » est une erreur typique.
  - si:
      contient:
      - o4
    relance: Il ne s'agit pas d'une tournure impersonnelle car le sujet réel est le pronom distributif « personne ».
  solution: 'Parce que « personne » est un pronom distributif qui signifie « aucune personne » et exige toujours un verbe
    au singulier. C''est la bonne explication : en tant que pronom distributif, « personne » impose strictement le singulier
    au verbe.'
- id: nblm-quels-pronoms-parmi-les-suivants-exigent-6
  type: choix
  difficulte: 3
  enonce: Quels pronoms parmi les suivants exigent que le verbe qui les suit reste au singulier ? (Deux réponses attendues)
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Chacun
    - id: o2
      texte: Aucun
    - id: o3
      texte: La plupart
    - id: o4
      texte: Beaucoup
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les pronoms distributifs qui ramènent l'action à chaque unité isolée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : « la plupart » est un pronom collectif qui demande un verbe au pluriel lorsqu''il est suivi d''un
      complément pluriel.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : « beaucoup » est un pronom collectif qui entraîne un accord au pluriel.'
  solution: 'Chacun ; Aucun. C''est juste : « chacun » est un pronom distributif qui désigne les éléments un par un et demande
    le singulier.'
- id: nblm-complete-la-phrase-suivante-avec-le-verb-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase suivante avec le verbe « être » au présent de l''indicatif : « La plupart des invités ____ arrivés
    à l''heure. »'
  reponse:
    acceptees:
    - sont
    fautes_tolerees: 1
  indices:
    relance: Pense à l'accord obligatoire du verbe avec le pronom collectif « la plupart » suivi d'un pluriel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: sont. Le pronom collectif « la plupart » suivi du complément au pluriel « des invités » exige la forme au pluriel
    « sont ».
- id: nblm-complete-la-phrase-suivante-avec-le-verb-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase suivante avec le verbe « avoir » au présent de l''indicatif : « Chacun des élèves ____ rendu
    son devoir. »'
  reponse:
    acceptees:
    - a
    fautes_tolerees: 1
  indices:
    relance: Isole le sujet réel « chacun » pour déterminer la personne du verbe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: a. Le pronom distributif « chacun » impose la forme au singulier « a », sans se laisser influencer par le complément
    « des élèves ».
- id: corriger-les-accords
  type: choix
  difficulte: 3
  enonce: Quelle phrase est entièrement correcte ?
  reponse:
    options:
    - id: a
      texte: Aucun de mes amis n'est venu, mais plusieurs m'ont écrit.
    - id: b
      texte: Aucun de mes amis ne sont venus, mais plusieurs m'a écrit.
    - id: c
      texte: Aucun de mes amis n'est venu, mais plusieurs m'a écrit.
    - id: d
      texte: Aucun de mes amis ne sont venus, mais plusieurs m'ont écrit.
    bonnes:
    - a
  indices:
    relance: 'Il y a deux sujets à accorder : « aucun » (distributif) et « plusieurs » (collectif). Traite-les l''un après
      l''autre.'
    methode: Vérifie d'abord la première partie de chaque phrase, puis la seconde ; une seule phrase est juste des deux côtés.
    etape: « aucun » veut un verbe au singulier et « plusieurs » un verbe au pluriel. Élimine les phrases où l'un des deux
      est faux.
  pieges:
  - si:
      contient:
      - b
    relance: 'Les deux verbes sont mal accordés : « aucun » est singulier et « plusieurs » est pluriel.'
  - si:
      contient:
      - c
    relance: 'La première partie est bonne, mais « plusieurs » est collectif : quel accord pour le second verbe ?'
  - si:
      contient:
      - d
    relance: 'La seconde partie est bonne, mais « aucun » est distributif : quel accord pour le premier verbe ?'
  solution: '« Aucun de mes amis n''est venu » (aucun : singulier), « plusieurs m''ont écrit » (plusieurs : pluriel). C''est
    la seule phrase entièrement juste.'
- id: justifier-accord
  type: ouverte
  difficulte: 3
  enonce: Écris une phrase avec « la plupart » et une phrase avec « chacun » suivi d'un complément pluriel. Justifie l'accord
    du verbe dans chaque phrase.
  criteres:
  - 'La phrase avec « la plupart » a un verbe au pluriel (par exemple : la plupart des élèves ont réussi).'
  - 'La phrase avec « chacun » a un verbe au singulier, même avec un complément pluriel (par exemple : chacun des élèves a
    son livre).'
  - 'L''élève justifie : « la plupart » est un pronom collectif (pluriel), « chacun » un pronom distributif (singulier) ;
    le sujet est le pronom, pas le complément.'
  indices:
    relance: Cherche d'abord le sujet du verbe dans chaque phrase, puis demande-toi s'il est collectif ou distributif.
    methode: Écris chaque phrase, souligne le pronom sujet, et accorde le verbe avec lui, pas avec le complément.
    etape: Termine par une phrase du type « le sujet est le pronom ..., qui est collectif / distributif, donc ... ».
  solution: 'Exemple : « La plupart des élèves ont réussi. » (pronom collectif, verbe au pluriel) ; « Chacun des élèves a
    son livre. » (pronom distributif, verbe au singulier). Dans les deux cas, le sujet est le pronom, pas le complément qui
    suit.'
