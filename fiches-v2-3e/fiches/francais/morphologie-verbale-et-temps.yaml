format: 2
notion: morphologie-verbale-et-temps
version: 2
etat: verifiee
declencheurs:
- radical et terminaison
- reconnaître le temps du verbe
- conjuguer au futur antérieur
- former un temps composé
- temps de l'auxiliaire
- verbe au subjonctif présent
- impératif présent
prerequis: []
essentiel: 'Un verbe conjugué se décompose en un radical (qui porte le sens) et une terminaison (qui porte le temps et la
  personne). Exemple : dans « nous chantions », chant- est le radical, -i- la marque de l''imparfait, -ons la marque de la
  personne (nous).


  Les modes.

  - L''indicatif exprime des faits réels : je chante.

  - Le conditionnel exprime un fait imaginé ou dépendant d''une condition : je chanterais.

  - L''impératif exprime un ordre ou un conseil, sans sujet, à trois personnes : chante, chantons, chantez.

  - Le subjonctif exprime un souhait, un doute, une obligation : il faut que je chante.


  Les temps simples de l''indicatif : présent, imparfait, futur simple, passé simple.

  - Imparfait : radical + -ais, -ais, -ait, -ions, -iez, -aient.

  - Futur simple : infinitif (ou radical du futur) + -ai, -as, -a, -ons, -ez, -ont : je chanterai.

  - Passé simple : il chanta, ils chantèrent ; il finit, ils finirent.

  - Conditionnel présent : radical du futur + terminaisons de l''imparfait : je chanterais.


  Les temps composés se forment avec l''auxiliaire avoir ou être conjugué + le participe passé. Le temps de l''auxiliaire
  donne son nom au temps composé :

  - passé composé : auxiliaire au présent (j''ai chanté, il est parti) ;

  - plus-que-parfait : auxiliaire à l''imparfait (j''avais chanté) ;

  - futur antérieur : auxiliaire au futur simple (j''aurai chanté).


  Le subjonctif présent : que je chante, que tu chantes, qu''il chante, que nous chantions, que vous chantiez, qu''ils chantent.
  Le subjonctif passé est composé : auxiliaire au subjonctif présent + participe passé (que j''aie chanté, que je sois parti).


  L''impératif présent : au 1er groupe, la 2e personne du singulier perd son « s » (chante). On garde le « s » devant en et
  y (« manges-en »).


  Au brevet, on attend que tu identifies un temps et un mode, que tu décomposes un verbe et que tu écrives sans faute les
  formes des verbes du programme.

  '
methode:
- Repère le verbe conjugué et cherche son infinitif.
- Sépare le radical et la terminaison, puis lis la terminaison pour trouver le temps et la personne.
- 'Vérifie s''il y a deux mots : un auxiliaire (avoir ou être) et un participe passé. Si oui, c''est un temps composé.'
- 'Pour nommer un temps composé, cherche le temps de l''auxiliaire : présent, imparfait, futur simple...'
- 'Repère le mode : ordre sans sujet (impératif), « il faut que » (subjonctif), condition (conditionnel), fait réel (indicatif).'
- 'Pour écrire une forme, applique les terminaisons du temps au bon radical, puis relis : accord avec le sujet et participe
  passé.'
vocabulaire:
- terme: radical
  definition: partie du verbe qui porte le sens et change peu (chant- dans chantions)
- terme: terminaison
  definition: partie finale du verbe qui indique le temps et la personne
- terme: temps simple
  definition: temps formé d'un seul mot (chantais, chanterai)
- terme: temps composé
  definition: temps formé d'un auxiliaire conjugué et d'un participe passé
- terme: auxiliaire
  definition: verbe avoir ou être qui sert à former les temps composés
- terme: participe passé
  definition: forme du verbe qui suit l'auxiliaire dans un temps composé (chanté, fini, parti)
- terme: mode
  definition: 'manière dont le verbe présente l''action : indicatif, conditionnel, impératif, subjonctif'
- terme: subjonctif
  definition: mode du souhait, du doute ou de l'obligation, souvent après « que »
erreurs_frequentes:
- Confondre le futur simple (je chanterai) et le conditionnel présent (je chanterais).
- Nommer le temps composé d'après le participe passé au lieu du temps de l'auxiliaire.
- Écrire « chantes » à l'impératif 2e personne du singulier des verbes en -er.
- 'Oublier la marque de temps : confondre « nous chantons » et « nous chantions ».'
- Confondre le passé composé (il est parti) et le plus-que-parfait (il était parti).
exemple:
  enonce: Décompose « aurez fini » et donne le nom exact de ce temps composé.
  solution: '« aurez » est l''auxiliaire avoir au futur simple, « fini » est le participe passé de finir. C''est donc le futur
    antérieur : un fait terminé avant un autre fait futur.'
exercices:
- id: identifier-temps-compose
  type: choix
  difficulte: 1
  enonce: « Nous avions terminé le repas quand il est arrivé. » Quel est le temps du verbe « avions terminé » ?
  reponse:
    options:
    - id: a
      texte: le plus-que-parfait
    - id: b
      texte: le passé composé
    - id: c
      texte: le futur antérieur
    bonnes:
    - a
  indices:
    relance: 'Regarde le temps de l''auxiliaire « avoir » : est-il au présent, à l''imparfait ou au futur ?'
    methode: « avions » est la forme de l'imparfait de avoir. Un temps composé avec auxiliaire à l'imparfait porte un nom
      précis.
    etape: Auxiliaire à l'imparfait + participe passé = plus-que-parfait.
  pieges:
  - si:
      contient:
      - b
    relance: Le passé composé utilise l'auxiliaire au présent (« avons »), pas à l'imparfait (« avions »).
  - si:
      contient:
      - c
    relance: Le futur antérieur utilise l'auxiliaire au futur simple (« aurons »), pas à l'imparfait.
  solution: '« avions terminé » est au plus-que-parfait : auxiliaire avoir à l''imparfait + participe passé.'
- id: radical-terminaison
  type: texte_court
  difficulte: 1
  enonce: Dans « finissions », quelle est la terminaison qui marque le temps et la personne ? (écris seulement la terminaison,
    sans le radical)
  reponse:
    acceptees:
    - -issions
    - issions
    fautes_tolerees: 1
  indices:
    relance: Le radical de « finir » est « fin- ». Que reste-t-il une fois le radical enlevé ?
    methode: 'Sépare « fin- » du reste : la terminaison marque ici l''imparfait, 1re personne du pluriel.'
    etape: Compte les lettres après « fin- » et vérifie qu'elles marquent bien l'imparfait, 1re personne du pluriel.
  pieges:
  - si:
      valeur: fin
    relance: « fin » est le radical, pas la terminaison. Cherche ce qui vient après.
  solution: 'La terminaison est « -issions » : elle marque l''imparfait de l''indicatif, 1re personne du pluriel.'
- id: mode-du-verbe
  type: association
  difficulte: 2
  enonce: Associe chaque forme verbale à son mode.
  reponse:
    gauche:
    - id: a
      texte: Viens ici !
    - id: b
      texte: Il faudrait que tu viennes.
    - id: c
      texte: Je viendrais si j'avais le temps.
    droite:
    - id: x
      texte: impératif
    - id: y
      texte: subjonctif
    - id: z
      texte: conditionnel
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: L'impératif n'a pas de sujet exprimé. Le subjonctif suit souvent « que ». Le conditionnel exprime une hypothèse.
    methode: 'Cherche d''abord la phrase sans sujet visible : c''est l''impératif.'
    etape: '« Viens ici ! » n''a pas de sujet exprimé : c''est l''impératif.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au mode qui exprime une hypothèse avec « si ».
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la phrase sans sujet exprimé, puis celle introduite par « que », puis celle avec une condition.
  solution: « Viens ici ! » est à l'impératif ; « il faudrait que tu viennes » est au subjonctif ; « je viendrais si j'avais
    le temps » est au conditionnel.
- id: futur-anterieur-forme
  type: choix
  difficulte: 3
  enonce: Quelle forme est correctement conjuguée au futur antérieur du verbe partir, 3e personne du pluriel ?
  reponse:
    options:
    - id: a
      texte: ils seront partis
    - id: b
      texte: ils sont partis
    - id: c
      texte: ils étaient partis
    bonnes:
    - a
  indices:
    relance: Le futur antérieur utilise l'auxiliaire au futur simple. Quel est le futur simple de « être » pour « ils » ?
    methode: Le futur simple de être à la 3e personne du pluriel est « seront ».
    etape: Associe « seront » (futur simple) au participe passé « partis ».
  pieges:
  - si:
      contient:
      - b
    relance: '« sont partis » est au passé composé : l''auxiliaire est au présent, pas au futur.'
  - si:
      contient:
      - c
    relance: '« étaient partis » est au plus-que-parfait : l''auxiliaire est à l''imparfait, pas au futur.'
  solution: '« ils seront partis » est le futur antérieur : auxiliaire être au futur simple + participe passé.'
- id: compter-temps-composes
  type: nombre
  difficulte: 2
  enonce: Combien de verbes sont à un temps composé dans « Quand il est arrivé, nous avions déjà mangé et nous partirons bientôt.
    » ?
  reponse:
    valeur: 2
    forme: entier
  indices:
    relance: 'Un temps composé s''écrit en deux mots : un auxiliaire et un participe. Combien de fois le vois-tu ?'
    methode: Repère les verbes conjugués un par un et regarde s'ils ont un auxiliaire suivi d'un participe passé.
    etape: « est arrivé » est un premier verbe composé. Cherche le second, puis regarde si le dernier verbe est simple.
  pieges:
  - si:
      valeur: 1
    relance: 'Il y en a plus d''un. Relis la phrase : deux verbes ont un auxiliaire suivi d''un participe.'
  - si:
      valeur: 3
    relance: 'Le dernier verbe est en un seul mot : c''est un temps simple. Recompte.'
  solution: '« est arrivé » (passé composé) et « avions mangé » (plus-que-parfait) sont composés ; « partirons » est un futur
    simple. Total : 2.'
- id: futur-chanter
  type: texte_court
  difficulte: 1
  enonce: Conjugue « chanter » au futur simple de l'indicatif, à la 1re personne du singulier (avec le pronom).
  reponse:
    acceptees:
    - je chanterai
    - chanterai
    fautes_tolerees: 0
  indices:
    relance: Quel est l'infinitif ? On l'utilise comme radical au futur simple.
    methode: Futur simple = infinitif du verbe + terminaison (-ai, -as, -a, -ons, -ez, -ont).
    etape: Commence par « je chanter- » et ajoute la terminaison de la 1re personne du singulier.
  pieges:
  - si:
      valeur: je chanterais
    relance: Tu as écrit le conditionnel présent. Le futur a des terminaisons courtes, sans « -ais » de l'imparfait.
  - si:
      valeur: je chantais
    relance: C'est l'imparfait. Pour le futur, tu dois garder la forme de l'infinitif avant la terminaison.
  solution: 'Futur simple : chanter + ai = je chanterai.'
- id: subjonctif-finir
  type: choix
  difficulte: 2
  enonce: 'Complète : « Il faut que tu ... vite ce travail. » (verbe finir, subjonctif présent)'
  reponse:
    options:
    - id: a
      texte: finisses
    - id: b
      texte: finis
    - id: c
      texte: finiras
    bonnes:
    - a
  indices:
    relance: Après « il faut que », quel mode faut-il employer ?
    methode: Au subjonctif présent, la 2e personne du singulier se termine par -es.
    etape: Le radical de finir au subjonctif est finiss- ; ajoute la terminaison de « tu ».
  pieges:
  - si:
      contient:
      - b
    relance: « finis » est la forme de l'indicatif présent. Après « il faut que », le verbe est au subjonctif.
  - si:
      contient:
      - c
    relance: « finiras » est un futur de l'indicatif. Le subjonctif présent a d'autres terminaisons.
  solution: 'Après « il faut que », on emploie le subjonctif présent : que tu finisses (radical finiss- + -es).'
- id: conjuguer-trois-temps
  type: ouverte
  difficulte: 3
  enonce: 'Écris trois phrases sur un thème de ton choix avec le verbe « partir » : une au plus-que-parfait, une au futur
    antérieur, une au subjonctif passé (après « il faut que » ou « je regrette que »). Souligne l''auxiliaire dans chacune.'
  criteres:
  - Chaque phrase emploie le bon temps, formé avec le bon auxiliaire (être pour partir) au bon temps.
  - Le participe passé « parti » est accordé avec le sujet.
  - Les phrases sont correctes et compréhensibles, et l'auxiliaire est souligné.
  indices:
    relance: Pour chaque temps composé, quel est le temps de l'auxiliaire ?
    methode: 'Plus-que-parfait : auxiliaire à l''imparfait ; futur antérieur : auxiliaire au futur ; subjonctif passé : auxiliaire
      au subjonctif présent. Partir se conjugue avec être.'
    etape: 'Exemple de départ : « Elle était partie... » ; à toi de trouver les deux autres.'
  solution: 'Exemple : « Elles étaient parties avant la pluie. » « Demain, ils seront partis à midi. » « Je regrette qu''elle
    soit partie si tôt. »'
