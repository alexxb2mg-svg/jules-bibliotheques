# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: morphologie-verbale-et-temps
version: 1
etat: verifiee
declencheurs:
- radical et terminaison
- reconnaître le temps du verbe
- conjuguer au futur antérieur
prerequis: []
essentiel: 'Un verbe conjugué se décompose en un radical (le sens) et une terminaison (qui marque le temps et la

  personne). Ex : « chant-ions » : radical « chant- », terminaison « -ions » (imparfait, 1re personne du pluriel).


  Les temps simples de l''indicatif : présent, futur simple, imparfait, passé simple. Les temps composés :

  passé composé (auxiliaire au présent + participe passé), plus-que-parfait (auxiliaire à l''imparfait +

  participe passé), futur antérieur (auxiliaire au futur simple + participe passé).


  Les modes : indicatif (les faits), conditionnel (l''hypothèse), impératif (l''ordre, sans sujet exprimé),

  subjonctif (le souhait, le doute).


  Pour former un temps composé, on ajoute le participe passé du verbe à l''auxiliaire avoir ou être,

  conjugué au temps simple correspondant.

  '
methode:
- Sépare le verbe en radical et terminaison.
- Regarde la terminaison pour reconnaître le temps et la personne.
- 'Pour un temps composé, identifie l''auxiliaire (avoir ou être) et son propre temps : cela donne le nom du temps composé.'
- 'Vérifie la cohérence : un temps composé combine toujours auxiliaire conjugué + participe passé.'
vocabulaire:
- terme: radical
  definition: partie du verbe qui porte le sens, en général invariable ou peu variable
- terme: terminaison
  definition: partie finale du verbe qui marque le temps, le mode et la personne
- terme: temps composé
  definition: temps formé d'un auxiliaire conjugué et d'un participe passé
erreurs_frequentes:
- Confondre le plus-que-parfait (auxiliaire à l'imparfait) et le passé composé (auxiliaire au présent).
- Oublier que le futur antérieur utilise l'auxiliaire au futur simple, pas au présent.
- 'Se tromper sur le radical d''un verbe irrégulier du 3e groupe (aller : je vais, j''irai, j''allais).'
exemple:
  enonce: Décompose « aurez fini » et donne le nom exact de ce temps composé.
  solution: '« aurez » est l''auxiliaire avoir au futur simple, « fini » est le participe passé de finir. C''est donc le futur
    antérieur : un fait terminé avant un autre fait futur.'
exercices:
- id: identifier-temps-compose
  type: choix
  difficulte: 1
  enonce: « Nous avions terminé le repas quand il est arrivé. » Quel est le temps du verbe « avions terminé » ?
  reponse:
    options:
    - id: a
      texte: le plus-que-parfait
    - id: b
      texte: le passé composé
    - id: c
      texte: le futur antérieur
    bonnes:
    - a
  indices:
    relance: 'Regarde le temps de l''auxiliaire « avoir » : est-il au présent, à l''imparfait ou au futur ?'
    methode: « avions » est la forme de l'imparfait de avoir. Un temps composé avec auxiliaire à l'imparfait porte un nom
      précis.
    etape: Auxiliaire à l'imparfait + participe passé = plus-que-parfait.
  pieges:
  - si:
      contient:
      - b
    relance: Le passé composé utilise l'auxiliaire au présent (« avons »), pas à l'imparfait (« avions »).
  - si:
      contient:
      - c
    relance: Le futur antérieur utilise l'auxiliaire au futur simple (« aurons »), pas à l'imparfait.
  solution: '« avions terminé » est au plus-que-parfait : auxiliaire avoir à l''imparfait + participe passé.'
- id: radical-terminaison
  type: texte_court
  difficulte: 1
  enonce: Dans « finissions », quelle est la terminaison qui marque le temps et la personne ? (écris seulement la terminaison,
    sans le radical)
  reponse:
    acceptees:
    - -issions
    - issions
    fautes_tolerees: 1
  indices:
    relance: Le radical de « finir » est « fin- ». Que reste-t-il une fois le radical enlevé ?
    methode: 'Sépare « fin- » du reste : la terminaison marque ici l''imparfait, 1re personne du pluriel.'
    etape: Compte les lettres après « fin- » et vérifie qu'elles marquent bien l'imparfait, 1re personne du pluriel.
  pieges:
  - si:
      valeur: fin
    relance: « fin » est le radical, pas la terminaison. Cherche ce qui vient après.
  solution: 'La terminaison est « -issions » : elle marque l''imparfait de l''indicatif, 1re personne du pluriel.'
- id: mode-du-verbe
  type: association
  difficulte: 2
  enonce: Associe chaque forme verbale à son mode.
  reponse:
    gauche:
    - id: a
      texte: Viens ici !
    - id: b
      texte: Il faudrait que tu viennes.
    - id: c
      texte: Je viendrais si j'avais le temps.
    droite:
    - id: x
      texte: impératif
    - id: y
      texte: subjonctif
    - id: z
      texte: conditionnel
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: L'impératif n'a pas de sujet exprimé. Le subjonctif suit souvent « que ». Le conditionnel exprime une hypothèse.
    methode: 'Cherche d''abord la phrase sans sujet visible : c''est l''impératif.'
    etape: '« Viens ici ! » n''a pas de sujet exprimé : c''est l''impératif.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au mode qui exprime une hypothèse avec « si ».
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la phrase sans sujet exprimé, puis celle introduite par « que », puis celle avec une condition.
  solution: « Viens ici ! » est à l'impératif ; « il faudrait que tu viennes » est au subjonctif ; « je viendrais si j'avais
    le temps » est au conditionnel.
- id: futur-anterieur-forme
  type: choix
  difficulte: 3
  enonce: Quelle forme est correctement conjuguée au futur antérieur du verbe partir, 3e personne du pluriel ?
  reponse:
    options:
    - id: a
      texte: ils seront partis
    - id: b
      texte: ils sont partis
    - id: c
      texte: ils étaient partis
    bonnes:
    - a
  indices:
    relance: Le futur antérieur utilise l'auxiliaire au futur simple. Quel est le futur simple de « être » pour « ils » ?
    methode: Le futur simple de être à la 3e personne du pluriel est « seront ».
    etape: Associe « seront » (futur simple) au participe passé « partis ».
  pieges:
  - si:
      contient:
      - b
    relance: '« sont partis » est au passé composé : l''auxiliaire est au présent, pas au futur.'
  - si:
      contient:
      - c
    relance: '« étaient partis » est au plus-que-parfait : l''auxiliaire est à l''imparfait, pas au futur.'
  solution: '« ils seront partis » est le futur antérieur : auxiliaire être au futur simple + participe passé.'
- id: nblm-dans-la-forme-verbale-chantions-quels-so-1
  type: choix
  difficulte: 2
  enonce: Dans la forme verbale « chantions », quels sont le radical et la terminaison, et que marque cette dernière ?
  reponse:
    options:
    - id: o1
      texte: Le radical est « chant- » et la terminaison est « -ions », qui marque le temps (l'imparfait) et la personne.
    - id: o2
      texte: Le radical est « chanti- » et la terminaison est « -ons », qui marque seulement le temps.
    - id: o3
      texte: Le radical est « chant- » et la terminaison est « -ions », qui marque seulement la personne du singulier.
    - id: o4
      texte: Le radical est invariable pour tous les verbes et la terminaison est « -ons ».
    bonnes:
    - o1
  indices:
    relance: 'Pense aux deux rôles de la terminaison : indiquer à la fois l''époque/le mode et qui réalise l''action.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la terminaison à l''imparfait pour la 1re personne du pluriel est « -ions » et le radical
      est « chant- ».'
  - si:
      contient:
      - o3
    relance: 'Confusion : la terminaison « -ions » marque la 1re personne du pluriel, pas du singulier.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la terminaison comporte ici un « i » (« -ions ») propre à l''imparfait.'
  solution: 'Le radical est « chant- » et la terminaison est « -ions », qui marque le temps (l''imparfait) et la personne.
    C''est exact : le radical « chant- » porte le sens du verbe et la terminaison « -ions » indique le temps et la personne.'
- id: nblm-comment-reconnait-on-qu-un-verbe-est-con-2
  type: choix
  difficulte: 2
  enonce: Comment reconnaît-on qu'un verbe est conjugué à un temps composé ?
  reponse:
    options:
    - id: o1
      texte: Il est formé d'un auxiliaire (avoir ou être) conjugué auquel on ajoute le participe passé du verbe.
    - id: o2
      texte: Il comporte deux verbes à l'infinitif suivis d'une terminaison d'imparfait.
    - id: o3
      texte: Il s'agit d'un verbe ayant deux radicaux différents dans la même phrase.
    - id: o4
      texte: Il est toujours formé du verbe être conjugué au futur simple sans autre mot.
    bonnes:
    - o1
  indices:
    relance: Observe la présence de l'auxiliaire et de la forme verbale qui le suit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : un temps composé se forme avec un auxiliaire conjugué et un participe passé, pas des infinitifs.'
  - si:
      contient:
      - o3
    relance: 'Confusion : la variation de radical concerne certains verbes irréguliers, non la structure des temps composés.'
  - si:
      contient:
      - o4
    relance: 'Erreur : cela omet le participe passé du verbe et limite l''auxiliaire au seul futur.'
  solution: 'Il est formé d''un auxiliaire (avoir ou être) conjugué auquel on ajoute le participe passé du verbe. C''est exact
    : la structure d''un temps composé associe toujours l''auxiliaire et le participe passé.'
- id: nblm-a-quel-temps-doit-etre-conjugue-l-auxili-3
  type: choix
  difficulte: 2
  enonce: À quel temps doit être conjugué l'auxiliaire pour former le futur antérieur du verbe « finir » ?
  reponse:
    options:
    - id: o1
      texte: Au futur simple de l'indicatif (« aura fini » / « aurez fini »).
    - id: o2
      texte: Au présent de l'indicatif (« a fini »).
    - id: o3
      texte: À l'imparfait de l'indicatif (« avait fini »).
    - id: o4
      texte: Au passé simple de l'indicatif (« eut fini »).
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi quel temps simple de l'auxiliaire donne son nom au futur antérieur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''auxiliaire au présent forme le passé composé, pas le futur antérieur.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''auxiliaire à l''imparfait forme le plus-que-parfait.'
  - si:
      contient:
      - o4
    relance: 'Erreur : l''auxiliaire au passé simple forme le passé antérieur, pas le futur antérieur.'
  solution: 'Au futur simple de l''indicatif (« aura fini » / « aurez fini »). C''est exact : le futur antérieur associe l''auxiliaire
    (avoir ou être) au futur simple et le participe passé du verbe.'
- id: nblm-dans-la-phrase-quand-ils-auront-revise-i-4
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Quand ils auront révisé, ils réussiront », à quel temps est conjugué le verbe « auront révisé »
    ?
  reponse:
    options:
    - id: o1
      texte: Au futur antérieur de l'indicatif.
    - id: o2
      texte: Au passé composé de l'indicatif.
    - id: o3
      texte: Au plus-que-parfait de l'indicatif.
    - id: o4
      texte: Au futur simple de l'indicatif.
    bonnes:
    - o1
  indices:
    relance: Analyse le temps de l'auxiliaire « auront ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : au passé composé, l''auxiliaire serait au présent (« ont révisé »).'
  - si:
      contient:
      - o3
    relance: 'Erreur : au plus-que-parfait, l''auxiliaire serait à l''imparfait (« avaient révisé »).'
  - si:
      contient:
      - o4
    relance: 'Erreur : « auront révisé » est un temps composé et non une forme simple.'
  solution: 'Au futur antérieur de l''indicatif. C''est exact : l''auxiliaire « auront » est au futur simple, suivi du participe
    passé « révisé ».'
- id: nblm-quelle-est-la-definition-exacte-du-radic-5
  type: choix
  difficulte: 2
  enonce: Quelle est la définition exacte du radical d'un verbe en morphologie verbale ?
  reponse:
    options:
    - id: o1
      texte: C'est la partie du verbe qui porte le sens et qui est en général invariable ou peu variable.
    - id: o2
      texte: C'est la partie finale du verbe qui indique la personne et le temps.
    - id: o3
      texte: C'est l'auxiliaire être ou avoir placé devant le participe passé.
    - id: o4
      texte: C'est une lettre muette que l'on rajoute uniquement à l'imparfait.
    bonnes:
    - o1
  indices:
    relance: Distingue la base qui contient le sens du verbe de la partie finale qui varie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : cette description correspond à la terminaison, pas au radical.'
  - si:
      contient:
      - o3
    relance: 'Erreur : l''auxiliaire sert à construire les temps composés, ce n''est pas le radical du verbe.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le radical est la base lexicale du verbe.'
  solution: 'C''est la partie du verbe qui porte le sens et qui est en général invariable ou peu variable. C''est la définition
    exacte : le radical contient le sens du verbe, tandis que la terminaison varie selon le temps et la personne.'
- id: nblm-parmi-les-formes-verbales-suivantes-lesq-6
  type: choix
  difficulte: 3
  enonce: Parmi les formes verbales suivantes, lesquelles sont des temps composés de l'indicatif ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le futur antérieur
    - id: o2
      texte: Le plus-que-parfait
    - id: o3
      texte: Le futur simple
    - id: o4
      texte: L'imparfait
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les temps qui nécessitent un auxiliaire conjugué et un participe passé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : le futur simple est un temps simple formé d''un seul mot.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''imparfait est un temps simple formé d''un seul mot.'
  solution: 'Le futur antérieur ; Le plus-que-parfait. Exact : c''est un temps composé (auxiliaire au futur simple + participe
    passé).'
- id: nblm-conjugue-le-verbe-partir-au-futur-anteri-7
  type: texte_court
  difficulte: 1
  enonce: 'Conjugue le verbe « partir » au futur antérieur à la 3e personne du singulier (il) : il sera ___.'
  reponse:
    acceptees:
    - parti
    fautes_tolerees: 1
  indices:
    relance: Trouve le participe passé du verbe « partir » au masculin singulier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: parti. Au futur antérieur avec le sujet « il », l'auxiliaire être au futur simple (« sera ») s'associe au participe
    passé « parti ».
- id: nblm-dans-la-decomposition-du-verbe-chanterai-8
  type: texte_court
  difficulte: 1
  enonce: Dans la décomposition du verbe « chanterai », quel est le terme grammatical désignant la partie qui porte le sens
    du verbe ?
  reponse:
    acceptees:
    - radical
    fautes_tolerees: 1
  indices:
    relance: C'est l'élément opposé à la terminaison dans la morphologie verbale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: radical. Le radical est la partie du verbe qui contient son sens principal.
