# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: coherence-textuelle
version: 1
etat: verifiee
declencheurs:
- mot qui reprend un nom déjà cité
- connecteur logique dans un texte
- indicateur de temps dans un récit
- organisation d'un paragraphe
prerequis: []
essentiel: 'Un texte cohérent tient ensemble grâce à plusieurs outils de liaison.


  Les reprises évitent de répéter le même mot : on utilise un pronom (il, celui-ci), un synonyme, ou

  un groupe nominal différent pour désigner la même chose déjà citée.


  Les indicateurs de temps (« ensuite », « le lendemain ») et de lieu (« plus loin », « là-bas »)

  situent les événements les uns par rapport aux autres.


  Les connecteurs logiques relient les idées entre elles : cause (« car », « parce que »), conséquence

  (« donc », « ainsi »), opposition (« mais », « pourtant »), addition (« de plus », « ensuite »).


  Dans un texte long, le système des temps (le temps de base du récit et ses ruptures) et les marques

  d''organisation (paragraphes, ponctuation, tirets) aident aussi à suivre le fil du texte.

  '
methode:
- 'Repère d''abord de quel type d''élément de cohérence il s''agit : reprise, indicateur, ou connecteur logique.'
- Pour une reprise, cherche le nom ou le groupe nominal cité juste avant qu'elle remplace.
- Pour un connecteur logique, identifie la relation qu'il exprime (cause, conséquence, opposition, addition).
- Pour l'organisation du texte, observe les paragraphes et la ponctuation qui séparent les idées.
vocabulaire:
- terme: connecteur logique
  definition: mot ou groupe de mots qui relie deux idées d'un texte (cause, conséquence, opposition...)
- terme: reprise
  definition: mot ou groupe de mots qui désigne à nouveau un élément déjà cité, sans le répéter
erreurs_frequentes:
- Confondre un connecteur de cause (« car ») avec un connecteur de conséquence (« donc »).
- Ne pas savoir à quoi renvoie un pronom de reprise dans un texte.
- Croire qu'un connecteur d'opposition (« mais ») introduit toujours une nouvelle idée sans lien avec la précédente.
exemple:
  enonce: Dans la phrase « Marie a raté son bus ; elle est donc arrivée en retard », que relie le mot « donc » ?
  solution: 'Le mot « donc » relie une cause (Marie a raté son bus) à sa conséquence (elle est arrivée en retard) : c''est
    un connecteur logique de conséquence.'
exercices:
- id: type-connecteur-donc
  type: choix
  difficulte: 1
  enonce: Dans la phrase « Il a beaucoup révisé, donc il a réussi son contrôle », que marque le mot « donc » ?
  reponse:
    options:
    - id: a
      texte: une conséquence
    - id: b
      texte: une opposition
    - id: c
      texte: une addition
    bonnes:
    - a
  indices:
    relance: Le fait de réussir découle-t-il directement du fait d'avoir révisé ?
    methode: Cherche si la deuxième idée est le résultat logique de la première.
    etape: « Donc » relie une cause (réviser) à son résultat (réussir).
  pieges:
  - si:
      contient:
      - b
    relance: L'opposition se marque plutôt avec « mais » ou « pourtant ». Ici, la deuxième idée découle-t-elle de la première,
      ou la contredit-elle ?
  - si:
      contient:
      - c
    relance: L'addition ajoute une idée nouvelle, sans lien de cause. Ici, réussir est-il juste ajouté, ou est-ce le résultat
      de réviser ?
  solution: '« Donc » marque une conséquence : réussir son contrôle est le résultat direct du fait d''avoir beaucoup révisé.'
- id: reperer-reprise
  type: texte_court
  difficulte: 1
  enonce: Dans « Le chat dormait sur le canapé ; l'animal ne bougeait pas », quel mot du texte reprend « le chat » ? Réponds
    par le groupe nominal complet.
  reponse:
    acceptees:
    - l'animal
    - l animal
    - animal
    fautes_tolerees: 1
  indices:
    relance: Cherche dans la deuxième phrase le groupe nominal qui désigne à nouveau le même être vivant.
    methode: 'Une reprise évite de répéter le même mot : ici, on remplace « le chat » par une expression plus générale.'
    etape: Le groupe nominal commence par « l' » et désigne un être vivant en général.
  pieges:
  - si:
      valeur: le canapé
    relance: Le canapé est un meuble différent, pas une reprise du chat. Cherche le groupe nominal qui désigne l'être vivant.
  solution: '« L''animal » reprend « le chat » : c''est un groupe nominal plus général qui évite de répéter le même mot.'
- id: classer-connecteurs
  type: association
  difficulte: 2
  enonce: Associe chaque connecteur au type de relation logique qu'il exprime.
  reponse:
    gauche:
    - id: a
      texte: car
    - id: b
      texte: pourtant
    - id: c
      texte: de plus
    droite:
    - id: x
      texte: cause
    - id: y
      texte: opposition
    - id: z
      texte: addition
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Lis chaque connecteur dans une phrase imaginaire pour sentir la relation qu'il crée entre deux idées.
    methode: « Car » explique un fait déjà énoncé, « pourtant » contredit une attente, « de plus » ajoute une idée.
    etape: '« Car » introduit toujours l''explication d''un fait qui précède : c''est un connecteur de cause.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au sens précis de chaque connecteur.
  - si:
      diagnostic: associations_fausses
    relance: Classe d'abord les trois connecteurs par grande catégorie (cause, opposition, addition) avant de les associer.
  solution: « Car » exprime la cause, « pourtant » l'opposition, « de plus » l'addition.
- id: organiser-paragraphe
  type: ouverte
  difficulte: 3
  enonce: Écris deux phrases reliées par le connecteur logique « donc », pour illustrer une relation de conséquence de ton
    choix (sujet libre, pas d'histoire personnelle).
  criteres:
  - Les deux phrases sont reliées par « donc » (ou un équivalent de conséquence).
  - La deuxième phrase découle logiquement de la première (vraie relation de cause à conséquence).
  indices:
    relance: Choisis un fait simple, puis demande-toi quelle en est la conséquence logique.
    methode: Écris d'abord la cause, puis relie-la à sa conséquence avec « donc ».
    etape: 'Tu peux t''inspirer d''un exemple scolaire : « Il a plu toute la nuit, donc... ».'
  solution: 'Exemple de réponse : « Il a plu toute la nuit. Le terrain de sport est donc trop boueux pour jouer. » La deuxième
    phrase découle logiquement de la première grâce au connecteur « donc ».'
- id: nblm-quel-role-principal-joue-un-mot-de-repri-1
  type: choix
  difficulte: 2
  enonce: Quel rôle principal joue un mot de reprise (ou substitut) dans un texte ?
  reponse:
    options:
    - id: o1
      texte: Éviter de répéter le même nom en désignant un élément déjà cité.
    - id: o2
      texte: Indiquer la cause ou la conséquence d'une action.
    - id: o3
      texte: Situer les événements uniquement dans l'espace.
    - id: o4
      texte: Marquer le début et la fin d'un paragraphe.
    bonnes:
    - o1
  indices:
    relance: Pense au moyen d'éviter la répétition d'un nom de personnage ou d'objet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : cela correspond au rôle des connecteurs logiques, pas aux mots de reprise.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : cela correspond aux indicateurs de lieu.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la mise en page et la typographie assurent ce rôle d''organisation visuelle.'
  solution: 'Éviter de répéter le même nom en désignant un élément déjà cité. C''est la définition exacte de la reprise textuelle
    : employer un pronom ou un nom équivalent pour désigner un élément déjà mentionné sans se répéter.'
- id: nblm-dans-la-phrase-le-ciel-etait-menacant-ca-2
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Le ciel était menaçant, car l'orage approchait », quelle relation logique exprime le mot « car
    » ?
  reponse:
    options:
    - id: o1
      texte: La cause
    - id: o2
      texte: La conséquence
    - id: o3
      texte: L'opposition
    - id: o4
      texte: L'addition
    bonnes:
    - o1
  indices:
    relance: Demande-toi si ce mot explique la raison pour laquelle le ciel était menaçant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur classique : l''opposition est exprimée par des mots comme « mais » ou « pourtant ».'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : l''addition est exprimée par « de plus » ou « et ».'
  solution: La cause. « Car » est un connecteur logique qui introduit l'explication ou la cause de ce qui précède.
- id: nblm-parmi-les-expressions-suivantes-laquelle-3
  type: choix
  difficulte: 2
  enonce: Parmi les expressions suivantes, laquelle est un indicateur de temps permettant de situer les événements d'un récit
    les uns par rapport aux autres ?
  reponse:
    options:
    - id: o1
      texte: Le lendemain
    - id: o2
      texte: Là-bas
    - id: o3
      texte: Ainsi
    - id: o4
      texte: Parce que
    bonnes:
    - o1
  indices:
    relance: Cherche l'expression qui renvoie au déroulement des jours dans une histoire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : « là-bas » est un indicateur de lieu, non de temps.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « ainsi » est un connecteur logique de conséquence.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « parce que » est un connecteur logique de cause.'
  solution: Le lendemain. « Le lendemain » est un indicateur temporel qui situe un événement par rapport au jour précédent
    dans la chronologie du récit.
- id: nblm-quels-elements-permettent-de-structurer-4
  type: choix
  difficulte: 2
  enonce: Quels éléments permettent de structurer visuellement l'organisation d'un texte et de ses paragraphes ?
  reponse:
    options:
    - id: o1
      texte: Les paragraphes, la ponctuation et les tirets
    - id: o2
      texte: Les adjectifs qualificatifs et les verbes d'action
    - id: o3
      texte: Les figures de style de répétition
    - id: o4
      texte: Les pronoms personnels sujets uniquement
    bonnes:
    - o1
  indices:
    relance: Pense aux marques de mise en page et de découpage typographique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ces mots enrichissent le contenu mais ne constituent pas la structure d''organisation du texte.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la répétition produit un effet stylistique mais n''assure pas la mise en page.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : les pronoms servent de reprise mais ne découpent pas le texte en paragraphes.'
  solution: Les paragraphes, la ponctuation et les tirets. Ces marques d'organisation matérielle et typographique aident le
    lecteur à suivre la progression des idées.
- id: nblm-dans-la-phrase-marie-a-rate-son-bus-elle-5
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Marie a raté son bus ; elle est donc arrivée en retard », quel rôle joue le connecteur « donc »
    ?
  reponse:
    options:
    - id: o1
      texte: Il relie une cause à sa conséquence.
    - id: o2
      texte: Il introduit une opposition inattendue.
    - id: o3
      texte: Il remplace un nom déjà cité.
    - id: o4
      texte: Il situe l'action dans le temps.
    bonnes:
    - o1
  indices:
    relance: Observe ce qui découle du fait d'avoir raté le bus.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : « donc » n''exprime pas l''opposition, mais la suite logique.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « donc » est un connecteur logique, pas un pronom de reprise.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « donc » ne donne pas d''indication temporelle comme « soudain ».'
  solution: 'Il relie une cause à sa conséquence. « Donc » montre l''aboutissement logique d''un fait : le retard est la conséquence
    d''avoir raté le bus.'
- id: nblm-parmi-les-procedes-suivants-quelles-sont-6
  type: choix
  difficulte: 3
  enonce: Parmi les procédés suivants, quelles sont les DEUX méthodes utilisées pour éviter de répéter un mot tout en assurant
    la cohérence du texte ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Utiliser un pronom de reprise (comme « il » ou « celui-ci »)
    - id: o2
      texte: Utiliser un groupe nominal synonyme ou différent
    - id: o3
      texte: Insérer un connecteur d'opposition comme « pourtant »
    - id: o4
      texte: Employer un indicateur de lieu comme « plus loin »
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les deux procédés de reprise (pronominale et nominale) qui désignent un élément déjà cité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « pourtant » relie des idées entre elles, il ne remplace pas un nom.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « plus loin » situe l''action dans l''espace, il n''évite pas la répétition d''un nom.'
  solution: Utiliser un pronom de reprise (comme « il » ou « celui-ci ») ; Utiliser un groupe nominal synonyme ou différent.
    Le pronom est un outil majeur de reprise pronominale pour remplacer un nom déjà mentionné.
- id: nblm-comment-appelle-t-on-un-mot-ou-groupe-de-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un mot ou groupe de mots qui relie deux idées d'un texte pour exprimer la cause, la conséquence
    ou l'opposition ?
  reponse:
    acceptees:
    - connecteur logique
    fautes_tolerees: 1
  indices:
    relance: Terme en deux mots désignant un outil de liaison d'idées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: connecteur logique. Un connecteur logique est le terme exact qui désigne un mot établissant une liaison entre
    deux propositions ou idées.
- id: nblm-quel-terme-designe-un-mot-ou-groupe-de-m-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne un mot ou groupe de mots utilisé pour désigner à nouveau un élément déjà cité sans le répéter
    ?
  reponse:
    acceptees:
    - reprise
    fautes_tolerees: 1
  indices:
    relance: Nom féminin d'un seul mot signifiant le fait de désigner à nouveau un élément cité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: reprise. La reprise désigne le mot ou groupe de mots qui rappelle un élément déjà mentionné.
