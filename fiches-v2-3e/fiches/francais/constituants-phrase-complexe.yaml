format: 2
notion: constituants-phrase-complexe
version: 2
etat: generee
declencheurs:
- deux verbes conjugués dans une phrase
- proposition reliée par un pronom relatif
- phrase reliée par une virgule sans mot de liaison
- subordonnée introduite par que
- phrase simple ou complexe
- coordination ou juxtaposition
- proposition subordonnée infinitive
- proposition participiale
prerequis:
- propositions-subordonnees
essentiel: |
  Une phrase simple a un seul verbe conjugué (une proposition). Une phrase complexe en a plusieurs : elle compte autant de propositions que de verbes conjugués.

  Trois façons de relier des propositions.

  1. La juxtaposition.
  Les propositions sont séparées par une virgule, un point-virgule ou deux-points, sans mot de liaison. « Il pleut, je reste à la maison. »

  2. La coordination.
  Les propositions sont reliées par une conjonction de coordination (mais, ou, et, donc, or, ni, car) ou un adverbe de liaison (puis, ensuite, pourtant). Les propositions restent indépendantes. « Il pleut donc je reste à la maison. »

  3. La subordination.
  Une proposition (la subordonnée) dépend d'une autre (la principale) et ne peut pas être isolée. Elle est introduite par un mot subordonnant : conjonction de subordination (que, quand, parce que, si, bien que) ou pronom relatif (qui, que, dont, où). Une subordonnée est le plus souvent complément dans la proposition principale, ou complète un nom.

  Les principaux types de propositions subordonnées.
  - La conjonctive complétive : introduite par « que » ; elle complète un verbe. « Je sais que tu as raison. »
  - La conjonctive circonstancielle : introduite par quand, parce que, si, bien que... ; elle joue le rôle d'un complément circonstanciel. « Je reste chez moi parce qu'il pleut. »
  - La relative : introduite par un pronom relatif, elle complète un nom (l'antécédent). « Le livre que j'ai lu est passionnant. »
  - L'interrogative indirecte : elle rapporte une question. « Je me demande s'il viendra. »
  - L'infinitive : le verbe est à l'infinitif et a un sujet. « Je vois les enfants jouer. »
  - La participiale : le verbe est à un participe, avec son sujet. « Le soir tombé, nous sommes rentrés. »

  Au brevet, on demande de compter les propositions, de nommer la relation (juxtaposition, coordination, subordination) et le type de subordonnée.
methode:
- 'Souligne chaque verbe conjugué : il y a autant de propositions que de verbes.'
- Cherche entre les propositions un signe de ponctuation seul (juxtaposition) ou une conjonction de coordination (coordination).
- 'Cherche un mot subordonnant : que, quand, si, pronom relatif. Sa présence indique une subordination.'
- 'Repère la proposition principale : celle qui reste comprise quand on enlève la subordonnée.'
- Nomme le type de subordonnée d'après le mot qui l'introduit et sa fonction.
- Vérifie ton analyse en essayant de déplacer ou supprimer la subordonnée.
vocabulaire:
- terme: proposition
  definition: groupe de mots organisé autour d'un verbe conjugué
- terme: juxtaposition
  definition: liaison de propositions par la ponctuation seule, sans mot de liaison
- terme: coordination
  definition: liaison de propositions indépendantes par une conjonction de coordination
- terme: subordination
  definition: liaison où une proposition dépend d'une autre, la principale
- terme: proposition principale
  definition: proposition dont dépend une subordonnée
- terme: proposition subordonnée
  definition: proposition qui dépend d'une autre et ne peut pas être isolée
- terme: proposition relative
  definition: subordonnée introduite par un pronom relatif, qui complète un nom
- terme: interrogative indirecte
  definition: subordonnée qui rapporte une question, sans point d'interrogation
erreurs_frequentes:
- Compter les propositions d'après les virgules au lieu des verbes conjugués.
- Confondre coordination (conjonction de coordination) et subordination (conjonction de subordination).
- 'Prendre « que » pour toujours introduire une relative : il peut introduire une complétive.'
- Oublier qu'une phrase à deux verbes reliés par « et » est coordonnée, pas juxtaposée.
- Croire qu'une subordonnée peut être isolée et former une phrase seule.
exemple:
  enonce: Dans la phrase « Le livre que j'ai lu est passionnant », quel type de proposition est « que j'ai lu » ?
  solution: C'est une proposition subordonnée relative, introduite par le pronom relatif « que », qui reprend le nom « le livre ».
exercices:
- id: compter-propositions
  type: nombre
  difficulte: 1
  enonce: Combien de propositions (verbes conjugués) compte la phrase « Quand il pleut, je reste chez moi et je lis un livre » ?
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Compte les verbes conjugués dans la phrase, un par un.
    methode: Chaque verbe conjugué correspond à une proposition différente.
    etape: 'Les verbes conjugués sont : pleut, reste, lis.'
  pieges:
  - si:
      valeur: 2
    relance: 'Recompte bien : il y a un verbe dans la subordonnée de temps, et deux verbes coordonnés ensuite.'
  solution: 'La phrase compte 3 propositions : « il pleut », « je reste chez moi », « je lis un livre », donc 3 verbes conjugués.'
- id: type-relation
  type: choix
  difficulte: 1
  enonce: Quelle relation relie les deux propositions de « Il pleut, je reste à la maison » ?
  reponse:
    options:
    - id: a
      texte: juxtaposition
    - id: b
      texte: coordination
    - id: c
      texte: subordination
    bonnes:
    - a
  indices:
    relance: Cherche s'il y a un mot de liaison entre les deux propositions, ou seulement une virgule.
    methode: La coordination utilise une conjonction (mais, ou, et...), la subordination un mot subordonnant (que, parce que...).
    etape: Ici, seule une virgule sépare les deux propositions, sans aucun mot de liaison.
  pieges:
  - si:
      contient:
      - b
    relance: La coordination utilise une conjonction comme « et » ou « mais ». Y a-t-il une conjonction ici, ou juste une virgule ?
  - si:
      contient:
      - c
    relance: La subordination utilise un mot comme « parce que » ou « que ». Cherche s'il y en a un ici.
  solution: 'Les deux propositions sont juxtaposées : seule une virgule les sépare, sans conjonction ni mot subordonnant.'
- id: identifier-subordonnee
  type: texte_court
  difficulte: 2
  enonce: Dans la phrase « Je me demande s'il viendra », quel type de subordonnée est « s'il viendra » ? Réponds par deux mots.
  reponse:
    acceptees:
    - interrogative indirecte
    fautes_tolerees: 2
  indices:
    relance: Cette subordonnée répond à une question que l'on se pose, mais sans point d'interrogation.
    methode: Elle est introduite par « si » et dépend d'un verbe qui exprime une interrogation, « se demander ».
    etape: Le mot « interrogative » doit apparaître dans ta réponse, avec un deuxième mot qui précise qu'elle n'est pas posée directement.
  pieges:
  - si:
      valeur: relative
    relance: Une relative est introduite par un pronom relatif (qui, que, dont, où). Ici, la subordonnée est introduite par « si ».
  solution: '« S''il viendra » est une proposition subordonnée interrogative indirecte : elle rapporte une question sans point d''interrogation, introduite par « si » après le verbe « se demander ».'
- id: relier-principale-subordonnee
  type: ouverte
  difficulte: 3
  enonce: Écris une phrase complexe contenant une proposition subordonnée relative introduite par « qui », sur un sujet de ton choix.
  criteres:
  - La phrase contient une proposition principale et une proposition subordonnée relative introduite par « qui ».
  - Le pronom relatif « qui » reprend bien un nom ou un groupe nominal cité juste avant.
  - La phrase est correcte (majuscule, point, accords) et on peut repérer les deux propositions.
  indices:
    relance: Choisis d'abord un nom, puis ajoute une information sur lui avec « qui ».
    methode: 'Construis ta phrase ainsi : [proposition principale] + [nom] + qui + [information sur ce nom].'
    etape: 'Tu peux par exemple décrire une personne ou un objet : « Le chien qui aboie... ».'
  solution: 'Exemple de réponse : « Le chien qui aboie dans le jardin appartient à mon voisin. » La proposition subordonnée relative « qui aboie dans le jardin » complète le nom « le chien ».'
- id: nature-subordonnee
  type: choix
  difficulte: 2
  enonce: Dans « Je pense qu'il viendra. », quelle est la nature de « qu'il viendra » ?
  reponse:
    options:
    - id: a
      texte: subordonnée conjonctive complétive
    - id: b
      texte: subordonnée relative
    - id: c
      texte: subordonnée interrogative indirecte
    bonnes:
    - a
  indices:
    relance: 'Que complète le mot « que » : un nom ou le verbe « pense » ?'
    methode: Une relative complète un nom ; une complétive complète un verbe ; une interrogative indirecte rapporte une question.
    etape: 'Ici, le verbe « pense » attend un complément : on cherche ce qu''on pense.'
  pieges:
  - si:
      contient:
      - b
    relance: Une relative est introduite par un pronom relatif et complète un nom. Ici, il n'y a pas de nom devant « que ».
  - si:
      contient:
      - c
    relance: Une interrogative indirecte rapporte une question. Ici, on n'a pas de question posée.
  solution: '« qu''il viendra » est une subordonnée conjonctive complétive : elle complète le verbe « pense ».'
- id: compter-propositions-4
  type: nombre
  difficulte: 2
  enonce: Combien de propositions compte la phrase « Je crois que tu as raison, mais je ne dis rien parce que je suis fatigué » ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Compte les verbes conjugués un par un.
    methode: Une proposition est organisée autour d'un verbe conjugué. Ignore les mots de liaison.
    etape: Le premier verbe est « crois », le deuxième « as ». Continue.
  pieges:
  - si:
      valeur: 3
    relance: Il y en a plus de trois. Relis la phrase et compte chaque verbe conjugué.
  - si:
      valeur: 2
    relance: 'Ne compte pas seulement les parties séparées par la virgule : vois chaque verbe conjugué.'
  solution: 'Verbes conjugués : crois, as, dis, suis. Il y a 4 propositions.'
- id: types-subordonnees
  type: association
  difficulte: 3
  enonce: Associe chaque phrase à la nature de sa subordonnée.
  reponse:
    gauche:
    - id: a
      texte: Le film que j'ai vu est long.
    - id: b
      texte: Je sais que tu as raison.
    - id: c
      texte: Dis-moi si tu viens.
    - id: d
      texte: Je vois les enfants jouer.
    - id: e
      texte: Le soir tombé, nous sommes rentrés.
    droite:
    - id: y
      texte: conjonctive complétive
    - id: z
      texte: interrogative indirecte
    - id: w
      texte: infinitive
    - id: v
      texte: participiale
    - id: x
      texte: relative
    paires:
      a: x
      b: y
      c: z
      d: w
      e: v
  indices:
    relance: Repère le mot qui introduit la subordonnée ou la forme du verbe (infinitif, participe).
    methode: Pronom relatif = relative ; « que » après un verbe = complétive ; « si » qui rapporte une question = interrogative indirecte.
    etape: Commence par la phrase avec un verbe à l'infinitif qui a son propre sujet.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque phrase et vérifie le mot qui introduit la subordonnée.
  - si:
      diagnostic: associations_fausses
    relance: Classe d'abord les subordonnées avec mot introducteur, puis celles dont le verbe est à l'infinitif ou au participe.
  solution: 'Le film que j''ai vu : relative ; Je sais que tu as raison : conjonctive complétive ; Dis-moi si tu viens : interrogative indirecte ; Je vois les enfants jouer : infinitive ; Le soir tombé : participiale.'
- id: methode-analyse-phrase-complexe
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes de l'analyse d'une phrase complexe.
  reponse:
    elements:
    - id: a
      texte: Compter les verbes conjugués
    - id: b
      texte: Repérer les mots de liaison entre les propositions
    - id: c
      texte: Identifier la proposition principale
    - id: d
      texte: Nommer le type de subordonnée
  indices:
    relance: 'Par quoi commence-t-on : nommer ou compter ?'
    methode: On compte d'abord les propositions, puis on cherche les liens, la principale, et enfin on nomme le type.
    etape: La première étape est de compter les verbes conjugués.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Tu as inversé deux étapes voisines. Pense à ce qu'il faut savoir avant de nommer une subordonnée.
  - si:
      diagnostic: ordre_faux
    relance: 'L''ordre logique est : compter, repérer les liens, trouver la principale, nommer la subordonnée.'
  solution: Compter les verbes ; repérer les mots de liaison ; identifier la principale ; nommer le type de subordonnée.
