# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: constituants-phrase-complexe
version: 1
etat: verifiee
declencheurs:
- deux verbes conjugués dans une phrase
- proposition reliée par un pronom relatif
- phrase reliée par une virgule sans mot de liaison
- subordonnée introduite par que
prerequis:
- propositions-subordonnees
essentiel: 'Une phrase complexe contient plusieurs verbes conjugués, donc plusieurs propositions.


  La juxtaposition relie deux propositions par une simple ponctuation (virgule, point-virgule), sans mot

  de liaison : « Il pleut, je reste à la maison. »

  La coordination relie deux propositions par une conjonction de coordination (mais, ou, et, donc, or,

  ni, car) : « Il pleut et je reste à la maison. »

  La subordination relie une proposition principale à une proposition subordonnée, qui dépend d''elle et

  ne peut pas exister seule : « Je reste à la maison parce qu''il pleut. »


  Il existe plusieurs types de subordonnées : la conjonctive (introduite par « que », « parce que »...),

  l''interrogative indirecte (« Je me demande s''il viendra. »), la relative (introduite par un pronom

  relatif : qui, que, dont, où), l''infinitive et la participiale.

  '
methode:
- 'Compte d''abord le nombre de verbes conjugués : plusieurs verbes conjugués signalent une phrase complexe.'
- 'Cherche s''il y a un mot de liaison entre les propositions : aucun mot = juxtaposition, conjonction de coordination = coordination.'
- Si une proposition dépend d'une autre et ne peut pas être isolée, c'est une subordination.
- Pour identifier le type de subordonnée, regarde le mot qui l'introduit (que, pronom relatif, si...).
vocabulaire:
- terme: subordination
  definition: relation entre deux propositions où l'une dépend de l'autre et ne peut pas exister seule
- terme: proposition relative
  definition: proposition subordonnée introduite par un pronom relatif (qui, que, dont, où)
erreurs_frequentes:
- Confondre juxtaposition (aucun mot de liaison) et coordination (conjonction de coordination).
- Croire qu'une proposition subordonnée peut exister seule, sans la principale.
- Confondre une subordonnée relative (introduite par un pronom relatif) et une subordonnée conjonctive (introduite par « que
  »).
exemple:
  enonce: Dans la phrase « Le livre que j'ai lu est passionnant », quel type de proposition est « que j'ai lu » ?
  solution: C'est une proposition subordonnée relative, introduite par le pronom relatif « que », qui reprend le nom « le
    livre ».
exercices:
- id: compter-propositions
  type: nombre
  difficulte: 1
  enonce: Combien de propositions (verbes conjugués) compte la phrase « Quand il pleut, je reste chez moi et je lis un livre
    » ?
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Compte les verbes conjugués dans la phrase, un par un.
    methode: Chaque verbe conjugué correspond à une proposition différente.
    etape: 'Les verbes conjugués sont : pleut, reste, lis.'
  pieges:
  - si:
      valeur: 2
    relance: 'Recompte bien : il y a un verbe dans la subordonnée de temps, et deux verbes coordonnés ensuite.'
  solution: 'La phrase compte 3 propositions : « il pleut », « je reste chez moi », « je lis un livre », donc 3 verbes conjugués.'
- id: type-relation
  type: choix
  difficulte: 1
  enonce: Quelle relation relie les deux propositions de « Il pleut, je reste à la maison » ?
  reponse:
    options:
    - id: a
      texte: juxtaposition
    - id: b
      texte: coordination
    - id: c
      texte: subordination
    bonnes:
    - a
  indices:
    relance: Cherche s'il y a un mot de liaison entre les deux propositions, ou seulement une virgule.
    methode: La coordination utilise une conjonction (mais, ou, et...), la subordination un mot subordonnant (que, parce que...).
    etape: Ici, seule une virgule sépare les deux propositions, sans aucun mot de liaison.
  pieges:
  - si:
      contient:
      - b
    relance: La coordination utilise une conjonction comme « et » ou « mais ». Y a-t-il une conjonction ici, ou juste une
      virgule ?
  - si:
      contient:
      - c
    relance: La subordination utilise un mot comme « parce que » ou « que ». Cherche s'il y en a un ici.
  solution: 'Les deux propositions sont juxtaposées : seule une virgule les sépare, sans conjonction ni mot subordonnant.'
- id: identifier-subordonnee
  type: texte_court
  difficulte: 2
  enonce: Dans la phrase « Je me demande s'il viendra », quel type de subordonnée est « s'il viendra » ? Réponds par deux
    mots.
  reponse:
    acceptees:
    - interrogative indirecte
    fautes_tolerees: 2
  indices:
    relance: Cette subordonnée répond à une question que l'on se pose, mais sans point d'interrogation.
    methode: Elle est introduite par « si » et dépend d'un verbe qui exprime une interrogation, « se demander ».
    etape: Le mot « interrogative » doit apparaître dans ta réponse, avec un deuxième mot qui précise qu'elle n'est pas posée
      directement.
  pieges:
  - si:
      valeur: relative
    relance: Une relative est introduite par un pronom relatif (qui, que, dont, où). Ici, la subordonnée est introduite par
      « si ».
  solution: '« S''il viendra » est une proposition subordonnée interrogative indirecte : elle rapporte une question sans point
    d''interrogation, introduite par « si » après le verbe « se demander ».'
- id: relier-principale-subordonnee
  type: ouverte
  difficulte: 3
  enonce: Écris une phrase complexe contenant une proposition subordonnée relative introduite par « qui », sur un sujet de
    ton choix.
  criteres:
  - La phrase contient une proposition principale et une proposition subordonnée relative introduite par « qui ».
  - Le pronom relatif « qui » reprend bien un nom ou un groupe nominal cité juste avant.
  indices:
    relance: Choisis d'abord un nom, puis ajoute une information sur lui avec « qui ».
    methode: 'Construis ta phrase ainsi : [proposition principale] + [nom] + qui + [information sur ce nom].'
    etape: 'Tu peux par exemple décrire une personne ou un objet : « Le chien qui aboie... ».'
  solution: 'Exemple de réponse : « Le chien qui aboie dans le jardin appartient à mon voisin. » La proposition subordonnée
    relative « qui aboie dans le jardin » complète le nom « le chien ».'
- id: nblm-combien-de-verbes-conjugues-contient-au-1
  type: choix
  difficulte: 2
  enonce: Combien de verbes conjugués contient au minimum une phrase complexe ?
  reponse:
    options:
    - id: o1
      texte: Au moins deux verbes conjugués
    - id: o2
      texte: Un seul verbe conjugué
    - id: o3
      texte: Aucun verbe conjugué
    - id: o4
      texte: Au moins trois verbes à l'infinitif
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui définit le nombre de propositions dans une phrase.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : une phrase contenant un seul verbe conjugué est une phrase simple, pas une phrase
      complexe.'
  - si:
      contient:
      - o3
    relance: Une phrase sans verbe conjugué est une phrase non verbale ou nominale.
  - si:
      contient:
      - o4
    relance: Les verbes à l'infinitif ne comptent pas comme noyaux de proposition pour définir une phrase complexe.
  solution: 'Au moins deux verbes conjugués. C''est exact : une phrase complexe se caractérise par la présence d''au moins
    deux verbes conjugués, formant ainsi plusieurs propositions.'
- id: nblm-dans-la-phrase-le-soleil-se-leve-les-ois-2
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Le soleil se lève, les oiseaux chantent », comment les deux propositions sont-elles reliées ?
  reponse:
    options:
    - id: o1
      texte: Par juxtaposition
    - id: o2
      texte: Par coordination
    - id: o3
      texte: Par subordination
    - id: o4
      texte: Par un pronom relatif
    bonnes:
    - o1
  indices:
    relance: Observe le signe de ponctuation qui sépare les deux verbes conjugués.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la coordination nécessite une conjonction de coordination (mais, ou, et, donc, or, ni, car),
      ce qui n''est pas le cas ici.'
  - si:
      contient:
      - o3
    relance: La subordination requiert un mot subordonnant qui relie une proposition subordonnée à sa principale.
  - si:
      contient:
      - o4
    relance: Il n'y a aucun pronom relatif (comme qui, que, dont, où) reliant les propositions.
  solution: 'Par juxtaposition. C''est correct : les deux propositions sont séparées par une simple virgule, sans aucun mot
    de liaison.'
- id: nblm-quelle-phrase-contient-une-proposition-s-3
  type: choix
  difficulte: 2
  enonce: Quelle phrase contient une proposition subordonnée relative introduite par un pronom relatif ?
  reponse:
    options:
    - id: o1
      texte: Le livre que j'ai lu est passionnant.
    - id: o2
      texte: Je pense que tu as raison.
    - id: o3
      texte: Il pleut et le vent souffle fort.
    - id: o4
      texte: Le chat dort sur le fauteuil.
    bonnes:
    - o1
  indices:
    relance: Cherche la proposition qui complète un nom situé juste avant elle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : ici « que » est une conjonction de subordination introduisant une subordonnée conjonctive,
      sans antécédent nom.'
  - si:
      contient:
      - o3
    relance: Il s'agit de deux propositions coordonnées par la conjonction « et », sans aucune subordonnée.
  - si:
      contient:
      - o4
    relance: C'est une phrase simple ne contenant qu'un seul verbe conjugué.
  solution: 'Le livre que j''ai lu est passionnant. C''est juste : « que j''ai lu » est une subordonnée relative introduite
    par le pronom relatif « que », qui complète le nom « le livre ».'
- id: nblm-quelle-est-la-nature-exacte-de-la-subord-4
  type: choix
  difficulte: 2
  enonce: 'Quelle est la nature exacte de la subordonnée dans la phrase : « Je sais que tu réussiras » ?'
  reponse:
    options:
    - id: o1
      texte: Une proposition subordonnée conjonctive
    - id: o2
      texte: Une proposition subordonnée relative
    - id: o3
      texte: Une proposition indépendante juxtaposée
    - id: o4
      texte: Une proposition indépendante coordonnée
    bonnes:
    - o1
  indices:
    relance: Regarde la classe grammaticale du mot situé juste avant le mot « que ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion classique : « que » n''a pas d''antécédent nom ici (il suit le verbe « sais »), ce n''est donc pas
      un pronom relatif.'
  - si:
      contient:
      - o3
    relance: La proposition dépend du verbe principal « sais » et est introduite par un mot de liaison.
  - si:
      contient:
      - o4
    relance: « que » n'est pas une conjonction de coordination (mais, ou, et, donc, or, ni, car).
  solution: 'Une proposition subordonnée conjonctive. C''est exact : « que » est ici une conjonction de subordination introduisant
    une subordonnée complément de verbe.'
- id: nblm-laquelle-de-ces-phrases-complexes-compor-5
  type: choix
  difficulte: 2
  enonce: Laquelle de ces phrases complexes comporte deux propositions reliées par coordination ?
  reponse:
    options:
    - id: o1
      texte: Elle voulait sortir, mais il s'est mis à pleuvoir.
    - id: o2
      texte: Elle voulait sortir, il s'est mis à pleuvoir.
    - id: o3
      texte: Puisqu'il pleuvait, elle est restée à la maison.
    - id: o4
      texte: La pluie qui tombe rafraîchit l'air.
    bonnes:
    - o1
  indices:
    relance: 'Repère la conjonction parmi : mais, ou, et, donc, or, ni, car.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Cette phrase relie les deux propositions par une virgule sans mot de liaison : c''est de la juxtaposition.'
  - si:
      contient:
      - o3
    relance: « Puisqu'il pleuvait » est une subordonnée introduite par une conjonction de subordination.
  - si:
      contient:
      - o4
    relance: « qui tombe » est une proposition subordonnée relative introduite par le pronom relatif « qui ».
  solution: 'Elle voulait sortir, mais il s''est mis à pleuvoir. C''est exact : la conjonction de coordination « mais » relie
    les deux propositions.'
- id: nblm-quelles-sont-les-deux-phrases-complexes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX phrases complexes qui contiennent une proposition subordonnée ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'élève révise ses leçons parce qu'il veut réussir.
    - id: o2
      texte: Le film que nous avons vu était très captivant.
    - id: o3
      texte: Le vent souffle, les feuilles tombent des arbres.
    - id: o4
      texte: Paul travaille bien car il est très motivé.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les phrases où une proposition dépend d'une principale grâce à un mot subordonnant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : ces deux propositions sont juxtaposées par une virgule, sans relation de subordination.'
  - si:
      contient:
      - o4
    relance: 'Erreur : « car » est une conjonction de coordination ; il s''agit d''une coordination et non d''une subordination.'
  solution: 'L''élève révise ses leçons parce qu''il veut réussir ; Le film que nous avons vu était très captivant. C''est
    juste : « parce qu''il veut réussir » est une subordonnée conjonctive.'
- id: nblm-comment-appelle-t-on-le-mode-de-liaison-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le mode de liaison de deux propositions reliées par un simple signe de ponctuation (comme une
    virgule) sans mot de liaison ?
  reponse:
    acceptees:
    - juxtaposition
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par la lettre 'j' et désigne le fait d'être placé à côté sans mot de liaison.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: juxtaposition. La juxtaposition désigne la liaison de deux propositions par une ponctuation sans mot de liaison.
- id: nblm-quel-type-de-pronom-ex-qui-que-dont-ou-i-8
  type: texte_court
  difficulte: 1
  enonce: Quel type de pronom (ex. qui, que, dont, où) introduit une proposition subordonnée relative ?
  reponse:
    acceptees:
    - pronom relatif
    fautes_tolerees: 1
  indices:
    relance: Ce type de pronom établit une relation avec un antécédent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: pronom relatif. Le pronom relatif sert à introduire la proposition subordonnée relative et remplace son antécédent.
