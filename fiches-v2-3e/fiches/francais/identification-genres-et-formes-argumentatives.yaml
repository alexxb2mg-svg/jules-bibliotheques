# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: identification-genres-et-formes-argumentatives
version: 2
etat: verifiee
declencheurs:
- reconnaître un genre argumentatif
- identifier un essai ou un discours
- situer une œuvre dans son époque
- lettre ouverte ou pamphlet
- Candide de Voltaire genre
- différence convaincre persuader
- effets de style d'un texte
- donner mon avis sur un texte littéraire
prerequis: []
essentiel: 'Argumenter, c''est défendre une idée, la thèse, avec des arguments et des exemples. On peut convaincre (s''adresser
  à la raison, avec des arguments logiques) ou persuader (toucher les émotions, faire agir).


  Plusieurs genres servent à argumenter. L''essai est un texte en prose où l''auteur développe une réflexion personnelle (les
  « Essais » de Montaigne, XVIe siècle). Le discours est prononcé devant un public pour le convaincre. La lettre ouverte s''adresse
  publiquement à quelqu''un, souvent par la presse : « J''accuse... ! » de Zola (1898, journal L''Aurore) en est l''exemple
  célèbre. L''article et le pamphlet défendent une opinion, le second de façon violente.


  L''argumentation peut aussi être indirecte. La fable (La Fontaine, XVIIe siècle) raconte une petite histoire, souvent avec
  des animaux, dont la morale donne la leçon. Le conte philosophique (« Candide », Voltaire, 1759) critique la société à travers
  une histoire.


  Contextualiser une œuvre, c''est la replacer dans son époque : à quelle date a-t-elle été écrite ? Quels événements, quels
  débats, quel mouvement artistique (classicisme, Lumières, romantisme...) l''entourent ? Un texte de 1898 sur l''affaire
  Dreyfus ne se comprend pas sans cette affaire.


  Un texte littéraire produit aussi des effets par la langue : choix des mots, rythme des phrases, images (comparaison, métaphore),
  répétitions (anaphore), oppositions (antithèse). Ces effets esthétiques donnent du poids à l''argument. Les percevoir aide
  à interpréter le texte et à formuler un jugement personnel : « ce passage est efficace parce que... ».


  Au brevet, on attend que tu identifies le genre et la forme argumentative, que tu donnes un élément de contexte et que tu
  relèves un effet de langue en expliquant son rôle.

  '
methode:
- Identifier la thèse défendue (l'idée que l'auteur veut faire admettre) et les arguments qui la soutiennent.
- 'Identifier la forme argumentative : essai, discours, lettre ouverte, fable, conte philosophique, article ou pamphlet.'
- 'Rechercher le contexte : date, événement, mouvement littéraire ou culturel, en s''appuyant sur ses connaissances d''histoire.'
- Repérer les effets de langue (mots choisis, rythme, images, répétitions) et se demander pourquoi l'auteur les utilise.
- Formuler un jugement personnel en s'appuyant sur ce qu'on a observé dans le texte.
vocabulaire:
- terme: essai
  definition: texte en prose où un auteur développe une réflexion personnelle sur un sujet
- terme: contextualiser
  definition: replacer une œuvre dans son époque et ses circonstances historiques ou culturelles
- terme: thèse
  definition: l'idée que l'auteur défend dans un texte argumentatif
- terme: argument
  definition: raison donnée pour soutenir une thèse
- terme: convaincre
  definition: faire admettre une idée par des arguments logiques, en s'adressant à la raison
- terme: persuader
  definition: faire adhérer en touchant les émotions du lecteur ou de l'auditoire
- terme: lettre ouverte
  definition: lettre adressée à quelqu'un mais rendue publique, souvent dans un journal
- terme: conte philosophique
  definition: court récit imaginaire qui critique la société et défend des idées
erreurs_frequentes:
- Confondre l'essai, qui développe une réflexion, avec un simple récit sans intention argumentative.
- Étudier un texte sans jamais chercher son contexte historique, alors que cela éclaire souvent son sens.
- Réduire un texte littéraire à ses idées, sans voir les effets produits par le choix des mots et du rythme.
- 'Croire que seul un texte qui dit « je pense que » argumente : une fable ou un conte argumentent aussi, de façon détournée.'
- Donner un jugement sans le justifier par un exemple précis pris dans le texte.
exemple:
  enonce: Explique en une phrase ce que signifie contextualiser une oeuvre littéraire.
  solution: C'est replacer l'oeuvre dans son époque, en s'appuyant sur des connaissances historiques et culturelles, pour
    mieux comprendre ce qu'elle veut dire.
exercices:
- id: definir-essai
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un essai, en littérature ?
  reponse:
    options:
    - id: a
      texte: Un texte en prose où un auteur développe une réflexion personnelle sur un sujet
    - id: b
      texte: Un poème écrit en vers réguliers
    - id: c
      texte: Une pièce de théâtre jouée sur scène
    - id: d
      texte: Un roman qui raconte une histoire imaginaire sans réflexion
    bonnes:
    - a
  indices:
    relance: Pense à Montaigne, qui réfléchit sur lui-même et sur l'homme dans un texte appelé « Les Essais ».
    methode: Élimine les définitions qui ne parlent pas de réflexion personnelle en prose.
    etape: 'La bonne réponse associe deux idées : la prose et la réflexion personnelle.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Un essai n''est pas écrit en vers réguliers : c''est un texte en prose.'
  - si:
      contient:
      - c
    relance: 'Un essai n''est pas joué sur scène : c''est un texte lu, pas une pièce de théâtre.'
  - si:
      contient:
      - d
    relance: 'Un essai n''est pas une histoire imaginaire sans réflexion : il développe justement une réflexion personnelle.'
  solution: Un essai est un texte en prose où un auteur développe une réflexion personnelle sur un sujet.
- id: mot-replacer-epoque
  type: texte_court
  difficulte: 2
  enonce: Quel verbe désigne le fait de replacer une oeuvre dans son époque et ses circonstances historiques ?
  reponse:
    acceptees:
    - contextualiser
    fautes_tolerees: 2
  indices:
    relance: Ce mot est construit sur « contexte », qui désigne l'ensemble des circonstances autour d'un texte.
    methode: Cherche le verbe formé à partir du mot « contexte ».
    etape: Le mot commence par « contextu- ».
  pieges:
  - si:
      valeur: interpreter
    relance: Interpréter, c'est donner un sens à un texte. Le mot cherché parle plus précisément de replacer le texte dans
      son époque.
  solution: 'Le verbe est contextualiser : replacer une oeuvre dans son époque et ses circonstances historiques ou culturelles.'
- id: genres-argumentatifs
  type: association
  difficulte: 2
  enonce: Associe chaque genre argumentatif à sa description.
  reponse:
    gauche:
    - id: a
      texte: L'essai
    - id: b
      texte: Le discours
    - id: c
      texte: La fable
    droite:
    - id: x
      texte: Une réflexion personnelle développée en prose
    - id: y
      texte: Un texte prononcé devant un public pour convaincre
    - id: z
      texte: Une histoire courte, souvent avec des animaux, qui argumente de façon détournée
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces genres est prononcé à voix haute devant un public, un autre raconte une histoire, le dernier est une
      réflexion écrite.
    methode: Associe d'abord l'essai à la réflexion écrite, puis le discours à la parole publique, puis la fable au récit
      détourné.
    etape: L'essai est une réflexion en prose ; le discours est prononcé devant un public ; la fable argumente à travers une
      histoire.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la différence entre essai et discours.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque genre un par un, en te demandant s'il est écrit, prononcé, ou raconté sous forme d'histoire.
  solution: L'essai développe une réflexion personnelle en prose, le discours est prononcé devant un public pour convaincre,
    la fable argumente de façon détournée à travers une histoire.
- id: ordre-lecture-analyse
  type: ordre
  difficulte: 2
  enonce: Range ces trois étapes dans l'ordre logique pour analyser un texte argumentatif.
  reponse:
    elements:
    - id: identifier
      texte: Identifier la forme argumentative du texte (essai, discours, fable...)
    - id: contextualiser
      texte: Rechercher le contexte historique et culturel de l'oeuvre
    - id: juger
      texte: Formuler un jugement personnel sur le texte
  indices:
    relance: On identifie d'abord de quel genre il s'agit, avant de chercher son contexte, puis de juger le texte.
    methode: Range d'abord l'identification du genre, puis la recherche du contexte, puis le jugement final.
    etape: Il faut d'abord savoir quel type de texte on lit, avant de le replacer dans son époque, puis d'en juger la valeur.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Laquelle des deux vient logiquement en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui doit venir en premier (identifier le genre), puis la dernière (juger).
  solution: On identifie d'abord la forme argumentative du texte, puis on recherche son contexte historique et culturel, puis
    on formule un jugement personnel.
- id: analyser-texte-argumentatif
  type: ouverte
  difficulte: 3
  enonce: Choisis un texte argumentatif étudié en classe et explique sa forme, son contexte, et un effet de langue qu'il utilise.
  criteres:
  - L'élève identifie la forme argumentative du texte choisi (essai, discours, fable, lettre ouverte...).
  - L'élève donne un élément de contexte historique ou culturel de ce texte.
  - L'élève repère un effet de langue (choix des mots, rythme, image) et explique son rôle.
  indices:
    relance: Quelle forme prend ce texte ? À quelle époque a-t-il été écrit ? Quel mot ou quelle image t'a marqué ?
    methode: Nomme d'abord la forme du texte, puis son contexte, puis un effet de langue précis que tu as remarqué.
    etape: Tu peux commencer ainsi « Ce texte est un(e)..., écrit en..., et il utilise... pour convaincre ».
  solution: Par exemple, « J'accuse... ! » de Zola est une lettre ouverte, publiée en 1898 pendant l'affaire Dreyfus, qui
    utilise la répétition du mot « J'accuse » pour marquer les esprits et rendre l'accusation plus forte.
- id: nblm-quel-genre-litteraire-argumentatif-se-de-1
  type: choix
  difficulte: 2
  enonce: Quel genre littéraire argumentatif se définit comme un texte en prose où l'auteur développe une réflexion personnelle
    sur un sujet ?
  reponse:
    options:
    - id: o1
      texte: L'essai
    - id: o2
      texte: Le roman d'aventure
    - id: o3
      texte: Le poème en vers
    - id: o4
      texte: La pièce de théâtre
    bonnes:
    - o1
  indices:
    relance: Pense au genre de prose réflexive où l'auteur exprime directement son point de vue sans passer par des personnages.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges: []
  solution: L'essai. C'est la définition exacte de l'essai selon le vocabulaire de la fiche de notion.
- id: nblm-que-signifie-l-action-de-contextualiser-2
  type: choix
  difficulte: 2
  enonce: Que signifie l'action de « contextualiser » une œuvre littéraire ?
  reponse:
    options:
    - id: o1
      texte: Replacer l'œuvre dans son époque à l'aide de connaissances historiques et culturelles.
    - id: o2
      texte: Résumer l'intrigue principale du récit chapitre par chapitre.
    - id: o3
      texte: Analyser uniquement la grammaire et la ponctuation des phrases.
    - id: o4
      texte: Traduire le texte dans une langue étrangère moderne.
    bonnes:
    - o1
  indices:
    relance: Pense au lien entre la littérature et l'histoire de l'époque où l'auteur a écrit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur typique qui confond l'analyse du contexte historique avec un simple résumé d'histoire.
  - si:
      contient:
      - o3
    relance: C'est une erreur typique qui réduit l'étude littéraire à l'étude de la langue sans dimension culturelle.
  - si:
      contient:
      - o4
    relance: C'est une erreur qui confond la contextualisation avec un travail de traduction.
  solution: Replacer l'œuvre dans son époque à l'aide de connaissances historiques et culturelles. C'est la définition exacte
    donnée dans la fiche pour mieux comprendre le sens de l'œuvre.
- id: nblm-parmi-ces-formes-argumentatives-laquelle-3
  type: choix
  difficulte: 2
  enonce: Parmi ces formes argumentatives, laquelle permet de défendre une idée de façon détournée à travers une histoire
    ?
  reponse:
    options:
    - id: o1
      texte: La fable ou le conte philosophique
    - id: o2
      texte: Le discours prononcé en public
    - id: o3
      texte: L'essai littéraire
    - id: o4
      texte: La lettre ouverte
    bonnes:
    - o1
  indices:
    relance: Cherche la forme qui passe par le récit de fiction pour faire réfléchir le lecteur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur car le discours est une forme argumentative directe s'adressant explicitement à un auditoire.
  - si:
      contient:
      - o3
    relance: C'est une erreur car l'essai développe directement une réflexion en prose sans passer par une fiction.
  - si:
      contient:
      - o4
    relance: C'est une erreur car la lettre ouverte interpelle directement un destinataire public sans utiliser d'histoire.
  solution: La fable ou le conte philosophique. Ces formes utilisent le récit fictif pour transmettre une morale ou une critique
    de façon indirecte.
- id: nblm-selon-les-programmes-officiels-de-3e-dan-4
  type: choix
  difficulte: 2
  enonce: Selon les programmes officiels de 3e, dans quelle diversité de textes l'élève doit-il savoir repérer une visée argumentative
    ?
  reponse:
    options:
    - id: o1
      texte: Dans des textes de natures variées, comme une fable, un discours ou un récit de science-fiction.
    - id: o2
      texte: Uniquement dans les discours politiques écrits.
    - id: o3
      texte: Seulement dans les règles de grammaire et les dictionnaires.
    - id: o4
      texte: Uniquement dans les articles de journaux sportifs.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que l'argumentation ne se limite pas à un seul genre mais traverse des récits, des poèmes ou des
      discours.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur typique de restreindre l'argumentation aux seuls discours officiels.
  - si:
      contient:
      - o3
    relance: C'est une erreur qui confond les écrits explicatifs ou informatifs avec l'argumentation.
  - si:
      contient:
      - o4
    relance: C'est une erreur qui limite l'argumentation à un domaine de presse très restreint.
  solution: Dans des textes de natures variées, comme une fable, un discours ou un récit de science-fiction. Les attendus
    de 3e précisent qu'une visée argumentative peut être repérée dans des genres et natures de textes divers.
- id: nblm-quelle-erreur-typique-commet-on-lorsqu-o-5
  type: choix
  difficulte: 2
  enonce: Quelle erreur typique commet-on lorsqu'on étudie un texte argumentatif littéraire ?
  reponse:
    options:
    - id: o1
      texte: Réduire le texte à ses idées sans analyser l'effet produit par le choix des mots et le rythme.
    - id: o2
      texte: Chercher à comprendre l'époque à laquelle l'auteur a écrit son texte.
    - id: o3
      texte: Identifier si le texte cherche à convaincre ou à persuader.
    - id: o4
      texte: Reconnaître le genre littéraire auquel appartient le texte.
    bonnes:
    - o1
  indices:
    relance: Pense à l'importance de la forme littéraire et du style par rapport au seul contenu d'idées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Au contraire, chercher le contexte historique est une démarche recommandée et indispensable.
  - si:
      contient:
      - o3
    relance: Distinguer convaincre et persuader est au cœur de l'analyse argumentative.
  - si:
      contient:
      - o4
    relance: Identifier le genre est une étape essentielle de l'analyse.
  solution: Réduire le texte à ses idées sans analyser l'effet produit par le choix des mots et le rythme. La fiche signale
    expressément qu'il faut observer la langue et le rythme, pas seulement les idées.
- id: nblm-quelles-sont-les-deux-formes-argumentati-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux formes argumentatives directes citées dans la fiche de la notion ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'essai
    - id: o2
      texte: Le discours
    - id: o3
      texte: La fable
    - id: o4
      texte: Le conte philosophique
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les genres qui exposent directement des idées sans inventer d'histoire ou de personnages.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est une erreur car la fable est une forme argumentative indirecte ou détournée par un récit.
  - si:
      contient:
      - o4
    relance: C'est une erreur car le conte philosophique argumente de façon détournée via des aventures fictives.
  solution: L'essai ; Le discours. L'essai est une forme argumentative directe où l'auteur développe sa réflexion personnelle.
- id: nblm-comment-appelle-t-on-le-texte-en-prose-d-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le texte en prose dans lequel un auteur développe une réflexion personnelle sur un sujet ?
  reponse:
    acceptees:
    - un essai
    fautes_tolerees: 1
  indices:
    relance: Nom masculin commençant par un 'e', désignant un ouvrage de réflexion personnelle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: un essai. C'est le terme exact défini dans la fiche pour désigner cette forme d'écriture réflexive.
- id: nblm-quel-verbe-designe-l-action-de-replacer-8
  type: texte_court
  difficulte: 1
  enonce: Quel verbe désigne l'action de replacer une œuvre dans son époque et ses circonstances historiques ?
  reponse:
    acceptees:
    - contextualiser
    fautes_tolerees: 1
  indices:
    relance: Verbe à l'infinitif construit sur la racine du mot 'contexte'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: contextualiser. C'est le verbe précis employé dans le programme et la fiche de notion.
- id: convaincre-persuader
  type: association
  difficulte: 2
  enonce: Associe chaque notion à sa définition.
  reponse:
    gauche:
    - id: a
      texte: La thèse
    - id: b
      texte: Convaincre
    - id: c
      texte: Persuader
    droite:
    - id: x
      texte: L'idée que l'auteur défend
    - id: y
      texte: Faire admettre une idée par des arguments logiques
    - id: z
      texte: Faire adhérer en touchant les émotions
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une notion désigne l'idée défendue, les deux autres désignent la façon d'agir sur le lecteur (raison ou émotion).
    methode: Associe d'abord la thèse, puis distingue la raison de l'émotion.
    etape: Convaincre s'adresse à la raison ; persuader touche les sentiments.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends-les une par une.
  - si:
      diagnostic: associations_fausses
    relance: Pars de l'association dont tu es le plus sûr, puis avance une par une.
  solution: La thèse est l'idée défendue ; convaincre passe par des arguments logiques ; persuader passe par les émotions.
- id: figure-repetition
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on la répétition d'un même mot au début de phrases ou de vers successifs, comme « J'accuse...
    » répété dans le texte de Zola ?
  reponse:
    acceptees:
    - anaphore
    fautes_tolerees: 1
  indices:
    relance: C'est une figure de style de répétition, qui donne de la force et du rythme.
    methode: Cherche un mot qui commence par « ana- ».
    etape: Il rime avec « métaphore ».
  pieges:
  - si:
      valeur: métaphore
    relance: La métaphore est une comparaison sans outil. Ici, on cherche la figure de la répétition.
  solution: 'C''est l''anaphore : la répétition d''un même mot en début de phrases, qui insiste sur l''idée et frappe les
    esprits.'
- id: genre-candide
  type: choix
  difficulte: 2
  enonce: « Candide » de Voltaire (1759) raconte les aventures d'un jeune homme pour critiquer la société et défendre des
    idées. De quel genre s'agit-il ?
  reponse:
    options:
    - id: a
      texte: Un conte philosophique
    - id: b
      texte: Un discours prononcé devant un public
    - id: c
      texte: Un poème lyrique
    - id: d
      texte: Un article de presse d'aujourd'hui
    bonnes:
    - a
  indices:
    relance: Ce texte raconte une histoire imaginaire, mais son but est d'argumenter.
    methode: Cherche le genre qui mêle un récit et une critique d'idées.
    etape: Ce genre appartient au siècle des Lumières et argumente à travers une histoire.
  pieges:
  - si:
