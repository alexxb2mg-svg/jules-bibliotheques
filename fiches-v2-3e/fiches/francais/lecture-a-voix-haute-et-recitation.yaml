format: 2
notion: lecture-a-voix-haute-et-recitation
version: 2
etat: verifiee
declencheurs:
- lire un texte devant la classe
- réciter un poème
- travailler ma diction
- enregistrer ma voix
- dire un poème devant la classe
- apprendre un poème par cœur
- s'enregistrer pour se réécouter
- lire un texte à haute voix
prerequis: []
essentiel: 'Lire à voix haute, c''est donner vie à un texte pour un auditoire. Réciter, c''est dire de mémoire un texte appris.
  Dans les deux cas, on se met en voix pour faire comprendre et ressentir le texte.


  Avant de lire : on comprend le texte (sens des mots, ton, situation), on repère les liaisons, les mots difficiles, la ponctuation.
  On s''entraîne plusieurs fois, si possible en s''enregistrant pour s''écouter.


  Les ressources de la voix : le volume (assez fort pour être entendu de tous), le débit (ni trop rapide, ni trop lent), le
  rythme (accélérer ou ralentir selon le sens), l''intonation (la mélodie de la voix, qui monte pour une question, descend
  pour une affirmation), l''articulation (bien prononcer chaque syllabe) et les pauses (aux virgules, aux points, à la fin
  des vers).


  La respiration : on respire calmement, on reprend son souffle aux pauses prévues par la ponctuation ou le sens, et non au
  milieu d''un groupe de mots.


  Le regard : on lève les yeux du texte pour regarder le public. Quand on récite, on regarde l''auditoire, pas ses pieds.


  La gestuelle et la posture : on se tient droit, on garde les mains libres, on utilise quelques gestes simples pour souligner
  le sens, sans en faire trop.


  Le choix du ton dépend du texte : un poème mélancolique se dit doucement, un texte comique avec de la vivacité. Pour un
  poème, on marque les vers et les rimes sans réciter de façon monotone.


  Mise en voix numérique : on peut enregistrer sa voix avec un téléphone ou un ordinateur, la réécouter pour s''améliorer,
  et associer des sons, une musique, des images au texte pour un projet (lecture enregistrée, diaporama sonore).


  Ce qu''on attend : une lecture ou une récitation fluide, expressive et audible, qui montre la compréhension du texte.'
methode:
- 'Comprendre le texte : sens des mots, situation, ton, sentiments du personnage ou du poète.'
- Repérer la ponctuation, les liaisons, les mots difficiles et prévoir les pauses.
- S'entraîner à voix haute, si possible en s'enregistrant pour se réécouter.
- Choisir le volume, le débit, l'intonation et le rythme adaptés au sens du texte.
- Respirer calmement, regarder le public et garder une posture droite.
- Utiliser quelques gestes simples pour souligner le sens, sans en faire trop.
vocabulaire:
- terme: récitation
  definition: action de dire de mémoire un texte appris, en le mettant en voix
- terme: mise en voix
  definition: manière de dire un texte à voix haute pour en faire ressentir le sens
- terme: intonation
  definition: mélodie de la voix, qui monte ou descend selon le sens
- terme: débit
  definition: vitesse à laquelle on parle
- terme: articulation
  definition: façon de bien prononcer chaque syllabe
- terme: pause
  definition: court silence qu'on fait à la ponctuation ou à la fin d'un vers
- terme: gestuelle
  definition: les gestes et la posture qui accompagnent la parole
- terme: liaison
  definition: consonne prononcée entre deux mots pour enchaîner (les_amis)
erreurs_frequentes:
- Lire ou réciter trop vite, sans pauses ni respiration.
- Réciter d'une voix monotone, sans intonation.
- Regarder ses pieds ou le texte au lieu de regarder le public.
- Apprendre par cœur sans avoir compris le texte.
- Multiplier les gestes qui détournent l'attention du texte.
exemple:
  enonce: 'Un élève doit réciter les vers : « Demain, dès l''aube, à l''heure où blanchit la campagne, Je partirai. » Explique
    en une phrase comment il peut utiliser sa voix pour marquer la détermination du vers « Je partirai ».'
  solution: Il peut marquer une courte pause avant « Je partirai », puis dire ces mots avec une voix plus ferme et un peu
    plus forte, pour montrer la détermination du personnage.
exercices:
- id: reconnaitre-bonne-lecture
  type: choix
  difficulte: 1
  enonce: Un élève lit un texte à voix haute très vite, sans jamais s'arrêter aux virgules ni aux points. Quel est le problème
    principal de sa lecture ?
  reponse:
    options:
    - id: a
      texte: Il ne respecte pas la ponctuation, ce qui rend le texte difficile à comprendre pour l'auditoire
    - id: b
      texte: Il lit trop lentement
    - id: c
      texte: Il regarde trop l'auditoire
    - id: d
      texte: Il utilise trop de gestes
    bonnes:
    - a
  indices:
    relance: Que se passe-t-il pour l'auditoire quand on ne marque aucune pause entre les phrases ?
    methode: La ponctuation sert à indiquer où respirer et où marquer une pause de sens ; l'ignorer rend le texte confus.
    etape: Repère le problème décrit dans l'énoncé (lecture rapide, aucune pause) et son effet sur la compréhension.
  pieges:
  - si:
      contient:
      - b
    relance: L'énoncé dit qu'il lit très vite, pas lentement. Relis l'énoncé.
  - si:
      contient:
      - c
    relance: L'énoncé ne parle pas du regard de l'élève, mais de son rythme de lecture.
  - si:
      contient:
      - d
    relance: L'énoncé ne parle pas de gestes, mais du non-respect de la ponctuation.
  solution: Le problème principal est qu'il ne respecte pas la ponctuation, ce qui empêche l'auditoire de bien suivre le sens
    du texte.
- id: mot-intonation
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne la variation de la hauteur et du ton de la voix, utilisée pour donner du sens ou de l'émotion à
    un texte lu ou récité ?
  reponse:
    acceptees:
    - intonation
    fautes_tolerees: 2
  indices:
    relance: C'est ce qui fait qu'une même phrase peut sonner comme une question, un ordre, ou une émotion selon la façon
      dont on la dit.
    methode: Le mot est de la même famille que « tonalité », qui vient de « ton ».
    etape: Le mot commence par « into- » et se termine par « -nation ».
  pieges:
  - si:
      valeur: volume
    relance: Le volume désigne la force du son (fort ou doux). Le mot cherché désigne plutôt la variation de hauteur et de
      ton de la voix.
  solution: 'L''intonation : la variation de la hauteur et du ton de la voix, utilisée pour donner du sens ou de l''émotion
    à un texte.'
- id: etapes-preparation-recitation
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour préparer la récitation d'un poème mémorisé.
  reponse:
    elements:
    - id: a
      texte: Je repère la ponctuation et les endroits où marquer une pause
    - id: b
      texte: Je m'entraîne à dire le texte en variant l'intonation selon le sens des vers
    - id: c
      texte: Je m'entraîne à regarder l'auditoire plutôt que le sol
    - id: d
      texte: Je m'enregistre pour vérifier mon débit et mon articulation
  indices:
    relance: Quelle est la toute première chose à faire, avant même de travailler sa voix ?
    methode: On repère d'abord la structure du texte (pauses), puis on travaille la voix, puis le regard, puis on vérifie
      par un enregistrement.
    etape: On commence toujours par repérer la ponctuation du texte.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la préparation (la ponctuation) et celle qui la ferme (l'enregistrement).
  solution: On repère d'abord la ponctuation, puis on travaille l'intonation, puis on s'entraîne à regarder l'auditoire, puis
    on s'enregistre pour vérifier.
- id: ressource-vocale-fonction
  type: association
  difficulte: 3
  enonce: Relie chaque ressource de la voix ou du corps à son rôle dans une récitation.
  reponse:
    gauche:
    - id: a
      texte: La respiration
    - id: b
      texte: Le regard
    - id: c
      texte: La gestuelle
    droite:
    - id: x
      texte: Permet de marquer des pauses sans couper le sens du texte
    - id: y
      texte: Permet de garder le contact avec l'auditoire
    - id: z
      texte: Accompagne le texte par des mouvements sans le surjouer
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque ressource, demande-toi si elle sert à respirer, à regarder, ou à bouger.
    methode: La respiration gère les pauses, le regard gère le contact avec l'auditoire, la gestuelle accompagne le sens par
      des mouvements.
    etape: Commence par la respiration, la ressource la plus facile à repérer.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au rôle précis de chaque ressource.
  - si:
      diagnostic: associations_fausses
    relance: Repars de la respiration, qui gère les pauses, puis distingue regard et gestuelle.
  solution: La respiration permet de marquer des pauses sans couper le sens. Le regard garde le contact avec l'auditoire.
    La gestuelle accompagne le texte sans le surjouer.
- id: ressources-effet
  type: association
  difficulte: 2
  enonce: Relie chaque ressource de la mise en voix à ce qu'elle permet.
  reponse:
    gauche:
    - id: a
      texte: Le débit
    - id: b
      texte: L'intonation
    - id: c
      texte: L'articulation
    - id: d
      texte: Le volume
    droite:
    - id: w
      texte: la vitesse à laquelle on parle
    - id: x
      texte: la mélodie de la voix qui monte ou descend
    - id: y
      texte: la clarté de la prononciation des syllabes
    - id: z
      texte: la force avec laquelle on parle pour être entendu
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Pour chaque mot, cherche s'il s'agit de vitesse, de mélodie, de clarté ou de force.
    methode: L'intonation, c'est la mélodie ; le volume, c'est la force ; le débit, c'est la vitesse.
    etape: 'Commence par l''articulation : quelle définition parle de prononcer les syllabes ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien la vitesse (débit) et la force (volume).
  - si:
      diagnostic: associations_fausses
    relance: Repars de l'articulation (prononciation) et de l'intonation (mélodie), puis place les deux autres.
  solution: 'Débit : vitesse. Intonation : mélodie. Articulation : clarté de la prononciation. Volume : force de la voix.'
- id: bonne-recitation
  type: choix
  difficulte: 2
  enonce: Quelle attitude est la plus appropriée pour réciter un poème devant la classe ?
  reponse:
    options:
    - id: a
      texte: Regarder ses pieds et réciter très vite pour en finir
    - id: b
      texte: Regarder le public, parler assez fort et marquer les pauses
    - id: c
      texte: Lire tout d'une voix monotone, sans respirer
    - id: d
      texte: Chuchoter pour ne pas se tromper
    bonnes:
    - b
  indices:
    relance: Une bonne récitation s'adresse au public.
    methode: Cherche la réponse qui combine regard, volume et pauses.
    etape: Élimine les attitudes qui empêchent d'être entendu ou compris.
  pieges:
  - si:
      contient:
      - a
    relance: Regarder ses pieds et aller trop vite empêche d'être compris. Que faut-il faire du regard ?
  - si:
      contient:
      - c
    relance: Une voix monotone et sans respiration ne donne pas vie au texte.
  - si:
      contient:
      - d
    relance: Chuchoter empêche la classe d'entendre. Quel volume faut-il ?
  solution: Regarder le public, parler assez fort et marquer les pauses rend la récitation claire et vivante.
- id: preparer-lecture
  type: ordre
  difficulte: 2
  enonce: Range ces étapes de préparation d'une lecture à voix haute dans l'ordre logique.
  reponse:
    elements:
    - id: comprendre
      texte: Comprendre le texte et repérer les mots difficiles
    - id: reperer
      texte: Repérer la ponctuation et prévoir les pauses
    - id: entrainer
      texte: S'entraîner à voix haute plusieurs fois
    - id: enregistrer
      texte: S'enregistrer et se réécouter pour progresser
  indices:
    relance: On ne peut pas bien lire un texte qu'on n'a pas compris.
    methode: On comprend, on prévoit les pauses, on s'entraîne, puis on s'enregistre.
    etape: S'enregistrer intervient une fois qu'on s'est déjà entraîné.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque. Deux étapes voisines sont inversées : peut-on s''enregistrer avant de s''être entraîné ?'
  - si:
      diagnostic: ordre_faux
    relance: Pars de la première étape (comprendre) et de la dernière (s'enregistrer), puis place les deux autres.
  solution: Comprendre le texte, repérer les pauses, s'entraîner à voix haute, puis s'enregistrer et se réécouter.
- id: preparer-recitation-conseils
  type: ouverte
  difficulte: 3
  enonce: Tu dois réciter un poème de quatre vers devant la classe la semaine prochaine. Explique comment tu vas te préparer
    et ce que tu feras pendant la récitation (voix, respiration, regard, gestes). Rédige 6 à 8 lignes.
  criteres:
  - L'élève décrit une préparation concrète (comprendre le texte, apprendre, s'entraîner, éventuellement s'enregistrer).
  - L'élève cite au moins trois ressources de la mise en voix (volume, débit, intonation, pauses, respiration, regard, gestes)
    et explique à quoi elles servent.
  - L'élève rédige des phrases complètes, organisées, en lien avec le poème choisi.
  indices:
    relance: Que fais-tu avant de réciter, puis pendant ?
    methode: 'Fais deux parties : la préparation, puis la récitation avec voix, regard et gestes.'
    etape: Pense à expliquer pourquoi chaque ressource aide le public à comprendre.
  solution: 'Exemple : Je comprends d''abord le poème, puis je m''entraîne chaque jour à voix haute et je m''enregistre pour
    me réécouter. Le jour J, je parle assez fort pour être entendu et j''articule. Je fais une pause à la fin de chaque vers
    pour laisser le sens se poser. Je respire calmement, je regarde mes camarades et je garde les mains libres pour un geste
    simple.'
