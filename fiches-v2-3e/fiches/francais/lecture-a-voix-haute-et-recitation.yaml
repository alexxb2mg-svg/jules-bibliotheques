# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: lecture-a-voix-haute-et-recitation
version: 1
etat: verifiee
declencheurs:
- lire un texte devant la classe
- réciter un poème
- travailler ma diction
- enregistrer ma voix
prerequis: []
essentiel: 'Lire un texte à voix haute demande de bien articuler, de respecter la ponctuation (pauses aux virgules, points),

  et d''adapter le volume et le rythme pour être bien compris par l''auditoire. On ne lit pas un texte informatif

  comme un poème : un poème peut demander plus de lenteur, plus d''expressivité.


  Réciter un texte mémorisé, c''est aller plus loin que la lecture : on utilise sa voix (intonation, variations de

  volume), sa respiration (pauses pour reprendre son souffle sans couper le sens), son regard (regarder l''auditoire,

  pas seulement le sol) et sa gestuelle (des gestes qui accompagnent le texte sans le surjouer).


  Les outils numériques (dictaphone, application d''enregistrement) permettent de s''enregistrer pour s''écouter,

  repérer ses défauts (débit trop rapide, voix trop monotone) et s''améliorer, ou pour créer un montage associant

  voix, sons et images.

  '
methode:
- Avant de lire à voix haute, repérer la ponctuation pour prévoir les pauses.
- Adapter le volume et le rythme au texte (plus lent et expressif pour un poème, plus neutre pour un texte informatif).
- Pour réciter, s'entraîner à regarder l'auditoire plutôt que de fixer le sol ou une feuille.
- Utiliser des gestes et des variations de voix pour accompagner le sens du texte, sans excès.
- S'enregistrer pour s'écouter et repérer ce qui peut être amélioré (débit, articulation, volume).
vocabulaire:
- terme: diction
  definition: manière d'articuler et de prononcer les mots à voix haute
- terme: intonation
  definition: variation de la hauteur et du ton de la voix pour donner du sens ou de l'émotion à un texte
erreurs_frequentes:
- Lire trop vite sans respecter les pauses indiquées par la ponctuation.
- Réciter en gardant les yeux fixés sur le sol ou sur la feuille, sans jamais regarder l'auditoire.
- Garder le même ton du début à la fin d'un poème, sans aucune variation d'intonation.
exemple:
  enonce: 'Un élève doit réciter les vers : « Demain, dès l''aube, à l''heure où blanchit la campagne, Je partirai. » Explique
    en une phrase comment il peut utiliser sa voix pour marquer la détermination du vers « Je partirai ».'
  solution: Il peut marquer une courte pause avant « Je partirai », puis dire ces mots avec une voix plus ferme et un peu
    plus forte, pour montrer la détermination du personnage.
exercices:
- id: reconnaitre-bonne-lecture
  type: choix
  difficulte: 1
  enonce: Un élève lit un texte à voix haute très vite, sans jamais s'arrêter aux virgules ni aux points. Quel est le problème
    principal de sa lecture ?
  reponse:
    options:
    - id: a
      texte: Il ne respecte pas la ponctuation, ce qui rend le texte difficile à comprendre pour l'auditoire
    - id: b
      texte: Il lit trop lentement
    - id: c
      texte: Il regarde trop l'auditoire
    - id: d
      texte: Il utilise trop de gestes
    bonnes:
    - a
  indices:
    relance: Que se passe-t-il pour l'auditoire quand on ne marque aucune pause entre les phrases ?
    methode: La ponctuation sert à indiquer où respirer et où marquer une pause de sens ; l'ignorer rend le texte confus.
    etape: Repère le problème décrit dans l'énoncé (lecture rapide, aucune pause) et son effet sur la compréhension.
  pieges:
  - si:
      contient:
      - b
    relance: L'énoncé dit qu'il lit très vite, pas lentement. Relis l'énoncé.
  - si:
      contient:
      - c
    relance: L'énoncé ne parle pas du regard de l'élève, mais de son rythme de lecture.
  - si:
      contient:
      - d
    relance: L'énoncé ne parle pas de gestes, mais du non-respect de la ponctuation.
  solution: Le problème principal est qu'il ne respecte pas la ponctuation, ce qui empêche l'auditoire de bien suivre le sens
    du texte.
- id: mot-intonation
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne la variation de la hauteur et du ton de la voix, utilisée pour donner du sens ou de l'émotion à
    un texte lu ou récité ?
  reponse:
    acceptees:
    - intonation
    fautes_tolerees: 2
  indices:
    relance: C'est ce qui fait qu'une même phrase peut sonner comme une question, un ordre, ou une émotion selon la façon
      dont on la dit.
    methode: Le mot est de la même famille que « tonalité », qui vient de « ton ».
    etape: Le mot commence par « into- » et se termine par « -nation ».
  pieges:
  - si:
      valeur: volume
    relance: Le volume désigne la force du son (fort ou doux). Le mot cherché désigne plutôt la variation de hauteur et de
      ton de la voix.
  solution: 'L''intonation : la variation de la hauteur et du ton de la voix, utilisée pour donner du sens ou de l''émotion
    à un texte.'
- id: etapes-preparation-recitation
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour préparer la récitation d'un poème mémorisé.
  reponse:
    elements:
    - id: a
      texte: Je repère la ponctuation et les endroits où marquer une pause
    - id: b
      texte: Je m'entraîne à dire le texte en variant l'intonation selon le sens des vers
    - id: c
      texte: Je m'entraîne à regarder l'auditoire plutôt que le sol
    - id: d
      texte: Je m'enregistre pour vérifier mon débit et mon articulation
  indices:
    relance: Quelle est la toute première chose à faire, avant même de travailler sa voix ?
    methode: On repère d'abord la structure du texte (pauses), puis on travaille la voix, puis le regard, puis on vérifie
      par un enregistrement.
    etape: On commence toujours par repérer la ponctuation du texte.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la préparation (la ponctuation) et celle qui la ferme (l'enregistrement).
  solution: On repère d'abord la ponctuation, puis on travaille l'intonation, puis on s'entraîne à regarder l'auditoire, puis
    on s'enregistre pour vérifier.
- id: ressource-vocale-fonction
  type: association
  difficulte: 3
  enonce: Relie chaque ressource de la voix ou du corps à son rôle dans une récitation.
  reponse:
    gauche:
    - id: a
      texte: La respiration
    - id: b
      texte: Le regard
    - id: c
      texte: La gestuelle
    droite:
    - id: x
      texte: Permet de marquer des pauses sans couper le sens du texte
    - id: y
      texte: Permet de garder le contact avec l'auditoire
    - id: z
      texte: Accompagne le texte par des mouvements sans le surjouer
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque ressource, demande-toi si elle sert à respirer, à regarder, ou à bouger.
    methode: La respiration gère les pauses, le regard gère le contact avec l'auditoire, la gestuelle accompagne le sens par
      des mouvements.
    etape: Commence par la respiration, la ressource la plus facile à repérer.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au rôle précis de chaque ressource.
  - si:
      diagnostic: associations_fausses
    relance: Repars de la respiration, qui gère les pauses, puis distingue regard et gestuelle.
  solution: La respiration permet de marquer des pauses sans couper le sens. Le regard garde le contact avec l'auditoire.
    La gestuelle accompagne le texte sans le surjouer.
- id: nblm-comment-definit-on-la-notion-de-diction-1
  type: choix
  difficulte: 2
  enonce: Comment définit-on la notion de « diction » lorsqu'un élève cherche à travailler sa diction pour lire un texte devant
    la classe ?
  reponse:
    options:
    - id: o1
      texte: La manière d'articuler et de prononcer les mots à voix haute.
    - id: o2
      texte: Le fait de réciter un texte le plus rapidement possible sans faire de pauses.
    - id: o3
      texte: L'apprentissage par cœur d'un texte sans s'occuper de la prononciation.
    - id: o4
      texte: L'écriture d'un texte sous la dictée de l'enseignant.
    bonnes:
    - o1
  indices:
    relance: Pense à la manière dont les sons et les mots sont formés et articulés par la bouche à l'oral.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, lire trop vite est une erreur fréquente qui nuit à la clarté et à la compréhension de la lecture.
  - si:
      contient:
      - o3
    relance: La diction concerne spécifiquement l'articulation et la prononciation des mots, non la seule mémorisation.
  - si:
      contient:
      - o4
    relance: Il ne faut pas confondre la diction (travail de l'expression orale) avec la dictée (exercice d'écriture).
  solution: La manière d'articuler et de prononcer les mots à voix haute. C'est la définition exacte fournie par la fiche
    de notion sur la diction.
- id: nblm-quand-tu-dois-reciter-un-poeme-memorise-2
  type: choix
  difficulte: 2
  enonce: Quand tu dois réciter un poème mémorisé devant la classe, que dois-tu faire de ton regard selon la fiche de notion
    ?
  reponse:
    options:
    - id: o1
      texte: Regarder l'auditoire plutôt que de fixer le sol ou sa feuille.
    - id: o2
      texte: Garder les yeux fixés sur sa feuille pour être sûr de ne rien oublier.
    - id: o3
      texte: Regarder uniquement le sol pour mieux se concentrer.
    - id: o4
      texte: Fermer les yeux du début à la fin de la récitation.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la meilleure façon de captiver les camarades qui t'écoutent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Fixer sa feuille lors d'une récitation est une erreur fréquente qui coupe la communication avec l'auditoire.
  - si:
      contient:
      - o3
    relance: Regarder le sol donne une impression de fermeture et empêche de porter sa voix vers la classe.
  - si:
      contient:
      - o4
    relance: Fermer les yeux empêche de maintenir l'attention des camarades et de partager l'interprétation du poème.
  solution: Regarder l'auditoire plutôt que de fixer le sol ou sa feuille. Regarder la classe permet d'établir le contact
    avec le public et d'adresser pleinement son texte.
- id: nblm-pour-quelle-raison-principale-est-il-con-3
  type: choix
  difficulte: 2
  enonce: Pour quelle raison principale est-il conseillé d'enregistrer ma voix à l'aide d'un outil numérique avant de passer
    à l'oral ?
  reponse:
    options:
    - id: o1
      texte: Pour s'écouter, repérer ses défauts (débit trop rapide, voix monotone) et s'améliorer.
    - id: o2
      texte: Pour remplacer l'évaluation orale en classe par l'envoi d'un fichier audio.
    - id: o3
      texte: Pour déformer sa voix afin que les camarades ne la reconnaissent pas.
    - id: o4
      texte: Pour éviter d'avoir à mémoriser son texte.
    bonnes:
    - o1
  indices:
    relance: Pense aux défauts de débit ou d'intonation que l'on parvient à déceler lorsqu'on se réécoute.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'enregistrement numérique sert de support d'entraînement individuel, pas de remplacement de la récitation en
      classe.
  - si:
      contient:
      - o3
    relance: L'objectif est d'analyser sa voix réelle pour améliorer sa clarté et son expressivité.
  - si:
      contient:
      - o4
    relance: L'outil numérique aide à préparer et affiner la mise en voix, mais ne dispense pas d'apprendre le texte.
  solution: Pour s'écouter, repérer ses défauts (débit trop rapide, voix monotone) et s'améliorer. S'enregistrer offre un
    recul réflexif sur sa prestation afin de corriger son débit, sa diction et son intonation.
- id: nblm-selon-les-reperes-annuels-de-progression-4
  type: choix
  difficulte: 2
  enonce: Selon les repères annuels de progression en classe de 3e, quelle longueur de texte mémorisé un élève doit-il être
    capable de réciter ?
  reponse:
    options:
    - id: o1
      texte: Un texte mémorisé de 20 à 25 lignes.
    - id: o2
      texte: Un texte mémorisé de 5 à 10 lignes seulement.
    - id: o3
      texte: Un texte mémorisé de 50 à 60 lignes.
    - id: o4
      texte: Une seule strophe de 4 vers.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi du nombre de lignes visé pour la récitation en fin de cycle 4.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un texte de 5 à 10 lignes correspond à des objectifs de début de cycle, bien en deçà des exigences de 3e.
  - si:
      contient:
      - o3
    relance: Cette longueur est excessive et dépasse ce qui est exigé par le programme officiel de 3e.
  - si:
      contient:
      - o4
    relance: Une seule strophe est insuffisante pour travailler l'ensemble des ressources de la voix et de la gestuelle en
      3e.
  solution: Un texte mémorisé de 20 à 25 lignes. C'est l'attendu officiel pour la classe de 3e (fin du cycle 4) indiqué dans
    les repères de progression.
- id: nblm-lorsque-tu-prepares-la-lecture-d-un-poem-5
  type: choix
  difficulte: 2
  enonce: Lorsque tu prépares la lecture d'un poème pour lire un texte devant la classe, comment dois-tu adapter ton rythme
    par rapport à un texte informatif ?
  reponse:
    options:
    - id: o1
      texte: Le poème exige souvent plus de lenteur et plus d'expressivité qu'un texte informatif.
    - id: o2
      texte: Il faut lire le poème le plus rapidement possible pour ne pas ennuyer l'auditoire.
    - id: o3
      texte: Le poème doit être lu sur un ton parfaitement neutre et sans aucune émotion.
    - id: o4
      texte: Il faut ignorer la ponctuation pour réciter d'un seul trait.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que nécessite la mise en valeur des sonorités, du rythme et des émotions d'un poème.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Précipiter la lecture empêche l'auditoire de saisir le sens poétique et la beauté des sonorités.
  - si:
      contient:
      - o3
    relance: Un ton neutre convient à un texte documentaire, mais ôte au poème toute sa dimension esthétique.
  - si:
      contient:
      - o4
    relance: Ne pas respecter les pauses indiquées par la ponctuation est une erreur fréquente qui rend le texte incompréhensible.
  solution: Le poème exige souvent plus de lenteur et plus d'expressivité qu'un texte informatif. Contrairement à la lecture
    neutre d'un texte informatif, le poème demande du temps pour faire résonner le rythme et les images.
- id: nblm-selon-la-fiche-de-notion-quelles-sont-de-6
  type: choix
  difficulte: 3
  enonce: Selon la fiche de notion, quelles sont deux ressources fondamentales à utiliser pour bien réciter un poème devant
    un auditoire ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La respiration (faire des pauses pour reprendre son souffle sans couper le sens).
    - id: o2
      texte: L'intonation et les variations de volume de la voix.
    - id: o3
      texte: Un débit très accéléré pour terminer la prestation au plus vite.
    - id: o4
      texte: Une immobilité totale combinée à un ton de voix strictement monotone.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les deux ressources liées à la gestion du souffle et aux variations de la voix.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Précipiter son débit est un piège classique qui rend la récitation confuse et inaudible.
  - si:
      contient:
      - o4
    relance: Conserver un ton plat et s'interdire toute gestuelle expressive constitue une erreur typique d'interprétation.
  solution: La respiration (faire des pauses pour reprendre son souffle sans couper le sens) ; L'intonation et les variations
    de volume de la voix. Maitriser sa respiration permet d'effectuer des pauses expressives en respectant la syntaxe du poème.
- id: nblm-quel-terme-designe-la-variation-de-la-ha-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne la variation de la hauteur et du ton de la voix pour donner du sens ou de l'émotion à un texte
    lorsqu'on souhaite réciter un poème ?
  reponse:
    acceptees:
    - l'intonation
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par la lettre 'i' et désigne les nuances du ton de la voix.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: l'intonation. L'intonation est la variation de la hauteur de la voix qui permet de traduire les émotions et les
    nuances du texte.
- id: nblm-avant-de-lire-un-texte-devant-la-classe-8
  type: texte_court
  difficulte: 1
  enonce: Avant de lire un texte devant la classe à voix haute, que faut-il repérer en premier dans le texte pour prévoir
    les pauses ?
  reponse:
    acceptees:
    - la ponctuation
    fautes_tolerees: 1
  indices:
    relance: Il s'agit des signes graphiques comme les virgules, les points ou les points d'interrogation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: la ponctuation. Repérer les virgules et les points permet de planifier les respirations et d'assurer une lecture
    fluide.
