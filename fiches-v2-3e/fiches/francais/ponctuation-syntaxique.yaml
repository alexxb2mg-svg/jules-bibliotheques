# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: ponctuation-syntaxique
version: 2
etat: verifiee
declencheurs:
- virgule ou point-virgule
- à quoi sert ce signe
- deux points explication
- virgule devant mais
- point-virgule ou deux-points
- quand mettre une virgule
- signe qui encadre une citation
prerequis: []
essentiel: 'Chaque signe de ponctuation a un rôle syntaxique : il organise la phrase, sépare ou relie des groupes, et montre
  les liens entre les propositions. Une virgule mal placée peut changer le sens.


  Le point termine une phrase. Le point d''interrogation termine une question. Le point d''exclamation marque un sentiment
  fort ou un ordre. Les points de suspension marquent une phrase inachevée ou une hésitation.


  La virgule a plusieurs emplois.

  Elle sépare les éléments d''une liste : « Il achète des pommes, des poires et du pain. »

  Elle isole un groupe déplacé ou détaché : « Demain, nous partons. » « Paul, mon voisin, est parti. » (apposition)

  Elle sépare des propositions juxtaposées : « Il arrive, il salue, il s''assoit. »

  Elle précède souvent « mais », « car », « or ».

  Elle isole aussi le mot dont on parle : « Mange, papa. »


  Le point-virgule sépare deux propositions indépendantes proches par le sens, sans conjonction. Il marque une pause plus
  forte que la virgule : « Le ciel s''assombrit ; l''orage approche. »


  Les deux-points annoncent une explication, une conséquence, une énumération ou une parole rapportée : « Il pleuvait fort
  : la sortie fut annulée. »


  Les parenthèses et les tirets isolent une information secondaire, une précision. Les guillemets encadrent une citation ou
  une parole rapportée directement. Le tiret, en début de ligne, marque aussi le changement de locuteur dans un dialogue.


  Attention : on ne sépare pas par une virgule le sujet de son verbe (« Les enfants jouent. »). Quand un complément est déplacé
  au début, la virgule est possible.


  Au brevet, il faut expliquer le rôle d''un signe dans une phrase et ponctuer correctement un texte sans ponctuation.

  '
methode:
- Repère les propositions et les groupes de la phrase.
- 'Demande-toi : ce groupe est-il déplacé, détaché ou supprimable ? Si oui, il est isolé par des virgules.'
- Entre deux propositions indépendantes proches par le sens, choisis la virgule, le point-virgule ou les deux-points selon
  le lien.
- Vérifie qu'aucune virgule ne sépare le sujet du verbe.
- 'Relis à voix haute : les pauses doivent correspondre aux signes.'
vocabulaire:
- terme: ponctuation
  definition: ensemble des signes qui organisent un texte écrit
- terme: proposition indépendante
  definition: proposition qui peut former une phrase seule
- terme: juxtaposition
  definition: association de propositions par un signe de ponctuation, sans conjonction
- terme: apposition
  definition: groupe placé près d'un nom, séparé par des virgules, qui le précise
- terme: énumération
  definition: liste d'éléments qui se suivent
- terme: discours direct
  definition: paroles reproduites telles quelles, entre guillemets
erreurs_frequentes:
- Mettre une virgule entre le sujet et le verbe.
- Oublier la deuxième virgule qui ferme une apposition ou un groupe intercalé.
- 'Confondre le point-virgule et les deux-points : l''un relie deux idées proches, l''autre annonce ce qui suit.'
- Mettre une virgule à chaque pause de la voix au lieu de suivre la construction de la phrase.
exemple:
  enonce: 'Explique le rôle des deux points dans « Il pleuvait fort : la sortie fut annulée. »'
  solution: 'Les deux points annoncent ici la conséquence, presque une explication : la pluie explique pourquoi la sortie
    est annulée. Ils relient deux propositions sans conjonction de coordination.'
exercices:
- id: role-virgule
  type: choix
  difficulte: 1
  enonce: Dans « Paul, mon voisin, est parti en vacances. », quel est le rôle des virgules ?
  reponse:
    options:
    - id: a
      texte: isoler un groupe détaché (une apposition qui précise Paul)
    - id: b
      texte: séparer les éléments d'une énumération
    - id: c
      texte: annoncer une explication
    - id: d
      texte: terminer la phrase
    bonnes:
    - a
  indices:
    relance: Le groupe entre les deux virgules donne une information sur Paul. Est-il indispensable à la phrase ?
    methode: 'Essaie d''enlever le groupe entre virgules : la phrase garde-t-elle un sens complet ?'
    etape: '« Paul est parti en vacances » a un sens complet sans « mon voisin » : ce groupe est donc détaché.'
  pieges:
  - si:
      contient:
      - b
    relance: Il n'y a qu'un seul élément entre les virgules, pas une liste de plusieurs éléments.
  - si:
      contient:
      - c
    relance: Ce rôle est plutôt celui des deux points, pas de la virgule ici.
  - si:
      contient:
      - d
    relance: Le point qui termine la phrase est à la fin, pas la virgule.
  solution: Les virgules isolent « mon voisin », une apposition qui précise « Paul » sans être indispensable au sens de la
    phrase.
- id: role-deux-points
  type: choix
  difficulte: 2
  enonce: 'Dans « Elle a réussi son examen : elle a beaucoup travaillé. », que font les deux points ?'
  reponse:
    options:
    - id: a
      texte: annoncer une explication ou une cause
    - id: b
      texte: isoler un groupe détaché
    - id: c
      texte: séparer deux mots d'une liste
    bonnes:
    - a
  indices:
    relance: 'Lis la seconde proposition : donne-t-elle la cause de ce qui précède ?'
    methode: 'Remplace mentalement les deux points par « car » ou « parce que » : le sens reste-t-il le même ?'
    etape: '« Elle a réussi car elle a beaucoup travaillé » a le même sens : les deux points annoncent la cause.'
  pieges:
  - si:
      contient:
      - b
    relance: Ce rôle est celui de la virgule ou des parenthèses, pas des deux points ici.
  - si:
      contient:
      - c
    relance: Il n'y a pas de liste de mots dans cette phrase, mais deux propositions entières.
  solution: 'Les deux points annoncent l''explication : la seconde proposition donne la cause de la réussite.'
- id: signe-manquant
  type: texte_court
  difficulte: 2
  enonce: Quel signe de ponctuation relie deux propositions indépendantes proches par le sens, sans conjonction, comme dans
    « Le ciel s'assombrit ; l'orage approchait. » ?
  reponse:
    acceptees:
    - point-virgule
    - point virgule
    fautes_tolerees: 1
  indices:
    relance: Ce signe est plus fort qu'une virgule mais plus léger qu'un point.
    methode: Il relie deux phrases qui pourraient être séparées par un point, mais que le sens rapproche.
    etape: Son nom contient le mot « point », suivi d'un autre mot.
  pieges:
  - si:
      valeur: virgule
    relance: La virgule seule ne suffit pas à relier deux propositions indépendantes complètes.
  solution: 'C''est le point-virgule : il relie deux propositions indépendantes dont le sens est proche, sans utiliser de
    conjonction.'
- id: signes-et-roles
  type: association
  difficulte: 3
  enonce: Associe chaque signe de ponctuation à son rôle principal.
  reponse:
    gauche:
    - id: a
      texte: les guillemets
    - id: b
      texte: les parenthèses
    - id: c
      texte: le point d'interrogation
    droite:
    - id: x
      texte: signaler une parole rapportée directement ou une citation
    - id: y
      texte: isoler une information secondaire
    - id: z
      texte: marquer la fin d'une phrase interrogative
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Pense à un dialogue dans un roman : quel signe encadre les paroles des personnages ?'
    methode: Pour chaque signe, imagine une phrase où il est utilisé, puis nomme ce qu'il apporte.
    etape: Les guillemets encadrent souvent une citation ou des paroles rapportées telles quelles.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au rôle exact de chaque signe dans un texte.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque signe un par un : que fait-il quand tu le rencontres dans une phrase ?'
  solution: Les guillemets signalent une citation ou une parole rapportée directement ; les parenthèses isolent une information
    secondaire ; le point d'interrogation marque la fin d'une phrase interrogative.
- id: nblm-quel-signe-de-ponctuation-sert-a-relier-1
  type: choix
  difficulte: 2
  enonce: Quel signe de ponctuation sert à relier deux propositions indépendantes proches par le sens, sans utiliser de conjonction
    de coordination ?
  reponse:
    options:
    - id: o1
      texte: Le point-virgule
    - id: o2
      texte: La virgule
    - id: o3
      texte: Les deux-points
    - id: o4
      texte: Le point
    bonnes:
    - o1
  indices:
    relance: Réfléchis au signe intermédiaire entre le point et la virgule qui marque une pause moyenne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La virgule sert à séparer les éléments d'une liste ou à isoler un groupe détaché, mais elle ne suffit pas à relier
      deux indépendantes complexes sans juxtaposition.
  - si:
      contient:
      - o3
    relance: Les deux-points ont pour fonction principale d'annoncer une explication, une cause, une énumération ou une citation,
      et non simplement de séparer deux idées proches.
  solution: Le point-virgule. Selon la fiche de notion, le point-virgule relie deux propositions indépendantes proches par
    le sens, sans conjonction.
- id: nblm-dans-la-phrase-il-pleuvait-fort-la-sorti-2
  type: choix
  difficulte: 2
  enonce: 'Dans la phrase « Il pleuvait fort : la sortie fut annulée », quelle est la valeur syntaxique des deux-points ?'
  reponse:
    options:
    - id: o1
      texte: Annoncer une explication ou une conséquence directe
    - id: o2
      texte: Introduire une énumération de noms
    - id: o3
      texte: Isoler une proposition subordonnée relative
    - id: o4
      texte: Signaler des paroles rapportées au discours direct
    bonnes:
    - o1
  indices:
    relance: Examine le lien logique entre le fait qu'il pleuve et l'annulation de la sortie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Il n'y a pas de liste d'objets ou de mots dans cette phrase, mais une seconde proposition complète.
  - si:
      contient:
      - o3
    relance: Une proposition relative est introduite par un pronom relatif (qui, que, dont, où), jamais par des deux-points.
  - si:
      contient:
      - o4
    relance: Il n'y a pas de verbe de parole ni de guillemets indiquant un dialogue ou une citation.
  solution: Annoncer une explication ou une conséquence directe. Les deux-points introduisent ici une relation de cause/explication
    (la pluie explique l'annulation de la sortie).
- id: nblm-quelle-phrase-illustre-une-erreur-freque-3
  type: choix
  difficulte: 2
  enonce: Quelle phrase illustre une erreur fréquente de ponctuation syntaxique ?
  reponse:
    options:
    - id: o1
      texte: Le professeur de français, explique la règle de grammaire.
    - id: o2
      texte: Fatigué par sa journée, l'élève s'est endormi rapidement.
    - id: o3
      texte: J'ai apporté mes cahiers, mes stylos et mon livre.
    - id: o4
      texte: Soudain, le téléphone sonna dans le silence.
    bonnes:
    - o1
  indices:
    relance: Cherche la phrase où la ponctuation sépare à tort le sujet et son verbe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La virgule est parfaitement correcte car elle isole un groupe adjectival détaché en tête de phrase.
  - si:
      contient:
      - o3
    relance: La virgule sépare correctement les différents éléments d'une énumération.
  - si:
      contient:
      - o4
    relance: La virgule isole à bon escient l'adverbe complément circonstanciel placé en début de phrase.
  solution: Le professeur de français, explique la règle de grammaire. Placer une virgule entre le sujet (« Le professeur
    de français ») et le verbe (« explique ») est une erreur fréquente lorsqu'aucun groupe n'est détaché.
- id: nblm-a-quoi-sert-la-virgule-lorsqu-elle-encad-4
  type: choix
  difficulte: 2
  enonce: À quoi sert la virgule lorsqu'elle encadre un groupe nominal dans la phrase « Paris, capitale de la France, accueille
    des millions de touristes » ?
  reponse:
    options:
    - id: o1
      texte: À isoler un groupe détaché en apposition qui précise le nom
    - id: o2
      texte: À transformer la phrase simple en phrase complexe
    - id: o3
      texte: À remplacer la terminaison du verbe conjugué
    - id: o4
      texte: À indiquer un changement de registre de langue
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi le rôle des virgules autour d'une précision supplémentaire apportée à un nom.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'apposition ne contient aucun verbe conjugué ; la phrase conserve donc une seule proposition.
  - si:
      contient:
      - o3
    relance: Un signe de ponctuation ne remplace jamais la morphologie d'une terminaison verbale.
  - si:
      contient:
      - o4
    relance: La ponctuation syntaxique organise les constituants de la phrase, elle ne modifie pas le niveau de langue.
  solution: À isoler un groupe détaché en apposition qui précise le nom. La virgule isole ici l'apposition (« capitale de
    la France »), un groupe détaché qui apporte une précision explicative sur le nom « Paris ».
- id: nblm-selon-les-attendus-du-programme-officiel-5
  type: choix
  difficulte: 2
  enonce: Selon les attendus du programme officiel de 3e, quelle compétence l'élève doit-il maîtriser en ponctuation ?
  reponse:
    options:
    - id: o1
      texte: Analyser le rôle syntaxique des signes de ponctuation et les utiliser à bon escient
    - id: o2
      texte: Mémoriser l'historique de l'invention des signes de ponctuation
    - id: o3
      texte: Supprimer la ponctuation pour créer des phrases sans fin
    - id: o4
      texte: Remplacer systématiquement les virgules par des connecteurs logiques
    bonnes:
    - o1
  indices:
    relance: Pense à la capacité à expliquer la fonction des signes et à bien les employer lors de la rédaction.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'histoire de la ponctuation n'est pas un attendu d'apprentissage en étude de la langue au collège.
  - si:
      contient:
      - o3
    relance: Au contraire, l'élève doit apprendre à structurer ses écrits avec une ponctuation variée et cohérente.
  - si:
      contient:
      - o4
    relance: La ponctuation et les connecteurs sont complémentaires ; on ne supprime pas la ponctuation au profit des seuls
      mots de liaison.
  solution: Analyser le rôle syntaxique des signes de ponctuation et les utiliser à bon escient. Le programme officiel stipule
    clairement que l'élève doit analyser le rôle syntaxique des signes et rétablir la ponctuation pertinente selon la visée
    du texte.
- id: nblm-quelles-sont-les-deux-fonctions-syntaxiq-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux fonctions syntaxiques reconnues des deux-points ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Annoncer une explication ou une cause
    - id: o2
      texte: Annoncer une énumération ou une citation
    - id: o3
      texte: Terminer obligatoirement une phrase interrogative
    - id: o4
      texte: Isoler le complément d'objet direct du verbe
    bonnes:
    - o1
    - o2
  indices:
    relance: Réfléchis aux cas où les deux-points introduisent du contenu (liste, cause, paroles).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est le point d'interrogation qui conclut une phrase interrogative, pas les deux-points.
  - si:
      contient:
      - o4
    relance: On ne sépare jamais un verbe de son complément d'objet direct par des deux-points.
  solution: Annoncer une explication ou une cause ; Annoncer une énumération ou une citation. Les deux-points permettent d'introduire
    une explication ou la cause d'un événement énoncé précédemment.
- id: nblm-quel-signe-de-ponctuation-separe-les-ele-7
  type: texte_court
  difficulte: 1
  enonce: Quel signe de ponctuation sépare les éléments d'une liste ou isole un groupe détaché dans la phrase ?
  reponse:
    acceptees:
    - virgule
    fautes_tolerees: 1
  indices:
    relance: Il s'agit du signe de ponctuation le plus courant pour marquer une pause courte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: virgule. La virgule est le signe de ponctuation syntaxique qui sépare les mots d'une énumération et isole les
    groupes détachés.
- id: nblm-quel-signe-de-ponctuation-compose-de-deu-8
  type: texte_court
  difficulte: 1
  enonce: Quel signe de ponctuation composé de deux points superposés annonce une explication ou une énumération ?
  reponse:
    acceptees:
    - deux-points
    fautes_tolerees: 1
  indices:
    relance: Le nom de ce signe s'écrit avec le nombre 2 au pluriel suivi d'un trait d'union.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: deux-points. Les deux-points servent à introduire une explication, une cause, une liste d'éléments ou une citation.
- id: virgule-adresse
  type: choix
  difficulte: 1
  enonce: Dans quelle phrase quelqu'un demande-t-il à papa de manger ?
  reponse:
    options:
    - id: a
      texte: Mange, papa.
    - id: b
      texte: Mange papa.
    - id: c
      texte: Les deux phrases
    - id: d
      texte: Aucune des deux
    bonnes:
    - a
  indices:
    relance: Demande-toi qui mange et qui reçoit l'ordre dans chaque phrase.
    methode: 'Sans virgule, « papa » devient ce qu''on mange. Avec une virgule, il est isolé : c''est la personne à qui on
      parle.'
    etape: 'Compare les deux phrases : une seule sépare « papa » du verbe.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Sans virgule, « papa » est le COD de « mange » : on mangerait papa. Cherche la phrase qui isole « papa ».'
  - si:
      contient:
      - c
    relance: Une seule des deux phrases a le sens attendu. Regarde ce que la virgule change.
  - si:
      contient:
      - d
    relance: Une des deux phrases exprime bien l'ordre adressé à papa. Relis-les.
  solution: '« Mange, papa. » : la virgule isole le mot à qui l''on s''adresse. Sans virgule, papa serait ce qu''on mange.'
- id: signe-citation
  type: texte_court
  difficulte: 1
  enonce: Quel signe de ponctuation encadre une citation ou une parole rapportée directement ?
  reponse:
    acceptees:
    - guillemets
    - guillemet
    fautes_tolerees: 1
  indices:
    relance: Ce signe s'ouvre avant les paroles et se ferme après.
    methode: Pense aux signes qui vont par deux dans un dialogue écrit, autour des paroles d'un personnage.
    etape: Ce signe a la forme de petits chevrons doubles, « comme ceux-ci », et il s'emploie par paire.
  pieges:
  - si:
      valeur: parentheses
    relance: Les parenthèses isolent une précision secondaire, pas des paroles rapportées.
  solution: Les guillemets encadrent les paroles rapportées au discours direct et les citations.
- id: ponctuer-phrase
  type: ouverte
  difficulte: 3
  enonce: Écris deux phrases. La première contient une apposition isolée par des virgules. La seconde relie deux propositions
    indépendantes proches par le sens avec un point-virgule ou des deux-points. Explique en une phrase le choix de chaque
    signe.
  criteres:
  - La première phrase contient une apposition correctement isolée par deux virgules.
  - La seconde phrase relie bien deux propositions indépendantes avec un point-virgule ou des deux-points employé à bon escient.
  - L'élève explique le rôle de chaque signe (isoler une précision, relier deux idées ou annoncer une explication).
  indices:
    relance: Pour l'apposition, pense à un groupe qui précise un nom et qu'on peut supprimer.
    methode: Encadre l'apposition par deux virgules. Relie deux idées proches avec un point-virgule, ou annonce une explication
      avec deux-points.
    etape: Commence par « Paul, mon voisin, ... » puis écris une seconde phrase en deux morceaux séparés par un point-virgule.
  solution: 'Exemples : « Paul, mon voisin, est parti en vacances. » Les virgules isolent une apposition. « Le ciel s''assombrit
    ; l''orage approche. » Le point-virgule relie deux idées proches sans conjonction.'
