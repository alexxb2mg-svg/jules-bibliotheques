  solution: 'Toutes les filles et tous les garçons sont prêts ; Une veste et un pantalon neufs ont été achetés. Correct :
    le déterminant « tout » s''accorde correctement en genre et en nombre avec « filles » (fém. pl.) et « garçons » (masc.
    pl.).'
- id: nblm-complete-la-phrase-avec-l-adjectif-vert-7
