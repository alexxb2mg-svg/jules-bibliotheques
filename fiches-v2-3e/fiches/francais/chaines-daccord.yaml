    fautes_tolerees: 1
  indices:
    relance: Identifie le genre des deux noms qualifiés et applique le pluriel correspondant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'vertes. L''adjectif qualifie deux noms féminins (« chemise » et « veste »), il s''accorde donc au féminin pluriel
