format: 2
notion: chaines-daccord
version: 2
etat: verifiee
declencheurs:
- accorder un adjectif avec plusieurs noms
- participe passé employé comme adjectif
- accord avec chaque ou tout
- accorder le participe passé avec avoir
- accord de tout devant un adjectif
- leur ou leurs
- accord dans un groupe nominal
- participe passé avec être
prerequis: []
essentiel: 'Un groupe nominal est un nom avec les mots qui l''accompagnent. Tous ces mots s''accordent en genre et en nombre
  avec le nom : c''est la chaîne d''accord. Exemple : « ces grandes maisons blanches ».


  Un adjectif qui se rapporte à plusieurs noms se met au pluriel. Si les noms sont de genres différents, l''adjectif se met
  au masculin pluriel : « une jupe et un pull neufs ». Si les noms sont féminins : « une jupe et une veste neuves ».


  Dans un groupe nominal complexe, on repère le nom noyau, puis chaque adjectif ou relative s''y rapporte : « les élèves que
  j''ai vus, fatigués, étaient partis ».


  Déterminants particuliers. « Chaque » est invariable et suivi d''un nom au singulier : « chaque élève ». « Tout » déterminant
  s''accorde avec le nom : « tout le monde, toute la classe, tous les élèves, toutes les filles ». Devant un adjectif, « tout
  » adverbe reste invariable, sauf devant un adjectif féminin commençant par une consonne : « ils sont tout contents, elle
  est toute contente ». « Leur » déterminant s''accorde en nombre avec le nom : « leur chien, leurs chiens ». Le pronom «
  leur » (« je leur parle ») reste invariable.


  Le participe passé employé avec « être » s''accorde avec le sujet : « Elles sont parties. » Avec « avoir », il s''accorde
  avec le COD s''il est placé avant le verbe : « Les pommes qu''il a mangées. » Sinon, il reste invariable : « Il a mangé
  des pommes. » Le COD peut être un pronom relatif (« que ») dont le nom est féminin ou pluriel.


  Un adjectif ou un participe passé en apposition s''accorde comme un adjectif avec le nom qu''il qualifie : « Fatiguée, elle
  s''assit. »


  Au brevet, on attend que tu accordes correctement à la dictée et dans les exercices de grammaire, en justifiant l''accord
  : « Je m''accorde avec... parce que... ».

  '
methode:
- Repérer d'abord le nom noyau du groupe nominal, puis vérifier que chaque mot qui s'y rapporte a le même genre et le même
  nombre.
- Pour un adjectif qui qualifie plusieurs noms, vérifier s'ils sont du même genre ou non pour choisir l'accord.
- Pour « tout », se demander s'il est déterminant (il s'accorde avec le nom) ou adverbe devant un adjectif (invariable, sauf
  devant un adjectif féminin commençant par une consonne).
- 'Pour le participe passé avec « avoir », chercher s''il y a un COD placé avant le verbe : c''est avec lui qu''il s''accorde.'
- Pour le participe passé avec « être », l'accorder avec le sujet.
- 'Pour un participe passé en apposition, le traiter comme un adjectif : l''accorder avec le nom qu''il qualifie.'
vocabulaire:
- terme: chaîne d'accord
  definition: ensemble des mots d'un groupe nominal qui s'accordent en genre et en nombre avec le nom
- terme: groupe nominal
  definition: 'un nom avec les mots qui l''accompagnent : déterminant, adjectif, complément'
- terme: nom noyau
  definition: le nom principal d'un groupe nominal, avec lequel les autres mots s'accordent
- terme: COD
  definition: 'complément d''objet direct : mot ou groupe qui répond à « quoi ? » ou « qui ? » après le verbe'
- terme: apposition
  definition: adjectif ou participe séparé du nom par une virgule, qui apporte une précision
- terme: participe passé
  definition: forme du verbe (mangé, parti, écrit) utilisée avec être ou avoir
- terme: pronom relatif
  definition: mot comme « que », « qui », « dont », qui relie une proposition à un nom
- terme: invariable
  definition: qui ne change pas de forme, quel que soit le genre ou le nombre
erreurs_frequentes:
- Accorder le participe passé avec « avoir » au sujet au lieu du COD placé avant.
- Oublier que « chaque » est toujours suivi d'un nom au singulier, jamais au pluriel.
- Mettre un adjectif qui qualifie deux noms de genres différents au féminin pluriel au lieu du masculin pluriel.
- Accorder un participe passé avec « avoir » quand le COD est placé après le verbe.
- 'Mettre un « s » au pronom « leur » (« je leur parle » : jamais « leurs »).'
exemple:
  enonce: 'Accorde le participe passé : « Les lettres qu''il a (écrire) sont sur la table. »'
  solution: 'Les lettres qu''il a écrites sont sur la table. Le COD « que », mis pour « les lettres », est placé avant le
    verbe avoir : le participe passé s''accorde avec lui, au féminin pluriel.'
exercices:
- id: accord-chaque
  type: choix
  difficulte: 1
  enonce: Quelle phrase est correctement accordée avec « chaque » ?
  reponse:
    options:
    - id: a
      texte: Chaque élève range son cahier.
    - id: b
      texte: Chaque élèves rangent leur cahier.
    - id: c
      texte: Chaques élèves rangent leur cahier.
    bonnes:
    - a
  indices:
    relance: Le mot « chaque » est-il toujours suivi d'un nom au singulier ou au pluriel ?
    methode: « Chaque » ne s'accorde jamais au pluriel, ni lui-même ni le nom qui le suit.
    etape: Élimine directement les phrases où « chaque » est suivi d'un nom au pluriel.
  pieges:
  - si:
      contient:
      - b
    relance: '« Chaque » est invariable et toujours suivi d''un nom au singulier. « Élèves » est ici au pluriel : c''est une
      erreur.'
  - si:
      contient:
      - c
    relance: '« Chaque » ne prend jamais de « s » : il est invariable et toujours suivi d''un singulier.'
  solution: '« Chaque élève range son cahier » est correct : « chaque » est invariable et toujours suivi d''un nom au singulier.'
- id: accord-adjectif-deux-noms
  type: texte_court
  difficulte: 1
  enonce: 'Complète en accordant : « Elle porte une jupe et un pull (neuf). » Donne seulement l''adjectif accordé.'
  reponse:
    acceptees:
    - neufs
    fautes_tolerees: 1
  indices:
    relance: 'L''adjectif se rapporte à deux noms : une jupe (féminin) et un pull (masculin).'
    methode: Quand un adjectif qualifie des noms de genres différents, il se met au masculin pluriel.
    etape: L'adjectif doit être au pluriel, et prendre la marque du masculin puisque les genres sont mélangés.
  pieges:
  - si:
      valeur: neuves
    relance: Un des deux noms est masculin (« un pull »). Quand les genres sont mélangés, l'adjectif se met au masculin pluriel,
      pas au féminin.
  - si:
      valeur: neuve
    relance: L'adjectif qualifie deux noms, il doit donc être au pluriel, pas au singulier.
  solution: 'Elle porte une jupe et un pull neufs. L''adjectif se rapporte à deux noms de genres différents : il se met au
    masculin pluriel.'
- id: accord-participe-avoir
  type: choix
  difficulte: 2
  enonce: Quelle phrase accorde correctement le participe passé avec « avoir » ?
  reponse:
    options:
    - id: a
      texte: Les pommes qu'il a mangées étaient mûres.
    - id: b
      texte: Les pommes qu'il a mangé étaient mûres.
    - id: c
      texte: Il a mangées des pommes mûres.
    bonnes:
    - a
  indices:
    relance: Cherche si le COD du verbe « manger » est placé avant ou après le participe passé.
    methode: Le participe passé avec « avoir » s'accorde avec le COD seulement s'il est placé avant le verbe.
    etape: 'Dans une des phrases, le pronom « que » (mis pour « les pommes ») est placé avant « a mangé... » : c''est là qu''il
      faut accorder.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Le COD « que » (les pommes) est placé avant le verbe : le participe passé doit s''accorder avec lui, au féminin
      pluriel.'
  - si:
      contient:
      - c
    relance: 'Ici, le COD « des pommes mûres » est placé après le verbe : le participe passé ne doit pas s''accorder, il reste
      « mangé ».'
  solution: '« Les pommes qu''il a mangées étaient mûres » est correct : le COD « que » (les pommes) est placé avant le verbe
    avoir, donc le participe passé s''accorde avec lui.'
- id: accord-participe-apposition
  type: texte_court
  difficulte: 2
  enonce: 'Complète en accordant : « (Fatiguer), elle s''assit sur le banc. » Donne seulement le participe passé accordé.'
  reponse:
    acceptees:
    - fatiguée
    fautes_tolerees: 1
  indices:
    relance: 'Ce participe passé est en apposition : il qualifie le sujet « elle », comme un adjectif.'
    methode: Un participe passé en apposition s'accorde en genre et en nombre avec le nom ou le pronom qu'il qualifie.
    etape: 'Le sujet « elle » est féminin singulier : le participe passé doit prendre la même marque.'
  pieges:
  - si:
      valeur: fatigant
    relance: Ce mot est le participe présent (ou l'adjectif verbal), pas le participe passé. Ici il faut la forme en « -é
      », accordée au féminin.
  solution: Fatiguée, elle s'assit sur le banc. Le participe passé en apposition s'accorde avec « elle », féminin singulier.
- id: accord-etre
  type: texte_court
  difficulte: 1
  enonce: 'Complète en accordant : « Les filles sont (parti) hier. » Donne seulement le participe passé accordé.'
  reponse:
    acceptees:
    - parties
    fautes_tolerees: 0
  indices:
    relance: Avec « être », le participe passé s'accorde avec le sujet.
    methode: Qui est le sujet ? Est-il féminin ou masculin, singulier ou pluriel ?
    etape: Le sujet est féminin pluriel.
  pieges:
  - si:
      valeur: parti
    relance: 'Le sujet « les filles » est féminin pluriel : le participe doit s''accorder.'
  - si:
      valeur: partis
    relance: Le sujet est féminin, pas masculin.
  solution: Les filles sont parties hier. Avec être, le participe passé s'accorde avec le sujet (féminin pluriel).
- id: tout-accord
  type: choix
  difficulte: 2
  enonce: Quelle phrase est correcte ?
  reponse:
    options:
    - id: a
      texte: Elle est toute contente.
    - id: b
      texte: Elle est tout contente.
    - id: c
      texte: Elles sont tout contentes.
    - id: d
      texte: Ils sont toutes contents.
    bonnes:
    - a
  indices:
    relance: Devant un adjectif féminin qui commence par une consonne, « tout » s'accorde.
    methode: L'adjectif « contente » est féminin et commence par la consonne « c ».
    etape: Dans cette situation, « tout » prend la marque du féminin.
  pieges:
  - si:
      contient:
      - b
    relance: Devant « contente » (féminin, consonne), « tout » doit s'accorder.
  - si:
      contient:
      - c
    relance: 'Devant un adjectif féminin commençant par une consonne, « tout » s''accorde aussi au pluriel : « toutes contentes
      ».'
  - si:
      contient:
      - d
    relance: '« Ils » est masculin : « tout » reste invariable ou devient « tous », mais pas « toutes ».'
  solution: '« Elle est toute contente » : « tout » est adverbe devant un adjectif féminin commençant par une consonne, donc
    il s''accorde.'
- id: accord-cod-relative
  type: texte_court
  difficulte: 3
  enonce: 'Complète en accordant : « Les fleurs que j''ai (cueillir) sentent bon. » Donne seulement le participe passé accordé.'
  reponse:
    acceptees:
    - cueillies
    fautes_tolerees: 0
  indices:
    relance: Le COD « que » représente « les fleurs » et il est placé avant le verbe.
    methode: 'Le participe s''accorde avec ce COD : féminin pluriel.'
    etape: Ajoute la marque du féminin et celle du pluriel à « cueilli ».
  pieges:
  - si:
      valeur: cueilli
    relance: 'Le COD « que » est placé avant le verbe : le participe passé doit s''accorder.'
  - si:
      valeur: cueillis
    relance: 'Il manque la marque du féminin : « fleurs » est féminin.'
  solution: Les fleurs que j'ai cueillies sentent bon. Le COD « que » (les fleurs), placé avant « ai cueilli », est féminin
    pluriel.
- id: dictee-justifiee
  type: ouverte
  difficulte: 3
  enonce: Écris deux phrases avec un adjectif qui qualifie deux noms de genres différents, puis justifie l'accord de chaque
    adjectif en une phrase.
  criteres:
  - L'élève écrit deux phrases correctes avec un adjectif qui se rapporte à deux noms de genres différents.
  - L'adjectif est bien au masculin pluriel.
  - 'L''élève justifie chaque accord : « L''adjectif se rapporte à deux noms de genres différents, donc masculin pluriel ».'
  indices:
    relance: Choisis un nom féminin et un nom masculin, puis un adjectif qui change à l'écrit.
    methode: Écris ta phrase, souligne l'adjectif, dis quels noms il qualifie, puis justifie.
    etape: 'Tu peux commencer ainsi : « J''ai acheté une robe et un manteau... ».'
  solution: J'ai acheté une robe et un manteau neufs. « Neufs » se rapporte à deux noms de genres différents, donc masculin
    pluriel. Il a un stylo et une gomme perdus. « Perdus » se rapporte à deux noms de genres différents, donc masculin pluriel.
