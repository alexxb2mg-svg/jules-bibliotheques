format: 2
notion: chaines-daccord
version: 1
etat: verifiee
declencheurs:
- accorder un adjectif avec plusieurs noms
- participe passé employé comme adjectif
- accord avec chaque ou tout
- accorder le participe passé avec avoir
prerequis: []
essentiel: 'Dans un groupe nominal, tous les mots qui se rapportent au nom (déterminants, adjectifs) doivent

  s''accorder en genre et en nombre avec lui : c''est la chaîne d''accord.


  Quand un adjectif se rapporte à plusieurs noms, il se met au pluriel ; si les noms sont de genres

  différents, l''adjectif se met au masculin pluriel (« une jupe et un pull neufs »).


  Certains déterminants ont des règles particulières : « chaque » est toujours suivi d''un nom au

  singulier (« chaque élève »), « tout » s''accorde avec le nom qui suit (« tous les élèves », « toute

  la classe »).


  Le participe passé employé avec « être » s''accorde avec le sujet (« Elles sont parties. »). Employé

  avec « avoir », il ne s''accorde pas avec le sujet, mais avec le COD placé avant le verbe, s''il y en a

  un (« Les pommes qu''il a mangées. »). Employé comme adjectif ou en apposition, il s''accorde comme un

  adjectif avec le nom qu''il qualifie (« Fatiguée, elle s''assit. »).

  '
methode:
- Repère d'abord le nom noyau du groupe nominal, puis vérifie que chaque mot qui s'y rapporte a le même genre et le même nombre.
- Pour un adjectif qui qualifie plusieurs noms, vérifie s'ils sont du même genre ou non pour choisir l'accord.
- 'Pour le participe passé avec « avoir », cherche s''il y a un COD placé avant le verbe : c''est avec lui qu''il s''accorde.'
- 'Pour un participe passé en apposition, traite-le comme un adjectif : accorde-le avec le nom qu''il qualifie.'
vocabulaire:
- terme: chaîne d'accord
  definition: ensemble des mots d'un groupe nominal qui s'accordent en genre et en nombre avec le nom
erreurs_frequentes:
- Accorder le participe passé avec « avoir » au sujet au lieu du COD placé avant.
- Oublier que « chaque » est toujours suivi d'un nom au singulier, jamais au pluriel.
- Mettre un adjectif qui qualifie deux noms de genres différents au féminin pluriel au lieu du masculin pluriel.
exemple:
  enonce: 'Accorde le participe passé : « Les lettres qu''il a (écrire) sont sur la table. »'
  solution: 'Les lettres qu''il a écrites sont sur la table. Le COD « que », mis pour « les lettres », est placé avant le
    verbe avoir : le participe passé s''accorde avec lui, au féminin pluriel.'
exercices:
- id: accord-chaque
  type: choix
  difficulte: 1
  enonce: Quelle phrase est correctement accordée avec « chaque » ?
  reponse:
    options:
    - id: a
      texte: Chaque élève range son cahier.
    - id: b
      texte: Chaque élèves rangent leur cahier.
    - id: c
      texte: Chaques élèves rangent leur cahier.
    bonnes:
    - a
  indices:
    relance: Le mot « chaque » est-il toujours suivi d'un nom au singulier ou au pluriel ?
    methode: « Chaque » ne s'accorde jamais au pluriel, ni lui-même ni le nom qui le suit.
    etape: Élimine directement les phrases où « chaque » est suivi d'un nom au pluriel.
  pieges:
  - si:
      contient:
      - b
    relance: '« Chaque » est invariable et toujours suivi d''un nom au singulier. « Élèves » est ici au pluriel : c''est une
      erreur.'
  - si:
      contient:
      - c
    relance: '« Chaque » ne prend jamais de « s » : il est invariable et toujours suivi d''un singulier.'
  solution: '« Chaque élève range son cahier » est correct : « chaque » est invariable et toujours suivi d''un nom au singulier.'
- id: accord-adjectif-deux-noms
  type: texte_court
  difficulte: 1
  enonce: 'Complète en accordant : « Elle porte une jupe et un pull (neuf). » Donne seulement l''adjectif accordé.'
  reponse:
    acceptees:
    - neufs
    fautes_tolerees: 1
  indices:
    relance: 'L''adjectif se rapporte à deux noms : une jupe (féminin) et un pull (masculin).'
    methode: Quand un adjectif qualifie des noms de genres différents, il se met au masculin pluriel.
    etape: L'adjectif doit être au pluriel, et prendre la marque du masculin puisque les genres sont mélangés.
  pieges:
  - si:
      valeur: neuves
    relance: Un des deux noms est masculin (« un pull »). Quand les genres sont mélangés, l'adjectif se met au masculin pluriel,
      pas au féminin.
  - si:
      valeur: neuve
    relance: L'adjectif qualifie deux noms, il doit donc être au pluriel, pas au singulier.
  solution: 'Elle porte une jupe et un pull neufs. L''adjectif se rapporte à deux noms de genres différents : il se met au
    masculin pluriel.'
- id: accord-participe-avoir
  type: choix
  difficulte: 2
  enonce: Quelle phrase accorde correctement le participe passé avec « avoir » ?
  reponse:
    options:
    - id: a
      texte: Les pommes qu'il a mangées étaient mûres.
    - id: b
      texte: Les pommes qu'il a mangé étaient mûres.
    - id: c
      texte: Il a mangées des pommes mûres.
    bonnes:
    - a
  indices:
    relance: Cherche si le COD du verbe « manger » est placé avant ou après le participe passé.
    methode: Le participe passé avec « avoir » s'accorde avec le COD seulement s'il est placé avant le verbe.
    etape: 'Dans une des phrases, le pronom « que » (mis pour « les pommes ») est placé avant « a mangé... » : c''est là qu''il
      faut accorder.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Le COD « que » (les pommes) est placé avant le verbe : le participe passé doit s''accorder avec lui, au féminin
      pluriel.'
  - si:
      contient:
      - c
    relance: 'Ici, le COD « des pommes mûres » est placé après le verbe : le participe passé ne doit pas s''accorder, il reste
      « mangé ».'
  solution: '« Les pommes qu''il a mangées étaient mûres » est correct : le COD « que » (les pommes) est placé avant le verbe
    avoir, donc le participe passé s''accorde avec lui.'
- id: accord-participe-apposition
  type: texte_court
  difficulte: 2
  enonce: 'Complète en accordant : « (Fatiguer), elle s''assit sur le banc. » Donne seulement le participe passé accordé.'
  reponse:
    acceptees:
    - fatiguée
    fautes_tolerees: 1
  indices:
    relance: 'Ce participe passé est en apposition : il qualifie le sujet « elle », comme un adjectif.'
    methode: Un participe passé en apposition s'accorde en genre et en nombre avec le nom ou le pronom qu'il qualifie.
    etape: 'Le sujet « elle » est féminin singulier : le participe passé doit prendre la même marque.'
  pieges:
  - si:
      valeur: fatigant
    relance: Ce mot est le participe présent (ou l'adjectif verbal), pas le participe passé. Ici il faut la forme en « -é
      », accordée au féminin.
  solution: Fatiguée, elle s'assit sur le banc. Le participe passé en apposition s'accorde avec « elle », féminin singulier.
- id: nblm-comment-doit-on-accorder-un-adjectif-qua-1
  type: choix
  difficulte: 2
  enonce: Comment doit-on accorder un adjectif qualificatif qui se rapporte à plusieurs noms de genres différents (un nom
    masculin et un nom féminin) ?
  reponse:
    options:
    - id: o1
      texte: Au masculin pluriel
    - id: o2
      texte: Au féminin pluriel
    - id: o3
      texte: Au masculin singulier
    - id: o4
      texte: Il s'accorde seulement avec le dernier nom
    bonnes:
    - o1
  indices:
    relance: Pense au genre qui l'emporte grammaticalement lorsque les genres sont mélangés et au nombre total d'éléments.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : le féminin pluriel ne s''applique que si tous les noms qualifiés sont féminins.'
  - si:
      contient:
      - o3
    relance: C'est incorrect car l'adjectif se rapportant à plusieurs noms doit obligatoirement se mettre au pluriel.
  - si:
      contient:
      - o4
    relance: 'C''est faux : dans la chaîne d''accord classique, l''adjectif qui qualifie l''ensemble des noms prend le pluriel
      de totalité.'
  solution: 'Au masculin pluriel. C''est la règle : lorsque les noms qualifiés sont de genres différents, le masculin l''emporte
    et l''adjectif se met au masculin pluriel.'
- id: nblm-quelle-est-la-regle-d-accord-obligatoire-2
  type: choix
  difficulte: 2
  enonce: Quelle est la règle d'accord obligatoire pour le déterminant « chaque » dans une chaîne d'accord ?
  reponse:
    options:
    - id: o1
      texte: Il est toujours suivi d'un nom au singulier
    - id: o2
      texte: Il s'accorde au pluriel si le verbe est au pluriel
    - id: o3
      texte: Il s'écrit « chaques » devant un nom au pluriel
    - id: o4
      texte: Il s'accorde en genre mais reste toujours au pluriel
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que ce déterminant désigne les éléments d'un ensemble un par un.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : « chaque » ne prend jamais la marque du pluriel, même si le sens englobe plusieurs personnes.'
  - si:
      contient:
      - o3
    relance: 'C''est une faute d''orthographe : la forme « chaques » n''existe pas en français.'
  - si:
      contient:
      - o4
    relance: 'Faux : « chaque » est invariable en genre et se met exclusivement au singulier.'
  solution: 'Il est toujours suivi d''un nom au singulier. Exactement : le déterminant « chaque » est un distributif qui s''emploie
    toujours avec un nom au singulier.'
- id: nblm-dans-la-phrase-fatiguees-par-la-longue-m-3
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Fatiguées par la longue marche, les randonneuses s'arrêtèrent », comment s'accorde le participe
    passé « fatiguées » ?
  reponse:
    options:
    - id: o1
      texte: Comme un adjectif, en genre et en nombre avec le nom qu'il qualifie
    - id: o2
      texte: Il reste invariable car il est placé en début de phrase
    - id: o3
      texte: Il s'accorde uniquement avec le verbe « s'arrêtèrent »
    - id: o4
      texte: Il s'accorde toujours au masculin singulier par défaut
    bonnes:
    - o1
  indices:
    relance: Regarde s'il y a un auxiliaire et identifie le groupe nominal qu'il caractérise.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la position détachée en début de phrase (apposition) ne rend pas le participe passé invariable.'
  - si:
      contient:
      - o3
    relance: 'Faux : le participe passé apposé s''accorde avec le nom qu''il qualifie, et non avec le verbe principal de la
      proposition.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : employé comme adjectif, il s''accorde obligatoirement en genre et en nombre avec le nom auquel il
      se rapporte.'
  solution: 'Comme un adjectif, en genre et en nombre avec le nom qu''il qualifie. Juste : employé sans auxiliaire (ou en
    apposition), le participe passé fonctionne exactement comme un adjectif et s''accorde avec le nom qu''il qualifie (''les
    randonneuses'', féminin pluriel).'
- id: nblm-dans-la-phrase-les-lettres-qu-il-a-ecrit-4
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Les lettres qu'il a écrites sont sur la table », pourquoi le participe passé « écrites » s'accorde-t-il
    au féminin pluriel ?
  reponse:
    options:
    - id: o1
      texte: Parce que le COD « qu' » (qui reprend « les lettres ») est placé avant le verbe avoir
    - id: o2
      texte: Parce qu'il s'accorde toujours avec le sujet « il » quand on utilise l'auxiliaire avoir
    - id: o3
      texte: Parce que le verbe « sont » placé plus loin impose un accord au féminin
    - id: o4
      texte: Parce qu'il n'y a aucun COD dans la proposition subordonnée
    bonnes:
    - o1
  indices:
    relance: Identifie la fonction du pronom « qu' » et sa position par rapport à l'auxiliaire avoir.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : avec l''auxiliaire avoir, le participe passé ne s''accorde jamais avec le sujet.'
  - si:
      contient:
      - o3
    relance: 'Faux : l''accord du participe passé « écrites » dépend uniquement de son propre COD et pas du verbe de la proposition
      principale.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : il y a bien un COD, c''est le pronom relatif « qu'' » placé devant le verbe.'
  solution: 'Parce que le COD « qu'' » (qui reprend « les lettres ») est placé avant le verbe avoir. Exact : le pronom relatif
    « que » est un COD antéposé qui reprend l''antécédent féminin pluriel « les lettres ».'
- id: nblm-quelle-est-l-orthographe-correcte-du-par-5
  type: choix
  difficulte: 2
  enonce: 'Quelle est l''orthographe correcte du participe passé dans la phrase : « Jules a ......... des pommes » ?'
  reponse:
    options:
    - id: o1
      texte: mangé
    - id: o2
      texte: mangées
    - id: o3
      texte: mangés
    - id: o4
      texte: mangée
    bonnes:
    - o1
  indices:
    relance: Vérifie si le complément d'objet direct se trouve avant ou après le verbe conjugué.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : accorder le participe passé avec le COD alors que celui-ci est situé après le verbe.'
  - si:
      contient:
      - o3
    relance: 'Faux : « des pommes » est un nom féminin, mais de toute façon, le COD étant postposé, le participe reste invariable.'
  - si:
      contient:
      - o4
    relance: 'Faux : il n''y a pas d''accord au féminin singulier ni au pluriel lorsque le COD suit le verbe.'
  solution: 'mangé. Correct : le COD « des pommes » est placé après le verbe avoir, donc le participe passé reste invariable.'
- id: nblm-quelles-sont-les-deux-phrases-qui-respec-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux phrases qui respectent parfaitement les règles des chaînes d'accord ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Toutes les filles et tous les garçons sont prêts.
    - id: o2
      texte: Une veste et un pantalon neufs ont été achetés.
    - id: o3
      texte: Chaque élèves doivent apporter leurs affaires.
    - id: o4
      texte: Une veste et une jupe neuf sont suspendues.
    bonnes:
    - o1
    - o2
  indices:
    relance: Examine l'accord des déterminants « tout » et « chaque » ainsi que l'accord de l'adjectif portant sur plusieurs
      noms.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : « chaque » doit toujours être suivi d''un nom au singulier (« chaque élève »).'
  - si:
      contient:
      - o4
    relance: 'Erreur : « une veste » et « une jupe » étant deux noms féminins, l''adjectif aurait dû être au féminin pluriel
      (« neuves »).'
  solution: 'Toutes les filles et tous les garçons sont prêts ; Une veste et un pantalon neufs ont été achetés. Correct :
    le déterminant « tout » s''accorde correctement en genre et en nombre avec « filles » (fém. pl.) et « garçons » (masc.
    pl.).'
- id: nblm-complete-la-phrase-avec-l-adjectif-vert-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase avec l''adjectif « vert » correctement accordé : « Une chemise et une veste ......... »'
  reponse:
    acceptees:
    - vertes
    fautes_tolerees: 1
  indices:
    relance: Identifie le genre des deux noms qualifiés et applique le pluriel correspondant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'vertes. L''adjectif qualifie deux noms féminins (« chemise » et « veste »), il s''accorde donc au féminin pluriel
    : vertes.'
- id: nblm-orthographie-correctement-le-participe-p-8
  type: texte_court
  difficulte: 1
  enonce: 'Orthographie correctement le participe passé du verbe ''prendre'' : « Les décisions qu''elle a ......... sont définitives.
    »'
  reponse:
    acceptees:
    - prises
    fautes_tolerees: 1
  indices:
    relance: Repère le COD placé avant l'auxiliaire avoir et accorde le participe passé du verbe prendre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: prises. Le participe passé conjugué avec avoir s'accorde au féminin pluriel avec le COD antéposé « qu' » qui reprend
    « les décisions ».
