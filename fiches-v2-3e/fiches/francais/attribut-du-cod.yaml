format: 2
notion: attribut-du-cod
version: 2
etat: verifiee
declencheurs:
- on l'a élu président
- je trouve ça bizarre
- verbe + COD + adjectif
- il l'a rendu triste
- nommer quelqu'un délégué
- verbe qui donne un titre
- considérer comme un expert
prerequis: []
essentiel: 'L''attribut du COD est un mot ou un groupe de mots qui complète le COD (complément d''objet direct). Il dit ce
  qu''est le COD, ce qu''il devient, ou comment le sujet le juge.


  Exemple : « Les élèves ont élu Léa déléguée. » COD = Léa. Attribut du COD = déléguée (Léa EST déléguée).


  Il se trouve avec des verbes attributifs. Voici les familles à connaître.

  Jugement ou appréciation : trouver, juger, estimer, considérer, croire, penser.

  Choix ou désignation : élire, choisir, désigner, nommer.

  Titre ou nom donné : appeler, baptiser, surnommer, proclamer, déclarer.

  Transformation : rendre, laisser, faire.


  L''attribut peut être un adjectif (« Je trouve ce film long. »), un nom (« On l''a nommé président. ») ou un groupe nominal.
  Parfois il est introduit par « comme » ou « pour » : « On le considère comme un expert. » « Je la prends pour une amie.
  »


  Un test pratique : on peut reformuler avec le verbe être. « Je trouve ce film long » devient « ce film est long ». Si le
  sens tient, c''est un attribut du COD.


  Attention aux confusions.

  L''attribut du COD n''est pas l''épithète : l''épithète est collée au nom et peut se supprimer (« J''ai acheté une robe
  rouge »). L''attribut du COD ne se supprime pas sans changer le sens de la phrase.

  L''attribut du COD n''est pas l''attribut du sujet : celui-ci suit un verbe d''état (être, paraître, sembler, devenir) et
  qualifie le sujet (« Elle semble contente. »).


  Au brevet, on demande d''identifier les fonctions dans une phrase : sujet, COD, attribut du COD, complément circonstanciel.
  Il faut justifier avec le verbe et le test du verbe être.

  '
methode:
- Repère le verbe conjugué et le sujet.
- Cherche le COD en posant la question qui ? ou quoi ? juste après le verbe.
- Cherche un mot ou un groupe qui dit ce qu'est ou comment est ce COD.
- 'Fais le test : reformule avec le verbe être. Le COD est-il cet attribut ?'
- Vérifie que le mot n'est pas une épithète (supprimable) ni un complément circonstanciel (déplaçable).
- Nomme la fonction et justifie avec le verbe attributif.
vocabulaire:
- terme: COD
  definition: 'complément d''objet direct : il se rattache au verbe sans préposition et répond à qui ? ou quoi ?'
- terme: verbe d'état
  definition: verbe qui relie le sujet à son attribut (être, paraître, sembler, devenir)
- terme: attribut du sujet
  definition: mot qui qualifie le sujet par l'intermédiaire d'un verbe d'état
- terme: épithète
  definition: adjectif directement lié au nom, que l'on peut supprimer sans changer la construction
- terme: groupe nominal
  definition: nom accompagné de son déterminant et éventuellement de compléments
- terme: verbe de jugement
  definition: verbe qui exprime une opinion sur le COD (trouver, juger, considérer)
erreurs_frequentes:
- Confondre l'attribut du COD avec un simple adjectif épithète collé au nom.
- 'Croire que le verbe être a un attribut du COD : il a un attribut du sujet.'
- Prendre un COI pour un attribut du COD (on donne quelque chose À quelqu'un, ce n'est pas la même construction).
- 'Prendre un complément circonstanciel pour un attribut : il répond à où, quand, comment et peut se déplacer.'
exemple:
  enonce: Dans la phrase « Le jury a jugé cette pièce originale. », identifie le COD et son attribut.
  solution: COD = cette pièce (le jury a jugé quoi ? cette pièce). Attribut du COD = originale, car cette pièce EST originale,
    selon le jugement du jury.
exercices:
- id: identifier-cod-attribut
  type: choix
  difficulte: 1
  enonce: Dans « Les spectateurs ont trouvé le film ennuyeux. », quel mot est l'attribut du COD ?
  reponse:
    options:
    - id: a
      texte: ennuyeux
    - id: b
      texte: le film
    - id: c
      texte: les spectateurs
    - id: d
      texte: ont trouvé
    bonnes:
    - a
  indices:
    relance: 'Cherche d''abord le COD : les spectateurs ont trouvé QUOI ?'
    methode: Une fois le COD trouvé, cherche le mot qui dit comment il est, comme si on disait « le film EST... ».
    etape: Le COD est « le film ». Quel mot, juste après, dit comment il est ?
  pieges:
  - si:
      contient:
      - b
    relance: « le film » est bien le COD, mais la question demande son attribut, pas le COD lui-même.
  - si:
      contient:
      - c
    relance: « les spectateurs » est le sujet de la phrase, pas l'attribut du COD.
  - si:
      contient:
      - d
    relance: « ont trouvé » est le verbe. Cherche plutôt le mot qui qualifie le COD après le verbe.
  solution: 'L''attribut du COD est « ennuyeux » : il dit comment est « le film », COD du verbe « ont trouvé ».'
- id: verbe-attributif
  type: choix
  difficulte: 2
  enonce: Quel verbe, dans cette liste, peut introduire un attribut du COD ?
  reponse:
    options:
    - id: a
      texte: nommer
    - id: b
      texte: arriver
    - id: c
      texte: partir
    - id: d
      texte: dormir
    bonnes:
    - a
  indices:
    relance: Un verbe attributif donne un titre, un jugement ou un état à son COD.
    methode: 'Essaie chaque verbe avec un COD suivi d''un nom ou d''un adjectif : lequel donne un titre à quelqu''un ?'
    etape: 'Un seul de ces verbes permet de donner un titre ou une fonction à une personne : lequel ?'
  pieges:
  - si:
      contient:
      - b
    relance: '« arriver » ne prend pas de COD : on ne peut pas dire « arriver quelqu''un quelque chose ».'
  - si:
      contient:
      - c
    relance: « partir » se construit sans COD, donc sans attribut du COD.
  - si:
      contient:
      - d
    relance: « dormir » ne prend pas de COD non plus.
  solution: '« nommer » est un verbe attributif : il permet une construction comme « on l''a nommé délégué », où « délégué
    » est l''attribut du COD « l'' ».'
- id: completer-attribut
  type: texte_court
  difficulte: 2
  enonce: 'Complète : dans « On considère ce roman ___ », si l''attribut du COD est un adjectif qui signifie « très réussi
    », quel mot peux-tu écrire ? (un seul adjectif)'
  reponse:
    acceptees:
    - remarquable
    - excellent
    - exceptionnel
    - magnifique
    fautes_tolerees: 0
  indices:
    relance: Cherche un adjectif qui pourrait qualifier un livre qu'on trouve très bon.
    methode: Cet adjectif doit pouvoir se mettre après « ce roman est... » pour vérifier qu'il est bien attribut du COD.
    etape: Pense à un synonyme simple de « très réussi », au masculin singulier comme « roman ».
  pieges:
  - si:
      valeur: bien
    relance: '« bien » est un adverbe, pas un adjectif : il ne peut pas être attribut du COD ici.'
  solution: 'On peut écrire par exemple « remarquable » : « on considère ce roman remarquable », comme « ce roman est remarquable
    ».'
- id: fonction-vs-cod
  type: association
  difficulte: 3
  enonce: Associe chaque groupe de mots souligné à sa fonction dans la phrase « Le maire a déclaré la séance ouverte devant
    la mairie. »
  reponse:
    gauche:
    - id: a
      texte: la séance
    - id: b
      texte: ouverte
    - id: c
      texte: devant la mairie
    droite:
    - id: x
      texte: COD du verbe déclarer
    - id: y
      texte: attribut du COD
    - id: z
      texte: complément circonstanciel de lieu
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Cherche d'abord ce que le maire a déclaré (COD), puis ce que devient ce COD (attribut).
    methode: Le complément de lieu répond à la question « où ? » et peut être déplacé ou supprimé sans changer le sens de
      base.
    etape: '« la séance » répond à « déclaré quoi ? » : c''est le COD. « ouverte » dit ce que devient la séance.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie surtout la différence entre l'attribut du COD et le complément de
      lieu.
  - si:
      diagnostic: associations_fausses
    relance: 'Repars du verbe « déclarer » : cherche son COD, puis l''attribut de ce COD, puis ce qui reste.'
  solution: « la séance » est COD, « ouverte » est attribut du COD (la séance devient ouverte), « devant la mairie » est complément
    circonstanciel de lieu.
- id: attribut-sujet-ou-cod
  type: choix
  difficulte: 2
  enonce: Dans « Elle a rendu ses amis heureux. », quelle est la fonction de « heureux » ?
  reponse:
    options:
    - id: a
      texte: attribut du COD
    - id: b
      texte: attribut du sujet
    - id: c
      texte: épithète
    - id: d
      texte: complément circonstanciel
    bonnes:
    - a
  indices:
    relance: 'Cherche d''abord le COD du verbe : elle a rendu qui ?'
    methode: Vérifie si « heureux » peut se reformuler avec le verbe être en parlant du COD.
    etape: Le COD est « ses amis ». Est-ce que « ses amis sont heureux » garde le sens de la phrase ?
  pieges:
  - si:
      contient:
      - b
    relance: L'attribut du sujet suit un verbe d'état. Ici « rendre » a un COD, et « heureux » qualifie ce COD, pas le sujet.
  - si:
      contient:
      - c
    relance: Une épithète peut se supprimer. Ici, sans « heureux », la phrase change de sens.
  - si:
      contient:
      - d
    relance: Un complément circonstanciel répond à où, quand ou pourquoi. « heureux » dit comment sont les amis.
  solution: 'COD = ses amis (elle a rendu qui ?). Ses amis sont heureux : « heureux » est donc attribut du COD, avec le verbe
    de transformation rendre.'
- id: verbe-choix-vote
  type: texte_court
  difficulte: 1
  enonce: 'Quel verbe à l''infinitif signifie choisir quelqu''un par un vote et permet un attribut du COD ? Complète : « Les
    élèves ont ... Léa déléguée. »'
  reponse:
    acceptees:
    - élire
    - elire
    fautes_tolerees: 0
  indices:
    relance: Pense au verbe qu'on emploie pour une élection.
    methode: 'Ce verbe donne un titre à Léa : il fait partie des verbes de choix ou de désignation.'
    etape: Il a deux syllabes, commence par une voyelle et rime avec « lire ».
  pieges:
  - si:
      valeur: choisir
    relance: « choisir » convient pour le sens général, mais cherche le verbe qui parle d'un vote.
  solution: 'Le verbe est « élire » : « Les élèves ont élu Léa déléguée ». COD = Léa, attribut du COD = déléguée.'
- id: ecrire-attributs
  type: ouverte
  difficulte: 3
  enonce: Écris deux phrases. La première contient un verbe de jugement et un attribut du COD. La seconde contient un verbe
    de choix ou de titre et un attribut du COD. Souligne chaque attribut du COD.
  criteres:
  - Chaque phrase contient un COD clairement identifiable.
  - Les verbes employés sont bien des verbes attributifs (jugement pour la première, choix ou titre pour la seconde).
  - Chaque attribut du COD est correctement souligné et peut se reformuler avec le verbe être.
  indices:
    relance: Choisis d'abord un verbe qui juge (trouver, considérer) puis un verbe qui nomme (élire, nommer).
    methode: Écris chaque phrase avec un COD, puis un mot qui dit ce qu'est ce COD. Vérifie avec le verbe être.
    etape: Commence par exemple par « Je trouve ce film... » et cherche un adjectif qui qualifie le film.
  solution: 'Exemples : « Je trouve ce film passionnant. » (verbe de jugement ; COD = ce film ; attribut = passionnant.) «
    La classe a élu Sam délégué. » (verbe de choix ; COD = Sam ; attribut = délégué.)'
