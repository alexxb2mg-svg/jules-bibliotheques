# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: attribut-du-cod
version: 1
etat: verifiee
declencheurs:
- on l'a élu président
- je trouve ça bizarre
- verbe + COD + adjectif
prerequis: []
essentiel: 'L''attribut du COD complète le COD (complément d''objet direct) : il dit ce qu''il est, ce qu''il devient

  ou comment on le juge.


  Exemple : « Les élèves ont élu Léa déléguée. » COD = Léa ; attribut du COD = déléguée (Léa EST déléguée).


  On le trouve avec des verbes de jugement, d''appréciation, de choix, ou des verbes qui donnent un titre :

  élire, nommer, considérer, trouver, juger, appeler, rendre, croire...


  Astuce : entre le COD et son attribut, on peut souvent glisser « comme » ou reformuler avec « être ».

  « On juge ce film excellent » → « ce film est excellent ».

  '
methode:
- Repère le verbe et cherche son COD (qui ? quoi ? après le verbe).
- Cherche un mot ou groupe de mots qui donne une qualité, un nom ou un état à ce COD.
- 'Vérifie que ce mot n''est pas un simple COI ou un complément de lieu : il doit pouvoir remplacer le COD dans une phrase
  avec « être » (le COD EST cet attribut).'
- 'Nomme la fonction : attribut du COD.'
vocabulaire:
- terme: attribut du COD
  definition: mot ou groupe de mots qui dit ce qu'est, devient ou comment on juge le COD
- terme: verbe attributif
  definition: verbe qui peut relier un COD à son attribut (élire, nommer, trouver, juger...)
erreurs_frequentes:
- Confondre l'attribut du COD avec un simple adjectif épithète collé au nom.
- 'Oublier que le verbe être n''a pas d''attribut du COD : il a un attribut du sujet.'
- Prendre un COI pour un attribut du COD (on nomme QUELQU'UN À un poste n'est pas la même construction).
exemple:
  enonce: Dans la phrase « Le jury a jugé cette pièce originale. », identifie le COD et son attribut.
  solution: COD = cette pièce (le jury a jugé quoi ? cette pièce). Attribut du COD = originale, car cette pièce EST originale,
    selon le jugement du jury.
exercices:
- id: identifier-cod-attribut
  type: choix
  difficulte: 1
  enonce: Dans « Les spectateurs ont trouvé le film ennuyeux. », quel mot est l'attribut du COD ?
  reponse:
    options:
    - id: a
      texte: ennuyeux
    - id: b
      texte: le film
    - id: c
      texte: les spectateurs
    - id: d
      texte: ont trouvé
    bonnes:
    - a
  indices:
    relance: 'Cherche d''abord le COD : les spectateurs ont trouvé QUOI ?'
    methode: Une fois le COD trouvé, cherche le mot qui dit comment il est, comme si on disait « le film EST... ».
    etape: Le COD est « le film ». Quel mot, juste après, dit comment il est ?
  pieges:
  - si:
      contient:
      - b
    relance: « le film » est bien le COD, mais la question demande son attribut, pas le COD lui-même.
  - si:
      contient:
      - c
    relance: « les spectateurs » est le sujet de la phrase, pas l'attribut du COD.
  - si:
      contient:
      - d
    relance: « ont trouvé » est le verbe. Cherche plutôt le mot qui qualifie le COD après le verbe.
  solution: 'L''attribut du COD est « ennuyeux » : il dit comment est « le film », COD du verbe « ont trouvé ».'
- id: verbe-attributif
  type: choix
  difficulte: 2
  enonce: Quel verbe, dans cette liste, peut introduire un attribut du COD ?
  reponse:
    options:
    - id: a
      texte: nommer
    - id: b
      texte: arriver
    - id: c
      texte: partir
    - id: d
      texte: dormir
    bonnes:
    - a
  indices:
    relance: Un verbe attributif donne un titre, un jugement ou un état à son COD.
    methode: 'Essaie chaque verbe avec un COD suivi d''un nom ou d''un adjectif : lequel donne un titre à quelqu''un ?'
    etape: 'Un seul de ces verbes permet de donner un titre ou une fonction à une personne : lequel ?'
  pieges:
  - si:
      contient:
      - b
    relance: '« arriver » ne prend pas de COD : on ne peut pas dire « arriver quelqu''un quelque chose ».'
  - si:
      contient:
      - c
    relance: « partir » se construit sans COD, donc sans attribut du COD.
  - si:
      contient:
      - d
    relance: « dormir » ne prend pas de COD non plus.
  solution: '« nommer » est un verbe attributif : il permet une construction comme « on l''a nommé délégué », où « délégué
    » est l''attribut du COD « l'' ».'
- id: completer-attribut
  type: texte_court
  difficulte: 2
  enonce: 'Complète : dans « On considère ce roman ___ », si l''attribut du COD est un adjectif qui signifie « très réussi
    », quel mot peux-tu écrire ? (un seul adjectif)'
  reponse:
    acceptees:
    - remarquable
    - excellent
    - exceptionnel
    - magnifique
    fautes_tolerees: 0
  indices:
    relance: Cherche un adjectif qui pourrait qualifier un livre qu'on trouve très bon.
    methode: Cet adjectif doit pouvoir se mettre après « ce roman est... » pour vérifier qu'il est bien attribut du COD.
    etape: Pense à un synonyme simple de « très réussi », au masculin singulier comme « roman ».
  pieges:
  - si:
      valeur: bien
    relance: '« bien » est un adverbe, pas un adjectif : il ne peut pas être attribut du COD ici.'
  solution: 'On peut écrire par exemple « remarquable » : « on considère ce roman remarquable », comme « ce roman est remarquable
    ».'
- id: fonction-vs-cod
  type: association
  difficulte: 3
  enonce: Associe chaque groupe de mots souligné à sa fonction dans la phrase « Le maire a déclaré la séance ouverte devant
    la mairie. »
  reponse:
    gauche:
    - id: a
      texte: la séance
    - id: b
      texte: ouverte
    - id: c
      texte: devant la mairie
    droite:
    - id: x
      texte: COD du verbe déclarer
    - id: y
      texte: attribut du COD
    - id: z
      texte: complément circonstanciel de lieu
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Cherche d'abord ce que le maire a déclaré (COD), puis ce que devient ce COD (attribut).
    methode: Le complément de lieu répond à la question « où ? » et peut être déplacé ou supprimé sans changer le sens de
      base.
    etape: '« la séance » répond à « déclaré quoi ? » : c''est le COD. « ouverte » dit ce que devient la séance.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie surtout la différence entre l'attribut du COD et le complément de
      lieu.
  - si:
      diagnostic: associations_fausses
    relance: 'Repars du verbe « déclarer » : cherche son COD, puis l''attribut de ce COD, puis ce qui reste.'
  solution: « la séance » est COD, « ouverte » est attribut du COD (la séance devient ouverte), « devant la mairie » est complément
    circonstanciel de lieu.
- id: nblm-dans-la-phrase-on-l-a-elu-president-quel-1
  type: choix
  difficulte: 2
  enonce: Dans la phrase « On l'a élu président », quelle est la fonction grammaticale du mot « président » ?
  reponse:
    options:
    - id: o1
      texte: Attribut du COD
    - id: o2
      texte: Attribut du sujet
    - id: o3
      texte: Complément d'objet indirect (COI)
    - id: o4
      texte: Adjectif épithète
    bonnes:
    - o1
  indices:
    relance: Examine quel élément de la phrase reçoit le titre de président suite à l'action d'élire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : « président » ne qualifie pas le sujet « On », mais le pronom COD « l'' » (ce n''est pas «
      On » qui est président).'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le mot « président » est directement rattaché au verbe et au COD sans préposition.'
  solution: 'Attribut du COD. C''est exact : « président » complète le pronom COD « l'' » en lui attribuant un titre par l''intermédiaire
    du verbe « élire ».'
- id: nblm-dans-la-phrase-je-trouve-ca-bizarre-quel-2
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Je trouve ça bizarre », quelle structure grammaticale est utilisée ?
  reponse:
    options:
    - id: o1
      texte: Verbe de jugement + COD + attribut du COD
    - id: o2
      texte: Verbe d'état + attribut du sujet
    - id: o3
      texte: Verbe + COD + adjectif épithète
    - id: o4
      texte: Verbe + COI + attribut du sujet
    bonnes:
    - o1
  indices:
    relance: Réfléchis au rôle du verbe « trouver » et à l'élément auquel s'applique l'adjectif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : « trouver » n''est pas un verbe d''état (comme être ou paraître), c''est un verbe de jugement
      suivi d''un COD.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « bizarre » n''est pas une simple épithète, il exprime l''appréciation portée sur le COD par
      le verbe.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « ça » est un complément d''objet direct (trouver quoi ?) et non un COI.'
  solution: 'Verbe de jugement + COD + attribut du COD. C''est exact : le verbe de jugement « trouver » est suivi du COD «
    ça » et de l''adjectif « bizarre », qui est attribut du COD.'
- id: nblm-dans-la-phrase-le-jury-a-juge-cette-piec-3
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Le jury a jugé cette pièce originale », quel mot ou groupe de mots est l'attribut du COD ?
  reponse:
    options:
    - id: o1
      texte: originale
    - id: o2
      texte: cette pièce
    - id: o3
      texte: Le jury
    - id: o4
      texte: a jugé
    bonnes:
    - o1
  indices:
    relance: Cherche le mot qui attribue une qualité ou un jugement au COD « cette pièce ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : « cette pièce » est le complément d''objet direct (COD) du verbe « a jugé ».'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « Le jury » est le sujet de la phrase.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « a jugé » est le verbe conjugué.'
  solution: 'originale. C''est exact : « originale » est l''adjectif attribut du COD « cette pièce » via le verbe de jugement
    « juger ».'
- id: nblm-laquelle-de-ces-phrases-correspond-a-la-4
  type: choix
  difficulte: 2
  enonce: Laquelle de ces phrases correspond à la structure « verbe + COD + adjectif » où l'adjectif est attribut du COD ?
  reponse:
    options:
    - id: o1
      texte: Cette nouvelle a rendu ma sœur folle de joie.
    - id: o2
      texte: Ma sœur est devenue très heureuse.
    - id: o3
      texte: J'ai aperçu une fille très heureuse.
    - id: o4
      texte: Ma sœur parle à son amie.
    bonnes:
    - o1
  indices:
    relance: Cherche la phrase où le verbe transforme l'état du COD ou lui attribue une qualité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : « est devenue » est un verbe d''état suivi d''un attribut du sujet « ma sœur ».'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « heureuse » est une simple épithète liée au nom « fille » dans le groupe nominal COD.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : cette phrase contient un verbe suivi d''un COI (« à son amie »).'
  solution: 'Cette nouvelle a rendu ma sœur folle de joie. C''est exact : « a rendu » (verbe) + « ma sœur » (COD) + « folle
    » (adjectif attribut du COD).'
- id: nblm-quelle-manipulation-permet-de-verifier-q-5
  type: choix
  difficulte: 2
  enonce: Quelle manipulation permet de vérifier qu'un mot est attribut du COD ?
  reponse:
    options:
    - id: o1
      texte: Insérer « comme » ou reformuler avec le verbe « être » entre le COD et le mot.
    - id: o2
      texte: Supprimer le COD et conserver seulement l'attribut.
    - id: o3
      texte: Remplacer l'attribut par un adverbe de manière.
    - id: o4
      texte: Mettre le verbe principal à la forme négative.
    bonnes:
    - o1
  indices:
    relance: Pense au test qui relie le COD et l'attribut au moyen d'un verbe d'état.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : supprimer le COD rend la phrase agrammaticale car l''attribut qualifie directement le COD.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : l''attribut du COD exprime un état ou une qualité du COD, non une manière d''agir.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le passage à la négation ne permet pas d''identifier la fonction d''attribut du COD.'
  solution: 'Insérer « comme » ou reformuler avec le verbe « être » entre le COD et le mot. C''est exact : on peut dire «
    Le COD est [attribut] » (ex: « ce film est excellent ») ou insérer « comme ».'
- id: nblm-quels-verbes-parmi-les-suivants-introdui-6
  type: choix
  difficulte: 3
  enonce: Quels verbes parmi les suivants introduisent régulièrement un attribut du COD ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: considérer
    - id: o2
      texte: rendre
    - id: o3
      texte: dormir
    - id: o4
      texte: appartenir
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie les verbes de jugement/appréciation ou de transformation qui agissent sur un COD.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « dormir » est un verbe intransitif sans COD.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « appartenir » se construit avec un COI (« appartenir à »).'
  solution: 'considérer ; rendre. C''est exact : « considérer » est un verbe de jugement d''appréciation se construisant avec
    un COD et son attribut.'
- id: nblm-dans-la-phrase-je-crois-cet-homme-aveugl-7
  type: texte_court
  difficulte: 1
  enonce: 'Dans la phrase « Je crois cet homme aveugle », complétez la fonction exacte du mot « aveugle » : ___ du COD.'
  reponse:
    acceptees:
    - attribut
    fautes_tolerees: 1
  indices:
    relance: Indique le terme grammatical désignant la fonction qui attribue une qualité ou un état au COD.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'attribut. C''est exact : « aveugle » est l''attribut du COD « cet homme ».'
- id: nblm-dans-la-construction-verbe-cod-adjectif-8
  type: texte_court
  difficulte: 1
  enonce: 'Dans la construction « verbe + COD + adjectif », complétez le mot manquant désignant la fonction de l''adjectif
    : ___ du COD.'
  reponse:
    acceptees:
    - attribut
    fautes_tolerees: 1
  indices:
    relance: Il s'agit du nom de la fonction grammaticale étudiée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'attribut. C''est exact : l''adjectif occupant cette position par l''intermédiaire du verbe exerce la fonction
    d''attribut du COD.'
