format: 2
notion: poesie-romantisme-a-nos-jours
version: 1
etat: verifiee
declencheurs:
- poème qui célèbre la nature
- chant du monde en poésie
- vers libres modernes
- poésie qui parle du monde
prerequis: []
essentiel: 'Depuis le romantisme, au début du XIXe siècle, jusqu''à aujourd''hui, la poésie explore la place de l''homme dans
  le monde.

  Elle utilise toutes les ressources de la langue : le rythme, les sonorités, les images, pour célébrer notre présence au
  monde

  et pour en interroger le sens.

  La nature tient une place centrale dans cette poésie : elle est souvent le lieu où le poète ressent le monde de façon intense,

  ce que l''on appelle parfois « le chant du monde ».

  Au XIXe siècle, des poètes comme Victor Hugo ou Charles Baudelaire écrivent des poèmes où la nature reflète les sentiments

  du poète, ou bien où la ville devient elle-même un sujet poétique.

  Plus tard, au début du XXe siècle, Guillaume Apollinaire renouvelle la forme des poèmes, par exemple avec les calligrammes,

  des poèmes dont la disposition sur la page dessine une image.

  Lire un poème, c''est accepter une expérience de lecture particulière : le sens ne se limite pas à ce que le texte raconte,

  il passe aussi par les sons, le rythme et les images qu''il fait naître chez le lecteur.

  '
methode:
- Lire le poème à voix haute pour ressentir son rythme et ses sonorités, pas seulement son sens littéral.
- Repérer les images (comparaisons, métaphores) que le poète utilise pour parler du monde.
- 'Observer la place de la nature dans le poème : est-elle décrite, ou sert-elle à exprimer un sentiment ?'
- Se demander quelle vision du monde le poème propose au lecteur, et quel effet il cherche à produire.
vocabulaire:
- terme: vers
  definition: ligne d'un poème, qui peut suivre un rythme régulier ou être libre
- terme: calligramme
  definition: poème dont la disposition des mots sur la page dessine une image en rapport avec le texte
- terme: métaphore
  definition: image qui compare deux choses sans mot de comparaison, comme « la nuit tombe »
erreurs_frequentes:
- Chercher uniquement ce qu'un poème « raconte », sans faire attention aux sonorités et au rythme.
- Croire que tous les poèmes du romantisme à nos jours ont la même forme, avec des rimes régulières.
- Confondre calligramme (poème visuel) et simple poème illustré par un dessin séparé.
exemple:
  enonce: Explique en une phrase pourquoi la nature occupe une place importante dans la poésie du romantisme à nos jours.
  solution: La nature permet souvent au poète d'exprimer ses sentiments ou de célébrer le monde, dans ce que l'on appelle
    parfois le « chant du monde ».
exercices:
- id: definir-calligramme
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un calligramme ?
  reponse:
    options:
    - id: a
      texte: Un poème dont la disposition des mots sur la page dessine une image
    - id: b
      texte: Un poème qui raconte une bataille historique
    - id: c
      texte: Un dictionnaire de rimes
    - id: d
      texte: Un roman en vers
    bonnes:
    - a
  indices:
    relance: Pense à un poème d'Apollinaire où les mots sont disposés en forme de dessin, par exemple une pluie ou une tour.
    methode: Élimine les définitions qui ne parlent pas de la disposition visuelle des mots sur la page.
    etape: La bonne réponse mentionne une image dessinée par les mots eux-mêmes.
  pieges:
  - si:
      contient:
      - b
    relance: Un calligramme n'est pas défini par son sujet, mais par la disposition visuelle de ses mots sur la page.
  - si:
      contient:
      - c
    relance: Un calligramme est un poème, pas un dictionnaire.
  - si:
      contient:
      - d
    relance: 'Un calligramme n''est pas un roman : c''est un poème court dont la forme visuelle compte.'
  solution: Un calligramme est un poème dont la disposition des mots sur la page dessine une image en rapport avec le texte.
- id: auteur-calligrammes
  type: texte_court
  difficulte: 1
  enonce: Quel est le nom de famille du poète connu pour ses calligrammes, mort en 1918 ?
  reponse:
    acceptees:
    - apollinaire
    fautes_tolerees: 2
  indices:
    relance: Ce poète du début du XXe siècle a inventé une forme de poème où les mots dessinent une image.
    methode: Cherche le nom d'un poète qui a combattu pendant la Première Guerre mondiale et est mort peu avant la fin de
      la guerre.
    etape: Son prénom est Guillaume.
  pieges:
  - si:
      valeur: hugo
    relance: Victor Hugo est un poète du XIXe siècle, mais il n'est pas l'inventeur des calligrammes.
  - si:
      valeur: baudelaire
    relance: Baudelaire est un poète du XIXe siècle, connu pour un autre recueil. Cherche le poète des calligrammes, plus
      tardif.
  solution: Il s'agit de Guillaume Apollinaire, mort en 1918, connu pour ses calligrammes.
- id: procedes-poetiques
  type: association
  difficulte: 2
  enonce: Associe chaque procédé poétique à sa définition.
  reponse:
    gauche:
    - id: a
      texte: La métaphore
    - id: b
      texte: Le rythme
    - id: c
      texte: Le calligramme
    droite:
    - id: x
      texte: Une image qui compare deux choses sans mot de comparaison
    - id: y
      texte: L'organisation des sons et des accents dans le vers
    - id: z
      texte: Un poème dont la forme visuelle dessine une image
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces mots parle d'une image, un autre du son du poème, un autre de sa forme sur la page.
    methode: Associe d'abord le procédé qui compare deux choses, puis celui qui concerne les sons, puis celui qui concerne
      la forme visuelle.
    etape: La métaphore compare ; le rythme organise les sons ; le calligramme dessine une image avec les mots.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la différence entre rythme et métaphore.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque procédé un par un, en te demandant s'il concerne le sens, le son ou la forme visuelle.
  solution: La métaphore compare deux choses par une image, le rythme organise les sons du vers, le calligramme dessine une
    image avec la disposition des mots.
- id: siecles-poesie
  type: ordre
  difficulte: 2
  enonce: Range ces trois moments de la poésie du plus ancien au plus récent.
  reponse:
    elements:
    - id: romantisme
      texte: Le romantisme, au début du XIXe siècle
    - id: baudelaire
      texte: Baudelaire et la poésie de la ville, au milieu du XIXe siècle
    - id: apollinaire
      texte: Apollinaire et les calligrammes, au début du XXe siècle
  indices:
    relance: Le romantisme est le mouvement le plus ancien des trois. Lequel des deux autres vient ensuite ?
    methode: Range d'abord le romantisme, puis Baudelaire, puis Apollinaire, qui écrit le plus tardivement.
    etape: Le romantisme commence au début du XIXe siècle, Baudelaire écrit au milieu du XIXe siècle, Apollinaire au début
      du XXe siècle.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux moments voisins sont inversés. Lequel des deux vient en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le mouvement le plus ancien (le romantisme), puis le plus récent (Apollinaire).
  solution: Le romantisme est le plus ancien (début du XIXe siècle), puis vient Baudelaire (milieu du XIXe siècle), puis Apollinaire
    (début du XXe siècle).
- id: vision-du-monde-poeme
  type: ouverte
  difficulte: 3
  enonce: Choisis un poème étudié en classe et explique quelle vision du monde ou de la nature il propose au lecteur.
  criteres:
  - L'élève cite un poème ou un poète précis étudié en classe.
  - L'élève explique ce que le poème dit du monde ou de la nature (célébration, interrogation, inquiétude...).
  - L'élève relie cette vision à un procédé du poème (image, rythme, forme).
  indices:
    relance: Le poème que tu choisis célèbre-t-il la nature, ou pose-t-il plutôt des questions inquiètes sur le monde ?
    methode: Choisis un poème, résume en une phrase ce qu'il dit du monde, puis explique par quel procédé il le fait.
    etape: Tu peux commencer ainsi « Dans ce poème, l'auteur... », puis expliquer la vision du monde proposée.
  solution: Par exemple, un poème qui décrit un paysage automnal peut proposer une vision mélancolique du monde, où la nature
    reflète la tristesse du poète, notamment par le choix des images et par un rythme lent.
