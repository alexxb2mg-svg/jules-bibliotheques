# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: poesie-romantisme-a-nos-jours
version: 2
etat: verifiee
declencheurs:
- poème qui célèbre la nature
- chant du monde en poésie
- vers libres modernes
- poésie qui parle du monde
- poème romantique sur la nature
- poème en prose
- vers libres et rimes
- personnification dans un poème
- poète du XIXe siècle
prerequis: []
essentiel: 'Le programme de 3e propose de découvrir des poèmes, du romantisme à nos jours. La poésie joue de toutes les ressources
  de la langue (sons, rythmes, images, formes) pour célébrer notre présence au monde et pour s''interroger sur son sens. On
  parle parfois de « chant du monde ». La nature y joue un rôle central.


  Le romantisme (début du XIXe siècle) place le moi et les sentiments au cœur du poème : la nature reflète l''état d''âme
  du poète (Lamartine, Hugo, Musset). Le poète célèbre souvent la beauté du monde, mais peut aussi exprimer la mélancolie.


  Au XIXe siècle, Baudelaire (Les Fleurs du mal, 1857) montre que la poésie peut aussi parler de la ville, du spleen et de
  la beauté étrange. Rimbaud et Verlaine explorent la musique des vers. Le symbolisme suggère plutôt que de dire.


  Au XXe siècle, la poésie se renouvelle. Apollinaire (Alcools, Calligrammes) invente des formes libres : les calligrammes
  dessinent une image avec les mots. Le surréalisme (Éluard, Breton) explore le rêve et l''imaginaire. Prévert écrit des poèmes
  proches du langage courant. Senghor, Césaire et d''autres poètes de langue française chantent le monde depuis d''autres
  continents. La poésie contemporaine explore la liberté des formes.


  Les formes : le vers (régulier, avec rimes et mesure, ou vers libre sans règle fixe), la strophe, le poème en prose (poésie
  sans vers) et la prose poétique. Les procédés : la comparaison, la métaphore, la personnification, les sonorités (allitération,
  assonance), le rythme.


  La poésie invite aussi le lecteur à ressentir. Lire un poème, c''est accepter une expérience : ce que dit le poème passe
  par les sons, le rythme, les images, et pas seulement par son sens.


  Ce qu''on attend au brevet : repérer la vision du monde du poème, nommer des procédés précis (image, rythme, sonorités,
  forme) avec des preuves, et expliquer ce que le poème invite à éprouver.

  '
methode:
- Lire le poème à voix haute pour ressentir son rythme et ses sonorités, pas seulement son sens.
- 'Repérer la forme : vers réguliers ou libres, strophes, rimes, poème en prose, forme visuelle.'
- Relever les images (comparaisons, métaphores, personnifications) et dire ce qu'elles évoquent.
- 'Observer la place de la nature : est-elle décrite, célébrée, ou sert-elle à exprimer un sentiment ?'
- Repérer les sonorités et le rythme, et l'effet qu'ils produisent (douceur, élan, tristesse).
- Formuler la vision du monde que le poème propose au lecteur et ce qu'il invite à éprouver, avec des preuves.
vocabulaire:
- terme: vers
  definition: ligne d'un poème, qui peut suivre un rythme régulier ou être libre
- terme: vers libre
  definition: vers qui ne suit ni règle de mesure ni règle de rime
- terme: strophe
  definition: groupe de vers qui forme un ensemble dans un poème
- terme: calligramme
  definition: poème dont la disposition des mots sur la page dessine une image en rapport avec le texte
- terme: métaphore
  definition: image qui compare deux choses sans mot de comparaison, comme « la nuit tombe »
- terme: comparaison
  definition: image qui rapproche deux choses avec un mot de comparaison (comme, tel, semblable à)
- terme: personnification
  definition: procédé qui donne des traits humains à une chose ou à un animal
- terme: poème en prose
  definition: poème écrit sans vers ni rimes, en phrases, mais avec des images et du rythme
- terme: romantisme
  definition: mouvement littéraire du XIXe siècle où le poète exprime ses sentiments et son rapport à la nature
erreurs_frequentes:
- Chercher uniquement ce qu'un poème « raconte », sans faire attention aux sonorités et au rythme.
- Croire que tous les poèmes du romantisme à nos jours ont la même forme, avec des rimes régulières.
- Confondre calligramme (poème visuel) et simple poème illustré par un dessin séparé.
- Confondre comparaison (avec « comme ») et métaphore (sans mot de comparaison).
- Citer un procédé sans dire l'effet qu'il produit sur le lecteur.
exemple:
  enonce: Explique en une phrase pourquoi la nature occupe une place importante dans la poésie du romantisme à nos jours.
  solution: La nature permet souvent au poète d'exprimer ses sentiments ou de célébrer le monde, dans ce que l'on appelle
    parfois le « chant du monde ».
exercices:
- id: definir-calligramme
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un calligramme ?
  reponse:
    options:
    - id: a
      texte: Un poème dont la disposition des mots sur la page dessine une image
    - id: b
      texte: Un poème qui raconte une bataille historique
    - id: c
      texte: Un dictionnaire de rimes
    - id: d
      texte: Un roman en vers
    bonnes:
    - a
  indices:
    relance: Pense à un poème d'Apollinaire où les mots sont disposés en forme de dessin, par exemple une pluie ou une tour.
    methode: Élimine les définitions qui ne parlent pas de la disposition visuelle des mots sur la page.
    etape: La bonne réponse mentionne une image dessinée par les mots eux-mêmes.
  pieges:
  - si:
      contient:
      - b
    relance: Un calligramme n'est pas défini par son sujet, mais par la disposition visuelle de ses mots sur la page.
  - si:
      contient:
      - c
    relance: Un calligramme est un poème, pas un dictionnaire.
  - si:
      contient:
      - d
    relance: 'Un calligramme n''est pas un roman : c''est un poème court dont la forme visuelle compte.'
  solution: Un calligramme est un poème dont la disposition des mots sur la page dessine une image en rapport avec le texte.
- id: auteur-calligrammes
  type: texte_court
  difficulte: 1
  enonce: Quel est le nom de famille du poète connu pour ses calligrammes, mort en 1918 ?
  reponse:
    acceptees:
    - apollinaire
    fautes_tolerees: 2
  indices:
    relance: Ce poète du début du XXe siècle a inventé une forme de poème où les mots dessinent une image.
    methode: Cherche le nom d'un poète qui a combattu pendant la Première Guerre mondiale et est mort peu avant la fin de
      la guerre.
    etape: Son prénom est Guillaume.
  pieges:
  - si:
      valeur: hugo
    relance: Victor Hugo est un poète du XIXe siècle, mais il n'est pas l'inventeur des calligrammes.
  - si:
      valeur: baudelaire
    relance: Baudelaire est un poète du XIXe siècle, connu pour un autre recueil. Cherche le poète des calligrammes, plus
      tardif.
  solution: Il s'agit de Guillaume Apollinaire, mort en 1918, connu pour ses calligrammes.
- id: procedes-poetiques
  type: association
  difficulte: 2
  enonce: Associe chaque procédé poétique à sa définition.
  reponse:
    gauche:
    - id: a
      texte: La métaphore
    - id: b
      texte: Le rythme
    - id: c
      texte: Le calligramme
    droite:
    - id: x
      texte: Une image qui compare deux choses sans mot de comparaison
    - id: y
      texte: L'organisation des sons et des accents dans le vers
    - id: z
      texte: Un poème dont la forme visuelle dessine une image
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces mots parle d'une image, un autre du son du poème, un autre de sa forme sur la page.
    methode: Associe d'abord le procédé qui compare deux choses, puis celui qui concerne les sons, puis celui qui concerne
      la forme visuelle.
    etape: La métaphore compare ; le rythme organise les sons ; le calligramme dessine une image avec les mots.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la différence entre rythme et métaphore.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque procédé un par un, en te demandant s'il concerne le sens, le son ou la forme visuelle.
  solution: La métaphore compare deux choses par une image, le rythme organise les sons du vers, le calligramme dessine une
    image avec la disposition des mots.
- id: siecles-poesie
  type: ordre
  difficulte: 2
  enonce: Range ces trois moments de la poésie du plus ancien au plus récent.
  reponse:
    elements:
    - id: romantisme
      texte: Le romantisme, au début du XIXe siècle
    - id: baudelaire
      texte: Baudelaire et la poésie de la ville, au milieu du XIXe siècle
    - id: apollinaire
      texte: Apollinaire et les calligrammes, au début du XXe siècle
  indices:
    relance: Le romantisme est le mouvement le plus ancien des trois. Lequel des deux autres vient ensuite ?
    methode: Range d'abord le romantisme, puis Baudelaire, puis Apollinaire, qui écrit le plus tardivement.
    etape: Le romantisme commence au début du XIXe siècle, Baudelaire écrit au milieu du XIXe siècle, Apollinaire au début
      du XXe siècle.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux moments voisins sont inversés. Lequel des deux vient en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le mouvement le plus ancien (le romantisme), puis le plus récent (Apollinaire).
  solution: Le romantisme est le plus ancien (début du XIXe siècle), puis vient Baudelaire (milieu du XIXe siècle), puis Apollinaire
    (début du XXe siècle).
- id: vision-du-monde-poeme
  type: ouverte
  difficulte: 3
  enonce: Choisis un poème étudié en classe et explique quelle vision du monde ou de la nature il propose au lecteur.
  criteres:
  - L'élève cite un poème ou un poète précis étudié en classe.
  - L'élève explique ce que le poème dit du monde ou de la nature (célébration, interrogation, inquiétude...).
  - L'élève relie cette vision à un procédé du poème (image, rythme, forme).
  indices:
    relance: Le poème que tu choisis célèbre-t-il la nature, ou pose-t-il plutôt des questions inquiètes sur le monde ?
    methode: Choisis un poème, résume en une phrase ce qu'il dit du monde, puis explique par quel procédé il le fait.
    etape: Tu peux commencer ainsi « Dans ce poème, l'auteur... », puis expliquer la vision du monde proposée.
  solution: Par exemple, un poème qui décrit un paysage automnal peut proposer une vision mélancolique du monde, où la nature
    reflète la tristesse du poète, notamment par le choix des images et par un rythme lent.
- id: comparaison-ou-metaphore
  type: choix
  difficulte: 2
  enonce: Quelle phrase contient une métaphore ?
  reponse:
    options:
    - id: a
      texte: Le soleil est une pièce d'or dans le ciel.
    - id: b
      texte: Le soleil brille comme une pièce d'or.
    - id: c
      texte: Le soleil brille très fort ce matin.
    - id: d
      texte: Le soleil se lève à six heures.
    bonnes:
    - a
  indices:
    relance: Une métaphore compare sans utiliser de mot de comparaison.
    methode: Repère la phrase qui rapproche le soleil d'un objet précieux sans « comme ».
    etape: Une seule phrase affirme directement que le soleil « est » autre chose.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase utilise « comme » : c''est une comparaison.'
  - si:
      contient:
      - c
    relance: Cette phrase donne une information sans image.
  - si:
      contient:
      - d
    relance: Cette phrase donne une information factuelle, sans image.
  solution: '« Le soleil est une pièce d''or » compare deux choses sans mot de comparaison : c''est une métaphore.'
- id: poetes-et-epoques
  type: association
  difficulte: 2
  enonce: Associe chaque poète à un élément qui le caractérise.
  reponse:
    gauche:
    - id: a
      texte: Victor Hugo
    - id: b
      texte: Charles Baudelaire
    - id: c
      texte: Guillaume Apollinaire
    droite:
    - id: x
      texte: Poète romantique du XIXe siècle
    - id: y
      texte: Auteur des Fleurs du mal, qui parle aussi de la ville
    - id: z
      texte: Poète des calligrammes
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces poètes est du début du XXe siècle, deux sont du XIXe siècle.
    methode: Cherche le titre de recueil qui contient « mal », puis les calligrammes.
    etape: Le romantique est le plus ancien des trois.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pense au siècle de chaque poète.
  - si:
      diagnostic: associations_fausses
    relance: Reprends un poète à la fois, avec son siècle et son œuvre.
  solution: 'Hugo : romantique. Baudelaire : Les Fleurs du mal. Apollinaire : calligrammes.'
- id: analyser-poeme
  type: ouverte
  difficulte: 3
  enonce: 'Voici un poème court écrit pour l''exercice : « La mer respire au creux de mes mains, / le vent chante un vieux
    refrain, / le soleil s''endort sur le sable, / le monde est un jardin. » Explique quelle vision du monde ce poème propose
    et par quels procédés.'
  criteres:
  - L'élève identifie la vision du monde proposée (célébration douce de la nature, harmonie).
  - L'élève nomme au moins deux procédés précis (personnification de la mer, du vent, du soleil ; métaphore du monde-jardin).
  - L'élève relie ces procédés à l'effet produit (douceur, apaisement) avec un exemple cité.
  indices:
    relance: La nature est-elle décrite comme calme ou menaçante ? Qui « respire », « chante », « s'endort » ?
    methode: Repère les images, puis dis ce qu'elles font ressentir.
    etape: Tu peux commencer ainsi « Ce poème célèbre... grâce à... ».
  solution: 'Ce poème célèbre une nature harmonieuse. La mer « respire », le vent « chante », le soleil « s''endort » : la
    personnification donne vie au monde. La métaphore « le monde est un jardin » suggère un lieu paisible. Ces images créent
    une impression de douceur et invitent le lecteur à se sentir en accord avec le monde.'
