format: 2
notion: poesie-romantisme-a-nos-jours
version: 1
etat: verifiee
declencheurs:
- poème qui célèbre la nature
- chant du monde en poésie
- vers libres modernes
- poésie qui parle du monde
prerequis: []
essentiel: 'Depuis le romantisme, au début du XIXe siècle, jusqu''à aujourd''hui, la poésie explore la place de l''homme dans
  le monde.

  Elle utilise toutes les ressources de la langue : le rythme, les sonorités, les images, pour célébrer notre présence au
  monde

  et pour en interroger le sens.

  La nature tient une place centrale dans cette poésie : elle est souvent le lieu où le poète ressent le monde de façon intense,

  ce que l''on appelle parfois « le chant du monde ».

  Au XIXe siècle, des poètes comme Victor Hugo ou Charles Baudelaire écrivent des poèmes où la nature reflète les sentiments

  du poète, ou bien où la ville devient elle-même un sujet poétique.

  Plus tard, au début du XXe siècle, Guillaume Apollinaire renouvelle la forme des poèmes, par exemple avec les calligrammes,

  des poèmes dont la disposition sur la page dessine une image.

  Lire un poème, c''est accepter une expérience de lecture particulière : le sens ne se limite pas à ce que le texte raconte,

  il passe aussi par les sons, le rythme et les images qu''il fait naître chez le lecteur.

  '
methode:
- Lire le poème à voix haute pour ressentir son rythme et ses sonorités, pas seulement son sens littéral.
- Repérer les images (comparaisons, métaphores) que le poète utilise pour parler du monde.
- 'Observer la place de la nature dans le poème : est-elle décrite, ou sert-elle à exprimer un sentiment ?'
- Se demander quelle vision du monde le poème propose au lecteur, et quel effet il cherche à produire.
vocabulaire:
- terme: vers
  definition: ligne d'un poème, qui peut suivre un rythme régulier ou être libre
- terme: calligramme
  definition: poème dont la disposition des mots sur la page dessine une image en rapport avec le texte
- terme: métaphore
  definition: image qui compare deux choses sans mot de comparaison, comme « la nuit tombe »
erreurs_frequentes:
- Chercher uniquement ce qu'un poème « raconte », sans faire attention aux sonorités et au rythme.
- Croire que tous les poèmes du romantisme à nos jours ont la même forme, avec des rimes régulières.
- Confondre calligramme (poème visuel) et simple poème illustré par un dessin séparé.
exemple:
  enonce: Explique en une phrase pourquoi la nature occupe une place importante dans la poésie du romantisme à nos jours.
  solution: La nature permet souvent au poète d'exprimer ses sentiments ou de célébrer le monde, dans ce que l'on appelle
    parfois le « chant du monde ».
exercices:
- id: definir-calligramme
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un calligramme ?
  reponse:
    options:
    - id: a
      texte: Un poème dont la disposition des mots sur la page dessine une image
    - id: b
      texte: Un poème qui raconte une bataille historique
    - id: c
      texte: Un dictionnaire de rimes
    - id: d
      texte: Un roman en vers
    bonnes:
    - a
  indices:
    relance: Pense à un poème d'Apollinaire où les mots sont disposés en forme de dessin, par exemple une pluie ou une tour.
    methode: Élimine les définitions qui ne parlent pas de la disposition visuelle des mots sur la page.
    etape: La bonne réponse mentionne une image dessinée par les mots eux-mêmes.
  pieges:
  - si:
      contient:
      - b
    relance: Un calligramme n'est pas défini par son sujet, mais par la disposition visuelle de ses mots sur la page.
  - si:
      contient:
      - c
    relance: Un calligramme est un poème, pas un dictionnaire.
  - si:
      contient:
      - d
    relance: 'Un calligramme n''est pas un roman : c''est un poème court dont la forme visuelle compte.'
  solution: Un calligramme est un poème dont la disposition des mots sur la page dessine une image en rapport avec le texte.
- id: auteur-calligrammes
  type: texte_court
  difficulte: 1
  enonce: Quel est le nom de famille du poète connu pour ses calligrammes, mort en 1918 ?
  reponse:
    acceptees:
    - apollinaire
    fautes_tolerees: 2
  indices:
    relance: Ce poète du début du XXe siècle a inventé une forme de poème où les mots dessinent une image.
    methode: Cherche le nom d'un poète qui a combattu pendant la Première Guerre mondiale et est mort peu avant la fin de
      la guerre.
    etape: Son prénom est Guillaume.
  pieges:
  - si:
      valeur: hugo
    relance: Victor Hugo est un poète du XIXe siècle, mais il n'est pas l'inventeur des calligrammes.
  - si:
      valeur: baudelaire
    relance: Baudelaire est un poète du XIXe siècle, connu pour un autre recueil. Cherche le poète des calligrammes, plus
      tardif.
  solution: Il s'agit de Guillaume Apollinaire, mort en 1918, connu pour ses calligrammes.
- id: procedes-poetiques
  type: association
  difficulte: 2
  enonce: Associe chaque procédé poétique à sa définition.
  reponse:
    gauche:
    - id: a
      texte: La métaphore
    - id: b
      texte: Le rythme
    - id: c
      texte: Le calligramme
    droite:
    - id: x
      texte: Une image qui compare deux choses sans mot de comparaison
    - id: y
      texte: L'organisation des sons et des accents dans le vers
    - id: z
      texte: Un poème dont la forme visuelle dessine une image
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces mots parle d'une image, un autre du son du poème, un autre de sa forme sur la page.
    methode: Associe d'abord le procédé qui compare deux choses, puis celui qui concerne les sons, puis celui qui concerne
      la forme visuelle.
    etape: La métaphore compare ; le rythme organise les sons ; le calligramme dessine une image avec les mots.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la différence entre rythme et métaphore.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque procédé un par un, en te demandant s'il concerne le sens, le son ou la forme visuelle.
  solution: La métaphore compare deux choses par une image, le rythme organise les sons du vers, le calligramme dessine une
    image avec la disposition des mots.
- id: siecles-poesie
  type: ordre
  difficulte: 2
  enonce: Range ces trois moments de la poésie du plus ancien au plus récent.
  reponse:
    elements:
    - id: romantisme
      texte: Le romantisme, au début du XIXe siècle
    - id: baudelaire
      texte: Baudelaire et la poésie de la ville, au milieu du XIXe siècle
    - id: apollinaire
      texte: Apollinaire et les calligrammes, au début du XXe siècle
  indices:
    relance: Le romantisme est le mouvement le plus ancien des trois. Lequel des deux autres vient ensuite ?
    methode: Range d'abord le romantisme, puis Baudelaire, puis Apollinaire, qui écrit le plus tardivement.
    etape: Le romantisme commence au début du XIXe siècle, Baudelaire écrit au milieu du XIXe siècle, Apollinaire au début
      du XXe siècle.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux moments voisins sont inversés. Lequel des deux vient en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le mouvement le plus ancien (le romantisme), puis le plus récent (Apollinaire).
  solution: Le romantisme est le plus ancien (début du XIXe siècle), puis vient Baudelaire (milieu du XIXe siècle), puis Apollinaire
    (début du XXe siècle).
- id: vision-du-monde-poeme
  type: ouverte
  difficulte: 3
  enonce: Choisis un poème étudié en classe et explique quelle vision du monde ou de la nature il propose au lecteur.
  criteres:
  - L'élève cite un poème ou un poète précis étudié en classe.
  - L'élève explique ce que le poème dit du monde ou de la nature (célébration, interrogation, inquiétude...).
  - L'élève relie cette vision à un procédé du poème (image, rythme, forme).
  indices:
    relance: Le poème que tu choisis célèbre-t-il la nature, ou pose-t-il plutôt des questions inquiètes sur le monde ?
    methode: Choisis un poème, résume en une phrase ce qu'il dit du monde, puis explique par quel procédé il le fait.
    etape: Tu peux commencer ainsi « Dans ce poème, l'auteur... », puis expliquer la vision du monde proposée.
  solution: Par exemple, un poème qui décrit un paysage automnal peut proposer une vision mélancolique du monde, où la nature
    reflète la tristesse du poète, notamment par le choix des images et par un rythme lent.
- id: nblm-comment-appelle-t-on-l-expression-poetiq-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on l'expression poétique intense où la nature permet au poète de célébrer notre présence au monde
    et d'exprimer ses sentiments ?
  reponse:
    options:
    - id: o1
      texte: Le chant du monde
    - id: o2
      texte: Le récit d'anticipation
    - id: o3
      texte: L'autobiographie
    - id: o4
      texte: Le pamphlet satirique
    bonnes:
    - o1
  indices:
    relance: Pense au terme poétique qui désigne la célébration de la nature et l'expression des émotions face à l'univers.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de notion : le récit d''anticipation appartient au genre narratif sur le progrès scientifique, et non
      à la poésie lyrique.'
  - si:
      contient:
      - o3
    relance: 'Erreur de genre : l''autobiographie est un récit de vie en prose, et non la célébration poétique de la nature.'
  - si:
      contient:
      - o4
    relance: 'Erreur de visée : le pamphlet est un texte violent d''attaque politique ou sociale, pas un poème célébrant le
      monde.'
  solution: Le chant du monde. C'est exact. La fiche indique que la nature est le lieu où le poète ressent le monde de façon
    intense, ce qu'on appelle parfois « le chant du monde ».
- id: nblm-au-xixe-siecle-quel-role-principal-la-na-2
  type: choix
  difficulte: 2
  enonce: Au XIXe siècle, quel rôle principal la nature ou le monde environnant jouent-ils dans les poèmes de Victor Hugo
    ou de Charles Baudelaire ?
  reponse:
    options:
    - id: o1
      texte: La nature et la ville reflètent les sentiments du poète ou deviennent des sujets poétiques à part entière.
    - id: o2
      texte: La nature sert uniquement de décor documentaire neutre, sans aucun lien avec les émotions.
    - id: o3
      texte: La nature est totalement bannie pour ne parler que de machines scientifiques.
    - id: o4
      texte: La nature est toujours présentée de manière comique pour se moquer du lecteur.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que pour les poètes romantiques, le paysage extérieur renvoie souvent à la sensibilité intérieure.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : réduire la poésie à une simple description neutre en ignorant la dimension expressive des
      sentiments.'
  - si:
      contient:
      - o3
    relance: 'Contresens : la nature occupe une place centrale depuis le romantisme pour explorer la place de l''homme dans
      le monde.'
  - si:
      contient:
      - o4
    relance: 'Confusion de registre : la poésie lyrique cherche à explorer le sens de notre présence au monde, pas à ridiculiser
      la nature.'
  solution: 'La nature et la ville reflètent les sentiments du poète ou deviennent des sujets poétiques à part entière. Exact
    : les poètes romantiques et modernes font refléter leurs sentiments dans la nature ou font de la ville un sujet poétique.'
- id: nblm-quelle-affirmation-sur-la-forme-du-vers-3
  type: choix
  difficulte: 2
  enonce: Quelle affirmation sur la forme du vers poétique du romantisme à nos jours est exacte d'après les sources ?
  reponse:
    options:
    - id: o1
      texte: Un vers est une ligne d'un poème qui peut suivre un rythme régulier ou être un vers libre.
    - id: o2
      texte: Tous les poèmes depuis le romantisme comportent obligatoirement des rimes régulières et des alexandrins.
    - id: o3
      texte: Un vers est obligatoirement une phrase entière qui s'arrête toujours à un point.
    - id: o4
      texte: Le vers libre est une forme poétique réservée exclusivement au théâtre classique du XVIIe siècle.
    bonnes:
    - o1
  indices:
    relance: Considère la liberté de forme progressivement acquise par les poètes modernes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que toute la poésie conserve une métrique traditionnelle à rimes régulières.'
  - si:
      contient:
      - o3
    relance: 'Erreur de syntaxe : le vers est une unité typographique et rythmique, pas forcément une phrase complète.'
  - si:
      contient:
      - o4
    relance: 'Anachronisme : le vers libre s''est développé avec la poésie moderne, pas au théâtre classique du XVIIe siècle.'
  solution: Un vers est une ligne d'un poème qui peut suivre un rythme régulier ou être un vers libre. C'est exact. La fiche
    définit le vers comme une ligne de poème pouvant être régulière ou libre.
- id: nblm-comment-guillaume-apollinaire-a-t-il-ren-4
  type: choix
  difficulte: 2
  enonce: Comment Guillaume Apollinaire a-t-il renouvelé la forme des poèmes qui parlent du monde au début du XXe siècle ?
  reponse:
    options:
    - id: o1
      texte: En créant des calligrammes, poèmes dont la disposition des mots sur la page dessine une image.
    - id: o2
      texte: En écrivant uniquement des fables illustrées avec des animaux de ferme.
    - id: o3
      texte: En collant un dessin séparé à côté de chaque poème classique.
    - id: o4
      texte: En remplaçant tous les mots du texte par un enregistrement sonore.
    bonnes:
    - o1
  indices:
    relance: Pense au mot désignant un poème visuel dont la forme typographique sur la page forme un dessin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion d''auteur : les fables d''animaux sont associées à Jean de La Fontaine au XVIIe siècle.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : un calligramme n''est pas un poème accompagné d''une illustration séparée, mais un texte
      qui forme lui-même l''image.'
  - si:
      contient:
      - o4
    relance: 'Contresens : le poème reste un texte écrit dont les mots sont agencés visuellement.'
  solution: 'En créant des calligrammes, poèmes dont la disposition des mots sur la page dessine une image. Exact : Apollinaire
    invente les calligrammes où la disposition visuelle des mots dessine une image liée au texte.'
- id: nblm-selon-la-fiche-de-notion-par-quoi-passe-5
  type: choix
  difficulte: 2
  enonce: Selon la fiche de notion, par quoi passe le sens d'un poème lors de sa lecture, en plus de ce qu'il raconte ?
  reponse:
    options:
    - id: o1
      texte: Par les sons, le rythme et les images qu'il fait naître chez le lecteur.
    - id: o2
      texte: Uniquement par le résumé logique des événements racontés dans l'histoire.
    - id: o3
      texte: Par la vérification des données scientifiques citées dans le texte.
    - id: o4
      texte: Par le calcul mécanique du nombre de mots dans chaque paragraphe.
    bonnes:
    - o1
  indices:
    relance: La poésie s'adresse à la sensibilité du lecteur grâce aux qualités musicales et imagées de la langue.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : réduire un poème à ce qu''il « raconte » sans prêter attention au rythme et aux sonorités.'
  - si:
      contient:
      - o3
    relance: 'Confusion de genre : la poésie exprime un rapport au monde et des émotions, elle ne se lit pas comme un traité
      scientifique.'
  - si:
      contient:
      - o4
    relance: 'Approche erronée : la lecture poétique repose sur la sensibilité aux effets esthétiques (images, sonorités),
      non sur un calcul mécanique.'
  solution: 'Par les sons, le rythme et les images qu''il fait naître chez le lecteur. Exact : le sens poétique dépasse l''histoire
    racontée et s''appuie sur le rythme, les sonorités et les images.'
- id: nblm-quelles-sont-les-deux-demarches-d-analys-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX démarches d'analyse correctes préconisées pour étudier un poème qui célèbre la nature et le
    monde du romantisme à nos jours ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Lire le poème à voix haute pour ressentir son rythme et ses sonorités.
    - id: o2
      texte: Observer si la nature est décrite ou si elle sert à exprimer un sentiment.
    - id: o3
      texte: Se limiter au sens littéral des mots sans prêter attention aux métaphores.
    - id: o4
      texte: Exiger que le poème respecte toujours des rimes régulières pour être qualifié de poème.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense à la dimension sonore du poème ainsi qu'à la fonction expressive de la nature.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : les images (comparaisons, métaphores) sont fondamentales pour saisir la portée poétique.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : croire que toute la poésie moderne utilise des rimes régulières, alors qu''existent les vers
      libres et la prose poétique.'
  solution: 'Lire le poème à voix haute pour ressentir son rythme et ses sonorités ; Observer si la nature est décrite ou
    si elle sert à exprimer un sentiment. Exact : la lecture à voix haute permet d''éprouver la dimension sonore, la musicalité
    et le rythme du texte.'
- id: nblm-quel-terme-designe-un-poeme-visuel-dont-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne un poème visuel dont la disposition des mots sur la page dessine une image en rapport avec le
    texte ?
  reponse:
    acceptees:
    - calligramme
    fautes_tolerees: 1
  indices:
    relance: C'est un mot de la fiche de notion désignant la forme poétique visuelle développée par Apollinaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: calligramme. Le calligramme est un poème dont les mots forment un dessin en lien avec le sujet du poème.
- id: nblm-quelle-figure-de-style-cree-une-image-en-8
  type: texte_court
  difficulte: 1
  enonce: 'Quelle figure de style crée une image en comparant deux choses sans mot de comparaison (ex : « la nuit tombe »)
    ?'
  reponse:
    acceptees:
    - métaphore
    fautes_tolerees: 1
  indices:
    relance: C'est une figure de style clé du vocabulaire poétique pour créer une image forte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: métaphore. La métaphore est une image poétique qui associe deux réalités sans outil de comparaison (comme 'comme'
    ou 'tel').
