format: 2
notion: accord-participe-passe-avec-avoir
version: 1
etat: verifiee
declencheurs:
- les fautes que j'ai fait ou faites
- accorder avec le COD placé avant
- que j'ai vue ou vu
prerequis: []
essentiel: 'Avec l''auxiliaire avoir, le participe passé s''accorde avec le COD seulement si ce COD est placé AVANT

  le verbe. S''il est après ou s''il n''y a pas de COD, le participe passé reste invariable.


  Exemple : « J''ai mangé des pommes. » (COD après, invariable) mais « Les pommes que j''ai mangées. »

  (COD « que », qui reprend « les pommes », placé avant : accord au féminin pluriel).


  Cas très fréquent : le pronom relatif « que » est souvent COD placé avant le verbe. Il faut trouver

  son antécédent pour savoir avec quoi accorder.


  Méthode : cherche le COD, regarde s''il est avant ou après le verbe. S''il est avant, accorde le participe

  en genre et en nombre avec ce COD.

  '
methode:
- Repère l'auxiliaire avoir et le participe passé qui le suit.
- 'Cherche le COD du verbe : le verbe a-t-il un complément direct (sans préposition) ?'
- Si le COD est placé avant le verbe (souvent un pronom relatif « que » ou un pronom personnel), accorde le participe avec
  ce COD.
- Si le COD est après le verbe, ou s'il n'y a pas de COD, laisse le participe invariable.
vocabulaire:
- terme: COD antéposé
  definition: complément d'objet direct placé avant le verbe dans la phrase
- terme: invariable
  definition: qui ne change pas de forme selon le genre ou le nombre
erreurs_frequentes:
- Accorder le participe passé avec le sujet au lieu du COD placé avant.
- Oublier de chercher l'antécédent du pronom relatif « que » pour savoir avec quoi accorder.
- 'Accorder alors que le COD est placé après le verbe : dans ce cas, le participe reste invariable.'
exemple:
  enonce: 'Accorde correctement : « Les photos que j''ai (prendre) hier sont réussies. »'
  solution: '« que j''ai prises » : « que » reprend « les photos », féminin pluriel, et il est placé avant le verbe « ai pris
    ». Le participe s''accorde donc : prises.'
exercices:
- id: prises-ou-pris
  type: texte_court
  difficulte: 1
  enonce: 'Complète : « Voici les lettres que j''ai (écrire) ce matin. » (écris seulement le participe passé accordé)'
  reponse:
    acceptees:
    - écrites
    fautes_tolerees: 0
  indices:
    relance: 'Cherche l''antécédent du pronom « que » : quel mot reprend-il ?'
    methode: '« que » reprend « les lettres », féminin pluriel, et il est placé avant le verbe : le participe s''accorde.'
    etape: Le participe passé de « écrire » est « écrit ». Ajoute la marque du féminin pluriel.
  pieges:
  - si:
      valeur: écrit
    relance: 'As-tu bien cherché l''antécédent de « que » ? Il est féminin pluriel : le participe doit porter cette marque.'
  - si:
      valeur: écris
    relance: Ce n'est pas la bonne terminaison pour un participe passé. Pense au participe de « écrire » accordé au féminin
      pluriel.
  solution: '« que j''ai écrites » : « que » reprend « les lettres », féminin pluriel, placé avant le verbe.'
- id: vue-ou-vu
  type: choix
  difficulte: 1
  enonce: Quelle phrase est correctement accordée ?
  reponse:
    options:
    - id: a
      texte: La série que j'ai regardée m'a plu.
    - id: b
      texte: La série que j'ai regardé m'a plu.
    - id: c
      texte: J'ai regardée cette série hier soir.
    bonnes:
    - a
  indices:
    relance: Cherche l'antécédent du pronom « que » dans chaque phrase où il est présent.
    methode: '« que » reprend « la série », féminin singulier, placé avant le verbe : le participe doit porter la marque du
      féminin.'
    etape: 'Dans la phrase a, le participe est « regardée » : porte-t-il la marque du féminin ?'
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase oublie l'accord alors que le COD « que » (la série) est placé avant le verbe.
  - si:
      contient:
      - c
    relance: 'Ici, le COD « cette série » est placé après le verbe : le participe doit rester invariable, « regardé ».'
  solution: 'La phrase a est correcte : « que » reprend « la série », féminin singulier, placé avant le verbe, donc « regardée
    » s''accorde.'
- id: cod-avant-ou-apres
  type: choix
  difficulte: 2
  enonce: Dans « J'ai vu les erreurs que tu as commises. », pourquoi « commises » s'accorde-t-il ?
  reponse:
    options:
    - id: a
      texte: parce que le COD « que » (les erreurs) est placé avant le verbe « as commis »
    - id: b
      texte: parce que le sujet « tu » est féminin
    - id: c
      texte: parce que tous les participes passés avec avoir s'accordent
    bonnes:
    - a
  indices:
    relance: 'Cherche ce que « as commis » complète directement : qui reprend le COD dans cette proposition ?'
    methode: Le participe s'accorde avec le COD seulement s'il est placé avant le verbe. Vérifie où est le COD ici.
    etape: « que » reprend « les erreurs », féminin pluriel, et il est placé juste avant « as commises ».
  pieges:
  - si:
      contient:
      - b
    relance: Le participe passé avec avoir ne s'accorde jamais avec le sujet, seulement avec un COD placé avant.
  - si:
      contient:
      - c
    relance: 'C''est faux : avec avoir, le participe ne s''accorde que si le COD est placé avant le verbe.'
  solution: « commises » s'accorde car « que », qui reprend « les erreurs » (féminin pluriel), est le COD placé avant le verbe
    « as commis ».
- id: accorder-ouvert
  type: ouverte
  difficulte: 3
  enonce: Écris une phrase avec un pronom relatif « que » COD placé avant un verbe conjugué avec avoir, et accorde correctement
    le participe passé.
  criteres:
  - La phrase contient un pronom relatif « que » qui reprend un antécédent clair.
  - Le participe passé est correctement accordé en genre et en nombre avec cet antécédent.
  indices:
    relance: Pense à un antécédent féminin ou pluriel pour bien voir la marque d'accord à l'écrit.
    methode: Construis d'abord la proposition principale avec un nom, puis ajoute « que j'ai + participe ».
    etape: 'Par exemple : « Les chansons que j''ai... » puis choisis un verbe et accorde son participe.'
  solution: 'Exemple possible : « Les chansons que j''ai apprises sont belles. » « que » reprend « les chansons », féminin
    pluriel, placé avant le verbe : le participe « apprises » s''accorde.'
- id: nblm-dans-la-phrase-voici-la-liste-des-fautes-1
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Voici la liste des fautes que j'ai... », quelle est l'orthographe correcte du participe passé du
    verbe faire ?
  reponse:
    options:
    - id: o1
      texte: faites
    - id: o2
      texte: fait
    - id: o3
      texte: faite
    - id: o4
      texte: faits
    bonnes:
    - o1
  indices:
    relance: Identifie le COD placé avant le verbe et trouve le genre et le nombre de son antécédent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique d''invariabilité : le participe passé ne reste pas invariable car le COD est placé
      avant le verbe.'
  - si:
      contient:
      - o3
    relance: L'accord a été fait au féminin singulier, mais l'antécédent « les fautes » est au pluriel.
  - si:
      contient:
      - o4
    relance: L'accord a été fait au masculin pluriel, or l'antécédent « les fautes » est au féminin pluriel.
  solution: faites. C'est la forme correcte car le COD est le pronom relatif « que », qui a pour antécédent « les fautes »
    (féminin pluriel), placé avant le verbe avoir.
- id: nblm-quelle-est-la-forme-correcte-dans-la-phr-2
  type: choix
  difficulte: 2
  enonce: 'Quelle est la forme correcte dans la phrase : « La pièce de théâtre que j''ai... la semaine dernière était magnifique
    » ?'
  reponse:
    options:
    - id: o1
      texte: vue
    - id: o2
      texte: vu
    - id: o3
      texte: vues
    - id: o4
      texte: vus
    bonnes:
    - o1
  indices:
    relance: 'Pose-toi la question : qu''est-ce qui est vu, et ce COD est-il placé avant ou après le verbe ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le participe passé ne reste pas invariable ici, car il y a un COD (« que » / « la pièce ») placé avant l'auxiliaire
      avoir.
  - si:
      contient:
      - o3
    relance: L'accord a été fait au féminin pluriel, mais l'antécédent « la pièce de théâtre » est au singulier.
  - si:
      contient:
      - o4
    relance: L'accord a été fait au masculin pluriel, alors que « la pièce » est féminin singulier.
  solution: vue. Le COD est le pronom relatif « que », placé avant le verbe avoir, qui reprend l'antécédent féminin singulier
    « La pièce de théâtre ».
- id: nblm-avec-l-auxiliaire-avoir-dans-quel-cas-le-3
  type: choix
  difficulte: 2
  enonce: Avec l'auxiliaire avoir, dans quel cas le participe passé s'accorde-t-il ?
  reponse:
    options:
    - id: o1
      texte: Uniquement si le COD est placé avant le verbe.
    - id: o2
      texte: Toujours avec le sujet de la phrase.
    - id: o3
      texte: Quand le COD est placé juste après le verbe.
    - id: o4
      texte: Il reste toujours invariable avec l'auxiliaire avoir.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la position clé du complément d'objet direct par rapport au verbe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Accorder le participe passé avec le sujet est la règle pour l'auxiliaire être, pas pour l'auxiliaire avoir.
  - si:
      contient:
      - o3
    relance: Si le COD est placé après le verbe, le participe passé reste invariable.
  - si:
      contient:
      - o4
    relance: Le participe passé s'accorde s'il existe un COD placé avant le verbe.
  solution: 'Uniquement si le COD est placé avant le verbe. C''est la règle fondamentale avec l''auxiliaire avoir : l''accord
    se fait en genre et en nombre avec le COD seulement s''il est situé avant le verbe.'
- id: nblm-dans-la-phrase-j-ai-mange-des-pommes-ce-4
  type: choix
  difficulte: 2
  enonce: Dans la phrase « J'ai mangé des pommes ce matin », pourquoi le participe passé « mangé » reste-t-il invariable ?
  reponse:
    options:
    - id: o1
      texte: Parce que le COD (« des pommes ») est placé après le verbe.
    - id: o2
      texte: Parce qu'il n'y a aucun COD dans cette phrase.
    - id: o3
      texte: Parce que le sujet « J' » est au singulier.
    - id: o4
      texte: Parce que le verbe manger ne s'accorde jamais.
    bonnes:
    - o1
  indices:
    relance: Regarde où se trouve le complément « des pommes » par rapport au verbe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Il y a bien un COD (« des pommes »), mais il est situé après le verbe.
  - si:
      contient:
      - o3
    relance: Avec l'auxiliaire avoir, l'accord ne dépend jamais du sujet.
  - si:
      contient:
      - o4
    relance: 'Le participe du verbe manger s''accorderait si le COD était placé avant (par exemple : « les pommes que j''ai
      mangées »).'
  solution: Parce que le COD (« des pommes ») est placé après le verbe. Lorsque le COD est positionné après le verbe conjugué
    avec avoir, le participe passé ne s'accorde pas.
- id: nblm-dans-les-photos-que-tu-m-as-envoyees-que-5
  type: choix
  difficulte: 2
  enonce: Dans « Les photos que tu m'as envoyées », quelle est la fonction exacte du mot « que » qui explique l'accord du
    participe passé ?
  reponse:
    options:
    - id: o1
      texte: Pronom relatif, COD du verbe conjugué, placé avant lui.
    - id: o2
      texte: Sujet de la proposition subordonnée relative.
    - id: o3
      texte: Conjonction de subordination sans fonction grammaticale.
    - id: o4
      texte: Complément d'objet indirect (COI) placé avant le verbe.
    bonnes:
    - o1
  indices:
    relance: Analyse le rôle du pronom relatif dans la proposition subordonnée relative.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le sujet du verbe envoyer est le pronom « tu ». Le pronom « que » est COD.
  - si:
      contient:
      - o3
    relance: Ici « que » est un pronom relatif qui remplace « les photos », ce n'est pas une conjonction.
  - si:
      contient:
      - o4
    relance: On envoie quelque chose (directement), « que » est donc COD et non COI.
  solution: Pronom relatif, COD du verbe conjugué, placé avant lui. Le mot « que » est un pronom relatif ayant pour antécédent
    « les photos » ; il occupe la fonction de COD placé avant le verbe.
- id: nblm-quelles-sont-les-deux-phrases-correcteme-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux phrases correctement orthographiées selon la règle d'accord du participe passé avec avoir
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Les lettres que j'ai écrites sont arrivées hier.
    - id: o2
      texte: Elle a acheté des pommes au marché.
    - id: o3
      texte: Les fautes qu'il a fait ont été corrigées.
    - id: o4
      texte: J'ai vues les magnifiques peintures du musée.
    bonnes:
    - o1
    - o2
  indices:
    relance: Vérifie pour chaque phrase si le COD est avant ou après le verbe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Incorrect : le COD « qu'' » (antécédent « les fautes », féminin pluriel) est placé avant, il fallait écrire
      « faites ».'
  - si:
      contient:
      - o4
    relance: 'Incorrect : le COD « les magnifiques peintures » est placé après le verbe avoir, le participe devait rester
      invariable (« vu »).'
  solution: Les lettres que j'ai écrites sont arrivées hier ; Elle a acheté des pommes au marché. Le COD « que » (antécédent
    « les lettres », féminin pluriel) est placé avant le verbe avoir, donc l'accord « écrites » est correct.
- id: nblm-complete-le-participe-passe-du-verbe-app-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète le participe passé du verbe apprendre : « La leçon qu''ils ont [...] était difficile. »'
  reponse:
    acceptees:
    - apprise
    fautes_tolerees: 1
  indices:
    relance: Trouve l'antécédent du pronom relatif 'qu' et accorde le participe passé en conséquence.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'apprise. Le COD est le pronom relatif « qu'' », mis pour l''antécédent féminin singulier « La leçon », placé
    avant le verbe avoir. L''accord se fait donc au féminin singulier : apprise.'
- id: nblm-complete-le-participe-passe-du-verbe-per-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète le participe passé du verbe perdre : « Les clés qu''il a [...] sont introuvables. »'
  reponse:
    acceptees:
    - perdues
    fautes_tolerees: 1
  indices:
    relance: Détermine le genre et le nombre du nom 'clés' remplacé par le pronom relatif 'qu' placé avant le verbe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'perdues. Le COD est le pronom relatif « qu'' », qui reprend l''antécédent « Les clés » (féminin pluriel) et est
    situé avant le verbe avoir. L''accord est donc au féminin pluriel : perdues.'
