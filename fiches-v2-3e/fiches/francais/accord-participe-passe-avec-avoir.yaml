format: 2
notion: accord-participe-passe-avec-avoir
version: 1
etat: verifiee
declencheurs:
- les fautes que j'ai fait ou faites
- accorder avec le COD placé avant
- que j'ai vue ou vu
prerequis: []
essentiel: 'Avec l''auxiliaire avoir, le participe passé s''accorde avec le COD seulement si ce COD est placé AVANT

  le verbe. S''il est après ou s''il n''y a pas de COD, le participe passé reste invariable.


  Exemple : « J''ai mangé des pommes. » (COD après, invariable) mais « Les pommes que j''ai mangées. »

  (COD « que », qui reprend « les pommes », placé avant : accord au féminin pluriel).


  Cas très fréquent : le pronom relatif « que » est souvent COD placé avant le verbe. Il faut trouver

  son antécédent pour savoir avec quoi accorder.


  Méthode : cherche le COD, regarde s''il est avant ou après le verbe. S''il est avant, accorde le participe

  en genre et en nombre avec ce COD.

  '
methode:
- Repère l'auxiliaire avoir et le participe passé qui le suit.
- 'Cherche le COD du verbe : le verbe a-t-il un complément direct (sans préposition) ?'
- Si le COD est placé avant le verbe (souvent un pronom relatif « que » ou un pronom personnel), accorde le participe avec
  ce COD.
- Si le COD est après le verbe, ou s'il n'y a pas de COD, laisse le participe invariable.
vocabulaire:
- terme: COD antéposé
  definition: complément d'objet direct placé avant le verbe dans la phrase
- terme: invariable
  definition: qui ne change pas de forme selon le genre ou le nombre
erreurs_frequentes:
- Accorder le participe passé avec le sujet au lieu du COD placé avant.
- Oublier de chercher l'antécédent du pronom relatif « que » pour savoir avec quoi accorder.
- 'Accorder alors que le COD est placé après le verbe : dans ce cas, le participe reste invariable.'
exemple:
  enonce: 'Accorde correctement : « Les photos que j''ai (prendre) hier sont réussies. »'
  solution: '« que j''ai prises » : « que » reprend « les photos », féminin pluriel, et il est placé avant le verbe « ai pris
    ». Le participe s''accorde donc : prises.'
exercices:
- id: prises-ou-pris
  type: texte_court
  difficulte: 1
  enonce: 'Complète : « Voici les lettres que j''ai (écrire) ce matin. » (écris seulement le participe passé accordé)'
  reponse:
    acceptees:
    - écrites
    fautes_tolerees: 0
  indices:
    relance: 'Cherche l''antécédent du pronom « que » : quel mot reprend-il ?'
    methode: '« que » reprend « les lettres », féminin pluriel, et il est placé avant le verbe : le participe s''accorde.'
    etape: Le participe passé de « écrire » est « écrit ». Ajoute la marque du féminin pluriel.
  pieges:
  - si:
      valeur: écrit
    relance: 'As-tu bien cherché l''antécédent de « que » ? Il est féminin pluriel : le participe doit porter cette marque.'
  - si:
      valeur: écris
    relance: Ce n'est pas la bonne terminaison pour un participe passé. Pense au participe de « écrire » accordé au féminin
      pluriel.
  solution: '« que j''ai écrites » : « que » reprend « les lettres », féminin pluriel, placé avant le verbe.'
- id: vue-ou-vu
  type: choix
  difficulte: 1
  enonce: Quelle phrase est correctement accordée ?
  reponse:
    options:
    - id: a
      texte: La série que j'ai regardée m'a plu.
    - id: b
      texte: La série que j'ai regardé m'a plu.
    - id: c
      texte: J'ai regardée cette série hier soir.
    bonnes:
    - a
  indices:
    relance: Cherche l'antécédent du pronom « que » dans chaque phrase où il est présent.
    methode: '« que » reprend « la série », féminin singulier, placé avant le verbe : le participe doit porter la marque du
      féminin.'
    etape: 'Dans la phrase a, le participe est « regardée » : porte-t-il la marque du féminin ?'
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase oublie l'accord alors que le COD « que » (la série) est placé avant le verbe.
  - si:
      contient:
      - c
    relance: 'Ici, le COD « cette série » est placé après le verbe : le participe doit rester invariable, « regardé ».'
  solution: 'La phrase a est correcte : « que » reprend « la série », féminin singulier, placé avant le verbe, donc « regardée
    » s''accorde.'
- id: cod-avant-ou-apres
  type: choix
  difficulte: 2
  enonce: Dans « J'ai vu les erreurs que tu as commises. », pourquoi « commises » s'accorde-t-il ?
  reponse:
    options:
    - id: a
      texte: parce que le COD « que » (les erreurs) est placé avant le verbe « as commis »
    - id: b
      texte: parce que le sujet « tu » est féminin
    - id: c
      texte: parce que tous les participes passés avec avoir s'accordent
    bonnes:
    - a
  indices:
    relance: 'Cherche ce que « as commis » complète directement : qui reprend le COD dans cette proposition ?'
    methode: Le participe s'accorde avec le COD seulement s'il est placé avant le verbe. Vérifie où est le COD ici.
    etape: « que » reprend « les erreurs », féminin pluriel, et il est placé juste avant « as commises ».
  pieges:
  - si:
      contient:
      - b
    relance: Le participe passé avec avoir ne s'accorde jamais avec le sujet, seulement avec un COD placé avant.
  - si:
      contient:
      - c
    relance: 'C''est faux : avec avoir, le participe ne s''accorde que si le COD est placé avant le verbe.'
  solution: « commises » s'accorde car « que », qui reprend « les erreurs » (féminin pluriel), est le COD placé avant le verbe
    « as commis ».
- id: accorder-ouvert
  type: ouverte
  difficulte: 3
  enonce: Écris une phrase avec un pronom relatif « que » COD placé avant un verbe conjugué avec avoir, et accorde correctement
    le participe passé.
  criteres:
  - La phrase contient un pronom relatif « que » qui reprend un antécédent clair.
  - Le participe passé est correctement accordé en genre et en nombre avec cet antécédent.
  indices:
    relance: Pense à un antécédent féminin ou pluriel pour bien voir la marque d'accord à l'écrit.
    methode: Construis d'abord la proposition principale avec un nom, puis ajoute « que j'ai + participe ».
    etape: 'Par exemple : « Les chansons que j''ai... » puis choisis un verbe et accorde son participe.'
  solution: 'Exemple possible : « Les chansons que j''ai apprises sont belles. » « que » reprend « les chansons », féminin
    pluriel, placé avant le verbe : le participe « apprises » s''accorde.'
