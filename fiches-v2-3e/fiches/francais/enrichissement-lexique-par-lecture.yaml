# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: enrichissement-lexique-par-lecture
version: 1
etat: verifiee
declencheurs:
- mots de la même famille de sens
- classer des mots par intensité
- trouver un mot plus précis
- chercher un mot dans le dictionnaire
prerequis: []
essentiel: 'Le lexique, c''est l''ensemble des mots que tu connais et que tu sais utiliser.

  Pour l''enrichir, tu lis, tu cherches dans le dictionnaire, et tu ranges les mots par groupes.


  Un champ lexical réunit des mots liés à une même idée (la mer : vague, marée, embrun).

  Un champ sémantique réunit les différents sens d''un même mot (le mot « glace » : eau gelée, miroir, dessert).


  Les mots peuvent aussi se classer par degré : du plus faible au plus fort (tiède, chaud, brûlant),

  ou du plus général au plus précis (animal, mammifère, chat).


  Beaucoup de mots viennent du latin ou du grec. Un affixe (préfixe ou suffixe) et un étymon

  (mot d''origine, souvent latin ou grec) t''aident à deviner le sens d''un mot que tu ne connais pas.

  '
methode:
- Repère l'idée générale du mot ou du texte avant de chercher un synonyme plus précis.
- 'Pour classer des mots par intensité, imagine une échelle : du plus faible au plus fort.'
- Pour un mot inconnu, cherche s'il contient un préfixe ou un suffixe que tu connais déjà.
- Vérifie ton hypothèse de sens dans un dictionnaire, papier ou numérique.
vocabulaire:
- terme: champ lexical
  definition: ensemble de mots liés à une même idée ou un même thème
- terme: affixe
  definition: préfixe ou suffixe ajouté à un radical pour former un nouveau mot
erreurs_frequentes:
- Confondre champ lexical (mots liés à un thème) et champ sémantique (sens d'un même mot).
- Classer des mots d'intensité sans réfléchir à leur ordre logique.
- Croire qu'un préfixe a toujours le même sens dans tous les mots.
exemple:
  enonce: 'Range ces trois mots du plus faible au plus fort : « content », « ravi », « satisfait ».'
  solution: 'Du plus faible au plus fort : satisfait, content, ravi. « Satisfait » exprime un accord mesuré, « content » une
    joie simple, « ravi » une joie très intense.'
exercices:
- id: champ-lexical-mer
  type: choix
  difficulte: 1
  enonce: Lequel de ces mots appartient au champ lexical de la mer ?
  reponse:
    options:
    - id: a
      texte: embrun
    - id: b
      texte: clavier
    - id: c
      texte: pupitre
    - id: d
      texte: chaussure
    bonnes:
    - a
  indices:
    relance: Pense à ce que tu vois et sens au bord de l'eau, sur une plage ou un bateau.
    methode: 'Élimine d''abord les mots liés à l''école ou aux vêtements : ils n''ont rien à voir avec la mer.'
    etape: Un seul mot désigne une fine pluie d'eau salée soulevée par le vent sur la mer.
  pieges:
  - si:
      contient:
      - b
    relance: Un clavier sert à écrire sur un ordinateur, pas à décrire la mer. Cherche un mot lié à l'eau salée.
  - si:
      contient:
      - c
    relance: Un pupitre est un meuble d'école. Pense plutôt à ce que le vent soulève au-dessus des vagues.
  - si:
      contient:
      - d
    relance: Une chaussure se porte aux pieds. Cherche un mot qui parle du vent et de l'eau de mer.
  solution: 'Le mot « embrun » désigne les fines gouttelettes d''eau de mer soulevées par le vent : il appartient au champ
    lexical de la mer, contrairement aux trois autres mots.'
- id: intensite-froid
  type: ordre
  difficulte: 1
  enonce: Range ces trois mots du moins intense au plus intense pour parler du froid.
  reponse:
    elements:
    - id: a
      texte: frais
    - id: b
      texte: froid
    - id: c
      texte: glacial
  indices:
    relance: Un de ces mots décrit une brise agréable de printemps, un autre un vent d'hiver qui pique.
    methode: 'Imagine une échelle de température qui descend : commence par le mot le plus doux.'
    etape: Le mot le moins fort est celui qu'on emploie pour une soirée d'automne légèrement fraîche.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux mots voisins sur ton échelle sont inversés. Lequel des deux pique le plus la peau ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le mot le plus doux, puis celui qui décrit un froid extrême, et place le troisième entre les deux.
  solution: 'Du moins intense au plus intense : frais, froid, glacial. « Frais » évoque une fraîcheur légère, « froid » une
    sensation plus nette, « glacial » un froid extrême.'
- id: sens-affixe-extra
  type: texte_court
  difficulte: 2
  enonce: Dans le mot « extraordinaire », le préfixe « extra- » vient du latin. Que signifie-t-il littéralement ? Réponds
    par deux ou trois mots.
  reponse:
    acceptees:
    - en dehors de
    - hors de
    fautes_tolerees: 1
  indices:
    relance: Une chose « extraordinaire » sort de l'ordinaire, elle n'est pas dans la norme habituelle.
    methode: 'Pense à un autre mot avec ce préfixe, comme « extraterrestre » : quelqu''un venu d''où, par rapport à la Terre
      ?'
    etape: 'Ce préfixe indique une position, un lieu : au dehors, à l''extérieur de quelque chose.'
  pieges:
  - si:
      valeur: beaucoup
    relance: Ce n'est pas une idée de quantité, mais une idée de lieu, de position par rapport à quelque chose.
  solution: 'Le préfixe « extra- » signifie littéralement « en dehors de » : une chose extraordinaire sort de l''ordinaire,
    elle est hors de la norme.'
- id: degre-generalite
  type: association
  difficulte: 2
  enonce: Associe chaque mot à son niveau de généralité.
  reponse:
    gauche:
    - id: a
      texte: animal
    - id: b
      texte: mammifère
    - id: c
      texte: chat
    droite:
    - id: x
      texte: mot le plus général
    - id: y
      texte: mot de niveau intermédiaire
    - id: z
      texte: mot le plus précis
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Demande-toi lequel des trois mots pourrait désigner le plus grand nombre d'êtres vivants différents.
    methode: 'Classe les trois mots comme des cercles emboîtés : le plus large contient les deux autres.'
    etape: « Animal » regroupe énormément d'espèces ; « chat » n'en désigne qu'une seule.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère d'abord le mot le plus large, puis le plus précis.
  - si:
      diagnostic: associations_fausses
    relance: Range d'abord les trois mots du plus large au plus précis, puis relie-les à leur niveau.
  solution: '« Animal » est le mot le plus général, « mammifère » un niveau intermédiaire, « chat » le mot le plus précis
    : chaque mot est inclus dans le précédent.'
- id: nblm-quelle-est-la-definition-exacte-d-un-cha-1
  type: choix
  difficulte: 2
  enonce: Quelle est la définition exacte d'un champ lexical ?
  reponse:
    options:
    - id: o1
      texte: Un ensemble de mots liés à une même idée ou à un même thème.
    - id: o2
      texte: L'ensemble des différents sens qu'un seul et même mot peut avoir.
    - id: o3
      texte: Une liste de mots qui partagent exactement le même préfixe et le même radical.
    - id: o4
      texte: Un classement de mots ordonnés obligatoirement du plus général au plus précis.
    bonnes:
    - o1
  indices:
    relance: Pense au thème commun qui réunit différents mots dans un texte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, cela correspond à la définition du champ sémantique d'un mot polysémique.
  - si:
      contient:
      - o3
    relance: Il s'agit là d'une famille morphologique de mots dérivationnels, et non d'un champ lexical.
  - si:
      contient:
      - o4
    relance: C'est une confusion avec l'organisation du lexique par degré de généralité.
  solution: Un ensemble de mots liés à une même idée ou à un même thème. C'est la définition exacte du champ lexical, qui
    regroupe des mots se rapportant à une notion commune.
- id: nblm-si-tu-dois-classer-les-mots-content-ravi-2
  type: choix
  difficulte: 2
  enonce: Si tu dois classer les mots « content », « ravi » et « satisfait » du degré le plus faible au degré le plus fort
    d'intensité, quel est le bon ordre ?
  reponse:
    options:
    - id: o1
      texte: Satisfait, content, ravi
    - id: o2
      texte: Ravi, content, satisfait
    - id: o3
      texte: Content, satisfait, ravi
    - id: o4
      texte: Ravi, satisfait, content
    bonnes:
    - o1
  indices:
    relance: Imagine une échelle de joie allant de la plus mesurée à la plus vive.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est l'ordre inverse, allant du degré le plus fort au plus faible.
  - si:
      contient:
      - o3
    relance: 'C''est une erreur fréquente : ''satisfait'' exprime une nuance plus mesurée et faible que ''content''.'
  - si:
      contient:
      - o4
    relance: Cet ordre place à tort le terme le plus fort ('ravi') en première position.
  solution: 'Satisfait, content, ravi. C''est le bon ordre : ''satisfait'' exprime un accord mesuré, ''content'' une joie
    simple, et ''ravi'' une joie très intense.'
- id: nblm-dans-une-suite-de-mots-classes-du-plus-g-3
  type: choix
  difficulte: 2
  enonce: Dans une suite de mots classés du plus général au plus précis, où se situe le terme « mammifère » entre « animal
    » et « chat » ?
  reponse:
    options:
    - id: o1
      texte: C'est un terme intermédiaire, plus précis qu'« animal » mais plus général que « chat ».
    - id: o2
      texte: C'est le terme le plus général de toute la série.
    - id: o3
      texte: C'est le terme le plus précis de toute la série.
    - id: o4
      texte: C'est un synonyme exact et parfait du mot « chat ».
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'emboîtement des catégories, de la plus vaste à la plus restreinte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est faux, le terme le plus vaste et général de la série est 'animal'.
  - si:
      contient:
      - o3
    relance: C'est faux, le terme le plus spécifique et précis ici est 'chat'.
  - si:
      contient:
      - o4
    relance: 'C''est une erreur de sens : ''mammifère'' désigne une classe biologique entière, pas seulement le chat.'
  solution: C'est un terme intermédiaire, plus précis qu'« animal » mais plus général que « chat ». Exact, 'mammifère' est
    une catégorie plus restreinte qu'animal, mais englobe la catégorie plus spécifique des chats.
- id: nblm-que-dois-tu-faire-pour-verifier-une-hypo-4
  type: choix
  difficulte: 2
  enonce: Que dois-tu faire pour vérifier une hypothèse sur le sens d'un mot inconnu rencontré lors d'une lecture ?
  reponse:
    options:
    - id: o1
      texte: Vérifier l'hypothèse de sens dans un dictionnaire, papier ou numérique.
    - id: o2
      texte: Deviner le sens au hasard sans jamais vérifier sa définition.
    - id: o3
      texte: Sauter systématiquement le mot inconnu sans chercher à le comprendre.
    - id: o4
      texte: Changer la terminaison du mot pour le transformer en verbe.
    bonnes:
    - o1
  indices:
    relance: Pense au réflexe à avoir avec l'outil de référence de la langue française.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Se fier uniquement au hasard sans vérifier expose à des erreurs de compréhension.
  - si:
      contient:
      - o3
    relance: Ignorer les mots inconnus empêche d'enrichir son vocabulaire au fil des lectures.
  - si:
      contient:
      - o4
    relance: Modifier la catégorie grammaticale ne donne pas la définition du mot.
  solution: Vérifier l'hypothèse de sens dans un dictionnaire, papier ou numérique. C'est la méthode préconisée pour confirmer
    ou corriger l'idée que l'on s'est faite du mot.
- id: nblm-sur-quel-element-de-formation-du-mot-peu-5
  type: choix
  difficulte: 2
  enonce: Sur quel élément de formation du mot peux-tu t'appuyer pour deviner le sens d'un mot inconnu avant de chercher dans
    le dictionnaire ?
  reponse:
    options:
    - id: o1
      texte: Sur la présence d'un affixe (préfixe ou suffixe) ou d'un étymon connu.
    - id: o2
      texte: Uniquement sur le nombre total de lettres qui composent le mot.
    - id: o3
      texte: Sur la présence d'une majuscule en début de mot.
    - id: o4
      texte: Sur la position des voyelles dans le mot.
    bonnes:
    - o1
  indices:
    relance: Observe la structure interne du mot (début, fin, racine).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La longueur d'un mot ne donne aucune indication sur sa signification.
  - si:
      contient:
      - o3
    relance: Une majuscule indique un nom propre ou un début de phrase, pas le sens du mot.
  - si:
      contient:
      - o4
    relance: L'emplacement des voyelles est une caractéristique orthographique, pas sémantique.
  solution: Sur la présence d'un affixe (préfixe ou suffixe) ou d'un étymon connu. Identifier les préfixes, suffixes ou racines
    d'origine (grecque ou latine) permet de déduire le sens.
- id: nblm-par-quels-moyens-un-eleve-de-3e-enrichit-6
  type: choix
  difficulte: 3
  enonce: Par quels moyens un élève de 3e enrichit-il et structure-t-il son lexique selon les programmes officiels ? (Sélectionne
    les 2 bonnes réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Par la lecture de textes et l'usage régulier du dictionnaire.
    - id: o2
      texte: En mettant les mots en réseau (champs lexicaux, classements par degré d'intensité).
    - id: o3
      texte: En recopiant intégralement le dictionnaire sans jamais lire de livres.
    - id: o4
      texte: En s'interdisant d'utiliser des mots nouveaux dans ses productions écrites.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les activités actives qui lient la découverte des mots à leur organisation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: La copie passive ne constitue pas un apprentissage vivant et contextualisé du lexique.
  - si:
      contient:
      - o4
    relance: Les programmes demandent au contraire de réinvestir le lexique appris à l'écrit et à l'oral.
  solution: Par la lecture de textes et l'usage régulier du dictionnaire ; En mettant les mots en réseau (champs lexicaux,
    classements par degré d'intensité). La lecture régulière associée à la consultation du dictionnaire est la base de l'enrichissement
    lexical.
- id: nblm-comment-appelle-t-on-l-ensemble-des-mots-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'ensemble des mots qui se rapportent à une même idée ou un même thème dans un texte ?
  reponse:
    acceptees:
    - champ lexical
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'un terme composé de deux mots désignant ce groupe de mots.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: champ lexical. Le champ lexical regroupe tous les mots associés à une même notion ou à un thème commun.
- id: nblm-quel-terme-designe-un-prefixe-ou-un-suff-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne un préfixe ou un suffixe que l'on ajoute à un radical pour former un nouveau mot ?
  reponse:
    acceptees:
    - affixe
    fautes_tolerees: 1
  indices:
    relance: Mot masculin désignant cet élément qu'on ajoute au radical.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: affixe. L'affixe est le terme générique qui regroupe les préfixes (placés avant) et les suffixes (placés après).
