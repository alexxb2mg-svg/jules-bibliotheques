format: 2
notion: formation-des-mots
version: 2
etat: verifiee
declencheurs:
- mot formé avec un préfixe et un suffixe
- deux mots assemblés en un seul
- changement de nature entre déménager et déménagement
- mot venu d'un mot grec ou latin
- radical préfixe suffixe
- création d'un mot nouveau
- mot composé avec trait d'union
- origine d'un mot
prerequis: []
essentiel: 'Les mots se forment de plusieurs façons.


  La dérivation ajoute un préfixe (avant le radical) ou un suffixe (après) : « heureux » donne « malheureux » (préfixe mal-)
  et « heureusement » (suffixe -ment). Le radical est la partie centrale qui porte le sens de base.


  La composition assemble des mots déjà existants : « porte-monnaie », « grand-mère », « tournevis », « chou-fleur ». Il y
  a parfois un trait d''union, parfois non (« tournevis »).


  L''étymologie étudie l''origine des mots. Beaucoup viennent du latin ou du grec : « photographie » = « phôs » (lumière)
  + « graphein » (écrire). Certains mots sont empruntés à d''autres langues : « football » (anglais), « bazar » (persan, par
  le turc).


  La néologie est la création d''un mot nouveau : par dérivation (« googliser »), par composition, par emprunt, ou par abréviation
  (« ordi »). Un mot nouveau peut entrer dans le dictionnaire s''il s''installe dans l''usage.


  Une locution est un groupe de mots figé qui joue le rôle d''un seul mot : « pomme de terre », « tout à coup », « afin que
  ».


  La dérivation peut changer la catégorie grammaticale : le verbe « déménager » donne le nom « déménagement » (-ment) ; l''adjectif
  « beau » donne le nom « beauté » (-té) ; l''adjectif « lent » donne l''adverbe « lentement ».


  Ce changement a des conséquences sur l''orthographe : « beau » devient « beauté » (la finale change), et « déménager » garde
  son « e » devant -ment dans « déménagement » (pour garder le son [ʒ]).


  Au brevet, on attend que tu analyses un mot (radical, affixes, catégorie) et que tu expliques son sens à partir de sa formation.

  '
methode:
- Repère d'abord le radical du mot, puis identifie le ou les préfixes et suffixes ajoutés.
- Pour la composition, cherche si le mot est fait de plusieurs mots déjà existants, reliés ou non par un trait d'union.
- Pour un mot savant, cherche un élément grec ou latin connu (bio-, télé-, -logie, -phone...) et traduis chaque élément.
- Compare la catégorie du mot de départ et celle du mot obtenu pour repérer un changement de nature.
- Pour la néologie ou l'emprunt, demande-toi si le mot est récent ou vient d'une autre langue.
- 'Vérifie l''orthographe du mot dérivé : ce qui change à l''écrit (beau / beauté, déménager / déménagement).'
vocabulaire:
- terme: radical
  definition: partie d'un mot qui porte le sens de base et à laquelle on ajoute des affixes
- terme: dérivation
  definition: formation d'un mot par ajout d'un préfixe ou d'un suffixe à un radical
- terme: composition
  definition: formation d'un mot par assemblage de plusieurs mots déjà existants
- terme: étymologie
  definition: étude de l'origine et de l'histoire des mots
- terme: néologie
  definition: création d'un mot nouveau ou d'un nouveau sens pour un mot
- terme: emprunt
  definition: mot pris à une autre langue et intégré à la nôtre
- terme: locution
  definition: groupe de mots figé qui fonctionne comme un seul mot
- terme: catégorie grammaticale
  definition: nature d'un mot (nom, verbe, adjectif, adverbe...)
erreurs_frequentes:
- Confondre dérivation (ajout d'affixes à un radical) et composition (assemblage de mots existants).
- Oublier qu'un suffixe peut changer la catégorie grammaticale d'un mot (verbe devenant nom, par exemple).
- Croire qu'un préfixe ou un suffixe a toujours le même sens, quel que soit le mot.
- Croire qu'un mot composé s'écrit toujours avec un trait d'union.
- Oublier les changements d'orthographe dus à la dérivation (beau / beauté).
exemple:
  enonce: Le mot « malheureusement » est-il formé par dérivation ou par composition ? Justifie.
  solution: 'Il est formé par dérivation : on ajoute le préfixe « mal- » et le suffixe « -ment » au radical « heureux », sans
    assembler plusieurs mots existants.'
exercices:
- id: derivation-ou-composition
  type: choix
  difficulte: 1
  enonce: Le mot « tournevis » est-il formé par dérivation ou par composition ?
  reponse:
    options:
    - id: a
      texte: par composition
    - id: b
      texte: par dérivation
    bonnes:
    - a
  indices:
    relance: Regarde si le mot est fait d'un seul radical avec des affixes, ou de deux mots déjà existants assemblés.
    methode: « Tourne » et « vis » sont deux mots qui existent déjà seuls dans la langue.
    etape: « Tournevis » assemble le verbe « tourner » et le nom « vis », deux mots déjà existants.
  pieges:
  - si:
      contient:
      - b
    relance: 'La dérivation ajoute un préfixe ou un suffixe à un seul radical. Ici, deux mots complets (« tourne » et « vis
      ») sont assemblés : c''est de la composition.'
  solution: '« Tournevis » est formé par composition : il assemble le verbe « tourner » (sous la forme « tourne ») et le nom
    « vis », deux mots déjà existants.'
- id: sens-prefixe-mal
  type: texte_court
  difficulte: 1
  enonce: Quel préfixe faut-il ajouter à « heureux » pour obtenir le contraire, « malheureux » ? Réponds par le préfixe seul.
  reponse:
    acceptees:
    - mal-
    - mal
    fautes_tolerees: 1
  indices:
    relance: Ce préfixe exprime souvent le contraire ou une idée négative.
    methode: Pense à d'autres mots qui expriment le contraire grâce au même préfixe, comme « malchance » ou « malhonnête ».
    etape: Le préfixe compte trois lettres et commence par « m ».
  pieges:
  - si:
      valeur: in
    relance: Ce préfixe donne aussi le contraire dans d'autres mots (« injuste »), mais pas dans « malheureux ». Cherche le
      bon préfixe.
  solution: 'Le préfixe « mal- » donne le contraire de « heureux » : « malheureux ».'
- id: changement-categorie
  type: association
  difficulte: 2
  enonce: Associe chaque mot dérivé à sa catégorie grammaticale.
  reponse:
    gauche:
    - id: a
      texte: déménagement
    - id: b
      texte: déménager
    - id: c
      texte: beauté
    droite:
    - id: x
      texte: nom
    - id: y
      texte: verbe
    paires:
      a: x
      b: y
      c: x
  indices:
    relance: Demande-toi si le mot peut se conjuguer (verbe) ou s'il est précédé d'un déterminant (nom).
    methode: « -ment » et « -té » sont des suffixes qui forment souvent des noms à partir d'un verbe ou d'un adjectif.
    etape: '« Déménager » se conjugue (je déménage, il déménageait) : c''est un verbe.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à ce que chaque suffixe (-ment, -té) forme habituellement.
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par le mot qui se conjugue : c''est le seul verbe des trois.'
  solution: '« Déménagement » et « beauté » sont des noms, « déménager » est un verbe : les suffixes « -ment » et « -té »
    forment ici des noms à partir d''un verbe et d''un adjectif.'
- id: suffixe-adjectif-en-nom
  type: texte_court
  difficulte: 2
  enonce: Quel suffixe permet de former le nom « lenteur » à partir de l'adjectif « lent » ? Réponds par le suffixe seul.
  reponse:
    acceptees:
    - -eur
    - eur
    fautes_tolerees: 0
  indices:
    relance: 'Compare « lent » et « lenteur » : que faut-il ajouter à la fin du mot ?'
    methode: Ce suffixe forme aussi « grandeur », « douceur » ou « chaleur » à partir d'adjectifs.
    etape: Le suffixe a trois lettres et se termine par « r ».
  pieges:
  - si:
      valeur: -té
    relance: Le suffixe « -té » forme « beauté », mais « lentté » n'existe pas. Compare avec « grandeur » ou « douceur ».
  solution: '« lent » + « -eur » = « lenteur » : le suffixe transforme un adjectif en nom.'
- id: mot-compose-ou-derive
  type: association
  difficulte: 2
  enonce: Associe chaque mot à son mode de formation.
  reponse:
    gauche:
    - id: a
      texte: porte-monnaie
    - id: b
      texte: déloyal
    - id: c
      texte: football
    droite:
    - id: x
      texte: composition
    - id: y
      texte: dérivation
    - id: z
      texte: emprunt à l'anglais
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Cherche d'abord si le mot contient deux mots complets, puis s'il contient un préfixe ou un suffixe.
    methode: « Déloyal » contient un radical et un préfixe. « Porte-monnaie » contient deux mots. Le dernier est arrivé d'une
      autre langue.
    etape: « football » se prononce à l'anglaise, et le sport est né au Royaume-Uni. Place-le, puis relie les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revois si le mot contient deux mots entiers, un préfixe, ou aucun des deux.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le mot qui contient deux mots entiers reliés par un trait d'union.
  solution: « porte-monnaie » = verbe « porte » + nom « monnaie » (composition) ; « déloyal » = préfixe dé- + radical « loyal
    » (dérivation) ; « football » est emprunté à l'anglais.
- id: origine-grecque
  type: choix
  difficulte: 2
  enonce: Le mot « télévision » associe l'élément grec « télé- » et le latin « vision ». Que signifie « télé- » ?
  reponse:
    options:
    - id: a
      texte: loin
    - id: b
      texte: image
    - id: c
      texte: écran
    - id: d
      texte: voir
    bonnes:
    - a
  indices:
    relance: 'Compare « téléphone », « télécommande » et « téléphérique » : que ces mots ont-ils en commun ?'
    methode: 'Une télécommande agit sans que tu touches l''appareil : à quelle distance ?'
    etape: « Vision » signifie déjà « action de voir ». Il reste à trouver le sens de « télé- » dans cette expression.
  pieges:
  - si:
      contient:
      - d
    relance: « Voir » est le sens de « vision », l'autre élément du mot. Cherche le sens de « télé- ».
  - si:
      contient:
      - b
    relance: 'Une image est ce qu''on voit à l''écran, pas le sens de « télé- ». Pense à « téléphone » : une voix qui va à
      quelle distance ?'
  - si:
      contient:
      - c
    relance: Un écran est un objet. « Télé- » exprime une idée de distance, comme dans « téléphone ».
  solution: '« télé- » vient du grec et signifie « loin » : la télévision, c''est « voir de loin ».'
- id: expliquer-etymon
  type: ouverte
  difficulte: 3
  enonce: Le mot « téléphone » vient du grec « têle » (loin) et « phônê » (son, voix). Explique en quelques phrases comment
    ces deux éléments grecs expliquent le sens du mot français, puis donne un autre mot formé avec « télé- ».
  criteres:
  - L'élève relie « têle » (loin) et « phônê » (voix, son) au sens global du mot « téléphone ».
  - L'élève montre que le sens du mot français vient directement de l'assemblage des deux éléments grecs.
  - L'élève donne un autre mot formé avec « télé- » (télévision, télécommande, télescope...) en expliquant le sens de l'élément.
  indices:
    relance: Que permet de faire un téléphone, en lien avec la distance et la voix ?
    methode: Relie le sens de chaque élément grec (loin, voix) à ce que fait vraiment un téléphone.
    etape: Tu peux commencer par « Le mot téléphone signifie littéralement... ».
  solution: 'Le mot « téléphone » signifie littéralement « voix de loin » : « têle » (loin) et « phônê » (voix, son) s''assemblent
    pour décrire un appareil qui transmet la voix à distance. Autre mot : « télévision », où « télé- » veut aussi dire « loin
    ».'
