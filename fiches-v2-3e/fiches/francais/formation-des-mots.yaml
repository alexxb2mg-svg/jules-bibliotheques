# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: formation-des-mots
version: 1
etat: verifiee
declencheurs:
- mot formé avec un préfixe et un suffixe
- deux mots assemblés en un seul
- changement de nature entre déménager et déménagement
- mot venu d'un mot grec ou latin
prerequis: []
essentiel: 'Les mots se forment de plusieurs façons.


  La dérivation ajoute un préfixe ou un suffixe à un radical : « heureux » donne « malheureux » (préfixe

  « mal- ») ou « heureusement » (suffixe « -ment »).


  La composition assemble plusieurs mots déjà existants pour en former un nouveau : « porte-monnaie »,

  « grand-mère », « tournevis ».


  Beaucoup de mots viennent d''un étymon latin ou grec : « photographie » vient du grec « phôs » (lumière)

  et « graphein » (écrire).


  La dérivation peut changer la catégorie grammaticale d''un mot : le verbe « déménager » donne le nom

  « déménagement » (suffixe « -ment »), l''adjectif « beau » donne le nom « beauté » (suffixe « -té »).

  Ce changement de catégorie a souvent des conséquences sur l''orthographe du mot.

  '
methode:
- Repère d'abord le radical du mot, puis identifie le ou les préfixes et suffixes ajoutés.
- Pour la composition, cherche si le mot est formé de plusieurs mots déjà existants, reliés ou non par un trait d'union.
- Pour un mot savant, cherche s'il contient un élément grec ou latin connu (bio-, phono-, -logie...).
- Pour repérer un changement de catégorie, compare la nature du mot de départ et celle du mot obtenu après dérivation.
vocabulaire:
- terme: dérivation
  definition: formation d'un mot par ajout d'un préfixe ou d'un suffixe à un radical
- terme: composition
  definition: formation d'un mot par assemblage de plusieurs mots déjà existants
erreurs_frequentes:
- Confondre dérivation (ajout d'affixes à un radical) et composition (assemblage de mots existants).
- Oublier qu'un suffixe peut changer la catégorie grammaticale d'un mot (verbe devenant nom, par exemple).
- Croire qu'un préfixe ou un suffixe a toujours le même sens, quel que soit le mot.
exemple:
  enonce: Le mot « malheureusement » est-il formé par dérivation ou par composition ? Justifie.
  solution: 'Il est formé par dérivation : on ajoute le préfixe « mal- » et le suffixe « -ment » au radical « heureux », sans
    assembler plusieurs mots existants.'
exercices:
- id: derivation-ou-composition
  type: choix
  difficulte: 1
  enonce: Le mot « tournevis » est-il formé par dérivation ou par composition ?
  reponse:
    options:
    - id: a
      texte: par composition
    - id: b
      texte: par dérivation
    bonnes:
    - a
  indices:
    relance: Regarde si le mot est fait d'un seul radical avec des affixes, ou de deux mots déjà existants assemblés.
    methode: « Tourne » et « vis » sont deux mots qui existent déjà seuls dans la langue.
    etape: « Tournevis » assemble le verbe « tourner » et le nom « vis », deux mots déjà existants.
  pieges:
  - si:
      contient:
      - b
    relance: 'La dérivation ajoute un préfixe ou un suffixe à un seul radical. Ici, deux mots complets (« tourne » et « vis
      ») sont assemblés : c''est de la composition.'
  solution: '« Tournevis » est formé par composition : il assemble le verbe « tourner » (sous la forme « tourne ») et le nom
    « vis », deux mots déjà existants.'
- id: sens-prefixe-mal
  type: texte_court
  difficulte: 1
  enonce: Quel préfixe faut-il ajouter à « heureux » pour obtenir le contraire, « malheureux » ? Réponds par le préfixe seul.
  reponse:
    acceptees:
    - mal-
    - mal
    fautes_tolerees: 1
  indices:
    relance: Ce préfixe exprime souvent le contraire ou une idée négative.
    methode: Pense à d'autres mots qui expriment le contraire grâce au même préfixe, comme « malchance » ou « malhonnête ».
    etape: Le préfixe compte trois lettres et commence par « m ».
  pieges:
  - si:
      valeur: in
    relance: Ce préfixe donne aussi le contraire dans d'autres mots (« injuste »), mais pas dans « malheureux ». Cherche le
      bon préfixe.
  solution: 'Le préfixe « mal- » donne le contraire de « heureux » : « malheureux ».'
- id: changement-categorie
  type: association
  difficulte: 2
  enonce: Associe chaque mot dérivé à sa catégorie grammaticale.
  reponse:
    gauche:
    - id: a
      texte: déménagement
    - id: b
      texte: déménager
    - id: c
      texte: beauté
    droite:
    - id: x
      texte: nom
    - id: y
      texte: verbe
    paires:
      a: x
      b: y
      c: x
  indices:
    relance: Demande-toi si le mot peut se conjuguer (verbe) ou s'il est précédé d'un déterminant (nom).
    methode: « -ment » et « -té » sont des suffixes qui forment souvent des noms à partir d'un verbe ou d'un adjectif.
    etape: '« Déménager » se conjugue (je déménage, il déménageait) : c''est un verbe.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à ce que chaque suffixe (-ment, -té) forme habituellement.
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par le mot qui se conjugue : c''est le seul verbe des trois.'
  solution: '« Déménagement » et « beauté » sont des noms, « déménager » est un verbe : les suffixes « -ment » et « -té »
    forment ici des noms à partir d''un verbe et d''un adjectif.'
- id: expliquer-etymon
  type: ouverte
  difficulte: 3
  enonce: Le mot « téléphone » vient du grec « têle » (loin) et « phônê » (son, voix). Explique en une phrase comment ces
    deux éléments grecs expliquent le sens du mot français.
  criteres:
  - L'élève relie « têle » (loin) et « phônê » (voix, son) au sens global du mot « téléphone ».
  - L'élève montre que le sens du mot français vient directement de l'assemblage des deux éléments grecs.
  indices:
    relance: Que permet de faire un téléphone, en lien avec la distance et la voix ?
    methode: Relie le sens de chaque élément grec (loin, voix) à ce que fait vraiment un téléphone.
    etape: Tu peux commencer par « Le mot téléphone signifie littéralement... ».
  solution: 'Le mot « téléphone » signifie littéralement « voix de loin » : « têle » (loin) et « phônê » (voix, son) s''assemblent
    pour décrire un appareil qui transmet la voix à distance.'
- id: nblm-comment-est-forme-le-mot-malheureusement-1
  type: choix
  difficulte: 2
  enonce: Comment est formé le mot « malheureusement » d'après les règles de la dérivation ?
  reponse:
    options:
    - id: o1
      texte: Par dérivation, en ajoutant le préfixe « mal- » et le suffixe « -ment » au radical « heureux ».
    - id: o2
      texte: Par composition, en associant les deux mots autonomes « malheurs » et « heureusement ».
    - id: o3
      texte: Par conversion directe d'un adjectif en adverbe sans ajouter le moindre affixe.
    - id: o4
      texte: Par emprunt savant directement au grec ancien sans modification du mot.
    bonnes:
    - o1
  indices:
    relance: Observe attentivement les éléments ajoutés avant et après le radical « heureux ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la composition assemble deux mots autonomes, alors qu''ici ce sont des affixes greffés sur
      un même radical.'
  - si:
      contient:
      - o3
    relance: 'Faux : le mot contient bien deux affixes identifiables (« mal- » et « -ment »).'
  - si:
      contient:
      - o4
    relance: 'Faux : « heureusement » est formé sur un radical français par dérivation grammaticale.'
  solution: 'Par dérivation, en ajoutant le préfixe « mal- » et le suffixe « -ment » au radical « heureux ». C''est exact
    : on associe à la fois un préfixe (« mal- ») et un suffixe (« -ment ») au radical « heureux ».'
- id: nblm-par-quel-procede-de-formation-le-mot-por-2
  type: choix
  difficulte: 2
  enonce: Par quel procédé de formation le mot « porte-monnaie » est-il créé ?
  reponse:
    options:
    - id: o1
      texte: Par composition, en assemblant deux mots déjà existants (« porte » et « monnaie »).
    - id: o2
      texte: Par dérivation préfixale, grâce à l'ajout du préfixe « porte- » devant le nom.
    - id: o3
      texte: Par dérivation suffixale, en ajoutant le suffixe « -monnaie » au radical.
    - id: o4
      texte: Par emprunt savant à une racine grecque.
    bonnes:
    - o1
  indices:
    relance: Demande-toi si les deux éléments constituent déjà des mots autonomes dans la langue.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : « porte » provient du verbe porter ; il s''agit d''un mot autonome et non d''un préfixe.'
  - si:
      contient:
      - o3
    relance: 'Faux : « monnaie » est un nom autonome, pas un suffixe grammatical.'
  - si:
      contient:
      - o4
    relance: 'Faux : « porte-monnaie » réunit deux mots français ordinaires.'
  solution: 'Par composition, en assemblant deux mots déjà existants (« porte » et « monnaie »). C''est exact : la composition
    assemble des mots autonomes déjà existants dans la langue.'
- id: nblm-quel-changement-s-opere-lorsque-l-on-pas-3
  type: choix
  difficulte: 2
  enonce: Quel changement s'opère lorsque l'on passe du verbe « déménager » au nom « déménagement » ?
  reponse:
    options:
    - id: o1
      texte: La dérivation par le suffixe « -ment » change la catégorie grammaticale du verbe en nom.
    - id: o2
      texte: La composition modifie le sens du mot sans altérer sa classe grammaticale.
    - id: o3
      texte: L'ajout du préfixe « dé- » transforme un adjectif en verbe.
    - id: o4
      texte: Il s'agit d'une simple variation orthographique sans changement de nature.
    bonnes:
    - o1
  indices:
    relance: Compare la classe grammaticale (nature) du mot d'origine et du mot final.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : c''est une dérivation par suffixe (et non une composition), et la classe grammaticale change.'
  - si:
      contient:
      - o3
    relance: 'Faux : le préfixe « dé- » figurait déjà dans « déménager » ; le changement vient du suffixe « -ment ».'
  - si:
      contient:
      - o4
    relance: 'Faux : « déménager » est un verbe alors que « déménagement » est un nom.'
  solution: 'La dérivation par le suffixe « -ment » change la catégorie grammaticale du verbe en nom. Exact : le suffixe «
    -ment » permet de transformer le verbe « déménager » en un nom commun.'
- id: nblm-quelle-est-l-origine-de-la-formation-sav-4
  type: choix
  difficulte: 2
  enonce: Quelle est l'origine de la formation savante du mot « photographie » ?
  reponse:
    options:
    - id: o1
      texte: 'Il est formé à partir de deux étymons grecs : « phôs » (lumière) et « graphein » (écrire).'
    - id: o2
      texte: Il est formé par la composition de deux mots de la langue française courante.
    - id: o3
      texte: Il est créé par l'ajout du préfixe latin « photo- » sur un radical français.
    - id: o4
      texte: Il est formé par dérivation suffixale pure à partir de l'abréviation « photo ».
    bonnes:
    - o1
  indices:
    relance: Pense aux racines anciennes qui signifient « lumière » et « écrire ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : « photo » et « graphie » sont issus de racines savantes grecques.'
  - si:
      contient:
      - o3
    relance: 'Faux : l''élément « photo- » vient du grec et non du latin.'
  - si:
      contient:
      - o4
    relance: 'Faux : « photo » est une apocope moderne de « photographie », pas son radical historique.'
  solution: 'Il est formé à partir de deux étymons grecs : « phôs » (lumière) et « graphein » (écrire). Exact : la formation
    savante associe les deux racines grecques « phôs » et « graphein ».'
- id: nblm-pourquoi-le-mot-immangeable-prend-il-deu-5
  type: choix
  difficulte: 2
  enonce: Pourquoi le mot « immangeable » prend-il deux « m » lors de sa formation par dérivation ?
  reponse:
    options:
    - id: o1
      texte: Le préfixe négatif « in- » se transforme en « im- » devant le « m » du radical « mangeable ».
    - id: o2
      texte: Le radical « mangeable » redouble systématiquement sa première lettre lors de toute dérivation.
    - id: o3
      texte: C'est un mot composé de deux mots autonomes « im » et « mangeable ».
    - id: o4
      texte: Le suffixe « im- » placé au début du mot impose une consonne double.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la règle d'orthographe du préfixe de négation « in- » devant m, b, p.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : le radical ne change pas de lui-même, c''est le préfixe « in- » qui varie selon la consonne suivante.'
  - si:
      contient:
      - o3
    relance: 'Faux : « im- » est un préfixe (affixe) et non un mot autonome.'
  - si:
      contient:
      - o4
    relance: 'Faux : un affixe situé en début de mot est un préfixe, pas un suffixe.'
  solution: 'Le préfixe négatif « in- » se transforme en « im- » devant le « m » du radical « mangeable ». Exact : le préfixe
    « in- » s''orthographie « im- » devant m, b, p, ce qui produit « im- » + « mangeable ».'
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant la dérivation et la composition des mots ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: La dérivation consiste à ajouter un préfixe ou un suffixe à un radical.
    - id: o2
      texte: La composition assemble plusieurs mots autonomes déjà existants dans la langue.
    - id: o3
      texte: La dérivation ne peut jamais modifier la catégorie grammaticale du mot de départ.
    - id: o4
      texte: La composition exige obligatoirement la présence d'un trait d'union entre les mots.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux définitions fondamentales des affixes et de l'assemblage de mots.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : l''ajout d''un suffixe peut changer la classe grammaticale (ex. : un verbe devient un nom).'
  - si:
      contient:
      - o4
    relance: 'Faux : certains mots composés ne comportent pas de trait d''union.'
  solution: 'La dérivation consiste à ajouter un préfixe ou un suffixe à un radical ; La composition assemble plusieurs mots
    autonomes déjà existants dans la langue. Exact : la dérivation crée un mot nouveau en ajoutant des affixes à un radical.'
- id: nblm-quel-terme-designe-la-formation-d-un-mot-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne la formation d'un mot par l'assemblage de deux mots autonomes existants, comme dans « tournevis
    » ?
  reponse:
    acceptees:
    - composition
    fautes_tolerees: 1
  indices:
    relance: C'est le nom de l'opération où l'on réunit deux mots existants.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: composition. La composition est bien le procédé qui assemble plusieurs mots autonomes déjà existants.
- id: nblm-comment-appelle-t-on-l-element-place-ava-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'élément placé avant le radical d'un mot pour en modifier le sens, comme « mal- » dans « malheureux
    » ?
  reponse:
    acceptees:
    - préfixe
    fautes_tolerees: 1
  indices:
    relance: Ce terme grammatical commence par un élément qui signifie « avant ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: préfixe. Un préfixe est un affixe placé au début du radical pour en modifier le sens.
