- id: nblm-comment-appelle-t-on-l-element-place-ava-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'élément placé avant le radical d'un mot pour en modifier le sens, comme « mal- » dans « malheureux
    » ?
  reponse:
    acceptees:
    - préfixe
    fautes_tolerees: 1
  indices:
    relance: Ce terme grammatical commence par un élément qui signifie « avant ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: préfixe. Un préfixe est un affixe placé au début du radical pour en modifier le sens.
    pour décrire un appareil qui transmet la voix à distance. Autre mot : « télévision », où « télé- » veut aussi dire « loin
    ».'
