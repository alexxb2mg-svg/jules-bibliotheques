# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: corpus-se-raconter
version: 2
etat: verifiee
declencheurs:
- groupement de textes sur soi
- autoportrait en peinture
- lecture cursive autobiographie
- livre où l'auteur raconte sa vie
- roman inspiré de la vie de l'auteur
- journal intime et lettres
- se représenter en photographie
- comparer des textes sur soi
prerequis:
- ecriture-de-soi-autoportrait
essentiel: 'Se raconter, se représenter : c''est le questionnement de 3e sur les façons de parler de soi. Un corpus de référence
  est un ensemble de textes, ou de textes et d''images, réunis pour être étudiés ensemble.


  On peut lire une œuvre entière (lecture intégrale) : une autobiographie ou un roman autobiographique. Ou bien un groupement
  d''extraits d''époques et de genres différents.


  Les formes à connaître :

  - L''autobiographie : un auteur raconte sa propre vie. Auteur, narrateur et personnage principal sont la même personne («
  pacte autobiographique », Philippe Lejeune). Exemple : Les Confessions de Rousseau (XVIIIe siècle).

  - Les mémoires : un auteur raconte surtout les événements publics qu''il a vécus. Exemple : Mémoires d''outre-tombe de Chateaubriand
  (XIXe siècle).

  - Le roman autobiographique : une fiction inspirée de la vie de l''auteur, où le personnage porte souvent un autre nom.
  Exemple : Le Premier Homme de Camus.

  - L''essai : une réflexion personnelle où l''auteur se dépeint aussi. Exemple : les Essais de Montaigne (XVIe siècle).

  - Le journal intime : des notes datées, écrites au jour le jour. Exemple : le Journal d''Anne Frank.

  - La correspondance : des lettres adressées à quelqu''un. Exemple : les lettres de Madame de Sévigné (XVIIe siècle).


  Le groupement peut aussi comprendre l''autoportrait dans d''autres arts : peinture (Rembrandt, Van Gogh), photographie,
  images animées. L''artiste se représente lui-même : regard, posture, objets, cadre.


  Comparer les œuvres permet de voir ce qui est commun (dire « je », chercher une vérité sur soi) et ce qui change (époque,
  forme, sincérité, mise en scène).


  Au brevet, on attend que tu situes une forme d''écriture de soi, que tu la distingues d''une autre et que tu compares deux
  textes ou un texte et une image.

  '
methode:
- Repérer pour chaque texte du corpus sa forme (autobiographie, mémoires, journal, lettre, essai, roman autobiographique).
- Situer chaque œuvre dans son siècle, pour comprendre ce qui change dans la manière de se raconter.
- Chercher qui parle, à qui, et à quel moment de la vie (au jour le jour ou avec du recul).
- 'Comparer les textes entre eux avec deux questions : qu''ont-ils de commun ? en quoi diffèrent-ils ?'
- Pour un autoportrait peint ou photographié, observer le regard, la posture, les objets et le cadre choisis par l'artiste.
- Rédiger la comparaison en donnant au moins un point commun et une différence, avec un exemple précis.
vocabulaire:
- terme: corpus
  definition: ensemble de textes ou d'images réunis pour être étudiés ensemble
- terme: autoportrait
  definition: portrait qu'un artiste fait de lui-même, en peinture, en photographie ou en texte
- terme: autobiographie
  definition: récit de sa propre vie, où auteur, narrateur et personnage sont la même personne
- terme: mémoires
  definition: récit où l'auteur raconte surtout les événements publics ou historiques qu'il a vécus
- terme: roman autobiographique
  definition: roman inspiré de la vie de l'auteur, mais qui reste une fiction
- terme: journal intime
  definition: texte écrit au jour le jour, avec des dates, pour soi
- terme: correspondance
  definition: ensemble de lettres échangées entre deux personnes
- terme: lecture intégrale
  definition: lecture d'une œuvre entière, par opposition aux extraits
erreurs_frequentes:
- Étudier chaque texte du corpus séparément sans jamais les comparer entre eux.
- Oublier qu'un autoportrait peint ou photographié est aussi une forme de récit de soi, pas seulement les textes.
- Confondre un roman autobiographique, qui s'inspire de la vie de l'auteur, avec une autobiographie ou une pure fiction.
- Confondre autobiographie (toute une vie) et mémoires (événements publics vécus par l'auteur).
- Croire qu'un texte qui dit « je » est forcément vrai et sincère, alors qu'il y a toujours des choix et une mise en scène.
exemple:
  enonce: Donne deux formes différentes que peut prendre un texte dans un corpus de référence sur l'écriture de soi.
  solution: Un corpus peut réunir, par exemple, des pages de journal intime et des lettres de correspondance, deux formes
    différentes de parler de sa propre vie.
exercices:
- id: formes-du-corpus
  type: choix
  difficulte: 1
  enonce: Laquelle de ces formes NE fait PAS partie des textes de l'écriture de soi qu'un tel corpus peut réunir ?
  reponse:
    options:
    - id: a
      texte: Le journal intime
    - id: b
      texte: La correspondance
    - id: c
      texte: La pièce de théâtre historique sans lien avec l'auteur
    - id: d
      texte: Les mémoires
    bonnes:
    - c
  indices:
    relance: Trois de ces formes parlent directement de la vie de celui qui écrit. Laquelle n'en parle pas ?
    methode: 'Élimine les formes où l''auteur raconte sa propre vie : il en reste une seule, qui n''a pas ce lien.'
    etape: Le journal intime, la correspondance et les mémoires parlent tous de la vie de leur auteur.
  pieges:
  - si:
      contient:
      - a
    relance: Le journal intime parle bien de la vie de son auteur, jour après jour. Cherche la forme qui n'a pas ce lien.
  - si:
      contient:
      - b
    relance: La correspondance, faite de lettres, parle aussi de la vie de son auteur. Cherche une autre réponse.
  - si:
      contient:
      - d
    relance: Les mémoires racontent la vie de leur auteur, surtout les événements publics vécus. Cherche une autre réponse.
  solution: Une pièce de théâtre historique sans lien avec la vie de l'auteur ne relève pas de l'écriture de soi.
- id: lecture-integrale
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la lecture d'une œuvre entière, par opposition à la lecture d'extraits ? Réponds par deux mots.
  reponse:
    acceptees:
    - lecture intégrale
    - lecture integrale
    fautes_tolerees: 1
  indices:
    relance: 'C''est le contraire de la lecture d''un groupement d''extraits : on lit le livre du début à la fin.'
    methode: Le premier mot est le nom de l'activité. Le second est un adjectif qui signifie « sans rien enlever ».
    etape: Le second mot est de la même famille que « intégrité ».
  pieges:
  - si:
      valeur: lecture cursive
    relance: La lecture cursive est une lecture plus rapide, en autonomie. Ici, on parle de lire l'œuvre en totalité, sans
      en retirer aucune partie.
  solution: 'On parle de lecture intégrale : l''œuvre est lue en entier (autobiographie, roman autobiographique...), alors
    qu''un groupement propose des extraits.'
- id: comparaison-textes
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne l'art où un peintre fait son propre portrait, comme dans un corpus de référence sur l'écriture
    de soi ?
  reponse:
    acceptees:
    - autoportrait
    fautes_tolerees: 2
  indices:
    relance: 'Le mot commence comme « autobiographie » : « auto- » signifie « soi-même ».'
    methode: Cherche le mot qui désigne un portrait qu'un artiste fait de lui-même, pas d'une autre personne.
    etape: Le mot est formé de « auto- » (soi-même) et « portrait ».
  pieges:
  - si:
      valeur: portrait
    relance: Un portrait peut représenter n'importe qui. Il manque un préfixe pour dire que l'artiste se représente lui-même.
  - si:
      valeur: autobiographie
    relance: Ce mot désigne un texte, pas une peinture. Cherche le mot pour une image que l'artiste fait de lui-même.
  solution: 'Le mot est autoportrait : le portrait qu''un artiste fait de lui-même.'
- id: ordre-genres
  type: ordre
  difficulte: 2
  enonce: Range ces formes d'écriture de soi de la plus courte et datée à la plus construite comme un grand récit.
  reponse:
    elements:
    - id: journal
      texte: Une page de journal intime, écrite un jour précis
    - id: lettre
      texte: Une lettre envoyée à un correspondant
    - id: memoires
      texte: Un chapitre de mémoires qui revient sur des années entières
  indices:
    relance: Laquelle de ces formes est écrite le jour même, sans recul sur les années suivantes ?
    methode: Range d'abord le texte le plus court et le plus immédiat, puis les textes qui prennent plus de recul.
    etape: Le journal intime est écrit au jour le jour ; les mémoires sont écrits bien après, avec du recul sur des années.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux formes voisines sont inversées. Laquelle des deux prend le plus de recul sur le temps ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la forme la plus immédiate (le jour même), puis la forme qui prend le plus de recul.
  solution: Le journal intime note le jour même, la lettre s'adresse à quelqu'un peu après les faits, les mémoires reviennent
    avec du recul sur des années entières.
- id: corpus-et-arts
  type: association
  difficulte: 2
  enonce: Associe chaque type de représentation de soi à son domaine artistique.
  reponse:
    gauche:
    - id: a
      texte: Un autoportrait peint
    - id: b
      texte: Un journal intime
    - id: c
      texte: Une photographie de soi-même
    droite:
    - id: x
      texte: La littérature
    - id: y
      texte: Les arts visuels (peinture ou photographie)
    paires:
      a: y
      b: x
      c: y
  indices:
    relance: Un journal intime est fait de mots écrits ; les deux autres sont des images.
    methode: Sépare d'abord ce qui est un texte de ce qui est une image, puis associe chaque élément à son domaine.
    etape: Un autoportrait peint et une photographie appartiennent aux arts visuels ; un journal intime est un texte littéraire.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie si tu as bien distingué le texte des deux images.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque élément un par un : est-ce un texte écrit, ou une image ?'
  solution: L'autoportrait peint et la photographie relèvent des arts visuels ; le journal intime est un texte littéraire.
- id: pacte-autobiographique
  type: choix
  difficulte: 2
  enonce: Quelle affirmation définit correctement une autobiographie ?
  reponse:
    options:
    - id: a
      texte: L'auteur, le narrateur et le personnage principal sont la même personne
    - id: b
      texte: L'auteur invente entièrement une vie qui n'est pas la sienne
    - id: c
      texte: Le texte est une suite de lettres adressées à un ami
    - id: d
      texte: Le texte raconte uniquement des événements publics et politiques
    bonnes:
    - a
  indices:
    relance: Le mot « autobiographie » se découpe en trois éléments grecs, qui veulent dire soi-même, vie et écriture. Que
      raconte l'auteur ?
    methode: Élimine les définitions qui décrivent une fiction, une correspondance ou des mémoires.
    etape: Dans une autobiographie, le « je » qui raconte est aussi l'auteur du livre et le héros du récit.
  pieges:
  - si:
      contient:
      - b
    relance: Une vie entièrement inventée est une fiction. Dans l'autobiographie, l'auteur raconte sa propre vie.
  - si:
      contient:
      - c
    relance: Des lettres forment une correspondance, pas une autobiographie. Cherche la définition qui parle de l'auteur et
      de son récit.
  - si:
      contient:
      - d
    relance: Raconter surtout les événements publics vécus caractérise les mémoires. L'autobiographie raconte la vie et la
      personnalité de l'auteur.
  solution: 'Dans une autobiographie, l''auteur, le narrateur et le personnage principal sont une seule et même personne :
    c''est le « pacte autobiographique ».'
- id: formes-et-oeuvres
  type: association
  difficulte: 2
  enonce: Associe chaque œuvre à la forme d'écriture de soi qu'elle représente.
  reponse:
    gauche:
    - id: a
      texte: Les Essais de Montaigne
    - id: b
      texte: Mémoires d'outre-tombe de Chateaubriand
    - id: c
      texte: Les lettres de Madame de Sévigné
    droite:
    - id: x
      texte: un essai
    - id: y
      texte: des mémoires
    - id: z
      texte: une correspondance
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Le titre de certaines œuvres donne déjà la forme. Repère-les d'abord.
    methode: « Mémoires » est à la fois un titre et une forme ; des « lettres » forment une correspondance ; il reste l'œuvre
      dont le titre veut dire « tentatives » de penser.
    etape: Commence par « Mémoires d'outre-tombe » et « les lettres », puis relie ce qui reste.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis le titre de chaque œuvre, il indique souvent la forme.
  - si:
      diagnostic: associations_fausses
    relance: Pars des titres qui contiennent le nom de la forme (« mémoires », « lettres »), puis place l'essai.
  solution: Les Essais de Montaigne (XVIe siècle) = un essai ; Mémoires d'outre-tombe de Chateaubriand (XIXe siècle) = des
    mémoires ; les lettres de Madame de Sévigné (XVIIe siècle) = une correspondance.
- id: interet-corpus
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi comparer plusieurs textes sur l'écriture de soi, de siècles différents, aide à mieux comprendre
    ce genre littéraire. Appuie-toi sur au moins un exemple précis de forme ou d'œuvre.
  criteres:
  - L'élève explique qu'un corpus réunit plusieurs textes ou images sur un même sujet, ici l'écriture de soi.
  - L'élève montre que comparer permet de voir des points communs entre les textes (parler de sa vie, chercher une vérité
    sur soi).
  - L'élève montre que comparer permet aussi de voir des différences (époque, forme, sincérité recherchée, mise en scène).
  - L'élève s'appuie sur au moins un exemple précis (une forme comme le journal ou les mémoires, une œuvre, ou un autoportrait
    peint).
  indices:
    relance: Que peut-on apprendre en lisant deux textes qui parlent de soi mais qui n'ont pas été écrits à la même époque
      ?
    methode: Pense à un point commun entre deux textes du corpus, puis à une différence entre eux.
    etape: Commence par « Comparer plusieurs textes permet de voir... », puis donne un point commun et une différence.
  solution: Comparer plusieurs textes du corpus permet de voir ce qui reste commun à l'écriture de soi, comme le désir de
    dire une vérité sur soi, et ce qui change selon l'époque ou l'auteur, comme la forme choisie ou la part de mise en scène.
- id: nblm-dans-un-corpus-de-reference-sur-l-ecritu-1
  type: choix
  difficulte: 2
  enonce: Dans un corpus de référence sur l'écriture de soi, quel est l'objectif principal de la comparaison entre plusieurs
    textes décrivant la vie des auteurs ?
  reponse:
    options:
    - id: o1
      texte: Observer ce qui change et ce qui reste commun quand on parle de soi selon l'époque et la mise en scène.
    - id: o2
      texte: Vérifier la perfection grammaticale et l'absence d'erreurs dans chaque récit d'enfance.
    - id: o3
      texte: Prouver que tous les auteurs écrivent exactement le même récit quelle que soit leur époque.
    - id: o4
      texte: Étudier chaque texte de manière isolée sans jamais effectuer de rapprochement.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qu'apporte la confrontation de témoignages issus de siècles différents.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le but d''un corpus littéraire n''est pas un contrôle orthographique, mais la compréhension
      des enjeux du récit de soi.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : les récits de soi varient fortement selon les siècles, les contextes et les intentions des
      auteurs.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : l''erreur classique consiste à isoler les textes au lieu de les mettre en dialogue au sein
      du groupement.'
  solution: Observer ce qui change et ce qui reste commun quand on parle de soi selon l'époque et la mise en scène. Exact
    ! Comparer plusieurs textes permet de voir ce qui change et ce qui reste commun (époque, choix des mots, sincérité, mise
    en scène) lorsqu'un auteur parle de lui-même.
- id: nblm-dans-le-cadre-du-corpus-se-raconter-comm-2
  type: choix
  difficulte: 2
  enonce: Dans le cadre du corpus « se raconter », comment un autoportrait en peinture s'articule-t-il avec les textes littéraires
    ? [1-3]
  reponse:
    options:
    - id: o1
      texte: Il constitue une autre forme de récit de soi en montrant comment l'artiste se représente lui-même visuellement.
    - id: o2
      texte: Il sert uniquement d'illustration décorative sans lien avec la question du sujet.
    - id: o3
      texte: Il remplace totalement les textes car la peinture est considérée comme seule vraie.
    - id: o4
      texte: Il est exclu du programme car seuls les livres écrits sont acceptés.
    bonnes:
    - o1
  indices:
    relance: Considère ce qui rapproche la démarche d'un écrivain et celle d'un peintre qui réalise son propre portrait.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : négliger le fait qu''une œuvre picturale est en soi un mode de représentation personnelle à
      part entière.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le corpus met en relation le texte et l''image sans éliminer l''un au profit de l''autre.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le programme officiel demande explicitement de relier la littérature à d''autres arts comme
      la peinture.'
  solution: Il constitue une autre forme de récit de soi en montrant comment l'artiste se représente lui-même visuellement.
    Exact ! Un autoportrait peint est une démarche d'écriture de soi par l'image, où l'artiste se représente lui-même à travers
    son regard, sa posture et son décor.
- id: nblm-quelle-est-la-particularite-d-une-lectur-3
  type: choix
  difficulte: 2
  enonce: Quelle est la particularité d'une lecture cursive d'une autobiographie en classe de 3e ? [4-6]
  reponse:
    options:
    - id: o1
      texte: C'est une lecture plus libre et personnelle d'une œuvre complète, choisie par l'élève et complémentaire au cours.
    - id: o2
      texte: C'est une étude linéaire obligatoire faite ligne par ligne en classe avec l'enseignant.
    - id: o3
      texte: C'est la lecture d'un court extrait de dix lignes uniquement.
    - id: o4
      texte: C'est un exercice de réécriture intégrale du livre par l'élève.
    bonnes:
    - o1
  indices:
    relance: Pense à la différence entre l'analyse détaillée faite en classe et la lecture autonome à la maison.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : cela décrit la lecture intégrale approfondie en classe, non la lecture cursive.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la lecture cursive porte sur une œuvre complète (ex. récit autobiographique), pas sur un simple
      extrait.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la lecture cursive est une modalité de lecture personnelle et non un travail de réécriture.'
  solution: C'est une lecture plus libre et personnelle d'une œuvre complète, choisie par l'élève et complémentaire au cours.
    Exact ! La lecture cursive est une lecture personnelle, autonome et plus libre qu'une étude intégrale menée collectivement
    en classe.
- id: nblm-quel-piege-d-analyse-faut-il-eviter-lors-4
  type: choix
  difficulte: 2
  enonce: Quel piège d'analyse faut-il éviter lors de l'étude d'un roman autobiographique ?
  reponse:
    options:
    - id: o1
      texte: Confondre le roman autobiographique, inspiré de la vie réelle de l'auteur, avec une pure fiction inventée.
    - id: o2
      texte: Relier le récit avec d'autres œuvres artistiques de la même époque.
    - id: o3
      texte: Identifier les thèmes récurrents comme les souvenirs d'enfance.
    - id: o4
      texte: Vérifier si l'auteur utilise le pronom « je » dans son texte.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au lien entre la vie véritable de l'auteur et la forme du roman.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : relier un texte à d''autres œuvres est une compétence attendue et conseillée.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : repérer les thèmes du souvenir est au cœur du travail sur le récit de soi.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : analyser la présence du « je » est une observation grammaticale essentielle.'
  solution: Confondre le roman autobiographique, inspiré de la vie réelle de l'auteur, avec une pure fiction inventée. Exact
    ! Un roman autobiographique s'appuie sur le vécu réel de l'auteur, même s'il réorganise ou romanesque certains éléments.
- id: nblm-lorsqu-on-etudie-un-autoportrait-en-pein-5
  type: choix
  difficulte: 2
  enonce: Lorsqu'on étudie un autoportrait en peinture au sein d'un groupement de textes sur soi, sur quels aspects précis
    faut-il porter son attention ?
  reponse:
    options:
    - id: o1
      texte: Le regard, la posture de l'artiste et les objets choisis pour composer son image.
    - id: o2
      texte: Le prix de vente du tableau et les dimensions exactes du cadre.
    - id: o3
      texte: Uniquement la marque des pinceaux utilisés par le peintre.
    - id: o4
      texte: La biographie du modèle fictif représenté à la place du peintre.
    bonnes:
    - o1
  indices:
    relance: Observe comment l'artiste scénographie sa propre présence visuelle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ces données matérielles ne permettent pas de comprendre l''intention expressive de l''artiste.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : l''analyse artistique s''intéresse à la composition et au sens de l''image, pas à des détails
      d''outillage.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : dans un autoportrait, le modèle est l''artiste lui-même, il ne s''agit pas d''un personnage
      de fiction.'
  solution: Le regard, la posture de l'artiste et les objets choisis pour composer son image. Exact ! L'analyse d'un autoportrait
    pictural repose sur l'observation de la posture, de l'expression du regard et du choix des objets environnants.
- id: nblm-quelles-formes-litteraires-peuvent-compo-6
  type: choix
  difficulte: 3
  enonce: Quelles formes littéraires peuvent composer un groupement de textes sur soi dans le corpus « se raconter » ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Des pages de journal intime et des lettres de correspondance.
    - id: o2
      texte: Des extraits de mémoires et d'autobiographies.
    - id: o3
      texte: Des modes d'emploi d'appareils électroménagers.
    - id: o4
      texte: Des articles du Code civil ou des décrets administratifs.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les types de textes où l'auteur s'exprime à la première personne sur sa vie personnelle ou publique.
