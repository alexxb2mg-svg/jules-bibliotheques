  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : les écrits techniques informatifs n''expriment aucune expérience personnelle.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : les textes juridiques neutres ne relèvent pas du récit de soi.'
  solution: Des pages de journal intime et des lettres de correspondance ; Des extraits de mémoires et d'autobiographies.
    Exact ! Le journal intime et la correspondance privée sont deux formes canoniques de l'écriture de soi.
