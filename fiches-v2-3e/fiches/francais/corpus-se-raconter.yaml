format: 2
notion: corpus-se-raconter
version: 1
etat: verifiee
declencheurs:
- groupement de textes sur soi
- autoportrait en peinture
- lecture cursive autobiographie
prerequis:
- ecriture-de-soi-autoportrait
essentiel: 'Un corpus de référence sur l''écriture de soi rassemble des textes qui montrent différentes façons de se raconter.

  On peut lire une oeuvre entière (lecture intégrale), comme une autobiographie ou un roman autobiographique,

  ou bien un ensemble d''extraits de siècles et de genres différents : essai, mémoires, autobiographie,

  roman autobiographique, journal intime, correspondance.

  Le groupement peut aussi comparer un texte à une oeuvre d''un autre art : un autoportrait peint,

  une photographie ou une image animée qui montre comment un artiste se représente lui-même.

  Comparer plusieurs textes permet de voir ce qui change et ce qui reste commun quand on parle de soi :

  l''époque, le choix des mots, la sincérité recherchée, la part de mise en scène.

  '
methode:
- Repérer, pour chaque texte du corpus, sa forme (lettre, journal, récit d'enfance, portrait peint...).
- Situer chaque texte dans son siècle, pour comprendre ce qui change dans la manière de se raconter.
- 'Comparer les textes entre eux : que disent-ils tous sur soi ? Que disent-ils de différent ?'
- Pour un autoportrait peint, observer le regard, la posture et les objets choisis par l'artiste.
vocabulaire:
- terme: corpus
  definition: ensemble de textes ou d'images réunis pour être étudiés ensemble
- terme: autoportrait
  definition: portrait qu'un artiste fait de lui-même, en peinture, en photographie ou en texte
erreurs_frequentes:
- Étudier chaque texte du corpus séparément sans jamais les comparer entre eux.
- Oublier qu'un autoportrait peint est aussi une forme de récit de soi, pas seulement les textes.
- Confondre un roman autobiographique, qui s'inspire de la vie de l'auteur, avec une pure fiction.
exemple:
  enonce: Donne deux formes différentes que peut prendre un texte dans un corpus de référence sur l'écriture de soi.
  solution: Un corpus peut réunir, par exemple, des pages de journal intime et des lettres de correspondance, deux formes
    différentes de parler de sa propre vie.
exercices:
- id: formes-du-corpus
  type: choix
  difficulte: 1
  enonce: Laquelle de ces formes NE fait PAS partie des textes de l'écriture de soi qu'un tel corpus peut réunir ?
  reponse:
    options:
    - id: a
      texte: Le journal intime
    - id: b
      texte: La correspondance
    - id: c
      texte: La pièce de théâtre historique sans lien avec l'auteur
    - id: d
      texte: Les mémoires
    bonnes:
    - c
  indices:
    relance: Trois de ces formes parlent directement de la vie de celui qui écrit. Laquelle n'en parle pas ?
    methode: 'Élimine les formes où l''auteur raconte sa propre vie : il en reste une seule, qui n''a pas ce lien.'
    etape: Le journal intime, la correspondance et les mémoires parlent tous de la vie de leur auteur.
  pieges:
  - si:
      contient:
      - a
    relance: Le journal intime parle bien de la vie de son auteur, jour après jour. Cherche la forme qui n'a pas ce lien.
  - si:
      contient:
      - b
    relance: La correspondance, faite de lettres, parle aussi de la vie de son auteur. Cherche une autre réponse.
  - si:
      contient:
      - d
    relance: Les mémoires racontent la vie de leur auteur, surtout les événements publics vécus. Cherche une autre réponse.
  solution: Une pièce de théâtre historique sans lien avec la vie de l'auteur ne relève pas de l'écriture de soi.
- id: comparaison-textes
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne l'art où un peintre fait son propre portrait, comme dans un corpus de référence sur l'écriture
    de soi ?
  reponse:
    acceptees:
    - autoportrait
    fautes_tolerees: 2
  indices:
    relance: 'Le mot commence comme « autobiographie » : « auto- » signifie « soi-même ».'
    methode: Cherche le mot qui désigne un portrait qu'un artiste fait de lui-même, pas d'une autre personne.
    etape: Le mot est formé de « auto- » (soi-même) et « portrait ».
  pieges:
  - si:
      valeur: portrait
    relance: Un portrait peut représenter n'importe qui. Il manque un préfixe pour dire que l'artiste se représente lui-même.
  - si:
      valeur: autobiographie
    relance: Ce mot désigne un texte, pas une peinture. Cherche le mot pour une image que l'artiste fait de lui-même.
  solution: 'Le mot est autoportrait : le portrait qu''un artiste fait de lui-même.'
- id: ordre-genres
  type: ordre
  difficulte: 2
  enonce: Range ces formes d'écriture de soi de la plus courte et datée à la plus construite comme un grand récit.
  reponse:
    elements:
    - id: journal
      texte: Une page de journal intime, écrite un jour précis
    - id: lettre
      texte: Une lettre envoyée à un correspondant
    - id: memoires
      texte: Un chapitre de mémoires qui revient sur des années entières
  indices:
    relance: Laquelle de ces formes est écrite le jour même, sans recul sur les années suivantes ?
    methode: Range d'abord le texte le plus court et le plus immédiat, puis les textes qui prennent plus de recul.
    etape: Le journal intime est écrit au jour le jour ; les mémoires sont écrits bien après, avec du recul sur des années.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux formes voisines sont inversées. Laquelle des deux prend le plus de recul sur le temps ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la forme la plus immédiate (le jour même), puis la forme qui prend le plus de recul.
  solution: Le journal intime note le jour même, la lettre s'adresse à quelqu'un peu après les faits, les mémoires reviennent
    avec du recul sur des années entières.
- id: corpus-et-arts
  type: association
  difficulte: 2
  enonce: Associe chaque type de représentation de soi à son domaine artistique.
  reponse:
    gauche:
    - id: a
      texte: Un autoportrait peint
    - id: b
      texte: Un journal intime
    - id: c
      texte: Une photographie de soi-même
    droite:
    - id: x
      texte: La littérature
    - id: y
      texte: Les arts visuels (peinture ou photographie)
    paires:
      a: y
      b: x
      c: y
  indices:
    relance: Un journal intime est fait de mots écrits ; les deux autres sont des images.
    methode: Sépare d'abord ce qui est un texte de ce qui est une image, puis associe chaque élément à son domaine.
    etape: Un autoportrait peint et une photographie appartiennent aux arts visuels ; un journal intime est un texte littéraire.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie si tu as bien distingué le texte des deux images.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque élément un par un : est-ce un texte écrit, ou une image ?'
  solution: L'autoportrait peint et la photographie relèvent des arts visuels ; le journal intime est un texte littéraire.
- id: interet-corpus
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi comparer plusieurs textes sur l'écriture de soi, de siècles différents, aide à mieux comprendre
    ce genre littéraire.
  criteres:
  - L'élève explique qu'un corpus réunit plusieurs textes ou images sur un même sujet, ici l'écriture de soi.
  - L'élève montre que comparer permet de voir des points communs entre les textes (parler de sa vie, chercher une vérité
    sur soi).
  - L'élève montre que comparer permet aussi de voir des différences (époque, forme, sincérité recherchée).
  indices:
    relance: Que peut-on apprendre en lisant deux textes qui parlent de soi mais qui n'ont pas été écrits à la même époque
      ?
    methode: Pense à un point commun entre deux textes du corpus, puis à une différence entre eux.
    etape: Commence par « Comparer plusieurs textes permet de voir... », puis donne un point commun et une différence.
  solution: Comparer plusieurs textes du corpus permet de voir ce qui reste commun à l'écriture de soi, comme le désir de
    dire une vérité sur soi, et ce qui change selon l'époque ou l'auteur, comme la forme choisie ou la part de mise en scène.
