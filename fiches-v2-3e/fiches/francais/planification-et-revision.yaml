# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: planification-et-revision
version: 1
etat: verifiee
declencheurs:
- organiser mes idées avant d'écrire
- améliorer mon brouillon
- réécrire un texte
- trouver des idées pour rédiger
prerequis: []
essentiel: 'Bien écrire ne commence pas par la première phrase : cela commence par la planification. Planifier, c''est

  organiser ses idées avant de rédiger : lister ce qu''on veut dire, choisir un ordre logique, prévoir une

  introduction et une conclusion. Pour trouver des idées, on peut faire une liste en vrac, un schéma, ou se poser

  des questions (qui, quoi, où, quand, pourquoi, comment).


  Réviser un écrit, c''est le relire après l''avoir rédigé pour l''améliorer, avec des outils différents à chaque

  relecture : une fois pour le sens et l''organisation des idées, une fois pour la grammaire et l''orthographe, une

  fois pour le vocabulaire (éviter les répétitions, préciser un mot vague). Réviser n''est pas seulement corriger

  les fautes : c''est aussi réécrire une phrase pour qu''elle soit plus claire ou plus précise.

  '
methode:
- Avant de rédiger, lister les idées en vrac, sans se soucier de l'ordre.
- Choisir un ordre logique pour ces idées (chronologique, du plus simple au plus complexe, du général au particulier).
- Rédiger un brouillon en suivant ce plan.
- 'Réviser le brouillon en plusieurs passages séparés : d''abord le sens et l''organisation, puis la grammaire et l''orthographe,
  puis le vocabulaire.'
- Réécrire les phrases peu claires ou les mots trop vagues repérés pendant la révision.
vocabulaire:
- terme: planification
  definition: organiser ses idées et prévoir un plan avant de rédiger un texte
- terme: révision
  definition: relire un texte déjà rédigé pour l'améliorer, avec des outils et des objectifs différents à chaque relecture
erreurs_frequentes:
- Se mettre à rédiger directement sans avoir organisé ses idées.
- Réviser un texte une seule fois, en cherchant en même temps les fautes et les problèmes de sens.
- Croire que réviser se limite à corriger l'orthographe, sans jamais reformuler une phrase.
exemple:
  enonce: Avant d'écrire un texte sur un souvenir de vacances, une élève note en vrac « la plage », « ma sœur », « le premier
    jour », « la peur de l'eau ». Explique en une phrase ce qu'elle doit faire ensuite pour planifier son texte.
  solution: Elle doit choisir un ordre logique pour ces idées, par exemple chronologique (le premier jour, puis la plage,
    puis sa peur de l'eau, puis sa sœur qui l'aide), avant de commencer à rédiger.
exercices:
- id: reconnaitre-planification
  type: choix
  difficulte: 1
  enonce: Une élève doit écrire un texte sur un souvenir d'école. Que doit-elle faire en premier, avant de rédiger la première
    phrase ?
  reponse:
    options:
    - id: a
      texte: Lister ses idées en vrac et choisir un ordre logique
    - id: b
      texte: Corriger les fautes d'orthographe de son brouillon
    - id: c
      texte: Compter le nombre de mots de son texte fini
    - id: d
      texte: Recopier son texte au propre
    bonnes:
    - a
  indices:
    relance: Est-ce qu'on peut corriger des fautes ou compter des mots sur un texte qui n'existe pas encore ?
    methode: 'La première étape de l''écriture se fait avant même d''écrire une phrase : c''est l''organisation des idées.'
    etape: Cherche l'étape qui n'a pas besoin d'un texte déjà rédigé pour être faite.
  pieges:
  - si:
      contient:
      - b
    relance: On ne peut pas corriger des fautes dans un texte qui n'a pas encore été écrit. Que faire d'abord ?
  - si:
      contient:
      - c
    relance: Compter les mots suppose que le texte existe déjà. Quelle étape vient avant la rédaction ?
  - si:
      contient:
      - d
    relance: Recopier au propre se fait tout à la fin, après la révision. Quelle est la toute première étape ?
  solution: 'Il faut d''abord lister ses idées en vrac, puis choisir un ordre logique : c''est la planification, avant même
    de rédiger.'
- id: mot-revision
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le fait de relire un texte déjà écrit pour l'améliorer (sens, grammaire, vocabulaire) ?
  reponse:
    acceptees:
    - révision
    fautes_tolerees: 1
  indices:
    relance: C'est ce qu'on fait après avoir écrit un brouillon, pas avant.
    methode: Le mot vient du verbe qui signifie « regarder de nouveau », « revoir ».
    etape: Le mot commence par « rév- » et se termine par « -ision ».
  pieges:
  - si:
      valeur: correction
    relance: 'Corriger n''est qu''une partie de cette démarche. Le mot cherché est plus large : il inclut aussi reformuler
      des phrases, pas seulement corriger des fautes.'
  solution: 'La révision : relire un texte déjà rédigé pour l''améliorer, sur le sens, la grammaire, l''orthographe et le
    vocabulaire.'
- id: etapes-ecriture-complete
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les grandes étapes de l'écriture d'un texte.
  reponse:
    elements:
    - id: a
      texte: Je liste mes idées en vrac et je choisis un ordre logique
    - id: b
      texte: Je rédige un brouillon en suivant ce plan
    - id: c
      texte: Je révise le brouillon (sens, puis grammaire, puis vocabulaire)
    - id: d
      texte: Je recopie mon texte au propre
  indices:
    relance: Quelle est la toute première étape, avant même d'écrire une phrase ?
    methode: On organise d'abord ses idées, puis on rédige, puis on révise, puis on recopie au propre.
    etape: On commence toujours par la planification des idées.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre le travail (planifier) et celle qui le ferme (recopier au propre).
  solution: On planifie ses idées, puis on rédige un brouillon, puis on révise, puis on recopie le texte final au propre.
- id: outil-selon-objectif
  type: association
  difficulte: 2
  enonce: Relie chaque objectif de révision à ce qu'on vérifie précisément.
  reponse:
    gauche:
    - id: a
      texte: Je révise le sens et l'organisation des idées
    - id: b
      texte: Je révise la grammaire et l'orthographe
    - id: c
      texte: Je révise le vocabulaire
    droite:
    - id: x
      texte: Je vérifie que mes idées sont dans un ordre logique et que le texte répond bien au sujet
    - id: y
      texte: Je vérifie les accords, la conjugaison et l'orthographe des mots
    - id: z
      texte: Je vérifie que je n'ai pas répété le même mot trop souvent et que mes mots sont précis
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque objectif, demande-toi si on regarde le contenu global, les règles de la langue, ou le choix des mots.
    methode: Le sens concerne l'organisation générale, la grammaire concerne les règles, le vocabulaire concerne le choix
      précis des mots.
    etape: Commence par la révision du sens, la plus globale, avant les révisions plus fines.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à ce que chaque type de révision vérifie précisément.
  - si:
      diagnostic: associations_fausses
    relance: Repars de la révision du sens, la plus globale, puis distingue grammaire et vocabulaire.
  solution: La révision du sens vérifie l'organisation des idées. La révision de la grammaire vérifie les accords et l'orthographe.
    La révision du vocabulaire vérifie les répétitions et la précision des mots.
- id: nblm-quelle-est-la-premiere-demarche-pre-reda-1
  type: choix
  difficulte: 2
  enonce: Quelle est la première démarche pré-rédactionnelle recommandée pour trouver des idées et planifier un texte avant
    d’écrire ?
  reponse:
    options:
    - id: o1
      texte: Lister ses idées en vrac sans se soucier immédiatement de leur ordre.
    - id: o2
      texte: Rédiger directement l’introduction définitive avec une orthographe irréprochable.
    - id: o3
      texte: Effacer la consigne pour rédiger un texte libre sans contraintes.
    - id: o4
      texte: Mémoriser l’ensemble du texte par cœur sans réaliser de brouillon.
    bonnes:
    - o1
  indices:
    relance: Pense à l’étape initiale sur brouillon où l’on note tout ce qui nous vient à l’esprit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : se lancer directement dans la rédaction définitive bloque la recherche et la clarification
      des idées.'
  - si:
      contient:
      - o3
    relance: La planification doit toujours respecter le sujet et les contraintes de la consigne.
  - si:
      contient:
      - o4
    relance: L’écrit pré-rédactionnel sur brouillon est nécessaire en 3e pour structurer sa pensée.
  solution: Lister ses idées en vrac sans se soucier immédiatement de leur ordre. C’est la première étape indispensable pour
    faire émerger des idées librement avant de les organiser.
- id: nblm-selon-la-methode-de-revision-proposee-da-2
  type: choix
  difficulte: 2
  enonce: Selon la méthode de révision proposée dans la fiche, comment faut-il procéder pour relire et améliorer son brouillon
    ?
  reponse:
    options:
    - id: o1
      texte: Effectuer plusieurs passages séparés en ciblant un objectif spécifique à chaque relecture.
    - id: o2
      texte: Tout relire en un seul passage rapide en cherchant à la fois les fautes et la clarté des idées.
    - id: o3
      texte: Corriger uniquement l’orthographe lexicale sans jamais modifier la structure des phrases.
    - id: o4
      texte: Recopier immédiatement le texte au propre sans rien changer au premier jet.
    bonnes:
    - o1
  indices:
    relance: Chaque passage de relecture doit se concentrer sur un aspect précis du texte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C’est une erreur fréquente : vouloir tout corriger en même temps fait manquer des erreurs majeures.'
  - si:
      contient:
      - o3
    relance: La révision ne se limite pas à l’orthographe ; elle concerne aussi la cohérence et la clarté du propos.
  - si:
      contient:
      - o4
    relance: Améliorer son brouillon exige un travail actif de modification et de retouche du premier jet.
  solution: Effectuer plusieurs passages séparés en ciblant un objectif spécifique à chaque relecture. Traiter séparément
    le sens, puis la grammaire/orthographe, puis le vocabulaire garantit une révision méthodique et efficace.
- id: nblm-pourquoi-letape-visant-a-reecrire-un-tex-3
  type: choix
  difficulte: 2
  enonce: Pourquoi l’étape visant à réécrire un texte ne se réduit-elle pas à la simple correction des fautes d’orthographe
    ?
  reponse:
    options:
    - id: o1
      texte: Parce qu’elle demande aussi de reformuler les phrases peu claires pour les rendre plus précises.
    - id: o2
      texte: Parce que la correction orthographique est inutile dans les travaux d’écriture au collège.
    - id: o3
      texte: Parce que réviser sert uniquement à modifier la typographie et la mise en page du devoir.
    - id: o4
      texte: Parce que la réécriture exige d’éliminer la moitié du contenu écrit au brouillon.
    bonnes:
    - o1
  indices:
    relance: Réviser implique de travailler sur la clarté du sens et le choix des mots.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L’orthographe est un critère important de révision, mais elle n’est pas le seul élément à revoir.
  - si:
      contient:
      - o3
    relance: La révision porte sur le sens et la langue, pas uniquement sur l’aspect visuel du texte.
  - si:
      contient:
      - o4
    relance: Réécrire permet d’améliorer le propos, pas de supprimer arbitrairement son travail.
  solution: Parce qu’elle demande aussi de reformuler les phrases peu claires pour les rendre plus précises. La réécriture
    vise à perfectionner la clarté, la précision du vocabulaire et la structure du texte.
- id: nblm-une-fois-les-idees-relevees-en-vrac-sur-4
  type: choix
  difficulte: 2
  enonce: Une fois les idées relevées en vrac sur le brouillon, quelle action permet de structurer le plan du texte ?
  reponse:
    options:
    - id: o1
      texte: Choisir un ordre logique d’enchaînement (chronologique, du simple au complexe, ou du général au particulier).
    - id: o2
      texte: Supprimer toutes les idées rédigées en plusieurs mots pour ne garder que des mots isolés.
    - id: o3
      texte: Rédiger d’abord la conclusion avant d’avoir structuré le développement.
    - id: o4
      texte: Remplacer chaque terme du brouillon par un synonyme rare trouvé dans le dictionnaire.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la meilleure façon d’enchaîner tes arguments pour guider ton lecteur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Il ne faut pas détruire ses idées mais les organiser de façon cohérente.
  - si:
      contient:
      - o3
    relance: La conclusion se prépare dans le cadre d’un plan d’ensemble et ne se rédige pas au hasard en premier.
  - si:
      contient:
      - o4
    relance: Le choix du plan concerne la structuration des idées, pas le remplacement systématique des mots.
  solution: Choisir un ordre logique d’enchaînement (chronologique, du simple au complexe, ou du général au particulier).
    Classer les idées selon une progression logique est le cœur de la planification.
- id: nblm-parmi-les-methodes-de-questionnement-pou-5
  type: choix
  difficulte: 2
  enonce: Parmi les méthodes de questionnement pour trouver des idées lors de la planification, quelle série de questions
    est préconisée ?
  reponse:
    options:
    - id: o1
      texte: Qui ? Quoi ? Où ? Quand ? Pourquoi ? Comment ?
    - id: o2
      texte: Combien de lignes ? Quelle note ? Quel jour ? Combien de fautes ?
    - id: o3
      texte: Est-ce difficile ? Est-ce long ? Est-ce révisé ? Est-ce corrigé ?
    - id: o4
      texte: Quel verbe ? Quel adjectif ? Quel adverbe ? Quelle préposition ?
    bonnes:
    - o1
  indices:
    relance: Il s’agit des six questions universelles pour analyser une situation ou un événement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Ces interrogations d’évaluation ne produisent pas d’idées ou de contenu pour le texte.
  - si:
      contient:
      - o3
    relance: Ces questions sur le niveau de difficulté n’aident pas à faire émerger des éléments de réflexion.
  - si:
      contient:
      - o4
    relance: Identifier la nature des mots relève de la révision grammaticale et non de la recherche d’idées.
  solution: Qui ? Quoi ? Où ? Quand ? Pourquoi ? Comment ?. Ce questionnement méthodique permet d’explorer tous les aspects
    d’un sujet d’écriture.
- id: nblm-quelles-sont-les-deux-demarches-essentie-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux démarches essentielles à effectuer pour améliorer son brouillon lors d’un travail d’écriture
    ? (Sélectionne 2 réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Suivre des critères de relecture élaborés seul ou collectivement.
    - id: o2
      texte: Procéder à la réécriture des phrases peu claires ou des mots trop vagues.
    - id: o3
      texte: Conserver le premier jet sans aucune modification pour garder la spontanéité initiale.
    - id: o4
      texte: Effacer systématiquement tous les paragraphes de plus de trois phrases.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux repères qui aident à relire et aux actions de reformulation sur le texte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C’est l’inverse de la démarche d’apprentissage qui demande de retravailler et corriger son texte.
  - si:
      contient:
      - o4
    relance: La valeur d’un paragraphe dépend de son organisation et de sa clarté, pas de sa brièveté forcée.
  solution: Suivre des critères de relecture élaborés seul ou collectivement ; Procéder à la réécriture des phrases peu claires
    ou des mots trop vagues. Les critères ou grilles de relecture permettent de guider la révision de manière structurée.
- id: nblm-comment-appelle-t-on-la-phase-qui-consis-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la phase qui consiste à organiser ses idées et prévoir un plan avant de rédiger un texte ?
  reponse:
    acceptees:
    - planification
    fautes_tolerees: 1
  indices:
    relance: Ce nom est formé sur le verbe planifier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: planification. La planification désigne l’organisation préalable des idées et du plan avant la rédaction.
- id: nblm-quel-terme-designe-letape-de-relecture-m-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne l’étape de relecture méthodique d’un texte rédigé pour l’améliorer et le corriger ?
  reponse:
    acceptees:
    - révision
    fautes_tolerees: 1
  indices:
    relance: Ce nom est formé sur le verbe réviser.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: révision. La révision est l’étape où l’on relit et retravaille son texte pour en perfectionner le sens et la langue.
