# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: planification-et-revision
version: 2
etat: generee
declencheurs:
- organiser mes idées avant d'écrire
- améliorer mon brouillon
- réécrire un texte
- trouver des idées pour rédiger
- carte mentale avant d'écrire
- remue-méninges pour écrire
- relire à voix haute
- grille de relecture
prerequis: []
essentiel: |
  Écrire un bon texte demande deux grands temps : préparer avant d'écrire (planifier), puis améliorer après avoir écrit (réviser).

  1. Trouver des idées.
  Avant de rédiger, on cherche de quoi écrire. Quelques stratégies :
  - faire un remue-méninges : noter en vrac tous les mots et idées qui viennent, sans trier ;
  - faire une carte mentale (le sujet au centre, les idées autour) ;
  - se poser les questions Qui ? Quoi ? Où ? Quand ? Comment ? Pourquoi ? ;
  - relire des textes déjà lus pour y prendre des mots, des exemples, des façons de faire ;
  - réunir des informations ou des exemples dans un cours ou un document.

  2. Planifier.
  On trie les idées, on garde les meilleures et on choisit un ordre. Selon le texte, l'ordre est chronologique (récit), du général au particulier, du plus simple au plus complexe, ou par arguments (texte argumentatif). Le résultat est un plan : une liste courte de parties, avec pour chaque partie une ou deux idées.

  3. Rédiger un brouillon.
  On écrit en suivant le plan, en laissant de la place pour les corrections (sauter des lignes).

  4. Réviser.
  On relit en plusieurs passages, chacun avec un seul objectif :
  - le sens et l'organisation : le texte répond-il au sujet ? les idées sont-elles dans l'ordre ? les phrases s'enchaînent-elles avec des connecteurs ? ;
  - la syntaxe : phrases trop longues ou incorrectes ;
  - la grammaire et l'orthographe : accord du sujet et du verbe, accords dans le groupe nominal, participes passés ;
  - le vocabulaire : mots trop vagues (« chose », « faire »), répétitions ;
  - la ponctuation et la présentation.

  5. Les outils de révision.
  Dictionnaire, grammaire ou cahier de règles, liste de contrôle (grille de relecture), code de correction du professeur, correcteur d'un logiciel (à vérifier, il se trompe), relecture à voix haute, relecture par un camarade. Réécrire, c'est modifier, ajouter, déplacer ou supprimer, pas seulement recopier.

  Au brevet, la dictée et la rédaction sont notées : on doit garder du temps pour relire et pour réécrire.
methode:
- 'Lis bien le sujet : repère ce qu''on te demande (type de texte, consignes, longueur).'
- Note en vrac tes idées (remue-méninges, carte mentale, questions Qui ? Quoi ? Où ? Quand ? Pourquoi ?).
- 'Trie tes idées, garde les meilleures et classe-les dans un ordre logique : c''est ton plan.'
- Rédige le brouillon en suivant le plan, en sautant des lignes pour pouvoir corriger.
- 'Relis en plusieurs passages, un seul objectif à chaque fois : sens et organisation, puis grammaire et orthographe, puis vocabulaire.'
- Utilise des outils (dictionnaire, liste de contrôle, relecture à voix haute) puis réécris les passages faibles avant de recopier.
vocabulaire:
- terme: planification
  definition: 'préparation d''un texte avant de l''écrire : trouver des idées puis les organiser'
- terme: brouillon
  definition: première version d'un texte, écrite pour être corrigée
- terme: remue-méninges
  definition: liste d'idées notées en vrac, sans les trier
- terme: carte mentale
  definition: schéma qui place le sujet au centre et les idées autour
- terme: plan
  definition: organisation des idées d'un texte dans un ordre choisi
- terme: révision
  definition: relecture d'un texte pour l'améliorer (sens, grammaire, vocabulaire)
- terme: réécriture
  definition: fait de reprendre un passage pour le modifier, l'ajouter, le déplacer ou le supprimer
- terme: grille de relecture
  definition: liste de points à vérifier pendant la révision
erreurs_frequentes:
- Se lancer dans la rédaction sans avoir fait de plan.
- 'Réviser en une seule relecture en cherchant tout à la fois : sens, orthographe et vocabulaire.'
- Ne corriger que l'orthographe et oublier le sens, l'ordre des idées et les répétitions.
- Croire que le correcteur d'un logiciel trouve toutes les fautes.
- Recopier au propre sans avoir réécrit les passages faibles.
exemple:
  enonce: Avant d'écrire un texte sur un souvenir de vacances, une élève note en vrac « la plage », « ma sœur », « le premier jour », « la peur de l'eau ». Explique en une phrase ce qu'elle doit faire ensuite pour planifier son texte.
  solution: Elle doit choisir un ordre logique pour ces idées, par exemple chronologique (le premier jour, puis la plage, puis sa peur de l'eau, puis sa sœur qui l'aide), avant de commencer à rédiger.
exercices:
- id: reconnaitre-planification
  type: choix
  difficulte: 1
  enonce: Une élève doit écrire un texte sur un souvenir d'école. Que doit-elle faire en premier, avant de rédiger la première phrase ?
  reponse:
    options:
    - id: a
      texte: Lister ses idées en vrac et choisir un ordre logique
    - id: b
      texte: Corriger les fautes d'orthographe de son brouillon
    - id: c
      texte: Compter le nombre de mots de son texte fini
    - id: d
      texte: Recopier son texte au propre
    bonnes:
    - a
  indices:
    relance: Est-ce qu'on peut corriger des fautes ou compter des mots sur un texte qui n'existe pas encore ?
    methode: 'La première étape de l''écriture se fait avant même d''écrire une phrase : c''est l''organisation des idées.'
    etape: Cherche l'étape qui n'a pas besoin d'un texte déjà rédigé pour être faite.
  pieges:
  - si:
      contient:
      - b
    relance: On ne peut pas corriger des fautes dans un texte qui n'a pas encore été écrit. Que faire d'abord ?
  - si:
      contient:
      - c
    relance: Compter les mots suppose que le texte existe déjà. Quelle étape vient avant la rédaction ?
  - si:
      contient:
      - d
    relance: Recopier au propre se fait tout à la fin, après la révision. Quelle est la toute première étape ?
  solution: 'Il faut d''abord lister ses idées en vrac, puis choisir un ordre logique : c''est la planification, avant même de rédiger.'
- id: mot-revision
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le fait de relire un texte déjà écrit pour l'améliorer (sens, grammaire, vocabulaire) ?
  reponse:
    acceptees:
    - révision
    fautes_tolerees: 1
  indices:
    relance: C'est ce qu'on fait après avoir écrit un brouillon, pas avant.
    methode: Le mot vient du verbe qui signifie « regarder de nouveau », « revoir ».
    etape: Le mot commence par « rév- » et se termine par « -ision ».
  pieges:
  - si:
      valeur: correction
    relance: 'Corriger n''est qu''une partie de cette démarche. Le mot cherché est plus large : il inclut aussi reformuler des phrases, pas seulement corriger des fautes.'
  solution: 'La révision : relire un texte déjà rédigé pour l''améliorer, sur le sens, la grammaire, l''orthographe et le vocabulaire.'
- id: etapes-ecriture-complete
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les grandes étapes de l'écriture d'un texte.
  reponse:
    elements:
    - id: a
      texte: Je liste mes idées en vrac et je choisis un ordre logique
    - id: b
      texte: Je rédige un brouillon en suivant ce plan
    - id: c
      texte: Je révise le brouillon (sens, puis grammaire, puis vocabulaire)
    - id: d
      texte: Je recopie mon texte au propre
  indices:
    relance: Quelle est la toute première étape, avant même d'écrire une phrase ?
    methode: On organise d'abord ses idées, puis on rédige, puis on révise, puis on recopie au propre.
    etape: On commence toujours par la planification des idées.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre le travail (planifier) et celle qui le ferme (recopier au propre).
  solution: On planifie ses idées, puis on rédige un brouillon, puis on révise, puis on recopie le texte final au propre.
- id: outil-selon-objectif
  type: association
  difficulte: 2
  enonce: Relie chaque objectif de révision à ce qu'on vérifie précisément.
  reponse:
    gauche:
    - id: a
      texte: Je révise le sens et l'organisation des idées
    - id: b
      texte: Je révise la grammaire et l'orthographe
    - id: c
      texte: Je révise le vocabulaire
    droite:
    - id: x
      texte: Je vérifie que mes idées sont dans un ordre logique et que le texte répond bien au sujet
    - id: y
      texte: Je vérifie les accords, la conjugaison et l'orthographe des mots
    - id: z
      texte: Je vérifie que je n'ai pas répété le même mot trop souvent et que mes mots sont précis
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque objectif, demande-toi si on regarde le contenu global, les règles de la langue, ou le choix des mots.
    methode: Le sens concerne l'organisation générale, la grammaire concerne les règles, le vocabulaire concerne le choix précis des mots.
    etape: Commence par la révision du sens, la plus globale, avant les révisions plus fines.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à ce que chaque type de révision vérifie précisément.
  - si:
      diagnostic: associations_fausses
    relance: Repars de la révision du sens, la plus globale, puis distingue grammaire et vocabulaire.
  solution: La révision du sens vérifie l'organisation des idées. La révision de la grammaire vérifie les accords et l'orthographe. La révision du vocabulaire vérifie les répétitions et la précision des mots.
- id: strategie-trouver-idees
  type: choix
  difficulte: 1
  enonce: Une élève doit écrire sur « Une journée dans un port ». Quelle stratégie l'aide à trouver des idées avant d'écrire ?
  reponse:
    options:
    - id: a
      texte: Écrire au centre d'une feuille « le port » et noter autour tous les mots qui lui viennent
    - id: b
      texte: Recopier au propre un texte déjà écrit
    - id: c
      texte: Vérifier l'orthographe de chaque mot dans le dictionnaire
    bonnes:
    - a
  indices:
    relance: 'À quel moment du travail cherche-t-on des idées : avant ou après avoir écrit ?'
    methode: Pour trouver des idées, on note tout ce qui vient, sans trier, ou on fait un schéma d'idées.
    etape: Regarde quelle proposition permet de produire des idées et non de corriger du texte déjà écrit.
  pieges:
  - si:
      contient:
      - b
    relance: Recopier un texte ne donne pas d'idées nouvelles. On cherche des idées avant de rédiger.
  - si:
      contient:
      - c
    relance: Le dictionnaire sert à réviser l'orthographe, après avoir écrit. Ici on cherche des idées, avant d'écrire.
  solution: La carte mentale (le sujet au centre, les idées autour) est une stratégie pour trouver des idées avant de rédiger.
- id: outil-orthographe
  type: texte_court
  difficulte: 1
  enonce: Quel livre consultes-tu pour vérifier l'orthographe d'un mot pendant la révision de ton brouillon ?
  reponse:
    acceptees:
    - dictionnaire
    - le dictionnaire
    - un dictionnaire
    fautes_tolerees: 1
  indices:
    relance: Quel livre donne l'orthographe et le sens des mots, classés par ordre alphabétique ?
    methode: C'est un outil de révision que l'on trouve en classe, à la maison et sur Internet.
    etape: Le mot commence par la lettre d et désigne un livre de mots classés de A à Z.
  pieges:
  - si:
      valeur: grammaire
    relance: Un livre de grammaire explique les règles, mais pas l'orthographe de chaque mot. Quel livre classe tous les mots de A à Z ?
  solution: Le dictionnaire donne l'orthographe d'un mot, son sens et parfois sa famille de mots.
- id: passage-de-revision
  type: choix
  difficulte: 2
  enonce: Une élève relit son brouillon pour vérifier que les idées sont dans un ordre logique. Quel objectif de révision poursuit-elle ?
  reponse:
    options:
    - id: a
      texte: Le sens et l'organisation
    - id: b
      texte: L'orthographe des mots
    - id: c
      texte: Le choix des mots précis
    bonnes:
    - a
  indices:
    relance: Cette élève regarde-t-elle des mots isolés ou l'ensemble du texte ?
    methode: Certains objectifs de révision portent sur l'ensemble des idées et de leur ordre ; d'autres portent sur les mots un par un.
    etape: 'Ici, on vérifie l''ordre des idées : cela concerne le texte dans son ensemble.'
  pieges:
  - si:
      contient:
      - b
    relance: L'orthographe concerne l'écriture correcte de chaque mot. Ici, on vérifie l'ordre des idées.
  - si:
      contient:
      - c
    relance: Le choix des mots concerne le vocabulaire. Ici, on vérifie l'ordre des idées.
  solution: Vérifier l'ordre des idées relève du sens et de l'organisation, le premier passage de révision.
- id: planifier-et-reviser
  type: ouverte
  difficulte: 3
  enonce: Tu dois écrire un texte de dix lignes intitulé « Le jour où tout a changé au collège » (sujet inventé). Écris d'abord un plan en quatre lignes, puis explique en deux ou trois phrases comment tu réviseras ton brouillon (quels passages de relecture, quels outils).
  criteres:
  - Le plan comporte quatre parties dans un ordre logique (chronologique ou autre, justifié).
  - La révision est décrite en plusieurs passages, chacun avec un objectif différent (sens, orthographe, vocabulaire).
  - Au moins un outil de révision est cité (dictionnaire, grille de relecture, relecture à voix haute...).
  indices:
    relance: Que se passe-t-il au début, au milieu et à la fin de ton texte ?
    methode: 'Fais un plan chronologique : situation de départ, événement, conséquence, fin. Puis dis dans quel ordre tu relis.'
    etape: 'Exemple de plan : 1. le matin ordinaire ; 2. l''événement surprenant ; ... Complète.'
  solution: 'Exemple : plan (1 le matin ordinaire, 2 l''annonce surprise, 3 les réactions, 4 la fin de la journée). Révision : d''abord je relis le sens et l''ordre, ensuite j''accorde sujets et verbes, enfin je remplace les mots vagues, avec le dictionnaire et une relecture à voix haute.'
