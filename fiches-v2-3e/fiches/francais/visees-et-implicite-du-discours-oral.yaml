    relance: Rien dans la phrase ne parle de colère.
  solution: « Arrêter de mentir » présuppose qu'il mentait auparavant.
- id: expliquer-implicite-ironie
  type: ouverte
  difficulte: 3
  enonce: 'Un élève dit, en regardant la pluie tomber le jour de la sortie scolaire : « Super, quel temps magnifique pour
    un pique-nique ! » Explique ce qui est dit, ce qui est réellement compris, et comment on le sait.'
  criteres:
  - L'élève distingue le sens littéral (le temps est magnifique) du sens réellement compris (le temps est mauvais, l'élève
    est déçu).
  - L'élève nomme le procédé (ironie) et s'appuie sur des indices (la pluie, le contexte, le ton).
  - L'élève rédige une explication claire et organisée, en phrases complètes.
  indices:
    relance: Le temps est-il vraiment magnifique ?
    methode: 'Écris trois parties : ce qui est dit, ce qui est compris, l''indice qui le montre.'
    etape: Pense au mot qui désigne le fait de dire le contraire de ce qu'on pense.
  solution: 'Ce qui est dit : le temps est magnifique. Ce qui est compris : il pleut et l''élève est déçu. C''est de l''ironie
    : le contexte (la pluie) et le ton contredisent les mots.'
