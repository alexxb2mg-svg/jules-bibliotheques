format: 2
notion: visees-et-implicite-du-discours-oral
version: 2
etat: verifiee
declencheurs:
- comprendre ce qu'un discours veut vraiment dire
- deviner un sous-entendu à l'oral
- hiérarchiser les infos d'un exposé
- repérer le but d'un orateur
- comprendre ce que dit l'orateur
- ce que la personne veut dire
- dire le contraire de ce qu'on pense
- idée cachée dans un discours
prerequis: []
essentiel: 'Un discours oral (exposé, interview, discours politique, publicité radio, débat) cherche toujours à produire un
  effet sur son auditeur. Cet effet est sa visée. Les principales visées sont : informer (donner des faits), expliquer, convaincre
  (faire changer d''avis par des arguments), persuader (toucher par les émotions), divertir, inciter à agir.


  Un discours a souvent plusieurs visées. Une publicité informe sur un produit, mais elle veut surtout persuader d''acheter.
  Pour les repérer, on observe : qui parle, à qui, dans quelle situation, avec quel ton, et quels mots reviennent.


  Hiérarchiser les informations : à l''oral, on ne peut pas relire. Il faut donc distinguer l''information principale (l''idée
  essentielle, souvent annoncée au début ou répétée à la fin) des informations secondaires (exemples, détails, anecdotes).
  On prend des notes courtes : mots-clés, chiffres, dates, et on les classe par importance.


  L''implicite est ce qui n''est pas dit directement mais qu''on doit comprendre. Il y a deux grands cas :

  - le présupposé : une idée contenue dans la phrase comme si elle était déjà admise. « Il a arrêté de mentir » présuppose
  qu''il mentait avant.

  - le sous-entendu : une idée suggérée que l''auditeur déduit du contexte. « Il fait un peu froid ici... » peut vouloir dire
  « ferme la fenêtre ».


  L''implicite passe aussi par le ton (l''ironie : dire le contraire de ce qu''on pense), l''insistance, les silences, les
  gestes, l''humour.


  Pour expliquer un implicite, on écrit : ce qui est dit, ce qui est compris, et ce qui permet de le comprendre (un mot, un
  ton, le contexte). Le locuteur peut ainsi influencer l''auditeur sans jamais l''affirmer clairement.


  Ce qu''on attend : identifier la visée d''un discours entendu, dire l''information principale et expliquer un implicite
  avec des indices précis.'
methode:
- 'Se demander qui parle, à qui, dans quelle situation, et ce que l''orateur veut obtenir : c''est la visée.'
- Écouter en notant des mots-clés, des chiffres et des dates plutôt que des phrases entières.
- Distinguer l'information principale, souvent annoncée ou répétée, des informations secondaires.
- 'Repérer les indices de l''implicite : mots présupposant une idée, ton ironique, insistance, contexte.'
- 'Formuler l''implicite en trois temps : ce qui est dit, ce qui est compris, l''indice qui le montre.'
- Résumer l'idée essentielle en une phrase.
vocabulaire:
- terme: visée
  definition: l'effet qu'un discours cherche à produire sur celui qui l'écoute (informer, convaincre, persuader, divertir...)
- terme: implicite
  definition: ce qui n'est pas dit directement mais qu'on doit comprendre
- terme: présupposé
  definition: idée contenue dans une phrase comme si elle était déjà admise
- terme: sous-entendu
  definition: idée suggérée sans être dite, que l'auditeur déduit du contexte
- terme: ironie
  definition: manière de dire le contraire de ce qu'on pense, pour se moquer ou critiquer
- terme: convaincre
  definition: faire changer d'avis par des arguments logiques
- terme: persuader
  definition: faire agir ou changer d'avis en touchant les émotions
- terme: information principale
  definition: l'idée essentielle du discours, par opposition aux détails
erreurs_frequentes:
- 'Croire qu''un discours n''a qu''une seule visée : il peut informer et persuader à la fois.'
- Prendre au pied de la lettre une phrase ironique.
- Confondre présupposé (idée déjà admise dans la phrase) et sous-entendu (idée suggérée par le contexte).
- Noter tous les détails au lieu de distinguer l'information principale.
- Expliquer un implicite sans citer d'indice précis.
exemple:
  enonce: 'Un professeur dit à un élève en souriant à peine, d''un ton froid : « Ah, quelle bonne idée d''arriver à cette
    heure-ci. » Explique en une phrase ce que cette phrase suggère réellement.'
  solution: Le ton froid et le sourire à peine esquissé contredisent le sens positif des mots ; la phrase est ironique et
    suggère en réalité un reproche pour le retard de l'élève.
exercices:
- id: reconnaitre-implicite
  type: choix
  difficulte: 1
  enonce: 'Un camarade dit, d''un ton sec en soupirant : « Génial, encore un contrôle surprise. » Que veut-il vraiment dire
    ?'
  reponse:
    options:
    - id: a
      texte: Il exprime son mécontentement de façon ironique, malgré le mot « génial »
    - id: b
      texte: Il est sincèrement content d'avoir un contrôle surprise
    - id: c
      texte: Il ne donne aucune information sur son état d'esprit
    - id: d
      texte: Il parle d'un autre sujet que le contrôle
    bonnes:
    - a
  indices:
    relance: Le ton (sec, soupir) correspond-il au sens habituellement positif du mot « génial » ?
    methode: Quand le ton contredit le sens des mots, c'est souvent de l'ironie qui exprime le contraire de ce qui est dit.
    etape: Repère l'indice du ton (sec, soupir) qui contredit le mot « génial ».
  pieges:
  - si:
      contient:
      - b
    relance: Le ton sec et le soupir contredisent une vraie satisfaction. Que suggèrent-ils plutôt ?
  - si:
      contient:
      - c
    relance: Le ton donne justement une information forte sur son état d'esprit. Laquelle ?
  - si:
      contient:
      - d
    relance: La phrase parle bien du contrôle surprise ; ce qui change, c'est le sens réel derrière les mots.
  solution: Le ton sec et le soupir contredisent le mot « génial » ; le camarade exprime en réalité son mécontentement de
    façon ironique.
- id: mot-visee
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le but recherché par une personne qui parle (informer, convaincre, faire rire, émouvoir) ?
  reponse:
    acceptees:
    - visée
    - visee
    fautes_tolerees: 1
  indices:
    relance: C'est ce qu'on cherche à obtenir en s'exprimant, pas ce qu'on dit exactement.
    methode: Le mot vient du verbe « viser », comme quand on vise une cible.
    etape: Le mot commence par « vis- » et se termine par « -ée ».
  pieges:
  - si:
      valeur: contenu
    relance: Le contenu est ce qui est dit ; le mot cherché désigne plutôt le but recherché en le disant.
  solution: 'La visée : le but recherché par une personne qui s''exprime (informer, convaincre, faire rire, émouvoir).'
- id: hierarchie-informations-expose
  type: ordre
  difficulte: 2
  enonce: Un élève écoute un exposé sur le recyclage. Range dans l'ordre logique les étapes pour hiérarchiser les informations
    entendues.
  reponse:
    elements:
    - id: a
      texte: J'écoute l'exposé en entier sans prendre de notes trop détaillées
    - id: b
      texte: Je repère l'idée principale annoncée par l'orateur
    - id: c
      texte: Je distingue les exemples ou détails qui illustrent cette idée
    - id: d
      texte: Je résume l'essentiel en une ou deux phrases
  indices:
    relance: Quelle est la toute première chose à faire pendant un exposé, avant de trier les informations ?
    methode: On écoute d'abord globalement, puis on repère l'idée principale, puis les détails, puis on résume.
    etape: On commence toujours par une écoute globale, sans se disperser dans les détails trop tôt.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre l'écoute (écouter globalement) et celle qui la ferme (résumer).
  solution: On écoute d'abord globalement, puis on repère l'idée principale, puis on distingue les détails, puis on résume
    l'essentiel.
- id: visee-selon-discours
  type: association
  difficulte: 2
  enonce: Relie chaque situation orale à sa visée principale.
  reponse:
    gauche:
    - id: a
      texte: Un présentateur annonce la météo du jour
    - id: b
      texte: Un candidat fait un discours pour être élu délégué de classe
    - id: c
      texte: Un camarade raconte une blague à la récréation
    droite:
    - id: x
      texte: Informer, donner des faits vérifiables
    - id: y
      texte: Convaincre, chercher à obtenir l'adhésion des auditeurs
    - id: z
      texte: Faire rire, provoquer une réaction amusée
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque situation, demande-toi ce que la personne cherche à obtenir de son auditoire.
    methode: La météo informe, le discours électoral cherche à convaincre, la blague cherche à amuser.
    etape: Commence par la météo, la visée la plus facile à repérer.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à ce que chaque personne cherche vraiment à obtenir.
  - si:
      diagnostic: associations_fausses
    relance: Repars de la météo, qui informe clairement, puis distingue discours électoral et blague.
  solution: La météo informe. Le discours électoral cherche à convaincre. La blague cherche à faire rire.
- id: nblm-dans-un-discours-oral-comment-definit-on-1
  type: choix
  difficulte: 2
  enonce: Dans un discours oral, comment définit-on la « visée » de l'orateur ?
  reponse:
    options:
    - id: o1
      texte: Le but recherché par celui qui parle (informer, convaincre, émouvoir).
    - id: o2
      texte: L'ensemble des mots compliqués utilisés dans l'exposé.
    - id: o3
      texte: Le simple contenu documentaire ou le sujet exact du discours.
    - id: o4
      texte: Le nombre de minutes que dure la prise de parole.
    bonnes:
    - o1
  indices:
    relance: Pense à ce que l'orateur cherche à obtenir de son auditoire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, cela correspond au niveau de vocabulaire, pas au but poursuivi par l'orateur.
  - si:
      contient:
      - o3
    relance: C'est une erreur fréquente de confondre la visée (l'intention) avec le simple sujet du discours.
  - si:
      contient:
      - o4
    relance: Faux, la durée est une contrainte temporelle, non l'objectif de la parole.
  solution: 'Le but recherché par celui qui parle (informer, convaincre, émouvoir). C''est exact : la visée désigne l''objectif
    ou le but poursuivi par l''orateur.'
- id: nblm-qu-est-ce-que-l-implicite-dans-un-messag-2
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que l'« implicite » dans un message ou un discours oral ?
  reponse:
    options:
    - id: o1
      texte: Ce qui est suggéré par le discours sans être dit clairement avec des mots.
    - id: o2
      texte: Les informations chiffrées citées directement par l'orateur.
    - id: o3
      texte: Le titre exact de l'exposé inscrit au tableau.
    - id: o4
      texte: Les hésitations grammaticales faites par l'orateur.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la différence entre ce qui est dit ouvertement et ce qui est suggéré.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, les chiffres cités directement font partie des informations explicites.
  - si:
      contient:
      - o3
    relance: Attention, le titre écrit est un élément explicite et direct, pas un sous-entendu.
  - si:
      contient:
      - o4
    relance: Faux, les hésitations relèvent de la forme orale, pas du sens sous-entendu du message.
  solution: 'Ce qui est suggéré par le discours sans être dit clairement avec des mots. C''est exact : l''implicite désigne
    ce qui est sous-entendu par le ton, le contexte ou des indices.'
- id: nblm-en-quoi-consiste-l-action-de-hierarchise-3
  type: choix
  difficulte: 2
  enonce: En quoi consiste l'action de « hiérarchiser » les informations d'un exposé oral ?
  reponse:
    options:
    - id: o1
      texte: Distinguer les idées principales des détails secondaires pour ne retenir que l'essentiel.
    - id: o2
      texte: Recopier mot à mot l'intégralité du discours prononcé par l'orateur.
    - id: o3
      texte: Mémoriser uniquement la phrase de conclusion de l'exposé.
    - id: o4
      texte: Compter le nombre d'exemples cités durant l'intervention.
    bonnes:
    - o1
  indices:
    relance: Pense à la manière de trier ce qui est capital de ce qui est accessoire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, tout noter sans trier est l'inverse de la hiérarchisation ; c'est une erreur fréquente d'écoute.
  - si:
      contient:
      - o3
    relance: Faux, la conclusion ne contient pas à elle seule toute l'organisation du discours.
  - si:
      contient:
      - o4
    relance: Faux, compter les exemples ne permet pas d'évaluer la valeur des idées.
  solution: 'Distinguer les idées principales des détails secondaires pour ne retenir que l''essentiel. Exactement : hiérarchiser
    signifie trier les informations selon leur importance.'
- id: nblm-si-un-orateur-dit-bravo-on-est-encore-en-4
  type: choix
  difficulte: 2
  enonce: Si un orateur dit « Bravo, on est encore en retard ! » d'un ton sec, que traduit ce discours ?
  reponse:
    options:
    - id: o1
      texte: L'expression d'une ironie traduisant en réalité un reproche.
    - id: o2
      texte: Une véritable félicitation chaleureuse pour la ponctualité.
    - id: o3
      texte: Une demande d'information sur l'heure exacte de la journée.
    - id: o4
      texte: Un compliment destiné à encourager l'auditoire.
    bonnes:
    - o1
  indices:
    relance: Observe l'écart entre le sens littéral des mots et le ton employé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, c'est une erreur fréquente de prendre au sens strict des paroles dites sur un ton ironique.
  - si:
      contient:
      - o3
    relance: Faux, l'orateur ne cherche pas à savoir l'heure mais exprime un jugement.
  - si:
      contient:
      - o4
    relance: Faux, le ton sec contredit la notion d'encouragement.
  solution: 'L''expression d''une ironie traduisant en réalité un reproche. C''est juste : la contradiction entre le mot «
    Bravo » et le ton sec indique un reproche implicite.'
- id: nblm-parmi-ces-elements-lequel-est-un-indice-5
  type: choix
  difficulte: 2
  enonce: Parmi ces éléments, lequel est un indice majeur pour repérer l'implicite lors d'une écoute orale ?
  reponse:
    options:
    - id: o1
      texte: Le ton de la voix, l'insistance ou les silences de l'orateur.
    - id: o2
      texte: La couleur de la feuille sur laquelle l'exposé est écrit.
    - id: o3
      texte: Le nombre exact de pages du livre étudié.
    - id: o4
      texte: La police de caractères choisie sur le diaporama.
    bonnes:
    - o1
  indices:
    relance: Cherche ce qui touche à la voix et à la prononciation de celui qui parle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, la couleur du papier n'apporte aucune indication sur le sens oral.
  - si:
      contient:
      - o3
    relance: Faux, le nombre de pages est une donnée factuelle extérieure au discours oral.
  - si:
      contient:
      - o4
    relance: Faux, la police de caractères est un détail visuel et non un indice sonore.
  solution: 'Le ton de la voix, l''insistance ou les silences de l''orateur. Exact : le ton, l''intonation, le rythme et les
    pauses sont des indices clés pour déceler le sous-entendu.'
- id: nblm-quelles-sont-les-deux-bonnes-attitudes-m-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX bonnes attitudes méthodologiques pour analyser un discours oral ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Écouter le discours en entier pour repérer sa structure générale.
    - id: o2
      texte: Repérer les indices comme le ton ou la contradiction entre mots et attitude.
    - id: o3
      texte: Ne retenir que les anecdotes amusantes sans écouter l'idée principale.
    - id: o4
      texte: S'arrêter de prendre des notes dès le début de l'intervention.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux démarches préconisées dans la méthode d'écoute réflexive.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : s''arrêter aux anecdotes empêche de saisir la visée globale du discours.'
  - si:
      contient:
      - o4
    relance: 'Faux : interrompre son écoute empêche de comprendre la hiérarchie des idées.'
  solution: 'Écouter le discours en entier pour repérer sa structure générale ; Repérer les indices comme le ton ou la contradiction
    entre mots et attitude. Exact : il faut écouter le discours dans sa totalité avant de juger sa structure et sa visée.'
- id: nblm-dans-un-discours-argumentatif-oral-l-ens-7
  type: texte_court
  difficulte: 1
  enonce: Dans un discours argumentatif oral, l'ensemble des idées logiques apportées pour soutenir la thèse s'appellent les
    ___.
  reponse:
    acceptees:
    - arguments
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne les preuves ou raisons logiques utilisées par l'orateur pour convaincre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'arguments. C''est exact : dans un discours argumentatif, on distingue la thèse, les arguments et les exemples.'
- id: nblm-lorsqu-un-orateur-fait-comprendre-une-id-8
  type: texte_court
  difficulte: 1
  enonce: Lorsqu'un orateur fait comprendre une idée sans la dire directement avec des mots, on dit que cette idée est ___.
  reponse:
    acceptees:
    - implicite
    fautes_tolerees: 1
  indices:
    relance: C'est l'adjectif contraire d'« explicite ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'implicite. C''est exact : ce qui est suggéré sans être dit clairement avec des mots est qualifié d''implicite.'
- id: visee-publicite
  type: choix
  difficulte: 1
  enonce: 'Une publicité à la radio dit : « Ne manquez pas notre offre exceptionnelle, seulement jusqu''à samedi ! » Quelle
    est sa visée principale ?'
  reponse:
    options:
    - id: a
      texte: Divertir uniquement
    - id: b
      texte: Inciter à acheter en persuadant
    - id: c
      texte: Informer de façon neutre
    - id: d
      texte: Faire un compte rendu
    bonnes:
    - b
  indices:
    relance: Qui parle ? Un vendeur. Que veut-il obtenir de l'auditeur ?
    methode: Les mots « ne manquez pas » et « seulement jusqu'à samedi » poussent à agir vite.
    etape: Cherche la visée qui pousse l'auditeur à faire quelque chose.
  pieges:
  - si:
      contient:
      - a
    relance: La publicité peut amuser, mais ce n'est pas son but principal. Que veut obtenir le vendeur ?
  - si:
      contient:
      - c
    relance: Une information neutre ne pousserait pas à agir vite. Relis « ne manquez pas ».
  - si:
      contient:
      - d
    relance: Un compte rendu rapporte des faits sans chercher à faire agir. Ici, on veut faire acheter.
  solution: 'La publicité cherche à persuader et à inciter à acheter : « ne manquez pas » et « jusqu''à samedi » poussent
    à agir.'
- id: nom-implicite-suggere
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on une idée suggérée que l'auditeur doit déduire du contexte, sans qu'elle soit dite ? (« Il fait
    un peu froid ici... » pour demander de fermer la fenêtre)
  reponse:
    acceptees:
    - sous-entendu
    - un sous-entendu
    - sous entendu
    fautes_tolerees: 1
  indices:
    relance: Ce mot se compose de « sous » et du verbe « entendre ».
    methode: 'Ce n''est pas le présupposé (idée déjà admise dans la phrase) : ici, l''idée est suggérée.'
    etape: Le mot commence par « sous- » et contient « entendu ».
  pieges:
  - si:
      valeur: presuppose
    relance: 'Le présupposé est une idée contenue dans la phrase comme déjà admise. Ici, l''idée est suggérée : quel autre
      mot convient ?'
  solution: 'C''est un sous-entendu : l''idée n''est pas dite, l''auditeur la déduit du contexte.'
- id: presuppose-phrase
  type: choix
  difficulte: 3
  enonce: Dans la phrase « Il a enfin arrêté de mentir », quelle idée est présupposée ?
  reponse:
    options:
    - id: a
      texte: Il ment encore aujourd'hui
    - id: b
      texte: Il mentait avant
    - id: c
      texte: Il n'a jamais menti
    - id: d
      texte: Il est en colère
    bonnes:
    - b
  indices:
    relance: Le verbe « arrêter » dit qu'une action s'est terminée.
    methode: Pour arrêter de faire quelque chose, il faut avoir déjà commencé à le faire.
    etape: Que faisait cette personne avant d'arrêter ?
  pieges:
  - si:
      contient:
      - a
    relance: Si « il a arrêté », l'action est terminée. Peut-il encore mentir aujourd'hui ?
  - si:
      contient:
      - c
    relance: « Arrêter » suppose que l'action a existé. Cette réponse dit le contraire.
  - si:
