  reponse:
    options:
    - id: o1
      texte: Étudier l'œuvre littéraire sans faire aucun lien avec les connaissances vues en cours d'histoire.
    - id: o2
      texte: Confondre un régime totalitaire avec un simple gouvernement autoritaire temporaire.
    - id: o3
      texte: Relier le roman étudié aux événements historiques du XXe siècle.
    - id: o4
      texte: Comparer un texte littéraire à un tableau ou un film sur la même période.
    bonnes:
    - o1
