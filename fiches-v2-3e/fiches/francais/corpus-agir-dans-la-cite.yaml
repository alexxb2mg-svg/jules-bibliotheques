# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: corpus-agir-dans-la-cite
version: 2
etat: generee
declencheurs:
- roman sur la guerre totale
- lecture d'une oeuvre sur le totalitarisme
- film sur l'entre-deux-guerres
- œuvre sur les guerres mondiales
- livre sur la déportation
- roman sur une dictature
- tableau sur la guerre
- littérature et Seconde Guerre mondiale
prerequis:
- litterature-et-histoire-xxe-siecle
essentiel: |
  Ce corpus relie la littérature à l'histoire du XXe siècle. Le programme de 3e demande de lire une œuvre entière, ou une partie importante d'une œuvre, qui porte un regard sur l'histoire du siècle : les guerres mondiales, la société de l'entre-deux-guerres, les régimes fascistes et totalitaires. C'est la lecture intégrale, en lien avec le cours d'histoire (« L'Europe, un théâtre majeur des guerres totales »).

  Les repères à avoir en tête : la Première Guerre mondiale (1914-1918), l'entre-deux-guerres (1918-1939), puis la Seconde Guerre mondiale (1939-1945). Dans l'entre-deux-guerres se mettent en place des régimes autoritaires, fascistes ou totalitaires : l'URSS de Staline, l'Italie fasciste de Mussolini, l'Allemagne nazie de Hitler (au pouvoir en 1933).

  Un régime totalitaire contrôle toute la vie de la population, supprime les libertés, fait régner la propagande et la peur. Le régime nazi est aussi à l'origine du génocide des Juifs d'Europe.

  Pourquoi lire des œuvres sur cette période ? Un témoin peut raconter ce qu'il a vécu (par exemple Le Feu de Barbusse sur la guerre des tranchées, ou Si c'est un homme de Primo Levi sur la déportation). Un romancier peut inventer une fiction pour avertir : 1984 de George Orwell imagine un pouvoir qui surveille tout le monde. La littérature ne remplace pas le cours d'histoire : elle donne à voir et à ressentir, avec un point de vue.

  Le corpus peut aussi réunir d'autres genres (poème, théâtre, récit), des œuvres picturales et des extraits de films. Exemples : le tableau Guernica de Picasso (1937), qui dénonce le bombardement d'une ville espagnole, ou le film Le Dictateur de Chaplin (1940), qui se moque d'un dictateur.

  Ce qu'on attend au brevet : situer l'œuvre dans son contexte historique, dire quel événement ou quel régime elle évoque, identifier le point de vue de l'auteur (témoin, fiction, dénonciation) et montrer ce que l'œuvre apporte de plus que le cours d'histoire.
methode:
- 'Situer l''œuvre : qui l''a écrite (ou peinte, filmée), quand, et sur quel événement historique elle porte (guerre,
  régime totalitaire, entre-deux-guerres).'
- 'Faire le lien avec le cours d''histoire de 3e sur la même période : dates, acteurs, lieux.'
- 'Identifier le point de vue : témoin qui raconte ce qu''il a vécu, narrateur fictif, auteur qui dénonce ou avertit.'
- 'Relever ce que l''œuvre fait ressentir (peur, révolte, compassion) et par quels moyens : récit, images, couleurs,
  mise en scène.'
- 'Comparer, si le corpus le permet, un texte à un tableau ou à un film sur le même sujet : chaque art choisit ses
  propres moyens.'
- 'Conclure sur ce que l''œuvre apporte de plus que le cours d''histoire : elle donne un regard, une émotion, un
  avertissement.'
vocabulaire:
- terme: totalitarisme
  definition: régime politique qui contrôle toute la vie de la population et supprime les libertés
- terme: lecture intégrale
  definition: lecture complète d'une œuvre, du début à la fin, plutôt qu'un simple extrait
- terme: entre-deux-guerres
  definition: période qui va de la fin de la Première Guerre mondiale (1918) au début de la Seconde (1939)
- terme: propagande
  definition: ensemble des moyens qu'un pouvoir utilise pour imposer ses idées à la population
- terme: témoignage
  definition: récit fait par une personne qui a vécu elle-même les événements
- terme: dictature
  definition: régime où le pouvoir est détenu par une seule personne ou un seul groupe, sans contrôle ni liberté
- terme: fascisme
  definition: régime autoritaire et nationaliste qui s'installe en Italie avec Mussolini dans les années 1920
- terme: génocide
  definition: destruction volontaire et organisée d'un groupe humain en tant que tel
erreurs_frequentes:
- Étudier l'œuvre sans faire aucun lien avec ce qu'on sait de l'histoire sur la même période.
- Croire que seule la littérature parle des guerres mondiales, en oubliant la peinture et le cinéma.
- Confondre un régime totalitaire, qui supprime les libertés, avec un simple gouvernement autoritaire temporaire.
- 'Prendre une fiction (comme 1984) pour un récit historique : c''est un roman qui avertit, pas un témoignage.'
- Raconter l'histoire du roman sans dire quel regard l'auteur porte sur l'époque.
exemple:
  enonce: Explique en une phrase pourquoi ce corpus se travaille en lien avec le programme d'histoire de 3e.
  solution: Parce que les oeuvres étudiées portent sur les mêmes événements que ceux vus en histoire, comme les
    guerres mondiales ou les régimes totalitaires en Europe.
exercices:
- id: definir-totalitarisme
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un régime totalitaire ?
  reponse:
    options:
    - id: a
      texte: Un régime politique qui contrôle toute la vie de la population et supprime les libertés
    - id: b
      texte: Un régime qui organise des élections libres régulières
    - id: c
      texte: Une simple monarchie traditionnelle sans armée
    - id: d
      texte: Un régime qui laisse une totale liberté de la presse
    bonnes:
    - a
  indices:
    relance: Pense à un régime qui surveille les citoyens et interdit toute critique du pouvoir.
    methode: Élimine les définitions qui parlent de liberté ou d'élections, car un régime totalitaire les supprime.
    etape: La bonne réponse parle de contrôle total et de suppression des libertés.
  pieges:
  - si:
      contient:
      - b
    relance: 'Un régime totalitaire ne permet pas d''élections vraiment libres : c''est l''inverse de ce régime.'
  - si:
      contient:
      - c
    relance: Une monarchie traditionnelle n'est pas la même chose qu'un régime totalitaire, qui contrôle toute la
      population.
  - si:
      contient:
      - d
    relance: Un régime totalitaire supprime justement la liberté de la presse, il ne la permet pas.
  solution: Un régime totalitaire est un régime politique qui contrôle toute la vie de la population et supprime
    les libertés.
- id: type-de-lecture
  type: texte_court
  difficulte: 2
  enonce: Quelle expression désigne la lecture complète d'une oeuvre, du début à la fin, comme dans ce corpus ?
  reponse:
    acceptees:
    - lecture integrale
    - lecture-integrale
    fautes_tolerees: 2
  indices:
    relance: Cette expression s'oppose à la lecture d'un simple extrait ou d'un groupement de textes courts.
    methode: Cherche l'expression en deux mots qui signifie « lire l'oeuvre en entier ».
    etape: Le premier mot est « lecture », le second commence par « inté- ».
  pieges:
  - si:
      valeur: lecture cursive
    relance: La lecture cursive est une lecture plus libre, souvent en dehors de la classe. Cherche l'autre expression,
      pour une lecture complète en classe.
  solution: 'L''expression est lecture intégrale : lire l''oeuvre en entier, du début à la fin.'
- id: chronologie-periode
  type: ordre
  difficulte: 2
  enonce: Range ces trois périodes du XXe siècle de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: premiere-guerre
      texte: La Première Guerre mondiale, 1914-1918
    - id: entre-deux-guerres
      texte: La société de l'entre-deux-guerres et la montée des régimes totalitaires
    - id: seconde-guerre
      texte: La Seconde Guerre mondiale, 1939-1945
  indices:
    relance: La Première Guerre mondiale a lieu avant la période appelée « entre-deux-guerres ».
    methode: Range d'abord la Première Guerre mondiale, puis l'entre-deux-guerres, puis la Seconde Guerre mondiale.
    etape: L'entre-deux-guerres se situe justement entre les deux guerres mondiales, comme son nom l'indique.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux périodes voisines sont inversées. Laquelle des deux vient en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la période la plus ancienne (1914-1918), puis la plus récente (1939-1945).
  solution: La Première Guerre mondiale (1914-1918) est suivie par l'entre-deux-guerres, puis par la Seconde Guerre
    mondiale (1939-1945).
- id: arts-et-histoire
  type: association
  difficulte: 2
  enonce: Associe chaque art à un exemple de production qui peut porter un regard sur le XXe siècle.
  reponse:
    gauche:
    - id: a
      texte: La littérature
    - id: b
      texte: La peinture
    - id: c
      texte: Le cinéma
    droite:
    - id: x
      texte: Un roman ou un récit
    - id: y
      texte: Un tableau
    - id: z
      texte: Un film
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Chaque art a sa propre forme d''oeuvre : un texte, une image peinte, ou une image animée.'
    methode: Associe d'abord la littérature au roman, puis la peinture au tableau, puis le cinéma au film.
    etape: La littérature produit des romans ou récits, la peinture des tableaux, le cinéma des films.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien quel art correspond à quelle forme d'oeuvre.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque art un par un, en pensant à la forme d'oeuvre qu'il produit.
  solution: La littérature produit des romans ou récits, la peinture des tableaux, le cinéma des films, tous pouvant
    porter un regard sur le XXe siècle.
- id: lien-histoire-litterature
  type: ouverte
  difficulte: 3
  enonce: Choisis une oeuvre étudiée en classe sur le XXe siècle et explique le lien qu'elle entretient avec le
    programme d'histoire.
  criteres:
  - L'élève cite une oeuvre précise étudiée en classe, liée au XXe siècle.
  - L'élève explique à quel événement historique cette oeuvre se rattache (guerre, régime totalitaire...).
  - L'élève établit un lien avec ce qui est étudié en cours d'histoire sur la même période.
  indices:
    relance: À quel événement du programme d'histoire de 3e cette oeuvre fait-elle penser ?
    methode: Nomme d'abord l'oeuvre, puis l'événement historique auquel elle se rattache, puis le lien avec le cours
      d'histoire.
    etape: Tu peux commencer ainsi « Cette oeuvre parle de..., ce qui rejoint ce qu'on étudie en histoire sur...
      ».
  solution: Par exemple, un récit qui raconte la vie de soldats dans les tranchées de la Première Guerre mondiale
    rejoint directement le thème étudié en histoire des guerres totales en Europe, en donnant un point de vue vécu
    sur des événements que l'on étudie aussi par les dates et les cartes.
- id: oeuvres-et-evenements
  type: association
  difficulte: 2
  enonce: Associe chaque œuvre à l'événement ou au régime dont elle parle.
  reponse:
    gauche:
    - id: a
      texte: Le Feu, de Henri Barbusse
    - id: b
      texte: Si c'est un homme, de Primo Levi
    - id: c
      texte: 1984, de George Orwell
    droite:
    - id: x
      texte: La vie des soldats dans les tranchées de la Première Guerre mondiale
    - id: y
      texte: La déportation dans un camp nazi
    - id: z
      texte: Un pouvoir totalitaire qui surveille tout (fiction)
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une de ces œuvres est un roman d'anticipation, une autre parle de 14-18, une autre des camps.
    methode: Repère d'abord l'œuvre qui invente un pays imaginaire, puis celle écrite par un ancien déporté.
    etape: Barbusse a lui-même combattu en 1914-1918. Primo Levi raconte ce qu'il a vécu. Orwell invente un régime.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Demande-toi pour chaque œuvre si son auteur raconte du vécu ou invente.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque œuvre une par une : quel événement ou quel régime l''auteur a-t-il en tête ?'
  solution: Le Feu raconte la guerre des tranchées, Si c'est un homme la déportation, 1984 imagine un régime totalitaire.
- id: annee-guernica
  type: nombre
  difficulte: 2
  enonce: En quelle année Picasso peint-il Guernica, tableau qui dénonce le bombardement d'une ville espagnole pendant
    la guerre d'Espagne ?
  reponse:
    valeur: 1937
    forme: entier
  indices:
    relance: Ce tableau est une réaction à un bombardement qui a lieu pendant la guerre civile espagnole, avant
      la Seconde Guerre mondiale.
    methode: 'Cherche dans ton cours d''histoire des arts : c''est une date que l''on associe au titre du tableau.'
    etape: Le tableau est peint tout de suite après le bombardement, la même année.
  pieges:
  - si:
      valeur: 1939
    relance: 1939 est le début de la Seconde Guerre mondiale. Le bombardement a lieu avant, pendant la guerre d'Espagne.
  - si:
      valeur: 1936
    relance: Tu es proche. Le bombardement n'a pas lieu au tout début de la guerre d'Espagne. Une année s'est écoulée
      depuis.
  solution: Picasso peint Guernica en 1937, après le bombardement de la ville basque de Guernica pendant la guerre
    d'Espagne.
- id: point-de-vue-oeuvre
  type: choix
  difficulte: 2
  enonce: Un roman écrit par un ancien soldat, qui raconte ce qu'il a vu dans les tranchées, adopte quel point de
    vue sur l'histoire ?
  reponse:
    options:
    - id: a
      texte: Celui d'un témoin qui raconte ce qu'il a vécu
    - id: b
      texte: Celui d'un historien qui étudie la guerre soixante ans après
    - id: c
      texte: Celui d'un dictateur qui justifie la guerre
    - id: d
      texte: Celui d'un journaliste qui n'était pas sur place
    bonnes:
    - a
  indices:
    relance: 'L''auteur a lui-même combattu : est-il un observateur extérieur ou quelqu''un qui a vécu la scène
      ?'
    methode: 'Demande-toi : qui parle, et a-t-il vécu ce qu''il raconte ?'
    etape: Un ancien soldat qui décrit sa propre guerre est un acteur des événements, pas un spectateur éloigné.
  pieges:
  - si:
      contient:
      - b
    relance: Un historien travaille avec des archives, longtemps après. Ici l'auteur a vécu les faits.
  - si:
      contient:
      - c
    relance: Le récit d'un soldat qui décrit la souffrance ne cherche pas à justifier la guerre.
  - si:
      contient:
      - d
    relance: Le texte est écrit par un homme qui était dans les tranchées, il n'est pas extérieur aux faits.
  solution: 'Un ancien soldat qui raconte ce qu''il a vu écrit un témoignage : il a vécu les événements.'
