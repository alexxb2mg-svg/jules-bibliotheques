# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: corpus-agir-dans-la-cite
version: 1
etat: verifiee
declencheurs:
- roman sur la guerre totale
- lecture d'une oeuvre sur le totalitarisme
- film sur l'entre-deux-guerres
prerequis:
- litterature-et-histoire-xxe-siecle
essentiel: 'Ce corpus de référence relie la littérature à l''histoire du XXe siècle, en particulier les guerres mondiales,

  la société de l''entre-deux-guerres et les régimes totalitaires ou fascistes.

  On étudie une oeuvre entière, ou une partie importante d''une oeuvre, qui porte un regard sur cette période,

  en lecture intégrale. Ce travail se fait en lien avec le programme d''histoire de 3e, qui étudie la même période,

  notamment le thème des guerres totales en Europe.

  Le corpus peut aussi réunir des extraits d''autres oeuvres littéraires, des tableaux ou des extraits de films

  qui portent, eux aussi, un regard sur cette période.

  Un régime totalitaire est un régime politique qui contrôle toute la vie de la population et supprime les libertés,

  comme certains régimes qui existent en Europe dans les années 1920 à 1940.

  Comparer littérature, peinture et cinéma sur un même événement historique permet de voir comment chaque art

  choisit ses propres moyens pour représenter une période difficile.

  '
methode:
- Repérer à quel événement historique précis se rattache l'oeuvre étudiée (guerre, régime totalitaire...).
- Faire le lien avec ce qui est étudié en cours d'histoire sur la même période.
- Comparer, si le corpus le permet, un texte littéraire à un tableau ou un extrait de film sur le même sujet.
- 'Identifier le point de vue de l''oeuvre : celui d''un témoin, d''un narrateur fictif, d''un historien...'
vocabulaire:
- terme: totalitarisme
  definition: régime politique qui contrôle toute la vie de la population et supprime les libertés
- terme: lecture intégrale
  definition: lecture complète d'une oeuvre, du début à la fin, plutôt qu'un simple extrait
erreurs_frequentes:
- Étudier l'oeuvre littéraire sans faire aucun lien avec les connaissances vues en histoire sur la même période.
- Croire que seule la littérature peut parler des guerres mondiales, en oubliant la peinture et le cinéma.
- Confondre un régime totalitaire, qui supprime les libertés, avec un simple gouvernement autoritaire temporaire.
exemple:
  enonce: Explique en une phrase pourquoi ce corpus se travaille en lien avec le programme d'histoire de 3e.
  solution: Parce que les oeuvres étudiées portent sur les mêmes événements que ceux vus en histoire, comme les guerres mondiales
    ou les régimes totalitaires en Europe.
exercices:
- id: definir-totalitarisme
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un régime totalitaire ?
  reponse:
    options:
    - id: a
      texte: Un régime politique qui contrôle toute la vie de la population et supprime les libertés
    - id: b
      texte: Un régime qui organise des élections libres régulières
    - id: c
      texte: Une simple monarchie traditionnelle sans armée
    - id: d
      texte: Un régime qui laisse une totale liberté de la presse
    bonnes:
    - a
  indices:
    relance: Pense à un régime qui surveille les citoyens et interdit toute critique du pouvoir.
    methode: Élimine les définitions qui parlent de liberté ou d'élections, car un régime totalitaire les supprime.
    etape: La bonne réponse parle de contrôle total et de suppression des libertés.
  pieges:
  - si:
      contient:
      - b
    relance: 'Un régime totalitaire ne permet pas d''élections vraiment libres : c''est l''inverse de ce régime.'
  - si:
      contient:
      - c
    relance: Une monarchie traditionnelle n'est pas la même chose qu'un régime totalitaire, qui contrôle toute la population.
  - si:
      contient:
      - d
    relance: Un régime totalitaire supprime justement la liberté de la presse, il ne la permet pas.
  solution: Un régime totalitaire est un régime politique qui contrôle toute la vie de la population et supprime les libertés.
- id: type-de-lecture
  type: texte_court
  difficulte: 2
  enonce: Quelle expression désigne la lecture complète d'une oeuvre, du début à la fin, comme dans ce corpus ?
  reponse:
    acceptees:
    - lecture integrale
    - lecture-integrale
    fautes_tolerees: 2
  indices:
    relance: Cette expression s'oppose à la lecture d'un simple extrait ou d'un groupement de textes courts.
    methode: Cherche l'expression en deux mots qui signifie « lire l'oeuvre en entier ».
    etape: Le premier mot est « lecture », le second commence par « inté- ».
  pieges:
  - si:
      valeur: lecture cursive
    relance: La lecture cursive est une lecture plus libre, souvent en dehors de la classe. Cherche l'autre expression, pour
      une lecture complète en classe.
  solution: 'L''expression est lecture intégrale : lire l''oeuvre en entier, du début à la fin.'
- id: chronologie-periode
  type: ordre
  difficulte: 2
  enonce: Range ces trois périodes du XXe siècle de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: premiere-guerre
      texte: La Première Guerre mondiale, 1914-1918
    - id: entre-deux-guerres
      texte: La société de l'entre-deux-guerres et la montée des régimes totalitaires
    - id: seconde-guerre
      texte: La Seconde Guerre mondiale, 1939-1945
  indices:
    relance: La Première Guerre mondiale a lieu avant la période appelée « entre-deux-guerres ».
    methode: Range d'abord la Première Guerre mondiale, puis l'entre-deux-guerres, puis la Seconde Guerre mondiale.
    etape: L'entre-deux-guerres se situe justement entre les deux guerres mondiales, comme son nom l'indique.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux périodes voisines sont inversées. Laquelle des deux vient en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la période la plus ancienne (1914-1918), puis la plus récente (1939-1945).
  solution: La Première Guerre mondiale (1914-1918) est suivie par l'entre-deux-guerres, puis par la Seconde Guerre mondiale
    (1939-1945).
- id: arts-et-histoire
  type: association
  difficulte: 2
  enonce: Associe chaque art à un exemple de production qui peut porter un regard sur le XXe siècle.
  reponse:
    gauche:
    - id: a
      texte: La littérature
    - id: b
      texte: La peinture
    - id: c
      texte: Le cinéma
    droite:
    - id: x
      texte: Un roman ou un récit
    - id: y
      texte: Un tableau
    - id: z
      texte: Un film
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Chaque art a sa propre forme d''oeuvre : un texte, une image peinte, ou une image animée.'
    methode: Associe d'abord la littérature au roman, puis la peinture au tableau, puis le cinéma au film.
    etape: La littérature produit des romans ou récits, la peinture des tableaux, le cinéma des films.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien quel art correspond à quelle forme d'oeuvre.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque art un par un, en pensant à la forme d'oeuvre qu'il produit.
  solution: La littérature produit des romans ou récits, la peinture des tableaux, le cinéma des films, tous pouvant porter
    un regard sur le XXe siècle.
- id: lien-histoire-litterature
  type: ouverte
  difficulte: 3
  enonce: Choisis une oeuvre étudiée en classe sur le XXe siècle et explique le lien qu'elle entretient avec le programme
    d'histoire.
  criteres:
  - L'élève cite une oeuvre précise étudiée en classe, liée au XXe siècle.
  - L'élève explique à quel événement historique cette oeuvre se rattache (guerre, régime totalitaire...).
  - L'élève établit un lien avec ce qui est étudié en cours d'histoire sur la même période.
  indices:
    relance: À quel événement du programme d'histoire de 3e cette oeuvre fait-elle penser ?
    methode: Nomme d'abord l'oeuvre, puis l'événement historique auquel elle se rattache, puis le lien avec le cours d'histoire.
    etape: Tu peux commencer ainsi « Cette oeuvre parle de..., ce qui rejoint ce qu'on étudie en histoire sur... ».
  solution: Par exemple, un récit qui raconte la vie de soldats dans les tranchées de la Première Guerre mondiale rejoint
    directement le thème étudié en histoire des guerres totales en Europe, en donnant un point de vue vécu sur des événements
    que l'on étudie aussi par les dates et les cartes.
- id: nblm-dans-le-corpus-agir-dans-la-cite-avec-qu-1
  type: choix
  difficulte: 2
  enonce: Dans le corpus « Agir dans la cité », avec quelle autre discipline du programme de 3E l'étude d'un roman sur la
    guerre totale est-elle directement reliée ?
  reponse:
    options:
    - id: o1
      texte: L'histoire
    - id: o2
      texte: La géographie physique
    - id: o3
      texte: Les sciences de la vie et de la Terre
    - id: o4
      texte: La grammaire antique
    bonnes:
    - o1
  indices:
    relance: Pense au lien explicite fait entre les événements historiques du XXe siècle et les œuvres littéraires.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : associer la littérature historique à des disciplines scientifiques expérimentales.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : penser qu''il s''agit d''une étude linguistique ancienne, alors qu''il s''agit d''événements
      historiques du XXe siècle.'
  solution: 'L''histoire. C''est exact : la fiche indique que l''étude de ce corpus se fait en lien direct avec le programme
    d''histoire de 3e, qui aborde la même période et le thème des guerres totales.'
- id: nblm-selon-la-fiche-sur-la-notion-corpus-agir-2
  type: choix
  difficulte: 2
  enonce: Selon la fiche sur la notion « corpus-agir-dans-la-cite », quelle est la définition exacte d'un régime totalitaire
    étudié lors de la lecture d'une œuvre sur le totalitarisme ?
  reponse:
    options:
    - id: o1
      texte: Un régime politique qui contrôle toute la vie de la population et supprime les libertés.
    - id: o2
      texte: Un gouvernement autoritaire temporaire limité uniquement au domaine militaire.
    - id: o3
      texte: Une démocratie parlementaire qui organise des élections libres tous les cinq ans.
    - id: o4
      texte: Une monarchie constitutionnelle du XIXe siècle sans contrôle de la population.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'impact de ce régime sur la vie quotidienne de la population et sur les libertés individuelles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique soulignée dans la fiche : confondre un régime totalitaire avec un simple gouvernement autoritaire
      temporaire.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre le totalitarisme avec un système démocratique fondé sur les libertés et le vote.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : tromperie sur l''époque et la nature du régime politique.'
  solution: 'Un régime politique qui contrôle toute la vie de la population et supprime les libertés. C''est exact : la fiche
    définit le totalitarisme comme un régime qui contrôle toute la vie de la population et supprime les libertés.'
- id: nblm-pourquoi-le-corpus-agir-dans-la-cite-ass-3
  type: choix
  difficulte: 2
  enonce: Pourquoi le corpus « Agir dans la cité » associe-t-il la littérature, la peinture et un film sur l'entre-deux-guerres
    autour d'un même événement historique ?
  reponse:
    options:
    - id: o1
      texte: Pour voir comment chaque art choisit ses propres moyens pour représenter une période difficile.
    - id: o2
      texte: Pour prouver que seule la littérature est capable d'expliquer l'histoire.
    - id: o3
      texte: Pour remplacer totalement la lecture des textes littéraires par le visionnage de films.
    - id: o4
      texte: Pour étudier uniquement les techniques d'animation informatique moderne.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qu'apporte la comparaison entre différents modes d'expression artistique face à l'histoire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique relevée dans la fiche : croire que seule la littérature peut parler des événements historiques
      en oubliant les autres arts.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : penser que les autres arts remplacent la littérature alors qu''ils se complètent dans le corpus.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : se concentrer sur des techniques modernes hors sujet au lieu de la représentation historique.'
  solution: 'Pour voir comment chaque art choisit ses propres moyens pour représenter une période difficile. C''est exact
    : comparer différents arts permet de comprendre les moyens propres à chaque art pour représenter une même période historique.'
- id: nblm-quelle-forme-de-lecture-d-une-uvre-entie-4
  type: choix
  difficulte: 2
  enonce: Quelle forme de lecture d'une œuvre entière portant sur les guerres mondiales ou le totalitarisme est préconisée
    dans cette notion ?
  reponse:
    options:
    - id: o1
      texte: La lecture intégrale
    - id: o2
      texte: La lecture rapide de résumés
    - id: o3
      texte: La lecture exclusive de notices biographiques
    - id: o4
      texte: La lecture d'articles de presse contemporains uniquement
    bonnes:
    - o1
  indices:
    relance: Il s'agit du terme qui désigne la lecture complète d'une œuvre, du début à la fin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : croire qu''un simple résumé suffit alors qu''une étude approfondie exige une lecture intégrale.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : se limiter aux informations sur l''auteur sans lire l''œuvre elle-même.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre l''étude littéraire d''une œuvre du corpus avec une revue de presse actuelle.'
  solution: 'La lecture intégrale. C''est exact : la fiche indique qu''on étudie une œuvre entière ou une partie importante
    en lecture intégrale.'
- id: nblm-dans-la-demarche-d-analyse-d-une-uvre-su-5
  type: choix
  difficulte: 2
  enonce: Dans la démarche d'analyse d'une œuvre sur l'histoire du XXe siècle (comme un roman sur la guerre totale), que doit
    identifier l'élève concernant le point de vue ?
  reponse:
    options:
    - id: o1
      texte: Si le point de vue est celui d'un témoin, d'un narrateur fictif ou d'un historien.
    - id: o2
      texte: L'âge exact de l'imprimeur du livre lors de sa parution.
    - id: o3
      texte: Le nombre de pages écrites par jour par l'auteur.
    - id: o4
      texte: La couleur de la couverture originale de l'ouvrage.
    bonnes:
    - o1
  indices:
    relance: Cherche qui parle ou observe la période historique dans le récit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : rechercher des détails matériels superflus qui n''éclairent pas la perspective narrative.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre le point de vue narratif avec les habitudes de travail physiques de l''écrivain.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : se baser sur l''apparence externe du livre au lieu de la posture du narrateur.'
  solution: 'Si le point de vue est celui d''un témoin, d''un narrateur fictif ou d''un historien. C''est exact : la méthode
    de la fiche demande d''identifier si l''œuvre adopte le point de vue d''un témoin, d''un narrateur fictif ou d''un historien.'
- id: nblm-quelles-sont-les-deux-erreurs-frequentes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux erreurs fréquentes à éviter lors de l'étude de la notion « corpus-agir-dans-la-cite » ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Étudier l'œuvre littéraire sans faire aucun lien avec les connaissances vues en cours d'histoire.
    - id: o2
      texte: Confondre un régime totalitaire avec un simple gouvernement autoritaire temporaire.
    - id: o3
      texte: Relier le roman étudié aux événements historiques du XXe siècle.
    - id: o4
      texte: Comparer un texte littéraire à un tableau ou un film sur la même période.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux pièges mentionnés dans la rubrique des erreurs fréquentes de la fiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est au contraire une démarche recommandée et indispensable pour comprendre le corpus.
  - si:
      contient:
      - o4
    relance: C'est au contraire la méthode préconisée pour analyser la représentation des événements par différents arts.
  solution: 'Étudier l''œuvre littéraire sans faire aucun lien avec les connaissances vues en cours d''histoire ; Confondre
    un régime totalitaire avec un simple gouvernement autoritaire temporaire. C''est exact : la fiche signale comme erreur
    le fait de séparer l''étude littéraire des connaissances historiques sur la même période.'
- id: nblm-quel-terme-designe-la-lecture-complete-d-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne la lecture complète d'une œuvre littéraire du début à la fin dans ce corpus ?
  reponse:
    acceptees:
    - lecture intégrale
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'une expression de deux mots désignant la lecture de l'intégralité d'un texte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'lecture intégrale. C''est exact : la lecture intégrale désigne la lecture complète d''une œuvre du début à la
    fin.'
- id: nblm-quel-concept-politique-designe-un-regime-8
  type: texte_court
  difficulte: 1
  enonce: Quel concept politique désigne un régime qui contrôle toute la vie de la population et supprime les libertés, étudié
    lors de la lecture d'une œuvre du XXe siècle ?
  reponse:
    acceptees:
    - totalitarisme
    fautes_tolerees: 1
  indices:
    relance: Ce nom commun caractérise certains régimes européens des années 1920 à 1940.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'totalitarisme. C''est exact : le totalitarisme est le régime politique qui contrôle toute la vie de la population
    et supprime les libertés.'
