  - si:
      contient:
      - o4
    relance: C'est au contraire la méthode préconisée pour analyser la représentation des événements par différents arts.
  solution: 'Étudier l''œuvre littéraire sans faire aucun lien avec les connaissances vues en cours d''histoire ; Confondre
    un régime totalitaire avec un simple gouvernement autoritaire temporaire. C''est exact : la fiche signale comme erreur
