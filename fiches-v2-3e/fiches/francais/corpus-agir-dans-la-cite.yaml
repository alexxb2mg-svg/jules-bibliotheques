      texte: Un pouvoir totalitaire qui surveille tout (fiction)
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une de ces œuvres est un roman d'anticipation, une autre parle de 14-18, une autre des camps.
    methode: Repère d'abord l'œuvre qui invente un pays imaginaire, puis celle écrite par un ancien déporté.
    etape: Barbusse a lui-même combattu en 1914-1918. Primo Levi raconte ce qu'il a vécu. Orwell invente un régime.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Demande-toi pour chaque œuvre si son auteur raconte du vécu ou invente.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque œuvre une par une : quel événement ou quel régime l''auteur a-t-il en tête ?'
  solution: Le Feu raconte la guerre des tranchées, Si c'est un homme la déportation, 1984 imagine un régime totalitaire.
- id: annee-guernica
  type: nombre
  difficulte: 2
  enonce: En quelle année Picasso peint-il Guernica, tableau qui dénonce le bombardement d'une ville espagnole pendant la
    guerre d'Espagne ?
  reponse:
    valeur: 1937
    forme: entier
  indices:
    relance: Ce tableau est une réaction à un bombardement qui a lieu pendant la guerre civile espagnole, avant la Seconde
      Guerre mondiale.
    methode: 'Cherche dans ton cours d''histoire des arts : c''est une date que l''on associe au titre du tableau.'
    etape: Le tableau est peint tout de suite après le bombardement, la même année.
  pieges:
  - si:
      valeur: 1939
    relance: 1939 est le début de la Seconde Guerre mondiale. Le bombardement a lieu avant, pendant la guerre d'Espagne.
  - si:
      valeur: 1936
    relance: Tu es proche. Le bombardement n'a pas lieu au tout début de la guerre d'Espagne. Une année s'est écoulée depuis.
  solution: Picasso peint Guernica en 1937, après le bombardement de la ville basque de Guernica pendant la guerre d'Espagne.
- id: point-de-vue-oeuvre
  type: choix
  difficulte: 2
  enonce: Un roman écrit par un ancien soldat, qui raconte ce qu'il a vu dans les tranchées, adopte quel point de vue sur
    l'histoire ?
  reponse:
    options:
    - id: a
      texte: Celui d'un témoin qui raconte ce qu'il a vécu
    - id: b
      texte: Celui d'un historien qui étudie la guerre soixante ans après
    - id: c
      texte: Celui d'un dictateur qui justifie la guerre
    - id: d
      texte: Celui d'un journaliste qui n'était pas sur place
    bonnes:
    - a
  indices:
    relance: 'L''auteur a lui-même combattu : est-il un observateur extérieur ou quelqu''un qui a vécu la scène ?'
    methode: 'Demande-toi : qui parle, et a-t-il vécu ce qu''il raconte ?'
    etape: Un ancien soldat qui décrit sa propre guerre est un acteur des événements, pas un spectateur éloigné.
  pieges:
  - si:
      contient:
      - b
    relance: Un historien travaille avec des archives, longtemps après. Ici l'auteur a vécu les faits.
  - si:
      contient:
      - c
    relance: Le récit d'un soldat qui décrit la souffrance ne cherche pas à justifier la guerre.
  - si:
      contient:
      - d
    relance: Le texte est écrit par un homme qui était dans les tranchées, il n'est pas extérieur aux faits.
  solution: 'Un ancien soldat qui raconte ce qu''il a vu écrit un témoignage : il a vécu les événements.'
