# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: corpus-agir-dans-la-cite
version: 1
etat: verifiee
declencheurs:
- roman sur la guerre totale
- lecture d'une oeuvre sur le totalitarisme
- film sur l'entre-deux-guerres
prerequis:
- litterature-et-histoire-xxe-siecle
essentiel: 'Ce corpus de référence relie la littérature à l''histoire du XXe siècle, en particulier les guerres mondiales,

  la société de l''entre-deux-guerres et les régimes totalitaires ou fascistes.

  On étudie une oeuvre entière, ou une partie importante d''une oeuvre, qui porte un regard sur cette période,

  en lecture intégrale. Ce travail se fait en lien avec le programme d''histoire de 3e, qui étudie la même période,

  notamment le thème des guerres totales en Europe.

  Le corpus peut aussi réunir des extraits d''autres oeuvres littéraires, des tableaux ou des extraits de films

  qui portent, eux aussi, un regard sur cette période.

  Un régime totalitaire est un régime politique qui contrôle toute la vie de la population et supprime les libertés,

  comme certains régimes qui existent en Europe dans les années 1920 à 1940.

  Comparer littérature, peinture et cinéma sur un même événement historique permet de voir comment chaque art

  choisit ses propres moyens pour représenter une période difficile.

  '
methode:
- Repérer à quel événement historique précis se rattache l'oeuvre étudiée (guerre, régime totalitaire...).
- Faire le lien avec ce qui est étudié en cours d'histoire sur la même période.
- Comparer, si le corpus le permet, un texte littéraire à un tableau ou un extrait de film sur le même sujet.
- 'Identifier le point de vue de l''oeuvre : celui d''un témoin, d''un narrateur fictif, d''un historien...'
vocabulaire:
- terme: totalitarisme
  definition: régime politique qui contrôle toute la vie de la population et supprime les libertés
- terme: lecture intégrale
  definition: lecture complète d'une oeuvre, du début à la fin, plutôt qu'un simple extrait
erreurs_frequentes:
- Étudier l'oeuvre littéraire sans faire aucun lien avec les connaissances vues en histoire sur la même période.
- Croire que seule la littérature peut parler des guerres mondiales, en oubliant la peinture et le cinéma.
- Confondre un régime totalitaire, qui supprime les libertés, avec un simple gouvernement autoritaire temporaire.
exemple:
  enonce: Explique en une phrase pourquoi ce corpus se travaille en lien avec le programme d'histoire de 3e.
  solution: Parce que les oeuvres étudiées portent sur les mêmes événements que ceux vus en histoire, comme les guerres mondiales
    ou les régimes totalitaires en Europe.
exercices:
- id: definir-totalitarisme
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un régime totalitaire ?
  reponse:
    options:
    - id: a
      texte: Un régime politique qui contrôle toute la vie de la population et supprime les libertés
    - id: b
      texte: Un régime qui organise des élections libres régulières
    - id: c
      texte: Une simple monarchie traditionnelle sans armée
    - id: d
      texte: Un régime qui laisse une totale liberté de la presse
    bonnes:
    - a
  indices:
    relance: Pense à un régime qui surveille les citoyens et interdit toute critique du pouvoir.
    methode: Élimine les définitions qui parlent de liberté ou d'élections, car un régime totalitaire les supprime.
    etape: La bonne réponse parle de contrôle total et de suppression des libertés.
  pieges:
  - si:
      contient:
      - b
    relance: 'Un régime totalitaire ne permet pas d''élections vraiment libres : c''est l''inverse de ce régime.'
  - si:
      contient:
      - c
    relance: Une monarchie traditionnelle n'est pas la même chose qu'un régime totalitaire, qui contrôle toute la population.
  - si:
      contient:
      - d
    relance: Un régime totalitaire supprime justement la liberté de la presse, il ne la permet pas.
  solution: Un régime totalitaire est un régime politique qui contrôle toute la vie de la population et supprime les libertés.
- id: type-de-lecture
  type: texte_court
  difficulte: 2
  enonce: Quelle expression désigne la lecture complète d'une oeuvre, du début à la fin, comme dans ce corpus ?
  reponse:
    acceptees:
    - lecture integrale
    - lecture-integrale
    fautes_tolerees: 2
  indices:
    relance: Cette expression s'oppose à la lecture d'un simple extrait ou d'un groupement de textes courts.
    methode: Cherche l'expression en deux mots qui signifie « lire l'oeuvre en entier ».
    etape: Le premier mot est « lecture », le second commence par « inté- ».
  pieges:
  - si:
      valeur: lecture cursive
    relance: La lecture cursive est une lecture plus libre, souvent en dehors de la classe. Cherche l'autre expression, pour
      une lecture complète en classe.
  solution: 'L''expression est lecture intégrale : lire l''oeuvre en entier, du début à la fin.'
- id: chronologie-periode
  type: ordre
  difficulte: 2
  enonce: Range ces trois périodes du XXe siècle de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: premiere-guerre
      texte: La Première Guerre mondiale, 1914-1918
    - id: entre-deux-guerres
      texte: La société de l'entre-deux-guerres et la montée des régimes totalitaires
    - id: seconde-guerre
      texte: La Seconde Guerre mondiale, 1939-1945
  indices:
    relance: La Première Guerre mondiale a lieu avant la période appelée « entre-deux-guerres ».
    methode: Range d'abord la Première Guerre mondiale, puis l'entre-deux-guerres, puis la Seconde Guerre mondiale.
    etape: L'entre-deux-guerres se situe justement entre les deux guerres mondiales, comme son nom l'indique.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux périodes voisines sont inversées. Laquelle des deux vient en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la période la plus ancienne (1914-1918), puis la plus récente (1939-1945).
  solution: La Première Guerre mondiale (1914-1918) est suivie par l'entre-deux-guerres, puis par la Seconde Guerre mondiale
    (1939-1945).
- id: arts-et-histoire
  type: association
  difficulte: 2
  enonce: Associe chaque art à un exemple de production qui peut porter un regard sur le XXe siècle.
  reponse:
    gauche:
    - id: a
      texte: La littérature
    - id: b
      texte: La peinture
    - id: c
      texte: Le cinéma
    droite:
    - id: x
      texte: Un roman ou un récit
    - id: y
      texte: Un tableau
    - id: z
      texte: Un film
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Chaque art a sa propre forme d''oeuvre : un texte, une image peinte, ou une image animée.'
    methode: Associe d'abord la littérature au roman, puis la peinture au tableau, puis le cinéma au film.
    etape: La littérature produit des romans ou récits, la peinture des tableaux, le cinéma des films.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien quel art correspond à quelle forme d'oeuvre.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque art un par un, en pensant à la forme d'oeuvre qu'il produit.
  solution: La littérature produit des romans ou récits, la peinture des tableaux, le cinéma des films, tous pouvant porter
    un regard sur le XXe siècle.
- id: lien-histoire-litterature
  type: ouverte
  difficulte: 3
  enonce: Choisis une oeuvre étudiée en classe sur le XXe siècle et explique le lien qu'elle entretient avec le programme
    d'histoire.
  criteres:
  - L'élève cite une oeuvre précise étudiée en classe, liée au XXe siècle.
  - L'élève explique à quel événement historique cette oeuvre se rattache (guerre, régime totalitaire...).
  - L'élève établit un lien avec ce qui est étudié en cours d'histoire sur la même période.
  indices:
    relance: À quel événement du programme d'histoire de 3e cette oeuvre fait-elle penser ?
    methode: Nomme d'abord l'oeuvre, puis l'événement historique auquel elle se rattache, puis le lien avec le cours d'histoire.
    etape: Tu peux commencer ainsi « Cette oeuvre parle de..., ce qui rejoint ce qu'on étudie en histoire sur... ».
  solution: Par exemple, un récit qui raconte la vie de soldats dans les tranchées de la Première Guerre mondiale rejoint
    directement le thème étudié en histoire des guerres totales en Europe, en donnant un point de vue vécu sur des événements
    que l'on étudie aussi par les dates et les cartes.
