# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: analyse-du-sens-des-mots
version: 2
etat: verifiee
declencheurs:
- sens propre et sens figuré
- expression toute faite
- mot qui a plusieurs sens
- verbe qui change de sens selon la construction
- mots proches de sens
- nuance entre deux mots
- expression imagée
- sens d'un mot dans le contexte
prerequis: []
essentiel: 'Beaucoup de mots ont plusieurs sens : c''est la polysémie. Le contexte (les mots autour) permet de choisir le
  bon sens. Par exemple « glace » peut désigner de l''eau gelée, un miroir ou un dessert froid.


  Sens propre et sens figuré. Le sens propre est le sens premier, concret : « une main de fer » désigne à l''origine une main
  en métal. Le sens figuré est un sens imagé, dérivé : dans « une main de fer », l''expression signifie une autorité sévère.


  Glissements de sens. Le sens d''un mot évolue avec le temps et l''usage. Un mot peut passer d''un sens concret à un sens
  abstrait : « saisir » une balle, puis « saisir » une idée.


  Nuances. Des mots proches (synonymes) ne sont pas interchangeables : ils diffèrent par l''intensité (inquiétude, peur, terreur),
  le niveau de langue (voiture, bagnole) ou la connotation (mince, maigre). Choisis le mot le plus précis pour ce que tu veux
  dire.


  Expressions figées. Ce sont des groupes de mots dont le sens ne se devine pas mot à mot : « avoir le cafard » = être triste,
  « poser un lapin » = ne pas venir à un rendez-vous. On ne peut pas les changer (on ne dit pas « avoir la blatte »).


  Construction du verbe. Le sens d''un verbe change parfois selon sa construction : « il sort de la salle » (sans COD) et
  « il sort un livre » (avec un COD) ; « il tient à son chien » (tenir à = être attaché) et « il tient son chien » (tenir
  = retenir).


  Au brevet, on attend que tu justifies le sens d''un mot dans son contexte, que tu distingues sens propre et figuré et que
  tu expliques une nuance ou une expression.

  '
methode:
- Repère le mot dont le sens pose question, puis observe les mots qui l'entourent.
- Demande-toi si le sens concret (sens propre) est logique dans la phrase ; sinon, cherche un sens imagé.
- 'Pour une expression figée, ne traduis pas mot à mot : cherche le sens global de l''expression.'
- Pour un verbe, regarde sa construction (avec ou sans complément, quel type de complément).
- Pour comparer deux mots proches, cherche l'intensité, le niveau de langue et la connotation.
- Vérifie ton hypothèse dans un dictionnaire et justifie par un indice précis du texte.
vocabulaire:
- terme: polysémie
  definition: propriété d'un mot qui a plusieurs sens différents
- terme: sens propre
  definition: sens premier, concret, d'un mot
- terme: sens figuré
  definition: sens imagé d'un mot ou d'une expression, différent de son sens premier et concret
- terme: contexte
  definition: ensemble des mots et de la situation qui entourent un mot et l'éclairent
- terme: expression figée
  definition: groupe de mots dont le sens ne se devine pas mot à mot et qu'on ne peut pas modifier
- terme: synonyme
  definition: mot de sens proche d'un autre, avec parfois une nuance
- terme: connotation
  definition: sens supplémentaire, souvent affectif, associé à un mot en plus de son sens de base
- terme: glissement de sens
  definition: évolution du sens d'un mot au fil du temps ou de l'usage
erreurs_frequentes:
- Traduire une expression figée mot à mot au lieu de chercher son sens global.
- Choisir le premier sens connu d'un mot sans vérifier qu'il convient au contexte.
- Confondre sens propre et sens figuré et perdre l'image portée par une expression.
- Croire que deux synonymes sont toujours interchangeables, sans voir la nuance.
- Oublier que la construction du verbe (avec ou sans complément, avec « à » ou « de ») peut changer son sens.
exemple:
  enonce: Dans la phrase « Ce professeur a une main de fer », l'expression « main de fer » est-elle employée au sens propre
    ou au sens figuré ? Explique.
  solution: 'Elle est employée au sens figuré : il n''a pas une vraie main en métal, l''expression signifie qu''il dirige
    avec beaucoup d''autorité et de fermeté.'
exercices:
- id: sens-glace
  type: choix
  difficulte: 1
  enonce: Dans la phrase « Léa se regarde dans la glace avant de partir », quel est le sens du mot « glace » ?
  reponse:
    options:
    - id: a
      texte: un miroir
    - id: b
      texte: de l'eau gelée
    - id: c
      texte: un dessert froid
    bonnes:
    - a
  indices:
    relance: Que fait-on habituellement devant cet objet, juste avant de sortir ?
    methode: 'Regarde les mots autour de « glace » : « se regarde dans » indique un objet qui renvoie une image.'
    etape: On se regarde dans cet objet pour vérifier son apparence, pas pour le manger ni patiner dessus.
  pieges:
  - si:
      contient:
      - b
    relance: On ne se regarde pas « dans » de l'eau gelée pour se préparer à sortir. Pense à un objet qu'on trouve dans une
      salle de bain.
  - si:
      contient:
      - c
    relance: Un dessert froid ne renvoie pas une image de soi. Pense à un objet accroché au mur.
  solution: 'Ici, « glace » signifie « miroir » : le contexte (« se regarde dans... avant de partir ») montre qu''il s''agit
    de vérifier son apparence, pas de parler d''eau gelée ou d''un dessert.'
- id: expression-cafard
  type: texte_court
  difficulte: 1
  enonce: Que signifie l'expression figée « avoir le cafard » ? Réponds par un seul mot.
  reponse:
    acceptees:
    - triste
    fautes_tolerees: 1
  indices:
    relance: 'Cette expression ne parle pas vraiment d''un insecte : elle décrit un état d''esprit.'
    methode: Pense à une personne qui n'a pas le moral, qui se sent un peu déprimée.
    etape: C'est un adjectif qui décrit quelqu'un qui n'a pas le moral, proche de « malheureux ».
  pieges:
  - si:
      valeur: sale
    relance: Ce n'est pas une question de propreté. Pense plutôt à l'humeur, au moral d'une personne.
  solution: '« Avoir le cafard » est une expression figée qui signifie être triste, ne pas avoir le moral : le sens global
    ne se devine pas mot à mot.'
- id: propre-ou-figure
  type: association
  difficulte: 1
  enonce: Associe chaque phrase au sens (propre ou figuré) du mot en gras.
  reponse:
    gauche:
    - id: a
      texte: Le forgeron a une main de métal. (le mot « métal » désigne vraiment un métal)
    - id: b
      texte: Ce chef a un cœur d'or.
    droite:
    - id: x
      texte: sens propre
    - id: y
      texte: sens figuré
    paires:
      a: x
      b: y
  indices:
    relance: Demande-toi si le mot est pris au pied de la lettre ou s'il est une image.
    methode: 'Un chef n''a pas un vrai cœur fait d''or : que veut dire l''image ?'
    etape: Dans une des phrases, le mot désigne la chose réelle. Dans l'autre, il sert d'image pour parler du caractère.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque phrase et vérifie si le mot désigne l'objet réel ou une image.
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par « cœur d''or » : est-ce un organe réel en or ?'
  solution: 'Dans la première phrase le mot désigne réellement un métal : sens propre. « Un cœur d''or » signifie une grande
    bonté : sens figuré.'
- id: expressions-figees-sens
  type: association
  difficulte: 2
  enonce: Associe chaque expression figée à son sens.
  reponse:
    gauche:
    - id: a
      texte: casser les pieds à quelqu'un
    - id: b
      texte: avoir un poil dans la main
    - id: c
      texte: poser un lapin
    droite:
    - id: x
      texte: être très paresseux
    - id: y
      texte: ne pas venir à un rendez-vous
    - id: z
      texte: agacer quelqu'un
    paires:
      a: z
      b: x
      c: y
  indices:
    relance: 'Aucune de ces expressions ne se comprend mot à mot : imagine la scène qu''elles décrivent au sens figuré.'
    methode: Prends les expressions une par une et cherche dans quelle situation on les emploie à l'oral.
    etape: « Poser un lapin » se dit quand quelqu'un attend sans que l'autre personne arrive.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au sens figuré de chaque expression, pas au sens des mots pris un par
      un.
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'expression la plus connue, « poser un lapin », puis raisonne pour les deux autres.
  solution: « Casser les pieds » = agacer ; « avoir un poil dans la main » = être très paresseux ; « poser un lapin » = ne
    pas venir à un rendez-vous fixé.
- id: nuance-peur
  type: ordre
  difficulte: 2
  enonce: Range ces trois mots proches du moins intense au plus intense.
  reponse:
    elements:
    - id: a
      texte: inquiétude
    - id: b
      texte: peur
    - id: c
      texte: terreur
  indices:
    relance: Un de ces mots décrit un léger souci, un autre une émotion extrême qui paralyse.
    methode: 'Imagine une échelle : d''un simple souci jusqu''à une émotion qui empêche de bouger.'
    etape: Le mot le plus faible décrit un léger souci, pas encore une vraie peur.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux mots voisins sont inversés. Lequel des deux décrit l''émotion la plus forte ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le mot le plus faible, puis le plus fort, et place le troisième entre les deux.
  solution: 'Du moins intense au plus intense : inquiétude, peur, terreur. La terreur est une peur extrême, qui peut paralyser.'
- id: nblm-comment-appelle-t-on-la-propriete-d-un-m-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on la propriété d'un mot qui possède plusieurs sens différents selon le contexte ?
  reponse:
    options:
    - id: o1
      texte: La polysémie
    - id: o2
      texte: La dérivation
    - id: o3
      texte: L'expression figée
    - id: o4
      texte: La métaphore
    bonnes:
    - o1
  indices:
    relance: Pense au préfixe d'origine grecque signifiant 'plusieurs'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la dérivation concerne la formation des mots par ajout d''affixes, et non le fait pour un mot
      d''avoir plusieurs définitions.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : une expression figée est un groupe de mots au sens global indécomposable, non la propriété
      d''un seul mot polysémique.'
  solution: 'La polysémie. C''est la définition exacte de la polysémie : la propriété d''un mot d''avoir plusieurs sens.'
- id: nblm-quelle-est-la-difference-fondamentale-en-2
  type: choix
  difficulte: 2
  enonce: Quelle est la différence fondamentale entre le sens propre et le sens figuré d'un mot ou d'une expression ?
  reponse:
    options:
    - id: o1
      texte: Le sens propre est le sens premier et concret, tandis que le sens figuré est un sens imagé et dérivé.
    - id: o2
      texte: Le sens propre est toujours faux, alors que le sens figuré est le seul sens exact.
    - id: o3
      texte: Le sens propre s'utilise uniquement en poésie, alors que le sens figuré est réservé à la vie quotidienne.
    - id: o4
      texte: Le sens propre dépend du dictionnaire, alors que le sens figuré ne dépend d'aucun contexte.
    bonnes:
    - o1
  indices:
    relance: L'un renvoie à la réalité concrète et matérielle, l'autre crée une image ou un sens dérivé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le sens propre n''est pas faux, c''est au contraire le sens littéral et premier tiré de la
      réalité.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le sens propre est le sens courant de tous les jours, tandis que le sens figuré emploie des
      images.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le sens figuré dépend étroitement du contexte de la phrase pour être correctement interprété.'
  solution: 'Le sens propre est le sens premier et concret, tandis que le sens figuré est un sens imagé et dérivé. C''est
    la distinction exacte : le sens propre renvoie au concret/premier, et le sens figuré à une image.'
- id: nblm-dans-la-phrase-marc-a-le-cafard-depuis-c-3
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Marc a le cafard depuis ce matin », que désigne l'expression toute faite « avoir le cafard » ?
  reponse:
    options:
    - id: o1
      texte: Être triste ou déprimé.
    - id: o2
      texte: Avoir attrapé un insecte nuisible.
    - id: o3
      texte: Avoir une mauvaise hygiène de vie.
    - id: o4
      texte: Être très en colère contre quelqu'un.
    bonnes:
    - o1
  indices:
    relance: Ne traduis pas chaque mot séparément ; cherche l'état émotionnel désigné par la formule globale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : traduire l''expression mot à mot au sens propre au lieu d''en chercher le sens global imagé.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : associer à tort la présence de l''insecte à la propreté plutôt qu''à l''état émotionnel.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre l''émotion de la tristesse (le cafard) avec un sentiment de colère.'
  solution: 'Être triste ou déprimé. Dans une expression figée ou toute faite, le sens est global : ''avoir le cafard'' signifie
    ressentir de la tristesse.'
- id: nblm-comment-la-construction-du-verbe-modifie-4
  type: choix
  difficulte: 2
  enonce: Comment la construction du verbe modifie-t-elle son sens dans la phrase « Il sort de la salle » par rapport à «
    Il sort un livre » ?
  reponse:
    options:
    - id: o1
      texte: Avec un complément de lieu, le verbe indique un déplacement ; avec un complément d'objet direct, il signifie
        faire apparaître ou sortir un objet.
    - id: o2
      texte: Le verbe garde exactement le même sens quel que soit le complément qui le suit.
    - id: o3
      texte: Dans la première phrase, le verbe est au sens figuré ; dans la seconde, il est au sens propre.
    - id: o4
      texte: Dans la seconde phrase, le verbe 'sortir' est un verbe impersonnel.
    bonnes:
    - o1
  indices:
    relance: Observe si le verbe est suivi d'un complément d'objet direct ou d'un complément de lieu.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ignorer l''influence de la construction syntaxique sur les variations de sens du verbe.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : les deux phrases s''emploient au sens concret, c''est la construction qui fait changer le sens
      du verbe.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le sujet ''il'' représente une personne réelle qui accomplit l''action, ce n''est pas une tournure
      impersonnelle.'
  solution: 'Avec un complément de lieu, le verbe indique un déplacement ; avec un complément d''objet direct, il signifie
    faire apparaître ou sortir un objet. C''est exact : le type de complément (de lieu ou COD) modifie la construction du
    verbe et fait varier son sens.'
- id: nblm-selon-les-reperes-du-programme-officiel-5
  type: choix
  difficulte: 2
  enonce: Selon les repères du programme officiel de 3e, quel élément est essentiel pour analyser les nuances et variations
    de sens d'un mot dans une phrase ?
  reponse:
    options:
    - id: o1
      texte: L'analyse du contexte et de la construction grammaticale autour du mot.
    - id: o2
      texte: Le nombre exact de lettres composant le mot.
    - id: o3
      texte: L'ordre alphabétique de la phrase.
    - id: o4
      texte: La présence systématique d'une rime à la fin du vers.
    bonnes:
    - o1
  indices:
    relance: Pense à l'environnement grammatical et lexical immédiat dans lequel s'insère le mot.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la longueur orthographique d''un mot n''a aucun rapport avec la détermination de son sens.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : l''ordre alphabétique sert au classement dans un dictionnaire, pas à l''analyse sémantique
      d''un texte.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la rime concerne la versification poétique et non l''analyse sémantique générale en étude de
      la langue.'
  solution: L'analyse du contexte et de la construction grammaticale autour du mot. Selon les programmes officiels de 3e,
    l'étude du sens repose sur l'observation du contexte et des constructions.
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations exactes concernant les expressions figées et le sens figuré ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Le sens d'une expression figée ne se devine pas en traduisant chaque mot un par un.
    - id: o2
      texte: L'expression « une main de fer » est employée au sens figuré pour désigner une autorité très ferme.
    - id: o3
      texte: Traduire mot à mot une expression toute faite est la meilleure méthode pour en comprendre le sens.
    - id: o4
      texte: Le sens figuré est le sens premier, physique et concret d'un mot.
    bonnes:
    - o1
    - o2
  indices:
    relance: Coche les deux propositions qui rappellent la nature imagée du sens figuré et l'impossibilité de décomposer une
      formule figée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : c''est l''erreur classique qui conduit à un contresens sur l''expression figée.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le sens premier et concret est le sens propre, alors que le sens figuré est imagé.'
  solution: 'Le sens d''une expression figée ne se devine pas en traduisant chaque mot un par un ; L''expression « une main
    de fer » est employée au sens figuré pour désigner une autorité très ferme. C''est exact : une expression figée (ou toute
    faite) possède une signification globale indivisible.'
- id: nblm-par-opposition-au-sens-figure-comment-ap-7
  type: texte_court
  difficulte: 1
  enonce: Par opposition au sens figuré, comment appelle-t-on le sens premier, concret et matériel d'un mot ?
  reponse:
    acceptees:
    - sens propre
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'une expression en deux mots qui s'oppose directement à 'sens figuré'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: sens propre. Le sens propre est la notion exacte qui désigne le sens premier et concret d'un mot.
- id: nblm-quel-terme-designe-la-propriete-d-un-mot-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne la propriété d'un mot qui possède plusieurs sens différents selon le contexte ?
  reponse:
    acceptees:
    - polysémie
    fautes_tolerees: 1
  indices:
    relance: Ce nom féminin commence par le préfixe 'poly-'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: polysémie. La polysémie est le terme scientifique et grammatical exact pour qualifier la multiplicité des sens
    d'un mot.
- id: verbe-et-construction
  type: choix
  difficulte: 2
  enonce: Dans « Il tient à sa bicyclette », que signifie le verbe « tenir » ?
  reponse:
    options:
    - id: a
      texte: être attaché à quelque chose, y accorder de l'importance
    - id: b
      texte: serrer quelque chose dans la main
    - id: c
      texte: contenir quelque chose
    bonnes:
    - a
  indices:
    relance: 'Regarde le petit mot qui suit le verbe : sa construction avec « à » change le sens.'
    methode: 'Compare avec « Il tient sa bicyclette » : le sens est plus concret (la retenir). Que change « à » ?'
    etape: 'Quand on tient à un objet, on n''a pas forcément la main dessus : on s''y attache.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Tenir quelque chose dans la main s''écrit sans « à » : « il tient sa bicyclette ». Ici, la construction est
      différente.'
  - si:
      contient:
      - c
    relance: « Contenir » se dit d'un récipient. Ici, « tenir à » exprime un lien affectif avec la bicyclette.
  solution: '« Tenir à » quelque chose signifie y être attaché : la construction avec « à » donne un sens différent de « tenir
    » quelque chose (le retenir dans la main).'
- id: nuance-synonymes
  type: choix
  difficulte: 2
  enonce: Quel mot est le plus adapté pour décrire un voisin qui refuse de donner de l'argent même quand il en a beaucoup
    ?
  reponse:
    options:
    - id: a
      texte: avare
    - id: b
      texte: économe
    - id: c
      texte: prudent
    bonnes:
    - a
  indices:
    relance: 'Ces trois mots ont un rapport avec l''argent, mais leur connotation n''est pas la même : un est un défaut, deux
      sont plutôt positifs.'
    methode: 'Cherche le mot qui exprime un jugement négatif : refuser de partager alors qu''on a beaucoup.'
    etape: Celui qui dépense avec raison est « économe » ; celui qui garde tout par excès est autre chose.
  pieges:
  - si:
      contient:
      - b
    relance: Être économe, c'est dépenser avec mesure, ce qui est plutôt une qualité. Ici, le refus est excessif.
  - si:
      contient:
      - c
    relance: La prudence est plutôt une qualité et ne parle pas seulement d'argent. Cherche un mot au sens négatif, spécialement
      lié à l'argent.
  solution: '« Avare » désigne quelqu''un qui garde son argent par excès et refuse de le partager : le mot a une connotation
    négative. « Économe » et « prudent » sont des qualités.'
- id: expliquer-un-sens
  type: ouverte
  difficulte: 3
  enonce: Le mot « pièce » a plusieurs sens. Donne-en au moins trois, chacun dans une courte phrase qui permet de le reconnaître,
    puis dis comment le contexte permet de choisir le bon sens.
  criteres:
  - 'L''élève donne au moins trois sens différents du mot (par exemple : pièce d''une maison, pièce de monnaie, pièce de théâtre).'
  - Chaque sens est illustré par une phrase dont le contexte permet de le reconnaître.
  - L'élève explique que ce sont les mots autour (le contexte) qui permettent de choisir le bon sens.
  indices:
    relance: Pense à un endroit dans une maison, à de l'argent et à un spectacle.
    methode: Pour chaque sens, écris une phrase où les autres mots (habiter, payer, jouer...) rendent le sens évident.
    etape: Termine par une phrase du type « Le contexte, c'est-à-dire les mots autour, permet de choisir... ».
  solution: '« Pièce » : une pièce de la maison (« Le salon est la plus grande pièce de la maison ») ; une pièce de monnaie
    (« Il a payé avec une pièce de deux euros ») ; une pièce de théâtre (« Nous avons vu une pièce au théâtre »). Le contexte,
    c''est-à-dire les mots autour, permet de choisir le bon sens.'
