  indices:
    relance: Cet ensemble réunit plusieurs extraits d'œuvres différentes autour d'un thème.
    methode: Cherche le terme qui parle d'extraits multiples réunis par un thème.
    etape: Il ne s'agit pas d'une œuvre complète.
  pieges:
  - si:
      contient:
      - b
    relance: Une lecture intégrale est une œuvre complète, ici il y a plusieurs extraits.
  - si:
      contient:
      - c
    relance: Un roman est une seule œuvre, alors qu'ici il y a plusieurs auteurs.
  - si:
      contient:
      - d
    relance: Un carnet de lecture est un cahier personnel, pas un ensemble de textes.
  solution: 'C''est un groupement de textes : plusieurs extraits d''œuvres différentes autour d''un même thème.'
- id: lectures-attendues
  type: choix
  difficulte: 2
  enonce: Quelles lectures les attendus officiels de 3e demandent-ils dans l'année ? Choisis toutes les bonnes réponses.
  reponse:
    options:
    - id: a
      texte: Au moins trois œuvres complètes du patrimoine en lecture intégrale
    - id: b
      texte: Au moins trois œuvres complètes en lecture cursive
    - id: c
      texte: Au moins trois groupements de textes
    - id: d
      texte: Aucune œuvre complète
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Les attendus fixent un minimum pour chaque type de lecture.
    methode: 'Relis l''essentiel : trois types de lecture sont cités.'
    etape: Une seule option est fausse.
  pieges:
  - si:
      contient:
      - d
    relance: Le programme demande bien des œuvres complètes, plusieurs par type de lecture.
  solution: Les attendus demandent au moins trois œuvres en lecture intégrale, trois en lecture cursive et trois groupements
    de textes.
