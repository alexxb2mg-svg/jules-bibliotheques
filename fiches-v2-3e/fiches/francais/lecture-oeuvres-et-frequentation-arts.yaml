# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: lecture-oeuvres-et-frequentation-arts
version: 1
etat: verifiee
declencheurs:
- programme de lectures de l'année
- choisir un livre en lecture libre
- sortie au musée en lien avec un livre
prerequis: []
essentiel: 'En 3e, un programme de lecture équilibré comprend plusieurs types d''oeuvres.

  La lecture intégrale consiste à lire une oeuvre complète du patrimoine littéraire, étudiée en détail en classe.

  Il faut en lire au moins trois dans l''année.

  La lecture cursive est une lecture plus libre, souvent choisie par l''élève, parfois de littérature jeunesse,

  et moins approfondie en classe. Il en faut aussi au moins trois dans l''année.

  Un groupement de textes réunit plusieurs extraits d''oeuvres différentes autour d''un même thème ou d''une même

  question. Il en faut au moins trois dans l''année.

  Les oeuvres étudiées viennent de différentes époques, en lien avec le programme d''histoire, pour montrer

  l''évolution de la littérature dans le temps.

  Enfin, on relie souvent la littérature à d''autres arts : peinture, musique, cinéma, sculpture, pour mieux

  comprendre une oeuvre ou une époque, en fréquentant des oeuvres d''art variées.

  '
methode:
- Distinguer une lecture intégrale (oeuvre complète étudiée en classe) d'une lecture cursive (lecture plus libre).
- Repérer si un ensemble de textes forme un groupement (plusieurs extraits sur un même thème).
- Situer chaque oeuvre lue dans son époque, pour la relier au programme d'histoire.
- Chercher des liens entre une oeuvre littéraire et d'autres arts (peinture, musique, cinéma).
vocabulaire:
- terme: lecture intégrale
  definition: lecture complète d'une oeuvre, du début à la fin, étudiée en détail en classe
- terme: lecture cursive
  definition: lecture plus libre et personnelle, moins approfondie en classe
- terme: groupement de textes
  definition: ensemble de plusieurs extraits d'oeuvres différentes réunis autour d'un même thème
erreurs_frequentes:
- Confondre lecture intégrale (oeuvre entière étudiée en détail) et lecture cursive (lecture plus libre).
- Croire qu'un groupement de textes est une seule oeuvre, alors qu'il réunit plusieurs extraits différents.
- Étudier la littérature sans jamais la relier à d'autres arts, comme la peinture ou le cinéma.
exemple:
  enonce: Explique en une phrase la différence entre une lecture intégrale et une lecture cursive.
  solution: La lecture intégrale est la lecture complète d'une oeuvre étudiée en détail en classe, alors que la lecture cursive
    est une lecture plus libre et personnelle, moins approfondie en classe.
exercices:
- id: definir-lecture-cursive
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une lecture cursive ?
  reponse:
    options:
    - id: a
      texte: Une lecture plus libre et personnelle, moins approfondie en classe
    - id: b
      texte: La lecture complète d'une oeuvre étudiée en détail chaque jour en classe
    - id: c
      texte: Un exercice de grammaire sur les verbes
    - id: d
      texte: Un résumé d'un film au cinéma
    bonnes:
    - a
  indices:
    relance: Cette lecture laisse plus de liberté à l'élève, contrairement à une oeuvre étudiée en détail chaque jour.
    methode: Élimine les définitions qui parlent d'étude détaillée en classe ou d'exercices non liés à la lecture.
    etape: La bonne réponse parle de liberté et de moindre approfondissement en classe.
  pieges:
  - si:
      contient:
      - b
    relance: Cette définition correspond à la lecture intégrale, pas à la lecture cursive.
  - si:
      contient:
      - c
    relance: Un exercice de grammaire n'a rien à voir avec la lecture cursive.
  - si:
      contient:
      - d
    relance: Un résumé de film n'est pas une lecture cursive, qui concerne un livre lu librement.
  solution: Une lecture cursive est une lecture plus libre et personnelle, moins approfondie en classe que la lecture intégrale.
- id: nombre-oeuvres-integrales
  type: texte_court
  difficulte: 2
  enonce: Combien d'oeuvres complètes du patrimoine en lecture intégrale un élève de 3e doit-il lire au minimum dans l'année,
    selon les attendus officiels ?
  reponse:
    acceptees:
    - trois
    - '3'
    fautes_tolerees: 0
  indices:
    relance: Ce nombre est le même pour les lectures intégrales, les lectures cursives et les groupements de textes.
    methode: 'Compte sur les doigts d''une main, en t''arrêtant avant d''atteindre la moitié : le nombre est plus grand que
      deux.'
    etape: Le nombre est entre deux et quatre.
  pieges:
  - si:
      valeur: '1'
    relance: 'C''est plus qu''un seul livre : relis l''essentiel pour trouver le nombre exact.'
  - si:
      valeur: '5'
    relance: 'C''est moins que cinq : relis l''essentiel pour trouver le nombre exact.'
  solution: Il faut lire au moins trois oeuvres complètes du patrimoine en lecture intégrale dans l'année.
- id: types-de-lecture
  type: association
  difficulte: 2
  enonce: Associe chaque type de lecture ou de texte à sa définition.
  reponse:
    gauche:
    - id: a
      texte: La lecture intégrale
    - id: b
      texte: La lecture cursive
    - id: c
      texte: Le groupement de textes
    droite:
    - id: x
      texte: Une oeuvre complète étudiée en détail en classe
    - id: y
      texte: Une lecture plus libre, souvent choisie par l'élève
    - id: z
      texte: Plusieurs extraits d'oeuvres différentes réunis autour d'un même thème
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces types est une oeuvre entière étudiée en détail, un autre est plus libre, le dernier réunit plusieurs
      extraits.
    methode: Associe d'abord la lecture intégrale à l'étude détaillée, puis la lecture cursive à la liberté, puis le groupement
      aux extraits multiples.
    etape: La lecture intégrale est étudiée en détail ; la lecture cursive est plus libre ; le groupement réunit plusieurs
      extraits sur un thème.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la différence entre lecture cursive et groupement de textes.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque type un par un, en te demandant s'il concerne une oeuvre entière, une lecture libre, ou plusieurs
      extraits.
  solution: La lecture intégrale est une oeuvre complète étudiée en détail, la lecture cursive est une lecture plus libre,
    le groupement de textes réunit plusieurs extraits autour d'un même thème.
- id: ordre-frequentation-arts
  type: ordre
  difficulte: 2
  enonce: Range ces trois étapes dans l'ordre logique pour relier une oeuvre littéraire à d'autres arts.
  reponse:
    elements:
    - id: lire
      texte: Lire l'oeuvre littéraire et en comprendre le sujet
    - id: chercher
      texte: Chercher une oeuvre d'un autre art (peinture, musique, cinéma) sur un sujet proche
    - id: comparer
      texte: Comparer ce que chaque oeuvre dit du même sujet, avec ses propres moyens
  indices:
    relance: On doit d'abord comprendre l'oeuvre littéraire, avant de chercher une autre oeuvre d'art à lui associer.
    methode: Range d'abord la lecture, puis la recherche d'une oeuvre d'un autre art, puis la comparaison des deux.
    etape: Il faut d'abord lire l'oeuvre, puis chercher une oeuvre proche dans un autre art, puis comparer les deux.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Laquelle des deux vient logiquement en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape de départ (lire l'oeuvre), puis l'étape finale (comparer).
  solution: On lit d'abord l'oeuvre littéraire et on en comprend le sujet, puis on cherche une oeuvre d'un autre art sur un
    sujet proche, puis on compare les deux oeuvres.
- id: relier-litterature-et-art
  type: ouverte
  difficulte: 3
  enonce: Choisis une oeuvre littéraire étudiée en classe et une oeuvre d'un autre art (peinture, musique, cinéma) qui lui
    est liée, puis explique ce qu'elles ont en commun.
  criteres:
  - L'élève cite une oeuvre littéraire précise étudiée en classe.
  - L'élève cite une oeuvre d'un autre art (tableau, morceau de musique, film) en lien avec le même sujet ou la même époque.
  - L'élève explique un point commun entre les deux oeuvres (même thème, même époque, même sentiment exprimé).
  indices:
    relance: Penses-tu à un tableau, un film ou une musique qui parle du même sujet ou de la même époque qu'un livre étudié
      en classe ?
    methode: Nomme d'abord l'oeuvre littéraire, puis l'oeuvre d'un autre art, puis explique ce qu'elles ont en commun.
    etape: Tu peux commencer ainsi « Cette oeuvre littéraire parle de..., comme ce tableau (ou ce film)... ».
  solution: 'Par exemple, un récit sur la Première Guerre mondiale peut être mis en lien avec un tableau de la même époque
    montrant des soldats dans les tranchées : les deux oeuvres, chacune avec ses propres moyens (mots ou couleurs), cherchent
    à faire ressentir la dureté de la guerre.'
- id: nblm-dans-le-programme-de-francais-de-3e-comb-1
  type: choix
  difficulte: 2
  enonce: Dans le programme de français de 3e, combien d'œuvres complètes du patrimoine doivent être lues en lecture intégrale
    au cours de l'année ?
  reponse:
    options:
    - id: o1
      texte: Au moins 3 œuvres complètes
    - id: o2
      texte: Au moins 1 seule œuvre complète
    - id: o3
      texte: Au moins 6 œuvres complètes
    - id: o4
      texte: Aucune, seuls des extraits de textes sont au programme
    bonnes:
    - o1
  indices:
    relance: Pense au chiffre minimal fixé par les instructions officielles pour la lecture intégrale en classe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : penser qu''une seule œuvre suffit, alors que les textes officiels exigent au moins trois œuvres
      intégrales.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre avec le total cumulé des lectures intégrales et des lectures cursives (3 + 3 = 6).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre la lecture intégrale d''œuvres avec les groupements de textes qui réunissent des
      extraits.'
  solution: Au moins 3 œuvres complètes. C'est exact. Le programme officiel impose au moins 3 œuvres complètes du patrimoine
    étudiées en classe en lecture intégrale.
- id: nblm-quelle-est-la-caracteristique-principale-2
  type: choix
  difficulte: 2
  enonce: Quelle est la caractéristique principale d'une lecture cursive par rapport à une lecture intégrale dans le programme
    de 3e ?
  reponse:
    options:
    - id: o1
      texte: C'est une lecture plus libre et personnelle, souvent de littérature jeunesse, moins approfondie en classe.
    - id: o2
      texte: C'est l'étude exhaustive mot à mot d'une œuvre classique réalisée uniquement en classe.
    - id: o3
      texte: C'est un ensemble d'extraits courts issus d'auteurs différents réunis sur un thème.
    - id: o4
      texte: C'est la lecture obligatoire d'un manuel d'histoire ou de grammaire.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au degré d'autonomie de l'élève et au niveau d'analyse fait en classe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre la lecture cursive avec la lecture intégrale guidée par le professeur.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre la lecture cursive avec un groupement de textes.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : réduire la lecture cursive à un support uniquement documentaire ou théorique.'
  solution: C'est une lecture plus libre et personnelle, souvent de littérature jeunesse, moins approfondie en classe. C'est
    exact. La lecture cursive est une lecture personnelle et plus libre, au contraire de la lecture intégrale analysée en
    détail en classe.
- id: nblm-dans-le-programme-de-lectures-de-l-annee-3
  type: choix
  difficulte: 2
  enonce: Dans le programme de lectures de l'année de 3e, pourquoi les œuvres littéraires sont-elles reliées aux différentes
    époques historiques ?
  reponse:
    options:
    - id: o1
      texte: Pour mettre la littérature en lien avec le programme d'histoire et comprendre l'évolution des textes dans le
        temps.
    - id: o2
      texte: Pour apprendre par cœur toutes les dates de naissance et de mort des auteurs.
    - id: o3
      texte: Pour remplacer complètement le cours d'histoire par des cours de français.
    - id: o4
      texte: Pour limiter l'étude aux seuls textes écrits durant l'Antiquité.
    bonnes:
    - o1
  indices:
    relance: Pense à la complémentarité entre la culture littéraire et le programme d'histoire en 3e.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : réduire la contextualisation historique à un apprentissage mécanique de repères biographiques.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : croire que la littérature remplace l''histoire au lieu de créer un croisement interdisciplinaire.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : restreindre la période alors que le programme de 3e accorde une place importante au XXe et
      XXIe siècles.'
  solution: Pour mettre la littérature en lien avec le programme d'histoire et comprendre l'évolution des textes dans le temps.
    C'est exact. Les lectures sont articulées avec le programme d'histoire de 3e pour replacer les œuvres dans leur contexte
    historique et culturel.
- id: nblm-lors-d-une-sortie-au-musee-en-lien-avec-4
  type: choix
  difficulte: 2
  enonce: Lors d'une sortie au musée en lien avec un livre ou d'une étude d'œuvres, quel est l'intérêt de relier un texte
    littéraire à une œuvre d'art (peinture, sculpture, cinéma) ?
  reponse:
    options:
    - id: o1
      texte: Mieux comprendre une œuvre ou une époque en comparant les moyens d'expression propres à chaque art.
    - id: o2
      texte: Démontrer que la peinture est toujours supérieure à la littérature.
    - id: o3
      texte: Recopier le tableau sur son cahier à la place de lire le livre.
    - id: o4
      texte: Prouver que l'auteur du livre et le peintre sont obligatoirement la même personne.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux apports culturels de la fréquentation des arts pour enrichir la lecture des textes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : établir une hiérarchie entre les arts au lieu de percevoir la complémentarité de leurs langages.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre l''analyse croisée d''œuvres avec un simple exercice de dessin ou de copie.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre l''artiste peintre et l''écrivain au lieu d''associer leurs œuvres.'
  solution: Mieux comprendre une œuvre ou une époque en comparant les moyens d'expression propres à chaque art. C'est exact.
    Rapprocher littérature et arts visuels ou musicaux permet de croiser les regards sur une époque ou une thématique.
- id: nblm-comment-l-eleve-de-3e-doit-il-choisir-un-5
  type: choix
  difficulte: 2
  enonce: Comment l'élève de 3e doit-il choisir un livre en lecture libre au cours de son année scolaire ?
  reponse:
    options:
    - id: o1
      texte: En choisissant des livres adaptés à son niveau de lecture, à ses goûts, à ses besoins et à son projet de lecteur.
    - id: o2
      texte: En laissant obligatoirement son professeur décider du livre sans donner son avis.
    - id: o3
      texte: En se basant uniquement sur l'illustration de la première de couverture.
    - id: o4
      texte: En choisissant le livre qui comporte le moins de pages possible.
    bonnes:
    - o1
  indices:
    relance: Considère l'objectif d'autonomie et d'épanouissement personnel du lecteur en classe de 3e.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : négliger l''autonomie progressive de l''élève requise en fin de cycle 4 pour le choix personnel.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : choisir un livre sur un critère purement visuel sans vérifier le niveau ni le genre.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : privilégier la brièveté au détriment de l''intérêt littéraire et de son projet personnel.'
  solution: En choisissant des livres adaptés à son niveau de lecture, à ses goûts, à ses besoins et à son projet de lecteur.
    C'est exact. L'élève développe son autonomie en choisissant des ouvrages en adéquation avec son profil et ses besoins.
- id: nblm-quelles-sont-les-deux-formes-d-uvres-com-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux formes d'œuvres complètes imposées au minimum dans le programme de lecture annuel en 3e ?
    (Sélectionne les 2 bonnes réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Au moins 3 œuvres complètes du patrimoine en lecture intégrale
    - id: o2
      texte: Au moins 3 œuvres complètes en lecture cursive
    - id: o3
      texte: Au moins 10 manuels scolaires de grammaire
    - id: o4
      texte: L'apprentissage par cœur de 20 romans contemporains
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les deux piliers concernant la lecture d'œuvres complètes dans les exigences officielles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre les œuvres littéraires du programme avec les manuels d''étude de la langue.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre l''activité de lecture d''œuvres avec la récitation d''un texte mémorisé.'
  solution: Au moins 3 œuvres complètes du patrimoine en lecture intégrale ; Au moins 3 œuvres complètes en lecture cursive.
    C'est juste. C'est le nombre minimal d'œuvres du patrimoine étudiées de manière approfondie en classe.
- id: nblm-quel-adjectif-designe-une-lecture-libre-7
  type: texte_court
  difficulte: 1
  enonce: Quel adjectif désigne une lecture libre et personnelle, complémentaire de la lecture intégrale ?
  reponse:
    acceptees:
    - cursive
    fautes_tolerees: 1
  indices:
    relance: Terme technique utilisé au collège pour désigner la lecture personnelle d'un livre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'cursive. C''est la réponse exacte : la lecture ''cursive'' est la lecture personnelle et plus autonome de l''élève.'
