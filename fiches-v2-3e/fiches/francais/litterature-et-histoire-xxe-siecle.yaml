format: 2
notion: litterature-et-histoire-xxe-siecle
version: 1
etat: verifiee
declencheurs:
- témoignage sur la guerre
- littérature d'engagement
- écrivain résistant
- texte qui raconte un bouleversement historique
prerequis: []
essentiel: 'Au XXe siècle, de nombreux écrivains ont vécu des événements historiques bouleversants : les deux guerres mondiales,

  les régimes totalitaires, la Résistance. Certains ont choisi d''écrire sur ces événements, dans des genres variés :

  roman, poésie, théâtre, récit.

  Un texte littéraire sur l''histoire ne se limite pas à raconter des faits, comme le ferait un document historique.

  Il va au-delà du simple témoignage : il cherche à faire ressentir, à faire réfléchir, à donner une forme à une

  expérience souvent très difficile à dire.

  On parle d''engagement quand un auteur prend position, par ses écrits, sur une cause ou contre une injustice.

  La résistance littéraire désigne les textes écrits pour s''opposer, parfois en secret, à une oppression ou une occupation.

  Émile Zola, avec son texte « J''accuse... ! », publié en 1898 dans le journal L''Aurore, est un exemple célèbre

  d''engagement d''un écrivain qui prend position publiquement contre une injustice de son époque.

  '
methode:
- Identifier l'événement historique auquel le texte fait référence (guerre, occupation, régime totalitaire...).
- Se demander ce que le texte littéraire apporte de plus qu'un simple document historique.
- 'Repérer les marques de l''engagement de l''auteur : prise de position, dénonciation, appel à agir.'
- Réfléchir à l'effet que le texte cherche à produire chez le lecteur (émotion, réflexion, indignation).
vocabulaire:
- terme: engagement
  definition: fait, pour un auteur, de prendre position par ses écrits sur une cause ou contre une injustice
- terme: témoignage
  definition: récit de ce qu'une personne a vécu ou vu, pour en garder une trace
erreurs_frequentes:
- Réduire un texte littéraire sur l'histoire à un simple résumé des faits, sans voir ce qu'il ajoute au document historique.
- Confondre témoignage (raconter ce qu'on a vécu) et fiction inspirée de faits historiques.
- Croire que l'engagement d'un auteur se limite à décrire des faits, sans jamais prendre position.
exemple:
  enonce: Explique en une phrase pourquoi un texte littéraire sur la guerre ne se limite pas à un simple document historique.
  solution: Il cherche aussi à faire ressentir une expérience, à donner une forme littéraire à des événements difficiles à
    dire, au-delà du simple récit des faits.
exercices:
- id: definir-engagement
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que l'engagement d'un écrivain ?
  reponse:
    options:
    - id: a
      texte: Le fait de prendre position, par ses écrits, sur une cause ou contre une injustice
    - id: b
      texte: Le fait d'écrire uniquement des poèmes d'amour
    - id: c
      texte: Le fait de ne jamais parler d'actualité dans ses textes
    - id: d
      texte: Le fait de signer un contrat avec un éditeur
    bonnes:
    - a
  indices:
    relance: Pense à un écrivain qui prend clairement position contre une injustice de son époque, comme Zola dans « J'accuse...
      ! ».
    methode: Élimine les définitions qui ne parlent ni de position ni de cause défendue.
    etape: La bonne réponse parle d'une prise de position par l'écriture.
  pieges:
  - si:
      contient:
      - b
    relance: 'L''engagement ne se limite pas aux poèmes d''amour : il concerne la prise de position sur une cause.'
  - si:
      contient:
      - c
    relance: 'C''est l''inverse : un écrivain engagé parle souvent des événements de son époque, il ne les évite pas.'
  - si:
      contient:
      - d
    relance: Signer un contrat avec un éditeur n'a rien à voir avec l'engagement littéraire.
  solution: L'engagement d'un écrivain est le fait de prendre position, par ses écrits, sur une cause ou contre une injustice.
- id: auteur-jaccuse
  type: texte_court
  difficulte: 2
  enonce: Quel est le nom de famille de l'auteur du texte « J'accuse... ! », publié en 1898 dans le journal L'Aurore ?
  reponse:
    acceptees:
    - zola
    fautes_tolerees: 1
  indices:
    relance: Cet écrivain, romancier du XIXe siècle, prend publiquement position dans l'affaire Dreyfus.
    methode: Cherche le nom d'un romancier célèbre pour ses romans réalistes et pour avoir défendu un homme injustement condamné.
    etape: Son nom commence par « Zo- ».
  pieges:
  - si:
      valeur: hugo
    relance: Victor Hugo est aussi un écrivain engagé, mais ce n'est pas lui l'auteur de « J'accuse... ! ».
  - si:
      valeur: voltaire
    relance: Voltaire vit au XVIIIe siècle, bien avant l'affaire Dreyfus de 1898.
  solution: L'auteur de « J'accuse... ! » est Émile Zola, publié en 1898 dans le journal L'Aurore.
- id: chronologie-engagement
  type: ordre
  difficulte: 2
  enonce: Range ces trois événements ou textes du plus ancien au plus récent.
  reponse:
    elements:
    - id: jaccuse
      texte: « J'accuse... ! » d'Émile Zola, 1898
    - id: premiere-guerre
      texte: La Première Guerre mondiale, 1914-1918
    - id: seconde-guerre
      texte: La Seconde Guerre mondiale et la Résistance, 1939-1945
  indices:
    relance: « J'accuse... ! » est publié avant les deux guerres mondiales du XXe siècle. Laquelle des deux guerres vient
      en premier ?
    methode: Range d'abord le texte de 1898, puis la Première Guerre mondiale, puis la Seconde Guerre mondiale.
    etape: « J'accuse... ! » précède la Première Guerre mondiale, qui précède elle-même la Seconde Guerre mondiale.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux événements voisins sont inversés. Lequel des deux a lieu en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus ancien (1898), puis le plus récent (1939-1945).
  solution: « J'accuse... ! » est publié en 1898, avant la Première Guerre mondiale (1914-1918), elle-même antérieure à la
    Seconde Guerre mondiale (1939-1945).
- id: notions-et-definitions-xxe
  type: association
  difficulte: 2
  enonce: Associe chaque notion à sa définition.
  reponse:
    gauche:
    - id: a
      texte: L'engagement
    - id: b
      texte: La résistance littéraire
    - id: c
      texte: Le témoignage
    droite:
    - id: x
      texte: Prendre position par ses écrits sur une cause ou une injustice
    - id: y
      texte: Écrire, parfois en secret, pour s'opposer à une oppression
    - id: z
      texte: Raconter ce qu'on a vécu ou vu, pour en garder une trace
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une de ces notions parle de prise de position générale, une autre d'opposition secrète, une autre de récit vécu.
    methode: Associe d'abord l'engagement à la prise de position, puis la résistance à l'opposition secrète, puis le témoignage
      au récit vécu.
    etape: L'engagement est une prise de position ; la résistance littéraire s'oppose en secret à une oppression ; le témoignage
      raconte ce qu'on a vécu.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la différence entre engagement et résistance littéraire.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque notion une par une, en te demandant si elle parle de position générale, d'opposition secrète,
      ou de récit vécu.
  solution: L'engagement est une prise de position par l'écriture, la résistance littéraire s'oppose en secret à une oppression,
    le témoignage raconte ce qu'on a vécu.
- id: exemple-engagement-xxe
  type: ouverte
  difficulte: 3
  enonce: Choisis un texte ou un auteur du XXe siècle étudié en classe et explique en quoi il dépasse le simple témoignage
    historique.
  criteres:
  - L'élève cite un texte ou un auteur précis lié à un événement du XXe siècle.
  - L'élève explique ce que le texte raconte de cet événement historique.
  - L'élève montre en quoi le texte va au-delà d'un simple document historique (émotion, réflexion, forme littéraire).
  indices:
    relance: Un document historique donne des faits et des dates. Que peut apporter en plus un texte littéraire sur le même
      événement ?
    methode: Nomme d'abord le texte et l'événement historique, puis explique ce que le texte ajoute au simple récit des faits.
    etape: Tu peux commencer ainsi « Ce texte raconte..., mais il va plus loin car... ».
  solution: Par exemple, un récit sur la Première Guerre mondiale peut raconter les combats comme le ferait un livre d'histoire,
    mais il va plus loin en faisant ressentir la peur ou l'épuisement des soldats, à travers des images et un point de vue
    personnel qu'un simple document historique ne donne pas.
- id: nblm-selon-la-fiche-de-revision-comment-defin-1
  type: choix
  difficulte: 2
  enonce: Selon la fiche de révision, comment définit-on l'engagement d'un auteur au XXe siècle ?
  reponse:
    options:
    - id: o1
      texte: Le fait pour un auteur de prendre position par ses écrits sur une cause ou contre une injustice.
    - id: o2
      texte: Le fait de décrire des événements historiques de façon neutre et objective sans jamais exprimer son avis.
    - id: o3
      texte: Le fait d'écrire exclusivement des récits de pure fiction déconnectés de toute réalité historique.
    - id: o4
      texte: Le fait de rédiger uniquement des manuels scolaires ou des documents d'archives officiels.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au rôle de l'écrivain qui choisit de défendre activement ses idées à travers la littérature.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : confondre l''engagement avec la neutralité du journaliste ou de l''historien.'
  - si:
      contient:
      - o3
    relance: Considérer à tort que la littérature engagée refuse le lien avec l'histoire et la société.
  - si:
      contient:
      - o4
    relance: Confondre une œuvre littéraire engagée avec un document d'information administrative ou pédagogique.
  solution: 'Le fait pour un auteur de prendre position par ses écrits sur une cause ou contre une injustice. C''est la définition
    exacte retenue par le programme : l''auteur met sa plume au service d''un combat politique, social ou moral.'
- id: nblm-que-cherche-a-apporter-un-texte-litterai-2
  type: choix
  difficulte: 2
  enonce: Que cherche à apporter un texte littéraire racontant un bouleversement historique par rapport à un simple document
    d'histoire ?
  reponse:
    options:
    - id: o1
      texte: Il cherche à faire ressentir une expérience humaine et à donner une forme littéraire à des événements difficiles
        à dire.
    - id: o2
      texte: Il cherche à présenter une liste exacte et exhaustive de dates et de bilans chiffrés.
    - id: o3
      texte: Il cherche à remplacer le cours d'histoire en inventant de fausses dates d'événements.
    - id: o4
      texte: Il cherche à supprimer tout travail sur le style pour être lu le plus rapidement possible.
    bonnes:
    - o1
  indices:
    relance: Pense à l'émotion et au partage de l'expérience vécue par opposition aux chiffres et aux dates brutales.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : réduire la littérature à un inventaire de données chronologiques ou statistiques.'
  - si:
      contient:
      - o3
    relance: Penser à tort que la littérature vise à falsifier l'histoire officielle.
  - si:
      contient:
      - o4
    relance: Oublier la dimension esthétique et le travail sur la langue qui caractérisent le texte littéraire.
  solution: Il cherche à faire ressentir une expérience humaine et à donner une forme littéraire à des événements difficiles
    à dire. La littérature va au-delà des faits bruts en exprimant les émotions, le sens et l'expérience vécue.
- id: nblm-que-designe-la-notion-de-resistance-litt-3
  type: choix
  difficulte: 2
  enonce: Que désigne la notion de résistance littéraire développée pendant les périodes d'oppression ou d'occupation ?
  reponse:
    options:
    - id: o1
      texte: L'ensemble des textes écrits pour s'opposer, parfois en secret, à une oppression ou une occupation.
    - id: o2
      texte: Le refus des écrivains d'utiliser la langue française dans leurs œuvres.
    - id: o3
      texte: L'obligation de n'écrire que des comédies légères pour faire oublier la guerre.
    - id: o4
      texte: La rédaction de textes approuvant les actions de l'occupant.
    bonnes:
    - o1
  indices:
    relance: Pense aux poètes et écrivains clandestins qui ont lutté avec leurs mots contre la tyrannie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur d''interprétation : les écrivains résistants utilisent la langue comme arme de combat.'
  - si:
      contient:
      - o3
    relance: Confondre la résistance littéraire avec une recherche de divertissement ou d'évasion.
  - si:
      contient:
      - o4
    relance: 'Contresens fondamental : cela définirait la collaboration et non la résistance.'
  solution: L'ensemble des textes écrits pour s'opposer, parfois en secret, à une oppression ou une occupation. La résistance
    littéraire regroupe les textes (poèmes clandestins, récits) luttant contre le régime oppresseur.
- id: nblm-au-xxe-siecle-quelle-est-la-specificite-4
  type: choix
  difficulte: 2
  enonce: Au XXe siècle, quelle est la spécificité du témoignage sur la guerre en littérature ?
  reponse:
    options:
    - id: o1
      texte: C'est le récit de ce qu'une personne a vécu ou vu pendant le conflit pour en garder une trace.
    - id: o2
      texte: C'est obligatoirement un récit fantastique situé dans un futur imaginaire.
    - id: o3
      texte: C'est une fiction inventée de toutes pièces par un auteur n'ayant aucun lien avec l'époque.
    - id: o4
      texte: C'est un discours politique officiel prononcé par un gouvernement.
    bonnes:
    - o1
  indices:
    relance: Considère le lien direct entre l'auteur et les épreuves historiques qu'il a lui-même traversées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Confondre le témoignage historique réel avec des genres d'imagination comme le fantastique ou la science-fiction.
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : confondre le témoignage direct et le roman historique d''invention.'
  - si:
      contient:
      - o4
    relance: Confondre le récit personnel d'un témoin avec un texte institutionnel ou diplomatique.
  solution: C'est le récit de ce qu'une personne a vécu ou vu pendant le conflit pour en garder une trace. Le témoignage repose
    sur l'expérience directe du témoin transmise afin de préserver la mémoire.
- id: nblm-quel-texte-celebre-d-emile-zola-paru-en-5
  type: choix
  difficulte: 2
  enonce: Quel texte célèbre d'Émile Zola, paru en 1898, est cité comme un exemple marquant d'engagement contre une injustice
    ?
  reponse:
    options:
    - id: o1
      texte: « J'accuse... ! »
    - id: o2
      texte: « Candide »
    - id: o3
      texte: « Paroles »
    - id: o4
      texte: « Le Parti pris des choses »
    bonnes:
    - o1
  indices:
    relance: Il s'agit d'une célèbre tribune se terminant par un point d'exclamation et parue dans le journal L'Aurore.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Candide est un conte philosophique de Voltaire écrit au XVIIIe siècle (1759).
  - si:
      contient:
      - o3
    relance: Paroles est un recueil de poèmes de Jacques Prévert publié au XXe siècle.
  - si:
      contient:
      - o4
    relance: Le Parti pris des choses est un recueil de poèmes en prose de Francis Ponge consacré aux objets.
  solution: « J'accuse... ! ». Émile Zola a publié cette lettre ouverte dans L'Aurore pour prendre publiquement la défense
    d'une cause juste.
- id: nblm-quels-grands-themes-et-evenements-du-xxe-6
  type: choix
  difficulte: 3
  enonce: Quels grands thèmes et événements du XXe siècle sont principalement au cœur de la notion « Littérature et histoire
    » ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Les deux guerres mondiales (1914-1918 et 1939-1945).
    - id: o2
      texte: Les régimes totalitaires et le combat de la Résistance.
    - id: o3
      texte: Les guerres de Religion du XVIe siècle.
    - id: o4
      texte: La Révolution française de 1789.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux propositions qui renvoient directement aux grands drames européens du XXe siècle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Les guerres de Religion appartiennent au XVIe siècle et non au XXe siècle.
  - si:
      contient:
      - o4
    relance: La Révolution française s'est déroulée à la fin du XVIIIe siècle.
  solution: Les deux guerres mondiales (1914-1918 et 1939-1945) ; Les régimes totalitaires et le combat de la Résistance.
    Les deux conflits mondiaux sont des bouleversements majeurs au cœur des témoignages et récits du XXe siècle.
- id: nblm-quel-terme-designe-le-fait-pour-un-auteu-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne le fait, pour un auteur, de prendre position par ses écrits sur une cause ou contre une injustice
    ?
  reponse:
    acceptees:
    - engagement
    fautes_tolerees: 1
  indices:
    relance: Ce nom commun vient du verbe s'engager.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: engagement. L'engagement est la notion clé définissant le choix de l'écrivain de mettre son art au service d'un
    combat politique ou social.
- id: nblm-comment-appelle-t-on-le-recit-dans-leque-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le récit dans lequel une personne raconte ce qu'elle a vécu ou vu pendant la guerre pour en
    garder une trace ?
  reponse:
    acceptees:
    - témoignage
    fautes_tolerees: 1
  indices:
    relance: Ce terme partage la même racine que le mot témoin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: témoignage. Le témoignage permet de conserver la mémoire vivante d'événements tragiques vécus directement par
    l'auteur.
