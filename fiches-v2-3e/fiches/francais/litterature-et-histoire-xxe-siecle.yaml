format: 2
notion: litterature-et-histoire-xxe-siecle
version: 2
etat: generee
declencheurs:
- témoignage sur la guerre
- littérature d'engagement
- écrivain résistant
- texte qui raconte un bouleversement historique
- poème de la Résistance
- écrire pendant l'Occupation
- livre sur les tranchées
- pourquoi un roman n'est pas un document
prerequis: []
essentiel: |
  Au XXe siècle, l'histoire est marquée par des bouleversements majeurs : deux guerres mondiales (1914-1918, 1939-1945), des régimes totalitaires, la Résistance en France, la Shoah. Beaucoup d'écrivains ont vécu ces événements et ont écrit à leur sujet, dans des genres variés : roman, poésie, théâtre, récit, témoignage.

  Un texte littéraire n'est pas un simple document historique. Un document donne des faits et des dates. Un texte littéraire va au-delà du témoignage et de la seule efficacité rhétorique : il cherche à faire ressentir, à faire réfléchir, à donner une forme à une expérience difficile à dire, par les images, le rythme, le point de vue, l'émotion.

  Le témoignage est le récit de ce qu'on a vécu ou vu, pour en garder la trace. L'engagement est la prise de position d'un auteur, par ses écrits, sur une cause ou contre une injustice. La résistance littéraire désigne l'écriture qui s'oppose, parfois en secret, à une oppression ou une occupation. Elle emploie souvent des moyens détournés pour échapper à la censure : allusions, symboles, poèmes publiés clandestinement.

  Repères. Émile Zola publie « J'accuse... ! » en 1898 dans L'Aurore, dans l'affaire Dreyfus (engagement, avant le XXe siècle). Pendant la Première Guerre mondiale, Apollinaire écrit « Calligrammes » (1918) et Barbusse « Le Feu » (1916). Pendant l'Occupation (1940-1944), Paul Éluard publie « Liberté » (1942), poème clandestin devenu symbole de la Résistance. Vercors publie « Le Silence de la mer » (1942), récit clandestin.

  Les textes du XXe siècle aident à comprendre le rapport à l'histoire : ils rappellent la mémoire des événements, dénoncent la violence, défendent la liberté et la dignité humaine.

  Au brevet, on attend que tu identifies l'événement, que tu montres en quoi le texte dépasse le témoignage (émotion, réflexion, forme littéraire) et que tu expliques l'engagement ou la résistance de l'auteur.
methode:
- Identifier l'événement historique auquel le texte fait référence (guerre, occupation, régime totalitaire...) et sa date.
- Se demander ce que le texte littéraire apporte de plus qu'un simple document historique.
- 'Repérer les marques de l''engagement de l''auteur : prise de position, dénonciation, appel à agir.'
- Distinguer ce qui relève du témoignage (ce que l'auteur a vu ou vécu) de ce qui relève de l'écriture (images, rythme, point de vue).
- Réfléchir à l'effet que le texte cherche à produire chez le lecteur (émotion, réflexion, indignation).
- Conclure en reliant le texte à l'histoire et à un message (liberté, mémoire, dénonciation).
vocabulaire:
- terme: engagement
  definition: fait, pour un auteur, de prendre position par ses écrits sur une cause ou contre une injustice
- terme: témoignage
  definition: récit de ce qu'une personne a vécu ou vu, pour en garder une trace
- terme: résistance
  definition: action ou écriture qui s'oppose à une oppression ou à une occupation
- terme: clandestin
  definition: qui se fait ou se publie en secret, pour échapper à la censure ou à la répression
- terme: totalitaire
  definition: se dit d'un régime où l'État contrôle toute la société et supprime les libertés
- terme: censure
  definition: contrôle qui interdit de publier certains textes
- terme: document historique
  definition: source qui donne des faits, des dates ou des chiffres sur un événement
- terme: Occupation
  definition: période de 1940 à 1944 où une grande partie de la France est occupée par l'armée allemande
erreurs_frequentes:
- Réduire un texte littéraire sur l'histoire à un simple résumé des faits, sans voir ce qu'il ajoute au document historique.
- Confondre témoignage (raconter ce qu'on a vécu) et fiction inspirée de faits historiques.
- Croire que l'engagement d'un auteur se limite à décrire des faits, sans jamais prendre position.
- 'Confondre les événements et les dates : Première Guerre mondiale (1914-1918) et Seconde Guerre mondiale (1939-1945).'
- 'Croire qu''un texte de résistance est toujours un texte de combat direct : il peut être un poème, un récit, publié en secret.'
exemple:
  enonce: Explique en une phrase pourquoi un texte littéraire sur la guerre ne se limite pas à un simple document historique.
  solution: Il cherche aussi à faire ressentir une expérience, à donner une forme littéraire à des événements difficiles à dire, au-delà du simple récit des faits.
exercices:
- id: definir-engagement
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que l'engagement d'un écrivain ?
  reponse:
    options:
    - id: a
      texte: Le fait de prendre position, par ses écrits, sur une cause ou contre une injustice
    - id: b
      texte: Le fait d'écrire uniquement des poèmes d'amour
    - id: c
      texte: Le fait de ne jamais parler d'actualité dans ses textes
    - id: d
      texte: Le fait de signer un contrat avec un éditeur
    bonnes:
    - a
  indices:
    relance: Pense à un écrivain qui prend clairement position contre une injustice de son époque, comme Zola dans « J'accuse... ! ».
    methode: Élimine les définitions qui ne parlent ni de position ni de cause défendue.
    etape: La bonne réponse parle d'une prise de position par l'écriture.
  pieges:
  - si:
      contient:
      - b
    relance: 'L''engagement ne se limite pas aux poèmes d''amour : il concerne la prise de position sur une cause.'
  - si:
      contient:
      - c
    relance: 'C''est l''inverse : un écrivain engagé parle souvent des événements de son époque, il ne les évite pas.'
  - si:
      contient:
      - d
    relance: Signer un contrat avec un éditeur n'a rien à voir avec l'engagement littéraire.
  solution: L'engagement d'un écrivain est le fait de prendre position, par ses écrits, sur une cause ou contre une injustice.
- id: auteur-jaccuse
  type: texte_court
  difficulte: 2
  enonce: Quel est le nom de famille de l'auteur du texte « J'accuse... ! », publié en 1898 dans le journal L'Aurore ?
  reponse:
    acceptees:
    - zola
    fautes_tolerees: 1
  indices:
    relance: Cet écrivain, romancier du XIXe siècle, prend publiquement position dans l'affaire Dreyfus.
    methode: Cherche le nom d'un romancier célèbre pour ses romans réalistes et pour avoir défendu un homme injustement condamné.
    etape: Son nom commence par « Zo- ».
  pieges:
  - si:
      valeur: hugo
    relance: Victor Hugo est aussi un écrivain engagé, mais ce n'est pas lui l'auteur de « J'accuse... ! ».
  - si:
      valeur: voltaire
    relance: Voltaire vit au XVIIIe siècle, bien avant l'affaire Dreyfus de 1898.
  solution: L'auteur de « J'accuse... ! » est Émile Zola, publié en 1898 dans le journal L'Aurore.
- id: chronologie-engagement
  type: ordre
  difficulte: 2
  enonce: Range ces trois événements ou textes du plus ancien au plus récent.
  reponse:
    elements:
    - id: jaccuse
      texte: « J'accuse... ! » d'Émile Zola, 1898
    - id: premiere-guerre
      texte: La Première Guerre mondiale, 1914-1918
    - id: seconde-guerre
      texte: La Seconde Guerre mondiale et la Résistance, 1939-1945
  indices:
    relance: « J'accuse... ! » est publié avant les deux guerres mondiales du XXe siècle. Laquelle des deux guerres vient en premier ?
    methode: Range d'abord le texte de 1898, puis la Première Guerre mondiale, puis la Seconde Guerre mondiale.
    etape: « J'accuse... ! » précède la Première Guerre mondiale, qui précède elle-même la Seconde Guerre mondiale.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux événements voisins sont inversés. Lequel des deux a lieu en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus ancien (1898), puis le plus récent (1939-1945).
  solution: « J'accuse... ! » est publié en 1898, avant la Première Guerre mondiale (1914-1918), elle-même antérieure à la Seconde Guerre mondiale (1939-1945).
- id: notions-et-definitions-xxe
  type: association
  difficulte: 2
  enonce: Associe chaque notion à sa définition.
  reponse:
    gauche:
    - id: a
      texte: L'engagement
    - id: b
      texte: La résistance littéraire
    - id: c
      texte: Le témoignage
    droite:
    - id: x
      texte: Prendre position par ses écrits sur une cause ou une injustice
    - id: y
      texte: Écrire, parfois en secret, pour s'opposer à une oppression
    - id: z
      texte: Raconter ce qu'on a vécu ou vu, pour en garder une trace
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une de ces notions parle de prise de position générale, une autre d'opposition secrète, une autre de récit vécu.
    methode: Associe d'abord l'engagement à la prise de position, puis la résistance à l'opposition secrète, puis le témoignage au récit vécu.
    etape: L'engagement est une prise de position ; la résistance littéraire s'oppose en secret à une oppression ; le témoignage raconte ce qu'on a vécu.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la différence entre engagement et résistance littéraire.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque notion une par une, en te demandant si elle parle de position générale, d'opposition secrète, ou de récit vécu.
  solution: L'engagement est une prise de position par l'écriture, la résistance littéraire s'oppose en secret à une oppression, le témoignage raconte ce qu'on a vécu.
- id: exemple-engagement-xxe
  type: ouverte
  difficulte: 3
  enonce: Choisis un texte ou un auteur du XXe siècle étudié en classe et explique en quoi il dépasse le simple témoignage historique.
  criteres:
  - L'élève cite un texte ou un auteur précis lié à un événement du XXe siècle.
  - L'élève explique ce que le texte raconte de cet événement historique.
  - L'élève montre en quoi le texte va au-delà d'un simple document historique (émotion, réflexion, forme littéraire).
  indices:
    relance: Un document historique donne des faits et des dates. Que peut apporter en plus un texte littéraire sur le même événement ?
    methode: Nomme d'abord le texte et l'événement historique, puis explique ce que le texte ajoute au simple récit des faits.
    etape: Tu peux commencer ainsi « Ce texte raconte..., mais il va plus loin car... ».
  solution: Par exemple, un récit sur la Première Guerre mondiale peut raconter les combats comme le ferait un livre d'histoire, mais il va plus loin en faisant ressentir la peur ou l'épuisement des soldats, à travers des images et un point de vue personnel qu'un simple document historique ne donne pas.
- id: poeme-liberte
  type: texte_court
  difficulte: 2
  enonce: Quel poète a publié en 1942 le poème clandestin « Liberté », devenu un symbole de la Résistance ? Donne son nom de famille.
  reponse:
    acceptees:
    - Éluard
    - Eluard
    fautes_tolerees: 1
  indices:
    relance: Ce poète a écrit sous l'Occupation et est devenu un symbole de poésie de la Résistance.
    methode: Son nom commence par « Élu- ».
    etape: Ne le confonds pas avec Zola ou Apollinaire.
  pieges:
  - si:
      valeur: aragon
    relance: Aragon est aussi un poète de la Résistance, mais ce n'est pas l'auteur de « Liberté ».
  - si:
      valeur: apollinaire
    relance: Apollinaire est mort en 1918, bien avant 1942.
  solution: Paul Éluard a publié « Liberté » en 1942, pendant l'Occupation.
- id: temoignage-litterature
  type: choix
  difficulte: 2
  enonce: Quelle affirmation est vraie ?
  reponse:
    options:
    - id: a
      texte: Un texte littéraire sur la guerre peut aller au-delà du témoignage en donnant une forme à l'expérience
    - id: b
      texte: Un texte littéraire se limite à donner des dates
    - id: c
      texte: Un texte littéraire n'a jamais de lien avec l'histoire
    - id: d
      texte: Un témoignage est toujours un poème
    bonnes:
    - a
  indices:
    relance: Un texte littéraire fait plus que raconter des faits.
    methode: Élimine les réponses qui disent que la littérature ne fait que donner des faits ou n'a aucun lien avec l'histoire.
    etape: La bonne réponse parle d'une forme donnée à l'expérience.
  pieges:
  - si:
      contient:
      - b
    relance: Donner des dates est le travail d'un document historique, pas d'un texte littéraire.
  - si:
      contient:
      - c
    relance: Ces textes sont justement liés à des bouleversements historiques.
  - si:
      contient:
      - d
    relance: Un témoignage est un récit de ce qu'on a vécu, pas forcément un poème.
  solution: 'Un texte littéraire dépasse le document historique : il donne une forme à l''expérience et cherche à faire ressentir et réfléchir.'
