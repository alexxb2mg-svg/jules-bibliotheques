# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: progres-scientifique-et-litterature
version: 1
etat: verifiee
declencheurs:
- roman sur un savant inventeur
- récit d'anticipation futuriste
- livre qui imagine le futur
- histoire de science-fiction
prerequis: []
essentiel: 'Depuis le XIXe siècle surtout, la littérature s''interroge sur le progrès scientifique et technologique.

  Ce progrès est parfois célébré comme une avancée extraordinaire pour l''humanité, parfois montré comme

  une source de danger ou de désillusion.

  La littérature met souvent en scène la figure du savant : un personnage créateur, parfois génial et

  bienfaiteur, parfois inquiétant et presque diabolique, dont les découvertes échappent à son contrôle.

  Les récits d''anticipation imaginent un futur possible, souvent grâce à la science. On distingue l''utopie,

  qui imagine une société idéale et parfaite, et la dystopie, qui imagine au contraire une société où le

  progrès a tourné au cauchemar.

  Ces récits expriment les angoisses et les espoirs de l''humanité face aux avancées scientifiques et techniques,

  y compris aujourd''hui les questions liées à l''environnement.

  '
methode:
- Repérer si le texte célèbre le progrès scientifique ou s'il en montre plutôt les dangers.
- 'Identifier la figure du savant dans le texte : est-elle présentée comme bienfaisante ou inquiétante ?'
- Distinguer si le récit imagine une société idéale (utopie) ou une société où tout a mal tourné (dystopie).
- Se demander quelles angoisses ou quels espoirs de l'humanité le texte exprime à travers le progrès scientifique.
vocabulaire:
- terme: utopie
  definition: récit qui imagine une société idéale et parfaite, souvent grâce au progrès
- terme: dystopie
  definition: récit qui imagine une société où le progrès scientifique a tourné au cauchemar
- terme: anticipation
  definition: récit qui imagine un futur possible, souvent grâce à la science
erreurs_frequentes:
- Confondre utopie (société idéale imaginée) et dystopie (société où tout a mal tourné).
- Croire que la figure du savant est toujours présentée comme bienfaisante dans la littérature.
- Réduire un récit d'anticipation à une simple histoire de machines, sans voir les questions humaines qu'il pose.
exemple:
  enonce: Explique en une phrase la différence entre une utopie et une dystopie.
  solution: L'utopie imagine une société idéale et parfaite, alors que la dystopie imagine une société où le progrès a tourné
    au cauchemar.
exercices:
- id: definir-dystopie
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une dystopie ?
  reponse:
    options:
    - id: a
      texte: Un récit qui imagine une société où le progrès scientifique a tourné au cauchemar
    - id: b
      texte: Un récit qui raconte la vie quotidienne d'une famille ordinaire aujourd'hui
    - id: c
      texte: Un poème qui célèbre la beauté de la nature
    - id: d
      texte: Un récit qui décrit une société parfaite et idéale
    bonnes:
    - a
  indices:
    relance: Pense à un récit qui montre un futur où la technologie contrôle et opprime les gens, au lieu de les aider.
    methode: Élimine les définitions qui ne parlent ni de futur imaginé ni de progrès qui tourne mal.
    etape: La bonne réponse parle d'un cauchemar lié au progrès, pas d'une société parfaite.
  pieges:
  - si:
      contient:
      - b
    relance: 'Une dystopie ne raconte pas la vie ordinaire d''aujourd''hui : c''est un récit qui imagine un futur inquiétant.'
  - si:
      contient:
      - c
    relance: 'Ce n''est pas une dystopie : ce type de poème ne parle pas du progrès scientifique qui tourne mal.'
  - si:
      contient:
      - d
    relance: 'C''est la définition de l''utopie, pas de la dystopie : la dystopie montre au contraire une société qui a mal
      tourné.'
  solution: Une dystopie est un récit qui imagine une société où le progrès scientifique a tourné au cauchemar.
- id: mot-societe-ideale
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne un récit qui imagine une société idéale et parfaite, souvent grâce au progrès ?
  reponse:
    acceptees:
    - utopie
    fautes_tolerees: 1
  indices:
    relance: Ce mot est le contraire de « dystopie », qui imagine une société où tout a mal tourné.
    methode: Cherche le mot qui commence par « uto- » et désigne une société parfaite imaginée.
    etape: Le mot est court, il commence par « U ».
  pieges:
  - si:
      valeur: dystopie
    relance: La dystopie imagine une société où tout a mal tourné, pas une société idéale. Cherche le mot contraire.
  - si:
      valeur: anticipation
    relance: L'anticipation est un terme plus général pour un récit qui imagine le futur. Cherche le mot précis pour une société
      idéale.
  solution: 'Le mot est utopie : un récit qui imagine une société idéale et parfaite.'
- id: figures-du-savant
  type: association
  difficulte: 2
  enonce: Associe chaque type de figure du savant à sa description.
  reponse:
    gauche:
    - id: a
      texte: Le savant bienfaiteur
    - id: b
      texte: Le savant inquiétant
    - id: c
      texte: Le savant dépassé par sa création
    droite:
    - id: x
      texte: Il utilise ses découvertes pour aider l'humanité
    - id: y
      texte: Ses recherches inspirent de la peur ou de la méfiance
    - id: z
      texte: Sa création lui échappe et devient incontrôlable
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces savants aide les gens, un autre fait peur, le dernier perd le contrôle de ce qu'il a créé.
    methode: Associe d'abord le savant bienfaiteur à l'aide qu'il apporte, puis le savant inquiétant à la peur, puis celui
      qui perd le contrôle.
    etape: Le savant bienfaiteur aide l'humanité ; le savant inquiétant fait peur ; le savant dépassé perd le contrôle de
      sa création.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la différence entre inquiéter et perdre le contrôle.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque figure une par une, en te demandant si elle aide, fait peur, ou perd le contrôle.
  solution: Le savant bienfaiteur aide l'humanité par ses découvertes, le savant inquiétant fait peur par ses recherches,
    le savant dépassé perd le contrôle de sa propre création.
- id: ordre-reception-progres
  type: ordre
  difficulte: 2
  enonce: Range ces trois façons de percevoir le progrès scientifique, de la plus positive à la plus négative.
  reponse:
    elements:
    - id: exalte
      texte: Le progrès est exalté et mythifié comme une avancée extraordinaire
    - id: interroge
      texte: Le progrès est interrogé, avec ses avantages et ses risques
    - id: rejete
      texte: Le progrès est objet de répulsion ou de désillusion
  indices:
    relance: La première façon célèbre le progrès sans réserve ; la dernière le rejette presque entièrement.
    methode: Range d'abord la vision la plus positive, puis la vision nuancée, puis la vision la plus négative.
    etape: Exalter le progrès est très positif ; l'interroger est nuancé ; le rejeter avec désillusion est très négatif.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux visions voisines sont inversées. Laquelle des deux est la plus positive ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la vision la plus positive (l'exaltation), puis la plus négative (la répulsion).
  solution: Le progrès peut être exalté et mythifié (vision très positive), interrogé avec ses avantages et ses risques (vision
    nuancée), ou objet de répulsion et de désillusion (vision négative).
- id: exemple-anticipation
  type: ouverte
  difficulte: 3
  enonce: Choisis un récit d'anticipation, une utopie ou une dystopie étudiée en classe et explique quelle inquiétude ou quel
    espoir humain il exprime.
  criteres:
  - L'élève cite un récit ou un auteur précis étudié en classe, relevant de l'anticipation, de l'utopie ou de la dystopie.
  - L'élève explique ce que ce récit imagine pour le futur (société idéale, cauchemar technologique...).
  - L'élève relie ce récit à une inquiétude ou un espoir réel de l'humanité (environnement, liberté, technologie...).
  indices:
    relance: Ce récit imagine-t-il un futur meilleur ou un futur inquiétant ? Quelle peur ou quel espoir humain cela exprime-t-il
      ?
    methode: Nomme d'abord le récit, puis explique ce qu'il imagine pour le futur, puis relie cela à une inquiétude ou un
      espoir réels.
    etape: Tu peux commencer ainsi « Ce récit imagine un futur où..., ce qui exprime la peur (ou l'espoir) de... ».
  solution: Par exemple, un récit de dystopie qui imagine une société entièrement contrôlée par des machines exprime la peur
    de perdre sa liberté face au progrès technologique, une inquiétude toujours actuelle aujourd'hui.
- id: nblm-quel-terme-designe-un-recit-d-anticipati-1
  type: choix
  difficulte: 2
  enonce: Quel terme désigne un récit d'anticipation futuriste qui imagine une société où le progrès scientifique a tourné
    au cauchemar ?
  reponse:
    options:
    - id: o1
      texte: Une dystopie
    - id: o2
      texte: Une utopie
    - id: o3
      texte: Un conte drolatique
    - id: o4
      texte: Une autobiographie
    bonnes:
    - o1
  indices:
    relance: Pense au concept opposé à une société idéale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : l''utopie imagine une société idéale et parfaite, pas un cauchemar.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : un conte drolatique est un récit comique et grivois, sans rapport avec la dérive scientifique.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''autobiographie est un récit où l''auteur raconte sa propre vie réelle.'
  solution: 'Une dystopie. C''est la bonne réponse : la dystopie désigne un récit qui imagine une société où le progrès a
    dérivé vers un cauchemar.'
- id: nblm-dans-un-roman-sur-un-savant-inventeur-co-2
  type: choix
  difficulte: 2
  enonce: Dans un roman sur un savant inventeur, comment la figure du chercheur est-elle fréquemment représentée ?
  reponse:
    options:
    - id: o1
      texte: Comme un créateur dont les découvertes peuvent échapper à son contrôle
    - id: o2
      texte: Comme un personnage toujours exclusivement bienveillant et sans aucun risque
    - id: o3
      texte: Comme un poète décrivant uniquement ses émotions face à un paysage
    - id: o4
      texte: Comme un témoin historique décrivant des événements du Moyen Âge
    bonnes:
    - o1
  indices:
    relance: Considère le risque que l'invention dépasse la volonté de celui qui l'a créée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que le savant est toujours présenté de manière bienveillante est faux.'
  - si:
      contient:
      - o3
    relance: 'Faux : cela caractérise la poésie lyrique de la nature, pas le roman sur un savant.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : cela relève du roman historique ou du témoignage d''archives.'
  solution: 'Comme un créateur dont les découvertes peuvent échapper à son contrôle. C''est exact : la littérature met en
    scène des savants créateurs dont les inventions dépassent ou échappent à leur créateur.'
- id: nblm-comment-definit-on-un-recit-d-anticipati-3
  type: choix
  difficulte: 2
  enonce: Comment définit-on un récit d'anticipation futuriste dans la littérature de science-fiction ?
  reponse:
    options:
    - id: o1
      texte: Un récit qui imagine un futur possible, souvent grâce à la science
    - id: o2
      texte: Un récit strictement autobiographique retraçant l'enfance de l'auteur
    - id: o3
      texte: Un pamphlet politique analysant des événements historiques réels du passé
    - id: o4
      texte: Un texte théâtral composé uniquement de didascalies sans dialogue
    bonnes:
    - o1
  indices:
    relance: Songe à la projection dans l'avenir à partir des connaissances scientifiques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : il s''agit d''une fiction tournée vers l''avenir, non d''un récit de vie passé.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : un pamphlet attaque violemment une personne ou institution contemporaine.'
  - si:
      contient:
      - o4
    relance: 'Faux : cela ne correspond pas au genre du récit d''anticipation.'
  solution: 'Un récit qui imagine un futur possible, souvent grâce à la science. C''est la définition exacte : l''anticipation
    imagine un avenir possible en s''appuyant sur les sciences.'
- id: nblm-quel-est-l-enjeu-principal-d-un-livre-qu-4
  type: choix
  difficulte: 2
  enonce: Quel est l'enjeu principal d'un livre qui imagine le futur à travers la science-fiction ?
  reponse:
    options:
    - id: o1
      texte: Exprimer les angoisses et les espoirs de l'humanité face aux progrès techniques
    - id: o2
      texte: Fournir un manuel d'utilisation pour des appareils électroniques
    - id: o3
      texte: Raconter une histoire comique sans aucun lien avec le monde réel
    - id: o4
      texte: Recopier fidèlement un dictionnaire de mots savants
    bonnes:
    - o1
  indices:
    relance: Pense aux questions éthiques et morales que la technologie suscite chez les humains.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : réduire l''œuvre d''anticipation à une simple explication technique.'
  - si:
      contient:
      - o3
    relance: 'Faux : les histoires de science-fiction portent une réflexion profonde sur l''humanité.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : il s''agit de récits littéraires et non d''ouvrages lexicographiques.'
  solution: 'Exprimer les angoisses et les espoirs de l''humanité face aux progrès techniques. C''est la bonne réponse : ces
    récits questionnent les conséquences humaines et sociétales des avancées.'
- id: nblm-lorsqu-un-eleve-etudie-une-histoire-de-s-5
  type: choix
  difficulte: 2
  enonce: Lorsqu'un élève étudie une histoire de science-fiction, quels ponts culturels établit-il selon les programmes ?
  reponse:
    options:
    - id: o1
      texte: Des ponts entre le passé, le présent et les questions du monde de demain
    - id: o2
      texte: Un lien restreint aux règles d'orthographe du XVIIe siècle
    - id: o3
      texte: Une rupture totale rejetant toutes les connaissances historiques
    - id: o4
      texte: Uniquement une analyse de la conjugaison des verbes au présent
    bonnes:
    - o1
  indices:
    relance: Réfléchis au lien temporel reliant l'hier, l'aujourd'hui et l'avenir.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : l''enjeu est culturel et littéraire, non limité à l''orthographe ancienne.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : la littérature s''appuie sur le passé et le présent pour penser le futur.'
  - si:
      contient:
      - o4
    relance: 'Faux : il s''agit d''une démarche d''interprétation littéraire et culturelle globale.'
  solution: 'Des ponts entre le passé, le présent et les questions du monde de demain. C''est exact : la lecture d''œuvres
    d''anticipation permet de relier les époques et d''interroger l''avenir.'
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant l'utopie dans les récits scientifiques ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Elle imagine une société idéale et parfaite
    - id: o2
      texte: Elle exprime les espoirs positifs de l'humanité vers un monde meilleur
    - id: o3
      texte: Elle décrit une société cauchemardesque et oppressive
    - id: o4
      texte: Elle est rédigée sous forme d'un journal intime personnel
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les options caractérisant une vision optimiste et parfaite du futur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la société cauchemardesque est la définition de la dystopie.'
  - si:
      contient:
      - o4
    relance: 'Faux : le journal intime est une forme d''écriture de soi au quotidien, non une utopie.'
  solution: 'Elle imagine une société idéale et parfaite ; Elle exprime les espoirs positifs de l''humanité vers un monde
    meilleur. C''est juste : l''utopie est la représentation d''une société idéale grâce au progrès.'
- id: nblm-quel-terme-designe-un-recit-d-anticipati-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne un récit d'anticipation imaginaire qui décrit une société idéale et parfaite ?
  reponse:
    acceptees:
    - utopie
    fautes_tolerees: 1
  indices:
    relance: Nom féminin désignant un monde idéal.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: utopie. L'utopie est le nom exact désignant un récit imaginant une société parfaite.
- id: nblm-complete-le-nom-du-genre-litteraire-qui-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète le nom du genre littéraire qui explore le futur et le progrès : l''histoire de science-_______.'
  reponse:
    acceptees:
    - fiction
    fautes_tolerees: 1
  indices:
    relance: Mot désignant une création de l'imagination qui complète 'science-'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: fiction. Le mot 'fiction' forme avec 'science' le nom du genre explorant le futur et les sciences.
