# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: progres-scientifique-et-litterature
version: 2
etat: generee
declencheurs:
- roman sur un savant inventeur
- récit d'anticipation futuriste
- livre qui imagine le futur
- histoire de science-fiction
- savant fou dans un roman
- société parfaite imaginée
- futur cauchemardesque dans un livre
- littérature et inventions
prerequis: []
essentiel: |
  Au XIXe siècle, la science et les techniques progressent très vite : machine à vapeur, chemin de fer, électricité, médecine. Les écrivains s'interrogent sur ce progrès. Tantôt ils l'exaltent et en font presque un mythe : la science va rendre les hommes heureux. Tantôt ils s'en méfient, ou en sont déçus : elle peut aussi faire peur et faire du mal.

  La littérature met souvent en scène la figure du savant. Le savant peut être un créateur génial et un bienfaiteur : il invente, il explore, il aide l'humanité (le capitaine Nemo de Jules Verne, dans « Vingt mille lieues sous les mers », 1870, est un savant explorateur). Il peut aussi être une figure malfaisante ou diabolique. Dans « Frankenstein » de Mary Shelley (1818), le savant crée un être vivant, puis sa création lui échappe. Dans « L'étrange cas du docteur Jekyll et de M. Hyde » de Stevenson (1886), une expérience fait naître un double dangereux.

  L'art ne fait pas que raconter la science : il pense, imagine, et parfois anticipe le progrès. Jules Verne imagine des voyages et des machines avant qu'ils existent. Ce genre s'appelle le récit d'anticipation. La science-fiction en est un prolongement.

  Deux visions s'opposent. L'utopie imagine une société idéale, parfaite (le mot vient de « Utopia », de Thomas More, 1516). La dystopie imagine une société où tout a mal tourné : contrôle, perte de liberté, technologie qui opprime. « 1984 » d'Orwell (1949) et « Fahrenheit 451 » de Bradbury (1953) sont des dystopies.

  Ces récits expriment les espoirs et les angoisses de l'humanité face au progrès, y compris aujourd'hui pour l'environnement.

  Au brevet, on attend que tu identifies la vision du progrès (exaltée, nuancée, rejetée), que tu reconnaisses la figure du savant, et que tu relies le texte à une peur ou à un espoir précis.
methode:
- "Repérer la vision du progrès dans le texte : exalté (admiration), interrogé (avantages et risques) ou rejeté (peur, désillusion)."
- "Identifier la figure du savant, s'il y en a une : bienfaiteur, inquiétant ou dépassé par sa création. Relever les mots qui le montrent."
- Décider si le récit est une utopie (société idéale) ou une dystopie (société qui a mal tourné), en cherchant ce qui est contrôlé, interdit ou rendu parfait.
- "Se demander si le texte anticipe le futur : quelle invention ou quelle société imagine-t-il ?"
- Relier le texte à une angoisse ou à un espoir réel de l'humanité (liberté, guerre, environnement, technologie).
- Rédiger avec un exemple précis (titre, auteur, extrait) et une phrase de conclusion.
vocabulaire:
- terme: utopie
  definition: récit qui imagine une société idéale et parfaite, souvent grâce au progrès
- terme: dystopie
  definition: récit qui imagine une société où le progrès a tourné au cauchemar
- terme: anticipation
  definition: récit qui imagine un futur possible, souvent grâce à la science
- terme: science-fiction
  definition: genre de récits qui imaginent des sciences, des techniques ou des mondes futurs
- terme: figure du savant
  definition: personnage de scientifique ou d'inventeur, présenté comme génial, bienfaisant ou dangereux
- terme: exalter
  definition: célébrer avec enthousiasme, présenter comme admirable
- terme: désillusion
  definition: déception quand on découvre que ce qu'on espérait n'est pas vrai
erreurs_frequentes:
- Confondre utopie (société idéale imaginée) et dystopie (société où tout a mal tourné).
- Croire que la figure du savant est toujours présentée comme bienfaisante dans la littérature.
- Réduire un récit d'anticipation à une simple histoire de machines, sans voir les questions humaines qu'il pose.
- "Croire que tous les écrivains du XIXe siècle admirent le progrès : certains le critiquent ou le redoutent."
- "Citer un titre sans l'expliquer : au brevet, un exemple doit être relié à l'idée qu'il illustre."
exemple:
  enonce: Explique en une phrase la différence entre une utopie et une dystopie.
  solution: L'utopie imagine une société idéale et parfaite, alors que la dystopie imagine une société où le progrès a tourné au cauchemar.
exercices:
- id: definir-dystopie
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une dystopie ?
  reponse:
    options:
    - id: a
      texte: Un récit qui imagine une société où le progrès scientifique a tourné au cauchemar
    - id: b
      texte: Un récit qui raconte la vie quotidienne d'une famille ordinaire aujourd'hui
    - id: c
      texte: Un poème qui célèbre la beauté de la nature
    - id: d
      texte: Un récit qui décrit une société parfaite et idéale
    bonnes:
    - a
  indices:
    relance: Pense à un récit qui montre un futur où la technologie contrôle et opprime les gens, au lieu de les aider.
    methode: Élimine les définitions qui ne parlent ni de futur imaginé ni de progrès qui tourne mal.
    etape: La bonne réponse parle d'un cauchemar lié au progrès, pas d'une société parfaite.
  pieges:
  - si:
      contient:
      - b
    relance: "Une dystopie ne raconte pas la vie ordinaire d'aujourd'hui : c'est un récit qui imagine un futur inquiétant."
  - si:
      contient:
      - c
    relance: "Ce n'est pas une dystopie : ce type de poème ne parle pas du progrès scientifique qui tourne mal."
  - si:
      contient:
      - d
    relance: "C'est la définition de l'utopie, pas de la dystopie : la dystopie montre au contraire une société qui a mal tourné."
  solution: Une dystopie est un récit qui imagine une société où le progrès scientifique a tourné au cauchemar.
- id: mot-societe-ideale
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne un récit qui imagine une société idéale et parfaite, souvent grâce au progrès ?
  reponse:
    acceptees:
    - utopie
    fautes_tolerees: 1
  indices:
    relance: Ce mot est le contraire de « dystopie », qui imagine une société où tout a mal tourné.
    methode: Cherche le mot qui commence par « uto- » et désigne une société parfaite imaginée.
    etape: Le mot est court, il commence par « U ».
  pieges:
  - si:
      valeur: dystopie
    relance: La dystopie imagine une société où tout a mal tourné, pas une société idéale. Cherche le mot contraire.
  - si:
      valeur: anticipation
    relance: L'anticipation est un terme plus général pour un récit qui imagine le futur. Cherche le mot précis pour une société idéale.
  solution: "Le mot est utopie : un récit qui imagine une société idéale et parfaite."
- id: figures-du-savant
  type: association
  difficulte: 2
  enonce: Associe chaque type de figure du savant à sa description.
  reponse:
    gauche:
    - id: a
      texte: Le savant bienfaiteur
    - id: b
      texte: Le savant inquiétant
    - id: c
      texte: Le savant dépassé par sa création
    droite:
    - id: x
      texte: Il utilise ses découvertes pour aider l'humanité
    - id: y
      texte: Ses recherches inspirent de la peur ou de la méfiance
    - id: z
      texte: Sa création lui échappe et devient incontrôlable
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces savants aide les gens, un autre fait peur, le dernier perd le contrôle de ce qu'il a créé.
    methode: Associe d'abord le savant bienfaiteur à l'aide qu'il apporte, puis le savant inquiétant à la peur, puis celui qui perd le contrôle.
    etape: Le savant bienfaiteur aide l'humanité ; le savant inquiétant fait peur ; le savant dépassé perd le contrôle de sa création.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la différence entre inquiéter et perdre le contrôle.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque figure une par une, en te demandant si elle aide, fait peur, ou perd le contrôle.
  solution: Le savant bienfaiteur aide l'humanité par ses découvertes, le savant inquiétant fait peur par ses recherches, le savant dépassé perd le contrôle de sa propre création.
- id: ordre-reception-progres
  type: ordre
  difficulte: 2
  enonce: Range ces trois façons de percevoir le progrès scientifique, de la plus positive à la plus négative.
  reponse:
    elements:
    - id: exalte
      texte: Le progrès est exalté et mythifié comme une avancée extraordinaire
    - id: interroge
      texte: Le progrès est interrogé, avec ses avantages et ses risques
    - id: rejete
      texte: Le progrès est objet de répulsion ou de désillusion
  indices:
    relance: La première façon célèbre le progrès sans réserve ; la dernière le rejette presque entièrement.
    methode: Range d'abord la vision la plus positive, puis la vision nuancée, puis la vision la plus négative.
    etape: Exalter le progrès est très positif ; l'interroger est nuancé ; le rejeter avec désillusion est très négatif.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: "Presque : deux visions voisines sont inversées. Laquelle des deux est la plus positive ?"
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la vision la plus positive (l'exaltation), puis la plus négative (la répulsion).
  solution: Le progrès peut être exalté et mythifié (vision très positive), interrogé avec ses avantages et ses risques (vision nuancée), ou objet de répulsion et de désillusion (vision négative).
- id: savant-createur
  type: texte_court
  difficulte: 1
  enonce: Dans le roman de Mary Shelley publié en 1818, un savant donne la vie à un être artificiel qui lui échappe ensuite. Quel est le nom de ce savant ?
  reponse:
    acceptees:
    - Frankenstein
    - Victor Frankenstein
    fautes_tolerees: 2
  indices:
    relance: Ne confonds pas le créateur et sa créature. On cherche celui qui crée, pas l'être créé.
    methode: Le titre du roman est le nom de famille de ce savant, pas celui de son être artificiel.
    etape: Le nom commence par « Fran- » et compte deux syllabes de plus.
  pieges:
  - si:
      valeur: monstre
    relance: Le monstre est la créature. On cherche le nom de celui qui l'a fabriquée.
  solution: Le savant est Victor Frankenstein. Sa création lui échappe, ce qui illustre la figure du savant dépassé par ce qu'il a créé.
- id: oeuvres-et-auteurs
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à son auteur.
  reponse:
    gauche:
    - id: a
      texte: « Vingt mille lieues sous les mers »
    - id: b
      texte: « Frankenstein »
    - id: c
      texte: « 1984 »
    droite:
    - id: x
      texte: Jules Verne
    - id: y
      texte: Mary Shelley
    - id: z
      texte: George Orwell
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une œuvre parle d'un voyage sous l'eau, une autre d'un savant qui crée la vie, la dernière d'une société surveillée.
    methode: Commence par l'œuvre dont tu es le plus sûr, puis élimine.
    etape: L'auteur de récits d'aventures et d'anticipation du XIXe siècle a écrit l'œuvre qui se passe dans un sous-marin.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque œuvre en pensant à son sujet (voyage, création de la vie, surveillance).
  - si:
      diagnostic: associations_fausses
    relance: Pars de l'œuvre dont le sujet est le plus facile à reconnaître, puis avance une œuvre à la fois.
  solution: "« Vingt mille lieues sous les mers » est de Jules Verne (1870), « Frankenstein » de Mary Shelley (1818), « 1984 » de George Orwell (1949)."
- id: dystopie-exprime
  type: choix
  difficulte: 3
  enonce: Quelles peurs ou quels espoirs de l'humanité les récits d'anticipation peuvent-ils exprimer ? Choisis toutes les bonnes réponses.
  reponse:
    options:
    - id: a
      texte: La peur de perdre sa liberté face à une technologie qui surveille
    - id: b
      texte: L'inquiétude pour l'environnement
    - id: c
      texte: La certitude que la science ne peut jamais poser de problème
    - id: d
      texte: Le plaisir de décrire seulement la vie quotidienne d'aujourd'hui
    bonnes:
    - a
    - b
  indices:
    relance: Ces récits posent des questions à l'humanité. Certaines réponses sont des peurs ou des espoirs, d'autres n'en sont pas.
    methode: Élimine ce qui nie tout risque et ce qui ne parle pas du futur.
    etape: Il y a deux bonnes réponses. Elles parlent de liberté et de nature.
  pieges:
  - si:
      contient:
      - c
    relance: Les récits d'anticipation interrogent justement les risques du progrès. Peuvent-ils affirmer qu'il n'y en a aucun ?
  - si:
      contient:
      - d
    relance: Un récit d'anticipation imagine le futur. Décrit-il seulement le présent ?
  solution: Les récits d'anticipation expriment par exemple la peur de perdre sa liberté face à la technologie et l'inquiétude pour l'environnement.
- id: exemple-anticipation
  type: ouverte
  difficulte: 3
  enonce: Choisis un récit d'anticipation, une utopie ou une dystopie étudiée en classe et explique quelle inquiétude ou quel espoir humain il exprime.
  criteres:
  - L'élève cite un récit ou un auteur précis étudié en classe, relevant de l'anticipation, de l'utopie ou de la dystopie.
  - L'élève explique ce que ce récit imagine pour le futur (société idéale, cauchemar technologique...).
  - L'élève relie ce récit à une inquiétude ou un espoir réel de l'humanité (environnement, liberté, technologie...).
  indices:
    relance: Ce récit imagine-t-il un futur meilleur ou un futur inquiétant ? Quelle peur ou quel espoir humain cela exprime-t-il ?
    methode: Nomme d'abord le récit, puis explique ce qu'il imagine pour le futur, puis relie cela à une inquiétude ou un espoir réels.
    etape: "Tu peux commencer ainsi : « Ce récit imagine un futur où..., ce qui exprime la peur (ou l'espoir) de... »."
  solution: Par exemple, un récit de dystopie qui imagine une société entièrement contrôlée par des machines exprime la peur de perdre sa liberté face au progrès technologique, une inquiétude toujours actuelle aujourd'hui.
