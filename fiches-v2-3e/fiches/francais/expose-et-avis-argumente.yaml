# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: expose-et-avis-argumente
version: 3
etat: verifiee
declencheurs:
- préparer un exposé oral
- faire un compte rendu de lecture
- donner mon avis sur une œuvre à l'oral
- utiliser des fiches pour présenter
- présenter un livre à la classe
- diaporama pour un exposé
- dire pourquoi j'aime
- résumer oralement un article
prerequis: []
essentiel: 'À l''oral, on rencontre trois exercices proches. Il faut savoir les distinguer et les réussir.


  Le compte rendu résume ce qu''on a lu, vu ou appris : un livre, une sortie, un article, une conférence. Il doit rester fidèle
  au contenu d''origine, être clair pour quelqu''un qui ne connaît pas le document et ne pas mêler ses opinions aux faits.
  On présente d''abord le document (titre, auteur, sujet), puis les idées principales dans l''ordre, puis une brève conclusion.


  L''exposé développe un sujet devant un public. Il se prépare : chercher des informations dans plusieurs sources fiables,
  faire un plan (introduction, deux ou trois parties, conclusion), noter des mots-clés sur des fiches. On ne lit pas un texte
  entièrement écrit : on parle en regardant l''auditoire, d''une voix claire, sans aller trop vite.


  Les documents supports (diaporama, affiche, schéma, images) aident l''auditoire à suivre. Ils sont lisibles, sobres, avec
  peu de texte et des titres clairs. Ils complètent la parole, ils ne la remplacent pas. On cite ses sources.


  L''avis personnel argumenté exprime son opinion sur une œuvre ou une situation, en cherchant à faire partager son point
  de vue. Un avis sans justification n''est qu''une préférence. Pour argumenter : donner son avis (« Je pense que… »), expliquer
  pourquoi (« car », « parce que »), donner un exemple précis (une scène, une citation), employer un vocabulaire précis (émouvant,
  captivant, prévisible, maladroit) plutôt que « bien » ou « nul ».


  Exemple : « Ce roman m''a plu parce que le narrateur doute sans cesse, ce qui rend l''histoire vivante. »


  Au brevet, l''oral évalue la clarté, la précision du vocabulaire et la capacité à défendre son point de vue avec des arguments.

  '
methode:
- 'Identifie le but : résumer (compte rendu), informer (exposé) ou défendre un avis.'
- Rassemble et sélectionne les informations ou les idées principales.
- Construis un plan simple et écris des mots-clés sur des fiches.
- Prépare des documents supports lisibles, avec peu de texte.
- Pour un avis, associe chaque opinion à une raison et à un exemple.
- 'Entraîne-toi à voix haute : débit calme, regard vers le public.'
vocabulaire:
- terme: compte rendu
  definition: résumé fidèle et clair d'un document, d'une sortie ou d'une lecture
- terme: exposé
  definition: présentation orale organisée d'un sujet devant un public
- terme: document support
  definition: image, schéma ou diaporama qui aide l'auditoire à suivre l'exposé
- terme: argument
  definition: raison donnée pour appuyer une opinion
- terme: exemple
  definition: fait précis qui illustre un argument
- terme: auditoire
  definition: ensemble des personnes qui écoutent
- terme: mot-clé
  definition: mot important qui aide à se souvenir d'une idée
erreurs_frequentes:
- Lire son texte entièrement au lieu de parler avec des fiches.
- Mettre trop de texte sur les diapositives.
- Donner un avis sans raison ni exemple (« c'est nul », « j'ai aimé »).
- Mélanger le résumé de l'œuvre et son opinion dans un compte rendu.
exemple:
  enonce: 'Un élève dit seulement : « Ce roman est nul. » Réécris son avis en une phrase pour qu''il devienne un avis argumenté.'
  solution: Ce roman m'a déçu parce que l'histoire est prévisible dès les premières pages, ce qui m'a empêché d'être surpris
    jusqu'à la fin.
exercices:
- id: reconnaitre-avis-argumente
  type: choix
  difficulte: 1
  enonce: Parmi ces phrases sur un film, laquelle est un véritable avis argumenté ?
  reponse:
    options:
    - id: a
      texte: J'ai aimé ce film parce que les personnages sont attachants et que leurs choix sont expliqués avec des scènes
        précises
    - id: b
      texte: Ce film est super
    - id: c
      texte: Ce film dure deux heures
    - id: d
      texte: Je n'ai pas d'avis sur ce film
    bonnes:
    - a
  indices:
    relance: Un avis argumenté explique un « pourquoi », avec des exemples précis, pas seulement un jugement rapide.
    methode: Cherche la phrase qui donne une opinion ET une explication précise pour la justifier.
    etape: Élimine d'abord les phrases qui ne donnent qu'un fait neutre ou un jugement sans explication.
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase donne un jugement, mais sans aucune justification. Est-ce suffisant pour un avis argumenté ?
  - si:
      contient:
      - c
    relance: Cette phrase donne un fait neutre sur la durée, pas un avis sur la qualité du film.
  - si:
      contient:
      - d
    relance: Cette phrase n'exprime aucune opinion du tout.
  solution: La phrase a est un avis argumenté car elle donne une opinion (aimé) et l'explique avec des éléments précis (personnages
    attachants, choix expliqués).
- id: mot-compte-rendu
  type: texte_court
  difficulte: 1
  enonce: Quelle expression désigne un résumé oral fidèle du contenu d'un livre, d'une sortie ou d'un article, destiné à quelqu'un
    qui ne le connaît pas ?
  reponse:
    acceptees:
    - compte rendu
    fautes_tolerees: 1
  indices:
    relance: On en fait un après une sortie scolaire, pour raconter ce qu'on a vu à ceux qui n'y étaient pas.
    methode: L'expression contient deux mots, le premier évoque une addition ou une évaluation, le second vient du verbe «
      rendre ».
    etape: Le premier mot est « compte », le second « rendu ».
  pieges:
  - si:
      valeur: résumé
    relance: Un résumé peut être écrit ou oral, sur n'importe quel texte. L'expression cherchée est spécifique à une restitution
      orale d'un contenu vécu ou lu, destinée à un auditoire.
  solution: 'Le compte rendu : résumé oral fidèle du contenu d''un document, d''une lecture ou d''un événement, destiné à
    un auditoire qui ne le connaît pas.'
- id: etapes-preparation-expose
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour préparer un exposé oral.
  reponse:
    elements:
    - id: a
      texte: Je choisis les idées principales que je veux présenter
    - id: b
      texte: Je prépare des fiches avec des mots-clés, pas des phrases entières
    - id: c
      texte: Je m'entraîne à parler à voix haute en m'appuyant sur mes fiches
    - id: d
      texte: Je présente mon exposé devant la classe
  indices:
    relance: Quelle est la toute première chose à faire, avant même de préparer des fiches ?
    methode: On choisit d'abord le contenu, puis on prépare le support, puis on s'entraîne, puis on présente.
    etape: On commence toujours par choisir les idées principales à présenter.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la préparation (choisir les idées) et celle qui la ferme (présenter devant la
      classe).
  solution: On choisit d'abord les idées principales, puis on prépare des fiches avec des mots-clés, puis on s'entraîne à
    voix haute, puis on présente devant la classe.
- id: type-oral-fonction
  type: association
  difficulte: 2
  enonce: Relie chaque type de prise de parole à sa fonction principale.
  reponse:
    gauche:
    - id: a
      texte: Un compte rendu de sortie scolaire
    - id: b
      texte: Un exposé sur un sujet d'histoire
    - id: c
      texte: Un avis personnel sur un livre lu
    droite:
    - id: x
      texte: Résumer fidèlement ce qui s'est passé pour ceux qui n'y étaient pas
    - id: y
      texte: Développer et expliquer un sujet avec des documents supports
    - id: z
      texte: Donner une opinion personnelle justifiée par des exemples précis
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque prise de parole, demande-toi si elle résume un vécu, développe un sujet, ou donne une opinion.
    methode: Le compte rendu résume un vécu, l'exposé développe un sujet, l'avis exprime une opinion justifiée.
    etape: Commence par le compte rendu, la fonction la plus simple à repérer.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la fonction précise de chaque type de prise de parole.
  - si:
      diagnostic: associations_fausses
    relance: Repars du compte rendu, qui résume un vécu, puis distingue exposé et avis personnel.
  solution: Le compte rendu résume un vécu. L'exposé développe un sujet avec des documents. L'avis personnel donne une opinion
    justifiée.
- id: nblm-quel-est-l-objectif-principal-d-un-compt-1
  type: choix
  difficulte: 2
  enonce: Quel est l'objectif principal d'un compte rendu oral de lecture ?
  reponse:
    options:
    - id: o1
      texte: Résumer fidèlement le contenu essentiel d'un document sans le déformer.
    - id: o2
      texte: Inventer une suite fictive et originale aux événements du livre.
    - id: o3
      texte: Rédiger un poème en vers pour exprimer ses émotions personnelles.
    - id: o4
      texte: Recopier l'intégralité du texte du livre sur son cahier de brouillon.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au rôle de transmission fidèle des informations principales pour ton auditoire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : inventer une suite relève d''un travail d''écriture créative et non d''un compte rendu explicatif.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la création poétique est un exercice d''expression littéraire, pas un compte rendu d''information.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : recopier le texte est une tâche de copie passive et ne constitue pas une synthèse orale.'
  solution: Résumer fidèlement le contenu essentiel d'un document sans le déformer. C'est la fonction exacte du compte rendu
    oral, qui doit restituer fidèlement l'œuvre pour un auditoire qui ne la connaît pas.
- id: nblm-comment-un-eleve-doit-il-utiliser-ses-fi-2
  type: choix
  difficulte: 2
  enonce: Comment un élève doit-il utiliser ses fiches mémoire pour présenter un exposé oral ?
  reponse:
    options:
    - id: o1
      texte: En s'appuyant sur des mots-clés simples pour parler naturellement à la classe.
    - id: o2
      texte: En lisant mot à mot l'intégralité du texte rédigé sur ses fiches.
    - id: o3
      texte: En apprenant par cœur ses fiches pour les réciter sans aucune pause.
    - id: o4
      texte: En cachant ses fiches pour ne jamais consulter ses repères pendant l'oral.
    bonnes:
    - o1
  indices:
    relance: Pense à la façon de conserver le contact visuel avec tes camarades tout en gardant tes repères.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : lire son texte empêche de regarder ses camarades et rend la prise de parole monotone.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la récitation mécanique manque de spontanéité et bloque l''interaction avec le public.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ne pas utiliser ses fiches fait prendre le risque de perdre le fil de sa présentation.'
  solution: 'En s''appuyant sur des mots-clés simples pour parler naturellement à la classe. C''est la méthode préconisée
    : noter des mots-clés permet de guider son discours sans lire un texte rédigé.'
- id: nblm-quelle-est-la-difference-essentielle-ent-3
  type: choix
  difficulte: 2
  enonce: Quelle est la différence essentielle entre une simple préférence et un avis argumenté sur une œuvre ?
  reponse:
    options:
    - id: o1
      texte: L'avis argumenté s'explique avec un vocabulaire précis et se justifie par des exemples concrets.
    - id: o2
      texte: La simple préférence exige d'analyser le contexte historique complet de l'auteur.
    - id: o3
      texte: L'avis argumenté consiste uniquement à déclarer « c'est génial » ou « c'est nul ».
    - id: o4
      texte: La simple préférence est toujours rédigée dans un niveau de langue soutenu.
    bonnes:
    - o1
  indices:
    relance: Cherche l'option qui indique comment prouver et expliquer ce qu'on a pensé du livre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : exprimer une préférence ne demande aucune analyse contextuelle ou argumentative.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : donner un jugement brutal sans explication n''est qu''une préférence personnelle.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la préférence se distingue par l''absence d''arguments et non par le niveau de langue.'
  solution: 'L''avis argumenté s''explique avec un vocabulaire précis et se justifie par des exemples concrets. Un avis argumenté
    ne se contente pas d''exprimer un goût : il explique pourquoi on pense cela avec des preuves du texte.'
- id: nblm-quel-est-le-role-principal-des-documents-4
  type: choix
  difficulte: 2
  enonce: Quel est le rôle principal des documents supports (diaporama, images) lors d'un exposé ?
  reponse:
    options:
    - id: o1
      texte: Aider l'auditoire à suivre la présentation sans surcharger le support de texte à lire.
    - id: o2
      texte: Remplacer la parole de l'élève pour qu'il n'ait rien à expliquer oralement.
    - id: o3
      texte: Proposer de longs paragraphes écrits que la classe doit lire en silence.
    - id: o4
      texte: Projeter des illustrations décoratives n'ayant aucun lien avec le sujet.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui facilite l'écoute de tes camarades sans les forcer à lire au tableau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le support visuel vient en appui de la parole, il ne se substitue pas à l''orateur.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : afficher trop de texte décourage l''auditoire et nuit à l''écoute de l''exposé.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : chaque document support doit être pertinent et directement utile à la compréhension.'
  solution: Aider l'auditoire à suivre la présentation sans surcharger le support de texte à lire. Les supports doivent illustrer
    et clarifier le propos oral sans imposer la lecture de longs paragraphes.
- id: nblm-selon-les-reperes-de-progression-de-3e-q-5
  type: choix
  difficulte: 2
  enonce: Selon les repères de progression de 3e, quelle durée de prise de parole en continu l'élève doit-il viser en fin
    d'année ?
  reponse:
    options:
    - id: o1
      texte: Dix minutes.
    - id: o2
      texte: Une minute.
    - id: o3
      texte: Trente secondes.
    - id: o4
      texte: Une heure.
    bonnes:
    - o1
  indices:
    relance: Il s'agit du repère temporel officiel pour la prise de parole continue en fin de Cycle 4.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : une minute correspond à une brève prise de parole ponctuelle, non à un exposé construit.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : trente secondes ne permettent pas de développer un sujet ou un compte rendu de lecture.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : une heure dépasse largement la durée attendue pour une prestation scolaire au collège.'
  solution: Dix minutes. Les textes officiels fixent l'objectif de dix minutes en continu pour un oral maîtrisé en fin de
    classe de 3e.
- id: nblm-quelles-sont-les-deux-regles-essentielle-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux règles essentielles pour exprimer un avis argumenté réussi sur une œuvre ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Utiliser un vocabulaire précis plutôt que des termes vagues comme « bien » ou « nul ».
    - id: o2
      texte: Justifier son opinion avec au moins un exemple concret tiré de l'œuvre.
    - id: o3
      texte: Lire l'intégralité d'un texte rédigé à l'avance sans regarder son auditoire.
    - id: o4
      texte: Affirmer son point de vue sans jamais donner d'explication ni de preuve.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux choix qui portent sur la précision du vocabulaire et la présence de preuves.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : lire un texte rédigé nuit à la qualité de la présentation orale.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : déclarer une opinion sans explication est une simple préférence, pas un avis argumenté.'
  solution: 'Utiliser un vocabulaire précis plutôt que des termes vagues comme « bien » ou « nul » ; Justifier son opinion
    avec au moins un exemple concret tiré de l''œuvre. C''est une exigence clé : employer des mots précis permet d''exprimer
    clairement ses impressions.'
- id: nblm-comment-appelle-t-on-le-resume-oral-fide-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le résumé oral fidèle du contenu d'un document, d'une lecture ou d'un événement ?
  reponse:
    acceptees:
    - compte rendu
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'une expression de deux mots signifiant l'action de rendre compte d'une lecture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: compte rendu. Le compte rendu désigne le résumé oral fidèle qui informe l'auditoire sans déformer le document
    d'origine.
- id: nblm-quel-terme-designe-une-opinion-personnel-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne une opinion personnelle sur une œuvre expliquée et justifiée par des exemples précis ?
  reponse:
    acceptees:
    - avis argumenté
    fautes_tolerees: 1
  indices:
    relance: C'est un nom suivi d'un adjectif (deux mots au total) qui s'oppose à la simple préférence non justifiée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: avis argumenté. L'avis argumenté est une opinion personnelle structurée, appuyée sur des explications et des exemples.
- id: qualite-diaporama
  type: choix
  difficulte: 2
  enonce: Parmi ces conseils, lesquels rendent un diaporama efficace pour un exposé ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Peu de texte par diapositive
    - id: b
      texte: Des titres lisibles
    - id: c
      texte: Recopier tout son discours sur les diapositives
    - id: d
      texte: Utiliser des images sans lien avec le sujet
    bonnes:
    - a
    - b
  indices:
    relance: Un document support doit aider l'auditoire, pas le fatiguer.
    methode: Élimine les conseils qui surchargent la diapositive ou qui n'aident pas à comprendre.
    etape: Deux conseils simplifient la lecture. Les deux autres la compliquent.
  pieges:
  - si:
      contient:
      - c
    relance: Si tout le discours est écrit, l'auditoire lit au lieu d'écouter, et l'orateur n'a plus besoin de parler.
  - si:
      contient:
      - d
    relance: Une image doit éclairer le sujet. Sans lien, elle distrait.
  solution: Peu de texte et des titres lisibles rendent le diaporama efficace. Le recopier entièrement ou choisir des images
    sans rapport gêne l'auditoire.
- id: avis-argumente-mot
  type: texte_court
  difficulte: 1
  enonce: Dans « Ce roman m'a plu parce que le héros doute sans cesse », comment s'appelle la raison qui suit « parce que
    » ? (un mot)
  reponse:
    acceptees:
    - argument
    - un argument
    fautes_tolerees: 1
  indices:
    relance: Cette partie de la phrase justifie l'opinion donnée au début.
    methode: On appelle ainsi la raison qui appuie une opinion.
    etape: C'est un nom masculin commençant par la lettre a, lié au verbe « argumenter ».
  pieges:
  - si:
      valeur: exemple
    relance: Un exemple illustre par un fait précis. Ici, on donne une raison générale pour appuyer l'avis.
  solution: 'La raison qui suit « parce que » est un argument : elle justifie l''avis « ce roman m''a plu ».'
- id: presenter-un-livre
  type: ouverte
  difficulte: 3
  enonce: Tu dois présenter à la classe un livre que tu as lu. Rédige l'introduction de ton compte rendu (présentation du
    livre), puis un avis personnel argumenté en trois phrases, avec un exemple précis.
  criteres:
  - L'introduction présente le titre, l'auteur et le sujet du livre de façon claire et fidèle.
  - L'avis donne au moins un argument précis appuyé sur un exemple tiré du livre.
  - Le vocabulaire est précis (pas seulement « bien » ou « nul ») et le résumé reste distinct de l'opinion.
  pieges: []
  indices:
    relance: 'Commence par présenter le livre : titre, auteur, de quoi il parle. Garde ton avis pour la suite.'
    methode: 'Pour l''avis, écris : ce que tu penses, pourquoi, puis un exemple tiré du livre.'
    etape: 'Ton avis peut commencer ainsi : « J''ai aimé ce livre parce que... » puis ajoute un exemple précis.'
  solution: 'Exemple : « Je vais vous présenter un roman d''aventure dont le héros traverse une forêt inconnue. J''ai aimé
    ce livre parce que le suspense est constant. Par exemple, au chapitre 3, le héros se perd et on ne sait pas s''il va s''en
    sortir. Le récit est donc très captivant. »'
