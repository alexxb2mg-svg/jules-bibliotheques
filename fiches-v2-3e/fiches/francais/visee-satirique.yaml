format: 2
notion: visee-satirique
version: 2
etat: verifiee
declencheurs:
- se moquer des travers de la société
- texte qui critique en riant
- caricature d'un personnage
- portrait grossi pour se moquer
- critiquer en faisant rire
- fable avec des animaux
- dessin de presse politique
- faire de l'ironie
- parodie d'une œuvre
- humour pour dénoncer
prerequis: []
essentiel: 'La satire est une œuvre (texte, image, spectacle) qui se moque de quelqu''un ou de quelque chose pour le critiquer.
  Sa visée est double : faire rire et faire réfléchir. Elle veut corriger les défauts des hommes ou dénoncer les travers de
  la société, en les faisant reconnaître.


  Elle prend des formes variées : poème satirique, fable, conte philosophique, roman, pamphlet, dessin de presse, caricature,
  sketch. On distingue la cible (ce qui est critiqué : un défaut, un groupe, une institution, un pouvoir) et le procédé (la
  manière de critiquer).


  Les procédés à connaître. L''ironie dit le contraire de ce qu''on pense, en laissant comprendre la critique. Le grossissement
  (ou la caricature) exagère un défaut pour le rendre ridicule. Le rabaissement présente une chose importante comme petite
  ou méprisable. Le déplacement critique en parlant d''autre chose : des animaux à la place des hommes, un pays imaginaire
  à la place du nôtre. On peut ajouter la parodie, qui imite une œuvre pour s''en moquer, et l''humour, qui joue sur le comique.


  Repères : au XVIIe siècle, La Fontaine écrit des Fables où les animaux représentent les hommes ; La Bruyère peint dans Les
  Caractères des portraits satiriques ; Molière fait la satire de l''hypocrisie ou de l''avarice au théâtre. Au XVIIIe siècle,
  Voltaire écrit le conte philosophique Candide (1759). Le dessin de presse continue aujourd''hui cette tradition.


  Pourquoi faire rire ? Le rire rend la critique plus facile à accepter et plus facile à retenir. Le déplacement peut aussi
  protéger l''auteur d''une censure.


  La satire a une portée morale et sociale, mais aussi des limites : elle peut blesser, mal comprendre sa cible, ou être prise
  au premier degré. Elle joue sur un accord entre l''auteur et le lecteur : il faut reconnaître l''ironie.


  Ce qu''on attend au brevet : repérer la cible, nommer le procédé avec une preuve dans le texte ou l''image, expliquer la
  visée (faire rire pour critiquer) et sa portée.

  '
methode:
- 'Repérer la cible : qui ou quoi est critiqué (un défaut, un groupe, un pouvoir, une institution) ?'
- 'Identifier le procédé : ironie, grossissement, rabaissement, déplacement, parodie.'
- 'Justifier avec une preuve : citer un mot, une phrase ou décrire un détail de l''image.'
- 'Chercher les marques du comique : exagération, contraste, ton faussement admiratif.'
- Dire pourquoi l'auteur choisit de faire rire plutôt que de critiquer directement.
- 'Conclure sur la portée du texte : quel défaut de la société veut-il corriger, et avec quelles limites ?'
vocabulaire:
- terme: satire
  definition: texte ou image qui se moque de quelqu'un ou de quelque chose pour le critiquer
- terme: ironie
  definition: façon de dire une chose en laissant comprendre le contraire, pour critiquer
- terme: caricature
  definition: portrait qui exagère certains traits d'une personne pour la rendre ridicule
- terme: grossissement
  definition: procédé qui exagère un défaut pour le rendre visible et ridicule
- terme: rabaissement
  definition: procédé qui présente une chose importante comme petite ou méprisable
- terme: déplacement
  definition: procédé qui critique une chose en parlant d'une autre, par exemple des animaux
- terme: parodie
  definition: imitation comique d'une œuvre ou d'un style pour s'en moquer
- terme: cible
  definition: personne, groupe ou défaut que la satire critique
- terme: visée
  definition: 'but poursuivi par l''auteur : ici faire rire pour critiquer'
erreurs_frequentes:
- Confondre la satire, qui critique par le rire, avec une simple blague sans intention critique.
- Ne pas reconnaître l'ironie et prendre au premier degré une phrase qui dit le contraire de ce qu'elle veut faire comprendre.
- Oublier que la satire vise souvent un défaut de la société entière, pas seulement une personne précise.
- Nommer un procédé sans le prouver par une citation ou un détail précis.
- Confondre grossissement (exagérer) et rabaissement (diminuer ce qui est important).
exemple:
  enonce: Explique en une phrase ce que fait un auteur quand il grossit un défaut pour se moquer de quelqu'un.
  solution: Il exagère ce défaut jusqu'à le rendre visible et ridicule, pour que le lecteur le remarque et en rie.
exercices:
- id: definir-satire
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une satire ?
  reponse:
    options:
    - id: a
      texte: Un texte ou une image qui se moque de quelqu'un ou de quelque chose pour le critiquer
    - id: b
      texte: Un récit qui raconte la vie de son auteur
    - id: c
      texte: Un poème qui célèbre la beauté de la nature
    - id: d
      texte: Un texte qui explique un fait scientifique
    bonnes:
    - a
  indices:
    relance: 'Pense à un dessin de presse qui se moque d''un homme politique : que cherche-t-il à faire ?'
    methode: Élimine les définitions qui ne parlent ni de moquerie ni de critique.
    etape: 'La bonne réponse associe deux idées : se moquer et critiquer.'
  pieges:
  - si:
      contient:
      - b
    relance: Cette définition correspond plutôt à l'autobiographie. La satire, elle, se moque pour critiquer.
  - si:
      contient:
      - c
    relance: 'Ce n''est pas la satire : ce type de poème n''a pas d''intention critique, il célèbre plutôt qu''il ne se moque.'
  - si:
      contient:
      - d
    relance: 'La satire n''explique pas un fait scientifique : elle critique en se moquant.'
  solution: La satire est un texte ou une image qui se moque de quelqu'un ou de quelque chose pour le critiquer.
- id: procede-satirique
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le procédé qui consiste à dire une chose en laissant comprendre le contraire, pour critiquer ?
  reponse:
    acceptees:
    - ironie
    fautes_tolerees: 1
  indices:
    relance: Ce procédé fait souvent dire à quelqu'un l'inverse de ce qu'il pense vraiment, pour se moquer.
    methode: Cherche le mot qui désigne une phrase du type « Quelle bonne idée ! » dite pour se moquer d'une mauvaise idée.
    etape: Le mot commence par « iro- ».
  pieges:
  - si:
      valeur: caricature
    relance: La caricature est un portrait exagéré, pas une façon de dire le contraire de ce qu'on pense.
  - si:
      valeur: exageration
    relance: L'exagération est proche du grossissement, mais le procédé qui dit le contraire de ce qu'on pense a un autre
      nom.
  solution: 'Le mot est ironie : dire une chose en laissant comprendre le contraire, pour critiquer.'
- id: procedes-satire
  type: association
  difficulte: 2
  enonce: Associe chaque procédé satirique à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Le grossissement
    - id: b
      texte: Le rabaissement
    - id: c
      texte: Le déplacement
    droite:
    - id: x
      texte: Exagérer un défaut pour le rendre ridicule
    - id: y
      texte: Présenter une personne importante comme petite ou méprisable
    - id: z
      texte: Critiquer une chose en parlant d'une autre, par exemple des animaux à la place des hommes
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un des procédés fait grandir un défaut, un autre fait petit ce qui était grand, un autre change de sujet apparent.
    methode: Associe d'abord le procédé qui exagère, puis celui qui rabaisse, puis celui qui change de sujet apparent.
    etape: Le grossissement exagère ; le rabaissement diminue ; le déplacement change de sujet, comme les fables avec des
      animaux.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis bien la différence entre exagérer et rabaisser.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque procédé un par un, en pensant à un exemple précis pour chacun.
  solution: Le grossissement exagère un défaut, le rabaissement diminue quelqu'un d'important, le déplacement critique en
    parlant d'autre chose, comme les animaux dans une fable.
- id: exemple-fable
  type: ouverte
  difficulte: 3
  enonce: Donne un exemple de fable ou de texte satirique étudié en classe et explique quel défaut humain il critique.
  criteres:
  - L'élève cite un texte ou un auteur précis relevant de la satire (fable, conte, dessin de presse...).
  - L'élève identifie un défaut humain critiqué par ce texte (orgueil, avarice, hypocrisie, flatterie...).
  - L'élève explique brièvement comment le texte s'y prend pour critiquer (animaux, exagération, ironie...).
  indices:
    relance: Pense à une fable où des animaux se comportent comme des humains. Quel défaut montrent-ils ?
    methode: Choisis un texte précis, nomme le défaut humain visé, puis explique le procédé utilisé pour s'en moquer.
    etape: Tu peux commencer ainsi « Dans cette fable, l'auteur critique... », puis expliquer comment.
  solution: 'Par exemple, une fable qui met en scène un corbeau flatté par un renard critique la vanité et la crédulité :
    le corbeau, flatté, perd son fromage parce qu''il croit les compliments du renard.'
- id: cible-fable
  type: choix
  difficulte: 1
  enonce: Dans une fable où un corbeau vaniteux perd son fromage parce qu'un renard le flatte, quelle est la cible de la critique
    ?
  reponse:
    options:
    - id: a
      texte: La vanité et la crédulité de ceux qui aiment les compliments
    - id: b
      texte: La beauté de la nature
    - id: c
      texte: L'autobiographie de l'auteur
    - id: d
      texte: Un fait scientifique
    bonnes:
    - a
  indices:
    relance: 'Qu''est-ce qui cause la perte du fromage : la force du renard, ou un défaut du corbeau ?'
    methode: La cible est le défaut humain montré par un animal, pas l'animal lui-même.
    etape: Cherche un défaut qui rend le corbeau facile à tromper.
  pieges:
  - si:
      contient:
      - b
    relance: La nature n'est pas critiquée dans cette fable.
  - si:
      contient:
      - c
    relance: Ce n'est pas un récit de la vie de l'auteur.
  - si:
      contient:
      - d
    relance: Ce n'est pas un texte scientifique, c'est une fable avec une morale.
  solution: La fable critique la vanité et la crédulité, en les montrant à travers des animaux.
- id: auteur-oeuvre-satire
  type: association
  difficulte: 2
  enonce: Associe chaque auteur à son œuvre satirique.
  reponse:
    gauche:
    - id: a
      texte: La Fontaine
    - id: b
      texte: La Bruyère
    - id: c
      texte: Voltaire
    droite:
    - id: x
      texte: Les Fables
    - id: y
      texte: Les Caractères
    - id: z
      texte: Candide
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces auteurs a écrit un conte philosophique au XVIIIe siècle. Les deux autres sont du XVIIe siècle.
    methode: Cherche celui qui écrit avec des animaux, celui qui écrit des portraits, celui qui écrit un conte.
    etape: Voltaire est l'auteur de Candide. Le recueil de portraits est de La Bruyère.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Pense au genre de chaque œuvre : fable, portraits, conte.'
  - si:
      diagnostic: associations_fausses
    relance: Reprends un auteur à la fois, en repensant au genre qu'il a pratiqué.
  solution: 'La Fontaine : Les Fables. La Bruyère : Les Caractères. Voltaire : Candide.'
- id: reperer-ironie
  type: choix
  difficulte: 2
  enonce: 'Dans un texte, un personnage affamé dit : « Quel festin magnifique ! » en regardant un morceau de pain sec. Quel
    procédé est utilisé ?'
  reponse:
    options:
    - id: a
      texte: L'ironie
    - id: b
      texte: Le déplacement
    - id: c
      texte: Le grossissement
    - id: d
      texte: Le calligramme
    bonnes:
    - a
  indices:
    relance: Le personnage pense-t-il vraiment ce qu'il dit ?
    methode: Compare ce qui est dit (festin magnifique) et ce qui est montré (pain sec).
    etape: Le procédé dit le contraire de ce qu'il pense pour critiquer.
  pieges:
  - si:
      contient:
      - b
    relance: Le déplacement parle d'autre chose, par exemple d'animaux. Ici, la phrase est dite à propos de ce que l'on voit.
  - si:
      contient:
      - c
    relance: Le grossissement exagère un défaut. Ici, la phrase dit le contraire de la réalité.
  - si:
      contient:
      - d
    relance: Un calligramme est un poème dont la forme dessine une image, ce n'est pas un procédé satirique.
  solution: 'C''est de l''ironie : la phrase dit le contraire de la réalité pour critiquer.'
- id: analyse-dessin-presse
  type: ouverte
  difficulte: 3
  enonce: Un dessin de presse représente un ministre minuscule, assis sur une pile de dossiers immense, en train de dire «
    Tout est sous contrôle ! ». Explique quelle est sa visée satirique et quels procédés sont utilisés.
  criteres:
  - L'élève identifie la cible (un responsable politique ou son incompétence) et la visée (critiquer en faisant rire).
  - L'élève nomme au moins un procédé (rabaissement par la taille, ironie de la phrase, grossissement des dossiers).
  - L'élève justifie avec un détail précis du dessin (taille du ministre, pile de dossiers, phrase dite).
  indices:
    relance: Que montre le dessin, et que dit le personnage ? Est-ce cohérent ?
    methode: 'Cible, procédé, preuve : tes trois étapes. La taille du personnage compte.'
    etape: Tu peux commencer ainsi « Ce dessin critique... en utilisant... », puis appuie-toi sur un détail de l'image.
  solution: 'Ce dessin critique l''incompétence d''un responsable politique. Le ministre est rabaissé : il est minuscule face
    aux dossiers, ce qui grossit le problème. Sa phrase « Tout est sous contrôle ! » est ironique, car l''image montre le
    contraire. Le dessin fait rire pour faire réfléchir aux promesses qui cachent la réalité.'
