format: 2
notion: visee-satirique
version: 1
etat: verifiee
declencheurs:
- se moquer des travers de la société
- texte qui critique en riant
- caricature d'un personnage
- portrait grossi pour se moquer
prerequis: []
essentiel: 'La satire est un texte, une image ou une oeuvre qui se moque de quelqu''un ou de quelque chose pour le critiquer.

  Elle peut prendre plusieurs formes : un poème, une fable, un conte, un dessin de presse, une caricature.

  La satire joue de plusieurs effets pour faire rire tout en critiquant.

  L''ironie dit une chose en pensant le contraire, pour faire sentir une critique sans la dire directement.

  Le grossissement exagère un défaut pour le rendre visible et ridicule.

  Le rabaissement présente une personne ou une idée importante comme petite ou méprisable.

  Le déplacement critique une chose en parlant d''une autre, par exemple des animaux à la place des hommes,

  comme dans les fables de La Fontaine.

  Au XVIIe siècle, La Bruyère peint dans Les Caractères des portraits satiriques des gens de son temps.

  La satire a une portée morale et sociale : elle veut corriger les défauts humains en les faisant reconnaître.

  Mais elle a aussi des limites : on peut se demander si elle change vraiment la société, ou si elle blesse trop.

  '
methode:
- 'Repérer ce qui est critiqué dans le texte ou l''image : une personne, un groupe, une institution, un défaut.'
- 'Identifier le procédé utilisé : ironie, grossissement, rabaissement ou déplacement.'
- Se demander pourquoi l'auteur choisit de faire rire plutôt que de critiquer directement.
- 'Réfléchir à la portée du texte : quel défaut de la société veut-il corriger ?'
vocabulaire:
- terme: satire
  definition: texte ou image qui se moque de quelqu'un ou de quelque chose pour le critiquer
- terme: ironie
  definition: façon de dire une chose en laissant comprendre le contraire, pour critiquer
- terme: caricature
  definition: portrait qui exagère certains traits d'une personne pour la rendre ridicule
erreurs_frequentes:
- Confondre la satire, qui critique par le rire, avec une simple blague sans intention critique.
- Ne pas reconnaître l'ironie et prendre au premier degré une phrase qui dit le contraire de ce qu'elle veut faire comprendre.
- Oublier que la satire vise souvent un défaut de la société entière, pas seulement une personne précise.
exemple:
  enonce: Explique en une phrase ce que fait un auteur quand il grossit un défaut pour se moquer de quelqu'un.
  solution: Il exagère ce défaut jusqu'à le rendre visible et ridicule, pour que le lecteur le remarque et en rie.
exercices:
- id: definir-satire
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une satire ?
  reponse:
    options:
    - id: a
      texte: Un texte ou une image qui se moque de quelqu'un ou de quelque chose pour le critiquer
    - id: b
      texte: Un récit qui raconte la vie de son auteur
    - id: c
      texte: Un poème qui célèbre la beauté de la nature
    - id: d
      texte: Un texte qui explique un fait scientifique
    bonnes:
    - a
  indices:
    relance: 'Pense à un dessin de presse qui se moque d''un homme politique : que cherche-t-il à faire ?'
    methode: Élimine les définitions qui ne parlent ni de moquerie ni de critique.
    etape: 'La bonne réponse associe deux idées : se moquer et critiquer.'
  pieges:
  - si:
      contient:
      - b
    relance: Cette définition correspond plutôt à l'autobiographie. La satire, elle, se moque pour critiquer.
  - si:
      contient:
      - c
    relance: 'Ce n''est pas la satire : ce type de poème n''a pas d''intention critique, il célèbre plutôt qu''il ne se moque.'
  - si:
      contient:
      - d
    relance: 'La satire n''explique pas un fait scientifique : elle critique en se moquant.'
  solution: La satire est un texte ou une image qui se moque de quelqu'un ou de quelque chose pour le critiquer.
- id: procede-satirique
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le procédé qui consiste à dire une chose en laissant comprendre le contraire, pour critiquer ?
  reponse:
    acceptees:
    - ironie
    fautes_tolerees: 1
  indices:
    relance: Ce procédé fait souvent dire à quelqu'un l'inverse de ce qu'il pense vraiment, pour se moquer.
    methode: Cherche le mot qui désigne une phrase du type « Quelle bonne idée ! » dite pour se moquer d'une mauvaise idée.
    etape: Le mot commence par « iro- ».
  pieges:
  - si:
      valeur: caricature
    relance: La caricature est un portrait exagéré, pas une façon de dire le contraire de ce qu'on pense.
  - si:
      valeur: exageration
    relance: L'exagération est proche du grossissement, mais le procédé qui dit le contraire de ce qu'on pense a un autre
      nom.
  solution: 'Le mot est ironie : dire une chose en laissant comprendre le contraire, pour critiquer.'
- id: procedes-satire
  type: association
  difficulte: 2
  enonce: Associe chaque procédé satirique à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Le grossissement
    - id: b
      texte: Le rabaissement
    - id: c
      texte: Le déplacement
    droite:
    - id: x
      texte: Exagérer un défaut pour le rendre ridicule
    - id: y
      texte: Présenter une personne importante comme petite ou méprisable
    - id: z
      texte: Critiquer une chose en parlant d'une autre, par exemple des animaux à la place des hommes
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un des procédés fait grandir un défaut, un autre fait petit ce qui était grand, un autre change de sujet apparent.
    methode: Associe d'abord le procédé qui exagère, puis celui qui rabaisse, puis celui qui change de sujet apparent.
    etape: Le grossissement exagère ; le rabaissement diminue ; le déplacement change de sujet, comme les fables avec des
      animaux.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis bien la différence entre exagérer et rabaisser.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque procédé un par un, en pensant à un exemple précis pour chacun.
  solution: Le grossissement exagère un défaut, le rabaissement diminue quelqu'un d'important, le déplacement critique en
    parlant d'autre chose, comme les animaux dans une fable.
- id: exemple-fable
  type: ouverte
  difficulte: 3
  enonce: Donne un exemple de fable ou de texte satirique étudié en classe et explique quel défaut humain il critique.
  criteres:
  - L'élève cite un texte ou un auteur précis relevant de la satire (fable, conte, dessin de presse...).
  - L'élève identifie un défaut humain critiqué par ce texte (orgueil, avarice, hypocrisie, flatterie...).
  - L'élève explique brièvement comment le texte s'y prend pour critiquer (animaux, exagération, ironie...).
  indices:
    relance: Pense à une fable où des animaux se comportent comme des humains. Quel défaut montrent-ils ?
    methode: Choisis un texte précis, nomme le défaut humain visé, puis explique le procédé utilisé pour s'en moquer.
    etape: Tu peux commencer ainsi « Dans cette fable, l'auteur critique... », puis expliquer comment.
  solution: 'Par exemple, une fable qui met en scène un corbeau flatté par un renard critique la vanité et la crédulité :
    le corbeau, flatté, perd son fromage parce qu''il croit les compliments du renard.'
- id: nblm-quelle-est-la-definition-essentielle-d-u-1
  type: choix
  difficulte: 2
  enonce: Quelle est la définition essentielle d'un texte à visée satirique ?
  reponse:
    options:
    - id: o1
      texte: Un texte qui se moque d'une personne ou des travers de la société pour les critiquer en faisant rire.
    - id: o2
      texte: Une simple histoire amusante cherchant uniquement à divertir le lecteur sans aucune critique.
    - id: o3
      texte: Un récit historique documentaire relatant fidèlement des événements réels sans porter de jugement.
    - id: o4
      texte: Un poème tragique exprimant la tristesse et le désespoir de l'auteur face à la mort.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'association indissociable entre le rire comique et la portée critique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention à cette erreur fréquente : la satire ne se contente pas de faire rire, elle porte une critique explicite
      ou implicite.'
  - si:
      contient:
      - o3
    relance: Incorrect. La satire ne vise pas la neutralité documentaire, elle formule une critique à travers l'humour.
  - si:
      contient:
      - o4
    relance: Faux. L'expression de la souffrance tragique relève du registre pathétique ou tragique, pas de la visée satirique.
  solution: 'Un texte qui se moque d''une personne ou des travers de la société pour les critiquer en faisant rire. C''est
    la définition exacte : la satire associe le rire et la moquerie à une intention critique morale ou sociale.'
- id: nblm-comment-qualifie-t-on-la-technique-satir-2
  type: choix
  difficulte: 2
  enonce: Comment qualifie-t-on la technique satirique consistant en un portrait grossi exagérant certains traits pour se
    moquer d'un personnage ?
  reponse:
    options:
    - id: o1
      texte: La caricature
    - id: o2
      texte: L'éloge paradoxal
    - id: o3
      texte: La métaphore
    - id: o4
      texte: Le pléonasme
    bonnes:
    - o1
  indices:
    relance: Ce terme s'utilise aussi bien pour des portraits dessinés dans la presse que pour des descriptions littéraires.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Non. L'éloge paradoxal consiste à faire de faux compliments sur un sujet jugé négatif, ce n'est pas un portrait
      grossi.
  - si:
      contient:
      - o3
    relance: Faux. La métaphore est une figure de style associant deux domaines sans terme de comparaison.
  - si:
      contient:
      - o4
    relance: 'Incorrect. Un pléonasme est la répétition superflue de termes de même sens (ex: descendre en bas).'
  solution: La caricature. Exact. La caricature exagère et grossit certains traits d'une personne pour la rendre ridicule
    et exposer ses défauts.
- id: nblm-dans-un-texte-satirique-quel-est-le-fonc-3
  type: choix
  difficulte: 2
  enonce: Dans un texte satirique, quel est le fonctionnement du procédé de l'ironie ?
  reponse:
    options:
    - id: o1
      texte: Dire une chose en laissant comprendre le contraire, afin de faire sentir la critique de façon indirecte.
    - id: o2
      texte: Utiliser un vocabulaire scientifique très technique pour égarer volontairement le lecteur.
    - id: o3
      texte: Exprimer ses sentiments de manière directe et transparente sans aucun second degré.
    - id: o4
      texte: Traduire un texte mot à mot à partir d'une langue étrangère.
    bonnes:
    - o1
  indices:
    relance: Pour repérer l'ironie, il faut écouter le ton et repérer l'écart entre ce qui est dit et ce qui est pensé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. L'usage de jargon technique n'est pas la définition de l'ironie.
  - si:
      contient:
      - o3
    relance: Erreur classique ! L'ironie est un procédé d'implicite qui exige justement de décoder le second degré.
  - si:
      contient:
      - o4
    relance: Incorrect. Cela n'a aucun rapport avec la figure de style qu'est l'ironie.
  solution: Dire une chose en laissant comprendre le contraire, afin de faire sentir la critique de façon indirecte. C'est
    exact. L'ironie repose sur le second degré et permet d'exprimer une critique implicite en disant l'inverse de ce qu'on
    pense.
- id: nblm-quelle-est-la-portee-sociale-et-morale-r-4
  type: choix
  difficulte: 2
  enonce: Quelle est la portée sociale et morale recherchée par la visée satirique ?
  reponse:
    options:
    - id: o1
      texte: Corriger les défauts humains et les travers de la société en les rendant ridicules.
    - id: o2
      texte: Maintenir les préjugés et empêcher toute évolution des mœurs de la société.
    - id: o3
      texte: Supprimer toute forme d'humour et de comique dans les œuvres littéraires.
    - id: o4
      texte: Raconter uniquement des histoires d'amour sans aucun lien avec la réalité sociale.
    bonnes:
    - o1
  indices:
    relance: Considère la volonté d'amélioration et de prise de conscience de l'auteur satirique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. La satire remet au contraire en question les habitudes et les dérives sociales.
  - si:
      contient:
      - o3
    relance: Incorrect. Le rire est au contraire le moyen privilégié de la satire pour faire passer son message.
  - si:
      contient:
      - o4
    relance: Non. La satire s'ancre fortement dans la réalité sociale pour en dénoncer les travers.
  solution: Corriger les défauts humains et les travers de la société en les rendant ridicules. En effet, la satire vise à
    corriger les vices et imperfections des hommes et des institutions en les faisant reconnaître par le rire.
- id: nblm-que-fait-precisement-un-auteur-lorsqu-il-5
  type: choix
  difficulte: 2
  enonce: Que fait précisément un auteur lorsqu'il emploie le procédé du grossissement dans une satire ?
  reponse:
    options:
    - id: o1
      texte: Il exagère un défaut jusqu'à le rendre visible et ridicule aux yeux du lecteur.
    - id: o2
      texte: Il agrandit la taille des caractères d'imprimerie sur la page du livre.
    - id: o3
      texte: Il réduit au maximum le nombre de mots pour abréger sa description.
    - id: o4
      texte: Il fait l'éloge sincère d'un personnage important.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui se passe quand on braque une loupe sur une imperfection.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention à l''erreur de sens matériel : le grossissement satirique porte sur les défauts décrits, pas sur la
      typographie.'
  - si:
      contient:
      - o3
    relance: Incorrect. Réduire le texte est l'inverse de l'amplification propre au grossissement.
  - si:
      contient:
      - o4
    relance: Faux. L'éloge sincère s'oppose à la moquerie et à la critique satiriques.
  solution: Il exagère un défaut jusqu'à le rendre visible et ridicule aux yeux du lecteur. C'est exact. Le grossissement
    amplifie les traits ou les comportements pour en souligner l'absurdité.
- id: nblm-parmi-les-techniques-suivantes-quelles-s-6
  type: choix
  difficulte: 3
  enonce: Parmi les techniques suivantes, quelles sont les deux méthodes fréquemment utilisées dans une visée satirique ?
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le rabaissement, qui présente une personne ou une idée haute comme petite ou méprisable.
    - id: o2
      texte: Le déplacement, qui critique une situation en transposant l'action dans un autre univers (comme des animaux).
    - id: o3
      texte: Le pathétique absolu, qui cherche à susciter la pitié et les larmes du lecteur.
    - id: o4
      texte: La neutralité journalistique, qui s'abstient de tout commentaire ou ironie.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les deux procédés cités qui permettent de dévaloriser le sujet ou de détourner le regard pour mieux critiquer.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Incorrect. Le registre pathétique cherche la pitié, alors que la satire cherche la moquerie et le jugement réflexif.
  - si:
      contient:
      - o4
    relance: Faux. La satire n'est pas neutre, elle est orientée vers la critique et l'ironie.
  solution: Le rabaissement, qui présente une personne ou une idée haute comme petite ou méprisable ; Le déplacement, qui
    critique une situation en transposant l'action dans un autre univers (comme des animaux). C'est exact. Le rabaissement
    dégrade la valeur d'un sujet prétentieux pour le démasquer.
- id: nblm-quel-nom-designe-une-uvre-texte-ou-image-7
  type: texte_court
  difficulte: 1
  enonce: Quel nom désigne une œuvre (texte ou image) qui se moque des travers de la société pour les critiquer ?
  reponse:
    acceptees:
    - satire
    fautes_tolerees: 1
  indices:
    relance: C'est le substantif féminin correspondant à l'adjectif 'satirique'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: satire. Le terme 'satire' est le nom commun qui désigne cette forme littéraire ou artistique visant la critique
    par la moquerie.
- id: nblm-quel-terme-designe-un-portrait-qui-gross-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne un portrait qui grossit et exagère certains traits d'une personne pour se moquer d'elle ?
  reponse:
    acceptees:
    - caricature
    fautes_tolerees: 1
  indices:
    relance: Elle est très répandue dans le dessin de presse mais existe aussi sous forme littéraire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: caricature. La 'caricature' désigne le portrait (visuel ou rédigé) qui exagère les caractéristiques d'une personne
    pour faire rire.
