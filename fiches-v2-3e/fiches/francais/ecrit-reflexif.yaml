# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: ecrit-reflexif
version: 1
etat: verifiee
declencheurs:
- écrire pour comprendre un cours
- prendre des notes en classe
- justifier ma réponse par écrit
- brouillon pour réfléchir
prerequis: []
essentiel: 'Écrire ne sert pas seulement à rendre un devoir : cela sert aussi à penser et à apprendre. Un écrit réflexif est

  un texte où l''on explique sa démarche, sa réflexion, ou pourquoi on a répondu ainsi. Par exemple, noter en marge

  d''un exercice pourquoi on a choisi une méthode, ou écrire un petit paragraphe qui résume ce qu''on a compris d''un

  cours, aide à mieux mémoriser et à repérer ce qu''on n''a pas compris.


  La prise de notes est une technique : on n''écrit pas tout ce que dit le professeur, mais seulement l''essentiel,

  avec des abréviations, des tirets, des flèches pour montrer les liens entre les idées. Une bonne prise de notes

  reste lisible et utile plus tard, pour réviser.


  Un texte de 2000 à 3000 signes (environ une demi-page à une page) est la longueur attendue pour un développement

  construit en 3e : assez pour développer une idée avec des exemples, sans être trop long.

  '
methode:
- Avant d'écrire, se demander ce qu'on veut expliquer ou justifier (sa démarche, sa compréhension, sa réponse).
- Utiliser des phrases courtes et un vocabulaire précis pour expliquer son raisonnement, pas seulement donner un résultat.
- Pour prendre des notes, repérer les mots-clés et les liens logiques (donc, parce que, ensuite), et utiliser des abréviations
  personnelles.
- Relire son écrit réflexif pour vérifier qu'il explique bien le « pourquoi », pas seulement le « quoi ».
- Pour un texte plus long, vérifier sa longueur approximative en comptant les lignes ou les caractères.
vocabulaire:
- terme: écrit réflexif
  definition: un texte où l'on explique sa démarche ou sa compréhension, pas seulement un résultat
- terme: prise de notes
  definition: technique pour noter l'essentiel d'un cours ou d'un texte, avec des abréviations et des liens logiques
erreurs_frequentes:
- Écrire seulement le résultat d'un exercice sans expliquer la démarche ou le raisonnement.
- Prendre des notes en recopiant tout, mot pour mot, sans repérer l'essentiel.
- Ne pas relire son écrit réflexif pour vérifier qu'il répond bien à un « pourquoi ».
exemple:
  enonce: Après avoir résolu un exercice de mathématiques, écris deux phrases d'écrit réflexif qui expliquent pourquoi tu
    as choisi cette méthode.
  solution: J'ai choisi de diviser le nombre par 2, puis par 3, parce que ce sont les nombres premiers les plus petits à essayer
    en premier. Cette méthode m'a permis de trouver la décomposition rapidement sans tester des nombres inutiles.
exercices:
- id: reconnaitre-ecrit-reflexif
  type: choix
  difficulte: 1
  enonce: Parmi ces phrases écrites après un exercice, laquelle est un véritable écrit réflexif ?
  reponse:
    options:
    - id: a
      texte: J'ai trouvé 42 comme résultat
    - id: b
      texte: J'ai d'abord essayé de diviser par 2, ça n'a pas marché, alors j'ai essayé par 3, et j'ai compris que je devais
        chercher les diviseurs dans l'ordre
    - id: c
      texte: L'exercice était difficile
    - id: d
      texte: Le professeur a corrigé l'exercice au tableau
    bonnes:
    - b
  indices:
    relance: Un écrit réflexif explique un « pourquoi » ou un « comment », pas seulement un résultat ou une impression.
    methode: Cherche la phrase qui raconte une démarche, avec plusieurs étapes et une explication.
    etape: Élimine d'abord les phrases qui ne donnent qu'un résultat ou une impression sans expliquer de démarche.
  pieges:
  - si:
      contient:
      - a
    relance: Cette phrase donne seulement un résultat. Explique-t-elle comment on y est arrivé ?
  - si:
      contient:
      - c
    relance: Cette phrase exprime une impression, mais n'explique pas de démarche de réflexion.
  - si:
      contient:
      - d
    relance: Cette phrase décrit une action du professeur, pas une réflexion personnelle sur sa propre démarche.
  solution: La phrase b est un écrit réflexif car elle explique la démarche suivie et ce qu'on en a compris, pas seulement
    le résultat.
- id: mot-prise-de-notes
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la technique qui consiste à noter l'essentiel d'un cours, avec des abréviations, plutôt que de
    tout recopier ?
  reponse:
    acceptees:
    - prise de notes
    fautes_tolerees: 1
  indices:
    relance: C'est ce qu'on fait pendant un cours, quand on n'a pas le temps de tout écrire en entier.
    methode: L'expression contient deux mots, le premier évoque une action rapide, le second évoque ce qu'on écrit.
    etape: Le premier mot est « prise », le second commence par « n ».
  pieges:
  - si:
      valeur: résumé
    relance: Un résumé se fait après coup, sur un texte déjà écrit. Ici, on cherche l'expression pour noter en direct, pendant
      un cours.
  solution: 'La prise de notes : noter l''essentiel d''un cours ou d''un texte avec des abréviations, en repérant les mots-clés
    et les liens logiques.'
- id: etapes-ecrit-reflexif
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour rédiger un écrit réflexif après un exercice.
  reponse:
    elements:
    - id: a
      texte: Je me demande ce que je veux expliquer (ma démarche, ma compréhension, ma réponse)
    - id: b
      texte: J'écris les étapes de mon raisonnement avec des mots précis
    - id: c
      texte: Je vérifie que j'ai bien expliqué un « pourquoi », pas seulement un résultat
    - id: d
      texte: Je relis mon texte pour corriger ce qui n'est pas clair
  indices:
    relance: Quelle est la toute première chose à faire, avant même d'écrire une phrase ?
    methode: On réfléchit d'abord à ce qu'on veut expliquer, puis on écrit, puis on vérifie le contenu, puis on relit la forme.
    etape: On commence toujours par se demander ce qu'on veut expliquer.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la démarche (se demander quoi expliquer) et celle qui la ferme (la relecture).
  solution: On se demande d'abord ce qu'on veut expliquer, puis on écrit les étapes du raisonnement, puis on vérifie qu'on
    a bien expliqué un pourquoi, puis on relit pour corriger.
- id: fonction-notes-vs-resultat
  type: association
  difficulte: 2
  enonce: Relie chaque type d'écrit à sa fonction principale.
  reponse:
    gauche:
    - id: a
      texte: Une prise de notes pendant un cours
    - id: b
      texte: Un écrit réflexif après un exercice
    - id: c
      texte: Une réponse d'examen sans explication
    droite:
    - id: x
      texte: Noter l'essentiel rapidement pour pouvoir réviser plus tard
    - id: y
      texte: Expliquer sa démarche pour mieux comprendre et mémoriser
    - id: z
      texte: Donner seulement un résultat, sans dire comment on l'a obtenu
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque type d'écrit, demande-toi s'il explique un raisonnement, ou seulement une information brute.
    methode: La prise de notes vise la rapidité et l'utilité future ; l'écrit réflexif vise l'explication du raisonnement
      ; une réponse sans explication ne donne qu'un résultat.
    etape: Commence par la réponse sans explication, la plus facile à repérer.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la fonction de chaque type d'écrit.
  - si:
      diagnostic: associations_fausses
    relance: Repars de l'écrit le plus simple, la réponse sans explication, et avance un écrit à la fois.
  solution: La prise de notes sert à noter l'essentiel rapidement. L'écrit réflexif sert à expliquer sa démarche. Une réponse
    sans explication ne donne qu'un résultat, sans démarche.
