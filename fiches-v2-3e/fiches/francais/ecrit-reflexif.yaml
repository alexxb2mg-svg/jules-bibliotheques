- id: longueur-texte
  type: choix
  difficulte: 1
  enonce: Quelle longueur de texte attend-on d'un élève de 3e pour un développement construit ?
  reponse:
    options:
    - id: a
      texte: Environ une demi-page à une page (2 000 à 3 000 signes)
    - id: b
      texte: Une seule phrase
    - id: c
      texte: Cinq pages
    - id: d
      texte: Un mot par ligne, sur dix lignes
    bonnes:
    - a
  indices:
    relance: Un texte trop court ne développe rien, un texte trop long est inutile. Cherche la longueur intermédiaire.
    methode: Élimine la phrase unique et les cinq pages, puis compare les deux dernières.
    etape: Le texte attendu tient sur une demi-page à une page.
  pieges:
  - si:
      contient:
      - b
    relance: Une phrase ne suffit pas à développer une idée avec des exemples.
  - si:
      contient:
      - c
    relance: Cinq pages, c'est beaucoup trop long pour cet exercice.
  - si:
      contient:
      - d
    relance: Un mot par ligne ne fait pas un texte développé.
  solution: On attend un texte de 2 000 à 3 000 signes, soit environ une demi-page à une page.
- id: abreviation-notes
  type: texte_court
  difficulte: 2
  enonce: Quel nom donne-t-on à une forme raccourcie d'un mot (comme « qd » pour « quand »), utilisée pour écrire plus vite
    en prenant des notes ?
  reponse:
    acceptees:
    - abréviation
    - abreviation
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par « abr- » et évoque quelque chose de raccourci.
    methode: 'Pense au mot qu''on utilise pour « etc. » ou « qd » : c''est une forme réduite d''un mot.'
    etape: Le mot compte quatre syllabes et se termine par « -tion ».
  pieges:
  - si:
      valeur: abrègement
    relance: Le mot est proche, mais il désigne l'action de raccourcir. Cherche le nom de la forme raccourcie elle-même.
  solution: 'Le mot est abréviation : une forme raccourcie d''un mot qui fait gagner du temps.'
- id: bonne-prise-de-notes
  type: choix
  difficulte: 2
  enonce: 'Le professeur dit : « La Révolution française commence en 1789, parce que le roi manque d''argent et que le peuple
    a faim. » Quelle prise de notes est la meilleure ?'
  reponse:
    options:
    - id: a
      texte: 'Rév. fr. : début 1789 car roi sans argent + peuple qui a faim'
    - id: b
      texte: Le professeur a parlé de la Révolution française, du roi, de l'argent et du peuple
    - id: c
      texte: La Révolution française commence en 1789, parce que le roi manque d'argent et que le peuple a faim.
    - id: d
      texte: '1789'
    bonnes:
    - a
  indices:
    relance: Une bonne note est courte, mais garde la date et la cause. Compare ce que chaque note conserve.
    methode: Cherche la note qui abrège, garde les mots-clés et montre le lien logique par un signe.
    etape: Une note recopiée mot pour mot est trop longue ; une note sans cause est trop pauvre.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette note ne garde ni la date ni la cause : on ne pourrait pas réviser avec elle.'
  - si:
      contient:
      - c
    relance: Tu as tout recopié. Une prise de notes doit être plus courte et utiliser des abréviations.
  - si:
      contient:
      - d
    relance: Une date seule ne dit ni l'événement ni la cause.
  solution: 'La note a garde les mots-clés, la date et le lien de cause (flèche), avec des abréviations : c''est une bonne
    prise de notes.'
- id: ecrit-reflexif-demarche
  type: ouverte
  difficulte: 3
  enonce: 'Choisis un exercice ou un devoir récent. Rédige un écrit réflexif de 5 à 8 lignes : explique ta démarche, ce qui
    t''a posé problème et ce que tu as compris.'
  criteres:
  - L'élève explique sa démarche étape par étape (pas seulement le résultat).
  - L'élève dit ce qui a posé difficulté ou ce qu'il a compris, avec des raisons (parce que, donc...).
  - Le texte est clair, écrit en phrases correctes, avec une phrase de conclusion.
  indices:
    relance: Que t'a-t-il fallu faire d'abord ? Où as-tu hésité ?
    methode: Raconte ce que tu as fait dans l'ordre, puis explique pourquoi tu l'as fait, puis ce que tu retiens.
    etape: 'Tu peux commencer ainsi : « Pour réussir cet exercice, j''ai d''abord... parce que... ».'
  solution: Pour cet exercice de mathématiques, j'ai d'abord relu l'énoncé pour repérer les données. J'ai hésité sur la méthode,
    parce que je confondais deux formules. J'ai donc relu la leçon et j'ai compris qu'il fallait choisir la formule selon
    ce que l'on cherche. Maintenant, je vérifie toujours mon choix avant de calculer.
