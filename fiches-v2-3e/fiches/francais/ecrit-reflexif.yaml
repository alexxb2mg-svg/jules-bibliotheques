# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: ecrit-reflexif
version: 2
etat: verifiee
declencheurs:
- écrire pour comprendre un cours
- prendre des notes en classe
- justifier ma réponse par écrit
- brouillon pour réfléchir
- expliquer ma démarche par écrit
- abréviations pour noter un cours
- texte de 2000 signes
- comment noter l'essentiel
prerequis: []
essentiel: 'Écrire ne sert pas seulement à rendre un devoir. Écrire sert aussi à penser et à apprendre : en mettant ses idées
  sur le papier, on les clarifie, on les retient mieux et on repère ce qu''on n''a pas compris.


  Un écrit réflexif est un texte où l''on explique sa démarche, où l''on justifie une réponse ou où l''on argumente un propos.
  On y répond au « comment » et au « pourquoi », pas seulement au « quoi ». Exemple : « J''ai choisi de diviser d''abord par
  2, parce que le nombre est pair. »


  Un écrit réflexif peut prendre plusieurs formes : quelques phrases en marge d''un exercice, un paragraphe qui résume ce
  qu''on a compris d''un cours, un bilan de ce qu''on a appris ou de ce qui reste difficile.


  Le brouillon fait partie de la réflexion. On y note des idées en désordre, on essaie, on barre, on reformule. Il n''a pas
  besoin d''être propre : il sert à préparer la version finale.


  La prise de notes est une technique. On n''écrit pas tout ce que dit le professeur : on garde l''essentiel. On repère les
  mots-clés, on utilise des abréviations personnelles (« qd » pour « quand »), des tirets, des flèches pour les liens logiques
  (→ « donc », ≠ « différent de »). On aère la page, on souligne les titres. Des notes lisibles servent à réviser.


  Les attendus de 3e demandent aussi de rédiger un texte de 2 000 à 3 000 signes, soit environ une demi-page à une page, selon
  le type d''écrit demandé (développement construit, réponse argumentée, récit). Les signes comptent les lettres, les espaces
  et la ponctuation.


  Au brevet, on attend que tu justifies tes réponses, que tu expliques clairement ta démarche et que tu rédiges un texte construit
  de la bonne longueur.

  '
methode:
- 'Avant d''écrire, se demander ce qu''on veut expliquer ou justifier : sa démarche, sa compréhension ou sa réponse.'
- 'Noter ses idées au brouillon, sans chercher la perfection : mots-clés, essais, schéma.'
- Rédiger avec des phrases courtes et un vocabulaire précis, en utilisant des mots de liaison (parce que, donc, ensuite, mais).
- Pour prendre des notes, repérer les mots-clés et les liens logiques, utiliser des abréviations personnelles, des tirets
  et des flèches.
- Relire son écrit pour vérifier qu'il explique le « pourquoi » et pas seulement le « quoi ».
- Pour un texte plus long, vérifier la longueur approximative en comptant les lignes ou les signes (2 000 à 3 000 signes en
  3e).
vocabulaire:
- terme: écrit réflexif
  definition: un texte où l'on explique sa démarche ou sa compréhension, pas seulement un résultat
- terme: prise de notes
  definition: technique pour noter l'essentiel d'un cours ou d'un texte, avec des abréviations et des liens logiques
- terme: brouillon
  definition: texte de travail où l'on note ses idées avant de rédiger la version finale
- terme: abréviation
  definition: forme raccourcie d'un mot, pour écrire plus vite
- terme: mot-clé
  definition: mot qui porte l'idée principale d'une phrase ou d'un paragraphe
- terme: signe
  definition: 'unité de mesure de la longueur d''un texte : une lettre, un espace ou un signe de ponctuation'
- terme: justifier
  definition: donner les raisons qui montrent qu'une réponse est correcte
erreurs_frequentes:
- Écrire seulement le résultat d'un exercice sans expliquer la démarche ou le raisonnement.
- Prendre des notes en recopiant tout, mot pour mot, sans repérer l'essentiel.
- Ne pas relire son écrit réflexif pour vérifier qu'il répond bien à un « pourquoi ».
- 'Croire que le brouillon doit être parfait, ou s''en passer : il sert à réfléchir avant de rédiger.'
- Rédiger un texte beaucoup trop court, sans exemple, quand on demande un développement de 2 000 à 3 000 signes.
exemple:
  enonce: Après avoir résolu un exercice de mathématiques, écris deux phrases d'écrit réflexif qui expliquent pourquoi tu
    as choisi cette méthode.
  solution: J'ai choisi de diviser le nombre par 2, puis par 3, parce que ce sont les nombres premiers les plus petits à essayer
    en premier. Cette méthode m'a permis de trouver la décomposition rapidement sans tester des nombres inutiles.
exercices:
- id: reconnaitre-ecrit-reflexif
  type: choix
  difficulte: 1
  enonce: Parmi ces phrases écrites après un exercice, laquelle est un véritable écrit réflexif ?
  reponse:
    options:
    - id: a
      texte: J'ai trouvé 42 comme résultat
    - id: b
      texte: J'ai d'abord essayé de diviser par 2, ça n'a pas marché, alors j'ai essayé par 3, et j'ai compris que je devais
        chercher les diviseurs dans l'ordre
    - id: c
      texte: L'exercice était difficile
    - id: d
      texte: Le professeur a corrigé l'exercice au tableau
    bonnes:
    - b
  indices:
    relance: Un écrit réflexif explique un « pourquoi » ou un « comment », pas seulement un résultat ou une impression.
    methode: Cherche la phrase qui raconte une démarche, avec plusieurs étapes et une explication.
    etape: Élimine d'abord les phrases qui ne donnent qu'un résultat ou une impression sans expliquer de démarche.
  pieges:
  - si:
      contient:
      - a
    relance: Cette phrase donne seulement un résultat. Explique-t-elle comment on y est arrivé ?
  - si:
      contient:
      - c
    relance: Cette phrase exprime une impression, mais n'explique pas de démarche de réflexion.
  - si:
      contient:
      - d
    relance: Cette phrase décrit une action du professeur, pas une réflexion personnelle sur sa propre démarche.
  solution: La phrase b est un écrit réflexif car elle explique la démarche suivie et ce qu'on en a compris, pas seulement
    le résultat.
- id: mot-prise-de-notes
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la technique qui consiste à noter l'essentiel d'un cours, avec des abréviations, plutôt que de
    tout recopier ?
  reponse:
    acceptees:
    - prise de notes
    fautes_tolerees: 1
  indices:
    relance: C'est ce qu'on fait pendant un cours, quand on n'a pas le temps de tout écrire en entier.
    methode: L'expression contient deux mots, le premier évoque une action rapide, le second évoque ce qu'on écrit.
    etape: Le premier mot est « prise », le second commence par « n ».
  pieges:
  - si:
      valeur: résumé
    relance: Un résumé se fait après coup, sur un texte déjà écrit. Ici, on cherche l'expression pour noter en direct, pendant
      un cours.
  solution: 'La prise de notes : noter l''essentiel d''un cours ou d''un texte avec des abréviations, en repérant les mots-clés
    et les liens logiques.'
- id: etapes-ecrit-reflexif
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour rédiger un écrit réflexif après un exercice.
  reponse:
    elements:
    - id: a
      texte: Je me demande ce que je veux expliquer (ma démarche, ma compréhension, ma réponse)
    - id: b
      texte: J'écris les étapes de mon raisonnement avec des mots précis
    - id: c
      texte: Je vérifie que j'ai bien expliqué un « pourquoi », pas seulement un résultat
    - id: d
      texte: Je relis mon texte pour corriger ce qui n'est pas clair
  indices:
    relance: Quelle est la toute première chose à faire, avant même d'écrire une phrase ?
    methode: On réfléchit d'abord à ce qu'on veut expliquer, puis on écrit, puis on vérifie le contenu, puis on relit la forme.
    etape: On commence toujours par se demander ce qu'on veut expliquer.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la démarche (se demander quoi expliquer) et celle qui la ferme (la relecture).
  solution: On se demande d'abord ce qu'on veut expliquer, puis on écrit les étapes du raisonnement, puis on vérifie qu'on
    a bien expliqué un pourquoi, puis on relit pour corriger.
- id: fonction-notes-vs-resultat
  type: association
  difficulte: 2
  enonce: Relie chaque type d'écrit à sa fonction principale.
  reponse:
    gauche:
    - id: a
      texte: Une prise de notes pendant un cours
    - id: b
      texte: Un écrit réflexif après un exercice
    - id: c
      texte: Une réponse d'examen sans explication
    droite:
    - id: x
      texte: Noter l'essentiel rapidement pour pouvoir réviser plus tard
    - id: y
      texte: Expliquer sa démarche pour mieux comprendre et mémoriser
    - id: z
      texte: Donner seulement un résultat, sans dire comment on l'a obtenu
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque type d'écrit, demande-toi s'il explique un raisonnement, ou seulement une information brute.
    methode: La prise de notes vise la rapidité et l'utilité future ; l'écrit réflexif vise l'explication du raisonnement
      ; une réponse sans explication ne donne qu'un résultat.
    etape: Commence par la réponse sans explication, la plus facile à repérer.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la fonction de chaque type d'écrit.
  - si:
      diagnostic: associations_fausses
    relance: Repars de l'écrit le plus simple, la réponse sans explication, et avance un écrit à la fois.
  solution: La prise de notes sert à noter l'essentiel rapidement. L'écrit réflexif sert à expliquer sa démarche. Une réponse
    sans explication ne donne qu'un résultat, sans démarche.
- id: longueur-texte
  type: choix
  difficulte: 1
  enonce: Quelle longueur de texte attend-on d'un élève de 3e pour un développement construit ?
  reponse:
    options:
    - id: a
      texte: Environ une demi-page à une page (2 000 à 3 000 signes)
    - id: b
      texte: Une seule phrase
    - id: c
      texte: Cinq pages
    - id: d
      texte: Un mot par ligne, sur dix lignes
    bonnes:
    - a
  indices:
    relance: Un texte trop court ne développe rien, un texte trop long est inutile. Cherche la longueur intermédiaire.
    methode: Élimine la phrase unique et les cinq pages, puis compare les deux dernières.
    etape: Le texte attendu tient sur une demi-page à une page.
  pieges:
  - si:
      contient:
      - b
    relance: Une phrase ne suffit pas à développer une idée avec des exemples.
  - si:
      contient:
      - c
    relance: Cinq pages, c'est beaucoup trop long pour cet exercice.
  - si:
      contient:
      - d
    relance: Un mot par ligne ne fait pas un texte développé.
  solution: On attend un texte de 2 000 à 3 000 signes, soit environ une demi-page à une page.
- id: abreviation-notes
  type: texte_court
  difficulte: 2
  enonce: Quel nom donne-t-on à une forme raccourcie d'un mot (comme « qd » pour « quand »), utilisée pour écrire plus vite
    en prenant des notes ?
  reponse:
    acceptees:
    - abréviation
    - abreviation
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par « abr- » et évoque quelque chose de raccourci.
    methode: 'Pense au mot qu''on utilise pour « etc. » ou « qd » : c''est une forme réduite d''un mot.'
    etape: Le mot compte quatre syllabes et se termine par « -tion ».
  pieges:
  - si:
      valeur: abrègement
    relance: Le mot est proche, mais il désigne l'action de raccourcir. Cherche le nom de la forme raccourcie elle-même.
  solution: 'Le mot est abréviation : une forme raccourcie d''un mot qui fait gagner du temps.'
- id: bonne-prise-de-notes
  type: choix
  difficulte: 2
  enonce: 'Le professeur dit : « La Révolution française commence en 1789, parce que le roi manque d''argent et que le peuple
    a faim. » Quelle prise de notes est la meilleure ?'
  reponse:
    options:
    - id: a
      texte: 'Rév. fr. : début 1789 car roi sans argent + peuple qui a faim'
    - id: b
      texte: Le professeur a parlé de la Révolution française, du roi, de l'argent et du peuple
    - id: c
      texte: La Révolution française commence en 1789, parce que le roi manque d'argent et que le peuple a faim.
    - id: d
      texte: '1789'
    bonnes:
    - a
  indices:
    relance: Une bonne note est courte, mais garde la date et la cause. Compare ce que chaque note conserve.
    methode: Cherche la note qui abrège, garde les mots-clés et montre le lien logique par un signe.
    etape: Une note recopiée mot pour mot est trop longue ; une note sans cause est trop pauvre.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette note ne garde ni la date ni la cause : on ne pourrait pas réviser avec elle.'
  - si:
      contient:
      - c
    relance: Tu as tout recopié. Une prise de notes doit être plus courte et utiliser des abréviations.
  - si:
      contient:
      - d
    relance: Une date seule ne dit ni l'événement ni la cause.
  solution: 'La note a garde les mots-clés, la date et le lien de cause (flèche), avec des abréviations : c''est une bonne
    prise de notes.'
- id: ecrit-reflexif-demarche
  type: ouverte
  difficulte: 3
  enonce: 'Choisis un exercice ou un devoir récent. Rédige un écrit réflexif de 5 à 8 lignes : explique ta démarche, ce qui
    t''a posé problème et ce que tu as compris.'
  criteres:
  - L'élève explique sa démarche étape par étape (pas seulement le résultat).
  - L'élève dit ce qui a posé difficulté ou ce qu'il a compris, avec des raisons (parce que, donc...).
  - Le texte est clair, écrit en phrases correctes, avec une phrase de conclusion.
  indices:
    relance: Que t'a-t-il fallu faire d'abord ? Où as-tu hésité ?
    methode: Raconte ce que tu as fait dans l'ordre, puis explique pourquoi tu l'as fait, puis ce que tu retiens.
    etape: 'Tu peux commencer ainsi : « Pour réussir cet exercice, j''ai d''abord... parce que... ».'
  solution: Pour cet exercice de mathématiques, j'ai d'abord relu l'énoncé pour repérer les données. J'ai hésité sur la méthode,
    parce que je confondais deux formules. J'ai donc relu la leçon et j'ai compris qu'il fallait choisir la formule selon
    ce que l'on cherche. Maintenant, je vérifie toujours mon choix avant de calculer.
