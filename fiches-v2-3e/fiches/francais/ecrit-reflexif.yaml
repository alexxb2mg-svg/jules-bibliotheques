# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: ecrit-reflexif
version: 2
etat: verifiee
declencheurs:
- écrire pour comprendre un cours
- prendre des notes en classe
- justifier ma réponse par écrit
- brouillon pour réfléchir
- expliquer ma démarche par écrit
- abréviations pour noter un cours
- texte de 2000 signes
- comment noter l'essentiel
prerequis: []
essentiel: 'Écrire ne sert pas seulement à rendre un devoir. Écrire sert aussi à penser et à apprendre : en mettant ses idées
  sur le papier, on les clarifie, on les retient mieux et on repère ce qu''on n''a pas compris.


  Un écrit réflexif est un texte où l''on explique sa démarche, où l''on justifie une réponse ou où l''on argumente un propos.
  On y répond au « comment » et au « pourquoi », pas seulement au « quoi ». Exemple : « J''ai choisi de diviser d''abord par
  2, parce que le nombre est pair. »


  Un écrit réflexif peut prendre plusieurs formes : quelques phrases en marge d''un exercice, un paragraphe qui résume ce
  qu''on a compris d''un cours, un bilan de ce qu''on a appris ou de ce qui reste difficile.


  Le brouillon fait partie de la réflexion. On y note des idées en désordre, on essaie, on barre, on reformule. Il n''a pas
  besoin d''être propre : il sert à préparer la version finale.


  La prise de notes est une technique. On n''écrit pas tout ce que dit le professeur : on garde l''essentiel. On repère les
  mots-clés, on utilise des abréviations personnelles (« qd » pour « quand »), des tirets, des flèches pour les liens logiques
  (→ « donc », ≠ « différent de »). On aère la page, on souligne les titres. Des notes lisibles servent à réviser.


  Les attendus de 3e demandent aussi de rédiger un texte de 2 000 à 3 000 signes, soit environ une demi-page à une page, selon
  le type d''écrit demandé (développement construit, réponse argumentée, récit). Les signes comptent les lettres, les espaces
  et la ponctuation.


  Au brevet, on attend que tu justifies tes réponses, que tu expliques clairement ta démarche et que tu rédiges un texte construit
  de la bonne longueur.

  '
methode:
- 'Avant d''écrire, se demander ce qu''on veut expliquer ou justifier : sa démarche, sa compréhension ou sa réponse.'
- 'Noter ses idées au brouillon, sans chercher la perfection : mots-clés, essais, schéma.'
- Rédiger avec des phrases courtes et un vocabulaire précis, en utilisant des mots de liaison (parce que, donc, ensuite, mais).
- Pour prendre des notes, repérer les mots-clés et les liens logiques, utiliser des abréviations personnelles, des tirets
  et des flèches.
- Relire son écrit pour vérifier qu'il explique le « pourquoi » et pas seulement le « quoi ».
- Pour un texte plus long, vérifier la longueur approximative en comptant les lignes ou les signes (2 000 à 3 000 signes en
  3e).
vocabulaire:
- terme: écrit réflexif
  definition: un texte où l'on explique sa démarche ou sa compréhension, pas seulement un résultat
- terme: prise de notes
  definition: technique pour noter l'essentiel d'un cours ou d'un texte, avec des abréviations et des liens logiques
- terme: brouillon
  definition: texte de travail où l'on note ses idées avant de rédiger la version finale
- terme: abréviation
  definition: forme raccourcie d'un mot, pour écrire plus vite
- terme: mot-clé
  definition: mot qui porte l'idée principale d'une phrase ou d'un paragraphe
- terme: signe
  definition: 'unité de mesure de la longueur d''un texte : une lettre, un espace ou un signe de ponctuation'
- terme: justifier
  definition: donner les raisons qui montrent qu'une réponse est correcte
erreurs_frequentes:
- Écrire seulement le résultat d'un exercice sans expliquer la démarche ou le raisonnement.
- Prendre des notes en recopiant tout, mot pour mot, sans repérer l'essentiel.
- Ne pas relire son écrit réflexif pour vérifier qu'il répond bien à un « pourquoi ».
- 'Croire que le brouillon doit être parfait, ou s''en passer : il sert à réfléchir avant de rédiger.'
- Rédiger un texte beaucoup trop court, sans exemple, quand on demande un développement de 2 000 à 3 000 signes.
exemple:
  enonce: Après avoir résolu un exercice de mathématiques, écris deux phrases d'écrit réflexif qui expliquent pourquoi tu
    as choisi cette méthode.
  solution: J'ai choisi de diviser le nombre par 2, puis par 3, parce que ce sont les nombres premiers les plus petits à essayer
    en premier. Cette méthode m'a permis de trouver la décomposition rapidement sans tester des nombres inutiles.
exercices:
- id: reconnaitre-ecrit-reflexif
  type: choix
  difficulte: 1
  enonce: Parmi ces phrases écrites après un exercice, laquelle est un véritable écrit réflexif ?
  reponse:
    options:
    - id: a
      texte: J'ai trouvé 42 comme résultat
    - id: b
      texte: J'ai d'abord essayé de diviser par 2, ça n'a pas marché, alors j'ai essayé par 3, et j'ai compris que je devais
        chercher les diviseurs dans l'ordre
    - id: c
      texte: L'exercice était difficile
    - id: d
      texte: Le professeur a corrigé l'exercice au tableau
    bonnes:
    - b
  indices:
    relance: Un écrit réflexif explique un « pourquoi » ou un « comment », pas seulement un résultat ou une impression.
    methode: Cherche la phrase qui raconte une démarche, avec plusieurs étapes et une explication.
    etape: Élimine d'abord les phrases qui ne donnent qu'un résultat ou une impression sans expliquer de démarche.
  pieges:
  - si:
      contient:
      - a
    relance: Cette phrase donne seulement un résultat. Explique-t-elle comment on y est arrivé ?
  - si:
      contient:
      - c
    relance: Cette phrase exprime une impression, mais n'explique pas de démarche de réflexion.
  - si:
      contient:
      - d
    relance: Cette phrase décrit une action du professeur, pas une réflexion personnelle sur sa propre démarche.
  solution: La phrase b est un écrit réflexif car elle explique la démarche suivie et ce qu'on en a compris, pas seulement
    le résultat.
- id: mot-prise-de-notes
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la technique qui consiste à noter l'essentiel d'un cours, avec des abréviations, plutôt que de
    tout recopier ?
  reponse:
    acceptees:
    - prise de notes
    fautes_tolerees: 1
  indices:
    relance: C'est ce qu'on fait pendant un cours, quand on n'a pas le temps de tout écrire en entier.
    methode: L'expression contient deux mots, le premier évoque une action rapide, le second évoque ce qu'on écrit.
    etape: Le premier mot est « prise », le second commence par « n ».
  pieges:
  - si:
      valeur: résumé
    relance: Un résumé se fait après coup, sur un texte déjà écrit. Ici, on cherche l'expression pour noter en direct, pendant
      un cours.
  solution: 'La prise de notes : noter l''essentiel d''un cours ou d''un texte avec des abréviations, en repérant les mots-clés
    et les liens logiques.'
- id: etapes-ecrit-reflexif
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour rédiger un écrit réflexif après un exercice.
  reponse:
    elements:
    - id: a
      texte: Je me demande ce que je veux expliquer (ma démarche, ma compréhension, ma réponse)
    - id: b
      texte: J'écris les étapes de mon raisonnement avec des mots précis
    - id: c
      texte: Je vérifie que j'ai bien expliqué un « pourquoi », pas seulement un résultat
    - id: d
      texte: Je relis mon texte pour corriger ce qui n'est pas clair
  indices:
    relance: Quelle est la toute première chose à faire, avant même d'écrire une phrase ?
    methode: On réfléchit d'abord à ce qu'on veut expliquer, puis on écrit, puis on vérifie le contenu, puis on relit la forme.
    etape: On commence toujours par se demander ce qu'on veut expliquer.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la démarche (se demander quoi expliquer) et celle qui la ferme (la relecture).
  solution: On se demande d'abord ce qu'on veut expliquer, puis on écrit les étapes du raisonnement, puis on vérifie qu'on
    a bien expliqué un pourquoi, puis on relit pour corriger.
- id: fonction-notes-vs-resultat
  type: association
  difficulte: 2
  enonce: Relie chaque type d'écrit à sa fonction principale.
  reponse:
    gauche:
    - id: a
      texte: Une prise de notes pendant un cours
    - id: b
      texte: Un écrit réflexif après un exercice
    - id: c
      texte: Une réponse d'examen sans explication
    droite:
    - id: x
      texte: Noter l'essentiel rapidement pour pouvoir réviser plus tard
    - id: y
      texte: Expliquer sa démarche pour mieux comprendre et mémoriser
    - id: z
      texte: Donner seulement un résultat, sans dire comment on l'a obtenu
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque type d'écrit, demande-toi s'il explique un raisonnement, ou seulement une information brute.
    methode: La prise de notes vise la rapidité et l'utilité future ; l'écrit réflexif vise l'explication du raisonnement
      ; une réponse sans explication ne donne qu'un résultat.
    etape: Commence par la réponse sans explication, la plus facile à repérer.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la fonction de chaque type d'écrit.
  - si:
      diagnostic: associations_fausses
    relance: Repars de l'écrit le plus simple, la réponse sans explication, et avance un écrit à la fois.
  solution: La prise de notes sert à noter l'essentiel rapidement. L'écrit réflexif sert à expliquer sa démarche. Une réponse
    sans explication ne donne qu'un résultat, sans démarche.
- id: nblm-quelle-est-la-fonction-principale-d-un-e-1
  type: choix
  difficulte: 2
  enonce: Quelle est la fonction principale d'un écrit réflexif lorsqu'on l'utilise pour réviser ou suivre une leçon ?
  reponse:
    options:
    - id: o1
      texte: Utiliser l'écriture pour penser, analyser sa compréhension et mieux mémoriser le cours.
    - id: o2
      texte: Recopier mot pour mot le cours du professeur sans rien modifier.
    - id: o3
      texte: Rédiger une fiction poétique sans rapport avec le contenu de la leçon.
    - id: o4
      texte: Chercher uniquement à obtenir la note maximale en soignant la présentation esthétique.
    bonnes:
    - o1
  indices:
    relance: Pense à ce que t'apporte le fait de récapituler ce que tu as compris dans ton propre texte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Recopier l'intégralité du cours empêche la réflexion personnelle et ne constitue pas un écrit réflexif.
  - si:
      contient:
      - o3
    relance: Un écrit réflexif porte sur sa propre démarche d'apprentissage et non sur une invention littéraire hors sujet.
  - si:
      contient:
      - o4
    relance: L'objectif premier est de clarifier sa réflexion et son raisonnement, pas seulement de rendre un devoir propre.
  solution: 'Utiliser l''écriture pour penser, analyser sa compréhension et mieux mémoriser le cours. C''est exact : l''écrit
    réflexif sert à penser, apprendre, mieux mémoriser et repérer ce que l''on n''a pas compris.'
- id: nblm-lorsque-tu-dois-justifier-ta-reponse-par-2
  type: choix
  difficulte: 2
  enonce: Lorsque tu dois justifier ta réponse par écrit dans un exercice, que doit contenir ton écrit réflexif ?
  reponse:
    options:
    - id: o1
      texte: Une explication précise de ton raisonnement pour répondre au « pourquoi ».
    - id: o2
      texte: Uniquement le résultat final ou la réponse brute sans explication.
    - id: o3
      texte: Une liste d'exemples isolés sans aucun lien logique ni phrase explicative.
    - id: o4
      texte: Une répétition mot à mot de l'énoncé de la question.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la différence entre donner un résultat brut et expliquer la démarche qui y mène.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Donner seulement le résultat sans la démarche est une erreur fréquente qui néglige la dimension réflexive.
  - si:
      contient:
      - o3
    relance: Des exemples isolés sans explication ne permettent pas de justifier clairement la démarche de pensée.
  - si:
      contient:
      - o4
    relance: Répéter l'énoncé ne constitue pas une justification de ton propre raisonnement.
  solution: 'Une explication précise de ton raisonnement pour répondre au « pourquoi ». C''est juste : l''écrit réflexif doit
    expliquer le raisonnement et le « pourquoi », pas seulement donner un résultat.'
- id: nblm-a-quoi-sert-principalement-de-preparer-s-3
  type: choix
  difficulte: 2
  enonce: À quoi sert principalement de préparer son travail sous forme de brouillon avant de rédiger un texte ?
  reponse:
    options:
    - id: o1
      texte: À planifier la construction de son texte et à organiser ses idées essentielles.
    - id: o2
      texte: À rédiger directement la version définitive sans jamais la modifier.
    - id: o3
      texte: À vérifier uniquement l'orthographe des mots sans penser à la structure des idées.
    - id: o4
      texte: À éviter toute relecture une fois le texte recopié au propre.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi le rôle de la planification des idées avant l'écriture définitive.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le brouillon est un espace d'essai et de réorganisation, pas le texte final au propre.
  - si:
      contient:
      - o3
    relance: La planification sur brouillon concerne d'abord la structuration de la pensée et du plan.
  - si:
      contient:
      - o4
    relance: L'usage du brouillon n'exclut pas la relecture et la révision finale du texte rédigé.
  solution: 'À planifier la construction de son texte et à organiser ses idées essentielles. C''est exact : le brouillon permet
    de planifier la structure et les idées essentielles avant la rédaction finale.'
- id: nblm-en-classe-quelle-est-la-methode-recomman-4
  type: choix
  difficulte: 2
  enonce: En classe, quelle est la méthode recommandée pour réussir sa prise de notes réflexive ?
  reponse:
    options:
    - id: o1
      texte: Noter l'essentiel avec des abréviations, des tirets et des flèches pour relier les idées.
    - id: o2
      texte: Écrire absolument tout ce que prononce le professeur, mot pour mot.
    - id: o3
      texte: Écrire uniquement les titres des chapitres en négligeant le contenu explicatif.
    - id: o4
      texte: Utiliser un langage codé secret que l'on ne pourra plus relire chez soi.
    bonnes:
    - o1
  indices:
    relance: Pense aux outils visuels et aux raccourcis qui aident à sélectionner et relier l'information importante.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Recopier tout mot pour mot est une erreur classique qui empêche de sélectionner les informations importantes.
  - si:
      contient:
      - o3
    relance: Ne noter que les titres ne laisse aucune trace utile pour comprendre et réviser plus tard.
  - si:
      contient:
      - o4
    relance: Une prise de notes doit rester claire, lisible et exploitable pour les révisions futures.
  solution: 'Noter l''essentiel avec des abréviations, des tirets et des flèches pour relier les idées. C''est la bonne méthode
    : elle privilégie l''essentiel, la lisibilité et les liens logiques entre les concepts.'
- id: nblm-dans-le-programme-de-3e-quel-support-d-e-5
  type: choix
  difficulte: 2
  enonce: Dans le programme de 3e, quel support d'écrit personnel favorise la réflexion de l'élève sur ses lectures ?
  reponse:
    options:
    - id: o1
      texte: Le cahier de lecture cursive ou carnet de bord.
    - id: o2
      texte: Le dictionnaire étymologique de la classe.
    - id: o3
      texte: La fiche d'évaluation rédigée par l'enseignant.
    - id: o4
      texte: Le manuel scolaire d'histoire-géographie.
    bonnes:
    - o1
  indices:
    relance: Cherche le nom du carnet personnel où l'élève garde trace de ses impressions de lecture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le dictionnaire est un outil de référence lexicale, pas un support d'écriture réflexive personnelle.
  - si:
      contient:
      - o3
    relance: La fiche d'évaluation est un document d'appréciation du professeur, pas un écrit réflexif de l'élève.
  - si:
      contient:
      - o4
    relance: Il s'agit d'un manuel d'une autre discipline et non d'un carnet personnel de lecteur.
  solution: 'Le cahier de lecture cursive ou carnet de bord. C''est correct : ce support personnel permet de s''approprier
    les contenus et de développer sa réflexion.'
- id: nblm-quelles-sont-deux-erreurs-frequentes-a-e-6
  type: choix
  difficulte: 3
  enonce: Quelles sont deux erreurs fréquentes à éviter lors d'un écrit réflexif ou d'une prise de notes ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Écrire seulement le résultat d'un exercice sans expliquer la démarche ou le raisonnement.
    - id: o2
      texte: Prendre des notes en recopiant tout, mot pour mot, sans repérer l'essentiel.
    - id: o3
      texte: Utiliser des phrases courtes pour expliquer clairement son raisonnement.
    - id: o4
      texte: Relire son travail pour vérifier qu'il répond bien à la question posée.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux mauvaises habitudes qui empêchent de réfléchir par soi-même ou de sélectionner l'information.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Ce n'est pas une erreur, mais une excellente méthode recommandée pour l'écrit réflexif.
  - si:
      contient:
      - o4
    relance: Relire son texte est une stratégie indispensable et très conseillée, pas une erreur.
  solution: 'Écrire seulement le résultat d''un exercice sans expliquer la démarche ou le raisonnement ; Prendre des notes
    en recopiant tout, mot pour mot, sans repérer l''essentiel. C''est bien une erreur fréquente : l''écrit réflexif exige
    d''expliquer le « pourquoi » et la démarche.'
- id: nblm-pour-organiser-ses-idees-et-planifier-sa-7
  type: texte_court
  difficulte: 1
  enonce: Pour organiser ses idées et planifier sa pensée avant de rédiger, l'élève prépare un ________.
  reponse:
    acceptees:
    - brouillon
    fautes_tolerees: 1
  indices:
    relance: C'est la feuille d'essai sur laquelle on note ses idées essentielles avant la rédaction finale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: brouillon. Le brouillon est l'écrit pré-rédactionnel qui permet d'essayer, de planifier et d'organiser sa réflexion.
- id: nblm-pour-montrer-qu-il-a-compris-un-exercice-8
  type: texte_court
  difficulte: 1
  enonce: Pour montrer qu'il a compris un exercice, l'élève recourt régulièrement à l'écrit réflexif pour ________ sa réponse.
  reponse:
    acceptees:
    - justifier
    fautes_tolerees: 1
  indices:
    relance: Pense au verbe qui signifie expliquer le pourquoi de sa réponse.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
