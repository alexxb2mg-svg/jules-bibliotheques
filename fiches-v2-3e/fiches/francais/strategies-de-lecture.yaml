# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: strategies-de-lecture
version: 2
etat: verifiee
declencheurs:
- je comprends pas ce texte
- relire un passage
- choisir un bon livre
- expliquer ma lecture
- deviner le sens d'un mot
- prouver avec une citation
- lecture difficile comment faire
- livre adapté à mon niveau
prerequis: []
essentiel: 'Un bon lecteur ne comprend pas toujours un texte du premier coup : il utilise des stratégies.


  Avant la lecture, il observe le titre, la couverture, les images, le nom de l''auteur, la table des matières. Il anticipe
  de quoi le texte va parler.


  Pendant la lecture, il se pose des questions (qui ? où ? quand ? pourquoi ?), relit une phrase difficile, relie ce qu''il
  lit à ce qu''il sait déjà. Face à un mot inconnu, il cherche des indices de contexte : les mots et les phrases autour, la
  construction, la famille du mot. Si cela ne suffit pas, il utilise un dictionnaire ou demande de l''aide.


  Il fait aussi des inférences : il comprend ce que le texte ne dit pas directement, en assemblant des indices. Exemple :
  « Théo attendit que la cour soit vide avant de sortir » laisse penser qu''il veut éviter les autres.


  Après la lecture, il reformule, résume, vérifie que sa compréhension est cohérente avec le reste du texte.


  Justifier une interprétation, c''est expliquer pourquoi on comprend un texte d''une certaine façon, en citant des passages
  précis. On met la citation entre guillemets, puis on explique : « Le mot “ … ” montre que… ». Une interprétation sans preuve
  dans le texte n''est qu''une impression. Il peut y avoir plusieurs interprétations possibles, mais toutes doivent s''appuyer
  sur le texte.


  Devenir un lecteur autonome, c''est aussi choisir un livre adapté : on lit la quatrième de couverture, quelques lignes des
  premières pages, on regarde la longueur et le niveau de langue, on pense à ses goûts et à son besoin (se distraire, apprendre,
  préparer un exposé).


  Au brevet, on attend que tu répondes aux questions de compréhension par une phrase complète appuyée sur une citation.

  '
methode:
- Avant de lire, observer le titre, la couverture, les images et la table des matières pour anticiper le contenu.
- Pendant la lecture, repérer les passages ou les mots qui posent problème.
- Relire la phrase ou le paragraphe en cherchant des indices de sens dans les mots autour.
- Si le blocage persiste, chercher le mot dans un dictionnaire ou demander de l'aide.
- Assembler des indices pour faire des inférences sur ce que le texte ne dit pas directement.
- Pour justifier une interprétation, citer un passage précis entre guillemets et expliquer en quoi il appuie cette lecture.
- Pour choisir un livre, lire la quatrième de couverture et quelques lignes, puis vérifier niveau, longueur et goûts.
vocabulaire:
- terme: indice de contexte
  definition: un mot ou un groupe de mots proche d'un terme inconnu qui aide à deviner son sens
- terme: interprétation
  definition: une explication du sens d'un texte, qui doit s'appuyer sur des passages précis
- terme: inférence
  definition: compréhension d'une information que le texte ne dit pas directement, déduite d'indices
- terme: citation
  definition: passage exact du texte, recopié entre guillemets pour servir de preuve
- terme: anticiper
  definition: imaginer ce que va dire un texte avant de le lire, à partir de son titre ou de sa couverture
- terme: quatrième de couverture
  definition: dos d'un livre, qui présente en quelques lignes l'histoire ou le sujet
- terme: reformuler
  definition: redire avec ses propres mots ce qu'on a compris
erreurs_frequentes:
- Abandonner un texte dès qu'un mot ou un passage n'est pas compris tout de suite.
- Donner une interprétation sans citer aucun passage du texte pour l'appuyer.
- Choisir un livre uniquement d'après sa couverture, sans regarder son niveau de langue ou sa longueur.
- 'Citer un passage sans l''expliquer : une citation seule ne prouve rien tant qu''on ne dit pas pourquoi elle appuie l''idée.'
- 'Croire que tout est dit dans le texte : souvent, il faut déduire ce qui n''est pas écrit à partir d''indices.'
exemple:
  enonce: 'Léa referma le carnet et regarda par la fenêtre. Le clocher du village sonnait midi, mais elle n''avait pas faim
    : ce qu''elle venait de lire l''avait bouleversée. Explique en une phrase pourquoi Léa n''a pas faim, en t''appuyant sur
    le texte.'
  solution: Léa n'a pas faim parce que la lecture du carnet l'a bouleversée, c'est-à-dire qu'elle a provoqué chez elle une
    émotion forte qui lui coupe l'appétit ; le texte le dit directement avec le mot « bouleversée ».
exercices:
- id: mot-difficile-contexte
  type: choix
  difficulte: 1
  enonce: 'Léa referma le carnet et regarda par la fenêtre. Le clocher du village sonnait midi, mais elle n''avait pas faim
    : ce qu''elle venait de lire l''avait bouleversée. Tu ne connais pas le mot « bouleversée ». Que peux-tu faire, sans dictionnaire,
    pour deviner son sens ?'
  reponse:
    options:
    - id: a
      texte: Relire la phrase et regarder ce qui se passe juste avant (elle n'a pas faim) pour deviner le sens
    - id: b
      texte: Sauter le mot et continuer sans y penser
    - id: c
      texte: Décider que ce mot n'a pas d'importance dans le texte
    - id: d
      texte: Arrêter complètement la lecture
    bonnes:
    - a
  indices:
    relance: Que ressent Léa juste avant ce mot, d'après le texte ?
    methode: Regarde les mots et les faits qui entourent le mot inconnu ; ils donnent souvent un indice de son sens.
    etape: Léa n'a pas faim alors qu'il est midi. Quel effet cela indique-t-il chez elle ?
  pieges:
  - si:
      contient:
      - b
    relance: Sauter le mot ne t'aide pas à comprendre pourquoi Léa n'a pas faim. Que peux-tu faire à la place ?
  - si:
      contient:
      - c
    relance: Ce mot explique justement pourquoi Léa n'a pas faim. Est-il vraiment sans importance ?
  - si:
      contient:
      - d
    relance: Arrêter la lecture ne résout pas le problème. Quelle autre stratégie peux-tu essayer d'abord ?
  solution: On relit la phrase et on observe le contexte (elle n'a pas faim, elle vient de lire quelque chose de fort) pour
    deviner que « bouleversée » signifie qu'elle a ressenti une émotion très forte.
- id: mot-juste-justifier
  type: texte_court
  difficulte: 2
  enonce: Quel verbe désigne le fait d'expliquer sa compréhension d'un texte en s'appuyant sur des passages précis ?
  reponse:
    acceptees:
    - justifier
    fautes_tolerees: 1
  indices:
    relance: C'est le contraire de donner une opinion sans aucune preuve dans le texte.
    methode: Pense au mot qu'on utilise devant un juge ou un professeur quand on doit prouver ce qu'on avance.
    etape: Le mot commence par « just- » et se termine par « -ifier ».
  pieges:
  - si:
      valeur: expliquer
    relance: « Expliquer » est trop général. Le mot précis ajoute l'idée de preuve, d'appui sur le texte.
  solution: 'Justifier : appuyer son interprétation sur des passages précis du texte, pour montrer qu''elle est fondée.'
- id: etapes-texte-difficile
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes à suivre face à un passage difficile à comprendre.
  reponse:
    elements:
    - id: a
      texte: Je repère le mot ou le passage que je ne comprends pas
    - id: b
      texte: Je relis la phrase en cherchant des indices dans les mots autour
    - id: c
      texte: Si je ne comprends toujours pas, je cherche le mot dans un dictionnaire ou je demande de l'aide
    - id: d
      texte: Je vérifie que ma nouvelle compréhension s'accorde avec la suite du texte
  indices:
    relance: Quelle est la toute première chose à faire, avant même de chercher un sens ?
    methode: Commence par repérer le blocage, puis cherche des indices dans le texte avant de chercher de l'aide extérieure.
    etape: On commence toujours par repérer ce qu'on ne comprend pas.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la démarche (le repérage du blocage) et celle qui la ferme (la vérification).
  solution: On repère d'abord le blocage, puis on cherche des indices de contexte, puis on utilise un dictionnaire ou de l'aide
    si besoin, puis on vérifie que la nouvelle compréhension colle avec la suite du texte.
- id: strategie-situation
  type: association
  difficulte: 3
  enonce: Relie chaque situation de lecture à la stratégie la plus adaptée.
  reponse:
    gauche:
    - id: a
      texte: Je ne comprends pas un mot précis
    - id: b
      texte: Je ne comprends pas pourquoi un personnage agit ainsi
    - id: c
      texte: Je dois choisir un livre à la médiathèque
    droite:
    - id: x
      texte: Je regarde le contexte autour du mot, puis un dictionnaire si besoin
    - id: y
      texte: Je relis les passages qui montrent ses sentiments ou ce qu'il dit
    - id: z
      texte: Je regarde le résumé, la longueur et quelques lignes pour juger le niveau de langue
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque situation, demande-toi ce qui te manque pour comprendre.
    methode: Un mot isolé se résout par le contexte ; un comportement se comprend par les passages qui l'expliquent ; un choix
      de livre se juge par un aperçu global.
    etape: Commence par la situation la plus simple, le mot inconnu, et associe-la à la stratégie de contexte.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque situation en te demandant quel type d'information te manque.
  - si:
      diagnostic: associations_fausses
    relance: Repars de la situation la plus simple, le mot inconnu, et avance une situation à la fois.
  solution: Mot inconnu -> contexte puis dictionnaire. Comportement d'un personnage -> passages qui montrent ses sentiments.
    Choix d'un livre -> résumé, longueur et aperçu du niveau de langue.
- id: nblm-que-doit-faire-en-premier-un-eleve-de-3e-1
  type: choix
  difficulte: 2
  enonce: Que doit faire en premier un élève de 3e lorsqu'il se dit « je comprends pas ce texte » face à une phrase complexe
    ?
  reponse:
    options:
    - id: o1
      texte: Relire la phrase ou le paragraphe en cherchant des indices de sens dans les mots environnants.
    - id: o2
      texte: Abandonner immédiatement la lecture du texte dès la première difficulté.
    - id: o3
      texte: Sauter tout le chapitre sans essayer de comprendre les mots inconnus.
    - id: o4
      texte: Deviner la suite au hasard sans s'appuyer sur les mots du texte.
    bonnes:
    - o1
  indices:
    relance: Mobilise les réflexes d'analyse du contexte pendant la lecture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : un lecteur autonome met en œuvre des stratégies de relecture au lieu de renoncer.'
  - si:
      contient:
      - o3
    relance: Ignorer un passage entier risque d'entraver la compréhension globale du récit et de l'implicite.
  - si:
      contient:
      - o4
    relance: Deviner sans indices de contexte conduit souvent à des contresens sur la suite du texte.
  solution: Relire la phrase ou le paragraphe en cherchant des indices de sens dans les mots environnants. C'est la stratégie
    de lecture essentielle pour élucider de manière autonome un passage difficile.
- id: nblm-comment-appelle-t-on-un-mot-ou-un-groupe-2
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on un mot ou un groupe de mots proche d'un terme inconnu qui aide à deviner son sens lors d'une
    relecture ?
  reponse:
    options:
    - id: o1
      texte: Un indice de contexte
    - id: o2
      texte: Une figure de style
    - id: o3
      texte: Une ellipse narrative
    - id: o4
      texte: Un connecteur logique
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'expression qui associe la recherche d'indices à l'environnement textuel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Une figure de style est un procédé d'expression (comme une comparaison), pas un outil de repérage lexical environnant.
  - si:
      contient:
      - o3
    relance: L'ellipse narrative est un saut temporel dans le récit, cela ne sert pas à deviner le sens d'un mot.
  - si:
      contient:
      - o4
    relance: Le connecteur logique indique le lien entre deux idées (cause, opposition), ce n'est pas l'indice lexical environnant.
  solution: Un indice de contexte. C'est le terme exact pour désigner les éléments du texte environnant qui éclairent un mot
    inconnu.
- id: nblm-sur-quels-criteres-un-eleve-de-3e-doit-i-3
  type: choix
  difficulte: 2
  enonce: Sur quels critères un élève de 3e doit-il s'appuyer pour « choisir un bon livre » adapté à sa lecture ?
  reponse:
    options:
    - id: o1
      texte: Sur son niveau de langue, sa longueur, son thème, ainsi que ses propres goûts et besoins.
    - id: o2
      texte: Uniquement sur l'illustration de la couverture et la couleur du livre.
    - id: o3
      texte: Seulement sur l'épaisseur du papier et la date de réimpression.
    - id: o4
      texte: Uniquement sur le nombre de pages en choisissant toujours le livre le plus court.
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments qui évaluent la difficulté du texte et ton intérêt personnel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : se fier seulement à la couverture ne garantit pas que le niveau de langue convienne.'
  - si:
      contient:
      - o3
    relance: Ces éléments matériels ne donnent aucune information sur le contenu ou la difficulté du texte.
  - si:
      contient:
      - o4
    relance: La longueur seule ne garantit pas la facilité ni l'intérêt du thème pour l'élève.
  solution: Sur son niveau de langue, sa longueur, son thème, ainsi que ses propres goûts et besoins. Ces critères permettent
    de choisir un ouvrage réellement adapté à ses capacités et à son projet de lecteur.
- id: nblm-quelle-demarche-est-indispensable-pour-u-4
  type: choix
  difficulte: 2
  enonce: Quelle démarche est indispensable pour un élève qui veut « expliquer ma lecture » et justifier son interprétation
    d'un texte ?
  reponse:
    options:
    - id: o1
      texte: Citer des passages précis du texte qui appuient et démontrent son explication.
    - id: o2
      texte: Donner uniquement son avis personnel sans jamais citer le texte.
    - id: o3
      texte: Raconter une anecdote personnelle sans rapport avec le sujet du texte.
    - id: o4
      texte: Recopier le texte entier sans apporter aucune explication.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui différencie une impression personnelle d'une interprétation prouvée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : donner une opinion sans preuve textuelle reste une simple impression.'
  - si:
      contient:
      - o3
    relance: La justification doit porter rigoureusement sur le texte étudié et non sur des faits extérieurs.
  - si:
      contient:
      - o4
    relance: Recopier sans analyser ni commenter ne constitue pas une justification d'interprétation.
  solution: Citer des passages précis du texte qui appuient et démontrent son explication. Une interprétation valide et argumentée
    doit être fondée sur des preuves textuelles explicites.
- id: nblm-avant-de-commencer-la-lecture-detaillee-5
  type: choix
  difficulte: 2
  enonce: Avant de commencer la lecture détaillée d'un livre, quelle stratégie permet d'anticiper son contenu ?
  reponse:
    options:
    - id: o1
      texte: Observer le titre, la couverture, les images et la table des matières.
    - id: o2
      texte: Lire directement la conclusion sans regarder le titre ni la première page.
    - id: o3
      texte: Compter le nombre de mots sur chaque page du premier chapitre.
    - id: o4
      texte: Attendre d'avoir terminé le livre pour chercher de quoi il parle.
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments d'observation préalable du livre avant d'ouvrir le premier chapitre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Sauter à la fin empêche de comprendre la progression du livre et d'anticiper globalement le sujet.
  - si:
      contient:
      - o3
    relance: Compter les mots est une tâche mécanique qui ne donne aucun indice sur le sujet ou la structure.
  - si:
      contient:
      - o4
    relance: L'anticipation se fait avant la lecture pour guider l'attention du lecteur.
  solution: Observer le titre, la couverture, les images et la table des matières. L'examen des éléments paratextuels permet
    d'émettre des hypothèses et de préparer la compréhension.
- id: nblm-lorsqu-un-eleve-se-dit-que-relire-un-pas-6
  type: choix
  difficulte: 3
  enonce: Lorsqu'un élève se dit que « relire un passage » est nécessaire car la compréhension bloque, quelles sont les DEUX
    bonnes stratégies à employer ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Relire la phrase en recherchant des indices de sens dans les mots voisins.
    - id: o2
      texte: Chercher le mot problématique dans un dictionnaire ou demander de l'aide si le blocage persiste.
    - id: o3
      texte: Fermer le livre et abandonner définitivement la lecture.
    - id: o4
      texte: Inventer le sens de la phrase sans tenir compte des mots écrits.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne la démarche d'analyse autonome ainsi que le recours utile quand la relecture ne suffit pas.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'L''abandon est l''erreur typique à éviter : un bon lecteur déploie des stratégies actives face aux obstacles.'
  - si:
      contient:
      - o4
    relance: Deviner sans vérifier dans le texte risque de provoquer des contresens sur l'ensemble de l'œuvre.
  solution: Relire la phrase en recherchant des indices de sens dans les mots voisins ; Chercher le mot problématique dans
    un dictionnaire ou demander de l'aide si le blocage persiste. La relecture attentive avec analyse du contexte est la première
    stratégie d'élucidation autonome.
- id: nblm-comment-appelle-t-on-l-explication-du-se-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'explication du sens d'un texte qui doit s'appuyer sur des passages précis pour ne pas être
    une simple impression ?
  reponse:
    acceptees:
    - interprétation
    fautes_tolerees: 1
  indices:
    relance: Ce nom féminin désigne l'analyse justifiée du sens d'un texte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: interprétation. L'interprétation est l'explication argumentée du sens d'un texte littéraire fondée sur des preuves
    textuelles.
- id: nblm-pour-ne-pas-renoncer-devant-un-texte-dif-8
  type: texte_court
  difficulte: 1
  enonce: Pour ne pas renoncer devant un texte difficile, l'élève de 3e déploie différentes
  reponse:
    acceptees:
    - stratégies
    fautes_tolerees: 1
  indices:
    relance: Ce nom au pluriel désigne les méthodes mises en œuvre par le lecteur pour comprendre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: stratégies. Les stratégies de lecture désignent l'ensemble des démarches conscientes utilisées par le lecteur
    pour comprendre.
- id: mot-inference
  type: texte_court
  difficulte: 2
  enonce: Quel nom donne-t-on à la compréhension d'une information que le texte ne dit pas directement, mais que l'on déduit
    d'indices ?
  reponse:
    acceptees:
    - inférence
    - inference
    fautes_tolerees: 1
  indices:
    relance: 'On ne lit pas seulement ce qui est écrit : on assemble des indices pour comprendre le reste.'
    methode: Le mot commence par « infé- » et évoque une déduction.
    etape: Il se termine par « -ence ».
  pieges:
  - si:
      valeur: déduction
    relance: Ce mot est proche du sens, mais on cherche le terme précis de la lecture, qui commence par « in- ».
  solution: 'C''est l''inférence : comprendre ce que le texte sous-entend en assemblant des indices.'
- id: bonne-justification
  type: choix
  difficulte: 2
  enonce: 'Texte : « Théo serra son sac contre lui et baissa la tête. Personne ne lui parlait depuis le matin. À la sonnerie,
    il attendit que la cour soit vide avant de sortir. » Quelle réponse justifie le mieux que Théo se sent seul ?'
  reponse:
    options:
    - id: a
      texte: 'Théo se sent seul : « Personne ne lui parlait depuis le matin » le montre.'
    - id: b
      texte: Théo se sent seul, c'est évident.
    - id: c
      texte: Théo a un sac.
    - id: d
      texte: Théo sort de l'école quand la cloche sonne.
    bonnes:
    - a
  indices:
    relance: Une bonne justification donne une réponse, cite le texte, puis fait le lien.
    methode: Cherche la réponse qui contient une citation exacte.
    etape: Une seule réponse cite une phrase précise du texte qui explique pourquoi Théo se sent seul.
  pieges:
  - si:
      contient:
      - b
    relance: Cette réponse donne une opinion sans preuve tirée du texte.
  - si:
      contient:
      - c
    relance: C'est un fait du texte, mais il ne prouve pas que Théo se sent seul.
  - si:
      contient:
      - d
    relance: Ce n'est pas exactement ce que dit le texte, et cela ne prouve pas la solitude.
  solution: La réponse a associe l'idée (Théo est seul) et une citation exacte (« Personne ne lui parlait depuis le matin
    »).
- id: justifier-interpretation
  type: ouverte
  difficulte: 3
  enonce: 'Lis ce texte : « Théo serra son sac contre lui et baissa la tête. Personne ne lui parlait depuis le matin. À la
    sonnerie, il attendit que la cour soit vide avant de sortir. » Que ressent Théo ? Justifie ta réponse avec deux citations.'
  criteres:
  - L'élève propose une interprétation claire de ce que ressent Théo (solitude, malaise, peur des autres...).
  - L'élève cite au moins deux passages précis du texte, entre guillemets.
  - L'élève explique en quoi chaque citation appuie son interprétation.
  indices:
    relance: Regarde ce que fait Théo et ce que les autres font autour de lui.
    methode: Donne ton interprétation, puis cite un passage, explique-le, puis cite un second passage.
    etape: 'Tu peux commencer ainsi : « Théo semble... : en effet, le texte dit « ... », ce qui montre que... ».'
  solution: Théo semble seul et mal à l'aise. En effet, le texte dit « Personne ne lui parlait depuis le matin », ce qui montre
    que les autres l'ignorent. De plus, « il attendit que la cour soit vide avant de sortir » prouve qu'il cherche à éviter
    les autres.
