format: 2
notion: transfert-lexique-et-genres
version: 2
etat: verifiee
declencheurs:
- réutiliser un mot appris en lecture
- écrire comme un auteur
- reconnaître un genre littéraire
- regarder mon texte d'un œil critique
- reconnaître un roman ou une nouvelle
- outils pour analyser un texte
- réemployer une tournure lue
- texte de théâtre et didascalies
prerequis: []
essentiel: 'Lire sert aussi à mieux écrire : on découvre des mots, des tournures, des genres qu''on peut ensuite réutiliser.


  1. Les principaux genres littéraires.

  - Le roman : long récit en prose, avec une intrigue, des personnages et un narrateur.

  - La nouvelle : récit court, peu de personnages, souvent une chute (fin surprenante).

  - Le conte et la fable : récits courts ; la fable est en général suivie d''une morale.

  - Le théâtre : texte écrit pour être joué ; il se compose de répliques (dialogues) et de didascalies (indications de mise
  en scène), avec des actes et des scènes.

  - La poésie : texte qui joue avec les sons, le rythme, les images ; il peut être en vers ou en prose.

  - L''autobiographie : l''auteur raconte sa propre vie (auteur, narrateur et personnage sont la même personne).

  - Les textes argumentatifs (essai, lettre ouverte, discours) : ils défendent une idée.


  2. Utiliser des outils d''analyse.

  Pour comprendre un texte, on repère : qui parle (le narrateur, le point de vue), le temps de base, les champs lexicaux (mots
  d''un même thème), les figures de style (comparaison, métaphore), le registre (comique, tragique, lyrique...), les connecteurs.


  3. Transférer dans son écrit.

  Transférer, c''est réemployer dans son texte des mots, des tournures ou des procédés vus en lecture, sans copier le texte.
  On garde la construction mais on change le sujet, les mots ou le contexte (« la peur lui nouait l''estomac » peut devenir
  « l''émotion lui serrait la gorge »). Copier une phrase entière n''est pas un transfert.


  4. Prendre de la distance critique.

  Après avoir écrit, on relit son texte comme un lecteur : le genre est-il respecté ? les mots sont-ils précis ? l''effet
  cherché est-il produit ? On note ce qui marche, ce qui manque, puis on réécrit.


  Au brevet, en rédaction, on montre qu''on a lu : mots précis, tournures variées, bon respect du genre demandé.

  '
methode:
- Repère le genre demandé et rappelle-toi ses caractéristiques (forme, narrateur, dialogues, but).
- Relis un texte du même genre déjà étudié et note deux mots ou tournures que tu pourrais réutiliser.
- 'Repère avec des outils d''analyse comment ils fonctionnent : qui parle, temps, champ lexical, figure de style.'
- 'Réemploie le mot ou la tournure dans un contexte différent : change les mots ou le sujet, ne copie pas la phrase.'
- 'Relis ton texte en te mettant à la place d''un lecteur extérieur : genre respecté ? mots précis ? effet réussi ?'
- Réécris ce qui ne convient pas, puis vérifie une dernière fois le sens et l'orthographe.
vocabulaire:
- terme: genre littéraire
  definition: catégorie de textes qui partagent une forme et des caractéristiques (roman, théâtre, poésie...)
- terme: transfert
  definition: réemploi, dans son propre texte, d'un mot ou d'une tournure découverts en lecture
- terme: distance critique
  definition: capacité à relire son texte comme un lecteur extérieur pour en juger les effets
- terme: didascalie
  definition: indication de jeu ou de décor écrite dans un texte de théâtre
- terme: chute
  definition: fin surprenante d'une nouvelle
- terme: champ lexical
  definition: ensemble de mots qui se rapportent à un même thème
- terme: registre
  definition: 'tonalité d''un texte : comique, tragique, lyrique, etc.'
- terme: autobiographie
  definition: récit de sa propre vie par l'auteur lui-même
erreurs_frequentes:
- Recopier une phrase du texte lu au lieu de la réutiliser dans un autre contexte.
- 'Confondre le genre d''un texte : prendre un poème en prose pour un récit, ou la nouvelle pour un roman.'
- Employer un mot appris en lecture sans en avoir vérifié le sens exact.
- Croire que la distance critique consiste seulement à corriger l'orthographe.
- Écrire dans un genre sans respecter ses caractéristiques (dialogues sans didascalies au théâtre, par exemple).
exemple:
  enonce: 'Un élève a lu dans un roman la phrase : « Le vent s''engouffrait dans la ruelle déserte. » Il écrit ensuite : «
    Le silence s''engouffrait dans la salle vide. » Explique en une phrase ce qu''il a fait.'
  solution: Il a transféré la tournure « s'engouffrer dans » découverte en lecture, en la réemployant dans un contexte différent
    (le silence au lieu du vent), sans copier la phrase entière.
exercices:
- id: reconnaitre-transfert
  type: choix
  difficulte: 1
  enonce: Un élève a lu dans un roman « la peur lui nouait l'estomac ». Il écrit ensuite « la joie lui nouait le cœur ». Que
    vient-il de faire ?
  reponse:
    options:
    - id: a
      texte: Il a transféré une tournure de phrase apprise en lecture, en la réemployant avec un autre mot
    - id: b
      texte: Il a recopié exactement la phrase du roman
    - id: c
      texte: Il a fait une faute de grammaire
    - id: d
      texte: Il a changé de genre littéraire
    bonnes:
    - a
  indices:
    relance: 'Compare les deux phrases mot à mot : sont-elles identiques ou seulement proches dans la construction ?'
    methode: Le transfert consiste à garder une construction de phrase intéressante mais à changer les mots pour un contexte
      différent.
    etape: Les deux phrases utilisent la même construction « X lui nouait Y », mais avec des mots différents.
  pieges:
  - si:
      contient:
      - b
    relance: Les deux phrases ne sont pas identiques, les mots ont changé. A-t-il vraiment recopié ?
  - si:
      contient:
      - c
    relance: La phrase est grammaticalement correcte. Cherche plutôt ce qu'il a fait avec la tournure de phrase.
  - si:
      contient:
      - d
    relance: Rien n'indique un changement de genre littéraire ici, seulement une tournure réemployée.
  solution: Il a transféré une tournure de phrase repérée en lecture (« X lui nouait Y »), en la réemployant avec des mots
    différents adaptés à son propre texte.
- id: mot-distance-critique
  type: texte_court
  difficulte: 2
  enonce: Quelle expression désigne la capacité à relire son propre texte comme le ferait un lecteur extérieur, pour juger
    s'il est réussi ?
  reponse:
    acceptees:
    - distance critique
    fautes_tolerees: 2
  indices:
    relance: Ce n'est pas seulement corriger des fautes, c'est prendre du recul sur l'ensemble du texte.
    methode: L'expression contient deux mots, le premier évoque un écart, le second évoque un jugement.
    etape: Le premier mot commence par « dist- », le second par « crit- ».
  pieges:
  - si:
      valeur: relecture
    relance: La relecture est l'action de relire, mais l'expression cherchée insiste sur le jugement et le recul, pas seulement
      sur l'action.
  solution: 'La distance critique : la capacité à juger son propre texte comme un lecteur extérieur, au-delà de la simple
    correction des fautes.'
- id: genre-caracteristique
  type: association
  difficulte: 2
  enonce: Relie chaque genre littéraire à une de ses caractéristiques principales.
  reponse:
    gauche:
    - id: a
      texte: Le théâtre
    - id: b
      texte: La poésie
    - id: c
      texte: Le roman
    droite:
    - id: x
      texte: Utilise des dialogues et des didascalies
    - id: y
      texte: Joue avec les sons, le rythme et parfois les rimes
    - id: z
      texte: Développe une intrigue racontée par un narrateur
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Pense à un texte de chaque genre que tu as déjà lu : qu''est-ce qui le distingue visuellement des autres ?'
    methode: Le théâtre se reconnaît à sa mise en page avec des noms de personnages, la poésie à ses vers, le roman à son
      récit continu.
    etape: Commence par le théâtre, le plus facile à repérer grâce à sa mise en page particulière.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à ce qui distingue visuellement chaque genre.
  - si:
      diagnostic: associations_fausses
    relance: Repars du théâtre, reconnaissable à sa mise en page, puis distingue poésie et roman.
  solution: Le théâtre utilise dialogues et didascalies. La poésie joue avec les sons et le rythme. Le roman développe une
    intrigue avec un narrateur.
- id: etapes-transfert-lecture
  type: ordre
  difficulte: 3
  enonce: Range dans l'ordre logique les étapes pour réemployer dans son écriture ce qu'on a repéré en lecture.
  reponse:
    elements:
    - id: a
      texte: Je repère un mot précis ou une tournure intéressante dans un texte lu
    - id: b
      texte: Je réfléchis à un contexte différent où je pourrais l'utiliser
    - id: c
      texte: J'écris ma phrase en réemployant la tournure avec mes propres mots
    - id: d
      texte: Je relis pour vérifier que ma phrase garde du sens dans mon propre texte
  indices:
    relance: Quelle est la toute première chose à faire, avant même de penser à écrire une nouvelle phrase ?
    methode: On repère d'abord un élément intéressant en lecture, puis on l'adapte, puis on l'écrit, puis on vérifie.
    etape: On commence toujours par repérer l'élément à réemployer, en lecture.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la démarche (repérer en lecture) et celle qui la ferme (vérifier le sens).
  solution: On repère d'abord un élément en lecture, puis on imagine un nouveau contexte, puis on écrit la phrase, puis on
    vérifie qu'elle garde du sens.
- id: genre-didascalies
  type: choix
  difficulte: 1
  enonce: Un texte est fait de répliques précédées du nom du personnage et d'indications entre parenthèses comme « (il ouvre
    la fenêtre) ». À quel genre appartient-il ?
  reponse:
    options:
    - id: a
      texte: le théâtre
    - id: b
      texte: la fable
    - id: c
      texte: l'autobiographie
    bonnes:
    - a
  indices:
    relance: 'Ces indications entre parenthèses s''adressent à qui : au lecteur ou à l''acteur ?'
    methode: Un texte fait de répliques et d'indications de jeu est écrit pour être joué sur scène.
    etape: Cherche le genre pour lequel on écrit des répliques et des indications de mise en scène.
  pieges:
  - si:
      contient:
      - b
    relance: La fable est un récit court avec une morale. Ici, les personnages parlent en répliques et il y a des indications
      de jeu.
  - si:
      contient:
      - c
    relance: L'autobiographie est le récit de sa propre vie. Ici, ce sont des répliques et des indications de jeu.
  solution: 'Ce sont des répliques et des didascalies : le texte est du théâtre.'
- id: mot-didascalie
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on, dans un texte de théâtre, les indications de mise en scène écrites entre parenthèses ou en
    italique ?
  reponse:
    acceptees:
    - didascalies
    - didascalie
    - les didascalies
    fautes_tolerees: 2
  indices:
    relance: Ce sont des indications qu'un acteur lit mais ne prononce pas.
    methode: Le mot est un nom féminin pluriel, propre au théâtre, qui commence par la lettre d.
    etape: Le mot commence par « dida- » et se termine par « -lies ».
  pieges:
  - si:
      valeur: répliques
    relance: Les répliques sont les paroles que dit le personnage. Ici, on cherche les indications qu'il ne dit pas.
  solution: Les didascalies sont les indications de jeu, de décor ou de ton données par l'auteur dans un texte de théâtre.
- id: genre-forme
  type: association
  difficulte: 3
  enonce: Relie chaque genre à sa caractéristique.
  reponse:
    gauche:
    - id: a
      texte: La fable
    - id: b
      texte: La nouvelle
    - id: c
      texte: L'autobiographie
    - id: d
      texte: La lettre ouverte
    droite:
    - id: y
      texte: Récit court qui se termine souvent par une chute
    - id: z
      texte: L'auteur raconte sa propre vie
    - id: w
      texte: Texte adressé publiquement pour défendre une idée
    - id: x
      texte: Récit court suivi d'une morale
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Cherche pour chaque genre le mot-clé qui le distingue des autres (morale, chute, auteur, idée).
    methode: Le mot « moral » va avec la fable ; « surprise » va avec la nouvelle ; « propre vie » avec l'autobiographie.
    etape: 'Commence par la lettre ouverte : elle sert à défendre une idée devant un public.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les caractéristiques de chaque genre.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord les deux récits courts et cherche ce qui les distingue (morale ou chute).
  solution: 'Fable : récit court + morale ; nouvelle : récit court + chute ; autobiographie : sa propre vie ; lettre ouverte
    : défendre une idée en public.'
- id: transferer-et-juger
  type: ouverte
  difficulte: 3
  enonce: 'Voici une phrase d''exemple : « Le vent s''engouffrait dans la rue déserte. » Réutilise la tournure « s''engouffrer
    dans » dans une nouvelle phrase avec un autre sujet et un autre lieu. Puis, en une phrase, juge l''effet de ta phrase
    avec un peu de distance critique (ce qui fonctionne, ce que tu changerais).'
  criteres:
  - La tournure « s'engouffrer dans » est réemployée avec un autre sujet et un autre lieu, sans copier la phrase.
  - La nouvelle phrase est correcte et cohérente (le sujet peut réellement s'engouffrer).
  - Le jugement porte sur l'effet de la phrase (image, sens, mot précis) et propose au moins une amélioration.
  indices:
    relance: Que peut « s'engouffrer » ? Choisis un autre sujet et un autre endroit.
    methode: Garde la construction (sujet + s'engouffrait dans + lieu) et change les mots autour.
    etape: 'Exemple : « La foule s''engouffrait dans ... ». Complète avec un lieu.'
  solution: 'Exemple : « La foule s''engouffrait dans le métro. » Jugement : l''image de la foule pressée est claire, mais
    j''écrirais « bruyante » pour renforcer l''effet.'
