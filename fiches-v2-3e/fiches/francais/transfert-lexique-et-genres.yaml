# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: transfert-lexique-et-genres
version: 1
etat: verifiee
declencheurs:
- réutiliser un mot appris en lecture
- écrire comme un auteur
- reconnaître un genre littéraire
- regarder mon texte d'un œil critique
prerequis: []
essentiel: 'Lire aide à écrire. Quand on lit un roman, un poème ou une pièce de théâtre, on rencontre du vocabulaire précis

  et des tournures de phrases qu''on peut réutiliser dans ses propres textes. Transférer, c''est réemployer ce qu''on

  a appris en lecture dans sa propre écriture, sans copier un passage entier.


  Les genres littéraires (roman, nouvelle, théâtre, poésie, fable, conte) ont chacun des caractéristiques propres :

  le théâtre utilise des dialogues et des didascalies, la poésie joue avec les sons et le rythme, le roman développe

  une intrigue avec un narrateur. Connaître ces caractéristiques aide à écrire dans le genre demandé.


  Avoir une distance critique sur son texte, c''est savoir le relire comme un lecteur extérieur, pour juger s''il est

  réussi, s''il produit l''effet voulu, et pas seulement vérifier l''orthographe.

  '
methode:
- Repérer, dans un texte lu, un mot précis ou une tournure de phrase intéressante.
- Réemployer ce mot ou cette tournure dans son propre texte, dans un contexte différent.
- Avant d'écrire dans un genre donné (théâtre, poésie, conte), identifier ses caractéristiques principales.
- Après avoir écrit, relire son texte en se mettant à la place d'un lecteur extérieur pour juger son effet.
vocabulaire:
- terme: transfert
  definition: réemployer dans sa propre écriture un mot ou une tournure découverts en lecture
- terme: distance critique
  definition: capacité à juger son propre texte comme le ferait un lecteur extérieur
erreurs_frequentes:
- Copier un passage entier d'un livre au lieu de réemployer seulement un mot ou une tournure.
- Écrire un texte de théâtre sans dialogues ni didascalies.
- Ne jamais relire son texte comme un lecteur extérieur, seulement pour corriger l'orthographe.
exemple:
  enonce: 'Un élève a lu dans un roman la phrase : « Le vent s''engouffrait dans la ruelle déserte. » Il écrit ensuite : «
    Le silence s''engouffrait dans la salle vide. » Explique en une phrase ce qu''il a fait.'
  solution: Il a transféré la tournure « s'engouffrer dans » découverte en lecture, en la réemployant dans un contexte différent
    (le silence au lieu du vent), sans copier la phrase entière.
exercices:
- id: reconnaitre-transfert
  type: choix
  difficulte: 1
  enonce: Un élève a lu dans un roman « la peur lui nouait l'estomac ». Il écrit ensuite « la joie lui nouait le cœur ». Que
    vient-il de faire ?
  reponse:
    options:
    - id: a
      texte: Il a transféré une tournure de phrase apprise en lecture, en la réemployant avec un autre mot
    - id: b
      texte: Il a recopié exactement la phrase du roman
    - id: c
      texte: Il a fait une faute de grammaire
    - id: d
      texte: Il a changé de genre littéraire
    bonnes:
    - a
  indices:
    relance: 'Compare les deux phrases mot à mot : sont-elles identiques ou seulement proches dans la construction ?'
    methode: Le transfert consiste à garder une construction de phrase intéressante mais à changer les mots pour un contexte
      différent.
    etape: Les deux phrases utilisent la même construction « X lui nouait Y », mais avec des mots différents.
  pieges:
  - si:
      contient:
      - b
    relance: Les deux phrases ne sont pas identiques, les mots ont changé. A-t-il vraiment recopié ?
  - si:
      contient:
      - c
    relance: La phrase est grammaticalement correcte. Cherche plutôt ce qu'il a fait avec la tournure de phrase.
  - si:
      contient:
      - d
    relance: Rien n'indique un changement de genre littéraire ici, seulement une tournure réemployée.
  solution: Il a transféré une tournure de phrase repérée en lecture (« X lui nouait Y »), en la réemployant avec des mots
    différents adaptés à son propre texte.
- id: mot-distance-critique
  type: texte_court
  difficulte: 2
  enonce: Quelle expression désigne la capacité à relire son propre texte comme le ferait un lecteur extérieur, pour juger
    s'il est réussi ?
  reponse:
    acceptees:
    - distance critique
    fautes_tolerees: 2
  indices:
    relance: Ce n'est pas seulement corriger des fautes, c'est prendre du recul sur l'ensemble du texte.
    methode: L'expression contient deux mots, le premier évoque un écart, le second évoque un jugement.
    etape: Le premier mot commence par « dist- », le second par « crit- ».
  pieges:
  - si:
      valeur: relecture
    relance: La relecture est l'action de relire, mais l'expression cherchée insiste sur le jugement et le recul, pas seulement
      sur l'action.
  solution: 'La distance critique : la capacité à juger son propre texte comme un lecteur extérieur, au-delà de la simple
    correction des fautes.'
- id: genre-caracteristique
  type: association
  difficulte: 2
  enonce: Relie chaque genre littéraire à une de ses caractéristiques principales.
  reponse:
    gauche:
    - id: a
      texte: Le théâtre
    - id: b
      texte: La poésie
    - id: c
      texte: Le roman
    droite:
    - id: x
      texte: Utilise des dialogues et des didascalies
    - id: y
      texte: Joue avec les sons, le rythme et parfois les rimes
    - id: z
      texte: Développe une intrigue racontée par un narrateur
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Pense à un texte de chaque genre que tu as déjà lu : qu''est-ce qui le distingue visuellement des autres ?'
    methode: Le théâtre se reconnaît à sa mise en page avec des noms de personnages, la poésie à ses vers, le roman à son
      récit continu.
    etape: Commence par le théâtre, le plus facile à repérer grâce à sa mise en page particulière.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à ce qui distingue visuellement chaque genre.
  - si:
      diagnostic: associations_fausses
    relance: Repars du théâtre, reconnaissable à sa mise en page, puis distingue poésie et roman.
  solution: Le théâtre utilise dialogues et didascalies. La poésie joue avec les sons et le rythme. Le roman développe une
    intrigue avec un narrateur.
- id: etapes-transfert-lecture
  type: ordre
  difficulte: 3
  enonce: Range dans l'ordre logique les étapes pour réemployer dans son écriture ce qu'on a repéré en lecture.
  reponse:
    elements:
    - id: a
      texte: Je repère un mot précis ou une tournure intéressante dans un texte lu
    - id: b
      texte: Je réfléchis à un contexte différent où je pourrais l'utiliser
    - id: c
      texte: J'écris ma phrase en réemployant la tournure avec mes propres mots
    - id: d
      texte: Je relis pour vérifier que ma phrase garde du sens dans mon propre texte
  indices:
    relance: Quelle est la toute première chose à faire, avant même de penser à écrire une nouvelle phrase ?
    methode: On repère d'abord un élément intéressant en lecture, puis on l'adapte, puis on l'écrit, puis on vérifie.
    etape: On commence toujours par repérer l'élément à réemployer, en lecture.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la démarche (repérer en lecture) et celle qui la ferme (vérifier le sens).
  solution: On repère d'abord un élément en lecture, puis on imagine un nouveau contexte, puis on écrit la phrase, puis on
    vérifie qu'elle garde du sens.
- id: nblm-en-francais-de-3e-que-signifie-l-action-1
  type: choix
  difficulte: 2
  enonce: En français de 3e, que signifie l'action de « transférer » du lexique ou des tournures syntaxiques découverts en
    lecture dans sa propre écriture ?
  reponse:
    options:
    - id: o1
      texte: Réemployer dans son texte un mot ou une structure appris lors d'une lecture, sans recopier un passage entier.
    - id: o2
      texte: Recopier intégralement un paragraphe entier d'un auteur pour enrichir son propre devoir.
    - id: o3
      texte: Apprendre par cœur la définition d'un mot du dictionnaire sans jamais l'utiliser dans une rédaction.
    - id: o4
      texte: Corriger uniquement les fautes d'orthographe et de grammaire lors de la relecture de sa rédaction.
    bonnes:
    - o1
  indices:
    relance: Pense à la manière dont une découverte faite dans un livre peut nourrir tes propres créations sans faire de simple
      copier-coller.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : recopier un extrait complet constitue du plagiat et non un transfert d''outils
      linguistiques.'
  - si:
      contient:
      - o3
    relance: Mémoriser une définition sans la réutiliser dans ses écrits ne constitue pas un transfert lexical.
  - si:
      contient:
      - o4
    relance: La correction orthographique relève de la révision formelle du texte, pas du transfert du vocabulaire vu en lecture.
  solution: 'Réemployer dans son texte un mot ou une structure appris lors d''une lecture, sans recopier un passage entier.
    C''est la définition exacte : le transfert consiste à réinvestir une découverte de lecture dans son propre travail d''écriture.'
- id: nblm-comment-un-eleve-peut-il-ecrire-comme-un-2
  type: choix
  difficulte: 2
  enonce: Comment un élève peut-il « écrire comme un auteur » (par exemple à la manière de Francis Ponge) tout en effectuant
    un transfert réussi ?
  reponse:
    options:
    - id: o1
      texte: En observant les procédés stylistiques de l'auteur pour créer son propre texte original.
    - id: o2
      texte: En recopiant mot à mot un texte de l'auteur en modifiant seulement son titre.
    - id: o3
      texte: En s'interdisant d'employer tout mot déjà utilisé par cet auteur dans ses œuvres.
    - id: o4
      texte: En rédigeant uniquement une fiche biographique sur la vie de l'auteur.
    bonnes:
    - o1
  indices:
    relance: Pense à l'imitation créative des procédés stylistiques d'un écrivain plutôt qu'à la recopie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur : recopier le texte d''un auteur est une copie servile, pas une appropriation de sa manière
      d''écrire.'
  - si:
      contient:
      - o3
    relance: Le transfert encourage au contraire à réemployer le lexique et les structures découverts chez l'auteur.
  - si:
      contient:
      - o4
    relance: Rédiger une biographie est un travail documentaire, pas un exercice d'écriture créative s'inspirant du style
      de l'auteur.
  solution: 'En observant les procédés stylistiques de l''auteur pour créer son propre texte original. C''est exact : écrire
    ''à la manière de'' consiste à réemployer des procédés littéraires pour produire une création personnelle.'
- id: nblm-avant-de-rediger-un-texte-pour-reconnait-3
  type: choix
  difficulte: 2
  enonce: Avant de rédiger un texte pour « reconnaître un genre littéraire » (comme une pièce de théâtre), quelle démarche
    est essentielle ?
  reponse:
    options:
    - id: o1
      texte: Identifier les caractéristiques majeures du genre (dialogues, didascalies) pour les respecter dans son texte.
    - id: o2
      texte: Rédiger un long récit narratif continu sans insérer le moindre dialogue ni didascalie.
    - id: o3
      texte: Ignorer le genre demandé et écrire une dissertation argumentative classique à la place.
    - id: o4
      texte: Attendre d'avoir terminé l'évaluation pour se demander à quel genre devait appartenir le texte.
    bonnes:
    - o1
  indices:
    relance: Prends en compte les formes et codes d'écriture spécifiques indispensables à chaque catégorie d'œuvre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur typique : écrire du théâtre sans dialogues ni didascalies ne respecte pas les caractéristiques
      du genre.'
  - si:
      contient:
      - o3
    relance: Ne pas respecter le genre demandé empêche de réaliser le transfert des formes littéraires attendues.
  - si:
      contient:
      - o4
    relance: L'identification des caractéristiques du genre doit se faire dès la phase de préparation, avant la rédaction.
  solution: 'Identifier les caractéristiques majeures du genre (dialogues, didascalies) pour les respecter dans son texte.
    C''est juste : connaître les codes propres à chaque genre permet de structurer correctement son écrit.'
- id: nblm-que-signifie-regarder-mon-texte-d-un-il-4
  type: choix
  difficulte: 2
  enonce: Que signifie « regarder mon texte d'un œil critique » ou adopter une distance critique lors de la relecture ?
  reponse:
    options:
    - id: o1
      texte: Se mettre à la place d'un lecteur extérieur pour juger de la pertinence et des effets de son texte.
    - id: o2
      texte: Vérifier uniquement les fautes d'orthographe d'usage sans questionner le sens du texte.
    - id: o3
      texte: Effacer immédiatement l'intégralité de sa rédaction dès qu'on repère une répétition.
    - id: o4
      texte: Penser que son propre texte est parfait et n'a besoin d'aucune modification ni relecture.
    bonnes:
    - o1
  indices:
    relance: Imagine la réaction d'une personne qui découvre tes phrases pour la toute première fois.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : la distance critique ne se limite pas à la correction orthographique, elle concerne
      l''effet global du texte.'
  - si:
      contient:
      - o3
    relance: Avoir un regard critique sert à amender et améliorer son texte, pas à le détruire au moindre doute.
  - si:
      contient:
      - o4
    relance: La distance critique exige au contraire de dépasser l'autosatisfaction pour réviser lucidement son écrit.
  solution: 'Se mettre à la place d''un lecteur extérieur pour juger de la pertinence et des effets de son texte. C''est la
    définition exacte : la distance critique permet d''évaluer l''impact et la clarté de son devoir pour le lecteur.'
- id: nblm-un-eleve-lit-le-vent-s-engouffrait-dans-5
  type: choix
  difficulte: 2
  enonce: Un élève lit « Le vent s'engouffrait dans la ruelle déserte » et écrit « Le silence s'engouffrait dans la salle
    ». Quel transfert a-t-il réalisé ?
  reponse:
    options:
    - id: o1
      texte: Le transfert d'une tournure verbale réemployée dans un contexte différent sans copier la phrase entière.
    - id: o2
      texte: Un plagiat littéral de la phrase de l'auteur sans aucun changement.
    - id: o3
      texte: Une faute de syntaxe car un verbe lu dans un roman ne peut pas s'utiliser ailleurs.
    - id: o4
      texte: Une erreur de compréhension car le mot « s'engouffrer » ne peut s'appliquer qu'au vent.
    bonnes:
    - o1
  indices:
    relance: Observe comment la structure du verbe a été réutilisée de manière créative pour exprimer une autre idée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur d''analyse : le sujet et le complément ont été changés, ce n''est donc pas une copie mot à
      mot.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : le principe du transfert est précisément de réutiliser les structures découvertes dans d''autres
      contextes.'
  - si:
      contient:
      - o4
    relance: L'extension métaphorique d'une tournure à un nouveau domaine est un moyen d'enrichir le style de son écrit.
  solution: 'Le transfert d''une tournure verbale réemployée dans un contexte différent sans copier la phrase entière. C''est
    exactement cela : il a réinvesti la structure ''s''engouffrer dans'' pour créer une image personnelle avec d''autres mots.'
- id: nblm-quelles-sont-les-deux-propositions-qui-i-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX propositions qui illustrent un transfert réussi des lectures dans un devoir de français ?
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Réutiliser un mot de vocabulaire précis découvert en lecture dans une description personnelle.
    - id: o2
      texte: Réemployer les caractéristiques d'un genre littéraire étudié pour structurer sa rédaction.
    - id: o3
      texte: Recopier un paragraphe entier du livre étudié sans mettre de guillemets.
    - id: o4
      texte: Remplacer le vocabulaire de l'auteur par un registre familier ou du langage relâché.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux choix qui réinvestissent le vocabulaire ou la forme littéraire étudiée de manière pertinente.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est une erreur typique : recopier sans guillemets est un plagiat, pas un transfert de compétences d''écriture.'
  - si:
      contient:
      - o4
    relance: Le transfert vise à hausser la qualité de son style, non à dégrader le niveau de langue.
  solution: 'Réutiliser un mot de vocabulaire précis découvert en lecture dans une description personnelle ; Réemployer les
    caractéristiques d''un genre littéraire étudié pour structurer sa rédaction. C''est juste : réinvestir du lexique vu en
    lecture permet d''enrichir sa propre expression écrite.'
- id: nblm-quelle-attitude-consiste-a-savoir-relire-7
  type: texte_court
  difficulte: 1
  enonce: Quelle attitude consiste à savoir relire son propre texte comme un lecteur extérieur pour juger de son effet ?
  reponse:
    acceptees:
    - distance critique
    fautes_tolerees: 1
  indices:
    relance: Expression de deux mots désignant la prise de recul indispensable lors de la relecture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: distance critique. La 'distance critique' est la capacité à évaluer son propre écrit avec le recul nécessaire
    pour en apprécier la valeur et les effets.
- id: nblm-quel-terme-designe-le-fait-de-reemployer-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne le fait de réemployer dans sa propre écriture du lexique ou des tournures découverts lors de
    lectures ?
  reponse:
    acceptees:
    - transfert
    fautes_tolerees: 1
  indices:
    relance: Ce mot d'un seul terme constitue le titre central de la notion étudiée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: transfert. Le 'transfert' est le terme clé désignant le réinvestissement des découvertes de lecture dans la rédaction.
