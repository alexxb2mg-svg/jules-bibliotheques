    relance: 'Reprends chaque sujet et repère sa terminaison : -sse, -ssions, -ssent.'
  solution: que je fusse, que nous fussions, qu'ils fussent.
- id: subjonctif-pqp-correct
  type: choix
  difficulte: 3
  enonce: Quelle phrase est correctement écrite ?
  reponse:
    options:
    - id: a
      texte: Bien qu'elle fût partie avant nous, elle a laissé un message.
    - id: b
      texte: Bien qu'elle fut partie avant nous, elle a laissé un message.
    - id: c
      texte: Bien qu'elle est partie avant nous, elle a laissé un message.
    - id: d
      texte: Bien qu'elle sera partie avant nous, elle a laissé un message.
    bonnes:
    - a
  indices:
    relance: Après « bien que », il faut le subjonctif. Repère les formes qui ne sont pas au subjonctif.
    methode: Le plus-que-parfait du subjonctif s'écrit avec l'auxiliaire à l'imparfait du subjonctif, avec accent circonflexe
      à la 3e personne du singulier.
    etape: Une des formes de l'auxiliaire est écrite sans accent. Elle correspond au passé simple.
  pieges:
  - si:
      contient:
      - b
    relance: 'L''auxiliaire est écrit sans accent : c''est la forme du passé simple, pas celle du subjonctif.'
  - si:
      contient:
      - c
    relance: « est » est du présent de l'indicatif. Après « bien que », il faut le subjonctif.
  - si:
      contient:
      - d
    relance: « sera » est du futur de l'indicatif. Après « bien que », il faut le subjonctif.
  solution: '« qu''elle fût partie » : auxiliaire être à l''imparfait du subjonctif (fût) + participe passé accordé (partie).'
- id: reecrire-subjonctif
  type: ouverte
  difficulte: 3
  enonce: 'Récris la phrase en mettant le verbe entre parenthèses au temps du subjonctif qui convient, puis explique ton choix
    en une phrase : « Le roi ordonna que chacun (venir) devant lui et qu''il (avoir) déjà rendu ses comptes. »'
  criteres:
  - L'élève met « venir » à l'imparfait du subjonctif (qu'il vînt / que chacun vînt) avec l'accent circonflexe.
  - L'élève met « avoir rendu » au plus-que-parfait du subjonctif (qu'il eût rendu).
  - 'L''élève explique son choix : verbe principal au passé, action accomplie avant l''action principale.'
  indices:
    relance: Le verbe principal est au passé simple. Quel temps du subjonctif s'accorde avec lui ?
    methode: Le premier verbe est simultané à l'ordre, le second exprime une action déjà accomplie. Utilise un temps simple,
      puis un temps composé.
    etape: Pour « venir », pars du passé simple « tu vins ». Pour l'action accomplie, utilise l'auxiliaire « avoir » à l'imparfait
      du subjonctif puis le participe passé.
  solution: « Le roi ordonna que chacun vînt devant lui et qu'il eût déjà rendu ses comptes. » Le verbe principal est au passé
    simple, donc on utilise l'imparfait (vînt) ; l'action « rendre ses comptes » est accomplie avant l'action principale,
    donc le plus-que-parfait (eût rendu).
