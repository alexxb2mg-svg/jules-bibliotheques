format: 2
notion: subjonctif-imparfait-plus-que-parfait
version: 2
etat: verifiee
declencheurs:
- il fallait qu'il fût
- accent circonflexe verbe subjonctif
- conjuguer au subjonctif imparfait
- il fallait que tu fisses
- verbe en -ât -ît -ût
- qu'il eût fait
- bien qu'elle fût partie
- concordance des temps du subjonctif
- forme littéraire du subjonctif
prerequis: []
essentiel: 'Le subjonctif a quatre temps : présent, passé, imparfait, plus-que-parfait. L''imparfait et le plus-que-parfait
  du subjonctif appartiennent surtout à la langue écrite soutenue et littéraire. Ils servent à respecter la concordance des
  temps : si le verbe principal est au passé, le verbe au subjonctif est à l''imparfait (« Il fallait qu''il vînt. »).


  Formation de l''imparfait. On part du passé simple à la 2e personne du singulier, on enlève le « s » final, puis on ajoute
  -sse, -sses, -t, -ssions, -ssiez, -ssent. À la 3e personne du singulier, la voyelle finale prend un accent circonflexe (-ât,
  -ît, -ût). Exemples : aimer (tu aimas) → que j''aimasse, qu''il aimât ; finir (tu finis) → qu''il finît ; venir (tu vins)
  → qu''il vînt.


  Verbes du programme, à la 3e personne du singulier : être → qu''il fût ; avoir → qu''il eût ; aller → qu''il allât ; faire
  → qu''il fît ; venir → qu''il vînt ; pouvoir → qu''il pût ; voir → qu''il vît ; vouloir → qu''il voulût ; prendre → qu''il
  prît ; savoir → qu''il sût ; falloir → qu''il fallût ; valoir → qu''il valût ; dire → qu''il dît.


  Conjugaison de être : que je fusse, que tu fusses, qu''il fût, que nous fussions, que vous fussiez, qu''ils fussent. Pour
  avoir : que j''eusse, que tu eusses, qu''il eût, que nous eussions, que vous eussiez, qu''ils eussent.


  Plus-que-parfait. Il se forme avec l''auxiliaire avoir ou être à l''imparfait du subjonctif, suivi du participe passé :
  qu''il eût fait, qu''elle fût partie, qu''ils eussent vu. Il exprime une action accomplie avant l''action principale, dans
  un récit au passé. Avec être, le participe passé s''accorde avec le sujet.


  Piège fréquent : « qu''il fût » (subjonctif, avec accent) ne s''écrit pas comme « il fut » (passé simple, sans accent).
  De même « il eut » (passé simple) et « qu''il eût » (subjonctif).


  Ce qu''on attend au brevet : reconnaître ces formes dans un texte, les écrire correctement (avec l''accent), et expliquer
  leur emploi.

  '
methode:
- 'Repérer le verbe principal : est-il au passé ? Alors le subjonctif sera à l''imparfait ou au plus-que-parfait.'
- Trouver le passé simple à la 2e personne du singulier (tu vins, tu fis, tu pus...).
- 'Enlever le « s » final : c''est le radical du subjonctif imparfait.'
- 'Ajouter la terminaison de la personne : -sse, -sses, -t, -ssions, -ssiez, -ssent.'
- À la 3e personne du singulier, mettre l'accent circonflexe sur la dernière voyelle (-ât, -ît, -ût).
- Pour le plus-que-parfait, mettre l'auxiliaire à l'imparfait du subjonctif, puis ajouter le participe passé (et l'accorder
  avec être).
- 'Vérifier qu''on ne confond pas avec le passé simple : sans accent, c''est le passé simple.'
vocabulaire:
- terme: subjonctif imparfait
  definition: temps du passé du subjonctif, formé sur le radical du passé simple
- terme: subjonctif plus-que-parfait
  definition: 'temps composé du subjonctif : auxiliaire à l''imparfait du subjonctif + participe passé'
- terme: passé simple
  definition: temps du récit au passé, qui exprime des actions achevées (il fut, il eut, il vint)
- terme: concordance des temps
  definition: accord du temps du verbe subordonné avec celui du verbe principal
- terme: accent circonflexe
  definition: signe ^ placé sur une voyelle (ici la dernière voyelle de la 3e personne du singulier)
- terme: auxiliaire
  definition: verbe (être ou avoir) qui sert à former les temps composés
- terme: participe passé
  definition: forme du verbe utilisée après l'auxiliaire dans les temps composés (fait, vu, parti)
- terme: langue soutenue
  definition: façon de parler ou d'écrire très soignée, celle des textes littéraires
erreurs_frequentes:
- Confondre « qu'il fût » (subjonctif imparfait, avec accent) et « il fut » (passé simple, sans accent).
- Oublier l'accent circonflexe à la 3e personne du singulier du subjonctif imparfait.
- Utiliser l'auxiliaire au présent du subjonctif au lieu de l'imparfait pour former le plus-que-parfait.
- Ajouter un « s » à la 3e personne du singulier (« qu'il fût » et non « qu'il fûst »).
- Oublier d'accorder le participe passé avec le sujet quand l'auxiliaire est être (qu'elle fût partie).
exemple:
  enonce: Conjugue le verbe venir au subjonctif imparfait, 3e personne du singulier, dans « Il fallait qu'il ___. »
  solution: '« Il fallait qu''il vînt. » : le radical vient du passé simple « tu vins », on enlève le « s » et on ajoute l''accent
    circonflexe à la 3e personne du singulier.'
exercices:
- id: subjonctif-imparfait-etre
  type: texte_court
  difficulte: 1
  enonce: 'Complète : « Bien qu''il ___ (être) fatigué, il a terminé la course. » (subjonctif imparfait, 3e personne du singulier
    ; écris seulement le verbe conjugué)'
  reponse:
    acceptees:
    - fût
    fautes_tolerees: 0
  indices:
    relance: 'Pense à la 3e personne du singulier du passé simple de « être » : le subjonctif imparfait s''en rapproche, avec
      un signe en plus.'
    methode: Le subjonctif imparfait de être à la 3e personne du singulier prend un accent circonflexe.
    etape: Retrouve la forme du passé simple à cette personne, puis ajoute le signe qui manque pour former le subjonctif.
  pieges:
  - si:
      valeur: fusse
    relance: '« fusse » est la 1re personne du singulier. Ici le sujet est « il » : quelle personne faut-il ?'
  - si:
      valeur: soit
    relance: '« soit » est le présent du subjonctif. Ici, il faut le passé : l''imparfait du subjonctif.'
  solution: '« Bien qu''il fût fatigué » : subjonctif imparfait de être, 3e personne du singulier, avec accent circonflexe.'
- id: subjonctif-imparfait-venir
  type: texte_court
  difficulte: 2
  enonce: 'Complète : « Le professeur souhaitait que l''élève ___ (venir) le voir après le cours. » (subjonctif imparfait,
    3e personne du singulier)'
  reponse:
    acceptees:
    - vînt
    fautes_tolerees: 0
  indices:
    relance: 'Pars du passé simple « tu vins » : enlève le « s » final.'
    methode: Ajoute l'accent circonflexe sur la voyelle finale, comme pour tous les verbes à la 3e personne du singulier de
      ce temps.
    etape: Retrouve le radical du passé simple à cette personne, puis ajoute le signe qui marque le subjonctif imparfait.
  pieges:
  - si:
      valeur: vienne
    relance: '« vienne » est le présent du subjonctif. La phrase demande un temps du passé : l''imparfait du subjonctif.'
  solution: '« que l''élève vînt » : subjonctif imparfait de venir, 3e personne du singulier.'
- id: plus-que-parfait-subjonctif
  type: choix
  difficulte: 2
  enonce: Quelle forme est le plus-que-parfait du subjonctif du verbe faire, 3e personne du singulier ?
  reponse:
    options:
    - id: a
      texte: qu'il eût fait
    - id: b
      texte: qu'il a fait
    - id: c
      texte: qu'il fît
    - id: d
      texte: qu'il eut fait
    bonnes:
    - a
  indices:
    relance: Le plus-que-parfait du subjonctif combine un auxiliaire à l'imparfait du subjonctif et un participe passé.
    methode: L'auxiliaire de « faire » est « avoir ». Cherche sa forme à l'imparfait du subjonctif, 3e personne du singulier.
    etape: L'imparfait du subjonctif de avoir, 3e personne du singulier, est « eût », avec accent circonflexe.
  pieges:
  - si:
      contient:
      - b
    relance: « qu'il a fait » utilise le présent de l'indicatif, pas le subjonctif.
  - si:
      contient:
      - c
    relance: « qu'il fît » est le subjonctif imparfait simple de faire, pas le plus-que-parfait.
  - si:
      contient:
      - d
    relance: « eut » sans accent circonflexe est le passé simple. Le plus-que-parfait du subjonctif demande l'accent circonflexe
      sur « eût ».
  solution: '« qu''il eût fait » : auxiliaire avoir à l''imparfait du subjonctif (eût) + participe passé (fait).'
- id: distinguer-passe-simple-subjonctif
  type: association
  difficulte: 3
  enonce: Associe chaque forme à son temps.
  reponse:
    gauche:
    - id: a
      texte: il alla
    - id: b
      texte: qu'il allât
    - id: c
      texte: qu'il eût vu
    droite:
    - id: x
      texte: passé simple
    - id: y
      texte: subjonctif imparfait
    - id: z
      texte: subjonctif plus-que-parfait
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Cherche d''abord la forme sans accent circonflexe : c''est le passé simple.'
    methode: Une forme simple avec accent circonflexe est un subjonctif imparfait ; une forme composée avec auxiliaire et
      participe passé est un subjonctif plus-que-parfait.
    etape: '« il alla » n''a pas d''accent : passé simple. « qu''il allât » a un accent : subjonctif imparfait.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Regarde bien si la forme est simple ou composée, et si elle porte un accent
      circonflexe.
  - si:
      diagnostic: associations_fausses
    relance: Classe d'abord la forme composée (avec auxiliaire + participe passé), puis distingue les deux formes simples
      par l'accent.
  solution: « il alla » est un passé simple ; « qu'il allât » est un subjonctif imparfait (avec accent) ; « qu'il eût vu »
    est un subjonctif plus-que-parfait (auxiliaire + participe passé).
- id: nblm-sur-quel-temps-de-l-indicatif-se-forme-l-1
  type: choix
  difficulte: 2
  enonce: Sur quel temps de l'indicatif se forme le radical du subjonctif imparfait ?
  reponse:
    options:
    - id: o1
      texte: Le passé simple
    - id: o2
      texte: Le présent de l'indicatif
    - id: o3
      texte: L'imparfait de l'indicatif
    - id: o4
      texte: Le futur simple
    bonnes:
    - o1
  indices:
    relance: Pense au temps du passé utilisé pour les actions ponctuelles et à la deuxième personne du singulier (tu).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le présent sert de base pour former le subjonctif présent, et non le subjonctif imparfait.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le futur simple sert de base pour le conditionnel présent, pas pour le subjonctif imparfait.'
  solution: 'Le passé simple. C''est exact : le radical du subjonctif imparfait s''obtient à partir de la 2e personne du singulier
    du passé simple sans le « s » final.'
- id: nblm-dans-la-phrase-il-fallait-qu-il-present-2
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Il fallait qu'il ___ présent », quelle est la forme correcte du verbe être au subjonctif imparfait
