format: 2
notion: subjonctif-imparfait-plus-que-parfait
version: 1
etat: verifiee
declencheurs:
- il fallait qu'il fût
- accent circonflexe verbe subjonctif
- conjuguer au subjonctif imparfait
prerequis: []
essentiel: 'L''imparfait du subjonctif se forme à partir du passé simple : on prend la 2e personne du singulier du

  passé simple, on enlève le « s » final, puis on ajoute les terminaisons -sse, -sses, ^t, -ssions,

  -ssiez, -ssent. À la 3e personne du singulier, on met un accent circonflexe sur la dernière voyelle.


  Exemples à la 3e personne du singulier : qu''il fût (être), qu''il eût (avoir), qu''il fît (faire), qu''il

  allât (aller), qu''il vînt (venir), qu''il pût (pouvoir), qu''il vît (voir), qu''il voulût (vouloir), qu''il

  prît (prendre), qu''il sût (savoir), qu''il fallût (falloir), qu''il valût (valoir), qu''il dît (dire).


  Le plus-que-parfait du subjonctif se forme avec l''auxiliaire être ou avoir à l''imparfait du subjonctif,

  suivi du participe passé : qu''il eût fait, qu''elle fût partie, qu''ils eussent vu.


  Piège fréquent : « qu''il fût » (subjonctif imparfait, avec accent) ne s''écrit pas comme « il fut »

  (passé simple, sans accent). Le sens et le contexte (après « il fallait que », « bien qu''il... ») aident à choisir.

  '
methode:
- Cherche la 2e personne du singulier du passé simple du verbe.
- 'Enlève le « s » final : c''est le radical du subjonctif imparfait.'
- Ajoute la terminaison qui convient à la personne, avec un accent circonflexe à la 3e personne du singulier.
- Pour le plus-que-parfait, conjugue l'auxiliaire à l'imparfait du subjonctif, puis ajoute le participe passé.
vocabulaire:
- terme: subjonctif imparfait
  definition: temps du passé du subjonctif, formé sur le radical du passé simple
- terme: subjonctif plus-que-parfait
  definition: 'temps composé du subjonctif : auxiliaire à l''imparfait du subjonctif + participe passé'
erreurs_frequentes:
- Confondre « qu'il fût » (subjonctif imparfait, avec accent) et « il fut » (passé simple, sans accent).
- Oublier l'accent circonflexe à la 3e personne du singulier du subjonctif imparfait.
- Utiliser l'auxiliaire au présent du subjonctif au lieu de l'imparfait pour former le plus-que-parfait.
exemple:
  enonce: Conjugue le verbe venir au subjonctif imparfait, 3e personne du singulier, dans « Il fallait qu'il ___. »
  solution: '« Il fallait qu''il vînt. » : le radical vient du passé simple « tu vins », on enlève le « s » et on ajoute l''accent
    circonflexe à la 3e personne du singulier.'
exercices:
- id: subjonctif-imparfait-etre
  type: texte_court
  difficulte: 1
  enonce: 'Complète : « Bien qu''il ___ (être) fatigué, il a terminé la course. » (subjonctif imparfait, 3e personne du singulier
    ; écris seulement le verbe conjugué)'
  reponse:
    acceptees:
    - fût
    fautes_tolerees: 0
  indices:
    relance: 'Pense à la 3e personne du singulier du passé simple de « être » : le subjonctif imparfait s''en rapproche, avec
      un signe en plus.'
    methode: Le subjonctif imparfait de être à la 3e personne du singulier prend un accent circonflexe.
    etape: Retrouve la forme du passé simple à cette personne, puis ajoute le signe qui manque pour former le subjonctif.
  pieges:
  - si:
      valeur: fusse
    relance: '« fusse » est la 1re personne du singulier. Ici le sujet est « il » : quelle personne faut-il ?'
  - si:
      valeur: soit
    relance: '« soit » est le présent du subjonctif. Ici, il faut le passé : l''imparfait du subjonctif.'
  solution: '« Bien qu''il fût fatigué » : subjonctif imparfait de être, 3e personne du singulier, avec accent circonflexe.'
- id: subjonctif-imparfait-venir
  type: texte_court
  difficulte: 2
  enonce: 'Complète : « Le professeur souhaitait que l''élève ___ (venir) le voir après le cours. » (subjonctif imparfait,
    3e personne du singulier)'
  reponse:
    acceptees:
    - vînt
    fautes_tolerees: 0
  indices:
    relance: 'Pars du passé simple « tu vins » : enlève le « s » final.'
    methode: Ajoute l'accent circonflexe sur la voyelle finale, comme pour tous les verbes à la 3e personne du singulier de
      ce temps.
    etape: Retrouve le radical du passé simple à cette personne, puis ajoute le signe qui marque le subjonctif imparfait.
  pieges:
  - si:
      valeur: vienne
    relance: '« vienne » est le présent du subjonctif. La phrase demande un temps du passé : l''imparfait du subjonctif.'
  solution: '« que l''élève vînt » : subjonctif imparfait de venir, 3e personne du singulier.'
- id: plus-que-parfait-subjonctif
  type: choix
  difficulte: 2
  enonce: Quelle forme est le plus-que-parfait du subjonctif du verbe faire, 3e personne du singulier ?
  reponse:
    options:
    - id: a
      texte: qu'il eût fait
    - id: b
      texte: qu'il a fait
    - id: c
      texte: qu'il fît
    - id: d
      texte: qu'il eut fait
    bonnes:
    - a
  indices:
    relance: Le plus-que-parfait du subjonctif combine un auxiliaire à l'imparfait du subjonctif et un participe passé.
    methode: L'auxiliaire de « faire » est « avoir ». Cherche sa forme à l'imparfait du subjonctif, 3e personne du singulier.
    etape: L'imparfait du subjonctif de avoir, 3e personne du singulier, est « eût », avec accent circonflexe.
  pieges:
  - si:
      contient:
      - b
    relance: « qu'il a fait » utilise le présent de l'indicatif, pas le subjonctif.
  - si:
      contient:
      - c
    relance: « qu'il fît » est le subjonctif imparfait simple de faire, pas le plus-que-parfait.
  - si:
      contient:
      - d
    relance: « eut » sans accent circonflexe est le passé simple. Le plus-que-parfait du subjonctif demande l'accent circonflexe
      sur « eût ».
  solution: '« qu''il eût fait » : auxiliaire avoir à l''imparfait du subjonctif (eût) + participe passé (fait).'
- id: distinguer-passe-simple-subjonctif
  type: association
  difficulte: 3
  enonce: Associe chaque forme à son temps.
  reponse:
    gauche:
    - id: a
      texte: il alla
    - id: b
      texte: qu'il allât
    - id: c
      texte: qu'il eût vu
    droite:
    - id: x
      texte: passé simple
    - id: y
      texte: subjonctif imparfait
    - id: z
      texte: subjonctif plus-que-parfait
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Cherche d''abord la forme sans accent circonflexe : c''est le passé simple.'
    methode: Une forme simple avec accent circonflexe est un subjonctif imparfait ; une forme composée avec auxiliaire et
      participe passé est un subjonctif plus-que-parfait.
    etape: '« il alla » n''a pas d''accent : passé simple. « qu''il allât » a un accent : subjonctif imparfait.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Regarde bien si la forme est simple ou composée, et si elle porte un accent
      circonflexe.
  - si:
      diagnostic: associations_fausses
    relance: Classe d'abord la forme composée (avec auxiliaire + participe passé), puis distingue les deux formes simples
      par l'accent.
  solution: « il alla » est un passé simple ; « qu'il allât » est un subjonctif imparfait (avec accent) ; « qu'il eût vu »
    est un subjonctif plus-que-parfait (auxiliaire + participe passé).
- id: nblm-sur-quel-temps-de-l-indicatif-se-forme-l-1
  type: choix
  difficulte: 2
  enonce: Sur quel temps de l'indicatif se forme le radical du subjonctif imparfait ?
  reponse:
    options:
    - id: o1
      texte: Le passé simple
    - id: o2
      texte: Le présent de l'indicatif
    - id: o3
      texte: L'imparfait de l'indicatif
    - id: o4
      texte: Le futur simple
    bonnes:
    - o1
  indices:
    relance: Pense au temps du passé utilisé pour les actions ponctuelles et à la deuxième personne du singulier (tu).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le présent sert de base pour former le subjonctif présent, et non le subjonctif imparfait.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le futur simple sert de base pour le conditionnel présent, pas pour le subjonctif imparfait.'
  solution: 'Le passé simple. C''est exact : le radical du subjonctif imparfait s''obtient à partir de la 2e personne du singulier
    du passé simple sans le « s » final.'
- id: nblm-dans-la-phrase-il-fallait-qu-il-present-2
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Il fallait qu'il ___ présent », quelle est la forme correcte du verbe être au subjonctif imparfait
    ?
  reponse:
    options:
    - id: o1
      texte: fût
    - id: o2
      texte: fut
    - id: o3
      texte: soit
    - id: o4
      texte: fûtes
    bonnes:
    - o1
  indices:
    relance: La 3e personne du singulier du subjonctif imparfait se distingue du passé simple par un signe diacritique sur
      sa voyelle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « soit » est le subjonctif présent, alors que la concordance des temps au passé exige le subjonctif
      imparfait.'
  solution: 'fût. C''est exact : à la 3e personne du singulier du subjonctif imparfait, le verbe être prend un accent circonflexe
    sur le u (qu''il fût).'
- id: nblm-comment-s-orthographie-le-verbe-venir-a-3
  type: choix
  difficulte: 2
  enonce: Comment s'orthographie le verbe venir à la 3e personne du singulier du subjonctif imparfait dans « Il fallait qu'il
    ___ » ?
  reponse:
    options:
    - id: o1
      texte: vînt
    - id: o2
      texte: vienne
    - id: o3
      texte: vint
    - id: o4
      texte: venait
    bonnes:
    - o1
  indices:
    relance: Le radical provient du passé simple « tu vins » auquel on applique la marque spécifique du subjonctif à la 3e
      personne du singulier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : « vienne » est le subjonctif présent du verbe venir.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « venait » est l''imparfait de l''indicatif.'
  solution: 'vînt. C''est exact : à partir de « tu vins » au passé simple, on enlève le « s » et on ajoute l''accent circonflexe
    sur le i (qu''il vînt).'
- id: nblm-quelle-est-la-regle-de-formation-du-subj-4
  type: choix
  difficulte: 2
  enonce: Quelle est la règle de formation du subjonctif plus-que-parfait ?
  reponse:
    options:
    - id: o1
      texte: Auxiliaire être ou avoir au subjonctif imparfait + participe passé du verbe
    - id: o2
      texte: Auxiliaire être ou avoir au subjonctif présent + participe passé du verbe
    - id: o3
      texte: Auxiliaire être ou avoir à l'imparfait de l'indicatif + participe passé du verbe
    - id: o4
      texte: Radical du passé simple + terminaisons de l'imparfait de l'indicatif
    bonnes:
    - o1
  indices:
    relance: Il s'agit d'un temps composé dont l'auxiliaire est conjugué au temps simple du passé du même mode.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : cette structure forme le passé du subjonctif (ex. qu''il ait fait).'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : cette combinaison donne le plus-que-parfait de l''indicatif (ex. il avait fait).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ceci ne correspond pas à la formation d''un temps composé du subjonctif.'
  solution: 'Auxiliaire être ou avoir au subjonctif imparfait + participe passé du verbe. C''est exact : le subjonctif plus-que-parfait
    combine l''auxiliaire au subjonctif imparfait (ex. eût, fût) et le participe passé.'
- id: nblm-parmi-les-formes-suivantes-du-verbe-voul-5
  type: choix
  difficulte: 2
  enonce: Parmi les formes suivantes du verbe vouloir à la 3e personne du singulier du subjonctif imparfait, laquelle est
    correcte ?
  reponse:
    options:
    - id: o1
      texte: qu'il voulût
    - id: o2
      texte: qu'il voulut
    - id: o3
      texte: qu'il voulisse
    - id: o4
      texte: qu'il voulât
    bonnes:
    - o1
  indices:
    relance: Partant du passé simple « tu voulus », la voyelle de la terminaison conserve le son u.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : « voulut » sans accent circonflexe est la forme du passé simple de l''indicatif.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : cette forme invente une terminaison incorrecte au lieu de suivre la règle basée sur le passé
      simple.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « -ât » est la terminaison des verbes du 1er groupe, pas du verbe vouloir.'
  solution: 'qu''il voulût. C''est exact : le verbe vouloir fait « qu''il voulût » au subjonctif imparfait avec l''accent
    circonflexe sur le u.'
- id: nblm-quelles-sont-les-deux-formes-verbales-co-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux formes verbales correctement conjuguées au subjonctif plus-que-parfait ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: qu'il eût fait
    - id: o2
      texte: qu'elle fût partie
    - id: o3
      texte: qu'il ait fait
    - id: o4
      texte: qu'elle était partie
    bonnes:
    - o1
    - o2
  indices:
    relance: Repère les options où l'auxiliaire porte l'accent circonflexe caractéristique du subjonctif imparfait.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « ait fait » est au passé du subjonctif car l''auxiliaire est au présent du subjonctif.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « était partie » est au plus-que-parfait de l''indicatif.'
  solution: 'qu''il eût fait ; qu''elle fût partie. C''est juste : l''auxiliaire avoir est au subjonctif imparfait (eût) suivi
    du participe passé (fait).'
- id: nblm-complete-la-phrase-au-subjonctif-imparfa-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase au subjonctif imparfait : « Il fallait qu''il ___ du courage. » (verbe avoir)'
  reponse:
    acceptees:
    - eût
    fautes_tolerees: 1
  indices:
    relance: La forme dérive de « tu eus » au passé simple et prend un accent circonflexe à la 3e personne du singulier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'eût. C''est exact : à la 3e personne du singulier du subjonctif imparfait, le verbe avoir s''écrit « eût » avec
    un accent circonflexe sur le u.'
- id: nblm-complete-au-subjonctif-plus-que-parfait-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète au subjonctif plus-que-parfait (3e personne du pluriel) : « Bien qu''ils ___ ce film, ils sont revenus
    au cinéma. » (verbe voir)'
  reponse:
    acceptees:
    - eussent vu
    fautes_tolerees: 1
  indices:
    relance: Conjugue l'auxiliaire avoir à la 3e personne du pluriel du subjonctif imparfait puis ajoute le participe passé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'eussent vu. C''est exact : « eussent » (auxiliaire avoir au subjonctif imparfait) + « vu » (participe passé de
    voir) forme le subjonctif plus-que-parfait.'
