- id: nblm-quelle-est-la-regle-de-formation-du-subj-4
  type: choix
  difficulte: 2
  enonce: Quelle est la règle de formation du subjonctif plus-que-parfait ?
  reponse:
    options:
    - id: o1
      texte: Auxiliaire être ou avoir au subjonctif imparfait + participe passé du verbe
    - id: o2
      texte: Auxiliaire être ou avoir au subjonctif présent + participe passé du verbe
    - id: o3
      texte: Auxiliaire être ou avoir à l'imparfait de l'indicatif + participe passé du verbe
    - id: o4
      texte: Radical du passé simple + terminaisons de l'imparfait de l'indicatif
    bonnes:
    - o1
  indices:
    relance: Il s'agit d'un temps composé dont l'auxiliaire est conjugué au temps simple du passé du même mode.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
