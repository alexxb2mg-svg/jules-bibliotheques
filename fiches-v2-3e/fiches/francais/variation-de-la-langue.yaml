format: 2
notion: variation-de-la-langue
version: 2
etat: verifiee
declencheurs:
- mot qui a changé de sens
- mot venu d'une autre langue
- façon de parler selon la région
- mot inventé récemment
- langage des jeunes ou soutenu
- mot anglais dans le français
- sms et langage écrit
- le sens d'un mot a évolué
prerequis: []
essentiel: 'La langue française change selon le temps, le lieu, la situation et le moyen de communication. C''est la variation
  linguistique. Une même idée peut s''exprimer de plusieurs manières.


  Selon les époques, le sens des mots évolue. « Gentil » signifiait autrefois « noble, de bonne famille » ; il veut dire aujourd''hui
  « aimable ». Un mot peut aussi disparaître ou prendre un sens plus large ou plus étroit.


  La néologie est la création de mots nouveaux (néologismes) pour nommer une réalité nouvelle : « covoiturage », « ordinateur
  », « courriel ». On les forme par dérivation, composition, ou en détournant le sens d''un mot existant.


  L''emprunt est un mot pris à une autre langue et adopté en français. « Week-end » vient de l''anglais, « pizza » de l''italien,
  « sucre » de l''arabe. Certains emprunts prennent la forme du français, d''autres gardent leur graphie d''origine.


  La langue varie selon le lieu : les mots régionaux (« chocolatine » ou « pain au chocolat », « septante » ou « soixante-dix
  » en Belgique et en Suisse) et selon les pays francophones.


  Elle varie selon le contexte. On distingue trois niveaux : familier (« bagnole »), courant (« voiture »), soutenu (« automobile
  »). On choisit son niveau de langue selon la situation et l''interlocuteur.


  Elle varie enfin selon le moyen de communication : à l''oral, on hésite, on coupe les phrases ; dans un message écrit, on
  abrège parfois ; dans un écrit formel, on soigne la syntaxe et le vocabulaire.


  Au brevet, on demande d''identifier un emprunt, un néologisme ou un niveau de langue, et de dire ce que la variation montre.

  '
methode:
- Repère le mot ou la tournure qui varie (sens, origine, forme).
- 'Demande-toi : est-ce un mot nouveau (néologisme), venu d''une autre langue (emprunt) ou dont le sens a changé ?'
- 'Identifie le niveau de langue : familier, courant ou soutenu.'
- Cherche l'indice du lieu (mot régional) ou du moyen de communication (oral, message, texte formel).
- 'Explique ce que la variation apporte : précision, effet, adaptation au destinataire.'
vocabulaire:
- terme: variation linguistique
  definition: changement de la langue selon l'époque, le lieu, la situation ou le moyen de communication
- terme: néologisme
  definition: mot nouveau créé pour nommer une réalité nouvelle
- terme: emprunt
  definition: mot venu d'une autre langue et adopté par le français
- terme: niveau de langue
  definition: 'manière de parler ou d''écrire : familier, courant ou soutenu'
- terme: régionalisme
  definition: mot ou expression propre à une région
- terme: évolution du sens
  definition: changement de signification d'un mot au fil du temps
- terme: registre familier
  definition: langue de la conversation entre proches, avec des mots relâchés
erreurs_frequentes:
- Croire qu'un mot garde toujours le sens qu'il avait autrefois.
- Confondre néologisme (mot créé) et emprunt (mot pris à une autre langue).
- 'Juger qu''un niveau de langue est « mauvais » : chaque niveau convient à une situation.'
- Penser que la variation ne concerne que l'oral.
exemple:
  enonce: Le mot « ordinateur » a été créé en 1955 pour nommer une machine qui n'existait pas avant. Comment appelle-t-on
    ce type de mot nouveau ?
  solution: 'C''est un néologisme : un mot créé pour nommer une réalité nouvelle, ici une machine qui n''existait pas avant
    les années 1950.'
exercices:
- id: type-covoiturage
  type: choix
  difficulte: 1
  enonce: Le mot « covoiturage » a été créé récemment pour désigner le fait de partager un trajet en voiture. Comment appelle-t-on
    ce type de mot ?
  reponse:
    options:
    - id: a
      texte: un néologisme
    - id: b
      texte: un emprunt
    - id: c
      texte: une expression figée
    bonnes:
    - a
  indices:
    relance: 'Ce mot n''existe pas depuis toujours : il a été inventé pour nommer une pratique récente.'
    methode: Demande-toi si ce mot vient d'une autre langue, ou s'il a simplement été créé en français.
    etape: « Covoiturage » vient d'un mot français, il n'a pas été pris à une autre langue.
  pieges:
  - si:
      contient:
      - b
    relance: Un emprunt vient d'une autre langue (comme « week-end », emprunté à l'anglais). « Covoiturage » a-t-il été pris
      ailleurs, ou créé en français ?
  - si:
      contient:
      - c
    relance: Une expression figée est un groupe de mots au sens imagé. « Covoiturage » est-il un seul mot ou un groupe de
      mots ?
  solution: '« Covoiturage » est un néologisme : un mot nouveau, créé en français pour nommer une pratique récente, le partage
    d''un trajet en voiture.'
- id: origine-weekend
  type: texte_court
  difficulte: 1
  enonce: De quelle langue vient le mot français « week-end » ?
  reponse:
    acceptees:
    - anglais
    fautes_tolerees: 1
  indices:
    relance: 'Ce mot désigne la fin de la semaine, samedi et dimanche : il n''a pas toujours existé en français.'
    methode: 'Écoute la prononciation du mot : elle ne suit pas les règles habituelles du français.'
    etape: C'est la langue la plus parlée dans le monde des affaires et d'Internet aujourd'hui.
  pieges:
  - si:
      valeur: espagnol
    relance: Ce n'est pas cette langue. Pense à la langue parlée au Royaume-Uni et aux États-Unis.
  solution: « Week-end » est un emprunt à l'anglais, intégré tel quel dans la langue française courante pour désigner samedi
    et dimanche.
- id: registres-langue
  type: association
  difficulte: 2
  enonce: Associe chaque phrase à son registre de langue.
  reponse:
    gauche:
    - id: a
      texte: Puis-je vous demander votre attention, s'il vous plaît ?
    - id: b
      texte: Tu peux m'écouter deux minutes ?
    - id: c
      texte: Tu m'écoutes ou pas, là ?
    droite:
    - id: x
      texte: langue soutenue
    - id: y
      texte: langue courante
    - id: z
      texte: langue familière
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Observe la politesse des formules employées et la construction des phrases.
    methode: La phrase la plus soignée utilise des formules de politesse longues ; la plus relâchée utilise des mots courts
      et directs.
    etape: « Puis-je vous demander » est une formule très polie, typique de l'écrit ou de l'oral très formel.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère d'abord la phrase la plus polie, puis la plus directe.
  - si:
      diagnostic: associations_fausses
    relance: Classe les trois phrases de la plus polie à la plus relâchée avant de les associer.
  solution: « Puis-je vous demander... » est en langue soutenue, « Tu peux m'écouter... » en langue courante, « Tu m'écoutes
    ou pas, là ? » en langue familière.
- id: sens-gentil-evolution
  type: ouverte
  difficulte: 3
  enonce: Le mot « gentil » signifiait autrefois « noble », « de bonne famille ». Aujourd'hui il signifie « aimable ». Explique
    en deux phrases ce que montre cet exemple sur la langue.
  criteres:
  - L'élève dit que le sens d'un mot peut changer avec le temps (évolution du sens).
  - L'élève donne les deux sens du mot « gentil » (ancien et actuel) pour illustrer son propos.
  indices:
    relance: Le sens d'un mot est-il toujours resté identique depuis le Moyen Âge ?
    methode: 'Compare le sens ancien (noble) et le sens actuel (aimable) : que s''est-il passé entre les deux ?'
    etape: Tu peux commencer par « Cet exemple montre que le sens d'un mot peut évoluer avec le temps... ».
  solution: 'Cet exemple montre que le sens des mots évolue avec le temps : « gentil » signifiait « noble » au Moyen Âge,
    et désigne aujourd''hui une personne aimable. La langue n''est donc pas figée, elle change d''une époque à l''autre.'
- id: distinguer-emprunt-neologisme
  type: choix
  difficulte: 2
  enonce: Parmi ces mots, lequel est un emprunt à l'anglais ?
  reponse:
    options:
    - id: a
      texte: week-end
    - id: b
      texte: covoiturage
    - id: c
      texte: ordinateur
    - id: d
      texte: courriel
    bonnes:
    - a
  indices:
    relance: Un emprunt est un mot pris tel quel ou presque à une langue étrangère.
    methode: Les autres mots ont été fabriqués en français à partir de mots français.
    etape: 'Un seul mot n''a pas l''allure d''un mot fabriqué en français : il désigne la fin de la semaine.'
  pieges:
  - si:
      contient:
      - b
    relance: '« covoiturage » est formé de mots français : c''est un néologisme.'
  - si:
      contient:
      - c
    relance: '« ordinateur » a été créé en français : c''est un néologisme.'
  - si:
      contient:
      - d
    relance: '« courriel » est un mot créé pour éviter l''anglais : c''est un néologisme.'
  solution: « week-end » est un emprunt à l'anglais. Les trois autres sont des néologismes créés en français.
- id: niveau-de-langue-voiture
  type: texte_court
  difficulte: 1
  enonce: « Bagnole » est un synonyme familier de « voiture ». Quel niveau de langue est « voiture » ? (un mot)
  reponse:
    acceptees:
    - courant
    - courante
    fautes_tolerees: 1
  indices:
    relance: Il existe trois niveaux de langue. Lequel est neutre, employé dans la plupart des situations ?
    methode: « Voiture » s'emploie dans la plupart des situations, sans être relâché ni recherché.
    etape: 'Ce n''est ni le plus relâché ni le plus recherché : c''est le niveau du milieu.'
  pieges:
  - si:
      valeur: familier
    relance: « familier » correspond à « bagnole ». Pour « voiture », choisis le niveau neutre.
  solution: « voiture » est du niveau de langue courant ; « bagnole » est familier et « automobile » plus soutenu.
- id: variation-oral-ecrit
  type: ouverte
  difficulte: 3
  enonce: 'Écris la même demande (demander à un ami de te prêter un livre) de deux façons : dans un message rapide à un ami,
    puis dans un courrier à ton professeur. Explique en deux phrases ce qui change.'
  criteres:
  - Les deux messages expriment la même demande avec des niveaux de langue nettement différents (familier ou courant, puis
    soutenu ou courant soigné).
  - L'élève explique que le contexte et le destinataire justifient le choix du niveau de langue.
  - L'expression reste correcte dans le courrier au professeur (syntaxe soignée, formule de politesse).
  indices:
    relance: 'Imagine la personne à qui tu écris : un ami ou un adulte. Le ton doit changer.'
    methode: Pour l'ami, utilise des mots simples ou familiers. Pour le professeur, une phrase complète avec une formule de
      politesse.
    etape: Commence par « Salut, tu peux me... » pour l'ami, puis « Madame, pourriez-vous... » pour le courrier.
  solution: 'Exemple : à un ami, « Salut ! Tu peux me passer ton bouquin ? » ; au professeur, « Madame, pourriez-vous me prêter
    ce livre, s''il vous plaît ? » Le destinataire et la situation justifient le niveau de langue.'
