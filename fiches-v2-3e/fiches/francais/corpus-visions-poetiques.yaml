# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: corpus-visions-poetiques
version: 1
etat: verifiee
declencheurs:
- groupement de poèmes sur la nature
- poème et tableau de paysage
- prose poétique moderne
prerequis:
- poesie-romantisme-a-nos-jours
essentiel: 'Un corpus de référence sur les visions poétiques du monde réunit des poèmes ou des textes de prose poétique,

  du romantisme à nos jours, pour montrer la diversité des façons de voir et de dire le monde.

  La prose poétique est un texte écrit en phrases ordinaires, sans découpage en vers, mais qui garde des effets

  poétiques : images fortes, rythme particulier, choix précis des mots.

  Ces textes appartiennent à des esthétiques différentes : certains décrivent la nature avec précision,

  d''autres cherchent plutôt à exprimer une émotion ou une inquiétude face au monde.

  Le corpus peut aussi intégrer des tableaux représentant des paysages, pour comparer comment peintres et poètes

  disent, chacun à leur manière, leur rapport au monde.

  Comparer plusieurs poèmes de siècles différents permet de voir comment la vision de la nature change :

  célébration, inquiétude, ou simple observation, selon l''époque et l''auteur.

  '
methode:
- Repérer si le texte est en vers ou en prose poétique, et observer ses effets propres (rythme, images).
- Situer chaque poème dans son siècle, pour comprendre l'évolution des visions du monde.
- 'Comparer un poème à un tableau de paysage du même corpus : que disent-ils tous deux de la nature ?'
- Identifier le sentiment ou l'idée du monde que chaque texte propose au lecteur.
vocabulaire:
- terme: prose poétique
  definition: texte écrit en phrases, sans vers, mais qui garde des effets poétiques (images, rythme)
- terme: esthétique
  definition: manière propre à un auteur ou une époque de créer et de faire ressentir la beauté
erreurs_frequentes:
- Croire que la poésie est toujours écrite en vers réguliers avec des rimes, alors que la prose poétique existe aussi.
- Étudier chaque poème isolément sans jamais comparer les visions du monde qu'ils proposent.
- Réduire un poème sur la nature à une simple description, sans chercher le sentiment ou l'idée exprimés.
exemple:
  enonce: Explique en une phrase ce qu'est la prose poétique.
  solution: C'est un texte écrit en phrases ordinaires, sans être découpé en vers, mais qui garde des effets poétiques comme
    des images fortes ou un rythme particulier.
exercices:
- id: definir-prose-poetique
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que la prose poétique ?
  reponse:
    options:
    - id: a
      texte: Un texte écrit en phrases, sans vers, mais qui garde des effets poétiques
    - id: b
      texte: Un poème obligatoirement écrit avec des rimes
    - id: c
      texte: Un texte scientifique qui décrit un phénomène naturel
    - id: d
      texte: Une lettre envoyée à un ami
    bonnes:
    - a
  indices:
    relance: Ce texte ressemble à de la prose ordinaire, mais il garde des images et un rythme comme un poème.
    methode: Élimine les définitions qui parlent de vers obligatoires ou de textes non littéraires.
    etape: 'La bonne réponse combine deux idées : l''absence de vers et la présence d''effets poétiques.'
  pieges:
  - si:
      contient:
      - b
    relance: 'La prose poétique n''est justement pas écrite en vers avec des rimes : c''est un texte en phrases.'
  - si:
      contient:
      - c
    relance: Un texte scientifique ne cherche pas les mêmes effets qu'un texte poétique.
  - si:
      contient:
      - d
    relance: Une lettre n'est pas nécessairement un texte poétique. Cherche la définition qui parle d'effets poétiques.
  solution: La prose poétique est un texte écrit en phrases, sans vers, mais qui garde des effets poétiques comme des images
    ou un rythme particulier.
- id: comparer-art-poesie
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne une oeuvre peinte qui représente la nature, souvent comparée à un poème dans ce corpus ?
  reponse:
    acceptees:
    - paysage
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne un tableau qui montre un lieu naturel, une campagne, une mer ou une montagne.
    methode: Cherche le mot qui désigne une peinture représentant la nature ou un lieu, pas un portrait de personne.
    etape: Le mot est court et désigne aussi bien un tableau qu'une vue réelle de la nature.
  pieges:
  - si:
      valeur: portrait
    relance: Un portrait représente une personne, pas un lieu naturel. Cherche un autre mot, celui qui désigne une vue de
      la nature.
  - si:
      valeur: nature morte
    relance: Une nature morte représente des objets sur une table, pas une vue de la campagne ou de la mer. Cherche un autre
      mot.
  solution: 'Le mot est paysage : un tableau qui représente la nature, comparé aux poèmes du corpus.'
- id: ordre-siecles-poesie
  type: ordre
  difficulte: 2
  enonce: Range ces trois moments poétiques du plus ancien au plus récent.
  reponse:
    elements:
    - id: romantisme
      texte: Un poème romantique du début du XIXe siècle
    - id: symbolisme
      texte: Un poème symboliste de la fin du XIXe siècle
    - id: contemporain
      texte: Un poème contemporain d'aujourd'hui
  indices:
    relance: Le romantisme est le mouvement le plus ancien des trois. Quel est le plus récent ?
    methode: Range d'abord le poème le plus ancien (début du XIXe siècle), puis celui de la fin du XIXe siècle, puis le plus
      récent.
    etape: Le romantisme précède le symbolisme, qui précède lui-même la poésie contemporaine.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux moments voisins sont inversés. Lequel des deux vient en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le poème le plus ancien, puis le plus récent.
  solution: Le romantisme vient en premier (début du XIXe siècle), puis le symbolisme (fin du XIXe siècle), puis la poésie
    contemporaine.
- id: forme-et-effet
  type: association
  difficulte: 2
  enonce: Associe chaque forme de texte à un effet qu'elle produit le plus souvent.
  reponse:
    gauche:
    - id: a
      texte: Le vers régulier avec des rimes
    - id: b
      texte: La prose poétique
    - id: c
      texte: Le tableau de paysage
    droite:
    - id: x
      texte: Un rythme marqué et musical
    - id: y
      texte: Des images fortes sans découpage en vers
    - id: z
      texte: Une vision du monde donnée par la couleur et la composition
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces trois éléments est fait de vers et de rimes, un autre de phrases sans vers, le dernier est une image
      peinte.
    methode: Associe d'abord le vers régulier à son effet musical, puis la prose poétique, puis le tableau.
    etape: Le vers régulier a un rythme musical marqué ; la prose poétique garde des images sans vers ; le tableau donne une
      vision par la couleur.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la différence entre vers régulier et prose poétique.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque forme un par un, en te demandant si c'est un texte en vers, un texte en prose, ou une image peinte.
  solution: Le vers régulier produit un rythme musical marqué, la prose poétique garde des images fortes sans vers, le tableau
    de paysage donne une vision du monde par la couleur et la composition.
- id: comparer-deux-poemes
  type: ouverte
  difficulte: 3
  enonce: Choisis deux poèmes de siècles différents étudiés en classe et explique en quoi leur vision de la nature diffère.
  criteres:
  - L'élève cite deux poèmes ou poètes précis, de siècles différents.
  - L'élève décrit la vision du monde ou de la nature de chaque poème (célébration, inquiétude, observation...).
  - L'élève montre une différence claire entre les deux visions.
  indices:
    relance: Un des poèmes célèbre-t-il la nature avec joie, tandis que l'autre exprime plutôt une inquiétude ou une tristesse
      ?
    methode: Décris d'abord la vision du premier poème, puis celle du second, et compare les deux.
    etape: Tu peux commencer ainsi « Le premier poème montre..., tandis que le second... ».
  solution: Par exemple, un poème romantique peut célébrer la nature comme un refuge apaisant pour le poète, tandis qu'un
    poème plus contemporain peut au contraire montrer une nature menacée ou inquiétante, ce qui montre que la vision du monde
    change selon les époques.
- id: nblm-qu-est-ce-que-la-prose-poetique-moderne-1
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que la prose poétique moderne étudiée dans le corpus des visions poétiques du monde ?
  reponse:
    options:
    - id: o1
      texte: Un texte écrit en phrases ordinaires, sans vers, mais qui conserve des effets poétiques (images, rythme).
    - id: o2
      texte: Un poème obligatoirement composé de vers réguliers et de rimes embrassées.
    - id: o3
      texte: Une description documentaire et neutre d'un paysage naturel sans émotion.
    - id: o4
      texte: Un texte de théâtre composé exclusivement de dialogues et de didascalies.
    bonnes:
    - o1
  indices:
    relance: 'Pense à la forme du texte : est-il structuré en vers ou rédigé sous forme de phrases ordinaires ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la prose poétique n''est justement pas découpée en vers et ne comporte pas de rimes régulières.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : réduire la poésie à une simple description neutre oublie la sensibilité et la vision du poète.'
  - si:
      contient:
      - o4
    relance: 'Confusion de genre : les dialogues et didascalies appartiennent au genre théâtral, pas à la poésie en prose.'
  solution: 'Un texte écrit en phrases ordinaires, sans vers, mais qui conserve des effets poétiques (images, rythme). C''est
    la définition exacte : la prose poétique utilise la structure de la prose tout en travaillant les images et le rythme.'
- id: nblm-pourquoi-le-corpus-visions-poetiques-du-2
  type: choix
  difficulte: 2
  enonce: Pourquoi le corpus « visions poétiques du monde » associe-t-il des tableaux de paysage aux poèmes ?
  reponse:
    options:
    - id: o1
      texte: Pour comparer la façon dont peintres et poètes expriment leur rapport au monde avec leurs propres moyens.
    - id: o2
      texte: Pour remplacer l'analyse des textes littéraires par la seule étude de la peinture.
    - id: o3
      texte: Pour vérifier si le tableau reproduit fidèlement le texte poétique mot à mot.
    - id: o4
      texte: Pour montrer que la peinture est le seul art capable de représenter la nature.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que le rapprochement entre peinture et poésie apporte à la compréhension des œuvres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'œuvre d'art vient compléter et éclairer la lecture du poème, elle ne s'y substitue pas.
  - si:
      contient:
      - o3
    relance: Chaque art possède sa propre esthétique ; la peinture n'est pas une simple illustration littérale du poème.
  - si:
      contient:
      - o4
    relance: 'C''est inexact : la poésie et la peinture célèbrent toutes deux le monde, chacune à sa manière.'
  solution: 'Pour comparer la façon dont peintres et poètes expriment leur rapport au monde avec leurs propres moyens. C''est
    exact : l''association permet de mettre en parallèle le langage pictural et la langue poétique face à la nature.'
- id: nblm-que-permet-de-constater-la-comparaison-d-3
  type: choix
  difficulte: 2
  enonce: Que permet de constater la comparaison de plusieurs poèmes sur la nature issus de siècles différents ?
  reponse:
    options:
    - id: o1
      texte: Elle montre l'évolution de la vision de la nature (célébration, inquiétude, observation) selon l'époque.
    - id: o2
      texte: Elle prouve que la sensibilité des poètes face au monde n'a jamais changé depuis le XIXe siècle.
    - id: o3
      texte: Elle montre que la nature a totalement disparu des sujets poétiques modernes.
    - id: o4
      texte: Elle démontre que seuls les poèmes romantiques ont le droit d'évoquer les paysages.
    bonnes:
    - o1
  indices:
    relance: Cherche comment la perception du monde varie selon les auteurs et les époques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : les visions poétiques évoluent du romantisme à nos jours.'
  - si:
      contient:
      - o3
    relance: 'Inexact : la nature demeure un thème privilégié de la poésie moderne et contemporaine.'
  - si:
      contient:
      - o4
    relance: 'Erreur : si le romantisme a accordé une grande place à la nature, d''autres mouvements poétiques l''ont aussi
      explorée.'
  solution: 'Elle montre l''évolution de la vision de la nature (célébration, inquiétude, observation) selon l''époque. C''est
    la réponse exacte : le regard porté sur la nature change en fonction du siècle et du contexte culturel.'
- id: nblm-selon-les-reperes-du-programme-quel-role-4
  type: choix
  difficulte: 2
  enonce: Selon les repères du programme, quel rôle la nature joue-t-elle principalement dans la poésie du romantisme à nos
    jours ?
  reponse:
    options:
    - id: o1
      texte: Elle est le lieu où le poète ressent le monde avec intensité et y fait refléter ses sentiments.
    - id: o2
      texte: Elle constitue un simple décor secondaire sans lien avec l'état d'esprit du poète.
    - id: o3
      texte: Elle est décrite de façon strictement scientifique comme dans un manuel de biologie.
    - id: o4
      texte: Elle sert uniquement à dénoncer les progrès techniques de l'urbanisation moderne.
    bonnes:
    - o1
  indices:
    relance: Pense au lien entre le paysage décrit et la vie intérieure ou affective du poète.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la nature poétique n''est jamais un cadre passif, elle fait écho aux sentiments.'
  - si:
      contient:
      - o3
    relance: La poésie cherche à faire ressentir et interroger le sens du monde, non à livrer une leçon de sciences.
  - si:
      contient:
      - o4
    relance: Même si la ville apparaît parfois, la célébration et l'interrogation du monde dépassent cette seule critique.
  solution: 'Elle est le lieu où le poète ressent le monde avec intensité et y fait refléter ses sentiments. C''est correct
    : la poésie utilise la nature comme lieu privilégié du « chant du monde » et de l''expression des émotions.'
- id: nblm-quelle-est-l-une-des-erreurs-frequentes-5
  type: choix
  difficulte: 2
  enonce: Quelle est l'une des erreurs fréquentes à éviter lors de l'étude d'un poème sur la nature dans ce corpus ?
  reponse:
    options:
    - id: o1
      texte: Réduire le poème à une simple description, sans chercher le sentiment ou l'idée exprimés.
    - id: o2
      texte: Lire le poème à voix haute pour percevoir le rythme et les sonorités des mots.
    - id: o3
      texte: Mettre en relation le texte poétique avec un tableau de paysage du même corpus.
    - id: o4
      texte: Repérer les métaphores et les images créées par le poète.
    bonnes:
    - o1
  indices:
    relance: Demande-toi ce qu'il faut chercher au-delà de la description matérielle d'un paysage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Ce n'est pas une erreur, mais au contraire une excellente méthode recommandée pour analyser la poésie.
  - si:
      contient:
      - o3
    relance: C'est une démarche clé encouragée par les programmes pour croiser les arts.
  - si:
      contient:
      - o4
    relance: Analyser les figures de style est essentiel pour comprendre la vision du monde proposée.
  solution: 'Réduire le poème à une simple description, sans chercher le sentiment ou l''idée exprimés. C''est l''erreur classique
    identifiée dans les fiches officielles : il faut dépasser le simple constat descriptif.'
- id: nblm-quels-elements-un-corpus-sur-les-visions-6
  type: choix
  difficulte: 3
  enonce: Quels éléments un corpus sur les visions poétiques du monde peut-il associer d'après les fiches de notion ? (2 bonnes
    réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Des poèmes en vers ou des textes en prose poétique du romantisme à nos jours.
    - id: o2
      texte: Des tableaux représentant des paysages pour comparer la vision des peintres et des poètes.
    - id: o3
      texte: Des manuels scientifiques décrivant le fonctionnement anatomique des plantes.
    - id: o4
      texte: Uniquement des pièces de théâtre comiques du XVIIe siècle.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux types d'œuvres littéraires et artistiques mentionnés dans le programme pour ce thème.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : le corpus relève du domaine littéraire et artistique, pas des sciences de la vie.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : le corpus est centré sur la poésie et les arts visuels du XIXe siècle à aujourd''hui.'
  solution: 'Des poèmes en vers ou des textes en prose poétique du romantisme à nos jours ; Des tableaux représentant des
    paysages pour comparer la vision des peintres et des poètes. C''est juste : le corpus rassemble diverses formes poétiques
    explorant le rapport au monde.'
- id: nblm-quel-terme-designe-un-texte-redige-en-ph-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne un texte rédigé en phrases ordinaires, sans vers, mais qui conserve des images et des effets
    poétiques ?
  reponse:
    acceptees:
    - prose poétique
    fautes_tolerees: 1
  indices:
    relance: C'est une forme de poésie écrite sous forme de phrases continues (deux mots).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: prose poétique. La prose poétique est une forme d'écriture non versifiée qui exploite le rythme et les images
    de la langue poétique.
- id: nblm-quel-mot-designe-un-ensemble-de-textes-o-8
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne un ensemble de textes ou d'images rassemblés pour être étudiés ensemble autour d'un thème ?
  reponse:
    acceptees:
    - corpus
    fautes_tolerees: 1
  indices:
    relance: C'est un terme masculin d'origine latine désignant le regroupement de documents (un seul mot).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: corpus. Le corpus désigne l'ensemble structuré de documents (textes, images) réuni pour une étude comparative.
