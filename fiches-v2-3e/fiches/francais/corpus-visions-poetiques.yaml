  reponse:
    options:
    - id: a
      texte: Le romantisme
    - id: b
      texte: Le surréalisme
    - id: c
      texte: Le classicisme du XVIIe siècle
    - id: d
      texte: Le réalisme scientifique
    bonnes:
    - a
  indices:
    relance: Ce mouvement du XIXe siècle exprime les sentiments personnels et voit la nature comme un reflet de l'âme.
    methode: Cherche le mouvement du XIXe siècle centré sur les sentiments du poète.
    etape: Ce mouvement inclut Lamartine et Hugo.
