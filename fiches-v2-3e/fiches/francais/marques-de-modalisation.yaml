format: 2
notion: marques-de-modalisation
version: 2
etat: verifiee
declencheurs:
- mot qui montre le doute de l'auteur
- adverbe de certitude
- avis exprimé dans un texte
- verbe qui montre une opinion
- sans doute ou sûrement
- phrase qui exprime un jugement
- point d'exclamation dans un texte
- fait ou opinion
prerequis: []
essentiel: 'La modalisation, ce sont les marques dans un texte qui montrent l''attitude de celui qui parle ou écrit : son
  degré de certitude, son jugement, son sentiment. Elle permet de distinguer un fait (« Il pleut. ») d''un point de vue («
  Il pleut malheureusement encore. »).


  Les marques à repérer, par catégories.

  Les adverbes et locutions adverbiales. Certitude : certainement, sûrement, évidemment, sans aucun doute. Doute ou probabilité
  : peut-être, probablement, sans doute, apparemment.

  Les verbes d''opinion ou de sentiment : je pense que, je crois que, je crains que, je doute que, il me semble que. Les verbes
  modaux : pouvoir, devoir (« Il doit être arrivé. »).

  Les adjectifs et les noms qui jugent : étonnant, regrettable, admirable, un exploit, un scandale.

  Le mode et le temps : le conditionnel marque l''incertitude (« Il serait parti hier. »).

  La ponctuation : point d''exclamation, guillemets qui prennent de la distance (« ce "génie" »), points de suspension.


  Interpréter une marque, c''est dire ce qu''elle révèle : de la certitude, du doute, une approbation, une critique, de l''ironie.


  Attention : « sans doute » exprime le plus souvent une forte probabilité, pas une certitude totale.


  Pour écrire ou parler, on choisit ses marques selon l''effet voulu. Pour convaincre : « Il est évident que... ». Pour rester
  prudent : « Il semblerait que... ».


  Au brevet, on demande de relever plusieurs marques de modalisation dans un texte, de les classer et d''expliquer ce qu''elles
  montrent du point de vue de l''auteur.

  '
methode:
- 'Lis la phrase et demande-toi : est-ce un simple fait ou un point de vue ?'
- Souligne les adverbes, les verbes d'opinion, les adjectifs qui jugent et la ponctuation expressive.
- 'Classe chaque marque : certitude, doute, jugement positif ou négatif, sentiment.'
- Explique l'effet produit sur le lecteur (convaincre, prendre de la distance, ironiser).
- Pour écrire, choisis la marque qui donne exactement le degré de certitude voulu.
vocabulaire:
- terme: modalisation
  definition: ensemble des marques qui montrent l'attitude de celui qui parle ou écrit
- terme: énonciateur
  definition: personne qui parle ou écrit et prend en charge le texte
- terme: fait objectif
  definition: information vérifiable, sans jugement personnel
- terme: adverbe modalisateur
  definition: adverbe qui exprime le doute, la certitude ou un jugement
- terme: verbe d'opinion
  definition: verbe qui exprime ce que pense celui qui parle (croire, penser, douter)
- terme: conditionnel
  definition: mode qui peut exprimer un fait incertain ou non confirmé
- terme: ironie
  definition: manière de dire le contraire de ce qu'on pense pour se moquer
erreurs_frequentes:
- 'Croire que seuls les adverbes sont des marques de modalisation : les verbes, les adjectifs et la ponctuation comptent aussi.'
- Relever la marque sans dire ce qu'elle exprime (doute, certitude, jugement).
- Confondre un fait présenté avec des chiffres et une opinion présentée avec des mots qui jugent.
- Oublier que le conditionnel peut marquer l'incertitude, pas seulement la politesse ou l'hypothèse.
exemple:
  enonce: Dans la phrase « Ce film est certainement le meilleur de l'année », quel mot montre le point de vue de celui qui
    parle ?
  solution: 'Le mot « certainement » est une marque de modalisation : c''est un adverbe qui exprime un fort degré de certitude,
    propre au jugement de celui qui parle, pas un fait objectif.'
exercices:
- id: reperer-adverbe-doute
  type: texte_court
  difficulte: 1
  enonce: Dans la phrase « Il viendra peut-être ce soir », quel mot exprime le doute de celui qui parle ?
  reponse:
    acceptees:
    - peut-être
    - peut etre
    fautes_tolerees: 1
  indices:
    relance: Cherche le mot qui montre que celui qui parle n'est pas sûr de ce qu'il annonce.
    methode: C'est un adverbe placé entre le verbe et le complément de temps.
    etape: Ce mot est composé de deux mots reliés par un trait d'union.
  pieges:
  - si:
      valeur: viendra
    relance: Ce verbe annonce simplement un événement futur. Cherche plutôt le mot qui exprime l'incertitude.
  solution: 'Le mot « peut-être » est une marque de modalisation : cet adverbe montre que celui qui parle n''est pas certain
    de la venue de la personne.'
- id: phrase-modalisee
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases contient une marque de modalisation ?
  reponse:
    options:
    - id: a
      texte: Le train part à 8 heures.
    - id: b
      texte: Le train part sans doute à 8 heures.
    - id: c
      texte: Le train est parti hier.
    bonnes:
    - b
  indices:
    relance: Cherche la phrase qui contient un mot exprimant un doute, plutôt qu'un fait sûr.
    methode: 'Compare les trois phrases : deux énoncent un fait, une seule laisse entendre une incertitude.'
    etape: Le groupe de mots « sans doute » est une marque de modalisation typique.
  pieges:
  - si:
      contient:
      - a
    relance: 'Cette phrase énonce un fait simple, sans marque de doute ni de jugement : ce n''est pas une phrase modalisée.'
  - si:
      contient:
      - c
    relance: 'Cette phrase relate un fait passé, sans adverbe de doute ni verbe d''opinion : cherche l''autre phrase.'
  solution: '« Le train part sans doute à 8 heures » contient une marque de modalisation : le groupe « sans doute » exprime
    l''incertitude de celui qui parle.'
- id: associer-marques-types
  type: association
  difficulte: 2
  enonce: Associe chaque expression à ce qu'elle exprime.
  reponse:
    gauche:
    - id: a
      texte: certainement
    - id: b
      texte: je crains que
    - id: c
      texte: il est regrettable que
    droite:
    - id: x
      texte: une forte certitude
    - id: y
      texte: une inquiétude
    - id: z
      texte: un jugement négatif
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Lis chaque expression et demande-toi si elle exprime un fait, une peur, ou une opinion négative.
    methode: « Je crains que » introduit une émotion, « il est regrettable que » introduit un jugement porté sur un fait.
    etape: « Certainement » est un adverbe qui exprime un très haut degré de certitude.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au sens précis de chaque expression.
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'expression la plus claire, « certainement », qui exprime une certitude forte.
  solution: « Certainement » exprime une forte certitude, « je crains que » une inquiétude, « il est regrettable que » un
    jugement négatif porté sur un fait.
- id: reecrire-modalise
  type: ouverte
  difficulte: 3
  enonce: Réécris la phrase « Ce spectacle est intéressant » en ajoutant une marque de modalisation qui montre un fort doute
    de celui qui parle.
  criteres:
  - La phrase reprend l'idée de départ (le spectacle jugé intéressant).
  - La phrase contient une marque de modalisation claire exprimant le doute (adverbe comme « peut-être », « sans doute »,
    ou une tournure équivalente).
  indices:
    relance: Quel adverbe pourrais-tu insérer pour montrer que celui qui parle n'est pas totalement sûr ?
    methode: Place un adverbe de doute avant ou après l'adjectif « intéressant ».
    etape: Tu peux écrire par exemple « Ce spectacle est peut-être intéressant » ou une phrase proche.
  solution: 'Exemple de réponse : « Ce spectacle est sans doute intéressant. » L''adverbe « sans doute » ajoute une marque
    de modalisation qui montre l''incertitude de celui qui parle, là où la phrase de départ énonçait un jugement sans nuance.'
- id: valeur-marque-evident
  type: choix
  difficulte: 2
  enonce: Dans « Il est évident que ce plan échouera. », que montre l'expression « il est évident que » ?
  reponse:
    options:
    - id: a
      texte: une certitude forte
    - id: b
      texte: un doute
    - id: c
      texte: un ordre
    - id: d
      texte: un regret
    bonnes:
    - a
  indices:
    relance: Demande-toi si celui qui parle hésite ou s'il affirme sans hésiter.
    methode: 'Remplace l''expression par « peut-être » : le sens change-t-il beaucoup ? Cela t''indique le degré de certitude.'
    etape: 'L''expression enlève tout doute : celui qui parle présente son opinion comme sûre.'
  pieges:
  - si:
      contient:
      - b
    relance: Un doute s'exprimerait avec un mot comme « peut-être » ou « il se pourrait ». Ici, rien n'hésite.
  - si:
      contient:
      - c
    relance: 'Il n''y a aucun verbe à l''impératif ni aucune demande : celui qui parle ne donne pas d''ordre.'
  - si:
      contient:
      - d
    relance: Aucun mot ne montre de tristesse ni de regret. Cherche le degré de certitude.
  solution: « Il est évident que » présente l'opinion comme une certitude. C'est une marque de modalisation qui montre que
    l'auteur est sûr de lui.
- id: ponctuation-surprise
  type: texte_court
  difficulte: 1
  enonce: Quel signe de ponctuation, placé à la fin d'une phrase, marque surtout la surprise ou l'indignation de celui qui
    parle ? Écris son nom.
  reponse:
    acceptees:
    - point d'exclamation
    - points d'exclamation
    fautes_tolerees: 1
  indices:
    relance: Ce signe se place à la fin d'une phrase et exprime un sentiment fort.
    methode: 'Pense aux quatre signes de fin de phrase : le point, le point d''interrogation, les points de suspension et
      un dernier signe qui traduit l''émotion.'
    etape: Ce n'est ni le point, ni le point d'interrogation. Son nom commence par « point » et se termine par un mot qui
      évoque un cri.
  pieges:
  - si:
      valeur: point d'interrogation
    relance: Le point d'interrogation pose une question. Ici, on cherche le signe qui traduit l'émotion.
  solution: 'Le point d''exclamation traduit la surprise, l''indignation ou l''enthousiasme : c''est une marque de modalisation.'
- id: degres-de-certitude
  type: ordre
  difficulte: 2
  enonce: Range ces trois adverbes du moins sûr au plus sûr.
  reponse:
    elements:
    - id: peutetre
      texte: peut-être
    - id: probablement
      texte: probablement
    - id: certainement
      texte: certainement
  indices:
    relance: 'Demande-toi pour chaque mot : est-ce seulement possible, très probable ou sûr ?'
    methode: Le premier laisse un vrai doute, le dernier n'en laisse presque aucun.
    etape: Le mot qui laisse le plus de place au doute vient en premier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Deux voisins sont inversés. Compare-les deux à deux : lequel est plus sûr que l''autre ?'
  - si:
      diagnostic: ordre_faux
    relance: 'Repars du doute : commence par le mot qui exprime seulement une possibilité.'
  solution: peut-être (simple possibilité) → probablement (forte probabilité) → certainement (quasi-certitude).
