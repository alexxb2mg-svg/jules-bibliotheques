# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: orthographe-affixes-et-etymons
version: 3
etat: verifiee
declencheurs:
- d'où vient ce mot
- préfixe ou suffixe rare
- un ou deux consonnes
- préfixe qui double la consonne
- mot d'origine grecque
- racine grecque ou latine
- orthographe d'un mot construit
prerequis: []
essentiel: 'Beaucoup de mots français se construisent avec un radical, un préfixe (avant le radical) et un suffixe (après).
  Connaître leur orthographe et leur sens aide à écrire et à comprendre des mots nouveaux.


  Les préfixes.

  - Négation ou contraire : in- (inutile), et ses formes im- devant b, m, p (impossible, immobile), il- devant l (illisible),
  ir- devant r (irrégulier). C''est pourquoi on double la consonne.

  - dé-, dés- : contraire ou retrait (défaire, désagréable).

  - mé-, més- : mauvais (mécontent, mésentente).

  - anti- : contre (antibruit).

  - sur-, sous- : au-dessus, au-dessous.

  - syn- : avec, ensemble, qui devient sym- devant b, m, p (synonyme, sympathie, symbole).

  - co-, com-, con- : avec, ensemble (coopérer, compatir, concitoyen).


  Les suffixes.

  - -esse forme des noms de qualité (tristesse, faiblesse).

  - -erie indique un lieu ou une activité (boulangerie).

  - -able, -ible : « qui peut être » (mangeable, lisible).

  - -eur, -euse : celui qui fait (chanteur).

  - -isme, -iste : doctrine ou métier (réalisme, journaliste).

  Ils changent la classe du mot : « triste » (adjectif) donne « tristesse » (nom).


  Les étymons (racines grecques et latines).

  - Grecs : bio (vie), chrono (temps), graph (écrire), phile (qui aime), phobe (qui craint), phone (voix, son), scope (regarder),
  micro (petit), géo (terre), hydro (eau), thermo (chaleur), télé (loin), poly (plusieurs), mono (un seul), anthropo (homme),
  cratie (pouvoir), logie (étude).

  - Latins : aqua (eau), ped (pied), manu (main), vore (manger), cide (tuer), dict (dire), script (écrire), aud (entendre),
  vid, vis (voir).

  On les reconnaît à leur graphie : ph, th, ch (prononcé k), y, rh sont typiques du grec (photographe, thermomètre, chronomètre,
  sympathie).


  Au brevet, on attend une orthographe juste des mots appris, une explication du sens par le préfixe, le suffixe ou l''étymon,
  et de repérer les doubles consonnes.

  '
methode:
- 'Découpe le mot : préfixe, radical, suffixe (immangeable = im- + mange + -able).'
- Cherche le sens du préfixe et du suffixe, puis celui du radical ; assemble-les pour vérifier le mot.
- 'Regarde la lettre qui suit le préfixe : devant b, m, p le préfixe in- s''écrit im- ; devant l il s''écrit il- ; devant
  r ir-.'
- 'Repère un étymon grec (ph, th, ch, y, rh) ou latin et pense à sa famille de mots (chrono : chronomètre, chronologie).'
- 'Écris le mot, puis relis chaque partie : la double consonne se justifie par la rencontre du préfixe et du radical.'
- Apprends les mots de ta liste en les découpant et en les mettant dans une phrase.
vocabulaire:
- terme: radical
  definition: partie centrale du mot qui porte le sens principal
- terme: préfixe
  definition: élément placé avant le radical, qui modifie son sens (in-, dé-, mé-)
- terme: suffixe
  definition: élément placé après le radical, qui forme un nouveau mot ou change sa classe (-esse, -able)
- terme: étymon
  definition: mot ou racine d'origine, souvent grec ou latin, à l'origine d'un mot français
- terme: dérivation
  definition: création d'un mot en ajoutant un préfixe ou un suffixe à un radical
- terme: famille de mots
  definition: ensemble de mots formés à partir du même radical ou du même étymon
- terme: assimilation
  definition: changement de la dernière lettre d'un préfixe pour ressembler à la lettre suivante (in- devient im-, il-, ir-)
erreurs_frequentes:
- 'Écrire « inpossible » ou « inlisible » : devant p, b, m on écrit im- ; devant l, il-.'
- Oublier de doubler la consonne quand le préfixe finit par la même lettre que le radical commence (irrégulier, illisible).
- Confondre ph et f, ou th et t, dans les mots d'origine grecque (photographe, thermomètre).
- Croire que deux mots proches par le son sont de la même famille (chorégraphe et chronomètre n'ont pas le même étymon).
- 'Oublier que le suffixe peut changer la classe du mot : triste (adjectif), tristesse (nom).'
exemple:
  enonce: Explique pourquoi on écrit « immangeable » avec deux m, à partir du préfixe et du radical.
  solution: Le préfixe « in- » (négation) devient « im- » devant la lettre m du radical « mangeable ». On obtient donc « im-
    » + « mangeable » = « immangeable », avec deux m.
exercices:
- id: prefixe-il
  type: texte_court
  difficulte: 1
  enonce: Quel préfixe de négation faut-il ajouter à « lisible » pour dire « qui ne peut pas être lu » ? (écris seulement
    le mot complet)
  reponse:
    acceptees:
    - illisible
    fautes_tolerees: 0
  indices:
    relance: Le préfixe de négation « in- » change de forme devant certaines lettres.
    methode: Devant la lettre l, le préfixe « in- » devient « il- ».
    etape: Ajoute « il- » devant « lisible ».
  pieges:
  - si:
      valeur: inlisible
    relance: 'Devant la lettre l, le préfixe « in- » ne reste pas tel quel : il se transforme.'
  solution: '« illisible » : le préfixe « in- » devient « il- » devant la consonne l du radical.'
- id: etymon-chrono
  type: choix
  difficulte: 1
  enonce: L'étymon grec « chrono » signifie « temps ». Quel mot contient cet étymon et désigne un instrument qui mesure le
    temps avec précision ?
  reponse:
    options:
    - id: a
      texte: chronomètre
    - id: b
      texte: chorégraphe
    - id: c
      texte: microscope
    bonnes:
    - a
  indices:
    relance: Cherche le mot qui commence par les mêmes lettres que « chrono ».
    methode: « mètre » signifie « mesurer ». « chrono » + « mètre » donne un mot qui mesure le temps.
    etape: Le mot correct commence par « chrono- ».
  pieges:
  - si:
      contient:
      - b
    relance: « chorégraphe » vient de « choros » (la danse), pas de « chronos » (le temps).
  - si:
      contient:
      - c
    relance: « microscope » vient de « micro » (petit) et « scope » (observer), pas de « chronos ».
  solution: '« chronomètre » contient l''étymon « chrono » (temps) et « mètre » (mesurer) : il mesure le temps avec précision.'
- id: prefixe-im
  type: choix
  difficulte: 2
  enonce: Quelle orthographe est correcte pour le contraire de « possible » ?
  reponse:
    options:
    - id: a
      texte: impossible
    - id: b
      texte: inpossible
    - id: c
      texte: irpossible
    bonnes:
    - a
  indices:
    relance: Le préfixe « in- » change de forme devant certaines consonnes, notamment b, m et p.
    methode: Devant la lettre p, le préfixe « in- » devient « im- ».
    etape: Ajoute « im- » devant « possible ».
  pieges:
  - si:
      contient:
      - b
    relance: Devant la lettre p, le préfixe « in- » ne reste pas tel quel.
  - si:
      contient:
      - c
    relance: Le préfixe « ir- » s'utilise devant la lettre r, pas devant p.
  solution: '« impossible » : le préfixe « in- » devient « im- » devant la consonne p du radical « possible ».'
- id: familles-etymons
  type: association
  difficulte: 3
  enonce: Associe chaque étymon grec à son sens.
  reponse:
    gauche:
    - id: a
      texte: bio (comme dans biologie)
    - id: b
      texte: phile (comme dans bibliophile)
    - id: c
      texte: graph (comme dans photographe)
    droite:
    - id: x
      texte: vie
    - id: y
      texte: qui aime
    - id: z
      texte: écrire
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Pense au mot « biologie », qui étudie les êtres vivants : que signifie « bio » ?'
    methode: '« bibliophile » aime les livres : « phile » signifie donc aimer. « photographe » écrit avec la lumière : « graph
      » signifie écrire.'
    etape: Classe d'abord « bio », lié à la vie, puis distingue « phile » et « graph » par leur sens.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au sens de chaque mot qui contient ces étymons.
  - si:
      diagnostic: associations_fausses
    relance: Pour chaque étymon, trouve un mot français que tu connais et déduis son sens à partir de ce mot.
  solution: « bio » signifie la vie, « phile » signifie « qui aime », « graph » signifie « écrire ».
- id: nblm-comment-appelle-t-on-le-mot-d-origine-so-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on le mot d'origine, souvent latin ou grec, qui indique d'où vient un mot français et permet d'en
    comprendre le sens ?
  reponse:
    options:
    - id: o1
      texte: Un étymon
    - id: o2
      texte: Un suffixe
    - id: o3
      texte: Un préfixe
    - id: o4
      texte: Un radical
    bonnes:
    - o1
  indices:
    relance: Pense au terme désignant la racine historique ou l'origine grecque ou latine d'un mot.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : le suffixe est un élément placé après le radical pour modifier la classe grammaticale ou
      le sens, pas le mot d''origine.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : le préfixe se place avant le radical pour modifier son sens, ce n''est pas le mot d''origine.'
  - si:
      contient:
      - o4
    relance: 'Confusion fréquente : le radical est la base du mot français, tandis que l''étymon est son ancêtre grec ou latin.'
  solution: 'Un étymon. C''est exact : l''étymon est le mot d''origine (latin ou grec) à partir duquel s''est formé le mot
    français.'
- id: nblm-pourquoi-le-mot-immangeable-s-ecrit-il-a-2
  type: choix
  difficulte: 2
  enonce: Pourquoi le mot « immangeable » s'écrit-il avec deux consonnes « m » ?
  reponse:
    options:
    - id: o1
      texte: Le préfixe négatif « in- » devient « im- » devant la lettre m du radical « mangeable ».
    - id: o2
      texte: C'est une exception orthographique sans lien avec la formation du mot.
    - id: o3
      texte: Le radical du mot contient déjà deux consonnes m à l'origine.
    - id: o4
      texte: C'est le suffixe qui ajoute un second m pour des raisons de prononciation.
    bonnes:
    - o1
  indices:
    relance: Observe la transformation du préfixe négatif devant la première lettre du radical.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : croire qu''il s''agit d''une exception alors que c''est une règle stricte de modification du
      préfixe in- devant la lettre m.'
  - si:
      contient:
      - o3
    relance: 'Faux : le radical est « mangeable », qui ne comporte qu''un seul m initial.'
  - si:
      contient:
      - o4
    relance: 'Erreur de décomposition : le changement de consonne se produit au niveau du préfixe au début du mot, non du
      suffixe.'
  solution: 'Le préfixe négatif « in- » devient « im- » devant la lettre m du radical « mangeable ». C''est la règle d''assimilation
    : devant m, b ou p, le préfixe in- se transforme en im-, ce qui produit deux m successifs avec le radical.'
- id: nblm-quelle-est-l-orthographe-correcte-du-mot-3
  type: choix
  difficulte: 2
  enonce: Quelle est l'orthographe correcte du mot formé du préfixe « in- » et de l'adjectif « lisible », et quelle consonne
    est doublée ?
  reponse:
    options:
    - id: o1
      texte: Illisible, avec deux l car « in- » devient « il- » devant la lettre l.
    - id: o2
      texte: Inlisible, avec un seul l car le préfixe « in- » ne change jamais.
    - id: o3
      texte: Ilisible, avec un seul l pour éviter de doubler la consonne.
    - id: o4
      texte: Imlisible, avec un m car le préfixe change devant toutes les consonnes.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi comment varie le préfixe in- lorsque le radical commence par un l.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : oublier que le préfixe in- s''adapte à la consonne initiale du radical (il- devant l).'
  - si:
      contient:
      - o3
    relance: 'Erreur d''orthographe : supprimer un l fait disparaître la première lettre du radical « lisible ».'
  - si:
      contient:
      - o4
    relance: 'Confusion de règle : in- devient im- devant b, m, p, mais se transforme en il- devant l.'
  solution: 'Illisible, avec deux l car « in- » devient « il- » devant la lettre l. Bonne réponse : devant la lettre l, le
    préfixe in- s''orthographie il-, d''où le redoublement de la consonne l.'
- id: nblm-quelle-est-la-difference-de-sens-entre-l-4
  type: choix
  difficulte: 2
  enonce: Quelle est la différence de sens entre les préfixes moins fréquents « extra- » et « intra- » ?
  reponse:
    options:
    - id: o1
      texte: « Extra- » signifie « au-delà » alors que « intra- » signifie « à l'intérieur ».
    - id: o2
      texte: « Extra- » signifie « à l'intérieur » alors que « intra- » signifie « au-delà ».
    - id: o3
      texte: Les deux préfixes ont le même sens mais l'un est d'origine grecque et l'autre latine.
    - id: o4
      texte: « Extra- » exprime la négation et « intra- » exprime la répétition.
    bonnes:
    - o1
  indices:
    relance: Pense au sens de mots connus comme 'extraterrestre' (hors de la Terre) ou 'intramuros' (à l'intérieur des murs).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente signalée dans la leçon : inverser le sens de ces deux préfixes savants.'
  - si:
      contient:
      - o3
    relance: 'Faux : ils possèdent des significations opposées concernant la localisation.'
  - si:
      contient:
      - o4
    relance: Confusion avec le préfixe in- (négation) ou re- (répétition).
  solution: '« Extra- » signifie « au-delà » alors que « intra- » signifie « à l''intérieur ». C''est exact : extra- indique
    l''extérieur ou le dépassement, tandis que intra- désigne ce qui se trouve au-dedans.'
- id: nblm-d-ou-vient-l-element-chrono-present-dans-5
  type: choix
  difficulte: 2
  enonce: D'où vient l'élément « chrono » présent dans « chronomètre » ou « chronologie », et que signifie cet étymon ?
  reponse:
    options:
    - id: o1
      texte: Il provient de l'étymon grec « chrono » qui signifie « temps ».
    - id: o2
      texte: Il provient d'un suffixe latin qui signifie « écrire ».
    - id: o3
      texte: Il provient de l'étymon grec « bio » qui signifie « vie ».
    - id: o4
      texte: C'est un préfixe français moderne signifiant « rapide ».
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que mesure un appareil comme un chronomètre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Confusion avec l'étymon graph qui signifie écrire.
  - si:
      contient:
      - o3
    relance: 'Confusion d''étymons : bio désigne la vie, et non le temps.'
  - si:
      contient:
      - o4
    relance: 'Faux : il s''agit d''une racine grecque ancienne productive dans la langue française.'
  solution: 'Il provient de l''étymon grec « chrono » qui signifie « temps ». C''est exact : l''étymon grec chrono signifie
    temps et sert à former des mots relatifs à la mesure ou à l''ordre du temps.'
- id: nblm-parmi-les-affirmations-suivantes-sur-les-6
  type: choix
  difficulte: 3
  enonce: Parmi les affirmations suivantes sur les affixes et les étymons, lesquelles sont exactes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un suffixe comme « -phobe » ou « -isme » se place après le radical et peut modifier la nature du mot.
    - id: o2
      texte: L'étymon grec « graph » signifie « écrire » et se retrouve dans « géographie » ou « orthographe ».
    - id: o3
      texte: Le préfixe négatif « in- » s'écrit toujours de la même façon devant toutes les consonnes.
    - id: o4
      texte: Un préfixe se place toujours après le radical d'un mot.
    bonnes:
    - o1
    - o2
  indices:
    relance: Vérifie la position des affixes par rapport au radical et les variations du préfixe in-.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : le préfixe in- change de forme devant l (il-), r (ir-) ou b/m/p (im-).'
  - si:
      contient:
      - o4
    relance: 'Faux : un préfixe se place avant le radical (ce qui est placé après est un suffixe).'
  solution: 'Un suffixe comme « -phobe » ou « -isme » se place après le radical et peut modifier la nature du mot ; L''étymon
    grec « graph » signifie « écrire » et se retrouve dans « géographie » ou « orthographe ». Vrai : le suffixe se place après
    le radical et permet souvent de changer la catégorie grammaticale.'
- id: nblm-comment-appelle-t-on-l-element-place-ava-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'élément placé avant le radical d'un mot pour en modifier le sens, comme « extra- » ou « hyper-
    » ?
  reponse:
    acceptees:
    - Un préfixe
    fautes_tolerees: 1
  indices:
    relance: Il s'agit de l'affixe situé au début du mot, avant le radical.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Un préfixe. C''est la bonne réponse : l''élément placé avant le radical s''appelle un préfixe.'
- id: nblm-devant-les-lettres-b-m-ou-p-sous-quelle-8
  type: texte_court
  difficulte: 1
  enonce: Devant les lettres b, m ou p, sous quelle forme s'écrit le préfixe « in- », modifiant ainsi l'orthographe du mot
    (comme dans « impossible ») ?
  reponse:
    acceptees:
    - im-
    fautes_tolerees: 1
  indices:
    relance: Indique la forme à deux lettres du préfixe se terminant par 'm'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'im-. C''est la réponse exacte : le préfixe in- devient im- devant b, m, p.'
- id: contraire-regulier
  type: texte_court
  difficulte: 1
  enonce: Quel est le contraire de « régulier », construit avec un préfixe de négation ? (écris le mot complet)
  reponse:
    acceptees:
    - irrégulier
    fautes_tolerees: 0
  indices:
    relance: Quel préfixe de négation s'écrit avant un r ?
    methode: 'Le préfixe in- change de forme devant certaines lettres : ici, la lettre du radical est r.'
    etape: 'Le préfixe devient ir- : ajoute-le devant « régulier ».'
  pieges:
  - si:
      valeur: inrégulier
    relance: Le préfixe in- change de forme devant certaines consonnes. Que devient-il devant r ?
  solution: 'in- devient ir- devant r : ir + régulier = irrégulier, avec deux r.'
- id: sympathie-orthographe
  type: choix
  difficulte: 2
  enonce: Quelle est l'orthographe correcte du mot qui désigne la capacité à partager les sentiments d'autrui ?
  reponse:
    options:
    - id: a
      texte: sympathie
    - id: b
      texte: synpathie
    - id: c
      texte: simpathie
    bonnes:
    - a
  indices:
    relance: 'Le préfixe grec signifie « avec » : comment s''écrit-il devant la lettre p ?'
    methode: Le préfixe syn- devient sym- devant b, m et p, comme in- devient im-.
    etape: La deuxième lettre du préfixe est un y (lettre typique du grec) ; regarde la lettre qui suit le préfixe.
  pieges:
  - si:
      contient:
      - b
    relance: Le préfixe change de forme devant certaines lettres, comme in- devient im-. Que devient le n devant p ?
  - si:
      contient:
      - c
    relance: 'La lettre y est typique du grec : ce mot n''est pas écrit avec un i.'
  solution: 'Le préfixe grec syn- devient sym- devant p : sympathie (sym- « avec » + pathie « ce qu''on ressent »).'
- id: suffixe-nom-qualite
  type: choix
  difficulte: 2
  enonce: Quel suffixe permet de former un nom de qualité à partir de l'adjectif « triste » ?
  reponse:
    options:
    - id: a
      texte: -esse
    - id: b
      texte: -erie
    - id: c
      texte: -eur
    bonnes:
    - a
  indices:
    relance: Cherche le suffixe qui donne des noms de qualité comme « faiblesse ».
    methode: On veut un nom qui exprime l'état d'être triste, pas un lieu ni une personne.
    etape: Ajoute le suffixe à « trist- » et vérifie que le mot existe.
  pieges:
  - si:
      contient:
      - b
    relance: Le suffixe -erie indique plutôt un lieu ou une activité (boulangerie). Ici, on veut une qualité.
  - si:
      contient:
      - c
    relance: Le suffixe -eur désigne plutôt celui qui fait une action (chanteur). Ici, on veut un nom de qualité.
  solution: triste + -esse donne tristesse, nom de qualité (comme faible donne faiblesse).
- id: expliquer-mot-construit
  type: ouverte
  difficulte: 3
  enonce: Choisis un mot construit avec un préfixe ou un suffixe (par exemple « irrespectueux » ou « chronomètre »). Écris-le,
    découpe-le en ses éléments, explique le sens de chaque élément et justifie son orthographe en une ou deux phrases.
  criteres:
  - Le mot est bien découpé (préfixe ou étymon, radical, suffixe si besoin).
  - Le sens de chaque élément est donné correctement et le sens du mot en découle.
  - L'orthographe est justifiée (par exemple double consonne ou lettre grecque) et le mot est écrit sans faute.
  indices:
    relance: Quels éléments composent le mot que tu as choisi ?
    methode: Sépare d'abord le préfixe ou l'étymon, puis le radical, puis le suffixe, et donne le sens de chacun.
    etape: 'Exemple : dans « illisible », le préfixe il- (négation), le radical lis-, le suffixe -ible.'
  solution: 'Exemple : « illisible » = il- (négation, in- devient il- devant l) + lis- (lire) + -ible (qui peut être) : «
    qui ne peut pas être lu ». On double le l.'
