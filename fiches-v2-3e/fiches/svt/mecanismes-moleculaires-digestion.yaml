format: 2
notion: mecanismes-moleculaires-digestion
version: 2
etat: verifiee
declencheurs:
- amylase salivaire
- enzymes digestives
- eau iodée
- liqueur de Fehling
- découper l'amidon
- spécificité des enzymes
- enzymes du suc pancréatique
- test à l'eau iodée
- grosses molécules découpées
prerequis:
- devenir-aliments-tube-digestif
essentiel: 'Les aliments contiennent de grosses molécules : l''amidon (un glucide), les protéines et les lipides. Elles sont
  trop grosses pour traverser la paroi de l''intestin et passer dans le sang. Il faut donc les découper en petites molécules
  : les nutriments.


  Cette transformation est la digestion chimique. Elle est faite par des enzymes digestives, contenues dans les sucs digestifs
  (salive, suc gastrique, suc pancréatique, suc intestinal). Une enzyme est une molécule (une protéine) fabriquée par l''organisme.
  Ce n''est pas un être vivant.


  Chaque enzyme est spécifique : elle n''agit que sur un seul type de molécule.

  - L''amylase découpe l''amidon (jusqu''au glucose avec d''autres enzymes de l''intestin).

  - Les protéases découpent les protéines en acides aminés.

  - Les lipases découpent les lipides en acides gras et glycérol.


  Une enzyme agit vite à la température du corps, 37 °C. Au froid, elle agit très lentement. Une forte chaleur (100 °C) la
  détruit : elle ne fonctionne plus, même si on refroidit ensuite. L''enzyme n''est pas consommée : elle peut découper de
  nombreuses molécules l''une après l''autre.


  Les fibres (cellulose) ne sont pas découpées par nos enzymes. Certaines sont transformées par des micro-organismes de l''intestin.


  Au laboratoire, deux tests permettent de suivre la digestion de l''amidon.

  - L''eau iodée devient bleu-noir en présence d''amidon (elle reste jaune-orangé sinon).

  - La liqueur de Fehling, chauffée, donne un précipité rouge brique en présence de certains sucres comme le glucose.


  Une expérience de digestion utilise un tube témoin (sans enzyme) et ne fait varier qu''un seul facteur à la fois.


  Au brevet : on te donne des tubes et des résultats de tests. Tu dois les interpréter, comparer au témoin, et conclure sur
  le rôle et la spécificité des enzymes.

  '
methode:
- Repérer la grosse molécule de départ (amidon, protéines, lipides) et chercher l'enzyme qui lui correspond.
- Dans une expérience, identifier le tube témoin (sans enzyme) et le seul facteur qui change d'un tube à l'autre (enzyme,
  température...).
- 'Lire les tests : eau iodée bleu-noir = amidon présent ; précipité rouge brique avec la liqueur de Fehling chauffée = sucre
  comme le glucose présent.'
- 'Comparer chaque tube au témoin : ce qui change vient du facteur testé.'
- Conclure en une phrase qui cite l'enzyme, la molécule découpée, et la condition (température) si elle intervient.
vocabulaire:
- terme: enzyme digestive
  definition: Molécule des sucs digestifs qui découpe une grosse molécule d'aliment en petites molécules.
- terme: spécificité
  definition: Propriété d'une enzyme qui n'agit que sur un seul type de molécule.
- terme: amylase
  definition: Enzyme de la salive et du suc pancréatique qui découpe l'amidon.
- terme: protéase
  definition: Enzyme qui découpe les protéines en acides aminés.
- terme: lipase
  definition: Enzyme qui découpe les lipides en acides gras et glycérol.
- terme: suc digestif
  definition: Liquide sécrété dans le tube digestif, qui contient des enzymes (salive, suc gastrique...).
- terme: eau iodée
  definition: Liquide qui devient bleu-noir en présence d'amidon.
- terme: tube témoin
  definition: Tube identique aux autres mais sans le facteur testé, qui sert de comparaison.
erreurs_frequentes:
- 'Croire que la digestion n''est que mécanique : un aliment finement broyé contient toujours de grosses molécules.'
- Penser qu'une enzyme est un être vivant ou un microbe, alors que c'est une molécule.
- Croire qu'une seule enzyme digère tous les aliments, alors que chaque enzyme est spécifique.
- 'Croire que la chaleur active toujours les enzymes : une température trop haute les détruit.'
- Oublier le tube témoin, ou changer deux facteurs à la fois dans une expérience.
exemple:
  enonce: On place de l'amidon avec de la salive à 37 °C. Au bout de 20 minutes, l'eau iodée ne devient plus bleu-noir et
    la liqueur de Fehling chauffée donne un précipité rouge brique. Que s'est-il passé ?
  solution: 'L''eau iodée montre que l''amidon a disparu. La liqueur de Fehling montre qu''un sucre plus petit est apparu.
    L''amylase de la salive a donc découpé l''amidon en petites molécules de sucre : c''est une digestion chimique.'
exercices:
- id: nom-des-decoupeuses
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on les molécules contenues dans les sucs digestifs qui découpent les grosses molécules des aliments
    en petites molécules ? Réponds par un mot.
  reponse:
    acceptees:
    - enzymes
    - enzyme
    - enzymes digestives
    - enzyme digestive
    fautes_tolerees: 1
  indices:
    relance: L'amylase, les protéases et les lipases en font partie. Quel nom commun les regroupe ?
    methode: 'Relis l''essentiel : ce sont des protéines fabriquées par l''organisme, présentes dans la salive ou le suc pancréatique.'
    etape: Ces molécules sont des protéines ; leur nom se termine par « -yme ». L'amylase en est un exemple.
  pieges:
  - si:
      valeur: bactéries
    relance: Les bactéries sont des êtres vivants. Ici, on parle de molécules fabriquées par nos propres glandes digestives.
      Comment les appelle-t-on ?
  - si:
      valeur: nutriments
    relance: Les nutriments sont le résultat du découpage. On te demande le nom des molécules qui font le découpage.
  - si:
      valeur: sucs digestifs
    relance: Les sucs digestifs sont les liquides. On cherche le nom des molécules qu'ils contiennent et qui découpent les
      aliments.
  solution: 'Ce sont les enzymes digestives : chacune découpe un type de grosse molécule en petites molécules.'
- id: enzyme-et-molecule
  type: association
  difficulte: 2
  enonce: Associe chaque enzyme à la grosse molécule qu'elle découpe. Réponds sous la forme a-1, b-2…
  reponse:
    gauche:
    - id: a
      texte: Amylase
    - id: b
      texte: Protéase
    - id: c
      texte: Lipase
    droite:
    - id: '1'
      texte: Amidon
    - id: '2'
      texte: Protéines
    - id: '3'
      texte: Lipides (graisses)
    - id: '4'
      texte: Fibres (cellulose)
    paires:
      a: '1'
      b: '2'
      c: '3'
  indices:
    relance: 'Regarde le début du nom de chaque enzyme : ne rappelle-t-il pas le nom de la molécule qu''elle découpe ?'
    methode: 'Une enzyme est spécifique : un seul type de molécule par enzyme. Une des molécules de droite n''est découpée
      par aucune de nos enzymes.'
    etape: « Lip- » se retrouve dans un mot de droite. Commence par cette association.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une association est fausse. Nos enzymes digestives découpent-elles les fibres ?
  - si:
      diagnostic: associations_fausses
    relance: 'Compare le début du nom de chaque enzyme avec les noms des molécules : « amyl- », « prot- », « lip- ».'
  solution: a-1 (l'amylase découpe l'amidon), b-2 (la protéase découpe les protéines), c-3 (la lipase découpe les lipides).
    Les fibres ne sont découpées par aucune de nos enzymes digestives.
- id: experience-trois-tubes
  type: choix
  difficulte: 2
  enonce: 'Document fictif : trois tubes contiennent de l''amidon et sont placés à 37 °C pendant 30 minutes. Tube A : amidon
    + amylase. Tube B : amidon + eau. Tube C : amidon + amylase chauffée avant à 100 °C. On ajoute ensuite de l''eau iodée
    : A reste jaune-orangé, B et C deviennent bleu-noir. Quelles conclusions sont justes ? Plusieurs réponses possibles.'
  reponse:
    options:
    - id: a
      texte: Dans le tube A, l'amidon a été digéré par l'amylase.
    - id: b
      texte: L'eau seule suffit à digérer l'amidon.
    - id: c
      texte: Une amylase chauffée à 100 °C ne découpe plus l'amidon.
    - id: d
      texte: L'amylase est un micro-organisme vivant.
    bonnes:
    - a
    - c
  indices:
    relance: Que signifie la couleur bleu-noir de l'eau iodée ? Dans quels tubes y a-t-il encore de l'amidon ?
    methode: Compare chaque tube au tube B, le témoin sans enzyme. Un seul facteur change à chaque fois.
    etape: 'Dans le tube B, l''eau iodée devient bleu-noir : l''amidon est toujours là. Que peux-tu dire de l''eau seule ?'
  pieges:
  - si:
      contient:
      - b
    relance: 'Regarde le tube B, qui ne contient que de l''eau : l''amidon a-t-il disparu ?'
  - si:
      contient:
      - d
    relance: Le document ne parle que de molécules. Une enzyme est-elle un être vivant ou une molécule ?
  - si:
      diagnostic: incomplet
    relance: Il manque une conclusion. Qu'apprend-on en comparant le tube C au tube A ?
  solution: 'A : l''eau iodée ne bleuit pas, l''amidon a été digéré par l''amylase. B (témoin) : l''amidon est resté, l''eau
    seule ne le digère pas. C : l''amidon est resté, l''amylase chauffée à 100 °C ne fonctionne plus. L''amylase est une molécule,
    pas un être vivant. Conclusions justes : a et c.'
- id: vitesse-et-temperature
  type: nombre
  difficulte: 2
  enonce: 'Document fictif : on mesure le temps nécessaire pour que l''amylase fasse disparaître tout l''amidon d''un tube.
    À 20 °C, il faut 24 minutes. À 37 °C, il faut 8 minutes. Combien de fois l''amylase est-elle plus rapide à 37 °C qu''à
    20 °C ? Écris seulement le nombre.'
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Plus le temps est court, plus l'enzyme est rapide. Quel calcul compare deux durées « combien de fois » ?
    methode: Divise la durée la plus longue par la durée la plus courte.
    etape: 'Il faut calculer 24 ÷ 8 : combien de fois 8 minutes dans 24 minutes ?'
  pieges:
  - si:
      valeur: 16
    relance: 'Tu as calculé une différence de durées. La question demande « combien de fois plus rapide » : quelle opération
      faut-il ?'
  - si:
      diagnostic: valeur_fausse
    relance: Divise la durée à 20 °C par la durée à 37 °C, et vérifie en multipliant.
  solution: 24 ÷ 8 = 3. L'amylase est 3 fois plus rapide à 37 °C, la température du corps, qu'à 20 °C.
- id: du-pain-au-sang
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes qui mènent de l'amidon du pain jusqu'au sang.
  reponse:
    elements:
    - id: mastication
      texte: Le pain est mâché et mélangé à la salive
    - id: amylase-salive
      texte: L'amylase de la salive commence à découper l'amidon
    - id: suc-pancreatique
      texte: Dans l'intestin grêle, les enzymes des sucs digestifs terminent le découpage
    - id: glucose
      texte: Il ne reste plus que du glucose, une petite molécule
    - id: absorption
      texte: Le glucose traverse la paroi de l'intestin grêle et passe dans le sang
  indices:
    relance: Où commence la digestion de l'amidon, et où se termine-t-elle ?
    methode: 'Suis le trajet de l''aliment : bouche, puis intestin grêle. La molécule devient de plus en plus petite, puis
      passe dans le sang.'
    etape: La première étape se passe dans la bouche, avec les dents. Laquelle vient juste après ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Le glucose peut-il passer dans le sang avant d'avoir été obtenu ?
  - si:
      diagnostic: ordre_faux
    relance: 'Reprends dans l''ordre du tube digestif : d''abord la bouche, puis l''intestin grêle, et le passage dans le
      sang en dernier.'
  solution: Mastication avec la salive, début du découpage de l'amidon par l'amylase salivaire, fin du découpage dans l'intestin
    grêle, obtention du glucose, puis absorption du glucose dans le sang.
- id: couleur-eau-iodee
  type: texte_court
  difficulte: 1
  enonce: On ajoute de l'eau iodée à de l'empois d'amidon (de l'amidon cuit dans de l'eau). Quelle couleur prend le mélange
    ? Réponds par deux mots.
  reponse:
    acceptees:
    - bleu-noir
    - bleu noir
    - bleu-noire
    - noir bleuté
    fautes_tolerees: 1
  indices:
    relance: L'eau iodée sert à détecter l'amidon. Que se passe-t-il quand il y en a ?
    methode: 'Relis les deux tests de la fiche : lequel détecte l''amidon, et quel changement de couleur l''indique ?'
    etape: Sans amidon, l'eau iodée reste jaune-orangé. Avec de l'amidon, la couleur devient très foncée.
  pieges:
  - si:
      valeur: rouge brique
    relance: Le rouge brique est la couleur du précipité de la liqueur de Fehling. Ici, on utilise l'eau iodée.
  - si:
      valeur: jaune
    relance: Le jaune-orangé est la couleur de l'eau iodée seule, sans amidon. Que devient-elle quand l'amidon est présent
      ?
  solution: L'eau iodée devient bleu-noir en présence d'amidon. C'est le test de reconnaissance de l'amidon.
- id: amylase-et-proteines
  type: choix
  difficulte: 3
  enonce: 'Document fictif : on place du blanc d''œuf cuit (riche en protéines) avec de l''amylase, à 37 °C, pendant plusieurs
    heures. Le blanc d''œuf n''est pas digéré. Quelles conclusions sont justes ? (plusieurs réponses possibles)'
  reponse:
    options:
    - id: k
      texte: 'L''amylase ne découpe pas les protéines : elle est spécifique de l''amidon.'
    - id: w
      texte: La température de 37 °C est trop basse pour qu'une enzyme agisse.
    - id: x
      texte: Pour digérer les protéines, il faut une autre enzyme, une protéase.
    - id: z
      texte: Les protéines ne peuvent pas être digérées par l'organisme.
    bonnes:
    - k
    - x
  indices:
    relance: 'Rappelle-toi la propriété d''une enzyme : agit-elle sur tous les aliments ?'
    methode: Relie chaque enzyme à la molécule qu'elle découpe, puis regarde laquelle est utilisée ici et sur quoi.
    etape: L'amylase est mise avec des protéines. Quelle enzyme correspond aux protéines ?
  pieges:
  - si:
      contient:
      - w
    relance: 37 °C est justement la température de l'organisme, où les enzymes agissent vite. Cherche une autre explication.
  - si:
      contient:
      - z
    relance: Les protéines sont digérées dans l'estomac et l'intestin par d'autres enzymes. Laquelle ?
  - si:
      diagnostic: incomplet
    relance: Tu as une bonne réponse, mais il en manque une. Pense à la spécificité et à l'enzyme qui convient aux protéines.
  solution: 'Chaque enzyme est spécifique : l''amylase découpe l''amidon, pas les protéines. Pour digérer le blanc d''œuf,
    il faut une protéase. La température de 37 °C est favorable aux enzymes.'
- id: digestion-pas-que-mecanique
  type: ouverte
  difficulte: 3
  enonce: 'Un élève affirme : « Digérer, c''est seulement écraser les aliments. » Document fictif : du pain mixé très finement
    dans de l''eau, laissé 30 minutes à 37 °C, donne toujours une couleur bleu-noir avec l''eau iodée. Le même pain mixé avec
    de la salive, dans les mêmes conditions, ne donne plus de couleur bleu-noir, et la liqueur de Fehling chauffée donne un
    précipité rouge brique. Utilise ce document pour montrer que l''élève a tort.'
  criteres:
  - 'L''élève interprète les tests : l''amidon reste avec l''eau seule, il disparaît et un sucre apparaît avec la salive.'
  - L'élève explique que le broyage ne change pas les molécules, alors que l'amylase de la salive découpe l'amidon en petites
    molécules.
  - L'élève conclut que la digestion est aussi chimique, grâce aux enzymes, et pas seulement mécanique.
  indices:
    relance: Le pain est broyé dans les deux cas. Qu'est-ce qui change entre les deux expériences ?
    methode: Traduis chaque résultat de test en phrase (« il y a encore de l'amidon », « un sucre est apparu »), puis compare
      les deux expériences.
    etape: Avec l'eau seule, l'eau iodée devient bleu-noir. Le broyage a-t-il fait disparaître l'amidon ?
  solution: 'Avec l''eau seule, le pain est broyé mais l''eau iodée montre que l''amidon est toujours là : écraser ne suffit
    pas. Avec la salive, l''amidon a disparu et un sucre est apparu : l''amylase de la salive a découpé l''amidon en petites
    molécules. La digestion n''est donc pas seulement mécanique : elle est aussi chimique, grâce aux enzymes.'
- id: nblm-d-apres-la-fiche-de-cours-qu-est-ce-qu-u-1
  type: choix
  difficulte: 2
  enonce: D'après la fiche de cours, qu'est-ce qu'une enzyme digestive d'un point de vue biologique ?
  reponse:
    options:
    - id: o1
      texte: Une molécule produite par l'organisme qui découpe une grosse molécule en molécules plus petites.
    - id: o2
      texte: Un micro-organisme vivant qui grignote et détruit les aliments dans le tube digestif.
    - id: o3
      texte: Une cellule spécialisée présente dans les sucs digestifs qui absorbe directement les nutriments.
    - id: o4
      texte: Un minerai apporté par la nourriture qui broie mécaniquement les repas.
    bonnes:
    - o1
  indices:
    relance: Pense à la nature chimique des substances contenues dans les sucs digestifs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : une enzyme n''est ni un être vivant ni un microbe, mais une simple molécule.'
  - si:
      contient:
      - o3
    relance: Une enzyme est une molécule biologique synthétisée par l'organisme, et non une cellule.
  - si:
      contient:
      - o4
    relance: L'enzyme réalise un découpage chimique et est produite par le corps, ce n'est pas un minerai.
  solution: 'Une molécule produite par l''organisme qui découpe une grosse molécule en molécules plus petites. C''est exact
    : une enzyme digestive est une protéine fabriquée par le corps pour assurer la digestion chimique.'
- id: nblm-quel-est-le-role-specifique-de-l-amylase-2
  type: choix
  difficulte: 2
  enonce: Quel est le rôle spécifique de l'amylase salivaire dans le tube digestif ?
  reponse:
