format: 2
notion: mecanismes-moleculaires-digestion
version: 1
etat: verifiee
declencheurs:
- enzyme digestive
- amylase salivaire
- comment les molécules sont découpées
- grosses molécules en petites molécules
- pain qui a un goût sucré
prerequis:
- devenir-aliments-tube-digestif
essentiel: 'À l''échelle moléculaire, la digestion consiste à découper les grosses molécules complexes des aliments (comme
  l''amidon, les protéines ou les graisses) en molécules plus simples (glucose, acides aminés, acides gras) que l''organisme
  peut absorber et utiliser.


  Ce découpage est réalisé par des enzymes digestives, des protéines spécialisées produites par différents organes du tube
  digestif (glandes salivaires, estomac, pancréas, intestin), chacune agissant sur un type précis de molécule.


  Chaque enzyme est spécifique d''une molécule ou d''un type de liaison chimique : par exemple, l''amylase (présente dans
  la salive) découpe spécifiquement l''amidon en molécules de sucre plus petites, elle n''agit pas sur les protéines.


  L''action des enzymes digestives explique pourquoi la digestion transforme progressivement les aliments tout au long du
  tube digestif, chaque étape apportant de nouvelles enzymes adaptées aux molécules restant à découper.


  Sans ces enzymes, les grosses molécules des aliments resteraient trop volumineuses pour traverser la paroi intestinale et
  ne pourraient pas être absorbées dans le sang.'
methode:
- Identifier le type de molécule à digérer (amidon, protéine, graisse) et l'enzyme correspondante.
- 'Retenir qu''une enzyme est spécifique : elle n''agit que sur un type précis de molécule.'
- Relier la localisation d'une enzyme (salive, estomac, intestin) à l'étape de digestion à laquelle elle intervient.
- Relier le découpage moléculaire réalisé par les enzymes à la nécessité d'obtenir des molécules assez petites pour être absorbées.
vocabulaire:
- terme: enzyme
  definition: protéine qui accélère le découpage d'une molécule alimentaire en molécules plus simples
- terme: amylase
  definition: enzyme présente dans la salive qui découpe spécifiquement l'amidon
erreurs_frequentes:
- Croire qu'une seule enzyme suffit pour digérer tous les types d'aliments.
- Penser que la digestion se fait uniquement par une action mécanique (mastication, brassage), sans intervention chimique
  des enzymes.
- Confondre enzyme (protéine qui accélère une transformation chimique) et nutriment (produit de cette transformation).
- Croire que les enzymes digestives agissent au hasard sur n'importe quelle molécule rencontrée.
exemple:
  enonce: En mâchant longuement un morceau de pain (riche en amidon), on perçoit un goût légèrement sucré apparaître en bouche.
    Pourquoi ?
  solution: La salive contient une enzyme, l'amylase, qui commence à découper l'amidon du pain en molécules de sucre plus
    petites dès la mastication, ce qui explique ce goût sucré qui apparaît progressivement.
exercices:
- id: mot-amylase
  type: texte_court
  difficulte: 1
  enonce: Quelle enzyme, présente dans la salive, commence la digestion de l'amidon dès la bouche ?
  reponse:
    acceptees:
    - amylase
    - amylase salivaire
    fautes_tolerees: 1
  indices:
    relance: Le nom de cette enzyme rappelle celui de la molécule qu'elle découpe (l'amidon).
    methode: Relis l'exemple de ta leçon sur le pain mâché qui devient légèrement sucré.
    etape: Cette enzyme est présente dans la salive, avant même que l'aliment n'atteigne l'estomac.
  pieges:
  - si:
      valeur: enzyme
    relance: Une enzyme est une catégorie générale de protéines ; le mot cherché est le nom précis de celle qui agit sur l'amidon
      dans la salive.
  solution: L'amylase (amylase salivaire) commence la digestion de l'amidon dès la bouche.
- id: role-enzymes-digestion
  type: choix
  difficulte: 1
  enonce: Que fait une enzyme digestive dans le tube digestif ?
  reponse:
    options:
    - id: a
      texte: Elle transporte les nutriments dans le sang
    - id: b
      texte: Elle découpe une grosse molécule alimentaire en molécules plus simples
    - id: c
      texte: Elle stocke les résidus non digérés
    - id: d
      texte: Elle broie mécaniquement les aliments comme les dents
    bonnes:
    - b
  indices:
    relance: L'action d'une enzyme est de nature chimique, pas mécanique ni de transport.
    methode: Repense à l'exemple de l'amylase qui découpe l'amidon en molécules de sucre plus petites.
    etape: Élimine d'abord les réponses qui décrivent une action mécanique (mastication) ou un transport (sang).
  pieges:
  - si:
      contient:
      - a
    relance: Le transport des nutriments dans le sang est un rôle du système sanguin, pas de l'enzyme elle-même.
  - si:
      contient:
      - d
    relance: Le broyage mécanique est réalisé par les dents et les mouvements du tube digestif, pas par une action chimique
      d'enzyme.
  solution: Une enzyme digestive découpe chimiquement une grosse molécule alimentaire en molécules plus simples.
- id: associer-enzymes-organes
  type: association
  difficulte: 2
  enonce: Relie chaque notion à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Enzyme
    - id: b
      texte: Amylase
    - id: c
      texte: Spécificité d'une enzyme
    - id: d
      texte: Amidon
    droite:
    - id: x
      texte: Molécule complexe présente notamment dans le pain
    - id: y
      texte: Protéine qui accélère le découpage d'une molécule alimentaire
    - id: z
      texte: Fait qu'une enzyme n'agit que sur un type précis de molécule
    - id: w
      texte: Enzyme de la salive qui découpe spécifiquement l'amidon
    paires:
      a: y
      b: w
      c: z
      d: x
  indices:
    relance: Repère d'abord ce qui désigne une catégorie générale (enzyme) et ce qui désigne une enzyme précise (amylase).
    methode: Distingue ensuite la molécule découpée (amidon) de la propriété des enzymes qui explique pourquoi elles n'agissent
      pas sur tout (spécificité).
    etape: L'amylase est un exemple précis d'enzyme, spécifique à l'amidon.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier enzyme (catégorie) et amylase (exemple précis).
  - si:
      diagnostic: associations_fausses
    relance: Reprends depuis le début en distinguant la catégorie générale (enzyme) de l'exemple précis (amylase).
  solution: Enzyme = protéine qui découpe une molécule alimentaire ; Amylase = enzyme de la salive spécifique de l'amidon
    ; Spécificité = une enzyme n'agit que sur un type précis de molécule ; Amidon = molécule complexe présente dans le pain.
- id: ordre-digestion-amidon-bouche
  type: ordre
  difficulte: 2
  enonce: Range les étapes de la digestion de l'amidon du pain dès la bouche, telle que décrite dans l'exemple de la leçon.
  reponse:
    elements:
    - id: mastication
      texte: Le pain est mâché et mélangé à la salive dans la bouche
    - id: contact-amylase
      texte: L'amylase salivaire entre en contact avec l'amidon du pain
    - id: decoupage
      texte: L'amylase découpe l'amidon en molécules de sucre plus petites
    - id: gout-sucre
      texte: Un goût légèrement sucré apparaît progressivement en bouche
  indices:
    relance: Le goût sucré n'apparaît qu'après l'action chimique de l'enzyme, pas dès la mise en bouche.
    methode: Place d'abord la mastication, puis le contact avec l'enzyme, puis le découpage chimique, puis le résultat perceptible
      (le goût).
    etape: Le découpage moléculaire par l'amylase a lieu avant que le goût sucré ne soit perçu, pas après.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Le contact avec l'amylase a-t-il lieu avant ou après le découpage de l'amidon
      ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le point de départ (mastication) et le résultat final perçu (goût sucré), puis place les deux
      étapes chimiques intermédiaires.
  solution: D'abord la mastication du pain avec la salive, puis le contact de l'amylase avec l'amidon, puis le découpage de
    l'amidon en sucres plus simples, puis l'apparition d'un goût sucré.
- id: expliquer-necessite-decoupage-enzymatique
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi les grosses molécules des aliments doivent être découpées par des enzymes avant de pouvoir être
    absorbées par l'intestin, en utilisant l'exemple de l'amidon et de l'amylase.
  criteres:
  - L'élève explique que les grosses molécules alimentaires sont trop volumineuses pour traverser la paroi intestinale telles
    quelles.
  - L'élève relie le découpage enzymatique (exemple de l'amylase sur l'amidon) à l'obtention de molécules plus simples.
  - L'élève explique que seules les molécules simples issues de ce découpage peuvent être absorbées dans le sang.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense à la taille des molécules qui peuvent traverser la paroi intestinale.
    methode: Commence par rappeler que les grosses molécules ne peuvent pas être absorbées telles quelles, puis explique le
      rôle de l'enzyme avec l'exemple de l'amylase, avant de conclure sur l'absorption finale.
    etape: L'amidon est une grosse molécule ; l'amylase la découpe en molécules de sucre plus petites, qui peuvent ensuite
      être absorbées.
  solution: 'Les grosses molécules des aliments, comme l''amidon, sont trop volumineuses pour traverser directement la paroi
    intestinale et passer dans le sang. C''est pourquoi des enzymes digestives, comme l''amylase présente dans la salive,
    découpent ces grosses molécules en molécules plus simples : l''amylase transforme ainsi l''amidon en molécules de sucre
    plus petites. Une fois découpées en molécules suffisamment simples, ces dernières peuvent traverser la paroi de l''intestin
    grêle et être absorbées dans le sang, ce qui ne serait pas possible sans l''action préalable des enzymes.'
