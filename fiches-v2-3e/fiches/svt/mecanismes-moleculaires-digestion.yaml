    relance: Le test à la liqueur de Fehling nécessite un chauffage pour révéler le sucre.
  solution: 'La liqueur de Fehling chauffée forme un précipité rouge brique. C''est correct : la formation d''un précipité
    rouge brique avec la liqueur de Fehling chauffée indique la présence de petits sucres.'
- id: nblm-que-se-passe-t-il-pour-une-enzyme-digest-5
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il pour une enzyme digestive si on la soumet à une forte chaleur ?
  reponse:
    options:
    - id: o1
      texte: L'enzyme est détruite définitivement et perd toute son activité.
    - id: o2
      texte: L'enzyme accélère son action de découpage de façon illimitée.
    - id: o3
      texte: L'enzyme ralentit mais reprend son fonctionnement normal dès qu'on la refroidit.
    - id: o4
      texte: L'enzyme se multiplie pour devenir un être vivant autonome.
    bonnes:
    - o1
  indices:
    relance: Distingue l'effet réversible du froid de l'effet irréversible des hautes températures.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Les températures trop élevées dénaturent l'enzyme au lieu d'accélérer la réaction.
  - si:
      contient:
      - o3
    relance: C'est le froid qui ralentit temporairement l'enzyme ; la forte chaleur la détruit définitivement.
  - si:
      contient:
      - o4
    relance: Une enzyme n'est pas un être vivant et ne peut pas se multiplier.
  solution: 'L''enzyme est détruite définitivement et perd toute son activité. C''est exact : une forte chaleur détruit la
    molécule d''enzyme de façon irréversible.'
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant les tests de mise en évidence au laboratoire lors de la digestion
    de l'amidon ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'eau iodée devient bleu-noir en présence d'amidon.
    - id: o2
      texte: La liqueur de Fehling chauffée donne un précipité rouge brique en présence de certains sucres comme le glucose.
    - id: o3
      texte: L'eau iodée donne un précipité rouge brique en présence de glucose.
    - id: o4
      texte: La liqueur de Fehling s'utilise toujours à froid sans chauffage.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense au réactif qui réagit à froid avec la grosse molécule et à celui qui réagit à chaud avec les petits sucres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Confusion de réactif : c''est la liqueur de Fehling chauffée qui produit le précipité rouge brique.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la réaction avec la liqueur de Fehling nécessite obligatoirement d''être chauffée.'
  solution: 'L''eau iodée devient bleu-noir en présence d''amidon ; La liqueur de Fehling chauffée donne un précipité rouge
    brique en présence de certains sucres comme le glucose. C''est exact : l''eau iodée est l''indicateur spécifique de la
    présence d''amidon.'
