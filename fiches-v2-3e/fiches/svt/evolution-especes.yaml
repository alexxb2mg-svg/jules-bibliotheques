format: 2
notion: evolution-especes
version: 1
etat: verifiee
declencheurs:
- théorie de l'évolution
- Darwin sélection naturelle
- espèces disparues fossiles
- apparition de nouvelles espèces
- papillons couleur pollution
- ancêtre commun chimpanzé
prerequis: []
essentiel: 'L''évolution biologique est l''ensemble des modifications des espèces vivantes au cours du temps, avec l''apparition
  progressive de nouvelles espèces et la disparition d''autres ; ce processus est très lent, se manifestant sur des dizaines
  ou des centaines de milliers d''années.


  Les fossiles, restes ou traces d''organismes conservés dans les roches, apportent des preuves concrètes de l''évolution
  : ils montrent que des espèces différentes de celles d''aujourd''hui ont existé, et permettent de retracer des filiations
  entre espèces anciennes et actuelles.


  Charles Darwin propose en 1859 la théorie de la sélection naturelle pour expliquer les mécanismes de l''évolution : au sein
  d''une population, les individus présentent des variations de caractères ; ceux dont les caractères sont les mieux adaptés
  aux contraintes du milieu ont plus de chances de survivre et de se reproduire, transmettant ces caractères favorables à
  leur descendance.


  La sélection naturelle est un phénomène passif : elle ne « choisit » rien consciemment, elle résulte simplement du fait
  que certains individus survivent et se reproduisent mieux que d''autres dans un contexte donné (une pression de sélection).


  Le hasard joue aussi un rôle dans l''évolution, notamment par les mutations génétiques qui créent la variation de départ
  sur laquelle la sélection naturelle peut ensuite agir. L''être humain (Homo sapiens) partage avec le chimpanzé actuel un
  ancêtre commun aujourd''hui disparu, plutôt que d''en descendre directement.'
methode:
- Utiliser les fossiles comme preuves d'espèces disparues et d'une évolution au cours du temps.
- Repérer une variation de caractères au sein d'une population avant d'expliquer une évolution par sélection naturelle.
- Identifier la pression de sélection (contrainte du milieu) qui avantage certains individus par rapport à d'autres.
- Ne jamais présenter la sélection naturelle comme un choix conscient ou une volonté d'adaptation des individus.
vocabulaire:
- terme: sélection naturelle
  definition: mécanisme par lequel les individus les mieux adaptés au milieu survivent et se reproduisent davantage
- terme: fossile
  definition: reste ou trace d'un organisme ancien conservé dans une roche
erreurs_frequentes:
- Croire que les individus « choisissent » de s'adapter à leur environnement (c'est un phénomène passif, pas volontaire).
- Penser que l'évolution vise un but ou une amélioration constante vers plus de complexité.
- Confondre évolution d'une espèce (sur des générations) et adaptation individuelle au cours d'une vie (par exemple le bronzage
  n'est pas transmis génétiquement).
- Croire que l'être humain descend directement des chimpanzés actuels, plutôt que de partager avec eux un ancêtre commun disparu.
exemple:
  enonce: Pourquoi, chez une population de papillons dont la couleur des ailes varie, la proportion de papillons foncés augmente-t-elle
    si l'environnement s'assombrit (par exemple, la pollution des arbres) ?
  solution: 'Les papillons foncés sont mieux camouflés dans un environnement sombre, donc moins repérés par les prédateurs
    : ils survivent davantage et se reproduisent plus, transmettant leur couleur à leur descendance. Au fil des générations,
    la proportion de papillons foncés augmente dans la population : c''est un exemple de sélection naturelle.'
exercices:
- id: annee-darwin
  type: nombre
  difficulte: 1
  enonce: En quelle année Charles Darwin publie-t-il sa théorie de la sélection naturelle ?
  reponse:
    valeur: 1859
    forme: entier
  indices:
    relance: C'est au milieu du XIXe siècle, dans un livre intitulé L'Origine des espèces.
    methode: Cherche dans ta leçon la date associée au nom de Darwin et à son livre.
    etape: L'année se situe entre 1850 et 1860.
  pieges:
  - si:
      valeur: 1848
    relance: Cette année correspond à une autre période historique. Vérifie la date exacte de la publication du livre de Darwin.
  - si:
      valeur: 1900
    relance: 'C''est trop tardif : Darwin a publié sa théorie au XIXe siècle, avant 1860.'
  solution: Charles Darwin publie sa théorie de la sélection naturelle en 1859, dans son livre L'Origine des espèces.
- id: role-fossiles
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne un reste ou une trace d'organisme ancien conservé dans une roche, et qui prouve l'évolution des
    espèces ?
  reponse:
    acceptees:
    - fossile
    fautes_tolerees: 1
  indices:
    relance: On en trouve parfois dans les falaises ou les carrières.
    methode: Relis la partie de ta leçon consacrée aux preuves de l'évolution.
    etape: Ce mot désigne des restes très anciens, parfois vieux de millions d'années.
  pieges:
  - si:
      valeur: roche
    relance: La roche est le support qui conserve la trace, mais le mot cherché désigne la trace elle-même de l'organisme.
  solution: Un fossile est un reste ou une trace d'organisme ancien conservé dans une roche.
- id: nature-selection-naturelle
  type: choix
  difficulte: 2
  enonce: Quelle affirmation décrit correctement la sélection naturelle ?
  reponse:
    options:
    - id: a
      texte: Les individus choisissent consciemment de développer des caractères utiles
    - id: b
      texte: Les individus les mieux adaptés au milieu survivent et se reproduisent davantage
    - id: c
      texte: L'évolution vise toujours à rendre les espèces plus complexes
    - id: d
      texte: La sélection naturelle agit seulement sur les espèces animales, jamais sur les végétales
    bonnes:
    - b
  indices:
    relance: Pense au caractère passif du mécanisme, sans volonté ni but.
    methode: Élimine d'abord les réponses qui évoquent un choix conscient ou un objectif de complexité croissante.
    etape: La bonne réponse relie la survie et la reproduction différentielle des individus à leurs caractères.
  pieges:
  - si:
      contient:
      - a
    relance: 'Les individus ne choisissent rien consciemment : la sélection naturelle est un phénomène passif.'
  - si:
      contient:
      - c
    relance: L'évolution ne vise aucun but ni amélioration constante vers plus de complexité.
  - si:
      contient:
      - d
    relance: La sélection naturelle agit sur tous les êtres vivants, animaux comme végétaux.
  solution: 'La sélection naturelle est un phénomène passif : les individus dont les caractères sont les mieux adaptés au
    milieu ont statistiquement plus de chances de survivre et de se reproduire.'
- id: associer-notions-evolution
  type: association
  difficulte: 2
  enonce: Relie chaque terme à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Fossile
    - id: b
      texte: Sélection naturelle
    - id: c
      texte: Pression de sélection
    - id: d
      texte: Ancêtre commun
    droite:
    - id: x
      texte: Contrainte du milieu qui avantage certains caractères
    - id: y
      texte: Reste ou trace d'un organisme ancien conservé dans une roche
    - id: z
      texte: Espèce disparue dont descendent deux espèces actuelles différentes
    - id: w
      texte: Survie et reproduction différentielle des individus selon leurs caractères
    paires:
      a: y
      b: w
      c: x
      d: z
  indices:
    relance: Repère d'abord le terme qui désigne une trace conservée dans une roche.
    methode: Traite un terme à la fois, en éliminant les définitions déjà utilisées.
    etape: La pression de sélection est une contrainte (climat, prédateurs...), pas un résultat.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier sélection naturelle et pression de sélection, souvent
      confondues.
  - si:
      diagnostic: associations_fausses
    relance: Reprends depuis le début en distinguant la contrainte du milieu (pression de sélection) et son résultat (sélection
      naturelle).
  solution: Fossile = trace conservée dans une roche ; Sélection naturelle = survie différentielle selon les caractères ;
    Pression de sélection = contrainte du milieu ; Ancêtre commun = espèce disparue à l'origine de deux espèces actuelles.
- id: ordre-mecanisme-selection
  type: ordre
  difficulte: 3
  enonce: Range les étapes du mécanisme de sélection naturelle chez les papillons dont l'environnement s'assombrit.
  reponse:
    elements:
    - id: variation
      texte: La population de papillons présente naturellement des couleurs d'ailes variées
    - id: pression
      texte: L'environnement s'assombrit, les papillons clairs deviennent plus visibles pour les prédateurs
    - id: survie
      texte: Les papillons foncés, mieux camouflés, survivent davantage et se reproduisent plus
    - id: proportion
      texte: La proportion de papillons foncés augmente dans la population au fil des générations
  indices:
    relance: Le point de départ est toujours une variation déjà présente dans la population, avant tout changement du milieu.
    methode: Place d'abord la variation initiale, puis le changement du milieu, puis ses conséquences sur la survie, puis
      le résultat sur plusieurs générations.
    etape: La variation des couleurs existe avant que l'environnement ne s'assombrisse ; ce n'est pas une réponse au changement.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Le changement du milieu a-t-il lieu avant ou après l'apparition de la variation
      des couleurs ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la situation de départ (variation déjà présente), puis le changement du milieu, avant de placer
      les conséquences.
  solution: D'abord la variation de couleur déjà présente dans la population, puis l'assombrissement du milieu, puis la meilleure
    survie et reproduction des papillons foncés, puis l'augmentation de leur proportion au fil des générations.
- id: expliquer-selection-naturelle
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi on dit que la sélection naturelle est un phénomène « passif », en utilisant l'exemple des papillons
    dont la couleur varie selon la pollution de leur environnement.
  criteres:
  - L'élève explique qu'aucun individu ni aucune force extérieure ne choisit consciemment qui survit.
  - L'élève relie la survie différentielle des papillons foncés à leur meilleur camouflage dans un environnement sombre.
  - L'élève précise que ce sont les caractères déjà présents dans la population qui sont favorisés, sans apparition volontaire
    d'un nouveau caractère.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense à ce que signifie « passif » pour un mécanisme biologique.
    methode: Commence par définir la sélection naturelle, puis applique-la à l'exemple des papillons, avant de conclure sur
      le caractère passif du mécanisme.
    etape: Rappelle d'abord que la variation de couleur existait déjà dans la population avant tout changement du milieu.
  solution: La sélection naturelle est dite « passive » car aucun individu ni aucune force extérieure ne décide consciemment
    qui doit survivre. Chez les papillons, la variation de couleur des ailes existait déjà dans la population avant que l'environnement
    ne s'assombrisse. Une fois le milieu assombri, les papillons foncés, mieux camouflés face aux prédateurs, ont simplement
    statistiquement plus de chances de survivre et de se reproduire que les papillons clairs, plus repérables. Au fil des
    générations, la proportion de papillons foncés augmente donc naturellement, sans qu'aucun individu n'ait choisi ni développé
    volontairement cette couleur.
