format: 2
notion: evolution-especes
version: 2
etat: verifiee
declencheurs:
- espèces disparues
- extinction des dinosaures
- premiers êtres vivants
- survie des mieux adaptés
- couches de roches fossiles
- Darwin
- fossiles dans les roches
- apparition de nouvelles espèces
- mutation au hasard
prerequis:
- diversite-stabilite-genetique
- 4e-evolution-especes
essentiel: 'Les fossiles sont des restes ou des traces d''êtres vivants conservés dans les roches (coquilles, os, empreintes
  de pas...). Ils montrent que les espèces n''ont pas toujours été les mêmes.


  Des espèces sont apparues, d''autres ont disparu (extinction). Par exemple, les dinosaures ont disparu il y a environ 66
  millions d''années, sauf la lignée des oiseaux. Les humains n''ont pas vécu en même temps que les dinosaures.


  Les roches sédimentaires se déposent en couches. Si elles n''ont pas été retournées, la couche du bas est la plus ancienne
  et celle du haut la plus récente. Les fossiles d''une couche sont donc plus anciens que ceux de la couche au-dessus.


  La Terre a environ 4,6 milliards d''années. Les plus anciennes traces de vie connues ont environ 3,5 milliards d''années
  : ce sont des êtres vivants microscopiques, d''une seule cellule.


  Mécanismes de l''évolution.

  - Dans une population, les individus sont tous un peu différents. Des mutations apparaissent au hasard dans leur ADN et
  créent de nouveaux allèles.

  - Dans un milieu donné, les individus qui ont des caractères avantageux survivent et se reproduisent davantage. Ils transmettent
  plus souvent leurs allèles. Au fil des générations, ces caractères deviennent plus fréquents : c''est la sélection naturelle.
  Les formes aptes à se reproduire se maintiennent.

  - Le hasard joue aussi : une catastrophe (incendie, tempête) peut éliminer des individus sans tenir compte de leurs caractères.


  L''évolution n''a pas de but. Un individu ne se transforme pas pendant sa vie pour s''adapter. La variation existe avant
  que le milieu ne change : le milieu ne crée pas les mutations, il trie.


  Au brevet : on te donne des fossiles ou une population avec un changement de milieu. Tu dois expliquer, dans l''ordre :
  variation au hasard, avantage dans le milieu, reproduction et transmission.

  '
methode:
- Pour dater des fossiles relativement, se rappeler qu'une couche de roche située dessous est plus ancienne que celle du dessus.
- Repérer l'apparition (premier fossile) et la disparition (dernier fossile) de chaque espèce.
- Pour expliquer un changement dans une population, citer dans l'ordre la variation due au hasard, l'avantage dans le milieu,
  la reproduction et la transmission.
- Calculer si besoin la proportion d'individus (nombre ÷ effectif total) avant et après pour montrer le changement.
- Vérifier qu'on ne dit jamais qu'un être vivant « décide » ou « cherche » à s'adapter.
vocabulaire:
- terme: fossile
  definition: Reste ou trace d'un être vivant conservé dans une roche.
- terme: sélection naturelle
  definition: 'Tri par le milieu : les individus aux caractères avantageux se reproduisent davantage et transmettent plus
    leurs allèles.'
- terme: extinction
  definition: Disparition définitive de tous les individus d'une espèce.
- terme: mutation
  definition: Modification au hasard de l'ADN, qui peut créer un nouvel allèle.
- terme: allèle
  definition: Version d'un gène.
- terme: évolution
  definition: Changement des espèces au fil des générations.
- terme: couche de roche
  definition: Dépôt de sédiments ; dans une série non retournée, la couche du bas est la plus ancienne.
erreurs_frequentes:
- Croire que les êtres vivants se transforment volontairement pour s'adapter à leur milieu.
- Penser que l'évolution a un but, ou qu'elle mène vers des espèces « parfaites ».
- Oublier que la variation (mutation) existe avant que le milieu ne change ; le milieu ne crée pas les mutations, il trie.
- Croire que les humains ont vécu en même temps que les dinosaures.
- 'Croire que la couche du haut est la plus ancienne : dans une série non retournée, c''est celle du bas.'
exemple:
  enonce: Dans une forêt, un champignon tue une partie des arbres d'une espèce. Quelques arbres, qui portaient déjà par hasard
    un allèle de résistance, survivent. Que devient la population d'arbres au fil des générations ?
  solution: 'Les arbres résistants survivent et se reproduisent ; ils transmettent l''allèle de résistance à leurs descendants.
    Génération après génération, la part d''arbres résistants augmente : c''est la sélection naturelle. L''allèle existait
    avant l''arrivée du champignon.'
exercices:
- id: nom-traces-roches
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on les restes ou les traces d'êtres vivants conservés dans les roches ?
  reponse:
    acceptees:
    - fossiles
    - fossile
    fautes_tolerees: 1
  indices:
    relance: 'Une coquille ou une empreinte de feuille retrouvée dans une pierre : quel nom leur donne-t-on ?'
    methode: 'Pense aux squelettes de dinosaures exposés dans les musées : de quoi s''agit-il ?'
    etape: Le mot commence par « fo » ; on l'emploie aussi pour le charbon et le pétrole, formés à partir d'anciens êtres
      vivants.
  pieges:
  - si:
      valeur: roche
    relance: La roche est ce qui entoure et conserve la trace. Comment s'appelle la trace elle-même ?
  - si:
      valeur: squelette
    relance: Un squelette peut en faire partie, mais une empreinte de pas aussi. Quel mot désigne toutes ces traces ?
  solution: Ce sont des fossiles. Ils prouvent que des espèces ont vécu autrefois, parfois très différentes des espèces actuelles.
- id: pourcentage-scarabees
  type: nombre
  difficulte: 2
  enonce: 'Document (fictif) : sur une île au sol brun, on compte 200 scarabées d''une même espèce. Au début, 50 sont bruns
    et 150 sont verts. Des oiseaux mangent surtout les scarabées bien visibles. Vingt générations plus tard, sur 200 scarabées,
    160 sont bruns. Quel est le pourcentage de scarabées bruns à la fin ? Écris seulement le nombre, sans le signe %.'
  reponse:
    valeur: 80
  indices:
    relance: 'Quelle part du total les scarabées bruns représentent-ils à la fin : combien sur combien ?'
    methode: Un pourcentage se calcule en divisant la partie par le total, puis en multipliant par 100.
    etape: Au début, 50 bruns sur 200, c'est 25 %. Fais le même calcul avec les chiffres de la fin.
  pieges:
  - si:
      valeur: 25
    relance: C'est le pourcentage du début. Refais le calcul avec le nombre de scarabées bruns de la fin.
  - si:
      valeur: 160
    relance: 160 est un nombre de scarabées, pas un pourcentage. Rapporte-le au total.
  solution: '160 bruns sur 200 scarabées : 160 ÷ 200 = 0,8, et 0,8 × 100 = 80. Les scarabées bruns représentent 80 % de la
    population à la fin (contre 25 % au début).'
- id: expliquer-scarabees
  type: choix
  difficulte: 2
  enonce: Sur l'île au sol brun, les scarabées bruns sont devenus majoritaires. Quelles explications sont correctes ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: a
      texte: Les scarabées verts sont devenus bruns pour ne plus être mangés.
    - id: b
      texte: Des scarabées bruns existaient déjà ; leur couleur est apparue par hasard, à la suite d'une mutation.
    - id: c
      texte: Les scarabées bruns, moins visibles, survivent plus souvent, se reproduisent davantage et transmettent leur couleur.
    - id: d
      texte: L'évolution a pour but de rendre chaque espèce parfaite.
    bonnes:
    - b
    - c
  indices:
    relance: Un scarabée vert peut-il changer de couleur pendant sa vie, parce qu'il le voudrait ?
    methode: Distingue d'où vient la variation (le hasard) et ce qui trie les individus (le milieu).
    etape: 'Commence par la phrase a : la couleur d''un scarabée dépend de ses allèles. Peut-il les changer ?'
  pieges:
  - si:
      contient:
      - a
    relance: Un individu ne peut pas changer ses allèles pour s'adapter. Les bruns étaient-ils déjà là avant ?
  - si:
      contient:
      - d
    relance: Le milieu favorise ce qui marche ici et maintenant. Y a-t-il un projet ou un but derrière ?
  - si:
      diagnostic: incomplet
    relance: Il faut à la fois une variation due au hasard et un tri par le milieu. As-tu choisi les deux ?
  solution: 'b et c sont correctes : la couleur brune est apparue par hasard (mutation), puis les bruns, moins repérés par
    les oiseaux, se sont davantage reproduits (sélection naturelle). a est faux : un individu ne se transforme pas pour s''adapter.
    d est faux : l''évolution n''a pas de but.'
- id: chronologie-vivant
  type: ordre
  difficulte: 2
  enonce: Range ces événements de l'histoire de la vie du plus ancien au plus récent.
  reponse:
    elements:
    - id: t
      texte: 'Premières traces de vie : des êtres vivants microscopiques d''une seule cellule'
    - id: m
      texte: Premiers animaux formés de nombreuses cellules, dans les océans
    - id: q
      texte: Premiers vertébrés à quatre pattes sur la terre ferme
    - id: d
      texte: Disparition des dinosaures, sauf la lignée des oiseaux
    - id: h
      texte: Apparition de l'espèce humaine actuelle, Homo sapiens
  indices:
    relance: Les êtres vivants les plus anciens étaient-ils simples ou complexes ?
    methode: Commence par la vie la plus simple, dans l'eau, puis la sortie des eaux, et termine par l'événement le plus proche
      de nous.
    etape: Le premier événement est l'apparition des êtres vivants microscopiques. Lequel vient juste après ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux événements voisins sont inversés. Les humains ont-ils côtoyé les dinosaures ?
  - si:
      diagnostic: ordre_faux
    relance: Place d'abord le plus ancien (la vie microscopique) et le plus récent (notre espèce), puis range ceux du milieu.
  solution: Vie microscopique (environ 3,5 milliards d'années) → premiers animaux pluricellulaires dans les océans → premiers
    vertébrés à quatre pattes sur la terre ferme → disparition des dinosaures non aviens (66 millions d'années) → Homo sapiens
    (il y a quelques centaines de milliers d'années).
- id: mecanismes-exemples
  type: association
  difficulte: 2
  enonce: Associe chaque notion à l'exemple qui l'illustre.
  reponse:
    gauche:
    - id: m
      texte: Mutation
    - id: s
      texte: Sélection naturelle
    - id: h
      texte: Hasard d'une catastrophe
    - id: e
      texte: Extinction
    droite:
    - id: w
      texte: Un orage tue une partie des scarabées, quelle que soit leur couleur.
    - id: x
      texte: Un scarabée naît avec un nouvel allèle de couleur que ses parents n'avaient pas.
    - id: y
      texte: Plus aucun fossile de l'espèce n'existe au-dessus d'une certaine couche de roche.
    - id: z
      texte: Les oiseaux mangent surtout les scarabées bien visibles sur le sol.
    paires:
      m: x
      s: z
      h: w
      e: y
  indices:
    relance: Dans quel exemple la couleur des scarabées compte-t-elle pour leur survie ?
    methode: 'Pour chaque exemple, demande-toi : est-ce une nouveauté dans l''ADN, un tri selon les caractères, un tri sans
      rapport avec les caractères, ou une disparition ?'
    etape: L'orage tue les scarabées sans regarder leur couleur. Quelle notion correspond à un tri sans rapport avec les caractères
      ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Compare l''orage et les oiseaux : lequel trie selon la couleur ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par la mutation : quel exemple montre un changement nouveau de l''ADN ?'
  solution: 'Mutation : nouvel allèle de couleur. Sélection naturelle : les oiseaux mangent surtout les scarabées visibles.
    Hasard d''une catastrophe : l''orage tue sans tenir compte de la couleur. Extinction : plus aucun fossile de l''espèce
    au-dessus d''une certaine couche.'
- id: couche-la-plus-ancienne
  type: choix
  difficulte: 1
  enonce: Dans une falaise dont les couches n'ont pas été retournées, où trouve-t-on les fossiles les plus anciens ?
  reponse:
    options:
    - id: a
      texte: Dans la couche du haut.
    - id: b
      texte: Dans la couche du bas.
    - id: c
      texte: Ils ont tous le même âge.
    - id: d
      texte: Dans la couche la plus épaisse.
    bonnes:
    - b
  indices:
    relance: Pense à la façon dont les couches se déposent l'une après l'autre.
    methode: Une couche se dépose sur celles qui existent déjà. Laquelle est arrivée en premier ?
    etape: La première couche déposée est sous toutes les autres.
  pieges:
  - si:
      contient:
      - a
    relance: La couche du haut s'est déposée en dernier, sur les autres. Est-elle la plus ancienne ?
  - si:
      contient:
      - c
    relance: Des couches déposées à des moments différents contiennent des fossiles d'âges différents.
  - si:
      contient:
      - d
    relance: L'épaisseur d'une couche ne renseigne pas sur son âge. C'est sa position qui compte.
  solution: 'Les couches se déposent les unes sur les autres : la couche du bas est la plus ancienne, donc ses fossiles aussi.'
- id: age-de-la-vie
  type: nombre
  difficulte: 3
  enonce: 'Repères : la Terre a environ 4,6 milliards d''années. Les plus anciennes traces de vie connues ont environ 3,5
    milliards d''années. Combien de temps, en milliards d''années, s''est écoulé entre la formation de la Terre et les premières
    traces de vie ? Écris seulement le nombre.'
  reponse:
    valeur: 1.1
    forme: libre
  indices:
    relance: Il s'agit de l'écart de temps entre deux dates, mesuré depuis la formation de la Terre.
    methode: La formation de la Terre est plus ancienne que les premières traces de vie. Calcule la différence des deux âges.
    etape: Soustrais le plus petit âge du plus grand, en gardant la même unité (milliards d'années).
  pieges:
  - si:
      valeur: 8.1
    relance: 'Tu as additionné. On cherche un écart de temps : il faut soustraire.'
  solution: '4,6 − 3,5 = 1,1. Il s''est écoulé environ 1,1 milliard d''années. Vérification : 3,5 + 1,1 = 4,6.'
- id: couches-fossiles
  type: ouverte
  difficulte: 3
  enonce: 'Document (fictif) : dans une falaise, trois couches de roches sont empilées sans avoir été retournées. Couche du
    bas : fossiles de l''espèce A seulement. Couche du milieu : fossiles des espèces A et B. Couche du haut : fossiles des
    espèces B et C. Montre, à partir de ce document, que des espèces sont apparues et d''autres ont disparu au cours du temps.'
  criteres:
  - L'élève utilise le principe que la couche du bas est la plus ancienne et celle du haut la plus récente.
  - L'élève montre l'apparition de B puis de C (absentes des couches plus anciennes) et la disparition de A (absente de la
    couche la plus récente).
  - L'élève conclut que les espèces présentes sur Terre ont changé au cours du temps, ce qui est un argument en faveur de
    l'évolution.
  indices:
    relance: Parmi les trois couches, laquelle s'est déposée en premier ?
    methode: Pour chaque espèce, note dans quelle couche elle apparaît pour la première fois et dans quelle couche on ne la
      trouve plus.
    etape: 'Commence ainsi : les couches se déposent les unes sur les autres, donc la couche du bas est...'
  solution: 'Les couches se déposent les unes sur les autres : celle du bas est la plus ancienne, celle du haut la plus récente.
    L''espèce A vivait seule au début ; B apparaît ensuite (couche du milieu), puis C (couche du haut). A n''existe plus dans
    la couche du haut : elle a disparu. Les espèces ont donc changé au cours du temps : c''est un fait d''évolution.'
- id: nblm-que-savent-les-scientifiques-sur-l-appar-1
  type: choix
  difficulte: 2
  enonce: Que savent les scientifiques sur l'apparition des premiers êtres vivants sur Terre ?
  reponse:
    options:
    - id: o1
      texte: Ce sont des organismes microscopiques formés d'une seule cellule, datant d'environ 3,5 milliards d'années.
    - id: o2
      texte: Ce sont de grands animaux marins apparus dès la formation de la Terre il y a 4,6 milliards d'années.
    - id: o3
      texte: Ce sont des plantes à fleurs complexes ayant immédiatement colonisé les continents.
    - id: o4
      texte: Ce sont des dinosaures microscopiques qui ont ensuite grandit au fil des siècles.
    bonnes:
    - o1
  indices:
    relance: Pense à la taille des plus anciennes traces de vie retrouvées et à la date estimée de leur apparition.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, 4,6 milliards d'années correspond à la formation de la Terre. Les premiers êtres vivants sont apparus
      plus tard et étaient microscopiques.
  - si:
      contient:
      - o3
    relance: Les premiers organismes vivants n'étaient pas des plantes complexes, mais de simples cellules microscopiques
      en milieu aquatique.
  - si:
      contient:
      - o4
    relance: Les dinosaures sont des vertébrés apparus beaucoup plus tard dans l'histoire de la Terre, et non les premiers
      êtres vivants.
  solution: Ce sont des organismes microscopiques formés d'une seule cellule, datant d'environ 3,5 milliards d'années. C'est
    exact. Les plus anciennes traces de vie connues datent d'environ 3,5 milliards d'années et correspondent à des organismes
    unicellulaires microscopiques.
- id: nblm-comment-utilise-t-on-l-organisation-des-2
  type: choix
  difficulte: 2
  enonce: Comment utilise-t-on l'organisation des couches de roches fossiles pour effectuer une datation relative ?
  reponse:
    options:
    - id: o1
      texte: Une couche de roche située au-dessous est plus ancienne que celle située au-dessus.
    - id: o2
      texte: La couche située au-dessus est toujours plus ancienne car elle s'est tassée en premier.
    - id: o3
      texte: Toutes les couches de roches ont le même âge, seule la taille des fossiles change.
    - id: o4
      texte: L'âge d'une couche dépend uniquement de la couleur de la roche qui la compose.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'ordre dans lequel les sédiments se déposent naturellement au fil du temps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la couche du dessus s''est déposée après celle du dessous, elle est donc plus récente.'
  - si:
      contient:
      - o3
    relance: Les couches s'accumulent progressivement au fil des millions d'années ; elles ont donc des âges différents.
  - si:
      contient:
      - o4
    relance: La couleur de la roche dépend de sa composition minérale, pas de son âge géologique.
  solution: Une couche de roche située au-dessous est plus ancienne que celle située au-dessus. C'est exact. Selon le principe
    de superposition, les couches de sédiments se déposent les unes sur les autres au cours du temps, la plus ancienne étant
    en bas.
- id: nblm-que-nous-revele-l-etude-des-especes-disp-3
  type: choix
  difficulte: 2
  enonce: Que nous révèle l'étude des espèces disparues lors de grands événements comme l'extinction des dinosaures ?
  reponse:
    options:
    - id: o1
      texte: 'Les espèces changent au cours du temps : certaines disparaissent définitivement, comme les dinosaures non aviens
        il y a 66 millions d''années.'
    - id: o2
      texte: Les êtres humains ont vécu à la même époque que les dinosaures avant leur disparition.
    - id: o3
      texte: Les dinosaures ont décidé de se transformer en mammifères pour survivre aux changements du milieu.
    - id: o4
      texte: Les espèces disparues réapparaissent à l'identique quelques millions d'années plus tard.
    bonnes:
    - o1
  indices:
    relance: Pense au concept de renouvellement des espèces et à la date d'extinction des dinosaures non aviens.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : l''espèce humaine est apparue bien après la disparition des dinosaures non aviens.'
  - si:
      contient:
      - o3
    relance: Les organismes ne choisissent pas de se transformer. De plus, la lignée qui a survécu parmi les dinosaures est
      celle des oiseaux.
  - si:
      contient:
      - o4
    relance: L'extinction est la disparition définitive d'une espèce ; une espèce éteinte ne réapparaît jamais.
  solution: 'Les espèces changent au cours du temps : certaines disparaissent définitivement, comme les dinosaures non aviens
    il y a 66 millions d''années. C''est exact. Les fossiles témoignent de l''apparition et de la disparition définitive d''espèces
    au cours de l''histoire de la Terre.'
- id: nblm-sur-quoi-repose-le-mecanisme-de-selectio-4
  type: choix
  difficulte: 2
  enonce: Sur quoi repose le mécanisme de sélection naturelle favorisant la survie des mieux adaptés ?
  reponse:
    options:
    - id: o1
      texte: Les individus possédant des caractères avantageux dans un milieu survivent et se reproduisent davantage en transmettant
        leurs allèles.
    - id: o2
      texte: Les individus modifient volontairement leur ADN pour créer les caractères dont ils ont besoin.
    - id: o3
      texte: Le changement du milieu provoque l'apparition de mutations ciblées et utiles chez tous les individus.
    - id: o4
      texte: Seuls les individus les plus forts physiquement survivent, indépendamment de leurs gènes.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au rôle du milieu qui trie les variations génétiques déjà existantes dans la population.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : un individu ne peut pas modifier volontairement ses gènes ou son ADN pour s''adapter.'
  - si:
      contient:
      - o3
    relance: Les mutations apparaissent au hasard avant le changement du milieu ; le milieu ne crée pas les mutations, il
      les trie.
  - si:
      contient:
      - o4
    relance: La sélection naturelle ne favorise pas forcément la force, mais les caractères avantageux (résistance, camouflage,
      etc.) transmis génétiquement.
  solution: 'Les individus possédant des caractères avantageux dans un milieu survivent et se reproduisent davantage en transmettant
    leurs allèles. C''est exact. Le milieu effectue un tri : les individus porteurs d''allèles avantageux se reproduisent
    plus et transmettent ces caractères à leur descendance.'
- id: nblm-quelle-est-l-idee-cle-apportee-par-charl-5
  type: choix
  difficulte: 2
  enonce: Quelle est l'idée clé apportée par Charles Darwin pour expliquer les relations de parenté entre les espèces ?
  reponse:
    options:
    - id: o1
      texte: Toutes les espèces évoluent au cours du temps et partagent des ancêtres communs plus ou moins récents.
    - id: o2
      texte: L'espèce humaine descend directement du chimpanzé actuel.
    - id: o3
      texte: Les espèces ont été créées telles quelles et n'ont jamais changé depuis l'origine de la Terre.
    - id: o4
      texte: L'évolution suit un plan précis ayant pour but de créer des espèces parfaites.
    bonnes:
    - o1
  indices:
    relance: Pense à la notion d'ancêtre commun partagé entre espèces différentes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : l''être humain ne descend pas du chimpanzé. Ils partagent un ancêtre commun, puis chaque
      lignée a évolué de son côté.'
  - si:
      contient:
      - o3
    relance: Les travaux de Darwin et les fossiles prouvent au contraire que les espèces évoluent et se modifient constamment.
  - si:
      contient:
      - o4
    relance: 'L''évolution n''a pas de but ni d''intention : elle résulte du hasard des mutations et du tri par la sélection
      naturelle.'
  solution: Toutes les espèces évoluent au cours du temps et partagent des ancêtres communs plus ou moins récents. C'est exact.
    Darwin a montré que les espèces dérivent d'ancêtres communs et se modifient au fil des générations par sélection naturelle.
- id: nblm-quelles-affirmations-concernant-le-hasar-6
  type: choix
  difficulte: 3
  enonce: Quelles affirmations concernant le hasard et l'adaptation dans l'évolution des espèces sont correctes ? (Choisis
    2 réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Des catastrophes naturelles peuvent éliminer des individus au hasard, indépendamment de leurs caractères.
    - id: o2
      texte: Les mutations génétiques apparaissent au hasard au sein d'une population avant d'être triées par le milieu.
    - id: o3
      texte: Les animaux se transforment au cours de leur vie pour transmettre leurs nouvelles habitudes à leurs petits.
    - id: o4
      texte: L'évolution est un processus guidé par une volonté d'atteindre une forme de vie idéale.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie les deux propositions qui soulignent le rôle du hasard dans les mutations et les événements environnementaux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : les modifications acquises au cours de la vie (comme la musculation) ne se transmettent pas à la descendance.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''évolution est un phénomène non dirigé qui n''a ni but ni recherche de perfection.'
  solution: Des catastrophes naturelles peuvent éliminer des individus au hasard, indépendamment de leurs caractères ; Les
    mutations génétiques apparaissent au hasard au sein d'une population avant d'être triées par le milieu. C'est exact. Le
    hasard peut intervenir sous forme d'événements catastrophiques qui déciment des individus sans lien avec leur adaptation.
- id: nblm-quel-terme-scientifique-designe-la-dispa-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme scientifique désigne la disparition définitive de tous les individus d'une même espèce ?
  reponse:
    acceptees:
    - extinction
    fautes_tolerees: 1
  indices:
    relance: Ce terme commence par la lettre 'e' et s'applique par exemple aux dinosaures non aviens.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: extinction. L'extinction est le mot précis désignant la disparition totale et irréversible de tous les représentants
    d'une espèce.
- id: nblm-comment-appelle-t-on-les-restes-ou-les-e-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on les restes ou les empreintes d'êtres vivants conservés au sein des roches ?
  reponse:
    acceptees:
