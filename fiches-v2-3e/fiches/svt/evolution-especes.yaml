    fautes_tolerees: 1
  indices:
    relance: Ce nom au pluriel désigne les témoignages minéralisés des êtres vivants du passé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: fossiles. Les fossiles sont les traces ou restes d'organismes du passé préservés dans les roches sédimentaires.
