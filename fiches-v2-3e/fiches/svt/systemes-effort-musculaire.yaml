format: 2
notion: systemes-effort-musculaire
version: 2
etat: generee
declencheurs:
- essoufflé après la course
- cœur bat plus vite pendant le sport
- fréquence cardiaque à l'effort
- rythme respiratoire
- débit ventilatoire
- récupération après l'effort
- cœur qui s'emballe
- pouls après le sport
- poumons et cœur à l'effort
prerequis:
- nutrition-cellules-animales
- role-cerveau-message-nerveux
essentiel: |
  Pour se contracter, les cellules des muscles consomment du dioxygène et des nutriments (dont le glucose). Elles produisent de l'énergie, de la chaleur, et rejettent du dioxyde de carbone.

  Pendant un effort, les muscles ont besoin de beaucoup plus de dioxygène et de nutriments. Plusieurs systèmes s'adaptent ensemble.

  Le système respiratoire.
  - La fréquence respiratoire augmente : on respire plus vite.
  - Le volume d'air à chaque mouvement augmente : on respire plus profondément.
  - Le débit ventilatoire (volume d'air par minute) augmente : débit = fréquence × volume à chaque mouvement.
  - Plus de dioxygène passe des alvéoles dans le sang, plus de dioxyde de carbone est rejeté.

  Le système cardiovasculaire.
  - La fréquence cardiaque augmente : le cœur bat plus vite.
  - Le cœur envoie plus de sang à chaque battement.
  - Le débit sanguin augmente et une plus grande part du sang va vers les muscles qui travaillent.

  Le système nerveux.
  - Il commande la contraction des muscles (message nerveux moteur).
  - Des centres nerveux ajustent, sans qu'on y pense, les rythmes cardiaque et respiratoire aux besoins de l'organisme.

  L'organisme a des capacités et des limites. Les fréquences cardiaque et respiratoire ne peuvent pas augmenter sans fin : au-delà, c'est l'épuisement. L'entraînement améliore les capacités : cœur plus lent au repos, moins haut à l'effort, retour plus rapide au repos (récupération).

  Après l'effort, les rythmes redescendent progressivement vers leurs valeurs de repos.

  Au brevet : on te donne des mesures (repos, effort, récupération). Tu dois calculer un écart, expliquer par les besoins des muscles, et citer le rôle de chaque système.
methode:
- Lire un tableau ou un graphique en comparant les valeurs au repos, pendant l'effort et après l'effort.
- Calculer une augmentation (valeur à l'effort moins valeur au repos) ou un débit (fréquence × volume).
- Relier chaque changement au besoin des muscles en dioxygène et en nutriments.
- Nommer le système concerné (nerveux, respiratoire, cardiovasculaire) et son rôle.
- Comparer deux personnes ou deux moments pour parler des capacités et des limites de l'organisme.
vocabulaire:
- terme: fréquence cardiaque
  definition: Nombre de battements du cœur par minute.
- terme: fréquence respiratoire
  definition: Nombre de mouvements respiratoires par minute.
- terme: débit ventilatoire
  definition: Volume d'air qui entre dans les poumons en une minute.
- terme: débit sanguin
  definition: Volume de sang envoyé par le cœur en une minute.
- terme: système cardiovasculaire
  definition: Ensemble formé par le cœur, les vaisseaux et le sang.
- terme: récupération
  definition: Retour progressif des rythmes cardiaque et respiratoire à leurs valeurs de repos après l'effort.
- terme: limite de l'organisme
  definition: Valeur maximale que les rythmes du cœur ou de la respiration ne peuvent pas dépasser.
erreurs_frequentes:
- Croire que les muscles fabriquent du dioxygène, ou qu'ils n'en utilisent que pendant l'effort (ils en consomment aussi au repos).
- Penser que le cœur bat plus vite « pour se fatiguer » ou sans raison, au lieu de le relier aux besoins des muscles.
- Oublier le rôle du système nerveux, qui commande les muscles et règle les rythmes cardiaque et respiratoire.
- Additionner des valeurs au lieu de calculer un écart.
- Confondre fréquence (nombre par minute) et débit (volume par minute).
exemple:
  enonce: 'Document (fictif) : au repos, Inès a une fréquence cardiaque de 72 battements par minute ; après trois minutes de course, 156. Décris et explique ce changement.'
  solution: La fréquence cardiaque augmente de 156 − 72 = 84 battements par minute. Le cœur envoie plus de sang aux muscles, qui reçoivent ainsi plus de dioxygène et de nutriments pour fournir l'effort, et évacuent plus vite le dioxyde de carbone.
exercices:
- id: augmentation-frequence-cardiaque
  type: nombre
  difficulte: 1
  enonce: 'Document (fictif) : au repos, la fréquence cardiaque de Nathan est de 70 battements par minute. Juste après une course, elle est de 150 battements par minute. De combien de battements par minute a-t-elle augmenté ? Écris seulement le nombre.'
  reponse:
    valeur: 80
  indices:
    relance: Cherches-tu un total ou un écart entre deux valeurs ?
    methode: Pour trouver une augmentation, on soustrait la valeur de départ à la valeur d'arrivée.
    etape: La valeur d'arrivée est 150 et la valeur de départ est 70. Pose la soustraction.
  pieges:
  - si:
      valeur: 220
    relance: 'Tu as additionné les deux valeurs. On cherche de combien la fréquence a augmenté : quelle opération donne un écart ?'
  - si:
      valeur: 150
    relance: 150 est la fréquence après la course. De combien a-t-elle augmenté par rapport au repos ?
  solution: Augmentation = 150 − 70 = 80 battements par minute.
- id: debit-ventilatoire-effort
  type: nombre
  difficulte: 2
  enonce: 'Document (fictif) : pendant une course, Sarah fait 30 mouvements respiratoires par minute et fait entrer 2 litres d''air à chaque mouvement. Combien de litres d''air entrent dans ses poumons en une minute ? Écris seulement le nombre.'
  reponse:
    valeur: 60
  indices:
    relance: À chaque mouvement, 2 litres entrent. Combien de mouvements fait-elle en une minute ?
    methode: Volume d'air par minute = nombre de mouvements par minute multiplié par le volume d'air d'un mouvement.
    etape: Au repos, avec 15 mouvements de 0,5 litre, on aurait 15 × 0,5 = 7,5 litres par minute. Fais le même calcul pour la course.
  pieges:
  - si:
      valeur: 32
    relance: Tu as additionné. Si chaque mouvement apporte 2 litres, et qu'il y a 30 mouvements, quelle opération faut-il faire ?
  - si:
      valeur: 15
    relance: 'Tu as divisé. Chaque mouvement fait entrer de l''air en plus : le total doit être plus grand que 30.'
  solution: 30 mouvements × 2 litres = 60 litres d'air par minute, soit 8 fois plus qu'au repos dans l'exemple (7,5 litres par minute).
- id: pourquoi-coeur-accelere
  type: choix
  difficulte: 2
  enonce: Pourquoi le cœur bat-il plus vite pendant un effort ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: Pour apporter plus de dioxygène et de nutriments aux muscles.
    - id: b
      texte: Pour évacuer plus vite le dioxyde de carbone produit par les muscles.
    - id: c
      texte: Parce que les muscles fabriquent du dioxygène pendant l'effort.
    - id: d
      texte: Parce que les muscles n'utilisent pas de dioxygène au repos.
    bonnes:
    - a
    - b
  indices:
    relance: Que consomment les muscles pour se contracter, et que rejettent-ils ?
    methode: Le sang apporte certaines substances aux muscles et en emporte d'autres. Classe chaque phrase avec cette idée.
    etape: 'Relis la phrase c : un muscle produit-il du dioxygène, ou en consomme-t-il ?'
  pieges:
  - si:
      contient:
      - c
    relance: Un muscle consomme du dioxygène pour se contracter. D'où vient le dioxygène du sang ?
  - si:
      contient:
      - d
    relance: Au repos, les cellules des muscles vivent aussi. Ont-elles besoin de dioxygène pour vivre ?
  - si:
      diagnostic: incomplet
    relance: Le sang apporte, mais il emporte aussi. As-tu pensé à ce que les muscles rejettent ?
  solution: 'a et b : le cœur accélère pour apporter plus de dioxygène et de nutriments aux muscles, et pour évacuer plus vite le dioxyde de carbone. c est faux : les muscles consomment le dioxygène. d est faux : les muscles en consomment aussi au repos, mais moins.'
- id: trajet-dioxygene
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre le trajet du dioxygène, de l'air jusqu'aux cellules d'un muscle de la jambe.
  reponse:
    elements:
    - id: r
      texte: L'air entre par le nez ou la bouche et descend dans la trachée.
    - id: v
      texte: Le dioxygène passe des alvéoles pulmonaires dans le sang.
    - id: k
      texte: Le sang riche en dioxygène revient au cœur.
    - id: e
      texte: Le cœur envoie ce sang dans les artères.
    - id: a
      texte: Le dioxygène passe du sang aux cellules du muscle.
  indices:
    relance: Par quel organe le dioxygène entre-t-il dans le sang ?
    methode: Suis d'abord le trajet de l'air dans le système respiratoire, puis le trajet du sang dans le système cardiovasculaire.
    etape: Tout commence par l'air qui entre par le nez ou la bouche. Où va-t-il ensuite ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Le cœur peut-il envoyer du sang riche en dioxygène avant de l'avoir reçu ?
  - si:
      diagnostic: ordre_faux
    relance: Le dioxygène doit d'abord entrer dans le sang, et ce n'est pas dans le cœur que cela se passe. Recommence depuis l'air inspiré.
  solution: Air par le nez ou la bouche puis la trachée → passage dans le sang au niveau des alvéoles pulmonaires → retour du sang au cœur → le cœur l'envoie dans les artères → le dioxygène passe du sang aux cellules du muscle.
- id: systemes-roles
  type: association
  difficulte: 1
  enonce: Associe chaque élément à son rôle pendant un effort.
  reponse:
    gauche:
    - id: n
      texte: Système nerveux
    - id: r
      texte: Système respiratoire
    - id: c
      texte: Système cardiovasculaire
    - id: m
      texte: Muscles
    droite:
    - id: w
      texte: Font entrer le dioxygène dans le sang et rejettent le dioxyde de carbone
    - id: x
      texte: Consomment du dioxygène et du glucose pour se contracter
    - id: y
      texte: Commande la contraction et ajuste les rythmes du cœur et de la respiration
    - id: z
      texte: Transporte le dioxygène et les nutriments jusqu'aux muscles
    paires:
      n: y
      r: w
      c: z
      m: x
  indices:
    relance: Quel système fait circuler le sang dans tout le corps ?
    methode: 'Pour chaque rôle, cherche l''organe principal : poumons, cœur et vaisseaux, cerveau et nerfs, ou muscles.'
    etape: Le rôle « transporter jusqu'aux muscles » est celui du cœur et des vaisseaux sanguins. Continue avec les poumons.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Qui commande les muscles : le cœur, ou le cerveau et les nerfs ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Pense aux organes : les poumons, le cœur, le cerveau. Quel est le rôle de chacun pendant la course ?'
  solution: 'Système nerveux : commande la contraction et ajuste les rythmes. Système respiratoire : fait entrer le dioxygène dans le sang et rejette le dioxyde de carbone. Système cardiovasculaire : transporte le dioxygène et les nutriments. Muscles : consomment dioxygène et glucose pour se contracter.'
- id: recuperation-apres-effort
  type: choix
  difficulte: 2
  enonce: 'Document (fictif) : fréquence cardiaque d''une élève. Au repos : 68. Pendant la course : 165. Une minute après l''arrêt : 110. Cinq minutes après l''arrêt : 74. Que montre ce document ? (plusieurs réponses possibles)'
  reponse:
    options:
    - id: k
      texte: La fréquence cardiaque augmente pendant l'effort.
    - id: w
      texte: La fréquence cardiaque reste identique pendant toute la mesure.
    - id: x
      texte: Après l'arrêt, la fréquence cardiaque redescend progressivement vers sa valeur de repos.
    - id: z
      texte: La fréquence cardiaque tombe à zéro juste après l'arrêt.
    bonnes:
    - k
    - x
  indices:
    relance: Compare les quatre valeurs les unes aux autres, dans l'ordre des mesures.
    methode: Regarde d'abord le passage repos → course, puis le passage course → après l'arrêt.
    etape: Après l'arrêt, les valeurs sont de moins en moins élevées, mais pas nulles.
  pieges:
  - si:
      contient:
      - w
    relance: Les valeurs changent d'une mesure à l'autre. Compare le repos et la course.
  - si:
      contient:
      - z
    relance: 'Le cœur ne s''arrête pas : les valeurs après l''arrêt sont de 110 puis 74. Que décris-tu ?'
  - si:
      diagnostic: incomplet
    relance: Tu as une bonne réponse, mais il en manque une. Regarde à la fois l'effort et la récupération.
  solution: 'La fréquence passe de 68 à 165 pendant la course (augmentation), puis redescend à 110 puis 74 après l''arrêt, proche de la valeur de repos : c''est la récupération.'
- id: sang-envoye-par-minute
  type: nombre
  difficulte: 3
  enonce: 'Document (fictif) : au repos, le cœur de Malik bat 70 fois par minute et envoie 70 mL de sang à chaque battement. Pendant une course, il bat 150 fois par minute et envoie 100 mL de sang à chaque battement. De combien de millilitres le volume de sang envoyé par minute a-t-il augmenté ? Écris seulement le nombre.'
  reponse:
    valeur: 10100
    forme: entier
  indices:
    relance: Il faut calculer un volume par minute dans chaque situation, puis comparer.
    methode: Volume par minute = nombre de battements par minute × volume par battement. Fais-le pour le repos, puis pour la course.
    etape: Calcule chacun des deux volumes séparément, puis retranche le plus petit au plus grand.
  pieges:
  - si:
      valeur: 15000
    relance: Tu as calculé le volume par minute pendant la course seulement. Que dois-tu comparer ?
  - si:
      valeur: 30
    relance: Tu as comparé les volumes par battement seulement. Il faut tenir compte de la fréquence aussi.
  solution: 'Repos : 70 × 70 = 4 900 mL par minute. Course : 150 × 100 = 15 000 mL par minute. Augmentation : 15 000 − 4 900 = 10 100 mL par minute.'
- id: comparer-entraine
  type: ouverte
  difficulte: 3
  enonce: 'Document (fictif) : fréquence cardiaque (battements par minute) de deux élèves du même âge. Léo, qui s''entraîne trois fois par semaine : 60 au repos, 150 pendant la course, 75 trois minutes après. Adam, qui ne fait pas de sport : 80 au repos, 180 pendant la course, 120 trois minutes après. Explique pourquoi la fréquence cardiaque augmente pendant la course, puis compare les deux élèves en parlant des capacités et des limites de l''organisme.'
  criteres:
  - L'élève décrit l'augmentation pendant la course et l'explique par le besoin accru des muscles en dioxygène et en nutriments.
  - 'L''élève compare les valeurs avec précision : Léo a un cœur plus lent au repos, monte moins haut et revient plus vite vers sa valeur de repos.'
  - L'élève conclut que l'entraînement améliore les capacités de l'organisme, et qu'Adam s'approche davantage des limites de son cœur.
  indices:
    relance: De quoi les muscles ont-ils davantage besoin pendant la course ?
    methode: 'Compare les deux élèves ligne par ligne : au repos, pendant la course, puis trois minutes après.'
    etape: 'Commence par Léo : sa fréquence passe de 60 à 150. Explique pourquoi, puis fais pareil pour Adam.'
  solution: 'Pendant la course, les muscles consomment plus de dioxygène et de nutriments : le cœur bat plus vite pour leur envoyer plus de sang. Léo, entraîné, a un cœur plus lent au repos (60 contre 80), il monte moins haut pendant l''effort (150 contre 180) et récupère plus vite (75 contre 120 après trois minutes). L''entraînement améliore donc les capacités de l''organisme ; Adam, lui, se rapproche davantage des limites de son cœur.'
