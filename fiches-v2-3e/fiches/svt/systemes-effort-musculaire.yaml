format: 2
notion: systemes-effort-musculaire
version: 1
etat: verifiee
declencheurs:
- essoufflement à l'effort
- fréquence cardiaque augmente
- pourquoi on respire plus vite en courant
- muscle qui se contracte
- limite physique du sportif
- calcul de fréquence cardiaque
prerequis: []
essentiel: 'Lors d''un effort musculaire, les muscles sollicités se contractent davantage et consomment plus de nutriments
  et de dioxygène pour produire l''énergie nécessaire à leur activité.


  Pour répondre à cette demande accrue, le système cardiovasculaire réagit : le cœur bat plus vite (la fréquence cardiaque
  augmente) pour faire circuler davantage de sang, chargé de nutriments et de dioxygène, vers les muscles actifs. Au repos,
  la fréquence cardiaque d''un adulte est en moyenne d''environ 70 battements par minute.


  Le système respiratoire réagit également : la fréquence et l''amplitude respiratoires augmentent pour capter plus de dioxygène
  dans l''air et évacuer plus de dioxyde de carbone produit par les muscles.


  Le système nerveux commande et coordonne ces ajustements automatiques (augmentation du rythme cardiaque et respiratoire)
  en fonction de l''intensité de l''effort demandé.


  Ces adaptations ont des limites : au-delà d''une certaine intensité ou durée d''effort, l''organisme ne peut plus fournir
  suffisamment de dioxygène aux muscles, ce qui provoque fatigue, essoufflement, ou diminution de la performance.'
methode:
- 'Repérer les trois systèmes impliqués lors d''un effort musculaire : nerveux, respiratoire, cardiovasculaire.'
- Relier l'augmentation de l'intensité de l'effort à l'augmentation de la fréquence cardiaque et respiratoire.
- Calculer une variation de fréquence cardiaque (en valeur ou en pourcentage) entre le repos et l'effort.
- Identifier les limites de l'organisme face à un effort trop intense ou trop long.
vocabulaire:
- terme: fréquence cardiaque
  definition: nombre de battements du cœur par minute
erreurs_frequentes:
- Croire que seul le cœur s'adapte à l'effort, en oubliant le système respiratoire et le système nerveux qui coordonne le
  tout.
- Penser que la fréquence cardiaque et respiratoire augmentent au hasard, sans lien avec les besoins des muscles.
- Confondre fréquence cardiaque (nombre de battements par minute) et pression artérielle.
- Croire que l'organisme peut s'adapter indéfiniment à n'importe quelle intensité d'effort, sans limite.
exemple:
  enonce: La fréquence cardiaque d'un élève au repos est de 70 battements par minute ; pendant un effort intense, elle atteint
    150 battements par minute. Calculer l'augmentation en pourcentage.
  solution: '(150 − 70) / 70 × 100 ≈ 114,3 % : la fréquence cardiaque augmente d''environ 114 % pendant l''effort.'
exercices:
- id: frequence-cardiaque-repos
  type: nombre
  difficulte: 1
  enonce: Quelle est, en moyenne, la fréquence cardiaque au repos d'un adulte, en battements par minute ?
  reponse:
    valeur: 70
    forme: entier
    tolerance: 10
  indices:
    relance: C'est une valeur proche de la fréquence cardiaque évoquée en cours pour un adulte au repos.
    methode: Relis l'exemple de ta leçon sur le calcul de fréquence cardiaque au repos et à l'effort.
    etape: Cette valeur est nettement plus basse que la fréquence cardiaque à l'effort donnée dans l'exemple de la leçon.
  pieges:
  - si:
      valeur: 150
    relance: Cette valeur correspond à une fréquence cardiaque à l'effort, pas au repos.
  solution: La fréquence cardiaque moyenne au repos d'un adulte est d'environ 70 battements par minute.
- id: trois-systemes-effort
  type: choix
  difficulte: 1
  enonce: Quels systèmes interviennent lors d'un effort musculaire, selon le cours ?
  reponse:
    options:
    - id: a
      texte: Système nerveux
    - id: b
      texte: Système respiratoire
    - id: c
      texte: Système cardiovasculaire
    - id: d
      texte: Système digestif
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Ce sont trois systèmes, pas quatre. L'un des quatre proposés n'est pas mentionné dans le cours sur l'effort musculaire.
    methode: Repense aux trois systèmes cités dans l'essentiel de la leçon sur l'effort musculaire.
    etape: Le système qui gère la transformation des aliments n'est pas concerné directement par l'effort musculaire.
  pieges:
  - si:
      contient:
      - d
    relance: Le système digestif n'est pas cité parmi les systèmes qui interviennent directement lors d'un effort musculaire.
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé, mais il en manque au moins un parmi les trois attendus.
  solution: 'Les trois systèmes impliqués sont : le système nerveux (coordination), le système respiratoire (apport en dioxygène)
    et le système cardiovasculaire (transport du sang).'
- id: role-systeme-nerveux-effort
  type: texte_court
  difficulte: 2
  enonce: Quel système commande et coordonne l'augmentation de la fréquence cardiaque et respiratoire pendant l'effort ?
  reponse:
    acceptees:
    - système nerveux
    - le système nerveux
    fautes_tolerees: 1
  indices:
    relance: C'est le système qui commande les réactions automatiques du corps.
    methode: Relis la partie de la leçon consacrée à la coordination des ajustements pendant l'effort.
    etape: Ce système transmet des messages nerveux au cœur et aux muscles respiratoires.
  pieges:
  - si:
      valeur: système cardiovasculaire
    relance: Le système cardiovasculaire fait circuler le sang, mais un autre système commande cette adaptation.
  solution: Le système nerveux commande ces ajustements automatiques en fonction de l'intensité de l'effort.
- id: ordre-effort-musculaire
  type: ordre
  difficulte: 2
  enonce: Range les étapes de la réaction de l'organisme au début d'un effort musculaire intense.
  reponse:
    elements:
    - id: besoin
      texte: Les muscles sollicités consomment davantage de nutriments et de dioxygène
    - id: commande
      texte: Le système nerveux commande une augmentation du rythme cardiaque et respiratoire
    - id: coeur
      texte: Le cœur bat plus vite et fait circuler davantage de sang vers les muscles
    - id: respiration
      texte: La fréquence et l'amplitude respiratoires augmentent pour capter plus de dioxygène
  indices:
    relance: Le point de départ est toujours le besoin accru des muscles, avant toute réaction du corps.
    methode: Place d'abord le besoin des muscles, puis la commande nerveuse, puis les deux réactions (cœur et respiration).
    etape: Le système nerveux commande à la fois le cœur et la respiration ; il agit donc avant leurs réactions.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. La commande nerveuse a-t-elle lieu avant ou après les réactions du cœur
      et de la respiration ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la cause initiale (besoin des muscles), puis la commande nerveuse, avant de placer les deux réactions
      physiologiques.
  solution: D'abord le besoin accru des muscles en nutriments et dioxygène, puis la commande du système nerveux, puis l'augmentation
    du rythme cardiaque et de la fréquence respiratoire.
- id: calcul-augmentation-frequence
  type: nombre
  difficulte: 3
  enonce: Un élève a une fréquence cardiaque de 75 battements par minute au repos, et de 165 battements par minute pendant
    un effort intense. Calcule l'augmentation en pourcentage (arrondie à l'entier).
  reponse:
    valeur: 120
    forme: entier
    tolerance: 2
  indices:
    relance: Le pourcentage d'augmentation se calcule par rapport à la valeur de départ (au repos).
    methode: Calcule d'abord la différence entre les deux fréquences, puis divise-la par la fréquence de repos, puis multiplie
      par 100.
    etape: 165 − 75 = 90. Il reste à diviser 90 par 75, puis multiplier par 100.
  pieges:
  - si:
      valeur: 90
    relance: 90 est la différence en battements par minute, mais la question demande un pourcentage d'augmentation par rapport
      à la fréquence de repos.
  - si:
      valeur: 220
    relance: 'Vérifie ton calcul : tu as peut-être divisé par la fréquence à l''effort plutôt que par la fréquence de repos.'
  solution: '(165 − 75) / 75 × 100 = 90 / 75 × 100 = 120 % : la fréquence cardiaque augmente d''environ 120 % pendant l''effort.'
- id: expliquer-limites-organisme
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi un sportif ressent de la fatigue et un essoufflement important lorsqu'il dépasse ses capacités
    d'adaptation cardiovasculaire et respiratoire pendant un effort.
  criteres:
  - L'élève explique que les muscles ont besoin d'un apport croissant en dioxygène pendant l'effort.
  - L'élève relie le dépassement des capacités cardiovasculaires et respiratoires à un apport insuffisant en dioxygène aux
    muscles.
  - L'élève mentionne au moins une conséquence concrète (fatigue, essoufflement, baisse de performance).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense à ce qui manque aux muscles quand l'effort dépasse les capacités du corps.
    methode: Commence par rappeler le besoin croissant des muscles en dioxygène, puis explique ce qui se passe quand les systèmes
      cardiovasculaire et respiratoire ne suivent plus.
    etape: Rappelle que les systèmes cardiovasculaire et respiratoire ont des limites d'adaptation, contrairement à ce qu'on
      pourrait croire.
  solution: 'Pendant un effort musculaire, les muscles sollicités consomment de plus en plus de dioxygène pour produire l''énergie
    nécessaire à leur activité. Les systèmes cardiovasculaire et respiratoire augmentent leur activité (fréquence cardiaque
    et respiratoire) pour répondre à cette demande, mais cette adaptation a des limites. Si l''intensité ou la durée de l''effort
    dépasse ces limites, l''apport en dioxygène aux muscles devient insuffisant : cela provoque fatigue musculaire, essoufflement,
    voire une baisse de la performance ou l''arrêt de l''effort.'
