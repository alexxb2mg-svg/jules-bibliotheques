format: 2
notion: nutrition-cellules-animales
version: 1
etat: verifiee
declencheurs:
- besoin des cellules en oxygène
- système de transport dans le corps
- pourquoi on respire et on mange
- muscle qui travaille intensément
- vaisseaux sanguins
- évacuer le dioxyde de carbone
prerequis: []
essentiel: 'Toutes les cellules de l''organisme ont besoin en permanence de nutriments (issus de la digestion des aliments)
  et de dioxygène (issu de la respiration) pour fonctionner et produire l''énergie nécessaire à leur activité.


  Ces besoins sont satisfaits grâce à des systèmes de transport : le système digestif prélève les nutriments dans les aliments,
  le système respiratoire capte le dioxygène de l''air, et le système cardiovasculaire (le sang, propulsé par le cœur) achemine
  ces éléments jusqu''à chaque cellule de l''organisme.


  Le sang, en circulant dans les vaisseaux sanguins, distribue nutriments et dioxygène à tous les organes et tissus, et récupère
  en retour les déchets produits par les cellules (comme le dioxyde de carbone) pour les évacuer.


  Cette organisation fonctionnelle se retrouve à toutes les échelles : de l''organisme entier, aux organes, aux tissus, jusqu''à
  la cellule individuelle qui a besoin de ces apports pour vivre.


  L''organisme entretient aussi des interactions avec des micro-organismes (notamment dans le système digestif), qui participent
  à certaines étapes de la nutrition.'
methode:
- 'Identifier les deux besoins fondamentaux d''une cellule animale : nutriments et dioxygène.'
- 'Repérer le système responsable de chaque étape : digestif (nutriments), respiratoire (dioxygène), cardiovasculaire (transport
  vers les cellules).'
- Retenir que le sang assure à la fois l'apport (nutriments, dioxygène) et l'évacuation des déchets (dioxyde de carbone).
- 'Relier les échelles d''organisation : organisme, organes, tissus, cellules.'
vocabulaire:
- terme: nutriment
  definition: une substance issue de la digestion des aliments, utilisée par les cellules pour fonctionner
- terme: système cardiovasculaire
  definition: l'ensemble formé par le cœur et les vaisseaux sanguins, qui transporte le sang dans tout l'organisme
- terme: dioxygène
  definition: le gaz de l'air, capté par la respiration, indispensable aux cellules pour produire de l'énergie
erreurs_frequentes:
- Croire que seuls certains organes (comme le cœur ou les poumons) ont besoin de nutriments et de dioxygène, alors que toutes
  les cellules en ont besoin.
- Confondre système digestif (apport des nutriments) et système respiratoire (apport du dioxygène).
- Oublier le rôle du sang comme intermédiaire de transport entre les organes prélevant les ressources et les cellules qui
  les utilisent.
- Penser que le sang ne transporte que le dioxygène, en oubliant les nutriments et les déchets.
exemple:
  enonce: Pourquoi un muscle qui travaille intensément a-t-il besoin d'une plus grande quantité de sang que lorsqu'il est
    au repos ?
  solution: Un muscle en activité consomme davantage de nutriments et de dioxygène pour produire l'énergie nécessaire à sa
    contraction ; le sang, qui transporte ces éléments, doit donc y circuler en plus grande quantité pour répondre à ce besoin
    accru.
exercices:
- id: besoins-cellule
  type: choix
  difficulte: 1
  enonce: Quels sont les deux besoins fondamentaux de toute cellule animale pour fonctionner ?
  reponse:
    options:
    - id: a
      texte: Des nutriments et du dioxygène
    - id: b
      texte: De la lumière et du dioxyde de carbone
    - id: c
      texte: De l'eau et du sel uniquement
    bonnes:
    - a
  indices:
    relance: Un besoin vient de la digestion, l'autre de la respiration.
    methode: Élimine les réponses qui parlent de lumière (utile aux plantes, pas aux cellules animales) ou d'un besoin trop
      restrictif.
    etape: Les cellules animales ont besoin de nutriments (issus des aliments) et de dioxygène (issu de l'air respiré).
  pieges:
  - si:
      contient:
      - b
    relance: La lumière n'est pas un besoin des cellules animales ; c'est plutôt un besoin des plantes chlorophylliennes pour
      la photosynthèse.
  - si:
      contient:
      - c
    relance: L'eau et le sel sont utiles à l'organisme, mais ce ne sont pas les deux besoins fondamentaux qui viennent de
      la digestion et de la respiration.
  solution: Les deux besoins fondamentaux de toute cellule animale sont des nutriments (issus des aliments digérés) et du
    dioxygène (issu de l'air respiré).
- id: mot-systeme-transport
  type: texte_court
  difficulte: 1
  enonce: Quel système transporte les nutriments et le dioxygène jusqu'à chaque cellule du corps, grâce au cœur et aux vaisseaux
    sanguins ?
  reponse:
    acceptees:
    - système cardiovasculaire
    - système circulatoire
    - appareil circulatoire
    fautes_tolerees: 2
  indices:
    relance: Pense au rôle du cœur, qui propulse le sang dans les vaisseaux sanguins.
    methode: Ce système comporte le préfixe « cardio- », qui renvoie au cœur.
    etape: Ce système est formé du cœur et de l'ensemble des vaisseaux sanguins.
  pieges:
  - si:
      valeur: système digestif
    relance: Le système digestif prélève les nutriments dans les aliments, mais ce n'est pas lui qui les transporte jusqu'aux
      cellules. Quel système assure ce transport ?
  - si:
      valeur: système respiratoire
    relance: Le système respiratoire capte le dioxygène de l'air, mais ce n'est pas lui qui le transporte jusqu'aux cellules.
      Quel système assure ce transport ?
  solution: Le système cardiovasculaire (le sang, propulsé par le cœur dans les vaisseaux sanguins) transporte les nutriments
    et le dioxygène jusqu'à chaque cellule du corps.
- id: role-sang-dechets
  type: choix
  difficulte: 2
  enonce: En plus d'apporter des nutriments et du dioxygène, que récupère également le sang au niveau des cellules ?
  reponse:
    options:
    - id: a
      texte: Les déchets produits par les cellules, notamment le dioxyde de carbone
    - id: b
      texte: De la lumière solaire
    - id: c
      texte: Des sels minéraux absorbés directement par la peau
    bonnes:
    - a
  indices:
    relance: Pense à ce que produisent les cellules en fonctionnant, et qui doit être évacué.
    methode: Élimine les réponses qui n'ont pas de rapport avec un déchet cellulaire à évacuer.
    etape: Les cellules produisent un gaz en fonctionnant, que le sang doit récupérer pour l'évacuer vers les poumons.
  pieges:
  - si:
      contient:
      - b
    relance: La lumière solaire n'a pas de rôle dans la nutrition des cellules animales.
  - si:
      contient:
      - c
    relance: 'L''absorption directe par la peau n''est pas le mécanisme concerné ici : pense plutôt à un déchet produit par
      les cellules elles-mêmes.'
  solution: Il récupère les déchets produits par les cellules, notamment le dioxyde de carbone, pour les évacuer vers les
    poumons.
- id: association-systeme-role
  type: association
  difficulte: 2
  enonce: Associe chaque système à son rôle dans la nutrition des cellules animales.
  reponse:
    gauche:
    - id: a
      texte: Système digestif
    - id: b
      texte: Système respiratoire
    - id: c
      texte: Système cardiovasculaire
    droite:
    - id: x
      texte: Prélève les nutriments dans les aliments
    - id: y
      texte: Capte le dioxygène de l'air
    - id: z
      texte: Transporte nutriments et dioxygène jusqu'aux cellules
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Chaque système intervient à une étape différente : prélèvement, captation, ou transport.'
    methode: Commence par le système cardiovasculaire, dont le rôle de transport est le plus facile à identifier grâce au
      cœur et aux vaisseaux.
    etape: Le système digestif prélève, le système respiratoire capte, le système cardiovasculaire transporte.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au rôle précis de chaque système dans la chaîne de la nutrition.
  - si:
      diagnostic: associations_fausses
    relance: Pars du système cardiovasculaire, le plus facile à identifier (cœur, vaisseaux sanguins, transport).
  solution: 'Système digestif : prélève les nutriments dans les aliments. Système respiratoire : capte le dioxygène de l''air.
    Système cardiovasculaire : transporte nutriments et dioxygène jusqu''aux cellules.'
- id: developpement-muscle-effort
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique pourquoi un muscle qui travaille intensément a besoin d''une plus grande quantité
    de sang que lorsqu''il est au repos.'
  criteres:
  - L'élève explique que toute cellule, dont celles du muscle, a besoin de nutriments et de dioxygène pour produire de l'énergie.
  - L'élève relie l'intensité de l'activité musculaire à une consommation accrue de nutriments et de dioxygène.
  - L'élève explique que le sang, en transportant ces éléments, doit donc circuler en plus grande quantité.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense à ce que consomme une cellule pour produire de l'énergie, et à ce qui augmente quand l'activité augmente.
    methode: Relie l'intensité de l'effort musculaire à la quantité de nutriments et de dioxygène nécessaires.
    etape: Tu peux commencer ainsi « Toute cellule a besoin de nutriments et de dioxygène pour fonctionner... »
  solution: Toute cellule, y compris celles d'un muscle, a besoin de nutriments et de dioxygène pour produire l'énergie nécessaire
    à son fonctionnement. Lorsqu'un muscle travaille intensément, ses cellules consomment davantage de nutriments et de dioxygène
    pour produire l'énergie nécessaire à la contraction musculaire. Le sang étant le moyen de transport de ces éléments jusqu'aux
    cellules, il doit donc circuler en plus grande quantité vers le muscle en activité pour répondre à ce besoin accru. C'est
    pourquoi le corps augmente le débit sanguin vers les muscles sollicités lors d'un effort physique.
