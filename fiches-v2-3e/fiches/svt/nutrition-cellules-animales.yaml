format: 2
notion: nutrition-cellules-animales
version: 3
etat: generee
declencheurs:
- le sang transporte les nutriments
- dioxygène jusqu'aux cellules
- besoins des cellules musculaires
- rôle de la circulation sanguine
- capillaires sanguins
- urée dans le sang
- échanges avec les cellules
prerequis:
- devenir-aliments-tube-digestif
- systemes-effort-musculaire
essentiel: |
  Toutes les cellules d'un animal ont besoin de nutriments (glucose, acides aminés...) et de dioxygène. Elles les utilisent pour produire l'énergie nécessaire à leur fonctionnement (c'est la respiration cellulaire) et pour se construire. Elles rejettent du dioxyde de carbone et d'autres déchets, comme l'urée.

  Les cellules ne sont en contact ni avec l'air ni avec les aliments. Elles dépendent d'un système de transport : le sang, le cœur et les vaisseaux sanguins.

  Les nutriments viennent de la digestion. Ils passent dans le sang au niveau de l'intestin grêle, dont la paroi porte des villosités. Le dioxygène passe dans le sang au niveau des alvéoles pulmonaires. Le dioxyde de carbone fait le chemin inverse et sort par les poumons.

  Le sang circule dans les vaisseaux : les artères partent du cœur, les veines y reviennent, et les capillaires, très fins, sont au contact des cellules. C'est dans les capillaires que se font les échanges. Le plasma transporte les nutriments, les globules rouges transportent le dioxygène. Le cœur est la pompe qui met le sang en mouvement.

  Le sang emporte aussi les déchets : le dioxyde de carbone vers les poumons, l'urée vers les reins, qui la rejettent dans l'urine.

  L'organisme est organisé en niveaux emboîtés : cellules → tissus → organes → appareils → organisme. Chaque organe a une fonction, mais c'est la cellule qui utilise les nutriments et le dioxygène.

  Des micro-organismes vivent dans le tube digestif : c'est le microbiote intestinal. Certains participent à la digestion de substances que nous ne digérons pas seuls, comme les fibres. La nutrition met donc en jeu des interactions avec des micro-organismes.

  Au brevet : on te demande d'exploiter un document (comparer le sang à l'entrée et à la sortie d'un organe) et d'expliquer le trajet des nutriments et du dioxygène jusqu'aux cellules.
methode:
- Repérer ce dont la cellule a besoin (nutriments, dioxygène) et ce qu'elle rejette (dioxyde de carbone, urée).
- Pour chaque besoin, trouver l'organe où il entre dans le sang (intestin grêle, poumons).
- Pour chaque déchet, trouver l'organe où il sort du sang (poumons, reins).
- 'Relier les deux grâce au sang, au cœur et aux vaisseaux : le système de transport.'
- 'Dans un document, comparer le sang qui entre dans un organe et celui qui en sort : ce qui diminue a été prélevé, ce qui augmente a été rejeté.'
vocabulaire:
- terme: nutriment
  definition: Petite molécule issue de la digestion, qui peut passer dans le sang (glucose, acides aminés...).
- terme: villosité
  definition: Repli de la paroi de l'intestin grêle, qui augmente la surface d'échange avec le sang.
- terme: alvéole pulmonaire
  definition: Minuscule sac au bout des bronches, où le dioxygène passe dans le sang.
- terme: capillaire sanguin
  definition: Vaisseau très fin, au contact des cellules, où se font les échanges avec le sang.
- terme: urée
  definition: Déchet produit par les cellules, transporté par le sang jusqu'aux reins.
- terme: globule rouge
  definition: Cellule du sang qui transporte le dioxygène.
- terme: microbiote intestinal
  definition: Ensemble des micro-organismes qui vivent dans notre tube digestif.
- terme: système de transport
  definition: Ensemble formé par le sang, le cœur et les vaisseaux, qui relie tous les organes.
erreurs_frequentes:
- Croire que seules les cellules des poumons utilisent le dioxygène, alors que toutes les cellules du corps en ont besoin.
- Croire que les aliments vont directement du tube digestif aux muscles, sans passer par le sang.
- Confondre dioxygène (prélevé par les cellules) et dioxyde de carbone (rejeté par les cellules).
- 'Penser que le cœur fabrique le sang ou le nettoie : il le met seulement en mouvement.'
- Oublier que les échanges avec les cellules se font dans les capillaires, et pas dans les grosses artères.
exemple:
  enonce: Explique comment le glucose d'un morceau de pain arrive jusqu'à une cellule d'un muscle de la jambe.
  solution: 'Le pain est digéré dans le tube digestif : l''amidon donne du glucose. Le glucose passe dans le sang au niveau des villosités de l''intestin grêle. Le sang, mis en mouvement par le cœur, circule dans les vaisseaux jusqu''au muscle de la jambe. Là, le glucose sort du sang et entre dans la cellule musculaire, qui l''utilise avec du dioxygène pour produire de l''énergie.'
exercices:
- id: gaz-rejete-par-les-cellules
  type: texte_court
  difficulte: 1
  enonce: Les cellules utilisent du dioxygène. Quel gaz rejettent-elles dans le sang ?
  reponse:
    acceptees:
    - dioxyde de carbone
    - CO2
    - gaz carbonique
    fautes_tolerees: 1
  indices:
    relance: Quel gaz rejettes-tu quand tu expires, et qui trouble l'eau de chaux ?
    methode: Pense à ce qui se passe dans les poumons, dans les deux sens. Un gaz entre dans le sang, un autre en sort.
    etape: Son nom commence par « dioxyde de... ». Complète.
  pieges:
  - si:
      valeur: dioxygène
    relance: Le dioxygène, les cellules le prélèvent dans le sang. On te demande le gaz qu'elles rejettent.
  - si:
      valeur: azote
    relance: L'air contient beaucoup de diazote, mais les cellules ne le fabriquent pas. Quel gaz produisent-elles en utilisant le glucose ?
  solution: Les cellules rejettent du dioxyde de carbone (CO2). Le sang le transporte jusqu'aux poumons, qui le rejettent dans l'air expiré.
- id: organes-et-roles
  type: association
  difficulte: 1
  enonce: Associe chaque organe (a, b, c, d) à son rôle dans la nutrition des cellules (v, w, x, y).
  reponse:
    gauche:
    - id: a
      texte: intestin grêle
    - id: b
      texte: poumons
    - id: c
      texte: cœur
    - id: d
      texte: reins
    droite:
    - id: v
      texte: fait passer les nutriments dans le sang
    - id: w
      texte: fait entrer le dioxygène dans le sang et rejette le dioxyde de carbone
    - id: x
      texte: met le sang en mouvement dans les vaisseaux
    - id: y
      texte: retire l'urée du sang
    paires:
      a: v
      b: w
      c: x
      d: y
  indices:
    relance: Par quel organe entrent les nutriments issus de la digestion ? Et l'air ?
    methode: Pour chaque organe, demande-toi ce qui entre dans le sang ou en sort à cet endroit. Un seul organe ne fait ni entrer ni sortir de matière.
    etape: 'Commence par le cœur : c''est une pompe. Il ne prélève rien et n''élimine rien. Quel rôle lui reste-t-il ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis le rôle des reins et celui des poumons.
  - si:
      diagnostic: associations_fausses
    relance: Reprends organe par organe. Où se termine la digestion ? Où arrive l'air que tu respires ?
  solution: a-v (l'intestin grêle fait passer les nutriments dans le sang), b-w (les poumons échangent les gaz), c-x (le cœur met le sang en mouvement), d-y (les reins retirent l'urée du sang).
- id: trajet-du-dioxygene
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre le trajet du dioxygène, de l'air jusqu'à une cellule d'un muscle.
  reponse:
    elements:
    - id: a
      texte: L'air inspiré arrive dans les alvéoles pulmonaires.
    - id: b
      texte: Le dioxygène passe de l'alvéole dans le sang.
    - id: c
      texte: Le cœur propulse ce sang riche en dioxygène dans les artères.
    - id: d
      texte: Le dioxygène sort du sang dans les petits vaisseaux du muscle.
    - id: e
      texte: La cellule musculaire utilise le dioxygène et le glucose pour produire de l'énergie.
  indices:
    relance: Par où l'air entre-t-il dans le corps ? Et où le dioxygène est-il finalement utilisé ?
    methode: Place d'abord le début (l'air) et la fin (la cellule), puis remplis le milieu en suivant le sang.
    etape: Le premier élément parle de l'air inspiré. Cherche ensuite le moment où le dioxygène entre dans le sang.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Le cœur peut-il envoyer du dioxygène avant que celui-ci soit dans le sang ?
  - si:
      diagnostic: ordre_faux
    relance: Suis le dioxygène pas à pas, comme un voyageur. Il ne peut pas être utilisé par la cellule avant d'avoir voyagé dans le sang.
  solution: 'a, b, c, d, e : l''air arrive dans les alvéoles, le dioxygène passe dans le sang, le cœur envoie ce sang vers les organes, le dioxygène sort du sang au niveau du muscle, et la cellule l''utilise avec le glucose pour produire de l''énergie.'
- id: glucose-preleve-par-le-muscle
  type: nombre
  difficulte: 2
  enonce: 'Document (données fictives) : le sang qui entre dans un muscle contient 1,0 g de glucose par litre. Le sang qui en sort en contient 0,8 g par litre. Quelle masse de glucose, en grammes, le muscle a-t-il prélevée dans chaque litre de sang ? Écris seulement le nombre.'
  reponse:
    valeur: 0.2
    forme: libre
  indices:
    relance: Le sang qui sort du muscle contient-il plus ou moins de glucose que celui qui entre ? Que s'est-il passé ?
    methode: La masse prélevée est la différence entre ce qui entre et ce qui sort.
    etape: 'Pose la soustraction : masse à l''entrée moins masse à la sortie, pour un litre de sang.'
  pieges:
  - si:
      valeur: 1.8
    relance: Tu as additionné les deux valeurs. Le muscle garde seulement ce qui manque dans le sang à la sortie.
  - si:
      valeur: 0.8
    relance: 0,8 g, c'est ce qui reste dans le sang à la sortie. Combien le muscle en a-t-il gardé ?
  solution: 1,0 − 0,8 = 0,2. Le muscle prélève 0,2 g de glucose par litre de sang qui le traverse.
- id: vrai-ou-faux-nutrition
  type: choix
  difficulte: 2
  enonce: Parmi ces affirmations, lesquelles sont exactes ?
  reponse:
    options:
    - id: a
      texte: Toutes les cellules du corps ont besoin de dioxygène et de nutriments.
    - id: b
      texte: Seules les cellules des poumons utilisent le dioxygène.
    - id: c
      texte: Le sang emporte le dioxyde de carbone rejeté par les cellules jusqu'aux poumons.
    - id: d
      texte: Les nutriments vont directement de l'intestin aux muscles, sans passer par le sang.
    bonnes:
    - a
    - c
  indices:
    relance: Une cellule de ton orteil a-t-elle besoin d'énergie ? Avec quoi la produit-elle ?
    methode: Pour chaque phrase, demande-toi quel organe ou quel liquide relie l'endroit où la matière entre et la cellule qui l'utilise.
    etape: 'La phrase b est un piège classique : les poumons font entrer le dioxygène dans le sang, mais qui l''utilise ensuite ?'
  pieges:
  - si:
      contient:
      - b
    relance: Les poumons font entrer le dioxygène dans le sang. Mais une cellule du cerveau ou d'un muscle, en a-t-elle besoin aussi ?
  - si:
      contient:
      - d
    relance: Entre l'intestin et le muscle de la jambe, il n'y a pas de tuyau direct. Quel liquide fait le voyage ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une phrase exacte, mais il y en a une autre. Relis celles que tu n'as pas choisies.
  solution: 'a et c sont exactes. b est fausse : toutes les cellules utilisent le dioxygène, les poumons le font seulement entrer dans le sang. d est fausse : les nutriments passent dans le sang au niveau de l''intestin grêle, et c''est le sang qui les apporte aux muscles.'
- id: niveaux-d-organisation
  type: ordre
  difficulte: 1
  enonce: Range ces niveaux d'organisation de l'organisme du plus petit au plus grand.
  reponse:
    elements:
    - id: cel
      texte: Cellule
    - id: tis
      texte: Tissu
    - id: org
      texte: Organe
    - id: app
      texte: Appareil (ou système)
    - id: ind
      texte: Organisme entier
  indices:
    relance: Quelle est la plus petite unité vivante de l'organisme ?
    methode: Chaque niveau est formé de plusieurs éléments du niveau précédent.
    etape: On commence par la cellule. Que forment ensemble des cellules de même type qui font le même travail ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux niveaux voisins sont inversés. Un organe est-il formé de tissus, ou l'inverse ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pars du plus petit : les cellules forment quelque chose, qui forme quelque chose d''autre, jusqu''à l''organisme entier.'
  solution: Cellule → tissu → organe → appareil (ou système) → organisme. Des cellules semblables forment un tissu, plusieurs tissus forment un organe, plusieurs organes forment un appareil, et les appareils forment l'organisme.
- id: microbiote-vrai-faux
  type: choix
  difficulte: 2
  enonce: 'Le tube digestif héberge de nombreux micro-organismes : c''est le microbiote intestinal. Quelles affirmations sont exactes ? (plusieurs réponses possibles)'
  reponse:
    options:
    - id: k
      texte: Certains de ces micro-organismes participent à la digestion de substances comme les fibres.
    - id: w
      texte: Tous les micro-organismes présents dans le corps provoquent des maladies.
    - id: x
      texte: Un organisme en bonne santé héberge normalement de nombreux micro-organismes dans son tube digestif.
    - id: z
      texte: Les micro-organismes de l'intestin apportent le dioxygène aux cellules.
    bonnes:
    - k
    - x
  indices:
    relance: Un micro-organisme présent dans le corps est-il forcément dangereux ? Pense à ceux de l'intestin.
    methode: Rappelle-toi qui apporte le dioxygène aux cellules, et quel rôle joue le microbiote dans la digestion.
    etape: 'Commence par l''affirmation sur les maladies : une personne en bonne santé héberge-t-elle des micro-organismes ?'
  pieges:
  - si:
      contient:
      - w
    relance: Beaucoup de micro-organismes vivent en nous sans nous rendre malades, et certains nous rendent service. Relis l'affirmation.
  - si:
      contient:
      - z
    relance: Le dioxygène entre dans le sang au niveau des poumons. Les micro-organismes de l'intestin interviennent-ils là ?
  - si:
      diagnostic: incomplet
    relance: Tu as une bonne réponse, mais il en manque une. Relis les affirmations sur le rôle et sur la présence des micro-organismes.
  solution: Les fibres sont en partie digérées grâce à des micro-organismes du tube digestif, et une personne en bonne santé en héberge normalement beaucoup. Tous les micro-organismes ne sont pas dangereux, et le dioxygène est apporté aux cellules par le sang, après son passage par les poumons.
- id: muscle-repos-effort
  type: ouverte
  difficulte: 3
  enonce: 'Document (données fictives) : on mesure le dioxygène dans le sang qui entre dans un muscle de la cuisse et dans le sang qui en sort. Au repos : 200 mL par litre à l''entrée, 150 mL par litre à la sortie. Pendant une course : 200 mL par litre à l''entrée, 50 mL par litre à la sortie. Exploite ce document pour expliquer ce que fait le muscle avec le dioxygène, et pourquoi cela change pendant la course.'
  criteres:
  - L'élève compare l'entrée et la sortie et en déduit que le muscle prélève du dioxygène dans le sang (50 mL par litre au repos, 150 mL par litre pendant la course).
  - L'élève constate que le muscle prélève davantage de dioxygène pendant la course qu'au repos.
  - L'élève relie cela au besoin des cellules musculaires, qui utilisent plus de dioxygène (et de glucose) pour produire plus d'énergie pendant l'effort, le sang assurant le transport.
  indices:
    relance: Le sang qui sort du muscle contient-il autant de dioxygène que celui qui entre ?
    methode: Calcule, pour chaque situation, ce que le muscle a gardé (entrée moins sortie). Puis compare les deux situations et explique à quoi sert ce dioxygène.
    etape: 'Au repos : 200 − 150, le muscle garde donc une partie du dioxygène. Fais le même calcul pour la course.'
  solution: Au repos, le muscle prélève 200 − 150 = 50 mL de dioxygène par litre de sang ; pendant la course, 200 − 50 = 150 mL par litre, trois fois plus. Les cellules musculaires utilisent ce dioxygène, avec le glucose, pour produire l'énergie nécessaire à leur contraction. Pendant l'effort, elles ont besoin de plus d'énergie, donc elles prélèvent plus de dioxygène dans le sang, qui le leur apporte depuis les poumons.
