  reponse:
    options:
    - id: o1
      texte: Le sang sortant contient moins de dioxygène et moins de glucose que le sang entrant.
    - id: o2
      texte: Le sang sortant contient plus de dioxyde de carbone et d'urée que le sang entrant.
    - id: o3
      texte: Le sang sortant est enrichi en dioxygène fabriqué par le muscle.
    - id: o4
      texte: La quantité de glucose augmente dans le sang sortant du muscle.
    bonnes:
    - o1
    - o2
  indices:
    relance: 'Souviens-toi : ce qui diminue dans le sang a été prélevé par la cellule, ce qui augmente est un déchet rejeté.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
