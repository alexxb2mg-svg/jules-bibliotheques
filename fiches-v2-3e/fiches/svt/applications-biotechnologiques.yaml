format: 2
notion: applications-biotechnologiques
version: 1
etat: verifiee
declencheurs:
- organisme génétiquement modifié
- cloner un animal en laboratoire
- résistance à un insecte ravageur
- culture de cellules en laboratoire
- sélection par élevage
- modification du patrimoine génétique
prerequis:
- reproduction-sexuee-asexuee
essentiel: 'Un organisme génétiquement modifié (OGM) est un être vivant dont le patrimoine génétique a été modifié par l''être
  humain, en laboratoire, pour lui conférer une caractéristique particulière (par exemple, une résistance à un insecte pour
  une plante cultivée).


  Le clonage consiste à obtenir un individu génétiquement identique à un individu d''origine, sans passer par la reproduction
  sexuée ; il peut se faire naturellement (bouturage) ou de façon provoquée en laboratoire (clonage animal ou végétal).


  La culture de cellules permet de faire se multiplier des cellules isolées en laboratoire, en dehors d''un organisme entier,
  ce qui sert à la recherche scientifique ou à des applications médicales.


  Ces techniques biotechnologiques prolongent, en les accélérant et en les rendant plus précises, des pratiques de sélection
  génétique que l''être humain pratique depuis longtemps par l''élevage et l''agriculture (choix des individus reproducteurs
  aux caractéristiques souhaitées).


  L''utilisation des OGM et du clonage soulève des questions scientifiques, éthiques et environnementales, débattues dans
  la société (risques, bénéfices, réglementation).'
methode:
- Distinguer un OGM (modification directe du patrimoine génétique en laboratoire) d'une sélection traditionnelle par élevage
  ou culture.
- Repérer si un individu obtenu est génétiquement identique à un autre (clonage) ou porteur d'une modification génétique ciblée
  (OGM).
- Relier la culture de cellules à ses usages (recherche, médecine).
- Identifier les enjeux (bénéfices attendus, risques ou débats) associés à une application biotechnologique donnée.
vocabulaire:
- terme: OGM
  definition: un organisme génétiquement modifié, dont le patrimoine génétique a été modifié en laboratoire par l'être humain
- terme: clonage
  definition: l'obtention d'un individu génétiquement identique à un individu d'origine, sans reproduction sexuée
- terme: culture de cellules
  definition: la multiplication de cellules isolées en laboratoire, en dehors d'un organisme entier
erreurs_frequentes:
- Confondre OGM (modification génétique ciblée en laboratoire) et sélection traditionnelle par croisement.
- Croire qu'un clone est un individu identique en tout point à l'original (il partage le même patrimoine génétique, mais peut
  différer par l'environnement ou l'expérience vécue).
- Penser que toutes les biotechnologies concernent uniquement les plantes ou uniquement les animaux.
- Ignorer que ces techniques prolongent des pratiques anciennes de sélection par l'être humain.
exemple:
  enonce: Une variété de maïs a été modifiée en laboratoire pour résister à un insecte ravageur. Comment appelle-t-on ce type
    d'organisme ?
  solution: 'C''est un organisme génétiquement modifié (OGM) : son patrimoine génétique a été modifié directement en laboratoire
    pour lui donner cette résistance.'
exercices:
- id: choix-difference-clonage-reproduction
  type: choix
  difficulte: 1
  enonce: Quelle différence y a-t-il entre un clonage et une reproduction sexuée classique, du point de vue génétique du descendant
    obtenu ?
  reponse:
    options:
    - id: a
      texte: Le clonage produit un descendant génétiquement identique à un seul individu d'origine, la reproduction sexuée
        combine le patrimoine de deux parents
    - id: b
      texte: Le clonage nécessite toujours deux parents différents, comme la reproduction sexuée
    - id: c
      texte: La reproduction sexuée produit toujours un descendant identique aux deux parents
    bonnes:
    - a
  indices:
    relance: Pense au nombre de parents impliqués et à l'identité génétique du descendant obtenu dans chaque cas.
    methode: Élimine les réponses qui inversent les caractéristiques du clonage et de la reproduction sexuée.
    etape: Le clonage part d'un seul individu d'origine ; la reproduction sexuée combine le patrimoine génétique de deux parents.
  pieges:
  - si:
      contient:
      - b
    relance: Le clonage ne nécessite qu'un seul individu d'origine, contrairement à la reproduction sexuée qui combine deux
      parents.
  - si:
      contient:
      - c
    relance: La reproduction sexuée produit au contraire un descendant différent de ses deux parents, car leur patrimoine
      génétique se combine de façon nouvelle.
  solution: Le clonage produit un descendant génétiquement identique à un seul individu d'origine, tandis que la reproduction
    sexuée combine le patrimoine génétique de deux parents pour produire un descendant différent des deux.
- id: mot-sigle-organisme-modifie
  type: texte_court
  difficulte: 1
  enonce: Quel sigle désigne un être vivant dont le patrimoine génétique a été modifié en laboratoire par l'être humain ?
  reponse:
    acceptees:
    - OGM
    - ogm
    fautes_tolerees: 0
  indices:
    relance: C'est un sigle de trois lettres, très utilisé pour parler de plantes cultivées modifiées en laboratoire.
    methode: La première lettre du sigle rappelle le mot « organisme ».
    etape: Les trois lettres correspondent à « organisme génétiquement modifié ».
  pieges:
  - si:
      valeur: ADN
    relance: L'ADN est la molécule qui porte l'information génétique, mais ce n'est pas le sigle qui désigne l'organisme modifié
      lui-même.
  solution: Le sigle OGM désigne un organisme génétiquement modifié, dont le patrimoine génétique a été modifié en laboratoire
    par l'être humain.
- id: usage-culture-cellules
  type: choix
  difficulte: 2
  enonce: Citer un usage possible de la culture de cellules en laboratoire.
  reponse:
    options:
    - id: a
      texte: Étudier le fonctionnement de cellules pour la recherche scientifique ou tester des médicaments
    - id: b
      texte: Remplacer complètement la reproduction sexuée chez tous les êtres vivants
    - id: c
      texte: Produire uniquement des graines pour l'agriculture biologique
    bonnes:
    - a
  indices:
    relance: Pense à la recherche médicale et scientifique, qui utilise des cellules isolées pour ses expériences.
    methode: Élimine les réponses qui décrivent un usage trop général ou éloigné du principe de la culture de cellules.
    etape: La culture de cellules permet de faire se multiplier des cellules en dehors d'un organisme entier, notamment pour
      la recherche.
  pieges:
  - si:
      contient:
      - b
    relance: 'La culture de cellules ne remplace pas la reproduction sexuée : ce sont deux processus biologiques différents.'
  - si:
      contient:
      - c
    relance: La culture de cellules ne concerne pas spécifiquement la production de graines pour l'agriculture biologique.
  solution: Un usage possible est d'étudier le fonctionnement de cellules pour la recherche scientifique, de tester des médicaments,
    ou de produire certaines substances utiles en médecine.
- id: developpement-ogm-selection-ancienne
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique en quoi les OGM prolongent une pratique déjà ancienne de l''agriculture et de
    l''élevage.'
  criteres:
  - L'élève rappelle que les agriculteurs et éleveurs sélectionnent depuis longtemps les individus reproducteurs aux caractéristiques
    souhaitées.
  - L'élève explique que les OGM permettent une modification génétique ciblée, réalisée directement en laboratoire.
  - L'élève compare la rapidité et la précision des deux méthodes (sélection traditionnelle plus lente, OGM plus rapide et
    ciblé).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Pense à ce que font les agriculteurs et éleveurs depuis longtemps en choisissant leurs reproducteurs.
    methode: Commence par rappeler la pratique ancienne de sélection, puis explique ce qu'apportent les OGM en plus.
    etape: Tu peux commencer ainsi « Depuis longtemps, les agriculteurs et éleveurs sélectionnent... »
  solution: 'Depuis longtemps, les agriculteurs et éleveurs sélectionnent les individus aux caractéristiques souhaitées (résistance,
    rendement, goût) pour les faire se reproduire, dans le but d''obtenir des générations suivantes présentant ces qualités.
    Les OGM prolongent cette pratique de sélection, mais en la rendant plus rapide et plus précise : au lieu d''attendre plusieurs
    générations de croisements, une modification génétique ciblée est réalisée directement en laboratoire sur le patrimoine
    génétique de l''organisme. Ainsi, les biotechnologies modernes ne créent pas un principe nouveau, mais accélèrent et précisent
    une démarche de sélection que l''être humain pratique depuis l''origine de l''agriculture et de l''élevage.'
- id: ordre-etapes-obtention-ogm
  type: ordre
  difficulte: 2
  enonce: Range ces étapes dans l'ordre logique de l'obtention d'un OGM en laboratoire, jusqu'à sa culture à grande échelle.
  reponse:
    elements:
    - id: identification
      texte: Identifier la caractéristique recherchée (par exemple une résistance à un insecte)
    - id: modification
      texte: Modifier le patrimoine génétique de l'organisme en laboratoire
    - id: verification
      texte: Vérifier que l'organisme obtenu possède bien la caractéristique souhaitée
    - id: culture
      texte: Cultiver ou élever l'organisme génétiquement modifié à plus grande échelle
  indices:
    relance: Que faut-il savoir en premier avant de pouvoir modifier un patrimoine génétique en laboratoire ?
    methode: Pars de la caractéristique recherchée, puis suis les étapes techniques jusqu'à la culture à grande échelle.
    etape: L'identification de la caractéristique recherchée vient en premier ; la culture à grande échelle est la dernière
      étape.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle des deux doit être réalisée avant l'autre dans ce processus ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par l'identification de la caractéristique recherchée et termine par la culture à grande échelle.
  solution: Identifier la caractéristique recherchée, modifier le patrimoine génétique en laboratoire, vérifier l'obtention
    de la caractéristique souhaitée, cultiver l'organisme à plus grande échelle.
