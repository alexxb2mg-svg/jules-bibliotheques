format: 2
notion: appareils-reproducteurs-puberte
version: 2
etat: verifiee
declencheurs:
- cycle menstruel
- ovulation
- production de spermatozoïdes
- testostérone
- hypophyse
- caractères sexuels secondaires
- transformations de la puberté
- règles du cycle
- sperme et spermatozoïdes
prerequis:
- reproduction-sexuee-asexuee
essentiel: 'La puberté est la période, souvent entre 10 et 16 ans (l''âge varie beaucoup d''une personne à l''autre), pendant
  laquelle le corps se transforme et les appareils reproducteurs deviennent fonctionnels. Les caractères sexuels secondaires
  apparaissent (pilosité, développement des seins, mue de la voix…).


  Chez le garçon, à partir de la puberté, les testicules produisent en continu, tout au long de la vie, des spermatozoïdes
  et une hormone, la testostérone. Les spermatozoïdes empruntent les spermiductes ; des glandes annexes ajoutent un liquide
  pour former le sperme, qui sort par l''urètre.


  Chez la fille, à partir de la puberté et jusqu''à la ménopause, les ovaires fonctionnent de façon cyclique. Un cycle dure
  environ 28 jours (durée variable). En général, un seul ovule est libéré par cycle, vers le milieu du cycle : c''est l''ovulation.
  Les ovaires produisent aussi des hormones (œstrogènes, progestérone) qui font épaissir la muqueuse de l''utérus. S''il n''y
  a pas de fécondation (qui a lieu dans une trompe), la muqueuse est éliminée : ce sont les règles, qui marquent le début
  d''un nouveau cycle.


  Une hormone est une molécule produite par une glande, transportée par le sang, qui agit sur des organes cibles. L''hypophyse,
  petite glande située sous le cerveau, produit des hormones qui commandent l''activité des testicules et des ovaires. Le
  démarrage de cette commande déclenche la puberté.


  Connaître ces mécanismes permet de comprendre les méthodes de maîtrise de la reproduction (contraception).


  Repères d''anatomie. Chez le garçon : testicules (dans les bourses), spermiductes, glandes annexes, pénis (avec l''urètre).
  Chez la fille : ovaires, trompes, utérus, vagin. La fécondation a lieu dans une trompe ; l''embryon s''installe ensuite
  dans l''utérus.


  Dès la naissance, les ovaires contiennent des cellules qui deviendront des ovules. À partir de la puberté, l''une d''elles
  est libérée à chaque cycle. Les testicules, eux, fabriquent des spermatozoïdes en continu à partir de la puberté.


  Maîtrise de la reproduction : la contraception s''appuie sur ces mécanismes. La pilule contient des hormones qui empêchent
  l''ovulation. Le préservatif empêche les spermatozoïdes d''atteindre l''ovule (et protège des infections sexuellement transmissibles).


  Au brevet, on attend que tu situes les organes, que tu distingues production continue (testicules) et cyclique (ovaires),
  que tu exploites une expérience sur les hormones et que tu relies un moyen de contraception à un principe de fonctionnement.

  '
methode:
- Nommer l'organe, puis dire ce qu'il produit (cellules reproductrices, hormones) et à partir de quand.
- Distinguer production continue (testicules) et production cyclique (ovaires).
- 'Pour un document sur les hormones : repérer l''organe retiré ou l''hormone injectée, puis comparer avec la situation normale.'
- 'Pour un cycle : le jour 1 est le premier jour des règles ; le cycle se termine la veille des règles suivantes.'
vocabulaire:
- terme: puberté
  definition: Période de transformation du corps pendant laquelle les appareils reproducteurs deviennent fonctionnels.
- terme: hormone
  definition: Molécule produite par une glande, transportée par le sang, qui agit sur des organes cibles.
- terme: ovulation
  definition: Libération d'un ovule par un ovaire, en général une fois par cycle.
- terme: hypophyse
  definition: Glande située sous le cerveau, qui commande l'activité des testicules et des ovaires.
- terme: ovaire
  definition: Organe de la fille qui libère des ovules et produit des hormones.
- terme: testicule
  definition: Organe du garçon qui produit les spermatozoïdes et la testostérone.
- terme: règles
  definition: Écoulement de sang qui correspond à l'élimination de la muqueuse de l'utérus, en l'absence de fécondation.
- terme: contraception
  definition: Ensemble des moyens qui permettent d'éviter une grossesse.
erreurs_frequentes:
- Croire que la puberté commence au même âge pour tout le monde.
- Penser que les ovaires libèrent des ovules dès la naissance, alors que cela commence à la puberté.
- Croire que les testicules fonctionnent par cycles comme les ovaires, alors que leur production est continue.
- Oublier que les hormones voyagent par le sang et que l'hypophyse commande les ovaires et les testicules.
exemple:
  enonce: Pourquoi un garçon ne produit-il pas de spermatozoïdes avant la puberté ?
  solution: 'Avant la puberté, l''hypophyse ne produit pas encore assez des hormones qui commandent les testicules. À la puberté,
    cette commande démarre : les testicules se mettent à produire des spermatozoïdes et de la testostérone, en continu.'
exercices:
- id: organes-et-productions
  type: association
  difficulte: 1
  enonce: Associe chaque organe à son rôle. Réponds sous la forme a-1, b-2…
  reponse:
    gauche:
    - id: a
      texte: Testicule
    - id: b
      texte: Ovaire
    - id: c
      texte: Utérus
    - id: d
      texte: Trompe (oviducte)
    - id: e
      texte: Hypophyse
    droite:
    - id: '1'
      texte: Produit les spermatozoïdes et la testostérone
    - id: '2'
      texte: Libère les ovules et produit des œstrogènes et de la progestérone
    - id: '3'
      texte: Accueille l'embryon et permet son développement
    - id: '4'
      texte: Lieu de la fécondation
    - id: '5'
      texte: Commande l'activité des ovaires et des testicules
    paires:
      a: '1'
      b: '2'
      c: '3'
      d: '4'
      e: '5'
  indices:
    relance: Lequel de ces organes ne fait pas partie de l'appareil reproducteur, mais se trouve sous le cerveau ?
    methode: Sépare les organes masculins, féminins et la glande de commande. Puis, pour chacun, demande-toi ce qu'il produit
      ou ce qui s'y passe.
    etape: 'Commence par le testicule : c''est l''organe reproducteur du garçon. Quelle phrase parle de spermatozoïdes ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule erreur. Vérifie l''utérus et la trompe : où a lieu la rencontre des cellules reproductrices, et où
      se développe l''embryon ?'
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs erreurs. Place d'abord le testicule et l'ovaire, qui produisent les cellules reproductrices, puis l'hypophyse.
  solution: a-1 (testicule), b-2 (ovaire), c-3 (utérus), d-4 (trompe, lieu de la fécondation), e-5 (hypophyse, qui commande
    les deux autres glandes).
- id: nom-messager-sanguin
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une molécule produite par une glande, transportée par le sang, et qui agit sur des organes
    cibles ? Réponds par un mot.
  reponse:
    acceptees:
    - hormone
    - hormones
    fautes_tolerees: 1
  indices:
    relance: La testostérone et les œstrogènes en sont des exemples. Quel nom commun les regroupe ?
    methode: 'Relis la définition dans l''essentiel : c''est un messager chimique qui circule dans le sang.'
    etape: C'est le même mot que dans l'expression « contrôle hormonal », mais sous forme de nom.
  pieges:
  - si:
      valeur: enzyme
    relance: Une enzyme découpe des molécules dans le tube digestif. On cherche un messager chimique transporté par le sang.
  - si:
      valeur: neurone
    relance: Un neurone est une cellule nerveuse, qui transmet un message nerveux. On cherche une molécule transportée par
      le sang.
  solution: 'C''est une hormone : par exemple la testostérone ou les œstrogènes.'
- id: vrai-sur-la-puberte
  type: choix
  difficulte: 2
  enonce: Parmi ces affirmations, lesquelles sont justes ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: À partir de la puberté, les testicules produisent des spermatozoïdes en continu.
    - id: b
      texte: Dès la naissance, les ovaires libèrent un ovule chaque mois.
    - id: c
      texte: La puberté commence exactement au même âge pour tout le monde.
    - id: d
      texte: En général, un ovaire libère un seul ovule par cycle.
    bonnes:
    - a
    - d
  indices:
    relance: À partir de quand les appareils reproducteurs deviennent-ils fonctionnels ?
    methode: 'Relis l''essentiel : compare le fonctionnement des testicules (continu) et celui des ovaires (cyclique), et
      ce qui est dit de l''âge de la puberté.'
    etape: Les ovaires ne libèrent pas d'ovule avant la puberté. Que peux-tu dire de l'affirmation sur la naissance ?
  pieges:
  - si:
      contient:
      - b
    relance: Les ovaires ne commencent à libérer des ovules qu'à une période précise de la vie. Laquelle ?
  - si:
      contient:
      - c
    relance: L'âge de la puberté varie beaucoup d'une personne à l'autre. Est-ce compatible avec « exactement au même âge
      » ?
  - si:
      diagnostic: incomplet
    relance: Il manque une affirmation juste. Combien d'ovules sont libérés, en général, à chaque cycle ?
  solution: 'Justes : a et d. Les testicules produisent des spermatozoïdes en continu à partir de la puberté ; en général
    un seul ovule est libéré par cycle. b est faux (les ovules ne sont libérés qu''à partir de la puberté) ; c est faux (l''âge
    de la puberté varie).'
- id: duree-du-cycle
  type: nombre
  difficulte: 2
  enonce: 'Document fictif : sur un calendrier, des règles commencent le 3 mars, puis les règles suivantes commencent le 31
    mars. Le premier jour des règles est le jour 1 du cycle. Combien de jours dure ce cycle ? Écris seulement le nombre.'
  reponse:
    valeur: 28
    forme: entier
  indices:
    relance: Le cycle va du jour 1 jusqu'à quel jour ? Le 31 mars fait-il partie de ce cycle ou du suivant ?
    methode: Le cycle commence le 3 mars et se termine la veille du début des règles suivantes. Compte les jours, ou fais
      une soustraction.
    etape: Le dernier jour du cycle est le 30 mars. Compte les jours du 3 au 30 mars inclus.
  pieges:
  - si:
      valeur: 29
    relance: 'Tu as compté le 31 mars. Mais ce jour est le jour 1 du cycle suivant : faut-il le compter ?'
  - si:
      diagnostic: valeur_fausse
    relance: Soustrais la date de début du cycle à la date de début du cycle suivant.
  solution: 31 − 3 = 28. Le cycle dure 28 jours (du 3 au 30 mars inclus), la durée moyenne d'un cycle.
- id: etapes-du-cycle
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les événements d'un cycle, en l'absence de fécondation.
  reponse:
    elements:
    - id: regles
      texte: 'Jour 1 : début des règles, la muqueuse de l''utérus est éliminée'
    - id: reconstruction
      texte: La muqueuse de l'utérus se reconstruit et s'épaissit
    - id: ovulation
      texte: Vers le milieu du cycle, un ovaire libère un ovule
    - id: muqueuse-prete
      texte: La muqueuse, très épaisse, pourrait accueillir un embryon
    - id: nouvelles-regles
      texte: Sans fécondation, la muqueuse se désagrège et de nouvelles règles commencent
  indices:
    relance: Par quel événement commence un cycle, et par quel événement se termine-t-il ?
    methode: 'Place le premier et le dernier événement, puis ceux du milieu : que devient la muqueuse de l''utérus avant et
      après l''ovulation ?'
    etape: Le cycle commence au jour 1, avec les règles. Que doit faire la muqueuse ensuite, puisqu'elle vient d'être éliminée
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux événements voisins sont inversés. La muqueuse peut-elle être prête à accueillir un embryon avant l'ovulation
      ?
  - si:
      diagnostic: ordre_faux
    relance: 'Reprends depuis le jour 1 : règles, reconstruction de la muqueuse, puis ce qui se passe vers le milieu du cycle.'
  solution: Règles (jour 1), reconstruction et épaississement de la muqueuse, ovulation vers le milieu du cycle, muqueuse
    prête à accueillir un embryon, puis, sans fécondation, nouvelles règles.
- id: hypophyse-commande-ovaires
  type: ouverte
  difficulte: 3
  enonce: 'Document fictif sur une ratte adulte. Expérience 1 : on retire l''hypophyse ; les ovaires cessent de fonctionner.
    Expérience 2 : après ce retrait, on injecte dans le sang des extraits d''hypophyse ; les ovaires fonctionnent de nouveau.
    Expérience 3 : on greffe l''hypophyse ailleurs dans le corps, sans aucun nerf qui la relie aux ovaires ; les ovaires fonctionnent
    normalement. Que peux-tu conclure de ces trois expériences ?'
  criteres:
  - L'élève déduit des expériences 1 et 2 que l'hypophyse est nécessaire au fonctionnement des ovaires et qu'elle agit grâce
    à des substances qu'elle produit.
  - 'L''élève utilise l''expérience 3 pour montrer que ces substances ne passent pas par des nerfs mais sont transportées
    par le sang : ce sont des hormones.'
  - L'élève conclut que l'hypophyse commande l'activité des ovaires par des hormones.
  indices:
    relance: Que se passe-t-il quand l'hypophyse manque ? Et quand on la remplace par ses extraits ?
    methode: Analyse les expériences une par une (« quand on…, on observe…, donc… »), puis rassemble tes conclusions.
    etape: 'Expérience 1 : sans hypophyse, les ovaires s''arrêtent. L''hypophyse est donc nécessaire. Que montre l''expérience
      2 ?'
  solution: 'Sans hypophyse, les ovaires cessent de fonctionner : l''hypophyse est nécessaire à leur activité. Les extraits
    d''hypophyse injectés dans le sang suffisent à relancer les ovaires : l''hypophyse agit par des substances qu''elle produit.
    Greffée sans nerf, elle agit encore : ces substances sont transportées par le sang. Ce sont des hormones : l''hypophyse
    commande l''activité des ovaires par voie hormonale.'
- id: hormone-des-testicules
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle l'hormone produite par les testicules à partir de la puberté ?
  reponse:
    acceptees:
    - testostérone
    - la testostérone
    - testosterone
    fautes_tolerees: 1
  indices:
    relance: Cette hormone est produite avec les spermatozoïdes. Son nom rappelle le mot « testicule ».
    methode: Le mot commence par « testo » et se termine par « one ».
    etape: 'Ce ne sont ni les œstrogènes ni la progestérone : elles sont produites par les ovaires.'
  pieges:
  - si:
      valeur: progestérone
    relance: La progestérone est produite par les ovaires. Quelle hormone produisent les testicules ?
  - si:
      valeur: œstrogènes
    relance: Les œstrogènes sont produits par les ovaires. Cherche l'hormone des testicules.
  solution: C'est la testostérone, produite en continu par les testicules à partir de la puberté.
- id: principe-de-la-pilule
  type: choix
  difficulte: 2
  enonce: Quel est le principe de fonctionnement d'une pilule contraceptive ?
  reponse:
    options:
    - id: a
      texte: Elle contient des hormones qui empêchent l'ovulation.
    - id: b
      texte: Elle détruit les spermatozoïdes dans les testicules.
    - id: c
      texte: Elle ferme les spermiductes.
    - id: d
      texte: Elle empêche la puberté de démarrer.
    bonnes:
    - a
  indices:
    relance: Pense à l'organe qui libère l'ovule et à ce qui le commande.
    methode: 'Les hormones agissent sur le fonctionnement des ovaires : que se passe-t-il si l''ovule n''est pas libéré ?'
    etape: Un seul de ces mécanismes concerne les hormones et les ovaires.
  pieges:
  - si:
      contient:
      - b
    relance: La pilule est prise par la femme. Elle n'agit pas sur les testicules.
  - si:
      contient:
      - c
    relance: Les spermiductes sont des organes du garçon. La pilule est prise par la fille.
  - si:
      contient:
      - d
    relance: La pilule ne se prend pas avant la puberté et n'empêche pas son démarrage. Elle agit sur le cycle.
  solution: 'a : la pilule contient des hormones qui bloquent l''ovulation, donc aucun ovule n''est libéré pour être fécondé.'
- id: nblm-qu-appelle-t-on-les-caracteres-sexuels-s-1
  type: choix
  difficulte: 2
  enonce: Qu'appelle-t-on les « caractères sexuels secondaires » qui apparaissent lors de la puberté ?
  reponse:
    options:
    - id: o1
      texte: Les modifications physiques du corps comme le développement des seins, la mue de la voix ou l'apparition de la
        pilosité.
    - id: o2
      texte: Les organes reproducteurs internes présents dès la naissance comme les ovaires ou les testicules.
    - id: o3
      texte: Les hormones produites par le cerveau pour stopper la croissance au moment de l'adolescence.
    - id: o4
      texte: Des transformations physiques qui apparaissent exactement au même âge chez toutes les personnes.
    bonnes:
    - o1
  indices:
    relance: Pense aux changements visibles de l'apparence physique qui caractérisent le passage à la puberté.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. Les organes reproducteurs internes sont présents dès la naissance et constituent les caractères sexuels
      primaires.
  - si:
      contient:
      - o3
    relance: Faux. Les caractères sexuels secondaires sont des modifications physiques visibles du corps et non des molécules
      hormonales.
  - si:
      contient:
      - o4
    relance: 'Faux. C''est une erreur fréquente : l''âge du début de la puberté et le développement de ces caractères varient
      d''une personne à l''autre.'
  solution: Les modifications physiques du corps comme le développement des seins, la mue de la voix ou l'apparition de la
    pilosité. C'est exact. Les caractères sexuels secondaires sont les transformations physiques du corps qui apparaissent
    à la puberté sous l'action des hormones sexuelles.
- id: nblm-comment-fonctionne-la-production-de-sper-2
  type: choix
  difficulte: 2
  enonce: Comment fonctionne la production de spermatozoïdes et de testostérone chez le garçon à partir de la puberté ?
  reponse:
    options:
    - id: o1
      texte: Les testicules les produisent en continu tout au long de la vie.
    - id: o2
      texte: Les testicules les produisent de façon cyclique tous les 28 jours.
    - id: o3
      texte: La production s'arrête tous les mois pendant une durée d'environ une semaine.
    - id: o4
      texte: Les spermatozoïdes sont tous fabriqués avant la naissance puis libérés à la puberté.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la différence fondamentale entre le fonctionnement continu masculin et le fonctionnement cyclique
      féminin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux. C''est une erreur classique : le fonctionnement cyclique concerne les ovaires chez la fille, pas les testicules.'
  - si:
      contient:
      - o3
    relance: Faux. La production de spermatozoïdes et de testostérone chez l'homme ne connaît pas d'interruption mensuelle.
  - si:
      contient:
      - o4
    relance: Faux. La fabrication des spermatozoïdes débute à la puberté sous le contrôle des hormones.
  solution: Les testicules les produisent en continu tout au long de la vie. C'est exact. Chez le garçon, les testicules fonctionnent
    de façon continue dès la puberté.
- id: nblm-quel-evenement-marque-le-premier-jour-jo-3
  type: choix
  difficulte: 2
  enonce: Quel événement marque le premier jour (jour 1) d'un cycle menstruel chez la femme ?
  reponse:
    options:
    - id: o1
      texte: Le premier jour des règles.
    - id: o2
      texte: Le jour de l'ovulation.
    - id: o3
      texte: Le dernier jour des règles.
    - id: o4
      texte: Le jour où la muqueuse de l'utérus atteint son épaisseur maximale.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au signal biologique visible qui annonce l'élimination de la muqueuse utérine et le début du cycle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. L'ovulation se produit généralement vers le milieu du cycle (vers le 14e jour pour un cycle de 28 jours).
  - si:
      contient:
      - o3
    relance: Faux. C'est le premier jour de l'écoulement menstruel qui définit le début du cycle, pas la fin des règles.
  - si:
      contient:
      - o4
    relance: Faux. L'épaississement maximal survient durant la seconde moitié du cycle, bien après le jour 1.
  solution: Le premier jour des règles. C'est exact. Par convention, le premier jour des règles marque le début d'un nouveau
    cycle menstruel.
- id: nblm-qu-est-ce-que-l-ovulation-et-a-quel-mome-4
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que l'ovulation et à quel moment du cycle menstruel de 28 jours se produit-elle généralement ?
  reponse:
    options:
    - id: o1
      texte: C'est la libération d'un ovule par un ovaire, en général vers le milieu du cycle.
    - id: o2
      texte: C'est la destruction de la muqueuse de l'utérus pendant les règles.
    - id: o3
      texte: C'est la production continue de cellules reproductrices du premier au dernier jour du mois.
    - id: o4
      texte: C'est la rencontre entre un spermatozoïde et un ovule dans une trompe.
    bonnes:
    - o1
  indices:
    relance: Pense à l'expulsion d'une cellule reproductrice femelle à mi-parcours du cycle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. L'élimination de la muqueuse utérine correspond aux règles et non à l'ovulation.
  - si:
      contient:
      - o3
    relance: Faux. L'ovulation est un événement cyclique ponctuel (généralement un seul ovule libéré par cycle).
  - si:
      contient:
      - o4
    relance: Faux. La rencontre des gamètes s'appelle la fécondation.
  solution: C'est la libération d'un ovule par un ovaire, en général vers le milieu du cycle. C'est exact. L'ovulation correspond
    à l'expulsion d'un ovule par l'un des deux ovaires, environ au 14e jour d'un cycle moyen.
- id: nblm-quel-est-le-role-de-l-hypophyse-lors-du-5
  type: choix
  difficulte: 2
  enonce: Quel est le rôle de l'hypophyse lors du déclenchement de la puberté ?
  reponse:
