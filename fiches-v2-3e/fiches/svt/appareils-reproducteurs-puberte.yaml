    - id: o2
      texte: Elle fabrique directement les spermatozoïdes et les ovules à partir de 10 ans.
    - id: o3
      texte: Elle provoque directement la destruction de la muqueuse utérine chaque mois.
    - id: o4
      texte: Elle sécrète de la testostérone chez les filles comme chez les garçons.
