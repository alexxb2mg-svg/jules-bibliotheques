format: 2
notion: geodynamique-globale
version: 1
etat: verifiee
declencheurs:
- dérive des continents
- ceinture de feu du Pacifique
- planètes telluriques
- planètes gazeuses
- pourquoi la Terre tremble
- remontée de magma
- plaques qui s'écartent
prerequis: []
essentiel: 'La Terre fait partie du système solaire, autour du Soleil, avec les autres planètes telluriques (rocheuses : Mercure,
  Vénus, Terre, Mars) et les planètes gazeuses, plus grandes et plus éloignées (Jupiter, Saturne, Uranus, Neptune).


  La surface terrestre (la lithosphère) est fragmentée en plusieurs grandes plaques tectoniques rigides, qui se déplacent
  lentement les unes par rapport aux autres, portées par les mouvements de matière plus profonds.


  Aux limites des plaques, ces mouvements produisent des phénomènes géologiques observables : séismes (secousses dues à une
  rupture brutale des roches), volcanisme (remontée de magma) et formation de chaînes de montagnes (par collision de plaques).


  Le globe terrestre est animé d''une rotation sur lui-même (jour/nuit) et d''une dynamique interne qui entraîne le déplacement
  des plaques.


  L''histoire de la Terre se découpe en grandes ères géologiques, marquées par des événements majeurs (apparition et disparition
  d''espèces, changements climatiques importants).'
methode:
- Situer la Terre dans le système solaire, parmi les planètes telluriques (rocheuses, proches du Soleil).
- Repérer les limites de plaques tectoniques sur une carte pour expliquer la localisation des séismes et des volcans.
- Relier un phénomène géologique observé (séisme, volcan, chaîne de montagnes) au mouvement des plaques qui le produit.
- Distinguer la surface rigide (lithosphère, découpée en plaques) de la matière plus profonde et plus chaude qui la porte.
vocabulaire:
- terme: lithosphère
  definition: l'enveloppe rigide externe de la Terre, découpée en plaques tectoniques
- terme: plaque tectonique
  definition: un grand fragment rigide de la lithosphère qui se déplace lentement par rapport aux autres
- terme: volcanisme
  definition: l'ensemble des phénomènes liés à la remontée de magma à la surface de la Terre
erreurs_frequentes:
- 'Croire que les continents sont immobiles : ils se déplacent, mais très lentement.'
- 'Confondre plaque tectonique et continent : une plaque peut porter un continent et une partie d''un océan.'
- Penser que les séismes et les volcans se produisent n'importe où sur Terre, sans lien avec les limites de plaques.
- Confondre planète tellurique (rocheuse) et planète gazeuse.
exemple:
  enonce: Pourquoi trouve-t-on de nombreux volcans et séismes tout autour de l'océan Pacifique (« ceinture de feu ») ?
  solution: Cette zone correspond à des limites de plaques tectoniques où les mouvements et les frottements entre plaques
    provoquent fréquemment des séismes et du volcanisme.
exercices:
- id: type-planetes
  type: choix
  difficulte: 1
  enonce: Quelle affirmation décrit correctement les plaques tectoniques ?
  reponse:
    options:
    - id: a
      texte: Ce sont de grands fragments rigides de la lithosphère qui se déplacent lentement les uns par rapport aux autres
    - id: b
      texte: Ce sont des courants d'air situés dans l'atmosphère
    - id: c
      texte: Ce sont des zones liquides situées au centre de la Terre
    - id: d
      texte: Ce sont des mers qui séparent les continents
    bonnes:
    - a
  indices:
    relance: 'Pense à l''enveloppe rigide externe de la Terre : de quoi est-elle faite, et bouge-t-elle ?'
    methode: 'Élimine les réponses qui parlent d''air ou d''eau : les plaques tectoniques sont une matière solide.'
    etape: La lithosphère, enveloppe rigide de la Terre, est découpée en plusieurs grands morceaux qui se déplacent lentement.
      Quelle réponse décrit cela ?
  pieges:
  - si:
      contient:
      - b
    relance: Les courants d'air appartiennent à l'atmosphère, pas à la surface solide de la Terre. Où se trouvent les plaques
      tectoniques ?
  - si:
      contient:
      - c
    relance: Le centre de la Terre est effectivement chaud et en mouvement, mais les plaques, elles, sont la partie rigide
      en surface. Où sont-elles situées ?
  - si:
      contient:
      - d
    relance: 'Une plaque peut porter à la fois des continents et des océans : ce n''est pas la mer elle-même. Relis la définition.'
  solution: Les plaques tectoniques sont de grands fragments rigides de la lithosphère (l'enveloppe externe de la Terre) qui
    se déplacent lentement les uns par rapport aux autres.
- id: mot-enveloppe-rigide
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne l'enveloppe rigide externe de la Terre, découpée en plusieurs grandes plaques ?
  reponse:
    acceptees:
    - lithosphère
    fautes_tolerees: 1
  indices:
    relance: C'est la partie solide et cassante de la Terre, celle qui porte les continents et les fonds océaniques.
    methode: 'Relis le vocabulaire de ta leçon : un mot désigne l''enveloppe rigide externe de la Terre.'
    etape: Le mot commence par « litho- » (la roche) et se termine par « -sphère ».
  pieges:
  - si:
      valeur: croute
    relance: Cette couche n'est qu'une fine partie de l'enveloppe rigide recherchée. Quel est le mot qui désigne l'ensemble
      de cette enveloppe externe, découpée en plaques ?
  - si:
      valeur: manteau
    relance: Cette couche est plus profonde et plus chaude que celle recherchée. Quel mot désigne la partie rigide de surface,
      en plaques ?
  solution: 'Le mot est « lithosphère » : c''est l''enveloppe rigide externe de la Terre, découpée en plusieurs grandes plaques
    tectoniques.'
- id: ceinture-de-feu
  type: choix
  difficulte: 2
  enonce: Pourquoi trouve-t-on de nombreux séismes et volcans tout autour de l'océan Pacifique, dans la « ceinture de feu
    » ?
  reponse:
    options:
    - id: a
      texte: Cette zone correspond à des limites de plaques tectoniques
    - id: b
      texte: C'est le point le plus chaud de l'atmosphère terrestre
    - id: c
      texte: C'est un hasard sans explication géologique connue
    bonnes:
    - a
  indices:
    relance: 'Pense à ce qui provoque des séismes et des volcans : que se passe-t-il aux endroits où deux plaques se rencontrent
      ?'
    methode: 'Élimine l''explication météorologique (l''atmosphère) et l''explication du hasard : cherche une explication
      géologique liée aux plaques.'
    etape: Autour de l'océan Pacifique se trouvent plusieurs limites de plaques tectoniques, où les frottements provoquent
      séismes et volcanisme.
  pieges:
  - si:
      contient:
      - b
    relance: L'atmosphère n'a pas de rapport direct avec les séismes ou les volcans, qui viennent du sous-sol. Que se passe-t-il
      aux limites de plaques ?
  - si:
      contient:
      - c
    relance: 'Ce n''est pas un hasard : la répartition des séismes et des volcans suit une logique géologique précise. Laquelle
      ?'
  solution: La « ceinture de feu » correspond à des limites de plaques tectoniques tout autour de l'océan Pacifique, où les
    mouvements et frottements entre plaques provoquent fréquemment séismes et volcanisme.
- id: planetes-du-systeme-solaire
  type: association
  difficulte: 2
  enonce: Associe chaque planète à sa catégorie.
  reponse:
    gauche:
    - id: a
      texte: Mercure
    - id: b
      texte: Jupiter
    - id: c
      texte: Terre
    - id: d
      texte: Saturne
    droite:
    - id: x
      texte: Planète tellurique (rocheuse)
    - id: y
      texte: Planète gazeuse
    paires:
      a: x
      b: y
      c: x
      d: y
  indices:
    relance: Les planètes telluriques sont rocheuses et proches du Soleil, les planètes gazeuses sont grandes et éloignées.
    methode: 'Place d''abord la Terre, que tu connais bien : elle est rocheuse, donc tellurique.'
    etape: Mercure et la Terre sont des planètes telluriques. Jupiter et Saturne sont des planètes gazeuses.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Rappelle-toi : les telluriques sont rocheuses, les gazeuses sont grandes et
      lointaines.'
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : la Terre est tellurique (rocheuse). Classe les autres planètes par rapport à elle.'
  solution: 'Planètes telluriques : Mercure, Terre. Planètes gazeuses : Jupiter, Saturne.'
- id: etapes-formation-seisme
  type: ordre
  difficulte: 2
  enonce: Range ces étapes qui expliquent la formation d'un séisme aux limites de plaques, de la première à la dernière.
  reponse:
    elements:
    - id: frottement
      texte: Les plaques tectoniques frottent l'une contre l'autre à leur limite
    - id: contrainte
      texte: Les frottements accumulent des contraintes dans les roches
    - id: rupture
      texte: Les roches cèdent brutalement
    - id: secousse
      texte: 'L''énergie libérée fait trembler le sol : c''est le séisme'
  indices:
    relance: Qu'est-ce qui doit se produire en premier pour que des contraintes s'accumulent dans les roches ?
    methode: Pars du contact entre les plaques, puis suis l'accumulation d'énergie jusqu'à sa libération brutale.
    etape: Les plaques frottent d'abord l'une contre l'autre ; les roches cèdent en dernier, provoquant la secousse.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux prépare l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qui déclenche tout (le frottement des plaques) et ce qui est la conséquence finale (la secousse
      ressentie), puis range les deux étapes intermédiaires.
  solution: Frottement des plaques, accumulation de contraintes dans les roches, rupture brutale des roches, secousse sismique
    ressentie en surface.
- id: developpement-phenomenes-geologiques
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique, avec deux exemples précis, pourquoi certains phénomènes géologiques (séismes,
    volcans) se produisent surtout à certains endroits du globe.'
  criteres:
  - L'élève relie les phénomènes géologiques au découpage de la lithosphère en plaques tectoniques.
  - L'élève donne un exemple concret (séisme ou volcan) situé à une limite de plaques, comme la ceinture de feu du Pacifique.
  - L'élève explique que les mouvements et frottements aux limites de plaques provoquent ces phénomènes.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Où se trouvent la plupart des séismes et des volcans sur une carte du monde ?
    methode: Choisis un exemple de séisme et un exemple de volcan, puis relie-les aux limites de plaques tectoniques.
    etape: Tu peux commencer ainsi « La lithosphère est découpée en plaques tectoniques... », puis donner ton premier exemple.
  solution: 'La lithosphère est découpée en plaques tectoniques qui se déplacent lentement les unes par rapport aux autres.
    Aux limites de ces plaques, les frottements et les mouvements provoquent des phénomènes géologiques : par exemple, la
    ceinture de feu autour de l''océan Pacifique concentre de nombreux séismes et volcans, car plusieurs plaques s''y rencontrent.
    De même, la formation de chaînes de montagnes résulte de la collision de deux plaques. Ainsi, la localisation des séismes
    et des volcans n''est pas un hasard : elle suit le découpage de la Terre en plaques tectoniques.'
