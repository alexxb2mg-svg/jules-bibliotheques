# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: geodynamique-globale
version: 3
etat: verifiee
declencheurs:
- plaques lithosphériques
- dorsale océanique
- zone de subduction
- tremblement de terre
- éruption volcanique
- planètes rocheuses
- limite de plaques
- chaîne de montagnes
prerequis: []
essentiel: 'La Terre est la troisième planète du système solaire à partir du Soleil. C''est une planète tellurique (rocheuse),
  comme Mercure, Vénus et Mars. Jupiter, Saturne, Uranus et Neptune sont des planètes gazeuses, bien plus grosses.


  La Terre a une forme presque sphérique. Elle tourne sur elle-même en environ 24 heures (alternance du jour et de la nuit)
  et autour du Soleil en environ un an.


  Sa surface est découpée en plaques lithosphériques rigides, qui se déplacent lentement (quelques centimètres par an) grâce
  à la dynamique interne du globe :

  - au niveau des dorsales océaniques, deux plaques s''écartent et du magma remonte ;

  - dans les zones de subduction, une plaque océanique plonge sous une autre plaque ;

  - dans les zones de collision, deux continents s''affrontent et forment une chaîne de montagnes (comme l''Himalaya).


  Un séisme est une rupture brutale des roches en profondeur, le long d''une faille, là où les contraintes accumulées sont
  trop fortes. Le foyer est le lieu de la rupture ; l''épicentre est le point de la surface situé à sa verticale. Des ondes
  sismiques partent du foyer et font trembler le sol.


  Une éruption volcanique est l''arrivée de magma en surface. Elle est effusive (lave fluide, coulées) ou explosive (lave
  visqueuse, explosions, nuées ardentes).


  La plupart des séismes et des volcans se trouvent aux limites des plaques. Quelques volcans, dits de point chaud, sont au
  milieu d''une plaque (La Réunion, Hawaï).


  L''histoire de la Terre, longue d''environ 4,6 milliards d''années, est découpée en ères géologiques (ère primaire, secondaire,
  puis tertiaire et quaternaire). Leurs limites correspondent à de grands changements des êtres vivants, comme la disparition
  des dinosaures (non aviens) il y a environ 66 millions d''années.


  Les volcans de point chaud (Hawaï, La Réunion) se forment quand du magma remonte d''un endroit fixe du manteau, alors que
  la plaque se déplace au-dessus : on obtient une chaîne d''îles volcaniques.


  Au brevet : on lit une carte de la répartition des séismes et des volcans, on les relie aux limites de plaques, on précise
  le mouvement des plaques (s''écartent, se rapprochent, plongent), et on calcule un déplacement à partir d''une vitesse en
  cm par an.

  '
methode:
- 'Situer le phénomène sur une carte : est-il à une limite de plaques ? Laquelle (dorsale, subduction, collision) ?'
- 'Dire comment bougent les plaques à cet endroit : elles s''écartent ou se rapprochent.'
- 'Relier ce mouvement au phénomène observé : séismes, volcans, formation de montagnes.'
- Pour un séisme, distinguer le foyer (en profondeur) de l'épicentre (en surface).
- Pour une durée ou une distance, convertir les unités avant de conclure (cm, m, km ; années, millions d'années).
vocabulaire:
- terme: Plaque lithosphérique
  definition: Grand morceau rigide de la surface de la Terre, qui se déplace lentement.
- terme: Dorsale
  definition: Chaîne de montagnes sous-marine où deux plaques s'écartent et où se forme un nouveau plancher océanique.
- terme: Subduction
  definition: Plongée d'une plaque océanique sous une autre plaque.
- terme: Foyer
  definition: Lieu, en profondeur, où les roches se rompent lors d'un séisme.
- terme: Épicentre
  definition: Point de la surface situé à la verticale du foyer d'un séisme.
- terme: Ère géologique
  definition: Grande division de l'histoire de la Terre, limitée par de grands changements des êtres vivants.
- terme: Planète tellurique
  definition: 'Planète rocheuse, petite et proche du Soleil : Mercure, Vénus, Terre, Mars.'
- terme: Planète gazeuse
  definition: 'Planète très grosse, faite surtout de gaz : Jupiter, Saturne, Uranus, Neptune.'
- terme: Point chaud
  definition: Endroit où du magma remonte au milieu d'une plaque et forme un volcan (Hawaï, La Réunion).
erreurs_frequentes:
- Confondre le foyer (en profondeur) et l'épicentre (en surface).
- 'Croire que les séismes et les volcans sont répartis au hasard : la plupart sont aux limites des plaques.'
- 'Croire que les plaques flottent sur un océan de magma liquide : le manteau est solide, seules de petites zones fondent.'
- 'Croire que les continents ne bougent pas : ils se déplacent de quelques centimètres par an.'
- Ranger la Terre parmi les planètes gazeuses, ou Jupiter parmi les planètes rocheuses.
exemple:
  enonce: 'Range ces ères de la plus ancienne à la plus récente : ère secondaire, ère quaternaire, ère primaire, ère tertiaire.'
  solution: Ère primaire, puis ère secondaire (celle des dinosaures), puis ère tertiaire, puis ère quaternaire (celle où nous
    vivons). Chaque passage d'une ère à la suivante est marqué par de grands changements des êtres vivants.
exercices:
- id: point-au-dessus-du-foyer
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le point de la surface du sol situé juste à la verticale du foyer d'un séisme ?
  reponse:
    acceptees:
    - épicentre
    fautes_tolerees: 1
  indices:
    relance: Le foyer est en profondeur. Quel nom porte le point de la surface qui se trouve juste au-dessus de lui ?
    methode: 'Sur un schéma de séisme, repère le foyer, puis remonte tout droit jusqu''à la surface : ce point a un nom précis,
      c''est souvent là que les secousses sont les plus fortes.'
    etape: Le mot commence par « épi », un préfixe qui veut dire « sur, au-dessus de ».
  pieges:
  - si:
      valeur: foyer
    relance: Le foyer est le lieu de la rupture, en profondeur. On cherche le point situé en surface, juste au-dessus.
  - si:
      valeur: faille
    relance: La faille est la cassure le long de laquelle les roches glissent. On cherche un point précis de la surface.
  solution: 'L''épicentre : c''est le point de la surface situé à la verticale du foyer, là où les roches se sont rompues
    en profondeur.'
- id: planetes-telluriques
  type: choix
  difficulte: 1
  enonce: Parmi ces planètes du système solaire, lesquelles sont des planètes telluriques (rocheuses) ?
  reponse:
    options:
    - id: a
      texte: Mercure
    - id: b
      texte: Jupiter
    - id: c
      texte: Mars
    - id: d
      texte: Saturne
    - id: e
      texte: Vénus
    bonnes:
    - a
    - c
    - e
  indices:
    relance: Les planètes rocheuses sont les plus proches du Soleil. Lesquelles de cette liste sont proches du Soleil ?
    methode: Range les planètes de la liste par distance au Soleil. Les quatre premières du système solaire sont rocheuses,
      les quatre suivantes sont gazeuses.
    etape: La Terre est la troisième planète et elle est rocheuse. Cherche dans la liste celles qui sont plus proches du Soleil
      qu'elle, et sa voisine juste après.
  pieges:
  - si:
      contient:
      - b
    relance: Jupiter est la plus grosse planète du système solaire. Est-elle faite surtout de roches ou surtout de gaz ?
  - si:
      contient:
      - d
    relance: Saturne, avec ses anneaux, est très loin du Soleil. Les planètes lointaines sont-elles rocheuses ou gazeuses
      ?
  - si:
      diagnostic: incomplet
    relance: 'Tu en as trouvé, mais pas toutes. Relis la liste : une autre planète proche du Soleil est aussi rocheuse.'
  solution: Mercure, Vénus et Mars sont, comme la Terre, des planètes telluriques (rocheuses), proches du Soleil. Jupiter
    et Saturne sont des planètes gazeuses.
- id: limites-de-plaques
  type: association
  difficulte: 2
  enonce: Associe chaque limite de plaques au mouvement qui s'y produit.
  reponse:
    gauche:
    - id: a
      texte: Dorsale océanique
    - id: b
      texte: Zone de subduction
    - id: c
      texte: Zone de collision
    droite:
    - id: p
      texte: Deux plaques s'écartent et du magma remonte entre elles
    - id: q
      texte: Une plaque océanique plonge sous une autre plaque
    - id: r
      texte: Deux continents se rapprochent et forment une chaîne de montagnes
    paires:
      a: p
      b: q
      c: r
  indices:
    relance: À une limite de plaques, les plaques peuvent s'écarter ou se rapprocher. Où s'écartent-elles ?
    methode: Pour chaque limite, demande-toi si de la nouvelle croûte se forme, si une plaque disparaît en profondeur, ou
      si des roches s'empilent en montagnes.
    etape: Au milieu de l'océan Atlantique, une longue chaîne sous-marine s'ouvre peu à peu et du magma y monte. Continue
      avec les deux autres limites.
  pieges:
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends le sens des mots : « subduction » veut dire « conduire dessous ». Laquelle des propositions parle d''une
      plaque qui passe dessous ?'
  solution: 'Dorsale : deux plaques s''écartent et du magma remonte. Subduction : une plaque océanique plonge sous une autre
    plaque. Collision : deux continents se rapprochent et forment une chaîne de montagnes.'
- id: etapes-d-un-seisme
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes d'un séisme.
  reponse:
    elements:
    - id: a
      texte: Les plaques bougent et les roches se déforment en accumulant des contraintes
    - id: b
      texte: Les roches cassent brutalement le long d'une faille, au foyer
    - id: c
      texte: Des ondes sismiques partent du foyer dans toutes les directions
    - id: d
      texte: Les ondes atteignent la surface et le sol tremble, surtout autour de l'épicentre
  indices:
    relance: Qu'est-ce qui doit se passer dans les roches avant qu'elles ne cassent ?
    methode: 'Suis l''énergie : elle s''accumule lentement, se libère d''un coup, voyage, puis arrive en surface.'
    etape: 'La première étape est lente et dure longtemps : les roches se déforment sans casser. Que se passe-t-il quand elles
      ne résistent plus ?'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Les ondes peuvent-elles partir avant que les roches aient cassé
      ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par ce qui se passe lentement pendant des années, et termine par ce que ressentent les habitants.
  solution: Les roches se déforment et accumulent des contraintes, puis elles cassent brutalement au foyer, le long d'une
    faille ; des ondes sismiques partent du foyer et, en atteignant la surface, font trembler le sol, surtout autour de l'épicentre.
- id: ecartement-dorsale
  type: nombre
  difficulte: 2
  enonce: Dans ce document, deux îles situées de part et d'autre d'une dorsale s'éloignent l'une de l'autre de 4 cm par an.
    De combien de kilomètres se seront-elles éloignées en 1 million d'années ? Écris seulement le nombre (en km).
  reponse:
    valeur: 40
    forme: libre
  indices:
    relance: Commence par calculer la distance en centimètres. Combien d'années y a-t-il dans 1 million d'années ?
    methode: 'Multiplie la vitesse (en cm par an) par le nombre d''années, puis convertis : 1 m = 100 cm et 1 km = 1 000 m,
      donc 1 km = 100 000 cm.'
    etape: En 1 000 000 d'années, à 4 cm par an, la distance est de 4 × 1 000 000 cm. Convertis maintenant ce résultat en
      kilomètres.
  pieges:
  - si:
      valeur: 4000000
    relance: 'Tu as trouvé la distance en centimètres. La question demande des kilomètres : combien de centimètres y a-t-il
      dans un kilomètre ?'
  - si:
      valeur: 40000
    relance: Ton résultat est en mètres. Il reste à le convertir en kilomètres.
  - si:
      valeur: 400
    relance: 'Vérifie ta conversion : 1 km = 1 000 m et 1 m = 100 cm. Combien de centimètres dans un kilomètre ?'
  solution: 4 cm × 1 000 000 = 4 000 000 cm = 40 000 m = 40 km. Quelques centimètres par an, c'est très lent, mais sur des
    millions d'années cela ouvre un océan.
- id: carte-seismes-volcans
  type: ouverte
  difficulte: 3
  enonce: 'Document : sur une carte du monde, les séismes et les volcans sont représentés par des points. Ces points forment
    de longues bandes étroites : l''une suit la dorsale au milieu de l''océan Atlantique, une autre fait le tour de l''océan
    Pacifique. Ailleurs, on en trouve très peu. Explique ce que cette répartition révèle sur la surface de la Terre.'
  criteres:
  - 'L''élève décrit le document : séismes et volcans sont regroupés en bandes étroites (dorsale atlantique, tour du Pacifique)
    et rares ailleurs.'
  - 'L''élève relie ces bandes aux limites des plaques lithosphériques : la surface de la Terre est découpée en plaques.'
  - L'élève explique que les mouvements des plaques à leurs limites (écartement aux dorsales, rapprochement et subduction
    autour du Pacifique) provoquent séismes et volcanisme.
  indices:
    relance: Pourquoi les séismes et les volcans seraient-ils rangés en bandes, et pas éparpillés partout ?
    methode: Décris d'abord ce que tu vois, puis cherche ce que ces bandes dessinent à la surface de la Terre, puis explique
      ce qui s'y passe.
    etape: Ces bandes dessinent les contours de grands morceaux de la surface terrestre. Comment appelle-t-on ces morceaux,
      et que font-ils à leurs bords ?
  solution: 'Les séismes et les volcans sont concentrés en bandes étroites, par exemple le long de la dorsale atlantique et
    autour du Pacifique. Ces bandes dessinent les limites des plaques lithosphériques : la surface de la Terre est découpée
    en plaques qui bougent. Aux dorsales, les plaques s''écartent et du magma remonte ; autour du Pacifique, des plaques océaniques
    plongent sous d''autres plaques (subduction). Ces mouvements cassent les roches (séismes) et font monter du magma (volcans).
    Au milieu des plaques, il se passe beaucoup moins de choses.'
- id: plus-grosse-planete
  type: texte_court
  difficulte: 1
  enonce: Quelle est la plus grosse planète du système solaire, une planète gazeuse ? Réponds par son nom.
  reponse:
    acceptees:
    - jupiter
    fautes_tolerees: 1
  indices:
    relance: C'est une des quatre planètes gazeuses, loin du Soleil.
    methode: Il y a quatre planètes gazeuses, loin du Soleil ; on cherche la plus grosse de toutes.
    etape: Cette planète porte le nom du roi des dieux romains et a une grande tache rouge.
  pieges:
  - si:
      valeur: terre
    relance: La Terre est une planète tellurique, bien plus petite. On cherche une planète gazeuse.
  - si:
      valeur: saturne
    relance: Saturne est une planète gazeuse, mais ce n'est pas la plus grosse. Cherche encore.
  solution: Jupiter est la plus grosse planète du système solaire ; c'est une planète gazeuse.
- id: effusif-ou-explosif
  type: association
  difficulte: 2
  enonce: Associe chaque description au type d'éruption volcanique.
  reponse:
    gauche:
    - id: a
      texte: Lave fluide qui s'écoule en coulées.
    - id: b
      texte: Lave visqueuse et nuées ardentes.
    - id: c
      texte: Explosions violentes qui projettent des cendres.
    - id: d
      texte: Lave qui coule facilement sur les flancs du volcan.
    droite:
    - id: x
      texte: éruption effusive
    - id: y
      texte: éruption explosive
    paires:
      a: x
      b: y
      c: y
      d: x
  indices:
    relance: 'Une lave fluide s''écoule facilement. Une lave visqueuse, épaisse, bouche le volcan : que se passe-t-il alors
      ?'
    methode: 'Éruption effusive : lave fluide, coulées. Éruption explosive : lave visqueuse, explosions, nuées ardentes.'
    etape: 'La phrase a parle d''une lave fluide qui coule : de quel type d''éruption s''agit-il ? Continue avec les autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la description de la lave (fluide ou visqueuse) dans chaque phrase.
  - si:
      diagnostic: associations_fausses
    relance: Pour chaque phrase, demande-toi si la lave coule facilement ou si elle explose.
  solution: a-effusive, d-effusive (lave fluide qui coule) ; b-explosive, c-explosive (lave visqueuse, explosions, nuées ardentes).
- id: nblm-parmi-les-propositions-suivantes-concern-1
  type: choix
  difficulte: 2
  enonce: Parmi les propositions suivantes concernant le système solaire, quelles sont les planètes rocheuses (ou telluriques)
    aux côtés de la Terre ?
  reponse:
    options:
    - id: o1
      texte: Mercure, Vénus et Mars
    - id: o2
      texte: Jupiter, Saturne et Uranus
    - id: o3
      texte: Mercure, Jupiter et Mars
    - id: o4
      texte: Vénus, Neptune et Mars
    bonnes:
    - o1
  indices:
    relance: Pense aux quatre planètes les plus proches du Soleil qui possèdent une surface solide.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, Jupiter, Saturne, Uranus et Neptune sont des planètes gazeuses et beaucoup plus grosses.
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : Jupiter n''est pas une planète rocheuse mais une géante gazeuse.'
  - si:
      contient:
      - o4
    relance: Attention, Neptune fait partie des planètes gazeuses et non des planètes rocheuses.
  solution: Mercure, Vénus et Mars. C'est exact. La Terre, Mercure, Vénus et Mars sont les quatre planètes rocheuses (ou telluriques)
    du système solaire.
- id: nblm-qu-est-ce-qu-une-plaque-lithospherique-a-2
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qu'une plaque lithosphérique à la surface de la Terre ?
  reponse:
    options:
    - id: o1
      texte: Un grand morceau rigide de la surface terrestre qui se déplace lentement de quelques centimètres par an.
    - id: o2
      texte: Un morceau de roche qui flotte et glisse sur un océan de magma entièrement liquide.
    - id: o3
      texte: Un continent immobile qui ne s'est jamais déplacé depuis la formation de la Terre.
    - id: o4
      texte: Une couche atmosphérique gazeuse située au-dessus des océans.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'état physique rigide de ces grands blocs et leur vitesse de déplacement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le manteau sous la lithosphère est solide et non formé d''un océan de magma liquide.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : les continents se déplacent de quelques centimètres par an car ils sont portés par les plaques.'
  - si:
      contient:
      - o4
    relance: Attention, la lithosphère est la couche rocheuse rigide externe de la Terre, pas une couche de l'atmosphère.
  solution: Un grand morceau rigide de la surface terrestre qui se déplace lentement de quelques centimètres par an. C'est
    exact. La surface de la Terre est découpée en plaques lithosphériques rigides en déplacement lent.
- id: nblm-quel-mecanisme-geologique-majeur-se-dero-3
  type: choix
  difficulte: 2
  enonce: Quel mécanisme géologique majeur se déroule au niveau d'une dorsale océanique ?
  reponse:
    options:
    - id: o1
      texte: Deux plaques lithosphériques s'écartent et du magma remonte, formant un nouveau plancher océanique.
    - id: o2
      texte: Deux continents entrent en collision pour former une haute chaîne de montagnes.
    - id: o3
      texte: Une plaque océanique plonge profondément sous une autre plaque dans le manteau.
    - id: o4
      texte: Deux plaques coulissent latéralement sans création ni destruction de lithosphère.
    bonnes:
    - o1
  indices:
    relance: Pense au mouvement d'écartement entre deux plaques sous l'océan.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, l'affrontement de deux continents forme une chaîne de montagnes dans une zone de collision, pas à
      une dorsale.
  - si:
      contient:
      - o3
    relance: 'Erreur classique : la plongée d''une plaque sous une autre caractérise une zone de subduction, pas une dorsale.'
  - si:
      contient:
      - o4
    relance: Attention, à la dorsale il y a un écartement créateur de nouveau plancher océanique par remontée magmatique.
  solution: Deux plaques lithosphériques s'écartent et du magma remonte, formant un nouveau plancher océanique. C'est juste.
    La dorsale océanique est une chaîne de montagnes sous-marine où deux plaques s'écartent avec remontée de magma.
- id: nblm-comment-se-definit-une-zone-de-subductio-4
  type: choix
  difficulte: 2
  enonce: Comment se définit une zone de subduction ?
  reponse:
    options:
    - id: o1
      texte: Une zone où une plaque océanique plonge sous une autre plaque.
    - id: o2
      texte: Une zone sous-marine où deux plaques s'écartent en créant de la roche.
    - id: o3
      texte: Une région située uniquement au milieu d'une plaque continentale.
    - id: o4
      texte: Une zone où aucun séisme ni volcan ne peut se produire.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au mouvement de rapprochement où une plaque enfonce sa bordure sous une autre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, l'écartement des plaques se produit au niveau d'une dorsale océanique.
  - si:
      contient:
      - o3
    relance: Attention, la subduction a lieu à la frontière entre deux plaques lithosphériques.
  - si:
      contient:
      - o4
    relance: Attention, les zones de subduction sont le siège d'une intense activité sismique et volcanique.
  solution: Une zone où une plaque océanique plonge sous une autre plaque. C'est exact. La subduction correspond à la plongée
    d'une plaque océanique sous une autre plaque.
- id: nblm-lors-d-un-tremblement-de-terre-comment-d-5
  type: choix
  difficulte: 2
  enonce: Lors d'un tremblement de terre, comment distingue-t-on le foyer de l'épicentre ? [2-5]
  reponse:
    options:
    - id: o1
      texte: Le foyer est le lieu de rupture des roches en profondeur, tandis que l'épicentre est le point en surface à sa
        verticale.
    - id: o2
