format: 2
notion: alea-vulnerabilite-risque
version: 1
etat: verifiee
declencheurs:
- dégâts d'un séisme en ville
- alerte cyclonique
- normes antisismiques
- danger naturel prévisible
- zone inondable interdite de construction
- surveillance volcanique
prerequis:
- geodynamique-globale
essentiel: 'Un aléa est un phénomène naturel (séisme, cyclone, inondation, éruption volcanique…) susceptible de se produire
  dans une région, avec une intensité et une probabilité que l''on peut parfois estimer.


  La vulnérabilité désigne la sensibilité d''une population ou d''un territoire face à cet aléa : elle dépend par exemple
  de la densité de population, de la qualité des constructions ou des moyens d''alerte disponibles.


  Le risque résulte de la combinaison de l''aléa et de la vulnérabilité : un aléa fort sur une zone inhabitée présente un
  risque faible, alors qu''un aléa modéré sur une zone très peuplée et mal préparée présente un risque élevé.


  Face aux risques (naturels ou liés aux activités humaines, comme la pollution ou le réchauffement climatique), plusieurs
  types de réponses existent : la prévention (limiter l''exposition avant que l''événement se produise), la protection (construire
  des digues, des normes antisismiques), l''adaptation et l''atténuation (réduire les causes du phénomène, notamment pour
  le climat).


  La prévision, quand elle est possible (alertes cycloniques, surveillance volcanique), permet d''anticiper certains aléas
  et de réduire les conséquences sur les populations.'
methode:
- Distinguer l'aléa (le phénomène naturel lui-même) de la vulnérabilité (l'exposition et la fragilité des populations).
- Retenir que le risque = combinaison de l'aléa et de la vulnérabilité, pas l'aléa seul.
- Associer chaque réponse (prévention, protection, adaptation, atténuation) à une situation concrète.
- Repérer si un aléa est prévisible (cyclone) ou non (séisme, largement imprévisible à ce jour).
vocabulaire:
- terme: aléa
  definition: un phénomène naturel susceptible de se produire dans une région, avec une intensité et une probabilité estimables
- terme: vulnérabilité
  definition: la sensibilité d'une population ou d'un territoire face à un aléa, selon son exposition et sa préparation
- terme: risque
  definition: la combinaison de l'aléa et de la vulnérabilité, qui détermine les conséquences possibles d'un phénomène naturel
erreurs_frequentes:
- 'Confondre aléa et risque : un aléa fort sans population exposée n''engendre pas de risque important.'
- Croire que tous les aléas naturels sont aujourd'hui prévisibles avec précision (les séismes ne le sont pas).
- Penser que la prévention supprime totalement le risque, alors qu'elle le réduit seulement.
- Confondre protection (mesures concrètes, comme des digues) et prévention (limiter l'exposition en amont).
exemple:
  enonce: Un séisme de même intensité se produit dans un désert inhabité, puis dans une grande ville mal préparée. Le risque
    est-il le même dans les deux cas ?
  solution: 'Non : l''aléa (l''intensité du séisme) est identique, mais la vulnérabilité diffère fortement (personne exposé
    dans le désert, forte population et bâtiments non adaptés en ville). Le risque est donc beaucoup plus élevé en ville.'
exercices:
- id: definition-risque
  type: choix
  difficulte: 1
  enonce: Comment définit-on le risque, en sciences ?
  reponse:
    options:
    - id: a
      texte: La combinaison de l'aléa et de la vulnérabilité d'une population ou d'un territoire
    - id: b
      texte: Uniquement l'intensité du phénomène naturel, sans tenir compte de la population
    - id: c
      texte: Uniquement le nombre d'habitants d'une région, sans tenir compte de l'aléa
    bonnes:
    - a
  indices:
    relance: Le risque dépend de deux éléments réunis, pas d'un seul.
    methode: Élimine les réponses qui ne prennent en compte qu'un seul des deux facteurs.
    etape: Le risque combine à la fois le phénomène naturel lui-même et la sensibilité de la population exposée.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette réponse ignore la vulnérabilité de la population : un aléa fort sans personne exposée n''engendre pas
      un risque important.'
  - si:
      contient:
      - c
    relance: Cette réponse ignore l'intensité du phénomène naturel lui-même. Le risque dépend aussi de l'aléa.
  solution: Le risque résulte de la combinaison de l'aléa (le phénomène naturel) et de la vulnérabilité (la sensibilité de
    la population ou du territoire exposé).
- id: mot-mesure-avant-evenement
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le type de mesure qui vise à limiter l'exposition d'une population avant qu'un aléa ne se produise
    (par exemple interdire de construire en zone inondable) ?
  reponse:
    acceptees:
    - prévention
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne une action réalisée en amont, avant que le phénomène naturel n'arrive.
    methode: Ce n'est pas un ouvrage concret comme une digue, mais une règle appliquée avant l'événement.
    etape: Ce mot commence par « pré- », qui indique une action réalisée avant.
  pieges:
  - si:
      valeur: protection
    relance: La protection désigne plutôt un ouvrage concret construit pour se défendre, comme une digue. Cherche le mot qui
      désigne une action réalisée en amont, avant l'événement.
  - si:
      valeur: adaptation
    relance: L'adaptation consiste à ajuster ses pratiques face à un phénomène qui évolue, ce n'est pas la même chose que
      limiter l'exposition en amont.
  solution: 'C''est la prévention : elle vise à limiter l''exposition d''une population avant que l''événement ne se produise,
    par exemple en interdisant de construire en zone inondable.'
- id: previsibilite-alea
  type: choix
  difficulte: 2
  enonce: Pourquoi peut-on dire qu'un cyclone est un aléa mieux prévisible qu'un séisme ?
  reponse:
    options:
    - id: a
      texte: Les cyclones sont suivis par satellite plusieurs jours à l'avance, contrairement aux séismes qui se déclenchent
        brutalement
    - id: b
      texte: Les cyclones ne causent jamais de dégâts, contrairement aux séismes
    - id: c
      texte: Les séismes sont annoncés plusieurs semaines à l'avance par les scientifiques
    bonnes:
    - a
  indices:
    relance: Pense aux outils de suivi météorologique par satellite, qui n'existent pas pour détecter les séismes.
    methode: Élimine les réponses qui affirment une absence de dégâts ou une annonce anticipée des séismes, ce qui est faux.
    etape: Les cyclones peuvent être suivis par satellite avant leur arrivée ; les séismes, eux, surviennent sans signe annonciateur
      fiable détecté à ce jour.
  pieges:
  - si:
      contient:
      - b
    relance: Les cyclones peuvent au contraire causer d'importants dégâts. Ce n'est pas ce qui explique leur prévisibilité.
  - si:
      contient:
      - c
    relance: 'Les séismes ne sont pas annoncés à l''avance par les scientifiques : ils se déclenchent brutalement, sans signe
      annonciateur fiable détecté à ce jour.'
  solution: Les cyclones sont suivis par satellite plusieurs jours à l'avance, ce qui permet des alertes ; les séismes, eux,
    se déclenchent brutalement sans signe annonciateur fiable détecté à ce jour.
- id: association-reponse-risque
  type: association
  difficulte: 2
  enonce: Associe chaque réponse face au risque à un exemple concret.
  reponse:
    gauche:
    - id: a
      texte: Prévention
    - id: b
      texte: Protection
    - id: c
      texte: Atténuation
    droite:
    - id: x
      texte: Interdire de construire en zone inondable
    - id: y
      texte: Construire des digues ou des bâtiments aux normes antisismiques
    - id: z
      texte: Réduire les émissions de gaz à effet de serre pour limiter le réchauffement climatique
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: La prévention agit en amont, la protection construit un ouvrage concret, l'atténuation réduit la cause du phénomène.
    methode: Repère d'abord l'atténuation, qui est la seule réponse liée à la réduction d'une cause globale comme le climat.
    etape: La prévention limite l'exposition avant l'événement ; la protection construit des ouvrages ; l'atténuation réduit
      les causes du phénomène.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre limiter l'exposition en amont et construire un
      ouvrage concret.
  - si:
      diagnostic: associations_fausses
    relance: Pars de l'atténuation, la plus facile à reconnaître car elle concerne la réduction des causes du changement climatique.
  solution: 'Prévention : interdire de construire en zone inondable. Protection : construire des digues ou des bâtiments aux
    normes antisismiques. Atténuation : réduire les émissions de gaz à effet de serre.'
- id: ordre-gestion-risque-inondation
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre logique de la gestion d'un risque d'inondation, de l'identification du danger jusqu'à
    la protection des habitants.
  reponse:
    elements:
    - id: identification
      texte: Identifier l'aléa (le risque de crue d'une rivière dans la région)
    - id: evaluation
      texte: Évaluer la vulnérabilité de la population exposée (habitations en zone basse, moyens d'alerte)
    - id: prevention
      texte: Mettre en place des mesures de prévention (interdire de construire en zone inondable)
    - id: protection
      texte: Construire des ouvrages de protection (digues, bassins de rétention)
  indices:
    relance: Que faut-il connaître en premier avant de pouvoir évaluer la vulnérabilité d'une population ?
    methode: Pars de l'identification du phénomène naturel, puis évalue son impact sur la population, avant d'agir.
    etape: L'identification de l'aléa vient en premier ; la construction d'ouvrages de protection est une étape plus tardive
      et concrète.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle des deux doit être réalisée avant l'autre pour bien gérer le risque
      ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par identifier le phénomène naturel lui-même, puis évalue la population exposée, avant de passer aux
      mesures concrètes.
  solution: Identifier l'aléa, évaluer la vulnérabilité de la population exposée, mettre en place des mesures de prévention,
    construire des ouvrages de protection.
- id: developpement-risque-aleas
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique pourquoi le risque n''est pas seulement une question d''aléa naturel, en donnant
    un exemple précis.'
  criteres:
  - L'élève définit aléa, vulnérabilité et risque correctement.
  - L'élève explique que le risque dépend de la combinaison de l'aléa et de la vulnérabilité, pas de l'aléa seul.
  - L'élève donne un exemple concret comparant deux situations différentes (comme un même séisme dans deux lieux différents).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense à la définition du risque comme combinaison de deux facteurs.
    methode: Utilise l'exemple d'un même phénomène naturel dans deux lieux très différents pour illustrer ton propos.
    etape: Tu peux commencer ainsi « Le risque ne dépend pas uniquement du phénomène naturel lui-même... »
  solution: 'Le risque ne dépend pas uniquement du phénomène naturel lui-même, appelé aléa, mais aussi de la vulnérabilité
    de la population ou du territoire exposé. Par exemple, un séisme de même intensité peut se produire dans un désert inhabité
    ou dans une grande ville mal préparée : dans le premier cas, l''aléa est fort mais la vulnérabilité est nulle, donc le
    risque est faible ; dans le second cas, la forte population et des bâtiments non adaptés augmentent fortement la vulnérabilité,
    donc le risque devient élevé. Ainsi, réduire un risque ne consiste pas seulement à surveiller les aléas, mais aussi à
    agir sur la vulnérabilité des populations, par la prévention et la protection.'
