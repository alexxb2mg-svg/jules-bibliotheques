format: 2
notion: alea-vulnerabilite-risque
version: 2
etat: verifiee
declencheurs:
- construction parasismique
- zone inondable
- alerte cyclone
- enjeux exposés
- plan de prévention des risques
- mesures de protection
- aléa et enjeux
- s'adapter à la montée des eaux
prerequis:
- geodynamique-globale
- 4e-risques-naturels-prevention
essentiel: 'Un aléa est un phénomène naturel (séisme, cyclone, inondation, éruption…) ou lié aux activités humaines, qui peut
  se produire en un lieu. On le décrit par sa probabilité (est-il fréquent ?) et par son intensité (est-il violent ?).


  Les enjeux sont les personnes, les biens et les activités exposés à cet aléa. La vulnérabilité mesure leur fragilité : bâtiments
  non adaptés, absence d''alerte, population non informée, pas d''abri.


  Le risque naît de la rencontre entre un aléa et des enjeux vulnérables. Un séisme violent dans un désert vide représente
  un risque faible ; un séisme moyen dans une grande ville aux bâtiments fragiles représente un risque élevé. On agit rarement
  sur l''aléa naturel lui-même : on agit surtout sur la vulnérabilité.


  La prévision permet d''annoncer certains phénomènes : on suit un cyclone plusieurs jours à l''avance, on surveille les volcans
  et les rivières. En revanche, on ne sait pas prévoir la date exacte d''un séisme.


  Face aux risques, on distingue :

  - la prévention : informer, cartographier les zones à risque, interdire de construire en zone inondable, organiser des exercices
  et des alertes ;

  - la protection : construire des bâtiments parasismiques, des digues, des abris, pour limiter les dégâts ;

  - pour les risques liés aux activités humaines (pollution, réchauffement climatique, montée du niveau des océans), l''atténuation
  (agir sur la cause, par exemple réduire les émissions de gaz à effet de serre) et l''adaptation (s''organiser pour vivre
  avec les changements, par exemple choisir des cultures résistantes à la sécheresse).


  Au brevet : on donne un document (carte, texte, tableau) et on demande d''identifier l''aléa, les enjeux et la vulnérabilité,
  de conclure sur le niveau de risque, puis de proposer une mesure en la classant (prévention, protection, atténuation ou
  adaptation) et en disant ce qu''elle réduit.


  Exemple de raisonnement : une digue est une mesure de protection ; elle réduit les dégâts d''une crue mais ne supprime pas
  l''aléa, et le risque reste.

  '
methode:
- 'Identifier l''aléa : quel phénomène, avec quelle probabilité et quelle intensité ?'
- 'Identifier les enjeux : qui et quoi est exposé (habitants, maisons, routes, écoles) ?'
- 'Évaluer la vulnérabilité : les enjeux sont-ils préparés et protégés ?'
- Conclure sur le risque en croisant l'aléa et la vulnérabilité des enjeux.
- 'Proposer une mesure et la classer : prévision, prévention, protection, atténuation ou adaptation.'
vocabulaire:
- terme: Aléa
  definition: Phénomène qui peut se produire, décrit par sa probabilité et son intensité.
- terme: Enjeux
  definition: Personnes, biens et activités exposés à un aléa.
- terme: Vulnérabilité
  definition: Fragilité des enjeux face à un aléa.
- terme: Risque
  definition: Rencontre entre un aléa et des enjeux vulnérables ; il est d'autant plus grand que l'aléa est fort et les enjeux
    vulnérables.
- terme: Atténuation
  definition: Action sur la cause d'un risque lié aux activités humaines, par exemple réduire les rejets de gaz à effet de
    serre.
- terme: Adaptation
  definition: Changement de nos façons de vivre pour faire face à des conséquences qu'on ne peut plus éviter.
- terme: Prévision
  definition: Annonce d'un phénomène avant qu'il se produise, grâce à la surveillance (cyclone, crue, éruption).
- terme: Prévention
  definition: 'Ensemble des actions menées avant le phénomène : informer, cartographier, limiter les constructions, s''entraîner.'
- terme: Protection
  definition: Ensemble des ouvrages et techniques qui limitent les dégâts (bâtiments parasismiques, digues).
erreurs_frequentes:
- 'Confondre aléa et risque : un séisme dans une région vide est un aléa, mais le risque y est faible.'
- 'Croire qu''on peut empêcher un séisme ou un cyclone : on agit sur la vulnérabilité, pas sur l''aléa naturel.'
- Croire qu'on sait prévoir le jour et l'heure d'un séisme.
- 'Croire qu''une mesure de protection rend le risque nul : elle le réduit seulement.'
- Confondre atténuation (agir sur la cause) et adaptation (vivre avec les conséquences).
exemple:
  enonce: Une petite île inhabitée et une grande ville côtière sont menacées par le même cyclone. Où le risque est-il le plus
    élevé ?
  solution: 'L''aléa est le même (le même cyclone). Sur l''île inhabitée, il n''y a presque pas d''enjeux : le risque est
    faible. Dans la grande ville, beaucoup de personnes et de biens sont exposés : le risque est bien plus élevé, surtout
    si les habitations sont fragiles.'
exercices:
- id: nom-du-phenomene
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un phénomène qui peut se produire en un lieu, comme un séisme ou un cyclone, décrit par sa
    probabilité et son intensité, sans tenir compte des personnes exposées ?
  reponse:
    acceptees:
    - aléa
    - aléas
    - aléa naturel
    fautes_tolerees: 0
  indices:
    relance: On ne parle pas encore des habitants ni des maisons, seulement du phénomène lui-même. Quel mot du cours désigne
      cela ?
    methode: 'Le cours distingue trois mots : le phénomène, la fragilité des enjeux, et la rencontre des deux. On cherche
      le premier.'
    etape: 'Le mot a quatre lettres et évoque le hasard : on parle aussi d''un événement « aléatoire ».'
  pieges:
  - si:
      valeur: risque
    relance: Le risque n'existe que si des personnes ou des biens sont exposés. Quel mot désigne le phénomène lui-même ?
  - si:
      valeur: vulnérabilité
    relance: La vulnérabilité décrit la fragilité des habitants et des bâtiments. On cherche le mot qui désigne le phénomène
      naturel.
  - si:
      valeur: catastrophe
    relance: Une catastrophe, ce sont des dégâts déjà arrivés. On cherche le mot qui désigne un phénomène possible, décrit
      par sa probabilité et son intensité.
  solution: 'L''aléa : c''est le phénomène possible (séisme, cyclone, inondation…), décrit par sa probabilité et son intensité.'
- id: deux-villes-meme-seisme
  type: choix
  difficulte: 2
  enonce: Deux villes subissent un séisme de même intensité. Dans la ville A, les bâtiments sont parasismiques et les habitants
    font des exercices d'évacuation. Dans la ville B, les bâtiments sont fragiles et personne n'a été informé. Quelles affirmations
    sont justes ?
  reponse:
    options:
    - id: a
      texte: Le risque est plus élevé dans la ville B.
    - id: b
      texte: L'aléa est plus fort dans la ville B.
    - id: c
      texte: La ville B est plus vulnérable.
    - id: d
      texte: Il n'y a aucun risque dans la ville A.
    bonnes:
    - a
    - c
  indices:
    relance: Qu'est-ce qui est pareil dans les deux villes, et qu'est-ce qui est différent ?
    methode: 'Rappelle-toi les définitions : l''aléa est le phénomène, la vulnérabilité est la fragilité des enjeux, le risque
      croise les deux.'
    etape: 'Le séisme a la même intensité dans les deux villes : l''aléa est donc le même. Regarde maintenant ce qui change
      entre A et B.'
  pieges:
  - si:
      contient:
      - b
    relance: Le séisme a la même intensité dans les deux villes. L'aléa peut-il être plus fort dans l'une que dans l'autre
      ?
  - si:
      contient:
      - d
    relance: Des bâtiments parasismiques réduisent les dégâts. Mais le danger disparaît-il complètement ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé une, mais une autre affirmation est juste aussi.
  solution: Les affirmations a et c sont justes. L'aléa est le même (même séisme), mais la ville B est plus vulnérable (bâtiments
    fragiles, population non informée), donc le risque y est plus élevé. Dans la ville A, le risque est réduit, mais il n'est
    pas nul.
- id: classer-les-mesures
  type: association
  difficulte: 2
  enonce: Associe chaque mesure au type d'action qu'elle représente.
  reponse:
    gauche:
    - id: a
      texte: Informer les habitants et organiser des exercices d'alerte
    - id: b
      texte: Construire des bâtiments parasismiques
    - id: c
      texte: Réduire la consommation de charbon et de pétrole pour rejeter moins de gaz à effet de serre
    - id: d
      texte: Choisir des cultures qui résistent mieux aux sécheresses, devenues plus fréquentes
    droite:
    - id: p
      texte: Prévention
    - id: q
      texte: Protection
    - id: r
      texte: Atténuation
    - id: s
      texte: Adaptation
    paires:
      a: p
      b: q
      c: r
      d: s
  indices:
    relance: Laquelle de ces mesures agit sur la cause du réchauffement climatique ?
    methode: 'Prévention : préparer et informer. Protection : limiter les dégâts. Atténuation : agir sur la cause. Adaptation
      : vivre avec des changements qu''on ne peut plus éviter.'
    etape: Informer et entraîner la population, c'est la préparer avant le phénomène. Continue avec les trois autres mesures.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Presque ! Une seule association est fausse. Vérifie la différence entre agir sur la cause et s'adapter aux conséquences.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque mesure : agit-elle avant le phénomène, pendant (en limitant les dégâts), sur la cause, ou sur
      la façon de vivre avec ?'
  solution: 'Informer et entraîner : prévention. Bâtiments parasismiques : protection. Moins de charbon et de pétrole : atténuation
    (on agit sur la cause du réchauffement). Cultures résistantes à la sécheresse : adaptation.'
- id: gestion-d-un-cyclone
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes de la gestion d'un cyclone.
  reponse:
    elements:
    - id: a
      texte: Des satellites repèrent la formation du cyclone au-dessus de l'océan
    - id: b
      texte: Les météorologues prévoient sa trajectoire et déclenchent l'alerte
    - id: c
      texte: Les habitants se mettent à l'abri ou quittent les zones exposées
    - id: d
      texte: Après le passage du cyclone, les secours interviennent et on répare
  indices:
    relance: Avant de prévenir la population, que faut-il savoir sur le cyclone ?
    methode: 'Range les étapes dans le temps : surveillance, prévision et alerte, mise à l''abri, puis après la catastrophe.'
    etape: La première étape est l'observation du cyclone en train de se former. Qui peut l'observer au-dessus de l'océan
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Les habitants peuvent-ils se mettre à l'abri avant d'avoir reçu
      l'alerte ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par ce qui se passe loin des côtes, quand le cyclone naît, et termine par ce qui se passe après son
      passage.
  solution: Les satellites repèrent le cyclone ; les météorologues prévoient sa trajectoire et donnent l'alerte ; les habitants
    se mettent à l'abri ; après son passage, les secours interviennent et on répare.
- id: habitants-en-zone-inondable
  type: nombre
  difficulte: 1
  enonce: Dans ce document, une commune compte 12 000 habitants, dont 3 000 vivent en zone inondable. Quel pourcentage des
    habitants vit en zone inondable ? Écris seulement le nombre.
  reponse:
    valeur: 25
    forme: libre
  indices:
    relance: Quelle part des habitants vit en zone inondable ? Écris-la d'abord sous forme de fraction.
    methode: Pourcentage = nombre d'habitants concernés ÷ nombre total d'habitants × 100.
    etape: Calcule 3 000 ÷ 12 000, puis multiplie le résultat par 100.
  pieges:
  - si:
      valeur: 3000
    relance: C'est le nombre d'habitants concernés. La question demande un pourcentage de toute la commune.
  - si:
      valeur: 4
    relance: Tu as divisé le nombre total par le nombre d'habitants concernés. Fais la division dans l'autre sens.
  - si:
      valeur: 0.25
    relance: Tu as trouvé la part sous forme décimale. Il reste à la multiplier par 100 pour avoir un pourcentage.
  solution: '3 000 ÷ 12 000 = 0,25, et 0,25 × 100 = 25. Donc 25 % des habitants vivent en zone inondable : ce sont des enjeux
    exposés à l''aléa inondation.'
- id: meme-cyclone-deux-bilans
  type: ouverte
  difficulte: 3
  enonce: 'Document : deux régions du monde sont frappées par des cyclones de même force. Dans la région 1, un réseau de surveillance
    annonce le cyclone plusieurs jours à l''avance, les maisons sont solides et des abris existent : il y a peu de victimes.
    Dans la région 2, l''alerte arrive tard et beaucoup d''habitations sont fragiles : il y a de nombreuses victimes. Explique
    pourquoi les bilans sont si différents, en utilisant les mots aléa, vulnérabilité et risque, puis propose une mesure pour
    la région 2.'
  criteres:
  - L'élève montre, à partir du document, que l'aléa est le même dans les deux régions (cyclones de même force).
  - L'élève explique que la région 2 est plus vulnérable (alerte tardive, habitations fragiles, pas d'abris), donc que le
    risque y est plus élevé.
  - L'élève propose une mesure adaptée pour la région 2 (surveillance et alerte, information, abris, constructions plus solides)
    et dit ce qu'elle réduit.
  indices:
    relance: Le cyclone est-il plus fort dans une région que dans l'autre ? Alors, qu'est-ce qui change ?
    methode: 'Utilise les trois mots dans l''ordre : ce qui est pareil (l''aléa), ce qui est différent (la vulnérabilité),
      ce qui en résulte (le risque).'
    etape: 'Relève dans le document tout ce qui protège la région 1 et manque à la région 2 : ce sont des différences de vulnérabilité.'
  solution: 'Les cyclones ont la même force : l''aléa est le même. Mais la région 2 est beaucoup plus vulnérable : l''alerte
    arrive tard, les maisons sont fragiles et il n''y a pas d''abris. Le risque, qui croise l''aléa et la vulnérabilité, y
    est donc bien plus élevé, d''où les nombreuses victimes. Pour la région 2, on peut installer un réseau de surveillance
    et d''alerte, informer la population et construire des abris : cela réduit la vulnérabilité, donc le risque.'
- id: prevoir-un-seisme
  type: texte_court
  difficulte: 1
  enonce: Sait-on aujourd'hui prévoir la date exacte d'un séisme ? Réponds par oui ou par non.
  reponse:
    acceptees:
    - non
    fautes_tolerees: 0
  indices:
    relance: Pense à la différence avec un cyclone, qu'on suit plusieurs jours à l'avance.
    methode: 'Relis dans le cours le paragraphe sur la prévision : quels phénomènes peut-on annoncer, et lequel ne peut-on
      pas annoncer ?'
    etape: Les cyclones et les crues des rivières se surveillent. Le cours dit-il la même chose pour la date exacte d'un séisme
      ?
  pieges:
  - si:
      valeur: oui
    relance: On sait où les séismes sont probables, mais pas quand ils auront lieu. Relis le paragraphe sur la prévision.
  solution: 'Non : on connaît les régions à risque, mais on ne sait pas prévoir le jour ni l''heure d''un séisme. On agit
    donc surtout sur la prévention et la protection.'
- id: aleas-enjeux-vulnerabilite
  type: association
  difficulte: 2
  enonce: Associe chaque élément d'une situation au mot qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: Un cyclone très violent se forme au-dessus de l'océan.
    - id: b
      texte: Une école de 300 élèves est située sur la côte.
    - id: c
      texte: Les maisons sont fragiles et aucun abri n'existe.
    droite:
    - id: x
      texte: aléa
    - id: y
      texte: enjeu
    - id: z
      texte: vulnérabilité
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Lequel de ces éléments est le phénomène, lequel est ce qui est exposé, lequel décrit la fragilité ?
    methode: 'Aléa : le phénomène. Enjeu : ce qui est exposé (personnes, biens). Vulnérabilité : la fragilité de ces enjeux.'
    etape: 'La phrase a parle d''un phénomène qui se forme : de quel mot du cours s''agit-il ? Continue avec b et c.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Les enjeux sont des personnes ou des biens, la vulnérabilité est leur fragilité.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque phrase : décrit-elle un phénomène, des personnes ou biens exposés, ou une fragilité ?'
  solution: a-aléa (le cyclone est le phénomène) ; b-enjeu (l'école et ses élèves sont exposés) ; c-vulnérabilité (maisons
    fragiles, pas d'abri).
- id: nblm-comment-se-definit-un-risque-majeur-lie-1
  type: choix
  difficulte: 2
  enonce: Comment se définit un risque majeur lié à un phénomène naturel ?
  reponse:
    options:
    - id: o1
      texte: La rencontre entre un aléa et des enjeux exposés qui sont vulnérables.
    - id: o2
      texte: La présence d'un cyclone violent sur une île complètement inhabitée.
    - id: o3
      texte: Uniquement la probabilité et l'intensité d'un séisme dans une région.
    - id: o4
      texte: L'impossibilité absolue d'aménager un territoire face aux éléments naturels.
    bonnes:
    - o1
  indices:
    relance: Pense aux deux facteurs nécessaires dont le croisement crée une situation de danger pour la population.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : s''il n''y a personne ni bien exposé, l''aléa est fort mais le risque reste très faible.'
  - si:
      contient:
      - o3
    relance: Ceci définit l'aléa, pas le risque. Sans enjeux exposés vulnérables, il n'y a pas de risque majeur.
  - si:
      contient:
      - o4
    relance: 'C''est faux : on peut réduire la vulnérabilité en adaptant l''aménagement du territoire et les habitations.'
  solution: 'La rencontre entre un aléa et des enjeux exposés qui sont vulnérables. C''est exact : le risque existe uniquement
    lorsque le phénomène naturel (aléa) menace des personnes, biens ou activités (enjeux exposés) fragiles.'
- id: nblm-quelle-mesure-releve-de-la-prevention-da-2
  type: choix
  difficulte: 2
  enonce: Quelle mesure relève de la prévention dans le cadre d'un plan de prévention des risques face aux inondations ?
  reponse:
    options:
    - id: o1
      texte: Interdire les nouvelles constructions dans une zone inondable.
    - id: o2
      texte: Construire une digue le long d'un fleuve pour retenir l'eau.
    - id: o3
      texte: Évacuer les habitants pendant la montée des eaux.
    - id: o4
      texte: Réduire les émissions mondiales de gaz à effet de serre.
    bonnes:
    - o1
  indices:
    relance: Recherche la mesure qui cherche à empêcher l'installation d'enjeux vulnérables avant que l'inondation ne survienne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une mesure de protection physique pour limiter les dégâts, et non une mesure de prévention par réglementation
      ou information.
  - si:
      contient:
      - o3
    relance: Il s'agit d'une mesure de secours et de gestion de crise au moment où le phénomène se produit.
  - si:
      contient:
      - o4
    relance: Cela correspond à l'atténuation du changement climatique, qui agit sur la cause globale et non sur la prévention
      locale des inondations.
  solution: 'Interdire les nouvelles constructions dans une zone inondable. C''est exact : réglementer l''occupation des sols
    et interdire de bâtir en zone inondable permet d''éviter d''exposer de nouveaux enjeux.'
- id: nblm-pourquoi-est-il-possible-d-organiser-une-3
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il possible d'organiser une alerte cyclone plusieurs jours à l'avance, contrairement aux séismes ?
  reponse:
    options:
    - id: o1
      texte: On peut suivre le déplacement d'un cyclone et anticiper sa trajectoire grâce à la prévision météo.
    - id: o2
      texte: On sait empêcher la formation d'un cyclone mais pas celle d'un séisme.
    - id: o3
      texte: Les cyclones sont des aléas sans aucun risque pour les populations.
    - id: o4
      texte: Les séismes ne se produisent jamais dans des zones habitées.
    bonnes:
    - o1
  indices:
    relance: Pense aux moyens technologiques de surveillance atmosphérique qui permettent de suivre l'évolution de ce phénomène.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : on ne peut ni empêcher un cyclone ni empêcher un séisme, ce sont des aléas naturels.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : un cyclone comporte des vents violents et des pluies diluviennes représentant un risque très élevé
      pour les enjeux exposés.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : de nombreuses grandes villes sont situées dans des zones sismiques très actives.'
  solution: 'On peut suivre le déplacement d''un cyclone et anticiper sa trajectoire grâce à la prévision météo. C''est exact
    : la surveillance atmosphérique permet d''anticiper l''arrivée du cyclone et de déclencher une alerte cyclone.'
- id: nblm-quelle-est-la-caracteristique-principale-4
  type: choix
  difficulte: 2
  enonce: Quelle est la caractéristique principale d'une mesure de protection comme la construction parasismique ?
  reponse:
    options:
    - id: o1
      texte: Elle vise à limiter les dégâts matériels et humains lors de la secousse.
    - id: o2
      texte: Elle permet d'annuler complètement l'aléa sismique sous la ville.
    - id: o3
      texte: Elle garantit qu'il n'y aura absolument aucun risque pour les habitants.
    - id: o4
      texte: Elle consiste à avertir les habitants quelques minutes avant le séisme.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'action physique exercée sur la structure des bâtiments face à un phénomène naturel inévitable.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la construction parasismique protège le bâtiment mais ne modifie en rien l''aléa sismique
      géologique.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : une mesure de protection réduit fortement le risque mais ne peut jamais le rendre totalement nul.'
  - si:
      contient:
      - o4
    relance: C'est de la prévision/alerte, or on ne sait pas prévoir l'heure exacte d'un séisme.
  solution: 'Elle vise à limiter les dégâts matériels et humains lors de la secousse. C''est exact : les normes parasismiques
    renforcent les bâtiments pour résister aux vibrations et réduire leur vulnérabilité.'
- id: nblm-sur-quel-parametre-l-etre-humain-agit-il-5
  type: choix
  difficulte: 2
  enonce: Sur quel paramètre l'être humain agit-il principalement pour réduire le risque face à un aléa naturel comme une
    éruption volcanique ?
  reponse:
    options:
    - id: o1
      texte: Sur la vulnérabilité des enjeux exposés (par l'information, l'évacuation et des abris).
    - id: o2
      texte: Sur la probabilité de déclenchement de l'éruption volcanique.
    - id: o3
      texte: Sur l'intensité du magma qui remonte dans le volcan.
    - id: o4
      texte: Sur l'élimination totale de tous les phénomènes naturels terrestres.
    bonnes:
    - o1
  indices:
    relance: Demande-toi si l'homme peut stopper le volcan ou s'il doit plutôt adapter sa préparation et ses infrastructures.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''être humain n''a aucun moyen de modifier la dynamique interne de la Terre ou la fréquence
      des éruptions.'
  - si:
      contient:
      - o3
    relance: 'C''est impossible : l''intensité de l''aléa est déterminée par des processus géologiques naturels.'
  - si:
      contient:
      - o4
    relance: 'C''est irréaliste : les phénomènes géologiques et météorologiques font partie du fonctionnement naturel de la
      planète.'
  solution: 'Sur la vulnérabilité des enjeux exposés (par l''information, l''évacuation et des abris). C''est juste : on ne
    peut pas empêcher une éruption, mais on réduit la vulnérabilité en protégeant et évacuant les personnes.'
- id: nblm-parmi-les-actions-suivantes-lesquelles-c-6
  type: choix
  difficulte: 3
  enonce: Parmi les actions suivantes, lesquelles constituent des mesures de protection visant à réduire directement la vulnérabilité
    des biens ou des personnes ? (Sélectionne les 2 bonnes réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La réalisation de constructions parasismiques adaptées aux secousses.
    - id: o2
      texte: L'édification de digues le long des cours d'eau pour stopper les crues.
    - id: o3
      texte: L'interdiction d'aménager un terrain situé en zone inondable.
    - id: o4
      texte: La diffusion d'une brochure d'information sur les risques majeurs de la commune.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les deux aménagements physiques construits pour résister directement ou faire obstacle aux forces de
      la nature.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Il s'agit d'une mesure de prévention réglementaire (gestion du territoire) et non d'une protection physique.
  - si:
      contient:
      - o4
    relance: Il s'agit d'une mesure de prévention par la sensibilisation et l'information des citoyens.
  solution: La réalisation de constructions parasismiques adaptées aux secousses ; L'édification de digues le long des cours
    d'eau pour stopper les crues. C'est une mesure de protection physique visant à renforcer les bâtiments contre les séismes.
- id: nblm-les-personnes-les-habitations-et-les-act-7
  type: texte_court
  difficulte: 1
  enonce: Les personnes, les habitations et les activités économiques situés dans une zone soumise à un aléa sont appelés
    les ______.
  reponse:
    acceptees:
    - enjeux exposés
    fautes_tolerees: 1
  indices:
    relance: Il s'agit de l'expression désignant ce qui se trouve exposé au phénomène naturel (deux mots).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: enjeux exposés. Les enjeux exposés désignent l'ensemble des individus, biens et activités vulnérables placés face
    à un aléa.
- id: nblm-pour-eviter-d-augmenter-le-nombre-d-habi-8
  type: texte_court
  difficulte: 1
  enonce: Pour éviter d'augmenter le nombre d'habitants exposés aux crues, les autorités interdisent toute nouvelle construction
    dans une ______.
  reponse:
    acceptees:
    - zone inondable
    fautes_tolerees: 1
  indices:
    relance: Indique le type d'espace exposé au risque de crue ou de débordement d'eau (deux mots).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: zone inondable. Une zone inondable est un secteur sujet aux débordements de cours d'eau où la construction doit
    être strictement réglementée dans le plan de prévention.
