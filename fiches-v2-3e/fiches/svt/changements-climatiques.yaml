format: 2
notion: changements-climatiques
version: 2
etat: verifiee
declencheurs:
- réchauffement climatique
- effet de serre
- CO2 dans l'atmosphère
- période glaciaire
- fonte des glaciers
- gaz rejetés par l'être humain
- climats du passé
- montée du niveau des mers
prerequis:
- meteo-climat-zones-climatiques
essentiel: 'Le climat de la Terre a toujours changé au cours des temps géologiques, pour des causes naturelles (variations
  de l''orbite de la Terre autour du Soleil, activité volcanique, déplacement des continents…). Au cours du dernier million
  d''années, des périodes glaciaires, plus froides, ont alterné avec des périodes plus chaudes. Ces climats passés sont connus
  grâce à des indices : pollens et fossiles d''êtres vivants, traces laissées par les glaciers, glaces anciennes.


  L''effet de serre est un phénomène naturel. Le Soleil chauffe la surface de la Terre, qui renvoie de la chaleur (rayonnement
  infrarouge) vers l''espace. Certains gaz de l''atmosphère (vapeur d''eau, dioxyde de carbone, méthane) retiennent une partie
  de cette chaleur près du sol. Sans effet de serre, la Terre serait glaciale (environ −18 °C en moyenne au lieu d''environ
  15 °C).


  Depuis le XIXe siècle et la révolution industrielle, les activités humaines rejettent de plus en plus de gaz à effet de
  serre : combustion du charbon, du pétrole et du gaz (dioxyde de carbone), déforestation, élevage et rizières (méthane).
  L''effet de serre est renforcé et la température moyenne de la Terre augmente rapidement : c''est le réchauffement climatique
  actuel, beaucoup plus rapide que la plupart des changements naturels passés.


  Conséquences : fonte des glaciers et des calottes glaciaires, montée du niveau des mers (fonte des glaces posées sur les
  continents et dilatation de l''eau qui se réchauffe), événements extrêmes plus fréquents (canicules, sécheresses). La répartition
  des êtres vivants change : beaucoup d''espèces se déplacent vers les pôles ou en altitude ; celles qui ne peuvent ni se
  déplacer ni s''adapter risquent de disparaître.


  À ne pas confondre : le « trou » dans la couche d''ozone est un autre problème. La couche d''ozone filtre les rayons ultraviolets
  du Soleil ; elle n''est pas la cause du réchauffement climatique.


  Au brevet : on lit un graphique de température ou de teneur en CO2, on calcule un écart ou un pourcentage, on distingue
  changement naturel (lent) et changement actuel (rapide, lié aux activités humaines), puis on relie le réchauffement à ses
  conséquences sur les êtres vivants.

  '
methode:
- 'Pour un climat passé : relier chaque indice (pollen, fossile, trace de glacier) aux conditions de vie qu''il demande aujourd''hui,
  puis conclure sur le climat de l''époque.'
- 'Pour le climat actuel : suivre la chaîne des causes (activité humaine, gaz rejeté, effet de serre renforcé, hausse de température,
  conséquences).'
- 'Pour lire un graphique ou un tableau : repérer la valeur de départ, la valeur d''arrivée, calculer l''écart, puis dire
  si le changement est rapide ou lent.'
- Distinguer ce qui est naturel (variations passées) de ce qui est dû aux activités humaines (réchauffement actuel).
vocabulaire:
- terme: Effet de serre
  definition: Phénomène naturel par lequel certains gaz de l'atmosphère retiennent une partie de la chaleur émise par la Terre.
- terme: Gaz à effet de serre
  definition: Gaz qui retient la chaleur dans l'atmosphère (vapeur d'eau, dioxyde de carbone, méthane…).
- terme: Période glaciaire
  definition: Période plus froide, pendant laquelle les glaciers s'étendent beaucoup.
- terme: Combustible fossile
  definition: Charbon, pétrole ou gaz naturel, formés en millions d'années ; les brûler rejette du dioxyde de carbone.
- terme: Réchauffement climatique
  definition: Hausse de la température moyenne de la Terre, observée depuis le XIXe siècle.
- terme: Climat
  definition: Ensemble des conditions de température et de précipitations d'un lieu, mesurées sur plusieurs dizaines d'années.
- terme: Indice climatique
  definition: Trace du passé (pollen, fossile, dépôt glaciaire) qui renseigne sur le climat d'une époque.
erreurs_frequentes:
- Confondre l'effet de serre et le trou dans la couche d'ozone.
- 'Croire que l''effet de serre est mauvais en soi : c''est son renforcement par les activités humaines qui pose problème.'
- 'Croire que le climat n''avait jamais changé avant l''être humain : il a beaucoup varié, mais plus lentement.'
- 'Confondre météo et climat : un hiver froid ne contredit pas le réchauffement climatique, qui se mesure sur des moyennes
  de plusieurs dizaines d''années.'
- 'Croire que la fonte de la banquise (glace qui flotte sur la mer) fait monter le niveau des mers : ce sont surtout les glaces
  posées sur les continents et la dilatation de l''eau.'
exemple:
  enonce: On trouve, dans des sédiments anciens du nord de la France, des pollens fossiles de plantes qui vivent aujourd'hui
    seulement dans des régions très froides. Que peut-on en déduire ?
  solution: 'On suppose que ces plantes avaient autrefois les mêmes besoins qu''aujourd''hui. Si elles poussaient dans le
    nord de la France, c''est qu''il y faisait alors beaucoup plus froid : la région a connu un climat froid, par exemple
    pendant une période glaciaire.'
exercices:
- id: gaz-des-combustions
  type: texte_court
  difficulte: 1
  enonce: Quel gaz, rejeté quand on brûle du charbon, du pétrole ou du gaz naturel, est le principal gaz à effet de serre
    émis par les activités humaines ?
  reponse:
    acceptees:
    - dioxyde de carbone
    - CO2
    - CO₂
    - gaz carbonique
    - dioxyde de carbonne
    - dioxide de carbone
    fautes_tolerees: 0
  indices:
    relance: Quand un combustible brûle, le carbone qu'il contient se combine au dioxygène de l'air. Quel gaz se forme ?
    methode: C'est le gaz que tu rejettes aussi en respirant, et que les plantes absorbent à la lumière.
    etape: Son nom commence par « dioxyde de », et sa formule chimique contient un C et deux O.
  pieges:
  - si:
      valeur: méthane
    relance: Le méthane est bien un gaz à effet de serre, mais ce n'est pas celui que les humains rejettent le plus. Lequel
      sort des cheminées et des pots d'échappement ?
  - si:
      valeur: ozone
    relance: 'Attention, la couche d''ozone est un autre sujet : elle filtre les ultraviolets. Quel gaz se forme quand on
      brûle du charbon ou du pétrole ?'
  - si:
      valeur: dioxygène
    relance: Le dioxygène est consommé quand on brûle un combustible, il n'est pas produit. Quel gaz se forme à la place ?
  - si:
      valeur: vapeur d'eau
    relance: La vapeur d'eau est un gaz à effet de serre naturel, mais les activités humaines en modifient peu la quantité.
      Quel autre gaz rejettent-elles surtout ?
  solution: 'Le dioxyde de carbone (CO2) : il est produit par la combustion du charbon, du pétrole et du gaz, et c''est le
    principal gaz à effet de serre rejeté par les activités humaines.'
- id: vrai-sur-l-effet-de-serre
  type: choix
  difficulte: 1
  enonce: Parmi ces affirmations, lesquelles sont justes ?
  reponse:
    options:
    - id: a
      texte: L'effet de serre est un phénomène naturel, sans lequel la Terre serait glaciale.
    - id: b
      texte: Le réchauffement climatique actuel est causé par le trou dans la couche d'ozone.
    - id: c
      texte: Les activités humaines renforcent l'effet de serre en rejetant des gaz comme le dioxyde de carbone et le méthane.
    - id: d
      texte: Le climat de la Terre n'avait jamais changé avant l'apparition de l'être humain.
    bonnes:
    - a
    - c
  indices:
    relance: 'Lis chaque phrase et demande-toi : est-ce que je peux l''appuyer sur un fait du cours ?'
    methode: 'Rappelle-toi le rôle de chaque couche de gaz : certains gaz retiennent la chaleur, l''ozone filtre les ultraviolets.
      Pense aussi aux périodes glaciaires.'
    etape: 'Commence par la phrase sur l''ozone : la couche d''ozone retient-elle la chaleur, ou filtre-t-elle autre chose
      ?'
  pieges:
  - si:
      contient:
      - b
    relance: L'ozone filtre les rayons ultraviolets du Soleil. Est-ce lui qui retient la chaleur de la Terre ?
  - si:
      contient:
      - d
    relance: As-tu entendu parler des périodes glaciaires, bien avant l'être humain ? Qu'est-ce que cela dit du climat passé
      ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé une, mais une autre phrase est juste aussi. Relis celles que tu n'as pas choisies.
  solution: Les phrases a et c sont justes. L'effet de serre est naturel et indispensable ; ce sont les gaz rejetés par les
    activités humaines qui le renforcent. Le trou dans la couche d'ozone est un autre problème (les ultraviolets), et le climat
    a beaucoup changé bien avant l'être humain (périodes glaciaires).
- id: indices-des-climats-passes
  type: association
  difficulte: 2
  enonce: En France, on a trouvé ces indices dans des roches ou des sédiments anciens. Associe chacun au climat qu'il indique
    pour l'époque où il s'est formé.
  reponse:
    gauche:
    - id: a
      texte: Pollens fossiles de palmiers
    - id: b
      texte: Roches striées et amas de cailloux laissés par un glacier, dans une vallée aujourd'hui sans glacier
    - id: c
      texte: Os de rennes et de mammouths laineux
    - id: d
      texte: Récifs de coraux fossiles, qui ne vivent aujourd'hui que dans des mers chaudes
    droite:
    - id: p
      texte: Un climat plus chaud qu'aujourd'hui
    - id: q
      texte: Un climat plus froid qu'aujourd'hui
    paires:
      a: p
      b: q
      c: q
      d: p
  indices:
    relance: Où vivent aujourd'hui les palmiers, les rennes et les coraux ? Dans quels climats ?
    methode: On suppose qu'un être vivant du passé avait les mêmes besoins que ses proches actuels. Pour chaque indice, cherche
      le climat où on le trouve aujourd'hui.
    etape: Les rennes vivent aujourd'hui dans le Grand Nord. Si on trouve leurs os en France, qu'est-ce que cela dit du climat
      de l'époque ? Fais de même pour les trois autres indices.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Presque ! Une seule association est fausse. Relis l''indice laissé par un glacier : un glacier a-t-il besoin
      de chaud ou de froid ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Pour chaque indice, demande-toi où on le trouverait aujourd''hui : dans une région chaude ou dans une région
      froide ?'
  solution: 'Palmiers et coraux vivent aujourd''hui dans des régions chaudes : ils indiquent un climat plus chaud. Traces
    de glacier, rennes et mammouths laineux indiquent un climat plus froid, comme pendant une période glaciaire.'
- id: chaine-du-rechauffement
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre cette chaîne de causes et de conséquences.
  reponse:
    elements:
    - id: a
      texte: On brûle du charbon, du pétrole et du gaz
    - id: b
      texte: La quantité de dioxyde de carbone augmente dans l'atmosphère
    - id: c
      texte: 'L''effet de serre est renforcé : plus de chaleur est retenue près du sol'
    - id: d
      texte: La température moyenne de la Terre augmente
    - id: e
      texte: Les glaces des continents fondent et le niveau des mers monte
  indices:
    relance: Par quelle activité humaine commence toute l'histoire ?
    methode: 'Pour chaque étape, demande-toi : qu''est-ce qui la provoque ? Range ainsi de la cause de départ jusqu''à la
      conséquence finale.'
    etape: La combustion rejette un gaz. Que fait ce gaz, une fois dans l'atmosphère ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. La température peut-elle augmenter avant que l'effet de serre
      soit renforcé ?
  - si:
      diagnostic: ordre_faux
    relance: Pars de l'activité humaine et termine par ce que l'on observe sur les côtes. Chaque étape est la cause de la
      suivante.
  solution: On brûle du charbon, du pétrole et du gaz ; la quantité de dioxyde de carbone augmente dans l'atmosphère ; l'effet
    de serre est renforcé ; la température moyenne augmente ; les glaces des continents fondent et le niveau des mers monte.
- id: hausse-du-co2
  type: nombre
  difficulte: 2
  enonce: Dans ce document, la teneur de l'air en dioxyde de carbone passe de 280 ppm (parties par million) vers 1850 à 420
    ppm aujourd'hui. De combien de pour cent a-t-elle augmenté par rapport à 1850 ? Écris seulement le nombre.
  reponse:
    valeur: 50
    forme: libre
  indices:
    relance: Commence par calculer de combien de ppm la teneur a augmenté.
    methode: 'Un pourcentage d''augmentation se calcule ainsi : augmentation ÷ valeur de départ × 100.'
    etape: L'augmentation est de 420 − 280 ppm. Divise-la par la valeur de 1850, puis multiplie par 100.
  pieges:
  - si:
      valeur: 140
    relance: C'est l'augmentation en ppm. La question demande un pourcentage de la valeur de 1850.
  - si:
      valeur: 150
    relance: Tu as calculé la valeur d'aujourd'hui en pourcentage de celle de 1850. Enlève la valeur de départ (100 %) pour
      obtenir l'augmentation.
  - si:
      valeur: 33
    relance: Tu as divisé par la valeur d'aujourd'hui. Une augmentation se compare à la valeur de départ.
  solution: 420 − 280 = 140 ppm d'augmentation. 140 ÷ 280 = 0,5, et 0,5 × 100 = 50. La teneur a augmenté de 50 % par rapport
    à 1850.
- id: plante-qui-monte
  type: ouverte
  difficulte: 3
  enonce: 'Document : dans une région de montagne, des relevés montrent qu''en 50 ans, la limite la plus haute où pousse une
    espèce de plante est montée d''environ 100 mètres. Pendant la même période, la température moyenne de la région a augmenté.
    Plus on monte en montagne, plus il fait froid. Explique ce que montre ce document et relie-le au changement climatique
    actuel.'
  criteres:
  - 'L''élève décrit le document : l''espèce pousse de plus en plus haut pendant que la température moyenne augmente.'
  - L'élève explique que, la température diminuant avec l'altitude, l'espèce retrouve plus haut les conditions de température
    qui lui conviennent.
  - L'élève relie cette hausse de température au réchauffement climatique dû aux gaz à effet de serre rejetés par les activités
    humaines, et en tire une conséquence (changement de répartition des êtres vivants, risque de disparition pour les espèces
    déjà au sommet).
  indices:
    relance: Qu'est-ce qui a changé dans la région pendant ces 50 ans, et qu'est-ce qui a changé pour la plante ?
    methode: Décris le document, puis explique le lien entre altitude et température, puis rattache le tout à la cause du
      réchauffement actuel.
    etape: S'il fait plus chaud en bas, où la plante peut-elle retrouver la fraîcheur dont elle a besoin ?
  solution: 'En 50 ans, la température moyenne de la région a augmenté et l''espèce pousse environ 100 mètres plus haut. Comme
    il fait plus froid en altitude, la plante retrouve plus haut les températures qui lui conviennent : sa zone de vie se
    déplace vers le haut. Cette hausse de température s''inscrit dans le réchauffement climatique actuel, causé par les gaz
    à effet de serre rejetés par les activités humaines. La répartition des êtres vivants change ; les espèces qui vivent
    déjà au sommet ne peuvent pas monter plus haut et risquent de disparaître.'
- id: gaz-et-activites
  type: association
  difficulte: 2
  enonce: Associe chaque activité humaine au principal gaz à effet de serre qu'elle rejette.
  reponse:
    gauche:
    - id: a
      texte: La combustion du charbon dans une centrale
    - id: b
      texte: L'élevage de bovins
    - id: c
      texte: Une voiture qui brûle de l'essence
    - id: d
      texte: Les rizières inondées
    droite:
    - id: x
      texte: dioxyde de carbone
    - id: y
      texte: méthane
    paires:
      a: x
      b: y
      c: x
      d: y
  indices:
    relance: Les combustibles fossiles qui brûlent rejettent un gaz. L'élevage et les rizières en rejettent un autre.
    methode: 'Combustion du charbon, du pétrole ou du gaz : dioxyde de carbone. Élevage et rizières : méthane.'
    etape: Le charbon et l'essence sont des combustibles fossiles. Quel gaz rejettent-ils en brûlant ? Continue avec b et
      d.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Les combustions rejettent du dioxyde de carbone ; l'élevage et les rizières,
      du méthane.
  - si:
      diagnostic: associations_fausses
    relance: 'Pour chaque activité, demande-toi : y a-t-il une combustion ou un élevage / des rizières ?'
  solution: a-dioxyde de carbone (combustible fossile) ; c-dioxyde de carbone (essence) ; b-méthane (élevage) ; d-méthane
    (rizières).
- id: consequences-du-rechauffement
  type: choix
  difficulte: 2
  enonce: Parmi ces phénomènes, lesquels sont des conséquences du réchauffement climatique actuel ?
  reponse:
    options:
    - id: a
      texte: La montée du niveau des mers.
    - id: b
      texte: Des canicules moins fréquentes.
    - id: c
      texte: Le déplacement d'espèces vers les pôles ou en altitude.
    - id: d
      texte: La disparition de la couche d'ozone.
    bonnes:
    - a
    - c
  indices:
    relance: 'Pense à ce que provoque une température plus élevée : sur les glaces, sur l''eau des océans, sur les êtres vivants.'
    methode: Relis dans le cours les conséquences du réchauffement, puis repère celles qui n'en font pas partie.
    etape: 'Commence par la phrase d : la couche d''ozone est-elle la cause du réchauffement ?'
  pieges:
  - si:
      contient:
      - b
    relance: Avec un climat qui se réchauffe, les épisodes de forte chaleur deviennent-ils moins ou plus fréquents ?
  - si:
      contient:
      - d
    relance: 'Le « trou » dans la couche d''ozone est un autre problème : l''ozone filtre les ultraviolets, il ne règle pas
      la température.'
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une conséquence, mais une autre est juste aussi. Que font les êtres vivants qui ne supportent plus
      la chaleur ?
  solution: 'a et c sont des conséquences : fonte des glaces et dilatation de l''eau font monter les mers, et les espèces
    se déplacent. Les canicules deviennent plus fréquentes (b est fausse) et la couche d''ozone est un autre problème (d est
    fausse).'
- id: nblm-quel-est-le-role-naturel-de-l-effet-de-s-1
  type: choix
  difficulte: 2
  enonce: Quel est le rôle naturel de l'effet de serre sur la Terre ?
  reponse:
    options:
    - id: o1
      texte: Il retient une partie de la chaleur émise par la Terre près du sol, rendant la planète habitable.
    - id: o2
      texte: Il filtre les rayons ultraviolets du Soleil pour protéger les êtres vivants.
    - id: o3
      texte: Il empêche totalement la chaleur du Soleil de traverser l'atmosphère terrestre.
    - id: o4
      texte: Il est provoqué exclusivement par les polluants et l'industrie moderne.
    bonnes:
    - o1
  indices:
    relance: Pense à la température moyenne qu'il ferait sur Terre si ce phénomène naturel n'existait pas.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : la filtration des rayons ultraviolets est le rôle de la couche d''ozone, pas de
      l''effet de serre.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la lumière du Soleil traverse l''atmosphère pour réchauffer la surface de la Terre.'
  - si:
      contient:
      - o4
    relance: 'C''est inexact : l''effet de serre est un phénomène naturel indispensable. C''est son renforcement par les activités
      humaines qui pose problème.'
  solution: 'Il retient une partie de la chaleur émise par la Terre près du sol, rendant la planète habitable. C''est exact
    : sans l''effet de serre naturel, la température moyenne sur Terre serait d''environ −18 °C au lieu de 15 °C.'
- id: nblm-quelle-activite-humaine-contribue-le-plu-2
  type: choix
  difficulte: 2
  enonce: Quelle activité humaine contribue le plus à l'augmentation du CO2 dans l'atmosphère depuis le XIXe siècle ?
  reponse:
    options:
    - id: o1
      texte: La combustion des combustibles fossiles comme le charbon, le pétrole et le gaz.
    - id: o2
      texte: L'utilisation de produits chimiques détruisant la couche d'ozone.
    - id: o3
      texte: La baisse naturelle de la quantité de vapeur d'eau contenue dans l'air.
    - id: o4
      texte: L'augmentation de l'énergie directement émise par le Soleil.
    bonnes:
    - o1
  indices:
    relance: Cherche l'action industrielle liée à l'utilisation du pétrole, du charbon et du gaz naturel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une confusion classique : le trou dans la couche d''ozone est un problème distinct du réchauffement climatique.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la vapeur d''eau est un gaz à effet de serre naturel et sa variation n''est pas causée par les
      rejets industriels.'
  - si:
      contient:
      - o4
    relance: 'C''est inexact : le réchauffement actuel découle de l''accumulation de gaz qui piègent la chaleur, non d''une
      hausse de l''activité solaire.'
  solution: 'La combustion des combustibles fossiles comme le charbon, le pétrole et le gaz. C''est exact : la combustion
    de ces ressources fossiles rejette d''importantes quantités de dioxyde de carbone (CO2).'
- id: nblm-comment-les-scientifiques-decouvrent-ils-3
  type: choix
  difficulte: 2
  enonce: Comment les scientifiques découvrent-ils le climat d'une période glaciaire passée ?
  reponse:
    options:
    - id: o1
      texte: En analysant des indices naturels comme les pollens fossiles, les glaces anciennes et les traces de glaciers.
    - id: o2
      texte: En consultant les premiers bulletins météorologiques écrits par l'être humain.
    - id: o3
      texte: En mesurant uniquement la vitesse de déplacement des plaques tectoniques.
    - id: o4
      texte: En observant la taille du trou dans la couche d'ozone au-dessus des pôles.
    bonnes:
    - o1
  indices:
    relance: Cherche des éléments végétaux ou glaciaires piégés au cours des temps géologiques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : les périodes glaciaires se sont déroulées bien avant l''apparition de l''écriture et des instruments
      de mesure météo.'
  - si:
      contient:
      - o3
    relance: 'C''est inexact : la dérive des plaques explique la géodynamique interne, pas directement les indices climatiques
      des glaces.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la couche d''ozone ne fournit pas d''indices sur les températures des périodes glaciaires passées.'
  solution: 'En analysant des indices naturels comme les pollens fossiles, les glaces anciennes et les traces de glaciers.
    C''est exact : les fossiles de végétaux et les carottes de glace conservent les traces des conditions climatiques anciennes.'
- id: nblm-quelle-est-la-cause-principale-de-la-mon-4
  type: choix
  difficulte: 2
  enonce: Quelle est la cause principale de la montée du niveau des mers liée au réchauffement climatique ?
  reponse:
    options:
    - id: o1
      texte: La fonte des glaces posées sur les continents et la dilatation thermique de l'eau.
    - id: o2
      texte: La fonte de la banquise qui flotte sur les océans.
    - id: o3
      texte: L'augmentation des précipitations sous forme de neige aux pôles.
    - id: o4
      texte: La fermeture progressive du trou dans la couche d'ozone.
    bonnes:
    - o1
  indices:
    relance: Distingue les glaces situées sur la terre ferme de celles qui flottent déjà sur l'eau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : la banquise flotte déjà sur l''eau, sa fonte ne modifie donc pas le niveau de
      la mer.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la neige accumulée sur les continents retiendrait l''eau sous forme solide au lieu de faire monter
      les mers.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : la couche d''ozone concerne les rayons UV et n''a aucun effet direct sur le niveau des océans.'
  solution: 'La fonte des glaces posées sur les continents et la dilatation thermique de l''eau. C''est juste : l''eau des
    glaciers continentaux s''ajoute aux océans et l''eau de mer augmente de volume en se réchauffant.'
- id: nblm-pourquoi-un-hiver-particulierement-froid-5
  type: choix
  difficulte: 2
  enonce: Pourquoi un hiver particulièrement froid ne contredit-il pas le réchauffement climatique ?
  reponse:
    options:
    - id: o1
      texte: Parce que le climat se calcule sur des moyennes météorologiques d'au moins 30 ans, alors que la météo varie au
        jour le jour.
    - id: o2
      texte: Parce que le réchauffement climatique s'arrête complètement pendant la saison hivernale.
    - id: o3
      texte: Parce que les gaz rejetés par l'être humain disparaissent lorsque les températures deviennent négatives.
    - id: o4
      texte: Parce que les températures hivernales sont régulées uniquement par la couche d'ozone.
    bonnes:
    - o1
  indices:
    relance: Fais la différence entre le temps qu'il fait aujourd'hui et une moyenne établie sur plusieurs décennies.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : la tendance au réchauffement concerne la température moyenne globale sur l''année entière.'
  - si:
      contient:
      - o3
    relance: 'C''est inexact : les gaz à effet de serre restent présents dans l''atmosphère quelle que soit la saison.'
  - si:
      contient:
      - o4
    relance: 'C''est une confusion : la couche d''ozone filtre les rayons ultraviolets et ne détermine pas les températures
      hivernales.'
  solution: 'Parce que le climat se calcule sur des moyennes météorologiques d''au moins 30 ans, alors que la météo varie
    au jour le jour. C''est exact : une journée ou un hiver froid relève de la météo locale, tandis que le réchauffement climatique
    concerne des moyennes mondiales sur plusieurs décennies.'
- id: nblm-quelles-sont-deux-consequences-directes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont deux conséquences directes du réchauffement climatique actuel énoncées dans les fiches ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La fonte des glaciers et des calottes glaciaires.
    - id: o2
      texte: Le déplacement de nombreuses espèces vivantes vers les pôles ou en altitude.
    - id: o3
      texte: L'apparition du trou dans la couche d'ozone.
    - id: o4
      texte: La baisse de la température moyenne à la surface de la Terre.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux réponses qui concernent les masses de glace continentales et le déplacement des animaux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : l''ozone est un problème environnemental distinct, non causé par le réchauffement climatique.'
  - si:
      contient:
      - o4
    relance: 'C''est l''inverse : le réchauffement climatique se caractérise par une hausse rapide de la température moyenne.'
  solution: 'La fonte des glaciers et des calottes glaciaires ; Le déplacement de nombreuses espèces vivantes vers les pôles
    ou en altitude. C''est exact : l''augmentation des températures provoque la fonte des masses de glace situées sur les
    continents.'
- id: nblm-quelle-formule-chimique-designe-le-dioxy-7
