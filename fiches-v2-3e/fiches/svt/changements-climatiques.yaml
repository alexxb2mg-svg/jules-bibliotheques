format: 2
notion: changements-climatiques
version: 1
etat: verifiee
declencheurs:
- réchauffement du climat
- gaz à effet de serre et climat
- climat il y a des millions d'années
- combustion des énergies fossiles
- espèces qui migrent à cause du climat
- variations de l'orbite terrestre
prerequis:
- meteo-climat-zones-climatiques
essentiel: 'Le climat de la Terre a beaucoup varié au cours des temps géologiques (des millions d''années), avec des périodes
  glaciaires et des périodes plus chaudes, pour des causes naturelles (variations de l''orbite terrestre, activité volcanique,
  entre autres).


  Depuis le début de l''ère industrielle, les activités humaines (combustion d''énergies fossiles comme le charbon ou le pétrole,
  déforestation) émettent en grande quantité des gaz à effet de serre, notamment du dioxyde de carbone, qui renforcent l''effet
  de serre naturel de l''atmosphère.


  Ce renforcement de l''effet de serre entraîne un réchauffement climatique global, plus rapide que les variations naturelles
  observées dans le passé.


  Ce réchauffement a des conséquences sur la répartition des êtres vivants : certaines espèces déplacent leur aire de répartition
  (vers des latitudes ou des altitudes plus fraîches), d''autres peinent à s''adapter assez vite et voient leur population
  diminuer.


  Distinguer les changements climatiques passés (naturels, très lents à l''échelle géologique) du changement climatique actuel
  (accéléré par les activités humaines) est essentiel pour comprendre l''enjeu.'
methode:
- Distinguer les causes naturelles des changements climatiques passés et les causes humaines du changement climatique actuel.
- Relier l'augmentation des gaz à effet de serre d'origine humaine au réchauffement climatique actuel.
- Chercher des exemples de conséquences sur la répartition des espèces (migration, disparition locale).
- Comparer la vitesse du changement climatique actuel à celle des changements passés (naturels, beaucoup plus lents).
vocabulaire:
- terme: gaz à effet de serre
  definition: un gaz de l'atmosphère (comme le dioxyde de carbone) qui retient la chaleur du Soleil et réchauffe la Terre
- terme: énergie fossile
  definition: une source d'énergie formée sur des millions d'années (charbon, pétrole, gaz), dont la combustion émet du dioxyde
    de carbone
- terme: réchauffement climatique
  definition: l'augmentation de la température moyenne de la Terre, accélérée depuis l'ère industrielle par les activités
    humaines
erreurs_frequentes:
- Croire que le climat n'a jamais changé avant l'ère industrielle.
- Penser que le changement climatique actuel a uniquement des causes naturelles, comme dans le passé.
- Confondre effet de serre (phénomène naturel indispensable à la vie) et son renforcement actuel (problème lié aux activités
  humaines).
- Croire que toutes les espèces peuvent s'adapter aussi vite que le climat actuel change.
exemple:
  enonce: En quoi le changement climatique actuel diffère-t-il des changements climatiques passés observés dans l'histoire
    de la Terre ?
  solution: Les changements passés avaient des causes naturelles (variations de l'orbite terrestre, volcanisme…) et se sont
    produits très lentement, à l'échelle de milliers ou de millions d'années. Le changement actuel, lui, est très rapide et
    lié aux émissions de gaz à effet de serre par les activités humaines depuis l'ère industrielle.
exercices:
- id: causes-naturelles-passees
  type: choix
  difficulte: 1
  enonce: Laquelle de ces causes explique un changement climatique passé, avant l'ère industrielle ?
  reponse:
    options:
    - id: a
      texte: Les variations de l'orbite terrestre autour du Soleil
    - id: b
      texte: La combustion du pétrole par les usines
    - id: c
      texte: Les gaz d'échappement des voitures
    - id: d
      texte: La déforestation pour l'agriculture moderne
    bonnes:
    - a
  indices:
    relance: Cherche une cause qui existait bien avant l'invention des usines et des voitures.
    methode: Élimine toutes les causes liées à une activité humaine industrielle récente.
    etape: Une seule cause est purement naturelle et astronomique, indépendante de l'être humain.
  pieges:
  - si:
      contient:
      - b
    relance: La combustion du pétrole par les usines est une activité humaine récente, liée à l'ère industrielle, pas une
      cause des changements passés.
  - si:
      contient:
      - c
    relance: Les gaz d'échappement viennent des véhicules, une invention récente de l'être humain.
  - si:
      contient:
      - d
    relance: La déforestation pour l'agriculture moderne est une activité humaine actuelle, pas une cause naturelle ancienne.
  solution: Les variations de l'orbite terrestre autour du Soleil sont une cause naturelle des changements climatiques passés,
    bien avant l'ère industrielle.
- id: mot-gaz-principal
  type: texte_court
  difficulte: 1
  enonce: Quel gaz à effet de serre est principalement libéré par la combustion du charbon et du pétrole ?
  reponse:
    acceptees:
    - dioxyde de carbone
    - co2
    - gaz carbonique
    fautes_tolerees: 1
  indices:
    relance: C'est le gaz que produit toute combustion contenant du carbone, comme celle du charbon ou du pétrole.
    methode: Ce gaz est aussi celui que nous rejetons en respirant, mais en quantité bien plus faible.
    etape: Son nom contient le mot « dioxyde », et son symbole chimique est composé de deux lettres et un chiffre.
  pieges:
  - si:
      valeur: oxygène
    relance: 'L''oxygène n''est pas un gaz à effet de serre : c''est le gaz que nous respirons. Quel gaz est plutôt produit
      par une combustion contenant du carbone ?'
  - si:
      valeur: azote
    relance: L'azote est le gaz le plus abondant de l'atmosphère, mais ce n'est pas lui qui est libéré en grande quantité
      par la combustion du charbon ou du pétrole.
  solution: Le dioxyde de carbone (CO2) est le principal gaz à effet de serre libéré par la combustion des énergies fossiles
    comme le charbon ou le pétrole.
- id: consequence-repartition-especes
  type: choix
  difficulte: 2
  enonce: Quelle est une conséquence possible du réchauffement climatique sur la répartition des êtres vivants ?
  reponse:
    options:
    - id: a
      texte: Certaines espèces déplacent leur aire de répartition vers des zones plus fraîches
    - id: b
      texte: Toutes les espèces s'adaptent instantanément sans aucune difficulté
    - id: c
      texte: Le nombre d'espèces sur Terre reste toujours strictement identique
    bonnes:
    - a
  indices:
    relance: Pense à des animaux ou des plantes qui recherchent des conditions climatiques plus fraîches.
    methode: Élimine les affirmations qui prétendent qu'il n'y a aucune conséquence ou une adaptation parfaite et immédiate.
    etape: Certaines espèces se déplacent vers des latitudes ou des altitudes plus fraîches pour retrouver des conditions
      adaptées.
  pieges:
  - si:
      contient:
      - b
    relance: Certaines espèces peinent au contraire à s'adapter assez vite au changement climatique actuel.
  - si:
      contient:
      - c
    relance: Le réchauffement climatique a justement un impact sur la répartition et parfois la survie de certaines espèces.
  solution: Certaines espèces animales ou végétales déplacent leur aire de répartition vers des latitudes ou des altitudes
    plus fraîches pour retrouver des conditions climatiques adaptées.
- id: association-changement-cause
  type: association
  difficulte: 2
  enonce: Associe chaque type de changement climatique à sa caractéristique principale.
  reponse:
    gauche:
    - id: a
      texte: Changement climatique passé (avant l'ère industrielle)
    - id: b
      texte: Changement climatique actuel
    droite:
    - id: x
      texte: Cause naturelle, se produit très lentement à l'échelle géologique
    - id: y
      texte: Cause liée aux activités humaines, se produit rapidement depuis l'ère industrielle
    paires:
      a: x
      b: y
  indices:
    relance: Compare la vitesse et la cause de chaque type de changement climatique.
    methode: Repère d'abord le changement climatique dont la cause est humaine et récente.
    etape: Le changement passé est naturel et lent ; le changement actuel est lié aux activités humaines et rapide.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la différence de vitesse et de cause entre passé et présent.
  - si:
      diagnostic: associations_fausses
    relance: 'Repère le changement lié directement aux activités humaines : c''est le changement actuel, rapide.'
  solution: 'Changement climatique passé : cause naturelle, très lent à l''échelle géologique. Changement climatique actuel
    : cause liée aux activités humaines, rapide depuis l''ère industrielle.'
- id: ordre-mecanisme-rechauffement
  type: ordre
  difficulte: 2
  enonce: Range ces étapes dans l'ordre logique pour expliquer le mécanisme du réchauffement climatique actuel.
  reponse:
    elements:
    - id: combustion
      texte: Les activités humaines brûlent des énergies fossiles (charbon, pétrole)
    - id: emission
      texte: Cette combustion émet des gaz à effet de serre dans l'atmosphère
    - id: renforcement
      texte: Ces gaz renforcent l'effet de serre naturel de l'atmosphère
    - id: rechauffement
      texte: La température moyenne de la Terre augmente
  indices:
    relance: Qu'est-ce qui doit se produire en premier pour que des gaz à effet de serre soient émis dans l'atmosphère ?
    methode: Pars de l'activité humaine à l'origine du phénomène, puis suis la chaîne de conséquences jusqu'à la hausse de
      température.
    etape: La combustion des énergies fossiles vient en premier ; la hausse de température est la conséquence finale.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle des deux doit se produire avant l'autre dans cette chaîne de causes
      ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par l'action humaine à l'origine du phénomène (la combustion) et termine par la conséquence observée
      (la hausse de température).
  solution: Combustion des énergies fossiles, émission de gaz à effet de serre, renforcement de l'effet de serre naturel,
    augmentation de la température moyenne de la Terre.
- id: developpement-passe-vs-actuel
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique en quoi le changement climatique actuel diffère des changements climatiques
    passés de l''histoire de la Terre, en citant leurs causes respectives.'
  criteres:
  - L'élève cite au moins une cause naturelle des changements climatiques passés (variations de l'orbite terrestre, volcanisme).
  - L'élève explique la cause humaine du changement climatique actuel (émissions de gaz à effet de serre par la combustion
    d'énergies fossiles).
  - L'élève compare la vitesse des deux phénomènes (le changement actuel est plus rapide).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense aux causes naturelles des changements passés, puis à la cause humaine du changement actuel.
    methode: 'Structure ta réponse en deux parties : d''abord les changements passés, puis le changement actuel, avant de
      conclure sur la comparaison.'
    etape: Tu peux commencer ainsi « Le climat de la Terre a toujours varié, mais... »
  solution: Le climat de la Terre a toujours varié au cours des temps géologiques, sous l'effet de causes naturelles comme
    les variations de l'orbite terrestre autour du Soleil ou l'activité volcanique. Ces changements se sont produits très
    lentement, sur des milliers ou des millions d'années. Depuis l'ère industrielle, les activités humaines, en particulier
    la combustion d'énergies fossiles comme le charbon ou le pétrole, émettent de grandes quantités de gaz à effet de serre
    qui renforcent l'effet de serre naturel de l'atmosphère. Ce renforcement entraîne un réchauffement climatique beaucoup
    plus rapide que les variations naturelles observées dans le passé. Ainsi, la principale différence entre les changements
    passés et le changement actuel tient à la fois à leur cause (naturelle contre humaine) et à leur vitesse (lente contre
    rapide).
