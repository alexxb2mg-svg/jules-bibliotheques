format: 2
notion: explication-globale-immunite
version: 1
etat: verifiee
declencheurs:
- système immunitaire comment ça marche
- anticorps
- globules blancs
- défenses de l'organisme
- corps se défend contre un microbe
- vaccinée réagit plus vite
prerequis:
- monde-microbien-immunite
essentiel: 'Le système immunitaire est l''ensemble des moyens de défense de l''organisme, qui lui permettent de distinguer
  ce qui lui appartient (le soi) de ce qui lui est étranger (microbes, corps étrangers) et d''éliminer les éléments étrangers
  dangereux.


  Une première ligne de défense est constituée de barrières physiques (comme la peau, le plus grand organe du corps) qui empêchent
  la plupart des micro-organismes de pénétrer dans l''organisme.


  Si un agent pathogène franchit ces barrières, l''organisme met en place une réaction immunitaire : des cellules spécialisées,
  les globules blancs (leucocytes), circulant dans le sang, reconnaissent et combattent l''agent pathogène.


  Certains globules blancs, appelés lymphocytes, produisent des anticorps, des protéines spécifiques (immunoglobulines) qui
  se fixent précisément sur l''agent pathogène pour le marquer, facilitant sa destruction par d''autres cellules immunitaires.


  La vaccination exploite ce mécanisme : elle expose l''organisme, sans danger, à des éléments d''un agent pathogène (ou à
  une version atténuée), ce qui permet au système immunitaire de préparer à l''avance des défenses (anticorps, cellules spécifiques)
  et de réagir beaucoup plus vite et efficacement en cas d''infection réelle par la suite.'
methode:
- 'Repérer les différentes lignes de défense : barrières physiques (peau) puis réaction immunitaire interne (globules blancs,
  lymphocytes, anticorps).'
- Retenir que les anticorps sont spécifiques d'un agent pathogène précis, comme une clé adaptée à une serrure.
- Expliquer le principe de la vaccination comme une préparation anticipée du système immunitaire.
- Relier une réaction immunitaire observée (fièvre, inflammation) à la lutte de l'organisme contre un agent pathogène.
vocabulaire:
- terme: lymphocyte
  definition: type de globule blanc capable de produire des anticorps contre un agent pathogène précis
- terme: anticorps
  definition: protéine spécifique produite par certains globules blancs, qui se fixe sur un agent pathogène précis
erreurs_frequentes:
- Croire que le système immunitaire n'intervient qu'après la pénétration d'un microbe, en oubliant le rôle des barrières physiques
  comme la peau.
- Penser qu'un anticorps peut se fixer sur n'importe quel agent pathogène, sans spécificité.
- Confondre vaccination (prépare le système immunitaire avant l'infection) et traitement par anticorps déjà tout faits.
- Croire que la vaccination transmet directement la maladie à l'organisme.
exemple:
  enonce: Pourquoi une personne vaccinée contre une maladie réagit-elle beaucoup plus vite en cas d'exposition réelle à l'agent
    pathogène, comparée à une personne non vaccinée ?
  solution: La vaccination a permis au système immunitaire de « s'entraîner » à l'avance en produisant des anticorps spécifiques
    et en gardant en mémoire l'agent pathogène ; en cas d'exposition réelle, la réaction immunitaire est donc beaucoup plus
    rapide et efficace que si l'organisme découvrait l'agent pathogène pour la première fois.
exercices:
- id: mot-lymphocyte
  type: texte_court
  difficulte: 1
  enonce: Quel type de globule blanc est capable de produire des anticorps contre un agent pathogène précis ?
  reponse:
    acceptees:
    - lymphocyte
    - lymphocytes
    fautes_tolerees: 1
  indices:
    relance: C'est un type précis de globule blanc, pas le terme général « globule blanc ».
    methode: Relis le vocabulaire de ta leçon consacré aux cellules productrices d'anticorps.
    etape: Ce mot commence par « lympho- », en lien avec le système lymphatique.
  pieges:
  - si:
      valeur: globule blanc
    relance: Le globule blanc est un terme plus général ; le mot cherché désigne un type précis de globule blanc producteur
      d'anticorps.
  solution: Les lymphocytes sont les globules blancs capables de produire des anticorps.
- id: role-peau-defense
  type: choix
  difficulte: 1
  enonce: Quel est le rôle de la peau dans le système immunitaire ?
  reponse:
    options:
    - id: a
      texte: Elle produit des anticorps contre les agents pathogènes
    - id: b
      texte: Elle constitue une barrière physique qui empêche la plupart des micro-organismes de pénétrer dans l'organisme
    - id: c
      texte: Elle stocke les globules blancs en attendant une infection
    - id: d
      texte: Elle n'a aucun rôle dans la défense de l'organisme
    bonnes:
    - b
  indices:
    relance: Pense à ce qui empêche un microbe de pénétrer, avant même toute réaction immunitaire interne.
    methode: Repense à l'expression « première ligne de défense » utilisée dans le cours.
    etape: La peau agit avant toute réaction immunitaire interne, en empêchant simplement le contact direct avec de nombreux
      micro-organismes.
  pieges:
  - si:
      contient:
      - a
    relance: Ce sont les lymphocytes, pas la peau, qui produisent des anticorps.
  - si:
      contient:
      - d
    relance: La peau joue bien un rôle de défense, en tant que première barrière physique.
  solution: La peau constitue une barrière physique qui empêche la plupart des micro-organismes de pénétrer dans l'organisme
    ; c'est une première ligne de défense.
- id: associer-elements-immunite
  type: association
  difficulte: 2
  enonce: Relie chaque élément à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Peau
    - id: b
      texte: Lymphocyte
    - id: c
      texte: Anticorps
    - id: d
      texte: Vaccination
    droite:
    - id: x
      texte: Protéine spécifique qui se fixe sur un agent pathogène précis
    - id: y
      texte: Barrière physique, première ligne de défense de l'organisme
    - id: z
      texte: Prépare à l'avance le système immunitaire contre un agent pathogène
    - id: w
      texte: Globule blanc capable de produire des anticorps
    paires:
      a: y
      b: w
      c: x
      d: z
  indices:
    relance: Repère d'abord ce qui est une barrière physique (peau) et ce qui est une cellule (lymphocyte).
    methode: Distingue ensuite la cellule qui produit l'anticorps (lymphocyte) de la protéine produite elle-même (anticorps).
    etape: La vaccination n'est ni une cellule ni une protéine, mais une méthode de préparation du système immunitaire.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier lymphocyte (la cellule) et anticorps (la protéine produite),
      souvent confondus.
  - si:
      diagnostic: associations_fausses
    relance: Reprends depuis le début en distinguant la barrière physique (peau), la cellule (lymphocyte) et la protéine (anticorps).
  solution: Peau = barrière physique, première ligne de défense ; Lymphocyte = globule blanc producteur d'anticorps ; Anticorps
    = protéine spécifique fixée sur l'agent pathogène ; Vaccination = prépare à l'avance le système immunitaire.
- id: ordre-reaction-immunitaire
  type: ordre
  difficulte: 3
  enonce: Range les étapes de la réaction immunitaire lorsqu'un agent pathogène franchit la barrière de la peau.
  reponse:
    elements:
    - id: franchissement
      texte: Un agent pathogène franchit la barrière physique de la peau
    - id: reconnaissance
      texte: Des globules blancs détectent la présence de l'agent pathogène étranger
    - id: production-anticorps
      texte: Certains lymphocytes produisent des anticorps spécifiques de cet agent pathogène
    - id: elimination
      texte: Les anticorps se fixent sur l'agent pathogène et facilitent sa destruction
  indices:
    relance: La production d'anticorps n'a lieu qu'après la reconnaissance de l'agent pathogène par les globules blancs, pas
      avant.
    methode: Place d'abord le franchissement de la barrière physique, puis la détection, puis la production d'anticorps, puis
      la destruction de l'agent pathogène.
    etape: Les anticorps sont fabriqués spécifiquement en réponse à l'agent pathogène détecté, ils n'existent pas avant cette
      détection.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. La production d'anticorps a-t-elle lieu avant ou après la reconnaissance
      de l'agent pathogène ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le point de départ (franchissement de la peau) et le résultat final (élimination), puis place
      les deux étapes intermédiaires.
  solution: D'abord le franchissement de la barrière de la peau, puis la reconnaissance de l'agent pathogène par les globules
    blancs, puis la production d'anticorps spécifiques par les lymphocytes, puis l'élimination de l'agent pathogène.
- id: expliquer-principe-vaccination
  type: ouverte
  difficulte: 3
  enonce: Explique le principe de la vaccination et pourquoi une personne vaccinée réagit plus vite qu'une personne non vaccinée
    face au même agent pathogène.
  criteres:
  - L'élève explique que la vaccination expose l'organisme, sans danger, à des éléments d'un agent pathogène ou à une version
    atténuée.
  - L'élève relie cette exposition à la préparation anticipée de défenses (anticorps, lymphocytes) par le système immunitaire.
  - L'élève explique que cette préparation permet une réaction beaucoup plus rapide et efficace en cas d'infection réelle
    ultérieure.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense à ce que reçoit l'organisme lors d'une vaccination, et à ce que cela permet de préparer.
    methode: Commence par expliquer ce que reçoit l'organisme lors d'une vaccination, puis ce que cela déclenche dans le système
      immunitaire, avant de conclure sur la rapidité de la réaction ultérieure.
    etape: L'organisme vacciné a déjà rencontré, sans danger, une forme de l'agent pathogène avant une éventuelle infection
      réelle.
  solution: 'La vaccination consiste à exposer l''organisme, sans danger, à des éléments d''un agent pathogène ou à une version
    atténuée de celui-ci. Cette exposition permet au système immunitaire de préparer à l''avance des défenses spécifiques,
    notamment des lymphocytes capables de produire rapidement des anticorps contre cet agent pathogène précis. Ainsi, en cas
    d''exposition réelle ultérieure, l''organisme d''une personne vaccinée réagit beaucoup plus vite et plus efficacement
    qu''une personne non vaccinée, car il n''a pas besoin de découvrir l''agent pathogène pour la première fois : les défenses
    sont déjà prêtes à intervenir.'
