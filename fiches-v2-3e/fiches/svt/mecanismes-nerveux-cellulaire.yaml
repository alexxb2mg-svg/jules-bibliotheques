format: 2
notion: mecanismes-nerveux-cellulaire
version: 2
etat: verifiee
declencheurs:
- synapse
- neurotransmetteur
- connexions entre neurones
- produit dopant
- manque de sommeil et concentration
- temps de réaction
- message nerveux électrique
- effets de l'alcool
- sommeil et mémoire
prerequis:
- role-cerveau-message-nerveux
- 4e-systeme-nerveux-cellulaire-cerebral
essentiel: 'Le système nerveux est formé de milliards de cellules nerveuses, les neurones. Un neurone possède un corps cellulaire
  (avec le noyau), des prolongements courts qui reçoivent les messages, et un long prolongement, l''axone (ou fibre nerveuse),
  qui conduit le message nerveux.


  Le long d''un neurone, le message nerveux est électrique. Deux neurones ne se touchent pas : la zone de contact entre eux
  s''appelle une synapse.


  À la synapse, le message électrique arrivé au bout de l''axone provoque la libération d''une substance chimique, le neurotransmetteur.
  Celui-ci traverse le petit espace entre les deux cellules et se fixe sur des récepteurs du neurone suivant, où un nouveau
  message électrique apparaît.


  Les connexions entre neurones se modifient toute la vie : l''apprentissage et l''entraînement renforcent les connexions
  utilisées (plasticité cérébrale).


  Hygiène de vie : le sommeil est indispensable à la récupération et à la mémorisation. L''alcool et les drogues perturbent
  le fonctionnement des synapses : le temps de réaction augmente, la vigilance diminue, et une dépendance peut s''installer.


  Dopage : prendre des produits interdits pour améliorer ses performances. Certains agissent sur le système nerveux et masquent
  la fatigue, qui est un signal d''alerte : ils sont dangereux pour la santé.


  Un nerf est un faisceau de nombreuses fibres nerveuses (axones). Le cerveau et la moelle épinière sont des centres nerveux
  : ils reçoivent les messages et élaborent des réponses.


  Le neurotransmetteur est libéré en petite quantité, dans l''espace de la synapse. Certaines drogues et certains médicaments
  agissent à cet endroit : ils perturbent la transmission du message d''un neurone à l''autre.


  Entraînement : répéter un geste (jouer d''un instrument, un sport) renforce les connexions utilisées. Le geste devient plus
  précis et plus rapide.


  Sommeil : les adolescents ont besoin de beaucoup de sommeil (environ 8 à 10 heures). Un manque de sommeil diminue l''attention
  et la mémoire.


  Alcool, cannabis et autres drogues : temps de réaction plus long, attention réduite, risques d''accident. Le dopage est
  interdit en sport, car il triche et met la santé en danger. Au brevet, on attend que tu relies un comportement à son effet
  sur le système nerveux, avec un raisonnement en deux temps.

  '
methode:
- 'Situer l''étape : le long d''un neurone (message électrique) ou entre deux neurones (synapse, message chimique).'
- 'Décrire la transmission à la synapse dans l''ordre : arrivée du message, libération du neurotransmetteur, fixation sur
  les récepteurs, nouveau message.'
- Pour un comportement (sommeil, alcool, entraînement, dopage), dire son effet sur le fonctionnement du système nerveux, puis
  sur la santé ou les performances.
- Dans un document chiffré, comparer les valeurs à une situation de référence.
vocabulaire:
- terme: neurone
  definition: Cellule nerveuse qui produit et conduit le message nerveux.
- terme: synapse
  definition: Zone de contact entre deux neurones, ou entre un neurone et un muscle.
- terme: neurotransmetteur
  definition: Substance chimique libérée à la synapse, qui transmet le message au neurone suivant.
- terme: plasticité cérébrale
  definition: Capacité des connexions entre neurones à se modifier avec l'expérience.
- terme: axone
  definition: Long prolongement du neurone, qui conduit le message nerveux.
- terme: nerf
  definition: Faisceau de fibres nerveuses qui relie les centres nerveux aux organes.
- terme: temps de réaction
  definition: Durée entre l'arrivée d'un signal et la réponse de la personne.
- terme: dopage
  definition: Usage de produits interdits pour améliorer ses performances sportives.
erreurs_frequentes:
- Croire que le message nerveux reste électrique d'un neurone à l'autre, alors qu'il devient chimique à la synapse.
- Penser que le cerveau est figé après l'enfance, alors que les connexions se modifient toute la vie.
- Croire que dormir est une perte de temps pour apprendre.
- Penser qu'un produit dopant améliore les performances sans risque.
exemple:
  enonce: Explique pourquoi une personne qui a bu de l'alcool freine plus tard devant un obstacle.
  solution: 'L''alcool perturbe la transmission des messages nerveux au niveau des synapses. Les messages entre l''œil, le
    cerveau et les muscles de la jambe sont transmis moins efficacement : le temps de réaction augmente, et la personne freine
    plus tard.'
exercices:
- id: zone-contact-neurones
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle la zone de contact entre deux neurones, où le message passe de l'un à l'autre ?
  reponse:
    acceptees:
    - synapse
    - synapses
    fautes_tolerees: 1
  indices:
    relance: Les deux neurones se touchent-ils vraiment ? Comment appelle-t-on le petit espace qui les sépare et les relie
      ?
    methode: 'Pense à la substance chimique libérée entre deux neurones : la zone où elle agit porte un nom précis.'
    etape: Le mot commence par « syn », qui veut dire « avec, ensemble ».
  pieges:
  - si:
      valeur: neurotransmetteur
    relance: Le neurotransmetteur est la substance qui passe d'un neurone à l'autre. Mais comment s'appelle la zone elle-même
      ?
  - si:
      valeur: axone
    relance: L'axone est le long prolongement d'un seul neurone. Comment s'appelle l'endroit où deux neurones communiquent
      ?
  solution: 'C''est la synapse : le message y est transmis par une substance chimique, le neurotransmetteur.'
- id: transmission-synapse
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes du passage d'un message nerveux d'un neurone au neurone suivant.
  reponse:
    elements:
    - id: p
      texte: Un message nerveux électrique parcourt l'axone du premier neurone.
    - id: b
      texte: Le message arrive au bout de l'axone.
    - id: l
      texte: Un neurotransmetteur est libéré dans l'espace entre les deux neurones.
    - id: f
      texte: Le neurotransmetteur se fixe sur des récepteurs du neurone suivant.
    - id: n
      texte: Un nouveau message nerveux électrique apparaît dans le neurone suivant.
  indices:
    relance: Le neurotransmetteur peut-il se fixer sur le neurone suivant avant d'avoir été libéré ?
    methode: 'Suis le message : d''abord électrique dans le premier neurone, puis chimique entre les deux, puis de nouveau
      électrique.'
    etape: La première étape est le message électrique qui parcourt l'axone. Où arrive-t-il ensuite ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque ! Deux étapes voisines sont inversées. Relis l''enchaînement : libéré, puis fixé, puis nouveau message.'
  - si:
      diagnostic: ordre_faux
    relance: 'Classe les étapes en trois temps : dans le premier neurone, entre les deux, dans le neurone suivant.'
  solution: Message électrique le long de l'axone → arrivée au bout de l'axone → libération du neurotransmetteur → fixation
    sur les récepteurs du neurone suivant → nouveau message électrique dans ce neurone.
- id: sommeil-temps-reaction
  type: nombre
  difficulte: 2
  enonce: 'Document (fictif) : au test de la règle, le temps de réaction moyen d''une classe est de 200 millisecondes après
    une nuit de 9 heures, et de 250 millisecondes après une nuit de 5 heures. De quel pourcentage le temps de réaction a-t-il
    augmenté ? Écris seulement le nombre, sans le signe %.'
  reponse:
    valeur: 25
  indices:
    relance: De combien de millisecondes le temps de réaction a-t-il augmenté ? Et par rapport à quelle valeur de départ ?
    methode: Pourcentage d'augmentation = augmentation ÷ valeur de départ × 100.
    etape: L'augmentation est de 50 millisecondes. Divise-la par la valeur de départ, puis multiplie par 100.
  pieges:
  - si:
      valeur: 50
    relance: 50, c'est l'augmentation en millisecondes. Pour un pourcentage, rapporte-la à la valeur de départ.
  - si:
      valeur: 20
    relance: 'Tu as divisé par 250. Un pourcentage d''augmentation se calcule par rapport à la valeur de départ : laquelle
      est-ce ?'
  - si:
      valeur: 125
    relance: Ce nombre compare les deux temps. On demande seulement de combien le temps a augmenté, en pourcentage.
  solution: 'Augmentation : 250 − 200 = 50 millisecondes. Pourcentage : 50 ÷ 200 × 100 = 25. Le temps de réaction a augmenté
    de 25 % : le manque de sommeil ralentit le fonctionnement du système nerveux.'
- id: vrai-faux-neurones
  type: choix
  difficulte: 2
  enonce: Quelles affirmations sont exactes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: Le message nerveux reste électrique quand il passe d'un neurone à l'autre.
    - id: b
      texte: À la synapse, le message est transmis par une substance chimique.
    - id: c
      texte: Les connexions entre neurones peuvent se modifier avec l'apprentissage, même chez l'adulte.
    - id: d
      texte: Un produit dopant améliore les performances sans aucun risque pour la santé.
    bonnes:
    - b
    - c
  indices:
    relance: Deux neurones se touchent-ils ? Comment le message traverse-t-il l'espace qui les sépare ?
    methode: 'Examine chaque phrase : une seule erreur de détail suffit à la rendre fausse.'
    etape: 'Relis la phrase d : la fatigue est un signal d''alerte. Que se passe-t-il si un produit l''efface ?'
  pieges:
  - si:
      contient:
      - a
    relance: Entre deux neurones, il y a un petit espace. Qu'est-ce qui est libéré dans cet espace ?
  - si:
      contient:
      - d
    relance: Un produit qui masque la fatigue empêche-t-il le corps de s'épuiser ? Pourquoi le dopage est-il interdit ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une phrase exacte, mais il y en a une autre. Pense à ce que l'entraînement fait au cerveau.
  solution: 'b et c sont exactes : à la synapse, le message devient chimique (neurotransmetteur), et les connexions entre
    neurones se modifient toute la vie. a est faux : le message change de nature à la synapse. d est faux : le dopage expose
    à de graves risques pour la santé.'
- id: comportements-effets
  type: association
  difficulte: 1
  enonce: Associe chaque comportement à son effet sur le système nerveux.
  reponse:
    gauche:
    - id: s
      texte: Dormir suffisamment
    - id: e
      texte: S'entraîner régulièrement à un geste
    - id: a
      texte: Boire de l'alcool
    - id: d
      texte: Prendre un stimulant dopant
    droite:
    - id: w
      texte: 'Perturbe les synapses : le temps de réaction augmente'
    - id: x
      texte: Masque la fatigue, au risque de dépasser les limites du corps
    - id: y
      texte: Permet au cerveau de récupérer et de mémoriser
    - id: z
      texte: 'Renforce les connexions utilisées : le geste devient plus précis'
    paires:
      s: y
      e: z
      a: w
      d: x
  indices:
    relance: Parmi ces comportements, lesquels sont bons pour le système nerveux, et lesquels sont dangereux ?
    methode: Classe d'abord les effets en deux groupes, positifs et négatifs, puis associe à l'intérieur de chaque groupe.
    etape: 'Commence par le sommeil : pendant la nuit, que fait le cerveau de ce que tu as appris dans la journée ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Compare l''alcool et le produit dopant : lequel supprime la sensation de fatigue
      ?'
  - si:
      diagnostic: associations_fausses
    relance: Sépare d'abord les deux comportements bénéfiques des deux comportements dangereux, puis recommence.
  solution: 'Dormir : le cerveau récupère et mémorise. S''entraîner : les connexions utilisées se renforcent. Alcool : perturbe
    les synapses, le temps de réaction augmente. Stimulant dopant : masque la fatigue, au risque de dépasser les limites du
    corps.'
- id: cycliste-dopage
  type: ouverte
  difficulte: 3
  enonce: 'Document (fictif) : pendant une course, un cycliste prend en cachette un produit stimulant qui agit sur son système
    nerveux. Dans l''ascension d''un col, son cœur bat à 200 battements par minute et sa température monte, mais il ne ressent
    aucune fatigue. Au sommet, il s''effondre. Explique, à l''aide du document, pourquoi ce produit est dangereux.'
  criteres:
  - L'élève explique que la fatigue est un signal envoyé par le système nerveux qui avertit que le corps atteint ses limites.
  - 'L''élève relie l''effet du produit au système nerveux : il masque ce signal, donc le cycliste continue l''effort au-delà
    de ses limites.'
  - L'élève utilise les données du document (fréquence cardiaque très élevée, température, effondrement) pour conclure au
    danger pour la santé.
  indices:
    relance: À quoi sert la sensation de fatigue pendant un effort ?
    methode: Explique d'abord le rôle normal de la fatigue, puis ce que le produit change, puis les conséquences visibles
      dans le document.
    etape: 'Commence ainsi : normalement, quand le corps approche de ses limites, le système nerveux...'
  solution: 'Normalement, la fatigue est un signal du système nerveux : elle avertit que le corps approche de ses limites
    et pousse à ralentir. Le produit agit sur le système nerveux et masque ce signal : le cycliste ne ressent rien et continue.
    Son cœur monte à 200 battements par minute, sa température augmente, et son corps dépasse ses limites : il s''effondre.
    Le dopage est donc dangereux pour la santé, en plus d''être interdit.'
- id: nom-prolongement-long
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle le long prolongement du neurone qui conduit le message nerveux ?
  reponse:
    acceptees:
    - axone
    - l'axone
    - un axone
    - fibre nerveuse
    - la fibre nerveuse
    fautes_tolerees: 1
  indices:
    relance: Le neurone a un corps cellulaire, des prolongements courts et un seul long prolongement.
    methode: Ce prolongement peut mesurer jusqu'à un mètre. Son nom commence par « a » et se termine par « one ».
    etape: Les prolongements courts reçoivent le message. Le prolongement long, lui, le conduit vers le neurone suivant.
  pieges:
  - si:
      valeur: synapse
    relance: La synapse est la zone de contact entre deux neurones, pas un prolongement du neurone.
  - si:
      valeur: noyau
    relance: Le noyau se trouve dans le corps cellulaire. On cherche un prolongement.
  solution: 'C''est l''axone (ou fibre nerveuse) : il conduit le message nerveux, électrique, le long du neurone.'
- id: effets-alcool-sommeil
  type: choix
  difficulte: 2
  enonce: Quelles conséquences sur le système nerveux sont exactes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: L'alcool allonge le temps de réaction.
    - id: b
      texte: Un manque de sommeil diminue l'attention.
    - id: c
      texte: Un produit dopant supprime tous les risques pour la santé.
    - id: d
      texte: Le cerveau ne change plus après l'enfance.
    bonnes:
    - a
    - b
  indices:
    relance: Deux affirmations sont des effets réels et prouvés. Deux sont des idées fausses très répandues.
    methode: Un produit qui masque la fatigue est-il sans danger ? Le cerveau change-t-il toute la vie ?
    etape: 'Relis l''essentiel : sommeil, alcool, dopage et plasticité cérébrale.'
  pieges:
  - si:
      contient:
      - c
    relance: 'Certains produits dopants masquent la fatigue, qui est un signal d''alerte : ils sont dangereux.'
  - si:
      contient:
      - d
    relance: 'Les connexions entre neurones se modifient toute la vie : c''est la plasticité cérébrale.'
  - si:
      diagnostic: incomplet
    relance: Il y a une autre bonne affirmation que tu n'as pas choisie.
  solution: 'a et b : l''alcool perturbe les synapses et augmente le temps de réaction ; le manque de sommeil diminue l''attention.
    Le dopage est dangereux et le cerveau se modifie toute la vie.'
- id: nblm-comment-le-message-nerveux-est-il-transm-1
  type: choix
  difficulte: 2
  enonce: Comment le message nerveux est-il transmis au niveau d'une synapse, entre deux neurones ?
  reponse:
    options:
    - id: o1
      texte: Par une substance chimique appelée neurotransmetteur.
    - id: o2
      texte: Par un courant électrique qui saute directement d'un neurone à l'autre.
    - id: o3
      texte: Par la circulation directe du sang entre les deux cellules nerveuses.
    - id: o4
      texte: Par le déplacement du noyau du premier neurone vers le second.
    bonnes:
    - o1
  indices:
    relance: Pense au rôle de la molécule libérée dans le petit espace séparant deux neurones.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le message est électrique le long d''un neurone, mais il devient chimique à la synapse car
      les neurones ne se touchent pas.'
  - si:
      contient:
      - o3
    relance: 'Faux : le sang transporte des nutriments et des hormones dans l''organisme, mais pas le message nerveux dans
      la fente synaptique.'
  - si:
      contient:
      - o4
    relance: 'Faux : le noyau reste à l''intérieur du corps cellulaire du neurone et ne se déplace jamais d''une cellule à
      l''autre.'
  solution: 'Par une substance chimique appelée neurotransmetteur. C''est exact : le long du neurone le message est électrique,
    mais au niveau de la synapse il provoque la libération d''une substance chimique, le neurotransmetteur.'
- id: nblm-comment-appelle-t-on-la-capacite-des-con-2
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on la capacité des connexions entre neurones à se modifier avec l'apprentissage et l'entraînement
    ?
  reponse:
    options:
    - id: o1
      texte: La plasticité cérébrale.
    - id: o2
      texte: La rigidité neuronale.
    - id: o3
      texte: La régénération musculaire.
    - id: o4
      texte: La commande moteur réflexe.
    bonnes:
    - o1
  indices:
    relance: Ce terme évoque la propriété de ce qui peut être façonné ou évoluer au cours du temps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que le cerveau est figé après l''enfance, alors qu''il fait preuve de plasticité.'
  - si:
      contient:
      - o3
    relance: 'Faux : ce terme concerne la réparation des muscles, alors qu''il s''agit ici de l''adaptation des connexions
      du système nerveux.'
  - si:
      contient:
      - o4
    relance: 'Faux : une commande réflexe est une réaction automatique rapide, et non la modifiabilité à long terme des circuits
      nerveux.'
  solution: 'La plasticité cérébrale. C''est exact : les connexions entre neurones se modifient toute la vie selon l''expérience
    et l''entraînement ; c''est la plasticité cérébrale.'
- id: nblm-quel-est-le-danger-principal-des-produit-3
  type: choix
  difficulte: 2
  enonce: Quel est le danger principal des produits dopants agissant sur le système nerveux chez un sportif ?
  reponse:
    options:
    - id: o1
      texte: Ils masquent la fatigue, qui est un signal d'alerte, et mettent la santé en danger.
    - id: o2
      texte: Ils améliorent les performances physiques sans aucun risque pour l'organisme.
    - id: o3
      texte: Ils bloquent définitivement la circulation du sang vers tous les muscles.
    - id: o4
      texte: Ils détruisent instantanément le noyau de tous les neurones du cerveau.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi le rôle protecteur joué par la sensation de fatigue pour éviter le surmenage de l'organisme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : penser qu''un produit dopant est sans risque. Il perturbe le fonctionnement nerveux et présente
      de graves dangers.'
  - si:
      contient:
      - o3
    relance: 'Faux : les substances dopantes n''arrêtent pas la circulation sanguine, elles agissent sur la perception nerveuse
      de la fatigue.'
  - si:
      contient:
      - o4
    relance: 'Faux : le dopage perturbe la transmission nerveuse et la vigilance, mais ne détruit pas instantanément les noyaux
      cellulaires.'
  solution: 'Ils masquent la fatigue, qui est un signal d''alerte, et mettent la santé en danger. C''est exact : certains
    produits dopants agissent sur le système nerveux en masquant le signal d''alerte naturel qu''est la fatigue.'
- id: nblm-quel-est-l-effet-de-la-consommation-d-al-4
  type: choix
  difficulte: 2
  enonce: Quel est l'effet de la consommation d'alcool ou de drogues sur le temps de réaction ?
  reponse:
    options:
    - id: o1
      texte: Le temps de réaction augmente, car la transmission du message aux synapses est perturbée.
    - id: o2
      texte: Le temps de réaction diminue, permettant de réagir plus rapidement.
    - id: o3
      texte: Le temps de réaction reste parfaitement identique à la normale.
    - id: o4
      texte: Le temps de réaction s'annule complètement sous l'effet de la stimulation.
    bonnes:
    - o1
  indices:
    relance: Pense au délai supplémentaire nécessaire pour que le cerveau analyse un danger et ordonne une réaction lorsque
      les synapses sont perturbées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que l''alcool stimule les réflexes, alors qu''il diminue la vigilance et rallonge
      le délai de réaction.'
  - si:
      contient:
      - o3
    relance: 'Faux : les substances psychoactives altérant le fonctionnement synaptique, le temps de réaction est toujours
      augmenté.'
  - si:
      contient:
      - o4
    relance: 'Faux : un temps de réaction ne peut pas être nul, et ces substances ralentissent le traitement de l''information.'
  solution: 'Le temps de réaction augmente, car la transmission du message aux synapses est perturbée. C''est exact : l''alcool
    et les drogues perturbent le fonctionnement des synapses, ce qui ralentit la transmission et augmente le temps de réaction.'
- id: nblm-pourquoi-le-sommeil-est-il-indispensable-5
  type: choix
  difficulte: 2
  enonce: Pourquoi le sommeil est-il indispensable au bon fonctionnement du système nerveux ?
  reponse:
    options:
    - id: o1
      texte: Il permet la récupération de l'organisme et favorise la mémorisation.
    - id: o2
      texte: Il stoppe définitivement la circulation des messages électriques dans le corps.
    - id: o3
      texte: Il constitue une perte de temps inutile pour l'assimilation des connaissances.
    - id: o4
      texte: Il élimine le besoin d'apport en dioxygène pour les cellules nerveuses.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce dont le cerveau a besoin pour consolider les connaissances étudiées durant la journée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : le système nerveux reste actif pendant le sommeil pour gérer la mémoire et maintenir les fonctions vitales.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : croire que dormir ne sert à rien, alors que c''est une phase capitale pour la mémorisation.'
  - si:
      contient:
      - o4
    relance: 'Faux : les neurones consomment continuellement du dioxygène et du glucose, y compris pendant le sommeil.'
  solution: 'Il permet la récupération de l''organisme et favorise la mémorisation. C''est exact : le sommeil est essentiel
    pour récupérer physiquement et pour consolider les apprentissages dans la mémoire.'
- id: nblm-parmi-les-affirmations-suivantes-sur-les-6
  type: choix
  difficulte: 3
  enonce: Parmi les affirmations suivantes sur les neurones et les synapses, lesquelles sont exactes ? (2 réponses attendues)
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le long d'un neurone, le message nerveux est de nature électrique.
    - id: o2
      texte: Au niveau d'une synapse, la transmission se fait par une substance chimique.
    - id: o3
      texte: Deux neurones sont directement fusionnés sans aucun espace entre eux.
    - id: o4
      texte: Les connexions entre neurones sont figées et ne changent plus après la naissance.
    bonnes:
    - o1
    - o2
  indices:
    relance: Attention au changement de nature du message entre le parcours le long du neurone et le passage entre deux neurones.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : deux neurones ne se touchent pas, la zone de contact est séparée par un petit espace synaptique.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : le réseau de neurones se modifie toute la vie grâce à l''apprentissage (plasticité cérébrale).'
  solution: 'Le long d''un neurone, le message nerveux est de nature électrique ; Au niveau d''une synapse, la transmission
    se fait par une substance chimique. C''est exact : la propagation du signal le long de l''axone d''un neurone se fait
    sous forme électrique.'
- id: nblm-quelle-substance-chimique-est-liberee-da-7
  type: texte_court
  difficulte: 1
  enonce: Quelle substance chimique est libérée dans la synapse pour transmettre le message d'un neurone à l'autre ?
  reponse:
    acceptees:
    - Neurotransmetteur
    fautes_tolerees: 1
  indices:
    relance: Ce mot composé désigne le messager chimique spécifique du système nerveux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Neurotransmetteur. C''est exact : le neurotransmetteur est la molécule chimique qui assure la transmission du
    message au niveau de la synapse.'
- id: nblm-comment-nomme-t-on-la-zone-de-contact-en-8
  type: texte_court
  difficulte: 1
  enonce: Comment nomme-t-on la zone de contact entre deux neurones où le message nerveux est transmis ?
  reponse:
    acceptees:
    - Synapse
    fautes_tolerees: 1
  indices:
    relance: Nom féminin court désignant la jonction entre deux neurones.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Synapse. C''est exact : la synapse désigne la zone d''interaction où deux cellules nerveuses communiquent.'
