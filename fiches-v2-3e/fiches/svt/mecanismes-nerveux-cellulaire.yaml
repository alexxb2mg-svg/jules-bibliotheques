format: 2
notion: mecanismes-nerveux-cellulaire
version: 1
etat: verifiee
declencheurs:
- synapse
- neurotransmetteur
- influx nerveux
- dopage et cerveau
- hygiène de vie et cerveau
- espace entre deux neurones
prerequis:
- role-cerveau-message-nerveux
essentiel: 'À l''échelle cellulaire, un message nerveux se transmet le long d''un neurone sous forme d''un signal électrique
  appelé influx nerveux (ou potentiel d''action), qui se propage rapidement le long de la cellule nerveuse.


  Entre deux neurones, il existe un espace appelé synapse, qui sépare la cellule qui transmet l''information (présynaptique)
  de celle qui la reçoit (postsynaptique) : l''influx nerveux ne peut pas franchir directement cet espace.


  Au niveau de la synapse, la transmission se fait grâce à des molécules chimiques appelées neurotransmetteurs, libérées par
  le neurone présynaptique dans l''espace synaptique, qui viennent se fixer sur des récepteurs du neurone suivant pour transmettre
  le message.


  Ce mode de transmission, à sens unique (toujours de la cellule présynaptique vers la cellule postsynaptique), explique le
  fonctionnement en réseau du système nerveux, qui permet d''intégrer et de coordonner de nombreuses informations.


  Certains comportements (consommation de drogues, dopage, manque de sommeil) peuvent perturber le fonctionnement des synapses
  et des neurotransmetteurs, avec des conséquences sur le fonctionnement cérébral ; une bonne hygiène de vie (sommeil, alimentation
  équilibrée, activité physique) favorise, à l''inverse, un fonctionnement nerveux optimal.'
methode:
- Distinguer le transport de l'information à l'intérieur d'un neurone (influx nerveux, électrique) et entre deux neurones
  (synapse, chimique).
- 'Retenir le sens de circulation de l''information à une synapse : toujours du neurone présynaptique vers le neurone postsynaptique.'
- Relier la libération de neurotransmetteurs à la transmission effective du message à travers la synapse.
- Relier un comportement (dopage, hygiène de vie) à son effet possible sur le fonctionnement nerveux et cérébral.
vocabulaire:
- terme: synapse
  definition: espace situé entre deux neurones, au niveau duquel le message est transmis chimiquement
- terme: neurotransmetteur
  definition: molécule chimique libérée par un neurone pour transmettre un message à travers une synapse
- terme: influx nerveux
  definition: signal électrique qui se propage le long d'un neurone
erreurs_frequentes:
- Croire que l'influx nerveux traverse directement la synapse sans intermédiaire chimique.
- Confondre neurotransmetteur (molécule chimique) et influx nerveux (signal électrique).
- Penser que l'information peut circuler dans les deux sens à travers une même synapse.
- Ignorer que des substances comme les drogues peuvent agir directement au niveau des synapses cérébrales.
exemple:
  enonce: Pourquoi dit-on que la transmission d'un message nerveux à une synapse est « chimique », alors qu'à l'intérieur
    d'un neurone elle est « électrique » ?
  solution: 'À l''intérieur d''un neurone, le message se propage sous forme d''un signal électrique (l''influx nerveux) ;
    mais entre deux neurones, l''espace synaptique ne permet pas à ce signal électrique de passer directement : la transmission
    se fait alors grâce à des molécules chimiques, les neurotransmetteurs, libérées puis captées par le neurone suivant.'
exercices:
- id: mot-neurotransmetteur
  type: texte_court
  difficulte: 1
  enonce: Que libère le neurone présynaptique dans la fente synaptique pour transmettre un message au neurone suivant ?
  reponse:
    acceptees:
    - neurotransmetteur
    - neurotransmetteurs
    fautes_tolerees: 1
  indices:
    relance: Ce sont des molécules chimiques, pas un signal électrique.
    methode: Relis le vocabulaire de ta leçon consacré à la transmission au niveau de la synapse.
    etape: Ces molécules se fixent ensuite sur des récepteurs du neurone suivant.
  pieges:
  - si:
      valeur: influx nerveux
    relance: L'influx nerveux est le signal électrique à l'intérieur du neurone, pas la molécule libérée dans la synapse.
  solution: Le neurone présynaptique libère des neurotransmetteurs.
- id: sens-transmission-synapse
  type: choix
  difficulte: 2
  enonce: Dans quel sens circule l'information au niveau d'une synapse ?
  reponse:
    options:
    - id: a
      texte: Toujours de la cellule présynaptique vers la cellule postsynaptique
    - id: b
      texte: Toujours de la cellule postsynaptique vers la cellule présynaptique
    - id: c
      texte: Dans les deux sens, selon le message transmis
    - id: d
      texte: Le sens change à chaque transmission au hasard
    bonnes:
    - a
  indices:
    relance: Le nom des deux cellules (présynaptique, postsynaptique) donne un indice sur l'ordre de la transmission.
    methode: Repense au préfixe « pré- » (avant) et « post- » (après) pour situer chaque cellule dans le trajet du message.
    etape: La cellule qui libère les neurotransmetteurs est la cellule présynaptique ; celle qui les reçoit est la postsynaptique.
  pieges:
  - si:
      contient:
      - b
    relance: 'C''est l''inverse : la cellule présynaptique libère les neurotransmetteurs, la postsynaptique les reçoit, pas
      le contraire.'
  - si:
      contient:
      - c
    relance: La transmission à une synapse se fait toujours dans le même sens, jamais dans les deux sens.
  solution: L'information circule toujours de la cellule présynaptique vers la cellule postsynaptique, jamais dans l'autre
    sens.
- id: associer-notions-cellulaires
  type: association
  difficulte: 2
  enonce: Relie chaque terme à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Synapse
    - id: b
      texte: Neurotransmetteur
    - id: c
      texte: Influx nerveux
    - id: d
      texte: Neurone présynaptique
    droite:
    - id: x
      texte: Cellule qui libère les neurotransmetteurs
    - id: y
      texte: Espace situé entre deux neurones
    - id: z
      texte: Signal électrique qui se propage le long d'un neurone
    - id: w
      texte: Molécule chimique qui transmet un message à travers la synapse
    paires:
      a: y
      b: w
      c: z
      d: x
  indices:
    relance: Repère d'abord ce qui est un espace (synapse) et ce qui est une cellule (neurone présynaptique).
    methode: Distingue ensuite le signal électrique interne au neurone (influx nerveux) de la molécule chimique libérée à
      la synapse (neurotransmetteur).
    etape: Le neurone présynaptique est celui qui envoie le message, pas celui qui le reçoit.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier influx nerveux et neurotransmetteur, souvent confondus.
  - si:
      diagnostic: associations_fausses
    relance: Reprends depuis le début en distinguant le signal électrique (influx nerveux) de la molécule chimique (neurotransmetteur).
  solution: Synapse = espace entre deux neurones ; Neurotransmetteur = molécule chimique transmettant le message ; Influx
    nerveux = signal électrique le long du neurone ; Neurone présynaptique = cellule qui libère les neurotransmetteurs.
- id: ordre-transmission-synaptique
  type: ordre
  difficulte: 2
  enonce: Range les étapes de la transmission d'un message nerveux à travers une synapse.
  reponse:
    elements:
    - id: influx-presynaptique
      texte: L'influx nerveux atteint l'extrémité du neurone présynaptique
    - id: liberation
      texte: Le neurone présynaptique libère des neurotransmetteurs dans l'espace synaptique
    - id: fixation
      texte: Les neurotransmetteurs se fixent sur des récepteurs du neurone postsynaptique
    - id: nouvel-influx
      texte: Un nouvel influx nerveux se propage dans le neurone postsynaptique
  indices:
    relance: Le message est d'abord un signal électrique, puis devient chimique au passage de la synapse, puis redevient électrique.
    methode: Place d'abord l'arrivée de l'influx dans le premier neurone, puis la libération chimique, puis la réception,
      puis le nouvel influx.
    etape: La libération des neurotransmetteurs a lieu après l'arrivée de l'influx nerveux dans le neurone présynaptique,
      pas avant.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. La libération des neurotransmetteurs a-t-elle lieu avant ou après leur fixation
      sur le neurone suivant ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le point de départ (influx dans le premier neurone) et le point final (nouvel influx dans le second),
      puis place les deux étapes chimiques intermédiaires.
  solution: D'abord l'influx nerveux dans le neurone présynaptique, puis la libération des neurotransmetteurs, puis leur fixation
    sur les récepteurs du neurone postsynaptique, puis un nouvel influx nerveux dans ce dernier.
- id: expliquer-hygiene-vie-cerveau
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi une bonne hygiène de vie (sommeil suffisant, alimentation équilibrée) favorise un bon fonctionnement
    du cerveau, en t'appuyant sur le rôle des synapses et des neurotransmetteurs.
  criteres:
  - L'élève explique que la transmission des messages nerveux repose sur le fonctionnement des synapses et des neurotransmetteurs.
  - L'élève relie une bonne hygiène de vie à un fonctionnement optimal de ces synapses et neurotransmetteurs.
  - L'élève mentionne qu'un manque de sommeil ou une alimentation déséquilibrée peut perturber cette transmission.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense à ce dont les neurones et les synapses ont besoin pour bien fonctionner.
    methode: Commence par rappeler le rôle des synapses et des neurotransmetteurs, puis relie-le à l'hygiène de vie, avant
      de conclure sur les risques d'un déséquilibre.
    etape: Le sommeil et une alimentation équilibrée apportent au cerveau ce qui est nécessaire au bon fonctionnement des
      cellules nerveuses.
  solution: La transmission des messages nerveux repose sur le bon fonctionnement des synapses, où des neurotransmetteurs
    sont libérés puis captés par le neurone suivant. Une bonne hygiène de vie, avec un sommeil suffisant et une alimentation
    équilibrée, favorise le fonctionnement optimal de ces synapses et neurotransmetteurs, en assurant la récupération des
    neurones et les apports nécessaires à leur activité. À l'inverse, un manque de sommeil ou une alimentation déséquilibrée
    peut perturber la transmission des messages nerveux et donc le fonctionnement cérébral, ce qui explique pourquoi l'hygiène
    de vie est recommandée.
