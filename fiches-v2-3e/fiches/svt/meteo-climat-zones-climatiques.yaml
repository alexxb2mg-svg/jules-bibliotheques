format: 2
notion: meteo-climat-zones-climatiques
version: 1
etat: verifiee
declencheurs:
- il fait beau aujourd'hui
- climat tropical
- climat tempéré
- zones climatiques du monde
- chaud à l'équateur
- froid aux pôles
- courants marins et température
prerequis: []
essentiel: 'La météo décrit l''état de l''atmosphère à un endroit précis et à un instant donné (ou sur quelques jours) : température,
  pluie, vent observés aujourd''hui ou cette semaine.


  Le climat décrit les conditions atmosphériques moyennes d''une région sur une longue période (généralement calculée sur
  plusieurs décennies) : il caractérise les tendances habituelles, pas un jour précis.


  La répartition de l''énergie solaire reçue selon la latitude, ainsi que les courants océaniques et les mouvements des masses
  d''air, expliquent l''existence de grandes zones climatiques sur Terre (climat tropical, tempéré, polaire, désertique, entre
  autres).


  Chaque zone climatique possède des conditions de température et de précipitations caractéristiques, qui déterminent en grande
  partie la répartition des faunes et des flores adaptées à ces conditions.


  Une seule journée de temps froid ne contredit pas un climat qui se réchauffe globalement : il ne faut pas confondre une
  variation météo ponctuelle avec une tendance climatique de long terme.'
methode:
- 'Distinguer la durée observée : quelques jours pour la météo, plusieurs décennies pour le climat.'
- Relier une zone climatique à sa latitude approximative et aux courants océaniques ou masses d'air qui l'influencent.
- Associer une faune et une flore typiques à chaque grande zone climatique.
- Ne jamais déduire une tendance climatique à partir d'une seule observation météo ponctuelle.
vocabulaire:
- terme: météo
  definition: l'état de l'atmosphère observé à un endroit précis et à un instant donné ou sur quelques jours
- terme: climat
  definition: les conditions atmosphériques moyennes d'une région, calculées sur plusieurs décennies
- terme: zone climatique
  definition: une grande région du globe caractérisée par des conditions de température et de précipitations semblables
erreurs_frequentes:
- Confondre météo (un jour donné) et climat (une moyenne sur le long terme).
- Croire qu'un hiver froid contredit le réchauffement climatique global.
- Penser que le climat est le même partout sur Terre à une même latitude, sans tenir compte des courants océaniques ou du
  relief.
- Confondre climat tropical (chaud toute l'année) et climat tempéré (saisons marquées).
exemple:
  enonce: En quoi la phrase « il pleut aujourd'hui, donc le climat ne se réchauffe pas » est-elle incorrecte scientifiquement
    ?
  solution: 'Elle confond météo (l''observation d''un jour) et climat (une tendance mesurée sur plusieurs décennies) : un
    jour de pluie ne dit rien sur l''évolution du climat à long terme.'
exercices:
- id: distinction-meteo-climat
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases parle du climat, et non de la météo ?
  reponse:
    options:
    - id: a
      texte: Cette région a des étés chauds et secs en moyenne sur les 30 dernières années
    - id: b
      texte: Il fait 25 °C aujourd'hui à Paris
    - id: c
      texte: Il va pleuvoir demain matin
    - id: d
      texte: Le ciel est nuageux ce week-end
    bonnes:
    - a
  indices:
    relance: Cherche la phrase qui parle d'une durée de plusieurs années, pas d'un jour précis.
    methode: Élimine toutes les phrases qui décrivent un jour ou un week-end particulier.
    etape: 'Une seule phrase parle d''une moyenne calculée sur plusieurs décennies : c''est celle-là qui décrit le climat.'
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase décrit une observation d'un seul jour, pas une moyenne sur longue durée. Relis la définition du
      climat.
  - si:
      contient:
      - c
    relance: Une prévision pour demain concerne un instant précis, pas une tendance de long terme.
  - si:
      contient:
      - d
    relance: Un week-end reste une courte période. Cherche la phrase qui parle de plusieurs décennies.
  solution: La phrase « Cette région a des étés chauds et secs en moyenne sur les 30 dernières années » décrit le climat,
    car elle porte sur une moyenne calculée sur une longue période.
- id: mot-facteur-zones-climatiques
  type: texte_court
  difficulte: 2
  enonce: Quel facteur, lié à la position sur le globe, explique en premier lieu pourquoi il existe différentes zones climatiques
    (équateur, pôles) ?
  reponse:
    acceptees:
    - latitude
    fautes_tolerees: 1
  indices:
    relance: Pense à la distance par rapport à l'équateur, qui détermine la quantité d'énergie solaire reçue.
    methode: Ce facteur se mesure en degrés, du côté nord ou sud de l'équateur.
    etape: C'est ce facteur géographique qui fait que l'équateur reçoit plus d'énergie solaire que les pôles.
  pieges:
  - si:
      valeur: longitude
    relance: Ce facteur situe un lieu d'est en ouest, pas selon la quantité d'énergie solaire reçue. Cherche le facteur nord-sud.
  - si:
      valeur: altitude
    relance: Ce facteur influence aussi le climat local, mais ce n'est pas le premier facteur qui explique les grandes zones
      climatiques mondiales (équateur, pôles).
  solution: 'C''est la latitude : la quantité d''énergie solaire reçue varie avec la latitude, ce qui crée des zones climatiques
    différentes (tropicale, tempérée, polaire).'
- id: facteur-supplementaire-climat
  type: choix
  difficulte: 2
  enonce: En plus de la latitude, quel autre facteur influence le climat d'une région ?
  reponse:
    options:
    - id: a
      texte: Les courants océaniques et les masses d'air
    - id: b
      texte: La couleur du drapeau du pays
    - id: c
      texte: Le nombre d'habitants de la région
    bonnes:
    - a
  indices:
    relance: Pense aux masses d'eau et d'air en mouvement autour du globe.
    methode: Élimine les facteurs qui n'ont pas de rapport physique avec la météo ou le climat.
    etape: Les mouvements de l'eau des océans et de l'air influencent la température et les précipitations d'une région.
  pieges:
  - si:
      contient:
      - b
    relance: Le drapeau d'un pays n'a aucun effet physique sur le climat.
  - si:
      contient:
      - c
    relance: Le nombre d'habitants n'influence pas directement le climat régional (même si les activités humaines influencent
      le climat mondial autrement).
  solution: Les courants océaniques ou les masses d'air (vents dominants) influencent aussi le climat d'une région ; l'altitude
    joue également un rôle.
- id: association-zone-faune
  type: association
  difficulte: 2
  enonce: Associe chaque zone climatique à une caractéristique qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: Climat tropical
    - id: b
      texte: Climat polaire
    - id: c
      texte: Climat désertique
    droite:
    - id: x
      texte: Chaud toute l'année, avec une saison des pluies marquée
    - id: y
      texte: Très froid, avec une faune adaptée comme l'ours polaire
    - id: z
      texte: Très peu de précipitations toute l'année
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pense à la localisation approximative de chaque zone sur le globe (équateur, pôles, régions arides).
    methode: Commence par la zone polaire, la plus facile à reconnaître grâce à sa faune caractéristique.
    etape: Le climat tropical est chaud avec une saison des pluies ; le climat polaire est très froid ; le climat désertique
      reçoit très peu de précipitations.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la caractéristique la plus typique de chaque zone.
  - si:
      diagnostic: associations_fausses
    relance: Pars de la zone polaire, la plus facile à identifier grâce à sa faune, puis raisonne pour les deux autres.
  solution: 'Climat tropical : chaud toute l''année avec une saison des pluies marquée. Climat polaire : très froid, faune
    adaptée comme l''ours polaire. Climat désertique : très peu de précipitations toute l''année.'
- id: ordre-etude-climat-region
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre logique pour expliquer le climat d'une région à partir de sa latitude.
  reponse:
    elements:
    - id: latitude
      texte: Repérer la latitude de la région étudiée
    - id: energie
      texte: En déduire la quantité d'énergie solaire reçue en moyenne
    - id: courants
      texte: Identifier les courants océaniques ou masses d'air qui influencent aussi la région
    - id: zone
      texte: Déterminer la grande zone climatique correspondante
  indices:
    relance: Que faut-il connaître en premier pour estimer l'énergie solaire reçue par une région ?
    methode: Pars d'une donnée géographique simple (la latitude) avant d'ajouter les facteurs plus complexes (courants, masses
      d'air).
    etape: La latitude vient en premier ; la détermination de la zone climatique est la conclusion finale.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle des deux doit être connue avant l'autre pour progresser logiquement
      ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par la donnée géographique la plus simple à observer (la latitude) et termine par la conclusion (la
      zone climatique).
  solution: Repérer la latitude, en déduire l'énergie solaire reçue, identifier les courants océaniques ou masses d'air influents,
    puis déterminer la zone climatique correspondante.
- id: developpement-meteo-vs-climat
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique la différence entre météo et climat, et pourquoi un hiver froid ne remet pas
    en cause le réchauffement climatique.'
  criteres:
  - L'élève distingue clairement la durée observée par la météo (quelques jours) et par le climat (plusieurs décennies).
  - L'élève explique qu'une observation ponctuelle (un hiver froid) ne suffit pas à juger une tendance de long terme.
  - L'élève relie cette distinction au réchauffement climatique, qui est une tendance mesurée sur le long terme.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Sur combien de temps calcule-t-on en général un climat ?
    methode: Commence par définir météo et climat, puis applique cette distinction à l'exemple de l'hiver froid.
    etape: Tu peux commencer ainsi « La météo et le climat ne mesurent pas la même durée... »
  solution: 'La météo décrit l''état de l''atmosphère à un instant précis ou sur quelques jours, tandis que le climat décrit
    une moyenne calculée sur plusieurs décennies. Un hiver particulièrement froid est donc une observation météo ponctuelle
    : elle ne dit rien, à elle seule, sur l''évolution du climat à long terme. Le réchauffement climatique est une tendance
    mesurée sur plusieurs décennies, qui peut très bien s''accompagner, certaines années, d''épisodes de froid localisés.
    Il ne faut donc pas confondre une variation météo d''un hiver avec la tendance climatique globale, qui elle, montre un
    réchauffement sur le long terme.'
