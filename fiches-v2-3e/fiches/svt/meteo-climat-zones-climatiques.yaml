- id: nblm-quels-facteurs-permettent-d-expliquer-le-6
  type: choix
  difficulte: 3
  enonce: Quels facteurs permettent d'expliquer les caractéristiques du climat d'une région ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La latitude, qui détermine l'angle des rayons solaires reçus.
    - id: o2
      texte: La proximité de l'océan, les courants marins et les vents dominants.
    - id: o3
      texte: L'écoute du bulletin météo de la veille à la télévision.
    - id: o4
      texte: La couleur du magma situé au centre de la Terre.
    bonnes:
    - o1
    - o2
  indices:
