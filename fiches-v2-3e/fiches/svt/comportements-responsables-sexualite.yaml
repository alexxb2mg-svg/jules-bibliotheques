format: 2
notion: comportements-responsables-sexualite
version: 2
etat: verifiee
declencheurs:
- préservatif
- pilule contraceptive
- pilule du lendemain
- infection sexuellement transmissible
- VIH
- consentement
- se protéger des IST
- éviter une grossesse
- rapport non protégé
prerequis:
- appareils-reproducteurs-puberte
- monde-microbien-immunite
essentiel: 'Fertilité : à partir de la puberté, l''homme produit des spermatozoïdes en continu. La femme est fertile de la
  puberté à la ménopause ; une grossesse est possible surtout autour de l''ovulation, mais la date de l''ovulation varie d''un
  cycle à l''autre et les spermatozoïdes peuvent survivre quelques jours : il n''existe pas de période « sans risque » fiable.


  La contraception permet de choisir si et quand avoir un enfant. Le préservatif (externe ou interne) forme une barrière qui
  empêche les spermatozoïdes d''atteindre l''ovule. La pilule contraceptive contient des hormones qui empêchent en général
  l''ovulation ; elle doit être prise régulièrement. Le dispositif intra-utérin (DIU, ou stérilet) est placé dans l''utérus
  par un professionnel de santé. La contraception d''urgence se prend le plus tôt possible après un rapport non protégé ;
  ce n''est pas une méthode régulière.


  Les infections sexuellement transmissibles (IST) sont dues à des bactéries ou à des virus transmis lors de rapports sexuels
  : VIH (virus responsable du sida), chlamydia (bactérie), papillomavirus, hépatite B… Beaucoup d''IST ne donnent aucun symptôme
  pendant longtemps. Le préservatif est le seul moyen de contraception qui protège aussi des IST. Le dépistage permet de savoir
  si l''on est infecté et de se soigner ; des vaccins existent contre le papillomavirus et l''hépatite B.


  Le respect de l''autre est la base de tout comportement responsable : une relation sexuelle suppose le consentement libre
  de chaque personne, qui peut refuser ou changer d''avis à tout moment. La loi punit les violences sexuelles.


  Quand un couple a des difficultés à avoir un enfant, la médecine propose des techniques d''aide à la procréation (par exemple
  la fécondation in vitro). Pour toute question personnelle, l''infirmière scolaire, un médecin ou un adulte de confiance
  peuvent aider.


  Choix raisonné de la procréation : avoir un enfant est un choix qui engage. La contraception, l''information et le dialogue
  permettent de décider ensemble si et quand.


  Au brevet : on demande de comparer des méthodes (contre une grossesse, contre les IST), d''expliquer sur quelle étape une
  méthode agit (ovulation, rencontre des gamètes) et de justifier des comportements responsables (respect, consentement, prévention,
  dépistage).

  '
methode:
- 'Pour une méthode de contraception, se demander : à quelle étape agit-elle (ovulation, rencontre des cellules reproductrices)
  ? Protège-t-elle aussi des IST ?'
- 'Pour une IST, identifier le microbe (virus ou bactérie) et les moyens de prévention : préservatif, dépistage, vaccination.'
- Relier chaque comportement responsable à une connaissance scientifique (fertilité, transmission des microbes, rôle des hormones).
- 'Vérifier si l''affirmation évoque un risque de grossesse, un risque d''IST, ou le respect de l''autre : ce ne sont pas
  les mêmes réponses.'
- Se rappeler qu'aucune période du cycle n'est sûre à coup sûr pour éviter une grossesse.
vocabulaire:
- terme: contraception
  definition: Ensemble des méthodes qui permettent d'éviter une grossesse.
- terme: IST
  definition: Infection sexuellement transmissible, due à un virus ou à une bactérie transmis lors de rapports sexuels.
- terme: dépistage
  definition: Test qui permet de savoir si une personne est porteuse d'une infection, même sans symptôme.
- terme: consentement
  definition: Accord libre et explicite d'une personne, qu'elle peut retirer à tout moment.
- terme: Fertilité
  definition: Capacité à avoir des enfants.
- terme: Préservatif
  definition: Barrière qui empêche les spermatozoïdes d'atteindre l'ovule et qui protège aussi des IST.
- terme: Pilule contraceptive
  definition: Contraception hormonale qui empêche en général l'ovulation.
- terme: Procréation
  definition: Fait de donner naissance à un enfant.
- terme: Ovulation
  definition: Libération d'un ovule par un ovaire.
erreurs_frequentes:
- 'Croire que la pilule protège des IST : elle agit sur l''ovulation, pas sur la transmission des microbes.'
- Penser qu'on voit toujours si une personne a une IST, alors que beaucoup d'IST ne donnent aucun symptôme.
- Croire que la contraception d'urgence est une méthode de contraception régulière.
- 'Croire que les antibiotiques guérissent le VIH : c''est un virus ; des traitements le contrôlent sans l''éliminer.'
- Penser que l'absence de refus ou le silence vaut un accord.
exemple:
  enonce: Pourquoi conseille-t-on d'utiliser un préservatif lors d'une nouvelle relation, même si une contraception par pilule
    est déjà utilisée ?
  solution: La pilule empêche l'ovulation, donc elle évite une grossesse, mais elle n'empêche pas les microbes de passer d'une
    personne à l'autre. Le préservatif forme une barrière qui protège des IST. Les deux méthodes se complètent.
exercices:
- id: contraception-et-ist
  type: choix
  difficulte: 1
  enonce: Quel moyen de contraception protège aussi des infections sexuellement transmissibles (IST) ?
  reponse:
    options:
    - id: a
      texte: La pilule contraceptive
    - id: b
      texte: Le préservatif
    - id: c
      texte: Le dispositif intra-utérin (DIU)
    - id: d
      texte: La contraception d'urgence
    bonnes:
    - b
  indices:
    relance: 'Pour se protéger d''une IST, que faut-il empêcher : l''ovulation, ou le contact entre les liquides du corps
      qui transportent les microbes ?'
    methode: 'Pour chaque méthode, demande-toi où elle agit : sur l''ovulation, dans l''utérus, ou comme une barrière entre
      les deux partenaires.'
    etape: La pilule agit sur l'ovulation grâce à des hormones. Empêche-t-elle un virus de passer d'une personne à l'autre
      ?
  pieges:
  - si:
      contient:
      - a
    relance: La pilule empêche l'ovulation. Mais un virus ou une bactérie a-t-il besoin d'un ovule pour se transmettre ?
  - si:
      contient:
      - c
    relance: Le DIU est placé dans l'utérus. Empêche-t-il le contact entre les partenaires, par lequel passent les microbes
      ?
  - si:
      contient:
      - d
    relance: La contraception d'urgence se prend après un rapport. Peut-elle empêcher un microbe déjà transmis de l'avoir
      été ?
  solution: 'Le préservatif : il forme une barrière qui empêche à la fois les spermatozoïdes d''atteindre l''ovule et les
    microbes des IST de passer d''une personne à l''autre.'
- id: virus-du-sida
  type: texte_court
  difficulte: 1
  enonce: Quel virus, qui peut se transmettre lors de rapports sexuels non protégés, est responsable du sida ? Donne son nom
    ou son sigle.
  reponse:
    acceptees:
    - VIH
    - virus de l'immunodéficience humaine
    - HIV
    fautes_tolerees: 0
  indices:
    relance: 'Le sida est une maladie. On te demande le nom du virus qui la provoque : c''est un sigle de trois lettres.'
    methode: 'Ce virus s''attaque au système immunitaire. Son nom complet est « virus de l''… humaine » : complète avec le
      mot qui désigne un manque de défenses immunitaires.'
    etape: Le sigle commence par V, pour « virus ».
  pieges:
  - si:
      valeur: sida
    relance: Le sida est la maladie. Quel est le nom du virus qui la provoque ?
  - si:
      valeur: papillomavirus
    relance: Le papillomavirus est aussi transmis lors de rapports sexuels, mais il n'est pas responsable du sida. Lequel
      s'attaque au système immunitaire ?
  solution: C'est le VIH, le virus de l'immunodéficience humaine. Sans traitement, il affaiblit le système immunitaire et
    peut conduire au sida.
- id: methodes-et-actions
  type: association
  difficulte: 2
  enonce: Associe chaque méthode à sa description. Réponds sous la forme a-1, b-2…
  reponse:
    gauche:
    - id: a
      texte: Préservatif
    - id: b
      texte: Pilule contraceptive
    - id: c
      texte: Dispositif intra-utérin (DIU)
    - id: d
      texte: Contraception d'urgence
    droite:
    - id: '1'
      texte: Barrière qui empêche les spermatozoïdes d'atteindre l'ovule et protège aussi des IST
    - id: '2'
      texte: Comprimé à prendre régulièrement, contenant des hormones qui empêchent en général l'ovulation
    - id: '3'
      texte: Dispositif placé dans l'utérus par un professionnel de santé, qui empêche une grossesse pendant plusieurs années
    - id: '4'
      texte: À prendre le plus tôt possible après un rapport non protégé ; ce n'est pas une méthode régulière
    paires:
      a: '1'
      b: '2'
      c: '3'
      d: '4'
  indices:
    relance: Laquelle de ces méthodes s'utilise après un rapport, et non avant ou pendant ?
    methode: 'Cherche dans chaque description un mot-clé : barrière, hormones, utérus, après un rapport.'
    etape: Le DIU est un dispositif « intra-utérin », c'est-à-dire placé dans l'utérus. Quelle description en parle ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule erreur. Laquelle de ces méthodes agit grâce à des hormones prises chaque jour ?
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs erreurs. Repère dans les descriptions les mots « barrière », « hormones », « utérus » et « après un
      rapport ».
  solution: a-1 (le préservatif est une barrière), b-2 (la pilule contient des hormones), c-3 (le DIU est placé dans l'utérus),
    d-4 (la contraception d'urgence se prend après un rapport non protégé).
- id: ist-sans-symptome
  type: nombre
  difficulte: 2
  enonce: 'Document fictif : dans une étude imaginaire, on dépiste une IST chez 200 personnes porteuses de cette infection.
    Parmi elles, 140 n''avaient aucun symptôme. Quel pourcentage de ces personnes n''avait aucun symptôme ? Écris seulement
    le nombre.'
  reponse:
    valeur: 70
    forme: libre
  indices:
    relance: Un pourcentage, c'est une proportion ramenée à 100 personnes. Quelle part des 200 personnes représentent les
      140 ?
    methode: Divise le nombre de personnes sans symptôme par le nombre total de personnes, puis multiplie par 100.
    etape: Calcule d'abord 140 ÷ 200 (tu obtiens un nombre décimal), puis multiplie par 100.
  pieges:
  - si:
      valeur: 60
    relance: 60, c'est le nombre de personnes qui avaient des symptômes. On demande le pourcentage de celles qui n'en avaient
      aucun.
  - si:
      valeur: 0.7
    relance: 'Tu as bien calculé la proportion. Il reste à l''exprimer en pourcentage : par combien faut-il multiplier ?'
  - si:
      diagnostic: valeur_fausse
    relance: 'Reprends : nombre sans symptôme divisé par nombre total, puis multiplié par 100.'
  solution: '140 ÷ 200 × 100 = 70. Dans ce document, 70 % des personnes infectées n''avaient aucun symptôme : on ne peut pas
    savoir sans dépistage si l''on est porteur d''une IST.'
- id: respect-et-consentement
  type: choix
  difficulte: 2
  enonce: Parmi ces affirmations sur le respect et le consentement, lesquelles sont justes ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: Chaque personne a le droit de refuser une relation sexuelle, et de changer d'avis à tout moment.
    - id: b
      texte: Un accord obtenu par la pression ou la menace n'est pas un consentement.
    - id: c
      texte: Avoir dit oui une fois oblige à dire oui les fois suivantes.
    - id: d
      texte: Une personne qui ne dit rien est forcément d'accord.
    bonnes:
    - a
    - b
  indices:
    relance: Un consentement doit être libre. Que veut dire « libre » ici ?
    methode: Pour chaque affirmation, demande-toi si la personne peut choisir librement, à ce moment-là, sans être forcée.
    etape: 'Relis la définition du consentement dans le vocabulaire : peut-on le retirer ? Que dis-tu alors de l''affirmation
      « avoir dit oui une fois oblige… » ?'
  pieges:
  - si:
      contient:
      - c
    relance: Le consentement peut être retiré à tout moment. Un accord donné une fois vaut-il pour toujours ?
  - si:
      contient:
      - d
    relance: 'Le silence n''est pas un accord : un consentement doit être clairement exprimé. Une personne peut se taire parce
      qu''elle a peur ou qu''elle hésite.'
  - si:
      diagnostic: incomplet
    relance: Il manque une affirmation juste. Un accord obtenu en forçant quelqu'un est-il libre ?
  solution: 'Justes : a et b. Le consentement est libre, il peut être refusé ou retiré à tout moment, et il ne peut pas être
    obtenu par la pression. c est faux (un accord passé n''oblige à rien) ; d est faux (le silence n''est pas un accord).'
- id: pilule-et-preservatif
  type: ouverte
  difficulte: 3
  enonce: 'Document fictif : un tableau compare deux méthodes. Pilule contraceptive : très efficace contre une grossesse si
    elle est prise régulièrement ; aucune protection contre les IST. Préservatif : efficace contre une grossesse s''il est
    bien utilisé à chaque rapport ; protège contre la plupart des IST, dont le VIH. En t''appuyant sur ce document et sur
    tes connaissances, explique pourquoi il est conseillé d''utiliser le préservatif avec une nouvelle ou un nouveau partenaire,
    même si une pilule est déjà utilisée.'
  criteres:
  - L'élève explique, à partir du document, que la pilule évite une grossesse (elle empêche l'ovulation) mais ne protège pas
    des IST.
  - L'élève explique que le préservatif forme une barrière contre les microbes et que beaucoup d'IST ne donnent pas de symptômes,
    donc on ne sait pas si un partenaire est porteur sans dépistage.
  - 'L''élève conclut que les deux méthodes se complètent : l''une contre la grossesse, l''autre contre les IST.'
  indices:
    relance: Contre quoi chaque méthode protège-t-elle, d'après le tableau ?
    methode: Fais deux colonnes (grossesse, IST) et place chaque méthode dans la bonne colonne, puis explique pourquoi avec
      tes connaissances.
    etape: La pilule agit sur l'ovulation. Est-ce que cela empêche un virus comme le VIH de passer d'une personne à l'autre
      ?
  solution: 'La pilule empêche l''ovulation : elle évite une grossesse, mais elle ne protège pas des IST, car elle n''empêche
    pas les microbes de passer d''une personne à l''autre. Le préservatif forme une barrière contre les microbes, dont le
    VIH. Beaucoup d''IST ne donnent aucun symptôme : avec un nouveau partenaire, on ne peut pas savoir sans dépistage s''il
    est porteur. Les deux méthodes se complètent : la pilule contre la grossesse, le préservatif contre les IST.'
- id: test-de-depistage
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le test qui permet de savoir si l'on est porteur d'une infection sexuellement transmissible
    ?
  reponse:
    acceptees:
    - dépistage
    - depistage
    - le dépistage
    - test de dépistage
    fautes_tolerees: 1
  indices:
    relance: Beaucoup d'IST ne donnent aucun symptôme pendant longtemps. Comment le savoir quand même ?
    methode: Le cours cite un moyen de savoir si l'on est infecté, pour pouvoir se soigner.
    etape: Ce test se fait par une prise de sang ou un prélèvement chez un professionnel de santé. Quel mot du cours le désigne
      ?
  pieges:
  - si:
      valeur: préservatif
    relance: Le préservatif protège, mais il ne permet pas de savoir si l'on est infecté. On cherche le mot pour le test.
  - si:
      valeur: vaccination
    relance: Le vaccin prévient certaines infections. On te demande le nom du test qui révèle une infection existante.
  solution: 'C''est le dépistage : il permet de savoir si l''on est infecté, même sans symptôme, et de se soigner rapidement.'
- id: fertilite-et-cycle
  type: choix
  difficulte: 2
  enonce: Parmi ces affirmations sur la fertilité, lesquelles sont justes ?
  reponse:
    options:
    - id: a
      texte: La date de l'ovulation peut varier d'un cycle à l'autre.
    - id: b
      texte: Il existe une période du cycle où une grossesse est impossible à coup sûr.
    - id: c
      texte: Les spermatozoïdes peuvent survivre quelques jours dans les voies génitales de la femme.
    - id: d
      texte: L'homme n'est fertile que quelques jours par mois.
    bonnes:
    - a
    - c
  indices:
    relance: Relis dans le cours ce qui rend difficile de dire qu'une période est « sans risque ».
    methode: Repère ce que dit le cours sur l'ovulation, sur la survie des spermatozoïdes et sur la production de spermatozoïdes
      chez l'homme.
    etape: 'Commence par la phrase d : à partir de la puberté, comment l''homme produit-il ses spermatozoïdes ?'
  pieges:
  - si:
      contient:
      - b
    relance: 'L''ovulation varie et les spermatozoïdes survivent quelques jours : peut-on garantir une période sans risque
      ?'
  - si:
      contient:
      - d
    relance: L'homme produit des spermatozoïdes en continu à partir de la puberté. Peut-on parler de quelques jours par mois
      ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation juste, mais il y en a une autre. Que sais-tu de la survie des spermatozoïdes ?
  solution: 'a et c sont justes : l''ovulation varie et les spermatozoïdes survivent quelques jours, donc aucune période n''est
    sûre (b est fausse). L''homme produit des spermatozoïdes en continu (d est fausse).'
