format: 2
notion: comportements-responsables-sexualite
version: 1
etat: verifiee
declencheurs:
- contraception
- pilule contraceptive
- préservatif
- infection sexuellement transmissible
- choix d'avoir un enfant
- prévention IST
prerequis:
- appareils-reproducteurs-puberte
essentiel: 'Un comportement responsable en matière de sexualité tient compte de plusieurs éléments : la fertilité (la capacité
  à procréer), le respect de l''autre et de son consentement, le choix raisonné de la procréation (avoir ou non un enfant,
  à quel moment), et la prévention des infections sexuellement transmissibles (IST).


  La contraception regroupe les méthodes qui permettent d''éviter une grossesse non désirée tout en ayant des rapports sexuels
  : elle peut agir en empêchant la libération ou la rencontre des gamètes (par exemple, la pilule contraceptive empêche l''ovulation).


  Le préservatif (masculin ou féminin) est la seule méthode de contraception qui protège aussi contre la transmission des
  infections sexuellement transmissibles, en empêchant tout contact direct entre muqueuses et fluides.


  Une infection sexuellement transmissible (IST) se transmet lors de rapports sexuels non protégés ; certaines IST peuvent
  avoir des conséquences graves si elles ne sont pas dépistées et traitées à temps, d''où l''importance de la prévention et
  du dépistage régulier.


  La grossesse résulte de la fécondation d''un ovule par un spermatozoïde ; le choix raisonné de la procréation implique d''anticiper
  ce risque lors de rapports sexuels non protégés si une grossesse n''est pas souhaitée.'
methode:
- Distinguer les méthodes de contraception qui évitent une grossesse de celles qui protègent en plus des IST (préservatif).
- Relier le mode d'action d'une méthode contraceptive à l'étape de la reproduction qu'elle bloque (ovulation, rencontre des
  gamètes…).
- Retenir que seul le préservatif protège à la fois de la grossesse non désirée et des IST.
- Relier prévention (préservatif, dépistage) et conséquences possibles d'une IST non traitée.
vocabulaire:
- terme: IST
  definition: infection sexuellement transmissible, se transmettant lors de rapports sexuels non protégés
- terme: contraception
  definition: ensemble des méthodes permettant d'éviter une grossesse non désirée
erreurs_frequentes:
- Croire que toutes les méthodes de contraception protègent aussi contre les IST (seul le préservatif le fait).
- Penser qu'une IST ne peut pas être transmise sans symptômes visibles.
- 'Confondre contraception (éviter une grossesse) et prévention des IST (éviter une infection) : ce sont deux enjeux différents,
  parfois liés à la même méthode (préservatif).'
- Croire que la responsabilité en matière de sexualité ne concerne que la contraception, en oubliant le respect du consentement
  de l'autre.
exemple:
  enonce: Pourquoi recommande-t-on souvent d'associer la pilule contraceptive et le préservatif chez un couple qui n'est pas
    mutuellement fidèle depuis longtemps ?
  solution: La pilule contraceptive évite une grossesse non désirée en empêchant l'ovulation, mais ne protège pas contre les
    infections sexuellement transmissibles ; seul le préservatif protège contre les IST. Associer les deux méthodes permet
    de se prémunir à la fois contre une grossesse non désirée et contre les IST.
exercices:
- id: methode-protegeant-ist
  type: texte_court
  difficulte: 1
  enonce: Quelle est la seule méthode contraceptive qui protège aussi contre les infections sexuellement transmissibles ?
  reponse:
    acceptees:
    - préservatif
    - le préservatif
    fautes_tolerees: 1
  indices:
    relance: Pense à une barrière physique empêchant tout contact direct entre muqueuses et fluides.
    methode: Relis la partie de ta leçon qui distingue les méthodes protégeant seulement de la grossesse et celle protégeant
      aussi des IST.
    etape: Cette méthode existe en version masculine et en version féminine.
  pieges:
  - si:
      valeur: pilule
    relance: La pilule évite une grossesse non désirée, mais elle ne protège pas contre les infections sexuellement transmissibles.
  solution: Le préservatif (masculin ou féminin) est la seule méthode contraceptive qui protège aussi contre les IST.
- id: action-pilule-contraceptive
  type: choix
  difficulte: 1
  enonce: Comment agit la pilule contraceptive pour éviter une grossesse ?
  reponse:
    options:
    - id: a
      texte: Elle empêche l'ovulation
    - id: b
      texte: Elle détruit les spermatozoïdes
    - id: c
      texte: Elle empêche la transmission des IST
    - id: d
      texte: Elle rend l'ovule infertile après la fécondation
    bonnes:
    - a
  indices:
    relance: Pense à l'une des étapes nécessaires à la fécondation, du côté de la femme.
    methode: Relis la partie de ta leçon consacrée au mode d'action de la pilule contraceptive.
    etape: Sans cette étape (la libération d'un ovule), la fécondation ne peut pas avoir lieu.
  pieges:
  - si:
      contient:
      - c
    relance: La pilule contraceptive ne protège pas contre les IST ; seul le préservatif le fait.
  - si:
      contient:
      - b
    relance: La pilule n'agit pas directement sur les spermatozoïdes, mais empêche la libération de l'ovule chez la femme.
  solution: La pilule contraceptive empêche l'ovulation (la libération d'un ovule par l'ovaire), ce qui empêche la fécondation.
- id: associer-notions-sexualite
  type: association
  difficulte: 2
  enonce: Relie chaque terme à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Contraception
    - id: b
      texte: IST
    - id: c
      texte: Préservatif
    - id: d
      texte: Dépistage
    droite:
    - id: x
      texte: Méthode qui protège à la fois de la grossesse non désirée et des IST
    - id: y
      texte: Ensemble des méthodes permettant d'éviter une grossesse non désirée
    - id: z
      texte: Permet de détecter une infection, même sans symptôme visible
    - id: w
      texte: Infection se transmettant lors de rapports sexuels non protégés
    paires:
      a: y
      b: w
      c: x
      d: z
  indices:
    relance: Repère d'abord la définition générale (contraception) et l'élément qui protège des deux risques à la fois (préservatif).
    methode: Distingue ensuite l'infection elle-même (IST) de l'action permettant de la détecter (dépistage).
    etape: Le préservatif est la seule méthode qui protège à la fois de la grossesse et des IST, contrairement aux autres
      méthodes contraceptives.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier IST et dépistage, souvent confondus.
  - si:
      diagnostic: associations_fausses
    relance: Reprends depuis le début en séparant la définition générale (contraception) de l'action de prévention (dépistage).
  solution: Contraception = méthodes pour éviter une grossesse non désirée ; IST = infection transmise lors de rapports non
    protégés ; Préservatif = protège à la fois de la grossesse et des IST ; Dépistage = permet de détecter une infection même
    sans symptôme.
- id: ordre-raisonnement-contraception
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique le raisonnement qui explique pourquoi on recommande d'associer pilule et préservatif
    dans certains cas.
  reponse:
    elements:
    - id: pilule-empeche-ovulation
      texte: La pilule contraceptive empêche l'ovulation et évite une grossesse non désirée
    - id: pilule-ne-protege-pas-ist
      texte: La pilule ne protège pas contre les infections sexuellement transmissibles
    - id: preservatif-protege-ist
      texte: Le préservatif, lui, protège contre les infections sexuellement transmissibles
    - id: association-double-protection
      texte: Associer les deux méthodes protège à la fois de la grossesse et des IST
  indices:
    relance: Le raisonnement part d'abord de ce que fait la pilule, puis de sa limite, avant d'introduire le préservatif.
    methode: Place d'abord l'action de la pilule sur l'ovulation, puis sa limite face aux IST, puis l'apport du préservatif,
      puis la conclusion sur la double protection.
    etape: La limite de la pilule (elle ne protège pas des IST) doit être énoncée avant que l'on explique l'intérêt du préservatif.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. La limite de la pilule est-elle énoncée avant ou après l'apport du préservatif
      ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce que fait la pilule et sa limite, puis ce qu'apporte le préservatif, avant la conclusion finale.
  solution: D'abord l'action de la pilule contre l'ovulation, puis sa limite face aux IST, puis la protection apportée par
    le préservatif contre les IST, puis la conclusion sur la double protection en associant les deux méthodes.
- id: expliquer-importance-depistage
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi le dépistage régulier des infections sexuellement transmissibles est important, même en l'absence
    de symptômes.
  criteres:
  - L'élève explique qu'une IST peut être présente et transmise sans provoquer de symptômes visibles.
  - L'élève relie le dépistage régulier à la possibilité de détecter une IST avant l'apparition de complications.
  - L'élève explique que le traitement précoce évite des complications graves et limite la transmission à d'autres personnes.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense au fait qu'une IST peut être présente sans se manifester clairement.
    methode: Commence par rappeler qu'une IST peut être asymptomatique, puis explique ce que permet le dépistage, avant de
      conclure sur les conséquences d'un dépistage tardif ou absent.
    etape: Une infection sans symptôme n'est pas forcément une infection sans risque ni sans possibilité de transmission.
  solution: Le dépistage régulier des infections sexuellement transmissibles est important car une IST peut être transmise
    et évoluer dans l'organisme sans provoquer de symptômes visibles pendant un certain temps. Une personne infectée peut
    donc ignorer qu'elle est porteuse de l'infection. Un dépistage régulier permet de détecter l'IST à temps, avant qu'elle
    n'entraîne des complications graves pour la santé, et permet aussi de la traiter rapidement pour éviter de la transmettre
    à d'autres personnes.
