    relance: 'Faux : les pesticides restent présents dans l''eau et les organismes vivants du milieu aquatique.'
  solution: 'Ils s''accumulent le long des chaînes alimentaires et deviennent plus concentrés chez les prédateurs. C''est
    exact : certains polluants chimiques non éliminés se bioaccumulent à chaque maillon et atteignent de fortes concentrations
    chez les grands prédateurs.'
- id: nblm-quelle-est-la-cause-principale-de-la-pro-5
  type: choix
  difficulte: 2
  enonce: Quelle est la cause principale de la prolifération anormale d'algues vertes dans les cours d'eau et sur les côtes
    ?
  reponse:
    options:
    - id: o1
      texte: La pollution de l'eau par un excès d'engrais apportés par les activités humaines.
    - id: o2
      texte: La baisse importante de la température de l'eau en période hivernale.
    - id: o3
      texte: L'introduction de nouveaux poissons carnivores dans les rivières.
    - id: o4
      texte: La baisse de la quantité de dioxyde de carbone dissous dans l'eau.
    bonnes:
    - o1
  indices:
    relance: Cherche quel produit utilisé en agriculture apporte des nutriments minéraux en excès dans l'eau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le froid ne stimule pas la prolifération végétale, qui nécessite de la lumière, de la chaleur
      et des nutriments.'
  - si:
      contient:
      - o3
    relance: 'Faux : la présence de poissons carnivores ne nourrit pas les algues marines ou d''eau douce.'
  - si:
      contient:
      - o4
    relance: 'Faux : le développement des plantes végétales nécessite au contraire de la matière minérale et du CO2.'
  solution: 'La pollution de l''eau par un excès d''engrais apportés par les activités humaines. C''est la bonne réponse :
    le rejet d''excès d''engrais (nutriments) dans les eaux stimule la multiplication incontrôlée des algues vertes.'
- id: nblm-quelles-sont-les-deux-actions-humaines-q-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux actions humaines qui permettent de limiter les impacts négatifs sur les écosystèmes ou de
