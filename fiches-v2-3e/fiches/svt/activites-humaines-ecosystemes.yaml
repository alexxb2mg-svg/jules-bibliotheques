format: 2
notion: activites-humaines-ecosystemes
version: 1
etat: verifiee
declencheurs:
- déforestation
- pollution des écosystèmes
- perte de biodiversité
- construction d'un parking sur une zone humide
- chaîne alimentaire perturbée
- agriculture intensive
prerequis:
- exploitation-ressources-naturelles
essentiel: 'Un écosystème est un ensemble formé par un milieu de vie (le biotope : eau, sol, climat…) et tous les êtres vivants
  qui y habitent et interagissent entre eux (la biocénose).


  Les activités humaines (agriculture intensive, déforestation, urbanisation, pêche, pollution, émission de gaz à effet de
  serre) peuvent modifier l''organisation et le fonctionnement des écosystèmes, parfois de façon rapide et importante.


  Ces impacts varient selon le rythme (une pollution ponctuelle ou continue), la nature (bénéfices ou nuisances pour l''écosystème),
  l''importance (locale ou globale) et la variabilité des actions humaines.


  Certains impacts sont directs et locaux (destruction d''un habitat par une construction), d''autres sont indirects et globaux
  (le réchauffement climatique modifie des écosystèmes très éloignés de la source des émissions de gaz à effet de serre).


  La biodiversité (diversité des espèces et des milieux) est particulièrement sensible à ces impacts : une perturbation d''un
  écosystème peut entraîner la disparition locale ou la raréfaction de certaines espèces.'
methode:
- Identifier le biotope (milieu physique) et la biocénose (êtres vivants) d'un écosystème étudié.
- Repérer l'activité humaine en cause et la manière dont elle modifie le milieu ou les interactions entre espèces.
- Distinguer un impact direct et local d'un impact indirect et global.
- Relier l'ampleur de l'impact à des critères comme le rythme, la nature (bénéfique/nuisible) et l'importance de l'action
  humaine.
vocabulaire:
- terme: biotope
  definition: le milieu physique d'un écosystème (eau, sol, climat) où vivent les êtres vivants
- terme: biocénose
  definition: l'ensemble des êtres vivants d'un écosystème qui interagissent entre eux
- terme: biodiversité
  definition: la diversité des espèces et des milieux vivants sur Terre
erreurs_frequentes:
- Croire que toute activité humaine est forcément nuisible à un écosystème (certaines pratiques agricoles ou de gestion peuvent
  être bénéfiques).
- Confondre écosystème (milieu + êtres vivants en interaction) et simple paysage.
- Penser que les impacts sur les écosystèmes sont toujours locaux, alors que certains sont globaux (climat).
- Ignorer les interactions en chaîne entre espèces d'un même écosystème lors de l'analyse d'un impact.
exemple:
  enonce: La déforestation d'une forêt tropicale pour l'agriculture modifie-t-elle seulement le biotope, ou aussi la biocénose
    ?
  solution: 'Elle modifie les deux : le biotope change (sol, climat local, disponibilité en eau) et la biocénose est bouleversée
    (disparition ou déplacement des espèces qui dépendaient de la forêt).'
exercices:
- id: composants-ecosysteme
  type: association
  difficulte: 1
  enonce: Associe chaque terme à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Biotope
    - id: b
      texte: Biocénose
    droite:
    - id: x
      texte: Le milieu physique (eau, sol, climat) d'un écosystème
    - id: y
      texte: L'ensemble des êtres vivants qui interagissent dans cet écosystème
    paires:
      a: x
      b: y
  indices:
    relance: Un des deux mots concerne le milieu physique, l'autre les êtres vivants eux-mêmes.
    methode: 'Compare les deux mots : « bio- » (vie) est commun, mais la fin du mot change de sens.'
    etape: Le biotope est la partie non vivante du milieu ; la biocénose regroupe les êtres vivants.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre le milieu physique et les êtres vivants.
  - si:
      diagnostic: associations_fausses
    relance: Le biotope, c'est l'eau, le sol, le climat ; la biocénose, ce sont les organismes qui y vivent.
  solution: Le biotope est le milieu physique de l'écosystème (eau, sol, climat) ; la biocénose est l'ensemble des êtres vivants
    qui y interagissent.
- id: choix-impact-local
  type: choix
  difficulte: 2
  enonce: Donner un exemple d'impact direct et local d'une activité humaine sur un écosystème.
  reponse:
    options:
    - id: a
      texte: La construction d'un parking qui détruit une zone humide
    - id: b
      texte: Les émissions mondiales de gaz à effet de serre
    - id: c
      texte: Le déplacement des courants océaniques à l'échelle planétaire
    bonnes:
    - a
  indices:
    relance: Pense à une action visible immédiatement, sur un site précis.
    methode: Élimine les réponses qui concernent une échelle mondiale ou planétaire.
    etape: Un impact local et direct se voit sur un site précis, sans passer par une chaîne de conséquences globales.
  pieges:
  - si:
      contient:
      - b
    relance: Les émissions de gaz à effet de serre ont un impact global, pas seulement local, car elles affectent le climat
      partout sur la planète.
  - si:
      contient:
      - c
    relance: Les courants océaniques concernent une échelle planétaire, pas un impact local direct.
  solution: La construction d'un parking qui détruit une zone humide et son écosystème local est un exemple d'impact direct
    et local.
- id: mot-impact-global
  type: texte_court
  difficulte: 2
  enonce: Quel phénomène global, causé par les émissions de gaz à effet de serre, affecte des écosystèmes partout sur la planète,
    même loin de la source des émissions ?
  reponse:
    acceptees:
    - réchauffement climatique
    - changement climatique
    fautes_tolerees: 2
  indices:
    relance: Pense à l'augmentation de la température moyenne de la Terre.
    methode: C'est un phénomène qui ne connaît pas de frontières et touche tous les écosystèmes, même éloignés des sources
      d'émission.
    etape: Ce phénomène est directement lié à l'augmentation des gaz à effet de serre dans l'atmosphère.
  pieges:
  - si:
      valeur: pollution locale
    relance: Une pollution locale reste limitée à une zone précise ; cherche plutôt un phénomène qui affecte le climat de
      toute la planète.
  solution: Le réchauffement climatique, où qu'il soit produit, contribue à modifier des écosystèmes partout sur la planète.
- id: ordre-chaine-consequences
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre logique pour expliquer comment une perturbation peut affecter des espèces non directement
    touchées par une activité humaine.
  reponse:
    elements:
    - id: activite
      texte: Une activité humaine perturbe une espèce ou son milieu
    - id: interaction
      texte: Cette espèce interagissait avec d'autres (chaîne alimentaire, pollinisation)
    - id: repercussion
      texte: Les espèces liées à elle subissent des répercussions en chaîne
    - id: consequence
      texte: L'équilibre de l'écosystème dans son ensemble est modifié
  indices:
    relance: Que doit-il se passer en premier pour que d'autres espèces soient touchées indirectement ?
    methode: Pars de l'action humaine initiale, puis suis les interactions entre espèces jusqu'à la conséquence globale.
    etape: La perturbation initiale vient en premier ; la modification de l'équilibre global de l'écosystème est la conséquence
      finale.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle des deux doit se produire avant l'autre dans cette chaîne d'effets
      ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par l'action humaine initiale et termine par la conséquence sur l'ensemble de l'écosystème.
  solution: Une activité humaine perturbe une espèce ou son milieu, cette espèce interagissait avec d'autres, les espèces
    liées subissent des répercussions en chaîne, l'équilibre de l'écosystème est modifié.
- id: developpement-impacts-ecosystemes
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique, avec un exemple local et un exemple global, comment les activités humaines
    peuvent modifier l''organisation et le fonctionnement des écosystèmes.'
  criteres:
  - L'élève définit correctement un écosystème (biotope + biocénose).
  - L'élève donne un exemple d'impact direct et local d'une activité humaine.
  - L'élève donne un exemple d'impact indirect et global (comme le réchauffement climatique).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense à la différence entre un impact visible immédiatement sur un site précis, et un impact qui touche toute
      la planète.
    methode: Choisis d'abord un exemple local (comme une construction), puis un exemple global (comme le climat).
    etape: Tu peux commencer ainsi « Un écosystème est formé d'un milieu de vie et des êtres vivants qui y interagissent...
      »
  solution: 'Un écosystème est formé d''un milieu de vie (le biotope) et des êtres vivants qui y interagissent (la biocénose).
    Les activités humaines peuvent modifier cet équilibre de plusieurs façons. Certains impacts sont directs et locaux : par
    exemple, la construction d''un parking détruit immédiatement une zone humide et l''écosystème qui y vivait. D''autres
    impacts sont indirects et globaux : les émissions de gaz à effet de serre, produites n''importe où sur la planète, contribuent
    au réchauffement climatique qui modifie des écosystèmes très éloignés de leur source. Ainsi, les activités humaines agissent
    sur les écosystèmes à des échelles très différentes, du site précis jusqu''à la planète entière.'
