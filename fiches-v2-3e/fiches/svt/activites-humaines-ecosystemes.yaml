    relance: 'Erreur fréquente : croire qu''un polluant se dilue toujours jusqu''à devenir inoffensif, alors que certains
      persistent et s''accumulent.'
  - si:
      contient:
      - o3
    relance: 'Faux : en consommant ces végétaux, les animaux herbivores puis les carnivores ingèrent également ces polluants.'
  - si:
