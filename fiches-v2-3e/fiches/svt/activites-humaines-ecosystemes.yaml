      texte: Aménager des corridors écologiques (trame verte et bleue) pour relier les milieux isolés.
    - id: o2
      texte: Réduire l'utilisation des pesticides et lutter contre la propagation des espèces envahissantes.
    - id: o3
      texte: Assécher l'ensemble des zones humides pour faciliter l'extension des cultures.
    - id: o4
      texte: Multiplier les routes sans passages à faune à travers les massifs forestiers.
