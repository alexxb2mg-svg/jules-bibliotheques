format: 2
notion: activites-humaines-ecosystemes
version: 2
etat: verifiee
declencheurs:
- espèce invasive
- déforestation
- corridor écologique
- destruction des habitats
- pesticides dans les rivières
- algues vertes
- biodiversité qui diminue
- introduire une espèce
- milieu naturel détruit
prerequis:
- 4e-impacts-activites-humaines-ecosystemes
essentiel: 'Un écosystème, c''est un milieu de vie et l''ensemble des êtres vivants qui y vivent, reliés entre eux (relations
  alimentaires, pollinisation, abri…) et avec leur milieu.


  Les activités humaines peuvent modifier l''organisation et le fonctionnement des écosystèmes :

  - destruction et fragmentation des habitats (déforestation, urbanisation, routes, assèchement des zones humides) : les espèces
  perdent leur lieu de vie, les populations sont isolées ;

  - pollutions (pesticides, excès d''engrais, plastiques, marées noires) ; certains polluants s''accumulent le long des chaînes
  alimentaires et sont plus concentrés chez les prédateurs ;

  - introduction d''espèces venues d''ailleurs, qui peuvent devenir envahissantes et éliminer des espèces locales ;

  - surexploitation (surpêche, chasse excessive) et changement climatique.


  Comme les êtres vivants sont reliés, toucher une espèce en touche d''autres : la disparition d''insectes prive les oiseaux
  insectivores de nourriture et les fleurs de pollinisateurs. La biodiversité diminue et l''écosystème rend moins de services
  (pollinisation, épuration de l''eau, sols fertiles).


  L''impact d''une activité dépend de sa nature (bénéfices ou nuisances), de son importance, de son rythme (une transformation
  rapide ne laisse pas aux espèces le temps de s''adapter) et de sa variabilité.


  Certaines actions humaines limitent ces impacts ou réparent les milieux : aires protégées, haies et corridors écologiques
  (trames vertes et bleues) qui relient les milieux, réduction des pesticides, lutte contre les espèces envahissantes, restauration
  des zones humides.


  Quelques questions environnementales globales à relier : la perte de biodiversité, le changement climatique, la pollution
  des eaux et des sols, l''épuisement de milieux comme les forêts ou les zones humides.


  Au brevet : on analyse un document (texte, graphique, schéma de chaîne alimentaire) pour montrer comment une activité modifie
  l''écosystème, en suivant les liens entre espèces, puis on propose une mesure et on discute ses bénéfices et ses nuisances.

  '
methode:
- Identifier l'activité humaine et le changement qu'elle provoque dans le milieu (habitat, eau, sol, espèces présentes).
- 'Suivre les relations entre êtres vivants : quelles espèces dépendent de celle qui est touchée ?'
- Comparer avec une situation témoin (un milieu voisin sans cette activité) pour être sûr de la cause.
- Peser les bénéfices et les nuisances, et tenir compte du rythme et de l'importance de l'activité.
- Proposer une mesure qui réduit l'impact ou répare le milieu.
vocabulaire:
- terme: Écosystème
  definition: Milieu de vie et ensemble des êtres vivants qui y vivent, avec leurs relations.
- terme: Biodiversité
  definition: 'Diversité du vivant : diversité des écosystèmes, des espèces et des individus au sein d''une espèce.'
- terme: Espèce invasive
  definition: Espèce introduite par l'être humain hors de son milieu d'origine, qui se multiplie et nuit aux espèces locales.
- terme: Fragmentation
  definition: Découpage d'un milieu en morceaux isolés, par des routes ou des villes par exemple.
- terme: Corridor écologique
  definition: Passage (haie, bande boisée, cours d'eau) qui relie des milieux et permet aux espèces de circuler.
- terme: Chaîne alimentaire
  definition: Suite d'êtres vivants où chacun mange le précédent (plancton, petit poisson, gros poisson).
- terme: Pollution
  definition: Présence dans le milieu de substances nuisibles rejetées par des activités humaines (pesticides, engrais, plastiques).
erreurs_frequentes:
- 'Croire qu''une activité humaine ne touche qu''une seule espèce : dans un écosystème, les êtres vivants sont liés.'
- 'Croire que toutes les actions humaines sont néfastes : certaines protègent ou restaurent les milieux.'
- Conclure trop vite sur la cause d'un changement sans situation de comparaison (témoin).
- 'Croire qu''un polluant se dilue toujours : certains s''accumulent et se concentrent chez les prédateurs.'
exemple:
  enonce: On construit une autoroute au milieu d'une forêt. Quelles conséquences pour les animaux de la forêt, et quelle mesure
    peut les limiter ?
  solution: 'La forêt est coupée en deux : c''est une fragmentation de l''habitat. Les animaux ne peuvent plus circuler d''un
    côté à l''autre, beaucoup meurent en traversant, et les populations isolées deviennent plus petites et plus fragiles.
    On peut construire des passages à faune (ponts végétalisés, tunnels) qui servent de corridors écologiques.'
exercices:
- id: espece-venue-d-ailleurs
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une espèce introduite par l'être humain loin de son milieu d'origine, qui se multiplie fortement
    et nuit aux espèces locales ?
  reponse:
    acceptees:
    - espèce invasive
    - espèce envahissante
    - espèce exotique envahissante
    - invasive
    - envahissante
    - espèces invasives
    - espèces envahissantes
    fautes_tolerees: 1
  indices:
    relance: Cette espèce arrive d'ailleurs et prend toute la place. Quel adjectif, qui ressemble à « envahir », utilise-t-on
      pour la décrire ?
    methode: 'Pense à ce que fait une armée qui entre dans un pays et l''occupe : on dit qu''elle l''envahit. Cherche l''adjectif
      qui en vient.'
    etape: On dit une espèce « exotique en… », avec un adjectif formé sur le verbe envahir.
  pieges:
  - si:
      valeur: espèce protégée
    relance: 'Une espèce protégée est une espèce qu''on cherche à sauver. Ici, l''espèce nuit aux autres : quel mot la décrit
      ?'
  - si:
      valeur: espèce endémique
    relance: Une espèce endémique vit seulement dans une région, depuis toujours. On cherche une espèce venue d'ailleurs qui
      se multiplie trop.
  - si:
      valeur: prédateur
    relance: 'Elle peut être un prédateur, mais pas forcément : c''est parfois une plante. Quel mot dit qu''elle vient d''ailleurs
      et prend toute la place ?'
  solution: 'Une espèce invasive (on dit aussi espèce exotique envahissante) : introduite par l''être humain, elle se multiplie
    sans être contrôlée et nuit aux espèces locales, comme le frelon asiatique en France.'
- id: pesticide-et-insectes
  type: choix
  difficulte: 1
  enonce: Dans un écosystème, un pesticide fait disparaître presque tous les insectes. Quelles conséquences sont possibles
    ?
  reponse:
    options:
    - id: a
      texte: Les oiseaux qui mangent des insectes manquent de nourriture.
    - id: b
      texte: Des plantes à fleurs sont moins bien pollinisées.
    - id: c
      texte: Aucune, car les insectes ne servent à rien dans un écosystème.
    - id: d
      texte: Seuls les insectes sont touchés, les autres êtres vivants ne changent pas.
    bonnes:
    - a
    - b
  indices:
    relance: Quels êtres vivants dépendent des insectes, pour se nourrir ou pour se reproduire ?
    methode: 'Dessine les relations : qui mange les insectes ? Qui a besoin d''eux pour transporter son pollen ?'
    etape: Pense à une mésange qui nourrit ses petits avec des chenilles. Que se passe-t-il si les chenilles disparaissent
      ? Cherche ensuite un autre lien.
  pieges:
  - si:
      contient:
      - c
    relance: Les insectes sont mangés par d'autres animaux et transportent le pollen des fleurs. Servent-ils vraiment à rien
      ?
  - si:
      contient:
      - d
    relance: Dans un écosystème, les êtres vivants sont reliés. Si une espèce disparaît, que deviennent celles qui en dépendent
      ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une conséquence. Il y en a une autre, liée au rôle des insectes auprès des fleurs.
  solution: 'Les réponses a et b : les êtres vivants d''un écosystème sont reliés. Sans insectes, les oiseaux insectivores
    manquent de nourriture et les plantes à fleurs sont moins pollinisées, donc produisent moins de fruits et de graines.'
- id: activites-et-effets
  type: association
  difficulte: 2
  enonce: Associe chaque activité humaine à son effet principal sur l'écosystème.
  reponse:
    gauche:
    - id: a
      texte: Construire une autoroute à travers une forêt
    - id: b
      texte: Relâcher dans la nature un animal exotique de compagnie
    - id: c
      texte: Épandre beaucoup d'engrais près d'une rivière
    - id: d
      texte: Planter des haies entre les champs
    droite:
    - id: p
      texte: Coupe le milieu en morceaux et isole des populations
    - id: q
      texte: Introduit une espèce qui peut devenir envahissante
    - id: r
      texte: Fait proliférer les algues dans l'eau, qui finit par manquer de dioxygène
    - id: s
      texte: Offre abri et nourriture et relie des milieux entre eux
    paires:
      a: p
      b: q
      c: r
      d: s
  indices:
    relance: Parmi ces activités, laquelle a un effet plutôt bénéfique pour les êtres vivants ?
    methode: 'Pour chaque activité, demande-toi ce qu''elle change : l''espace disponible, les espèces présentes, ou la qualité
      de l''eau ?'
    etape: Une autoroute est une barrière que les animaux ont du mal à franchir. Continue avec les trois autres activités.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Presque ! Une seule association est fausse. Relis ce que les engrais apportent aux algues d'une rivière.
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'activité bénéfique, puis relie les engrais à l'eau, et l'animal relâché à l'arrivée d'une nouvelle
      espèce.
  solution: L'autoroute fragmente le milieu ; l'animal exotique relâché peut devenir une espèce envahissante ; l'excès d'engrais
    fait proliférer les algues puis manquer de dioxygène dans l'eau ; les haies offrent abri et nourriture et relient les
    milieux.
- id: engrais-et-riviere
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes qui mènent à la mort de poissons dans une rivière, après un excès d'engrais dans
    les champs voisins.
  reponse:
    elements:
    - id: a
      texte: La pluie entraîne l'excès d'engrais jusqu'à la rivière
    - id: b
      texte: Les algues, très bien nourries, se multiplient fortement
    - id: c
      texte: Les algues meurent et sont décomposées par des bactéries qui consomment beaucoup de dioxygène
    - id: d
      texte: L'eau manque de dioxygène et les poissons meurent
  indices:
    relance: Comment l'engrais épandu dans un champ arrive-t-il jusqu'à la rivière ?
    methode: 'Suis la chaîne : l''engrais nourrit des êtres vivants, ces êtres vivants meurent, leur décomposition change
      la composition de l''eau.'
    etape: Un engrais fait pousser les plantes. Dans la rivière, quels êtres vivants chlorophylliens vont en profiter ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Les bactéries peuvent-elles décomposer les algues avant que celles-ci
      se soient multipliées et soient mortes ?
  - si:
      diagnostic: ordre_faux
    relance: Pars du champ et termine par les poissons. Chaque étape est la cause de la suivante.
  solution: La pluie entraîne l'engrais jusqu'à la rivière ; les algues se multiplient fortement ; en mourant, elles sont
    décomposées par des bactéries qui consomment beaucoup de dioxygène ; l'eau manque de dioxygène et les poissons meurent.
- id: polluant-qui-s-accumule
  type: nombre
  difficulte: 2
  enonce: Dans ce document, la concentration d'un polluant (en unités arbitraires) est de 2 dans le plancton, de 20 dans les
    petits poissons qui mangent ce plancton, et de 200 dans les gros poissons qui mangent les petits. Par combien la concentration
    est-elle multipliée entre le plancton et les gros poissons ? Écris seulement le nombre.
  reponse:
    valeur: 100
    forme: libre
  indices:
    relance: On cherche combien de fois la concentration des gros poissons est plus grande que celle du plancton. Quelle opération
      utiliser ?
    methode: Pour savoir par combien une valeur est multipliée, on divise la valeur d'arrivée par la valeur de départ.
    etape: Entre le plancton et les petits poissons, la concentration est multipliée par 20 ÷ 2. Fais maintenant le calcul
      entre le plancton et les gros poissons.
  pieges:
  - si:
      valeur: 198
    relance: 'Tu as calculé une différence. La question demande par combien la concentration est multipliée : quelle opération
      faut-il ?'
  - si:
      valeur: 10
    relance: C'est vrai pour un seul maillon de la chaîne. Mais entre le plancton et les gros poissons, il y a deux maillons.
  solution: '200 ÷ 2 = 100. La concentration est multipliée par 100 entre le plancton et les gros poissons : le polluant s''accumule
    le long de la chaîne alimentaire et touche surtout les prédateurs.'
- id: chats-sur-une-ile
  type: ouverte
  difficulte: 3
  enonce: 'Document : sur une île, des chats ont été introduits par des humains. Avant leur arrivée, une espèce d''oiseau
    qui fait son nid au sol était nombreuse. Vingt ans plus tard, cette espèce est devenue rare. Sur une île voisine, où il
    n''y a pas de chats, la même espèce d''oiseau est restée nombreuse. Explique le rôle probable de l''activité humaine dans
    l''évolution de cette population d''oiseaux, en utilisant la comparaison entre les deux îles, puis propose une mesure.'
  criteres:
  - 'L''élève utilise la comparaison entre les deux îles : l''île sans chats sert de témoin, ce qui montre que les chats sont
    la cause probable du déclin.'
  - 'L''élève explique la relation de prédation : les chats mangent les oiseaux, leurs œufs ou leurs petits, faciles à atteindre
    dans des nids au sol ; l''introduction par l''être humain a modifié l''écosystème.'
  - L'élève propose une mesure réaliste (contrôler ou retirer les chats, protéger les zones de nidification, interdire de
    nouvelles introductions).
  indices:
    relance: Qu'est-ce qui est différent entre les deux îles ? Et qu'est-ce qui est pareil ?
    methode: Décris ce qui a changé sur la première île, compare avec l'île témoin, puis explique la relation entre les chats
      et les oiseaux.
    etape: 'Un oiseau qui fait son nid au sol : que risquent ses œufs et ses petits s''il y a des chats sur l''île ?'
  solution: 'Sur l''île sans chats, les oiseaux restent nombreux ; sur l''île où des humains ont introduit des chats, ils
    sont devenus rares. La seule différence étant la présence des chats, ce sont probablement eux la cause : ce sont des prédateurs
    qui mangent les oiseaux, leurs œufs et leurs petits, très faciles à atteindre dans des nids au sol. L''activité humaine
    (l''introduction des chats) a donc modifié l''écosystème de l''île. On peut contrôler ou retirer les chats, protéger les
    zones de nids et interdire d''introduire de nouveaux animaux sur l''île.'
- id: limiter-les-impacts
  type: choix
  difficulte: 2
  enonce: Parmi ces actions, lesquelles permettent de limiter l'impact des activités humaines sur un écosystème ?
  reponse:
    options:
    - id: a
      texte: Créer des haies et des corridors qui relient des milieux isolés.
    - id: b
      texte: Assécher une zone humide pour construire un parking.
    - id: c
      texte: Réduire l'usage de pesticides dans les champs.
    - id: d
      texte: Lâcher dans la nature des animaux venus d'un autre continent.
    bonnes:
    - a
    - c
  indices:
    relance: Pour chaque action, demande-toi si elle protège les êtres vivants du milieu ou si elle leur fait perdre leur
      habitat.
    methode: Relis dans le cours les mesures qui réduisent les impacts et celles qui provoquent des destructions ou des invasions.
    etape: 'Commence par l''action b : que devient l''habitat des espèces qui vivent dans une zone humide ?'
  pieges:
  - si:
      contient:
      - b
    relance: 'Assécher une zone humide détruit l''habitat de nombreuses espèces : c''est une cause d''impact, pas une solution.'
  - si:
      contient:
      - d
    relance: Introduire des espèces venues d'ailleurs peut éliminer des espèces locales. Est-ce une mesure de protection ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une mesure utile, mais une autre l'est aussi. Regarde ce qui relie les milieux, ou ce qu'on épand
      dans les champs.
  solution: 'a et c limitent les impacts : les corridors relient les milieux, moins de pesticides réduit la pollution. b détruit
    un habitat et d risque de créer une espèce envahissante.'
- id: surface-de-foret
  type: nombre
  difficulte: 2
  enonce: Dans ce document, une forêt occupe 200 hectares. À cause du défrichement pour des cultures, elle perd 15 % de sa
    surface. Combien d'hectares de forêt reste-t-il ? Écris seulement le nombre.
  reponse:
    valeur: 170
    forme: libre
  indices:
    relance: Commence par calculer combien d'hectares représentent 15 % de la surface, puis retire-les.
    methode: 15 % de 200 = 200 × 15 ÷ 100. Soustrais ce résultat à la surface de départ.
    etape: Calcule 200 × 15 ÷ 100, puis retranche le résultat à 200.
  pieges:
  - si:
      valeur: 30
    relance: Tu as calculé la surface perdue. La question demande ce qu'il reste.
  - si:
      valeur: 230
    relance: Tu as ajouté la surface perdue au lieu de la retirer. La forêt rétrécit.
  solution: 15 % de 200 = 200 × 15 ÷ 100 = 30 hectares perdus. Il reste 200 − 30 = 170 hectares. L'habitat des espèces de
    la forêt a diminué d'autant.
- id: nblm-quel-est-l-impact-principal-de-la-defore-1
  type: choix
  difficulte: 2
  enonce: Quel est l'impact principal de la déforestation et de l'urbanisation sur les milieux de vie animaux ?
  reponse:
    options:
    - id: o1
      texte: Elles entraînent la destruction et la fragmentation des habitats, isolant les populations.
    - id: o2
      texte: Elles permettent aux animaux de multiplier leurs ressources alimentaires sans altérer le milieu.
    - id: o3
      texte: Elles n'affectent que la végétation sans modifier les chaînes alimentaires animales.
    - id: o4
      texte: Elles augmentent la biodiversité globale en créant de grands espaces vides.
    bonnes:
    - o1
  indices:
    relance: Pense aux conséquences de la perte du milieu de vie et au morcellement du territoire pour la faune.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la destruction d''habitat prive au contraire les animaux de leur abri et de leur nourriture.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : croire qu''une action ne touche qu''une seule espèce alors que tous les êtres vivants d''un
      écosystème sont reliés.'
  - si:
      contient:
      - o4
    relance: 'Faux : la perte des habitats provoque le déclin de la biodiversité locale.'
  solution: 'Elles entraînent la destruction et la fragmentation des habitats, isolant les populations. C''est exact : la
    déforestation détruit le milieu de vie et sépare les populations en groupes isolés qui ne peuvent plus interagir.'
- id: nblm-comment-definit-on-une-espece-invasive-a-2
  type: choix
  difficulte: 2
  enonce: Comment définit-on une espèce invasive au sein d'un écosystème ?
  reponse:
    options:
    - id: o1
      texte: Une espèce introduite par l'être humain hors de son milieu d'origine, qui se multiplie et nuit aux espèces locales.
    - id: o2
      texte: Une espèce locale dont la population augmente temporairement après un hiver doux.
    - id: o3
      texte: Un micro-organisme présent naturellement dans le sol d'une forêt.
    - id: o4
      texte: Un animal qui réalise des migrations saisonnières entre plusieurs continents.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'origine de cette espèce et à son impact sur les organismes déjà présents dans le milieu.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : une espèce invasive est obligatoirement introduite par l''être humain hors de son milieu
      d''origine.'
  - si:
      contient:
      - o3
    relance: 'Faux : les micro-organismes locaux font partie de l''écosystème naturel et ne sont pas des espèces exogènes
      invasives.'
  - si:
      contient:
      - o4
    relance: 'Faux : la migration est un comportement naturel, pas une invasion biologique consécutive à une introduction
      humaine.'
  solution: 'Une espèce introduite par l''être humain hors de son milieu d''origine, qui se multiplie et nuit aux espèces
    locales. C''est la définition exacte : l''introduction hors de son milieu d''origine provoque une prolifération au détriment
    de la biodiversité locale.'
- id: nblm-quel-est-le-role-principal-d-un-corridor-3
  type: choix
  difficulte: 2
  enonce: Quel est le rôle principal d'un corridor écologique comme une haie ou une bande boisée ?
  reponse:
    options:
    - id: o1
      texte: Relier des milieux isolés pour permettre aux espèces de circuler entre eux.
    - id: o2
      texte: Bloquer totalement le déplacement des animaux pour protéger les récoltes.
    - id: o3
      texte: Éliminer automatiquement toutes les espèces végétales invasives du secteur.
    - id: o4
      texte: Assécher les zones humides pour construire de nouvelles voies routières.
    bonnes:
    - o1
  indices:
    relance: Pense à une structure végétale qui sert de pont ou de voie de passage entre plusieurs espaces naturels.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le corridor vise au contraire à faciliter le passage et la circulation de la faune.'
  - si:
      contient:
      - o3
    relance: 'Faux : les corridors servent de voie de passage pour la biodiversité, ils n''éradiquent pas directement les
      espèces invasives.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''assèchement des zones humides détruit des habitats, ce qui s''oppose à la démarche d''aménagement
      écologique.'
  solution: 'Relier des milieux isolés pour permettre aux espèces de circuler entre eux. C''est juste : le corridor écologique
    recrée une continuité spatiale entre des fragments d''habitats séparés.'
- id: nblm-que-deviennent-les-pesticides-deverses-d-4
  type: choix
  difficulte: 2
  enonce: Que deviennent les pesticides déversés dans les rivières lorsqu'ils entrent dans les réseaux alimentaires ?
  reponse:
    options:
    - id: o1
      texte: Ils s'accumulent le long des chaînes alimentaires et deviennent plus concentrés chez les prédateurs.
    - id: o2
      texte: Ils se diluent entièrement dans l'eau et disparaissent sans aucun effet toxique.
    - id: o3
      texte: Ils sont absorbés uniquement par les plantes aquatiques sans jamais passer aux animaux.
    - id: o4
      texte: Ils s'évaporent instantanément dans l'atmosphère sous forme d'eau pure.
    bonnes:
    - o1
  indices:
    relance: Considère le cheminement des produits toxiques lorsqu'un animal consomme une proie contaminée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
