format: 2
notion: monde-microbien-immunite
version: 1
etat: verifiee
declencheurs:
- microbes dans le corps
- bactéries utiles digestion
- vaccination comment ça marche
- antibiotique résistance bactérienne
- hygiène et maladies
- lavage des mains microbe
prerequis: []
essentiel: 'L''organisme humain héberge en permanence une grande diversité de micro-organismes (bactéries surtout, mais aussi
  d''autres micro-organismes), dont beaucoup sont utiles ou inoffensifs et participent au fonctionnement de l''organisme (par
  exemple dans la digestion).


  Certains micro-organismes sont pathogènes : ils peuvent provoquer des maladies infectieuses en se multipliant dans l''organisme
  et en perturbant son fonctionnement.


  Face à ces micro-organismes pathogènes, l''organisme dispose de réactions immunitaires qui permettent de les détecter et
  de les éliminer, pour préserver son fonctionnement.


  Les mesures d''hygiène (lavage des mains, désinfection) limitent le contact avec des micro-organismes pathogènes ; la vaccination
  prépare le système immunitaire à réagir plus vite et plus efficacement en cas d''infection réelle ; les antiseptiques et
  les antibiotiques aident à lutter contre une infection déjà présente (les antibiotiques ciblant spécifiquement les bactéries).


  L''usage excessif ou inapproprié des antibiotiques favorise l''apparition de bactéries résistantes, contre lesquelles ces
  médicaments deviennent inefficaces : c''est un enjeu majeur de santé publique actuel.'
methode:
- Distinguer micro-organismes utiles ou inoffensifs et micro-organismes pathogènes.
- Relier chaque mesure de lutte (hygiène, vaccination, antiseptique, antibiotique) à son mode d'action et à son moment d'utilisation
  (avant ou après une infection).
- Retenir que les antibiotiques ciblent spécifiquement les bactéries, pas les virus.
- Expliquer pourquoi un usage excessif des antibiotiques favorise l'apparition de résistances bactériennes.
vocabulaire:
- terme: pathogène
  definition: qualifie un micro-organisme capable de provoquer une maladie infectieuse
- terme: résistance bactérienne
  definition: capacité d'une bactérie à survivre à un antibiotique qui était auparavant efficace contre elle
erreurs_frequentes:
- Croire que tous les micro-organismes présents dans le corps sont dangereux.
- Confondre vaccination (prévention, avant l'infection) et antibiotique (traitement, après l'infection).
- Penser que les antibiotiques sont efficaces contre les virus (ils n'agissent que sur les bactéries).
- Ignorer les conséquences d'un usage excessif des antibiotiques (résistance bactérienne).
exemple:
  enonce: Pourquoi un médecin ne prescrit-il pas d'antibiotique contre une simple grippe (une maladie virale) ?
  solution: 'Les antibiotiques agissent spécifiquement contre les bactéries, pas contre les virus : ils seraient inefficaces
    contre la grippe, qui est due à un virus, et leur usage inutile favorise en plus l''apparition de bactéries résistantes.'
exercices:
- id: cible-antibiotique
  type: texte_court
  difficulte: 1
  enonce: Sur quel type de micro-organisme les antibiotiques agissent-ils spécifiquement ?
  reponse:
    acceptees:
    - bactérie
    - les bactéries
    - bactéries
    fautes_tolerees: 1
  indices:
    relance: Ce ne sont pas les virus, comme celui de la grippe.
    methode: Relis l'exemple de ta leçon sur le médecin qui ne prescrit pas d'antibiotique contre une grippe.
    etape: Les antibiotiques n'ont aucun effet sur les virus, seulement sur cette autre catégorie de micro-organismes.
  pieges:
  - si:
      valeur: virus
    relance: Les antibiotiques n'agissent justement pas sur les virus ; ils ciblent une autre catégorie de micro-organismes.
  solution: Les antibiotiques agissent spécifiquement contre les bactéries.
- id: vaccination-vs-antibiotique
  type: choix
  difficulte: 2
  enonce: Quelle affirmation décrit correctement la différence entre vaccination et antibiotique ?
  reponse:
    options:
    - id: a
      texte: La vaccination traite une infection déjà présente, l'antibiotique la prévient
    - id: b
      texte: La vaccination prépare le système immunitaire avant une infection, l'antibiotique traite une infection bactérienne
        déjà présente
    - id: c
      texte: Les deux préviennent une infection avant qu'elle n'apparaisse
    - id: d
      texte: Les deux traitent uniquement les infections virales
    bonnes:
    - b
  indices:
    relance: L'un agit avant l'infection (prévention), l'autre après (traitement).
    methode: Repense au moment d'utilisation de chaque mesure par rapport à l'infection.
    etape: La vaccination est utilisée avant une éventuelle infection ; l'antibiotique, lui, traite une infection bactérienne
      déjà présente.
  pieges:
  - si:
      contient:
      - a
    relance: 'C''est l''inverse de la réalité : c''est la vaccination qui agit avant l''infection, pas l''antibiotique.'
  - si:
      contient:
      - d
    relance: Les antibiotiques n'agissent que contre les bactéries, pas contre les virus.
  solution: La vaccination prépare le système immunitaire avant une éventuelle infection (prévention), tandis que l'antibiotique
    traite une infection bactérienne déjà présente (traitement curatif).
- id: associer-mesures-lutte
  type: association
  difficulte: 2
  enonce: Relie chaque mesure à sa description.
  reponse:
    gauche:
    - id: a
      texte: Mesure d'hygiène
    - id: b
      texte: Vaccination
    - id: c
      texte: Antibiotique
    - id: d
      texte: Résistance bactérienne
    droite:
    - id: x
      texte: Prépare le système immunitaire avant une infection réelle
    - id: y
      texte: Limite le contact avec des micro-organismes pathogènes
    - id: z
      texte: Bactérie devenue insensible à un médicament auparavant efficace
    - id: w
      texte: Traite une infection bactérienne déjà présente
    paires:
      a: y
      b: x
      c: w
      d: z
  indices:
    relance: Repère d'abord les deux mesures préventives (hygiène, vaccination), puis les deux notions liées au traitement
      ou à ses limites.
    methode: Distingue la vaccination (prépare avant l'infection) de l'antibiotique (traite après l'infection).
    etape: La résistance bactérienne n'est pas une mesure de lutte, mais une conséquence d'un usage excessif d'antibiotiques.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier vaccination et antibiotique, souvent confondus sur leur
      moment d'action.
  - si:
      diagnostic: associations_fausses
    relance: Reprends depuis le début en distinguant les mesures préventives des mesures curatives.
  solution: Mesure d'hygiène = limite le contact avec les pathogènes ; Vaccination = prépare le système immunitaire avant
    l'infection ; Antibiotique = traite une infection bactérienne déjà présente ; Résistance bactérienne = bactérie devenue
    insensible à un médicament.
- id: ordre-usage-excessif-antibiotiques
  type: ordre
  difficulte: 3
  enonce: Range les étapes qui expliquent comment un usage excessif d'antibiotiques favorise l'apparition de bactéries résistantes.
  reponse:
    elements:
    - id: usage-repete
      texte: Les antibiotiques sont utilisés de façon répétée et parfois inappropriée
    - id: survivantes
      texte: Quelques bactéries résistantes par hasard survivent au traitement
    - id: multiplication
      texte: Ces bactéries résistantes se multiplient sans être éliminées par l'antibiotique
    - id: inefficacite
      texte: L'antibiotique devient inefficace contre cette population de bactéries devenue résistante
  indices:
    relance: Le point de départ est toujours l'usage répété de l'antibiotique, avant l'apparition d'une résistance généralisée.
    methode: Place d'abord l'usage répété, puis la survie de quelques bactéries résistantes, puis leur multiplication, puis
      la conséquence finale sur l'efficacité du traitement.
    etape: Les bactéries résistantes survivent d'abord en petit nombre, avant de se multiplier davantage.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. La survie de quelques bactéries résistantes a-t-elle lieu avant ou après
      leur multiplication ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la cause initiale (usage répété) et la conséquence finale (inefficacité du traitement), puis place
      les deux étapes intermédiaires.
  solution: D'abord l'usage répété et inapproprié des antibiotiques, puis la survie de quelques bactéries résistantes, puis
    leur multiplication, puis l'inefficacité de l'antibiotique contre cette population résistante.
- id: expliquer-enjeu-resistance
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi l'usage répété et inapproprié des antibiotiques pose un problème de santé publique, en utilisant
    la notion de sélection de bactéries résistantes.
  criteres:
  - L'élève explique que l'usage répété d'antibiotiques favorise la survie de bactéries résistantes par hasard.
  - L'élève relie cette survie sélective à la multiplication progressive des bactéries résistantes dans la population.
  - L'élève conclut que certaines infections bactériennes deviennent alors plus difficiles à traiter.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense à ce qui arrive aux bactéries qui survivent à un traitement répété.
    methode: Commence par rappeler comment quelques bactéries résistantes peuvent survivre, puis explique leur multiplication,
      avant de conclure sur les conséquences pour la santé publique.
    etape: Les bactéries qui survivent à un traitement sont justement celles qui résistent le mieux à l'antibiotique utilisé.
  solution: L'usage répété et inapproprié des antibiotiques pose un problème de santé publique car il favorise la sélection
    de bactéries résistantes. Lors d'un traitement, quelques bactéries résistantes par hasard survivent à l'antibiotique,
    alors que les autres bactéries sont éliminées. Ces bactéries résistantes se multiplient alors plus facilement, sans être
    limitées par l'antibiotique devenu inefficace contre elles. Au fil des traitements répétés, la proportion de bactéries
    résistantes augmente, ce qui rend certaines infections bactériennes plus difficiles, voire impossibles à traiter avec
    les antibiotiques disponibles.
