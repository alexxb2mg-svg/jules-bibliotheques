format: 2
notion: monde-microbien-immunite
version: 2
etat: generee
declencheurs:
- microbiote intestinal
- résistance aux antibiotiques
- bactéries résistantes
- antiseptique
- lavage des mains
- bactéries et virus
- vaccin contre la grippe
- microbes de l'intestin
prerequis:
- 4e-monde-microbien-immunite
essentiel: |
  Les micro-organismes (bactéries, virus, champignons microscopiques) sont partout : dans l'air, l'eau, le sol, sur la peau et dans notre intestin. Notre organisme héberge un très grand nombre de bactéries, surtout dans l'intestin : c'est le microbiote. La plupart ne sont pas dangereuses et sont même utiles (elles aident à digérer certaines fibres, produisent des vitamines, occupent la place face aux microbes pathogènes).

  Seuls certains micro-organismes sont pathogènes : ils provoquent des maladies. La contamination est leur entrée dans l'organisme (plaie, voies respiratoires, aliments…). L'infection est leur multiplication dans l'organisme. La peau et les muqueuses forment une première barrière ; si elle est franchie, le système immunitaire réagit.

  Pour limiter la contamination : mesures d'hygiène (lavage des mains, cuisson des aliments), antiseptiques (produits appliqués sur la peau ou une plaie, qui tuent les microbes à l'extérieur du corps). La vaccination prépare le système immunitaire à reconnaître un microbe précis sans provoquer la maladie.

  Pour soigner une infection bactérienne : les antibiotiques tuent les bactéries ou bloquent leur multiplication dans l'organisme. Ils sont sans effet sur les virus (grippe, rhume…).

  Les bactéries évoluent. Par hasard, certaines portent une mutation qui les rend résistantes à un antibiotique. Quand on utilise cet antibiotique, les bactéries sensibles meurent et les résistantes survivent et se multiplient. C'est pourquoi on n'utilise un antibiotique que sur prescription médicale, et pendant toute la durée prescrite.

  Réaction immunitaire : quand un microbe pathogène franchit les barrières, des globules blancs (leucocytes) le détruisent. Certains fabriquent des anticorps, des molécules qui reconnaissent un microbe précis. Après une première rencontre, l'organisme garde une mémoire : il réagit plus vite et plus fort la fois suivante. Le vaccin utilise ce principe : il contient un microbe modifié ou des morceaux de microbe, sans provoquer la maladie.

  Au brevet : on demande de choisir le bon moyen de lutte (hygiène, antiseptique, vaccin, antibiotique) selon la situation, d'expliquer la résistance aux antibiotiques à partir d'un document, et de montrer que tous les microbes ne sont pas dangereux.
methode:
- Identifier le type de micro-organisme en jeu (bactérie ou virus) avant de choisir un moyen de lutte.
- Distinguer prévenir (hygiène, antiseptique, vaccination) et soigner (antibiotique contre les bactéries).
- Distinguer contamination (entrée du microbe) et infection (multiplication dans le corps).
- 'Pour un document sur la résistance : comparer la population de bactéries avant et après l''antibiotique.'
- 'Pour une question sur l''immunité : décrire la réaction dans l''ordre (barrière franchie, globules blancs, anticorps, mémoire).'
vocabulaire:
- terme: microbiote
  definition: Ensemble des micro-organismes qui vivent normalement dans ou sur notre corps, surtout dans l'intestin.
- terme: pathogène
  definition: Se dit d'un micro-organisme capable de provoquer une maladie.
- terme: antiseptique
  definition: Produit appliqué sur la peau ou une plaie qui tue les microbes à l'extérieur du corps.
- terme: antibiotique
  definition: Médicament qui tue les bactéries ou bloque leur multiplication ; inefficace contre les virus.
- terme: Contamination
  definition: Entrée d'un micro-organisme dans l'organisme (plaie, voies respiratoires, aliments).
- terme: Infection
  definition: Multiplication d'un micro-organisme dans l'organisme.
- terme: Vaccin
  definition: Préparation qui apprend au système immunitaire à reconnaître un microbe précis sans provoquer la maladie.
- terme: Anticorps
  definition: Molécule fabriquée par certains globules blancs, qui reconnaît un microbe précis.
- terme: Résistance
  definition: Capacité d'une bactérie à survivre à un antibiotique qui tue les autres bactéries de son espèce.
erreurs_frequentes:
- 'Croire que les antibiotiques tuent les virus : ils n''agissent que sur les bactéries.'
- Penser que tous les microbes sont dangereux, alors que la plupart sont inoffensifs ou utiles (microbiote).
- Croire que c'est la personne qui devient résistante aux antibiotiques, alors que ce sont les bactéries.
- Penser que l'antibiotique crée la résistance, alors qu'il sélectionne des bactéries déjà résistantes par hasard.
- Confondre antiseptique (sur la peau) et antibiotique (médicament qui agit dans l'organisme).
exemple:
  enonce: Lucas a un rhume causé par un virus. Il veut prendre les antibiotiques qui restent d'un ancien traitement. Est-ce une bonne idée ?
  solution: Non. Un rhume est dû à un virus, et les antibiotiques n'agissent pas sur les virus. De plus, prendre un antibiotique sans raison favorise la survie des bactéries résistantes. Un antibiotique se prend seulement sur prescription d'un médecin.
exercices:
- id: cible-des-antibiotiques
  type: choix
  difficulte: 1
  enonce: Contre quels micro-organismes les antibiotiques sont-ils efficaces ?
  reponse:
    options:
    - id: a
      texte: Les bactéries
    - id: b
      texte: Les virus
    - id: c
      texte: Tous les microbes sans exception
    bonnes:
    - a
  indices:
    relance: Un médecin prescrit-il un antibiotique pour un rhume ou une grippe ? Pourquoi ?
    methode: 'Relis la définition d''un antibiotique dans l''essentiel : sur quel type de micro-organisme agit-il ?'
    etape: La grippe et le rhume sont dus à des virus, et les antibiotiques ne les soignent pas. Élimine les réponses qui contiennent les virus.
  pieges:
  - si:
      contient:
      - b
    relance: 'C''est une idée très répandue, mais fausse : un antibiotique soigne-t-il la grippe, qui est due à un virus ?'
  - si:
      contient:
      - c
    relance: Si les antibiotiques agissaient sur tous les microbes, soigneraient-ils la grippe ? Et que deviendrait notre microbiote ?
  solution: Les antibiotiques agissent seulement sur les bactéries. Ils sont sans effet sur les virus (grippe, rhume…).
- id: nom-du-microbiote
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'ensemble des micro-organismes qui vivent normalement dans notre intestin sans nous rendre malades ? Réponds par un mot.
  reponse:
    acceptees:
    - microbiote
    - microbiote intestinal
    - flore intestinale
    fautes_tolerees: 1
  indices:
    relance: Ce mot ressemble à « microbe », mais il désigne une communauté utile qui vit en nous.
    methode: 'Relis le début de l''essentiel : ces bactéries hébergées par l''intestin portent un nom précis.'
    etape: Le mot est formé de « micro » (tout petit) et d'un mot qui désigne l'ensemble des êtres vivants d'un milieu, comme dans « biotope ».
  pieges:
  - si:
      valeur: microbes
    relance: C'est le mot général. On cherche le nom de l'ensemble des micro-organismes qui vivent normalement dans notre intestin.
  - si:
      valeur: pathogènes
    relance: Les pathogènes provoquent des maladies. Or ces micro-organismes-là ne nous rendent pas malades. Comment appelle-t-on leur ensemble ?
  solution: 'C''est le microbiote (intestinal) : des milliards de micro-organismes, surtout des bactéries, souvent utiles.'
- id: multiplication-bacteries
  type: nombre
  difficulte: 2
  enonce: 'Document fictif : après une contamination, une bactérie se divise en deux toutes les 20 minutes, et chaque nouvelle bactérie fait de même. En partant d''une seule bactérie, combien y en a-t-il au bout d''une heure ? Écris seulement le nombre.'
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Combien de divisions successives ont lieu en une heure, si chacune dure 20 minutes ?
    methode: 'À chaque division, le nombre de bactéries double. Fais un petit tableau : temps, nombre de bactéries.'
    etape: 'Au bout de 20 minutes : 2 bactéries. Au bout de 40 minutes : 4 bactéries. Et au bout de 60 minutes ?'
  pieges:
  - si:
      valeur: 3
    relance: 3, c'est le nombre de divisions. Mais combien de bactéries obtiens-tu après ces divisions ?
  - si:
      valeur: 6
    relance: 'Tu as fait 2 × 3. Mais le nombre double à chaque division : 1, puis 2, puis… ?'
  - si:
      diagnostic: valeur_fausse
    relance: Refais le tableau, 20 minutes par 20 minutes, en doublant à chaque fois.
  solution: 'Une heure = 3 fois 20 minutes, donc 3 divisions : 1 → 2 → 4 → 8. Il y a 8 bactéries au bout d''une heure : c''est l''infection, la multiplication rapide des bactéries.'
- id: moyens-de-lutte
  type: association
  difficulte: 2
  enonce: Associe chaque moyen de lutte à son action. Réponds sous la forme a-1, b-2…
  reponse:
    gauche:
    - id: a
      texte: Lavage des mains
    - id: b
      texte: Antiseptique
    - id: c
      texte: Vaccin
    - id: d
      texte: Antibiotique
    droite:
    - id: '1'
      texte: Limite la contamination en éliminant des microbes présents sur les mains
    - id: '2'
      texte: Tue les microbes sur la peau ou dans une plaie, à l'extérieur du corps
    - id: '3'
      texte: Prépare le système immunitaire à reconnaître un microbe précis, sans donner la maladie
    - id: '4'
      texte: Médicament qui détruit les bactéries ou bloque leur multiplication dans l'organisme
    paires:
      a: '1'
      b: '2'
      c: '3'
      d: '4'
  indices:
    relance: Lesquels de ces moyens agissent avant l'entrée du microbe, et lequel soigne une infection déjà installée ?
    methode: 'Classe d''abord : prévenir la contamination, préparer les défenses, soigner. Puis associe.'
    etape: 'Le vaccin ne tue pas de microbe directement : il agit sur nos défenses. Quelle phrase parle du système immunitaire ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule erreur. Vérifie la différence entre antiseptique (sur la peau) et antibiotique (dans l'organisme).
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs erreurs. Repère les mots « peau », « système immunitaire » et « médicament » dans les actions.
  solution: a-1 (lavage des mains), b-2 (antiseptique, sur la peau), c-3 (vaccin, qui prépare les défenses), d-4 (antibiotique, contre les bactéries dans l'organisme).
- id: selection-bacteries-resistantes
  type: ordre
  difficulte: 3
  enonce: Range dans l'ordre les étapes qui expliquent l'apparition d'une population de bactéries résistantes à un antibiotique.
  reponse:
    elements:
    - id: mutation
      texte: Par hasard, quelques bactéries portent une mutation qui les rend résistantes
    - id: traitement
      texte: On utilise l'antibiotique
    - id: sensibles-meurent
      texte: Les bactéries sensibles sont détruites
    - id: resistantes-survivent
      texte: Les bactéries résistantes survivent et se multiplient
    - id: population-resistante
      texte: La population est désormais composée surtout de bactéries résistantes
  indices:
    relance: La résistance existe-t-elle avant ou après l'utilisation de l'antibiotique ?
    methode: 'Pense à la sélection naturelle : d''abord une variation due au hasard, puis un tri par le milieu, puis la multiplication des survivants.'
    etape: La première étape est la mutation au hasard. Que se passe-t-il ensuite pour que le tri commence ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Les bactéries résistantes peuvent-elles prendre toute la place avant que les sensibles soient détruites ?
  - si:
      diagnostic: ordre_faux
    relance: 'L''antibiotique ne crée pas la résistance : il trie des bactéries qui étaient déjà différentes. Recommence par la mutation.'
  solution: Mutation au hasard chez quelques bactéries, utilisation de l'antibiotique, destruction des bactéries sensibles, survie et multiplication des résistantes, population surtout résistante. L'antibiotique a sélectionné les résistantes, il ne les a pas créées.
- id: microbes-utiles
  type: ouverte
  difficulte: 3
  enonce: 'Un camarade affirme : « Tous les microbes sont dangereux, il faudrait tous les éliminer. » Document fictif : on compare des souris élevées sans aucun microbe à des souris normales, qui ont un microbiote. Les souris sans microbes digèrent moins bien certaines fibres de leur nourriture, et quand on leur fait avaler une bactérie pathogène, elle s''installe plus facilement dans leur intestin. Utilise ce document pour répondre à ton camarade.'
  criteres:
  - L'élève compare les deux groupes de souris et relève les deux différences du document (digestion des fibres, installation de la bactérie pathogène).
  - 'L''élève en déduit que le microbiote est utile : il aide à la digestion et protège contre certains microbes pathogènes.'
  - 'L''élève conclut que tous les microbes ne sont pas dangereux : seuls certains sont pathogènes.'
  indices:
    relance: Qu'est-ce qui change entre les deux groupes de souris ? Et quelles conséquences observe-t-on ?
    methode: Écris une phrase par résultat du document, sous la forme « Sans microbiote, les souris… donc le microbiote… ».
    etape: 'Commence par les fibres : si les souris sans microbes les digèrent moins bien, que fait le microbiote des souris normales ?'
  solution: 'Les deux groupes ne diffèrent que par la présence du microbiote. Sans microbiote, les souris digèrent moins bien certaines fibres : le microbiote aide à la digestion. Sans microbiote, la bactérie pathogène s''installe plus facilement : le microbiote protège contre certains pathogènes. Tous les microbes ne sont donc pas dangereux : la plupart de ceux qui vivent en nous sont utiles, et seuls certains sont pathogènes.'
- id: entree-du-microbe
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'entrée d'un micro-organisme pathogène dans l'organisme, par exemple par une plaie ou par les aliments ?
  reponse:
    acceptees:
    - contamination
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne seulement l'entrée du microbe, pas encore sa multiplication.
    methode: 'Le cours distingue deux mots : l''entrée du microbe et sa multiplication dans le corps. On cherche le premier.'
    etape: 'Le lavage des mains limite justement cette étape : quel mot du cours désigne l''arrivée des microbes ?'
  pieges:
  - si:
      valeur: infection
    relance: L'infection est la multiplication du microbe dans le corps. On te demande le mot pour son entrée.
  solution: C'est la contamination. Elle est suivie de l'infection si le microbe se multiplie dans l'organisme.
- id: role-du-vaccin
  type: choix
  difficulte: 2
  enonce: Parmi ces affirmations sur la vaccination, lesquelles sont justes ?
  reponse:
    options:
    - id: a
      texte: Le vaccin prépare le système immunitaire à reconnaître un microbe précis.
    - id: b
      texte: Le vaccin tue les bactéries déjà présentes dans le corps.
    - id: c
      texte: Après un vaccin, l'organisme garde une mémoire du microbe.
    - id: d
      texte: Le vaccin remplace le lavage des mains pour tous les microbes.
    bonnes:
    - a
    - c
  indices:
    relance: Le vaccin sert-il à soigner une infection déjà là, ou à préparer l'organisme avant ?
    methode: 'Repère dans le cours : ce que fait le vaccin, ce que font les antibiotiques, et à quoi sert l''hygiène.'
    etape: 'Commence par la phrase b : quel moyen de lutte tue des bactéries dans le corps ? Est-ce le vaccin ?'
  pieges:
  - si:
      contient:
      - b
    relance: Tuer des bactéries dans l'organisme, c'est le rôle d'un antibiotique, pas d'un vaccin.
  - si:
      contient:
      - d
    relance: Un vaccin protège contre un microbe précis. Les mesures d'hygiène, elles, limitent la contamination par tous les microbes.
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation juste, mais il y en a une autre. Que garde l'organisme après la première rencontre ?
  solution: 'a et c sont justes : le vaccin prépare le système immunitaire, qui garde une mémoire. b est fausse (rôle des antibiotiques) et d est fausse (le vaccin ne concerne qu''un microbe précis, l''hygiène reste utile).'
