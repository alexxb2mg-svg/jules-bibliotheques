  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la plupart des micro-organismes sont inoffensifs ou utiles, seuls certains sont pathogènes.'
  solution: 'Les antibiotiques sont totalement inefficaces pour traiter une maladie causée par un virus ; La contamination
    correspond à l''entrée du micro-organisme dans l''organisme, tandis que l''infection est sa multiplication. C''est exact
    : les antibiotiques n''agissent que sur les bactéries et n''ont aucun effet sur les virus.'
