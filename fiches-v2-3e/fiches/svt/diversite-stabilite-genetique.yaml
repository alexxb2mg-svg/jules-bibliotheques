format: 2
notion: diversite-stabilite-genetique
version: 2
etat: generee
declencheurs:
- paires de chromosomes
- 46 chromosomes
- allèles d'un gène
- brassage génétique
- cellule-œuf
- caractère héréditaire
- vrais jumeaux
- mutation de l'ADN
- caractère acquis transmis
prerequis:
- reproduction-sexuee-asexuee
- 4e-diversite-genetique-individus
essentiel: |
  Le noyau de chaque cellule contient des chromosomes, formés d'ADN. Un gène est une portion d'ADN qui participe à un caractère (groupe sanguin, couleur des yeux...). Un même gène peut exister en plusieurs versions : les allèles.

  Chez l'être humain, chaque cellule du corps possède 46 chromosomes, rangés en 23 paires : un chromosome de chaque paire vient du père, l'autre de la mère.

  Stabilité : avant chaque division cellulaire (mitose), l'ADN est copié, puis chaque cellule fille reçoit la même information génétique. Toutes les cellules d'un individu ont donc les mêmes gènes.

  Diversité : la méiose produit des gamètes qui ne reçoivent qu'un chromosome de chaque paire, répartis au hasard ; puis la fécondation réunit au hasard un spermatozoïde et un ovule. La cellule-œuf retrouve 46 chromosomes et une combinaison d'allèles unique : c'est le brassage génétique.

  Les mutations sont des modifications rares et aléatoires de l'ADN ; elles créent de nouveaux allèles. Elles ne se transmettent aux enfants que si elles touchent les cellules reproductrices.

  Le phénotype (les caractères observables) dépend du génotype (les allèles) et de l'environnement (soleil, alimentation, entraînement...). Un caractère acquis au cours de la vie ne se transmet pas aux enfants.

  Rappel : l'ADN est une très longue molécule, en forme de double hélice, qui porte l'information génétique. Chaque chromosome contient une molécule d'ADN. Un gène est une portion de cette molécule.

  Pour un gène, un individu possède deux allèles : un venu de son père, un venu de sa mère. Les deux allèles peuvent être identiques ou différents. Cet ensemble d'allèles est son génotype.

  Les vrais jumeaux viennent d'une seule cellule-œuf : ils ont le même génotype. Les faux jumeaux viennent de deux cellules-œufs : ils ont des génotypes différents, comme deux frères ou sœurs.

  Une mutation peut être neutre, défavorable, ou (plus rarement) favorable. Les rayons ultraviolets et le tabac augmentent le risque de mutations. Au brevet, il faut savoir dire ce qui est stable (l'ADN copié à l'identique à chaque mitose) et ce qui varie (méiose, fécondation, mutation).
methode:
- Repérer si la question porte sur la stabilité (mitose, mêmes chromosomes) ou sur la diversité (méiose, fécondation, mutations).
- Compter les chromosomes à chaque étape (cellule du corps, gamète, cellule-œuf).
- Pour un caractère, se demander ce qui vient des allèles et ce qui vient de l'environnement.
- Pour la transmission aux enfants, vérifier si l'ADN des cellules reproductrices est concerné.
- Distinguer l'ADN copié à l'identique (mitose, stabilité) de l'ADN mélangé (méiose et fécondation, diversité).
vocabulaire:
- terme: gène
  definition: Portion d'ADN qui participe à un caractère.
- terme: allèle
  definition: Une des versions possibles d'un gène.
- terme: génotype
  definition: Ensemble des allèles d'un individu.
- terme: phénotype
  definition: Ensemble des caractères observables d'un individu.
- terme: méiose
  definition: Division cellulaire qui produit les gamètes, avec un seul chromosome de chaque paire.
- terme: ADN
  definition: Molécule très longue qui porte l'information génétique, présente dans le noyau des cellules.
- terme: mutation
  definition: Modification rare et aléatoire de l'ADN, qui peut créer un nouvel allèle.
- terme: cellule-œuf
  definition: Première cellule d'un nouvel individu, formée par la fécondation.
- terme: mitose
  definition: Division cellulaire qui donne deux cellules filles identiques à la cellule mère.
- terme: fécondation
  definition: Rencontre et union d'un spermatozoïde et d'un ovule, qui forme la cellule-œuf.
erreurs_frequentes:
- Croire qu'un caractère acquis (muscles, bronzage, cicatrice) se transmet aux enfants.
- Confondre mitose (cellules identiques, 46 chromosomes) et méiose (gamètes, un chromosome par paire).
- Croire qu'une mutation dans n'importe quelle cellule du corps passe aux enfants.
- 'Penser qu''un enfant est la moitié exacte de chacun de ses frères et sœurs : chaque gamète est différent.'
exemple:
  enonce: Deux enfants des mêmes parents (qui ne sont pas de vrais jumeaux) ont des groupes sanguins différents. Comment est-ce possible ?
  solution: Chaque parent possède deux allèles du gène du groupe sanguin. Lors de la méiose, chaque gamète ne reçoit qu'un des deux, au hasard. Selon le spermatozoïde et l'ovule qui se rencontrent à la fécondation, les enfants reçoivent des combinaisons d'allèles différentes, donc parfois des groupes sanguins différents.
exercices:
- id: chromosomes-gamete
  type: nombre
  difficulte: 1
  enonce: Une cellule de la peau humaine possède 46 chromosomes. Combien de chromosomes possède un spermatozoïde humain ? Écris seulement le nombre.
  reponse:
    valeur: 23
  indices:
    relance: Un gamète contient-il autant de chromosomes qu'une cellule de la peau, plus, ou moins ?
    methode: Les 46 chromosomes d'une cellule du corps sont rangés par paires. La méiose ne laisse au gamète qu'un chromosome de chaque paire.
    etape: 'Commence par compter les paires : 46 chromosomes, c''est combien de paires de deux ?'
  pieges:
  - si:
      valeur: 46
    relance: Si chaque gamète en avait 46, combien de chromosomes aurait la cellule-œuf après la fécondation ? Est-ce possible ?
  - si:
      valeur: 92
    relance: Le gamète est le résultat d'une division qui sépare les paires. Il reçoit donc moins de chromosomes, pas plus.
  solution: '46 chromosomes forment 46 ÷ 2 paires. La méiose ne donne au spermatozoïde qu''un chromosome de chaque paire : il possède 23 chromosomes. À la fécondation, 23 + 23 redonnent 46.'
- id: nom-division-gametes
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle la division cellulaire qui produit les gamètes (spermatozoïdes et ovules) ?
  reponse:
    acceptees:
    - méiose
    fautes_tolerees: 1
  indices:
    relance: Il existe deux sortes de divisions cellulaires. Laquelle donne des cellules avec un seul chromosome de chaque paire ?
    methode: La mitose donne deux cellules identiques à la cellule de départ. Cherche le nom de l'autre division.
    etape: Le mot commence par « mé » et se termine comme mitose.
  pieges:
  - si:
      valeur: mitose
    relance: La mitose donne des cellules avec 46 chromosomes, comme la cellule de départ. Est-ce le cas des gamètes ?
  - si:
      valeur: fécondation
    relance: 'La fécondation n''est pas une division : c''est la rencontre de deux gamètes. Quelle division les a fabriqués avant ?'
  solution: 'C''est la méiose : elle se produit dans les testicules et les ovaires et donne des gamètes qui n''ont qu''un chromosome de chaque paire.'
- id: caracteres-transmis
  type: choix
  difficulte: 2
  enonce: Paul a beaucoup développé les muscles de ses bras par l'entraînement. Quelles affirmations sont exactes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: Ses enfants naîtront avec des bras plus musclés.
    - id: b
      texte: L'entraînement a modifié son phénotype, mais pas ses allèles.
    - id: c
      texte: Le phénotype dépend à la fois du génotype et de l'environnement.
    - id: d
      texte: Une mutation dans une cellule de sa peau sera transmise à ses enfants.
    bonnes:
    - b
    - c
  indices:
    relance: L'entraînement a-t-il changé l'ADN des spermatozoïdes de Paul ?
    methode: Pour chaque phrase, demande-toi si elle parle de l'ADN des cellules reproductrices ou seulement du corps de Paul.
    etape: Seul ce qui est inscrit dans l'ADN des gamètes peut passer aux enfants. Relis la phrase a avec cette idée.
  pieges:
  - si:
      contient:
      - a
    relance: Des muscles développés par le sport sont un caractère acquis. L'ADN des gamètes de Paul a-t-il changé ?
  - si:
      contient:
      - d
    relance: Une cellule de la peau participe-t-elle à la fécondation ? Quelles cellules transmettent l'ADN aux enfants ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une bonne réponse, mais il y en a une autre. Relis les phrases qui parlent du phénotype.
  solution: 'b et c sont exactes. L''entraînement modifie le phénotype (les muscles) sans changer les allèles ; le phénotype dépend du génotype et de l''environnement. a est faux : un caractère acquis ne se transmet pas. d est faux : seule une mutation dans les cellules reproductrices peut être transmise.'
- id: du-gamete-a-l-individu
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes qui vont de la formation des gamètes à un individu formé de milliards de cellules.
  reponse:
    elements:
    - id: k
      texte: Dans les testicules et les ovaires, la méiose produit des gamètes.
    - id: f
      texte: Un spermatozoïde et un ovule, pris au hasard, s'unissent lors de la fécondation.
    - id: c
      texte: La cellule-œuf obtenue possède 23 paires de chromosomes.
    - id: p
      texte: Cette cellule se divise par mitoses successives.
    - id: b
      texte: Un individu se forme ; toutes ses cellules ont la même information génétique.
  indices:
    relance: Quelle cellule est la toute première cellule du futur individu ?
    methode: Commence par la fabrication des cellules reproductrices, puis leur rencontre, puis la multiplication des cellules.
    etape: La première étape est la méiose. Qu'est-ce qui arrive ensuite aux gamètes produits ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. La cellule-œuf peut-elle exister avant la rencontre des gamètes ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pars de la méiose et demande-toi à chaque fois : qu''est-ce qui doit déjà exister pour que l''étape suivante ait lieu ?'
  solution: Méiose (gamètes) → fécondation → cellule-œuf à 23 paires de chromosomes → mitoses successives → individu dont toutes les cellules ont la même information génétique.
- id: vocabulaire-genetique
  type: association
  difficulte: 2
  enonce: Associe chaque mot à sa définition.
  reponse:
    gauche:
    - id: g
      texte: Gène
    - id: a
      texte: Allèle
    - id: m
      texte: Mutation
    - id: c
      texte: Chromosome
    droite:
    - id: w
      texte: Une des versions possibles d'un gène
    - id: x
      texte: Modification rare et aléatoire de l'ADN
    - id: y
      texte: Portion d'ADN qui participe à un caractère
    - id: z
      texte: Long filament d'ADN présent dans le noyau
    paires:
      g: y
      a: w
      m: x
      c: z
  indices:
    relance: Lequel de ces mots désigne le plus grand élément, qui porte tous les autres ?
    methode: 'Classe du plus grand au plus petit : chromosome, puis gène, puis ses versions. Le dernier mot désigne un changement.'
    etape: Le chromosome est un long filament d'ADN. Cherche maintenant la définition qui parle d'une portion de cet ADN.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie la différence entre un gène et une version d'un gène.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars du chromosome, le plus grand, puis descends : une portion de chromosome, puis les versions de cette portion.'
  solution: 'Gène : portion d''ADN qui participe à un caractère. Allèle : une des versions d''un gène. Mutation : modification rare et aléatoire de l''ADN. Chromosome : long filament d''ADN présent dans le noyau.'
- id: jumelles-phenotype
  type: ouverte
  difficulte: 3
  enonce: 'Document (fictif) : Léa et Emma sont de vraies jumelles, issues de la même cellule-œuf. À 25 ans, elles ont le même groupe sanguin et la même couleur d''yeux. Léa, monitrice de ski, a la peau très bronzée ; Emma, qui travaille dans un bureau, a la peau claire. Explique leurs ressemblances et leur différence, puis dis si les futurs enfants de Léa naîtront avec une peau bronzée.'
  criteres:
  - L'élève explique que les jumelles ont les mêmes allèles (même génotype), car elles viennent de la même cellule-œuf multipliée par mitoses.
  - 'L''élève attribue la différence de peau à l''environnement (exposition au soleil) : le phénotype dépend du génotype et de l''environnement.'
  - L'élève conclut que le bronzage est un caractère acquis qui ne modifie pas l'ADN des gamètes, donc qu'il ne se transmet pas aux enfants.
  indices:
    relance: Si deux personnes viennent de la même cellule-œuf, que peux-tu dire de leurs allèles ?
    methode: Sépare ce qui vient des gènes (identique chez les deux) et ce qui vient du mode de vie (différent).
    etape: 'Commence ainsi : les deux jumelles viennent de la même cellule-œuf, donc leurs cellules contiennent...'
  solution: 'Léa et Emma viennent de la même cellule-œuf, qui s''est multipliée par mitoses : elles ont le même génotype, d''où le même groupe sanguin et la même couleur d''yeux. La différence de peau vient de l''environnement : Léa est beaucoup exposée au soleil. Le phénotype dépend donc du génotype et de l''environnement. Le bronzage est un caractère acquis : il ne change pas l''ADN des gamètes de Léa, ses enfants ne naîtront pas bronzés.'
- id: nom-modification-adn
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une modification rare et aléatoire de l'ADN, qui peut créer un nouvel allèle ?
  reponse:
    acceptees:
    - mutation
    - une mutation
    - la mutation
    - mutations
    fautes_tolerees: 1
  indices:
    relance: Ce phénomène est rare et dû au hasard. Il change la séquence de l'ADN.
    methode: Le mot vient d'un verbe qui signifie « changer » et rime avec « addition ».
    etape: Le mot commence par « mu » et se termine par « tion ».
  pieges:
  - si:
      valeur: méiose
    relance: La méiose est une division qui fabrique les gamètes. Ici, on cherche une modification de l'ADN lui-même.
  - si:
      valeur: fécondation
    relance: 'La fécondation réunit deux gamètes. Elle ne modifie pas l''ADN : elle mélange des allèles existants.'
  solution: 'C''est une mutation : une modification rare et aléatoire de l''ADN, qui peut créer un nouvel allèle.'
- id: mutation-transmise
  type: choix
  difficulte: 2
  enonce: Dans quels cas une mutation peut-elle être transmise à un enfant ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: Mutation dans une cellule de la peau, après un coup de soleil.
    - id: b
      texte: Mutation dans un spermatozoïde.
    - id: c
      texte: Mutation dans un ovule.
    - id: d
      texte: Mutation dans une cellule du foie.
    bonnes:
    - b
    - c
  indices:
    relance: Pour qu'un enfant reçoive une mutation, il faut qu'elle soit dans une cellule qui participe à sa formation.
    methode: Les enfants se forment à partir de la fécondation. Quelles cellules la réalisent ?
    etape: Les cellules de la peau et du foie ne participent pas à la fécondation. Cherche les gamètes.
  pieges:
  - si:
      contient:
      - a
    relance: 'Une cellule de la peau n''est pas un gamète : sa mutation ne passera pas à l''enfant.'
  - si:
      contient:
      - d
    relance: 'Une cellule du foie n''est pas un gamète : sa mutation ne passera pas à l''enfant.'
  - si:
      diagnostic: incomplet
    relance: Il y a deux sortes de gamètes. Tu n'en as retenu qu'une.
  solution: 'b et c : seule une mutation touchant un gamète (spermatozoïde ou ovule) peut être transmise à un enfant. Une mutation d''une cellule de la peau ou du foie reste dans le corps de la personne.'
