format: 2
notion: diversite-stabilite-genetique
version: 1
etat: verifiee
declencheurs:
- ADN c'est quoi
- brassage génétique
- génotype phénotype
- allèle dominant récessif
- pourquoi on n'est pas identiques
- vrais jumeaux génétique
- parents porteurs d'une maladie
prerequis: []
essentiel: 'L''ADN (acide désoxyribonucléique) est la molécule qui porte l''information génétique dans le noyau de chaque
  cellule, organisée en gènes le long des chromosomes ; elle est transmise de génération en génération, ce qui assure une
  certaine stabilité génétique. Une cellule humaine possède 23 paires de chromosomes.


  Le génotype d''un individu est l''ensemble de son information génétique (ses gènes et leurs versions, appelées allèles)
  ; le phénotype est l''ensemble des caractères observables (couleur des yeux, groupe sanguin…), déterminé par le génotype
  et, pour certains caractères, influencé aussi par l''environnement.


  Une mutation est un changement accidentel dans la séquence de l''ADN ; elle est à l''origine de nouveaux allèles et donc
  d''une partie de la diversité génétique entre individus. Une mutation n''est pas toujours néfaste : elle peut être neutre,
  ou même avantageuse.


  La méiose (division cellulaire qui produit les gamètes, chacun avec 23 chromosomes au lieu de 23 paires) et la fécondation
  (fusion de deux gamètes, qui rétablit les 23 paires) provoquent un brassage génétique : chaque gamète reçoit une combinaison
  différente des allèles des parents, et la fécondation combine celles de deux individus différents, ce qui explique pourquoi
  deux enfants d''un même couple ne sont jamais génétiquement identiques (sauf vrais jumeaux).


  Ainsi, mutations et brassage génétique (méiose puis fécondation) expliquent ensemble à la fois la diversité génétique des
  individus (chacun est unique) et la stabilité génétique de l''espèce (les mêmes gènes se transmettent globalement de génération
  en génération, toujours en 23 paires de chromosomes chez l''être humain).'
methode:
- Distinguer génotype (l'information génétique) et phénotype (ce qui est observable).
- Retenir que les mutations créent de nouveaux allèles, source de diversité.
- Retenir que le brassage génétique (méiose puis fécondation) recombine les allèles existants sans en créer de nouveaux.
- 'Pour suivre le nombre de chromosomes : une cellule normale a 23 paires (46 chromosomes), un gamète n''en a que 23 (un de
  chaque paire), la fécondation rétablit les 23 paires.'
vocabulaire:
- terme: allèle
  definition: une version particulière d'un gène, parmi plusieurs versions possibles
- terme: génotype
  definition: l'ensemble de l'information génétique (les gènes et leurs allèles) que possède un individu
- terme: mutation
  definition: un changement accidentel dans la séquence de l'ADN, source de nouveaux allèles
erreurs_frequentes:
- Confondre génotype et phénotype.
- Croire qu'une mutation est toujours néfaste (elle peut être neutre, parfois même avantageuse).
- Penser que le brassage génétique crée de nouveaux allèles (il recombine seulement les allèles déjà présents chez les parents).
- Confondre le nombre de chromosomes d'une cellule normale (46, soit 23 paires) et celui d'un gamète (23, un seul de chaque
  paire).
exemple:
  enonce: Deux parents sont tous les deux porteurs (hétérozygotes) d'un allèle récessif responsable d'une maladie. Quelle
    est la probabilité que leur enfant porte deux exemplaires de cet allèle (soit atteint) ?
  solution: Chaque parent a 1 chance sur 2 de transmettre l'allèle récessif. La probabilité que l'enfant reçoive cet allèle
    des deux parents est 1/2 × 1/2 = 1/4, soit 25 %.
exercices:
- id: nombre-paires-chromosomes
  type: nombre
  difficulte: 1
  enonce: Combien de paires de chromosomes possède une cellule humaine normale (hors gamètes) ?
  reponse:
    valeur: 23
    forme: entier
  indices:
    relance: Une cellule normale a un nombre pair de chromosomes, regroupés deux par deux.
    methode: Le nombre total de chromosomes d'une cellule humaine normale est 46. Un chromosome sur deux vient de chaque parent,
      ils forment des paires.
    etape: 46 chromosomes forment des paires. Divise 46 par 2 pour trouver le nombre de paires.
  pieges:
  - si:
      valeur: 46
    relance: 46 est le nombre total de chromosomes d'une cellule normale, mais la question porte sur le nombre de paires,
      pas le nombre total.
  - si:
      valeur: 22
    relance: 'Presque : vérifie ton calcul, 46 chromosomes forment un nombre de paires légèrement supérieur.'
  solution: Une cellule humaine normale possède 23 paires de chromosomes, soit 46 chromosomes au total.
- id: mot-allele
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne une version particulière d'un gène, parmi plusieurs versions possibles chez les individus d'une
    espèce ?
  reponse:
    acceptees:
    - allèle
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par « all- » et se termine par « -èle ».
    methode: Relis le vocabulaire de ta leçon consacré aux différentes versions d'un même gène.
    etape: Deux individus peuvent porter des versions différentes du même gène ; chaque version porte ce nom.
  pieges:
  - si:
      valeur: gène
    relance: Le gène est l'information elle-même ; le mot cherché désigne une version particulière de ce gène.
  - si:
      valeur: chromosome
    relance: Le chromosome porte de nombreux gènes ; le mot cherché est plus précis, il désigne une version d'un seul gène.
  solution: Un allèle est une version particulière d'un gène, parmi plusieurs versions possibles.
- id: nature-mutation
  type: choix
  difficulte: 2
  enonce: Quel énoncé décrit correctement les effets possibles d'une mutation de l'ADN ?
  reponse:
    options:
    - id: a
      texte: Une mutation est toujours néfaste pour l'individu
    - id: b
      texte: Une mutation est toujours avantageuse pour l'individu
    - id: c
      texte: Une mutation peut être neutre, avantageuse ou néfaste selon les cas
    - id: d
      texte: Une mutation n'apparaît que chez les micro-organismes
    bonnes:
    - c
  indices:
    relance: Une mutation change une petite partie de l'ADN. Ce changement a-t-il forcément le même effet à chaque fois ?
    methode: 'Pense à des exemples variés de mutations que tu connais : certaines rendent malade, d''autres n''ont aucun effet
      visible.'
    etape: Élimine d'abord les réponses qui affirment un effet systématique (« toujours »), car un même mécanisme peut avoir
      des effets différents.
  pieges:
  - si:
      contient:
      - a
    relance: Certaines mutations sont neutres ou même avantageuses. « Toujours néfaste » n'est donc pas exact.
  - si:
      contient:
      - b
    relance: Certaines mutations sont neutres ou néfastes. « Toujours avantageuse » n'est donc pas exact.
  - si:
      contient:
      - d
    relance: Les mutations peuvent apparaître dans les cellules de n'importe quel être vivant, y compris les cellules reproductrices
      humaines.
  solution: 'Une mutation peut avoir des effets très différents : elle peut être neutre (sans effet visible), avantageuse,
    ou néfaste, selon le gène touché et le changement produit.'
- id: associer-termes-genetique
  type: association
  difficulte: 2
  enonce: Relie chaque terme à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Génotype
    - id: b
      texte: Phénotype
    - id: c
      texte: Allèle
    - id: d
      texte: Mutation
    droite:
    - id: x
      texte: Ensemble des caractères observables d'un individu
    - id: y
      texte: Ensemble de l'information génétique d'un individu
    - id: z
      texte: Version particulière d'un gène
    - id: w
      texte: Changement accidentel dans la séquence de l'ADN
    paires:
      a: y
      b: x
      c: z
      d: w
  indices:
    relance: 'Deux de ces mots se ressemblent (génotype, phénotype) mais désignent des choses opposées : l''un est invisible,
      l''autre visible.'
    methode: Commence par distinguer génotype (l'information génétique) et phénotype (ce qu'on observe), puis place allèle
      et mutation.
    etape: Le génotype, c'est l'information génétique elle-même ; le phénotype, c'est ce qu'on voit (couleur des yeux, par
      exemple).
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie d'abord que tu n'as pas inversé génotype et phénotype.
  - si:
      diagnostic: associations_fausses
    relance: Reprends depuis le début. Repère d'abord ce qui est observable (phénotype), puis ce qui ne l'est pas (génotype).
  solution: Génotype = information génétique de l'individu ; Phénotype = caractères observables ; Allèle = version d'un gène
    ; Mutation = changement accidentel de l'ADN.
- id: ordre-meiose-fecondation
  type: ordre
  difficulte: 2
  enonce: Range ces étapes dans l'ordre, depuis une cellule normale (23 paires de chromosomes) jusqu'à la formation d'une
    nouvelle cellule-œuf.
  reponse:
    elements:
    - id: cellule-initiale
      texte: Une cellule reproductrice initiale possède 23 paires de chromosomes
    - id: meiose
      texte: La méiose produit des gamètes ne contenant qu'un seul chromosome de chaque paire
    - id: fecondation
      texte: La fécondation fait fusionner un gamète de chaque parent
    - id: cellule-oeuf
      texte: La cellule-œuf obtenue possède de nouveau 23 paires de chromosomes
  indices:
    relance: Le nombre de chromosomes diminue puis revient à la normale. À quel moment diminue-t-il, à quel moment revient-il
      à 23 paires ?
    methode: Place d'abord l'état de départ (23 paires) et l'état final (23 paires de nouveau), puis range les deux étapes
      qui les séparent.
    etape: La méiose divise le nombre de chromosomes par deux (elle produit les gamètes) ; elle a donc lieu avant la fécondation,
      qui rétablit le nombre normal.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. La méiose a-t-elle lieu avant ou après la fécondation ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'état de départ (23 paires) et l'état final (23 paires), puis place la méiose et la fécondation
      entre les deux.
  solution: Cellule initiale à 23 paires, puis méiose (les gamètes n'ont qu'un chromosome de chaque paire), puis fécondation
    (fusion de deux gamètes), puis cellule-œuf de nouveau à 23 paires.
- id: expliquer-diversite-stabilite
  type: ouverte
  difficulte: 3
  enonce: Explique, en donnant un exemple pour chaque mécanisme, comment les mutations et le brassage génétique (méiose et
    fécondation) expliquent à la fois la diversité génétique des individus et la stabilité génétique de l'espèce humaine.
  criteres:
  - L'élève explique que les mutations créent de nouveaux allèles, source de diversité.
  - L'élève explique que le brassage génétique (méiose puis fécondation) recombine les allèles déjà présents chez les parents,
    ce qui explique que deux enfants d'un même couple ne soient jamais identiques.
  - L'élève relie la stabilité génétique de l'espèce au fait que le nombre de chromosomes (23 paires) et l'essentiel des gènes
    se transmettent de génération en génération.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quels sont les deux mécanismes vus en cours qui créent de la diversité génétique ?
    methode: Traite d'abord les mutations (avec un exemple), puis le brassage génétique (méiose et fécondation), avant de
      conclure sur la stabilité de l'espèce.
    etape: 'Tu peux commencer ainsi : « La diversité et la stabilité génétique reposent sur deux mécanismes... », puis développer
      le premier.'
  solution: 'La diversité et la stabilité génétique des individus reposent sur deux mécanismes complémentaires. D''une part,
    une mutation peut modifier accidentellement la séquence de l''ADN et créer un nouvel allèle, par exemple à l''origine
    d''une nouvelle couleur des yeux. D''autre part, la méiose puis la fécondation provoquent un brassage génétique : chaque
    gamète reçoit une combinaison différente des allèles des parents, si bien que deux enfants d''un même couple ne sont jamais
    génétiquement identiques (sauf vrais jumeaux). Malgré cette diversité, l''espèce reste génétiquement stable : chaque cellule
    humaine conserve 23 paires de chromosomes et l''essentiel des mêmes gènes se transmet de génération en génération.'
