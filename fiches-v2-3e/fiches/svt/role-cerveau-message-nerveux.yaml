    fautes_tolerees: 1
  indices:
    relance: Il s'agit du nom de la structure nerveuse située dans la colonne vertébrale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'moelle. Correct : la moelle épinière est la structure nerveuse logée dans la colonne vertébrale qui prolonge
    le cerveau.'
