- id: nblm-complete-la-phrase-lors-d-un-mouvement-v-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : Lors d''un mouvement volontaire, le message moteur issu du cerveau descend le long du dos
    à travers la ________ épinière avant de rejoindre les nerfs moteurs.'
  reponse:
    acceptees:
