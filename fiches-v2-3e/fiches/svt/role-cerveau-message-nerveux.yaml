format: 2
notion: role-cerveau-message-nerveux
version: 1
etat: verifiee
declencheurs:
- rôle du cerveau
- message nerveux
- nerf sensitif moteur
- cellule nerveuse
- comment le cerveau reçoit les informations
- retirer la main d'une plaque chaude
prerequis: []
essentiel: 'Le cerveau est le centre nerveux principal de l''organisme : il reçoit en permanence de nombreuses informations
  en provenance des organes sensoriels (yeux, oreilles, peau…) et les intègre (les traite, les combine) pour produire une
  réponse adaptée.


  Ces informations circulent dans l''organisme sous forme de messages nerveux, transmis par des cellules spécialisées appelées
  neurones (ou cellules nerveuses), organisées en réseaux et regroupées en nerfs qui relient les organes au système nerveux
  central (cerveau et moelle épinière).


  Un nerf est un ensemble de prolongements de neurones (fibres nerveuses) qui conduisent les messages nerveux, soit des organes
  sensoriels vers le cerveau (informations sensorielles), soit du cerveau vers les muscles ou organes (commande motrice).


  Le cerveau intègre simultanément plusieurs informations multiples (visuelles, sonores, tactiles…) pour élaborer une réponse
  cohérente, ce qui lui permet de coordonner des comportements complexes.


  Toute atteinte du cerveau, des nerfs ou des centres nerveux peut perturber la réception, le traitement ou la transmission
  de ces messages nerveux, avec des conséquences sur le comportement ou les fonctions du corps.'
methode:
- 'Repérer le trajet d''un message nerveux : organe sensoriel → nerf → cerveau (intégration) → nerf → organe effecteur (muscle
  par exemple).'
- Distinguer message sensoriel (vers le cerveau) et message moteur (du cerveau vers les muscles).
- Retenir que le cerveau intègre plusieurs informations en même temps, pas une seule à la fois.
- Relier une cellule nerveuse (neurone) à son rôle de transmission du message nerveux.
vocabulaire:
- terme: neurone
  definition: cellule nerveuse spécialisée qui transmet les messages nerveux
- terme: nerf
  definition: ensemble de prolongements de plusieurs neurones qui conduit les messages nerveux
erreurs_frequentes:
- Croire que le cerveau reçoit une seule information à la fois, sans les combiner.
- Confondre nerf (ensemble de fibres nerveuses) et neurone (une seule cellule nerveuse).
- Penser que tous les messages nerveux vont dans le même sens (certains vont vers le cerveau, d'autres en partent).
- Oublier que le cerveau fait partie d'un système plus large incluant la moelle épinière et les nerfs.
exemple:
  enonce: Quand on touche accidentellement une plaque chaude, la main se retire très vite. Quel est le trajet du message nerveux
    dans cette réaction ?
  solution: Les récepteurs sensoriels de la peau détectent la chaleur et envoient un message nerveux par un nerf sensitif
    vers le système nerveux central ; celui-ci traite l'information et envoie en retour un message moteur par un nerf vers
    les muscles du bras, qui se contractent pour retirer la main.
exercices:
- id: neurone-vs-nerf
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne une cellule nerveuse unique, capable de transmettre un message nerveux ?
  reponse:
    acceptees:
    - neurone
    - cellule nerveuse
    fautes_tolerees: 1
  indices:
    relance: Ce mot est différent de « nerf », qui désigne un ensemble de cellules.
    methode: Relis le vocabulaire de ta leçon sur les cellules nerveuses.
    etape: Il s'agit d'une seule cellule spécialisée, pas d'un ensemble de fibres.
  pieges:
  - si:
      valeur: nerf
    relance: Le nerf est un ensemble de plusieurs de ces cellules regroupées ; le mot cherché désigne une seule cellule.
  solution: Un neurone (ou cellule nerveuse) est une cellule nerveuse individuelle.
- id: role-cerveau-choix
  type: choix
  difficulte: 1
  enonce: Que fait le cerveau lorsqu'il reçoit plusieurs informations sensorielles en même temps (vision, audition, toucher)
    ?
  reponse:
    options:
    - id: a
      texte: Il traite une seule information à la fois, dans l'ordre où elles arrivent
    - id: b
      texte: Il ignore toutes les informations sauf la plus récente
    - id: c
      texte: Il intègre (combine) simultanément ces informations pour élaborer une réponse cohérente
    - id: d
      texte: Il transmet toutes les informations directement aux muscles sans les traiter
    bonnes:
    - c
  indices:
    relance: Pense au mot « intégrer » utilisé dans le cours pour décrire le rôle du cerveau.
    methode: Élimine d'abord les réponses qui décrivent un traitement séquentiel ou une absence de traitement.
    etape: La bonne réponse évoque une combinaison simultanée de plusieurs informations, pas un traitement isolé.
  pieges:
  - si:
      contient:
      - a
    relance: 'Le cerveau ne traite pas les informations une par une dans l''ordre d''arrivée : il les combine simultanément.'
  - si:
      contient:
      - d
    relance: Le cerveau traite les informations reçues avant d'envoyer une commande motrice ; il ne les transmet pas directement
      sans les traiter.
  solution: Le cerveau intègre (combine) simultanément plusieurs informations sensorielles pour élaborer une réponse cohérente
    et adaptée à la situation globale.
- id: associer-elements-nerveux
  type: association
  difficulte: 2
  enonce: Relie chaque élément à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Neurone
    - id: b
      texte: Nerf
    - id: c
      texte: Message sensoriel
    - id: d
      texte: Message moteur
    droite:
    - id: x
      texte: Message qui va du cerveau vers un muscle
    - id: y
      texte: Ensemble de prolongements de plusieurs neurones
    - id: z
      texte: Cellule nerveuse individuelle
    - id: w
      texte: Message qui va d'un organe sensoriel vers le cerveau
    paires:
      a: z
      b: y
      c: w
      d: x
  indices:
    relance: Repère d'abord ce qui désigne une seule cellule (neurone) et ce qui désigne un ensemble (nerf).
    methode: Traite ensuite les deux types de messages en te demandant dans quel sens chacun circule.
    etape: Le message sensoriel part toujours d'un organe des sens ; le message moteur part toujours du cerveau.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier le sens des deux types de messages (sensoriel et moteur).
  - si:
      diagnostic: associations_fausses
    relance: Reprends depuis le début en distinguant neurone (une cellule) et nerf (un ensemble de fibres).
  solution: Neurone = cellule nerveuse individuelle ; Nerf = ensemble de fibres nerveuses ; Message sensoriel = va d'un organe
    sensoriel vers le cerveau ; Message moteur = va du cerveau vers un muscle.
- id: ordre-reaction-plaque-chaude
  type: ordre
  difficulte: 2
  enonce: Range les étapes du trajet du message nerveux quand la main touche accidentellement une plaque chaude.
  reponse:
    elements:
    - id: detection
      texte: Les récepteurs sensoriels de la peau détectent la chaleur
    - id: message-sensoriel
      texte: Un message nerveux sensoriel part par un nerf vers le système nerveux central
    - id: integration
      texte: Le système nerveux central traite l'information reçue
    - id: message-moteur
      texte: Un message nerveux moteur part par un nerf vers les muscles du bras
    - id: contraction
      texte: Les muscles du bras se contractent et retirent la main
  indices:
    relance: Le trajet commence toujours par la détection, avant tout message nerveux.
    methode: Place d'abord la détection sensorielle, puis les deux messages nerveux (sensoriel puis moteur), puis la réponse
      musculaire finale.
    etape: Le message sensoriel part vers le cerveau, le message moteur part du cerveau vers le muscle ; ils ne vont donc
      pas dans le même sens.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Le message sensoriel a-t-il lieu avant ou après l'intégration par le système
      nerveux central ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la détection (point de départ) et la contraction musculaire (point final), puis place les trois
      étapes intermédiaires.
  solution: D'abord la détection de la chaleur par les récepteurs sensoriels, puis le message sensoriel vers le système nerveux
    central, puis son traitement, puis le message moteur vers les muscles, puis la contraction musculaire.
- id: expliquer-integration-cerveau
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi on dit que le cerveau « intègre » des informations multiples, en donnant un exemple de situation
    où plusieurs informations sensorielles sont reçues en même temps.
  criteres:
  - L'élève explique que le cerveau reçoit et combine simultanément plusieurs informations sensorielles.
  - L'élève donne un exemple concret impliquant au moins deux sens différents (vue, audition, toucher…).
  - L'élève relie cette intégration à l'élaboration d'une réponse cohérente et adaptée à la situation globale.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Pense à une situation quotidienne où tu utilises plusieurs sens en même temps.
    methode: Commence par définir ce que signifie « intégrer » plusieurs informations, puis donne ton exemple, avant de conclure
      sur la réponse adaptée qui en résulte.
    etape: Un exemple simple est de marcher dans la rue en regardant la route et en entendant les bruits de la circulation
      en même temps.
  solution: Le cerveau « intègre » des informations multiples car il reçoit et combine simultanément plusieurs informations
    sensorielles, plutôt que de les traiter une par une de façon isolée. Par exemple, en marchant dans la rue, le cerveau
    reçoit en même temps des informations visuelles (voir la route et les obstacles), auditives (entendre une voiture arriver)
    et de l'équilibre (position du corps). En combinant toutes ces informations, le cerveau élabore une réponse cohérente
    et adaptée à la situation globale, par exemple s'arrêter ou changer de direction, plutôt que de réagir seulement à une
    information isolée.
