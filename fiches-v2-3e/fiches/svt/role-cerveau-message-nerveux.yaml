# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: role-cerveau-message-nerveux
version: 2
etat: verifiee
declencheurs:
- nerf sensitif
- nerf moteur
- moelle épinière
- organes des sens
- trajet de l'information dans le corps
- commande d'un mouvement volontaire
- zones du cerveau
- traiter plusieurs informations
- message électrique dans le corps
prerequis: []
essentiel: 'Le système nerveux permet à l''organisme de recevoir des informations, de les traiter et de commander une réponse.


  Les organes des sens (œil, oreille, peau, nez, langue) contiennent des récepteurs sensoriels. Un récepteur capte une stimulation
  (lumière, son, contact, odeur, saveur) et la transforme en message nerveux.


  Le message nerveux est un signal électrique. Il circule le long des cellules nerveuses, les neurones, toujours dans un seul
  sens. Un neurone a un corps cellulaire et de longs prolongements : les fibres nerveuses.


  Un nerf est un faisceau de fibres nerveuses, comme un câble de fils électriques. Un nerf sensitif conduit le message des
  récepteurs vers les centres nerveux. Un nerf moteur le conduit des centres nerveux vers un muscle.


  Les centres nerveux sont l''encéphale (dont le cerveau) et la moelle épinière. La moelle épinière est protégée par la colonne
  vertébrale. Elle relie le cerveau aux nerfs du corps.


  Le cerveau reçoit en même temps de nombreuses informations venues de plusieurs organes des sens. Chaque type d''information
  arrive dans une zone précise du cerveau (zone de la vision, de l''audition, du toucher...). Le cerveau met ces informations
  en relation : c''est l''intégration. Il élabore alors une réponse adaptée. L''œil capte la lumière, mais c''est le cerveau
  qui donne la perception : il « voit ».


  Pour un mouvement volontaire, la commande part du cerveau. Le message moteur descend par la moelle épinière, un nerf moteur
  le conduit jusqu''aux muscles, qui se contractent.


  Trajet complet : récepteur → nerf sensitif → centres nerveux → nerf moteur → muscle.


  Au brevet : on te demande de suivre ce trajet sur une situation ou un document, de dire ce que fait le cerveau, et de ne
  pas confondre récepteur, nerf et centre nerveux.

  '
methode:
- Repérer la stimulation et l'organe des sens qui la capte.
- Suivre le message nerveux sensitif jusqu'aux centres nerveux, en nommant le nerf.
- 'Dire ce que fait le cerveau : il reçoit, met en relation les informations et élabore une commande.'
- Suivre le message nerveux moteur (moelle épinière, nerf moteur) jusqu'au muscle qui réalise le mouvement.
- 'Dans un document, relier chaque zone ou chaque symptôme à sa place dans le trajet : réception, traitement ou commande.'
vocabulaire:
- terme: récepteur sensoriel
  definition: Cellule d'un organe des sens qui capte une stimulation et produit un message nerveux.
- terme: message nerveux
  definition: Signal électrique qui circule dans les cellules nerveuses, dans un seul sens.
- terme: neurone
  definition: Cellule nerveuse, qui possède un corps cellulaire et de longs prolongements (les fibres nerveuses).
- terme: nerf
  definition: Faisceau de fibres nerveuses qui conduit les messages nerveux entre les centres nerveux et les organes.
- terme: centres nerveux
  definition: L'encéphale (dont le cerveau) et la moelle épinière, qui reçoivent les messages et élaborent les réponses.
- terme: moelle épinière
  definition: Centre nerveux protégé par la colonne vertébrale, qui relie le cerveau aux nerfs du corps.
- terme: intégration
  definition: Mise en relation, par le cerveau, de plusieurs informations pour élaborer une réponse.
erreurs_frequentes:
- 'Croire que ce sont les yeux ou les oreilles qui « voient » ou « entendent » : c''est le cerveau qui interprète les messages.'
- Penser qu'un muscle se contracte tout seul, sans commande nerveuse.
- Confondre nerf sensitif (vers les centres nerveux) et nerf moteur (vers les muscles).
- Oublier que le cerveau traite plusieurs informations en même temps et les met en relation.
- Confondre la colonne vertébrale (des os) et la moelle épinière (un centre nerveux qu'elle protège).
exemple:
  enonce: Au passage piéton, Chloé voit le feu passer au vert et entend le signal sonore, puis elle traverse. Décris le trajet
    des informations.
  solution: 'L''œil capte la lumière du feu et l''oreille capte le son : ils produisent des messages nerveux sensitifs, conduits
    par des nerfs sensitifs jusqu''au cerveau. Le cerveau reçoit ces deux informations, les met en relation et élabore une
    commande. Le message nerveux moteur descend par la moelle épinière, puis les nerfs moteurs le conduisent aux muscles des
    jambes, qui se contractent : Chloé traverse.'
exercices:
- id: centre-nerveux-colonne
  type: texte_court
  difficulte: 1
  enonce: À part le cerveau, quel centre nerveux, logé à l'intérieur de la colonne vertébrale, relie le cerveau aux nerfs
    du corps ?
  reponse:
    acceptees:
    - moelle épinière
    - moelle
    fautes_tolerees: 1
  indices:
    relance: La colonne vertébrale est faite d'os. Qu'y a-t-il à l'intérieur de ces os, qui fait partie du système nerveux
      ?
    methode: 'Les centres nerveux sont au nombre de deux : l''un est protégé par le crâne, l''autre par les vertèbres.'
    etape: Son nom contient le mot « épine », comme l'épine dorsale.
  pieges:
  - si:
      valeur: colonne vertébrale
    relance: La colonne vertébrale est un ensemble d'os qui protège ce centre nerveux. Quel organe nerveux se trouve à l'intérieur
      ?
  - si:
      valeur: nerf
    relance: Un nerf conduit les messages mais ne les traite pas. Quel centre nerveux est protégé par les vertèbres ?
  solution: C'est la moelle épinière, protégée par les vertèbres. Elle fait passer les messages entre le cerveau et les nerfs
    du corps.
- id: attraper-le-ballon
  type: ordre
  difficulte: 2
  enonce: Tu vois un ballon arriver et tu lèves le bras pour l'attraper. Remets dans l'ordre le trajet de l'information.
  reponse:
    elements:
    - id: o
      texte: L'œil capte la lumière venant du ballon.
    - id: s
      texte: Le nerf optique conduit un message nerveux sensitif.
    - id: c
      texte: Le cerveau analyse l'information et élabore une commande.
    - id: e
      texte: Le message nerveux moteur descend dans la moelle épinière.
    - id: n
      texte: Un nerf moteur conduit le message jusqu'au muscle du bras.
    - id: m
      texte: Le muscle se contracte et le bras se lève.
  indices:
    relance: 'Où commence le trajet : dans le cerveau, ou dans un organe des sens ?'
    methode: Suis le trajet récepteur, nerf sensitif, centres nerveux, nerf moteur, muscle.
    etape: La première étape est l'œil qui capte la lumière. Par quoi le message quitte-t-il l'œil ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Le message moteur peut-il descendre avant que le cerveau ait élaboré
      la commande ?
  - si:
      diagnostic: ordre_faux
    relance: 'Sépare les étapes en deux groupes : celles qui vont vers le cerveau, et celles qui partent du cerveau vers le
      muscle.'
  solution: Œil (capte la lumière) → nerf optique (message sensitif) → cerveau (analyse et commande) → moelle épinière (message
    moteur) → nerf moteur → muscle du bras qui se contracte.
- id: entendre-son-prenom
  type: choix
  difficulte: 2
  enonce: Dans la cour, tu entends ton prénom et tu tournes la tête vers la personne qui t'appelle. Quelles affirmations sont
    exactes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: L'oreille capte le son et produit un message nerveux sensitif.
    - id: b
      texte: Le cerveau reconnaît le prénom et commande le mouvement de la tête.
    - id: c
      texte: Les muscles du cou décident seuls de se contracter.
    - id: d
      texte: Le message va directement de l'oreille aux muscles du cou, sans passer par un centre nerveux.
    bonnes:
    - a
    - b
  indices:
    relance: 'Qui reconnaît que c''est ton prénom : l''oreille, le cerveau ou les muscles ?'
    methode: Pour chaque phrase, vérifie qu'elle respecte le trajet récepteur, nerf sensitif, centre nerveux, nerf moteur,
      muscle.
    etape: 'Relis la phrase c : un muscle peut-il se contracter sans recevoir de message nerveux moteur ?'
  pieges:
  - si:
      contient:
      - c
    relance: 'Un muscle ne décide rien : il reçoit une commande. D''où vient-elle ?'
  - si:
      contient:
      - d
    relance: Pour reconnaître ton prénom, il faut analyser le son. Quel organe fait ce travail ?
  - si:
      diagnostic: incomplet
    relance: 'Tu as une bonne réponse, mais il en manque une. Pense aux deux bouts du trajet : le début et le centre.'
  solution: 'a et b sont exactes : l''oreille capte le son et produit un message sensitif ; le cerveau reconnaît le prénom
    et commande le mouvement. c est faux : un muscle se contracte seulement s''il reçoit un message moteur. d est faux : le
    message passe par les centres nerveux.'
- id: elements-roles-nerveux
  type: association
  difficulte: 2
  enonce: Associe chaque élément à son rôle.
  reponse:
    gauche:
    - id: r
      texte: Récepteur sensoriel
    - id: s
      texte: Nerf sensitif
    - id: c
      texte: Cerveau
    - id: n
      texte: Nerf moteur
    - id: m
      texte: Muscle
    droite:
    - id: v
      texte: Conduit le message nerveux vers les muscles
    - id: w
      texte: Capte une stimulation et produit un message nerveux
    - id: x
      texte: Se contracte et réalise le mouvement
    - id: y
      texte: Met en relation les informations et élabore une réponse
    - id: z
      texte: Conduit le message nerveux vers les centres nerveux
    paires:
      r: w
      s: z
      c: y
      n: v
      m: x
  indices:
    relance: Lequel de ces éléments est au tout début du trajet de l'information ?
    methode: Range d'abord les éléments dans l'ordre du trajet, puis donne à chacun le rôle qui correspond à sa place.
    etape: Le récepteur capte la stimulation. Le nerf qui vient juste après conduit le message dans quelle direction ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Presque ! Vérifie les deux nerfs : lequel va vers les centres nerveux, lequel va vers les muscles ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Pense au sens du trajet : sensitif signifie « qui vient des sens », moteur signifie « qui fait bouger ».'
  solution: 'Récepteur : capte une stimulation et produit un message nerveux. Nerf sensitif : conduit le message vers les
    centres nerveux. Cerveau : met en relation les informations et élabore une réponse. Nerf moteur : conduit le message vers
    les muscles. Muscle : se contracte et réalise le mouvement.'
- id: vitesse-message-nerveux
  type: nombre
  difficulte: 2
  enonce: 'Document (fictif) : dans un nerf moteur, un message nerveux parcourt 1 mètre en 0,02 seconde. Quelle est sa vitesse,
    en mètres par seconde ? Écris seulement le nombre.'
  reponse:
    valeur: 50
  indices:
    relance: Une vitesse, c'est une distance parcourue pendant une certaine durée. Quelle opération relie les trois ?
    methode: Vitesse = distance ÷ durée, avec la distance en mètres et la durée en secondes.
    etape: Divise 1 par 0,02. Pour t'aider, combien de fois 0,02 seconde y a-t-il dans 1 seconde ?
  pieges:
  - si:
      valeur: 0.02
    relance: 'Tu as divisé la durée par la distance. On cherche des mètres par seconde : que faut-il mettre en haut de la
      division ?'
  - si:
      valeur: 5
    relance: 'Vérifie ta division : 0,02 × 5 donne-t-il bien 1 ?'
  solution: Vitesse = 1 ÷ 0,02 = 50 mètres par seconde. Le message nerveux est très rapide, mais pas instantané.
- id: nom-des-cellules-nerveuses
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on les cellules spécialisées du système nerveux qui conduisent le message nerveux ? Réponds par
    un mot.
  reponse:
    acceptees:
    - neurone
    - neurones
    - cellule nerveuse
    - cellules nerveuses
    fautes_tolerees: 1
  indices:
    relance: Pense aux cellules qui forment les nerfs, la moelle épinière et le cerveau.
    methode: Ces cellules ont un corps cellulaire et de longs prolongements, qui forment les fibres des nerfs.
    etape: C'est un nom commun de sept lettres, que tu as rencontré dans le vocabulaire de la fiche.
  pieges:
  - si:
      valeur: nerf
    relance: Un nerf est un faisceau de fibres, ce n'est pas une cellule. Quelle cellule possède ces fibres ?
  - si:
      valeur: cerveau
    relance: Le cerveau est un organe formé de très nombreuses cellules. Comment s'appellent ces cellules ?
  solution: Ce sont les neurones (cellules nerveuses). Leurs prolongements forment les fibres nerveuses, réunies en faisceaux
    dans les nerfs.
- id: lesion-du-nerf
  type: choix
  difficulte: 2
  enonce: 'Document (fictif) : après un accident, une personne sent très bien le contact d''un objet sur sa main, mais ne
    parvient plus à bouger ses doigts. Quelle partie du trajet de l''information est le plus probablement abîmée ? (une seule
    réponse)'
  reponse:
    options:
    - id: k
      texte: Les récepteurs de la peau de la main.
    - id: w
      texte: Le nerf sensitif de la main.
    - id: x
      texte: Le nerf moteur qui va aux muscles des doigts.
    - id: z
      texte: La zone du cerveau qui reçoit les informations du toucher.
    bonnes:
    - x
  indices:
    relance: Sépare ce qui fonctionne encore (la sensation) de ce qui ne fonctionne plus (le mouvement).
    methode: Un message sensitif va vers le cerveau, un message moteur en vient. Lequel des deux est perturbé ?
    etape: 'Le contact est bien senti : tout le trajet de la sensation est donc intact. Que reste-t-il à examiner ?'
  pieges:
  - si:
      contient:
      - k
    relance: Si les récepteurs étaient abîmés, la personne ne sentirait plus le contact. Or elle le sent bien.
  - si:
      contient:
      - w
    relance: Le nerf sensitif conduit la sensation vers le cerveau. La personne sent encore le contact, donc il fonctionne.
  - si:
      contient:
      - z
    relance: Si cette zone était abîmée, la personne ne percevrait plus le toucher. Ce n'est pas le cas.
  solution: 'La personne sent le contact : récepteurs, nerf sensitif et zone du toucher fonctionnent. Elle ne peut plus bouger
    : c''est la commande vers les muscles qui est interrompue, donc le nerf moteur.'
- id: zones-du-cerveau
  type: ouverte
  difficulte: 3
  enonce: 'Document (fictif) : on observe par imagerie le cerveau d''un élève. Quand il écoute de la musique les yeux fermés,
    une zone A s''active. Quand il regarde une image en silence, une zone B s''active. Quand il regarde un film (images et
    son), les zones A et B s''activent, ainsi qu''une zone C. Explique le rôle du cerveau dans la réception et l''intégration
    de plusieurs informations.'
  criteres:
  - L'élève explique que chaque type d'information (son, image) arrive dans une zone précise du cerveau, reliée à l'organe
    des sens correspondant.
  - L'élève remarque que le cerveau reçoit plusieurs informations en même temps (zones A et B actives ensemble).
  - L'élève interprète la zone C comme une zone qui met en relation ces informations pour élaborer une perception ou une réponse
    d'ensemble.
  indices:
    relance: Quelle zone reçoit les informations venues de l'oreille ? Et celles venues de l'œil ?
    methode: 'Compare les trois situations : qu''est-ce qui change quand il y a deux types d''informations à la fois ?'
    etape: 'Commence ainsi : la zone A s''active avec le son seul, donc elle reçoit les messages venus...'
  solution: 'La zone A reçoit les messages venus des oreilles, la zone B ceux venus des yeux : chaque information arrive dans
    une zone précise. Pendant le film, le cerveau reçoit les deux en même temps. La zone C, active seulement dans ce cas,
    met en relation le son et l''image : le cerveau intègre plusieurs informations pour en faire une perception d''ensemble
    et élaborer une réponse adaptée.'
- id: nblm-quel-est-le-role-des-organes-des-sens-il-1
  type: choix
  difficulte: 2
  enonce: Quel est le rôle des organes des sens (œil, oreille, peau, etc.) lors de la perception d'un stimulus ?
  reponse:
    options:
    - id: o1
      texte: Ils élaborent directement la commande du mouvement.
    - id: o2
      texte: Ils captent la stimulation et la transforment en message nerveux sensitif.
    - id: o3
      texte: Ils conduisent le message moteur directement jusqu'aux muscles.
    - id: o4
      texte: Ils interprètent et analysent l'information reçue.
    bonnes:
    - o2
  indices:
    relance: Pense au rôle des récepteurs situés au tout début du trajet de l'information.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: 'Erreur fréquente : les organes des sens captent les stimulations, mais c''est le cerveau qui élabore la commande
      motrice.'
  - si:
      contient:
      - o3
    relance: 'Faux : ce sont les nerfs moteurs qui conduisent les messages vers les muscles, pas les organes des sens.'
  - si:
      contient:
      - o4
    relance: 'Attention : l''interprétation de l''information est réalisée par le cerveau, pas par l''organe récepteur lui-même.'
  solution: 'Ils captent la stimulation et la transforment en message nerveux sensitif. C''est exact : les récepteurs sensoriels
    des organes des sens convertissent les stimulations de l''environnement en un signal électrique sensitif.'
- id: nblm-dans-quel-sens-circule-le-message-nerveu-2
  type: choix
  difficulte: 2
  enonce: Dans quel sens circule le message nerveux conduit par un nerf sensitif ?
  reponse:
    options:
    - id: o1
      texte: Du récepteur sensoriel vers les centres nerveux.
    - id: o2
      texte: Du cerveau directement vers le muscle.
    - id: o3
      texte: De la moelle épinière vers l'organe des sens.
    - id: o4
      texte: Du muscle vers le nerf moteur.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la direction des informations captées par rapport au lieu de leur traitement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : le trajet allant du cerveau vers le muscle est emprunté par un nerf moteur.'
  - si:
      contient:
      - o3
    relance: 'Faux : le message sensitif va de l''organe des sens vers les centres nerveux, et non l''inverse.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : les muscles reçoivent les messages nerveux moteurs provenant des nerfs moteurs.'
  solution: 'Du récepteur sensoriel vers les centres nerveux. C''est exact : le nerf sensitif achemine le message depuis l''organe
    des sens récepteur jusqu''au cerveau ou à la moelle épinière.'
- id: nblm-que-fait-le-cerveau-lorsqu-il-recoit-sim-3
  type: choix
  difficulte: 2
  enonce: Que fait le cerveau lorsqu'il reçoit simultanément des informations venant de plusieurs organes des sens ?
  reponse:
    options:
    - id: o1
      texte: Il efface les informations secondaires pour n'en garder qu'une seule.
    - id: o2
      texte: Il renvoie immédiatement le message vers les organes des sens.
    - id: o3
      texte: Il met en relation ces informations et élabore une réponse adaptée.
    - id: o4
      texte: Il transmet les informations aux muscles sans les analyser.
    bonnes:
    - o3
  indices:
    relance: Réfléchis à la façon dont le cerveau combine et intègre ces données.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: 'Faux : le cerveau traite plusieurs informations en même temps et ne se contente pas de les supprimer.'
  - si:
      contient:
      - o2
    relance: 'Incorrect : le cerveau élabore une réponse motrice destinée aux muscles, il ne renvoie pas le message vers les
      sens.'
  - si:
      contient:
      - o4
    relance: 'Faux : le cerveau analyse et traite les données avant de construire la commande motrice.'
  solution: 'Il met en relation ces informations et élabore une réponse adaptée. C''est exact : le cerveau intègre les différentes
    informations reçues dans ses zones spécialisées pour construire une commande motrice.'
- id: nblm-quel-est-le-role-du-nerf-moteur-dans-l-e-4
  type: choix
  difficulte: 2
  enonce: Quel est le rôle du nerf moteur dans l'exécution d'un mouvement volontaire ?
  reponse:
    options:
    - id: o1
      texte: Il capte la stimulation dans l'environnement.
    - id: o2
      texte: Il conduit le message nerveux moteur des centres nerveux jusqu'au muscle.
    - id: o3
      texte: Il remonte le message sensitif vers le cerveau.
    - id: o4
      texte: Il élabore la commande motrice dans sa structure.
    bonnes:
    - o2
  indices:
    relance: Pense au sens de circulation de la commande et à l'organe qui réalise l'action.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: 'Faux : capturer une stimulation est le rôle des récepteurs des organes des sens.'
  - si:
      contient:
      - o3
    relance: 'Attention : remonter le message vers le cerveau est la fonction spécifique du nerf sensitif.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la commande motrice est élaborée par le cerveau ; le nerf se contente de la conduire.'
  solution: 'Il conduit le message nerveux moteur des centres nerveux jusqu''au muscle. C''est exact : le nerf moteur transporte
    la commande motrice depuis le centre nerveux vers le muscle effecteur.'
- id: nblm-quel-est-le-trajet-chronologique-correct-5
  type: choix
  difficulte: 2
  enonce: Quel est le trajet chronologique correct de l'information nerveuse lors d'un mouvement volontaire ?
  reponse:
    options:
    - id: o1
      texte: Récepteur → nerf moteur → centres nerveux → nerf sensitif → muscle.
    - id: o2
      texte: Récepteur → nerf sensitif → centres nerveux → nerf moteur → muscle.
    - id: o3
      texte: Centres nerveux → nerf sensitif → récepteur → nerf moteur → muscle.
    - id: o4
      texte: Muscle → nerf moteur → centres nerveux → nerf sensitif → récepteur.
    bonnes:
    - o2
  indices:
    relance: 'Suis les étapes dans l''ordre : de la stimulation initiale à la contraction du muscle.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: 'Erreur de confusion : les rôles des nerfs sensitifs et moteurs ont été inversés.'
  - si:
      contient:
      - o3
    relance: 'Faux : le départ du message sensitif se fait au niveau du récepteur sensoriel et non des centres nerveux.'
  - si:
      contient:
      - o4
    relance: 'Faux : ce trajet est entièrement inversé par rapport au sens réel de transmission de l''information.'
  solution: 'Récepteur → nerf sensitif → centres nerveux → nerf moteur → muscle. C''est exact : la stimulation est captée
    par le récepteur, véhiculée par le nerf sensitif vers le centre nerveux, puis la commande passe par le nerf moteur jusqu''au
    muscle.'
- id: nblm-quelles-sont-les-deux-structures-qui-con-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX structures qui constituent les centres nerveux chez l'être humain ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le cerveau
    - id: o2
      texte: Les nerfs moteurs
    - id: o3
      texte: La moelle épinière
    - id: o4
      texte: Les muscles effecteurs
    bonnes:
    - o1
    - o3
  indices:
    relance: Recherche les deux organes nerveux situés dans la boîte crânienne et la colonne vertébrale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : les nerfs font partie du système conducteur des messages, ils ne sont pas des centres nerveux.'
  - si:
      contient:
      - o4
    relance: 'Faux : les muscles sont les organes effecteurs qui exécutent le mouvement, pas des centres nerveux.'
  solution: 'Le cerveau ; La moelle épinière. C''est exact : le cerveau est le centre nerveux principal qui intègre les messages
    sensitifs et élabore les commandes.'
- id: nblm-complete-la-phrase-le-message-nerveux-pr-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : Le message nerveux produit par les organes des sens et transmis vers les centres nerveux est
    appelé un message nerveux ________.'
  reponse:
    acceptees:
