      - o3
    relance: 'Erreur fréquente : l''estomac assure le brassage mécanique et le début du découpage chimique, mais l''absorption
      se réalise dans l''intestin grêle.'
  - si:
      contient:
      - o4
    relance: Les fibres non digérées ne passent pas dans le sang et sont éliminées dans les excréments.
  solution: L'absorption est le passage des nutriments depuis la lumière de l'intestin grêle vers le sang ; L'eau, les sels
    minéraux et les vitamines sont absorbés par le sang sans avoir besoin d'être digérés. Il s'agit de la définition exacte
    du processus d'absorption intestinale.
- id: nblm-comment-appelle-t-on-les-replis-microsco-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on les replis microscopiques de la paroi de l'intestin grêle qui augmentent la surface d'échange
    avec le sang ?
  reponse:
    acceptees:
    - villosités
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne les fins replis en forme de doigts situés sur la paroi interne de l'intestin grêle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: villosités. Les villosités (ou villosités intestinales) sont les replis microscopiques qui tapissent l'intestin
    grêle et multiplient la surface d'absorption des nutriments.
- id: nblm-quel-terme-scientifique-designe-le-passa-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme scientifique désigne le passage des nutriments à travers la paroi de l'intestin grêle vers le sang ?
  reponse:
    acceptees:
    - absorption
    fautes_tolerees: 1
  indices:
    relance: Ce terme désigne le transfert des molécules nutritives du tube digestif vers les vaisseaux sanguins.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: absorption. L'absorption (ou absorption intestinale) est le processus physiologique par lequel les nutriments
    franchissent la paroi intestinale pour rejoindre la circulation sanguine.
