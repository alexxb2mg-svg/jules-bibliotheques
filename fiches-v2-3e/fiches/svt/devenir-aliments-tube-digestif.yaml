format: 2
notion: devenir-aliments-tube-digestif
version: 1
etat: verifiee
declencheurs:
- digestion des aliments
- absorption intestinale
- nutriments dans le sang
- villosités intestinales
- que deviennent les aliments qu'on mange
- matières fécales résidus
prerequis: []
essentiel: 'Le tube digestif (bouche, œsophage, estomac, intestin grêle, gros intestin) transforme progressivement les aliments
  ingérés en nutriments, des molécules simples que l''organisme peut utiliser.


  La digestion est cette transformation des grosses molécules apportées par l''alimentation (comme l''amidon ou les protéines)
  en molécules plus simples (comme le glucose ou les acides aminés), grâce à des actions mécaniques (mastication, brassage)
  et chimiques (enzymes digestives).


  Une fois digérés, les nutriments traversent la paroi de l''intestin grêle pour passer dans le sang : c''est l''absorption
  intestinale, rendue efficace par une très grande surface d''échange (la paroi intestinale est fortement plissée et couverte
  de villosités).


  Les nutriments absorbés sont ensuite distribués par le sang à toutes les cellules de l''organisme, qui les utilisent pour
  produire de l''énergie ou fabriquer leurs propres constituants.


  Les résidus non digérés ou non absorbés poursuivent leur trajet dans le gros intestin avant d''être évacués : ils ne sont
  pas des nutriments et ne passent pas dans le sang.'
methode:
- Suivre le trajet des aliments dans le tube digestif, organe par organe.
- Distinguer digestion (transformation des aliments en nutriments) et absorption (passage des nutriments dans le sang).
- Retenir que l'absorption se fait principalement au niveau de l'intestin grêle, grâce à sa grande surface d'échange.
- Ne pas confondre nutriments (absorbés, utiles) et résidus non digérés (évacués, sans passer dans le sang).
vocabulaire:
- terme: nutriment
  definition: molécule simple issue de la digestion, que l'organisme peut absorber et utiliser
- terme: absorption
  definition: passage des nutriments à travers la paroi intestinale jusque dans le sang
erreurs_frequentes:
- Croire que tous les aliments avalés finissent par passer dans le sang (seuls les nutriments absorbés le font).
- Confondre digestion (transformation chimique et mécanique) et absorption (passage dans le sang).
- Penser que l'absorption se fait principalement dans l'estomac plutôt que dans l'intestin grêle.
- Oublier le rôle des résidus non digérés, évacués par le gros intestin.
exemple:
  enonce: Pourquoi l'intestin grêle, et non l'estomac, est-il le principal lieu d'absorption des nutriments dans le sang ?
  solution: L'intestin grêle possède une paroi très plissée, couverte de villosités, ce qui lui donne une immense surface
    d'échange (plusieurs dizaines de mètres carrés) permettant un passage efficace des nutriments vers le sang ; l'estomac,
    lui, sert surtout au début de la digestion chimique, pas à l'absorption.
exercices:
- id: difference-digestion-absorption
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le passage des nutriments à travers la paroi intestinale jusque dans le sang ?
  reponse:
    acceptees:
    - absorption
    fautes_tolerees: 1
  indices:
    relance: Ce mot est différent de « digestion », qui désigne la transformation des aliments.
    methode: Relis la partie de ta leçon consacrée au passage des nutriments dans le sang.
    etape: Ce phénomène a lieu essentiellement au niveau de l'intestin grêle.
  pieges:
  - si:
      valeur: digestion
    relance: La digestion transforme les aliments en nutriments, mais le mot cherché désigne le passage de ces nutriments
      dans le sang.
  solution: L'absorption est le passage des nutriments à travers la paroi intestinale jusque dans le sang.
- id: lieu-principal-absorption
  type: choix
  difficulte: 1
  enonce: Quel organe du tube digestif est le principal lieu d'absorption des nutriments dans le sang ?
  reponse:
    options:
    - id: a
      texte: L'estomac
    - id: b
      texte: L'intestin grêle
    - id: c
      texte: Le gros intestin
    - id: d
      texte: L'œsophage
    bonnes:
    - b
  indices:
    relance: Cet organe possède une paroi très plissée, couverte de villosités.
    methode: Repense à l'exemple de ta leçon comparant l'estomac et un autre organe pour l'absorption.
    etape: Ce n'est pas l'organe où la digestion commence (l'estomac), mais celui où elle se termine et où l'absorption a
      lieu.
  pieges:
  - si:
      contient:
      - a
    relance: L'estomac sert surtout au début de la digestion chimique, pas à l'absorption des nutriments.
  - si:
      contient:
      - c
    relance: Le gros intestin reçoit surtout les résidus non digérés, il n'est pas le principal lieu d'absorption des nutriments.
  solution: L'intestin grêle est le principal lieu d'absorption des nutriments, grâce à sa paroi plissée et couverte de villosités.
- id: associer-organes-roles
  type: association
  difficulte: 2
  enonce: Relie chaque organe du tube digestif à son rôle principal.
  reponse:
    gauche:
    - id: a
      texte: Bouche
    - id: b
      texte: Estomac
    - id: c
      texte: Intestin grêle
    - id: d
      texte: Gros intestin
    droite:
    - id: x
      texte: Évacuation des résidus non digérés
    - id: y
      texte: Absorption des nutriments dans le sang
    - id: z
      texte: Début de la digestion mécanique et chimique
    - id: w
      texte: Brassage et digestion chimique des aliments
    paires:
      a: z
      b: w
      c: y
      d: x
  indices:
    relance: 'Suis le trajet des aliments dans l''ordre : bouche, estomac, intestin grêle, gros intestin.'
    methode: Repère d'abord l'organe où a lieu l'absorption (intestin grêle), puis celui où sont évacués les résidus (gros
      intestin).
    etape: La bouche commence la digestion mécanique (mastication) et chimique (salive), avant l'estomac.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier l'intestin grêle et le gros intestin, souvent confondus.
  - si:
      diagnostic: associations_fausses
    relance: Reprends dans l'ordre du trajet des aliments, de la bouche jusqu'au gros intestin.
  solution: Bouche = début de la digestion ; Estomac = brassage et digestion chimique ; Intestin grêle = absorption des nutriments
    ; Gros intestin = évacuation des résidus non digérés.
- id: ordre-trajet-aliments
  type: ordre
  difficulte: 2
  enonce: Range les organes du tube digestif dans l'ordre du trajet des aliments.
  reponse:
    elements:
    - id: bouche
      texte: Bouche
    - id: oesophage
      texte: Œsophage
    - id: estomac
      texte: Estomac
    - id: intestin-grele
      texte: Intestin grêle
    - id: gros-intestin
      texte: Gros intestin
  indices:
    relance: Le trajet commence par la mastication et se termine par l'évacuation des résidus.
    methode: Place d'abord la bouche (entrée) et le gros intestin (sortie), puis range les trois organes intermédiaires.
    etape: L'œsophage relie la bouche à l'estomac ; il vient donc juste après la bouche.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux organes voisins sont inversés. L'intestin grêle vient-il avant ou après l'estomac ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le début (bouche) et la fin (gros intestin) du trajet, puis place les trois organes intermédiaires
      dans l'ordre.
  solution: Bouche, œsophage, estomac, intestin grêle, gros intestin.
- id: expliquer-devenir-residus
  type: ouverte
  difficulte: 3
  enonce: Explique la différence entre les nutriments et les résidus non digérés, en précisant ce que devient chacun d'eux
    dans l'organisme.
  criteres:
  - L'élève définit les nutriments comme des molécules simples issues de la digestion, absorbées dans le sang.
  - L'élève explique que les résidus non digérés ne passent pas dans le sang et poursuivent leur trajet dans le gros intestin.
  - L'élève précise que les résidus sont finalement évacués de l'organisme, contrairement aux nutriments qui sont utilisés
    par les cellules.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense à ce que devient chaque catégorie de molécules après la digestion.
    methode: Commence par définir les nutriments, puis les résidus non digérés, avant d'expliquer leur devenir respectif.
    etape: Seules les molécules assez simples et absorbées par l'intestin grêle deviennent des nutriments utilisés par l'organisme.
  solution: 'Les nutriments sont des molécules simples (comme le glucose ou les acides aminés) issues de la digestion des
    aliments ; ils traversent la paroi de l''intestin grêle pour passer dans le sang, qui les distribue ensuite à toutes les
    cellules de l''organisme. Les résidus non digérés, en revanche, ne sont pas transformés en molécules assez simples pour
    être absorbés : ils poursuivent leur trajet dans le gros intestin, sans jamais passer dans le sang, avant d''être évacués
    de l''organisme sous forme de matières fécales.'
