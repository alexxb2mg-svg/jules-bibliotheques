    directement dans l'intestin grêle.
- id: nblm-que-deviennent-les-constituants-alimenta-5
  type: choix
  difficulte: 2
  enonce: Que deviennent les constituants alimentaires non digérés, comme les fibres, à la fin du tube digestif ?
  reponse:
    options:
    - id: o1
      texte: Ils passent dans le gros intestin, où une partie de l'eau est réabsorbée, puis sont rejetés par l'anus sous forme
        d'excréments.
    - id: o2
      texte: Ils sont transformés en dioxygène par la salive puis rejetés par l'estomac.
    - id: o3
      texte: Ils traversent la paroi de l'intestin grêle pour aller directement se fixer dans les muscles.
    - id: o4
      texte: Ils remontent par l'œsophage jusqu'à la bouche pour y être réabsorbés au repas suivant.
    bonnes:
    - o1
  indices:
    relance: Suis le parcours des déchets de la digestion après leur passage dans l'intestin grêle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le tube digestif ne fabrique pas de dioxygène et l'estomac n'élimine pas les déchets.
  - si:
      contient:
      - o3
    relance: Seuls les nutriments traversent la paroi intestinale. Les éléments non digérés restent dans la lumière du tube
      digestif.
  - si:
      contient:
      - o4
    relance: Le transit des aliments s'effectue dans un seul sens depuis la bouche jusqu'à l'anus.
  solution: Ils passent dans le gros intestin, où une partie de l'eau est réabsorbée, puis sont rejetés par l'anus sous forme
    d'excréments. Les substances non transformées en nutriments traversent le gros intestin et sont éliminées de l'organisme.
- id: nblm-parmi-les-propositions-suivantes-sur-l-a-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes sur l'absorption intestinale, quelles sont les DEUX affirmations exactes ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'absorption est le passage des nutriments depuis la lumière de l'intestin grêle vers le sang.
    - id: o2
      texte: L'eau, les sels minéraux et les vitamines sont absorbés par le sang sans avoir besoin d'être digérés.
    - id: o3
      texte: L'absorption des nutriments a lieu principalement au niveau de la paroi de l'estomac.
    - id: o4
      texte: Toutes les substances ingérées lors d'un repas, y compris les fibres, passent obligatoirement dans le sang.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie le lieu précis du passage vers le sang ainsi que les éléments assimilés directement sans transformation
      enzymatique.
