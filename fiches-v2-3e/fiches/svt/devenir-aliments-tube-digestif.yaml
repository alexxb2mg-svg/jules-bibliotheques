format: 2
notion: devenir-aliments-tube-digestif
version: 2
etat: verifiee
declencheurs:
- trajet des aliments
- tube digestif
- intestin grêle
- villosités intestinales
- absorption intestinale
- que devient un repas
- digestion mécanique et chimique
- paroi de l'intestin grêle
prerequis:
- nutrition-cellules-animales
essentiel: 'Les aliments avalés parcourent le tube digestif : bouche, œsophage, estomac, intestin grêle, gros intestin, puis
  anus. Des glandes annexes (glandes salivaires, foie, pancréas) déversent leurs sucs dans ce tube. Les aliments ne passent
  pas dans ces glandes.


  La digestion transforme les aliments en nutriments. Elle est à la fois mécanique et chimique.

  - Mécanique : mastication par les dents dans la bouche, brassage par les muscles de l''estomac.

  - Chimique : les sucs digestifs contiennent des enzymes qui découpent les grosses molécules (amidon, protéines, lipides)
  en petites molécules.


  Les nutriments sont de petites molécules : glucose (issu de l''amidon), acides aminés (issus des protéines), acides gras
  et glycérol (issus des lipides). Ils traversent la paroi de l''intestin grêle et passent dans le sang : c''est l''absorption.


  L''intestin grêle est bien adapté à l''absorption. Sa paroi est très repliée, avec des villosités, ce qui donne une très
  grande surface d''échange. Elle est fine et très riche en vaisseaux sanguins. L''eau, les sels minéraux et les vitamines
  sont absorbés sans être digérés.


  Ce qui n''est pas digéré, surtout les fibres, passe dans le gros intestin. Une partie de l''eau y est réabsorbée. Le reste
  est rejeté sous forme d''excréments.


  Le sang apporte ensuite les nutriments à toutes les cellules.


  Les aliments apportent des nutriments de plusieurs types : glucides (énergie), protéines (construction), lipides (énergie
  et réserves), eau, sels minéraux, vitamines, fibres. Une alimentation variée et en quantité adaptée à l''âge et à l''activité
  physique couvre les besoins de l''organisme en énergie et en matériaux. Trop ou trop peu peut nuire à la santé.


  Au brevet : on te demande de suivre un aliment dans le tube digestif, de distinguer aliment et nutriment, et d''expliquer
  le rôle de l''intestin grêle à partir d''un document.

  '
methode:
- Suivre l'aliment organe par organe, dans l'ordre du tube digestif.
- Pour chaque organe, se demander ce qui arrive à l'aliment (action mécanique, action chimique, absorption).
- Distinguer l'aliment (ce que l'on mange) du nutriment (la petite molécule qui passe dans le sang).
- Pour un document, comparer ce qui entre et ce qui sort d'un organe, puis conclure sur son rôle.
- Pour une question sur l'alimentation, relier le type d'aliment à ce qu'il apporte (énergie, construction, fonctionnement)
  et à la quantité adaptée aux besoins.
vocabulaire:
- terme: nutriment
  definition: Petite molécule issue de la digestion (ou apportée telle quelle), capable de passer dans le sang.
- terme: digestion
  definition: Transformation mécanique et chimique des aliments en nutriments dans le tube digestif.
- terme: absorption
  definition: Passage des nutriments de l'intestin grêle vers le sang.
- terme: villosités
  definition: Replis microscopiques de la paroi de l'intestin grêle qui augmentent la surface d'échange avec le sang.
- terme: glande annexe
  definition: Organe (glandes salivaires, foie, pancréas) qui déverse un suc dans le tube digestif sans que les aliments y
    passent.
- terme: enzyme digestive
  definition: Molécule des sucs digestifs qui découpe une grosse molécule en petites molécules.
- terme: fibres
  definition: Aliments d'origine végétale non digérés par nos enzymes, qui passent dans le gros intestin.
- terme: excréments
  definition: Résidus non absorbés, rejetés par l'anus.
erreurs_frequentes:
- 'Croire que la digestion n''est que mécanique : écraser un aliment ne suffit pas, il faut des enzymes pour obtenir des nutriments.'
- Penser que les aliments passent dans le sang directement depuis l'estomac, alors que l'absorption a lieu surtout dans l'intestin
  grêle.
- Confondre aliment et nutriment (le pain est un aliment, le glucose est un nutriment).
- Oublier que le foie et le pancréas participent à la digestion sans que les aliments passent à l'intérieur.
- 'Croire que les excréments sont des nutriments non utilisés par les cellules : ce sont des résidus qui n''ont jamais été
  absorbés.'
exemple:
  enonce: Que devient un morceau de pain entre la bouche et le sang ?
  solution: Dans la bouche, il est mâché et mélangé à la salive, qui commence à digérer son amidon. Il descend par l'œsophage
    dans l'estomac, où il est brassé. Dans l'intestin grêle, les sucs digestifs terminent la digestion de l'amidon en glucose.
    Le glucose traverse la paroi de l'intestin grêle et passe dans le sang (absorption). Les fibres non digérées continuent
    vers le gros intestin et sont rejetées.
exercices:
- id: nom-passage-dans-le-sang
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le passage des nutriments de l'intestin grêle vers le sang ? Réponds par un seul mot.
  reponse:
    acceptees:
    - absorption
    - absorption intestinale
    fautes_tolerees: 1
  indices:
    relance: 'Ce mot n''est pas « digestion » : que fait une éponge avec l''eau ?'
    methode: 'Relis l''essentiel : après la transformation des aliments, les petites molécules traversent la paroi de l''intestin
      grêle. Ce passage porte un nom précis.'
    etape: Trouve le verbe qui décrit ce que fait une éponge avec l'eau, puis transforme-le en nom (comme « digérer » donne
      « digestion »).
  pieges:
  - si:
      valeur: digestion
    relance: La digestion transforme les aliments en nutriments. On te demande le nom de l'étape suivante, quand les nutriments
      passent dans le sang.
  - si:
      valeur: circulation
    relance: La circulation transporte ensuite les nutriments dans tout le corps. Mais comment s'appelle le passage de l'intestin
      vers le sang ?
  solution: 'C''est l''absorption : les nutriments traversent la paroi de l''intestin grêle et passent dans le sang.'
- id: trajet-des-aliments
  type: ordre
  difficulte: 1
  enonce: Range les organes dans l'ordre où les aliments les traversent.
  reponse:
    elements:
    - id: bouche
      texte: Bouche
    - id: oesophage
      texte: Œsophage
    - id: estomac
      texte: Estomac
    - id: intestin-grele
      texte: Intestin grêle
    - id: gros-intestin
      texte: Gros intestin
    - id: anus
      texte: Anus
  indices:
    relance: Par quel organe les aliments entrent-ils, et par lequel les restes sortent-ils ?
    methode: Place d'abord le premier et le dernier organe, puis ceux du milieu en suivant la descente des aliments dans le
      corps.
    etape: Le premier organe est la bouche. Quel tuyau conduit ensuite les aliments vers le ventre ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux organes voisins sont inversés. Lequel est le plus long et vient juste après l'estomac ?
  - si:
      diagnostic: ordre_faux
    relance: 'Reprends depuis l''entrée : la bouche, puis le tuyau qui descend dans le thorax. Suis ensuite le trajet jusqu''à
      la sortie.'
  solution: Bouche, œsophage, estomac, intestin grêle, gros intestin, anus.
- id: organes-et-roles
  type: association
  difficulte: 2
  enonce: Associe chaque organe à son rôle dans la digestion. Réponds sous la forme a-1, b-2…
  reponse:
    gauche:
    - id: a
      texte: Bouche
    - id: b
      texte: Estomac
    - id: c
      texte: Intestin grêle
    - id: d
      texte: Gros intestin
    - id: e
      texte: Foie
    droite:
    - id: '1'
      texte: Mastication et début de la digestion de l'amidon grâce à la salive
    - id: '2'
      texte: Brassage des aliments et suc gastrique
    - id: '3'
      texte: Fin de la digestion et absorption des nutriments vers le sang
    - id: '4'
      texte: Réabsorption d'une partie de l'eau et formation des excréments
    - id: '5'
      texte: Production de la bile, qui aide à la digestion des graisses
    paires:
      a: '1'
      b: '2'
      c: '3'
      d: '4'
      e: '5'
  indices:
    relance: Lequel de ces organes est une glande annexe, que les aliments ne traversent pas ?
    methode: 'Suis le trajet des aliments : à chaque organe, demande-toi ce qu''il leur fait. Traite la glande annexe à part.'
    etape: 'Commence par le plus simple : les dents sont dans la bouche. Quel rôle parle de mastication ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie surtout l''intestin grêle et le gros intestin : lequel fait passer
      les nutriments dans le sang ?'
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Place d'abord la bouche et le foie, puis suis le trajet des aliments.
  solution: a-1 (bouche), b-2 (estomac), c-3 (intestin grêle), d-4 (gros intestin), e-5 (foie, qui produit la bile).
- id: ce-qui-passe-dans-le-sang
  type: choix
  difficulte: 2
  enonce: Après un repas, lesquelles de ces substances peuvent passer directement de l'intestin grêle dans le sang ? Plusieurs
    réponses possibles.
  reponse:
    options:
    - id: a
      texte: Le glucose
    - id: b
      texte: L'amidon
    - id: c
      texte: Les acides aminés
    - id: d
      texte: Les protéines
    - id: e
      texte: L'eau
    - id: f
      texte: Les fibres
    bonnes:
    - a
    - c
    - e
  indices:
    relance: Pour traverser la paroi de l'intestin, une molécule doit-elle être grosse ou petite ?
    methode: 'Classe chaque substance : grosse molécule d''aliment, petite molécule issue de la digestion, ou substance absorbée
      sans digestion.'
    etape: L'amidon est une grosse molécule que les enzymes découpent. En quoi est-il découpé ? Fais de même pour les protéines.
  pieges:
  - si:
      contient:
      - b
    relance: L'amidon est une très grosse molécule. Doit-il d'abord être découpé avant de passer dans le sang ?
  - si:
      contient:
      - d
    relance: Les protéines sont de grosses molécules. En quelles petites molécules les enzymes les découpent-elles ?
  - si:
      contient:
      - f
    relance: Les fibres ne sont pas digérées par nos enzymes. Où vont-elles à la fin du trajet ?
  - si:
      diagnostic: incomplet
    relance: Il en manque. Pense aussi aux substances qui sont absorbées sans avoir besoin d'être digérées.
  solution: Le glucose et les acides aminés (petites molécules issues de la digestion) et l'eau (absorbée sans digestion)
    passent dans le sang. L'amidon et les protéines doivent d'abord être découpés ; les fibres ne sont pas digérées et sont
    rejetées.
- id: glucose-apres-repas
  type: nombre
  difficulte: 2
  enonce: 'Document fictif : on mesure la quantité de glucose dans le sang qui quitte l''intestin grêle. Avant le repas, elle
    vaut 0,9 g/L. Une heure après un repas riche en pain, elle vaut 1,6 g/L. De combien de grammes par litre a-t-elle augmenté
    ? Écris seulement le nombre.'
  reponse:
    valeur: 0.7
    forme: libre
  indices:
    relance: Une augmentation, c'est l'écart entre quelle valeur et quelle valeur ?
    methode: Soustrais la valeur mesurée avant le repas à la valeur mesurée après le repas.
    etape: 'Pose la soustraction avec les virgules alignées : 1,60 moins 0,90.'
  pieges:
  - si:
      valeur: 2.5
    relance: 'Tu as additionné les deux valeurs. On cherche de combien la quantité a augmenté : quelle opération donne un
      écart ?'
  - si:
      diagnostic: valeur_fausse
    relance: 'Refais la soustraction : valeur après le repas moins valeur avant le repas.'
  solution: '1,6 − 0,9 = 0,7. Le glucose du sang qui quitte l''intestin a augmenté de 0,7 g/L : le glucose issu de la digestion
    du pain a été absorbé.'
- id: role-du-gros-intestin
  type: choix
  difficulte: 2
  enonce: Quel est le rôle principal du gros intestin ?
  reponse:
    options:
    - id: a
      texte: Absorber la majorité des nutriments vers le sang.
    - id: b
      texte: Réabsorber une partie de l'eau et former les excréments.
    - id: c
      texte: Broyer les aliments avec les dents.
    - id: d
      texte: Fabriquer les enzymes de la salive.
    bonnes:
    - b
  indices:
    relance: 'Situe le gros intestin dans le tube digestif : avant ou après l''intestin grêle ?'
    methode: Le gros intestin reçoit ce qui n'a pas été digéré. Que fait-il de ce résidu ?
    etape: Le gros intestin est suivi de l'anus, par où sortent les excréments.
  pieges:
  - si:
      contient:
      - a
    relance: L'absorption des nutriments se fait surtout dans un autre organe, avant le gros intestin. Lequel ?
  - si:
      contient:
      - c
    relance: Les dents sont dans la bouche, tout au début du tube digestif.
  - si:
      contient:
      - d
    relance: La salive est produite par les glandes salivaires, près de la bouche.
  solution: Le gros intestin réabsorbe une partie de l'eau du résidu non digéré (surtout des fibres) et forme les excréments,
    rejetés par l'anus.
- id: aliments-et-nutriments
  type: association
  difficulte: 2
  enonce: Associe chaque aliment (a, b, c) au nutriment principal issu de sa digestion (v, w, x).
  reponse:
    gauche:
    - id: a
      texte: Le blanc d'œuf (protéines)
    - id: b
      texte: Le pain (amidon)
    - id: c
      texte: L'huile (lipides)
    droite:
    - id: v
      texte: Des acides aminés
    - id: w
      texte: Du glucose
    - id: x
      texte: Des acides gras et du glycérol
    paires:
      a: v
      b: w
      c: x
  indices:
    relance: Cherche pour chaque aliment la grosse molécule qui le compose, puis les petites molécules qui en résultent.
    methode: Amidon, protéines et lipides sont découpés chacun en un type de petites molécules différent.
    etape: Les protéines donnent les acides aminés. Que donnent l'amidon et les lipides ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Presque tout est juste. Une seule association est à revoir : vérifie chaque aliment avec sa grosse molécule.'
  - si:
      diagnostic: associations_fausses
    relance: Pars de la grosse molécule de chaque aliment (protéines, amidon, lipides) et cherche ce qu'elle donne après digestion.
  solution: Les protéines du blanc d'œuf donnent des acides aminés. L'amidon du pain donne du glucose. Les lipides de l'huile
    donnent des acides gras et du glycérol.
- id: intestin-adapte-absorption
  type: ouverte
  difficulte: 3
  enonce: 'Document (décrit) : au microscope, la paroi de l''intestin grêle montre des milliers de replis en forme de doigts,
    les villosités. Chaque villosité a une paroi très fine (une seule couche de cellules) et contient de nombreux petits vaisseaux
    sanguins. Explique, à l''aide de ces trois informations, pourquoi l''intestin grêle est bien adapté à l''absorption des
    nutriments.'
  criteres:
  - L'élève relie les replis (villosités) à une très grande surface d'échange entre l'intestin et le sang.
  - L'élève explique que la paroi fine et les nombreux vaisseaux sanguins facilitent le passage rapide des nutriments dans
    le sang.
  - L'élève conclut en utilisant le mot absorption et en précisant que les nutriments sont ensuite transportés par le sang
    vers les cellules.
  indices:
    relance: 'À quoi sert chacune des trois caractéristiques décrites : les replis, la paroi fine, les vaisseaux ?'
    methode: Pour chaque information du document, écris une phrase « Cette caractéristique… donc… », puis fais une conclusion.
    etape: 'Commence par les replis : si on dépliait la paroi, sa surface serait-elle plus petite ou plus grande ?'
  solution: 'Les villosités replient la paroi : la surface de contact entre le contenu de l''intestin et le sang est immense.
    La paroi est très fine, donc les nutriments la traversent facilement. Les nombreux vaisseaux sanguins récupèrent les nutriments
    et les emportent. L''intestin grêle est donc adapté à l''absorption : les nutriments passent en grande quantité dans le
    sang, qui les distribue ensuite à toutes les cellules.'
- id: nblm-dans-quel-ordre-chronologique-les-alimen-1
  type: choix
  difficulte: 2
  enonce: Dans quel ordre chronologique les aliments parcourent-ils les organes du tube digestif ?
  reponse:
    options:
    - id: o1
      texte: Bouche, œsophage, estomac, intestin grêle, gros intestin, anus.
    - id: o2
      texte: Bouche, estomac, œsophage, intestin grêle, gros intestin, anus.
    - id: o3
      texte: Bouche, œsophage, estomac, foie, pancréas, intestin grêle, anus.
    - id: o4
      texte: Bouche, œsophage, estomac, gros intestin, intestin grêle, anus.
    bonnes:
    - o1
  indices:
    relance: Pense au trajet continu parcouru physiquement par le bol alimentaire de la bouche à la sortie du tube.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''œsophage relie la bouche à l''estomac, les aliments traversent donc l''œsophage avant
      de parvenir dans l''estomac.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : le foie et le pancréas sont des glandes annexes qui déversent des sucs digestifs, les aliments
      ne passent jamais à l''intérieur.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : les aliments quittent l''estomac pour entrer d''abord dans l''intestin grêle, puis le reste
      non digéré passe dans le gros intestin.'
  solution: Bouche, œsophage, estomac, intestin grêle, gros intestin, anus. C'est l'ordre exact suivi par les aliments depuis
    la mastication dans la bouche jusqu'à l'élimination des déchets non digérés.
- id: nblm-quelle-est-la-definition-scientifique-ex-2
  type: choix
  difficulte: 2
  enonce: Quelle est la définition scientifique exacte d'un nutriment issu de la digestion d'un repas ?
  reponse:
    options:
    - id: o1
      texte: Une petite molécule issue de la digestion (ou apportée telle quelle) capable de traverser la paroi de l'intestin
        grêle pour passer dans le sang.
    - id: o2
      texte: Un aliment solide broyé en très petits morceaux par les dents lors de la mastication.
    - id: o3
      texte: Une grosse molécule comme l'amidon qui reste stockée dans l'estomac pour alimenter le corps.
    - id: o4
      texte: Un liquide produit par le foie et le pancréas pour nettoyer le tube digestif.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la taille moléculaire indispensable pour traverser la paroi de l'intestin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : confondre aliment et nutriment. Le simple broyage mécanique réduit la taille des morceaux
      mais ne crée pas de nutriments sans découpage enzymatique.'
  - si:
      contient:
      - o3
    relance: L'amidon est une grosse molécule alimentaire qui doit obligatoirement être découpée en petites molécules (glucose)
      pour devenir un nutriment.
  - si:
      contient:
      - o4
    relance: Ceci correspond à un suc digestif ou une sécrétion enzymatique, et non à un nutriment absorbé par l'organisme.
  solution: Une petite molécule issue de la digestion (ou apportée telle quelle) capable de traverser la paroi de l'intestin
    grêle pour passer dans le sang. Les nutriments (ex. glucose, acides aminés) sont des molécules microscopiques qui traversent
    la paroi intestinale pour alimenter l'organisme.
- id: nblm-pourquoi-l-intestin-grele-est-il-l-organ-3
  type: choix
  difficulte: 2
  enonce: Pourquoi l'intestin grêle est-il l'organe principal de l'absorption intestinale des nutriments ?
  reponse:
    options:
    - id: o1
      texte: Sa paroi est très repliée en villosités, fine et très riche en vaisseaux sanguins, ce qui offre une immense surface
        d'échange.
    - id: o2
      texte: Parce que c'est le seul organe du tube digestif où les aliments sont broyés mécaniquement.
    - id: o3
      texte: Parce que sa paroi est très épaisse et imperméable pour protéger le sang de la digestion.
    - id: o4
      texte: Parce que tous les aliments y sont stockés définitivement sans jamais traverser sa paroi.
    bonnes:
    - o1
  indices:
    relance: Pense aux structures microscopiques qui augmentent la surface de contact entre l'intestin et le sang.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le brassage et le broyage mécanique ont lieu principalement dans la bouche et l''estomac.'
  - si:
      contient:
      - o3
    relance: La paroi doit au contraire être extrêmement fine pour permettre le passage des nutriments du tube digestif vers
      la circulation sanguine.
  - si:
      contient:
      - o4
    relance: L'intestin grêle réalise le transfert des nutriments vers le sang (absorption), il ne sert pas de lieu de stockage
      définitif.
  solution: Sa paroi est très repliée en villosités, fine et très riche en vaisseaux sanguins, ce qui offre une immense surface
    d'échange. Ces caractéristiques structurales uniques permettent un passage rapide et massif des nutriments dans le sang.
- id: nblm-quel-est-le-role-du-foie-et-du-pancreas-4
  type: choix
  difficulte: 2
  enonce: Quel est le rôle du foie et du pancréas dans la digestion des aliments ?
  reponse:
    options:
    - id: o1
      texte: Ce sont des glandes annexes qui fabriquent et déversent des sucs digestifs dans l'intestin grêle, sans que les
        aliments n'y passent.
    - id: o2
      texte: Ce sont des poches musculaires dans lesquelles les aliments entrent pour y être broyés.
    - id: o3
      texte: Ils absorbent le glucose et l'eau directement depuis la bouche pendant le repas.
    - id: o4
      texte: Ils fabriquent les excréments à partir des fibres végétales alimentaires.
    bonnes:
    - o1
  indices:
    relance: Fais la différence entre le tube digestif (où passent les aliments) et les glandes annexes qui sécrètent des
      sucs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
