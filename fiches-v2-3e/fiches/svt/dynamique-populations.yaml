format: 2
notion: dynamique-populations
version: 1
etat: verifiee
declencheurs:
- taille d'une population qui varie
- décalage des saisons de reproduction
- ponte plus précoce
- population de renards qui augmente
- extinction locale d'une espèce
- migrations d'individus
prerequis:
- reproduction-sexuee-asexuee
essentiel: 'La taille d''une population (le nombre d''individus d''une même espèce dans un milieu donné) varie dans le temps
  sous l''effet de plusieurs paramètres : les naissances, les décès, mais aussi les migrations d''individus qui entrent ou
  quittent le milieu.


  Une population augmente quand les naissances (et les arrivées) dépassent les décès (et les départs) ; elle diminue dans
  le cas contraire.


  Le milieu de vie influence fortement la dynamique d''une population : disponibilité de nourriture, prédateurs, maladies,
  température ou compétition avec d''autres espèces sont autant de facteurs qui peuvent limiter ou favoriser sa croissance.


  L''augmentation de la température globale de la Terre (réchauffement climatique) peut avoir des conséquences directes sur
  la reproduction de certains organismes vivants : par exemple, une modification des périodes de reproduction ou des taux
  de survie des jeunes.


  Étudier la dynamique d''une population permet d''anticiper des risques (extinction locale d''une espèce menacée, prolifération
  d''une espèce nuisible) et d''orienter des mesures de gestion.'
methode:
- Repérer les facteurs qui augmentent une population (naissances, arrivées) et ceux qui la diminuent (décès, départs).
- Calculer une variation en pourcentage pour comparer deux effectifs de population à des dates différentes.
- Identifier les facteurs du milieu qui peuvent expliquer une variation observée (nourriture, prédateurs, température, maladies).
- Relier une variation climatique (réchauffement) à ses effets possibles sur la reproduction d'une espèce donnée.
vocabulaire:
- terme: population
  definition: l'ensemble des individus d'une même espèce vivant dans un milieu donné à un moment donné
- terme: dynamique des populations
  definition: l'étude de la façon dont la taille d'une population varie dans le temps, sous l'effet des naissances, décès
    et migrations
- terme: migration
  definition: le déplacement d'individus qui entrent dans un milieu ou le quittent
erreurs_frequentes:
- Croire qu'une population n'est influencée que par les naissances et les décès, en oubliant les migrations.
- Penser qu'une population augmente toujours indéfiniment sans limite du milieu.
- Confondre variation en valeur absolue (nombre d'individus) et variation en pourcentage.
- Croire que le réchauffement climatique affecte toutes les espèces de la même façon.
exemple:
  enonce: Une population de renards passe de 100 à 120 individus en un an. Calculer la variation en pourcentage.
  solution: '(120 − 100) / 100 × 100 = 20 % : la population a augmenté de 20 % en un an.'
exercices:
- id: calcul-variation-grenouilles
  type: nombre
  difficulte: 2
  enonce: Une population de grenouilles passe de 100 à 80 individus en un an, à cause d'une sécheresse. Quelle est la variation
    en pourcentage (indiquer un nombre négatif si la population diminue) ?
  reponse:
    valeur: -20
    forme: entier
  indices:
    relance: Variation (%) = (effectif final − effectif initial) / effectif initial × 100.
    methode: Calcule d'abord la différence entre les deux effectifs, puis divise-la par l'effectif de départ.
    etape: Divise cette différence par l'effectif de départ, puis multiplie par 100 pour obtenir un pourcentage.
  pieges:
  - si:
      valeur: 20
    relance: 'Tu as trouvé la bonne valeur, mais la population a diminué : n''oublie pas le signe négatif dans ta réponse.'
  - si:
      valeur: -80
    relance: 'Relis la formule : il faut diviser la différence par l''effectif initial (100), pas par l''effectif final.'
  solution: '(80 − 100) / 100 × 100 = −20 % : la population a diminué de 20 %.'
- id: facteurs-limitants
  type: choix
  difficulte: 1
  enonce: Lequel de ces facteurs peut limiter la croissance d'une population animale ?
  reponse:
    options:
    - id: a
      texte: Le manque de nourriture disponible dans le milieu
    - id: b
      texte: L'augmentation du nombre de proies disponibles
    - id: c
      texte: La diminution du nombre de prédateurs
    bonnes:
    - a
  indices:
    relance: Pense à ce qui manque à une population pour se nourrir et se développer normalement.
    methode: Élimine les réponses qui décrivent au contraire des conditions favorables à la croissance d'une population.
    etape: Le manque de nourriture réduit les chances de survie et de reproduction des individus.
  pieges:
  - si:
      contient:
      - b
    relance: Plus de proies disponibles favorise au contraire la croissance d'une population de prédateurs, cela ne la limite
      pas.
  - si:
      contient:
      - c
    relance: Moins de prédateurs favorise au contraire la survie et la croissance d'une population de proies.
  solution: Le manque de nourriture disponible dans le milieu peut limiter la croissance d'une population animale.
- id: mot-facteurs-population
  type: texte_court
  difficulte: 1
  enonce: En plus des naissances et des décès, quel autre paramètre fait varier la taille d'une population (déplacement d'individus
    qui entrent ou quittent le milieu) ?
  reponse:
    acceptees:
    - migrations
    - migration
    fautes_tolerees: 1
  indices:
    relance: Pense à des individus qui arrivent dans un milieu ou qui le quittent, sans naître ni mourir.
    methode: Ce mot désigne un déplacement d'individus d'un milieu vers un autre.
    etape: Ce phénomène s'observe par exemple chez certains oiseaux qui changent de région selon la saison.
  pieges:
  - si:
      valeur: reproduction
    relance: La reproduction concerne les naissances, déjà citées dans la question. Cherche plutôt le paramètre lié au déplacement
      d'individus.
  solution: Les migrations (arrivées et départs d'individus) font aussi varier la taille d'une population, en plus des naissances
    et des décès.
- id: association-facteur-effet
  type: association
  difficulte: 2
  enonce: Associe chaque facteur du milieu à son effet probable sur une population animale.
  reponse:
    gauche:
    - id: a
      texte: Apparition d'une maladie
    - id: b
      texte: Abondance de nourriture
    - id: c
      texte: Réchauffement climatique
    droite:
    - id: x
      texte: Peut faire diminuer la population par une hausse des décès
    - id: y
      texte: Peut favoriser la croissance de la population
    - id: z
      texte: Peut modifier les périodes de reproduction de certaines espèces
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un facteur augmente les décès, un autre favorise les naissances, un autre modifie le calendrier de reproduction.
    methode: Repère d'abord l'effet du réchauffement climatique, qui touche spécifiquement le calendrier de reproduction.
    etape: Une maladie augmente les décès ; l'abondance de nourriture favorise la croissance ; le réchauffement climatique
      modifie les périodes de reproduction.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à l'effet spécifique de chaque facteur.
  - si:
      diagnostic: associations_fausses
    relance: Pars du réchauffement climatique, dont l'effet spécifique sur les périodes de reproduction est le plus caractéristique.
  solution: 'Apparition d''une maladie : fait diminuer la population par une hausse des décès. Abondance de nourriture : favorise
    la croissance de la population. Réchauffement climatique : peut modifier les périodes de reproduction de certaines espèces.'
- id: developpement-rechauffement-reproduction
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique comment le réchauffement climatique peut modifier la reproduction d''une espèce
    animale, avec les conséquences possibles sur sa population.'
  criteres:
  - L'élève explique que le réchauffement climatique peut décaler les périodes de reproduction (ponte plus précoce par exemple).
  - L'élève relie ce décalage à une possible désynchronisation avec la disponibilité de la nourriture des jeunes.
  - 'L''élève explique la conséquence sur la population : baisse du taux de survie des jeunes, donc possible diminution de
    la population.'
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Pense au décalage des saisons et à la synchronisation avec la nourriture disponible pour les jeunes.
    methode: Explique d'abord le décalage de la reproduction, puis relie-le à la disponibilité de nourriture, avant de conclure
      sur la population.
    etape: Tu peux commencer ainsi « Le réchauffement climatique peut modifier le calendrier de reproduction de certaines
      espèces... »
  solution: Le réchauffement climatique peut modifier le calendrier de reproduction de certaines espèces animales, par exemple
    en avançant la période de ponte ou de naissance des jeunes. Ce décalage peut désynchroniser la naissance des jeunes avec
    la disponibilité de leur nourriture habituelle, qui suit elle-même un cycle saisonnier. Si les jeunes naissent trop tôt
    ou trop tard par rapport à cette ressource, leur taux de survie diminue, ce qui peut entraîner une baisse de la taille
    de la population à long terme. Ainsi, le réchauffement climatique agit sur la dynamique des populations non seulement
    par ses effets directs sur le milieu, mais aussi par ses effets sur le calendrier biologique des espèces.
