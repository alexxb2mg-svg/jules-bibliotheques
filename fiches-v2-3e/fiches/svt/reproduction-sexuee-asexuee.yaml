format: 2
notion: reproduction-sexuee-asexuee
version: 1
etat: verifiee
declencheurs:
- bouturage
- gamètes
- dissémination des graines
- clone naturel
- bouture de plante identique
- fusion spermatozoïde ovule
- marcottage
prerequis: []
essentiel: 'La reproduction sexuée nécessite la rencontre de deux cellules reproductrices (gamètes), l''une mâle et l''une
  femelle, dont la fusion (fécondation) donne naissance à un nouvel individu génétiquement différent de ses deux parents.


  La reproduction asexuée ne nécessite qu''un seul individu, sans fusion de gamètes : le nouvel individu est génétiquement
  identique au parent (un clone). Elle se rencontre chez certains végétaux (bouturage, marcottage) et certains animaux simples.


  Chez les Vertébrés et les plantes à fleurs, la reproduction sexuée est le mode principal : les gamètes portent le patrimoine
  génétique de chaque parent, et leur fusion crée une combinaison nouvelle chez le descendant.


  Le milieu de vie influence fortement les modes de reproduction et de dissémination (par exemple, les plantes à fleurs disséminent
  leurs graines par le vent, l''eau ou les animaux).


  Ces différents modes de reproduction et l''influence du milieu sur la survie des jeunes individus jouent un rôle important
  dans la dynamique des populations d''une espèce.'
methode:
- Vérifier s'il y a fusion de deux gamètes (reproduction sexuée) ou non (reproduction asexuée).
- Repérer si le descendant obtenu est génétiquement identique au parent (asexuée) ou différent des deux parents (sexuée).
- Identifier le mode de dissémination des graines ou des jeunes (vent, eau, animaux) selon le milieu.
- Relier le mode de reproduction observé à son intérêt pour la survie de l'espèce dans son milieu.
vocabulaire:
- terme: gamète
  definition: une cellule reproductrice (mâle ou femelle) qui fusionne avec une autre lors de la reproduction sexuée
- terme: fécondation
  definition: la fusion d'un gamète mâle et d'un gamète femelle, qui donne naissance à un nouvel individu
- terme: reproduction asexuée
  definition: un mode de reproduction ne nécessitant qu'un seul individu, sans fusion de gamètes, produisant un clone
erreurs_frequentes:
- Croire que la reproduction asexuée produit un individu différent génétiquement du parent (elle produit un clone).
- Penser que seuls les animaux se reproduisent de façon sexuée (les plantes à fleurs aussi, via le pollen et les ovules).
- Confondre gamète (cellule reproductrice) et graine ou œuf (résultat de la fécondation).
- Oublier que la reproduction asexuée existe aussi chez certains végétaux couramment observés (bouturage).
exemple:
  enonce: Une bouture de géranium replantée donne une nouvelle plante identique génétiquement au plant d'origine. Est-ce de
    la reproduction sexuée ou asexuée ?
  solution: 'C''est de la reproduction asexuée : un seul individu (la plante mère) donne naissance à un descendant sans fusion
    de gamètes, génétiquement identique à elle.'
exercices:
- id: choix-descendant-different
  type: choix
  difficulte: 1
  enonce: Pourquoi les descendants issus d'une reproduction sexuée ne sont-ils jamais identiques à leurs parents ?
  reponse:
    options:
    - id: a
      texte: Parce que le descendant reçoit une combinaison nouvelle du patrimoine génétique de ses deux parents lors de la
        fécondation
    - id: b
      texte: Parce que les gamètes ne contiennent aucune information génétique
    - id: c
      texte: Parce qu'un seul parent transmet son patrimoine génétique, l'autre n'intervient pas
    bonnes:
    - a
  indices:
    relance: Pense à ce qui se passe lors de la fusion des deux gamètes, l'un venant du père, l'autre de la mère.
    methode: Élimine les réponses qui nient l'apport génétique des gamètes ou qui n'impliquent qu'un seul parent.
    etape: Lors de la fécondation, le patrimoine génétique des deux parents se combine d'une façon nouvelle et unique.
  pieges:
  - si:
      contient:
      - b
    relance: 'Les gamètes contiennent au contraire le patrimoine génétique de chaque parent : c''est justement leur fusion
      qui crée une nouvelle combinaison.'
  - si:
      contient:
      - c
    relance: Les deux parents transmettent chacun leur patrimoine génétique via leur gamète respectif ; ce n'est pas un seul
      parent qui intervient.
  solution: Le descendant reçoit une combinaison nouvelle du patrimoine génétique de ses deux parents lors de la fécondation,
    différente de chacun d'eux pris séparément.
- id: mot-mode-dissemination
  type: texte_court
  difficulte: 2
  enonce: Citer un mode de dissémination des graines chez une plante à fleurs, autre que le transport par les animaux.
  reponse:
    acceptees:
    - vent
    - eau
    fautes_tolerees: 1
  indices:
    relance: Pense aux éléments naturels qui peuvent déplacer des graines légères sur de longues distances.
    methode: Une graine légère munie d'ailes ou de poils peut être transportée par cet élément.
    etape: Une graine flottante peut aussi être transportée par cet autre élément naturel.
  pieges:
  - si:
      valeur: pollinisation
    relance: La pollinisation concerne le transport du pollen pour la fécondation, pas la dissémination des graines déjà formées.
      Pense plutôt à un élément naturel qui déplace les graines.
  solution: Le vent (graines légères munies d'ailes ou de poils) ou l'eau (graines flottantes) sont des modes de dissémination
    possibles.
- id: mot-gametes-vertebres
  type: texte_court
  difficulte: 1
  enonce: Chez les Vertébrés, quel est le nom du gamète mâle qui fusionne avec l'ovule lors de la reproduction sexuée ?
  reponse:
    acceptees:
    - spermatozoïde
    fautes_tolerees: 1
  indices:
    relance: C'est une cellule reproductrice de petite taille, mobile, produite par le mâle.
    methode: Ce mot ne doit pas être confondu avec l'ovule, qui est le gamète femelle.
    etape: Ce mot commence par « sperma- ».
  pieges:
  - si:
      valeur: ovule
    relance: L'ovule est le gamète femelle. La question porte sur le gamète mâle.
  solution: Le spermatozoïde est le gamète mâle qui fusionne avec l'ovule (gamète femelle) lors de la fécondation, chez les
    Vertébrés.
- id: association-mode-exemple
  type: association
  difficulte: 2
  enonce: Associe chaque mode de reproduction à un exemple correspondant.
  reponse:
    gauche:
    - id: a
      texte: Reproduction sexuée
    - id: b
      texte: Reproduction asexuée
    droite:
    - id: x
      texte: Fusion d'un spermatozoïde et d'un ovule chez un mammifère
    - id: y
      texte: Une bouture de plante qui redonne une plante identique
    paires:
      a: x
      b: y
  indices:
    relance: Un des deux modes implique la fusion de deux cellules reproductrices, l'autre non.
    methode: Repère d'abord l'exemple qui ne fait intervenir qu'un seul individu, sans fusion de gamètes.
    etape: La fusion de deux gamètes correspond à la reproduction sexuée ; la bouture, qui ne fait intervenir qu'un seul individu,
      correspond à la reproduction asexuée.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la présence ou non d'une fusion de gamètes.
  - si:
      diagnostic: associations_fausses
    relance: 'Repère d''abord l''exemple impliquant un seul individu (la bouture) : c''est la reproduction asexuée.'
  solution: 'Reproduction sexuée : fusion d''un spermatozoïde et d''un ovule chez un mammifère. Reproduction asexuée : une
    bouture de plante qui redonne une plante identique.'
- id: ordre-etapes-fecondation
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre logique du processus de reproduction sexuée, de la production des gamètes jusqu'à
    la naissance d'un nouvel individu.
  reponse:
    elements:
    - id: production
      texte: Chaque parent produit ses gamètes (spermatozoïde ou ovule)
    - id: rencontre
      texte: Les deux gamètes se rencontrent
    - id: fecondation
      texte: Les gamètes fusionnent lors de la fécondation
    - id: developpement
      texte: Le nouvel individu, génétiquement différent des deux parents, se développe
  indices:
    relance: Que doit-il se passer en premier pour que deux gamètes puissent ensuite se rencontrer ?
    methode: Pars de la production des gamètes par chaque parent, puis suis leur rencontre jusqu'à la fusion et le développement.
    etape: La production des gamètes vient en premier ; le développement du nouvel individu est la conséquence finale.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle des deux doit se produire avant l'autre dans ce processus ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par la production des gamètes par chaque parent et termine par le développement du nouvel individu.
  solution: Chaque parent produit ses gamètes, les deux gamètes se rencontrent, ils fusionnent lors de la fécondation, le
    nouvel individu se développe.
- id: developpement-avantage-reproduction
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique la différence entre reproduction sexuée et reproduction asexuée, en précisant
    leur conséquence sur le patrimoine génétique du descendant.'
  criteres:
  - L'élève explique que la reproduction sexuée implique la fusion de deux gamètes de deux parents différents.
  - L'élève explique que la reproduction asexuée n'implique qu'un seul individu, sans fusion de gamètes.
  - 'L''élève précise la conséquence génétique : descendant différent (sexuée) ou identique, clone (asexuée).'
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Repense au nombre d'individus impliqués dans chaque mode de reproduction, et à ce que cela change pour le patrimoine
      génétique du descendant.
    methode: 'Structure ta réponse en deux parties : d''abord la reproduction sexuée, puis la reproduction asexuée, avant
      de conclure sur la différence génétique.'
    etape: Tu peux commencer ainsi « Il existe deux grands modes de reproduction chez les êtres vivants... »
  solution: 'Il existe deux grands modes de reproduction chez les êtres vivants. La reproduction sexuée nécessite la rencontre
    de deux gamètes, l''un mâle et l''un femelle, provenant de deux parents différents ; leur fusion lors de la fécondation
    donne naissance à un descendant génétiquement différent de ses deux parents, car il hérite d''une combinaison nouvelle
    de leur patrimoine génétique. La reproduction asexuée, elle, ne nécessite qu''un seul individu, sans fusion de gamètes
    : le nouvel individu obtenu, comme dans le cas du bouturage, est un clone génétiquement identique à son parent. Ainsi,
    la principale différence entre ces deux modes de reproduction porte sur le nombre de parents impliqués et sur la diversité
    génétique du descendant obtenu.'
