# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: reproduction-sexuee-asexuee
version: 1
etat: verifiee
declencheurs:
- bouturage
- stolons du fraisier
- fécondation externe
- grain de pollen
- graines transportées par le vent
- descendants identiques au parent
prerequis:
- diversite-stabilite-genetique
essentiel: 'La reproduction sexuée fait intervenir deux cellules reproductrices, les gamètes : un gamète mâle et un gamète
  femelle. Leur union, la fécondation, donne une cellule-œuf, qui se développe en un nouvel individu.


  Chaque gamète ne contient que la moitié du patrimoine génétique : un seul chromosome de chaque paire (23 chromosomes chez
  l''être humain, contre 46 dans les autres cellules). La cellule-œuf réunit donc des chromosomes des deux parents. Chaque
  descendant est unique, différent de ses parents et de ses frères et sœurs.


  Chez les Vertébrés, les gamètes sont les spermatozoïdes et les ovules. La fécondation est externe, dans l''eau, chez la
  plupart des poissons et des amphibiens ; elle est interne chez les mammifères, les oiseaux et les reptiles. Chez les plantes
  à fleurs, le grain de pollen apporte le gamète mâle jusqu''au pistil (c''est la pollinisation, par le vent ou par des animaux
  comme les insectes) ; après la fécondation, l''ovule devient une graine et l''ovaire un fruit. Graines et fruits sont ensuite
  dispersés (vent, eau, animaux) : c''est la dissémination.


  La reproduction asexuée se fait à partir d''un seul individu, sans gamètes : bouture, stolon (fraisier), tubercule (pomme
  de terre), bourgeonnement (hydre). Les descendants ont le même patrimoine génétique que le parent : ce sont des clones.
  Elle permet d''occuper rapidement un milieu favorable.


  Les conditions du milieu (eau, température, prédateurs) influencent la survie des œufs et des jeunes, donc le nombre d''individus
  qui atteignent l''âge adulte.

  '
methode:
- Chercher s'il y a des gamètes et une fécondation (reproduction sexuée) ou un seul parent sans gamètes (reproduction asexuée).
- Comparer les descendants au parent (différents ou identiques).
- Pour une fécondation, repérer le milieu où les gamètes se rencontrent (dans l'eau ou dans le corps de la femelle).
- Pour une plante à fleurs, suivre dans l'ordre les étapes allant de la pollinisation à la dissémination.
vocabulaire:
- terme: gamète
  definition: Cellule reproductrice (spermatozoïde ou ovule chez les animaux) qui contient la moitié du patrimoine génétique.
- terme: fécondation
  definition: Union d'un gamète mâle et d'un gamète femelle.
- terme: pollinisation
  definition: Transport du pollen des étamines jusqu'au pistil d'une fleur.
- terme: dissémination
  definition: Dispersion des graines et des fruits loin de la plante qui les a produits.
- terme: clone
  definition: Individu qui a le même patrimoine génétique que celui dont il est issu.
erreurs_frequentes:
- Croire que la reproduction asexuée n'existe que chez les plantes (l'hydre, certaines étoiles de mer se reproduisent aussi
  sans gamètes).
- Croire qu'un gamète contient tout le patrimoine génétique du parent, alors qu'il n'en contient que la moitié.
- Confondre pollinisation (transport du pollen) et fécondation (union des gamètes).
- Penser que la graine est le gamète femelle, alors qu'elle se forme après la fécondation et contient un embryon.
exemple:
  enonce: Un jardinier plante un morceau de tige de géranium, qui donne un nouveau pied. De quel mode de reproduction s'agit-il,
    et à quoi ressemblera la nouvelle plante ?
  solution: 'C''est une reproduction asexuée (un bouturage) : un seul parent, pas de gamètes, pas de fécondation. La nouvelle
    plante aura le même patrimoine génétique que la plante d''origine : c''est un clone.'
exercices:
- id: union-des-gametes
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la cellule formée par l'union d'un gamète mâle et d'un gamète femelle ?
  reponse:
    acceptees:
    - cellule-œuf
    - cellule-oeuf
    - cellule œuf
    - cellule oeuf
    - zygote
    fautes_tolerees: 1
  indices:
    relance: Cette cellule est la toute première cellule du futur individu. Chez les oiseaux, on pense à ce que pond la poule.
    methode: Son nom est formé de deux mots reliés par un tiret. Le premier est « cellule ».
    etape: Le second mot est celui qu'on utilise pour ce que pondent les poules, les poissons ou les grenouilles.
  pieges:
  - si:
      valeur: embryon
    relance: L'embryon vient plus tard, après de nombreuses divisions. Comment s'appelle la toute première cellule, juste
      après la fécondation ?
  - si:
      valeur: gamète
    relance: Les gamètes sont les deux cellules qui s'unissent. On te demande le nom de la cellule obtenue après leur union.
  solution: C'est la cellule-œuf (on dit aussi zygote). Elle contient des chromosomes venant des deux parents et se divise
    pour former l'embryon.
- id: sexuee-ou-asexuee
  type: association
  difficulte: 1
  enonce: Pour chaque exemple (a, b, c, d, e), indique s'il s'agit d'une reproduction sexuée (x) ou asexuée (y).
  reponse:
    gauche:
    - id: a
      texte: Une bouture de géranium donne un nouveau pied.
    - id: b
      texte: Un fraisier produit des stolons qui s'enracinent.
    - id: c
      texte: Les ovules d'une truite sont fécondés par des spermatozoïdes dans l'eau.
    - id: d
      texte: Un cerisier pollinisé par des abeilles produit des cerises contenant chacune une graine.
    - id: e
      texte: Un tubercule de pomme de terre planté donne une nouvelle plante.
    droite:
    - id: x
      texte: reproduction sexuée
    - id: y
      texte: reproduction asexuée
    paires:
      a: y
      b: y
      c: x
      d: x
      e: y
  indices:
    relance: Dans chaque exemple, y a-t-il des gamètes qui se rencontrent ?
    methode: Cherche les mots qui signalent des gamètes ou une fécondation (ovule, spermatozoïde, pollen). Sans eux, un seul
      parent suffit.
    etape: 'Exemple a : on a juste coupé un morceau de tige. Y a-t-il eu une fécondation ? Continue avec les autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule erreur. Le tubercule de pomme de terre, ou le cerisier, provient-il d'une fécondation ?
  - si:
      diagnostic: associations_fausses
    relance: Reprends un exemple à la fois et demande-toi combien de parents interviennent, et s'il y a des gamètes.
  solution: 'a-y, b-y, e-y (bouture, stolon et tubercule : un seul parent, sans gamètes) ; c-x et d-x (fécondation d''ovules
    par des spermatozoïdes chez la truite, pollinisation puis fécondation chez le cerisier).'
- id: chromosomes-d-un-gamete
  type: nombre
  difficulte: 2
  enonce: Une cellule de la peau d'un être humain contient 46 chromosomes, rangés par paires. Combien de chromosomes contient
    un spermatozoïde humain ? Écris seulement le nombre.
  reponse:
    valeur: 23
    forme: entier
  indices:
    relance: Si un gamète contenait autant de chromosomes qu'une cellule de peau, combien en aurait la cellule-œuf après la
      fécondation ?
    methode: Un gamète reçoit un seul chromosome de chaque paire.
    etape: Compte d'abord le nombre de paires dans une cellule de peau humaine.
  pieges:
  - si:
      valeur: 46
    relance: Si le spermatozoïde et l'ovule avaient chacun 46 chromosomes, la cellule-œuf en aurait 92. Un gamète contient-il
      toutes les paires en double ?
  - si:
      valeur: 92
    relance: C'est l'inverse. Le gamète contient moins de chromosomes que les autres cellules, pas plus. Combien de chromosomes
      de chaque paire reçoit-il ?
  solution: 46 chromosomes forment 23 paires. Un gamète reçoit un seul chromosome de chaque paire, donc 46 ÷ 2 = 23 chromosomes.
    Après la fécondation, la cellule-œuf retrouve 23 + 23 = 46 chromosomes.
- id: reproduction-sans-gametes
  type: choix
  difficulte: 2
  enonce: Parmi ces affirmations sur la reproduction asexuée, lesquelles sont exactes ?
  reponse:
    options:
    - id: a
      texte: Elle se fait à partir d'un seul individu.
    - id: b
      texte: Elle nécessite la rencontre de deux gamètes.
    - id: c
      texte: Les descendants ont le même patrimoine génétique que le parent.
    - id: d
      texte: Elle n'existe que chez les plantes.
    bonnes:
    - a
    - c
  indices:
    relance: Pense à une bouture de géranium. Combien de parents ? Y a-t-il des gamètes ?
    methode: Pour chaque phrase, cherche un exemple qui la confirme ou qui la contredit.
    etape: L'hydre, un petit animal d'eau douce, forme des bourgeons qui se détachent et deviennent de nouvelles hydres. Que
      dit cet exemple de la phrase d ?
  pieges:
  - si:
      contient:
      - b
    relance: La rencontre de deux gamètes, c'est la fécondation. Un fraisier qui fait des stolons a-t-il besoin d'une fécondation
      ?
  - si:
      contient:
      - d
    relance: L'hydre, petit animal d'eau douce, fabrique des bourgeons qui deviennent de nouvelles hydres. Est-ce une plante
      ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une phrase exacte, mais il y en a une autre. Que sais-tu des descendants obtenus par bouturage ?
  solution: a et c. La reproduction asexuée part d'un seul individu, sans gamètes (b est fausse), et donne des descendants
    génétiquement identiques au parent. Elle existe aussi chez des animaux comme l'hydre (d est fausse).
- id: de-la-fleur-a-la-nouvelle-plante
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes de la reproduction d'une plante à fleurs.
  reponse:
    elements:
    - id: a
      texte: Les étamines produisent des grains de pollen.
    - id: b
      texte: Un insecte ou le vent transporte du pollen jusqu'au pistil d'une autre fleur.
    - id: c
      texte: Le gamète mâle du pollen s'unit au gamète femelle, dans un ovule.
    - id: d
      texte: L'ovule devient une graine et l'ovaire devient un fruit.
    - id: e
      texte: Des oiseaux mangent le fruit et rejettent la graine plus loin.
    - id: f
      texte: La graine germe et donne une nouvelle plante.
  indices:
    relance: Qu'est-ce qui doit arriver en premier, la graine ou la rencontre des gamètes ?
    methode: Repère les quatre grandes étapes dans l'ordre, pollinisation, fécondation, formation de la graine et du fruit,
      dissémination. Place la production du pollen avant, et la germination après.
    etape: Le premier élément est la production du pollen. Ensuite, le pollen doit voyager.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Le pollen peut-il féconder l'ovule avant d'être arrivé sur le
      pistil ?
  - si:
      diagnostic: ordre_faux
    relance: Une graine ne peut pas se former avant la fécondation, et la fécondation ne peut pas se faire avant le transport
      du pollen. Reprends depuis le début.
  solution: 'a, b, c, d, e, f : production du pollen, pollinisation, fécondation, transformation de l''ovule en graine et
    de l''ovaire en fruit, dissémination par les oiseaux, germination.'
- id: truite-et-lapin
  type: ouverte
  difficulte: 3
  enonce: 'Document (données fictives) : une truite femelle pond environ 2 000 ovules dans l''eau d''une rivière ; le mâle
    y libère ses spermatozoïdes. Les œufs se développent seuls, sans protection. Une lapine, elle, a une fécondation interne
    ; elle donne naissance à environ 6 petits, qu''elle allaite. Dans les deux cas, en moyenne, seuls 2 descendants atteignent
    l''âge adulte. Explique pourquoi la truite produit autant d''ovules, en reliant le mode de fécondation et le milieu à
    la survie des descendants.'
  criteres:
  - L'élève identifie les deux modes de fécondation (externe dans l'eau pour la truite, interne pour la lapine).
  - L'élève explique que, dans l'eau, les gamètes et les œufs sont exposés au milieu (courant, température, prédateurs), si
    bien que beaucoup sont perdus ou mangés.
  - L'élève conclut que le grand nombre d'ovules compense ces pertes et permet que quelques descendants survivent, ce qui
    maintient la population.
  indices:
    relance: Où se rencontrent les gamètes chez la truite ? Et chez la lapine ?
    methode: 'Compare pour chaque espèce : où a lieu la fécondation, combien de descendants au départ, combien arrivent à
      l''âge adulte. Puis explique la différence.'
    etape: Chez la truite, sur 2 000 ovules, très peu deviennent adultes. Que peut-il arriver à des ovules et à des œufs laissés
      seuls dans une rivière ?
  solution: 'Chez la truite, la fécondation est externe : les gamètes et les œufs sont dans l''eau, sans protection. Beaucoup
    ne sont pas fécondés, sont emportés par le courant, meurent ou sont mangés. Sur 2 000 ovules, seuls quelques-uns donnent
    des adultes. Chez la lapine, la fécondation est interne et les petits sont protégés et nourris : il en faut beaucoup moins.
    Le grand nombre d''ovules de la truite compense les pertes dues au milieu, ce qui permet à la population de se maintenir.'
