format: 2
notion: nutrition-plante-chlorophyllienne
version: 2
etat: generee
declencheurs:
- poils absorbants
- sève brute
- sève élaborée
- stomates des feuilles
- réserves d'amidon
- la plante se nourrit par le sol
- dioxyde de carbone des feuilles
- d'où vient la matière des plantes
- pomme de terre amidon
prerequis: []
essentiel: |
  Les cellules chlorophylliennes (surtout celles des feuilles) fabriquent de la matière organique, comme des sucres. C'est la photosynthèse. Elles ont besoin pour cela de dioxyde de carbone, d'eau et d'énergie lumineuse, et elles rejettent du dioxygène. La plante a aussi besoin de sels minéraux.

  L'eau et les sels minéraux sont prélevés dans le sol par les poils absorbants des racines. Le dioxyde de carbone est prélevé dans l'air : il entre dans les feuilles par de petits orifices, les stomates.

  La sève brute (eau et sels minéraux) monte des racines vers les feuilles dans des vaisseaux. La sève élaborée (eau et sucres fabriqués dans les feuilles) circule dans d'autres vaisseaux et apporte ces sucres à tous les organes, même à ceux qui ne sont pas verts (racines, fleurs, fruits).

  Une partie de la matière produite est mise en réserve, souvent sous forme d'amidon : dans les tubercules (pomme de terre), les graines, les fruits. Comme toutes les cellules vivantes, les cellules de la plante utilisent aussi du dioxygène pour produire leur énergie.

  L'essentiel de la matière d'une plante vient donc du dioxyde de carbone de l'air et de l'eau, et non de la terre.

  Bilan de la photosynthèse : eau + dioxyde de carbone → sucres + dioxygène, grâce à l'énergie lumineuse captée par la chlorophylle (le pigment vert). Elle n'a lieu qu'à la lumière.

  Les poils absorbants forment une très grande surface d'échange avec le sol. Les stomates s'ouvrent pour laisser passer les gaz : le dioxyde de carbone entre, le dioxygène sort, et de la vapeur d'eau s'échappe aussi.

  Résumé par organe : les feuilles produisent (et prélèvent le gaz), les racines prélèvent (eau, sels minéraux), les vaisseaux transportent, les tubercules, graines et fruits stockent. Exemple : la betterave stocke dans sa racine du sucre fabriqué par ses feuilles.

  Au brevet, on attend que tu relies chaque besoin à son lieu de prélèvement, chaque organe à son rôle (production, transport, stockage) et que tu lises une expérience avec une partie témoin.
methode:
- Lister les besoins des cellules de la plante (dioxyde de carbone, eau, sels minéraux, lumière).
- Pour chaque besoin, trouver le lieu de prélèvement (racines ou feuilles).
- Distinguer les deux sèves et le sens de leur trajet (brute vers les feuilles, élaborée vers tous les organes).
- Repérer les lieux de production (feuilles) et de stockage (tubercules, graines, fruits).
- 'Dans une expérience, comparer la partie témoin et la partie testée : une seule chose doit changer entre les deux.'
vocabulaire:
- terme: photosynthèse
  definition: Fabrication de matière organique (sucres) par les cellules chlorophylliennes, à partir d'eau et de dioxyde de carbone, grâce à l'énergie lumineuse.
- terme: stomate
  definition: Petit orifice à la surface de la feuille, par où entrent et sortent les gaz.
- terme: sève brute
  definition: Eau et sels minéraux, qui montent des racines vers les feuilles.
- terme: sève élaborée
  definition: Eau et sucres fabriqués par les feuilles, distribués à tous les organes.
- terme: amidon
  definition: Sucre de réserve de la plante ; l'eau iodée le colore en bleu-noir.
- terme: chlorophylle
  definition: Pigment vert des cellules des feuilles, qui capte l'énergie lumineuse.
- terme: poil absorbant
  definition: Fin prolongement d'une cellule de la racine, qui prélève l'eau et les sels minéraux du sol.
- terme: tubercule
  definition: Partie souterraine renflée d'une plante (pomme de terre) où de la matière est stockée.
erreurs_frequentes:
- Croire que la plante « se nourrit » de terre, alors que la terre fournit surtout de l'eau et des sels minéraux en petite quantité.
- Penser que la lumière est une matière que la plante absorbe, alors que c'est une source d'énergie.
- Confondre sève brute et sève élaborée, ou croire qu'elles circulent dans les mêmes vaisseaux.
- Croire que les racines ou les fruits fabriquent leurs propres sucres, alors qu'ils les reçoivent par la sève élaborée.
exemple:
  enonce: Une pomme de terre est riche en amidon. Pourtant, elle pousse sous terre, à l'obscurité. D'où vient cet amidon ?
  solution: 'Les feuilles de la plante, à la lumière, fabriquent des sucres par photosynthèse à partir d''eau et de dioxyde de carbone. La sève élaborée transporte ces sucres jusqu''au tubercule, sous terre. Là, ils sont stockés sous forme d''amidon. Le tubercule ne fabrique donc pas lui-même son amidon : c''est un lieu de stockage.'
exercices:
- id: seve-des-racines
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle la sève qui monte des racines vers les feuilles, chargée d'eau et de sels minéraux ?
  reponse:
    acceptees:
    - sève brute
    - la sève brute
    fautes_tolerees: 1
  indices:
    relance: Il existe deux sèves. L'une contient les sucres fabriqués par les feuilles. Celle-ci n'en contient pas encore. Comment la qualifier ?
    methode: Pense au mot qu'on emploie pour une matière qui n'a pas encore été transformée (du pétrole..., du sucre de canne...).
    etape: La sève qui a été transformée par les feuilles est « élaborée ». Celle qui ne l'a pas encore été porte le nom contraire.
  pieges:
  - si:
      valeur: sève élaborée
    relance: La sève élaborée transporte les sucres fabriqués dans les feuilles. Celle-ci monte vers les feuilles, avant la fabrication des sucres.
  - si:
      valeur: chlorophylle
    relance: La chlorophylle est le pigment vert des feuilles, pas un liquide qui circule. Quel est le nom de la sève qui monte des racines ?
  solution: 'C''est la sève brute : de l''eau et des sels minéraux prélevés dans le sol par les poils absorbants, qui montent dans des vaisseaux jusqu''aux feuilles.'
- id: besoins-et-lieux-de-prelevement
  type: association
  difficulte: 1
  enonce: Associe chaque besoin de la plante (a, b, c, d) à l'endroit où elle le prélève (x, y, z). Une même lettre peut servir plusieurs fois.
  reponse:
    gauche:
    - id: a
      texte: eau
    - id: b
      texte: sels minéraux
    - id: c
      texte: dioxyde de carbone
    - id: d
      texte: énergie lumineuse
    droite:
    - id: x
      texte: dans le sol, par les poils absorbants des racines
    - id: y
      texte: dans l'air, par les stomates des feuilles
    - id: z
      texte: la lumière du Soleil, captée par la chlorophylle des feuilles
    paires:
      a: x
      b: x
      c: y
      d: z
  indices:
    relance: Parmi ces besoins, lequel est un gaz ? Où la plante trouve-t-elle les gaz ?
    methode: Classe les besoins en trois familles, ce qui vient du sol, ce qui vient de l'air, et ce qui n'est pas une matière.
    etape: L'eau vient du sol, par les racines. Fais de même pour les trois autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. La lumière est-elle une matière prélevée dans l'air ?
  - si:
      diagnostic: associations_fausses
    relance: Reprends besoin par besoin. Qu'est-ce qui est dissous dans l'eau du sol ? Quel gaz est dans l'air ?
  solution: a-x et b-x (l'eau et les sels minéraux sont prélevés dans le sol par les racines), c-y (le dioxyde de carbone entre par les stomates des feuilles), d-z (l'énergie lumineuse est captée par la chlorophylle).
- id: origine-de-la-matiere-du-bois
  type: choix
  difficulte: 2
  enonce: D'où vient l'essentiel du carbone qui forme le bois d'un arbre ?
  reponse:
    options:
    - id: a
      texte: De la terre, prélevée par les racines.
    - id: b
      texte: Du dioxyde de carbone de l'air, prélevé par les feuilles.
    - id: c
      texte: De la lumière du Soleil.
    - id: d
      texte: Des sels minéraux du sol.
    bonnes:
    - b
  indices:
    relance: Parmi ces propositions, lesquelles contiennent vraiment du carbone ?
    methode: Rappelle-toi ce dont les feuilles ont besoin pour fabriquer des sucres, et lequel de ces besoins apporte du carbone.
    etape: 'La lumière n''est pas une matière : elle apporte l''énergie. Il reste la terre, les sels minéraux et un gaz. Lequel contient du carbone ?'
  pieges:
  - si:
      contient:
      - a
    relance: C'est une idée très répandue. Pourtant, quand un arbre grossit de plusieurs tonnes, la terre autour de lui ne diminue presque pas. D'où peut venir cette matière ?
  - si:
      contient:
      - c
    relance: La lumière apporte l'énergie, mais ce n'est pas une matière. D'où vient la matière qui contient le carbone ?
  - si:
      contient:
      - d
    relance: Les sels minéraux sont indispensables, mais la plante en prélève très peu. Quel besoin apporte le carbone ?
  solution: b. Par la photosynthèse, les feuilles fabriquent des sucres à partir du dioxyde de carbone de l'air et de l'eau. Ces sucres servent ensuite à construire le bois. La terre fournit l'eau et les sels minéraux, mais très peu de matière.
- id: masse-gagnee-par-l-arbre
  type: nombre
  difficulte: 2
  enonce: 'Document (expérience imaginée, données fictives) : on plante un jeune arbre de 2 kg dans un grand pot contenant 100 kg de terre sèche. Pendant 5 ans, on l''arrose seulement avec de l''eau. À la fin, l''arbre pèse 70 kg et la terre sèche pèse encore 99,9 kg. De combien de kilogrammes la masse de l''arbre a-t-elle augmenté ? Écris seulement le nombre.'
  reponse:
    valeur: 68
    forme: libre
  indices:
    relance: On te demande ce que l'arbre a gagné, pas ce qu'il pèse à la fin. Quelle opération fais-tu ?
    methode: Masse gagnée = masse finale − masse de départ.
    etape: Prends la masse de l'arbre après 5 ans et retire la masse du jeune arbre planté.
  pieges:
  - si:
      valeur: 70
    relance: 70 kg, c'est la masse finale de l'arbre. Combien pesait-il au départ ?
  - si:
      valeur: 0.1
    relance: 0,1 kg, c'est ce que la terre a perdu. On te demande ce que l'arbre a gagné.
  - si:
      valeur: 72
    relance: Tu as additionné les deux masses de l'arbre. Pour trouver ce qu'il a gagné, il faut une soustraction.
  solution: '70 − 2 = 68. L''arbre a gagné 68 kg, alors que la terre n''a perdu que 0,1 kg : la matière de l''arbre ne vient presque pas de la terre, mais surtout de l''eau et du dioxyde de carbone de l''air.'
- id: trajet-de-l-eau-au-tubercule
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre ces étapes, depuis l'eau du sol jusqu'à l'amidon stocké dans une pomme de terre.
  reponse:
    elements:
    - id: a
      texte: L'eau du sol entre dans les poils absorbants des racines.
    - id: b
      texte: L'eau monte dans les vaisseaux de la tige avec la sève brute.
    - id: c
      texte: L'eau arrive dans une cellule chlorophyllienne de la feuille.
    - id: d
      texte: À la lumière, la cellule fabrique des sucres avec cette eau et du dioxyde de carbone.
    - id: e
      texte: Les sucres descendent avec la sève élaborée jusqu'au tubercule.
    - id: f
      texte: Les sucres sont stockés dans le tubercule sous forme d'amidon.
  indices:
    relance: Où commence le trajet de l'eau ? Et où se trouve la pomme de terre, au bout du trajet ?
    methode: Suis d'abord l'eau jusqu'à la feuille, puis suis les sucres fabriqués jusqu'au lieu de stockage.
    etape: Le premier élément parle des poils absorbants. Le dernier parle de l'amidon. Remplis le milieu.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Les sucres peuvent-ils être transportés avant d'avoir été fabriqués ?
  - si:
      diagnostic: ordre_faux
    relance: 'Sépare le trajet en deux parties : d''abord la montée de l''eau, puis la fabrication et le voyage des sucres.'
  solution: 'a, b, c, d, e, f : l''eau entre par les racines, monte avec la sève brute, arrive dans la feuille, sert à fabriquer des sucres à la lumière ; ces sucres descendent avec la sève élaborée jusqu''au tubercule, où ils sont stockés sous forme d''amidon.'
- id: feuille-en-partie-cachee
  type: ouverte
  difficulte: 3
  enonce: 'Document (expérience décrite) : on recouvre une partie d''une feuille d''une plante avec un papier opaque. La plante reste éclairée pendant une journée. On cueille la feuille, on retire le papier et on la plonge dans de l''eau iodée, qui colore l''amidon en bleu-noir. La partie éclairée devient bleu-noir ; la partie cachée reste jaune-orangé (la couleur de l''eau iodée). Exploite ce document pour montrer ce dont la feuille a besoin pour produire de la matière.'
  criteres:
  - L'élève décrit le résultat en comparant les deux parties de la feuille (présence d'amidon seulement dans la partie éclairée).
  - L'élève identifie que la seule différence entre les deux parties est la lumière (la partie cachée sert de témoin).
  - L'élève conclut que la feuille a besoin de lumière pour fabriquer de la matière organique (sucres stockés en amidon) par photosynthèse.
  indices:
    relance: Qu'est-ce qui est différent entre la partie cachée et la partie éclairée ? Et qu'est-ce qui est pareil ?
    methode: Décris d'abord le résultat (où y a-t-il de l'amidon ?), puis cherche la seule différence entre les deux zones, et conclus.
    etape: La couleur bleu-noir signifie qu'il y a de l'amidon. La partie cachée n'a pas reçu une chose que la partie éclairée a reçue.
  solution: 'Seule la partie éclairée contient de l''amidon (couleur bleu-noir). Les deux parties appartiennent à la même feuille : elles ont reçu la même eau et le même air ; seule la lumière diffère. Donc la feuille a besoin de lumière pour fabriquer de la matière organique (des sucres, stockés ici sous forme d''amidon) : c''est la photosynthèse.'
- id: orifice-des-feuilles
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle le petit orifice de la feuille par où le dioxyde de carbone entre dans la plante ?
  reponse:
    acceptees:
    - stomate
    - stomates
    - les stomates
    - un stomate
    fautes_tolerees: 1
  indices:
    relance: Cet orifice est minuscule et très nombreux à la surface de la feuille. Il laisse passer les gaz.
    methode: Le mot commence par « sto » et sert aussi à la sortie du dioxygène et de la vapeur d'eau.
    etape: 'Ce n''est pas un poil de la racine : c''est un orifice de la feuille, dont le nom se termine par « mate ».'
  pieges:
  - si:
      valeur: poil absorbant
    relance: Les poils absorbants sont sur les racines et prélèvent l'eau du sol. Il faut ici un orifice de la feuille.
  - si:
      valeur: vaisseau
    relance: Un vaisseau transporte la sève à l'intérieur de la plante. On cherche un orifice à la surface de la feuille.
  solution: 'Ce sont les stomates : de petits orifices de la feuille par où entrent le dioxyde de carbone et sortent le dioxygène et la vapeur d''eau.'
- id: organes-de-stockage
  type: choix
  difficulte: 2
  enonce: Quels organes d'une plante sont des lieux de stockage de matière organique ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: Un tubercule de pomme de terre.
    - id: b
      texte: Une graine de haricot.
    - id: c
      texte: Une feuille verte en train de faire la photosynthèse.
    - id: d
      texte: Un poil absorbant de racine.
    bonnes:
    - a
    - b
  indices:
    relance: Un lieu de stockage garde de la matière en réserve. Un lieu de production la fabrique. Lesquels gardent seulement ?
    methode: Pense à ce que la plante utilise plus tard, par exemple pour faire germer une graine.
    etape: Les feuilles fabriquent, les poils absorbants prélèvent. Il reste les organes qui mettent en réserve.
  pieges:
  - si:
      contient:
      - c
    relance: 'La feuille verte fabrique les sucres à la lumière : c''est un lieu de production, pas de stockage.'
  - si:
      contient:
      - d
    relance: 'Le poil absorbant prélève l''eau et les sels minéraux : c''est un lieu de prélèvement, pas de stockage.'
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé un lieu de stockage, mais il y en a un autre parmi les propositions.
  solution: 'a et b : le tubercule et la graine stockent des réserves (amidon). La feuille produit les sucres ; le poil absorbant prélève l''eau et les sels minéraux.'
