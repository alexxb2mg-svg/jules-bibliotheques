format: 2
notion: nutrition-plante-chlorophyllienne
version: 1
etat: verifiee
declencheurs:
- sève brute sève élaborée
- comment se nourrit une plante
- pourquoi les plantes ont besoin de lumière
- plante dans un placard fermé
- vaisseaux de la tige
- plante autotrophe
prerequis: []
essentiel: 'Une plante chlorophyllienne (verte) fabrique sa propre matière organique grâce à la photosynthèse : elle utilise
  le dioxyde de carbone (prélevé dans l''air par les feuilles), l''eau et les sels minéraux (prélevés dans le sol par les
  racines) et l''énergie lumineuse (captée par la chlorophylle) pour produire des matières organiques (comme les sucres) et
  rejeter du dioxygène.


  Ce processus a lieu principalement dans les feuilles, riches en chlorophylle, qui captent la lumière ; il ne se produit
  qu''en présence de lumière (le jour, ou sous éclairage artificiel).


  La sève brute (eau et sels minéraux) circule des racines vers les feuilles ; la sève élaborée (riche en sucres produits
  par la photosynthèse) circule des feuilles vers le reste de la plante, y compris les organes de stockage (racines, tubercules,
  fruits).


  Ce transport se fait grâce à des systèmes de circulation spécialisés dans la tige : des vaisseaux distincts pour la sève
  brute et pour la sève élaborée.


  Contrairement aux animaux, les plantes chlorophylliennes n''ont pas besoin de se nourrir d''autres êtres vivants pour obtenir
  leur matière organique : elles la fabriquent elles-mêmes, on dit qu''elles sont autotrophes.'
methode:
- Identifier les éléments prélevés par la plante (CO2, eau, sels minéraux) et leur lieu de prélèvement (feuilles, racines).
- Retenir que l'énergie lumineuse est indispensable à la photosynthèse.
- Distinguer sève brute (racines vers feuilles, eau et sels minéraux) et sève élaborée (feuilles vers reste de la plante,
  sucres).
- Relier le lieu de production (feuilles) au lieu de stockage (racines, fruits, tiges) via le système de transport.
vocabulaire:
- terme: photosynthèse
  definition: le processus par lequel une plante chlorophyllienne fabrique de la matière organique à partir de CO2, d'eau,
    de sels minéraux et de lumière
- terme: sève brute
  definition: le liquide fait d'eau et de sels minéraux qui circule des racines vers les feuilles
- terme: sève élaborée
  definition: le liquide riche en sucres, produit par la photosynthèse, qui circule des feuilles vers le reste de la plante
erreurs_frequentes:
- Croire que les racines produisent la matière organique de la plante (c'est le rôle des feuilles grâce à la lumière).
- Confondre sève brute et sève élaborée, ou leur sens de circulation.
- Penser que la photosynthèse a lieu la nuit, alors qu'elle nécessite de la lumière.
- Oublier que les plantes chlorophylliennes prélèvent aussi du CO2 dans l'air, pas seulement de l'eau dans le sol.
exemple:
  enonce: Pourquoi une plante placée dans un placard fermé (sans lumière) finit-elle par dépérir, même si elle est arrosée
    régulièrement ?
  solution: 'Sans lumière, la photosynthèse ne peut pas avoir lieu : la plante ne peut plus produire la matière organique
    dont elle a besoin pour vivre, même si elle reçoit de l''eau.'
exercices:
- id: elements-photosynthese
  type: association
  difficulte: 1
  enonce: Associe chaque élément prélevé par la plante à son lieu de prélèvement.
  reponse:
    gauche:
    - id: a
      texte: Dioxyde de carbone
    - id: b
      texte: Eau et sels minéraux
    droite:
    - id: x
      texte: Prélevé dans l'air, par les feuilles
    - id: y
      texte: Prélevé dans le sol, par les racines
    paires:
      a: x
      b: y
  indices:
    relance: Un des deux éléments vient de l'atmosphère, l'autre du sol.
    methode: Pense à ce que respirent les feuilles, et à ce qu'absorbent les racines.
    etape: Le dioxyde de carbone est un gaz de l'air ; l'eau et les sels minéraux se trouvent dans le sol.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre un gaz atmosphérique et des éléments du sol.
  - si:
      diagnostic: associations_fausses
    relance: Le dioxyde de carbone est prélevé dans l'air par les feuilles ; l'eau et les sels minéraux sont prélevés dans
      le sol par les racines.
  solution: Le dioxyde de carbone est prélevé dans l'air par les feuilles. L'eau et les sels minéraux sont prélevés dans le
    sol par les racines.
- id: mot-energie-indispensable
  type: texte_court
  difficulte: 1
  enonce: Quel type d'énergie, capté par la chlorophylle, est indispensable à la photosynthèse ?
  reponse:
    acceptees:
    - énergie lumineuse
    - lumière
    fautes_tolerees: 1
  indices:
    relance: Sans cette énergie, une plante placée dans un placard fermé finit par dépérir, même arrosée.
    methode: Pense à ce que capte la chlorophylle dans les feuilles, provenant du Soleil ou d'un éclairage artificiel.
    etape: Cette énergie vient du jour ou d'un éclairage artificiel, jamais de l'obscurité.
  pieges:
  - si:
      valeur: chaleur
    relance: La chaleur n'est pas ce qui est capté par la chlorophylle pour la photosynthèse ; pense plutôt à ce qui provient
      directement du Soleil ou d'un éclairage.
  solution: L'énergie lumineuse, captée par la chlorophylle des feuilles, est indispensable à la photosynthèse.
- id: choix-sens-seve-elaboree
  type: choix
  difficulte: 2
  enonce: Quelle sève transporte les sucres produits par la photosynthèse, et dans quel sens circule-t-elle ?
  reponse:
    options:
    - id: a
      texte: La sève élaborée, qui circule des feuilles vers le reste de la plante
    - id: b
      texte: La sève brute, qui circule des feuilles vers les racines
    - id: c
      texte: La sève élaborée, qui circule des racines vers les feuilles
    bonnes:
    - a
  indices:
    relance: 'Les sucres sont produits dans les feuilles : dans quel sens doivent-ils ensuite être distribués ?'
    methode: Élimine les réponses qui inversent le sens de circulation ou confondent les deux types de sève.
    etape: La sève élaborée, riche en sucres, part du lieu de production (les feuilles) vers le reste de la plante.
  pieges:
  - si:
      contient:
      - b
    relance: La sève brute transporte l'eau et les sels minéraux des racines vers les feuilles, pas les sucres, et pas dans
      ce sens.
  - si:
      contient:
      - c
    relance: 'Le sens est inversé : les sucres sont produits dans les feuilles, donc la sève élaborée part des feuilles, pas
      des racines.'
  solution: La sève élaborée transporte les sucres produits par la photosynthèse ; elle circule des feuilles vers le reste
    de la plante (tiges, racines, fruits).
- id: developpement-plante-autotrophe
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique pourquoi on dit qu''une plante chlorophyllienne est autotrophe, en la comparant
    à la nutrition d''un animal.'
  criteres:
  - L'élève explique que la plante fabrique elle-même sa matière organique grâce à la photosynthèse.
  - L'élève cite les éléments nécessaires à cette fabrication (CO2, eau, sels minéraux, lumière).
  - L'élève compare avec un animal, qui doit se nourrir d'autres êtres vivants pour obtenir sa matière organique.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Compare avec la nutrition d'un animal, qui doit manger d'autres êtres vivants.
    methode: Rappelle d'abord ce que fabrique la plante par photosynthèse, puis compare avec le mode de nutrition d'un animal.
    etape: Tu peux commencer ainsi « On dit qu'une plante chlorophyllienne est autotrophe car... »
  solution: 'On dit qu''une plante chlorophyllienne est autotrophe car elle fabrique elle-même sa matière organique, sans
    avoir besoin de se nourrir d''autres êtres vivants. Grâce à la photosynthèse, elle utilise le dioxyde de carbone prélevé
    dans l''air, l''eau et les sels minéraux prélevés dans le sol, ainsi que l''énergie lumineuse captée par la chlorophylle,
    pour produire des sucres et d''autres matières organiques. À l''inverse, un animal est hétérotrophe : il doit consommer
    d''autres êtres vivants (végétaux ou animaux) pour obtenir la matière organique dont il a besoin, car il ne peut pas la
    fabriquer lui-même. Cette différence explique pourquoi les plantes chlorophylliennes n''ont pas besoin de chasser ou de
    se déplacer pour se nourrir.'
- id: ordre-trajet-matiere-plante
  type: ordre
  difficulte: 2
  enonce: Range ces étapes dans l'ordre logique du trajet de la matière dans une plante chlorophyllienne, du prélèvement jusqu'au
    stockage.
  reponse:
    elements:
    - id: prelevement
      texte: Les racines prélèvent l'eau et les sels minéraux dans le sol
    - id: montee
      texte: La sève brute monte des racines jusqu'aux feuilles
    - id: photosynthese
      texte: Les feuilles réalisent la photosynthèse grâce à la lumière et au CO2
    - id: distribution
      texte: La sève élaborée, riche en sucres, redescend vers les organes de stockage
  indices:
    relance: Que doit-il se passer en premier pour que la photosynthèse puisse avoir lieu dans les feuilles ?
    methode: Pars du prélèvement dans le sol, puis suis la montée de la sève brute jusqu'aux feuilles, avant la production
      et la redistribution des sucres.
    etape: Le prélèvement dans le sol vient en premier ; la redistribution des sucres vers les organes de stockage est la
      dernière étape.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle des deux doit se produire avant l'autre dans ce trajet ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par le prélèvement dans le sol et termine par la redistribution des sucres vers les organes de stockage.
  solution: Les racines prélèvent l'eau et les sels minéraux dans le sol, la sève brute monte jusqu'aux feuilles, les feuilles
    réalisent la photosynthèse, la sève élaborée redescend vers les organes de stockage.
