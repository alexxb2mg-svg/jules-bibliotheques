format: 2
notion: relations-parente-classification
version: 1
etat: verifiee
declencheurs:
- arbre du vivant
- classification phylogénétique
- Homo sapiens classification
- dauphin mammifère pas poisson
- groupe animal de l'être humain
- ancêtre commun récent
- ressemblance visible trompeuse
prerequis: []
essentiel: 'La classification scientifique des êtres vivants regroupe les espèces selon les caractères qu''elles partagent,
  ce qui reflète leurs relations de parenté (leur degré de proximité évolutive).


  La classification classique, souvent enseignée à l''école, se fondait sur des ressemblances visibles ; la classification
  phylogénétique moderne se fonde sur les liens de parenté réels, établis notamment grâce à la comparaison de caractères anatomiques
  et, aujourd''hui, de l''ADN.


  Deux espèces qui partagent plus de caractères communs (et un ancêtre commun plus récent) sont considérées comme plus proches
  parentes que deux espèces qui partagent moins de caractères.


  Cette classification s''applique à tous les êtres vivants : animaux, végétaux, champignons, bactéries.


  L''espèce humaine, Homo sapiens, est elle aussi classée selon ces principes : elle appartient au groupe des Vertébrés, puis
  des Mammifères, puis des Primates, ce qui reflète sa parenté avec d''autres espèces animales, notamment les grands singes.'
methode:
- Comparer les caractères de plusieurs espèces pour établir des groupes de parenté.
- Retenir que plus deux espèces partagent de caractères communs, plus elles sont considérées comme proches parentes.
- Distinguer classification classique (ressemblances visibles) et classification phylogénétique (liens de parenté réels).
- Situer Homo sapiens dans la classification, en lien avec les autres Vertébrés et Primates.
vocabulaire:
- terme: classification phylogénétique
  definition: une classification des êtres vivants fondée sur les liens de parenté réels, établis à partir des caractères
    anatomiques et de l'ADN
- terme: ancêtre commun
  definition: un être vivant dont descendent plusieurs espèces actuelles, ce qui explique leur parenté
- terme: convergence évolutive
  definition: une ressemblance apparue chez deux espèces non proches parentes, due à une adaptation au même milieu
erreurs_frequentes:
- Croire qu'une classification se fait uniquement sur l'aspect extérieur, sans tenir compte de la parenté réelle.
- Penser que l'espèce humaine est classée à part, en dehors du règne animal.
- Confondre ressemblance superficielle (comme entre un dauphin et un poisson) et parenté réelle (le dauphin est un mammifère,
  plus proche parent des autres mammifères).
- Croire que la classification scientifique est figée et ne change jamais avec les découvertes.
exemple:
  enonce: Le dauphin ressemble beaucoup à un poisson (forme du corps, vie aquatique), mais il est classé parmi les mammifères.
    Pourquoi ?
  solution: 'La classification se fonde sur les liens de parenté réels, pas seulement sur la ressemblance visible : le dauphin
    partage avec les autres mammifères des caractères hérités d''un ancêtre commun (allaitement, respiration pulmonaire, squelette
    de type mammifère), malgré une forme extérieure adaptée à la vie aquatique, semblable à celle des poissons.'
exercices:
- id: choix-fiabilite-phylogenetique
  type: choix
  difficulte: 2
  enonce: Pourquoi dit-on que la classification phylogénétique est plus fiable que la classification classique fondée sur
    les ressemblances visibles ?
  reponse:
    options:
    - id: a
      texte: Parce que deux espèces peuvent se ressembler par adaptation à un même milieu sans être proches parentes
    - id: b
      texte: Parce que les ressemblances visibles sont toujours un signe fiable de parenté réelle
    - id: c
      texte: Parce que l'ADN n'a jamais été utilisé dans la classification des espèces
    bonnes:
    - a
  indices:
    relance: Pense à ce qui peut tromper une classification basée seulement sur l'apparence, comme deux espèces vivant dans
      le même milieu.
    methode: Élimine les réponses qui affirment que les ressemblances visibles sont toujours fiables, ou qui nient l'usage
      de l'ADN.
    etape: Deux espèces adaptées à un même milieu peuvent se ressembler sans être proches parentes ; c'est ce que corrige
      la classification phylogénétique.
  pieges:
  - si:
      contient:
      - b
    relance: Les ressemblances visibles peuvent au contraire tromper, comme dans le cas du dauphin et du poisson, qui ne sont
      pas proches parents malgré leur ressemblance.
  - si:
      contient:
      - c
    relance: L'ADN est au contraire utilisé aujourd'hui pour établir des liens de parenté réels entre les espèces.
  solution: 'Deux espèces peuvent se ressembler par adaptation à un même milieu sans être proches parentes (convergence évolutive)
    : la classification phylogénétique se fonde sur des liens de parenté réels (caractères hérités, ADN), plus fiables que
    la seule apparence.'
- id: mot-groupes-homo-sapiens
  type: texte_court
  difficulte: 1
  enonce: En plus des Primates, à quel grand groupe d'animaux qui allaitent leurs petits appartient Homo sapiens ?
  reponse:
    acceptees:
    - mammifères
    - mammifère
    fautes_tolerees: 1
  indices:
    relance: Pense aux caractères partagés avec les autres animaux qui allaitent leurs petits.
    methode: Ce groupe inclut aussi les chiens, les chats, les dauphins et les grands singes.
    etape: Ce mot vient du latin « mamma », qui signifie mamelle.
  pieges:
  - si:
      valeur: vertébrés
    relance: Homo sapiens appartient bien aux Vertébrés, mais la question porte sur le groupe plus précis des animaux qui
      allaitent leurs petits.
  solution: Homo sapiens appartient aux Mammifères, en plus des Primates et des Vertébrés.
- id: association-caracteres-parente
  type: association
  difficulte: 2
  enonce: Associe chaque situation à la conclusion qu'elle permet de tirer sur la parenté entre deux espèces.
  reponse:
    gauche:
    - id: a
      texte: Deux espèces partagent de nombreux caractères communs hérités
    - id: b
      texte: Deux espèces partagent une ressemblance due à l'adaptation au même milieu
    droite:
    - id: x
      texte: Elles sont considérées comme proches parentes
    - id: y
      texte: Elles ne sont pas forcément proches parentes
    paires:
      a: x
      b: y
  indices:
    relance: Un des deux cas décrit un héritage commun, l'autre une simple adaptation au milieu.
    methode: Repère la situation qui décrit un héritage de caractères (parenté réelle) et celle qui décrit une adaptation
      indépendante (convergence).
    etape: Les caractères hérités indiquent une parenté réelle ; une ressemblance due au milieu peut tromper sans indiquer
      de parenté.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre un caractère hérité et une simple adaptation
      au milieu.
  - si:
      diagnostic: associations_fausses
    relance: 'Repense à l''exemple du dauphin et du poisson : leur ressemblance vient du milieu, pas d''une parenté réelle.'
  solution: Des caractères communs hérités indiquent que deux espèces sont proches parentes. Une ressemblance due à l'adaptation
    au même milieu n'indique pas forcément une parenté proche.
- id: choix-quantite-caracteres-communs
  type: choix
  difficulte: 1
  enonce: Deux espèces qui partagent de nombreux caractères communs sont-elles considérées comme plus ou moins proches parentes
    que deux espèces qui en partagent peu ?
  reponse:
    options:
    - id: a
      texte: Plus proches parentes, car cela suggère un ancêtre commun plus récent
    - id: b
      texte: Moins proches parentes, car les caractères communs n'ont aucun lien avec la parenté
    - id: c
      texte: Cela ne permet de tirer aucune conclusion sur leur parenté
    bonnes:
    - a
  indices:
    relance: Pense au lien entre caractères partagés et ancêtre commun récent.
    methode: Élimine les réponses qui nient tout lien entre caractères communs et parenté.
    etape: Plus deux espèces partagent de caractères hérités, plus leur ancêtre commun est probablement récent.
  pieges:
  - si:
      contient:
      - b
    relance: Les caractères communs ont au contraire un lien direct avec la parenté, lorsqu'ils sont hérités d'un ancêtre
      commun.
  - si:
      contient:
      - c
    relance: Le nombre de caractères communs hérités permet justement de tirer des conclusions sur le degré de parenté entre
      espèces.
  solution: 'Elles sont considérées comme plus proches parentes : plus de caractères communs hérités suggèrent un ancêtre
    commun plus récent.'
- id: developpement-classification-homme
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique comment la classification phylogénétique permet de situer Homo sapiens parmi
    les autres êtres vivants, en donnant un exemple de groupe auquel il appartient.'
  criteres:
  - L'élève explique le principe de la classification phylogénétique (caractères partagés, liens de parenté réels).
  - L'élève cite au moins un grand groupe auquel appartient Homo sapiens (Vertébrés, Mammifères ou Primates).
  - L'élève relie ce classement à une parenté avec d'autres espèces animales, comme les grands singes.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: 'Repense aux grands groupes cités dans ta leçon : Vertébrés, Mammifères, Primates.'
    methode: Commence par le principe général de la classification, puis applique-le à Homo sapiens.
    etape: Tu peux commencer ainsi « La classification phylogénétique regroupe les espèces selon leurs liens de parenté réels...
      »
  solution: 'La classification phylogénétique regroupe les espèces selon leurs liens de parenté réels, établis à partir des
    caractères qu''elles partagent, notamment grâce à la comparaison de l''ADN. Homo sapiens est classé selon ces mêmes principes
    : il appartient au groupe des Vertébrés, puis des Mammifères (animaux qui allaitent leurs petits), puis des Primates.
    Ce classement reflète sa parenté réelle avec d''autres espèces animales, en particulier les grands singes, avec lesquels
    il partage de nombreux caractères hérités d''un ancêtre commun. Ainsi, la classification phylogénétique montre que l''espèce
    humaine ne se situe pas à part du reste du monde vivant, mais bien à l''intérieur du règne animal, en lien de parenté
    avec d''autres espèces.'
