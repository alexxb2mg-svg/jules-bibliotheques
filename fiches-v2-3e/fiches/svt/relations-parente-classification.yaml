format: 2
notion: relations-parente-classification
version: 2
etat: verifiee
declencheurs:
- groupes emboîtés
- l'homme descend du singe
- ancêtre commun avec le chimpanzé
- caractères en commun
- tableau de caractères
- arbre de parenté
- l'humain est un primate
- qui est le plus proche parent
- poils et mamelles
prerequis:
- evolution-especes
essentiel: 'Pour classer les êtres vivants, on regarde les caractères qu''ils possèdent en commun (squelette, membres, poils,
  plumes...). On ne les classe ni selon ce qui leur manque, ni selon leur milieu de vie, ni selon leur régime alimentaire.


  Chaque groupe est défini par un caractère partagé par tous ses membres. Les groupes sont emboîtés les uns dans les autres,
  comme des poupées russes.

  - Les Vertébrés ont un squelette interne avec une colonne vertébrale.

  - Parmi eux, les Tétrapodes ont en plus quatre membres.

  - Parmi eux, les Mammifères ont en plus des poils et des mamelles.

  - Parmi eux, les Primates ont en plus un pouce opposable et des ongles plats.

  Les Oiseaux sont aussi des Tétrapodes : ils ont des plumes.


  Plus deux espèces partagent de caractères, plus elles sont proches parentes. Cela s''explique par l''évolution : ces caractères
  ont été hérités d''un ancêtre commun. Deux espèces proches ont un ancêtre commun récent ; deux espèces éloignées ont un
  ancêtre commun plus ancien.


  Un caractère nouveau apparaît chez un ancêtre et se transmet à tous ses descendants. C''est pourquoi les groupes sont emboîtés.


  Les relations de parenté se représentent par un arbre de parenté : chaque embranchement correspond à un ancêtre commun,
  et les caractères partagés sont placés sur l''arbre.


  Homo sapiens (l''être humain) est un Vertébré, un Tétrapode, un Mammifère et un Primate. Ses plus proches parents actuels
  sont le chimpanzé et le bonobo. L''être humain ne descend pas du chimpanzé : ils ont un ancêtre commun, qui vivait il y
  a plusieurs millions d''années, et chacun a évolué de son côté depuis.


  Au brevet : on te donne un tableau de caractères ou un arbre. Tu dois regrouper les espèces, dire qui est le plus proche
  parent de qui, et justifier par les caractères partagés.

  '
methode:
- Faire la liste des caractères observés chez chaque espèce (ce qu'elle possède).
- Compter les caractères partagés par chaque paire d'espèces.
- Regrouper les espèces qui partagent un même caractère, du groupe le plus large au plus restreint.
- Conclure que les espèces qui partagent le plus de caractères sont les plus proches parentes (ancêtre commun le plus récent).
- Si on demande d'expliquer, citer l'ancêtre commun et le caractère hérité, sans dire qu'une espèce actuelle descend d'une
  autre.
vocabulaire:
- terme: caractère partagé
  definition: Attribut (organe, structure) que possèdent plusieurs espèces, hérité d'un ancêtre commun.
- terme: groupes emboîtés
  definition: Groupes rangés les uns dans les autres, chaque groupe étant défini par un caractère partagé.
- terme: ancêtre commun
  definition: Espèce disparue dont descendent plusieurs espèces actuelles.
- terme: Tétrapodes
  definition: Vertébrés qui possèdent quatre membres.
- terme: Mammifères
  definition: Tétrapodes qui ont des poils et des mamelles.
- terme: Primates
  definition: Mammifères qui ont un pouce opposable et des ongles plats.
- terme: arbre de parenté
  definition: Schéma qui montre les relations de parenté entre espèces, à partir de leurs caractères partagés.
- terme: parenté
  definition: Lien entre deux espèces qui ont un ancêtre commun.
erreurs_frequentes:
- Croire que l'homme descend du singe ou du chimpanzé, alors qu'ils ont un ancêtre commun.
- Classer un animal d'après ce qui lui manque (« invertébrés », « sans pattes »), au lieu de ce qu'il possède.
- Regrouper les animaux selon leur milieu de vie (la baleine avec les poissons) au lieu de leurs caractères (la baleine a
  des mamelles, c'est un Mammifère).
- Penser que les espèces actuelles ont cessé d'évoluer, ou qu'une espèce actuelle peut être l'ancêtre d'une autre espèce actuelle.
- 'Croire que deux espèces qui se ressemblent sont forcément proches parentes : c''est le partage de caractères hérités qui
  compte.'
exemple:
  enonce: La baleine vit dans l'eau comme la truite, mais elle respire par des poumons et allaite ses petits avec ses mamelles.
    Dans quel groupe la classe-t-on ?
  solution: 'On classe la baleine d''après les caractères qu''elle possède, pas d''après son milieu de vie. Elle a des mamelles
    : c''est un Mammifère, comme la souris ou l''être humain. Elle est plus proche parente de la souris que de la truite.'
exercices:
- id: sur-quoi-on-classe
  type: choix
  difficulte: 1
  enonce: Pour ranger des animaux dans un même groupe, sur quoi se fonde-t-on ?
  reponse:
    options:
    - id: a
      texte: Sur les caractères qu'ils possèdent en commun.
    - id: b
      texte: Sur le milieu où ils vivent.
    - id: c
      texte: Sur ce qui leur manque.
    - id: d
      texte: Sur ce qu'ils mangent.
    bonnes:
    - a
  indices:
    relance: La baleine et la truite vivent toutes deux dans l'eau. Sont-elles pour autant dans le même groupe ?
    methode: Demande-toi quelle méthode permet de construire des groupes emboîtés, chacun défini par un caractère.
    etape: Un groupe se définit par un caractère que tous ses membres ont, par exemple des plumes. Élimine les réponses qui
      ne parlent pas de caractères possédés.
  pieges:
  - si:
      contient:
      - b
    relance: La baleine vit dans l'eau, mais elle a des mamelles comme la souris. Le milieu de vie dit-il qui est parent de
      qui ?
  - si:
      contient:
      - c
    relance: Dire « sans pattes » regroupe le serpent, le ver de terre et la truite, qui ne sont pas proches parents. Classe-t-on
      sur une absence ?
  - si:
      contient:
      - d
    relance: Le lion et l'aigle mangent tous deux de la viande. Sont-ils pour autant dans le même groupe ?
  solution: a. On classe les êtres vivants d'après les caractères qu'ils possèdent en commun, car ils ont été hérités d'un
    ancêtre commun. Le milieu, le régime alimentaire ou une absence de caractère ne disent rien de la parenté.
- id: ancetre-homme-chimpanze
  type: texte_court
  difficulte: 1
  enonce: L'être humain et le chimpanzé partagent de nombreux caractères. Tous deux descendent d'une même espèce disparue.
    Comment appelle-t-on cette espèce par rapport à eux ?
  reponse:
    acceptees:
    - ancêtre commun
    - un ancêtre commun
    - dernier ancêtre commun
    fautes_tolerees: 1
  indices:
    relance: Tes grands-parents sont à la fois les tiens et ceux de tes cousins. Quel mot désigne une espèce dont d'autres
      descendent ?
    methode: 'La réponse tient en deux mots : un nom qui veut dire « qui vivait avant et dont on descend », et un adjectif
      qui veut dire « partagé ».'
    etape: Le premier mot commence par « an... » et se termine par « ...être ». Ajoute l'adjectif qui veut dire « partagé
      par les deux ».
  pieges:
  - si:
      valeur: chimpanzé
    relance: Le chimpanzé est une espèce actuelle, qui a évolué elle aussi. Ce n'est pas lui dont l'être humain descend. Comment
      appelle-t-on l'espèce disparue dont les deux descendent ?
  - si:
      valeur: singe
    relance: « L'homme descend du singe » est une idée fausse. On cherche le nom de l'espèce disparue dont descendent à la
      fois l'être humain et le chimpanzé.
  solution: 'C''est leur ancêtre commun. L''être humain et le chimpanzé sont comme des cousins : ils descendent tous deux
    d''un ancêtre commun qui vivait il y a plusieurs millions d''années.'
- id: caracteres-et-groupes
  type: association
  difficulte: 2
  enonce: Associe chaque caractère (a, b, c, d) au groupe qu'il définit (w, x, y, z).
  reponse:
    gauche:
    - id: a
      texte: squelette interne avec une colonne vertébrale
    - id: b
      texte: quatre membres
    - id: c
      texte: poils et mamelles
    - id: d
      texte: plumes
    droite:
    - id: w
      texte: Vertébrés
    - id: x
      texte: Tétrapodes
    - id: y
      texte: Mammifères
    - id: z
      texte: Oiseaux
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Quel groupe tire son nom de la colonne faite de vertèbres ?
    methode: Aide-toi du sens des mots. « Tétra » veut dire quatre et « pode » veut dire pied. Et que fabriquent les mamelles
      ?
    etape: Le caractère a définit le groupe le plus large. Ensuite, les groupes sont de plus en plus petits.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule erreur. Rappelle-toi que « Tétra- » signifie quatre.
  - si:
      diagnostic: associations_fausses
    relance: Reprends caractère par caractère. Quel est le seul groupe d'animaux actuels qui a des plumes ?
  solution: a-w (colonne vertébrale, les Vertébrés), b-x (quatre membres, les Tétrapodes), c-y (poils et mamelles, les Mammifères),
    d-z (plumes, les Oiseaux).
- id: caracteres-partages-humain-lezard
  type: nombre
  difficulte: 2
  enonce: 'Document (tableau décrit en texte) : caractère 1, squelette interne avec colonne vertébrale (humain, chimpanzé,
    souris, lézard, truite) ; caractère 2, quatre membres (humain, chimpanzé, souris, lézard) ; caractère 3, poils et mamelles
    (humain, chimpanzé, souris) ; caractère 4, pouce opposable et ongles plats (humain, chimpanzé). Combien de ces caractères
    l''humain et le lézard ont-ils en commun ? Écris seulement le nombre.'
  reponse:
    valeur: 2
    forme: entier
  indices:
    relance: Pour chaque caractère, regarde si l'humain ET le lézard figurent dans la liste.
    methode: Passe les caractères un par un et coche ceux où les deux espèces apparaissent. Compte ensuite les coches.
    etape: Le caractère 1 est partagé par les deux. Vérifie maintenant les caractères suivants.
  pieges:
  - si:
      valeur: 4
    relance: L'humain possède les quatre caractères, mais le lézard les a-t-il tous ? A-t-il des poils ?
  - si:
      valeur: 3
    relance: Le lézard a-t-il des poils et des mamelles ? Vérifie la liste du caractère 3.
  - si:
      valeur: 1
    relance: Tu as trouvé la colonne vertébrale. Regarde bien la ligne des quatre membres. Le lézard y est-il ?
  solution: L'humain et le lézard partagent la colonne vertébrale et les quatre membres, soit 2 caractères. Ce sont deux Tétrapodes,
    mais le lézard n'est pas un Mammifère.
- id: groupes-de-l-humain
  type: ordre
  difficulte: 2
  enonce: Range ces groupes auxquels appartient l'être humain, du plus large (qui contient le plus d'espèces) au plus restreint.
  reponse:
    elements:
    - id: a
      texte: Vertébrés
    - id: b
      texte: Tétrapodes
    - id: c
      texte: Mammifères
    - id: d
      texte: Primates
    - id: e
      texte: espèce Homo sapiens
  indices:
    relance: Quel groupe contient à la fois la truite, le lézard, la souris et l'humain ?
    methode: Un groupe emboîté dans un autre est plus petit. Cherche, pour chaque groupe, lequel le contient.
    etape: Le plus large est défini par la colonne vertébrale. Parmi ses membres, lesquels ont quatre membres ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux groupes voisins sont inversés. Tous les Tétrapodes sont-ils des Mammifères, ou est-ce l'inverse
      ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pars du plus grand groupe, celui de la colonne vertébrale, et descends pas à pas : quatre membres, puis poils
      et mamelles, puis pouce opposable, puis l''espèce.'
  solution: 'a, b, c, d, e : Vertébrés (colonne vertébrale), Tétrapodes (quatre membres), Mammifères (poils et mamelles),
    Primates (pouce opposable, ongles plats), et enfin l''espèce Homo sapiens.'
- id: groupe-le-plus-proche
  type: choix
  difficulte: 2
  enonce: 'Document (fictif) : caractères partagés. Squelette avec colonne vertébrale : saumon, grenouille, chat, humain.
    Quatre membres : grenouille, chat, humain. Poils et mamelles : chat, humain. Pouce opposable : humain seulement. Parmi
    ces animaux, lequel est le plus proche parent de l''humain ?'
  reponse:
    options:
    - id: a
      texte: Le saumon.
    - id: b
      texte: La grenouille.
    - id: c
      texte: Le chat.
    - id: d
      texte: Aucun, ils sont tous aussi proches.
    bonnes:
    - c
  indices:
    relance: Compte les caractères que l'humain partage avec chaque animal.
    methode: Plus deux espèces partagent de caractères, plus elles sont proches parentes.
    etape: Le saumon en partage 1, la grenouille 2. Combien en partage l'animal restant ?
  pieges:
  - si:
      contient:
      - a
    relance: Le saumon partage un seul caractère avec l'humain. Y a-t-il un animal qui en partage plus ?
  - si:
      contient:
      - b
    relance: La grenouille partage deux caractères avec l'humain. Cherche un animal qui en partage davantage.
  - si:
      contient:
      - d
    relance: Les nombres de caractères partagés ne sont pas les mêmes selon les animaux. Compare-les.
  solution: 'Humain-saumon : 1 caractère. Humain-grenouille : 2. Humain-chat : 3 (colonne vertébrale, quatre membres, poils
    et mamelles). Le chat partage le plus de caractères, c''est donc le plus proche parent de l''humain.'
- id: classer-la-chauve-souris
  type: texte_court
  difficulte: 2
  enonce: La chauve-souris vole comme un oiseau, mais elle a des poils et allaite ses petits avec des mamelles. Dans quel
    groupe d'êtres vivants la classe-t-on ? Réponds par un mot.
  reponse:
    acceptees:
    - mammifère
    - mammifères
    - les mammifères
    - un mammifère
    fautes_tolerees: 1
  indices:
    relance: On classe d'après les caractères possédés, pas d'après le mode de déplacement.
    methode: Cherche le groupe défini par la présence de poils et de mamelles.
    etape: C'est le même groupe que celui de la souris, du chat et de l'être humain.
  pieges:
  - si:
      valeur: oiseau
    relance: Les oiseaux ont des plumes. Ce caractère est-il présent chez la chauve-souris ?
  - si:
      valeur: oiseaux
    relance: Les oiseaux ont des plumes. Ce caractère est-il présent chez la chauve-souris ?
  solution: 'La chauve-souris a des poils et des mamelles : c''est un Mammifère. Voler est un mode de déplacement, pas un
    caractère qui définit un groupe.'
- id: l-homme-descend-il-du-chimpanze
  type: ouverte
  difficulte: 3
  enonce: 'Un élève affirme : « L''homme descend du chimpanzé, puisqu''ils se ressemblent beaucoup. » Document (tableau de
    caractères résumé) : l''humain partage 4 caractères avec le chimpanzé, 3 avec la souris, 2 avec le lézard, 1 avec la truite.
    En t''appuyant sur ce document, argumente pour corriger cette affirmation.'
  criteres:
  - L'élève utilise le tableau pour montrer que le chimpanzé est l'espèce qui partage le plus de caractères avec l'humain,
    donc son plus proche parent parmi ces espèces.
  - L'élève explique que des caractères partagés ont été hérités d'un ancêtre commun, et non transmis par l'une des deux espèces
    actuelles à l'autre.
  - L'élève conclut que l'humain ne descend pas du chimpanzé, mais que tous deux descendent d'un ancêtre commun et ont chacun
    évolué depuis (ce sont des cousins).
  indices:
    relance: Avec quelle espèce du tableau l'humain partage-t-il le plus de caractères ? Qu'est-ce que cela veut dire ?
    methode: 'Organise ta réponse en trois temps : ce que montre le tableau, comment on explique des caractères partagés,
      puis ta conclusion sur la phrase de l''élève.'
    etape: 'Tes cousins te ressemblent, mais tu ne descends pas d''eux : vous avez des grands-parents en commun. Applique
      ce raisonnement à l''humain et au chimpanzé.'
  solution: 'Le chimpanzé partage 4 caractères avec l''humain, plus que la souris (3), le lézard (2) ou la truite (1) : c''est
    son plus proche parent dans ce tableau. Mais partager des caractères ne veut pas dire descendre l''un de l''autre : ces
    caractères ont été hérités d''un ancêtre commun, une espèce disparue qui vivait il y a plusieurs millions d''années. Depuis,
    les deux lignées ont évolué chacune de leur côté. L''humain ne descend donc pas du chimpanzé : ce sont des cousins, qui
    ont un ancêtre commun.'
- id: nblm-sur-quel-critere-scientifique-repose-la-1
  type: choix
  difficulte: 2
  enonce: Sur quel critère scientifique repose la classification moderne des êtres vivants dans des groupes emboîtés ?
  reponse:
    options:
    - id: o1
      texte: Les caractères qu'ils possèdent en commun
    - id: o2
      texte: Leur milieu de vie commun
    - id: o3
      texte: Les caractères qu'ils ne possèdent pas
    - id: o4
      texte: Leur régime alimentaire identique
    bonnes:
    - o1
  indices:
    relance: Pense aux attributs anatomiques partagés par les organismes et non à leur habitat.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le milieu de vie (eau, terre, air) ne reflète pas les liens de parenté évolutifs.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : on ne classe pas un organisme sur la base d''une absence de caractère (comme la catégorie
      ''invertébrés'').'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : avoir un régime alimentaire semblable ne prouve pas une proximité évolutive.'
  solution: 'Les caractères qu''ils possèdent en commun. C''est exact : la classification scientifique regroupe les êtres
    vivants selon les attributs anatomiques qu''ils partagent.'
