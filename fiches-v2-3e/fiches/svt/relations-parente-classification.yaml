    ce que possède chaque espèce.'
- id: nblm-que-representent-les-nuds-ou-intersectio-5
  type: choix
  difficulte: 2
  enonce: Que représentent les nœuds (ou intersections des branches) dans un arbre de parenté ?
  reponse:
    options:
    - id: o1
      texte: Des ancêtres communs disparus
    - id: o2
      texte: Des espèces actuelles encore vivantes
    - id: o3
      texte: Des lieux de vie partagés
    - id: o4
      texte: Des caractères absents
    bonnes:
    - o1
  indices:
    relance: Les nœuds marquent le point d'origine partagé par plusieurs lignées évolutives.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : les espèces actuelles se trouvent aux extrémités des branches, pas aux nœuds.'
  - si:
      contient:
      - o3
    relance: 'Erreur : l''arbre de parenté représente des relations évolutives, pas des zones géographiques.'
  - si:
      contient:
      - o4
    relance: 'Erreur : les nœuds ne symbolisent pas une absence de caractère.'
  solution: 'Des ancêtres communs disparus. C''est exact : chaque nœud représente un ancêtre commun hypothétique dont ont
    hérité les espèces des branches suivantes.'
- id: nblm-parmi-les-propositions-suivantes-sur-la-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes sur la classification des êtres vivants, lesquelles sont exactes ? (2 réponses
    attendues) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Chaque groupe est défini par un caractère partagé par tous ses membres
    - id: o2
      texte: Les groupes sont emboîtés les uns dans les autres
    - id: o3
      texte: On classe les animaux sans squelette dans le groupe des 'Invertébrés'
    - id: o4
      texte: La baleine est classée avec les poissons car elle vit dans l'eau
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les principes basés sur la présence d'attributs partagés et l'emboîtement des groupes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : ''Invertébré'' repose sur une absence de caractère (''sans vertèbres''), ce qui est exclu
      en classification scientifique.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : le milieu de vie ne sert pas de critère de classification.'
  solution: 'Chaque groupe est défini par un caractère partagé par tous ses membres ; Les groupes sont emboîtés les uns dans
    les autres. C''est exact : un groupe rassemble les espèces possédant un attribut commun hérité d''un ancêtre.'
- id: nblm-la-representation-ou-les-groupes-sont-ra-7
  type: texte_court
  difficulte: 1
  enonce: La représentation où les groupes sont rangés les uns dans les autres selon les caractères partagés s'appelle les
    groupes __________ .
  reponse:
    acceptees:
    - emboîtés
    fautes_tolerees: 1
  indices:
    relance: Pense à des boîtes de tailles différentes rangées les unes dans les autres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'emboîtés. C''est exact : les groupes emboîtés permettent d''organiser les êtres vivants de manière hiérarchique.'
- id: nblm-le-schema-montrant-les-relations-d-evolu-8
  type: texte_court
  difficulte: 1
  enonce: Le schéma montrant les relations d'évolution et les ancêtres communs entre espèces s'appelle un arbre de __________
    .
  reponse:
    acceptees:
    - parenté
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne les liens familiaux ou évolutifs entre les êtres vivants.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'parenté. C''est exact : l''arbre de parenté traduit visuellement les liens évolutifs entre les espèces.'
