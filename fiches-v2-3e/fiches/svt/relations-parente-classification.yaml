    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : une espèce actuelle ne descend jamais d''une autre espèce actuelle.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : le chimpanzé est un cousin évolutif, pas un ancêtre de l''Homme.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ce sont deux espèces proches parentes appartenant au groupe des Primates.'
  solution: 'L''être humain et le chimpanzé ont un ancêtre commun. C''est exact : l''être humain et le chimpanzé partagent
