format: 2
notion: territoires-ultramarins-francais
version: 2
etat: generee
declencheurs:
- DROM-COM
- Guadeloupe
- Martinique
- La Réunion
- Guyane française
- Mayotte
- Nouvelle-Calédonie
- outre-mer français
- DOM-TOM
- cyclone aux Antilles
prerequis: []
essentiel: |
  Les territoires ultramarins français, ou « outre-mer », sont les territoires de la République situés hors d'Europe. Ils se trouvent dans les océans Atlantique (Caraïbes), Indien et Pacifique, en Amérique du Sud (Guyane) et en Antarctique. Ils représentent environ 4 % de la population française, mais une très grande partie de la surface maritime.

  Les statuts sont variés. Les DROM (départements et régions d'outre-mer) sont cinq : Guadeloupe, Martinique, Guyane, La Réunion et Mayotte (département depuis 2011). Le droit français s'y applique presque comme en métropole (article 73 de la Constitution). Les collectivités d'outre-mer (COM), comme la Polynésie française, Saint-Pierre-et-Miquelon, Wallis-et-Futuna, Saint-Barthélemy et Saint-Martin, ont plus d'autonomie (article 74). La Nouvelle-Calédonie a un statut à part. Il existe aussi les Terres australes et antarctiques françaises (TAAF).

  Une particularité : l'espace maritime. Grâce à l'outre-mer, la France possède la deuxième zone économique exclusive (ZEE) du monde, après les États-Unis. C'est un atout : pêche, ressources, biodiversité, présence militaire et scientifique. La base spatiale de Kourou, en Guyane, lance des fusées européennes.

  Les contraintes de l'aménagement. L'éloignement de la métropole (par exemple, plus de 9 000 km pour La Réunion) rend les transports et les importations chers. Beaucoup de territoires sont des îles : c'est l'insularité, avec un marché étroit. Les risques naturels sont forts : cyclones, séismes, éruptions volcaniques (Piton de la Fournaise à La Réunion, Soufrière en Guadeloupe). Les difficultés sociales sont fortes : chômage plus élevé qu'en métropole, pauvreté, prix élevés. Mayotte est le département le plus pauvre de France.

  La Guyane est différente. Ce n'est pas une île mais un territoire continental, en grande partie couvert par la forêt amazonienne. Elle partage la plus longue frontière terrestre de la France avec le Brésil.

  Au brevet, on attend un exemple de territoire, décrit avec des cartes à plusieurs échelles (mondiale, régionale, locale), ses atouts et ses contraintes.
methode:
- 'Nommer plusieurs territoires précis : au moins deux DROM et une collectivité d''outre-mer, avec leur océan.'
- 'Distinguer les statuts : DROM (article 73), collectivités d''outre-mer (article 74), Nouvelle-Calédonie, TAAF.'
- 'Donner les deux chiffres clés : environ 4 % de la population et la deuxième zone économique exclusive du monde.'
- 'Étudier un territoire à plusieurs échelles : sa place dans le monde, dans sa région, puis l''île ou le territoire
  lui-même.'
- Présenter les contraintes (éloignement, insularité, risques naturels, coûts élevés) puis les atouts (mer, biodiversité,
  position stratégique).
- 'Conclure : chaque territoire demande un aménagement adapté à sa situation.'
vocabulaire:
- terme: outre-mer
  definition: l'ensemble des territoires français situés hors d'Europe
- terme: DROM
  definition: 'département et région d''outre-mer : Guadeloupe, Martinique, Guyane, La Réunion, Mayotte'
- terme: collectivité d'outre-mer (COM)
  definition: un territoire ultramarin au statut particulier, plus autonome qu'un DROM (par exemple la Polynésie
    française)
- terme: insularité
  definition: le fait d'être une île, ce qui isole le territoire et augmente le coût des échanges
- terme: zone économique exclusive (ZEE)
  definition: l'espace maritime, jusqu'à 200 milles marins des côtes, dont l'État exploite les ressources
- terme: région ultrapériphérique (RUP)
  definition: un territoire ultramarin qui fait partie de l'Union européenne malgré son éloignement
- terme: risque naturel
  definition: 'un danger lié à la nature : cyclone, séisme, éruption volcanique'
- terme: TAAF
  definition: les Terres australes et antarctiques françaises, territoires quasi inhabités dans l'océan Indien austral
    et en Antarctique
erreurs_frequentes:
- 'Confondre DROM et collectivité d''outre-mer : leurs statuts ne sont pas les mêmes.'
- 'Croire que tous les territoires ultramarins sont des îles : la Guyane est continentale.'
- Utiliser seulement l'ancien sigle DOM-TOM, remplacé par DROM-COM dans les textes officiels.
- 'Oublier l''atout maritime : l''outre-mer donne à la France sa très vaste zone économique exclusive.'
- Ne parler que des difficultés, sans citer un atout (biodiversité, espace maritime, position stratégique).
exemple:
  enonce: Cite deux territoires ultramarins français en donnant leur statut.
  solution: La Martinique est un département et région d'outre-mer (DROM) situé dans les Antilles ; la Polynésie
    française est une collectivité d'outre-mer, avec un statut d'autonomie plus large, située dans l'océan Pacifique.
exercices:
- id: part-population-outre-mer
  type: nombre
  difficulte: 1
  enonce: Quelle part de la population française vit dans les territoires d'outre-mer, en pourcentage arrondi à
    l'entier ?
  reponse:
    valeur: 4
    forme: entier
    tolerance: 1
  indices:
    relance: Compare ce chiffre à la part de l'outre-mer dans la superficie totale du territoire français, bien
      plus élevée.
    methode: L'outre-mer représente une part bien plus faible de la population que de la superficie totale du territoire
      français.
    etape: Ce chiffre est nettement plus faible que la part de l'outre-mer dans la superficie du territoire.
  pieges:
  - si:
      valeur: 18
    relance: 18 %, c'est environ la part de l'outre-mer dans le territoire terrestre français, pas dans sa population.
  solution: Environ 4,1 % de la population française vit dans les territoires ultramarins.
- id: drom-ou-com
  type: choix
  difficulte: 1
  enonce: La Martinique est-elle un DROM ou une collectivité d'outre-mer ?
  reponse:
    options:
    - id: a
      texte: Un DROM, régi par l'article 73 de la Constitution
    - id: b
      texte: Une collectivité d'outre-mer au statut d'autonomie large
    - id: c
      texte: Un territoire qui n'a aucun statut particulier
    bonnes:
    - a
  indices:
    relance: Pense à la Guadeloupe, à la Guyane et à La Réunion, qui partagent le même statut que la Martinique.
    methode: Les DROM sont des départements et régions d'outre-mer, régis par le même article de la Constitution
      que les autres DROM antillais et de l'océan Indien.
    etape: La Martinique est un DROM, comme la Guadeloupe, la Guyane, La Réunion et Mayotte.
  pieges:
  - si:
      contient:
      - b
    relance: L'autonomie large caractérise plutôt une collectivité d'outre-mer comme la Polynésie française, pas
      la Martinique.
  - si:
      contient:
      - c
    relance: Tout territoire ultramarin français a un statut juridique précis ; la Martinique n'échappe pas à cette
      règle.
  solution: La Martinique est un DROM (département et région d'outre-mer), régi par l'article 73 de la Constitution.
- id: mot-insularite
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le fait d'être une île, ce qui isole un territoire et augmente le coût des échanges ?
  reponse:
    acceptees:
    - insularité
    fautes_tolerees: 1
  indices:
    relance: Le mot vient du mot « île ».
    methode: Ce mot désigne une caractéristique géographique, pas un statut juridique.
    etape: Le mot commence par « insul- », comme « insulaire ».
  pieges:
  - si:
      valeur: éloignement
    relance: L'éloignement est une autre difficulté des territoires ultramarins, mais il manque le mot précis qui
      désigne le fait d'être une île.
  solution: 'L''insularité : le fait d''être une île, ce qui isole un territoire et augmente le coût des échanges.'
- id: territoires-statuts
  type: association
  difficulte: 2
  enonce: Relie chaque territoire ultramarin français à son statut.
  reponse:
    gauche:
    - id: a
      texte: La Guadeloupe
    - id: b
      texte: La Guyane
    - id: c
      texte: La Polynésie française
    droite:
    - id: x
      texte: DROM (article 73 de la Constitution)
    - id: y
      texte: DROM continental, situé en Amérique du Sud
    - id: z
      texte: Collectivité d'outre-mer au statut d'autonomie large
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: La Guyane n'est pas une île, contrairement à la plupart des autres DROM.
    methode: Repère d'abord la Polynésie française, seule collectivité d'outre-mer de la liste, puis distingue les
      deux DROM selon leur situation géographique.
    etape: La Guadeloupe est un DROM insulaire des Antilles ; la Guyane est un DROM continental d'Amérique du Sud.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère d'abord la Polynésie française (collectivité d'outre-mer),
      puis distingue les deux DROM.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le seul territoire qui n'est pas un DROM (la Polynésie française), puis distingue la
      Guadeloupe (insulaire) de la Guyane (continentale).
  solution: La Guadeloupe est un DROM régi par l'article 73 de la Constitution ; la Guyane est un DROM continental
    situé en Amérique du Sud ; la Polynésie française est une collectivité d'outre-mer au statut d'autonomie large.
- id: nombre-drom
  type: nombre
  difficulte: 1
  enonce: Combien y a-t-il de départements et régions d'outre-mer (DROM) ?
  reponse:
    valeur: 5
    forme: entier
  indices:
    relance: 'Ils portent les noms de territoires célèbres : Guadeloupe, Martinique, Guyane, La Réunion, Mayotte.
      Pense à leur statut de département.'
    methode: 'Cherche sur une carte : deux aux Antilles, un en Amérique du Sud, deux dans l''océan Indien. Additionne.'
    etape: Compte-les un par un sans oublier le plus récent, devenu département en 2011.
  pieges:
  - si:
      valeur: 4
    relance: '4, c''est trop peu : n''oublie pas Mayotte, devenue département en 2011.'
  - si:
      valeur: 13
    relance: 13 est le nombre total de territoires ultramarins, tous statuts confondus. Ici, on ne compte que les
      DROM.
  solution: 'Il y a 5 DROM : la Guadeloupe, la Martinique, la Guyane, La Réunion et Mayotte.'
- id: contraintes-outre-mer-multi
  type: choix
  difficulte: 2
  enonce: Quelles sont des contraintes de l'aménagement des territoires ultramarins ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: L'éloignement de la métropole
    - id: b
      texte: Les risques naturels (cyclones, volcans)
    - id: c
      texte: Une forte densité de grandes métropoles mondiales
    - id: d
      texte: Des coûts de transport et de la vie élevés
    bonnes:
    - a
    - b
    - d
  indices:
    relance: Une contrainte est une difficulté. Demande-toi si chaque proposition est un problème ou un avantage.
    methode: Pense à la distance, à la nature et aux prix.
    etape: 'Une proposition décrit quelque chose qui n''existe pas dans l''outre-mer : elle est fausse.'
  pieges:
  - si:
      contient:
      - c
    relance: 'Il n''y a pas de grandes métropoles mondiales dans l''outre-mer français : ce n''est pas une contrainte
      réelle.'
  solution: L'éloignement, les risques naturels et les coûts élevés sont des contraintes. Les territoires ultramarins
    n'ont pas de grandes métropoles mondiales.
- id: territoire-ocean
  type: association
  difficulte: 2
  enonce: Relie chaque territoire à l'espace géographique où il se situe.
  reponse:
    gauche:
    - id: a
      texte: La Guadeloupe
    - id: b
      texte: La Réunion
    - id: c
      texte: La Polynésie française
    - id: d
      texte: La Guyane
    droite:
    - id: x
      texte: Les Antilles (Caraïbes)
    - id: y
      texte: L'océan Indien
    - id: z
      texte: L'océan Pacifique
    - id: w
      texte: L'Amérique du Sud
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Repère d'abord la Guyane, qui n'est pas une île.
    methode: La Guadeloupe est proche de la Martinique ; La Réunion est près de Madagascar.
    etape: La Polynésie française, avec Tahiti, est très loin de tout, en plein océan.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque territoire et cherche sur une carte du monde où il
      se situe.
  - si:
      diagnostic: associations_fausses
    relance: Commence par la Guyane (continent), puis les Antilles et l'océan Indien, et termine par la Polynésie.
  solution: 'Guadeloupe : Antilles ; La Réunion : océan Indien ; Polynésie française : océan Pacifique ; Guyane
    : Amérique du Sud.'
- id: developpement-territoire-ultramarin
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : présente deux difficultés spécifiques de l''aménagement d''un territoire ultramarin
    de ton choix.'
  criteres:
  - L'élève choisit un territoire ultramarin précis (par exemple La Réunion ou la Guadeloupe).
  - L'élève présente une première difficulté (éloignement, coût des transports).
  - L'élève présente une seconde difficulté (risques naturels comme cyclones ou volcanisme).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Pourquoi l'éloignement de la métropole complique-t-il l'aménagement d'un territoire ultramarin ?
    methode: Choisis un territoire précis, présente d'abord la difficulté de l'éloignement, puis une difficulté
      liée aux risques naturels.
    etape: 'Tu peux commencer ainsi : « L''aménagement des territoires ultramarins pose des problématiques spécifiques...
      », puis choisir ton territoire.'
  solution: 'L''aménagement des territoires ultramarins pose des problématiques spécifiques. Prenons l''exemple
    de La Réunion : une première difficulté est l''éloignement de la France métropolitaine, qui augmente le coût
    des transports et des importations. Une seconde difficulté est l''exposition aux risques naturels, notamment
    l''activité volcanique du Piton de la Fournaise. Ces difficultés nécessitent des politiques d''aménagement adaptées
    à la situation propre de chaque territoire ultramarin.'
