format: 2
notion: territoires-ultramarins-francais
version: 1
etat: verifiee
declencheurs:
- DROM-COM
- Guadeloupe
- Martinique
- La Réunion
- Guyane française
- Mayotte
- Nouvelle-Calédonie
- outre-mer français
prerequis: []
essentiel: 'Les territoires ultramarins français (« France d''outre-mer ») sont les treize territoires de la République française
  situés en dehors de la France métropolitaine : en Amérique, en Océanie, dans l''océan Indien et en Antarctique. On distingue
  les DROM (départements et régions d''outre-mer, comme la Guadeloupe, la Martinique, la Guyane, La Réunion et Mayotte, régis
  par l''article 73 de la Constitution) et les collectivités d''outre-mer, aux statuts très variés (Polynésie française, Nouvelle-Calédonie...).


  L''outre-mer représente environ 17,9 % du territoire terrestre français mais seulement environ 4,1 % de sa population.


  L''aménagement de ces territoires pose des problématiques spécifiques : éloignement de la France métropolitaine, insularité
  pour la plupart d''entre eux, risques naturels (cyclones, volcans, séismes), coûts de transport élevés, mais aussi des atouts
  (vastes zones maritimes économiques, biodiversité, position stratégique dans plusieurs océans). Chaque territoire ultramarin
  nécessite donc des politiques d''aménagement adaptées à sa situation propre.'
methode:
- Nommer plusieurs territoires ultramarins précis (au moins deux DROM et une collectivité d'outre-mer).
- Distinguer DROM (départements et régions d'outre-mer) et collectivités d'outre-mer, aux statuts différents.
- 'Utiliser les deux chiffres clés : environ 18 % du territoire, environ 4 % de la population.'
- Pour étudier un territoire précis, croiser des cartes à différentes échelles (mondiale, régionale, locale).
vocabulaire:
- terme: DROM
  definition: département et région d'outre-mer, comme la Guadeloupe, la Martinique, la Guyane, La Réunion ou Mayotte
- terme: collectivité d'outre-mer
  definition: un territoire ultramarin français au statut particulier, différent de celui d'un DROM (par exemple la Polynésie
    française)
- terme: insularité
  definition: le fait d'être une île, ce qui isole un territoire et augmente le coût des échanges
erreurs_frequentes:
- 'Confondre DROM et collectivité d''outre-mer : ce ne sont pas les mêmes statuts juridiques.'
- 'Croire que tous les territoires ultramarins sont des îles : la Guyane est un territoire continental en Amérique du Sud.'
- Utiliser l'ancien sigle DOM-TOM sans savoir qu'il a été remplacé par DROM-COM dans les textes officiels.
- Oublier de préciser un ordre de grandeur (superficie ou population) dans une réponse.
exemple:
  enonce: Cite deux territoires ultramarins français en donnant leur statut.
  solution: La Martinique est un département et région d'outre-mer (DROM) situé dans les Antilles ; la Polynésie française
    est une collectivité d'outre-mer, avec un statut d'autonomie plus large, située en Océanie.
exercices:
- id: part-population-outre-mer
  type: nombre
  difficulte: 1
  enonce: Quelle part de la population française vit dans les territoires d'outre-mer, en pourcentage arrondi à l'entier ?
  reponse:
    valeur: 4
    forme: entier
    tolerance: 1
  indices:
    relance: Compare ce chiffre à la part de l'outre-mer dans la superficie totale du territoire français, bien plus élevée.
    methode: L'outre-mer représente une part bien plus faible de la population que de la superficie totale du territoire français.
    etape: Ce chiffre est nettement plus faible que la part de l'outre-mer dans la superficie du territoire.
  pieges:
  - si:
      valeur: 18
    relance: 18 %, c'est environ la part de l'outre-mer dans le territoire terrestre français, pas dans sa population.
  solution: Environ 4,1 % de la population française vit dans les territoires ultramarins.
- id: drom-ou-com
  type: choix
  difficulte: 1
  enonce: La Martinique est-elle un DROM ou une collectivité d'outre-mer ?
  reponse:
    options:
    - id: a
      texte: Un DROM, régi par l'article 73 de la Constitution
    - id: b
      texte: Une collectivité d'outre-mer au statut d'autonomie large
    - id: c
      texte: Un territoire qui n'a aucun statut particulier
    bonnes:
    - a
  indices:
    relance: Pense à la Guadeloupe, à la Guyane et à La Réunion, qui partagent le même statut que la Martinique.
    methode: Les DROM sont des départements et régions d'outre-mer, régis par le même article de la Constitution que les autres
      DROM antillais et de l'océan Indien.
    etape: La Martinique est un DROM, comme la Guadeloupe, la Guyane, La Réunion et Mayotte.
  pieges:
  - si:
      contient:
      - b
    relance: L'autonomie large caractérise plutôt une collectivité d'outre-mer comme la Polynésie française, pas la Martinique.
  - si:
      contient:
      - c
    relance: Tout territoire ultramarin français a un statut juridique précis ; la Martinique n'échappe pas à cette règle.
  solution: La Martinique est un DROM (département et région d'outre-mer), régi par l'article 73 de la Constitution.
- id: mot-insularite
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le fait d'être une île, ce qui isole un territoire et augmente le coût des échanges ?
  reponse:
    acceptees:
    - insularité
    fautes_tolerees: 1
  indices:
    relance: Le mot vient du mot « île ».
    methode: Ce mot désigne une caractéristique géographique, pas un statut juridique.
    etape: Le mot commence par « insul- », comme « insulaire ».
  pieges:
  - si:
      valeur: éloignement
    relance: L'éloignement est une autre difficulté des territoires ultramarins, mais il manque le mot précis qui désigne
      le fait d'être une île.
  solution: 'L''insularité : le fait d''être une île, ce qui isole un territoire et augmente le coût des échanges.'
- id: territoires-statuts
  type: association
  difficulte: 2
  enonce: Relie chaque territoire ultramarin français à son statut.
  reponse:
    gauche:
    - id: a
      texte: La Guadeloupe
    - id: b
      texte: La Guyane
    - id: c
      texte: La Polynésie française
    droite:
    - id: x
      texte: DROM (article 73 de la Constitution)
    - id: y
      texte: DROM continental, situé en Amérique du Sud
    - id: z
      texte: Collectivité d'outre-mer au statut d'autonomie large
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: La Guyane n'est pas une île, contrairement à la plupart des autres DROM.
    methode: Repère d'abord la Polynésie française, seule collectivité d'outre-mer de la liste, puis distingue les deux DROM
      selon leur situation géographique.
    etape: La Guadeloupe est un DROM insulaire des Antilles ; la Guyane est un DROM continental d'Amérique du Sud.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère d'abord la Polynésie française (collectivité d'outre-mer), puis distingue
      les deux DROM.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le seul territoire qui n'est pas un DROM (la Polynésie française), puis distingue la Guadeloupe
      (insulaire) de la Guyane (continentale).
  solution: La Guadeloupe est un DROM régi par l'article 73 de la Constitution ; la Guyane est un DROM continental situé en
    Amérique du Sud ; la Polynésie française est une collectivité d'outre-mer au statut d'autonomie large.
- id: developpement-territoire-ultramarin
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : présente deux difficultés spécifiques de l''aménagement d''un territoire ultramarin de
    ton choix.'
  criteres:
  - L'élève choisit un territoire ultramarin précis (par exemple La Réunion ou la Guadeloupe).
  - L'élève présente une première difficulté (éloignement, coût des transports).
  - L'élève présente une seconde difficulté (risques naturels comme cyclones ou volcanisme).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Pourquoi l'éloignement de la métropole complique-t-il l'aménagement d'un territoire ultramarin ?
    methode: Choisis un territoire précis, présente d'abord la difficulté de l'éloignement, puis une difficulté liée aux risques
      naturels.
    etape: 'Tu peux commencer ainsi : « L''aménagement des territoires ultramarins pose des problématiques spécifiques...
      », puis choisir ton territoire.'
  solution: 'L''aménagement des territoires ultramarins pose des problématiques spécifiques. Prenons l''exemple de La Réunion
    : une première difficulté est l''éloignement de la France métropolitaine, qui augmente le coût des transports et des importations.
    Une seconde difficulté est l''exposition aux risques naturels, notamment l''activité volcanique du Piton de la Fournaise.
    Ces difficultés nécessitent des politiques d''aménagement adaptées à la situation propre de chaque territoire ultramarin.'
