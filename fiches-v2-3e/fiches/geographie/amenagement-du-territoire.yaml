format: 2
notion: amenagement-du-territoire
version: 3
etat: verifiee
declencheurs:
- inégalités entre régions
- réduire les inégalités territoriales
- ligne à grande vitesse
- collectivités territoriales
- politique régionale UE
- région isolée
- croquis territoire national
- Paris et le désert français
- désenclaver une région
- fonds européens régionaux
prerequis: []
essentiel: 'L''aménagement du territoire regroupe les actions des pouvoirs publics pour organiser le territoire et réduire
  les inégalités entre les territoires : inégalités économiques (emplois, richesses), sociales (revenus, santé, éducation)
  et d''accès aux équipements et services publics (transports, écoles, hôpitaux).


  Repères. Le mot apparaît en France en 1943. En 1947, un livre dénonce « Paris et le désert français » : trop de population
  et d''activités se concentrent autour de Paris. En 1963, l''État crée la DATAR, un organisme chargé de mieux répartir les
  activités. Elle est aujourd''hui remplacée par l''Agence nationale de la cohésion des territoires (ANCT, 2020). En 1982-1983,
  les lois de décentralisation donnent plus de pouvoirs aux collectivités territoriales.


  Les acteurs. L''État fait les lois, décide du budget et des grands projets. Les collectivités territoriales, c''est-à-dire
  les régions, les départements et les communes, ont des compétences : la région s''occupe de développement économique et
  des trains régionaux, le département de l''action sociale et des collèges, la commune de l''école primaire et de l''urbanisme.
  L''Union européenne finance des projets grâce à sa politique régionale (les fonds structurels, comme le FEDER), surtout
  dans les régions les moins développées. Les entreprises et les associations participent aussi.


  Les outils. Les infrastructures de transport (lignes à grande vitesse, autoroutes, aéroports, fibre optique), le soutien
  aux entreprises (pôles de compétitivité, aides à l''installation), le maintien des services publics dans les zones rurales,
  la rénovation des quartiers en difficulté (politique de la ville). Les nouvelles régions (13 en métropole depuis 2016) sont
  plus grandes et mieux armées.


  Les échelles. Locale (un quartier, une commune), régionale, nationale (les grandes métropoles, les axes de transport), européenne
  (fonds, réseaux transeuropéens).


  Le croquis. Au brevet, on peut devoir réaliser un croquis de l''organisation du territoire national. Méthode : d''abord
  repérer les grands ensembles (Paris, métropoles, axes de transport), puis les espaces peu denses ou en difficulté, puis
  les aménagements. Chaque figuré est classé dans la légende, avec un titre.

  '
methode:
- 'Définir l''aménagement du territoire par son but : réduire les inégalités économiques, sociales et d''accès aux services
  entre les territoires.'
- 'Citer les acteurs à toutes les échelles : État, collectivités territoriales (région, département, commune), Union européenne.'
- 'Donner un exemple précis d''outil : LGV, pôle de compétitivité, fonds européen, maintien d''un service public.'
- 'Pour un croquis, hiérarchiser : Paris et les métropoles, les axes de transport, les espaces peu denses, puis les aménagements.'
- Choisir une légende organisée en parties, avec un titre, et des figurés adaptés (ponctuels, linéaires, en surface).
- 'Conclure en montrant les limites : les inégalités persistent malgré les politiques d''aménagement.'
vocabulaire:
- terme: aménagement du territoire
  definition: l'ensemble des actions publiques qui organisent le territoire et réduisent les inégalités entre les territoires
- terme: décentralisation
  definition: le transfert de compétences de l'État vers les collectivités territoriales
- terme: collectivité territoriale
  definition: une région, un département ou une commune, gérés par des élus locaux
- terme: politique régionale (UE)
  definition: les fonds européens qui financent des projets de développement dans les régions moins développées
- terme: DATAR / ANCT
  definition: l'organisme d'État chargé de l'aménagement du territoire (DATAR en 1963, ANCT depuis 2020)
- terme: infrastructure
  definition: 'un équipement de base : route, voie ferrée, aéroport, réseau numérique'
- terme: désenclaver
  definition: relier un territoire isolé aux autres par des transports ou des réseaux
- terme: pôle de compétitivité
  definition: un regroupement d'entreprises, de laboratoires et d'écoles sur un territoire pour innover ensemble
erreurs_frequentes:
- 'Croire que l''aménagement du territoire est réalisé par l''État seul : les collectivités et l''UE agissent aussi.'
- Oublier de citer un exemple concret d'outil d'aménagement.
- Confondre aménagement du territoire (politique publique) et développement économique spontané.
- Oublier l'échelle européenne dans un développement ou dans un croquis.
- Faire un croquis sans titre ni légende organisée, ou avec trop de couleurs.
exemple:
  enonce: Cite les trois niveaux d'acteurs qui interviennent dans l'aménagement du territoire français.
  solution: L'État (lois et budget national), les collectivités territoriales (régions, départements, communes, via la décentralisation)
    et l'Union européenne (politique régionale).
exercices:
- id: annee-apparition-mot
  type: nombre
  difficulte: 1
  enonce: En quelle année le mot « aménagement du territoire » apparaît-il en France ?
  reponse:
    valeur: 1943
    forme: entier
  indices:
    relance: C'est pendant la Seconde Guerre mondiale, avant le grand développement de cette politique.
    methode: La politique se développe surtout à partir de 1950, mais le mot lui-même est apparu un peu avant, dans les années
      1940.
    etape: L'année se situe dans les années 1940.
  pieges:
  - si:
      valeur: 1950
    relance: 1950, c'est la date à partir de laquelle la politique se développe vraiment, mais le mot lui-même est apparu
      un peu plus tôt.
  - si:
      valeur: 1958
    relance: 1958 est une date plus tardive. Le mot « aménagement du territoire » est apparu en France pendant la Seconde
      Guerre mondiale.
  solution: Le mot apparaît en France en 1943 et se développe surtout à partir de 1950.
- id: trois-niveaux-acteurs
  type: choix
  difficulte: 1
  enonce: Quels sont les trois niveaux d'acteurs qui interviennent dans l'aménagement du territoire français ?
  reponse:
    options:
    - id: a
      texte: L'État, les collectivités territoriales, l'Union européenne
    - id: b
      texte: L'État, les entreprises privées, les particuliers
    - id: c
      texte: Les communes, les écoles, les hôpitaux
    bonnes:
    - a
  indices:
    relance: Pense aux échelles administratives, de la France jusqu'à l'Europe.
    methode: Un niveau finance depuis le budget national, un autre depuis les collectivités locales, un dernier depuis des
      fonds européens.
    etape: L'aménagement du territoire mobilise l'État, les collectivités territoriales (régions, départements, communes)
      et l'Union européenne.
  pieges:
  - si:
      contient:
      - b
    relance: Les entreprises privées et les particuliers ne sont pas les acteurs publics qui pilotent l'aménagement du territoire.
  - si:
      contient:
      - c
    relance: Les communes sont bien un niveau de collectivité territoriale, mais les écoles et les hôpitaux ne sont pas des
      niveaux d'acteurs de l'aménagement, ce sont des équipements.
  solution: L'État, les collectivités territoriales (régions, départements, communes) et l'Union européenne.
- id: mot-decentralisation
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le transfert de compétences et de pouvoirs de l'État vers les collectivités territoriales ?
  reponse:
    acceptees:
    - décentralisation
    fautes_tolerees: 1
  indices:
    relance: C'est le contraire de la centralisation du pouvoir à Paris.
    methode: Ce mot désigne un mouvement qui donne plus d'autonomie aux régions, départements et communes.
    etape: Le mot commence par « dé- », comme un mouvement contraire à la centralisation.
  pieges:
  - si:
      valeur: régionalisation
    relance: Ce mot n'est pas le terme précis utilisé en France pour désigner le transfert de compétences de l'État vers les
      collectivités territoriales.
  solution: 'La décentralisation : le transfert de compétences et de pouvoirs de l''État vers les collectivités territoriales
    (régions, départements, communes).'
- id: acteurs-outils
  type: association
  difficulte: 2
  enonce: Relie chaque acteur à son rôle dans l'aménagement du territoire.
  reponse:
    gauche:
    - id: a
      texte: L'État
    - id: b
      texte: Une collectivité territoriale
    - id: c
      texte: L'Union européenne
    droite:
    - id: x
      texte: Vote des lois et fixe le budget national
    - id: y
      texte: Agit localement grâce aux compétences reçues par la décentralisation
    - id: z
      texte: Finance des projets grâce à sa politique régionale
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Repère d'abord l'État, dont le rôle est national (lois, budget).
    methode: 'Pour chaque acteur, demande-toi à quelle échelle il agit : nationale, locale ou européenne.'
    etape: Une collectivité territoriale agit localement grâce à la décentralisation ; l'Union européenne finance grâce à
      sa politique régionale.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque acteur en te demandant à quelle échelle il agit.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord l'État (lois et budget national), puis distingue la collectivité territoriale (action locale)
      de l'Union européenne (financement par la politique régionale).
  solution: L'État vote des lois et fixe le budget national ; une collectivité territoriale agit localement grâce aux compétences
    reçues par la décentralisation ; l'Union européenne finance des projets grâce à sa politique régionale.
- id: nombre-regions-metropole
  type: nombre
  difficulte: 1
  enonce: Depuis 2016, en combien de régions la France métropolitaine est-elle divisée ?
  reponse:
    valeur: 13
    forme: entier
  indices:
    relance: Ce nombre est plus petit qu'avant 2016, car plusieurs régions ont été regroupées.
    methode: Avant 2016, la métropole comptait 22 régions ; certaines ont fusionné.
    etape: Compte les grands ensembles régionaux sur une carte de la France métropolitaine, Corse comprise.
  pieges:
  - si:
      valeur: 22
    relance: 22, c'était le nombre de régions avant la réforme de 2016. Depuis, plusieurs ont fusionné.
  - si:
      valeur: 18
    relance: 18 compte aussi les régions d'outre-mer. Ici, on demande seulement la France métropolitaine.
  solution: Depuis la réforme de 2016, la France métropolitaine compte 13 régions (22 auparavant).
- id: chronologie-amenagement
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: mot
      texte: Le mot « aménagement du territoire » apparaît en France
    - id: datar
      texte: L'État crée la DATAR
    - id: decentralisation
      texte: Les lois de décentralisation donnent plus de pouvoirs aux collectivités
    - id: regions
      texte: La France métropolitaine passe à 13 régions
  indices:
    relance: Le mot apparaît pendant la Seconde Guerre mondiale ; la réforme des régions est la plus récente.
    methode: Place d'abord le plus ancien et le plus récent, puis classe la DATAR et la décentralisation.
    etape: La DATAR est créée dans les années 1960, la décentralisation dans les années 1980.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux événements voisins sont inversés. Lequel est le plus ancien ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le mot (1943) et la réforme des régions (2016), puis range les deux autres.
  solution: Le mot (1943), la DATAR (1963), la décentralisation (1982-1983), les 13 régions (2016).
- id: outils-amenagement-multi
  type: choix
  difficulte: 2
  enonce: Quels exemples sont des outils d'aménagement du territoire ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Une ligne à grande vitesse qui désenclave une ville
    - id: b
      texte: Un pôle de compétitivité qui regroupe entreprises et chercheurs
    - id: c
      texte: Un fonds européen qui finance la rénovation d'une région en difficulté
    - id: d
      texte: Un match de football dans une grande ville
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Un outil d'aménagement est une action publique qui aide un territoire à se développer.
    methode: Élimine ce qui n'est pas une décision ou un financement des pouvoirs publics.
    etape: Une proposition décrit un événement sportif, pas une politique d'aménagement.
  pieges:
  - si:
      contient:
      - d
    relance: Un match n'est pas une action des pouvoirs publics pour réduire les inégalités entre territoires.
  solution: Transports, pôles de compétitivité et fonds européens sont des outils d'aménagement ; un match de football n'en
    est pas un.
- id: developpement-outil-amenagement
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique, à partir d''un exemple, comment un outil d''aménagement du territoire peut
    réduire les inégalités entre régions.'
  criteres:
  - L'élève choisit un outil précis (infrastructure de transport, aide financière européenne).
  - L'élève explique l'effet de cet outil sur un territoire donné (accès à l'emploi, attractivité).
  - L'élève cite au moins deux niveaux d'acteurs impliqués.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Comment une infrastructure de transport peut-elle relier une région isolée aux grandes métropoles ?
    methode: Choisis un outil précis, explique son effet sur un territoire donné, puis cite les acteurs qui le financent.
    etape: 'Tu peux commencer ainsi : « L''aménagement du territoire vise à réduire les inégalités entre régions... », puis
      choisir ton exemple d''outil.'
  solution: 'L''aménagement du territoire vise à réduire les inégalités entre régions françaises. Un outil précis est la construction
    d''une ligne à grande vitesse (LGV) qui relie une région isolée aux grandes métropoles : cela améliore l''accès à l''emploi
    et attire de nouvelles entreprises dans cette région. Ce type de projet est financé par plusieurs acteurs : l''État, les
    collectivités territoriales concernées, et parfois des fonds européens grâce à la politique régionale de l''Union européenne.
    Ainsi, l''aménagement du territoire mobilise des acteurs à plusieurs échelles pour corriger les inégalités territoriales.'
- id: nblm-quel-est-l-objectif-principal-de-la-poli-1
  type: choix
  difficulte: 2
  enonce: Quel est l'objectif principal de la politique d'aménagement du territoire en France ?
  reponse:
    options:
    - id: o1
      texte: Réduire les inégalités territoriales et mieux répartir la population, les activités et les équipements.
    - id: o2
      texte: Concentrer l'ensemble des investissements, des emplois et des habitants uniquement dans la métropole parisienne.
    - id: o3
      texte: Supprimer les collectivités territoriales pour redonner la totalité des pouvoirs décisionnels à l'État central.
    - id: o4
      texte: Laisser le marché économique privé organiser seul le territoire sans aucune intervention des pouvoirs publics.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au problème majeur que cette politique cherche à corriger entre les différentes régions de France.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : la politique d''aménagement du territoire cherche au contraire à éviter l''hyper-concentration
      à Paris en développant les régions.'
  - si:
      contient:
      - o3
    relance: L'aménagement du territoire s'appuie sur la décentralisation et sur le partenariat actif avec les collectivités
      territoriales, non sur leur suppression.
  - si:
      contient:
      - o4
    relance: Il ne faut pas confondre l'aménagement du territoire (qui est une action publique organisée) avec le simple développement
      économique spontané du marché.
  solution: Réduire les inégalités territoriales et mieux répartir la population, les activités et les équipements. L'aménagement
    du territoire est une politique publique volontariste visant à compenser les déséquilibres économiques, sociaux et d'équipements
    entre les régions.
- id: nblm-quel-est-le-role-des-collectivites-terri-2
  type: choix
  difficulte: 2
  enonce: Quel est le rôle des collectivités territoriales dans l'aménagement du territoire en France ?
  reponse:
    options:
    - id: o1
      texte: Elles conçoivent et financent des projets d'aménagement locaux et régionaux grâce aux compétences transférées
        par la décentralisation.
    - id: o2
      texte: Elles n'interviennent pas, car l'État central reste le seul acteur autorisé à décider des aménagements.
    - id: o3
      texte: Elles ont totalement remplacé l'État, qui n'a plus aucun rôle ni budget d'aménagement.
    - id: o4
      texte: Elles s'occupent exclusivement de gérer les infrastructures des pays voisins.
    bonnes:
    - o1
  indices:
    relance: Pense au processus politique qui a transféré des compétences de l'État vers les échelons régionaux et locaux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : l''aménagement du territoire n''est pas réalisé uniquement par l''État, mais aussi
      par les collectivités et l''UE.'
  - si:
      contient:
      - o3
    relance: L'État reste un acteur clé en votant les lois et le budget national ; les collectivités agissent en partenariat
      avec lui.
  - si:
      contient:
      - o4
    relance: Les collectivités territoriales françaises agissent sur leur propre périmètre géographique national et régional.
  solution: Elles conçoivent et financent des projets d'aménagement locaux et régionaux grâce aux compétences transférées
    par la décentralisation. La décentralisation a conféré aux régions, départements et communes l'autonomie et les compétences
    légales nécessaires pour aménager leur territoire.
- id: nblm-la-construction-d-une-ligne-a-grande-vit-3
  type: choix
  difficulte: 2
  enonce: 'La construction d''une ligne à grande vitesse (LGV) est un outil d''aménagement du territoire qui permet de :'
  reponse:
    options:
    - id: o1
      texte: Désenclaver les régions et réduire les temps de trajet vers les grandes métropoles.
    - id: o2
      texte: Isoler davantage les territoires éloignés en supprimant les réseaux de transport.
    - id: o3
      texte: Remplacer l'ensemble des réseaux de bus urbains au sein d'une seule commune.
    - id: o4
      texte: Empêcher les déplacements de population entre les différentes régions françaises.
    bonnes:
    - o1
  indices:
    relance: Pense à l'effet d'un transport très rapide sur la distance-temps entre les territoires et la capitale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'objectif d'une infrastructure structurante de transport est d'ouvrir et de connecter les territoires, jamais
      de les isoler.
  - si:
      contient:
      - o3
    relance: La LGV est un équipement de transport interrégional et national, elle n'a pas vocation à remplacer les transports
      locaux d'un quartier.
  - si:
      contient:
      - o4
    relance: Les lignes à grande vitesse encouragent au contraire les flux économiques, touristiques et professionnels entre
      les régions.
  solution: Désenclaver les régions et réduire les temps de trajet vers les grandes métropoles. Les grandes infrastructures
    de transport comme les LGV facilitent les mobilités et connectent plus rapidement les régions au réseau national et européen.
- id: nblm-comment-l-union-europeenne-participe-t-e-4
  type: choix
  difficulte: 2
  enonce: Comment l'Union européenne participe-t-elle à l'aménagement des territoires français ?
  reponse:
    options:
    - id: o1
      texte: Grâce à sa politique régionale, en financant des projets dans les régions les moins développées.
    - id: o2
      texte: En décidant seule du tracé de l'ensemble des rues et routes communales en France.
    - id: o3
      texte: En finançant la totalité du budget national de l'État français.
    - id: o4
      texte: En interdisant aux régions françaises d'investir dans les transports écologiques.
    bonnes:
    - o1
  indices:
    relance: Cherche l'action financière européenne destinée à renforcer la cohésion entre les régions.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'UE ne gère pas le détail de l'urbanisme local ou des voiries communales, qui relèvent de la compétence des
      maires et intercommunalités.
  - si:
      contient:
      - o3
    relance: L'UE apporte des cofinancements ciblés sur certains projets régionaux, mais elle ne substitue pas son budget
      à celui de l'État.
  - si:
      contient:
      - o4
    relance: L'Union européenne encourage et cofinance au contraire les projets d'aménagement durable et d'infrastructures
      régionales.
  solution: Grâce à sa politique régionale, en financant des projets dans les régions les moins développées. L'Union européenne
    utilise les fonds de sa politique régionale pour soutenir le développement et réduire les écarts économiques entre régions.
- id: nblm-pourquoi-une-region-isolee-ou-ultramarin-5
  type: choix
  difficulte: 2
  enonce: Pourquoi une région isolée ou ultramarine nécessite-t-elle des politiques d'aménagement spécifiques ?
  reponse:
    options:
    - id: o1
      texte: Pour compenser les contraintes de l'éloignement et de l'insularité en améliorant l'accès aux équipements et services.
    - id: o2
      texte: Pour interdire toute activité économique et bloquer le développement local.
    - id: o3
      texte: Parce que ces territoires ne font pas partie de la République française.
    - id: o4
      texte: Afin d'obliger l'ensemble des habitants à migrer vers la France métropolitaine.
    bonnes:
    - o1
  indices:
    relance: Pense aux contraintes particulières des territoires insulaires ou très éloignés de la métropole.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'aménagement du territoire vise à encourager l'activité économique et la création d'emplois, pas à les paralyser.
  - si:
      contient:
      - o3
    relance: 'Erreur de fait : les territoires ultramarins font pleinement partie de la République française et bénéficient
      à ce titre de l''aménagement du territoire.'
  - si:
      contient:
      - o4
    relance: L'aménagement a pour but de fixer les populations en leur offrant de bonnes conditions de vie sur place, non
      de provoquer leur départ.
  solution: Pour compenser les contraintes de l'éloignement et de l'insularité en améliorant l'accès aux équipements et services.
    L'éloignement géographique et les surcoûts de transport imposent des aménagements sur mesure pour garantir l'équité territoriale
    et la continuité de service.
