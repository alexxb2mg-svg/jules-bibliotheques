      texte: L'État et les collectivités territoriales travaillent en partenariat pour financer les grands équipements.
    - id: o2
      texte: La politique régionale de l'Union européenne apporte des financements complémentaires aux régions.
    - id: o3
      texte: Seul l'État central possède le droit de financer des aménagements sur le territoire français.
    - id: o4
