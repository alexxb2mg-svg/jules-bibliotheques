format: 2
notion: mutations-espaces-productifs
version: 2
etat: generee
declencheurs:
- zone industrielle
- espace agricole
- zone touristique
- politique agricole commune
- exploitation agricole
- délocalisation d'usine
- pôle de compétitivité
- technopôle
- zone industrialo-portuaire
- quartier d'affaires
prerequis: []
essentiel: |
  Un espace productif est un territoire organisé pour produire des richesses : biens industriels, produits agricoles ou services (tourisme, affaires). Les espaces productifs français connaissent des mutations profondes, liées à la mondialisation, à l'urbanisation et aux innovations.

  L'agriculture. La France est le premier producteur agricole de l'Union européenne : grand producteur de céréales, de vin, de lait et de viande. Elle emploie environ 1,5 % de la population active, car les exploitations se sont modernisées et agrandies. Elle est soutenue par la politique agricole commune (PAC) de l'Union européenne. Les agriculteurs font face à de nouveaux défis : concurrence internationale, prix, réchauffement climatique, demande de produits de qualité (labels, agriculture biologique, circuits courts) et respect de l'environnement.

  L'industrie. Elle emploie moins qu'autrefois, mais elle reste importante : aéronautique (Toulouse), automobile, luxe, agroalimentaire, pharmacie, énergie. Les usines des régions anciennement industrielles (Nord, Lorraine) ont fermé. Les entreprises délocalisent certaines productions vers des pays à coûts plus faibles. Des activités innovantes se regroupent dans des pôles de compétitivité et des technopôles (Sophia Antipolis, Grenoble), près des universités et des laboratoires. Les grandes zones industrialo-portuaires (Le Havre, Marseille-Fos, Dunkerque) profitent du commerce mondial.

  Le tourisme. La France est le pays le plus visité au monde, avec plus de 100 millions d'arrivées internationales par an. Le tourisme crée des emplois, souvent saisonniers, et des revenus dans les territoires d'accueil : littoraux, montagnes (stations de ski), grandes villes (Paris) et sites culturels. Paris, la Côte d'Azur et les Alpes sont parmi les grandes destinations. Il pose aussi des problèmes : pression sur les milieux naturels, prix des logements, saisonnalité.

  Les services et les espaces d'affaires. La majeure partie des emplois appartient au secteur tertiaire, surtout dans les grandes villes, où se concentrent quartiers d'affaires (La Défense) et sièges d'entreprises.

  Le lien avec la mondialisation. Les entreprises françaises exportent et s'installent à l'étranger ; les productions sont soumises à la concurrence mondiale. Les espaces productifs se transforment donc en permanence.
methode:
- 'Distinguer les trois grands types d''espaces productifs : industriels, agricoles, touristiques (avec les espaces
  d''affaires).'
- 'Pour chaque type, retenir un chiffre clé (agriculture : 1,5 % des actifs ; tourisme : plus de 100 millions d''arrivées).'
- 'Décrire la mutation : modernisation agricole, délocalisations et pôles de compétitivité, tourisme saisonnier.'
- Relier les mutations à la mondialisation, à l'urbanisation et à l'Union européenne (PAC).
- 'Illustrer par un exemple français précis : Beauce, Toulouse, Alpes, Côte d''Azur, La Défense.'
- Conclure sur les atouts et les difficultés de chaque espace.
vocabulaire:
- terme: espace productif
  definition: un territoire organisé pour produire des biens ou des services (usine, exploitation agricole, zone
    touristique...)
- terme: politique agricole commune (PAC)
  definition: la politique de l'Union européenne qui soutient financièrement les agriculteurs
- terme: délocalisation
  definition: le transfert d'une activité de production vers un autre pays, souvent pour réduire les coûts
- terme: pôle de compétitivité
  definition: un regroupement d'entreprises, de laboratoires de recherche et d'établissements de formation sur un
    même territoire pour innover ensemble
- terme: mondialisation
  definition: l'intensification des échanges de marchandises, de personnes, de capitaux et d'informations dans le
    monde entier
- terme: secteur tertiaire
  definition: 'l''ensemble des activités de services : commerce, transports, tourisme, administration'
- terme: emploi saisonnier
  definition: un emploi qui n'existe que pendant une partie de l'année, par exemple la saison touristique
- terme: technopôle
  definition: un espace qui regroupe entreprises innovantes, laboratoires et universités
erreurs_frequentes:
- Réduire les espaces productifs à l'industrie seule, en oubliant l'agriculture et le tourisme.
- 'Croire que l''agriculture emploie beaucoup de monde en France : elle emploie une faible part des actifs mais
  reste puissante.'
- Oublier le rôle de la PAC dans le soutien à l'agriculture française.
- Négliger les effets de la mondialisation (délocalisations, concurrence internationale).
- Oublier que le tourisme crée surtout des emplois saisonniers et pèse sur l'environnement.
exemple:
  enonce: Pourquoi peut-on dire que l'agriculture française est un espace productif important malgré peu d'emplois
    ?
  solution: 'La France est le premier pays agricole de l''Union européenne, alors que l''agriculture n''emploie
    qu''environ 1,5 % de la population active : elle s''est modernisée et concentrée sur de grandes exploitations
    performantes.'
exercices:
- id: part-agriculture-active
  type: nombre
  difficulte: 1
  enonce: Quelle part de la population active française travaille aujourd'hui dans l'agriculture, en pourcentage
    arrondi ?
  reponse:
    valeur: 1.5
    forme: libre
    tolerance: 0.5
  indices:
    relance: C'est un chiffre bien inférieur à 10 %.
    methode: L'agriculture s'est modernisée et concentrée sur peu d'exploitants, malgré un poids économique important.
    etape: Ce chiffre est très inférieur à 5 %, alors que le poids économique du secteur reste important.
  pieges:
  - si:
      valeur: 18
    relance: 18 %, c'est la part de la France dans la production agricole et agroalimentaire de l'Union européenne,
      pas la part de sa population active travaillant dans l'agriculture.
  - si:
      valeur: 10
    relance: L'agriculture emploie beaucoup moins que 10 % de la population active française aujourd'hui.
  solution: Environ 1,5 % de la population active française travaille dans l'agriculture, malgré le poids économique
    important de ce secteur.
- id: trois-types-espaces
  type: choix
  difficulte: 1
  enonce: Quels sont les trois grands types d'espaces productifs étudiés en géographie de 3e ?
  reponse:
    options:
    - id: a
      texte: Industriel, agricole, touristique (ou d'affaires)
    - id: b
      texte: Urbain, rural, montagnard
    - id: c
      texte: National, régional, local
    bonnes:
    - a
  indices:
    relance: Pense aux trois grands secteurs de l'économie (primaire, secondaire, tertiaire) appliqués aux territoires.
    methode: Un espace productif se définit par le type d'activité économique qui s'y déroule, pas par sa densité
      ou son échelle administrative.
    etape: Le programme distingue les espaces à dominante industrielle, agricole, ou touristique (et d'affaires).
  pieges:
  - si:
      contient:
      - b
    relance: Urbain, rural, montagnard décrivent des types de paysages, pas des types d'espaces productifs définis
      par leur activité économique.
  - si:
      contient:
      - c
    relance: National, régional, local sont des échelles géographiques, pas des types d'espaces productifs.
  solution: Les espaces à dominante industrielle, agricole et touristique (ou d'affaires).
- id: mot-delocalisation
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le transfert d'une activité de production vers un autre pays, souvent pour réduire les
    coûts ?
  reponse:
    acceptees:
    - délocalisation
    fautes_tolerees: 1
  indices:
    relance: C'est un effet fréquent de la mondialisation sur l'industrie.
    methode: Le mot indique qu'une activité change de « lieu », vers l'extérieur du pays.
    etape: Le mot commence par « dé- » et contient « local ».
  pieges:
  - si:
      valeur: mondialisation
    relance: La mondialisation est le phénomène général des échanges à l'échelle du monde ; il manque le mot précis
      qui désigne le transfert d'une activité de production vers un autre pays.
  solution: 'La délocalisation : le transfert d''une activité de production vers un autre pays, souvent pour réduire
    les coûts.'
- id: acteurs-soutien-agriculture
  type: association
  difficulte: 2
  enonce: Relie chaque acteur ou politique à son rôle dans les espaces productifs français.
  reponse:
    gauche:
    - id: a
      texte: La politique agricole commune (PAC)
    - id: b
      texte: Un pôle de compétitivité
    - id: c
      texte: Une entreprise qui délocalise
    droite:
    - id: x
      texte: Soutient financièrement les agriculteurs de l'Union européenne
    - id: y
      texte: Regroupe entreprises et chercheurs pour innover sur un territoire
    - id: z
      texte: Transfère sa production dans un pays où les coûts sont plus bas
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Repère d'abord la PAC, dont le rôle est financier et agricole.
    methode: Pour chaque acteur, demande-toi s'il aide (PAC, pôle de compétitivité) ou s'il déplace la production
      (délocalisation).
    etape: Un pôle de compétitivité rassemble des acteurs pour innover ensemble sur un même territoire, contrairement
      à la délocalisation qui déplace la production ailleurs.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque acteur en te demandant s'il soutient, regroupe pour
      innover, ou déplace la production.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la PAC (soutien financier), puis distingue le pôle de compétitivité (innovation locale)
      de la délocalisation (déplacement à l'étranger).
  solution: La PAC soutient financièrement les agriculteurs européens ; le pôle de compétitivité regroupe entreprises
    et chercheurs pour innover sur un territoire ; l'entreprise qui délocalise transfère sa production dans un pays
    où les coûts sont plus bas.
- id: rang-tourisme
  type: choix
  difficulte: 2
  enonce: Quelle affirmation sur le tourisme en France est exacte ?
  reponse:
    options:
    - id: a
      texte: La France est le pays le plus visité au monde, avec plus de 100 millions d'arrivées internationales
        par an
    - id: b
      texte: Le tourisme ne crée que des emplois à temps plein toute l'année
    - id: c
      texte: Le tourisme ne concerne que les grandes villes françaises
    bonnes:
    - a
  indices:
    relance: Pense au classement mondial des pays selon le nombre de touristes étrangers accueillis chaque année.
    methode: Le tourisme touche aussi bien les littoraux, les montagnes que les grandes villes, et crée souvent
      des emplois liés aux saisons.
    etape: La France dépasse 100 millions d'arrivées internationales par an, ce qui en fait le pays le plus visité
      au monde.
  pieges:
  - si:
      contient:
      - b
    relance: Le tourisme crée souvent des emplois saisonniers, liés aux périodes de vacances, pas seulement des
      emplois à temps plein toute l'année.
  - si:
      contient:
      - c
    relance: Le tourisme concerne aussi les littoraux et les montagnes, pas seulement les grandes villes.
  solution: La France est le pays le plus visité au monde, avec plus de 100 millions d'arrivées internationales
    par an.
- id: sens-mutation-multi
  type: choix
  difficulte: 2
  enonce: Quels éléments illustrent les mutations de l'industrie française ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Des délocalisations vers des pays où les coûts sont plus bas
    - id: b
      texte: Des pôles de compétitivité qui regroupent entreprises et chercheurs
    - id: c
      texte: Le retour massif des usines dans tous les villages
    - id: d
      texte: La fermeture d'usines dans les régions industrielles anciennes
    bonnes:
    - a
    - b
    - d
  indices:
    relance: 'Pense à ce qui a changé dans l''industrie depuis les années 1970 : où produit-on, et comment ?'
    methode: 'Trie : ce qui ferme ou part, ce qui innove, et ce qui est invraisemblable.'
    etape: Une proposition décrit un phénomène qui n'existe pas.
  pieges:
  - si:
      contient:
      - c
    relance: 'Les usines ne reviennent pas dans tous les villages : les activités se concentrent dans quelques pôles
      et près des grandes villes.'
  solution: Délocalisations, fermetures dans les régions anciennes et pôles de compétitivité sont des mutations
    réelles de l'industrie.
- id: lieux-espaces-productifs
  type: association
  difficulte: 2
  enonce: Relie chaque lieu à l'espace productif qu'il illustre.
  reponse:
    gauche:
    - id: a
      texte: La Beauce
    - id: b
      texte: Toulouse
    - id: c
      texte: La Côte d'Azur
    - id: d
      texte: La Défense
    droite:
    - id: x
      texte: Un espace agricole (céréales)
    - id: y
      texte: Un espace industriel (aéronautique)
    - id: z
      texte: Un espace touristique
    - id: w
      texte: Un quartier d'affaires
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Pense à ce que chaque lieu produit ou accueille.
    methode: La Beauce est une grande plaine ; La Défense est près de Paris.
    etape: Toulouse est connue pour la fabrication d'avions.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque lieu et cherche l'activité principale.
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par les lieux évidents : Toulouse (avions) et La Défense (bureaux), puis distingue la Beauce
      et la Côte d''Azur.'
  solution: 'La Beauce : agriculture ; Toulouse : aéronautique ; Côte d''Azur : tourisme ; La Défense : quartier
    d''affaires.'
- id: developpement-tourisme
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre que le tourisme est un espace productif à part entière en France.'
  criteres:
  - L'élève donne un chiffre sur la fréquentation touristique (plus de 100 millions d'arrivées internationales par
    an).
  - L'élève explique les emplois créés par le tourisme, souvent saisonniers.
  - L'élève cite au moins un type de territoire d'accueil (littoraux, montagnes, grandes villes).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Pourquoi le tourisme génère-t-il des revenus et des emplois dans un territoire ?
    methode: Donne d'abord un chiffre sur la fréquentation touristique, puis explique les emplois créés, puis cite
      un territoire d'accueil.
    etape: 'Tu peux commencer ainsi : « Le tourisme est un espace productif à part entière en France... », puis
      donner ton premier chiffre.'
  solution: 'Le tourisme est un espace productif à part entière en France : le pays est la destination la plus visitée
    au monde, avec plus de 100 millions d''arrivées internationales par an. Ce secteur crée des emplois, souvent
    saisonniers, ainsi que des revenus dans les territoires d''accueil comme les littoraux, les montagnes ou les
    grandes villes. Ces territoires sont spécialement aménagés pour recevoir les touristes : ils constituent donc
    un véritable espace productif.'
