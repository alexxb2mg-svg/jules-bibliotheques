format: 2
notion: geographie-aires-urbaines
version: 2
etat: verifiee
declencheurs:
- ville centre
- migrations pendulaires
- étalement urbain
- aire d'attraction d'une ville
- habiter loin de son travail
- s'installer loin de la ville
- métropole de Lyon
- banlieue
- trajets domicile-travail
- lotissement
prerequis: []
essentiel: 'Depuis 50 ans, la France s''est fortement urbanisée. Le programme parle d''« aires urbaines » ; depuis 2020, l''INSEE
  utilise le terme d''« aires d''attraction des villes ». Une aire est formée d''un pôle (la ville-centre et les communes
  denses autour, qui concentrent habitants et emplois) et d''une couronne : les communes dont au moins 15 % des actifs travaillent
  dans le pôle.


  Les chiffres. En France, 93 % de la population vit dans l''aire d''attraction d''une ville (environ 51 % dans les pôles
  et 43 % dans les couronnes). L''aire de Paris compte environ 13 millions d''habitants, presque un Français sur cinq. Viennent
  ensuite notamment Lyon, Marseille-Aix-en-Provence, Lille, Toulouse et Bordeaux.


  L''organisation d''une aire. Du centre vers la périphérie : le centre-ville (dense, commerces, monuments, emplois), la banlieue
  (habitat, zones d''activités, grands ensembles), l''espace périurbain (maisons individuelles, lotissements, centres commerciaux),
  puis des communes rurales sous influence de la ville.


  La périurbanisation, ou étalement urbain. Les logements des centres sont chers. Beaucoup d''habitants s''installent en banlieue
  ou plus loin, dans des maisons avec jardin, tout en gardant leur emploi dans le pôle. Les villes s''étendent donc sur les
  terres agricoles.


  Les conséquences. Les mobilités pendulaires (trajets quotidiens domicile-travail) augmentent, souvent en voiture. D''où
  embouteillages, pollution, temps perdu. Les villes cherchent des solutions : transports en commun (tramway, métro, RER),
  pistes cyclables, covoiturage, quartiers mixtes qui réunissent logements, commerces et emplois, et limitation de l''artificialisation
  des sols.


  La métropolisation. Les plus grandes villes (les métropoles) concentrent les emplois qualifiés, les universités, la recherche
  et les fonctions de commandement (sièges d''entreprises, administrations). Elles sont reliées entre elles et au monde par
  des transports rapides (TGV, aéroports). Elles attirent, mais elles posent aussi des problèmes de logement et d''inégalités
  entre quartiers.


  Au brevet, on attend : définir les termes (pôle, couronne, périurbanisation, mobilités pendulaires), donner un chiffre,
  expliquer le mécanisme de l''étalement et ses conséquences.

  '
methode:
- 'Définir l''aire d''attraction : un pôle (ville-centre et communes denses) plus une couronne (au moins 15 % des actifs travaillent
  dans le pôle).'
- 'Situer les espaces du centre vers la périphérie : centre-ville, banlieue, espace périurbain, communes rurales sous influence.'
- 'Relier étalement urbain et mobilités pendulaires : plus on habite loin, plus les trajets domicile-travail sont longs.'
- 'Donner un chiffre daté : 93 % des Français dans une aire d''attraction, environ 13 millions pour l''aire de Paris.'
- 'Citer conséquences et solutions : embouteillages, pollution, terres agricoles construites ; transports en commun, mixité,
  limitation de l''étalement.'
- 'Utiliser un vocabulaire précis : pôle, couronne, périurbanisation, métropolisation.'
vocabulaire:
- terme: aire d'attraction d'une ville
  definition: un pôle et sa couronne ; c'est le nom actuel (INSEE, depuis 2020) de l'« aire urbaine » du programme
- terme: pôle
  definition: la ville-centre et les communes denses qui l'entourent, qui concentrent habitants et emplois
- terme: couronne
  definition: les communes autour du pôle dont au moins 15 % des actifs vont y travailler
- terme: mobilité (migration) pendulaire
  definition: déplacement quotidien entre le domicile et le lieu de travail ou d'études
- terme: périurbanisation
  definition: l'extension des espaces urbanisés sur les espaces ruraux autour des villes
- terme: métropolisation
  definition: la concentration des habitants, des emplois qualifiés et des fonctions de commandement dans les plus grandes
    villes
- terme: banlieue
  definition: l'espace urbanisé qui entoure le centre-ville, avec des logements et des zones d'activités
- terme: artificialisation des sols
  definition: le fait de recouvrir des terres agricoles ou naturelles par des constructions et des routes
erreurs_frequentes:
- Confondre le pôle (la ville et ses communes denses) et l'aire d'attraction entière (le pôle plus sa couronne, bien plus
  vaste).
- 'Croire que la couronne est un espace rural comme les autres : une part importante de ses actifs travaille dans le pôle.'
- Oublier les conséquences de l'étalement urbain (embouteillages, pollution, terres agricoles construites).
- Confondre périurbanisation (extension autour des villes) et métropolisation (concentration dans les grandes villes).
- Ne pas donner d'ordre de grandeur chiffré et daté à l'appui d'une réponse.
exemple:
  enonce: Explique en une phrase pourquoi une commune peut appartenir à l'aire d'attraction d'une ville sans être elle-même
    une ville.
  solution: Une petite commune d'allure rurale fait partie de la couronne dès qu'au moins 15 % de ses actifs vont travailler
    chaque jour dans le pôle.
exercices:
- id: seuil-couronne
  type: nombre
  difficulte: 1
  enonce: À partir de quel pourcentage d'actifs travaillant dans le pôle une commune appartient-elle à la couronne d'une aire
    d'attraction (définition INSEE) ?
  reponse:
    valeur: 15
    forme: entier
  indices:
    relance: Ce seuil a changé depuis l'ancien zonage des « aires urbaines » de 2010.
    methode: Le seuil actuel (INSEE, 2020) est plus bas que l'ancien seuil de 40 % utilisé avant 2020.
    etape: C'est un nombre à deux chiffres, plus petit que 20.
  pieges:
  - si:
      valeur: 40
    relance: 40 %, c'était le seuil de l'ancien zonage de 2010. Le zonage actuel (2020) utilise un seuil plus bas.
  - si:
      valeur: 85
    relance: 85 %, c'était un seuil de l'ancien zonage de 2010 pour une autre catégorie de communes. Le seuil actuel est bien
      plus bas.
  solution: Une commune appartient à la couronne dès que 15 % au moins de ses actifs vont travailler dans le pôle (définition
    INSEE, depuis 2020).
- id: pole-ou-couronne
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qui définit le pôle d'une aire d'attraction ?
  reponse:
    options:
    - id: a
      texte: La ville-centre et les communes denses qui concentrent habitants et emplois
    - id: b
      texte: Toutes les communes rurales situées à moins de 50 km de la ville
    - id: c
      texte: Uniquement la commune qui porte le nom de la ville
    bonnes:
    - a
  indices:
    relance: Le pôle est la partie la plus dense de l'aire, celle qui attire les actifs de la couronne.
    methode: Pense à ce qui distingue le pôle de la couronne, qui elle est définie par un seuil de migrations pendulaires.
    etape: Le pôle regroupe la ville-centre et les communes autour, denses en habitants et en emplois.
  pieges:
  - si:
      contient:
      - b
    relance: Une distance en kilomètres ne définit pas le pôle. C'est la densité d'habitants et d'emplois qui compte.
  - si:
      contient:
      - c
    relance: Le pôle regroupe la ville-centre, mais aussi d'autres communes denses autour, pas seulement une commune.
  solution: Le pôle regroupe la ville-centre et les communes denses qui l'entourent, qui concentrent habitants et emplois.
- id: espaces-centre-peripherie
  type: ordre
  difficulte: 2
  enonce: Range ces espaces du plus central au plus éloigné du centre-ville.
  reponse:
    elements:
    - id: centre
      texte: Le centre-ville
    - id: banlieue
      texte: La banlieue
    - id: periurbain
      texte: L'espace périurbain
    - id: couronne-eloignee
      texte: Une commune éloignée de la couronne
  indices:
    relance: Le centre-ville concentre le plus d'emplois et d'habitants au km². Où se trouve-t-il dans ton classement ?
    methode: Range d'abord le centre-ville et l'espace le plus éloigné, puis place la banlieue et le périurbain entre les
      deux.
    etape: La banlieue est proche du centre-ville, contrairement à l'espace périurbain, plus éloigné et moins dense.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux espaces voisins sont inversés. Lequel des deux est le plus proche du centre-ville ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le centre-ville (le plus dense) et la commune la plus éloignée, puis range les deux autres entre
      eux.
  solution: 'Du plus central au plus éloigné : le centre-ville, la banlieue, l''espace périurbain, une commune éloignée de
    la couronne.'
- id: mot-periurbanisation
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne l'extension des espaces urbanisés sur les espaces ruraux autour des villes ?
  reponse:
    acceptees:
    - périurbanisation
    fautes_tolerees: 1
  indices:
    relance: 'On parle aussi d''« étalement urbain » : la ville s''étend en dehors de son centre.'
    methode: Le mot commence comme « périphérie » et se termine par « -isation », comme un processus en cours.
    etape: 'Le mot est : péri-urbani-sation.'
  pieges:
  - si:
      valeur: métropolisation
    relance: La métropolisation désigne la concentration des emplois qualifiés dans les grandes villes, pas l'étalement des
      espaces urbanisés vers la périphérie.
  - si:
      valeur: urbanisation
    relance: L'urbanisation est un phénomène plus général. Il manque un préfixe qui précise que c'est autour des villes, en
      périphérie.
  solution: 'La périurbanisation : l''extension des espaces urbanisés sur les espaces ruraux autour des villes.'
- id: aire-paris
  type: choix
  difficulte: 2
  enonce: Quel est l'ordre de grandeur de la population de l'aire d'attraction de Paris ?
  reponse:
    options:
    - id: a
      texte: Environ 13 millions d'habitants
    - id: b
      texte: Environ 2 millions d'habitants
    - id: c
      texte: Environ 30 millions d'habitants
    bonnes:
    - a
  indices:
    relance: Cette aire rassemble presque un Français sur cinq.
    methode: La population totale de la France est d'environ 68 millions d'habitants. Un cinquième de ce total donne un ordre
      de grandeur.
    etape: L'aire de Paris est bien plus peuplée que la seule ville de Paris intra-muros (environ 2 millions d'habitants).
  pieges:
  - si:
      contient:
      - b
    relance: 2 millions, c'est la population de la seule ville de Paris intra-muros, pas de toute l'aire d'attraction qui
      inclut aussi la banlieue et le périurbain.
  - si:
      contient:
      - c
    relance: 30 millions dépasserait presque la moitié de la population française. L'aire de Paris est plus peuplée que les
      autres aires françaises, mais moins que cela.
  solution: L'aire d'attraction de Paris compte environ 13 millions d'habitants, soit presque un Français sur cinq.
- id: consequences-etalement-multi
  type: choix
  difficulte: 2
  enonce: Quelles sont des conséquences de l'étalement urbain ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Une augmentation des trajets domicile-travail
    - id: b
      texte: Des terres agricoles qui sont construites
    - id: c
      texte: Une baisse de la pollution due aux voitures
    - id: d
      texte: Des embouteillages aux heures de pointe
    bonnes:
    - a
    - b
    - d
  indices:
    relance: Pense à ce qui se passe quand on habite loin de son lieu de travail.
    methode: 'Plus on habite loin, plus on utilise la voiture : cela agit sur la pollution, dans quel sens ?'
    etape: Une proposition dit le contraire de ce qui se passe réellement.
  pieges:
  - si:
      contient:
      - c
    relance: L'étalement augmente l'usage de la voiture, donc la pollution augmente au lieu de baisser.
  solution: L'étalement urbain augmente les trajets, réduit les terres agricoles et crée des embouteillages ; il augmente
    aussi la pollution.
- id: mot-metropolisation
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne la concentration des habitants, des emplois qualifiés et des fonctions de commandement dans les
    plus grandes villes ?
  reponse:
    acceptees:
    - métropolisation
    fautes_tolerees: 1
  indices:
    relance: Ce mot vient du nom de ces très grandes villes.
    methode: Il se termine par « -isation », comme « urbanisation », et commence comme « métropole ».
    etape: Écris « métropole » puis remplace la fin par « -isation ».
  pieges:
  - si:
      valeur: périurbanisation
    relance: La périurbanisation concerne l'extension autour des villes, pas la concentration dans les très grandes villes.
  solution: 'La métropolisation : la concentration des habitants, des emplois qualifiés et des fonctions de commandement dans
    les plus grandes villes.'
- id: developpement-urbanisation
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique comment l''urbanisation a transformé les espaces français depuis 50 ans.'
  criteres:
  - L'élève donne un ordre de grandeur chiffré et daté (environ 93 % des Français dans une aire d'attraction).
  - L'élève explique le mécanisme de la périurbanisation (prix des logements au centre, installation en périphérie).
  - L'élève relie ce phénomène aux mobilités pendulaires et à leurs conséquences (transports, pollution).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Pourquoi les habitants s'installent-ils loin du centre tout en y travaillant ?
    methode: Pars du prix des logements au centre, explique la périurbanisation, puis relie-la aux mobilités pendulaires et
      à leurs conséquences.
    etape: 'Tu peux commencer ainsi : « Depuis 50 ans, l''urbanisation a profondément transformé les espaces français... »,
      puis donner ton premier chiffre.'
  solution: 'Depuis 50 ans, l''urbanisation a profondément transformé les espaces français : aujourd''hui, environ 93 % des
    Français vivent dans l''aire d''attraction d''une ville. Le prix élevé des logements dans les centres pousse de nombreux
    habitants à s''installer en banlieue ou plus loin, dans l''espace périurbain, tout en gardant leur emploi dans le pôle
    : c''est la périurbanisation. Cela entraîne des mobilités pendulaires quotidiennes, souvent en voiture, avec des embouteillages
    et de la pollution. En même temps, les plus grandes villes concentrent les emplois qualifiés : c''est la métropolisation.'
- id: nblm-selon-la-definition-officielle-de-l-inse-1
  type: choix
  difficulte: 2
  enonce: Selon la définition officielle de l'INSEE, de quelles parties principales se compose l'aire d'attraction d'une ville
    ?
  reponse:
    options:
    - id: o1
      texte: Un pôle (ville-centre et communes denses) et une couronne de communes
    - id: o2
      texte: Uniquement de la ville-centre et de ses banlieues immédiates
    - id: o3
      texte: Un ensemble de communes uniquement rurales isolées sans lien avec la ville
    - id: o4
      texte: Deux villes-centres sans aucune commune intermédiaire autour
    bonnes:
    - o1
  indices:
    relance: Pense à la structure à deux composantes associant le cœur de l'agglomération et les communes sous son influence.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : cela oublie la couronne périurbaine qui fait pourtant partie intégrante de l''aire d''attraction.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la couronne n''est pas isolée, au moins 15 % de ses actifs vont travailler dans le pôle.'
  - si:
      contient:
      - o4
    relance: 'Faux : une aire d''attraction s''organise autour d''un pôle principal et s''étend sur une couronne de communes.'
  solution: 'Un pôle (ville-centre et communes denses) et une couronne de communes. C''est la définition exacte : l''aire
    d''attraction regroupe le pôle concentrateur d''emplois et sa couronne environnante.'
- id: nblm-comment-appelle-t-on-les-deplacements-qu-2
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on les déplacements quotidiens effectués par les habitants entre leur domicile et leur lieu de
    travail ou d'études ?
  reponse:
    options:
    - id: o1
      texte: Les migrations pendulaires
    - id: o2
      texte: L'exode rural
    - id: o3
      texte: La métropolisation
    - id: o4
      texte: Les migrations touristiques
    bonnes:
    - o1
  indices:
    relance: Ce terme évoque le mouvement d'un balancier d'horloge qui va et vient chaque jour.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : l''exode rural désigne le départ définitif des habitants de la campagne vers la ville, et non
      un trajet quotidien.'
  - si:
      contient:
      - o3
    relance: 'Attention : la métropolisation est la concentration des fonctions de commandement et des emplois qualifiés dans
      les grandes villes.'
  - si:
      contient:
      - o4
    relance: 'Faux : les migrations touristiques sont liées aux vacances et aux loisirs, pas aux déplacements professionnels
      quotidiens.'
  solution: Les migrations pendulaires. C'est le terme géographique précis pour désigner le va-et-vient quotidien entre lieu
    de résidence et lieu de travail.
- id: nblm-quelle-est-la-cause-principale-qui-incit-3
  type: choix
  difficulte: 2
  enonce: Quelle est la cause principale qui incite les ménages à s'installer loin de la ville et alimente l'étalement urbain
    ?
  reponse:
    options:
    - id: o1
      texte: Le coût élevé des logements dans la ville-centre
    - id: o2
      texte: L'absence totale de transports en commun dans le pôle urbain
    - id: o3
      texte: La fermeture de tous les magasins et services dans la ville-centre
    - id: o4
      texte: L'obligation légale pour les salariés de résider en zone rurale
    bonnes:
    - o1
  indices:
    relance: Réfléchis au coût de l'immobilier dans le cœur des grandes agglomérations.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : les centres-villes sont au contraire très bien desservis par les transports en commun.'
  - si:
      contient:
      - o3
    relance: 'Erreur de raisonnement : la ville-centre reste le pôle majeur de commerces et de services.'
  - si:
      contient:
      - o4
    relance: 'Faux : les habitants choisissent librement leur lieu de résidence selon leur budget et leurs aspirations.'
  solution: 'Le coût élevé des logements dans la ville-centre. C''est la cause majeure : la cherté de l''immobilier central
    incite les familles à chercher des logements plus abordables en périphérie.'
- id: nblm-a-partir-de-quel-critere-statistique-une-4
  type: choix
  difficulte: 2
  enonce: À partir de quel critère statistique une commune est-elle intégrée à la couronne de l'aire d'attraction d'une ville
    ?
  reponse:
    options:
    - id: o1
      texte: Au moins 15 % de ses actifs occupés travaillent dans le pôle
    - id: o2
      texte: Au moins 50 % de sa superficie est couverte d'immeubles hauts
    - id: o3
      texte: Elle se situe à moins de 2 kilomètres de la mairie centrale
    - id: o4
      texte: 100 % de sa population travaille uniquement sur place
    bonnes:
    - o1
  indices:
    relance: Il s'agit d'un pourcentage d'actifs effectuant quotidiennement le trajet vers le pôle d'emploi.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la couronne conserve souvent un aspect rural ou résidentiel avec des maisons individuelles.'
  - si:
      contient:
      - o3
    relance: 'Faux : la couronne peut s''étendre à plusieurs dizaines de kilomètres du pôle urbain.'
  - si:
      contient:
      - o4
    relance: 'Faux : cela contredirait la définition même d''une zone sous l''attraction d''un pôle d''emploi extérieur.'
  solution: Au moins 15 % de ses actifs occupés travaillent dans le pôle. C'est le seuil retenu par l'INSEE pour mesurer l'attraction
    d'un pôle d'emploi sur les communes environnantes.
- id: nblm-quel-terme-geographique-designe-la-conce-5
  type: choix
  difficulte: 2
  enonce: Quel terme géographique désigne la concentration des habitants, des emplois qualifiés et des fonctions de commandement
    dans les plus grandes villes ?
  reponse:
    options:
    - id: o1
      texte: La métropolisation
    - id: o2
      texte: La désurbanisation
    - id: o3
      texte: La décentralisation
    - id: o4
      texte: L'agritourisme
    bonnes:
    - o1
  indices:
    relance: Ce terme dérive du mot 'métropole' et désigne la concentration des pouvoirs urbains.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la désurbanisation signifierait un déclin des villes, alors que les métropoles renforcent leur puissance.'
  - si:
      contient:
      - o3
    relance: 'Attention : la décentralisation est une politique de transfert de compétences administratives de l''État aux
      collectivités.'
  - si:
      contient:
      - o4
    relance: 'Hors sujet : l''agritourisme concerne l''accueil touristique dans les exploitations agricoles.'
  solution: La métropolisation. C'est la définition exacte de la métropolisation, qui renforce le rôle des grandes métropoles
    au niveau national et mondial.
- id: nblm-quelles-sont-deux-consequences-directes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont DEUX conséquences directes de l'étalement urbain et de la multiplication des déplacements quand on
    choisit d'habiter loin de son travail ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'apparition d'embouteillages quotidiens aux heures de pointe
    - id: o2
      texte: L'accroissement de la pollution atmosphérique liée au trafic routier
    - id: o3
      texte: La diminution globale de la surface urbanisée sur le territoire
    - id: o4
      texte: La suppression complète du besoin d'infrastructures de transport
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux effets sur la circulation automobile et sur la qualité de l'air aux abords des grandes villes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
