format: 2
notion: territoire-union-europeenne
version: 1
etat: verifiee
declencheurs:
- carte de l'Union européenne
- espace Schengen
- région frontalière
- position de la France en Europe
- zone euro carte
- Rhin supérieur
prerequis: []
essentiel: 'Depuis le Brexit (sortie du Royaume-Uni en 2020), l''Union européenne compte 27 États membres, avec des tailles
  et des poids économiques très différents. Elle couvre une superficie totale d''environ 4,2 millions de km² pour plus de
  443 millions d''habitants.


  La France occupe une position centrale dans cette géographie européenne : elle est un grand pays par sa superficie et sa
  population, elle partage des frontières terrestres avec plusieurs autres États membres, et certains de ses territoires ultramarins
  (les régions ultrapériphériques) font aussi partie intégrante de l''Union européenne, malgré leur éloignement.


  L''Union européenne représente un potentiel important pour la France : marché commun sans droits de douane, libre circulation
  des personnes (espace Schengen pour la plupart des membres), coopérations régionales transfrontalières (par exemple entre
  la France, l''Allemagne et la Suisse dans le Rhin supérieur), et financements européens pour l''aménagement du territoire.'
methode:
- Retenir le nombre d'États membres de l'UE (27) et un ordre de grandeur de sa population (plus de 440 millions).
- 'Situer la France dans l''espace européen : ses voisins terrestres, sa position centrale.'
- Donner un exemple précis de région transfrontalière (Rhin supérieur, Lille et la Belgique...).
- 'Distinguer Union européenne, espace Schengen et zone euro : trois ensembles qui ne regroupent pas exactement les mêmes
  pays.'
vocabulaire:
- terme: région transfrontalière
  definition: un espace situé de part et d'autre d'une frontière, où les échanges quotidiens entre pays sont nombreux
- terme: région ultrapériphérique
  definition: un territoire ultramarin d'un État membre qui fait partie intégrante de l'Union européenne malgré son éloignement
    (par exemple La Réunion)
erreurs_frequentes:
- 'Confondre Union européenne (27 membres), espace Schengen et zone euro : ces trois ensembles ne réunissent pas les mêmes
  pays.'
- Oublier que certains territoires ultramarins français font partie de l'UE (régions ultrapériphériques).
- Ne pas savoir situer la France par rapport à ses voisins européens sur une carte.
- Croire que le Royaume-Uni fait toujours partie de l'UE depuis le Brexit (2020).
exemple:
  enonce: Donne le nombre d'États membres de l'Union européenne depuis 2020 et explique pourquoi ce nombre a changé.
  solution: L'Union européenne compte 27 États membres depuis 2020, après le départ du Royaume-Uni (le Brexit), qui était
    membre depuis 1973.
exercices:
- id: nombre-etats-membres
  type: nombre
  difficulte: 1
  enonce: Combien l'Union européenne compte-t-elle d'États membres depuis le Brexit de 2020 ?
  reponse:
    valeur: 27
    forme: entier
  indices:
    relance: Le Royaume-Uni a quitté l'Union européenne en 2020, ce qui a fait baisser ce nombre.
    methode: L'Union comptait 28 membres avant le départ du Royaume-Uni.
    etape: Le nombre se situe juste en dessous de 28.
  pieges:
  - si:
      valeur: 28
    relance: 28, c'était le nombre d'États membres avant le Brexit. Le Royaume-Uni est parti en 2020.
  - si:
      valeur: 25
    relance: 25 est trop bas. Seul un pays est parti depuis le sommet de 28 membres.
  solution: L'Union européenne compte 27 États membres depuis le départ du Royaume-Uni (le Brexit) en 2020.
- id: frontieres-france
  type: choix
  difficulte: 1
  enonce: Lequel de ces pays partage une frontière terrestre avec la France ?
  reponse:
    options:
    - id: a
      texte: L'Allemagne
    - id: b
      texte: Le Portugal
    - id: c
      texte: La Pologne
    bonnes:
    - a
  indices:
    relance: Pense aux pays voisins à l'est de la France.
    methode: La France partage des frontières terrestres seulement avec des pays proches d'elle, pas avec des pays plus lointains
      en Europe.
    etape: Regarde une carte d'Europe et cherche quel pays de la liste touche directement le territoire français.
  pieges:
  - si:
      contient:
      - b
    relance: Le Portugal ne partage pas de frontière terrestre avec la France ; il est séparé par l'Espagne.
  - si:
      contient:
      - c
    relance: La Pologne est plus à l'est en Europe et ne partage pas de frontière terrestre directe avec la France.
  solution: L'Allemagne partage une frontière terrestre avec la France (on peut aussi citer la Belgique, l'Espagne, l'Italie,
    la Suisse ou le Luxembourg).
- id: mot-region-ultraperipherique
  type: texte_court
  difficulte: 2
  enonce: Quel terme désigne un territoire ultramarin d'un État membre qui fait partie intégrante de l'Union européenne malgré
    son éloignement, comme La Réunion ?
  reponse:
    acceptees:
    - région ultrapériphérique
    fautes_tolerees: 1
  indices:
    relance: Le mot commence comme « périphérie », avec un préfixe qui renforce l'idée d'éloignement.
    methode: Ce terme désigne une région éloignée du continent européen mais qui reste membre de l'UE.
    etape: 'Le terme est composé de deux mots : « région » et « ultrapériphérique ».'
  pieges:
  - si:
      valeur: DROM
    relance: DROM est un statut administratif français, pas le terme utilisé par l'Union européenne pour désigner ces territoires
      éloignés qui en font partie.
  solution: 'Une région ultrapériphérique : un territoire ultramarin d''un État membre qui fait partie intégrante de l''Union
    européenne malgré son éloignement, comme La Réunion.'
- id: ue-schengen-difference
  type: choix
  difficulte: 2
  enonce: Quelle est la différence entre l'Union européenne et l'espace Schengen ?
  reponse:
    options:
    - id: a
      texte: Ce sont deux ensembles différents, qui ne regroupent pas exactement les mêmes pays
    - id: b
      texte: Ce sont deux noms différents pour exactement le même groupe de pays
    - id: c
      texte: L'espace Schengen regroupe uniquement des pays hors d'Europe
    bonnes:
    - a
  indices:
    relance: Tous les membres de l'UE ne font pas forcément partie de l'espace Schengen, et inversement.
    methode: L'Union européenne est une union politique et économique ; l'espace Schengen concerne seulement la libre circulation
      des personnes sans contrôle aux frontières.
    etape: Certains pays hors UE font partie de l'espace Schengen, et certains pays de l'UE n'en font pas partie.
  pieges:
  - si:
      contient:
      - b
    relance: Les deux ensembles ne réunissent pas exactement les mêmes pays, même s'ils se recoupent largement.
  - si:
      contient:
      - c
    relance: L'espace Schengen regroupe surtout des pays européens, pas des pays hors d'Europe.
  solution: L'Union européenne est une union politique et économique de 27 États ; l'espace Schengen est un espace de libre
    circulation des personnes sans contrôle aux frontières intérieures, qui n'inclut pas exactement les mêmes pays.
- id: developpement-region-transfrontaliere
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre l''intérêt d''une région transfrontalière pour la France, à partir d''un exemple.'
  criteres:
  - L'élève choisit une région transfrontalière précise (Rhin supérieur, région Nord avec la Belgique...).
  - L'élève explique un avantage concret lié à la libre circulation (emploi, transports).
  - L'élève relie cet exemple à l'espace Schengen ou à la coopération européenne.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quel avantage la libre circulation apporte-t-elle aux habitants d'une région frontalière ?
    methode: Choisis une frontière précise, explique un avantage concret, puis relie-le à l'espace Schengen.
    etape: 'Tu peux commencer ainsi : « L''appartenance à l''Union européenne offre des avantages aux régions transfrontalières
      françaises... », puis choisir ton exemple.'
  solution: 'L''appartenance à l''Union européenne offre des avantages aux régions transfrontalières françaises. Prenons l''exemple
    de la région du Rhin supérieur, entre la France, l''Allemagne et la Suisse : la libre circulation permise par l''espace
    Schengen facilite les déplacements quotidiens des travailleurs transfrontaliers. Cette coopération dynamise l''économie
    régionale de part et d''autre de la frontière, en profitant du marché commun européen.'
- id: nblm-combien-d-etats-membres-compte-l-union-e-1
  type: choix
  difficulte: 2
  enonce: Combien d'États membres compte l'Union européenne sur la carte de l'Union européenne depuis le départ du Royaume-Uni
    en 2020 ?
  reponse:
    options:
    - id: o1
      texte: 27 États membres
    - id: o2
      texte: 28 États membres
    - id: o3
      texte: 25 États membres
    - id: o4
      texte: 19 États membres
    bonnes:
    - o1
  indices:
    relance: Pense au nombre de pays restants après la sortie officielle du Royaume-Uni (Brexit).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : 28 était le nombre d''États membres avant le Brexit, sans prendre en compte la
      sortie du Royaume-Uni.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : cette valeur sous-estime le nombre réel d''États membres et confond avec d''autres sous-ensembles
      européens.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : 19 correspond à un sous-ensemble historique de la zone euro, ce qui confond l''Union européenne
      et l''union monétaire.'
  solution: '27 États membres. C''est exact : l''Union européenne compte 27 États membres depuis le retrait définitif du Royaume-Uni
    en 2020.'
- id: nblm-quelle-est-la-position-geographique-et-s-2
  type: choix
  difficulte: 2
  enonce: Quelle est la position géographique et stratégique de la France au sein du territoire de l'Union européenne ?
  reponse:
    options:
    - id: o1
      texte: Une position centrale, avec une vaste superficie, de nombreuses frontières terrestres et des régions ultrapériphériques
        intégrées.
    - id: o2
      texte: Une position périphérique isolée au nord du continent, sans aucune frontière terrestre avec l'UE.
    - id: o3
      texte: Un statut de pays observateur extérieur n'appartenant pas à l'Union européenne.
    - id: o4
      texte: Une localisation en Europe de l'Est sans aucun accès aux façades maritimes.
    bonnes:
    - o1
  indices:
    relance: Examine la place de la France sur une carte du continent européen et ses liens avec ses voisins.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : la France n''est pas située au nord de l''Europe et possède plusieurs frontières terrestres directes
      avec d''autres pays membres.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur grave : la France est un membre fondateur historique de la construction européenne.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la France se situe en Europe occidentale et dispose de très larges ouvertures maritimes.'
  solution: 'Une position centrale, avec une vaste superficie, de nombreuses frontières terrestres et des régions ultrapériphériques
    intégrées. C''est exact : la France occupe une position géographique centrale au cœur de l''UE, partage plusieurs frontières
    avec d''autres membres et intègre des territoires ultramarins.'
- id: nblm-dans-le-cadre-de-l-integration-europeenn-3
  type: choix
  difficulte: 2
  enonce: Dans le cadre de l'intégration européenne, quel est le rôle principal de l'espace Schengen ?
  reponse:
    options:
    - id: o1
      texte: Garantir la libre circulation des personnes en supprimant les contrôles aux frontières intérieures.
    - id: o2
      texte: Imposer l'utilisation obligatoire de la monnaie unique dans tous les pays d'Europe.
    - id: o3
      texte: Gérer uniquement la politique agricole et l'attribution des aides financières aux agriculteurs.
    - id: o4
      texte: Interdire tout déplacement de travailleurs d'un pays membre vers un autre.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui change pour un voyageur lorsqu'il franchit une frontière entre deux pays membres de cet espace.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une confusion classique entre l'espace Schengen (libre circulation des personnes) et la zone euro (union
      monétaire).
  - si:
      contient:
      - o3
    relance: 'C''est faux : le soutien à l''agriculture relève de la Politique Agricole Commune (PAC) et non de l''espace
      Schengen.'
  - si:
      contient:
      - o4
    relance: 'C''est le contraire de la réalité : l''espace Schengen a été créé précisément pour faciliter les déplacements
      et la circulation des personnes.'
  solution: 'Garantir la libre circulation des personnes en supprimant les contrôles aux frontières intérieures. C''est exact
    : l''espace Schengen supprime les contrôles aux frontières entre les pays membres pour permettre la libre circulation
    des citoyens.'
- id: nblm-l-espace-du-rhin-superieur-situe-entre-l-4
  type: choix
  difficulte: 2
  enonce: L'espace du Rhin supérieur, situé entre la France, l'Allemagne et la Suisse, illustre quel concept géographique
    ?
  reponse:
    options:
    - id: o1
      texte: Une région transfrontalière organisée autour d'échanges et de coopérations régionales.
    - id: o2
      texte: Une région ultrapériphérique éloignée du continent européen.
    - id: o3
      texte: Un territoire fermé refusant toute aide et tout projet d'aménagement européen.
    - id: o4
      texte: Une zone de conflit militaire strictly contrôlée sans circulation de travailleurs.
    bonnes:
    - o1
  indices:
    relance: Ce territoire réunit plusieurs pays limitrophes situés le long d'un même fleuve pour mener des projets communs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur de vocabulaire : une région ultrapériphérique est un territoire ultramarin distant (comme
      La Réunion), pas un espace au cœur de l''Europe.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : les régions transfrontalières s''appuient au contraire sur des projets et financements européens
      pour développer leurs infrastructures.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : le Rhin supérieur est un espace d''intégration pacifique caractérisé par de nombreux déplacements
      quotidiens de travailleurs.'
  solution: 'Une région transfrontalière organisée autour d''échanges et de coopérations régionales. C''est exact : le Rhin
    supérieur est un exemple clé de région transfrontalière où la France, l''Allemagne et la Suisse coopèrent activement.'
- id: nblm-pourquoi-faut-il-bien-faire-attention-qu-5
  type: choix
  difficulte: 2
  enonce: Pourquoi faut-il bien faire attention quand on compare la zone euro sur une carte avec la carte de l'Union européenne
    ?
  reponse:
    options:
    - id: o1
      texte: Parce que l'Union européenne, l'espace Schengen et la zone euro ne regroupent pas exactement les mêmes pays.
    - id: o2
      texte: Parce que tous les pays membres de l'UE utilisent obligatoirement l'euro depuis 2020.
    - id: o3
      texte: Parce que la zone euro ne concerne que les territoires ultramarins et aucun pays continental.
    - id: o4
      texte: Parce que la carte de l'Union européenne ne comporte aucun pays d'Europe occidentale.
    bonnes:
    - o1
  indices:
    relance: Vérifie si chaque pays membre de l'Union européenne fait automatiquement partie de toutes les autres organisations
      européennes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente chez les élèves : plusieurs États membres de l''UE ont conservé leur monnaie nationale.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la zone euro regroupe principalement des États membres situés sur le continent européen.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la plupart des pays d''Europe occidentale font partie intégrante de la carte de l''Union européenne.'
  solution: 'Parce que l''Union européenne, l''espace Schengen et la zone euro ne regroupent pas exactement les mêmes pays.
    C''est exact : ces trois ensembles géographiques ont des périmètres différents (certains pays de l''UE n''ont pas l''euro
    ou ne font pas partie de Schengen).'
- id: nblm-parmi-les-affirmations-suivantes-sur-le-6
  type: choix
  difficulte: 3
  enonce: Parmi les affirmations suivantes sur le territoire de l'Union européenne, lesquelles sont exactes ? (Sélectionne
    2 réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Certains territoires ultramarins français (comme La Réunion) sont des régions ultrapériphériques faisant partie
        intégrante de l'UE.
    - id: o2
      texte: Une région frontalière (ou transfrontalière) est un espace à cheval sur une frontière où les échanges quotidiens
        sont nombreux.
    - id: o3
      texte: L'Union européenne et l'espace Schengen regroupent exactement la totalité des mêmes pays sans aucune exception.
    - id: o4
      texte: Depuis le Brexit en 2020, le Royaume-Uni constitue la principale région transfrontalière de la France.
    bonnes:
    - o1
    - o2
  indices:
    relance: Concentre-toi sur le statut des territoires ultramarins intégrés et sur la définition des zones de coopérations
      aux frontières.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est une erreur fréquente : certains pays de l''UE ne sont pas dans Schengen, et certains pays hors UE font
      partie de Schengen.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : le Royaume-Uni est sorti de l''Union européenne et ne constitue pas une région transfrontalière
      au sens du programme.'
  solution: 'Certains territoires ultramarins français (comme La Réunion) sont des régions ultrapériphériques faisant partie
    intégrante de l''UE ; Une région frontalière (ou transfrontalière) est un espace à cheval sur une frontière où les échanges
    quotidiens sont nombreux. C''est exact : les régions ultrapériphériques sont des territoires d''outre-mer de pays membres
    pleinement intégrés à l''UE malgré leur éloignement.'
- id: nblm-comment-appelle-t-on-un-espace-situe-de-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un espace situé de part et d'autre d'une frontière internationale où les échanges quotidiens
    entre pays voisins sont nombreux ?
  reponse:
    acceptees:
    - région transfrontalière
    fautes_tolerees: 1
  indices:
    relance: C'est un espace géographique caractérisé par des coopérations « à travers » une frontière.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'région transfrontalière. C''est exact : la fiche de cours définit la « région transfrontalière » comme un espace
    d''échanges intenses situé de part et d''autre d''une frontière.'
- id: nblm-quel-nom-porte-l-espace-europeen-au-sein-8
  type: texte_court
  difficulte: 1
  enonce: Quel nom porte l'espace européen au sein duquel la libre circulation des personnes est assurée par la suppression
    des contrôles aux frontières intérieures ?
  reponse:
    acceptees:
    - espace Schengen
    fautes_tolerees: 1
  indices:
    relance: Cet espace porte le nom de la commune luxembourgeoise où les accords de libre circulation ont été signés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'espace Schengen. C''est exact : l''« espace Schengen » garantit la libre circulation des personnes entre ses
