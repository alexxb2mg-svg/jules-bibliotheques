format: 2
notion: dynamiques-espaces-faible-densite
version: 2
etat: verifiee
declencheurs:
- zone rurale
- montagne station de ski
- diagonale du vide
- peu d'habitants
- ruralité
- néorural
- résidence secondaire à la campagne
- campagne qui se vide
- vivre à la campagne
- agritourisme
prerequis: []
essentiel: 'Un espace de faible densité est un territoire où il y a peu d''habitants au km² : campagnes, montagnes, certains
  secteurs touristiques peu urbanisés. On les a longtemps vus comme des « marges » délaissées, éloignées des villes. Le programme
  demande de comprendre qu''ils sont en réalité très divers, avec des atouts.


  Des espaces en difficulté. La « diagonale du vide » va du Nord-Est au Sud-Ouest de la France, des Ardennes et de la Meuse
  jusqu''aux Landes et aux Pyrénées. Elle se dépeuple et vieillit. Les services publics (écoles, hôpitaux, commerces) y ferment
  souvent, ce qui incite les jeunes à partir. On parle de déprise.


  Des espaces qui attirent. Autour des villes, les campagnes gagnent des habitants : familles qui cherchent un logement moins
  cher et un cadre de vie plus calme, et néoruraux venus de la ville. Le télétravail et l''arrivée de la fibre renforcent
  ce mouvement. Le littoral et les régions du Sud attirent aussi des retraités et des résidents secondaires.


  Des ressources productives. L''agriculture reste essentielle : élevage, céréales, vignes, produits de qualité (fromages,
  vins). Elle se diversifie avec le tourisme vert, l''accueil à la ferme (agritourisme) et les circuits courts. Les campagnes
  produisent aussi de l''énergie (éolien, solaire, bois).


  La montagne. Elle combine élevage sur les alpages, tourisme d''hiver (stations de ski) et d''été (randonnée), énergie hydroélectrique
  grâce aux torrents. Certaines stations comme celles des Alpes du Nord attirent des touristes du monde entier. Mais le réchauffement
  climatique réduit l''enneigement : les stations doivent diversifier leurs activités.


  Au brevet, on attend une nuance : ne pas dire « tout se vide », mais opposer espaces en déprise et espaces dynamiques, en
  citant des exemples et des causes (distance aux villes, tourisme, accessibilité).

  '
methode:
- 'Définir l''espace de faible densité : peu d''habitants au km² (campagnes, montagnes, secteurs touristiques peu urbanisés).'
- Rappeler l'image ancienne de « marges délaissées » (diagonale du vide, déprise), puis la nuancer.
- Distinguer les espaces éloignés des villes (souvent en déprise) et les espaces proches ou attractifs (souvent en croissance).
- 'Citer des ressources précises : agriculture, tourisme (stations, tourisme vert), énergie, accueil de nouveaux habitants.'
- 'Relier chaque dynamique à une cause : distance aux villes, accessibilité, cadre de vie, tourisme.'
- Conclure sur la diversité des espaces de faible densité.
vocabulaire:
- terme: espace de faible densité
  definition: un territoire où le nombre d'habitants au km² est peu élevé (campagnes, montagnes)
- terme: diagonale du vide
  definition: une bande du territoire français, du Nord-Est au Sud-Ouest, où la densité de population est faible
- terme: néorural
  definition: une personne venue de la ville qui s'installe à la campagne
- terme: déprise
  definition: 'l''abandon progressif d''un espace : baisse de la population, fermeture de services, terres délaissées'
- terme: agritourisme
  definition: l'accueil de touristes dans une exploitation agricole (chambres d'hôtes, vente à la ferme)
- terme: résidence secondaire
  definition: un logement utilisé pour les week-ends et les vacances, en plus de la résidence principale
- terme: alpage
  definition: un pâturage de haute montagne où les troupeaux passent l'été
- terme: télétravail
  definition: le fait de travailler à distance, depuis son domicile, ce qui permet de vivre loin de son employeur
erreurs_frequentes:
- Croire que tous les espaces ruraux se ressemblent et déclinent de la même façon.
- Oublier les atouts touristiques et énergétiques des espaces de montagne.
- Confondre espace rural éloigné des villes (souvent en déprise) et espace rural proche d'une ville (souvent en croissance).
- Réduire les espaces de faible densité à l'agriculture seule.
- Écrire « la campagne se vide » sans nuance ni exemple.
exemple:
  enonce: Donne un exemple montrant qu'un espace de montagne peut avoir plusieurs activités productives à la fois.
  solution: Une vallée alpine peut combiner l'élevage sur les alpages en été, le tourisme d'hiver grâce aux stations de ski,
    le tourisme d'été (randonnée) et la production d'électricité grâce à l'énergie des torrents.
exercices:
- id: definition-diagonale-vide
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que la « diagonale du vide » ?
  reponse:
    options:
    - id: a
      texte: Une bande de territoire français, du Nord-Est au Sud-Ouest, marquée par une faible densité de population
    - id: b
      texte: Une autoroute qui traverse la France du nord au sud
    - id: c
      texte: Un massif montagneux situé dans les Alpes
    bonnes:
    - a
  indices:
    relance: C'est une bande de territoire, pas un seul point ni un axe routier.
    methode: Pense à la répartition de la population française sur le territoire, entre zones denses et zones peu peuplées.
    etape: Cette bande traverse la France en diagonale, du Nord-Est au Sud-Ouest, avec peu d'habitants au km².
  pieges:
  - si:
      contient:
      - b
    relance: La diagonale du vide n'est pas une infrastructure de transport, mais une zone caractérisée par sa faible densité
      de population.
  - si:
      contient:
      - c
    relance: La diagonale du vide n'est pas limitée à un seul massif montagneux ; elle traverse plusieurs régions françaises
      du Nord-Est au Sud-Ouest.
  solution: Une bande de territoire français, du Nord-Est au Sud-Ouest, marquée par une faible densité de population.
- id: mot-neorural
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne une personne venue de la ville qui s'installe à la campagne ?
  reponse:
    acceptees:
    - néorural
    - néo-rural
    fautes_tolerees: 1
  indices:
    relance: Le mot commence par « néo- », qui signifie « nouveau ».
    methode: Ce mot combine « nouveau » et « rural », pour désigner un nouvel habitant de la campagne venu de la ville.
    etape: Assemble le préfixe qui veut dire « nouveau » avec le mot qui veut dire « de la campagne ».
  pieges:
  - si:
      valeur: rural
    relance: Ce mot désigne simplement ce qui appartient à la campagne, mais il manque le préfixe qui précise que la personne
      vient de s'y installer récemment, depuis la ville.
  solution: 'Un néorural : une personne venue de la ville qui s''installe à la campagne.'
- id: activites-montagne
  type: association
  difficulte: 2
  enonce: Relie chaque activité à la ressource des espaces de montagne qu'elle illustre.
  reponse:
    gauche:
    - id: a
      texte: L'élevage sur les alpages en été
    - id: b
      texte: Les stations de ski en hiver
    - id: c
      texte: La production d'électricité grâce aux torrents
    droite:
    - id: x
      texte: Une ressource agricole
    - id: y
      texte: Une ressource touristique
    - id: z
      texte: Une ressource énergétique
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: L'élevage est une activité agricole, les stations de ski une activité touristique.
    methode: Pour chaque activité, demande-toi si elle produit de la nourriture, accueille des touristes, ou produit de l'énergie.
    etape: La production d'électricité grâce aux torrents est une ressource énergétique, différente de l'agriculture et du
      tourisme.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque activité en te demandant si elle est agricole, touristique
      ou énergétique.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord l'élevage (agricole) et la production d'électricité (énergétique), puis les stations de ski (touristique).
  solution: L'élevage sur les alpages est une ressource agricole ; les stations de ski une ressource touristique ; la production
    d'électricité grâce aux torrents une ressource énergétique.
- id: raison-installation-neoruraux
  type: choix
  difficulte: 2
  enonce: Pourquoi certains habitants des villes choisissent-ils de s'installer à la campagne ?
  reponse:
    options:
    - id: a
      texte: Ils recherchent un cadre de vie différent et des logements souvent moins chers
    - id: b
      texte: Ils sont obligés par la loi de quitter les grandes villes
    - id: c
      texte: Ils ne trouvent aucun emploi possible à la campagne
    bonnes:
    - a
  indices:
    relance: Pense au cadre de vie et au prix des logements en ville par rapport à la campagne.
    methode: Ce choix est volontaire, pas imposé, et lié à la qualité de vie et au coût du logement.
    etape: Certains recherchent le calme et la nature, avec des logements souvent moins chers qu'en ville.
  pieges:
  - si:
      contient:
      - b
    relance: Il n'existe aucune obligation légale de quitter les grandes villes. C'est un choix volontaire des habitants.
  - si:
      contient:
      - c
    relance: Certains néoruraux continuent de travailler à distance ou dans une ville proche ; ce n'est pas une absence totale
      d'emploi qui les pousse à s'installer à la campagne.
  solution: Ils recherchent un cadre de vie différent (calme, nature) et des logements souvent moins chers qu'en ville, tout
    en pouvant parfois continuer à travailler à distance ou dans une ville proche.
- id: mot-deprise
  type: texte_court
  difficulte: 2
  enonce: 'Quel mot désigne l''abandon progressif d''un territoire rural : baisse de la population, fermeture de services,
    terres qui ne sont plus cultivées ?'
  reponse:
    acceptees:
    - déprise
    - déprise rurale
    - déprise agricole
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par un préfixe qui veut dire « perdre » ou « défaire », et finit comme « emprise ».
    methode: 'C''est le contraire d''une « prise » : le territoire n''est plus tenu, plus occupé par les habitants.'
    etape: Le mot commence par « dé- » et se termine par « -prise ».
  pieges:
  - si:
      valeur: dépeuplement
    relance: 'C''est une conséquence importante, mais on cherche le mot plus large : il inclut aussi les services et les terres
      abandonnées.'
  solution: 'La déprise : l''abandon progressif d''un espace rural (baisse de la population, fermeture de services, terres
    délaissées).'
- id: atouts-multi
  type: choix
  difficulte: 2
  enonce: Quels sont des atouts productifs des espaces de faible densité ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: L'élevage et les produits de qualité
    - id: b
      texte: Le tourisme vert et l'accueil à la ferme
    - id: c
      texte: De grands centres d'affaires internationaux
    - id: d
      texte: L'énergie (éolien, hydroélectricité, bois)
    bonnes:
    - a
    - b
    - d
  indices:
    relance: Pense à ce que la campagne et la montagne peuvent produire ou offrir.
    methode: 'Élimine ce qui est typiquement urbain : demande-toi si l''activité se trouve dans une grande ville.'
    etape: Une proposition décrit des quartiers d'affaires, qu'on trouve dans les grandes métropoles.
  pieges:
  - si:
      contient:
      - c
    relance: Les centres d'affaires internationaux se trouvent dans les grandes métropoles, pas dans les espaces de faible
      densité.
  solution: Élevage, tourisme vert et énergie sont des atouts des espaces de faible densité ; les centres d'affaires internationaux
    sont urbains.
- id: espaces-dynamiques
  type: association
  difficulte: 3
  enonce: Relie chaque espace à la dynamique qui le caractérise le mieux.
  reponse:
    gauche:
    - id: a
      texte: Une commune rurale éloignée de toute ville, dans la diagonale du vide
    - id: b
      texte: Une commune rurale proche d'une grande ville
    - id: c
      texte: Une vallée de haute montagne équipée de stations
    droite:
    - id: x
      texte: Baisse de la population et fermeture de services
    - id: y
      texte: Arrivée de familles et de néoruraux
    - id: z
      texte: Tourisme d'hiver et d'été, énergie hydroélectrique
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque espace, demande-toi s'il est proche ou éloigné d'une ville.
    methode: L'éloignement des villes entraîne souvent un déclin ; la proximité attire de nouveaux habitants.
    etape: La haute montagne équipée vit surtout du tourisme.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque espace en te demandant s'il est proche d'une ville, éloigné,
      ou de montagne.
  - si:
      diagnostic: associations_fausses
    relance: Commence par la montagne (tourisme), puis oppose l'espace éloigné à l'espace proche d'une ville.
  solution: 'Éloigné des villes : dépeuplement et fermeture de services ; proche d''une ville : arrivée de nouveaux habitants
    ; haute montagne : tourisme et énergie.'
- id: developpement-espaces-faible-densite
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre que les espaces de faible densité ne sont pas seulement des marges délaissées.'
  criteres:
  - L'élève rappelle l'image traditionnelle de marges délaissées (diagonale du vide, dépeuplement).
  - L'élève cite un exemple de dynamisme (néoruraux, tourisme, énergie).
  - L'élève nuance en distinguant espaces en croissance et espaces en déprise.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Tous les espaces ruraux évoluent-ils de la même façon ?
    methode: Pars de l'image traditionnelle des marges délaissées, puis nuance avec un exemple de dynamisme, puis conclus
      sur la diversité.
    etape: 'Tu peux commencer ainsi : « Les espaces de faible densité sont souvent présentés comme des marges délaissées...
      », puis apporter ta nuance.'
  solution: 'Les espaces de faible densité sont souvent présentés comme des marges délaissées par le développement, en particulier
    dans la diagonale du vide qui traverse la France du Nord-Est au Sud-Ouest et où la population diminue. Mais cette image
    doit être nuancée : certains espaces ruraux proches des villes attirent des néoruraux et connaissent une croissance, tandis
    que les espaces de montagne combinent agriculture, tourisme et parfois production d''électricité. Les espaces de faible
    densité présentent donc une grande diversité de dynamiques, et ne sont pas uniformément en déclin.'
