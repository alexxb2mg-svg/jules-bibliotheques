format: 2
notion: place-france-europe-monde
version: 2
etat: verifiee
declencheurs:
- francophonie
- rayonnement culturel
- membre permanent ONU
- diplomatie française
- droit de veto
- OIF
- puissance de la France
- pays qui parlent français
- conseil de sécurité
- puissance mondiale de la France
prerequis: []
essentiel: 'La France et l''Europe ont de l''influence dans le monde. On l''étudie sous trois angles : géopolitique, culturel
  et économique. Au brevet, chaque affirmation doit s''appuyer sur un exemple précis.


  Influence géopolitique. La France est membre permanent du Conseil de sécurité de l''ONU, avec les États-Unis, la Russie,
  la Chine et le Royaume-Uni. Elle y dispose d''un droit de veto : elle peut bloquer une décision. Elle possède l''arme nucléaire,
  siège au G7 et au G20, et son réseau diplomatique est l''un des plus étendus du monde. Ses territoires d''outre-mer lui
  donnent l''un des plus vastes espaces maritimes du monde et des points d''appui sur plusieurs océans.


  Influence culturelle. La francophonie désigne l''ensemble des personnes et des pays qui parlent français : plus de 300 millions
  de locuteurs. L''Organisation internationale de la Francophonie (OIF), née en 1970, réunit environ 90 États et gouvernements.
  La France est aussi le pays le plus visité au monde. Son rayonnement passe par la langue, les lycées français à l''étranger,
  la gastronomie, la mode, le cinéma et le patrimoine.


  Influence économique. La France fait partie des dix premières puissances économiques du monde. Elle compte de grands groupes
  mondiaux (aéronautique, luxe, agroalimentaire) et une agriculture puissante. Elle lance aussi des satellites depuis la Guyane,
  grâce à la base de Kourou.


  L''Europe. En 1957, la France est l''un des six pays fondateurs de la Communauté économique européenne, ancêtre de l''Union
  européenne (UE). L''UE forme un marché de près de 450 millions de consommateurs, avec une monnaie commune, l''euro, utilisée
  par une grande partie des États membres. Elle pèse dans les négociations commerciales et défend ses normes (environnement,
  protection des données). La France est l''un de ses moteurs, avec l''Allemagne.


  Nuance. Cette influence est concurrencée par les États-Unis, la Chine et d''autres puissances montantes. La France et l''Europe
  n''ont donc plus le rôle dominant d''autrefois.

  '
methode:
- 'Repérer le sujet : l''influence de la France (et de l''Europe) dans le monde, sous trois angles (géopolitique, culturel,
  économique).'
- 'Pour chaque angle, choisir un exemple précis : ONU et veto, francophonie et OIF, grands groupes ou base de Kourou.'
- 'Ajouter une date ou un chiffre quand c''est possible : OIF en 1970, traité de Rome en 1957, plus de 300 millions de francophones.'
- 'Ne pas oublier l''Europe : la France agit aussi par l''Union européenne, dont elle est fondatrice.'
- Relier l'influence actuelle à l'histoire (empire colonial pour la francophonie, construction européenne).
- 'Conclure par une nuance : la concurrence des États-Unis, de la Chine et d''autres puissances.'
vocabulaire:
- terme: influence
  definition: la capacité d'un pays à faire adopter ses idées, sa langue ou ses décisions par d'autres
- terme: membre permanent (ONU)
  definition: l'un des cinq pays qui siègent toujours au Conseil de sécurité et disposent d'un droit de veto
- terme: droit de veto
  definition: le pouvoir de bloquer une décision du Conseil de sécurité de l'ONU
- terme: francophonie
  definition: l'ensemble des personnes et des pays qui utilisent la langue française
- terme: OIF
  definition: l'Organisation internationale de la Francophonie, créée en 1970, qui réunit environ 90 États et gouvernements
- terme: G7
  definition: le groupe des sept grandes puissances industrialisées, dont la France
- terme: puissance
  definition: un pays capable d'agir et de peser sur les décisions dans le monde
- terme: Union européenne
  definition: l'union politique et économique de 27 États, dont la France est l'un des pays fondateurs
erreurs_frequentes:
- Confondre francophonie (les personnes et les pays qui parlent français) et OIF (l'organisation qui les réunit).
- Oublier que l'influence géopolitique passe par le siège permanent à l'ONU et le droit de veto.
- Réduire l'influence de la France à la culture, en oubliant l'économie et la diplomatie.
- Écrire « la France est une grande puissance » sans exemple précis ni date.
- 'Oublier l''Europe : la France agit aussi à travers l''Union européenne.'
exemple:
  enonce: Donne un exemple d'influence géopolitique et un exemple d'influence culturelle de la France dans le monde.
  solution: 'Géopolitique : la France est membre permanent du Conseil de sécurité de l''ONU, avec un droit de veto. Culturelle
    : elle est au cœur de la francophonie, incarnée par l''Organisation internationale de la Francophonie (OIF), créée en
    1970.'
exercices:
- id: annee-creation-oif
  type: nombre
  difficulte: 1
  enonce: En quelle année l'Organisation internationale de la Francophonie (OIF) a-t-elle été créée ?
  reponse:
    valeur: 1970
    forme: entier
  indices:
    relance: C'est une organisation intergouvernementale ancienne, née pendant la Guerre froide.
    methode: Cette date se situe entre 1960 (indépendances africaines) et 1980.
    etape: L'année se situe juste après la fin des grandes indépendances africaines des années 1960.
  pieges:
  - si:
      valeur: 1990
    relance: 1990 est trop tardif. L'OIF a été créée deux décennies plus tôt.
  - si:
      valeur: 1945
    relance: 1945, c'est l'année de création de l'ONU, pas de l'Organisation internationale de la Francophonie.
  solution: L'Organisation internationale de la Francophonie (OIF) a été créée en 1970.
- id: role-siege-permanent
  type: choix
  difficulte: 1
  enonce: Que permet à la France son siège permanent au Conseil de sécurité de l'ONU ?
  reponse:
    options:
    - id: a
      texte: Un droit de veto sur les décisions internationales importantes
    - id: b
      texte: Le droit d'être le seul pays représenté au Conseil de sécurité
    - id: c
      texte: L'obligation de financer seule le budget de l'ONU
    bonnes:
    - a
  indices:
    relance: Ce siège n'est partagé qu'avec quatre autres grandes puissances.
    methode: Le droit de veto permet à un membre permanent de bloquer une décision du Conseil de sécurité.
    etape: 'La France partage ce siège permanent avec quatre autres pays, mais dispose d''un pouvoir particulier : le droit
      de veto.'
  pieges:
  - si:
      contient:
      - b
    relance: La France n'est pas seule au Conseil de sécurité ; quatre autres pays sont aussi membres permanents.
  - si:
      contient:
      - c
    relance: Être membre permanent ne signifie pas financer seul le budget de l'ONU ; cela donne surtout un droit de veto
      sur les décisions.
  solution: Le siège permanent donne à la France un droit de veto, c'est-à-dire la possibilité de bloquer une décision du
    Conseil de sécurité de l'ONU.
- id: mot-francophonie
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne l'ensemble des populations et des pays qui utilisent le français ?
  reponse:
    acceptees:
    - francophonie
    fautes_tolerees: 1
  indices:
    relance: Ce mot est différent du nom de l'organisation créée en 1970 pour l'incarner.
    methode: Ce mot désigne la pratique de la langue française dans le monde, pas seulement une organisation.
    etape: Le mot commence par « franco- » et se termine par « -phonie », comme dans « téléphonie ».
  pieges:
  - si:
      valeur: OIF
    relance: L'OIF est l'organisation qui incarne officiellement ce phénomène ; il manque le mot plus général qui désigne
      l'ensemble des populations et pays utilisant le français.
  solution: 'La francophonie : l''ensemble des populations et des pays qui utilisent le français.'
- id: dimensions-influence
  type: association
  difficulte: 2
  enonce: Relie chaque exemple à la dimension de l'influence française qu'il illustre.
  reponse:
    gauche:
    - id: a
      texte: Le siège permanent au Conseil de sécurité de l'ONU
    - id: b
      texte: L'Organisation internationale de la Francophonie
    - id: c
      texte: L'appartenance au G7
    droite:
    - id: x
      texte: Une influence géopolitique
    - id: y
      texte: Une influence culturelle
    - id: z
      texte: Une influence économique
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Le Conseil de sécurité de l'ONU s'occupe de paix et de sécurité internationales, pas de langue ni d'économie.
    methode: Pour chaque exemple, demande-toi s'il concerne la diplomatie, la langue et la culture, ou l'économie.
    etape: L'OIF concerne la langue française, donc la culture ; le G7 rassemble les pays les plus industrialisés, donc l'économie.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque exemple en te demandant s'il est diplomatique, culturel ou
      économique.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord l'ONU (géopolitique), puis distingue l'OIF (culturelle) du G7 (économique).
  solution: Le siège permanent à l'ONU illustre une influence géopolitique ; l'Organisation internationale de la Francophonie
    une influence culturelle ; l'appartenance au G7 une influence économique.
- id: annee-traite-rome
  type: nombre
  difficulte: 2
  enonce: En quelle année la France et cinq autres pays fondent-ils la Communauté économique européenne, ancêtre de l'Union
    européenne, par le traité de Rome ?
  reponse:
    valeur: 1957
    forme: entier
  indices:
    relance: Ce traité est signé une douzaine d'années après la fin de la Seconde Guerre mondiale.
    methode: Il vient quelques années après la première communauté européenne, celle du charbon et de l'acier (1951).
    etape: Compte environ douze ans après 1945.
  pieges:
  - si:
      valeur: 1951
    relance: 1951, c'est la création de la CECA (charbon et acier), la première communauté. Le traité de Rome, qui crée la
      Communauté économique européenne, vient quelques années plus tard.
  - si:
      valeur: 1992
    relance: 1992, c'est le traité de Maastricht, qui crée l'Union européenne. Le traité de Rome est bien antérieur.
  solution: Le traité de Rome, signé en 1957, crée la Communauté économique européenne entre six pays, dont la France.
- id: sigle-g7
  type: texte_court
  difficulte: 2
  enonce: Quel sigle désigne le groupe des grandes puissances industrialisées dont la France fait partie, avec les États-Unis,
    l'Allemagne, le Royaume-Uni, l'Italie, le Japon et le Canada ?
  reponse:
    acceptees:
    - G7
    - G 7
    fautes_tolerees: 0
  indices:
    relance: C'est un sigle très court, formé d'une lettre et d'un chiffre.
    methode: 'La lettre est l''initiale du mot « groupe ». Le chiffre correspond au nombre de pays du groupe : compte ceux
      de l''énoncé, ils sont sept.'
    etape: Écris la lettre puis le chiffre, sans espace.
  pieges:
  - si:
      valeur: G20
    relance: Le G20 est un groupe plus large, qui inclut aussi des pays émergents. Ici, l'énoncé cite seulement sept pays.
  solution: 'Le G7 : le groupe des sept pays les plus industrialisés (États-Unis, Japon, Allemagne, Royaume-Uni, France, Italie,
    Canada).'
- id: influence-geopolitique-multi
  type: choix
  difficulte: 2
  enonce: Quels éléments illustrent l'influence géopolitique de la France ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Son siège permanent au Conseil de sécurité de l'ONU
    - id: b
      texte: Sa possession de l'arme nucléaire
    - id: c
      texte: Le succès de la gastronomie française
    - id: d
      texte: L'Organisation internationale de la Francophonie
    bonnes:
    - a
    - b
  indices:
    relance: 'Géopolitique veut dire : qui concerne le pouvoir, la sécurité et les relations entre États.'
    methode: 'Trie chaque proposition : concerne-t-elle la puissance et la sécurité des États, ou la culture et la langue
      ?'
    etape: 'Deux propositions concernent la culture et la langue : elles ne sont pas géopolitiques.'
  pieges:
  - si:
      contient:
      - c
    relance: La gastronomie fait partie du rayonnement culturel de la France, pas de sa puissance politique et militaire.
  - si:
      contient:
      - d
    relance: 'L''OIF promeut la langue française : c''est une influence culturelle. Cherche ce qui touche à la sécurité et
      aux décisions entre États.'
  solution: Le siège permanent à l'ONU (avec veto) et l'arme nucléaire sont des atouts géopolitiques. La gastronomie et l'OIF
    relèvent de l'influence culturelle.
- id: developpement-influence-france
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre que l''influence de la France dans le monde repose sur plusieurs dimensions.'
  criteres:
  - L'élève traite au moins deux dimensions (culturelle, géopolitique ou économique).
  - L'élève illustre chaque dimension par un exemple précis et daté si possible.
  - L'élève relie cette influence à l'histoire de la France (empire colonial, construction européenne).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quelles sont les différentes formes que peut prendre l'influence d'un pays dans le monde ?
    methode: Choisis deux dimensions parmi culturelle, géopolitique et économique, illustre chacune par un exemple précis,
      puis relie à l'histoire.
    etape: 'Tu peux commencer ainsi : « L''influence de la France dans le monde repose sur plusieurs dimensions... », puis
      présenter ta première dimension.'
  solution: 'L''influence de la France dans le monde repose sur plusieurs dimensions. Sur le plan géopolitique, elle est membre
    permanent du Conseil de sécurité de l''ONU, avec un droit de veto sur les décisions internationales importantes. Sur le
    plan culturel, elle est au cœur de la francophonie, incarnée par l''Organisation internationale de la Francophonie, créée
    en 1970, qui réunit 90 États et gouvernements. On peut ajouter l''influence économique, la France étant membre du G7 et
    un moteur de l''Union européenne. Cette influence est en partie héritée de l''histoire : ancien empire colonial pour la
    francophonie, rôle fondateur de la France dans la construction européenne.'
