format: 2
notion: place-france-europe-monde
version: 1
etat: verifiee
declencheurs:
- francophonie
- rayonnement culturel
- membre permanent ONU
- diplomatie française
- droit de veto
- OIF
prerequis: []
essentiel: 'La France exerce une influence culturelle, géopolitique et économique qui dépasse largement son territoire. Sur
  le plan géopolitique, elle est membre permanent du Conseil de sécurité de l''Organisation des Nations unies (ONU), ce qui
  lui donne un droit de veto sur les décisions internationales importantes, et elle possède l''arme nucléaire.


  Sur le plan culturel, la francophonie rassemble les pays et les populations qui utilisent le français, en partie héritée
  de l''ancien empire colonial français. L''Organisation internationale de la Francophonie (OIF), créée en 1970, réunit 90
  États et gouvernements pour promouvoir la langue française et la coopération entre ses membres.


  Sur le plan économique, la France est une puissance industrielle, agricole et touristique majeure, membre du G7 (les pays
  les plus industrialisés). Elle est aussi influente au sein de l''Union européenne, dont elle est l''un des membres fondateurs
  et l''un des principaux moteurs politiques et économiques.'
methode:
- 'Distinguer les trois types d''influence à illustrer : culturelle (francophonie), géopolitique (ONU), économique (G7, UE).'
- Pour chaque type d'influence, donner un exemple concret et daté si possible.
- Éviter les généralités du type « la France est une grande puissance » sans preuve précise.
- Relier l'influence actuelle de la France à son histoire (ancien empire colonial, rôle fondateur dans la construction européenne).
vocabulaire:
- terme: francophonie
  definition: l'ensemble des populations et des pays qui utilisent le français, en partie liée à l'histoire coloniale française
- terme: membre permanent (ONU)
  definition: l'un des cinq pays qui siègent en permanence au Conseil de sécurité de l'ONU avec un droit de veto (avec les
    États-Unis, la Russie, la Chine et le Royaume-Uni)
erreurs_frequentes:
- Confondre francophonie (pratique de la langue française) et OIF (l'organisation qui l'incarne officiellement).
- Oublier que l'influence géopolitique de la France passe notamment par son siège permanent au Conseil de sécurité de l'ONU.
- Réduire l'influence de la France au seul plan culturel, en oubliant l'économie et la diplomatie.
- Ne pas illustrer par un exemple précis (organisation, date, chiffre).
exemple:
  enonce: Donne un exemple d'influence géopolitique et un exemple d'influence culturelle de la France dans le monde.
  solution: 'Géopolitique : la France est membre permanent du Conseil de sécurité de l''ONU, avec un droit de veto. Culturelle
    : elle est au cœur de la francophonie, incarnée par l''Organisation internationale de la Francophonie (OIF), créée en
    1970 et qui réunit 90 États et gouvernements.'
exercices:
- id: annee-creation-oif
  type: nombre
  difficulte: 1
  enonce: En quelle année l'Organisation internationale de la Francophonie (OIF) a-t-elle été créée ?
  reponse:
    valeur: 1970
    forme: entier
  indices:
    relance: C'est une organisation intergouvernementale ancienne, née pendant la Guerre froide.
    methode: Cette date se situe entre 1960 (indépendances africaines) et 1980.
    etape: L'année se situe juste après la fin des grandes indépendances africaines des années 1960.
  pieges:
  - si:
      valeur: 1990
    relance: 1990 est trop tardif. L'OIF a été créée deux décennies plus tôt.
  - si:
      valeur: 1945
    relance: 1945, c'est l'année de création de l'ONU, pas de l'Organisation internationale de la Francophonie.
  solution: L'Organisation internationale de la Francophonie (OIF) a été créée en 1970.
- id: role-siege-permanent
  type: choix
  difficulte: 1
  enonce: Que permet à la France son siège permanent au Conseil de sécurité de l'ONU ?
  reponse:
    options:
    - id: a
      texte: Un droit de veto sur les décisions internationales importantes
    - id: b
      texte: Le droit d'être le seul pays représenté au Conseil de sécurité
    - id: c
      texte: L'obligation de financer seule le budget de l'ONU
    bonnes:
    - a
  indices:
    relance: Ce siège n'est partagé qu'avec quatre autres grandes puissances.
    methode: Le droit de veto permet à un membre permanent de bloquer une décision du Conseil de sécurité.
    etape: 'La France partage ce siège permanent avec quatre autres pays, mais dispose d''un pouvoir particulier : le droit
      de veto.'
  pieges:
  - si:
      contient:
      - b
    relance: La France n'est pas seule au Conseil de sécurité ; quatre autres pays sont aussi membres permanents.
  - si:
      contient:
      - c
    relance: Être membre permanent ne signifie pas financer seul le budget de l'ONU ; cela donne surtout un droit de veto
      sur les décisions.
  solution: Le siège permanent donne à la France un droit de veto, c'est-à-dire la possibilité de bloquer une décision du
    Conseil de sécurité de l'ONU.
- id: mot-francophonie
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne l'ensemble des populations et des pays qui utilisent le français ?
  reponse:
    acceptees:
    - francophonie
    fautes_tolerees: 1
  indices:
    relance: Ce mot est différent du nom de l'organisation créée en 1970 pour l'incarner.
    methode: Ce mot désigne la pratique de la langue française dans le monde, pas seulement une organisation.
    etape: Le mot commence par « franco- » et se termine par « -phonie », comme dans « téléphonie ».
  pieges:
  - si:
      valeur: OIF
    relance: L'OIF est l'organisation qui incarne officiellement ce phénomène ; il manque le mot plus général qui désigne
      l'ensemble des populations et pays utilisant le français.
  solution: 'La francophonie : l''ensemble des populations et des pays qui utilisent le français.'
- id: dimensions-influence
  type: association
  difficulte: 2
  enonce: Relie chaque exemple à la dimension de l'influence française qu'il illustre.
  reponse:
    gauche:
    - id: a
      texte: Le siège permanent au Conseil de sécurité de l'ONU
    - id: b
      texte: L'Organisation internationale de la Francophonie
    - id: c
      texte: L'appartenance au G7
    droite:
    - id: x
      texte: Une influence géopolitique
    - id: y
      texte: Une influence culturelle
    - id: z
      texte: Une influence économique
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Le Conseil de sécurité de l'ONU s'occupe de paix et de sécurité internationales, pas de langue ni d'économie.
    methode: Pour chaque exemple, demande-toi s'il concerne la diplomatie, la langue et la culture, ou l'économie.
    etape: L'OIF concerne la langue française, donc la culture ; le G7 rassemble les pays les plus industrialisés, donc l'économie.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque exemple en te demandant s'il est diplomatique, culturel ou
      économique.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord l'ONU (géopolitique), puis distingue l'OIF (culturelle) du G7 (économique).
  solution: Le siège permanent à l'ONU illustre une influence géopolitique ; l'Organisation internationale de la Francophonie
    une influence culturelle ; l'appartenance au G7 une influence économique.
- id: developpement-influence-france
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre que l''influence de la France dans le monde repose sur plusieurs dimensions.'
  criteres:
  - L'élève traite au moins deux dimensions (culturelle, géopolitique ou économique).
  - L'élève illustre chaque dimension par un exemple précis et daté si possible.
  - L'élève relie cette influence à l'histoire de la France (empire colonial, construction européenne).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quelles sont les différentes formes que peut prendre l'influence d'un pays dans le monde ?
    methode: Choisis deux dimensions parmi culturelle, géopolitique et économique, illustre chacune par un exemple précis,
      puis relie à l'histoire.
    etape: 'Tu peux commencer ainsi : « L''influence de la France dans le monde repose sur plusieurs dimensions... », puis
      présenter ta première dimension.'
  solution: 'L''influence de la France dans le monde repose sur plusieurs dimensions. Sur le plan géopolitique, elle est membre
    permanent du Conseil de sécurité de l''ONU, avec un droit de veto sur les décisions internationales importantes. Sur le
    plan culturel, elle est au cœur de la francophonie, incarnée par l''Organisation internationale de la Francophonie, créée
    en 1970, qui réunit 90 États et gouvernements. On peut ajouter l''influence économique, la France étant membre du G7 et
    un moteur de l''Union européenne. Cette influence est en partie héritée de l''histoire : ancien empire colonial pour la
    francophonie, rôle fondateur de la France dans la construction européenne.'
- id: nblm-quel-statut-geopolitique-particulier-la-1
  type: choix
  difficulte: 2
  enonce: Quel statut géopolitique particulier la France possède-t-elle au Conseil de sécurité de l'ONU pour affirmer sa diplomatie
    française ?
  reponse:
    options:
    - id: o1
      texte: Elle est membre permanent et dispose d'un droit de veto.
    - id: o2
      texte: Elle est membre temporaire élu pour un mandat de deux ans sans droit de veto.
    - id: o3
      texte: Elle préside l'Assemblée générale de l'ONU de manière permanente.
    - id: o4
      texte: Elle a un simple statut d'observateur diplomatique sans droit de vote.
    bonnes:
    - o1
  indices:
    relance: Pense au Conseil de sécurité et au pouvoir de bloquer une décision internationale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la France ne fait pas partie des membres tournants temporaires, elle y siège de façon permanente.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la présidence de l''Assemblée générale est tournante et ne confère pas le statut de membre
      permanent.'
  - si:
      contient:
      - o4
    relance: 'Confusion : la France est un membre permanent influent du Conseil de sécurité, et non un simple observateur.'
  solution: 'Elle est membre permanent et dispose d''un droit de veto. C''est exact : la France est l''un des cinq membres
    permanents du Conseil de sécurité de l''ONU et possède le droit de veto.'
- id: nblm-quelle-organisation-internationale-creee-2
  type: choix
  difficulte: 2
  enonce: Quelle organisation internationale créée en 1970 incarne la coopération entre les pays francophones et participe
    au rayonnement culturel de la France ?
  reponse:
    options:
    - id: o1
      texte: L'Organisation internationale de la Francophonie (OIF)
    - id: o2
      texte: Le Conseil de l'Europe
    - id: o3
      texte: Le Groupe des Sept (G7)
    - id: o4
      texte: L'UNESCO
    bonnes:
    - o1
  indices:
    relance: Recherche le sigle de l'organisation fondée en 1970 qui réunit 90 États et gouvernements.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : le Conseil de l''Europe est une organisation régionale axée sur les droits de l''homme en Europe,
      pas sur la francophonie mondiale.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le G7 est une instance de concertation économique regroupant sept pays très industrialisés.'
  - si:
      contient:
      - o4
    relance: 'Attention : l''UNESCO dépend de l''ONU et concerne la culture mondiale, tandis que l''OIF est spécifiquement
      dédiée à la francophonie.'
  solution: 'L''Organisation internationale de la Francophonie (OIF). C''est exact : l''OIF a été créée en 1970 pour promouvoir
    la langue française et la coopération entre ses 90 États et gouvernements membres.'
- id: nblm-comment-definit-on-la-francophonie-dans-3
  type: choix
  difficulte: 2
  enonce: Comment définit-on la « francophonie » dans le cadre du rayonnement culturel français à travers le monde ?
  reponse:
    options:
    - id: o1
      texte: L'ensemble des populations et des pays qui utilisent le français.
    - id: o2
      texte: Uniquement les citoyens résidant en France métropolitaine.
    - id: o3
      texte: L'ensemble des pays membres de la zone euro.
    - id: o4
      texte: Les territoires ultramarins français exclusivement.
    bonnes:
    - o1
  indices:
    relance: Pense à la communauté globale de tous les usagers de la langue française.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur courante : la francophonie s’étend bien au-delà des frontières de la métropole.'
  - si:
      contient:
      - o3
    relance: 'Confusion : la zone euro est un espace monétaire européen, sans lien direct avec l''usage du français.'
  - si:
      contient:
      - o4
    relance: 'Attention : les Outre-mer parlent français, mais la francophonie réunit des pays indépendants sur plusieurs
      continents.'
  solution: 'L''ensemble des populations et des pays qui utilisent le français. C''est exact : la francophonie désigne l''ensemble
    des personnes et des territoires qui pratiquent la langue française.'
- id: nblm-sur-le-plan-economique-et-diplomatique-a-4
  type: choix
  difficulte: 2
  enonce: Sur le plan économique et diplomatique, à quel groupe restreint réunissant les pays les plus industrialisés la France
    appartient-elle ?
  reponse:
    options:
    - id: o1
      texte: Le G7
    - id: o2
      texte: L'OPEP
    - id: o3
      texte: L'OTAN
    - id: o4
      texte: Le Mercosur
    bonnes:
    - o1
  indices:
    relance: Cherche le groupe des sept grandes puissances économiques mondiales.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : l''OPEP regroupe les pays exportateurs de pétrole.'
  - si:
      contient:
      - o3
    relance: 'Confusion : l''OTAN est une alliance politico-militaire et non un groupe d''orientation économique.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le Mercosur est une communauté économique régionale d''Amérique du Sud.'
  solution: 'Le G7. C''est exact : la France est membre du G7, qui rassemble sept des plus grandes puissances économiques
    mondiales.'
- id: nblm-quelle-est-la-difference-essentielle-ent-5
  type: choix
  difficulte: 2
  enonce: Quelle est la différence essentielle entre la « francophonie » et l'« OIF » ?
  reponse:
    options:
    - id: o1
      texte: La francophonie est la pratique de la langue française, alors que l'OIF est l'organisation officielle qui l'incarne.
    - id: o2
      texte: L'OIF est une alliance militaire alors que la francophonie est un traité commercial.
    - id: o3
      texte: La francophonie concerne uniquement l'Europe, tandis que l'OIF concerne uniquement l'Afrique.
    - id: o4
      texte: L'OIF réunit uniquement des pays anglophones qui apprennent le français.
    bonnes:
    - o1
  indices:
    relance: Distingue la pratique linguistique générale d'un côté et l'institution officielle de l'autre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur absolue : ni la francophonie ni l''OIF ne sont des traités militaires ou commerciaux.'
  - si:
      contient:
      - o3
    relance: 'Fausse distinction : ces deux notions possèdent une dimension mondiale couvrant tous les continents.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : l''OIF rassemble principalement des États ayant le français en partage.'
  solution: 'La francophonie est la pratique de la langue française, alors que l''OIF est l''organisation officielle qui l''incarne.
    C''est exact : la francophonie désigne la réalité linguistique et culturelle, tandis que l''OIF est l''institution politique
    associée.'
- id: nblm-quels-sont-deux-atouts-geopolitiques-et-6
  type: choix
  difficulte: 3
  enonce: Quels sont deux atouts géopolitiques et militaires majeurs qui renforcent la diplomatie française dans le monde
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le droit de veto au Conseil de sécurité de l'ONU
    - id: o2
      texte: La possession de l'arme nucléaire
    - id: o3
      texte: La présidence permanente de la Commission européenne
    - id: o4
      texte: Le monopole exclusif sur la langue de travail de toutes les organisations internationales
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche un pouvoir politique de blocage à l'ONU et un équipement militaire stratégique de dissuasion.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la présidence de la Commission européenne tourne entre les pays membres de l''UE et n''est
      pas un privilège permanent de la France.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : bien que le français soit une langue diplomatique majeure, il est partagé avec d''autres
      langues officielles (comme l''anglais).'
  solution: 'Le droit de veto au Conseil de sécurité de l''ONU ; La possession de l''arme nucléaire. C''est exact : la France
    peut bloquer seule une résolution internationale importante à l''ONU grâce à son droit de veto.'
- id: nblm-au-conseil-de-securite-de-l-onu-la-franc-7
  type: texte_court
  difficulte: 1
  enonce: Au Conseil de sécurité de l'ONU, la France dispose d'un pouvoir de blocage sur les décisions majeures appelé le
    droit de ________.
  reponse:
    acceptees:
    - veto
    fautes_tolerees: 1
  indices:
    relance: Ce terme d'origine latine désigne la faculté de s'opposer à l'adoption d'une décision.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'veto. C''est exact : le droit de veto permet à chacun des 5 membres permanents de bloquer une résolution.'
- id: nblm-l-organisation-creee-en-1970-pour-promou-8
  type: texte_court
  difficulte: 1
  enonce: L'organisation créée en 1970 pour promouvoir la langue française et la coopération entre 90 États et gouvernements
    est désignée par le sigle ________.
  reponse:
    acceptees:
    - OIF
    fautes_tolerees: 1
  indices:
    relance: Ce sigle en trois lettres correspond à l'Organisation internationale de la Francophonie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'OIF. C''est exact : OIF est l''acronyme de l''Organisation internationale de la Francophonie.'
