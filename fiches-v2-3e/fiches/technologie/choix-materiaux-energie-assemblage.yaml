format: 2
notion: choix-materiaux-energie-assemblage
version: 1
etat: verifiee
declencheurs:
- lampe de poche réparable
- pile jetable ou rechargeable
- panneau solaire batterie
- vis plutôt que colle
- objet mobile alimentation
- objet fixe secteur
prerequis: []
essentiel: 'Concevoir un objet technique demande de choisir ensemble le matériau, la source d''énergie et le mode d''assemblage,
  car ces trois choix s''influencent mutuellement.


  Le choix du matériau dépend de la résistance nécessaire, de la masse souhaitée, du coût et de l''impact environnemental.
  Le choix de la source d''énergie (pile, batterie rechargeable, secteur, panneau solaire) dépend de la puissance nécessaire,
  de l''autonomie voulue et de la mobilité de l''objet : un objet mobile a besoin d''une source embarquée comme une pile ou
  une batterie, alors qu''un objet fixe peut être relié au secteur.


  Le mode d''assemblage relie les pièces entre elles : un assemblage démontable (vis, clips) permet de réparer ou de changer
  une pièce facilement, alors qu''un assemblage indémontable (colle, soudure, rivetage) est souvent plus solide ou plus étanche
  mais rend la réparation difficile, ce qui va à l''encontre du développement durable.'
methode:
- Identifier la contrainte principale de l'objet (résistance, autonomie, mobilité, réparabilité) avant de choisir matériau,
  énergie et assemblage.
- 'Choisir une source d''énergie adaptée à la mobilité de l''objet : embarquée (pile, batterie) pour un objet mobile, filaire
  (secteur) pour un objet fixe.'
- Préférer un assemblage démontable quand la réparabilité est une exigence du cahier des charges.
- Vérifier la cohérence entre les trois choix, par exemple qu'un matériau lourd ne complique pas un objet mobile alimenté
  par batterie.
vocabulaire:
- terme: assemblage démontable
  definition: liaison entre pièces qui peut être défaite sans destruction (vis, clips)
- terme: assemblage indémontable
  definition: liaison entre pièces qui ne peut pas être défaite sans destruction (colle, soudure)
erreurs_frequentes:
- Choisir un assemblage collé pour un objet qui doit être réparable.
- Choisir une pile non rechargeable pour un objet utilisé très fréquemment, ce qui augmente le coût et les déchets.
- Oublier de vérifier que la source d'énergie choisie fournit assez de puissance pour l'objet.
exemple:
  enonce: On conçoit une lampe de poche destinée à être réparée facilement. Justifier le choix d'un assemblage par vis plutôt
    que par colle, et d'une pile rechargeable plutôt qu'une pile jetable.
  solution: 'Un assemblage par vis est démontable : on peut ouvrir la lampe pour changer l''ampoule ou un composant défectueux,
    ce qui allonge sa durée de vie. Une pile rechargeable réduit les déchets et le coût sur le long terme par rapport à des
    piles jetables, ce qui est cohérent avec une démarche de réparabilité et de développement durable.'
exercices:
- id: mobilite-source-energie
  type: choix
  difficulte: 1
  enonce: Pourquoi un objet mobile a-t-il besoin d'une source d'énergie embarquée comme une pile ou une batterie ?
  reponse:
    options:
    - id: a
      texte: Parce qu'il ne peut pas rester relié en permanence à une prise secteur fixe
    - id: b
      texte: Parce qu'une pile coûte toujours moins cher qu'une prise secteur
    - id: c
      texte: Parce que les objets mobiles n'ont jamais besoin de beaucoup de puissance
    bonnes:
    - a
  indices:
    relance: Un câble relié au secteur limite-t-il les déplacements d'un objet ?
    methode: Pense à ce qui se passe si un objet qui doit se déplacer reste relié à une prise fixe.
    etape: Un objet mobile doit transporter sa source d'énergie avec lui, contrairement à un objet fixe.
  pieges:
  - si:
      contient:
      - b
    relance: Le coût dépend du type de pile ou de batterie choisi, ce n'est pas la raison principale du besoin d'une source
      embarquée.
  - si:
      contient:
      - c
    relance: Certains objets mobiles ont besoin de beaucoup de puissance ; ce n'est pas ce qui détermine le besoin d'une source
      embarquée.
  solution: 'Un objet mobile ne peut pas rester relié en permanence à une prise secteur fixe : il a donc besoin d''une source
    d''énergie embarquée, comme une pile ou une batterie, qu''il transporte avec lui.'
- id: nom-assemblage-vis
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un assemblage, comme celui par vis ou par clips, qui peut être défait sans destruction ?
  reponse:
    acceptees:
    - demontable
    - démontable
    - assemblage demontable
    fautes_tolerees: 1
  indices:
    relance: Ce mot évoque la possibilité de « démonter » l'objet sans le casser.
    methode: On peut ouvrir et refermer cet assemblage plusieurs fois, contrairement à un collage.
    etape: Le mot cherché commence par « dé... » et contient le mot « monter ».
  pieges:
  - si:
      valeur: indemontable
    relance: 'Un assemblage indémontable est le contraire de celui recherché ici : il ne peut pas être défait sans destruction.'
  solution: 'On appelle cela un assemblage démontable : il peut être défait sans destruction, ce qui permet de réparer ou
    de changer une pièce facilement.'
- id: pourquoi-vis-plutot-que-colle
  type: choix
  difficulte: 2
  enonce: Pour un objet devant être réparable, pourquoi préfère-t-on souvent un assemblage par vis à un assemblage par colle
    ?
  reponse:
    options:
    - id: a
      texte: Parce que l'assemblage par vis peut être ouvert pour changer une pièce défectueuse
    - id: b
      texte: Parce que la colle coûte toujours plus cher que les vis
    - id: c
      texte: Parce que l'assemblage par vis est toujours plus étanche que la colle
    bonnes:
    - a
  indices:
    relance: Peut-on rouvrir facilement un objet collé pour en changer une pièce ?
    methode: Pense à la possibilité de démonter l'objet pour intervenir dessus après l'assemblage.
    etape: Un assemblage démontable comme la vis permet d'ouvrir et refermer l'objet sans le détruire.
  pieges:
  - si:
      contient:
      - b
    relance: Le coût des vis ou de la colle dépend du produit choisi, ce n'est pas la raison de ce choix pour la réparabilité.
  - si:
      contient:
      - c
    relance: 'C''est en général l''inverse : la colle ou la soudure sont souvent plus étanches, mais rendent la réparation
      difficile.'
  solution: 'Un assemblage par vis est démontable : il peut être ouvert pour changer une pièce défectueuse, ce qui permet
    de réparer l''objet, contrairement à un assemblage collé qui est indémontable.'
- id: associer-choix-conception
  type: association
  difficulte: 2
  enonce: Relie chaque situation au choix technique le plus adapté.
  reponse:
    gauche:
    - id: a
      texte: Objet mobile utilisé loin de toute prise secteur
    - id: b
      texte: Objet devant être réparé facilement
    - id: c
      texte: Objet nécessitant un assemblage très étanche, sans besoin de réparation
    droite:
    - id: x
      texte: Source d'énergie embarquée (pile ou batterie)
    - id: y
      texte: Assemblage démontable (vis, clips)
    - id: z
      texte: Assemblage indémontable (colle, soudure)
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une de ces situations concerne l'énergie, les deux autres le mode d'assemblage.
    methode: Repère d'abord la situation liée à l'énergie (objet mobile loin d'une prise).
    etape: Ensuite, distingue la situation qui demande la réparabilité de celle qui demande l'étanchéité.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la situation liée à l'énergie, puis les deux liées à l'assemblage.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la situation d'énergie embarquée, puis distingue assemblage démontable et indémontable.
  solution: 'Objet mobile loin d''une prise : source d''énergie embarquée. Objet réparable facilement : assemblage démontable.
    Objet très étanche sans réparation : assemblage indémontable.'
- id: etapes-choix-conception
  type: ordre
  difficulte: 2
  enonce: Range ces étapes de la méthode pour choisir matériau, énergie et assemblage d'un objet technique.
  reponse:
    elements:
    - id: identifier
      texte: Identifier la contrainte principale de l'objet
    - id: energie
      texte: Choisir une source d'énergie adaptée à la mobilité de l'objet
    - id: assemblage
      texte: Choisir un mode d'assemblage selon la réparabilité exigée
    - id: verifier
      texte: Vérifier la cohérence entre les trois choix
  indices:
    relance: Peut-on choisir une source d'énergie sans avoir d'abord identifié la contrainte principale de l'objet ?
    methode: On identifie d'abord la contrainte, puis on choisit l'énergie, puis l'assemblage, puis on vérifie la cohérence
      globale.
    etape: La toute première étape consiste toujours à identifier la contrainte principale de l'objet.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient logiquement avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la première étape (identifier la contrainte) et la dernière (vérifier la cohérence), puis range
      les deux autres.
  solution: On identifie d'abord la contrainte principale de l'objet, puis on choisit une source d'énergie adaptée à sa mobilité,
    puis un mode d'assemblage selon la réparabilité exigée, et enfin on vérifie la cohérence entre les trois choix.
- id: justifier-choix-objet-connecte
  type: ouverte
  difficulte: 3
  enonce: Un objet connecté doit fonctionner en extérieur, loin de toute prise électrique, pendant plusieurs mois sans intervention,
    et doit pouvoir être réparé facilement. Propose et justifie un choix de source d'énergie et un choix d'assemblage.
  criteres:
  - L'élève propose une source d'énergie embarquée adaptée à l'autonomie longue (panneau solaire et/ou batterie rechargeable).
  - L'élève justifie ce choix par l'absence de prise secteur et le besoin d'autonomie longue.
  - L'élève propose un assemblage démontable (vis, clips).
  - L'élève justifie ce choix par le besoin de réparabilité.
  indices:
    relance: Quelle source d'énergie permet une autonomie longue sans intervention humaine, en extérieur ?
    methode: 'Reprends la méthode de la fiche : identifier la contrainte, choisir l''énergie, choisir l''assemblage, vérifier
      la cohérence.'
    etape: 'Tu peux commencer ainsi : « La contrainte principale ici est l''autonomie sans intervention... ».'
  solution: 'La contrainte principale est l''autonomie longue sans intervention et l''absence de prise secteur : je choisis
    donc un panneau solaire associé à une batterie rechargeable, qui permet de fonctionner plusieurs mois sans changer de
    source d''énergie. Pour l''assemblage, je choisis un assemblage démontable par vis, qui permet d''ouvrir le boîtier facilement
    pour réparer un composant défectueux, ce qui répond à l''exigence de réparabilité.'
