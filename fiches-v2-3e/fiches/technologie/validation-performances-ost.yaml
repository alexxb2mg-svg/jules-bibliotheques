# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: validation-performances-ost
version: 1
etat: verifiee
declencheurs:
- robot suiveur de ligne
- lampe solaire autonomie
- vitesse mesurée
- exigence non respectée
- écart mesure
- marge acceptable
prerequis: []
essentiel: 'Valider les performances d''un objet ou système technique (OST), c''est comparer les résultats de mesures réelles
  aux exigences fixées dans le cahier des charges, pour déterminer si l''objet répond bien au besoin initial.


  Une exigence du cahier des charges est en général exprimée avec une valeur cible et parfois une marge acceptable, par exemple
  « autonomie supérieure à 20 km » ou « masse comprise entre 2 et 2,5 kg ». La validation consiste à mesurer la grandeur réelle
  et à vérifier qu''elle respecte cette exigence.


  Si une performance mesurée ne respecte pas l''exigence, il faut identifier la cause de l''écart (matériau, conception, réglage)
  et proposer une amélioration, avant de retester : la validation des performances est souvent une étape itérative, en lien
  avec le prototypage.'
methode:
- Relever dans le cahier des charges les exigences chiffrées à valider.
- Mesurer la performance réelle de l'objet selon un protocole précis.
- 'Comparer chaque mesure à l''exigence correspondante : respectée ou non respectée.'
- Si une exigence n'est pas respectée, analyser la cause probable de l'écart avant de proposer une amélioration.
vocabulaire:
- terme: exigence
  definition: critère chiffré ou précis que l'objet technique doit respecter, fixé dans le cahier des charges
- terme: écart
  definition: différence entre la performance mesurée et l'exigence attendue
erreurs_frequentes:
- Valider un objet sans avoir réellement mesuré sa performance, en se fiant à une estimation.
- Oublier la marge acceptable d'une exigence et exiger une valeur exacte impossible à atteindre.
- Ne pas chercher la cause d'un écart avant de modifier la conception au hasard.
exemple:
  enonce: Le cahier des charges d'un robot suiveur de ligne exige une vitesse maximale d'au moins 0,3 m/s. Le test donne une
    vitesse mesurée de 0,25 m/s. L'exigence est-elle respectée ? Que faire ?
  solution: L'exigence n'est pas respectée, 0,25 m/s est inférieur aux 0,3 m/s attendus. Il faut chercher la cause possible,
    comme un moteur trop faible, des frottements excessifs ou une batterie pas assez chargée, proposer une amélioration, comme
    changer de moteur ou réduire les frottements, puis retester.
exercices:
- id: role-exigence-cahier-charges
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une exigence dans un cahier des charges ?
  reponse:
    options:
    - id: a
      texte: Un critère chiffré ou précis que l'objet doit respecter
    - id: b
      texte: Une simple suggestion facultative pour améliorer l'objet
    - id: c
      texte: Une description du prototype déjà réalisé
    bonnes:
    - a
  indices:
    relance: Une exigence est-elle facultative ou obligatoire pour valider l'objet ?
    methode: Le cahier des charges fixe des critères que l'objet doit respecter, pas seulement des idées.
    etape: Une exigence est souvent exprimée avec une valeur cible, parfois avec une marge acceptable.
  pieges:
  - si:
      contient:
      - b
    relance: Une exigence n'est pas facultative, elle doit être respectée pour que l'objet soit validé.
  - si:
      contient:
      - c
    relance: Une exigence est fixée avant la réalisation, dans le cahier des charges, pas une description du prototype déjà
      fait.
  solution: Une exigence est un critère chiffré ou précis que l'objet technique doit respecter, fixé dans le cahier des charges.
- id: nom-difference-mesure-exigence
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la différence entre la performance mesurée et l'exigence attendue ?
  reponse:
    acceptees:
    - ecart
    - écart
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne une différence, un décalage entre deux valeurs.
    methode: On utilise ce mot quand la mesure ne correspond pas exactement à l'exigence fixée.
    etape: Le mot cherché commence par « éc... ».
  pieges:
  - si:
      valeur: exigence
    relance: L'exigence est le critère attendu, pas la différence entre la mesure et ce critère.
  solution: 'On appelle cela un écart : c''est la différence entre la performance mesurée et l''exigence attendue.'
- id: pourquoi-analyser-cause-ecart
  type: choix
  difficulte: 2
  enonce: Pourquoi faut-il analyser la cause probable d'un écart avant de proposer une amélioration ?
  reponse:
    options:
    - id: a
      texte: Pour modifier la conception de façon ciblée plutôt qu'au hasard
    - id: b
      texte: Pour éviter de refaire le test après modification
    - id: c
      texte: Pour que l'exigence du cahier des charges soit automatiquement modifiée
    bonnes:
    - a
  indices:
    relance: Que risque-t-on si l'on modifie la conception sans savoir d'où vient le problème ?
    methode: Chercher la cause permet de cibler la vraie source du problème avant d'agir.
    etape: Une des erreurs fréquentes de la fiche concerne justement une modification faite « au hasard ».
  pieges:
  - si:
      contient:
      - b
    relance: Il faut au contraire retester après avoir modifié la conception, pas éviter ce nouveau test.
  - si:
      contient:
      - c
    relance: L'exigence du cahier des charges ne change pas automatiquement ; c'est l'objet qu'il faut améliorer pour la respecter.
  solution: Analyser la cause probable permet de modifier la conception de façon ciblée, plutôt que de changer des éléments
    au hasard sans savoir si cela résoudra vraiment le problème.
- id: associer-exigence-verdict
  type: association
  difficulte: 2
  enonce: Pour chaque situation, indique si l'exigence du cahier des charges est respectée ou non.
  reponse:
    gauche:
    - id: a
      texte: 'Exigence : au moins 6 heures d''autonomie. Mesure : 5h30.'
    - id: b
      texte: 'Exigence : au moins 0,3 m/s. Mesure : 0,35 m/s.'
    - id: c
      texte: 'Exigence : masse comprise entre 2 et 2,5 kg. Mesure : 2,7 kg.'
    droite:
    - id: x
      texte: Exigence non respectée
    - id: y
      texte: Exigence respectée
    - id: z
      texte: Exigence non respectée
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Compare chaque valeur mesurée à la valeur ou à la plage exigée.
    methode: 5h30 est inférieur à 6 heures ; 0,35 m/s est supérieur à 0,3 m/s ; 2,7 kg dépasse la plage 2 à 2,5 kg.
    etape: Deux situations ne respectent pas l'exigence, une seule la respecte.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Recompare chaque mesure à son exigence chiffrée.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la situation où la mesure dépasse largement l'exigence minimale (situation respectée).
  solution: '5h30 contre 6 heures minimales : exigence non respectée. 0,35 m/s contre 0,3 m/s minimum : exigence respectée.
    2,7 kg contre 2 à 2,5 kg : exigence non respectée.'
- id: etapes-validation-performances
  type: ordre
  difficulte: 2
  enonce: Range ces étapes de la méthode pour valider les performances d'un objet technique.
  reponse:
    elements:
    - id: relever
      texte: Relever dans le cahier des charges les exigences chiffrées
    - id: mesurer
      texte: Mesurer la performance réelle selon un protocole précis
    - id: comparer
      texte: Comparer chaque mesure à l'exigence correspondante
    - id: analyser
      texte: Analyser la cause d'un écart avant de proposer une amélioration
  indices:
    relance: Peut-on comparer une mesure à une exigence si l'on n'a pas encore mesuré la performance réelle ?
    methode: On relève d'abord les exigences, puis on mesure, puis on compare, puis on analyse un éventuel écart.
    etape: La toute première étape consiste toujours à relever les exigences chiffrées du cahier des charges.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient logiquement avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la première étape (relever les exigences) et la dernière (analyser un écart), puis range les deux
      autres.
  solution: On relève d'abord les exigences chiffrées du cahier des charges, puis on mesure la performance réelle, puis on
    compare chaque mesure à l'exigence correspondante, et enfin on analyse la cause d'un écart avant de proposer une amélioration.
- id: analyser-drone-autonomie
  type: ouverte
  difficulte: 3
  enonce: Le cahier des charges d'un drone exige une autonomie de vol d'au moins 15 minutes. Le test donne une autonomie mesurée
    de 11 minutes. L'exigence est-elle respectée ? Propose une cause possible de l'écart et une amélioration.
  criteres:
  - L'élève indique que l'exigence n'est pas respectée (11 min < 15 min).
  - L'élève propose une cause plausible de l'écart (batterie, poids, moteur, consommation).
  - L'élève propose une amélioration cohérente avec la cause identifiée.
  - L'élève mentionne qu'il faudrait retester après la modification.
  indices:
    relance: Compare 11 minutes à l'exigence de 15 minutes.
    methode: Reprends la méthode de l'exemple du robot suiveur de ligne pour structurer ta réponse.
    etape: 'Tu peux commencer ainsi : « L''exigence n''est pas respectée car... ».'
  solution: L'exigence n'est pas respectée, 11 minutes est inférieur aux 15 minutes exigées. Une cause possible est une batterie
    de capacité insuffisante ou un drone trop lourd, ce qui augmente la consommation d'énergie. Une amélioration possible
    serait d'utiliser une batterie de plus grande capacité ou d'alléger la structure du drone, puis de retester l'autonomie
    réelle après cette modification.
