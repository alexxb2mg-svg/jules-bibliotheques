# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: validation-performances-ost
version: 2
etat: verifiee
declencheurs:
- respecte le cahier des charges
- comparer la mesure à l'exigence
- tableau des essais du prototype
- niveau attendu du critère
- écart entre mesure et attendu
- essais du robot suiveur de ligne
- valider la solution par un test
- mesures répétées et moyenne
- le prototype atteint-il l'exigence
prerequis:
- performance-ost
essentiel: 'Valider un objet technique, c''est vérifier par des essais qu''il se comporte comme prévu et qu''il atteint les
  performances demandées.


  Le cahier des charges fixe les exigences. Pour chaque fonction, il donne un critère (ce que l''on mesure, par exemple le
  temps d''ouverture d''une barrière) et un niveau (la valeur à respecter, par exemple 5 s au maximum). Des normes peuvent
  aussi imposer des exigences : sécurité, bruit, consommation.


  Un protocole de test décrit précisément l''essai pour qu''on puisse le refaire. Il indique :

  - la grandeur mesurée et son unité (durée en s, vitesse en m/s, température en °C, bruit en dB...) ;

  - l''appareil de mesure (chronomètre, mètre, thermomètre, sonomètre...) ;

  - les paramètres et les conditions de l''essai (même piste, batterie chargée, même charge...) ;

  - le nombre d''essais : plusieurs mesures, puis une moyenne ;

  - la comparaison du résultat au niveau du cahier des charges, puis la conclusion : exigence validée ou non.


  Une grandeur se calcule parfois à partir de mesures : vitesse = distance ÷ durée. La moyenne de plusieurs mesures = somme
  des mesures ÷ nombre de mesures.


  Attention au sens de l''exigence. « Au maximum » : la mesure doit être inférieure ou égale au niveau (temps, bruit, coût).
  « Au minimum » : la mesure doit être supérieure ou égale au niveau (autonomie, vitesse). Les valeurs comparées doivent avoir
  la même unité.


  Exemple : niveau « 5 s au maximum », mesure moyenne 4 s. 4 est inférieur à 5 : exigence validée.


  Si une exigence n''est pas respectée, on modifie la solution (réglage, programme, composant) et on refait le test, dans
  les mêmes conditions.


  Au brevet, on attend : proposer un protocole de test complet, calculer une moyenne ou une vitesse, comparer aux exigences
  d''un tableau d''essais et conclure.

  '
methode:
- Lire dans le cahier des charges le critère et son niveau (valeur, unité, minimum ou maximum).
- Choisir la grandeur à mesurer, l'appareil de mesure et les conditions de l'essai.
- Faire plusieurs mesures dans les mêmes conditions et les noter dans un tableau.
- Calculer si besoin une moyenne ou une grandeur (vitesse = distance ÷ durée), en vérifiant les unités.
- Comparer le résultat au niveau, en faisant attention à « au minimum » ou « au maximum ».
- Conclure (exigence validée ou non) et proposer une modification si besoin.
vocabulaire:
- terme: critère
  definition: Ce que l'on mesure pour juger une fonction.
- terme: niveau
  definition: Valeur à respecter pour un critère (avec minimum ou maximum).
- terme: protocole de test
  definition: Description précise d'un essai pour qu'on puisse le refaire.
- terme: grandeur mesurée
  definition: Propriété que l'on mesure lors d'un essai (durée, vitesse, température...).
- terme: norme
  definition: Règle commune qui impose des exigences, par exemple de sécurité.
- terme: performance
  definition: Résultat qu'un objet atteint pour une fonction donnée.
- terme: moyenne
  definition: Somme des mesures divisée par leur nombre.
- terme: validation
  definition: Conclusion, après essais, que l'objet respecte les exigences.
erreurs_frequentes:
- Faire une seule mesure et conclure, alors qu'une mesure peut être faussée.
- Changer les conditions d'un essai à l'autre (piste différente, batterie à moitié vide).
- Confondre « au minimum » et « au maximum » en comparant au cahier des charges.
- Oublier l'unité, ou comparer des valeurs dans des unités différentes (ms et s, cm et m).
- Diviser la durée par la distance au lieu de la distance par la durée pour une vitesse.
exemple:
  enonce: 'Cahier des charges d''un éclairage automatique : « la lampe s''allume moins de 1 s après la détection ». Trois
    mesures au chronomètre : 0,6 s ; 0,8 s ; 0,7 s. L''exigence est-elle validée ?'
  solution: 'Moyenne : (0,6 + 0,8 + 0,7) ÷ 3 = 2,1 ÷ 3 = 0,7 s. 0,7 s est inférieur à 1 s, et chaque mesure l''est aussi :
    l''exigence est validée.'
exercices:
- id: nom-du-niveau
  type: texte_court
  difficulte: 1
  enonce: 'Dans un cahier des charges, on lit « critère : temps d''ouverture de la barrière ; ... : 5 s au maximum ». Comment
    appelle-t-on la valeur à respecter pour un critère, notée à la place des points ?'
  reponse:
    acceptees:
    - niveau
    - le niveau
    - niveau d'exigence
    - niveau attendu
  indices:
    relance: Le critère dit ce que l'on mesure. Quel mot désigne la valeur que la mesure doit atteindre ou ne pas dépasser
      ?
    methode: Dans un cahier des charges, chaque fonction est décrite par un critère, puis par la valeur exigée pour ce critère
      (et parfois une flexibilité).
    etape: 'Un cahier des charges se lit souvent en colonnes : fonction, critère, ..., flexibilité. Il te faut le nom de la
      colonne qui manque.'
  pieges:
  - si:
      valeur: critère
    relance: Le critère, c'est ce que l'on mesure (ici le temps d'ouverture). Comment appelle-t-on la valeur exigée ?
  - si:
      valeur: flexibilité
    relance: La flexibilité indique la marge tolérée autour de la valeur. Comment appelle-t-on la valeur elle-même ?
  solution: 'C''est le niveau : ici, le niveau exigé pour le critère « temps d''ouverture » est 5 s au maximum.'
- id: moyenne-barriere
  type: nombre
  difficulte: 1
  enonce: 'Le cahier des charges d''une barrière de parking impose un temps d''ouverture de 5 s au maximum. On chronomètre
    cinq ouvertures : 4,2 s ; 3,8 s ; 4,0 s ; 4,4 s ; 3,6 s. Calcule le temps d''ouverture moyen, en secondes.'
  reponse:
    valeur: 4
  indices:
    relance: Comment calcule-t-on la moyenne de plusieurs mesures ?
    methode: Additionne toutes les mesures, puis divise la somme par le nombre de mesures.
    etape: La somme des cinq durées vaut 20 s. Il reste une division à faire.
  pieges:
  - si:
      valeur: 20
    relance: Tu as trouvé la somme des cinq durées. Que faut-il faire ensuite pour obtenir une moyenne ?
  - si:
      diagnostic: valeur_fausse
    relance: Refais l'addition des cinq durées avec soin, puis divise par le nombre de mesures.
  solution: 'Somme : 4,2 + 3,8 + 4,0 + 4,4 + 3,6 = 20 s. Moyenne : 20 ÷ 5 = 4 s. C''est moins que 5 s (et chaque mesure aussi)
    : l''exigence est validée.'
- id: vitesse-robot
  type: nombre
  difficulte: 2
  enonce: Le cahier des charges d'un robot suiveur de ligne exige une vitesse moyenne de 0,20 m/s au minimum. Lors d'un essai,
    le robot parcourt une piste droite de 3 m en 12 s. Calcule sa vitesse moyenne, en m/s.
  reponse:
    valeur: 0.25
  indices:
    relance: Quelle formule relie la vitesse, la distance et la durée ?
    methode: Vitesse moyenne = distance parcourue ÷ durée du parcours, avec la distance en mètres et la durée en secondes.
    etape: 'La distance est de 3 m et la durée de 12 s : pose la division distance ÷ durée.'
  pieges:
  - si:
      valeur: 4
    relance: Tu as divisé la durée par la distance. Dans quel ordre faut-il diviser pour obtenir des mètres par seconde ?
  - si:
      valeur: 36
    relance: Tu as multiplié la distance par la durée. Une vitesse est-elle un produit ou un quotient ?
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que tu divises bien la distance (en m) par la durée (en s).
  solution: v = 3 ÷ 12 = 0,25 m/s. Comme 0,25 m/s est supérieur à 0,20 m/s, l'exigence de vitesse est validée.
- id: tableau-serre
  type: choix
  difficulte: 2
  enonce: "Voici le tableau des essais d'une serre connectée :\n  Température dans la serre — niveau : 28 °C au maximum —\
    \ mesure : 27 °C\n  Déclenchement de l'arrosage — niveau : quand l'humidité du sol passe sous 30 % — mesure : l'arrosage\
    \ démarre à 35 %\n  Autonomie sur batterie — niveau : 48 h au minimum — mesure : 52 h\n  Bruit de la pompe — niveau :\
    \ 40 dB au maximum — mesure : 46 dB\nQuels critères sont validés ?\n"
  reponse:
    options:
    - id: a
      texte: la température
    - id: b
      texte: le déclenchement de l'arrosage
    - id: c
      texte: l'autonomie
    - id: d
      texte: le bruit de la pompe
    bonnes:
    - a
    - c
  indices:
    relance: Pour chaque ligne, le niveau est-il un maximum, un minimum, ou une valeur de déclenchement ?
    methode: Compare chaque mesure au niveau. « Au maximum » veut dire que la mesure doit être plus petite ou égale ; « au
      minimum », plus grande ou égale.
    etape: 'Première ligne : 27 °C est plus petit que 28 °C, niveau maximum respecté. Fais pareil pour les trois autres lignes.'
  pieges:
  - si:
      contient:
      - b
    relance: L'arrosage doit démarrer quand l'humidité passe sous 30 %. À 35 %, est-on déjà sous cette valeur ?
  - si:
      contient:
      - d
    relance: Le niveau est 40 dB au maximum. La mesure de 46 dB est-elle en dessous ?
  - si:
      diagnostic: incomplet
    relance: Il te manque un critère validé. Pour un niveau « au minimum », la mesure doit être plus grande.
  solution: 'Validés : la température (27 °C ≤ 28 °C) et l''autonomie (52 h ≥ 48 h). Non validés : l''arrosage démarre trop
    tôt (35 % au lieu de moins de 30 %) et la pompe est trop bruyante (46 dB > 40 dB).'
- id: etapes-du-protocole
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes du protocole de test du temps d'ouverture d'une barrière de parking.
  reponse:
    elements:
    - id: a
      texte: Lire dans le cahier des charges le critère et son niveau
    - id: b
      texte: Choisir la grandeur à mesurer et l'appareil de mesure (un chronomètre)
    - id: c
      texte: Réaliser plusieurs ouvertures dans les mêmes conditions et noter chaque durée dans un tableau
    - id: d
      texte: Calculer la durée moyenne et la comparer au niveau exigé
    - id: e
      texte: Conclure si l'exigence est validée ou non, et proposer une modification si besoin
  indices:
    relance: Peut-on choisir quoi mesurer avant de savoir ce que le cahier des charges exige ?
    methode: Un protocole va de l'exigence à la conclusion, en passant par la préparation de la mesure, les mesures, puis
      le calcul.
    etape: On commence par lire le cahier des charges. Qu'est-ce qu'il faut préparer ensuite, avant de mesurer ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Peut-on calculer une moyenne avant d'avoir des mesures ?
  - si:
      diagnostic: ordre_faux
    relance: Pars de l'exigence du cahier des charges et termine par la conclusion. Place les autres étapes entre les deux.
  solution: 'a, b, c, d, e : lire l''exigence, choisir la grandeur et l''appareil, mesurer plusieurs fois, calculer et comparer,
    conclure.'
- id: proposer-un-protocole
  type: ouverte
  difficulte: 3
  enonce: Le cahier des charges d'un éclairage à détecteur de présence exige que la lampe détecte une personne jusqu'à 5 m
    au minimum. Propose un protocole de test pour vérifier cette exigence.
  criteres:
  - L'élève indique la grandeur mesurée (distance entre la personne et le détecteur, en m) et l'appareil (mètre ruban, marques
    au sol).
  - L'élève décrit des essais répétés dans les mêmes conditions (même lumière, même vitesse de marche, plusieurs passages
    à différentes distances).
  - L'élève explique comment il conclut en comparant le résultat à 5 m (validé si la lampe s'allume à 5 m ou plus).
  indices:
    relance: Quelle grandeur faut-il mesurer, et avec quel instrument ?
    methode: 'Pense aux cinq parties d''un protocole : grandeur, appareil, conditions, nombre d''essais, comparaison au niveau.'
    etape: On peut tracer des marques au sol à différentes distances du détecteur. Que fait-on ensuite à chaque marque ?
  solution: Avec un mètre ruban, je trace des marques au sol à 3 m, 4 m, 5 m et 6 m du détecteur. La lampe éteinte, une personne
    passe à chaque marque, à allure normale, trois fois, dans les mêmes conditions de lumière. Je note dans un tableau si
    la lampe s'allume. Si la lampe s'allume à chaque passage jusqu'à 5 m au moins, l'exigence est validée ; sinon, il faut
    régler ou déplacer le détecteur et refaire le test.
- id: unite-de-la-grandeur
  type: choix
  difficulte: 1
  enonce: Pour tester la performance d'un robot, on mesure la vitesse d'un robot suiveur de ligne. Quelle unité et quel appareil
    conviennent ?
  reponse:
    options:
    - id: a
      texte: Des m/s, avec une distance connue et un chronomètre
    - id: b
      texte: Des kg, avec un chronomètre
    - id: c
      texte: Des dB, avec un mètre ruban
    - id: d
      texte: Des °C, avec un chronomètre
    bonnes:
    - a
  indices:
    relance: Une vitesse relie deux grandeurs. Lesquelles ?
    methode: 'Vitesse = distance ÷ durée : il faut donc mesurer une longueur et un temps.'
    etape: Cherche l'unité qui contient à la fois des mètres et des secondes.
  pieges:
  - si:
      contient:
      - b
    relance: Des kg mesurent une masse. Est-ce ce qu'on cherche pour une vitesse ?
  - si:
      contient:
      - c
    relance: Des dB mesurent un niveau sonore. Est-ce ce qu'on cherche pour une vitesse ?
  - si:
      contient:
      - d
    relance: Des °C mesurent une température. Est-ce ce qu'on cherche pour une vitesse ?
  solution: 'Vitesse = distance ÷ durée : on l''exprime en m/s, en mesurant une distance et une durée au chronomètre.'
- id: ecart-au-niveau
  type: nombre
  difficulte: 2
  enonce: Le cahier des charges d'un ventilateur impose un bruit de 40 dB au maximum. Un sonomètre donne 46 dB. De combien
    de dB la mesure dépasse-t-elle le niveau ?
  reponse:
    valeur: 6
    forme: entier
  indices:
    relance: 'Que faut-il comparer : la mesure et quelle autre valeur ?'
    methode: Écart = mesure − niveau exigé, quand la mesure dépasse le niveau.
    etape: Soustrais le niveau exigé de la mesure. Tu obtiens le dépassement.
  pieges:
  - si:
      valeur: -6
    relance: Tu as inversé la soustraction. Le dépassement se calcule mesure moins niveau.
  - si:
      valeur: 86
    relance: Tu as additionné. Un écart se calcule avec une soustraction.
  solution: '46 − 40 = 6 dB. La mesure dépasse le maximum autorisé : l''exigence n''est pas validée.'
- id: nblm-dans-le-cadre-de-la-validation-des-perfo-1
  type: choix
  difficulte: 2
  enonce: Dans le cadre de la validation des performances d'un objet technique, que signifie vérifier qu'un prototype respecte
    le cahier des charges ?
  reponse:
    options:
    - id: o1
      texte: Comparer la mesure ou la valeur obtenue lors des essais au niveau attendu du critère.
    - id: o2
      texte: Calculer uniquement le coût financier global de fabrication du prototype.
    - id: o3
      texte: Modifier directement le programme informatique sans réaliser d'expérimentations.
    - id: o4
      texte: Dessiner une maquette visuelle sans procéder à des mesures de performance.
    bonnes:
    - o1
  indices:
    relance: Pense à l'action qui consiste à mettre en regard un résultat expérimental et la valeur fixée dans le document
      de référence.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la validation des performances porte sur les critères techniques et fonctionnels de l''objet,
      pas uniquement sur son coût.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : on ne peut pas valider le respect des exigences sans effectuer des essais pratiques et des
      mesures.'
  - si:
      contient:
      - o4
    relance: 'Erreur de méthode : une simple maquette visuelle ne permet pas d''évaluer le comportement ni de mesurer les
      performances réelles.'
  solution: 'Comparer la mesure ou la valeur obtenue lors des essais au niveau attendu du critère. C''est la définition exacte
    : valider consiste à mesurer la performance réelle du prototype et à vérifier sa conformité par rapport au niveau exigé
    dans le cahier des charges.'
- id: nblm-lors-d-un-essai-si-une-difference-est-co-2
  type: choix
  difficulte: 2
  enonce: Lors d'un essai, si une différence est constatée entre la valeur mesurée sur le prototype et la valeur exigée, comment
    nomme-t-on cette différence ?
  reponse:
    options:
    - id: o1
      texte: L'écart entre mesure et attendu.
    - id: o2
      texte: La marge d'erreur de l'appareil de mesure.
    - id: o3
      texte: Le niveau de tolérance du matériau.
    - id: o4
      texte: Le temps de réponse du capteur.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au terme technique qui qualifie la variation entre le résultat mesuré et l'exigence attendue.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la marge d''erreur mesure la précision de l''instrument, non la différence entre la performance
      réelle de l''objet et l''exigence.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : le niveau de tolérance est une contrainte fixée au préalable, pas le résultat de la soustraction
      entre mesure et exigence.'
  - si:
      contient:
      - o4
    relance: 'Erreur de confusion : le temps de réponse est une caractéristique technique du composant, pas l''écart global
      de performance.'
  solution: L'écart entre mesure et attendu. L'écart désigne la différence observée entre la mesure réelle obtenue lors des
    tests et le niveau attendu défini par le cahier des charges.
- id: nblm-pourquoi-est-il-necessaire-de-retranscri-3
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il nécessaire de retranscrire les résultats des tests dans un tableau des essais du prototype ?
  reponse:
    options:
    - id: o1
      texte: Pour organiser plusieurs mesures faites dans les mêmes conditions, calculer une moyenne et vérifier la répétabilité.
    - id: o2
      texte: Pour remplacer le protocole de test sans avoir besoin d'effectuer de mesures réelles.
    - id: o3
      texte: Pour modifier les conditions expérimentales à chaque ligne du tableau.
    - id: o4
      texte: Pour supprimer les essais sans effectuer de calculs.
    bonnes:
    - o1
  indices:
    relance: Pense à l'utilité de consigner plusieurs essais identiques pour éviter qu'une mesure faussée ne trompe l'analyse.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : le tableau récapitule les données obtenues, il ne remplace pas la description de la procédure
      d''essai.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : modifier les conditions à chaque essai fausse la comparaison et empêche de valider rigoureusement
      une performance.'
  - si:
      contient:
      - o4
    relance: 'Erreur de méthode : conserver les données est indispensable pour analyser le comportement et calculer des valeurs
      moyennes.'
  solution: Pour organiser plusieurs mesures faites dans les mêmes conditions, calculer une moyenne et vérifier la répétabilité.
    Regrouper les essais dans un tableau permet d'éviter de se fier à une mesure isolée, d'identifier les erreurs et de calculer
    une moyenne représentative.
- id: nblm-lors-des-essais-du-robot-suiveur-de-lign-4
  type: choix
  difficulte: 2
  enonce: Lors des essais du robot suiveur de ligne, le cahier des charges exige de parcourir un circuit en moins de 10 secondes.
    Trois essais donnent 9,2 s, 9,6 s et 9,4 s. Que doit-on conclure en comparant la mesure à l'exigence ?
  reponse:
    options:
    - id: o1
      texte: L'exigence est validée car la moyenne (9,4 s) et chaque mesure sont inférieures au maximum de 10 s.
    - id: o2
      texte: L'exigence est refusée car le robot aurait dû mettre exactement 10 secondes.
    - id: o3
      texte: L'exigence n'est pas validée car il faut obligatoirement se baser sur un essai unique.
    - id: o4
      texte: Il faut modifier le robot car les trois temps mesurés ne sont pas strictement identiques.
    bonnes:
    - o1
  indices:
    relance: Calcule la moyenne des temps mesurés lors des essais du robot et compare ce résultat au seuil maximal exigé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : ''moins de 10 s'' fixe une limite maximale ; réaliser un temps inférieur respecte parfaitement
      la contrainte.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : réaliser plusieurs mesures et calculer une moyenne est au contraire la méthode scientifique
      requise.'
  - si:
      contient:
      - o4
    relance: 'Erreur de compréhension : de légères variations entre essais sont normales et justifient l''usage de la moyenne.'
  solution: L'exigence est validée car la moyenne (9,4 s) et chaque mesure sont inférieures au maximum de 10 s. La moyenne
    des essais ((9,2 + 9,6 + 9,4) / 3 = 9,4 s) ainsi que chaque essai individuel sont en dessous du seuil maximal de 10 secondes.
- id: nblm-quel-ensemble-d-informations-doit-obliga-5
  type: choix
  difficulte: 2
  enonce: Quel ensemble d'informations doit obligatoirement figurer dans un protocole de test de performance ?
  reponse:
    options:
    - id: o1
      texte: La grandeur mesurée avec son unité, l'appareil de mesure et les conditions précises de l'essai.
    - id: o2
      texte: Uniquement le schéma fonctionnel de la chaîne d'énergie.
    - id: o3
      texte: Seulement le nom des élèves réalisant l'expérience.
    - id: o4
