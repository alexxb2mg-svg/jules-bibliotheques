format: 2
notion: performance-ost
version: 1
etat: verifiee
declencheurs:
- mesures répétées
- même parcours
- valeur moyenne
- dynamomètre
- multimètre
- conditions identiques
- vitesse maximale
prerequis: []
essentiel: 'Mesurer, c''est associer un nombre à une grandeur physique (longueur, masse, vitesse, autonomie, température...)
  à l''aide d''un instrument de mesure et d''une unité (mètre, kilogramme, kilomètre par heure...), afin de pouvoir comparer
  des objets entre eux. Pour évaluer la performance d''un objet ou système technique (OST), il faut d''abord choisir la ou
  les grandeurs mesurables pertinentes (par exemple la vitesse maximale et l''autonomie pour un vélo électrique), puis définir
  un protocole de mesure : les conditions dans lesquelles la mesure est faite doivent être précisées et répétables, sinon
  la comparaison entre deux objets n''a pas de sens.


  Un protocole de mesure comprend en général : le matériel utilisé (instrument, sa précision), les conditions (température,
  charge, terrain...), la procédure étape par étape, et le nombre de mesures effectuées (répéter une mesure permet de repérer
  une erreur et de calculer une valeur moyenne plus fiable).'
methode:
- Identifier la grandeur à mesurer et choisir une unité adaptée (par exemple des mètres par seconde ou des kilomètres par
  heure pour une vitesse).
- Choisir un instrument de mesure adapté à la précision recherchée (chronomètre, multimètre, dynamomètre...).
- Fixer des conditions identiques pour toutes les mesures comparées (même parcours, même charge, même température) afin que
  la comparaison soit valable.
- Répéter la mesure plusieurs fois et calculer une moyenne pour limiter l'effet des erreurs de mesure.
vocabulaire:
- terme: protocole de mesure
  definition: ensemble des conditions et des étapes précises à suivre pour réaliser une mesure comparable
- terme: grandeur mesurable
  definition: caractéristique physique d'un objet qui peut être quantifiée (vitesse, masse, durée...)
erreurs_frequentes:
- Comparer deux mesures obtenues dans des conditions différentes (parcours, charge...).
- Ne faire qu'une seule mesure alors qu'il faut en répéter plusieurs pour limiter l'erreur.
- Choisir un instrument trop peu précis pour la grandeur étudiée.
- Oublier de préciser l'unité du résultat.
exemple:
  enonce: On veut comparer l'autonomie de deux trottinettes électriques. Proposer un protocole simple.
  solution: Charger complètement les deux batteries. Faire rouler chaque trottinette sur le même parcours plat, à la même
    vitesse, avec un utilisateur de même masse, jusqu'à l'arrêt complet de la batterie. Mesurer la distance parcourue (en
    km) avec le compteur intégré ou un GPS. Répéter le test une seconde fois pour vérifier la cohérence du résultat.
exercices:
- id: vitesse-moyenne-essais
  type: nombre
  difficulte: 1
  enonce: 'Un protocole de mesure de la vitesse maximale d''une voiture téléguidée donne, sur trois essais sur le même parcours
    : 3,2 m/s ; 3,4 m/s ; 3,3 m/s. Quelle est la vitesse moyenne, en m/s ?'
  reponse:
    valeur: 3.3
    forme: libre
  indices:
    relance: Additionne les trois valeurs puis divise le résultat par 3.
    methode: Fais la somme des trois valeurs, puis divise-la par le nombre de mesures effectuées.
    etape: La somme des trois valeurs vaut 9,9. Il reste à diviser par 3.
  pieges:
  - si:
      valeur: 9.9
    relance: 9,9 est la somme des trois mesures, mais il faut encore la diviser par le nombre de mesures pour obtenir la moyenne.
  - si:
      valeur: 3.4
    relance: 3,4 est la mesure la plus élevée, pas la moyenne des trois mesures.
  solution: (3,2 + 3,4 + 3,3) / 3 = 9,9 / 3 = 3,3 m/s.
- id: pourquoi-conditions-identiques
  type: choix
  difficulte: 1
  enonce: Pourquoi faut-il tester deux ventilateurs à la même tension électrique pour comparer leur débit d'air ?
  reponse:
    options:
    - id: a
      texte: Sinon le débit d'air dépendrait aussi de la tension et pas seulement du ventilateur testé
    - id: b
      texte: Parce que la tension électrique n'a aucune influence sur le débit d'air
    - id: c
      texte: Pour que les deux ventilateurs consomment exactement la même quantité d'énergie
    bonnes:
    - a
  indices:
    relance: Pense à ce qui doit rester identique pour que seule la différence entre les deux objets explique la différence
      de résultat.
    methode: Si la tension change, peut-on encore dire que la différence de débit vient seulement du ventilateur ?
    etape: Un protocole de mesure doit fixer toutes les conditions sauf l'objet testé.
  pieges:
  - si:
      contient:
      - b
    relance: Au contraire, la tension électrique influence fortement le débit d'air d'un ventilateur électrique.
  - si:
      contient:
      - c
    relance: 'Ce n''est pas l''objectif recherché : on veut comparer le débit d''air, pas forcer une même consommation d''énergie.'
  solution: 'Si la tension diffère, le débit d''air dépendra aussi de la tension et non plus seulement du ventilateur : la
    comparaison ne serait plus juste. Il faut fixer toutes les conditions sauf l''objet testé.'
- id: etapes-protocole-mesure
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique ces étapes de construction d'un protocole de mesure d'autonomie de trottinette.
  reponse:
    elements:
    - id: grandeur
      texte: Choisir la grandeur à mesurer (l'autonomie, en km)
    - id: instrument
      texte: Choisir l'instrument de mesure (compteur ou GPS)
    - id: conditions
      texte: Fixer des conditions identiques (parcours, charge, vitesse)
    - id: repetition
      texte: Répéter la mesure plusieurs fois et calculer la moyenne
  indices:
    relance: On ne peut pas fixer les conditions avant d'avoir choisi ce que l'on mesure.
    methode: Pense à la logique d'un protocole, du plus général (quoi mesurer) au plus précis (répéter et moyenner).
    etape: La première étape est toujours de définir la grandeur à mesurer.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Peut-on fixer les conditions avant de choisir l'instrument de mesure ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la toute première étape (choisir la grandeur) et la toute dernière (répéter et moyenner).
  solution: Choisir la grandeur à mesurer → choisir l'instrument de mesure → fixer des conditions identiques → répéter la
    mesure et calculer la moyenne.
- id: protocole-comparaison-trottinettes
  type: ouverte
  difficulte: 3
  enonce: On veut comparer la vitesse maximale de deux trottinettes électriques différentes. Propose un protocole de mesure
    complet, en citant l'instrument utilisé et au moins deux conditions à garder identiques.
  criteres:
  - L'élève propose un instrument de mesure adapté (chronomètre, radar, GPS...).
  - L'élève cite au moins deux conditions à fixer identiques (parcours, charge, météo...).
  - L'élève propose de répéter la mesure plusieurs fois pour fiabiliser le résultat.
  indices:
    relance: Quel instrument permettrait de mesurer une vitesse maximale précisément ?
    methode: Pense à ce qui doit rester identique entre les deux trottinettes pour que la comparaison soit juste.
    etape: Commence par « Utiliser un... pour mesurer... », puis liste les conditions à fixer.
  solution: 'Exemple de protocole valable : utiliser un chronomètre ou un GPS pour mesurer la vitesse, sur le même parcours
    plat, avec un utilisateur de même masse et par temps sec pour les deux trottinettes. Répéter la mesure trois fois pour
    chaque trottinette et calculer la vitesse moyenne obtenue, afin de limiter l''effet d''une erreur ponctuelle.'
