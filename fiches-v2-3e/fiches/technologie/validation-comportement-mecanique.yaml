# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: validation-comportement-mecanique
version: 2
etat: verifiee
declencheurs:
- flexion
- torsion
- contrainte maximale
- limite élastique
- flèche mesurée
- essai de flexion
- pièce qui plie sous la charge
- pièce qui se tord
- matériau qui casse ou se déforme
- charges croissantes sur la pièce
prerequis:
- materiaux-et-procedes
- performance-ost
essentiel: 'Une pièce doit résister aux efforts qu''elle subit sans casser ni trop se déformer : c''est sa tenue mécanique.


  Deux modes de sollicitation sont à connaître :

  - la flexion : la pièce se courbe sous une charge (planche d''étagère chargée, plongeoir) ;

  - la torsion : la pièce se tord quand on tourne ses extrémités en sens contraire (tige de tournevis, clé dans une serrure).


  On peut valider la tenue mécanique d''un matériau de deux façons.


  Par simulation. Sur ordinateur, à partir du modèle 3D de la pièce, du matériau choisi et des efforts appliqués, le logiciel
  calcule les déformations et la contrainte maximale dans la pièce. On compare cette contrainte à la limite élastique du matériau
  : au-delà, la déformation devient définitive. Si la contrainte maximale reste inférieure à la limite, avec la marge demandée
  par le cahier des charges, la solution est validée.


  Marge = limite élastique − contrainte maximale.


  Par un protocole de test. On fabrique un prototype, on applique des charges croissantes, on mesure la déformation (par exemple
  la flèche : l''enfoncement au milieu d''une pièce en flexion), on note les résultats dans un tableau et on compare aux exigences
  du cahier des charges. On change une seule chose à la fois entre deux essais.


  La simulation est un modèle : on la confirme par un essai sur un prototype.


  Deux indices sont aussi à connaître. L''indice de réparabilité est une note sur 10 affichée sur certains produits ; elle
  indique si l''objet est facile à réparer (démontage, pièces détachées disponibles, documentation). L''indice énergétique
  renseigne sur la consommation d''énergie de l''objet quand on l''utilise. Ils aident à choisir un objet, mais ne remplacent
  pas un test de résistance.


  Au brevet, on attend : reconnaître flexion et torsion, comparer une contrainte à la limite élastique, calculer une marge,
  proposer un protocole de test.

  '
methode:
- Identifier le mode de sollicitation de la pièce (flexion ou torsion).
- Relever l'exigence du cahier des charges (limite à ne pas dépasser, marge demandée).
- 'Par simulation : lire la contrainte maximale calculée et la comparer à la limite du matériau.'
- 'Par un test : appliquer des charges croissantes, mesurer la déformation à chaque charge, noter les résultats dans un tableau.'
- Conclure en comparant chaque résultat à l'exigence, puis valider ou modifier la solution (matériau, forme, épaisseur).
- Confirmer un résultat de simulation par un essai sur un prototype.
vocabulaire:
- terme: tenue mécanique
  definition: Capacité d'une pièce à résister aux efforts sans casser ni trop se déformer.
- terme: flexion
  definition: Sollicitation où la pièce se courbe sous une charge.
- terme: torsion
  definition: Sollicitation où la pièce se tord autour de son axe.
- terme: simulation
  definition: Calcul sur ordinateur qui prévoit le comportement d'une pièce modélisée.
- terme: contrainte maximale
  definition: Plus grand effort par unité de surface calculé dans la pièce.
- terme: limite élastique
  definition: Contrainte au-delà de laquelle la déformation devient définitive.
- terme: flèche
  definition: Enfoncement au milieu d'une pièce qui subit une flexion.
- terme: indice de réparabilité
  definition: Note sur 10 qui indique si un objet est facile à réparer.
erreurs_frequentes:
- Valider une solution parce que la contrainte est sous la limite, sans vérifier la marge demandée par le cahier des charges.
- Confondre flexion (la pièce se courbe) et torsion (la pièce se tord).
- Faire un seul essai, avec une seule charge, et conclure trop vite.
- Changer plusieurs choses à la fois (matériau et épaisseur) entre deux essais, sans pouvoir dire laquelle a compté.
- Oublier que la simulation reste un modèle, à confirmer par un essai sur un prototype.
exemple:
  enonce: Document fictif. Une simulation donne une contrainte maximale de 22 MPa dans un support en PLA. La limite élastique
    du PLA est de 50 MPa. Le cahier des charges demande une marge d'au moins 10 MPa. Le support est-il validé ?
  solution: 'Marge = 50 − 22 = 28 MPa. 28 MPa est supérieur à 10 MPa : la tenue mécanique du support est validée.'
exercices:
- id: flexion-ou-torsion
  type: association
  difficulte: 1
  enonce: Associe chaque situation au mode de sollicitation principal de la pièce décrite (flexion ou torsion).
  reponse:
    gauche:
    - id: a
      texte: Planche d'étagère chargée en son milieu
    - id: b
      texte: Tige d'un tournevis qui serre une vis
    - id: c
      texte: Plongeoir avec un nageur à son extrémité
    - id: d
      texte: Clé qu'on tourne dans une serrure
    droite:
    - id: x
      texte: Flexion
    - id: y
      texte: Torsion
    paires:
      a: x
      b: y
      c: x
      d: y
  indices:
    relance: Dans chaque situation, la pièce se courbe-t-elle ou se tord-elle ?
    methode: 'Flexion : une charge fait courber la pièce. Torsion : on fait tourner une extrémité par rapport à l''autre.'
    etape: 'La planche d''étagère s''enfonce au milieu sous le poids des livres : elle se courbe. Continue avec les trois
      autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Dans cette situation, fait-on tourner la pièce ou appuie-t-on dessus ?
  - si:
      diagnostic: associations_fausses
    relance: Imagine chaque pièce en train de se déformer. Se courbe-t-elle comme un arc, ou se tord-elle comme un linge qu'on
      essore ?
  solution: 'Étagère : flexion. Tournevis : torsion. Plongeoir : flexion. Clé dans la serrure : torsion.'
- id: marge-pla
  type: nombre
  difficulte: 1
  enonce: 'Document fictif. Résultats de la simulation d''un support de téléphone, pour la même charge : contrainte maximale
    38 MPa quel que soit le matériau. Limites élastiques : PLA 50 MPa, ABS 40 MPa, polypropylène 30 MPa. Calcule la marge
    du PLA, c''est-à-dire la limite élastique moins la contrainte maximale, en MPa.'
  reponse:
    valeur: 12
  indices:
    relance: Quelles sont les deux valeurs à utiliser pour le PLA ?
    methode: Marge = limite élastique du matériau − contrainte maximale calculée par la simulation.
    etape: Pour le PLA, la limite élastique est de 50 MPa et la contrainte maximale de 38 MPa. Fais la soustraction dans cet
      ordre.
  pieges:
  - si:
      valeur: -12
    relance: As-tu soustrait dans le bon ordre ? La marge est la limite moins la contrainte.
  - si:
      valeur: 88
    relance: La marge est un écart entre deux valeurs. Faut-il additionner ou soustraire ?
  - si:
      valeur: 2
    relance: Tu as utilisé la limite de l'ABS. Relis la ligne du PLA.
  solution: Marge du PLA = 50 − 38 = 12 MPa.
- id: materiau-valide
  type: choix
  difficulte: 2
  enonce: 'Document fictif (même simulation). Contrainte maximale 38 MPa pour tous les matériaux. Limites élastiques : PLA
    50 MPa, ABS 40 MPa, polypropylène 30 MPa. Le cahier des charges exige que la contrainte maximale reste inférieure à la
    limite élastique d''au moins 5 MPa. Quel(s) matériau(x) valide(nt) la tenue mécanique ?'
  reponse:
    options:
    - id: a
      texte: PLA
    - id: b
      texte: ABS
    - id: c
      texte: Polypropylène
    bonnes:
    - a
  indices:
    relance: Pour chaque matériau, quel est l'écart entre la limite élastique et la contrainte maximale ?
    methode: Calcule la marge de chaque matériau (limite − contrainte), puis compare-la aux 5 MPa exigés.
    etape: 'Pour l''ABS : 40 − 38 = 2 MPa. Est-ce au moins 5 MPa ? Fais le même calcul pour les deux autres.'
  pieges:
  - si:
      contient:
      - b
    relance: La contrainte de l'ABS est bien sous sa limite, mais la marge est-elle d'au moins 5 MPa ?
  - si:
      contient:
      - c
    relance: Pour le polypropylène, la contrainte maximale est-elle inférieure ou supérieure à sa limite élastique ?
  solution: 'Marges : PLA 50 − 38 = 12 MPa (au moins 5 : validé) ; ABS 40 − 38 = 2 MPa (moins de 5 : refusé) ; polypropylène
    30 − 38 = −8 MPa (la limite est dépassée : refusé). Seul le PLA est validé.'
- id: masse-maximale-etagere
  type: nombre
  difficulte: 2
  enonce: 'Document fictif. Essai de flexion d''une petite étagère imprimée en 3D. Masse posée au milieu et flèche mesurée
    : 0,5 kg donne 1,2 mm ; 1 kg donne 2,4 mm ; 1,5 kg donne 3,6 mm ; 2 kg donne 4,8 mm. Le cahier des charges impose une
    flèche d''au plus 4 mm. Parmi les masses testées, quelle est la plus grande qui respecte le cahier des charges, en kg
    ?'
  reponse:
    valeur: 1.5
  indices:
    relance: Pour chaque masse testée, la flèche mesurée est-elle au plus de 4 mm ?
    methode: Compare chaque flèche du tableau à la limite de 4 mm, puis garde la plus grande masse dont la flèche ne dépasse
      pas cette limite.
    etape: 'Pour 2 kg, la flèche est de 4,8 mm : c''est plus que 4 mm. Regarde la masse testée juste avant.'
  pieges:
  - si:
      valeur: 2
    relance: Pour 2 kg, la flèche mesurée dépasse-t-elle 4 mm ?
  - si:
      valeur: 3.6
    relance: 3,6 est une flèche en mm. La question demande une masse en kg.
  - si:
      valeur: 4
    relance: 4 mm est la limite de flèche. La question demande la masse testée, en kg.
  solution: 'Flèches : 1,2 mm, 2,4 mm et 3,6 mm restent sous 4 mm ; 4,8 mm dépasse. La plus grande masse testée qui respecte
    le cahier des charges est donc 1,5 kg.'
- id: essai-sur-ordinateur
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le calcul fait sur ordinateur, à partir du modèle 3D d'une pièce, pour prévoir sa déformation
    sans avoir à la fabriquer ?
  reponse:
    acceptees:
    - simulation
    - simulation numérique
    - une simulation
    fautes_tolerees: 1
  indices:
    relance: Avant de fabriquer une pièce, comment peut-on tester son comportement « pour de faux » ?
    methode: 'Pense aux deux façons de valider une tenue mécanique : un essai sur un prototype, ou un calcul par un logiciel.'
    etape: Le mot est de la même famille que le verbe « simuler ».
  pieges:
  - si:
      valeur: modélisation
    relance: La modélisation dessine la pièce en 3D. Comment s'appelle le calcul qui prévoit ensuite sa déformation ?
  - si:
      valeur: prototype
    relance: Un prototype est une pièce réellement fabriquée. Ici, on ne fabrique rien.
  solution: 'C''est une simulation : le logiciel calcule la déformation et la contrainte maximale à partir du modèle 3D.'
- id: protocole-essai-flexion
  type: ouverte
  difficulte: 3
  enonce: Tu dois vérifier qu'une tablette en contreplaqué, posée sur deux appuis, supporte 5 kg en son milieu en s'enfonçant
    de moins de 3 mm. Rédige un protocole de test.
  criteres:
  - L'élève décrit le montage (tablette sur deux appuis, charge placée au milieu) et le matériel (masses, règle ou comparateur
    pour mesurer l'enfoncement).
  - L'élève prévoit des charges croissantes jusqu'à 5 kg, avec une mesure de la flèche à chaque charge, notée dans un tableau.
  - L'élève indique le critère de validation (flèche à 5 kg inférieure à 3 mm) et ce qu'on conclut dans chaque cas.
  indices:
    relance: Quelle grandeur vas-tu mesurer, et avec quel instrument ?
    methode: 'Un protocole précise : le montage, le matériel, les étapes de mesure, et comment on conclut.'
    etape: 'Commence par le montage : où poses-tu la tablette, et où places-tu la charge ?'
  solution: 'Montage : la tablette est posée sur deux appuis ; on place les masses au milieu. Matériel : masses de 1 kg, règle
    graduée ou comparateur. Étapes : mesurer la position du milieu sans charge ; ajouter 1 kg, puis 2 kg... jusqu''à 5 kg
    ; à chaque charge, mesurer l''enfoncement (flèche) et le noter dans un tableau. Conclusion : si la flèche à 5 kg est inférieure
    à 3 mm, la tablette est validée ; sinon, on modifie la solution (épaisseur, matériau) et on refait l''essai.'
- id: choisir-le-mode
  type: choix
  difficulte: 1
  enonce: Une tige métallique fixée à un mur porte une lampe à son extrémité. La tige se courbe vers le bas. De quel mode
    de sollicitation s'agit-il ?
  reponse:
    options:
    - id: a
      texte: La flexion
    - id: b
      texte: La torsion
    - id: c
      texte: La simulation
    - id: d
      texte: Le recyclage
    bonnes:
    - a
  indices:
    relance: La tige se courbe ou se tord ?
    methode: 'Flexion : la pièce se courbe sous une charge. Torsion : la pièce se tord autour de son axe.'
    etape: La lampe pousse la tige vers le bas, sans la faire tourner sur elle-même. Quel mot décrit une pièce qui se courbe
      ?
  pieges:
  - si:
      contient:
      - b
    relance: La torsion fait tourner les extrémités en sens contraire. Ici la tige se courbe.
  - si:
      contient:
      - c
    relance: La simulation est une méthode de calcul, pas un mode de sollicitation.
  - si:
      contient:
      - d
    relance: Le recyclage concerne la fin de vie d'un objet, pas ses efforts.
  solution: 'La charge fait courber la tige : c''est de la flexion.'
- id: marge-abs
  type: nombre
  difficulte: 2
  enonce: 'Document fictif. Simulation d''une charnière imprimée : contrainte maximale 31 MPa. Limite élastique de l''ABS
    : 40 MPa. Le cahier des charges demande une marge d''au moins 5 MPa. Quelle est la marge de l''ABS, en MPa ?'
  reponse:
    valeur: 9
    forme: entier
  indices:
    relance: Quelles valeurs faut-il utiliser pour calculer la marge ?
    methode: Marge = limite élastique − contrainte maximale.
    etape: Soustrais la contrainte maximale de la limite élastique de l'ABS, puis compare au minimum demandé.
  pieges:
  - si:
      valeur: -9
    relance: Tu as inversé la soustraction. La marge est la limite moins la contrainte.
  - si:
      valeur: 71
    relance: 'Tu as additionné. Une marge est un écart : quelle opération faut-il ?'
  solution: 'Marge = 40 − 31 = 9 MPa. 9 est supérieur à 5 : l''ABS est validé.'
- id: nblm-comment-appelle-t-on-la-sollicitation-me-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on la sollicitation mécanique qui fait courber une pièce sous l'effet d'une charge ?
  reponse:
    options:
    - id: o1
      texte: La flexion
    - id: o2
      texte: La torsion
    - id: o3
      texte: La compression
    - id: o4
      texte: La traction
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui arrive à une planche d'étagère trop chargée ou à un plongeoir.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la torsion fait tourner la pièce autour de son axe au lieu de la courber.'
  - si:
      contient:
      - o3
    relance: La compression écrase la pièce, mais ne correspond pas au phénomène de courbure.
  - si:
      contient:
      - o4
    relance: La traction étire la pièce le long de son axe au lieu de la courber.
  solution: 'La flexion. C''est la définition exacte : sous une charge, la pièce se courbe (comme une planche d''étagère).'
- id: nblm-lors-d-une-simulation-numerique-de-la-te-2
  type: choix
  difficulte: 2
  enonce: Lors d'une simulation numérique de la tenue mécanique d'une pièce, à quelle valeur du matériau compare-t-on la contrainte
    maximale calculée ?
  reponse:
    options:
    - id: o1
      texte: À la limite élastique du matériau
    - id: o2
      texte: À la masse volumique du matériau
    - id: o3
      texte: À la température de fusion
    - id: o4
      texte: À la conductibilité électrique
    bonnes:
    - o1
  indices:
    relance: Il s'agit du seuil au-delà duquel la déformation subie par le matériau devient définitive.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la masse volumique indique la masse par unité de volume, pas la résistance mécanique aux déformations.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la température de fusion indique le passage à l''état liquide, pas la résistance mécanique sous effort.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la conductibilité électrique mesure le passage du courant, ce qui n''a pas de rapport avec la tenue
      mécanique.'
  solution: 'À la limite élastique du matériau. Exact : si la contrainte dépasse la limite élastique, la déformation de la
    pièce devient permanente.'
- id: nblm-lors-d-un-essai-de-flexion-sur-un-protot-3
  type: choix
  difficulte: 2
  enonce: Lors d'un essai de flexion sur un prototype, quelle déformation mesure-t-on au milieu de la pièce ?
  reponse:
    options:
    - id: o1
      texte: La flèche mesurée
    - id: o2
      texte: L'angle de torsion
    - id: o3
      texte: La masse volumique
    - id: o4
      texte: La température de l'essai
    bonnes:
    - o1
  indices:
    relance: Ce terme désigne l'enfoncement maximal mesuré au centre de la pièce en flexion.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : l''angle de torsion mesure la rotation lors d''un effort de torsion, pas en flexion.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la masse volumique est une propriété constante du matériau et non une déformation.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la température est une condition expérimentale, pas la grandeur mesurant la déformation.'
  solution: 'La flèche mesurée. Exact : la flèche correspond à l''enfoncement mesuré au centre d''une pièce soumise à la flexion.'
- id: nblm-quel-exemple-concret-correspond-a-une-so-4
  type: choix
  difficulte: 2
  enonce: Quel exemple concret correspond à une sollicitation mécanique en torsion ?
  reponse:
    options:
    - id: o1
      texte: Une clé que l'on tourne dans une serrure
    - id: o2
      texte: Une planche d'étagère qui ploie sous des livres
    - id: o3
      texte: Un plongeoir qui s'abaisse sous le poids d'un nageur
    - id: o4
      texte: Un câble tiré fortement à ses deux extrémités
    bonnes:
    - o1
  indices:
    relance: Cherche la situation où l'on fait tourner les extrémités d'une pièce autour de son axe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la planche d''étagère se courbe sous la charge, il s''agit d''une flexion.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le plongeoir se courbe vers le bas, c''est un exemple de flexion.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le câble subit une sollicitation en traction.'
  solution: 'Une clé que l''on tourne dans une serrure. Exact : tourner les extrémités d''une clé ou d''une tige de tournevis
    en sens contraire applique une torsion.'
- id: nblm-une-simulation-indique-une-contrainte-ma-5
  type: choix
  difficulte: 2
  enonce: Une simulation indique une contrainte maximale inférieure à la limite élastique du matériau. Quelle vérification
    manque-t-il avant de valider la solution ?
  reponse:
    options:
    - id: o1
      texte: Vérifier la marge exigée par le cahier des charges
    - id: o2
      texte: Changer immédiatement la forme et le matériau de la pièce
    - id: o3
      texte: Multiplier la charge appliquée par dix
    - id: o4
      texte: Mesurer uniquement la masse de la pièce
    bonnes:
    - o1
  indices:
    relance: Pense aux exigences complémentaires définies dans le cahier des charges.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : changer plusieurs paramètres à la fois empêche de savoir quel paramètre est efficace.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la charge de simulation doit respecter les spécifications réelles du cahier des charges.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la masse ne donne aucune indication sur la réserve de résistance mécanique.'
  solution: 'Vérifier la marge exigée par le cahier des charges. Exact : l''erreur classique est de valider dès que la contrainte
    est sous la limite sans vérifier la marge demandée.'
- id: nblm-quels-sont-les-deux-modes-de-sollicitati-6
  type: choix
  difficulte: 3
  enonce: Quels sont les deux modes de sollicitation des matériaux à connaître au programme de 3e ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La flexion
    - id: o2
      texte: La torsion
    - id: o3
      texte: La dilatation thermique
    - id: o4
      texte: La conductibilité électrique
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux actions mécaniques (l'une courbe la pièce, l'autre la tord).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : la dilatation thermique est un phénomène d''origine thermique et non une sollicitation mécanique.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la conductibilité électrique est une propriété physique, pas un mode de sollicitation mécanique.'
