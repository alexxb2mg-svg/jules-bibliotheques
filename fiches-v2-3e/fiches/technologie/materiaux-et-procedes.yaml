- id: nblm-que-faut-il-analyser-lors-du-choix-d-un-5
  type: choix
  difficulte: 2
  enonce: Que faut-il analyser lors du choix d'un matériau pour respecter les principes du développement durable ?
  reponse:
    options:
    - id: o1
      texte: L'impact environnemental sur l'ensemble du cycle de vie
    - id: o2
      texte: Uniquement la couleur et l'aspect esthétique extérieur
    - id: o3
      texte: Uniquement l'énergie consommée pendant l'utilisation de l'objet
    - id: o4
      texte: Seulement le prix d'achat initial de la matière première
    bonnes:
    - o1
  indices:
    relance: Considère toutes les étapes d'existence d'un objet technique, du début à la fin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Choisir un matériau uniquement sur des critères esthétiques sans vérifier le cahier des charges est une erreur.
  - si:
      contient:
      - o3
    relance: Une erreur fréquente est d'oublier les étapes d'extraction, de fabrication, de transport et de fin de vie.
  - si:
