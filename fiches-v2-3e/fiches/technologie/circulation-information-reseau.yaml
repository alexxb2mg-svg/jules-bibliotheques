# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: circulation-information-reseau
version: 2
etat: verifiee
declencheurs:
- commutateur
- routeur
- paquets de données
- serveur web
- carte réseau
- débit de connexion
- topologie en étoile
- adresse IP fixe
- table de routage
- box internet
prerequis:
- structuration-traitement-donnees
- 4e-chaines-energie-information
essentiel: 'Un réseau local relie des appareils proches : une salle, une maison, un collège. Il comprend :

  - des terminaux (ordinateurs, tablettes, smartphones, objets connectés), chacun avec une carte réseau ;

  - des liaisons filaires (câbles) ou sans fil (Wi-Fi) ;

  - un ou plusieurs commutateurs.

  La façon dont ces éléments sont reliés s''appelle la topologie. Quand tous les appareils sont reliés à un même commutateur,
  c''est une topologie en étoile.


  Le commutateur relie les appareils d''un même réseau local et envoie chaque message au bon appareil. Le routeur relie des
  réseaux différents et choisit le chemin des messages. Une box domestique joue le rôle de routeur entre la maison et Internet.
  Le serveur est un ordinateur qui fournit un service (pages web, fichiers) aux clients qui le demandent.


  Internet est le réseau mondial qui relie des millions de réseaux grâce aux routeurs. Le Web (les pages consultées avec un
  navigateur) n''est qu''un service parmi d''autres qui utilisent Internet (messagerie, jeux en ligne).


  Adresse IP : chaque appareil a une adresse (exemple 192.168.1.12) faite de quatre nombres de 0 à 255. Le début identifie
  le réseau, la fin identifie l''appareil dans ce réseau. Deux appareils d''un même réseau n''ont jamais la même adresse.
  Pour ajouter un objet connecté avec une adresse fixe, on garde la partie réseau et on choisit un numéro libre.


  Circulation d''une information : elle est découpée en paquets. Chaque paquet porte l''adresse IP du destinataire. Chaque
  routeur lit cette adresse et consulte sa table de routage, qui indique vers quel routeur voisin envoyer le paquet. Les paquets
  d''un même fichier peuvent suivre des chemins différents ; le destinataire les rassemble. Un protocole de routage commun
  est nécessaire : il permet aux routeurs de s''échanger des informations sur les chemins et de se comprendre, même s''ils
  viennent de fabricants et de pays différents.


  Le débit est la quantité de données transmise par seconde, en bits par seconde. Durée = taille en bits ÷ débit. 1 octet
  = 8 bits.


  Au brevet : nommer les composants d''un schéma de réseau, choisir une adresse IP valide, suivre le trajet d''un paquet,
  calculer une durée de transfert.

  '
methode:
- Repérer les terminaux, les liaisons, les commutateurs et le routeur sur le schéma du réseau.
- Pour ajouter un appareil avec une adresse IP fixe, garder la partie réseau des autres appareils et choisir un numéro d'appareil
  libre, entre 1 et 254.
- Pour suivre une information, partir de l'émetteur, passer par le réseau local, puis par les routeurs d'Internet, jusqu'au
  serveur ; la réponse fait le chemin inverse.
- 'Pour un calcul de durée : convertir la taille en bits (1 octet = 8 bits), puis diviser par le débit en bits par seconde.'
- 'Pour justifier le routage : dire qu''il existe beaucoup de chemins, que chaque routeur consulte sa table, et qu''un protocole
  commun est nécessaire.'
vocabulaire:
- terme: terminal
  definition: Appareil qui envoie ou reçoit des données (ordinateur, smartphone, objet connecté).
- terme: commutateur
  definition: Boîtier qui relie les appareils d'un même réseau local et transmet chaque message au bon destinataire.
- terme: routeur
  definition: Appareil qui relie des réseaux différents et choisit le chemin des paquets.
- terme: adresse IP
  definition: Numéro qui identifie un appareil sur un réseau, par exemple 192.168.1.12.
- terme: paquet
  definition: Petit morceau d'une information qui circule sur le réseau avec l'adresse de son destinataire.
- terme: débit
  definition: Quantité de données transmise par seconde (en bit/s).
- terme: topologie
  definition: Façon dont les appareils d'un réseau sont reliés entre eux.
- terme: serveur
  definition: Ordinateur qui fournit un service (pages web, fichiers) aux appareils qui le demandent.
- terme: table de routage
  definition: Liste, dans un routeur, qui indique vers où envoyer les paquets selon leur destination.
- terme: protocole de routage
  definition: Règles communes qui permettent aux routeurs de se comprendre et de choisir les chemins.
erreurs_frequentes:
- Confondre routeur (relie des réseaux différents) et commutateur (relie les appareils d'un même réseau local).
- Confondre Internet (le réseau mondial) et le Web (un service qui l'utilise).
- Donner à un nouvel appareil une adresse déjà utilisée, ou d'un autre réseau, ou avec un nombre plus grand que 255.
- Oublier que le débit est en bits par seconde alors que la taille d'un fichier est en octets.
- Croire qu'une information part d'un seul bloc et suit toujours le même chemin.
exemple:
  enonce: Dans une salle, trois ordinateurs ont les adresses 192.168.10.2, 192.168.10.3 et 192.168.10.4. Quelle adresse fixe
    peut-on donner à une imprimante pour l'ajouter à ce réseau ?
  solution: 'Les trois premiers nombres (192.168.10) identifient le réseau : on les garde. Il faut un numéro d''appareil libre
    entre 1 et 254, par exemple 192.168.10.50.'
exercices:
- id: role-des-composants
  type: association
  difficulte: 1
  enonce: Associe chaque élément d'un réseau à son rôle.
  reponse:
    gauche:
    - id: a
      texte: Commutateur
    - id: b
      texte: Routeur
    - id: c
      texte: Serveur
    - id: d
      texte: Carte réseau
    droite:
    - id: w
      texte: Relie les appareils d'un même réseau local et transmet chaque message au bon appareil
    - id: x
      texte: Relie des réseaux différents et choisit le chemin des paquets
    - id: y
      texte: Fournit un service (pages web, fichiers) aux appareils qui le demandent
    - id: z
      texte: Permet à un terminal de se brancher au réseau (par câble ou sans fil)
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Parmi ces éléments, lequel reste à l'intérieur du réseau local, et lequel fait le lien avec l'extérieur ?
    methode: 'Pense à qui fait quoi : un élément est dans chaque terminal, un relie la salle, un relie les réseaux entre eux,
      un fournit des pages ou des fichiers.'
    etape: La carte réseau se trouve dans l'ordinateur lui-même. Cherche la phrase qui parle d'un terminal.
  pieges:
  - si:
      diagnostic: associations_fausses
    relance: Le routeur et le commutateur sont souvent confondus. Lequel travaille entre plusieurs réseaux ?
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la phrase qui parle de « réseaux différents ».
  solution: 'Commutateur : relie les appareils du réseau local. Routeur : relie des réseaux différents et choisit le chemin.
    Serveur : fournit un service. Carte réseau : relie le terminal au réseau.'
- id: adresse-ip-objet-connecte
  type: choix
  difficulte: 2
  enonce: Document fictif. Dans la salle de technologie, les ordinateurs ont les adresses IP 192.168.1.10, 192.168.1.11 et
    192.168.1.12. Les trois premiers nombres identifient le réseau. Quelle adresse IP fixe peux-tu donner à une station météo
    connectée pour qu'elle rejoigne ce réseau local ?
  reponse:
    options:
    - id: a
      texte: 192.168.1.11
    - id: b
      texte: 192.168.1.25
    - id: c
      texte: 192.168.2.25
    - id: d
      texte: 192.168.1.300
    bonnes:
    - b
  indices:
    relance: Quelle partie de l'adresse doit être la même pour tous les appareils de ce réseau ?
    methode: 'Vérifie trois choses : même partie réseau, numéro d''appareil pas déjà pris, chaque nombre entre 0 et 255.'
    etape: La partie réseau est 192.168.1. Élimine d'abord les adresses qui ne commencent pas ainsi.
  pieges:
  - si:
      contient:
      - a
    relance: Cette adresse est-elle libre ? Regarde les adresses des ordinateurs de la salle.
  - si:
      contient:
      - c
    relance: Compare le troisième nombre avec celui des ordinateurs de la salle. Est-ce le même réseau ?
  - si:
      contient:
      - d
    relance: Chaque nombre d'une adresse IP va de 0 à 255. Le dernier nombre respecte-t-il cette règle ?
  solution: '192.168.1.25 : même partie réseau (192.168.1), numéro 25 libre et compris entre 1 et 254. 192.168.1.11 est déjà
    pris, 192.168.2.25 est sur un autre réseau, 300 dépasse 255.'
- id: trajet-demande-page-web
  type: ordre
  difficulte: 2
  enonce: Un élève du collège demande une page web. Remets dans l'ordre le trajet de sa demande.
  reponse:
    elements:
    - id: a
      texte: L'ordinateur découpe la demande en paquets et les envoie par sa carte réseau
    - id: b
      texte: Le commutateur de la salle transmet les paquets vers le routeur du collège
    - id: c
      texte: Le routeur du collège envoie les paquets hors du réseau local, vers Internet
    - id: d
      texte: Les routeurs d'Internet choisissent le chemin de chaque paquet avec leur table de routage
    - id: e
      texte: Le serveur web reçoit les paquets, reconstitue la demande et renvoie la page
  indices:
    relance: Où commence le trajet, et où se termine-t-il ?
    methode: Pars de l'ordinateur de l'élève, sors du réseau local, traverse Internet, et arrive au serveur.
    etape: Le premier élément est ce que fait l'ordinateur lui-même. Quel appareil de la salle reçoit ensuite les paquets
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Le commutateur est-il dans la salle ou sur Internet ?
  solution: Ordinateur (paquets, carte réseau), puis commutateur de la salle, puis routeur du collège, puis routeurs d'Internet,
    puis serveur web qui renvoie la page.
- id: nom-du-morceau
  type: texte_court
  difficulte: 1
  enonce: Pour circuler sur Internet, une information est découpée en petits morceaux qui portent chacun l'adresse du destinataire.
    Comment s'appellent ces morceaux ?
  reponse:
    acceptees:
    - paquets
    - paquet
    - paquets de données
    - paquet de données
    fautes_tolerees: 0
  indices:
    relance: 'Pense au courrier : on envoie des lettres et des... ?'
    methode: Rappelle-toi le vocabulaire du réseau vu en cours (adresse IP, routeur, commutateur...).
    etape: Le mot commence par « pa » et désigne aussi un colis qu'on envoie par la poste.
  pieges:
  - si:
      valeur: octets
    relance: Un octet est une unité de taille (8 bits). Comment s'appelle le morceau d'information qui voyage avec une adresse
      ?
  - si:
      valeur: bits
    relance: Un bit est un 0 ou un 1. Le morceau cherché contient beaucoup de bits et l'adresse du destinataire.
  solution: 'Ce sont des paquets : chacun porte l''adresse IP du destinataire et peut suivre son propre chemin.'
- id: duree-telechargement
  type: nombre
  difficulte: 3
  enonce: 'Document fictif. La connexion du collège a un débit de 25 Mbit/s. On télécharge une vidéo de 50 Mo. Convention
    de cet énoncé : 1 octet = 8 bits et 1 Mo = 1 000 000 octets, 1 Mbit = 1 000 000 bits. Quelle est la durée minimale du
    téléchargement, en secondes ?'
  reponse:
    valeur: 16
  indices:
    relance: Le débit est en bits par seconde. La taille de la vidéo est-elle dans la même unité ?
    methode: Convertis la taille de la vidéo en Mbit, puis divise par le débit.
    etape: 50 Mo = 50 × 8 Mbit = 400 Mbit. Il reste à diviser par le débit.
  pieges:
  - si:
      valeur: 2
    relance: Tu as divisé des Mo par des Mbit/s. Un octet contient combien de bits ?
  - si:
      valeur: 0.5
    relance: Durée = taille ÷ débit. As-tu fait la division dans le bon sens ?
  - si:
      valeur: 400
    relance: 400 est la taille en Mbit. Combien de secondes faut-il à 25 Mbit par seconde ?
  solution: 50 Mo = 50 × 8 = 400 Mbit. Durée = 400 ÷ 25 = 16 s.
- id: pourquoi-routage
  type: ouverte
  difficulte: 3
  enonce: Dans une petite salle, un commutateur suffit pour que les ordinateurs communiquent. Explique pourquoi, sur Internet,
    il faut des routeurs avec des tables de routage et un protocole de routage commun.
  criteres:
  - L'élève dit qu'Internet relie un très grand nombre de réseaux différents, avec beaucoup de chemins possibles.
  - L'élève explique que chaque routeur lit l'adresse IP de destination du paquet et utilise sa table de routage pour choisir
    où l'envoyer.
  - L'élève justifie le protocole commun (tous les routeurs, de fabricants et de pays différents, doivent se comprendre et
    s'adapter si un chemin est coupé).
  indices:
    relance: Combien de réseaux Internet relie-t-il, par rapport à ta salle ?
    methode: Explique ce que fait un routeur quand il reçoit un paquet, puis pourquoi tous les routeurs doivent suivre les
      mêmes règles.
    etape: 'Commence ainsi : « Un paquet porte l''adresse IP de son destinataire. Quand un routeur le reçoit... »'
  solution: 'Internet relie des millions de réseaux : il existe beaucoup de chemins possibles entre deux appareils. Chaque
    paquet porte l''adresse IP du destinataire ; chaque routeur la lit et consulte sa table de routage pour l''envoyer vers
    le routeur suivant le plus adapté. Comme les routeurs appartiennent à des réseaux différents, ils doivent suivre un protocole
    commun pour échanger ces informations et trouver un autre chemin si une liaison est coupée.'
- id: internet-ou-web
  type: choix
  difficulte: 1
  enonce: Parmi ces services, lesquels utilisent Internet ?
  reponse:
    options:
    - id: a
      texte: La messagerie électronique
    - id: b
      texte: Un jeu vidéo en ligne
    - id: c
      texte: Les pages web consultées avec un navigateur
    - id: d
      texte: L'impression d'un document sur l'imprimante de la salle, reliée au même commutateur
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Pour chaque service, le message quitte-t-il le réseau local pour traverser Internet ?
    methode: Le Web n'est qu'un service parmi d'autres. Cherche ceux qui communiquent avec des serveurs éloignés.
    etape: L'imprimante de la salle est reliée au même commutateur que l'ordinateur. Le message quitte-t-il la salle ? Examine
      ensuite les autres services.
  pieges:
  - si:
      contient:
      - d
    relance: 'L''imprimante est dans le même réseau local : le message ne sort pas de la salle et ne traverse pas Internet.'
  - si:
      diagnostic: incomplet
    relance: Il en manque. Reprends les options une par une.
  solution: La messagerie, le jeu en ligne et le Web utilisent Internet. L'imprimante de la salle reste dans le réseau local.
- id: topologie-etoile
  type: texte_court
  difficulte: 2
  enonce: Dans un réseau local, tous les appareils sont reliés par un câble à un même commutateur placé au centre. Quel nom
    donne-t-on à cette topologie ?
  reponse:
    acceptees:
    - étoile
    - en étoile
    - topologie en étoile
    - topologie étoile
    fautes_tolerees: 1
  indices:
    relance: Dessine le commutateur au milieu et les câbles autour de lui. À quoi ressemble ton dessin ?
    methode: La topologie décrit la forme des liaisons. Ici, toutes les liaisons partent du même point central.
    etape: Les rayons d'une roue partent tous du moyeu. Cherche un astre dessiné avec des branches qui rayonnent.
  pieges:
  - si:
      valeur: bus
    relance: Dans un bus, les appareils sont branchés le long d'un même câble. Ici, tous les câbles partent d'un point central.
  - si:
      valeur: anneau
    relance: Dans un anneau, les appareils forment une boucle. Ici, tous les câbles partent d'un point central.
  solution: 'Tous les appareils sont reliés à un point central : c''est une topologie en étoile.'
- id: nblm-quel-equipement-reseau-relie-les-apparei-1
  type: choix
  difficulte: 2
  enonce: Quel équipement réseau relie les appareils d'un même réseau local et transmet chaque message directement au bon
    destinataire ?
  reponse:
    options:
    - id: o1
      texte: Un commutateur
    - id: o2
      texte: Un routeur
    - id: o3
      texte: Un serveur web
    - id: o4
      texte: Une carte réseau
    bonnes:
    - o1
  indices:
    relance: Pense au boîtier du réseau local qui interconnecte les ordinateurs d'une même salle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le routeur sert à relier des réseaux différents entre eux (comme le réseau local et Internet),
      pas uniquement les appareils d''un même réseau local.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : un serveur web fournit des services ou des pages web aux clients, il ne gère pas l''interconnexion
      physique du réseau local.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la carte réseau équipe un terminal individuel pour le connecter au réseau, elle ne relie
      pas plusieurs appareils entre eux.'
  solution: 'Un commutateur. C''est exact : le commutateur (ou switch) relie les équipements d''un même réseau local et redirige
    les messages vers le bon appareil.'
- id: nblm-sur-le-reseau-internet-quel-est-le-role-2
  type: choix
  difficulte: 2
  enonce: Sur le réseau Internet, quel est le rôle principal d'un routeur ?
  reponse:
    options:
    - id: o1
      texte: Relier des réseaux différents et choisir le chemin des paquets de données
    - id: o2
      texte: Numériser les sons et les images en bits
    - id: o3
      texte: Stocker les pages web pour les afficher dans un navigateur
    - id: o4
      texte: Attribuer un nom de famille aux ordinateurs d'une même classe
    bonnes:
    - o1
  indices:
    relance: Sa fonction est liée à l'orientation du trafic entre plusieurs réseaux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la numérisation est réalisée par les capteurs ou l''ordinateur émetteur, pas par le routeur.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : c''est le rôle d''un serveur web de stocker et fournir les pages web.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : le routeur ne donne pas de nom de famille aux ordinateurs ; il oriente les flux de données
      entre réseaux.'
  solution: 'Relier des réseaux différents et choisir le chemin des paquets de données. C''est exact : le routeur analyse
    les adresses IP et utilise ses tables de routage pour diriger les paquets vers d''autres réseaux.'
- id: nblm-comment-une-information-image-fichier-me-3
  type: choix
  difficulte: 2
  enonce: Comment une information (image, fichier, message) circule-t-elle sur le réseau Internet ?
  reponse:
    options:
    - id: o1
      texte: Elle est découpée en paquets de données portant l'adresse IP du destinataire
    - id: o2
      texte: Elle est envoyée en un seul bloc indivisible du serveur à l'ordinateur
    - id: o3
      texte: Elle circule sous forme de signaux mécaniques transmis par des engrenages
    - id: o4
      texte: Elle est conservée uniquement sur la carte réseau sans jamais traverser de câble
    bonnes:
    - o1
  indices:
    relance: Pense à la manière dont un grand document est divisé en plusieurs morceaux pour voyager.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : une information ne voyage pas en un seul bloc sur Internet, elle est découpée pour faciliter
      sa circulation.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : les signaux réseau sont électriques, optiques ou radio, jamais mécaniques.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la carte réseau transmet les données via des liaisons filaires ou sans fil sur le réseau.'
  solution: 'Elle est découpée en paquets de données portant l''adresse IP du destinataire. C''est exact : les données sont
    fragmentées en paquets qui peuvent emprunter différents chemins avant d''être réassemblés.'
- id: nblm-dans-une-architecture-reseau-quelle-est-4
  type: choix
  difficulte: 2
  enonce: Dans une architecture réseau, quelle est la fonction d'un serveur web ?
  reponse:
    options:
    - id: o1
      texte: Fournir des services et des pages web aux ordinateurs clients qui le demandent
    - id: o2
      texte: Mesurer la vitesse de rotation des moteurs du réseau
    - id: o3
      texte: Remplacer les câbles Ethernet par du Wi-Fi
    - id: o4
      texte: Empêcher le découpage des fichiers en paquets de données
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'ordinateur distant qui répond à ton navigateur quand tu tapes une adresse Web.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : un serveur web gère des données informatiques, pas des mécanismes physiques ou des moteurs.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : le serveur web est un ordinateur de service, pas un support de liaison physique ou sans fil.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : le serveur utilise au contraire le protocole réseau standard découpant les données en paquets.'
  solution: 'Fournir des services et des pages web aux ordinateurs clients qui le demandent. C''est exact : le serveur est
    un ordinateur qui héberge et distribue des ressources (sites web, fichiers) aux clients.'
- id: nblm-comment-definit-on-le-debit-de-connexion-5
  type: choix
  difficulte: 2
  enonce: Comment définit-on le débit de connexion d'un réseau informatique ?
  reponse:
    options:
    - id: o1
      texte: C'est la quantité de données transmise par seconde, exprimée en bits par seconde
    - id: o2
      texte: C'est la capacité de stockage maximale du disque dur d'un serveur
    - id: o3
      texte: C'est le nombre total de câbles connectés à un commutateur
    - id: o4
      texte: C'est le temps nécessaire pour fabriquer une carte réseau
    bonnes:
    - o1
  indices:
