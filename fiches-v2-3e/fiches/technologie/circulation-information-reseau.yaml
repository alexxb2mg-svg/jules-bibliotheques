- id: nblm-quels-sont-les-deux-elements-necessaires-6
  type: choix
  difficulte: 3
  enonce: Quels sont les deux éléments nécessaires pour connecter un ordinateur terminal à un réseau local filaire ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Une carte réseau
    - id: o2
      texte: Une liaison filaire (câble réseau)
    - id: o3
      texte: Un moteur pas à pas
    - id: o4
      texte: Un capteur de température
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche le composant dans l'ordinateur et le lien physique vers le boîtier réseau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
