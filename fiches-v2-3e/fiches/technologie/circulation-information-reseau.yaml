      - o3
    relance: 'Erreur fréquente : un moteur est un actionneur de la chaîne d''énergie, il n''intervient pas dans la connexion
      réseau.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : un capteur de température mesure une grandeur physique extérieure, il ne sert pas à établir
      une connexion réseau.'
  solution: 'Une carte réseau ; Une liaison filaire (câble réseau). C''est exact : la carte réseau est le composant interne
