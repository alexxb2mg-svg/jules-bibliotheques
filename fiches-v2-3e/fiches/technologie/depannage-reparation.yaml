# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: depannage-reparation
version: 2
etat: verifiee
declencheurs:
- ne marche plus
- trouver la panne
- réparabilité
- démonter l'appareil
- fiabilité
- sécurité à l'atelier
- protocole de dépannage
- hypothèses de panne
- pièce de rechange imprimée
prerequis:
- 4e-protocole-reparation
- chaine-energie
- chaine-information
essentiel: 'Quand un objet technique ne fonctionne plus correctement, on suit une démarche ordonnée : constater et décrire
  le dysfonctionnement, formuler des hypothèses sur ses causes, tester ces hypothèses une par une (observations, mesures,
  essais), identifier l''élément défectueux, réparer ou remplacer, puis vérifier que l''objet fonctionne à nouveau.


  On teste d''abord les hypothèses les plus simples et les plus probables (alimentation, câble, pile), puis les autres. Chaque
  test permet de garder ou d''écarter une hypothèse. Exemple : une lampe ne s''allume plus. Hypothèses : prise sans courant,
  câble coupé, ampoule grillée, interrupteur cassé. On essaie la lampe sur une autre prise, on change l''ampoule...


  Le dépannage remet l''objet en état de marche rapidement (changer une pile). La réparation remplace ou remet en état un
  élément défectueux, parfois avec une pièce fabriquée.


  La fiabilité est l''aptitude d''un objet à fonctionner sans panne pendant une durée donnée. Exemple : sur 200 objets, 12
  tombent en panne en 2 ans, soit 6 %. La durabilité est sa capacité à durer longtemps, en pouvant être entretenu et réparé.
  L''indice de réparabilité est une note sur 10, affichée en France sur certains appareils, qui indique s''il est facile de
  les réparer (documentation, démontage, disponibilité et prix des pièces). Plus la note est haute, plus l''appareil se répare
  facilement.


  Pour réparer, on peut fabriquer une pièce avec les moyens de production du collège : impression 3D (ajout de matière couche
  par couche), découpe laser (découpe de plaques), centre d''usinage (enlèvement de matière avec un outil).


  Dans l''atelier : on débranche un appareil avant de l''ouvrir, on porte les protections demandées, on ne laisse jamais une
  machine fonctionner sans surveillance et on respecte les consignes de chaque machine.


  Au brevet, on attend que tu saches : proposer des hypothèses, écrire un protocole de test logique, définir fiabilité, durabilité
  et indice de réparabilité, choisir un moyen de fabrication d''une pièce et citer des règles de sécurité.'
methode:
- Décrire précisément le dysfonctionnement (ce qui marche, ce qui ne marche pas, depuis quand).
- Lister les causes possibles (hypothèses), des plus simples aux plus complexes.
- Tester chaque hypothèse, une seule à la fois, et noter le résultat.
- Écarter les hypothèses contredites par les tests, jusqu'à trouver l'élément défectueux.
- Réparer ou remplacer l'élément, en respectant les règles de sécurité.
- Vérifier que l'objet fonctionne de nouveau normalement.
vocabulaire:
- terme: dysfonctionnement
  definition: Fonctionnement anormal d'un objet technique.
- terme: hypothèse
  definition: Cause possible d'une panne, qu'il faut vérifier par un test.
- terme: fiabilité
  definition: Aptitude d'un objet à fonctionner sans panne pendant une durée donnée.
- terme: indice de réparabilité
  definition: Note sur 10 qui indique si un appareil est facile à réparer.
- terme: durabilité
  definition: Capacité d'un objet à durer longtemps, en pouvant être entretenu et réparé.
- terme: protocole de test
  definition: Suite d'essais écrite à l'avance pour vérifier une hypothèse de panne.
- terme: impression 3D
  definition: Moyen de production qui ajoute de la matière couche par couche pour faire une pièce.
- terme: élément défectueux
  definition: Pièce ou composant qui est la cause de la panne.
erreurs_frequentes:
- Démonter ou changer une pièce au hasard, sans avoir formulé ni testé d'hypothèse.
- Tester plusieurs hypothèses en même temps, sans savoir laquelle était la bonne.
- Oublier de vérifier le fonctionnement après la réparation.
- Ouvrir un appareil encore branché sur le secteur.
- Confondre fiabilité (peu de pannes) et réparabilité (facilité à réparer).
exemple:
  enonce: Une télécommande ne fait plus réagir la télévision. Propose trois hypothèses et un test pour la première.
  solution: 'Hypothèses : piles usées, émetteur infrarouge défectueux, bouton abîmé. Premier test (le plus simple) : remplacer
    les piles par des piles neuves et réessayer. Si cela fonctionne, la cause était les piles ; sinon, on passe à l''hypothèse
    suivante.'
exercices:
- id: demarche-depannage
  type: ordre
  difficulte: 1
  enonce: Remets dans l'ordre les étapes de la démarche de dépannage d'un objet technique.
  reponse:
    elements:
    - id: a
      texte: Constater et décrire le dysfonctionnement
    - id: b
      texte: Formuler des hypothèses sur les causes possibles
    - id: c
      texte: Tester les hypothèses une par une, de la plus simple à la plus complexe
    - id: d
      texte: Réparer ou remplacer l'élément défectueux
    - id: e
      texte: Vérifier que l'objet fonctionne de nouveau
  indices:
    relance: Peut-on réparer avant de savoir ce qui est en panne ?
    methode: Une démarche de dépannage va de l'observation vers la réparation, puis se termine par un contrôle.
    etape: Tout commence par l'observation du problème. Que fait-on juste après avoir observé ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Peut-on tester une hypothèse avant de l'avoir formulée ?
  - si:
      diagnostic: ordre_faux
    relance: Place d'abord la première étape (on observe) et la dernière (on contrôle), puis range celles du milieu.
  solution: Constater, formuler des hypothèses, les tester, réparer ou remplacer, puis vérifier le fonctionnement.
- id: hypotheses-ventilateur
  type: choix
  difficulte: 2
  enonce: 'Document fictif. Un ventilateur USB ne tourne plus. Observations : le câble USB fonctionne sur un autre appareil
    ; quand on appuie sur l''interrupteur, le voyant du ventilateur s''allume ; on entend un léger bourdonnement, mais les
    pales restent immobiles. Quelles hypothèses restent probables ?'
  reponse:
    options:
    - id: a
      texte: Le câble USB est défectueux
    - id: b
      texte: Le ventilateur n'est pas alimenté en énergie électrique
    - id: c
      texte: Le moteur est défectueux
    - id: d
      texte: Les pales sont bloquées (poussière, objet coincé)
    bonnes:
    - c
    - d
  indices:
    relance: Quelles hypothèses les observations permettent-elles déjà d'écarter ?
    methode: Pour chaque hypothèse, cherche une observation qui la contredit. S'il n'y en a pas, elle reste probable.
    etape: 'Le câble a été essayé sur un autre appareil et il fonctionne : l''hypothèse sur le câble est écartée. Fais de
      même avec le voyant.'
  pieges:
  - si:
      contient:
      - a
    relance: Le câble a été testé sur un autre appareil. Que montre ce test ?
  - si:
      contient:
      - b
    relance: Le voyant s'allume et on entend un bourdonnement. Le ventilateur reçoit-il de l'énergie ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une hypothèse probable, mais il en reste une autre qu'aucune observation n'écarte.
  solution: 'Le câble fonctionne (a écarté) et le voyant s''allume (b écarté : il y a de l''énergie). Le bourdonnement sans
    rotation fait penser à un moteur défectueux ou à des pales bloquées : c et d restent probables, à tester ensuite.'
- id: note-sur-dix
  type: texte_court
  difficulte: 1
  enonce: En France, certains appareils électriques et électroniques affichent une note sur 10 qui indique s'il est facile
    de les réparer. Comment s'appelle cette note ?
  reponse:
    acceptees:
    - indice de réparabilité
    - indice de reparabilite
    - l'indice de réparabilité
    fautes_tolerees: 1
  indices:
    relance: Quel mot est formé sur le verbe « réparer » pour dire « facile à réparer » ?
    methode: 'La note est un « indice ». Complète : indice de ...'
    etape: Pense à la durabilité, la fiabilité... et au mot de la même famille formé sur « réparer ».
  pieges:
  - si:
      valeur: indice de fiabilité
    relance: La fiabilité parle des pannes. La note demandée parle de la facilité à... ?
  - si:
      valeur: étiquette énergie
    relance: L'étiquette énergie parle de la consommation. La note demandée parle de la facilité à réparer.
  solution: 'C''est l''indice de réparabilité : plus la note est proche de 10, plus l''appareil est facile à réparer.'
- id: taux-de-pannes
  type: nombre
  difficulte: 2
  enonce: Document fictif. Un fabricant a vendu 200 bouilloires. Pendant les 2 ans de garantie, 12 sont tombées en panne.
    Quel pourcentage des bouilloires vendues est tombé en panne ?
  reponse:
    valeur: 6
  indices:
    relance: Quelle fraction des bouilloires est tombée en panne ?
    methode: Pourcentage = nombre de bouilloires en panne ÷ nombre de bouilloires vendues × 100.
    etape: Écris la fraction 12/200, puis multiplie-la par 100.
  pieges:
  - si:
      valeur: 12
    relance: 12 est le nombre de bouilloires en panne, pas un pourcentage. Sur combien de bouilloires ?
  - si:
      valeur: 94
    relance: Ce pourcentage correspond aux bouilloires qui n'ont pas eu de panne. Relis la question.
  - si:
      valeur: 0.06
    relance: As-tu multiplié par 100 pour obtenir un pourcentage ?
  solution: 12 ÷ 200 = 0,06 ; 0,06 × 100 = 6 %.
- id: regles-atelier
  type: choix
  difficulte: 1
  enonce: Lesquelles de ces règles de sécurité faut-il respecter dans l'atelier de fabrication du collège ?
  reponse:
    options:
    - id: a
      texte: Débrancher un appareil du secteur avant de l'ouvrir
    - id: b
      texte: Porter des lunettes de protection quand on perce ou qu'on usine
    - id: c
      texte: Laisser la découpe laser fonctionner seule pendant la récréation
    - id: d
      texte: Ouvrir le capot de la découpe laser pendant la découpe pour mieux voir
    bonnes:
    - a
    - b
  indices:
    relance: Pour chaque règle, qu'est-ce qui pourrait arriver si on ne la respectait pas ?
    methode: Une règle de sécurité protège des chocs électriques, des projections, du feu et des brûlures.
    etape: Une machine qui chauffe ou qui découpe peut provoquer un départ de feu. Doit-elle être surveillée ?
  pieges:
  - si:
      contient:
      - c
    relance: Une découpe laser peut enflammer le matériau. Peut-on la laisser sans surveillance ?
  - si:
      contient:
      - d
    relance: Le capot protège les yeux du faisceau laser. Faut-il l'ouvrir pendant la découpe ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une bonne règle, mais il y en a une autre dans la liste.
  solution: On débranche un appareil avant de l'ouvrir (risque électrique) et on porte des lunettes quand on perce ou usine
    (projections). On ne laisse jamais une découpe laser sans surveillance et on n'ouvre pas son capot pendant la découpe.
- id: nom-capacite-a-durer
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la capacité d'un objet à durer longtemps, en pouvant être entretenu et réparé ?
  reponse:
    acceptees:
    - durabilité
    - la durabilité
    - durabilite
    fautes_tolerees: 1
  indices:
    relance: Ce mot est proche de « durer ». Il s'agit d'une qualité de l'objet, pas d'une note.
    methode: Ne confonds pas avec la fiabilité, qui parle de fonctionner sans panne pendant une durée donnée. Ici il faut
      aussi pouvoir entretenir et réparer.
    etape: Cherche un nom formé sur le verbe durer, qui désigne une qualité de l'objet.
  pieges:
  - si:
      valeur: fiabilité
    relance: La fiabilité concerne l'absence de panne sur une durée donnée. Ici, on parle de durer longtemps grâce à l'entretien
      et à la réparation.
  solution: La durabilité est la capacité à durer longtemps, en pouvant être entretenu et réparé. La fiabilité, elle, est
    l'aptitude à fonctionner sans panne pendant une durée donnée.
- id: protocole-lampe-chevet
  type: ouverte
  difficulte: 3
  enonce: 'Une lampe de chevet branchée sur une prise ne s''allume plus. Rédige un protocole pour trouver l''origine de la
    panne : donne au moins trois hypothèses et, pour chacune, le test qui permet de la vérifier.'
  criteres:
  - L'élève propose au moins trois hypothèses plausibles (prise sans courant, ampoule grillée, câble ou interrupteur défectueux).
  - L'élève associe à chaque hypothèse un test concret, réalisé une hypothèse à la fois, de la plus simple à la plus complexe.
  - L'élève respecte la sécurité (lampe débranchée avant tout démontage) et prévoit de vérifier le fonctionnement après la
    réparation.
  indices:
    relance: Qu'est-ce qui doit fonctionner pour que la lampe s'allume ?
    methode: Suis le chemin de l'énergie, de la prise jusqu'à l'ampoule, et imagine une panne possible à chaque étape.
    etape: 'Première hypothèse, la plus simple : la prise ne fournit pas de courant. Test : brancher un autre appareil sur
      cette prise.'
  solution: 'Hypothèse 1 : la prise ne fournit pas de courant ; test : y brancher un autre appareil qui marche. Hypothèse
    2 : l''ampoule est grillée ; test : lampe débranchée, mettre une ampoule neuve. Hypothèse 3 : l''interrupteur ou le câble
    est défectueux ; test : lampe débranchée, observer le câble, puis contrôler la continuité avec un multimètre. On teste
    dans cet ordre, une hypothèse à la fois, puis on vérifie que la lampe s''allume après réparation.'
- id: nblm-un-appareil-technique-ne-marche-plus-que-1
  type: choix
  difficulte: 2
  enonce: Un appareil technique ne marche plus. Quelle est la première étape à réaliser dans la démarche de dépannage ?
  reponse:
    options:
    - id: o1
      texte: Constater et décrire précisément le dysfonctionnement.
    - id: o2
      texte: Démonter immédiatement toutes les pièces de l'appareil.
    - id: o3
      texte: Acheter tout de suite une pièce de rechange neuve.
    - id: o4
      texte: Changer le programme du microcontrôleur.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qu'il faut observer et décrire avant de toucher aux outils.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : démonter au hasard sans observation préalable risque d''abîmer l''objet.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur classique : on ne peut pas remplacer une pièce sans savoir laquelle est défectueuse.'
  - si:
      contient:
      - o4
    relance: Modifier la programmation sans diagnostic préalable ne résout pas une panne matérielle.
  solution: Constater et décrire précisément le dysfonctionnement. C'est la première étape indispensable pour analyser le
    problème avant toute intervention.
- id: nblm-avant-de-demonter-un-appareil-electrique-2
  type: choix
  difficulte: 2
  enonce: Avant de démonter un appareil électrique dans l'atelier pour trouver la panne, quelle règle de sécurité essentielle
    doit-on appliquer ?
  reponse:
    options:
    - id: o1
      texte: Débrancher l'appareil de la source d'alimentation électrique.
    - id: o2
      texte: Nettoyer l'extérieur du boîtier avec de l'eau.
    - id: o3
      texte: Porter uniquement un tablier en tissu.
    - id: o4
      texte: Laisser les machines de l'atelier fonctionner sans surveillance.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au danger principal lié au courant électrique avant toute ouverture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Utiliser de l'eau ne protège pas des risques électriques et peut au contraire être dangereux.
  - si:
      contient:
      - o3
    relance: Un tablier ne protège pas contre les risques d'électrocution d'un appareil branché.
  - si:
      contient:
      - o4
    relance: Une machine ne doit jamais tourner sans surveillance et l'appareil doit impérativement être hors tension.
  solution: Débrancher l'appareil de la source d'alimentation électrique. Cette action élimine tout risque d'électrocution
    lors de l'ouverture du boîtier.
- id: nblm-quelle-est-la-definition-exacte-de-la-fi-3
  type: choix
  difficulte: 2
  enonce: Quelle est la définition exacte de la fiabilité d'un objet technique ?
  reponse:
    options:
    - id: o1
      texte: Son aptitude à fonctionner sans panne pendant une durée donnée.
    - id: o2
      texte: La facilité avec laquelle on peut démonter et réparer l'appareil.
    - id: o3
      texte: La capacité d'un matériau à se courber sous une charge sans rompre.
    - id: o4
      texte: La quantité totale d'énergie consommée par l'appareil durant un cycle.
    bonnes:
    - o1
  indices:
    relance: Attention à ne pas confondre l'absence de pannes et la facilité de réparation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Ceci correspond à la réparabilité ou à l'indice de réparabilité, et non à la fiabilité.
  - si:
      contient:
      - o3
    relance: Ceci concerne la tenue mécanique en flexion d'une structure.
  - si:
      contient:
      - o4
    relance: Ceci correspond à la consommation énergétique exprimée en Wh ou kWh.
  solution: 'Son aptitude à fonctionner sans panne pendant une durée donnée. C''est la définition conforme du cours : la fiabilité
    mesure la capacité à éviter les pannes en service.'
- id: nblm-que-represente-l-indice-de-reparabilite-4
  type: choix
  difficulte: 2
  enonce: Que représente l'indice de réparabilité affiché sur certains appareils ?
  reponse:
    options:
    - id: o1
      texte: Une note sur 10 indiquant s'il est facile de réparer l'appareil.
    - id: o2
      texte: La durée de vie exacte garantie sans aucune panne.
    - id: o3
      texte: La vitesse maximale de fonctionnement du système.
    - id: o4
      texte: La consommation d'électricité mesurée sur l'étiquette énergie.
    bonnes:
    - o1
  indices:
    relance: Pense à la note attribuée en France sur 10 pour évaluer la disponibilité des pièces et le démontage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'indice ne garantit pas une durée sans panne mais note la facilité de réparation.
  - si:
      contient:
      - o3
    relance: La vitesse est un critère de performance, non de réparabilité.
  - si:
      contient:
      - o4
    relance: La consommation énergétique figure sur l'étiquette énergie allant de A à G.
  solution: Une note sur 10 indiquant s'il est facile de réparer l'appareil. L'indice de réparabilité évalue sur 10 la documentation,
    le démontage et la disponibilité des pièces.
- id: nblm-lorsque-l-on-cherche-a-trouver-la-panne-5
  type: choix
  difficulte: 2
  enonce: Lorsque l'on cherche à trouver la panne, comment convient-il de tester les différentes hypothèses ?
  reponse:
    options:
    - id: o1
      texte: On les teste une par une, des plus simples aux plus complexes.
    - id: o2
      texte: On modifie plusieurs composants en même temps.
    - id: o3
      texte: On commence directement par l'hypothèse la plus difficile à vérifier.
    - id: o4
      texte: On remplace toutes les pièces sans effectuer le moindre test.
    bonnes:
    - o1
  indices:
    relance: 'Pense à la démarche méthodique : isoler un seul paramètre à la fois.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Si on change plusieurs choses à la fois, on ne sait pas quelle action a réellement résolu la panne.
  - si:
      contient:
      - o3
    relance: Il faut au contraire tester d'abord les causes simples (alimentation, câble, pile) avant d'engager de gros travaux.
  - si:
      contient:
      - o4
    relance: Remplacer des pièces sans tester au préalable est inefficace et coûteux.
  solution: On les teste une par une, des plus simples aux plus complexes. Tester une seule hypothèse à la fois permet de
    savoir exactement quel test valide ou écarte la cause.
- id: nblm-quelles-sont-les-deux-regles-de-securite-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX règles de sécurité à respecter obligatoirement lors des travaux de réparation à l'atelier
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Débrancher l'appareil du secteur avant de l'ouvrir.
    - id: o2
      texte: Porter les équipements de protection individuelle (EPI) requis.
    - id: o3
      texte: Laisser tourner une machine sans aucune surveillance.
    - id: o4
      texte: Toucher des circuits électroniques sous tension avec les mains mouillées.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie la consigne liée à l'alimentation électrique et celle liée aux équipements de protection corporelle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Les machines de l'atelier doivent toujours rester sous surveillance directe pendant leur fonctionnement.
  - si:
      contient:
      - o4
    relance: C'est une imprudence grave qui augmente fortement le risque d'électrocution.
  solution: Débrancher l'appareil du secteur avant de l'ouvrir ; Porter les équipements de protection individuelle (EPI) requis.
    Mettre l'appareil hors tension protège l'élève contre tout risque d'électrocution.
- id: nblm-comment-appelle-t-on-le-fonctionnement-a-7
  type: texte_court
