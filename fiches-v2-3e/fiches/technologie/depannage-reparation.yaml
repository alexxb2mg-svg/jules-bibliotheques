format: 2
notion: depannage-reparation
version: 1
etat: verifiee
declencheurs:
- lampe ne s'allume plus
- ventilateur en panne
- hypothèse de panne
- câble débranché
- symptôme observé
- SAV
prerequis: []
essentiel: 'Dépanner un objet technique consiste à identifier la cause d''un dysfonctionnement (panne) puis à la corriger.
  La démarche de diagnostic suit en général plusieurs étapes : constater le symptôme (ce qui ne fonctionne pas), formuler
  des hypothèses sur la cause possible, tester chaque hypothèse en commençant par la plus simple ou la plus probable, puis
  confirmer la cause avant de réparer.


  La réparation peut nécessiter une pièce détachée (une pièce de remplacement identique ou compatible). L''indice de réparabilité,
  obligatoire en France depuis 2021 pour certains produits, aide à savoir si un objet est facile à réparer (accès aux pièces,
  disponibilité, documentation technique).


  Réparer plutôt que jeter s''inscrit dans une démarche de développement durable : cela allonge la durée de vie d''un objet,
  limite les déchets et la consommation de nouvelles matières premières.'
methode:
- Décrire précisément le symptôme observé (l'objet ne s'allume pas, fait un bruit anormal, etc.).
- Formuler une ou plusieurs hypothèses de cause possible, de la plus simple (pile déchargée, câble débranché) à la plus complexe.
- Tester chaque hypothèse dans l'ordre, en commençant par la plus simple à vérifier.
- Une fois la cause confirmée, choisir la solution de réparation (remplacement d'une pièce, nettoyage, resserrage) et vérifier
  que l'objet fonctionne de nouveau.
vocabulaire:
- terme: diagnostic
  definition: démarche qui consiste à identifier la cause d'une panne avant de la réparer
- terme: pièce détachée
  definition: pièce de remplacement destinée à réparer un objet
erreurs_frequentes:
- Remplacer une pièce au hasard sans avoir confirmé le diagnostic.
- Négliger les causes les plus simples (câble débranché, pile déchargée) avant de chercher des causes complexes.
- Démonter un objet sans avoir identifié comment le remonter correctement.
exemple:
  enonce: Une lampe de bureau ne s'allume plus. Proposer une démarche de diagnostic, de l'hypothèse la plus simple à la plus
    complexe.
  solution: 1) Vérifier que la lampe est bien branchée et que la prise fonctionne (tester avec un autre appareil). 2) Vérifier
    l'ampoule (la remplacer par une ampoule que l'on sait fonctionnelle). 3) Vérifier l'interrupteur (défectueux ?). 4) Si
    rien ne fonctionne, suspecter un défaut du câble ou du culot, qui nécessite une réparation plus poussée.
exercices:
- id: hypotheses-ventilateur-panne
  type: texte_court
  difficulte: 1
  enonce: Un ventilateur électrique ne tourne plus. Citer une hypothèse simple à vérifier avant de le démonter, liée à son
    alimentation électrique.
  reponse:
    acceptees:
    - la prise ou le branchement électrique
    - vérifier que la prise fonctionne
    - la prise électrique
    fautes_tolerees: 2
  indices:
    relance: Pense à ce qui fournit l'énergie électrique à l'appareil, avant même de regarder son mécanisme interne.
    methode: La cause la plus simple à vérifier en premier concerne toujours l'alimentation en énergie.
    etape: Teste la prise avec un autre appareil pour savoir si le courant électrique arrive bien.
  pieges:
  - si:
      valeur: le moteur est cassé
    relance: C'est une hypothèse plus complexe, qui nécessite de démonter l'appareil ; il faut d'abord vérifier les causes
      les plus simples et accessibles.
  solution: Vérifier que la prise électrique fonctionne, en testant avec un autre appareil branché sur la même prise.
- id: etapes-demarche-diagnostic
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes d'une démarche de diagnostic d'une panne.
  reponse:
    elements:
    - id: symptome
      texte: Constater le symptôme
    - id: hypotheses
      texte: Formuler des hypothèses de cause
    - id: tester
      texte: Tester chaque hypothèse, de la plus simple à la plus complexe
    - id: reparer
      texte: Confirmer la cause puis réparer
  indices:
    relance: On ne peut pas formuler d'hypothèse avant d'avoir observé précisément ce qui ne fonctionne pas.
    methode: La réparation n'intervient qu'après avoir confirmé la cause réelle de la panne, jamais avant.
    etape: La toute première étape consiste toujours à observer ce qui ne fonctionne pas dans l'objet.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Faut-il formuler une hypothèse avant ou après avoir observé le symptôme
      ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la toute première étape (observer) et la toute dernière (réparer après confirmation).
  solution: Constater le symptôme → formuler des hypothèses → tester chaque hypothèse (de la plus simple à la plus complexe)
    → confirmer la cause puis réparer.
- id: reparer-ou-jeter
  type: choix
  difficulte: 2
  enonce: Pourquoi réparer un objet plutôt que le jeter s'inscrit-il dans une démarche de développement durable ?
  reponse:
    options:
    - id: a
      texte: Cela allonge la durée de vie de l'objet et limite les déchets et la consommation de nouvelles matières premières
    - id: b
      texte: Cela rend l'objet plus esthétique qu'un objet neuf
    - id: c
      texte: Cela permet toujours d'obtenir un objet moins cher qu'un objet neuf
    bonnes:
    - a
  indices:
    relance: Pense aux trois piliers du développement durable, en particulier au pilier environnemental.
    methode: Réparer évite de fabriquer un nouvel objet, ce qui économise des matières premières et de l'énergie.
    etape: Compare la quantité de déchets et de nouvelles ressources utilisées entre réparer et jeter puis racheter.
  pieges:
  - si:
      contient:
      - b
    relance: L'esthétique n'est pas l'argument principal du développement durable, qui porte surtout sur les ressources et
      les déchets.
  - si:
      contient:
      - c
    relance: Le coût dépend du prix de la réparation et n'est pas toujours inférieur à celui d'un objet neuf, ce n'est pas
      l'argument principal ici.
  solution: 'Réparer allonge la durée de vie de l''objet : cela limite les déchets produits et réduit la consommation de nouvelles
    matières premières et d''énergie nécessaires à la fabrication d''un objet neuf.'
