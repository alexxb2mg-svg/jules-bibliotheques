# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: programmation-ost
version: 2
etat: verifiee
declencheurs:
- robot suiveur de ligne
- piloter les moteurs du robot
- écrire des commentaires dans le code
- le robot ne réagit pas comme prévu
- téléverser dans la carte du robot
- sous-programme avec paramètre
- commenter le programme
- tester sur l'objet réel
prerequis:
- programmation-nouvelle-fonctionnalite
- chaine-information
essentiel: 'Programmer un objet technique réel (robot, barrière, serre), c''est passer d''un algorithme à un programme qui
  commande de vrais capteurs et actionneurs, puis le mettre au point.


  Traduire : chaque étape de l''algorithme devient un ou plusieurs blocs (ou lignes de code), dans le même ordre.

  Modifier : pour répondre à un nouveau besoin, on change l''algorithme d''abord (une condition, un paramètre, une nouvelle
  action), puis le programme.


  Un programme bien structuré est plus facile à lire et à corriger :

  - il est organisé : réglages de départ, puis partie qui se répète ;

  - il est modulaire : les actions utilisées plusieurs fois sont rangées dans des sous-programmes (ou fonctions) qui portent
  un nom clair, par exemple avancer(vitesse) ou tourner_gauche(vitesse). On les écrit une fois et on les appelle autant de
  fois que nécessaire ; la valeur entre parenthèses est un paramètre ;

  - il est commenté : de courtes phrases expliquent le rôle de chaque partie ; la carte ne les exécute pas.


  Exemple : un robot suiveur de ligne a deux capteurs. Si le capteur gauche voit la ligne, il tourne à gauche. Si le capteur
  droit la voit, il tourne à droite. Sinon, il avance. Chaque action est un sous-programme : le programme principal reste
  court et lisible.


  L''interaction humain-machine passe par des boutons, un écran, un buzzer : le programme réagit aux actions de l''utilisateur.
  Exemple : un bouton augmente la vitesse, un autre la diminue.


  Mise au point : on téléverse le programme dans la carte, on teste sur l''objet réel, on compare au comportement attendu,
  on corrige, puis on teste de nouveau. Quand l''objet ne réagit pas comme prévu, on cherche la cause : mauvais branchement,
  mauvais seuil, condition inversée. On corrige une seule chose à la fois.


  Au brevet, on attend que tu saches : modifier un algorithme pour un nouveau besoin, le traduire en programme, expliquer
  l''intérêt des sous-programmes et des commentaires, et décrire la mise au point d''un système réel.'
methode:
- Écrire ou relire l'algorithme en français avant de toucher au programme.
- Repérer les actions répétées et les ranger dans des sous-programmes bien nommés, avec un paramètre si une valeur change
  (la vitesse par exemple).
- Traduire l'algorithme en blocs ou en code, en ajoutant un commentaire pour chaque partie.
- Téléverser, tester sur l'objet réel, et noter tout écart entre ce qui se passe et ce qui est attendu.
- Chercher la cause de l'écart en simulant le programme pas à pas, corriger une seule chose à la fois, puis retester.
vocabulaire:
- terme: sous-programme (fonction)
  definition: Suite d'instructions qui porte un nom et que l'on peut appeler plusieurs fois dans le programme.
- terme: paramètre
  definition: Valeur donnée au sous-programme au moment de l'appel, par exemple la vitesse dans avancer(60).
- terme: commentaire
  definition: Phrase d'explication écrite dans le programme, ignorée par la carte.
- terme: mise au point
  definition: Suite de tests et de corrections jusqu'à ce que l'objet réel fonctionne comme prévu.
- terme: modularité
  definition: Organisation d'un programme en sous-programmes qui ont chacun un rôle précis.
- terme: appel
  definition: Instruction qui exécute un sous-programme, avec sa valeur de paramètre.
- terme: téléverser
  definition: Envoyer le programme de l'ordinateur vers la carte de l'objet.
- terme: actionneur
  definition: 'Composant qui agit sur l''extérieur : moteur, lampe, buzzer.'
erreurs_frequentes:
- Inverser gauche et droite, ou inverser une condition, sans le voir parce qu'on n'a pas testé tous les cas.
- Recopier plusieurs fois les mêmes blocs au lieu de créer un sous-programme, puis n'en corriger qu'une copie.
- 'Corriger plusieurs choses à la fois : on ne sait plus laquelle a réglé (ou causé) le problème.'
- Oublier une limite (vitesse au-dessus de 100 %, valeur négative) quand l'utilisateur appuie plusieurs fois sur un bouton.
- Faire une boucle infinie sans « attendre », qui rend l'objet difficile à observer et à régler.
exemple:
  enonce: Le robot doit maintenant s'arrêter si l'on appuie sur le bouton B. Que faut-il modifier ?
  solution: 'Dans l''algorithme, on ajoute l''événement « quand le bouton B est appuyé : arrêter le robot ». Dans le programme,
    on appelle le sous-programme arreter() déjà écrit, avec un commentaire « arrêt d''urgence ». Puis on téléverse et on teste
    : appui sur B pendant que le robot roule, le robot doit s''arrêter.'
exercices:
- id: moteurs-et-mouvement
  type: association
  difficulte: 1
  enonce: Un robot a deux roues motrices, commandées par moteur_gauche(v) et moteur_droit(v), où v est la vitesse en %. Associe
    chaque couple d'instructions au mouvement obtenu.
  reponse:
    gauche:
    - id: a
      texte: moteur_gauche(60) et moteur_droit(60)
    - id: b
      texte: moteur_gauche(0) et moteur_droit(60)
    - id: c
      texte: moteur_gauche(60) et moteur_droit(0)
    - id: d
      texte: moteur_gauche(0) et moteur_droit(0)
    droite:
    - id: w
      texte: le robot avance tout droit
    - id: x
      texte: le robot tourne vers la gauche
    - id: y
      texte: le robot tourne vers la droite
    - id: z
      texte: le robot s'arrête
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Si une seule roue tourne, de quel côté le robot pivote-t-il ?
    methode: Imagine le robot vu de dessus. La roue qui tourne pousse son côté vers l'avant ; le robot pivote autour de la
      roue arrêtée.
    etape: Quand les deux roues tournent à la même vitesse, le robot va tout droit. Examine ensuite les cas où une seule roue
      tourne.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule paire est fausse. Vérifie les deux cas où une seule roue tourne.
  - si:
      diagnostic: associations_fausses
    relance: Si la roue droite avance et la gauche reste immobile, le côté droit du robot passe devant. Vers où le robot tourne-t-il
      alors ?
  solution: 'a-w (deux roues à la même vitesse : tout droit), b-x (seule la roue droite tourne : le robot pivote vers la gauche),
    c-y (seule la roue gauche tourne : il pivote vers la droite), d-z (aucune roue ne tourne : arrêt).'
- id: nom-sous-programme
  type: texte_court
  difficulte: 1
  enonce: Dans le programme du robot, les instructions « moteur_gauche(v) et moteur_droit(v) » sont regroupées sous le nom
    avancer(v), écrit une seule fois et utilisé à plusieurs endroits. Comment appelle-t-on une telle partie de programme nommée
    ?
  reponse:
    acceptees:
    - sous-programme
    - un sous-programme
    - sous programme
    - fonction
    - une fonction
    - procédure
    fautes_tolerees: 1
  indices:
    relance: Cette partie porte un nom et on peut la lancer plusieurs fois. Quel mot désigne ce genre de morceau réutilisable
      ?
    methode: Pense à la modularité d'un programme. On découpe un gros programme en petits morceaux nommés, chacun avec un
      rôle précis.
    etape: En Python, on crée un tel morceau avec le mot def, par exemple def avancer(v). En blocs, on utilise « créer un
      bloc ».
  pieges:
  - si:
      valeur: variable
    relance: Une variable contient une valeur. Ici, le nom avancer désigne-t-il une valeur, ou une suite d'instructions ?
  - si:
      valeur: boucle
    relance: Une boucle répète des instructions à la suite. Ici, on regroupe des instructions sous un nom pour les réutiliser.
      Comment s'appelle ce regroupement ?
  solution: 'C''est un sous-programme (on dit aussi une fonction) : il porte un nom, avancer, et on l''appelle chaque fois
    qu''on en a besoin, avec un paramètre v.'
- id: vitesse-par-boutons
  type: nombre
  difficulte: 2
  enonce: "L'utilisateur règle la vitesse du robot avec deux boutons :\n  Au démarrage : vitesse ← 70\n  Quand le bouton A\
    \ est appuyé :\n    vitesse ← vitesse + 10\n    Si vitesse > 100 alors vitesse ← 100\n    afficher vitesse\n  Quand le\
    \ bouton B est appuyé :\n    vitesse ← vitesse − 10\n    Si vitesse < 0 alors vitesse ← 0\n    afficher vitesse\nJuste\
    \ après le démarrage, l'utilisateur appuie dans cet ordre sur : A, A, A, A, puis B. Quelle valeur est affichée après le\
    \ dernier appui ?\n"
  reponse:
    valeur: 90
    forme: entier
  indices:
    relance: Que vaut vitesse après chaque appui, et que fait la ligne « Si vitesse > 100 » ?
    methode: Fais un tableau avec une ligne par appui. Pour chaque appui, calcule la nouvelle valeur, puis applique la limite
      si elle est dépassée.
    etape: 'Premier appui sur A : 70 + 10 = 80, pas de limite dépassée, l''écran affiche 80. Continue avec les trois autres
      appuis sur A.'
  pieges:
  - si:
      valeur: 100
    relance: As-tu appliqué la limite ? Au quatrième appui sur A, la vitesse dépasse 100 ; que fait alors le programme avant
      l'appui sur B ?
  - si:
      valeur: 110
    relance: As-tu tenu compte du dernier appui, sur le bouton B ? Et de la limite à 100 ?
  - si:
      diagnostic: valeur_fausse
    relance: Reprends ton tableau appui par appui, sans oublier la limite après chaque calcul.
  solution: 'A : 80. A : 90. A : 100. A : 110, qui dépasse 100, donc vitesse ← 100. B : 100 − 10 = 90. L''écran affiche 90.'
- id: cycle-mise-au-point
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes pour réaliser et mettre au point le programme du robot suiveur de ligne.
  reponse:
    elements:
    - id: a
      texte: Écrire l'algorithme en français
    - id: b
      texte: Traduire l'algorithme en programme (blocs ou texte), avec des commentaires
    - id: c
      texte: Téléverser le programme dans la carte du robot
    - id: d
      texte: Tester le robot sur la piste
    - id: e
      texte: Comparer le comportement observé au comportement attendu
    - id: f
      texte: Corriger le programme, puis tester de nouveau
  indices:
    relance: Par quoi faut-il commencer, avant même de toucher à l'ordinateur ?
    methode: On va de l'idée (en français) au programme, puis de la carte au robot réel, et on termine par les corrections.
    etape: On commence par écrire l'algorithme en français, puis on le traduit. Que faut-il faire pour que la carte du robot
      reçoive ce programme ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Peut-on tester le robot avant que la carte ait reçu le programme ?
  - si:
      diagnostic: ordre_faux
    relance: Pars de l'idée écrite en français et termine par la correction. Place les autres étapes entre les deux.
  solution: 'a, b, c, d, e, f : algorithme, traduction commentée, téléversement, test sur la piste, comparaison avec l''attendu,
    correction et nouveau test.'
- id: robot-sort-de-la-ligne
  type: choix
  difficulte: 2
  enonce: "La ligne noire passe entre deux capteurs, g (gauche) et d (droit). Un capteur vaut 1 quand il voit la ligne noire,\
    \ 0 sinon.\n  Répéter indéfiniment :\n    g ← capteur de ligne gauche\n    d ← capteur de ligne droit\n    Si g = 0 ET\
    \ d = 0 alors avancer(60)\n    Sinon si g = 1 ET d = 0 alors tourner_droite(60)\n    Sinon si g = 0 ET d = 1 alors tourner_gauche(60)\n\
    \    Sinon arreter()\nAu test, le robot quitte la ligne dans chaque virage. Quelle est l'erreur ?\n"
  reponse:
    options:
    - id: a
      texte: Les actions des deux cas où un seul capteur voit la ligne sont inversées.
    - id: b
      texte: Il faut remplacer ET par OU dans la première condition.
    - id: c
      texte: Il faut lire les deux capteurs une seule fois, avant « Répéter indéfiniment ».
    - id: d
      texte: Il faut appeler arreter() quand aucun capteur ne voit la ligne.
    bonnes:
    - a
  indices:
    relance: Si le robot dérive vers la droite, lequel des deux capteurs arrive le premier sur la ligne noire ?
    methode: Simule un virage. Dessine le robot qui dérive d'un côté, trouve le capteur qui passe sur la ligne, puis lis l'action
      que le programme commande.
    etape: 'Le robot dérive vers la droite : la ligne passe sous le capteur gauche, donc g = 1 et d = 0. Pour revenir sur
      la ligne, de quel côté doit-il tourner ?'
  pieges:
  - si:
      contient:
      - b
    relance: Avec OU, le robot avancerait tout droit dès qu'un seul capteur est sur le blanc. Est-ce le comportement voulu
      dans un virage ?
  - si:
      contient:
      - c
    relance: Si les capteurs ne sont lus qu'une fois, le robot peut-il encore suivre les virages de la ligne ?
  - si:
      contient:
      - d
    relance: Quand aucun capteur ne voit la ligne, où est la ligne noire par rapport au robot ? Faut-il vraiment s'arrêter
      ?
  solution: 'Réponse a. Quand g = 1, la ligne est passée à gauche du robot : il doit tourner à gauche pour la retrouver. Le
    programme commande l''inverse. Il faut échanger tourner_droite(60) et tourner_gauche(60) dans ces deux lignes, puis retester.'
- id: appel-avec-parametre
  type: nombre
  difficulte: 2
  enonce: 'Le sous-programme avancer(v) fait tourner les deux moteurs du robot à la vitesse v (en %). Voici le programme principal
    :


    vitesse ← 30

    avancer(vitesse)

    vitesse ← vitesse + 20

    avancer(vitesse)


    Quelle valeur est envoyée à avancer lors du deuxième appel ?'
  reponse:
    valeur: 50
    forme: entier
  indices:
    relance: Que vaut la variable vitesse juste avant le deuxième appel ?
    methode: Suis le programme ligne par ligne en notant la valeur de la variable après chaque affectation.
    etape: 'Après la première ligne, vitesse contient 30. La troisième ligne remplace cette valeur : calcule la nouvelle.'
  pieges:
  - si:
      valeur: 30
    relance: C'est la valeur du premier appel. La troisième ligne modifie la variable avant le deuxième appel.
  - si:
      valeur: 20
    relance: 20 est ce qu'on ajoute, pas la nouvelle valeur de la variable. Additionne-le à l'ancienne valeur.
  solution: Au départ vitesse = 30 (premier appel avec 30). Puis vitesse ← 30 + 20 = 50. Le deuxième appel reçoit donc 50.
- id: pourquoi-structurer
  type: ouverte
  difficulte: 3
  enonce: Deux élèves ont écrit le même programme de robot. Le premier a tout écrit à la suite, sans commentaire, en recopiant
    six fois les mêmes blocs pour tourner. Le second a créé les sous-programmes avancer(v), tourner_gauche(v), tourner_droite(v)
    et ajouté des commentaires. Explique pourquoi le second programme est plus facile à mettre au point.
  criteres:
  - L'élève explique qu'avec un sous-programme, une correction se fait à un seul endroit (au lieu de six copies).
  - L'élève explique que les noms clairs et les commentaires aident à relire le programme et à trouver une erreur.
  - L'élève fait le lien avec la mise au point (tester, trouver la partie en cause, corriger, retester).
  indices:
    relance: Que se passe-t-il si l'on découvre une erreur dans les blocs qui font tourner le robot ?
    methode: Compare ce qu'il faut faire, dans chacun des deux programmes, pour corriger cette erreur, puis pour qu'un camarade
      comprenne le programme.
    etape: Dans le premier programme, les blocs pour tourner existent en six exemplaires. Combien de corrections faut-il faire
      ? Et dans le second ?
  solution: 'Dans le second programme, tourner_gauche(v) est écrit une seule fois : si le robot tourne mal, on corrige à un
    seul endroit, et la correction vaut pour tous les appels. Dans le premier, il faut corriger les six copies, et on risque
    d''en oublier une. Les noms clairs et les commentaires permettent de relire vite le programme et de repérer la partie
    en cause lors d''un test raté. La mise au point (tester, corriger, retester) est donc plus rapide et plus sûre.'
- id: nblm-sur-un-robot-suiveur-de-ligne-quel-est-l-1
  type: choix
  difficulte: 2
  enonce: Sur un robot suiveur de ligne, quel est l'intérêt principal de créer des sous-programmes comme tourner_gauche(vitesse)
    pour piloter les moteurs du robot ?
  reponse:
    options:
    - id: o1
      texte: Rendre le programme modulaire et éviter de recopier plusieurs fois les mêmes blocs d'instructions.
    - id: o2
      texte: Augmenter la vitesse maximale physique des moteurs au-delà des capacités de la batterie.
    - id: o3
      texte: Permettre au robot de fonctionner sans aucune source d'énergie électrique.
    - id: o4
      texte: Téléverser automatiquement le code dans la carte du robot sans utiliser d'ordinateur.
    bonnes:
    - o1
  indices:
    relance: Pense à la structure du code et à la réutilisation des blocs d'instructions.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur typique : la programmation ne modifie pas les limites physiques ou électriques des moteurs.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : les moteurs appartiennent à la chaîne d''énergie et nécessitent toujours une alimentation.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : le sous-programme est une structure de code, il doit tout de même être téléversé depuis l''ordinateur.'
  solution: 'Rendre le programme modulaire et éviter de recopier plusieurs fois les mêmes blocs d''instructions. C''est exact
    : les sous-programmes organisent le code en blocs réutilisables, ce qui évite les répétitions et facilite les corrections.'
- id: nblm-pourquoi-est-il-fortement-recommande-d-e-2
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il fortement recommandé d'écrire des commentaires dans le code du programme d'un objet technique ?
  reponse:
    options:
    - id: o1
      texte: Pour expliquer le rôle des différentes parties du programme afin de le rendre plus facile à lire et à corriger
        par les humains.
    - id: o2
      texte: Pour donner des ordres prioritaires que la carte électronique exécutera en premier.
    - id: o3
      texte: Pour remplacer les variables et les instructions conditionnelles du programme.
    - id: o4
      texte: Pour augmenter la mémoire vive de la carte microcontrôleur pendant le suivi de ligne.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à qui sont destinés les commentaires (la carte ou le programmeur).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : la carte microcontrôleur n''exécute pas les commentaires, ils sont complètement
      ignorés.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : les commentaires ne sont pas des instructions exécutables et ne remplacent pas le code.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : les commentaires n''ont aucun effet sur les performances matérielles de la carte.'
  solution: 'Pour expliquer le rôle des différentes parties du programme afin de le rendre plus facile à lire et à corriger
    par les humains. C''est exact : de courtes phrases explicatives ignorées par la carte facilitent la compréhension et la
    relecture de l''algorithme.'
- id: nblm-lors-des-essais-si-le-robot-ne-reagit-pa-3
  type: choix
  difficulte: 2
  enonce: Lors des essais, si le robot ne réagit pas comme prévu sur la piste, quelle est la démarche méthodique de mise au
    point à suivre ?
  reponse:
    options:
    - id: o1
      texte: Chercher la cause en simulant le programme pas à pas, puis corriger une seule chose à la fois avant de retester.
    - id: o2
      texte: Modifier plusieurs conditions et variables en même temps pour essayer d'aller plus vite.
    - id: o3
      texte: Effacer complètement le programme sans relire l'algorithme en français.
    - id: o4
      texte: Remplacer immédiatement tous les capteurs et moteurs du robot par des composants neufs.
    bonnes:
    - o1
  indices:
    relance: Considère l'importance de tester les modifications de façon isolée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur typique : en modifiant tout à la fois, on ne sait plus quelle modification a résolu ou aggravé
      le problème.'
  - si:
      contient:
      - o3
    relance: 'C''est inefficace : l''analyse de l''algorithme permet de trouver les erreurs de logique sans repartir de zéro.'
  - si:
      contient:
      - o4
    relance: 'C''est une erreur fréquente : un dysfonctionnement vient le plus souvent d''une erreur de programmation et non
      d''une panne matérielle.'
  solution: 'Chercher la cause en simulant le programme pas à pas, puis corriger une seule chose à la fois avant de retester.
    C''est exact : modifier un seul élément à la fois permet de savoir précisément quelle correction a réglé le problème.'
- id: nblm-a-quel-moment-de-la-demarche-de-programm-4
  type: choix
  difficulte: 2
  enonce: À quel moment de la démarche de programmation faut-il téléverser le programme dans la carte du robot ?
  reponse:
    options:
    - id: o1
      texte: Une fois l'algorithme traduit en programme, juste avant d'effectuer les tests et la mise au point sur le robot
        réel.
    - id: o2
      texte: Avant même d'avoir conçu l'algorithme en langage naturel.
    - id: o3
      texte: Uniquement après avoir validé que le robot ne commet plus aucune erreur sur la piste.
    - id: o4
      texte: Pendant l'assemblage mécanique des roues et du châssis.
    bonnes:
    - o1
  indices:
    relance: Pense au lien entre la conception sur ordinateur et les essais sur le système réel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est impossible : la carte doit recevoir un programme déjà écrit et structuré.'
  - si:
      contient:
