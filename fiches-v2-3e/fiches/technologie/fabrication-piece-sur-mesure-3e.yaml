format: 2
notion: fabrication-piece-sur-mesure-3e
version: 1
etat: verifiee
declencheurs:
- clip cassé remplacer
- imprimante 3D
- pied à coulisse
- fichier STL
- résolution d'impression
- remplissage impression
prerequis: []
essentiel: 'Fabriquer une pièce sur mesure, c''est concevoir puis produire une pièce adaptée à un besoin précis, par exemple
  pour remplacer une pièce cassée d''un objet technique. On part en général d''une modélisation numérique en trois dimensions
  réalisée avec un logiciel de CAO (conception assistée par ordinateur).


  La fabrication additive (l''impression 3D) construit la pièce en ajoutant de la matière couche par couche, à partir du modèle
  numérique, sans outillage spécifique comme un moule. Elle convient bien à un prototype ou à une pièce unique, mais reste
  plus lente que d''autres procédés pour de grandes quantités.


  Avant de lancer l''impression, il faut mesurer précisément les dimensions nécessaires (souvent avec un pied à coulisse),
  choisir un matériau adapté à l''usage (résistance à la flexion, à la chaleur) et vérifier le modèle numérique (absence de
  trous, épaisseur suffisante). On peut aussi utiliser des composants déjà existants issus d''une bibliothèque de pièces,
  réelle ou virtuelle, plutôt que de tout modéliser soi-même.'
methode:
- Mesurer précisément les dimensions nécessaires de la pièce à remplacer, avec un instrument adapté comme un pied à coulisse.
- Modéliser la pièce en trois dimensions avec un logiciel de CAO en respectant ces dimensions.
- Choisir un matériau d'impression adapté à l'usage prévu (résistance, flexion, chaleur).
- Vérifier le modèle numérique (absence de trous, épaisseur suffisante) avant de lancer l'impression.
vocabulaire:
- terme: CAO
  definition: conception assistée par ordinateur, logiciel permettant de modéliser un objet en trois dimensions
- terme: fabrication additive
  definition: procédé qui construit un objet en ajoutant de la matière couche par couche à partir d'un modèle numérique
erreurs_frequentes:
- Ne pas vérifier les dimensions réelles avant de modéliser, ce qui rend la pièce imprimée inadaptée.
- Choisir un matériau ou une épaisseur insuffisante pour l'usage prévu de la pièce.
- 'Croire que l''impression 3D est toujours le procédé le plus rapide : elle est lente pour de grandes quantités.'
exemple:
  enonce: Le clip de fixation d'une boîte à goûter est cassé. Décrire les grandes étapes pour le remplacer par impression
    3D.
  solution: Mesurer les dimensions du clip cassé (longueur, épaisseur, forme des crans). Modéliser un clip identique avec
    un logiciel de CAO. Choisir un matériau plastique assez souple pour résister à la flexion répétée. Vérifier le modèle
    numérique puis imprimer la pièce et contrôler qu'elle s'emboîte correctement sur la boîte.
exercices:
- id: procede-fabrication-additive
  type: choix
  difficulte: 1
  enonce: Quel procédé construit une pièce en ajoutant de la matière couche par couche, à partir d'un modèle numérique ?
  reponse:
    options:
    - id: a
      texte: La fabrication additive (impression 3D)
    - id: b
      texte: L'usinage
    - id: c
      texte: Le moulage
    bonnes:
    - a
  indices:
    relance: Pense au mot qui contient « additive », qui veut dire « qui ajoute ».
    methode: 'Ce procédé n''enlève pas de matière et n''utilise pas de moule : il construit la pièce couche après couche.'
    etape: Le nom courant de ce procédé commence par « impression ».
  pieges:
  - si:
      contient:
      - b
    relance: L'usinage enlève de la matière à partir d'un bloc, il n'en ajoute pas couche par couche.
  - si:
      contient:
      - c
    relance: Le moulage verse un matériau liquide dans un moule, il ne construit pas couche par couche.
  solution: La fabrication additive, ou impression 3D, construit la pièce en ajoutant de la matière couche par couche à partir
    du modèle numérique, sans outillage comme un moule.
- id: logiciel-modelisation
  type: texte_court
  difficulte: 1
  enonce: Quel sigle désigne le type de logiciel utilisé pour modéliser une pièce en trois dimensions avant de la fabriquer
    ?
  reponse:
    acceptees:
    - CAO
    - conception assistee par ordinateur
    fautes_tolerees: 1
  indices:
    relance: Ce sigle comporte trois lettres et concerne la conception d'objets sur ordinateur.
    methode: Relis le vocabulaire de ta leçon sur la modélisation numérique d'une pièce.
    etape: Les trois lettres sont C, A, O.
  pieges:
  - si:
      valeur: 3D
    relance: 3D décrit la dimension du modèle, pas le nom du logiciel. Quel sigle désigne ce type de logiciel ?
  solution: La CAO (conception assistée par ordinateur) est le logiciel utilisé pour modéliser une pièce en trois dimensions.
- id: pourquoi-mesurer
  type: choix
  difficulte: 2
  enonce: Pourquoi faut-il mesurer précisément la pièce d'origine avant de la modéliser en 3D ?
  reponse:
    options:
    - id: a
      texte: Pour que la pièce imprimée s'emboîte correctement et remplisse sa fonction
    - id: b
      texte: Pour que l'imprimante 3D fonctionne plus vite
    - id: c
      texte: Pour réduire le prix du matériau utilisé
    bonnes:
    - a
  indices:
    relance: Que se passe-t-il si les dimensions du modèle numérique sont fausses par rapport à la pièce réelle ?
    methode: Pense à l'ajustement final de la pièce dans l'objet technique qu'elle doit réparer.
    etape: Une pièce trop grande ou trop petite ne s'emboîte pas correctement sur l'objet à réparer.
  pieges:
  - si:
      contient:
      - b
    relance: La vitesse d'impression dépend surtout des réglages de l'imprimante, pas de la précision de la mesure initiale.
  - si:
      contient:
      - c
    relance: Le prix du matériau dépend de la quantité utilisée, pas directement de la précision de la mesure de la pièce
      d'origine.
  solution: Une mesure précise garantit que la pièce imprimée aura les bonnes dimensions et s'emboîtera correctement sur l'objet
    à réparer, sans être trop grande ni trop petite.
- id: procedes-descriptions
  type: association
  difficulte: 2
  enonce: Relie chaque procédé de fabrication à sa description.
  reponse:
    gauche:
    - id: a
      texte: Fabrication additive
    - id: b
      texte: Usinage
    - id: c
      texte: Moulage
    droite:
    - id: x
      texte: Construit la pièce en ajoutant de la matière couche par couche
    - id: y
      texte: Enlève de la matière à partir d'un bloc plein
    - id: z
      texte: Verse un matériau liquide dans un moule qui donne sa forme à la pièce
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces procédés ajoute de la matière, un autre en enlève, le dernier utilise un moule.
    methode: Repère d'abord le procédé qui ajoute de la matière couche par couche, c'est la fabrication additive.
    etape: L'usinage enlève de la matière ; il reste alors à distinguer fabrication additive et moulage.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Relis la définition de chaque procédé : l''un ajoute, l''un enlève, l''un
      moule.'
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le procédé qui ajoute de la matière couche par couche, puis distingue les deux autres.
  solution: 'Fabrication additive : ajoute la matière couche par couche. Usinage : enlève de la matière à partir d''un bloc.
    Moulage : verse un matériau liquide dans un moule.'
- id: ordre-etapes-fabrication
  type: ordre
  difficulte: 2
  enonce: Range ces étapes de fabrication d'une pièce sur mesure dans l'ordre où elles doivent être réalisées.
  reponse:
    elements:
    - id: mesurer
      texte: Mesurer les dimensions de la pièce à remplacer
    - id: modeliser
      texte: Modéliser la pièce en trois dimensions avec un logiciel de CAO
    - id: verifier
      texte: Vérifier le modèle numérique avant l'impression
    - id: imprimer
      texte: Imprimer la pièce en fabrication additive
  indices:
    relance: Peut-on modéliser une pièce sans en connaître d'abord les dimensions réelles ?
    methode: La mesure vient toujours avant la modélisation, et la vérification du modèle vient toujours avant l'impression.
    etape: La première étape consiste à mesurer la pièce d'origine avant toute modélisation numérique.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux doit être faite avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la toute première étape (mesurer) et la toute dernière (imprimer), puis range les deux autres
      entre elles.
  solution: On mesure d'abord la pièce à remplacer, puis on la modélise en trois dimensions, puis on vérifie le modèle numérique,
    et enfin on l'imprime en fabrication additive.
- id: demarche-reparation
  type: ouverte
  difficulte: 3
  enonce: Un pied de chaise en plastique est cassé. Décris la démarche complète pour fabriquer une pièce de remplacement sur
    mesure par impression 3D, en citant au moins trois étapes.
  criteres:
  - L'élève cite la mesure précise des dimensions de la pièce cassée.
  - L'élève cite la modélisation numérique avec un logiciel de CAO.
  - L'élève cite le choix d'un matériau adapté à l'usage (résistance).
  - L'élève cite la vérification du modèle et/ou le test de la pièce imprimée sur l'objet réel.
  indices:
    relance: Par quelle étape faut-il commencer avant de pouvoir dessiner la pièce sur ordinateur ?
    methode: 'Reprends les quatre grandes étapes de la fiche, dans l''ordre : mesurer, modéliser, choisir le matériau, vérifier
      puis imprimer.'
    etape: 'Tu peux commencer ainsi : « Je mesure d''abord les dimensions du pied cassé... », puis continuer avec les étapes
      suivantes.'
  solution: Je mesure d'abord précisément les dimensions du pied cassé avec un pied à coulisse. Je modélise ensuite une pièce
    identique avec un logiciel de CAO. Je choisis un matériau plastique assez résistant pour supporter le poids de la chaise.
    Je vérifie enfin le modèle numérique avant de lancer l'impression, puis je teste la pièce imprimée en la fixant sur la
    chaise.
