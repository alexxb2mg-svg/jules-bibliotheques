format: 2
notion: chaine-information
version: 1
etat: verifiee
declencheurs:
- carte Arduino
- capteur de luminosité
- veilleuse automatique
- arrosage automatique
- IHM
- capteur d'humidité
- voyant lumineux
prerequis: []
essentiel: 'La chaîne d''information d''un objet technique décrit comment l''information est traitée pour commander la chaîne
  d''énergie. Elle comprend en général trois grandes fonctions : ACQUÉRIR (capter une information avec un capteur), TRAITER
  (analyser cette information et décider d''une action, souvent avec un microcontrôleur) et COMMUNIQUER (transmettre une information
  à l''utilisateur ou à un autre système, par exemple un afficheur ou une connexion sans fil).


  Un capteur est un dispositif qui transforme une grandeur physique (température, distance, luminosité, présence) en un signal
  exploitable, le plus souvent électrique. Un microcontrôleur est un petit circuit intégré programmable qui exécute un programme
  pour analyser les données des capteurs et commander des actionneurs (comme un moteur ou une lumière). La carte Arduino est
  un exemple très utilisé en cours de technologie : elle associe un microcontrôleur, des entrées pour les capteurs et des
  sorties pour les actionneurs, et se programme depuis un ordinateur.


  Une interface homme-machine (IHM) regroupe les éléments qui permettent à un utilisateur d''interagir avec un objet technique
  : boutons, écrans, voyants lumineux, haut-parleurs.'
methode:
- Pour identifier la fonction acquérir, chercher le ou les capteurs de l'objet (température, présence, distance...).
- Pour identifier la fonction traiter, chercher le composant qui prend une décision à partir des informations reçues (microcontrôleur,
  carte électronique).
- Pour identifier la fonction communiquer, chercher ce qui informe l'utilisateur ou un autre système (écran, voyant, message
  envoyé).
- Pour construire un schéma de la chaîne d'information, placer les fonctions dans l'ordre acquérir → traiter → communiquer,
  avec le composant réel sous chaque bloc.
vocabulaire:
- terme: capteur
  definition: dispositif qui transforme une grandeur physique en un signal exploitable
- terme: microcontrôleur
  definition: petit circuit programmable qui traite les informations et commande des actionneurs
- terme: IHM
  definition: interface homme-machine, ensemble des éléments qui permettent l'interaction avec un utilisateur
erreurs_frequentes:
- 'Confondre un capteur (qui acquiert une information) et un actionneur (qui agit, comme un moteur : ce dernier appartient
  à la chaîne d''énergie).'
- Croire qu'un microcontrôleur est un ordinateur complet avec système d'exploitation.
- Oublier la fonction communiquer, qui n'est pas toujours visible mais existe dès qu'une information sort du système.
exemple:
  enonce: Une veilleuse s'allume automatiquement la nuit grâce à un capteur de luminosité relié à un microcontrôleur qui commande
    une LED. Identifier la fonction acquérir, traiter et communiquer/agir.
  solution: 'Acquérir : le capteur de luminosité mesure la lumière ambiante. Traiter : le microcontrôleur compare cette mesure
    à un seuil et décide d''allumer ou non. La LED qui s''allume relève de la chaîne d''énergie (elle convertit l''énergie
    électrique en lumière), mais un voyant indiquant que le système fonctionne relèverait de la fonction communiquer de la
    chaîne d''information.'
exercices:
- id: capteur-ou-actionneur
  type: choix
  difficulte: 1
  enonce: Un système d'arrosage automatique comprend un capteur d'humidité du sol et une électrovanne qui laisse passer l'eau.
    Lequel de ces deux composants appartient à la chaîne d'information ?
  reponse:
    options:
    - id: a
      texte: Le capteur d'humidité du sol
    - id: b
      texte: L'électrovanne
    - id: c
      texte: Les deux composants
    bonnes:
    - a
  indices:
    relance: La chaîne d'information acquiert et traite des données ; la chaîne d'énergie agit physiquement.
    methode: Cherche lequel des deux composants mesure une grandeur physique et lequel produit une action.
    etape: L'électrovanne laisse passer un fluide, c'est une action physique, pas une mesure.
  pieges:
  - si:
      contient:
      - b
    relance: 'L''électrovanne agit sur le passage de l''eau : c''est un composant de la chaîne d''énergie, pas d''information.'
  - si:
      contient:
      - c
    relance: Seul un des deux composants mesure une grandeur physique pour fournir une information au système.
  solution: 'Le capteur d''humidité du sol appartient à la chaîne d''information (fonction acquérir) : il transforme une grandeur
    physique en signal exploitable. L''électrovanne appartient à la chaîne d''énergie.'
- id: fonctions-arrosage-automatique
  type: association
  difficulte: 2
  enonce: Un système d'arrosage automatique mesure l'humidité du sol, décide s'il faut arroser, puis affiche « arrosage en
    cours » sur un petit écran. Associe chaque élément à sa fonction de la chaîne d'information.
  reponse:
    gauche:
    - id: a
      texte: Le capteur d'humidité du sol
    - id: b
      texte: Le microcontrôleur qui compare la mesure à un seuil
    - id: c
      texte: L'écran qui affiche « arrosage en cours »
    droite:
    - id: x
      texte: Acquérir
    - id: y
      texte: Traiter
    - id: z
      texte: Communiquer
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Repère d'abord le composant qui mesure une grandeur physique du milieu.
    methode: Le composant qui décide (compare à un seuil) traite ; celui qui informe l'utilisateur communique.
    etape: Le capteur d'humidité est celui qui mesure, c'est donc la fonction acquérir.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis l'élément concerné et son rôle exact dans le système.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le capteur, toujours en fonction acquérir, c'est le repère le plus sûr.
  solution: 'Acquérir : le capteur d''humidité du sol. Traiter : le microcontrôleur qui compare l''humidité mesurée à un seuil
    et décide d''arroser. Communiquer : l''écran qui affiche « arrosage en cours ».'
- id: ordre-chaine-information
  type: ordre
  difficulte: 1
  enonce: Range dans l'ordre les trois fonctions de la chaîne d'information.
  reponse:
    elements:
    - id: acquerir
      texte: Acquérir
    - id: traiter
      texte: Traiter
    - id: communiquer
      texte: Communiquer
  indices:
    relance: Avant de pouvoir décider, il faut d'abord avoir mesuré une information.
    methode: La fonction communiquer intervient toujours après que l'information a été analysée.
    etape: La première fonction est toujours celle qui capte une grandeur physique avec un capteur.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux fonctions voisines sont inversées. Doit-on analyser l'information avant ou après l'avoir captée ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la toute première fonction (capter avec un capteur) et la toute dernière (informer l'utilisateur).
  solution: Acquérir → traiter → communiquer.
- id: capteur-arduino-temperature
  type: texte_court
  difficulte: 1
  enonce: Pour mesurer la température d'une pièce avec une carte Arduino, quel type de composant faut-il brancher sur une
    entrée de la carte ?
  reponse:
    acceptees:
    - un capteur de température
    - capteur de température
    fautes_tolerees: 1
  indices:
    relance: Ce composant transforme une grandeur physique (la chaleur) en signal électrique exploitable.
    methode: C'est le composant de la fonction acquérir, adapté à la grandeur « température ».
    etape: Le nom du composant contient le mot « capteur » suivi de la grandeur mesurée.
  pieges:
  - si:
      valeur: microcontrôleur
    relance: Le microcontrôleur traite l'information, il ne mesure pas directement la température.
  solution: Un capteur de température (thermistance ou capteur numérique de température), branché sur une entrée de la carte
    Arduino.
