format: 2
notion: caracterisation-chaines-fonctions-3e
version: 3
etat: generee
declencheurs:
- chaîne d'énergie et chaîne d'information
- les deux chaînes
- données numérisées
- numériser une image
- comment circulent les données
- suite de 0 et 1
- découper en paquets
- trajet des données
- fonctions des deux chaînes
prerequis:
- chaine-energie
- chaine-information
essentiel: |
  Pour caractériser un objet technique, on décrit ses deux chaînes par leurs fonctions.

  Chaîne d'information : acquérir (capteurs, boutons), traiter (microcontrôleur et son programme), communiquer (afficheur, voyant, ordre envoyé à la chaîne d'énergie, liaison sans fil).

  Chaîne d'énergie : alimenter (batterie, réseau électrique), distribuer (relais, variateur), convertir (moteur, lampe), transmettre (engrenages, courroie, pignon et crémaillère).

  Les deux chaînes sont reliées : la chaîne d'information envoie ses ordres au distributeur de la chaîne d'énergie, et des capteurs surveillent l'action réalisée (fin de course, vitesse). Ce modèle sert à ajouter une fonctionnalité (un capteur et quelques lignes de programme) ou à réparer (chercher quel bloc ne remplit plus sa fonction).

  Numériser, c'est transformer une information en nombres écrits en binaire, avec des 0 et des 1 (les bits). 8 bits forment un octet. Un son est mesuré très souvent et chaque mesure devient un nombre. Une image est découpée en petits points (pixels) dont la couleur est codée par des nombres. Une mesure de capteur devient un nombre grâce au microcontrôleur.

  Les données numérisées sont stockées dans une mémoire, mises en forme dans un format de fichier (texte, image JPEG, son MP3, vidéo MP4, tableau de tableur), puis transmises par câble ou sans fil (Wi-Fi, Bluetooth).

  Sur Internet, un fichier est découpé en paquets. Chaque paquet porte l'adresse IP de l'expéditeur et celle du destinataire. Des routeurs dirigent les paquets de réseau en réseau. Les paquets peuvent prendre des chemins différents ; l'appareil destinataire les remet dans l'ordre pour reconstituer le fichier.

  Unités : 1 octet = 8 bits. Le débit, en bits par seconde, dit combien de données passent chaque seconde.

  Au brevet : ranger les composants d'un objet dans les fonctions des deux chaînes, montrer le lien entre elles, décrire le trajet d'une donnée numérisée.
methode:
- Lister les composants de l'objet, puis ranger chacun dans une fonction de la chaîne d'information ou de la chaîne d'énergie.
- 'Repérer le lien entre les deux chaînes : quel ordre part du microcontrôleur, et vers quel distributeur ?'
- 'Pour une donnée, suivre son trajet : acquise, numérisée, stockée, mise en forme, transmise.'
- Pour une transmission sur Internet, penser aux paquets, aux adresses IP et aux routeurs.
- 'Pour un calcul de taille ou de durée : convertir d''abord en bits (1 octet = 8 bits).'
vocabulaire:
- terme: numérisation
  definition: Transformation d'une information (son, image, mesure) en nombres binaires.
- terme: bit
  definition: 'Plus petite unité d''information : 0 ou 1.'
- terme: octet
  definition: Groupe de 8 bits.
- terme: paquet
  definition: Morceau d'un fichier envoyé sur un réseau, avec les adresses de l'expéditeur et du destinataire.
- terme: routeur
  definition: Appareil qui dirige les paquets d'un réseau vers un autre.
- terme: format de fichier
  definition: Manière d'organiser les données d'un fichier (JPEG pour une image, MP3 pour un son).
- terme: pixel
  definition: Petit point d'une image, dont la couleur est codée par des nombres.
erreurs_frequentes:
- 'Confondre communiquer et transmettre : communiquer concerne l''information, transmettre concerne le mouvement dans la chaîne d''énergie.'
- 'Mettre le moteur dans la chaîne d''information parce qu''il est commandé par le programme : il reçoit un ordre, mais c''est un convertisseur de la chaîne d''énergie.'
- 'Croire qu''un fichier voyage en un seul bloc sur Internet : il est découpé en paquets, qui peuvent suivre des chemins différents.'
- 'Confondre bit et octet : un octet contient 8 bits.'
- 'Mélanger les unités : une taille en octets doit être convertie en bits avant d''être comparée à un débit en bits par seconde.'
exemple:
  enonce: Caractériser un robot aspirateur connecté et dire comment la carte du logement arrive sur le smartphone.
  solution: 'Chaîne d''information : acquérir (capteurs de distance, contact du pare-chocs, capteur de vide), traiter (microcontrôleur), communiquer (ordres aux moteurs, bip, module Wi-Fi). Chaîne d''énergie : alimenter (batterie), distribuer (circuit de commande des moteurs), convertir (moteurs des roues et de la brosse), transmettre (engrenages vers les roues). La carte du logement est numérisée, stockée en mémoire, envoyée par Wi-Fi à la box, puis découpée en paquets qui traversent Internet jusqu''au smartphone.'
exercices:
- id: fonctions-appartenance
  type: choix
  difficulte: 1
  enonce: Parmi ces fonctions, lesquelles appartiennent à la chaîne d'information ?
  reponse:
    options:
    - id: a
      texte: Acquérir
    - id: b
      texte: Convertir
    - id: c
      texte: Traiter
    - id: d
      texte: Transmettre
    - id: e
      texte: Communiquer
    - id: f
      texte: Distribuer
    bonnes:
    - a
    - c
    - e
  indices:
    relance: Pour chaque fonction, travaille-t-on sur une information, ou sur de l'énergie et un mouvement ?
    methode: La chaîne d'information a trois fonctions, la chaîne d'énergie en a quatre. Retrouve les quatre de la chaîne d'énergie et écarte-les.
    etape: 'Convertir change la forme de l''énergie (c''est le rôle du moteur) : cette fonction est dans la chaîne d''énergie. Continue avec les autres.'
  pieges:
  - si:
      contient:
      - d
    relance: Transmettre concerne-t-il une information, ou un mouvement mécanique (engrenages, courroie) ?
  - si:
      contient:
      - f
    relance: Distribuer, c'est laisser passer ou non l'énergie vers le moteur. Dans quelle chaîne est-ce ?
  - si:
      diagnostic: incomplet
    relance: Il en manque. Pense au rôle des capteurs, puis à celui du microcontrôleur, puis à ce qu'il fait du résultat.
  - si:
      diagnostic: mauvais_choix
    relance: Tu as choisi une fonction qui agit sur l'énergie. Laquelle ?
  solution: Acquérir, traiter et communiquer forment la chaîne d'information. Alimenter, distribuer, convertir et transmettre forment la chaîne d'énergie.
- id: portail-deux-chaines
  type: association
  difficulte: 2
  enonce: Associe chaque composant d'un portail coulissant automatique à sa fonction.
  reponse:
    gauche:
    - id: batterie
      texte: Batterie de secours
    - id: fin-de-course
      texte: Capteur de fin de course
    - id: carte
      texte: Microcontrôleur de la carte de commande
    - id: relais
      texte: Relais
    - id: moteur
      texte: Moteur électrique
    - id: cremaillere
      texte: Pignon et crémaillère
    - id: feu
      texte: Feu orange clignotant qui prévient les passants
    droite:
    - id: alimenter
      texte: Alimenter
    - id: distribuer
      texte: Distribuer
    - id: convertir
      texte: Convertir
    - id: transmettre
      texte: Transmettre
    - id: acquerir
      texte: Acquérir
    - id: traiter
      texte: Traiter
    - id: communiquer
      texte: Communiquer
    paires:
      batterie: alimenter
      fin-de-course: acquerir
      carte: traiter
      relais: distribuer
      moteur: convertir
      cremaillere: transmettre
      feu: communiquer
  indices:
    relance: Quel composant prend une information sur la position du portail ?
    methode: Sépare d'abord les composants qui manipulent une information de ceux qui manipulent de l'énergie, puis donne à chacun sa fonction.
    etape: La batterie de secours fournit l'énergie quand le courant est coupé. Chaque fonction reçoit ici un seul composant.
  pieges:
  - si:
      valeur:
        batterie: alimenter
        fin-de-course: acquerir
        carte: traiter
        relais: distribuer
        moteur: convertir
        cremaillere: communiquer
        feu: transmettre
    relance: Le pignon et la crémaillère transportent-ils une information ou un mouvement ? Et le feu clignotant ?
  - si:
      valeur:
        batterie: alimenter
        fin-de-course: acquerir
        carte: traiter
        relais: distribuer
        moteur: transmettre
        cremaillere: convertir
        feu: communiquer
    relance: 'Lequel reçoit de l''énergie électrique et fournit un mouvement : le moteur, ou le pignon et la crémaillère ?'
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Relis chaque composant : que reçoit-il, et que fournit-il ?'
  - si:
      diagnostic: associations_fausses
    relance: Commence par la chaîne d'information (prendre, décider, prévenir), puis suis l'énergie de la batterie jusqu'au portail.
  solution: 'Batterie : alimenter. Capteur de fin de course : acquérir. Microcontrôleur : traiter. Relais : distribuer. Moteur : convertir. Pignon et crémaillère : transmettre. Feu clignotant : communiquer (il informe les passants).'
- id: mot-numerisation
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la transformation d'un son, d'une image ou d'une mesure en une suite de 0 et de 1 qu'un appareil peut stocker ?
  reponse:
    acceptees:
    - numérisation
    - numériser
    - codage numérique
    - conversion numérique
    - codage binaire
    fautes_tolerees: 1
  indices:
    relance: Après cette transformation, l'information n'est plus qu'une suite de nombres. Quel adjectif désigne ce qui est fait de nombres ?
    methode: Pense au mot qu'on emploie quand on scanne une photo papier pour la garder sur un ordinateur.
    etape: 'C''est ce que font un scanner ou le capteur d''un appareil photo : ils passent d''une information réelle (lumière, son) à une suite de nombres. Donne le nom de cette action.'
  pieges:
  - si:
      valeur: numérique
    relance: Tu tiens l'idée, mais c'est un adjectif. Quel nom désigne l'action de rendre une information numérique ?
  - si:
      valeur: compression
    relance: La compression réduit la taille d'un fichier déjà fait de 0 et de 1. Comment s'appelle l'étape qui crée ces 0 et ces 1 ?
  - si:
      valeur: transmission
    relance: La transmission envoie les données. Comment s'appelle l'étape d'avant, qui transforme l'information en nombres ?
  solution: 'C''est la numérisation : l''information est transformée en nombres binaires (des 0 et des 1).'
- id: trajet-photo
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre le trajet d'une photo prise avec un smartphone et envoyée à un ami par Internet.
  reponse:
    elements:
    - id: capteur
      texte: Le capteur de l'appareil photo reçoit la lumière.
    - id: numerisee
      texte: L'image est numérisée en nombres binaires.
    - id: stockee
      texte: Elle est stockée dans la mémoire, au format JPEG.
    - id: paquets
      texte: Le fichier est découpé en paquets portant l'adresse IP du destinataire.
    - id: routeurs
      texte: Des routeurs dirigent les paquets à travers Internet.
    - id: rassemble
      texte: Le téléphone de l'ami rassemble les paquets et affiche la photo.
  indices:
    relance: Quelle étape a lieu avant toutes les autres, au moment où l'on appuie pour prendre la photo ?
    methode: 'Suis la photo : acquise, transformée en nombres, rangée en mémoire, préparée pour l''envoi, acheminée, reconstituée.'
    etape: Tout commence par le capteur qui reçoit la lumière. Que faut-il faire à l'image avant de pouvoir la ranger dans une mémoire ?
  pieges:
  - si:
      valeur:
      - capteur
      - numerisee
      - stockee
      - routeurs
      - paquets
      - rassemble
    relance: Les routeurs peuvent-ils diriger des paquets qui n'existent pas encore ?
  - si:
      valeur:
      - capteur
      - stockee
      - numerisee
      - paquets
      - routeurs
      - rassemble
    relance: Une mémoire ne contient que des 0 et des 1. Peut-on y ranger l'image avant de l'avoir transformée en nombres ?
  - si:
      diagnostic: ordre_faux
    relance: Repars de la prise de vue et avance étape par étape jusqu'à l'écran de l'ami.
  solution: Capteur, numérisation, stockage au format JPEG, découpage en paquets avec l'adresse IP du destinataire, acheminement par les routeurs, puis le téléphone de l'ami rassemble les paquets et affiche la photo.
- id: nombre-paquets
  type: nombre
  difficulte: 2
  enonce: Une station météo connectée envoie un fichier de 6 000 octets. Le réseau le découpe en paquets qui contiennent chacun 1 500 octets de données. Combien de paquets faut-il ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Quelle opération permet de savoir combien de fois 1 500 octets tiennent dans 6 000 octets ?
    methode: Divise la taille du fichier par la taille des données d'un paquet.
    etape: Un paquet transporte 1 500 octets, deux paquets en transportent 3 000. Continue d'ajouter des paquets jusqu'à atteindre 6 000 octets.
  pieges:
  - si:
      valeur: 9000000
    relance: Tu as multiplié les deux tailles. On cherche combien de paquets de 1 500 octets il faut pour 6 000 octets.
  - si:
      diagnostic: valeur_fausse
    relance: 'Divise la taille du fichier par la taille d''un paquet, puis vérifie : ton nombre de paquets fois 1 500 fait-il bien 6 000 ?'
  solution: 6 000 ÷ 1 500 = 4, donc 4 paquets. Chaque paquet porte aussi les adresses IP de l'expéditeur et du destinataire.
- id: caracteriser-store
  type: ouverte
  difficulte: 3
  enonce: 'Un store banne connecté se replie tout seul quand un anémomètre mesure un vent trop fort, et prévient l''utilisateur sur son smartphone. Il comprend : le réseau électrique, un anémomètre (capteur de vitesse du vent), un microcontrôleur, un relais, un moteur, un réducteur à engrenages et un module Wi-Fi. Caractérise ses deux chaînes en fonctions et explique comment l''alerte arrive sur le smartphone.'
  criteres:
  - 'Chaque composant est dans la bonne fonction : anémomètre (acquérir), microcontrôleur (traiter), module Wi-Fi (communiquer), réseau électrique (alimenter), relais (distribuer), moteur (convertir), réducteur (transmettre).'
  - 'L''élève montre le lien entre les chaînes : le microcontrôleur compare la vitesse du vent à un seuil et envoie l''ordre au relais.'
  - 'L''élève décrit le trajet de l''alerte : message numérisé, envoyé par Wi-Fi, découpé en paquets avec des adresses IP et acheminé par Internet jusqu''au smartphone.'
  indices:
    relance: Quel composant prend l'information sur le vent, et lequel décide de replier le store ?
    methode: 'Fais deux listes : la chaîne d''information (acquérir, traiter, communiquer) et la chaîne d''énergie (alimenter, distribuer, convertir, transmettre). Puis suis le message d''alerte.'
    etape: L'anémomètre acquiert la vitesse du vent et le réseau électrique alimente le store. Place maintenant le microcontrôleur et le relais.
  solution: 'Chaîne d''information : l''anémomètre acquiert la vitesse du vent ; le microcontrôleur la compare à un seuil ; il communique en envoyant un ordre au relais et un message par le module Wi-Fi. Chaîne d''énergie : le réseau alimente, le relais distribue, le moteur convertit l''énergie électrique en énergie mécanique, le réducteur transmet la rotation au tube d''enroulement. L''alerte est un message numérisé, envoyé par Wi-Fi à la box, découpé en paquets portant les adresses IP, dirigés par des routeurs à travers Internet jusqu''au smartphone.'
- id: octets-en-bits
  type: nombre
  difficulte: 1
  enonce: Un petit fichier texte fait 250 octets. Combien de bits contient-il ?
  reponse:
    valeur: 2000
    forme: entier
  indices:
    relance: Combien de bits y a-t-il dans un seul octet ?
    methode: Multiplie le nombre d'octets par le nombre de bits d'un octet.
    etape: Un octet contient 8 bits, donc 2 octets contiennent 16 bits. Continue avec 250 octets.
  pieges:
  - si:
      valeur: 31,25
    relance: 'Tu as divisé au lieu de multiplier. Un octet est un paquet de bits : il y a plus de bits que d''octets.'
  - si:
      valeur: '250'
    relance: 250 est le nombre d'octets. On demande le nombre de bits.
  - si:
      diagnostic: valeur_fausse
    relance: Ce n'est pas ça. Reprends le calcul en écrivant chaque étape avec ses unités.
  solution: 250 × 8 = 2 000 bits.
- id: formats-fichiers
  type: association
  difficulte: 1
  enonce: Associe chaque donnée au format de fichier le plus adapté.
  reponse:
    gauche:
    - id: photo
      texte: Une photographie
    - id: chanson
      texte: Une chanson
    - id: film
      texte: Une vidéo
    - id: mesures
      texte: Un tableau de mesures d'une station météo
    droite:
    - id: jpeg
      texte: Image (JPEG)
    - id: mp3
      texte: Son (MP3)
    - id: mp4
      texte: Vidéo (MP4)
    - id: tableur
      texte: Tableau (fichier de tableur)
    paires:
      photo: jpeg
      chanson: mp3
      film: mp4
      mesures: tableur
  indices:
    relance: 'Pour chaque donnée, de quel type est-elle : image, son, vidéo ou tableau de nombres ?'
    methode: Le format de fichier est choisi selon la nature de la donnée numérisée.
    etape: Une photographie est une image fixe. Cherche le format d'image, puis passe aux autres données.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque élément et demande-toi ce qu'il fait vraiment.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Commence par celle dont tu es sûr, puis avance par élimination.
  solution: 'Photographie : JPEG. Chanson : MP3. Vidéo : MP4. Tableau de mesures : fichier de tableur.'
