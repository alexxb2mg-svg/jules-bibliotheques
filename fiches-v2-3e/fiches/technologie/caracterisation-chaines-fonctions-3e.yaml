format: 2
notion: caracterisation-chaines-fonctions-3e
version: 1
etat: verifiee
declencheurs:
- portail automatique
- store électrique
- capteur de vent
- démonter l'objet
- schéma fonctionnel
- deux chaînes ensemble
prerequis:
- chaine-energie
- chaine-information
essentiel: 'Caractériser les chaînes d''énergie et d''information d''un objet réel, c''est identifier, pour chaque fonction
  (alimenter, distribuer, convertir, transmettre pour l''énergie ; acquérir, traiter, communiquer pour l''information), le
  ou les composants réels qui la réalisent, en observant l''objet ou sa documentation technique.


  Les deux chaînes fonctionnent ensemble : la chaîne d''information analyse une situation et commande la chaîne d''énergie
  pour produire une action. Par exemple, un détecteur de mouvement (chaîne d''information : acquérir la présence, traiter,
  communiquer l''ordre) commande l''allumage d''une lampe (chaîne d''énergie : alimenter, distribuer, convertir en lumière).'
methode:
- Observer ou démonter (virtuellement ou réellement) l'objet technique pour repérer chaque composant.
- 'Classer chaque composant dans la chaîne d''énergie ou la chaîne d''information selon son rôle : transporte-t-il de la puissance
  (énergie) ou une information ?'
- Vérifier que l'ordre des fonctions est respecté dans chaque chaîne (alimenter avant distribuer avant convertir avant transmettre
  ; acquérir avant traiter avant communiquer).
- 'Relier les deux chaînes : la chaîne d''information commande généralement la fonction distribuer de la chaîne d''énergie.'
vocabulaire:
- terme: schéma fonctionnel
  definition: représentation en blocs des fonctions d'un objet technique, reliées entre elles par des flèches
erreurs_frequentes:
- Classer un composant dans la mauvaise chaîne (par exemple un capteur, qui appartient à la chaîne d'information, pas à la
  chaîne d'énergie).
- 'Oublier le lien entre les deux chaînes : la chaîne d''information commande la chaîne d''énergie.'
- Confondre l'ordre des fonctions dans chaque chaîne.
exemple:
  enonce: Un portail automatique s'ouvre quand une télécommande envoie un signal. Décrire brièvement les deux chaînes en jeu.
  solution: 'Chaîne d''information : acquérir (récepteur qui capte le signal de la télécommande), traiter (carte électronique
    qui vérifie le code et décide d''ouvrir), communiquer (envoi de l''ordre au moteur). Chaîne d''énergie : alimenter (bloc
    secteur ou batterie), distribuer (relais commandé par la carte électronique), convertir (moteur électrique qui tourne),
    transmettre (système de crémaillère ou de bras qui ouvre le portail).'
exercices:
- id: chaine-du-capteur-de-vent
  type: choix
  difficulte: 1
  enonce: Un store électrique se referme automatiquement quand un capteur de vent détecte une rafale trop forte. À quelle
    chaîne appartient le capteur de vent ?
  reponse:
    options:
    - id: a
      texte: À la chaîne d'information
    - id: b
      texte: À la chaîne d'énergie
    - id: c
      texte: Aux deux chaînes à la fois
    bonnes:
    - a
  indices:
    relance: Le capteur mesure une grandeur physique (le vent), il ne fournit ni ne transforme d'énergie de puissance.
    methode: Un capteur réalise toujours la fonction acquérir, qui appartient à une seule des deux chaînes.
    etape: Demande-toi si le capteur transporte de la puissance ou seulement une information.
  pieges:
  - si:
      contient:
      - b
    relance: Le capteur ne transporte pas de puissance, il mesure seulement une grandeur physique pour informer le système.
  - si:
      contient:
      - c
    relance: Chaque composant appartient en général à une seule des deux chaînes, selon son rôle précis.
  solution: 'Le capteur de vent appartient à la chaîne d''information (fonction acquérir) : il mesure la force du vent et
    transmet cette information au système.'
- id: fonctions-portail-automatique
  type: association
  difficulte: 3
  enonce: 'Un portail automatique fonctionne ainsi : un récepteur capte le signal de la télécommande, une carte électronique
    vérifie le code et décide d''ouvrir, un moteur électrique tourne, et un bloc secteur alimente le circuit. Associe chaque
    composant à sa fonction.'
  reponse:
    gauche:
    - id: a
      texte: Récepteur qui capte le signal
    - id: b
      texte: Carte électronique qui décide
    - id: c
      texte: Moteur électrique
    - id: d
      texte: Bloc secteur
    droite:
    - id: w
      texte: Acquérir
    - id: x
      texte: Traiter
    - id: y
      texte: Convertir
    - id: z
      texte: Alimenter
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Deux composants appartiennent à la chaîne d'information, deux autres à la chaîne d'énergie.
    methode: Le récepteur mesure un signal (information) ; le bloc secteur fournit la puissance électrique de base (énergie).
    etape: Le moteur transforme l'énergie électrique en mouvement, c'est la fonction convertir de la chaîne d'énergie.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Redemande-toi si le composant appartient à la chaîne d'énergie ou d'information,
      et à quelle fonction précise.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le bloc secteur, toujours en fonction alimenter, c'est le repère le plus sûr.
  solution: 'Récepteur : acquérir. Carte électronique : traiter. Moteur électrique : convertir. Bloc secteur : alimenter.'
- id: lien-entre-les-deux-chaines
  type: texte_court
  difficulte: 2
  enonce: Dans un objet technique automatisé, quelle fonction de la chaîne d'énergie est généralement commandée directement
    par la chaîne d'information ?
  reponse:
    acceptees:
    - distribuer
    - la fonction distribuer
    fautes_tolerees: 1
  indices:
    relance: C'est la fonction qui autorise ou coupe le passage de l'énergie, souvent réalisée par un relais.
    methode: La chaîne d'information envoie un ordre qui active ou coupe un composant comme un relais ou un contacteur.
    etape: Cette fonction se situe juste après alimenter dans l'ordre de la chaîne d'énergie.
  pieges:
  - si:
      valeur: convertir
    relance: La fonction convertir transforme l'énergie, mais ce n'est pas elle qui est directement commandée par un ordre
      de la chaîne d'information.
  solution: La fonction distribuer (souvent réalisée par un relais) est généralement commandée directement par la chaîne d'information.
