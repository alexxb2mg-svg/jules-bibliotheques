# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: structuration-traitement-donnees
version: 2
etat: verifiee
declencheurs:
- octets
- code binaire
- descripteur
- code ASCII
- filtrer un tableau
- trier une colonne
- filtrer une colonne du tableur
- table de données d'un objet
- combien de bits
- nombre écrit avec des 0 et des 1
prerequis:
- 4e-programme-analyse-donnees
essentiel: 'Pour décrire des objets sous forme de données, on les range dans une table. Chaque ligne décrit un objet. Chaque
  colonne est un descripteur (masse, couleur, prix, température...). L''ensemble des objets décrits par les mêmes descripteurs
  forme une collection.


  Chaque descripteur a un type et un format. Le type dit la nature de la valeur : nombre entier (12), nombre décimal (7,5),
  texte (« salon »), booléen (vrai ou faux, oui ou non), date. Le format dit comment la valeur est écrite : unité, nombre
  de chiffres, forme de la date, etc.


  Exemple : une table de lampes connectées. Objet = une lampe. Descripteurs = nombre de LED (entier), puissance en W (décimal),
  pièce (texte), allumée (booléen).


  Dans un ordinateur ou une carte programmable, tout est codé en binaire. Un bit vaut 0 ou 1. Un octet est un groupe de 8
  bits. En ASCII étendu, un caractère (lettre, chiffre, signe) est codé sur 1 octet, soit 8 bits. Un texte de 250 caractères
  occupe donc 250 octets.


  Un booléen n''a que deux valeurs, donc un seul bit suffit (0 = faux, 1 = vrai).


  Un nombre entier s''écrit en binaire avec les puissances de 2. De droite à gauche, les rangs valent 1, 2, 4, 8, 16... Pour
  lire 1101, on additionne les rangs sous les 1 : 8 + 4 + 1 = 13. Pour écrire 10 en binaire, on cherche les puissances de
  2 qui le composent : 8 + 2, donc 1010.


  Pour les tailles de fichiers, on donne toujours la convention : soit 1 ko = 1 000 octets, soit 1 ko = 1 024 octets. On suit
  celle de l''énoncé.


  Un tableur traite les données d''une table :

  - calcul : somme, moyenne, minimum, maximum d''une colonne ;

  - filtre : n''afficher que les lignes qui respectent une condition (les autres sont cachées, pas effacées) ;

  - tri : ranger toutes les lignes dans un ordre (croissant ou décroissant) selon une colonne.


  Ces traitements permettent d''interpréter le comportement d''un objet technique : par exemple, filtrer les heures où une
  serre dépasse 30 °C, ou calculer sa température moyenne.


  Au brevet, on attend : nommer objets et descripteurs, donner un type, convertir un binaire court, calculer une taille en
  octets, choisir le bon traitement de tableur.

  '
methode:
- Repérer les objets (les lignes) et les descripteurs (les colonnes) de la table.
- Donner un type à chaque descripteur (entier, décimal, texte, booléen, date) et un format (unité, forme d'écriture).
- Pour une taille, compter d'abord en octets (1 caractère en ASCII étendu = 1 octet), puis convertir avec la convention annoncée
  dans l'énoncé.
- 'Pour lire un nombre binaire : écrire sous chaque chiffre sa puissance de 2 en partant de la droite, puis additionner celles
  qui sont sous un 1.'
- 'Pour écrire un entier en binaire : retirer les plus grandes puissances de 2 possibles, et mettre 1 aux rangs utilisés,
  0 aux autres.'
- Choisir le bon traitement dans le tableur (calcul, filtre ou tri) selon la question posée, puis lire le résultat.
vocabulaire:
- terme: descripteur
  definition: Caractéristique qui décrit chaque objet d'une table (une colonne).
- terme: collection
  definition: Ensemble des objets décrits par les mêmes descripteurs.
- terme: type de donnée
  definition: 'Nature d''une valeur : entier, décimal, texte, booléen, date.'
- terme: bit
  definition: 'Plus petite information binaire : 0 ou 1.'
- terme: octet
  definition: Groupe de 8 bits.
- terme: booléen
  definition: 'Type de donnée qui ne prend que deux valeurs : vrai ou faux.'
- terme: ASCII étendu
  definition: Code où chaque caractère est écrit sur un octet.
- terme: filtre
  definition: Traitement qui n'affiche que les lignes respectant une condition, sans les supprimer.
- terme: tri
  definition: Traitement qui range les lignes dans un ordre, croissant ou décroissant.
erreurs_frequentes:
- Confondre bit et octet (1 octet = 8 bits, et non l'inverse).
- Utiliser 1 024 au lieu de 1 000 (ou l'inverse) sans lire la convention donnée par l'énoncé.
- Lire un nombre binaire en commençant les puissances de 2 par la gauche.
- Confondre trier (changer l'ordre des lignes) et filtrer (cacher les lignes qui ne respectent pas la condition).
- Prendre un objet (une ligne) pour un descripteur (une colonne).
exemple:
  enonce: Un texte de 250 caractères est codé en ASCII étendu. Quelle est sa taille en octets, puis en bits ?
  solution: En ASCII étendu, 1 caractère = 1 octet, donc 250 octets. 1 octet = 8 bits, donc 250 × 8 = 2 000 bits.
exercices:
- id: nom-du-descripteur
  type: texte_court
  difficulte: 1
  enonce: Dans une table de données sur des vélos, les colonnes s'appellent « masse », « couleur » et « prix ». Comment appelle-t-on
    chacune de ces caractéristiques qui décrivent les objets ?
  reponse:
    acceptees:
    - descripteur
    - descripteurs
    - un descripteur
    fautes_tolerees: 1
  indices:
    relance: Une ligne de la table décrit un vélo. Et une colonne, à quoi sert-elle ?
    methode: 'Rappelle-toi le vocabulaire des données : objet, collection, type... et le mot qui désigne ce qui « décrit »
      un objet.'
    etape: Le mot cherché est formé sur le verbe « décrire ».
  pieges:
  - si:
      valeur: objet
    relance: Un objet, c'est un vélo (une ligne). La masse ou la couleur, qu'est-ce que c'est pour ce vélo ?
  - si:
      valeur: type
    relance: Le type, c'est la nature de la valeur (nombre, texte...). Quel mot désigne la colonne elle-même ?
  solution: 'Chaque colonne (masse, couleur, prix) est un descripteur : elle décrit une caractéristique de chaque objet de
    la collection.'
- id: types-des-descripteurs
  type: association
  difficulte: 1
  enonce: Associe chaque descripteur d'une table de lampes connectées au type de donnée qui lui convient.
  reponse:
    gauche:
    - id: a
      texte: Nombre de LED de la lampe
    - id: b
      texte: Puissance en watts (par exemple 7,5)
    - id: c
      texte: Nom de la pièce où elle est installée
    - id: d
      texte: Lampe allumée (oui ou non)
    droite:
    - id: w
      texte: nombre entier
    - id: x
      texte: nombre décimal
    - id: y
      texte: texte
    - id: z
      texte: booléen
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Pour chaque descripteur, quelles valeurs peut-il prendre ?
    methode: Un nombre qui compte des objets est entier ; un nombre à virgule est décimal ; des mots sont du texte ; une valeur
      à deux possibilités est un booléen.
    etape: '« Lampe allumée » ne peut valoir que oui ou non : cherche le type qui n''a que deux valeurs.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie la différence entre nombre entier et nombre décimal.
  solution: 'Nombre de LED : entier. Puissance 7,5 W : décimal. Nom de la pièce : texte. Allumée oui/non : booléen.'
- id: binaire-vers-decimal
  type: nombre
  difficulte: 2
  enonce: Un capteur envoie le nombre entier écrit en binaire 1101. Quelle est sa valeur en écriture décimale ?
  reponse:
    valeur: 13
    forme: entier
  indices:
    relance: En binaire, que vaut chaque rang, en partant de la droite ?
    methode: Écris sous chaque chiffre sa puissance de 2 (1, 2, 4, 8 en partant de la droite), puis additionne celles qui
      sont sous un 1.
    etape: Le chiffre de gauche est sous le 8, le chiffre de droite est sous le 1. Continue avec les deux chiffres du milieu.
  pieges:
  - si:
      valeur: 11
    relance: As-tu commencé les puissances de 2 par la droite ? Le chiffre le plus à droite vaut 1.
  - si:
      valeur: 1101
    relance: 1101 est l'écriture binaire. Il faut la traduire en écriture décimale avec les puissances de 2.
  - si:
      valeur: 3
    relance: Tu as compté les 1. Mais chaque 1 n'a pas la même valeur selon sa place. Laquelle ?
  solution: 1101 = 1 × 8 + 1 × 4 + 0 × 2 + 1 × 1 = 8 + 4 + 0 + 1 = 13.
- id: taille-journal-meteo
  type: nombre
  difficulte: 2
  enonce: 'Document fictif. Une station météo du collège enregistre une mesure par minute, pendant une journée (24 h). Chaque
    mesure occupe 4 octets. Convention de cet énoncé : 1 ko = 1 000 octets. Quelle est la taille du fichier de la journée,
    en ko ? Réponds par un nombre.'
  reponse:
    valeur: 5.76
  indices:
    relance: Combien y a-t-il de minutes dans une journée ?
    methode: Calcule le nombre de mesures, multiplie par la taille d'une mesure pour avoir des octets, puis divise par 1 000
      pour avoir des ko.
    etape: '24 h × 60 min = 1 440 mesures. Chaque mesure occupe 4 octets : calcule le total en octets, puis convertis.'
  pieges:
  - si:
      valeur: 5.625
    relance: 'Tu as divisé par 1 024. Relis la convention annoncée dans l''énoncé : 1 ko vaut combien d''octets ici ?'
  - si:
      valeur: 5760
    relance: Ce nombre est en octets. La question demande des ko.
  - si:
      valeur: 46.08
    relance: As-tu multiplié par 8 ? La taille d'une mesure est déjà donnée en octets, pas besoin de passer en bits.
  - si:
      valeur: 0.096
    relance: Combien de minutes dure une journée ? Le fichier contient une mesure par minute, pas une par heure.
  solution: 24 × 60 = 1 440 mesures ; 1 440 × 4 = 5 760 octets ; 5 760 ÷ 1 000 = 5,76 ko.
- id: traitement-tableur
  type: choix
  difficulte: 1
  enonce: Dans un tableur, une table contient les relevés de température d'une serre (une ligne par heure). On veut afficher
    seulement les lignes où la température dépasse 30 °C, sans effacer les autres. Quel traitement utiliser ?
  reponse:
    options:
    - id: a
      texte: Un tri
    - id: b
      texte: Un filtre
    - id: c
      texte: Une somme
    - id: d
      texte: Supprimer les lignes à la main
    bonnes:
    - b
  indices:
    relance: Veut-on changer l'ordre des lignes, ou n'en voir qu'une partie ?
    methode: Rappelle-toi la différence entre trier, filtrer et calculer dans un tableur.
    etape: La consigne dit « afficher seulement » certaines lignes « sans effacer les autres ». Quel traitement cache des
      lignes selon une condition ?
  pieges:
  - si:
      contient:
      - a
    relance: Un tri range toutes les lignes dans un ordre, mais il les affiche toutes. Est-ce ce qu'on veut ?
  - si:
      contient:
      - d
    relance: La consigne demande de ne rien effacer. Quel traitement du tableur cache des lignes sans les supprimer ?
  - si:
      contient:
      - c
    relance: Une somme donne un seul nombre. Elle n'affiche pas les lignes choisies.
  solution: 'Un filtre (condition : température > 30 °C) n''affiche que les lignes qui la respectent ; les autres sont cachées,
    pas supprimées.'
- id: exploiter-releves-serre
  type: ouverte
  difficulte: 3
  enonce: Document fictif. Une table de tableur contient, pour chaque heure d'une journée, l'heure, la température (en °C)
    et l'état de l'arrosage (oui ou non). Décris, étape par étape, comment tu trouverais la température la plus haute de la
    journée et les heures où l'arrosage a fonctionné. Précise le type de chaque descripteur.
  criteres:
  - L'élève nomme les trois descripteurs et donne un type cohérent à chacun (heure, température décimale, arrosage booléen).
  - L'élève utilise un calcul adapté (maximum, ou un tri décroissant) pour trouver la température la plus haute.
  - L'élève utilise un filtre sur l'arrosage (valeur oui) pour obtenir les heures demandées.
  indices:
    relance: Quelles sont les colonnes de la table, et quel type de valeur contient chacune ?
    methode: 'Pour chaque question, choisis un traitement du tableur : calcul, filtre ou tri.'
    etape: 'Commence par la température : quel calcul du tableur donne la plus grande valeur d''une colonne ?'
  solution: 'Descripteurs : heure (heure ou texte), température (nombre décimal), arrosage (booléen oui/non). Pour la température
    la plus haute : fonction MAX sur la colonne température (ou tri décroissant puis lecture de la première ligne). Pour les
    heures d''arrosage : filtre sur la colonne arrosage avec la valeur « oui », puis lecture de la colonne heure.'
- id: bits-du-mot-robot
  type: nombre
  difficulte: 1
  enonce: Le mot « ROBOT » est écrit en ASCII étendu, un caractère par octet. Combien de bits occupe ce mot ?
  reponse:
    valeur: 40
    forme: entier
  indices:
    relance: Combien de caractères compte le mot, et combien de bits occupe un caractère ?
    methode: Nombre de caractères × 8 bits par octet.
    etape: Le mot a cinq lettres, chacune codée sur un octet. Multiplie ce nombre d'octets par le nombre de bits d'un octet.
  pieges:
  - si:
      valeur: 5
    relance: '5 est le nombre d''octets. La question demande des bits : combien de bits dans un octet ?'
  - si:
      valeur: 8
    relance: 8 bits, c'est un seul caractère. Combien y a-t-il de lettres dans le mot ?
  solution: 5 caractères = 5 octets ; 5 × 8 = 40 bits.
- id: decimal-vers-binaire
  type: nombre
  difficulte: 2
  enonce: Un capteur doit envoyer le nombre entier dix. Écris ce nombre en binaire (avec des 0 et des 1, sans espace).
  reponse:
    valeur: 1010
    forme: entier
  indices:
    relance: De quelles puissances de 2 le nombre dix est-il la somme ?
    methode: Cherche la plus grande puissance de 2 qui ne dépasse pas le nombre, retire-la, puis recommence avec le reste.
    etape: Les rangs valent, de droite à gauche, 1, 2, 4, 8. Mets 1 sous les rangs utilisés et 0 sous les autres.
  pieges:
  - si:
      valeur: 1101
    relance: 1101 est l'écriture binaire du nombre treize. Vérifie en additionnant les rangs sous les 1.
  - si:
      valeur: 1001
    relance: Additionne les rangs sous les 1 de ton écriture. Trouves-tu bien dix ?
  solution: '10 = 8 + 2. Rangs 8, 4, 2, 1 : 1, 0, 1, 0. Donc 1010. Vérification : 8 + 0 + 2 + 0 = 10.'
