format: 2
notion: structuration-traitement-donnees
version: 1
etat: verifiee
declencheurs:
- formule tableur
- cellule B3
- LibreOffice Calc
- Google Sheets
- graphique de données
- =SOMME
- =MOYENNE
prerequis: []
essentiel: 'Un tableur est un logiciel (comme Excel, Google Sheets ou LibreOffice Calc) qui organise des données dans un tableau
  composé de lignes et de colonnes ; chaque case s''appelle une cellule, repérée par une lettre (colonne) et un nombre (ligne),
  par exemple B3. Un tableur permet de saisir des données, de les trier, de les filtrer, de réaliser des calculs automatiques
  avec des formules (par exemple une somme ou une moyenne) et de créer des graphiques pour les visualiser.


  Une donnée numérique (un nombre) est traitée différemment d''une donnée textuelle : un tableur peut faire des calculs sur
  une colonne de nombres, mais pas sur du texte. Structurer des données, c''est les organiser de façon cohérente (une ligne
  = une observation, une colonne = une caractéristique) pour pouvoir les traiter automatiquement.


  Une base de données est un ensemble plus large et structuré de données, organisées en tables, que plusieurs programmes ou
  utilisateurs peuvent consulter et modifier (par exemple la base des élèves d''un établissement).'
methode:
- Pour organiser des données dans un tableur, mettre un intitulé clair en première ligne de chaque colonne, et une seule information
  par cellule.
- Pour calculer automatiquement, utiliser une formule (par exemple =SOMME(B2:B10) pour additionner une plage de cellules).
- Pour visualiser des données, choisir un type de graphique adapté (histogramme pour comparer des quantités, courbe pour une
  évolution dans le temps).
- Pour trier ou filtrer, s'assurer que chaque colonne contient bien le même type de donnée du début à la fin.
vocabulaire:
- terme: cellule
  definition: case d'un tableur repérée par une lettre de colonne et un numéro de ligne
- terme: formule
  definition: instruction de calcul automatique dans un tableur (commence souvent par le signe =)
- terme: base de données
  definition: ensemble structuré de données organisées en tables, consultable par plusieurs utilisateurs ou programmes
erreurs_frequentes:
- Mélanger du texte et des nombres dans une même colonne, ce qui empêche les calculs automatiques.
- Oublier le signe = au début d'une formule dans un tableur.
- Confondre tableur (logiciel de calcul en tableau) et base de données (structure de données plus large, souvent partagée).
- Choisir un graphique mal adapté aux données (par exemple un histogramme pour une évolution dans le temps, où une courbe
  serait plus lisible).
exemple:
  enonce: Un tableur contient les notes de dix élèves en colonne B (de B2 à B11). Écrire la formule permettant de calculer
    la moyenne de la classe.
  solution: =MOYENNE(B2:B11)
exercices:
- id: formule-somme-distances
  type: texte_court
  difficulte: 1
  enonce: Dans un tableur, la cellule A1 contient « Distance (km) » et les cellules A2 à A6 contiennent des distances. Écrire
    la formule pour additionner ces distances dans la cellule A8.
  reponse:
    acceptees:
    - =SOMME(A2:A6)
    - SOMME(A2:A6)
    fautes_tolerees: 1
  indices:
    relance: Une formule de tableur commence toujours par le signe égal, suivi du nom de la fonction.
    methode: La fonction qui additionne une plage de cellules s'écrit avec le nom de l'opération suivi de la plage entre parenthèses.
    etape: La plage à additionner va de la cellule A2 à la cellule A6.
  pieges:
  - si:
      valeur: =MOYENNE(A2:A6)
    relance: Cette fonction calcule une moyenne, pas une somme. Il faut une autre fonction pour additionner.
  solution: =SOMME(A2:A6)
- id: colonne-texte-et-nombres
  type: choix
  difficulte: 2
  enonce: Une colonne d'un tableur contient à la fois des nombres et le texte « en cours ». Que se passe-t-il si on essaie
    de calculer la somme de cette colonne ?
  reponse:
    options:
    - id: a
      texte: Le tableur additionne seulement les nombres, en ignorant le texte
    - id: b
      texte: Le tableur additionne le texte comme s'il valait zéro à chaque fois qu'il apparaît
    - id: c
      texte: Le tableur refuse tout calcul et affiche systématiquement une erreur bloquante
    bonnes:
    - a
  indices:
    relance: Un tableur ne peut effectuer des calculs que sur des valeurs numériques.
    methode: Pense à ce qu'un tableur peut ou ne peut pas additionner dans une plage de cellules.
    etape: Le texte « en cours » n'est pas un nombre, il ne peut donc pas être additionné.
  pieges:
  - si:
      contient:
      - b
    relance: Le texte n'est pas compté comme un zéro, il est simplement ignoré dans le calcul de la somme.
  - si:
      contient:
      - c
    relance: Une somme (=SOMME) peut généralement s'exécuter et ignorer les cellules non numériques, sans forcément afficher
      une erreur bloquante.
  solution: 'Un tableur ne peut additionner que des valeurs numériques : une cellule contenant du texte est ignorée dans le
    calcul, la colonne devrait donc contenir un seul type de donnée pour rester fiable.'
- id: type-graphique-adapte
  type: association
  difficulte: 2
  enonce: Associe chaque situation au type de graphique le plus adapté pour la représenter.
  reponse:
    gauche:
    - id: a
      texte: Comparer les notes de plusieurs élèves à un même devoir
    - id: b
      texte: Suivre l'évolution de la température d'une pièce heure par heure
    droite:
    - id: x
      texte: Histogramme
    - id: y
      texte: Courbe
    paires:
      a: x
      b: y
  indices:
    relance: L'un des deux graphiques compare des quantités séparées, l'autre montre une évolution continue dans le temps.
    methode: Une évolution dans le temps se lit mieux avec des points reliés qu'avec des barres séparées.
    etape: Comparer des notes d'élèves différents revient à comparer des quantités indépendantes les unes des autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Redemande-toi si la situation compare des quantités séparées ou suit une évolution
      continue.
  - si:
      diagnostic: associations_fausses
    relance: 'Repère d''abord la situation qui suit un phénomène dans le temps, heure par heure : elle correspond à la courbe.'
  solution: 'Comparer les notes de plusieurs élèves : histogramme (quantités séparées). Suivre une évolution dans le temps
    : courbe (évolution continue).'
