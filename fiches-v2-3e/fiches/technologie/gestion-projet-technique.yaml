format: 2
notion: gestion-projet-technique
version: 1
etat: verifiee
declencheurs:
- diagramme de Gantt
- répartir les rôles
- date intermédiaire
- avancement du projet
- respecter les délais
- maquette maison connectée
prerequis: []
essentiel: 'La gestion de projet est l''ensemble des activités qui organisent le déroulement d''un projet pour atteindre ses
  objectifs dans les délais et avec les moyens prévus. Un projet a un début et une fin définis, et vise un résultat unique
  (un objet, un prototype, un document).


  Gérer un projet technique en groupe demande de définir les tâches à réaliser, de les répartir entre les membres de l''équipe
  selon leurs compétences ou leur temps disponible, de fixer des jalons (étapes intermédiaires avec une date), et de suivre
  l''avancement pour ajuster si nécessaire. Une revue de projet est un moment où le groupe fait le point sur l''avancement,
  compare les résultats aux objectifs et décide des ajustements à apporter.


  Un planning (souvent représenté par un diagramme) permet de visualiser les tâches, leur durée et leur ordre. Certaines tâches
  doivent être terminées avant que d''autres ne commencent (dépendances). L''écoconception consiste à intégrer dès la conception
  du projet des critères qui limitent son impact environnemental.'
methode:
- Lister toutes les tâches nécessaires pour réaliser le projet.
- Identifier les dépendances entre tâches (quelle tâche doit être finie avant qu'une autre commence).
- Répartir les tâches entre les membres du groupe selon leurs compétences et le temps disponible.
- Fixer des jalons (dates intermédiaires) pour organiser des revues de projet et vérifier régulièrement l'avancement.
vocabulaire:
- terme: jalon
  definition: étape intermédiaire d'un projet, associée à une date, qui permet de vérifier l'avancement
- terme: revue de projet
  definition: moment où le groupe fait le point sur l'avancement du projet et décide des ajustements nécessaires
- terme: écoconception
  definition: démarche qui intègre dès la conception des critères limitant l'impact environnemental d'un projet
erreurs_frequentes:
- Ne pas identifier les dépendances entre tâches, ce qui bloque le déroulement du projet.
- Répartir les tâches sans tenir compte des compétences ou du temps disponible de chacun.
- Ne fixer aucun jalon intermédiaire, ce qui empêche de repérer un retard avant la fin du projet.
exemple:
  enonce: Un groupe doit fabriquer une maquette de maison connectée en 4 séances. Proposer une répartition simple des grandes
    tâches sur ces séances.
  solution: 'Séance 1 : cahier des charges et répartition des rôles (jalon 1). Séance 2 : conception numérique de la maquette.
    Séance 3 : fabrication et câblage des capteurs et actionneurs (jalon 2). Séance 4 : programmation, tests et présentation
    finale (jalon 3).'
exercices:
- id: role-jalon
  type: choix
  difficulte: 1
  enonce: À quoi sert un jalon dans un projet ?
  reponse:
    options:
    - id: a
      texte: À marquer une étape intermédiaire, avec une date, pour vérifier l'avancement
    - id: b
      texte: À répartir les tâches entre les membres du groupe
    - id: c
      texte: À choisir le matériau utilisé pour fabriquer le prototype
    bonnes:
    - a
  indices:
    relance: Pense à un point de contrôle intermédiaire dans le calendrier d'un projet.
    methode: Un jalon a toujours une date associée, contrairement à une simple tâche.
    etape: Il permet de vérifier régulièrement où en est le groupe par rapport à ses objectifs.
  pieges:
  - si:
      contient:
      - b
    relance: Répartir les tâches est une activité de gestion de projet, mais ce n'est pas le rôle spécifique d'un jalon.
  - si:
      contient:
      - c
    relance: Le choix du matériau concerne la conception technique de l'objet, pas la gestion du projet.
  solution: Un jalon est une étape intermédiaire, associée à une date, qui permet de vérifier régulièrement l'avancement du
    projet par rapport aux objectifs.
- id: nom-lien-taches
  type: texte_court
  difficulte: 1
  enonce: Dans un projet, la tâche « peindre la pièce » ne peut commencer qu'après la tâche « assembler la pièce ». Comment
    appelle-t-on ce lien entre les deux tâches ?
  reponse:
    acceptees:
    - dependance
    - dépendance
    fautes_tolerees: 1
  indices:
    relance: Ce lien signifie qu'une tâche a besoin qu'une autre soit terminée avant de commencer.
    methode: Le mot cherché commence par « dép... » et évoque le fait de « dépendre » de quelque chose.
    etape: On dit que « peindre » dépend de la fin de « assembler ».
  pieges:
  - si:
      valeur: jalon
    relance: Un jalon est une étape avec une date, pas un lien entre deux tâches qui s'enchaînent.
  solution: 'C''est une dépendance : la tâche « peindre » dépend de la fin de la tâche « assembler ».'
- id: pourquoi-repartir-competences
  type: choix
  difficulte: 2
  enonce: Pourquoi faut-il répartir les tâches d'un projet en tenant compte des compétences et du temps disponible de chaque
    membre du groupe ?
  reponse:
    options:
    - id: a
      texte: Pour que chaque tâche soit réalisée efficacement, sans surcharger une seule personne
    - id: b
      texte: Pour que tout le monde fasse exactement la même tâche en même temps
    - id: c
      texte: Pour éviter d'avoir à fixer des jalons dans le projet
    bonnes:
    - a
  indices:
    relance: Que se passe-t-il si une seule personne du groupe fait toutes les tâches difficiles ?
    methode: Pense à l'efficacité du groupe et à l'équilibre de la charge de travail entre ses membres.
    etape: Une bonne répartition évite qu'une personne soit débordée pendant qu'une autre n'a rien à faire.
  pieges:
  - si:
      contient:
      - b
    relance: Faire exactement la même tâche en même temps n'est pas une répartition, c'est une absence de répartition.
  - si:
      contient:
      - c
    relance: 'Les jalons restent nécessaires même avec une bonne répartition des tâches : ce sont deux activités différentes
      de la gestion de projet.'
  solution: Répartir les tâches selon les compétences et le temps disponible permet une réalisation efficace du projet, sans
    surcharger une seule personne du groupe.
- id: associer-notions-projet
  type: association
  difficulte: 2
  enonce: Relie chaque notion de gestion de projet à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Jalon
    - id: b
      texte: Dépendance
    - id: c
      texte: Écoconception
    droite:
    - id: x
      texte: Étape intermédiaire associée à une date pour vérifier l'avancement
    - id: y
      texte: Lien entre deux tâches, l'une devant être finie avant que l'autre commence
    - id: z
      texte: Démarche qui limite l'impact environnemental dès la conception
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une de ces notions concerne le temps, une autre l'enchaînement des tâches, la dernière l'environnement.
    methode: Repère d'abord le jalon, qui est toujours associé à une date précise.
    etape: La dépendance relie deux tâches, l'écoconception concerne l'impact environnemental.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la définition qui parle de date, puis les deux autres.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le jalon (date), puis distingue dépendance et écoconception.
  solution: 'Jalon : étape intermédiaire avec une date. Dépendance : lien entre deux tâches. Écoconception : démarche limitant
    l''impact environnemental dès la conception.'
- id: etapes-gestion-projet
  type: ordre
  difficulte: 2
  enonce: Range ces étapes de la méthode pour gérer un projet technique en groupe.
  reponse:
    elements:
    - id: lister
      texte: Lister toutes les tâches nécessaires pour réaliser le projet
    - id: identifier
      texte: Identifier les dépendances entre les tâches
    - id: repartir
      texte: Répartir les tâches entre les membres du groupe
    - id: fixer
      texte: Fixer des jalons pour suivre l'avancement
  indices:
    relance: Peut-on répartir des tâches qui n'ont pas encore été listées ?
    methode: On liste d'abord les tâches, puis on identifie leurs dépendances, puis on les répartit, puis on fixe des jalons.
    etape: La toute première étape consiste toujours à lister l'ensemble des tâches du projet.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux doit être faite avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la première étape (lister) et la dernière (fixer des jalons), puis range les deux autres.
  solution: On liste d'abord toutes les tâches, puis on identifie leurs dépendances, puis on répartit les tâches entre les
    membres du groupe, et enfin on fixe des jalons pour suivre l'avancement.
- id: proposer-planning-projet
  type: ouverte
  difficulte: 3
  enonce: Un groupe de 3 élèves doit fabriquer un porte-clés imprimé en 3D en 3 séances de technologie. Propose une répartition
    des tâches et des jalons, en citant au moins trois éléments de ta méthode de gestion de projet.
  criteres:
  - L'élève liste au moins trois tâches nécessaires au projet.
  - L'élève propose une répartition des tâches entre les membres du groupe.
  - L'élève identifie au moins une dépendance entre deux tâches.
  - L'élève fixe au moins un jalon avec une date ou une séance précise.
  indices:
    relance: Quelle tâche doit obligatoirement être terminée avant de lancer l'impression du porte-clés ?
    methode: 'Reprends la méthode de la fiche : lister les tâches, identifier les dépendances, répartir, fixer des jalons.'
    etape: 'Tu peux commencer ainsi : « Séance 1, on liste les tâches et on modélise... ».'
  solution: 'Séance 1 : modéliser le porte-clés en CAO (tâche répartie à un élève) et rédiger le cahier des charges (jalon
    1). Séance 2 : lancer l''impression 3D, qui dépend de la fin de la modélisation (tâche répartie à un deuxième élève).
    Séance 3 : finitions et préparation de la présentation (tâche répartie au troisième élève), avec un jalon final de présentation
    du projet terminé.'
