# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: gestion-projet-technique
version: 2
etat: verifiee
declencheurs:
- diagramme de Gantt
- planning des tâches
- revue de projet
- tâches en parallèle
- durée minimale du projet
- antériorité des tâches
- dépendances entre les tâches
- quelle tâche avant quelle tâche
- objet démontable pour le réparer
prerequis:
- 4e-organiser-processus-conception
- choix-ost-developpement-durable
essentiel: 'Un projet technique se mène par étapes : exprimer le besoin, rédiger le cahier des charges, chercher des solutions
  et en choisir une, fabriquer un prototype, le tester, puis présenter le travail.


  Un processus de conception et de réalisation se déroule dans une durée donnée. Il faut donc lister les tâches, estimer la
  durée de chacune, savoir qui les fait et dans quel ordre.


  Le diagramme de planification des tâches (souvent un diagramme de Gantt) place chaque tâche dans le temps : sa durée, son
  début, son responsable. Chaque tâche a des antériorités : les tâches à finir avant elle. Certaines tâches se suivent. D''autres
  se font en parallèle, par des élèves différents.


  La durée minimale du projet est la durée du plus long enchaînement de tâches, pas la somme de toutes les durées.


  Exemple : A dure 2 séances, puis B (3 séances) et C (1 séance) en parallèle, puis D (2 séances). Durée minimale : 2 + 3
  + 2 = 7 séances, car C se fait pendant B.


  Une revue de projet est un moment prévu dans le planning où l''équipe fait le point : ce qui est fait, ce qui est en retard,
  ce qui respecte ou non le cahier des charges. Elle décide des ajustements. Il y en a plusieurs au cours du projet, pas seulement
  à la fin.


  L''écoconception consiste à penser à l''environnement dès la conception, sur tout le cycle de vie de l''objet : matières
  premières, fabrication, transport, utilisation, fin de vie. Exemples de choix : moins de matière, matériaux recyclables
  ou de récupération, faible consommation d''énergie, assemblage démontable et réparable.


  Au brevet, on attend : ordonner les étapes, lire un planning et calculer la durée minimale, dire le rôle d''une revue de
  projet, et justifier un choix par l''écoconception.

  '
methode:
- Lister les tâches du projet et estimer la durée de chacune.
- Pour chaque tâche, noter celles qui doivent être finies avant qu'elle commence.
- Placer les tâches sur le diagramme, en mettant en parallèle celles qui peuvent l'être.
- Suivre le plus long enchaînement de tâches pour trouver la durée totale du projet.
- Prévoir des revues de projet pour comparer l'avancement au planning et au cahier des charges.
- À chaque choix, se demander quel est son impact sur tout le cycle de vie de l'objet.
vocabulaire:
- terme: cahier des charges
  definition: Document qui liste les fonctions de l'objet et les critères à respecter.
- terme: tâche
  definition: Travail précis à faire dans un projet, avec une durée.
- terme: diagramme de Gantt
  definition: Diagramme qui place chaque tâche dans le temps.
- terme: antériorité
  definition: Tâche qui doit être finie avant qu'une autre puisse commencer.
- terme: tâches en parallèle
  definition: Tâches faites en même temps par des personnes différentes.
- terme: revue de projet
  definition: Moment prévu où l'équipe fait le point et décide des ajustements.
- terme: écoconception
  definition: Démarche qui réduit l'impact sur l'environnement dès la conception.
- terme: prototype
  definition: Premier exemplaire d'un objet, fabriqué pour le tester.
erreurs_frequentes:
- Additionner toutes les durées alors que certaines tâches se font en même temps.
- Commencer à fabriquer avant d'avoir rédigé le cahier des charges et choisi une solution.
- Croire que la revue de projet n'a lieu qu'à la fin ; elle se fait aussi en cours de projet.
- Réduire l'écoconception au recyclage, en oubliant la fabrication, le transport et l'utilisation.
- 'Oublier de tenir compte des antériorités : une tâche ne peut pas commencer avant la fin de celles dont elle dépend.'
exemple:
  enonce: Un groupe doit fabriquer un distributeur de croquettes. Tâche A (2 séances), puis tâches B (3 séances) et C (1 séance)
    en parallèle, puis tâche D (2 séances) quand B et C sont finies. Quelle est la durée minimale du projet ?
  solution: B et C commencent ensemble ; B finit plus tard. La durée est donc 2 + 3 + 2 = 7 séances (et non 2 + 3 + 1 + 2
    = 8).
exercices:
- id: ordre-etapes-station-meteo
  type: ordre
  difficulte: 1
  enonce: Ton groupe réalise une station météo connectée pour la cour du collège. Range ces étapes du projet dans l'ordre.
  reponse:
    elements:
    - id: besoin
      texte: Exprimer le besoin
    - id: cahier
      texte: Rédiger le cahier des charges
    - id: solutions
      texte: Chercher des solutions et en choisir une
    - id: fabriquer
      texte: Fabriquer et assembler le prototype
    - id: tester
      texte: Tester le prototype
    - id: presenter
      texte: Présenter le projet à la classe
  indices:
    relance: Peut-on choisir une solution avant de savoir exactement ce que l'objet doit faire ?
    methode: Cherche d'abord l'étape qui ne dépend d'aucune autre, puis demande-toi à chaque fois ce qu'il faut avoir fini
      avant.
    etape: Le projet part toujours d'un besoin. Quelle étape transforme ce besoin en critères précis à respecter ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont échangées. Pour chacune, demande-toi ce qu'il faut avoir terminé avant de
      la commencer.
  - si:
      diagnostic: ordre_faux
    relance: 'Plusieurs étapes sont mal placées. Rappel : on ne fabrique qu''une solution déjà choisie, et on ne teste qu''un
      objet déjà fabriqué.'
  solution: Besoin, puis cahier des charges, puis recherche et choix d'une solution, puis fabrication du prototype, puis tests,
    puis présentation.
- id: duree-minimale-planning
  type: nombre
  difficulte: 2
  enonce: Planning de la station météo (1 séance = 1 heure de technologie). A, cahier des charges, 1 séance, au début. B,
    recherche de solutions, 2 séances, après A. C, modélisation 3D du boîtier, 3 séances, après B. D, programmation de la
    carte, 4 séances, après B, en même temps que C (par d'autres élèves). E, assemblage et tests, 2 séances, quand C et D
    sont toutes les deux finies. Combien de séances faut-il au minimum pour finir le projet ?
  reponse:
    valeur: 9
    forme: entier
  indices:
    relance: Les tâches C et D se font-elles l'une après l'autre ou en même temps ?
    methode: Suis les tâches dans le temps. Quand deux tâches se font en parallèle, la suivante attend celle qui finit la
      plus tard.
    etape: 'A et B occupent les 3 premières séances. Ensuite, C et D démarrent ensemble : laquelle finit la plus tard ? Ajoute
      enfin la durée de E.'
  pieges:
  - si:
      valeur: 12
    relance: Tu as additionné toutes les durées. Mais C et D se font en même temps, par des élèves différents. Faut-il vraiment
      compter les deux ?
  - si:
      valeur: 8
    relance: Tu as suivi la tâche C. Mais E ne peut commencer que quand C et D sont toutes les deux finies. Laquelle des deux
      dure le plus ?
  - si:
      diagnostic: valeur_fausse
    relance: Dessine les barres des tâches sur une ligne du temps, séance par séance, et regarde où finit la dernière.
  solution: 'A et B se suivent (1 + 2 = 3 séances). C et D commencent ensemble ; D dure plus longtemps (4 séances contre 3),
    donc E attend la fin de D. Durée minimale : 1 + 2 + 4 + 2 = 9 séances.'
- id: outils-gestion-projet
  type: association
  difficulte: 2
  enonce: Associe chaque outil de gestion de projet à ce à quoi il sert.
  reponse:
    gauche:
    - id: gantt
      texte: Diagramme de Gantt
    - id: cdc
      texte: Cahier des charges
    - id: revue
      texte: Revue de projet
    - id: cao
      texte: Logiciel de modélisation 3D
    droite:
    - id: temps
      texte: Placer les tâches dans le temps et voir qui fait quoi
    - id: criteres
      texte: Lister ce que l'objet doit faire et les critères à respecter
    - id: bilan
      texte: Faire le point sur l'avancement et décider des ajustements
    - id: volume
      texte: Dessiner les pièces en volume avant de les fabriquer
    paires:
      gantt: temps
      cdc: criteres
      revue: bilan
      cao: volume
  indices:
    relance: Lequel de ces outils est un planning ?
    methode: Commence par les associations dont tu es sûr, puis fais les autres par élimination.
    etape: Le cahier des charges est écrit au début du projet, avant toute solution. Qu'est-ce qu'on y écrit ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle sert à dessiner, et laquelle sert à faire un bilan ?
  - si:
      diagnostic: associations_fausses
    relance: Reprends outil par outil. Le mot « revue » veut dire qu'on revoit ce qui a été fait.
  solution: 'Diagramme de Gantt : placer les tâches dans le temps. Cahier des charges : lister ce que l''objet doit faire
    et les critères. Revue de projet : faire le point et décider des ajustements. Logiciel de modélisation 3D : dessiner les
    pièces en volume.'
- id: role-revue-de-projet
  type: choix
  difficulte: 2
  enonce: À la séance 5, l'équipe de la station météo fait une revue de projet. Que fait-elle pendant cette revue ? Plusieurs
    réponses possibles.
  reponse:
    options:
    - id: a
      texte: Elle compare ce qui est fait avec le planning prévu
    - id: b
      texte: Elle vérifie que les solutions respectent le cahier des charges
    - id: c
      texte: Elle décide des ajustements si elle est en retard
    - id: d
      texte: Elle fabrique les pièces du prototype
    - id: e
      texte: Elle attend la fin du projet pour tout vérifier d'un coup
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Le mot « revue » veut dire « revoir ». Qu'est-ce qu'on revoit, à ce moment du projet ?
    methode: Pour chaque phrase, demande-toi si c'est un bilan (faire le point) ou une tâche de réalisation.
    etape: Fabriquer des pièces est une tâche du planning, pas un bilan. Examine les autres phrases de la même façon.
  pieges:
  - si:
      contient:
      - d
    relance: Fabriquer des pièces, c'est réaliser le projet. Pendant une revue, est-ce qu'on produit, ou est-ce qu'on fait
      le point ?
  - si:
      contient:
      - e
    relance: La revue a lieu à la séance 5, en plein projet. À quoi sert-il de faire le point avant la fin ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé, mais pas toutes. Relis chaque phrase qui parle de comparer, vérifier ou décider.
  solution: 'Pendant une revue de projet, l''équipe compare l''avancement au planning, vérifie le respect du cahier des charges
    et décide des ajustements. Elle ne fabrique pas, et elle n''attend pas la fin : on en fait plusieurs pendant le projet.'
- id: ecoconception-boitier
  type: choix
  difficulte: 2
  enonce: Pour le boîtier de la station météo, quels choix relèvent de l'écoconception ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: Utiliser moins de matière, tant que le boîtier reste assez solide
    - id: b
      texte: Assembler par des vis plutôt que par de la colle, pour pouvoir démonter et réparer
    - id: c
      texte: Choisir la couleur préférée de l'équipe
    - id: d
      texte: Ajouter un écran allumé en permanence, même quand personne ne le regarde
    bonnes:
    - a
    - b
  indices:
    relance: Quel choix a un effet sur l'environnement pendant la fabrication, l'utilisation ou la fin de vie du boîtier ?
    methode: Pour chaque choix, cherche s'il réduit la matière, l'énergie consommée ou les déchets.
    etape: Un écran allumé en permanence consomme de l'énergie pendant toute l'utilisation. Est-ce que cela réduit l'impact
      ?
  pieges:
  - si:
      contient:
      - d
    relance: Un écran toujours allumé consomme de l'énergie même quand il ne sert à rien. Cela réduit-il ou augmente-t-il
      l'impact ?
  - si:
      contient:
      - c
    relance: La couleur préférée change-t-elle la quantité de matière, d'énergie ou de déchets ?
  - si:
      diagnostic: incomplet
    relance: Il en manque. Pense aussi à la fin de vie de l'objet et à sa réparation.
  solution: Moins de matière (fabrication) et un assemblage démontable (réparation, tri en fin de vie) relèvent de l'écoconception.
    La couleur n'a pas d'effet ici, et un écran toujours allumé augmente la consommation d'énergie.
- id: justifier-choix-boitier
  type: ouverte
  difficulte: 3
  enonce: 'Cahier des charges du boîtier de la station météo : protéger la carte de la pluie ; pouvoir être ouvert pour changer
    une pièce ; limiter l''impact sur l''environnement. Solution A : boîtier en plastique neuf, collé, impossible à ouvrir.
    Solution B : boîtier en chutes de contreplaqué traité pour l''extérieur, assemblé par des vis. Choisis une solution et
    justifie ton choix à l''aide du cahier des charges.'
  criteres:
  - L'élève compare les deux solutions critère par critère (pluie, ouverture, environnement).
  - L'élève s'appuie sur l'écoconception (réutilisation de chutes, assemblage démontable, réparation).
  - L'élève conclut par un choix cohérent avec ses arguments.
  indices:
    relance: Quels sont les trois critères du cahier des charges ? Les deux solutions les respectent-elles tous ?
    methode: Fais un petit tableau avec les critères en lignes et les solutions en colonnes, et note oui ou non dans chaque
      case.
    etape: 'Commence par le critère « pouvoir être ouvert » : un boîtier collé peut-il être ouvert sans être cassé ?'
  solution: 'Les deux boîtiers protègent de la pluie. Mais A est collé : on ne peut pas l''ouvrir pour réparer, et il utilise
    du plastique neuf. B réutilise des chutes (moins de matière neuve) et ses vis permettent de l''ouvrir et de le réparer.
    B respecte donc mieux le cahier des charges.'
- id: duree-somme-ou-chemin
  type: nombre
  difficulte: 2
  enonce: Planning d'un distributeur de croquettes (1 séance = 1 heure). Tâche P, plans, 2 séances, au début. Puis Q, modélisation,
    4 séances, et R, programmation, 3 séances, en parallèle. Puis S, tests, 1 séance, quand Q et R sont finies. Quelle est
    la durée minimale du projet, en séances ?
  reponse:
    valeur: 7
    forme: entier
  indices:
    relance: Quelles tâches se font en même temps, et laquelle finit la dernière ?
    methode: 'Durée minimale = plus long enchaînement : tâche de départ + la plus longue des tâches parallèles + tâche finale.'
    etape: 'Après P, compare Q et R : garde la plus longue seulement. Ajoute S.'
  pieges:
  - si:
      valeur: 10
    relance: 'Tu as additionné toutes les tâches. Q et R se font en même temps : garde-t-on les deux durées ?'
  - si:
      valeur: 6
    relance: Tu as pris la tâche R au lieu de la plus longue des deux tâches parallèles.
  solution: 'P (2) puis Q (4), la plus longue des deux tâches parallèles, puis S (1) : 2 + 4 + 1 = 7 séances (et non 2 + 4
    + 3 + 1 = 10).'
- id: gantt-vocabulaire
  type: association
  difficulte: 1
  enonce: Associe chaque expression au sens qu'elle a dans un planning de projet.
  reponse:
    gauche:
    - id: anteriorite
      texte: Antériorité d'une tâche
    - id: parallele
      texte: Tâches en parallèle
    - id: duree
      texte: Durée minimale du projet
    - id: revue
      texte: Revue de projet
    droite:
    - id: avant
      texte: Tâche qui doit être finie avant que celle-ci commence
    - id: meme-temps
      texte: Tâches réalisées en même temps
    - id: chemin
      texte: Durée du plus long enchaînement de tâches
    - id: point
      texte: Moment où l'équipe fait le point sur l'avancement
    paires:
      anteriorite: avant
      parallele: meme-temps
      duree: chemin
      revue: point
  indices:
    relance: Pour chaque expression, imagine une situation concrète dans ton projet.
    methode: 'Antériorité : ce qui vient avant. Parallèle : en même temps. Durée minimale : le plus long chemin. Revue : le
      point d''étape.'
    etape: 'Commence par l''expression qui parle de temps qui passe : quelle définition parle du plus long enchaînement ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la définition de chaque terme.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Reprends les termes un par un.
  solution: 'Antériorité : tâche à finir avant. Parallèle : en même temps. Durée minimale : plus long enchaînement. Revue
    : point d''avancement.'
- id: nblm-comment-chaque-tache-est-elle-represente-1
  type: choix
  difficulte: 2
  enonce: Comment chaque tâche est-elle représentée sur un diagramme de Gantt ?
  reponse:
    options:
    - id: o1
      texte: Par une barre horizontale placée dans le temps
    - id: o2
      texte: Par une case dans un tableau à deux colonnes
    - id: o3
      texte: Par un cercle relié par des flèches de flux
    - id: o4
      texte: Par une vue en 3D du prototype de l'objet
    bonnes:
    - o1
  indices:
    relance: Pense à la forme graphique usuelle permettant de visualiser le début, la durée et la fin d'une étape sur un calendrier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : confondre le diagramme visuel de planification avec un simple tableau d''inventaire ou une
      liste de tâches.'
  - si:
      contient:
      - o3
    relance: 'Erreur : ceci correspond à la représentation d''un schéma fonctionnel ou d''un réseau d''informations, pas à
      un diagramme de Gantt.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la représentation 3D concerne la modélisation CAO du produit et non le suivi temporel du projet.'
  solution: Par une barre horizontale placée dans le temps. C'est exact. Le diagramme de Gantt est un planning où chaque tâche
    est matérialisée par une barre horizontale indiquant sa durée et son placement temporel.
- id: nblm-comment-se-calcule-la-duree-minimale-tot-2
  type: choix
  difficulte: 2
  enonce: Comment se calcule la durée minimale totale d'un projet technique ?
  reponse:
    options:
    - id: o1
      texte: En suivant la durée de l'enchaînement de tâches le plus long
    - id: o2
      texte: En additionnant la durée de toutes les tâches du projet
    - id: o3
      texte: En retenant uniquement la durée de la dernière tâche
    - id: o4
      texte: En divisant la somme des durées par le nombre d'élèves du groupe
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'impact des tâches réalisées simultanément sur le temps total de réalisation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : additionner toutes les durées oublie que plusieurs tâches peuvent être menées simultanément
      par différents élèves.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la dernière étape ne prend pas en compte le temps nécessaire à la réalisation de toutes les étapes
      préalables.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la durée minimale dépend de la logique d''enchaînement des tâches et non d''un calcul de moyenne d''équipe.'
  solution: En suivant la durée de l'enchaînement de tâches le plus long. C'est exact. La durée globale minimale dépend du
    cheminement le plus long entre les tâches qui se succèdent et se superposent.
- id: nblm-quel-est-le-role-principal-d-une-revue-d-3
  type: choix
  difficulte: 2
  enonce: Quel est le rôle principal d'une revue de projet ?
  reponse:
    options:
    - id: o1
      texte: Faire le point sur l'avancement, repérer les retards et décider des ajustements
    - id: o2
      texte: Rédiger le cahier des charges pour la première fois
    - id: o3
      texte: Vendre l'objet technique aux clients de l'entreprise
    - id: o4
      texte: Évaluer et noter individuellement chaque élève du groupe
    bonnes:
    - o1
  indices:
    relance: Recherche l'action faite par l'équipe en cours de parcours pour s'assurer du respect des objectifs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : le cahier des charges est élaboré au tout début du projet, bien avant les réunions de suivi et de bilan.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la revue de projet est un outil de suivi interne à l''équipe de conception, pas une transaction commerciale.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la revue de projet est un temps de travail collaboratif pour piloter le projet, pas une session de
      notation.'
  solution: Faire le point sur l'avancement, repérer les retards et décider des ajustements. C'est exact. La revue de projet
    est un temps d'arrêt planifié pour comparer l'avancement réel au planning et au cahier des charges afin de corriger le
    tir.
- id: nblm-que-signifie-la-contrainte-d-anteriorite-4
  type: choix
  difficulte: 2
  enonce: Que signifie la contrainte d'antériorité entre deux tâches dans un planning ?
  reponse:
    options:
    - id: o1
      texte: Une tâche doit être terminée avant qu'une autre ne puisse commencer
    - id: o2
      texte: Les deux tâches doivent obligatoirement se faire en même temps
    - id: o3
      texte: La deuxième tâche doit être plus longue que la première
    - id: o4
      texte: La première tâche est optionnelle et peut être annulée
    bonnes:
    - o1
  indices:
    relance: Pense à la dépendance obligatoire entre une étape préparatoire et l'étape qui la suit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : lorsque deux tâches se font en même temps, on dit qu''elles sont réalisées en parallèle, pas qu''il
      y a antériorité.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la durée d''une tâche dépend du travail requis et n''a pas de lien direct avec son ordre chronologique.'
  - si:
