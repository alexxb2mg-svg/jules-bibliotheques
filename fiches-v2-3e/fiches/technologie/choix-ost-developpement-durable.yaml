# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: choix-ost-developpement-durable
version: 2
etat: verifiee
declencheurs:
- étiquette énergie
- trois piliers
- fin de vie d'un objet
- facile à réparer
- poubelle barrée
- kg équivalent CO2
- impact environnemental d'un objet
- objet durable ou jetable
prerequis:
- 4e-approche-mei-environnement
essentiel: 'Le cycle de vie d''un objet technique a cinq grandes étapes : extraction des matières premières, fabrication,
  transport et distribution, utilisation, fin de vie (réemploi, recyclage ou élimination). Les choix des concepteurs (matériaux,
  source et forme d''énergie, traitement de l''information) agissent sur chaque étape : un boîtier collé rend la réparation
  difficile, une batterie demande l''extraction de métaux, un appareil qui consomme beaucoup pèse surtout pendant l''utilisation.


  Un objet a des impacts sur l''air (gaz à effet de serre, fumées), l''eau (pollution, consommation), le sol (mines, déchets)
  et la santé (substances dangereuses, bruit). Le bilan carbone mesure les gaz à effet de serre émis sur tout le cycle de
  vie, en kg équivalent CO2 (kg CO2e). Pour comparer deux objets qui répondent au même besoin, on additionne les émissions
  de chaque étape sur la même durée d''utilisation : fabrication + (émissions par an × nombre d''années).


  Le développement durable repose sur trois piliers :

  - environnemental : préserver la nature et les ressources ;

  - social : santé, conditions de travail, accès pour tous ;

  - économique : coût raisonnable à l''achat et à l''usage, activité et emplois.


  Aides au choix :

  - la notice technique : caractéristiques, consignes de sécurité, utilisation, entretien, fin de vie ;

  - l''étiquette énergie : classes de A (la plus économe) à G, pour la consommation ;

  - l''indice de réparabilité : note sur 10 affichée en France sur certains appareils (documentation, démontage, pièces détachées
  et leur prix) ;

  - le logo de la poubelle barrée : l''objet ne se jette pas avec les ordures ménagères, on le rapporte dans un point de collecte.


  Critères de choix : qualité, efficacité énergétique, durabilité, recyclabilité, prix. Un objet plus cher à l''achat peut
  coûter moins cher au total s''il consomme moins, dure plus longtemps et se répare.


  Au brevet : comparer deux objets avec des calculs, puis arrêter un choix argumenté avec le cycle de vie et les trois piliers.

  '
methode:
- Identifier le besoin et les objets qui y répondent, puis rassembler leurs informations (notice, étiquette énergie, indice
  de réparabilité).
- Pour chaque objet, repérer les matériaux, l'énergie utilisée et les étapes du cycle de vie les plus concernées.
- Comparer avec des nombres quand c'est possible (consommation, bilan carbone sur la même durée), sinon avec des critères
  qualitatifs.
- Arrêter un choix et l'argumenter avec les trois piliers du développement durable.
- 'Ne pas oublier le coût total : prix d''achat + coût de l''énergie consommée pendant la durée d''utilisation.'
vocabulaire:
- terme: Cycle de vie
  definition: Toutes les étapes de la vie d'un objet, de l'extraction des matières premières à sa fin de vie.
- terme: Bilan carbone
  definition: Quantité de gaz à effet de serre émise sur le cycle de vie, en kg équivalent CO2.
- terme: Indice de réparabilité
  definition: Note sur 10 qui indique si un appareil est facile à réparer.
- terme: Recyclabilité
  definition: Capacité des matériaux d'un objet à être récupérés et transformés en nouvelle matière.
- terme: Étiquette énergie
  definition: Étiquette qui classe un appareil de A (le plus économe) à G selon sa consommation d'énergie.
- terme: Notice technique
  definition: Document qui donne les caractéristiques, les consignes de sécurité, l'utilisation et l'entretien d'un objet.
- terme: Piliers du développement durable
  definition: 'Les trois volets à respecter : environnemental, social et économique.'
erreurs_frequentes:
- Ne regarder que la consommation pendant l'utilisation et oublier la fabrication et la fin de vie.
- Croire que « recyclable » veut dire « sans impact ».
- Confondre l'étiquette énergie (consommation) et l'indice de réparabilité (facilité à réparer).
- Oublier les piliers social et économique et ne parler que de l'environnement.
- Comparer deux objets sur des durées d'utilisation différentes.
exemple:
  enonce: 'Document fictif : un réfrigérateur A consomme 150 kWh par an, un réfrigérateur B 250 kWh par an. Quelle différence
    de consommation sur 10 ans ?'
  solution: 'A : 150 × 10 = 1 500 kWh. B : 250 × 10 = 2 500 kWh. Différence : 2 500 − 1 500 = 1 000 kWh en faveur de A. Il
    faut aussi comparer leur prix, leur fabrication et leur réparabilité avant de choisir.'
exercices:
- id: etapes-cycle-de-vie
  type: ordre
  difficulte: 1
  enonce: 'Remets dans l''ordre les étapes du cycle de vie d''un smartphone. a : utilisation par son propriétaire ; b : extraction
    des métaux dans une mine ; c : recyclage des matériaux ; d : fabrication et assemblage en usine ; e : transport jusqu''au
    magasin.'
  reponse:
    elements:
    - id: b
      texte: extraction des métaux dans une mine
    - id: d
      texte: fabrication et assemblage en usine
    - id: e
      texte: transport jusqu'au magasin
    - id: a
      texte: utilisation par son propriétaire
    - id: c
      texte: recyclage des matériaux
  indices:
    relance: Avant de fabriquer un smartphone, de quoi a-t-on besoin ?
    methode: Suis le trajet de la matière, du sol jusqu'à la fin de vie de l'objet.
    etape: La première étape se passe dans le sol, avant toute usine. Place ensuite les autres.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Le smartphone peut-il arriver au magasin avant d'être fabriqué
      ?
  - si:
      diagnostic: ordre_faux
    relance: Pars de la matière brute et suis-la jusqu'à ce que l'objet ne serve plus.
  solution: 'b, d, e, a, c : extraction des matières premières, fabrication, transport et distribution, utilisation, fin de
    vie (recyclage).'
- id: nom-note-reparation
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle la note sur 10, affichée en France sur certains appareils, qui indique s'ils sont faciles à réparer
    ?
  reponse:
    acceptees:
    - indice de réparabilité
    fautes_tolerees: 1
  indices:
    relance: Cette note ne parle pas de la consommation d'électricité. De quoi parle-t-elle ?
    methode: Son nom a deux mots importants. Le premier signifie « note qui indique quelque chose », le second vient du verbe
      réparer.
    etape: Le premier mot commence par « ind ». Le second finit comme « durabilité ».
  pieges:
  - si:
      valeur: étiquette énergie
    relance: L'étiquette énergie indique la consommation, avec des lettres de A à G. Quelle note sur 10 parle de la réparation
      ?
  solution: 'C''est l''indice de réparabilité : il tient compte de la documentation, du démontage, des pièces détachées et
    de leur prix.'
- id: piliers-developpement-durable
  type: association
  difficulte: 2
  enonce: 'Associe chaque argument au pilier du développement durable qu''il concerne. a : les ouvriers de l''usine travaillent
    dans de bonnes conditions de sécurité ; b : l''appareil est vendu à un prix abordable et coûte peu en entretien ; c :
    les métaux sont extraits sans polluer les rivières proches de la mine ; d : l''emballage est en carton recyclé et sans
    plastique. x : environnemental ; y : social ; z : économique.'
  reponse:
    gauche:
    - id: a
      texte: ouvriers en sécurité
    - id: b
      texte: prix abordable et entretien peu coûteux
    - id: c
      texte: rivières non polluées
    - id: d
      texte: emballage en carton recyclé
    droite:
    - id: x
      texte: environnemental
    - id: y
      texte: social
    - id: z
      texte: économique
    paires:
      a: y
      b: z
      c: x
      d: x
  indices:
    relance: Chaque argument parle-t-il surtout des personnes, de l'argent ou de la nature ?
    methode: Social = les personnes (santé, travail). Économique = les coûts et l'activité. Environnemental = la nature et
      les ressources. Un pilier peut servir deux fois.
    etape: 'L''argument a parle des conditions de travail des ouvriers : ce sont des personnes. Associe-le, puis traite les
      autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. N'oublie pas qu'un même pilier peut être utilisé deux fois.
  - si:
      diagnostic: associations_fausses
    relance: Pour chaque argument, demande-toi qui en profite en premier. Les personnes, le porte-monnaie, ou la nature ?
  solution: 'a-y (social : les travailleurs), b-z (économique : le coût), c-x et d-x (environnemental : l''eau, les déchets,
    les ressources).'
- id: bilan-carbone-lampes
  type: nombre
  difficulte: 2
  enonce: 'Document fictif : deux lampes de bureau. Lampe A : fabrication 12 kg CO2e, utilisation 5 kg CO2e par an. Lampe
    B : fabrication 20 kg CO2e, utilisation 2 kg CO2e par an. On les garde 8 ans. Calcule le bilan carbone de chaque lampe
    sur 8 ans. De combien de kg CO2e la lampe la moins émettrice fait-elle mieux que l''autre ? Écris seulement le nombre.'
  reponse:
    valeur: 16
  indices:
    relance: Pour chaque lampe, quelles émissions faut-il additionner sur toute sa vie ?
    methode: Bilan d'une lampe = émissions de fabrication + émissions d'utilisation par an multipliées par le nombre d'années.
      Puis fais la différence des deux bilans.
    etape: 'Pour la lampe A : 12 + 5 × 8. Calcule-le, fais de même pour B, puis compare.'
  pieges:
  - si:
      valeur: 8
    relance: Tu n'as comparé que la fabrication. Ajoute les émissions d'utilisation pendant les 8 ans.
  - si:
      valeur: 36
    relance: C'est le bilan d'une seule lampe. La question demande l'écart entre les deux bilans.
  - si:
      valeur: 52
    relance: C'est le bilan d'une seule lampe. Calcule aussi l'autre, puis fais la différence.
  - si:
      valeur: -16
    relance: Un écart se donne en nombre positif. Soustrais le plus petit bilan du plus grand.
  - si:
      diagnostic: valeur_fausse
    relance: Reprends le calcul lampe par lampe. As-tu bien multiplié l'émission annuelle par le nombre d'années ?
  solution: 'Lampe A : 12 + 5 × 8 = 12 + 40 = 52 kg CO2e. Lampe B : 20 + 2 × 8 = 20 + 16 = 36 kg CO2e. Écart : 52 − 36 = 16
    kg CO2e. La lampe B, plus émettrice à la fabrication, est la moins émettrice sur 8 ans.'
- id: criteres-smartphone-durable
  type: choix
  difficulte: 2
  enonce: 'Quels critères aident à choisir un smartphone qui durera longtemps ? a : un indice de réparabilité élevé ; b :
    des pièces détachées disponibles pendant plusieurs années ; c : une coque collée impossible à ouvrir, pour qu''il soit
    plus fin ; d : des mises à jour du système assurées longtemps ; e : le modèle le plus récent, à changer chaque année.'
  reponse:
    options:
    - id: a
      texte: un indice de réparabilité élevé
    - id: b
      texte: des pièces détachées disponibles pendant plusieurs années
    - id: c
      texte: une coque collée impossible à ouvrir
    - id: d
      texte: des mises à jour du système assurées longtemps
    - id: e
      texte: le modèle le plus récent, à changer chaque année
    bonnes:
    - a
    - b
    - d
  indices:
    relance: Qu'est-ce qui oblige souvent à remplacer un smartphone ? Une panne, une pièce cassée, un logiciel dépassé ?
    methode: Garde les critères qui permettent de réparer l'appareil ou de continuer à l'utiliser. Écarte ceux qui raccourcissent
      sa vie.
    etape: 'Commence par la coque collée : peut-on changer la batterie d''un téléphone qu''on ne peut pas ouvrir ?'
  pieges:
  - si:
      contient:
      - c
    relance: Si la coque est collée, comment changer la batterie ou l'écran quand ils s'usent ?
  - si:
      contient:
      - e
    relance: Changer d'appareil chaque année, est-ce le faire durer ? Pense à l'étape de fabrication du cycle de vie.
  - si:
      diagnostic: incomplet
    relance: Il en manque. Pense aussi aux logiciels du téléphone, pas seulement au matériel.
  solution: a, b et d. Un bon indice de réparabilité et des pièces disponibles permettent de réparer ; les mises à jour gardent
    le téléphone sûr et utilisable. Une coque collée empêche la réparation et changer chaque année multiplie les fabrications.
- id: choisir-une-trottinette
  type: ouverte
  difficulte: 3
  enonce: 'Document fictif : deux trottinettes électriques répondent au même besoin. Trottinette 1 : 290 €, cadre en aluminium,
    batterie vissée et remplaçable, indice de réparabilité 8,1/10, garantie 2 ans. Trottinette 2 : 190 €, cadre en aluminium,
    batterie collée non remplaçable, indice de réparabilité 3,5/10, garantie 2 ans. Laquelle choisis-tu ? Argumente avec le
    cycle de vie et au moins deux piliers du développement durable.'
  criteres:
  - L'élève fait un choix clair et le justifie par des données du document (batterie remplaçable, indice de réparabilité,
    prix).
  - L'élève relie son choix à au moins une étape du cycle de vie (utilisation plus longue, fin de vie retardée, moins de fabrications
    de remplacement).
  - L'élève utilise au moins deux piliers du développement durable (par exemple environnemental et économique, en comparant
    prix d'achat et durée de vie).
  indices:
    relance: Que se passe-t-il pour chaque trottinette quand sa batterie s'use après quelques années ?
    methode: Compare les deux objets critère par critère, puis dis ce que ton choix change pour la nature, pour ton porte-monnaie
      et pour les personnes.
    etape: 'Commence par la batterie : l''une se remplace, l''autre non. Qu''arrive-t-il à la trottinette 2 quand sa batterie
      est usée ?'
  solution: 'Je choisis la trottinette 1. Sa batterie vissée se remplace et son indice de réparabilité est élevé : on la répare
    au lieu de la jeter, ce qui allonge l''étape d''utilisation et évite de fabriquer une nouvelle trottinette (pilier environnemental).
    Elle coûte plus cher à l''achat, mais elle dure plus longtemps, donc elle peut revenir moins cher au final (pilier économique).
    La réparation peut aussi faire travailler des réparateurs (pilier social).'
- id: impacts-milieux
  type: association
  difficulte: 1
  enonce: Associe chaque situation au milieu ou à l'élément qui est touché en priorité.
  reponse:
    gauche:
    - id: fumees
      texte: Une usine rejette des fumées et des gaz à effet de serre
    - id: riviere
      texte: Une teinture est rejetée dans une rivière
    - id: decharge
      texte: Des appareils jetés s'accumulent en décharge
    - id: ouvriers
      texte: Des ouvriers sont exposés à un produit dangereux sans protection
    droite:
    - id: air
      texte: L'air
    - id: eau
      texte: L'eau
    - id: sol
      texte: Le sol
    - id: sante
      texte: La santé
    paires:
      fumees: air
      riviere: eau
      decharge: sol
      ouvriers: sante
  indices:
    relance: 'Pour chaque situation, où la pollution se retrouve-t-elle : dans le ciel, dans un cours d''eau, sur la terre,
      ou chez des personnes ?'
    methode: Les quatre impacts du programme sont l'air, l'eau, le sol et la santé. Chaque situation en touche un seul en
      priorité.
    etape: Une usine qui rejette des fumées pollue ce que l'on respire dehors. Trouve ce milieu, puis avance avec les trois
      autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque élément et demande-toi ce qu'il fait vraiment.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Commence par celle dont tu es sûr, puis avance par élimination.
  solution: 'Fumées : air. Teinture dans la rivière : eau. Appareils en décharge : sol. Produit dangereux sans protection
    : santé.'
- id: cout-energie-aspirateur
  type: nombre
  difficulte: 2
  enonce: Document fictif. Un aspirateur consomme 40 kWh d'électricité par an. Le kWh coûte 0,25 €. Quel est le coût de l'électricité
    de cet aspirateur sur 5 ans, en euros ?
  reponse:
    valeur: 50
    forme: libre
  indices:
    relance: Sur combien d'années veut-on le coût ? Et le prix est donné pour quelle quantité d'énergie ?
    methode: Calcule l'énergie consommée en 5 ans, puis multiplie par le prix d'un kWh.
    etape: Sur 2 ans, l'aspirateur consomme 80 kWh. Calcule l'énergie sur 5 ans, puis convertis-la en euros.
  pieges:
  - si:
      valeur: '10'
    relance: Tu as calculé le coût pour un an seulement. Il faut le faire pour toute la durée demandée.
  - si:
      valeur: '200'
    relance: Ce nombre est une énergie en kWh, pas un prix. Multiplie-le par le prix d'un kWh.
  - si:
      diagnostic: valeur_fausse
    relance: Ce n'est pas ça. Reprends le calcul en écrivant chaque étape avec ses unités.
  solution: 'Énergie sur 5 ans : 40 × 5 = 200 kWh. Coût : 200 × 0,25 = 50 €.'
- id: nblm-quels-sont-les-trois-piliers-du-developp-1
  type: choix
  difficulte: 2
  enonce: Quels sont les trois piliers du développement durable sur lesquels s'appuie le choix d'un objet technique ?
  reponse:
    options:
    - id: o1
      texte: Environnemental, social et économique
    - id: o2
      texte: Environnemental, industriel et politique
    - id: o3
      texte: Technologique, financier et commercial
    - id: o4
      texte: Recyclage, réparation et réemploi
    bonnes:
    - o1
  indices:
    relance: Pense aux trois grands domaines qui touchent la planète, la société et la gestion des ressources financières.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : les aspects industriels et politiques ne constituent pas deux des trois piliers officiels
      du développement durable.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : ces termes désignent des critères marchands ou de conception, et non les piliers fondamentaux
      du développement durable.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : ces trois notions concernent la gestion de la fin de vie d''un objet et non les trois piliers
      globaux.'
  solution: 'Environnemental, social et économique. C''est exact : le développement durable s''appuie sur la préservation
    de l''environnement, l''équité sociale et la viabilité économique.'
- id: nblm-que-mesure-l-etiquette-energie-affichee-2
  type: choix
  difficulte: 2
  enonce: Que mesure l'étiquette énergie affichée sur un appareil électroménager ?
  reponse:
    options:
    - id: o1
      texte: La classe d'efficacité énergétique de l'appareil, de A à G
    - id: o2
      texte: La facilité avec laquelle l'appareil peut être réparé
    - id: o3
      texte: La quantité totale de gaz à effet de serre émise lors de la fabrication
    - id: o4
      texte: Le pourcentage de matériaux recyclés contenus dans le produit
    bonnes:
    - o1
  indices:
    relance: Observe l'échelle colorée comportant des lettres sur l'affichage des appareils neufs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la facilité de réparation est évaluée par l''indice de réparabilité, pas par l''étiquette
      énergie.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : les émissions totales de gaz à effet de serre sont mesurées par le bilan carbone.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : l''étiquette énergie concerne la consommation d''énergie durant l''usage, pas la composition
      du produit.'
  solution: 'La classe d''efficacité énergétique de l''appareil, de A à G. C''est exact : l''étiquette énergie classe les
    appareils de A (le plus économe) à G (le plus énergivore).'
- id: nblm-en-quelle-unite-s-exprime-le-bilan-carbo-3
  type: choix
  difficulte: 2
  enonce: En quelle unité s'exprime le bilan carbone mesurant les gaz à effet de serre émis sur tout le cycle de vie d'un
    objet ?
  reponse:
    options:
    - id: o1
      texte: En kg équivalent CO2
    - id: o2
      texte: En kilowattheures par an
    - id: o3
      texte: En pourcentage de recyclabilité
    - id: o4
      texte: En euros par kilogramme
    bonnes:
    - o1
  indices:
    relance: Recherche l'unité de référence internationale liée à la mesure de l'empreinte carbone.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le kilowattheure par an mesure une consommation d''électricité annuelle, pas l''impact carbone
      global.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : ce pourcentage indique la part de matière récupérable, ce qui est différent des émissions
      de gaz.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : il s''agit d''une unité de coût financier au poids, qui ne reflète pas l''empreinte environnementale.'
  solution: 'En kg équivalent CO2. C''est exact : le bilan carbone comptabilise les émissions de gaz à effet de serre en kilogrammes
    équivalent CO2 (kg CO2e).'
- id: nblm-que-signifie-la-presence-du-symbole-de-l-4
  type: choix
  difficulte: 2
  enonce: Que signifie la présence du symbole de la poubelle barrée sur un équipement électrique ou électronique ?
  reponse:
    options:
    - id: o1
      texte: L'objet doit être rapporté dans un point de collecte sélective et non jeté aux ordures ménagères
    - id: o2
      texte: L'objet est définitivement réparé et ne peut plus jamais être jeté
    - id: o3
      texte: L'objet a été fabriqué sans aucune émission de pollution
    - id: o4
      texte: L'objet doit être impérativement réutilisé tel quel sans aucun démontage
    bonnes:
    - o1
  indices:
    relance: Réfléchis au geste de tri approprié lorsqu'un appareil électrique usagé ne fonctionne plus.
