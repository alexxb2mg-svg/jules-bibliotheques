# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: projet-groupe-developpement-durable-3e
version: 1
etat: verifiee
declencheurs:
- nichoir en bois
- porte-stylos recyclé
- trois piliers du développement durable
- cahier des charges écoresponsable
- travail collectif fin de cycle
- objectif de développement durable
prerequis:
- gestion-projet-technique
essentiel: 'Un projet de groupe intégrant le développement durable combine une démarche de gestion de projet (répartition
  des tâches, planning, jalons) et des choix techniques justifiés selon les trois piliers du développement durable : économique,
  social et environnemental.


  Dès la définition du cahier des charges, le groupe doit intégrer des critères de développement durable parmi les contraintes,
  comme des matériaux recyclés ou recyclables, une faible consommation d''énergie ou une bonne réparabilité, en plus des critères
  fonctionnels habituels.


  Tout au long du projet, chaque choix technique (matériau, source d''énergie, assemblage, procédé de fabrication) doit être
  justifié en le reliant à un ou plusieurs piliers du développement durable, et le résultat final doit être évalué par rapport
  à ces critères, pas seulement par rapport aux fonctions attendues. En classe de 3e, ce projet mené en groupe permet de mettre
  en œuvre les compétences développées lors des niveaux précédents.'
methode:
- Intégrer des critères de développement durable dans le cahier des charges dès le début du projet.
- Répartir les tâches du groupe en tenant compte des compétences de chacun.
- Justifier chaque choix technique par un ou plusieurs piliers du développement durable.
- Évaluer le résultat final à la fois sur les fonctions attendues et sur les critères de développement durable fixés au départ.
vocabulaire:
- terme: pilier du développement durable
  definition: un des trois domaines (économique, social, environnemental) à prendre en compte dans un projet durable
- terme: cahier des charges
  definition: document qui liste les fonctions attendues et les contraintes que doit respecter une solution technique
erreurs_frequentes:
- Ajouter le développement durable seulement à la fin du projet, sans l'avoir intégré au cahier des charges dès le départ.
- Justifier un choix technique sans le relier explicitement à un pilier du développement durable.
- Négliger la répartition des tâches, ce qui ralentit le projet en groupe.
exemple:
  enonce: Un groupe conçoit un porte-stylos en matériaux recyclés pour la classe. Donner un exemple de critère de développement
    durable à inscrire dans le cahier des charges, et un exemple de répartition des tâches.
  solution: 'Critère de développement durable : « le porte-stylos doit être fabriqué à partir de matériaux recyclés ou de
    chutes de matériaux déjà présentes dans l''atelier » (pilier environnemental). Répartition des tâches : un élève cherche
    les matériaux disponibles, un autre modélise numériquement l''objet, un troisième s''occupe du montage et un quatrième
    prépare la présentation du projet.'
exercices:
- id: role-criteres-cahier-charges
  type: choix
  difficulte: 1
  enonce: Quand faut-il intégrer les critères de développement durable dans le projet ?
  reponse:
    options:
    - id: a
      texte: Dès la définition du cahier des charges, au début du projet
    - id: b
      texte: Seulement à la toute fin, lors de l'évaluation du résultat
    - id: c
      texte: Uniquement si le groupe a du temps supplémentaire disponible
    bonnes:
    - a
  indices:
    relance: Pense au moment où l'on fixe les contraintes et les exigences du projet.
    methode: Le cahier des charges se rédige au tout début du projet, avant les choix techniques.
    etape: Une des erreurs fréquentes de la fiche concerne justement ce moment d'intégration.
  pieges:
  - si:
      contient:
      - b
    relance: Ajouter le développement durable seulement à la fin est une erreur fréquente citée dans la fiche.
  - si:
      contient:
      - c
    relance: Le développement durable doit être une contrainte du projet dès le départ, pas une option facultative selon le
      temps disponible.
  solution: Il faut intégrer les critères de développement durable dès la définition du cahier des charges, au début du projet,
    et non les ajouter seulement à la fin.
- id: nom-trois-piliers
  type: texte_court
  difficulte: 1
  enonce: Quel pilier du développement durable concerne la protection de la nature et la limitation de la pollution ?
  reponse:
    acceptees:
    - environnemental
    - pilier environnemental
    fautes_tolerees: 1
  indices:
    relance: Ce pilier concerne la nature, l'eau, l'air et les déchets.
    methode: Les deux autres piliers concernent l'argent et les personnes, celui-ci concerne la planète.
    etape: Le mot cherché contient « environ... ».
  pieges:
  - si:
      valeur: economique
    relance: Le pilier économique concerne le coût et le budget, pas la protection de la nature.
  solution: 'C''est le pilier environnemental : il concerne la protection de la nature et la limitation de la pollution.'
- id: pourquoi-justifier-pilier
  type: choix
  difficulte: 2
  enonce: Pourquoi faut-il relier chaque choix technique à un pilier du développement durable plutôt que de simplement l'appliquer
    sans explication ?
  reponse:
    options:
    - id: a
      texte: Pour montrer que le choix répond bien à un objectif précis de durabilité, pas seulement à une mode
    - id: b
      texte: Pour que le projet coûte automatiquement moins cher
    - id: c
      texte: Pour éviter d'avoir à tester le prototype ensuite
    bonnes:
    - a
  indices:
    relance: Que se passe-t-il si un choix technique est présenté comme « durable » sans expliquer pourquoi ?
    methode: Justifier un choix permet de vérifier qu'il répond vraiment à un enjeu économique, social ou environnemental.
    etape: La justification prouve que le lien avec le développement durable est réel, pas seulement affiché.
  pieges:
  - si:
      contient:
      - b
    relance: Un choix durable ne réduit pas forcément le coût du projet ; ce n'est pas la raison de la justification.
  - si:
      contient:
      - c
    relance: Justifier un choix technique par le développement durable ne dispense pas de tester le prototype ensuite.
  solution: Justifier chaque choix par un pilier précis montre qu'il répond réellement à un objectif de durabilité (économique,
    social ou environnemental), et pas seulement à une intention affichée sans preuve.
- id: associer-criteres-piliers
  type: association
  difficulte: 2
  enonce: Relie chaque critère du cahier des charges au pilier du développement durable qu'il illustre.
  reponse:
    gauche:
    - id: a
      texte: Le coût des matériaux ne doit pas dépasser un budget fixé
    - id: b
      texte: L'objet doit être facile à installer par n'importe quel adulte, sans outil spécialisé
    - id: c
      texte: Utiliser du bois non traité chimiquement, sans danger pour l'environnement
    droite:
    - id: x
      texte: Pilier économique
    - id: y
      texte: Pilier social
    - id: z
      texte: Pilier environnemental
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces critères concerne l'argent, un autre les personnes qui utilisent l'objet, le dernier la nature.
    methode: Repère d'abord le critère de budget, qui est toujours lié au pilier économique.
    etape: Le critère d'installation facile concerne le pilier social, celui du bois non traité le pilier environnemental.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis le critère de budget, puis les deux autres.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le critère économique (budget), puis distingue social et environnemental.
  solution: 'Coût des matériaux : pilier économique. Facilité d''installation pour tous : pilier social. Bois non traité chimiquement
    : pilier environnemental.'
- id: etapes-projet-durable
  type: ordre
  difficulte: 2
  enonce: Range ces étapes de la méthode pour mener un projet de groupe lié au développement durable.
  reponse:
    elements:
    - id: integrer
      texte: Intégrer des critères de développement durable dans le cahier des charges
    - id: repartir
      texte: Répartir les tâches du groupe selon les compétences de chacun
    - id: justifier
      texte: Justifier chaque choix technique par un pilier du développement durable
    - id: evaluer
      texte: Évaluer le résultat final sur les fonctions et sur les critères durables
  indices:
    relance: Peut-on justifier des choix techniques si aucun critère de développement durable n'a été fixé au départ ?
    methode: On intègre d'abord les critères, puis on répartit les tâches, puis on justifie les choix, puis on évalue le résultat.
    etape: La toute première étape consiste toujours à intégrer les critères dans le cahier des charges.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient logiquement avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la première étape (intégrer les critères) et la dernière (évaluer le résultat), puis range les
      deux autres.
  solution: On intègre d'abord des critères de développement durable dans le cahier des charges, puis on répartit les tâches
    du groupe, puis on justifie chaque choix technique par un pilier du développement durable, et enfin on évalue le résultat
    final sur les fonctions et sur ces critères.
- id: proposer-projet-durable
  type: ouverte
  difficulte: 3
  enonce: Un groupe de 3e doit concevoir un composteur pour la cour de récréation. Propose un critère de développement durable
    pour chacun des trois piliers, et explique comment tu répartirais les tâches dans le groupe.
  criteres:
  - L'élève propose un critère lié au pilier économique.
  - L'élève propose un critère lié au pilier social.
  - L'élève propose un critère lié au pilier environnemental.
  - L'élève propose une répartition des tâches entre plusieurs membres du groupe.
  indices:
    relance: Quel critère économique pourrait limiter le budget du projet de composteur ?
    methode: Reprends l'exemple du nichoir à oiseaux de la fiche et adapte-le au composteur.
    etape: 'Tu peux commencer ainsi : « Critère économique : le budget ne doit pas dépasser... ».'
  solution: 'Critère économique : le coût total du composteur ne doit pas dépasser un budget fixé par la classe. Critère social
    : le composteur doit être facile à utiliser par tous les élèves, y compris les plus jeunes. Critère environnemental :
    le composteur doit être fabriqué en bois non traité et permettre de réduire les déchets organiques de la cantine. Pour
    la répartition des tâches, un élève cherche le budget et les matériaux, un autre modélise numériquement le composteur,
    un troisième s''occupe de la fabrication, et un quatrième prépare la présentation du projet.'
