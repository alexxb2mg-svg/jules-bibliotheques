# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: projet-groupe-developpement-durable-3e
version: 2
etat: verifiee
declencheurs:
- objectifs de développement durable
- répartir les rôles dans l'équipe
- chef de projet
- responsable communication
- ODD
- projet de fin de troisième
- compléter le cahier des charges du groupe
- projet en équipe au collège
- économiser eau ou énergie dans un projet
- présentation orale du projet
prerequis:
- gestion-projet-technique
- 4e-besoins-fonctions-solutions
essentiel: 'En 3e, on mène un projet technique en groupe sur une thématique choisie, souvent liée aux objectifs de développement
  durable (ODD) de l''ONU : eau, énergie, déchets, biodiversité... Le projet réutilise tout ce qui a été appris au collège.


  Le groupe part d''un besoin : ce qui manque ou pose problème. Il l''écrit dans un cahier des charges, puis cherche des solutions.


  Il faut bien distinguer trois niveaux :

  - le besoin : « arroser le potager sans gaspiller l''eau » ;

  - la fonction : ce que l''objet doit faire, « mesurer l''humidité du sol » ;

  - la solution technique : le composant choisi, « un capteur d''humidité ».


  Un critère précise comment on juge une fonction, avec un niveau mesurable (par exemple un coût de 60 € au maximum).


  Un projet suit des étapes : besoin, cahier des charges, recherche de solutions, choix, réalisation d''un prototype, tests,
  présentation. Le planning place les tâches dans le temps. Des revues de projet permettent de faire le point à des moments
  prévus.


  Chaque membre a un rôle : chef de projet (planning, revues), responsable conception (modélisation, fabrication), responsable
  programmation, responsable communication. Mais tout le groupe reste responsable du projet et chacun aide les autres.


  Le choix d''une solution se fait en comparant les solutions au cahier des charges et à leur impact sur l''environnement
  : consommation d''énergie ou d''eau, matériaux, réparabilité, fin de vie.


  Exemple d''ODD : l''ODD 6 (eau propre et assainissement), l''ODD 7 (énergie propre et d''un coût abordable), l''ODD 12 (consommation
  et production responsables).


  À la fin, le groupe présente son projet. On attend : le besoin, les choix faits et leurs raisons, les tests réalisés, et
  l''intérêt pour le développement durable (eau économisée, énergie, déchets évités), chiffré si possible.


  Au brevet, on attend : distinguer besoin, fonction et solution, justifier un choix avec le cahier des charges, calculer
  une économie et relier le projet à un ODD.

  '
methode:
- Choisir une thématique liée au développement durable et formuler le besoin en une phrase, sans parler de solution.
- Rédiger le cahier des charges avec des fonctions et des critères mesurables.
- Répartir les rôles, puis construire le planning avec des revues de projet.
- Chercher plusieurs solutions et choisir en comparant avec le cahier des charges et l'impact environnemental.
- Réaliser un prototype et le tester en comparant les mesures aux critères.
- Présenter le projet en justifiant chaque choix et l'intérêt pour le développement durable.
vocabulaire:
- terme: ODD
  definition: Objectif de développement durable fixé par l'ONU (17 objectifs, comme l'eau ou l'énergie).
- terme: besoin
  definition: Ce qui manque ou pose problème, exprimé sans parler de solution.
- terme: fonction
  definition: Ce que l'objet doit faire pour répondre au besoin.
- terme: solution technique
  definition: Composant ou moyen choisi pour réaliser une fonction.
- terme: critère
  definition: Manière de juger une fonction, avec un niveau à atteindre.
- terme: cahier des charges
  definition: Document qui liste les fonctions et les critères à respecter.
- terme: revue de projet
  definition: Moment prévu où l'équipe fait le point sur l'avancement.
- terme: développement durable
  definition: Répondre aux besoins d'aujourd'hui sans priver les générations futures des leurs.
erreurs_frequentes:
- Écrire une solution à la place du besoin (« il faut une électrovanne » au lieu de « arroser sans gaspiller »).
- Confondre une fonction (mesurer l'humidité) et une solution technique (un capteur d'humidité).
- Laisser une seule personne tout faire, ou travailler chacun dans son coin sans revue de projet.
- Oublier, à l'oral, de justifier les choix et l'intérêt pour le développement durable.
- Choisir une solution sans la comparer au cahier des charges.
exemple:
  enonce: Un groupe veut réduire le gaspillage de lumière dans les couloirs du collège. Écris le besoin, une fonction et une
    solution technique.
  solution: 'Besoin : éclairer les couloirs seulement quand c''est utile. Fonction : détecter la présence d''une personne.
    Solution technique : un détecteur de présence infrarouge.'
exercices:
- id: reconnaitre-le-besoin
  type: choix
  difficulte: 1
  enonce: Ton groupe travaille sur un système d'arrosage pour le potager du collège. Quelle phrase exprime le besoin, sans
    parler de solution ?
  reponse:
    options:
    - id: a
      texte: Arroser le potager sans gaspiller d'eau, même pendant les vacances
    - id: b
      texte: Installer une électrovanne commandée par une carte programmable
    - id: c
      texte: Ajouter un capteur d'humidité dans la terre
    - id: d
      texte: Utiliser un tuyau goutte-à-goutte
    bonnes:
    - a
  indices:
    relance: Quelle phrase ne cite aucun composant ni aucun objet technique ?
    methode: Un besoin dit ce qui est utile ou nécessaire. Une solution dit avec quoi on le fait.
    etape: Électrovanne, capteur, tuyau sont des composants. Une phrase qui les cite parle donc d'une solution.
  pieges:
  - si:
      contient:
      - b
    relance: Une électrovanne et une carte programmable, ce sont des composants choisis. Est-ce un besoin ou déjà une solution
      ?
  - si:
      contient:
      - c
    relance: Le capteur d'humidité est un composant. Cette phrase dit-elle pourquoi on en a besoin, ou avec quoi on le fait
      ?
  - si:
      contient:
      - d
    relance: Le tuyau goutte-à-goutte est un moyen d'arroser. C'est donc une solution. Quelle phrase dit ce qu'on veut obtenir
      ?
  solution: 'Le besoin est « arroser le potager sans gaspiller d''eau, même pendant les vacances ». Les trois autres phrases
    citent des composants : ce sont des solutions techniques.'
- id: projets-et-odd
  type: association
  difficulte: 2
  enonce: Plusieurs groupes de la classe ont choisi un projet. Associe chaque projet à l'objectif de développement durable
    (ODD) auquel il répond le plus directement.
  reponse:
    gauche:
    - id: arrosage
      texte: Arrosage du potager qui ne se déclenche que si la terre est sèche
    - id: borne
      texte: Borne d'éclairage alimentée par un panneau solaire
    - id: compost
      texte: Composteur pour réduire les déchets de la cantine
    droite:
    - id: odd6
      texte: ODD 6, eau propre et assainissement
    - id: odd7
      texte: ODD 7, énergie propre et d'un coût abordable
    - id: odd12
      texte: ODD 12, consommation et production responsables
    paires:
      arrosage: odd6
      borne: odd7
      compost: odd12
  indices:
    relance: Quelle ressource le système d'arrosage cherche-t-il à économiser ?
    methode: Pour chaque projet, repère ce qu'il économise ou réduit (eau, énergie, déchets), puis cherche l'objectif qui
      en parle.
    etape: Le panneau solaire produit de l'électricité à partir du soleil. Quel objectif parle d'énergie ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule erreur. Réduire les déchets, c'est consommer de façon plus responsable. Quel objectif en parle ?
  - si:
      diagnostic: associations_fausses
    relance: Pour chaque projet, écris d'abord en un mot ce qu'il économise, puis relis les objectifs.
  solution: 'Arrosage économe : ODD 6 (eau). Borne solaire : ODD 7 (énergie propre). Composteur : ODD 12 (consommation et
    production responsables, moins de déchets).'
- id: economie-eau-un-mois
  type: nombre
  difficulte: 2
  enonce: Arrosé à la main, le potager reçoit 20 L d'eau par jour. Avec le système automatique, il n'en reçoit plus que 12
    L par jour en moyenne. Combien de litres d'eau le système fait-il économiser en 30 jours ?
  reponse:
    valeur: 240
  indices:
    relance: Combien de litres le système économise-t-il en un seul jour ?
    methode: Calcule l'économie pour un jour (arrosage à la main moins arrosage automatique), puis multiplie par le nombre
      de jours.
    etape: 'Économie en un jour : 20 L moins 12 L. Multiplie ce résultat par le nombre de jours.'
  pieges:
  - si:
      valeur: 8
    relance: C'est l'économie pour un seul jour. La question porte sur combien de jours ?
  - si:
      valeur: 360
    relance: Tu as calculé l'eau utilisée par le système automatique en un mois. Mais on demande l'eau économisée par rapport
      à l'arrosage à la main.
  - si:
      valeur: 600
    relance: C'est l'eau utilisée à la main en un mois. Combien en utilise encore le système automatique ? Il faut comparer.
  - si:
      diagnostic: valeur_fausse
    relance: Commence par l'économie d'un seul jour, puis multiplie par le nombre de jours.
  solution: 'Économie par jour : 20 − 12 = 8 L. En 30 jours : 8 × 30 = 240 L d''eau économisés.'
- id: fonction-ou-solution
  type: choix
  difficulte: 2
  enonce: Dans le cahier des charges du système d'arrosage, quelles phrases décrivent une fonction (ce que le système doit
    faire) et non une solution technique ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: Mesurer l'humidité du sol
    - id: b
      texte: Laisser passer ou bloquer l'eau
    - id: c
      texte: Un capteur capacitif d'humidité
    - id: d
      texte: Une électrovanne 12 V
    bonnes:
    - a
    - b
  indices:
    relance: Une fonction commence par un verbe. Quelles phrases commencent par un verbe à l'infinitif ?
    methode: Une fonction dit ce que le système doit faire. Une solution technique nomme le composant choisi pour le faire.
    etape: « Un capteur capacitif d'humidité » nomme un composant précis. C'est donc une solution. Examine les autres phrases.
  pieges:
  - si:
      contient:
      - c
    relance: Le capteur capacitif est un composant choisi. Il réalise une fonction, mais est-ce lui-même une fonction ?
  - si:
      contient:
      - d
    relance: Une électrovanne 12 V est un composant précis, avec sa tension. Fonction ou solution technique ?
  - si:
      diagnostic: incomplet
    relance: Il en manque une. Cherche une autre phrase qui dit ce que le système doit faire, avec un verbe.
  solution: « Mesurer l'humidité du sol » et « laisser passer ou bloquer l'eau » sont des fonctions. Le capteur capacitif
    et l'électrovanne sont les solutions techniques choisies pour les réaliser.
- id: roles-dans-l-equipe
  type: association
  difficulte: 1
  enonce: Dans ton groupe de quatre, chacun a un rôle. Associe chaque rôle à sa mission principale.
  reponse:
    gauche:
    - id: chef
      texte: Chef de projet
    - id: conception
      texte: Responsable conception
    - id: programmation
      texte: Responsable programmation
    - id: communication
      texte: Responsable communication
    droite:
    - id: planning
      texte: Tient le planning et anime les revues de projet
    - id: modeliser
      texte: Modélise les pièces en 3D et prépare leur fabrication
    - id: code
      texte: Écrit et teste le programme de la carte
    - id: oral
      texte: Prépare le diaporama et la présentation orale
    paires:
      chef: planning
      conception: modeliser
      programmation: code
      communication: oral
  indices:
    relance: Qui, dans une équipe, veille à ce que tout soit fait à temps ?
    methode: Le nom de chaque rôle dit sur quoi il travaille. Associe ce mot à la mission qui en parle.
    etape: La programmation concerne le programme de la carte. Fais de même avec les autres rôles.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule erreur. Qui prépare ce que le groupe va montrer et dire au jury ?
  - si:
      diagnostic: associations_fausses
    relance: Reprends rôle par rôle, en cherchant le mot commun entre le nom du rôle et la mission.
  solution: 'Chef de projet : planning et revues de projet. Conception : modélisation 3D et fabrication. Programmation : programme
    de la carte. Communication : diaporama et présentation orale.'
- id: justifier-solution-arrosage
  type: ouverte
  difficulte: 3
  enonce: 'Cahier des charges : économiser l''eau du réseau ; arroser pendant les vacances, sans personne ; coûter au plus
    60 €. Solution A : arrosage programmé chaque jour à 7 h pendant 10 minutes, avec l''eau du réseau, pour 35 €. Solution
    B : arrosage déclenché seulement quand un capteur indique que la terre est sèche, avec l''eau d''une cuve de récupération
    de pluie, pour 55 €. Choisis une solution et justifie ton choix à l''aide du cahier des charges.'
  criteres:
  - L'élève vérifie les trois critères pour les deux solutions (eau du réseau, fonctionnement sans personne, coût).
  - L'élève fait le lien avec le développement durable (eau de pluie réutilisée, arrosage seulement si nécessaire).
  - L'élève conclut par un choix cohérent avec ses arguments.
  indices:
    relance: Les deux solutions respectent-elles le budget ? Fonctionnent-elles toutes les deux sans personne ?
    methode: Fais un tableau avec les trois critères en lignes et les deux solutions en colonnes, et remplis chaque case.
    etape: 'Regarde le critère « économiser l''eau du réseau » : la solution A arrose-t-elle même s''il a plu la veille ?
      D''où vient son eau ?'
  solution: 'Les deux solutions coûtent moins de 60 € et fonctionnent sans personne. Mais A arrose chaque jour avec l''eau
    du réseau, même si la terre est déjà humide. B n''arrose que lorsque c''est nécessaire, et avec de l''eau de pluie : elle
    économise vraiment l''eau du réseau. Je choisis B, qui respecte tout le cahier des charges.'
- id: cout-total-projet
  type: nombre
  difficulte: 2
  enonce: 'Cahier des charges du système d''arrosage : coût total de 60 € au maximum. Le groupe achète un capteur à 12 €,
    une carte programmable à 25 € et une électrovanne à 18 €. Quel est le coût total, en euros ?'
  reponse:
    valeur: 55
    forme: entier
  indices:
    relance: Quelles sont les trois dépenses à regrouper ?
    methode: Coût total = somme des prix des composants.
    etape: Additionne les prix des trois composants. Compare ensuite le résultat au maximum autorisé.
  pieges:
  - si:
      valeur: 43
    relance: Il manque un composant dans ta somme. Combien y en a-t-il en tout ?
  - si:
      valeur: 5
    relance: Tu as calculé l'écart avec le maximum autorisé. Ici on demande le coût total.
  solution: '12 + 25 + 18 = 55 €. 55 € est inférieur à 60 € : le critère de coût est respecté.'
- id: choisir-solution-durable
  type: choix
  difficulte: 2
  enonce: Un groupe veut réduire les déchets de la cantine. Quelles démarches suivent une bonne démarche de projet ? Plusieurs
    réponses possibles.
  reponse:
    options:
    - id: a
      texte: Écrire le besoin avant de choisir la solution
    - id: b
      texte: Comparer plusieurs solutions avec le cahier des charges
    - id: c
      texte: Prévoir une revue de projet pour faire le point
    - id: d
      texte: Acheter tout de suite le matériel pour gagner du temps
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Dans un projet, que doit-on avoir fait avant d'acheter du matériel ?
    methode: Une bonne démarche part du besoin, compare des solutions au cahier des charges et prévoit des points d'étape.
    etape: Trois propositions décrivent des étapes de la démarche. L'autre saute directement à la réalisation.
  pieges:
  - si:
      contient:
      - d
    relance: Acheter avant d'avoir comparé les solutions, c'est risquer de mal choisir. Quelle étape a été oubliée ?
  solution: Besoin, comparaison de solutions et revues de projet font partie de la démarche. Acheter avant de choisir la solution
    ne suit pas la démarche.
- id: nblm-que-signifie-l-acronyme-odd-dans-le-cadr-1
  type: choix
  difficulte: 2
  enonce: Que signifie l'acronyme ODD dans le cadre d'un projet de technologie en classe de troisième ?
  reponse:
    options:
    - id: o1
      texte: Objectifs de développement durable
    - id: o2
      texte: Organisation de développement durable
    - id: o3
      texte: Options de développement durable
    - id: o4
      texte: Ordre de développement durable
    bonnes:
    - o1
  indices:
    relance: Pense au but visé à l'échelle internationale pour préserver la planète.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : confondre un ensemble d''objectifs avec le nom d''un organisme ou d''une organisation.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : remplacer ''Objectifs'' par ''Options'', alors qu''il s''agit d''objectifs précis définis
      à l''échelle internationale.'
  - si:
      contient:
      - o4
    relance: 'Erreur courante : utiliser le mot ''Ordre'' au lieu du terme exact ''Objectifs''.'
  solution: 'Objectifs de développement durable. C''est la définition exacte : 17 objectifs fixés par l''ONU en 2015 concernant
    l''eau, l''énergie, le climat, etc.'
- id: nblm-lors-d-un-projet-de-groupe-en-classe-de-2
  type: choix
  difficulte: 2
  enonce: Lors d'un projet de groupe en classe de 3e, qui est responsable de la réussite globale du projet ?
  reponse:
    options:
    - id: o1
      texte: Tout le groupe d'élèves
    - id: o2
      texte: Uniquement le chef de projet
    - id: o3
      texte: Uniquement le responsable communication
    - id: o4
      texte: Seul le professeur de technologie
    bonnes:
    - o1
  indices:
    relance: Répartir les rôles individuels ne supprime pas l'engagement collectif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que le chef de projet porte seul toute la responsabilité du travail d''équipe.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : attribuer la responsabilité finale à la personne qui présente ou communique le travail.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : penser que l''enseignant prend la responsabilité de la réalisation à la place des élèves.'
  solution: Tout le groupe d'élèves. Même si chaque élève a un rôle précis (chef de projet, communication...), tout le groupe
    reste collectivement responsable du projet.
- id: nblm-au-sein-de-l-equipe-projet-quel-est-le-r-3
  type: choix
  difficulte: 2
  enonce: Au sein de l'équipe projet, quel est le rôle principal du responsable communication ?
  reponse:
    options:
    - id: o1
      texte: Organiser la présentation du projet et expliquer les choix et l'intérêt pour le développement durable
    - id: o2
      texte: Écrire seul l'intégralité du programme informatique de l'objet
    - id: o3
      texte: Prendre toutes les décisions techniques sans consulter l'équipe
    - id: o4
      texte: Fabriquer seul toutes les pièces du prototype en atelier
    bonnes:
    - o1
  indices:
    relance: Pense à la préparation de la soutenance et de la présentation orale du travail.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : confondre le rôle de la communication avec la tâche de programmation informatique.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : attribuer les choix de conception ou la direction d''équipe au responsable communication.'
  - si:
      contient:
      - o4
    relance: 'Erreur courante : confondre la réalisation matérielle des pièces et la communication du projet.'
  solution: Organiser la présentation du projet et expliquer les choix et l'intérêt pour le développement durable. Le responsable
    communication prépare la valorisation du projet et explicite les solutions retenues ainsi que leur impact positif.
- id: nblm-quelle-formulation-enonce-correctement-u-4
  type: choix
  difficulte: 2
  enonce: Quelle formulation énonce correctement un besoin selon la méthode du projet technique ?
  reponse:
    options:
    - id: o1
      texte: Éclairer les couloirs du collège seulement quand c'est utile
    - id: o2
      texte: Il faut acheter un détecteur de présence infrarouge
    - id: o3
      texte: Installer une carte microcontrôleur avec un câble USB
    - id: o4
      texte: Programmer un bloc de minuterie de 30 secondes
    bonnes:
    - o1
  indices:
    relance: Un besoin s'exprime du point de vue de l'utilisateur, sans citer de composant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : donner une solution technique (le composant) à la place du besoin.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : citer du matériel au lieu de décrire la nécessité pour l''utilisateur.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : confondre une instruction de programme avec le besoin de l''utilisateur.'
  solution: 'Éclairer les couloirs du collège seulement quand c''est utile. C''est l''énoncé exact du besoin : il exprime
    ce qui est nécessaire pour l''utilisateur sans mentionner de solution technique.'
- id: nblm-quel-est-l-un-des-objectifs-majeurs-du-p-5
  type: choix
  difficulte: 2
  enonce: Quel est l'un des objectifs majeurs du projet de groupe mené en fin de troisième en technologie ?
  reponse:
    options:
    - id: o1
      texte: Mettre en œuvre l'ensemble des compétences acquises en traitant une thématique liée aux ODD
    - id: o2
      texte: Fabriquer un objet complexe sans vérifier son impact sur l'environnement
    - id: o3
      texte: Travailler de façon strictement individuelle sans échanger avec le groupe
    - id: o4
      texte: Rédiger un programme informatique sans tester le prototype réel
    bonnes:
    - o1
  indices:
