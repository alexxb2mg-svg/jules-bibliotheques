# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: prototypage-solutions
version: 3
etat: verifiee
declencheurs:
- maquette ou prototype
- premier exemplaire qui fonctionne
- croquis à main levée
- transformer une rotation en translation
- sécurité dans l'atelier
- premier prototype fonctionnel
- choisir un mécanisme de mouvement
- pignon et crémaillère
- croquis schéma modèle 3D
prerequis:
- 4e-besoins-fonctions-solutions
- chaine-energie
- materiaux-et-procedes
essentiel: 'Pour produire un nouvel objet technique, l''équipe imagine plusieurs solutions, en choisit une à l''aide du cahier
  des charges, puis fabrique un prototype : un premier exemplaire qui fonctionne vraiment, pour le tester avant de le produire.
  Une maquette, elle, montre surtout la forme ou l''aspect, souvent sans fonctionner.


  Les modes de représentation aident à chaque moment :

  - le croquis à main levée pour chercher des idées ;

  - le schéma pour montrer le principe de fonctionnement ;

  - le modèle 3D (logiciel de CAO) pour vérifier formes et dimensions et préparer la fabrication ;

  - l''algorithme ou l''algorigramme pour décrire ce que fait le programme.


  Des mécanismes transmettent ou transforment les mouvements :

  - poulies et courroie, engrenages : ils transmettent une rotation ;

  - pignon-crémaillère, système vis-écrou : ils transforment une rotation en translation (mouvement en ligne droite).


  Les pièces s''obtiennent par découpe laser (pièces planes), impression 3D (pièces en volume), pliage, perçage ; puis on
  les assemble (vis, clips, collage...). On choisit le procédé selon la forme de la pièce, son matériau et le temps disponible.


  L''ergonomie, c''est adapter l''objet à son utilisateur : facile, confortable et sûr à utiliser. On y pense dès les croquis
  (taille des boutons, position des commandes).


  En atelier, on respecte les règles de sécurité : lunettes de protection, cheveux attachés, capot de la découpeuse laser
  fermé, pièces chaudes non touchées, machine utilisée seulement après autorisation.


  Après fabrication, on teste le prototype et on compare avec le cahier des charges : on note ce qui marche, ce qui ne marche
  pas, et on améliore.


  Au brevet, on attend que tu saches : expliquer l''intérêt de chaque mode de représentation, choisir un mécanisme ou un procédé
  de fabrication, citer des règles de sécurité et justifier une solution par le cahier des charges.'
methode:
- Relire le cahier des charges et noter les fonctions que le prototype doit assurer.
- Dessiner plusieurs solutions en croquis, puis en choisir une en la comparant aux critères.
- Modéliser les pièces en 3D et choisir un procédé de fabrication pour chacune.
- Fabriquer les pièces en respectant les règles de sécurité, puis les assembler.
- Tester le prototype et noter ce qu'il faut améliorer.
vocabulaire:
- terme: Prototype
  definition: Premier exemplaire d'un objet, qui fonctionne, fabriqué pour tester une solution.
- terme: Maquette
  definition: Représentation de l'objet, souvent à une autre échelle, qui montre sa forme sans forcément fonctionner.
- terme: Ergonomie
  definition: Adaptation d'un objet à la personne qui l'utilise (facilité, confort, sécurité).
- terme: Translation
  definition: Mouvement en ligne droite.
- terme: Croquis
  definition: Dessin à main levée qui sert à chercher et à montrer des idées.
- terme: Modèle 3D
  definition: Représentation d'une pièce en trois dimensions dans un logiciel de CAO.
- terme: Crémaillère
  definition: Pièce droite dentée qui, avec un pignon, transforme une rotation en translation.
- terme: Procédé de fabrication
  definition: 'Manière d''obtenir une pièce : découpe laser, impression 3D, pliage, perçage.'
erreurs_frequentes:
- Confondre prototype (il fonctionne) et maquette (elle montre la forme).
- Fabriquer une seule solution sans en avoir comparé plusieurs avec le cahier des charges.
- Croire que des poulies et une courroie transforment une rotation en translation, alors qu'elles transmettent une rotation.
- Utiliser une machine de l'atelier sans protection ni autorisation.
- 'Confondre transmettre un mouvement et le transformer : la poulie transmet, la vis-écrou transforme.'
exemple:
  enonce: Pour un distributeur de croquettes, quel mode de représentation utiliser pour montrer rapidement trois idées de
    réservoir à l'équipe ?
  solution: 'Des croquis à main levée : ils sont rapides à faire et suffisent pour comparer des idées. Le modèle 3D viendra
    ensuite, pour la solution choisie.'
exercices:
- id: nom-premier-exemplaire
  type: texte_court
  difficulte: 1
  enonce: Ton équipe conçoit un distributeur automatique de croquettes pour chat. Avant toute production, elle construit un
    premier exemplaire qui fonctionne vraiment, pour le tester. Comment appelle-t-on cet exemplaire ? (un seul mot)
  reponse:
    acceptees:
    - prototype
    fautes_tolerees: 1
  indices:
    relance: Cet exemplaire fonctionne vraiment. Est-ce une simple maquette qui montre la forme ?
    methode: Cherche le mot du vocabulaire de projet qui désigne un premier exemplaire fonctionnel, fabriqué pour être testé.
    etape: Le mot vient du grec « protos », qui veut dire « premier ».
  pieges:
  - si:
      valeur: maquette
    relance: Une maquette montre surtout la forme ou l'aspect, souvent sans fonctionner. Ici, l'exemplaire fonctionne et sert
      aux tests. Quel autre mot ?
  - si:
      valeur: modèle 3D
    relance: Un modèle 3D n'existe que sur l'ordinateur. Ici, l'exemplaire est fabriqué pour de vrai. Comment l'appelle-t-on
      ?
  solution: 'C''est un prototype : un premier exemplaire qui fonctionne, fabriqué pour tester la solution avant de la produire.'
- id: modes-de-representation
  type: association
  difficulte: 2
  enonce: Associe chaque mode de représentation utilisé pour le distributeur de croquettes à ce à quoi il sert.
  reponse:
    gauche:
    - id: croquis
      texte: Croquis à main levée
    - id: schema
      texte: Schéma
    - id: modele
      texte: Modèle 3D sur logiciel de CAO
    - id: algo
      texte: Algorigramme
    droite:
    - id: idees
      texte: Chercher vite plusieurs idées sur papier
    - id: principe
      texte: Montrer le principe de fonctionnement avec des symboles
    - id: formes
      texte: Vérifier les formes et les dimensions avant de fabriquer
    - id: programme
      texte: Décrire les étapes du programme qui commande le moteur
    paires:
      croquis: idees
      schema: principe
      modele: formes
      algo: programme
  indices:
    relance: Lequel de ces modes de représentation se fait le plus vite, avec un simple crayon ?
    methode: Commence par ceux dont tu es sûr, puis termine par élimination.
    etape: Un algorigramme est fait de cases et de flèches qui décrivent des actions et des tests. À quoi peut-il servir ici
      ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel montre un principe avec des symboles, et lequel permet de vérifier des
      dimensions ?
  - si:
      diagnostic: associations_fausses
    relance: Reprends un par un. Qu'est-ce qui se dessine à la main, qu'est-ce qui se fait sur ordinateur, qu'est-ce qui décrit
      un programme ?
  solution: 'Croquis : chercher des idées. Schéma : montrer le principe avec des symboles. Modèle 3D : vérifier formes et
    dimensions. Algorigramme : décrire les étapes du programme.'
- id: rotation-en-translation
  type: choix
  difficulte: 2
  enonce: Dans le distributeur, un moteur tourne. Il doit faire coulisser une trappe en ligne droite pour laisser tomber les
    croquettes. Quels mécanismes transforment une rotation en translation ? Plusieurs réponses possibles.
  reponse:
    options:
    - id: a
      texte: Pignon et crémaillère
    - id: b
      texte: Système vis-écrou
    - id: c
      texte: Poulies et courroie
    - id: d
      texte: Deux roues dentées qui s'engrènent
    bonnes:
    - a
    - b
  indices:
    relance: Pour chaque mécanisme, la pièce qui reçoit le mouvement tourne-t-elle, ou avance-t-elle en ligne droite ?
    methode: Imagine le moteur qui fait tourner la première pièce, puis regarde comment bouge la dernière.
    etape: Avec deux poulies et une courroie, la deuxième poulie tourne aussi. Elle ne fait donc pas avancer la trappe en
      ligne droite.
  pieges:
  - si:
      contient:
      - c
    relance: Avec des poulies et une courroie, la seconde poulie tourne. Le mouvement est-il transformé, ou seulement transmis
      ?
  - si:
      contient:
      - d
    relance: Deux roues dentées tournent toutes les deux. Laquelle avancerait en ligne droite ?
  - si:
      diagnostic: incomplet
    relance: Il en manque un. Pense à une vis qu'on fait tourner dans une pièce qui ne peut pas tourner.
  solution: Le pignon qui tourne fait avancer la crémaillère en ligne droite ; la vis qui tourne fait avancer l'écrou. Poulies-courroie
    et engrenages transmettent une rotation sans la transformer.
- id: procedes-de-fabrication
  type: association
  difficulte: 2
  enonce: Associe chaque pièce du distributeur au procédé le mieux adapté pour la fabriquer au collège.
  reponse:
    gauche:
    - id: facade
      texte: Façade plate découpée dans du contreplaqué de 3 mm
    - id: support
      texte: Support du moteur, petite pièce en volume de forme compliquée
    - id: goulotte
      texte: Goulotte faite d'une plaque de plastique pliée en forme de L
    droite:
    - id: laser
      texte: Découpe laser
    - id: impression
      texte: Impression 3D
    - id: pliage
      texte: Pliage à chaud
    - id: injection
      texte: Moulage par injection en usine
    paires:
      facade: laser
      support: impression
      goulotte: pliage
  indices:
    relance: Quelle machine découpe des formes dans une plaque plate ?
    methode: Pour chaque pièce, regarde si elle est plate, en volume ou pliée, puis cherche le procédé qui produit ce type
      de forme au collège.
    etape: Une pièce en volume, de forme compliquée, se fabrique couche par couche. Quelle machine fait cela ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Le moulage par injection se fait-il au collège, pour un seul prototype ?
  - si:
      diagnostic: associations_fausses
    relance: Classe d'abord les pièces en trois familles, plate, en volume, pliée. Puis associe chaque famille à une machine
      du collège.
  solution: 'Façade plate : découpe laser. Support du moteur en volume : impression 3D. Goulotte en L : pliage à chaud. Le
    moulage par injection sert en usine, pour de grandes séries.'
- id: regles-securite-atelier
  type: choix
  difficulte: 1
  enonce: Pendant la fabrication du prototype, quels comportements respectent les règles de sécurité de l'atelier ? Plusieurs
    réponses possibles.
  reponse:
    options:
    - id: a
      texte: Porter des lunettes de protection pendant le perçage
    - id: b
      texte: Attendre la fin de l'impression 3D sans toucher la buse chaude
    - id: c
      texte: Ouvrir le capot de la découpeuse laser pendant la découpe pour mieux voir
    - id: d
      texte: Garder les cheveux longs détachés près de la perceuse
    bonnes:
    - a
    - b
  indices:
    relance: Pour chaque comportement, quel danger pourrait blesser l'élève, les yeux, une brûlure, un cheveu happé ?
    methode: Élimine chaque comportement qui expose une partie du corps à la machine.
    etape: Le capot de la découpeuse laser protège les yeux du rayon et limite les fumées. Faut-il l'ouvrir pendant la découpe
      ?
  pieges:
  - si:
      contient:
      - c
    relance: Le rayon laser peut abîmer les yeux et la découpe dégage des fumées. Le capot doit-il rester ouvert ou fermé
      pendant la découpe ?
  - si:
      contient:
      - d
    relance: Que peut-il arriver à des cheveux longs près d'un foret qui tourne très vite ?
  - si:
      diagnostic: incomplet
    relance: Il en manque un. Pense aussi aux brûlures, pas seulement aux yeux.
  solution: 'Lunettes pendant le perçage et buse chaude qu''on ne touche pas : ce sont des règles de sécurité. Le capot de
    la découpeuse laser reste fermé, et les cheveux longs sont attachés.'
- id: ordre-demarche-prototype
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre la démarche pour réaliser un prototype.
  reponse:
    elements:
    - id: cdc
      texte: Relire le cahier des charges et noter les fonctions à assurer
    - id: croquis
      texte: Dessiner plusieurs solutions en croquis et en choisir une
    - id: modele
      texte: Modéliser les pièces en 3D
    - id: fabrication
      texte: Fabriquer les pièces et les assembler
    - id: essai
      texte: Essayer le prototype et noter les améliorations
  indices:
    relance: Peut-on fabriquer une pièce avant de savoir ce que l'objet doit faire ?
    methode: 'On va de l''idée vers la fabrication : d''abord le besoin, puis les idées, puis le dessin précis, puis la fabrication,
      puis le contrôle.'
    etape: La première étape consiste à relire ce que l'objet doit faire. Que fait-on ensuite pour trouver des idées ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Peut-on fabriquer une pièce avant d'avoir dessiné sa forme précise ?
  - si:
      diagnostic: ordre_faux
    relance: Place d'abord la première étape (le besoin) et la dernière (on essaie l'objet), puis range celles du milieu.
  solution: On relit le cahier des charges, on dessine plusieurs solutions en croquis et on en choisit une, on modélise les
    pièces en 3D, on les fabrique et on les assemble, puis on essaie le prototype.
- id: justifier-solution-distributeur
  type: ouverte
  difficulte: 3
  enonce: 'Cahier des charges du distributeur : donner 3 repas par jour à heures fixes ; le chat ne doit pas pouvoir ouvrir
    le réservoir ; l''adulte doit pouvoir le remplir et le nettoyer facilement. Solution A : réservoir fermé par un couvercle
    à clips, trappe à pignon-crémaillère commandée par une carte programmée. Solution B : réservoir ouvert qui remplit la
    gamelle en continu, par gravité. Choisis une solution et justifie ton choix à l''aide du cahier des charges.'
  criteres:
  - L'élève compare les deux solutions à au moins deux critères du cahier des charges (heures fixes, réservoir inaccessible
    au chat, remplissage et nettoyage).
  - L'élève parle de l'ergonomie pour l'adulte (couvercle facile à ouvrir, nettoyage) ou de la sécurité pour l'animal.
  - L'élève conclut par un choix cohérent avec ses arguments.
  indices:
    relance: Avec la solution B, le chat peut-il manger quand il veut ? Est-ce ce que demande le cahier des charges ?
    methode: Reprends les trois critères un par un, et regarde si chaque solution le respecte.
    etape: 'Commence par « 3 repas à heures fixes » : quelle solution permet de choisir l''heure d''ouverture de la trappe
      ?'
  solution: 'A respecte les trois critères : la carte programmée ouvre la trappe aux heures fixées, le couvercle à clips empêche
    le chat d''ouvrir le réservoir, et l''adulte l''ouvre facilement pour remplir et nettoyer. B ne respecte pas les heures
    fixes (la gamelle est toujours remplie) et laisse le réservoir ouvert. Je choisis A.'
- id: nblm-quelle-est-la-difference-fondamentale-en-1
  type: choix
  difficulte: 2
  enonce: Quelle est la différence fondamentale entre une maquette et un prototype ?
  reponse:
    options:
    - id: o1
      texte: Le prototype est un premier exemplaire qui fonctionne réellement, tandis que la maquette montre surtout la forme
        ou l'aspect.
    - id: o2
      texte: La maquette est toujours fabriquée en métal, alors que le prototype est uniquement en plastique.
    - id: o3
      texte: Le prototype est un dessin à main levée, alors que la maquette est un fichier informatique.
    - id: o4
      texte: La maquette est le produit final vendu en magasin, tandis que le prototype est jeté immédiatement.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la capacité de l'objet à réaliser des fonctions techniques et à fonctionner.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le choix du matériau dépend du besoin et du cahier des charges, et non de la distinction entre maquette et prototype.
  - si:
      contient:
      - o3
    relance: Un dessin à main levée est un croquis et un fichier informatique est une modélisation 3D ; ni l'un ni l'autre
      ne définit une maquette ou un prototype physique.
  - si:
      contient:
      - o4
    relance: La maquette est un outil de conception visuel et le prototype sert aux essais ; aucun des deux n'est le produit
      fini commercialisé.
  solution: Le prototype est un premier exemplaire qui fonctionne réellement, tandis que la maquette montre surtout la forme
    ou l'aspect. Le prototype est un premier exemplaire fonctionnel permettant de tester la solution technique en conditions
    réelles, contrairement à la maquette qui privilégie la représentation visuelle ou volumique.
- id: nblm-a-quoi-sert-principalement-le-croquis-a-2
  type: choix
  difficulte: 2
  enonce: À quoi sert principalement le croquis à main levée lors de la conception d'une solution technique ?
  reponse:
    options:
    - id: o1
      texte: À imaginer et comparer rapidement plusieurs idées de solutions au début de la recherche.
    - id: o2
      texte: À piloter directement une imprimante 3D ou une découpeuse laser.
    - id: o3
      texte: À mesurer précisément la vitesse de rotation des engrenages.
    - id: o4
      texte: À remplacer le cahier des charges du projet.
    bonnes:
    - o1
  indices:
    relance: Pense à la phase initiale de recherche d'idées où la rapidité de dessin est essentielle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Les machines de fabrication d'un atelier nécessitent des fichiers numériques structurés (fichiers CAO ou vectoriels),
      pas un dessin fait à la main.
  - si:
      contient:
      - o3
    relance: La mesure des performances s'effectue avec des instruments de mesure et un protocole de test, pas avec un croquis.
  - si:
      contient:
      - o4
    relance: Le croquis représente une idée de solution technique, il ne remplace pas le document fixant les exigences et
      fonctions (cahier des charges).
  solution: À imaginer et comparer rapidement plusieurs idées de solutions au début de la recherche. Le croquis à main levée
    est simple et rapide à réaliser, ce qui permet d'exprimer et de comparer plusieurs pistes d'idées au sein de l'équipe.
- id: nblm-quel-mecanisme-permet-de-transformer-une-3
  type: choix
  difficulte: 2
  enonce: Quel mécanisme permet de transformer une rotation en translation dans un objet technique ?
  reponse:
    options:
    - id: o1
      texte: Le système pignon-crémaillère.
    - id: o2
      texte: L'engrenage à roues dentées.
    - id: o3
      texte: Le système poulies-courroie.
    - id: o4
      texte: La chaîne et les pignons.
    bonnes:
    - o1
  indices:
    relance: Pense à la combinaison d'une roue dentée circulaire et d'une barre dentée rectiligne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un engrenage transmet un mouvement de rotation entre deux axes, sans le transformer en translation.
  - si:
      contient:
      - o3
    relance: Les poulies et la courroie transmettent un mouvement de rotation d'un axe à un autre.
  - si:
      contient:
      - o4
    relance: La chaîne et les pignons transmettent un mouvement de rotation entre deux axes éloignés.
  solution: Le système pignon-crémaillère. La rotation du pignon engrené sur la crémaillère entraîne le déplacement linéaire
    de celle-ci en translation.
- id: nblm-quelle-regle-de-securite-essentielle-doi-4
  type: choix
  difficulte: 2
  enonce: Quelle règle de sécurité essentielle doit-on respecter dans l'atelier lors de l'utilisation d'une machine comme
    la découpeuse laser ?
  reponse:
    options:
    - id: o1
      texte: Garder le capot fermé pendant le fonctionnement, porter des protections et utiliser la machine seulement après
        autorisation.
    - id: o2
      texte: Démarrer n'importe quelle machine sans demander l'accord du professeur pour gagner du temps.
    - id: o3
      texte: Toucher les pièces directement pendant la découpe pour vérifier la température.
    - id: o4
      texte: Travailler les cheveux détachés sans lunettes de protection à proximité des machines.
    bonnes:
    - o1
  indices:
    relance: Considère les équipements de protection individuelle et les règles d'usage des machines dans l'atelier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Toute machine de l'atelier ne doit être utilisée qu'après autorisation formelle et sous surveillance de l'enseignant.
  - si:
      contient:
      - o3
    relance: Il ne faut jamais toucher des pièces en cours de fabrication ou brûlantes sous peine de se blesser gravement.
  - si:
      contient:
      - o4
    relance: Les cheveux longs doivent être attachés et les lunettes portées pour éviter les risques d'entrainement et de
      projections.
  solution: Garder le capot fermé pendant le fonctionnement, porter des protections et utiliser la machine seulement après
    autorisation. Ces consignes protègent contre les risques liés au faisceau laser, aux émanations et aux fausses manœuvres
    en atelier.
- id: nblm-pourquoi-realise-t-on-un-premier-prototy-5
  type: choix
  difficulte: 2
  enonce: Pourquoi réalise-t-on un premier prototype fonctionnel avant de fabriquer un nouvel objet technique ?
  reponse:
    options:
    - id: o1
      texte: Pour tester la solution et vérifier qu'elle fonctionne correctement avant de lancer la production.
    - id: o2
      texte: Pour le vendre immédiatement au client final sans effectuer d'essais.
    - id: o3
      texte: Pour éviter d'avoir à rédiger un cahier des charges.
    - id: o4
      texte: Pour remplacer le logiciel de modélisation 3D.
    bonnes:
    - o1
  indices:
    relance: Pense à l'étape indispensable d'expérimentation et de validation des performances du système.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un prototype est un modèle d'essai interne destiné aux tests, et non un produit directement commercialisé.
  - si:
      contient:
      - o3
    relance: Le cahier des charges est rédigé en amont pour fixer les critères que le prototype devra précisément valider.
  - si:
      contient:
      - o4
    relance: La modélisation 3D précède la fabrication du prototype afin de concevoir virtuellement les pièces à assembler.
  solution: Pour tester la solution et vérifier qu'elle fonctionne correctement avant de lancer la production. Le premier
    prototype fonctionnel permet d'expérimenter la solution réelle et de corriger d'éventuels défauts avant la fabrication
    définitive.
- id: nblm-quels-sont-les-deux-modes-de-representat-6
  type: choix
  difficulte: 3
  enonce: Quels sont les deux modes de représentation ou procédés clés utilisés lors du prototypage pour concevoir puis matérialiser
    les pièces d'un objet ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La modélisation 3D sur un logiciel de CAO.
    - id: o2
      texte: L'impression 3D pour fabriquer des pièces en volume.
    - id: o3
      texte: L'écriture d'un texte poétique sur l'objet.
    - id: o4
      texte: Le tirage au sort au hasard des dimensions des pièces.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche un outil numérique de conception en trois dimensions et un procédé de fabrication additive.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Un texte poétique n'est ni un mode de représentation technique ni un procédé de fabrication.
  - si:
      contient:
      - o4
    relance: Les dimensions des pièces doivent être déterminées rigoureusement selon les contraintes du cahier des charges.
  solution: La modélisation 3D sur un logiciel de CAO ; L'impression 3D pour fabriquer des pièces en volume. La modélisation
    3D permet de définir la géométrie précise des pièces et de préparer les fichiers de fabrication.
- id: nblm-complete-la-phrase-l-adaptation-d-un-obj-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : L''adaptation d''un objet technique à son utilisateur pour le rendre facile, confortable et
    sûr d''emploi s''appelle l''__________.'
  reponse:
    acceptees:
    - ergonomie
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par un 'e' et concerne la prise en main et la facilité d'utilisation d'un objet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: ergonomie. L'ergonomie est la démarche visant à adapter l'objet aux capacités et besoins de la personne qui l'utilise.
- id: nblm-complete-la-phrase-en-plus-du-pignon-cre-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : En plus du pignon-crémaillère, le système __________ permet également de transformer une rotation
    en translation.'
  reponse:
    acceptees:
    - vis-écrou
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'un mécanisme composé d'une tige filetée et d'un élément taraudé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: vis-écrou. Le système vis-écrou convertit le mouvement de rotation de la vis (ou de l'écrou) en une translation
    rectiligne.
