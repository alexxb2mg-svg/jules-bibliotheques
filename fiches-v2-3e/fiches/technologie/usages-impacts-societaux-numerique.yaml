# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: usages-impacts-societaux-numerique
version: 2
etat: verifiee
declencheurs:
- mot de passe
- double authentification
- traces numériques
- harcèlement en ligne
- usurpation d'identité
- bits et octets
- arborescence de fichiers
- droit à l'image
- protéger ses données personnelles
- réutiliser une image trouvée
prerequis: []
essentiel: 'Un système d''information sert à collecter, stocker, traiter et partager des informations. Exemple : l''espace
  numérique de travail (ENT) du collège, où l''on retrouve ses cours, ses notes et ses messages.


  Recenser, classer, représenter. Recenser, c''est faire la liste des données. Classer, c''est les ranger selon un critère
  (date, auteur). Représenter, c''est les montrer sous une forme lisible (tableau, graphique).


  Les fichiers. Les données sont enregistrées dans des fichiers. L''extension, après le point, donne le type : .txt (texte),
  .jpg ou .png (image), .mp3 (son), .mp4 (vidéo), .csv ou .xlsx (tableau). Les fichiers sont rangés dans des dossiers et des
  sous-dossiers : c''est l''arborescence. Le chemin d''accès dit où trouver un fichier, par exemple Documents/Techno/exposé.docx.


  Le stockage. On stocke sur l''appareil (disque, clé USB) ou en ligne, dans le « nuage » (des serveurs distants). Une sauvegarde
  est une copie faite ailleurs, pour ne rien perdre en cas de panne.


  Les unités. Le bit vaut 0 ou 1. 1 octet = 8 bits. 1 ko = 1 000 octets ; 1 Mo = 1 000 ko ; 1 Go = 1 000 Mo ; 1 To = 1 000
  Go. Pour comparer des tailles, on les convertit dans la même unité.


  La cybersécurité. Un mot de passe robuste est long (12 caractères ou plus), mélange lettres, chiffres et symboles, et sert
  pour un seul compte. La double authentification demande une deuxième preuve (un code reçu sur le téléphone). On fait les
  mises à jour. On se méfie des messages qui demandent un mot de passe ou promettent un cadeau : c''est l''hameçonnage.


  Les données personnelles. Elles permettent d''identifier une personne : nom, photo, adresse, localisation. Chaque action
  en ligne laisse des traces numériques, parfois conservées longtemps : un contenu « supprimé » peut avoir été copié. La CNIL
  veille à la protection des données personnelles.


  La propriété intellectuelle. Un texte, une image, une musique ont un auteur. On les réutilise seulement avec son accord,
  par exemple grâce à une licence libre, et on cite l''auteur. Publier la photo d''une personne demande aussi son accord.


  La cyberviolence. Harcèlement en ligne, moqueries répétées, diffusion d''images sans accord, usurpation d''identité. Partager,
  même « pour rire », c''est participer et engager sa responsabilité. Victime ou témoin : ne pas répondre ni partager, garder
  une capture, signaler, en parler à un adulte de confiance, appeler le 3018 (gratuit).

  '
methode:
- Pour un fichier, lire son extension pour connaître son type, et son chemin pour le retrouver dans l'arborescence.
- Pour ranger des données, les recenser, choisir un critère de classement, puis créer des dossiers et sous-dossiers aux noms
  clairs.
- Pour comparer des tailles, convertir toutes les valeurs dans la même unité avant de calculer.
- Pour sécuriser un compte, vérifier le mot de passe, la double authentification et les mises à jour, et se méfier des messages
  douteux.
- Avant de réutiliser une image, un texte ou une musique, chercher l'auteur et la licence, puis citer l'auteur.
- Devant une situation de cyberviolence, ne pas partager, garder des preuves, signaler et en parler à un adulte.
vocabulaire:
- terme: Bit
  definition: Plus petite unité d'information, qui vaut 0 ou 1.
- terme: Octet
  definition: Groupe de 8 bits.
- terme: Arborescence
  definition: Organisation des fichiers en dossiers et sous-dossiers, comme les branches d'un arbre.
- terme: Système d'information
  definition: Ensemble de moyens qui permettent de collecter, stocker, traiter et partager des informations.
- terme: Sauvegarde
  definition: Copie de fichiers faite ailleurs, pour les retrouver en cas de panne ou de perte.
- terme: Authentification
  definition: Preuve de son identité pour accéder à un compte (mot de passe, code reçu, empreinte digitale).
- terme: Données personnelles
  definition: Informations qui permettent d'identifier une personne (nom, photo, adresse, localisation).
- terme: Traces numériques
  definition: Informations laissées par nos actions en ligne (historique, publications, localisation).
- terme: Hameçonnage
  definition: Message trompeur qui cherche à voler un mot de passe ou des informations bancaires.
- terme: Licence libre
  definition: Autorisation donnée par l'auteur de réutiliser son œuvre selon des conditions précises, dont citer son nom.
erreurs_frequentes:
- Croire qu'un contenu supprimé disparaît complètement d'Internet.
- Confondre bit et octet, ou oublier de convertir les unités (Go et Mo) avant de calculer.
- Penser qu'un mot de passe court avec son prénom et sa date de naissance est sûr.
- Croire que partager un contenu moqueur « pour rire » n'engage pas sa responsabilité.
- Croire qu'une image trouvée sur Internet est libre de droits et réutilisable sans autorisation.
exemple:
  enonce: Une vidéo de 2 Go et 300 photos de 5 Mo chacune tiennent-elles sur une clé de 4 Go (1 Go = 1 000 Mo) ?
  solution: 'Les photos occupent 300 × 5 = 1 500 Mo, soit 1,5 Go. Avec la vidéo : 2 + 1,5 = 3,5 Go. C''est moins que 4 Go
    : tout tient sur la clé.'
exercices:
- id: bits-dans-un-octet
  type: nombre
  difficulte: 1
  enonce: Combien de bits y a-t-il dans un octet ?
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Un octet est un petit groupe de bits. Te souviens-tu de sa taille ?
    methode: Relis la définition de l'octet dans la leçon.
    etape: Un octet s'écrit comme une suite de 0 et de 1, par exemple 01000001. Compte les chiffres de cette suite.
  pieges:
  - si:
      valeur: 10
    relance: Le kilo veut dire mille, mais l'octet n'est pas construit sur 10. Relis la définition de l'octet.
  - si:
      valeur: 1024
    relance: Ce nombre sert pour certains multiples (Kio). On te demande combien de bits il y a dans un seul octet.
  solution: 1 octet = 8 bits.
- id: extensions-fichiers
  type: association
  difficulte: 1
  enonce: 'Associe chaque fichier à son type. a : vacances.jpg ; b : chanson.mp3 ; c : expose.txt ; d : film.mp4. x : image
    ; y : son ; z : texte ; w : vidéo.'
  reponse:
    gauche:
    - id: a
      texte: vacances.jpg
    - id: b
      texte: chanson.mp3
    - id: c
      texte: expose.txt
    - id: d
      texte: film.mp4
    droite:
    - id: x
      texte: image
    - id: y
      texte: son
    - id: z
      texte: texte
    - id: w
      texte: vidéo
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Quelle partie du nom d'un fichier indique son type ?
    methode: Regarde les lettres après le point. Tu les as sûrement déjà vues sur un ordinateur ou un téléphone.
    etape: Les fichiers .mp3 et .mp4 se ressemblent, mais l'un n'a que du son et l'autre contient aussi des images animées.
      Commence par les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux fichiers dont l'extension commence par mp.
  - si:
      diagnostic: associations_fausses
    relance: Regarde l'extension de chaque fichier (après le point), pas seulement son nom.
  solution: 'a-x (.jpg : image), b-y (.mp3 : son), c-z (.txt : texte), d-w (.mp4 : vidéo).'
- id: photos-sur-cle-usb
  type: nombre
  difficulte: 2
  enonce: 'Document fictif : une clé USB a une capacité de 16 Go. Chaque photo prise avec un smartphone occupe 4 Mo. Combien
    de photos au maximum peut-on ranger sur la clé vide ? (1 Go = 1 000 Mo)'
  reponse:
    valeur: 4000
    forme: entier
  indices:
    relance: Les deux tailles sont-elles dans la même unité ?
    methode: Convertis la capacité de la clé en Mo, puis divise par la taille d'une photo.
    etape: 1 Go = 1 000 Mo. Écris la capacité de la clé en Mo, puis fais la division.
  pieges:
  - si:
      valeur: 4
    relance: Tu as divisé des Go par des Mo. Convertis d'abord la capacité de la clé en Mo.
  - si:
      valeur: 4096
    relance: L'énoncé dit que 1 Go = 1 000 Mo. Refais la conversion avec cette valeur.
  - si:
      valeur: 64000
    relance: Tu as multiplié. Pour savoir combien de photos entrent dans la clé, faut-il multiplier ou diviser ?
  solution: '16 Go = 16 000 Mo. Nombre de photos : 16 000 ÷ 4 = 4 000 photos.'
- id: proteger-son-compte
  type: choix
  difficulte: 1
  enonce: 'Quelles actions protègent ton compte de messagerie ? a : activer la double authentification ; b : utiliser le même
    mot de passe pour tous tes comptes ; c : installer les mises à jour ; d : donner ton mot de passe à ton meilleur ami ;
    e : cliquer sur le lien d''un message qui t''annonce que tu as gagné un cadeau.'
  reponse:
    options:
    - id: a
      texte: activer la double authentification
    - id: b
      texte: utiliser le même mot de passe partout
    - id: c
      texte: installer les mises à jour
    - id: d
      texte: donner ton mot de passe à ton meilleur ami
    - id: e
      texte: cliquer sur le lien du message cadeau
    bonnes:
    - a
    - c
  indices:
    relance: Pour chaque action, demande-toi si elle rend le travail d'un pirate plus facile ou plus difficile.
    methode: Un mot de passe doit rester secret et différent pour chaque compte. Les failles des logiciels sont corrigées
      au fil du temps.
    etape: 'L''action e est un piège classique : un message qui promet un cadeau cherche souvent à voler ton mot de passe.
      Examine les autres.'
  pieges:
  - si:
      contient:
      - b
    relance: Si un site se fait voler ses mots de passe, que se passe-t-il pour tes autres comptes qui ont le même ?
  - si:
      contient:
      - d
    relance: Un mot de passe partagé reste-t-il secret ? Même un ami peut le répéter ou se le faire voler.
  - si:
      contient:
      - e
    relance: Qui envoie des messages qui promettent des cadeaux avec un lien à cliquer ? Relis la définition de l'hameçonnage.
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une bonne action, mais il y en a une autre. Pense aux corrections que reçoivent les logiciels.
  solution: a et c. La double authentification demande une deuxième preuve ; les mises à jour corrigent des failles. Réutiliser
    ou partager un mot de passe et cliquer sur un lien douteux mettent ton compte en danger.
- id: se-faire-passer-pour-quelqu-un
  type: texte_court
  difficulte: 2
  enonce: 'Nomme en deux ou trois mots cette forme de cyberviolence : créer un faux compte avec le nom et la photo d''un camarade
    pour publier des messages à sa place.'
  reponse:
    acceptees:
    - usurpation d'identité
    - usurpation de son identité
    - vol d'identité
    fautes_tolerees: 1
  indices:
    relance: Le camarade n'a rien écrit. Qu'est-ce que l'auteur du faux compte lui a pris ?
    methode: Le nom de cette dérive associe un mot qui veut dire « prendre ce qui ne nous appartient pas » et un mot qui désigne
      qui on est.
    etape: Le deuxième mot est « identité ». Trouve le premier, qui commence par « usur ».
  pieges:
  - si:
      valeur: harcèlement
    relance: Le harcèlement, ce sont des attaques répétées. Ici, l'auteur se fait passer pour quelqu'un d'autre. Comment appelle-t-on
      cela ?
  solution: 'C''est une usurpation d''identité : l''auteur se fait passer pour quelqu''un d''autre. C''est puni par la loi.'
- id: photo-moqueuse-groupe-classe
  type: ouverte
  difficulte: 3
  enonce: Dans le groupe de discussion de la classe, un élève publie une photo moqueuse d'un camarade, prise sans son accord.
    Plusieurs élèves la partagent en riant. Inès la reçoit. Explique en quoi c'est grave pour le camarade, quelle est la responsabilité
    de ceux qui partagent, et ce qu'Inès peut faire.
  criteres:
  - 'L''élève explique l''atteinte subie : image diffusée sans accord (vie privée, droit à l''image), moquerie qui peut se
    répéter et se propager, c''est de la cyberviolence.'
  - L'élève dit que partager, c'est participer et engager sa responsabilité, même « pour rire ».
  - 'L''élève propose des actions adaptées : ne pas partager, garder une preuve, signaler le contenu, en parler à un adulte
    de confiance ou appeler le 3018.'
  indices:
    relance: Le camarade a-t-il donné son accord ? Combien de personnes vont voir cette photo ?
    methode: 'Fais trois parties : ce que vit la victime, le rôle de ceux qui partagent, puis ce qu''un témoin peut faire.'
    etape: 'Commence ainsi : « C''est grave parce que la photo a été diffusée sans son accord et... »'
  solution: 'La photo a été prise et diffusée sans accord : c''est une atteinte à la vie privée et une forme de cyberviolence
    ; elle peut circuler longtemps et blesser le camarade. Chaque élève qui la partage participe et est responsable. Inès
    ne la partage pas, garde une capture comme preuve, signale le contenu, en parle à un adulte de confiance, et peut appeler
    le 3018.'
- id: mo-en-ko
  type: nombre
  difficulte: 2
  enonce: Un fichier pèse 2,5 Mo. Quelle est sa taille en ko ? (1 Mo = 1 000 ko)
  reponse:
    valeur: 2500
    forme: libre
  indices:
    relance: Un Mo contient plusieurs ko. Faut-il multiplier ou diviser pour passer d'une grande unité à une petite ?
    methode: Pour passer de Mo à ko, multiplie par le nombre de ko contenus dans 1 Mo.
    etape: Écris la multiplication de 2,5 par mille et calcule-la.
  pieges:
  - si:
      valeur: 2.5
    relance: 'Tu n''as pas converti : le nombre est resté le même. Combien de ko y a-t-il dans un seul Mo ?'
  - si:
      valeur: 2500000
    relance: 'Tu as converti en octets. L''énoncé demande des ko : s''arrête-t-on après une seule conversion ?'
  - si:
      valeur: 0.0025
    relance: 'Tu as divisé. Un Mo est une plus grande unité que le ko : le nombre de ko doit être plus grand.'
  solution: 1 Mo = 1 000 ko, donc 2,5 Mo = 2,5 × 1 000 = 2 500 ko.
- id: reutiliser-une-image
  type: choix
  difficulte: 2
  enonce: 'Quelles réutilisations sont permises ? a : une photo que tu as prise toi-même ; b : une image copiée depuis un
    moteur de recherche sans regarder sa licence ; c : une image sous licence libre, avec le nom de l''auteur cité ; d : la
    photo d''un camarade publiée sans lui demander.'
  reponse:
    options:
    - id: a
      texte: une photo que tu as prise toi-même
    - id: b
      texte: une image copiée sans regarder sa licence
    - id: c
      texte: une image sous licence libre, auteur cité
    - id: d
      texte: la photo d'un camarade publiée sans lui demander
    bonnes:
    - a
    - c
  indices:
    relance: 'Pour chaque proposition, demande-toi : l''auteur (ou la personne photographiée) a-t-il donné son accord ?'
    methode: Une image trouvée en ligne appartient à son auteur, sauf indication contraire. Une licence libre fixe les conditions
      de réutilisation.
    etape: 'Une des propositions concerne ton propre travail. Une autre suit les règles d''une licence : cherche-les.'
  pieges:
  - si:
      contient:
      - b
    relance: Trouver une image en ligne ne veut pas dire qu'elle est libre de droits. Qui décide de sa réutilisation ?
  - si:
      contient:
      - d
    relance: Une personne photographiée doit être d'accord pour que sa photo soit publiée. L'a-t-elle donné ici ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une bonne réponse, mais il y en a une autre. Cherche une image dont la réutilisation est autorisée.
  solution: a et c. Ta propre photo t'appartient. Une image sous licence libre se réutilise en respectant ses conditions,
    dont citer l'auteur. Copier sans regarder la licence ou publier la photo d'un camarade sans son accord n'est pas permis.
