# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: programmation-nouvelle-fonctionnalite
version: 2
etat: verifiee
declencheurs:
- carte microcontrôleur
- valeur du capteur de luminosité
- éclairage à détecteur de présence
- données d'entrée et de sortie
- opérateur ET OU NON
- variable et affectation
- instruction si alors sinon
- simuler le programme pas à pas
prerequis:
- chaine-information
- 4e-programme-analyse-donnees
essentiel: 'Le programme d''un objet technique (éclairage automatique, portail, serre...) est exécuté par une carte microcontrôleur.

  Il lit des ENTRÉES (valeurs des capteurs, boutons) et commande des SORTIES (lampe, moteur, écran, buzzer).


  Une variable est une case mémoire qui porte un nom et contient une valeur : un nombre (lum ← 280), un booléen (vrai ou faux)
  ou un mot (« Porte ouverte »).

  L''affectation (lum ← 280, ou le bloc « mettre lum à 280 ») range une valeur dans la variable. Elle remplace l''ancienne
  valeur.

  Une liste range plusieurs valeurs sous un seul nom, par exemple une série de mesures.


  Les opérateurs arithmétiques (+, −, ×, ÷) calculent ; les comparaisons (<, >, =) et les opérateurs logiques ET, OU, NON
  donnent vrai ou faux.

  A ET B est vrai seulement si les deux sont vrais ; A OU B est vrai si au moins l''un est vrai ; NON A inverse A.

  Exemple : avec lum = 250 et presence = faux, « lum < 300 ET presence = vrai » est faux, mais « lum < 300 OU presence = vrai
  » est vrai.


  L''instruction conditionnelle (si... alors... sinon) choisit une action selon une condition.

  Les instructions itératives (boucles) répètent des actions : un nombre de fois, tant qu''une condition est vraie, ou indéfiniment.

  Un événement (appui sur un bouton, démarrage de la carte) déclenche une suite d''instructions.


  Modifier un paramètre (un seuil, une durée) change le comportement de l''objet : on prévoit l''effet en simulant le programme
  pas à pas, dans un tableau avec une ligne par tour de boucle.

  Exemple : passer le seuil de 300 à 200 fait allumer la lampe plus tard, quand il fait plus sombre.


  La programmation graphique par blocs et la programmation textuelle expriment les mêmes idées.


  Au brevet, on attend que tu saches : repérer entrées et sorties, donner le type d''une variable, évaluer une condition avec
  ET, OU, NON, simuler quelques tours de boucle, traduire le programme en français et prévoir l''effet d''un changement de
  paramètre.'
methode:
- Repérer les entrées (capteurs, boutons) et les sorties (actionneurs, affichage) du programme.
- Lister les variables, leur type (nombre, booléen, mot) et leur valeur de départ.
- Simuler le programme pas à pas dans un tableau, une ligne par tour, en notant les valeurs des variables et l'état des sorties.
- Pour chaque condition, calculer chaque morceau (vrai ou faux), puis appliquer ET, OU, NON.
- Pour une nouvelle fonctionnalité, écrire d'abord en français ce qui doit se passer, puis modifier la condition ou le paramètre
  concerné, et simuler de nouveau.
vocabulaire:
- terme: entrée
  definition: Donnée reçue par le programme (valeur d'un capteur, appui sur un bouton).
- terme: sortie
  definition: Ordre envoyé par le programme à un actionneur ou à un affichage (allumer une lampe, faire tourner un moteur).
- terme: booléen
  definition: Valeur qui ne peut être que vrai ou faux.
- terme: événement
  definition: Fait qui déclenche une partie du programme (appui sur un bouton, démarrage de la carte).
- terme: variable
  definition: Case mémoire qui porte un nom et contient une valeur qui peut changer.
- terme: affectation
  definition: Instruction qui range une valeur dans une variable (lum ← 280).
- terme: condition
  definition: Test qui donne vrai ou faux et qui décide si une action est exécutée.
- terme: boucle
  definition: Instruction itérative qui répète des actions.
- terme: seuil
  definition: Valeur limite qu'on compare à la mesure d'un capteur pour décider d'une action.
erreurs_frequentes:
- Confondre ET et OU dans une condition (la lampe s'allume alors en plein jour).
- Inverser le sens d'une comparaison (écrire lum > seuil au lieu de lum < seuil).
- Lire la valeur du capteur une seule fois, avant la boucle, au lieu de la relire à chaque tour.
- Oublier « attendre » dans une boucle infinie, ce qui fait lire et commander trop vite.
- Prendre un capteur pour une sortie ou un actionneur pour une entrée.
exemple:
  enonce: 'Un éclairage extérieur suit la règle : si lum < 300 ET presence = vrai alors allumer la lampe, sinon l''éteindre.
    À un instant, lum = 250 et presence = faux. Que fait la lampe ?'
  solution: 'lum < 300 est vrai (250 est plus petit que 300). presence = vrai est faux. Vrai ET faux donne faux : la lampe
    est éteinte.'
exercices:
- id: types-de-donnees
  type: association
  difficulte: 1
  enonce: Associe chaque affectation du programme d'une porte de garage au type de la valeur rangée dans la variable.
  reponse:
    gauche:
    - id: a
      texte: lum ← 280
    - id: b
      texte: presence ← vrai
    - id: c
      texte: message ← « Porte ouverte »
    - id: d
      texte: porte_fermee ← faux
    droite:
    - id: x
      texte: nombre
    - id: y
      texte: booléen
    - id: z
      texte: mot (texte)
    paires:
      a: x
      b: y
      c: z
      d: y
  indices:
    relance: Quelles valeurs ne peuvent être que vrai ou faux ?
    methode: 'Regarde seulement ce qui est à droite de la flèche : des chiffres, un texte entre guillemets, ou vrai/faux ?'
    etape: 280 est écrit avec des chiffres, c'est une quantité. Continue avec les trois autres affectations.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Un texte entre guillemets peut-il être vrai ou faux ?
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque ligne en te demandant si la valeur est une quantité, un texte ou une réponse vrai/faux.
  solution: a-x (280 est un nombre), b-y et d-y (vrai et faux sont des booléens), c-z (« Porte ouverte » est un mot, un texte).
- id: lampe-entree-ou-sortie
  type: texte_court
  difficulte: 1
  enonce: Dans le programme d'un éclairage à détecteur de présence, la carte microcontrôleur commande une lampe. Pour le programme,
    la lampe est-elle une entrée ou une sortie ?
  reponse:
    acceptees:
    - sortie
    - une sortie
    - sortie du programme
  indices:
    relance: La lampe donne-t-elle une information à la carte, ou reçoit-elle un ordre de la carte ?
    methode: Un capteur ou un bouton envoie une information au programme ; un actionneur exécute un ordre du programme.
    etape: La lampe est un actionneur. Quel mot désigne ce que le programme commande ?
  pieges:
  - si:
      valeur: entrée
    relance: Une entrée apporte une information au programme, comme le détecteur de présence. La lampe mesure-t-elle quelque
      chose ?
  solution: 'La lampe est une sortie : le programme lui envoie l''ordre de s''allumer ou de s''éteindre.'
- id: simuler-eclairage
  type: nombre
  difficulte: 2
  enonce: "Voici le programme d'un éclairage de jardin :\n  Au démarrage : seuil ← 300\n  Répéter indéfiniment :\n    lum\
    \ ← valeur du capteur de luminosité\n    presence ← état du détecteur de présence (vrai ou faux)\n    Si lum < seuil ET\
    \ presence = vrai alors allumer la lampe\n    Sinon éteindre la lampe\n    Attendre 0,5 s\nPendant trois tours, les capteurs\
    \ donnent :\n  premier tour : lum = 450, presence = vrai\n  deuxième tour : lum = 280, presence = faux\n  troisième tour\
    \ : lum = 120, presence = vrai\nSur ces trois tours, combien de fois la lampe est-elle allumée ?\n"
  reponse:
    valeur: 1
    forme: entier
  indices:
    relance: Pour chaque tour, la condition lum < seuil est-elle vraie ? Et presence = vrai ?
    methode: Fais un tableau avec une ligne par tour et trois colonnes (lum < seuil, presence = vrai, résultat du ET). La
      lampe s'allume seulement si le ET donne vrai.
    etape: 'Premier tour : 450 < 300 est faux, donc le ET donne faux et la lampe reste éteinte. Fais pareil pour les deux
      autres tours.'
  pieges:
  - si:
      valeur: 3
    relance: Tu as allumé la lampe dès qu'une des deux conditions était vraie. Est-ce ET ou OU qui est écrit dans le programme
      ?
  - si:
      valeur: 2
    relance: As-tu vérifié aussi le détecteur de présence au deuxième tour ?
  - si:
      diagnostic: valeur_fausse
    relance: Reprends ton tableau tour par tour. Avec ET, il faut que les deux conditions soient vraies en même temps.
  solution: 'Premier tour : 450 < 300 est faux, lampe éteinte. Deuxième tour : 280 < 300 est vrai mais presence est faux,
    lampe éteinte. Troisième tour : 120 < 300 est vrai et presence est vrai, lampe allumée. La lampe est allumée 1 fois.'
- id: bouton-marche-forcee
  type: choix
  difficulte: 2
  enonce: 'L''éclairage de jardin s''allume avec la condition « lum < seuil ET presence = vrai ». Nouvelle fonctionnalité
    : un bouton doit aussi allumer la lampe, même en plein jour. La variable bouton vaut vrai quand on appuie. Quelle nouvelle
    condition faut-il écrire ?'
  reponse:
    options:
    - id: a
      texte: (lum < seuil ET presence = vrai) OU bouton = vrai
    - id: b
      texte: (lum < seuil ET presence = vrai) ET bouton = vrai
    - id: c
      texte: lum < seuil ET (presence = vrai OU bouton = vrai)
    - id: d
      texte: NON (lum < seuil) OU bouton = vrai
    bonnes:
    - a
  indices:
    relance: Le bouton seul doit suffire à allumer la lampe. Faut-il ET ou OU devant « bouton = vrai » ?
    methode: Teste chaque condition en plein jour (lum grande), sans personne, avec le bouton appuyé. Puis teste-la de nuit,
      avec quelqu'un, sans le bouton.
    etape: En plein jour, lum < seuil est faux. Dans chaque proposition, regarde si la condition peut quand même être vraie
      grâce au bouton.
  pieges:
  - si:
      contient:
      - b
    relance: Avec ce ET, la nuit, une personne qui passe sans appuyer sur le bouton allume-t-elle encore la lampe ?
  - si:
      contient:
      - c
    relance: En plein jour, lum < seuil est faux. Que donne alors « faux ET ... », quel que soit le bouton ?
  - si:
      contient:
      - d
    relance: En plein jour, sans appui sur le bouton, que vaut NON (lum < seuil) ? La lampe resterait-elle éteinte ?
  solution: 'Il faut garder l''ancienne condition et ajouter le bouton avec OU : (lum < seuil ET presence = vrai) OU bouton
    = vrai. En plein jour, la parenthèse est fausse, mais le bouton suffit à rendre la condition vraie.'
- id: changer-le-seuil
  type: nombre
  difficulte: 3
  enonce: "Pour prévoir l'effet d'un nouveau réglage, on rejoue une liste de mesures de luminosité enregistrées la veille\
    \ :\n  mesures ← [450, 280, 120, 190, 260, 150]\n  seuil ← 200\n  nb ← 0\n  Pour chaque valeur m de la liste mesures :\n\
    \    Si m < seuil alors nb ← nb + 1\nAvant la modification, seuil valait 300. Que vaut nb à la fin, avec le nouveau seuil\
    \ ?\n"
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Quelles valeurs de la liste sont plus petites que le nouveau seuil ?
    methode: Parcours la liste dans l'ordre. Pour chaque valeur, compare-la au seuil ; si elle est plus petite, ajoute 1 à
      nb.
    etape: 450 < 200 est faux, nb ne change pas. 280 < 200 est faux aussi. Continue avec 120.
  pieges:
  - si:
      valeur: 5
    relance: Tu as compté avec l'ancien seuil. Quelle valeur de seuil est affectée juste avant le parcours de la liste ?
  - si:
      valeur: 6
    relance: As-tu compté toutes les mesures ? Seules celles qui vérifient m < seuil font augmenter nb.
  - si:
      diagnostic: valeur_fausse
    relance: Reprends la liste valeur par valeur et note nb après chaque comparaison.
  solution: 'On compare chaque mesure à 200 : 450 non, 280 non, 120 oui, 190 oui, 260 non, 150 oui. nb vaut 3 à la fin (il
    valait 5 avec l''ancien seuil de 300) : la lampe s''allumera moins souvent.'
- id: conditions-logiques
  type: choix
  difficulte: 2
  enonce: Dans un programme d'éclairage, on a lum = 250, seuil = 300 et presence = faux. Quelles conditions sont vraies ?
  reponse:
    options:
    - id: et-lum-presence
      texte: lum < seuil ET presence = vrai
    - id: ou-lum-presence
      texte: lum < seuil OU presence = vrai
    - id: non-presence
      texte: NON (presence = vrai)
    - id: ou-sup-presence
      texte: lum > seuil OU presence = vrai
    bonnes:
    - ou-lum-presence
    - non-presence
  indices:
    relance: Pour chaque condition, calcule d'abord chaque morceau (vrai ou faux), puis applique l'opérateur.
    methode: ET demande deux morceaux vrais. OU demande au moins un morceau vrai. NON inverse le résultat.
    etape: 'Commence par les morceaux : 250 < 300 est vrai ; presence = vrai est faux ; 250 > 300 est faux. Combine-les ensuite.'
  pieges:
  - si:
      contient:
      - et-lum-presence
    relance: Avec ET, il faut que les deux morceaux soient vrais. Le second morceau l'est-il ici ?
  - si:
      contient:
      - ou-sup-presence
    relance: Avec OU, un seul morceau vrai suffit. Ici, les deux morceaux sont-ils vrais ou faux ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé, mais pas toutes. Reprends chaque condition que tu n'as pas cochée.
  solution: '250 < 300 est vrai et presence = vrai est faux. ET donne faux ; OU donne vrai ; NON (faux) donne vrai ; 250 >
    300 est faux et le second morceau est faux, donc OU donne faux. Sont vraies : la condition avec OU sur lum < seuil, et
    NON (presence = vrai).'
- id: traduire-en-langage-naturel
  type: ouverte
  difficulte: 3
  enonce: "Traduis ce programme de ventilateur de serre en un algorithme écrit en français, puis dis quelles sont ses entrées\
    \ et ses sorties :\n  Répéter indéfiniment :\n    t ← valeur du capteur de température\n    Si t > 28 OU bouton = vrai\
    \ alors mettre le ventilateur en marche\n    Sinon arrêter le ventilateur\n    Attendre 1 s\n"
  criteres:
  - L'algorithme dit en français que, en permanence, on mesure la température et on met le ventilateur en marche s'il fait
    plus de 28 °C ou si l'on appuie sur le bouton, sinon on l'arrête.
  - L'élève cite les entrées (capteur de température, bouton) et la sortie (ventilateur).
  - L'élève explique le rôle du OU (une seule des deux conditions suffit).
  indices:
    relance: Que fait la carte à chaque tour, dans l'ordre ?
    methode: Lis le programme ligne par ligne et écris une phrase pour chaque ligne, puis classe les éléments en « informations
      reçues » et « ordres envoyés ».
    etape: 'Première phrase possible : « Sans arrêt, la carte mesure la température de la serre. » Continue avec la condition.'
  solution: 'Algorithme : sans arrêt, mesurer la température ; s''il fait plus de 28 °C ou si l''on appuie sur le bouton,
    mettre le ventilateur en marche, sinon l''arrêter ; attendre une seconde avant de recommencer. Entrées : capteur de température,
    bouton. Sortie : ventilateur. Avec OU, il suffit qu''une des deux conditions soit vraie.'
- id: nblm-quel-composant-d-un-systeme-technique-es-1
  type: choix
  difficulte: 2
  enonce: Quel composant d'un système technique est chargé d'exécuter le programme qui lit les entrées et commande les sorties
    ?
  reponse:
    options:
    - id: o1
      texte: La carte microcontrôleur
    - id: o2
      texte: Le capteur de luminosité
    - id: o3
      texte: L'actionneur de sortie
    - id: o4
      texte: La mémoire utilisateur
    bonnes:
    - o1
  indices:
    relance: Réfléchis au composant électronique central et programmable qui traite les informations de la chaîne d'information.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : le capteur fournit une donnée d''entrée au système, mais il n''exécute pas le programme informatique.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : l''actionneur (comme une lampe ou un moteur) reçoit un ordre et l''exécute, mais il ne traite
      pas les données.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : la mémoire contient des données ou des variables, mais c''est le microcontrôleur qui exécute
      les instructions.'
  solution: 'La carte microcontrôleur. C''est exact : le programme d''un objet technique est exécuté par une carte microcontrôleur
    qui traite les données d''entrée et pilote les sorties.'
- id: nblm-dans-le-programme-d-un-eclairage-a-detec-2
  type: choix
  difficulte: 2
  enonce: Dans le programme d'un éclairage à détecteur de présence, comment classe-t-on la valeur du capteur de luminosité
    et la commande de la lampe ?
  reponse:
    options:
    - id: o1
      texte: La valeur du capteur est une donnée d'entrée et la commande de la lampe est une donnée de sortie.
    - id: o2
      texte: La valeur du capteur est une donnée de sortie et la commande de la lampe est une donnée d'entrée.
    - id: o3
      texte: Ce sont toutes les deux des données d'entrée du programme.
    - id: o4
      texte: Ce sont toutes les deux des variables internes sans lien avec les composants matériels.
    bonnes:
    - o1
  indices:
    relance: 'Pense au trajet des informations : d''où provient la mesure physique et vers quel composant va l''ordre d''action.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : confusion entre les flux d''information entrants (capteurs) et les flux sortants (actionneurs).'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : la lampe ne mesure aucune grandeur physique de l''environnement, elle reçoit une instruction
      de sortie.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : les entrées proviennent de capteurs physiques réels et les sorties agissent directement sur
      des actionneurs.'
  solution: 'La valeur du capteur est une donnée d''entrée et la commande de la lampe est une donnée de sortie. C''est exact
    : les mesures des capteurs constituent les entrées du programme, et les ordres envoyés aux actionneurs sont les sorties.'
- id: nblm-quelle-operation-consiste-a-enregistrer-3
  type: choix
  difficulte: 2
  enonce: Quelle opération consiste à enregistrer ou modifier une valeur dans une variable au cours du programme ?
  reponse:
    options:
    - id: o1
      texte: L'affectation
    - id: o2
      texte: La numérisation
    - id: o3
      texte: L'itération
    - id: o4
      texte: La condition
    bonnes:
    - o1
  indices:
    relance: Cherche le terme qui signifie qu'on 'attribue' ou qu'on fixe une valeur à un nom de variable.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la numérisation transforme une grandeur physique en signal binaire, mais ne désigne pas l''action
      de stocker une valeur dans une variable.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : l''itération désigne la répétition d''une séquence d''instructions (boucle), pas l''attribution
      d''une valeur.'
  solution: 'L''affectation. C''est exact : l''affectation (par exemple lum ← 280) permet de stocker une valeur dans une variable
    nommée.'
- id: nblm-un-eclairage-a-detecteur-de-presence-sui-4
  type: choix
  difficulte: 2
  enonce: 'Un éclairage à détecteur de présence suit la règle : si lum < 300 ET presence = vrai alors allumer la lampe, sinon
    l''éteindre. Que fait la lampe si lum = 250 et presence = faux ?'
  reponse:
    options:
    - id: o1
      texte: La lampe est éteinte
    - id: o2
      texte: La lampe s'allume
    - id: o3
      texte: La lampe clignote
    - id: o4
      texte: La lampe varie son intensité
    bonnes:
    - o1
  indices:
    relance: 'Rappelle-toi la règle logique de l''opérateur ET : que faut-il pour que l''ensemble de la condition soit évalué
      à vrai ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : confusion entre l''opérateur ET et l''opérateur OU. Pour l''opérateur ET, si une seule condition
      est fausse, le tout est faux.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : l''instruction conditionnelle propose une alternative binaire (allumer ou éteindre), sans
      clignotement.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : la condition renvoie une valeur logique booléenne (vrai/faux) qui commande une action du
      type tout-ou-rien.'
  solution: 'La lampe est éteinte. C''est exact : l''opérateur ET nécessite que les deux conditions soient vraies. Comme la
    présence est fausse, le résultat global est faux.'
- id: nblm-dans-un-programme-informatique-quel-est-5
  type: choix
  difficulte: 2
  enonce: Dans un programme informatique, quel est le rôle de l'opérateur logique NON ?
  reponse:
    options:
    - id: o1
      texte: Inverser la valeur booléenne d'une condition (transformer vrai en faux et inversement).
    - id: o2
      texte: Stopper immédiatement l'exécution de la carte microcontrôleur.
    - id: o3
      texte: Multiplier deux variables numériques d'entrée.
    - id: o4
      texte: Tester si deux variables sont identiques.
    bonnes:
    - o1
  indices:
    relance: Pense à la transformation que subit une valeur logique 'vrai' lorsqu'on lui applique cet opérateur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : l''opérateur NON n''est pas une commande d''arrêt du système, mais un opérateur logique d''inversion.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : la multiplication est un opérateur arithmétique, pas un opérateur logique.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : le test d''égalité utilise un opérateur de comparaison (=), alors que NON inverse la valeur
      logique.'
  solution: 'Inverser la valeur booléenne d''une condition (transformer vrai en faux et inversement). C''est exact : l''opérateur
    logique NON prend un état ou une expression booléenne et en renvoie l''inverse.'
- id: nblm-quelles-sont-les-deux-propositions-qui-r-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX propositions qui représentent des données d'entrée pour le programme d'un éclairage à détecteur
    de présence ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La valeur du capteur de luminosité
    - id: o2
      texte: L'état du détecteur de présence
    - id: o3
      texte: L'ordre d'allumage transmis au projecteur
    - id: o4
      texte: Le signal sonore émis par le buzzer d'alerte
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie les deux éléments qui mesurent une grandeur physique de l'environnement pour la transmettre au microcontrôleur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur classique : l''ordre envoyé à l''actionneur (le projecteur) constitue une donnée de sortie du programme.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : le son produit par le buzzer est une action commandée par le système, donc une donnée de
      sortie.'
  solution: 'La valeur du capteur de luminosité ; L''état du détecteur de présence. C''est exact : le capteur de luminosité
    mesure l''éclairement ambiant et transmet cette donnée d''entrée au programme.'
- id: nblm-comment-appelle-t-on-le-type-d-une-varia-7
  type: texte_court
  difficulte: 1
  enonce: 'Comment appelle-t-on le type d''une variable qui ne peut prendre que deux valeurs : vrai ou faux ? [1-3]'
  reponse:
    acceptees:
    - booléen
    fautes_tolerees: 1
  indices:
    relance: Ce mot qualifie les valeurs logiques à deux états (vrai/faux ou 1/0).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'booléen. Une variable de type booléen ne peut contenir que l''une des deux valeurs logiques : vrai ou faux.'
- id: nblm-quel-composant-programmable-execute-le-p-8
  type: texte_court
  difficulte: 1
  enonce: Quel composant programmable exécute le programme et traite les données d'entrée et de sortie d'un objet technique
