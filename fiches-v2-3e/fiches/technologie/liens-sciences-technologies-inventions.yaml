# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: liens-sciences-technologies-inventions
version: 2
etat: verifiee
declencheurs:
- invention ou innovation
- c'est quoi une innovation
- qui a inventé
- découverte scientifique
- progrès technique
- brevet d'invention
- ce mot désigne une invention adoptée
- besoin usage science d'un objet
- étapes de vie d'un objet
prerequis:
- 4e-besoins-fonctions-solutions
- evolution-des-ost
essentiel: 'Les sciences cherchent à comprendre et à expliquer la nature. Elles découvrent des phénomènes et des lois. Exemple
  : un aimant qui bouge près d''une bobine crée un courant électrique.


  La technologie conçoit et fabrique des objets et des systèmes pour répondre à un besoin. Elle s''appuie sur des connaissances
  scientifiques. Exemple : la dynamo d''un vélo utilise le phénomène de l''aimant et de la bobine.


  Les échanges vont dans les deux sens. Les objets techniques (microscope, télescope, capteurs, ordinateurs) aident aussi
  les scientifiques à faire de nouvelles découvertes. Une découverte peut aussi ouvrir la voie à une invention.


  Il faut distinguer trois mots :

  - une découverte : on met en évidence quelque chose qui existait déjà (un phénomène, une loi) ;

  - une invention : un objet ou un procédé nouveau, qui n''existait pas avant ;

  - une innovation : une invention (ou une amélioration) mise sur le marché et adoptée par les usagers.


  C''est l''usage qui fait l''innovation. Un prototype jamais vendu est une invention, pas une innovation. Un objet ancien
  peut devenir une innovation quand ses usages se répandent (le vélo à assistance électrique).


  Un objet répond à un besoin, puis ses usages évoluent. Le besoin peut aussi naître d''un nouvel usage ou d''une contrainte
  de la société (économiser l''énergie, réduire les déchets).


  On étudie un objet sur tout son cycle de vie :

  - extraction des matières premières ;

  - fabrication ;

  - transport ;

  - utilisation ;

  - fin de vie (réemploi, réparation, recyclage).


  Chaque étape a un impact sur l''environnement. Une innovation peut réduire un impact (la LED consomme moins qu''une ancienne
  ampoule) mais en créer un autre (métaux de la batterie).


  Au brevet, on attend : relier un objet à un besoin, une connaissance scientifique et un usage, dire pourquoi c''est une
  invention ou une innovation, et citer une étape du cycle de vie avec son impact.

  '
methode:
- 'Repérer le besoin auquel répond l''objet : à qui rend-il service, et sur quoi agit-il ?'
- 'Chercher la connaissance scientifique utilisée : quel phénomène fait fonctionner l''objet ?'
- 'Distinguer : une découverte explique la nature, une invention crée un objet nouveau, une innovation est une invention adoptée
  par les usagers.'
- 'Regarder les usages : l''objet est-il vendu, utilisé tous les jours, par beaucoup de personnes ?'
- Suivre l'objet sur son cycle de vie et repérer l'étape qui a le plus d'impact sur l'environnement.
- Rédiger une phrase de synthèse qui relie besoin, science, usage et cycle de vie.
vocabulaire:
- terme: sciences
  definition: Domaine qui cherche à comprendre et expliquer les phénomènes de la nature.
- terme: technologie
  definition: Domaine qui conçoit et fabrique des objets et systèmes pour répondre à des besoins.
- terme: découverte
  definition: Mise en évidence d'un phénomène ou d'une loi qui existait déjà.
- terme: invention
  definition: Objet ou procédé nouveau, qui n'existait pas avant.
- terme: innovation
  definition: Invention ou amélioration mise sur le marché et adoptée par les usagers.
- terme: usage
  definition: Façon dont les personnes utilisent réellement un objet.
- terme: cycle de vie
  definition: Suite des étapes de la vie d'un objet, de l'extraction des matières à la fin de vie.
erreurs_frequentes:
- 'Confondre invention et innovation : un prototype jamais vendu est une invention, pas une innovation.'
- 'Confondre découverte et invention : on découvre un phénomène qui existait déjà, on invente un objet qui n''existait pas.'
- Croire que les sciences servent la technologie dans un seul sens, alors que les instruments techniques font aussi avancer
  les sciences.
- Ne penser qu'à l'utilisation d'un objet et oublier sa fabrication, son transport et sa fin de vie.
exemple:
  enonce: 'Le vélo à assistance électrique : quel besoin, quelle science, invention ou innovation ?'
  solution: 'Besoin : se déplacer en ville avec moins d''effort. Science utilisée : un courant électrique dans une bobine
    placée près d''aimants fait tourner le moteur. Des vélos à moteur électrique ont été inventés il y a longtemps, mais c''est
    quand ils ont été vendus en grand nombre et utilisés tous les jours qu''ils sont devenus une innovation. Cycle de vie
    : la fabrication de la batterie demande des métaux extraits du sol, et la batterie doit être recyclée en fin de vie.'
exercices:
- id: associer-quatre-mots
  type: association
  difficulte: 1
  enonce: Associe chaque mot à sa définition.
  reponse:
    gauche:
    - id: sciences
      texte: sciences
    - id: technologie
      texte: technologie
    - id: invention
      texte: invention
    - id: innovation
      texte: innovation
    droite:
    - id: expliquer
      texte: Expliquer les phénomènes de la nature
    - id: concevoir
      texte: Concevoir et fabriquer des objets qui répondent à un besoin
    - id: nouveau
      texte: Créer un objet ou un procédé qui n'existait pas
    - id: adopte
      texte: Un objet nouveau vendu et adopté par les usagers
    paires:
      sciences: expliquer
      technologie: concevoir
      invention: nouveau
      innovation: adopte
  indices:
    relance: Lequel de ces mots parle de comprendre la nature, sans fabriquer d'objet ?
    methode: 'Commence par les sciences et la technologie, puis sépare les deux derniers mots : lequel a besoin que des gens
      utilisent l''objet ?'
    etape: Les sciences cherchent à expliquer. Il te reste à placer la technologie, puis à départager les deux mots qui parlent
      d'objet nouveau.
  pieges:
  - si:
      valeur:
        sciences: expliquer
        technologie: concevoir
        invention: adopte
        innovation: nouveau
    relance: Un prototype qui reste dans un laboratoire est-il déjà adopté par les usagers ? Quel mot lui convient ?
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends mot par mot : lequel explique, lequel fabrique, lequel crée du nouveau, lequel a besoin d''être adopté
      ?'
  solution: 'Sciences : expliquer les phénomènes. Technologie : concevoir et fabriquer des objets. Invention : créer un objet
    nouveau. Innovation : un objet nouveau vendu et adopté par les usagers.'
- id: reconnaitre-innovation
  type: choix
  difficulte: 2
  enonce: Parmi ces situations, lesquelles décrivent une innovation ?
  reponse:
    options:
    - id: a
      texte: Un ingénieur fabrique le prototype d'un vélo pliant, qui n'est jamais vendu.
    - id: b
      texte: Le vélo à assistance électrique, vendu en grand nombre et utilisé chaque jour en ville.
    - id: c
      texte: Des physiciens découvrent qu'un courant électrique crée un effet magnétique.
    - id: d
      texte: Le smartphone, qui réunit téléphone, appareil photo et GPS, adopté par des millions de personnes.
    bonnes:
    - b
    - d
  indices:
    relance: 'Pour chaque situation, demande-toi : des usagers utilisent-ils vraiment cet objet ?'
    methode: Écarte d'abord ce qui n'est pas un objet (une connaissance sur la nature), puis ce qui n'a jamais été vendu.
    etape: 'La situation c parle d''une connaissance sur la nature, pas d''un objet : c''est une découverte. Examine les trois
      autres.'
  pieges:
  - si:
      contient:
      - a
    relance: Ce prototype de vélo pliant est bien nouveau, mais a-t-il été vendu et utilisé ? Quel mot lui convient alors
      ?
  - si:
      contient:
      - c
    relance: La situation c décrit-elle un objet fabriqué, ou une connaissance sur la nature ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé une, mais pas toutes. Relis les situations où des personnes utilisent l'objet tous les jours.
  solution: 'b et d sont des innovations : ces objets ont été vendus et adoptés par les usagers. a est seulement une invention
    (jamais vendue), c est une découverte scientifique.'
- id: histoire-lampe-led
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre l'histoire de la lampe à LED.
  reponse:
    elements:
    - id: physiciens
      texte: Des physiciens étudient comment certains matériaux émettent de la lumière quand un courant les traverse.
    - id: premiere-led
      texte: Des ingénieurs mettent au point la première diode électroluminescente (LED).
    - id: serie
      texte: Des entreprises fabriquent des ampoules à LED en série et les vendent.
    - id: menages
      texte: Les ménages remplacent leurs anciennes ampoules par des LED, qui consomment moins.
    - id: recyclage
      texte: Les ampoules usées sont collectées pour être recyclées.
  indices:
    relance: 'Qu''est-ce qui vient en premier : comprendre un phénomène, ou fabriquer un objet qui l''utilise ?'
    methode: 'Suis le chemin : connaissance scientifique, puis invention, puis fabrication et vente, puis adoption, puis fin
      de vie.'
    etape: L'histoire commence par l'étude des physiciens. Quelle étape crée ensuite le premier objet ?
  pieges:
  - si:
      valeur:
      - physiciens
      - premiere-led
      - menages
      - serie
      - recyclage
    relance: Les ménages peuvent-ils acheter des ampoules à LED avant qu'elles soient fabriquées et vendues ?
  - si:
      diagnostic: inversion_voisine
    relance: 'Tu y es presque : deux étapes voisines sont inversées. Laquelle doit forcément se passer avant l''autre ?'
  solution: Étude du phénomène par les physiciens, invention de la première LED, fabrication en série et vente, adoption par
    les ménages (c'est l'innovation), puis collecte et recyclage en fin de vie.
- id: mot-innovation
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une invention qui est mise sur le marché et adoptée par les usagers ?
  reponse:
    acceptees:
    - innovation
    - une innovation
    - innovations
    fautes_tolerees: 1
  indices:
    relance: Un objet nouveau qui reste dans un laboratoire n'a pas encore ce nom. Que lui manque-t-il ?
    methode: 'Relis les définitions : un mot parle de créer du nouveau, un autre parle d''un objet nouveau adopté par les
      usagers.'
    etape: 'Ce n''est pas le mot « invention » : c''est celui qu''on emploie quand un objet nouveau change les habitudes de
      beaucoup de gens.'
  pieges:
  - si:
      valeur: invention
    relance: Une invention crée un objet nouveau, mais n'est pas forcément vendue. Quel mot désigne l'invention une fois adoptée
      par les usagers ?
  - si:
      valeur: découverte
    relance: Une découverte concerne un phénomène naturel, pas un objet vendu. Quel mot désigne un objet nouveau adopté par
      les usagers ?
  solution: 'C''est une innovation : l''invention devient innovation quand elle est vendue et utilisée.'
- id: objet-et-science
  type: association
  difficulte: 2
  enonce: Associe chaque objet à la connaissance scientifique qu'il utilise.
  reponse:
    gauche:
    - id: dynamo
      texte: Dynamo de vélo
    - id: panneau
      texte: Panneau solaire photovoltaïque
    - id: bouteille
      texte: Bouteille isotherme (thermos)
    - id: montgolfiere
      texte: Montgolfière
    droite:
    - id: induction
      texte: Un aimant qui tourne près d'une bobine produit un courant électrique
    - id: lumiere
      texte: La lumière peut produire un courant électrique dans certains matériaux
    - id: vide
      texte: Le vide limite les transferts d'énergie thermique
    - id: air-chaud
      texte: L'air chaud est moins dense que l'air froid
    paires:
      dynamo: induction
      panneau: lumiere
      bouteille: vide
      montgolfiere: air-chaud
  indices:
    relance: 'Pour chaque objet, demande-toi : que produit-il ou que fait-il ?'
    methode: 'Cherche d''abord les deux objets qui produisent de l''électricité, puis regarde d''où vient leur énergie : un
      mouvement ou la lumière ?'
    etape: La montgolfière monte parce qu'on chauffe l'air de son ballon. Place-la, puis occupe-toi des objets électriques.
  pieges:
  - si:
      valeur:
        dynamo: lumiere
        panneau: induction
        bouteille: vide
        montgolfiere: air-chaud
    relance: Un panneau solaire a-t-il une pièce qui tourne ? Et la dynamo reçoit-elle de la lumière ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'objet que tu connais le mieux, et regarde ce qu'il reçoit (mouvement, lumière, chaleur).
  solution: 'Dynamo : l''aimant qui tourne près d''une bobine crée un courant. Panneau photovoltaïque : la lumière crée un
    courant. Bouteille isotherme : le vide limite les transferts thermiques. Montgolfière : l''air chaud, moins dense, fait
    monter le ballon.'
- id: analyser-trottinette
  type: ouverte
  difficulte: 3
  enonce: La trottinette électrique s'est répandue très vite dans les villes. Explique à quel besoin elle répond, quelle connaissance
    scientifique elle utilise, pourquoi on peut parler d'innovation, et cite une étape de son cycle de vie qui a un impact
    sur l'environnement.
  criteres:
  - L'élève nomme le besoin (se déplacer sur de courtes distances sans effort) et la connaissance scientifique utilisée (moteur
    électrique, batterie qui stocke l'énergie).
  - L'élève justifie le mot innovation par l'adoption de l'objet par de nombreux usagers, et pas seulement par sa nouveauté.
  - L'élève cite une étape du cycle de vie (extraction des métaux de la batterie, fabrication, transport, fin de vie et recyclage)
    et son impact sur l'environnement.
  indices:
    relance: Qui utilise une trottinette électrique, et pour faire quoi ?
    methode: 'Réponds en trois temps : le besoin et la science, puis invention ou innovation, puis le cycle de vie.'
    etape: 'Pour la science, pense à ce qui fait avancer la trottinette sans que l''on pousse : quel composant, et quelle
      énergie ?'
  solution: 'Elle répond au besoin de se déplacer en ville sur de courtes distances sans effort. Elle utilise un moteur électrique
    alimenté par une batterie qui stocke l''énergie. Ce n''est pas seulement une invention : elle est vendue ou louée et utilisée
    par un grand nombre de personnes, c''est une innovation. Sa batterie demande l''extraction de métaux comme le lithium,
    et doit être collectée et recyclée en fin de vie.'
- id: decouverte-ou-invention
  type: choix
  difficulte: 1
  enonce: Parmi ces phrases, laquelle décrit une découverte scientifique, et non une invention ?
  reponse:
    options:
    - id: a
      texte: Un ingénieur conçoit un nouveau casque de vélo gonflable.
    - id: b
      texte: Des physiciens montrent qu'un aimant en mouvement près d'une bobine crée un courant.
    - id: c
      texte: Une entreprise met au point une gourde qui garde l'eau froide.
    - id: d
      texte: Un inventeur dépose le plan d'un nouveau type de trottinette.
    bonnes:
    - b
  indices:
    relance: Cherche la phrase où l'on explique un phénomène de la nature, sans créer d'objet.
    methode: Une découverte met en évidence ce qui existait déjà ; une invention crée un objet ou un procédé nouveau.
    etape: Trois phrases parlent d'un objet que quelqu'un fabrique ou conçoit. Une seule parle d'un phénomène qu'on explique.
  pieges:
  - si:
      contient:
      - a
    relance: Un casque qu'on conçoit est un objet nouveau. Est-ce une découverte ou une invention ?
  - si:
      contient:
      - c
    relance: Une gourde qu'on met au point est un objet fabriqué. La nature n'est pas expliquée ici.
  - si:
      contient:
      - d
    relance: Un plan de trottinette décrit un objet à fabriquer. Est-ce un phénomène naturel ?
  solution: 'Le phénomène de l''aimant et de la bobine existait déjà : c''est une découverte. Les trois autres phrases décrivent
    des objets nouveaux : des inventions.'
- id: etape-cycle-de-vie
  type: choix
  difficulte: 2
  enonce: Une trottinette électrique est mise au rebut. Quelle étape de son cycle de vie est en jeu, et que faut-il faire
    de sa batterie ?
  reponse:
    options:
    - id: a
      texte: 'La fabrication : on la jette avec les ordures ménagères.'
    - id: b
      texte: 'La fin de vie : on la dépose dans un point de collecte pour recyclage.'
    - id: c
      texte: 'L''utilisation : on la laisse dans un garage.'
    - id: d
      texte: 'L''extraction : on la remet dans la terre.'
    bonnes:
    - b
  indices:
    relance: À quel moment de la vie de l'objet se situe le fait de le mettre au rebut ?
    methode: 'Les étapes sont : extraction, fabrication, transport, utilisation, fin de vie. Une batterie contient des métaux
      qu''on peut récupérer.'
    etape: L'objet n'est plus utilisé et n'est plus réparé. Quelle étape vient en dernier, et quel geste évite de polluer
      ?
  pieges:
  - si:
      contient:
      - a
    relance: La fabrication est une étape du début. Et une batterie ne se jette pas avec les ordures ménagères.
  - si:
      contient:
      - c
    relance: Laisser l'objet dans un garage ne le fait pas entrer en fin de vie. Que devient-il vraiment ?
  - si:
      contient:
      - d
    relance: L'extraction concerne les matières premières, tout au début du cycle.
  solution: 'L''objet jeté est en fin de vie. Sa batterie doit être collectée pour être recyclée : on récupère les métaux
    et on évite la pollution.'
- id: nblm-quelle-est-la-principale-difference-entr-1
  type: choix
  difficulte: 2
  enonce: Quelle est la principale différence entre une découverte scientifique et une invention technique ?
  reponse:
    options:
    - id: o1
      texte: La découverte explique un phénomène naturel existant, alors que l'invention crée un objet ou un procédé nouveau.
    - id: o2
      texte: La découverte concerne les objets vendus en magasin, tandis que l'invention reste dans un laboratoire.
    - id: o3
      texte: La découverte crée de nouveaux matériaux, alors que l'invention explique les lois de la physique.
    - id: o4
      texte: Il n'y a aucune différence, ces deux termes désignent exactement la même chose.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui existait déjà dans la nature par rapport à ce qui est créé par l'être humain.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, la commercialisation et l'adoption par les usagers caractérisent l'innovation, pas la découverte.
  - si:
      contient:
      - o3
    relance: 'C''est l''inverse : la science (découverte) explique la nature et la technologie (invention) conçoit de nouveaux
      objets.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la découverte porte sur la nature préexistante, alors que l''invention est une création humaine.'
  solution: 'La découverte explique un phénomène naturel existant, alors que l''invention crée un objet ou un procédé nouveau.
    C''est exact : on découvre une loi ou un phénomène de la nature qui existait déjà, tandis qu''on invente un objet technique
    qui n''existait pas.'
- id: nblm-qu-est-ce-qui-transforme-une-invention-e-2
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qui transforme une invention en une innovation ?
  reponse:
    options:
    - id: o1
      texte: Sa commercialisation et son adoption par les usagers sur le marché.
    - id: o2
      texte: Le simple dépôt d'un brevet d'invention auprès d'un organisme officiel.
    - id: o3
      texte: La fabrication d'un tout premier prototype fonctionnel dans un laboratoire.
    - id: o4
      texte: L'explication scientifique du phénomène naturel sous-jacent.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au rôle joué par les utilisateurs et le marché.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : un brevet protège une invention, mais ne garantit pas qu''elle sera vendue et adoptée par le public.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : un prototype non commercialisé ou non adopté par le public reste une simple invention.'
  - si:
      contient:
      - o4
    relance: Non, l'explication d'un phénomène naturel correspond à une découverte scientifique.
  solution: 'Sa commercialisation et son adoption par les usagers sur le marché. Exactement : c''est l''usage et l''adoption
    par le public sur le marché qui font l''innovation.'
- id: nblm-comment-les-objets-et-instruments-techni-3
  type: choix
  difficulte: 2
  enonce: Comment les objets et instruments techniques contribuent-ils aux sciences ?
  reponse:
    options:
    - id: o1
      texte: Ils fournissent des outils (comme le microscope ou les capteurs) permettant aux scientifiques de faire de nouvelles
        découvertes.
    - id: o2
      texte: Ils remplacent totalement le travail d'analyse et de réflexion des chercheurs scientifiques.
    - id: o3
      texte: Ils empêchent la découverte de nouvelles lois naturelles en rendant les expériences trop complexes.
    - id: o4
      texte: Ils servent uniquement à fabriquer des gadgets grand public sans lien avec la recherche.
    bonnes:
    - o1
  indices:
    relance: Pense aux appareils d'observation utilisés par les chercheurs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect : les instruments sont des outils d''observation au service des scientifiques, ils ne les remplacent
      pas.'
  - si:
      contient:
      - o3
    relance: 'Faux : les instruments techniques permettent au contraire d''observer ce qui était invisible.'
  - si:
      contient:
      - o4
    relance: 'Faux : la technologie produit des instruments scientifiques indispensables comme les télescopes.'
  solution: 'Ils fournissent des outils (comme le microscope ou les capteurs) permettant aux scientifiques de faire de nouvelles
    découvertes. Tout à fait : la relation est à double sens, les objets techniques aident la recherche scientifique.'
- id: nblm-dans-le-cas-d-une-dynamo-de-velo-quel-ph-4
  type: choix
  difficulte: 2
  enonce: Dans le cas d'une dynamo de vélo, quel phénomène scientifique est exploité par la technologie ?
  reponse:
    options:
    - id: o1
      texte: La création d'un courant électrique par le mouvement d'un aimant près d'une bobine.
    - id: o2
      texte: La transformation directe du plastique en métal lors du pédalage.
    - id: o3
      texte: La dilatation thermique des câbles sous l'effet de la chaleur ambiante.
    - id: o4
      texte: L'accumulation d'électricité statique par le frottement des pneus sur le sol.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'interaction entre un aimant et un enroulement de fil.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
