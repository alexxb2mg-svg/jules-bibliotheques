- id: nblm-quelle-etape-du-cycle-de-vie-d-un-objet-5
  type: choix
  difficulte: 2
  enonce: Quelle étape du cycle de vie d'un objet technique innovant (comme un vélo électrique) nécessite un traitement spécifique
    en fin d'usage ?
  reponse:
    options:
    - id: o1
      texte: Le recyclage et la valorisation des composants (notamment la batterie).
    - id: o2
      texte: L'impression de l'emballage carton lors de l'expédition initiale.
    - id: o3
      texte: Le choix de la couleur du cadre lors de l'achat en magasin.
    - id: o4
      texte: La rédaction de la notice explicative par le concepteur.
    bonnes:
    - o1
  indices:
    relance: Pense à la gestion des déchets et des batteries usagées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Bien qu'important, ce n'est pas la phase de fin de vie de l'objet lui-même.
  - si:
      contient:
      - o3
    relance: La couleur est un choix esthétique sans rapport avec le traitement des déchets en fin de vie.
  - si:
      contient:
      - o4
    relance: La rédaction de la notice a lieu lors de la conception, pas en fin de vie.
  solution: 'Le recyclage et la valorisation des composants (notamment la batterie). Exactement : les batteries contiennent
    des métaux qu''il faut obligatoirement recycler en fin de vie.'
- id: nblm-parmi-les-propositions-suivantes-lesquel-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes, lesquelles caractérisent une innovation technologique ? (2 réponses exactes) [1-3]
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Elle est mise sur le marché et adoptée par les usagers.
    - id: o2
      texte: Elle répond à un besoin et fait évoluer les usages du quotidien.
    - id: o3
      texte: Elle consiste uniquement à découvrir une nouvelle loi de la nature.
    - id: o4
      texte: Il s'agit obligatoirement d'un prototype resté confiné dans un laboratoire.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense à la présence sur le marché et au changement des usages.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : expliquer la nature concerne la découverte scientifique, pas l''innovation.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : un prototype jamais vendu ou adopté reste une simple invention.'
  solution: 'Elle est mise sur le marché et adoptée par les usagers ; Elle répond à un besoin et fait évoluer les usages du
    quotidien. Correct : l''adoption par les usagers sur le marché est le critère fondamental de l''innovation.'
