format: 2
notion: evolution-des-ost
version: 1
etat: verifiee
declencheurs:
- assistant vocal
- chatbot qui se trompe
- vieux téléphone
- grand-bi
- objet a évolué
- IA qui hallucine
- première réalisation
prerequis: []
essentiel: 'Un objet ou système technique (OST) évolue pour répondre à un besoin nouveau ou mieux satisfaire un besoin déjà
  connu. Une invention est la première réalisation concrète d''une solution technique nouvelle. Une innovation est la diffusion
  à grande échelle d''un produit qui améliore une solution existante : elle est dite « de rupture » si elle change radicalement
  le principe technique employé, ou « d''usage » si elle change seulement la façon d''utiliser l''objet. Toute invention ne
  devient pas une innovation : le coût, l''acceptation par les utilisateurs ou la réglementation peuvent l''en empêcher. Des
  objets répondant à un même besoin forment une lignée : chaque génération garde certaines fonctions et en modifie ou en ajoute
  d''autres.


  L''intelligence artificielle (IA) est la capacité d''un programme à réaliser des tâches qui semblaient réservées à l''humain
  (reconnaître une image, tenir une conversation comme un agent conversationnel). Une IA apprend le plus souvent à partir
  d''une grande quantité de données : si ces données sont mal choisies ou peu représentatives, l''IA peut reproduire des erreurs
  ou des inégalités déjà présentes dedans, c''est un biais. Une IA n''a pas de conscience et peut se tromper avec assurance
  (elle « hallucine ») : il faut toujours vérifier ses réponses avec d''autres sources.


  Les évolutions techniques doivent aussi tenir compte de contraintes liées à la société : coût acceptable, impact sur l''environnement,
  acceptation par les utilisateurs, respect de la réglementation.'
methode:
- 'Pour situer un OST dans une lignée, chercher ses ancêtres directs et ce que chaque nouvelle génération a changé : quel
  besoin en plus est satisfait, quelle contrainte est mieux gérée.'
- 'Distinguer invention (première solution technique) et innovation (diffusion réussie de cette solution ou de son amélioration)
  : toute invention ne devient pas une innovation.'
- Pour une IA, identifier la tâche réalisée, le type de données utilisées pour l'entraîner, puis un avantage et un risque
  (biais, erreur, dépendance) de son usage.
- Relier chaque évolution à un besoin (fonction d'usage) ou à une contrainte (sociétale, économique, environnementale) plutôt
  qu'à la technique pour la technique.
vocabulaire:
- terme: invention
  definition: première réalisation concrète d'une solution technique nouvelle
- terme: innovation
  definition: amélioration d'un produit ou d'un usage, diffusée à grande échelle
- terme: innovation de rupture
  definition: innovation qui change radicalement le principe technique utilisé
- terme: biais (d'une IA)
  definition: erreur systématique d'une intelligence artificielle due à des données d'entraînement mal choisies
erreurs_frequentes:
- Confondre invention (l'idée technique) et innovation (sa réussite commerciale et sa diffusion).
- Croire qu'une intelligence artificielle « comprend » ou « pense » comme un humain.
- Oublier de relier une évolution technique à un besoin ou une contrainte précise.
- Penser qu'une innovation est toujours une rupture technique, alors qu'elle peut n'être qu'un usage nouveau d'une technique
  déjà connue.
exemple:
  enonce: Le smartphone intègre un assistant vocal utilisant l'intelligence artificielle pour comprendre des phrases prononcées.
    Expliquer en quoi il s'agit d'une innovation, puis citer un avantage et un risque de cet usage de l'IA.
  solution: 'C''est une innovation, et non une invention isolée, car elle combine des techniques déjà connues (microphone,
    traitement du son, réseau de neurones) pour offrir un nouvel usage diffusé à grande échelle. Avantage : accès mains libres
    à des services (recherche, itinéraire). Risque : l''assistant peut mal comprendre un accent peu représenté dans ses données
    d''entraînement (biais), ou donner une réponse fausse avec assurance.'
exercices:
- id: invention-ou-innovation
  type: choix
  difficulte: 1
  enonce: Un inventeur construit un seul prototype de vélo pliable dans son garage, qu'il ne vend jamais. Que représente ce
    prototype ?
  reponse:
    options:
    - id: a
      texte: Une invention
    - id: b
      texte: Une innovation
    - id: c
      texte: Une innovation de rupture
    bonnes:
    - a
  indices:
    relance: Ce prototype est-il vendu et utilisé par de nombreuses personnes, ou reste-t-il une idée réalisée une seule fois
      ?
    methode: Une innovation suppose une diffusion à grande échelle. Ce prototype est-il diffusé ?
    etape: Le prototype est la toute première réalisation concrète d'une idée technique, jamais commercialisée.
  pieges:
  - si:
      contient:
      - b
    relance: Une innovation suppose une diffusion à grande échelle du produit. Ce prototype est-il vendu à beaucoup de personnes
      ?
  - si:
      contient:
      - c
    relance: Une rupture change radicalement un principe technique déjà diffusé. Ici, rien n'est encore diffusé.
  solution: C'est une invention, la première réalisation concrète d'une solution technique. Elle ne devient une innovation
    que si elle est diffusée à grande échelle.
- id: vocabulaire-biais
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'erreur systématique d'une intelligence artificielle due à des données d'entraînement mal
    choisies ?
  reponse:
    acceptees:
    - biais
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne un déséquilibre dans les données utilisées pour entraîner l'IA.
    methode: Relis le vocabulaire de ta leçon sur l'intelligence artificielle.
    etape: Le mot commence par « b » et compte cinq lettres.
  pieges:
  - si:
      valeur: erreur
    relance: Ce mot est trop général. On cherche le mot précis qui désigne une erreur due à des données mal choisies.
  solution: 'Un biais : une erreur systématique d''une IA, due à des données d''entraînement mal choisies ou peu représentatives.'
- id: lignee-velo
  type: ordre
  difficulte: 2
  enonce: Range ces trois vélos dans l'ordre chronologique de leur lignée, du plus ancien au plus récent.
  reponse:
    elements:
    - id: grandbi
      texte: Le grand-bi, avec une immense roue avant
    - id: pedalier
      texte: Le vélo à pédalier et chaîne
    - id: electrique
      texte: Le vélo à assistance électrique
  indices:
    relance: Lequel de ces vélos utilise une batterie, une technologie récente ?
    methode: 'Le grand-bi n''a ni chaîne ni pédalier séparé de la roue avant : c''est la solution la plus ancienne.'
    etape: Place d'abord le grand-bi en premier, puis compare le vélo à chaîne et le vélo électrique.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux vélos voisins dans ta réponse sont inversés. Lequel des deux utilise une batterie ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le vélo le plus ancien (sans chaîne), puis range les deux autres.
  solution: Le grand-bi (roue avant immense, sans chaîne), puis le vélo à pédalier et chaîne (plus sûr et plus efficace),
    puis le vélo à assistance électrique (réduit l'effort demandé).
- id: causes-echec-diffusion
  type: association
  difficulte: 2
  enonce: Associe chaque situation à la raison pour laquelle l'invention n'est pas devenue une innovation.
  reponse:
    gauche:
    - id: a
      texte: Le prototype coûte dix fois plus cher à produire que les objets existants
    - id: b
      texte: La réglementation interdit l'usage de ce dispositif sur la voie publique
    - id: c
      texte: Les utilisateurs testés trouvent l'objet peu pratique et ne l'achètent pas
    droite:
    - id: x
      texte: Coût trop élevé
    - id: y
      texte: Interdiction réglementaire
    - id: z
      texte: Rejet par les utilisateurs
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque phrase, cherche le mot clé qui explique le blocage (prix, loi, ou avis des utilisateurs).
    methode: Repère si la phrase parle d'argent, de règle légale, ou de ce que pensent les utilisateurs.
    etape: 'La première phrase parle du prix de fabrication, dix fois plus élevé : à quelle raison cela correspond-il ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la phrase concernée et son mot clé (prix, loi, ou avis des utilisateurs).
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la phrase qui parle clairement d'argent, c'est le repère le plus sûr.
  solution: 'Coût trop élevé : le prototype coûte dix fois plus cher. Interdiction réglementaire : la loi interdit son usage.
    Rejet par les utilisateurs : ils ne l''achètent pas car ils le trouvent peu pratique.'
- id: developpement-ia-biais
  type: ouverte
  difficulte: 3
  enonce: Un chatbot d'aide aux devoirs a été entraîné surtout avec des manuels de mathématiques et très peu de manuels d'histoire-géographie.
    Explique ce qui risque de se passer si un élève lui pose une question d'histoire, en utilisant le mot « biais ».
  criteres:
  - L'élève emploie le mot « biais » avec sa définition correcte (erreur due à des données mal choisies).
  - L'élève relie ce biais au déséquilibre des données d'entraînement (beaucoup de maths, peu d'histoire).
  - L'élève conclut qu'il faut vérifier la réponse du chatbot avec une autre source.
  indices:
    relance: Le chatbot a-t-il été autant entraîné en histoire qu'en mathématiques ?
    methode: Explique d'abord le déséquilibre des données, puis ce que cela entraîne comme erreur possible.
    etape: Tu peux commencer ainsi « Ce chatbot risque de se tromper en histoire car... », puis continuer avec le mot biais.
  solution: 'Ce chatbot risque de se tromper ou de mal répondre à une question d''histoire, car il a été entraîné surtout
    avec des manuels de mathématiques et très peu de manuels d''histoire-géographie : c''est un biais dû à un déséquilibre
    des données d''entraînement. Il faut donc toujours vérifier sa réponse avec une autre source, car une IA peut se tromper
    avec assurance.'
