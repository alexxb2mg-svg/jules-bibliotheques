# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: evolution-des-ost
version: 2
etat: verifiee
declencheurs:
- lignée d'objets
- famille d'objets
- innovation de rupture
- principe technique
- apprentissage supervisé
- biais d'une IA
- évolution des objets
- données d'apprentissage
prerequis:
- 4e-besoins-fonctions-solutions
essentiel: 'Un objet technique répond à un besoin. Sa fonction technique dit ce qu''il doit faire (éclairer, transmettre un
  son...). Son principe technique dit comment il le fait (filament chauffé, diode électroluminescente...). Pour une même fonction,
  plusieurs principes techniques sont possibles : on peut les comparer.


  Une famille d''objets regroupe les objets qui répondent au même besoin (s''éclairer : bougie, lampe à pétrole, ampoule).
  Une lignée d''objets regroupe les objets d''une famille qui utilisent le même principe technique et se succèdent dans le
  temps (des ampoules à filament de plus en plus fiables).


  Les objets évoluent parce que les besoins et les usages changent, grâce aux découvertes scientifiques, aux inventions et
  aux innovations, et sous l''effet du développement durable. Une découverte scientifique peut avoir des développements techniques
  : la compréhension des semi-conducteurs a permis le transistor, puis les ordinateurs et les smartphones. Une invention est
  une création nouvelle ; une innovation est une nouveauté réellement mise sur le marché et adoptée par les utilisateurs.
  Une innovation de rupture change le principe technique et bouleverse les usages (du baladeur à cassette au smartphone qui
  lit de la musique en ligne).


  Chaque évolution a des avantages et des inconvénients : l''ampoule LED consomme moins d''électricité mais contient de l''électronique
  à recycler ; les trottinettes en libre-service facilitent les trajets mais encombrent parfois les trottoirs. L''évolution
  est encadrée par des contraintes sociétales : lois, normes, sécurité, protection de la santé et de l''environnement.


  Une intelligence artificielle (IA) apprend à partir de données. Trois grands types d''apprentissage :

  - supervisé : on lui donne des exemples déjà étiquetés ;

  - non supervisé : elle regroupe seule des données qui se ressemblent ;

  - par renforcement : elle essaie, reçoit des récompenses ou des pénalités, et s''améliore.

  Usages : reconnaissance d''images, traduction, recommandations, aide à la conduite. Si les données d''apprentissage sont
  incomplètes ou déséquilibrées, l''IA reproduit ces défauts : c''est un biais. Une IA peut se tromper : il faut vérifier
  ses résultats.


  Au brevet : comparer des principes techniques, justifier l''évolution d''un objet, distinguer invention et innovation, citer
  des avantages, des inconvénients et les biais d''une IA.

  '
methode:
- Identifier le besoin auquel répond l'objet et sa fonction technique.
- Repérer le principe technique utilisé, puis le comparer à celui des objets plus anciens.
- Classer les objets dans le temps et dire s'ils sont de la même lignée (même principe) ou seulement de la même famille (même
  besoin).
- Pour chaque évolution, lister un avantage, un inconvénient et le besoin nouveau auquel elle répond.
- Chercher les contraintes sociétales (lois, normes, sécurité) qui ont accompagné ou provoqué l'évolution.
vocabulaire:
- terme: Fonction technique
  definition: Ce que doit faire l'objet (par exemple éclairer, freiner, stocker de l'énergie).
- terme: Principe technique
  definition: La façon dont l'objet réalise sa fonction (par exemple un filament chauffé ou une diode électroluminescente).
- terme: Famille d'objets
  definition: Objets qui répondent au même besoin, quel que soit leur principe technique.
- terme: Lignée d'objets
  definition: Objets d'une même famille qui utilisent le même principe technique et évoluent dans le temps.
- terme: Innovation de rupture
  definition: Innovation qui change le principe technique et transforme les usages.
- terme: Biais
  definition: Erreur systématique d'une IA qui vient de données d'apprentissage incomplètes ou déséquilibrées.
- terme: Contrainte sociétale
  definition: Règle ou attente de la société (loi, norme, sécurité, environnement) qui encadre l'évolution d'un objet.
- terme: Intelligence artificielle
  definition: Programme qui apprend à partir de données pour réaliser une tâche (reconnaître, traduire, recommander).
erreurs_frequentes:
- Confondre invention et innovation (une invention qui n'est ni fabriquée ni adoptée n'est pas une innovation).
- Confondre fonction technique (ce que fait l'objet) et principe technique (comment il le fait).
- Croire qu'un objet plus récent n'a que des avantages.
- Croire qu'une IA est neutre et ne se trompe jamais.
- Mettre dans la même lignée deux objets qui répondent au même besoin mais avec des principes différents.
exemple:
  enonce: Une lampe à incandescence et une lampe à LED éclairent toutes les deux une pièce. Sont-elles de la même famille
    ? de la même lignée ?
  solution: 'Même besoin et même fonction technique (éclairer) : elles sont de la même famille. Principes techniques différents
    (filament chauffé contre diode électroluminescente) : elles ne sont pas de la même lignée. La LED consomme moins d''électricité
    pour le même éclairage et dure plus longtemps.'
exercices:
- id: ordre-ecouter-musique
  type: ordre
  difficulte: 1
  enonce: 'Classe ces objets pour écouter de la musique chez soi, du plus ancien au plus récent (ordre d''apparition). a :
    lecteur de CD ; b : écoute en ligne (streaming) sur smartphone ; c : tourne-disque pour disques vinyles ; d : lecteur
    MP3 ; e : magnétophone à cassettes.'
  reponse:
    elements:
    - id: c
      texte: tourne-disque pour disques vinyles
    - id: e
      texte: magnétophone à cassettes
    - id: a
      texte: lecteur de CD
    - id: d
      texte: lecteur MP3
    - id: b
      texte: écoute en ligne (streaming) sur smartphone
  indices:
    relance: Lesquels de ces objets demandent un support physique qu'on insère (disque, cassette) et lesquels n'en demandent
      pas ?
    methode: Commence par les supports mécaniques, puis les supports lus par laser, puis les fichiers numériques, et enfin
      ce qui passe par Internet.
    etape: Le plus ancien est celui qui lit un sillon gravé avec une aiguille. Place ensuite les autres.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Tu y es presque, deux objets voisins sont inversés. Lequel des deux a besoin d'Internet ou d'un fichier numérique
      ?
  - si:
      diagnostic: ordre_faux
    relance: Demande-toi pour chaque objet s'il utilise un support gravé, une bande magnétique, un disque lu par laser, un
      fichier ou Internet.
  solution: 'c, e, a, d, b : le tourne-disque (sillon gravé), le magnétophone à cassettes (bande magnétique), le lecteur de
    CD (disque lu par laser), le lecteur MP3 (fichiers numériques), puis l''écoute en ligne sur smartphone (Internet).'
- id: invention-ou-innovation
  type: texte_court
  difficulte: 1
  enonce: 'Complète par un seul mot : une nouveauté réellement mise sur le marché et adoptée par les utilisateurs est une
    ...'
  reponse:
    acceptees:
    - innovation
    fautes_tolerees: 1
  indices:
    relance: Une idée ou un prototype nouveau ne suffit pas. Quel mot désigne la nouveauté quand les gens l'achètent et l'utilisent
      vraiment ?
    methode: Distingue les deux mots proches de la leçon, celui de la création et celui de la réussite auprès des utilisateurs.
    etape: Le mot commence comme « innover ».
  pieges:
  - si:
      valeur: invention
    relance: Une invention est une création nouvelle, mais elle n'est pas forcément vendue ni utilisée. Quel mot désigne la
      nouveauté adoptée par les utilisateurs ?
  solution: 'C''est une innovation : l''invention devient une innovation quand elle est fabriquée, vendue et adoptée.'
- id: types-apprentissage-ia
  type: association
  difficulte: 2
  enonce: 'Associe chaque situation (a, b, c) au type d''apprentissage de l''IA (x, y, z). a : on montre à l''IA des milliers
    de photos, chacune avec l''étiquette « chat » ou « chien » ; b : l''IA regroupe seule des clients qui achètent des produits
    semblables, sans qu''on lui donne de groupes ; c : dans un jeu, une IA qui pilote un robot aspirateur gagne des points
    quand elle évite un meuble et en perd quand elle le heurte. x : apprentissage supervisé ; y : apprentissage non supervisé
    ; z : apprentissage par renforcement.'
  reponse:
    gauche:
    - id: a
      texte: photos étiquetées chat ou chien
    - id: b
      texte: clients regroupés sans groupes donnés
    - id: c
      texte: robot qui gagne ou perd des points
    droite:
    - id: x
      texte: apprentissage supervisé
    - id: y
      texte: apprentissage non supervisé
    - id: z
      texte: apprentissage par renforcement
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Dans chaque situation, est-ce qu'on donne à l'IA la bonne réponse, pas de réponse du tout, ou seulement une récompense
      ?
    methode: Supervisé = exemples accompagnés de la bonne réponse. Non supervisé = aucune étiquette. Renforcement = essais,
      récompenses et pénalités.
    etape: Dans la situation a, chaque photo porte déjà son nom. Associe-la, puis traite b et c.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Dans laquelle des situations l'IA apprend-elle par essais, avec des points
      gagnés ou perdus ?
  - si:
      diagnostic: associations_fausses
    relance: Relis chaque situation et cherche si des étiquettes sont données au départ.
  solution: 'a-x (les photos sont étiquetées : supervisé), b-y (aucun groupe donné : non supervisé), c-z (récompenses et pénalités
    : renforcement).'
- id: biais-reconnaissance-visages
  type: choix
  difficulte: 2
  enonce: 'Document fictif : une IA qui reconnaît les visages a été entraînée presque uniquement avec des photos d''adultes.
    Quelles affirmations sont justes ? a : elle risque de moins bien reconnaître les visages d''enfants ; b : elle sera parfaite
    pour tout le monde, car un ordinateur ne se trompe pas ; c : ce défaut vient des données d''apprentissage ; d : un ordinateur
    plus rapide suffira à corriger ce défaut.'
  reponse:
    options:
    - id: a
      texte: elle risque de moins bien reconnaître les visages d'enfants
    - id: b
      texte: elle sera parfaite pour tout le monde
    - id: c
      texte: ce défaut vient des données d'apprentissage
    - id: d
      texte: un ordinateur plus rapide suffira
    bonnes:
    - a
    - c
  indices:
    relance: Une IA apprend à partir d'exemples. Quels exemples cette IA a-t-elle presque jamais vus ?
    methode: Pour chaque affirmation, demande-toi si elle parle de la qualité des données ou seulement de la machine.
    etape: Commence par l'affirmation b. Une IA peut-elle faire mieux que les exemples qu'on lui a donnés ?
  pieges:
  - si:
      contient:
      - b
    relance: Une IA n'est pas neutre ni infaillible. Que se passe-t-il quand elle rencontre un cas qu'elle n'a presque jamais
      vu ?
  - si:
      contient:
      - d
    relance: La vitesse de calcul change-t-elle les exemples que l'IA a appris ? D'où vient vraiment le problème ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une bonne réponse, mais il y en a une autre. Cherche celle qui explique la cause du problème.
  solution: 'a et c. L''IA a peu vu de visages d''enfants : elle les reconnaîtra moins bien. C''est un biais qui vient des
    données d''apprentissage ; une machine plus rapide ne le corrige pas, il faut des données plus variées.'
- id: meme-lignee-ou-famille
  type: choix
  difficulte: 2
  enonce: 'Le besoin est de se déplacer en ville. Quels objets sont de la même lignée que le vélo à pédales classique (même
    principe technique : la force des jambes transmise à la roue par une chaîne) ? a : le vélo de course moderne à dérailleur
    ; b : la trottinette électrique ; c : le vélo pliant à pédales ; d : le bus ; e : le vélo de ville à trois vitesses.'
  reponse:
    options:
    - id: a
      texte: le vélo de course moderne à dérailleur
    - id: b
      texte: la trottinette électrique
    - id: c
      texte: le vélo pliant à pédales
    - id: d
      texte: le bus
    - id: e
      texte: le vélo de ville à trois vitesses
    bonnes:
    - a
    - c
    - e
  indices:
    relance: Une lignée, c'est le même principe technique. Pour chaque objet, qu'est-ce qui le fait avancer ?
    methode: Garde les objets qui avancent grâce aux jambes, une chaîne et des pédales. Écarte ceux qui ont un moteur, même
      s'ils répondent au même besoin.
    etape: La trottinette électrique répond au même besoin, mais elle a un moteur. Elle est de la même famille, pas de la
      même lignée. Examine les autres.
  pieges:
  - si:
      contient:
      - b
    relance: La trottinette électrique répond au même besoin, mais avance-t-elle grâce aux jambes et à une chaîne ?
  - si:
      contient:
      - d
    relance: Le bus répond au même besoin, donc il est de la même famille. Mais son principe technique est-il le même ?
  - si:
      diagnostic: incomplet
    relance: Il en manque. Regarde encore chaque objet qui a des pédales et une chaîne.
  solution: 'a, c et e : ils utilisent tous la force des jambes transmise par une chaîne. La trottinette électrique et le
    bus répondent au même besoin (même famille) mais avec un moteur : ils ne sont pas de la même lignée.'
- id: trottinette-libre-service
  type: ouverte
  difficulte: 3
  enonce: Des trottinettes électriques en libre-service sont apparues dans de nombreuses villes. Explique à quel besoin elles
    répondent, donne un avantage et un inconvénient de cette évolution, puis cite une règle (contrainte sociétale) qui encadre
    leur usage.
  criteres:
  - L'élève nomme le besoin (se déplacer vite en ville sur une courte distance, sans effort ni véhicule personnel).
  - L'élève donne un avantage (rapide, peu de pollution à l'usage, pas besoin d'en posséder une) et un inconvénient (accidents,
    encombrement des trottoirs, batterie à fabriquer et recycler, durée de vie courte).
  - L'élève cite une règle réelle et plausible qui encadre l'usage (par exemple l'interdiction de rouler sur le trottoir ou
    un âge minimum) et dit qu'elle répond à un problème de sécurité ou de partage de l'espace.
  indices:
    relance: Qui utilise ces trottinettes, et pour quel genre de trajet ?
    methode: Fais trois parties. Le besoin, puis un avantage et un inconvénient (pense à la sécurité et à l'environnement),
      puis une règle.
    etape: 'Commence ainsi : « Elles répondent au besoin de se déplacer en ville sur de courtes distances... »'
  solution: 'Elles répondent au besoin de se déplacer vite en ville sur de courtes distances sans posséder de véhicule. Avantage
    : peu d''effort et pas de gaz d''échappement pendant l''usage. Inconvénient : des accidents, des trottinettes laissées
    sur les trottoirs, des batteries à fabriquer et à recycler. Contrainte sociétale : des règles ont été fixées, par exemple
    l''interdiction de rouler sur le trottoir, pour la sécurité des piétons.'
- id: fonction-ou-principe
  type: association
  difficulte: 1
  enonce: Pour chaque énoncé, dis s'il décrit une fonction technique (ce que fait l'objet) ou un principe technique (comment
    il le fait).
  reponse:
    gauche:
    - id: eclairer
      texte: Éclairer une pièce
    - id: rechauffer
      texte: Réchauffer un plat
    - id: filament
      texte: Chauffer un filament jusqu'à ce qu'il brille
    - id: led
      texte: Faire passer un courant dans une diode électroluminescente
    - id: micro-ondes
      texte: Émettre des ondes qui agitent l'eau contenue dans les aliments
    droite:
    - id: fonction
      texte: 'Fonction technique : ce que l''objet doit faire'
    - id: principe
      texte: 'Principe technique : la façon dont il le fait'
    paires:
      eclairer: fonction
      rechauffer: fonction
      filament: principe
      led: principe
      micro-ondes: principe
  indices:
    relance: Pour chaque énoncé, décrit-il le but à atteindre, ou le moyen employé pour l'atteindre ?
    methode: La fonction répond à « à quoi ça sert ? », le principe répond à « comment ça marche ? ».
    etape: Éclairer une pièce, c'est un but à atteindre. Classe-le, puis regarde les énoncés qui décrivent un moyen.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque élément et demande-toi ce qu'il fait vraiment.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Commence par celle dont tu es sûr, puis avance par élimination.
  solution: 'Éclairer et réchauffer : fonctions. Filament chauffé, diode, ondes qui agitent l''eau : principes techniques.'
- id: usage-ia
  type: choix
  difficulte: 2
  enonce: Lesquels de ces exemples utilisent une intelligence artificielle qui apprend à partir de données ?
  reponse:
    options:
    - id: a
      texte: Un site propose des vidéos à partir de ce que tu as déjà regardé
    - id: b
      texte: Un logiciel traduit automatiquement une phrase
    - id: c
      texte: Une calculatrice additionne deux nombres
    - id: d
      texte: Un interrupteur crépusculaire allume la lampe sous un seuil de lumière fixé à l'avance
    bonnes:
    - a
    - b
  indices:
    relance: Pour chaque exemple, le résultat vient-il de données sur lesquelles le programme s'est entraîné, ou d'une règle
      fixe ?
    methode: Une IA s'améliore avec des données. Un programme qui applique toujours la même règle simple n'est pas une IA.
    etape: 'Une calculatrice applique toujours la même règle de calcul : ce n''est pas de l''IA. Examine les autres exemples
      avec la même question.'
  pieges:
  - si:
      contient:
      - c
    relance: Une addition suit une règle fixe, sans apprentissage à partir de données.
  - si:
      contient:
      - d
    relance: 'Le seuil est fixé à l''avance : le programme n''apprend rien à partir de données.'
  - si:
      diagnostic: incomplet
    relance: Il en manque. Reprends les options une par une.
  solution: La recommandation de vidéos et la traduction automatique s'appuient sur des IA entraînées avec des données. La
    calculatrice et l'interrupteur crépusculaire suivent des règles fixes.
- id: nblm-comment-definit-on-une-famille-d-objets-1
  type: choix
  difficulte: 2
  enonce: Comment définit-on une famille d'objets techniques en technologie ?
  reponse:
    options:
    - id: o1
      texte: C'est un ensemble d'objets qui répondent au même besoin, quel que soit leur principe technique.
    - id: o2
      texte: C'est un ensemble d'objets qui utilisent exactement le même principe technique et se succèdent dans le temps.
    - id: o3
      texte: C'est un groupe d'objets fabriqués la même année par le même constructeur.
    - id: o4
      texte: C'est une série d'inventions expérimentales qui n'ont jamais été vendues.
    bonnes:
    - o1
  indices:
    relance: Pense au besoin global auquel répondent des objets comme la bougie, la lampe à pétrole et l'ampoule.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : ceci est la définition d''une lignée d''objets, pas d''une famille.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la marque ou l''année de fabrication ne définissent pas une famille d''objets.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la famille concerne des objets répondant à un besoin d''usage réel et non de simples prototypes.'
  solution: 'C''est un ensemble d''objets qui répondent au même besoin, quel que soit leur principe technique. C''est la définition
    exacte : la famille regroupe tous les objets répondant au même besoin, peu importe la technologie utilisée.'
- id: nblm-qu-est-ce-qui-caracterise-une-lignee-d-o-2
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qui caractérise une lignée d'objets ?
  reponse:
    options:
    - id: o1
      texte: Elle regroupe des objets d'une même famille qui utilisent le même principe technique et évoluent dans le temps.
    - id: o2
      texte: Elle regroupe des objets qui répondent à des besoins totalement différents.
    - id: o3
      texte: Elle désigne un objet unique qui n'a jamais subi la moindre amélioration.
    - id: o4
      texte: Elle rassemble des objets utilisant des principes techniques très différents pour un même besoin.
    bonnes:
    - o1
  indices:
    relance: Pense à l'évolution chronologique des ampoules à filament qui s'améliorent au cours du temps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : les objets d''une lignée appartiennent obligatoirement à la même famille et répondent au même besoin.'
  - si:
      contient:
      - o3
    relance: 'Erreur : une lignée implique une succession d''objets qui évoluent au fil du temps.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : si les principes techniques sont différents, les objets ne sont pas dans la même lignée.'
  solution: 'Elle regroupe des objets d''une même famille qui utilisent le même principe technique et évoluent dans le temps.
    C''est exact : les objets d''une même lignée partagent le même principe technique et se succèdent chronologiquement.'
- id: nblm-quelle-est-la-difference-fondamentale-en-3
  type: choix
  difficulte: 2
  enonce: Quelle est la différence fondamentale entre la fonction technique et le principe technique d'un objet ?
  reponse:
    options:
    - id: o1
      texte: La fonction technique indique ce que doit faire l'objet, tandis que le principe technique explique comment il
        le fait.
    - id: o2
      texte: La fonction technique décrit le phénomène physique utilisé et le principe technique indique le besoin de l'utilisateur.
    - id: o3
      texte: La fonction technique dépend de la marque et le principe technique dépend uniquement du prix de vente.
    - id: o4
      texte: Il n'y a aucune différence, ce sont deux termes parfaitement synonymes.
    bonnes:
    - o1
  indices:
    relance: Demande-toi quel terme répond à 'Que fait l'objet ?' et lequel répond à 'Comment réalise-t-il cette action ?'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : c''est l''inverse, la fonction exprime le besoin/l''action et non le phénomène physique.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la marque ou le prix n''ont pas de lien direct avec la définition de la fonction ou du principe technique.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la fonction (ce qu''il fait) et le principe (comment il le fait) sont deux notions distinctes.'
  solution: 'La fonction technique indique ce que doit faire l''objet, tandis que le principe technique explique comment il
    le fait. C''est exact : la fonction décrit l''action attendue (ex. éclairer) et le principe décrit le fonctionnement physique
    retenu (ex. filament chauffé).'
