- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant l'invention, l'innovation et les contraintes sociétales ?
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Une invention devient une innovation lorsqu'elle est commercialisée et réellement adoptée par les usagers.
    - id: o2
      texte: Les évolutions des objets techniques sont encadrées par des contraintes sociétales (lois, normes, sécurité).
    - id: o3
      texte: Une invention qui n'est ni vendue ni utilisée par le public est appelée une innovation de rupture.
    - id: o4
      texte: Une évolution technologique présente toujours exclusivement des avantages sans aucun inconvénient.
