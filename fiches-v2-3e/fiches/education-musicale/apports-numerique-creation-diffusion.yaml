format: 2
notion: apports-numerique-creation-diffusion
version: 3
etat: verifiee
declencheurs:
- logiciel de MAO
- musique assistée par ordinateur
- sampler un morceau
- écouter en streaming
- droits d'auteur d'une chanson
- faire un beat sur ordinateur
- enregistrer sa voix
- mettre de l'écho
- Creative Commons
- fichier MP3
prerequis:
- 4e-apports-numerique-creation-diffusion
- timbre-et-espace
essentiel: 'Le numérique permet à chacun de créer et de diffuser de la musique avec un ordinateur, une tablette ou un téléphone.
  La création passe par trois grandes actions :

  - Capter : enregistrer un son avec un micro. Le son est numérisé : il est mesuré un très grand nombre de fois par seconde
  (44 100 fois par seconde pour un CD), et chaque mesure devient un nombre.

  - Manipuler : transformer le timbre du son avec des effets (réverbération, écho, distorsion, égaliseur), le ralentir, l''accélérer,
  le rendre plus aigu ou plus grave, le jouer à l''envers.

  - Organiser dans le temps : dans un logiciel de MAO (musique assistée par ordinateur), le séquenceur place les sons sur
  des pistes, les copie, les met en boucle et les mixe. Le MIDI transmet des notes (quelle note, quand, avec quelle force)
  d''un clavier à un ordinateur, sans transmettre le son lui-même.


  L''échantillonnage (en anglais sampling) consiste à prélever un extrait d''un enregistrement (un échantillon, ou sample)
  pour le réutiliser dans une nouvelle création, souvent en boucle. Le rap et les musiques électroniques l''utilisent beaucoup.


  Diffuser : on exporte le morceau en fichier audio. Le format WAV garde tout le son ; le MP3 est compressé, environ dix fois
  plus léger, mais il perd un peu de qualité. On peut ensuite le publier sur une plateforme. Avec le streaming, on écoute
  la musique en ligne sans posséder le fichier.


  Les droits d''auteur protègent les créateurs. En France, une œuvre est protégée jusqu''à 70 ans après la mort de son auteur
  ; ensuite, elle entre dans le domaine public. Utiliser un extrait (même très court) d''une œuvre protégée dans un morceau
  publié demande l''autorisation des ayants droit. La SACEM collecte et reverse les droits aux auteurs et compositeurs qui
  en sont membres. Certaines œuvres sont sous licence libre (Creative Commons) : on peut les réutiliser en respectant leurs
  conditions, par exemple citer l''auteur.


  Quelques outils de plus. Une piste est une ligne du séquenceur qui contient un son ou un instrument. Le mixage règle le
  volume et la position gauche-droite de chaque piste. Une boucle (loop) est un extrait qui se répète. Un synthétiseur fabrique
  des sons de toutes pièces.


  Le numérique a changé la diffusion : on peut partager un morceau en quelques minutes, mais il faut vérifier les droits avant
  de publier.


  Ce qu''on attend : décrire une création avec les quatre étapes (capter, manipuler, organiser, diffuser), citer l''outil
  de chacune et expliquer pourquoi on vérifie les droits.

  '
methode:
- 'Pour décrire une création numérique, suivre les étapes : capter, manipuler, organiser, diffuser.'
- 'Nommer l''outil de chaque étape : micro, effets, séquenceur, plateforme.'
- Dire d'où viennent les sons utilisés (enregistrés, échantillonnés, synthétisés).
- 'Avant de publier, vérifier les droits de chaque son emprunté : domaine public, licence libre ou autorisation.'
vocabulaire:
- terme: MAO
  definition: musique assistée par ordinateur
- terme: séquenceur
  definition: logiciel ou partie de logiciel qui organise les sons sur des pistes, dans le temps
- terme: échantillon (sample)
  definition: extrait sonore prélevé dans un enregistrement pour être réutilisé
- terme: streaming
  definition: écoute en ligne d'une musique, sans en posséder le fichier
- terme: piste
  definition: ligne du séquenceur qui contient un son ou un instrument
- terme: MIDI
  definition: langage qui transmet des informations de notes (laquelle, quand, avec quelle force) et non le son lui-même
- terme: mixage
  definition: réglage du volume et de la position gauche-droite de chaque piste
erreurs_frequentes:
- 'Croire qu''on peut utiliser librement un extrait de moins de quelques secondes : c''est faux, toute reprise d''une œuvre
  protégée demande une autorisation.'
- Croire que tout ce qui est sur internet est libre de droits.
- Confondre le MIDI (des informations de notes) et un enregistrement audio (le son lui-même).
- 'Penser que le MP3 est de même qualité que le fichier original : il est compressé, avec des pertes.'
- Confondre l'échantillonnage (prélever un extrait pour le réutiliser) et la numérisation (mesurer le son 44 100 fois par
  seconde).
exemple:
  enonce: Un élève enregistre sa voix, ajoute un écho, puis place sa voix sur une boucle de batterie dans un logiciel. Quelles
    grandes actions a-t-il réalisées ?
  solution: Il a capté un son (enregistrement de sa voix), l'a manipulé (effet d'écho qui change le timbre et l'espace), puis
    l'a organisé dans le temps avec le séquenceur (placement sur la boucle).
exercices:
- id: etapes-production
  type: ordre
  difficulte: 1
  enonce: Range ces étapes de la production d'un morceau dans l'ordre.
  reponse:
    elements:
    - id: micro
      texte: enregistrer la voix avec un micro
    - id: mixer
      texte: placer et mixer les pistes dans le logiciel de MAO
    - id: exporter
      texte: exporter le morceau en fichier MP3
    - id: publier
      texte: mettre le fichier en ligne sur une plateforme
  indices:
    relance: Peut-on mixer une voix qui n'a pas encore été enregistrée ?
    methode: 'Chaque étape a besoin de la précédente : il faut un son, puis un morceau monté, puis un fichier, puis on peut
      le publier.'
    etape: L'enregistrement vient en premier et la publication en dernier. Range les deux étapes du milieu.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle a besoin de l'autre pour exister ?
  - si:
      diagnostic: ordre_faux
    relance: Cherche d'abord la toute première étape (il faut un son) et la toute dernière (le public l'écoute).
  solution: Enregistrer (capter), placer et mixer les pistes (organiser), exporter en MP3, puis publier (diffuser).
- id: outils-actions
  type: association
  difficulte: 2
  enonce: Relie chaque outil à l'action qu'il permet.
  reponse:
    gauche:
    - id: a
      texte: un micro
    - id: b
      texte: un effet de réverbération
    - id: c
      texte: le séquenceur d'un logiciel de MAO
    - id: d
      texte: une plateforme de streaming
    droite:
    - id: w
      texte: capter le son
    - id: x
      texte: transformer le timbre et l'espace du son
    - id: y
      texte: organiser les sons dans le temps
    - id: z
      texte: diffuser la musique
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lequel de ces outils sert au tout début, et lequel à la toute fin ?
    methode: 'Suis l''ordre de la création : capter, manipuler, organiser, diffuser. Chaque outil sert à une étape.'
    etape: Le micro sert à la première étape. Une réverbération donne l'impression d'une grande salle. Place les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel de ces outils range les sons sur des pistes ?
  - si:
      diagnostic: associations_fausses
    relance: Range d'abord les outils dans l'ordre où on s'en sert, puis relie-les aux quatre actions, dans le même ordre.
  solution: 'Micro : capter. Réverbération : transformer le timbre et l''espace. Séquenceur : organiser dans le temps. Plateforme
    de streaming : diffuser.'
- id: mot-prelever-extrait
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on la technique qui consiste à prélever un extrait d'un enregistrement pour le réutiliser, souvent
    en boucle, dans une nouvelle création ?
  reponse:
    acceptees:
    - échantillonnage
    - sampling
    fautes_tolerees: 1
  indices:
    relance: Comment appelle-t-on le petit extrait prélevé ? La technique porte un nom de la même famille.
    methode: L'extrait prélevé s'appelle un échantillon. Quel nom désigne le fait d'en prélever ?
    etape: Le mot français se termine par « -age », comme « montage » ou « mixage ».
  pieges:
  - si:
      valeur: échantillon
    relance: L'échantillon, c'est l'extrait prélevé. Quel mot de la même famille désigne la technique qui consiste à le prélever
      ?
  - si:
      valeur: sample
    relance: Le sample, c'est l'extrait prélevé. Quel mot désigne la technique elle-même ?
  - si:
      valeur: mixage
    relance: Le mixage règle le volume et l'équilibre des pistes. Quel mot désigne le fait de prélever un extrait ?
  - si:
      valeur: enregistrement
    relance: L'enregistrement capte un son nouveau. Ici, on reprend un extrait d'un enregistrement qui existe déjà.
  solution: 'L''échantillonnage (en anglais sampling) : on prélève un échantillon, ou sample, pour le réutiliser.'
- id: mesures-cd
  type: nombre
  difficulte: 2
  enonce: Pour un CD, le son est mesuré 44 100 fois par seconde. Combien de mesures faut-il pour 10 secondes de musique ?
  reponse:
    valeur: 441000
    forme: entier
  indices:
    relance: Combien de mesures sont faites en une seule seconde ?
    methode: Multiplie le nombre de mesures d'une seconde par le nombre de secondes.
    etape: Multiplier par dix revient à ajouter un zéro à la fin du nombre.
  pieges:
  - si:
      valeur: 4410
    relance: Tu as divisé au lieu de multiplier. En 10 secondes, y a-t-il plus ou moins de mesures qu'en une seconde ?
  - si:
      valeur: 44110
    relance: Tu as ajouté 10 au lieu de multiplier par 10.
  solution: 44 100 × 10 = 441 000 mesures.
- id: utiliser-extrait
  type: choix
  difficulte: 2
  enonce: Tu veux utiliser, dans un morceau que tu publieras en ligne, un extrait de trois secondes d'une chanson récente
    d'un artiste connu. Que faut-il ?
  reponse:
    options:
    - id: a
      texte: obtenir l'autorisation des ayants droit
    - id: b
      texte: rien, car l'extrait dure moins de dix secondes
    - id: c
      texte: rien, si tu cites le nom de l'artiste
    - id: d
      texte: rien, car tout ce qui est sur internet est libre
    bonnes:
    - a
  indices:
    relance: Cette chanson récente est-elle dans le domaine public ?
    methode: Une œuvre reste protégée jusqu'à 70 ans après la mort de son auteur. La durée de l'extrait change-t-elle quelque
      chose ?
    etape: Citer le nom de l'artiste ne suffit pas, et il n'existe pas de durée « autorisée ». Qui doit dire oui ?
  pieges:
  - si:
      contient:
      - b
    relance: C'est une idée très répandue, mais fausse. La loi fixe-t-elle une durée d'extrait libre ?
  - si:
      contient:
      - c
    relance: Citer l'auteur est une bonne habitude, mais est-ce que cela remplace son accord ?
  - si:
      contient:
      - d
    relance: Une chanson mise en ligne appartient-elle à tout le monde ? Qui en possède les droits ?
  solution: Il faut l'autorisation des ayants droit (auteurs, compositeurs, producteur). Il n'existe pas de durée d'extrait
    libre, et citer l'artiste ne suffit pas. Sinon, choisis des sons libres de droits, sous licence libre ou dans le domaine
    public.
- id: decrire-creation
  type: ouverte
  difficulte: 3
  enonce: 'Voici la description d''une création : « Un élève a enregistré le claquement d''une porte, l''a ralenti pour le
    rendre plus grave, puis l''a mis en boucle. Il a ajouté une batterie programmée dans un logiciel et sa propre voix avec
    beaucoup d''écho. » Décris sa démarche en quatre ou cinq phrases avec le vocabulaire du numérique, puis dis ce qu''il
    doit vérifier avant de publier son morceau.'
  criteres:
  - 'L''élève nomme les étapes : capter (enregistrement de la porte et de la voix), manipuler (ralenti, effet d''écho qui
    change le timbre et l''espace), organiser (boucle, séquenceur, pistes).'
  - L'élève emploie au moins deux mots précis (MAO, séquenceur, boucle, effet, piste, échantillon).
  - L'élève explique qu'il faut vérifier les droits de tout son emprunté avant de publier (ici, ses sons sont à lui, mais
    une batterie ou un extrait empruntés demanderaient une autorisation ou une licence libre).
  indices:
    relance: Quels sons l'élève a-t-il captés lui-même, et comment les a-t-il transformés ?
    methode: Suis les étapes capter, manipuler, organiser, puis termine par la question des droits.
    etape: Tu peux commencer ainsi « D'abord, l'élève a capté deux sons avec un micro… ».
  solution: 'D''abord, l''élève a capté deux sons avec un micro : le claquement de porte et sa voix. Il les a manipulés :
    le ralenti rend la porte plus grave, et l''écho transforme le timbre et l''espace de sa voix. Il a organisé le tout dans
    le séquenceur d''un logiciel de MAO, avec une boucle et une piste de batterie programmée. Avant de publier, il doit vérifier
    que tous les sons utilisés lui appartiennent ou sont libres de droits ; s''il avait emprunté un extrait d''une chanson,
    il lui faudrait une autorisation.'
- id: nblm-que-signifie-le-sigle-mao-en-education-m-1
  type: choix
  difficulte: 2
  enonce: Que signifie le sigle MAO en éducation musicale quand on utilise un logiciel pour créer de la musique ?
  reponse:
    options:
    - id: o1
      texte: Musique assistée par ordinateur
    - id: o2
      texte: Musique acoustique et orchestrale
    - id: o3
      texte: Module d'enregistrement audio
    - id: o4
      texte: Mixage automatique d'orchestre
    bonnes:
    - o1
  indices:
    relance: Pense au rôle de l'outil informatique et des logiciels dans le processus de création musicale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la MAO désigne précisément le domaine numérique et informatique, et non la musique purement
      acoustique ou traditionnelle.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la MAO couvre l''ensemble de la création musicale informatique et ne se limite pas au seul
      mixage automatisé.'
  solution: Musique assistée par ordinateur. C'est la définition exacte du sigle MAO, désignant l'utilisation de l'informatique
    pour capter, manipuler et organiser la musique.
- id: nblm-dans-un-logiciel-de-mao-quel-outil-perme-2
  type: choix
  difficulte: 2
  enonce: Dans un logiciel de MAO, quel outil permet de placer et d'organiser les sons sur des pistes au fil du temps pour
    faire un beat sur ordinateur ?
  reponse:
    options:
    - id: o1
      texte: Le séquenceur
    - id: o2
      texte: L'égaliseur
    - id: o3
      texte: Le sonomètre
    - id: o4
      texte: Le microphone
    bonnes:
    - o1
  indices:
    relance: Il s'agit du composant du logiciel qui gère la séquence temporelle des éléments musicaux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : l''égaliseur est un effet utilisé pour manipuler les fréquences et le timbre du son, pas pour
      structurer les pistes dans le temps.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le sonomètre est un appareil servant à mesurer l''intensité sonore en décibels, sans lien avec
      la création sur ordinateur.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le micro sert uniquement à capter un son physique pour le numériser, pas à l''organiser sur
      la grille temporelle.'
  solution: Le séquenceur. Le séquenceur est l'outil du logiciel de MAO qui organise les sons sur des pistes, les met en boucle
    et les mixe dans le temps.
- id: nblm-en-quoi-consiste-le-fait-de-sampler-un-m-3
  type: choix
  difficulte: 2
  enonce: En quoi consiste le fait de sampler un morceau (échantillonnage) lors de la réalisation d'une musique ?
  reponse:
    options:
    - id: o1
      texte: Prélever un extrait d'un enregistrement pour le réutiliser dans une nouvelle création
    - id: o2
      texte: Enregistrer sa propre voix directement avec un micro sans emprunter de son existant
    - id: o3
      texte: Convertir automatiquement une piste audio enregistrée en fichier d'instructions MIDI
    - id: o4
      texte: Publier un fichier audio complet en téléchargement gratuit sur une plateforme
    bonnes:
    - o1
  indices:
    relance: Réfléchis au sens du mot anglais 'sample', qui signifie échantillon ou extrait sonore.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : l''enregistrement direct correspond à la captation d''un son original, alors que le sampling
      réutilise un enregistrement déjà existant.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le sampling réutilise le son audio prélevé lui-même, il ne s''agit pas d''une conversion de
      format en données de notes.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la publication sur une plateforme concerne la diffusion de l''œuvre, non sa création par prélèvement
      d''échantillons.'
  solution: Prélever un extrait d'un enregistrement pour le réutiliser dans une nouvelle création. L'échantillonnage (sampling)
    consiste à prélever un extrait (un sample) pour l'intégrer dans une nouvelle œuvre, souvent en boucle.
- id: nblm-que-prevoient-les-droits-d-auteur-d-une-4
  type: choix
  difficulte: 2
  enonce: Que prévoient les droits d'auteur d'une chanson lorsqu'un élève souhaite réutiliser un extrait d'une œuvre protégée
    dans sa création publiée ?
  reponse:
    options:
    - id: o1
      texte: Toute réutilisation d'un extrait d'une œuvre protégée nécessite l'autorisation des ayants droit, quelle que soit
        sa durée
    - id: o2
      texte: Il est autorisé d'utiliser librement n'importe quel extrait tant qu'il dure moins de 5 secondes
    - id: o3
      texte: Toutes les musiques trouvées sur internet sont libres de droits pour un projet scolaire
    - id: o4
      texte: Une chanson entre automatiquement dans le domaine public dès qu'elle est diffusée en ligne
    bonnes:
    - o1
  indices:
    relance: Attention aux idées reçues concernant la durée minimale d'un extrait ou la gratuité des contenus sur internet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique très fréquente : croire qu''il existe une tolérance légale pour les extraits très courts est
      faux.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la disponibilité d''une musique sur internet ne signifie pas qu''elle est libre de droits.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : en France, une œuvre entre dans le domaine public seulement 70 ans après la mort de son auteur.'
  solution: Toute réutilisation d'un extrait d'une œuvre protégée nécessite l'autorisation des ayants droit, quelle que soit
    sa durée. Toute reprise d'une œuvre protégée, même de quelques secondes, requiert obligatoirement une autorisation des
    ayants droit.
- id: nblm-quelle-est-la-caracteristique-principale-5
  type: choix
  difficulte: 2
  enonce: Quelle est la caractéristique principale lorsqu'on vient d'écouter en streaming un morceau de musique ?
  reponse:
    options:
    - id: o1
      texte: On écoute le flux sonore en ligne directement sans posséder le fichier sur son appareil
    - id: o2
      texte: On télécharge obligatoirement le fichier complet au format WAV sur son disque dur
    - id: o3
      texte: La musique écoutée est obligatoirement libre de tous droits d'auteur
    - id: o4
      texte: Le fichier transmis contient uniquement des commandes de notes MIDI sans le son
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la différence majeure entre l'écoute en flux continu sur internet et la possession d'un fichier téléchargé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le streaming s''oppose au téléchargement définitif de fichiers volumineux comme le format WAV.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le mode de diffusion en streaming ne change rien au statut des droits d''auteur qui protègent
      l''œuvre.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le streaming transmet le flux du son audio numérisé, et non des instructions de notes MIDI.'
  solution: On écoute le flux sonore en ligne directement sans posséder le fichier sur son appareil. Le streaming permet l'écoute
    directe en ligne sans avoir besoin de télécharger ni de posséder le fichier audio.
- id: nblm-parmi-les-propositions-suivantes-quelles-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes, quelles sont les DEUX affirmations exactes concernant les formats audio et les
    signaux en MAO ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le protocole MIDI transmet des informations de notes (hauteur, durée, force) mais ne transmet pas le son lui-même
    - id: o2
      texte: Le format MP3 est un fichier audio compressé avec pertes, environ dix fois plus léger que le format WAV
    - id: o3
      texte: Le format WAV est un fichier très compressé conçu spécialement pour ne pas occuper de mémoire
    - id: o4
      texte: Un signal MIDI est un enregistrement audio direct équivalent à une prise de son par microphone
    bonnes:
    - o1
    - o2
  indices:
    relance: Distingue bien la nature des données d'évènements (MIDI) des fichiers d'enregistrement audio (WAV et MP3).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le format WAV conserve l''intégralité du son numérisé sans compression, contrairement au MP3.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : il ne faut pas confondre le fichier audio (qui contient le son) et le MIDI (qui contient uniquement
      des données de notes).'
  solution: 'Le protocole MIDI transmet des informations de notes (hauteur, durée, force) mais ne transmet pas le son lui-même
    ; Le format MP3 est un fichier audio compressé avec pertes, environ dix fois plus léger que le format WAV. C''est exact
    : le MIDI transmet des commandes numériques (quelles notes jouer et quand) qu''un synthétiseur ou ordinateur transforme
    ensuite en son.'
- id: nblm-quel-terme-de-vocabulaire-francais-desig-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme de vocabulaire français désigne le court extrait sonore prélevé dans un enregistrement pour être réutilisé
    dans une création numérique ?
  reponse:
    acceptees:
    - échantillon
    fautes_tolerees: 1
  indices:
    relance: Donne le nom français correspondant au terme anglais 'sample'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: échantillon. Un échantillon (ou sample) est l'extrait sonore prélevé dans un enregistrement pour être réutilisé
    en boucle ou modifié.
- id: nblm-en-france-quel-organisme-gere-collecte-e-8
  type: texte_court
  difficulte: 1
  enonce: En France, quel organisme gère, collecte et reverse les droits d'auteur aux auteurs et compositeurs de musique ?
  reponse:
    acceptees:
    - SACEM
    fautes_tolerees: 1
  indices:
    relance: Indique le sigle en 5 lettres de cette société d'auteurs, compositeurs et éditeurs de musique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: SACEM. La SACEM est la société chargée de collecter et de reverser les droits aux créateurs membres en France.
- id: midi-transmet
  type: choix
  difficulte: 2
  enonce: Un clavier est relié à un ordinateur par une liaison MIDI. Que reçoit l'ordinateur ?
  reponse:
    options:
    - id: a
      texte: 'Des informations sur les notes jouées : laquelle, quand, avec quelle force'
    - id: b
      texte: L'enregistrement du son du clavier
    - id: c
      texte: La partition imprimée du morceau
    - id: d
      texte: La vidéo du pianiste
    bonnes:
    - a
  indices:
    relance: Le MIDI est un langage de consignes. Que dit-il ?
    methode: 'Relis la phrase de ta leçon sur le MIDI : il ne transmet pas le son lui-même.'
    etape: L'ordinateur reçoit des ordres du type « telle note, à tel moment, avec telle force ».
  pieges:
  - si:
      contient:
      - b
    relance: Le MIDI ne transmet pas le son lui-même, seulement des consignes. Que contiennent ces consignes ?
  - si:
      contient:
      - c
    relance: Le MIDI ne transmet pas une partition sur papier. Que décrit-il de ce qui est joué ?
  - si:
      contient:
      - d
    relance: Le MIDI ne transporte pas d'image. De quoi parle-t-il ?
  solution: Le MIDI transmet des informations de notes (quelle note, quand, avec quelle force), pas le son lui-même.
- id: mot-piste
  type: texte_court
  difficulte: 1
  enonce: Dans un logiciel de MAO, comment appelle-t-on chaque ligne du séquenceur qui contient un son ou un instrument (batterie,
    voix, guitare) ?
  reponse:
    acceptees:
    - piste
    - une piste
    - pistes
    fautes_tolerees: 1
  indices:
    relance: 'Imagine un tableau où chaque ligne porte un instrument : batterie, voix, guitare.'
    methode: Le séquenceur en aligne plusieurs, l'une au-dessus de l'autre, pour les mixer.
    etape: Le mot commence par « pis- ».
  pieges:
  - si:
      valeur: boucle
    relance: Une boucle est un extrait qui se répète. Ici on cherche la ligne qui contient le son.
  solution: Chaque ligne du séquenceur qui contient un son est une piste. On les mixe pour obtenir le morceau.
