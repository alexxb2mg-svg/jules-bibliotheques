format: 2
notion: styles
version: 2
etat: verifiee
declencheurs:
- musique baroque
- période romantique
- histoire de la musique
- reconnaître l'époque d'une œuvre
- origines du jazz et du rock
- musique du Moyen Âge
- compositeur de quelle époque
- instruments du jazz
- musique d'Indonésie
prerequis:
- 4e-styles
- timbre-et-espace
essentiel: 'Un style se reconnaît à des marqueurs : les instruments et les voix, la façon d''organiser les sons, le rythme,
  la forme, l''époque et le lieu. On range aussi les musiques en grandes catégories : vocale, instrumentale, électroacoustique
  (sons enregistrés ou fabriqués, puis transformés), mixte (instruments et sons électroacoustiques ensemble).


  Les grandes périodes de la musique savante européenne :

  - Moyen Âge (du Ve au XVe siècle) : chant grégorien en monodie, chants de Hildegarde de Bingen (XIIe siècle), troubadours,
  premières polyphonies comme la Messe de Nostre Dame de Guillaume de Machaut (XIVe siècle).

  - Renaissance (XVe-XVIe siècles) : polyphonie vocale riche, chansons et messes.

  - Baroque (environ 1600-1750) : basse continue (clavecin ou orgue qui joue des accords en continu), concerto qui oppose
  soliste et orchestre, naissance de l''opéra (L''Orfeo de Monteverdi, 1607). Repères : Les Quatre Saisons de Vivaldi (publiées
  en 1725), les Concertos brandebourgeois de Jean-Sébastien Bach (1721).

  - Classique (environ 1750-1820) : clarté, équilibre, symphonie et sonate. Repères : Haydn, Mozart (Symphonie n° 40, 1788
  ; La Flûte enchantée, 1791), les débuts de Beethoven.

  - Romantique (XIXe siècle) : expression forte des sentiments, grand orchestre, virtuosité. Repères : la Symphonie n° 5 de
  Beethoven (1808) annonce cette période ; Symphonie fantastique de Berlioz (1830), Chopin, Schubert.

  - XXe siècle : recherches nouvelles sur les timbres et les rythmes. Repères : Le Sacre du printemps de Stravinsky (1913),
  la musique concrète de Pierre Schaeffer (Étude aux chemins de fer, 1948), faite de bruits enregistrés.


  Musiques actuelles :

  - Jazz : né à La Nouvelle-Orléans au début du XXe siècle chez les Afro-Américains ; improvisation, swing, cuivres. Repère
  : West End Blues de Louis Armstrong (1928).

  - Rock : né aux États-Unis dans les années 1950 ; guitare électrique, basse, batterie. Repères : Elvis Presley, Chuck Berry.

  - Rap : né à New York dans les années 1970, dans le mouvement hip-hop ; texte scandé (le flow) sur un rythme (le beat).
  Repère : Rapper''s Delight du Sugarhill Gang (1979).


  Hors d''Occident : le gamelan d''Indonésie (Java, Bali), ensemble de gongs et de métallophones ; Claude Debussy l''a découvert
  à l''Exposition universelle de Paris en 1889.


  Repères du patrimoine français : Machaut (Moyen Âge), Lully et Rameau (baroque), Berlioz (romantique), Debussy et Ravel
  (début du XXe siècle).


  Ce qu''on attend : donner une période ou un style, le justifier par deux ou trois marqueurs entendus, et citer une œuvre
  repère.

  '
methode:
- 'Écouter les instruments et les voix : clavecin, orchestre, guitare électrique, sons électroniques…'
- 'Repérer les procédés : basse continue, improvisation, texte scandé, sons enregistrés transformés…'
- Associer ces marqueurs à une période ou à un style, puis donner une œuvre repère.
- 'Justifier toujours : « c''est baroque parce que… ».'
vocabulaire:
- terme: basse continue
  definition: accompagnement joué sans interruption par un clavecin ou un orgue et un instrument grave, typique du baroque
- terme: improvisation
  definition: musique inventée au moment où on la joue, marqueur essentiel du jazz
- terme: musique électroacoustique
  definition: musique faite de sons enregistrés ou produits électroniquement, puis transformés
- terme: marqueur stylistique
  definition: caractéristique qui permet de reconnaître un style ou une époque
- terme: concerto
  definition: œuvre où un soliste dialogue avec l'orchestre
- terme: symphonie
  definition: grande œuvre pour orchestre, en plusieurs mouvements
- terme: opéra
  definition: œuvre de théâtre entièrement chantée, avec orchestre
erreurs_frequentes:
- 'Appeler « musique classique » toute la musique savante : au sens strict, la période classique va d''environ 1750 à 1820.'
- 'Inverser baroque et classique : le baroque (Vivaldi, Bach) vient avant le classique (Mozart).'
- 'Croire que le rap et le rock sont nés en France : ils sont nés aux États-Unis.'
- Donner une période sans la justifier par des marqueurs entendus.
exemple:
  enonce: On entend un violon soliste qui dialogue avec un orchestre à cordes, et un clavecin qui joue des accords sans s'arrêter.
    De quelle période s'agit-il probablement ?
  solution: 'De la période baroque (environ 1600-1750) : le clavecin qui joue sans s''arrêter est une basse continue, et le
    dialogue soliste-orchestre est celui du concerto, comme dans Les Quatre Saisons de Vivaldi.'
exercices:
- id: periode-basse-continue
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle la période de la musique européenne qui va d'environ 1600 à 1750, marquée par la basse continue,
    avec Vivaldi et Jean-Sébastien Bach ?
  reponse:
    acceptees:
    - baroque
    - période baroque
    - musique baroque
    fautes_tolerees: 0
  indices:
    relance: Cette période vient juste après la Renaissance. Comment l'appelle-t-on ?
    methode: Pense à Vivaldi et aux Quatre Saisons (1725). Quel mot désigne son époque ?
    etape: Le mot désigne aussi, en art, un style chargé d'ornements. Il commence par « ba- ».
  pieges:
  - si:
      valeur: classique
    relance: La période classique vient après, avec Haydn et Mozart. Quelle période est celle de Vivaldi ?
  - si:
      valeur: renaissance
    relance: La Renaissance vient avant, aux XVe et XVIe siècles. Et à partir de 1600 environ ?
  solution: La période baroque (environ 1600-1750), celle de la basse continue, de Vivaldi et de Bach.
- id: marqueur-jazz
  type: choix
  difficulte: 1
  enonce: Lequel de ces éléments est un marqueur essentiel du jazz ?
  reponse:
    options:
    - id: a
      texte: l'improvisation
    - id: b
      texte: la basse continue au clavecin
    - id: c
      texte: le chant à l'unisson en latin
    - id: d
      texte: les bruits enregistrés sur bande magnétique
    bonnes:
    - a
  indices:
    relance: Où et quand le jazz est-il né ? Quelles musiques de la liste sont bien plus anciennes ?
    methode: 'Élimine les marqueurs d''autres styles : le baroque, le chant grégorien du Moyen Âge, la musique concrète.'
    etape: Dans le jazz, les musiciens inventent souvent leur partie au moment où ils jouent. Quel mot désigne cela ?
  pieges:
  - si:
      contient:
      - b
    relance: La basse continue est un marqueur du baroque, deux siècles avant le jazz.
  - si:
      contient:
      - c
    relance: Le chant à l'unisson en latin, c'est le chant grégorien du Moyen Âge.
  - si:
      contient:
      - d
    relance: Les bruits enregistrés, c'est la musique concrète de Pierre Schaeffer. Que font les musiciens de jazz en jouant
      ?
  solution: 'L''improvisation : les musiciens de jazz inventent une partie de la musique au moment où ils la jouent.'
- id: oeuvres-periodes
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à sa période.
  reponse:
    gauche:
    - id: a
      texte: un chant de Hildegarde de Bingen
    - id: b
      texte: Les Quatre Saisons d'Antonio Vivaldi
    - id: c
      texte: la Symphonie n° 40 de Mozart
    - id: d
      texte: la Symphonie fantastique d'Hector Berlioz
    - id: e
      texte: Le Sacre du printemps d'Igor Stravinsky
    droite:
    - id: v
      texte: Moyen Âge
    - id: w
      texte: baroque
    - id: x
      texte: classique
    - id: y
      texte: romantique
    - id: z
      texte: XXe siècle
    paires:
      a: v
      b: w
      c: x
      d: y
      e: z
  indices:
    relance: Quelle œuvre est la plus ancienne, et laquelle la plus récente ?
    methode: Range d'abord les périodes dans l'ordre, puis place les compositeurs que tu connais le mieux.
    etape: Hildegarde de Bingen vivait au XIIe siècle, et Mozart est le grand compositeur classique. Place les trois autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie Vivaldi et Berlioz.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars des repères sûrs : Hildegarde au Moyen Âge, Mozart à la période classique. Puis place les autres avant
      ou après.'
  solution: 'Hildegarde de Bingen : Moyen Âge (XIIe siècle). Vivaldi, Les Quatre Saisons : baroque (1725). Mozart, Symphonie
    n° 40 : classique (1788). Berlioz, Symphonie fantastique : romantique (1830). Stravinsky, Le Sacre du printemps : XXe
    siècle (1913).'
- id: chronologie-oeuvres
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: machaut
