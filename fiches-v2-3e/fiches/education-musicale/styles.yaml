    - id: o3
      texte: Le Moyen Âge.
    - id: o4
      texte: La période romantique.
    bonnes:
    - o1
  indices:
    relance: C'est la période de Vivaldi et de Bach, située entre 1600 et 1750.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la période classique (1750-1820) vient après le baroque et privilégie la clarté et l''équilibre
