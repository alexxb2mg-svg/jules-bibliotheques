format: 2
notion: styles
version: 2
etat: generee
declencheurs:
- musique baroque
- période romantique
- histoire de la musique
- reconnaître l'époque d'une œuvre
- origines du jazz et du rock
- musique du Moyen Âge
- compositeur de quelle époque
- instruments du jazz
- musique d'Indonésie
prerequis:
- 4e-styles
- timbre-et-espace
essentiel: |
  Un style se reconnaît à des marqueurs : les instruments et les voix, la façon d'organiser les sons, le rythme, la forme, l'époque et le lieu. On range aussi les musiques en grandes catégories : vocale, instrumentale, électroacoustique (sons enregistrés ou fabriqués, puis transformés), mixte (instruments et sons électroacoustiques ensemble).

  Les grandes périodes de la musique savante européenne :
  - Moyen Âge (du Ve au XVe siècle) : chant grégorien en monodie, chants de Hildegarde de Bingen (XIIe siècle), troubadours, premières polyphonies comme la Messe de Nostre Dame de Guillaume de Machaut (XIVe siècle).
  - Renaissance (XVe-XVIe siècles) : polyphonie vocale riche, chansons et messes.
  - Baroque (environ 1600-1750) : basse continue (clavecin ou orgue qui joue des accords en continu), concerto qui oppose soliste et orchestre, naissance de l'opéra (L'Orfeo de Monteverdi, 1607). Repères : Les Quatre Saisons de Vivaldi (publiées en 1725), les Concertos brandebourgeois de Jean-Sébastien Bach (1721).
  - Classique (environ 1750-1820) : clarté, équilibre, symphonie et sonate. Repères : Haydn, Mozart (Symphonie n° 40, 1788 ; La Flûte enchantée, 1791), les débuts de Beethoven.
  - Romantique (XIXe siècle) : expression forte des sentiments, grand orchestre, virtuosité. Repères : la Symphonie n° 5 de Beethoven (1808) annonce cette période ; Symphonie fantastique de Berlioz (1830), Chopin, Schubert.
  - XXe siècle : recherches nouvelles sur les timbres et les rythmes. Repères : Le Sacre du printemps de Stravinsky (1913), la musique concrète de Pierre Schaeffer (Étude aux chemins de fer, 1948), faite de bruits enregistrés.

  Musiques actuelles :
  - Jazz : né à La Nouvelle-Orléans au début du XXe siècle chez les Afro-Américains ; improvisation, swing, cuivres. Repère : West End Blues de Louis Armstrong (1928).
  - Rock : né aux États-Unis dans les années 1950 ; guitare électrique, basse, batterie. Repères : Elvis Presley, Chuck Berry.
  - Rap : né à New York dans les années 1970, dans le mouvement hip-hop ; texte scandé (le flow) sur un rythme (le beat). Repère : Rapper's Delight du Sugarhill Gang (1979).

  Hors d'Occident : le gamelan d'Indonésie (Java, Bali), ensemble de gongs et de métallophones ; Claude Debussy l'a découvert à l'Exposition universelle de Paris en 1889.

  Repères du patrimoine français : Machaut (Moyen Âge), Lully et Rameau (baroque), Berlioz (romantique), Debussy et Ravel (début du XXe siècle).

  Ce qu'on attend : donner une période ou un style, le justifier par deux ou trois marqueurs entendus, et citer une œuvre repère.
methode:
- 'Écouter les instruments et les voix : clavecin, orchestre, guitare électrique, sons électroniques…'
- 'Repérer les procédés : basse continue, improvisation, texte scandé, sons enregistrés transformés…'
- Associer ces marqueurs à une période ou à un style, puis donner une œuvre repère.
- 'Justifier toujours : « c''est baroque parce que… ».'
vocabulaire:
- terme: basse continue
  definition: accompagnement joué sans interruption par un clavecin ou un orgue et un instrument grave, typique du baroque
- terme: improvisation
  definition: musique inventée au moment où on la joue, marqueur essentiel du jazz
- terme: musique électroacoustique
  definition: musique faite de sons enregistrés ou produits électroniquement, puis transformés
- terme: marqueur stylistique
  definition: caractéristique qui permet de reconnaître un style ou une époque
- terme: concerto
  definition: œuvre où un soliste dialogue avec l'orchestre
- terme: symphonie
  definition: grande œuvre pour orchestre, en plusieurs mouvements
- terme: opéra
  definition: œuvre de théâtre entièrement chantée, avec orchestre
erreurs_frequentes:
- 'Appeler « musique classique » toute la musique savante : au sens strict, la période classique va d''environ 1750 à 1820.'
- 'Inverser baroque et classique : le baroque (Vivaldi, Bach) vient avant le classique (Mozart).'
- 'Croire que le rap et le rock sont nés en France : ils sont nés aux États-Unis.'
- Donner une période sans la justifier par des marqueurs entendus.
exemple:
  enonce: On entend un violon soliste qui dialogue avec un orchestre à cordes, et un clavecin qui joue des accords sans s'arrêter.
    De quelle période s'agit-il probablement ?
  solution: 'De la période baroque (environ 1600-1750) : le clavecin qui joue sans s''arrêter est une basse continue, et le
    dialogue soliste-orchestre est celui du concerto, comme dans Les Quatre Saisons de Vivaldi.'
exercices:
- id: periode-basse-continue
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle la période de la musique européenne qui va d'environ 1600 à 1750, marquée par la basse continue,
    avec Vivaldi et Jean-Sébastien Bach ?
  reponse:
    acceptees:
    - baroque
    - période baroque
    - musique baroque
    fautes_tolerees: 0
  indices:
    relance: Cette période vient juste après la Renaissance. Comment l'appelle-t-on ?
    methode: Pense à Vivaldi et aux Quatre Saisons (1725). Quel mot désigne son époque ?
    etape: Le mot désigne aussi, en art, un style chargé d'ornements. Il commence par « ba- ».
  pieges:
  - si:
      valeur: classique
    relance: La période classique vient après, avec Haydn et Mozart. Quelle période est celle de Vivaldi ?
  - si:
      valeur: renaissance
    relance: La Renaissance vient avant, aux XVe et XVIe siècles. Et à partir de 1600 environ ?
  solution: La période baroque (environ 1600-1750), celle de la basse continue, de Vivaldi et de Bach.
- id: marqueur-jazz
  type: choix
  difficulte: 1
  enonce: Lequel de ces éléments est un marqueur essentiel du jazz ?
  reponse:
    options:
    - id: a
      texte: l'improvisation
    - id: b
      texte: la basse continue au clavecin
    - id: c
      texte: le chant à l'unisson en latin
    - id: d
      texte: les bruits enregistrés sur bande magnétique
    bonnes:
    - a
  indices:
    relance: Où et quand le jazz est-il né ? Quelles musiques de la liste sont bien plus anciennes ?
    methode: 'Élimine les marqueurs d''autres styles : le baroque, le chant grégorien du Moyen Âge, la musique concrète.'
    etape: Dans le jazz, les musiciens inventent souvent leur partie au moment où ils jouent. Quel mot désigne cela ?
  pieges:
  - si:
      contient:
      - b
    relance: La basse continue est un marqueur du baroque, deux siècles avant le jazz.
  - si:
      contient:
      - c
    relance: Le chant à l'unisson en latin, c'est le chant grégorien du Moyen Âge.
  - si:
      contient:
      - d
    relance: Les bruits enregistrés, c'est la musique concrète de Pierre Schaeffer. Que font les musiciens de jazz en jouant
      ?
  solution: 'L''improvisation : les musiciens de jazz inventent une partie de la musique au moment où ils la jouent.'
- id: oeuvres-periodes
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à sa période.
  reponse:
    gauche:
    - id: a
      texte: un chant de Hildegarde de Bingen
    - id: b
      texte: Les Quatre Saisons d'Antonio Vivaldi
    - id: c
      texte: la Symphonie n° 40 de Mozart
    - id: d
      texte: la Symphonie fantastique d'Hector Berlioz
    - id: e
      texte: Le Sacre du printemps d'Igor Stravinsky
    droite:
    - id: v
      texte: Moyen Âge
    - id: w
      texte: baroque
    - id: x
      texte: classique
    - id: y
      texte: romantique
    - id: z
      texte: XXe siècle
    paires:
      a: v
      b: w
      c: x
      d: y
      e: z
  indices:
    relance: Quelle œuvre est la plus ancienne, et laquelle la plus récente ?
    methode: Range d'abord les périodes dans l'ordre, puis place les compositeurs que tu connais le mieux.
    etape: Hildegarde de Bingen vivait au XIIe siècle, et Mozart est le grand compositeur classique. Place les trois autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie Vivaldi et Berlioz.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars des repères sûrs : Hildegarde au Moyen Âge, Mozart à la période classique. Puis place les autres avant
      ou après.'
  solution: 'Hildegarde de Bingen : Moyen Âge (XIIe siècle). Vivaldi, Les Quatre Saisons : baroque (1725). Mozart, Symphonie
    n° 40 : classique (1788). Berlioz, Symphonie fantastique : romantique (1830). Stravinsky, Le Sacre du printemps : XXe
    siècle (1913).'
- id: chronologie-oeuvres
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: machaut
      texte: la Messe de Nostre Dame de Guillaume de Machaut
    - id: orfeo
      texte: l'opéra L'Orfeo de Claudio Monteverdi
    - id: beethoven
      texte: la Symphonie n° 5 de Beethoven
    - id: armstrong
      texte: West End Blues de Louis Armstrong
    - id: rap
      texte: Rapper's Delight du Sugarhill Gang
  indices:
    relance: Lesquelles de ces œuvres sont du XXe siècle ?
    methode: Place chaque œuvre dans sa période (Moyen Âge, baroque, fin du classique, jazz, rap), puis range les périodes.
    etape: La messe de Machaut date du Moyen Âge (XIVe siècle). L'Orfeo est l'un des premiers opéras, au tout début du baroque.
      Continue.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux œuvres voisines sont inversées. Lequel des deux styles est né en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Sépare la musique savante européenne ancienne et les musiques actuelles du XXe siècle, puis range chaque groupe.
  solution: Machaut, Messe de Nostre Dame (XIVe siècle) ; Monteverdi, L'Orfeo (1607) ; Beethoven, Symphonie n° 5 (1808) ;
    Louis Armstrong, West End Blues (1928) ; Sugarhill Gang, Rapper's Delight (1979).
- id: categorie-musique-concrete
  type: choix
  difficulte: 2
  enonce: L'Étude aux chemins de fer de Pierre Schaeffer (1948) est faite uniquement de bruits de trains enregistrés, puis
    découpés et transformés. À quelle grande catégorie appartient-elle ?
  reponse:
    options:
    - id: a
      texte: la musique vocale
    - id: b
      texte: la musique instrumentale
    - id: c
      texte: la musique électroacoustique
    - id: d
      texte: la musique mixte
    bonnes:
    - c
  indices:
    relance: Y a-t-il des chanteurs ou des instruments dans cette œuvre ?
    methode: Cette musique est faite de sons enregistrés puis transformés avec des machines. Quelle catégorie regroupe ces
      musiques ?
    etape: 'Élimine la musique vocale et la musique instrumentale. La musique mixte mélange instruments joués en direct et
      sons enregistrés : est-ce le cas ici ?'
  pieges:
  - si:
      contient:
      - d
    relance: La musique mixte associe des instruments joués et des sons enregistrés. Ici, y a-t-il des instruments ?
  - si:
      contient:
      - b
    relance: Un train n'est pas un instrument de musique. Comment ces sons ont-ils été obtenus ?
  - si:
      contient:
      - a
    relance: Entend-on des voix dans cette œuvre ?
  solution: 'La musique électroacoustique : l''œuvre est faite de sons enregistrés puis transformés. Pierre Schaeffer l''a
    appelée « musique concrète ».'
- id: identifier-style
  type: ouverte
  difficulte: 3
  enonce: 'Voici la description d''un extrait : « Un petit orchestre à cordes joue avec un clavecin, qui fait entendre des
    accords sans jamais s''arrêter. Un violon soliste alterne avec tout l''orchestre. Le tempo est rapide et la pulsation
    très régulière. » Propose une période et un compositeur possible, et justifie avec trois marqueurs stylistiques.'
  criteres:
  - L'élève propose la période baroque (environ 1600-1750) et un compositeur cohérent (Vivaldi, Bach…).
  - 'L''élève justifie avec au moins deux marqueurs : basse continue au clavecin, alternance soliste et orchestre (concerto),
    pulsation régulière.'
  - L'élève emploie le vocabulaire précis (basse continue, soliste, tutti, concerto).
  indices:
    relance: Quel instrument de l'extrait est typique d'une période précise ?
    methode: Relève les marqueurs (instruments, alternances, rythme), associe-les à une période, puis donne une œuvre repère.
    etape: Tu peux commencer ainsi « Le clavecin qui joue des accords sans s'arrêter est une basse continue, donc… ».
  solution: Cet extrait est probablement baroque (environ 1600-1750), par exemple un concerto de Vivaldi. Le clavecin qui
    joue des accords sans s'arrêter est une basse continue. Le violon soliste qui alterne avec tout l'orchestre (tutti) est
    le principe du concerto. La pulsation régulière et rapide est aussi typique de cette époque, comme dans Les Quatre Saisons.
- id: mot-pays-gamelan
  type: texte_court
  difficulte: 2
  enonce: Dans quel pays d'Asie du Sud-Est, dont Java et Bali sont des îles, joue-t-on le gamelan ?
  reponse:
    acceptees:
    - indonésie
    - indonesie
    - l'indonésie
    fautes_tolerees: 1
  indices:
    relance: Pense au plus grand archipel du monde, entre l'océan Indien et l'océan Pacifique.
    methode: C'est le pays qui compte les îles de Java, de Bali et de Sumatra.
    etape: Son nom commence par « In ».
  pieges:
  - si:
      valeur: inde
    relance: L'Inde est un grand pays d'Asie du Sud. Java et Bali sont des îles situées plus à l'est.
  - si:
      valeur: japon
    relance: Le Japon est en Asie de l'Est. Java et Bali sont beaucoup plus au sud, près de l'équateur.
  solution: Le gamelan est l'ensemble de gongs et de métallophones de Java et de Bali, en Indonésie.
- id: rock-instruments
  type: choix
  difficulte: 2
  enonce: Quels instruments sont typiques d'un groupe de rock des années 1950-1960 ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: la guitare électrique
    - id: b
      texte: le clavecin
    - id: c
      texte: la batterie
    - id: d
      texte: le gamelan
    bonnes:
    - a
    - c
  indices:
    relance: Pense aux marqueurs du rock donnés dans ta leçon.
    methode: Le rock est né aux États-Unis dans les années 1950 et s'appuie sur des instruments électriques et une section
      rythmique.
    etape: Élimine les deux instruments qui appartiennent à d'autres styles étudiés dans la leçon.
  pieges:
  - si:
      contient:
      - b
    relance: Le clavecin est un marqueur du baroque, quatre siècles avant le rock.
  - si:
      contient:
      - d
    relance: Le gamelan est un ensemble d'Indonésie. Est-il typique du rock né aux États-Unis ?
  solution: Le rock repose sur la guitare électrique, la basse électrique et la batterie. Le clavecin est baroque et le gamelan
    indonésien.
