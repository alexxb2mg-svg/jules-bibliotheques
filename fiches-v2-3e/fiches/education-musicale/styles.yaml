    - id: o2
      texte: La présence systématique d'une basse continue jouée au clavecin.
    - id: o3
      texte: L'utilisation de la guitare électrique, de la basse et de la batterie.
    - id: o4
      texte: L'expression exacerbée des sentiments par un grand orchestre symphonique.
    bonnes:
    - o1
  indices:
    relance: Pense au chant religieux ancien sans accompagnement instrumental.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la basse continue au clavecin est le marqueur de la période baroque (1600-1750), pas du Moyen
      Âge.'
  - si:
      contient:
      - o3
    relance: 'Erreur d''anachronisme : ces instruments électriques sont les marqueurs du rock, né aux États-Unis dans les
      années 1950.'
  - si:
      contient:
      - o4
    relance: 'Erreur de période : le grand orchestre et l''expression passionnée des sentiments caractérisent la période romantique
      au XIXe siècle.'
  solution: 'Le chant grégorien en monodie et l''émergence des premières polyphonies. C''est exact : le Moyen Âge est caractérisé
    par le chant grégorien monodique puis par les premières polyphonies comme la Messe de Nostre Dame de Guillaume de Machaut.'
