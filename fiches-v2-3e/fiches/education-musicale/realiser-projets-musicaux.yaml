format: 2
notion: realiser-projets-musicaux
version: 1
etat: verifiee
declencheurs:
- concert de fin d'année
- répétition générale
- chorale du collège
- monter un spectacle musical
- se produire sur scène
- répartir les voix
prerequis:
- 4e-realiser-projets-musicaux
- mobiliser-techniques-vocales
couverture: 'Couvre la conduite d''un projet musical collectif (interprétation ou création) : définir ses caractéristiques,
  le répéter, l''interpréter devant un public et en présenter les choix. Le détail des techniques vocales et de l''argumentation
  est traité dans les fiches voisines.'
essentiel: 'Un projet musical, c''est préparer une musique pour la jouer devant d''autres : soit on interprète une œuvre qui
  existe déjà, soit on crée sa propre pièce.


  Avant de répéter, on définit les caractéristiques musicales du projet : l''effectif (combien de voix, quels instruments),
  le style, la forme (couplets, refrain, introduction, fin), le tempo, les nuances et la durée.


  On choisit ensuite les ressources adaptées : la voix, les percussions corporelles, les instruments de la classe, un logiciel
  ou un enregistreur, une partition ou un simple codage.


  Le travail se fait par étapes : apprendre chaque partie séparément, assembler, soigner les nuances et les départs, puis
  faire une répétition générale (un « filage ») dans les conditions du concert.


  Le jour venu, on interprète la pièce devant un public et on présente les choix artistiques faits : pourquoi ce tempo, pourquoi
  un soliste à tel moment, pourquoi cette fin. Écouter ensuite un enregistrement permet de faire le bilan.

  '
methode:
- 'Définir le projet : œuvre ou création, effectif, style, forme, tempo, nuances, durée.'
- 'Répartir les rôles : solistes, pupitres, accompagnement, personne qui donne les départs.'
- Apprendre chaque partie séparément, puis assembler les parties.
- 'Régler les détails expressifs : nuances, départs et fins ensemble, équilibre entre les voix.'
- Faire une répétition générale dans les conditions du concert.
- Interpréter devant le public, présenter ses choix, puis écouter l'enregistrement pour faire le bilan.
vocabulaire:
- terme: tutti
  definition: 'mot italien qui veut dire « tous » : passage où tout l''ensemble joue ou chante'
- terme: soliste
  definition: musicien ou chanteur qui joue seul une partie, mis en valeur face au groupe
- terme: pupitre
  definition: groupe de chanteurs ou d'instrumentistes qui ont la même partie (par exemple les voix graves)
- terme: filage
  definition: répétition où l'on joue tout le programme d'un bout à l'autre, sans s'arrêter, comme le jour du concert
- terme: nuance
  definition: 'indication de l''intensité du son : piano (doux), forte (fort), crescendo (de plus en plus fort)…'
erreurs_frequentes:
- Commencer à répéter tout ensemble sans avoir défini le tempo, la forme et le rôle de chacun.
- 'Oublier le public : un projet musical se termine par une interprétation devant d''autres, pas seulement en classe.'
- 'Répéter seulement le début du morceau : la fin et les passages difficiles doivent aussi être travaillés.'
- Présenter la pièce sans expliquer les choix artistiques (« on l'a fait comme ça »).
- 'Juger la prestation sans l''écouter à nouveau : l''enregistrement aide à faire un bilan précis.'
exemple:
  enonce: Ta classe doit chanter le canon traditionnel « Frère Jacques » au concert de fin d'année. Définis les caractéristiques
    du projet.
  solution: 'Effectif : toute la classe, répartie en quatre groupes. Forme : le chant est d''abord chanté une fois par tous,
    à l''unisson, puis en canon à quatre voix (chaque groupe entre après le précédent). Tempo modéré, pour que les paroles
    restent claires. Nuances : entrée piano, puis de plus en plus fort à mesure que les groupes entrent, et fin où les groupes
    s''arrêtent l''un après l''autre. Ressources : la voix seule, une pulsation frappée pour garder le tempo. Choix présenté
    au public : le canon montre comment une même mélodie peut se superposer à elle-même.'
exercices:
- id: caracteristiques-projet
  type: choix
  difficulte: 1
  enonce: La classe prépare un chant pour le concert de fin d'année. Quelles décisions font partie des caractéristiques musicales
    du projet ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Choisir le tempo et les nuances de chaque partie
    - id: b
      texte: Décider qui chante en soliste et quand tout le groupe reprend
    - id: c
      texte: Choisir la couleur des affiches du concert
    - id: d
      texte: Fixer l'heure du goûter après le concert
    bonnes:
    - a
    - b
  indices:
    relance: Parmi ces décisions, lesquelles changent ce que le public va entendre ?
    methode: 'Une caractéristique musicale concerne le son : vitesse, force, qui chante, quand. Élimine ce qui ne s''entend
      pas.'
    etape: Les affiches et le goûter ne s'entendent pas. Regarde les deux décisions qui restent.
  pieges:
  - si:
      contient:
      - c
    relance: Les affiches sont utiles pour le public, mais est-ce qu'on les entend ? Cherche ce qui concerne le son.
  - si:
      contient:
      - d
    relance: Le goûter fait partie de l'organisation, pas de la musique. Qu'est-ce qui s'entend pendant le chant ?
  - si:
      diagnostic: incomplet
    relance: Il y a une autre décision qui change ce que le public entend. Laquelle ?
  solution: 'Le tempo, les nuances et la répartition entre soliste et groupe sont des caractéristiques musicales : elles changent
    ce qu''on entend. Les affiches et le goûter relèvent de l''organisation.'
- id: etapes-projet
  type: ordre
  difficulte: 2
  enonce: Range ces étapes d'un projet de concert dans l'ordre où on les réalise.
  reponse:
    elements:
    - id: definir
      texte: Choisir l'œuvre et définir l'effectif, le tempo et la forme
    - id: apprendre
      texte: Apprendre chaque partie séparément, pupitre par pupitre
    - id: assembler
      texte: Assembler les parties et travailler les nuances
    - id: filage
      texte: Faire une répétition générale dans les conditions du concert
    - id: concert
      texte: Interpréter la pièce devant le public
    - id: bilan
      texte: Écouter l'enregistrement et faire le bilan
  indices:
    relance: Par quoi faut-il commencer avant même de chanter une note ? Et que fait-on une fois le concert terminé ?
    methode: 'Place d''abord la première et la dernière étape, puis range les répétitions : du travail en petits groupes vers
      le travail tous ensemble.'
    etape: On commence par choisir l'œuvre et définir le projet. Que faut-il faire avant de pouvoir assembler les parties
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit forcément venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pense au chemin du projet : on prépare, on répète du plus petit au plus grand groupe, on joue, puis on fait
      le bilan.'
  solution: On définit le projet, on apprend chaque partie séparément, on assemble et on travaille les nuances, on fait une
    répétition générale, on interprète devant le public, puis on écoute l'enregistrement pour faire le bilan.
- id: mot-tutti
  type: texte_court
  difficulte: 1
  enonce: Quel mot italien, qui signifie « tous », désigne un passage où l'ensemble entier joue ou chante, par opposition
    au soliste ?
  reponse:
    acceptees:
    - tutti
    fautes_tolerees: 0
  indices:
    relance: Dans un concerto ou dans un chœur, comment appelle-t-on le moment où plus personne n'est seul ?
    methode: Cherche un mot italien de cinq lettres, que l'on trouve souvent sur les partitions à côté de « solo ».
    etape: Le mot commence par « tu- » et se termine par « -ti ».
  pieges:
  - si:
      valeur: unisson
    relance: L'unisson, c'est chanter la même mélodie à la même hauteur. Le mot demandé est un mot italien qui veut dire «
      tous ».
  - si:
      valeur: choeur
    relance: Le chœur est un groupe de chanteurs. Quel mot italien, écrit sur les partitions, indique que tout le monde joue
      ?
  solution: 'Le tutti : tout l''ensemble joue ou chante, après ou avant un passage de soliste.'
- id: problemes-repetition
  type: association
  difficulte: 2
  enonce: Pendant les répétitions, des problèmes apparaissent. Relie chaque problème à la solution la plus adaptée.
  reponse:
    gauche:
    - id: departs
      texte: Les voix ne commencent pas ensemble
    - id: soliste
      texte: Le public n'entend pas le soliste
    - id: tempo
      texte: Le groupe accélère sans s'en rendre compte
    - id: souffle
      texte: Les chanteurs manquent d'air à la fin des phrases
    droite:
    - id: geste
      texte: Une personne donne un départ clair par un geste et une respiration commune
    - id: doux
      texte: L'accompagnement joue plus doucement pendant le solo
    - id: pulsation
      texte: Répéter avec une pulsation frappée ou un métronome
    - id: respirations
      texte: Repérer ensemble les endroits où l'on respire
    paires:
      departs: geste
      soliste: doux
      tempo: pulsation
      souffle: respirations
  indices:
    relance: 'Pour chaque problème, demande-toi : s''agit-il de temps, de volume ou de souffle ?'
    methode: Commence par le problème le plus facile à relier, puis élimine les solutions déjà utilisées.
    etape: Un problème de vitesse se règle avec un repère régulier. Quelle solution donne ce repère ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux problèmes qui parlent de début et de fin de phrase.
  - si:
      diagnostic: associations_fausses
    relance: 'Classe d''abord les problèmes : un de départ, un de volume, un de vitesse, un de souffle. Puis cherche la solution
      de chaque famille.'
  solution: 'Départs décalés : un geste de départ et une respiration commune. Soliste couvert : l''accompagnement joue plus
    doucement. Accélération : une pulsation ou un métronome. Manque d''air : repérer les respirations.'
- id: bilan-utile
  type: choix
  difficulte: 2
  enonce: Après le concert, la classe écoute l'enregistrement. Quelle remarque aide vraiment à progresser pour le prochain
    projet ?
  reponse:
    options:
    - id: a
      texte: C'était trop bien, on ne change rien
    - id: b
      texte: 'Au deuxième refrain, les voix graves couvraient la mélodie : il faudra qu''elles chantent moins fort'
    - id: c
      texte: Le public a beaucoup applaudi, donc tout était parfait
    - id: d
      texte: On aurait dû choisir une autre chanson
    bonnes:
    - b
  indices:
    relance: Quelle remarque dit précisément où se trouve un problème et ce qu'on peut faire ?
    methode: Une remarque utile situe un moment du morceau, décrit ce qu'on entend avec un mot précis et propose une amélioration.
    etape: Cherche la remarque qui nomme un moment précis du morceau et un groupe de chanteurs.
  pieges:
  - si:
      contient:
      - c
    relance: Les applaudissements font plaisir, mais disent-ils ce qui peut être amélioré ?
  - si:
      contient:
      - a
    relance: Cette remarque ne dit rien de précis sur la musique. Laquelle situe un moment et propose une amélioration ?
  - si:
      contient:
      - d
    relance: Changer de chanson ne dit pas ce qui n'allait pas dans l'interprétation. Quelle remarque est précise ?
  solution: 'La remarque sur le deuxième refrain est utile : elle situe le moment, décrit le problème (équilibre entre les
    voix) et propose une solution (chanter moins fort).'
- id: presenter-projet-chanson
  type: ouverte
  difficulte: 3
  enonce: 'Ta classe prépare pour le concert de fin d''année une chanson traditionnelle, avec une introduction instrumentale,
    des couplets et un refrain. En quelques phrases, présente le projet : ses caractéristiques musicales, la répartition des
    rôles, et un choix artistique que tu justifies.'
  criteres:
  - L'élève précise au moins deux caractéristiques musicales (effectif, forme, tempo, nuances, style).
  - L'élève explique qui fait quoi (soliste, groupe, accompagnement, personne qui donne les départs).
  - L'élève justifie un choix artistique par l'effet recherché sur le public.
  indices:
    relance: Qui chante, à quelle vitesse, avec quelles nuances ?
    methode: Présente d'abord le plan du morceau, puis les rôles, puis un choix que tu expliques avec « pour que… ».
    etape: 'Tu peux commencer ainsi : « Notre chanson commence par une introduction jouée par… ».'
  solution: Notre chanson commence par une introduction jouée par deux élèves aux percussions. Un soliste chante le premier
    couplet, puis toute la classe reprend le refrain en tutti. Le tempo est modéré et les couplets sont chantés piano. Nous
    chantons le dernier refrain forte pour que la fin donne une impression de fête. Une élève donne les départs par un geste.
