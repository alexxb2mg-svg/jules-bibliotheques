format: 2
notion: realiser-projets-musicaux
version: 2
etat: verifiee
declencheurs:
- concert de fin d'année
- répétition générale
- chorale du collège
- monter un spectacle musical
- se produire sur scène
- répartir les voix
prerequis:
- 4e-realiser-projets-musicaux
- mobiliser-techniques-vocales
essentiel: 'Un projet musical, c''est préparer une musique pour la jouer devant d''autres : soit on interprète une œuvre qui
  existe déjà, soit on crée sa propre pièce.


  Avant de répéter, on définit les caractéristiques musicales du projet : l''effectif (combien de voix, quels instruments),
  le style, la forme (couplets, refrain, introduction, fin), le tempo, les nuances et la durée.


  On choisit ensuite les ressources adaptées : la voix, les percussions corporelles, les instruments de la classe, un logiciel
  ou un enregistreur, une partition ou un simple codage.


  Le travail se fait par étapes : apprendre chaque partie séparément, assembler, soigner les nuances et les départs, puis
  faire une répétition générale (un « filage ») dans les conditions du concert.


  Le jour venu, on interprète la pièce devant un public et on présente les choix artistiques faits : pourquoi ce tempo, pourquoi
  un soliste à tel moment, pourquoi cette fin. Écouter ensuite un enregistrement permet de faire le bilan.


  Interpréter et créer, ce n''est pas la même chose. Interpréter, c''est jouer ou chanter une œuvre qui existe déjà en faisant
  des choix : tempo, nuances, timbre, qui chante seul. Créer, c''est inventer une pièce nouvelle. Dans les deux cas, on définit
  le projet avant de répéter.


  Dans un groupe, chacun a un rôle : soliste, membre d''un pupitre, accompagnateur, ou personne qui donne les départs. Chacun
  tient sa partie, écoute les autres et respecte le tempo commun. Avant de chanter, on prépare son corps : posture droite,
  respiration, concentration.


  Ce qu''on attend en évaluation : décrire le projet avec le vocabulaire musical (effectif, forme, tempo, nuances), l''interpréter
  avec sérieux devant d''autres élèves, puis expliquer au moins un choix artistique par l''effet qu''on veut produire sur
  le public.

  '
methode:
- 'Définir le projet : œuvre ou création, effectif, style, forme, tempo, nuances, durée.'
- 'Répartir les rôles : solistes, pupitres, accompagnement, personne qui donne les départs.'
- Apprendre chaque partie séparément, puis assembler les parties.
- 'Régler les détails expressifs : nuances, départs et fins ensemble, équilibre entre les voix.'
- Faire une répétition générale dans les conditions du concert.
- Interpréter devant le public, présenter ses choix, puis écouter l'enregistrement pour faire le bilan.
vocabulaire:
- terme: tutti
  definition: 'mot italien qui veut dire « tous » : passage où tout l''ensemble joue ou chante'
- terme: soliste
  definition: musicien ou chanteur qui joue seul une partie, mis en valeur face au groupe
- terme: pupitre
  definition: groupe de chanteurs ou d'instrumentistes qui ont la même partie (par exemple les voix graves)
- terme: filage
  definition: répétition où l'on joue tout le programme d'un bout à l'autre, sans s'arrêter, comme le jour du concert
- terme: nuance
  definition: 'indication de l''intensité du son : piano (doux), forte (fort), crescendo (de plus en plus fort)…'
- terme: interprétation
  definition: manière de jouer ou de chanter une œuvre en faisant des choix (tempo, nuances, timbre)
- terme: effectif
  definition: nombre et nature des voix et des instruments qui participent à un projet
- terme: forme
  definition: 'plan d''une pièce : la façon dont ses parties (introduction, couplets, refrain, fin) s''organisent'
- terme: tempo
  definition: vitesse de la pulsation d'un morceau
erreurs_frequentes:
- Commencer à répéter tout ensemble sans avoir défini le tempo, la forme et le rôle de chacun.
- 'Oublier le public : un projet musical se termine par une interprétation devant d''autres, pas seulement en classe.'
- 'Répéter seulement le début du morceau : la fin et les passages difficiles doivent aussi être travaillés.'
- Présenter la pièce sans expliquer les choix artistiques (« on l'a fait comme ça »).
- 'Juger la prestation sans l''écouter à nouveau : l''enregistrement aide à faire un bilan précis.'
exemple:
  enonce: Ta classe doit chanter le canon traditionnel « Frère Jacques » au concert de fin d'année. Définis les caractéristiques
    du projet.
  solution: 'Effectif : toute la classe, répartie en quatre groupes. Forme : le chant est d''abord chanté une fois par tous,
    à l''unisson, puis en canon à quatre voix (chaque groupe entre après le précédent). Tempo modéré, pour que les paroles
    restent claires. Nuances : entrée piano, puis de plus en plus fort à mesure que les groupes entrent, et fin où les groupes
    s''arrêtent l''un après l''autre. Ressources : la voix seule, une pulsation frappée pour garder le tempo. Choix présenté
    au public : le canon montre comment une même mélodie peut se superposer à elle-même.'
exercices:
- id: caracteristiques-projet
  type: choix
  difficulte: 1
  enonce: La classe prépare un chant pour le concert de fin d'année. Quelles décisions font partie des caractéristiques musicales
    du projet ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Choisir le tempo et les nuances de chaque partie
    - id: b
      texte: Décider qui chante en soliste et quand tout le groupe reprend
    - id: c
      texte: Choisir la couleur des affiches du concert
    - id: d
      texte: Fixer l'heure du goûter après le concert
    bonnes:
    - a
    - b
  indices:
    relance: Parmi ces décisions, lesquelles changent ce que le public va entendre ?
    methode: 'Une caractéristique musicale concerne le son : vitesse, force, qui chante, quand. Élimine ce qui ne s''entend
      pas.'
    etape: Les affiches et le goûter ne s'entendent pas. Regarde les deux décisions qui restent.
  pieges:
  - si:
      contient:
      - c
    relance: Les affiches sont utiles pour le public, mais est-ce qu'on les entend ? Cherche ce qui concerne le son.
  - si:
      contient:
      - d
    relance: Le goûter fait partie de l'organisation, pas de la musique. Qu'est-ce qui s'entend pendant le chant ?
  - si:
      diagnostic: incomplet
    relance: Il y a une autre décision qui change ce que le public entend. Laquelle ?
  solution: 'Le tempo, les nuances et la répartition entre soliste et groupe sont des caractéristiques musicales : elles changent
    ce qu''on entend. Les affiches et le goûter relèvent de l''organisation.'
- id: etapes-projet
  type: ordre
  difficulte: 2
  enonce: Range ces étapes d'un projet de concert dans l'ordre où on les réalise.
  reponse:
    elements:
    - id: definir
      texte: Choisir l'œuvre et définir l'effectif, le tempo et la forme
    - id: apprendre
      texte: Apprendre chaque partie séparément, pupitre par pupitre
    - id: assembler
      texte: Assembler les parties et travailler les nuances
    - id: filage
      texte: Faire une répétition générale dans les conditions du concert
    - id: concert
      texte: Interpréter la pièce devant le public
    - id: bilan
      texte: Écouter l'enregistrement et faire le bilan
  indices:
    relance: Par quoi faut-il commencer avant même de chanter une note ? Et que fait-on une fois le concert terminé ?
    methode: 'Place d''abord la première et la dernière étape, puis range les répétitions : du travail en petits groupes vers
      le travail tous ensemble.'
    etape: On commence par choisir l'œuvre et définir le projet. Que faut-il faire avant de pouvoir assembler les parties
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit forcément venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pense au chemin du projet : on prépare, on répète du plus petit au plus grand groupe, on joue, puis on fait
      le bilan.'
  solution: On définit le projet, on apprend chaque partie séparément, on assemble et on travaille les nuances, on fait une
    répétition générale, on interprète devant le public, puis on écoute l'enregistrement pour faire le bilan.
- id: mot-tutti
  type: texte_court
  difficulte: 1
  enonce: Quel mot italien, qui signifie « tous », désigne un passage où l'ensemble entier joue ou chante, par opposition
    au soliste ?
  reponse:
    acceptees:
    - tutti
    fautes_tolerees: 0
  indices:
    relance: Dans un concerto ou dans un chœur, comment appelle-t-on le moment où plus personne n'est seul ?
    methode: Cherche un mot italien de cinq lettres, que l'on trouve souvent sur les partitions à côté de « solo ».
    etape: Le mot commence par « tu- » et se termine par « -ti ».
  pieges:
  - si:
      valeur: unisson
    relance: L'unisson, c'est chanter la même mélodie à la même hauteur. Le mot demandé est un mot italien qui veut dire «
      tous ».
  - si:
      valeur: choeur
    relance: Le chœur est un groupe de chanteurs. Quel mot italien, écrit sur les partitions, indique que tout le monde joue
      ?
  solution: 'Le tutti : tout l''ensemble joue ou chante, après ou avant un passage de soliste.'
- id: problemes-repetition
  type: association
  difficulte: 2
  enonce: Pendant les répétitions, des problèmes apparaissent. Relie chaque problème à la solution la plus adaptée.
  reponse:
    gauche:
    - id: departs
      texte: Les voix ne commencent pas ensemble
    - id: soliste
      texte: Le public n'entend pas le soliste
    - id: tempo
      texte: Le groupe accélère sans s'en rendre compte
    - id: souffle
      texte: Les chanteurs manquent d'air à la fin des phrases
    droite:
    - id: geste
      texte: Une personne donne un départ clair par un geste et une respiration commune
    - id: doux
      texte: L'accompagnement joue plus doucement pendant le solo
    - id: pulsation
      texte: Répéter avec une pulsation frappée ou un métronome
    - id: respirations
      texte: Repérer ensemble les endroits où l'on respire
    paires:
      departs: geste
      soliste: doux
      tempo: pulsation
      souffle: respirations
  indices:
    relance: 'Pour chaque problème, demande-toi : s''agit-il de temps, de volume ou de souffle ?'
    methode: Commence par le problème le plus facile à relier, puis élimine les solutions déjà utilisées.
    etape: Un problème de vitesse se règle avec un repère régulier. Quelle solution donne ce repère ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux problèmes qui parlent de début et de fin de phrase.
  - si:
      diagnostic: associations_fausses
    relance: 'Classe d''abord les problèmes : un de départ, un de volume, un de vitesse, un de souffle. Puis cherche la solution
      de chaque famille.'
  solution: 'Départs décalés : un geste de départ et une respiration commune. Soliste couvert : l''accompagnement joue plus
    doucement. Accélération : une pulsation ou un métronome. Manque d''air : repérer les respirations.'
- id: bilan-utile
  type: choix
  difficulte: 2
  enonce: Après le concert, la classe écoute l'enregistrement. Quelle remarque aide vraiment à progresser pour le prochain
    projet ?
  reponse:
    options:
    - id: a
      texte: C'était trop bien, on ne change rien
    - id: b
      texte: 'Au deuxième refrain, les voix graves couvraient la mélodie : il faudra qu''elles chantent moins fort'
    - id: c
      texte: Le public a beaucoup applaudi, donc tout était parfait
    - id: d
      texte: On aurait dû choisir une autre chanson
    bonnes:
    - b
  indices:
    relance: Quelle remarque dit précisément où se trouve un problème et ce qu'on peut faire ?
    methode: Une remarque utile situe un moment du morceau, décrit ce qu'on entend avec un mot précis et propose une amélioration.
    etape: Cherche la remarque qui nomme un moment précis du morceau et un groupe de chanteurs.
  pieges:
  - si:
      contient:
      - c
    relance: Les applaudissements font plaisir, mais disent-ils ce qui peut être amélioré ?
  - si:
      contient:
      - a
    relance: Cette remarque ne dit rien de précis sur la musique. Laquelle situe un moment et propose une amélioration ?
  - si:
      contient:
      - d
    relance: Changer de chanson ne dit pas ce qui n'allait pas dans l'interprétation. Quelle remarque est précise ?
  solution: 'La remarque sur le deuxième refrain est utile : elle situe le moment, décrit le problème (équilibre entre les
    voix) et propose une solution (chanter moins fort).'
- id: presenter-projet-chanson
  type: ouverte
  difficulte: 3
  enonce: 'Ta classe prépare pour le concert de fin d''année une chanson traditionnelle, avec une introduction instrumentale,
    des couplets et un refrain. En quelques phrases, présente le projet : ses caractéristiques musicales, la répartition des
    rôles, et un choix artistique que tu justifies.'
  criteres:
  - L'élève précise au moins deux caractéristiques musicales (effectif, forme, tempo, nuances, style).
  - L'élève explique qui fait quoi (soliste, groupe, accompagnement, personne qui donne les départs).
  - L'élève justifie un choix artistique par l'effet recherché sur le public.
  indices:
    relance: Qui chante, à quelle vitesse, avec quelles nuances ?
    methode: Présente d'abord le plan du morceau, puis les rôles, puis un choix que tu expliques avec « pour que… ».
    etape: 'Tu peux commencer ainsi : « Notre chanson commence par une introduction jouée par… ».'
  solution: Notre chanson commence par une introduction jouée par deux élèves aux percussions. Un soliste chante le premier
    couplet, puis toute la classe reprend le refrain en tutti. Le tempo est modéré et les couplets sont chantés piano. Nous
    chantons le dernier refrain forte pour que la fin donne une impression de fête. Une élève donne les départs par un geste.
- id: nblm-comment-appelle-t-on-la-repetition-gener-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on la répétition générale où l'on joue tout le projet musical d'un bout à l'autre sans s'arrêter
    avant de se produire sur scène ?
  reponse:
    options:
    - id: o1
      texte: Un filage
    - id: o2
      texte: Un tutti
    - id: o3
      texte: Un rondo
    - id: o4
      texte: Un pupitre
    bonnes:
    - o1
  indices:
    relance: Ce terme imagé rappelle l'idée de dérouler le fil du spectacle du début à la fin sans interruption.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention à ne pas confondre : le tutti désigne un passage où l''ensemble des musiciens joue ou chante en même
      temps, et non la répétition générale.'
  - si:
      contient:
      - o3
    relance: 'Erreur de notion : le rondo est une forme musicale (ABACA) fondée sur l''alternance d''un refrain, pas une étape
      de répétition.'
  - si:
      contient:
      - o4
    relance: 'Confusion fréquente : un pupitre est le groupe de chanteurs ou d''instrumentistes qui partagent la même partie,
      pas la répétition générale.'
  solution: 'Un filage. C''est exact : le filage est la répétition générale effectuée dans les conditions réelles du concert,
    sans interrompre le morceau.'
- id: nblm-dans-la-chorale-du-college-quand-on-deci-2
  type: choix
  difficulte: 2
  enonce: Dans la chorale du collège, quand on décide de répartir les voix en groupes chantant la même partie (par exemple
    les voix graves ensemble), comment nomme-t-on ce groupe ?
  reponse:
    options:
    - id: o1
      texte: Un pupitre
    - id: o2
      texte: Un soliste
    - id: o3
      texte: Un effet d'espace
    - id: o4
      texte: Un canon
    bonnes:
    - o1
  indices:
    relance: Ce mot désigne aussi le support sur lequel les musiciens posent leurs partitions.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : un soliste chante ou joue seul sa partie mise en valeur face au groupe, il ne s''agit pas
      d''un groupe entier.'
  - si:
      contient:
      - o3
    relance: 'Hors sujet : l''effet d''espace concerne la disposition acoustique ou sonore dans le lieu, pas la répartition
      des voix.'
  - si:
      contient:
      - o4
    relance: 'Confusion de terme : le canon est un procédé d''écriture avec entrées décalées, pas le nom du groupe de chanteurs.'
  solution: 'Un pupitre. C''est exact : un pupitre désigne l''ensemble des chanteurs ou instrumentistes qui interprètent la
    même ligne musicale.'
- id: nblm-apres-avoir-chante-lors-du-concert-de-fi-3
  type: choix
  difficulte: 2
  enonce: Après avoir chanté lors du concert de fin d'année, quelle action essentielle permet à la classe de faire un bilan
    précis du projet musical ?
  reponse:
    options:
    - id: o1
      texte: Écouter un enregistrement de la prestation
    - id: o2
      texte: Commencer immédiatement un nouveau morceau sans rien analyser
    - id: o3
      texte: Modifier toutes les nuances du chant juste après la prestation
    - id: o4
      texte: Répéter uniquement le premier couplet du morceau
    bonnes:
    - o1
  indices:
    relance: Il s'agit de réécouter attentivement ce qui a été capté audio ou vidéo pendant le spectacle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : sauter l''étape du bilan empêche de repérer ce qui a fonctionné et ce qui peut être amélioré.'
  - si:
      contient:
      - o3
    relance: 'Inexact : les nuances se travaillent pendant la phase de répétition, pas après le concert.'
  - si:
      contient:
      - o4
    relance: 'Mauvaise pratique : retravailler un passage isolé après la représentation ne permet pas d''évaluer la prestation
      globale.'
  solution: 'Écouter un enregistrement de la prestation. C''est exact : réécouter un enregistrement permet d''analyser la
    prestation avec du recul pour effectuer un bilan objectif.'
- id: nblm-pour-monter-un-spectacle-musical-avec-sa-4
  type: choix
  difficulte: 2
  enonce: Pour monter un spectacle musical avec sa classe, que faut-il obligatoirement définir avant de lancer les répétitions
    ?
  reponse:
    options:
    - id: o1
      texte: Les caractéristiques musicales (effectif, forme, tempo, nuances)
    - id: o2
      texte: Uniquement le titre de la pièce sans préciser la forme ni le tempo
    - id: o3
      texte: La couleur des tenues du public
    - id: o4
      texte: L'apprentissage direct du refrain à volume maximal
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments d'organisation sonore essentiels tels que la vitesse, le volume et le nombre d'interprètes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Piège classique : démarrer les répétitions sans repères musicaux clairs entraîne de la confusion dans l''ensemble.'
  - si:
      contient:
      - o3
    relance: 'Hors sujet : les caractéristiques musicales de la pièce priment sur les éléments extérieurs.'
  - si:
      contient:
      - o4
    relance: 'Mauvaise méthode : le travail doit être méthodique et chaque partie apprise séparément.'
  solution: 'Les caractéristiques musicales (effectif, forme, tempo, nuances). C''est juste : fixer au préalable l''effectif,
    la forme, le tempo et les nuances permet de structurer le travail de groupe.'
- id: nblm-au-moment-de-se-produire-sur-scene-devan-5
  type: choix
  difficulte: 2
  enonce: Au moment de se produire sur scène devant un public, que doivent présenter les élèves en plus d'interpréter leur
    pièce ?
  reponse:
    options:
    - id: o1
      texte: Leurs choix artistiques (explications du tempo, du rôle des solistes, etc.)
    - id: o2
      texte: La liste exhaustive de leurs erreurs en répétition
    - id: o3
      texte: Une analyse grammaticale du texte chanté
    - id: o4
      texte: Leurs goûts personnels sans aucune justification musicale
    bonnes:
    - o1
  indices:
    relance: Il faut expliciter les raisons musicales et d'interprétation qui ont structuré le travail de la classe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect : la présentation orale doit exposer la démarche artistique, non lister les hésitations passées.'
  - si:
      contient:
      - o3
    relance: 'Hors sujet : l''explication concerne les choix musicaux et la démarche d''interprétation.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : affirmer ''on l''a fait comme ça parce qu''on aime bien'' ne constitue pas une justification
      artistique.'
  solution: 'Leurs choix artistiques (explications du tempo, du rôle des solistes, etc.). C''est exact : expliquer ses choix
    artistiques permet de transmettre au public les intentions musicales qui ont guidé le projet.'
- id: nblm-quelles-sont-deux-erreurs-frequentes-a-e-6
  type: choix
  difficulte: 3
  enonce: Quelles sont DEUX erreurs fréquentes à éviter absolument quand une classe prépare un projet musical ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Répéter seulement le début du morceau en négligeant la fin et les passages difficiles
    - id: o2
      texte: Commencer à répéter tous ensemble sans avoir défini la forme et le rôle de chacun
    - id: o3
      texte: Effectuer une répétition générale (filage) avant le concert
    - id: o4
      texte: Écouter un enregistrement de la prestation pour réaliser le bilan
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux mauvaises habitudes qui désorganisent le démarrage des répétitions ou empêchent de maîtriser l'œuvre
      en totalité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur d''appréciation : au contraire, réaliser un filage dans les conditions du concert est une étape indispensable
      recommandée.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : c''est la méthode préconisée pour analyser la prestation avec du recul et faire un bilan constructif.'
  solution: 'Répéter seulement le début du morceau en négligeant la fin et les passages difficiles ; Commencer à répéter tous
    ensemble sans avoir défini la forme et le rôle de chacun. C''est juste : concentrer les répétitions sur le début est un
    piège fréquent ; la fin et les passages complexes doivent aussi être travaillés.'
- id: nblm-dans-un-chant-de-la-chorale-du-college-q-7
  type: texte_court
  difficulte: 1
  enonce: Dans un chant de la chorale du collège, quel mot d'origine italienne désigne un passage où l'ensemble complet des
    choristes et musiciens joue ou chante en même temps ?
  reponse:
    acceptees:
    - tutti
    fautes_tolerees: 1
  indices:
    relance: Ce mot italien commence par un 't' et signifie littéralement 'tous'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: tutti. Le mot 'tutti' signifie 'tous' en italien et désigne le moment où la totalité de l'effectif interprète
    la musique ensemble.
- id: nblm-lors-d-un-concert-de-fin-d-annee-comment-8
  type: texte_court
  difficulte: 1
  enonce: Lors d'un concert de fin d'année, comment appelle-t-on le chanteur ou le musicien qui interprète seul une partie
    mise en valeur face au reste du groupe ?
  reponse:
    acceptees:
    - soliste
    fautes_tolerees: 1
  indices:
    relance: Ce terme vient de la racine exprimant le fait d'être seul.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: soliste. Un soliste est le musicien ou chanteur qui interprète individuellement sa partie, mis en avant par rapport
    au groupe.
- id: interpreter-ou-creer
  type: choix
  difficulte: 1
  enonce: Ta classe chante « Frère Jacques » en choisissant elle-même le tempo et les nuances. Que fait-elle ?
  reponse:
    options:
    - id: a
      texte: 'Une création : elle invente la mélodie'
    - id: b
      texte: 'Une interprétation : l''œuvre existe déjà et elle fait des choix pour la chanter'
    - id: c
      texte: Ni l'une ni l'autre
    bonnes:
    - b
  indices:
    relance: La mélodie de cette chanson existe-t-elle avant que la classe s'en occupe ?
    methode: Interpréter, c'est faire des choix sur une œuvre existante. Créer, c'est inventer du nouveau.
    etape: La classe n'invente ni la mélodie ni les paroles. Que décide-t-elle seulement ?
  pieges:
  - si:
      contient:
      - a
    relance: 'Les élèves n''inventent pas la mélodie : elle est connue depuis longtemps. Que font-ils alors ?'
  - si:
      contient:
      - c
    relance: Choisir le tempo et les nuances d'une œuvre, c'est bien un travail musical. Duquel des deux types de projet s'agit-il
      ?
  solution: 'L''œuvre existe déjà : la classe fait des choix d''interprétation (tempo, nuances), elle ne crée pas de mélodie.'
- id: eleves-par-pupitre
  type: nombre
  difficulte: 1
  enonce: Une classe de 28 élèves se répartit en 4 pupitres qui ont tous le même nombre d'élèves. Combien d'élèves y a-t-il
    dans chaque pupitre ?
  reponse:
    valeur: 7
    forme: entier
  indices:
    relance: Il faut partager 28 élèves en 4 groupes égaux. Quelle opération utilises-tu ?
    methode: Divise le nombre total d'élèves par le nombre de pupitres.
    etape: Cherche le nombre qui, multiplié par 4, donne 28.
  pieges:
  - si:
      valeur: 112
    relance: Tu as multiplié. Partager en groupes égaux, c'est diviser.
  - si:
      valeur: 24
    relance: Tu as soustrait 4 au lieu de partager en 4 groupes égaux. Quelle opération partage en parts égales ?
  solution: '28 ÷ 4 = 7 : chaque pupitre compte 7 élèves (vérification : 7 × 4 = 28).'
