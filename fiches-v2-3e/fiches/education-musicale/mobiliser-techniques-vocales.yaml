- id: posture-consignes
  type: choix
  difficulte: 1
  enonce: Quelles consignes font partie d'une bonne posture de chant ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Les pieds bien posés au sol, écartés de la largeur du bassin
    - id: b
      texte: Les genoux bloqués, bien raides
    - id: c
      texte: Les épaules et la nuque relâchées
    - id: d
      texte: Le menton levé et la tête rejetée en arrière
    bonnes:
    - a
    - c
  indices:
    relance: Une posture de chant doit-elle être crispée ou détendue ?
    methode: 'Relis ta leçon : la posture doit rendre le corps stable ET détendu.'
    etape: Élimine d'abord les deux consignes qui parlent de raideur ou de tension.
  pieges:
  - si:
      contient:
      - b
    relance: Des genoux raides bloquent tout le corps et gênent la respiration. Comment doivent être les genoux ?
  - si:
      contient:
      - d
    relance: Rejeter la tête en arrière serre la gorge. Où doit se diriger le regard ?
  solution: Les pieds sont ancrés au sol, écartés de la largeur du bassin, les épaules et la nuque sont relâchées. Les genoux
    restent souples et la tête reste droite.
- id: mot-pupitre
  type: texte_court
  difficulte: 2
  enonce: Dans un chœur, comment s'appelle chaque groupe de chanteurs qui chantent la même partie (les sopranos, les altos,
    les ténors, les basses) ?
  reponse:
    acceptees:
    - pupitre
    - un pupitre
    - le pupitre
    fautes_tolerees: 1
  indices:
    relance: Dans un chœur à quatre voix, tous les sopranos se placent ensemble, tous les altos ensemble, etc. Comment nomme-t-on
      chacun de ces groupes ?
    methode: 'C''est un mot du vocabulaire de la leçon : il désigne un groupe de chanteurs qui ont la même partie.'
    etape: Le mot commence par « pup- ».
  pieges:
  - si:
      valeur: tessiture
    relance: La tessiture est l'étendue des notes qu'une voix chante confortablement. On cherche un groupe de personnes.
  - si:
      valeur: chœur
    relance: Le chœur est l'ensemble de tous les chanteurs. Comment appelle-t-on chaque sous-groupe qui chante la même partie
      ?
  solution: 'Un pupitre est un groupe de chanteurs qui chantent la même partie : pupitre des sopranos, des altos, des ténors,
    des basses.'
