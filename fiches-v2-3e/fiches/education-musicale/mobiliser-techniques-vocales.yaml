format: 2
notion: mobiliser-techniques-vocales
version: 3
etat: verifiee
declencheurs:
- échauffement vocal
- chanter juste
- chanter faux
- manquer de souffle
- percussions corporelles
- vocalises
- trac avant de chanter
- chanter dans un chœur
- respirer pour chanter
- frappes de mains
prerequis:
- 4e-realiser-projets-musicaux
- physiologie-audition
essentiel: 'Pour chanter ou jouer avec son corps au service d''un projet, on s''appuie sur quelques techniques simples.


  La posture : pieds bien posés au sol, écartés de la largeur du bassin, genoux souples, dos droit, épaules et nuque relâchées,
  regard vers l''avant. Un corps stable et détendu laisse la voix sortir librement.


  La respiration : on inspire calmement en laissant le ventre et les côtes s''ouvrir, sans lever les épaules, puis on souffle
  lentement et régulièrement pendant la phrase chantée. On repère à l''avance les endroits où l''on respire.


  L''échauffement prépare le corps et la voix : détente, posture, exercices de souffle, vocalises douces dans le médium de
  la voix avant d''aller vers l''aigu et le grave, puis articulation.


  Pendant le chant, on travaille la justesse (chanter les bonnes hauteurs), l''articulation (prononcer clairement les consonnes),
  les nuances et l''écoute des autres : dans une polyphonie ou un canon, il faut tenir sa partie tout en entendant l''ensemble.
  Chaque voix a sa tessiture, l''étendue des notes qu''elle chante confortablement.


  Le corps peut aussi être un instrument : frappes de mains, claquements de doigts, frappes sur les cuisses ou la poitrine,
  pieds. Dans Clapping Music (1972), Steve Reich fait jouer deux musiciens uniquement avec leurs mains : ils frappent le même
  motif rythmique, puis l''un des deux le décale régulièrement d''une croche.


  Au service d''un projet : on choisit la technique selon l''intention. Un chant doux demande un souffle long et une voix
  légère. Un chant rythmé demande des consonnes nettes et une pulsation partagée. On commence et on termine ensemble, en suivant
  le geste du chef de chœur.


  Dans un chœur, les chanteurs sont regroupés en pupitres : les sopranos et les altos (voix aiguës et graves des femmes et
  des enfants), les ténors et les basses (voix d''hommes). Chaque pupitre chante sa partie. Un soliste chante seul, souvent
  accompagné.


  Prendre soin de sa voix : boire de l''eau, ne pas crier, ne pas forcer sur les notes trop aiguës ou trop graves, s''arrêter
  si la gorge fait mal.


  Ce qu''on attend : dire ce que tu fais (posture, souffle, échauffement) et pourquoi cela sert le projet d''interprétation
  ou de création.

  '
methode:
- Se détendre et s'installer dans une posture stable avant de chanter.
- Respirer par le ventre et les côtes, sans lever les épaules, et repérer les respirations sur la partition.
- 'S''échauffer du plus facile au plus difficile : souffle, vocalises douces, puis articulation.'
- Pendant le chant, s'écouter et écouter les autres pour rester juste et ensemble.
- 'Adapter la voix et le geste au projet : nuance, caractère, rôle de soliste ou de chœur.'
- 'Prendre soin de sa voix : boire, ne pas forcer, s''arrêter si la gorge fait mal.'
vocabulaire:
- terme: posture
  definition: 'façon de placer son corps pour chanter : pieds ancrés, genoux souples, dos droit, épaules relâchées'
- terme: justesse
  definition: qualité d'une voix qui chante exactement les bonnes hauteurs de notes
- terme: tessiture
  definition: étendue des notes qu'une voix peut chanter confortablement
- terme: vocalise
  definition: exercice chanté sur des voyelles ou des syllabes, pour échauffer et assouplir la voix
- terme: articulation
  definition: façon de prononcer clairement les syllabes et les consonnes quand on chante
- terme: pupitre
  definition: groupe de chanteurs qui chantent la même partie dans un chœur (sopranos, altos, ténors, basses)
- terme: nuance
  definition: 'degré d''intensité de la voix ou du jeu : doux (piano) ou fort (forte)'
erreurs_frequentes:
- 'Lever les épaules en inspirant : l''air reste en haut et le souffle est court.'
- Commencer directement par les notes les plus aiguës, sans échauffement.
- Chanter plus fort pour ne pas se faire entraîner par l'autre voix, au lieu d'écouter l'ensemble.
- 'Mâcher les consonnes : le public n''entend plus le texte.'
- 'Se crisper à cause du trac : la voix se serre et la justesse en souffre.'
exemple:
  enonce: Dans un chant, une phrase est longue et tu n'as plus d'air à la fin. Que peux-tu faire ?
  solution: Je vérifie ma posture (dos droit, épaules relâchées), j'inspire en laissant le ventre et les côtes s'ouvrir, sans
    lever les épaules, et je repère sur la partition l'endroit où je reprends mon souffle. Pendant la phrase, je laisse sortir
    l'air lentement et régulièrement au lieu de tout dépenser au début.
exercices:
- id: mot-justesse
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la qualité d'une voix qui chante exactement les bonnes hauteurs de notes, ni trop haut ni trop
    bas ?
  reponse:
    acceptees:
    - justesse
    fautes_tolerees: 1
  indices:
    relance: Quand quelqu'un chante « faux », quelle qualité lui manque-t-il ?
    methode: Cherche le nom formé à partir de l'adjectif contraire de « faux ».
    etape: L'adjectif est « juste ». Quel est le nom qui en vient ?
  pieges:
  - si:
      valeur: puissance
    relance: La puissance, c'est la force de la voix. On cherche la qualité qui concerne la hauteur des notes.
  - si:
      valeur: tessiture
    relance: La tessiture est l'étendue des notes qu'une voix chante confortablement. On cherche le fait de chanter les bonnes
      hauteurs.
  solution: 'La justesse : chanter exactement les bonnes hauteurs. Une voix qui n''est pas juste chante « faux ».'
- id: clapping-music
  type: choix
  difficulte: 1
  enonce: Dans Clapping Music (1972), le compositeur Steve Reich fait jouer deux musiciens. Avec quel « instrument » jouent-ils
    ?
  reponse:
    options:
    - id: a
      texte: Leurs mains qui frappent
    - id: b
      texte: Un piano à quatre mains
    - id: c
      texte: Leurs voix, en chantant
    - id: d
      texte: Deux tambours
    bonnes:
    - a
  indices:
    relance: 'Traduis le titre : que veut dire « clapping » en anglais ?'
    methode: 'C''est une pièce de percussions corporelles : le corps lui-même sert d''instrument.'
    etape: « To clap » veut dire applaudir. Quelle partie du corps utilise-t-on pour cela ?
  pieges:
  - si:
      contient:
      - b
    relance: Le titre ne parle pas de clavier. Que veut dire « clapping » ?
  - si:
      contient:
      - c
    relance: Aucune note n'est chantée dans cette pièce. Quel geste le titre décrit-il ?
  - si:
      contient:
      - d
    relance: 'Aucun instrument n''est nécessaire pour cette pièce. Le corps suffit : comment ?'
  solution: 'Ils jouent avec leurs mains, en frappant : c''est une pièce de percussions corporelles. Les deux musiciens frappent
    le même motif, puis l''un le décale régulièrement d''une croche.'
- id: echauffement
  type: ordre
  difficulte: 2
  enonce: Range ces étapes d'un échauffement avant une répétition de chœur, dans l'ordre. On détend d'abord le corps, avant
    de prendre la posture de chant.
  reponse:
    elements:
    - id: detente
      texte: 'Détendre le corps : étirer les bras, rouler les épaules, relâcher la nuque'
    - id: posture
      texte: 'Se placer : pieds ancrés au sol, genoux souples, dos droit'
    - id: souffle
      texte: 'Travailler le souffle : inspirer par le ventre, souffler longtemps sur « sss »'
    - id: vocalises
      texte: Faire des vocalises douces dans le médium, puis vers l'aigu et le grave
    - id: chant
      texte: Chanter le morceau du projet
  indices:
    relance: Faut-il commencer par la voix ou par le corps ?
    methode: 'Va du corps vers la voix, et du plus facile au plus exigeant : chaque étape prépare la suivante.'
    etape: On commence par détendre le corps, puis on se place. Que faut-il préparer avant de faire sonner la voix ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle prépare l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pense à un sportif : il s''échauffe d''abord le corps, puis fait des exercices de plus en plus proches de l''effort
      final.'
  solution: Détendre le corps, se placer dans une bonne posture, travailler le souffle, faire des vocalises douces, puis chanter
    le morceau.
- id: technique-effet
  type: association
  difficulte: 2
  enonce: Relie chaque technique à ce qu'elle apporte au chanteur ou au groupe.
  reponse:
    gauche:
    - id: ventre
      texte: Inspirer par le ventre, sans lever les épaules
    - id: consonnes
      texte: Bien articuler les consonnes
    - id: ancrage
      texte: Garder les pieds ancrés au sol et le dos droit
    - id: ecoute
      texte: Écouter les autres pupitres en chantant
    droite:
    - id: phrase
      texte: Avoir assez d'air pour tenir une longue phrase
    - id: texte
      texte: Rendre les paroles compréhensibles pour le public
    - id: stabilite
      texte: Être stable, pour une voix plus libre
    - id: ensemble
      texte: Rester ensemble et juste dans un chant à plusieurs voix
    paires:
      ventre: phrase
      consonnes: texte
      ancrage: stabilite
      ecoute: ensemble
  indices:
    relance: Laquelle de ces techniques concerne le souffle ? Laquelle concerne les paroles ?
    methode: 'Classe les techniques : souffle, prononciation, corps, écoute. Puis cherche l''effet qui correspond à chaque
      famille.'
    etape: Articuler, c'est prononcer clairement. À qui cela sert-il surtout ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux techniques qui parlent du corps et du souffle.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends famille par famille : souffle, prononciation, posture, écoute.'
  solution: Inspirer par le ventre donne l'air pour tenir une longue phrase. Articuler rend les paroles compréhensibles. Les
    pieds ancrés et le dos droit donnent la stabilité. Écouter les autres permet de rester ensemble et juste.
- id: canon-tenir-sa-voix
  type: choix
  difficulte: 2
  enonce: Ta classe chante « Frère Jacques » en canon à quatre voix. Ton groupe se laisse entraîner par le groupe voisin et
    perd sa mélodie. Quelle est la meilleure solution ?
  reponse:
    options:
    - id: a
      texte: Chanter beaucoup plus fort que les autres pour ne plus les entendre
    - id: b
      texte: Bien connaître sa mélodie seul, puis s'écouter soi-même tout en entendant l'ensemble
    - id: c
      texte: Se boucher les oreilles pendant tout le canon
    - id: d
      texte: Chanter plus vite pour finir avant les autres
    bonnes:
    - b
  indices:
    relance: Dans un canon, doit-on ignorer les autres voix, ou les entendre sans les suivre ?
    methode: 'Un chant à plusieurs voix demande deux choses : maîtriser sa propre partie, et écouter comment elle s''accorde
      avec les autres.'
    etape: Forcer la voix ou changer de tempo casse l'ensemble. Quelle solution garde l'écoute et la justesse ?
  pieges:
  - si:
      contient:
      - a
    relance: Chanter trop fort fatigue la voix, fait perdre la justesse et casse l'équilibre du canon. Que faut-il plutôt
      travailler ?
  - si:
      contient:
      - c
    relance: Sans entendre les autres, on ne peut plus chanter ensemble ni rester juste. Quelle solution garde l'écoute ?
  - si:
      contient:
      - d
    relance: Dans un canon, toutes les voix gardent le même tempo. Que faut-il faire pour tenir sa mélodie ?
  solution: Il faut d'abord bien connaître sa mélodie seul, puis chanter en s'écoutant tout en entendant l'ensemble. C'est
    cette double écoute qui permet de tenir sa voix dans un canon.
- id: preparer-solo
  type: ouverte
  difficulte: 3
  enonce: Tu dois chanter en soliste le premier couplet d'un chant au concert de fin d'année. Tu as le trac et, en répétition,
    tu manques de souffle à la fin des phrases. Explique comment tu prépares ton corps et ta voix, et pourquoi.
  criteres:
  - L'élève décrit une posture adaptée (pieds ancrés, dos droit, épaules relâchées).
  - L'élève explique comment il gère sa respiration (inspiration basse, souffle régulier, respirations repérées).
  - L'élève décrit un échauffement ou une technique pour gérer le trac, en justifiant son utilité.
  indices:
    relance: Qu'est-ce qui, dans ton corps, peut t'aider à avoir plus de souffle et moins de trac ?
    methode: 'Parle de trois choses : la posture, la respiration, l''échauffement. Pour chacune, dis à quoi elle sert.'
    etape: 'Tu peux commencer ainsi : « Avant de chanter, je m''installe les pieds bien ancrés au sol… ».'
  solution: 'Avant de chanter, je m''installe les pieds bien ancrés au sol, les genoux souples, le dos droit et les épaules
    relâchées : un corps stable m''aide à rester calme. Je respire lentement par le ventre pour faire baisser le trac. Je
    repère sur la partition les endroits où je reprends de l''air, et j''inspire sans lever les épaules pour avoir assez de
    souffle jusqu''au bout des phrases. Je m''échauffe avec des exercices de souffle et des vocalises douces, pour que ma
    voix soit prête et juste.'
- id: nblm-comment-doit-se-derouler-un-echauffement-1
  type: choix
  difficulte: 2
  enonce: Comment doit se dérouler un échauffement vocal efficace avant de chanter ?
  reponse:
    options:
    - id: o1
      texte: En commençant par des vocalises douces dans le médium de la voix avant d'explorer l'aigu et le grave.
    - id: o2
      texte: En débutant directement par les notes les plus aiguës pour étirer les cordes vocales.
    - id: o3
      texte: En chantant le morceau le plus fort possible dès le début pour chauffer le larynx.
    - id: o4
      texte: En pratiquant uniquement des exercices de rythme rapides sans émettre de son vocal.
    bonnes:
    - o1
  indices:
    relance: Pense à la progression naturelle des hauteurs de notes et à la douceur nécessaire pour préserver son instrument.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : attaquer directement par les notes aiguës sans échauffement risque de fatiguer
      ou d''abîmer la voix.'
  - si:
      contient:
      - o3
    relance: Faux, chanter à pleine puissance d'entrée de jeu crée une crispation vocale et ne prépare pas la voix en douceur.
  - si:
      contient:
      - o4
    relance: Faux, bien que le corps doive être préparé, l'échauffement vocal nécessite des vocalises et du souffle pour assouplir
      la voix.
  solution: En commençant par des vocalises douces dans le médium de la voix avant d'explorer l'aigu et le grave. C'est exact.
    L'échauffement vocal doit débuter doucement dans le médium avant d'étendre la tessiture vers l'aigu et le grave.
- id: nblm-si-tu-viens-a-manquer-de-souffle-sur-une-2
  type: choix
  difficulte: 2
  enonce: Si tu viens à manquer de souffle sur une phrase chantée particulièrement longue, quelle réaction est recommandée
    ?
  reponse:
    options:
    - id: o1
      texte: Gérer son débit d'air de façon lente et régulière tout en vérifiant sa posture sans lever les épaules.
    - id: o2
      texte: Lever fortement les épaules à l'inspiration pour emmagasiner un maximum d'air.
    - id: o3
      texte: Vider tout son air au tout début de la phrase pour chanter le premier mot plus fort.
    - id: o4
      texte: Accélérer fortement le tempo du chant pour finir la phrase avant d'étouffer.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la technique d'inspiration abdominale et à la répartition de l'air pendant la phrase.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : lever les épaules bloque l''air en haut des poumons et rend le souffle encore
      plus court.'
  - si:
      contient:
      - o3
    relance: Faux, dépenser tout son souffle dès le début de la phrase empêche de tenir les notes jusqu'au bout.
  - si:
      contient:
      - o4
    relance: Faux, modifier le tempo dénature la musique et ne résout pas le problème de gestion du souffle.
  solution: Gérer son débit d'air de façon lente et régulière tout en vérifiant sa posture sans lever les épaules. C'est exact.
    Une bonne gestion du souffle nécessite de contrôler la sortie de l'air de manière égale et d'ouvrir le ventre et les côtes
    sans hausser les épaules.
- id: nblm-pourquoi-un-eleve-risque-t-il-de-chanter-3
  type: choix
  difficulte: 2
  enonce: Pourquoi un élève risque-t-il de chanter faux ou de voir sa voix se serrer lors d'un passage devant la classe ?
  reponse:
    options:
    - id: o1
      texte: Parce qu'il se crispe sous l'effet du trac, ce qui serre la voix et altère la justesse des notes.
    - id: o2
      texte: Parce qu'il inspire par le ventre et les côtes au lieu de lever les épaules.
    - id: o3
      texte: Parce qu'il prend le temps d'articuler et de prononcer clairement chaque consonne.
    - id: o4
      texte: Parce qu'il écoute attentivement les autres voix du groupe pour chanter ensemble.
    bonnes:
    - o1
  indices:
    relance: Pense à l'impact des émotions et des tensions corporelles sur l'émission de la voix.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, la respiration abdominale et costale est justement la bonne technique pour soutenir sa voix.
  - si:
      contient:
      - o3
    relance: Faux, une articulation claire est une qualité indispensable pour être compris par le public.
  - si:
      contient:
      - o4
    relance: Faux, l'écoute des autres permet au contraire de corriger sa justesse et de s'accorder avec l'ensemble.
  solution: Parce qu'il se crispe sous l'effet du trac, ce qui serre la voix et altère la justesse des notes. C'est la bonne
    réponse. La crispation physique due au stress empêche la voix de sortir librement et nuit à la justesse.
- id: nblm-comment-le-corps-peut-il-devenir-un-inst-4
  type: choix
  difficulte: 2
  enonce: Comment le corps peut-il devenir un instrument de musique selon les techniques vocales et corporelles ?
  reponse:
    options:
    - id: o1
      texte: En réalisant des percussions corporelles comme des frappes de mains, des claquements de doigts ou des frappes
        sur le torse et les cuisses.
    - id: o2
      texte: En frottant un archet sur ses bras pour imiter le son d'un violon.
    - id: o3
      texte: En chantant le plus fort possible sans effectuer aucun geste ni mouvement du corps.
    - id: o4
      texte: En imitant uniquement des bruits d'animaux avec la bouche.
    bonnes:
    - o1
  indices:
    relance: Considère les gestes rythmiques réalisés directement avec les mains, les pieds ou le buste.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, les percussions corporelles n'utilisent aucun accessoire extérieur ou archet, mais la frappe directe sur
      le corps.
  - si:
      contient:
      - o3
    relance: Faux, le chant seul mobilise l'appareil vocal, tandis que l'utilisation du corps comme instrument implique des
      percussions corporelles.
  - si:
      contient:
      - o4
    relance: Faux, cela concerne les bruits vocaux ou l'imitation, pas l'utilisation du corps comme percussion rythmique.
  solution: En réalisant des percussions corporelles comme des frappes de mains, des claquements de doigts ou des frappes
    sur le torse et les cuisses. C'est exact. Les percussions corporelles utilisent différentes parties du corps pour produire
    une variété de sonorités et de rythmes.
- id: nblm-quelle-est-la-definition-exacte-d-une-vo-5
  type: choix
  difficulte: 2
  enonce: Quelle est la définition exacte d'une vocalise dans la pratique du chant ?
  reponse:
    options:
    - id: o1
      texte: Un exercice chanté sur des voyelles ou des syllabes destiné à échauffer et assouplir la voix.
    - id: o2
      texte: Un texte poétique récité à haute voix sans aucune mélodie.
    - id: o3
      texte: Un morceau instrumental joué uniquement à la batterie ou aux percussions.
    - id: o4
      texte: Une frappe rapide des pieds sur le sol pour garder la pulsation.
    bonnes:
    - o1
  indices:
    relance: Pense au support phonétique (voyelles/syllabes) utilisé pour assouplir les cordes vocales.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, la récitation sans mélodie ne constitue pas une vocalise, qui est un exercice chanté.
  - si:
      contient:
      - o3
    relance: Faux, la vocalise est une technique exclusivement vocale.
  - si:
      contient:
      - o4
    relance: Faux, cela correspond à un geste rythmique ou de percussion corporelle, non à un travail vocal.
  solution: 'Un exercice chanté sur des voyelles ou des syllabes destiné à échauffer et assouplir la voix. C''est la définition
    exacte de la vocalise : un motif mélodique répété sur des syllabes ou voyelles pour préparer la voix.'
- id: nblm-parmi-les-propositions-suivantes-concern-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes concernant la posture et la respiration vocales, quelles sont les DEUX bonnes pratiques
    à adopter ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Garder le dos droit, les pieds ancrés au sol de la largeur du bassin et les épaules relâchées.
    - id: o2
      texte: Inspirer calmement en laissant le ventre et les côtes s'ouvrir, sans hausser les épaules.
    - id: o3
      texte: Lever énergiquement les épaules à chaque inspiration pour remplir le haut des poumons.
    - id: o4
      texte: Chanter en gardant les genoux complètement verrouillés et le regard fixé vers le sol.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les consignes favorisant la souplesse corporelle, l'ancrage et la respiration abdominale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Faux, lever les épaules est une erreur courante qui bloque le souffle et crée de la tension.
  - si:
      contient:
      - o4
    relance: Faux, les genoux doivent rester souples et le regard porté vers l'avant pour libérer la résonance et la posture.
  solution: Garder le dos droit, les pieds ancrés au sol de la largeur du bassin et les épaules relâchées ; Inspirer calmement
    en laissant le ventre et les côtes s'ouvrir, sans hausser les épaules. C'est exact. Cette posture offre au corps la stabilité
    et la détente nécessaires pour laisser sortir la voix librement.
