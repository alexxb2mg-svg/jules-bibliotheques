format: 2
notion: successif-et-simultane
version: 3
etat: verifiee
declencheurs:
- plusieurs voix en même temps
- chanter en canon
- mélodie et accompagnement
- note tenue en continu
- voix qui s'imitent
- chanter à l'unisson
- qu'est-ce qu'un accord
- deux mélodies en même temps
- motif répété à la basse
- voix qui entrent après
prerequis:
- 4e-successif-et-simultane
essentiel: 'Une musique s''écoute dans deux directions.

  - Le successif (l''horizontal) : les sons qui se suivent. Une mélodie est une suite de notes ; elle se découpe en phrases
  et en motifs.

  - Le simultané (le vertical) : les sons entendus en même temps. Un accord, c''est au moins trois notes jouées ensemble ;
  l''accompagnement soutient la mélodie.


  Les principales façons d''organiser les voix :

  - Monodie : une seule mélodie, sans accompagnement, même si plusieurs personnes la chantent ensemble à l''unisson (exemple
  : le chant grégorien du Moyen Âge).

  - Mélodie accompagnée : une mélodie principale, soutenue par des accords ou d''autres instruments.

  - Bourdon : une note (ou deux) tenue ou répétée sans changer sous la mélodie, comme à la cornemuse ou à la vielle à roue.

  - Homorythmie : toutes les voix chantent le même rythme en même temps, sur des notes différentes. Les paroles se comprennent
  bien.

  - Polyphonie : plusieurs mélodies différentes et indépendantes sont entendues en même temps.

  - Canon : toutes les voix chantent la même mélodie, mais elles entrent l''une après l''autre (« Frère Jacques », chanson
  traditionnelle). C''est une imitation stricte. Le Canon en ré de Johann Pachelbel (période baroque) superpose trois violons
  en canon au-dessus d''une basse qui répète toujours la même formule.

  - Ostinato : un motif répété sans arrêt pendant que le reste change.

  - Question-réponse, solo-tutti : des groupes alternent (successif), puis parfois se superposent (simultané).


  Autres procédés. L''ostinato est un motif répété sans arrêt pendant que le reste change ; il peut servir d''accompagnement.
  Le canon est à la fois du successif (les voix entrent l''une après l''autre) et du simultané (elles s''entendent ensuite
  ensemble).


  Pour calculer la durée d''un canon : la dernière voix entre après (nombre de voix − 1) décalages. On ajoute ensuite la durée
  de la mélodie chantée par cette dernière voix.


  Ce qu''on attend : dire s''il y a une ou plusieurs lignes musicales (monodie ou unisson, mélodie accompagnée, polyphonie),
  puis repérer les entrées qui se suivent et les sons qui se superposent, avec le mot juste.

  '
methode:
- 'Compter les plans sonores : une seule ligne, ou plusieurs en même temps ?'
- 'S''il y en a plusieurs, se demander : ont-elles le même rythme (homorythmie), la même mélodie en décalé (canon) ou des
  mélodies différentes (polyphonie) ?'
- 'Repérer ce qui ne bouge pas : une note tenue (bourdon), un motif répété (ostinato).'
- 'Décrire aussi ce qui se passe dans le temps : entrées successives, alternances, superpositions.'
vocabulaire:
- terme: monodie
  definition: une seule ligne mélodique, sans accompagnement
- terme: unisson
  definition: plusieurs voix ou instruments qui jouent exactement la même mélodie, à la même hauteur
- terme: homorythmie
  definition: toutes les voix ont le même rythme au même moment
- terme: polyphonie
  definition: superposition de plusieurs mélodies indépendantes
- terme: bourdon
  definition: son tenu ou répété sous la mélodie
- terme: canon
  definition: procédé où plusieurs voix chantent la même mélodie en entrant l'une après l'autre
- terme: ostinato
  definition: motif rythmique ou mélodique répété sans arrêt pendant que le reste change
erreurs_frequentes:
- 'Croire qu''un chœur qui chante à l''unisson fait de la polyphonie : il n''y a qu''une seule mélodie, c''est une monodie.'
- Confondre canon (même mélodie décalée) et polyphonie en général (mélodies différentes).
- Confondre homorythmie (même rythme, notes différentes) et unisson (mêmes notes).
- 'Oublier le bourdon parce qu''il ne change pas : il est pourtant entendu en même temps que la mélodie.'
- 'Croire que le bourdon est une mélodie : c''est un son tenu ou répété qui sert de fond.'
exemple:
  enonce: 'Trois groupes chantent « Frère Jacques » : le deuxième groupe commence quand le premier arrive à la deuxième phrase,
    puis le troisième groupe fait de même. Comment s''appelle ce procédé ?'
  solution: 'Un canon : la même mélodie est chantée par plusieurs voix qui entrent l''une après l''autre. On entend donc à
    la fois du successif (les entrées décalées) et du simultané (les voix superposées).'
exercices:
- id: termes-organisation
  type: association
  difficulte: 1
  enonce: Relie chaque description au mot qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: une seule mélodie, chantée par tous sans accompagnement
    - id: b
      texte: la même mélodie chantée par plusieurs voix qui entrent l'une après l'autre
    - id: c
      texte: une note tenue sans changer sous la mélodie
    - id: d
      texte: toutes les voix chantent le même rythme au même moment, sur des notes différentes
    - id: e
      texte: plusieurs mélodies différentes et indépendantes en même temps
    droite:
    - id: v
      texte: monodie
    - id: w
      texte: canon
    - id: x
      texte: bourdon
    - id: y
      texte: homorythmie
    - id: z
      texte: polyphonie
    paires:
      a: v
      b: w
      c: x
      d: y
      e: z
  indices:
    relance: Dans chaque description, combien de mélodies entend-on à la fois ?
    methode: 'Décompose les mots : « mono » veut dire un seul, « poly » plusieurs, « homo » le même.'
    etape: « Frère Jacques » chanté à plusieurs groupes décalés est l'exemple le plus connu de la deuxième description.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les descriptions qui parlent de rythme et de mélodies différentes.
  - si:
      diagnostic: associations_fausses
    relance: Aide-toi du sens des préfixes mono (un), poly (plusieurs) et homo (le même), puis place les deux autres mots.
  solution: 'Une seule mélodie : monodie. Même mélodie décalée : canon. Note tenue : bourdon. Même rythme en même temps :
    homorythmie. Mélodies indépendantes : polyphonie.'
- id: meme-melodie-meme-hauteur
  type: texte_court
  difficulte: 1
  enonce: Quand tous les membres d'une chorale chantent exactement la même mélodie, à la même hauteur et en même temps, on
    dit qu'ils chantent à l'… ?
  reponse:
    acceptees:
    - unisson
    fautes_tolerees: 0
  indices:
    relance: Ils chantent tous comme s'ils n'étaient qu'une seule voix. Quel mot le dit ?
    methode: Le mot vient du latin et veut dire « un seul son ».
    etape: Le mot commence par « uni- », comme « unique ».
  pieges:
  - si:
      valeur: canon
    relance: Dans un canon, les voix entrent l'une après l'autre. Ici, elles chantent en même temps.
  - si:
      valeur: homorythmie
    relance: En homorythmie, les voix ont le même rythme mais des notes différentes. Ici, les notes sont aussi les mêmes.
  solution: 'À l''unisson : tout le monde chante la même mélodie, à la même hauteur, en même temps.'
- id: sons-superposes
  type: choix
  difficulte: 2
  enonce: Dans lesquelles de ces situations entend-on plusieurs lignes musicales différentes en même temps ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: un canon à trois voix
    - id: b
      texte: une mélodie de cornemuse au-dessus de son bourdon
    - id: c
      texte: un chant grégorien chanté à l'unisson
    - id: d
      texte: une flûte seule qui joue une mélodie
    - id: e
      texte: un chœur à quatre voix en homorythmie
    bonnes:
    - a
    - b
    - e
  indices:
    relance: Pour chaque situation, combien de lignes différentes entend-on au même moment ?
    methode: Chanter à plusieurs la même mélodie à la même hauteur ne fait qu'une seule ligne. Cherche les situations où les
      notes entendues ensemble sont différentes.
    etape: La flûte seule ne fait entendre qu'une ligne. Regarde les quatre autres une par une.
  pieges:
  - si:
      contient:
      - c
    relance: À l'unisson, tout le monde chante les mêmes notes. Combien de lignes différentes cela fait-il ?
  - si:
      contient:
      - d
    relance: Une flûte seule ne joue qu'une note à la fois. Y a-t-il une autre ligne en même temps ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une partie des bonnes réponses. Pense aussi à la note tenue, et aux voix qui ont le même rythme
      mais pas les mêmes notes.
  solution: Le canon (même mélodie décalée), la cornemuse avec son bourdon (mélodie + note tenue) et le chœur en homorythmie
    (même rythme, notes différentes). Le chant à l'unisson et la flûte seule ne font entendre qu'une ligne.
- id: duree-canon
  type: nombre
  difficulte: 3
  enonce: Un canon est chanté par 4 voix. La mélodie dure 8 mesures et chaque voix la chante une seule fois. Chaque voix entre
    2 mesures après la précédente. Combien de mesures dure le morceau, du début de la première voix à la fin de la dernière
    ?
  reponse:
    valeur: 14
    forme: entier
  indices:
    relance: À quel moment la dernière voix commence-t-elle à chanter ?
    methode: Calcule après combien de mesures entre la quatrième voix, puis ajoute la durée de sa mélodie.
    etape: La 2e voix entre après 2 mesures, la 3e après 4 mesures, la 4e après 6 mesures. Il reste à ajouter ce que chante
      la dernière voix.
  pieges:
  - si:
      valeur: 32
    relance: Tu as mis les voix bout à bout. Dans un canon, elles chantent en même temps, avec un décalage.
  - si:
      valeur: 8
    relance: C'est la durée de la mélodie d'une seule voix. La dernière voix commence plus tard. Quand finit-elle ?
  - si:
      valeur: 16
    relance: Tu as compté un décalage de trop. Combien y a-t-il de décalages entre la première et la quatrième voix ?
  solution: 'La 4e voix entre après 3 décalages de 2 mesures, soit 6 mesures. Elle chante ensuite 8 mesures : 6 + 8 = 14 mesures.'
- id: decrire-plans-sonores
  type: ouverte
  difficulte: 3
  enonce: 'Voici la description d''un extrait : « Une cornemuse fait entendre une note grave qui ne s''arrête jamais, pendant
    qu''une mélodie aiguë se déroule au-dessus. Puis un chœur entre : d''abord tout le monde chante la même mélodie ensemble
    ; ensuite un deuxième groupe reprend la même mélodie, mais en commençant plus tard. » Décris l''organisation des sons
    en trois ou quatre phrases, avec le vocabulaire du successif et du simultané.'
  criteres:
  - L'élève nomme le bourdon et la mélodie de la cornemuse, entendus en même temps (simultané).
  - L'élève nomme l'unisson (ou la monodie) du chœur, puis le canon (entrées décalées).
  - L'élève distingue ce qui se suit (successif) et ce qui se superpose (simultané).
  indices:
    relance: Combien de lignes entend-on dans chaque partie de l'extrait ?
    methode: Décris l'extrait dans l'ordre. Pour chaque moment, nomme ce qui se superpose et ce qui se suit.
    etape: Tu peux commencer ainsi « Au début, la cornemuse fait entendre un bourdon… ».
  solution: 'Au début, la cornemuse fait entendre un bourdon grave, et en même temps une mélodie aiguë : deux plans simultanés.
    Le chœur chante d''abord à l''unisson, une seule mélodie (monodie). Puis un deuxième groupe reprend la même mélodie avec
    un décalage : c''est un canon, où les entrées successives finissent par se superposer.'
- id: nblm-lorsqu-un-chur-interprete-exactement-la-1
  type: choix
  difficulte: 2
  enonce: Lorsqu'un chœur interprète exactement la même mélodie, à la même hauteur et sans accompagnement, comment qualifie-t-on
    ce chant à l'unisson ? [1-3]
  reponse:
    options:
    - id: o1
      texte: Une monodie
    - id: o2
      texte: Une polyphonie
    - id: o3
      texte: Une mélodie accompagnée
    - id: o4
      texte: Une homorythmie
    bonnes:
    - o1
  indices:
    relance: Pense au fait qu'il n'y a qu'une seule et unique ligne de notes chantée par tout le monde.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la polyphonie exige la superposition de plusieurs mélodies différentes et indépendantes,
      ce qui n''est pas le cas ici.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : il n''y a aucun accompagnement instrumental ou d''accords sous la ligne mélodique.'
  - si:
      contient:
      - o4
    relance: 'Attention : l''homorythmie superpose des notes différentes sur un même rythme, alors qu''à l''unisson toutes
      les voix chantent exactement les mêmes notes.'
  solution: 'Une monodie. C''est exact : il n''y a qu''une seule ligne mélodique partagée par toutes les voix à la même hauteur,
    ce qui définit la monodie chantée à l''unisson.'
- id: nblm-comment-appelle-t-on-la-technique-ou-une-2
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on la technique où une ou deux notes sont tenues en continu ou répétées sans changer sous une
    mélodie ? [1-3]
  reponse:
    options:
    - id: o1
      texte: Le bourdon
    - id: o2
      texte: Le canon
    - id: o3
      texte: L'ostinato
    - id: o4
      texte: L'unisson
    bonnes:
    - o1
  indices:
    relance: Pense à l'effet sonore continu que produit la cornemuse ou la vielle à roue sous le thème.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : le canon est l''entrée décalée de plusieurs voix chantant la même mélodie.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : l''unisson signifie que tous chantent exactement la même mélodie à la même hauteur.'
  solution: 'Le bourdon. C''est la bonne réponse : le bourdon est une note (ou deux) tenue ou répétée sans changer sous la
    mélodie, comme à la cornemuse.'
- id: nblm-quelle-organisation-decrit-une-chanson-o-3
  type: choix
  difficulte: 2
  enonce: Quelle organisation décrit une chanson où une voix principale interprète le thème pendant que des instruments jouent
    des accords pour la soutenir ?
  reponse:
    options:
    - id: o1
      texte: La mélodie accompagnée
    - id: o2
      texte: La monodie
    - id: o3
      texte: Le canon
    - id: o4
      texte: L'homorythmie
    bonnes:
    - o1
  indices:
    relance: Observe le rôle principal donné à la ligne de chant par rapport aux accords qui la soutiennent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : la monodie ne comporte aucun accompagnement d''accords ou d''instruments.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le canon superpose la même mélodie décalée dans le temps, sans séparation entre mélodie soliste et
      accompagnement d''accords.'
  - si:
      contient:
      - o4
    relance: 'Attention : l''homorythmie signifie que toutes les voix chantent les mêmes rythmes en même temps, sans rôle
      d''accompagnement d''accords séparé.'
  solution: 'La mélodie accompagnée. C''est exact : la mélodie accompagnée associe une ligne mélodique principale mise en
    valeur et soutenue par un accompagnement.'
- id: nblm-lorsqu-on-choisit-de-chanter-en-canon-fr-4
  type: choix
  difficulte: 2
  enonce: Lorsqu'on choisit de chanter en canon (« Frère Jacques »), pourquoi parle-t-on de voix qui s'imitent de manière
    stricte ?
  reponse:
    options:
    - id: o1
      texte: Chaque voix entre l'une après l'autre en reproduisant exactement la même mélodie
    - id: o2
      texte: Toutes les voix chantent des mélodies différentes en même temps
    - id: o3
      texte: Les voix chantent la même mélodie en démarrant toutes sur le même temps
    - id: o4
      texte: Les voix se répondent sans jamais chanter plusieurs voix en même temps
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi comment les entrées des voix sont organisées dans le temps avant de se superposer.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : chanter des mélodies différentes indépendantes correspond à une polyphonie libre, pas à un canon
      strict.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : démarrer en même temps sur la même mélodie s''appelle l''unisson, il n''y a pas d''entrées
      successives décalées.'
  - si:
      contient:
      - o4
    relance: 'Attention : dans un canon, après des entrées successives décalées, les voix finissent par se superposer simultanément.'
  solution: 'Chaque voix entre l''une après l''autre en reproduisant exactement la même mélodie. C''est juste : le canon fait
    entrer plusieurs voix de manière décalée, chacune imitant à l''identique la mélodie de la première voix.'
- id: nblm-dans-l-analyse-musicale-a-quelle-dimensi-5
  type: choix
  difficulte: 2
  enonce: Dans l'analyse musicale, à quelle dimension correspond le fait d'écouter plusieurs voix en même temps (organisation
    verticale) ?
  reponse:
    options:
    - id: o1
      texte: Le simultané
    - id: o2
      texte: Le successif
    - id: o3
      texte: Le tempo
    - id: o4
      texte: La forme
    bonnes:
    - o1
  indices:
    relance: Pense à la notion d'événement musical se déroulant au même instant par opposition à la suite des notes dans le
      temps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : le successif représente la dimension horizontale, c''est-à-dire l''enchaînement des sons dans
      le temps.'
  - si:
      contient:
      - o3
    relance: 'Attention : le tempo désigne la vitesse de la pulsation, pas la superposition des sons.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : la forme désigne la structure globale du morceau au fil du temps.'
  solution: 'Le simultané. C''est exact : le simultané concerne l''organisation verticale des sons émis au même instant (accords,
    polyphonie).'
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations exactes concernant la superposition de voix (polyphonie et canon) ? [1-3] (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La polyphonie est la superposition de plusieurs mélodies différentes et indépendantes entendues en même temps.
    - id: o2
      texte: Le canon combine le successif (entrées décalées) et le simultané (voix qui chantent en même temps).
    - id: o3
      texte: Un chœur qui chante à l'unisson réalise une polyphonie.
    - id: o4
      texte: Dans un canon, les voix ne chantent jamais en même temps.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les deux propositions qui décrivent correctement la polyphonie et le fonctionnement du canon.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur classique : l''unisson ne comporte qu''une seule ligne mélodique, il s''agit donc d''une monodie.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : si les entrées sont décalées, les voix se superposent rapidement pour chanter ensemble.'
  solution: 'La polyphonie est la superposition de plusieurs mélodies différentes et indépendantes entendues en même temps
    ; Le canon combine le successif (entrées décalées) et le simultané (voix qui chantent en même temps). C''est exact : la
    polyphonie se caractérise par la présence simultanée de lignes mélodiques distinctes.'
- id: nblm-quel-terme-designe-une-organisation-musi-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne une organisation musicale constituée d'une seule ligne mélodique sans aucun accompagnement, même
    si l'on vient à chanter à l'unisson ?
  reponse:
    acceptees:
    - monodie
    fautes_tolerees: 1
  indices:
    relance: Ce mot d'origine grecque signifie 'un seul chant'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: monodie. La monodie désigne une seule ligne mélodique, interprétée par une personne ou un groupe à l'unisson,
    sans aucun accompagnement.
- id: nblm-quel-terme-designe-la-superposition-de-p-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne la superposition de plusieurs voix qui chantent des notes différentes mais avec exactement le
    même rythme au même moment ? [1-3]
  reponse:
    acceptees:
    - homorythmie
    fautes_tolerees: 1
  indices:
    relance: Ce mot associe un préfixe signifiant 'semblable' et la notion de rythme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: homorythmie. L'homorythmie se caractérise par plusieurs voix chantant des hauteurs différentes simultanément sur
    des durées identiques.
- id: accord-notes
  type: nombre
  difficulte: 1
  enonce: Un accord réunit au moins combien de notes jouées en même temps ?
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: 'Relis la définition du simultané dans ta leçon : elle donne un nombre minimum de notes.'
    methode: Une note seule n'est pas un accord. Une paire de notes forme un intervalle. Cherche à partir de quand on parle
      d'accord.
    etape: 'Imagine un accord au piano : compte les doigts qui appuient sur les touches.'
  pieges:
  - si:
      valeur: 1
    relance: Une note seule est un son isolé. Un accord superpose plusieurs sons.
  - si:
      valeur: 2
    relance: Deux notes ensemble forment un intervalle, pas encore un accord.
  solution: Un accord réunit au moins 3 notes jouées en même temps.
- id: ostinato-choix
  type: choix
  difficulte: 2
  enonce: À la basse, un motif de quatre notes est répété sans arrêt pendant que la mélodie change. Comment nomme-t-on ce
    procédé ?
  reponse:
    options:
    - id: a
      texte: Un ostinato
    - id: b
      texte: Un bourdon
    - id: c
      texte: Un canon
    - id: d
      texte: Un unisson
    bonnes:
    - a
  indices:
    relance: 'Le motif est répété sans arrêt : quel mot de la leçon désigne cela ?'
    methode: 'Compare avec le bourdon : est-ce une seule note tenue ou un motif de plusieurs notes ?'
    etape: Un canon fait entrer des voix décalées sur la même mélodie. Ici, une seule ligne se répète.
  pieges:
  - si:
      contient:
      - b
    relance: 'Un bourdon est une note tenue ou répétée. Ici c''est un motif de plusieurs notes : quel autre mot désigne un
      motif répété ?'
  - si:
      contient:
      - c
    relance: 'Dans un canon, plusieurs voix chantent la même mélodie en décalé. Ici, un motif de la basse se répète : est-ce
      la même chose ?'
  - si:
      contient:
      - d
    relance: L'unisson, c'est plusieurs voix qui jouent exactement la même mélodie en même temps. Ici, la basse répète son
      motif pendant que la mélodie change.
  solution: Un motif répété sans arrêt pendant que le reste change est un ostinato. Le bourdon, lui, est une note tenue ou
    répétée.
