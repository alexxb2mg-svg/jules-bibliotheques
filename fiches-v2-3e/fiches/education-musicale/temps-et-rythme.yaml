# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: temps-et-rythme
version: 3
etat: verifiee
declencheurs:
- battre la pulsation
- noire blanche croche
- battements par minute
- mesure à trois temps
- taper dans les mains en rythme
- métronome
prerequis:
- 4e-temps-et-rythme
essentiel: 'La pulsation est le battement régulier de la musique, celui qu''on tape du pied sans y penser.


  Le tempo est la vitesse de cette pulsation. On le mesure en battements par minute (BPM) avec un métronome : 60 BPM, c''est
  un battement par seconde. On l''indique aussi par des mots italiens, du plus lent au plus rapide : adagio (lent), andante
  (allant, modéré), allegro (rapide), presto (très rapide). Accelerando : le tempo accélère ; ritardando (ou rallentando)
  : il ralentit.


  La mesure regroupe les pulsations par 2, 3 ou 4 temps ; le premier temps de chaque mesure est souvent plus appuyé. Une marche
  est souvent à 2 temps, une valse à 3 temps.

  - Mesure binaire : chaque temps se partage en 2 (2/4, 3/4, 4/4).

  - Mesure ternaire : chaque temps se partage en 3 (6/8, 9/8, 12/8).

  Attention : une valse est à 3 temps, mais elle est binaire, car chaque temps se partage en 2.


  Le rythme est la suite des durées des sons et des silences. Quand la noire vaut un temps : ronde = 4 temps, blanche = 2
  temps, noire = 1 temps, croche = un demi-temps, double croche = un quart de temps. Donc une ronde vaut 2 blanches, une blanche
  vaut 2 noires, une noire vaut 2 croches. Les silences correspondants sont la pause, la demi-pause, le soupir, le demi-soupir
  et le quart de soupir.


  Un ostinato rythmique est une courte formule rythmique répétée sans arrêt.


  Pour calculer la durée d''un temps, on divise 60 secondes par le nombre de BPM. À 120 BPM, chaque temps dure 60 ÷ 120 =
  0,5 seconde. Plus les BPM sont nombreux, plus la musique est rapide.


  Un silence dure aussi longtemps que la note du même nom : un soupir vaut une noire, une pause vaut une ronde.


  Ce qu''on attend en évaluation : trouver la pulsation, donner le tempo, dire la mesure (2, 3 ou 4 temps ; binaire ou ternaire)
  et faire un calcul de durée.

  '
methode:
- 'Trouver la pulsation : taper régulièrement du pied avec la musique.'
- 'Estimer le tempo : compter les battements pendant 15 secondes et multiplier par 4 pour obtenir les BPM, ou donner le mot
  italien.'
- 'Chercher le temps fort qui revient : compter 1-2, 1-2-3 ou 1-2-3-4 pour trouver la mesure.'
- Se demander si chaque temps se partage en 2 (binaire) ou en 3 (ternaire).
- Pour les durées, tout convertir en temps (ou en noires) avant de calculer.
vocabulaire:
- terme: pulsation
  definition: battement régulier qui sert de repère dans la musique
- terme: tempo
  definition: vitesse de la pulsation, en BPM ou avec un mot italien
- terme: mesure
  definition: groupe régulier de temps (2, 3 ou 4), séparé par des barres sur la partition
- terme: ostinato
  definition: courte formule répétée obstinément
- terme: binaire
  definition: se dit d'une mesure où chaque temps se partage en 2
- terme: ternaire
  definition: se dit d'une mesure où chaque temps se partage en 3
- terme: métronome
  definition: appareil qui bat un tempo régulier, réglé en battements par minute
- terme: silence
  definition: moment sans son, dont la durée est notée sur la partition
erreurs_frequentes:
- Confondre pulsation (régulière) et rythme (les durées, qui peuvent varier).
- 'Croire qu''une mesure à 3 temps est forcément ternaire : binaire et ternaire parlent du partage de chaque temps.'
- Confondre tempo (vitesse) et nuance (volume).
- 'Penser qu''une croche dure plus longtemps qu''une noire parce qu''elle a un crochet : c''est l''inverse.'
exemple:
  enonce: Dans une mesure à 4 temps (la noire vaut un temps), combien de blanches faut-il pour remplir une mesure ?
  solution: 'Une blanche vaut 2 temps. 4 ÷ 2 = 2 : il faut 2 blanches.'
exercices:
- id: noires-dans-ronde
  type: nombre
  difficulte: 1
  enonce: Combien de noires faut-il pour faire la même durée qu'une ronde ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Combien de blanches y a-t-il dans une ronde ?
    methode: Une ronde vaut deux blanches, et chaque blanche vaut deux noires.
    etape: Deux blanches, c'est deux fois deux noires. Calcule.
  pieges:
  - si:
      valeur: 2
    relance: Tu as compté les blanches. Combien de noires y a-t-il dans chaque blanche ?
  - si:
      valeur: 8
    relance: Tu as peut-être compté des croches. On demande des noires.
  solution: Une ronde = 2 blanches = 4 noires.
- id: croches-dans-mesure
  type: nombre
  difficulte: 2
  enonce: Dans une mesure à 4 temps, la noire vaut un temps. Combien de croches faut-il pour remplir une mesure entière ?
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Combien de croches y a-t-il dans une noire ?
    methode: Compte d'abord les croches d'un temps, puis multiplie par le nombre de temps.
    etape: Un temps (une noire) contient deux croches. Il y a quatre temps dans la mesure.
  pieges:
  - si:
      valeur: 4
    relance: Quatre, c'est le nombre de noires. Une croche dure moins longtemps qu'une noire. Combien en faut-il ?
  - si:
      valeur: 2
    relance: Tu as compté les croches d'un seul temps. Combien y a-t-il de temps dans la mesure ?
  - si:
      valeur: 16
    relance: Tu as compté des doubles croches (un quart de temps). Une croche vaut un demi-temps.
  solution: Une noire = 2 croches, donc 4 temps × 2 = 8 croches.
- id: pulsations-en-trente-secondes
  type: nombre
  difficulte: 2
  enonce: Un morceau a un tempo de 120 BPM. Combien de pulsations entend-on en 30 secondes ?
  reponse:
    valeur: 60
    forme: entier
  indices:
    relance: Que veut dire BPM ? Sur quelle durée compte-t-on les battements ?
    methode: BPM veut dire « battements par minute ». Compare 30 secondes à une minute.
    etape: 30 secondes, c'est la moitié d'une minute. Prends donc la moitié des battements d'une minute.
  pieges:
  - si:
      valeur: 120
    relance: 120, c'est le nombre de battements en une minute entière. Ici on n'écoute que 30 secondes.
  - si:
      valeur: 240
    relance: En 30 secondes, on entend moins de battements qu'en une minute, pas plus.
  - si:
      valeur: 4
    relance: Tu as divisé 120 par 30. Mais 120 battements, c'est pour une minute. Quelle fraction de minute font 30 secondes
      ?
  solution: 120 BPM = 120 battements en une minute. 30 secondes = une demi-minute, donc 120 ÷ 2 = 60 pulsations.
- id: tempo-plus-rapide
  type: choix
  difficulte: 1
  enonce: Lequel de ces tempos est le plus rapide ?
  reponse:
    options:
    - id: a
      texte: adagio
    - id: b
      texte: andante
    - id: c
      texte: allegro
    - id: d
      texte: presto
    bonnes:
    - d
  indices:
    relance: Lesquels de ces mots désignent un tempo lent ou modéré ?
    methode: 'Du plus lent au plus rapide, on trouve : adagio, andante, puis deux tempos rapides. Lequel est le plus rapide
      des deux ?'
    etape: Allegro veut dire « joyeux, vif ». Il existe un mot qui veut dire « vite, très vite ».
  pieges:
  - si:
      contient:
      - c
    relance: Allegro est rapide, mais un autre mot de la liste indique un tempo encore plus vif.
  - si:
      contient:
      - a
    relance: Adagio est un tempo lent. On cherche le plus rapide.
  - si:
      contient:
      - b
    relance: Andante veut dire « en allant », à la vitesse de la marche. C'est modéré. Lequel est plus rapide ?
  solution: 'Presto (très rapide). Du plus lent au plus rapide : adagio, andante, allegro, presto.'
- id: mesure-six-huit
  type: texte_court
  difficulte: 2
  enonce: Dans une mesure notée 6/8, chaque temps se partage en trois croches. Comment appelle-t-on ce type de mesure ?
  reponse:
    acceptees:
    - ternaire
    - mesure ternaire
    fautes_tolerees: 1
  indices:
    relance: Il existe deux types de mesures selon le partage de chaque temps. Lesquels ?
    methode: Si chaque temps se partage en deux, la mesure est binaire. Et s'il se partage en trois ?
    etape: Le mot ressemble à « binaire », mais il commence par la syllabe « ter- », comme dans « tercet ».
  pieges:
  - si:
      valeur: binaire
    relance: Binaire, c'est quand chaque temps se partage en deux. Ici, en combien de croches se partage-t-il ?
  solution: 'Une mesure ternaire : chaque temps se partage en trois (6/8, 9/8, 12/8).'
- id: decrire-temps-rythme
  type: ouverte
  difficulte: 3
  enonce: 'Voici la description d''un extrait : « Une batterie marque des battements réguliers, environ deux par seconde.
    On peut compter 1-2-3-4, avec un appui sur le 1. Chaque battement se partage en deux sons égaux au charleston. La basse
    répète sans arrêt la même petite formule rythmique. Vers la fin, le tempo ralentit. » Décris le temps et le rythme de
    cet extrait en trois ou quatre phrases.'
  criteres:
  - L'élève donne la pulsation et un tempo cohérent (environ 120 BPM, rapide, allegro ou modéré-rapide) et nomme le ralentissement
    final (ritardando ou rallentando).
  - L'élève identifie une mesure à 4 temps, binaire, avec un temps fort sur le premier temps.
  - L'élève nomme la formule répétée de la basse (ostinato rythmique).
  indices:
    relance: Combien de battements par seconde ? Et par minute ?
    methode: 'Traite dans l''ordre : pulsation et tempo, puis mesure (combien de temps, binaire ou ternaire), puis ce que
      fait la basse, puis la fin.'
    etape: Tu peux commencer ainsi « La pulsation est régulière, environ deux battements par seconde, soit… ».
  solution: 'La pulsation est régulière, à environ deux battements par seconde, soit environ 120 BPM : un tempo rapide (allegro).
    La mesure est à 4 temps, avec un temps fort sur le premier ; elle est binaire, car chaque temps se partage en deux. La
    basse joue un ostinato rythmique. À la fin, le tempo ralentit : c''est un ritardando.'
- id: nblm-que-designe-la-pulsation-lorsqu-un-eleve-1
  type: choix
  difficulte: 2
  enonce: Que désigne la pulsation lorsqu'un élève cherche à battre la pulsation en écoutant un morceau ?
  reponse:
    options:
    - id: o1
      texte: Le battement régulier de la musique qui sert de repère temporel constant.
    - id: o2
      texte: La suite des durées très variées des notes et des silences.
    - id: o3
      texte: L'intensité du volume sonore, allant du très doux au très fort.
    - id: o4
      texte: Le nombre total d'instruments de musique qui jouent ensemble.
    bonnes:
    - o1
  indices:
    relance: Pense au battement constant que tu peux taper du pied sans y penser.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la suite des durées variées définit le rythme, et non la pulsation régulière.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : l''intensité du volume définit les nuances ou la dynamique, pas la pulsation.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : le nombre d''instruments concerne l''effectif musical, pas la pulsation.'
  solution: 'Le battement régulier de la musique qui sert de repère temporel constant. C''est exact : la pulsation est le
    battement régulier de la musique, servant de repère constant.'
- id: nblm-quel-appareil-permet-de-mesurer-la-vites-2
  type: choix
  difficulte: 2
  enonce: Quel appareil permet de mesurer la vitesse de la pulsation en battements par minute (BPM) ?
  reponse:
    options:
    - id: o1
      texte: Le métronome
    - id: o2
      texte: Le sonomètre
    - id: o3
      texte: Le séquenceur
    - id: o4
      texte: L'enregistreur
    bonnes:
    - o1
  indices:
    relance: C'est l'outil indispensable du musicien pour garder une vitesse régulière.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : le sonomètre sert à mesurer le niveau sonore en décibels.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : le séquenceur sert à organiser des pistes audio ou MIDI dans un logiciel de MAO.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : l''enregistreur sert à capter un signal sonore, pas à mesurer un tempo.'
  solution: 'Le métronome. C''est exact : le métronome donne le tempo exact en battements par minute.'
- id: nblm-quelle-est-la-relation-de-duree-entre-la-3
  type: choix
  difficulte: 2
  enonce: Quelle est la relation de durée entre la noire, la blanche et la croche lorsque la noire vaut un temps ?
  reponse:
    options:
    - id: o1
      texte: Une blanche vaut deux noires et une noire vaut deux croches.
    - id: o2
      texte: Une croche dure plus longtemps qu'une noire car elle possède un crochet.
    - id: o3
      texte: Une noire vaut deux blanches et une croche vaut deux noires.
    - id: o4
      texte: Une blanche vaut quatre noires et une croche vaut deux temps.
    bonnes:
    - o1
  indices:
    relance: 'Rappelle-toi l''ordre des durées : la blanche est plus longue que la noire, qui est plus longue que la croche.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la croche est deux fois plus courte que la noire, le crochet ne l''allonge pas.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : c''est l''inverse, la blanche est plus longue que la noire.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : une blanche vaut 2 noires et une croche vaut un demi-temps.'
  solution: 'Une blanche vaut deux noires et une noire vaut deux croches. C''est juste : la blanche vaut 2 temps, la noire
    1 temps, et la croche un demi-temps.'
- id: nblm-une-valse-utilise-une-mesure-a-trois-tem-4
  type: choix
  difficulte: 2
  enonce: Une valse utilise une mesure à trois temps. Que sait-on sur la structure de cette mesure ?
  reponse:
    options:
    - id: o1
      texte: Elle regroupe les pulsations par 3 temps, et elle est binaire si chaque temps se divise en 2.
    - id: o2
      texte: Elle est obligatoirement ternaire du seul fait qu'elle compte trois temps.
    - id: o3
      texte: Chaque temps de la mesure dure exactement une seconde quel que soit le morceau.
    - id: o4
      texte: Elle impose un changement de volume sonore sur le troisième temps.
    bonnes:
    - o1
  indices:
    relance: Distingue bien le nombre de temps dans la mesure et la façon dont chaque temps est découpé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : binaire ou ternaire dépend du partage de chaque temps (en 2 ou en 3), pas du nombre de temps.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : la durée d''un temps dépend du tempo (BPM), pas de la mesure.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : dans une mesure à 3 temps, c''est généralement le premier temps qui est appuyé.'
  solution: 'Elle regroupe les pulsations par 3 temps, et elle est binaire si chaque temps se divise en 2. C''est exact :
    la valse est une mesure à 3 temps, mais elle reste binaire car chaque temps se divise en 2.'
- id: nblm-pour-taper-dans-les-mains-en-rythme-sur-5
  type: choix
  difficulte: 2
  enonce: Pour taper dans les mains en rythme sur une pulsation de 60 battements par minute, à quelle fréquence faut-il frapper
    ?
  reponse:
    options:
    - id: o1
      texte: Exactement une fois par seconde.
    - id: o2
      texte: Deux fois par seconde.
    - id: o3
      texte: Une fois toutes les deux secondes.
    - id: o4
      texte: Soixante fois par seconde.
    bonnes:
    - o1
  indices:
    relance: Pense au nombre de secondes contenues dans une minute.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : frapper deux fois par seconde correspondrait à un tempo de 120 BPM.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : frapper toutes les deux secondes correspondrait à un tempo de 30 BPM.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : 60 BPM signifie 60 frappes par minute, pas par seconde.'
  solution: 'Exactement une fois par seconde. C''est juste : 60 BPM équivaut à 60 frappes en 60 secondes, soit 1 frappe par
    seconde.'
- id: nblm-quelles-sont-les-deux-propositions-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux propositions correctes concernant les termes italiens de tempo ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: « Allegro » indique un tempo rapide.
    - id: o2
      texte: « Accelerando » signifie que la vitesse de la pulsation augmente.
    - id: o3
      texte: « Tempo » sert à désigner l'intensité du son de fortissimo à pianissimo.
    - id: o4
      texte: « Adagio » signifie que la musique doit être jouée très rapidement.
    bonnes:
    - o1
    - o2
  indices:
    relance: Repère les termes qui se rapportent à la vitesse de la pulsation et à sa modification.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''intensité du son concerne la dynamique, alors que le tempo concerne la vitesse.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : adagio indique un tempo lent, alors que très rapide se dit presto.'
  solution: '« Allegro » indique un tempo rapide ; « Accelerando » signifie que la vitesse de la pulsation augmente. C''est
    juste : le mot italien allegro signifie que le tempo est rapide.'
- id: nblm-quel-mot-italien-designe-la-vitesse-de-l-7
  type: texte_court
  difficulte: 1
  enonce: Quel mot italien désigne la vitesse de la pulsation dans une œuvre musicale ?
  reponse:
    acceptees:
    - tempo
    fautes_tolerees: 1
  indices:
    relance: C'est le mot désignant la vitesse d'exécution d'un morceau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'tempo. C''est exact : le tempo est le terme italien qui indique la vitesse de la pulsation.'
- id: nblm-comment-appelle-t-on-une-courte-formule-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une courte formule rythmique répétée sans arrêt au cours d'un morceau ?
  reponse:
    acceptees:
    - ostinato rythmique
    fautes_tolerees: 1
  indices:
    relance: Ce terme qualifie un motif répétitif obstiné.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'ostinato rythmique. C''est exact : un ostinato rythmique est une formule rythmique répétée obstinément.'
- id: pulsations-en-deux-minutes
  type: nombre
  difficulte: 2
  enonce: Un morceau a un tempo de 90 BPM. Il dure 2 minutes. Combien de pulsations entend-on en tout ?
  reponse:
    valeur: 180
    forme: entier
  indices:
    relance: BPM veut dire « battements par minute ». Combien de minutes dure le morceau ?
    methode: Multiplie le nombre de battements par minute par le nombre de minutes.
    etape: Calcule 90 fois 2.
  pieges:
  - si:
      valeur: 45
    relance: 'Tu as divisé. Le morceau dure 2 minutes : les battements se multiplient, ils ne se partagent pas.'
  - si:
      valeur: 92
    relance: Tu as additionné. Il y a 90 battements chaque minute, et il y a deux minutes.
  solution: 90 × 2 = 180 pulsations.
- id: deux-noires
  type: choix
  difficulte: 1
  enonce: Quelle note dure aussi longtemps que deux noires ?
  reponse:
    options:
    - id: a
      texte: La ronde
    - id: b
      texte: La blanche
    - id: c
      texte: La croche
    - id: d
      texte: La double croche
    bonnes:
    - b
  indices:
    relance: Une noire vaut un temps. Combien de temps durent deux noires ensemble ?
    methode: Deux noires valent 2 temps. Cherche la note qui vaut 2 temps.
    etape: La ronde en vaut 4, la croche un demi. Reste à trouver celle qui en vaut 2.
  pieges:
  - si:
      contient:
      - a
    relance: La ronde vaut 4 temps, soit quatre noires. Cherche une valeur plus petite.
  - si:
      contient:
      - c
    relance: 'La croche vaut un demi-temps : elle est plus courte que la noire. Cherche une note plus longue.'
  - si:
      contient:
      - d
    relance: 'La double croche vaut un quart de temps : elle est bien plus courte que la noire.'
  solution: Deux noires valent 2 temps, comme une blanche.
