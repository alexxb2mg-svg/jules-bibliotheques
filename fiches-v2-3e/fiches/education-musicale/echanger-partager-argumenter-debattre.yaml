# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: echanger-partager-argumenter-debattre
version: 1
etat: verifiee
declencheurs:
- critique d'une prestation
- domaine public
- sons libres
- SACEM
- créateur, interprète ou auditeur
- débat sur une œuvre
prerequis:
- 4e-echanger-partager-argumenter-debattre
- ecouter-comparer-construire-culture
couverture: Couvre la critique de sa propre production et de celle d'un groupe, l'argumentation appuyée sur l'écoute, les
  trois postures (créateur, interprète, auditeur) et les règles de base du droit d'auteur en France. Les licences libres ne
  sont présentées que dans leur principe.
essentiel: 'En musique, on ne se contente pas de dire « j''aime » ou « je n''aime pas ». On apprend à porter un regard critique
  sur sa propre production et sur celle des autres.


  Une critique constructive commence par décrire objectivement ce qu''on entend (timbre, tempo, nuances, justesse, équilibre
  des voix), puis relève ce qui fonctionne et ce qui peut être amélioré, avec un moment précis du morceau et une proposition.
  On critique la musique, jamais la personne.


  Un avis est argumenté quand il s''appuie sur des éléments entendus : « le dernier refrain m''a plu parce que l''entrée de
  toutes les voix crée un effet de fête ».


  Face à une œuvre, on peut occuper trois postures : le créateur (le compositeur, qui invente l''œuvre), l''interprète (celui
  qui la joue ou la chante) et l''auditeur (celui qui l''écoute). Une même personne peut changer de posture : un élève est
  créateur quand il compose, interprète quand il chante, auditeur quand il écoute.


  Une œuvre appartient à son auteur. En France, elle est protégée par le droit d''auteur pendant toute la vie de l''auteur
  et 70 ans après sa mort ; elle entre ensuite dans le domaine public et devient libre d''utilisation. Pour utiliser une œuvre
  protégée, il faut une autorisation ; en France, la SACEM gère les droits de nombreux auteurs et compositeurs de musique.
  Pour une création de classe diffusée en ligne, on utilise ses propres sons, des œuvres du domaine public ou des sons sous
  licence libre, en citant toujours la source.

  '
methode:
- Décrire d'abord ce qu'on entend, sans juger, avec le vocabulaire musical.
- Relever un point réussi et un point à améliorer, en situant le moment précis du morceau.
- Donner son avis en l'appuyant sur un élément entendu (« parce que… »).
- Proposer une amélioration concrète.
- Avant d'utiliser un son ou une œuvre, vérifier qui en est l'auteur et si on a le droit de l'utiliser, puis citer la source.
vocabulaire:
- terme: critique constructive
  definition: 'remarque précise qui aide à progresser : elle situe un moment, décrit ce qu''on entend et propose une amélioration'
- terme: posture
  definition: 'ici, la place qu''on occupe face à la musique : créateur, interprète ou auditeur'
- terme: droit d'auteur
  definition: ensemble des droits qui protègent l'auteur d'une œuvre et lui permettent d'autoriser ou non son utilisation
- terme: domaine public
  definition: ensemble des œuvres dont les droits patrimoniaux ont expiré et qu'on peut utiliser librement
- terme: licence libre
  definition: autorisation donnée par l'auteur d'utiliser son œuvre à certaines conditions, souvent en citant son nom
erreurs_frequentes:
- 'Confondre avis personnel et critique argumentée : « c''est nul » n''est pas un argument.'
- Critiquer la personne au lieu de la musique.
- Rester vague (« c'était pas terrible ») au lieu de situer le moment et de nommer le problème.
- 'Confondre le compositeur (créateur) et l''interprète : une chanteuse qui reprend une chanson n''en est pas l''auteure.'
- Croire qu'une musique trouvée sur internet est libre de droits parce qu'elle est accessible gratuitement.
exemple:
  enonce: Ta classe vient de chanter un chant à deux voix. Formule une critique constructive.
  solution: Les deux voix étaient bien ensemble au début et la justesse était bonne dans les couplets. Au dernier refrain,
    en revanche, les voix aiguës couvraient les voix graves, si bien qu'on n'entendait plus la seconde voix. Pour la prochaine
    fois, les voix aiguës pourraient chanter mezzo forte pendant ce refrain afin d'équilibrer le groupe.
exercices:
- id: postures
  type: association
  difficulte: 1
  enonce: 'Relie chaque situation à la posture de la personne : créateur, interprète ou auditeur.'
  reponse:
    gauche:
    - id: ravel
      texte: Ravel écrit la partition du Boléro en 1928
    - id: orchestre
      texte: Un orchestre joue le Boléro en concert
    - id: eleve
      texte: Un élève écoute le Boléro au casque
    - id: buckley
      texte: Jeff Buckley chante en 1994 « Hallelujah », une chanson de Leonard Cohen
    droite:
    - id: createur
      texte: Créateur
    - id: interprete
      texte: Interprète
    - id: auditeur
      texte: Auditeur
    paires:
      ravel: createur
      orchestre: interprete
      eleve: auditeur
      buckley: interprete
  indices:
    relance: 'Pour chaque situation, demande-toi : cette personne invente-t-elle la musique, la joue-t-elle, ou l''écoute-t-elle
      ?'
    methode: Le créateur invente l'œuvre, l'interprète la fait sonner, l'auditeur la reçoit. Une posture peut servir plusieurs
      fois.
    etape: « Hallelujah » a été écrite par Leonard Cohen. Que fait Jeff Buckley, qui n'en est pas l'auteur ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie la chanson reprise : qui l''a écrite, et qui la chante ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Rappelle-toi : inventer, c''est créer ; jouer ou chanter, c''est interpréter ; écouter, c''est être auditeur.'
  solution: Ravel qui écrit le Boléro est créateur. L'orchestre et Jeff Buckley, qui font entendre l'œuvre d'un autre, sont
    interprètes. L'élève au casque est auditeur.
- id: critique-constructive
  type: choix
  difficulte: 1
  enonce: Un groupe vient de présenter sa création. Quelle remarque est une critique constructive ?
  reponse:
    options:
    - id: a
      texte: C'était raté, vous n'avez pas assez travaillé
    - id: b
      texte: Je n'aime pas ce genre de musique
    - id: c
      texte: 'Au milieu, la boucle de percussions couvrait la voix : baisser son volume rendrait le texte plus clair'
    - id: d
      texte: C'était super parce que c'est mon groupe d'amis
    bonnes:
    - c
  indices:
    relance: Quelle remarque pourrait vraiment aider le groupe à améliorer sa création ?
    methode: Une critique constructive situe un moment, décrit ce qu'on entend et propose une amélioration.
    etape: Élimine les remarques qui parlent des personnes ou de ton goût. Il en reste une qui parle de la musique.
  pieges:
  - si:
      contient:
      - a
    relance: Cette remarque juge le travail sans dire ce qui n'allait pas. Laquelle nomme un problème précis ?
  - si:
      contient:
      - b
    relance: C'est ton goût, et tu as le droit de l'avoir. Mais aide-t-il le groupe à progresser ?
  - si:
      contient:
      - d
    relance: L'amitié n'est pas un argument musical. Quelle remarque s'appuie sur ce qu'on a entendu ?
  solution: 'La remarque sur la boucle de percussions qui couvrait la voix : elle situe le moment, décrit le problème (l''équilibre
    des volumes) et propose une solution.'
- id: duree-droits
  type: nombre
  difficulte: 2
  enonce: En France, dans le cas général, pendant combien d'années après la mort de l'auteur une œuvre musicale reste-t-elle
    protégée par le droit d'auteur ?
  reponse:
    valeur: 70
    forme: entier
  indices:
    relance: L'œuvre est protégée pendant toute la vie de l'auteur, puis encore un certain temps. Te souviens-tu de cette
      durée ?
    methode: 'Relis la partie de la leçon sur le domaine public : on y donne une durée en années, comptée à partir de la mort
      de l''auteur.'
    etape: C'est un nombre de dizaines d'années, entre 50 et 100.
  pieges:
  - si:
      valeur: 50
    relance: 50 ans, c'est la durée appliquée dans certains autres pays. En France, la durée est plus longue.
  - si:
      valeur: 100
    relance: C'est trop long. La durée française est plus courte, mais supérieure à 50 ans.
  solution: 70 ans après la mort de l'auteur. Ensuite, l'œuvre entre dans le domaine public.
- id: sons-utilisables
  type: choix
  difficulte: 2
  enonce: La classe publie en ligne une vidéo de son projet et cherche une musique de fond. Quelles musiques peut-elle utiliser
    sans demander d'autorisation ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Des sons que la classe a enregistrés elle-même
    - id: b
      texte: Un morceau sous licence libre, en citant son auteur comme la licence le demande
    - id: c
      texte: Un tube récent trouvé sur une plateforme d'écoute
    - id: d
      texte: N'importe quelle chanson, à condition de n'en garder que 30 secondes
    bonnes:
    - a
    - b
  indices:
    relance: Qui a le droit de décider de l'utilisation d'une musique ?
    methode: Pour chaque proposition, demande-toi si l'auteur a donné son accord, ou si c'est la classe elle-même qui est
      l'auteur.
    etape: Un tube récent appartient encore à ses auteurs, et couper un extrait ne change rien à leurs droits. Que reste-t-il
      ?
  pieges:
  - si:
      contient:
      - c
    relance: Pouvoir écouter une musique en ligne ne veut pas dire avoir le droit de la réutiliser. Qui en est l'auteur ?
  - si:
      contient:
      - d
    relance: Couper un extrait ne supprime pas les droits de l'auteur. Quelles musiques sont vraiment autorisées ?
  - si:
      diagnostic: incomplet
    relance: 'Il y a une autre possibilité : un auteur peut donner à l''avance son accord, à certaines conditions.'
  solution: Les sons enregistrés par la classe, et un morceau sous licence libre en citant l'auteur. Un tube récent, même
    court, reste protégé par le droit d'auteur.
- id: etapes-critique
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes d'une critique argumentée d'une production musicale.
  reponse:
    elements:
    - id: decrire
      texte: Décrire objectivement ce qu'on entend
    - id: analyser
      texte: Analyser l'effet produit par les choix musicaux
    - id: avis
      texte: Donner son avis en l'appuyant sur un élément entendu
    - id: proposer
      texte: Proposer une piste d'amélioration
  indices:
    relance: Peut-on donner un avis juste sur une musique avant d'avoir dit ce qu'on y entend ?
    methode: Va du plus objectif au plus personnel, puis termine par ce qui aide le groupe à progresser.
    etape: On commence par décrire. Que fait-on ensuite avec ces éléments décrits, avant de donner son avis ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle s'appuie sur l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Une critique argumentée part des faits entendus et finit par une proposition. Replace les étapes entre les deux.
  solution: Décrire ce qu'on entend, analyser l'effet produit, donner son avis appuyé sur un élément entendu, proposer une
    amélioration.
- id: debat-cage
  type: ouverte
  difficulte: 3
  enonce: 'En 1952, John Cage présente 4′33″ : pendant quatre minutes et trente-trois secondes, le pianiste ne joue aucune
    note ; on entend seulement les bruits de la salle et du public. Est-ce de la musique ? Défends ton point de vue en quelques
    phrases.'
  criteres:
  - L'élève donne clairement son point de vue.
  - L'élève l'appuie sur au moins deux arguments liés à l'œuvre (ce qu'on entend, le rôle du public, l'intention du compositeur,
    la place de l'interprète).
  - L'élève tient compte d'un argument du camp opposé et y répond, sans critiquer les personnes.
  indices:
    relance: Que fait l'interprète pendant 4′33″ ? Et qu'entend l'auditeur ?
    methode: Donne ton avis, puis deux arguments avec « parce que » ou « car ». Termine en répondant à une objection.
    etape: 'Tu peux commencer ainsi : « Selon moi, 4′33″ est (ou n''est pas) de la musique, parce que… ».'
  solution: 'Selon moi, 4′33″ est une forme de musique, parce que Cage fait écouter autrement les sons qui nous entourent
    : les bruits de la salle deviennent le matériau de l''œuvre. De plus, l''œuvre a un compositeur, un interprète, une durée
    fixée et un public, comme un concert. On peut objecter qu''aucune note n''est jouée ; mais la musique n''est pas faite
    seulement de notes, elle peut aussi être une façon d''organiser l''écoute.'
- id: nblm-par-quoi-doit-obligatoirement-commencer-1
  type: choix
  difficulte: 2
  enonce: Par quoi doit obligatoirement commencer une critique constructive lors de l'évaluation d'une prestation musicale
    ?
  reponse:
    options:
    - id: o1
      texte: Par donner son sentiment général en disant si l'on a aimé ou non.
    - id: o2
      texte: Par décrire objectivement ce que l'on entend avec le vocabulaire musical.
    - id: o3
      texte: Par critiquer le comportement de l'interprète sur scène.
    - id: o4
      texte: Par proposer immédiatement des modifications globales sans analyser le morceau.
    bonnes:
    - o2
  indices:
    relance: 'Pense aux premières étapes de la méthode : faut-il juger immédiatement ou décrire la musique ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: Il s'agit d'un avis personnel subjectif et non d'une démarche critique constructive.
  - si:
      contient:
      - o3
    relance: 'Erreur classique : la critique doit porter uniquement sur la musique et non sur la personne.'
  - si:
      contient:
      - o4
    relance: Sans description préalable ni localisation précise, la proposition d'amélioration reste vague et infondée.
  solution: Par décrire objectivement ce que l'on entend avec le vocabulaire musical. Une critique constructive commence toujours
    par une description objective des éléments entendus (timbre, nuances, justeese).
- id: nblm-comment-appelle-t-on-le-role-d-un-eleve-2
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on le rôle d'un élève lorsqu'il joue ou chante une œuvre musicale devant la classe ?
  reponse:
    options:
    - id: o1
      texte: Le créateur
    - id: o2
      texte: L'interprète
    - id: o3
      texte: L'auditeur
    - id: o4
      texte: L'ayant droit
    bonnes:
    - o2
  indices:
    relance: Réfléchis à la distinction entre inventer l'œuvre, la jouer devant un public ou l'écouter.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: Le créateur (ou compositeur) est celui qui invente l'œuvre initiale.
  - si:
      contient:
      - o3
    relance: L'auditeur est la personne qui écoute la musique.
  - si:
      contient:
      - o4
    relance: L'ayant droit est la personne physique ou morale qui possède les droits d'auteur sur l'œuvre.
  solution: L'interprète. L'interprète est celui qui joue ou chante une musique.
- id: nblm-en-france-combien-de-temps-apres-la-mort-3
  type: choix
  difficulte: 2
  enonce: En France, combien de temps après la mort de son auteur une œuvre musicale entre-t-elle dans le domaine public ?
  reponse:
    options:
    - id: o1
      texte: Dès la mort de l'auteur
    - id: o2
      texte: 50 ans après la mort de l'auteur
    - id: o3
      texte: 70 ans après la mort de l'auteur
    - id: o4
      texte: 100 ans après la mort de l'auteur
    bonnes:
    - o3
  indices:
    relance: Rappelle-toi du nombre d'années de protection patrimoniale qui suit le décès du créateur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: Les droits patrimoniaux continuent de protéger l'œuvre bien après le décès de son auteur.
  - si:
      contient:
      - o2
    relance: 'Attention aux durées légales : en France, le délai de protection post-mortem n''est pas de 50 ans.'
  - si:
      contient:
      - o4
    relance: La durée de 100 ans est supérieure au délai légal fixé pour le domaine public.
  solution: 70 ans après la mort de l'auteur. Une œuvre entre dans le domaine public 70 ans après la mort de son auteur.
- id: nblm-quel-est-le-role-principal-de-la-sacem-e-4
  type: choix
  difficulte: 2
  enonce: Quel est le rôle principal de la SACEM en France concernant les œuvres musicales ?
  reponse:
    options:
    - id: o1
      texte: Accorder systématiquement la gratuité à tous les morceaux publiés sur internet.
    - id: o2
      texte: Collecter et reverser les droits d'auteur aux auteurs et compositeurs membres.
    - id: o3
      texte: Interdire toute diffusion de musique dans le cadre scolaire.
    - id: o4
      texte: Rédiger des critiques constructives sur les enregistrements d'élèves.
    bonnes:
    - o2
  indices:
    relance: Pense à la structure qui gère la rémunération et la protection financière des auteurs-compositeurs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: La disponibilité d'un morceau sur internet ne signifie pas qu'il est gratuit ni libre de droits.
  - si:
      contient:
      - o3
    relance: La SACEM régule l'utilisation légale des œuvres et n'a pas pour rôle d'interdire les activités pédagogiques.
  - si:
      contient:
      - o4
    relance: La SACEM est un organisme de gestion des droits d'auteur et non une instance d'évaluation artistique.
  solution: Collecter et reverser les droits d'auteur aux auteurs et compositeurs membres. La SACEM gère les droits patrimoniaux
    des auteurs, compositeurs et éditeurs de musique.
- id: nblm-lors-d-un-debat-sur-une-uvre-musicale-qu-5
  type: choix
  difficulte: 2
  enonce: Lors d'un débat sur une œuvre musicale, quelle formulation constitue un argument valide pour défendre son point
    de vue ?
  reponse:
    options:
    - id: o1
      texte: « C'est nul parce que personne n'écoute ce genre de musique dans ma classe. »
    - id: o2
      texte: « Ce morceau me plaît car l'entrée progressive de toutes les voix crée un effet de fête. »
    - id: o3
      texte: « Cette œuvre est parfaite car le compositeur est très célèbre. »
    - id: o4
      texte: « Je n'aime pas cette prestation car je trouve la tenue du chanteur déplaisante. »
    bonnes:
    - o2
  indices:
    relance: Un bon argument s'appuie toujours sur des faits sonores et musicaux précis.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: Se référer à la popularité ou au goût personnel n'est pas un argument musical.
  - si:
      contient:
      - o3
    relance: La notoriété de l'auteur n'est pas une justification fondée sur l'analyse de l'œuvre elle-même.
  - si:
      contient:
      - o4
    relance: La critique musicale doit porter sur la musique et non sur l'apparence physique de l'interprète.
  solution: « Ce morceau me plaît car l'entrée progressive de toutes les voix crée un effet de fête. ». Un avis est argumenté
    lorsqu'il s'appuie sur des éléments musicaux précis et observés à l'écoute.
- id: nblm-pour-realiser-un-projet-musical-de-class-6
  type: choix
  difficulte: 3
  enonce: Pour réaliser un projet musical de classe diffusé en ligne, quels types de ressources sonores peux-tu utiliser légalement
    sans autorisation payante préalable ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Des œuvres entrées dans le domaine public.
    - id: o2
      texte: N'importe quelle chanson récente accessible gratuitement sur internet.
    - id: o3
      texte: Des sons sous licence libre (Creative Commons), en citant la source.
    - id: o4
      texte: Des extraits de 5 secondes de morceaux commerciaux protégés sans autorisation.
    bonnes:
    - o1
    - o3
  indices:
    relance: Recherche les ressources autorisées par le droit d'auteur ou mises à disposition selon des conditions spécifiques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la gratuité d''accès sur internet n''équivaut pas à une liberté d''utilisation ou de réutilisation.'
  - si:
      contient:
      - o4
    relance: 'Idée reçue fausse : même un très court extrait d''une œuvre protégée nécessite l''accord des ayants droit.'
  solution: Des œuvres entrées dans le domaine public ; Des sons sous licence libre (Creative Commons), en citant la source.
    Les œuvres du domaine public ne sont plus sous droits patrimoniaux et peuvent être réutilisées librement.
- id: nblm-une-uvre-dont-les-droits-d-auteur-ont-ex-7
  type: texte_court
  difficulte: 1
  enonce: Une œuvre dont les droits d'auteur ont expiré et qui peut être réutilisée librement par tous fait partie du domaine
    _______.
  reponse:
    acceptees:
    - public
    fautes_tolerees: 1
  indices:
    relance: C'est l'expression juridique désignant l'ensemble des œuvres libres de droits patrimoniaux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: public. L'ensemble des œuvres libérées des droits patrimoniaux après le délai légal constitue le 'domaine public'.
- id: nblm-en-france-la-societe-qui-gere-et-collect-8
  type: texte_court
  difficulte: 1
  enonce: En France, la société qui gère et collecte les droits d'auteur pour de nombreux compositeurs et musiciens s'appelle
    la _______.
  reponse:
    acceptees:
    - SACEM
