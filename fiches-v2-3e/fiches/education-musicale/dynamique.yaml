format: 2
notion: dynamique
version: 3
etat: verifiee
declencheurs:
- nuances piano forte
- jouer plus fort ou plus doux
- crescendo
- decrescendo
- pianissimo fortissimo
- soufflet sur la partition
prerequis:
- 4e-dynamique
essentiel: 'La dynamique, c''est la façon dont l''intensité du son (son volume) varie dans une musique. Sur la partition,
  on l''indique par des nuances, avec des mots italiens abrégés.


  Du plus doux au plus fort : pianissimo (pp, très doux), piano (p, doux), mezzo piano (mp, moyennement doux), mezzo forte
  (mf, moyennement fort), forte (f, fort), fortissimo (ff, très fort). On trouve aussi ppp et fff pour les extrêmes.


  Les changements peuvent être :

  - progressifs : crescendo (cresc., soufflet qui s''ouvre « < »), de plus en plus fort ; decrescendo ou diminuendo (soufflet
  qui se ferme « > »), de plus en plus doux ;

  - soudains : on passe d''un coup d''une nuance à une autre. C''est un contraste, qui crée la surprise.

  Un accent fait ressortir une seule note, jouée plus appuyée.


  Deux œuvres repères. Dans le Boléro de Maurice Ravel (1928), le même thème revient sans cesse et tout le morceau est un
  immense crescendo, du pianissimo du début jusqu''au fortissimo de la fin. Dans le deuxième mouvement de la Symphonie n°
  94 de Joseph Haydn, surnommée « La Surprise » (fin du XVIIIe siècle), un passage très doux est interrompu par un accord
  soudain très fort.


  La dynamique sert l''expression : calme, tension, surprise, puissance.


  Attention aux confusions. La dynamique concerne le volume, pas la vitesse : jouer piano ne veut pas dire jouer lentement.
  La vitesse, c''est le tempo. Le mot « piano » désigne aussi l''instrument, mais sur une partition, la lettre p indique une
  nuance douce.


  Les nuances sont relatives : un forte n''a pas un volume mesuré, il est plus fort que le mezzo forte qui précède. Les nuances
  jouent souvent avec le timbre : le même instrument sonne différemment à voix douce ou forte.


  Ce qu''on attend en évaluation : lire et nommer les nuances et les signes, dire si le changement est progressif ou soudain,
  puis expliquer l''effet produit.

  '
methode:
- Écouter le début et donner la nuance de départ (doux, moyen, fort).
- Repérer si le volume change peu à peu (crescendo, decrescendo) ou d'un coup (contraste).
- Donner le nom italien et l'abréviation de chaque nuance entendue.
- 'Relier la dynamique à l''effet produit : calme, tension, surprise, puissance.'
vocabulaire:
- terme: nuance
  definition: degré d'intensité indiqué sur la partition (pp, p, mp, mf, f, ff)
- terme: crescendo
  definition: augmentation progressive de l'intensité
- terme: decrescendo
  definition: diminution progressive de l'intensité (on dit aussi diminuendo)
- terme: contraste
  definition: passage brusque d'une nuance à une nuance très différente
- terme: accent
  definition: note jouée plus appuyée que les autres
- terme: dynamique
  definition: manière dont l'intensité du son varie dans une musique
- terme: piano
  definition: en nuance, doux (p) ; à ne pas confondre avec l'instrument de musique
erreurs_frequentes:
- Confondre « piano » la nuance (doux) et le piano, l'instrument.
- 'Croire que « mezzo » veut dire « très » : il veut dire « moyennement ».'
- 'Confondre la dynamique (fort ou doux) avec le tempo (rapide ou lent) : une musique peut être à la fois lente et très forte.'
- 'Inverser les soufflets : celui qui s''ouvre (<) est le crescendo.'
exemple:
  enonce: Un morceau commence très doucement, puis le volume augmente peu à peu jusqu'à devenir très fort. Décris sa dynamique
    avec les mots justes.
  solution: Il commence pianissimo (pp), puis fait un crescendo progressif jusqu'au fortissimo (ff). C'est le principe du
    Boléro de Ravel.
exercices:
- id: ranger-nuances
  type: ordre
  difficulte: 1
  enonce: Range ces nuances de la plus douce à la plus forte.
  reponse:
    elements:
    - id: pp
      texte: pianissimo (pp)
    - id: p
      texte: piano (p)
    - id: mf
      texte: mezzo forte (mf)
    - id: f
      texte: forte (f)
    - id: ff
      texte: fortissimo (ff)
  indices:
    relance: Que veulent dire « piano » et « forte » en italien ?
    methode: « Piano » veut dire doux, « forte » veut dire fort. La terminaison « -issimo » veut dire « très », et « mezzo
      » veut dire « moyennement ».
    etape: La plus douce est celle qui veut dire « très doux ». Continue en montant peu à peu.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux nuances voisines sont inversées. Laquelle des deux est la plus douce ?
  - si:
      diagnostic: ordre_faux
    relance: Sépare d'abord les nuances douces (piano) et fortes (forte), puis range chaque groupe.
  solution: 'pp, p, mf, f, ff : pianissimo, piano, mezzo forte, forte, fortissimo.'
- id: sens-mf
  type: choix
  difficulte: 1
  enonce: Sur une partition, tu lis « mf ». Que dois-tu faire ?
  reponse:
    options:
    - id: a
      texte: jouer moyennement fort
    - id: b
      texte: jouer très fort
    - id: c
      texte: jouer de plus en plus fort
    - id: d
      texte: jouer moyennement vite
    bonnes:
    - a
  indices:
    relance: Que veut dire « f » ? Et « m », qui vient de « mezzo » ?
    methode: « Mezzo » veut dire « moyennement » en italien. Les nuances parlent de l'intensité, pas de la vitesse.
    etape: Il s'agit d'une nuance fixe, ni la plus forte, ni un changement progressif. Laquelle correspond ?
  pieges:
  - si:
      contient:
      - b
    relance: Très fort s'écrit ff. Que change la lettre m placée devant le f ?
  - si:
      contient:
      - c
    relance: De plus en plus fort, c'est un changement progressif, noté par un soufflet. Ici la nuance est-elle fixe ?
  - si:
      contient:
      - d
    relance: Les nuances disent s'il faut jouer fort ou doux, pas vite ou lentement.
  solution: 'mf = mezzo forte : moyennement fort.'
- id: symboles-nuances
  type: association
  difficulte: 2
  enonce: Relie chaque signe de la partition à ce qu'il demande.
  reponse:
    gauche:
    - id: a
      texte: pp
    - id: b
      texte: f
    - id: c
      texte: mp
    - id: d
      texte: soufflet qui s'ouvre (<)
    - id: e
      texte: soufflet qui se ferme (>)
    droite:
    - id: v
      texte: très doux
    - id: w
      texte: fort
    - id: x
      texte: moyennement doux
    - id: y
      texte: de plus en plus fort
    - id: z
      texte: de plus en plus doux
    paires:
      a: v
      b: w
      c: x
      d: y
      e: z
  indices:
    relance: Quelles lettres viennent de « piano » et lesquelles de « forte » ?
    methode: p = doux, f = fort ; une lettre doublée veut dire « très » ; m (mezzo) veut dire « moyennement ». Pour les soufflets,
      regarde si l'écart s'agrandit ou se referme.
    etape: pp veut dire très doux. Le soufflet qui s'ouvre montre un son qui grandit. Place les trois autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux soufflets.
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par les lettres : p pour doux, f pour fort. Puis traite les deux soufflets.'
  solution: 'pp : très doux ; f : fort ; mp : moyennement doux ; soufflet qui s''ouvre : crescendo, de plus en plus fort ;
    soufflet qui se ferme : decrescendo, de plus en plus doux.'
- id: mot-plus-en-plus-fort
  type: texte_court
  difficulte: 2
  enonce: Dans le Boléro de Ravel (1928), le volume augmente peu à peu du début à la fin. Quel mot italien désigne cette augmentation
    progressive de l'intensité ?
  reponse:
    acceptees:
    - crescendo
    - cresc
    fautes_tolerees: 1
  indices:
    relance: Sur la partition, ce mot est souvent remplacé par un soufflet qui s'ouvre. Comment l'appelle-t-on ?
    methode: Ce mot italien vient du verbe qui veut dire « grandir », « croître ».
    etape: 'Le mot a trois syllabes : « cré », « chèn », « do » (il commence par « cr »).'
  pieges:
  - si:
      valeur: decrescendo
    relance: Le decrescendo fait baisser le volume. Dans le Boléro, le volume monte. Quel est le mot contraire ?
  - si:
      valeur: fortissimo
    relance: Fortissimo est une nuance fixe (très fort), celle de la fin. Quel mot désigne le chemin progressif pour y arriver
      ?
  solution: Un crescendo (abrégé cresc., ou noté par un soufflet qui s'ouvre) est une augmentation progressive de l'intensité.
- id: decrire-dynamique
  type: ouverte
  difficulte: 3
  enonce: 'Voici la description d''un extrait : « Une flûte seule joue très doucement. Peu à peu, d''autres instruments s''ajoutent
    et le volume monte jusqu''à un passage très puissant de tout l''orchestre. Soudain, tout s''arrête ; puis un violon reprend,
    très doucement. » Décris la dynamique de cet extrait en trois ou quatre phrases, avec le vocabulaire précis.'
  criteres:
  - 'L''élève nomme les nuances avec les mots italiens : pianissimo ou piano au début, fortissimo au sommet, pianissimo ou
    piano à la reprise du violon.'
  - L'élève distingue le changement progressif (crescendo) et le changement soudain (contraste après le silence).
  - L'élève dit l'effet produit (tension qui monte, surprise, retour au calme).
  indices:
    relance: Comment le volume change-t-il au milieu de l'extrait, puis à la fin ?
    methode: Donne la nuance de chaque moment, puis dis si l'on passe de l'une à l'autre peu à peu ou d'un coup.
    etape: Tu peux commencer ainsi « L'extrait commence pianissimo, avec une flûte seule… ».
  solution: 'L''extrait commence pianissimo, avec une flûte seule. Un long crescendo, renforcé par l''entrée de nouveaux instruments,
    mène jusqu''au fortissimo de tout l''orchestre. Après un silence, le violon reprend pianissimo : ce contraste soudain
    crée la surprise et ramène le calme.'
- id: nblm-que-designe-la-notion-de-dynamique-en-ed-1
  type: choix
  difficulte: 2
  enonce: Que désigne la notion de « dynamique » en éducation musicale ?
  reponse:
    options:
    - id: o1
      texte: L'intensité du son, c'est-à-dire la façon dont son volume varie (jouer plus fort ou plus doux)
    - id: o2
      texte: La vitesse d'exécution de la musique, mesurée en battements par minute
    - id: o3
      texte: La couleur spécifique du son permettant d'identifier chaque instrument
    - id: o4
      texte: L'organisation des différentes sections d'un morceau dans le temps
    bonnes:
    - o1
  indices:
    relance: Pense aux variations de volume sonore indiquées par les nuances sur la partition.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : la vitesse de la musique s''appelle le tempo, et non la dynamique.'
  - si:
      contient:
      - o3
    relance: 'Faux : la couleur sonore qui permet de reconnaître un instrument ou une voix est le timbre.'
  - si:
      contient:
      - o4
    relance: 'Faux : la structure et la succession des parties d''une œuvre forment sa forme musicale.'
  solution: 'L''intensité du son, c''est-à-dire la façon dont son volume varie (jouer plus fort ou plus doux). C''est exact
    : la dynamique concerne les variations d''intensité sonore, des nuances les plus douces aux plus fortes.'
- id: nblm-que-signifie-l-indication-italienne-mezz-2
  type: choix
  difficulte: 2
  enonce: Que signifie l'indication italienne « mezzo forte » (abrégée mf) sur une partition ?
  reponse:
    options:
    - id: o1
      texte: Moyennement fort
    - id: o2
      texte: Très fort
    - id: o3
      texte: Très doux
    - id: o4
      texte: Réservé exclusivement aux instruments à clavier comme le piano
    bonnes:
    - o1
  indices:
    relance: Pense à la traduction littérale du mot italien 'mezzo'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Piège fréquent : ''mezzo'' ne veut pas dire ''très''. Très fort se traduit par ''fortissimo'' (ff).'
  - si:
      contient:
      - o3
    relance: 'Faux : très doux s''écrit ''pianissimo'' (pp).'
  - si:
      contient:
      - o4
    relance: Attention à ne pas confondre la nuance de volume 'piano' (doux) avec l'instrument de musique.
  solution: Moyennement fort. En italien musical, le terme 'mezzo' signifie 'moyennement' et 'forte' veut dire 'fort'.
- id: nblm-sur-une-partition-quel-symbole-geometriq-3
  type: choix
  difficulte: 2
  enonce: Sur une partition, quel symbole géométrique représente un « crescendo », et quel effet produit-il ?
  reponse:
    options:
    - id: o1
      texte: Un soufflet qui s'ouvre (<), indiquant de jouer de plus en plus fort
    - id: o2
      texte: Un soufflet qui se ferme (>), indiquant de jouer de plus en plus fort
    - id: o3
      texte: Un soufflet qui s'ouvre (<), indiquant d'accélérer progressivement le tempo
    - id: o4
      texte: L'abréviation pp, indiquant une coupure soudaine du son
    bonnes:
    - o1
  indices:
    relance: Observe attentivement le sens dans lequel les deux lignes du soufflet s'écartent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le soufflet qui se ferme (>) désigne le decrescendo (de plus en plus doux).'
  - si:
      contient:
      - o3
    relance: Attention à ne pas confondre le volume sonore (dynamique) et la vitesse du morceau (tempo).
  - si:
      contient:
      - o4
    relance: 'Faux : pp signifie ''pianissimo'' (très doux) et n''est pas un symbole de variation progressive.'
  solution: Un soufflet qui s'ouvre (<), indiquant de jouer de plus en plus fort. Le soufflet qui s'ouvre (<) indique une
    augmentation progressive de l'intensité sonore.
- id: nblm-dans-le-deuxieme-mouvement-de-la-symphon-4
  type: choix
  difficulte: 2
  enonce: Dans le deuxième mouvement de la Symphonie n° 94 (« La Surprise ») de Haydn, quel procédé dynamique crée un effet
    de surprise ?
  reponse:
    options:
    - id: o1
      texte: Un passage très doux interrompu brutalement par un accord très fort
    - id: o2
      texte: Un long crescendo continu du pianissimo jusqu'au fortissimo final
    - id: o3
      texte: Un decrescendo lent amenant un silence total
    - id: o4
      texte: Une accélération subite de la vitesse de la musique sans changer de volume
    bonnes:
    - o1
  indices:
    relance: Pense au saut soudain d'intensité sonore qui réveille l'auditeur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : ce long crescendo ininterrompu est le procédé central du Boléro de Ravel, pas de la symphonie de
      Haydn.'
  - si:
      contient:
      - o3
    relance: 'Faux : l''effet de surprise provient d''une augmentation brutale du volume sonore, non d''un silence effacé.'
  - si:
      contient:
      - o4
    relance: 'Faux : la surprise est produite par la dynamique (changement de volume), et non par le tempo.'
  solution: 'Un passage très doux interrompu brutalement par un accord très fort. C''est exact : la rupture soudaine entre
    une nuance très douce et un accord très fort constitue un contraste dynamique.'
- id: nblm-si-une-piece-musicale-debute-pianissimo-5
  type: choix
  difficulte: 2
  enonce: Si une pièce musicale débute « pianissimo » (pp) et s'achève « fortissimo » (ff), comment a évolué la nuance ?
  reponse:
    options:
    - id: o1
      texte: Elle est passée d'une nuance très douce à une nuance très forte
    - id: o2
      texte: Elle est passée de moyennement doux à moyennement fort
    - id: o3
      texte: La musique a démarré très lentement pour finir très rapidement
    - id: o4
      texte: Le morceau commence sur un piano à queue et se termine avec tous les instruments
    bonnes:
    - o1
  indices:
    relance: Traduis le suffixe italien '-issimo' qui marque le degré le plus fort de la nuance.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : moyennement doux correspond à ''mezzo piano'' (mp) et moyennement fort à ''mezzo forte'' (mf).'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : pianissimo et fortissimo sont des nuances d''intensité, pas des vitesses de tempo.'
  - si:
      contient:
      - o4
    relance: 'Attention : la nuance ''piano'' indique qu''il faut jouer de façon douce, ce n''est pas une référence à l''instrument.'
  solution: 'Elle est passée d''une nuance très douce à une nuance très forte. C''est exact : pianissimo signifie ''très doux''
    et fortissimo signifie ''très fort''.'
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations exactes concernant les nuances et les symboles de dynamique ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Le symbole du soufflet qui se ferme (>) indique un decrescendo (ou diminuendo), c'est-à-dire un son de plus en
        plus doux.
    - id: o2
      texte: Un morceau de musique peut avoir un tempo très lent tout en étant joué à une nuance fortissimo (très fort).
    - id: o3
      texte: L'abréviation 'mf' signifie 'très fort' car la syllabe 'mezzo' renforce l'intensité.
    - id: o4
      texte: Le mot 'crescendo' demande aux musiciens d'accélérer progressivement le rythme de la musique.
    bonnes:
    - o1
    - o2
  indices:
    relance: Garde à l'esprit la distinction stricte entre la vitesse (tempo) et le volume (dynamique), ainsi que le sens
      des soufflets.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : ''mezzo'' signifie ''moyennement''. ''mf'' veut donc dire ''moyennement fort''.'
  - si:
      contient:
      - o4
    relance: 'Faux : ''crescendo'' concerne uniquement l''augmentation du volume sonore (jouer plus fort), pas la vitesse.'
  solution: 'Le symbole du soufflet qui se ferme (>) indique un decrescendo (ou diminuendo), c''est-à-dire un son de plus
    en plus doux ; Un morceau de musique peut avoir un tempo très lent tout en étant joué à une nuance fortissimo (très fort).
    C''est exact : les deux lignes du soufflet qui se rapprochent indiquent une diminution progressive de l''intensité sonore.'
- id: nblm-quel-terme-italien-designe-une-diminutio-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme italien désigne une diminution progressive de l'intensité sonore, amenant les musiciens à jouer de plus
    en plus doux ?
  reponse:
    acceptees:
    - decrescendo
    fautes_tolerees: 1
  indices:
    relance: Ce mot italien commence par le préfixe 'de-' et représente le contraire du crescendo.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: decrescendo. Le terme 'decrescendo' (ou 'diminuendo') indique sur la partition une diminution progressive du volume.
- id: nblm-comment-appelle-t-on-le-passage-brusque-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le passage brusque d'une nuance douce à une nuance très forte qui crée la surprise chez l'auditeur
    ?
  reponse:
    acceptees:
    - contraste
    fautes_tolerees: 1
  indices:
    relance: Ce terme désigne une opposition forte et immédiate entre deux éléments.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: contraste. Un 'contraste' dynamique est le passage soudain d'une nuance à une autre très différente.
- id: piano-nuance
  type: choix
  difficulte: 1
  enonce: Un chef d'orchestre demande à l'orchestre de jouer « piano ». Qu'est-ce qui change dans la musique ?
  reponse:
    options:
    - id: a
      texte: 'La vitesse : la musique devient lente'
    - id: b
      texte: 'Le volume : la musique devient douce'
    - id: c
      texte: 'La hauteur : les notes deviennent graves'
    - id: d
      texte: 'Les instruments : seul le piano joue'
    bonnes:
    - b
  indices:
    relance: 'Quel paramètre du son la dynamique décrit-elle : la vitesse, le volume ou la hauteur ?'
    methode: Une nuance indique l'intensité. Cherche la réponse qui parle de l'intensité.
    etape: Piano, en nuance, veut dire « doucement ». Que règle-t-on alors ?
  pieges:
  - si:
      contient:
      - a
    relance: La vitesse s'appelle le tempo. Quelle notion parle du volume ?
  - si:
      contient:
      - c
    relance: La hauteur dit si le son est grave ou aigu. Est-ce lié à la dynamique ?
  - si:
      contient:
      - d
    relance: Ici, « piano » est une nuance et non l'instrument. Que demande-t-on aux musiciens ?
  solution: 'Piano est une nuance : elle demande de jouer doucement. Elle règle le volume, pas la vitesse ni la hauteur.'
- id: nuance-tres-fort
  type: texte_court
  difficulte: 2
  enonce: Quelle nuance signifie « très fort » ? Donne son nom italien ou son abréviation.
  reponse:
    acceptees:
    - fortissimo
    - ff
    fautes_tolerees: 1
  indices:
    relance: Regarde la liste des nuances de ta leçon, du plus doux au plus fort. Laquelle est tout au bout ?
    methode: On double la lettre de « forte » pour dire « très forte ».
    etape: Le nom se termine par « -issimo », comme « pianissimo ».
  pieges:
  - si:
      valeur: forte
    relance: Forte veut dire simplement « fort ». Il en existe une plus forte encore. Laquelle ?
  - si:
      valeur: f
    relance: La lettre seule note forte. Pour « très fort », que fait-on à la lettre ?
  solution: Fortissimo, noté ff, signifie « très fort ».
