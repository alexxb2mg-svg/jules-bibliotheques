# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: presenter-justifier-choix
version: 2
etat: verifiee
declencheurs:
- expliquer nos choix
- pourquoi on a choisi ce tempo
- présenter notre version
- effet recherché
- défendre mon avis sur une œuvre
- donner un argument
- répondre à une objection
- présenter à la classe
prerequis:
- 4e-echanger-partager-argumenter-debattre
- echanger-partager-argumenter-debattre
- dynamique
essentiel: 'Présenter un choix, c''est dire ce qu''on a décidé. Le justifier, c''est expliquer pourquoi, en nommant l''effet
  que l''on veut produire sur l''auditeur.


  Une justification suit un schéma simple : le choix, puis l''effet recherché, puis si possible un exemple précis. Par exemple
  : « Nous chantons le premier couplet pianissimo (choix) pour créer une ambiance intime (effet), comme un secret que l''on
  confie (image). » On s''aide de connecteurs : parce que, pour que, afin de, c''est pourquoi.


  Les choix d''interprétation portent sur le tempo, les nuances, le timbre (quelles voix, quels instruments), la répartition
  entre soliste et tutti, l''articulation. Les choix de création portent en plus sur la forme, les procédés (ostinato, canon),
  la référence à une œuvre ou à un style.


  Justifier un avis sur une œuvre, c''est l''appuyer sur ce qu''on entend, et non sur la célébrité de l''œuvre ou sur ses
  habitudes. On peut aimer ou ne pas aimer, mais on dit pourquoi : « Le Boléro de Ravel me captive parce que la même mélodie
  revient avec des instruments toujours différents et que le volume grandit jusqu''à la fin. »


  Défendre un point de vue dans un débat, c''est donner des arguments, écouter ceux des autres et répondre à une objection,
  sans jamais critiquer les personnes.


  Une présentation orale suit un plan : annoncer l''œuvre (titre, auteur, style ou époque), présenter les choix, expliquer
  l''effet recherché, puis conclure. On parle clairement, sans lire, en regardant le public.


  Avis et argument ne sont pas la même chose. « C''est beau » est un avis. « Le volume grandit peu à peu, ce qui crée de la
  tension » est un argument, car il s''appuie sur ce qu''on entend. Un point de vue défendu se compose d''un avis et d''au
  moins un argument.


  Ce qu''on attend en évaluation : des phrases construites, un vocabulaire musical précis, un exemple pris dans la pièce,
  et un respect des avis différents.

  '
methode:
- Nommer le choix précisément, avec le vocabulaire musical (tempo, nuance, timbre, forme…).
- Expliquer l'effet recherché sur l'auditeur (« pour que… », « afin de… »).
- Appuyer l'explication sur un moment précis de la pièce ou sur une œuvre de référence.
- 'Pour un avis sur une œuvre : dire ce qu''on pense, puis le justifier par un élément entendu.'
- 'Dans un débat : écouter l''objection, la reformuler, puis y répondre par un argument.'
vocabulaire:
- terme: justifier
  definition: expliquer la raison d'un choix ou d'un avis, en s'appuyant sur des éléments précis
- terme: effet recherché
  definition: 'impression que l''on veut produire chez l''auditeur : calme, tension, surprise, joie…'
- terme: argument
  definition: raison précise qui appuie un avis ; en musique, elle s'appuie sur ce qu'on entend
- terme: decrescendo
  definition: diminution progressive de l'intensité du son (on dit aussi diminuendo)
- terme: objection
  definition: argument opposé à celui qu'on défend, auquel on doit répondre
- terme: avis
  definition: 'ce qu''on pense d''une œuvre : on aime ou on n''aime pas'
- terme: point de vue
  definition: position qu'on défend en l'appuyant sur des arguments
- terme: connecteur
  definition: 'petit mot qui relie deux idées : parce que, pour que, afin de, c''est pourquoi'
erreurs_frequentes:
- Décrire son choix sans dire pourquoi (« on a chanté fort à la fin »).
- Justifier par le goût seulement (« parce qu'on aime bien ») au lieu de l'effet recherché.
- Donner un avis sur une œuvre en s'appuyant sur sa célébrité plutôt que sur ce qu'on entend.
- 'Confondre avis et argument : « c''est beau » est un avis, pas une justification.'
- Dans un débat, ignorer ou moquer l'avis des autres au lieu d'y répondre.
exemple:
  enonce: Ta classe a choisi de ralentir le tempo sur les dernières mesures de son chant. Présente et justifie ce choix.
  solution: 'Nous avons choisi de ralentir le tempo sur les dernières mesures. Ce ralentissement annonce clairement la fin
    au public et donne une impression d''apaisement, pour que la chanson se termine en douceur. Nous l''avons associé à un
    decrescendo : le son diminue en même temps que le tempo, comme une lumière qui s''éteint.'
exercices:
- id: phrase-justifiee
  type: choix
  difficulte: 1
  enonce: Quelle phrase présente et justifie un choix d'interprétation ?
  reponse:
    options:
    - id: a
      texte: Nous chantons le dernier refrain forte
    - id: b
      texte: Nous chantons le dernier refrain forte pour donner une impression de fête finale
    - id: c
      texte: Nous chantons le dernier refrain forte parce qu'on aime bien
    - id: d
      texte: Le dernier refrain est le meilleur moment de la chanson
    bonnes:
    - b
  indices:
    relance: Quelle phrase dit à la fois ce qui est fait et l'impression que cela doit produire sur le public ?
    methode: Une justification contient le choix et l'effet recherché. Cherche la phrase qui explique l'effet sur l'auditeur.
    etape: Élimine la phrase sans explication et celle qui ne parle que de goût. Laquelle parle d'une impression pour le public
      ?
  pieges:
  - si:
      contient:
      - a
    relance: Cette phrase présente le choix, mais explique-t-elle pourquoi ?
  - si:
      contient:
      - c
    relance: « On aime bien » est un goût, pas une justification. Quelle phrase nomme un effet sur le public ?
  - si:
      contient:
      - d
    relance: C'est un avis, mais il ne présente aucun choix d'interprétation. Laquelle dit ce qu'on fait et pourquoi ?
  solution: '« Nous chantons le dernier refrain forte pour donner une impression de fête finale » : la phrase présente le
    choix (forte) et l''effet recherché (la fête).'
- id: choix-effet
  type: association
  difficulte: 2
  enonce: Relie chaque choix d'interprétation à l'effet qu'il cherche à produire.
  reponse:
    gauche:
    - id: ralentir
      texte: Ralentir le tempo sur les dernières mesures
    - id: soliste-tutti
      texte: Un soliste chante le couplet, tout le groupe reprend le refrain
    - id: pianissimo
      texte: Chanter le premier couplet pianissimo
    - id: percussions
      texte: Ajouter un ostinato de percussions corporelles
    droite:
    - id: conclusion
      texte: Annoncer la fin et donner une impression d'apaisement
    - id: contraste
      texte: Créer un contraste qui met le refrain en valeur
    - id: intime
      texte: Créer une ambiance intime et mystérieuse
    - id: energie
      texte: Renforcer la pulsation et l'énergie
    paires:
      ralentir: conclusion
      soliste-tutti: contraste
      pianissimo: intime
      percussions: energie
  indices:
    relance: Lequel de ces choix concerne la vitesse ? Lequel concerne le nombre de chanteurs ?
    methode: Pour chaque choix, imagine ce que ressent le public en l'entendant, puis cherche l'effet qui correspond.
    etape: Chanter très doucement donne l'impression qu'on confie un secret. Quel effet correspond ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux choix qui concernent le nombre de chanteurs et la vitesse.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends un choix à la fois : vitesse, nombre de chanteurs, intensité, rythme. Quel effet produit chacun ?'
  solution: 'Ralentir à la fin : annoncer la conclusion et apaiser. Soliste puis tutti : contraste qui met le refrain en valeur.
    Pianissimo : ambiance intime. Ostinato de percussions : pulsation et énergie.'
- id: mot-decrescendo
  type: texte_court
  difficulte: 2
  enonce: 'Tu justifies : « Nous avons choisi de chanter de plus en plus doucement à la fin, pour que la chanson s''éteigne
    peu à peu. » Quel mot italien désigne cette diminution progressive de l''intensité ?'
  reponse:
    acceptees:
    - decrescendo
    - diminuendo
    fautes_tolerees: 1
  indices:
    relance: C'est le contraire du mot qui désigne un son de plus en plus fort.
    methode: Cherche dans le vocabulaire des nuances le mot formé avec le préfixe « de- », qui veut dire l'inverse.
    etape: Sur une partition, on le dessine comme un angle qui se referme vers la droite. Le mot commence par « decr- ».
  pieges:
  - si:
      valeur: crescendo
    relance: 'C''est le contraire : ici, le son diminue. Quel mot italien convient ?'
  - si:
      valeur: piano
    relance: Piano veut dire « doux », d'un coup. On cherche le mot pour un son qui devient doux peu à peu.
  - si:
      valeur: ralenti
    relance: Ralentir concerne la vitesse. On cherche le mot pour une intensité qui diminue.
  solution: 'Decrescendo (on dit aussi diminuendo) : l''intensité diminue progressivement.'
- id: avis-argumente
  type: choix
  difficulte: 2
  enonce: Voici des avis sur le Boléro de Ravel (1928). Lesquels sont des avis argumentés, appuyés sur l'écoute ? (plusieurs
    réponses)
  reponse:
    options:
    - id: a
      texte: Il me captive car la même mélodie revient avec des instruments toujours différents et le volume grandit jusqu'à
        la fin
    - id: b
      texte: Il me lasse un peu car la caisse claire répète le même rythme pendant tout le morceau, sans changement de tempo
    - id: c
      texte: Il est forcément bien puisque tout le monde le connaît
    - id: d
      texte: Je ne l'aime pas, c'est comme ça
    bonnes:
    - a
    - b
  indices:
    relance: Un avis argumenté peut-il être négatif ? Qu'est-ce qui le rend argumenté ?
    methode: 'Garde les avis qui citent un élément qu''on entend réellement dans l''œuvre : instrument, rythme, tempo, nuance.'
    etape: La célébrité et le « c'est comme ça » ne décrivent rien de ce qu'on entend. Que reste-t-il ?
  pieges:
  - si:
      contient:
      - c
    relance: La célébrité d'une œuvre ne dit rien de ce qu'on entend. Quels avis citent des éléments musicaux ?
  - si:
      contient:
      - d
    relance: Tu as le droit de ne pas aimer, mais cet avis ne donne aucune raison. Lesquels en donnent une ?
  - si:
      diagnostic: incomplet
    relance: Il y a un autre avis argumenté, même s'il n'est pas enthousiaste. Relis-les tous.
  solution: Les deux avis argumentés sont celui qui parle de la mélodie, des instruments et du volume, et celui qui parle
    de la caisse claire et du tempo. Un avis négatif peut être argumenté s'il s'appuie sur l'écoute.
- id: etapes-presentation
  type: ordre
  difficulte: 2
  enonce: Ta classe présente son projet au concert de fin d'année. Range les étapes de la présentation dans l'ordre.
  reponse:
    elements:
    - id: annoncer
      texte: 'Annoncer l''œuvre : titre, auteur, époque ou style'
    - id: choix
      texte: Présenter les choix d'interprétation
    - id: effet
      texte: Expliquer l'effet recherché par ces choix
    - id: interpreter
      texte: Interpréter la pièce
    - id: questions
      texte: Répondre aux questions du public
  indices:
    relance: Le public doit-il savoir ce qu'il va écouter avant ou après avoir entendu la pièce ?
    methode: D'abord ce qu'on va jouer, puis ce qu'on a décidé et pourquoi, ensuite on joue, enfin on échange avec le public.
    etape: On commence par annoncer l'œuvre. Peut-on expliquer l'effet d'un choix avant de l'avoir présenté ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle a besoin de l'autre pour être comprise ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pense au public : il découvre l''œuvre, comprend vos choix, écoute, puis pose ses questions.'
  solution: Annoncer l'œuvre, présenter les choix, expliquer l'effet recherché, interpréter la pièce, répondre aux questions.
- id: defendre-version
  type: ouverte
  difficulte: 3
  enonce: 'Pour le concert, ta classe hésite entre deux versions (imaginaires) d''un même chant. Version A : tempo lent, voix
    seules a cappella, nuances douces. Version B : tempo rapide, accompagnement de percussions corporelles, dernier refrain
    forte en tutti. Choisis une version et défends ton choix devant la classe.'
  criteres:
  - L'élève annonce clairement la version choisie.
  - L'élève donne au moins deux arguments qui relient un choix musical (tempo, timbre, nuances, tutti) à un effet sur le public.
  - L'élève répond à une objection en faveur de l'autre version, sans critiquer les personnes.
  indices:
    relance: Quelle impression veux-tu laisser au public à la fin du concert ?
    methode: Annonce ton choix, donne deux arguments avec « pour que » ou « parce que », puis réponds à ce que dirait un défenseur
      de l'autre version.
    etape: 'Tu peux commencer ainsi : « Je propose la version… parce que son tempo… ».'
  solution: Je propose la version B, parce que son tempo rapide et les percussions corporelles donnent de l'énergie, ce qui
    convient à un concert de fin d'année. Le dernier refrain forte en tutti réunit toute la classe et laisse au public une
    impression de fête. On peut objecter que la version A, a cappella, met mieux en valeur la justesse des voix ; c'est vrai,
    mais nous pourrions garder un couplet a cappella au début de la version B pour créer un contraste.
- id: nblm-selon-la-fiche-de-revision-que-signifie-1
  type: choix
  difficulte: 2
  enonce: Selon la fiche de révision, que signifie exactement « justifier » un choix musical ?
  reponse:
    options:
    - id: o1
      texte: Expliquer la raison de ce choix en nommant l'effet recherché sur l'auditeur.
    - id: o2
      texte: Dire seulement ce que l'on a décidé de faire dans le morceau.
    - id: o3
      texte: Affirmer que le choix est bon parce que la chanson est très célèbre.
    - id: o4
      texte: Dire simplement « parce qu'on aime bien » cette façon de jouer.
    bonnes:
    - o1
  indices:
    relance: Pense au lien entre ce que l'on décide de faire et ce que l'auditeur doit ressentir.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : décrire son choix n''est que la première étape, cela ne dit pas pourquoi on l''a
      fait.'
  - si:
      contient:
      - o3
    relance: S'appuyer sur la célébrité d'une œuvre au lieu d'expliquer l'effet musical est un piège classique.
  - si:
      contient:
      - o4
    relance: Justifier par le simple goût personnel n'explique pas l'effet recherché ni la raison musicale du choix.
  solution: 'Expliquer la raison de ce choix en nommant l''effet recherché sur l''auditeur. C''est la définition exacte :
    justifier un choix consiste à expliquer pourquoi on l''a fait et quel effet on souhaite produire sur le public.'
- id: nblm-lorsqu-on-presente-notre-version-d-un-ch-2
  type: choix
  difficulte: 2
  enonce: Lorsqu'on présente notre version d'un chant, pourquoi choisir de ralentir le tempo sur les dernières mesures ?
  reponse:
    options:
    - id: o1
      texte: Pour annoncer clairement la fin au public et créer une impression d'apaisement.
    - id: o2
      texte: Pour cacher le fait que les chanteurs manquent de souffle en fin de morceau.
    - id: o3
      texte: Parce que ralentir le tempo permet de chanter plus fort automatiquement.
    - id: o4
      texte: Pour imiter un enregistrement sans chercher à produire un effet particulier.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au signal donné à l'auditeur au moment où la chanson se termine.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un choix d'interprétation est une décision artistique réfléchie, pas la conséquence d'un problème technique.
  - si:
      contient:
      - o3
    relance: Attention à ne pas confondre le tempo (vitesse de la musique) et la nuance (volume du son).
  - si:
      contient:
      - o4
    relance: Une vraie justification explique l'intention expressive recherchée chez l'auditeur, et non une simple copie.
  solution: Pour annoncer clairement la fin au public et créer une impression d'apaisement. Le ralentissement du tempo informe
    l'auditeur de la fin du morceau et procure une sensation de douceur et d'apaisement.
- id: nblm-sur-quels-elements-precis-portent-les-ch-3
  type: choix
  difficulte: 2
  enonce: Sur quels éléments précis portent les choix d'interprétation quand un groupe doit présenter sa version d'un morceau
    ?
  reponse:
    options:
    - id: o1
      texte: Le tempo, les nuances, le timbre, la répartition soliste/tutti et l'articulation.
    - id: o2
      texte: Le style de vêtements des musiciens et le décor de la scène.
    - id: o3
      texte: Le prix des instruments de musique et le matériel d'amplification.
    - id: o4
      texte: Le nombre de vues obtenues par la vidéo originale sur internet.
    bonnes:
    - o1
  indices:
    relance: Concentre-toi sur les paramètres musicaux qui modifient directement le rendu sonore.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Ces éléments visuels ne constituent pas des choix d'interprétation musicale de l'œuvre.
  - si:
      contient:
      - o3
    relance: Le coût du matériel n'est pas un paramètre musical d'interprétation.
  - si:
      contient:
      - o4
    relance: La popularité en ligne est un indicateur externe et non un paramètre d'interprétation musicale.
  solution: Le tempo, les nuances, le timbre, la répartition soliste/tutti et l'articulation. Ces éléments sont précisément
    les paramètres d'interprétation sur lesquels les musiciens agissent pour personnaliser leur version.
- id: nblm-comment-devez-vous-defendre-votre-avis-s-4
  type: choix
  difficulte: 2
  enonce: Comment devez-vous défendre votre avis sur une œuvre musicale lors d'un travail d'écoute ?
  reponse:
    options:
    - id: o1
      texte: En appuyant son avis sur ce que l'on entend (instruments, nuances, variations de tempo).
    - id: o2
      texte: En affirmant simplement « c'est beau » sans apporter d'explication.
    - id: o3
      texte: En utilisant la notoriété ou la célébrité de l'œuvre comme unique preuve.
    - id: o4
      texte: En critiquant les goûts personnels des autres élèves de la classe.
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments concrètement perceptibles lors de l'écoute du morceau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Exprimer un jugement de valeur sans explication est une opinion subjective, pas une justification.
  - si:
      contient:
      - o3
    relance: La célébrité d'un morceau ne prouve pas sa qualité ni ne remplace l'analyse de ce qu'on entend.
  - si:
      contient:
      - o4
    relance: Il faut analyser la musique et non juger ou critiquer les personnes.
  solution: En appuyant son avis sur ce que l'on entend (instruments, nuances, variations de tempo). Un avis argumenté repose
    toujours sur des éléments musicaux précis et objectivement audibles.
- id: nblm-pendant-un-debat-en-classe-pour-explique-5
  type: choix
  difficulte: 2
  enonce: Pendant un débat en classe pour expliquer nos choix, quelle est la méthode correcte pour répondre à une objection
    ?
  reponse:
    options:
    - id: o1
      texte: Écouter l'objection, la reformuler, puis y répondre avec un argument musical.
    - id: o2
      texte: Ignorer la remarque de l'autre élève et répéter son choix plus fort.
    - id: o3
      texte: Se moquer de l'avis opposé pour imposer sa décision au groupe.
    - id: o4
      texte: Changer d'avis immédiatement sans chercher à débattre.
    bonnes:
    - o1
  indices:
    relance: Pense à une attitude d'échange respectueuse et fondée sur l'argumentation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Ignorer un interlocuteur empêche tout débat constructif et n'apporte aucun argument.
  - si:
      contient:
      - o3
    relance: Moquer l'avis d'autrui contredit l'exigence d'un débat respectueux centré sur la musique.
  - si:
      contient:
      - o4
    relance: Abandonner sa position sans échanger prive le groupe d'une réelle argumentation musicale.
  solution: Écouter l'objection, la reformuler, puis y répondre avec un argument musical. C'est la méthode de débat recommandée
    pour échanger de manière constructive sans attaque personnelle.
- id: nblm-quels-sont-les-deux-connecteurs-logiques-6
  type: choix
  difficulte: 3
  enonce: Quels sont les DEUX connecteurs logiques adaptés pour exprimer l'effet recherché quand on explique nos choix ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: pour que
    - id: o2
      texte: afin de
    - id: o3
      texte: malgré que
    - id: o4
      texte: sans que
    bonnes:
    - o1
    - o2
  indices:
    relance: Repère les mots qui servent à indiquer une intention ou un objectif précis.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Ce connecteur n'exprime ni l'intention ni la justification d'un effet recherché.
  - si:
      contient:
      - o4
    relance: Ce connecteur n'est pas adapté pour expliquer l'objectif ou l'intention d'un choix artistique.
  solution: pour que ; afin de. Ce connecteur permet d'introduire l'intention et l'effet souhaité sur l'auditeur.
- id: nblm-pour-justifier-un-choix-musical-l-impres-7
  type: texte_court
  difficulte: 1
  enonce: Pour justifier un choix musical, l'impression précise que l'on souhaite produire chez l'auditeur s'appelle l'_____.
  reponse:
    acceptees:
    - effet recherché
    fautes_tolerees: 1
  indices:
    relance: Expression de deux mots désignant l'impression visée sur le public.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: effet recherché. L'effet recherché désigne l'impression (calme, tension, surprise) que l'on cherche à créer chez
    l'auditeur.
- id: nblm-pour-defendre-son-point-de-vue-sur-une-u-8
  type: texte_court
  difficulte: 1
  enonce: Pour défendre son point de vue sur une œuvre, une raison précise qui s'appuie sur ce qu'on entend s'appelle un _____.
  reponse:
    acceptees:
    - argument
    fautes_tolerees: 1
  indices:
    relance: Terme au masculin singulier désignant une preuve tirée de l'écoute musicale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: argument. Un argument est une raison précise fondée sur des éléments audibles qui permet de justifier un avis.
- id: repondre-objection
  type: choix
  difficulte: 2
  enonce: 'Pendant le débat, un camarade objecte : « Ta version est trop lente. » Quelle est la meilleure réponse ?'
  reponse:
    options:
    - id: a
      texte: Tu n'y connais rien à la musique.
    - id: b
      texte: Je comprends ton objection, mais le tempo lent laisse le temps de bien entendre les paroles.
    - id: c
      texte: Je ne réponds pas.
    - id: d
      texte: On change de sujet.
    bonnes:
    - b
  indices:
    relance: 'Que doit-on faire d''une objection dans un débat : l''ignorer ou y répondre ?'
    methode: Reformule l'objection, puis réponds par un argument musical, sans critiquer la personne.
    etape: Cherche la réponse qui reconnaît l'objection et donne une raison.
  pieges:
  - si:
      contient:
      - a
    relance: Critiquer la personne ne répond pas à son argument. Quelle réponse respecte l'autre et argumente ?
  - si:
      contient:
      - c
    relance: Ne pas répondre laisse l'objection sans réponse. Quelle réponse donne une raison ?
  - si:
      contient:
      - d
    relance: Changer de sujet évite le débat. Quelle réponse traite l'objection ?
  solution: On reformule l'objection puis on répond par un argument appuyé sur la musique, sans attaquer la personne.
- id: mot-argument
  type: texte_court
  difficulte: 1
  enonce: Dans « Le volume grandit peu à peu, ce qui crée de la tension », la deuxième partie de la phrase donne la raison
    de l'avis. Comment s'appelle une raison qui appuie un avis ?
  reponse:
    acceptees:
    - argument
    - un argument
    - justification
    fautes_tolerees: 1
  indices:
    relance: Un avis dit ce qu'on pense. Comment nomme-t-on ce qui explique pourquoi on le pense ?
    methode: Le mot commence par « arg- » et désigne une raison donnée pour convaincre.
    etape: Le mot a sept lettres et se termine par « -ment ».
  pieges:
  - si:
      valeur: avis
    relance: L'avis est ce qu'on pense. On cherche ce qui explique pourquoi on le pense.
  solution: Une raison appuyée sur ce qu'on entend est un argument.
