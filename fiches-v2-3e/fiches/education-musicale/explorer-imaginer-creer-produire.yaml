# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: explorer-imaginer-creer-produire
version: 1
etat: verifiee
declencheurs:
- faire un pastiche
- à la manière de
- arranger un morceau
- logiciel de musique assistée
- boucle sonore
- paysage sonore
prerequis:
- 4e-explorer-imaginer-creer-produire
- apports-numerique-creation-diffusion
couverture: Couvre la réutilisation des caractéristiques d'une œuvre, l'arrangement et le pastiche d'une courte pièce, l'usage
  d'outils numériques simples et le commentaire des créations des autres. Le détail technique d'un logiciel précis n'est pas
  traité.
essentiel: 'Créer en musique, ce n''est pas toujours partir de rien. On peut s''appuyer sur une œuvre connue et en réutiliser
  certaines caractéristiques : un style, un procédé (un ostinato, un canon), un instrument, une façon d''organiser le morceau.


  Arranger, c''est adapter une pièce qui existe déjà : changer les instruments, le style, le tempo ou l''accompagnement. Ravel
  a ainsi orchestré en 1922 les Tableaux d''une exposition, écrits pour piano par Moussorgsky en 1874. Serge Gainsbourg a
  enregistré en 1979 une version reggae de La Marseillaise.


  Pasticher, c''est écrire une pièce nouvelle « à la manière de » un compositeur ou d''un style. Prokofiev a composé sa Symphonie
  n° 1, dite « Classique » (1917), à la manière de Haydn.


  Les outils numériques aident à créer : un enregistreur pour capter des sons, un logiciel de musique assistée par ordinateur
  pour superposer des pistes, découper, répéter un motif en boucle, ajouter des effets. Pierre Schaeffer a composé dès 1948
  des pièces avec des bruits enregistrés, comme l''Étude aux chemins de fer.


  Enfin, avoir créé soi-même aide à écouter les créations des autres : on repère plus facilement les procédés utilisés et
  on peut les commenter avec précision.

  '
methode:
- Écouter l'œuvre de départ et repérer ce qu'on veut réutiliser (style, procédé, instruments, forme).
- 'Choisir ce qu''on garde et ce qu''on change : un arrangement garde la mélodie, un pastiche garde seulement la manière.'
- Explorer des sons et des idées, en improvisant ou en enregistrant.
- 'Organiser les idées sur une ligne du temps ou dans un logiciel : superposer, enchaîner, répéter.'
- Écouter le résultat, l'améliorer, puis le présenter en citant l'œuvre de référence.
vocabulaire:
- terme: arrangement
  definition: adaptation d'une œuvre existante pour d'autres instruments, un autre style ou un autre effectif
- terme: pastiche
  definition: œuvre nouvelle écrite à la manière d'un compositeur ou d'un style, sans en recopier les notes
- terme: boucle
  definition: court motif enregistré qui se répète automatiquement dans un logiciel
- terme: piste
  definition: dans un logiciel, une ligne qui contient un son ou un instrument ; on superpose plusieurs pistes
- terme: échantillon
  definition: court extrait sonore enregistré que l'on réutilise dans une nouvelle création (en anglais, sample)
erreurs_frequentes:
- 'Confondre pastiche et copie : un pastiche imite une manière, il ne recopie pas les notes.'
- 'Croire qu''un arrangement est une œuvre entièrement nouvelle : la mélodie de départ reste reconnaissable.'
- 'Empiler trop de pistes dans un logiciel : la pièce devient confuse et on n''entend plus l''idée principale.'
- Oublier de citer l'œuvre de départ quand on présente son travail.
- Commenter la création d'un autre groupe avec des mots vagues au lieu de nommer les procédés entendus.
exemple:
  enonce: Ton groupe veut réaliser un court pastiche du Boléro de Ravel (1928). Que peux-tu réutiliser, sans recopier l'œuvre
    ?
  solution: 'On peut reprendre la manière du Boléro : un ostinato rythmique joué du début à la fin sur un tempo constant,
    une mélodie nouvelle, que l''on invente, confiée à un instrument ou une voix différente à chaque reprise, et un long crescendo
    où l''on ajoute peu à peu des pistes jusqu''à la fin. On présente ensuite la pièce en disant qu''elle est écrite « à la
    manière du Boléro de Ravel ».'
exercices:
- id: mot-pastiche
  type: texte_court
  difficulte: 1
  enonce: Prokofiev a écrit sa Symphonie n° 1 (1917) en imitant la manière de Haydn, sans recopier ses notes. Comment appelle-t-on
    une œuvre nouvelle écrite ainsi « à la manière de » ?
  reponse:
    acceptees:
    - pastiche
    fautes_tolerees: 1
  indices:
    relance: Ce n'est ni une copie ni une simple reprise. Quel mot désigne une imitation de style ?
    methode: 'Relis le vocabulaire : un mot désigne une création nouvelle qui imite la manière d''un auteur. On l''emploie
      aussi en littérature.'
    etape: Le mot commence par « pas- » et compte huit lettres.
  pieges:
  - si:
      valeur: plagiat
    relance: Un plagiat recopie l'œuvre d'un autre en la faisant passer pour sienne. Ici, Prokofiev invente ses propres notes.
      Quel mot convient ?
  - si:
      valeur: reprise
    relance: Une reprise rejoue une œuvre existante. Ici, l'œuvre est nouvelle, seule la manière est imitée.
  - si:
      valeur: arrangement
    relance: Un arrangement garde la mélodie de départ. Ici, Prokofiev écrit des mélodies nouvelles à la manière de Haydn.
  solution: 'C''est un pastiche : une œuvre nouvelle qui imite la manière d''un compositeur ou d''un style, sans en recopier
    les notes.'
- id: mot-arrangement
  type: texte_court
  difficulte: 2
  enonce: En 1922, Ravel a repris les Tableaux d'une exposition, écrits pour piano par Moussorgsky, pour les faire jouer par
    un orchestre, en gardant les mélodies. Quel mot désigne une telle adaptation d'une œuvre existante ?
  reponse:
    acceptees:
    - arrangement
    - orchestration
    fautes_tolerees: 1
  indices:
    relance: L'œuvre reste reconnaissable, mais ce ne sont plus les mêmes instruments. Comment appelle-t-on ce travail d'adaptation
      ?
    methode: Cherche le nom du travail qui consiste à adapter une pièce pour un autre effectif ou un autre style.
    etape: Le verbe correspondant est « arranger ». Quel est le nom ?
  pieges:
  - si:
      valeur: pastiche
    relance: Un pastiche invente des notes nouvelles. Ici, Ravel garde les mélodies de Moussorgsky. Quel mot convient ?
  - si:
      valeur: reprise
    relance: C'est proche, mais on cherche le mot précis pour une adaptation à d'autres instruments.
  solution: 'C''est un arrangement (ici, plus précisément, une orchestration) : Ravel garde les mélodies de Moussorgsky mais
    les confie aux instruments de l''orchestre.'
- id: outils-numeriques
  type: association
  difficulte: 2
  enonce: Relie chaque outil ou fonction numérique à ce qu'il permet de faire dans une création.
  reponse:
    gauche:
    - id: enregistreur
      texte: Un enregistreur
    - id: pistes
      texte: Les pistes d'un logiciel de musique
    - id: boucle
      texte: Une boucle
    - id: reverb
      texte: Un effet de réverbération
    droite:
    - id: capter
      texte: Capter des sons réels, par exemple dans la cour du collège
    - id: superposer
      texte: Superposer plusieurs sons ou instruments en même temps
    - id: repeter
      texte: Répéter automatiquement un court motif
    - id: espace
      texte: Donner l'impression que le son résonne dans un grand lieu
    paires:
      enregistreur: capter
      pistes: superposer
      boucle: repeter
      reverb: espace
  indices:
    relance: Lequel de ces outils sert avant tout à récolter des sons ?
    methode: 'Pense à ce que fait chaque outil : récolter, empiler, répéter, transformer.'
    etape: Une réverbération imite l'écho d'une église ou d'une grande salle. Quelle proposition en parle ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux outils qui servent à organiser les sons dans le logiciel.
  - si:
      diagnostic: associations_fausses
    relance: 'Classe les outils : un sert à récolter, un à empiler, un à répéter, un à transformer l''espace.'
  solution: L'enregistreur capte des sons réels, les pistes permettent de superposer, la boucle répète un motif, la réverbération
    donne l'impression d'un grand lieu.
- id: reutiliser-bolero
  type: choix
  difficulte: 2
  enonce: Ton groupe prépare une pièce « à la manière du Boléro de Ravel ». Quelles caractéristiques de l'œuvre peux-tu réutiliser
    ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Un ostinato rythmique répété du début à la fin
    - id: b
      texte: Un long crescendo où l'on ajoute peu à peu des instruments
    - id: c
      texte: Recopier la mélodie note pour note
    - id: d
      texte: Un tempo qui accélère et ralentit sans cesse
    bonnes:
    - a
    - b
  indices:
    relance: Qu'est-ce qu'on entend du début à la fin du Boléro, et comment le volume évolue-t-il ?
    methode: Un pastiche reprend une manière de faire, pas les notes. Garde les procédés qui caractérisent vraiment le Boléro.
    etape: Dans le Boléro, la caisse claire joue le même rythme tout le long et le tempo ne change pas. Quelles propositions
      correspondent ?
  pieges:
  - si:
      contient:
      - c
    relance: Recopier la mélodie, ce n'est plus créer à la manière de, c'est copier. Que peux-tu reprendre sans copier ?
  - si:
      contient:
      - d
    relance: Dans le Boléro, le tempo reste le même du début à la fin. Qu'est-ce qui change, en revanche ?
  - si:
      diagnostic: incomplet
    relance: Il y a une autre caractéristique du Boléro à réutiliser. Pense à l'évolution du volume sonore.
  solution: On peut réutiliser l'ostinato rythmique (la caisse claire du Boléro) et le long crescendo qui ajoute des instruments.
    Le tempo du Boléro reste constant, et recopier la mélodie serait une copie, pas une création.
- id: etapes-paysage-sonore
  type: ordre
  difficulte: 2
  enonce: Ton groupe crée un paysage sonore sur le thème « le collège s'éveille » avec un logiciel. Range les étapes dans
    l'ordre.
  reponse:
    elements:
    - id: enregistrer
      texte: Enregistrer des sons dans le collège (pas, porte, cloche, voix)
    - id: trier
      texte: Écouter les sons et garder les plus intéressants
    - id: importer
      texte: Importer les sons dans le logiciel et les découper
    - id: organiser
      texte: 'Placer les sons sur les pistes : les superposer et les enchaîner'
    - id: mixer
      texte: Régler le volume de chaque piste et ajouter des effets
    - id: exporter
      texte: Exporter le fichier et le faire écouter à la classe
  indices:
    relance: Sans aucun son, que peut-on faire dans le logiciel ? Par quoi faut-il commencer ?
    methode: 'Suis le chemin du son : il est d''abord récolté, puis choisi, puis placé, puis réglé, puis diffusé.'
    etape: On commence par enregistrer, puis on trie. Que faut-il faire avant de pouvoir placer les sons sur les pistes ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Peut-on régler ou placer un son qui n'est pas encore dans le logiciel
      ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pense au trajet d''un son : du micro jusqu''aux oreilles de la classe.'
  solution: Enregistrer, trier, importer et découper, placer sur les pistes, régler volumes et effets, exporter et faire écouter.
- id: commenter-creation
  type: ouverte
  difficulte: 3
  enonce: 'Un autre groupe présente sa création (imaginaire) : pendant une minute, une boucle de percussions corporelles tourne
    sans arrêt ; une voix chuchote des mots, puis deux autres voix entrent en canon ; tout devient de plus en plus fort, puis
    s''arrête d''un coup. En t''appuyant sur ta propre expérience de création, commente cette pièce.'
  criteres:
  - L'élève nomme au moins deux procédés entendus avec le mot juste (ostinato ou boucle, canon, crescendo, fin brusque).
  - L'élève dit ce qui fonctionne et pourquoi, en parlant de l'effet produit.
  - L'élève propose une amélioration précise, en s'appuyant sur ce qu'il a lui-même expérimenté.
  indices:
    relance: Quels procédés musicaux reconnais-tu dans cette description ?
    methode: Nomme les procédés, dis l'effet qu'ils produisent, puis propose une idée que tu as déjà testée dans ta propre
      création.
    etape: 'Tu peux commencer ainsi : « La boucle de percussions joue le rôle d''un ostinato qui… ».'
  solution: 'La boucle de percussions joue le rôle d''un ostinato : elle donne une pulsation stable à toute la pièce. L''entrée
    des voix en canon crée une superposition de plus en plus riche, et le crescendo fait monter la tension jusqu''à l''arrêt
    brusque, qui surprend. Dans notre création, nous avions varié la boucle au milieu : ce groupe pourrait faire de même pour
    éviter que la minute paraisse répétitive.'
- id: nblm-comment-definit-on-la-demarche-de-faire-1
  type: choix
  difficulte: 2
  enonce: Comment définit-on la démarche de faire un pastiche en création musicale ?
  reponse:
    options:
    - id: o1
      texte: Écrire une pièce nouvelle « à la manière de » un compositeur ou d'un style, sans recopier ses notes.
    - id: o2
      texte: Recopier exactement note pour note une partition existante pour la rejouer.
    - id: o3
      texte: Modifier l'instrumentation et le tempo d'un morceau connu en gardant sa mélodie.
    - id: o4
      texte: Enregistrer uniquement des bruits de la nature sans aucune organisation musicale.
    bonnes:
    - o1
  indices:
    relance: Pense à l'imitation d'un style ou d'un procédé sans emprunter la mélodie originale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : recopier les notes d''une œuvre est un plagiat ou une copie conforme, pas un pastiche.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : adapter un morceau existant en conservant sa mélodie est un arrangement, pas un pastiche.'
  - si:
      contient:
      - o4
    relance: Cela se rapproche de la captation brute pour un paysage sonore, non d'un pastiche stylistique.
  solution: 'Écrire une pièce nouvelle « à la manière de » un compositeur ou d''un style, sans recopier ses notes. C''est
    la définition exacte du pastiche : composer une œuvre originale en imitant le style ou la manière d''un artiste sans reproduire
    ses notes.'
- id: nblm-que-signifie-arranger-un-morceau-deja-ex-2
  type: choix
  difficulte: 2
  enonce: Que signifie arranger un morceau déjà existant ?
  reponse:
    options:
    - id: o1
      texte: Adapter une pièce existante en modifiant par exemple ses instruments, son style ou son tempo.
    - id: o2
      texte: Composer une mélodie entièrement nouvelle qui n'a aucun lien avec l'œuvre originale.
    - id: o3
      texte: Imiter le style d'un compositeur sans jamais utiliser sa mélodie.
    - id: o4
      texte: Supprimer la musique pour ne garder que le texte parlé de la chanson.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux modifications qu'on apporte à une musique existante tout en gardant sa mélodie reconnaissable.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : créer une mélodie totalement inédite est une composition originale, pas un arrangement.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : imiter le style sans reprendre la mélodie est un pastiche.'
  - si:
      contient:
      - o4
    relance: Un arrangement transforme les éléments musicaux (instruments, style, tempo) tout en maintenant l'identité de
      la pièce.
  solution: Adapter une pièce existante en modifiant par exemple ses instruments, son style ou son tempo. Un arrangement consiste
    à transformer une œuvre existante (changement de timbre, de tempo ou de style) tout en conservant la mélodie de départ.
- id: nblm-quel-est-le-role-principal-d-un-logiciel-3
  type: choix
  difficulte: 2
  enonce: Quel est le rôle principal d'un logiciel de musique assistée par ordinateur (MAO) dans le processus créatif ?
  reponse:
    options:
    - id: o1
      texte: Permettre de capter des sons, les manipuler avec des effets et les organiser sur des pistes dans le temps.
    - id: o2
      texte: Remplacer totalement l'élève en créant le morceau à sa place sans aucune consigne.
    - id: o3
      texte: Imprimer exclusivement des partitions papier sans permettre d'écouter les sons.
    - id: o4
      texte: Effacer définitivement tout effet sonore pour rendre l'enregistrement inaudible.
    bonnes:
    - o1
  indices:
    relance: 'Rappelle-toi les trois actions clés du travail numérique : capter, manipuler et organiser.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le logiciel est un outil technique au service de l'imagination du créateur ; il n'invente pas la musique à sa
      place.
  - si:
      contient:
      - o3
    relance: La MAO sert à travailler directement sur le son audio et le MIDI, pas uniquement sur l'impression de partitions.
  - si:
      contient:
      - o4
    relance: La MAO permet au contraire d'ajouter des effets (écho, réverbération, égaliseur) pour sculpter le son.
  solution: 'Permettre de capter des sons, les manipuler avec des effets et les organiser sur des pistes dans le temps. La
    MAO offre des outils complets pour structurer une création : enregistrement, transformation du timbre et arrangement temporel
    sur un séquenceur.'
- id: nblm-en-creation-musicale-numerique-qu-est-ce-4
  type: choix
  difficulte: 2
  enonce: En création musicale numérique, qu'est-ce qu'une boucle sonore ?
  reponse:
    options:
    - id: o1
      texte: Un court motif enregistré qui se répète automatiquement dans un logiciel.
    - id: o2
      texte: Un défaut d'enregistrement qui rend le son grésillant et inexploitable.
    - id: o3
      texte: Un instrument à cordes frottées très populaire à l'époque baroque.
    - id: o4
      texte: Un morceau de musique entier écouté une seule fois du début à la fin.
    bonnes:
    - o1
  indices:
    relance: Pense à la répétition automatique d'un court extrait audio dans un séquenceur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La boucle est un procédé de répétition intentionnel utilisé en composition, pas un bug ou un défaut audio.
  - si:
      contient:
      - o3
    relance: La boucle sonore est un concept de musique numérique et non un instrument traditionnel.
  - si:
      contient:
      - o4
    relance: Une boucle ne concerne qu'un extrait court répété, et non une œuvre entière lue une seule fois.
  solution: 'Un court motif enregistré qui se répète automatiquement dans un logiciel. C''est la définition exacte de la boucle
    (loop) : un motif audio ou rythmique répété de manière continue sur une piste.'
- id: nblm-en-quoi-consiste-la-creation-d-un-paysag-5
  type: choix
  difficulte: 2
  enonce: En quoi consiste la création d'un paysage sonore à partir de bruits enregistrés ?
  reponse:
    options:
    - id: o1
      texte: À capter, assembler et transformer des bruits de l'environnement pour composer une pièce ou une ambiance.
    - id: o2
      texte: À chanter un hymne classique a cappella sans aucun accompagnement ni effet.
    - id: o3
      texte: À recopier une symphonie du XVIIIe siècle pour orchestre d'harmonie.
    - id: o4
      texte: À couper complètement le son de tous les microphones lors d'une séance d'enregistrement.
    bonnes:
    - o1
  indices:
    relance: Pense aux pionniers de la musique concrète qui utilisaient des bruits captés sur le terrain (comme les trains).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un chant a cappella est une interprétation vocale, pas un paysage sonore bâti sur des bruits environnementaux.
  - si:
      contient:
      - o3
    relance: Il s'agit d'une interprétation ou copie d'une œuvre écrite, pas de la confection d'un paysage sonore.
  - si:
      contient:
      - o4
    relance: Sans captation ni matière sonore, il est impossible d'élaborer une création audio.
  solution: À capter, assembler et transformer des bruits de l'environnement pour composer une pièce ou une ambiance. Comme
    dans la musique concrète de Pierre Schaeffer, enregistrer et agencer des bruits du quotidien permet de créer un paysage
    sonore.
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations exactes concernant la réalisation d'un morceau « à la manière de » un compositeur
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: On réutilise les procédés et le style caractéristiques de la référence sans recopier la mélodie.
    - id: o2
      texte: On cite l'œuvre ou l'artiste de référence lors de la présentation de sa création.
    - id: o3
      texte: On doit obligatoirement recopier la mélodie originale note pour note.
    - id: o4
      texte: L'utilisation d'un logiciel de musique assistée par ordinateur est strictly interdite pour ce type de projet.
    bonnes:
    - o1
    - o2
  indices:
    relance: Concentre-toi sur l'absence de plagiat mélodique et sur l'obligation de mentionner l'œuvre qui a servi de modèle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : recopier la mélodie est une copie ou un plagiat, alors que le pastiche invente une nouvelle
      musique.'
  - si:
      contient:
      - o4
    relance: Un pastiche peut être réalisé aussi bien avec des instruments acoustiques qu'avec des outils numériques de MAO.
  solution: 'On réutilise les procédés et le style caractéristiques de la référence sans recopier la mélodie ; On cite l''œuvre
    ou l''artiste de référence lors de la présentation de sa création. C''est le principe fondamental du pastiche : s''inspirer
    d''une manière de composer sans plagier les notes.'
- id: nblm-lorsqu-un-eleve-ecrit-une-piece-original-7
