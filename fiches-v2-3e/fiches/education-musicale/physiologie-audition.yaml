format: 2
notion: physiologie-audition
version: 2
etat: verifiee
declencheurs:
- risques pour l'audition en concert
- protections auditives
- bouchons d'oreilles
- sifflements après un concert
- casque audio trop fort
- seuil de danger sonore
- son trop fort
- écouteurs à fond
- bruit et santé
- perte d'audition
prerequis:
- 4e-physiologie-audition
essentiel: 'Comment on entend :

  - L''oreille externe (le pavillon et le conduit auditif) capte le son et le dirige vers le tympan.

  - L''oreille moyenne : le tympan, une fine membrane, se met à vibrer ; trois minuscules os, les osselets (marteau, enclume,
  étrier), transmettent et amplifient ces vibrations.

  - L''oreille interne : dans la cochlée, des cellules ciliées transforment les vibrations en message nerveux.

  - Le nerf auditif porte ce message au cerveau, qui l''interprète : c''est lui qui « entend ».

  Les cellules ciliées abîmées ne se réparent pas : une perte d''audition causée par le bruit est définitive.


  L''intensité d''un son se mesure en décibels (dB) avec un sonomètre. Quelques repères : 0 dB, seuil d''audibilité ; environ
  60 dB, une conversation ; 85 dB, seuil de danger ; environ 120 dB, seuil de douleur. Un concert amplifié atteint souvent
  100 dB environ.


  Le risque dépend du niveau ET de la durée. Chaque fois que le niveau augmente de 3 dB, l''énergie sonore double, et le temps
  d''écoute sans risque est divisé par deux. Repère : 8 heures à 85 dB.


  Les signes d''alerte sont des sifflements ou bourdonnements (acouphènes) et l''impression d''oreilles « cotonneuses ». S''ils
  durent encore le lendemain, il faut consulter un médecin rapidement : c''est une urgence.


  Se protéger : s''éloigner des enceintes, faire des pauses au calme, porter des bouchons d''oreilles, baisser le volume du
  casque (une règle souvent conseillée : pas plus de 60 % du volume maximal) et limiter la durée d''écoute.


  La compression dynamique, souvent utilisée dans la musique enregistrée, réduit l''écart entre les passages doux et forts
  : la musique paraît forte tout le temps, et l''oreille n''a plus de moments de repos.


  Notions d''acoustique. Un son est une vibration qui se propage dans l''air (pas dans le vide). Sa fréquence, en hertz (Hz),
  donne sa hauteur : plus il y a de vibrations par seconde, plus le son est aigu. L''oreille humaine entend environ de 20
  Hz à 20 000 Hz. L''amplitude des vibrations donne l''intensité : plus elle est grande, plus le son est fort.


  Environnement sonore : un bruit fort ou continu (rue, chantier, casque) fatigue, perturbe le sommeil et la concentration,
  et gêne l''apprentissage. Le calme et les pauses font partie de la santé auditive.


  Le mot compression a deux sens. La compression dynamique réduit l''écart entre doux et fort. La compression d''un fichier
  (MP3) l''allège en perdant un peu de qualité.

  '
methode:
- 'Pour décrire l''audition, suivre le trajet du son : oreille externe, oreille moyenne, oreille interne, nerf auditif, cerveau.'
- 'Pour évaluer un risque, regarder deux choses : le niveau en décibels et la durée d''exposition.'
- Pour calculer une durée sans risque, partir de 8 heures à 85 dB et diviser par deux à chaque hausse de 3 dB.
- 'Proposer des protections concrètes : distance, pauses, bouchons, volume, durée.'
vocabulaire:
- terme: décibel (dB)
  definition: unité qui mesure le niveau d'intensité d'un son
- terme: cochlée
  definition: partie de l'oreille interne en forme de coquille d'escargot, où se trouvent les cellules ciliées
- terme: acouphène
  definition: sifflement ou bourdonnement entendu sans qu'aucun son extérieur ne le produise
- terme: sonomètre
  definition: appareil qui mesure le niveau sonore en décibels
- terme: fréquence
  definition: nombre de vibrations d'un son par seconde, qui donne sa hauteur (aigu ou grave)
- terme: hertz (Hz)
  definition: unité de mesure de la fréquence d'un son
- terme: osselets
  definition: les trois petits os de l'oreille moyenne (marteau, enclume, étrier) qui transmettent les vibrations
erreurs_frequentes:
- 'Croire que seul le niveau compte : un son moins fort écouté très longtemps peut aussi être dangereux.'
- 'Penser qu''on s''habitue au bruit : l''oreille ne s''endurcit pas, elle s''abîme.'
- 'Croire que les cellules ciliées repoussent : une surdité due au bruit est définitive.'
- 'Penser que 88 dB, c''est à peine plus que 85 dB : 3 dB de plus, c''est deux fois plus d''énergie sonore.'
- Confondre aigu ou grave (la fréquence, en Hz) avec fort ou faible (l'intensité, en dB).
exemple:
  enonce: Pourquoi une exposition à 94 dB pendant une heure fait-elle courir autant de risque qu'une journée de 8 heures à
    85 dB ?
  solution: 'De 85 à 94 dB, le niveau monte de 9 dB, soit trois hausses de 3 dB. La durée sans risque est divisée par deux
    trois fois : 8 h, puis 4 h, puis 2 h, puis 1 h.'
exercices:
- id: seuil-de-danger
  type: choix
  difficulte: 1
  enonce: À partir de quel niveau environ une exposition prolongée devient-elle dangereuse pour l'audition ?
  reponse:
    options:
    - id: a
      texte: 20 dB
    - id: b
      texte: 60 dB
    - id: c
      texte: 85 dB
    - id: d
      texte: 120 dB
    bonnes:
    - c
  indices:
    relance: Une conversation normale est-elle dangereuse pour les oreilles ?
    methode: Élimine les niveaux de la vie calme (murmure, conversation) et le niveau où le son fait déjà mal.
    etape: Une conversation se situe vers 60 dB, et on a mal aux oreilles vers 120 dB. Le seuil de danger est entre les deux.
  pieges:
  - si:
      contient:
      - d
    relance: Vers 120 dB, le son fait mal, c'est le seuil de douleur. Le danger commence-t-il avant ou après la douleur ?
  - si:
      contient:
      - b
    relance: C'est le niveau d'une conversation. Parler avec quelqu'un abîme-t-il les oreilles ?
  - si:
      contient:
      - a
    relance: C'est le niveau d'un murmure. Le danger commence bien plus haut.
  solution: 'Vers 85 dB : c''est le seuil de danger. Au-delà, plus l''exposition est longue, plus le risque de lésion est
    grand. Le seuil de douleur (environ 120 dB) est bien plus haut : on peut s''abîmer les oreilles sans avoir mal.'
- id: trajet-du-son
  type: ordre
  difficulte: 2
  enonce: Range ces étapes de l'audition dans l'ordre, du son qui arrive jusqu'au cerveau.
  reponse:
    elements:
    - id: pavillon
      texte: le pavillon capte le son
    - id: conduit
      texte: le son parcourt le conduit auditif
    - id: tympan
      texte: le tympan se met à vibrer
    - id: osselets
      texte: les osselets transmettent et amplifient les vibrations
    - id: cochlee
      texte: la cochlée transforme les vibrations en message nerveux
    - id: nerf
      texte: le nerf auditif porte le message au cerveau
  indices:
    relance: Quelle partie de l'oreille voit-on de l'extérieur ? Et laquelle est la plus profonde ?
    methode: 'Va de l''extérieur vers l''intérieur : oreille externe, oreille moyenne, oreille interne, puis le nerf.'
    etape: Le pavillon est la première étape et le nerf auditif la dernière. Le tympan sépare l'oreille externe de l'oreille
      moyenne.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux est la plus proche de l'extérieur ?
  - si:
      diagnostic: ordre_faux
    relance: 'Classe d''abord les étapes par partie : oreille externe, moyenne, interne. Puis range dans chaque partie.'
  solution: Pavillon, conduit auditif (oreille externe) ; tympan, osselets (oreille moyenne) ; cochlée (oreille interne) ;
    nerf auditif, jusqu'au cerveau.
- id: parties-roles
  type: association
  difficulte: 2
  enonce: Relie chaque partie de l'oreille à son rôle.
  reponse:
    gauche:
    - id: a
      texte: oreille externe
    - id: b
      texte: oreille moyenne
    - id: c
      texte: oreille interne
    - id: d
      texte: cerveau
    droite:
    - id: w
      texte: capte le son et le dirige vers le tympan
    - id: x
      texte: transmet et amplifie les vibrations grâce aux osselets
    - id: y
      texte: transforme les vibrations en message nerveux
    - id: z
      texte: interprète le message et nous fait entendre
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Dans quelle partie se trouvent les osselets ? Et la cochlée ?
    methode: Suis le trajet du son, de l'extérieur vers l'intérieur. Chaque partie fait une étape.
    etape: 'L''oreille externe est la première étape : elle capte le son. Le cerveau est la dernière. Place les deux autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Où se trouve la cochlée, où se trouvent les osselets ?
  - si:
      diagnostic: associations_fausses
    relance: Range les quatre parties dans l'ordre du trajet du son, puis donne à chacune l'étape qui correspond.
  solution: 'Oreille externe : capte le son. Oreille moyenne : tympan et osselets transmettent et amplifient. Oreille interne
    : la cochlée transforme en message nerveux. Cerveau : interprète.'
- id: duree-sans-risque
  type: nombre
  difficulte: 3
  enonce: On admet que l'on peut rester 8 heures à 85 dB sans risque, et que ce temps est divisé par deux chaque fois que
    le niveau augmente de 3 dB. Combien d'heures peut-on rester sans risque à 91 dB ?
  reponse:
    valeur: 2
    forme: libre
  indices:
    relance: De combien de décibels passe-t-on de 85 dB à 91 dB ? Combien de fois 3 dB cela fait-il ?
    methode: À chaque hausse de 3 dB, divise la durée par deux. Fais-le autant de fois que nécessaire.
    etape: De 85 dB à 88 dB, la durée passe de 8 heures à 4 heures. Il reste une hausse de 3 dB.
  pieges:
  - si:
      valeur: 4
    relance: 4 heures, c'est à 88 dB. Il reste encore une hausse de 3 dB jusqu'à 91 dB.
  - si:
      valeur: 6
    relance: Six, c'est l'écart en décibels. On demande une durée en heures.
  - si:
      valeur: 1
    relance: Tu as divisé une fois de trop. Combien de hausses de 3 dB y a-t-il entre 85 et 91 dB ?
  solution: 'De 85 à 91 dB : deux hausses de 3 dB. 8 h, puis 4 h à 88 dB, puis 2 h à 91 dB. On peut rester 2 heures sans risque.'
- id: sifflement-sans-source
  type: texte_court
  difficulte: 2
  enonce: Après un concert, Léa entend un sifflement dans ses oreilles alors que tout est silencieux autour d'elle. Comment
    s'appelle ce symptôme ?
  reponse:
    acceptees:
    - acouphène
    - acouphènes
    - un acouphène
    - des acouphènes
    fautes_tolerees: 1
  indices:
    relance: C'est un son que l'on entend, mais qui ne vient d'aucune source extérieure. Quel mot médical le désigne ?
    methode: Le mot contient la racine grecque « phonê », qui veut dire « son », comme dans « téléphone ».
    etape: Le mot commence par « acou- », comme dans « acoustique ».
  pieges:
  - si:
      valeur: surdité
    relance: La surdité, c'est une perte d'audition. Ici, Léa entend un son qui n'existe pas. Quel mot le désigne ?
  - si:
      valeur: écho
    relance: Un écho est un vrai son renvoyé par un mur. Ici, aucun son n'existe autour de Léa.
  solution: 'Un acouphène : un sifflement ou un bourdonnement entendu sans source extérieure. C''est un signe d''alerte :
    si l''acouphène dure encore le lendemain, il faut consulter un médecin rapidement.'
- id: conseils-concert
  type: ouverte
  difficulte: 3
  enonce: Ton ami va à un concert de rock de trois heures et veut se placer juste devant les enceintes. En quatre ou cinq
    phrases, explique-lui ce que le son peut faire à son oreille et donne-lui des conseils précis.
  criteres:
  - L'élève explique que le niveau (environ 100 dB, au-dessus du seuil de danger de 85 dB) et la durée augmentent le risque.
  - L'élève cite l'atteinte des cellules ciliées de la cochlée, définitive, et les signes d'alerte (acouphènes, oreilles cotonneuses).
  - L'élève donne au moins deux conseils concrets (s'éloigner des enceintes, pauses au calme, bouchons d'oreilles, consulter
    si les symptômes persistent).
  indices:
    relance: À quel niveau sonore est un concert amplifié, et combien de temps ton ami va-t-il y rester ?
    methode: 'Fais trois parties : le danger (niveau et durée), ce qui se passe dans l''oreille, puis les conseils.'
    etape: Tu peux commencer ainsi « Devant les enceintes, le son dépasse souvent 100 dB, bien au-dessus du seuil de danger…
      ».
  solution: 'Devant les enceintes, le son dépasse souvent 100 dB, bien au-dessus du seuil de danger de 85 dB, et trois heures,
    c''est long : le risque est très élevé. Dans la cochlée, les cellules ciliées peuvent être abîmées, et elles ne se réparent
    pas. Des sifflements ou des oreilles cotonneuses après le concert sont des signes d''alerte. Je te conseille de te placer
    loin des enceintes, de porter des bouchons d''oreilles et de faire des pauses au calme. Si les sifflements durent encore
    le lendemain, va vite voir un médecin.'
- id: mot-unite-frequence
  type: texte_court
  difficulte: 1
  enonce: Quelle unité mesure la fréquence d'un son, c'est-à-dire le nombre de vibrations par seconde ?
  reponse:
    acceptees:
    - hertz
    - hz
    fautes_tolerees: 1
  indices:
    relance: 'Ce n''est pas le décibel : celui-ci mesure l''intensité, pas la hauteur du son.'
    methode: L'unité porte le nom d'un physicien du XIXe siècle et s'abrège en deux lettres.
    etape: Son abréviation commence par un H majuscule.
  pieges:
  - si:
      valeur: décibel
    relance: Le décibel mesure l'intensité (fort ou faible). Quelle unité mesure la fréquence, c'est-à-dire le côté aigu ou
      grave ?
  - si:
      valeur: db
    relance: Le dB mesure l'intensité (fort ou faible). Quelle unité mesure la fréquence, c'est-à-dire le côté aigu ou grave
      ?
  solution: 'La fréquence se mesure en hertz (Hz) : nombre de vibrations par seconde.'
- id: effets-bruit
  type: choix
  difficulte: 2
  enonce: Quelles conséquences peut avoir une exposition fréquente à un bruit fort ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: De la fatigue et des difficultés de concentration
    - id: b
      texte: Un sommeil perturbé
    - id: c
      texte: Une meilleure audition avec l'habitude
    - id: d
      texte: La réparation des cellules ciliées pendant les pauses
    bonnes:
    - a
    - b
  indices:
    relance: Le bruit agit-il seulement sur l'oreille, ou aussi sur le reste du corps et de l'esprit ?
    methode: Relis le paragraphe sur l'environnement sonore et sur les cellules ciliées.
    etape: Élimine les deux propositions qui disent que l'oreille s'améliore ou se répare.
  pieges:
  - si:
      contient:
      - c
    relance: 'L''oreille ne s''endurcit pas au bruit : elle s''abîme.'
  - si:
      contient:
      - d
    relance: Les cellules ciliées abîmées ne se réparent pas. Que deviennent-elles ?
  solution: Un bruit fort et fréquent fatigue, gêne la concentration et perturbe le sommeil. L'oreille ne s'habitue pas et
    les cellules ciliées abîmées ne se réparent pas.
