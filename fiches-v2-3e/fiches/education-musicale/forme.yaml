# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: forme
version: 1
etat: verifiee
declencheurs:
- couplet et refrain
- plan d'un morceau
- thème et variations
- rondeau
- forme AABA
- introduction et coda
prerequis:
- 4e-forme
essentiel: 'La forme, c''est le plan d''une musique : la façon dont ses parties s''organisent dans le temps. Elle repose sur
  trois procédés : la répétition (une partie revient), la variation (elle revient modifiée) et le contraste (une partie nouvelle
  arrive). On note les parties avec des lettres : A, B, C… ; A'' (A prime) est une version modifiée de A.


  Les formes à connaître :

  - Couplet-refrain (chansons) : le refrain revient avec la même musique et les mêmes paroles ; les couplets ont la même musique
  mais des paroles différentes. S''y ajoutent souvent une introduction, un pont (passage différent) et une coda (conclusion).

  - Rondo (ou rondeau) : un refrain A revient entre des couplets toujours différents : A B A C A D A… Exemple : le Prélude
  du Te Deum de Marc-Antoine Charpentier (fin du XVIIe siècle), construit en rondeau.

  - Forme ABA : une partie, une partie contrastante, puis le retour de la première.

  - Forme AABA : une partie jouée deux fois, un pont contrastant, puis le retour de A. C''est la forme de nombreux standards
  de jazz et de chansons, souvent en 4 parties de 8 mesures.

  - Thème et variations : un thème est présenté, puis modifié plusieurs fois (rythme, tempo, nuances, instruments, mode majeur
  ou mineur, ornements) tout en restant reconnaissable : A A'' A'''' A''''''… Exemple : les Variations de Mozart sur « Ah
  ! vous dirai-je, maman » (fin du XVIIIe siècle).

  '
methode:
- Repérer le début de chaque nouvelle partie (changement de mélodie, d'instruments, de nuance).
- 'Donner une lettre à chaque partie : même lettre si elle revient identique, lettre avec prime (A'') si elle revient modifiée,
  nouvelle lettre si elle est différente.'
- Écrire le schéma complet (par exemple A B A C A), puis le comparer aux formes connues.
- Justifier par ce qui se répète, ce qui varie et ce qui contraste.
vocabulaire:
- terme: refrain
  definition: partie qui revient avec la même musique et les mêmes paroles
- terme: couplet
  definition: partie qui garde la même musique mais change de paroles (chanson) ou partie nouvelle entre deux refrains (rondo)
- terme: coda
  definition: passage qui conclut le morceau
- terme: variation
  definition: reprise d'un thème modifié, mais encore reconnaissable
erreurs_frequentes:
- 'Confondre couplet et refrain : c''est le refrain qui garde les mêmes paroles.'
- 'Dans un rondo, noter tous les couplets B : ils sont différents, on les note B, C, D.'
- 'Croire qu''une variation est une nouvelle mélodie : le thème doit rester reconnaissable.'
- Oublier l'introduction et la coda dans le plan.
exemple:
  enonce: 'Un morceau fait entendre : un thème, un passage nouveau, le thème, un autre passage nouveau, le thème. Écris son
    schéma et nomme sa forme.'
  solution: 'A B A C A : le thème A revient entre des couplets différents. C''est un rondo.'
exercices:
- id: partie-qui-revient
  type: texte_court
  difficulte: 1
  enonce: Dans une chanson, comment s'appelle la partie qui revient plusieurs fois avec la même musique et les mêmes paroles
    ?
  reponse:
    acceptees:
    - refrain
    - le refrain
    fautes_tolerees: 0
  indices:
    relance: Dans une chanson, quelle partie tout le monde finit par chanter en même temps que le chanteur ?
    methode: Il y a deux sortes de parties dans une chanson. L'une change de paroles à chaque fois, l'autre non.
    etape: Ce n'est pas le couplet. Le mot commence par « re- ».
  pieges:
  - si:
      valeur: couplet
    relance: Le couplet garde la même musique, mais ses paroles changent. Quelle partie garde aussi les mêmes paroles ?
  - si:
      valeur: pont
    relance: Le pont est un passage différent, souvent entendu une seule fois. Quelle partie revient plusieurs fois ?
  solution: Le refrain revient avec la même musique et les mêmes paroles ; les couplets changent de paroles.
- id: schema-rondo
  type: choix
  difficulte: 2
  enonce: Quel schéma correspond à un rondo ?
  reponse:
    options:
    - id: a
      texte: A B A C A D A
    - id: b
      texte: A A B A
    - id: c
      texte: A A' A'' A'''
    - id: d
      texte: A B C D E
    bonnes:
    - a
  indices:
    relance: Dans un rondo, quelle partie revient, et combien de fois ?
    methode: Dans un rondo, le refrain revient entre des couplets, et chaque couplet est nouveau.
    etape: Cherche le schéma où A revient plusieurs fois, séparé à chaque fois par une lettre nouvelle.
  pieges:
  - si:
      contient:
      - b
    relance: 'A A B A, c''est la forme des standards : A ne revient qu''une fois après le pont. Dans un rondo, combien de
      couplets différents y a-t-il ?'
  - si:
      contient:
      - c
    relance: Les primes montrent un thème qui revient modifié. Quelle forme est-ce ? Dans un rondo, les couplets sont-ils
      des versions du refrain ?
  - si:
      contient:
      - d
    relance: Ici rien ne revient. Or le rondo est construit sur un retour régulier. Lequel ?
  solution: 'A B A C A D A : le refrain A revient entre des couplets toujours différents (B, C, D).'
- id: mesures-aaba
  type: nombre
  difficulte: 2
  enonce: Un standard de jazz suit la forme A A B A. Chaque partie dure 8 mesures. Combien de mesures dure le morceau en tout
    ?
  reponse:
    valeur: 32
    forme: entier
  indices:
    relance: Combien de parties y a-t-il dans le schéma A A B A ?
    methode: Compte les lettres du schéma, puis multiplie par la durée d'une partie.
    etape: Il y a quatre parties de huit mesures chacune.
  pieges:
  - si:
      valeur: 24
    relance: Tu as compté trois parties. Relis le schéma lettre par lettre, la partie A est jouée plusieurs fois.
  - si:
      valeur: 16
    relance: 'Tu as peut-être compté seulement A et B. Chaque lettre du schéma est une partie jouée : combien y en a-t-il
      ?'
  solution: 'Le schéma A A B A compte 4 parties : 4 × 8 = 32 mesures.'
- id: formes-definitions
  type: association
  difficulte: 2
  enonce: Relie chaque forme à sa description.
  reponse:
    gauche:
    - id: a
      texte: couplet-refrain
    - id: b
      texte: rondo
    - id: c
      texte: thème et variations
    - id: d
      texte: forme ABA
    droite:
    - id: w
      texte: une partie revient avec les mêmes paroles, les autres parties changent de paroles sur la même musique
    - id: x
      texte: un refrain revient entre des couplets toujours nouveaux
    - id: y
      texte: une mélodie est reprise plusieurs fois en étant modifiée à chaque fois
    - id: z
      texte: une partie, une partie contrastante, puis le retour de la première partie
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Pour chaque forme, qu'est-ce qui revient, et comment ?
    methode: 'Cherche d''abord la forme de la chanson (paroles), puis celle où la mélodie est modifiée, puis compare les deux
      dernières : combien de retours ?'
    etape: La forme ABA ne fait revenir la première partie qu'une seule fois. Le rondo, lui, la fait revenir plusieurs fois.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare le rondo et la forme ABA.
  - si:
      diagnostic: associations_fausses
    relance: Commence par la seule description qui parle de paroles, puis par celle où la mélodie est modifiée.
  solution: 'Couplet-refrain : mêmes paroles au refrain, paroles nouvelles aux couplets. Rondo : refrain entre des couplets
    nouveaux. Thème et variations : thème modifié à chaque reprise. ABA : retour unique de A après une partie contrastante.'
- id: decrire-forme
  type: ouverte
  difficulte: 3
  enonce: 'Voici la description d''un extrait : « Le piano joue une mélodie simple et calme. Puis la même mélodie revient,
    reconnaissable, mais avec beaucoup de notes rapides ajoutées. Ensuite elle revient dans le grave, plus lente et plus triste,
    en mineur. Enfin, elle revient une dernière fois, très forte, jouée avec des accords. » Écris le schéma de cet extrait,
    nomme sa forme et justifie en trois ou quatre phrases.'
  criteres:
  - L'élève écrit un schéma du type A A' A'' A''' et nomme la forme thème et variations.
  - L'élève dit ce qui change d'une variation à l'autre (rythme, registre, tempo, mode, nuances) et ce qui reste (la mélodie
    reconnaissable).
  - L'élève emploie le vocabulaire de la forme (thème, variation, répétition, contraste).
  indices:
    relance: La mélodie change-t-elle complètement, ou reste-t-elle reconnaissable ?
    methode: Donne une lettre à chaque passage, avec des primes quand la partie revient modifiée, puis dis ce qui change à
      chaque fois.
    etape: Tu peux commencer ainsi « La première partie présente le thème, noté A. Ensuite… ».
  solution: 'Le schéma est A A'' A'''' A'''''' : c''est un thème et variations. Le piano présente d''abord le thème, calme.
    La première variation ajoute des notes rapides (rythme), la deuxième le déplace dans le grave, plus lent et en mineur,
    la troisième le joue fortissimo en accords. À chaque fois, la mélodie reste reconnaissable.'
- id: nblm-comment-definit-on-la-forme-en-musique-1
  type: choix
  difficulte: 2
  enonce: Comment définit-on la « forme » en musique ?
  reponse:
    options:
    - id: o1
      texte: Le plan d'un morceau, c'est-à-dire la façon dont ses différentes parties s'organisent dans le temps.
    - id: o2
      texte: La vitesse de la pulsation mesurée en battements par minute (BPM).
    - id: o3
      texte: L'intensité du son et ses variations de volume (du très doux au très fort).
    - id: o4
      texte: La couleur sonore propre à chaque instrument ou voix.
    bonnes:
    - o1
  indices:
    relance: Pense à la structure globale et au découpage chronologique des sections de la musique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : cela correspond au tempo, et non à la forme.'
  - si:
      contient:
      - o3
    relance: 'Attention : la gestion du volume sonore désigne la dynamique (nuances), pas la forme.'
  - si:
      contient:
      - o4
    relance: 'Il ne faut pas confondre : la couleur sonore permettant de reconnaître un instrument est le timbre.'
  solution: 'Le plan d''un morceau, c''est-à-dire la façon dont ses différentes parties s''organisent dans le temps. C''est
    exact : la forme désigne la structure temporelle et l''organisation des différentes sections d''une œuvre.'
- id: nblm-dans-la-forme-chanson-couplet-refrain-qu-2
  type: choix
  difficulte: 2
  enonce: Dans la forme chanson (couplet-refrain), quelle est la caractéristique essentielle du refrain ?
  reponse:
    options:
    - id: o1
      texte: Il revient plusieurs fois avec la même musique et les mêmes paroles.
    - id: o2
      texte: Il garde la même musique mais change de paroles à chaque fois.
    - id: o3
      texte: C'est un passage uniquement instrumental placé tout à la fin du morceau.
    - id: o4
      texte: Il s'agit d'un thème modifié à chaque répétition par le rythme ou le tempo.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi ce qui ne change jamais lorsque cette partie revient dans la chanson.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : c''est la caractéristique du couplet, pas du refrain.'
  - si:
      contient:
      - o3
    relance: 'Confusion : la section conclusive d''un morceau s''appelle la coda.'
  - si:
      contient:
      - o4
    relance: 'Attention : une section qui revient modifiée correspond au principe de la variation.'
  solution: 'Il revient plusieurs fois avec la même musique et les mêmes paroles. C''est la définition exacte du refrain :
    paroles et musique restent identiques à chaque retour.'
- id: nblm-dans-un-rondo-ou-rondeau-represente-par-3
  type: choix
  difficulte: 2
  enonce: Dans un rondo (ou rondeau) représenté par le schéma A B A C A, comment sont notées les différentes parties ?
  reponse:
    options:
    - id: o1
      texte: Le refrain A revient entre des couplets tous différents (B, C, D...).
    - id: o2
      texte: Tous les couplets étant identiques au refrain, ils portent la même lettre A.
    - id: o3
      texte: Les couplets sont tous notés avec la lettre B (A B A B A).
    - id: o4
      texte: La lettre A désigne l'introduction et la lettre B désigne la coda.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au fait que chaque couplet apporte une musique nouvelle entre les retours du refrain A.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : si les parties portent la même lettre, il n''y a aucun contraste ni couplet distinct.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : dans un rondo, chaque couplet intermédiaire est différent des autres, donc on utilise des
      lettres différentes (B, C, D).'
  - si:
      contient:
      - o4
    relance: 'Confusion : l''introduction précède le morceau et la coda le conclut, elles ne forment pas l''alternance refrain/couplets.'
  solution: 'Le refrain A revient entre des couplets tous différents (B, C, D...). Exactement : A est le refrain fixe, tandis
    que les couplets B, C, D apportent de la nouveauté.'
- id: nblm-qu-est-ce-qui-caracterise-la-forme-theme-4
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qui caractérise la forme « thème et variations » (A A' A'' A''') ?
  reponse:
    options:
    - id: o1
      texte: Le thème principal est modifié plusieurs fois (rythme, nuances, instruments) tout en restant reconnaissable.
    - id: o2
      texte: Une mélodie entièrement différente et sans rapport avec le thème est présentée à chaque section.
    - id: o3
      texte: Le thème est répété exactement à l'identique sans aucun changement du début à la fin.
    - id: o4
      texte: C'est une forme alternant systématiquement un refrain et des couplets.
    bonnes:
    - o1
  indices:
    relance: Pense au symbole prime (A') qui indique que la mélodie de départ est modifiée mais pas remplacée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : croire qu''une variation est une nouvelle mélodie. Le thème initial doit rester reconnaissable.'
  - si:
      contient:
      - o3
    relance: 'Attention : la simple répétition identique ne constitue pas une variation (A'' signale une modification).'
  - si:
      contient:
      - o4
    relance: 'Confusion : l''alternance d''un refrain et de couplets caractérise la chanson ou le rondo.'
  solution: 'Le thème principal est modifié plusieurs fois (rythme, nuances, instruments) tout en restant reconnaissable.
    En effet : la variation transforme certains éléments du thème de départ sans jamais en perdre le motif principal.'
- id: nblm-quelle-est-la-structure-de-la-forme-aaba-5
  type: choix
  difficulte: 2
  enonce: Quelle est la structure de la forme AABA, très fréquente dans les standards de jazz ?
  reponse:
    options:
    - id: o1
      texte: Une partie A jouée deux fois, un pont B contrastant, puis le retour de la partie A.
    - id: o2
      texte: Une alternance continue où la partie A revient après chaque nouveau couplet B, C, D.
    - id: o3
      texte: Un thème principal suivi de trois variations modifiées nommées A, B, C.
    - id: o4
      texte: Quatre parties strictly identiques jouées les unes après les autres.
    bonnes:
    - o1
  indices:
    relance: 'Observe bien l''ordre des lettres : deux fois la première partie, une partie différente (le pont), puis le retour
      de la première.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : ce schéma correspond à la forme rondo (A B A C A).'
  - si:
      contient:
      - o3
    relance: 'Erreur : les variations d''un même thème se notent A, A'', A'''', A'''''' et non pas avec des lettres différentes.'
  - si:
      contient:
      - o4
    relance: 'Attention : la lettre B indique la présence d''un pont contrastant entre les parties A.'
  solution: Une partie A jouée deux fois, un pont B contrastant, puis le retour de la partie A. C'est la structure exacte
    de la forme AABA, très répandue en jazz (souvent 4 parties de 8 mesures).
- id: nblm-quelles-sont-les-deux-sections-facultati-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux sections facultatives qui permettent respectivement de débuter et de conclure le plan d'un
    morceau ? [1-3] (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'introduction
    - id: o2
      texte: La coda
    - id: o3
      texte: Le refrain
    - id: o4
      texte: Le couplet
    bonnes:
    - o1
    - o2
  indices:
    relance: L'une se situe tout au début avant le premier couplet, l'autre est la section finale qui clôt la pièce.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : le refrain est la section centrale récurrente d''un morceau, pas une section facultative de début ou
      de conclusion.'
  solution: 'L''introduction ; La coda. C''est juste : l''introduction est le passage placé au tout début pour amener le morceau.'
- id: nblm-comment-appelle-t-on-le-passage-musical-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le passage musical qui vient conclure un morceau à la fin de son plan ?
  reponse:
    acceptees:
    - coda
    fautes_tolerees: 1
  indices:
    relance: Ce mot d'origine italienne désigne la section finale qui achève une œuvre musicale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: coda. La coda est la section conclusive ajoutée à la fin d'un morceau pour le terminer.
- id: nblm-dans-la-forme-rondo-a-b-a-c-a-comment-ap-8
  type: texte_court
  difficulte: 1
  enonce: Dans la forme rondo (A B A C A), comment appelle-t-on la partie principale A qui revient régulièrement ?
  reponse:
    acceptees:
    - refrain
    fautes_tolerees: 1
  indices:
    relance: C'est le terme qui désigne la section fixe A qui réapparaît après chaque couplet différent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: refrain. Dans un rondo, le refrain est la partie A récurrente qui réapparaît entre chaque couplet.
