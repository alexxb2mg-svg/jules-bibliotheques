# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: identifier-decrire-organisation-musicale
version: 2
etat: verifiee
declencheurs:
- structure d'un morceau
- plan d'une œuvre
- basse obstinée
- motif qui se répète
- superposition des voix
- reconnaître un canon
- forme rondo ou ABA
- transformer un thème
- texture d'un morceau
- analyser une écoute
prerequis:
- forme
- successif-et-simultane
- 4e-ecouter-comparer-construire-culture
essentiel: 'Une organisation musicale complexe se décrit en trois questions : comment le morceau avance dans le temps (la
  forme), comment les sons se superposent (la texture), et quels procédés reviennent.


  La forme. Couplet-refrain : le refrain revient avec les mêmes paroles, les couplets changent. Rondo : un refrain revient
  entre des couplets différents (A B A C A). Forme ABA : une partie, une partie contrastante, puis le retour de la première.
  Thème et variations : un thème est présenté puis transformé plusieurs fois. Une œuvre peut aussi enchaîner des sections
  très différentes : Bohemian Rhapsody de Queen (1975) passe d''une ballade au piano à une section de style opéra puis à une
  section hard rock.


  La texture. Monodie : une seule mélodie, sans accompagnement, chantée seule ou à l''unisson, comme le chant grégorien. Mélodie
  accompagnée : une mélodie principale soutenue par des accords. Polyphonie : plusieurs mélodies différentes entendues en
  même temps.


  Les procédés. L''ostinato est un motif répété obstinément, comme le rythme de caisse claire du Boléro de Ravel (1928). La
  basse obstinée est une ligne grave qui se répète sous des mélodies qui changent. Le canon fait entrer plusieurs voix l''une
  après l''autre sur la même mélodie. Le Canon en ré majeur de Pachelbel (fin du XVIIe siècle) réunit les deux : trois violons
  en canon au-dessus d''une basse de huit notes répétée du début à la fin.


  Enfin, on situe l''œuvre dans un réseau de références : son époque, son style, et d''autres œuvres qui utilisent les mêmes
  procédés.


  Quelques mots de plus pour décrire une forme : l''introduction ouvre le morceau, le pont relie deux parties, la coda le
  conclut. Dans une chanson, le refrain revient et les couplets changent.


  Ce qu''on attend : décrire dans l''ordre (début, milieu, fin), nommer la forme, la texture et les procédés avec le mot juste,
  puis relier l''œuvre à une époque ou à une autre œuvre, en justifiant par ce qu''on entend.

  '
methode:
- 'Repérer ce qui revient et ce qui change : cela donne la forme.'
- 'Compter les plans sonores : une seule mélodie, une mélodie et un accompagnement, ou plusieurs mélodies ensemble.'
- 'Chercher les procédés : un motif répété (ostinato), des entrées décalées (canon), une ligne grave répétée (basse obstinée).'
- Nommer chaque élément avec le mot juste et le situer dans le temps (début, milieu, fin).
- Relier l'œuvre à son époque et à d'autres œuvres qui utilisent les mêmes procédés.
vocabulaire:
- terme: ostinato
  definition: motif rythmique ou mélodique répété obstinément pendant tout ou partie d'un morceau
- terme: canon
  definition: procédé où plusieurs voix chantent ou jouent la même mélodie en entrant l'une après l'autre
- terme: monodie
  definition: musique à une seule mélodie, sans accompagnement
- terme: polyphonie
  definition: musique où plusieurs mélodies différentes sont entendues en même temps
- terme: rondo
  definition: forme où un refrain revient entre des couplets différents (A B A C A)
- terme: refrain
  definition: partie d'une chanson ou d'un rondo qui revient plusieurs fois, identique
- terme: basse obstinée
  definition: ligne grave qui se répète sous des mélodies qui changent
- terme: texture
  definition: 'façon dont les lignes musicales se superposent : monodie, mélodie accompagnée, polyphonie'
erreurs_frequentes:
- 'Confondre canon et polyphonie : le canon est une sorte de polyphonie, mais toutes les polyphonies ne sont pas des canons.'
- 'Confondre ostinato et refrain : l''ostinato est un court motif qui se répète sans arrêt, le refrain une partie entière
  qui revient.'
- Appeler « monodie » un chœur qui chante à plusieurs voix différentes.
- Décrire la forme sans situer les moments (début, milieu, fin).
- Oublier de relier l'œuvre à son époque ou à d'autres œuvres.
exemple:
  enonce: 'Décris l''organisation du Boléro de Ravel (1928) à partir de cette écoute décrite : une caisse claire répète le
    même rythme du début à la fin, sur un tempo constant ; deux mélodies passent d''un instrument à l''autre ; l''orchestre
    s''étoffe et le volume grandit jusqu''à la fin.'
  solution: 'Le Boléro repose sur un ostinato rythmique à la caisse claire, répété du début à la fin sur un tempo constant.
    Au-dessus, deux mélodies reviennent sans cesse, confiées à des instruments différents : c''est le timbre qui change. L''ensemble
    forme un immense crescendo, car des instruments s''ajoutent peu à peu. C''est une œuvre du XXe siècle fondée sur la répétition,
    comme l''est aussi, autrement, le Canon de Pachelbel avec sa basse obstinée.'
exercices:
- id: mot-ostinato
  type: texte_court
  difficulte: 1
  enonce: Dans le Boléro de Ravel (1928), la caisse claire répète le même rythme du début à la fin. Comment appelle-t-on un
    motif répété obstinément de cette façon ?
  reponse:
    acceptees:
    - ostinato
    fautes_tolerees: 1
  indices:
    relance: Le mot vient de l'italien et ressemble à l'adjectif français « obstiné ».
    methode: 'Relis le vocabulaire des procédés : un mot désigne un motif répété sans arrêt.'
    etape: Le mot commence par « osti- ».
  pieges:
  - si:
      valeur: refrain
    relance: Un refrain est une partie entière qui revient. Ici, c'est un court motif qui ne s'arrête jamais. Quel mot italien
      convient ?
  - si:
      valeur: canon
    relance: Dans un canon, des voix entrent l'une après l'autre. Ici, un seul instrument répète son motif. Quel est le mot
      ?
  - si:
      valeur: rythme
    relance: C'est bien un rythme, mais on cherche le nom du procédé qui consiste à le répéter sans arrêt.
  solution: 'C''est un ostinato : un motif rythmique ou mélodique répété obstinément.'
- id: mot-canon
  type: texte_court
  difficulte: 2
  enonce: Quand on chante « Frère Jacques » en groupes, chaque groupe chante la même mélodie mais commence un peu après le
    précédent. Quel est le nom précis de ce procédé ?
  reponse:
    acceptees:
    - canon
    fautes_tolerees: 0
  indices:
    relance: Les voix chantent la même chose, mais pas au même moment. Comment appelle-t-on ce jeu d'entrées décalées ?
    methode: Cherche le procédé où une seule mélodie est imitée par d'autres voix qui entrent l'une après l'autre.
    etape: C'est aussi le nom d'une œuvre célèbre de Pachelbel. Le mot compte cinq lettres.
  pieges:
  - si:
      valeur: polyphonie
    relance: On entend bien plusieurs voix en même temps, mais on cherche le nom précis du procédé où elles chantent la même
      mélodie avec un décalage.
  - si:
      valeur: unisson
    relance: À l'unisson, tout le monde chante la même note en même temps. Ici, les groupes commencent l'un après l'autre.
  - si:
      valeur: ostinato
    relance: Un ostinato est un motif court répété. Ici, c'est toute la mélodie qui est reprise en décalé par d'autres groupes.
  solution: 'C''est un canon : plusieurs voix chantent la même mélodie en entrant l''une après l''autre.'
- id: formes
  type: association
  difficulte: 2
  enonce: Relie chaque forme ou procédé à sa description.
  reponse:
    gauche:
    - id: rondo
      texte: Rondo
    - id: aba
      texte: Forme ABA
    - id: variations
      texte: Thème et variations
    - id: basse
      texte: Basse obstinée
    droite:
    - id: refrain
      texte: Un refrain revient entre des couplets différents
    - id: retour
      texte: Une partie, une partie contrastante, puis le retour de la première
    - id: transforme
      texte: Un thème est présenté, puis transformé plusieurs fois
    - id: grave
      texte: Une même ligne grave répétée sous des mélodies qui changent
    paires:
      rondo: refrain
      aba: retour
      variations: transforme
      basse: grave
  indices:
    relance: Laquelle de ces descriptions parle des sons graves ? Laquelle parle d'un retour unique ?
    methode: 'Lis le nom de chaque forme : les lettres, les mots « variations » ou « basse » donnent déjà un indice.'
    etape: Dans « ABA », la partie A revient une seule fois, à la fin. Quelle description correspond ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Compare le rondo et la forme ABA : combien de fois revient la partie principale
      ?'
  - si:
      diagnostic: associations_fausses
    relance: Commence par la basse obstinée (le mot « basse » désigne les sons graves), puis traite les trois formes.
  solution: 'Rondo : un refrain revient entre des couplets différents. ABA : une partie, un contraste, puis le retour de la
    première. Thème et variations : un thème transformé plusieurs fois. Basse obstinée : une ligne grave répétée sous des
    mélodies qui changent.'
- id: texture-gregorien
  type: choix
  difficulte: 2
  enonce: Dans un enregistrement de chant grégorien, on entend un chœur d'hommes qui chante tous ensemble la même mélodie,
    sans aucun instrument. Comment qualifier cette texture ?
  reponse:
    options:
    - id: a
      texte: Une monodie
    - id: b
      texte: Une polyphonie
    - id: c
      texte: Une mélodie accompagnée
    - id: d
      texte: Un canon
    bonnes:
    - a
  indices:
    relance: Combien de mélodies différentes entend-on en même temps ?
    methode: 'Compte les plans sonores : une seule mélodie ? une mélodie et un accompagnement ? plusieurs mélodies ?'
    etape: 'Tout le chœur chante la même chose, sans instrument : il n''y a qu''une seule ligne. Quel mot contient l''idée
      de « seul » ?'
  pieges:
  - si:
      contient:
      - b
    relance: Il y a plusieurs chanteurs, mais chantent-ils des mélodies différentes ?
  - si:
      contient:
      - c
    relance: Pour une mélodie accompagnée, il faut un accompagnement. Y a-t-il des instruments ici ?
  - si:
      contient:
      - d
    relance: Dans un canon, les voix entrent l'une après l'autre. Ici, tout le monde chante en même temps la même chose.
  solution: 'C''est une monodie : une seule mélodie, chantée à l''unisson, sans accompagnement.'
- id: sections-bohemian-rhapsody
  type: ordre
  difficulte: 3
  enonce: Bohemian Rhapsody de Queen (1975) enchaîne des sections très différentes. Range-les dans l'ordre où on les entend.
  reponse:
    elements:
    - id: intro
      texte: Une introduction chantée par plusieurs voix superposées
    - id: ballade
      texte: Une ballade chantée avec le piano
    - id: opera
      texte: Une section de style opéra avec des chœurs
    - id: rock
      texte: Une section hard rock avec guitare électrique
    - id: conclusion
      texte: Une conclusion lente et calme
  indices:
    relance: Comment commence le morceau, et comment se termine-t-il ?
    methode: 'Place d''abord l''introduction et la conclusion, puis range les trois sections du milieu : la plus douce vient
      avant les plus spectaculaires.'
    etape: Après l'introduction vocale, le chanteur Freddie Mercury chante une ballade au piano. Laquelle des deux sections
      restantes vient ensuite ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux sections voisines sont inversées. La section rapide et énergique arrive-t-elle avant ou après les
      chœurs d'opéra ?
  - si:
      diagnostic: ordre_faux
    relance: Le morceau va de plus en plus loin dans les contrastes, puis revient au calme à la fin.
  solution: Introduction vocale, ballade au piano, section de style opéra, section hard rock, puis conclusion lente et calme.
- id: decrire-pachelbel
  type: ouverte
  difficulte: 3
  enonce: 'Voici ce qu''on entend dans le Canon en ré majeur de Pachelbel (fin du XVIIe siècle) : une ligne grave de huit
    notes répétée du début à la fin ; trois violons qui jouent la même mélodie en entrant l''un après l''autre ; des mélodies
    qui deviennent de plus en plus ornées, avec des notes de plus en plus rapides. Décris l''organisation de cette œuvre et
    relie-la à une autre œuvre que tu connais.'
  criteres:
  - 'L''élève nomme les procédés avec le mot juste : basse obstinée (ou ostinato) et canon.'
  - 'L''élève décrit la texture : plusieurs voix superposées (polyphonie) au-dessus d''une basse.'
  - L'élève situe l'œuvre (période baroque, fin du XVIIe siècle) et la relie à une autre œuvre fondée sur la répétition ou
    sur le canon.
  indices:
    relance: Qu'est-ce qui se répète à la basse ? Et que font les trois violons les uns par rapport aux autres ?
    methode: Décris d'abord le grave, puis l'aigu, puis l'évolution dans le temps. Termine par l'époque et une œuvre à comparer.
    etape: 'Tu peux commencer ainsi : « À la basse, une ligne de huit notes est répétée du début à la fin : c''est… ».'
  solution: 'À la basse, une ligne de huit notes est répétée du début à la fin : c''est une basse obstinée. Au-dessus, trois
    violons jouent la même mélodie en entrant l''un après l''autre : c''est un canon, et on entend donc plusieurs lignes superposées,
    une polyphonie. Les mélodies deviennent de plus en plus ornées, ce qui donne une impression d''élan. C''est une œuvre
    baroque de la fin du XVIIe siècle. Comme le Boléro de Ravel, elle est fondée sur la répétition d''un motif.'
- id: nblm-comment-definit-on-le-plan-d-une-uvre-mu-1
  type: choix
  difficulte: 2
  enonce: Comment définit-on le plan d'une œuvre musicale (ou la forme d'un morceau) d'après les repères d'analyse ?
  reponse:
    options:
    - id: o1
      texte: La façon dont ses différentes parties s'organisent et s'enchaînent dans le temps.
    - id: o2
      texte: La vitesse à laquelle la musique est jouée du début à la fin.
    - id: o3
      texte: Le volume sonore réglé entre les passages doux et forts.
    - id: o4
      texte: Le choix des instruments de musique qui constituent l'orchestre.
    bonnes:
    - o1
  indices:
    relance: Pense à la façon dont les différentes sections d'un morceau se succèdent du début à la fin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : la vitesse de la musique désigne le tempo, pas la structure ou le plan du morceau.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la variation d''intensité du volume correspond à la dynamique (les nuances), et non à la forme
      du morceau.'
  - si:
      contient:
      - o4
    relance: Attention, le choix des instruments concerne le timbre et l'effectif instrumental, pas l'architecture ou le plan
      de l'œuvre.
  solution: 'La façon dont ses différentes parties s''organisent et s''enchaînent dans le temps. C''est exact : la forme ou
    le plan de l''œuvre correspond à l''organisation chronologique et au déroulement des différentes sections dans le temps.'
- id: nblm-qu-appelle-t-on-une-basse-obstinee-dans-2
  type: choix
  difficulte: 2
  enonce: Qu'appelle-t-on une « basse obstinée » dans l'organisation d'une pièce musicale ?
  reponse:
    options:
    - id: o1
      texte: Une ligne mélodique grave qui se répète de manière continue sous des mélodies qui changent.
    - id: o2
      texte: Un refrain chanté très fort par toutes les voix de l'ensemble.
    - id: o3
      texte: Une note unique tenue sans s'arrêter dans le registre aigu.
    - id: o4
      texte: Un changement brutal de tempo au milieu d'un morceau.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au rôle de la voix grave qui répète la même formule pendant que le reste de la musique évolue au-dessus.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : un refrain est une section complète chantée à plusieurs reprises, tandis que la basse obstinée
      est une ligne grave répétée en continu sous le reste.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : une note tenue dans le grave s''appelle un bourdon, et la basse obstinée est une ligne ou formule
      mélodique grave répétée, pas une note aiguë.'
  - si:
      contient:
      - o4
    relance: 'Faux : le tempo concerne la vitesse de la pulsation, alors que la basse obstinée est un procédé de répétition
      dans le registre grave.'
  solution: 'Une ligne mélodique grave qui se répète de manière continue sous des mélodies qui changent. Correct : la basse
    obstinée est une ligne grave répétée tout au long du morceau sur laquelle se superposent des voix ou mélodies évolutives
    (comme chez Pachelbel).'
- id: nblm-quel-terme-designe-un-motif-rythmique-ou-3
  type: choix
  difficulte: 2
  enonce: Quel terme désigne un motif rythmique ou mélodique répété obstinément pendant tout ou partie d'un morceau ?
  reponse:
    options:
    - id: o1
      texte: Un ostinato
    - id: o2
      texte: Un refrain
    - id: o3
      texte: Une monodie
    - id: o4
      texte: Une nuance
    bonnes:
    - o1
  indices:
    relance: Cherche le mot d'origine italienne qui signifie « obstiné » et caractérise une courte formule sonore répétée
      sans cesse.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le refrain est une partie entière du morceau qui revient avec les mêmes paroles, alors que
      l''ostinato est une courte formule répétée.'
  - si:
      contient:
      - o3
    relance: 'Faux : la monodie est une texture musicale à une seule ligne mélodique sans accompagnement.'
  - si:
      contient:
      - o4
    relance: 'Faux : la nuance indique l''intensité ou le volume du son (ex. piano, forte), pas la répétition d''un motif.'
  solution: 'Un ostinato. Exact : l''ostinato est un motif court (rythmique ou mélodique) répété de façon obstinée dans une
    œuvre, comme le rythme de caisse claire du Boléro de Ravel.'
- id: nblm-comment-reconnait-on-un-canon-lorsqu-on-4
  type: choix
  difficulte: 2
  enonce: Comment reconnaît-on un canon lorsqu'on analyse la superposition des voix dans une œuvre ?
  reponse:
    options:
    - id: o1
      texte: Plusieurs voix interprètent exactement la même mélodie mais en entrant les unes après les autres de manière décalée.
    - id: o2
      texte: Plusieurs voix chantent des paroles différentes sur une seule note tenue à l'unisson.
    - id: o3
      texte: Toutes les voix chantent en même temps exactement le même rythme avec des notes différentes.
    - id: o4
      texte: Un soliste chante seul la mélodie sans aucun accompagnement instrumental.
    bonnes:
    - o1
  indices:
    relance: Pense à la chanson « Frère Jacques » et à la façon dont les groupes commencent la même chanson à des moments
      différents.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : cela ne décrit pas un canon ; des voix sur une même note à l''unisson forment une monodie ou une tenue,
      sans décalage mélodique.'
  - si:
      contient:
      - o3
    relance: 'Attention : cette description correspond à l''homorythmie, et non au canon qui repose sur des entrées décalées.'
  - si:
      contient:
      - o4
    relance: 'Faux : un soliste chantant seul sans accompagnement réalise une monodie, alors que le canon nécessite la superposition
      de plusieurs voix décalées.'
  solution: 'Plusieurs voix interprètent exactement la même mélodie mais en entrant les unes après les autres de manière décalée.
    Exact : le canon est une forme d''imitation stricte où les voix entrent successivement en exécutant le même thème mélodique.'
- id: nblm-quel-terme-qualifie-l-organisation-music-5
  type: choix
  difficulte: 2
  enonce: Quel terme qualifie l'organisation musicale dans laquelle plusieurs mélodies différentes et indépendantes sont entendues
    en même temps ?
  reponse:
    options:
    - id: o1
      texte: La polyphonie
    - id: o2
      texte: La monodie
    - id: o3
      texte: Le rondo
    - id: o4
      texte: L'unisson
    bonnes:
    - o1
  indices:
    relance: 'Le préfixe « poly- » signifie « plusieurs » : cherche le mot qui désigne la superposition de plusieurs mélodies
      indépendantes.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la monodie ne comporte qu''une seule ligne mélodique, sans aucune superposition de mélodies
      différentes.'
  - si:
      contient:
      - o3
    relance: 'Faux : le rondo est un plan ou une forme musicale (A B A C A) articulant un refrain et des couplets, pas une
      texture de voix superposées.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''unisson signifie que tout le monde joue ou chante exactement les mêmes notes en même temps, sans mélodies
      indépendantes.'
  solution: 'La polyphonie. Correct : la polyphonie désigne la superposition de plusieurs lignes mélodiques distinctes et
    indépendantes jouées ou chantées simultanément.'
- id: nblm-dans-le-canon-en-re-majeur-de-pachelbel-6
  type: choix
  difficulte: 3
  enonce: Dans le Canon en ré majeur de Pachelbel, quels sont les deux procédés d'organisation musicale superposés tout au
    long de l'œuvre ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un canon entre les trois voix de violons qui entrent de façon décalée.
    - id: o2
      texte: Une basse obstinée de huit notes répétée du début à la fin.
    - id: o3
      texte: Une alternance entre un couplet et un refrain de chanson populaire.
    - id: o4
      texte: Une monodie chantée sans aucun accompagnement instrumental.
    bonnes:
    - o1
    - o2
  indices:
    relance: 'Réfléchis aux deux éléments clés du titre et de la structure de cette œuvre baroque : le procédé d''imitation
      des violons et la formule répétée au grave.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : le Canon de Pachelbel ne suit pas la forme couplet-refrain propre à la chanson.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''œuvre comporte plusieurs lignes instrumentales simultanées (basse et violons), c''est une superposition
      polyphonique et non une monodie.'
  solution: 'Un canon entre les trois voix de violons qui entrent de façon décalée ; Une basse obstinée de huit notes répétée
    du début à la fin. Exact : les trois violons jouent la même mélodie en entrant les uns après les autres en canon.'
- id: nblm-comment-appelle-t-on-la-ligne-melodique-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la ligne mélodique grave qui se répète de façon continue tout au long d'un morceau sous d'autres
    voix qui évoluent ?
  reponse:
    acceptees:
    - basse obstinée
    fautes_tolerees: 1
  indices:
    relance: Réfléchis au terme composé de deux mots désignant une ligne grave (« basse ») qui ne s'arrête jamais (« obstinée
      »).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: basse obstinée. La basse obstinée désigne spécifiquement la formule ou ligne mélodique du registre grave répétée
    de manière continue sous la superposition d'autres voix.
- id: nblm-quel-terme-designe-la-structure-generale-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne la structure générale ou le plan de déroulement d'une œuvre musicale dans le temps ?
  reponse:
    acceptees:
    - forme
    fautes_tolerees: 1
  indices:
    relance: 'Relis l''énoncé : quel mot-clé du cours est en jeu ici ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: forme. La forme musicale (ou plan de l'œuvre) correspond à l'architecture et à l'organisation chronologique des
    différentes parties d'un morceau.
- id: rondo-refrain
  type: nombre
  difficulte: 1
  enonce: Dans un rondo de schéma A B A C A, combien de fois entend-on le refrain (la partie A) ?
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Relis le schéma lettre par lettre et compte seulement la lettre du refrain.
    methode: Dans un rondo, le refrain est la partie qui revient entre des couplets différents.
    etape: 'Barre les lettres B et C : que reste-t-il ?'
  pieges:
  - si:
      valeur: 2
    relance: 'Tu as sans doute oublié une lettre : recompte du début à la fin du schéma.'
  - si:
      valeur: 5
    relance: C'est le nombre total de sections. Ne compte que celles qui sont le refrain.
  solution: 'Le schéma A B A C A contient 3 fois la lettre A (A, A, A) : le refrain est entendu 3 fois.'
- id: texture-violon-piano
  type: choix
  difficulte: 2
  enonce: Un violon joue une mélodie pendant que le piano joue des accords derrière lui. Comment qualifier cette texture ?
  reponse:
    options:
    - id: a
      texte: Une monodie
    - id: b
      texte: Une mélodie accompagnée
    - id: c
      texte: Un canon
    - id: d
      texte: Un ostinato
    bonnes:
    - b
  indices:
    relance: Combien de lignes entends-tu, et quel est le rôle de chacune ?
    methode: Une monodie n'a aucun accompagnement. Compare avec une ligne principale soutenue par des accords.
    etape: 'Le violon chante, le piano soutient : comment appelle-t-on cette organisation ?'
  pieges:
  - si:
      contient:
      - a
    relance: 'Une monodie n''a aucun accompagnement. Ici, le piano joue des accords : que fait-il par rapport au violon ?'
  - si:
      contient:
      - c
    relance: Dans un canon, plusieurs voix jouent la même mélodie en décalé. Ici, le piano joue-t-il la même mélodie que le
      violon ?
  - si:
      contient:
      - d
    relance: 'Un ostinato est un motif répété sans arrêt. Ici, on décrit le rôle de chaque instrument : lequel soutient l''autre
      ?'
  solution: 'Le violon joue la mélodie principale et le piano l''accompagne avec des accords : c''est une mélodie accompagnée.'
