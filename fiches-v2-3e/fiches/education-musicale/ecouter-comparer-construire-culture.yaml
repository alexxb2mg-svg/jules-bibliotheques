# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: ecouter-comparer-construire-culture
version: 2
etat: generee
declencheurs:
- comparer deux versions
- deux interprétations d'une même œuvre
- situer une œuvre dans le temps
- de quelle époque est ce morceau
- repères chronologiques en musique
- commentaire d'écoute
prerequis:
- 4e-ecouter-comparer-construire-culture
- styles
- timbre-et-espace
essentiel: |
  Écouter en musicien, c'est décrire ce qu'on entend avec des mots précis, et pas seulement dire si on aime.

  On décrit les paramètres du son : le timbre (quels instruments ou quelles voix), le tempo (la vitesse), les nuances (l'intensité, de piano à forte), la hauteur (grave ou aigu), le rythme, la forme (comment le morceau est organisé) et le style.

  Situer une œuvre, c'est la placer dans le temps et dans l'espace : le chant grégorien au Moyen Âge, Les Quatre Saisons de Vivaldi publiées en 1725 (période baroque), la Symphonie n° 5 de Beethoven créée en 1808, le Boléro de Ravel en 1928, Clapping Music de Steve Reich en 1972.

  Comparer deux interprétations d'une même œuvre, c'est chercher ce qui reste pareil (la mélodie, le texte, la forme) et ce qui change (le tempo, le timbre, les nuances, le style, l'arrangement). Par exemple, le pianiste Glenn Gould a enregistré l'Aria des Variations Goldberg de Bach en 1955 puis en 1981 : la seconde version est beaucoup plus lente. Autre exemple : les Tableaux d'une exposition, écrits pour piano par Moussorgsky en 1874, ont été orchestrés par Ravel en 1922 : les notes sont proches, mais le timbre change complètement.

  Comparer des musiques éloignées, c'est chercher des points communs et des différences malgré la distance dans le temps ou dans l'espace. Le chant grégorien (Moyen Âge) est chanté par une seule ligne mélodique, sans instrument : on parle de monodie. Clapping Music de Steve Reich (1972) est jouée avec deux paires de mains seulement, sur un rythme répété. Les deux n'ont ni le même style ni la même époque, mais on peut les comparer par le timbre, le rythme et la répétition.

  Comparer des musiques proches, c'est repérer des nuances plus fines : par exemple, deux versions d'une même chanson qui ne diffèrent que par le tempo.

  Ce qu'on attend en évaluation : un commentaire en quatre temps. Ce que j'entends (paramètres, vocabulaire précis). Où et quand (repères). Ce qui ressemble et ce qui diffère. L'effet produit.
methode:
- Écouter une première fois sans rien écrire, pour l'impression générale.
- 'Réécouter en notant les paramètres : timbre, tempo, nuances, hauteur, rythme, forme.'
- 'Situer l''œuvre : époque, lieu, style, et la relier à une autre œuvre connue.'
- 'Pour deux interprétations : noter d''abord les ressemblances, puis les différences, paramètre par paramètre.'
- Conclure en expliquant l'effet produit par les différences.
vocabulaire:
- terme: timbre
  definition: la couleur d'un son, qui permet de reconnaître un instrument ou une voix
- terme: tempo
  definition: la vitesse à laquelle on joue une musique
- terme: nuances
  definition: les degrés d'intensité du son, du très doux (pianissimo) au très fort (fortissimo)
- terme: interprétation
  definition: la façon dont un musicien joue une œuvre qui existe déjà (tempo, nuances, expression)
- terme: orchestration
  definition: le choix des instruments de l'orchestre qui jouent chaque partie d'une œuvre
- terme: hauteur
  definition: caractère grave ou aigu d'un son
- terme: style
  definition: manière propre à une époque, un lieu ou un musicien de composer et de jouer
- terme: monodie
  definition: musique chantée sur une seule ligne mélodique, sans accompagnement
erreurs_frequentes:
- Dire seulement « c'est joli » ou « c'est nul » au lieu de décrire ce qu'on entend.
- Confondre le tempo (la vitesse) et les nuances (la force du son).
- Comparer deux œuvres différentes alors qu'on demande de comparer deux interprétations de la même œuvre.
- Noter uniquement les différences et oublier ce qui reste commun.
- 'Placer toutes les musiques anciennes dans une même période : le Moyen Âge, le baroque et le XIXe siècle sont
  très éloignés.'
exemple:
  enonce: Les Tableaux d'une exposition de Moussorgsky existent dans la version pour piano (1874) et dans l'orchestration
    de Ravel (1922). Compare-les en trois phrases.
  solution: 'Les deux versions gardent les mêmes mélodies et le même plan : on reconnaît la même œuvre. Ce qui change
    surtout, c''est le timbre : un seul piano dans la première version, un orchestre entier avec cuivres, bois,
    cordes et percussions dans la seconde. L''orchestre de Ravel offre plus de couleurs et des contrastes de nuances
    plus spectaculaires.'
exercices:
- id: gould-tempo
  type: choix
  difficulte: 1
  enonce: Glenn Gould a enregistré au piano l'Aria des Variations Goldberg de Bach en 1955, puis à nouveau en 1981.
    La première version dure environ 2 minutes, la seconde environ 3 minutes. Quel paramètre a surtout changé ?
  reponse:
    options:
    - id: a
      texte: Le tempo
    - id: b
      texte: Le timbre de l'instrument
    - id: c
      texte: La mélodie
    - id: d
      texte: Le compositeur
    bonnes:
    - a
  indices:
    relance: La partition est la même et le pianiste aussi. Pourquoi la même musique dure-t-elle plus longtemps
      ?
    methode: 'Élimine ce qui ne change pas : même œuvre de Bach, même instrument, mêmes notes. Que reste-t-il ?'
    etape: Une musique qui dure plus longtemps avec les mêmes notes est jouée plus lentement. Quel mot désigne la
      vitesse ?
  pieges:
  - si:
      contient:
      - b
    relance: Dans les deux enregistrements, c'est le même pianiste au piano. L'instrument a-t-il changé ?
  - si:
      contient:
      - c
    relance: C'est la même partition de Bach. Qu'est-ce qui peut faire durer les mêmes notes plus longtemps ?
  - si:
      contient:
      - d
    relance: Les deux enregistrements jouent la même œuvre de Bach. Qu'est-ce que le pianiste a choisi de modifier
      ?
  solution: 'Le tempo : en 1981, Glenn Gould joue l''Aria beaucoup plus lentement qu''en 1955. Les notes, l''instrument
    et le compositeur sont les mêmes.'
- id: mot-timbre
  type: texte_court
  difficulte: 1
  enonce: Les Tableaux d'une exposition ont été écrits pour piano par Moussorgsky, puis orchestrés par Ravel. Quand
    on passe du piano à l'orchestre, quel paramètre du son, celui qui permet de reconnaître un instrument ou une
    voix, change le plus ?
  reponse:
    acceptees:
    - timbre
    fautes_tolerees: 0
  indices:
    relance: Les yeux fermés, comment reconnais-tu une flûte d'une trompette qui jouent la même note ?
    methode: Parmi les paramètres du son (hauteur, durée, intensité…), cherche celui qui décrit la couleur du son.
    etape: C'est aussi le nom de la petite vignette que l'on colle sur une enveloppe.
  pieges:
  - si:
      valeur: tempo
    relance: Le tempo, c'est la vitesse. Ici, on cherche ce qui permet de reconnaître un instrument.
  - si:
      valeur: hauteur
    relance: La hauteur dit si un son est grave ou aigu. Quel paramètre permet de distinguer un piano d'un violon
      qui jouent la même note ?
  - si:
      valeur: instrument
    relance: C'est bien les instruments qui changent. Quel paramètre du son décrit leur couleur ?
  solution: 'Le timbre : c''est la couleur du son. Au piano seul succèdent les timbres variés de l''orchestre (cordes,
    bois, cuivres, percussions).'
- id: parametres-comparaison
  type: association
  difficulte: 2
  enonce: On compare deux interprétations d'une même œuvre. Relie chaque différence entendue au paramètre qui change.
  reponse:
    gauche:
    - id: duree
      texte: L'une dure 2 minutes, l'autre 3 minutes, avec les mêmes notes
    - id: instruments
      texte: L'une est jouée au piano seul, l'autre par un orchestre
    - id: contrastes
      texte: L'une reste douce du début à la fin, l'autre passe du très doux au très fort
    - id: genre
      texte: L'une est jouée en version rock, l'autre en version jazz
    droite:
    - id: tempo
      texte: Le tempo
    - id: timbre
      texte: Le timbre
    - id: nuances
      texte: Les nuances
    - id: style
      texte: Le style
    paires:
      duree: tempo
      instruments: timbre
      contrastes: nuances
      genre: style
  indices:
    relance: 'Pour chaque différence, demande-toi : est-ce la vitesse, la couleur, la force ou le genre de musique
      qui change ?'
    methode: Relie d'abord la différence la plus évidente, puis élimine les paramètres déjà utilisés.
    etape: Une même musique qui dure plus longtemps est jouée moins vite. Quel paramètre mesure la vitesse ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie les deux paramètres qu''on confond souvent : la vitesse
      et la force du son.'
  - si:
      diagnostic: associations_fausses
    relance: 'Rappelle-toi : tempo = vitesse, timbre = couleur du son, nuances = force, style = genre de musique.'
  solution: 'Durée différente avec les mêmes notes : le tempo. Piano ou orchestre : le timbre. Doux ou contrasté
    : les nuances. Rock ou jazz : le style.'
- id: chronologie-oeuvres
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: gregorien
      texte: Le chant grégorien (Moyen Âge)
    - id: vivaldi
      texte: Les Quatre Saisons de Vivaldi
    - id: beethoven
      texte: La Symphonie n° 5 de Beethoven
    - id: bolero
      texte: Le Boléro de Ravel
    - id: reich
      texte: Clapping Music de Steve Reich
  indices:
    relance: Laquelle de ces musiques est chantée dans les églises depuis des siècles ? Laquelle est faite seulement
      de frappes de mains ?
    methode: 'Place d''abord la plus ancienne et la plus récente, puis range les trois autres par siècle : XVIIIe,
      XIXe, XXe.'
    etape: Vivaldi est un compositeur baroque, publié en 1725. Beethoven crée sa 5e symphonie en 1808. Où se placent
      les deux œuvres du XXe siècle ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux œuvres voisines sont inversées. Repense aux siècles de chacune.
  - si:
      diagnostic: ordre_faux
    relance: Commence par le Moyen Âge, puis avance siècle par siècle jusqu'aux années 1970.
  solution: Chant grégorien (Moyen Âge), Les Quatre Saisons de Vivaldi (publiées en 1725), Symphonie n° 5 de Beethoven
    (1808), Boléro de Ravel (1928), Clapping Music de Steve Reich (1972).
- id: vocabulaire-precis
  type: choix
  difficulte: 2
  enonce: Voici quatre commentaires d'écoute du « Printemps » des Quatre Saisons de Vivaldi. Lequel analyse l'œuvre
    avec un vocabulaire précis ?
  reponse:
    options:
    - id: a
      texte: C'est joli et ça donne envie de sortir
    - id: b
      texte: Un violon soliste dialogue avec l'orchestre à cordes, le tempo est rapide et les passages en tutti
        reviennent régulièrement
    - id: c
      texte: C'est de la musique classique ancienne, comme toutes les musiques avec des violons
    - id: d
      texte: Je préfère la musique que j'écoute d'habitude
    bonnes:
    - b
  indices:
    relance: Quel commentaire pourrait aider quelqu'un qui n'a jamais entendu l'œuvre à l'imaginer ?
    methode: Cherche le commentaire qui nomme des instruments et des paramètres du son (tempo, nuances, forme).
    etape: Élimine les commentaires qui ne parlent que de goût ou d'impression. Il en reste un seul qui décrit la
      musique.
  pieges:
  - si:
      contient:
      - a
    relance: C'est une impression personnelle. Quel commentaire décrit ce qu'on entend avec des mots de musicien
      ?
  - si:
      contient:
      - c
    relance: 'Ce commentaire classe l''œuvre de façon floue et même inexacte : Vivaldi est un compositeur baroque.
      Lequel décrit ce qu''on entend ?'
  - si:
      contient:
      - d
    relance: C'est un goût personnel, pas une analyse. Quel commentaire nomme les instruments et le tempo ?
  solution: 'Le commentaire qui parle du violon soliste, de l''orchestre à cordes, du tempo rapide et du retour
    du tutti : il utilise un vocabulaire précis et décrit vraiment l''œuvre.'
- id: comparer-deux-versions
  type: ouverte
  difficulte: 3
  enonce: 'Voici deux interprétations imaginaires de la chanson traditionnelle « Au clair de la lune ». Version
    A : une voix d''enfant seule, a cappella, tempo lent, nuance piano du début à la fin. Version B : un groupe
    avec batterie, basse et guitare électrique, tempo rapide, voix adulte forte, un solo de guitare au milieu. Compare-les
    en un court paragraphe.'
  criteres:
  - L'élève relève au moins une ressemblance (même mélodie, même texte).
  - L'élève relève au moins trois différences avec le vocabulaire précis (timbre, tempo, nuances, style, forme).
  - L'élève explique l'effet produit par chaque version (calme, intimité, énergie…).
  indices:
    relance: Qu'est-ce qui permet de reconnaître la même chanson dans les deux versions ?
    methode: 'Compare paramètre par paramètre : timbre, tempo, nuances, style. Termine par l''effet produit.'
    etape: 'Tu peux commencer ainsi : « Dans les deux versions, on reconnaît la même mélodie, mais… ».'
  solution: 'Dans les deux versions, on reconnaît la même mélodie et le même texte. Mais le timbre change : une
    voix d''enfant seule dans la version A, un groupe de rock dans la version B. Le tempo est lent en A et rapide
    en B, et la nuance passe de piano à forte. La version B ajoute aussi un solo de guitare, ce qui modifie la forme.
    La version A crée une ambiance calme et intime, la version B une impression d''énergie.'
- id: mot-monodie
  type: texte_court
  difficulte: 2
  enonce: Le chant grégorien du Moyen Âge est chanté sur une seule ligne mélodique, sans accompagnement. Comment
    appelle-t-on ce type de musique ?
  reponse:
    acceptees:
    - monodie
    - monodique
    - une monodie
    fautes_tolerees: 1
  indices:
    relance: Combien de lignes mélodiques entend-on en même temps dans un chant grégorien ?
    methode: Le mot commence par un préfixe grec qui signifie « seul » ou « un seul ».
    etape: Le mot commence par « mono- » et se termine par « -die ».
  pieges:
  - si:
      valeur: polyphonie
    relance: La polyphonie superpose plusieurs mélodies. Ici, il n'y en a qu'une seule. Quel mot dit cela ?
  solution: Une seule mélodie chantée sans accompagnement s'appelle une monodie.
- id: ecart-tableaux
  type: nombre
  difficulte: 2
  enonce: Moussorgsky écrit les Tableaux d'une exposition pour piano en 1874. Ravel en fait une orchestration en
    1922. Combien d'années séparent les deux versions ?
  reponse:
    valeur: 48
    forme: entier
  indices:
    relance: Quelle opération donne le nombre d'années entre deux dates ?
    methode: Soustrais la date la plus ancienne de la plus récente.
    etape: 'Calcule 1922 − 1874 : commence par les unités, puis les dizaines.'
  pieges:
  - si:
      valeur: 3796
    relance: Tu as additionné les deux dates. Pour un écart, on soustrait.
  solution: '1922 − 1874 = 48 : les deux versions sont séparées de 48 ans.'
