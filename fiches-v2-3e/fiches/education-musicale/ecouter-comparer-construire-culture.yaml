- id: nblm-quel-terme-musical-designe-la-vitesse-a-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme musical désigne la vitesse à laquelle une musique est exécutée ?
  reponse:
    acceptees:
    - Tempo
    fautes_tolerees: 1
  indices:
    relance: Il s'agit du mot d'origine italienne désignant la vitesse de la pulsation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: Tempo. Le tempo est le terme exact qui mesure la vitesse de la pulsation dans une œuvre musicale.
- id: nblm-quel-terme-designe-la-couleur-d-un-son-p-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne la « couleur » d'un son, permettant de reconnaître quel instrument ou quelle voix produit la
    musique ?
  reponse:
    acceptees:
    - Timbre
    fautes_tolerees: 1
  indices:
    relance: 'Relis l''énoncé : quel mot-clé du cours est en jeu ici ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
