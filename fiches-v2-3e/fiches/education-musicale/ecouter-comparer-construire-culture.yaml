- id: mot-monodie
  type: texte_court
  difficulte: 2
  enonce: Le chant grégorien du Moyen Âge est chanté sur une seule ligne mélodique, sans accompagnement. Comment appelle-t-on
    ce type de musique ?
  reponse:
    acceptees:
    - monodie
    - monodique
    - une monodie
    fautes_tolerees: 1
  indices:
    relance: Combien de lignes mélodiques entend-on en même temps dans un chant grégorien ?
    methode: Le mot commence par un préfixe grec qui signifie « seul » ou « un seul ».
    etape: Le mot commence par « mono- » et se termine par « -die ».
  pieges:
  - si:
      valeur: polyphonie
    relance: La polyphonie superpose plusieurs mélodies. Ici, il n'y en a qu'une seule. Quel mot dit cela ?
  solution: Une seule mélodie chantée sans accompagnement s'appelle une monodie.
- id: ecart-tableaux
  type: nombre
  difficulte: 2
  enonce: Moussorgsky écrit les Tableaux d'une exposition pour piano en 1874. Ravel en fait une orchestration en 1922. Combien
    d'années séparent les deux versions ?
  reponse:
    valeur: 48
    forme: entier
  indices:
    relance: Quelle opération donne le nombre d'années entre deux dates ?
    methode: Soustrais la date la plus ancienne de la plus récente.
    etape: 'Calcule 1922 − 1874 : commence par les unités, puis les dizaines.'
  pieges:
  - si:
      valeur: 3796
    relance: Tu as additionné les deux dates. Pour un écart, on soustrait.
  solution: '1922 − 1874 = 48 : les deux versions sont séparées de 48 ans.'
