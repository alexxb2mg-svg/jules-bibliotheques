# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: ecouter-comparer-construire-culture
version: 3
etat: verifiee
declencheurs:
- comparer deux versions
- deux interprétations d'une même œuvre
- situer une œuvre dans le temps
- de quelle époque est ce morceau
- repères chronologiques en musique
- commentaire d'écoute
prerequis:
- 4e-ecouter-comparer-construire-culture
- styles
- timbre-et-espace
essentiel: 'Écouter en musicien, c''est décrire ce qu''on entend avec des mots précis, et pas seulement dire si on aime.


  On décrit les paramètres du son : le timbre (quels instruments ou quelles voix), le tempo (la vitesse), les nuances (l''intensité,
  de piano à forte), la hauteur (grave ou aigu), le rythme, la forme (comment le morceau est organisé) et le style.


  Situer une œuvre, c''est la placer dans le temps et dans l''espace : le chant grégorien au Moyen Âge, Les Quatre Saisons
  de Vivaldi publiées en 1725 (période baroque), la Symphonie n° 5 de Beethoven créée en 1808, le Boléro de Ravel en 1928,
  Clapping Music de Steve Reich en 1972.


  Comparer deux interprétations d''une même œuvre, c''est chercher ce qui reste pareil (la mélodie, le texte, la forme) et
  ce qui change (le tempo, le timbre, les nuances, le style, l''arrangement). Par exemple, le pianiste Glenn Gould a enregistré
  l''Aria des Variations Goldberg de Bach en 1955 puis en 1981 : la seconde version est beaucoup plus lente. Autre exemple
  : les Tableaux d''une exposition, écrits pour piano par Moussorgsky en 1874, ont été orchestrés par Ravel en 1922 : les
  notes sont proches, mais le timbre change complètement.


  Comparer des musiques éloignées, c''est chercher des points communs et des différences malgré la distance dans le temps
  ou dans l''espace. Le chant grégorien (Moyen Âge) est chanté par une seule ligne mélodique, sans instrument : on parle de
  monodie. Clapping Music de Steve Reich (1972) est jouée avec deux paires de mains seulement, sur un rythme répété. Les deux
  n''ont ni le même style ni la même époque, mais on peut les comparer par le timbre, le rythme et la répétition.


  Comparer des musiques proches, c''est repérer des nuances plus fines : par exemple, deux versions d''une même chanson qui
  ne diffèrent que par le tempo.


  Ce qu''on attend en évaluation : un commentaire en quatre temps. Ce que j''entends (paramètres, vocabulaire précis). Où
  et quand (repères). Ce qui ressemble et ce qui diffère. L''effet produit.

  '
methode:
- Écouter une première fois sans rien écrire, pour l'impression générale.
- 'Réécouter en notant les paramètres : timbre, tempo, nuances, hauteur, rythme, forme.'
- 'Situer l''œuvre : époque, lieu, style, et la relier à une autre œuvre connue.'
- 'Pour deux interprétations : noter d''abord les ressemblances, puis les différences, paramètre par paramètre.'
- Conclure en expliquant l'effet produit par les différences.
vocabulaire:
- terme: timbre
  definition: la couleur d'un son, qui permet de reconnaître un instrument ou une voix
- terme: tempo
  definition: la vitesse à laquelle on joue une musique
- terme: nuances
  definition: les degrés d'intensité du son, du très doux (pianissimo) au très fort (fortissimo)
- terme: interprétation
  definition: la façon dont un musicien joue une œuvre qui existe déjà (tempo, nuances, expression)
- terme: orchestration
  definition: le choix des instruments de l'orchestre qui jouent chaque partie d'une œuvre
- terme: hauteur
  definition: caractère grave ou aigu d'un son
- terme: style
  definition: manière propre à une époque, un lieu ou un musicien de composer et de jouer
- terme: monodie
  definition: musique chantée sur une seule ligne mélodique, sans accompagnement
erreurs_frequentes:
- Dire seulement « c'est joli » ou « c'est nul » au lieu de décrire ce qu'on entend.
- Confondre le tempo (la vitesse) et les nuances (la force du son).
- Comparer deux œuvres différentes alors qu'on demande de comparer deux interprétations de la même œuvre.
- Noter uniquement les différences et oublier ce qui reste commun.
- 'Placer toutes les musiques anciennes dans une même période : le Moyen Âge, le baroque et le XIXe siècle sont très éloignés.'
exemple:
  enonce: Les Tableaux d'une exposition de Moussorgsky existent dans la version pour piano (1874) et dans l'orchestration
    de Ravel (1922). Compare-les en trois phrases.
  solution: 'Les deux versions gardent les mêmes mélodies et le même plan : on reconnaît la même œuvre. Ce qui change surtout,
    c''est le timbre : un seul piano dans la première version, un orchestre entier avec cuivres, bois, cordes et percussions
    dans la seconde. L''orchestre de Ravel offre plus de couleurs et des contrastes de nuances plus spectaculaires.'
exercices:
- id: gould-tempo
  type: choix
  difficulte: 1
  enonce: Glenn Gould a enregistré au piano l'Aria des Variations Goldberg de Bach en 1955, puis à nouveau en 1981. La première
    version dure environ 2 minutes, la seconde environ 3 minutes. Quel paramètre a surtout changé ?
  reponse:
    options:
    - id: a
      texte: Le tempo
    - id: b
      texte: Le timbre de l'instrument
    - id: c
      texte: La mélodie
    - id: d
      texte: Le compositeur
    bonnes:
    - a
  indices:
    relance: La partition est la même et le pianiste aussi. Pourquoi la même musique dure-t-elle plus longtemps ?
    methode: 'Élimine ce qui ne change pas : même œuvre de Bach, même instrument, mêmes notes. Que reste-t-il ?'
    etape: Une musique qui dure plus longtemps avec les mêmes notes est jouée plus lentement. Quel mot désigne la vitesse
      ?
  pieges:
  - si:
      contient:
      - b
    relance: Dans les deux enregistrements, c'est le même pianiste au piano. L'instrument a-t-il changé ?
  - si:
      contient:
      - c
    relance: C'est la même partition de Bach. Qu'est-ce qui peut faire durer les mêmes notes plus longtemps ?
  - si:
      contient:
      - d
    relance: Les deux enregistrements jouent la même œuvre de Bach. Qu'est-ce que le pianiste a choisi de modifier ?
  solution: 'Le tempo : en 1981, Glenn Gould joue l''Aria beaucoup plus lentement qu''en 1955. Les notes, l''instrument et
    le compositeur sont les mêmes.'
- id: mot-timbre
  type: texte_court
  difficulte: 1
  enonce: Les Tableaux d'une exposition ont été écrits pour piano par Moussorgsky, puis orchestrés par Ravel. Quand on passe
    du piano à l'orchestre, quel paramètre du son, celui qui permet de reconnaître un instrument ou une voix, change le plus
    ?
  reponse:
    acceptees:
    - timbre
    fautes_tolerees: 0
  indices:
    relance: Les yeux fermés, comment reconnais-tu une flûte d'une trompette qui jouent la même note ?
    methode: Parmi les paramètres du son (hauteur, durée, intensité…), cherche celui qui décrit la couleur du son.
    etape: C'est aussi le nom de la petite vignette que l'on colle sur une enveloppe.
  pieges:
  - si:
      valeur: tempo
    relance: Le tempo, c'est la vitesse. Ici, on cherche ce qui permet de reconnaître un instrument.
  - si:
      valeur: hauteur
    relance: La hauteur dit si un son est grave ou aigu. Quel paramètre permet de distinguer un piano d'un violon qui jouent
      la même note ?
  - si:
      valeur: instrument
    relance: C'est bien les instruments qui changent. Quel paramètre du son décrit leur couleur ?
  solution: 'Le timbre : c''est la couleur du son. Au piano seul succèdent les timbres variés de l''orchestre (cordes, bois,
    cuivres, percussions).'
- id: parametres-comparaison
  type: association
  difficulte: 2
  enonce: On compare deux interprétations d'une même œuvre. Relie chaque différence entendue au paramètre qui change.
  reponse:
    gauche:
    - id: duree
      texte: L'une dure 2 minutes, l'autre 3 minutes, avec les mêmes notes
    - id: instruments
      texte: L'une est jouée au piano seul, l'autre par un orchestre
    - id: contrastes
      texte: L'une reste douce du début à la fin, l'autre passe du très doux au très fort
    - id: genre
      texte: L'une est jouée en version rock, l'autre en version jazz
    droite:
    - id: tempo
      texte: Le tempo
    - id: timbre
      texte: Le timbre
    - id: nuances
      texte: Les nuances
    - id: style
      texte: Le style
    paires:
      duree: tempo
      instruments: timbre
      contrastes: nuances
      genre: style
  indices:
    relance: 'Pour chaque différence, demande-toi : est-ce la vitesse, la couleur, la force ou le genre de musique qui change
      ?'
    methode: Relie d'abord la différence la plus évidente, puis élimine les paramètres déjà utilisés.
    etape: Une même musique qui dure plus longtemps est jouée moins vite. Quel paramètre mesure la vitesse ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie les deux paramètres qu''on confond souvent : la vitesse et la force
      du son.'
  - si:
      diagnostic: associations_fausses
    relance: 'Rappelle-toi : tempo = vitesse, timbre = couleur du son, nuances = force, style = genre de musique.'
  solution: 'Durée différente avec les mêmes notes : le tempo. Piano ou orchestre : le timbre. Doux ou contrasté : les nuances.
    Rock ou jazz : le style.'
- id: chronologie-oeuvres
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: gregorien
      texte: Le chant grégorien (Moyen Âge)
    - id: vivaldi
      texte: Les Quatre Saisons de Vivaldi
    - id: beethoven
      texte: La Symphonie n° 5 de Beethoven
    - id: bolero
      texte: Le Boléro de Ravel
    - id: reich
      texte: Clapping Music de Steve Reich
  indices:
    relance: Laquelle de ces musiques est chantée dans les églises depuis des siècles ? Laquelle est faite seulement de frappes
      de mains ?
    methode: 'Place d''abord la plus ancienne et la plus récente, puis range les trois autres par siècle : XVIIIe, XIXe, XXe.'
    etape: Vivaldi est un compositeur baroque, publié en 1725. Beethoven crée sa 5e symphonie en 1808. Où se placent les deux
      œuvres du XXe siècle ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux œuvres voisines sont inversées. Repense aux siècles de chacune.
  - si:
      diagnostic: ordre_faux
    relance: Commence par le Moyen Âge, puis avance siècle par siècle jusqu'aux années 1970.
  solution: Chant grégorien (Moyen Âge), Les Quatre Saisons de Vivaldi (publiées en 1725), Symphonie n° 5 de Beethoven (1808),
    Boléro de Ravel (1928), Clapping Music de Steve Reich (1972).
- id: vocabulaire-precis
  type: choix
  difficulte: 2
  enonce: Voici quatre commentaires d'écoute du « Printemps » des Quatre Saisons de Vivaldi. Lequel analyse l'œuvre avec un
    vocabulaire précis ?
  reponse:
    options:
    - id: a
      texte: C'est joli et ça donne envie de sortir
    - id: b
      texte: Un violon soliste dialogue avec l'orchestre à cordes, le tempo est rapide et les passages en tutti reviennent
        régulièrement
    - id: c
      texte: C'est de la musique classique ancienne, comme toutes les musiques avec des violons
    - id: d
      texte: Je préfère la musique que j'écoute d'habitude
    bonnes:
    - b
  indices:
    relance: Quel commentaire pourrait aider quelqu'un qui n'a jamais entendu l'œuvre à l'imaginer ?
    methode: Cherche le commentaire qui nomme des instruments et des paramètres du son (tempo, nuances, forme).
    etape: Élimine les commentaires qui ne parlent que de goût ou d'impression. Il en reste un seul qui décrit la musique.
  pieges:
  - si:
      contient:
      - a
    relance: C'est une impression personnelle. Quel commentaire décrit ce qu'on entend avec des mots de musicien ?
  - si:
      contient:
      - c
    relance: 'Ce commentaire classe l''œuvre de façon floue et même inexacte : Vivaldi est un compositeur baroque. Lequel
      décrit ce qu''on entend ?'
  - si:
      contient:
      - d
    relance: C'est un goût personnel, pas une analyse. Quel commentaire nomme les instruments et le tempo ?
  solution: 'Le commentaire qui parle du violon soliste, de l''orchestre à cordes, du tempo rapide et du retour du tutti :
    il utilise un vocabulaire précis et décrit vraiment l''œuvre.'
- id: comparer-deux-versions
  type: ouverte
  difficulte: 3
  enonce: 'Voici deux interprétations imaginaires de la chanson traditionnelle « Au clair de la lune ». Version A : une voix
    d''enfant seule, a cappella, tempo lent, nuance piano du début à la fin. Version B : un groupe avec batterie, basse et
    guitare électrique, tempo rapide, voix adulte forte, un solo de guitare au milieu. Compare-les en un court paragraphe.'
  criteres:
  - L'élève relève au moins une ressemblance (même mélodie, même texte).
  - L'élève relève au moins trois différences avec le vocabulaire précis (timbre, tempo, nuances, style, forme).
  - L'élève explique l'effet produit par chaque version (calme, intimité, énergie…).
  indices:
    relance: Qu'est-ce qui permet de reconnaître la même chanson dans les deux versions ?
    methode: 'Compare paramètre par paramètre : timbre, tempo, nuances, style. Termine par l''effet produit.'
    etape: 'Tu peux commencer ainsi : « Dans les deux versions, on reconnaît la même mélodie, mais… ».'
  solution: 'Dans les deux versions, on reconnaît la même mélodie et le même texte. Mais le timbre change : une voix d''enfant
    seule dans la version A, un groupe de rock dans la version B. Le tempo est lent en A et rapide en B, et la nuance passe
    de piano à forte. La version B ajoute aussi un solo de guitare, ce qui modifie la forme. La version A crée une ambiance
    calme et intime, la version B une impression d''énergie.'
- id: nblm-lorsqu-on-compare-deux-interpretations-d-1
  type: choix
  difficulte: 2
  enonce: Lorsqu'on compare deux interprétations d'une même œuvre musicale, que doit-on observer en premier lieu pour mener
    une analyse rigoureuse ?
  reponse:
    options:
    - id: o1
      texte: Noter d'abord ce qui reste identique (mélodie, structure), puis observer les paramètres qui varient (tempo, timbre,
        nuances).
    - id: o2
      texte: Observer uniquement les différences de tempo, sans s'occuper de la mélodie ni de la forme du morceau.
    - id: o3
      texte: Exprimer uniquement son avis personnel (« j'aime » ou « je n'aime pas ») sur chaque version.
    - id: o4
      texte: Comparer le morceau avec une œuvre totalement différente d'un autre compositeur.
    bonnes:
    - o1
  indices:
    relance: 'Pense aux étapes de la méthode comparative : identification des points d''ancrage communs puis observation des
      variations de jeu.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur fréquente de ne noter que les différences et d'oublier de repérer ce qui fait l'unité et l'identité
      du morceau.
  - si:
      contient:
      - o3
    relance: Écouter en musicien exige de dépasser la simple réaction émotionnelle ou le jugement de goût pour décrire objectivement
      ce que l'on entend.
  - si:
      contient:
      - o4
    relance: Une erreur classique consiste à comparer deux œuvres distinctes alors qu'on demande d'analyser deux interprétations
      de la même œuvre.
  solution: 'Noter d''abord ce qui reste identique (mélodie, structure), puis observer les paramètres qui varient (tempo,
    timbre, nuances). C''est la méthode exacte : il faut d''abord repérer ce qui reste commun pour reconnaître l''œuvre, puis
    analyser ce qui change entre les interprétations.'
- id: nblm-a-quelle-periode-de-l-histoire-de-la-mus-2
  type: choix
  difficulte: 2
  enonce: À quelle période de l'histoire de la musique associe-t-on Les Quatre Saisons d'Antonio Vivaldi (publiées en 1725)
    ?
  reponse:
    options:
    - id: o1
      texte: La période baroque.
    - id: o2
      texte: Le Moyen Âge.
    - id: o3
      texte: La période romantique.
    - id: o4
      texte: La musique contemporaine du XXe siècle.
    bonnes:
    - o1
  indices:
    relance: Considère la date de 1725, qui se situe au cœur du XVIIIe siècle, avant la période classique de Mozart et Haydn.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de chronologie : le Moyen Âge s''étend du Ve au XVe siècle et est caractérisé notamment par le chant
      grégorien.'
  - si:
      contient:
      - o4
    relance: Le XXe siècle correspond à des repères comme le Boléro de Ravel (1928) ou Clapping Music de Steve Reich (1972).
  solution: 'La période baroque. Exact : les œuvres de Vivaldi publiées au début du XVIIIe siècle (1725) sont des repères
    majeurs de la période baroque.'
- id: nblm-entre-la-version-pour-piano-des-tableaux-3
  type: choix
  difficulte: 2
  enonce: Entre la version pour piano des Tableaux d'une exposition de Moussorgsky (1874) et son orchestration par Ravel (1922),
    quel paramètre musical change principalement ?
  reponse:
    options:
    - id: o1
      texte: Le timbre, car on passe d'un piano solo à un orchestre symphonique riche en couleurs instrumentales.
    - id: o2
      texte: La mélodie, qui est entièrement réécrite avec de nouvelles notes.
    - id: o3
      texte: Le titre et le sujet de l'œuvre, qui deviennent complètement différents.
    - id: o4
      texte: La forme générale de la pièce, qui est totalement modifiée.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui distingue la couleur sonore d'un seul instrument clavier de celle de plusieurs familles d'instruments
      réparties dans un orchestre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : l''orchestration de Ravel conserve la mélodie originale de Moussorgsky.'
  - si:
      contient:
      - o3
    relance: L'œuvre reste la même (Tableaux d'une exposition), il s'agit d'une adaptation instrumentale et non d'un changement
      de sujet.
  - si:
      contient:
      - o4
    relance: Les deux versions gardent la même structure et le même déroulement chronologique.
  solution: 'Le timbre, car on passe d''un piano solo à un orchestre symphonique riche en couleurs instrumentales. Exact :
    les mélodies et le plan général restent identiques, mais la couleur sonore (le timbre) change complètement grâce à l''orchestration.'
- id: nblm-dans-un-commentaire-d-ecoute-quelle-erre-4
  type: choix
  difficulte: 2
  enonce: Dans un commentaire d'écoute, quelle erreur fréquente faut-il absolument éviter concernant la notion de « tempo
    » ?
  reponse:
    options:
    - id: o1
      texte: Confondre le tempo (la vitesse de la musique) et les nuances (l'intensité du son).
    - id: o2
      texte: Employer des mots italiens comme allegro ou andante pour qualifier la vitesse.
    - id: o3
      texte: Définir le tempo comme l'organisation des parties du morceau.
    - id: o4
      texte: Noter si la musique accélère ou ralentit au cours de l'écoute.
    bonnes:
    - o1
  indices:
    relance: Ne confonds pas la rapidité de la pulsation avec le volume ou la puissance sonore du morceau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'utilisation du vocabulaire italien précis pour indiquer le tempo est au contraire vivement recommandée.
  - si:
      contient:
      - o3
    relance: L'organisation des différentes parties d'un morceau s'appelle la forme, pas le tempo.
  - si:
      contient:
      - o4
    relance: Repérer les variations de vitesse est une remarque d'analyse tout à fait pertinente et exacte.
  solution: 'Confondre le tempo (la vitesse de la musique) et les nuances (l''intensité du son). C''est une confusion classique
    chez les élèves : le tempo désigne la vitesse (lent ou rapide), tandis que la nuance désigne le volume sonore (doux ou
    fort).'
- id: nblm-quelle-difference-remarquable-caracteris-5
  type: choix
  difficulte: 2
  enonce: Quelle différence remarquable caractérise l'enregistrement de l'Aria des Variations Goldberg fait par le pianiste
    Glenn Gould en 1981 par rapport à celui de 1955 ?
  reponse:
    options:
    - id: o1
      texte: La seconde version enregistrée en 1981 est beaucoup plus lente.
    - id: o2
      texte: Glenn Gould a changé d'instrument en jouant à l'orgue au lieu du piano.
    - id: o3
      texte: La mélodie originale de Bach a été totalement modifiée.
    - id: o4
      texte: La version de 1981 est jouée par un orchestre symphonique complet.
    bonnes:
    - o1
  indices:
    relance: Ce changement d'interprétation concerne le choix de la vitesse d'exécution par le pianiste.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : Glenn Gould interprète les deux enregistrements au piano.'
  - si:
      contient:
      - o3
    relance: La mélodie de l'Aria reste la même, c'est l'expression et le tempo du pianiste qui ont évolué.
  - si:
      contient:
      - o4
    relance: Il s'agit dans les deux cas d'une interprétation au piano solo.
  solution: 'La seconde version enregistrée en 1981 est beaucoup plus lente. Exactement : Glenn Gould a choisi une vitesse
    d''exécution (tempo) nettement plus lente dans son interprétation de 1981.'
- id: nblm-quels-sont-les-deux-reflexes-essentiels-6
  type: choix
  difficulte: 3
  enonce: Quels sont les deux réflexes essentiels pour réussir un commentaire d'écoute rigoureux ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Décrire les paramètres du son (timbre, tempo, nuances, forme) avec un vocabulaire musical précis.
    - id: o2
      texte: Situer l'œuvre dans le temps (époque, style) et dans l'espace.
    - id: o3
      texte: Se contenter de donner son jugement de valeur en disant « c'est joli » ou « c'est nul ».
    - id: o4
      texte: Regrouper toutes les musiques anciennes (Moyen Âge, baroque, XIXe siècle) dans une seule et même période.
    bonnes:
    - o1
    - o2
