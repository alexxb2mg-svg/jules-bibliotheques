# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: concevoir-creer-realiser-pieces
version: 3
etat: verifiee
declencheurs:
- composer une pièce
- inventer un morceau en groupe
- générique de la web-radio
- contrainte de durée
- partition graphique
- musique pour une vidéo
prerequis:
- 4e-explorer-imaginer-creer-produire
- explorer-imaginer-creer-produire
- forme
essentiel: 'Concevoir une pièce musicale, c''est créer en tenant compte de trois choses.


  Une référence : un style (baroque, rock, reggae, musique électronique…) ou une œuvre dont on reprend un procédé. Par exemple,
  on peut créer une pièce qui, comme le Boléro de Ravel (1928), repose sur un ostinato et un long crescendo, ou qui, comme
  un concerto de Vivaldi, fait alterner un soliste et le tutti.


  Des contraintes d''interprétation : qui va jouer ? Combien de musiciens, quelles voix, quels instruments, quel niveau ?
  Une pièce pour quatre élèves sans instrument utilisera la voix et les percussions corporelles ; un chœur débutant chantera
  une mélodie simple, dans une tessiture réduite.


  Des contraintes de diffusion : où et comment la pièce sera-t-elle entendue ? Un concert dans le préau, un podcast écouté
  au casque, le générique de 30 secondes d''une web-radio, la bande-son d''une vidéo. Ces contraintes imposent une durée,
  un volume, parfois un effet d''espace (gauche/droite au casque).


  On passe ensuite de l''idée à la réalisation : chercher des idées en improvisant, les fixer (partition, codage graphique
  ou logiciel), organiser la forme, répéter, enregistrer ou jouer devant un public.


  Concevoir, c''est d''abord penser la pièce avant de la jouer : que veut-on faire entendre, avec qui, pour qui ? Créer, c''est
  trouver et assembler des idées musicales. Réaliser, c''est aller jusqu''au bout : jouer la pièce ou l''enregistrer.


  Pour fixer ses idées, on peut utiliser une partition, un codage graphique (dessins et signes) ou un logiciel. Un procédé
  simple aide à construire une pièce : l''ostinato, une formule répétée, sur laquelle on ajoute des sons.


  Une bonne pièce respecte les contraintes de départ : durée, effectif, lieu, référence. Ce qu''on attend en évaluation :
  lister les contraintes, expliquer ce qu''on emprunte au style ou à l''œuvre de référence, décrire la forme et justifier
  au moins un choix.

  '
methode:
- 'Lire la consigne et lister les contraintes : référence, effectif, durée, lieu de diffusion.'
- Chercher des idées en improvisant ou en explorant des sons, en lien avec la référence choisie.
- 'Choisir les meilleures idées et les fixer : partition, codage graphique ou logiciel.'
- 'Organiser la forme : début, développement, fin ; décider des nuances et du tempo.'
- 'Répéter, ajuster, puis réaliser la pièce : l''enregistrer ou la jouer devant un public.'
vocabulaire:
- terme: contrainte d'interprétation
  definition: 'ce qu''impose l''effectif qui va jouer : nombre de musiciens, voix, instruments, niveau'
- terme: contrainte de diffusion
  definition: 'ce qu''impose le lieu ou le support où la pièce sera entendue : durée, volume, format'
- terme: codage graphique
  definition: façon de noter une création avec des symboles inventés (lignes, points, couleurs) au lieu de la partition classique
- terme: crescendo
  definition: augmentation progressive de l'intensité du son
- terme: effectif
  definition: ensemble des musiciens et des voix qui interprètent une pièce
- terme: ostinato
  definition: courte formule (rythme ou mélodie) répétée sans arrêt
- terme: partition
  definition: document écrit qui note la musique à jouer
- terme: tessiture
  definition: ensemble des notes qu'une voix ou un instrument peut jouer confortablement
erreurs_frequentes:
- 'Créer sans relire la consigne : une pièce de trois minutes ne convient pas pour un générique de 30 secondes.'
- Écrire une partie trop difficile pour les élèves qui vont la jouer.
- Citer une œuvre de référence sans en reprendre aucun procédé reconnaissable.
- 'Oublier de fixer ses idées : à la répétition suivante, on ne se souvient plus de ce qu''on avait trouvé.'
- 'Négliger la fin : une pièce qui s''arrête au hasard paraît inachevée.'
exemple:
  enonce: Le collège demande un générique de 30 secondes pour sa web-radio. Ton groupe compte cinq élèves, sans instrument.
    Propose une conception de la pièce.
  solution: 'Contrainte de diffusion : 30 secondes, et une fin nette pour laisser place à la parole. Contrainte d''interprétation
    : cinq élèves sans instrument, donc voix et percussions corporelles. Référence : un ostinato de frappes de mains, inspiré
    de Clapping Music de Steve Reich (1972), qui tourne pendant toute la pièce. Forme : l''ostinato seul, puis deux voix qui
    chantent le nom de la radio en canon, un crescendo, et un arrêt net sur un dernier accent. On enregistre la pièce et on
    vérifie qu''elle dure bien 30 secondes.'
exercices:
- id: contrainte-diffusion
  type: choix
  difficulte: 1
  enonce: Ton groupe crée le générique de la web-radio du collège. Parmi ces éléments, lequel est une contrainte de diffusion
    ?
  reponse:
    options:
    - id: a
      texte: La durée de 30 secondes imposée par la web-radio
    - id: b
      texte: Le style reggae choisi par le groupe
    - id: c
      texte: Le nombre d'élèves disponibles pour chanter
    - id: d
      texte: L'envie d'utiliser des percussions corporelles
    bonnes:
    - a
  indices:
    relance: Diffuser, c'est faire entendre la pièce au public. Laquelle de ces conditions vient du support qui va la diffuser
      ?
    methode: 'Classe chaque élément : vient-il de la référence choisie, de ceux qui jouent, ou de la façon dont la pièce sera
      entendue ?'
    etape: 'Le nombre de chanteurs concerne ceux qui jouent : c''est une contrainte d''interprétation. Qu''impose la radio
      elle-même ?'
  pieges:
  - si:
      contient:
      - b
    relance: Le style est un choix de référence fait par le groupe. Qu'est-ce que la radio impose, elle ?
  - si:
      contient:
      - c
    relance: Le nombre d'élèves concerne ceux qui interprètent la pièce. Quelle contrainte vient de la radio ?
  - si:
      contient:
      - d
    relance: C'est un choix du groupe, pas une contrainte imposée. Que demande la web-radio ?
  solution: 'La durée de 30 secondes : c''est la web-radio, le support de diffusion, qui l''impose. Le nombre d''élèves est
    une contrainte d''interprétation, le style et les percussions sont des choix du groupe.'
- id: contrainte-choix
  type: association
  difficulte: 2
  enonce: Relie chaque contrainte ou référence au choix de création le plus adapté.
  reponse:
    gauche:
    - id: sans-instrument
      texte: Quatre élèves, aucun instrument disponible
    - id: bolero
      texte: Créer à la manière du Boléro de Ravel
    - id: casque
      texte: Une pièce pour un podcast écouté au casque
    - id: debutants
      texte: Un chœur de débutants
    droite:
    - id: corps
      texte: Utiliser la voix et les percussions corporelles
    - id: crescendo
      texte: Un ostinato qui tourne et un volume qui grandit jusqu'à la fin
    - id: stereo
      texte: Faire passer des sons de l'oreille gauche à l'oreille droite
    - id: simple
      texte: Une mélodie simple, dans une tessiture réduite, à l'unisson
    paires:
      sans-instrument: corps
      bolero: crescendo
      casque: stereo
      debutants: simple
  indices:
    relance: Sans instrument, avec quoi peut-on quand même faire de la musique ?
    methode: Pour chaque contrainte, cherche le choix qui en tire parti ou qui la respecte.
    etape: Au casque, on entend séparément l'oreille gauche et l'oreille droite. Quel choix exploite cela ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux choix qui parlent de voix.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends une par une : qui joue ? quelle œuvre de référence ? comment est-ce écouté ? quel niveau ?'
  solution: 'Sans instrument : voix et percussions corporelles. Boléro : ostinato et crescendo. Podcast au casque : jouer
    sur la gauche et la droite. Chœur débutant : mélodie simple, tessiture réduite, à l''unisson.'
- id: mot-crescendo
  type: texte_court
  difficulte: 2
  enonce: Ton groupe veut que sa pièce, comme le Boléro de Ravel, devienne de plus en plus forte jusqu'à la fin. Quel mot
    italien désigne cette augmentation progressive de l'intensité ?
  reponse:
    acceptees:
    - crescendo
    fautes_tolerees: 1
  indices:
    relance: Sur une partition, on le dessine souvent comme un angle qui s'ouvre vers la droite.
    methode: Cherche dans le vocabulaire des nuances le mot qui signifie « en croissant ».
    etape: Le mot commence par « cresc- ».
  pieges:
  - si:
      valeur: decrescendo
    relance: 'C''est le contraire : le son diminue. On cherche le mot pour un son qui grandit.'
  - si:
      valeur: forte
    relance: Forte veut dire « fort », d'un coup. On cherche le mot pour un son qui devient fort peu à peu.
  - si:
      valeur: accelerando
    relance: Accelerando concerne la vitesse. On cherche le mot pour une intensité qui augmente.
  solution: 'Crescendo : l''intensité augmente progressivement, comme dans le Boléro de Ravel.'
- id: reference-baroque
  type: choix
  difficulte: 2
  enonce: Ton groupe crée une courte pièce « à la manière de la musique baroque ». Quels procédés sont de bonnes références
    ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Une basse obstinée répétée sous des mélodies qui changent, comme dans le Canon de Pachelbel
    - id: b
      texte: Une alternance entre un soliste et le tutti, comme dans un concerto de Vivaldi
    - id: c
      texte: Une guitare électrique saturée
    - id: d
      texte: Une boîte à rythmes électronique
    bonnes:
    - a
    - b
  indices:
    relance: Quels instruments existaient à l'époque de Vivaldi et de Pachelbel ?
    methode: Garde les procédés présents dans les œuvres baroques que tu connais, et écarte les instruments inventés au XXe
      siècle.
    etape: La guitare électrique et la boîte à rythmes datent du XXe siècle. Que reste-t-il ?
  pieges:
  - si:
      contient:
      - c
    relance: La guitare électrique apparaît au XXe siècle. Les compositeurs baroques vivaient bien avant. Quels procédés viennent
      de leurs œuvres ?
  - si:
      contient:
      - d
    relance: La boîte à rythmes est un instrument électronique récent. Quels procédés trouve-t-on chez Vivaldi ou Pachelbel
      ?
  - si:
      diagnostic: incomplet
    relance: Il y a une autre référence baroque dans la liste. Pense aux Quatre Saisons de Vivaldi.
  solution: La basse obstinée (Canon de Pachelbel) et l'alternance soliste-tutti (concertos de Vivaldi) sont des procédés
    baroques. La guitare électrique et la boîte à rythmes appartiennent au XXe siècle.
- id: etapes-creation
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes de la conception d'une pièce pour le concert de fin d'année.
  reponse:
    elements:
    - id: consigne
      texte: Lire la consigne et lister les contraintes
    - id: improviser
      texte: Chercher des idées en improvisant et en explorant des sons
    - id: fixer
      texte: Choisir les meilleures idées et les noter
    - id: repeter
      texte: Répéter la pièce et l'ajuster
    - id: jouer
      texte: Jouer la pièce devant le public
  indices:
    relance: Peut-on chercher des idées avant de savoir ce qui est demandé ?
    methode: 'Va de la réflexion vers la réalisation : comprendre, chercher, garder, travailler, présenter.'
    etape: On commence par lire la consigne, puis on cherche des idées. Que faut-il faire avant de pouvoir répéter ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Peut-on répéter des idées qu'on n'a pas encore choisies ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pense au chemin d''une création : de la consigne jusqu''au public.'
  solution: Lire la consigne et lister les contraintes, improviser pour trouver des idées, choisir et noter les meilleures,
    répéter et ajuster, jouer devant le public.
- id: concevoir-ouverture-concert
  type: ouverte
  difficulte: 3
  enonce: Conçois une pièce d'une minute pour ouvrir le concert de fin d'année. Elle sera jouée par six élèves, avec leurs
    voix et des percussions corporelles, dans le préau. Elle doit faire référence à une œuvre ou à un style que tu as étudié.
    Décris ta pièce.
  criteres:
  - 'L''élève respecte les contraintes : durée d''environ une minute, six élèves, voix et percussions corporelles.'
  - L'élève décrit une organisation claire (début, développement, fin) avec au moins un procédé nommé (ostinato, canon, crescendo,
    question-réponse…).
  - L'élève cite une œuvre ou un style de référence et explique ce qu'il lui emprunte.
  indices:
    relance: Quelle œuvre étudiée en classe utilise des procédés faciles à jouer avec la voix et le corps ?
    methode: Décris d'abord l'effectif et la référence, puis le plan de la pièce du début à la fin, en nommant les procédés.
    etape: 'Tu peux commencer ainsi : « Ma pièce s''inspire de… : elle commence par un ostinato de… ».'
  solution: Ma pièce s'inspire de Clapping Music de Steve Reich (1972) et du Boléro de Ravel. Elle commence par un ostinato
    de frappes de mains joué par deux élèves. Deux autres élèves entrent avec des frappes sur les cuisses, puis les deux derniers
    chantent une courte mélodie en canon. Toute la pièce est un crescendo, comme le Boléro, et se termine par un arrêt net
    de tous sur un accent fort. Elle dure environ une minute.
- id: nblm-lorsqu-on-doit-concevoir-et-composer-une-1
  type: choix
  difficulte: 2
  enonce: Lorsqu'on doit concevoir et composer une pièce musicale en classe, quels sont les trois piliers fondamentaux à prendre
    en compte d'après la fiche ?
  reponse:
    options:
    - id: o1
      texte: Une référence, des contraintes d'interprétation et des contraintes de diffusion
    - id: o2
      texte: La tonalité, le solfège classique et l'époque baroque
    - id: o3
      texte: Le prix des instruments, le nombre de micros et la déclaration SACEM
    - id: o4
      texte: La vitesse de la pulsation, le volume sonore et la hauteur des notes
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui t'inspire, aux musiciens qui jouent et au support sur lequel la musique sera écoutée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : ce sont des notions théoriques ou historiques particulières, pas les trois piliers généraux du cahier
      des charges de création.'
  - si:
      contient:
      - o3
    relance: 'Erreur : ces éléments relèvent du matériel ou de la gestion des droits d''auteur, non des piliers de la création
      musicale en classe.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le tempo, les nuances et la hauteur sont des paramètres du son, pas les catégories du cahier des charges
      de conception.'
  solution: 'Une référence, des contraintes d''interprétation et des contraintes de diffusion. C''est exact : la conception
    s''appuie sur un modèle ou style (référence), les possibilités de l''effectif (interprétation) et les exigences du lieu
    ou support (diffusion).'
- id: nblm-ton-groupe-doit-inventer-un-morceau-pour-2
  type: choix
  difficulte: 2
  enonce: Ton groupe doit inventer un morceau pour le générique de 30 secondes de la web-radio du collège. À quel type de
    contrainte correspond cette limite de temps ?
  reponse:
    options:
    - id: o1
      texte: Une contrainte de diffusion
    - id: o2
      texte: Une contrainte d'interprétation
    - id: o3
      texte: Une contrainte de style baroque
    - id: o4
      texte: Une contrainte de nuance dynamique
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui dépend directement du canal par lequel le public va écouter le morceau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre la diffusion (lieu, support, durée) avec l''interprétation (qui concerne le nombre,
      le niveau et les instruments des musiciens).'
  - si:
      contient:
      - o3
    relance: 'Erreur : la durée d''un générique est une exigence technique du cahier des charges, pas une caractéristique
      du style baroque.'
  - si:
      contient:
      - o4
    relance: 'Erreur : les nuances gèrent l''intensité sonore (forte/piano), alors que la durée est liée au support de diffusion.'
  solution: 'Une contrainte de diffusion. C''est exact : le support ou lieu où la pièce est diffusée (ici un générique radio
    de 30 secondes) impose le format et la durée de la musique.'
- id: nblm-si-ton-groupe-doit-composer-une-piece-po-3
  type: choix
  difficulte: 2
  enonce: Si ton groupe doit composer une pièce pour cinq élèves sans aucun instrument de musique, quelle contrainte d'interprétation
    devez-vous respecter ?
  reponse:
    options:
    - id: o1
      texte: Adapter la pièce aux possibilités de l'effectif en utilisant la voix et les percussions corporelles
    - id: o2
      texte: Acheter ou louer des instruments électroniques pour la répétition suivante
    - id: o3
      texte: Écrire une partition symphonique complexe destinée à un orchestre pro
    - id: o4
      texte: Imposer à un seul élève de chanter pendant que les quatre autres écoutent
    bonnes:
    - o1
  indices:
    relance: Considère les moyens sonores naturels apportés par les musiciens eux-mêmes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : il faut faire avec l''effectif et le matériel imposés par la consigne, sans modifier les règles de
      départ.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : proposer une écriture trop difficile ou irréaliste par rapport au niveau et aux moyens du groupe.'
  - si:
      contient:
      - o4
    relance: 'Erreur : l''effectif est de cinq personnes, la pièce doit faire pratiquer l''ensemble du groupe.'
  solution: 'Adapter la pièce aux possibilités de l''effectif en utilisant la voix et les percussions corporelles. C''est
    exact : la contrainte d''interprétation exige d''adapter l''écriture aux musiciens disponibles et à leurs moyens réels
    (ici voix et corps).'
- id: nblm-lorsqu-on-cree-la-musique-pour-une-video-4
  type: choix
  difficulte: 2
  enonce: Lorsqu'on crée la musique pour une vidéo ou un générique, quelle est l'une des erreurs fréquentes à éviter absolument
    d'après la fiche ?
  reponse:
    options:
    - id: o1
      texte: Créer sans relire la consigne et dépasser la durée imposée
    - id: o2
      texte: Fixer ses idées par un schéma ou un enregistrement
    - id: o3
      texte: Choisir une œuvre de référence comme le Boléro de Ravel
    - id: o4
      texte: Structurer le morceau avec une introduction, un développement et une fin
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui se passe si on oublie de vérifier le temps imparti par le sujet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : fixer ses idées est au contraire fortement conseillé pour ne rien oublier lors des séances suivantes.'
  - si:
      contient:
      - o3
    relance: 'Erreur : s''appuyer sur une référence artistique est la méthode recommandée pour trouver des procédés d''écriture.'
  - si:
      contient:
      - o4
    relance: 'Erreur : organiser la forme globale est une étape essentielle d''une création réussie.'
  solution: 'Créer sans relire la consigne et dépasser la durée imposée. C''est exact : composer un morceau de 3 minutes alors
    que le cahier des charges demande un générique de 30 secondes est une erreur classique.'
- id: nblm-pourquoi-est-il-indispensable-de-fixer-s-5
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il indispensable de fixer ses idées musicales (codage, partition ou enregistrement) pendant le travail
    de création en groupe ?
  reponse:
    options:
    - id: o1
      texte: Pour éviter d'oublier les idées trouvées d'une répétition à l'autre
    - id: o2
      texte: Pour supprimer immédiatement les contraintes du cahier des charges
    - id: o3
      texte: Pour pouvoir commercialiser le morceau sur des plateformes payantes
    - id: o4
      texte: Parce qu'il est interdit d'improviser en éducation musicale
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi ce qui se passe quand on revient en cours une semaine plus tard sans aucune note.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : noter la musique permet de la conserver, mais cela n''annule pas les contraintes initiales.'
  - si:
      contient:
      - o3
    relance: 'Erreur : l''objectif du travail de création en classe est pédagogique et non commercial.'
  - si:
      contient:
      - o4
    relance: 'Erreur : l''improvisation est vivement encouragée pour explorer et faire émerger des idées.'
  solution: 'Pour éviter d''oublier les idées trouvées d''une répétition à l''autre. C''est exact : si le groupe ne fixe pas
    ses trouvailles, il risque de perdre le fil de sa création dès la séance suivante.'
- id: nblm-quelles-sont-deux-etapes-methodologiques-6
  type: choix
  difficulte: 3
  enonce: Quelles sont DEUX étapes méthodologiques clés pour passer de l'idée à la réalisation d'un morceau en groupe ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Chercher des idées en improvisant ou en explorant des sons en lien avec la référence
    - id: o2
      texte: Organiser la forme de la pièce (début, développement, fin) et décider des nuances
    - id: o3
      texte: Ignorer l'effectif prévu et changer les instruments au moment de jouer
    - id: o4
      texte: Recopier fidèlement la partition d'un compositeur sans apporter aucune idée nouvelle
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux actions qui consistent d'abord à faire émerger le matériau musical, puis à bâtir la structure
      du morceau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : ne pas respecter l''effectif va à l''encontre des contraintes d''interprétation.'
  - si:
      contient:
      - o4
    relance: 'Faux : une simple copie conforme n''est pas une démarche de création ou d''invention.'
  solution: 'Chercher des idées en improvisant ou en explorant des sons en lien avec la référence ; Organiser la forme de
    la pièce (début, développement, fin) et décider des nuances. C''est exact : l''improvisation et l''exploration sonore
    permettent de tester et trouver le matériau musical du morceau.'
- id: nblm-comment-nomme-t-on-la-facon-de-noter-une-7
  type: texte_court
  difficulte: 1
  enonce: Comment nomme-t-on la façon de noter une création musicale avec des symboles inventés (lignes, points, couleurs)
    à la place du solfège traditionnel ?
  reponse:
    acceptees:
    - codage graphique
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'un système visuel non traditionnel basé sur des formes et des couleurs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: codage graphique. Le codage graphique (ou partition graphique) permet de fixer visuellement des idées musicales
    sans passer par la portée classique.
- id: nblm-quel-procede-musical-consiste-a-repeter-8
  type: texte_court
  difficulte: 1
  enonce: Quel procédé musical consiste à répéter obstinément un motif en boucle, comme la formule de percussions corporelles
    dans Clapping Music de Steve Reich ?
  reponse:
    acceptees:
    - ostinato
    fautes_tolerees: 1
  indices:
    relance: Mot d'origine italienne désignant un motif répété « de manière obstinée ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: ostinato. L'ostinato est un motif rythmique ou mélodique répété obstinément qui peut servir de base pour composer
    un morceau.
- id: duree-parties
  type: nombre
  difficulte: 1
  enonce: Le générique de la web-radio dure 30 secondes. Ton groupe veut 3 parties de même durée. Combien de secondes dure
    chaque partie ?
  reponse:
    valeur: 10
    forme: entier
  indices:
    relance: Il faut partager la durée totale en parts égales. Quelle opération utilises-tu ?
    methode: Divise la durée totale par le nombre de parties.
    etape: Cherche le nombre qui, multiplié par 3, donne 30.
  pieges:
  - si:
      valeur: 90
    relance: Tu as multiplié. Pour partager une durée en parties égales, on divise.
  - si:
      valeur: 27
    relance: Tu as retiré 3 au lieu de partager en 3. Quelle opération partage en parts égales ?
  solution: '30 ÷ 3 = 10 : chaque partie dure 10 secondes (vérification : 10 × 3 = 30).'
- id: mot-ostinato
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on une courte formule rythmique ou mélodique répétée sans arrêt, sur laquelle on peut construire
    une pièce (comme dans le Boléro de Ravel) ?
  reponse:
    acceptees:
    - ostinato
    - un ostinato
    fautes_tolerees: 1
  indices:
    relance: Ce procédé repose sur la répétition. Comment appelle-t-on une formule qui revient tout le temps ?
    methode: C'est un mot italien de huit lettres qui signifie « obstiné ».
    etape: Le mot commence par « osti- » et se termine par « -nato ».
  pieges:
  - si:
      valeur: crescendo
    relance: Le crescendo est une augmentation progressive du volume. Ici, on cherche la formule qui se répète.
  solution: Un ostinato est une formule répétée sans arrêt.
