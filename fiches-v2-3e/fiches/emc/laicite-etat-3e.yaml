format: 2
notion: laicite-etat-3e
version: 1
etat: verifiee
declencheurs:
- séparation Églises État
- neutralité religieuse
- liberté de conscience
- religion dans le débat public
- article premier de 1958 laïcité
- ne salarie ni ne subventionne
prerequis:
- constitution-ve-republique
essentiel: 'La laïcité est le principe de séparation entre les religions et l''État. La Constitution de 1958 affirme, dans
  son article premier, que « la France est une République indivisible, laïque, démocratique et sociale ».


  Concrètement, la laïcité signifie que l''État est indépendant des autorités religieuses : il ne reconnaît, ne salarie ni
  ne subventionne aucun culte, et ne privilégie aucune religion par rapport à une autre. En contrepartie, elle garantit à
  chacun la liberté de conscience (croire ou ne pas croire) et la liberté de culte (pratiquer librement sa religion).


  Ce principe repose en France sur la loi du 9 décembre 1905 concernant la séparation des Églises et de l''État. Son article
  1er garantit le libre exercice des cultes, avec les seules restrictions nécessaires à l''ordre public. Son article 2 dispose
  que « la République ne reconnaît, ne salarie ni ne subventionne aucun culte ».


  La laïcité n''interdit pas aux autorités religieuses de s''exprimer sur des sujets de société : les articles 35.1 et 36.3
  de la loi de 1905 leur permettent de participer au débat public, dans les limites fixées par la loi.'
methode:
- Définir la laïcité par la séparation des religions et de l'État, pas par l'interdiction des religions.
- Citer la loi du 9 décembre 1905 comme fondement juridique de la laïcité en France.
- 'Distinguer les deux libertés garanties : liberté de conscience et liberté de culte.'
- Montrer que la laïcité n'exclut pas les autorités religieuses du débat public, dans les limites fixées par la loi.
vocabulaire:
- terme: laïcité
  definition: le principe de séparation entre les religions et l'État, qui garantit la liberté de conscience et de culte
- terme: liberté de conscience
  definition: le droit de croire, de ne pas croire ou de changer de religion
- terme: culte
  definition: la pratique organisée d'une religion (cérémonies, lieux de culte)
erreurs_frequentes:
- 'Croire que la laïcité interdit de pratiquer une religion : elle protège au contraire la liberté de culte.'
- Penser que la laïcité empêche toute expression des religions dans le débat public.
- Oublier de citer la loi de 1905 comme texte fondateur de la laïcité en France.
- Confondre la laïcité, un principe d'organisation de l'État, avec l'athéisme, une croyance personnelle.
exemple:
  enonce: Explique en une phrase pourquoi la laïcité protège à la fois les croyants et les non-croyants.
  solution: La laïcité garantit à chacun la liberté de croire et de pratiquer sa religion (liberté de culte), mais aussi la
    liberté de ne pas croire, car l'État ne favorise ni n'impose aucune religion.
exercices:
- id: article-loi-1905
  type: choix
  difficulte: 1
  enonce: Quelle loi française fonde juridiquement le principe de laïcité, en organisant la séparation des Églises et de l'État
    ?
  reponse:
    options:
    - id: a
      texte: La loi du 9 décembre 1905
    - id: b
      texte: La Déclaration des droits de l'homme et du citoyen de 1789
    - id: c
      texte: La loi du 22 décembre 2018
    bonnes:
    - a
  indices:
    relance: Cette loi date du tout début du XXe siècle, bien avant la Constitution de la Ve République.
    methode: Cherche la loi consacrée à la séparation entre les Églises et l'État, pas un texte plus récent ni plus ancien.
    etape: L'année de cette loi se termine par « 05 », au début des années 1900.
  pieges:
  - si:
      contient:
      - b
    relance: La DDHC de 1789 garantit des droits et libertés généraux, mais ce n'est pas le texte qui organise la séparation
      des Églises et de l'État.
  - si:
      contient:
      - c
    relance: La loi du 22 décembre 2018 concerne la lutte contre la manipulation de l'information, pas la laïcité.
  solution: La loi du 9 décembre 1905 concernant la séparation des Églises et de l'État fonde juridiquement la laïcité en
    France.
- id: mot-laicite
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le principe de séparation entre les religions et l'État, garantissant la liberté de conscience
    et de culte ?
  reponse:
    acceptees:
    - laïcité
    - laicite
    fautes_tolerees: 1
  indices:
    relance: C'est un mot que l'article premier de la Constitution utilise pour qualifier la République française.
    methode: Ce mot vient de « laïque ». Il désigne un principe, pas une religion en particulier.
    etape: Le mot commence par « laï- » et se termine par « -cité ».
  pieges:
  - si:
      valeur: athéisme
    relance: L'athéisme est une croyance personnelle (ne pas croire en un dieu). Le mot que tu cherches désigne un principe
      d'organisation de l'État, pas une croyance.
  solution: 'Le mot est laïcité : le principe de séparation entre les religions et l''État.'
- id: deux-libertes
  type: association
  difficulte: 2
  enonce: Relie chaque liberté garantie par la laïcité à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Liberté de conscience
    - id: b
      texte: Liberté de culte
    droite:
    - id: x
      texte: Le droit de croire, de ne pas croire ou de changer de religion
    - id: y
      texte: Le droit de pratiquer librement sa religion, dans le respect de l'ordre public
    paires:
      a: x
      b: y
  indices:
    relance: L'une des deux libertés concerne ce qu'on pense intérieurement, l'autre concerne des actes visibles (prier, célébrer
      un culte).
    methode: La « conscience » renvoie à une conviction intérieure ; le « culte » renvoie à une pratique organisée et visible.
    etape: Associe « conscience » à la liberté de croire ou non, et « culte » à la liberté de pratiquer une religion.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Les deux libertés sont inversées. Laquelle concerne une conviction intérieure, laquelle concerne une pratique
      religieuse organisée ?
  - si:
      diagnostic: associations_fausses
    relance: Relis la définition de chaque liberté séparément avant de les associer.
  solution: La liberté de conscience est le droit de croire, de ne pas croire ou de changer de religion. La liberté de culte
    est le droit de pratiquer librement sa religion, avec les seules restrictions nécessaires à l'ordre public.
- id: developpement-laicite
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique le principe de laïcité et son fondement juridique en France.'
  criteres:
  - L'élève définit la laïcité comme la séparation des religions et de l'État.
  - L'élève cite la loi du 9 décembre 1905 comme fondement juridique.
  - L'élève distingue la liberté de conscience et la liberté de culte.
  - L'élève précise que les autorités religieuses peuvent s'exprimer dans le débat public, dans les limites fixées par la
    loi.
  indices:
    relance: Quel principe l'article premier de la Constitution de 1958 attribue-t-il à la République française ?
    methode: Définis d'abord la laïcité, cite ensuite la loi de 1905, puis distingue les deux libertés garanties.
    etape: Tu peux commencer ainsi « La laïcité est le principe de séparation entre les religions et l'État... », puis citer
      la loi de 1905.
  solution: La laïcité est le principe de séparation entre les religions et l'État. L'article premier de la Constitution de
    1958 affirme que la République française est laïque. Ce principe repose sur la loi du 9 décembre 1905 concernant la séparation
    des Églises et de l'État, dont l'article 2 dispose que la République ne reconnaît, ne salarie ni ne subventionne aucun
    culte. En contrepartie, la loi garantit la liberté de conscience (croire ou ne pas croire) et la liberté de culte (pratiquer
    librement sa religion). Les autorités religieuses peuvent néanmoins s'exprimer dans le débat public, dans les limites
    fixées par la loi.
- id: nblm-quel-est-le-texte-fondateur-qui-etablit-1
  type: choix
  difficulte: 2
  enonce: Quel est le texte fondateur qui établit la séparation des Églises et de l'État en France ?
  reponse:
    options:
    - id: o1
      texte: La loi du 9 décembre 1905
    - id: o2
      texte: La Constitution de 1946
    - id: o3
      texte: La Déclaration des droits de l'homme et du citoyen de 1789
    - id: o4
      texte: Le Traité de Rome de 1957
    bonnes:
    - o1
  indices:
    relance: Réfléchis au texte législatif voté au tout début du XXe siècle concernant les cultes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la Constitution de 1946 est un texte constitutionnel ultérieur, pas la loi fondamentale de
      1905.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la DDHC de 1789 garantit des libertés fondamentales, mais n''est pas la loi de séparation
      de 1905.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : le Traité de Rome concerne la construction européenne, pas la laïcité française.'
  solution: La loi du 9 décembre 1905. C'est la loi fondamentale concernant la séparation des Églises et de l'État en France.
- id: nblm-que-dispose-l-article-premier-de-la-cons-2
  type: choix
  difficulte: 2
  enonce: Que dispose l'article premier de la Constitution de la Ve République (1958) à propos de la France ?
  reponse:
    options:
    - id: o1
      texte: La France est une République indivisible, laïque, démocratique et sociale.
    - id: o2
      texte: La France est une monarchie constitutionnelle confessionnelle.
    - id: o3
      texte: La France interdit l'exercice de toutes les religions sur son territoire.
    - id: o4
      texte: La France fait de l'athéisme une religion d'État obligatoire.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi des quatre adjectifs qui caractérisent la République dans le texte constitutionnel de 1958.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la France est une République laïque et non une monarchie.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la laïcité garantit la liberté de religion et ne l''interdit pas.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la laïcité impose la neutralité de l''État et non l''athéisme.'
  solution: La France est une République indivisible, laïque, démocratique et sociale. C'est la définition exacte donnée par
    l'article premier de la Constitution de 1958.
- id: nblm-selon-la-formule-consacree-de-la-loi-de-3
  type: choix
  difficulte: 2
  enonce: Selon la formule consacrée de la loi de 1905, que ne fait pas la République vis-à-vis des cultes ?
  reponse:
    options:
    - id: o1
      texte: Elle ne reconnaît, ne salarie ni ne subventionne aucun culte.
    - id: o2
      texte: Elle salarie tous les ministres du culte de manière égale.
    - id: o3
      texte: Elle subventionne uniquement la religion majoritaire.
    - id: o4
      texte: Elle finance la construction de tous les nouveaux édifices religieux.
    bonnes:
    - o1
  indices:
    relance: Pense au principe de neutralité financière et administrative de l'État vis-à-vis des religions.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la République ne verse aucun salaire aux ministres du culte.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''État laïque ne subventionne aucune religion.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : l''État ne subventionne pas le fonctionnement des cultes.'
  solution: Elle ne reconnaît, ne salarie ni ne subventionne aucun culte. L'article 2 de la loi de 1905 précise explicitement
    que la République ne reconnaît, ne salarie ni ne subventionne aucun culte.
- id: nblm-dans-le-cadre-de-la-laicite-que-garantit-4
  type: choix
  difficulte: 2
  enonce: Dans le cadre de la laïcité, que garantit la liberté de conscience à chaque individu ?
  reponse:
    options:
    - id: o1
      texte: Le droit de croire, de ne pas croire ou de changer de religion.
    - id: o2
      texte: L'obligation de suivre la religion choisie par sa famille.
    - id: o3
      texte: L'interdiction de toute croyance religieuse privée.
    - id: o4
      texte: Le droit de forcer les autres citoyens à adopter ses convictions.
    bonnes:
    - o1
  indices:
    relance: Pense au choix intime et individuel que chacun peut faire concernant ses convictions.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le choix religieux ou philosophique est une liberté individuelle.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la laïcité respecte pleinement les convictions privées.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la liberté de chacun s''arrête là où commence celle des autres.'
  solution: Le droit de croire, de ne pas croire ou de changer de religion. La liberté de conscience protège la conviction
    personnelle de croire, de ne pas croire ou de changer d'avis.
- id: nblm-quelle-est-la-regle-concernant-l-express-5
  type: choix
  difficulte: 2
  enonce: Quelle est la règle concernant l'expression des autorités religieuses dans le débat public ?
  reponse:
    options:
    - id: o1
      texte: Elles peuvent s'exprimer sur des sujets de société dans le respect des lois.
    - id: o2
      texte: Elles ont une interdiction absolue de s'exprimer publiquement.
    - id: o3
      texte: Elles possèdent un droit de veto sur les lois votées par le Parlement.
    - id: o4
      texte: Elles dictent les lois de la République.
    bonnes:
    - o1
  indices:
    relance: Pense à la distinction entre la neutralité de l'État et la liberté d'expression dans le débat citoyen.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la laïcité impose la neutralité aux agents de l''État, pas le silence aux citoyens ou responsables
      religieux.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : le pouvoir législatif appartient aux représentants du peuple et non aux autorités religieuses.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : l''État est indépendant de toute autorité religieuse.'
  solution: Elles peuvent s'exprimer sur des sujets de société dans le respect des lois. La laïcité autorise la participation
    des autorités religieuses au débat citoyen tant que les lois de la République sont respectées.
- id: nblm-quelles-sont-les-deux-propositions-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX propositions exactes qui caractérisent le principe de laïcité en France ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: L'État est neutre et garantit l'égalité de tous les citoyens.
    - id: o2
      texte: Elle garantit le libre exercice des cultes sous réserve de l'ordre public.
    - id: o3
      texte: Elle interdit aux citoyens d'avoir une religion.
    - id: o4
