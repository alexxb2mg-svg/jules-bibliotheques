prerequis:
- constitution-ve-republique
essentiel: 'Deux principes fondent l''organisation de l''État : la séparation des pouvoirs et la laïcité.


  La séparation des pouvoirs évite qu''une seule personne ou un seul organe décide de tout. Le pouvoir législatif fait les
  lois (Parlement : Assemblée nationale et Sénat). Le pouvoir exécutif les applique (président de la République, gouvernement).
  Le pouvoir judiciaire juge (les juges, indépendants). Ces pouvoirs se contrôlent mutuellement.


  La laïcité est le principe de séparation entre les religions et l''État. La Constitution de 1958 l''affirme dans son article
  premier : « La France est une République indivisible, laïque, démocratique et sociale. » Cela signifie que l''autorité politique
  est indépendante des autorités religieuses, et que les autorités religieuses n''exercent pas le pouvoir politique.


  Concrètement, l''État est neutre : il ne privilégie aucune religion. Il ne reconnaît, ne salarie ni ne subventionne aucun
  culte. Il garantit à chacun la liberté de conscience (croire, ne pas croire, changer de religion) et la liberté de culte
  (pratiquer sa religion), dans le respect de l''ordre public.


  Le fondement en France est la loi du 9 décembre 1905 concernant la séparation des Églises et de l''État. Son article 1er
  garantit le libre exercice des cultes, avec les seules restrictions nécessaires à l''ordre public. Son article 2 dispose
  que « la République ne reconnaît, ne salarie ni ne subventionne aucun culte ».


  La laïcité n''interdit pas aux autorités religieuses de s''exprimer. Elles peuvent participer au débat public sur des sujets
  de société, dans les limites fixées par la loi de 1905 (articles 35.1 et 36.3). Ce que la loi interdit, c''est l''usage
  de la religion pour faire pression sur le pouvoir politique par des menaces ou des violences.


  À l''école publique, la laïcité protège la liberté de conscience des élèves. Les agents du service public sont neutres.
  La loi de 2004 interdit le port de signes religieux ostensibles par les élèves des écoles, collèges et lycées publics.


  Au brevet, on attend que tu définisses la laïcité, que tu cites la loi de 1905 et la Constitution, que tu distingues liberté
  de conscience et liberté de culte, et que tu expliques que les autorités religieuses peuvent s''exprimer dans le débat public.

  '
methode:
- Nommer les trois pouvoirs et donner un exemple d'organe pour chacun (Parlement, gouvernement, juges).
- 'Définir la laïcité par sa formule : séparation des religions et de l''État, neutralité de l''État.'
- 'Citer les deux textes : article premier de la Constitution de 1958 et loi du 9 décembre 1905.'
- Distinguer la liberté de conscience (croire ou ne pas croire) et la liberté de culte (pratiquer).
- Rappeler que la laïcité n'interdit pas aux religions de s'exprimer dans le débat public, dans les limites de la loi.
vocabulaire:
- terme: séparation des pouvoirs
  definition: le principe qui répartit les pouvoirs législatif, exécutif et judiciaire entre des organes différents
- terme: laïcité
  definition: le principe de séparation entre les religions et l'État, qui garantit la liberté de conscience
- terme: neutralité de l'État
  definition: le fait que l'État ne favorise ni ne combat aucune religion
- terme: liberté de conscience
  definition: le droit de croire, de ne pas croire ou de changer de religion
- terme: liberté de culte
  definition: le droit de pratiquer librement sa religion, dans le respect de l'ordre public
- terme: loi de 1905
  definition: la loi du 9 décembre 1905 qui sépare les Églises et l'État
- terme: autorité religieuse
  definition: une personne ou une institution qui dirige une religion
- terme: ordre public
  definition: la tranquillité, la sécurité et la santé publiques que l'État doit garantir
erreurs_frequentes:
- 'Croire que la laïcité interdit les religions : elle garantit la liberté de croire et de ne pas croire.'
- 'Croire que les autorités religieuses n''ont pas le droit de s''exprimer : elles peuvent participer au débat public, dans
  les limites de la loi.'
- Confondre séparation des pouvoirs (législatif, exécutif, judiciaire) et séparation des Églises et de l'État.
- Confondre liberté de conscience (croire ou non) et liberté de culte (pratiquer).
- 'Dater la loi de séparation de 1789 ou de 1958 : c''est la loi de 1905.'
exemple:
  enonce: Explique en une phrase pourquoi la laïcité protège à la fois les croyants et les non-croyants.
  solution: La laïcité garantit à chacun la liberté de croire et de pratiquer sa religion (liberté de culte), mais aussi la
    liberté de ne pas croire, car l'État ne favorise ni n'impose aucune religion.
exercices:
- id: article-loi-1905
  type: choix
  difficulte: 1
  enonce: Quelle loi française fonde juridiquement le principe de laïcité, en organisant la séparation des Églises et de l'État
    ?
  reponse:
    options:
    - id: a
      texte: La loi du 9 décembre 1905
    - id: b
      texte: La Déclaration des droits de l'homme et du citoyen de 1789
    - id: c
      texte: La loi du 22 décembre 2018
    bonnes:
    - a
  indices:
    relance: Cette loi date du tout début du XXe siècle, bien avant la Constitution de la Ve République.
    methode: Cherche la loi consacrée à la séparation entre les Églises et l'État, pas un texte plus récent ni plus ancien.
    etape: L'année de cette loi se termine par « 05 », au début des années 1900.
  pieges:
  - si:
      contient:
      - b
    relance: La DDHC de 1789 garantit des droits et libertés généraux, mais ce n'est pas le texte qui organise la séparation
      des Églises et de l'État.
  - si:
      contient:
      - c
    relance: La loi du 22 décembre 2018 concerne la lutte contre la manipulation de l'information, pas la laïcité.
  solution: La loi du 9 décembre 1905 concernant la séparation des Églises et de l'État fonde juridiquement la laïcité en
    France.
- id: mot-laicite
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le principe de séparation entre les religions et l'État, garantissant la liberté de conscience
    et de culte ?
  reponse:
    acceptees:
    - laïcité
    - laicite
    fautes_tolerees: 1
  indices:
    relance: C'est un mot que l'article premier de la Constitution utilise pour qualifier la République française.
    methode: Ce mot vient de « laïque ». Il désigne un principe, pas une religion en particulier.
    etape: Le mot commence par « laï- » et se termine par « -cité ».
  pieges:
  - si:
      valeur: athéisme
    relance: L'athéisme est une croyance personnelle (ne pas croire en un dieu). Le mot que tu cherches désigne un principe
      d'organisation de l'État, pas une croyance.
  solution: 'Le mot est laïcité : le principe de séparation entre les religions et l''État.'
- id: deux-libertes
  type: association
  difficulte: 2
  enonce: Relie chaque liberté garantie par la laïcité à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Liberté de conscience
    - id: b
      texte: Liberté de culte
    droite:
    - id: x
      texte: Le droit de croire, de ne pas croire ou de changer de religion
    - id: y
      texte: Le droit de pratiquer librement sa religion, dans le respect de l'ordre public
    paires:
      a: x
      b: y
  indices:
    relance: L'une des deux libertés concerne ce qu'on pense intérieurement, l'autre concerne des actes visibles (prier, célébrer
      un culte).
    methode: La « conscience » renvoie à une conviction intérieure ; le « culte » renvoie à une pratique organisée et visible.
    etape: Associe « conscience » à la liberté de croire ou non, et « culte » à la liberté de pratiquer une religion.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Les deux libertés sont inversées. Laquelle concerne une conviction intérieure, laquelle concerne une pratique
      religieuse organisée ?
  - si:
      diagnostic: associations_fausses
    relance: Relis la définition de chaque liberté séparément avant de les associer.
  solution: La liberté de conscience est le droit de croire, de ne pas croire ou de changer de religion. La liberté de culte
    est le droit de pratiquer librement sa religion, avec les seules restrictions nécessaires à l'ordre public.
- id: developpement-laicite
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique le principe de laïcité et son fondement juridique en France.'
  criteres:
  - L'élève définit la laïcité comme la séparation des religions et de l'État.
  - L'élève cite la loi du 9 décembre 1905 comme fondement juridique.
  - L'élève distingue la liberté de conscience et la liberté de culte.
  - L'élève précise que les autorités religieuses peuvent s'exprimer dans le débat public, dans les limites fixées par la
    loi.
  indices:
    relance: Quel principe l'article premier de la Constitution de 1958 attribue-t-il à la République française ?
    methode: Définis d'abord la laïcité, cite ensuite la loi de 1905, puis distingue les deux libertés garanties.
    etape: Tu peux commencer ainsi « La laïcité est le principe de séparation entre les religions et l'État... », puis citer
      la loi de 1905.
  solution: La laïcité est le principe de séparation entre les religions et l'État. L'article premier de la Constitution de
    1958 affirme que la République française est laïque. Ce principe repose sur la loi du 9 décembre 1905 concernant la séparation
    des Églises et de l'État, dont l'article 2 dispose que la République ne reconnaît, ne salarie ni ne subventionne aucun
    culte. En contrepartie, la loi garantit la liberté de conscience (croire ou ne pas croire) et la liberté de culte (pratiquer
    librement sa religion). Les autorités religieuses peuvent néanmoins s'exprimer dans le débat public, dans les limites
    fixées par la loi.
- id: annee-loi-separation
  type: nombre
  difficulte: 1
  enonce: En quelle année est votée la loi qui sépare les Églises et l'État en France ?
  reponse:
    valeur: 1905
    forme: entier
  indices:
    relance: Cette loi est aussi appelée par son année de vote.
    methode: Elle date du début du XXe siècle.
    etape: Le nombre commence par 19 et se termine par 05.
  pieges:
  - si:
      valeur: 1958
    relance: 1958 est l'année de la Constitution de la Ve République, qui affirme la laïcité. Quelle année porte la loi de
      séparation ?
  solution: La loi de séparation des Églises et de l'État est votée en 1905 (9 décembre 1905).
- id: les-trois-pouvoirs
  type: association
  difficulte: 1
  enonce: Relie chaque pouvoir à sa mission.
  reponse:
    gauche:
    - id: a
      texte: Pouvoir législatif
    - id: b
      texte: Pouvoir exécutif
    - id: c
      texte: Pouvoir judiciaire
    droite:
    - id: x
      texte: Faire les lois
    - id: y
      texte: Appliquer les lois et gouverner
    - id: z
      texte: Juger, en toute indépendance
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Le préfixe « légis- » renvoie à la loi, « exécut- » à l'action.
    methode: Le Parlement vote les lois, le gouvernement les applique, les juges tranchent les litiges.
    etape: Commence par le pouvoir qui rend la justice.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère le pouvoir dont la mission est de juger.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le pouvoir judiciaire, puis distingue faire les lois et les appliquer.
  solution: Le pouvoir législatif fait les lois, le pouvoir exécutif les applique et gouverne, le pouvoir judiciaire juge.
- id: laicite-cas-pratiques
  type: choix
  difficulte: 2
  enonce: Quelles affirmations sont conformes à la laïcité en France ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: Un responsable religieux peut donner son avis dans un débat public sur un sujet de société
    - id: b
      texte: L'État ne subventionne aucun culte
    - id: c
      texte: L'État impose une religion officielle à tous les citoyens
    - id: d
      texte: Il est interdit de croire en une religion
    bonnes:
    - a
    - b
  indices:
    relance: La laïcité garantit la liberté de conscience et la neutralité de l'État.
    methode: 'Vérifie chaque affirmation à la lumière de la loi de 1905 : neutralité de l''État et libre exercice des cultes.'
    etape: Deux options contredisent la neutralité de l'État ou la liberté de croire.
  pieges:
  - si:
      contient:
      - c
    relance: Une religion officielle est contraire à la neutralité de l'État.
  - si:
      contient:
      - d
    relance: La laïcité garantit au contraire la liberté de croire ou de ne pas croire.
  - si:
      diagnostic: incomplet
    relance: Il y a plus d'une affirmation conforme. Relis les deux premières options.
  solution: Un responsable religieux peut s'exprimer dans le débat public (loi de 1905), et l'État ne subventionne aucun culte.
    L'État n'impose pas de religion, et croire est libre.
- id: date-constitution-laicite
  type: choix
  difficulte: 2
  enonce: Dans quel texte trouve-t-on la phrase « La France est une République indivisible, laïque, démocratique et sociale
    » ?
  reponse:
    options:
    - id: a
      texte: L'article premier de la Constitution de 1958
    - id: b
      texte: L'article 2 de la loi de 1905
    - id: c
      texte: La loi du 22 décembre 2018
    bonnes:
    - a
  indices:
    relance: Cette phrase ouvre le texte fondamental de la République.
    methode: Un article premier est le tout premier article d'un texte. Pense à la « loi des lois ».
    etape: La phrase décrit la République dans son ensemble, pas une loi précise sur les cultes.
  pieges:
  - si:
      contient:
      - b
    relance: L'article 2 de la loi de 1905 dit que la République ne reconnaît, ne salarie ni ne subventionne aucun culte.
      Ce n'est pas cette phrase.
  - si:
      contient:
      - c
    relance: La loi de 2018 traite de la manipulation de l'information, pas de la laïcité.
  solution: La phrase se trouve dans l'article premier de la Constitution de 1958.
