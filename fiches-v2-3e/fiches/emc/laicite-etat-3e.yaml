    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la laïcité ne supprime pas les religions, elle garantit au contraire la liberté de croyance.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la laïcité n''est pas l''athéisme mais la neutralité religieuse de l''État.'
  solution: L'État est neutre et garantit l'égalité de tous les citoyens ; Elle garantit le libre exercice des cultes sous
    réserve de l'ordre public. La neutralité de l'État est un pilier de la laïcité républicaine.
