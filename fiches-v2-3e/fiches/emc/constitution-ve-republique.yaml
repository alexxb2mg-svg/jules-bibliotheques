format: 2
notion: constitution-ve-republique
version: 1
etat: verifiee
declencheurs:
- article premier de 1958
- loi des lois
- Conseil constitutionnel rôle
- hiérarchie des normes
- réforme de 2008
- quinquennat présidentiel
- décentralisation 2003
- Charte de l'environnement 2004
prerequis: []
essentiel: 'La Constitution est le texte juridique le plus important d''un pays : c''est la « loi des lois », que toutes les
  autres lois doivent respecter. En France, la Constitution de la Ve République a été adoptée par référendum le 28 septembre
  1958. Son article premier dispose : « La France est une République indivisible, laïque, démocratique et sociale. »


  Elle garantit les droits et libertés, organise la séparation des pouvoirs (exécutif, législatif, judiciaire) et permet au
  Parlement de contrôler l''action du gouvernement. Elle fait aussi référence à d''autres textes à valeur constitutionnelle
  : la Déclaration des droits de l''homme et du citoyen de 1789, le préambule de la Constitution de 1946, et la Charte de
  l''environnement de 2004.


  Depuis la révision de 2008, la question prioritaire de constitutionnalité (QPC) permet à toute personne partie à un procès
  de contester une loi déjà en vigueur qui porterait atteinte aux droits et libertés garantis par la Constitution. Le juge
  transmet la question, via la Cour de cassation ou le Conseil d''État, puis le Conseil constitutionnel tranche et peut abroger
  la loi. Les juges, indépendants du pouvoir politique, participent ainsi à la garantie des droits et libertés.


  La Constitution a évolué à plusieurs reprises depuis 1958 : élection du président au suffrage universel direct en 1962,
  parité femmes-hommes en politique en 1999, quinquennat présidentiel en 2000, décentralisation en 2003, puis réforme de 2008,
  qui crée notamment la QPC.'
methode:
- Retenir la date d'adoption de la Constitution, le 28 septembre 1958, et le principe de « loi des lois ».
- Citer les trois textes à valeur constitutionnelle liés à la Constitution de 1958 (DDHC 1789, préambule de 1946, Charte de
  l'environnement 2004).
- 'Expliquer le fonctionnement et l''intérêt de la QPC : elle contrôle une loi déjà en vigueur, pas une loi avant sa promulgation.'
- Situer les révisions constitutionnelles dans l'ordre chronologique (1962, 1999, 2000, 2003, 2008).
vocabulaire:
- terme: Constitution
  definition: le texte fondamental qui organise les pouvoirs d'un État et garantit les droits et libertés des citoyens
- terme: séparation des pouvoirs
  definition: le principe selon lequel les pouvoirs exécutif, législatif et judiciaire sont exercés par des organes différents
    et se contrôlent mutuellement
- terme: QPC
  definition: 'question prioritaire de constitutionnalité : procédure qui permet de vérifier qu''une loi déjà appliquée respecte
    la Constitution'
erreurs_frequentes:
- 'Croire que la Constitution ne contient que le texte de 1958 : elle inclut aussi la DDHC de 1789 et le préambule de 1946.'
- Confondre la QPC, qui contrôle une loi déjà en vigueur, et un contrôle qui interviendrait avant la promulgation d'une loi.
- 'Oublier que la Constitution peut être révisée : elle a changé plusieurs fois depuis 1958.'
- Mélanger les dates des différentes révisions (1962, 1999, 2000, 2003, 2008).
exemple:
  enonce: Explique ce qu'est une question prioritaire de constitutionnalité (QPC) et à quoi elle sert.
  solution: La QPC, créée par la révision constitutionnelle de 2008, permet à un citoyen, au cours d'un procès, de demander
    au Conseil constitutionnel de vérifier qu'une loi déjà appliquée ne porte pas atteinte aux droits et libertés garantis
    par la Constitution. Elle garantit ainsi le respect de la Constitution et l'indépendance de la justice.
exercices:
- id: annee-adoption
  type: nombre
  difficulte: 1
  enonce: En quelle année la Constitution de la Ve République est-elle adoptée par référendum ?
  reponse:
    valeur: 1958
    forme: entier
  indices:
    relance: 'Cherche le nom du régime politique français actuel, « la Ve République » : à quelle décennie te fait-il penser
      ?'
    methode: Cette Constitution succède à celle de la IVe République, jugée instable, à la fin des années 1950.
    etape: Le référendum a lieu le 28 septembre de cette année-là. Écris l'année complète.
  pieges:
  - si:
      valeur: 1946
    relance: 1946, c'est l'année du préambule de la Constitution de la IVe République. La Ve République est adoptée plus tard.
  - si:
      valeur: 1962
    relance: 1962, c'est l'année où le président est élu au suffrage universel direct, une révision de la Constitution, pas
      son adoption.
  solution: La Constitution de la Ve République est adoptée par référendum le 28 septembre 1958.
- id: role-qpc
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que la question prioritaire de constitutionnalité (QPC) ?
  reponse:
    options:
    - id: a
      texte: Une procédure qui permet de vérifier qu'une loi déjà en vigueur respecte la Constitution
    - id: b
      texte: Un vote par lequel les citoyens répondent oui ou non à une question
    - id: c
      texte: Une procédure qui empêche une loi d'être promulguée si elle est contestée
    - id: d
      texte: Une élection organisée pour désigner les membres du Conseil constitutionnel
    bonnes:
    - a
  indices:
    relance: La QPC intervient pendant un procès, à propos d'une loi qui est déjà appliquée depuis un certain temps.
    methode: Elle ne bloque pas une loi avant sa promulgation, elle contrôle une loi déjà en vigueur, à la demande d'une personne
      partie à un procès.
    etape: Le Conseil constitutionnel est saisi, via la Cour de cassation ou le Conseil d'État, pour trancher. Quelle option
      correspond à ce contrôle ?
  pieges:
  - si:
      contient:
      - b
    relance: Tu décris un référendum. La QPC se déroule pendant un procès, pas lors d'un vote de tous les citoyens.
  - si:
      contient:
      - c
    relance: 'La QPC ne contrôle pas une loi avant sa promulgation : elle porte sur une loi déjà appliquée depuis un moment.'
  - si:
      contient:
      - d
    relance: Les membres du Conseil constitutionnel ne sont pas élus par les citoyens. La QPC est une procédure juridique,
      pas une élection.
  solution: La QPC est une procédure créée en 2008 qui permet, au cours d'un procès, de vérifier qu'une loi déjà en vigueur
    ne porte pas atteinte aux droits et libertés garantis par la Constitution.
- id: sigle-qpc
  type: texte_court
  difficulte: 2
  enonce: Quel sigle de trois lettres désigne la procédure de contrôle d'une loi déjà en vigueur, créée en 2008 ?
  reponse:
    acceptees:
    - QPC
    fautes_tolerees: 1
  indices:
    relance: 'C''est une abréviation : trois lettres, une par mot.'
    methode: Le premier mot signifie que la question est traitée en priorité par le juge. Le deuxième mot vient de « constitutionnalité
      ».
    etape: Complète les initiales de « question prioritaire de constitutionnalité ».
  pieges:
  - si:
      valeur: DDHC
    relance: La DDHC est la Déclaration des droits de l'homme et du citoyen de 1789, un texte différent. Cherche le sigle
      de la procédure créée en 2008.
  solution: Le sigle est QPC, pour question prioritaire de constitutionnalité.
- id: reperes-revisions
  type: association
  difficulte: 2
  enonce: Relie chaque année à l'évolution de la Constitution qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: '1962'
    - id: b
      texte: '1999'
    - id: c
      texte: '2000'
    - id: d
      texte: '2008'
    droite:
    - id: x
      texte: Élection du président au suffrage universel direct
    - id: y
      texte: Parité femmes-hommes en politique
    - id: z
      texte: Passage au quinquennat présidentiel
    - id: w
      texte: Création de la question prioritaire de constitutionnalité
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Range d'abord les quatre années dans l'ordre chronologique, cela aide à ne pas les confondre.
    methode: 1962 est la révision la plus ancienne de cette liste ; 2008 la plus récente. Associe chaque date à ce que tu
      sais de son contexte.
    etape: Le quinquennat raccourcit le mandat présidentiel de sept à cinq ans, en 2000. La QPC, elle, date de la dernière
      grande réforme de la liste.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier que tu n'as pas inversé deux dates voisines.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord 1962 (suffrage universel direct) et 2008 (QPC), ce sont des repères sûrs, puis place les deux
      autres années.
  solution: '1962 : élection du président au suffrage universel direct. 1999 : parité femmes-hommes en politique. 2000 : passage
    au quinquennat présidentiel. 2008 : création de la QPC.'
- id: developpement-separation-pouvoirs
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique en quoi la Constitution garantit la séparation des pouvoirs et le contrôle de
    l''action du gouvernement.'
  criteres:
  - L'élève cite les trois pouvoirs (exécutif, législatif, judiciaire).
  - L'élève explique que ces pouvoirs sont exercés par des organes différents qui se contrôlent mutuellement.
  - L'élève montre que le Parlement contrôle l'action du gouvernement (vote des lois et du budget, interrogation des ministres).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quels sont les trois pouvoirs présents dans un État, selon la Constitution ?
    methode: Présente les trois pouvoirs, puis explique par un exemple comment le Parlement surveille le gouvernement.
    etape: Tu peux commencer ainsi « La Constitution de 1958 organise la séparation des pouvoirs en trois... », puis nommer
      les trois pouvoirs.
  solution: 'La Constitution de 1958 organise la séparation des pouvoirs en trois : le pouvoir exécutif (gouvernement et président),
    le pouvoir législatif (Parlement) et le pouvoir judiciaire (les juges), pour éviter qu''un seul organe ne concentre tous
    les pouvoirs. Le Parlement, composé de l''Assemblée nationale et du Sénat, contrôle l''action du gouvernement en votant
    les lois et le budget et en interrogeant les ministres. Ce contrôle mutuel des pouvoirs protège les citoyens contre les
    abus de pouvoir.'
