prerequis: []
essentiel: |
  La Constitution est le texte juridique le plus important d'un pays. C'est la « loi des lois » : toutes les lois et tous les règlements doivent la respecter. C'est ce qu'on appelle la hiérarchie des normes : la Constitution est au sommet.

  La Constitution de la Ve République a été approuvée par référendum le 28 septembre 1958. Son article premier dit : « La France est une République indivisible, laïque, démocratique et sociale. »

  Elle garantit les droits et libertés, organise la séparation des pouvoirs (exécutif, législatif, judiciaire) et permet au Parlement de contrôler l'action du gouvernement (questions aux ministres, vote de la loi et du budget, commissions d'enquête).

  Elle fait référence à d'autres textes qui ont aussi valeur constitutionnelle : la Déclaration des droits de l'homme et du citoyen de 1789, le préambule de la Constitution de 1946 et la Charte de l'environnement de 2004. Ensemble, ils forment le « bloc de constitutionnalité ».

  Le Conseil constitutionnel vérifie que les lois respectent la Constitution. Depuis la réforme de 2008, la question prioritaire de constitutionnalité (QPC) permet à toute personne partie à un procès de contester une loi déjà en vigueur qui porterait atteinte aux droits et libertés garantis par la Constitution. Le juge transmet la question, via la Cour de cassation ou le Conseil d'État, puis le Conseil constitutionnel tranche et peut abroger la loi. L'autorité judiciaire est indépendante : c'est une garantie des droits et libertés.

  La Constitution a évolué depuis 1958 :
  1962 : élection du président au suffrage universel direct.
  1999 : parité entre les femmes et les hommes en politique.
  2000 : quinquennat (mandat de 5 ans au lieu de 7).
  2003 : décentralisation (pouvoirs des collectivités locales).
  2004 : Charte de l'environnement (valeur constitutionnelle).
  2008 : grande réforme, qui crée notamment la QPC et renforce le rôle du Parlement.

  Au brevet, on attend que tu expliques la place de la Constitution, que tu cites les textes à valeur constitutionnelle, que tu comprennes la QPC et que tu connaisses les principales dates de son évolution.
methode:
- 'Situer la Constitution au sommet des normes : les lois doivent la respecter.'
- 'Lister ce qu''elle garantit : droits et libertés, séparation des pouvoirs, contrôle du gouvernement par le Parlement.'
- 'Citer les trois textes de référence : Déclaration de 1789, préambule de 1946, Charte de l''environnement de 2004.'
- 'Suivre le trajet d''une QPC : un procès, une loi contestée, un juge qui transmet, le Conseil constitutionnel qui tranche.'
- 'Apprendre les repères par ordre chronologique : 1958, 1962, 1999, 2000, 2003, 2004, 2008.'
vocabulaire:
- terme: Constitution
  definition: le texte juridique fondamental qui organise les pouvoirs et garantit les droits et libertés
- terme: séparation des pouvoirs
  definition: la répartition des pouvoirs législatif, exécutif et judiciaire entre des organes différents
- terme: Parlement
  definition: l'ensemble formé par l'Assemblée nationale et le Sénat, qui vote les lois
- terme: Conseil constitutionnel
  definition: l'institution qui vérifie que les lois respectent la Constitution
- terme: QPC
  definition: la question prioritaire de constitutionnalité, qui permet de contester une loi en vigueur devant le Conseil constitutionnel
- terme: référendum
  definition: un vote où les citoyens répondent par « oui » ou « non » à une question
- terme: hiérarchie des normes
  definition: le classement des règles juridiques, avec la Constitution au sommet
- terme: quinquennat
  definition: un mandat présidentiel de 5 ans
erreurs_frequentes:
- Confondre la Constitution (texte fondamental) et une loi ordinaire, qui doit la respecter.
- 'Croire que la QPC empêche une loi d''être promulguée : elle porte sur une loi déjà en vigueur.'
- 'Mélanger les dates : 1962 (élection du président au suffrage direct), 1999 (parité), 2000 (quinquennat), 2008 (QPC).'
- 'Croire que la Charte de l''environnement date de 1946 ou de 1789 : elle date de 2004.'
- Confondre le Conseil constitutionnel (qui contrôle la conformité des lois) et le Conseil d'État.
exemple:
  enonce: Explique ce qu'est une question prioritaire de constitutionnalité (QPC) et à quoi elle sert.
  solution: La QPC, créée par la révision constitutionnelle de 2008, permet à un citoyen, au cours d'un procès, de demander au Conseil constitutionnel de vérifier qu'une loi déjà appliquée ne porte pas atteinte aux droits et libertés garantis par la Constitution. Elle garantit ainsi le respect de la Constitution et l'indépendance de la justice.
exercices:
- id: annee-adoption
  type: nombre
  difficulte: 1
  enonce: En quelle année la Constitution de la Ve République est-elle adoptée par référendum ?
  reponse:
    valeur: 1958
    forme: entier
  indices:
    relance: 'Cherche le nom du régime politique français actuel, « la Ve République » : à quelle décennie te fait-il penser ?'
    methode: Cette Constitution succède à celle de la IVe République, jugée instable, à la fin des années 1950.
    etape: Le référendum a lieu le 28 septembre de cette année-là. Écris l'année complète.
  pieges:
  - si:
      valeur: 1946
    relance: 1946, c'est l'année du préambule de la Constitution de la IVe République. La Ve République est adoptée plus tard.
  - si:
      valeur: 1962
    relance: 1962, c'est l'année où le président est élu au suffrage universel direct, une révision de la Constitution, pas son adoption.
  solution: La Constitution de la Ve République est adoptée par référendum le 28 septembre 1958.
- id: role-qpc
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que la question prioritaire de constitutionnalité (QPC) ?
  reponse:
    options:
    - id: a
      texte: Une procédure qui permet de vérifier qu'une loi déjà en vigueur respecte la Constitution
    - id: b
      texte: Un vote par lequel les citoyens répondent oui ou non à une question
    - id: c
      texte: Une procédure qui empêche une loi d'être promulguée si elle est contestée
    - id: d
      texte: Une élection organisée pour désigner les membres du Conseil constitutionnel
    bonnes:
    - a
  indices:
    relance: La QPC intervient pendant un procès, à propos d'une loi qui est déjà appliquée depuis un certain temps.
    methode: Elle ne bloque pas une loi avant sa promulgation, elle contrôle une loi déjà en vigueur, à la demande d'une personne partie à un procès.
    etape: Le Conseil constitutionnel est saisi, via la Cour de cassation ou le Conseil d'État, pour trancher. Quelle option correspond à ce contrôle ?
  pieges:
  - si:
      contient:
      - b
    relance: Tu décris un référendum. La QPC se déroule pendant un procès, pas lors d'un vote de tous les citoyens.
  - si:
      contient:
      - c
    relance: 'La QPC ne contrôle pas une loi avant sa promulgation : elle porte sur une loi déjà appliquée depuis un moment.'
  - si:
      contient:
      - d
    relance: Les membres du Conseil constitutionnel ne sont pas élus par les citoyens. La QPC est une procédure juridique, pas une élection.
  solution: La QPC est une procédure créée en 2008 qui permet, au cours d'un procès, de vérifier qu'une loi déjà en vigueur ne porte pas atteinte aux droits et libertés garantis par la Constitution.
- id: sigle-qpc
  type: texte_court
  difficulte: 2
  enonce: Quel sigle de trois lettres désigne la procédure de contrôle d'une loi déjà en vigueur, créée en 2008 ?
  reponse:
    acceptees:
    - QPC
    fautes_tolerees: 1
  indices:
    relance: 'C''est une abréviation : trois lettres, une par mot.'
    methode: Le premier mot signifie que la question est traitée en priorité par le juge. Le deuxième mot vient de « constitutionnalité ».
    etape: Complète les initiales de « question prioritaire de constitutionnalité ».
  pieges:
  - si:
      valeur: DDHC
    relance: La DDHC est la Déclaration des droits de l'homme et du citoyen de 1789, un texte différent. Cherche le sigle de la procédure créée en 2008.
  solution: Le sigle est QPC, pour question prioritaire de constitutionnalité.
- id: reperes-revisions
  type: association
  difficulte: 2
  enonce: Relie chaque année à l'évolution de la Constitution qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: '1962'
    - id: b
      texte: '1999'
    - id: c
      texte: '2000'
    - id: d
      texte: '2008'
    droite:
    - id: x
      texte: Élection du président au suffrage universel direct
    - id: y
      texte: Parité femmes-hommes en politique
    - id: z
      texte: Passage au quinquennat présidentiel
    - id: w
      texte: Création de la question prioritaire de constitutionnalité
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Range d'abord les quatre années dans l'ordre chronologique, cela aide à ne pas les confondre.
    methode: 1962 est la révision la plus ancienne de cette liste ; 2008 la plus récente. Associe chaque date à ce que tu sais de son contexte.
    etape: Le quinquennat raccourcit le mandat présidentiel de sept à cinq ans, en 2000. La QPC, elle, date de la dernière grande réforme de la liste.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier que tu n'as pas inversé deux dates voisines.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord 1962 (suffrage universel direct) et 2008 (QPC), ce sont des repères sûrs, puis place les deux autres années.
  solution: '1962 : élection du président au suffrage universel direct. 1999 : parité femmes-hommes en politique. 2000 : passage au quinquennat présidentiel. 2008 : création de la QPC.'
- id: developpement-separation-pouvoirs
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique en quoi la Constitution garantit la séparation des pouvoirs et le contrôle de l''action du gouvernement.'
  criteres:
  - L'élève cite les trois pouvoirs (exécutif, législatif, judiciaire).
  - L'élève explique que ces pouvoirs sont exercés par des organes différents qui se contrôlent mutuellement.
  - L'élève montre que le Parlement contrôle l'action du gouvernement (vote des lois et du budget, interrogation des ministres).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quels sont les trois pouvoirs présents dans un État, selon la Constitution ?
    methode: Présente les trois pouvoirs, puis explique par un exemple comment le Parlement surveille le gouvernement.
    etape: Tu peux commencer ainsi « La Constitution de 1958 organise la séparation des pouvoirs en trois... », puis nommer les trois pouvoirs.
  solution: 'La Constitution de 1958 organise la séparation des pouvoirs en trois : le pouvoir exécutif (gouvernement et président), le pouvoir législatif (Parlement) et le pouvoir judiciaire (les juges), pour éviter qu''un seul organe ne concentre tous les pouvoirs. Le Parlement, composé de l''Assemblée nationale et du Sénat, contrôle l''action du gouvernement en votant les lois et le budget et en interrogeant les ministres. Ce contrôle mutuel des pouvoirs protège les citoyens contre les abus de pouvoir.'
- id: annee-quinquennat
  type: nombre
  difficulte: 1
  enonce: En quelle année le mandat du président de la République passe-t-il de sept à cinq ans (quinquennat) ?
  reponse:
    valeur: 2000
    forme: entier
  indices:
    relance: Cette réforme date du tournant du siècle.
    methode: Elle a été approuvée par référendum, sous la présidence de Jacques Chirac.
    etape: Le nombre est un chiffre rond, un multiple de mille.
  pieges:
  - si:
      valeur: 2008
    relance: 2008 est l'année de la grande réforme qui crée la QPC. Quelle année pour le quinquennat ?
  - si:
      valeur: 1962
    relance: 1962 concerne l'élection du président au suffrage universel direct, pas la durée du mandat.
  solution: Le quinquennat est adopté en 2000.
- id: textes-valeur-constitutionnelle
  type: choix
  difficulte: 2
  enonce: Quels textes ont valeur constitutionnelle en plus de la Constitution de 1958 ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: La Déclaration des droits de l'homme et du citoyen de 1789
    - id: b
      texte: Le préambule de la Constitution de 1946
    - id: c
      texte: La Charte de l'environnement de 2004
    - id: d
      texte: La loi du 22 décembre 2018
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Le texte à valeur constitutionnelle le plus ancien date de la Révolution.
    methode: Trois textes historiques et récents forment le bloc de constitutionnalité. Une loi ordinaire n'en fait pas partie.
    etape: Une seule option est une loi ordinaire sur l'information.
  pieges:
  - si:
      contient:
      - d
    relance: La loi de 2018 sur la manipulation de l'information est une loi ordinaire, soumise à la Constitution.
  - si:
      diagnostic: incomplet
    relance: Il y a plus de deux textes à valeur constitutionnelle. Relis chaque option.
  solution: Ont valeur constitutionnelle la Déclaration de 1789, le préambule de 1946 et la Charte de l'environnement de 2004. Une loi ordinaire comme celle de 2018 n'en fait pas partie.
- id: parcours-qpc
  type: ordre
  difficulte: 3
  enonce: Range dans l'ordre les étapes d'une question prioritaire de constitutionnalité (QPC).
  reponse:
    elements:
    - id: e1
      texte: Pendant un procès, une partie estime qu'une loi porte atteinte à ses droits garantis par la Constitution
    - id: e2
      texte: Le juge examine la question et la transmet à la Cour de cassation ou au Conseil d'État
    - id: e3
      texte: La juridiction suprême décide de saisir le Conseil constitutionnel
    - id: e4
      texte: Le Conseil constitutionnel tranche et peut abroger la loi
  indices:
    relance: Le Conseil constitutionnel intervient en dernier, et le procès est à l'origine.
    methode: La question naît dans un procès, remonte par les juridictions, puis est jugée.
    etape: La juridiction suprême filtre la question avant le Conseil constitutionnel.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle doit précéder l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère l'étape de départ (le procès) et l'étape d'arrivée (la décision), puis place les deux autres.
  solution: Une partie soulève la question pendant un procès, le juge la transmet à la Cour de cassation ou au Conseil d'État, celle-ci saisit le Conseil constitutionnel, qui tranche.
