format: 2
notion: lanceurs-alerte
version: 2
etat: verifiee
declencheurs:
- protéger un lanceur d'alerte
- dénoncer un scandale
- MeToo
- révéler une affaire financière
- signalement anonyme
- loi du 21 mars 2022
- dénoncer des faits graves
- protection de l'identité
- risques représailles
- Mediator LuxLeaks
prerequis: []
essentiel: 'Un lanceur d''alerte est une personne qui signale, de bonne foi et sans intérêt personnel, un danger ou un scandale
  pour protéger l''intérêt général. Cela peut concerner la santé, l''environnement, la finance, la corruption ou une atteinte
  aux droits.


  Il ne faut pas le confondre avec un délateur. Le délateur dénonce par intérêt personnel ou par malveillance. Ce qui compte,
  c''est l''intention : bonne foi et intérêt général.


  Exemples connus. Irène Frachon, médecin, a alerté sur les dangers du Mediator, un médicament. Antoine Deltour a révélé des
  accords fiscaux dans l''affaire « LuxLeaks » (affaire financière). Edward Snowden a révélé en 2013 des programmes de surveillance
  de masse.


  Les médias sociaux sont un lieu de débats et de mobilisations. Des lanceurs d''alerte y prennent des risques pour informer
  leurs concitoyens : menaces, procès, perte d''emploi, harcèlement. Le mouvement #MeToo est un exemple de mobilisation :
  à partir d''octobre 2017, de très nombreuses personnes ont témoigné publiquement de violences sexuelles, et le mot-dièse
  s''est diffusé dans le monde entier.


  En France, la loi du 21 mars 2022 vise à améliorer la protection des lanceurs d''alerte. Elle protège leur identité, qui
  ne peut être divulguée qu''avec leur accord, sauf demande de la justice. Elle les protège aussi contre les représailles,
  comme un licenciement ou une sanction, et elle protège les personnes qui les aident. Elle organise plusieurs voies de signalement
  : dans l''organisation concernée, auprès d''une autorité, et dans certains cas de façon publique.


  Dans une démocratie, la liberté d''expression et une presse libre facilitent le travail des lanceurs d''alerte. Dans un
  régime autoritaire, ils peuvent être réduits au silence.


  Au brevet, on attend que tu définisses le lanceur d''alerte, que tu le distingues du délateur, que tu analyses un exemple
  (#MeToo, une affaire financière) et que tu cites la loi du 21 mars 2022.

  '
methode:
- 'Définir : quelqu''un qui signale un danger ou un scandale, de bonne foi, dans l''intérêt général.'
- 'Vérifier l''intention : intérêt général et bonne foi (lanceur d''alerte), ou intérêt personnel et malveillance (délateur)
  ?'
- 'Identifier les risques pris par la personne : représailles, menaces, procès, perte d''emploi.'
- 'Citer la protection prévue par la loi du 21 mars 2022 : identité protégée, protection contre les représailles.'
- Illustrer par un exemple précis (#MeToo, affaire financière, scandale sanitaire), puis conclure.
vocabulaire:
- terme: lanceur d'alerte
  definition: une personne qui signale de bonne foi et sans intérêt personnel un danger ou un scandale, pour protéger l'intérêt
    général
- terme: délateur
  definition: une personne qui dénonce quelqu'un par intérêt personnel ou par malveillance
- terme: intérêt général
  definition: ce qui profite à l'ensemble de la société, et pas à une seule personne
- terme: bonne foi
  definition: le fait d'agir en croyant sincèrement à la vérité de ce qu'on signale
- terme: représailles
  definition: une mesure de vengeance contre quelqu'un, par exemple un licenciement ou une sanction
- terme: '#MeToo'
  definition: un mouvement lancé en 2017 où de nombreuses personnes ont témoigné publiquement de violences sexuelles
- terme: loi du 21 mars 2022
  definition: la loi française qui améliore la protection des lanceurs d'alerte
- terme: médias sociaux
  definition: les sites et applications où chacun peut publier et partager des contenus
erreurs_frequentes:
- 'Confondre un lanceur d''alerte et un délateur : c''est l''intention (intérêt général ou intérêt personnel) qui les distingue.'
- 'Croire qu''un lanceur d''alerte agit forcément de manière anonyme : la loi protège son identité, mais il n''est pas obligé
  d''être anonyme.'
- 'Réduire les lanceurs d''alerte à #MeToo : il y a aussi des affaires financières, sanitaires ou environnementales.'
- 'Croire qu''un lanceur d''alerte ne prend aucun risque : représailles et poursuites sont possibles, d''où la loi de 2022.'
- Confondre la loi de 2022 sur les lanceurs d'alerte et la loi de 2018 sur la manipulation de l'information.
exemple:
  enonce: Quelle protection la loi du 21 mars 2022 apporte-t-elle aux lanceurs d'alerte ?
  solution: Elle protège en particulier l'identité du lanceur d'alerte, qui ne peut être divulguée qu'avec son consentement,
    sauf communication à l'autorité judiciaire dans les cas prévus par la loi.
exercices:
- id: annee-loi-protection-lanceurs
  type: nombre
  difficulte: 1
  enonce: En quelle année la loi française visant à améliorer la protection des lanceurs d'alerte est-elle adoptée ?
  reponse:
    valeur: 2022
    forme: entier
  indices:
    relance: Cette loi est plus récente que la loi de 2018 sur la manipulation de l'information.
    methode: Elle protège notamment l'identité du lanceur d'alerte, qui ne peut être divulguée qu'avec son consentement.
    etape: L'année se situe dans les années 2020, peu après la crise sanitaire liée à la Covid-19.
  pieges:
  - si:
      valeur: 2018
    relance: 2018 est l'année de la loi relative à la lutte contre la manipulation de l'information, un texte différent.
  - si:
      valeur: 2019
    relance: 2019 est l'année de création du service national universel (SNU), pas de la loi sur les lanceurs d'alerte.
  solution: La loi visant à améliorer la protection des lanceurs d'alerte est adoptée le 21 mars 2022.
- id: lanceur-alerte-vs-delateur
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qui distingue un lanceur d'alerte d'un délateur ?
  reponse:
    options:
    - id: a
      texte: Le lanceur d'alerte agit de bonne foi et sans intérêt personnel, pour protéger l'intérêt général
    - id: b
      texte: Le lanceur d'alerte agit toujours de manière anonyme, contrairement au délateur
    - id: c
      texte: Le lanceur d'alerte ne s'exprime que sur les médias sociaux, contrairement au délateur
    bonnes:
    - a
  indices:
    relance: Pense à l'intention de la personne qui signale un fait, pas au moyen qu'elle utilise pour le faire.
    methode: Le délateur agit par intérêt personnel ou malveillance ; ce n'est pas le cas du lanceur d'alerte.
    etape: La bonne réponse porte sur la bonne foi et l'intérêt général, pas sur l'anonymat ni sur le support de diffusion.
  pieges:
  - si:
      contient:
      - b
    relance: L'anonymat n'est pas ce qui distingue un lanceur d'alerte d'un délateur ; c'est son intention, l'intérêt général
      plutôt que l'intérêt personnel.
  - si:
      contient:
      - c
    relance: Le lanceur d'alerte ne s'exprime pas seulement sur les médias sociaux ; ce n'est pas le support qui le distingue
      du délateur, mais son intention.
  solution: Le lanceur d'alerte agit de bonne foi, sans intérêt personnel, pour protéger l'intérêt général ; le délateur dénonce
    par intérêt personnel ou malveillance.
- id: chronologie-metoo-loi
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: metoo
      texte: 'Le mouvement #MeToo se diffuse largement sur les médias sociaux'
    - id: loi2018
      texte: La loi relative à la lutte contre la manipulation de l'information est adoptée
    - id: loi2022
      texte: La loi visant à améliorer la protection des lanceurs d'alerte est adoptée
  indices:
    relance: Situe d'abord la loi la plus récente, puis compare le mouvement de témoignages à l'autre loi.
    methode: 'Le mouvement de témoignages date des années 2010 : il précède les deux lois.'
    etape: Une des deux lois de la liste date de la fin des années 2010, l'autre du début des années 2020.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux événements voisins sont inversés. Lequel des deux a eu lieu en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus récent (début des années 2020), puis classe les deux autres, tous deux des
      années 2010.
  solution: 'Le mouvement #MeToo se diffuse à partir d''octobre 2017, puis la loi relative à la lutte contre la manipulation
    de l''information est adoptée en 2018, puis la loi visant à améliorer la protection des lanceurs d''alerte est adoptée
    le 21 mars 2022.'
- id: developpement-metoo-lanceurs-alerte
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : présente le mouvement #MeToo comme un exemple de mobilisation portée par des lanceurs
    d''alerte.'
  criteres:
  - 'L''élève présente le mouvement : des personnes témoignent publiquement de violences sexuelles.'
  - L'élève précise que les médias sociaux ont facilité la circulation de ces témoignages.
  - L'élève relie ces témoignages à la notion de lancement d'alerte (bonne foi, intérêt général, risques pris).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quel type de faits les personnes ayant participé au mouvement ont-elles rendus publics ?
    methode: Présente d'abord le mouvement, puis explique en quoi il relève d'un lancement d'alerte.
    etape: 'Tu peux commencer ainsi « Le mouvement #MeToo est un exemple de mobilisation citoyenne portée par des lanceurs
      d''alerte... », puis développer.'
  solution: 'Le mouvement #MeToo est un exemple de mobilisation citoyenne portée par des lanceurs d''alerte. De nombreuses
    personnes ont témoigné publiquement de violences sexuelles, notamment via les médias sociaux, qui ont permis une large
    diffusion de ces témoignages. Ces prises de parole relèvent d''un lancement d''alerte lorsqu''elles visent, de bonne foi,
    à protéger d''autres personnes en dénonçant des faits graves. Un cadre légal protecteur, comme la loi de 2022, est donc
    essentiel pour accompagner ce type de mobilisation.'
- id: nblm-comment-se-definit-un-lanceur-d-alerte-s-1
  type: choix
  difficulte: 2
  enonce: Comment se définit un lanceur d'alerte selon la fiche de cours d'EMC ?
  reponse:
    options:
    - id: o1
      texte: Une personne qui signale de bonne foi un danger ou un scandale pour protéger l'intérêt général.
    - id: o2
      texte: Une personne qui dénonce un voisin par vengeance ou pour obtenir une récompense financière.
    - id: o3
      texte: Un journaliste professionnel obligatoirement salarié d'une grande chaîne de télévision.
    - id: o4
      texte: Un membre du gouvernement chargé de rédiger de nouvelles lois.
    bonnes:
    - o1
  indices:
    relance: 'Pense à l''intention morale : agir pour le bien collectif et sans profit personnel.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, agir par intérêt personnel ou malveillance caractérise un délateur et non un lanceur d'alerte.
  - si:
      contient:
      - o3
    relance: Un lanceur d'alerte peut être n'importe quel citoyen, employé ou témoin, pas nécessairement un journaliste.
  - si:
      contient:
      - o4
    relance: Un membre du gouvernement exerce le pouvoir exécutif, ce n'est pas la fonction d'un lanceur d'alerte.
  solution: 'Une personne qui signale de bonne foi un danger ou un scandale pour protéger l''intérêt général. C''est la définition
    exacte : le lanceur d''alerte agit de bonne foi et pour le bien de tous, sans chercher d''intérêt personnel.'
- id: nblm-quelle-protection-essentielle-la-loi-du-2
  type: choix
  difficulte: 2
  enonce: Quelle protection essentielle la loi du 21 mars 2022 accorde-t-elle aux lanceurs d'alerte en France ?
  reponse:
    options:
    - id: o1
      texte: Elle protège leur identité, qui ne peut être divulguée sans leur consentement.
    - id: o2
      texte: Elle leur verse automatiquement une prime d'argent financée par l'État.
    - id: o3
      texte: Elle leur offre un poste d'élu ou de délégué au sein des institutions publiques.
    - id: o4
      texte: Elle interdit toute publication d'informations sur les réseaux sociaux.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui garantit le secret de son nom pour éviter des sanctions de son employeur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, le lanceur d'alerte agit sans intérêt financier et la loi ne prévoit pas de récompense d'argent.
  - si:
      contient:
      - o3
    relance: Faux, la loi offre une protection juridique et confidentielle, mais aucun mandat politique.
  - si:
      contient:
      - o4
    relance: Au contraire, les réseaux sociaux peuvent servir de relais pour informer le public et dénoncer un scandale.
  solution: 'Elle protège leur identité, qui ne peut être divulguée sans leur consentement. C''est exact : la loi du 21 mars
    2022 garantit la confidentialité de l''identité du lanceur d''alerte pour éviter les représailles.'
- id: nblm-quel-mouvement-social-ne-sur-les-reseaux-3
  type: choix
  difficulte: 2
  enonce: Quel mouvement social né sur les réseaux sociaux est cité pour illustrer la dénonciation publique de violences sexuelles
    ?
  reponse:
    options:
    - id: o1
      texte: 'Le mouvement #MeToo'
    - id: o2
      texte: Le Service National Universel (SNU)
    - id: o3
      texte: La Question Prioritaire de Constitutionnalité (QPC)
    - id: o4
      texte: Le Conseil de l'Europe
    bonnes:
    - o1
  indices:
    relance: Cherche le nom du mouvement précédé d'un mot-dièse (#) en lien avec la parole des femmes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le SNU est un dispositif d'engagement pour la jeunesse, pas un mouvement social de dénonciation.
  - si:
      contient:
      - o3
    relance: La QPC est une procédure juridique devant le Conseil constitutionnel, rien à voir avec un mouvement social.
  - si:
      contient:
      - o4
    relance: Le Conseil de l'Europe est une organisation internationale, pas un mouvement de signalement citoyen.
  solution: 'Le mouvement #MeToo. C''est exact : #MeToo a permis à de nombreuses victimes et témoins de prendre la parole
    publiquement.'
- id: nblm-dans-quel-domaine-d-activite-un-lanceur-4
  type: choix
  difficulte: 2
  enonce: Dans quel domaine d'activité un lanceur d'alerte peut-il intervenir pour révéler des fraudes ou des détournements
    d'argent dissimulés ?
  reponse:
    options:
    - id: o1
      texte: Révéler une affaire financière.
    - id: o2
      texte: Financer la campagne électorale d'un candidat.
    - id: o3
      texte: Changer le règlement intérieur d'un collège.
    - id: o4
      texte: Annuler les résultats d'un sondage d'opinion.
    bonnes:
    - o1
  indices:
    relance: Pense au secteur en rapport avec la gestion des finances et de l'argent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Financer un candidat est un choix politique personnel, pas une révélation de dysfonctionnement grave.
  - si:
      contient:
      - o3
    relance: C'est une décision de démocratie scolaire, non la dénonciation d'un scandale masqué.
  - si:
      contient:
      - o4
    relance: Un sondage est une mesure d'opinion, sa contestation ne constitue pas un signalement d'affaire financière.
  solution: 'Révéler une affaire financière. C''est exact : la dénonciation de fraudes ou d''affaires financières cachées
    fait partie des domaines majeurs d''alerte.'
- id: nblm-pourquoi-le-role-du-lanceur-d-alerte-est-5
  type: choix
  difficulte: 2
  enonce: Pourquoi le rôle du lanceur d'alerte est-il plus facile à exercer dans une démocratie que dans un régime autoritaire
    ?
  reponse:
    options:
    - id: o1
      texte: Parce que la liberté d'expression y est garantie, alors qu'un régime autoritaire cherche à le réduire au silence.
    - id: o2
      texte: Parce qu'il n'existe aucun danger ni aucun dysfonctionnement dans une démocratie.
    - id: o3
      texte: Parce que le lanceur d'alerte y est nommé automatiquement juge d'instruction.
    - id: o4
      texte: Parce que les réseaux sociaux y sont totalement contrôlés par la police.
    bonnes:
    - o1
  indices:
    relance: Identifie la liberté fondamentale de valeur constitutionnelle qui permet de publier la vérité sans crainte de
      censure.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : des dysfonctionnements peuvent exister en démocratie, mais les citoyens ont le droit d''en parler librement.'
  - si:
      contient:
      - o3
    relance: 'Faux : le lanceur d''alerte reste un citoyen ou un employé, il ne devient pas magistrat.'
  - si:
      contient:
      - o4
    relance: 'Faux : la démocratie garantit une liberté de circulation des idées sur Internet sans contrôle policier étatique.'
  solution: 'Parce que la liberté d''expression y est garantie, alors qu''un régime autoritaire cherche à le réduire au silence.
    C''est exact : la liberté d''expression en démocratie protège le droit d''informer, contrairement aux dictatures.'
