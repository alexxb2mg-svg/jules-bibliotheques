format: 2
notion: lanceurs-alerte
version: 2
etat: generee
declencheurs:
- protéger un lanceur d'alerte
- dénoncer un scandale
- MeToo
- révéler une affaire financière
- signalement anonyme
- loi du 21 mars 2022
- dénoncer des faits graves
- protection de l'identité
- risques représailles
- Mediator LuxLeaks
prerequis: []
essentiel: |
  Un lanceur d'alerte est une personne qui signale, de bonne foi et sans intérêt personnel, un danger ou un scandale pour protéger l'intérêt général. Cela peut concerner la santé, l'environnement, la finance, la corruption ou une atteinte aux droits.

  Il ne faut pas le confondre avec un délateur. Le délateur dénonce par intérêt personnel ou par malveillance. Ce qui compte, c'est l'intention : bonne foi et intérêt général.

  Exemples connus. Irène Frachon, médecin, a alerté sur les dangers du Mediator, un médicament. Antoine Deltour a révélé des accords fiscaux dans l'affaire « LuxLeaks » (affaire financière). Edward Snowden a révélé en 2013 des programmes de surveillance de masse.

  Les médias sociaux sont un lieu de débats et de mobilisations. Des lanceurs d'alerte y prennent des risques pour informer leurs concitoyens : menaces, procès, perte d'emploi, harcèlement. Le mouvement #MeToo est un exemple de mobilisation : à partir d'octobre 2017, de très nombreuses personnes ont témoigné publiquement de violences sexuelles, et le mot-dièse s'est diffusé dans le monde entier.

  En France, la loi du 21 mars 2022 vise à améliorer la protection des lanceurs d'alerte. Elle protège leur identité, qui ne peut être divulguée qu'avec leur accord, sauf demande de la justice. Elle les protège aussi contre les représailles, comme un licenciement ou une sanction, et elle protège les personnes qui les aident. Elle organise plusieurs voies de signalement : dans l'organisation concernée, auprès d'une autorité, et dans certains cas de façon publique.

  Dans une démocratie, la liberté d'expression et une presse libre facilitent le travail des lanceurs d'alerte. Dans un régime autoritaire, ils peuvent être réduits au silence.

  Au brevet, on attend que tu définisses le lanceur d'alerte, que tu le distingues du délateur, que tu analyses un exemple (#MeToo, une affaire financière) et que tu cites la loi du 21 mars 2022.
methode:
- 'Définir : quelqu''un qui signale un danger ou un scandale, de bonne foi, dans l''intérêt général.'
- 'Vérifier l''intention : intérêt général et bonne foi (lanceur d''alerte), ou intérêt personnel et malveillance (délateur) ?'
- 'Identifier les risques pris par la personne : représailles, menaces, procès, perte d''emploi.'
- 'Citer la protection prévue par la loi du 21 mars 2022 : identité protégée, protection contre les représailles.'
- Illustrer par un exemple précis (#MeToo, affaire financière, scandale sanitaire), puis conclure.
vocabulaire:
- terme: lanceur d'alerte
  definition: une personne qui signale de bonne foi et sans intérêt personnel un danger ou un scandale, pour protéger l'intérêt général
- terme: délateur
  definition: une personne qui dénonce quelqu'un par intérêt personnel ou par malveillance
- terme: intérêt général
  definition: ce qui profite à l'ensemble de la société, et pas à une seule personne
- terme: bonne foi
  definition: le fait d'agir en croyant sincèrement à la vérité de ce qu'on signale
- terme: représailles
  definition: une mesure de vengeance contre quelqu'un, par exemple un licenciement ou une sanction
- terme: '#MeToo'
  definition: un mouvement lancé en 2017 où de nombreuses personnes ont témoigné publiquement de violences sexuelles
- terme: loi du 21 mars 2022
  definition: la loi française qui améliore la protection des lanceurs d'alerte
- terme: médias sociaux
  definition: les sites et applications où chacun peut publier et partager des contenus
erreurs_frequentes:
- 'Confondre un lanceur d''alerte et un délateur : c''est l''intention (intérêt général ou intérêt personnel) qui les distingue.'
- 'Croire qu''un lanceur d''alerte agit forcément de manière anonyme : la loi protège son identité, mais il n''est pas obligé d''être anonyme.'
- 'Réduire les lanceurs d''alerte à #MeToo : il y a aussi des affaires financières, sanitaires ou environnementales.'
- 'Croire qu''un lanceur d''alerte ne prend aucun risque : représailles et poursuites sont possibles, d''où la loi de 2022.'
- Confondre la loi de 2022 sur les lanceurs d'alerte et la loi de 2018 sur la manipulation de l'information.
exemple:
  enonce: Quelle protection la loi du 21 mars 2022 apporte-t-elle aux lanceurs d'alerte ?
  solution: Elle protège en particulier l'identité du lanceur d'alerte, qui ne peut être divulguée qu'avec son consentement, sauf communication à l'autorité judiciaire dans les cas prévus par la loi.
exercices:
- id: annee-loi-protection-lanceurs
  type: nombre
  difficulte: 1
  enonce: En quelle année la loi française visant à améliorer la protection des lanceurs d'alerte est-elle adoptée ?
  reponse:
    valeur: 2022
    forme: entier
  indices:
    relance: Cette loi est plus récente que la loi de 2018 sur la manipulation de l'information.
    methode: Elle protège notamment l'identité du lanceur d'alerte, qui ne peut être divulguée qu'avec son consentement.
    etape: L'année se situe dans les années 2020, peu après la crise sanitaire liée à la Covid-19.
  pieges:
  - si:
      valeur: 2018
    relance: 2018 est l'année de la loi relative à la lutte contre la manipulation de l'information, un texte différent.
  - si:
      valeur: 2019
    relance: 2019 est l'année de création du service national universel (SNU), pas de la loi sur les lanceurs d'alerte.
  solution: La loi visant à améliorer la protection des lanceurs d'alerte est adoptée le 21 mars 2022.
- id: lanceur-alerte-vs-delateur
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qui distingue un lanceur d'alerte d'un délateur ?
  reponse:
    options:
    - id: a
      texte: Le lanceur d'alerte agit de bonne foi et sans intérêt personnel, pour protéger l'intérêt général
    - id: b
      texte: Le lanceur d'alerte agit toujours de manière anonyme, contrairement au délateur
    - id: c
      texte: Le lanceur d'alerte ne s'exprime que sur les médias sociaux, contrairement au délateur
    bonnes:
    - a
  indices:
    relance: Pense à l'intention de la personne qui signale un fait, pas au moyen qu'elle utilise pour le faire.
    methode: Le délateur agit par intérêt personnel ou malveillance ; ce n'est pas le cas du lanceur d'alerte.
    etape: La bonne réponse porte sur la bonne foi et l'intérêt général, pas sur l'anonymat ni sur le support de diffusion.
  pieges:
  - si:
      contient:
      - b
    relance: L'anonymat n'est pas ce qui distingue un lanceur d'alerte d'un délateur ; c'est son intention, l'intérêt général plutôt que l'intérêt personnel.
  - si:
      contient:
      - c
    relance: Le lanceur d'alerte ne s'exprime pas seulement sur les médias sociaux ; ce n'est pas le support qui le distingue du délateur, mais son intention.
  solution: Le lanceur d'alerte agit de bonne foi, sans intérêt personnel, pour protéger l'intérêt général ; le délateur dénonce par intérêt personnel ou malveillance.
- id: chronologie-metoo-loi
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: metoo
      texte: 'Le mouvement #MeToo se diffuse largement sur les médias sociaux'
    - id: loi2018
      texte: La loi relative à la lutte contre la manipulation de l'information est adoptée
    - id: loi2022
      texte: La loi visant à améliorer la protection des lanceurs d'alerte est adoptée
  indices:
    relance: Situe d'abord la loi la plus récente, puis compare le mouvement de témoignages à l'autre loi.
    methode: 'Le mouvement de témoignages date des années 2010 : il précède les deux lois.'
    etape: Une des deux lois de la liste date de la fin des années 2010, l'autre du début des années 2020.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux événements voisins sont inversés. Lequel des deux a eu lieu en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus récent (début des années 2020), puis classe les deux autres, tous deux des années 2010.
  solution: 'Le mouvement #MeToo se diffuse à partir d''octobre 2017, puis la loi relative à la lutte contre la manipulation de l''information est adoptée en 2018, puis la loi visant à améliorer la protection des lanceurs d''alerte est adoptée le 21 mars 2022.'
- id: developpement-metoo-lanceurs-alerte
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : présente le mouvement #MeToo comme un exemple de mobilisation portée par des lanceurs d''alerte.'
  criteres:
  - 'L''élève présente le mouvement : des personnes témoignent publiquement de violences sexuelles.'
  - L'élève précise que les médias sociaux ont facilité la circulation de ces témoignages.
  - L'élève relie ces témoignages à la notion de lancement d'alerte (bonne foi, intérêt général, risques pris).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quel type de faits les personnes ayant participé au mouvement ont-elles rendus publics ?
    methode: Présente d'abord le mouvement, puis explique en quoi il relève d'un lancement d'alerte.
    etape: 'Tu peux commencer ainsi « Le mouvement #MeToo est un exemple de mobilisation citoyenne portée par des lanceurs d''alerte... », puis développer.'
  solution: 'Le mouvement #MeToo est un exemple de mobilisation citoyenne portée par des lanceurs d''alerte. À partir de 2017, de nombreuses personnes ont témoigné publiquement de violences sexuelles, notamment via les médias sociaux, qui ont permis une large diffusion de ces témoignages. Ces prises de parole relèvent d''un lancement d''alerte lorsqu''elles visent, de bonne foi, à protéger d''autres personnes en dénonçant des faits graves, malgré les risques pris. Un cadre légal protecteur, comme la loi de 2022, est donc essentiel pour accompagner ce type de mobilisation.'
- id: mot-represailles
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne une mesure de vengeance prise contre un lanceur d'alerte, par exemple un licenciement, que la loi de 2022 interdit ?
  reponse:
    acceptees:
    - représailles
    - represailles
    - des représailles
    - les représailles
    fautes_tolerees: 2
  indices:
    relance: Ce mot est toujours au pluriel quand on parle de vengeance.
    methode: On dit qu'on « exerce des ... » contre quelqu'un pour se venger.
    etape: Le mot commence par « repr... » et se termine par « ...ailles ».
  pieges:
  - si:
      valeur: sanctions
    relance: Une sanction est une punition. Cherche le mot qui exprime l'idée de vengeance.
  solution: 'Ce sont des représailles : des mesures de vengeance, comme un licenciement ou une sanction, prises contre le lanceur d''alerte.'
- id: lanceur-ou-delateur-cas
  type: association
  difficulte: 2
  enonce: Relie chaque situation à la bonne catégorie.
  reponse:
    gauche:
    - id: a
      texte: Une salariée révèle un rejet de produits toxiques dans une rivière, sans rien en retirer pour elle-même
    - id: b
      texte: Un employé accuse à tort un collègue de fraude pour prendre sa place
    - id: c
      texte: Une personne publie ses recherches sur le web pour se faire de la publicité, sans preuve
    droite:
    - id: x
      texte: Lanceur d'alerte
    - id: y
      texte: Délateur
    - id: z
      texte: 'Ni lanceur d''alerte ni délateur au sens strict : simple publicité'
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque cas, demande-toi qui profite de l'information révélée.
    methode: Un lanceur d'alerte agit de bonne foi pour l'intérêt général ; un délateur agit par intérêt personnel ou par malveillance.
    etape: Le cas où la personne veut prendre la place d'un collègue montre un intérêt personnel évident.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis l'intention de chaque personne.
  - si:
      diagnostic: associations_fausses
    relance: Cherche d'abord la situation où la personne agit sans aucun intérêt personnel et pour protéger les autres.
  solution: La salariée qui révèle la pollution est une lanceuse d'alerte (bonne foi, intérêt général). L'employé qui accuse à tort pour prendre la place est un délateur (intérêt personnel, malveillance). La troisième personne cherche seulement de la publicité.
- id: protections-loi-2022
  type: choix
  difficulte: 2
  enonce: Quelles mesures prévoit la loi du 21 mars 2022 pour protéger les lanceurs d'alerte ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: La protection de leur identité, qui ne peut être divulguée qu'avec leur accord, sauf demande de la justice
    - id: b
      texte: La protection contre les représailles, comme le licenciement ou une sanction
    - id: c
      texte: Une récompense de un million d'euros pour chaque signalement
    - id: d
      texte: L'obligation de garder le silence pendant dix ans
    bonnes:
    - a
    - b
  indices:
    relance: Cette loi protège la personne qui alerte, elle ne la récompense pas et ne lui impose pas le silence.
    methode: Élimine d'abord les options irréalistes, puis garde celles qui protègent l'identité ou l'emploi.
    etape: 'Deux options concernent la protection de la personne : son identité et son emploi.'
  pieges:
  - si:
      contient:
      - c
    relance: La loi ne prévoit pas de récompense de ce type. Elle protège, elle n'achète pas.
  - si:
      contient:
      - d
    relance: Imposer le silence irait à l'inverse du but de la loi, qui est de protéger celui qui parle.
  - si:
      diagnostic: incomplet
    relance: Il y a plus d'une mesure de protection correcte. Relis les deux premières options.
  solution: La loi protège l'identité du lanceur d'alerte (divulguée seulement avec son accord, sauf demande de la justice) et le protège contre les représailles. Elle ne prévoit ni récompense de ce type ni obligation de silence.
