format: 2
notion: democratie-deliberative-opinion-publique
version: 1
etat: verifiee
declencheurs:
- sondages fiables
- esprit critique médias
- débat argumenté citoyens
- réseaux sociaux opinion
- opinion majoritaire
- représentativité échantillon
prerequis: []
essentiel: 'L''opinion publique est l''opinion majoritaire dans une population donnée à un moment donné. Dans une démocratie,
  elle joue un rôle capital : les responsables politiques en tiennent compte, les médias en parlent, et les citoyens s''expriment
  par le vote mais aussi entre les élections.


  L''opinion publique s''exprime par l''intermédiaire des médias, y compris les médias sociaux, qui amplifient et accélèrent
  la circulation des idées. Elle est mesurée par des sondages, réalisés selon des méthodes diverses (interrogation d''un échantillon
  représentatif de la population).


  Développer l''esprit critique face à l''opinion publique et aux sondages est essentiel : un sondage peut dépendre de la
  façon dont la question est posée, de la taille et de la représentativité de l''échantillon interrogé, ou du moment où il
  est réalisé. La démocratie délibérative suppose un débat argumenté entre citoyens, et pas seulement l''addition d''opinions
  individuelles non discutées.'
methode:
- Définir l'opinion publique comme l'opinion majoritaire d'une population à un instant donné, non figée.
- Expliquer le rôle des médias, dont les médias sociaux, dans la formation de l'opinion publique.
- 'Garder un regard critique sur un sondage : qui l''a commandé, comment la question est posée, quel est l''échantillon interrogé.'
- Distinguer démocratie délibérative (débat argumenté) et simple addition de sondages d'opinion.
vocabulaire:
- terme: opinion publique
  definition: l'opinion majoritaire d'une population donnée à un moment donné
- terme: sondage
  definition: une enquête réalisée auprès d'un échantillon de personnes pour estimer l'opinion d'une population plus large
- terme: démocratie délibérative
  definition: une conception de la démocratie qui met l'accent sur le débat argumenté entre citoyens
erreurs_frequentes:
- Croire qu'un sondage reflète toujours exactement l'opinion de toute la population.
- Oublier de questionner la méthode d'un sondage (échantillon, formulation des questions).
- Confondre l'opinion publique, qui évolue, et une vérité scientifique ou juridique, qui ne dépend pas d'un vote.
- Négliger le rôle amplificateur des réseaux sociaux dans la formation rapide de l'opinion.
exemple:
  enonce: Pourquoi faut-il garder un regard critique face à un sondage d'opinion publié dans les médias ?
  solution: 'Parce qu''un sondage dépend de la taille et de la représentativité de l''échantillon interrogé, de la façon dont
    les questions sont formulées, et du moment où il est réalisé : deux sondages sur le même sujet peuvent donner des résultats
    différents selon leur méthode.'
exercices:
- id: definition-opinion-publique
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne l'opinion majoritaire d'une population donnée, à un moment donné ?
  reponse:
    acceptees:
    - opinion publique
    fautes_tolerees: 2
  indices:
    relance: Ce terme comprend le mot « opinion » et un adjectif qui signifie « qui concerne tout le monde, la collectivité
      ».
    methode: Ce n'est pas l'opinion d'une seule personne, mais celle de la majorité d'une population.
    etape: Complète l'expression en deux mots, commençant par « opinion... ».
  pieges:
  - si:
      valeur: sondage
    relance: C'est l'outil utilisé pour mesurer ce que pense la majorité, pas la notion elle-même. Cherche l'expression en
      deux mots qui désigne ce que ressent une population entière.
  solution: 'L''expression est « opinion publique » : l''opinion majoritaire d''une population donnée, à un moment donné.'
- id: fiabilite-sondage
  type: choix
  difficulte: 2
  enonce: Quel élément faut-il vérifier avant de faire confiance à un sondage ?
  reponse:
    options:
    - id: a
      texte: La taille et la représentativité de l'échantillon interrogé
    - id: b
      texte: Le nombre de « likes » obtenus par le sondage sur les réseaux sociaux
    - id: c
      texte: Le nombre total d'habitants du pays
    bonnes:
    - a
  indices:
    relance: Un sondage n'interroge jamais toute la population, mais seulement une partie choisie de celle-ci.
    methode: Pense à ce qui rend un échantillon fiable pour représenter une population plus large.
    etape: Cherche parmi les options celle qui concerne directement la méthode de l'enquête, pas sa popularité en ligne.
  pieges:
  - si:
      contient:
      - b
    relance: Le nombre de « likes » ne dit rien sur la fiabilité méthodologique d'un sondage, seulement sur sa popularité
      en ligne.
  - si:
      contient:
      - c
    relance: Le nombre total d'habitants du pays n'est pas ce qui rend un sondage fiable ; c'est la représentativité de l'échantillon
      interrogé qui compte.
  solution: Il faut vérifier la taille et la représentativité de l'échantillon interrogé, ainsi que la façon dont les questions
    sont formulées et la date de réalisation du sondage.
- id: opinion-vs-democratie-deliberative
  type: association
  difficulte: 2
  enonce: Relie chaque notion à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Opinion publique
    - id: b
      texte: Démocratie délibérative
    droite:
    - id: x
      texte: L'opinion majoritaire d'une population à un moment donné
    - id: y
      texte: Une conception de la démocratie fondée sur le débat argumenté entre citoyens
    paires:
      a: x
      b: y
  indices:
    relance: L'une des deux notions décrit un état de l'opinion à un instant, l'autre décrit une méthode de discussion.
    methode: L'opinion publique peut se mesurer par un sondage ; la démocratie délibérative suppose un échange d'arguments.
    etape: Associe « opinion publique » à une mesure à un instant donné, et « démocratie délibérative » à un débat argumenté.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Les deux définitions sont inversées. Laquelle décrit une mesure à un instant donné, laquelle décrit un débat
      argumenté ?
  - si:
      diagnostic: associations_fausses
    relance: Relis d'abord chaque définition séparément avant de les associer aux notions.
  solution: L'opinion publique est l'opinion majoritaire d'une population à un moment donné. La démocratie délibérative est
    une conception de la démocratie qui met l'accent sur le débat argumenté entre citoyens.
- id: developpement-reseaux-sociaux-opinion
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique le rôle des médias sociaux dans la formation de l''opinion publique aujourd''hui.'
  criteres:
  - L'élève explique que les médias sociaux permettent une circulation rapide des idées.
  - L'élève montre que chacun peut s'y exprimer publiquement.
  - L'élève nuance en évoquant un risque (informations non vérifiées, renforcement d'opinions déjà formées).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Qu'est-ce qui change, avec les médias sociaux, par rapport aux médias traditionnels, dans la vitesse de circulation
      des idées ?
    methode: Présente d'abord l'avantage (rapidité, expression de chacun), puis nuance avec un risque.
    etape: Tu peux commencer ainsi « Les médias sociaux transforment aujourd'hui la formation de l'opinion publique... »,
      puis développer ton premier argument.
  solution: Les médias sociaux transforment aujourd'hui la formation de l'opinion publique. Ils permettent une circulation
    très rapide des idées et donnent à chacun la possibilité de s'exprimer publiquement, sans passer par un média traditionnel.
    Cette rapidité peut cependant favoriser la diffusion d'informations non vérifiées et renforcer des opinions déjà formées
    plutôt que le débat argumenté. Les médias sociaux jouent donc un rôle ambivalent dans la démocratie.
- id: nblm-comment-definit-on-l-opinion-publique-da-1
  type: choix
  difficulte: 2
  enonce: Comment définit-on l'opinion publique dans une société démocratique ?
  reponse:
    options:
    - id: o1
      texte: L'opinion majoritaire au sein d'une population donnée à un moment donné.
    - id: o2
      texte: Une vérité scientifique et juridique absolue qui ne change jamais.
    - id: o3
      texte: Le résultat officiel d'un vote électoral obligatoire.
    - id: o4
      texte: L'avis unique exprimé par les dirigeants politiques d'un gouvernement.
    bonnes:
    - o1
  indices:
    relance: Pense à ce que pense la majorité des citoyens à un instant donné.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''opinion publique évolue constamment et ne constitue pas une vérité scientifique ou juridique.'
  - si:
      contient:
      - o3
    relance: L'opinion publique s'exprime également entre les élections et le vote n'est pas la seule manière de la mesurer.
  - si:
      contient:
      - o4
    relance: L'opinion publique émane des citoyens et de la population, et non uniquement des dirigeants politiques.
  solution: 'L''opinion majoritaire au sein d''une population donnée à un moment donné. C''est la définition exacte de l''opinion
    publique : elle reflète la position partagée par la majorité des citoyens à un instant précis.'
- id: nblm-que-designe-la-representativite-d-un-ech-2
  type: choix
  difficulte: 2
  enonce: Que désigne la « représentativité d'un échantillon » lors de la réalisation d'un sondage d'opinion ?
  reponse:
    options:
    - id: o1
      texte: La constitution d'un groupe réduit reproduisant fidèlement la diversité de l'ensemble de la population.
    - id: o2
      texte: Le fait d'interroger exclusivement des experts et des universitaires.
    - id: o3
      texte: Le fait d'interroger la totalité des habitants d'un pays lors d'un recensement.
    - id: o4
      texte: Le choix de personnes partageant toutes le même avis dès le départ.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la manière dont un petit groupe peut être à l'image d'une population entière.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Sonder uniquement des experts ne permet pas de refléter la diversité de l'ensemble des citoyens.
  - si:
      contient:
      - o3
    relance: Interroger toute la population correspond à un recensement ou un vote général, pas à un échantillon de sondage.
  - si:
      contient:
      - o4
    relance: Sélectionner des gens du même avis créerait un biais important qui fausserait la représentativité.
  solution: La constitution d'un groupe réduit reproduisant fidèlement la diversité de l'ensemble de la population. Un échantillon
    est représentatif lorsqu'il reflète en miniature les caractéristiques démographiques de la population globale.
- id: nblm-pourquoi-faut-il-exercer-son-esprit-crit-3
  type: choix
  difficulte: 2
  enonce: Pourquoi faut-il exercer son esprit critique et vérifier la méthodologie avant d'accorder sa confiance aux résultats
    d'un sondage ?
  reponse:
    options:
    - id: o1
      texte: Parce que les résultats varient selon la formulation des questions, la taille de l'échantillon et le moment de
        l'enquête.
    - id: o2
      texte: Parce que les sondages sont systématiquement inventés sans aucune étude statistique.
    - id: o3
      texte: Parce que deux sondages différents sur le même sujet donnent toujours exactement le même résultat.
    - id: o4
      texte: Parce qu'un sondage possède la même valeur juridique qu'une loi votée par le Parlement.
    bonnes:
    - o1
  indices:
    relance: Pense aux différents choix techniques qui peuvent influencer les réponses obtenues.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Les sondages reposent sur des enquêtes statistiques réelles, mais leur qualité méthodologique doit être contrôlée.
  - si:
      contient:
      - o3
    relance: Au contraire, deux sondages sur un même thème peuvent donner des résultats divergents selon leurs méthodes respectives.
  - si:
      contient:
      - o4
    relance: Un sondage mesure simplement une tendance d'opinion à un instant donné ; il n'a aucune valeur légale ou juridique.
  solution: Parce que les résultats varient selon la formulation des questions, la taille de l'échantillon et le moment de
    l'enquête. Un sondage dépend directement du libellé des questions, de la représentativité du groupe interrogé et du contexte
    temporel.
- id: nblm-quel-role-specifique-jouent-les-reseaux-4
  type: choix
  difficulte: 2
  enonce: Quel rôle spécifique jouent les réseaux sociaux dans la dynamique de l'opinion publique ?
  reponse:
    options:
    - id: o1
      texte: Ils amplifient et accélèrent la circulation des idées et des réactions d'opinion.
    - id: o2
      texte: Ils garantissent la véracité scientifique de toutes les informations publiées.
    - id: o3
      texte: Ils remplacent l'obligation de voter lors des élections nationales.
    - id: o4
      texte: Ils empêchent les citoyens ordinaires de donner leur avis personnel.
    bonnes:
    - o1
  indices:
    relance: Pense à la vitesse et à la portée de la diffusion des idées sur internet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Les réseaux sociaux sont aussi le vecteur de rumeurs et de fausses informations non vérifiées.
  - si:
      contient:
      - o3
    relance: L'expression sur internet ne remplace pas les institutions démocratiques ni le vote électoral.
  - si:
      contient:
      - o4
    relance: Au contraire, les réseaux sociaux offrent une plateforme directe d'expression à chaque utilisateur.
  solution: Ils amplifient et accélèrent la circulation des idées et des réactions d'opinion. Les médias sociaux permettent
    la diffusion immédiate des informations et amplifient la résonance des débats publics.
- id: nblm-qu-est-ce-qui-caracterise-la-democratie-5
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qui caractérise la démocratie délibérative par rapport à une simple prise en compte d'opinions brutes
    ?
  reponse:
    options:
    - id: o1
      texte: Elle met l'accent sur un débat argumenté entre citoyens plutôt que sur la simple addition de sondages.
    - id: o2
      texte: Elle interdit la confrontation d'idées entre les citoyens avant les élections.
    - id: o3
      texte: Elle supprime le débat citoyen pour le remplacer par un algorithme de sondage automatisé.
    - id: o4
      texte: Elle restreint la possibilité de s'exprimer aux seuls experts scientifiques.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la différence entre discuter avec des arguments et simplement compter des avis individuels non débattus.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est l''inverse : la délibération valorise l''échange argumenté et la confrontation bienveillante d''idées.'
  - si:
      contient:
      - o3
    relance: La délibération vise justement à dépasser la mesure passive par sondages en stimulant le débat actif.
  - si:
      contient:
      - o4
    relance: La démocratie délibérative implique l'ensemble des citoyens dans la discussion politique de la cité.
  solution: Elle met l'accent sur un débat argumenté entre citoyens plutôt que sur la simple addition de sondages. La démocratie
    délibérative repose sur l'échange d'arguments réfléchis et la discussion collective, et non sur un simple cumul de réponses
    individuelles isolées.
- id: nblm-quels-elements-essentiels-un-citoyen-exe-6
  type: choix
  difficulte: 3
  enonce: Quels éléments essentiels un citoyen exerçant son esprit critique doit-il vérifier pour apprécier la fiabilité d'un
    sondage publié dans les médias ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La taille et la représentativité de l'échantillon interrogé.
    - id: o2
      texte: La manière dont la question est formulée et la date de réalisation de l'enquête.
    - id: o3
      texte: Le nombre de réactions et de mentions « j'aime » sous le post qui partage le sondage.
    - id: o4
      texte: La couleur du logo du journal qui publie les résultats de l'étude.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux critères portant sur la méthode statistique de réalisation du sondage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: La popularité sur les réseaux sociaux n'est pas un gage de rigueur méthodologique.
  - si:
      contient:
      - o4
    relance: L'apparence visuelle d'un média ne reflète pas la valeur statistique et scientifique du sondage.
  solution: La taille et la représentativité de l'échantillon interrogé ; La manière dont la question est formulée et la date
    de réalisation de l'enquête. Un échantillon mal dimensionné ou non représentatif fausse la mesure globale de l'opinion.
- id: nblm-la-conception-de-la-democratie-qui-repos-7
  type: texte_court
  difficulte: 1
  enonce: La conception de la démocratie qui repose sur la discussion constructive et le débat argumenté entre les citoyens
    est la démocratie __________.
  reponse:
    acceptees:
    - délibérative
    fautes_tolerees: 1
  indices:
    relance: Trouve l'adjectif qualificatif dérivé du verbe « délibérer ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: délibérative. La démocratie délibérative valorise la délibération et l'échange d'arguments construits au sein
    de la société.
- id: nblm-une-enquete-d-opinion-menee-aupres-d-un-8
  type: texte_court
  difficulte: 1
  enonce: Une enquête d'opinion menée auprès d'un échantillon représentatif de personnes pour estimer la position d'une population
    globale est un __________.
  reponse:
    acceptees:
    - sondage
    fautes_tolerees: 1
  indices:
    relance: C'est le nom donné aux enquêtes statistiques réalisées par des instituts spécialisés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: sondage. Le sondage est l'outil d'enquête utilisé pour mesurer l'opinion publique à partir d'un échantillon.
