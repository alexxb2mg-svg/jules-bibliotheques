format: 2
notion: democratie-deliberative-opinion-publique
version: 2
etat: verifiee
declencheurs:
- sondages fiables
- esprit critique médias
- débat argumenté citoyens
- réseaux sociaux opinion
- opinion majoritaire
- représentativité échantillon
- sondage d'opinion
- marge d'erreur
- convention citoyenne
- bulle de filtres
prerequis: []
essentiel: 'L''opinion publique est l''opinion majoritaire d''une population, à un moment donné. Elle change avec le temps
  et avec l''actualité.


  Dans une démocratie, elle joue un rôle capital. Les responsables politiques en tiennent compte, les médias en parlent, et
  les citoyens s''expriment par le vote, mais aussi entre les élections : débats, pétitions, manifestations, messages en ligne.


  L''opinion publique s''exprime par l''intermédiaire des médias : presse, radio, télévision, et médias sociaux. Les médias
  sociaux permettent à chacun de s''exprimer publiquement et font circuler les idées très vite. Mais ils peuvent aussi diffuser
  des informations non vérifiées et enfermer chacun dans des contenus qui confirment ce qu''il pense déjà.


  On essaie de saisir l''opinion par des sondages. Un sondage interroge un échantillon, c''est-à-dire un petit groupe de personnes,
  pour estimer ce que pense toute la population. Il existe des sondages de natures diverses : sondages d''opinion sur un sujet
  de société, sondages d''intentions de vote avant une élection, enquêtes menées par téléphone, en ligne ou en face à face.


  Un sondage n''est fiable que si l''échantillon est représentatif de la population (âge, sexe, région, milieu social) et
  assez grand. Les résultats ont toujours une marge d''erreur. La formulation de la question compte aussi, ainsi que la date
  : une opinion peut changer après un événement. Il faut savoir qui a commandé le sondage et qui l''a réalisé.


  Un sondage n''est pas un vote : il donne une photographie de l''opinion à un instant, il ne décide de rien.


  La démocratie délibérative ajoute une idée : les citoyens doivent pouvoir débattre avec des arguments avant de décider,
  et pas seulement additionner des avis. Exemple : une convention citoyenne réunit des citoyens tirés au sort pour discuter
  d''un sujet et faire des propositions. La Convention citoyenne pour le climat (2019-2020) a réuni 150 citoyens.


  Au brevet, on attend que tu définisses l''opinion publique, que tu expliques le rôle des médias sociaux, et que tu montres
  l''esprit critique face à un sondage.

  '
methode:
- 'Définir les mots du sujet : opinion publique, sondage, démocratie délibérative.'
- Situer le rôle des médias, en distinguant médias traditionnels et médias sociaux.
- 'Face à un sondage, se poser les questions dans l''ordre : qui l''a commandé, qui est interrogé, combien de personnes, quelle
  question, quand.'
- 'Calculer un pourcentage avec une division : effectif favorable ÷ effectif total × 100.'
- Opposer un sondage (photographie de l'opinion) et une délibération (débat argumenté qui aboutit à des propositions).
- Dans un développement, donner un avantage, puis un risque, puis conclure.
vocabulaire:
- terme: opinion publique
  definition: l'opinion majoritaire d'une population donnée à un moment donné
- terme: sondage
  definition: une enquête réalisée auprès d'un échantillon de personnes pour estimer l'opinion d'une population plus large
- terme: échantillon
  definition: le groupe de personnes interrogées dans un sondage
- terme: échantillon représentatif
  definition: un échantillon qui reproduit les caractéristiques de la population (âge, sexe, région, milieu social)
- terme: marge d'erreur
  definition: l'écart possible entre le résultat du sondage et l'opinion réelle de la population
- terme: démocratie délibérative
  definition: une conception de la démocratie qui met l'accent sur le débat argumenté entre citoyens avant la décision
- terme: médias sociaux
  definition: les sites et applications où chacun peut publier et partager des contenus
- terme: convention citoyenne
  definition: un groupe de citoyens tirés au sort qui débattent d'un sujet et font des propositions
erreurs_frequentes:
- 'Croire qu''un sondage reflète exactement l''opinion de toute la population : il y a toujours une marge d''erreur.'
- 'Oublier de questionner la méthode : échantillon, formulation de la question, date, commanditaire.'
- Confondre l'opinion publique, qui évolue, avec une vérité scientifique ou juridique, qui ne dépend pas d'un vote.
- 'Croire qu''un sondage est un vote qui décide : il informe, il ne décide pas.'
- Penser que plus de « likes » ou de partages veut dire plus de vérité ou plus de représentativité.
exemple:
  enonce: Pourquoi faut-il garder un regard critique face à un sondage d'opinion publié dans les médias ?
  solution: 'Parce qu''un sondage dépend de la taille et de la représentativité de l''échantillon interrogé, de la façon dont
    les questions sont formulées, et du moment où il est réalisé : deux sondages sur le même sujet peuvent donner des résultats
    différents selon leur méthode.'
exercices:
- id: definition-opinion-publique
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne l'opinion majoritaire d'une population donnée, à un moment donné ?
  reponse:
    acceptees:
    - opinion publique
    fautes_tolerees: 2
  indices:
    relance: Ce terme comprend le mot « opinion » et un adjectif qui signifie « qui concerne tout le monde, la collectivité
      ».
    methode: Ce n'est pas l'opinion d'une seule personne, mais celle de la majorité d'une population.
    etape: Complète l'expression en deux mots, commençant par « opinion... ».
  pieges:
  - si:
      valeur: sondage
    relance: C'est l'outil utilisé pour mesurer ce que pense la majorité, pas la notion elle-même. Cherche l'expression en
      deux mots qui désigne ce que ressent une population entière.
  solution: 'L''expression est « opinion publique » : l''opinion majoritaire d''une population donnée, à un moment donné.'
- id: fiabilite-sondage
  type: choix
  difficulte: 2
  enonce: Quel élément faut-il vérifier avant de faire confiance à un sondage ?
  reponse:
    options:
    - id: a
      texte: La taille et la représentativité de l'échantillon interrogé
    - id: b
      texte: Le nombre de « likes » obtenus par le sondage sur les réseaux sociaux
    - id: c
      texte: Le nombre total d'habitants du pays
    bonnes:
    - a
  indices:
    relance: Un sondage n'interroge jamais toute la population, mais seulement une partie choisie de celle-ci.
    methode: Pense à ce qui rend un échantillon fiable pour représenter une population plus large.
    etape: Cherche parmi les options celle qui concerne directement la méthode de l'enquête, pas sa popularité en ligne.
  pieges:
  - si:
      contient:
      - b
    relance: Le nombre de « likes » ne dit rien sur la fiabilité méthodologique d'un sondage, seulement sur sa popularité
      en ligne.
  - si:
      contient:
      - c
    relance: Le nombre total d'habitants du pays n'est pas ce qui rend un sondage fiable ; c'est la représentativité de l'échantillon
      interrogé qui compte.
  solution: Il faut vérifier la taille et la représentativité de l'échantillon interrogé, ainsi que la façon dont les questions
    sont formulées et la date de réalisation du sondage.
- id: opinion-vs-democratie-deliberative
  type: association
  difficulte: 2
  enonce: Relie chaque notion à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Opinion publique
    - id: b
      texte: Démocratie délibérative
    droite:
    - id: x
      texte: L'opinion majoritaire d'une population à un moment donné
    - id: y
      texte: Une conception de la démocratie fondée sur le débat argumenté entre citoyens
    paires:
      a: x
      b: y
  indices:
    relance: L'une des deux notions décrit un état de l'opinion à un instant, l'autre décrit une méthode de discussion.
    methode: L'opinion publique peut se mesurer par un sondage ; la démocratie délibérative suppose un échange d'arguments.
    etape: Associe « opinion publique » à une mesure à un instant donné, et « démocratie délibérative » à un débat argumenté.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Les deux définitions sont inversées. Laquelle décrit une mesure à un instant donné, laquelle décrit un débat
      argumenté ?
  - si:
      diagnostic: associations_fausses
    relance: Relis d'abord chaque définition séparément avant de les associer aux notions.
  solution: L'opinion publique est l'opinion majoritaire d'une population à un moment donné. La démocratie délibérative est
    une conception de la démocratie qui met l'accent sur le débat argumenté entre citoyens.
- id: developpement-reseaux-sociaux-opinion
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique le rôle des médias sociaux dans la formation de l''opinion publique aujourd''hui.'
  criteres:
  - L'élève explique que les médias sociaux permettent une circulation rapide des idées.
  - L'élève montre que chacun peut s'y exprimer publiquement.
  - L'élève nuance en évoquant un risque (informations non vérifiées, renforcement d'opinions déjà formées).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Qu'est-ce qui change, avec les médias sociaux, par rapport aux médias traditionnels, dans la vitesse de circulation
      des idées ?
    methode: Présente d'abord l'avantage (rapidité, expression de chacun), puis nuance avec un risque.
    etape: Tu peux commencer ainsi « Les médias sociaux transforment aujourd'hui la formation de l'opinion publique... »,
      puis développer ton premier argument.
  solution: Les médias sociaux transforment aujourd'hui la formation de l'opinion publique. Ils permettent une circulation
    très rapide des idées et donnent à chacun la possibilité de s'exprimer publiquement, sans passer par un média traditionnel.
    Cette rapidité peut cependant favoriser la diffusion d'informations non vérifiées et renforcer des opinions déjà formées
    plutôt que le débat argumenté. Les médias sociaux jouent donc un rôle ambivalent dans la démocratie.
- id: calcul-pourcentage-sondage
  type: nombre
  difficulte: 1
  enonce: Un institut interroge 1 000 personnes. 620 d'entre elles répondent « oui » à la question posée. Quel pourcentage
    de « oui » obtient-il ?
  reponse:
    valeur: 62
    forme: libre
  indices:
    relance: Quelle opération te donne la part d'un groupe dans un total ?
    methode: Divise le nombre de « oui » par le nombre de personnes interrogées, puis multiplie par 100.
    etape: Tu dois calculer 620 ÷ 1 000, puis passer en pourcentage.
  pieges:
  - si:
      valeur: 620
    relance: 620 est un nombre de personnes, pas un pourcentage. Rapporte-le au total interrogé.
  - si:
      valeur: 6.2
    relance: 'Vérifie ta virgule : sur 100 personnes, combien répondraient « oui » ?'
  solution: 620 ÷ 1 000 = 0,62, soit 62 %.
- id: mot-echantillon
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le groupe de personnes réellement interrogées dans un sondage ?
  reponse:
    acceptees:
    - échantillon
    - un échantillon
    - l'échantillon
    fautes_tolerees: 2
  indices:
    relance: Un sondage n'interroge pas toute la population. Comment nomme-t-on la petite partie choisie pour la représenter
      ?
    methode: Ce mot désigne aussi, dans un magasin, un petit morceau d'un produit qu'on peut goûter.
    etape: Le mot commence par « échan... » et se termine par « ...illon ».
  pieges:
  - si:
      valeur: population
    relance: La population est l'ensemble des personnes concernées. Comment appelle-t-on la petite partie qu'on interroge
      vraiment ?
  solution: 'C''est l''échantillon : le groupe de personnes interrogées pour estimer l''opinion de toute la population.'
- id: sondages-peu-fiables
  type: choix
  difficulte: 2
  enonce: Quels sondages sont peu fiables ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: Un sondage en ligne où seuls les abonnés d'une chaîne de jeux vidéo ont répondu, pour connaître l'avis de tous
        les Français
    - id: b
      texte: Une enquête menée auprès de 1 000 personnes choisies pour ressembler à la population (âge, sexe, région)
    - id: c
      texte: Un sondage dont la question est « Ne pensez-vous pas, comme tout le monde, que cette loi est catastrophique ?
        »
    - id: d
      texte: Un sondage qui indique sa marge d'erreur et sa date de réalisation
    bonnes:
    - a
    - c
  indices:
    relance: 'Pour chaque sondage, demande-toi : les personnes interrogées ressemblent-elles à la population, et la question
      est-elle neutre ?'
    methode: Repère l'échantillon qui ne représente qu'un petit groupe précis, et la question qui pousse à répondre d'une
      certaine façon.
    etape: Deux sondages ont un défaut de méthode. Un troisième et un quatrième respectent les règles de base.
  pieges:
  - si:
      contient:
      - b
    relance: Cet échantillon a été choisi pour ressembler à la population. Est-ce un défaut ?
  - si:
      contient:
      - d
    relance: Indiquer la marge d'erreur et la date est un signe de sérieux. Relis les deux autres options.
  - si:
      diagnostic: incomplet
    relance: Il y a bien plus d'un sondage douteux. Regarde aussi la formulation de la question.
  solution: Le sondage a est biaisé (échantillon non représentatif). Le sondage c est biaisé (question orientée). Les sondages
    b et d respectent les règles de base.
- id: sondage-ou-deliberation
  type: association
  difficulte: 2
  enonce: Relie chaque situation à l'outil dont elle relève.
  reponse:
    gauche:
    - id: a
      texte: Un institut téléphone à 1 000 personnes pour connaître leur avis sur une réforme
    - id: b
      texte: 150 citoyens tirés au sort débattent plusieurs week-ends et rédigent des propositions
    - id: c
      texte: Des milliers de messages en quelques heures sur un réseau social après un événement
    droite:
    - id: x
      texte: Un sondage d'opinion
    - id: y
      texte: Une convention citoyenne (démocratie délibérative)
    - id: z
      texte: Une expression de l'opinion sur les médias sociaux
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Repère d'abord la situation où des citoyens discutent longuement entre eux.
    methode: Un sondage pose une question et compte des réponses ; une délibération est un débat argumenté ; les médias sociaux
      sont un espace où chacun publie.
    etape: Le tirage au sort de citoyens qui débattent est la marque de la démocratie délibérative.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pour chaque situation, demande-toi si on compte des réponses, si on débat,
      ou si on publie.
  - si:
      diagnostic: associations_fausses
    relance: Repère celle où des citoyens débattent avec des arguments, puis distingue les deux autres.
  solution: Le téléphone auprès de 1 000 personnes est un sondage d'opinion. Les 150 citoyens tirés au sort forment une convention
    citoyenne. Les messages en ligne sont l'expression de l'opinion sur les médias sociaux.
