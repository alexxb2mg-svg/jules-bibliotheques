format: 2
notion: elections-referendum
version: 1
etat: verifiee
declencheurs:
- voter en France
- élection présidentielle
- élections législatives
- vote pas obligatoire
- suffrage indirect sénateurs
- campagne référendaire
prerequis:
- constitution-ve-republique
essentiel: 'Les élections et les référendums sont des moments décisifs de la vie démocratique en France. Une campagne électorale
  ou référendaire est une période de débat pendant laquelle les candidats ou les partisans de chaque camp présentent leurs
  arguments aux électeurs.


  En France, le vote n''est pas obligatoire, mais il constitue un engagement civique important : voter, c''est participer
  à la vie de la cité et choisir ses représentants ou se prononcer directement sur une question.


  Il existe plusieurs types d''élections, avec des temporalités différentes : l''élection présidentielle (tous les cinq ans
  depuis le passage au quinquennat en 2000), les élections législatives (députés), sénatoriales (sénateurs, au suffrage indirect),
  régionales, départementales, municipales et européennes.


  Le référendum, lui, permet aux citoyens de répondre directement par « oui » ou « non » à une question posée par les pouvoirs
  publics, comme lors de l''adoption de la Constitution de 1958, approuvée par référendum le 28 septembre 1958.'
methode:
- Distinguer élection (choisir des représentants) et référendum (répondre directement à une question).
- Connaître au moins quatre types d'élections françaises et leur objet (présidentielle, législatives, municipales, européennes...).
- Retenir que le vote n'est pas obligatoire en France, contrairement à d'autres pays.
- Relier la campagne électorale à l'idée de débat démocratique nécessaire avant un vote.
vocabulaire:
- terme: référendum
  definition: un vote par lequel les citoyens répondent directement par oui ou non à une question posée par les pouvoirs publics
- terme: suffrage universel direct
  definition: un mode d'élection où tous les citoyens majeurs votent directement pour désigner un représentant
- terme: campagne électorale
  definition: la période qui précède un vote, pendant laquelle candidats et partisans présentent leurs arguments
erreurs_frequentes:
- Croire que le vote est obligatoire en France, alors qu'il ne l'est pas, contrairement à certains autres pays.
- Confondre l'élection, qui choisit des représentants, et le référendum, qui répond directement à une question.
- Oublier qu'il existe plusieurs échelles d'élections (locale, nationale, européenne), pas seulement la présidentielle.
- Penser que ne pas voter est sans conséquence pour la vie démocratique, alors que l'abstention influe sur la représentativité
  des résultats.
exemple:
  enonce: Donne un exemple de référendum en France et explique ce qui le distingue d'une élection.
  solution: 'Le référendum du 28 septembre 1958, qui a permis d''adopter la Constitution de la Ve République : contrairement
    à une élection, les citoyens ne choisissent pas un représentant mais répondent directement par oui ou non à une question
    précise.'
exercices:
- id: annee-referendum-1958
  type: nombre
  difficulte: 1
  enonce: En quelle année les citoyens français adoptent-ils la Constitution de la Ve République par référendum ?
  reponse:
    valeur: 1958
    forme: entier
  indices:
    relance: C'est la même année que l'adoption de la Constitution encore en vigueur aujourd'hui en France.
    methode: Ce référendum met fin à la IVe République, jugée instable, à la fin des années 1950.
    etape: Le référendum a lieu le 28 septembre de cette année-là. Écris l'année complète.
  pieges:
  - si:
      valeur: 1962
    relance: 'Cette année-là, le président de la République est élu au suffrage universel direct : c''est une révision de
      la Constitution, pas son référendum d''adoption.'
  - si:
      valeur: 2000
    relance: Cette année-là marque le passage au quinquennat présidentiel, une révision bien plus tardive que l'adoption de
      la Constitution.
  solution: La Constitution de la Ve République est adoptée par référendum le 28 septembre 1958.
- id: election-vs-referendum
  type: choix
  difficulte: 1
  enonce: Quelle est la différence essentielle entre une élection et un référendum ?
  reponse:
    options:
    - id: a
      texte: L'élection choisit des représentants, le référendum répond directement par oui ou non à une question
    - id: b
      texte: Le référendum est réservé aux élections locales, l'élection aux élections nationales
    - id: c
      texte: L'élection est obligatoire, le référendum ne l'est pas
    bonnes:
    - a
  indices:
    relance: 'Pense à ce que l''électeur choisit dans chaque cas : une personne, ou une réponse à une question précise ?'
    methode: Dans une élection, on désigne un représentant ; dans un référendum, on répond directement à une question posée
      par les pouvoirs publics.
    etape: La bonne réponse porte sur ce que désigne le vote, pas sur son échelle géographique ni sur son caractère obligatoire.
  pieges:
  - si:
      contient:
      - b
    relance: Le référendum n'est pas réservé aux élections locales ; il peut porter sur des questions nationales, comme celui
      de 1958.
  - si:
      contient:
      - c
    relance: En France, ni l'élection ni le référendum ne sont obligatoires pour les électeurs. Ce n'est pas ce qui les distingue.
  solution: L'élection permet de choisir des représentants ; le référendum permet aux citoyens de répondre directement par
    oui ou non à une question posée par les pouvoirs publics.
- id: types-elections
  type: association
  difficulte: 2
  enonce: Relie chaque élection au mode de suffrage qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: Élection législative
    - id: b
      texte: Élection sénatoriale
    droite:
    - id: x
      texte: Suffrage universel direct (tous les électeurs votent directement)
    - id: y
      texte: Suffrage indirect (des grands électeurs votent, notamment des élus locaux)
    paires:
      a: x
      b: y
  indices:
    relance: Pour l'une de ces deux élections, chaque citoyen majeur vote directement ; pour l'autre, ce sont des élus locaux
      qui votent à leur place.
    methode: Les députés sont élus par tous les électeurs ; les sénateurs sont élus par des grands électeurs.
    etape: Associe « législative » au suffrage universel direct, et « sénatoriale » au suffrage indirect.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Les deux modes de suffrage sont inversés. Laquelle des deux élections implique un vote direct de tous les citoyens
      ?
  - si:
      diagnostic: associations_fausses
    relance: Relis d'abord la définition de chaque mode de suffrage avant de les associer aux élections.
  solution: Les élections législatives (députés) se font au suffrage universel direct, par tous les électeurs ; les élections
    sénatoriales se font au suffrage indirect, par des grands électeurs, notamment des élus locaux.
- id: developpement-vote-engagement
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique pourquoi voter, bien que non obligatoire en France, constitue un engagement
    civique important.'
  criteres:
  - L'élève rappelle que le vote n'est pas une obligation légale en France.
  - L'élève explique que voter permet de choisir ses représentants ou de se prononcer sur une question.
  - L'élève montre qu'une forte abstention peut fragiliser la légitimité des élus ou du résultat d'un référendum.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Le vote est-il une obligation légale en France ? Que se passe-t-il si peu de gens votent ?
    methode: Rappelle d'abord que le vote n'est pas obligatoire, puis explique son intérêt et le risque d'une forte abstention.
    etape: Tu peux commencer ainsi « En France, voter n'est pas une obligation légale... », puis développer ton premier argument.
  solution: En France, voter n'est pas une obligation légale, contrairement à certains autres pays. Voter permet néanmoins
    de choisir ses représentants ou de se prononcer directement sur une question, ce qui est une forme concrète de participation
    à la vie démocratique. Une forte abstention peut cependant fragiliser la légitimité des élus ou du résultat d'un référendum,
    car elle réduit la part de la population qui s'est exprimée. Voter reste donc un engagement civique important, même sans
    caractère obligatoire.
- id: nblm-en-france-quelle-est-la-regle-legale-con-1
  type: choix
  difficulte: 2
  enonce: En France, quelle est la règle légale concernant le fait de voter lors d'une élection ?
  reponse:
    options:
    - id: o1
      texte: Le vote n'est pas obligatoire, mais il constitue un engagement civique important.
    - id: o2
      texte: Le vote est obligatoire sous peine d'amende pour tous les citoyens majeurs.
    - id: o3
      texte: Le vote est obligatoire uniquement lors de l'élection présidentielle.
    - id: o4
      texte: Le vote est obligatoire seulement pour les personnes inscrites dans les petites communes.
    bonnes:
    - o1
  indices:
    relance: Pense au cadre juridique qui régit le geste d'aller voter en France.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention à l''erreur fréquente : contrairement à certains autres pays, le vote n''est pas obligatoire en France.'
  - si:
      contient:
      - o3
    relance: 'Faux : aucune élection en France ne comporte d''obligation légale de voter.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le caractère non obligatoire du vote s''applique de la même façon sur tout le territoire national.'
  solution: 'Le vote n''est pas obligatoire, mais il constitue un engagement civique important. C''est exact : en France,
    le vote est un droit et un devoir civique, mais il n''est pas imposé par la loi.'
- id: nblm-depuis-le-passage-au-quinquennat-en-l-an-2
  type: choix
  difficulte: 2
  enonce: Depuis le passage au quinquennat en l'an 2000, tous les combien d'années est organisée l'élection présidentielle
    en France ?
  reponse:
    options:
    - id: o1
      texte: Tous les 5 ans.
    - id: o2
      texte: Tous les 7 ans.
    - id: o3
      texte: Tous les 4 ans.
    - id: o4
      texte: Tous les 6 ans.
    bonnes:
    - o1
  indices:
    relance: Pense à la durée exacte d'un quinquennat réformé en l'an 2000.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : la durée de 7 ans (septennat) était en vigueur avant la réforme constitutionnelle de l''année 2000.'
  - si:
      contient:
      - o3
    relance: 'Faux : 4 ans est la durée du mandat présidentiel dans d''autres pays comme les États-Unis, mais pas en France.'
  - si:
      contient:
      - o4
    relance: 'Erreur : 6 ans correspond au mandat des maires et conseillers municipaux, pas du président de la République.'
  solution: 'Tous les 5 ans. C''est exact : le quinquennat fixe la durée du mandat du président de la République à cinq ans.'
- id: nblm-quel-est-l-objectif-principal-des-electi-3
  type: choix
  difficulte: 2
  enonce: Quel est l'objectif principal des élections législatives organisées en France ?
  reponse:
    options:
    - id: o1
      texte: Élire les députés qui siègent à l'Assemblée nationale.
    - id: o2
      texte: Élire les sénateurs qui siègent au Sénat.
    - id: o3
      texte: Élire directement le président de la République.
    - id: o4
      texte: Approuver ou rejeter directement une révision de la Constitution.
    bonnes:
    - o1
  indices:
    relance: Pense à la chambre du Parlement dont les membres élaborent et votent la loi.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion fréquente : les sénateurs sont élus lors des élections sénatoriales.'
  - si:
      contient:
      - o3
    relance: 'Faux : le chef de l''État est élu lors de l''élection présidentielle.'
  - si:
      contient:
      - o4
    relance: 'Erreur : se prononcer directement par oui ou par non sur un texte est la définition du référendum.'
  solution: 'Élire les députés qui siègent à l''Assemblée nationale. C''est exact : les élections législatives permettent
    aux citoyens d''élire les députés chargés de voter les lois.'
- id: nblm-selon-quel-mode-de-scrutin-les-senateurs-4
  type: choix
  difficulte: 2
  enonce: Selon quel mode de scrutin les sénateurs sont-ils élus lors des élections sénatoriales ?
  reponse:
    options:
    - id: o1
      texte: Au suffrage indirect, par un collège de grands électeurs.
    - id: o2
      texte: Au suffrage universel direct par l'ensemble des citoyens majeurs.
    - id: o3
      texte: Par tirage au sort parmi les citoyens inscrits sur les listes électorales.
    - id: o4
      texte: Par nomination directe de la part du président de la République.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la différence entre l'élection directe par les citoyens et l'élection par des représentants.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : contrairement aux députés, les sénateurs ne sont pas élus directement par l''ensemble des
      citoyens.'
  - si:
      contient:
      - o3
    relance: 'Faux : les membres du Sénat sont désignés par un vote électoral et non par tirage au sort.'
  - si:
      contient:
      - o4
    relance: 'Faux : le Sénat est une assemblée parlementaire élue et ses membres ne sont pas nommés par l''exécutif.'
  solution: 'Au suffrage indirect, par un collège de grands électeurs. C''est exact : les sénateurs ne sont pas élus directement
    par tous les citoyens, mais par des grands électeurs.'
- id: nblm-pendant-une-campagne-electorale-ou-une-c-5
  type: choix
  difficulte: 2
  enonce: Pendant une campagne électorale ou une campagne référendaire, quel est le rôle principal du débat démocratique ?
  reponse:
    options:
    - id: o1
      texte: Permettre aux candidats ou partisans d'exposer leurs arguments pour éclairer le choix des électeurs.
    - id: o2
      texte: Rendre le vote légalement obligatoire pour l'ensemble de la population.
    - id: o3
      texte: Proclamer d'avance les résultats définitifs avant l'ouverture des bureaux de vote.
    - id: o4
      texte: Interdire l'expression de points de vue divergents dans les médias.
    bonnes:
    - o1
  indices:
    relance: Pense à la fonction d'exposer ses projets et idées avant que l'électeur ne dépose son bulletin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : la campagne ne modifie pas le droit et ne rend pas le vote obligatoire.'
  - si:
      contient:
      - o3
    relance: 'Erreur : les résultats ne sont connus qu''après le passage aux urnes et le dépouillement.'
  - si:
      contient:
      - o4
    relance: 'Faux : la campagne vise au contraire à faire vivre le débat entre idées opposées.'
  solution: 'Permettre aux candidats ou partisans d''exposer leurs arguments pour éclairer le choix des électeurs. C''est
    exact : la campagne électorale est un temps indispensable d''échanges d''arguments avant le vote.'
- id: nblm-parmi-les-propositions-suivantes-sur-les-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes sur les élections et le référendum en France, quelles sont les DEUX affirmations
    exactes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le référendum permet aux citoyens de répondre directement par oui ou par non à une question posée.
    - id: o2
      texte: L'élection sert à choisir des représentants pour exercer un mandat (président, députés, maires...).
    - id: o3
      texte: L'abstention n'a aucun effet sur la représentativité des résultats d'un scrutin.
    - id: o4
      texte: Le référendum du 28 septembre 1958 a servi à élire les premiers députés de la région parisienne.
    bonnes:
    - o1
    - o2
  indices:
    relance: Distingue la fonction d'une élection (choisir quelqu'un) de celle d'un référendum (répondre à une question).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la non-participation influe au contraire sur la représentativité des élus ou du résultat.'
  - si:
      contient:
      - o4
    relance: 'Faux : le référendum du 28 septembre 1958 a permis d''adopter la Constitution de la Ve République.'
  solution: 'Le référendum permet aux citoyens de répondre directement par oui ou par non à une question posée ; L''élection
    sert à choisir des représentants pour exercer un mandat (président, députés, maires...). C''est vrai : c''est la définition
    du référendum où le peuple se prononce directement.'
- id: nblm-en-france-le-fait-pour-un-citoyen-inscri-7
  type: texte_court
  difficulte: 1
  enonce: En France, le fait pour un citoyen inscrit sur les listes électorales de ne pas aller voter lors d'un scrutin s'appelle
    l'______.
  reponse:
    acceptees:
    - abstention
    fautes_tolerees: 1
  indices:
    relance: Ce terme civique désigne le fait de ne pas participer à un scrutin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: abstention. L'abstention désigne le comportement civique d'un électeur qui choisit de ne pas participer à un vote.
- id: nblm-lorsque-tous-les-citoyens-majeurs-votent-8
  type: texte_court
  difficulte: 1
  enonce: Lorsque tous les citoyens majeurs votent eux-mêmes sans intermédiaire pour désigner un représentant, on parle de
    suffrage universel ______.
  reponse:
    acceptees:
    - direct
    fautes_tolerees: 1
  indices:
    relance: Il s'agit de l'adjectif qui s'oppose à 'indirect'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: direct. Le suffrage est 'direct' quand les citoyens élisent immédiatement leurs représentants sans grands électeurs.
