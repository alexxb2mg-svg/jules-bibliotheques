format: 2
notion: elections-referendum
version: 2
etat: generee
declencheurs:
- voter en France
- élection présidentielle
- élections législatives
- vote pas obligatoire
- suffrage indirect sénateurs
- campagne référendaire
- grands électeurs
- tour de scrutin
- inscription listes électorales
- abstention électorale
prerequis:
- constitution-ve-republique
essentiel: |
  Les élections et les référendums sont des moments décisifs de la vie démocratique. Une campagne électorale ou référendaire est une période de débat : les candidats, ou les partisans de chaque camp, présentent leurs arguments aux électeurs, et les médias et les citoyens en discutent.

  En France, le vote n'est pas obligatoire, mais c'est un engagement au sein de la cité. Pour voter, il faut avoir 18 ans, être de nationalité française (ou citoyen européen pour les municipales et les européennes) et être inscrit sur les listes électorales. Le vote est secret. Le vote blanc est reconnu depuis 2014, mais il n'est pas compté comme un suffrage exprimé. On peut aussi voter par procuration.

  Les grandes élections ont des temporalités différentes.
  Présidentielle : tous les 5 ans (quinquennat depuis 2000), au suffrage universel direct, en deux tours.
  Législatives : élection des députés à l'Assemblée nationale, tous les 5 ans, au suffrage direct, dans des circonscriptions, en deux tours.
  Sénatoriales : élection des sénateurs au suffrage indirect, par des grands électeurs (députés, sénateurs, élus locaux). Le Sénat est renouvelé par moitié tous les trois ans.
  Régionales et départementales : elles désignent les conseils régionaux et départementaux.
  Municipales : elles désignent les conseils municipaux, donc le maire, tous les 6 ans.
  Européennes : élection des députés européens, tous les 5 ans, dans chaque État membre.

  Le référendum permet aux citoyens de répondre directement par « oui » ou par « non » à une question. Ce n'est pas un choix de personnes. Exemples : la Constitution de la Ve République est approuvée par référendum le 28 septembre 1958 ; l'élection du président au suffrage universel direct l'est en 1962 ; le quinquennat en 2000.

  On distingue donc le suffrage direct (l'électeur choisit lui-même) et le suffrage indirect (des grands électeurs choisissent). L'abstention est le fait de ne pas voter : elle peut affaiblir la légitimité des élus.

  Au brevet, on attend que tu décrives la campagne, que tu expliques que le vote n'est pas obligatoire mais qu'il engage, et que tu identifies les élections et leurs rythmes.
methode:
- 'Repérer la nature du scrutin : choix de personnes (élection) ou réponse « oui » ou « non » à une question (référendum).'
- 'Pour une élection, identifier ce qu''on élit : président, députés, sénateurs, conseillers régionaux, départementaux, municipaux ou européens.'
- 'Préciser le mode de suffrage : direct (les électeurs votent) ou indirect (des grands électeurs votent).'
- 'Retenir la durée du mandat : 5 ans pour la présidentielle, les législatives et les européennes ; 6 ans pour les municipales, régionales et départementales.'
- 'Dans un développement, relier le vote à l''engagement civique : voter est un droit non obligatoire qui donne du poids à ses opinions.'
vocabulaire:
- terme: élection
  definition: un vote par lequel les citoyens choisissent leurs représentants
- terme: référendum
  definition: un vote par lequel les citoyens répondent par « oui » ou par « non » à une question
- terme: campagne électorale
  definition: la période de débat avant un scrutin, pendant laquelle les candidats présentent leurs projets
- terme: suffrage universel direct
  definition: un vote où tous les électeurs choisissent eux-mêmes leurs représentants
- terme: suffrage indirect
  definition: un vote où des grands électeurs choisissent à la place de l'ensemble des citoyens
- terme: abstention
  definition: le fait de ne pas aller voter
- terme: scrutin
  definition: l'ensemble des opérations de vote
- terme: mandat
  definition: la durée pendant laquelle un élu exerce sa fonction
erreurs_frequentes:
- 'Croire que le vote est obligatoire en France : il ne l''est pas.'
- Confondre élection (choix de représentants) et référendum (réponse par oui ou non à une question).
- 'Croire que les sénateurs sont élus directement par tous les citoyens : ils le sont par des grands électeurs.'
- Confondre députés (Assemblée nationale) et sénateurs (Sénat).
- 'Mélanger les durées : le président, les députés et les eurodéputés sont élus pour 5 ans ; les élus locaux (municipales, départementales, régionales) pour 6 ans.'
exemple:
  enonce: Donne un exemple de référendum en France et explique ce qui le distingue d'une élection.
  solution: 'Le référendum du 28 septembre 1958, qui a permis d''adopter la Constitution de la Ve République : contrairement à une élection, les citoyens ne choisissent pas un représentant mais répondent directement par oui ou non à une question précise.'
exercices:
- id: annee-referendum-1958
  type: nombre
  difficulte: 1
  enonce: En quelle année les citoyens français adoptent-ils la Constitution de la Ve République par référendum ?
  reponse:
    valeur: 1958
    forme: entier
  indices:
    relance: C'est la même année que l'adoption de la Constitution encore en vigueur aujourd'hui en France.
    methode: Ce référendum met fin à la IVe République, jugée instable, à la fin des années 1950.
    etape: Le référendum a lieu le 28 septembre de cette année-là. Écris l'année complète.
  pieges:
  - si:
      valeur: 1962
    relance: 'Cette année-là, le président de la République est élu au suffrage universel direct : c''est une révision de la Constitution, pas son référendum d''adoption.'
  - si:
      valeur: 2000
    relance: Cette année-là marque le passage au quinquennat présidentiel, une révision bien plus tardive que l'adoption de la Constitution.
  solution: La Constitution de la Ve République est adoptée par référendum le 28 septembre 1958.
- id: election-vs-referendum
  type: choix
  difficulte: 1
  enonce: Quelle est la différence essentielle entre une élection et un référendum ?
  reponse:
    options:
    - id: a
      texte: L'élection choisit des représentants, le référendum répond directement par oui ou non à une question
    - id: b
      texte: Le référendum est réservé aux élections locales, l'élection aux élections nationales
    - id: c
      texte: L'élection est obligatoire, le référendum ne l'est pas
    bonnes:
    - a
  indices:
    relance: 'Pense à ce que l''électeur choisit dans chaque cas : une personne, ou une réponse à une question précise ?'
    methode: Dans une élection, on désigne un représentant ; dans un référendum, on répond directement à une question posée par les pouvoirs publics.
    etape: La bonne réponse porte sur ce que désigne le vote, pas sur son échelle géographique ni sur son caractère obligatoire.
  pieges:
  - si:
      contient:
      - b
    relance: Le référendum n'est pas réservé aux élections locales ; il peut porter sur des questions nationales, comme celui de 1958.
  - si:
      contient:
      - c
    relance: En France, ni l'élection ni le référendum ne sont obligatoires pour les électeurs. Ce n'est pas ce qui les distingue.
  solution: L'élection permet de choisir des représentants ; le référendum permet aux citoyens de répondre directement par oui ou non à une question posée par les pouvoirs publics.
- id: types-elections
  type: association
  difficulte: 2
  enonce: Relie chaque élection au mode de suffrage qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: Élection législative
    - id: b
      texte: Élection sénatoriale
    droite:
    - id: x
      texte: Suffrage universel direct (tous les électeurs votent directement)
    - id: y
      texte: Suffrage indirect (des grands électeurs votent, notamment des élus locaux)
    paires:
      a: x
      b: y
  indices:
    relance: Pour l'une de ces deux élections, chaque citoyen majeur vote directement ; pour l'autre, ce sont des élus locaux qui votent à leur place.
    methode: Les députés sont élus par tous les électeurs ; les sénateurs sont élus par des grands électeurs.
    etape: Associe « législative » au suffrage universel direct, et « sénatoriale » au suffrage indirect.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Les deux modes de suffrage sont inversés. Laquelle des deux élections implique un vote direct de tous les citoyens ?
  - si:
      diagnostic: associations_fausses
    relance: Relis d'abord la définition de chaque mode de suffrage avant de les associer aux élections.
  solution: Les élections législatives (députés) se font au suffrage universel direct, par tous les électeurs ; les élections sénatoriales se font au suffrage indirect, par des grands électeurs, notamment des élus locaux.
- id: developpement-vote-engagement
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique pourquoi voter, bien que non obligatoire en France, constitue un engagement civique important.'
  criteres:
  - L'élève rappelle que le vote n'est pas une obligation légale en France.
  - L'élève explique que voter permet de choisir ses représentants ou de se prononcer sur une question.
  - L'élève montre qu'une forte abstention peut fragiliser la légitimité des élus ou du résultat d'un référendum.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Le vote est-il une obligation légale en France ? Que se passe-t-il si peu de gens votent ?
    methode: Rappelle d'abord que le vote n'est pas obligatoire, puis explique son intérêt et le risque d'une forte abstention.
    etape: Tu peux commencer ainsi « En France, voter n'est pas une obligation légale... », puis développer ton premier argument.
  solution: En France, voter n'est pas une obligation légale, contrairement à certains autres pays. Voter permet néanmoins de choisir ses représentants ou de se prononcer directement sur une question, ce qui est une forme concrète de participation à la vie démocratique. Une forte abstention peut cependant fragiliser la légitimité des élus ou du résultat d'un référendum, car elle réduit la part de la population qui s'est exprimée. Voter reste donc un engagement civique important, même sans caractère obligatoire.
- id: duree-mandat-presidentiel
  type: nombre
  difficulte: 1
  enonce: Depuis le passage au quinquennat en 2000, pour combien d'années le président de la République est-il élu ?
  reponse:
    valeur: 5
    forme: entier
  indices:
    relance: Le mot « quinquennat » contient une racine latine qui veut dire « cinq ».
    methode: Un quinquennat dure autant d'années que le nombre de doigts d'une main.
    etape: Réponds par un seul nombre, plus petit que 7 et plus grand que 3.
  pieges:
  - si:
      valeur: 7
    relance: Sept ans est l'ancienne durée, avant la réforme de 2000. Que dit le mot « quinquennat » ?
  solution: Un quinquennat dure 5 ans.
- id: mode-suffrage-senateurs
  type: choix
  difficulte: 1
  enonce: Comment les sénateurs sont-ils élus ?
  reponse:
    options:
    - id: a
      texte: Au suffrage indirect, par des grands électeurs
    - id: b
      texte: Au suffrage universel direct, par tous les électeurs
    - id: c
      texte: Par tirage au sort parmi les citoyens
    bonnes:
    - a
  indices:
    relance: Ce sont les députés, et non les sénateurs, qui sont élus par tous les électeurs.
    methode: Les grands électeurs sont surtout des élus (députés, sénateurs, élus locaux).
    etape: Cherche la réponse qui parle d'un vote en deux étapes, et non d'un vote de tous les citoyens.
  pieges:
  - si:
      contient:
      - b
    relance: Le suffrage direct est celui des députés ou du président. Qui vote pour les sénateurs ?
  - si:
      contient:
      - c
    relance: Il n'y a pas de tirage au sort pour élire les sénateurs. Relis la définition des grands électeurs.
  solution: Les sénateurs sont élus au suffrage indirect par des grands électeurs (députés, sénateurs et élus locaux).
- id: scrutin-election-ou-referendum
  type: association
  difficulte: 2
  enonce: Relie chaque scrutin à son type.
  reponse:
    gauche:
    - id: a
      texte: Approbation de la Constitution de la Ve République en 1958
    - id: b
      texte: Élection des conseillers municipaux et du maire
    - id: c
      texte: Élection des députés européens
    droite:
    - id: x
      texte: 'Référendum : réponse par oui ou par non'
    - id: y
      texte: Élection locale
    - id: z
      texte: Élection européenne
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Demande-toi d'abord si les citoyens choisissent des personnes ou répondent à une question.
    methode: Une élection désigne des représentants ; un référendum pose une question sur un texte ou une décision.
    etape: L'approbation d'un texte constitutionnel se fait par oui ou non.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère le scrutin où l'on répond par oui ou non.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le scrutin où l'on ne choisit aucune personne.
  solution: Le vote de 1958 est un référendum. Les municipales sont une élection locale. L'élection des députés européens est une élection européenne.
- id: rythme-des-elections
  type: association
  difficulte: 2
  enonce: Relie chaque élection à la durée de mandat qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: Élection présidentielle
    - id: b
      texte: Élections municipales
    - id: c
      texte: Renouvellement du Sénat (par moitié)
    droite:
    - id: x
      texte: 5 ans
    - id: y
      texte: 6 ans
    - id: z
      texte: 3 ans
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Rappelle-toi d'abord le quinquennat, puis la durée des élus locaux.
    methode: Le président est élu pour moins longtemps que les conseillers municipaux ; le Sénat suit un rythme à part.
    etape: Une des trois durées ne concerne que le Sénat, renouvelé par moitié.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare les élections nationales aux élections locales.
  - si:
      diagnostic: associations_fausses
    relance: Commence par la présidentielle, dont tu connais la durée depuis 2000.
  solution: 'Présidentielle : 5 ans. Municipales : 6 ans. Le Sénat est renouvelé par moitié tous les 3 ans.'
