format: 2
notion: information-desinformation-complotisme
version: 1
etat: verifiee
declencheurs:
- fausse information volontaire
- fake news
- fact-checking
- théorie du complot
- boucs émissaires
- loi du 22 décembre 2018
prerequis:
- democratie-deliberative-opinion-publique
essentiel: 'La désinformation est un ensemble de techniques de communication utilisées pour tromper ou influencer volontairement
  l''opinion publique par un ou plusieurs médias : contrairement à une simple erreur, elle est intentionnelle.


  En France, la loi du 22 décembre 2018 relative à la lutte contre la manipulation de l''information permet, en particulier
  en période électorale, de saisir un juge pour faire cesser rapidement la diffusion de fausses informations créées de manière
  délibérée et massive dans le but de fausser une élection.


  La désinformation peut nourrir le complotisme, c''est-à-dire la croyance en des complots cachés, qui s''appuie souvent sur
  des faits déformés ou inventés et qui peut alimenter le racisme et l''antisémitisme.


  Pour s''en protéger, il est essentiel d''établir rigoureusement les faits et de distinguer trois notions différentes : une
  croyance (non vérifiable), une opinion (un point de vue personnel) et un savoir (une connaissance vérifiée). Des services
  de fact-checking (vérification des faits) aident à distinguer une information vraie d''une information fausse.'
methode:
- Définir la désinformation par son caractère volontaire et intentionnel, contrairement à une simple erreur.
- Citer la loi du 22 décembre 2018 comme réponse législative française à la désinformation en période électorale.
- 'Distinguer croyance, opinion et savoir : trois façons différentes d''affirmer quelque chose.'
- Adopter une méthode de vérification avant de partager une information (source, date, recoupement).
vocabulaire:
- terme: désinformation
  definition: la diffusion volontaire et intentionnelle de fausses informations pour tromper l'opinion publique
- terme: complotisme
  definition: la croyance en l'existence de complots cachés, souvent fondée sur des informations déformées ou inventées
- terme: fact-checking
  definition: la vérification méthodique des faits avancés dans une information, pour établir s'ils sont vrais ou faux
erreurs_frequentes:
- Confondre la désinformation, volontaire, et une simple erreur ou mésinformation, involontaire.
- Croire que toute information trouvée en ligne est fiable sans vérification.
- 'Confondre opinion (point de vue personnel) et savoir (fait vérifié) : les deux ne se valent pas de la même façon dans un
  débat argumenté.'
- Oublier que la désinformation peut nourrir des idées racistes ou antisémites via le complotisme.
exemple:
  enonce: Que permet la loi du 22 décembre 2018 relative à la lutte contre la manipulation de l'information ?
  solution: Elle permet, notamment en période électorale, de saisir un juge en urgence pour faire cesser la diffusion de fausses
    informations créées et diffusées de façon délibérée et massive dans le but de fausser le résultat d'une élection.
exercices:
- id: annee-loi-manipulation-info
  type: nombre
  difficulte: 1
  enonce: En quelle année la loi française relative à la lutte contre la manipulation de l'information est-elle adoptée ?
  reponse:
    valeur: 2018
    forme: entier
  indices:
    relance: Cette loi est adoptée plus récemment que la loi de 1905 sur la laïcité et plus tôt que la loi sur les lanceurs
      d'alerte.
    methode: Elle permet, en période électorale, de saisir un juge en urgence contre les fausses informations diffusées massivement.
    etape: L'année se termine par « 18 », dans la seconde décennie des années 2000.
  pieges:
  - si:
      valeur: 2022
    relance: 2022 est l'année de la loi sur la protection des lanceurs d'alerte, un texte différent.
  - si:
      valeur: 1905
    relance: 1905 est l'année de la loi sur la séparation des Églises et de l'État, sans lien avec la désinformation.
  solution: La loi relative à la lutte contre la manipulation de l'information est adoptée le 22 décembre 2018.
- id: desinformation-vs-erreur
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qui distingue la désinformation d'une simple erreur d'information ?
  reponse:
    options:
    - id: a
      texte: Le caractère volontaire et intentionnel de la désinformation
    - id: b
      texte: Le fait que la désinformation circule uniquement sur les médias sociaux
    - id: c
      texte: Le fait que la désinformation ne concerne que la politique
    bonnes:
    - a
  indices:
    relance: Pense à l'intention de la personne ou du média qui diffuse l'information fausse.
    methode: Une erreur peut être commise sans le vouloir ; la désinformation, elle, vise délibérément à tromper.
    etape: La bonne réponse porte sur l'intention, pas sur le support de diffusion ni sur le sujet traité.
  pieges:
  - si:
      contient:
      - b
    relance: La désinformation ne circule pas seulement sur les médias sociaux, elle peut aussi passer par d'autres médias.
      Ce n'est pas le support qui la définit.
  - si:
      contient:
      - c
    relance: La désinformation ne concerne pas seulement la politique, elle peut porter sur la santé, les sciences ou d'autres
      sujets.
  solution: 'Ce qui distingue la désinformation d''une simple erreur, c''est son caractère volontaire et intentionnel : elle
    vise délibérément à tromper ou influencer l''opinion publique.'
- id: croyance-opinion-savoir
  type: association
  difficulte: 2
  enonce: Relie chaque terme à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Croyance
    - id: b
      texte: Opinion
    - id: c
      texte: Savoir
    droite:
    - id: x
      texte: Une conviction qui repose sur la foi ou l'intuition, sans preuve vérifiable
    - id: y
      texte: Un point de vue personnel, discutable
    - id: z
      texte: Une connaissance établie et vérifiée, qui peut être démontrée
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une seule de ces trois notions peut être démontrée par la science ou le droit ; les deux autres non.
    methode: Classe-les selon leur degré de preuve, de la moins vérifiable (croyance) à la plus vérifiée (savoir).
    etape: Le savoir se démontre ; l'opinion se discute ; la croyance repose sur la foi ou l'intuition.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Deux notions sont inversées. Laquelle des trois peut vraiment être démontrée par une preuve vérifiable ?
  - si:
      diagnostic: associations_fausses
    relance: Relis d'abord chaque définition séparément, puis associe-la au terme correspondant.
  solution: La croyance repose sur la foi ou l'intuition, sans preuve vérifiable. L'opinion est un point de vue personnel,
    discutable. Le savoir est une connaissance établie et vérifiée, qui peut être démontrée.
- id: developpement-desinformation-complotisme
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique comment la désinformation peut nourrir le complotisme.'
  criteres:
  - L'élève explique que la désinformation diffuse volontairement des informations fausses ou déformées.
  - L'élève montre que ces informations peuvent servir de base à des théories du complot.
  - L'élève précise que ce phénomène peut nourrir le racisme et l'antisémitisme.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Qu'est-ce qu'une théorie du complot suppose, à propos de la vérité officielle ?
    methode: Explique d'abord ce qu'est la désinformation, puis montre comment elle alimente une théorie du complot.
    etape: Tu peux commencer ainsi « La désinformation diffuse volontairement des informations fausses ou déformées... »,
      puis relier cela au complotisme.
  solution: L'élève doit expliquer que la désinformation diffuse volontairement des informations fausses ou déformées, que
    ces fausses informations peuvent servir de base à des théories du complot prétendant révéler une vérité cachée derrière
    les faits officiels, que ce phénomène peut nourrir le racisme et l'antisémitisme en désignant des boucs émissaires, et
    conclure sur l'importance du fact-checking et de l'esprit critique.
- id: nblm-quelle-est-la-caracteristique-principale-1
  type: choix
  difficulte: 2
  enonce: Quelle est la caractéristique principale d'une fausse information volontaire (désinformation), contrairement à une
    simple erreur ?
  reponse:
    options:
    - id: o1
      texte: Elle est diffusée de façon intentionnelle pour tromper ou influencer l'opinion publique.
    - id: o2
      texte: Elle repose toujours sur des études scientifiques validées.
    - id: o3
      texte: Elle est systématiquement rédigée par des journalistes professionnels.
    - id: o4
      texte: Elle n'a aucun impact sur le débat démocratique.
    bonnes:
    - o1
  indices:
    relance: Pense à la motivation de celui qui crée ce type de message.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : la désinformation déforme ou invente des faits au lieu de s''appuyer sur des données scientifiques.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur classique : la fausse information est créée pour manipuler, sans respecter la déontologie
      journalistique.'
  - si:
      contient:
      - o4
    relance: 'C''est inexact : la désinformation cherche au contraire à influencer l''opinion publique et le résultat des
      choix citoyens.'
  solution: 'Elle est diffusée de façon intentionnelle pour tromper ou influencer l''opinion publique. C''est exact : la désinformation
    se définit par son caractère volontaire et intentionnel, alors qu''une erreur est involontaire.'
- id: nblm-que-permet-la-loi-du-22-decembre-2018-re-2
  type: choix
  difficulte: 2
  enonce: Que permet la loi du 22 décembre 2018 relative à la lutte contre la manipulation de l'information ?
  reponse:
    options:
    - id: o1
      texte: Saisir un juge en urgence pour faire cesser la diffusion massive de fausses informations créées délibérément
        en période électorale.
    - id: o2
      texte: Interdire définitivement l'accès aux réseaux sociaux pendant les vacances scolaires.
    - id: o3
      texte: Rendre le vote obligatoire pour tous les citoyens français.
    - id: o4
      texte: Supprimer la liberté de la presse dans les journaux.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'action de la justice pendant les campagnes électorales.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : la loi encadre la diffusion d''informations en période électorale, elle ne ferme pas les réseaux
      sociaux.'
  - si:
      contient:
      - o3
    relance: 'Attention : en France, le vote est un droit et un devoir civique mais il n''est pas obligatoire.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la loi protège le débat démocratique contre les manipulations délibérées sans supprimer la liberté
      de la presse.'
  solution: 'Saisir un juge en urgence pour faire cesser la diffusion massive de fausses informations créées délibérément
    en période électorale. C''est exact : cette loi vise à empêcher que des intox massives ne viennent fausser le résultat
    d''une élection.'
- id: nblm-en-quoi-consiste-le-travail-de-fact-chec-3
  type: choix
  difficulte: 2
  enonce: En quoi consiste le travail de fact-checking face aux fake news ?
  reponse:
    options:
    - id: o1
      texte: Effectuer une vérification méthodique des faits avancés dans une information pour déterminer si elle est vraie
        ou fausse.
    - id: o2
      texte: Créer de fausses rumeurs pour tester la crédulité des lecteurs.
    - id: o3
      texte: Supprimer automatiquement toutes les opinions exprimées par les citoyens.
    - id: o4
      texte: Interdire le débat d'idées sur Internet.
    bonnes:
    - o1
  indices:
    relance: Pense au rôle de contrôle et de vérification rigoureuse des affirmations.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : créer de fausses rumeurs est une forme de désinformation, pas de la vérification.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur : le fact-checking examine des faits vérifiables, pas les opinions personnelles.'
  - si:
      contient:
      - o4
    relance: 'C''est inexact : le fact-checking alimente le débat argumenté en apportant des faits vérifiés.'
  solution: 'Effectuer une vérification méthodique des faits avancés dans une information pour déterminer si elle est vraie
    ou fausse. C''est exact : le fact-checking est la vérification rigoureuse des faits et des sources pour démêler le vrai
    du faux.'
- id: nblm-comment-la-fiche-definit-elle-le-complot-4
  type: choix
  difficulte: 2
  enonce: Comment la fiche définit-elle le complotisme (théorie du complot) et ses dangers ?
  reponse:
    options:
    - id: o1
      texte: C'est la croyance en des complots cachés, s'appuyant sur des faits déformés ou inventés, pouvant désigner des
        boucs émissaires et alimenter le racisme.
    - id: o2
      texte: C'est une démarche d'investigation scientifique neutre et vérifiée.
    - id: o3
      texte: C'est une simple erreur de calcul commise par un journaliste.
    - id: o4
      texte: C'est une méthode d'apprentissage officielle du programme scolaire.
    bonnes:
    - o1
  indices:
    relance: Pense à l'accusation de groupes cachés et à la déformation de la réalité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : le complotisme refuse la méthode scientifique et s''appuie sur des spéculations non vérifiables.'
  - si:
      contient:
      - o3
    relance: 'Ne pas confondre : une erreur de calcul est ponctuelle, alors que le complotisme est une croyance structurée.'
  - si:
      contient:
      - o4
    relance: 'C''est absurde : l''école enseigne l''esprit critique pour se protéger du complotisme.'
  solution: 'C''est la croyance en des complots cachés, s''appuyant sur des faits déformés ou inventés, pouvant désigner des
    boucs émissaires et alimenter le racisme. C''est exact : la théorie du complot déforme le réel, accuse souvent des groupes
    cibles et nourrit le racisme ou l''antisémitisme.'
- id: nblm-quelle-est-la-difference-fondamentale-en-5
  type: choix
  difficulte: 2
  enonce: Quelle est la différence fondamentale entre une opinion et un savoir ?
  reponse:
    options:
    - id: o1
      texte: Une opinion est un point de vue personnel subjectif, tandis qu'un savoir est une connaissance vérifiée par des
        faits.
    - id: o2
      texte: L'opinion est prouvée scientifiquement, alors que le savoir est une croyance individuelle.
    - id: o3
      texte: L'opinion et le savoir ont exactement la même valeur de preuve dans un débat.
    - id: o4
      texte: Le savoir change au hasard d'un vote, alors que l'opinion ne change jamais.
    bonnes:
    - o1
  indices:
    relance: Considère le niveau de preuve et d'objectivité de chaque notion.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une inversion totale des définitions.
  - si:
      contient:
      - o3
    relance: 'C''est l''erreur fréquente soulignée dans la fiche : une opinion personnelle ne remplace pas une connaissance
      vérifiée.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : un savoir scientifique ne dépend pas d''un vote d''opinion.'
  solution: 'Une opinion est un point de vue personnel subjectif, tandis qu''un savoir est une connaissance vérifiée par des
    faits. C''est exact : le savoir s''appuie sur des preuves et des faits établis, contrairement à la simple opinion personnelle.'
- id: nblm-quelles-sont-les-deux-attitudes-recomman-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX attitudes recommandées pour adopter une méthode de vérification efficace face aux fake news
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Vérifier la fiabilité de la source et la date de publication du document.
    - id: o2
      texte: Recouper l'information en vérifiant si d'autres sources sérieuses en parlent.
    - id: o3
      texte: Relayer immédiatement le message si le titre fait peur ou provoque une émotion forte.
    - id: o4
      texte: Faire confiance aveuglément à toutes les publications partagées sur les réseaux sociaux.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les réflexes qui s'appuient sur l'analyse critique et le croisement des informations.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est une erreur classique : les fausses informations cherchent précisément à jouer sur les émotions pour être
      partagées sans réflexion.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : Internet contient de nombreux contenus non vérifiés ou délibérément trompeurs.'
  solution: 'Vérifier la fiabilité de la source et la date de publication du document ; Recouper l''information en vérifiant
    si d''autres sources sérieuses en parlent. C''est exact : contrôler qui s''exprime et quand l''information a été publiée
    permet de déceler les manipulations.'
