format: 2
notion: information-desinformation-complotisme
version: 1
etat: verifiee
declencheurs:
- fausse information volontaire
- fake news
- fact-checking
- théorie du complot
- boucs émissaires
- loi du 22 décembre 2018
prerequis:
- democratie-deliberative-opinion-publique
essentiel: 'La désinformation est un ensemble de techniques de communication utilisées pour tromper ou influencer volontairement
  l''opinion publique par un ou plusieurs médias : contrairement à une simple erreur, elle est intentionnelle.


  En France, la loi du 22 décembre 2018 relative à la lutte contre la manipulation de l''information permet, en particulier
  en période électorale, de saisir un juge pour faire cesser rapidement la diffusion de fausses informations créées de manière
  délibérée et massive dans le but de fausser une élection.


  La désinformation peut nourrir le complotisme, c''est-à-dire la croyance en des complots cachés, qui s''appuie souvent sur
  des faits déformés ou inventés et qui peut alimenter le racisme et l''antisémitisme.


  Pour s''en protéger, il est essentiel d''établir rigoureusement les faits et de distinguer trois notions différentes : une
  croyance (non vérifiable), une opinion (un point de vue personnel) et un savoir (une connaissance vérifiée). Des services
  de fact-checking (vérification des faits) aident à distinguer une information vraie d''une information fausse.'
methode:
- Définir la désinformation par son caractère volontaire et intentionnel, contrairement à une simple erreur.
- Citer la loi du 22 décembre 2018 comme réponse législative française à la désinformation en période électorale.
- 'Distinguer croyance, opinion et savoir : trois façons différentes d''affirmer quelque chose.'
- Adopter une méthode de vérification avant de partager une information (source, date, recoupement).
vocabulaire:
- terme: désinformation
  definition: la diffusion volontaire et intentionnelle de fausses informations pour tromper l'opinion publique
- terme: complotisme
  definition: la croyance en l'existence de complots cachés, souvent fondée sur des informations déformées ou inventées
- terme: fact-checking
  definition: la vérification méthodique des faits avancés dans une information, pour établir s'ils sont vrais ou faux
erreurs_frequentes:
- Confondre la désinformation, volontaire, et une simple erreur ou mésinformation, involontaire.
- Croire que toute information trouvée en ligne est fiable sans vérification.
- 'Confondre opinion (point de vue personnel) et savoir (fait vérifié) : les deux ne se valent pas de la même façon dans un
  débat argumenté.'
- Oublier que la désinformation peut nourrir des idées racistes ou antisémites via le complotisme.
exemple:
  enonce: Que permet la loi du 22 décembre 2018 relative à la lutte contre la manipulation de l'information ?
  solution: Elle permet, notamment en période électorale, de saisir un juge en urgence pour faire cesser la diffusion de fausses
    informations créées et diffusées de façon délibérée et massive dans le but de fausser le résultat d'une élection.
exercices:
- id: annee-loi-manipulation-info
  type: nombre
  difficulte: 1
  enonce: En quelle année la loi française relative à la lutte contre la manipulation de l'information est-elle adoptée ?
  reponse:
    valeur: 2018
    forme: entier
  indices:
    relance: Cette loi est adoptée plus récemment que la loi de 1905 sur la laïcité et plus tôt que la loi sur les lanceurs
      d'alerte.
    methode: Elle permet, en période électorale, de saisir un juge en urgence contre les fausses informations diffusées massivement.
    etape: L'année se termine par « 18 », dans la seconde décennie des années 2000.
  pieges:
  - si:
      valeur: 2022
    relance: 2022 est l'année de la loi sur la protection des lanceurs d'alerte, un texte différent.
  - si:
      valeur: 1905
    relance: 1905 est l'année de la loi sur la séparation des Églises et de l'État, sans lien avec la désinformation.
  solution: La loi relative à la lutte contre la manipulation de l'information est adoptée le 22 décembre 2018.
- id: desinformation-vs-erreur
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qui distingue la désinformation d'une simple erreur d'information ?
  reponse:
    options:
    - id: a
      texte: Le caractère volontaire et intentionnel de la désinformation
    - id: b
      texte: Le fait que la désinformation circule uniquement sur les médias sociaux
    - id: c
      texte: Le fait que la désinformation ne concerne que la politique
    bonnes:
    - a
  indices:
    relance: Pense à l'intention de la personne ou du média qui diffuse l'information fausse.
    methode: Une erreur peut être commise sans le vouloir ; la désinformation, elle, vise délibérément à tromper.
    etape: La bonne réponse porte sur l'intention, pas sur le support de diffusion ni sur le sujet traité.
  pieges:
  - si:
      contient:
      - b
    relance: La désinformation ne circule pas seulement sur les médias sociaux, elle peut aussi passer par d'autres médias.
      Ce n'est pas le support qui la définit.
  - si:
      contient:
      - c
    relance: La désinformation ne concerne pas seulement la politique, elle peut porter sur la santé, les sciences ou d'autres
      sujets.
  solution: 'Ce qui distingue la désinformation d''une simple erreur, c''est son caractère volontaire et intentionnel : elle
    vise délibérément à tromper ou influencer l''opinion publique.'
- id: croyance-opinion-savoir
  type: association
  difficulte: 2
  enonce: Relie chaque terme à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Croyance
    - id: b
      texte: Opinion
    - id: c
      texte: Savoir
    droite:
    - id: x
      texte: Une conviction qui repose sur la foi ou l'intuition, sans preuve vérifiable
    - id: y
      texte: Un point de vue personnel, discutable
    - id: z
      texte: Une connaissance établie et vérifiée, qui peut être démontrée
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une seule de ces trois notions peut être démontrée par la science ou le droit ; les deux autres non.
    methode: Classe-les selon leur degré de preuve, de la moins vérifiable (croyance) à la plus vérifiée (savoir).
    etape: Le savoir se démontre ; l'opinion se discute ; la croyance repose sur la foi ou l'intuition.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Deux notions sont inversées. Laquelle des trois peut vraiment être démontrée par une preuve vérifiable ?
  - si:
      diagnostic: associations_fausses
    relance: Relis d'abord chaque définition séparément, puis associe-la au terme correspondant.
  solution: La croyance repose sur la foi ou l'intuition, sans preuve vérifiable. L'opinion est un point de vue personnel,
    discutable. Le savoir est une connaissance établie et vérifiée, qui peut être démontrée.
- id: developpement-desinformation-complotisme
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique comment la désinformation peut nourrir le complotisme.'
  criteres:
  - L'élève explique que la désinformation diffuse volontairement des informations fausses ou déformées.
  - L'élève montre que ces informations peuvent servir de base à des théories du complot.
  - L'élève précise que ce phénomène peut nourrir le racisme et l'antisémitisme.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Qu'est-ce qu'une théorie du complot suppose, à propos de la vérité officielle ?
    methode: Explique d'abord ce qu'est la désinformation, puis montre comment elle alimente une théorie du complot.
    etape: Tu peux commencer ainsi « La désinformation diffuse volontairement des informations fausses ou déformées... »,
      puis relier cela au complotisme.
  solution: L'élève doit expliquer que la désinformation diffuse volontairement des informations fausses ou déformées, que
    ces fausses informations peuvent servir de base à des théories du complot prétendant révéler une vérité cachée derrière
    les faits officiels, que ce phénomène peut nourrir le racisme et l'antisémitisme en désignant des boucs émissaires, et
    conclure sur l'importance du fact-checking et de l'esprit critique.
