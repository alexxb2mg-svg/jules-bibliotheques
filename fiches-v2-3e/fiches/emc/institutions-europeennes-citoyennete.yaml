format: 2
notion: institutions-europeennes-citoyennete
version: 2
etat: generee
declencheurs:
- citoyen européen
- Cour de justice de l'UE
- CEDH
- Conseil de l'Europe
- droit communautaire
- recours devant une juridiction européenne
- 46 pays
- Strasbourg Luxembourg
- droit européen
- saisir la justice européenne
prerequis: []
essentiel: |
  Depuis l'après-guerre, la démocratie française s'inscrit dans deux grands ensembles européens : le Conseil de l'Europe et l'Union européenne (UE). Ils sont différents.

  Le Conseil de l'Europe est une organisation créée en 1949. Il siège à Strasbourg. Il défend les droits de l'homme et la démocratie. Il compte 46 États et il a rédigé la Convention européenne des droits de l'homme.

  L'Union européenne naît de la coopération économique commencée dans les années 1950 (traité de Rome en 1957, traité de Maastricht en 1992). Elle compte 27 États membres. Ses principales institutions sont le Parlement européen (élu par les citoyens), la Commission européenne (elle propose les textes), le Conseil de l'UE et le Conseil européen (les États), et la Cour de justice.

  Dans l'UE, les États membres sont tenus d'appliquer le droit de l'Union, aussi appelé droit communautaire. Il comprend les traités, les règlements, les directives et les décisions de la Cour de justice de l'Union européenne (CJUE). Un règlement s'applique directement dans tous les États. Une directive fixe un objectif : chaque État doit ensuite l'inscrire dans sa loi nationale.

  La CJUE siège à Luxembourg. Elle veille à ce que les États et les institutions respectent le droit de l'Union. Elle aide aussi les juges nationaux à l'interpréter.

  Un citoyen européen peut faire valoir ses droits devant une juridiction européenne. Il y en a deux à distinguer. La CJUE (Luxembourg) concerne le droit de l'Union. La Cour européenne des droits de l'homme (CEDH, Strasbourg) concerne la Convention européenne des droits de l'homme. On peut la saisir quand on estime qu'un État a violé ses droits, après avoir épuisé les recours devant les juges de son pays.

  La citoyenneté européenne s'ajoute à la citoyenneté nationale : elle permet de circuler et de vivre dans un autre État membre et de voter aux élections européennes et municipales là où l'on réside.

  Au brevet, on attend que tu distingues Conseil de l'Europe et UE, CJUE et CEDH, et que tu expliques qu'un citoyen peut saisir la justice européenne.
methode:
- 'Commencer par classer l''institution : Conseil de l''Europe (46 États, Strasbourg) ou Union européenne (27 États) ?'
- 'Pour une juridiction, se demander quel texte elle fait respecter : le droit de l''UE (CJUE) ou la Convention européenne des droits de l''homme (CEDH).'
- 'Distinguer les textes du droit de l''UE : traités, règlements (applicables directement), directives (à transposer), décisions de la CJUE.'
- 'Retenir un siège par juridiction : Luxembourg pour la CJUE, Strasbourg pour la CEDH.'
- Dans un développement, expliquer qui peut saisir, quelle juridiction, pour quel droit.
vocabulaire:
- terme: Conseil de l'Europe
  definition: une organisation de 46 États, créée en 1949, qui défend les droits de l'homme et la démocratie
- terme: Union européenne
  definition: une union de 27 États qui partagent des institutions et des règles communes
- terme: droit communautaire
  definition: l'ensemble des règles de l'Union européenne que les États membres doivent appliquer
- terme: règlement
  definition: un texte européen qui s'applique directement et de la même façon dans tous les États membres
- terme: directive
  definition: un texte européen qui fixe un objectif que chaque État doit inscrire dans sa propre loi
- terme: CJUE
  definition: la Cour de justice de l'Union européenne, qui siège à Luxembourg et veille au respect du droit de l'Union
- terme: CEDH
  definition: la Cour européenne des droits de l'homme, qui siège à Strasbourg et veille au respect de la Convention européenne des droits de l'homme
- terme: citoyen européen
  definition: toute personne qui a la nationalité d'un État membre de l'Union européenne
erreurs_frequentes:
- Confondre le Conseil de l'Europe (46 États) et l'Union européenne (27 États).
- Confondre la CJUE (Luxembourg, droit de l'Union) et la CEDH (Strasbourg, droits de l'homme).
- 'Croire que la CEDH est une institution de l''Union européenne : elle dépend du Conseil de l''Europe.'
- 'Penser qu''une directive s''applique directement : chaque État doit d''abord la transposer dans sa loi.'
- 'Croire que le droit européen est optionnel : les États membres de l''UE sont tenus de l''appliquer.'
exemple:
  enonce: Quelle est la différence entre la CJUE et la CEDH ?
  solution: La CJUE (Cour de justice de l'Union européenne), à Luxembourg, veille au respect du droit de l'Union européenne par ses États membres. La CEDH (Cour européenne des droits de l'homme), à Strasbourg, veille au respect de la Convention européenne des droits de l'homme dans les 46 pays membres du Conseil de l'Europe, une organisation différente de l'UE.
exercices:
- id: sieges-cjue-cedh
  type: association
  difficulte: 1
  enonce: Relie chaque juridiction européenne à la ville où elle siège.
  reponse:
    gauche:
    - id: a
      texte: Cour de justice de l'Union européenne (CJUE)
    - id: b
      texte: Cour européenne des droits de l'homme (CEDH)
    droite:
    - id: x
      texte: Luxembourg
    - id: y
      texte: Strasbourg
    paires:
      a: x
      b: y
  indices:
    relance: Une des deux villes est aussi le siège d'une grande institution de l'Union européenne ; l'autre accueille régulièrement le Parlement européen en session.
    methode: La CJUE veille au respect du droit de l'Union européenne ; la CEDH veille au respect des droits de l'homme, dans un cadre plus large que l'UE.
    etape: Luxembourg accueille les institutions liées au droit de l'Union ; Strasbourg accueille les institutions liées aux droits de l'homme.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Les deux villes sont inversées. Laquelle est liée au droit de l'Union européenne, laquelle aux droits de l'homme ?
  - si:
      diagnostic: associations_fausses
    relance: Relis d'abord ce que contrôle chaque juridiction avant d'associer une ville à chacune.
  solution: La CJUE siège à Luxembourg ; la CEDH siège à Strasbourg.
- id: role-cjue
  type: choix
  difficulte: 2
  enonce: Que veille à faire respecter la Cour de justice de l'Union européenne (CJUE) ?
  reponse:
    options:
    - id: a
      texte: Le respect du droit de l'Union européenne par les États membres
    - id: b
      texte: Le respect de la Convention européenne des droits de l'homme
    - id: c
      texte: Le respect des lois nationales de chaque pays membre de l'UE
    bonnes:
    - a
  indices:
    relance: Pense à ce que « communautaire » ou « de l'Union » signifie pour cette cour.
    methode: La CJUE est l'institution judiciaire de l'Union européenne, pas du Conseil de l'Europe.
    etape: Elle contrôle l'application des traités, règlements, directives et décisions de l'UE, pas les lois propres à chaque pays.
  pieges:
  - si:
      contient:
      - b
    relance: Le respect de la Convention européenne des droits de l'homme, c'est le rôle de la CEDH, une juridiction différente liée au Conseil de l'Europe.
  - si:
      contient:
      - c
    relance: La CJUE ne contrôle pas les lois propres à chaque pays. Ce qu'elle fait respecter vient d'un échelon supérieur, commun à tous les États membres.
  solution: La CJUE veille au respect du droit de l'Union européenne (traités, règlements, directives, décisions de la CJUE) par les États membres.
- id: sigle-cedh
  type: texte_court
  difficulte: 2
  enonce: Quel sigle de quatre lettres désigne la juridiction, installée à Strasbourg, qui veille au respect de la Convention européenne des droits de l'homme dans 46 pays ?
  reponse:
    acceptees:
    - CEDH
    fautes_tolerees: 1
  indices:
    relance: Ce sigle reprend les initiales de « Cour européenne des droits de l'homme ».
    methode: Ce n'est pas la même juridiction que la CJUE, qui siège à Luxembourg pour le droit de l'Union européenne.
    etape: Complète les quatre initiales de « Cour », « européenne », « droits », « homme ».
  pieges:
  - si:
      valeur: CJUE
    relance: La CJUE est la Cour de justice de l'Union européenne, à Luxembourg. Cherche le sigle de la juridiction de Strasbourg, liée au Conseil de l'Europe.
  solution: Le sigle est CEDH, pour Cour européenne des droits de l'homme.
- id: developpement-recours-europeen
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique comment un citoyen européen peut faire valoir ses droits devant une juridiction européenne.'
  criteres:
  - L'élève distingue la CJUE (droit de l'Union européenne) et la CEDH (Convention européenne des droits de l'homme).
  - L'élève précise le siège de chaque juridiction (Luxembourg, Strasbourg).
  - L'élève explique qu'un citoyen peut saisir l'une ou l'autre pour faire reconnaître une violation de ses droits.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Combien de juridictions européennes différentes un citoyen peut-il saisir, et pour quel type de droit chacune ?
    methode: Présente d'abord la CJUE, puis la CEDH, en précisant pour chacune ce qu'elle contrôle et où elle siège.
    etape: Tu peux commencer ainsi « Un citoyen européen peut faire valoir ses droits devant deux juridictions différentes... », puis présenter la première.
  solution: Un citoyen européen peut faire valoir ses droits devant deux juridictions différentes. La Cour de justice de l'Union européenne (CJUE), installée à Luxembourg, veille au respect du droit de l'Union européenne par les États membres. La Cour européenne des droits de l'homme (CEDH), installée à Strasbourg et créée par le Conseil de l'Europe, veille au respect de la Convention européenne des droits de l'homme dans les 46 pays qui l'ont signée. Selon la nature de la violation constatée, un citoyen peut donc saisir l'une ou l'autre de ces juridictions pour faire reconnaître ses droits.
- id: nombre-etats-membres-ue
  type: nombre
  difficulte: 1
  enonce: Depuis la sortie du Royaume-Uni en 2020, combien d'États membres compte l'Union européenne ?
  reponse:
    valeur: 27
    forme: entier
  indices:
    relance: Ne confonds pas avec le Conseil de l'Europe, qui rassemble beaucoup plus d'États.
    methode: Compte les États membres actuels, c'est-à-dire après le départ du Royaume-Uni.
    etape: 'Le Royaume-Uni a quitté l''Union : il faut donc retirer un État de l''ancien total.'
  pieges:
  - si:
      valeur: 46
    relance: 46 est le nombre d'États du Conseil de l'Europe, une autre organisation. Combien compte l'Union européenne ?
  - si:
      valeur: 28
    relance: Tu comptes le Royaume-Uni, qui a quitté l'Union en 2020.
  solution: L'Union européenne compte 27 États membres depuis la sortie du Royaume-Uni en 2020.
- id: reglement-ou-directive
  type: choix
  difficulte: 2
  enonce: Quel texte européen s'applique directement dans tous les États membres, sans avoir besoin d'être recopié dans la loi nationale ?
  reponse:
    options:
    - id: a
      texte: Un règlement
    - id: b
      texte: Une directive
    - id: c
      texte: Une recommandation du Conseil de l'Europe
    bonnes:
    - a
  indices:
    relance: Un des deux textes principaux fixe seulement un objectif, l'autre s'applique tel quel.
    methode: Le texte qui demande une transposition n'est pas celui qu'on cherche.
    etape: Cherche le texte qui a la même force dans tous les pays, dès son entrée en vigueur.
  pieges:
  - si:
      contient:
      - b
    relance: 'La directive fixe un objectif : chaque État doit ensuite écrire sa propre loi. Est-ce une application directe ?'
  - si:
      contient:
      - c
    relance: Le Conseil de l'Europe n'est pas l'Union européenne et ses recommandations ne s'imposent pas comme le droit de l'UE.
  solution: Un règlement s'applique directement. Une directive doit être transposée dans la loi nationale.
- id: chronologie-europe
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: ce
      texte: Création du Conseil de l'Europe
    - id: rome
      texte: Signature du traité de Rome
    - id: maastricht
      texte: Signature du traité de Maastricht
    - id: brexit
      texte: Sortie du Royaume-Uni de l'Union européenne
  indices:
    relance: Ces événements s'étalent sur plus de soixante-dix ans. Cherche d'abord celui de l'après-guerre immédiat et celui de ces dernières années.
    methode: Le Conseil de l'Europe précède l'Union européenne. Le traité de Rome précède celui de Maastricht.
    etape: Les dates vont de la fin des années 1940 aux années 2020, en passant par les années 1950 et 1990.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux événements voisins sont inversés. Lequel est le plus ancien des deux ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus ancien et le plus récent, puis place les deux autres.
  solution: Conseil de l'Europe (1949), traité de Rome (1957), traité de Maastricht (1992), sortie du Royaume-Uni (2020).
- id: saisir-la-cedh
  type: choix
  difficulte: 3
  enonce: Un citoyen estime que la justice de son pays a violé un droit garanti par la Convention européenne des droits de l'homme. Il a déjà épuisé tous les recours dans son pays. Où peut-il porter son affaire ?
  reponse:
    options:
    - id: a
      texte: Devant la Cour européenne des droits de l'homme, à Strasbourg
    - id: b
      texte: Devant la Cour de justice de l'Union européenne, à Luxembourg
    - id: c
      texte: Devant la Commission européenne
    - id: d
      texte: Devant le Parlement européen
    bonnes:
    - a
  indices:
    relance: 'Regarde quel texte est invoqué : la Convention européenne des droits de l''homme.'
    methode: Chaque juridiction européenne fait respecter un texte précis. Associe le texte invoqué à sa juridiction.
    etape: Deux options ne sont même pas des juridictions.
  pieges:
  - si:
      contient:
      - b
    relance: La CJUE fait respecter le droit de l'Union. Quel texte est invoqué ici ?
  - si:
      contient:
      - c
    relance: La Commission propose des textes et veille à leur application, elle ne juge pas les affaires individuelles.
  - si:
      contient:
      - d
    relance: Le Parlement vote des textes avec les États. Ce n'est pas un tribunal.
  solution: C'est la CEDH, à Strasbourg, qui veille au respect de la Convention européenne des droits de l'homme.
