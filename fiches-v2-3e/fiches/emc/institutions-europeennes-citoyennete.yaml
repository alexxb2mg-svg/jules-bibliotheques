    - id: o2
      texte: La CJUE veille au respect et à l'application uniforme du droit de l'Union européenne par les États membres.
    - id: o3
      texte: La CEDH et la CJUE forment un seul et même tribunal fusionné dont le siège se trouve à Bruxelles.
    - id: o4
      texte: Un citoyen français doit obligatoirement abandonner sa nationalité française avant de saisir une cour européenne.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie les rôles respectifs de la CEDH (droits de l'homme à Strasbourg) et de la CJUE (droit de l'UE à Luxembourg).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur classique : la CJUE (Luxembourg) et la CEDH (Strasbourg) sont deux institutions distinctes situées dans
      des villes différentes.'
  - si:
      contient:
      - o4
    relance: Faux. L'exercice d'un recours européen n'a aucun effet sur la nationalité du citoyen.
  solution: Un citoyen peut saisir la CEDH s'il estime que ses droits fondamentaux garantis par la Convention européenne sont
    violés ; La CJUE veille au respect et à l'application uniforme du droit de l'Union européenne par les États membres. C'est
    exact. La CEDH à Strasbourg protège les droits de l'homme et les libertés fondamentales dans les 46 États signataires.
- id: nblm-la-cour-europeenne-des-droits-de-l-homme-7
  type: texte_court
  difficulte: 1
  enonce: La Cour européenne des droits de l'homme (CEDH) a son siège dans la ville de.
  reponse:
    acceptees:
    - Strasbourg
    fautes_tolerees: 1
  indices:
    relance: Il s'agit de la ville alsacienne française qui abrite aussi le Conseil de l'Europe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: Strasbourg. La CEDH est implantée à Strasbourg, où elle veille au respect des droits fondamentaux dans 46 pays.
