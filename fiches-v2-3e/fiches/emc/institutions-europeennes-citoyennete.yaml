prerequis: []
essentiel: 'Depuis l''après-guerre, la démocratie française s''inscrit dans deux grands ensembles européens : le Conseil de
  l''Europe et l''Union européenne (UE). Ils sont différents.


  Le Conseil de l''Europe est une organisation créée en 1949. Il siège à Strasbourg. Il défend les droits de l''homme et la
  démocratie. Il compte 46 États et il a rédigé la Convention européenne des droits de l''homme.


  L''Union européenne naît de la coopération économique commencée dans les années 1950 (traité de Rome en 1957, traité de
  Maastricht en 1992). Elle compte 27 États membres. Ses principales institutions sont le Parlement européen (élu par les
  citoyens), la Commission européenne (elle propose les textes), le Conseil de l''UE et le Conseil européen (les États), et
  la Cour de justice.


  Dans l''UE, les États membres sont tenus d''appliquer le droit de l''Union, aussi appelé droit communautaire. Il comprend
  les traités, les règlements, les directives et les décisions de la Cour de justice de l''Union européenne (CJUE). Un règlement
  s''applique directement dans tous les États. Une directive fixe un objectif : chaque État doit ensuite l''inscrire dans
  sa loi nationale.


  La CJUE siège à Luxembourg. Elle veille à ce que les États et les institutions respectent le droit de l''Union. Elle aide
  aussi les juges nationaux à l''interpréter.


  Un citoyen européen peut faire valoir ses droits devant une juridiction européenne. Il y en a deux à distinguer. La CJUE
  (Luxembourg) concerne le droit de l''Union. La Cour européenne des droits de l''homme (CEDH, Strasbourg) concerne la Convention
  européenne des droits de l''homme. On peut la saisir quand on estime qu''un État a violé ses droits, après avoir épuisé
  les recours devant les juges de son pays.


  La citoyenneté européenne s''ajoute à la citoyenneté nationale : elle permet de circuler et de vivre dans un autre État
  membre et de voter aux élections européennes et municipales là où l''on réside.


  Au brevet, on attend que tu distingues Conseil de l''Europe et UE, CJUE et CEDH, et que tu expliques qu''un citoyen peut
  saisir la justice européenne.

  '
methode:
- 'Commencer par classer l''institution : Conseil de l''Europe (46 États, Strasbourg) ou Union européenne (27 États) ?'
- 'Pour une juridiction, se demander quel texte elle fait respecter : le droit de l''UE (CJUE) ou la Convention européenne
  des droits de l''homme (CEDH).'
- 'Distinguer les textes du droit de l''UE : traités, règlements (applicables directement), directives (à transposer), décisions
  de la CJUE.'
- 'Retenir un siège par juridiction : Luxembourg pour la CJUE, Strasbourg pour la CEDH.'
- Dans un développement, expliquer qui peut saisir, quelle juridiction, pour quel droit.
vocabulaire:
- terme: Conseil de l'Europe
  definition: une organisation de 46 États, créée en 1949, qui défend les droits de l'homme et la démocratie
- terme: Union européenne
  definition: une union de 27 États qui partagent des institutions et des règles communes
- terme: droit communautaire
  definition: l'ensemble des règles de l'Union européenne que les États membres doivent appliquer
- terme: règlement
  definition: un texte européen qui s'applique directement et de la même façon dans tous les États membres
- terme: directive
  definition: un texte européen qui fixe un objectif que chaque État doit inscrire dans sa propre loi
- terme: CJUE
  definition: la Cour de justice de l'Union européenne, qui siège à Luxembourg et veille au respect du droit de l'Union
- terme: CEDH
  definition: la Cour européenne des droits de l'homme, qui siège à Strasbourg et veille au respect de la Convention européenne
    des droits de l'homme
- terme: citoyen européen
  definition: toute personne qui a la nationalité d'un État membre de l'Union européenne
erreurs_frequentes:
- Confondre le Conseil de l'Europe (46 États) et l'Union européenne (27 États).
- Confondre la CJUE (Luxembourg, droit de l'Union) et la CEDH (Strasbourg, droits de l'homme).
- 'Croire que la CEDH est une institution de l''Union européenne : elle dépend du Conseil de l''Europe.'
- 'Penser qu''une directive s''applique directement : chaque État doit d''abord la transposer dans sa loi.'
- 'Croire que le droit européen est optionnel : les États membres de l''UE sont tenus de l''appliquer.'
exemple:
  enonce: Quelle est la différence entre la CJUE et la CEDH ?
  solution: La CJUE (Cour de justice de l'Union européenne), à Luxembourg, veille au respect du droit de l'Union européenne
    par ses États membres. La CEDH (Cour européenne des droits de l'homme), à Strasbourg, veille au respect de la Convention
    européenne des droits de l'homme dans les 46 pays membres du Conseil de l'Europe, une organisation différente de l'UE.
exercices:
- id: sieges-cjue-cedh
  type: association
  difficulte: 1
  enonce: Relie chaque juridiction européenne à la ville où elle siège.
  reponse:
    gauche:
    - id: a
      texte: Cour de justice de l'Union européenne (CJUE)
    - id: b
      texte: Cour européenne des droits de l'homme (CEDH)
    droite:
    - id: x
      texte: Luxembourg
    - id: y
      texte: Strasbourg
    paires:
      a: x
      b: y
  indices:
    relance: Une des deux villes est aussi le siège d'une grande institution de l'Union européenne ; l'autre accueille régulièrement
      le Parlement européen en session.
    methode: La CJUE veille au respect du droit de l'Union européenne ; la CEDH veille au respect des droits de l'homme, dans
      un cadre plus large que l'UE.
    etape: Luxembourg accueille les institutions liées au droit de l'Union ; Strasbourg accueille les institutions liées aux
      droits de l'homme.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Les deux villes sont inversées. Laquelle est liée au droit de l'Union européenne, laquelle aux droits de l'homme
      ?
  - si:
      diagnostic: associations_fausses
    relance: Relis d'abord ce que contrôle chaque juridiction avant d'associer une ville à chacune.
  solution: La CJUE siège à Luxembourg ; la CEDH siège à Strasbourg.
- id: role-cjue
  type: choix
  difficulte: 2
  enonce: Que veille à faire respecter la Cour de justice de l'Union européenne (CJUE) ?
  reponse:
    options:
    - id: a
      texte: Le respect du droit de l'Union européenne par les États membres
    - id: b
      texte: Le respect de la Convention européenne des droits de l'homme
    - id: c
      texte: Le respect des lois nationales de chaque pays membre de l'UE
    bonnes:
    - a
  indices:
    relance: Pense à ce que « communautaire » ou « de l'Union » signifie pour cette cour.
    methode: La CJUE est l'institution judiciaire de l'Union européenne, pas du Conseil de l'Europe.
    etape: Elle contrôle l'application des traités, règlements, directives et décisions de l'UE, pas les lois propres à chaque
      pays.
  pieges:
  - si:
      contient:
      - b
    relance: Le respect de la Convention européenne des droits de l'homme, c'est le rôle de la CEDH, une juridiction différente
      liée au Conseil de l'Europe.
  - si:
      contient:
      - c
    relance: La CJUE ne contrôle pas les lois propres à chaque pays. Ce qu'elle fait respecter vient d'un échelon supérieur,
      commun à tous les États membres.
  solution: La CJUE veille au respect du droit de l'Union européenne (traités, règlements, directives, décisions de la CJUE)
    par les États membres.
- id: sigle-cedh
  type: texte_court
  difficulte: 2
  enonce: Quel sigle de quatre lettres désigne la juridiction, installée à Strasbourg, qui veille au respect de la Convention
    européenne des droits de l'homme dans 46 pays ?
  reponse:
    acceptees:
    - CEDH
    fautes_tolerees: 1
  indices:
    relance: Ce sigle reprend les initiales de « Cour européenne des droits de l'homme ».
    methode: Ce n'est pas la même juridiction que la CJUE, qui siège à Luxembourg pour le droit de l'Union européenne.
    etape: Complète les quatre initiales de « Cour », « européenne », « droits », « homme ».
  pieges:
  - si:
      valeur: CJUE
    relance: La CJUE est la Cour de justice de l'Union européenne, à Luxembourg. Cherche le sigle de la juridiction de Strasbourg,
      liée au Conseil de l'Europe.
  solution: Le sigle est CEDH, pour Cour européenne des droits de l'homme.
- id: developpement-recours-europeen
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique comment un citoyen européen peut faire valoir ses droits devant une juridiction
    européenne.'
  criteres:
  - L'élève distingue la CJUE (droit de l'Union européenne) et la CEDH (Convention européenne des droits de l'homme).
  - L'élève précise le siège de chaque juridiction (Luxembourg, Strasbourg).
  - L'élève explique qu'un citoyen peut saisir l'une ou l'autre pour faire reconnaître une violation de ses droits.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Combien de juridictions européennes différentes un citoyen peut-il saisir, et pour quel type de droit chacune
      ?
    methode: Présente d'abord la CJUE, puis la CEDH, en précisant pour chacune ce qu'elle contrôle et où elle siège.
    etape: Tu peux commencer ainsi « Un citoyen européen peut faire valoir ses droits devant deux juridictions différentes...
      », puis présenter la première.
  solution: Un citoyen européen peut faire valoir ses droits devant deux juridictions différentes. La Cour de justice de l'Union
    européenne (CJUE), installée à Luxembourg, veille au respect du droit de l'Union européenne par les États membres. La
    Cour européenne des droits de l'homme (CEDH), installée à Strasbourg et créée par le Conseil de l'Europe, veille au respect
    de la Convention européenne des droits de l'homme dans les 46 pays qui l'ont signée. Selon la nature de la violation constatée,
    un citoyen peut donc saisir l'une ou l'autre de ces juridictions pour faire reconnaître ses droits.
- id: nblm-dans-quelle-ville-siege-la-cour-europeen-1
  type: choix
  difficulte: 2
  enonce: Dans quelle ville siège la Cour européenne des droits de l'homme (CEDH), instituée par le Conseil de l'Europe ?
  reponse:
    options:
    - id: o1
      texte: Strasbourg
    - id: o2
      texte: Luxembourg
    - id: o3
      texte: Bruxelles
    - id: o4
      texte: Paris
    bonnes:
    - o1
  indices:
    relance: Pense à la grande ville alsacienne abritant également le Conseil de l'Europe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention à ne pas confondre : Luxembourg est le siège de la Cour de justice de l''Union européenne (CJUE),
      et non de la CEDH.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : Bruxelles accueille des institutions politiques de l''UE (comme la Commission), mais pas
      le siège de la CEDH.'
  solution: Strasbourg. C'est exact. La CEDH est installée à Strasbourg et veille au respect de la Convention européenne des
    droits de l'homme.
- id: nblm-quelle-est-la-mission-principale-de-la-c-2
  type: choix
  difficulte: 2
  enonce: Quelle est la mission principale de la Cour de justice de l'Union européenne (CJUE) basée à Luxembourg ?
  reponse:
    options:
    - id: o1
      texte: Veiller au respect et à l'application du droit de l'Union européenne par les États membres.
    - id: o2
      texte: Rédiger les lois nationales et le code civil de chaque pays membre.
    - id: o3
      texte: Juger les crimes de guerre au niveau international.
    - id: o4
      texte: Sanctionner uniquement les atteintes à la Déclaration des droits de l'homme de 1789.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'institution judiciaire de l'Union européenne qui interprète les traités et règles communautaires.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la CJUE est un tribunal européen ; elle n''écrit pas les lois nationales des États.'
  - si:
      contient:
      - o3
    relance: Faux. La CJUE s'occupe exclusivement du droit de l'Union européenne, pas du droit pénal international.
  - si:
      contient:
      - o4
    relance: 'Attention : la protection des droits de l''homme au niveau européen relève principalement de la CEDH à Strasbourg.'
  solution: Veiller au respect et à l'application du droit de l'Union européenne par les États membres. C'est exact. La CJUE
    veille à ce que le droit de l'UE soit respecté et interprété de manière uniforme dans tous les États membres.
- id: nblm-comment-definit-on-la-notion-de-droit-co-3
  type: choix
  difficulte: 2
  enonce: Comment définit-on la notion de « droit communautaire » au sein de l'Union européenne ?
  reponse:
    options:
    - id: o1
      texte: L'ensemble des règles juridiques adoptées par l'Union européenne que ses États membres doivent respecter.
    - id: o2
      texte: Le droit propre à chaque commune française pour gérer les affaires locales.
    - id: o3
      texte: Un ensemble de coutumes religieuses communes à tous les pays européens.
    - id: o4
      texte: Le règlement intérieur propre au Conseil de l'Europe pour la santé publique.
    bonnes:
    - o1
  indices:
    relance: Pense aux lois et textes juridiques créés par l'Union européenne pour l'ensemble de ses membres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion de vocabulaire : le mot « communautaire » fait ici référence à l''Union européenne (ex-Communauté
      européenne), pas aux communes.'
  - si:
      contient:
      - o3
    relance: Faux. Les institutions européennes sont laïques et démocratiques ; le droit communautaire est un droit civil
      officiel.
  - si:
      contient:
      - o4
    relance: Faux. Le droit communautaire émane de l'Union européenne et non du Conseil de l'Europe.
  solution: L'ensemble des règles juridiques adoptées par l'Union européenne que ses États membres doivent respecter. C'est
    exact. Le droit communautaire désigne les normes juridiques (traités, règlements, directives) créées par l'Union européenne.
- id: nblm-quelle-affirmation-concernant-le-conseil-4
  type: choix
  difficulte: 2
  enonce: Quelle affirmation concernant le Conseil de l'Europe est exacte ?
  reponse:
    options:
    - id: o1
      texte: C'est une organisation internationale créée en 1949, totalement distincte de l'Union européenne.
    - id: o2
      texte: C'est une institution interne à l'Union européenne qui vote le budget annuel.
    - id: o3
      texte: C'est un tribunal commercial chargé de régler les conflits entre entreprises françaises.
    - id: o4
      texte: C'est une association régionale réservée aux pays de la région parisienne.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la distinction fondamentale entre l'Union européenne et l'organisation créée en 1949.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que le Conseil de l''Europe fait partie de l''UE. Ce sont deux organisations distinctes.'
  - si:
      contient:
      - o3
    relance: Faux. Le Conseil de l'Europe est une organisation politique promouvant la démocratie et les droits de l'homme.
  - si:
      contient:
      - o4
    relance: Faux. C'est une organisation internationale regroupant 46 pays à l'échelle du continent européen.
  solution: C'est une organisation internationale créée en 1949, totalement distincte de l'Union européenne. C'est exact.
    Le Conseil de l'Europe et l'Union européenne sont deux organisations différentes qui n'ont pas les mêmes membres ni les
    mêmes compétences.
- id: nblm-en-tant-que-citoyen-europeen-quel-droit-5
  type: choix
  difficulte: 2
  enonce: En tant que citoyen européen, quel droit est garanti concernant l'accès aux juridictions européennes ?
  reponse:
    options:
    - id: o1
      texte: La possibilité de faire valoir ses droits devant la CJUE ou la CEDH selon la nature du litige.
    - id: o2
      texte: L'interdiction stricte de recourir à une juridiction en dehors de son pays d'origine.
    - id: o3
      texte: L'obligation d'obtenir une autorisation écrite du Président de la République avant toute démarche.
    - id: o4
      texte: L'obligation d'être député européen pour pouvoir déposer une requête.
    bonnes:
    - o1
  indices:
    relance: Pense à la protection dont bénéficie un citoyen face aux États devant les tribunaux européens.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la citoyenneté européenne et les traités garantissent au contraire des voies de recours européennes.'
  - si:
      contient:
      - o3
    relance: Faux. Les démarches citoyennes devant les cours européennes ne nécessitent aucune autorisation du pouvoir exécutif.
  - si:
      contient:
      - o4
    relance: Faux. Tout citoyen ou individu lésé peut saisir la juridiction européenne compétente selon les règles prévues.
  solution: La possibilité de faire valoir ses droits devant la CJUE ou la CEDH selon la nature du litige. C'est exact. Un
    citoyen européen peut saisir la justice européenne (CJUE pour le droit de l'UE, CEDH pour les droits de l'homme).
- id: nblm-quelles-sont-les-deux-propositions-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux propositions exactes concernant le recours devant une juridiction européenne par un citoyen
    ? (plusieurs réponses possibles)
  reponse:
    options:
