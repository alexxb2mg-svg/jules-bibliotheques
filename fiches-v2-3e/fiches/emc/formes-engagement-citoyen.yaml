      - o3
    relance: 'Erreur fréquente : le SNU est un programme d''éducation à la citoyenneté distinct de l''ancien service militaire
      obligatoire supprimé en 1996.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : le vote est essentiel, mais l''engagement citoyen comprend aussi le bénévolat, le syndicalisme,
      etc.'
  solution: 'Le SNU est un dispositif mis en place à partir de 2019 pour faire découvrir aux jeunes différentes formes d''engagement
    ; Le service au sein d''une institution publique comme l''armée, la police ou l''éducation est une forme d''engagement
    citoyen. C''est exact : créé en 2019, le SNU vise à promouvoir la citoyenneté et à faire découvrir le goût de l''engagement.'
