    - id: o3
      texte: Le SNU est l'exact rétablissement du service militaire obligatoire supprimé en 1996.
    - id: o4
      texte: L'engagement citoyen est restreint au seul accomplissement de l'acte de vote lors des élections.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux propositions qui décrivent correctement le SNU depuis 2019 et la diversité des engagements
