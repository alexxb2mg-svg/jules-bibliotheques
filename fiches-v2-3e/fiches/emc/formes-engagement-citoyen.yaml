  reponse:
    options:
    - id: o1
      texte: Le SNU est un dispositif mis en place à partir de 2019 pour faire découvrir aux jeunes différentes formes d'engagement.
    - id: o2
      texte: Le service au sein d'une institution publique comme l'armée, la police ou l'éducation est une forme d'engagement
