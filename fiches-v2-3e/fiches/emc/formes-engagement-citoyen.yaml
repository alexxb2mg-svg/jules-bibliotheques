format: 2
notion: formes-engagement-citoyen
version: 2
etat: verifiee
declencheurs:
- s'engager pour une cause
- bénévolat associatif
- adhérer à un syndicat
- SNU depuis 2019
- délégué de classe rôle
- liberté de manifester encadrée
- service dans une institution publique
- délégué élève
- être bénévole
- défendre les salariés
- manifestation déclarée
- engagement dans l'armée
prerequis:
- elections-referendum
essentiel: 'S''engager, c''est agir volontairement pour une cause ou pour la collectivité. L''engagement citoyen prend de
  nombreuses formes.


  Les formes traditionnelles de l''engagement :

  L''engagement politique : adhérer à un parti, faire campagne, ou exercer un mandat d''élu (conseiller municipal, maire,
  député...).

  L''engagement syndical : adhérer à un syndicat pour défendre les droits et les intérêts des salariés.

  L''engagement associatif ou humanitaire : être bénévole dans une association (sport, culture, solidarité, aide humanitaire).

  La démocratie scolaire : être délégué de classe, élu par ses camarades, ou siéger au conseil de vie collégienne ou au conseil
  d''administration de l''établissement.


  L''engagement peut aussi prendre la forme d''un service dans les institutions : l''armée, la police, la justice, l''éducation.
  Ces métiers servent l''intérêt général et l''État.


  La liberté de manifester permet aux citoyens d''exprimer leurs opinions et de faire pression sur les gouvernements. Elle
  découle de la liberté d''expression. En France, une manifestation sur la voie publique doit être déclarée à l''avance. Elle
  peut être interdite si l''ordre public est menacé. La grève est un autre moyen d''action collectif des salariés.


  Le service national universel (SNU) est un dispositif national de découverte des formes et des domaines d''engagement. Il
  s''adresse aux jeunes, il a été mis en place à partir de 2019, et il ne remplace pas l''ancien service militaire, qui était
  obligatoire et a été suspendu en 1997.


  Toutes ces formes ont un point commun : elles sont volontaires et participent à la vie collective. S''engager n''est pas
  obligatoire, mais cela fait vivre la démocratie entre les élections.


  Au brevet, on attend que tu connaisses les formes traditionnelles d''engagement, que tu donnes des exemples précis, que
  tu expliques la liberté de manifester et que tu présentes le SNU.

  '
methode:
- 'Classer l''engagement d''après son cadre : parti ou mandat (politique), syndicat, association, école, institution publique.'
- Pour chaque exemple, préciser qui s'engage, pour quoi, et comment.
- Rappeler que la liberté de manifester s'exerce dans le cadre de la loi (déclaration préalable, ordre public).
- Présenter le SNU comme un dispositif de découverte de l'engagement, mis en place à partir de 2019.
- Dans un développement, donner au moins deux formes différentes, avec un exemple précis pour chacune, puis conclure.
vocabulaire:
- terme: engagement citoyen
  definition: le fait d'agir volontairement pour une cause ou pour la collectivité
- terme: mandat
  definition: la fonction confiée à un élu pour une durée fixée
- terme: syndicat
  definition: une organisation qui défend les droits et les intérêts des salariés
- terme: association
  definition: un groupe de personnes réunies volontairement autour d'un projet commun, sans but lucratif
- terme: bénévolat
  definition: une activité que l'on fait librement et sans être payé
- terme: démocratie scolaire
  definition: la participation des élèves à la vie de leur établissement, par exemple avec les délégués de classe
- terme: manifestation
  definition: un rassemblement public pour exprimer une opinion ou une revendication
- terme: SNU
  definition: le service national universel, un dispositif national de découverte de l'engagement pour les jeunes
erreurs_frequentes:
- 'Croire que l''engagement se limite à voter ou à faire de la politique : il est aussi syndical, associatif, scolaire ou
  dans une institution.'
- Confondre le SNU avec l'ancien service militaire obligatoire, qui a été suspendu.
- 'Croire que manifester est toujours autorisé sans aucune règle : une manifestation doit être déclarée et peut être interdite
  si l''ordre public est menacé.'
- Confondre un syndicat (qui défend des salariés) et un parti politique (qui cherche à exercer le pouvoir).
- 'Oublier que l''engagement est volontaire et qu''il ne se limite pas aux adultes : un élève peut être délégué.'
exemple:
  enonce: Donne trois exemples différents de formes d'engagement citoyen.
  solution: L'engagement associatif (être bénévole dans une association humanitaire), l'engagement syndical (adhérer à un
    syndicat pour défendre les droits des salariés), et la démocratie scolaire (être élu délégué de classe pour représenter
    ses camarades).
exercices:
- id: annee-creation-snu
  type: nombre
  difficulte: 1
  enonce: À partir de quelle année le service national universel (SNU) est-il mis en place en France ?
  reponse:
    valeur: 2019
    forme: entier
  indices:
    relance: Ce programme est plus récent que la suppression du service militaire obligatoire, qui date de 1996.
    methode: Le SNU n'est pas obligatoire, contrairement à l'ancien service militaire.
    etape: L'année se situe juste avant la crise sanitaire liée à la Covid-19, qui débute en 2020.
  pieges:
  - si:
      valeur: 1996
    relance: 1996 est l'année de la suppression du service militaire obligatoire en France, pas la création du SNU.
  - si:
      valeur: 2022
    relance: 2022 est l'année de la loi sur la protection des lanceurs d'alerte, sans lien avec la création du SNU.
  solution: Le service national universel (SNU) est mis en place à partir de l'année 2019.
- id: snu-vs-service-militaire
  type: choix
  difficulte: 1
  enonce: Quelle est la différence entre le SNU et l'ancien service militaire obligatoire ?
  reponse:
    options:
    - id: a
      texte: Le SNU n'est pas obligatoire, contrairement à l'ancien service militaire
    - id: b
      texte: Le SNU ne concerne que les futurs militaires, contrairement au service militaire
    - id: c
      texte: Le SNU dure plus longtemps que l'ancien service militaire
    bonnes:
    - a
  indices:
    relance: Pense à ce que chaque jeune est tenu de faire, ou non, dans chacun de ces deux dispositifs.
    methode: Le service militaire obligatoire concernait tous les jeunes hommes avant sa suppression en 1996 ; le SNU, lui,
      n'oblige personne.
    etape: La bonne réponse porte sur le caractère obligatoire ou non de chaque dispositif, pas sur sa durée ni sur son public.
  pieges:
  - si:
      contient:
      - b
    relance: Le SNU ne prépare pas seulement de futurs militaires ; il fait découvrir plusieurs formes d'engagement, pas seulement
      l'armée.
  - si:
      contient:
      - c
    relance: La durée n'est pas ce qui distingue fondamentalement les deux dispositifs ; c'est leur caractère obligatoire
      ou non.
  solution: Le SNU, créé en 2019, n'est pas obligatoire, alors que l'ancien service militaire, supprimé en 1996, l'était pour
    les jeunes hommes.
- id: formes-engagement-exemples
  type: association
  difficulte: 2
  enonce: Relie chaque forme d'engagement citoyen à un exemple concret.
  reponse:
    gauche:
    - id: a
      texte: Engagement syndical
    - id: b
      texte: Démocratie scolaire
    - id: c
      texte: Service dans une institution publique
    droite:
    - id: x
      texte: Adhérer à un syndicat pour défendre les droits des salariés
    - id: y
      texte: Être élu délégué de classe pour représenter ses camarades
    - id: z
      texte: Travailler dans la police, la justice ou l'éducation
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une des formes concerne le monde du travail, une autre l'école, la dernière une institution de l'État.
    methode: Associe « syndical » au monde du travail, « scolaire » à l'école, et « institution publique » aux services de
      l'État.
    etape: Le délégué de classe représente ses camarades à l'école ; le syndicaliste défend les salariés ; l'agent public
      sert dans une institution comme la police ou la justice.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier que tu n'as pas confondu l'engagement syndical et le
      service dans une institution publique.
  - si:
      diagnostic: associations_fausses
    relance: Relis d'abord chaque exemple séparément avant de l'associer à la forme d'engagement correspondante.
  solution: L'engagement syndical se traduit par l'adhésion à un syndicat pour défendre les droits des salariés ; la démocratie
    scolaire se traduit par l'élection d'un délégué de classe ; le service dans une institution publique se traduit par exemple
    par un travail dans la police, la justice ou l'éducation.
- id: developpement-diversite-engagement
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre que l''engagement citoyen peut prendre plusieurs formes, en t''appuyant sur au
    moins deux exemples précis.'
  criteres:
  - L'élève présente au moins deux formes d'engagement distinctes.
  - L'élève explique pour chacune en quoi elle constitue une participation volontaire à la vie collective.
  - L'élève conclut en montrant la diversité des engagements possibles.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Peux-tu citer une forme d'engagement liée à l'école et une autre liée à une cause ou une association ?
    methode: Choisis deux formes différentes, par exemple associatif et scolaire, puis explique chacune séparément.
    etape: Tu peux commencer ainsi « L'engagement citoyen peut prendre plusieurs formes... », puis présenter ton premier exemple.
  solution: L'engagement citoyen peut prendre plusieurs formes. L'engagement associatif consiste à agir bénévolement pour
    une cause, par exemple au sein d'une association humanitaire. La démocratie scolaire permet à un élève d'être délégué
    de classe, élu par ses camarades pour les représenter auprès des professeurs et de l'administration. Ces deux exemples
    montrent chacun une participation volontaire à la vie collective. L'engagement citoyen est donc pluriel, et comprend aussi
    le service dans une institution publique comme l'armée ou la justice.
- id: mot-benevolat
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une activité que l'on fait librement, au service d'autres personnes, sans être payé ?
  reponse:
    acceptees:
    - bénévolat
    - benevolat
    - le bénévolat
    - être bénévole
    - bénévole
    fautes_tolerees: 2
  indices:
    relance: Ce mot vient d'un adjectif latin qui signifie « qui veut du bien ».
    methode: On dit d'une personne qui donne de son temps sans salaire qu'elle est ...
    etape: Le mot commence par « béné... » et désigne aussi la personne qui donne son temps.
  pieges:
  - si:
      valeur: volontariat
    relance: Le volontariat est proche, mais cherche le mot qui insiste sur l'absence de paiement dans une association.
  solution: 'C''est le bénévolat : une activité libre et non payée au service des autres.'
- id: forme-engagement-cas
  type: association
  difficulte: 2
  enonce: Relie chaque situation à la forme d'engagement qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: Camille se présente aux élections municipales et devient conseillère
    - id: b
      texte: Yanis anime un atelier de soutien scolaire dans une association de son quartier
    - id: c
      texte: Inès est élue déléguée de sa classe de 3e
    - id: d
      texte: Nadia adhère à un syndicat pour défendre ses collègues
    droite:
    - id: w
      texte: Engagement politique et mandat
    - id: x
      texte: Engagement associatif
    - id: y
      texte: Démocratie scolaire
    - id: z
      texte: Engagement syndical
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: 'Pour chaque situation, repère le cadre dans lequel la personne s''engage : élection, association, école ou syndicat.'
    methode: Un mandat vient d'une élection, une association accueille des bénévoles, la démocratie scolaire se passe au collège,
      un syndicat défend des salariés.
    etape: Commence par l'élève déléguée, dont le cadre est évident.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère le cadre de chaque personne.
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par les deux situations les plus faciles : l''élève et la salariée.'
  solution: Camille exerce un mandat (engagement politique). Yanis est bénévole (engagement associatif). Inès pratique la
    démocratie scolaire. Nadia s'engage dans un syndicat.
- id: liberte-manifester
  type: choix
  difficulte: 2
  enonce: Que permet la liberté de manifester ?
  reponse:
    options:
    - id: a
      texte: Exprimer publiquement ses opinions et faire pression sur les pouvoirs publics, dans le cadre de la loi
    - id: b
      texte: Manifester partout et à tout moment sans aucune règle
    - id: c
      texte: Remplacer le vote dans les élections
    bonnes:
    - a
  indices:
    relance: Une liberté s'exerce toujours dans le cadre de la loi, et n'a pas pour but de remplacer le vote.
    methode: Une manifestation doit être déclarée et peut être interdite en cas de menace pour l'ordre public.
    etape: Cherche la réponse qui parle d'exprimer des opinions et de faire pression, avec des limites.
  pieges:
  - si:
      contient:
      - b
    relance: 'Une manifestation est encadrée : déclaration préalable, et interdiction possible si l''ordre public est menacé.'
  - si:
      contient:
      - c
    relance: Manifester complète le vote mais ne le remplace pas.
  solution: La liberté de manifester permet d'exprimer publiquement ses opinions et de faire pression sur les pouvoirs publics,
    dans le cadre de la loi.
- id: snu-choix-multiple
  type: choix
  difficulte: 3
  enonce: Quelles affirmations sur le service national universel (SNU) sont exactes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: C'est un dispositif national de découverte de formes et de domaines d'engagement
    - id: b
      texte: Il a été mis en place à partir de 2019
    - id: c
      texte: Il remplace l'ancien service militaire obligatoire
    - id: d
      texte: Il ne concerne que les jeunes qui veulent devenir militaires
    bonnes:
    - a
    - b
  indices:
    relance: Le SNU fait découvrir plusieurs formes d'engagement, pas seulement l'armée.
    methode: Relis la définition du SNU et la date de sa mise en place.
    etape: Une option contient une erreur sur le service militaire, une autre sur les publics concernés.
  pieges:
  - si:
      contient:
      - c
    relance: L'ancien service militaire obligatoire a été suspendu en 1997. Le SNU est un autre dispositif, de découverte
      de l'engagement.
  - si:
      contient:
      - d
    relance: Le SNU présente plusieurs domaines d'engagement, pas uniquement les carrières militaires.
  - si:
      diagnostic: incomplet
    relance: Il y a plus d'une affirmation exacte. Relis les deux premières options.
  solution: Le SNU est un dispositif national de découverte de l'engagement, mis en place à partir de 2019. Il ne remplace
    pas l'ancien service militaire et ne concerne pas que les futurs militaires.
