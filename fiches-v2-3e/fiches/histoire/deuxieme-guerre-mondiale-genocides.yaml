format: 2
notion: deuxieme-guerre-mondiale-genocides
version: 1
etat: verifiee
declencheurs:
- invasion de la Pologne
- chambres à gaz
- camps de concentration
- extermination des Tziganes
- capitulation du Japon
- Heinrich Himmler
prerequis:
- totalitarismes-entre-deux-guerres
essentiel: 'La Seconde Guerre mondiale se déroule du 1er septembre 1939 (invasion de la Pologne par l''Allemagne) au 2 septembre
  1945. Elle oppose les Alliés (Royaume-Uni, URSS à partir de 1941, États-Unis à partir de décembre 1941, France) à l''Axe
  (Allemagne nazie, Italie, Japon).


  C''est un conflit planétaire marqué par une violence de masse et une volonté d''anéantissement des populations civiles,
  bien au-delà des combats militaires.


  La Shoah est le génocide des Juifs commis par les nazis : environ six millions de Juifs d''Europe sont exterminés par la
  faim, les fusillades de masse ou les chambres à gaz des camps d''extermination. Les Tziganes (Roms) sont eux aussi visés
  par un génocide, le Samudaripen. D''autres groupes sont persécutés et assassinés : opposants politiques, personnes handicapées,
  homosexuels.


  Ce projet d''extermination repose sur l''idéologie raciste et antisémite du nazisme, mise en œuvre par Hitler et des dirigeants
  comme Heinrich Himmler.'
methode:
- 'Situer précisément les dates : 1er septembre 1939 (début) au 2 septembre 1945 (capitulation du Japon).'
- 'Distinguer les deux génocides du programme : celui des Juifs (la Shoah) et celui des Tziganes.'
- 'Employer le mot « génocide » à bon escient : une extermination organisée et systématique d''un groupe en tant que tel,
  différente d''un massacre isolé.'
- Relier ce génocide à l'idéologie raciste du nazisme étudiée dans la notion sur les totalitarismes.
vocabulaire:
- terme: Shoah
  definition: 'mot hébreu signifiant « catastrophe » : le génocide des Juifs d''Europe par les nazis pendant la Seconde Guerre
    mondiale'
- terme: anéantissement
  definition: la destruction totale et volontaire d'un groupe de personnes, au-delà des combats militaires
- terme: camp d'extermination
  definition: un camp construit par les nazis dans le but spécifique de tuer massivement des déportés
erreurs_frequentes:
- 'Employer « Shoah » et « génocide des Tziganes » comme synonymes : ce sont deux génocides distincts, visant des groupes
  différents.'
- Confondre camp de concentration (travail forcé, conditions meurtrières) et camp d'extermination (mis en place pour tuer).
- Réduire la Seconde Guerre mondiale à des combats entre armées, en oubliant la violence contre les civils.
- Se tromper sur les dates de début et de fin du conflit.
exemple:
  enonce: Explique en quoi la Seconde Guerre mondiale est un conflit d'anéantissement.
  solution: 'Au-delà des batailles entre armées, les nazis mettent en œuvre une extermination planifiée de populations civiles
    considérées comme inférieures selon leur idéologie raciste : les Juifs (Shoah) et les Tziganes sont visés par des génocides,
    avec des camps construits pour tuer en masse.'
exercices:
- id: annee-debut-guerre
  type: nombre
  difficulte: 1
  enonce: En quelle année commence la Seconde Guerre mondiale, avec l'invasion de la Pologne par l'Allemagne ?
  reponse:
    valeur: 1939
    forme: entier
  indices:
    relance: Cette guerre commence quelques années après l'arrivée d'Hitler au pouvoir en Allemagne.
    methode: Cherche l'année où l'Allemagne envahit la Pologne, ce qui provoque la déclaration de guerre du Royaume-Uni et
      de la France.
    etape: La guerre commence le 1er septembre de cette année-là, quand l'armée allemande envahit la Pologne.
  pieges:
  - si:
      valeur: 1945
    relance: 1945, c'est l'année de la fin de la guerre, pas celle de son commencement.
  - si:
      valeur: 1933
    relance: 1933 est l'année où Hitler devient chancelier, plusieurs années avant le début de la guerre.
  solution: La Seconde Guerre mondiale commence le 1er septembre 1939, quand l'Allemagne nazie envahit la Pologne.
- id: victimes-shoah
  type: choix
  difficulte: 1
  enonce: Quel groupe humain est exterminé par les nazis pendant la Shoah ?
  reponse:
    options:
    - id: a
      texte: Les Juifs d'Europe
    - id: b
      texte: Les catholiques français
    - id: c
      texte: Les habitants du Royaume-Uni
    - id: d
      texte: Les soldats américains
    bonnes:
    - a
  indices:
    relance: Ce mot hébreu désigne le génocide d'un peuple précis par les nazis.
    methode: Élimine les groupes qui ne sont pas visés par un projet d'extermination organisé par les nazis.
    etape: La Shoah vise un peuple perçu comme inférieur par l'idéologie raciste et antisémite du nazisme.
  pieges:
  - si:
      contient:
      - b
    relance: Les catholiques français ne sont pas visés par un projet d'extermination organisé par les nazis.
  - si:
      contient:
      - c
    relance: Le Royaume-Uni est un pays allié qui combat les nazis ; il n'est pas visé par la Shoah.
  - si:
      contient:
      - d
    relance: Les soldats américains combattent dans l'armée alliée, ils ne sont pas visés par ce génocide.
  solution: 'La Shoah est le génocide des Juifs d''Europe : environ six millions d''entre eux sont exterminés par les nazis.'
- id: deuxieme-genocide
  type: texte_court
  difficulte: 2
  enonce: En plus des Juifs, quel autre peuple est visé par un génocide pendant la Seconde Guerre mondiale ?
  reponse:
    acceptees:
    - tziganes
    - roms
    fautes_tolerees: 1
  indices:
    relance: Ce peuple nomade est aussi persécuté par les nazis à cause de son mode de vie et de son origine.
    methode: 'Relis ta leçon : un autre groupe, en plus des Juifs, est visé par une extermination organisée pendant la Seconde
      Guerre mondiale.'
    etape: Le nom de ce peuple commence par la lettre « T ».
  pieges:
  - si:
      valeur: homosexuels
    relance: Les homosexuels sont persécutés et assassinés par les nazis, mais ce n'est pas ce second génocide du programme,
      qui vise un peuple entier.
  solution: Les Tziganes (Roms) sont eux aussi visés par un génocide, le Samudaripen.
- id: chronologie-guerre
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: invasion-pologne
      texte: L'Allemagne envahit la Pologne
    - id: entree-urss
      texte: L'URSS entre en guerre contre l'Allemagne
    - id: entree-etats-unis
      texte: Les États-Unis entrent en guerre
    - id: capitulation-japon
      texte: Le Japon capitule
  indices:
    relance: Le Japon capitule à la toute fin de la guerre. Quel événement l'ouvre, en 1939 ?
    methode: Place d'abord le début (1939) et la fin (1945), puis range les deux entrées en guerre entre elles.
    etape: 'En 1941, deux pays entrent en guerre : l''URSS en milieu d''année, à la suite de l''invasion allemande, puis les
      États-Unis en fin d''année.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux événements voisins de 1941 sont inversés. Lequel des deux pays entre en guerre le premier cette
      année-là ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le début (1939) et la fin (1945) de la guerre, puis range les deux entrées en guerre de 1941.
  solution: Invasion de la Pologne (septembre 1939), entrée en guerre de l'URSS (juin 1941, après l'invasion allemande), entrée
    en guerre des États-Unis (décembre 1941, après Pearl Harbor), capitulation du Japon (2 septembre 1945).
- id: camps-et-genocides
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Camp de concentration
    - id: b
      texte: Camp d'extermination
    - id: c
      texte: Shoah
    - id: d
      texte: Samudaripen
    droite:
    - id: w
      texte: Destiné au travail forcé, dans des conditions meurtrières
    - id: x
      texte: Construit spécifiquement pour tuer massivement les déportés
    - id: y
      texte: Le génocide des Juifs d'Europe
    - id: z
      texte: Le génocide des Tziganes
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Deux mots désignent des types de camps, deux autres désignent des génocides précis.
    methode: Associe d'abord les deux types de camps à leur fonction, puis les deux génocides à leur peuple visé.
    etape: Un camp d'extermination est construit pour tuer, contrairement à un camp de concentration. La Shoah vise les Juifs,
      le Samudaripen vise les Tziganes.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout la différence entre les deux types de camps.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : la Shoah vise les Juifs. Place les trois autres associations par rapport à cette certitude.'
  solution: 'Camp de concentration : travail forcé, conditions meurtrières. Camp d''extermination : construit pour tuer massivement.
    Shoah : génocide des Juifs d''Europe. Samudaripen : génocide des Tziganes.'
- id: developpement-shoah
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : présente la Shoah en expliquant qui en sont les victimes, qui l''organise, et par quels
    moyens.'
  criteres:
  - L'élève dit que la Shoah est le génocide des Juifs d'Europe.
  - L'élève identifie que ce génocide est organisé par le régime nazi (Hitler, Himmler).
  - L'élève cite au moins deux moyens utilisés (privation, fusillades de masse, chambres à gaz dans les camps d'extermination).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Qui décide de ce génocide, et par quels moyens est-il mis en œuvre ?
    methode: Précise d'abord qui sont les victimes, puis qui organise ce projet, puis les moyens utilisés (privation, fusillades,
      chambres à gaz).
    etape: Tu peux commencer ainsi « La Shoah est le génocide des Juifs d'Europe pendant la Seconde Guerre mondiale... »,
      puis préciser qui l'organise.
  solution: Un développement réussi doit préciser que la Shoah est le génocide des Juifs d'Europe, organisé par le régime
    nazi dirigé par Hitler et exécuté par des responsables comme Himmler ; il doit citer les moyens (privation de nourriture,
    travail forcé, fusillades de masse, chambres à gaz dans les camps d'extermination) et rappeler que d'autres groupes sont
    visés, notamment les Tziganes.
