    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: Shoah. La Shoah est le terme hébreu désignant le génocide des Juifs d'Europe par les nazis.
- id: nblm-quel-terme-historique-designe-la-destruc-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme historique désigne la destruction volontaire, organisée et systématique d'un groupe humain en tant que
    tel ?
  reponse:
    acceptees:
    - Génocide
    fautes_tolerees: 1
  indices:
    relance: Ce concept juridique et historique qualifie la destruction planifiée d'un peuple.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: Génocide. Le terme génocide désigne l'extermination planifiée et organisée d'un groupe humain en tant que tel.
