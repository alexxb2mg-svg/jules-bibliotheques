format: 2
notion: transformations-societe-francaise
version: 1
etat: verifiee
declencheurs:
- loi Veil
- mai 1968
- Trente Glorieuses
- immigration de travail
- espérance de vie
- droit du travail
- IVG en France
prerequis:
- refondation-republicaine-liberation
essentiel: 'La société française connaît de profondes transformations dans la seconde moitié du XXe siècle. La place des femmes
  évolue : au-delà du droit de vote (1944), elles accèdent davantage à l''emploi et voient leurs droits progresser (contraception,
  avortement légalisé en 1975).

  L''immigration se développe, en particulier depuis les années 1950-1960, pour répondre aux besoins de main-d''œuvre de la
  reconstruction puis de la croissance économique, avant de devenir un enjeu de débat politique.

  De nouvelles aspirations de la jeunesse apparaissent, notamment marquées par le mouvement de mai 1968. Le chômage augmente
  fortement à partir du milieu des années 1970, avec la fin des « Trente Glorieuses » et les crises économiques. La population
  française vieillit, avec l''allongement de l''espérance de vie.

  Ces transformations s''accompagnent d''évolutions législatives (droits des femmes, droit du travail) et posent de nouveaux
  enjeux pour l''exercice de la citoyenneté dans la démocratie française.'
methode:
- 'Distinguer les grandes transformations à connaître : place des femmes, immigration, jeunesse, vieillissement, chômage.'
- Pour chaque transformation, donner un repère chronologique ou un exemple concret (loi, événement).
- Relier ces transformations à des adaptations de la loi (par exemple les droits des femmes).
- Montrer le lien entre ces évolutions sociales et le débat politique et citoyen en France.
vocabulaire:
- terme: Trente Glorieuses
  definition: période de forte croissance économique en France de 1945 à 1975 environ
- terme: immigration
  definition: l'installation dans un pays de personnes venues d'un autre pays pour y vivre et y travailler
erreurs_frequentes:
- Réduire les transformations de la société française à un seul thème (par exemple seulement l'immigration).
- Oublier de donner un exemple précis (loi, date, événement) pour illustrer une transformation.
- Confondre l'augmentation du chômage (à partir des années 1970) avec la période des Trente Glorieuses (croissance, plein
  emploi).
- Ne pas relier les transformations sociales à des évolutions législatives concrètes.
exemple:
  enonce: Donne un exemple d'évolution législative liée à la place des femmes dans la société française après 1945.
  solution: La légalisation de l'interruption volontaire de grossesse (IVG) en 1975, portée par la loi Veil, illustre l'évolution
    des droits des femmes après la Seconde Guerre mondiale.
exercices:
- id: annee-loi-veil
  type: nombre
  difficulte: 1
  enonce: En quelle année la loi Veil légalise-t-elle l'interruption volontaire de grossesse (IVG) en France ?
  reponse:
    valeur: 1975
    forme: entier
  indices:
    relance: C'est une loi votée dans les années 1970, sous la présidence de Valéry Giscard d'Estaing.
    methode: Cette loi est adoptée quelques années après le mouvement de mai 1968.
    etape: L'année se situe au milieu des années 1970.
  pieges:
  - si:
      valeur: 1944
    relance: 1944, c'est l'année où les femmes obtiennent le droit de vote. La loi Veil sur l'IVG est bien plus tardive.
  - si:
      valeur: 1968
    relance: 1968, c'est l'année du mouvement de mai 1968. La loi Veil sur l'IVG est votée quelques années plus tard.
  solution: La loi Veil légalise l'interruption volontaire de grossesse (IVG) en 1975.
- id: periode-trente-glorieuses
  type: choix
  difficulte: 1
  enonce: Que désigne l'expression « Trente Glorieuses » ?
  reponse:
    options:
    - id: a
      texte: Une période de forte croissance économique en France, de 1945 à 1975 environ
    - id: b
      texte: Les trente premières années de la Ve République
    - id: c
      texte: Une période de chômage massif après 1975
    - id: d
      texte: Les trente ans de la construction européenne
    bonnes:
    - a
  indices:
    relance: Cette expression parle d'une période économique, pas d'institutions politiques.
    methode: Cette période commence à la fin de la Seconde Guerre mondiale et se termine au milieu des années 1970.
    etape: Le mot « Glorieuses » évoque une période de réussite, ici économique.
  pieges:
  - si:
      contient:
      - b
    relance: La Ve République commence en 1958, pas en 1945. Les Trente Glorieuses désignent une période économique, pas politique.
  - si:
      contient:
      - c
    relance: 'C''est l''inverse : les Trente Glorieuses sont une période de forte croissance, pas de chômage massif, qui vient
      après.'
  - si:
      contient:
      - d
    relance: Les Trente Glorieuses ne concernent pas spécifiquement la construction européenne, mais l'ensemble de l'économie
      française.
  solution: Les Trente Glorieuses désignent la période de forte croissance économique en France, de 1945 à 1975 environ.
- id: mouvement-jeunesse
  type: texte_court
  difficulte: 2
  enonce: Quel mouvement de contestation, en France, marque en 1968 les nouvelles aspirations de la jeunesse ?
  reponse:
    acceptees:
    - mai 68
    - mai 1968
    fautes_tolerees: 1
  indices:
    relance: Ce mouvement porte le nom d'un mois et d'une année.
    methode: Ce mouvement mêle grèves ouvrières et contestation étudiante, au printemps d'une année précise.
    etape: 'Complète : « ... 1968 ».'
  pieges:
  - si:
      valeur: 1975
    relance: 1975, c'est l'année de la loi Veil sur l'IVG, pas celle du mouvement de contestation de la jeunesse.
  solution: Le mouvement de mai 1968 marque les nouvelles aspirations de la jeunesse en France.
- id: transformations-associations
  type: association
  difficulte: 2
  enonce: Relie chaque transformation de la société française à son exemple ou explication.
  reponse:
    gauche:
    - id: a
      texte: Place des femmes
    - id: b
      texte: Immigration
    - id: c
      texte: Chômage
    droite:
    - id: x
      texte: Légalisation de l'IVG en 1975 (loi Veil)
    - id: y
      texte: Développement lié aux besoins de main-d'œuvre depuis les années 1950-1960
    - id: z
      texte: Forte hausse à partir du milieu des années 1970
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: La loi Veil concerne directement l'un de ces trois thèmes.
    methode: Le chômage augmente après la fin des Trente Glorieuses ; l'immigration répond à des besoins économiques plus
      anciens.
    etape: Associe d'abord la place des femmes à la loi Veil, un repère facile à retenir.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier la période de la hausse du chômage par rapport au développement
      de l'immigration.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, la loi Veil de 1975 concerne la place des femmes, puis distingue immigration et chômage
      selon leurs dates.
  solution: 'Place des femmes : légalisation de l''IVG en 1975 (loi Veil). Immigration : développement lié aux besoins de
    main-d''œuvre depuis les années 1950-1960. Chômage : forte hausse à partir du milieu des années 1970.'
- id: chronologie-transformations
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: vote-femmes
      texte: Droit de vote des femmes
    - id: developpement-immigration
      texte: Développement de l'immigration de travail
    - id: mai68
      texte: Mouvement de mai 1968
    - id: loi-veil
      texte: Légalisation de l'IVG (loi Veil)
  indices:
    relance: Le droit de vote des femmes est l'événement le plus ancien de cette liste.
    methode: Le développement de l'immigration de travail commence dans les années 1950-1960, avant mai 1968.
    etape: La loi Veil, en 1975, est l'événement le plus récent de cette liste.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux événements voisins sont inversés. Lequel des deux a eu lieu en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus ancien (droit de vote, 1944) et le plus récent (loi Veil, 1975), puis range
      les deux autres entre eux.
  solution: Droit de vote des femmes (1944), développement de l'immigration de travail (années 1950-1960), mouvement de mai
    1968, légalisation de l'IVG par la loi Veil (1975).
- id: developpement-transformations-societe
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre comment la société française change entre 1945 et la fin du XXe siècle, à partir
    de deux exemples précis.'
  criteres:
  - L'élève choisit deux transformations différentes (par exemple femmes et chômage, ou immigration et jeunesse).
  - L'élève donne un repère précis (date ou loi) pour chaque exemple choisi.
  - L'élève montre que ces évolutions transforment la vie quotidienne et alimentent le débat citoyen.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Choisis deux thèmes différents parmi la place des femmes, l'immigration, la jeunesse, le vieillissement et le
      chômage.
    methode: Donne une date ou une loi précise pour chacun des deux exemples choisis.
    etape: Tu peux commencer ainsi « Après 1945, la société française connaît de profondes transformations... », puis développer
      un premier exemple (la place des femmes) avant un second (le chômage).
  solution: 'Après 1945, la société française connaît de profondes transformations. La place des femmes évolue nettement :
    après le droit de vote obtenu en 1944, elles gagnent de nouveaux droits, comme la légalisation de l''IVG en 1975 par la
    loi Veil. Le monde du travail change aussi : après les Trente Glorieuses, période de forte croissance jusqu''au milieu
    des années 1970, le chômage augmente fortement à partir de cette date, avec les crises économiques. Ces deux évolutions
    transforment profondément la vie quotidienne des Français et posent de nouveaux débats politiques et citoyens.'
- id: nblm-quelle-evolution-majeure-des-droits-des-1
  type: choix
  difficulte: 2
  enonce: Quelle évolution majeure des droits des femmes est portée par la loi Veil adoptée en 1975 ?
  reponse:
    options:
    - id: o1
      texte: La légalisation de l'interruption volontaire de grossesse (IVG).
    - id: o2
      texte: L'obtention du droit de vote et d'éligibilité.
    - id: o3
      texte: L'instauration de la parité obligatoire aux élections.
    - id: o4
      texte: L'accès au travail sans l'autorisation du mari.
    bonnes:
    - o1
  indices:
    relance: Pense au domaine de la santé et à la liberté de décision des femmes concernant la maternité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le droit de vote et d''éligibilité des femmes a été accordé en avril 1944 (et exercé pour
      la première fois en 1945), pas en 1975.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : la loi Veil de 1975 concerne le domaine de la santé et des droits reproductifs, non la parité électorale.'
  - si:
      contient:
      - o4
    relance: 'Confusion de dates : le droit de travailler sans l''accord du mari découle de la réforme du régime matrimonial
      de 1965, pas de la loi Veil.'
  solution: La légalisation de l'interruption volontaire de grossesse (IVG). C'est exact. Portée par Simone Veil, la loi de
    1975 légalise l'IVG et constitue une avancée majeure pour l'autonomie et les droits des femmes.
- id: nblm-quel-evenement-marquant-de-la-seconde-mo-2
  type: choix
  difficulte: 2
  enonce: Quel événement marquant de la seconde moitié du XXe siècle illustre l'émergence des nouvelles aspirations de la
    jeunesse en France ?
  reponse:
    options:
    - id: o1
      texte: Le mouvement social et culturel de mai 1968.
    - id: o2
      texte: La crise des ligues du 6 février 1934.
    - id: o3
      texte: La création de la Sécurité sociale en 1945.
    - id: o4
      texte: La signature du traité de Maastricht en 1992.
    bonnes:
    - o1
  indices:
    relance: Cherche le mois et l'année emblématiques d'une contestation étudiante et sociale à la fin des années 1960.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de période : cet événement s''est déroulé durant l''entre-deux-guerres et n''impliquait pas la jeunesse
      de la seconde moitié du XXe siècle.'
  - si:
      contient:
      - o3
    relance: 'Confusion de sujet : la Sécurité sociale est une réforme majeure de la Libération, pas un mouvement d''expression
      de la jeunesse.'
  - si:
      contient:
      - o4
    relance: 'Hors sujet : ce traité est une étape de la construction européenne et non un mouvement social d''aspiration
      de la jeunesse.'
  solution: Le mouvement social et culturel de mai 1968. Exact. Le mouvement de mai 1968 exprime la volonté de la jeunesse
    de faire évoluer la société, les mœurs et d'obtenir plus de libertés.
- id: nblm-comment-se-caracterise-la-periode-econom-3
  type: choix
  difficulte: 2
  enonce: Comment se caractérise la période économique des « Trente Glorieuses » en France (1945-1975) ?
  reponse:
    options:
    - id: o1
      texte: Une période de forte croissance économique et de plein emploi.
    - id: o2
      texte: Une crise économique durable accompagnée d'un chômage massif.
    - id: o3
      texte: Une phase de repli économique autarcique sans échanges internationaux.
    - id: o4
      texte: Une récession économique majeure déclenchée par le krach de 1929.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'adjectif positif associé à ces trois décennies de prospérité d'après-guerre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la forte hausse du chômage survient seulement après 1975, marquant précisément la fin des
      Trente Glorieuses.'
  - si:
      contient:
      - o3
    relance: 'Faux : la France s''intègre au contraire activement dans le marché commun européen à cette époque.'
  - si:
      contient:
      - o4
    relance: 'Confusion chronologique : la crise de 1929 s''est produite durant l''entre-deux-guerres, bien avant 1945.'
  solution: Une période de forte croissance économique et de plein emploi. C'est exact. Les Trente Glorieuses se caractérisent
    par un essor économique soutenu et un taux de chômage très faible.
- id: nblm-quelle-transformation-demographique-maje-4
  type: choix
  difficulte: 2
  enonce: Quelle transformation démographique majeure caractérise la population française dans la seconde moitié du XXe siècle
    ?
  reponse:
    options:
    - id: o1
      texte: Un vieillissement de la population lié à l'allongement de l'espérance de vie.
    - id: o2
      texte: Une chute brutale et continue de l'espérance de vie.
    - id: o3
      texte: Une diminution rapide du nombre de personnes retraitées.
    - id: o4
      texte: Un dépeuplement massif du pays causé par une émigration vers l'étranger.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'effet de l'amélioration de la médecine sur le nombre d'années que vit la population.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : l''espérance de vie a progressé de manière constante en France au cours de la seconde moitié du XXe siècle.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : le vieillissement démographique entraîne au contraire une augmentation de la part des seniors dans
      la population.'
  - si:
      contient:
      - o4
    relance: 'Inexact : la France a connu une croissance démographique globale soutenue par le baby-boom et l''immigration.'
  solution: Un vieillissement de la population lié à l'allongement de l'espérance de vie. Exact. L'amélioration des conditions
    de vie et les progrès de la médecine permettent une hausse constante de la durée de vie moyenne.
- id: nblm-a-partir-de-quelle-periode-le-chomage-co-5
  type: choix
  difficulte: 2
  enonce: À partir de quelle période le chômage commence-t-il à augmenter fortement en France, marquant la fin des Trente
    Glorieuses ?
  reponse:
    options:
    - id: o1
      texte: Au milieu des années 1970, en raison des crises économiques.
    - id: o2
      texte: Dès la fin de la Première Guerre mondiale en 1918.
    - id: o3
      texte: Tout au long de la période 1945-1960.
    - id: o4
      texte: Seulement à partir des années 2020.
    bonnes:
    - o1
  indices:
    relance: Pense à la décennie où surviennent les premiers chocs pétroliers et la rupture de la croissance d'après-guerre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Anachronisme : la période d''après 1945 est au contraire marquée par le plein emploi pendant trente ans.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : les années 1945-1960 manquaient de main-d''œuvre pour la reconstruction et l''industrie,
      le chômage y était négligeable.'
  - si:
      contient:
      - o4
    relance: 'Faux : la hausse du chômage est devenue un enjeu économique et social central dès le milieu des années 1970.'
  solution: Au milieu des années 1970, en raison des crises économiques. C'est exact. La fin de la croissance rapide et les
    chocs économiques du milieu des années 1970 entraînent l'apparition d'un chômage de masse.
- id: nblm-quels-sont-deux-motifs-majeurs-qui-expli-6
  type: choix
  difficulte: 3
  enonce: Quels sont deux motifs majeurs qui expliquent le développement de l'immigration de travail en France durant les
    années 1950 et 1960 ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Répondre aux importants besoins de main-d'œuvre pour la reconstruction du pays.
    - id: o2
      texte: Soutenir le rythme de la forte croissance économique des Trente Glorieuses.
    - id: o3
      texte: Accueillir les populations déplacées par le krach boursier de 1929.
    - id: o4
      texte: Remplacer la totalité des agriculteurs français à la suite de l'exode rural.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux explications liées aux besoins de reconstruction et à l'essor industriel d'après-guerre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur de chronologie : le krach de 1929 est un événement des années 1930, sans rapport avec les besoins d''après
      1945.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : l''immigration de travail s''est principalement dirigée vers l''industrie, le bâtiment et les travaux
      publics.'
  solution: Répondre aux importants besoins de main-d'œuvre pour la reconstruction du pays ; Soutenir le rythme de la forte
    croissance économique des Trente Glorieuses. C'est juste. Après 1945, la reconstruction des infrastructures et des villes
    nécessitait un nombre important de travailleurs.
- id: nblm-dans-la-seconde-moitie-du-xxe-siecle-les-7
  type: texte_court
  difficulte: 1
  enonce: Dans la seconde moitié du XXe siècle, les mutations de la société s'accompagnent d'évolutions législatives, notamment
    par l'adaptation du droit du ____.
  reponse:
    acceptees:
    - travail
    fautes_tolerees: 1
  indices:
    relance: Il s'agit du domaine du droit qui régit les relations entre salariés et employeurs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: travail. Exact. Le droit du travail a évolué pour s'adapter aux nouvelles réalités professionnelles et protéger
    les salariés.
- id: nblm-quel-nom-porte-la-periode-de-forte-crois-8
  type: texte_court
  difficulte: 1
  enonce: Quel nom porte la période de forte croissance économique et de plein emploi qui s'étend en France de 1945 à 1975
    environ ? Les ____ Glorieuses.
  reponse:
    acceptees:
    - Trente
    fautes_tolerees: 1
  indices:
    relance: Indique en lettres le nombre équivalant aux 30 années de cette période.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: Trente. Exact. L'expression « Trente Glorieuses » désigne ces trois décennies de prospérité économique d'après-guerre.
