format: 2
notion: transformations-societe-francaise
version: 2
etat: verifiee
declencheurs:
- loi Veil
- mai 1968
- Trente Glorieuses
- immigration de travail
- espérance de vie
- droit du travail
- IVG en France
- loi Neuwirth
- majorité à 18 ans
- travailleurs immigrés
prerequis:
- refondation-republicaine-liberation
essentiel: 'Dans la seconde moitié du XXe siècle, la société française change en profondeur. Le programme retient cinq transformations.


  1. La place des femmes. Elles obtiennent le droit de vote en 1944 (elles votent pour la première fois en 1945). Elles travaillent
  de plus en plus et sont plus nombreuses dans les études. Leurs droits progressent : loi Neuwirth sur la contraception (1967),
  loi Veil qui légalise l''interruption volontaire de grossesse, l''IVG (1975).


  2. Les aspirations de la jeunesse. Après le baby-boom (forte hausse des naissances après 1945), les jeunes sont nombreux.
  Ils réclament plus de liberté, un autre mode de vie et plus de place dans la société. Le mouvement de mai 1968 (grèves ouvrières
  et contestation étudiante) en est le symbole. En 1974, la majorité passe de 21 à 18 ans.


  3. L''immigration. Pendant les Trente Glorieuses (1945-1975, forte croissance économique et plein emploi), la France fait
  venir des travailleurs étrangers (Italie, Espagne, Portugal, Maghreb) pour reconstruire et faire tourner les usines. En
  1974, l''immigration de travail est suspendue. L''immigration devient ensuite un sujet de débat politique.


  4. Le vieillissement. L''espérance de vie augmente grâce aux progrès de la médecine et du niveau de vie. La part des personnes
  âgées grandit. La retraite à 60 ans est instaurée en 1982.


  5. La montée du chômage. À partir du milieu des années 1970, la croissance ralentit (crise économique) : le chômage devient
  massif et durable.


  Ces changements poussent le législateur à adapter les lois (droits des femmes, droit du travail, âge de la majorité). Les
  citoyens y participent par leur vote, les manifestations, les débats et les associations. C''est un enjeu de la démocratie.


  Au brevet, on attend que tu cites plusieurs transformations avec un repère daté (loi, événement) pour chacune, et que tu
  les relies à un débat ou une loi.

  '
methode:
- 'Distinguer les cinq grandes transformations à connaître : place des femmes, jeunesse, immigration, vieillissement, chômage.'
- Pour chaque transformation, donner un repère chronologique ou un exemple concret (loi, événement).
- 'Placer chaque repère dans la bonne période : 1944-1975 (croissance, plein emploi) puis après 1975 (chômage).'
- Relier ces transformations à des adaptations de la loi (droits des femmes, majorité à 18 ans, retraite à 60 ans).
- Montrer le lien entre ces évolutions sociales et le débat politique et citoyen en France.
- Dans un développement, choisir deux ou trois exemples précis plutôt que de tout survoler.
vocabulaire:
- terme: Trente Glorieuses
  definition: période de forte croissance économique en France de 1945 à 1975 environ
- terme: immigration
  definition: l'installation dans un pays de personnes venues d'un autre pays pour y vivre et y travailler
- terme: IVG
  definition: l'interruption volontaire de grossesse, autorisée en France par la loi Veil de 1975
- terme: baby-boom
  definition: la forte hausse des naissances qui suit la Seconde Guerre mondiale
- terme: espérance de vie
  definition: l'âge moyen auquel une personne peut espérer vivre
- terme: chômage
  definition: la situation des personnes sans emploi qui en cherchent un
- terme: législation
  definition: l'ensemble des lois d'un pays
- terme: citoyenneté
  definition: le fait d'être membre d'une nation, avec des droits (voter) et des devoirs
erreurs_frequentes:
- Réduire les transformations de la société française à un seul thème (par exemple seulement l'immigration).
- Oublier de donner un exemple précis (loi, date, événement) pour illustrer une transformation.
- Confondre l'augmentation du chômage (à partir des années 1970) avec la période des Trente Glorieuses (croissance, plein
  emploi).
- Ne pas relier les transformations sociales à des évolutions législatives concrètes.
- Confondre la loi Neuwirth (contraception, 1967) et la loi Veil (IVG, 1975).
exemple:
  enonce: Donne un exemple d'évolution législative liée à la place des femmes dans la société française après 1945.
  solution: La légalisation de l'interruption volontaire de grossesse (IVG) en 1975, portée par la loi Veil, illustre l'évolution
    des droits des femmes après la Seconde Guerre mondiale.
exercices:
- id: annee-loi-veil
  type: nombre
  difficulte: 1
  enonce: En quelle année la loi Veil légalise-t-elle l'interruption volontaire de grossesse (IVG) en France ?
  reponse:
    valeur: 1975
    forme: entier
  indices:
    relance: C'est une loi votée dans les années 1970, sous la présidence de Valéry Giscard d'Estaing.
    methode: Cette loi est adoptée quelques années après le mouvement de mai 1968.
    etape: L'année se situe au milieu des années 1970.
  pieges:
  - si:
      valeur: 1944
    relance: 1944, c'est l'année où les femmes obtiennent le droit de vote. La loi Veil sur l'IVG est bien plus tardive.
  - si:
      valeur: 1968
    relance: 1968, c'est l'année du mouvement de mai 1968. La loi Veil sur l'IVG est votée quelques années plus tard.
  solution: La loi Veil légalise l'interruption volontaire de grossesse (IVG) en 1975.
- id: periode-trente-glorieuses
  type: choix
  difficulte: 1
  enonce: Que désigne l'expression « Trente Glorieuses » ?
  reponse:
    options:
    - id: a
      texte: Une période de forte croissance économique en France, de 1945 à 1975 environ
    - id: b
      texte: Les trente premières années de la Ve République
    - id: c
      texte: Une période de chômage massif après 1975
    - id: d
      texte: Les trente ans de la construction européenne
    bonnes:
    - a
  indices:
    relance: Cette expression parle d'une période économique, pas d'institutions politiques.
    methode: Cette période commence à la fin de la Seconde Guerre mondiale et se termine au milieu des années 1970.
    etape: Le mot « Glorieuses » évoque une période de réussite, ici économique.
  pieges:
  - si:
      contient:
      - b
    relance: La Ve République commence en 1958, pas en 1945. Les Trente Glorieuses désignent une période économique, pas politique.
  - si:
      contient:
      - c
    relance: 'C''est l''inverse : les Trente Glorieuses sont une période de forte croissance, pas de chômage massif, qui vient
      après.'
  - si:
      contient:
      - d
    relance: Les Trente Glorieuses ne concernent pas spécifiquement la construction européenne, mais l'ensemble de l'économie
      française.
  solution: Les Trente Glorieuses désignent la période de forte croissance économique en France, de 1945 à 1975 environ.
- id: mouvement-jeunesse
  type: texte_court
  difficulte: 2
  enonce: Quel mouvement de contestation, en France, marque en 1968 les nouvelles aspirations de la jeunesse ?
  reponse:
    acceptees:
    - mai 68
    - mai 1968
    fautes_tolerees: 1
  indices:
    relance: Ce mouvement porte le nom d'un mois et d'une année.
    methode: Ce mouvement mêle grèves ouvrières et contestation étudiante, au printemps d'une année précise.
    etape: 'Complète : « ... 1968 ».'
  pieges:
  - si:
      valeur: 1975
    relance: 1975, c'est l'année de la loi Veil sur l'IVG, pas celle du mouvement de contestation de la jeunesse.
  solution: Le mouvement de mai 1968 marque les nouvelles aspirations de la jeunesse en France.
- id: transformations-associations
  type: association
  difficulte: 2
  enonce: Relie chaque transformation de la société française à son exemple ou explication.
  reponse:
    gauche:
    - id: a
      texte: Place des femmes
    - id: b
      texte: Immigration
    - id: c
      texte: Chômage
    droite:
    - id: x
      texte: Légalisation de l'IVG en 1975 (loi Veil)
    - id: y
      texte: Développement lié aux besoins de main-d'œuvre depuis les années 1950-1960
    - id: z
      texte: Forte hausse à partir du milieu des années 1970
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: La loi Veil concerne directement l'un de ces trois thèmes.
    methode: Le chômage augmente après la fin des Trente Glorieuses ; l'immigration répond à des besoins économiques plus
      anciens.
    etape: Associe d'abord la place des femmes à la loi Veil, un repère facile à retenir.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier la période de la hausse du chômage par rapport au développement
      de l'immigration.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, la loi Veil de 1975 concerne la place des femmes, puis distingue immigration et chômage
      selon leurs dates.
  solution: 'Place des femmes : légalisation de l''IVG en 1975 (loi Veil). Immigration : développement lié aux besoins de
    main-d''œuvre depuis les années 1950-1960. Chômage : forte hausse à partir du milieu des années 1970.'
- id: chronologie-transformations
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: vote-femmes
      texte: Droit de vote des femmes
    - id: developpement-immigration
      texte: Développement de l'immigration de travail
    - id: mai68
      texte: Mouvement de mai 1968
    - id: loi-veil
      texte: Légalisation de l'IVG (loi Veil)
  indices:
    relance: Le droit de vote des femmes est l'événement le plus ancien de cette liste.
    methode: Le développement de l'immigration de travail commence dans les années 1950-1960, avant mai 1968.
    etape: La loi Veil, en 1975, est l'événement le plus récent de cette liste.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux événements voisins sont inversés. Lequel des deux a eu lieu en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus ancien (droit de vote, 1944) et le plus récent (loi Veil, 1975), puis range
      les deux autres entre eux.
  solution: Droit de vote des femmes (1944), développement de l'immigration de travail (années 1950-1960), mouvement de mai
    1968, légalisation de l'IVG par la loi Veil (1975).
- id: developpement-transformations-societe
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre comment la société française change entre 1945 et la fin du XXe siècle, à partir
    de deux exemples précis.'
  criteres:
  - L'élève choisit deux transformations différentes (par exemple femmes et chômage, ou immigration et jeunesse).
  - L'élève donne un repère précis (date ou loi) pour chaque exemple choisi.
  - L'élève montre que ces évolutions transforment la vie quotidienne et alimentent le débat citoyen.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Choisis deux thèmes différents parmi la place des femmes, l'immigration, la jeunesse, le vieillissement et le
      chômage.
    methode: Donne une date ou une loi précise pour chacun des deux exemples choisis.
    etape: Tu peux commencer ainsi « Après 1945, la société française connaît de profondes transformations... », puis développer
      un premier exemple (la place des femmes) avant un second (le chômage).
  solution: 'Après 1945, la société française connaît de profondes transformations. La place des femmes évolue nettement :
    après le droit de vote obtenu en 1944, elles gagnent de nouveaux droits, comme la légalisation de l''IVG en 1975 par la
    loi Veil. Le monde du travail change aussi : après les Trente Glorieuses, période de forte croissance jusqu''au milieu
    des années 1970, le chômage augmente fortement à partir de cette date, avec les crises économiques. Ces deux évolutions
    transforment profondément la vie quotidienne des Français et posent de nouveaux débats politiques et citoyens.'
- id: annee-loi-neuwirth
  type: nombre
  difficulte: 2
  enonce: En quelle année la loi Neuwirth autorise-t-elle la contraception en France ?
  reponse:
    valeur: 1967
    forme: entier
  indices:
    relance: Cette loi est votée un an avant le mouvement de mai 1968.
    methode: La contraception est autorisée avant l'IVG (loi Veil) et avant mai 1968. Situe-la dans les années 1960.
    etape: L'année est la fin de la décennie 1960, juste avant 1968.
  pieges:
  - si:
      valeur: 1975
    relance: 1975 est l'année de la loi Veil sur l'IVG. La loi sur la contraception est plus ancienne.
  - si:
      valeur: 1944
    relance: 1944 est l'année du droit de vote des femmes, pas de la loi sur la contraception.
  solution: La loi Neuwirth, qui autorise la contraception, est votée en 1967 (la loi Veil sur l'IVG date de 1975).
- id: causes-immigration
  type: choix
  difficulte: 2
  enonce: Pourquoi la France fait-elle appel à des travailleurs étrangers pendant les Trente Glorieuses ?
  reponse:
    options:
    - id: a
      texte: Pour répondre aux besoins de main-d'œuvre de la reconstruction et de la croissance
    - id: b
      texte: Pour remplacer tous les ouvriers français partis à la retraite à 60 ans
    - id: c
      texte: Pour faire face à une période de chômage massif
    bonnes:
    - a
  indices:
    relance: Pense au contexte économique de 1945 à 1975 (croissance, reconstruction).
    methode: Élimine les propositions qui ne correspondent pas à la période des Trente Glorieuses.
    etape: Le chômage massif et la retraite à 60 ans arrivent plus tard, après 1975.
  pieges:
  - si:
      contient:
      - b
    relance: La retraite à 60 ans date de 1982, donc après cette période.
  - si:
      contient:
      - c
    relance: Le chômage massif commence après 1975. Pendant les Trente Glorieuses, il y a plein emploi.
  solution: La France fait appel à des travailleurs étrangers pour répondre aux besoins de main-d'œuvre de la reconstruction
    et de la croissance des Trente Glorieuses.
