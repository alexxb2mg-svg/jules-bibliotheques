format: 2
notion: refondation-republicaine-liberation
version: 1
etat: verifiee
declencheurs:
- vote des femmes en France
- sécurité sociale
- nationalisations
- programme du CNR
- IVe République
- ordonnance du 21 avril 1944
- Louise Weiss
prerequis:
- vichy-collaboration-resistance
essentiel: 'La Libération de la France (1944) permet de restaurer la légalité républicaine après le régime de Vichy, dans
  une dynamique de « refondation » : il s''agit de reconstruire un État démocratique et de réparer les injustices de l''Occupation.

  La République intègre alors politiquement les femmes : l''ordonnance du 21 avril 1944 leur accorde le droit de vote et d''éligibilité,
  obtenu après des décennies de mobilisation, notamment de féministes comme Louise Weiss. Les femmes votent pour la première
  fois en France en 1945.

  Le gouvernement met en œuvre le programme de réformes préparé en 1943 par le Conseil national de la Résistance (CNR), qui
  prolonge et complète celui du Front populaire de 1936 : il élargit la démocratie dans un sens social, avec par exemple la
  création de la Sécurité sociale et des nationalisations d''entreprises.'
methode:
- Situer la Libération en 1944 et la retenir comme un moment de restauration de la démocratie après Vichy.
- 'Donner la date précise du droit de vote des femmes en France : 21 avril 1944 (premier vote en 1945).'
- 'Relier le programme du CNR au Front populaire : une continuité dans l''élargissement social de la démocratie.'
- Citer au moins une réforme concrète héritée du programme du CNR (Sécurité sociale, nationalisations).
vocabulaire:
- terme: refondation républicaine
  definition: la reconstruction des institutions et des valeurs démocratiques après la période de Vichy
- terme: Sécurité sociale
  definition: système de protection sociale créé en 1945-1946, issu du programme du CNR
erreurs_frequentes:
- Confondre 1944 (droit de vote accordé) et 1945 (premières élections où les femmes votent réellement).
- 'Croire que le droit de vote des femmes est immédiat après la Révolution française : il faut attendre 1944, près d''un siècle
  après le suffrage universel masculin (1848/1851).'
- Oublier le lien entre le programme du CNR et celui du Front populaire de 1936.
- Réduire la refondation républicaine au seul droit de vote des femmes, en oubliant les réformes sociales.
exemple:
  enonce: En quelle année les femmes obtiennent-elles le droit de vote en France, et quand votent-elles pour la première fois
    ?
  solution: Le droit de vote leur est accordé par une ordonnance du 21 avril 1944 ; elles votent pour la première fois en
    France en 1945.
exercices:
- id: annee-droit-vote-femmes
  type: nombre
  difficulte: 1
  enonce: En quelle année une ordonnance accorde-t-elle le droit de vote aux femmes en France ?
  reponse:
    valeur: 1944
    forme: entier
  indices:
    relance: C'est l'année de la Libération de la France.
    methode: Le droit de vote est accordé un peu avant le premier vote réel des femmes, qui a lieu en 1945.
    etape: L'ordonnance est signée le 21 avril d'une certaine année. Donne cette année.
  pieges:
  - si:
      valeur: 1945
    relance: 1945, c'est l'année où les femmes votent pour la première fois. Le droit leur est accordé un peu avant, par une
      ordonnance.
  - si:
      valeur: 1848
    relance: 1848, c'est l'année du suffrage universel masculin en France. Les femmes attendent près d'un siècle de plus.
  solution: L'ordonnance du 21 avril 1944 accorde le droit de vote et d'éligibilité aux femmes en France.
- id: auteur-programme
  type: choix
  difficulte: 1
  enonce: Qui prépare, dès 1943, le programme de réformes appliqué à la Libération ?
  reponse:
    options:
    - id: a
      texte: Le Conseil national de la Résistance (CNR)
    - id: b
      texte: Le gouvernement de Vichy
    - id: c
      texte: Le Front populaire
    - id: d
      texte: Le général Franco
    bonnes:
    - a
  indices:
    relance: Cherche un organisme qui unit résistants, partis et syndicats pendant l'Occupation.
    methode: Ce programme est préparé avant la Libération, en 1943, par un conseil qui rassemble différents mouvements de
      résistance.
    etape: Le nom de cet organisme contient les mots « national » et « Résistance ».
  pieges:
  - si:
      contient:
      - b
    relance: Le gouvernement de Vichy collabore avec l'occupant allemand ; ce n'est pas lui qui prépare la refondation républicaine.
  - si:
      contient:
      - c
    relance: Le Front populaire date de 1936, avant la guerre. Son programme inspire celui de 1943, mais ce n'est pas lui
      qui le prépare.
  - si:
      contient:
      - d
    relance: Franco dirige l'Espagne, pas la France. Cherche un organisme français de la Résistance.
  solution: Le Conseil national de la Résistance (CNR), qui réunit résistants, partis politiques et syndicats, prépare dès
    1943 le programme de réformes appliqué à la Libération.
- id: chronologie-liberation
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: front-populaire
      texte: Le Front populaire obtient les congés payés
    - id: programme-cnr
      texte: Le CNR prépare son programme de réformes
    - id: ordonnance
      texte: L'ordonnance accorde le droit de vote aux femmes
    - id: premier-vote
      texte: Les femmes votent pour la première fois en France
  indices:
    relance: Le Front populaire est le plus ancien de ces quatre événements. Lequel est le plus récent ?
    methode: Place d'abord 1936 (Front populaire) et 1945 (premier vote), puis range les deux événements de 1943 et 1944 entre
      eux.
    etape: Le programme du CNR est préparé en 1943, avant que l'ordonnance sur le droit de vote soit signée en avril 1944.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux événements voisins sont inversés. Lequel des deux a eu lieu en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus ancien (1936) et le plus récent (1945), puis range les deux autres entre eux.
  solution: Le Front populaire obtient les congés payés (1936), le CNR prépare son programme (1943), l'ordonnance accorde
    le droit de vote aux femmes (avril 1944), les femmes votent pour la première fois (1945).
- id: reformes-cnr
  type: association
  difficulte: 2
  enonce: Relie chaque réforme ou événement à sa description.
  reponse:
    gauche:
    - id: a
      texte: Sécurité sociale
    - id: b
      texte: Nationalisations
    - id: c
      texte: Droit de vote des femmes
    droite:
    - id: x
      texte: Système de protection sociale créé en 1945-1946
    - id: y
      texte: Passage d'entreprises privées sous le contrôle de l'État
    - id: z
      texte: Accordé par ordonnance le 21 avril 1944
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'La Sécurité sociale protège les personnes (maladie, retraite) : cherche la définition qui en parle.'
    methode: Une nationalisation, c'est quand l'État prend le contrôle d'une entreprise. Cherche la définition qui correspond.
    etape: 'Le droit de vote des femmes est daté précisément dans le cours : associe-le à la définition qui donne cette date.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis bien la différence entre la Sécurité sociale (protection des personnes)
      et une nationalisation (contrôle d'une entreprise).
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, le droit de vote des femmes est daté du 21 avril 1944, puis distingue les deux autres réformes.
  solution: 'Sécurité sociale : système de protection sociale créé en 1945-1946. Nationalisations : passage d''entreprises
    privées sous le contrôle de l''État. Droit de vote des femmes : accordé par ordonnance le 21 avril 1944.'
- id: mot-refondation
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne la reconstruction des institutions et des valeurs démocratiques après la période de Vichy ?
  reponse:
    acceptees:
    - refondation
    - refondation republicaine
    fautes_tolerees: 1
  indices:
    relance: C'est le mot utilisé dans le titre même de cette notion du programme.
    methode: 'Ce mot commence par « re- » : il évoque l''idée de reconstruire quelque chose de démocratique.'
    etape: 'Complète : « refonda... » de la République.'
  pieges:
  - si:
      valeur: revolution
    relance: Il ne s'agit pas d'un changement brutal et violent comme une révolution, mais d'une reconstruction des institutions
      républicaines déjà existantes.
  solution: 'La refondation (républicaine) : la reconstruction des institutions et des valeurs démocratiques après la période
    de Vichy.'
- id: developpement-refondation
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre que la Libération est un moment de refondation démocratique et sociale de la République.'
  criteres:
  - L'élève situe le retour de la légalité républicaine après Vichy en 1944.
  - L'élève cite l'intégration politique des femmes (droit de vote en 1944, premier vote en 1945).
  - L'élève présente le programme du CNR comme un approfondissement social de la démocratie, avec un exemple (Sécurité sociale,
    nationalisations).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quels deux grands changements la Libération apporte-t-elle à la démocratie française ?
    methode: Présente d'abord l'intégration politique des femmes, puis les réformes sociales du programme du CNR.
    etape: Tu peux commencer ainsi « Après la Libération, la République française se reconstruit sur des bases plus démocratiques...
      », puis continuer avec le droit de vote des femmes.
  solution: 'Après la Libération, la République française se reconstruit sur des bases plus démocratiques et plus sociales.
    En 1944, la légalité républicaine est restaurée après le régime de Vichy. La République intègre politiquement les femmes
    : une ordonnance du 21 avril 1944 leur donne le droit de vote, qu''elles exercent pour la première fois en 1945. Le gouvernement
    applique aussi le programme du Conseil national de la Résistance, préparé dès 1943, qui prolonge le Front populaire de
    1936 et crée notamment la Sécurité sociale. La Libération est donc bien un moment de refondation à la fois démocratique
    et sociale.'
- id: nblm-a-quelle-date-precise-le-droit-de-vote-e-1
  type: choix
  difficulte: 2
  enonce: À quelle date précise le droit de vote et d'éligibilité a-t-il été accordé aux femmes en France par ordonnance ?
  reponse:
    options:
    - id: o1
      texte: 21 avril 1944
    - id: o2
      texte: 21 avril 1945
    - id: o3
      texte: 28 septembre 1958
    - id: o4
      texte: 18 juin 1940
    bonnes:
    - o1
  indices:
    relance: Pense à l'année de la Libération de la France, juste avant les premières élections municipales de l'après-guerre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention à ne pas confondre la date de signature de l'ordonnance (1944) et l'année où les femmes ont voté pour
      la première fois (1945).
  - si:
      contient:
      - o3
    relance: Cette date correspond à l'adoption de la Constitution de la Ve République par référendum, pas au droit de vote
      des femmes.
  - si:
      contient:
      - o4
    relance: Cette date marque l'appel du général de Gaulle depuis Londres, et non la signature de l'ordonnance sur le droit
      de vote des femmes.
  solution: 21 avril 1944. C'est la date exacte de l'ordonnance signée à Alger par le Gouvernement provisoire (GPRF), accordant
    le droit de vote et d'éligibilité aux femmes.
- id: nblm-de-quel-rassemblement-politique-de-1936-2
  type: choix
  difficulte: 2
  enonce: De quel rassemblement politique de 1936 le programme du Conseil national de la Résistance (CNR) prolonge-t-il les
    réformes sociales ?
  reponse:
    options:
    - id: o1
      texte: Du Front populaire
    - id: o2
      texte: Du régime de Vichy
    - id: o3
      texte: De la Société des Nations
    - id: o4
      texte: Du mouvement des Non-Alignés
    bonnes:
    - o1
  indices:
    relance: Cette coalition de parties de gauche au pouvoir en 1936 est célèbre pour l'instauration des premiers congés payés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le régime de Vichy a supprimé les libertés démocratiques et la légalité républicaine, à l'opposé des valeurs
      du CNR.
  - si:
      contient:
      - o3
    relance: La SDN était une organisation diplomatique internationale créée en 1919, et non un rassemblement politique français.
  - si:
      contient:
      - o4
    relance: Le mouvement des Non-Alignés concerne les pays du Tiers-Monde pendant la guerre froide (1955), sans rapport avec
      la France de 1936.
  solution: Du Front populaire. Le programme du CNR prolonge et élargit la démocratie sociale initiée par les réformes du
    Front populaire de 1936.
- id: nblm-quelle-grande-institution-de-protection-3
  type: choix
  difficulte: 2
  enonce: Quelle grande institution de protection sociale créée en 1945-1946 est directement issue du programme du CNR ?
  reponse:
    options:
    - id: o1
      texte: La Sécurité sociale
    - id: o2
      texte: L'Organisation des Nations unies
    - id: o3
      texte: La Communauté européenne du charbon et de l'acier
    - id: o4
      texte: La Croix-Rouge française
    bonnes:
    - o1
  indices:
    relance: Il s'agit du système public solidaire qui rembourse les soins de santé et garantit les pensions de retraite.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'ONU est une organisation internationale garantissant la paix mondiale, et non le système français de protection
      sociale.
  - si:
      contient:
      - o3
    relance: La CECA a été fondée en 1951 pour la coopération économique européenne, pas pour la couverture sociale des Français.
  - si:
      contient:
      - o4
    relance: La Croix-Rouge est une organisation humanitaire privée, distincte du système public universel de protection sociale.
  solution: La Sécurité sociale. La Sécurité sociale a été fondée à la Libération pour protéger l'ensemble des citoyens contre
    les risques de maladie, de vieillesse et d'accidents.
- id: nblm-dans-quel-but-le-gouvernement-de-la-libe-4
  type: choix
  difficulte: 2
  enonce: Dans quel but le gouvernement de la Libération procède-t-il à des nationalisations d'entreprises dès 1944 ?
  reponse:
    options:
    - id: o1
      texte: Pour élargir la démocratie dans un sens social et reconstruire l'économie sous le contrôle de la collectivité
    - id: o2
      texte: Pour privatiser l'ensemble des services publics au profit d'entreprises étrangères
    - id: o3
      texte: Pour supprimer totalement la propriété privée dans tout le pays
    - id: o4
      texte: Pour remplacer la monnaie nationale par l'euro
    bonnes:
    - o1
  indices:
    relance: Réfléchis au transfert des grands leviers économiques (énergie, transport, crédit) vers la collectivité nationale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'La nationalisation est l''inverse de la privatisation : elle transfère des entreprises privées vers la propriété
      de l''État.'
  - si:
      contient:
      - o3
    relance: Les nationalisations ne ciblaient que les grands secteurs stratégiques et n'ont pas aboli la propriété privée
      globale.
  - si:
      contient:
      - o4
    relance: L'euro n'est entré en circulation qu'en 2002 ; cette mesure n'a aucun rapport avec la reconstruction de 1944-1945.
  solution: Pour élargir la démocratie dans un sens social et reconstruire l'économie sous le contrôle de la collectivité.
    Les nationalisations ont permis à l'État de contrôler des secteurs stratégiques (énergie, transports, banques) au service
    de l'intérêt général.
- id: nblm-quel-regime-politique-republicain-succed-5
  type: choix
  difficulte: 2
  enonce: Quel régime politique républicain succède au Gouvernement provisoire et fonde les nouvelles institutions françaises
    en 1946 ?
  reponse:
    options:
    - id: o1
      texte: La IVe République
    - id: o2
      texte: La IIIe République
    - id: o3
      texte: La Ve République
    - id: o4
      texte: Le régime de Vichy
    bonnes:
    - o1
  indices:
    relance: C'est le régime républicain parlementaire fondé juste après la Seconde Guerre mondiale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La IIIe République a pris fin en juillet 1940 lors de la défaite militaire et de l'installation du régime de
      Vichy.
  - si:
      contient:
      - o3
    relance: La Ve République n'a été fondée qu'en 1958 par le général de Gaulle au cours de la crise algérienne.
  - si:
      contient:
      - o4
    relance: Le régime de Vichy était un régime autoritaire de collaboration qui s'est effondré lors de la Libération en 1944.
  solution: La IVe République. La IVe République est instaurée en 1946 à la suite des travaux de l'Assemblée constituante
    née de la Libération.
- id: nblm-quelles-sont-les-deux-avancees-politique-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux avancées politiques et sociales majeures concrètement appliquées à la Libération dans le cadre
    de la refondation républicaine ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La création de la Sécurité sociale
    - id: o2
      texte: L'octroi du droit de vote et d'éligibilité aux femmes
    - id: o3
      texte: L'instauration du quinquennat présidentiel
    - id: o4
      texte: La création de la Communauté économique européenne (CEE)
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne la grande réforme de protection sociale et le droit politique accordé aux citoyennes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Le passage au quinquennat présidentiel est une réforme constitutionnelle récente datant de l'an 2000.
  - si:
      contient:
      - o4
    relance: La CEE a été fondée en 1957 par le traité de Rome, c'est une étape de la construction européenne et non une réforme
      interne de 1944.
  solution: La création de la Sécurité sociale ; L'octroi du droit de vote et d'éligibilité aux femmes. C'est la réforme sociale
    majeure de 1945 instaurant une protection solidaire contre les risques de maladie et de vieillesse.
- id: nblm-en-quelle-annee-les-femmes-francaises-on-7
  type: texte_court
  difficulte: 1
  enonce: En quelle année les femmes françaises ont-elles voté pour la toute première fois lors d'élections ?
  reponse:
    acceptees:
    - '1945'
    fautes_tolerees: 1
  indices:
    relance: C'est l'année de la fin de la Seconde Guerre mondiale en Europe, qui suit l'ordonnance d'avril 1944.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 1945. Si l'ordonnance accordant le droit de vote date d'avril 1944, le premier scrutin effectif où les femmes
    ont voté a eu lieu lors des élections municipales d'avril-mai 1945.
- id: nblm-quel-est-l-acronyme-en-trois-lettres-de-8
  type: texte_court
  difficulte: 1
  enonce: Quel est l'acronyme en trois lettres de l'organisme créé sous l'Occupation qui a préparé le programme de réformes
    sociales de la Libération ?
  reponse:
    acceptees:
    - CNR
    fautes_tolerees: 1
  indices:
    relance: Cet acronyme désigne l'organisme qui a unifié la Résistance française sous la direction de Jean Moulin en 1943.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: CNR. Le CNR (Conseil national de la Résistance), créé en 1943 par Jean Moulin, a rédigé le programme de réformes
    appliqué dès 1944.
