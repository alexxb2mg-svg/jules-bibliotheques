format: 2
notion: refondation-republicaine-liberation
version: 2
etat: generee
declencheurs:
- vote des femmes en France
- sécurité sociale
- nationalisations
- programme du CNR
- IVe République
- ordonnance du 21 avril 1944
- Louise Weiss
- les jours heureux
- gouvernement provisoire de Gaulle
- droit de vote 1944
prerequis:
- vichy-collaboration-resistance
essentiel: |-
  En 1944, la France est libérée de l'occupation allemande. Le régime de Vichy, qui avait supprimé les valeurs républicaines, disparaît. Un gouvernement provisoire dirigé par le général de Gaulle rétablit la légalité républicaine : on parle de refondation, car il faut reconstruire un État démocratique.

  La République intègre politiquement les femmes. Une ordonnance du 21 avril 1944 leur accorde le droit de vote et d'éligibilité. Cette réforme est le résultat de longues mobilisations, notamment de féministes comme Louise Weiss. Les femmes votent pour la première fois en France en 1945, lors des élections municipales puis des élections à l'Assemblée constituante.

  Le programme du Conseil national de la Résistance (CNR) est préparé en 1943 et adopté en 1944, avant la Libération. Le CNR réunit des résistants, des partis politiques et des syndicats. Son programme prolonge et complète celui du Front populaire de 1936 : il élargit la démocratie dans un sens social. On parle de démocratie politique et sociale.

  Réformes concrètes à connaître :
  - la Sécurité sociale (1945-1946), qui protège les personnes contre la maladie, les accidents du travail, la vieillesse, et aide les familles ;
  - des nationalisations d'entreprises, c'est-à-dire des entreprises privées qui passent sous le contrôle de l'État (par exemple des grandes entreprises de l'énergie et des banques) ;
  - le rétablissement des libertés (presse, syndicats).

  Un nouveau régime est fondé en 1946 : la IVe République. Une nouvelle Constitution est adoptée par référendum.

  Repères : Front populaire 1936 ; programme du CNR 1943-1944 ; droit de vote des femmes 21 avril 1944 ; premier vote des femmes 1945 ; Sécurité sociale 1945-1946.

  Ce qu'on attend au brevet : expliquer que la Libération est un moment de refondation, citer le droit de vote des femmes avec ses dates, et présenter le programme du CNR comme un prolongement du Front populaire avec un exemple de réforme sociale.
methode:
- Situer la Libération en 1944 et la retenir comme un moment de restauration de la légalité républicaine après Vichy.
- 'Donner la date précise du droit de vote des femmes : ordonnance du 21 avril 1944, premier vote en 1945.'
- Présenter le CNR (résistants, partis, syndicats) et son programme préparé en 1943 et adopté en 1944.
- 'Relier le programme du CNR au Front populaire : une continuité dans l''élargissement social de la démocratie.'
- Citer au moins une réforme concrète (Sécurité sociale, nationalisations) et la définir.
- Conclure en parlant de refondation démocratique et sociale, puis de la IVe République (1946).
vocabulaire:
- terme: refondation républicaine
  definition: reconstruction des institutions et des valeurs démocratiques après la période de Vichy
- terme: Libération
  definition: fin de l'occupation allemande et du régime de Vichy en France, en 1944
- terme: Sécurité sociale
  definition: système de protection sociale créé en 1945-1946, issu du programme du CNR
- terme: nationalisation
  definition: passage d'une entreprise privée sous le contrôle de l'État
- terme: CNR
  definition: Conseil national de la Résistance, qui réunit résistants, partis et syndicats et prépare un programme de réformes
- terme: Front populaire
  definition: coalition de gauche au pouvoir en 1936, à l'origine de réformes sociales comme les congés payés
- terme: droit d'éligibilité
  definition: droit de se présenter à une élection pour être élu
- terme: IVe République
  definition: régime de la France de 1946 à 1958, fondé après la Libération
erreurs_frequentes:
- Confondre 1944 (droit de vote accordé) et 1945 (premières élections où les femmes votent réellement).
- 'Croire que le droit de vote des femmes date de la Révolution française : il faut attendre 1944.'
- Oublier le lien entre le programme du CNR et celui du Front populaire de 1936.
- Réduire la refondation républicaine au seul droit de vote des femmes, en oubliant les réformes sociales.
- Confondre le CNR (organe de la Résistance intérieure) et le régime de Vichy.
exemple:
  enonce: En quelle année les femmes obtiennent-elles le droit de vote en France, et quand votent-elles pour la première fois ?
  solution: Le droit de vote leur est accordé par une ordonnance du 21 avril 1944 ; elles votent pour la première fois en France en 1945.
exercices:
- id: annee-droit-vote-femmes
  type: nombre
  difficulte: 1
  enonce: En quelle année une ordonnance accorde-t-elle le droit de vote aux femmes en France ?
  reponse:
    valeur: 1944
    forme: entier
  indices:
    relance: C'est l'année de la Libération de la France.
    methode: Le droit de vote est accordé un peu avant le premier vote réel des femmes, qui a lieu en 1945.
    etape: L'ordonnance est signée le 21 avril d'une certaine année. Donne cette année.
  pieges:
  - si:
      valeur: 1945
    relance: 1945, c'est l'année où les femmes votent pour la première fois. Le droit leur est accordé un peu avant, par une ordonnance.
  - si:
      valeur: 1848
    relance: 1848, c'est l'année du suffrage universel masculin en France. Les femmes attendent près d'un siècle de plus.
  solution: L'ordonnance du 21 avril 1944 accorde le droit de vote et d'éligibilité aux femmes en France.
- id: auteur-programme
  type: choix
  difficulte: 1
  enonce: Qui prépare, dès 1943, le programme de réformes appliqué à la Libération ?
  reponse:
    options:
    - id: a
      texte: Le Conseil national de la Résistance (CNR)
    - id: b
      texte: Le gouvernement de Vichy
    - id: c
      texte: Le Front populaire
    - id: d
      texte: Le général Franco
    bonnes:
    - a
  indices:
    relance: Cherche un organisme qui unit résistants, partis et syndicats pendant l'Occupation.
    methode: Ce programme est préparé avant la Libération, en 1943, par un conseil qui rassemble différents mouvements de résistance.
    etape: Le nom de cet organisme contient les mots « national » et « Résistance ».
  pieges:
  - si:
      contient:
      - b
    relance: Le gouvernement de Vichy collabore avec l'occupant allemand ; ce n'est pas lui qui prépare la refondation républicaine.
  - si:
      contient:
      - c
    relance: Le Front populaire date de 1936, avant la guerre. Son programme inspire celui de 1943, mais ce n'est pas lui qui le prépare.
  - si:
      contient:
      - d
    relance: Franco dirige l'Espagne, pas la France. Cherche un organisme français de la Résistance.
  solution: Le Conseil national de la Résistance (CNR), qui réunit résistants, partis politiques et syndicats, prépare dès 1943 le programme de réformes appliqué à la Libération.
- id: chronologie-liberation
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: front-populaire
      texte: Le Front populaire obtient les congés payés
    - id: programme-cnr
      texte: Le CNR prépare son programme de réformes
    - id: ordonnance
      texte: L'ordonnance accorde le droit de vote aux femmes
    - id: premier-vote
      texte: Les femmes votent pour la première fois en France
  indices:
    relance: Le Front populaire est le plus ancien de ces quatre événements. Lequel est le plus récent ?
    methode: Place d'abord 1936 (Front populaire) et 1945 (premier vote), puis range les deux événements de 1943 et 1944 entre eux.
    etape: Le programme du CNR est préparé en 1943, avant que l'ordonnance sur le droit de vote soit signée en avril 1944.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux événements voisins sont inversés. Lequel des deux a eu lieu en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus ancien (1936) et le plus récent (1945), puis range les deux autres entre eux.
  solution: Le Front populaire obtient les congés payés (1936), le CNR prépare son programme (1943), l'ordonnance accorde le droit de vote aux femmes (avril 1944), les femmes votent pour la première fois (1945).
- id: reformes-cnr
  type: association
  difficulte: 2
  enonce: Relie chaque réforme ou événement à sa description.
  reponse:
    gauche:
    - id: a
      texte: Sécurité sociale
    - id: b
      texte: Nationalisations
    - id: c
      texte: Droit de vote des femmes
    droite:
    - id: x
      texte: Système de protection sociale créé en 1945-1946
    - id: y
      texte: Passage d'entreprises privées sous le contrôle de l'État
    - id: z
      texte: Accordé par ordonnance le 21 avril 1944
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'La Sécurité sociale protège les personnes (maladie, retraite) : cherche la définition qui en parle.'
    methode: Une nationalisation, c'est quand l'État prend le contrôle d'une entreprise. Cherche la définition qui correspond.
    etape: 'Le droit de vote des femmes est daté précisément dans le cours : associe-le à la définition qui donne cette date.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis bien la différence entre la Sécurité sociale (protection des personnes) et une nationalisation (contrôle d'une entreprise).
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, le droit de vote des femmes est daté du 21 avril 1944, puis distingue les deux autres réformes.
  solution: 'Sécurité sociale : système de protection sociale créé en 1945-1946. Nationalisations : passage d''entreprises privées sous le contrôle de l''État. Droit de vote des femmes : accordé par ordonnance le 21 avril 1944.'
- id: mot-refondation
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne la reconstruction des institutions et des valeurs démocratiques après la période de Vichy ?
  reponse:
    acceptees:
    - refondation
    - refondation republicaine
    fautes_tolerees: 1
  indices:
    relance: C'est le mot utilisé dans le titre même de cette notion du programme.
    methode: 'Ce mot commence par « re- » : il évoque l''idée de reconstruire quelque chose de démocratique.'
    etape: 'Complète : « refonda... » de la République.'
  pieges:
  - si:
      valeur: revolution
    relance: Il ne s'agit pas d'un changement brutal et violent comme une révolution, mais d'une reconstruction des institutions républicaines déjà existantes.
  solution: 'La refondation (républicaine) : la reconstruction des institutions et des valeurs démocratiques après la période de Vichy.'
- id: developpement-refondation
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre que la Libération est un moment de refondation démocratique et sociale de la République.'
  criteres:
  - L'élève situe le retour de la légalité républicaine après Vichy en 1944.
  - L'élève cite l'intégration politique des femmes (droit de vote en 1944, premier vote en 1945).
  - L'élève présente le programme du CNR comme un approfondissement social de la démocratie, avec un exemple (Sécurité sociale, nationalisations).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quels deux grands changements la Libération apporte-t-elle à la démocratie française ?
    methode: Présente d'abord l'intégration politique des femmes, puis les réformes sociales du programme du CNR.
    etape: Tu peux commencer ainsi « Après la Libération, la République française se reconstruit sur des bases plus démocratiques... », puis continuer avec le droit de vote des femmes.
  solution: 'Après la Libération, la République française se reconstruit sur des bases plus démocratiques et plus sociales. En 1944, la légalité républicaine est restaurée après le régime de Vichy. La République intègre politiquement les femmes : une ordonnance du 21 avril 1944 leur donne le droit de vote, qu''elles exercent pour la première fois en 1945. Le gouvernement applique aussi le programme du Conseil national de la Résistance, préparé dès 1943, qui prolonge le Front populaire de 1936 et crée notamment la Sécurité sociale. La Libération est donc bien un moment de refondation à la fois démocratique et sociale.'
- id: reformes-liberation
  type: choix
  difficulte: 2
  enonce: Parmi ces mesures, lesquelles font partie de la refondation républicaine et sociale de la Libération ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: La création de la Sécurité sociale
    - id: b
      texte: Des nationalisations d'entreprises
    - id: c
      texte: La suppression des élections
    - id: d
      texte: L'interdiction des syndicats
    bonnes:
    - a
    - b
  indices:
    relance: Cherche les mesures qui élargissent la démocratie et protègent les personnes.
    methode: La refondation rétablit les libertés et développe la protection sociale. Élimine les mesures qui limitent les libertés.
    etape: Deux propositions sont des réformes sociales ou économiques ; les deux autres rappellent le régime de Vichy.
  pieges:
  - si:
      contient:
      - c
    relance: Supprimer les élections, c'est ce qu'a fait le régime de Vichy. La Libération fait le contraire.
  - si:
      contient:
      - d
    relance: La Libération rétablit les syndicats et les libertés. Cette mesure ne convient pas.
  solution: La Sécurité sociale et les nationalisations font partie des réformes issues du programme du CNR. La suppression des élections et l'interdiction des syndicats sont des mesures autoritaires.
- id: mot-nationalisation
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le passage d'entreprises privées sous le contrôle de l'État ?
  reponse:
    acceptees:
    - nationalisation
    - nationalisations
    - une nationalisation
    fautes_tolerees: 1
  indices:
    relance: C'est une des réformes du programme du CNR.
    methode: Le mot est de la même famille que « nation ».
    etape: Le nom se termine par « -isation ».
  pieges:
  - si:
      valeur: privatisation
    relance: 'C''est l''inverse : la privatisation fait passer une entreprise de l''État à des propriétaires privés. Quel mot désigne le mouvement contraire ?'
  solution: 'La nationalisation : une entreprise privée passe sous le contrôle de l''État.'
