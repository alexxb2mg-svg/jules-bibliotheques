format: 2
notion: etapes-construction-europeenne
version: 2
etat: verifiee
declencheurs:
- CECA
- traité de Rome
- traité de Maastricht
- marché commun
- sortie du Royaume-Uni
- prix Nobel de la paix 2012
- six pays fondateurs
- déclaration Schuman
- programme Erasmus
- Europe des Six
prerequis: []
essentiel: 'Après la Seconde Guerre mondiale, l''Europe est ruinée et divisée par la guerre froide. Des responsables européens
  veulent éviter une nouvelle guerre, en particulier entre la France et l''Allemagne, et assurer la paix, la prospérité et
  un poids dans le monde. Ils choisissent de bâtir l''Europe par des réalisations concrètes.


  Étape 1, 1950-1951 : le ministre français Robert Schuman propose en 1950 de mettre en commun le charbon et l''acier. En
  1951, la Communauté européenne du charbon et de l''acier (CECA) est créée par six pays : la France, l''Allemagne de l''Ouest,
  l''Italie, la Belgique, les Pays-Bas et le Luxembourg.


  Étape 2, 1957 : les traités de Rome créent la Communauté économique européenne (CEE), fondée sur un marché commun, où les
  marchandises, les personnes et les capitaux circulent plus librement. La politique agricole commune (PAC) est un exemple
  de politique européenne née dans ce cadre.


  Étape 3, 1992 : le traité de Maastricht crée l''Union européenne (UE), qui prend la suite de la CEE et ajoute des domaines
  de coopération (politique, monnaie, citoyenneté européenne). L''euro circule depuis 2002 dans une partie des États membres.


  Autres réalisations : le programme Erasmus (échanges d''étudiants, 1987), l''espace Schengen (circulation sans contrôle
  aux frontières intérieures), le Parlement européen élu au suffrage universel depuis 1979.


  Élargissements : de 6 à 9 pays en 1973 (avec le Royaume-Uni), puis vers le sud, puis vers l''Est après la chute du mur de
  Berlin (1989), jusqu''à 28 membres. En 2020, le Royaume-Uni quitte l''UE (Brexit) : il reste 27 États membres. L''UE reçoit
  le prix Nobel de la paix en 2012.


  Enjeux actuels : place de l''Europe dans le monde, sécurité, climat, migrations.


  Ce qu''on attend au brevet : dater les trois étapes, citer des réalisations concrètes et expliquer le contexte (paix, guerre
  froide, réconciliation franco-allemande).'
methode:
- 'Situer le contexte : Europe ruinée et divisée après 1945, volonté de paix et de réconciliation franco-allemande.'
- 'Retenir trois dates-étapes : 1951 (CECA), 1957 (traités de Rome, CEE), 1992 (traité de Maastricht, UE).'
- Montrer que la construction part d'une coopération économique concrète avant de s'élargir à d'autres domaines.
- 'Citer des réalisations concrètes : marché commun, PAC, Erasmus, Schengen, euro (2002).'
- Suivre les élargissements (de 6 à 28 membres, puis 27 après le Brexit en 2020).
- Ne pas confondre CEE (1957) et UE (1992), deux étapes successives.
vocabulaire:
- terme: CECA
  definition: Communauté européenne du charbon et de l'acier, créée en 1951, première étape de la construction européenne
- terme: CEE
  definition: Communauté économique européenne, créée en 1957 par les traités de Rome autour d'un marché commun
- terme: marché commun
  definition: espace où les marchandises, les personnes et les capitaux circulent librement entre pays membres
- terme: traité de Maastricht
  definition: traité signé en 1992 qui crée l'Union européenne
- terme: euro
  definition: monnaie unique utilisée depuis 2002 par une partie des États membres de l'Union européenne
- terme: élargissement
  definition: arrivée de nouveaux pays dans l'Union européenne
- terme: Brexit
  definition: sortie du Royaume-Uni de l'Union européenne, effective en 2020
- terme: espace Schengen
  definition: espace où l'on circule sans contrôle aux frontières entre les pays qui y participent
erreurs_frequentes:
- 'Confondre CEE et UE : la CEE (1957) devient l''UE seulement en 1992, avec le traité de Maastricht.'
- 'Croire que tous les pays de l''UE utilisent l''euro : seule une partie des membres l''a adopté.'
- Oublier que la construction commence par une coopération économique concrète (charbon et acier).
- 'Se tromper sur le sens du Brexit : c''est une sortie de l''UE (Royaume-Uni, 2020), pas une adhésion.'
- Oublier le contexte de paix et de guerre froide qui explique la construction européenne.
exemple:
  enonce: Cite les trois grandes étapes de la construction européenne avec leurs dates.
  solution: '1951 : création de la CECA (charbon et acier, six pays fondateurs). 1957 : traités de Rome, création de la CEE
    (marché commun). 1992 : traité de Maastricht, création de l''Union européenne.'
exercices:
- id: annee-ceca
  type: nombre
  difficulte: 1
  enonce: En quelle année est créée la CECA, première étape de la construction européenne ?
  reponse:
    valeur: 1951
    forme: entier
  indices:
    relance: C'est la toute première étape, avant les traités de Rome et le traité de Maastricht.
    methode: Pars du traité de Rome (1957) et recule de quelques années pour trouver la date de la CECA.
    etape: La CECA est créée juste après la Seconde Guerre mondiale, au début des années 1950. Donne l'année exacte.
  pieges:
  - si:
      valeur: 1957
    relance: 1957, c'est l'année des traités de Rome qui créent la CEE. La CECA est-elle antérieure ou postérieure ?
  - si:
      valeur: 1992
    relance: 1992, c'est l'année du traité de Maastricht qui crée l'Union européenne. La CECA est bien plus ancienne.
  solution: La CECA (Communauté européenne du charbon et de l'acier) est créée en 1951.
- id: creation-ue
  type: choix
  difficulte: 1
  enonce: Quel événement crée l'Union européenne ?
  reponse:
    options:
    - id: a
      texte: Le traité de Maastricht (1992)
    - id: b
      texte: Les traités de Rome (1957)
    - id: c
      texte: La CECA (1951)
    - id: d
      texte: Le retrait du Royaume-Uni (2020)
    bonnes:
    - a
  indices:
    relance: Cherche le traité le plus récent parmi les propositions.
    methode: Les traités de Rome et la CECA créent des coopérations économiques plus anciennes et plus limitées.
    etape: L'Union européenne est créée en 1992 par un traité signé dans une ville des Pays-Bas.
  pieges:
  - si:
      contient:
      - b
    relance: Les traités de Rome créent la CEE en 1957, une étape antérieure. L'UE est créée par un traité plus récent.
  - si:
      contient:
      - c
    relance: La CECA (1951) ne concerne que le charbon et l'acier. Quel traité, bien plus tard, crée l'UE ?
  - si:
      contient:
      - d
    relance: Le retrait du Royaume-Uni est une sortie de l'UE, pas sa création. Cherche l'année où l'UE est fondée.
  solution: L'Union européenne est créée en 1992 par le traité de Maastricht, qui prend la suite de la CEE.
- id: chronologie-europe
  type: ordre
  difficulte: 2
  enonce: Range ces étapes de la construction européenne du plus ancien au plus récent.
  reponse:
    elements:
    - id: ceca
      texte: Création de la CECA
    - id: cee
      texte: Traités de Rome, création de la CEE
    - id: ue
      texte: Traité de Maastricht, création de l'UE
    - id: brexit
      texte: Sortie du Royaume-Uni de l'UE
  indices:
    relance: Quelle étape est la toute première ? Et laquelle est la plus récente ?
    methode: Place d'abord la CECA (début) et le Brexit (fin), puis range les deux traités entre eux.
    etape: La CECA date de 1951, les traités de Rome de 1957. Où se place le traité de Maastricht (1992) par rapport au Brexit
      (2020) ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux a eu lieu en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape la plus ancienne (CECA) et la plus récente (Brexit), puis place les deux autres.
  solution: CECA (1951), traités de Rome et CEE (1957), traité de Maastricht et UE (1992), sortie du Royaume-Uni (2020).
- id: dates-etapes
  type: association
  difficulte: 2
  enonce: Relie chaque étape de la construction européenne à son année.
  reponse:
    gauche:
    - id: a
      texte: Création de la CECA
    - id: b
      texte: Traités de Rome (CEE)
    - id: c
      texte: Traité de Maastricht (UE)
    - id: d
      texte: Début de la circulation de l'euro
    droite:
    - id: w
      texte: '1951'
    - id: x
      texte: '1957'
    - id: y
      texte: '1992'
    - id: z
      texte: '2002'
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: 'Deux dates sont proches (1951 et 1957) : places-les avec attention.'
    methode: L'euro circule dix ans après la création de l'UE. Sers-toi de ce repère pour la dernière paire.
    etape: 'La CECA est la première étape : associe-la à la date la plus ancienne, 1951.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie en particulier les deux dates les plus proches (1951 et 1957).
  - si:
      diagnostic: associations_fausses
    relance: Pars de la date la plus ancienne (1951, CECA) et de la plus récente (2002, euro), puis place les deux autres
      entre elles.
  solution: 'CECA : 1951. Traités de Rome (CEE) : 1957. Traité de Maastricht (UE) : 1992. Circulation de l''euro : 2002.'
- id: nom-monnaie-unique
  type: texte_court
  difficulte: 1
  enonce: Quelle monnaie unique circule depuis 2002 dans une partie des États membres de l'Union européenne ?
  reponse:
    acceptees:
    - euro
    fautes_tolerees: 1
  indices:
    relance: C'est une monnaie que tu utilises peut-être déjà, en France.
    methode: Cette monnaie a remplacé le franc en France, et d'autres monnaies nationales dans d'autres pays de l'UE.
    etape: Le nom de cette monnaie commence par « eur- ». Écris-le en entier.
  pieges:
  - si:
      valeur: franc
    relance: Le franc était la monnaie française avant 2002. Quelle monnaie l'a remplacé ?
  solution: L'euro, monnaie unique en circulation depuis 2002 dans une partie des États membres de l'Union européenne.
- id: nombre-etats-apres-brexit
  type: nombre
  difficulte: 2
  enonce: Combien d'États membres compte l'Union européenne après le retrait du Royaume-Uni (Brexit, 2020) ?
  reponse:
    valeur: 27
    forme: entier
  indices:
    relance: L'UE comptait 28 membres juste avant le Brexit. Que devient ce nombre après un retrait ?
    methode: Retire un État du nombre de membres d'avant le Brexit.
    etape: 'Avant 2020, l''UE comptait 28 membres. Le Royaume-Uni en sort : combien en reste-t-il ?'
  pieges:
  - si:
      valeur: 6
    relance: 6, c'est le nombre de pays fondateurs de la CECA en 1951. L'UE s'est élargie depuis, elle compte beaucoup plus
      de membres aujourd'hui.
  - si:
      valeur: 28
    relance: 28, c'est le nombre de membres avant le Brexit. Le Royaume-Uni est-il resté membre après son retrait ?
  solution: Après le retrait du Royaume-Uni en 2020 (Brexit), l'Union européenne compte 27 États membres.
- id: developpement-construction-europeenne
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre comment l''Union européenne s''est construite par étapes depuis 1951.'
  criteres:
  - L'élève cite les trois dates-clés (1951 CECA, 1957 CEE, 1992 UE).
  - L'élève relie la construction européenne à l'objectif de paix après la Seconde Guerre mondiale.
  - L'élève mentionne l'élargissement du nombre de membres (de 6 à 27 après le Brexit).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Par quelle coopération concrète, limitée au charbon et à l'acier, commence la construction européenne ?
    methode: Présente les trois dates-clés dans l'ordre, puis ajoute l'élargissement du nombre de membres.
    etape: Tu peux commencer ainsi « Après la Seconde Guerre mondiale, des pays européens choisissent de coopérer pour construire
      la paix... », puis continuer avec la CECA en 1951.
  solution: 'Après la Seconde Guerre mondiale, des pays européens choisissent de coopérer pour construire la paix et la prospérité.
    En 1951, six pays, dont la France et l''Allemagne, créent la CECA pour mettre en commun le charbon et l''acier. En 1957,
    les traités de Rome créent la CEE, fondée sur un marché commun. En 1992, le traité de Maastricht crée l''Union européenne,
    qui adopte une monnaie unique, l''euro, en 2002. L''Union s''est élargie de 6 à 27 États membres après le retrait du Royaume-Uni
    en 2020 : la construction européenne s''est donc faite par étapes successives.'
