  solution: 'FLN. C''est exact : le FLN (Front de libération nationale) est le mouvement qui a lutté pour l''indépendance
    de l''Algérie.'
- id: causes-decolonisation
  type: choix
  difficulte: 2
  enonce: Quelles sont des causes de la décolonisation après 1945 ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Les puissances européennes sortent affaiblies de la Seconde Guerre mondiale
    - id: b
      texte: Les mouvements nationalistes se renforcent dans les colonies
    - id: c
      texte: Toutes les puissances coloniales rendent volontairement leurs colonies dès 1945
    bonnes:
    - a
    - b
  indices:
    relance: Cherche ce qui affaiblit les colonisateurs et ce qui pousse les colonisés à réclamer leur liberté.
    methode: Une cause se vérifie par les faits du cours. Élimine l'affirmation qui contredit les guerres et les négociations
      difficiles.
    etape: Il y a deux bonnes réponses sur trois. Une seule affirmation est contredite par l'histoire des guerres d'Indochine
      et d'Algérie.
  pieges:
  - si:
      contient:
      - c
    relance: Plusieurs puissances coloniales résistent, parfois par la guerre (Indochine, Algérie). Elles ne rendent pas toutes
      leurs colonies volontairement.
  solution: 'Les puissances européennes sont affaiblies par la guerre et les mouvements nationalistes se renforcent. Les colonisateurs
    ne renoncent pas d''eux-mêmes : il y a des guerres (Indochine, Algérie).'
- id: dirigeant-inde
  type: texte_court
  difficulte: 2
  enonce: Quel dirigeant du mouvement nationaliste indien mène une lutte non violente pour l'indépendance de l'Inde ?
  reponse:
    acceptees:
    - Gandhi
    - Mahatma Gandhi
    fautes_tolerees: 1
  indices:
    relance: On l'appelle souvent « Mahatma », ce qui signifie « grande âme ».
    methode: Pense au grand nom de la lutte non violente en Inde, contre la domination britannique.
    etape: Son nom commence par « G » et compte six lettres.
  pieges:
  - si:
      valeur: Nehru
    relance: Nehru est un grand dirigeant indien, premier chef du gouvernement de l'Inde indépendante, mais ce n'est pas le
      symbole de la lutte non violente.
  solution: Gandhi (le Mahatma Gandhi) mène la lutte non violente qui conduit à l'indépendance de l'Inde en 1947.
