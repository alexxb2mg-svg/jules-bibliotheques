format: 2
notion: decolonisation-nouveaux-etats
version: 1
etat: verifiee
declencheurs:
- accords d'Évian
- indépendance de l'Inde
- Charte de l'Atlantique
- colonisateur
- mouvements nationalistes
- guerre d'Indochine
prerequis:
- deuxieme-guerre-mondiale-genocides
essentiel: 'La décolonisation est le processus par lequel les territoires colonisés par des puissances européennes accèdent
  à l''indépendance. Elle s''effectue rapidement après la Seconde Guerre mondiale : les pays d''Asie sont décolonisés entre
  1945 et 1955, puis les pays d''Afrique entre 1955 et 1975.


  Plusieurs facteurs l''expliquent : la défaite rapide des puissances coloniales européennes en 1940 a brisé le mythe de leur
  invincibilité ; les Alliés ont promis, dans la Charte de l''Atlantique (1941), le droit des peuples à choisir leur gouvernement
  ; les mouvements nationalistes se renforcent dans les colonies.


  La décolonisation prend des formes différentes selon les cas. Elle est parfois négociée et pacifique (indépendance de l''Inde
  et du Pakistan en 1947, indépendances des colonies françaises d''Afrique subsaharienne en 1960). Elle est parfois violente
  : la guerre d''Indochine (1946-1954) et la guerre d''Algérie (1954-1962) opposent la France à des mouvements indépendantistes,
  comme le FLN en Algérie, jusqu''aux accords d''Évian qui donnent l''indépendance à l''Algérie en 1962.'
methode:
- 'Situer la décolonisation dans le temps : surtout entre 1945 et 1975, en distinguant l''Asie (plus précoce) de l''Afrique.'
- Choisir UN exemple précis à étudier en détail (l'Algérie ou l'Inde, par exemple) et savoir en donner les dates et les acteurs.
- Distinguer décolonisation négociée (accord entre colonisateur et colonisés) et décolonisation violente (guerre).
- 'Relier la décolonisation au contexte de l''après-guerre : affaiblissement des puissances coloniales, montée des nationalismes.'
vocabulaire:
- terme: décolonisation
  definition: le processus par lequel un territoire colonisé devient un État indépendant
- terme: FLN
  definition: Front de libération nationale, mouvement indépendantiste algérien qui mène la guerre contre la France de 1954
    à 1962
- terme: empire colonial
  definition: l'ensemble des territoires colonisés et administrés par une puissance européenne
erreurs_frequentes:
- 'Croire que toutes les indépendances se font par la guerre : beaucoup sont négociées.'
- 'Confondre la guerre d''Indochine (1946-1954) et la guerre d''Algérie (1954-1962) : deux conflits distincts, à des dates
  différentes.'
- Oublier de dater précisément l'exemple choisi.
- 'Réduire la décolonisation à un seul continent : elle touche l''Asie puis l''Afrique.'
exemple:
  enonce: Donne un exemple de décolonisation négociée et un exemple de décolonisation violente.
  solution: 'Négociée : l''indépendance de l''Inde et du Pakistan en 1947, obtenue par la négociation avec le Royaume-Uni.
    Violente : la guerre d''Algérie (1954-1962), qui oppose la France au FLN indépendantiste avant l''indépendance de l''Algérie.'
exercices:
- id: annee-independance-algerie
  type: nombre
  difficulte: 1
  enonce: En quelle année l'Algérie obtient-elle son indépendance, après les accords d'Évian ?
  reponse:
    valeur: 1962
    forme: entier
  indices:
    relance: La guerre d'Algérie commence en 1954 et dure huit ans.
    methode: Ajoute huit ans à 1954, année du début de la guerre d'Algérie, pour trouver l'année de l'indépendance.
    etape: Les accords d'Évian, signés au début de cette année-là, mettent fin à la guerre et ouvrent la voie à l'indépendance.
  pieges:
  - si:
      valeur: 1954
    relance: 1954 est l'année du début de la guerre d'Algérie, pas celle de son indépendance.
  - si:
      valeur: 1947
    relance: 1947 est l'année de l'indépendance de l'Inde et du Pakistan, pas celle de l'Algérie.
  solution: L'Algérie obtient son indépendance en 1962, après les accords d'Évian qui mettent fin à la guerre.
- id: mouvement-independantiste-algerien
  type: choix
  difficulte: 1
  enonce: Quel mouvement indépendantiste mène la guerre contre la France en Algérie de 1954 à 1962 ?
  reponse:
    options:
    - id: a
      texte: Le FLN (Front de libération nationale)
    - id: b
      texte: Le Conseil national de la Résistance
    - id: c
      texte: Le Front populaire
    - id: d
      texte: Le parti nazi
    bonnes:
    - a
  indices:
    relance: Ce mouvement porte un sigle de trois lettres, différent du CNR étudié pour la Résistance française.
    methode: Élimine les mouvements liés à d'autres périodes ou à d'autres pays (France occupée, Allemagne nazie).
    etape: Le sigle cherché commence par un F, comme « Front », mais ce n'est pas le Front populaire des années 1930.
  pieges:
  - si:
      contient:
      - b
    relance: Le Conseil national de la Résistance agit en France pendant l'Occupation, pas en Algérie dans les années 1950-1960.
  - si:
      contient:
      - c
    relance: Le Front populaire est une coalition française des années 1930, sans lien avec l'indépendance algérienne.
  - si:
      contient:
      - d
    relance: Le parti nazi est un parti allemand des années 1930-1940, pas un mouvement indépendantiste algérien.
  solution: Le FLN (Front de libération nationale) mène la guerre d'indépendance algérienne contre la France de 1954 à 1962.
- id: continent-decolonise-precoce
  type: texte_court
  difficulte: 1
  enonce: Quel continent est décolonisé en premier après la Seconde Guerre mondiale, entre 1945 et 1955 ?
  reponse:
    acceptees:
    - asie
    fautes_tolerees: 1
  indices:
    relance: L'Inde et le Pakistan, décolonisés dès 1947, se trouvent sur ce continent.
    methode: Repère la date de l'indépendance de l'Inde (1947) et situe ce pays sur la carte du monde.
    etape: Ce continent est décolonisé environ dix ans avant l'Afrique.
  pieges:
  - si:
      valeur: afrique
    relance: L'Afrique est décolonisée plus tard, surtout entre 1955 et 1975. Quel continent l'est en premier ?
  solution: L'Asie est décolonisée en premier, entre 1945 et 1955 (l'Afrique l'est ensuite, entre 1955 et 1975).
- id: chronologie-decolonisation
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: charte-atlantique
      texte: Les Alliés signent la Charte de l'Atlantique
    - id: independance-inde
      texte: L'Inde et le Pakistan deviennent indépendants
    - id: debut-guerre-algerie
      texte: La guerre d'Algérie commence
    - id: accords-evian
      texte: Les accords d'Évian donnent l'indépendance à l'Algérie
  indices:
    relance: La Charte de l'Atlantique est signée pendant la Seconde Guerre mondiale, avant toutes les indépendances.
    methode: Place d'abord la Charte de l'Atlantique (1941), puis l'indépendance de l'Inde (1947), puis les deux dates de
      la guerre d'Algérie.
    etape: La guerre d'Algérie commence en 1954 et se termine par les accords d'Évian en 1962.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux événements voisins sont inversés. Lequel des deux marque le début de la guerre d''Algérie, avant
      les accords qui y mettent fin ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus ancien, pendant la guerre mondiale, puis range les trois autres par ordre
      chronologique.
  solution: Charte de l'Atlantique (1941), indépendance de l'Inde et du Pakistan (1947), début de la guerre d'Algérie (1954),
    accords d'Évian (1962).
- id: modalites-independance
  type: association
  difficulte: 2
  enonce: Relie chaque pays ou territoire à la façon dont il accède à l'indépendance.
  reponse:
    gauche:
    - id: a
      texte: Inde et Pakistan
    - id: b
      texte: Colonies françaises d'Afrique subsaharienne
    - id: c
      texte: Algérie
    - id: d
      texte: Indochine
    droite:
    - id: x
      texte: Indépendance négociée avec le Royaume-Uni (1947)
    - id: y
      texte: Indépendances négociées avec la France (1960)
    - id: z
      texte: Indépendance obtenue après une guerre contre la France (1954-1962)
    - id: t
      texte: Indépendance obtenue après une guerre contre la France (1946-1954)
    paires:
      a: x
      b: y
      c: z
      d: t
  indices:
    relance: Deux décolonisations sont négociées et pacifiques, deux autres sont marquées par une guerre contre la France.
    methode: Associe d'abord l'Inde et le Pakistan au Royaume-Uni, puis les colonies françaises d'Afrique subsaharienne à
      une indépendance négociée en 1960.
    etape: L'Algérie (1954-1962) et l'Indochine (1946-1954) sont les deux décolonisations violentes contre la France, mais
      à des dates différentes.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout que tu n'as pas inversé les dates des deux guerres contre la
      France.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : l''Inde et le Pakistan négocient leur indépendance avec le Royaume-Uni en 1947. Place
      les trois autres par rapport à ce repère.'
  solution: 'Inde et Pakistan : indépendance négociée avec le Royaume-Uni (1947). Colonies françaises d''Afrique subsaharienne
    : indépendances négociées avec la France (1960). Algérie : indépendance après une guerre contre la France (1954-1962).
    Indochine : indépendance après une guerre contre la France (1946-1954).'
- id: developpement-decolonisation-algerie
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : étudie les modalités d''accès à l''indépendance de l''Algérie.'
  criteres:
  - L'élève situe la guerre d'Algérie dans le temps (1954-1962).
  - L'élève identifie les deux camps (armée française contre le FLN indépendantiste).
  - L'élève qualifie ce conflit de violent (attentats, répression).
  - L'élève conclut sur l'indépendance obtenue en 1962, après les accords d'Évian, avec une phrase d'introduction et une phrase
    de conclusion.
  indices:
    relance: Quelles sont les dates de la guerre, et qui sont les deux camps ?
    methode: Situe d'abord les dates de la guerre (1954-1962), puis les deux camps, puis conclus sur l'indépendance obtenue.
    etape: Tu peux commencer ainsi « De 1954 à 1962, l'Algérie accède à l'indépendance après une guerre contre la France...
      ».
  solution: Un développement réussi doit situer la guerre d'Algérie de 1954 à 1962, qui oppose l'armée française aux indépendantistes
    du FLN ; rappeler que ce conflit est violent, marqué par des attentats et une répression dure ; conclure sur l'indépendance
    obtenue en 1962, après les accords d'Évian.
