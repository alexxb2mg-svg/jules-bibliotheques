format: 2
notion: vichy-collaboration-resistance
version: 2
etat: generee
declencheurs:
- maréchal Pétain
- zone occupée
- Conseil national de la Résistance
- Travail Famille Patrie
- gouvernement de Vichy
- Pierre Laval
- défaite de 1940
- statut des Juifs
- appel du 18 juin
- Jean Moulin
prerequis:
- deuxieme-guerre-mondiale-genocides
essentiel: |-
  En mai-juin 1940, l'armée française est vaincue en quelques semaines par l'Allemagne nazie. C'est le choc de la défaite. Le 17 juin, le maréchal Pétain annonce qu'il faut cesser le combat. Il signe l'armistice le 22 juin 1940.

  La France est coupée en deux : une zone occupée au nord et sur la côte atlantique, et une « zone libre » au sud, qui n'est pas occupée par l'armée allemande. En novembre 1942, l'Allemagne occupe aussi la zone sud.

  Le gouvernement s'installe à Vichy. Le 10 juillet 1940, les parlementaires votent les pleins pouvoirs à Pétain. Il devient « chef de l'État français » : c'est le régime de Vichy. Ce régime est autoritaire et nie les valeurs de la République : plus d'élections, fin des libertés, devise « Travail, Famille, Patrie » à la place de « Liberté, Égalité, Fraternité ». Dès octobre 1940, il prend des mesures d'exclusion contre les Juifs (statut des Juifs). Le régime choisit la collaboration avec l'Allemagne nazie : la poignée de main de Pétain et Hitler à Montoire, en octobre 1940, en est le symbole. Pierre Laval est l'un des principaux artisans de cette collaboration d'État.

  Face à cela, des Français résistent. Le 18 juin 1940, le général de Gaulle lance depuis Londres un appel à continuer le combat : c'est le début de la France libre. En France, une Résistance intérieure se développe : résistance civile (presse clandestine, faux papiers, aide aux personnes cachées) et résistance militaire (sabotages, maquis). En 1943, Jean Moulin unifie les principaux mouvements au sein du Conseil national de la Résistance (CNR), qui reconnaît de Gaulle comme chef de la Résistance.

  En Europe, l'occupation nazie provoque aussi des résistances (Pologne, Yougoslavie, Norvège, Italie...) et, dans certains pays, des régimes ou des personnes qui collaborent. Les Français, dans leur majorité, ne sont ni collaborateurs actifs ni résistants avant 1943 : beaucoup attendent.

  Ce qu'on attend au brevet : dater la défaite, l'armistice et l'appel du 18 juin, distinguer Vichy, la France libre et la Résistance intérieure, et expliquer que la Résistance combat l'occupant et le régime de Vichy.
methode:
- Situer la défaite de juin 1940, l'armistice du 22 juin et la coupure en zone occupée et zone libre.
- 'Distinguer trois réalités : le régime de Vichy (collaboration), la Résistance intérieure et la France libre de de Gaulle.'
- 'Retenir les dates : appel du 18 juin 1940, armistice du 22 juin 1940, 1942 (zone sud occupée), 1943 (CNR), 1944 (Libération).'
- Montrer que la Résistance combat à la fois l'occupant nazi et le régime de Vichy, négateur des valeurs républicaines.
- 'Décrire les formes de la Résistance : civile (presse, faux papiers, aide) et militaire (sabotages, maquis).'
- Ne pas confondre « occupation » (fait militaire subi) et « collaboration » (choix politique de Vichy).
vocabulaire:
- terme: armistice
  definition: accord qui arrête les combats entre deux armées, sans être un traité de paix
- terme: régime de Vichy
  definition: régime autoritaire dirigé par Pétain de 1940 à 1944, qui collabore avec l'Allemagne nazie
- terme: collaboration
  definition: politique du régime de Vichy qui choisit de coopérer avec l'Allemagne nazie occupante
- terme: Résistance
  definition: ensemble des Français qui refusent l'occupation et le régime de Vichy et luttent pour libérer la France
- terme: France libre
  definition: mouvement fondé par le général de Gaulle depuis Londres à partir du 18 juin 1940 pour continuer le combat
- terme: zone libre
  definition: zone sud de la France, non occupée par l'armée allemande jusqu'en novembre 1942, mais dirigée par Vichy
- terme: maquis
  definition: groupe de résistants armés qui se cachent dans des zones isolées
- terme: CNR
  definition: Conseil national de la Résistance, fondé en 1943, qui unifie la Résistance intérieure
erreurs_frequentes:
- 'Confondre zone occupée et zone libre : la zone libre reste sous l''autorité de Vichy et n''est occupée qu''en novembre 1942.'
- 'Croire que tous les Français résistent ou collaborent : beaucoup attendent ou s''adaptent.'
- Oublier que le régime de Vichy prend des mesures antisémites dès 1940, de sa propre initiative.
- 'Situer l''appel du 18 juin après l''armistice : il est lancé quatre jours avant sa signature, le 22 juin.'
- Confondre la France libre (de Gaulle, à Londres) et la Résistance intérieure (en France).
exemple:
  enonce: Explique pourquoi la Résistance combat à la fois l'occupant allemand et le régime de Vichy.
  solution: La Résistance refuse l'occupation du territoire par l'Allemagne nazie, mais aussi la soumission du régime de Vichy, qui collabore avec l'occupant et rejette les valeurs républicaines (suppression des élections, exclusion des Juifs). Résister, c'est donc lutter sur ces deux fronts à la fois.
exercices:
- id: annee-armistice
  type: nombre
  difficulte: 1
  enonce: En quelle année le maréchal Pétain signe-t-il l'armistice avec l'Allemagne nazie ?
  reponse:
    valeur: 1940
    forme: entier
  indices:
    relance: Cet armistice suit de peu la défaite militaire de la France face à l'Allemagne.
    methode: Cherche l'année de la défaite rapide de la France, au tout début de la Seconde Guerre mondiale.
    etape: La guerre a commencé en 1939 ; l'armistice est signé l'année suivante, en juin.
  pieges:
  - si:
      valeur: 1944
    relance: 1944, c'est l'année de la Libération, pas celle de l'armistice qui installe le régime de Vichy.
  - si:
      valeur: 1939
    relance: 1939 est l'année du début de la guerre. L'armistice est signé l'année suivante.
  solution: Le maréchal Pétain signe l'armistice avec l'Allemagne nazie le 22 juin 1940.
- id: auteur-appel-18-juin
  type: choix
  difficulte: 1
  enonce: Qui lance l'appel du 18 juin 1940 depuis Londres ?
  reponse:
    options:
    - id: a
      texte: Le général de Gaulle
    - id: b
      texte: Le maréchal Pétain
    - id: c
      texte: Pierre Laval
    - id: d
      texte: Jean Moulin
    bonnes:
    - a
  indices:
    relance: Cette personne refuse la défaite et fonde la France libre depuis le Royaume-Uni.
    methode: Élimine les personnages qui restent en France et soutiennent le régime de Vichy.
    etape: C'est un général qui deviendra plus tard, en 1958, le premier président de la Ve République.
  pieges:
  - si:
      contient:
      - b
    relance: Pétain reste en France et signe l'armistice ; ce n'est pas lui qui appelle à continuer le combat depuis Londres.
  - si:
      contient:
      - c
    relance: Pierre Laval pousse à la collaboration avec l'Allemagne, il ne part pas à Londres.
  - si:
      contient:
      - d
    relance: Jean Moulin joue un rôle important, mais plus tard, en unifiant la Résistance intérieure en 1943.
  solution: Le général de Gaulle lance l'appel du 18 juin 1940 depuis Londres et fonde la France libre.
- id: mot-cnr
  type: texte_court
  difficulte: 2
  enonce: Quel sigle désigne l'organisme fondé par Jean Moulin en 1943 pour unifier les mouvements de résistance ?
  reponse:
    acceptees:
    - cnr
    - conseil national de la resistance
    fautes_tolerees: 1
  indices:
    relance: C'est un sigle de trois lettres.
    methode: 'Relis ta leçon : Jean Moulin réunit les principaux mouvements de résistance au sein d''un conseil, en 1943.'
    etape: Ce conseil porte le mot « national » dans son nom, car il réunit toute la Résistance intérieure française.
  pieges:
  - si:
      valeur: france libre
    relance: La France libre est le mouvement fondé par de Gaulle à Londres dès 1940 ; le sigle cherché désigne l'organisme créé en France en 1943.
  solution: Le CNR, Conseil national de la Résistance, est fondé par Jean Moulin en 1943 et reconnaît de Gaulle comme chef de la Résistance.
- id: chronologie-occupation
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: appel-18-juin
      texte: Le général de Gaulle lance l'appel du 18 juin
    - id: armistice
      texte: Le maréchal Pétain signe l'armistice
    - id: creation-cnr
      texte: Jean Moulin fonde le Conseil national de la Résistance
    - id: fin-vichy
      texte: Le régime de Vichy prend fin
  indices:
    relance: L'appel du 18 juin précède de quelques jours seulement l'armistice. Lequel des deux vient en premier ?
    methode: Place d'abord l'appel et l'armistice, tous deux en juin 1940, puis la fondation du CNR en 1943, puis la fin du régime en 1944.
    etape: L'appel est lancé le 18 juin, l'armistice est signé le 22 juin de la même année 1940.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux événements voisins de juin 1940 sont inversés. Lequel des deux est lancé le premier, quelques jours avant l''autre ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord les deux événements de juin 1940, puis place la fondation du CNR (1943) et la fin du régime de Vichy (1944).
  solution: Appel du 18 juin 1940, armistice du 22 juin 1940, fondation du CNR par Jean Moulin (1943), fin du régime de Vichy (20 août 1944).
- id: acteurs-camps
  type: association
  difficulte: 2
  enonce: Relie chaque personnage à son rôle entre 1940 et 1944.
  reponse:
    gauche:
    - id: a
      texte: Maréchal Pétain
    - id: b
      texte: Général de Gaulle
    - id: c
      texte: Pierre Laval
    - id: d
      texte: Jean Moulin
    droite:
    - id: w
      texte: Chef de l'État français, signe l'armistice
    - id: x
      texte: Fonde la France libre depuis Londres
    - id: y
      texte: Pousse à la collaboration d'État avec l'Allemagne
    - id: z
      texte: Unifie la Résistance intérieure en 1943
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Deux de ces personnages restent en France et soutiennent Vichy, deux autres résistent.
    methode: Commence par Pétain, chef de l'État français, puis de Gaulle, qui part à Londres.
    etape: Pierre Laval est un dirigeant de Vichy qui pousse à la collaboration ; Jean Moulin, lui, unifie la Résistance en 1943.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout que tu n'as pas inversé les deux dirigeants de Vichy.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : de Gaulle fonde la France libre depuis Londres. Place les trois autres personnages par rapport à lui.'
  solution: 'Pétain : chef de l''État français, signe l''armistice. De Gaulle : fonde la France libre depuis Londres. Laval : pousse à la collaboration d''État. Jean Moulin : unifie la Résistance intérieure en 1943 (CNR).'
- id: developpement-jean-moulin
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : présente le rôle de Jean Moulin dans l''organisation de la Résistance.'
  criteres:
  - L'élève situe Jean Moulin comme un résistant envoyé par de Gaulle pour unifier la Résistance intérieure.
  - L'élève explique qu'il fonde en 1943 le Conseil national de la Résistance (CNR).
  - L'élève précise que le CNR reconnaît de Gaulle comme chef de la Résistance.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Que crée Jean Moulin en 1943, et pourquoi cela renforce-t-il la Résistance ?
    methode: Explique d'abord la mission de Jean Moulin, puis ce qu'il crée en 1943, puis le chef que cet organisme reconnaît.
    etape: Tu peux commencer ainsi « Jean Moulin est un résistant chargé par de Gaulle d'unifier la Résistance intérieure... ».
  solution: Un développement réussi doit situer Jean Moulin comme un résistant envoyé par de Gaulle pour unifier les mouvements de résistance intérieure ; expliquer qu'il fonde en 1943 le Conseil national de la Résistance (CNR), qui regroupe résistants, partis politiques et syndicats ; préciser que le CNR reconnaît de Gaulle comme chef de la Résistance, renforçant sa légitimité face aux Alliés.
- id: annee-occupation-zone-libre
  type: nombre
  difficulte: 2
  enonce: En quelle année l'armée allemande occupe-t-elle aussi la zone libre, au sud de la France ?
  reponse:
    valeur: 1942
    forme: entier
  indices:
    relance: C'est après l'armistice et avant la Libération.
    methode: Cela se produit en novembre, quelques jours après le débarquement allié en Afrique du Nord.
    etape: Cette année est celle du milieu de l'Occupation. Donne l'année.
  pieges:
  - si:
      valeur: 1940
    relance: 1940 est l'année de l'armistice, qui crée la zone libre. L'occupation de cette zone vient plus tard.
  - si:
      valeur: 1944
    relance: 1944 est l'année de la Libération. L'occupation de la zone libre est antérieure.
  solution: L'armée allemande occupe aussi la zone libre en novembre 1942.
- id: mesures-vichy
  type: choix
  difficulte: 2
  enonce: Quelles mesures sont prises par le régime de Vichy ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: Suppression des élections
    - id: b
      texte: Statut des Juifs en octobre 1940
    - id: c
      texte: Rétablissement du suffrage universel
    - id: d
      texte: Devise « Liberté, Égalité, Fraternité » remise à l'honneur
    bonnes:
    - a
    - b
  indices:
    relance: Le régime de Vichy nie les valeurs de la République.
    methode: Cherche les mesures qui limitent les libertés et excluent une partie de la population.
    etape: 'Deux propositions correspondent à des valeurs républicaines : ce sont celles que Vichy rejette.'
  pieges:
  - si:
      contient:
      - c
    relance: Le suffrage universel est un principe républicain. Vichy supprime les élections.
  - si:
      contient:
      - d
    relance: Vichy remplace cette devise républicaine par « Travail, Famille, Patrie ».
  solution: Vichy supprime les élections et exclut les Juifs (statut d'octobre 1940). Il rejette la devise républicaine.
