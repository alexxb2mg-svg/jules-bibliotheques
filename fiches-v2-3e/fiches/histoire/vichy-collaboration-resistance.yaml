# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: vichy-collaboration-resistance
version: 3
etat: verifiee
declencheurs:
- maréchal Pétain
- zone occupée
- Conseil national de la Résistance
- Travail Famille Patrie
- gouvernement de Vichy
- Pierre Laval
- défaite de 1940
- statut des Juifs
- appel du 18 juin
- Jean Moulin
prerequis:
- deuxieme-guerre-mondiale-genocides
essentiel: 'En mai-juin 1940, l''armée française est vaincue en quelques semaines par l''Allemagne nazie. C''est le choc de
  la défaite. Le 17 juin, le maréchal Pétain annonce qu''il faut cesser le combat. Il signe l''armistice le 22 juin 1940.


  La France est coupée en deux : une zone occupée au nord et sur la côte atlantique, et une « zone libre » au sud, qui n''est
  pas occupée par l''armée allemande. En novembre 1942, l''Allemagne occupe aussi la zone sud.


  Le gouvernement s''installe à Vichy. Le 10 juillet 1940, les parlementaires votent les pleins pouvoirs à Pétain. Il devient
  « chef de l''État français » : c''est le régime de Vichy. Ce régime est autoritaire et nie les valeurs de la République
  : plus d''élections, fin des libertés, devise « Travail, Famille, Patrie » à la place de « Liberté, Égalité, Fraternité
  ». Dès octobre 1940, il prend des mesures d''exclusion contre les Juifs (statut des Juifs). Le régime choisit la collaboration
  avec l''Allemagne nazie : la poignée de main de Pétain et Hitler à Montoire, en octobre 1940, en est le symbole. Pierre
  Laval est l''un des principaux artisans de cette collaboration d''État.


  Face à cela, des Français résistent. Le 18 juin 1940, le général de Gaulle lance depuis Londres un appel à continuer le
  combat : c''est le début de la France libre. En France, une Résistance intérieure se développe : résistance civile (presse
  clandestine, faux papiers, aide aux personnes cachées) et résistance militaire (sabotages, maquis). En 1943, Jean Moulin
  unifie les principaux mouvements au sein du Conseil national de la Résistance (CNR), qui reconnaît de Gaulle comme chef
  de la Résistance.


  En Europe, l''occupation nazie provoque aussi des résistances (Pologne, Yougoslavie, Norvège, Italie...) et, dans certains
  pays, des régimes ou des personnes qui collaborent. Les Français, dans leur majorité, ne sont ni collaborateurs actifs ni
  résistants avant 1943 : beaucoup attendent.


  Ce qu''on attend au brevet : dater la défaite, l''armistice et l''appel du 18 juin, distinguer Vichy, la France libre et
  la Résistance intérieure, et expliquer que la Résistance combat l''occupant et le régime de Vichy.'
methode:
- Situer la défaite de juin 1940, l'armistice du 22 juin et la coupure en zone occupée et zone libre.
- 'Distinguer trois réalités : le régime de Vichy (collaboration), la Résistance intérieure et la France libre de de Gaulle.'
- 'Retenir les dates : appel du 18 juin 1940, armistice du 22 juin 1940, 1942 (zone sud occupée), 1943 (CNR), 1944 (Libération).'
- Montrer que la Résistance combat à la fois l'occupant nazi et le régime de Vichy, négateur des valeurs républicaines.
- 'Décrire les formes de la Résistance : civile (presse, faux papiers, aide) et militaire (sabotages, maquis).'
- Ne pas confondre « occupation » (fait militaire subi) et « collaboration » (choix politique de Vichy).
vocabulaire:
- terme: armistice
  definition: accord qui arrête les combats entre deux armées, sans être un traité de paix
- terme: régime de Vichy
  definition: régime autoritaire dirigé par Pétain de 1940 à 1944, qui collabore avec l'Allemagne nazie
- terme: collaboration
  definition: politique du régime de Vichy qui choisit de coopérer avec l'Allemagne nazie occupante
- terme: Résistance
  definition: ensemble des Français qui refusent l'occupation et le régime de Vichy et luttent pour libérer la France
- terme: France libre
  definition: mouvement fondé par le général de Gaulle depuis Londres à partir du 18 juin 1940 pour continuer le combat
- terme: zone libre
  definition: zone sud de la France, non occupée par l'armée allemande jusqu'en novembre 1942, mais dirigée par Vichy
- terme: maquis
  definition: groupe de résistants armés qui se cachent dans des zones isolées
- terme: CNR
  definition: Conseil national de la Résistance, fondé en 1943, qui unifie la Résistance intérieure
erreurs_frequentes:
- 'Confondre zone occupée et zone libre : la zone libre reste sous l''autorité de Vichy et n''est occupée qu''en novembre
  1942.'
- 'Croire que tous les Français résistent ou collaborent : beaucoup attendent ou s''adaptent.'
- Oublier que le régime de Vichy prend des mesures antisémites dès 1940, de sa propre initiative.
- 'Situer l''appel du 18 juin après l''armistice : il est lancé quatre jours avant sa signature, le 22 juin.'
- Confondre la France libre (de Gaulle, à Londres) et la Résistance intérieure (en France).
exemple:
  enonce: Explique pourquoi la Résistance combat à la fois l'occupant allemand et le régime de Vichy.
  solution: La Résistance refuse l'occupation du territoire par l'Allemagne nazie, mais aussi la soumission du régime de Vichy,
    qui collabore avec l'occupant et rejette les valeurs républicaines (suppression des élections, exclusion des Juifs). Résister,
    c'est donc lutter sur ces deux fronts à la fois.
exercices:
- id: annee-armistice
  type: nombre
  difficulte: 1
  enonce: En quelle année le maréchal Pétain signe-t-il l'armistice avec l'Allemagne nazie ?
  reponse:
    valeur: 1940
    forme: entier
  indices:
    relance: Cet armistice suit de peu la défaite militaire de la France face à l'Allemagne.
    methode: Cherche l'année de la défaite rapide de la France, au tout début de la Seconde Guerre mondiale.
    etape: La guerre a commencé en 1939 ; l'armistice est signé l'année suivante, en juin.
  pieges:
  - si:
      valeur: 1944
    relance: 1944, c'est l'année de la Libération, pas celle de l'armistice qui installe le régime de Vichy.
  - si:
      valeur: 1939
    relance: 1939 est l'année du début de la guerre. L'armistice est signé l'année suivante.
  solution: Le maréchal Pétain signe l'armistice avec l'Allemagne nazie le 22 juin 1940.
- id: auteur-appel-18-juin
  type: choix
  difficulte: 1
  enonce: Qui lance l'appel du 18 juin 1940 depuis Londres ?
  reponse:
    options:
    - id: a
      texte: Le général de Gaulle
    - id: b
      texte: Le maréchal Pétain
    - id: c
      texte: Pierre Laval
    - id: d
      texte: Jean Moulin
    bonnes:
    - a
  indices:
    relance: Cette personne refuse la défaite et fonde la France libre depuis le Royaume-Uni.
    methode: Élimine les personnages qui restent en France et soutiennent le régime de Vichy.
    etape: C'est un général qui deviendra plus tard, en 1958, le premier président de la Ve République.
  pieges:
  - si:
      contient:
      - b
    relance: Pétain reste en France et signe l'armistice ; ce n'est pas lui qui appelle à continuer le combat depuis Londres.
  - si:
      contient:
      - c
    relance: Pierre Laval pousse à la collaboration avec l'Allemagne, il ne part pas à Londres.
  - si:
      contient:
      - d
    relance: Jean Moulin joue un rôle important, mais plus tard, en unifiant la Résistance intérieure en 1943.
  solution: Le général de Gaulle lance l'appel du 18 juin 1940 depuis Londres et fonde la France libre.
- id: mot-cnr
  type: texte_court
  difficulte: 2
  enonce: Quel sigle désigne l'organisme fondé par Jean Moulin en 1943 pour unifier les mouvements de résistance ?
  reponse:
    acceptees:
    - cnr
    - conseil national de la resistance
    fautes_tolerees: 1
  indices:
    relance: C'est un sigle de trois lettres.
    methode: 'Relis ta leçon : Jean Moulin réunit les principaux mouvements de résistance au sein d''un conseil, en 1943.'
    etape: Ce conseil porte le mot « national » dans son nom, car il réunit toute la Résistance intérieure française.
  pieges:
  - si:
      valeur: france libre
    relance: La France libre est le mouvement fondé par de Gaulle à Londres dès 1940 ; le sigle cherché désigne l'organisme
      créé en France en 1943.
  solution: Le CNR, Conseil national de la Résistance, est fondé par Jean Moulin en 1943 et reconnaît de Gaulle comme chef
    de la Résistance.
- id: chronologie-occupation
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: appel-18-juin
      texte: Le général de Gaulle lance l'appel du 18 juin
    - id: armistice
      texte: Le maréchal Pétain signe l'armistice
    - id: creation-cnr
      texte: Jean Moulin fonde le Conseil national de la Résistance
    - id: fin-vichy
      texte: Le régime de Vichy prend fin
  indices:
    relance: L'appel du 18 juin précède de quelques jours seulement l'armistice. Lequel des deux vient en premier ?
    methode: Place d'abord l'appel et l'armistice, tous deux en juin 1940, puis la fondation du CNR en 1943, puis la fin du
      régime en 1944.
    etape: L'appel est lancé le 18 juin, l'armistice est signé le 22 juin de la même année 1940.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux événements voisins de juin 1940 sont inversés. Lequel des deux est lancé le premier, quelques
      jours avant l''autre ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord les deux événements de juin 1940, puis place la fondation du CNR (1943) et la fin du régime de
      Vichy (1944).
  solution: Appel du 18 juin 1940, armistice du 22 juin 1940, fondation du CNR par Jean Moulin (1943), fin du régime de Vichy
    (20 août 1944).
- id: acteurs-camps
  type: association
  difficulte: 2
  enonce: Relie chaque personnage à son rôle entre 1940 et 1944.
  reponse:
    gauche:
    - id: a
      texte: Maréchal Pétain
    - id: b
      texte: Général de Gaulle
    - id: c
      texte: Pierre Laval
    - id: d
      texte: Jean Moulin
    droite:
    - id: w
      texte: Chef de l'État français, signe l'armistice
    - id: x
      texte: Fonde la France libre depuis Londres
    - id: y
      texte: Pousse à la collaboration d'État avec l'Allemagne
    - id: z
      texte: Unifie la Résistance intérieure en 1943
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Deux de ces personnages restent en France et soutiennent Vichy, deux autres résistent.
    methode: Commence par Pétain, chef de l'État français, puis de Gaulle, qui part à Londres.
    etape: Pierre Laval est un dirigeant de Vichy qui pousse à la collaboration ; Jean Moulin, lui, unifie la Résistance en
      1943.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout que tu n'as pas inversé les deux dirigeants de Vichy.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : de Gaulle fonde la France libre depuis Londres. Place les trois autres personnages par
      rapport à lui.'
  solution: 'Pétain : chef de l''État français, signe l''armistice. De Gaulle : fonde la France libre depuis Londres. Laval
    : pousse à la collaboration d''État. Jean Moulin : unifie la Résistance intérieure en 1943 (CNR).'
- id: developpement-jean-moulin
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : présente le rôle de Jean Moulin dans l''organisation de la Résistance.'
  criteres:
  - L'élève situe Jean Moulin comme un résistant envoyé par de Gaulle pour unifier la Résistance intérieure.
  - L'élève explique qu'il fonde en 1943 le Conseil national de la Résistance (CNR).
  - L'élève précise que le CNR reconnaît de Gaulle comme chef de la Résistance.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Que crée Jean Moulin en 1943, et pourquoi cela renforce-t-il la Résistance ?
    methode: Explique d'abord la mission de Jean Moulin, puis ce qu'il crée en 1943, puis le chef que cet organisme reconnaît.
    etape: Tu peux commencer ainsi « Jean Moulin est un résistant chargé par de Gaulle d'unifier la Résistance intérieure...
      ».
  solution: Un développement réussi doit situer Jean Moulin comme un résistant envoyé par de Gaulle pour unifier les mouvements
    de résistance intérieure ; expliquer qu'il fonde en 1943 le Conseil national de la Résistance (CNR), qui regroupe résistants,
    partis politiques et syndicats ; préciser que le CNR reconnaît de Gaulle comme chef de la Résistance, renforçant sa légitimité
    face aux Alliés.
- id: nblm-quel-dirigeant-prend-la-tete-du-gouverne-1
  type: choix
  difficulte: 2
  enonce: Quel dirigeant prend la tête du gouvernement de Vichy et devient le « chef de l'État français » en juillet 1940
    ?
  reponse:
    options:
    - id: o1
      texte: Le maréchal Pétain
    - id: o2
      texte: Le général de Gaulle
    - id: o3
      texte: Jean Moulin
    - id: o4
      texte: Pierre Laval
    bonnes:
    - o1
  indices:
    relance: Pense au militaire populaire de la Première Guerre mondiale qui signe l'armistice en juin 1940.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : de Gaulle refuse la défaite, s''exile à Londres dès le 18 juin 1940 et fonde la France libre
      pour continuer le combat.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : Jean Moulin est un héros de la Résistance qui rassemble les mouvements au sein du CNR en
      1943, pas le chef de Vichy.'
  solution: Le maréchal Pétain. C'est exact. Après la défaite de juin 1940, le maréchal Pétain prend la tête du régime autoritaire
    de Vichy du 10 juillet 1940 au 20 août 1944.
- id: nblm-quelle-nouvelle-devise-remplace-la-formu-2
  type: choix
  difficulte: 2
  enonce: Quelle nouvelle devise remplace la formule républicaine « Liberté, Égalité, Fraternité » sous le régime autoritaire
    de Vichy ?
  reponse:
    options:
    - id: o1
      texte: Travail, Famille, Patrie
    - id: o2
      texte: Ordre, Discipline, Patrie
    - id: o3
      texte: Union, Travail, Démocratie
    - id: o4
      texte: Patrie, Honneur, Liberté
    bonnes:
    - o1
  indices:
    relance: Cette devise comporte trois mots résumant les valeurs traditionnelles et autoritaires prônées par le régime.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : bien que le régime soit autoritaire, cette formule n''a jamais été la devise officielle de
      Vichy.'
  - si:
      contient:
      - o3
    relance: 'Confusion : le régime de Vichy a précisément supprimé les élections et rejeté le principe démocratique.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : la notion de « Liberté » est supprimée par le régime de Vichy au profit d''un ordre moral
      strict.'
  solution: Travail, Famille, Patrie. C'est exact. Le régime de Vichy rejette les valeurs républicaines et adopte cette nouvelle
    devise autoritaire.
- id: nblm-quel-role-politique-majeur-joue-pierre-l-3
  type: choix
  difficulte: 2
  enonce: Quel rôle politique majeur joue Pierre Laval au sein du gouvernement de Vichy ?
  reponse:
    options:
    - id: o1
      texte: Il pousse à une collaboration d'État avec l'Allemagne nazie.
    - id: o2
      texte: Il dirige les forces de la France libre depuis Londres.
    - id: o3
      texte: Il fonde le Conseil national de la Résistance en 1943.
    - id: o4
      texte: Il organise le gouvernement provisoire de la Libération à Paris.
    bonnes:
    - o1
  indices:
    relance: Pense à l'attitude d'engagement politique actif du gouvernement de Vichy envers l'occupant nazi.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion fréquente : c''est le général de Gaulle qui dirige le mouvement de la France libre depuis Londres.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le Conseil national de la Résistance est fondé sous la direction de Jean Moulin pour unifier
      la Résistance.'
  - si:
      contient:
      - o4
    relance: 'Anachronisme : le gouvernement provisoire est mis en place lors de la Libération par les Résistants et Alliés,
      pas par Vichy.'
  solution: Il pousse à une collaboration d'État avec l'Allemagne nazie. C'est exact. Pierre Laval est l'un des principaux
    dirigeants du gouvernement de Vichy impulsant la collaboration avec l'occupant allemand.
- id: nblm-comment-le-territoire-francais-est-il-di-4
  type: choix
  difficulte: 2
  enonce: Comment le territoire français est-il divisé juste après la signature de l'armistice du 22 juin 1940 ?
  reponse:
    options:
    - id: o1
      texte: En une zone occupée au nord et une « zone libre » au sud.
    - id: o2
      texte: En quatre zones gérées par les puissances alliées.
    - id: o3
      texte: En deux zones toutes deux occupées militairement par la Grande-Bretagne.
    - id: o4
      texte: En trois départements annexés et une zone totalement neutre.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la séparation géographique entre la partie nord sous contrôle militaire allemand et la partie sud.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : c''est le territoire allemand qui sera découpé en quatre zones d''occupation après sa défaite en
      1945.'
  - si:
      contient:
      - o3
    relance: 'Erreur majeure : la Grande-Bretagne est un pays allié accueillant de Gaulle, elle n''occupe pas le territoire
      français.'
  - si:
      contient:
      - o4
    relance: 'Erreur de définition : la zone sud est appelée « zone libre » mais reste administrée par le régime autoritaire
      de Vichy.'
  solution: En une zone occupée au nord et une « zone libre » au sud. C'est exact. L'armistice coupe la France entre la zone
    occupée par l'armée allemande au nord et la zone libre administrée par Vichy au sud.
- id: nblm-quel-est-l-objectif-principal-du-conseil-5
  type: choix
  difficulte: 2
  enonce: Quel est l'objectif principal du Conseil national de la Résistance (CNR) créé en 1943 sous l'impulsion de Jean Moulin
    ?
  reponse:
    options:
    - id: o1
      texte: Réunir les mouvements de résistance et reconnaître de Gaulle comme chef.
    - id: o2
      texte: Organiser les élections législatives sous l'autorité du maréchal Pétain.
    - id: o3
      texte: Négocier les conditions de la capitulation française avec l'Allemagne nazie.
    - id: o4
      texte: Rédiger le traité de paix mettant fin à la Première Guerre mondiale.
    bonnes:
    - o1
  indices:
    relance: Pense au rassemblement unifié des différentes organisations clandestines luttant contre l'occupant et contre
      Vichy.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Contresens : le régime de Vichy a supprimé les élections et la Résistance luttait activement contre Vichy.'
  - si:
      contient:
      - o3
    relance: 'Erreur grave : la demande d''arrêt des combats et l''armistice ont été décidés par Pétain en juin 1940, pas
      par le CNR.'
  - si:
      contient:
      - o4
    relance: 'Confusion d''époque : le traité mettant fin à la Première Guerre mondiale est le traité de Versailles signé
      en 1919.'
  solution: Réunir les mouvements de résistance et reconnaître de Gaulle comme chef. C'est exact. Le CNR réunit les mouvements
    de résistance intérieure et reconnaît le général de Gaulle comme chef de la Résistance.
- id: nblm-quelles-sont-deux-mesures-prises-par-le-6
  type: choix
  difficulte: 3
  enonce: Quelles sont deux mesures prises par le régime autoritaire de Vichy dès 1940 ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La suppression des élections démocratiques.
    - id: o2
      texte: L'exclusion des Juifs de la fonction publique.
    - id: o3
      texte: Le rétablissement du suffrage universel féminin.
    - id: o4
      texte: L'alliance militaire officielle avec le Royaume-Uni.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche deux décisions qui montrent le rejet de la démocratie républicaine et la mise en place de discriminations.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : le droit de vote des femmes sera accordé en 1944 par le gouvernement provisoire issu de la Résistance,
      pas par Vichy.'
  - si:
      contient:
      - o4
    relance: 'Faux : le régime de Vichy rompt avec le Royaume-Uni et s''engage dans la collaboration d''État avec l''Allemagne
      nazie.'
  solution: La suppression des élections démocratiques ; L'exclusion des Juifs de la fonction publique. C'est exact. Le régime
    de Vichy met fin au fonctionnement démocratique en supprimant la tenue des élections.
- id: nblm-comment-appelle-t-on-la-politique-de-coo-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la politique de coopération avec l'Allemagne nazie choisie par le gouvernement de Vichy ?
  reponse:
    acceptees:
    - collaboration
    fautes_tolerees: 1
  indices:
    relance: Ce terme désigne le choix fait par le régime de Vichy de coopérer avec l'ennemi occupant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: collaboration. C'est exact. La collaboration est le terme désignant la politique du régime de Vichy coopérant
    avec l'occupant allemand.
- id: nblm-quel-general-fonde-la-france-libre-depui-8
  type: texte_court
  difficulte: 1
  enonce: Quel général fonde la France libre depuis Londres après avoir lancé un appel à poursuivre le combat le 18 juin 1940
    ?
  reponse:
    acceptees:
    - de Gaulle
    fautes_tolerees: 1
  indices:
    relance: Il s'agit du militaire qui a refusé l'armistice de 1940 et a appelé les Français à continuer le combat.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
