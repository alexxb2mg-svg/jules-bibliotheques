format: 2
notion: guerre-froide-bipolarisation
version: 3
etat: verifiee
declencheurs:
- deux superpuissances
- pacte de Varsovie
- OTAN
- conférence de Bandung
- démocratie libérale contre communisme
- chute du bloc soviétique
- crise de Cuba
- rideau de fer
- course à l'espace
- équilibre de la terreur
prerequis:
- decolonisation-nouveaux-etats
essentiel: 'La guerre froide (1947-1991) est la rivalité entre les deux superpuissances nées de la Seconde Guerre mondiale
  : les États-Unis (capitalisme, démocratie libérale) et l''URSS (communisme, parti unique). Le monde est bipolaire : il s''organise
  autour de deux blocs rivaux. On dit « froide » car les deux grands ne s''affrontent jamais directement par les armes.


  Repères : « rideau de fer » (expression de Churchill, 1946) qui coupe l''Europe en deux ; doctrine Truman et plan Marshall
  (1947) côté américain ; blocus de Berlin (1948-1949) ; OTAN (1949) pour l''Ouest et pacte de Varsovie (1955) pour l''Est
  ; mur de Berlin construit en 1961. La fin arrive avec la chute du mur (1989) et la disparition de l''URSS (1991).


  Cette confrontation est aussi idéologique, culturelle, d''opinion et d''information. Chaque camp veut montrer que son modèle
  est supérieur : propagande dans les médias et le cinéma, compétitions sportives, course à l''espace (premier satellite soviétique
  en 1957, premiers pas d''Américains sur la Lune en 1969), et arsenaux nucléaires qui créent un « équilibre de la terreur
  ».


  La guerre froide engendre des crises aux enjeux locaux et mondiaux, où les deux grands s''affrontent de façon indirecte.
  Exemples : la guerre de Corée (1950-1953), la crise de Cuba (1962), la guerre du Vietnam. La crise de Cuba est le moment
  où le monde frôle la guerre nucléaire.


  Le monde bipolaire est remis en cause par les indépendances. Les nouveaux États d''Asie et d''Afrique, pauvres pour la plupart,
  forment le Tiers Monde. Beaucoup refusent de choisir un camp : à la conférence de Bandung (1955), ils défendent l''indépendance
  et le refus des blocs. C''est le mouvement des non-alignés.


  Au brevet, on attend que tu saches expliquer les deux modèles opposés, citer une crise avec ses enjeux, et montrer comment
  les indépendances contestent la logique des blocs.

  '
methode:
- 'Retenir les deux dates encadrant la guerre froide : 1947 (début) et 1989-1991 (fin, chute du bloc soviétique).'
- 'Nommer les deux camps et leurs modèles opposés : capitalisme/démocratie (États-Unis) contre communisme (URSS).'
- Comprendre que la guerre froide est surtout une guerre d'opinion et d'idéologie, pas un affrontement militaire direct entre
  les deux grands.
- 'Relier la guerre froide aux indépendances : le tiers monde et les non-alignés viennent contester la logique des deux blocs.'
- 'Pour une crise, donner : la date, les deux camps, l''enjeu local (le pays concerné) et l''enjeu mondial (le risque d''un
  conflit entre les deux grands).'
vocabulaire:
- terme: bipolarisation
  definition: l'organisation du monde autour de deux pôles de puissance rivaux (ici les États-Unis et l'URSS)
- terme: rideau de fer
  definition: la frontière qui sépare l'Europe entre bloc occidental et bloc communiste pendant la guerre froide
- terme: non-alignés
  definition: les pays qui refusent de choisir entre les deux blocs pendant la guerre froide
- terme: superpuissance
  definition: un État dont la puissance politique, militaire et économique domine le monde (États-Unis et URSS)
- terme: capitalisme
  definition: un système économique fondé sur la propriété privée et la libre entreprise
- terme: communisme
  definition: un système où l'État dirige l'économie, avec un parti unique et sans propriété privée des grandes entreprises
- terme: propagande
  definition: l'ensemble des moyens utilisés pour influencer l'opinion et vanter son propre modèle
- terme: Tiers Monde
  definition: l'ensemble des pays pauvres, souvent anciennes colonies, qui ne s'alignent pas sur les deux grandes puissances
erreurs_frequentes:
- Croire que la guerre froide est une guerre où les armées américaine et soviétique se battent directement.
- Confondre l'OTAN (bloc de l'Ouest, 1949) et le pacte de Varsovie (bloc de l'Est, 1955).
- Oublier que la guerre froide est aussi idéologique et culturelle (propagande, sport, espace).
- Penser que tous les pays du monde ont choisi un camp, en oubliant les non-alignés et le Tiers Monde.
exemple:
  enonce: Pourquoi dit-on que la guerre froide est une guerre « idéologique » ?
  solution: Parce que l'affrontement entre les deux blocs se joue surtout par les idées, la propagande, la culture et l'opinion
    publique, chaque camp cherchant à montrer la supériorité de son modèle économique et politique, sans combat armé direct
    entre les deux superpuissances.
exercices:
- id: annee-debut-guerre-froide
  type: nombre
  difficulte: 1
  enonce: En quelle année commence la guerre froide ?
  reponse:
    valeur: 1947
    forme: entier
  indices:
    relance: Cette date suit de peu la fin de la Seconde Guerre mondiale.
    methode: La Seconde Guerre mondiale se termine en 1945 ; la guerre froide commence quelques années plus tard.
    etape: C'est l'année qui suit 1946, date de l'expression « rideau de fer ».
  pieges:
  - si:
      valeur: 1945
    relance: 1945, c'est la fin de la Seconde Guerre mondiale, pas encore le début officiel de la guerre froide.
  - si:
      valeur: 1991
    relance: 1991, c'est l'année de la fin de la guerre froide, pas de son commencement.
  solution: La guerre froide commence en 1947, après la Seconde Guerre mondiale.
- id: deux-superpuissances
  type: choix
  difficulte: 1
  enonce: Quels sont les deux pays appelés « superpuissances » pendant la guerre froide ?
  reponse:
    options:
    - id: a
      texte: Les États-Unis et l'URSS
    - id: b
      texte: La France et l'Allemagne
    - id: c
      texte: Le Royaume-Uni et le Japon
    - id: d
      texte: La Chine et l'Inde
    bonnes:
    - a
  indices:
    relance: L'une de ces puissances défend le capitalisme, l'autre le communisme.
    methode: Élimine les paires de pays qui ne sont pas les deux pôles rivaux du monde bipolaire après 1945.
    etape: Ces deux pays organisent chacun un bloc et une alliance militaire (OTAN d'un côté, pacte de Varsovie de l'autre).
  pieges:
  - si:
      contient:
      - b
    relance: La France et l'Allemagne appartiennent toutes deux, à des degrés divers, au camp occidental ; elles ne sont pas
      les deux superpuissances rivales.
  - si:
      contient:
      - c
    relance: Le Royaume-Uni et le Japon sont des alliés des États-Unis, pas les deux superpuissances rivales.
  - si:
      contient:
      - d
    relance: La Chine et l'Inde jouent un rôle important dans le tiers monde, mais ce ne sont pas les deux superpuissances
      de la guerre froide.
  solution: Les deux superpuissances de la guerre froide sont les États-Unis (capitalisme, démocratie libérale) et l'URSS
    (communisme).
- id: symbole-coupure-europe
  type: texte_court
  difficulte: 1
  enonce: Quel monument, construit en 1961, symbolise la coupure de l'Europe pendant la guerre froide ?
  reponse:
    acceptees:
    - mur de berlin
    fautes_tolerees: 1
  indices:
    relance: Il se trouve dans la capitale allemande, coupée en deux comme le pays.
    methode: 'Relis ta leçon : un mur sépare deux parties d''une même ville allemande à partir de 1961.'
    etape: Ce mur porte le nom de la ville où il se trouve.
  pieges:
  - si:
      valeur: rideau de fer
    relance: Le rideau de fer désigne toute la frontière entre les deux blocs en Europe, dès 1946 ; le monument cherché est
      construit en 1961, dans une seule ville.
  solution: Le mur de Berlin, construit en 1961, symbolise la coupure entre le bloc occidental et le bloc communiste.
- id: chronologie-guerre-froide
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: rideau-fer
      texte: L'expression « rideau de fer » apparaît
    - id: debut-guerre-froide
      texte: La guerre froide commence
    - id: bandung
      texte: La conférence de Bandung réunit les pays non-alignés
    - id: mur-berlin
      texte: Le mur de Berlin est construit
  indices:
    relance: Le rideau de fer est évoqué avant même le début officiel de la guerre froide, en 1946.
    methode: Place d'abord l'expression « rideau de fer » (1946), puis le début de la guerre froide (1947), puis les deux
      événements des années 1950-1960.
    etape: La conférence de Bandung a lieu en 1955, avant la construction du mur de Berlin en 1961.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux événements voisins sont inversés. Lequel des deux, entre Bandung et le début de la guerre froide,
      vient en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'expression « rideau de fer » (1946), la plus ancienne, puis range les trois autres par année.
  solution: « Rideau de fer » (1946), début de la guerre froide (1947), conférence de Bandung (1955), construction du mur
    de Berlin (1961).
- id: blocs-et-alliances
  type: association
  difficulte: 2
  enonce: Relie chaque bloc à son alliance militaire et à sa puissance dominante.
  reponse:
    gauche:
    - id: a
      texte: Bloc occidental
    - id: b
      texte: Bloc communiste
    droite:
    - id: x
      texte: OTAN, mené par les États-Unis
    - id: y
      texte: Pacte de Varsovie, mené par l'URSS
    paires:
      a: x
      b: y
  indices:
    relance: L'une des deux alliances est dirigée par les États-Unis, l'autre par l'URSS.
    methode: Associe d'abord le bloc occidental aux États-Unis, puis le bloc communiste à l'URSS et à leurs alliances respectives.
    etape: L'OTAN est l'alliance du bloc occidental ; le pacte de Varsovie est celle du bloc communiste.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout que tu n'as pas inversé les deux alliances militaires.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : l''OTAN est l''alliance du bloc occidental, mené par les États-Unis.'
  solution: 'Bloc occidental : OTAN, mené par les États-Unis. Bloc communiste : pacte de Varsovie, mené par l''URSS.'
- id: developpement-non-alignes
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique comment les indépendances des colonies remettent en cause la logique bipolaire
    du monde.'
  criteres:
  - L'élève rappelle la logique bipolaire du monde (deux blocs rivaux, États-Unis et URSS).
  - L'élève explique que de nombreux nouveaux États indépendants refusent de s'aligner sur un des deux blocs.
  - L'élève cite la conférence de Bandung (1955) et le mouvement des non-alignés.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Que veulent les pays qui refusent de choisir entre les deux blocs ?
    methode: Rappelle d'abord la logique bipolaire, puis explique ce que veulent les non-alignés, puis cite la conférence
      de Bandung.
    etape: Tu peux commencer ainsi « Après 1945, le monde est coupé en deux blocs rivaux... », puis expliquer le rôle des
      non-alignés.
  solution: Un développement réussi doit rappeler la logique bipolaire (deux blocs rivaux) ; expliquer que de nombreux nouveaux
    États indépendants, notamment réunis lors de la conférence de Bandung en 1955, refusent de s'aligner sur un des deux blocs
    et forment le mouvement des non-alignés ; montrer que cela complique la vision d'un monde coupé seulement en deux.
- id: nblm-quelles-sont-les-deux-superpuissances-qu-1
  type: choix
  difficulte: 2
  enonce: Quelles sont les deux superpuissances qui s'affrontent indirectement pendant la guerre froide et quels modèles opposent-elles
    ?
  reponse:
    options:
    - id: o1
      texte: Les États-Unis (démocratie libérale et capitalisme) et l'URSS (communisme).
    - id: o2
      texte: La France (démocratie) et l'Allemagne (nazisme).
    - id: o3
      texte: Le Royaume-Uni (capitalisme) et la Chine (communisme).
    - id: o4
      texte: Les États-Unis (communisme) et l'URSS (démocratie libérale).
    bonnes:
    - o1
  indices:
    relance: Pense aux deux grands vainqueurs de la Seconde Guerre mondiale représentant le bloc occidental et le bloc oriental.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : cette opposition correspond à la Seconde Guerre mondiale et non à la guerre froide.'
  - si:
      contient:
      - o3
    relance: 'Erreur : bien que la Chine soit communiste, les deux superpuissances majeures qui structurent la bipolarisation
      sont les États-Unis et l''URSS.'
  - si:
      contient:
      - o4
    relance: 'Attention à ne pas inverser les modèles : les États-Unis défendent la démocratie libérale et l''URSS le communisme.'
  solution: Les États-Unis (démocratie libérale et capitalisme) et l'URSS (communisme). C'est exact. Les deux superpuissances
    issues de la Seconde Guerre mondiale s'affrontent à travers leurs modèles politiques et économiques opposés.
- id: nblm-comment-sont-organisees-les-alliances-mi-2
  type: choix
  difficulte: 2
  enonce: Comment sont organisées les alliances militaires respectives des deux blocs pendant la guerre froide ?
  reponse:
    options:
    - id: o1
      texte: Le bloc occidental est regroupé autour de l'OTAN et le bloc communiste autour du pacte de Varsovie.
    - id: o2
      texte: Le bloc occidental est regroupé autour du pacte de Varsovie et le bloc communiste autour de l'OTAN.
    - id: o3
      texte: Les deux blocs sont unis au sein de la conférence de Bandung pour maintenir la paix.
    - id: o4
      texte: L'OTAN regroupe les pays neutres et le pacte de Varsovie regroupe les pays colonisés.
    bonnes:
    - o1
  indices:
    relance: Identifie quelle organisation militaire était dirigée par les États-Unis et laquelle était dirigée par l'URSS.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : attention à ne pas confondre l''alliance occidentale (OTAN) et l''alliance soviétique (pacte
      de Varsovie).'
  - si:
      contient:
      - o3
    relance: 'Confusion : la conférence de Bandung réunit les pays du tiers monde et des non-alignés, pas les alliances des
      superpuissances.'
  - si:
      contient:
      - o4
    relance: 'Inexact : l''OTAN et le pacte de Varsovie sont des alliances militaires directement liées aux deux superpuissances.'
  solution: Le bloc occidental est regroupé autour de l'OTAN et le bloc communiste autour du pacte de Varsovie. C'est exact.
    L'OTAN rassemble les alliés des États-Unis et le pacte de Varsovie réunit les alliés de l'URSS.
- id: nblm-quel-est-l-objectif-principal-des-pays-q-3
  type: choix
  difficulte: 2
  enonce: Quel est l'objectif principal des pays qui se réunissent à la conférence de Bandung en 1955 ?
  reponse:
    options:
    - id: o1
      texte: Refuser de choisir un camp et former le mouvement des non-alignés.
    - id: o2
      texte: Signer une alliance militaire défensive avec les États-Unis contre l'URSS.
    - id: o3
      texte: Créer le pacte de Varsovie pour soutenir le bloc communiste en Asie.
    - id: o4
      texte: Déclarer la guerre aux deux superpuissances pour libérer l'Europe.
    bonnes:
    - o1
  indices:
    relance: Pense au refus de s'aligner sur l'un ou l'autre des deux blocs rivaux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : cela contredit le principe de neutralité de la conférence face aux deux superpuissances.'
  - si:
      contient:
      - o3
    relance: 'Confusion : le pacte de Varsovie est l''alliance militaire du bloc soviétique, créée en Europe.'
  - si:
      contient:
      - o4
    relance: 'Inexact : les pays du tiers monde cherchent à s''affirmer pacifiquement sur la scène internationale sans conflit
      armé.'
  solution: Refuser de choisir un camp et former le mouvement des non-alignés. C'est exact. Les nouveaux États décolonisés
    refusent de s'aligner sur l'un des deux blocs et affirment leur indépendance diplomatique.
- id: nblm-pourquoi-la-periode-allant-de-1947-a-199-4
  type: choix
  difficulte: 2
  enonce: Pourquoi la période allant de 1947 à 1991 est-elle qualifiée de guerre « froide » ?
  reponse:
    options:
    - id: o1
      texte: Parce qu'il s'agit d'une confrontation idéologique et culturelle sans affrontement militaire direct entre les
        deux superpuissances.
    - id: o2
      texte: Parce que les combats armés se sont déroulés exclusivement pendant les mois d'hiver en Europe.
    - id: o3
      texte: Parce que les deux superpuissances n'avaient aucun désaccord et vivaient en paix totale.
    - id: o4
      texte: Parce que la guerre s'est terminée dès 1945 à la suite de la signature de la paix.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la forme de la rivalité entre les deux grands sans combat armé direct entre eux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le mot « froide » ne désigne pas le climat, mais l''absence de conflit armé direct entre
      les deux grands.'
  - si:
      contient:
      - o3
    relance: 'Faux : il y avait de très fortes tensions idéologiques et géopolitiques entre les deux blocs.'
  - si:
      contient:
      - o4
    relance: 'Erreur de dates : la guerre froide commence en 1947 et s''achève entre 1989 et 1991.'
  solution: Parce qu'il s'agit d'une confrontation idéologique et culturelle sans affrontement militaire direct entre les
    deux superpuissances. C'est juste. La guerre est dite « froide » car les États-Unis et l'URSS s'affrontent par la propagande
    et des crises locales, sans guerre directe entre eux.
