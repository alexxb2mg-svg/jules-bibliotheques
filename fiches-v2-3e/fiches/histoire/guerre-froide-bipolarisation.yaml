  solution: bipolarisation. C'est la bonne réponse. La bipolarisation caractérise la division du monde entre deux superpuissances.
- id: annee-crise-cuba
  type: nombre
  difficulte: 2
  enonce: En quelle année a lieu la crise de Cuba, quand le monde frôle la guerre nucléaire entre les États-Unis et l'URSS
    ?
  reponse:
    valeur: 1962
    forme: entier
  indices:
    relance: Cette crise éclate en octobre, peu après la construction du mur de Berlin.
    methode: Les États-Unis découvrent des missiles soviétiques installés sur une île des Caraïbes. Situe cette crise au début
      des années 1960.
    etape: L'année est un peu plus grande que celle de la construction du mur de Berlin, mais toujours au début des années
      1960.
  pieges:
  - si:
      valeur: 1961
    relance: 1961, c'est l'année de la construction du mur de Berlin, pas celle de la crise de Cuba.
  - si:
      valeur: 1955
    relance: 1955 est l'année de la conférence de Bandung et du pacte de Varsovie, pas de la crise de Cuba.
  solution: La crise de Cuba a lieu en octobre 1962 ; elle oppose les États-Unis et l'URSS à propos de missiles soviétiques
    installés à Cuba.
- id: armes-guerre-ideologique
  type: choix
  difficulte: 2
  enonce: Quels sont des moyens de la rivalité entre les États-Unis et l'URSS pendant la guerre froide ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: La course à l'espace
    - id: b
      texte: La propagande dans les médias et le cinéma
    - id: c
      texte: Les batailles directes entre l'armée américaine et l'armée soviétique
    bonnes:
    - a
    - b
  indices:
    relance: Cherche les moyens de montrer que son modèle est meilleur, sans combat direct entre les deux grands.
    methode: Rappelle-toi pourquoi la guerre est dite « froide » et élimine le moyen qui contredit ce mot.
    etape: Deux réponses sur trois sont justes. Une seule suppose un combat direct entre les deux grands.
  pieges:
  - si:
      contient:
      - c
    relance: Les deux superpuissances ne se combattent jamais directement, c'est pour cela que la guerre est dite « froide
      ».
  solution: 'La course à l''espace et la propagande sont des moyens de la rivalité. Les deux grands ne se battent jamais directement
    : la guerre est « froide ».'
