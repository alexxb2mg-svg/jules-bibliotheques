- id: nblm-quels-elements-caracterisent-la-bipolari-6
  type: choix
  difficulte: 3
  enonce: Quels éléments caractérisent la bipolarisation du monde pendant la guerre froide ? (Sélectionne les 2 bonnes réponses)
    (plusieurs réponses possibles)
  reponse:
    options:
