format: 2
notion: totalitarismes-entre-deux-guerres
version: 2
etat: generee
declencheurs:
- Adolf Hitler
- krach de Wall Street
- Léon Blum
- congés payés de 1936
- chancelier en 1933
- montée du fascisme
- semaine de 40 heures
- accords de Matignon
- lois de Nuremberg
- pacte d'acier
prerequis:
- guerre-totale-1914-1918
essentiel: |
  Après la Première Guerre mondiale, le traité de Versailles (1919) est vécu comme une humiliation par l'Allemagne : elle perd des territoires, doit réduire son armée et payer des réparations. Le pays est fragile.

  Le 24 octobre 1929, le krach de Wall Street (effondrement de la Bourse de New York) déclenche la Grande Dépression : crise mondiale, faillites, usines fermées, chômage massif. En Allemagne, près de 6 millions de chômeurs en 1932. Ces difficultés profitent à Adolf Hitler et au parti nazi.

  En janvier 1933, Hitler devient chancelier. Il supprime vite les libertés : partis interdits, opposants arrêtés, presse contrôlée, propagande. En 1934, il devient le Führer (chef absolu). C'est un régime totalitaire : parti unique, contrôle de toute la société, culte du chef, répression. Son idéologie est raciste et antisémite : les lois de Nuremberg (1935) privent les Juifs de leurs droits.

  Hitler prépare la guerre (réarmement) et noue des alliances : axe Rome-Berlin avec l'Italie fasciste de Mussolini (1936), alliance avec le Japon, pacte d'acier avec l'Italie (1939). Il annexe l'Autriche en 1938.

  En France, la crise arrive plus tard. Le 6 février 1934, des ligues d'extrême droite manifestent violemment à Paris. La gauche s'unit dans le Front populaire (Parti radical, SFIO, Parti communiste). Il gagne les élections de mai 1936. Le gouvernement de Léon Blum obtient après de grandes grèves les accords de Matignon (juin 1936) : hausses de salaires, deux semaines de congés payés, semaine de 40 heures.

  Cette expérience se déroule dans un contexte de « montée des périls » : régimes totalitaires en Europe, guerre d'Espagne (1936). Le Front populaire prend fin en 1938.

  Au brevet, on attend que tu expliques l'enchaînement Versailles, crise de 1929, arrivée d'Hitler, et que tu situes le Front populaire dans son contexte.
methode:
- Distinguer la cause économique (krach de 1929, Grande Dépression) de sa conséquence politique en Allemagne (arrivée d'Hitler au pouvoir en 1933).
- 'Retenir un mot juste pour qualifier le régime nazi : totalitaire (contrôle total de la société, parti unique, propagande, répression).'
- Situer le Front populaire dans le temps (1936) et le relier au contexte de crise et de « montée des périls » en Europe.
- 'Ne pas confondre nazisme (Allemagne, Hitler) et fascisme (Italie, Mussolini) : deux régimes proches mais distincts, alliés dans les années
  1930.'
- 'Pour expliquer l''arrivée d''Hitler, suivre la chaîne : humiliation de Versailles, crise de 1929, chômage, succès des nazis, chancelier en
  1933.'
- 'Pour le Front populaire, donner trois repères : 1934 (menace), mai 1936 (victoire), une réforme sociale (congés payés).'
vocabulaire:
- terme: totalitarisme
  definition: 'un régime politique qui contrôle entièrement la société : parti unique, propagande, absence de libertés, répression'
- terme: Grande Dépression
  definition: la crise économique mondiale qui suit le krach de Wall Street de 1929
- terme: Front populaire
  definition: l'alliance des partis de gauche en France (1934), au pouvoir de 1936 à 1938
- terme: krach
  definition: l'effondrement brutal des cours de la Bourse
- terme: chancelier
  definition: le chef du gouvernement en Allemagne
- terme: fascisme
  definition: le régime totalitaire de Mussolini en Italie, au pouvoir depuis 1922
- terme: antisémitisme
  definition: la haine et la discrimination envers les Juifs
- terme: propagande
  definition: l'ensemble des moyens utilisés pour influencer l'opinion et imposer une idéologie
erreurs_frequentes:
- 'Croire qu''Hitler est élu président : il est nommé chancelier en janvier 1933, puis concentre les pouvoirs.'
- Confondre le krach de 1929 (un événement boursier) et la Grande Dépression (la crise économique qui en découle, plus longue).
- Oublier que le Front populaire est une coalition de plusieurs partis, pas un seul parti.
- 'Mélanger nazisme et fascisme italien : des points communs (totalitarisme) mais des mouvements distincts.'
- "Placer le Front populaire avant l'arrivée d'Hitler : Hitler arrive en 1933, le Front populaire en 1936."
exemple:
  enonce: Explique le lien entre la crise de 1929 et l'arrivée d'Hitler au pouvoir en Allemagne.
  solution: Le krach de 1929 provoque une crise économique mondiale (chômage, faillites). En Allemagne, cette crise s'ajoute aux difficultés de
    l'après-guerre et rend le pays instable. Adolf Hitler et le parti nazi profitent de ce contexte pour gagner des soutiens et arrivent au pouvoir
    en janvier 1933.
exercices:
- id: annee-hitler-chancelier
  type: nombre
  difficulte: 1
  enonce: En quelle année Adolf Hitler devient-il chancelier d'Allemagne ?
  reponse:
    valeur: 1933
    forme: entier
  indices:
    relance: 'Le krach de Wall Street a lieu en 1929. Quelques années plus tard, la crise a fini de déstabiliser l''Allemagne : cherche l''année
      où Hitler accède au pouvoir.'
    methode: Repère d'abord le krach de 1929, puis cherche l'année où la crise permet à Hitler de devenir chancelier en Allemagne.
    etape: Hitler devient chancelier au tout début des années 1930, en janvier de cette année-là.
  pieges:
  - si:
      valeur: 1929
    relance: 1929 est l'année du krach de Wall Street, pas celle où Hitler devient chancelier.
  - si:
      valeur: 1939
    relance: 1939, c'est le début de la Seconde Guerre mondiale. Hitler est déjà au pouvoir depuis plusieurs années à cette date.
  solution: Adolf Hitler devient chancelier d'Allemagne en janvier 1933.
- id: gouvernement-front-populaire
  type: choix
  difficulte: 1
  enonce: Qui dirige le gouvernement du Front populaire après la victoire électorale de mai 1936 ?
  reponse:
    options:
    - id: a
      texte: Léon Blum
    - id: b
      texte: Le maréchal Pétain
    - id: c
      texte: Le général de Gaulle
    - id: d
      texte: Adolf Hitler
    bonnes:
    - a
  indices:
    relance: Ce dirigeant appartient à la SFIO, un parti de gauche.
    methode: 'Élimine les personnages qui n''ont aucun rôle politique en France en 1936 : l''un dirige l''Allemagne, les deux autres deviennent
      connus plus tard, pendant la Seconde Guerre mondiale.'
    etape: Cherche le chef de la SFIO en 1936, dont le nom est aussi celui de nombreuses rues et lycées français.
  pieges:
  - si:
      contient:
      - b
    relance: Pétain devient célèbre en 1940, après la défaite face à l'Allemagne, pas en 1936.
  - si:
      contient:
      - c
    relance: De Gaulle n'a pas encore de rôle politique national en 1936 ; il devient connu en 1940.
  - si:
      contient:
      - d
    relance: Hitler dirige l'Allemagne, pas la France.
  solution: Le Front populaire remporte les élections de mai 1936 ; le gouvernement est dirigé par Léon Blum, chef du principal parti de la coalition,
    la SFIO.
- id: mot-totalitaire
  type: texte_court
  difficulte: 1
  enonce: 'Quel adjectif désigne un régime politique qui contrôle entièrement la société : parti unique, propagande, absence de libertés ?'
  reponse:
    acceptees:
    - totalitaire
    fautes_tolerees: 1
  indices:
    relance: Ce mot vient du mot latin totus, qui veut dire « tout entier ».
    methode: Pense à un régime qui veut contrôler la totalité de la vie des habitants.
    etape: Le mot commence par « total- » et se termine par « -aire ».
  pieges:
  - si:
      valeur: autoritaire
    relance: 'Un régime autoritaire limite les libertés, mais le mot cherché va plus loin : il contrôle toute la société, pas seulement le pouvoir
      politique.'
  solution: Un régime totalitaire contrôle entièrement la société (parti unique, propagande, absence de libertés, répression), comme le régime
    nazi en Allemagne.
- id: chronologie-crise
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: krach
      texte: Le krach de Wall Street a lieu
    - id: hitler-chancelier
      texte: Adolf Hitler devient chancelier d'Allemagne
    - id: emeutes
      texte: Des émeutes de l'extrême droite ont lieu à Paris
    - id: front-populaire
      texte: Le Front populaire remporte les élections en France
  indices:
    relance: Lequel de ces événements se déroule aux États-Unis, avant les autres ?
    methode: Place d'abord le krach de 1929, puis cherche ce qui se passe en Allemagne, puis en France.
    etape: Hitler devient chancelier en 1933. Les émeutes parisiennes ont lieu l'année suivante, avant les élections du Front populaire.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux événements voisins sont inversés. Lequel des deux vient réellement en premier ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement qui se passe aux États-Unis, puis range les trois événements européens par année.
  solution: Krach de Wall Street (1929), Hitler chancelier d'Allemagne (janvier 1933), émeutes du 6 février 1934 à Paris, victoire électorale
    du Front populaire (mai 1936).
- id: regimes-dirigeants
  type: association
  difficulte: 2
  enonce: Relie chaque régime ou mouvement politique à son dirigeant.
  reponse:
    gauche:
    - id: a
      texte: Le nazisme, en Allemagne
    - id: b
      texte: Le fascisme, en Italie
    - id: c
      texte: Le Front populaire, en France
    droite:
    - id: x
      texte: Adolf Hitler
    - id: y
      texte: Benito Mussolini
    - id: z
      texte: Léon Blum
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Le nazisme et le fascisme italien sont deux régimes distincts, même s'ils sont alliés.
    methode: Associe chaque mouvement politique au pays où il est au pouvoir, puis à son dirigeant.
    etape: Le nazisme est le régime d'Hitler en Allemagne. Cherche qui dirige l'Italie fasciste, puis qui dirige le gouvernement français du Front
      populaire.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout que tu n'as pas inversé les deux dirigeants alliés.
  - si:
      diagnostic: associations_fausses
    relance: 'Pars d''un repère sûr : le nazisme, c''est Hitler en Allemagne. Place les deux autres régimes par rapport à lui.'
  solution: 'Nazisme (Allemagne) : Adolf Hitler. Fascisme (Italie) : Benito Mussolini. Front populaire (France) : Léon Blum.'
- id: developpement-front-populaire
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : présente les réformes du Front populaire et le contexte dans lequel elles sont votées.'
  criteres:
  - L'élève situe la victoire électorale du Front populaire dans le temps (mai 1936) et dans son contexte (crise économique, montée des périls).
  - L'élève cite au moins une réforme sociale précise (congés payés ou semaine de 40 heures).
  - L'élève nomme le gouvernement de Léon Blum.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Dans quel contexte économique et politique le Front populaire arrive-t-il au pouvoir ?
    methode: Situe d'abord le contexte (crise, élections de 1936), puis cite au moins une réforme sociale précise.
    etape: Tu peux commencer ainsi « En mai 1936, le Front populaire remporte les élections... », puis présenter le gouvernement de Léon Blum
      et une réforme.
  solution: Un développement réussi situe la victoire électorale du Front populaire en mai 1936, dans un contexte de crise économique et de tensions
    politiques (émeutes de 1934) ; présente le gouvernement de Léon Blum (SFIO) et au moins une réforme sociale (congés payés, réduction du temps
    de travail) ; relie cette expérience française à la « montée des périls » en Europe (régimes totalitaires voisins).
- id: alliances-nazi
  type: choix
  difficulte: 2
  enonce: Avec quels pays l'Allemagne nazie noue-t-elle des alliances dans les années 1930 ? (plusieurs réponses)
  reponse:
    options:
    - id: a
      texte: L'Italie fasciste
    - id: b
      texte: Le Japon
    - id: c
      texte: La France
    bonnes:
    - a
    - b
  indices:
    relance: Cherche des régimes autoritaires proches de celui d'Hitler.
    methode: Élimine le pays qui est une démocratie et qui deviendra un adversaire de l'Allemagne.
    etape: Deux réponses sur trois sont justes. Un pays est un futur ennemi de l'Allemagne nazie.
  pieges:
  - si:
      contient:
      - c
    relance: La France est une démocratie. Elle sera en guerre contre l'Allemagne dès 1939.
  solution: L'Allemagne nazie s'allie avec l'Italie fasciste de Mussolini et avec le Japon. La France est un adversaire.
- id: dates-cles-entre-deux-guerres
  type: association
  difficulte: 2
  enonce: Relie chaque date à l'événement correspondant.
  reponse:
    gauche:
    - id: a
      texte: '1919'
    - id: b
      texte: '1929'
    - id: c
      texte: '1933'
    - id: d
      texte: '1936'
    droite:
    - id: w
      texte: Traité de Versailles
    - id: x
      texte: Krach de Wall Street
    - id: y
      texte: Hitler devient chancelier
    - id: z
      texte: Victoire du Front populaire
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Range mentalement ces quatre dates dans l'ordre. Chaque événement en entraîne un autre.
    methode: La paix vient avant la crise, la crise avant l'arrivée d'Hitler, puis vient l'expérience française.
    etape: Le traité de Versailles est le plus ancien, la victoire du Front populaire le plus récent.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux dates les plus proches dans le temps.
  - si:
      diagnostic: associations_fausses
    relance: Pars du plus ancien (traité de la paix) et du plus récent (victoire de la gauche en France), puis place les autres.
  solution: '1919 : traité de Versailles. 1929 : krach de Wall Street. 1933 : Hitler chancelier. 1936 : victoire du Front populaire.'
