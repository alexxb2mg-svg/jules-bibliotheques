# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: conflits-monde-contemporain
version: 1
etat: verifiee
declencheurs:
- guerre en Ukraine
- invasion russe
- COP21
- accord de Paris climat
- sanctions économiques
- sommet mondial pour le climat
- réchauffement climatique
prerequis:
- guerre-froide-bipolarisation
essentiel: 'Depuis la fin de la guerre froide (1989-1991), le monde n''est plus organisé autour de deux blocs rivaux, mais
  reste marqué par des rivalités et des conflits, avec des enjeux locaux (territoriaux, religieux, ethniques) qui peuvent
  avoir des répercussions internationales.

  Un exemple contemporain est la guerre russo-ukrainienne : la Russie envahit l''Ukraine en février 2022, provoquant un conflit
  qui mobilise une aide internationale à l''Ukraine et de lourdes sanctions économiques contre la Russie.

  Face à des défis mondiaux comme le changement climatique, des acteurs très divers (États, organisations internationales,
  ONG, entreprises) coopèrent lors de grandes conférences. L''accord de Paris sur le climat, négocié lors de la COP21 et adopté
  le 12 décembre 2015, engage les pays signataires à limiter le réchauffement climatique bien en dessous de 2°C par rapport
  à l''époque préindustrielle.'
methode:
- Choisir un exemple précis de conflit contemporain (par exemple la guerre en Ukraine depuis 2022) et connaître ses grandes
  dates.
- Distinguer les enjeux locaux d'un conflit (territoire, population) de ses répercussions internationales (sanctions, alliances).
- Pour la coopération internationale, choisir un exemple précis (l'accord de Paris de 2015) et connaître son objectif chiffré.
- 'Identifier les différents types d''acteurs de la coopération internationale : États, ONU, ONG.'
vocabulaire:
- terme: COP
  definition: 'Conférence des parties : réunion internationale annuelle sur le climat organisée par l''ONU'
- terme: sanctions économiques
  definition: des mesures prises par des États pour pénaliser économiquement un autre État, sans recourir à la guerre
erreurs_frequentes:
- Croire que la fin de la guerre froide a mis fin à tous les conflits dans le monde.
- Confondre l'accord de Paris sur le climat (2015) avec un simple sommet sans engagement chiffré.
- Oublier de dater précisément l'exemple de conflit choisi.
- Réduire la coopération internationale aux seuls États, en oubliant les ONG et organisations comme l'ONU.
exemple:
  enonce: Donne la date et l'objectif principal de l'accord de Paris sur le climat.
  solution: Adopté le 12 décembre 2015 lors de la COP21, il vise à limiter la hausse de la température moyenne mondiale bien
    en dessous de 2°C par rapport aux niveaux préindustriels, si possible à 1,5°C.
exercices:
- id: annee-invasion-ukraine
  type: nombre
  difficulte: 1
  enonce: En quelle année la Russie envahit-elle l'Ukraine ?
  reponse:
    valeur: 2022
    forme: entier
  indices:
    relance: C'est un conflit récent, largement couvert par les médias.
    methode: Cet événement a lieu après la pandémie de Covid-19, au début des années 2020.
    etape: L'invasion commence en février d'une année précise. Donne cette année.
  pieges:
  - si:
      valeur: 1991
    relance: 1991, c'est la fin de l'URSS, à la fin de la guerre froide. L'invasion de l'Ukraine par la Russie est bien plus
      récente.
  - si:
      valeur: 2015
    relance: 2015, c'est l'année de l'accord de Paris sur le climat, un autre événement du monde contemporain. L'invasion
      russe a lieu une autre année.
  solution: La Russie envahit l'Ukraine en février 2022.
- id: quelle-annee-cop21
  type: choix
  difficulte: 1
  enonce: En quelle année est adopté l'accord de Paris sur le climat, lors de la COP21 ?
  reponse:
    options:
    - id: a
      texte: '2015'
    - id: b
      texte: '1992'
    - id: c
      texte: '2022'
    - id: d
      texte: '1989'
    bonnes:
    - a
  indices:
    relance: Cherche une date du milieu des années 2010, avant la guerre en Ukraine.
    methode: L'accord de Paris est adopté le 12 décembre d'une certaine année, lors de la COP21 organisée à Paris.
    etape: Cette année se termine par un 5 et commence par 201.
  pieges:
  - si:
      contient:
      - b
    relance: 1992, c'est plutôt l'époque du traité de Maastricht en Europe. L'accord de Paris est bien plus récent.
  - si:
      contient:
      - c
    relance: 2022, c'est l'année de l'invasion de l'Ukraine par la Russie, un autre événement. L'accord de Paris est antérieur.
  - si:
      contient:
      - d
    relance: 1989, c'est le début de la chute du bloc soviétique et de la fin de la guerre froide. L'accord de Paris est bien
      plus récent.
  solution: L'accord de Paris sur le climat est adopté le 12 décembre 2015, lors de la COP21.
- id: objectif-accord-paris
  type: texte_court
  difficulte: 2
  enonce: Quel nombre l'accord de Paris fixe-t-il comme limite de réchauffement climatique, en degrés Celsius, par rapport
    à l'époque préindustrielle ?
  reponse:
    acceptees:
    - '2'
    fautes_tolerees: 1
  indices:
    relance: C'est un petit nombre entier, l'objectif est de rester « bien en dessous » de ce seuil.
    methode: Relis l'essentiel de la fiche pour retrouver le chiffre exact fixé par l'accord de Paris.
    etape: Le texte dit « bien en dessous de X°C ». Quel est ce nombre X ?
  pieges:
  - si:
      valeur: '1.5'
    relance: 1,5°C est l'objectif le plus ambitieux mentionné « si possible », mais le seuil principal fixé par l'accord est
      un autre nombre, plus grand.
  solution: L'accord de Paris vise à limiter le réchauffement climatique bien en dessous de 2°C par rapport à l'époque préindustrielle.
- id: acteurs-cooperation
  type: association
  difficulte: 2
  enonce: Relie chaque type d'acteur de la coopération internationale à un exemple.
  reponse:
    gauche:
    - id: a
      texte: Organisation internationale mondiale
    - id: b
      texte: Organisation non gouvernementale
    - id: c
      texte: État
    droite:
    - id: x
      texte: ONU
    - id: y
      texte: Une association humanitaire ou environnementale
    - id: z
      texte: La France
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un État est un pays, avec un gouvernement. Une organisation non gouvernementale n'est justement pas dirigée par
      un État.
    methode: L'ONU réunit presque tous les pays du monde ; une ONG est souvent une association indépendante des États.
    etape: La France est un exemple d'État. Reste à distinguer l'ONU (organisation mondiale) d'une ONG (association).
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre une organisation qui réunit des États (ONU) et
      une association indépendante (ONG).
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, la France est un État, puis distingue l'ONU (organisation mondiale d'États) d'une ONG (association
      indépendante).
  solution: 'Organisation internationale mondiale : ONU. Organisation non gouvernementale : une association humanitaire ou
    environnementale (ONG). État : la France.'
- id: consequence-conflit-local
  type: choix
  difficulte: 2
  enonce: Pourquoi un conflit local peut-il avoir des conséquences mondiales ?
  reponse:
    options:
    - id: a
      texte: Il peut entraîner des sanctions économiques internationales et perturber le commerce mondial
    - id: b
      texte: Il reste toujours limité au territoire concerné, sans aucun effet ailleurs
    - id: c
      texte: Il met automatiquement fin à toute coopération internationale
    bonnes:
    - a
  indices:
    relance: Pense aux sanctions économiques ou aux alliances internationales évoquées dans le cours.
    methode: Un conflit local peut toucher des échanges commerciaux ou provoquer des décisions d'autres pays contre l'un des
      belligérants.
    etape: Cherche la réponse qui parle de sanctions économiques et de commerce mondial.
  pieges:
  - si:
      contient:
      - b
    relance: Le cours donne justement des exemples où un conflit local a des répercussions ailleurs (sanctions, aide internationale).
      Cette réponse dit l'inverse.
  - si:
      contient:
      - c
    relance: Un conflit peut au contraire relancer la coopération internationale (aide, sommets diplomatiques), pas y mettre
      fin automatiquement.
  solution: Un conflit local peut entraîner des sanctions économiques internationales, des alliances diplomatiques ou militaires,
    et perturber des échanges commerciaux mondiaux, ce qui étend ses effets bien au-delà du territoire concerné.
- id: developpement-cooperation-climat
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : montre comment la coopération internationale tente de répondre au défi du changement
    climatique.'
  criteres:
  - L'élève cite l'accord de Paris et son année (2015, COP21).
  - L'élève donne l'objectif chiffré de l'accord (limiter le réchauffement bien en dessous de 2°C).
  - L'élève cite au moins deux types d'acteurs de la coopération internationale (États, ONU, ONG).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quel grand accord international sur le climat connais-tu, et en quelle année a-t-il été adopté ?
    methode: Cite l'accord de Paris et son objectif chiffré, puis explique quels acteurs participent à sa mise en œuvre.
    etape: Tu peux commencer ainsi « Face au changement climatique, des acteurs très divers coopèrent au niveau mondial...
      », puis continuer avec l'accord de Paris.
  solution: Face au changement climatique, des acteurs très divers coopèrent au niveau mondial. En 2015, lors de la COP21,
    les pays adoptent l'accord de Paris sur le climat, le 12 décembre, qui vise à limiter le réchauffement climatique bien
    en dessous de 2°C par rapport à l'époque préindustrielle. Cette coopération réunit des États comme la France, une organisation
    mondiale comme l'ONU, et des ONG qui militent pour l'environnement. Ainsi, face à un défi mondial, la coopération internationale
    s'organise à travers de grandes conférences et des acteurs variés.
