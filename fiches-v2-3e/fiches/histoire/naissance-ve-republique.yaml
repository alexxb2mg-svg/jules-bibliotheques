format: 2
notion: naissance-ve-republique
version: 1
etat: verifiee
declencheurs:
- de Gaulle président
- nouvelle constitution
- crise de mai 1958
- cinquième République
- scrutin majoritaire
- retour de De Gaulle
- suffrage universel direct
prerequis:
- refondation-republicaine-liberation
essentiel: 'En 1958, la IVe République est confrontée à une grave crise politique liée à la guerre d''Algérie. À la suite
  d''un soulèvement à Alger en mai 1958, le général de Gaulle, retiré de la politique depuis 1946, revient au pouvoir : il
  devient président du Conseil et obtient les pleins pouvoirs pour rédiger une nouvelle Constitution.

  Cette Constitution, approuvée par référendum le 28 septembre 1958 (plus de 80 % de « oui »), fonde la Ve République, en
  vigueur depuis le 4 octobre 1958. Elle renforce nettement le pouvoir exécutif (président de la République et gouvernement)
  par rapport au Parlement, contrairement aux IIIe et IVe Républiques où le pouvoir législatif dominait. Charles de Gaulle
  devient le premier président de la Ve République. Ce pouvoir présidentiel est encore renforcé en 1962 par l''élection du
  président au suffrage universel direct.

  Le scrutin majoritaire aux élections législatives favorise en général une majorité stable à l''Assemblée nationale, soutien
  du gouvernement.'
methode:
- 'Retenir la date de naissance de la Ve République : la Constitution est adoptée par référendum le 28 septembre 1958, en
  vigueur depuis le 4 octobre 1958.'
- Situer le contexte de crise (guerre d'Algérie, mai 1958) qui amène le retour de De Gaulle.
- 'Insister sur la caractéristique principale de la Ve République : un exécutif renforcé par rapport aux républiques précédentes.'
- Ne pas confondre l'adoption de la Constitution (1958) et l'élection du président au suffrage universel direct (réforme de
  1962).
vocabulaire:
- terme: pouvoir exécutif
  definition: 'le pouvoir qui applique les lois : le président de la République et le gouvernement'
- terme: scrutin majoritaire
  definition: un mode d'élection où le candidat qui obtient le plus de voix dans sa circonscription est élu
erreurs_frequentes:
- Confondre la date de l'adoption de la Constitution par référendum (28 septembre 1958) et son entrée en vigueur (4 octobre
  1958).
- 'Croire que de Gaulle est élu président dès 1958 au suffrage universel direct : ce n''est le cas qu''à partir de la réforme
  de 1962.'
- Oublier le contexte de la guerre d'Algérie dans le retour au pouvoir de De Gaulle.
- 'Penser que la Ve République affaiblit le pouvoir exécutif : c''est l''inverse, elle le renforce nettement.'
exemple:
  enonce: Explique en une phrase pourquoi 1958 marque une rupture dans l'histoire politique française.
  solution: En 1958, une nouvelle Constitution, approuvée par référendum, fonde la Ve République et renforce durablement le
    pouvoir exécutif face au Parlement, mettant fin à l'instabilité gouvernementale de la IVe République.
exercices:
- id: annee-ve-republique
  type: nombre
  difficulte: 1
  enonce: En quelle année la Constitution qui fonde la Ve République est-elle adoptée par référendum ?
  reponse:
    valeur: 1958
    forme: entier
  indices:
    relance: C'est l'année du retour au pouvoir du général de Gaulle, après une crise liée à la guerre d'Algérie.
    methode: L'élection du président au suffrage universel direct arrive quatre ans plus tard. Recule de quatre ans pour trouver
      l'année de la Constitution.
    etape: Cette année se situe à la fin des années 1950, peu après le soulèvement d'Alger.
  pieges:
  - si:
      valeur: 1962
    relance: 1962, c'est l'année de la réforme sur l'élection du président au suffrage universel direct. La Constitution elle-même
      est adoptée quatre ans plus tôt.
  - si:
      valeur: 1946
    relance: 1946, c'est l'année où de Gaulle se retire de la politique. Il y revient bien plus tard, à la suite d'une crise
      liée à la guerre d'Algérie.
  solution: La Constitution de la Ve République est adoptée par référendum le 28 septembre 1958.
- id: reforme-1962
  type: choix
  difficulte: 1
  enonce: Que change la réforme de 1962 pour l'élection du président de la République ?
  reponse:
    options:
    - id: a
      texte: Le président est désormais élu au suffrage universel direct par tous les citoyens
    - id: b
      texte: Le président n'est plus élu, il est nommé par l'Assemblée nationale
    - id: c
      texte: Le président perd tous ses pouvoirs au profit du Parlement
    - id: d
      texte: La durée du mandat présidentiel est supprimée
    bonnes:
    - a
  indices:
    relance: Cette réforme renforce encore la légitimité du président, en changeant qui l'élit.
    methode: Avant 1962, le président était élu par un collège de grands électeurs, pas directement par les citoyens.
    etape: Cherche la réponse qui parle d'une élection par « tous les citoyens » ou « suffrage universel direct ».
  pieges:
  - si:
      contient:
      - b
    relance: 'C''est l''inverse : la réforme de 1962 rapproche l''élection du président des citoyens, elle ne la confie pas
      au Parlement.'
  - si:
      contient:
      - c
    relance: Au contraire, la Ve République renforce le pouvoir du président, elle ne l'affaiblit pas.
  - si:
      contient:
      - d
    relance: Cette réforme concerne le mode d'élection du président, pas la durée de son mandat.
  solution: À partir de 1962, le président de la République est élu au suffrage universel direct par l'ensemble des citoyens,
    ce qui renforce sa légitimité.
- id: contexte-retour-de-gaulle
  type: texte_court
  difficulte: 2
  enonce: Dans quelle ville a lieu, en mai 1958, le soulèvement qui provoque le retour au pouvoir du général de Gaulle ?
  reponse:
    acceptees:
    - Alger
    fautes_tolerees: 1
  indices:
    relance: Cette ville se trouve en Algérie, alors département français.
    methode: C'est la principale ville d'Algérie, théâtre d'une grave crise politique en 1958.
    etape: Le nom de cette ville commence par « Al- ».
  pieges:
  - si:
      valeur: Paris
    relance: Paris est la capitale française, mais le soulèvement qui déclenche la crise de 1958 a lieu ailleurs, en Algérie.
  solution: Le soulèvement de mai 1958 a lieu à Alger, en Algérie, alors département français.
- id: chronologie-ve-republique
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: retrait
      texte: De Gaulle se retire de la vie politique
    - id: alger
      texte: Soulèvement à Alger
    - id: constitution
      texte: Adoption de la Constitution par référendum
    - id: reforme
      texte: Réforme de l'élection du président au suffrage universel direct
  indices:
    relance: Le retrait de De Gaulle de la politique est l'événement le plus ancien de cette liste.
    methode: Place d'abord 1946 (retrait) et 1962 (réforme), puis situe le soulèvement d'Alger et l'adoption de la Constitution,
      tous deux en 1958.
    etape: Le soulèvement d'Alger a lieu en mai 1958, avant l'adoption de la Constitution en septembre de la même année.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux événements voisins sont inversés. Lequel des deux a eu lieu en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus ancien (1946) et le plus récent (1962), puis range les deux événements de
      1958 entre eux.
  solution: De Gaulle se retire de la vie politique (1946), soulèvement à Alger (mai 1958), adoption de la Constitution par
    référendum (28 septembre 1958), réforme de l'élection du président au suffrage universel direct (1962).
- id: dates-cles-1958
  type: association
  difficulte: 2
  enonce: Relie chaque date à l'événement correspondant.
  reponse:
    gauche:
    - id: a
      texte: 28 septembre 1958
    - id: b
      texte: 4 octobre 1958
    - id: c
      texte: '1962'
    droite:
    - id: x
      texte: Adoption de la Constitution par référendum
    - id: y
      texte: Entrée en vigueur de la Constitution
    - id: z
      texte: Élection du président au suffrage universel direct
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Deux dates très proches concernent la même Constitution : l''une est le jour du vote, l''autre son entrée en
      vigueur quelques jours après.'
    methode: Le référendum a lieu fin septembre 1958 ; la Constitution entre en vigueur début octobre de la même année, quelques
      jours plus tard.
    etape: La réforme sur le suffrage universel direct pour le président a lieu bien plus tard, en 1962.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien laquelle des deux dates de 1958 correspond au vote et laquelle
      correspond à l'entrée en vigueur.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, 1962 correspond forcément à la réforme sur le suffrage universel direct, puis distingue
      les deux dates de 1958.
  solution: '28 septembre 1958 : adoption de la Constitution par référendum. 4 octobre 1958 : entrée en vigueur de la Constitution.
    1962 : élection du président au suffrage universel direct.'
- id: developpement-naissance-ve-republique
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique le contexte du retour au pouvoir de Charles de Gaulle en 1958.'
  criteres:
  - L'élève cite la crise algérienne qui fragilise la IVe République en 1958.
  - L'élève explique que le soulèvement d'Alger en mai 1958 provoque le retour au pouvoir de De Gaulle.
  - L'élève mentionne l'adoption de la nouvelle Constitution par référendum en septembre 1958, fondant la Ve République.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quelle guerre affaiblit la IVe République au milieu des années 1950 ?
    methode: Présente d'abord la crise algérienne, puis le soulèvement d'Alger, puis l'adoption de la nouvelle Constitution.
    etape: Tu peux commencer ainsi « En 1958, la IVe République traverse une grave crise liée à la guerre d'Algérie... »,
      puis continuer avec le soulèvement d'Alger.
  solution: En 1958, la IVe République traverse une grave crise liée à la guerre d'Algérie. En mai 1958, un soulèvement à
    Alger fragilise le gouvernement et provoque le retour au pouvoir du général de Gaulle, retiré de la politique depuis 1946.
    Il obtient les pleins pouvoirs pour rédiger une nouvelle Constitution, approuvée par référendum le 28 septembre 1958 et
    en vigueur depuis le 4 octobre 1958. Cette Constitution fonde la Ve République et renforce nettement le pouvoir exécutif.
    Ainsi, la crise algérienne de 1958 marque une rupture profonde dans les institutions françaises.
