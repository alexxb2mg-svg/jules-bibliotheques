format: 2
notion: naissance-ve-republique
version: 1
etat: verifiee
declencheurs:
- de Gaulle président
- nouvelle constitution
- crise de mai 1958
- cinquième République
- scrutin majoritaire
- retour de De Gaulle
- suffrage universel direct
prerequis:
- refondation-republicaine-liberation
essentiel: 'En 1958, la IVe République est confrontée à une grave crise politique liée à la guerre d''Algérie. À la suite
  d''un soulèvement à Alger en mai 1958, le général de Gaulle, retiré de la politique depuis 1946, revient au pouvoir : il
  devient président du Conseil et obtient les pleins pouvoirs pour rédiger une nouvelle Constitution.

  Cette Constitution, approuvée par référendum le 28 septembre 1958 (plus de 80 % de « oui »), fonde la Ve République, en
  vigueur depuis le 4 octobre 1958. Elle renforce nettement le pouvoir exécutif (président de la République et gouvernement)
  par rapport au Parlement, contrairement aux IIIe et IVe Républiques où le pouvoir législatif dominait. Charles de Gaulle
  devient le premier président de la Ve République. Ce pouvoir présidentiel est encore renforcé en 1962 par l''élection du
  président au suffrage universel direct.

  Le scrutin majoritaire aux élections législatives favorise en général une majorité stable à l''Assemblée nationale, soutien
  du gouvernement.'
methode:
- 'Retenir la date de naissance de la Ve République : la Constitution est adoptée par référendum le 28 septembre 1958, en
  vigueur depuis le 4 octobre 1958.'
- Situer le contexte de crise (guerre d'Algérie, mai 1958) qui amène le retour de De Gaulle.
- 'Insister sur la caractéristique principale de la Ve République : un exécutif renforcé par rapport aux républiques précédentes.'
- Ne pas confondre l'adoption de la Constitution (1958) et l'élection du président au suffrage universel direct (réforme de
  1962).
vocabulaire:
- terme: pouvoir exécutif
  definition: 'le pouvoir qui applique les lois : le président de la République et le gouvernement'
- terme: scrutin majoritaire
  definition: un mode d'élection où le candidat qui obtient le plus de voix dans sa circonscription est élu
erreurs_frequentes:
- Confondre la date de l'adoption de la Constitution par référendum (28 septembre 1958) et son entrée en vigueur (4 octobre
  1958).
- 'Croire que de Gaulle est élu président dès 1958 au suffrage universel direct : ce n''est le cas qu''à partir de la réforme
  de 1962.'
- Oublier le contexte de la guerre d'Algérie dans le retour au pouvoir de De Gaulle.
- 'Penser que la Ve République affaiblit le pouvoir exécutif : c''est l''inverse, elle le renforce nettement.'
exemple:
  enonce: Explique en une phrase pourquoi 1958 marque une rupture dans l'histoire politique française.
  solution: En 1958, une nouvelle Constitution, approuvée par référendum, fonde la Ve République et renforce durablement le
    pouvoir exécutif face au Parlement, mettant fin à l'instabilité gouvernementale de la IVe République.
exercices:
- id: annee-ve-republique
  type: nombre
  difficulte: 1
  enonce: En quelle année la Constitution qui fonde la Ve République est-elle adoptée par référendum ?
  reponse:
    valeur: 1958
    forme: entier
  indices:
    relance: C'est l'année du retour au pouvoir du général de Gaulle, après une crise liée à la guerre d'Algérie.
    methode: L'élection du président au suffrage universel direct arrive quatre ans plus tard. Recule de quatre ans pour trouver
      l'année de la Constitution.
    etape: Cette année se situe à la fin des années 1950, peu après le soulèvement d'Alger.
  pieges:
  - si:
      valeur: 1962
    relance: 1962, c'est l'année de la réforme sur l'élection du président au suffrage universel direct. La Constitution elle-même
      est adoptée quatre ans plus tôt.
  - si:
      valeur: 1946
    relance: 1946, c'est l'année où de Gaulle se retire de la politique. Il y revient bien plus tard, à la suite d'une crise
      liée à la guerre d'Algérie.
  solution: La Constitution de la Ve République est adoptée par référendum le 28 septembre 1958.
- id: reforme-1962
  type: choix
  difficulte: 1
  enonce: Que change la réforme de 1962 pour l'élection du président de la République ?
  reponse:
    options:
    - id: a
      texte: Le président est désormais élu au suffrage universel direct par tous les citoyens
    - id: b
      texte: Le président n'est plus élu, il est nommé par l'Assemblée nationale
    - id: c
      texte: Le président perd tous ses pouvoirs au profit du Parlement
    - id: d
      texte: La durée du mandat présidentiel est supprimée
    bonnes:
    - a
  indices:
    relance: Cette réforme renforce encore la légitimité du président, en changeant qui l'élit.
    methode: Avant 1962, le président était élu par un collège de grands électeurs, pas directement par les citoyens.
    etape: Cherche la réponse qui parle d'une élection par « tous les citoyens » ou « suffrage universel direct ».
  pieges:
  - si:
      contient:
      - b
    relance: 'C''est l''inverse : la réforme de 1962 rapproche l''élection du président des citoyens, elle ne la confie pas
      au Parlement.'
  - si:
      contient:
      - c
    relance: Au contraire, la Ve République renforce le pouvoir du président, elle ne l'affaiblit pas.
  - si:
      contient:
      - d
    relance: Cette réforme concerne le mode d'élection du président, pas la durée de son mandat.
  solution: À partir de 1962, le président de la République est élu au suffrage universel direct par l'ensemble des citoyens,
    ce qui renforce sa légitimité.
- id: contexte-retour-de-gaulle
  type: texte_court
  difficulte: 2
  enonce: Dans quelle ville a lieu, en mai 1958, le soulèvement qui provoque le retour au pouvoir du général de Gaulle ?
  reponse:
    acceptees:
    - Alger
    fautes_tolerees: 1
  indices:
    relance: Cette ville se trouve en Algérie, alors département français.
    methode: C'est la principale ville d'Algérie, théâtre d'une grave crise politique en 1958.
    etape: Le nom de cette ville commence par « Al- ».
  pieges:
  - si:
      valeur: Paris
    relance: Paris est la capitale française, mais le soulèvement qui déclenche la crise de 1958 a lieu ailleurs, en Algérie.
  solution: Le soulèvement de mai 1958 a lieu à Alger, en Algérie, alors département français.
- id: chronologie-ve-republique
  type: ordre
  difficulte: 2
  enonce: Range ces événements du plus ancien au plus récent.
  reponse:
    elements:
    - id: retrait
      texte: De Gaulle se retire de la vie politique
    - id: alger
      texte: Soulèvement à Alger
    - id: constitution
      texte: Adoption de la Constitution par référendum
    - id: reforme
      texte: Réforme de l'élection du président au suffrage universel direct
  indices:
    relance: Le retrait de De Gaulle de la politique est l'événement le plus ancien de cette liste.
    methode: Place d'abord 1946 (retrait) et 1962 (réforme), puis situe le soulèvement d'Alger et l'adoption de la Constitution,
      tous deux en 1958.
    etape: Le soulèvement d'Alger a lieu en mai 1958, avant l'adoption de la Constitution en septembre de la même année.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux événements voisins sont inversés. Lequel des deux a eu lieu en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement le plus ancien (1946) et le plus récent (1962), puis range les deux événements de
      1958 entre eux.
  solution: De Gaulle se retire de la vie politique (1946), soulèvement à Alger (mai 1958), adoption de la Constitution par
    référendum (28 septembre 1958), réforme de l'élection du président au suffrage universel direct (1962).
- id: dates-cles-1958
  type: association
  difficulte: 2
  enonce: Relie chaque date à l'événement correspondant.
  reponse:
    gauche:
    - id: a
      texte: 28 septembre 1958
    - id: b
      texte: 4 octobre 1958
    - id: c
      texte: '1962'
    droite:
    - id: x
      texte: Adoption de la Constitution par référendum
    - id: y
      texte: Entrée en vigueur de la Constitution
    - id: z
      texte: Élection du président au suffrage universel direct
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Deux dates très proches concernent la même Constitution : l''une est le jour du vote, l''autre son entrée en
      vigueur quelques jours après.'
    methode: Le référendum a lieu fin septembre 1958 ; la Constitution entre en vigueur début octobre de la même année, quelques
      jours plus tard.
    etape: La réforme sur le suffrage universel direct pour le président a lieu bien plus tard, en 1962.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien laquelle des deux dates de 1958 correspond au vote et laquelle
      correspond à l'entrée en vigueur.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, 1962 correspond forcément à la réforme sur le suffrage universel direct, puis distingue
      les deux dates de 1958.
  solution: '28 septembre 1958 : adoption de la Constitution par référendum. 4 octobre 1958 : entrée en vigueur de la Constitution.
    1962 : élection du président au suffrage universel direct.'
- id: developpement-naissance-ve-republique
  type: ouverte
  difficulte: 3
  enonce: 'Développement construit : explique le contexte du retour au pouvoir de Charles de Gaulle en 1958.'
  criteres:
  - L'élève cite la crise algérienne qui fragilise la IVe République en 1958.
  - L'élève explique que le soulèvement d'Alger en mai 1958 provoque le retour au pouvoir de De Gaulle.
  - L'élève mentionne l'adoption de la nouvelle Constitution par référendum en septembre 1958, fondant la Ve République.
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Quelle guerre affaiblit la IVe République au milieu des années 1950 ?
    methode: Présente d'abord la crise algérienne, puis le soulèvement d'Alger, puis l'adoption de la nouvelle Constitution.
    etape: Tu peux commencer ainsi « En 1958, la IVe République traverse une grave crise liée à la guerre d'Algérie... »,
      puis continuer avec le soulèvement d'Alger.
  solution: En 1958, la IVe République traverse une grave crise liée à la guerre d'Algérie. En mai 1958, un soulèvement à
    Alger fragilise le gouvernement et provoque le retour au pouvoir du général de Gaulle, retiré de la politique depuis 1946.
    Il obtient les pleins pouvoirs pour rédiger une nouvelle Constitution, approuvée par référendum le 28 septembre 1958 et
    en vigueur depuis le 4 octobre 1958. Cette Constitution fonde la Ve République et renforce nettement le pouvoir exécutif.
    Ainsi, la crise algérienne de 1958 marque une rupture profonde dans les institutions françaises.
- id: nblm-quelle-crise-politique-est-a-l-origine-d-1
  type: choix
  difficulte: 2
  enonce: Quelle crise politique est à l'origine du retour de De Gaulle au pouvoir en mai 1958 ?
  reponse:
    options:
    - id: o1
      texte: La guerre d'Algérie et le soulèvement d'Alger en mai 1958.
    - id: o2
      texte: La défaite militaire de la France lors de la guerre d'Indochine.
    - id: o3
      texte: La crise économique mondiale consécutive au krach boursier de 1929.
    - id: o4
      texte: La démission du gouvernement lors de la Libération de la France en 1944.
    bonnes:
    - o1
  indices:
    relance: Pense au conflit colonial majeur qui affaiblissait la IVe République à la fin des années 1950.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de chronologie : la guerre d''Indochine s''est achevée en 1954 (accords de Genève), avant la crise de
      mai 1958.'
  - si:
      contient:
      - o3
    relance: 'Erreur de période : la Grande Dépression de 1929 concerne l''entre-deux-guerres, pas la fin de la IVe République.'
  - si:
      contient:
      - o4
    relance: 'Confusion historique : la Libération a eu lieu en 1944 et de Gaulle s''est retiré de la vie politique en 1946.'
  solution: La guerre d'Algérie et le soulèvement d'Alger en mai 1958. C'est la crise politique liée à la guerre d'Algérie
    et au soulèvement à Alger qui amène le général de Gaulle à revenir au pouvoir.
- id: nblm-de-quelle-maniere-la-nouvelle-constituti-2
  type: choix
  difficulte: 2
  enonce: De quelle manière la nouvelle Constitution fondant la Cinquième République est-elle adoptée en 1958 ?
  reponse:
    options:
    - id: o1
      texte: Par un référendum approuvé par les Français le 28 septembre 1958.
    - id: o2
      texte: Par un vote unique de l'Assemblée nationale à la majorité absolue.
    - id: o3
      texte: Par l'élection présidentielle organisée au suffrage universel direct.
    - id: o4
      texte: Par la signature des traités de Rome instaurant le marché commun.
    bonnes:
    - o1
  indices:
    relance: Cherche le mode de consultation populaire directe sur un texte constitutionnel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la Constitution n''a pas été votée uniquement par les députés, mais directement par le peuple
      via un référendum.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''élection du président au suffrage universel direct est une réforme ultérieure votée en
      1962.'
  - si:
      contient:
      - o4
    relance: 'Confusion de sujet : les traités de Rome ont été signés en 1957 et concernent la création de la CEE.'
  solution: Par un référendum approuvé par les Français le 28 septembre 1958. La nouvelle Constitution a été soumise au vote
    direct des citoyens par référendum et approuvée à plus de 80 % de oui.
- id: nblm-quelle-est-la-transformation-majeure-app-3
  type: choix
  difficulte: 2
  enonce: Quelle est la transformation majeure apportée par la cinquième République par rapport aux régimes précédents ?
  reponse:
    options:
    - id: o1
      texte: Elle renforce nettement le pouvoir exécutif par rapport au Parlement.
    - id: o2
      texte: Elle supprime le rôle du président de la République au profit du Parlement.
    - id: o3
      texte: Elle confie tous les pouvoirs aux députés en affaiblissant le gouvernement.
    - id: o4
      texte: Elle supprime le droit de vote des citoyens pour les élections législatives.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la branche du pouvoir qui réunit le président de la République et le gouvernement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Contresens : la Ve République renforce au contraire la figure présidentielle et l''exécutif.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la prédominance du pouvoir législatif (Parlement) caractérisait la IVe République, et non la Ve.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la Ve République demeure un régime démocratique fondé sur des élections régulières au suffrage universel.'
  solution: 'Elle renforce nettement le pouvoir exécutif par rapport au Parlement. C''est la rupture essentielle : contrairement
    aux IIIe et IVe Républiques dominées par le Parlement, la Ve République donne une place prépondérante au pouvoir exécutif.'
- id: nblm-quel-est-l-objectif-principal-du-scrutin-4
  type: choix
  difficulte: 2
  enonce: Quel est l'objectif principal du scrutin majoritaire adopté pour les élections législatives sous la Cinquième République
    ?
  reponse:
    options:
    - id: o1
      texte: Favoriser l'émergence d'une majorité stable à l'Assemblée nationale.
    - id: o2
      texte: Permettre d'élire directement le président de la République.
    - id: o3
      texte: Garantir qu'aucun parti politique ne puisse obtenir la majorité des sièges.
    - id: o4
      texte: Remplacer le travail des députés par celui des grands électeurs du Sénat.
    bonnes:
    - o1
  indices:
    relance: Pense à la recherche de stabilité gouvernementale pour éviter les chutes ministérielles de la IVe République.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : le scrutin majoritaire aux législatives concerne l''élection des députés à l''Assemblée nationale.'
  - si:
      contient:
      - o3
    relance: 'Incompréhension : au contraire, ce mode de scrutin cherche à dégager une majorité nette.'
  - si:
      contient:
      - o4
    relance: 'Faux : les députés continuent d''être élus directement dans leurs circonscriptions.'
  solution: 'Favoriser l''émergence d''une majorité stable à l''Assemblée nationale. C''est le rôle du scrutin majoritaire
    : éviter l''éparpillement des voix pour soutenir durablement le gouvernement.'
- id: nblm-en-quelle-annee-l-election-du-president-5
  type: choix
  difficulte: 2
  enonce: En quelle année l'élection du président de la République au suffrage universel direct est-elle introduite, renforçant
    la position de de Gaulle président ?
  reponse:
    options:
    - id: o1
      texte: En 1962.
    - id: o2
      texte: En 1958.
    - id: o3
      texte: En 1944.
    - id: o4
      texte: En 1968.
    bonnes:
    - o1
  indices:
    relance: Ne confonds pas l'année d'adoption de la Constitution et l'année de la réforme de l'élection présidentielle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur très fréquente : en 1958, la Constitution est adoptée, mais le président est d''abord élu par un collège
      de grands électeurs.'
  - si:
      contient:
      - o3
    relance: 'Erreur de date : 1944 correspond à l''ordonnance accordant le droit de vote aux femmes.'
  - si:
      contient:
      - o4
    relance: 'Confusion : 1968 est l''année de la crise sociale et des événements de Mai 68.'
  solution: 'En 1962. C''est exact : la réforme constitutionnelle de 1962 fait élire le président directement par les citoyens,
    renforçant sa légitimité.'
- id: nblm-quelles-affirmations-concernant-les-etap-6
  type: choix
  difficulte: 3
  enonce: Quelles affirmations concernant les étapes de la naissance de la Cinquième République sont exactes ? (2 réponses
    bonnes) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La nouvelle Constitution est approuvée par référendum le 28 septembre 1958.
    - id: o2
      texte: La nouvelle Constitution entre officiellement en vigueur le 4 octobre 1958.
    - id: o3
      texte: Le général de Gaulle est élu au suffrage universel direct dès mai 1958.
    - id: o4
      texte: La nouvelle Constitution est rédigée sous la direction de Léon Blum.
    bonnes:
    - o1
    - o2
  indices:
    relance: Coche les deux dates de l'automne 1958 qui marquent le vote et l'entrée en vigueur de la Constitution.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur classique : en mai 1958, de Gaulle devient président du Conseil. L''élection au suffrage universel direct
      date de 1962.'
  - si:
      contient:
      - o4
    relance: 'Erreur de personnage : Léon Blum était le chef du Front populaire en 1936, pas le rédacteur de la Constitution
      de 1958.'
  solution: 'La nouvelle Constitution est approuvée par référendum le 28 septembre 1958 ; La nouvelle Constitution entre officiellement
    en vigueur le 4 octobre 1958. C''est exact : le vote populaire par référendum s''est tenu le 28 septembre 1958 avec plus
    de 80 % de oui.'
- id: nblm-la-constitution-de-1958-renforce-netteme-7
  type: texte_court
  difficulte: 1
  enonce: La Constitution de 1958 renforce nettement le pouvoir __________, composé du président de la République et du gouvernement.
  reponse:
    acceptees:
    - exécutif
    fautes_tolerees: 1
  indices:
    relance: Donne le qualificatif du pouvoir politique qui applique les lois et dirige l'administration.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: exécutif. Le pouvoir exécutif est le pouvoir chargé d'appliquer les lois, qui est renforcé sous la Ve République
    face au Parlement.
- id: nblm-provoquant-le-retour-de-de-gaulle-au-pou-8
  type: texte_court
  difficulte: 1
  enonce: Provoquant le retour de De Gaulle au pouvoir en mai 1958, la grave crise politique de la IVe République est liée
    à la guerre d'__________.
  reponse:
    acceptees:
    - Algérie
    fautes_tolerees: 1
  indices:
    relance: Nomme le territoire dont le conflit d'indépendance provoque la chute de la IVe République.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: Algérie. C'est la crise politique causée par la guerre d'Algérie et le soulèvement d'Alger en mai 1958 qui ramène
    de Gaulle au pouvoir.
