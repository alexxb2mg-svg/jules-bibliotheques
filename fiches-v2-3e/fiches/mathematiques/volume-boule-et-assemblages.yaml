    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: solide composé. Un solide composé est le terme exact désignant la réunion de plusieurs solides simples.
- id: demi-boule-exact
  type: nombre
  difficulte: 2
  enonce: Un bol a la forme d'une demi-boule de rayon 3 cm. Son volume exact s'écrit k × π cm³. Quelle est la valeur de k
    ?
  reponse:
    valeur: 18
    forme: entier
  indices:
    relance: Une demi-boule est la moitié d'une boule. Écris d'abord le volume de la boule entière.
    methode: Volume de la demi-boule = 1/2 × 4/3 × π × r³ = 2/3 × π × r³. Garde π de côté.
    etape: r³ = 3 × 3 × 3 = 27. Il reste à calculer 2/3 de 27.
  pieges:
  - si:
      valeur: 36
    relance: Tu as calculé le volume de la boule entière. Le bol n'en est que la moitié.
  - si:
      valeur: 27
    relance: Tu as calculé 3³, mais tu as oublié de multiplier par 2/3.
  - si:
      valeur: 6
    relance: Tu as mis 3 au carré ? Pour un volume, le rayon est au cube.
  solution: V = 1/2 × 4/3 × π × 3³ = 2/3 × π × 27 = 18π cm³, donc k = 18.
- id: silo-cylindre-cone
  type: nombre
  difficulte: 3
  enonce: Un silo est formé d'un cylindre de rayon 2 m et de hauteur 6 m, surmonté d'un cône de même rayon et de hauteur 3
    m. Son volume exact s'écrit k × π m³. Quelle est la valeur de k ?
  reponse:
    valeur: 28
    forme: entier
  indices:
    relance: De quels deux solides est fait le silo ? Écris la formule du volume de chacun.
    methode: 'Cylindre : π × r² × h. Cône : 1/3 × π × r² × h. Calcule chacun en gardant π, puis additionne.'
    etape: 'Cylindre : π × 2² × 6 = 24π m³. Calcule maintenant le volume du cône.'
  pieges:
  - si:
      valeur: 36
    relance: As-tu oublié le 1/3 dans le volume du cône ? Refais le calcul du cône.
  - si:
      valeur: 24
    relance: Tu n'as compté que le cylindre. N'oublie pas le cône au-dessus.
  - si:
      valeur: 4
    relance: Tu n'as compté que le cône. N'oublie pas le cylindre en dessous.
  solution: 'Cylindre : π × 2² × 6 = 24π m³. Cône : 1/3 × π × 2² × 3 = 4π m³. Total : 24π + 4π = 28π m³, donc k = 28.'
