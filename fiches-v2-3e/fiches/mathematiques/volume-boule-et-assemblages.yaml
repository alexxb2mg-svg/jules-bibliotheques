format: 2
notion: volume-boule-et-assemblages
version: 1
etat: verifiee
declencheurs:
- ballon rond
- demi-sphère
- quatre tiers pi
- cornet de glace
- silo à grain
- solide composé
prerequis:
- 4e-volumes-pyramide-cone
- calcul-nombres-rationnels
essentiel: 'La sphère est la « peau » d''une balle ; la boule est la sphère avec tout son intérieur.

  Le volume d''une boule de rayon r est V = 4/3 × π × r³.

  Attention : le rayon, pas le diamètre (rayon = diamètre ÷ 2), et r au cube (r × r × r).

  Une demi-boule a pour volume la moitié : 2/3 × π × r³.


  Pour un assemblage de solides, on découpe en solides connus, on calcule chaque volume, puis on additionne (ou on soustrait
  si on enlève un morceau).

  Rappels : pavé = L × l × h ; prisme et cylindre = aire de la base × hauteur (cylindre : π × r² × h) ; pyramide et cône =
  1/3 × aire de la base × hauteur (cône : 1/3 × π × r² × h).

  On garde π dans les calculs et on n''arrondit qu''à la fin, comme l''énoncé le demande.

  '
methode:
- Repérer les solides qui composent l'objet (cylindre, cône, demi-boule, pavé...).
- Noter pour chacun le rayon (et non le diamètre) et la hauteur, dans la même unité.
- Écrire la formule de chaque volume, puis remplacer les lettres par les valeurs.
- Additionner (ou soustraire) les volumes, en gardant π jusqu'au bout si possible.
- Arrondir seulement à la fin, comme demandé, et écrire l'unité de volume (cm³, m³...).
vocabulaire:
- terme: sphère
  definition: Ensemble des points situés à la même distance r d'un point O, le centre. C'est une surface.
- terme: boule
  definition: La sphère et tout son intérieur. C'est un solide, qui a un volume.
- terme: valeur exacte
  definition: Résultat écrit avec π, sans arrondi, par exemple 36π cm³.
erreurs_frequentes:
- Utiliser le diamètre à la place du rayon.
- Oublier le 4/3, ou mettre le rayon au carré au lieu du cube.
- Confondre le volume de la boule avec l'aire de la sphère (4 × π × r²).
- Compter une boule entière quand l'objet n'a qu'une demi-boule.
- Oublier le 1/3 dans le volume du cône ou de la pyramide.
- Arrondir trop tôt, ce qui fausse le résultat final.
exemple:
  enonce: Calculer le volume exact, puis arrondi au cm³, d'une boule de rayon 4 cm.
  solution: V = 4/3 × π × 4³ = 4/3 × π × 64 = 256π/3 cm³, soit environ 268 cm³.
exercices:
- id: formule-du-volume
  type: choix
  difficulte: 1
  enonce: Quelle formule donne le volume d'une boule de rayon r ?
  reponse:
    options:
    - id: a
      texte: 4 × π × r²
    - id: b
      texte: 4/3 × π × r³
    - id: c
      texte: π × r² × h
    - id: d
      texte: 1/3 × π × r² × h
    bonnes:
    - b
  indices:
    relance: Un volume se mesure en cm³. Quelle puissance de r doit apparaître dans la formule ?
    methode: Élimine les formules qui ont une hauteur h (une boule n'en a pas) et celles qui donnent une aire.
    etape: 'La formule c est celle du cylindre, la d celle du cône. Il reste deux formules : laquelle donne des cm³ ?'
  pieges:
  - si:
      contient:
      - a
    relance: Cette formule donne une aire (des cm²), celle de la sphère. Un volume demande r au cube.
  - si:
      contient:
      - c
    relance: 'Cette formule utilise une hauteur h : c''est celle d''un cylindre. Une boule n''a pas de hauteur.'
  - si:
      contient:
      - d
    relance: 'Cette formule utilise une hauteur h : c''est celle d''un cône. Une boule n''a pas de hauteur.'
  solution: V = 4/3 × π × r³ (réponse b). 4 × π × r² est l'aire de la sphère, les deux autres sont les volumes du cylindre
    et du cône.
- id: boule-de-decoration
  type: nombre
  difficulte: 1
  enonce: Une boule de décoration pleine a un diamètre de 6 cm. Calcule son volume, arrondi au cm³ près. Écris seulement le
    nombre.
  reponse:
    valeur: 113
    tolerance: 0.5
  indices:
    relance: La formule utilise le rayon. Que vaut le rayon si le diamètre mesure 6 cm ?
    methode: Calcule V = 4/3 × π × r³ avec la touche π de la calculatrice, puis arrondis à l'unité.
    etape: Le rayon vaut 3 cm, donc r³ = 3 × 3 × 3 = 27. Il reste à calculer 4/3 × π × 27.
  pieges:
  - si:
      valeur: 905
    relance: 'Tu as pris 6 cm comme rayon. Mais 6 cm, c''est le diamètre : quel est le rayon ?'
  - si:
      valeur: 85
    relance: As-tu oublié le 4/3 dans la formule ? Reprends V = 4/3 × π × r³.
  - si:
      valeur: 38
    relance: 'Tu as mis le rayon au carré. Pour un volume, le rayon est au cube : r × r × r.'
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie le rayon (la moitié du diamètre), puis refais le calcul 4/3 × π × r³ en une seule fois.
  solution: Rayon = 6 ÷ 2 = 3 cm. V = 4/3 × π × 3³ = 4/3 × π × 27 = 36π ≈ 113,1 cm³, soit 113 cm³ arrondi à l'unité.
- id: volume-exact-en-pi
  type: nombre
  difficulte: 2
  enonce: Une boule a un rayon de 6 cm. Son volume exact s'écrit k × π cm³. Quelle est la valeur du nombre k ?
  reponse:
    valeur: 288
    forme: entier
  indices:
    relance: Dans la formule 4/3 × π × r³, quelle partie reste quand on met π de côté ?
    methode: Calcule d'abord r³, puis multiplie par 4/3 (multiplie par 4, puis divise par 3).
    etape: r³ = 6 × 6 × 6 = 216. Il reste à calculer 4/3 × 216.
  pieges:
  - si:
      valeur: 216
    relance: Tu as bien calculé 6³, mais tu as oublié de multiplier par 4/3.
  - si:
      valeur: 48
    relance: Tu as mis 6 au carré. Pour un volume, le rayon est au cube.
  - si:
      valeur: 144
    relance: 4 × 6² correspond à l'aire de la sphère, pas au volume de la boule. Reprends la formule du volume.
  - si:
      diagnostic: valeur_fausse
    relance: 'Écris 4/3 × π × 6³ et garde π de côté : que vaut 4/3 × 6³ ?'
  solution: V = 4/3 × π × 6³ = 4/3 × π × 216 = (4 × 216 ÷ 3) × π = 288π cm³, donc k = 288.
- id: cornet-de-glace
  type: nombre
  difficulte: 2
  enonce: Un cornet de glace est un cône de rayon 3 cm et de hauteur 10 cm, surmonté d'une demi-boule de rayon 3 cm. Le cornet
    et la demi-boule sont remplis de glace. Calcule le volume total de glace, arrondi au cm³ près. Écris seulement le nombre.
  reponse:
    valeur: 151
    tolerance: 0.5
  indices:
    relance: Quels sont les deux solides qui forment ce cornet ? Écris la formule du volume de chacun.
    methode: 'Cône : 1/3 × π × r² × h. Demi-boule : la moitié de 4/3 × π × r³. Additionne les deux, puis arrondis.'
    etape: 'Volume du cône : 1/3 × π × 3² × 10 = 30π cm³. Calcule maintenant le volume de la demi-boule.'
  pieges:
  - si:
      valeur: 339
    relance: As-tu oublié le 1/3 dans le volume du cône ?
  - si:
      valeur: 207
    relance: Tu as compté une boule entière. Sur le cornet, il n'y a qu'une demi-boule.
  - si:
      valeur: 94
    relance: Tu n'as compté que le cône. N'oublie pas la demi-boule de glace posée dessus.
  - si:
      diagnostic: valeur_fausse
    relance: Calcule séparément le cône et la demi-boule, en gardant π, puis additionne.
  solution: 'Cône : 1/3 × π × 3² × 10 = 30π cm³. Demi-boule : 1/2 × 4/3 × π × 3³ = 18π cm³. Total : 30π + 18π = 48π ≈ 150,8
    cm³, soit 151 cm³ arrondi à l''unité.'
- id: bocal-spherique-en-litres
  type: nombre
  difficulte: 3
  enonce: Un bocal a la forme d'une boule de rayon 9 cm (on néglige l'épaisseur du verre). Combien de litres d'eau peut-il
    contenir ? Donne le résultat arrondi au dixième de litre. Rappel, 1 L = 1 dm³ = 1 000 cm³.
  reponse:
    valeur: 3.1
    tolerance: 0.05
  indices:
    relance: Dans quelle unité obtiens-tu le volume si le rayon est en cm ? Et dans quelle unité faut-il répondre ?
    methode: Calcule le volume en cm³ avec 4/3 × π × r³, puis convertis en litres en divisant par 1 000.
    etape: r³ = 9 × 9 × 9 = 729, donc V = 4/3 × π × 729 = 972π cm³. Il reste à convertir en litres.
  pieges:
  - si:
      valeur: 3054
    relance: Ce nombre est un volume en cm³. Combien de cm³ y a-t-il dans un litre ?
  - si:
      valeur: 3053.6
    relance: Ce nombre est un volume en cm³. Combien de cm³ y a-t-il dans un litre ?
  - si:
      valeur: 30.5
    relance: 'Tu as divisé par 100. Or 1 L = 1 dm³ = 1 000 cm³ : par combien faut-il diviser ?'
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie le volume en cm³ (rayon au cube), puis la conversion : 1 L = 1 000 cm³.'
  solution: V = 4/3 × π × 9³ = 972π ≈ 3 053,6 cm³. Comme 1 L = 1 000 cm³, V ≈ 3,0536 L, soit 3,1 L arrondi au dixième.
- id: boule-dans-un-cylindre
  type: ouverte
  difficulte: 3
  enonce: 'Une boule de rayon 5 cm est posée dans une boîte cylindrique de rayon 5 cm et de hauteur 10 cm : elle touche le
    fond, le couvercle et la paroi. Montre que la boule occupe exactement les deux tiers du volume de la boîte.'
  criteres:
  - 'L''élève calcule le volume de la boîte : π × 5² × 10 = 250π cm³.'
  - 'L''élève calcule le volume de la boule : 4/3 × π × 5³ = 500π/3 cm³.'
  - L'élève compare les deux volumes (quotient égal à 2/3, ou 2/3 de 250π égal à 500π/3) et conclut.
  indices:
    relance: Quels sont les deux volumes à comparer ? Écris la formule de chacun.
    methode: Calcule les deux volumes en gardant π (valeurs exactes), puis calcule les 2/3 du volume de la boîte.
    etape: 'Volume de la boîte : π × 5² × 10 = 250π cm³. Calcule le volume de la boule, puis 2/3 de 250π.'
  solution: 'Boîte : π × 5² × 10 = 250π cm³. Boule : 4/3 × π × 5³ = 500π/3 cm³. Or 2/3 × 250π = 500π/3 : la boule occupe bien
    les deux tiers de la boîte.'
