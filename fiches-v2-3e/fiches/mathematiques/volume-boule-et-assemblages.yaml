# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: volume-boule-et-assemblages
version: 3
etat: verifiee
declencheurs:
- ballon rond
- demi-sphère
- quatre tiers pi
- cornet de glace
- silo à grain
- solide composé
- volume d'un silo
- bol en demi-sphère
- capacité d'une boule
prerequis:
- 4e-volumes-pyramide-cone
- calcul-nombres-rationnels
essentiel: 'La sphère est la « peau » d''une balle : c''est une surface, ensemble des points situés à la même distance r (le
  rayon) d''un point O (le centre). La boule est la sphère avec tout son intérieur : c''est un solide, qui a un volume.


  Volume d''une boule de rayon r : V = 4/3 × π × r³.

  Attention : c''est le rayon, pas le diamètre (rayon = diamètre ÷ 2), et r est au cube (r × r × r).

  Exemple : r = 3 cm donne V = 4/3 × π × 27 = 36π cm³, soit environ 113 cm³.

  Une demi-boule a pour volume la moitié : 2/3 × π × r³.


  Rappels des volumes de cycle 4.

  Pavé : L × l × h. Cube : c³.

  Prisme et cylindre : aire de la base × hauteur (cylindre : π × r² × h).

  Pyramide et cône : 1/3 × aire de la base × hauteur (cône : 1/3 × π × r² × h).


  Assemblage de solides. On découpe l''objet en solides connus, on calcule chaque volume, puis on additionne (ou on soustrait
  si on enlève un morceau, comme un trou). Un cornet de glace est un cône surmonté d''une demi-boule ; un silo est un cylindre
  surmonté d''un cône ou d''une demi-boule.


  Unités : si les longueurs sont en cm, le volume est en cm³. Conversions : 1 L = 1 dm³ = 1 000 cm³ ; 1 m³ = 1 000 L.


  Valeur exacte : on garde π (par exemple 36π cm³) et on n''arrondit qu''à la fin, comme l''énoncé le demande.


  Au brevet, on attend : écrire la formule, remplacer par les valeurs du bon rayon, donner la valeur exacte ou arrondie avec
  l''unité, et savoir traiter un solide composé.

  '
methode:
- Repérer les solides qui composent l'objet (cylindre, cône, demi-boule, pavé...).
- Noter pour chacun le rayon (et non le diamètre) et la hauteur, dans la même unité.
- Écrire la formule de chaque volume, puis remplacer les lettres par les valeurs.
- Additionner (ou soustraire) les volumes, en gardant π jusqu'au bout si possible.
- Arrondir seulement à la fin, comme demandé, et écrire l'unité de volume (cm³, m³...).
- 'Convertir si la question demande des litres : 1 L = 1 000 cm³.'
vocabulaire:
- terme: sphère
  definition: Ensemble des points situés à la même distance r d'un point O, le centre. C'est une surface.
- terme: boule
  definition: La sphère et tout son intérieur. C'est un solide, qui a un volume.
- terme: rayon
  definition: Distance entre le centre et un point de la sphère ; c'est la moitié du diamètre.
- terme: diamètre
  definition: Distance entre deux points opposés de la sphère, en passant par le centre.
- terme: volume
  definition: Mesure de la place occupée par un solide, en cm³, m³ ou en litres.
- terme: demi-boule
  definition: La moitié d'une boule, coupée par un plan passant par le centre.
- terme: solide composé
  definition: Objet formé de plusieurs solides simples assemblés.
- terme: valeur exacte
  definition: Résultat écrit avec π, sans arrondi, par exemple 36π cm³.
erreurs_frequentes:
- Utiliser le diamètre à la place du rayon.
- Oublier le 4/3, ou mettre le rayon au carré au lieu du cube.
- Confondre le volume de la boule avec l'aire de la sphère (4 × π × r²).
- Compter une boule entière quand l'objet n'a qu'une demi-boule.
- Oublier le 1/3 dans le volume du cône ou de la pyramide.
exemple:
  enonce: Calculer le volume exact, puis arrondi au cm³, d'une boule de rayon 4 cm.
  solution: V = 4/3 × π × 4³ = 4/3 × π × 64 = 256π/3 cm³, soit environ 268 cm³.
exercices:
- id: formule-du-volume
  type: choix
  difficulte: 1
  enonce: Quelle formule donne le volume d'une boule de rayon r ?
  reponse:
    options:
    - id: a
      texte: 4 × π × r²
    - id: b
      texte: 4/3 × π × r³
    - id: c
      texte: π × r² × h
    - id: d
      texte: 1/3 × π × r² × h
    bonnes:
    - b
  indices:
    relance: Un volume se mesure en cm³. Quelle puissance de r doit apparaître dans la formule ?
    methode: Élimine les formules qui ont une hauteur h (une boule n'en a pas) et celles qui donnent une aire.
    etape: 'La formule c est celle du cylindre, la d celle du cône. Il reste deux formules : laquelle donne des cm³ ?'
  pieges:
  - si:
      contient:
      - a
    relance: Cette formule donne une aire (des cm²), celle de la sphère. Un volume demande r au cube.
  - si:
      contient:
      - c
    relance: 'Cette formule utilise une hauteur h : c''est celle d''un cylindre. Une boule n''a pas de hauteur.'
  - si:
      contient:
      - d
    relance: 'Cette formule utilise une hauteur h : c''est celle d''un cône. Une boule n''a pas de hauteur.'
  solution: V = 4/3 × π × r³ (réponse b). 4 × π × r² est l'aire de la sphère, les deux autres sont les volumes du cylindre
    et du cône.
- id: boule-de-decoration
  type: nombre
  difficulte: 1
  enonce: Une boule de décoration pleine a un diamètre de 6 cm. Calcule son volume, arrondi au cm³ près. Écris seulement le
    nombre.
  reponse:
    valeur: 113
    tolerance: 0.5
  indices:
    relance: La formule utilise le rayon. Que vaut le rayon si le diamètre mesure 6 cm ?
    methode: Calcule V = 4/3 × π × r³ avec la touche π de la calculatrice, puis arrondis à l'unité.
    etape: Le rayon vaut 3 cm, donc r³ = 3 × 3 × 3 = 27. Il reste à calculer 4/3 × π × 27.
  pieges:
  - si:
      valeur: 905
    relance: 'Tu as pris 6 cm comme rayon. Mais 6 cm, c''est le diamètre : quel est le rayon ?'
  - si:
      valeur: 85
    relance: As-tu oublié le 4/3 dans la formule ? Reprends V = 4/3 × π × r³.
  - si:
      valeur: 38
    relance: 'Tu as mis le rayon au carré. Pour un volume, le rayon est au cube : r × r × r.'
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie le rayon (la moitié du diamètre), puis refais le calcul 4/3 × π × r³ en une seule fois.
  solution: Rayon = 6 ÷ 2 = 3 cm. V = 4/3 × π × 3³ = 4/3 × π × 27 = 36π ≈ 113,1 cm³, soit 113 cm³ arrondi à l'unité.
- id: volume-exact-en-pi
  type: nombre
  difficulte: 2
  enonce: Une boule a un rayon de 6 cm. Son volume exact s'écrit k × π cm³. Quelle est la valeur du nombre k ?
  reponse:
    valeur: 288
    forme: entier
  indices:
    relance: Dans la formule 4/3 × π × r³, quelle partie reste quand on met π de côté ?
    methode: Calcule d'abord r³, puis multiplie par 4/3 (multiplie par 4, puis divise par 3).
    etape: r³ = 6 × 6 × 6 = 216. Il reste à calculer 4/3 × 216.
  pieges:
  - si:
      valeur: 216
    relance: Tu as bien calculé 6³, mais tu as oublié de multiplier par 4/3.
  - si:
      valeur: 48
    relance: Tu as mis 6 au carré. Pour un volume, le rayon est au cube.
  - si:
      valeur: 144
    relance: 4 × 6² correspond à l'aire de la sphère, pas au volume de la boule. Reprends la formule du volume.
  - si:
      diagnostic: valeur_fausse
    relance: 'Écris 4/3 × π × 6³ et garde π de côté : que vaut 4/3 × 6³ ?'
  solution: V = 4/3 × π × 6³ = 4/3 × π × 216 = (4 × 216 ÷ 3) × π = 288π cm³, donc k = 288.
- id: cornet-de-glace
  type: nombre
  difficulte: 2
  enonce: Un cornet de glace est un cône de rayon 3 cm et de hauteur 10 cm, surmonté d'une demi-boule de rayon 3 cm. Le cornet
    et la demi-boule sont remplis de glace. Calcule le volume total de glace, arrondi au cm³ près. Écris seulement le nombre.
  reponse:
    valeur: 151
    tolerance: 0.5
  indices:
    relance: Quels sont les deux solides qui forment ce cornet ? Écris la formule du volume de chacun.
    methode: 'Cône : 1/3 × π × r² × h. Demi-boule : la moitié de 4/3 × π × r³. Additionne les deux, puis arrondis.'
    etape: 'Volume du cône : 1/3 × π × 3² × 10 = 30π cm³. Calcule maintenant le volume de la demi-boule.'
  pieges:
  - si:
      valeur: 339
    relance: As-tu oublié le 1/3 dans le volume du cône ?
  - si:
      valeur: 207
    relance: Tu as compté une boule entière. Sur le cornet, il n'y a qu'une demi-boule.
  - si:
      valeur: 94
    relance: Tu n'as compté que le cône. N'oublie pas la demi-boule de glace posée dessus.
  - si:
      diagnostic: valeur_fausse
    relance: Calcule séparément le cône et la demi-boule, en gardant π, puis additionne.
  solution: 'Cône : 1/3 × π × 3² × 10 = 30π cm³. Demi-boule : 1/2 × 4/3 × π × 3³ = 18π cm³. Total : 30π + 18π = 48π ≈ 150,8
    cm³, soit 151 cm³ arrondi à l''unité.'
- id: bocal-spherique-en-litres
  type: nombre
  difficulte: 3
  enonce: Un bocal a la forme d'une boule de rayon 9 cm (on néglige l'épaisseur du verre). Combien de litres d'eau peut-il
    contenir ? Donne le résultat arrondi au dixième de litre. Rappel, 1 L = 1 dm³ = 1 000 cm³.
  reponse:
    valeur: 3.1
    tolerance: 0.05
  indices:
    relance: Dans quelle unité obtiens-tu le volume si le rayon est en cm ? Et dans quelle unité faut-il répondre ?
    methode: Calcule le volume en cm³ avec 4/3 × π × r³, puis convertis en litres en divisant par 1 000.
    etape: r³ = 9 × 9 × 9 = 729, donc V = 4/3 × π × 729 = 972π cm³. Il reste à convertir en litres.
  pieges:
  - si:
      valeur: 3054
    relance: Ce nombre est un volume en cm³. Combien de cm³ y a-t-il dans un litre ?
  - si:
      valeur: 3053.6
    relance: Ce nombre est un volume en cm³. Combien de cm³ y a-t-il dans un litre ?
  - si:
      valeur: 30.5
    relance: 'Tu as divisé par 100. Or 1 L = 1 dm³ = 1 000 cm³ : par combien faut-il diviser ?'
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie le volume en cm³ (rayon au cube), puis la conversion : 1 L = 1 000 cm³.'
  solution: V = 4/3 × π × 9³ = 972π ≈ 3 053,6 cm³. Comme 1 L = 1 000 cm³, V ≈ 3,0536 L, soit 3,1 L arrondi au dixième.
- id: boule-dans-un-cylindre
  type: ouverte
  difficulte: 3
  enonce: 'Une boule de rayon 5 cm est posée dans une boîte cylindrique de rayon 5 cm et de hauteur 10 cm : elle touche le
    fond, le couvercle et la paroi. Montre que la boule occupe exactement les deux tiers du volume de la boîte.'
  criteres:
  - 'L''élève calcule le volume de la boîte : π × 5² × 10 = 250π cm³.'
  - 'L''élève calcule le volume de la boule : 4/3 × π × 5³ = 500π/3 cm³.'
  - L'élève compare les deux volumes (quotient égal à 2/3, ou 2/3 de 250π égal à 500π/3) et conclut.
  indices:
    relance: Quels sont les deux volumes à comparer ? Écris la formule de chacun.
    methode: Calcule les deux volumes en gardant π (valeurs exactes), puis calcule les 2/3 du volume de la boîte.
    etape: 'Volume de la boîte : π × 5² × 10 = 250π cm³. Calcule le volume de la boule, puis 2/3 de 250π.'
  solution: 'Boîte : π × 5² × 10 = 250π cm³. Boule : 4/3 × π × 5³ = 500π/3 cm³. Or 2/3 × 250π = 500π/3 : la boule occupe bien
    les deux tiers de la boîte.'
- id: nblm-quelle-est-la-formule-permettant-de-calc-1
  type: choix
  difficulte: 2
  enonce: Quelle est la formule permettant de calculer le volume d'une boule (par exemple pour un ballon rond) de rayon r
    ?
  reponse:
    options:
    - id: o1
      texte: 4/3 × π × r³
    - id: o2
      texte: 4 × π × r²
    - id: o3
      texte: 4/3 × π × r²
    - id: o4
      texte: π × r² × h
    bonnes:
    - o1
  indices:
    relance: Le volume dépend du rayon élevé au cube et comporte une fraction avec 3 au dénominateur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Cette formule donne l'aire de la surface d'une sphère, et non son volume.
  - si:
      contient:
      - o3
    relance: Attention, le rayon doit être élevé au cube (r³) pour un volume, et non au carré.
  - si:
      contient:
      - o4
    relance: Cette formule correspond au volume d'un cylindre de hauteur h, pas à celui d'une boule.
  solution: 4/3 × π × r³. C'est la formule officielle du volume d'une boule de rayon r.
- id: nblm-un-recipient-a-la-forme-d-une-demi-spher-2
  type: choix
  difficulte: 2
  enonce: Un récipient a la forme d'une demi-sphère de rayon r. Quelle formule permet de calculer son volume ?
  reponse:
    options:
    - id: o1
      texte: 2/3 × π × r³
    - id: o2
      texte: 4/3 × π × r³
    - id: o3
      texte: 1/3 × π × r³
    - id: o4
      texte: 2 × π × r²
    bonnes:
    - o1
  indices:
    relance: Divise par deux la formule du volume de la boule entière.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est le volume d'une boule entière ; il faut diviser par 2 pour obtenir celui d'une demi-sphère.
  - si:
      contient:
      - o3
    relance: 'Erreur de fraction : la moitié de 4/3 est 2/3 et non 1/3.'
  - si:
      contient:
      - o4
    relance: Cette formule comporte un rayon au carré au lieu d'un rayon au cube et ne donne pas un volume.
  solution: '2/3 × π × r³. Le volume d''une demi-sphère est la moitié de celui d''une boule entière : (1/2) × (4/3) × π ×
    r³ = 2/3 × π × r³.'
- id: nblm-un-cornet-de-glace-est-un-solide-compose-3
  type: choix
  difficulte: 2
  enonce: Un cornet de glace est un solide composé constitué d'un cône de hauteur h et d'une demi-sphère posée dessus, tous
    deux de rayon r. Quelle est la formule de son volume total ?
  reponse:
    options:
    - id: o1
      texte: 1/3 × π × r² × h + 2/3 × π × r³
    - id: o2
      texte: 1/3 × π × r² × h + 4/3 × π × r³
    - id: o3
      texte: π × r² × h + 2/3 × π × r³
    - id: o4
      texte: 1/3 × π × r² × h × 2/3 × π × r³
    bonnes:
    - o1
  indices:
    relance: Additionne le volume du cône et celui de la demi-sphère.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, la glace au-dessus du cornet forme une demi-sphère et non une boule complète.
  - si:
      contient:
      - o3
    relance: Le premier terme oublie le facteur 1/3 obligatoire pour le volume d'un cône.
  - si:
      contient:
      - o4
    relance: Il faut additionner les volumes des deux parties composant le solide et non les multiplier.
  solution: 1/3 × π × r² × h + 2/3 × π × r³. On additionne le volume du cône (1/3 × π × r² × h) et celui de la demi-sphère
    (2/3 × π × r³).
- id: nblm-un-silo-a-grain-reserve-au-stockage-est-4
  type: choix
  difficulte: 2
  enonce: Un silo à grain réservé au stockage est formé d'un cylindre de hauteur h et de rayon r surmonté d'une demi-sphère
    de même rayon r. Quel est le volume exact de ce silo à grain ?
  reponse:
    options:
    - id: o1
      texte: π × r² × h + 2/3 × π × r³
    - id: o2
      texte: π × r² × h + 4/3 × π × r³
    - id: o3
      texte: 1/3 × π × r² × h + 2/3 × π × r³
    - id: o4
      texte: π × r² × h - 2/3 × π × r³
    bonnes:
    - o1
  indices:
    relance: Combine le volume de la base cylindrique et le volume du toit en dôme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : le dôme du silo est une demi-sphère, pas une boule entière.'
  - si:
      contient:
      - o3
    relance: Le corps principal du silo est un cylindre, il ne faut donc pas appliquer le coefficient 1/3 du cône.
  - si:
      contient:
      - o4
    relance: La demi-sphère ajoute de la contenance au cylindre, il faut donc additionner les volumes.
  solution: π × r² × h + 2/3 × π × r³. C'est la somme du volume du cylindre (π × r² × h) et de celui de la demi-sphère (2/3
    × π × r³).
- id: nblm-un-ballon-rond-a-un-diametre-de-12-cm-qu-5
  type: choix
  difficulte: 2
  enonce: Un ballon rond a un diamètre de 12 cm. Quel est le volume exact de ce ballon ?
  reponse:
    options:
    - id: o1
      texte: 288π cm³
    - id: o2
      texte: 2304π cm³
    - id: o3
      texte: 144π cm³
    - id: o4
      texte: 576π cm³
    bonnes:
    - o1
  indices:
    relance: Pense à convertir le diamètre en rayon avant d'élever au cube.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : utilisation du diamètre (12 cm) à la place du rayon (6 cm) dans la formule.'
  - si:
      contient:
      - o3
    relance: 'Erreur : calcul avec le rayon au carré (6² = 36) au lieu du rayon au cube (6³ = 216).'
  - si:
      contient:
      - o4
    relance: 'Erreur : le rayon a été mis au cube mais la division par 3 a été oubliée.'
  solution: 288π cm³. Le rayon vaut r = 12 / 2 = 6 cm. V = 4/3 × π × 6³ = 4/3 × 216 × π = 288π cm³.
- id: nblm-quelles-sont-les-deux-affirmations-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations correctes concernant les calculs de volumes de solides composés avec des sphères
    ou demi-sphères ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le volume d'une demi-sphère s'obtient en multipliant le volume de la boule de même rayon par 1/2.
    - id: o2
      texte: Si le rayon d'une boule est mesuré en centimètres, son volume sera exprimé en cm³.
    - id: o3
      texte: Lorsqu'on creuse une demi-sphère dans un bloc cylindrique, on additionne les deux volumes.
    - id: o4
      texte: On peut directement remplacer le rayon r par le diamètre d dans la formule 4/3 × π × r³.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie l'impact des unités, de la division par 2 pour les demi-sphères, et l'opération associée au retrait
      de matière.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Si de la matière est retirée (creux), il faut soustraire le volume enlevé au lieu de l'additionner.
  - si:
      contient:
      - o4
    relance: Le rayon est égal à la moitié du diamètre, il faut impérativement diviser le diamètre par 2 avant le calcul.
  solution: Le volume d'une demi-sphère s'obtient en multipliant le volume de la boule de même rayon par 1/2 ; Si le rayon
    d'une boule est mesuré en centimètres, son volume sera exprimé en cm³. La demi-sphère représente exactement la moitié
    d'une boule de même rayon.
- id: nblm-sous-la-forme-d-une-fraction-simple-quel-7
  type: texte_court
  difficulte: 1
  enonce: Sous la forme d'une fraction simple, quel est le coefficient numérique par lequel on multiplie π × r³ dans la formule
    du volume d'une boule (quatre tiers pi) ?
  reponse:
    acceptees:
    - 4/3
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'une fraction comportant un 4 au numérateur et un 3 au dénominateur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 4/3. Le coefficient officiel dans la formule du volume de la boule est la fraction 4/3.
