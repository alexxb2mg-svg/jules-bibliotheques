    fautes_tolerees: 1
  indices:
    relance: Ce terme désigne une structure informatique qui évite de réécrire plusieurs fois les mêmes blocs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'boucle. C''est exact : une boucle (comme « répéter n fois ») est une structure qui réitère l''exécution des instructions
    qu''elle contient.'
- id: nblm-dans-le-logiciel-scratch-quel-terme-desi-8
