format: 2
notion: puissances-notation-scientifique
version: 2
etat: verifiee
declencheurs:
- exposant négatif
- puissance de dix
- écriture scientifique
- petit chiffre en haut
- nombre avec plein de zéros
- fois dix puissance
prerequis:
- 4e-puissances-notation-scientifique
couverture: Couvre les puissances d'exposant positif ou négatif, les produits et quotients de puissances de 10 et la notation
  scientifique dans des problèmes. Les règles générales sur les puissances d'un nombre quelconque sont seulement utilisées
  sur des exemples simples.
essentiel: 'Pour un nombre a et un entier n positif, aⁿ = a × a × … × a (n facteurs). Par convention a⁰ = 1 (si a n''est pas
  nul).


  Une puissance d''exposant négatif est un inverse : a⁻ⁿ = 1/aⁿ. Par exemple 10⁻³ = 1/1 000 = 0,001 et 2⁻³ = 1/8. Un exposant
  négatif ne rend pas le nombre négatif.


  Avec les puissances de 10 : 10ᵐ × 10ⁿ = 10ᵐ⁺ⁿ et 10ᵐ ÷ 10ⁿ = 10ᵐ⁻ⁿ.


  La notation scientifique d''un nombre positif est a × 10ⁿ, avec a supérieur ou égal à 1 et strictement inférieur à 10, et
  n entier (positif ou négatif). Par exemple 45 000 = 4,5 × 10⁴ et 0,0032 = 3,2 × 10⁻³.


  Elle sert à écrire et comparer très grands et très petits nombres (distances en astronomie, taille des cellules, etc.).

  '
methode:
- 'Pour écrire un nombre en notation scientifique, placer la virgule juste après le premier chiffre non nul : on obtient a.'
- 'Compter de combien de rangs la virgule a bougé : c''est n. Si le nombre de départ est plus grand que 10, n est positif
  ; s''il est plus petit que 1, n est négatif.'
- Pour multiplier deux nombres en notation scientifique, multiplier les nombres a entre eux et additionner les exposants de
  10.
- Pour diviser, diviser les nombres a entre eux et soustraire les exposants.
- À la fin, vérifier que le nombre devant la puissance de 10 est bien entre 1 et 10 ; sinon, le réécrire.
vocabulaire:
- terme: exposant
  definition: le petit nombre écrit en haut à droite, qui dit combien de fois on multiplie le nombre par lui-même
- terme: notation scientifique
  definition: l'écriture a × 10ⁿ avec a entre 1 (compris) et 10 (non compris)
erreurs_frequentes:
- 'Croire qu''un exposant négatif donne un nombre négatif : 10⁻³ n''est pas −1 000.'
- 'Multiplier les exposants au lieu de les additionner : 10⁵ × 10⁻⁸ n''est pas 10⁻⁴⁰.'
- 'Oublier que le nombre devant la puissance de 10 doit être entre 1 et 10 : 35 × 10⁶ n''est pas en notation scientifique.'
- Confondre 2³ et 2 × 3.
exemple:
  enonce: Calcule (4 × 10⁶) × (5 × 10⁻²) et donne le résultat en notation scientifique.
  solution: 'On multiplie les nombres : 4 × 5 = 20. On additionne les exposants : 6 + (−2) = 4. On obtient 20 × 10⁴. Or 20
    = 2 × 10¹, donc le résultat est 2 × 10⁵.'
exercices:
- id: dix-puissance-moins-trois
  type: nombre
  difficulte: 1
  enonce: Donne l'écriture décimale de 10⁻³.
  reponse:
    valeur: 0.001
    forme: libre
  indices:
    relance: Un exposant négatif veut-il dire que le nombre est négatif ? Que signifie-t-il ?
    methode: '10⁻ⁿ est l''inverse de 10ⁿ : c''est 1 divisé par 10ⁿ.'
    etape: '10³ = 1 000. Divise 1 par 1 000 : la virgule se déplace de trois rangs vers la gauche.'
  pieges:
  - si:
      valeur: -1000
    relance: Un exposant négatif ne donne pas un nombre négatif. 10⁻³ est-il plus grand ou plus petit que 1 ?
  - si:
      valeur: -30
    relance: 10⁻³ n'est pas 10 × (−3). Que veut dire un exposant négatif ?
  - si:
      valeur: 0.0001
    relance: 'Compte les rangs : combien de chiffres après la virgule faut-il pour diviser par 10 trois fois ?'
  solution: 10⁻³ = 1/10³ = 1 ÷ 1 000 = 0,001.
- id: produit-puissances-de-dix
  type: nombre
  difficulte: 2
  enonce: On écrit 10⁵ × 10⁻⁸ sous la forme 10ⁿ. Quelle est la valeur de n ?
  reponse:
    valeur: -3
    forme: entier
  indices:
    relance: Quand on multiplie deux puissances de 10, que fait-on avec les exposants ?
    methode: '10ᵐ × 10ⁿ = 10ᵐ⁺ⁿ : on additionne les exposants, en faisant attention au signe.'
    etape: 'Il faut calculer 5 + (−8). Pense à un thermomètre : tu pars de 5 et tu descends de 8.'
  pieges:
  - si:
      valeur: -40
    relance: Tu as multiplié les exposants. Pour un produit de puissances de 10, on les additionne.
  - si:
      valeur: 3
    relance: 'Attention au signe : 5 + (−8), c''est un nombre positif ou négatif ?'
  - si:
      valeur: 13
    relance: 'L''exposant −8 est négatif : on ajoute −8, on n''ajoute pas 8.'
  solution: 10⁵ × 10⁻⁸ = 10⁵⁺⁽⁻⁸⁾ = 10⁻³, donc n = −3.
- id: exposant-notation-scientifique
  type: nombre
  difficulte: 2
  enonce: On écrit 0,00072 en notation scientifique, sous la forme a × 10ⁿ. Quel est l'exposant n ?
  reponse:
    valeur: -4
    forme: entier
  indices:
    relance: Où faut-il placer la virgule pour que le nombre a soit entre 1 et 10 ?
    methode: 'Place la virgule juste après le premier chiffre non nul, puis compte de combien de rangs elle a bougé. Le nombre
      de départ est plus petit que 1 : l''exposant est négatif.'
    etape: Le premier chiffre non nul est 7, donc a = 7,2. Compte les rangs pour passer de 0,00072 à 7,2.
  pieges:
  - si:
      valeur: -5
    relance: 72 × 10⁻⁵ a la bonne valeur, mais 72 n'est pas entre 1 et 10. Où doit être la virgule ?
  - si:
      valeur: -3
    relance: Tu as compté les zéros après la virgule. Compte plutôt les rangs dont la virgule se déplace pour arriver à 7,2.
  - si:
      valeur: 4
    relance: '0,00072 est plus petit que 1 : l''exposant est-il positif ou négatif ?'
  solution: 0,00072 = 7,2 × 0,0001 = 7,2 × 10⁻⁴. La virgule a bougé de 4 rangs vers la droite, donc n = −4.
- id: reconnaitre-notation-scientifique
  type: choix
  difficulte: 2
  enonce: Quelles écritures sont en notation scientifique ? (Il peut y en avoir plusieurs.)
  reponse:
    options:
    - id: a
      texte: 3,5 × 10⁷
    - id: b
      texte: 35 × 10⁶
    - id: c
      texte: 0,8 × 10⁻²
    - id: d
      texte: 1 × 10⁻³
    bonnes:
    - a
    - d
  indices:
    relance: Quelle condition doit respecter le nombre écrit devant la puissance de 10 ?
    methode: 'Pour chaque écriture, regarde seulement le nombre devant 10 : est-il supérieur ou égal à 1 et strictement inférieur
      à 10 ?'
    etape: 'Le signe de l''exposant n''a pas d''importance. Regarde 35, puis 0,8 : sont-ils entre 1 et 10 ?'
  pieges:
  - si:
      contient:
      - b
    relance: 35 est-il plus petit que 10 ?
  - si:
      contient:
      - c
    relance: 0,8 est-il supérieur ou égal à 1 ?
  - si:
      diagnostic: incomplet
    relance: Il y a une autre bonne réponse. Le nombre 1 est-il accepté devant la puissance de 10 ?
  solution: 3,5 × 10⁷ et 1 × 10⁻³ sont en notation scientifique (3,5 et 1 sont entre 1 compris et 10 non compris). 35 est
    trop grand, 0,8 trop petit.
- id: lumiere-soleil-terre
  type: nombre
  difficulte: 3
  enonce: La lumière parcourt environ 3 × 10⁵ km en une seconde. La distance entre le Soleil et la Terre est environ 1,5 ×
    10⁸ km. Combien de secondes la lumière du Soleil met-elle pour arriver sur Terre ?
  reponse:
    valeur: 500
    forme: libre
  indices:
    relance: Tu connais une distance et la distance parcourue en une seconde. Quelle opération donne le nombre de secondes
      ?
    methode: 'Divise la distance totale par la distance parcourue en une seconde : divise les nombres devant les puissances
      de 10, puis soustrais les exposants.'
    etape: 1,5 ÷ 3 = 0,5 et 10⁸ ÷ 10⁵ = 10³. Multiplie maintenant ces deux résultats, puis donne l'écriture décimale.
  pieges:
  - si:
      valeur: 45000000000000
    relance: Tu as multiplié les deux nombres. Un temps en secondes, c'est la distance divisée par la distance parcourue en
      une seconde.
  - si:
      valeur: 5000
    relance: 'Vérifie l''exposant : 10⁸ ÷ 10⁵, on soustrait les exposants. Combien obtiens-tu ?'
  - si:
      valeur: 50
    relance: 'Vérifie ton calcul avec la puissance de 10 : 10⁸ ÷ 10⁵ fait combien ?'
  solution: 1,5 × 10⁸ ÷ (3 × 10⁵) = (1,5 ÷ 3) × 10⁸⁻⁵ = 0,5 × 10³ = 500. La lumière met environ 500 secondes, soit un peu
    plus de 8 minutes.
- id: exposant-negatif-pas-negatif
  type: ouverte
  difficulte: 3
  enonce: 'Sami affirme : « 2⁻³ est un nombre négatif, puisqu''il y a un signe moins. » Explique-lui son erreur et donne l''écriture
    fractionnaire et l''écriture décimale de 2⁻³.'
  criteres:
  - L'élève explique qu'un exposant négatif désigne un inverse (2⁻³ = 1/2³) et non un nombre négatif.
  - L'élève donne 2⁻³ = 1/8 = 0,125, et remarque que ce nombre est positif.
  indices:
    relance: 'Que signifie un exposant négatif : un nombre négatif, ou autre chose ?'
    methode: Utilise la règle a⁻ⁿ = 1/aⁿ, puis calcule 2³.
    etape: 2³ = 2 × 2 × 2. Écris l'inverse de ce nombre, puis sa valeur décimale.
  solution: 'Un exposant négatif indique un inverse : 2⁻³ = 1/2³ = 1/8 = 0,125. C''est un nombre positif, compris entre 0
    et 1. Le signe moins est dans l''exposant, pas devant le nombre.'
- id: nblm-quelle-est-la-valeur-decimale-de-la-puis-1
  type: choix
  difficulte: 2
  enonce: Quelle est la valeur décimale de la puissance de dix \(10^{-3}\), comportant un exposant négatif ?
  reponse:
    options:
    - id: o1
      texte: 0,001
    - id: o2
      texte: '-1000'
    - id: o3
      texte: '-30'
    - id: o4
      texte: 0,0001
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi qu'un exposant négatif indique 1 divisé par la puissance positive correspondante.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : un exposant négatif ne rend pas le nombre négatif. \(10^{-3}\) est égal à l''inverse \(\frac{1}{1000}\).'
  - si:
      contient:
      - o3
    relance: 'Faux : l''exposant n''est pas un facteur multiplicateur (\(10 \times (-3)\) est incorrect).'
  - si:
      contient:
      - o4
    relance: 'Faux : 0,0001 correspond à \(10^{-4}\) (4 chiffres après la virgule).'
  solution: '0,001. C''est exact : \(10^{-3} = \frac{1}{10^3} = \frac{1}{1000} = 0,001\). L''exposant négatif indique un inverse.'
- id: nblm-parmi-les-propositions-suivantes-quelle-2
  type: choix
  difficulte: 2
  enonce: Parmi les propositions suivantes, quelle est la correcte écriture scientifique du nombre 45 000 (exprimé avec un
    produit « fois dix puissance ») ?
  reponse:
    options:
    - id: o1
      texte: 4,5 × 10⁴
    - id: o2
      texte: 45 × 10³
    - id: o3
      texte: 0,45 × 10⁵
    - id: o4
      texte: 4,5 × 10⁻⁴
    bonnes:
    - o1
  indices:
    relance: Vérifie que le nombre devant la puissance de dix est compris entre 1 inclus et 10 exclus.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : 45 n''est pas strictement inférieur à 10. En écriture scientifique, le nombre \(a\) doit
      être entre 1 et 10.'
  - si:
      contient:
      - o3
    relance: 'Faux : 0,45 est strictement inférieur à 1. La règle exige que le nombre soit supérieur ou égal à 1.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''exposant doit être positif car 45 000 est un nombre supérieur à 10.'
  solution: '4,5 × 10⁴. C''est juste : le nombre \(a = 4,5\) respecte la condition \(1 \le a < 10\) et \(10^4\) correspond
    au déplacement de la virgule de 4 rangs.'
- id: nblm-que-designe-le-petit-chiffre-en-haut-a-d-3
  type: choix
  difficulte: 2
  enonce: Que désigne le petit chiffre en haut à droite dans l'écriture d'une puissance comme \(2^3\) ?
  reponse:
    options:
    - id: o1
      texte: L'exposant
    - id: o2
      texte: La base
    - id: o3
      texte: Le produit
    - id: o4
      texte: Le facteur
    bonnes:
    - o1
  indices:
    relance: Pense au nom donné au nombre qui indique à quelle puissance on élève une base.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : la base est le nombre principal écrit en bas (ici 2).'
  - si:
      contient:
      - o3
    relance: 'Faux : le produit est le résultat de la multiplication (\(2 \times 2 \times 2 = 8\)).'
  - si:
      contient:
      - o4
    relance: 'Faux : un facteur est chacun des nombres qui interviennent dans une multiplication.'
  solution: 'L''exposant. Exact : le petit chiffre écrit en haut à droite s''appelle l''exposant. Il indique combien de fois
    le nombre est multiplié par lui-même.'
- id: nblm-quel-est-le-resultat-sous-forme-d-une-se-4
  type: choix
  difficulte: 2
  enonce: Quel est le résultat sous forme d'une seule puissance de dix du produit \(10^5 \times 10^{-8}\), utile pour simplifier
    un nombre avec plein de zéros ?
  reponse:
    options:
    - id: o1
      texte: 10⁻³
    - id: o2
      texte: 10⁻⁴⁰
    - id: o3
      texte: 10³
    - id: o4
      texte: 10⁻¹³
    bonnes:
    - o1
  indices:
    relance: Pour multiplier deux puissances de dix, on additionne leurs exposants.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : vous avez multiplié les exposants (\(5 \times (-8) = -40\)) au lieu de les additionner.'
  - si:
      contient:
      - o3
    relance: 'Faux : vous avez fait une erreur de signe en calculant \(5 + (-8)\).'
  - si:
      contient:
      - o4
    relance: 'Faux : vous avez soustrait les exposants au lieu de les additionner.'
  solution: '10⁻³. C''est juste : lors de la multiplication de deux puissances de 10, on additionne les exposants (\(5 + (-8)
    = -3\)).'
- id: nblm-quelle-est-l-ecriture-scientifique-du-no-5
  type: choix
  difficulte: 2
  enonce: Quelle est l'écriture scientifique du nombre 0,0032, représentant une petite quantité avec un exposant négatif ?
  reponse:
    options:
    - id: o1
      texte: 3,2 × 10⁻³
    - id: o2
      texte: 3,2 × 10³
    - id: o3
      texte: 32 × 10⁻⁴
    - id: o4
      texte: 0,32 × 10⁻²
    bonnes:
    - o1
  indices:
    relance: Place la virgule juste après le premier chiffre non nul et compte de combien de rangs la virgule s'est déplacée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : l''exposant doit être négatif car 0,0032 est un nombre strictement inférieur à 1.'
  - si:
      contient:
      - o3
    relance: 'Faux : 32 n''est pas compris entre 1 et 10.'
  - si:
      contient:
      - o4
    relance: 'Faux : 0,32 est strictement inférieur à 1.'
  solution: '3,2 × 10⁻³. Exact : le premier chiffre non nul est 3, d''où \(a = 3,2\). On décale la virgule de 3 rangs vers
    la droite pour un nombre inférieur à 1, donc l''exposant est -3.'
- id: nblm-parmi-les-expressions-suivantes-utilisan-6
  type: choix
  difficulte: 3
  enonce: Parmi les expressions suivantes (utilisant le produit « fois dix puissance »), quelles sont les deux expressions
    qui sont correctement écrites en notation scientifique ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: 1,05 × 10⁻⁷
    - id: o2
      texte: 9,99 × 10¹²
    - id: o3
      texte: 10,5 × 10⁶
    - id: o4
      texte: 0,9 × 10⁴
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les expressions dont le premier facteur est supérieur ou égal à 1 et strictement inférieur à 10.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Incorrect : 10,5 n''est pas strictement inférieur à 10.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : 0,9 est inférieur à 1.'
  solution: '1,05 × 10⁻⁷ ; 9,99 × 10¹². Correct : 1,05 est bien compris entre 1 inclus et 10 exclus (\(1 \le 1,05 < 10\)).'
- id: nblm-complete-la-regle-une-puissance-de-dix-m-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la règle : Une puissance de dix munie d''un exposant négatif, comme \(10^{-n}\), correspond à l''___________
    de \(10^n\).'
  reponse:
    acceptees:
    - inverse
    fautes_tolerees: 1
  indices:
    relance: C'est le mot qui désigne le résultat de 1 divisé par un nombre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'inverse. Exact : par définition, \(10^{-n} = \frac{1}{10^n}\), c''est l''inverse de \(10^n\).'
- id: nblm-dans-la-notation-d-une-puissance-a-n-le-8
  type: texte_court
  difficulte: 1
  enonce: Dans la notation d'une puissance \(a^n\), le petit chiffre en haut à droite \(n\) est appelé l'___________.
  reponse:
    acceptees:
    - exposant
    fautes_tolerees: 1
  indices:
    relance: 'Relis l''énoncé : quel mot-clé du cours est en jeu ici ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'exposant. Exact : le terme exact pour désigner ce petit nombre placé en haut à droite est l''exposant.'
