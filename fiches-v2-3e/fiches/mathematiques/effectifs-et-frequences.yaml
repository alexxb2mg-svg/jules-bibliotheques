format: 2
notion: effectifs-et-frequences
version: 2
etat: generee
declencheurs:
- combien de fois revient
- part des élèves
- pourcentage des réponses
- compter les réponses
- total des effectifs
- tableau d'effectifs
- fréquence en pourcentage
- effectif total
prerequis:
- 4e-proportionnalite-4e
- calcul-nombres-rationnels
essentiel: |
  Une série statistique est un ensemble de données. L'effectif d'une valeur est le nombre de fois où elle apparaît. L'effectif total est le nombre total de données : c'est la somme de tous les effectifs.

  La fréquence d'une valeur = effectif de la valeur ÷ effectif total.
  Elle s'écrit en fraction, en nombre décimal entre 0 et 1, ou en pourcentage (on multiplie le décimal par 100).
  Exemple : 6 élèves sur 24 donnent une fréquence de 6/24 = 1/4 = 0,25 = 25 %.

  La somme des fréquences de toutes les valeurs vaut 1, c'est-à-dire 100 %. Une fréquence est toujours comprise entre 0 et 1.

  On organise les données dans un tableau d'effectifs : une ligne pour les valeurs, une ligne pour les effectifs, une ligne pour les fréquences. On vérifie que les effectifs redonnent l'effectif total.

  Pour retrouver un effectif : effectif = effectif total × fréquence. Avec un pourcentage : 20 % de 60 élèves, c'est 60 × 20 ÷ 100 = 12 élèves.
  Pour retrouver l'effectif total : effectif total = effectif ÷ fréquence.

  Quand une fréquence ne tombe pas juste, on donne une valeur arrondie et on le dit : 1/3 ≈ 0,33, soit environ 33 %.

  Les fréquences servent à comparer deux groupes qui n'ont pas le même effectif total. Comparer les effectifs seuls peut tromper.

  Un tableur permet de calculer effectifs et fréquences pour un grand nombre de données.

  Au brevet, on complète un tableau, on calcule un pourcentage, et on interprète par une phrase : « 27,5 % des élèves viennent en bus ».

  Exemple rédigé : sur 50 personnes, 18 préfèrent le train. La fréquence est 18 ÷ 50 = 0,36, soit 36 %. On conclut par une phrase : « 36 % des personnes interrogées préfèrent le train ».
methode:
- Compter l'effectif de chaque valeur (un trait par donnée), puis vérifier que la somme des effectifs redonne l'effectif total.
- 'Pour une fréquence : diviser l''effectif de la valeur par l''effectif total.'
- 'Pour l''écrire en pourcentage : multiplier la fréquence décimale par 100.'
- 'Pour retrouver un effectif à partir d''un pourcentage : effectif total × pourcentage ÷ 100.'
- 'Pour retrouver l''effectif total : diviser l''effectif de la valeur par sa fréquence.'
- 'Pour comparer deux groupes de tailles différentes : comparer les fréquences, pas les effectifs.'
vocabulaire:
- terme: effectif
  definition: Nombre de fois où une valeur apparaît dans la série.
- terme: effectif total
  definition: Nombre total de données recueillies.
- terme: fréquence
  definition: Quotient de l'effectif d'une valeur par l'effectif total.
- terme: pourcentage
  definition: 'Une fréquence exprimée « pour 100 » : 0,25 s''écrit 25 %.'
- terme: série statistique
  definition: L'ensemble des données recueillies lors d'une enquête ou d'une expérience.
- terme: valeur
  definition: Chaque résultat possible relevé dans la série (une couleur, une note, un âge...).
- terme: tableau d'effectifs
  definition: Un tableau qui donne, pour chaque valeur, son effectif.
erreurs_frequentes:
- Diviser l'effectif total par l'effectif de la valeur (le quotient est à l'envers).
- Oublier de multiplier par 100 pour obtenir un pourcentage.
- Comparer deux groupes de tailles différentes avec les effectifs au lieu des fréquences.
- Oublier une donnée en comptant, si bien que la somme des effectifs ne redonne pas l'effectif total.
- 'Trouver une fréquence plus grande que 1 : elle est toujours comprise entre 0 et 1.'
exemple:
  enonce: Sur 50 personnes interrogées, 18 préfèrent le train, 22 la voiture et 10 le vélo. Quelle est la fréquence de « train » ?
  solution: 'Fréquence = 18 ÷ 50 = 0,36, soit 36 %. Vérification : 18 + 22 + 10 = 50, et 36 % + 44 % + 20 % = 100 %.'
exercices:
- id: effectif-couleur-bleu
  type: nombre
  difficulte: 1
  enonce: 'On a demandé leur couleur préférée à 12 élèves : bleu, rouge, vert, bleu, bleu, jaune, rouge, bleu, vert, rouge, bleu, jaune. Quel est l''effectif de la couleur bleu ?'
  reponse:
    valeur: 5
    forme: entier
  indices:
    relance: Que signifie l'effectif d'une valeur ?
    methode: Parcours la liste du début à la fin et fais un trait à chaque fois que tu lis « bleu ».
    etape: Les deux premiers « bleu » sont la 1re et la 4e réponse. Continue jusqu'au bout de la liste.
  pieges:
  - si:
      valeur: 12
    relance: 12, c'est le nombre total de réponses. On veut seulement le nombre de réponses « bleu ».
  - si:
      diagnostic: valeur_fausse
    relance: Recompte en barrant chaque « bleu » que tu as déjà compté, pour n'en oublier aucun.
  solution: Les « bleu » sont les 1re, 4e, 5e, 8e et 11e réponses. L'effectif de bleu est 5.
- id: frequence-rouge-fraction
  type: nombre
  difficulte: 2
  enonce: 'Mêmes 12 réponses : bleu, rouge, vert, bleu, bleu, jaune, rouge, bleu, vert, rouge, bleu, jaune. Quelle est la fréquence de la couleur rouge ? Écris-la sous forme de fraction irréductible a/b.'
  reponse:
    valeur: 1/4
    forme: fraction_irreductible
  indices:
    relance: Combien de réponses « rouge » y a-t-il, et combien de réponses en tout ?
    methode: Fréquence = effectif de la valeur ÷ effectif total. Écris la fraction, puis simplifie-la.
    etape: Il y a 12 réponses en tout, c'est le dénominateur. Compte les « rouge » et place ce nombre au numérateur.
  pieges:
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est juste, mais on peut encore la simplifier. Cherche un diviseur commun au numérateur et au dénominateur.
  - si:
      diagnostic: pas_une_fraction
    relance: Ta valeur est juste, mais on attend une fraction écrite a/b.
  - si:
      valeur: 4
    relance: 'Tu as divisé l''effectif total par l''effectif de rouge. C''est l''inverse : effectif de rouge ÷ effectif total.'
  - si:
      valeur: 3
    relance: Ce nombre est l'effectif de rouge. La fréquence compare cet effectif à l'effectif total.
  solution: 'Rouge apparaît 3 fois sur 12 réponses : fréquence = 3/12 = 1/4 (soit 0,25 ou 25 %).'
- id: bus-pourcentage
  type: nombre
  difficulte: 2
  enonce: Dans un collège de 480 élèves, 132 élèves viennent en bus. Quelle est la fréquence des élèves qui viennent en bus, en pourcentage ? Écris seulement le nombre, sans le symbole %.
  reponse:
    valeur: 27.5
    forme: libre
  indices:
    relance: Quel est l'effectif de la valeur « bus », et quel est l'effectif total ?
    methode: Calcule la fréquence en écriture décimale (effectif ÷ effectif total), puis multiplie par 100 pour avoir un pourcentage.
    etape: La fréquence est 132 ÷ 480. Calcule ce quotient à la calculatrice, puis multiplie le résultat par 100.
  pieges:
  - si:
      valeur: 0.275
    relance: 'Ce nombre est la fréquence en écriture décimale. On la demande en pourcentage : que te reste-t-il à faire ?'
  - si:
      valeur: 132
    relance: 132 est l'effectif des élèves qui viennent en bus. Il faut le comparer à l'effectif total du collège.
  - si:
      diagnostic: valeur_fausse
    relance: As-tu bien divisé 132 par 480, dans cet ordre ? Un pourcentage de ce type est forcément inférieur à 100.
  solution: 132 ÷ 480 = 0,275, et 0,275 × 100 = 27,5. Donc 27,5 % des élèves viennent en bus.
- id: effectif-depuis-pourcentage
  type: nombre
  difficulte: 2
  enonce: Dans une classe de 40 élèves, 35 % des élèves font du sport en club. Combien d'élèves cela représente-t-il ?
  reponse:
    valeur: 14
    forme: entier
  indices:
    relance: 35 %, c'est 35 élèves pour 100 élèves. Et pour une classe de 40 élèves ?
    methode: Effectif = effectif total × pourcentage ÷ 100.
    etape: Pose le calcul 40 × 35 ÷ 100 et effectue-le.
  pieges:
  - si:
      valeur: 35
    relance: '35 est un pourcentage : c''est 35 pour 100 élèves. Or la classe n''a que 40 élèves.'
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie : ton nombre divisé par 40, puis multiplié par 100, redonne-t-il 35 ?'
  solution: 40 × 35 ÷ 100 = 1 400 ÷ 100 = 14. Il y a 14 élèves qui font du sport en club.
- id: vrai-faux-frequences
  type: choix
  difficulte: 2
  enonce: Quelles affirmations sur les fréquences sont vraies ?
  reponse:
    options:
    - id: a
      texte: La somme des fréquences de toutes les valeurs d'une série vaut 1, soit 100 %.
    - id: b
      texte: Une fréquence peut être plus grande que 1.
    - id: c
      texte: La fréquence d'une valeur est son effectif divisé par l'effectif total.
    - id: d
      texte: Si deux classes ont chacune 12 élèves qui portent des lunettes, la fréquence est la même dans les deux classes.
    bonnes:
    - a
    - c
  indices:
    relance: Une fréquence compare une partie au tout. La partie peut-elle être plus grande que le tout ?
    methode: 'Pour chaque affirmation, essaie un petit exemple chiffré : une série de 10 valeurs, par exemple.'
    etape: 'Pour d : imagine une classe de 24 élèves et une classe de 30 élèves, avec 12 élèves à lunettes dans chacune. Calcule les deux fréquences.'
  pieges:
  - si:
      contient:
      - b
    relance: L'effectif d'une valeur peut-il dépasser l'effectif total ? Que dire alors du quotient ?
  - si:
      contient:
      - d
    relance: Deux classes peuvent-elles avoir des effectifs totaux différents ? Que devient alors la fréquence ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation vraie, mais pas toutes. Relis celles que tu n'as pas choisies.
  solution: 'a est vraie : les effectifs réunis font l''effectif total. b est fausse : une fréquence est entre 0 et 1. c est vraie : c''est la définition. d est fausse : 12 sur 24 fait 50 %, mais 12 sur 30 fait 40 %.'
- id: comparer-deux-classes
  type: ouverte
  difficulte: 3
  enonce: 'En 3e A, 12 élèves sur 30 ont un animal. En 3e B, 11 élèves sur 25 ont un animal. Sam dit : « Il y a plus d''élèves avec un animal en 3e A, donc c''est en 3e A que les élèves ont le plus souvent un animal. » A-t-il raison ? Justifie par des calculs.'
  criteres:
  - L'élève calcule les deux fréquences (12 ÷ 30 = 0,4 soit 40 % ; 11 ÷ 25 = 0,44 soit 44 %).
  - 'L''élève conclut que Sam a tort : en proportion, c''est la 3e B qui a le plus d''élèves avec un animal.'
  - L'élève explique qu'il faut comparer des fréquences, car les deux classes n'ont pas le même effectif total.
  indices:
    relance: Les deux classes ont-elles le même nombre d'élèves ? Peut-on alors comparer directement 12 et 11 ?
    methode: Calcule la fréquence des élèves avec un animal dans chaque classe, en pourcentage, puis compare.
    etape: 'En 3e A : 12 ÷ 30 = 0,4, soit 40 %. Fais le même calcul pour la 3e B.'
  solution: '3e A : 12 ÷ 30 = 0,4, soit 40 %. 3e B : 11 ÷ 25 = 0,44, soit 44 %. Sam a tort : il y a plus d''élèves avec un animal en 3e A, mais la 3e B est plus petite ; en proportion, c''est en 3e B que les élèves ont le plus souvent un animal.'
- id: relier-vocabulaire-statistique
  type: association
  difficulte: 1
  enonce: Associe chaque terme à sa définition. Une définition ne sert pas.
  reponse:
    gauche:
    - id: a
      texte: Effectif d'une valeur
    - id: b
      texte: Effectif total
    - id: c
      texte: Fréquence d'une valeur
    droite:
    - id: x
      texte: Le nombre de fois où la valeur apparaît
    - id: y
      texte: Le nombre de données de toute la série
    - id: z
      texte: L'effectif de la valeur divisé par l'effectif total
    - id: w
      texte: La somme de toutes les valeurs de la série
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Lequel de ces termes parle d'une seule valeur, et lequel parle de toute la série ?
    methode: 'Effectif : un nombre de données. Fréquence : une comparaison entre une partie et le tout, donc un quotient.'
    etape: 'Commence par le terme « effectif total » : il concerne toute la série.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux définitions qui parlent d'un nombre de données.
  - si:
      diagnostic: associations_fausses
    relance: 'Cherche d''abord la définition qui contient une division : à quel terme correspond-elle ?'
  solution: 'Effectif : nombre de fois où la valeur apparaît. Effectif total : nombre de données de la série. Fréquence : effectif ÷ effectif total. La somme des valeurs ne sert pas.'
- id: retrouver-effectif-total
  type: nombre
  difficulte: 3
  enonce: Dans un club de handball, 12 joueurs ont moins de 16 ans. Ils représentent une fréquence de 0,3 de l'ensemble des joueurs du club. Combien le club compte-t-il de joueurs en tout ?
  reponse:
    valeur: 40
    forme: entier
  indices:
    relance: Que vaut la fréquence en fonction de l'effectif et de l'effectif total ? Quel est ici l'inconnu ?
    methode: Écris fréquence = effectif ÷ effectif total avec les nombres de l'énoncé, puis cherche le nombre inconnu.
    etape: On sait que 12 divisé par l'effectif total donne 0,3. Calcule 12 ÷ 0,3.
  pieges:
  - si:
      valeur: 3.6
    relance: Tu as multiplié 12 par la fréquence. Or l'effectif total est plus grand que l'effectif de la valeur.
  - si:
      valeur: 0.025
    relance: 'Tu as divisé la fréquence par l''effectif. Reprends : fréquence = effectif ÷ effectif total.'
  solution: 'fréquence = effectif ÷ effectif total, donc 0,3 = 12 ÷ N, et N = 12 ÷ 0,3 = 40. Vérification : 12 ÷ 40 = 0,3. Le club compte 40 joueurs.'
