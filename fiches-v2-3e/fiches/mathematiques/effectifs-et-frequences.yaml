# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: effectifs-et-frequences
version: 1
etat: verifiee
declencheurs:
- combien de fois revient
- part des élèves
- pourcentage des réponses
- compter les réponses
- total des effectifs
prerequis:
- 4e-proportionnalite-4e
- calcul-nombres-rationnels
essentiel: 'L''effectif d''une valeur est le nombre de fois où elle apparaît dans la série.

  L''effectif total est le nombre total de données (la somme de tous les effectifs).


  La fréquence d''une valeur = effectif de la valeur ÷ effectif total.

  Elle s''écrit sous forme de fraction, de nombre décimal (entre 0 et 1) ou de pourcentage (on multiplie par 100).

  Exemple : 6 élèves sur 24, c''est une fréquence de 6/24 = 1/4 = 0,25 = 25 %.


  La somme des fréquences de toutes les valeurs vaut 1, c''est-à-dire 100 %.

  Les fréquences permettent de comparer deux groupes qui n''ont pas le même effectif total.

  '
methode:
- Compter l'effectif de chaque valeur (un trait par donnée), puis vérifier que la somme des effectifs redonne l'effectif total.
- 'Pour une fréquence : diviser l''effectif de la valeur par l''effectif total.'
- 'Pour l''écrire en pourcentage : multiplier la fréquence décimale par 100.'
- 'Pour retrouver un effectif à partir d''un pourcentage : effectif total × pourcentage ÷ 100.'
- 'Pour comparer deux groupes de tailles différentes : comparer les fréquences, pas les effectifs.'
vocabulaire:
- terme: effectif
  definition: Nombre de fois où une valeur apparaît dans la série.
- terme: effectif total
  definition: Nombre total de données recueillies.
- terme: fréquence
  definition: Quotient de l'effectif d'une valeur par l'effectif total.
erreurs_frequentes:
- Diviser l'effectif total par l'effectif de la valeur (le quotient est à l'envers).
- Oublier de multiplier par 100 pour obtenir un pourcentage.
- Comparer deux groupes de tailles différentes avec les effectifs au lieu des fréquences.
- Oublier une donnée en comptant, si bien que la somme des effectifs ne redonne pas l'effectif total.
exemple:
  enonce: Sur 50 personnes interrogées, 18 préfèrent le train, 22 la voiture et 10 le vélo. Quelle est la fréquence de « train
    » ?
  solution: 'Fréquence = 18 ÷ 50 = 0,36, soit 36 %. Vérification : 18 + 22 + 10 = 50, et 36 % + 44 % + 20 % = 100 %.'
exercices:
- id: effectif-couleur-bleu
  type: nombre
  difficulte: 1
  enonce: 'On a demandé leur couleur préférée à 12 élèves : bleu, rouge, vert, bleu, bleu, jaune, rouge, bleu, vert, rouge,
    bleu, jaune. Quel est l''effectif de la couleur bleu ?'
  reponse:
    valeur: 5
    forme: entier
  indices:
    relance: Que signifie l'effectif d'une valeur ?
    methode: Parcours la liste du début à la fin et fais un trait à chaque fois que tu lis « bleu ».
    etape: Les deux premiers « bleu » sont la 1re et la 4e réponse. Continue jusqu'au bout de la liste.
  pieges:
  - si:
      valeur: 12
    relance: 12, c'est le nombre total de réponses. On veut seulement le nombre de réponses « bleu ».
  - si:
      diagnostic: valeur_fausse
    relance: Recompte en barrant chaque « bleu » que tu as déjà compté, pour n'en oublier aucun.
  solution: Les « bleu » sont les 1re, 4e, 5e, 8e et 11e réponses. L'effectif de bleu est 5.
- id: frequence-rouge-fraction
  type: nombre
  difficulte: 2
  enonce: 'Mêmes 12 réponses : bleu, rouge, vert, bleu, bleu, jaune, rouge, bleu, vert, rouge, bleu, jaune. Quelle est la
    fréquence de la couleur rouge ? Écris-la sous forme de fraction irréductible a/b.'
  reponse:
    valeur: 1/4
    forme: fraction_irreductible
  indices:
    relance: Combien de réponses « rouge » y a-t-il, et combien de réponses en tout ?
    methode: Fréquence = effectif de la valeur ÷ effectif total. Écris la fraction, puis simplifie-la.
    etape: Il y a 12 réponses en tout, c'est le dénominateur. Compte les « rouge » et place ce nombre au numérateur.
  pieges:
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est juste, mais on peut encore la simplifier. Cherche un diviseur commun au numérateur et au dénominateur.
  - si:
      diagnostic: pas_une_fraction
    relance: Ta valeur est juste, mais on attend une fraction écrite a/b.
  - si:
      valeur: 4
    relance: 'Tu as divisé l''effectif total par l''effectif de rouge. C''est l''inverse : effectif de rouge ÷ effectif total.'
  - si:
      valeur: 3
    relance: Ce nombre est l'effectif de rouge. La fréquence compare cet effectif à l'effectif total.
  solution: 'Rouge apparaît 3 fois sur 12 réponses : fréquence = 3/12 = 1/4 (soit 0,25 ou 25 %).'
- id: bus-pourcentage
  type: nombre
  difficulte: 2
  enonce: Dans un collège de 480 élèves, 132 élèves viennent en bus. Quelle est la fréquence des élèves qui viennent en bus,
    en pourcentage ? Écris seulement le nombre, sans le symbole %.
  reponse:
    valeur: 27.5
    forme: libre
  indices:
    relance: Quel est l'effectif de la valeur « bus », et quel est l'effectif total ?
    methode: Calcule la fréquence en écriture décimale (effectif ÷ effectif total), puis multiplie par 100 pour avoir un pourcentage.
    etape: La fréquence est 132 ÷ 480. Calcule ce quotient à la calculatrice, puis multiplie le résultat par 100.
  pieges:
  - si:
      valeur: 0.275
    relance: 'Ce nombre est la fréquence en écriture décimale. On la demande en pourcentage : que te reste-t-il à faire ?'
  - si:
      valeur: 132
    relance: 132 est l'effectif des élèves qui viennent en bus. Il faut le comparer à l'effectif total du collège.
  - si:
      diagnostic: valeur_fausse
    relance: As-tu bien divisé 132 par 480, dans cet ordre ? Un pourcentage de ce type est forcément inférieur à 100.
  solution: 132 ÷ 480 = 0,275, et 0,275 × 100 = 27,5. Donc 27,5 % des élèves viennent en bus.
- id: effectif-depuis-pourcentage
  type: nombre
  difficulte: 2
  enonce: Dans une classe de 40 élèves, 35 % des élèves font du sport en club. Combien d'élèves cela représente-t-il ?
  reponse:
    valeur: 14
    forme: entier
  indices:
    relance: 35 %, c'est 35 élèves pour 100 élèves. Et pour une classe de 40 élèves ?
    methode: Effectif = effectif total × pourcentage ÷ 100.
    etape: Pose le calcul 40 × 35 ÷ 100 et effectue-le.
  pieges:
  - si:
      valeur: 35
    relance: '35 est un pourcentage : c''est 35 pour 100 élèves. Or la classe n''a que 40 élèves.'
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie : ton nombre divisé par 40, puis multiplié par 100, redonne-t-il 35 ?'
  solution: 40 × 35 ÷ 100 = 1 400 ÷ 100 = 14. Il y a 14 élèves qui font du sport en club.
- id: vrai-faux-frequences
  type: choix
  difficulte: 2
  enonce: Quelles affirmations sur les fréquences sont vraies ?
  reponse:
    options:
    - id: a
      texte: La somme des fréquences de toutes les valeurs d'une série vaut 1, soit 100 %.
    - id: b
      texte: Une fréquence peut être plus grande que 1.
    - id: c
      texte: La fréquence d'une valeur est son effectif divisé par l'effectif total.
    - id: d
      texte: Si deux classes ont chacune 12 élèves qui portent des lunettes, la fréquence est la même dans les deux classes.
    bonnes:
    - a
    - c
  indices:
    relance: Une fréquence compare une partie au tout. La partie peut-elle être plus grande que le tout ?
    methode: 'Pour chaque affirmation, essaie un petit exemple chiffré : une série de 10 valeurs, par exemple.'
    etape: 'Pour d : imagine une classe de 24 élèves et une classe de 30 élèves, avec 12 élèves à lunettes dans chacune. Calcule
      les deux fréquences.'
  pieges:
  - si:
      contient:
      - b
    relance: L'effectif d'une valeur peut-il dépasser l'effectif total ? Que dire alors du quotient ?
  - si:
      contient:
      - d
    relance: Deux classes peuvent-elles avoir des effectifs totaux différents ? Que devient alors la fréquence ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation vraie, mais pas toutes. Relis celles que tu n'as pas choisies.
  solution: 'a est vraie : les effectifs réunis font l''effectif total. b est fausse : une fréquence est entre 0 et 1. c est
    vraie : c''est la définition. d est fausse : 12 sur 24 fait 50 %, mais 12 sur 30 fait 40 %.'
- id: comparer-deux-classes
  type: ouverte
  difficulte: 3
  enonce: 'En 3e A, 12 élèves sur 30 ont un animal. En 3e B, 11 élèves sur 25 ont un animal. Sam dit : « Il y a plus d''élèves
    avec un animal en 3e A, donc c''est en 3e A que les élèves ont le plus souvent un animal. » A-t-il raison ? Justifie par
    des calculs.'
  criteres:
  - L'élève calcule les deux fréquences (12 ÷ 30 = 0,4 soit 40 % ; 11 ÷ 25 = 0,44 soit 44 %).
  - 'L''élève conclut que Sam a tort : en proportion, c''est la 3e B qui a le plus d''élèves avec un animal.'
  - L'élève explique qu'il faut comparer des fréquences, car les deux classes n'ont pas le même effectif total.
  indices:
    relance: Les deux classes ont-elles le même nombre d'élèves ? Peut-on alors comparer directement 12 et 11 ?
    methode: Calcule la fréquence des élèves avec un animal dans chaque classe, en pourcentage, puis compare.
    etape: 'En 3e A : 12 ÷ 30 = 0,4, soit 40 %. Fais le même calcul pour la 3e B.'
  solution: '3e A : 12 ÷ 30 = 0,4, soit 40 %. 3e B : 11 ÷ 25 = 0,44, soit 44 %. Sam a tort : il y a plus d''élèves avec un
    animal en 3e A, mais la 3e B est plus petite ; en proportion, c''est en 3e B que les élèves ont le plus souvent un animal.'
- id: nblm-dans-une-enquete-statistique-sur-les-loi-1
  type: choix
  difficulte: 2
  enonce: Dans une enquête statistique sur les loisirs, que représente exactement l'effectif d'une réponse donnée lorsqu'on
    vient de compter les réponses ?
  reponse:
    options:
    - id: o1
      texte: Le nombre de fois où cette réponse revient dans la série de données.
    - id: o2
      texte: Le pourcentage global obtenu en divisant l'effectif total par 100.
    - id: o3
      texte: La différence entre la plus grande et la plus petite valeur des données.
    - id: o4
      texte: Le résultat de la division de l'effectif total par le nombre de catégories.
    bonnes:
    - o1
  indices:
    relance: Pense à ce que l'on obtient immédiatement après avoir compté le nombre d'apparitions d'une réponse.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre l''effectif brut avec le pourcentage (qui est la fréquence exprimée sur 100).'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre l''effectif avec l''étendue de la série statistique.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : effectuer un calcul de moyenne arbitraire au lieu de compter le nombre d''apparitions de la
      valeur.'
  solution: 'Le nombre de fois où cette réponse revient dans la série de données. C''est la définition exacte de l''effectif
    : il indique combien de fois une valeur apparaît dans la série.'
- id: nblm-comment-calcule-t-on-le-total-des-effect-2
  type: choix
  difficulte: 2
  enonce: Comment calcule-t-on le total des effectifs (ou effectif total) d'un groupe d'élèves après une enquête ?
  reponse:
    options:
    - id: o1
      texte: En faisant la somme de tous les effectifs de chaque valeur de la série.
    - id: o2
      texte: En multipliant le nombre de réponses différentes par 100.
    - id: o3
      texte: En divisant l'effectif d'une seule valeur par le nombre total de questions.
    - id: o4
      texte: En calculant la moyenne entre la plus grande et la plus petite réponse.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la méthode permettant de retrouver le nombre global de données à partir de chaque sous-groupe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre le calcul de l''effectif total avec la conversion de fréquences en pourcentage.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : diviser par le nombre de questions ne donne pas le nombre total d''élèves interrogés.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre le total des effectifs avec le milieu de l''étendue des données.'
  solution: En faisant la somme de tous les effectifs de chaque valeur de la série. L'effectif total est par définition la
    somme de tous les effectifs individuels récoltés.
- id: nblm-dans-une-classe-6-eleves-sur-un-total-de-3
  type: choix
  difficulte: 2
  enonce: Dans une classe, 6 élèves sur un total de 24 pratiquent la natation. Quelle est la part des élèves pratiquant la
    natation sous forme décimale ?
  reponse:
    options:
    - id: o1
      texte: 0,25
    - id: o2
      texte: '4'
    - id: o3
      texte: 0,18
    - id: o4
      texte: '24'
    bonnes:
    - o1
  indices:
    relance: La fréquence s'obtient en divisant l'effectif concerné par l'effectif total.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : diviser l''effectif total par l''effectif de la valeur (24 ÷ 6 = 4) au lieu de l''inverse.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : effectuer une erreur de division au lieu du calcul exact 6 ÷ 24.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : donner l''effectif total au lieu de calculer la proportion.'
  solution: '0,25. La fréquence est le quotient de l''effectif de la valeur par l''effectif total : 6 ÷ 24 = 0,25.'
- id: nblm-lors-d-un-sondage-18-personnes-sur-50-re-4
  type: choix
  difficulte: 2
  enonce: Lors d'un sondage, 18 personnes sur 50 répondent qu'elles prennent le train. Quel est le pourcentage des réponses
    correspondant au train ?
  reponse:
    options:
    - id: o1
      texte: 36 %
    - id: o2
      texte: 18 %
    - id: o3
      texte: 0,36 %
    - id: o4
      texte: 2,77 %
    bonnes:
    - o1
  indices:
    relance: Calcule la fréquence sous forme décimale puis transforme-la en pourcentage en multipliant par 100.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre l''effectif brut (18 personnes) directement avec le pourcentage des réponses.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : diviser l''effectif total par l''effectif de la valeur (50 ÷ 18) au lieu de l''inverse.'
  solution: '36 %. On calcule la fréquence (18 ÷ 50 = 0,36) puis on multiplie par 100 pour l''exprimer en pourcentage : 36
