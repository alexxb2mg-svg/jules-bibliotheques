- id: nblm-dans-un-college-de-200-eleves-45-des-ele-5
  type: choix
  difficulte: 2
  enonce: Dans un collège de 200 élèves, 45 % des élèves viennent à pied. Combien d'élèves cela représente-t-il ?
  reponse:
    options:
    - id: o1
      texte: 90 élèves
    - id: o2
      texte: 45 élèves
    - id: o3
      texte: 110 élèves
    - id: o4
      texte: 4,44 élèves
    bonnes:
    - o1
  indices:
    relance: Multiplie l'effectif total par la valeur du pourcentage, puis divise par 100.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre la valeur du pourcentage (45 %) avec le nombre effectif d''élèves.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : calculer l''effectif des élèves qui ne viennent pas à pied (200 - 90 = 110).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : diviser l''effectif total par le pourcentage (200 ÷ 45) au lieu d''appliquer la règle de proportionnalité.'
  solution: '90 élèves. Pour retrouver un effectif à partir d''un pourcentage, on effectue : effectif total × pourcentage
    ÷ 100 = 200 × 45 ÷ 100 = 90.'
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant la fréquence d'une valeur dans une série statistique ? [1-3]
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La somme des fréquences de toutes les valeurs d'une série est toujours égale à 1 (soit 100 %).
    - id: o2
      texte: Les fréquences permettent de comparer deux groupes qui n'ont pas le même effectif total.
    - id: o3
      texte: Pour comparer deux groupes de tailles différentes, il suffit de comparer directement leurs effectifs bruts.
    - id: o4
      texte: Une fréquence exprimée sous forme décimale peut être supérieure à 1.
    bonnes:
    - o1
    - o2
  indices:
    relance: Réfléchis à la valeur de la somme de toutes les parts et à l'utilité des fréquences lors d'une comparaison entre
      deux groupes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : comparer des effectifs bruts sans tenir compte de la taille totale de chaque groupe induit
      en erreur.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : une fréquence est une part sur le tout, elle est donc obligatoirement comprise entre 0 et 1.'
  solution: 'La somme des fréquences de toutes les valeurs d''une série est toujours égale à 1 (soit 100 %) ; Les fréquences
    permettent de comparer deux groupes qui n''ont pas le même effectif total. Propriété fondamentale : la somme des fréquences
    de l''ensemble des réponses reconstruit la totalité (1 ou 100 %).'
- id: nblm-comment-appelle-t-on-le-quotient-de-l-ef-7
