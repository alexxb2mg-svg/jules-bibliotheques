  indices:
    relance: Pour chaque question, le nombre donné est-il un nombre de départ ou d'arrivée ?
    methode: Pour une image, remplace x par le nombre. Pour un antécédent, résous f(x) = nombre.
    etape: Pour « l'image de 2 », calcule 2 × 2 + 1. Pour « un antécédent de 9 », résous 2x + 1 = 9.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pour chaque ligne, vérifie en calculant f(x) ou en résolvant l'équation.
  - si:
      diagnostic: associations_fausses
    relance: Sépare les images (on remplace x) des antécédents (on résout une équation), puis calcule chaque ligne.
  solution: 'f(2) = 2 × 2 + 1 = 5. Antécédent de 9 : 2x + 1 = 9, 2x = 8, x = 4. f(0) = 1. Antécédent de 7 : 2x + 1 = 7, 2x
    = 6, x = 3. La réponse 9 ne sert pas.'
