# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: image-et-antecedent
version: 3
etat: verifiee
declencheurs:
- calculer l'image d'un nombre
- quel nombre a pour image
- résoudre f(x) égal
- lire l'image sur le graphique
- nombre de départ qui donne
- nombre qui a pour image
- lire sur la courbe
prerequis:
- vocabulaire-notations-fonctions
- 4e-equations-premier-degre
essentiel: 'Une fonction f associe à chaque nombre x un nombre f(x). On écrit f : x ↦ f(x).


  Si f(a) = b, on dit que b est l''image de a et que a est un antécédent de b. Exemple : f(2) = 5 signifie que 5 est l''image
  de 2 et que 2 est un antécédent de 5.


  Un nombre a une seule image. Mais un nombre peut avoir plusieurs antécédents, un seul, ou aucun. Exemple avec f(x) = x²
  : 9 a deux antécédents (3 et −3) et −1 n''en a aucun.


  Trouver une image de a :

  - avec une expression : on remplace x par a et on calcule (parenthèses si a est négatif) ;

  - avec un tableau : on cherche a dans la ligne des x, l''image est juste en dessous ;

  - avec un graphique : on part de a sur l''axe des abscisses, on va jusqu''à la courbe, puis on lit l''ordonnée.


  Trouver les antécédents de b :

  - avec un tableau : on cherche b dans la ligne des images, les antécédents sont au-dessus (il peut y en avoir plusieurs)
  ;

  - avec un graphique : on part de b sur l''axe des ordonnées, on trace l''horizontale, et on lit les abscisses de tous les
  points où elle coupe la courbe ;

  - par le calcul : on résout l''équation f(x) = b.


  Exemple : f(x) = 2x − 3. L''image de 5 est f(5) = 2 × 5 − 3 = 7. L''antécédent de 9 vérifie 2x − 3 = 9, donc x = 6.


  Un point A(a ; b) est sur la courbe de f si et seulement si f(a) = b.


  Exemple de lecture : sur un tableau où h(0) = 5 et h(4) = 5, le nombre 5 a deux antécédents, 0 et 4.

  Rappel : on résout f(x) = b comme une équation du premier degré. On isole le terme en x, puis on divise par le nombre devant
  x.

  Un antécédent de 0 est un nombre dont l''image est 0 : sur un graphique, c''est un point où la courbe coupe l''axe des abscisses.


  Au brevet : on calcule une image, on résout une équation pour un antécédent, on lit un graphique ou un tableau et on justifie
  par un calcul.

  '
methode:
- 'Se demander d''abord : le nombre donné est-il au départ (on cherche son image) ou à l''arrivée (on cherche ses antécédents)
  ?'
- 'Pour une image avec une expression : remplacer x par le nombre, avec des parenthèses s''il est négatif, et respecter les
  priorités.'
- 'Pour un antécédent par le calcul : écrire l''équation f(x) = b et la résoudre.'
- Sur un graphique ou dans un tableau, chercher tous les antécédents, pas seulement le premier.
- 'Vérifier le résultat : l''image de l''antécédent trouvé doit redonner b.'
- Pour savoir si un point A(a ; b) est sur la courbe, calculer f(a) et comparer avec b.
vocabulaire:
- terme: fonction
  definition: Procédé qui associe à chaque nombre de départ un seul nombre d'arrivée.
- terme: image
  definition: 'Le nombre f(a) obtenu à partir de a : c''est le nombre d''arrivée.'
- terme: antécédent
  definition: 'Un nombre a tel que f(a) = b : c''est un nombre de départ pour b.'
- terme: abscisse
  definition: 'Première coordonnée d''un point : sa position sur l''axe horizontal.'
- terme: ordonnée
  definition: 'Seconde coordonnée d''un point : sa position sur l''axe vertical.'
- terme: tableau de valeurs
  definition: Tableau qui donne des nombres x et leurs images f(x).
erreurs_frequentes:
- 'Confondre image et antécédent : répondre f(b) quand on demande un antécédent de b.'
- Lire l'abscisse à la place de l'ordonnée sur un graphique.
- Oublier un antécédent quand il y en a plusieurs.
- Mal résoudre l'équation f(x) = b (erreur de signe en changeant de membre).
exemple:
  enonce: On donne f(x) = 2x − 3. Calculer l'image de 5, puis l'antécédent de 9.
  solution: 'Image de 5 : f(5) = 2 × 5 − 3 = 7. Antécédent de 9 : on résout 2x − 3 = 9, donc 2x = 12 et x = 6. Vérification
    : f(6) = 12 − 3 = 9.'
exercices:
- id: image-par-calcul
  type: nombre
  difficulte: 1
  enonce: On donne f(x) = −2x + 7. Calcule l'image de 3 par f.
  reponse:
    valeur: 1
    forme: libre
  indices:
    relance: Le nombre 3 est-il le nombre de départ ou le nombre d'arrivée ?
    methode: 'Remplace x par 3 dans l''expression, puis respecte les priorités : la multiplication d''abord.'
    etape: Commence par calculer −2 × 3, puis ajoute 7 à ce résultat.
  pieges:
  - si:
      valeur: 13
    relance: 'Attention au signe : −2 × 3 donne-t-il un nombre positif ou négatif ?'
  - si:
      valeur: 2
    relance: 'Tu as cherché le nombre qui a pour image 3. Mais ici, on part de 3 : que vaut f(3) ?'
  solution: f(3) = −2 × 3 + 7 = −6 + 7 = 1. L'image de 3 par f est 1.
- id: image-sur-graphique
  type: nombre
  difficulte: 1
  enonce: Sur un graphique, la courbe d'une fonction f passe exactement par les points (−3 ; 4), (0 ; −2), (2 ; 0) et (5 ;
    3). Quelle est l'image de 0 par f ?
  reponse:
    valeur: -2
    forme: libre
  indices:
    relance: Pour trouver une image sur un graphique, part-on de l'axe des abscisses ou de l'axe des ordonnées ?
    methode: On part de 0 sur l'axe des abscisses, on va jusqu'à la courbe, et on lit l'ordonnée du point atteint.
    etape: Cherche, parmi les points donnés, celui dont la première coordonnée (l'abscisse) vaut 0. Son image est sa seconde
      coordonnée.
  pieges:
  - si:
      valeur: 2
    relance: 'Tu as donné le nombre dont l''image est 0 : dans ce cas, 0 est à l''arrivée. Ici, 0 est le nombre de départ.
      Quel point a pour abscisse 0 ?'
  solution: 'Le point (0 ; −2) est sur la courbe : son abscisse est 0 et son ordonnée est −2. Donc f(0) = −2 : l''image de
    0 est −2.'
- id: antecedents-tableau
  type: choix
  difficulte: 2
  enonce: 'Voici le tableau de valeurs d''une fonction h. Ligne des x : 0 ; 1 ; 2 ; 3 ; 4 ; 5 ; 6. Ligne des h(x) : 5 ; 2
    ; 1 ; 2 ; 5 ; 10 ; 17. Quels sont les antécédents de 5 par h ?'
  reponse:
    options:
    - id: a
      texte: '0'
    - id: b
      texte: '4'
    - id: c
      texte: '10'
    - id: d
      texte: '3'
    bonnes:
    - a
    - b
  indices:
    relance: Le nombre 5 est-il au départ ou à l'arrivée ? Dans quelle ligne du tableau faut-il donc le chercher ?
    methode: Cherche 5 dans la ligne des h(x) ; les antécédents sont les nombres écrits juste au-dessus. Il peut y en avoir
      plusieurs.
    etape: Parcours toute la ligne des h(x) de gauche à droite et entoure chaque case qui contient 5.
  pieges:
  - si:
      contient:
      - c
    relance: '10 est l''image de 5 : tu as cherché 5 dans la ligne des x. Or on cherche les nombres qui ont 5 pour image.'
  - si:
      contient:
      - d
    relance: 'Regarde la case sous 3 : quelle est l''image de 3 ? Est-ce 5 ?'
  - si:
      diagnostic: incomplet
    relance: Un nombre peut avoir plusieurs antécédents. As-tu parcouru toute la ligne des images ?
  solution: 'Dans la ligne des h(x), 5 apparaît deux fois : sous 0 et sous 4. Donc h(0) = 5 et h(4) = 5 : les antécédents
    de 5 sont 0 et 4. (10 est l''image de 5, ce n''est pas la question.)'
- id: antecedent-par-calcul
  type: nombre
  difficulte: 2
  enonce: On donne g(x) = 3x − 5. Détermine par le calcul l'antécédent de 16 par g.
  reponse:
    valeur: 7
    forme: libre
  indices:
    relance: On cherche le nombre x dont l'image est 16. Quelle équation cela donne-t-il ?
    methode: 'Écris l''équation g(x) = 16, puis résous-la : isole d''abord le terme en x, puis divise.'
    etape: 'Résous 3x − 5 = 16 : commence par ajouter 5 aux deux membres.'
  pieges:
  - si:
      valeur: 43
    relance: Tu as calculé g(16), l'image de 16. Or on cherche le nombre de départ qui donne 16 à l'arrivée.
  - si:
      valeur: 11/3
    relance: 'Vérifie le premier pas : pour enlever − 5 du membre de gauche, faut-il ajouter ou soustraire 5 aux deux membres
      ?'
  solution: 'On résout 3x − 5 = 16 : 3x = 16 + 5 = 21, donc x = 21 ÷ 3 = 7. Vérification : g(7) = 21 − 5 = 16. L''antécédent
    de 16 est 7.'
- id: antecedent-de-zero
  type: nombre
  difficulte: 3
  enonce: On donne k(x) = 4x + 3. Détermine l'antécédent de 0 par k. Tu peux répondre par une fraction ou un nombre décimal.
  reponse:
    valeur: -3/4
    forme: libre
  indices:
    relance: Quelle équation faut-il résoudre pour trouver le nombre qui a pour image 0 ?
    methode: 'Résous k(x) = 0 : isole d''abord le terme en x, puis divise par le nombre devant x.'
    etape: Dans 4x + 3 = 0, commence par enlever 3 aux deux membres. Attention au signe.
  pieges:
  - si:
      valeur: 3
    relance: Tu as calculé k(0), l'image de 0. On cherche au contraire le nombre de départ qui donne 0.
  - si:
      valeur: 3/4
    relance: 'Vérifie ta réponse en calculant son image : trouves-tu 0 ? Regarde le signe après avoir enlevé 3.'
  - si:
      valeur: -4/3
    relance: Pour isoler x dans 4x = ..., par quoi faut-il diviser ? Vérifie en calculant l'image de ta réponse.
  solution: 'On résout 4x + 3 = 0 : 4x = −3, donc x = −3/4 = −0,75. Vérification : 4 × (−0,75) + 3 = −3 + 3 = 0.'
- id: un-seul-antecedent
  type: ouverte
  difficulte: 3
  enonce: 'On donne f(x) = x². Lina affirme : « L''antécédent de 4 par f, c''est 2. » A-t-elle entièrement raison ? Explique.'
  criteres:
  - L'élève vérifie que 2 est bien un antécédent de 4, car 2² = 4.
  - 'L''élève montre que −2 est aussi un antécédent de 4, car (−2)² = 4, et conclut qu''il ne faut pas dire « l''antécédent
    » : 4 en a deux.'
  indices:
    relance: Un nombre peut-il avoir plusieurs antécédents ?
    methode: Cherche tous les nombres dont le carré vaut 4, sans oublier les nombres négatifs.
    etape: Calcule le carré de −2. Que remarques-tu ?
  solution: '2 est bien un antécédent de 4, car 2² = 4. Mais (−2)² = 4 aussi : −2 est un autre antécédent de 4. Lina a donc
    tort de dire « l''antécédent » : 4 a deux antécédents par f, 2 et −2.'
- id: nblm-soit-la-fonction-f-definie-par-f-x-3x-5-1
  type: choix
  difficulte: 2
  enonce: Soit la fonction f définie par f(x) = 3x - 5. Quelle est l'image de 4 par la fonction f ?
  reponse:
    options:
    - id: o1
      texte: '7'
    - id: o2
      texte: '3'
    - id: o3
      texte: '1'
    - id: o4
      texte: '-5'
    bonnes:
    - o1
  indices:
    relance: Remplace la variable x par 4 dans la formule 3x - 5 et effectue le calcul.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : résoudre l''équation 3x - 5 = 4 (ce qui donnerait x = 3) au lieu de calculer l''image de 4.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : effectuer l''opération dans le mauvais ordre ou faire une erreur d''addition/soustraction.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre l''image de 4 avec l''ordonnée à l''origine f(0) = -5.'
  solution: '7. C''est exact : pour calculer l''image de 4, on remplace x par 4 dans l''expression : f(4) = 3 × 4 - 5 = 12
    - 5 = 7.'
- id: nblm-dans-un-tableau-de-valeurs-d-une-fonctio-2
  type: choix
  difficulte: 2
  enonce: Dans un tableau de valeurs d'une fonction g, la ligne des x contient -2 et juste en dessous, sur la ligne des g(x),
    se trouve le nombre 8. Quelle interprétation est correcte ?
  reponse:
    options:
    - id: o1
      texte: L'image de -2 par la fonction g est 8.
    - id: o2
      texte: L'image de 8 par la fonction g est -2.
    - id: o3
      texte: -2 est l'image de 8 par la fonction g.
    - id: o4
      texte: 8 est un antécédent de -2 par la fonction g.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que x est le nombre de départ (en haut) et g(x) est l'image (en dessous).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : lire le tableau de bas en haut et confondre le nombre de départ avec son image.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : inverser les rôles de l''antécédent (-2) et de l''image (8).'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : confondre l''image (8) et l''antécédent (-2) dans la formulation du vocabulaire.'
  solution: 'L''image de -2 par la fonction g est 8. C''est exact : dans un tableau de valeurs, la première ligne indique
    le nombre de départ x et la deuxième ligne donne son image g(x).'
- id: nblm-soit-la-fonction-h-definie-par-h-x-2x-4-3
  type: choix
  difficulte: 2
  enonce: Soit la fonction h définie par h(x) = 2x + 4. Quel nombre a pour image 10 par la fonction h ?
  reponse:
    options:
    - id: o1
      texte: '3'
    - id: o2
      texte: '24'
    - id: o3
      texte: '7'
    - id: o4
      texte: '5'
    bonnes:
    - o1
  indices:
    relance: Le nombre 10 est l'image (le résultat). Pose et résous l'équation 2x + 4 = 10 pour trouver x.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : calculer h(10) = 2 × 10 + 4 = 24 au lieu de chercher l''antécédent de 10.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : ajouter 4 à 10 au lieu de soustraire 4 avant de diviser par 2.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : diviser directement 10 par 2 sans soustraire le terme constant 4.'
  solution: '3. C''est exact : chercher le nombre qui a pour image 10 revient à résoudre l''équation h(x) = 10, soit 2x +
    4 = 10, d''où 2x = 6 et x = 3.'
- id: nblm-on-considere-la-fonction-f-definie-par-f-4
  type: choix
  difficulte: 2
  enonce: On considère la fonction f définie par f(x) = x² - 4. Résoudre l'équation f(x) = 0 revient à trouver le nombre de
    départ qui donne 0. Quelles sont les solutions ?
  reponse:
    options:
    - id: o1
      texte: -2 et 2
    - id: o2
      texte: Seulement 2
    - id: o3
      texte: '-4'
    - id: o4
      texte: Seulement 4
    bonnes:
    - o1
  indices:
    relance: Cherche les nombres dont le carré vaut 4. N'oublie pas qu'un nombre positif a deux antécédents pour la fonction
      carré.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : oublier l''antécédent négatif -2 dont le carré donne aussi 4.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : calculer f(0) = -4 au lieu de chercher les valeurs de x qui annulent f(x).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre la valeur de x² (qui vaut 4) avec la valeur de la variable x.'
  solution: '-2 et 2. C''est exact : (-2)² - 4 = 0 et 2² - 4 = 0. Le nombre 0 possède donc deux antécédents par f, qui sont
    -2 et 2.'
- id: nblm-sur-la-representation-graphique-d-une-fo-5
  type: choix
  difficulte: 2
  enonce: Sur la représentation graphique d'une fonction f, le point A de coordonnées (3 ; -1) appartient à la courbe. Comment
    lire l'image sur le graphique ?
  reponse:
    options:
    - id: o1
      texte: L'image de 3 par la fonction f est -1.
    - id: o2
      texte: L'image de -1 par la fonction f est 3.
    - id: o3
      texte: 3 est l'image de -1 par la fonction f.
    - id: o4
      texte: -1 est un antécédent de 3 par la fonction f.
    bonnes:
    - o1
  indices:
    relance: L'abscisse x (horizontal) correspond au nombre de départ et l'ordonnée y (vertical) correspond à son image.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : inverser l''abscisse et l''ordonnée lors de la lecture des coordonnées d''un point.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre le rôle de l''axe des abscisses et de l''axe des ordonnées.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : attribuer le rôle d''antécédent à l''ordonnée au lieu de l''abscisse.'
  solution: 'L''image de 3 par la fonction f est -1. C''est exact : l''abscisse (3) se lit sur l''axe horizontal (départ)
    et l''ordonnée (-1) se lit sur l''axe vertical (image).'
- id: nblm-soit-la-fonction-f-definie-par-f-x-2x-1-6
  type: choix
  difficulte: 3
  enonce: Soit la fonction f définie par f(x) = 2x + 1. Quelles affirmations sont VRAIES ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'image de 0 par la fonction f est 1.
    - id: o2
      texte: Le nombre 2 est un antécédent de 5 par la fonction f.
    - id: o3
      texte: L'image de 5 par la fonction f est 2.
    - id: o4
      texte: Un même nombre de départ peut avoir deux images différentes par f.
    bonnes:
    - o1
    - o2
  indices:
    relance: Effectue les calculs pour f(0) et f(2), et rappelle-toi qu'un nombre n'a qu'une seule image.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : f(5) = 2 × 5 + 1 = 11. Il ne faut pas confondre l''image et l''antécédent.'
  - si:
      contient:
      - o4
    relance: 'Faux : par définition d''une fonction, chaque nombre possède une unique image.'
  solution: 'L''image de 0 par la fonction f est 1 ; Le nombre 2 est un antécédent de 5 par la fonction f. Vrai : en calculant
    f(0) = 2 × 0 + 1, on trouve 1.'
- id: nblm-si-f-4-9-quel-mot-de-vocabulaire-qualifi-7
  type: texte_court
  difficulte: 1
  enonce: Si f(4) = 9, quel mot de vocabulaire qualifie le nombre de départ 4 par rapport au nombre 9 ?
  reponse:
    acceptees:
    - antécédent
    fautes_tolerees: 1
  indices:
    relance: Il s'agit du terme mathématique désignant la valeur située au départ de la fonction.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'antécédent. C''est exact : le nombre de départ 4 dont l''image est 9 s''appelle un antécédent.'
- id: nblm-soit-la-fonction-g-definie-par-g-x-5x-2-8
  type: texte_court
  difficulte: 1
  enonce: Soit la fonction g définie par g(x) = 5x - 2. Calculer l'image du nombre 3 par la fonction g.
  reponse:
    acceptees:
    - '13'
    fautes_tolerees: 1
  indices:
    relance: Remplace x par 3 dans l'expression 5x - 2 et effectue le calcul.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: '13. C''est exact : g(3) = 5 × 3 - 2 = 15 - 2 = 13.'
- id: image-d-un-negatif
  type: nombre
  difficulte: 2
  enonce: On donne f(x) = x² − 3x + 1. Calcule l'image de −2 par f.
  reponse:
    valeur: 11
    forme: libre
  indices:
    relance: Quel est le nombre de départ ? Par quoi faut-il remplacer x dans l'expression ?
    methode: Remplace x par (−2) avec des parenthèses. Calcule d'abord (−2)², puis −3 × (−2), puis additionne.
    etape: (−2)² donne un nombre positif. Calcule aussi −3 × (−2), en faisant attention aux signes.
  pieges:
  - si:
      valeur: 3
    relance: 'Attention aux signes : que vaut −3 × (−2), un nombre positif ou négatif ?'
  - si:
      valeur: -9
    relance: Le carré d'un nombre négatif est positif, et −3 × (−2) aussi. Refais les deux calculs avec des parenthèses.
  solution: f(−2) = (−2)² − 3 × (−2) + 1 = 4 + 6 + 1 = 11. L'image de −2 est 11.
- id: image-ou-antecedent
  type: association
  difficulte: 2
  enonce: On donne f(x) = 2x + 1. Associe chaque question à sa réponse. Une réponse ne sert pas.
  reponse:
    gauche:
    - id: a
