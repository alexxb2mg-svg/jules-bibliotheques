  indices:
    relance: Pour chaque phrase, quelle opération fait-on en premier ?
    methode: Écris les opérations dans l'ordre de la phrase. Une parenthèse sert à faire une opération avant les autres.
    etape: 'Pour « on ajoute 3 à x, puis on double », l''addition se fait avant la multiplication : faut-il une parenthèse
      ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Relis les deux premières phrases : l''ordre des opérations n''est pas le même.'
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque phrase et écris les opérations dans l'ordre où on les fait.
  solution: 'a : double de x puis +3 donne 2x + 3. b : (x + 3) puis double donne 2(x + 3). c : x ÷ 2. d : le nombre suivant
    x est x + 1. x − 3 ne sert pas.'
- id: rattraper-le-cycliste
  type: nombre
  difficulte: 3
  enonce: Marie part en voiture à midi et roule à vitesse constante de 60 km/h. Paul part du même endroit une heure plus tard,
    sur la même route, à vitesse constante de 90 km/h. Combien d'heures Paul a-t-il roulé quand il rattrape Marie ?
  reponse:
    valeur: 2
    forme: entier
  indices:
    relance: Quand Paul démarre, Marie roule déjà depuis une heure. Combien d'heures a roulé Marie quand Paul a roulé t heures
      ?
    methode: Distance = vitesse × durée. Écris la distance de chacun en fonction de t, puis écris que les deux distances sont
      égales.
    etape: Marie a parcouru 60(t + 1) et Paul 90t. Écris l'égalité, développe, puis résous.
  pieges:
  - si:
      valeur: 3
    relance: 3 est la durée de trajet de Marie. La question demande la durée de trajet de Paul.
  - si:
      valeur: 1
    relance: 'Vérifie ton résultat : au bout de ce temps, calcule la distance de chacun. Sont-elles égales ?'
  solution: 'Soit t la durée de trajet de Paul, en heures. Marie a roulé t + 1 heures. Elle a parcouru 60(t + 1) km, Paul
    90t km. 60(t + 1) = 90t donne 60t + 60 = 90t, donc 60 = 30t, donc t = 2. Vérification : Marie 60 × 3 = 180 km, Paul 90
    × 2 = 180 km. Paul a roulé 2 heures.'
