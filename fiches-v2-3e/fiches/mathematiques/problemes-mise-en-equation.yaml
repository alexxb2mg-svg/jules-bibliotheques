format: 2
notion: problemes-mise-en-equation
version: 3
etat: verifiee
declencheurs:
- choisir l'inconnue
- appeler x le nombre
- traduire l'énoncé en calcul
- je pense à un nombre
- problème d'âges
- retrouver le nombre de départ
- problème de prix
- trouver un nombre inconnu
- traduire un énoncé
prerequis:
- equations-premier-degre-et-produits
- developper-factoriser-reduire
essentiel: 'Beaucoup de problèmes se résolvent en les traduisant par une équation. On applique ensuite les méthodes de résolution.


  Les cinq étapes à connaître :

  1. Choisir l''inconnue : dire ce que représente x, avec son unité.

  2. Traduire les phrases de l''énoncé par des expressions en x, puis par une égalité.

  3. Résoudre l''équation.

  4. Vérifier que la valeur trouvée convient dans l''énoncé, et pas seulement dans l''équation.

  5. Conclure par une phrase qui répond à la question posée.


  Quelques traductions utiles, avec x le nombre cherché :

  le double de x : 2x ; le triple : 3x ; la moitié : x ÷ 2

  5 de plus que x : x + 5 ; 5 de moins que x : x − 5

  le nombre suivant x : x + 1 ; deux entiers consécutifs : x et x + 1

  dans 5 ans, une personne de x ans aura x + 5 ans (tout le monde vieillit).


  Exemple : Mia a 12 € de plus que Tom. À eux deux, ils ont 50 €. Soit x la somme de Tom. Mia a x + 12. Donc x + (x + 12)
  = 50, puis 2x + 12 = 50, et x = 19.


  Les problèmes viennent de situations concrètes : âges, prix, périmètres, tarifs à comparer, et aussi les sciences (distance
  = vitesse × durée). Pour comparer deux tarifs, on écrit que les deux prix sont égaux.


  Une solution de l''équation peut ne pas convenir au problème : un nombre de personnes doit être un entier positif, une longueur
  doit être positive. On vérifie toujours.


  Au brevet, la mise en équation est souvent guidée, mais on doit expliquer le choix de l''inconnue et conclure par une phrase.


  Exemple rédigé : Nour pense à un nombre, le multiplie par 4 et ajoute 7 : elle obtient 43. Soit x le nombre. 4x + 7 = 43,
  donc 4x = 36 et x = 9. Vérification : 4 × 9 + 7 = 43. Elle a pensé à 9.

  '
methode:
- 'Lire tout l''énoncé et repérer ce qu''on cherche : c''est souvent lui qu''on appelle x.'
- Écrire « Soit x ... » avec ce que x représente et son unité.
- Écrire chaque quantité de l'énoncé en fonction de x (le double, 5 de plus, dans 5 ans...).
- Repérer la phrase qui donne l'égalité (« on obtient », « coûtent le même prix », « la somme vaut »).
- Résoudre l'équation, puis vérifier dans l'énoncé.
- Répondre par une phrase, avec l'unité, à la question posée.
vocabulaire:
- terme: inconnue
  definition: Le nombre qu'on cherche, désigné par une lettre comme x.
- terme: équation
  definition: Une égalité qui contient une inconnue.
- terme: solution d'une équation
  definition: Une valeur de l'inconnue pour laquelle l'égalité est vraie.
- terme: mise en équation
  definition: Traduire un problème par une équation.
- terme: membre
  definition: Chaque côté du signe égal dans une équation.
- terme: consécutifs
  definition: Des entiers qui se suivent, comme 7, 8 et 9.
- terme: énoncé
  definition: Le texte qui décrit le problème et pose la question.
erreurs_frequentes:
- Ne pas dire ce que représente x, puis répondre à une autre question que celle posée.
- Oublier qu'une durée qui passe fait vieillir toutes les personnes du problème.
- Dans un périmètre de rectangle, ne compter qu'une longueur et une largeur.
- Donner la valeur d'une autre grandeur (un prix au lieu d'un nombre de séances).
- Ne pas vérifier que la solution a du sens (un nombre de personnes doit être entier et positif).
exemple:
  enonce: Mia a 12 € de plus que Tom. À eux deux, ils ont 50 €. Combien Tom a-t-il ?
  solution: 'Soit x la somme de Tom, en euros. Mia a x + 12. On traduit : x + (x + 12) = 50, donc 2x + 12 = 50, 2x = 38, x
    = 19. Vérification : 19 + 31 = 50. Tom a 19 €.'
exercices:
- id: etapes-mise-en-equation
  type: ordre
  difficulte: 1
  enonce: Remets dans l'ordre les étapes de la résolution d'un problème par une équation.
  reponse:
    elements:
    - id: a
      texte: Choisir l'inconnue et dire ce qu'elle représente
    - id: b
      texte: Traduire l'énoncé par une équation
    - id: c
      texte: Résoudre l'équation
    - id: d
      texte: Vérifier que la solution convient dans l'énoncé
    - id: e
      texte: Conclure par une phrase qui répond à la question
  indices:
    relance: Peut-on écrire une équation avant de savoir ce que représente x ?
    methode: 'Pense à l''ordre dans lequel tu écris ta copie : d''abord ce que tu poses, à la fin ta réponse.'
    etape: On commence par choisir l'inconnue. Qu'est-ce qu'on peut faire juste après ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Peut-on vérifier une solution qu'on n'a pas encore trouvée ?
  - si:
      diagnostic: ordre_faux
    relance: 'Reprends depuis le début : qu''écrit-on en tout premier sur sa copie ?'
  solution: On choisit l'inconnue, on traduit l'énoncé par une équation, on la résout, on vérifie que la solution convient,
    puis on conclut par une phrase.
- id: je-pense-a-un-nombre
  type: nombre
  difficulte: 1
  enonce: Nour pense à un nombre. Elle le multiplie par 4, puis ajoute 7 au résultat. Elle obtient 43. À quel nombre Nour
    a-t-elle pensé ?
  reponse:
    valeur: 9
  indices:
    relance: Si on appelle x le nombre de départ, comment écrire « le multiplier par 4 puis ajouter 7 » ?
    methode: Écris l'équation 4x + 7 = 43, puis résous-la.
    etape: 'Soustrais 7 aux deux membres : 4x = 36. Termine.'
  pieges:
  - si:
      valeur: 12.5
    relance: Pour annuler « ajouter 7 », faut-il ajouter 7 ou soustraire 7 ?
  - si:
      valeur: 36
    relance: 36, c'est 4 fois le nombre cherché. Que reste-t-il à faire ?
  solution: 'Soit x le nombre pensé : 4x + 7 = 43, donc 4x = 36, donc x = 9. Vérification : 4 × 9 + 7 = 43. Nour a pensé à
    9.'
- id: choisir-equation-ages
  type: choix
  difficulte: 2
  enonce: Ambre a trois fois l'âge de son frère Noé. Dans 5 ans, la somme de leurs âges sera 50 ans. On note x l'âge actuel
    de Noé, en années. Quelles équations traduisent correctement ce problème ? Choisis toutes les bonnes réponses.
  reponse:
    options:
    - id: a
      texte: x + 3x = 50
    - id: b
      texte: (x + 5) + (3x + 5) = 50
    - id: c
      texte: x + 5 + 3x = 50
    - id: d
      texte: 4x + 10 = 50
    bonnes:
    - b
    - d
  indices:
    relance: Dans 5 ans, quel âge aura Noé ? Et Ambre ?
    methode: Écris l'âge de chacun dans 5 ans en fonction de x, additionne, puis compare avec chaque proposition, éventuellement
      après avoir réduit.
    etape: Aujourd'hui, Ambre a 3x ans. Dans 5 ans, Noé aura x + 5 ans. Et Ambre ?
  pieges:
  - si:
      contient:
      - a
    relance: Cette équation parle des âges d'aujourd'hui. Or la somme de 50 ans, c'est dans 5 ans.
  - si:
      contient:
      - c
    relance: Tu as fait vieillir Noé de 5 ans. Et Ambre, elle, ne vieillit pas ?
  - si:
      diagnostic: incomplet
    relance: Une autre proposition est la même équation, écrite autrement. Réduis ta bonne réponse.
  solution: 'Dans 5 ans, Noé aura x + 5 ans et Ambre 3x + 5 ans. L''équation est (x + 5) + (3x + 5) = 50, qui se réduit en
    4x + 10 = 50. On trouve x = 10 : Noé a 10 ans, Ambre 30 ans.'
- id: perimetre-rectangle
  type: nombre
  difficulte: 2
  enonce: Un rectangle a une longueur qui dépasse sa largeur de 7 cm. Son périmètre est 54 cm. Quelle est sa largeur, en cm
    ?
  reponse:
    valeur: 10
  indices:
    relance: Si x est la largeur en cm, comment écris-tu la longueur ?
    methode: Le périmètre d'un rectangle, c'est 2 × (longueur + largeur). Écris l'équation puis résous-la.
    etape: La longueur vaut x + 7, donc le périmètre vaut 2(x + x + 7). Écris qu'il vaut 54 et développe.
  pieges:
  - si:
      valeur: 23.5
    relance: Tu as écrit que x + (x + 7) = 54. Mais le périmètre compte deux longueurs et deux largeurs.
  - si:
      valeur: 17
    relance: 17 cm, c'est la longueur. La question demande la largeur.
  - si:
      valeur: 13.5
    relance: 'Tu as divisé 54 par 4 : cela marche pour un carré. Ici la longueur dépasse la largeur de 7 cm.'
  solution: 'Soit x la largeur, en cm. La longueur vaut x + 7. 2(x + x + 7) = 54, donc 4x + 14 = 54, donc 4x = 40 et x = 10.
    Vérification : longueur 17 cm, 2 × (10 + 17) = 54. La largeur est 10 cm.'
- id: deux-tarifs-cinema
  type: nombre
  difficulte: 3
  enonce: 'Au cinéma, deux formules : sans abonnement, chaque séance coûte 8 € ; avec abonnement, on paie 24 € pour l''année
    puis 5 € par séance. Pour combien de séances les deux formules coûtent-elles exactement le même prix ?'
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Appelle x le nombre de séances. Combien paie-t-on pour x séances avec chaque formule ?
    methode: Écris le prix de chaque formule en fonction de x, puis écris l'égalité des deux prix et résous-la.
    etape: Avec abonnement, x séances coûtent 24 + 5x euros. Écris le prix sans abonnement, puis l'égalité.
  pieges:
  - si:
      valeur: 64
    relance: 64 €, c'est le prix payé. La question demande un nombre de séances.
  - si:
      valeur: 3
    relance: 3, c'est le nombre devant x après avoir regroupé les x. Il reste une étape.
  - si:
      valeur: 24/13
    relance: Pour regrouper les x, on soustrait 5x des deux côtés. Refais ce calcul.
  solution: 'Soit x le nombre de séances. 24 + 5x = 8x, donc 24 = 3x, donc x = 24 ÷ 3 = 8. Vérification : 24 + 5 × 8 = 64
    et 8 × 8 = 64. Les deux formules coûtent le même prix pour 8 séances.'
- id: trois-entiers-consecutifs
  type: ouverte
  difficulte: 3
  enonce: La somme de trois nombres entiers consécutifs est 186. Quels sont ces trois nombres ? Explique ta mise en équation.
  criteres:
  - L'élève choisit une inconnue (par exemple x le plus petit nombre) et écrit les deux autres x + 1 et x + 2.
  - L'élève écrit et résout l'équation x + (x + 1) + (x + 2) = 186, soit 3x + 3 = 186.
  - L'élève conclut que les nombres sont 61, 62 et 63, et vérifie que leur somme fait 186.
  indices:
    relance: Si le plus petit des trois nombres s'appelle x, comment écrire les deux suivants ?
    methode: Additionne les trois expressions, réduis, puis résous l'équation obtenue.
    etape: x + (x + 1) + (x + 2) se réduit en 3x + 3. Écris l'équation et résous-la.
  solution: 'Soit x le plus petit nombre. x + (x + 1) + (x + 2) = 186, donc 3x + 3 = 186, 3x = 183, x = 61. Les nombres sont
    61, 62 et 63 ; vérification : 61 + 62 + 63 = 186.'
- id: nblm-dans-la-resolution-d-un-probleme-par-mis-1
  type: choix
  difficulte: 2
  enonce: Dans la résolution d'un problème par mise en équation, quelle est la première étape indispensable pour traduire
    la situation ?
  reponse:
    options:
    - id: o1
      texte: Choisir l'inconnue et préciser ce que représente x avec son unité.
    - id: o2
      texte: Effectuer des calculs au hasard avec les nombres donnés.
    - id: o3
      texte: Tester toutes les valeurs possibles par essais et erreurs.
    - id: o4
      texte: Écrire une égalité numérique sans introduire de lettre.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qu'il faut définir au tout début pour donner du sens à la lettre x.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : calculer sans définir l''inconnue x empêche toute modélisation algébrique rigoureuse.'
  - si:
      contient:
      - o3
    relance: Les essais et erreurs ne constituent pas la méthode algébrique formelle de mise en équation attendue en 3e.
  - si:
      contient:
      - o4
    relance: La mise en équation nécessite obligatoirement le choix d'une lettre (l'inconnue) pour représenter la grandeur
      cherchée.
  solution: 'Choisir l''inconnue et préciser ce que représente x avec son unité. C''est l''étape fondamentale : définir clairement
    ce que représente x permet d''écrire l''équation exacte et de répondre à la question posée.'
- id: nblm-pour-le-probleme-je-pense-a-un-nombre-si-2
  type: choix
  difficulte: 2
  enonce: 'Pour le problème : « Je pense à un nombre. Si je le multiplie par 3 et que j''ajoute 7, j''obtiens 25. », quelle
    équation traduit cet énoncé en appelant x le nombre de départ ?'
  reponse:
    options:
    - id: o1
      texte: 3x + 7 = 25
    - id: o2
      texte: x + 3 × 7 = 25
    - id: o3
      texte: 3(x + 7) = 25
    - id: o4
      texte: x / 3 + 7 = 25
    bonnes:
    - o1
  indices:
    relance: 'Suis pas à pas l''ordre des opérations énoncées : d''abord la multiplication par 3, puis l''addition de 7.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de traduction : cela signifierait qu''on ajoute le produit de 3 par 7 au nombre x.'
  - si:
      contient:
      - o3
    relance: 'Erreur de priorité : cette écriture traduirait ''ajouter 7 au nombre puis multiplier le résultat par 3''.'
  - si:
      contient:
      - o4
    relance: Confondre multiplier par 3 et diviser par 3 est une fausse traduction des termes de l'énoncé.
  solution: 3x + 7 = 25. Multiplier x par 3 donne 3x, puis ajouter 7 donne 3x + 7, le tout égal à 25.
- id: nblm-en-resolvant-l-equation-3x-7-25-de-l-exe-3
  type: choix
  difficulte: 2
  enonce: En résolvant l'équation 3x + 7 = 25 de l'exercice « Je pense à un nombre », quelle valeur permet de retrouver le
    nombre de départ ?
  reponse:
    options:
    - id: o1
      texte: '6'
    - id: o2
      texte: '18'
    - id: o3
      texte: '32'
    - id: o4
      texte: '8'
    bonnes:
    - o1
  indices:
    relance: Isole x en soustrayant d'abord 7 à 25, puis divise le résultat par 3.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : s''arrêter à 3x = 18 sans diviser par le coefficient 3.'
  - si:
      contient:
      - o3
    relance: 'Erreur de signe : ajouter 7 au lieu de le soustraire du membre de droite (3x = 25 + 7 = 32).'
  - si:
      contient:
      - o4
    relance: Erreur de calcul mental lors de la soustraction ou de la division.
  solution: '6. 3x = 25 - 7 = 18, d''où x = 18 / 3 = 6. On vérifie : 3 × 6 + 7 = 25.'
- id: nblm-considerons-un-probleme-d-ages-marc-a-5-4
  type: choix
  difficulte: 2
  enonce: 'Considérons un problème d''âges : Marc a 5 ans de plus que Léa. Dans 3 ans, la somme de leurs âges sera 25 ans.
    En choisissant d''appeler x l''âge actuel de Léa, quelle expression représente l''âge de Marc dans 3 ans ?'
  reponse:
    options:
    - id: o1
      texte: x + 8
    - id: o2
      texte: x + 5
    - id: o3
      texte: x + 3
    - id: o4
      texte: 3x + 5
    bonnes:
    - o1
  indices:
    relance: Exprime d'abord l'âge actuel de Marc en fonction de x, puis ajoute-lui les 3 années écoulées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : oublier que les 3 années qui s''écoulent font aussi vieillir Marc.'
  - si:
      contient:
      - o3
    relance: C'est l'expression de l'âge de Léa dans 3 ans, pas celui de Marc.
  - si:
      contient:
      - o4
    relance: Confondre l'écoulement de 3 ans (+3) avec une multiplication par 3 est une erreur de modélisation.
  solution: x + 8. L'âge actuel de Marc est x + 5. Dans 3 ans, il aura (x + 5) + 3 = x + 8 ans.
- id: nblm-lorsqu-on-resout-un-probleme-par-une-equ-5
  type: choix
  difficulte: 2
  enonce: Lorsqu'on résout un problème par une équation, que faut-il obligatoirement faire après avoir trouvé la valeur numérique
    de x ?
  reponse:
    options:
    - id: o1
      texte: Vérifier la solution dans l'énoncé concret et conclure par une phrase avec les unités.
    - id: o2
      texte: S'arrêter dès la résolution algébrique sans relire l'énoncé du problème.
    - id: o3
      texte: Multiplier le résultat par 2 pour s'assurer que le calcul est juste.
    - id: o4
      texte: Changer la lettre x pour recommencer l'équation avec une autre inconnue.
    bonnes:
    - o1
  indices:
    relance: Pense à l'étape finale qui relie le nombre x obtenu à l'histoire concrète racontée dans le problème.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Oublier de vérifier dans l'énoncé réel risque de faire accepter une solution incohérente (ex. un nombre de personnes
      négatif).
  - si:
      contient:
      - o3
    relance: Multiplier par 2 ne constitue en aucun cas une démarche de vérification d'un problème.
  - si:
      contient:
      - o4
    relance: Remplacer x par une autre lettre est inutile si le raisonnement et les calculs sont corrects.
  solution: 'Vérifier la solution dans l''énoncé concret et conclure par une phrase avec les unités. C''est l''étape finale
    : s''assurer que la valeur a du sens par rapport au problème réel et formuler une réponse claire.'
- id: nblm-dans-la-resolution-de-problemes-par-mise-6
  type: choix
  difficulte: 3
  enonce: Dans la résolution de problèmes par mise en équation, quelles sont les DEUX erreurs fréquentes identifiées dans
    la méthode ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Ne pas préciser ce que représente l'inconnue x au début de la démarche.
    - id: o2
      texte: Oublier qu'une durée qui passe fait vieillir toutes les personnes dans un problème d'âges.
    - id: o3
      texte: Soustraire un même nombre aux deux membres d'une équation pour l'isoler.
    - id: o4
      texte: Vérifier que la solution numérique obtenue a du sens dans le contexte du problème.
    bonnes:
    - o1
    - o2
  indices:
    relance: Coche les deux comportements erronés souvent commis lors de la traduction de l'énoncé ou de sa modélisation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est une règle d'équivalence tout à fait exacte et recommandée pour résoudre une équation.
  - si:
      contient:
      - o4
    relance: Ce n'est pas une erreur, mais une étape indispensable de la démarche de résolution.
  solution: 'Ne pas préciser ce que représente l''inconnue x au début de la démarche ; Oublier qu''une durée qui passe fait
    vieillir toutes les personnes dans un problème d''âges. C''est une erreur classique : sans définition claire de x, on
    risque de répondre à une autre question que celle posée.'
- id: nblm-dans-la-resolution-d-un-probleme-concret-7
  type: texte_court
  difficulte: 1
  enonce: Dans la résolution d'un problème concret, la première étape consiste à appeler x la grandeur cherchée. Comment qualifie-t-on
    la lettre x qu'il faut choisir ?
  reponse:
    acceptees:
    - l'inconnue
    fautes_tolerees: 1
  indices:
    relance: C'est le terme mathématique désignant la quantité cherchée représentée par une lettre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: l'inconnue. Le choix de l'inconnue x est la toute première étape indispensable pour traduire un problème en équation.
- id: nblm-pour-le-probleme-je-pense-a-un-nombre-je-8
  type: texte_court
  difficulte: 1
  enonce: Pour le problème « Je pense à un nombre, je lui ajoute 12 et j'obtiens 30 », quelle opération permet de retrouver
    le nombre de départ 18 à partir de 30 et 12 ?
  reponse:
    acceptees:
    - une soustraction
    fautes_tolerees: 1
  indices:
    relance: Nomme l'opération inverse de l'addition.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: une soustraction. On résout x + 12 = 30 en effectuant la soustraction 30 - 12 = 18 pour retrouver le nombre de
    départ x.
- id: traduire-expressions
  type: association
  difficulte: 1
  enonce: Associe chaque phrase à l'expression qui la traduit, avec x le nombre de départ. Une expression ne sert pas.
  reponse:
    gauche:
    - id: a
      texte: On double x, puis on ajoute 3
    - id: b
      texte: On ajoute 3 à x, puis on double
    - id: c
      texte: La moitié de x
    - id: d
      texte: Le nombre entier qui suit x
    droite:
    - id: p
      texte: 2x + 3
    - id: q
      texte: 2(x + 3)
    - id: r
      texte: x ÷ 2
    - id: s
      texte: x + 1
    - id: t
