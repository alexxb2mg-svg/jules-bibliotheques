format: 2
notion: probabilites-experiences-simples
version: 1
etat: verifiee
declencheurs:
- une chance sur
- chances de tirer
- dé à six faces
- au hasard dans un sac
- issues équiprobables
prerequis:
- 4e-probabilites-4e
- fractions-irreductibles
essentiel: 'Une expérience aléatoire a plusieurs issues possibles, et on ne peut pas prévoir laquelle se produira.

  Un événement est formé de certaines issues. On dit qu''une issue le réalise.


  Quand toutes les issues ont la même chance de se produire (dé équilibré, tirage au hasard) :

  probabilité d''un événement = nombre d''issues favorables ÷ nombre total d''issues.


  Une probabilité est toujours comprise entre 0 (événement impossible) et 1 (événement certain).

  P(non A) = 1 − P(A) : c''est la probabilité de l''événement contraire.


  Quand on répète une expérience un grand nombre de fois, la fréquence d''un événement se rapproche de sa probabilité (elle
  se stabilise). On peut ainsi estimer une probabilité qu''on ne sait pas calculer. Sur peu d''essais, la fréquence peut être
  loin de la probabilité.

  '
methode:
- Lister (ou compter) toutes les issues possibles et vérifier qu'elles ont la même chance de se produire.
- Compter les issues favorables à l'événement.
- 'Calculer : issues favorables ÷ issues possibles, puis simplifier la fraction.'
- 'Pour l''événement contraire : calculer 1 − P(A).'
- Vérifier que le résultat est entre 0 et 1.
vocabulaire:
- terme: issue
  definition: Un résultat possible d'une expérience aléatoire.
- terme: événement
  definition: Ensemble d'issues ; par exemple « obtenir un nombre pair » avec un dé.
- terme: équiprobable
  definition: Se dit d'issues qui ont toutes la même probabilité.
- terme: événement contraire
  definition: L'événement « non A », réalisé exactement quand A ne l'est pas.
erreurs_frequentes:
- 'Compter les couleurs au lieu des boules : avec 3 couleurs, la probabilité d''une couleur n''est pas forcément 1/3.'
- Donner l'effectif (le nombre de boules) au lieu de la probabilité.
- Donner une probabilité plus grande que 1, ou un pourcentage sans le dire.
- 'Croire que le hasard a une mémoire : après trois 6 de suite, le 6 n''est ni plus ni moins probable.'
- Confondre fréquence observée sur quelques essais et probabilité.
exemple:
  enonce: Une urne contient 4 boules vertes et 6 boules jaunes. On tire une boule au hasard. Quelle est la probabilité de
    tirer une boule verte ? Et de ne pas tirer une boule verte ?
  solution: 'Il y a 10 boules, dont 4 vertes : P(verte) = 4/10 = 2/5. Événement contraire : P(non verte) = 1 − 2/5 = 3/5,
    ce qui correspond bien aux 6 jaunes sur 10.'
exercices:
- id: bille-bleue
  type: nombre
  difficulte: 1
  enonce: Un sac contient 3 billes rouges, 5 billes bleues et 2 billes vertes, indiscernables au toucher. On tire une bille
    au hasard. Quelle est la probabilité de tirer une bille bleue ? Donne une fraction irréductible a/b.
  reponse:
    valeur: 1/2
    forme: fraction_irreductible
  indices:
    relance: Combien y a-t-il de billes en tout dans le sac ? Et combien sont bleues ?
    methode: Probabilité = nombre de billes bleues ÷ nombre total de billes. Écris la fraction, puis simplifie-la.
    etape: 'Il y a 10 billes en tout : c''est le dénominateur. Le numérateur est le nombre de billes bleues.'
  pieges:
  - si:
      valeur: 1/3
    relance: Il y a 3 couleurs, mais pas le même nombre de billes de chaque couleur. Compte les billes, pas les couleurs.
  - si:
      valeur: 5
    relance: 5 est le nombre de billes bleues. Une probabilité compare ce nombre au nombre total de billes.
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est juste, mais elle se simplifie encore. Cherche un diviseur commun.
  - si:
      diagnostic: pas_une_fraction
    relance: Ta valeur est juste, mais on demande une fraction écrite a/b.
  solution: '5 billes bleues sur 10 billes : P(bleue) = 5/10 = 1/2.'
- id: de-multiple-de-3
  type: nombre
  difficulte: 2
  enonce: On lance un dé équilibré à six faces numérotées de 1 à 6. Quelle est la probabilité d'obtenir un multiple de 3 ?
    Donne une fraction irréductible a/b.
  reponse:
    valeur: 1/3
    forme: fraction_irreductible
  indices:
    relance: Quelles faces du dé portent un multiple de 3 ?
    methode: Liste les six issues, entoure celles qui réalisent l'événement, puis calcule issues favorables ÷ issues possibles.
    etape: Les issues sont 1, 2, 3, 4, 5 et 6. Parmi elles, entoure les nombres de la table de 3.
  pieges:
  - si:
      valeur: 1/6
    relance: 3 est un multiple de 3. Y a-t-il un autre multiple de 3 sur le dé ?
  - si:
      valeur: 2
    relance: 2 est le nombre d'issues favorables. La probabilité compare ce nombre au nombre total d'issues.
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est juste, mais elle se simplifie encore.
  - si:
      diagnostic: pas_une_fraction
    relance: Ta valeur est juste, mais on demande une fraction écrite a/b.
  solution: 'Les multiples de 3 sur le dé sont 3 et 6 : 2 issues favorables sur 6. P = 2/6 = 1/3.'
- id: evenement-contraire-pluie
  type: nombre
  difficulte: 2
  enonce: Selon la météo, la probabilité qu'il pleuve demain est 0,35. Quelle est la probabilité qu'il ne pleuve pas demain
    ? Donne un nombre décimal.
  reponse:
    valeur: 0.65
    forme: libre
  indices:
    relance: « Il ne pleut pas » est l'événement contraire de « il pleut ». Que vaut la somme de leurs probabilités ?
    methode: P(non A) = 1 − P(A).
    etape: Pose la soustraction 1 − 0,35 et effectue-la.
  pieges:
  - si:
      valeur: 0.35
    relance: C'est la probabilité qu'il pleuve. On demande celle de l'événement contraire.
  - si:
      valeur: 65
    relance: 'Une probabilité est comprise entre 0 et 1. Ton résultat est écrit comme un pourcentage : écris-le en nombre
      décimal.'
  - si:
      valeur: 0.75
    relance: 'Vérifie ta soustraction : ton résultat plus 0,35 doit faire exactement 1.'
  solution: P(il ne pleut pas) = 1 − 0,35 = 0,65.
- id: de-sans-memoire
  type: choix
  difficulte: 1
  enonce: 'Lina lance un dé équilibré à six faces. Elle vient d''obtenir 6 trois fois de suite. Au lancer suivant, la probabilité
    d''obtenir 6 est :'
  reponse:
    options:
    - id: a
      texte: plus petite qu'au premier lancer
    - id: b
      texte: la même qu'au premier lancer
    - id: c
      texte: plus grande qu'au premier lancer
    bonnes:
    - b
  indices:
    relance: Le dé se souvient-il des lancers précédents ?
    methode: Compte les issues possibles et les issues favorables pour ce nouveau lancer, sans tenir compte du passé.
    etape: Le dé a toujours six faces équilibrées, dont une seule porte le 6. Calcule la probabilité pour ce lancer.
  pieges:
  - si:
      contient:
      - a
    relance: Le dé ne « s'use » pas et n'a pas de mémoire. Ses faces ont-elles changé ?
  - si:
      contient:
      - c
    relance: Le dé n'est pas truqué. Les résultats passés changent-ils le nombre de faces portant un 6 ?
  solution: 'Le dé n''a pas de mémoire : à chaque lancer, il y a 6 issues équiprobables dont une seule donne 6. La probabilité
    reste 1/6, la même qu''au premier lancer.'
- id: stabilisation-punaise
  type: choix
  difficulte: 2
  enonce: On lance 1 000 fois une punaise. Elle retombe « pointe en l'air » 612 fois. Quelles affirmations sont vraies ?
  reponse:
    options:
    - id: a
      texte: La fréquence de « pointe en l'air » est 0,612.
    - id: b
      texte: On peut estimer la probabilité de « pointe en l'air » à environ 0,6.
    - id: c
      texte: Sur 10 lancers, la punaise retombera forcément 6 fois pointe en l'air.
    - id: d
      texte: La probabilité de « pointe en l'air » est exactement 0,612.
    bonnes:
    - a
    - b
  indices:
    relance: Quelle est la différence entre une fréquence observée et une probabilité ?
    methode: Fréquence = nombre de fois observé ÷ nombre de lancers. Sur un grand nombre de lancers, la fréquence se rapproche
      de la probabilité, sans lui être forcément égale.
    etape: Calcule d'abord 612 ÷ 1 000. Puis demande-toi ce qu'on peut dire de sûr, et ce qui n'est qu'une estimation.
  pieges:
  - si:
      contient:
      - c
    relance: Sur seulement 10 lancers, le hasard peut donner des résultats très variés. Peut-on être sûr d'un résultat ?
  - si:
      contient:
      - d
    relance: Si on refaisait 1 000 lancers, obtiendrait-on exactement le même nombre de « pointe en l'air » ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation vraie, mais pas toutes. Relis les autres.
  solution: 'a est vraie : 612 ÷ 1 000 = 0,612. b est vraie : sur un grand nombre de lancers, la fréquence se stabilise près
    de la probabilité. c est fausse : sur 10 lancers, rien n''est sûr. d est fausse : 0,612 est une fréquence observée ; une
    autre série de lancers donnerait une fréquence un peu différente.'
- id: choisir-une-urne
  type: ouverte
  difficulte: 3
  enonce: Pour gagner, il faut tirer une boule rouge. L'urne A contient 3 boules rouges et 7 noires. L'urne B contient 5 boules
    rouges et 12 noires. Alix choisit l'urne B, « parce qu'il y a plus de boules rouges ». A-t-elle fait le meilleur choix
    ? Justifie.
  criteres:
  - 'L''élève calcule les deux probabilités de tirer une boule rouge : 3/10 pour l''urne A et 5/17 pour l''urne B.'
  - L'élève compare correctement (0,3 contre environ 0,29, ou 51/170 contre 50/170) et conclut que l'urne A est un peu plus
    favorable.
  - L'élève explique qu'il faut comparer des probabilités et non des nombres de boules rouges, car les urnes n'ont pas le
    même nombre de boules.
  indices:
    relance: Les deux urnes contiennent-elles le même nombre de boules en tout ?
    methode: Calcule la probabilité de tirer une boule rouge dans chaque urne, puis compare les deux nombres.
    etape: L'urne A contient 10 boules, dont 3 rouges. Compte les boules de l'urne B et écris les deux fractions.
  solution: 'Urne A : 3 + 7 = 10 boules, P(rouge) = 3/10 = 0,3. Urne B : 5 + 12 = 17 boules, P(rouge) = 5/17 ≈ 0,294. Comme
    0,3 > 0,294, l''urne A est un peu plus favorable : Alix n''a pas fait le meilleur choix. Il y a plus de boules rouges
    dans B, mais aussi beaucoup plus de boules noires.'
