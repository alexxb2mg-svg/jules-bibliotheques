- id: frequence-piece-truquee
  type: nombre
  difficulte: 2
  enonce: Pour estimer la probabilité d'obtenir « face » avec une pièce déséquilibrée, Noé la lance 200 fois et obtient «
    face » 130 fois. Quelle est la fréquence de « face » dans cette série ? Donne un nombre décimal.
  reponse:
    valeur: 0.65
    forme: libre
  indices:
    relance: Que faut-il diviser par quoi pour obtenir une fréquence ?
    methode: Fréquence = nombre de fois où l'événement s'est produit ÷ nombre total d'essais.
    etape: Le nombre d'essais est 200. Pose la division de 130 par 200.
  pieges:
  - si:
      valeur: 130
    relance: 130 est le nombre de fois où « face » est sorti. La fréquence compare ce nombre au nombre d'essais.
  - si:
      valeur: 0.35
    relance: C'est la fréquence de « pile ». On demande celle de « face ».
  - si:
      valeur: 65
    relance: Ton résultat est écrit comme un pourcentage. On demande un nombre décimal.
  solution: Fréquence de « face » = 130 ÷ 200 = 0,65. Sur 200 lancers, c'est une estimation de la probabilité de « face ».
- id: evenements-de
  type: association
  difficulte: 2
  enonce: On lance un dé équilibré à six faces numérotées de 1 à 6. Relie chaque événement à sa probabilité.
  reponse:
    gauche:
    - id: a
      texte: obtenir un nombre pair
    - id: b
      texte: obtenir un 6
    - id: c
      texte: obtenir un nombre inférieur ou égal à 6
    - id: d
      texte: obtenir un nombre supérieur ou égal à 5
    droite:
    - id: x
      texte: 1/2
    - id: y
      texte: 1/6
    - id: z
      texte: '1'
    - id: w
      texte: 1/3
    - id: v
      texte: 2/3
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Pour chaque événement, combien de faces le réalisent parmi les six ?
    methode: Probabilité = nombre de faces favorables ÷ 6. Un événement toujours réalisé a une probabilité particulière.
    etape: 'Commence par « nombre pair » : liste les faces paires du dé, puis compte-les.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Recompte les faces favorables pour chacune, sans oublier de simplifier la fraction.
  - si:
      diagnostic: associations_fausses
    relance: Liste les faces qui réalisent chaque événement, compte-les, puis écris la fraction sur 6. Une probabilité de
      la colonne de droite ne sert à rien.
  solution: 'Nombre pair : 2, 4, 6, soit 3 faces sur 6 = 1/2. Obtenir un 6 : 1/6. Inférieur ou égal à 6 : les 6 faces, soit
    6/6 = 1 (événement certain). Supérieur ou égal à 5 : 5 et 6, soit 2/6 = 1/3. La probabilité 2/3 ne correspond à aucun
    événement.'
