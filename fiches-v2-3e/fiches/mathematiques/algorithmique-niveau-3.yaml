# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: algorithmique-niveau-3
version: 3
etat: verifiee
declencheurs:
- créer un bloc
- définir un nouveau bloc
- répéter jusqu'à
- une boucle dans une autre boucle
- nombre aléatoire entre
- deux scripts en même temps
- figure avec un bloc
- compter les passages
prerequis:
- algorithmique-niveau-2
essentiel: 'Décomposer. Un problème compliqué se découpe en sous-problèmes plus simples. Chaque sous-problème peut devenir
  un bloc personnalisé (« Créer un bloc » dans Scratch) : on le définit une fois, puis on l''utilise autant de fois qu''on
  veut. Un bloc peut avoir un paramètre, par exemple « carré (côté) », pour tracer des carrés de tailles différentes.


  Motif et boucle. Pour une figure répétitive, on programme le motif, puis on le répète avec une boucle en déplaçant le lutin
  entre deux motifs (stylo relevé pour ne pas tracer de trait).


  Boucles imbriquées. Si une boucle « répéter 3 fois » contient une boucle « répéter 4 fois », le contenu de la boucle intérieure
  est exécuté 3 × 4 = 12 fois.


  Répéter jusqu''à. La boucle « répéter jusqu''à condition » teste la condition avant chaque passage et s''arrête dès qu''elle
  est vraie. On ne connaît pas toujours à l''avance le nombre de passages. Si la condition est déjà vraie au départ, il n''y
  a aucun passage.


  Compteur. Une variable qui augmente de 1 à chaque passage sert à compter. Elle se met à zéro une seule fois, avant la boucle.


  Aléatoire. « nombre aléatoire entre 1 et 6 » simule un lancer de dé. Répéter beaucoup de fois et compter permet de simuler
  une expérience aléatoire et de calculer une fréquence.


  Parallèle. Plusieurs scripts lancés par le même événement s''exécutent en même temps. C''est ainsi qu''on programme un jeu
  : un script pour le déplacement, un autre pour le score ou le son.


  Au brevet : on te demande de lire un script qui contient un bloc personnalisé ou des boucles, de compter des passages, d''écrire
  une figure répétitive et de compléter un programme avec une variable.

  '
methode:
- 'Découper le problème : quel motif se répète ? Quel sous-problème peut devenir un bloc personnalisé ?'
- Définir le bloc personnalisé, avec un paramètre si la taille change.
- Écrire le script principal qui appelle le bloc dans une boucle et déplace le lutin entre deux motifs.
- Pour des boucles imbriquées, multiplier les nombres de passages pour savoir combien de fois le bloc intérieur s'exécute.
- Pour « répéter jusqu'à », faire un tableau de suivi et tester la condition avant chaque passage.
vocabulaire:
- terme: bloc personnalisé
  definition: Un bloc créé par le programmeur, qui regroupe plusieurs instructions sous un seul nom.
- terme: paramètre
  definition: Une valeur donnée au bloc personnalisé quand on l'utilise, par exemple la longueur du côté.
- terme: boucles imbriquées
  definition: Une boucle placée à l'intérieur d'une autre boucle.
- terme: répéter jusqu'à
  definition: Une boucle qui s'arrête dès que sa condition est vraie.
- terme: décomposer
  definition: Découper un problème en sous-problèmes plus simples.
- terme: motif
  definition: La petite figure qu'on répète pour construire une figure plus grande.
- terme: aléatoire
  definition: Se dit d'un nombre choisi au hasard par l'ordinateur.
- terme: scripts parallèles
  definition: Des scripts lancés par le même événement, exécutés en même temps.
erreurs_frequentes:
- Additionner les nombres de passages de deux boucles imbriquées au lieu de les multiplier.
- Avec « répéter jusqu'à », faire un passage de trop alors que la condition est déjà vraie.
- 'Initialiser un compteur à l''intérieur de la boucle : il est remis à zéro à chaque passage.'
- 'Oublier de déplacer le lutin entre deux motifs : ils se superposent.'
- Croire que deux scripts lancés par le même événement s'exécutent l'un après l'autre.
exemple:
  enonce: 'On a défini le bloc « triangle » : répéter 3 fois : avancer de 30, tourner à droite de 120 degrés. Le script principal
    est : répéter 4 fois : triangle, tourner à droite de 90 degrés. Combien de segments sont tracés ?'
  solution: 'Le bloc « triangle » trace 3 segments. Il est appelé 4 fois. En tout : 4 × 3 = 12 segments, qui forment une rosace
    de 4 triangles.'
exercices:
- id: boucles-imbriquees
  type: nombre
  difficulte: 1
  enonce: 'Script : « répéter 3 fois : répéter 4 fois : avancer de 10 ». Combien de fois le bloc « avancer de 10 » est-il
    exécuté ?'
  reponse:
    valeur: 12
    forme: libre
  indices:
    relance: À chaque passage dans la grande boucle, combien de fois la petite boucle fait-elle avancer le lutin ?
    methode: 'La boucle intérieure est entièrement exécutée à chaque passage de la boucle extérieure : il faut multiplier,
      pas additionner.'
    etape: 'Premier passage de la grande boucle : 4 fois « avancer ». Il y a 3 passages de la grande boucle.'
  pieges:
  - si:
      valeur: 7
    relance: 'Tu as additionné 3 et 4. Mais à chaque passage de la grande boucle, la petite boucle recommence entièrement
      : que faut-il faire ?'
  solution: 'La boucle intérieure fait avancer 4 fois, et elle est exécutée 3 fois : 3 × 4 = 12 fois.'
- id: bloc-carre-parametre
  type: nombre
  difficulte: 2
  enonce: 'On a défini le bloc personnalisé « carré (côté) » : répéter 4 fois : avancer de côté, tourner à droite de 90 degrés.
    Script principal, stylo posé : « mettre c à 10 ; répéter 3 fois : carré (c), ajouter 10 à c ». Quelle longueur totale,
    en pas, le lutin trace-t-il ?'
  reponse:
    valeur: 240
    forme: libre
  indices:
    relance: Combien de carrés sont tracés ? Quel est le côté de chacun ?
    methode: 'Fais un tableau de suivi de c : note le côté de chaque carré, puis calcule le périmètre de chaque carré (4 côtés).'
    etape: Le premier carré a un côté de 10 pas, donc un périmètre de 40 pas. Quel est le côté du deuxième carré ? Du troisième
      ?
  pieges:
  - si:
      valeur: 60
    relance: 'Tu as additionné les côtés. Mais chaque carré a 4 côtés : combien de pas le lutin trace-t-il pour un carré ?'
  - si:
      valeur: 400
    relance: Tu as tracé un carré de trop. La boucle principale s'exécute combien de fois ?
  - si:
      valeur: 120
    relance: 'La variable c ne reste pas à 10 : que fait le bloc « ajouter 10 à c » après chaque carré ?'
  solution: 'Les carrés ont pour côtés 10, 20 et 30 pas, donc pour périmètres 40, 80 et 120 pas. Longueur totale : 40 + 80
    + 120 = 240 pas.'
- id: repeter-jusqu-a
  type: nombre
  difficulte: 2
  enonce: 'Script : « mettre n à 1 ; répéter jusqu''à n > 100 : mettre n à n × 3 ». Que vaut n à la fin ?'
  reponse:
    valeur: 243
    forme: libre
  indices:
    relance: Avant chaque passage, la boucle teste si n est plus grand que 100. Quelles valeurs prend n ?
    methode: 'Fais un tableau de suivi : à chaque ligne, teste la condition, puis multiplie n par 3 si la condition est fausse.'
    etape: n vaut 1, puis 3, puis 9... Continue et arrête-toi dès que n dépasse 100.
  pieges:
  - si:
      valeur: 81
    relance: Quand n vaut 81, la condition « n > 100 » est-elle vraie ? La boucle s'arrête-t-elle ?
  - si:
      valeur: 729
    relance: 'Tu as fait un passage de trop. La boucle teste la condition avant chaque passage : que se passe-t-il dès que
      n dépasse 100 ?'
  - si:
      valeur: 100
    relance: 'n est toujours multiplié par 3 en partant de 1 : peut-il valoir exactement 100 ?'
  solution: 'n prend les valeurs 1, 3, 9, 27, 81, puis 243. Comme 243 > 100, la boucle s''arrête : n vaut 243.'
- id: simulation-de
  type: ordre
  difficulte: 2
  enonce: On veut simuler 100 lancers d'un dé et afficher la fréquence des 6. Les deux blocs qui suivent « répéter 100 fois
    » sont dans la boucle ; le dernier bloc est après la boucle. Remets les blocs dans l'ordre.
  reponse:
    elements:
    - id: a
      texte: quand le drapeau vert est cliqué
    - id: b
      texte: mettre six à 0
    - id: c
      texte: répéter 100 fois
    - id: d
      texte: mettre dé à nombre aléatoire entre 1 et 6
    - id: e
      texte: si dé = 6 alors ajouter 1 à six
    - id: f
      texte: dire six / 100
  indices:
    relance: Quels blocs doivent être exécutés une seule fois, et lesquels à chaque lancer ?
    methode: 'Initialise le compteur avant la boucle. Dans la boucle : d''abord lancer le dé, ensuite tester le résultat.
      Après la boucle : afficher.'
    etape: Le script commence par « quand le drapeau vert est cliqué », puis « mettre six à 0 ». Ce compteur doit-il être
      remis à zéro à chaque lancer ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux blocs voisins sont inversés. Peut-on tester si le dé vaut 6 avant de l''avoir lancé ? Et si «
      mettre six à 0 » est dans la boucle, que devient le compteur ?'
  solution: 'quand le drapeau vert est cliqué ; mettre six à 0 ; répéter 100 fois : mettre dé à nombre aléatoire entre 1 et
    6, si dé = 6 alors ajouter 1 à six ; puis, après la boucle, dire six / 100. Le compteur est initialisé une seule fois,
    avant la boucle.'
- id: scripts-en-parallele
  type: choix
  difficulte: 2
  enonce: 'Le chat a deux scripts. Script 1 : « quand le drapeau vert est cliqué ; répéter 10 fois : avancer de 10 ». Script
    2 : « quand le drapeau vert est cliqué ; jouer le son Miaou ». Que se passe-t-il quand on clique sur le drapeau vert ?'
  reponse:
    options:
    - id: a
      texte: Le chat avance et miaule en même temps.
    - id: b
      texte: Le chat avance, puis miaule une fois arrivé.
    - id: c
      texte: Le chat miaule, puis avance.
    - id: d
      texte: Seul le script 1 s'exécute, car il est écrit en premier.
    bonnes:
    - a
  indices:
    relance: Quel événement lance le script 1 ? Et le script 2 ?
    methode: 'Tous les scripts lancés par le même événement démarrent ensemble : ils s''exécutent en parallèle.'
    etape: Au clic sur le drapeau vert, les deux scripts démarrent. L'un attend-il la fin de l'autre ?
  pieges:
  - si:
      contient:
      - b
    relance: Le script 2 attend-il que le script 1 soit fini ? Regarde par quel bloc chacun commence.
  - si:
      contient:
      - c
    relance: Le script 1 attend-il que le script 2 soit fini ? Regarde par quel bloc chacun commence.
  - si:
      contient:
      - d
    relance: 'L''ordre d''écriture des scripts ne compte pas. Chaque script a son propre bloc d''événement : que se passe-t-il
      pour le script 2 ?'
  solution: 'Les deux scripts commencent par « quand le drapeau vert est cliqué » : ils démarrent en même temps et s''exécutent
    en parallèle. Le chat avance et miaule en même temps.'
- id: rangee-de-triangles
  type: ouverte
  difficulte: 3
  enonce: 'On veut dessiner une rangée de 5 triangles équilatéraux de côté 40 pas, posés côte à côte et séparés de 20 pas.
    Décompose le problème : écris le bloc personnalisé « triangle », puis le script principal qui l''utilise.'
  criteres:
  - 'Le bloc « triangle » est correct : répéter 3 fois, avancer de 40, tourner de 120 degrés (le lutin revient à son point
    de départ, dans sa direction de départ).'
  - 'Le script principal répète 5 fois : triangle, puis un déplacement de 60 pas (40 + 20) vers le triangle suivant.'
  - Le déplacement entre deux triangles se fait stylo relevé, puis le stylo est reposé avant le triangle suivant.
  indices:
    relance: Quel motif se répète ? Combien de fois ?
    methode: Le bloc « triangle » trace un seul triangle et ramène le lutin au départ. Le script principal appelle ce bloc
      dans une boucle et déplace le lutin entre deux triangles.
    etape: 'Bloc « triangle » : répéter 3 fois : avancer de 40, tourner à gauche de 120 degrés. Écris maintenant le script
      principal.'
  solution: 'Définir « triangle » : répéter 3 fois : avancer de 40, tourner à gauche de 120 degrés. Script principal : quand
    le drapeau vert est cliqué ; aller au départ ; s''orienter vers la droite ; répéter 5 fois : stylo en position d''écriture,
    triangle, relever le stylo, avancer de 60. Le lutin avance de 40 (le côté du triangle) plus 20 (l''écart) entre deux triangles.'
- id: nblm-si-une-boucle-repeter-3-fois-contient-a-1
  type: choix
  difficulte: 2
  enonce: Si une boucle « répéter 3 fois » contient à l'intérieur une boucle « répéter 4 fois », combien de fois au total
    le contenu de la boucle intérieure est-il exécuté ?
  reponse:
    options:
    - id: o1
      texte: 12 fois
    - id: o2
      texte: 7 fois
    - id: o3
      texte: 4 fois
    - id: o4
      texte: 3 fois
    bonnes:
    - o1
  indices:
    relance: Réfléchis au nombre de fois que la boucle intérieure de 4 tours est répétée par la boucle extérieure.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : additionner les nombres de passages (3 + 4 = 7) au lieu de les multiplier.'
  - si:
      contient:
      - o3
    relance: 'Erreur : ne prendre en compte que la boucle intérieure sans tenir compte de la répétition par la boucle extérieure.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ne prendre en compte que la boucle extérieure.'
  solution: '12 fois. C''est exact : pour des boucles imbriquées, on multiplie les nombres de passages (3 × 4 = 12).'
- id: nblm-comment-fonctionne-la-boucle-repeter-jus-2
  type: choix
  difficulte: 2
  enonce: Comment fonctionne la boucle « répéter jusqu'à [condition] » dans un programme Scratch ?
  reponse:
    options:
    - id: o1
      texte: Elle teste la condition avant chaque passage et s'arrête dès que la condition est vraie.
    - id: o2
      texte: Elle s'exécute un nombre fixe de fois défini à l'avance.
    - id: o3
      texte: Elle continue de répéter les instructions tant que la condition reste vraie.
    - id: o4
      texte: Elle s'arrête systématiquement après un seul passage.
    bonnes:
    - o1
  indices:
    relance: Pense à l'état de la condition (vrai ou faux) qui déclenche l'arrêt de la boucle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect : c''est la boucle « répéter n fois » qui a un nombre fixe de passages. Avec « répéter jusqu''à »,
      le nombre de passages dépend du moment où la condition devient vraie.'
  - si:
      contient:
      - o3
    relance: 'Attention : elle s''arrête dès que la condition est vraie (elle s''exécute tant que la condition est fausse).'
  - si:
      contient:
      - o4
    relance: 'Incorrect : si la condition est fausse au départ, elle continue de s''exécuter jusqu''à ce que la condition
      devienne vraie.'
  solution: 'Elle teste la condition avant chaque passage et s''arrête dès que la condition est vraie. C''est exact : la condition
    est vérifiée avant chaque passage et la boucle s''arrête dès qu''elle devient vraie.'
- id: nblm-pourquoi-utilise-t-on-la-fonctionnalite-3
  type: choix
  difficulte: 2
  enonce: Pourquoi utilise-t-on la fonctionnalité « Créer un bloc » (définir un nouveau bloc) dans Scratch ?
  reponse:
    options:
    - id: o1
      texte: Pour décomposer un problème complexe en sous-problèmes et regrouper plusieurs instructions sous un seul nom.
    - id: o2
      texte: Pour enregistrer le score ou une valeur numérique au cours du jeu.
    - id: o3
      texte: Pour exécuter obligatoirement deux scripts l'un après l'autre.
    - id: o4
      texte: Pour remplacer automatiquement toutes les boucles du programme.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la méthode de décomposition d'un problème complexe en sous-problèmes plus simples.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : enregistrer une valeur numérique ou un score se fait avec une variable, pas un bloc personnalisé.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : créer un bloc regroupe des instructions sous un nom, mais ne contrôle pas la séquence globale entre
      deux scripts.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : un bloc personnalisé peut lui-même contenir des boucles.'
  solution: 'Pour décomposer un problème complexe en sous-problèmes et regrouper plusieurs instructions sous un seul nom.
    C''est exact : créer un bloc personnalisé permet de découper un problème et de réutiliser une séquence d''instructions.'
- id: nblm-que-se-passe-t-il-lorsque-deux-scripts-d-4
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il lorsque deux scripts distincts démarrent par le même événement « quand le drapeau vert est cliqué
    » ?
  reponse:
    options:
    - id: o1
      texte: Les deux scripts s'exécutent en même temps (en parallèle).
    - id: o2
      texte: Le second script attend obligatoirement que le premier soit terminé.
    - id: o3
      texte: Le logiciel choisit un seul script au hasard et annule l'autre.
    - id: o4
      texte: Le programme se bloque et affiche un message d'erreur.
    bonnes:
    - o1
  indices:
    relance: Pense à la création de jeux interactifs où plusieurs lutins s'animent en même temps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que deux scripts lancés par le même événement s''exécutent l''un après l''autre.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : Scratch lance tous les scripts associés à cet événement.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : Scratch gère très bien le fonctionnement simultané de plusieurs scripts.'
  solution: 'Les deux scripts s''exécutent en même temps (en parallèle). C''est exact : plusieurs scripts déclenchés par le
    même événement s''exécutent simultanément en parallèle.'
- id: nblm-quel-est-le-role-du-bloc-nombre-aleatoir-5
  type: choix
  difficulte: 2
  enonce: Quel est le rôle du bloc « nombre aléatoire entre 1 et 6 » dans Scratch ?
  reponse:
    options:
    - id: o1
      texte: Il choisit au hasard un nombre entier compris entre 1 et 6.
    - id: o2
      texte: Il calcule la moyenne des nombres 1 et 6.
    - id: o3
      texte: Il répète une séquence de blocs 6 fois.
    - id: o4
      texte: Il additionne 1 et 6 pour obtenir 7.
    bonnes:
    - o1
  indices:
    relance: Pense à la simulation d'expériences aléatoires comme le tirage d'un dé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect : il ne calcule pas de moyenne mathématique, mais effectue un tirage au sort.'
  - si:
      contient:
      - o3
    relance: 'Confusion : la répétition est assurée par une boucle (« répéter n fois »), pas par un bloc aléatoire.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : il ne s''agit pas d''un bloc d''addition.'
  solution: 'Il choisit au hasard un nombre entier compris entre 1 et 6. C''est exact : ce bloc génère aléatoirement un nombre
    entier entre les bornes spécifiées (par exemple pour simuler un lancer de dé).'
- id: nblm-quelles-sont-les-deux-affirmations-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations correctes concernant les notions d'algorithmique de niveau 3 ? [1-3] (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un bloc personnalisé peut utiliser un paramètre pour faire varier une valeur (comme la longueur du côté).
    - id: o2
      texte: Pour des boucles imbriquées, on multiplie les nombres de passages pour connaître le total d'exécutions.
    - id: o3
      texte: Pour des boucles imbriquées, il faut additionner le nombre de passages des deux boucles.
    - id: o4
      texte: La boucle « répéter jusqu'à » s'exécute toujours au moins 10 fois sans tester la condition.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie la règle de calcul pour les boucles imbriquées et la propriété d'un paramètre dans un bloc personnalisé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : additionner les passages de deux boucles imbriquées au lieu de les multiplier.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : la condition est testée avant chaque passage et la boucle s''arrête dès qu''elle devient vraie.'
  solution: 'Un bloc personnalisé peut utiliser un paramètre pour faire varier une valeur (comme la longueur du côté) ; Pour
    des boucles imbriquées, on multiplie les nombres de passages pour connaître le total d''exécutions. C''est exact : ajouter
    un paramètre à un bloc personnalisé permet d''adapter son fonctionnement (par exemple la taille d''un motif).'
- id: nblm-comment-appelle-t-on-le-bloc-cree-par-le-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le bloc créé par le programmeur qui regroupe plusieurs instructions sous un seul nom ?
  reponse:
    acceptees:
    - bloc personnalisé
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'un bloc créé sur mesure par le programmeur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: bloc personnalisé. Un bloc personnalisé regroupe un ensemble d'instructions définies par le programmeur sous un
    seul nom.
- id: nblm-lorsque-l-on-place-une-boucle-a-l-interi-8
  type: texte_court
  difficulte: 1
  enonce: Lorsque l'on place une boucle à l'intérieur d'une autre boucle, on parle d'une boucle __________.
  reponse:
    acceptees:
    - imbriquée
    fautes_tolerees: 1
  indices:
    relance: Donne l'adjectif qui qualifie une boucle insérée dans une autre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: imbriquée. Une boucle située à l'intérieur d'une autre boucle est appelée une boucle imbriquée.
- id: polygone-parametre
  type: nombre
  difficulte: 2
  enonce: 'On a défini le bloc « polygone (n, côté) » : répéter n fois : avancer de côté, tourner à droite de 360 ÷ n degrés.
    Le stylo est posé. On exécute « polygone (5, 20) » puis « polygone (3, 40) ». Quelle longueur totale, en pas, le lutin
    trace-t-il ?'
  reponse:
    valeur: 220
    forme: libre
  indices:
    relance: Combien de segments trace chaque appel du bloc, et de quelle longueur ?
    methode: Pour chaque appel, le nombre de côtés est n et la longueur d'un côté est le second paramètre. Calcule la longueur
      de chaque figure puis additionne.
    etape: Le premier appel trace 5 côtés de 20 pas. Calcule 5 × 20, puis fais de même pour le second appel.
  pieges:
  - si:
      valeur: 60
    relance: 'Tu as additionné 20 + 40. Mais chaque appel trace plusieurs côtés : combien ?'
  - si:
      valeur: 100
    relance: Tu as oublié le second appel du bloc. Deux figures sont tracées.
  - si:
      valeur: 120
    relance: Tu as oublié le premier appel du bloc. Deux figures sont tracées.
  solution: 'Premier appel : 5 côtés de 20 pas, soit 5 × 20 = 100 pas. Second appel : 3 côtés de 40 pas, soit 3 × 40 = 120
    pas. Total : 100 + 120 = 220 pas.'
- id: compteur-repeter-jusqu-a
  type: nombre
  difficulte: 3
  enonce: 'Script : « mettre s à 0 ; mettre k à 1 ; répéter jusqu''à s > 20 : ajouter k à s, ajouter 1 à k ». Combien de fois
    le contenu de la boucle est-il exécuté ?'
  reponse:
    valeur: 6
    forme: entier
  indices:
    relance: Quelle condition arrête la boucle ? Est-elle testée avant ou après chaque passage ?
    methode: Fais un tableau de suivi avec s et k. Avant chaque passage, teste s > 20 ; si c'est faux, fais le passage.
    etape: 'Passage 1 : s = 0 + 1 = 1 et k = 2. Passage 2 : s = 1 + 2. Continue jusqu''à ce que s dépasse 20.'
  pieges:
  - si:
      valeur: 5
    relance: Après le passage numéro 5, s vaut-il déjà plus que 20 ? Recalcule-le.
  - si:
      valeur: 7
    relance: 'Tu as fait un passage de trop : dès que s dépasse 20, la boucle s''arrête.'
  - si:
      valeur: 21
    relance: 21 est la valeur finale de s. La question demande le nombre de passages.
  solution: 'Après les passages 1 à 6, s vaut 1, 3, 6, 10, 15, 21. Après le passage 5, s = 15, la condition s > 20 est fausse
    : on continue. Après le passage 6, s = 21 > 20 : la boucle s''arrête. Il y a 6 passages.'
