  difficulte: 1
  enonce: Un commerçant vend du fromage à 15 € le kilo. La fonction \(f\) qui traduit le prix à payer (en euros) en fonction
    de la masse \(x\) (en kg) s'écrit \(f(x) =\) _____.
  reponse:
    acceptees:
    - 15x
    fautes_tolerees: 1
  indices:
    relance: Écris l'expression du produit du coefficient 15 par la variable x.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: '15x. C''est exact : le prix f(x) est obtenu en multipliant le prix unitaire (15 €) par la masse x.'
- id: nblm-toute-fonction-lineaire-f-x-ax-a-pour-re-8
  type: texte_court
  difficulte: 1
  enonce: Toute fonction linéaire \(f(x) = ax\) a pour représentation graphique une droite qui passe par l'_____ du repère.
  reponse:
    acceptees:
    - origine
    fautes_tolerees: 1
  indices:
    relance: Pense au nom du point d'intersection des deux axes du repère.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
