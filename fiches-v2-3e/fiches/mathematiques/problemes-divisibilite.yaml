# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: problemes-divisibilite
version: 1
etat: verifiee
declencheurs:
- engrenage
- roues dentées
- repartent en même temps
- se retrouvent ensemble
- clignotent ensemble
- bouquets identiques
prerequis:
- multiples-diviseurs-division-euclidienne
- nombres-premiers-decomposition
essentiel: 'Beaucoup de problèmes se résolvent avec les multiples et les diviseurs.


  Deux phénomènes qui se répètent (bus, phares, roues d''un engrenage) se reproduisent ensemble au bout d''un temps qui est
  un multiple commun de leurs deux périodes. La première fois, c''est le plus petit multiple commun non nul.


  Pour partager des objets en paquets identiques sans reste, le nombre de paquets doit être un diviseur commun des quantités.
  Le plus grand nombre de paquets possible est le plus grand diviseur commun.


  On peut trouver ces nombres en écrivant les listes de multiples ou de diviseurs, ou en décomposant les nombres en produits
  de facteurs premiers.

  '
methode:
- Repérer si on cherche un moment commun (multiples) ou un partage sans reste (diviseurs).
- 'Pour un moment commun : écrire les multiples du plus grand nombre, et garder le premier qui est aussi multiple de l''autre.'
- 'Pour un partage : chercher le plus grand nombre qui divise toutes les quantités.'
- 'Revenir à la question : des minutes, des tours, des bouquets, une date.'
- Vérifier le résultat avec des divisions qui tombent juste.
vocabulaire:
- terme: multiple commun
  definition: Nombre qui est à la fois un multiple de chacun des nombres donnés.
- terme: diviseur commun
  definition: Nombre qui divise chacun des nombres donnés, sans reste.
- terme: période
  definition: Durée au bout de laquelle un phénomène se répète.
erreurs_frequentes:
- 'Multiplier les deux nombres : on obtient bien un multiple commun, mais pas toujours le premier.'
- Confondre la recherche d'un multiple commun (moment où tout recommence) et d'un diviseur commun (partage).
- Répondre en dents au lieu de répondre en nombre de tours, ou en minutes au lieu de donner l'heure demandée.
- Additionner les périodes au lieu de chercher un multiple commun.
exemple:
  enonce: Une guirlande A clignote toutes les 4 secondes, une guirlande B toutes les 6 secondes. Elles s'allument ensemble.
    Au bout de combien de secondes s'allumeront-elles de nouveau ensemble ?
  solution: 'Multiples de 6 : 6, 12, 18... 6 n''est pas multiple de 4, mais 12 = 4 × 3 l''est. Elles se rallument ensemble
    au bout de 12 secondes.'
exercices:
- id: mot-moment-commun
  type: texte_court
  difficulte: 1
  enonce: Deux phénomènes se répètent régulièrement. Pour savoir quand ils se reproduiront ensemble, on cherche le plus petit
    ... commun à leurs deux périodes. Complète avec un seul mot.
  reponse:
    acceptees:
    - multiple
    fautes_tolerees: 1
  indices:
    relance: Si un bus passe toutes les 10 minutes, il passe à 10, 20, 30 minutes... Comment appelle-t-on ces nombres par
      rapport à 10 ?
    methode: Le moment cherché doit se trouver dans la table de chacune des deux périodes.
    etape: '20 est dans la table de 10 : on dit que 20 est un ... de 10.'
  pieges:
  - si:
      valeur: diviseur
    relance: Un diviseur est plus petit que le nombre. Or le moment commun arrive après chacune des deux périodes. Est-il
      plus petit ou plus grand qu'elles ?
  solution: 'On cherche le plus petit multiple commun : le moment commun doit être dans la table de chacune des périodes.'
- id: bus-12-et-18
  type: nombre
  difficulte: 1
  enonce: Au terminus, un bus de la ligne A part toutes les 12 minutes et un bus de la ligne B toutes les 18 minutes. Deux
    bus partent ensemble à 7 h 00. Au bout de combien de minutes deux bus repartiront-ils ensemble pour la première fois ?
    Donne un nombre de minutes.
  reponse:
    valeur: 36
    forme: entier
  indices:
    relance: Le moment cherché doit être à la fois dans la table de 12 et dans la table de 18. Lesquels connais-tu ?
    methode: Écris les multiples de 18 dans l'ordre et, pour chacun, regarde s'il est aussi un multiple de 12.
    etape: 18 n'est pas un multiple de 12. Essaie le multiple suivant de 18.
  pieges:
  - si:
      valeur: 216
    relance: 216 = 12 × 18 est bien un moment commun, mais est-ce le premier ? Cherche un multiple commun plus petit.
  - si:
      valeur: 6
    relance: Au bout de 6 minutes, aucun bus n'est encore reparti. Il faut un nombre qui soit dans la table de 12 et dans
      celle de 18.
  - si:
      valeur: 30
    relance: Tu as additionné les deux durées. 30 est-il dans la table de 12 ?
  solution: 'Multiples de 12 : 12, 24, 36... Multiples de 18 : 18, 36... Le premier multiple commun est 36 : deux bus repartent
    ensemble au bout de 36 minutes, à 7 h 36.'
- id: engrenage-24-36
  type: nombre
  difficulte: 2
  enonce: Un engrenage est formé d'une roue A de 24 dents et d'une roue B de 36 dents. On marque d'un point rouge les deux
    dents en contact. Combien de tours complets la roue A doit-elle faire, au minimum, pour que les deux points rouges se
    retrouvent de nouveau en contact ?
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Quand les points se retrouvent, chaque roue a fait un nombre entier de tours. Combien de dents sont alors passées,
      pour chaque roue ?
    methode: Le nombre de dents passées doit être un multiple de 24 et de 36. Cherche le plus petit, puis divise-le par le
      nombre de dents de la roue A.
    etape: 36 n'est pas un multiple de 24. Essaie le multiple suivant de 36, puis compte combien de tours de A cela représente.
  pieges:
  - si:
      valeur: 72
    relance: 72, c'est un nombre de dents. La question demande un nombre de tours de la roue A. Combien de fois 24 dents font-ils
      72 dents ?
  - si:
      valeur: 2
    relance: '2, c''est le nombre de tours de la roue B. Relis la question : quelle roue compte-t-on ?'
  - si:
      valeur: 36
    relance: Tu as pris le nombre de dents de la roue B. Il faut un nombre de dents multiple de 24 et de 36, puis le convertir
      en tours de A.
  solution: 'Multiples de 36 : 36, 72. 72 est multiple de 24 (72 = 24 × 3). Il passe 72 dents, soit 72 ÷ 24 = 3 tours de la
    roue A (et 2 tours de la roue B).'
- id: phares-8-et-12
  type: choix
  difficulte: 2
  enonce: Deux phares s'allument ensemble à 21 h 00 min 00 s. Le premier s'allume toutes les 8 secondes, le second toutes
    les 12 secondes. À quels moments (en secondes après 21 h) s'allumeront-ils de nouveau ensemble ? Choisis toutes les bonnes
    réponses.
  reponse:
    options:
    - id: a
      texte: au bout de 24 s
    - id: b
      texte: au bout de 36 s
    - id: c
      texte: au bout de 48 s
    - id: d
      texte: au bout de 96 s
    - id: e
      texte: au bout de 20 s
    bonnes:
    - a
    - c
    - d
  indices:
    relance: Pour que les deux phares s'allument au même moment, dans quelles tables ce moment doit-il se trouver ?
    methode: Pour chaque proposition, vérifie si c'est un multiple de 8 et aussi un multiple de 12.
    etape: 'Commence par 36 : 36 = 12 × 3, mais 36 ÷ 8 tombe-t-il juste ? Fais de même avec les autres.'
  pieges:
  - si:
      contient:
      - e
    relance: '20 = 8 + 12 : additionner les périodes ne donne pas un moment commun. 20 est-il dans la table de 8 ?'
  - si:
      contient:
      - b
    relance: 36 est bien dans la table de 12. Est-il dans la table de 8 ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé, mais pas tous. Une fois le premier moment commun trouvé, ses multiples sont aussi des moments
      communs.
  solution: 'Les moments communs sont les multiples communs de 8 et 12 : 24, 48, 72, 96... Donc 24 s, 48 s et 96 s. 36 n''est
    pas multiple de 8 et 20 n''est multiple ni de 8 ni de 12.'
- id: bouquets-roses-tulipes
  type: nombre
  difficulte: 2
  enonce: Une fleuriste a 84 roses et 60 tulipes. Elle veut faire des bouquets tous identiques (même nombre de roses et même
    nombre de tulipes dans chaque bouquet), en utilisant toutes ses fleurs. Combien de bouquets peut-elle faire au maximum
    ?
  reponse:
    valeur: 12
    forme: entier
  indices:
    relance: Le nombre de bouquets doit permettre de partager les roses sans reste, et les tulipes aussi. Qu'est-ce que cela
      dit de ce nombre ?
    methode: Cherche les nombres qui divisent à la fois 84 et 60, et garde le plus grand. Tu peux décomposer 84 et 60 en facteurs
      premiers.
    etape: 84 = 2² × 3 × 7 et 60 = 2² × 3 × 5. Quels facteurs ont-ils en commun ?
  pieges:
  - si:
      valeur: 6
    relance: Avec 6 bouquets, le partage marche bien. Mais peut-on faire plus de bouquets identiques ?
  - si:
      valeur: 4
    relance: 4 divise bien 84 et 60, mais on cherche le plus grand nombre de bouquets possible.
  - si:
      valeur: 420
    relance: 420 est un multiple commun, pas un diviseur commun. Avec seulement 84 roses, peut-on faire autant de bouquets
      ?
  solution: 84 = 2² × 3 × 7 et 60 = 2² × 3 × 5. Le plus grand diviseur commun est 2² × 3 = 12. Elle peut faire 12 bouquets,
    chacun avec 7 roses et 5 tulipes.
- id: piscine-trois-amis
  type: ouverte
  difficulte: 3
  enonce: Le 1er mars, Léa, Sami et Inès se retrouvent à la piscine. Léa y va tous les 6 jours, Sami tous les 10 jours et
    Inès tous les 15 jours. Quel est le prochain jour où ils seront tous les trois à la piscine ? Explique ta démarche.
  criteres:
  - 'L''élève cherche un nombre de jours qui est multiple de 6, de 10 et de 15, et trouve le plus petit : 30 jours.'
  - L'élève vérifie son résultat (30 = 6 × 5 = 10 × 3 = 15 × 2).
  - 'L''élève traduit en date : 30 jours après le 1er mars, c''est le 31 mars.'
  indices:
    relance: Le jour cherché doit être dans la table de 6, de 10 et de 15. Par quelle table est-il plus rapide de commencer
      ?
    methode: Écris les multiples de 15 et teste pour chacun s'il est divisible par 6 et par 10. Puis ajoute ce nombre de jours
      au 1er mars.
    etape: 15 n'est pas pair, donc pas divisible par 6 ni par 10. Teste le multiple suivant de 15.
  solution: 'Multiples de 15 : 15, 30. 30 = 6 × 5 = 10 × 3 : c''est le plus petit multiple commun de 6, 10 et 15. Mars a 31
    jours : 30 jours après le 1er mars, c''est le 31 mars.'
- id: nblm-dans-un-engrenage-deux-roues-dentees-de-1
  type: choix
  difficulte: 2
  enonce: Dans un engrenage, deux roues dentées de 12 et 15 dents tournent ensemble. Deux repères sur les roues sont en contact
    au départ. Au bout de combien de dents engrenées les deux repères se retrouvent ensemble pour la première fois ?
  reponse:
    options:
    - id: o1
      texte: 60 dents
    - id: o2
      texte: 180 dents
    - id: o3
      texte: 27 dents
    - id: o4
      texte: 3 dents
    bonnes:
    - o1
  indices:
    relance: Pense à déterminer le plus petit multiple commun non nul aux nombres de dents des deux roues.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : multiplier 12 par 15 (180), ce qui donne un multiple commun mais pas le plus petit.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : additionner le nombre de dents (12 + 15 = 27) au lieu de chercher un multiple commun.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : chercher le plus grand diviseur commun (3) au lieu du plus petit multiple commun.'
  solution: '60 dents. C''est exact : 60 est le plus petit multiple commun non nul de 12 et 15.'
- id: nblm-deux-phares-d-un-signal-clignotent-ensem-2
  type: choix
  difficulte: 2
  enonce: Deux phares d'un signal clignotent ensemble au départ. Le premier clignote toutes les 4 secondes et le second toutes
    les 6 secondes. Au bout de combien de secondes vont-ils clignoter ensemble de nouveau pour la première fois ?
  reponse:
    options:
    - id: o1
      texte: 12 secondes
    - id: o2
      texte: 24 secondes
    - id: o3
      texte: 10 secondes
    - id: o4
      texte: 2 secondes
    bonnes:
    - o1
  indices:
    relance: Écris la liste des multiples de 6 et repère le premier qui figure aussi parmi les multiples de 4.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : multiplier 4 × 6 = 24. C''est un multiple commun, mais pas le plus petit.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : additionner les deux périodes (4 + 6 = 10 s) au lieu de chercher un multiple commun.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : chercher un diviseur commun (2) au lieu d''un multiple commun pour une répétition.'
  solution: '12 secondes. C''est exact : 12 est le plus petit multiple commun non nul (PPCM) de 4 et 6.'
- id: nblm-un-fleuriste-veut-preparer-des-bouquets-3
  type: choix
  difficulte: 2
  enonce: Un fleuriste veut préparer des bouquets identiques avec 30 roses et 45 tulipes, en utilisant toutes les fleurs.
    Quel est le nombre maximal de bouquets identiques qu'il peut réaliser ?
  reponse:
    options:
    - id: o1
      texte: 15 bouquets
    - id: o2
      texte: 5 bouquets
    - id: o3
      texte: 90 bouquets
    - id: o4
      texte: 75 bouquets
    bonnes:
    - o1
  indices:
    relance: Recherche le plus grand nombre qui divise à la fois 30 et 45.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : choisir un diviseur commun (5) sans vérifier s''il s''agit du plus grand.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : chercher le plus petit multiple commun (90) au lieu d''un diviseur commun pour un partage.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : additionner les deux quantités (30 + 45 = 75) au lieu d''effectuer une division commune.'
  solution: '15 bouquets. C''est exact : 15 est le plus grand diviseur commun (PGCD) de 30 et 45.'
- id: nblm-a-la-gare-deux-bus-a-et-b-partent-ensemb-4
  type: choix
  difficulte: 2
  enonce: À la gare, deux bus A et B partent ensemble à 8h00. Le bus A passe toutes les 15 minutes et le bus B toutes les
    20 minutes. À quelle heure les deux bus repartent en même temps de la gare pour la toute première fois ?
  reponse:
    options:
    - id: o1
      texte: 9h00
    - id: o2
      texte: 8h35
    - id: o3
      texte: 13h00
    - id: o4
      texte: 8h05
    bonnes:
    - o1
  indices:
    relance: Calcule le plus petit multiple commun de 15 et 20 pour trouver l'intervalle de temps en minutes entre deux départs
      simultanés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : additionner les deux durées (15 + 20 = 35 minutes) au lieu de calculer leur PPCM.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : multiplier 15 × 20 = 300 minutes (5 heures) et l''ajouter à 8h00, obtenant un horaire trop
      éloigné.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : utiliser un diviseur commun (5 min) au lieu du plus petit multiple commun.'
  solution: '9h00. C''est exact : le plus petit multiple commun de 15 min et 20 min est 60 min (1 heure). 8h00 + 1h00 = 9h00.'
- id: nblm-dans-un-engrenage-une-roue-a-de-18-dents-5
  type: choix
  difficulte: 2
  enonce: Dans un engrenage, une roue A de 18 dents tourne avec une roue B de 24 dents. Combien de tours complets effectue
    la roue A lorsque les deux roues se retrouvent ensemble dans leur position initiale pour la première fois ?
  reponse:
    options:
    - id: o1
      texte: 4 tours
    - id: o2
      texte: 3 tours
    - id: o3
      texte: 72 tours
    - id: o4
      texte: 432 tours
    bonnes:
    - o1
  indices:
    relance: Trouve d'abord le nombre minimal de dents qui doivent défiler (PPCM), puis divise-le par le nombre de dents de
      la roue A.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : indiquer le nombre de tours de la roue B (72 ÷ 24 = 3) au lieu de celui de la roue A.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre le nombre total de dents engrenées (72) avec le nombre de tours effectués par la
      roue A.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : multiplier 18 × 24 = 432 pour le nombre de dents au lieu d''utiliser le plus petit multiple
      commun.'
  solution: '4 tours. C''est exact : le PPCM de 18 et 24 est 72 dents. La roue A de 18 dents effectue donc 72 ÷ 18 = 4 tours.'
- id: nblm-parmi-les-situations-suivantes-lesquelle-6
  type: choix
  difficulte: 3
  enonce: Parmi les situations suivantes, lesquelles nécessitent la recherche d'un plus petit multiple commun (PPCM) ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Savoir au bout de combien de secondes deux phares qui clignotent ensemble vont clignoter de nouveau en même temps.
    - id: o2
      texte: Déterminer l'heure à laquelle deux bus repassent et repartent en même temps au même terminus.
    - id: o3
      texte: Répartir 24 billes rouges et 36 billes bleues dans des sachets identiques sans reste.
    - id: o4
      texte: Composer le plus grand nombre de bouquets identiques avec 12 roses et 18 marguerites.
    bonnes:
    - o1
    - o2
  indices:
    relance: Distingue les problèmes de phénomènes répétitifs dans le temps de ceux impliquant un partage d'objets en paquets.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : il s''agit d''un partage équitable sans reste, ce qui exige la recherche d''un diviseur commun
      (PGCD).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : constituer des bouquets identiques relève du partage équitable, ce qui requiert un diviseur
      commun (PGCD).'
  solution: 'Savoir au bout de combien de secondes deux phares qui clignotent ensemble vont clignoter de nouveau en même temps
    ; Déterminer l''heure à laquelle deux bus repassent et repartent en même temps au même terminus. C''est exact : deux phénomènes
    périodiques qui se répètent croisent leurs cycles au plus petit multiple commun de leurs durées.'
- id: nblm-pour-trouver-le-premier-moment-ou-deux-p-7
  type: texte_court
  difficulte: 1
  enonce: Pour trouver le premier moment où deux phénomènes périodiques se reproduisent ensemble, on calcule le plus petit
    ______ non nul de leurs périodes.
  reponse:
    acceptees:
    - multiple commun
    fautes_tolerees: 1
  indices:
    relance: Pense au terme désignant un nombre figurant à la fois dans les tables de multiplication des deux durées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'multiple commun. C''est exact : le plus petit multiple commun (PPCM) donne la première coïncidence temporelle
    de deux événements réguliers.'
- id: nblm-pour-partager-plusieurs-quantites-d-obje-8
  type: texte_court
  difficulte: 1
  enonce: Pour partager plusieurs quantités d'objets en un nombre maximal de bouquets identiques sans reste, on doit calculer
    leur plus grand ______.
  reponse:
    acceptees:
    - diviseur commun
    fautes_tolerees: 1
  indices:
    relance: Pense au terme qui indique par quel nombre entier on peut diviser simultanément toutes les quantités.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'diviseur commun. C''est exact : le plus grand diviseur commun (PGCD) permet de déterminer le nombre maximal de
    lots identiques.'
