      texte: 144,8 km/h
    - id: o3
      texte: 105 km/h
    - id: o4
      texte: 367,5 km/h
    bonnes:
    - o1
  indices:
    relance: Convertis d'abord les 45 minutes en fraction d'heure avant d'effectuer la division distance ÷ durée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
