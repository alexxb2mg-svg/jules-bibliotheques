  indices:
    relance: Quelle formule donne la durée quand on connaît la distance et la vitesse ?
    methode: durée = distance ÷ vitesse. Le résultat est en heures ; convertis-le ensuite en minutes.
    etape: 'Calcule 150 ÷ 90 sous forme de fraction : le résultat est en heures. Une heure vaut 60 minutes.'
  pieges:
  - si:
      valeur: 1.67
    relance: 'Ton résultat est en heures (arrondi). On demande la durée en minutes : par quoi faut-il multiplier ?'
  - si:
      valeur: 13500
    relance: Tu as multiplié la distance par la vitesse. Pour trouver une durée, il faut diviser.
  solution: 't = 150 ÷ 90 = 5/3 h. En minutes : 5/3 × 60 = 100 min (soit 1 h 40 min).'
- id: masse-volumique-d-un-bloc
  type: nombre
  difficulte: 2
  enonce: Un bloc métallique a une masse de 3,9 kg et un volume de 500 cm³. Calcule sa masse volumique en g/cm³. Écris seulement
    le nombre.
  reponse:
    valeur: 7.8
    forme: libre
  indices:
    relance: Quelle formule donne la masse volumique ? Dans quelle unité faut-il la masse pour obtenir des g/cm³ ?
    methode: Convertis la masse en grammes, puis calcule masse ÷ volume.
    etape: 3,9 kg = 3 900 g. Divise maintenant 3 900 par 500.
  pieges:
  - si:
      valeur: 0.0078
    relance: 'Ton résultat est en kg/cm³. On veut des g/cm³ : convertis d''abord la masse en grammes.'
  - si:
      valeur: 7800
    relance: Ce nombre serait la masse volumique en kg/m³. Ici, l'unité demandée est le g/cm³.
  - si:
      diagnostic: valeur_fausse
    relance: Convertis 3,9 kg en grammes, puis divise par le volume en cm³.
  solution: 3,9 kg = 3 900 g. 3 900 ÷ 500 = 7,8 g/cm³.
