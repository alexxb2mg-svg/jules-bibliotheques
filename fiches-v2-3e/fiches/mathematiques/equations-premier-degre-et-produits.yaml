# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: equations-premier-degre-et-produits
version: 2
etat: verifiee
declencheurs:
- isoler l'inconnue
- passer de l'autre côté du égal
- produit nul
- un des facteurs est nul
- x au carré égale
- valeur qui vérifie l'égalité
- résoudre une équation
- trouver la valeur de x
- carré égal à un nombre
prerequis:
- 4e-equations-premier-degre
- developper-factoriser-reduire
- racine-carree
essentiel: 'Résoudre une équation, c''est trouver toutes les valeurs de l''inconnue qui rendent l''égalité vraie. Ces valeurs
  sont les solutions.


  Équation du premier degré. On ne change pas les solutions si on ajoute (ou soustrait) le même nombre aux deux membres, ni
  si on multiplie (ou divise) les deux membres par un même nombre non nul. On regroupe les x d''un côté, les nombres de l''autre,
  puis on divise par le nombre devant x.

  Exemple : 5x + 2 = 2x + 17 donne 3x = 15, donc x = 5.

  Une équation peut demander de développer ou de réduire d''abord : 2(x + 3) = 14 s''écrit 2x + 6 = 14, donc x = 4.


  Équation produit. Un produit est nul si et seulement si l''un au moins de ses facteurs est nul. (ax + b)(cx + d) = 0 équivaut
  à ax + b = 0 ou cx + d = 0. On obtient en général deux solutions.

  Exemple : (x − 2)(x + 5) = 0 donne x = 2 ou x = −5.

  Pour utiliser cette règle, le second membre doit être 0 : si besoin, on passe tout dans le membre de gauche, puis on factorise.


  Équation x² = a.

  Si a > 0 : deux solutions, √a et −√a. Exemple : x² = 49 donne x = 7 ou x = −7.

  Si a = 0 : une seule solution, 0.

  Si a < 0 : aucune solution, car un carré n''est jamais négatif.


  Vérifier : on remplace x par la solution dans l''équation de départ.


  Au brevet, on attend : des étapes lisibles, une phrase de conclusion avec toutes les solutions, et une vérification.

  '
methode:
- 'Premier degré : développer et réduire si besoin, puis ajouter ou soustraire aux deux membres pour regrouper les x d''un
  côté et les nombres de l''autre.'
- Diviser les deux membres par le nombre devant x, en gardant les signes.
- 'Équation produit : vérifier que le second membre est 0, puis écrire que le premier facteur est nul OU que le second est
  nul, et résoudre chaque petite équation.'
- 'Équation x² = a : regarder d''abord le signe de a, puis donner √a et −√a si a est positif.'
- Vérifier en remplaçant x par chaque solution trouvée dans l'équation de départ.
- 'Conclure par une phrase : « Les solutions sont ... ».'
vocabulaire:
- terme: équation
  definition: Égalité qui contient une inconnue, souvent notée x.
- terme: inconnue
  definition: La lettre dont on cherche la valeur.
- terme: solution
  definition: Valeur de l'inconnue qui rend l'égalité vraie.
- terme: membre
  definition: Chacun des deux côtés du signe égal.
- terme: équation produit
  definition: Équation où un produit de facteurs est égal à 0.
- terme: facteur
  definition: Chacun des nombres ou expressions multipliés dans un produit.
- terme: premier degré
  definition: 'Équation où x apparaît sans carré : on peut l''écrire ax + b = 0.'
- terme: opposé
  definition: 'L''opposé de a est −a : leur somme vaut 0.'
erreurs_frequentes:
- 'Faire une opération d''un seul côté du signe égal : il faut la faire aux deux membres.'
- 'Soustraire le coefficient au lieu de diviser par lui : 3x = 27 ne donne pas x = 24.'
- Pour une équation produit, ne donner qu'une seule solution.
- Oublier la solution négative de x² = a quand a est positif.
- 'Résoudre un produit égal à un nombre non nul comme un produit nul : (x − 1)(x + 2) = 4 ne donne pas x = 1 ou x = −2.'
exemple:
  enonce: Résoudre 5x + 2 = 2x + 17.
  solution: 'On soustrait 2x : 3x + 2 = 17. On soustrait 2 : 3x = 15. On divise par 3 : x = 5. Vérification : 5 × 5 + 2 =
    27 et 2 × 5 + 17 = 27.'
exercices:
- id: premier-degre-simple
  type: nombre
  difficulte: 1
  enonce: Résous l'équation 3x − 8 = 19. Donne la valeur de x.
  reponse:
    valeur: 9
  indices:
    relance: Que faut-il faire aux deux membres pour faire disparaître le −8 ?
    methode: Ajoute 8 aux deux membres, puis divise les deux membres par 3.
    etape: Ajouter 8 donne 3x = 27. Termine.
  pieges:
  - si:
      valeur: 11/3
    relance: Pour faire disparaître −8, on ajoute 8 aux deux membres. As-tu ajouté ou soustrait ?
  - si:
      valeur: 24
    relance: '3x veut dire 3 fois x : pour isoler x, soustrait-on 3 ou divise-t-on par 3 ?'
  solution: '3x − 8 = 19, donc 3x = 27, donc x = 27 ÷ 3 = 9. Vérification : 3 × 9 − 8 = 19.'
- id: x-des-deux-cotes
  type: nombre
  difficulte: 2
  enonce: Résous l'équation 7x + 4 = 3x − 16. Donne la valeur de x.
  reponse:
    valeur: -5
  indices:
    relance: Comment faire pour qu'il n'y ait des x que dans un seul membre ?
    methode: Soustrais 3x aux deux membres, puis soustrais 4 aux deux membres, puis divise.
    etape: Soustraire 3x donne 4x + 4 = −16. Continue.
  pieges:
  - si:
      valeur: 5
    relance: 'Vérifie le signe : que vaut −16 − 4 ? Remplace x par ta valeur dans l''équation pour tester.'
  - si:
      valeur: -2
    relance: Pour enlever 3x du membre de droite, on soustrait 3x des deux côtés. Combien reste-t-il de x à gauche ?
  - si:
      valeur: -3
    relance: Pour enlever le +4, on soustrait 4 des deux côtés. Que vaut alors −16 − 4 ?
  solution: '7x + 4 = 3x − 16, donc 4x + 4 = −16, donc 4x = −20, donc x = −20 ÷ 4 = −5. Vérification : 7 × (−5) + 4 = −31
    et 3 × (−5) − 16 = −31.'
- id: equation-produit
  type: choix
  difficulte: 2
  enonce: Quelles sont les solutions de l'équation (2x − 6)(x + 4) = 0 ?
  reponse:
    options:
    - id: a
      texte: x = 3 ou x = −4
    - id: b
      texte: x = 6 ou x = −4
    - id: c
      texte: x = −3 ou x = 4
    - id: d
      texte: x = 3 seulement
    bonnes:
    - a
  indices:
    relance: Quand un produit de deux facteurs est-il égal à 0 ?
    methode: Écris que 2x − 6 = 0 ou que x + 4 = 0, et résous chacune de ces deux équations.
    etape: 2x − 6 = 0 donne 2x = 6. Termine, puis résous l'autre équation.
  pieges:
  - si:
      contient:
      - b
    relance: '2x = 6 ne donne pas x = 6 : il reste une division à faire.'
  - si:
      contient:
      - c
    relance: 'Vérifie les signes : remplace x par tes valeurs dans chaque facteur. Obtiens-tu 0 ?'
  - si:
      contient:
      - d
    relance: Un produit est nul si l'un OU l'autre facteur est nul. As-tu regardé le second facteur ?
  solution: 'Un produit est nul si l''un de ses facteurs est nul : 2x − 6 = 0, soit x = 3 ; ou x + 4 = 0, soit x = −4. Les
    solutions sont 3 et −4.'
- id: x-carre-positif
  type: choix
  difficulte: 2
  enonce: Quelles sont les solutions de l'équation x² = 36 ?
  reponse:
    options:
    - id: a
      texte: x = 6 seulement
    - id: b
      texte: x = 6 ou x = −6
    - id: c
      texte: x = 18 ou x = −18
    - id: d
      texte: pas de solution
    bonnes:
    - b
  indices:
    relance: Connais-tu deux nombres différents dont le carré est 36 ?
    methode: 'x² = a avec a positif a deux solutions : √a et son opposé.'
    etape: √36 est une solution. Calcule (−√36)² pour savoir si son opposé en est une aussi.
  pieges:
  - si:
      contient:
      - a
    relance: Calcule (−6)². Obtiens-tu aussi 36 ?
  - si:
      contient:
      - c
    relance: x² veut dire x × x, pas 2 × x. Calcule 18 × 18.
  - si:
      contient:
      - d
    relance: 36 est positif. Un nombre au carré peut-il valoir 36 ?
  solution: 6² = 36 et (−6)² = 36. Les solutions de x² = 36 sont 6 et −6.
- id: x-carre-negatif
  type: texte_court
  difficulte: 1
  enonce: Combien l'équation x² = −9 a-t-elle de solutions ? Réponds par un nombre ou par un mot.
  reponse:
    acceptees:
    - aucune
    - aucun
    - '0'
    - zéro
    - aucune solution
    - pas de solution
    - il n'y en a pas
    fautes_tolerees: 0
  indices:
    relance: Le carré d'un nombre peut-il être négatif ?
    methode: 'Essaie avec un nombre positif, puis avec un nombre négatif : quel est le signe de leur carré ?'
    etape: 3² = 9 et (−3)² = 9. Est-ce qu'un de ces carrés vaut −9 ?
  pieges:
  - si:
      valeur: deux
    relance: 'Teste : (−3)² fait-il −9 ? Et 3² ?'
  - si:
      valeur: '2'
    relance: 'Teste : (−3)² fait-il −9 ? Et 3² ?'
  - si:
      valeur: '1'
    relance: 'Quel nombre as-tu trouvé ? Calcule son carré : est-il vraiment égal à −9 ?'
  - si:
      valeur: une seule
    relance: 'Quel nombre as-tu trouvé ? Calcule son carré : est-il vraiment égal à −9 ?'
  solution: 'Aucune solution : un carré n''est jamais négatif, donc x² ne peut pas valoir −9.'
- id: factoriser-puis-resoudre
  type: ouverte
  difficulte: 3
  enonce: Résous l'équation x² − 25 = 0 en factorisant d'abord le membre de gauche. Explique chaque étape.
  criteres:
  - L'élève factorise x² − 25 en (x − 5)(x + 5) en reconnaissant une différence de deux carrés.
  - 'L''élève applique la règle du produit nul : x − 5 = 0 ou x + 5 = 0.'
  - L'élève donne les deux solutions, 5 et −5 (et peut vérifier en remplaçant).
  indices:
    relance: 25 est le carré de quel nombre ? Quelle égalité permet de factoriser a² − b² ?
    methode: Factorise avec a² − b² = (a − b)(a + b), puis utilise la règle du produit nul.
    etape: x² − 25 = x² − 5². Écris-le comme un produit de deux parenthèses.
  solution: 'x² − 25 = (x − 5)(x + 5). Un produit est nul si l''un des facteurs est nul : x − 5 = 0 ou x + 5 = 0, donc x =
    5 ou x = −5. On retrouve x² = 25.'
- id: produit-egal-quatre
  type: choix
  difficulte: 2
  enonce: Pour quelle équation peut-on écrire directement « un des facteurs est nul » ?
  reponse:
    options:
    - id: a
      texte: (x − 1)(x + 2) = 0
    - id: b
      texte: (x − 1)(x + 2) = 4
    - id: c
      texte: (x − 1) + (x + 2) = 0
    - id: d
      texte: x(x − 1) = 3
    bonnes:
    - a
  indices:
    relance: 'La règle « un produit est nul si l''un des facteurs est nul » demande deux choses : un produit, et un résultat
      précis. Lesquels ?'
    methode: Regarde le second membre de chaque équation, puis regarde si le premier membre est un produit ou une somme.
    etape: Élimine les équations dont le second membre n'est pas 0, puis celle qui contient une somme.
  pieges:
  - si:
      contient:
      - b
    relance: 'Le second membre est 4 et non 0. Un produit de deux nombres peut valoir 4 de bien des façons : la règle ne s''applique
      pas.'
  - si:
      contient:
      - c
    relance: Ici, les deux parenthèses sont additionnées, ce n'est pas un produit.
  - si:
      contient:
      - d
    relance: 'Le second membre est 3 et non 0 : la règle du produit nul ne s''applique pas.'
  solution: 'La règle du produit nul demande un produit égal à 0 : seule l''équation a convient. Dans les équations b et d,
    le second membre n''est pas 0 ; dans c, ce n''est pas un produit.'
- id: parentheses-a-developper
  type: nombre
  difficulte: 2
  enonce: Résous l'équation 3(x − 2) = 2x + 5. Donne la valeur de x.
  reponse:
    valeur: 11
    forme: libre
  indices:
    relance: Que faut-il faire de la parenthèse avant de regrouper les x ?
    methode: Développe 3(x − 2), puis soustrais 2x aux deux membres et ajoute le nombre qui reste pour isoler x.
    etape: 3(x − 2) devient 3x − 6. L'équation est maintenant 3x − 6 = 2x + 5. Continue.
  pieges:
  - si:
      valeur: -1
    relance: As-tu bien multiplié le −2 par 3 en développant ? Vérifie en remplaçant x par ta valeur dans l'équation.
  - si:
      valeur: 7
    relance: Tu n'as sans doute multiplié que x par 3 en développant. Le −2 est multiplié par 3 aussi.
  solution: '3(x − 2) = 2x + 5 donne 3x − 6 = 2x + 5, donc x − 6 = 5, donc x = 11. Vérification : 3 × 9 = 27 et 2 × 11 + 5
    = 27.'
