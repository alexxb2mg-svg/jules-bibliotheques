format: 2
notion: racine-carree
version: 2
etat: generee
declencheurs:
- signe radical
- nombre multiplié par lui-même
- quel nombre au carré
- touche racine de la calculatrice
- côté d'un carré connaissant son aire
- table des carrés
- carré parfait
- racine de la calculatrice
- encadrer une racine
prerequis:
- 4e-racine-carree
- 4e-theoreme-pythagore
essentiel: |
  La racine carrée d'un nombre positif a est le nombre positif dont le carré est a. On la note √a. Ainsi √a × √a = a et (√a)² = a.

  Exemple : √49 = 7, car 7 × 7 = 49 et 7 est positif. On a aussi (−7) × (−7) = 49, mais une racine carrée est toujours positive : √49 n'est pas −7.

  Il faut connaître les carrés parfaits de 1 à 144 : 1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144 (les carrés de 1, 2, 3, ..., 12). Leurs racines sont des entiers.

  Si a n'est pas un carré parfait, √a n'est pas un entier. On l'encadre entre deux entiers grâce aux carrés parfaits voisins : 49 < 50 < 64 donne 7 < √50 < 8. On peut aussi donner une valeur approchée à la calculatrice (√50 ≈ 7,07).

  La racine carrée d'un nombre négatif n'existe pas, car un carré n'est jamais négatif.

  Attention : √(a + b) n'est pas égal à √a + √b. Par exemple √(9 + 16) = √25 = 5, mais √9 + √16 = 7.

  Usages dans les problèmes.
  Aire d'un carré : si l'aire vaut 36 cm², le côté vaut √36 = 6 cm.
  Théorème de Pythagore : dans un triangle rectangle, l'hypoténuse c vérifie c² = a² + b². On calcule c² puis on prend la racine carrée à la fin.

  Au brevet, on attend : reconnaître les carrés parfaits, donner la valeur exacte √a (ou une valeur approchée si on la demande) et savoir rédiger « le côté vaut √... = ... ».
methode:
- 'Se demander : quel nombre positif, multiplié par lui-même, donne ce nombre ?'
- Si le nombre est dans la liste des carrés parfaits de 1 à 144, la réponse est un entier.
- Sinon, chercher les deux carrés parfaits qui entourent le nombre pour encadrer sa racine entre deux entiers consécutifs.
- Dans un problème (aire d'un carré, Pythagore), calculer d'abord le carré de la longueur cherchée, puis prendre la racine
  carrée à la fin.
- Utiliser la calculatrice pour une valeur approchée, et l'arrondir comme demandé.
- Vérifier en élevant le résultat au carré.
vocabulaire:
- terme: carré
  definition: 'Le carré d''un nombre est ce nombre multiplié par lui-même : 6² = 36.'
- terme: carré parfait
  definition: Nombre entier qui est le carré d'un entier, comme 36 = 6².
- terme: racine carrée
  definition: Pour un nombre positif a, le nombre positif dont le carré vaut a.
- terme: radical
  definition: Le signe √ qui sert à écrire une racine carrée.
- terme: encadrement
  definition: Deux nombres entre lesquels on place un nombre, par exemple 7 < √50 < 8.
- terme: valeur approchée
  definition: Nombre proche de la valeur exacte, obtenu par arrondi à la calculatrice.
- terme: valeur exacte
  definition: Résultat écrit sans arrondi, par exemple √50.
- terme: hypoténuse
  definition: Le plus grand côté d'un triangle rectangle, en face de l'angle droit.
erreurs_frequentes:
- 'Diviser par 2 au lieu de prendre la racine carrée : √64 n''est pas 32.'
- 'Donner une racine carrée négative : √25 vaut 5, pas −5.'
- 'Écrire √(9 + 16) = √9 + √16 : c''est faux, on calcule d''abord ce qu''il y a sous la racine.'
- Dans le théorème de Pythagore, oublier de prendre la racine carrée à la fin.
- 'Chercher la racine carrée d''un nombre négatif : elle n''existe pas.'
exemple:
  enonce: Un carré a une aire de 49 m². Quelle est la longueur de son côté ?
  solution: 'L''aire d''un carré est côté × côté. On cherche un nombre positif dont le carré vaut 49 : c''est √49 = 7, car
    7 × 7 = 49. Le côté mesure 7 m.'
exercices:
- id: racine-de-81
  type: nombre
  difficulte: 1
  enonce: Calcule √81.
  reponse:
    valeur: 9
    forme: libre
  indices:
    relance: Quel nombre positif, multiplié par lui-même, donne 81 ?
    methode: Récite la liste des carrés parfaits jusqu'à trouver 81.
    etape: 8 × 8 = 64, c'est trop petit. Essaie l'entier suivant.
  pieges:
  - si:
      valeur: 40.5
    relance: Prendre la racine carrée, ce n'est pas diviser par 2. Quel nombre multiplié par lui-même donne 81 ?
  - si:
      valeur: 6561
    relance: Tu as calculé 81 × 81. On cherche au contraire un nombre qui, multiplié par lui-même, donne 81.
  - si:
      valeur: -9
    relance: Le carré de ton nombre donne bien 81, mais une racine carrée est toujours positive.
  solution: 9 × 9 = 81 et 9 est positif, donc √81 = 9.
- id: cote-carre-aire-144
  type: nombre
  difficulte: 1
  enonce: Un carré a une aire de 144 cm². Quelle est la longueur de son côté, en cm ?
  reponse:
    valeur: 12
    forme: libre
  indices:
    relance: Comment calcule-t-on l'aire d'un carré à partir de son côté ?
    methode: 'L''aire vaut côté × côté. Cherche donc le nombre positif dont le carré vaut 144 : c''est √144.'
    etape: 10 × 10 = 100 et 11 × 11 = 121. Continue la liste des carrés.
  pieges:
  - si:
      valeur: 36
    relance: 'Tu as divisé par 4, comme pour un périmètre. Ici, 144 cm² est une aire : aire = côté × côté.'
  - si:
      valeur: 72
    relance: Prendre la racine carrée, ce n'est pas diviser par 2. Quel nombre multiplié par lui-même donne 144 ?
  solution: Aire = côté × côté, donc côté = √144 = 12 cm, car 12 × 12 = 144.
- id: carres-parfaits
  type: choix
  difficulte: 2
  enonce: Parmi ces nombres, lesquels sont des carrés parfaits ? (Il peut y en avoir plusieurs.)
  reponse:
    options:
    - id: a
      texte: '64'
    - id: b
      texte: '90'
    - id: c
      texte: '121'
    - id: d
      texte: '125'
    bonnes:
    - a
    - c
  indices:
    relance: Un carré parfait est le carré d'un entier. Connais-tu les carrés des entiers de 1 à 12 ?
    methode: Pour chaque nombre, cherche un entier qui, multiplié par lui-même, le donne exactement.
    etape: '9 × 9 = 81 et 10 × 10 = 100 : 90 est entre les deux. Fais de même pour les autres.'
  pieges:
  - si:
      contient:
      - d
    relance: '125 = 5 × 5 × 5 : c''est un cube. Existe-t-il un entier qui, multiplié par lui-même une seule fois, donne 125
      ?'
  - si:
      contient:
      - b
    relance: 90 est entre 81 et 100. Est-il le carré d'un entier ?
  - si:
      diagnostic: incomplet
    relance: Il y a une autre bonne réponse. Pense aux carrés de 8, 9, 10, 11 et 12.
  solution: 64 = 8 × 8 et 121 = 11 × 11 sont des carrés parfaits. 90 est entre 81 et 100 ; 125 est entre 121 et 144 (c'est
    5³, un cube).
- id: encadrer-racine-50
  type: nombre
  difficulte: 2
  enonce: √50 est compris entre deux nombres entiers consécutifs. Quel est le plus petit des deux ?
  reponse:
    valeur: 7
    forme: entier
  indices:
    relance: 50 est-il un carré parfait ? Quels carrés parfaits l'entourent ?
    methode: Trouve le plus grand carré parfait inférieur à 50 et le plus petit carré parfait supérieur à 50, puis prends
      leurs racines.
    etape: Le plus petit carré parfait supérieur à 50 est 64, dont la racine est 8. Et juste en dessous de 50 ?
  pieges:
  - si:
      valeur: 25
    relance: Prendre la racine carrée, ce n'est pas diviser par 2. Quel carré parfait est juste en dessous de 50 ?
  - si:
      valeur: 8
    relance: '8 × 8 = 64, c''est plus grand que 50 : 8 est le plus grand des deux entiers. On demande le plus petit.'
  - si:
      valeur: 49
    relance: '49 est le carré parfait juste en dessous de 50. Mais on demande un encadrement de √50 : quelle est la racine
      de ce carré ?'
  solution: 49 < 50 < 64, donc √49 < √50 < √64, c'est-à-dire 7 < √50 < 8. Le plus petit entier est 7.
- id: diagonale-jardin
  type: nombre
  difficulte: 3
  enonce: Un jardin rectangulaire mesure 9 m de large et 12 m de long. Noa veut tendre une corde en diagonale, d'un coin au
    coin opposé. Quelle est la longueur de cette diagonale, en m ?
  reponse:
    valeur: 15
    forme: libre
  indices:
    relance: La diagonale partage le rectangle en deux triangles. De quelle nature sont ces triangles ?
    methode: Dans un triangle rectangle, le carré de l'hypoténuse est la somme des carrés des deux autres côtés (théorème
      de Pythagore). Prends la racine carrée à la fin.
    etape: 9² = 81 et 12² = 144. Additionne-les, puis cherche la racine carrée du résultat.
  pieges:
  - si:
      valeur: 21
    relance: 'Tu as additionné les deux côtés. La diagonale est l''hypoténuse d''un triangle rectangle : utilise Pythagore.'
  - si:
      valeur: 225
    relance: 'Tu as trouvé le carré de la diagonale. Il reste une étape : laquelle ?'
  solution: Le triangle formé est rectangle. D'après Pythagore, diagonale² = 9² + 12² = 81 + 144 = 225, donc diagonale = √225
    = 15 m (car 15 × 15 = 225).
- id: racine-d-une-somme
  type: ouverte
  difficulte: 3
  enonce: 'Noé affirme : « √(9 + 16) = √9 + √16 ». A-t-il raison ? Justifie par des calculs.'
  criteres:
  - 'L''élève calcule correctement les deux membres : √(9 + 16) = √25 = 5, et √9 + √16 = 3 + 4 = 7.'
  - 'L''élève conclut que Noé a tort, car 5 n''est pas égal à 7 : la racine carrée d''une somme n''est pas la somme des racines
    carrées.'
  indices:
    relance: Calcule séparément chaque côté de l'égalité. Trouves-tu le même résultat ?
    methode: À gauche, calcule d'abord la somme sous la racine, puis la racine. À droite, calcule chaque racine, puis additionne.
    etape: 'À gauche : 9 + 16 = 25. Quelle est la racine carrée de 25 ? À droite : combien valent √9 et √16 ?'
  solution: 'À gauche : √(9 + 16) = √25 = 5. À droite : √9 + √16 = 3 + 4 = 7. Comme 5 n''est pas égal à 7, Noé a tort : en
    général, √(a + b) n''est pas égal à √a + √b.'
- id: racine-nombre-negatif
  type: choix
  difficulte: 1
  enonce: Parmi ces écritures, lesquelles ont un sens (racine carrée d'un nombre) ?
  reponse:
    options:
    - id: a
      texte: √36
    - id: b
      texte: √(−36)
    - id: c
      texte: √0
    - id: d
      texte: √(−4 + 8)
    bonnes:
    - a
    - c
    - d
  indices:
    relance: Une racine carrée n'existe que pour un nombre positif ou nul. Calcule d'abord ce qu'il y a sous le radical.
    methode: Pour chaque écriture, calcule le nombre sous la racine et regarde s'il est négatif.
    etape: Pour la dernière, calcule −4 + 8 avant de regarder son signe.
  pieges:
  - si:
      contient:
      - b
    relance: 'Un carré n''est jamais négatif : aucun nombre multiplié par lui-même ne donne un résultat négatif. Cette écriture
      n''a pas de sens.'
  - si:
      diagnostic: incomplet
    relance: Il y a d'autres bonnes réponses. Calcule le nombre sous chaque radical, et n'oublie pas 0.
  solution: '√36 = 6, √0 = 0 et √(−4 + 8) = √4 = 2 ont un sens. √(−36) n''existe pas : un carré n''est jamais négatif.'
- id: valeur-approchee-racine-20
  type: nombre
  difficulte: 2
  enonce: Un carré a une aire de 20 cm². À la calculatrice, donne la longueur de son côté arrondie au dixième de cm.
  reponse:
    valeur: 4.5
    forme: libre
    tolerance: 0.05
  indices:
    relance: Comment retrouve-t-on le côté d'un carré quand on connaît son aire ?
    methode: Le côté vaut √20. Utilise la touche racine carrée de la calculatrice, puis arrondis au dixième.
    etape: 16 < 20 < 25, donc √20 est entre 4 et 5. Calcule avec la calculatrice pour être plus précis.
  pieges:
  - si:
      valeur: 10
    relance: Prendre la racine carrée, ce n'est pas diviser par 2. Quel nombre multiplié par lui-même donne 20 ?
  - si:
      valeur: 5
    relance: Un carré de côté 5 cm a une aire de 25 cm². Le côté est un peu plus petit. Arrondis à un chiffre après la virgule.
  solution: 'Côté = √20 ≈ 4,472 cm, soit 4,5 cm arrondi au dixième. Vérification : 4,5 × 4,5 = 20,25, proche de 20.'
