format: 2
notion: fractions-irreductibles
version: 1
etat: verifiee
declencheurs:
- simplifier au maximum
- on ne peut plus simplifier
- la plus simple possible
- diviser en haut et en bas
- diviseur commun
- barrer les chiffres
prerequis:
- nombres-premiers-decomposition
- multiples-diviseurs-division-euclidienne
couverture: Couvre la simplification d'une fraction jusqu'à la rendre irréductible, par divisions successives ou à l'aide
  des décompositions en facteurs premiers. Les opérations sur les fractions sont dans la fiche « calcul-nombres-rationnels
  ».
essentiel: 'On ne change pas la valeur d''une fraction en divisant son numérateur et son dénominateur par un même nombre non
  nul : 18/24 = (18 ÷ 6)/(24 ÷ 6) = 3/4.


  Une fraction est irréductible quand son numérateur et son dénominateur n''ont pas d''autre diviseur commun que 1. On ne
  peut alors plus la simplifier.


  Pour rendre une fraction irréductible :

  - on peut la simplifier plusieurs fois de suite (par 2, par 3, par 5…) jusqu''à ne plus pouvoir ;

  - ou décomposer le numérateur et le dénominateur en produits de facteurs premiers, puis supprimer les facteurs communs.


  On simplifie en divisant, jamais en barrant des chiffres ni en soustrayant.

  '
methode:
- Chercher un diviseur commun au numérateur et au dénominateur (critères de divisibilité par 2, 3, 5, 9, 10).
- Diviser le numérateur et le dénominateur par ce nombre.
- Recommencer tant qu'il existe un diviseur commun autre que 1.
- Pour de grands nombres, décomposer numérateur et dénominateur en facteurs premiers et supprimer les facteurs communs.
- Vérifier à la fin que le numérateur et le dénominateur n'ont plus de facteur premier commun.
vocabulaire:
- terme: fraction irréductible
  definition: une fraction dont le numérateur et le dénominateur n'ont que 1 comme diviseur commun
- terme: simplifier une fraction
  definition: écrire une fraction égale avec un numérateur et un dénominateur plus petits, en les divisant par un même nombre
erreurs_frequentes:
- 'S''arrêter trop tôt : 9/12 est égal à 18/24 mais n''est pas irréductible.'
- 'Barrer des chiffres identiques : dans 12/24, barrer les 2 donne 1/4, ce qui est faux.'
- Diviser seulement le numérateur, ou diviser le numérateur et le dénominateur par des nombres différents.
- Croire qu'une fraction avec de grands nombres ne peut pas être irréductible, ou l'inverse.
exemple:
  enonce: Rends irréductible la fraction 60/84.
  solution: '60 = 2² × 3 × 5 et 84 = 2² × 3 × 7. Les facteurs communs sont 2² × 3 = 12. On divise : 60 ÷ 12 = 5 et 84 ÷ 12
    = 7. Donc 60/84 = 5/7, et 5 et 7 n''ont plus de diviseur commun autre que 1.'
exercices:
- id: simplifier-18-24
  type: nombre
  difficulte: 1
  enonce: Écris la fraction 18/24 sous forme irréductible.
  reponse:
    valeur: 3/4
    forme: fraction_irreductible
  indices:
    relance: 18 et 24 sont-ils tous les deux pairs ? Sont-ils dans une même autre table ?
    methode: Divise le numérateur et le dénominateur par un même diviseur commun, puis recommence si c'est encore possible.
    etape: En divisant en haut et en bas par 2, on obtient 9/12. Peux-tu encore simplifier ?
  pieges:
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est égale à 18/24, mais on peut encore la simplifier. Cherche un diviseur commun.
  - si:
      diagnostic: pas_une_fraction
    relance: La valeur est juste, mais on demande une fraction, pas un nombre décimal.
  solution: '18 et 24 sont divisibles par 6 : 18/24 = (18 ÷ 6)/(24 ÷ 6) = 3/4. 3 et 4 n''ont que 1 comme diviseur commun.'
- id: nom-fraction-plus-simple
  type: texte_court
  difficulte: 1
  enonce: 'Comment appelle-t-on une fraction dont le numérateur et le dénominateur n''ont que 1 comme diviseur commun ? Complète
    : une fraction …'
  reponse:
    acceptees:
    - irréductible
    - fraction irréductible
    fautes_tolerees: 2
  indices:
    relance: Peut-on encore simplifier une telle fraction ?
    methode: Le mot veut dire « qu'on ne peut plus réduire ». Il commence par le préfixe « ir- », comme « irremplaçable ».
    etape: 'Pense au verbe « réduire » : ajoute le préfixe « ir- » devant et la fin « -ible ».'
  pieges:
  - si:
      valeur: simplifiée
    relance: Une fraction simplifiée une fois peut encore se simplifier. Quel mot dit qu'on ne peut plus du tout la réduire
      ?
  - si:
      valeur: décimale
    relance: Une fraction décimale a pour dénominateur 10, 100, 1 000… Quel mot dit qu'on ne peut plus simplifier ?
  solution: 'Une fraction irréductible : son numérateur et son dénominateur n''ont que 1 comme diviseur commun, on ne peut
    plus la simplifier.'
- id: simplifier-126-210
  type: nombre
  difficulte: 2
  enonce: Écris la fraction 126/210 sous forme irréductible.
  reponse:
    valeur: 3/5
    forme: fraction_irreductible
  indices:
    relance: 126 et 210 ont-ils un diviseur commun facile à voir ?
    methode: Simplifie plusieurs fois de suite, par 2, puis par 3, puis par 7, tant que c'est possible.
    etape: 'Par 2 : 126/210 = 63/105. La somme des chiffres de 63 et celle de 105 sont divisibles par 3. Continue.'
  pieges:
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est juste, mais pas encore irréductible. Essaie de diviser encore par 3 ou par 7.
  - si:
      diagnostic: pas_une_fraction
    relance: La valeur est juste, mais on demande une fraction irréductible, pas un décimal.
  solution: 126/210 = 63/105 (on divise par 2) = 21/35 (par 3) = 3/5 (par 7). Au total, on a divisé par 42. 3 et 5 n'ont que
    1 comme diviseur commun.
- id: reconnaitre-irreductibles
  type: choix
  difficulte: 2
  enonce: Quelles fractions sont déjà irréductibles ? (Il peut y en avoir plusieurs.)
  reponse:
    options:
    - id: a
      texte: 15/28
    - id: b
      texte: 21/35
    - id: c
      texte: 13/39
    - id: d
      texte: 17/19
    bonnes:
    - a
    - d
  indices:
    relance: Pour chaque fraction, le numérateur et le dénominateur ont-ils un diviseur commun autre que 1 ?
    methode: Décompose le numérateur et le dénominateur en facteurs premiers et cherche un facteur commun.
    etape: 21 = 3 × 7 et 35 = 5 × 7. Fais de même avec les autres fractions.
  pieges:
  - si:
      contient:
      - c
    relance: 13 est premier, mais 39 est-il un multiple de 13 ?
  - si:
      contient:
      - b
    relance: 21 et 35 sont tous les deux dans la table de 7.
  - si:
      diagnostic: incomplet
    relance: Il y en a une autre. 15 = 3 × 5 et 28 = 2² × 7 ont-ils un facteur premier commun ?
  solution: '15/28 : 15 = 3 × 5 et 28 = 2² × 7, pas de facteur commun, elle est irréductible. 17/19 : deux nombres premiers
    différents, irréductible. 21/35 se simplifie par 7 et 13/39 par 13.'
- id: simplifier-avec-decompositions
  type: nombre
  difficulte: 3
  enonce: On donne 1 386 = 2 × 3² × 7 × 11 et 1 650 = 2 × 3 × 5² × 11. Écris la fraction 1386/1650 sous forme irréductible.
  reponse:
    valeur: 21/25
    forme: fraction_irreductible
  indices:
    relance: Quels facteurs premiers apparaissent à la fois dans les deux décompositions ?
    methode: Supprime les facteurs communs au numérateur et au dénominateur, puis calcule ce qui reste en haut et en bas.
    etape: Les facteurs communs sont 2, un 3 et 11. En haut, il reste un 3 et le 7 ; en bas, il reste 5².
  pieges:
  - si:
      valeur: 63/75
    relance: 63 et 75 sont encore divisibles par 3. Combien de facteurs 3 sont communs aux deux décompositions ?
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est juste, mais il reste un facteur commun. Reprends les décompositions.
  - si:
      diagnostic: pas_une_fraction
    relance: La valeur est juste, mais on demande une fraction irréductible.
  solution: Les facteurs communs sont 2 × 3 × 11 = 66. En haut il reste 3 × 7 = 21, en bas 5² = 25. Donc 1386/1650 = 21/25,
    et 21 = 3 × 7 et 25 = 5² n'ont pas de facteur commun.
- id: barrer-les-chiffres
  type: ouverte
  difficulte: 3
  enonce: Ali simplifie 16/64 en barrant les deux 6 et obtient 1/4. Le résultat est juste. Sa méthode est-elle correcte ?
    Montre-le avec la fraction 12/24.
  criteres:
  - L'élève applique la méthode d'Ali à 12/24 (barrer les 2 donne 1/4) et montre que c'est faux, car 12/24 = 1/2.
  - L'élève explique que pour simplifier on divise le numérateur et le dénominateur par un même nombre, et que le résultat
    juste pour 16/64 est un hasard.
  indices:
    relance: Que donne la méthode d'Ali sur 12/24 ? Et que vaut vraiment 12/24 ?
    methode: Simplifie 12/24 correctement, en divisant par un diviseur commun, puis compare avec le résultat obtenu en barrant.
    etape: 12 est la moitié de 24. Compare ce résultat avec celui obtenu en barrant les 2.
  solution: 'En barrant les 2 dans 12/24, on obtient 1/4. Or 12/24 = (12 ÷ 12)/(24 ÷ 12) = 1/2. La méthode d''Ali est fausse
    : pour 16/64, c''est un hasard. On simplifie en divisant le numérateur et le dénominateur par un même nombre (16/64 =
    1/4 en divisant par 16).'
- id: nblm-quand-dit-on-qu-une-fraction-est-sous-sa-1
  type: choix
  difficulte: 2
  enonce: Quand dit-on qu'une fraction est sous sa forme la plus simple possible, c'est-à-dire irréductible ?
  reponse:
    options:
    - id: o1
      texte: Quand son numérateur et son dénominateur n'ont pas d'autre diviseur commun que 1.
    - id: o2
      texte: Quand le numérateur est plus petit que le dénominateur.
    - id: o3
      texte: Quand son numérateur et son dénominateur sont deux nombres pairs.
    - id: o4
      texte: Quand le dénominateur est égal à 10 ou 100.
    bonnes:
    - o1
  indices:
    relance: Pense au seul diviseur qu'ont en commun le haut et le bas lorsque la fraction ne peut plus être réduite.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : 2/4 a un numérateur plus petit que son dénominateur, mais elle peut encore être
      simplifiée par 2 en 1/2.'
  - si:
      contient:
      - o3
    relance: Si les deux nombres sont pairs, ils sont divisibles par 2, donc la fraction n'est pas irréductible.
  - si:
      contient:
      - o4
    relance: Une fraction sur 10 ou 100 est une fraction décimale, mais elle n'est pas forcément irréductible (par exemple
      50/100 = 1/2).
  solution: Quand son numérateur et son dénominateur n'ont pas d'autre diviseur commun que 1. Exact ! Quand le seul diviseur
    commun au numérateur et au dénominateur est 1, la fraction est simplifiée au maximum.
- id: nblm-pour-simplifier-une-fraction-sans-change-2
  type: choix
  difficulte: 2
  enonce: Pour simplifier une fraction sans changer sa valeur, quelle opération doit-on effectuer ?
  reponse:
    options:
    - id: o1
      texte: Diviser en haut et en bas par un même nombre non nul.
    - id: o2
      texte: Soustraire un même nombre au numérateur et au dénominateur.
    - id: o3
      texte: Diviser le numérateur par 2 et le dénominateur par 3.
    - id: o4
      texte: Barrer les chiffres identiques en haut et en bas.
    bonnes:
    - o1
  indices:
    relance: Cherche l'opération qui conserve l'égalité entre deux fractions en agissant de la même façon en haut et en bas.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, la soustraction modifie la valeur de la fraction ! Par exemple, (5-1)/(7-1) = 4/6 = 2/3, ce qui est
      différent de 5/7.
  - si:
      contient:
      - o3
    relance: Il faut obligatoirement diviser par le MÊME nombre au numérateur et au dénominateur.
  - si:
      contient:
      - o4
    relance: Barrer des chiffres est une erreur fréquente et incorrecte ! Par exemple, barrer les 2 dans 12/24 donnerait 1/4
      au lieu de 1/2.
  solution: Diviser en haut et en bas par un même nombre non nul. Exactement ! Diviser le numérateur et le dénominateur par
    un même diviseur commun conserve la valeur de la fraction.
- id: nblm-un-eleve-veut-simplifier-la-fraction-12-3
  type: choix
  difficulte: 2
  enonce: Un élève veut simplifier la fraction 12/24 et décide de barrer les chiffres 2 en haut et en bas pour obtenir 1/4.
    Pourquoi ce raisonnement est-il faux ?
  reponse:
    options:
    - id: o1
      texte: On simplifie en divisant par un diviseur commun, jamais en barrant des chiffres.
    - id: o2
      texte: Parce qu'il fallait barrer le 1 à la place du 2.
    - id: o3
      texte: Parce que 12 et 24 ne sont pas divisibles par 2.
    - id: o4
      texte: Parce que 1/4 n'est pas une fraction irréductible.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la seule opération mathématique autorisée pour simplifier un numérateur et un dénominateur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Barrer des chiffres ne correspond à aucune règle mathématique valide pour simplifier une fraction.
  - si:
      contient:
      - o3
    relance: 12 et 24 sont deux nombres pairs, ils sont donc bien divisibles par 2.
  - si:
      contient:
      - o4
    relance: 1/4 est bien une fraction irréductible, mais elle n'est pas égale à 12/24 (qui vaut 1/2).
  solution: 'On simplifie en divisant par un diviseur commun, jamais en barrant des chiffres. Bravo ! Barrer les chiffres
    n''est pas une division. En divisant 12 et 24 par 12, on obtient la vraie forme irréductible : 1/2.'
- id: nblm-quelle-est-la-forme-irreductible-de-la-f-4
  type: choix
  difficulte: 2
  enonce: Quelle est la forme irréductible de la fraction 60/84, c'est-à-dire lorsqu'on la simplifie au maximum ?
  reponse:
    options:
    - id: o1
      texte: 5/7
    - id: o2
      texte: 30/42
    - id: o3
      texte: 15/21
    - id: o4
      texte: 10/14
    bonnes:
    - o1
  indices:
    relance: Décompose 60 et 84 en facteurs premiers ou divise le haut et le bas par leurs diviseurs communs successifs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : s''arrêter trop tôt ! 30 et 42 sont encore pairs, ils sont donc divisibles par 2 puis par
      3.'
  - si:
      contient:
      - o3
    relance: Incomplet ! 15 et 21 sont encore tous les deux divisibles par 3 (15 ÷ 3 = 5 et 21 ÷ 3 = 7).
  - si:
      contient:
      - o4
    relance: Cette fraction n'est pas simplifiée au maximum car 10 et 14 sont divisibles par 2.
  solution: 5/7. Exact ! En divisant 60 et 84 par leur plus grand diviseur commun 12 (ou par 2, puis par 2, puis par 3), on
    obtient 5/7.
- id: nblm-parmi-les-fractions-suivantes-laquelle-e-5
  type: choix
  difficulte: 2
  enonce: Parmi les fractions suivantes, laquelle est déjà une fraction irréductible ?
  reponse:
    options:
    - id: o1
      texte: 7/15
    - id: o2
      texte: 9/12
    - id: o3
      texte: 14/22
    - id: o4
      texte: 15/35
    bonnes:
    - o1
  indices:
    relance: Examine si le numérateur et le dénominateur de chaque fraction ont un diviseur commun autre que 1.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: '9 et 12 ont 3 comme diviseur commun : en divisant en haut et en bas par 3, on obtient 3/4.'
  - si:
      contient:
      - o3
    relance: 14 et 22 sont tous deux des nombres pairs, ils sont donc divisibles par 2 (ce qui donne 7/11).
  - si:
      contient:
      - o4
    relance: 15 et 35 se terminent par 5, ils sont donc tous les deux divisibles par 5 (ce qui donne 3/7).
  solution: 7/15. Exact ! Les seuls diviseurs de 7 sont 1 et 7, et 15 n'est pas divisible par 7. Le seul diviseur commun est
    1.
- id: nblm-quelles-sont-les-deux-affirmations-vraie-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations vraies concernant la simplification des fractions ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Pour simplifier au maximum, on peut décomposer le numérateur et le dénominateur en facteurs premiers puis supprimer
        les facteurs communs.
    - id: o2
      texte: Une fraction est irréductible quand son numérateur et son dénominateur n'ont aucun autre diviseur commun que
        1.
    - id: o3
      texte: Une fraction dont le numérateur est impair est forcément irréductible.
    - id: o4
      texte: On peut simplifier une fraction en soustrayant un même nombre au numérateur et au dénominateur.
    bonnes:
    - o1
    - o2
  indices:
    relance: Appuie-toi sur la définition exacte d'une fraction irréductible et sur les méthodes de division autorisées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Faux ! Par exemple 9/15 a un numérateur impair (9), mais elle se simplifie par 3 pour donner 3/5.
  - si:
      contient:
      - o4
    relance: Faux ! La soustraction change la valeur de la fraction. On ne peut que diviser (ou multiplier) en haut et en
      bas par un même nombre.
  solution: Pour simplifier au maximum, on peut décomposer le numérateur et le dénominateur en facteurs premiers puis supprimer
    les facteurs communs ; Une fraction est irréductible quand son numérateur et son dénominateur n'ont aucun autre diviseur
    commun que 1. Vrai ! La décomposition en produit de facteurs premiers permet d'obtenir directement la forme irréductible.
- id: nblm-comment-qualifie-t-on-une-fraction-sous-7
  type: texte_court
  difficulte: 1
  enonce: Comment qualifie-t-on une fraction sous sa forme la plus simple possible, que l'on ne peut plus simplifier ?
  reponse:
    acceptees:
    - irréductible
    fautes_tolerees: 1
  indices:
    relance: Il s'agit du mot-clé principal de la leçon.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: irréductible. Bravo ! Une fraction que l'on ne peut plus simplifier est appelée une fraction irréductible.
- id: nblm-pour-simplifier-une-fraction-on-divise-l-8
  type: texte_court
  difficulte: 1
  enonce: Pour simplifier une fraction, on divise le numérateur et le dénominateur en haut et en bas par un même ________
    non nul.
  reponse:
    acceptees:
    - diviseur commun
    fautes_tolerees: 1
  indices:
    relance: C'est l'expression de deux mots désignant un nombre qui divise à la fois le numérateur et le dénominateur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: diviseur commun. Exact ! On divise le haut et le bas par un diviseur commun pour obtenir une fraction égale.
