# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: histogrammes
version: 2
etat: verifiee
declencheurs:
- barres collées
- rectangles accolés
- tranches de taille
- regroupées par intervalles
- graphique en tranches
- hauteur des rectangles
- regrouper en classes
- diagramme en rectangles
prerequis:
- effectifs-et-frequences
essentiel: 'Quand une série contient beaucoup de valeurs différentes (tailles, durées, masses...), on les regroupe en classes
  : des intervalles qui se suivent.


  La classe [150 ; 160[ contient les valeurs t telles que 150 ≤ t < 160. La borne 150 est dedans, la borne 160 n''y est pas
  : 160 va dans la classe suivante, [160 ; 170[.


  L''amplitude d''une classe est la différence entre ses deux bornes : 160 − 150 = 10. Ici, toutes les classes ont la même
  amplitude.


  L''effectif d''une classe est le nombre de valeurs qu''elle contient. L''effectif total est la somme de tous les effectifs.

  La fréquence d''une classe est son effectif divisé par l''effectif total. On peut l''écrire en pourcentage.


  Un histogramme représente chaque classe par un rectangle. Les rectangles sont accolés (sans espace) et ont tous la même
  largeur. Comme les amplitudes sont égales, la hauteur de chaque rectangle est proportionnelle à l''effectif de la classe.


  À ne pas confondre : un diagramme en bâtons a des bâtons séparés, pour des valeurs isolées ; un histogramme a des rectangles
  collés, pour des classes.


  Pour lire un histogramme, on lit la hauteur de chaque rectangle, puis on additionne les classes qui répondent à la question
  (« moins de », « au moins », « entre »).

  On ne connaît pas les valeurs exactes : seulement le nombre de valeurs dans chaque classe.


  Exemple : les classes [0 ; 5[, [5 ; 10[ et [10 ; 15[ ont pour hauteurs 2, 3 et 3. L''effectif total est 8. « Moins de 10
  » : 2 + 3 = 5 valeurs sur 8.


  Au brevet : on lit des effectifs, on calcule un effectif total ou un pourcentage, on complète un tableau de classes ou on
  trace l''histogramme.

  '
methode:
- Lire l'axe horizontal (les classes, avec leur unité) et l'axe vertical (les effectifs).
- 'Pour l''effectif d''une classe : lire la hauteur du rectangle.'
- 'Pour « au moins » ou « moins de » : additionner les effectifs des classes concernées, sans en oublier.'
- 'Pour l''effectif total : additionner les hauteurs de tous les rectangles. Pour une fréquence : diviser l''effectif de la
  classe par l''effectif total.'
- 'Pour construire : ranger chaque valeur dans sa classe (attention aux valeurs égales à une borne), puis compter.'
- Tracer des rectangles accolés, de même largeur, de hauteur égale à l'effectif. Ajouter un titre et nommer les axes.
vocabulaire:
- terme: classe
  definition: Intervalle de valeurs, par exemple [150 ; 160[.
- terme: amplitude
  definition: Différence entre la borne supérieure et la borne inférieure d'une classe.
- terme: effectif
  definition: Nombre de valeurs d'une classe.
- terme: effectif total
  definition: Somme des effectifs de toutes les classes.
- terme: fréquence
  definition: Effectif d'une classe divisé par l'effectif total, souvent écrit en pourcentage.
- terme: histogramme
  definition: Graphique fait de rectangles accolés, un par classe, dont la hauteur donne l'effectif.
- terme: diagramme en bâtons
  definition: Graphique à bâtons séparés, pour des valeurs isolées et non des classes.
- terme: centre d'une classe
  definition: Milieu de la classe, moyenne de ses deux bornes.
erreurs_frequentes:
- Ranger une valeur égale à la borne supérieure dans la mauvaise classe (160 va dans [160 ; 170[, pas dans [150 ; 160[).
- Laisser des espaces entre les rectangles, comme dans un diagramme en bâtons.
- Croire qu'on connaît les valeurs exactes à l'intérieur d'une classe.
- Oublier une classe quand on additionne les effectifs pour « au moins » ou « moins de ».
- Confondre l'effectif d'une classe et sa fréquence (un nombre de valeurs, ou une part de l'effectif total).
exemple:
  enonce: 'Durées d''appel (en minutes) : 3 ; 7 ; 12 ; 5 ; 9 ; 14 ; 10 ; 2. Regroupe-les en classes [0 ; 5[, [5 ; 10[, [10
    ; 15[ et donne l''effectif de chaque classe.'
  solution: '[0 ; 5[ : 3 et 2, effectif 2. [5 ; 10[ : 7, 5 et 9, effectif 3. [10 ; 15[ : 12, 14 et 10, effectif 3. Total 8.
    On trace trois rectangles accolés de même largeur, de hauteurs 2, 3 et 3.'
exercices:
- id: amplitude-des-classes
  type: nombre
  difficulte: 1
  enonce: Un histogramme représente les tailles de 40 élèves, en cm. Ses classes sont [140 ; 150[, [150 ; 160[, [160 ; 170[,
    [170 ; 180[ et [180 ; 190[. Quelle est l'amplitude de chaque classe, en cm ?
  reponse:
    valeur: 10
    forme: libre
  indices:
    relance: Que représente l'amplitude d'une classe ?
    methode: L'amplitude est la différence entre la borne supérieure et la borne inférieure d'une classe.
    etape: Prends la première classe et calcule 150 − 140.
  pieges:
  - si:
      valeur: 140
    relance: 140 est une borne de la première classe. L'amplitude, c'est l'écart entre les deux bornes d'une même classe.
  - si:
      valeur: 50
    relance: Tu as calculé l'écart entre la plus petite et la plus grande borne de tout l'histogramme. On demande l'amplitude
      d'une seule classe.
  solution: '150 − 140 = 10 : chaque classe a une amplitude de 10 cm.'
- id: au-moins-170
  type: nombre
  difficulte: 2
  enonce: 'Histogramme des tailles de 40 élèves (en cm). Hauteurs des rectangles : [140 ; 150[ : 2 élèves ; [150 ; 160[ :
    12 élèves ; [160 ; 170[ : 15 élèves ; [170 ; 180[ : 8 élèves ; [180 ; 190[ : 3 élèves. Combien d''élèves mesurent au moins
    170 cm ?'
  reponse:
    valeur: 11
    forme: entier
  indices:
    relance: « Au moins 170 cm », c'est 170 cm ou plus. Quelles classes sont concernées ?
    methode: Repère toutes les classes dont les valeurs sont supérieures ou égales à 170, puis additionne leurs effectifs.
    etape: La classe [170 ; 180[ compte 8 élèves. Y a-t-il une autre classe au-dessus ?
  pieges:
  - si:
      valeur: 8
    relance: Tu as compté la classe [170 ; 180[. Les élèves de 180 cm ou plus mesurent-ils aussi au moins 170 cm ?
  - si:
      valeur: 26
    relance: La classe [160 ; 170[ contient des élèves de moins de 170 cm. Faut-il la compter ?
  - si:
      diagnostic: valeur_fausse
    relance: Liste les classes qui commencent à 170 ou plus, puis additionne seulement leurs hauteurs.
  solution: 'Classes [170 ; 180[ et [180 ; 190[ : 8 + 3 = 11. Donc 11 élèves mesurent au moins 170 cm.'
- id: pourcentage-moins-de-160
  type: nombre
  difficulte: 2
  enonce: 'Même histogramme des tailles de 40 élèves : [140 ; 150[ : 2 ; [150 ; 160[ : 12 ; [160 ; 170[ : 15 ; [170 ; 180[
    : 8 ; [180 ; 190[ : 3. Quel pourcentage des élèves mesure moins de 160 cm ? Écris seulement le nombre, sans le symbole
    %.'
  reponse:
    valeur: 35
    forme: libre
  indices:
    relance: Combien d'élèves mesurent moins de 160 cm ? Quelles classes faut-il additionner ?
    methode: Additionne les effectifs des classes concernées, divise par l'effectif total, puis multiplie par 100.
    etape: Les classes [140 ; 150[ et [150 ; 160[ sont concernées. Additionne leurs effectifs, puis divise par 40.
  pieges:
  - si:
      valeur: 14
    relance: Ce nombre est un effectif. On demande un pourcentage de l'effectif total.
  - si:
      valeur: 0.35
    relance: Ce nombre est la fréquence en écriture décimale. Pour un pourcentage, que faut-il faire ensuite ?
  - si:
      valeur: 30
    relance: Tu as pris seulement la classe [150 ; 160[. Les élèves de la classe [140 ; 150[ mesurent-ils moins de 160 cm
      ?
  solution: 2 + 12 = 14 élèves mesurent moins de 160 cm ; 14 ÷ 40 = 0,35, et 0,35 × 100 = 35. Donc 35 % des élèves mesurent
    moins de 160 cm.
- id: lire-un-histogramme
  type: choix
  difficulte: 2
  enonce: 'Même histogramme des tailles de 40 élèves : [140 ; 150[ : 2 ; [150 ; 160[ : 12 ; [160 ; 170[ : 15 ; [170 ; 180[
    : 8 ; [180 ; 190[ : 3. Quelles affirmations sont sûrement vraies ?'
  reponse:
    options:
    - id: a
      texte: Aucun élève ne mesure 190 cm ou plus.
    - id: b
      texte: Au moins un élève mesure exactement 140 cm.
    - id: c
      texte: Plus de la moitié des élèves mesure moins de 170 cm.
    - id: d
      texte: Les 15 élèves de la classe [160 ; 170[ mesurent tous 165 cm.
    bonnes:
    - a
    - c
  indices:
    relance: Sur un histogramme, connais-tu la taille exacte de chaque élève, ou seulement le nombre d'élèves par classe ?
    methode: Pour chaque affirmation, demande-toi si l'histogramme permet d'en être sûr. Pour c, additionne les effectifs
      utiles et compare à la moitié de 40.
    etape: 'Pour c : les élèves de moins de 170 cm sont dans les trois premières classes. Additionne leurs effectifs.'
  pieges:
  - si:
      contient:
      - b
    relance: La classe [140 ; 150[ contient 2 élèves. Sais-tu quelle taille exacte ils ont ?
  - si:
      contient:
      - d
    relance: 165 cm est le milieu de la classe. Mais l'histogramme dit-il comment les tailles sont réparties dans la classe
      ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation sûre, mais il y en a une autre. Relis celles que tu n'as pas choisies.
  solution: 'a est vraie : la dernière classe s''arrête avant 190 cm. b n''est pas sûre : on ne connaît pas les tailles exactes.
    c est vraie : 2 + 12 + 15 = 29 élèves, plus que 20. d n''est pas sûre : on sait seulement que ces 15 élèves mesurent entre
    160 cm et 170 cm (170 exclu).'
- id: ranger-dans-les-classes
  type: association
  difficulte: 2
  enonce: 'Temps de course de 12 élèves, en minutes : 27 ; 31 ; 22 ; 30 ; 38 ; 25 ; 34 ; 29 ; 24 ; 33 ; 26 ; 28. Pour tracer
    l''histogramme, associe chaque classe à son effectif.'
  reponse:
    gauche:
    - id: a
      texte: '[20 ; 25['
    - id: b
      texte: '[25 ; 30['
    - id: c
      texte: '[30 ; 35['
    - id: d
      texte: '[35 ; 40['
    droite:
    - id: n1
      texte: 1 élève
    - id: n2
      texte: 2 élèves
    - id: n3
      texte: 3 élèves
    - id: n4
      texte: 4 élèves
    - id: n5
      texte: 5 élèves
    paires:
      a: n2
      b: n5
      c: n4
      d: n1
  indices:
    relance: 'Dans quelle classe range-t-on un temps de 25 minutes : [20 ; 25[ ou [25 ; 30[ ?'
    methode: Prends les temps un par un et fais un trait dans la bonne classe. Le crochet tourné vers l'extérieur veut dire
      que la borne est exclue.
    etape: 27 va dans [25 ; 30[, 31 dans [30 ; 35[, 22 dans [20 ; 25[. Continue avec les autres temps, puis vérifie que le
      total fait 12.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule classe est fausse. Regarde bien les temps qui tombent pile sur une borne, comme 25 ou 30.
  - si:
      diagnostic: associations_fausses
    relance: Recompte en faisant un trait par temps, et vérifie que la somme de tes effectifs fait bien 12.
  solution: '[20 ; 25[ : 22 et 24, soit 2 élèves. [25 ; 30[ : 27, 25, 29, 26 et 28, soit 5 élèves. [30 ; 35[ : 31, 30, 34
    et 33, soit 4 élèves. [35 ; 40[ : 38, soit 1 élève. Total : 2 + 5 + 4 + 1 = 12.'
- id: decrire-la-construction
  type: ouverte
  difficulte: 3
  enonce: 'Masses de 20 colis, regroupées en classes : [0 ; 2[ kg : 6 colis ; [2 ; 4[ kg : 9 colis ; [4 ; 6[ kg : 4 colis
    ; [6 ; 8[ kg : 1 colis. Explique précisément comment tracer l''histogramme de cette série : axes, rectangles, hauteurs.'
  criteres:
  - L'élève place les classes (masses en kg) sur l'axe horizontal et les effectifs (nombre de colis) sur l'axe vertical, avec
    une graduation régulière.
  - L'élève trace quatre rectangles accolés, de même largeur (les classes ont toutes une amplitude de 2 kg).
  - Les hauteurs des rectangles sont 6, 9, 4 et 1, dans l'ordre des classes.
  indices:
    relance: Qu'est-ce qu'on met sur l'axe horizontal, et qu'est-ce qu'on met sur l'axe vertical ?
    methode: Un rectangle par classe, collé au suivant ; toutes les classes ont la même amplitude, donc la même largeur ;
      la hauteur donne l'effectif.
    etape: Le premier rectangle va de 0 à 2 kg sur l'axe horizontal et monte jusqu'à 6 colis. Décris les trois autres.
  solution: 'Axe horizontal : masses de 0 à 8 kg, graduées de 2 en 2. Axe vertical : nombre de colis, gradué de 1 en 1 jusqu''à
    9 au moins. On trace quatre rectangles accolés de même largeur : de 0 à 2 kg, hauteur 6 ; de 2 à 4 kg, hauteur 9 ; de
    4 à 6 kg, hauteur 4 ; de 6 à 8 kg, hauteur 1. On donne un titre et on nomme les axes.'
- id: frequence-d-une-classe
  type: nombre
  difficulte: 2
  enonce: Un histogramme représente les âges de 50 clients d'un magasin. La classe [20 ; 30[ a un rectangle de hauteur 18.
    Quel pourcentage des clients a un âge dans cette classe ? Écris seulement le nombre, sans le symbole %.
  reponse:
    valeur: 36
    forme: libre
  indices:
    relance: Combien de clients y a-t-il en tout, et combien dans la classe [20 ; 30[ ?
    methode: Divise l'effectif de la classe par l'effectif total, puis multiplie par 100.
    etape: Commence par la division 18 ÷ 50, écrite en nombre décimal. Ensuite, comment passe-t-on d'une fréquence décimale
      à un pourcentage ?
  pieges:
  - si:
      valeur: 18
    relance: Ce nombre est l'effectif de la classe. On demande un pourcentage de l'effectif total.
  - si:
      valeur: 0.36
    relance: Ce nombre est la fréquence en écriture décimale. Pour un pourcentage, que faut-il faire ensuite ?
  - si:
      diagnostic: valeur_fausse
    relance: Divise l'effectif de la classe par l'effectif total (50), puis multiplie par 100.
  solution: 18 ÷ 50 = 0,36 et 0,36 × 100 = 36. Donc 36 % des clients ont un âge dans la classe [20 ; 30[.
- id: centre-de-classe
  type: nombre
  difficulte: 1
  enonce: Sur un histogramme des tailles, une classe est [150 ; 160[. Quel est le centre de cette classe (le milieu, en cm)
    ? Écris seulement le nombre.
  reponse:
    valeur: 155
    forme: libre
  indices:
    relance: Le centre d'une classe est-il au bord ou au milieu de l'intervalle ?
    methode: 'Le milieu de deux nombres est leur moyenne : on les additionne, puis on divise par 2.'
    etape: Additionne les deux bornes de la classe, puis divise par 2.
  pieges:
  - si:
      valeur: 10
    relance: 10 est l'amplitude de la classe (l'écart entre les bornes). On demande son milieu.
  - si:
      valeur: 310
    relance: Tu as additionné les deux bornes, mais il reste une étape pour trouver le milieu.
  solution: (150 + 160) ÷ 2 = 310 ÷ 2 = 155. Le centre de la classe est 155 cm.
