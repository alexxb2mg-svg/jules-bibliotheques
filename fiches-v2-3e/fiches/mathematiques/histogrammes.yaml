# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: histogrammes
version: 1
etat: verifiee
declencheurs:
- barres collées
- rectangles accolés
- tranches de taille
- regroupées par intervalles
- graphique en tranches
prerequis:
- effectifs-et-frequences
essentiel: 'Quand une série a beaucoup de valeurs différentes, on les regroupe en classes : des intervalles de même amplitude.

  La classe [150 ; 160[ contient les valeurs t telles que 150 ≤ t < 160 : 150 est dedans, 160 n''y est pas (il va dans la
  classe suivante).

  L''amplitude d''une classe est la différence entre ses deux bornes : ici 160 − 150 = 10.


  Un histogramme représente ces classes par des rectangles accolés (sans espace entre eux), tous de même largeur.

  Quand les classes ont la même amplitude, la hauteur de chaque rectangle est proportionnelle à l''effectif de la classe.


  Sur un histogramme, on lit des effectifs de classes, pas des valeurs exactes : on sait combien de valeurs sont dans une
  classe, pas lesquelles.

  '
methode:
- Lire l'axe horizontal (les classes, avec leur unité) et l'axe vertical (les effectifs).
- 'Pour un effectif de classe : lire la hauteur du rectangle.'
- 'Pour « au moins » ou « moins de » : additionner les effectifs des classes concernées, sans en oublier.'
- 'Pour construire : ranger chaque valeur dans sa classe (attention aux valeurs égales à une borne), compter, puis tracer
  des rectangles accolés de même largeur et de hauteur égale à l''effectif.'
vocabulaire:
- terme: classe
  definition: Intervalle de valeurs, par exemple [150 ; 160[.
- terme: amplitude
  definition: Différence entre la borne supérieure et la borne inférieure d'une classe.
- terme: histogramme
  definition: Graphique fait de rectangles accolés, un par classe, dont la hauteur donne l'effectif.
erreurs_frequentes:
- Ranger une valeur égale à la borne supérieure dans la mauvaise classe (160 va dans [160 ; 170[, pas dans [150 ; 160[).
- Laisser des espaces entre les rectangles, comme dans un diagramme en bâtons.
- Croire qu'on connaît les valeurs exactes à l'intérieur d'une classe.
- Oublier une classe quand on additionne les effectifs pour « au moins » ou « moins de ».
exemple:
  enonce: 'Durées d''appel (en minutes) : 3 ; 7 ; 12 ; 5 ; 9 ; 14 ; 10 ; 2. Regroupe-les en classes [0 ; 5[, [5 ; 10[, [10
    ; 15[ et donne l''effectif de chaque classe.'
  solution: '[0 ; 5[ : 3 et 2, effectif 2. [5 ; 10[ : 7, 5 et 9, effectif 3. [10 ; 15[ : 12, 14 et 10, effectif 3. Total 8.
    On trace trois rectangles accolés de même largeur, de hauteurs 2, 3 et 3.'
exercices:
- id: amplitude-des-classes
  type: nombre
  difficulte: 1
  enonce: Un histogramme représente les tailles de 40 élèves, en cm. Ses classes sont [140 ; 150[, [150 ; 160[, [160 ; 170[,
    [170 ; 180[ et [180 ; 190[. Quelle est l'amplitude de chaque classe, en cm ?
  reponse:
    valeur: 10
    forme: libre
  indices:
    relance: Que représente l'amplitude d'une classe ?
    methode: L'amplitude est la différence entre la borne supérieure et la borne inférieure d'une classe.
    etape: Prends la première classe et calcule 150 − 140.
  pieges:
  - si:
      valeur: 140
    relance: 140 est une borne de la première classe. L'amplitude, c'est l'écart entre les deux bornes d'une même classe.
  - si:
      valeur: 50
    relance: Tu as calculé l'écart entre la plus petite et la plus grande borne de tout l'histogramme. On demande l'amplitude
      d'une seule classe.
  solution: '150 − 140 = 10 : chaque classe a une amplitude de 10 cm.'
- id: au-moins-170
  type: nombre
  difficulte: 2
  enonce: 'Histogramme des tailles de 40 élèves (en cm). Hauteurs des rectangles : [140 ; 150[ : 2 élèves ; [150 ; 160[ :
    12 élèves ; [160 ; 170[ : 15 élèves ; [170 ; 180[ : 8 élèves ; [180 ; 190[ : 3 élèves. Combien d''élèves mesurent au moins
    170 cm ?'
  reponse:
    valeur: 11
    forme: entier
  indices:
    relance: « Au moins 170 cm », c'est 170 cm ou plus. Quelles classes sont concernées ?
    methode: Repère toutes les classes dont les valeurs sont supérieures ou égales à 170, puis additionne leurs effectifs.
    etape: La classe [170 ; 180[ compte 8 élèves. Y a-t-il une autre classe au-dessus ?
  pieges:
  - si:
      valeur: 8
    relance: Tu as compté la classe [170 ; 180[. Les élèves de 180 cm ou plus mesurent-ils aussi au moins 170 cm ?
  - si:
      valeur: 26
    relance: La classe [160 ; 170[ contient des élèves de moins de 170 cm. Faut-il la compter ?
  - si:
      diagnostic: valeur_fausse
    relance: Liste les classes qui commencent à 170 ou plus, puis additionne seulement leurs hauteurs.
  solution: 'Classes [170 ; 180[ et [180 ; 190[ : 8 + 3 = 11. Donc 11 élèves mesurent au moins 170 cm.'
- id: pourcentage-moins-de-160
  type: nombre
  difficulte: 2
  enonce: 'Même histogramme des tailles de 40 élèves : [140 ; 150[ : 2 ; [150 ; 160[ : 12 ; [160 ; 170[ : 15 ; [170 ; 180[
    : 8 ; [180 ; 190[ : 3. Quel pourcentage des élèves mesure moins de 160 cm ? Écris seulement le nombre, sans le symbole
    %.'
  reponse:
    valeur: 35
    forme: libre
  indices:
    relance: Combien d'élèves mesurent moins de 160 cm ? Quelles classes faut-il additionner ?
    methode: Additionne les effectifs des classes concernées, divise par l'effectif total, puis multiplie par 100.
    etape: Les classes [140 ; 150[ et [150 ; 160[ sont concernées. Additionne leurs effectifs, puis divise par 40.
  pieges:
  - si:
      valeur: 14
    relance: Ce nombre est un effectif. On demande un pourcentage de l'effectif total.
  - si:
      valeur: 0.35
    relance: Ce nombre est la fréquence en écriture décimale. Pour un pourcentage, que faut-il faire ensuite ?
  - si:
      valeur: 30
    relance: Tu as pris seulement la classe [150 ; 160[. Les élèves de la classe [140 ; 150[ mesurent-ils moins de 160 cm
      ?
  solution: 2 + 12 = 14 élèves mesurent moins de 160 cm ; 14 ÷ 40 = 0,35, et 0,35 × 100 = 35. Donc 35 % des élèves mesurent
    moins de 160 cm.
- id: lire-un-histogramme
  type: choix
  difficulte: 2
  enonce: 'Même histogramme des tailles de 40 élèves : [140 ; 150[ : 2 ; [150 ; 160[ : 12 ; [160 ; 170[ : 15 ; [170 ; 180[
    : 8 ; [180 ; 190[ : 3. Quelles affirmations sont sûrement vraies ?'
  reponse:
    options:
    - id: a
      texte: Aucun élève ne mesure 190 cm ou plus.
    - id: b
      texte: Au moins un élève mesure exactement 140 cm.
    - id: c
      texte: Plus de la moitié des élèves mesure moins de 170 cm.
    - id: d
      texte: Les 15 élèves de la classe [160 ; 170[ mesurent tous 165 cm.
    bonnes:
    - a
    - c
  indices:
    relance: Sur un histogramme, connais-tu la taille exacte de chaque élève, ou seulement le nombre d'élèves par classe ?
    methode: Pour chaque affirmation, demande-toi si l'histogramme permet d'en être sûr. Pour c, additionne les effectifs
      utiles et compare à la moitié de 40.
    etape: 'Pour c : les élèves de moins de 170 cm sont dans les trois premières classes. Additionne leurs effectifs.'
  pieges:
  - si:
      contient:
      - b
    relance: La classe [140 ; 150[ contient 2 élèves. Sais-tu quelle taille exacte ils ont ?
  - si:
      contient:
      - d
    relance: 165 cm est le milieu de la classe. Mais l'histogramme dit-il comment les tailles sont réparties dans la classe
      ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation sûre, mais il y en a une autre. Relis celles que tu n'as pas choisies.
  solution: 'a est vraie : la dernière classe s''arrête avant 190 cm. b n''est pas sûre : on ne connaît pas les tailles exactes.
    c est vraie : 2 + 12 + 15 = 29 élèves, plus que 20. d n''est pas sûre : on sait seulement que ces 15 élèves mesurent entre
    160 cm et 170 cm (170 exclu).'
- id: ranger-dans-les-classes
  type: association
  difficulte: 2
  enonce: 'Temps de course de 12 élèves, en minutes : 27 ; 31 ; 22 ; 30 ; 38 ; 25 ; 34 ; 29 ; 24 ; 33 ; 26 ; 28. Pour tracer
    l''histogramme, associe chaque classe à son effectif.'
  reponse:
    gauche:
    - id: a
      texte: '[20 ; 25['
    - id: b
      texte: '[25 ; 30['
    - id: c
      texte: '[30 ; 35['
    - id: d
      texte: '[35 ; 40['
    droite:
    - id: n1
      texte: 1 élève
    - id: n2
      texte: 2 élèves
    - id: n3
      texte: 3 élèves
    - id: n4
      texte: 4 élèves
    - id: n5
      texte: 5 élèves
    paires:
      a: n2
      b: n5
      c: n4
      d: n1
  indices:
    relance: 'Dans quelle classe range-t-on un temps de 25 minutes : [20 ; 25[ ou [25 ; 30[ ?'
    methode: Prends les temps un par un et fais un trait dans la bonne classe. Le crochet tourné vers l'extérieur veut dire
      que la borne est exclue.
    etape: 27 va dans [25 ; 30[, 31 dans [30 ; 35[, 22 dans [20 ; 25[. Continue avec les autres temps, puis vérifie que le
      total fait 12.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule classe est fausse. Regarde bien les temps qui tombent pile sur une borne, comme 25 ou 30.
  - si:
      diagnostic: associations_fausses
    relance: Recompte en faisant un trait par temps, et vérifie que la somme de tes effectifs fait bien 12.
  solution: '[20 ; 25[ : 22 et 24, soit 2 élèves. [25 ; 30[ : 27, 25, 29, 26 et 28, soit 5 élèves. [30 ; 35[ : 31, 30, 34
    et 33, soit 4 élèves. [35 ; 40[ : 38, soit 1 élève. Total : 2 + 5 + 4 + 1 = 12.'
- id: decrire-la-construction
  type: ouverte
  difficulte: 3
  enonce: 'Masses de 20 colis, regroupées en classes : [0 ; 2[ kg : 6 colis ; [2 ; 4[ kg : 9 colis ; [4 ; 6[ kg : 4 colis
    ; [6 ; 8[ kg : 1 colis. Explique précisément comment tracer l''histogramme de cette série : axes, rectangles, hauteurs.'
  criteres:
  - L'élève place les classes (masses en kg) sur l'axe horizontal et les effectifs (nombre de colis) sur l'axe vertical, avec
    une graduation régulière.
  - L'élève trace quatre rectangles accolés, de même largeur (les classes ont toutes une amplitude de 2 kg).
  - Les hauteurs des rectangles sont 6, 9, 4 et 1, dans l'ordre des classes.
  indices:
    relance: Qu'est-ce qu'on met sur l'axe horizontal, et qu'est-ce qu'on met sur l'axe vertical ?
    methode: Un rectangle par classe, collé au suivant ; toutes les classes ont la même amplitude, donc la même largeur ;
      la hauteur donne l'effectif.
    etape: Le premier rectangle va de 0 à 2 kg sur l'axe horizontal et monte jusqu'à 6 colis. Décris les trois autres.
  solution: 'Axe horizontal : masses de 0 à 8 kg, graduées de 2 en 2. Axe vertical : nombre de colis, gradué de 1 en 1 jusqu''à
    9 au moins. On trace quatre rectangles accolés de même largeur : de 0 à 2 kg, hauteur 6 ; de 2 à 4 kg, hauteur 9 ; de
    4 à 6 kg, hauteur 4 ; de 6 à 8 kg, hauteur 1. On donne un titre et on nomme les axes.'
- id: nblm-dans-un-histogramme-quelle-est-la-dispos-1
  type: choix
  difficulte: 2
  enonce: Dans un histogramme, quelle est la disposition géométrique caractéristique des rectangles représentant les différentes
    classes ?
  reponse:
    options:
    - id: o1
      texte: Des rectangles accolés sans aucun espace entre eux
    - id: o2
      texte: Des bâtons séparés par des espaces réguliers
    - id: o3
      texte: Des secteurs circulaires détachés
    - id: o4
      texte: Des points isolés reliés par une ligne brisée
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la façon dont les intervalles continus se touchent sur l'axe horizontal.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : séparer les barres par des espaces est propre aux diagrammes en bâtons pour des données isolées,
      pas aux histogrammes.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : les secteurs circulaires sont la caractéristique des diagrammes circulaires.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : une ligne brisée représente une évolution continue dans le temps, pas une répartition par classes.'
  solution: 'Des rectangles accolés sans aucun espace entre eux. C''est exact : les classes d''intervalles étant continues,
    l''histogramme est formé de rectangles accolés (ou barres collées).'
- id: nblm-lorsqu-une-serie-statistique-est-regroup-2
  type: choix
  difficulte: 2
  enonce: Lorsqu'une série statistique est regroupée par intervalles, à quelle classe appartient précisément la valeur 160
    pour la classe [150 ; 160[ ?
  reponse:
    options:
    - id: o1
      texte: À la classe suivante [160 ; 170[
    - id: o2
      texte: À la classe [150 ; 160[
    - id: o3
      texte: Aux deux classes [150 ; 160[ et [160 ; 170[ à la fois
    - id: o4
      texte: À aucune classe car c'est une valeur limite
    bonnes:
    - o1
  indices:
    relance: Observe attentivement le sens des crochets sur chaque borne de l'intervalle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : 160 est la borne supérieure exclue de [150 ; 160[, elle n''y est donc pas comptée.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : une donnée statistique appartient à une seule classe pour éviter les doublons dans l''effectif.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la valeur 160 est bien comptée dans la classe [160 ; 170[ où sa borne inférieure est incluse.'
  solution: 'À la classe suivante [160 ; 170[. C''est exact : le crochet ouvert en 160 dans [150 ; 160[ signifie que 160 est
    exclu de cette classe et va dans [160 ; 170[.'
- id: nblm-comment-calcule-t-on-l-amplitude-d-une-t-3
  type: choix
  difficulte: 2
  enonce: Comment calcule-t-on l'amplitude d'une tranche de taille telle que la classe [150 ; 160[ ?
  reponse:
    options:
    - id: o1
      texte: En faisant la différence entre la borne supérieure et la borne inférieure
    - id: o2
      texte: En additionnant la borne supérieure et la borne inférieure
    - id: o3
      texte: En divisant l'effectif de la classe par deux
    - id: o4
      texte: En multipliant la borne inférieure par la borne supérieure
    bonnes:
    - o1
  indices:
    relance: Pense au calcul permettant d'obtenir la largeur d'une tranche sur l'axe horizontal.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : additionner les bornes ne donne pas la largeur ou l''amplitude de l''intervalle.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : l''amplitude est une propriété de l''intervalle, elle ne dépend pas de l''effectif.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la multiplication des bornes ne correspond à aucune notion de largeur d''intervalle.'
  solution: 'En faisant la différence entre la borne supérieure et la borne inférieure. C''est exact : l''amplitude de la
    tranche [150 ; 160[ se calcule par 160 - 150 = 10.'
- id: nblm-dans-un-histogramme-dont-les-classes-ont-4
  type: choix
  difficulte: 2
  enonce: Dans un histogramme dont les classes ont la même amplitude, que représente directement la hauteur de chaque rectangle
    ?
  reponse:
    options:
    - id: o1
      texte: L'effectif de la classe
    - id: o2
      texte: Les valeurs exactes individuelles des données de la classe
    - id: o3
      texte: La moyenne de la série statistique
    - id: o4
      texte: L'étendue totale de la série
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui est mesuré sur l'axe vertical du graphique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : sur un histogramme, les valeurs individuelles exactes sont perdues au profit de l''effectif
      global de la classe.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la hauteur mesure le nombre de données dans la tranche, pas la moyenne de la série.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : l''étendue est la différence globale entre la plus grande et la plus petite valeur de la série.'
  solution: 'L''effectif de la classe. C''est exact : quand les tranches sont de même amplitude, la hauteur du rectangle est
    proportionnelle à l''effectif de la classe.'
- id: nblm-pour-determiner-le-nombre-d-individus-ay-5
  type: choix
  difficulte: 2
  enonce: Pour déterminer le nombre d'individus ayant 'au moins 10 ans' à partir d'un histogramme regroupé par tranches d'âge,
    quelle méthode faut-il appliquer ?
  reponse:
    options:
    - id: o1
      texte: Additionner les effectifs de toutes les classes dont la borne est supérieure ou égale à 10
    - id: o2
      texte: Lire uniquement l'effectif de la première classe contenant la valeur 10
    - id: o3
      texte: Multiplier l'effectif total par 10
    - id: o4
      texte: Soustraire 10 à l'effectif total
    bonnes:
    - o1
  indices:
    relance: Pense à combiner les effectifs de la tranche de 10 ans et de toutes les tranches supérieures.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : cela oublie les effectifs de toutes les tranches d''âge supérieures à 10 ans.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : le terme ''au moins'' demande une addition d''effectifs de tranches, pas une multiplication.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : soustraire une valeur d''âge à un nombre d''individus n''a aucun sens mathématique.'
  solution: 'Additionner les effectifs de toutes les classes dont la borne est supérieure ou égale à 10. C''est exact : ''au
    moins 10'' signifie 10 ou plus, il faut donc faire la somme des effectifs de toutes les tranches concernées.'
- id: nblm-quelles-sont-les-deux-affirmations-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations correctes concernant l'histogramme et les séries regroupées par intervalles ?
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un histogramme est un graphique constitué de rectangles accolés représentant des classes de données
    - id: o2
      texte: Une erreur fréquente consiste à croire qu'on peut connaître les valeurs exactes situées à l'intérieur d'une classe
    - id: o3
      texte: Il faut systématiquement laisser un espace vide entre les barres d'un histogramme
    - id: o4
      texte: Chaque rectangle correspond à une donnée isolée et non à un intervalle de valeurs
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les propositions qui décrivent l'allure des rectangles accolés et la spécificité des données regroupées
      par tranches.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : laisser des espaces est une erreur courante qui confond l''histogramme avec un diagramme en bâtons.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : l''histogramme sert spécifiquement à représenter des données regroupées par tranches ou intervalles.'
  solution: 'Un histogramme est un graphique constitué de rectangles accolés représentant des classes de données ; Une erreur
    fréquente consiste à croire qu''on peut connaître les valeurs exactes situées à l''intérieur d''une classe. C''est exact
    : le fait d''avoir des rectangles accolés (barres collées) traduit la continuité des classes d''intervalles.'
- id: nblm-comment-nomme-t-on-un-intervalle-de-vale-7
  type: texte_court
  difficulte: 1
  enonce: Comment nomme-t-on un intervalle de valeurs servant à regrouper les données d'une série statistique, tel que [150
    ; 160[ ?
  reponse:
    acceptees:
    - classe
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne aussi le groupe d'élèves auquel tu appartiens au collège.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'classe. C''est exact : une classe est un intervalle de valeurs utilisé pour regrouper les données dans un histogramme.'
- id: nblm-quel-nom-porte-le-graphique-en-tranches-8
  type: texte_court
  difficulte: 1
  enonce: Quel nom porte le graphique en tranches composé de rectangles accolés utilisé pour représenter des données statistiques
    regroupées par intervalles ?
  reponse:
    acceptees:
    - histogramme
    fautes_tolerees: 1
  indices:
    relance: Ce nom masculin commence par la lettre H.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'histogramme. C''est exact : l''histogramme est la représentation graphique appropriée pour les séries statistiques
    regroupées en classes.'
