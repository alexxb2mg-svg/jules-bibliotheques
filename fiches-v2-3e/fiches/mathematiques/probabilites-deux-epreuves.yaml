# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: probabilites-deux-epreuves
version: 1
etat: verifiee
declencheurs:
- lancer deux dés
- somme des deux dés
- lancer deux pièces
- deux fois de suite
- tableau à deux entrées
- tirage avec remise
prerequis:
- probabilites-experiences-simples
- fractions-irreductibles
essentiel: 'Une expérience à deux épreuves enchaîne deux expériences aléatoires : lancer deux dés, lancer une pièce deux fois,
  tirer une boule puis la remettre et en tirer une autre...

  Une issue est alors un couple de résultats : (premier résultat ; second résultat).

  L''ordre compte : avec deux pièces, (pile ; face) et (face ; pile) sont deux issues différentes.


  Pour dénombrer les issues, on fait un tableau à double entrée : les résultats de la première épreuve en lignes, ceux de
  la seconde en colonnes. Chaque case est une issue.

  Si chaque épreuve a des issues équiprobables, toutes les cases sont équiprobables :

  probabilité = nombre de cases favorables ÷ nombre total de cases.


  Exemple : avec deux dés à six faces, il y a 6 × 6 = 36 issues équiprobables.

  '
methode:
- Écrire les issues de la première épreuve en lignes et celles de la seconde en colonnes (un tableau à double entrée).
- Si deux objets se ressemblent (deux boules rouges), leur donner des noms différents (R1, R2) pour que les issues soient
  équiprobables.
- Remplir chaque case avec le résultat qui intéresse (la somme, le couple...).
- Compter les cases favorables et le nombre total de cases.
- Calculer cases favorables ÷ total, puis simplifier la fraction.
vocabulaire:
- terme: épreuve
  definition: Une des expériences aléatoires qui composent l'expérience.
- terme: tableau à double entrée
  definition: Tableau dont chaque case correspond à un couple (résultat de la première épreuve ; résultat de la seconde).
- terme: avec remise
  definition: 'On remet l''objet tiré avant le tirage suivant : la seconde épreuve se fait dans les mêmes conditions que la
    première.'
erreurs_frequentes:
- 'Oublier que l''ordre compte : compter (pile ; face) et (face ; pile) comme une seule issue.'
- Croire que toutes les sommes de deux dés (de 2 à 12) ont la même probabilité.
- Compter les couleurs au lieu des boules quand deux boules ont la même couleur.
- Utiliser la probabilité d'une seule épreuve pour répondre à une question sur les deux.
exemple:
  enonce: On lance deux fois une pièce équilibrée. Quelle est la probabilité d'obtenir deux fois face ?
  solution: 'Tableau à double entrée : lignes P, F (premier lancer) ; colonnes P, F (second lancer). Issues : (P ; P), (P
    ; F), (F ; P), (F ; F), soit 4 issues équiprobables. Une seule est favorable : P(deux faces) = 1/4.'
exercices:
- id: issues-deux-pieces
  type: nombre
  difficulte: 1
  enonce: On lance deux pièces de monnaie équilibrées, une rouge et une bleue. Chaque pièce tombe sur pile ou sur face. Combien
    y a-t-il d'issues possibles ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Obtenir pile sur la rouge et face sur la bleue, est-ce la même chose que face sur la rouge et pile sur la bleue
      ?
    methode: 'Fais un tableau à double entrée : résultats de la pièce rouge en lignes, résultats de la pièce bleue en colonnes.
      Compte les cases.'
    etape: La pièce rouge donne pile ou face. Pour chacun de ces deux résultats, la pièce bleue peut donner pile ou face.
      Écris tous les couples.
  pieges:
  - si:
      valeur: 3
    relance: 'Tu as compté « un pile et un face » une seule fois. Mais la rouge peut faire pile et la bleue face, ou l''inverse
      : ce sont deux issues.'
  - si:
      valeur: 2
    relance: Pile et face, ce sont les issues d'une seule pièce. Ici, une issue donne le résultat des deux pièces.
  solution: 'Issues : (pile ; pile), (pile ; face), (face ; pile), (face ; face). Il y a 2 × 2 = 4 issues.'
- id: somme-sept-deux-des
  type: nombre
  difficulte: 2
  enonce: On lance deux dés équilibrés à six faces et on additionne les deux nombres obtenus. Quelle est la probabilité que
    la somme soit égale à 7 ? Donne une fraction irréductible a/b.
  reponse:
    valeur: 1/6
    forme: fraction_irreductible
  indices:
    relance: Combien y a-t-il d'issues en tout quand on lance deux dés ? Sont-elles équiprobables ?
    methode: Fais un tableau à double entrée (premier dé en lignes, second dé en colonnes), écris la somme dans chaque case,
      puis compte les cases où la somme vaut 7.
    etape: Le tableau a 6 lignes et 6 colonnes. Par exemple, la case (2 ; 5) donne une somme de 7. Cherche toutes les autres.
  pieges:
  - si:
      valeur: 1/11
    relance: Les sommes vont de 2 à 12, mais elles n'ont pas toutes la même probabilité. Compte les cases du tableau qui donnent
      7.
  - si:
      valeur: 1/36
    relance: La case (2 ; 5) donne 7, mais ce n'est pas la seule. Cherche d'autres couples dont la somme fait 7.
  - si:
      valeur: 1/12
    relance: As-tu compté (2 ; 5) et (5 ; 2) comme deux issues différentes ? Dans le tableau, ce sont deux cases.
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est juste, mais elle se simplifie encore.
  - si:
      diagnostic: pas_une_fraction
    relance: Ta valeur est juste, mais on demande une fraction écrite a/b.
  solution: Il y a 6 × 6 = 36 issues équiprobables. La somme vaut 7 pour (1 ; 6), (2 ; 5), (3 ; 4), (4 ; 3), (5 ; 2), (6 ;
    1), soit 6 cases. P = 6/36 = 1/6.
- id: deux-rouges-avec-remise
  type: nombre
  difficulte: 2
  enonce: Un sac contient 2 boules rouges et 1 boule bleue. On tire une boule au hasard, on note sa couleur, on la remet dans
    le sac, puis on tire une deuxième boule. Quelle est la probabilité d'obtenir deux boules rouges ? Donne une fraction irréductible
    a/b.
  reponse:
    valeur: 4/9
    forme: fraction_irreductible
  indices:
    relance: Les deux boules rouges sont différentes, même si elles ont la même couleur. Comment les distinguer ?
    methode: Nomme les boules R1, R2 et B. Fais un tableau à double entrée (premier tirage en lignes, second en colonnes),
      puis compte les cases favorables.
    etape: Le tableau a 3 lignes (R1, R2, B) et 3 colonnes (R1, R2, B). Repère les cases où les deux boules sont rouges.
  pieges:
  - si:
      valeur: 1/4
    relance: 'Tu as pris RR, RB, BR et BB comme issues équiprobables. Mais il y a deux boules rouges et une seule bleue :
      nomme-les R1, R2 et B.'
  - si:
      valeur: 2/3
    relance: C'est la probabilité de tirer une rouge au premier tirage seulement. On veut deux rouges, aux deux tirages.
  - si:
      valeur: 1/3
    relance: 'Compte à nouveau les cases favorables : (R1 ; R2) est-elle la seule ? Et (R1 ; R1), possible puisqu''on remet
      la boule ?'
  - si:
      diagnostic: pas_une_fraction
    relance: On demande une fraction écrite a/b.
  solution: 'Boules R1, R2, B : le tableau a 3 × 3 = 9 cases équiprobables. Cases favorables : (R1 ; R1), (R1 ; R2), (R2 ;
    R1), (R2 ; R2), soit 4 cases. P(deux rouges) = 4/9.'
- id: produit-pair-deux-des
  type: nombre
  difficulte: 3
  enonce: On lance deux dés équilibrés à six faces et on multiplie les deux nombres obtenus. Quelle est la probabilité que
    le produit soit pair ? Donne une fraction irréductible a/b.
  reponse:
    valeur: 3/4
    forme: fraction_irreductible
  indices:
    relance: Quand un produit de deux nombres est-il impair ?
    methode: Fais le tableau des produits, ou compte d'abord les cases où le produit est impair, puis utilise l'événement
      contraire.
    etape: 'Un produit est impair seulement si les deux dés sont impairs. Chaque dé a trois faces impaires : compte ces cases
      dans le tableau de 36 cases.'
  pieges:
  - si:
      valeur: 1/4
    relance: Tu as trouvé la probabilité que le produit soit impair. On demande celle de l'événement contraire.
  - si:
      valeur: 1/2
    relance: Un produit est pair dès qu'un des deux nombres est pair. Est-ce vraiment une chance sur deux ? Compte les cases.
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est juste, mais elle se simplifie encore.
  - si:
      diagnostic: pas_une_fraction
    relance: Ta valeur est juste, mais on demande une fraction écrite a/b.
  solution: '36 issues équiprobables. Produit impair : les deux dés impairs, soit 3 × 3 = 9 cases. Produit pair : 36 − 9 =
    27 cases. P = 27/36 = 3/4.'
- id: vrai-faux-deux-des
  type: choix
  difficulte: 2
  enonce: On lance deux dés équilibrés à six faces et on regarde la somme. Quelles affirmations sont vraies ?
  reponse:
    options:
    - id: a
      texte: Il y a 36 issues équiprobables.
    - id: b
      texte: La somme 7 est la plus probable.
    - id: c
      texte: Toutes les sommes de 2 à 12 ont la même probabilité.
    - id: d
      texte: Obtenir 1 avec le premier dé et 2 avec le second, c'est la même issue qu'obtenir 2 avec le premier et 1 avec
        le second.
    bonnes:
    - a
    - b
  indices:
    relance: Combien de cases a le tableau à double entrée des deux dés ? Toutes les sommes y apparaissent-elles le même nombre
      de fois ?
    methode: Construis le tableau des sommes, puis compte combien de cases donnent chaque somme.
    etape: La somme 2 n'apparaît que dans la case (1 ; 1). Combien de cases donnent la somme 7 ?
  pieges:
  - si:
      contient:
      - c
    relance: La somme 2 ne s'obtient que d'une façon. Et la somme 7 ? Compare.
  - si:
      contient:
      - d
    relance: Dans le tableau, (1 ; 2) et (2 ; 1) sont-elles dans la même case ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation vraie, mais il y en a une autre. Regarde combien de cases donne chaque somme.
  solution: 'a est vraie : 6 × 6 = 36 cases équiprobables. b est vraie : 7 apparaît dans 6 cases, plus que toute autre somme.
    c est fausse : 2 n''apparaît qu''une fois. d est fausse : (1 ; 2) et (2 ; 1) sont deux cases différentes du tableau.'
- id: jeu-equitable-deux-pieces
  type: ouverte
  difficulte: 3
  enonce: Zoé et Malik lancent deux pièces équilibrées. Zoé gagne si les deux pièces tombent du même côté. Malik gagne sinon.
    Malik pense que Zoé a plus de chances, car « deux piles ou deux faces, ça fait deux cas pour elle, et un seul cas pour
    moi ». Le jeu est-il équitable ? Justifie.
  criteres:
  - 'L''élève liste les 4 issues équiprobables (par un tableau à double entrée ou une liste) : (P ; P), (P ; F), (F ; P),
    (F ; F).'
  - 'L''élève calcule les deux probabilités : 2/4 = 1/2 pour Zoé et 2/4 = 1/2 pour Malik.'
  - 'L''élève conclut que le jeu est équitable et explique l''erreur de Malik : « un pile et un face » correspond à deux issues.'
  indices:
    relance: Combien y a-t-il d'issues en tout ? « Un pile et un face », est-ce une seule issue ?
    methode: Fais un tableau à double entrée avec les deux pièces, puis compte les cases gagnantes pour chaque joueur.
    etape: Les cases (P ; P) et (F ; F) font gagner Zoé. Quelles cases font gagner Malik ?
  solution: 'Issues équiprobables : (P ; P), (P ; F), (F ; P), (F ; F). Zoé gagne avec (P ; P) et (F ; F) : 2/4 = 1/2. Malik
    gagne avec (P ; F) et (F ; P) : 2/4 = 1/2. Le jeu est équitable. Malik s''est trompé : « un pile et un face » regroupe
    deux issues différentes.'
- id: nblm-on-lance-une-piece-de-monnaie-equilibree-1
  type: choix
  difficulte: 2
  enonce: On lance une pièce de monnaie équilibrée deux fois de suite. Quelle est la probabilité d'obtenir deux fois 'Face'
    ?
  reponse:
    options:
    - id: o1
      texte: 1/4
    - id: o2
      texte: 1/2
    - id: o3
      texte: 1/3
    - id: o4
      texte: 2/4
    bonnes:
    - o1
  indices:
    relance: Dénombre toutes les issues sous forme de couples (premier lancer ; second lancer) pour trouver le total des cas
      équiprobables.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre la probabilité d''une seule épreuve (obtenir Face sur un seul lancer) avec celle
      d''une expérience à deux épreuves.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : oublier que l''ordre compte et penser qu''il n''y a que 3 résultats possibles (2 Piles, 2 Faces,
      1 Pile et 1 Face).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : additionner les probabilités individuelles de chaque lancer au lieu de dénombrer les couples
      d''issues.'
  solution: '1/4. En lançant deux pièces ou une pièce deux fois de suite, il y a 4 issues équiprobables : (P,P), (P,F), (F,P)
    et (F,F). L''issue (F,F) représente 1 cas sur 4.'
- id: nblm-on-effectue-un-lancer-deux-des-a-6-faces-2
  type: choix
  difficulte: 2
  enonce: On effectue un lancer deux dés à 6 faces équilibrés et on s'intéresse à la somme des deux dés. Combien y a-t-il
    d'issues équiprobables au total pour cette expérience à deux épreuves ?
  reponse:
    options:
    - id: o1
      texte: '36'
    - id: o2
      texte: '11'
    - id: o3
      texte: '12'
    - id: o4
      texte: '18'
    bonnes:
    - o1
  indices:
    relance: Pense au nombre de cases d'un tableau comportant 6 lignes et 6 colonnes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : compter le nombre de sommes possibles (de 2 à 12), sans voir qu''elles ne sont pas équiprobables.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : additionner 6 + 6 au lieu de multiplier les possibilités de chaque épreuve.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : multiplier 6 par 3 ou mal appliquer le dénombrement en tableau.'
  solution: 36. Chaque dé possède 6 faces, donc l'expérience comporte 6 × 6 = 36 issues équiprobables représentées par des
    couples.
- id: nblm-lors-du-lancer-deux-des-a-6-faces-quelle-3
  type: choix
  difficulte: 2
  enonce: Lors du lancer deux dés à 6 faces, quelle est la probabilité d'obtenir une somme des deux dés égale à 7 ?
  reponse:
    options:
    - id: o1
      texte: 1/6
    - id: o2
      texte: 1/11
    - id: o3
      texte: 7/36
    - id: o4
      texte: 1/36
    bonnes:
    - o1
  indices:
    relance: Utilise la grille à double entrée pour repérer tous les couples dont l'addition des deux faces donne 7.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : croire à tort que les 11 sommes possibles (de 2 à 12) sont équiprobables.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : prendre la valeur de la somme recherchée (7) comme nombre de cas favorables.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : penser qu''il n''existe qu''un seul couple donnant la somme 7.'
  solution: '1/6. Il y a 6 couples favorables sur 36 issues équiprobables : (1,6), (2,5), (3,4), (4,3), (5,2) et (6,1). La
    probabilité est donc 6/36 = 1/6.'
- id: nblm-dans-une-experience-a-deux-epreuves-avec-4
  type: choix
  difficulte: 2
  enonce: Dans une expérience à deux épreuves avec un tirage avec remise de deux boules deux fois de suite, que garantit le
    terme « avec remise » ?
  reponse:
    options:
    - id: o1
      texte: La seconde épreuve se déroule exactement dans les mêmes conditions que la première
    - id: o2
      texte: La seconde épreuve comporte obligatoirement une boule de moins
    - id: o3
      texte: Le nombre total d'issues passe de 9 à 6
    - id: o4
      texte: La première boule tirée ne peut plus être tirée au second tour
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'état de l'urne au moment d'effectuer le second tirage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre un tirage avec remise et un tirage sans remise.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : penser que le fait de remettre une boule réduit le nombre d''issues équiprobables.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : inverser la définition du tirage avec remise.'
  solution: La seconde épreuve se déroule exactement dans les mêmes conditions que la première. Remettre l'objet tiré dans
    l'urne permet de conserver la même composition et les mêmes probabilités pour la deuxième épreuve.
- id: nblm-une-urne-contient-1-boule-bleue-et-2-bou-5
  type: choix
  difficulte: 2
  enonce: Une urne contient 1 boule bleue et 2 boules violettes. On tire deux fois de suite et avec remise une boule. Quelle
    est la probabilité de tirer deux boules violettes ?
  reponse:
    options:
    - id: o1
      texte: 4/9
    - id: o2
      texte: 2/3
    - id: o3
      texte: 2/9
    - id: o4
      texte: 1/3
    bonnes:
    - o1
  indices:
    relance: Donne des noms distincts aux boules violettes (V1 et V2) dans un tableau à 9 cases.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : donner la probabilité de tirer une boule violette lors d''un seul tirage.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : multiplier simplement le nombre de boules violettes par le nombre d''épreuves sans dénombrer
      toutes les combinaisons.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ne pas distinguer les deux boules violettes entre elles et compter les couleurs au lieu des
      boules.'
  solution: 4/9. En nommant les boules B, V1, V2, le tableau à deux entrées compte 3 × 3 = 9 cases équiprobables, dont 4 contiennent
    deux boules violettes (V1,V1 ; V1,V2 ; V2,V1 ; V2,V2).
- id: nblm-quelles-affirmations-sont-vraies-concern-6
  type: choix
  difficulte: 3
  enonce: Quelles affirmations sont vraies concernant une expérience aléatoire à deux épreuves comme le lancer de deux pièces
    ou de deux dés ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: 'L''ordre des résultats compte : l''issue (Pile, Face) est distincte de (Face, Pile)'
    - id: o2
      texte: Un tableau à deux entrées permet de dénombrer l'ensemble des issues équiprobables
    - id: o3
      texte: Toutes les sommes obtenues en lançant deux dés ont la même probabilité
    - id: o4
      texte: Un tirage sans remise conserve la même composition d'urne pour la seconde épreuve
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux propriétés des couples d'issues et à l'outil recommandé pour lister les combinaisons.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : oublier que certaines sommes s''obtiennent avec plus de couples que d''autres.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre le tirage sans remise avec le tirage avec remise.'
  solution: 'L''ordre des résultats compte : l''issue (Pile, Face) est distincte de (Face, Pile) ; Un tableau à deux entrées
    permet de dénombrer l''ensemble des issues équiprobables. Chaque issue est un couple (1er résultat ; 2d résultat), ainsi
    l''ordre distingue deux événements différents.'
- id: nblm-pour-denombrer-l-ensemble-des-issues-d-u-7
  type: texte_court
  difficulte: 1
  enonce: Pour dénombrer l'ensemble des issues d'une expérience à deux épreuves au programme de 3e, on construit un tableau
    à deux ________.
  reponse:
    acceptees:
    - entrées
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne les accès par lignes et colonnes d'une grille de dénombrement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: entrées. Le tableau à deux entrées (ou à double entrée) est l'outil officiel du programme de 3e pour représenter
    les issues d'une expérience à deux épreuves.
- id: nblm-lors-d-un-lancer-deux-des-a-6-faces-equi-8
  type: texte_court
  difficulte: 1
  enonce: Lors d'un lancer deux dés à 6 faces équiprobables, le nombre total d'issues possibles est égal à ________.
  reponse:
    acceptees:
    - '36'
    fautes_tolerees: 1
  indices:
    relance: Effectue le produit du nombre de faces du premier dé par le nombre de faces du second dé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 36. Chaque dé possédant 6 faces, le nombre total d'issues est obtenu en calculant 6 × 6 = 36.
