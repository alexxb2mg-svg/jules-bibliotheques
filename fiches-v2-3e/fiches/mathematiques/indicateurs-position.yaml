# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: indicateurs-position
version: 2
etat: verifiee
declencheurs:
- valeur du milieu
- moyenne pondérée
- moitié des notes
- calculer ma moyenne
- ranger les valeurs dans l'ordre
- moyenne et médiane
- partager en deux groupes
- effectifs cumulés
prerequis:
- 4e-diagrammes-mediane
- calcul-nombres-rationnels
essentiel: 'Les indicateurs de position résument où se situent les valeurs d''une série statistique.


  La moyenne = somme de toutes les valeurs ÷ nombre de valeurs.

  Avec un tableau d''effectifs, on multiplie chaque valeur par son effectif, on additionne, puis on divise par l''effectif
  total (moyenne pondérée).


  La médiane partage la série rangée dans l''ordre croissant en deux groupes de même effectif : au moins la moitié des valeurs
  sont inférieures ou égales à la médiane, au moins la moitié sont supérieures ou égales.

  Nombre impair n de valeurs : la médiane est la valeur de rang (n + 1) ÷ 2.

  Nombre pair n de valeurs : c''est la moyenne des valeurs de rang n ÷ 2 et n ÷ 2 + 1.

  Exemple : 3 ; 5 ; 9 ; 12 ; 20 ; 30. La médiane est (9 + 12) ÷ 2 = 10,5.


  Dans un tableau d''effectifs, on cumule les effectifs dans l''ordre des valeurs pour trouver la valeur du rang voulu.


  La moyenne tient compte de toutes les valeurs : une valeur très élevée la tire vers le haut. La médiane est très peu sensible
  aux valeurs extrêmes. Deux séries peuvent avoir la même moyenne et des médianes différentes.


  Interpréter, c''est faire une phrase : « la moitié des élèves met moins de 20 minutes ».


  Un tableur donne la moyenne et la médiane avec des fonctions (MOYENNE, MEDIANE).


  Au brevet, on calcule la moyenne et la médiane, puis on les compare ou on les interprète.


  Exemple rédigé : les notes 8 ; 14 ; 11 ; 17 ; 15 ont pour somme 65, donc pour moyenne 65 ÷ 5 = 13. Rangées (8 ; 11 ; 14
  ; 15 ; 17), la médiane est la 3e valeur : 14. Ici la moyenne et la médiane sont différentes, et c''est normal.

  '
methode:
- 'Pour la moyenne : additionner toutes les valeurs (ou les produits valeur × effectif), puis diviser par le nombre total
  de valeurs.'
- 'Pour la médiane : ranger d''abord les valeurs dans l''ordre croissant, en gardant les valeurs répétées.'
- Compter les valeurs (n). Si n est impair, la médiane est la valeur de rang (n + 1) ÷ 2.
- Si n est pair, la médiane est la moyenne des valeurs de rangs n ÷ 2 et n ÷ 2 + 1.
- Dans un tableau d'effectifs, cumuler les effectifs pour trouver la valeur du rang cherché.
- 'Interpréter avec une phrase : par exemple « la moitié des élèves a mis moins de ... minutes ».'
vocabulaire:
- terme: moyenne
  definition: Somme des valeurs divisée par le nombre de valeurs.
- terme: médiane
  definition: Valeur qui partage la série rangée en deux groupes de même effectif.
- terme: moyenne pondérée
  definition: 'Moyenne calculée avec un tableau d''effectifs : chaque valeur est multipliée par son effectif.'
- terme: effectif total
  definition: Nombre total de valeurs de la série.
- terme: rang
  definition: La place d'une valeur dans la série rangée dans l'ordre croissant.
- terme: valeur extrême
  definition: La plus petite ou la plus grande valeur de la série.
- terme: indicateur de position
  definition: Un nombre, comme la moyenne ou la médiane, qui résume où se situent les valeurs de la série.
erreurs_frequentes:
- Oublier de diviser la somme par le nombre de valeurs.
- Chercher la médiane sans avoir rangé les valeurs dans l'ordre.
- Dans un tableau d'effectifs, faire la moyenne des valeurs sans tenir compte des effectifs.
- Avec un nombre pair de valeurs, prendre une seule des deux valeurs du milieu.
- Confondre le rang de la médiane avec la médiane elle-même.
exemple:
  enonce: 'Voici les températures relevées à midi pendant 7 jours (en °C) : 18 ; 21 ; 17 ; 24 ; 19 ; 21 ; 20. Calcule la moyenne
    et la médiane.'
  solution: 'Somme : 18 + 21 + 17 + 24 + 19 + 21 + 20 = 140, et 140 ÷ 7 = 20. La moyenne est 20 °C. Rangées : 17 ; 18 ; 19
    ; 20 ; 21 ; 21 ; 24. Il y a 7 valeurs, la médiane est la 4e : 20 °C.'
exercices:
- id: moyenne-cinq-notes
  type: nombre
  difficulte: 1
  enonce: 'Camille a obtenu ces notes sur 20 ce trimestre : 8 ; 14 ; 11 ; 17 ; 15. Quelle est sa moyenne ?'
  reponse:
    valeur: 13
    forme: libre
  indices:
    relance: Pour une moyenne, que fais-tu d'abord avec toutes les notes ?
    methode: Additionne les cinq notes, puis divise la somme par le nombre de notes.
    etape: 'Commence : 8 + 14 = 22. Ajoute ensuite les trois autres notes, puis divise par 5.'
  pieges:
  - si:
      valeur: 65
    relance: 'Tu as bien additionné les notes. Il reste une étape : par combien faut-il diviser cette somme ?'
  - si:
      valeur: 14
    relance: 'Ce nombre est la valeur du milieu quand on range les notes : c''est la médiane, pas la moyenne. Refais le calcul
      de la moyenne.'
  - si:
      valeur: 11
    relance: Tu as pris la note placée au milieu de la liste. Pour la moyenne, il faut utiliser toutes les notes.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta somme en additionnant les notes une par une, puis refais la division.
  solution: 8 + 14 + 11 + 17 + 15 = 65 ; 65 ÷ 5 = 13. La moyenne de Camille est 13 sur 20.
- id: rang-de-la-mediane
  type: nombre
  difficulte: 1
  enonce: Une série contient 15 valeurs rangées dans l'ordre croissant. À quel rang se trouve la médiane ? Réponds par un
    nombre entier.
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: La médiane partage la série en deux groupes. Combien de valeurs doit-il y avoir avant elle, et combien après
      ?
    methode: 'Avec un nombre impair de valeurs, la médiane est la valeur du milieu : il y a autant de valeurs avant qu''après
      elle.'
    etape: 'Mets la médiane de côté : il reste 14 valeurs, à partager en deux groupes égaux, un avant et un après.'
  pieges:
  - si:
      valeur: 7.5
    relance: Un rang est un nombre entier. Combien de valeurs mets-tu avant la médiane, et à quel rang arrive-t-elle ensuite
      ?
  - si:
      valeur: 7
    relance: S'il y a 7 valeurs avant la médiane, quel est le rang de la médiane elle-même ?
  solution: '15 = 7 + 1 + 7 : il y a 7 valeurs avant la médiane et 7 après. La médiane est donc la valeur de rang 8.'
- id: mediane-nombre-pair
  type: nombre
  difficulte: 2
  enonce: 'Huit élèves ont noté leur temps de trajet jusqu''au collège, en minutes : 12 ; 25 ; 8 ; 18 ; 30 ; 15 ; 22 ; 10.
    Quelle est la médiane de ces temps (en minutes) ?'
  reponse:
    valeur: 16.5
    forme: libre
  indices:
    relance: As-tu rangé les temps dans l'ordre croissant avant de chercher le milieu ?
    methode: Range les 8 valeurs. Avec un nombre pair de valeurs, la médiane est la moyenne des deux valeurs du milieu.
    etape: 'Liste rangée : 8 ; 10 ; 12 ; 15 ; 18 ; 22 ; 25 ; 30. Repère maintenant la 4e et la 5e valeur.'
  pieges:
  - si:
      valeur: 24
    relance: Tu as pris les deux valeurs du milieu de la liste telle qu'elle est donnée. Range d'abord les temps dans l'ordre
      croissant.
  - si:
      valeur: 17.5
    relance: Ce nombre est la moyenne des huit temps, pas la médiane. La médiane se lit sur la liste rangée.
  - si:
      valeur: 15
    relance: 'Il y a un nombre pair de valeurs : il n''y a pas une seule valeur au milieu, mais deux. Que fais-tu avec ces
      deux valeurs ?'
  - si:
      valeur: 18
    relance: 'Il y a un nombre pair de valeurs : il n''y a pas une seule valeur au milieu, mais deux. Que fais-tu avec ces
      deux valeurs ?'
  solution: 'Rangés : 8 ; 10 ; 12 ; 15 ; 18 ; 22 ; 25 ; 30. Il y a 8 valeurs, la médiane est entre la 4e (15) et la 5e (18)
    : (15 + 18) ÷ 2 = 16,5 minutes. La moitié des élèves met moins de 16,5 minutes.'
- id: moyenne-tableau-effectifs
  type: nombre
  difficulte: 2
  enonce: 'Dans une classe de 25 élèves, on a demandé le nombre de frères et sœurs. Résultats : 0 frère ou sœur pour 6 élèves
    ; 1 pour 10 élèves ; 2 pour 6 élèves ; 3 pour 3 élèves. Calcule le nombre moyen de frères et sœurs par élève (valeur exacte,
    en écriture décimale).'
  reponse:
    valeur: 1.24
    forme: libre
  indices:
    relance: Tous les nombres de frères et sœurs n'ont pas le même effectif. Comment en tenir compte ?
    methode: Multiplie chaque valeur par son effectif, additionne ces produits, puis divise par l'effectif total.
    etape: 'Commence : 0 × 6 = 0 et 1 × 10 = 10. Fais de même pour les deux autres lignes, additionne tout, puis divise par
      l''effectif total.'
  pieges:
  - si:
      valeur: 1.5
    relance: Tu as fait la moyenne de 0, 1, 2 et 3 sans tenir compte du nombre d'élèves pour chaque valeur. Utilise les effectifs.
  - si:
      valeur: 6.25
    relance: 'Tu as calculé la moyenne des effectifs. On cherche le nombre moyen de frères et sœurs : multiplie chaque valeur
      par son effectif.'
  - si:
      valeur: 31
    relance: Tu as la somme des produits. Il reste à diviser par le nombre total d'élèves.
  solution: (0 × 6 + 1 × 10 + 2 × 6 + 3 × 3) ÷ 25 = 31 ÷ 25 = 1,24. En moyenne, un élève de la classe a 1,24 frère ou sœur.
- id: salaires-moyenne-mediane
  type: choix
  difficulte: 2
  enonce: 'Dans une petite entreprise, les six salaires mensuels sont : 1 500 € ; 1 600 € ; 1 600 € ; 1 700 € ; 1 800 € ;
    9 000 €. Quelles affirmations sont vraies ?'
  reponse:
    options:
    - id: a
      texte: La moyenne des salaires est supérieure à 2 800 €.
    - id: b
      texte: La médiane des salaires est 1 650 €.
    - id: c
      texte: La moitié des salariés gagne plus que la moyenne.
    - id: d
      texte: Si le plus haut salaire passait à 12 000 €, la médiane augmenterait.
    bonnes:
    - a
    - b
  indices:
    relance: Calcule la moyenne et la médiane avant de lire les affirmations. Laquelle des deux est tirée vers le haut par
      le salaire de 9 000 € ?
    methode: 'Moyenne : somme des six salaires ÷ 6. Médiane : six valeurs, donc moyenne des 3e et 4e valeurs rangées.'
    etape: La somme des six salaires fait 17 200 €. Divise par 6 et compare à 2 800 €, puis cherche les deux valeurs du milieu.
  pieges:
  - si:
      contient:
      - c
    relance: Combien de salariés gagnent vraiment plus que la moyenne ? Compare chaque salaire à la moyenne que tu as trouvée.
  - si:
      contient:
      - d
    relance: Si le plus haut salaire change, les deux valeurs du milieu de la liste rangée changent-elles ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation vraie, mais il y en a une autre. Vérifie les calculs de moyenne et de médiane.
  solution: 'Moyenne : 17 200 ÷ 6 ≈ 2 867 €, supérieure à 2 800 € (a vraie). Médiane : (1 600 + 1 700) ÷ 2 = 1 650 € (b vraie).
    Un seul salarié gagne plus que la moyenne (c fausse). Changer le plus haut salaire ne change pas les valeurs du milieu,
    donc pas la médiane (d fausse). Ici, la médiane décrit mieux le salaire habituel que la moyenne.'
- id: comparer-deux-joueurs
  type: ouverte
  difficulte: 3
  enonce: 'Deux joueuses de basket ont marqué ces points sur 5 matchs. Inès : 10 ; 12 ; 14 ; 12 ; 12. Maëlle : 2 ; 4 ; 30
    ; 5 ; 19. Calcule la moyenne et la médiane de chaque joueuse, puis explique laquelle marque le plus souvent beaucoup de
    points.'
  criteres:
  - L'élève calcule correctement les deux moyennes (12 points pour chacune).
  - L'élève range les valeurs et trouve les deux médianes (12 points pour Inès, 5 points pour Maëlle).
  - 'L''élève interprète : même moyenne, mais la médiane montre que Maëlle marque peu dans la plupart des matchs ; sa moyenne
    est tirée par un ou deux gros matchs.'
  indices:
    relance: Les deux joueuses ont-elles la même moyenne ? Que t'apprend alors la médiane en plus ?
    methode: 'Pour chaque joueuse : additionne les points et divise par 5 ; puis range les points et prends la 3e valeur.'
    etape: Pour Maëlle, les points rangés sont 2 ; 4 ; 5 ; 19 ; 30. Fais pareil pour Inès et compare.
  solution: 'Inès : somme 60, moyenne 12 ; rangés 10 ; 12 ; 12 ; 12 ; 14, médiane 12. Maëlle : somme 60, moyenne 12 ; rangés
    2 ; 4 ; 5 ; 19 ; 30, médiane 5. Même moyenne, mais la moitié des matchs de Maëlle sont à 5 points ou moins : sa moyenne
    vient surtout de deux gros matchs. Inès marque plus régulièrement autour de 12 points.'
- id: nblm-pour-calculer-ma-moyenne-a-partir-d-un-t-1
  type: choix
  difficulte: 2
  enonce: Pour calculer ma moyenne à partir d'un tableau d’effectifs, quelle méthode dois-je appliquer ?
  reponse:
    options:
    - id: o1
      texte: Multiplier chaque valeur par son effectif, faire la somme de ces produits, puis diviser par l'effectif total.
    - id: o2
      texte: Additionner uniquement les valeurs du tableau sans regarder les effectifs et diviser par le nombre de valeurs.
    - id: o3
      texte: Diviser l'effectif total par la somme de toutes les valeurs présentées dans la première ligne du tableau.
    - id: o4
      texte: Calculer la moyenne entre la plus petite valeur et la plus grande valeur du tableau.
    bonnes:
    - o1
  indices:
    relance: Chaque valeur doit intervenir autant de fois que son effectif l'indique dans le calcul.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Oublier de tenir compte des effectifs associés à chaque valeur est une erreur fréquente.
  - si:
      contient:
      - o3
    relance: Inverser le numérateur et le dénominateur est une erreur classique dans la formule.
  - si:
      contient:
      - o4
    relance: La moyenne d'une série ne se réduit pas à la moyenne de ses deux valeurs extrêmes.
  solution: Multiplier chaque valeur par son effectif, faire la somme de ces produits, puis diviser par l'effectif total.
    C'est la méthode exacte du calcul d'une moyenne pondérée à partir d'un tableau d'effectifs.
- id: nblm-avant-de-determiner-la-mediane-d-une-ser-2
  type: choix
  difficulte: 2
  enonce: Avant de déterminer la médiane d'une série de notes, quelle action est indispensable si l'on veut ranger les valeurs
    dans l'ordre ?
  reponse:
    options:
    - id: o1
      texte: Ordonner toutes les valeurs de la série dans l'ordre croissant.
    - id: o2
      texte: Calculer au préalable la moyenne de la série statistique.
    - id: o3
      texte: Conserver la liste des données brutes telle qu'elle est donnée dans l'énoncé.
    - id: o4
      texte: Effacer les valeurs qui apparaissent plus d'une fois dans la liste.
    bonnes:
    - o1
  indices:
    relance: La médiane dépend de la position centrale une fois la série correctement classée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'La médiane et la moyenne sont indépendantes : il n''est pas nécessaire de calculer la moyenne.'
  - si:
      contient:
      - o3
    relance: Chercher la médiane sans ranger les valeurs au préalable est une erreur classique.
  - si:
      contient:
      - o4
    relance: Il faut conserver toutes les données, y compris les répétitions, pour respecter l'effectif.
  solution: Ordonner toutes les valeurs de la série dans l'ordre croissant. La médiane s'obtient sur une série dont les valeurs
    sont impérativement ordonnées.
- id: nblm-lorsque-l-effectif-total-d-une-serie-ord-3
  type: choix
  difficulte: 2
  enonce: Lorsque l'effectif total d'une série ordonnée est impair (par exemple 7 valeurs), comment identifie-t-on la valeur
    du milieu ?
  reponse:
    options:
    - id: o1
      texte: La médiane est la valeur située exactement au rang (7 + 1) ÷ 2, soit la 4e valeur.
    - id: o2
      texte: La médiane est le nombre 4 lui-même.
    - id: o3
      texte: On fait la moyenne entre la 3e et la 4e valeur de la série ordonnée.
    - id: o4
      texte: On prend la valeur ayant le plus grand effectif dans la série.
    bonnes:
    - o1
  indices:
    relance: Cherche la donnée qui possède autant de valeurs avant elle que de valeurs après elle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Confondre le rang de la médiane (la 4e position) avec la valeur de la donnée est une erreur fréquente.
  - si:
      contient:
      - o3
    relance: On fait la moyenne des deux valeurs centrales uniquement lorsque l'effectif total est pair.
  - si:
      contient:
      - o4
    relance: Cette réponse confond la médiane avec le mode de la série.
  solution: La médiane est la valeur située exactement au rang (7 + 1) ÷ 2, soit la 4e valeur. Pour un nombre impair de données,
    la valeur du milieu se situe au rang (n + 1) ÷ 2.
- id: nblm-si-l-on-indique-qu-une-classe-a-obtenu-u-4
  type: choix
  difficulte: 2
  enonce: Si l'on indique qu'une classe a obtenu une médiane de 11/20 à un devoir, que peut-on affirmer sur la moitié des
    notes ?
  reponse:
    options:
    - id: o1
      texte: Au moins la moitié des élèves a obtenu une note inférieure ou égale à 11/20.
    - id: o2
      texte: La moyenne de la classe est obligatoirement égale à 11/20.
    - id: o3
      texte: Exactement la moitié des élèves a eu 0 et l'autre moitié a eu 20.
    - id: o4
      texte: Tous les élèves ont obtenu exactement la note de 11/20.
    bonnes:
    - o1
  indices:
    relance: Pense à la répartition de la population en deux sous-groupes de 50 %.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La moyenne peut être supérieure ou inférieure à la médiane car elle est sensible aux valeurs extrêmes.
  - si:
      contient:
      - o3
    relance: La médiane donne une valeur repère de séparation, pas la valeur spécifique des autres données.
  - si:
      contient:
      - o4
    relance: Une médiane de 11 ne signifie pas que toutes les notes sont égales à 11.
  solution: Au moins la moitié des élèves a obtenu une note inférieure ou égale à 11/20. La médiane sépare la série ordonnée
    en deux groupes d'effectifs égaux (au moins 50 % au-dessus et au-dessous).
- id: nblm-quelle-est-la-moyenne-de-la-serie-de-not-5
  type: choix
  difficulte: 2
  enonce: 'Quelle est la moyenne de la série de notes suivantes : 10 ; 12 ; 14 ; 18 ?'
  reponse:
    options:
    - id: o1
      texte: 13,5
    - id: o2
      texte: '54'
    - id: o3
      texte: '13'
    - id: o4
      texte: '18'
    bonnes:
    - o1
  indices:
    relance: Additionne toutes les notes et divise la somme obtenue par 4.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 54 est la somme des valeurs ; il ne faut pas oublier de diviser par l'effectif total (4).
  - si:
      contient:
      - o3
    relance: 13 est la médiane (la moyenne entre 12 et 14), mais pas la moyenne de la série.
  - si:
      contient:
      - o4
    relance: 18 est la note maximale de la série, pas la moyenne.
  solution: 13,5. La somme vaut 10 + 12 + 14 + 18 = 54. La moyenne est 54 ÷ 4 = 13,5.
- id: nblm-quels-sont-les-deux-indicateurs-de-posit-6
  type: choix
  difficulte: 3
  enonce: Quels sont les deux indicateurs de position au programme de 3e utilisés pour résumer une série statistique ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La moyenne
    - id: o2
      texte: La médiane
    - id: o3
      texte: L'étendue
    - id: o4
      texte: La fréquence
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux mesures qui indiquent où se situent les données centrales.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'L''étendue mesure l''écart entre la plus grande et la plus petite valeur : c''est un indicateur de dispersion.'
  - si:
      contient:
      - o4
    relance: La fréquence mesure la proportion d'une valeur dans l'effectif total, pas la position de la série.
  solution: La moyenne ; La médiane. La moyenne est l'un des deux principaux indicateurs de position étudiés en 3e.
- id: nblm-la-valeur-qui-partage-une-serie-statisti-7
  type: texte_court
  difficulte: 1
  enonce: La valeur qui partage une série statistique ordonnée en deux groupes de même effectif s'appelle la ____.
  reponse:
    acceptees:
    - médiane
    fautes_tolerees: 1
  indices:
    relance: Nom de l'indicateur représentant la valeur centrale d'une liste ordonnée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: médiane. La médiane est l'indicateur de position qui sépare la série en deux ensembles d'effectifs égaux.
- id: nblm-lorsque-chaque-valeur-d-une-serie-est-mu-8
  type: texte_court
  difficulte: 1
  enonce: Lorsque chaque valeur d'une série est multipliée par son effectif pour calculer la moyenne, on parle de moyenne
    ____.
  reponse:
    acceptees:
    - pondérée
    fautes_tolerees: 1
  indices:
    relance: Qualificatif de la moyenne tenant compte du poids de chaque valeur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: pondérée. La moyenne calculée en tenant compte des effectifs ou coefficients s'appelle une moyenne pondérée.
- id: mediane-tableau-effectifs
  type: nombre
  difficulte: 2
  enonce: 'On a demandé à 24 élèves combien de livres ils ont lus pendant les vacances. Résultats : 0 livre pour 5 élèves
    ; 1 livre pour 7 élèves ; 2 livres pour 6 élèves ; 3 livres pour 4 élèves ; 4 livres pour 2 élèves. Quelle est la médiane
    de cette série ?'
  reponse:
    valeur: 1.5
    forme: libre
  indices:
    relance: Combien y a-t-il de valeurs en tout ? Est-ce un nombre pair ou impair ?
    methode: Avec un nombre pair de valeurs, la médiane est la moyenne des deux valeurs du milieu. Cumule les effectifs pour
      trouver ces deux valeurs.
    etape: 'Les valeurs de rang 12 et 13 sont au milieu. Effectifs cumulés : 5, puis 12, puis 18… Dans quelles valeurs tombent
      ces deux rangs ?'
  pieges:
  - si:
      valeur: 2
    relance: Tu as pris la valeur du milieu de la liste 0 ; 1 ; 2 ; 3 ; 4 sans tenir compte des effectifs.
  - si:
      valeur: 1
    relance: Tu as trouvé la valeur de rang 12. Comme il y a un nombre pair de valeurs, il faut aussi la valeur de rang 13.
  solution: 'Il y a 24 valeurs, la médiane est la moyenne des valeurs de rang 12 et 13. Effectifs cumulés : 5 (0 livre), 12
    (1 livre), 18 (2 livres)... Le 12e élève a lu 1 livre, le 13e en a lu 2. Médiane = (1 + 2) ÷ 2 = 1,5 livre.'
- id: quatrieme-note
  type: nombre
  difficulte: 3
  enonce: Léo a eu 10, 14 et 9 à trois contrôles. Il veut que la moyenne de ses quatre notes soit 12. Quelle note doit-il
    avoir au quatrième contrôle ?
  reponse:
    valeur: 15
    forme: libre
  indices:
    relance: Si la moyenne de quatre notes est connue, que peux-tu dire de la somme de ces quatre notes ?
    methode: Moyenne × nombre de notes = somme des notes. Calcule la somme totale voulue, puis enlève les notes déjà obtenues.
    etape: La somme des quatre notes doit valoir 4 × 12. Enlève-en 10, 14 et 9.
  pieges:
  - si:
      valeur: 12
    relance: 12 est la moyenne visée, pas la quatrième note. Calcule d'abord la somme des quatre notes.
  - si:
      valeur: 48
    relance: Ce nombre est la somme des quatre notes. Il reste à enlever les trois notes déjà obtenues.
  solution: 'Somme voulue : 4 × 12 = 48. Somme déjà obtenue : 10 + 14 + 9 = 33. Quatrième note : 48 − 33 = 15. Vérification
    : (10 + 14 + 9 + 15) ÷ 4 = 48 ÷ 4 = 12.'
