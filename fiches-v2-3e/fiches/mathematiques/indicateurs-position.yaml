format: 2
notion: indicateurs-position
version: 1
etat: verifiee
declencheurs:
- valeur du milieu
- moyenne pondérée
- moitié des notes
- calculer ma moyenne
- ranger les valeurs dans l'ordre
prerequis:
- 4e-diagrammes-mediane
- calcul-nombres-rationnels
essentiel: 'La moyenne d''une série = somme de toutes les valeurs ÷ nombre de valeurs.

  Avec un tableau d''effectifs, on multiplie chaque valeur par son effectif, on additionne, puis on divise par l''effectif
  total (moyenne pondérée).


  La médiane partage la série rangée dans l''ordre croissant en deux groupes de même effectif : au moins la moitié des valeurs
  sont inférieures ou égales à la médiane, au moins la moitié sont supérieures ou égales.

  Nombre impair de valeurs : la médiane est la valeur du milieu. Nombre pair : c''est la moyenne des deux valeurs du milieu.


  La moyenne est sensible aux valeurs extrêmes, la médiane beaucoup moins.

  '
methode:
- 'Pour la moyenne : additionner toutes les valeurs (ou les produits valeur × effectif), puis diviser par le nombre total
  de valeurs.'
- 'Pour la médiane : ranger d''abord les valeurs dans l''ordre croissant, en gardant les valeurs répétées.'
- Compter les valeurs (n). Si n est impair, la médiane est la valeur de rang (n + 1) ÷ 2.
- Si n est pair, la médiane est la moyenne des valeurs de rangs n ÷ 2 et n ÷ 2 + 1.
- 'Interpréter avec une phrase : par exemple « la moitié des élèves a mis moins de ... minutes ».'
vocabulaire:
- terme: moyenne
  definition: Somme des valeurs divisée par le nombre de valeurs.
- terme: médiane
  definition: Valeur qui partage la série rangée en deux groupes de même effectif.
- terme: effectif total
  definition: Nombre total de valeurs de la série.
erreurs_frequentes:
- Oublier de diviser la somme par le nombre de valeurs.
- Chercher la médiane sans avoir rangé les valeurs dans l'ordre.
- Dans un tableau d'effectifs, faire la moyenne des valeurs sans tenir compte des effectifs.
- Avec un nombre pair de valeurs, prendre une seule des deux valeurs du milieu.
- Confondre le rang de la médiane avec la médiane elle-même.
exemple:
  enonce: 'Voici les températures relevées à midi pendant 7 jours (en °C) : 18 ; 21 ; 17 ; 24 ; 19 ; 21 ; 20. Calcule la moyenne
    et la médiane.'
  solution: 'Somme : 18 + 21 + 17 + 24 + 19 + 21 + 20 = 140, et 140 ÷ 7 = 20. La moyenne est 20 °C. Rangées : 17 ; 18 ; 19
    ; 20 ; 21 ; 21 ; 24. Il y a 7 valeurs, la médiane est la 4e : 20 °C.'
exercices:
- id: moyenne-cinq-notes
  type: nombre
  difficulte: 1
  enonce: 'Camille a obtenu ces notes sur 20 ce trimestre : 8 ; 14 ; 11 ; 17 ; 15. Quelle est sa moyenne ?'
  reponse:
    valeur: 13
    forme: libre
  indices:
    relance: Pour une moyenne, que fais-tu d'abord avec toutes les notes ?
    methode: Additionne les cinq notes, puis divise la somme par le nombre de notes.
    etape: 'Commence : 8 + 14 = 22. Ajoute ensuite les trois autres notes, puis divise par 5.'
  pieges:
  - si:
      valeur: 65
    relance: 'Tu as bien additionné les notes. Il reste une étape : par combien faut-il diviser cette somme ?'
  - si:
      valeur: 14
    relance: 'Ce nombre est la valeur du milieu quand on range les notes : c''est la médiane, pas la moyenne. Refais le calcul
      de la moyenne.'
  - si:
      valeur: 11
    relance: Tu as pris la note placée au milieu de la liste. Pour la moyenne, il faut utiliser toutes les notes.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta somme en additionnant les notes une par une, puis refais la division.
  solution: 8 + 14 + 11 + 17 + 15 = 65 ; 65 ÷ 5 = 13. La moyenne de Camille est 13 sur 20.
- id: rang-de-la-mediane
  type: nombre
  difficulte: 1
  enonce: Une série contient 15 valeurs rangées dans l'ordre croissant. À quel rang se trouve la médiane ? Réponds par un
    nombre entier.
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: La médiane partage la série en deux groupes. Combien de valeurs doit-il y avoir avant elle, et combien après
      ?
    methode: 'Avec un nombre impair de valeurs, la médiane est la valeur du milieu : il y a autant de valeurs avant qu''après
      elle.'
    etape: 'Mets la médiane de côté : il reste 14 valeurs, à partager en deux groupes égaux, un avant et un après.'
  pieges:
  - si:
      valeur: 7.5
    relance: Un rang est un nombre entier. Combien de valeurs mets-tu avant la médiane, et à quel rang arrive-t-elle ensuite
      ?
  - si:
      valeur: 7
    relance: S'il y a 7 valeurs avant la médiane, quel est le rang de la médiane elle-même ?
  solution: '15 = 7 + 1 + 7 : il y a 7 valeurs avant la médiane et 7 après. La médiane est donc la valeur de rang 8.'
- id: mediane-nombre-pair
  type: nombre
  difficulte: 2
  enonce: 'Huit élèves ont noté leur temps de trajet jusqu''au collège, en minutes : 12 ; 25 ; 8 ; 18 ; 30 ; 15 ; 22 ; 10.
    Quelle est la médiane de ces temps (en minutes) ?'
  reponse:
    valeur: 16.5
    forme: libre
  indices:
    relance: As-tu rangé les temps dans l'ordre croissant avant de chercher le milieu ?
    methode: Range les 8 valeurs. Avec un nombre pair de valeurs, la médiane est la moyenne des deux valeurs du milieu.
    etape: 'Liste rangée : 8 ; 10 ; 12 ; 15 ; 18 ; 22 ; 25 ; 30. Repère maintenant la 4e et la 5e valeur.'
  pieges:
  - si:
      valeur: 24
    relance: Tu as pris les deux valeurs du milieu de la liste telle qu'elle est donnée. Range d'abord les temps dans l'ordre
      croissant.
  - si:
      valeur: 17.5
    relance: Ce nombre est la moyenne des huit temps, pas la médiane. La médiane se lit sur la liste rangée.
  - si:
      valeur: 15
    relance: 'Il y a un nombre pair de valeurs : il n''y a pas une seule valeur au milieu, mais deux. Que fais-tu avec ces
      deux valeurs ?'
  - si:
      valeur: 18
    relance: 'Il y a un nombre pair de valeurs : il n''y a pas une seule valeur au milieu, mais deux. Que fais-tu avec ces
      deux valeurs ?'
  solution: 'Rangés : 8 ; 10 ; 12 ; 15 ; 18 ; 22 ; 25 ; 30. Il y a 8 valeurs, la médiane est entre la 4e (15) et la 5e (18)
    : (15 + 18) ÷ 2 = 16,5 minutes. La moitié des élèves met moins de 16,5 minutes.'
- id: moyenne-tableau-effectifs
  type: nombre
  difficulte: 2
  enonce: 'Dans une classe de 25 élèves, on a demandé le nombre de frères et sœurs. Résultats : 0 frère ou sœur pour 6 élèves
    ; 1 pour 10 élèves ; 2 pour 6 élèves ; 3 pour 3 élèves. Calcule le nombre moyen de frères et sœurs par élève (valeur exacte,
    en écriture décimale).'
  reponse:
    valeur: 1.24
    forme: libre
  indices:
    relance: Tous les nombres de frères et sœurs n'ont pas le même effectif. Comment en tenir compte ?
    methode: Multiplie chaque valeur par son effectif, additionne ces produits, puis divise par l'effectif total.
    etape: 'Commence : 0 × 6 = 0 et 1 × 10 = 10. Fais de même pour les deux autres lignes, additionne tout, puis divise par
      l''effectif total.'
  pieges:
  - si:
      valeur: 1.5
    relance: Tu as fait la moyenne de 0, 1, 2 et 3 sans tenir compte du nombre d'élèves pour chaque valeur. Utilise les effectifs.
  - si:
      valeur: 6.25
    relance: 'Tu as calculé la moyenne des effectifs. On cherche le nombre moyen de frères et sœurs : multiplie chaque valeur
      par son effectif.'
  - si:
      valeur: 31
    relance: Tu as la somme des produits. Il reste à diviser par le nombre total d'élèves.
  solution: (0 × 6 + 1 × 10 + 2 × 6 + 3 × 3) ÷ 25 = 31 ÷ 25 = 1,24. En moyenne, un élève de la classe a 1,24 frère ou sœur.
- id: salaires-moyenne-mediane
  type: choix
  difficulte: 2
  enonce: 'Dans une petite entreprise, les six salaires mensuels sont : 1 500 € ; 1 600 € ; 1 600 € ; 1 700 € ; 1 800 € ;
    9 000 €. Quelles affirmations sont vraies ?'
  reponse:
    options:
    - id: a
      texte: La moyenne des salaires est supérieure à 2 800 €.
    - id: b
      texte: La médiane des salaires est 1 650 €.
    - id: c
      texte: La moitié des salariés gagne plus que la moyenne.
    - id: d
      texte: Si le plus haut salaire passait à 12 000 €, la médiane augmenterait.
    bonnes:
    - a
    - b
  indices:
    relance: Calcule la moyenne et la médiane avant de lire les affirmations. Laquelle des deux est tirée vers le haut par
      le salaire de 9 000 € ?
    methode: 'Moyenne : somme des six salaires ÷ 6. Médiane : six valeurs, donc moyenne des 3e et 4e valeurs rangées.'
    etape: La somme des six salaires fait 17 200 €. Divise par 6 et compare à 2 800 €, puis cherche les deux valeurs du milieu.
  pieges:
  - si:
      contient:
      - c
    relance: Combien de salariés gagnent vraiment plus que la moyenne ? Compare chaque salaire à la moyenne que tu as trouvée.
  - si:
      contient:
      - d
    relance: Si le plus haut salaire change, les deux valeurs du milieu de la liste rangée changent-elles ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation vraie, mais il y en a une autre. Vérifie les calculs de moyenne et de médiane.
  solution: 'Moyenne : 17 200 ÷ 6 ≈ 2 867 €, supérieure à 2 800 € (a vraie). Médiane : (1 600 + 1 700) ÷ 2 = 1 650 € (b vraie).
    Un seul salarié gagne plus que la moyenne (c fausse). Changer le plus haut salaire ne change pas les valeurs du milieu,
    donc pas la médiane (d fausse). Ici, la médiane décrit mieux le salaire habituel que la moyenne.'
- id: comparer-deux-joueurs
  type: ouverte
  difficulte: 3
  enonce: 'Deux joueuses de basket ont marqué ces points sur 5 matchs. Inès : 10 ; 12 ; 14 ; 12 ; 12. Maëlle : 2 ; 4 ; 30
    ; 5 ; 19. Calcule la moyenne et la médiane de chaque joueuse, puis explique laquelle marque le plus souvent beaucoup de
    points.'
  criteres:
  - L'élève calcule correctement les deux moyennes (12 points pour chacune).
  - L'élève range les valeurs et trouve les deux médianes (12 points pour Inès, 5 points pour Maëlle).
  - 'L''élève interprète : même moyenne, mais la médiane montre que Maëlle marque peu dans la plupart des matchs ; sa moyenne
    est tirée par un ou deux gros matchs.'
  indices:
    relance: Les deux joueuses ont-elles la même moyenne ? Que t'apprend alors la médiane en plus ?
    methode: 'Pour chaque joueuse : additionne les points et divise par 5 ; puis range les points et prends la 3e valeur.'
    etape: Pour Maëlle, les points rangés sont 2 ; 4 ; 5 ; 19 ; 30. Fais pareil pour Inès et compare.
  solution: 'Inès : somme 60, moyenne 12 ; rangés 10 ; 12 ; 12 ; 12 ; 14, médiane 12. Maëlle : somme 60, moyenne 12 ; rangés
    2 ; 4 ; 5 ; 19 ; 30, médiane 5. Même moyenne, mais la moitié des matchs de Maëlle sont à 5 points ou moins : sa moyenne
    vient surtout de deux gros matchs. Inès marque plus régulièrement autour de 12 points.'
