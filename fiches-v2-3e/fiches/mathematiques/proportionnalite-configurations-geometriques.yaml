format: 2
notion: proportionnalite-configurations-geometriques
version: 1
etat: verifiee
declencheurs:
- échelle du plan
- maquette
- longueur réelle
- triangles de même forme
- hauteur de l'arbre
- coefficient d'agrandissement
prerequis:
- 4e-proportionnalite-4e
- 4e-agrandissement-reduction-translation
essentiel: 'Dans un agrandissement ou une réduction de rapport k, toutes les longueurs sont multipliées par k : les longueurs
  de la figure image sont proportionnelles à celles de la figure de départ.

  k > 1 : agrandissement ; 0 < k < 1 : réduction. On trouve k en divisant une longueur de l''image par la longueur correspondante
  de départ.


  Un plan ou une carte à l''échelle 1/200 est une réduction : 1 cm sur le plan représente 200 cm en réalité.

  Deux triangles sont semblables s''ils ont leurs angles deux à deux égaux ; leurs côtés correspondants sont alors proportionnels
  (et réciproquement).

  Dans un triangle ABC, si M est sur [AB], N sur [AC] et (MN) parallèle à (BC), le triangle AMN est une réduction de ABC :
  AM/AB = AN/AC = MN/BC.

  Une homothétie de rapport k agit aussi comme un agrandissement ou une réduction de rapport k (au signe près).

  '
methode:
- Repérer les deux figures (ou triangles) qui se correspondent et apparier les côtés correspondants.
- Calculer le rapport k avec deux longueurs correspondantes connues (image ÷ départ).
- Multiplier (ou diviser) les autres longueurs par k.
- Pour une échelle, convertir dans la même unité puis revenir à une unité adaptée (m, km).
- 'Vérifier : un agrandissement donne des longueurs plus grandes, une réduction des longueurs plus petites.'
vocabulaire:
- terme: triangles semblables
  definition: Triangles qui ont leurs angles deux à deux égaux ; l'un est un agrandissement ou une réduction de l'autre.
- terme: échelle
  definition: Rapport entre une longueur sur le plan et la longueur réelle, dans la même unité.
erreurs_frequentes:
- Ajouter la même longueur au lieu de multiplier par le même nombre.
- 'Mal apparier les côtés : il faut associer le plus petit au plus petit, le plus grand au plus grand.'
- Inverser le rapport (départ ÷ image au lieu de image ÷ départ).
- Oublier de convertir les cm du plan en m ou en km.
exemple:
  enonce: Sur une carte à l'échelle 1/25 000, deux villages sont à 8 cm l'un de l'autre. Quelle est la distance réelle en
    km ?
  solution: 8 × 25 000 = 200 000 cm = 2 000 m = 2 km.
exercices:
- id: echelle-du-plan
  type: nombre
  difficulte: 1
  enonce: Sur le plan d'une maison à l'échelle 1/200, le salon mesure 4,5 cm de long. Quelle est sa longueur réelle, en mètres
    ? Écris seulement le nombre.
  reponse:
    valeur: 9
  indices:
    relance: Que représente 1 cm sur ce plan, en réalité ?
    methode: Multiplie la longueur sur le plan par 200 pour avoir la longueur réelle en cm, puis convertis en mètres.
    etape: 1 cm sur le plan représente 200 cm, c'est-à-dire 2 m en réalité. Continue avec 4,5 cm.
  pieges:
  - si:
      valeur: 900
    relance: Ton résultat est en centimètres. Combien de centimètres y a-t-il dans un mètre ?
  - si:
      valeur: 0.9
    relance: 'Vérifie ta conversion : 100 cm = 1 m. Un salon de moins d''un mètre, est-ce vraisemblable ?'
  - si:
      valeur: 90
    relance: 'Vérifie ta conversion des centimètres en mètres : 100 cm = 1 m.'
  - si:
      diagnostic: valeur_fausse
    relance: Longueur réelle en cm = longueur sur le plan × 200. Convertis ensuite en mètres.
  solution: 4,5 × 200 = 900 cm, soit 9 m.
- id: triangles-semblables-cote
  type: nombre
  difficulte: 2
  enonce: Le triangle ABC a des côtés de 4 cm, 6 cm et 7 cm. Le triangle DEF lui est semblable, et son plus petit côté mesure
    10 cm. Combien mesure le plus grand côté de DEF, en cm ? Écris seulement le nombre.
  reponse:
    valeur: 17.5
  indices:
    relance: Quel côté de ABC correspond au plus petit côté de DEF ? Par combien a-t-il été multiplié ?
    methode: Calcule le rapport k = 10 ÷ 4, puis multiplie le plus grand côté de ABC par k.
    etape: Le plus petit côté de ABC mesure 4 cm, donc k = 10 ÷ 4 = 2,5. Il reste à multiplier 7 cm par 2,5.
  pieges:
  - si:
      valeur: 13
    relance: Tu as ajouté 6 cm à chaque côté. Dans des triangles semblables, on multiplie les côtés par le même nombre.
  - si:
      valeur: 2.8
    relance: 'Tu as divisé au lieu de multiplier. DEF est plus grand que ABC : son grand côté doit dépasser 7 cm.'
  - si:
      valeur: 15
    relance: C'est la longueur qui correspond au côté de 6 cm. On demande le plus grand côté.
  - si:
      diagnostic: valeur_fausse
    relance: Associe le plus petit côté de ABC au plus petit côté de DEF, calcule le rapport, puis applique-le au plus grand
      côté.
  solution: 'Le plus petit côté de ABC (4 cm) correspond au plus petit côté de DEF (10 cm) : k = 10 ÷ 4 = 2,5. Le plus grand
    côté de DEF mesure 7 × 2,5 = 17,5 cm.'
- id: ombre-de-l-arbre
  type: nombre
  difficulte: 2
  enonce: Au même moment de la journée, un bâton vertical de 1,5 m a une ombre de 2 m, et un arbre a une ombre de 12 m. Les
    rayons du soleil sont parallèles, donc les deux triangles « objet - ombre - rayon » sont semblables. Quelle est la hauteur
    de l'arbre, en m ? Écris seulement le nombre.
  reponse:
    valeur: 9
  indices:
    relance: Par combien faut-il multiplier l'ombre du bâton pour obtenir l'ombre de l'arbre ?
    methode: Calcule le rapport k = 12 ÷ 2, puis multiplie la hauteur du bâton par k.
    etape: L'ombre de l'arbre est 6 fois plus longue que celle du bâton. L'arbre est donc 6 fois plus haut que le bâton.
  pieges:
  - si:
      valeur: 16
    relance: 'Tu as inversé les rôles : la hauteur correspond à la hauteur, l''ombre à l''ombre. Le bâton est plus petit que
      son ombre : et l''arbre ?'
  - si:
      valeur: 11.5
    relance: Tu as retiré 0,5 m à l'ombre. Dans des triangles semblables, on multiplie par un même nombre, on n'ajoute pas.
  - si:
      diagnostic: valeur_fausse
    relance: Calcule d'abord combien de fois l'ombre de l'arbre est plus longue que celle du bâton.
  solution: 'k = 12 ÷ 2 = 6. Hauteur de l''arbre : 1,5 × 6 = 9 m.'
- id: triangle-reduit-parallele
  type: nombre
  difficulte: 3
  enonce: Dans le triangle ABC, M est sur le côté [AB] et N sur le côté [AC], avec (MN) parallèle à (BC). On sait que AM =
    3 cm, AB = 5 cm et BC = 8 cm. Le triangle AMN est une réduction du triangle ABC. Calcule MN, en cm. Écris seulement le
    nombre.
  reponse:
    valeur: 4.8
  indices:
    relance: Quel est le rapport de la réduction qui transforme ABC en AMN ? Quelles longueurs connues se correspondent ?
    methode: 'Le rapport est k = AM ÷ AB. Le côté MN correspond au côté BC : multiplie BC par k.'
    etape: k = 3 ÷ 5 = 0,6. Il reste à multiplier BC = 8 cm par 0,6.
  pieges:
  - si:
      valeur: 13.3
    relance: 'Tu as utilisé AB ÷ AM : c''est le rapport d''un agrandissement. AMN est plus petit que ABC.'
  - si:
      valeur: 13.33
    relance: 'Tu as utilisé AB ÷ AM : c''est le rapport d''un agrandissement. AMN est plus petit que ABC.'
  - si:
      valeur: 6
    relance: Tu as retiré 2 cm, comme entre AB et AM. Dans une réduction, on multiplie par un même nombre.
  - si:
      diagnostic: valeur_fausse
    relance: Écris l'égalité des rapports AM/AB = MN/BC, puis remplace par les longueurs connues.
  solution: AMN est une réduction de ABC de rapport k = AM/AB = 3/5 = 0,6. Donc MN = 0,6 × 8 = 4,8 cm.
- id: reconnaitre-triangles-semblables
  type: choix
  difficulte: 2
  enonce: Deux triangles sont semblables quand... (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: leurs angles sont deux à deux égaux
    - id: b
      texte: leurs côtés correspondants sont proportionnels
    - id: c
      texte: ils ont la même aire
    - id: d
      texte: ils ont un angle égal
    bonnes:
    - a
    - b
  indices:
    relance: Deux triangles semblables ont la même forme, mais pas forcément la même taille. Qu'est-ce qui garde la même forme
      ?
    methode: 'Pour chaque proposition, cherche un contre-exemple : deux triangles qui la vérifient mais n''ont pas la même
      forme.'
    etape: 'Un triangle rectangle et un triangle équilatéral peuvent avoir la même aire : ont-ils la même forme ?'
  pieges:
  - si:
      contient:
      - c
    relance: Un triangle très allongé et un triangle équilatéral peuvent avoir la même aire sans avoir la même forme.
  - si:
      contient:
      - d
    relance: 'Un seul angle égal ne suffit pas : deux triangles rectangles n''ont pas toujours la même forme.'
  - si:
      diagnostic: incomplet
    relance: Il y a une autre bonne réponse. Relis les propositions que tu n'as pas choisies.
  solution: 'Réponses a et b : deux triangles sont semblables quand leurs angles sont deux à deux égaux, ce qui revient à
    dire que leurs côtés correspondants sont proportionnels. Une même aire ou un seul angle égal ne suffisent pas.'
- id: justifier-semblables
  type: ouverte
  difficulte: 2
  enonce: Le triangle RST a des côtés de 3 cm, 4 cm et 5 cm. Le triangle UVW a des côtés de 7,5 cm, 10 cm et 12,5 cm. Iris
    affirme que ces deux triangles sont semblables. Justifie si elle a raison.
  criteres:
  - L'élève associe les côtés dans l'ordre croissant et calcule les trois quotients (7,5/3, 10/4, 12,5/5).
  - L'élève constate que les trois quotients valent 2,5 et conclut que les triangles sont semblables (UVW est un agrandissement
    de RST).
  indices:
    relance: Si UVW est un agrandissement de RST, par quel nombre chaque côté a-t-il été multiplié ?
    methode: Range les côtés de chaque triangle du plus petit au plus grand, puis divise chaque côté de UVW par le côté correspondant
      de RST.
    etape: 'Premier quotient : 7,5 ÷ 3. Calcule-le, puis fais de même avec les deux autres paires de côtés.'
  solution: '7,5 ÷ 3 = 2,5 ; 10 ÷ 4 = 2,5 ; 12,5 ÷ 5 = 2,5. Les côtés correspondants sont proportionnels : UVW est un agrandissement
    de rapport 2,5 de RST, les triangles sont semblables. Iris a raison.'
