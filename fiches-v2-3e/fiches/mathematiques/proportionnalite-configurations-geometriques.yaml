# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: proportionnalite-configurations-geometriques
version: 2
etat: verifiee
declencheurs:
- échelle du plan
- maquette
- longueur réelle
- hauteur de l'arbre
- coefficient d'agrandissement
- carte au 25 000
- figure agrandie ou réduite
prerequis:
- 4e-proportionnalite-4e
- 4e-agrandissement-reduction-translation
essentiel: 'Agrandissement et réduction. Quand on agrandit ou réduit une figure avec un rapport k, toutes les longueurs sont
  multipliées par k. Les longueurs de la figure image sont proportionnelles à celles de la figure de départ. Les angles ne
  changent pas.


  Si k > 1, c''est un agrandissement. Si 0 < k < 1, c''est une réduction.

  On calcule k avec deux longueurs correspondantes : k = longueur de l''image ÷ longueur de départ.


  Échelle. Un plan ou une carte à l''échelle 1/200 est une réduction de rapport 1/200. Cela veut dire : 1 cm sur le plan représente
  200 cm dans la réalité. Il faut toujours convertir dans la même unité (cm, puis m ou km). Exemple : 8 cm sur une carte au
  1/25 000 représentent 8 × 25 000 = 200 000 cm = 2 km.


  Triangles semblables. Deux triangles sont semblables s''ils ont leurs angles deux à deux égaux. Alors leurs côtés correspondants
  sont proportionnels : l''un est un agrandissement ou une réduction de l''autre. Réciproquement, si les côtés correspondants
  sont proportionnels, les triangles sont semblables. Un seul angle égal ne suffit pas, une même aire non plus.


  Configuration avec des parallèles. Dans un triangle ABC, M est sur [AB], N est sur [AC], et (MN) est parallèle à (BC). Alors
  le triangle AMN est une réduction du triangle ABC : AM/AB = AN/AC = MN/BC.


  Ombres et hauteurs. Au même moment, les rayons du soleil sont parallèles. Un objet et son ombre forment des triangles semblables
  : on peut trouver la hauteur d''un arbre avec un bâton et les deux ombres.


  Une homothétie de rapport k agrandit ou réduit aussi les longueurs d''un facteur k (au signe près).


  Au brevet : on te demande de calculer une longueur avec un rapport, de lire une échelle, de reconnaître des triangles semblables
  et de rédiger une justification.

  '
methode:
- Repérer les deux figures (ou triangles) qui se correspondent et apparier les côtés correspondants.
- Calculer le rapport k avec deux longueurs correspondantes connues (image ÷ départ).
- Multiplier (ou diviser) les autres longueurs par k.
- Pour une échelle, convertir dans la même unité puis revenir à une unité adaptée (m, km).
- 'Vérifier : un agrandissement donne des longueurs plus grandes, une réduction des longueurs plus petites.'
vocabulaire:
- terme: rapport d'agrandissement
  definition: Le nombre k par lequel on multiplie toutes les longueurs de la figure de départ.
- terme: réduction
  definition: Transformation qui multiplie les longueurs par un nombre k compris entre 0 et 1.
- terme: triangles semblables
  definition: Triangles qui ont leurs angles deux à deux égaux ; l'un est un agrandissement ou une réduction de l'autre.
- terme: côtés correspondants
  definition: Côtés qui se placent au même endroit dans deux figures semblables.
- terme: échelle
  definition: Rapport entre une longueur sur le plan et la longueur réelle, dans la même unité.
- terme: longueurs proportionnelles
  definition: Deux séries de longueurs où l'on passe de l'une à l'autre en multipliant par le même nombre.
- terme: homothétie
  definition: Transformation qui agrandit ou réduit une figure à partir d'un centre, avec un rapport k.
erreurs_frequentes:
- Ajouter la même longueur au lieu de multiplier par le même nombre.
- 'Mal apparier les côtés : il faut associer le plus petit au plus petit, le plus grand au plus grand.'
- Inverser le rapport (départ ÷ image au lieu de image ÷ départ).
- Oublier de convertir les cm du plan en m ou en km.
- Croire que deux triangles sont semblables parce qu'ils ont un seul angle égal ou la même aire.
exemple:
  enonce: Sur une carte à l'échelle 1/25 000, deux villages sont à 8 cm l'un de l'autre. Quelle est la distance réelle en
    km ?
  solution: 8 × 25 000 = 200 000 cm = 2 000 m = 2 km.
exercices:
- id: echelle-du-plan
  type: nombre
  difficulte: 1
  enonce: Sur le plan d'une maison à l'échelle 1/200, le salon mesure 4,5 cm de long. Quelle est sa longueur réelle, en mètres
    ? Écris seulement le nombre.
  reponse:
    valeur: 9
  indices:
    relance: Que représente 1 cm sur ce plan, en réalité ?
    methode: Multiplie la longueur sur le plan par 200 pour avoir la longueur réelle en cm, puis convertis en mètres.
    etape: 1 cm sur le plan représente 200 cm, c'est-à-dire 2 m en réalité. Continue avec 4,5 cm.
  pieges:
  - si:
      valeur: 900
    relance: Ton résultat est en centimètres. Combien de centimètres y a-t-il dans un mètre ?
  - si:
      valeur: 0.9
    relance: 'Vérifie ta conversion : 100 cm = 1 m. Un salon de moins d''un mètre, est-ce vraisemblable ?'
  - si:
      valeur: 90
    relance: 'Vérifie ta conversion des centimètres en mètres : 100 cm = 1 m.'
  - si:
      diagnostic: valeur_fausse
    relance: Longueur réelle en cm = longueur sur le plan × 200. Convertis ensuite en mètres.
  solution: 4,5 × 200 = 900 cm, soit 9 m.
- id: triangles-semblables-cote
  type: nombre
  difficulte: 2
  enonce: Le triangle ABC a des côtés de 4 cm, 6 cm et 7 cm. Le triangle DEF lui est semblable, et son plus petit côté mesure
    10 cm. Combien mesure le plus grand côté de DEF, en cm ? Écris seulement le nombre.
  reponse:
    valeur: 17.5
  indices:
    relance: Quel côté de ABC correspond au plus petit côté de DEF ? Par combien a-t-il été multiplié ?
    methode: Calcule le rapport k = 10 ÷ 4, puis multiplie le plus grand côté de ABC par k.
    etape: Le plus petit côté de ABC mesure 4 cm, donc k = 10 ÷ 4 = 2,5. Il reste à multiplier 7 cm par 2,5.
  pieges:
  - si:
      valeur: 13
    relance: Tu as ajouté 6 cm à chaque côté. Dans des triangles semblables, on multiplie les côtés par le même nombre.
  - si:
      valeur: 2.8
    relance: 'Tu as divisé au lieu de multiplier. DEF est plus grand que ABC : son grand côté doit dépasser 7 cm.'
  - si:
      valeur: 15
    relance: C'est la longueur qui correspond au côté de 6 cm. On demande le plus grand côté.
  - si:
      diagnostic: valeur_fausse
    relance: Associe le plus petit côté de ABC au plus petit côté de DEF, calcule le rapport, puis applique-le au plus grand
      côté.
  solution: 'Le plus petit côté de ABC (4 cm) correspond au plus petit côté de DEF (10 cm) : k = 10 ÷ 4 = 2,5. Le plus grand
    côté de DEF mesure 7 × 2,5 = 17,5 cm.'
- id: ombre-de-l-arbre
  type: nombre
  difficulte: 2
  enonce: Au même moment de la journée, un bâton vertical de 1,5 m a une ombre de 2 m, et un arbre a une ombre de 12 m. Les
    rayons du soleil sont parallèles, donc les deux triangles « objet - ombre - rayon » sont semblables. Quelle est la hauteur
    de l'arbre, en m ? Écris seulement le nombre.
  reponse:
    valeur: 9
  indices:
    relance: Par combien faut-il multiplier l'ombre du bâton pour obtenir l'ombre de l'arbre ?
    methode: Calcule le rapport k = 12 ÷ 2, puis multiplie la hauteur du bâton par k.
    etape: L'ombre de l'arbre est 6 fois plus longue que celle du bâton. L'arbre est donc 6 fois plus haut que le bâton.
  pieges:
  - si:
      valeur: 16
    relance: 'Tu as inversé les rôles : la hauteur correspond à la hauteur, l''ombre à l''ombre. Le bâton est plus petit que
      son ombre : et l''arbre ?'
  - si:
      valeur: 11.5
    relance: Tu as retiré 0,5 m à l'ombre. Dans des triangles semblables, on multiplie par un même nombre, on n'ajoute pas.
  - si:
      diagnostic: valeur_fausse
    relance: Calcule d'abord combien de fois l'ombre de l'arbre est plus longue que celle du bâton.
  solution: 'k = 12 ÷ 2 = 6. Hauteur de l''arbre : 1,5 × 6 = 9 m.'
- id: triangle-reduit-parallele
  type: nombre
  difficulte: 3
  enonce: Dans le triangle ABC, M est sur le côté [AB] et N sur le côté [AC], avec (MN) parallèle à (BC). On sait que AM =
    3 cm, AB = 5 cm et BC = 8 cm. Le triangle AMN est une réduction du triangle ABC. Calcule MN, en cm. Écris seulement le
    nombre.
  reponse:
    valeur: 4.8
  indices:
    relance: Quel est le rapport de la réduction qui transforme ABC en AMN ? Quelles longueurs connues se correspondent ?
    methode: 'Le rapport est k = AM ÷ AB. Le côté MN correspond au côté BC : multiplie BC par k.'
    etape: k = 3 ÷ 5 = 0,6. Il reste à multiplier BC = 8 cm par 0,6.
  pieges:
  - si:
      valeur: 13.3
    relance: 'Tu as utilisé AB ÷ AM : c''est le rapport d''un agrandissement. AMN est plus petit que ABC.'
  - si:
      valeur: 13.33
    relance: 'Tu as utilisé AB ÷ AM : c''est le rapport d''un agrandissement. AMN est plus petit que ABC.'
  - si:
      valeur: 6
    relance: Tu as retiré 2 cm, comme entre AB et AM. Dans une réduction, on multiplie par un même nombre.
  - si:
      diagnostic: valeur_fausse
    relance: Écris l'égalité des rapports AM/AB = MN/BC, puis remplace par les longueurs connues.
  solution: AMN est une réduction de ABC de rapport k = AM/AB = 3/5 = 0,6. Donc MN = 0,6 × 8 = 4,8 cm.
- id: reconnaitre-triangles-semblables
  type: choix
  difficulte: 2
  enonce: Deux triangles sont semblables quand... (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: leurs angles sont deux à deux égaux
    - id: b
      texte: leurs côtés correspondants sont proportionnels
    - id: c
      texte: ils ont la même aire
    - id: d
      texte: ils ont un angle égal
    bonnes:
    - a
    - b
  indices:
    relance: Deux triangles semblables ont la même forme, mais pas forcément la même taille. Qu'est-ce qui garde la même forme
      ?
    methode: 'Pour chaque proposition, cherche un contre-exemple : deux triangles qui la vérifient mais n''ont pas la même
      forme.'
    etape: 'Un triangle rectangle et un triangle équilatéral peuvent avoir la même aire : ont-ils la même forme ?'
  pieges:
  - si:
      contient:
      - c
    relance: Un triangle très allongé et un triangle équilatéral peuvent avoir la même aire sans avoir la même forme.
  - si:
      contient:
      - d
    relance: 'Un seul angle égal ne suffit pas : deux triangles rectangles n''ont pas toujours la même forme.'
  - si:
      diagnostic: incomplet
    relance: Il y a une autre bonne réponse. Relis les propositions que tu n'as pas choisies.
  solution: 'Réponses a et b : deux triangles sont semblables quand leurs angles sont deux à deux égaux, ce qui revient à
    dire que leurs côtés correspondants sont proportionnels. Une même aire ou un seul angle égal ne suffisent pas.'
- id: justifier-semblables
  type: ouverte
  difficulte: 2
  enonce: Le triangle RST a des côtés de 3 cm, 4 cm et 5 cm. Le triangle UVW a des côtés de 7,5 cm, 10 cm et 12,5 cm. Iris
    affirme que ces deux triangles sont semblables. Justifie si elle a raison.
  criteres:
  - L'élève associe les côtés dans l'ordre croissant et calcule les trois quotients (7,5/3, 10/4, 12,5/5).
  - L'élève constate que les trois quotients valent 2,5 et conclut que les triangles sont semblables (UVW est un agrandissement
    de RST).
  indices:
    relance: Si UVW est un agrandissement de RST, par quel nombre chaque côté a-t-il été multiplié ?
    methode: Range les côtés de chaque triangle du plus petit au plus grand, puis divise chaque côté de UVW par le côté correspondant
      de RST.
    etape: 'Premier quotient : 7,5 ÷ 3. Calcule-le, puis fais de même avec les deux autres paires de côtés.'
  solution: '7,5 ÷ 3 = 2,5 ; 10 ÷ 4 = 2,5 ; 12,5 ÷ 5 = 2,5. Les côtés correspondants sont proportionnels : UVW est un agrandissement
    de rapport 2,5 de RST, les triangles sont semblables. Iris a raison.'
- id: nblm-sur-un-dessin-a-l-echelle-du-plan-1-500-1
  type: choix
  difficulte: 2
  enonce: Sur un dessin à l'échelle du plan 1/500, la longueur d'un terrain mesure 12 cm. Quelle est sa longueur réelle en
    mètres ?
  reponse:
    options:
    - id: o1
      texte: 60 m
    - id: o2
      texte: 6 m
    - id: o3
      texte: 41,6 m
    - id: o4
      texte: 0,024 m
    bonnes:
    - o1
  indices:
    relance: Multiplie la longueur mesurée sur le plan par 500 pour obtenir la valeur en cm, puis convertis en mètres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur classique : il faut multiplier la longueur sur le plan par 500 et non diviser 500 par 12.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : division par l''échelle au lieu de multiplier pour trouver la distance réelle.'
  solution: '60 m. Exact. On multiplie la longueur sur le plan par le dénominateur de l''échelle : 12 cm × 500 = 6 000 cm
    = 60 m.'
- id: nblm-un-architecte-realise-une-maquette-d-un-2
  type: choix
  difficulte: 2
  enonce: Un architecte réalise une maquette d'un bâtiment avec un rapport de réduction de 1/100. Si la hauteur réelle du
    bâtiment est de 25 m, quelle est la hauteur de la maquette en centimètres ?
  reponse:
    options:
    - id: o1
      texte: 25 cm
    - id: o2
      texte: 2,5 cm
    - id: o3
      texte: 250 cm
    - id: o4
      texte: 2 500 cm
    bonnes:
    - o1
  indices:
    relance: Convertis d'abord la hauteur réelle en centimètres avant de diviser par 100.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de conversion : oubli d''un facteur 10 lors du passage des mètres aux centimètres.'
  - si:
      contient:
      - o4
    relance: C'est la hauteur réelle exprimée en centimètres sans appliquer la réduction.
  solution: 25 cm. Exact. 25 m = 2 500 cm. En appliquant le rapport 1/100, on obtient 2 500 cm / 100 = 25 cm.
- id: nblm-une-figure-geometrique-possede-un-cote-d-3
  type: choix
  difficulte: 2
  enonce: Une figure géométrique possède un côté de 4 cm. Après un agrandissement, ce côté mesure 14 cm. Quel est le coefficient
    d'agrandissement ?
  reponse:
    options:
    - id: o1
      texte: 3,5
    - id: o2
      texte: 0,285
    - id: o3
      texte: '10'
    - id: o4
      texte: '56'
    bonnes:
    - o1
  indices:
    relance: Divise la longueur de la figure agrandie par la longueur correspondante de la figure de départ.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique d''inversion du rapport : calcul de la longueur initiale divisée par la longueur finale.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : calcul de la différence (14 - 4) au lieu d''utiliser un rapport multiplicatif.'
  - si:
      contient:
      - o4
    relance: 'Erreur : multiplication des deux longueurs au lieu de calculer leur quotient.'
  solution: '3,5. Exact. Le coefficient d''agrandissement s''obtient en divisant la longueur finale par la longueur initiale
    : 14 / 4 = 3,5.'
- id: nblm-un-baton-de-1-5-m-plante-verticalement-p-4
  type: choix
  difficulte: 2
  enonce: Un bâton de 1,5 m planté verticalement produit une ombre de 2 m au sol. Au même moment, l'ombre portée d'un arbre
    mesure 16 m. Quelle est la hauteur de l'arbre ?
  reponse:
    options:
    - id: o1
      texte: 12 m
    - id: o2
      texte: 21,3 m
    - id: o3
      texte: 15,5 m
    - id: o4
      texte: 24 m
    bonnes:
    - o1
  indices:
    relance: Pose une quatrième proportionnelle en égalisant le rapport hauteur/ombre pour le bâton et pour l'arbre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur d''association des grandeurs : calcul de (2 × 16) / 1,5.'
  - si:
      contient:
      - o3
    relance: 'Erreur : utilisation d''une différence additive au lieu d''une quatrième proportionnelle.'
  - si:
      contient:
      - o4
    relance: 'Erreur : oubli de diviser par la longueur de l''ombre du bâton après la multiplication.'
  solution: '12 m. Exact. Les hauteurs et les ombres sont proportionnelles : (1,5 × 16) / 2 = 24 / 2 = 12 m.'
- id: nblm-deux-triangles-sont-dits-semblables-s-il-5
  type: choix
  difficulte: 2
  enonce: Deux triangles sont dits semblables s'ils sont des triangles de même forme. Quelle est la propriété caractéristique
    concernant leurs côtés correspondants ?
  reponse:
    options:
    - id: o1
      texte: Leurs côtés correspondants sont de longueurs proportionnelles.
    - id: o2
      texte: Leurs côtés correspondants ont exactement la même longueur.
    - id: o3
      texte: La somme des côtés du grand triangle est égale au carré de celle du petit.
    - id: o4
      texte: Leurs trois côtés ont obligatoirement la même longueur entre eux.
    bonnes:
    - o1
  indices:
    relance: Pense au lien direct entre la conservation de la forme et la proportionnalité des longueurs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. Ceci est la définition de triangles égaux (superposables), pas seulement semblables.
  - si:
      contient:
      - o3
    relance: Faux. Le lien entre les longueurs homologues est une relation de proportionnalité linéaire.
  - si:
      contient:
      - o4
    relance: Faux. Cela ne concerne que les triangles équilatéraux.
  solution: Leurs côtés correspondants sont de longueurs proportionnelles. Exact. Lorsque deux triangles ont la même forme,
    les longueurs de leurs côtés homologues sont proportionnelles.
- id: nblm-dans-un-agrandissement-ou-une-reduction-6
  type: choix
  difficulte: 3
  enonce: Dans un agrandissement ou une réduction d'une figure géométrique, quelles sont les deux propriétés qui sont toujours
    conservées ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La mesure des angles
    - id: o2
      texte: Le parallélisme des droites
    - id: o3
      texte: La longueur des côtés
    - id: o4
      texte: L'aire de la figure
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les éléments qui définissent la forme sans dépendre de la taille de la figure.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Faux. Les longueurs sont multipliées par le coefficient k et sont donc modifiées (sauf si k = 1).
  - si:
      contient:
      - o4
    relance: Faux. L'aire est multipliée par k² et ne reste pas constante.
  solution: La mesure des angles ; Le parallélisme des droites. Exact. L'agrandissement ou la réduction conserve la forme,
    donc la mesure des angles ne varie pas.
- id: nblm-comment-appelle-t-on-deux-triangles-qui-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on deux triangles qui ont la même forme, c'est-à-dire dont les angles sont égaux deux à deux et
    les côtés correspondants proportionnels ?
  reponse:
    acceptees:
    - triangles semblables
    fautes_tolerees: 1
  indices:
    relance: Ce terme désigne des triangles qui sont l'agrandissement ou la réduction l'un de l'autre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: triangles semblables. Exact. Deux triangles de même forme sont appelés des triangles semblables.
- id: nblm-si-le-rapport-k-d-un-agrandissement-redu-8
  type: texte_court
  difficulte: 1
  enonce: Si le rapport k d'un agrandissement-réduction est compris entre 0 et 1, la transformation est une [...] de la figure
    initiale.
  reponse:
    acceptees:
    - réduction
    fautes_tolerees: 1
  indices:
    relance: Pense au mot désignant le fait qu'une figure devient plus petite.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: réduction. Exact. Lorsque 0 < k < 1, la figure obtenue est plus petite, il s'agit d'une réduction.
- id: distance-sur-la-carte
  type: nombre
  difficulte: 2
  enonce: Sur une carte à l'échelle 1/50 000, on veut placer deux villes distantes de 12 km dans la réalité. Quelle longueur,
    en cm, doit-on mesurer sur la carte ? Écris seulement le nombre.
  reponse:
    valeur: 24
  indices:
    relance: Dans quelle unité faut-il d'abord exprimer la distance réelle pour utiliser l'échelle ?
    methode: Convertis 12 km en cm, puis divise par 50 000 (sur la carte, tout est 50 000 fois plus petit).
    etape: 1 km = 100 000 cm. Calcule 12 × 100 000, puis divise le résultat par 50 000.
  pieges:
  - si:
      valeur: 600000000
    relance: Tu as multiplié par 50 000 au lieu de diviser. Sur une carte, les longueurs sont plus petites que dans la réalité.
  - si:
      valeur: 240
    relance: 'Vérifie ta conversion : combien y a-t-il de centimètres dans 1 km ?'
  - si:
      valeur: 2.4
    relance: 'Vérifie ta conversion : combien y a-t-il de centimètres dans 1 km ?'
  - si:
      diagnostic: valeur_fausse
    relance: Passe la distance réelle en centimètres, puis divise par le dénominateur de l'échelle.
  solution: '12 km = 12 × 100 000 = 1 200 000 cm. Sur la carte : 1 200 000 ÷ 50 000 = 24 cm.'
- id: photo-agrandie
  type: nombre
  difficulte: 2
  enonce: Une photo rectangulaire mesure 6 cm de large et 9 cm de long. On l'agrandit pour que sa largeur devienne 15 cm,
    sans la déformer. Quelle est la nouvelle longueur, en cm ? Écris seulement le nombre.
  reponse:
    valeur: 22.5
  indices:
    relance: Par quel nombre la largeur a-t-elle été multipliée ? La longueur subit-elle le même changement ?
    methode: Calcule le rapport k = nouvelle largeur ÷ ancienne largeur, puis multiplie l'ancienne longueur par k.
    etape: k = 15 ÷ 6 = 2,5. Il reste à multiplier 9 cm par 2,5.
  pieges:
  - si:
      valeur: 18
    relance: Tu as ajouté 9 cm à la longueur. Dans un agrandissement, on multiplie par le même nombre.
  - si:
      valeur: 3.6
    relance: Tu as divisé au lieu de multiplier. La photo agrandie doit avoir une longueur plus grande que 9 cm.
  - si:
      diagnostic: valeur_fausse
    relance: Trouve d'abord combien de fois la largeur a été multipliée, puis applique ce nombre à la longueur.
  solution: 'k = 15 ÷ 6 = 2,5. Nouvelle longueur : 9 × 2,5 = 22,5 cm.'
