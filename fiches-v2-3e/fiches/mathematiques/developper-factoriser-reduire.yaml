# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: developper-factoriser-reduire
version: 1
etat: verifiee
declencheurs:
- enlever les parenthèses
- mettre en facteur
- facteur commun
- différence de deux carrés
- produit de deux parenthèses
- regrouper les termes semblables
prerequis:
- 4e-calcul-litteral-developpement
- 4e-calcul-rationnels
essentiel: 'Développer, c''est transformer un produit en somme. Factoriser, c''est l''inverse : transformer une somme en produit.
  Réduire, c''est regrouper les termes de même nature (les x² ensemble, les x ensemble, les nombres ensemble).


  Simple distributivité : k(a + b) = ka + kb.

  Double distributivité : (a + b)(c + d) = ac + ad + bc + bd.


  Égalité à connaître : (a + b)(a − b) = a² − b².

  Lue de gauche à droite, elle développe ; lue de droite à gauche, elle factorise une différence de deux carrés.


  Pour factoriser, on cherche un facteur commun à tous les termes : ka + kb = k(a + b).

  '
methode:
- 'Pour développer : multiplier chaque terme de la première parenthèse par chaque terme de la seconde, en faisant attention
  aux signes.'
- 'Réduire : regrouper les x², puis les x, puis les nombres.'
- 'Pour factoriser : chercher un facteur commun (un nombre, x, ou toute une parenthèse) et l''écrire devant.'
- Si l'expression est de la forme a² − b², écrire (a − b)(a + b).
- Vérifier en redéveloppant, ou en remplaçant x par une valeur simple dans les deux écritures.
vocabulaire:
- terme: développer
  definition: Écrire un produit sous forme de somme.
- terme: factoriser
  definition: Écrire une somme sous forme de produit.
- terme: réduire
  definition: Regrouper les termes de même nature pour écrire l'expression avec le moins de termes possible.
erreurs_frequentes:
- 'Oublier de multiplier le deuxième terme de la parenthèse : 3(2x − 5) devient 6x − 5 au lieu de 6x − 15.'
- 'Se tromper de signe : 3 × (−4) donne −12, pas +12.'
- Dans une double distributivité, ne faire que deux produits sur quatre.
- Écrire (x − 7)² au lieu de (x − 7)(x + 7) pour factoriser x² − 49.
- Additionner des termes qui ne sont pas de même nature (2x² + 3x n'est pas 5x³).
exemple:
  enonce: Développer et réduire (x + 5)(2x − 1).
  solution: (x + 5)(2x − 1) = x × 2x + x × (−1) + 5 × 2x + 5 × (−1) = 2x² − x + 10x − 5 = 2x² + 9x − 5.
exercices:
- id: developper-simple
  type: expression
  difficulte: 1
  enonce: Développe et réduis A = 3(2x − 5) + 4x.
  reponse:
    valeur: 10x - 15
    variables:
    - x
    forme: developpee
  indices:
    relance: Le 3 devant la parenthèse multiplie-t-il seulement 2x, ou aussi le −5 ?
    methode: Distribue le 3 sur chaque terme de la parenthèse, puis regroupe les termes en x ensemble.
    etape: 3 × 2x = 6x. Calcule maintenant 3 × (−5), puis ajoute le 4x.
  pieges:
  - si:
      valeur: 10x - 5
    relance: Tu as multiplié 2x par 3, mais pas le −5. Reprends la distributivité sur les deux termes.
  - si:
      valeur: 6x - 15
    relance: Le développement de la parenthèse est juste. N'as-tu pas oublié un terme de A ?
  - si:
      diagnostic: pas_developpee
    relance: Ton expression est juste, mais il reste des parenthèses. Développe complètement.
  solution: A = 3 × 2x + 3 × (−5) + 4x = 6x − 15 + 4x = 10x − 15.
- id: double-distributivite
  type: expression
  difficulte: 2
  enonce: Développe et réduis B = (2x + 3)(x − 4).
  reponse:
    valeur: 2x^2 - 5x - 12
    variables:
    - x
    forme: developpee
  indices:
    relance: Combien de produits dois-tu écrire avant de réduire ?
    methode: Multiplie 2x par x puis par −4, puis 3 par x puis par −4. Additionne les quatre produits et regroupe les termes
      en x.
    etape: 'Les deux premiers produits : 2x × x = 2x² et 2x × (−4) = −8x. Écris les deux suivants.'
  pieges:
  - si:
      valeur: 2x^2 - 12
    relance: Tu n'as fait que deux produits sur quatre. Il manque les produits « en croix », ceux qui donnent des termes en
      x.
  - si:
      valeur: 2x^2 - 5x + 12
    relance: 'Regarde le signe du dernier produit : combien fait 3 × (−4) ?'
  - si:
      valeur: 2x^2 + 11x - 12
    relance: Vérifie le signe de 2x × (−4).
  - si:
      diagnostic: pas_developpee
    relance: Ton expression est juste, mais il reste des parenthèses. Développe complètement.
  solution: B = 2x × x + 2x × (−4) + 3 × x + 3 × (−4) = 2x² − 8x + 3x − 12 = 2x² − 5x − 12.
- id: difference-de-carres
  type: expression
  difficulte: 2
  enonce: Factorise C = x² − 49.
  reponse:
    valeur: (x - 7)(x + 7)
    variables:
    - x
    forme: factorisee
  indices:
    relance: 49 est le carré de quel nombre ?
    methode: C est une différence de deux carrés. Utilise a² − b² = (a − b)(a + b).
    etape: Écris C sous la forme x² − b², avec b un nombre positif, puis applique l'égalité.
  pieges:
  - si:
      valeur: (x - 7)^2
    relance: 'Développe (x − 7)² pour vérifier : retrouves-tu C ? Il te faut deux parenthèses différentes.'
  - si:
      valeur: (x - 49)(x + 49)
    relance: 'Dans a² − b², b n''est pas 49 : c''est le nombre dont le carré vaut 49.'
  - si:
      diagnostic: pas_factorisee
    relance: Ton expression est bien égale à C, mais ce n'est pas un produit. Factoriser, c'est écrire un produit.
  solution: C = x² − 49 = x² − 7² = (x − 7)(x + 7).
- id: facteur-commun-parenthese
  type: expression
  difficulte: 3
  enonce: Factorise D = (x + 2)(3x − 1) + (x + 2)(x + 5), puis réduis le deuxième facteur.
  reponse:
    valeur: (x + 2)(4x + 4)
    variables:
    - x
    forme: factorisee
  indices:
    relance: Quel morceau apparaît dans les deux termes de D ?
    methode: Écris le facteur commun une seule fois devant, puis, dans une seconde parenthèse, ce qui reste de chaque terme.
    etape: 'Le facteur commun est (x + 2). Il reste (3x − 1) dans le premier terme et (x + 5) dans le second : additionne-les
      en réduisant.'
  pieges:
  - si:
      valeur: (x + 2)(4x + 6)
    relance: 'Recalcule la somme des nombres dans la seconde parenthèse : −1 + 5.'
  - si:
      valeur: (x + 2)(2x + 4)
    relance: Recalcule 3x + x.
  - si:
      diagnostic: pas_factorisee
    relance: Ton expression est égale à D, mais ce n'est pas un produit. Mets le facteur commun devant.
  solution: D = (x + 2)[(3x − 1) + (x + 5)] = (x + 2)(4x + 4). On peut aussi écrire 4(x + 2)(x + 1).
- id: associer-developpements
  type: association
  difficulte: 1
  enonce: Associe chaque expression de gauche à sa forme développée à droite. Une expression de droite ne sert pas.
  reponse:
    gauche:
    - id: a
      texte: (x + 3)(x − 3)
    - id: b
      texte: 3(x − 3)
    - id: c
      texte: x(x − 3)
    - id: d
      texte: (x − 3)(x − 3)
    droite:
    - id: p
      texte: x² − 9
    - id: q
      texte: 3x − 9
    - id: r
      texte: x² − 3x
    - id: s
      texte: x² − 6x + 9
    - id: t
      texte: x² + 9
    paires:
      a: p
      b: q
      c: r
      d: s
  indices:
    relance: Pour chaque expression de gauche, combien de produits faut-il faire pour la développer ?
    methode: Développe chaque expression de gauche au brouillon, puis cherche le résultat à droite.
    etape: 3(x − 3) = 3 × x + 3 × (−3). Termine ce calcul, puis passe à x(x − 3).
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les signes, surtout pour (x + 3)(x − 3).
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Développe chaque expression de gauche une par une.
  solution: (x + 3)(x − 3) = x² − 9 ; 3(x − 3) = 3x − 9 ; x(x − 3) = x² − 3x ; (x − 3)(x − 3) = x² − 3x − 3x + 9 = x² − 6x
    + 9. x² + 9 ne sert pas.
- id: calcul-mental-101-99
  type: ouverte
  difficulte: 3
  enonce: Montre que, pour tout nombre n, (n + 1)(n − 1) + 1 = n². Utilise ce résultat pour calculer 101 × 99 sans calculatrice.
  criteres:
  - L'élève développe (n + 1)(n − 1) et obtient n² − 1 (par double distributivité ou avec l'égalité a² − b²), puis ajoute
    1.
  - L'élève reconnaît 101 × 99 = (100 + 1)(100 − 1) et en déduit 101 × 99 = 100² − 1 = 9 999.
  indices:
    relance: Que devient (n + 1)(n − 1) quand on le développe ?
    methode: Développe avec la double distributivité, réduis, puis ajoute 1. Ensuite, écris 101 et 99 à l'aide de 100.
    etape: '(n + 1)(n − 1) = n × n − n + n − 1. Réduis. Puis 101 = 100 + 1 : et 99 ?'
  solution: '(n + 1)(n − 1) = n² − n + n − 1 = n² − 1, donc (n + 1)(n − 1) + 1 = n². Avec n = 100 : 101 × 99 = (100 + 1)(100
    − 1) = 100² − 1 = 10 000 − 1 = 9 999.'
- id: nblm-quelle-est-l-expression-simplifiee-de-a-1
  type: choix
  difficulte: 2
  enonce: Quelle est l'expression simplifiée de A = -(3x - 7) lorsqu'on choisit d'enlever les parenthèses ?
  reponse:
    options:
    - id: o1
      texte: -3x + 7
    - id: o2
      texte: -3x - 7
    - id: o3
      texte: 3x - 7
    - id: o4
      texte: 3x + 7
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que le signe moins placé devant une parenthèse s'applique à tous les termes situés à l'intérieur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : oublier de changer le signe du deuxième terme à l''intérieur des parenthèses.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur typique : enlever les parenthèses sans appliquer le signe moins au premier terme.'
  - si:
      contient:
      - o4
    relance: 'C''est une erreur de signe : changer le signe du premier terme de façon incorrecte tout en changeant le second.'
  solution: '-3x + 7. En enlevant des parenthèses précédées d''un signe moins, on change le signe de chaque terme situé à
    l''intérieur des parenthèses : 3x devient -3x et -7 devient +7.'
- id: nblm-quel-est-le-developpement-reduit-de-l-ex-2
  type: choix
  difficulte: 2
  enonce: Quel est le développement réduit de l'expression B = (x + 5)(2x - 1), qui correspond au produit de deux parenthèses
    ?
  reponse:
    options:
    - id: o1
      texte: 2x² + 9x - 5
    - id: o2
      texte: 2x² - 5
    - id: o3
      texte: 2x² + 10x - 5
    - id: o4
      texte: 2x² + 9x + 5
    bonnes:
    - o1
  indices:
    relance: Utilise la double distributivité en multipliant chaque terme de la première parenthèse par chaque terme de la
      seconde.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : ne faire que deux produits sur quatre en oubliant les termes croisés x × (-1) et 5 × 2x.'
  - si:
      contient:
      - o3
    relance: 'Erreur de développement : oublier de multiplier x par (-1) lors du développement.'
  - si:
      contient:
      - o4
    relance: 'Erreur de signe : le produit du terme constant 5 × (-1) donne -5 et non +5.'
  solution: '2x² + 9x - 5. En effectuant la double distributivité : x × 2x + x × (-1) + 5 × 2x + 5 × (-1) = 2x² - x + 10x
    - 5 = 2x² + 9x - 5.'
- id: nblm-comment-factorise-t-on-l-expression-c-x2-3
  type: choix
  difficulte: 2
  enonce: Comment factorise-t-on l'expression C = x² - 64, qui présente une différence de deux carrés ?
  reponse:
    options:
    - id: o1
      texte: (x - 8)(x + 8)
    - id: o2
      texte: (x - 8)²
    - id: o3
      texte: (x - 32)(x + 32)
    - id: o4
      texte: (x + 8)²
    bonnes:
    - o1
  indices:
    relance: Pense à l'égalité remarquable a² - b² = (a - b)(a + b) en identifiant quel nombre a pour carré 64.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur très fréquente : confondre la différence de deux carrés a² - b² avec le carré d''un binôme (x - 8)² qui
      vaut x² - 16x + 64.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : diviser 64 par 2 au lieu d''en calculer la racine carrée √64 = 8.'
  - si:
      contient:
      - o4
    relance: 'Erreur de formule : le développement de (x + 8)² donne x² + 16x + 64, ce qui ne correspond pas à x² - 64.'
  solution: (x - 8)(x + 8). L'expression est de la forme a² - b² avec a = x et b = 8 (car 8² = 64). Sa factorisation est (a
    - b)(a + b) = (x - 8)(x + 8).
- id: nblm-lorsqu-on-cherche-a-mettre-en-facteur-le-4
  type: choix
  difficulte: 2
  enonce: Lorsqu'on cherche à mettre en facteur le facteur commun le plus grand dans D = 12x² - 15x, quelle forme factorisée
    obtient-on ?
  reponse:
    options:
    - id: o1
      texte: 3x(4x - 5)
    - id: o2
      texte: 3(4x² - 5x)
    - id: o3
      texte: x(12x - 15)
    - id: o4
      texte: 3x(4x + 5)
    bonnes:
    - o1
  indices:
    relance: Recherche le plus grand diviseur commun à 12 et 15 ainsi que la puissance de x présente dans chaque terme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'La factorisation est incomplète : on a mis en facteur le nombre 3 mais on a oublié de mettre aussi la variable
      x en facteur.'
  - si:
      contient:
      - o3
    relance: 'La factorisation est incomplète : on a mis en facteur x mais on n''a pas extrait le plus grand diviseur commun
      numérique 3.'
  - si:
      contient:
      - o4
    relance: 'Erreur de signe : le second terme de l''expression initiale est négatif (-15x), donc la parenthèse contient
      -5.'
  solution: 3x(4x - 5). Le facteur commun le plus grand à 12x² et -15x est 3x. En mettant 3x en facteur, on obtient 3x(4x
    - 5).
- id: nblm-quelle-est-la-forme-reduite-de-l-express-5
  type: choix
  difficulte: 2
  enonce: Quelle est la forme réduite de l'expression E = 4x² + 7x - 2x² + 3x - 5 lorsqu'on décide de regrouper les termes
    semblables ?
  reponse:
    options:
    - id: o1
      texte: 2x² + 10x - 5
    - id: o2
      texte: 12x - 5
    - id: o3
      texte: 2x² + 4x - 5
    - id: o4
      texte: 6x² + 10x - 5
    bonnes:
    - o1
  indices:
    relance: Rassemble séparément les termes en x², les termes en x et les nombres constants.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur grave : additionner entre eux des termes de natures différentes comme 2x² et 10x.'
  - si:
      contient:
      - o3
    relance: 'Erreur de calcul : soustraire 3x au lieu de l''ajouter à 7x.'
  - si:
      contient:
      - o4
    relance: 'Erreur de signe : additionner 4x² et 2x² au lieu de faire la soustraction 4x² - 2x².'
  solution: 2x² + 10x - 5. On regroupe les termes en x² (4x² - 2x² = 2x²), les termes en x (7x + 3x = 10x) et le terme constant
    (-5).
- id: nblm-parmi-les-affirmations-suivantes-sur-le-6
  type: choix
  difficulte: 3
  enonce: Parmi les affirmations suivantes sur le calcul littéral, lesquelles sont EXACTES ? (Sélectionne les 2 bonnes réponses)
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Développer une expression consiste à transformer un produit en une somme.
    - id: o2
      texte: L'égalité a² - b² = (a - b)(a + b) permet de factoriser une différence de deux carrés.
    - id: o3
      texte: Pour réduire une expression, on peut additionner directement 2x² et 3x pour obtenir 5x³.
    - id: o4
      texte: Factoriser une expression signifie transformer une somme en produit en enlevant toutes les parenthèses.
    bonnes:
    - o1
    - o2
  indices:
    relance: Repense aux définitions fondamentales de la transformation des expressions algébriques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est une erreur classique : on ne peut regrouper que des termes de même nature. 2x² + 3x ne se réduit pas.'
  - si:
      contient:
      - o4
    relance: Factoriser transforme bien une somme en produit mais crée des parenthèses au lieu de les enlever.
  solution: 'Développer une expression consiste à transformer un produit en une somme ; L''égalité a² - b² = (a - b)(a + b)
    permet de factoriser une différence de deux carrés. C''est la définition exacte du développement : passer d''une écriture
    sous forme de produit à une écriture sous forme de somme.'
- id: nblm-complete-la-phrase-l-action-de-transform-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : L''action de transformer une somme algébrique en un produit de facteurs s''appelle __________
    .'
  reponse:
    acceptees:
    - factoriser
    fautes_tolerees: 1
  indices:
    relance: C'est l'opération inverse du développement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: factoriser. Factoriser est le terme exact désignant la transformation d'une somme en un produit.
- id: nblm-comment-appelle-t-on-la-methode-qui-cons-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la méthode qui consiste à regrouper les termes de même nature pour simplifier une expression
    algébrique ?
  reponse:
    acceptees:
    - réduire
    fautes_tolerees: 1
  indices:
    relance: Ce verbe désigne l'action de simplifier une expression en rassemblant les termes semblables.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: réduire. Réduire une expression consiste à regrouper les termes semblables pour l'écrire avec le moins de termes
    possible.
