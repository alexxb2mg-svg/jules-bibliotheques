# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: parallelisme-triangles-pythagore
version: 1
etat: verifiee
declencheurs:
- hypoténuse
- angles alternes-internes
- angles correspondants
- somme des angles d'un triangle
- inégalité triangulaire
- prouver qu'un triangle est rectangle
prerequis:
- 4e-theoreme-pythagore
- racine-carree
couverture: Les hauteurs, les médiatrices et les cas d'égalité des triangles sont rappelés dans le cours mais ne font pas
  l'objet d'exercices corrigés par le code.
essentiel: 'Parallélisme. Deux droites coupées par une sécante forment des angles alternes-internes et des angles correspondants.
  Si les deux droites sont parallèles, ces angles sont égaux. Réciproquement, si deux angles alternes-internes (ou correspondants)
  sont égaux, les droites sont parallèles. S''ils ne sont pas égaux, les droites ne sont pas parallèles.


  Triangles. La somme des trois angles d''un triangle vaut 180°. Inégalité triangulaire : dans un triangle, chaque côté est
  plus court que la somme des deux autres. Une hauteur passe par un sommet et est perpendiculaire au côté opposé ; la médiatrice
  d''un côté est perpendiculaire à ce côté en son milieu. Deux triangles sont égaux (superposables) s''ils ont trois côtés
  de mêmes longueurs, ou un angle égal compris entre deux côtés de mêmes longueurs, ou un côté de même longueur compris entre
  deux angles égaux.


  Théorème de Pythagore. Si un triangle est rectangle, le carré de l''hypoténuse (le plus long côté, en face de l''angle droit)
  est égal à la somme des carrés des deux autres côtés. Réciproque : si, dans un triangle, le carré du plus long côté est
  égal à la somme des carrés des deux autres, le triangle est rectangle. Si l''égalité est fausse, le triangle n''est pas
  rectangle (contraposée).'
methode:
- Faire une figure à main levée et coder les angles droits et les longueurs connues.
- 'Pour calculer une longueur dans un triangle rectangle : repérer l''hypoténuse, écrire l''égalité de Pythagore avec les
  noms des points, remplacer par les longueurs connues.'
- Si on cherche l'hypoténuse, on additionne les carrés ; si on cherche un côté de l'angle droit, on soustrait les carrés.
- Terminer par la racine carrée, puis arrondir comme demandé en écrivant l'unité.
- 'Pour savoir si un triangle est rectangle : calculer séparément le carré du plus long côté et la somme des carrés des deux
  autres, puis comparer.'
- 'Pour montrer que deux droites sont parallèles : trouver deux angles alternes-internes (ou correspondants) et comparer leurs
  mesures.'
vocabulaire:
- terme: hypoténuse
  definition: Le côté opposé à l'angle droit dans un triangle rectangle ; c'est le plus long côté.
- terme: sécante
  definition: Une droite qui coupe deux autres droites.
- terme: angles alternes-internes
  definition: Deux angles situés de part et d'autre de la sécante, entre les deux droites.
- terme: angles correspondants
  definition: Deux angles situés du même côté de la sécante, l'un entre les droites et l'autre à l'extérieur, placés de la
    même façon.
erreurs_frequentes:
- Additionner les carrés alors qu'on cherche un côté de l'angle droit (il faut soustraire).
- 'Oublier la racine carrée à la fin : on donne alors le carré de la longueur.'
- 'Utiliser le théorème de Pythagore pour prouver qu''un triangle est rectangle : c''est la réciproque qu''il faut citer.'
- Pour la réciproque, ne pas choisir le plus long côté comme hypoténuse possible.
- Conclure que deux droites sont parallèles parce que les angles ont des mesures proches (73° et 75° ne sont pas égaux).
- Soustraire les longueurs au lieu de soustraire leurs carrés.
exemple:
  enonce: Le triangle EFG est rectangle en E, avec EF = 5 cm et EG = 7 cm. Calcule FG, arrondi au dixième.
  solution: L'hypoténuse est [FG], en face de l'angle droit. D'après le théorème de Pythagore, FG² = EF² + EG² = 25 + 49 =
    74. Donc FG = √74 ≈ 8,6 cm.
exercices:
- id: troisieme-angle
  type: nombre
  difficulte: 1
  enonce: Dans le triangle ABC, l'angle en A mesure 47° et l'angle en B mesure 68°. Combien mesure l'angle en C, en degrés
    ?
  reponse:
    valeur: 65
    forme: libre
  indices:
    relance: Que vaut la somme des trois angles de n'importe quel triangle ?
    methode: Additionne les deux angles connus, puis retire ce total à 180°.
    etape: 'Première étape : 47 + 68 = 115. Il reste à calculer 180 − 115.'
  pieges:
  - si:
      valeur: 115
    relance: Tu as additionné les deux angles donnés. Que dois-tu faire ensuite avec la somme 180° ?
  - si:
      valeur: 245
    relance: Un angle d'un triangle ne peut pas dépasser 180°. Faut-il ajouter ou retirer ?
  solution: La somme des angles d'un triangle vaut 180°. Angle C = 180 − 47 − 68 = 65°.
- id: cote-angle-droit
  type: nombre
  difficulte: 2
  enonce: Le triangle RST est rectangle en S. On sait que RT = 9,5 cm et RS = 6 cm. Calcule ST, arrondi au dixième de centimètre.
  reponse:
    valeur: 7.4
    forme: libre
    tolerance: 0.05
  indices:
    relance: Quel est le côté en face de l'angle droit ? Est-ce lui que tu cherches ?
    methode: Écris l'égalité de Pythagore avec l'hypoténuse seule d'un côté, puis isole ST² en soustrayant.
    etape: RT² = RS² + ST², donc ST² = 9,5² − 6². Calcule ce nombre, puis prends sa racine carrée.
  pieges:
  - si:
      valeur: 11.2
    relance: Ton résultat est plus long que l'hypoténuse RT. Est-ce possible ? Faut-il additionner ou soustraire les carrés
      ?
  - si:
      valeur: 54.25
    relance: Tu as trouvé ST², pas ST. Que reste-t-il à faire ?
  - si:
      valeur: 3.5
    relance: On ne soustrait pas les longueurs elles-mêmes, mais leurs carrés.
  solution: '[RT] est l''hypoténuse. D''après le théorème de Pythagore, RT² = RS² + ST², donc ST² = 90,25 − 36 = 54,25 et
    ST = √54,25 ≈ 7,4 cm.'
- id: lesquels-sont-rectangles
  type: choix
  difficulte: 2
  enonce: Voici les longueurs des côtés de quatre triangles. Lesquels sont rectangles ?
  reponse:
    options:
    - id: a
      texte: 6 cm, 8 cm et 10 cm
    - id: b
      texte: 5 cm, 6 cm et 8 cm
    - id: c
      texte: 8 cm, 15 cm et 17 cm
    - id: d
      texte: 7 cm, 9 cm et 12 cm
    bonnes:
    - a
    - c
  indices:
    relance: Dans chaque triangle, quel côté pourrait être l'hypoténuse ?
    methode: Pour chaque triangle, calcule le carré du plus long côté, puis la somme des carrés des deux autres, et compare.
    etape: 'Premier triangle : 10² = 100 et 6² + 8² = 36 + 64. Fais la même chose pour les trois autres.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Pour 5, 6 et 8 : compare 8² avec 5² + 6². Sont-ils égaux ?'
  - si:
      contient:
      - d
    relance: 'Pour 7, 9 et 12 : compare 12² avec 7² + 9². Sont-ils égaux ?'
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé, mais pas tous. Refais le calcul pour chaque triangle que tu n'as pas choisi.
  solution: 'Réciproque de Pythagore : 6² + 8² = 100 = 10² (rectangle) ; 5² + 6² = 61 et 8² = 64 (pas rectangle) ; 8² + 15²
    = 289 = 17² (rectangle) ; 7² + 9² = 130 et 12² = 144 (pas rectangle). Les triangles rectangles sont le premier et le troisième.'
- id: angles-presque-egaux
  type: choix
  difficulte: 2
  enonce: Les droites (d) et (d') sont coupées par la sécante (s). Deux angles alternes-internes mesurent 73° et 75°. Que
    peut-on conclure ?
  reponse:
    options:
    - id: a
      texte: Les droites (d) et (d') sont parallèles.
    - id: b
      texte: Les droites (d) et (d') ne sont pas parallèles.
    - id: c
      texte: Les droites (d) et (d') sont perpendiculaires.
    - id: d
      texte: On ne peut rien dire sur les droites (d) et (d').
    bonnes:
    - b
  indices:
    relance: Si les droites étaient parallèles, que saurait-on des angles alternes-internes ?
    methode: 'Compare les deux mesures : sont-elles exactement égales ? Utilise la propriété dans le sens « si les droites
      sont parallèles, alors... ».'
    etape: Des droites parallèles donnent des angles alternes-internes égaux. Ici, 73° et 75° sont-ils égaux ?
  pieges:
  - si:
      contient:
      - a
    relance: 73° et 75° sont proches, mais sont-ils égaux ? En géométrie, « presque égal » ne suffit pas.
  - si:
      contient:
      - c
    relance: Des droites perpendiculaires à quoi ? Rien dans l'énoncé ne parle d'angle droit.
  - si:
      contient:
      - d
    relance: Si les droites étaient parallèles, les deux angles seraient égaux. Est-ce le cas ? Qu'en déduis-tu ?
  solution: Si (d) et (d') étaient parallèles, les angles alternes-internes seraient égaux. Or 73° ≠ 75°. Donc les droites
    (d) et (d') ne sont pas parallèles.
- id: construire-triangle
  type: texte_court
  difficulte: 1
  enonce: Peut-on construire un triangle dont les côtés mesurent 3 cm, 4 cm et 8 cm ? Réponds par oui ou par non.
  reponse:
    acceptees:
    - non
    fautes_tolerees: 0
  indices:
    relance: Compare le plus grand côté avec la somme des deux autres.
    methode: 'Inégalité triangulaire : le plus long côté doit être plus court que la somme des deux autres.'
    etape: Calcule 3 + 4, puis compare ce résultat à 8.
  pieges:
  - si:
      valeur: oui
    relance: 'Essaie de le tracer : avec 3 cm et 4 cm, peux-tu atteindre les deux bouts d''un segment de 8 cm ?'
  solution: 'Non : 3 + 4 = 7, et 7 < 8. Le plus long côté est plus grand que la somme des deux autres, les deux petits côtés
    ne peuvent pas se rejoindre.'
- id: demontrer-rectangle
  type: ouverte
  difficulte: 3
  enonce: Le triangle MNP a pour côtés MN = 4,8 cm, NP = 6,4 cm et MP = 8 cm. Démontre que ce triangle est rectangle et précise
    en quel point.
  criteres:
  - L'élève calcule séparément MP² (le carré du plus long côté) et MN² + NP².
  - L'élève constate l'égalité des deux résultats et cite la réciproque du théorème de Pythagore (pas le théorème direct).
  - L'élève conclut que MNP est rectangle en N, le sommet opposé au plus long côté.
  indices:
    relance: Quel est le plus long côté ? Où serait l'angle droit si le triangle était rectangle ?
    methode: Calcule d'un côté le carré du plus long côté, de l'autre la somme des carrés des deux autres, puis compare.
    etape: MP² = 8² = 64. Calcule maintenant MN² + NP².
  solution: Le plus long côté est [MP]. MP² = 64. MN² + NP² = 23,04 + 40,96 = 64. Donc MP² = MN² + NP². D'après la réciproque
    du théorème de Pythagore, le triangle MNP est rectangle en N.
- id: nblm-dans-un-triangle-rectangle-comment-appel-1
  type: choix
  difficulte: 2
  enonce: Dans un triangle rectangle, comment appelle-t-on le côté situé en face de l'angle droit, qui est également le plus
    long côté du triangle ?
  reponse:
    options:
    - id: o1
      texte: L'hypoténuse
    - id: o2
      texte: La médiatrice
    - id: o3
      texte: La sécante
    - id: o4
      texte: Le côté adjacent
    bonnes:
    - o1
  indices:
    relance: Pense au nom spécifique donné au plus grand côté d'un triangle rectangle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la médiatrice est une droite perpendiculaire à un segment en son milieu, et non un côté du
      triangle.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : une sécante est une droite qui en coupe deux autres, pas un côté de triangle.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : le côté adjacent touche l''un des angles aigus, ce n''est pas le côté opposé à l''angle droit.'
  solution: 'L''hypoténuse. C''est la définition exacte : l''hypoténuse est le côté opposé à l''angle droit et le plus long
    côté d''un triangle rectangle.'
- id: nblm-dans-un-triangle-abc-la-mesure-de-l-angl-2
  type: choix
  difficulte: 2
  enonce: Dans un triangle ABC, la mesure de l'angle A vaut 50° et celle de l'angle B vaut 60°. Quelle est la mesure de l'angle
    C ?
  reponse:
    options:
    - id: o1
      texte: 70°
    - id: o2
      texte: 90°
    - id: o3
      texte: 110°
    - id: o4
      texte: 180°
    bonnes:
    - o1
  indices:
    relance: Utilise la propriété sur la somme des trois angles dans n'importe quel triangle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : supposer systématiquement que le triangle est rectangle sans le vérifier.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : additionner les deux angles connus (50° + 60°) mais oublier de soustraire ce résultat à 180°.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre la mesure d''un seul angle avec la somme des trois angles du triangle.'
  solution: '70°. C''est exact car la somme des angles d''un triangle vaut 180° : 180° - (50° + 60°) = 180° - 110° = 70°.'
- id: nblm-que-stipule-l-inegalite-triangulaire-con-3
  type: choix
  difficulte: 2
  enonce: Que stipule l'inégalité triangulaire concernant la longueur des côtés d'un triangle ?
  reponse:
    options:
    - id: o1
      texte: Chaque côté est plus court que la somme des deux autres.
    - id: o2
      texte: Le plus grand côté est égal à la somme des deux autres.
    - id: o3
      texte: La somme des carrés de deux côtés vaut le carré du troisième.
    - id: o4
      texte: Chaque côté est plus grand que la somme des deux autres.
    bonnes:
    - o1
  indices:
    relance: Compare la longueur d'un côté au trajet passant par le troisième sommet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : dans ce cas, les trois points sont alignés et le triangle est dit aplati.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : cette relation correspond à l''égalité de Pythagore pour un triangle rectangle, pas à l''inégalité
      triangulaire.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : c''est l''inverse, car le chemin en ligne droite est le plus court entre deux points.'
  solution: 'Chaque côté est plus court que la somme des deux autres. C''est la règle exacte : dans un triangle, la longueur
    de chaque côté est strictement inférieure à la somme des longueurs des deux autres côtés.'
- id: nblm-quelle-propriete-permet-de-prouver-qu-un-4
  type: choix
  difficulte: 2
  enonce: Quelle propriété permet de prouver qu'un triangle est rectangle lorsqu'on connaît la longueur de ses trois côtés
    ?
  reponse:
    options:
    - id: o1
      texte: La réciproque du théorème de Pythagore
    - id: o2
      texte: Le théorème de Pythagore direct
    - id: o3
      texte: L'inégalité triangulaire
    - id: o4
      texte: La somme des angles d'un triangle
    bonnes:
    - o1
  indices:
    relance: Cherche l'outil théorème spécialement dédié à prouver qu'un angle droit existe à partir des longueurs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le théorème direct sert à calculer une longueur sachant déjà que le triangle est rectangle.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''inégalité triangulaire sert uniquement à tester la possibilité de construire un triangle,
      pas à prouver qu''il est rectangle.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : sans connaître la mesure des angles en degrés, cette propriété ne permet pas d''établir la
      présence d''un angle droit.'
  solution: 'La réciproque du théorème de Pythagore. C''est exact : la réciproque du théorème de Pythagore permet de démontrer
    qu''un triangle a un angle droit à partir de l''égalité des carrés de ses côtés.'
- id: nblm-si-deux-droites-coupees-par-une-secante-5
  type: choix
  difficulte: 2
  enonce: Si deux droites coupées par une sécante forment des angles alternes-internes de même mesure, que peut-on affirmer
    sur ces deux droites ?
  reponse:
    options:
    - id: o1
      texte: Elles sont parallèles.
    - id: o2
      texte: Elles sont perpendiculaires.
    - id: o3
      texte: Elles sont sécantes non perpendiculaires.
    - id: o4
      texte: On ne peut pas conclure sans mesurer les segments.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la propriété de caractérisation angulaire du parallélisme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la propriété établit que les droites ne se coupent pas, et non qu''elles forment un angle droit
      entre elles.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : si les angles alternes-internes sont égaux, les droites ne peuvent pas se croiser.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la caractérisation du parallélisme est uniquement géométrique et angulaire, indépendante de
      toute longueur.'
  solution: 'Elles sont parallèles. C''est exact : l''égalité de deux angles alternes-internes caractérise le parallélisme
    des deux droites.'
- id: nblm-lorsque-deux-droites-paralleles-sont-cou-6
  type: choix
  difficulte: 3
  enonce: Lorsque deux droites parallèles sont coupées par une même droite sécante, quelles paires d'angles sont nécessairement
    de même mesure ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Les angles alternes-internes
    - id: o2
      texte: Les angles correspondants
    - id: o3
      texte: Les angles adjacents formant un angle plat
    - id: o4
      texte: Toutes les paires d'angles de la figure
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux configurations d'angles égales garanties par le parallélisme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : deux angles adjacents sur une même droite sont supplémentaires (leur somme vaut 180°), ils
      ne sont égaux que s''ils mesurent chacun 90°.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : les angles aigus et obtus de la figure ne sont pas égaux entre eux, mais supplémentaires.'
  solution: 'Les angles alternes-internes ; Les angles correspondants. C''est exact : deux droites parallèles coupées par
    une sécante forment des angles alternes-internes égaux.'
- id: nblm-dans-un-triangle-abc-rectangle-en-a-avec-7
  type: texte_court
  difficulte: 1
  enonce: Dans un triangle ABC rectangle en A, avec AB = 3 cm et AC = 4 cm, quelle est la longueur de l'hypoténuse BC ?
  reponse:
    acceptees:
    - 5 cm
    fautes_tolerees: 1
  indices:
    relance: Calcule la somme des carrés des deux côtés de l'angle droit, puis extrait la racine carrée du résultat.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 5 cm. En appliquant le théorème de Pythagore, BC² = AB² + AC² = 3² + 4² = 9 + 16 = 25, d'où BC = √25 = 5 cm.
- id: nblm-dans-un-triangle-rst-rectangle-en-s-l-hy-8
  type: texte_court
  difficulte: 1
  enonce: Dans un triangle RST rectangle en S, l'hypoténuse RT mesure 10 cm et le côté ST mesure 6 cm. Quelle est la longueur
    du côté RS ?
  reponse:
    acceptees:
    - 8 cm
    fautes_tolerees: 1
  indices:
    relance: Comme tu cherches un côté de l'angle droit, soustrais le carré du côté connu au carré de l'hypoténuse.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: '8 cm. Comme on cherche un côté de l''angle droit, on soustrait les carrés : RS² = RT² - ST² = 10² - 6² = 100
    - 36 = 64, d''où RS = √64 = 8 cm.'
