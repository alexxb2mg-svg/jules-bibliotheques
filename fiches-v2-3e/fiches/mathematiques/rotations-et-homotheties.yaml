# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: rotations-et-homotheties
version: 2
etat: verifiee
declencheurs:
- quart de tour
- sens des aiguilles d'une montre
- tourner une figure autour d'un point
- agrandir à partir d'un point
- rapport négatif
- motif qui tourne autour du centre
- demi-tour autour d'un point
- image par une rotation
- réduire à partir d'un point
prerequis:
- 4e-agrandissement-reduction-translation
- 4e-translation-pavages
essentiel: 'Rotation. Une rotation est définie par un centre O, un angle et un sens (sens des aiguilles d''une montre, ou
  sens contraire). L''image A'' d''un point A vérifie OA'' = OA et l''angle AOA'' est égal à l''angle de la rotation.


  La rotation conserve les longueurs, les angles, les aires, le parallélisme et l''alignement : la figure tourne sans se déformer.
  La symétrie centrale est la rotation d''un demi-tour (180°).


  Homothétie. Une homothétie est définie par un centre O et un rapport k (un nombre non nul). Si k est positif, A'' est sur
  la demi-droite [OA) et OA'' = k × OA. Si k est négatif, A'' est de l''autre côté de O, et OA'' = (−k) × OA.


  Effets de l''homothétie de rapport k : les longueurs sont multipliées par k si k > 0 (par −k si k < 0, car une longueur
  est toujours positive). Les aires sont multipliées par k². Les angles, le parallélisme et l''alignement sont conservés.


  Si la valeur de k sans son signe est plus grande que 1, c''est un agrandissement ; entre 0 et 1, c''est une réduction. Une
  figure et son image par une homothétie ont la même forme : leurs triangles sont semblables.


  Frises, pavages, rosaces. Une rosace de n motifs identiques autour d''un centre s''obtient par des rotations d''angle 360°
  ÷ n. Une frise se construit par des translations ou des symétries. Un motif répété de plus en plus grand à partir d''un
  même point fait penser à une homothétie.


  Raisonnement. Pour justifier, cite la propriété : « la rotation conserve les longueurs », « l''homothétie conserve les angles
  ». Exemple : si ABC est rectangle en A et A''B''C'' est son image par une homothétie, alors A''B''C'' est rectangle en A''.


  Au brevet : reconnaître la transformation, calculer une longueur ou une aire image, repérer une rotation dans un pavage
  ou une rosace, et justifier.

  '
methode:
- 'Pour construire l''image d''un point par une rotation : tracer [OA], reporter l''angle au rapporteur dans le bon sens,
  puis reporter la longueur OA au compas.'
- 'Pour construire l''image d''un point par une homothétie : tracer la droite (OA), puis placer A'' à la distance |k| × OA
  de O, du même côté si k > 0 et de l''autre côté si k < 0.'
- 'Pour calculer une longueur image : multiplier par le rapport (sans le signe) pour une homothétie, recopier la longueur
  pour une rotation.'
- 'Pour calculer une aire image par une homothétie : multiplier par le carré du rapport.'
- 'Pour une rosace : diviser 360° par le nombre de motifs pour trouver l''angle de la rotation.'
- 'Pour justifier : citer la propriété conservée (« la rotation conserve les longueurs », « l''homothétie conserve les angles
  »...).'
vocabulaire:
- terme: centre
  definition: Le point fixe autour duquel on tourne (rotation) ou à partir duquel on agrandit ou réduit (homothétie).
- terme: rapport
  definition: 'Le nombre k d''une homothétie : il dit par combien les distances au centre sont multipliées et de quel côté
    se trouve l''image.'
- terme: rosace
  definition: Une figure formée d'un motif répété par rotations autour d'un même centre.
- terme: image
  definition: La figure obtenue après avoir appliqué la transformation à la figure de départ.
- terme: symétrie centrale
  definition: Une rotation d'un demi-tour (180°) autour d'un point.
- terme: pavage
  definition: Un recouvrement du plan par des motifs identiques, sans trou ni chevauchement.
- terme: conservation
  definition: Une propriété est conservée quand la figure image la garde, comme les longueurs par une rotation.
erreurs_frequentes:
- 'Tourner dans le mauvais sens : bien lire « sens des aiguilles d''une montre » ou « sens contraire ».'
- Croire qu'une rotation change les longueurs.
- Multiplier une aire par k au lieu de k² dans une homothétie.
- Donner une longueur négative quand le rapport est négatif.
- Placer l'image du même côté du centre alors que le rapport est négatif.
exemple:
  enonce: Par l'homothétie de centre O et de rapport 1,5, le segment [AB] a pour image [A'B']. On sait que AB = 4 cm. Combien
    mesure A'B' ? Et si le triangle OAB a une aire de 6 cm², quelle est l'aire de OA'B' ?
  solution: 'Les longueurs sont multipliées par 1,5 : A''B'' = 1,5 × 4 = 6 cm. Les aires sont multipliées par 1,5² = 2,25
    : l''aire de OA''B'' est 2,25 × 6 = 13,5 cm².'
exercices:
- id: reconnaitre-transformation
  type: association
  difficulte: 1
  enonce: Associe chaque description à la transformation qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: La figure tourne autour d'un point, sans changer de taille.
    - id: b
      texte: La figure est agrandie ou réduite à partir d'un point.
    - id: c
      texte: La figure glisse dans une direction, sans tourner.
    - id: d
      texte: La figure est retournée comme dans un miroir, par rapport à une droite.
    droite:
    - id: w
      texte: rotation
    - id: x
      texte: homothétie
    - id: y
      texte: translation
    - id: z
      texte: symétrie axiale
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Pour chaque description, la taille de la figure change-t-elle ? La figure tourne-t-elle ?
    methode: Une seule transformation change la taille de la figure. Une seule utilise une droite comme un miroir.
    etape: 'Commence par la description qui parle d''agrandir ou de réduire : quelle transformation fait cela ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la description qui parle de tourner et celle qui parle de glisser.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque description : la taille change-t-elle ? La figure tourne-t-elle, glisse-t-elle ou se retourne-t-elle
      ?'
  solution: 'Tourner autour d''un point : rotation. Agrandir ou réduire à partir d''un point : homothétie. Glisser sans tourner
    : translation. Retourner comme dans un miroir : symétrie axiale.'
- id: longueur-image-homothetie
  type: nombre
  difficulte: 1
  enonce: Par une homothétie de rapport 3, le segment [AB] a pour image le segment [A'B']. On sait que AB = 2,5 cm. Combien
    mesure A'B', en cm ?
  reponse:
    valeur: 7.5
    forme: libre
  indices:
    relance: Une homothétie de rapport 3 agrandit-elle ou réduit-elle la figure ?
    methode: Dans une homothétie de rapport positif k, chaque longueur est multipliée par k.
    etape: Il faut calculer 3 × 2,5.
  pieges:
  - si:
      valeur: 5.5
    relance: Tu as ajouté le rapport à la longueur. Que fait-on à une longueur dans une homothétie ?
  solution: 'Les longueurs sont multipliées par le rapport 3 : A''B'' = 3 × 2,5 = 7,5 cm.'
- id: conservation-rotation
  type: choix
  difficulte: 1
  enonce: Une rotation transforme une figure en une autre figure. Quelles grandeurs ou propriétés sont conservées ?
  reponse:
    options:
    - id: a
      texte: les longueurs
    - id: b
      texte: les mesures des angles
    - id: c
      texte: les aires
    - id: d
      texte: la position de la figure
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Une rotation déforme-t-elle la figure, ou la fait-elle seulement tourner ?
    methode: Pense à une feuille qu'on fait tourner sur une table. Sa forme change-t-elle ? Sa taille ? Sa place ?
    etape: Longueurs, angles et aires ne changent pas quand la figure tourne. La position, elle, change-t-elle ?
  pieges:
  - si:
      contient:
      - d
    relance: Une figure qui tourne autour d'un point change de place, sauf si elle est sur son centre. Cette position est-elle
      conservée ?
  - si:
      diagnostic: incomplet
    relance: Il en manque. Une figure qui tourne sans se déformer garde plusieurs grandeurs. Relis chaque proposition.
  solution: La rotation conserve les longueurs, les angles et les aires (réponses a, b, c). La position de la figure change.
- id: aire-image-homothetie
  type: nombre
  difficulte: 2
  enonce: Un triangle a une aire de 6 cm². On construit son image par une homothétie de rapport 2. Quelle est l'aire du triangle
    image, en cm² ?
  reponse:
    valeur: 24
    forme: libre
  indices:
    relance: Si chaque longueur est multipliée par 2, la base et la hauteur le sont aussi. Que devient l'aire ?
    methode: Dans une homothétie de rapport k, les aires sont multipliées par k².
    etape: Calcule d'abord 2², puis multiplie l'aire de départ par ce nombre.
  pieges:
  - si:
      valeur: 12
    relance: 'Tu as multiplié l''aire par 2, comme une longueur. Mais la base et la hauteur sont toutes les deux multipliées
      par 2 : que devient leur produit ?'
  solution: 'Les aires sont multipliées par le carré du rapport : 2² = 4, donc l''aire image vaut 4 × 6 = 24 cm².'
- id: rapport-negatif
  type: choix
  difficulte: 2
  enonce: On applique à une figure une homothétie de centre O et de rapport −2. Comment est la figure image ?
  reponse:
    options:
    - id: a
      texte: Deux fois plus grande, du même côté du centre O.
    - id: b
      texte: Deux fois plus grande, de l'autre côté du centre O.
    - id: c
      texte: Deux fois plus petite, de l'autre côté du centre O.
    - id: d
      texte: Deux fois plus petite, du même côté du centre O.
    bonnes:
    - b
  indices:
    relance: Que t'apprend le signe du rapport ? Et le nombre sans son signe ?
    methode: Si le rapport est négatif, l'image est de l'autre côté du centre. Les distances sont multipliées par le rapport
      sans son signe.
    etape: 'Sans son signe, le rapport vaut 2 : les distances au centre sont-elles multipliées ou divisées par 2 ?'
  pieges:
  - si:
      contient:
      - a
    relance: 'La taille est juste, mais regarde le signe du rapport : de quel côté du centre se trouve l''image ?'
  - si:
      contient:
      - c
    relance: Le côté est juste. Mais multiplier les distances par 2, est-ce agrandir ou réduire ?
  - si:
      contient:
      - d
    relance: 'Regarde le signe et la valeur du rapport séparément : l''un dit de quel côté, l''autre dit si on agrandit.'
  solution: 'Le rapport −2 est négatif : l''image est de l''autre côté du centre O. Sans le signe, il vaut 2 : les longueurs
    sont multipliées par 2. La figure image est deux fois plus grande, de l''autre côté de O.'
- id: distance-au-centre
  type: nombre
  difficulte: 2
  enonce: Par l'homothétie de centre O et de rapport −3, le point A a pour image A'. On sait que OA = 2 cm. Quelle est la
    distance OA', en cm ?
  reponse:
    valeur: 6
    forme: libre
  indices:
    relance: Une distance peut-elle être négative ? Que devient le rapport quand on l'utilise pour une longueur ?
    methode: 'Pour un rapport négatif k, OA'' = (−k) × OA : on utilise le rapport sans son signe.'
    etape: Sans son signe, le rapport vaut 3. Calcule 3 × 2.
  pieges:
  - si:
      valeur: -6
    relance: Une longueur est toujours positive. Le signe du rapport dit seulement de quel côté de O se trouve A'.
  - si:
      valeur: 5
    relance: Tu as ajouté au lieu de multiplier. Que fait le rapport aux distances au centre ?
  solution: Le rapport est −3, donc OA' = 3 × OA = 3 × 2 = 6 cm, avec A' de l'autre côté de O par rapport à A.
- id: angle-rosace
  type: nombre
  difficulte: 2
  enonce: Une rosace est formée de 6 pétales identiques, régulièrement répartis autour d'un centre O. Quel est l'angle, en
    degrés, de la rotation de centre O qui envoie un pétale sur le pétale voisin ?
  reponse:
    valeur: 60
    forme: libre
  indices:
    relance: Combien de degrés fait un tour complet autour du centre ?
    methode: 'Les pétales se partagent le tour complet en parts égales : divise le tour par le nombre de pétales.'
    etape: Il faut calculer 360 ÷ 6.
  pieges:
  - si:
      valeur: 30
    relance: Avec cet angle, il faudrait 12 rotations pour faire un tour complet. Combien y a-t-il de pétales ?
  - si:
      valeur: 72
    relance: Cet angle conviendrait pour 5 pétales. Combien y en a-t-il ici ?
  solution: 'Un tour complet fait 360°, partagé en 6 parts égales : 360 ÷ 6 = 60°.'
- id: image-par-rotation
  type: ouverte
  difficulte: 3
  enonce: Le triangle ABC est rectangle en A, avec AB = 3 cm, AC = 4 cm et BC = 5 cm. Le triangle A'B'C' est son image par
    une rotation de centre O et d'angle 90°. Quelle est la nature du triangle A'B'C' ? Quel est son périmètre ? Justifie.
  criteres:
  - L'élève dit que la rotation conserve les angles, donc que A'B'C' est rectangle en A'.
  - L'élève dit que la rotation conserve les longueurs (A'B' = 3 cm, A'C' = 4 cm, B'C' = 5 cm) et trouve un périmètre de 12
    cm.
  indices:
    relance: Une rotation déforme-t-elle la figure ?
    methode: 'Cite les propriétés conservées par une rotation : les longueurs et les angles.'
    etape: L'angle en A mesure 90°. Que peux-tu dire de l'angle en A' ? Et de la longueur A'B' ?
  solution: 'La rotation conserve les angles : l''angle en A'' est droit, A''B''C'' est rectangle en A''. Elle conserve les
    longueurs : A''B'' = 3 cm, A''C'' = 4 cm, B''C'' = 5 cm. Le périmètre de A''B''C'' est 3 + 4 + 5 = 12 cm.'
