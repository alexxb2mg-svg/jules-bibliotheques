format: 2
notion: thales-triangles-semblables-trigonometrie
version: 2
etat: generee
declencheurs:
- côté adjacent
- côté opposé à l'angle
- sohcahtoa
- configuration papillon
- triangles emboîtés
- mêmes angles mais pas la même taille
- hauteur d'un arbre
- angle avec la calculatrice
- droites parallèles longueurs
- produit en croix longueurs
prerequis:
- parallelisme-triangles-pythagore
- 4e-cosinus-angle
- 4e-proportionnalite-4e
essentiel: |
  Théorème de Thalès. Deux droites (BM) et (CN) se coupent en A. Si (MN) et (BC) sont parallèles, alors AM/AB = AN/AC = MN/BC.

  Deux configurations : les triangles emboîtés (M sur [AB] et N sur [AC], du même côté de A) et le papillon (A est entre M et B, et entre N et C).

  Astuce : mets toujours les longueurs d'un même triangle en haut des rapports, et celles de l'autre triangle en bas. Exemple : AM = 3, AB = 9, BC = 12 et (MN) // (BC). Alors MN/12 = 3/9, donc MN = 12 × 3 ÷ 9 = 4.

  Réciproque de Thalès. Si les points A, M, B et A, N, C sont alignés dans le même ordre et si AM/AB = AN/AC, alors (MN) et (BC) sont parallèles. Si les deux rapports sont différents, les droites ne sont pas parallèles. Compare les rapports sans les arrondir.

  Triangles semblables. Deux triangles sont semblables si leurs angles sont égaux deux à deux. Deux angles égaux suffisent, car le troisième se déduit de la somme 180°. Leurs côtés correspondants (opposés aux angles égaux) sont proportionnels. Le coefficient k est le rapport d'agrandissement ou de réduction : les longueurs sont multipliées par k, les aires par k². Les triangles AMN et ABC de la figure de Thalès sont semblables.

  Trigonométrie. Dans un triangle rectangle, pour un angle aigu : cosinus = côté adjacent ÷ hypoténuse ; sinus = côté opposé ÷ hypoténuse ; tangente = côté opposé ÷ côté adjacent (mnémonique : CAH SOH TOA). Le cosinus et le sinus d'un angle aigu sont compris entre 0 et 1.

  Calculer une longueur : cos 40° = KL/8 donne KL = 8 × cos 40°. Calculer un angle : si tan D = 7/5, alors D = arctan(7/5) avec la touche tan⁻¹. La calculatrice doit être en mode degrés.

  Au brevet : hauteur inaccessible, ombre, échelle contre un mur. Nomme le théorème, dis quelles droites sont parallèles (ou quel angle est droit), puis calcule.
methode:
- 'Faire une figure à main levée et repérer la configuration : deux droites sécantes et deux droites parallèles (Thalès), ou un angle droit (trigonométrie).'
- 'Thalès : écrire les trois rapports égaux en mettant en haut les longueurs du petit triangle et en bas celles du grand triangle, puis remplacer par les longueurs connues.'
- Choisir les deux rapports utiles et calculer la longueur cherchée par un produit en croix.
- 'Réciproque : calculer séparément les deux rapports, vérifier l''ordre des points, comparer, puis conclure (parallèles si égaux, sinon non).'
- 'Trigonométrie : repérer l''hypoténuse, puis le côté opposé et le côté adjacent à l''angle utilisé, et choisir la formule qui relie les deux côtés en jeu.'
- Calculer avec la calculatrice en mode degrés, arrondir seulement à la fin, et écrire l'unité.
vocabulaire:
- terme: côté adjacent
  definition: Dans un triangle rectangle, le côté de l'angle aigu étudié qui n'est pas l'hypoténuse.
- terme: côté opposé
  definition: Dans un triangle rectangle, le côté qui fait face à l'angle aigu étudié.
- terme: hypoténuse
  definition: Le côté opposé à l'angle droit ; c'est le plus long côté du triangle rectangle.
- terme: triangles semblables
  definition: Des triangles qui ont les mêmes angles ; l'un est un agrandissement ou une réduction de l'autre.
- terme: triangles emboîtés
  definition: Configuration de Thalès où le petit triangle est dans le grand et partage un sommet avec lui.
- terme: papillon
  definition: Configuration de Thalès où les deux triangles sont de part et d'autre du sommet commun.
- terme: coefficient de proportionnalité
  definition: Le nombre par lequel on multiplie les côtés d'un triangle pour obtenir les côtés correspondants de l'autre.
erreurs_frequentes:
- 'Inverser un rapport de Thalès, ou écrire AM/MB au lieu de AM/AB : le rapport compare un côté du petit triangle à un côté du grand.'
- Utiliser le théorème de Thalès sans avoir vérifié que les droites sont parallèles.
- Confondre le côté opposé et le côté adjacent, ou prendre le cosinus quand il faut le sinus ou la tangente.
- Oublier de régler la calculatrice en degrés.
- Pour la réciproque, arrondir les rapports ou oublier de vérifier l'ordre des points.
exemple:
  enonce: Le triangle KLM est rectangle en K. L'angle en L mesure 40° et LM = 8 cm. Calcule KL, arrondi au dixième.
  solution: '[LM] est l''hypoténuse et [KL] est le côté adjacent à l''angle en L. Donc cos 40° = KL/LM, soit KL = 8 × cos 40° ≈ 6,1 cm.'
exercices:
- id: choisir-formule
  type: choix
  difficulte: 1
  enonce: Dans un triangle rectangle, on connaît le côté opposé et le côté adjacent à un angle aigu, et on veut calculer cet angle. Quelle ligne trigonométrique faut-il utiliser ?
  reponse:
    options:
    - id: a
      texte: le cosinus
    - id: b
      texte: le sinus
    - id: c
      texte: la tangente
    - id: d
      texte: le théorème de Thalès
    bonnes:
    - c
  indices:
    relance: Quels côtés du triangle connais-tu ? L'hypoténuse fait-elle partie des côtés connus ?
    methode: Le cosinus et le sinus utilisent l'hypoténuse. Une seule ligne trigonométrique relie le côté opposé et le côté adjacent.
    etape: 'Le quotient côté opposé ÷ côté adjacent porte un nom précis parmi cosinus, sinus et tangente : lequel ?'
  pieges:
  - si:
      contient:
      - a
    relance: Le cosinus utilise le côté adjacent, mais avec quel autre côté ? Ce côté est-il connu ici ?
  - si:
      contient:
      - b
    relance: Le sinus utilise l'hypoténuse. Ici, tu ne la connais pas. Quels sont les deux côtés donnés ?
  - si:
      contient:
      - d
    relance: Thalès demande des droites parallèles. Ici il n'y a pas de parallèles, mais un triangle rectangle.
  solution: 'On connaît le côté opposé et le côté adjacent : le quotient opposé ÷ adjacent est la tangente. On calcule tan(angle) = opposé/adjacent, puis on utilise arctan.'
- id: thales-emboites
  type: nombre
  difficulte: 1
  enonce: Dans le triangle ABC, M est sur le segment [AB] et N sur le segment [AC]. Les droites (MN) et (BC) sont parallèles. On sait que AM = 4 cm, AB = 10 cm et BC = 7 cm. Calcule MN, en cm.
  reponse:
    valeur: 2.8
    forme: libre
  indices:
    relance: Quel est le petit triangle, quel est le grand triangle ? MN doit-il être plus petit ou plus grand que BC ?
    methode: Écris les rapports de Thalès AM/AB = AN/AC = MN/BC, puis garde les deux rapports où tu connais trois longueurs.
    etape: MN/7 = 4/10. Fais le produit en croix pour trouver MN.
  pieges:
  - si:
      valeur: 17.5
    relance: Ton résultat est plus grand que BC, alors que [MN] est dans le petit triangle. As-tu mis les longueurs du même triangle en haut des deux rapports ?
  solution: (MN) et (BC) sont parallèles, donc d'après le théorème de Thalès, AM/AB = MN/BC, soit 4/10 = MN/7. Donc MN = 7 × 4 ÷ 10 = 2,8 cm.
- id: thales-papillon
  type: nombre
  difficulte: 2
  enonce: Les droites (AE) et (BD) se coupent en C. Les points A, C, E sont alignés dans cet ordre, ainsi que B, C, D. Les droites (AB) et (DE) sont parallèles. On sait que CA = 6 cm, CE = 4 cm et AB = 8,4 cm. Calcule DE, en cm.
  reponse:
    valeur: 5.6
    forme: libre
  indices:
    relance: Dans ce papillon, quels sont les deux triangles ? Lequel est le plus petit ?
    methode: Écris CE/CA = CD/CB = DE/AB, puis garde les deux rapports utiles.
    etape: DE/8,4 = 4/6. Fais le produit en croix.
  pieges:
  - si:
      valeur: 12.6
    relance: 'Tu as inversé un rapport : le côté [DE] est dans le triangle CDE, le plus petit. DE doit-il être plus grand ou plus petit que AB ?'
  solution: (AB) et (DE) sont parallèles, donc d'après le théorème de Thalès, CE/CA = DE/AB, soit 4/6 = DE/8,4. Donc DE = 8,4 × 4 ÷ 6 = 5,6 cm.
- id: semblables-par-angles
  type: texte_court
  difficulte: 2
  enonce: Le triangle ABC a un angle de 50° et un angle de 60°. Le triangle DEF a un angle de 60° et un angle de 70°. Ces deux triangles sont-ils semblables ? Réponds par oui ou par non.
  reponse:
    acceptees:
    - oui
    fautes_tolerees: 0
  indices:
    relance: Connais-tu les trois angles de chaque triangle ?
    methode: Calcule le troisième angle de chaque triangle avec la somme 180°, puis compare les deux listes d'angles.
    etape: 'Pour ABC : 180 − 50 − 60. Fais de même pour DEF.'
  pieges:
  - si:
      valeur: non
    relance: On ne t'a donné que deux angles de chaque triangle. As-tu calculé le troisième angle de chacun ?
  solution: 'Oui. Le troisième angle de ABC mesure 180 − 50 − 60 = 70°, celui de DEF mesure 180 − 60 − 70 = 50°. Les deux triangles ont les mêmes angles (50°, 60°, 70°) : ils sont semblables.'
- id: semblables-cote
  type: nombre
  difficulte: 2
  enonce: Les triangles ABC et DEF sont semblables. Le côté [AB] correspond au côté [DE], et le côté [BC] correspond au côté [EF]. On sait que AB = 3 cm, DE = 4,5 cm et BC = 5 cm. Calcule EF, en cm.
  reponse:
    valeur: 7.5
    forme: libre
  indices:
    relance: Le triangle DEF est-il un agrandissement ou une réduction du triangle ABC ?
    methode: Calcule le coefficient qui permet de passer du côté [AB] au côté correspondant [DE], puis applique-le au côté [BC].
    etape: 'Coefficient : 4,5 ÷ 3. Multiplie ensuite BC par ce coefficient.'
  pieges:
  - si:
      valeur: 3.33
    relance: Ton résultat est plus petit que BC, comme si tu réduisais. Les côtés de DEF sont-ils plus grands ou plus petits que ceux de ABC ?
  solution: 'Le coefficient de DEF par rapport à ABC est 4,5 ÷ 3 = 1,5. Donc EF = 1,5 × 5 = 7,5 cm.'
- id: trigo-longueur
  type: nombre
  difficulte: 2
  enonce: Le triangle ABC est rectangle en B. L'angle en A mesure 35° et AC = 12 cm. Calcule BC, arrondi au dixième de centimètre.
  reponse:
    valeur: 6.9
    forme: libre
    tolerance: 0.05
  indices:
    relance: Par rapport à l'angle en A, le côté [BC] est-il opposé ou adjacent ? Et [AC], qu'est-ce que c'est ?
    methode: 'Tu connais l''hypoténuse et tu cherches le côté opposé à l''angle en A : quelle formule relie ces deux côtés ?'
    etape: sin 35° = BC/AC, donc BC = 12 × sin 35°. Calcule avec la calculatrice en mode degrés.
  pieges:
  - si:
      valeur: 9.8
    relance: Tu as utilisé le cosinus. Le côté [BC] touche-t-il le sommet A, ou lui fait-il face ?
  - si:
      valeur: 8.4
    relance: 'La tangente utilise deux côtés de l''angle droit. Ici, [AC] est l''hypoténuse : quelle formule l''utilise avec le côté opposé ?'
  solution: '[AC] est l''hypoténuse et [BC] est le côté opposé à l''angle en A. sin 35° = BC/AC, donc BC = 12 × sin 35° ≈ 6,9 cm.'
- id: trigo-angle
  type: nombre
  difficulte: 3
  enonce: Le triangle DEF est rectangle en E, avec DE = 5 cm et EF = 7 cm. Calcule la mesure de l'angle en D, arrondie au degré.
  reponse:
    valeur: 54
    forme: libre
    tolerance: 0.5
  indices:
    relance: Par rapport à l'angle en D, quel côté est opposé et quel côté est adjacent ?
    methode: 'Tu connais les deux côtés de l''angle droit : utilise la tangente, puis la touche arctan (tan⁻¹) de la calculatrice.'
    etape: tan(angle en D) = EF/DE = 7/5. Cherche l'angle dont la tangente vaut ce nombre.
  pieges:
  - si:
      valeur: 36
    relance: Tu as calculé l'angle en F, pas l'angle en D. Quel côté fait face au sommet D ?
  - si:
      valeur: 35
    relance: Tu as calculé l'angle en F, et ton arrondi est à revoir. Quel côté fait face au sommet D ?
  solution: Le côté opposé à l'angle en D est [EF], le côté adjacent est [DE]. tan(angle en D) = 7/5 = 1,4, donc l'angle en D = arctan(1,4) ≈ 54°.
- id: reciproque-thales
  type: ouverte
  difficulte: 3
  enonce: Les points A, M, B sont alignés dans cet ordre, ainsi que A, N, C. On sait que AM = 3 cm, AB = 7,5 cm, AN = 4 cm et AC = 10 cm. Les droites (MN) et (BC) sont-elles parallèles ? Justifie.
  criteres:
  - L'élève calcule séparément les deux rapports AM/AB et AN/AC (sans arrondir) et les trouve égaux.
  - L'élève précise que les points sont alignés dans le même ordre et cite la réciproque du théorème de Thalès.
  - L'élève conclut que les droites (MN) et (BC) sont parallèles.
  indices:
    relance: Quel théorème permet de prouver que deux droites sont parallèles avec des longueurs ?
    methode: Calcule AM/AB d'un côté, AN/AC de l'autre, puis compare les deux résultats.
    etape: AM/AB = 3/7,5. Calcule ce quotient, puis fais de même avec AN/AC.
  solution: AM/AB = 3/7,5 = 0,4 et AN/AC = 4/10 = 0,4. Les rapports sont égaux et les points A, M, B et A, N, C sont alignés dans le même ordre. D'après la réciproque du théorème de Thalès, (MN) et (BC) sont parallèles.
