# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: grandeurs-et-transformations
version: 3
etat: verifiee
declencheurs:
- aire de l'image
- volume de l'image
- longueur de l'image
- conserve les longueurs
- rapport au cube
- figure superposable
- périmètre de l'image
- effet sur l'aire
- aire après agrandissement
prerequis:
- rotations-et-homotheties
- 4e-agrandissement-reduction-translation
essentiel: 'Les symétries (axiale et centrale), les translations et les rotations sont des transformations qui conservent
  les longueurs. L''image d''une figure est superposable à la figure de départ.


  Elles conservent aussi les angles, les aires, les périmètres et les volumes. Elles conservent le parallélisme et l''alignement.

  Pour calculer, on s''en sert ainsi : l''image d''un triangle d''aire 12 cm² par une rotation a encore une aire de 12 cm².


  Une homothétie de rapport k change les tailles. Elle multiplie :

  - les longueurs et les périmètres par |k| (la valeur sans le signe, car une longueur est positive) ;

  - les aires par k² ;

  - les volumes par |k|³.

  Elle conserve les angles.


  Si |k| > 1, c''est un agrandissement. Si 0 < |k| < 1, c''est une réduction. Si k est négatif, l''image est de l''autre côté
  du centre, mais les longueurs sont multipliées par |k|.


  Exemple : une homothétie de rapport 2 double les longueurs, multiplie les aires par 4 et les volumes par 8.

  Exemple avec un rapport négatif : k = −3 multiplie les longueurs par 3 et les aires par 9.


  On peut aussi remonter au rapport. Si l''aire est multipliée par 16, alors k² = 16, donc |k| = 4.


  Quelques repères : une symétrie axiale échange la droite et ses deux côtés, mais elle conserve les longueurs. Une translation
  déplace la figure sans la tourner. Une rotation la fait tourner autour d''un centre, d''un angle donné.

  Attention : un agrandissement ou une réduction ne conserve pas les longueurs, mais conserve la forme.

  Exemple : un cube d''arête 2 cm a pour volume 8 cm³. Avec une homothétie de rapport 3, l''arête devient 6 cm et le volume
  216 cm³, soit 8 × 27.


  Au brevet : on reconnaît la transformation, on donne le bon coefficient (|k|, k² ou |k|³) et on écrit l''unité du résultat
  (cm, cm², cm³).

  '
methode:
- 'Identifier la transformation : symétrie, translation, rotation (tout est conservé) ou homothétie (tout change sauf les
  angles).'
- Pour une homothétie, noter son rapport k et ne garder que sa valeur sans le signe pour les longueurs.
- 'Choisir le bon coefficient : |k| pour une longueur ou un périmètre, k² pour une aire, |k|³ pour un volume.'
- Multiplier la grandeur de départ par ce coefficient et écrire l'unité (cm, cm², cm³).
- 'Pour retrouver le rapport : diviser la grandeur de l''image par celle de départ, puis prendre la racine carrée (aire) ou
  cubique (volume).'
vocabulaire:
- terme: isométrie
  definition: 'Transformation qui conserve les longueurs : symétrie, translation, rotation.'
- terme: image
  definition: Figure obtenue après une transformation.
- terme: rapport d'une homothétie
  definition: Nombre k par lequel les distances au centre sont multipliées (au signe près).
- terme: agrandissement
  definition: Homothétie dont le rapport, sans son signe, est supérieur à 1.
- terme: réduction
  definition: Homothétie dont le rapport, sans son signe, est compris entre 0 et 1.
- terme: conserver
  definition: Garder la même valeur avant et après la transformation.
erreurs_frequentes:
- Multiplier une aire par k au lieu de k².
- Multiplier un volume par k ou k² au lieu de k³.
- Donner une longueur négative quand le rapport de l'homothétie est négatif.
- Croire qu'une rotation ou une symétrie change l'aire d'une figure.
exemple:
  enonce: Une homothétie de rapport 4 transforme un carré d'aire 3 cm² et un cube de volume 2 cm³. Quelles sont l'aire et
    le volume des images ?
  solution: 'Aire de l''image : 3 × 4² = 3 × 16 = 48 cm². Volume de l''image : 2 × 4³ = 2 × 64 = 128 cm³.'
exercices:
- id: quelles-transformations-conservent
  type: choix
  difficulte: 1
  enonce: Parmi ces transformations, lesquelles conservent les longueurs (et donc les aires) ?
  reponse:
    options:
    - id: a
      texte: une symétrie axiale
    - id: b
      texte: une symétrie centrale
    - id: c
      texte: une rotation
    - id: d
      texte: une translation
    - id: e
      texte: une homothétie de rapport 3
    bonnes:
    - a
    - b
    - c
    - d
  indices:
    relance: Pour chaque transformation, la figure image est-elle superposable à la figure de départ ?
    methode: Imagine un triangle et son image. Si on peut poser l'un exactement sur l'autre, les longueurs sont conservées.
    etape: 'Une symétrie axiale revient à plier la feuille : les longueurs ne changent pas. Examine les autres une par une.'
  pieges:
  - si:
      contient:
      - e
    relance: 'Une homothétie de rapport 3 multiplie les longueurs par 3 : la figure image est trois fois plus grande.'
  - si:
      diagnostic: incomplet
    relance: Il en manque. Parmi les transformations que tu n'as pas choisies, lesquelles déplacent la figure sans la déformer
      ?
  solution: Les symétries (axiale et centrale), la rotation et la translation conservent les longueurs et les aires (réponses
    a, b, c, d). L'homothétie de rapport 3 multiplie les longueurs par 3.
- id: aire-apres-rotation
  type: nombre
  difficulte: 1
  enonce: Le triangle ABC a une aire de 12 cm². On construit son image A'B'C' par la rotation de centre O et d'angle 90°.
    Quelle est l'aire du triangle A'B'C', en cm² ? Écris seulement le nombre.
  reponse:
    valeur: 12
  indices:
    relance: Une rotation déforme-t-elle la figure, ou la fait-elle seulement tourner ?
    methode: 'Rappelle-toi ce qu''une rotation conserve : longueurs, angles... et donc ?'
    etape: Le triangle A'B'C' est superposable au triangle ABC. Que peux-tu dire de leurs aires ?
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Une rotation fait tourner la figure sans la déformer. L'aire peut-elle changer ?
  solution: Une rotation conserve les longueurs, donc les aires. L'aire de A'B'C' est donc 12 cm², comme celle de ABC.
- id: aire-apres-homothetie
  type: nombre
  difficulte: 2
  enonce: Un triangle a une aire de 5 cm². On lui applique une homothétie de rapport 3. Quelle est l'aire du triangle image,
    en cm² ? Écris seulement le nombre.
  reponse:
    valeur: 45
  indices:
    relance: Par combien les longueurs sont-elles multipliées ? Et une aire, qui est une longueur fois une longueur ?
    methode: Une homothétie de rapport k multiplie les aires par k². Calcule k², puis multiplie l'aire de départ.
    etape: Ici k = 3, donc les aires sont multipliées par 3² = 9. Il reste à multiplier 5 cm² par ce nombre.
  pieges:
  - si:
      valeur: 15
    relance: Tu as multiplié l'aire par 3, comme une longueur. Une aire est multipliée par le carré du rapport.
  - si:
      valeur: 135
    relance: 'Tu as multiplié par 3³ : c''est le coefficient pour un volume. Pour une aire, c''est le carré du rapport.'
  - si:
      diagnostic: valeur_fausse
    relance: Longueurs × k, aires × k², volumes × k³. Lequel de ces trois coefficients faut-il ici ?
  solution: 'Les aires sont multipliées par k² = 3² = 9. Aire de l''image : 5 × 9 = 45 cm².'
- id: rapport-negatif
  type: nombre
  difficulte: 2
  enonce: Un segment [AB] mesure 4,5 cm. On construit son image [A'B'] par l'homothétie de centre O et de rapport -2. Quelle
    est la longueur A'B', en cm ? Écris seulement le nombre.
  reponse:
    valeur: 9
  indices:
    relance: Une longueur peut-elle être négative ? Que change le signe moins du rapport ?
    methode: Le signe du rapport indique seulement que l'image est de l'autre côté du centre. La longueur est multipliée par
      le rapport sans son signe.
    etape: Le rapport sans son signe vaut 2. Il reste à multiplier 4,5 cm par 2.
  pieges:
  - si:
      valeur: -9
    relance: Une longueur est toujours positive. Le signe moins indique seulement que l'image est de l'autre côté du centre
      O.
  - si:
      valeur: 18
    relance: Tu as multiplié par 2² = 4. Pour une longueur, on multiplie par le rapport, pas par son carré.
  - si:
      valeur: 2.25
    relance: Tu as divisé par 2. Un rapport égal à 2 (sans le signe) agrandit la figure.
  - si:
      diagnostic: valeur_fausse
    relance: Pour une longueur, on multiplie par le rapport pris sans son signe.
  solution: Le rapport sans son signe vaut 2, donc A'B' = 2 × 4,5 = 9 cm. Le signe moins place seulement l'image de l'autre
    côté de O.
- id: volume-apres-reduction
  type: nombre
  difficulte: 3
  enonce: Un pavé droit a un volume de 240 cm³. On lui applique une homothétie de rapport 0,5. Quel est le volume du pavé
    image, en cm³ ? Écris seulement le nombre.
  reponse:
    valeur: 30
  indices:
    relance: Un volume est une longueur × une longueur × une longueur. Par quoi est-il multiplié quand chaque longueur est
      multipliée par 0,5 ?
    methode: Une homothétie de rapport k multiplie les volumes par k³. Calcule k³, puis multiplie le volume de départ.
    etape: 0,5³ = 0,5 × 0,5 × 0,5 = 0,125. Il reste à multiplier 240 cm³ par 0,125.
  pieges:
  - si:
      valeur: 120
    relance: Tu as multiplié le volume par 0,5, comme une longueur. Un volume est multiplié par le cube du rapport.
  - si:
      valeur: 60
    relance: Tu as multiplié par 0,5², le coefficient des aires. Pour un volume, c'est le cube du rapport.
  - si:
      valeur: 480
    relance: 'Avec un rapport de 0,5, la figure est réduite : le volume doit diminuer, pas augmenter.'
  - si:
      diagnostic: valeur_fausse
    relance: Longueurs × k, aires × k², volumes × k³. Calcule 0,5³ avec soin.
  solution: 'Les volumes sont multipliés par 0,5³ = 0,125. Volume de l''image : 240 × 0,125 = 30 cm³ (soit 240 ÷ 8).'
- id: aire-du-moulin
  type: ouverte
  difficulte: 3
  enonce: Timéo dessine un triangle T d'aire 6 cm², avec un sommet au point O. Il construit les images de T par les rotations
    de centre O et d'angles 90°, 180° et 270°. Les quatre triangles ne se chevauchent pas et forment un « moulin ». Explique
    pourquoi l'aire du moulin est 24 cm².
  criteres:
  - L'élève dit qu'une rotation conserve les aires, donc que chaque triangle image a une aire de 6 cm².
  - L'élève additionne les quatre aires (les triangles ne se chevauchent pas) et obtient 4 × 6 = 24 cm².
  indices:
    relance: Combien de triangles forment le moulin ? Que sais-tu de l'aire de chacun ?
    methode: Utilise une propriété des rotations sur les aires, puis additionne les aires des triangles.
    etape: Le triangle T a une aire de 6 cm². Son image par la rotation d'angle 90° a-t-elle la même aire ? Pourquoi ?
  solution: 'Une rotation conserve les aires : chacune des trois images de T a une aire de 6 cm². Le moulin est formé de T
    et de ses trois images, sans chevauchement, donc son aire est 4 × 6 = 24 cm².'
- id: nblm-lors-d-une-symetrie-d-une-translation-ou-1
  type: choix
  difficulte: 2
  enonce: Lors d'une symétrie, d'une translation ou d'une rotation, quelle propriété essentielle possède l'image obtenue par
    rapport à la figure de départ ?
  reponse:
    options:
    - id: o1
      texte: Elle est une figure superposable à la figure de départ car la transformation conserve les longueurs, les angles,
        les aires et les volumes.
    - id: o2
      texte: Elle a une aire multipliée par 2 par rapport à la figure de départ.
    - id: o3
      texte: Ses longueurs sont modifiées mais ses angles restent identiques.
    - id: o4
      texte: Son volume est multiplié par le rapport de la transformation.
    bonnes:
    - o1
  indices:
    relance: Pense aux transformations qui déplacent une figure sans la déformer ni la redimensionner.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : confondre une isométrie avec un agrandissement. Les symétries, translations et rotations
      ne modifient pas l''aire.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : c''est l''homothétie qui peut modifier les longueurs sans changer les angles, pas les isométries.'
  - si:
      contient:
      - o4
    relance: 'Attention : la notion de rapport s''applique aux homothéties. Les transformations rigides conservent le volume.'
  solution: 'Elle est une figure superposable à la figure de départ car la transformation conserve les longueurs, les angles,
    les aires et les volumes. C''est exact : les symétries, translations et rotations sont des isométries qui conservent toutes
    les grandeurs géométriques, l''image est donc superposable.'
- id: nblm-dans-une-homothetie-de-rapport-k-3-si-un-2
  type: choix
  difficulte: 2
  enonce: Dans une homothétie de rapport k = 3, si une figure initiale a une aire de 5 cm², quelle est l'aire de l'image ?
  reponse:
    options:
    - id: o1
      texte: 45 cm²
    - id: o2
      texte: 15 cm²
    - id: o3
      texte: 135 cm²
    - id: o4
      texte: 30 cm²
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi par quel facteur est multipliée une surface lorsque les longueurs sont multipliées par k.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : multiplier l''aire par k au lieu de k² (5 × 3 = 15). N''oublie pas que les surfaces varient
      au carré du rapport.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : multiplier par k³ au lieu de k² (5 × 3³ = 135). Le coefficient k³ s''applique aux volumes,
      pas aux aires.'
  - si:
      contient:
      - o4
    relance: 'Erreur de calcul : multiplier par (2 × k²) ou additionner au lieu de calculer 5 × 3².'
  solution: '45 cm². C''est exact : lors d''un agrandissement de rapport k, l''aire de l''image est multipliée par k², soit
    5 × 3² = 5 × 9 = 45 cm².'
- id: nblm-comment-calcule-t-on-le-volume-de-l-imag-3
  type: choix
  difficulte: 2
  enonce: Comment calcule-t-on le volume de l'image d'un solide après une homothétie de rapport k ?
  reponse:
    options:
    - id: o1
      texte: En multipliant le volume initial par le rapport au cube, c'est-à-dire par k³.
    - id: o2
      texte: En multipliant le volume initial par le rapport k.
    - id: o3
      texte: En multipliant le volume initial par k².
    - id: o4
      texte: En ajoutant k³ au volume initial.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux trois dimensions de l'espace (longueur, largeur, hauteur) pour trouver la puissance de k à appliquer.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : appliquer le rapport k aux volumes alors qu''il ne s''applique directement qu''aux longueurs.'
  - si:
      contient:
      - o3
    relance: 'Confusion fréquente : k² s''utilise pour calculer l''aire de l''image, tandis que pour le volume c''est k³.'
  - si:
      contient:
      - o4
    relance: 'Fausse démarche : un agrandissement ou une réduction implique une multiplication par un coefficient, pas une
      addition.'
  solution: 'En multipliant le volume initial par le rapport au cube, c''est-à-dire par k³. C''est exact : le volume de l''image
    d''une figure agrandie ou réduite de rapport k est multiplié par le rapport au cube (k³).'
- id: nblm-un-segment-mesure-8-cm-quelle-est-la-lon-4
  type: choix
  difficulte: 2
  enonce: Un segment mesure 8 cm. Quelle est la longueur de l'image de ce segment par une homothétie de rapport k = -2 ?
  reponse:
    options:
    - id: o1
      texte: 16 cm
    - id: o2
      texte: -16 cm
    - id: o3
      texte: 4 cm
    - id: o4
      texte: 32 cm
    bonnes:
    - o1
  indices:
    relance: Garde en tête qu'une distance géométrique ne peut jamais être un nombre négatif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : donner une longueur négative en conservant le signe - du rapport. Une longueur géométrique
      est toujours positive !'
  - si:
      contient:
      - o3
    relance: 'Erreur de calcul : diviser par 2 au lieu de multiplier par 2.'
  - si:
      contient:
      - o4
    relance: 'Erreur de confusion : multiplier par k² (8 × 4 = 32) au lieu d''utiliser k pour une longueur.'
  solution: '16 cm. C''est exact : pour calculer la longueur de l''image, on multiplie la longueur initiale par la valeur
    sans son signe (-k = 2), car une longueur est toujours positive.'
- id: nblm-parmi-ces-transformations-geometriques-l-5
  type: choix
  difficulte: 2
  enonce: Parmi ces transformations géométriques, laquelle conserve toujours les longueurs entre la figure de départ et son
    image ?
  reponse:
    options:
    - id: o1
      texte: La rotation
    - id: o2
      texte: L'homothétie de rapport 3
    - id: o3
      texte: L'homothétie de rapport 0,5
    - id: o4
      texte: L'agrandissement de rapport k > 1
    bonnes:
    - o1
  indices:
    relance: Cherche la transformation qui fait tourner ou glisser la figure sans en modifier la taille.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect : une homothétie de rapport 3 triple les longueurs (agrandissement), elle ne les conserve pas.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : une homothétie de rapport 0,5 divise les longueurs par 2 (réduction).'
  - si:
      contient:
      - o4
    relance: 'Incorrect : un agrandissement augmente la taille des longueurs selon le rapport k.'
  solution: 'La rotation. C''est exact : la rotation est une isométrie, elle conserve les longueurs, les angles et les aires.'
- id: nblm-quelles-sont-les-deux-affirmations-vraie-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations vraies concernant l'effet des transformations sur les figures géométriques ?
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Une translation transforme une figure en une figure superposable, car elle conserve les longueurs et les angles.
    - id: o2
      texte: Une homothétie de rapport k conserve toujours les mesures d'angles de la figure initiale.
    - id: o3
      texte: Une symétrie axiale multiplie l'aire de la figure image par 2.
    - id: o4
      texte: Une homothétie de rapport 2 conserve les longueurs de la figure de départ.
    bonnes:
    - o1
    - o2
  indices:
    relance: Réfléchis à ce qui reste inchangé lors d'un déplacement d'une part, et lors d'une homothétie d'autre part.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : la symétrie axiale conserve l''aire, l''image a la même aire que la figure initiale.'
  - si:
      contient:
      - o4
    relance: 'Faux : une homothétie de rapport 2 multiplie toutes les longueurs par 2.'
  solution: 'Une translation transforme une figure en une figure superposable, car elle conserve les longueurs et les angles
    ; Une homothétie de rapport k conserve toujours les mesures d''angles de la figure initiale. Vrai : la translation est
    un déplacement qui ne déforme pas la figure initiale.'
