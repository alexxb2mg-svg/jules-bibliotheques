- id: perimetre-apres-reduction
  type: nombre
  difficulte: 2
  enonce: Un triangle a un périmètre de 18 cm. On lui applique une homothétie de rapport 2/3. Quel est le périmètre du triangle
    image, en cm ? Écris seulement le nombre.
  reponse:
    valeur: 12
    forme: libre
  indices:
    relance: Un périmètre est-il une longueur, une aire ou un volume ?
    methode: 'Un périmètre est une longueur : il est multiplié par le rapport de l''homothétie (sans le signe).'
    etape: Calcule 18 × 2/3, c'est-à-dire 18 ÷ 3, puis × 2.
  pieges:
  - si:
      valeur: 8
    relance: 'Tu as multiplié par le rapport au carré. Ce coefficient est celui des aires : un périmètre est une longueur.'
  - si:
      valeur: 27
    relance: 'Tu as multiplié par 3 ÷ 2 (l''inverse). Le rapport est plus petit que 1 : le périmètre doit-il augmenter ?'
  solution: 'Un périmètre est une longueur : 18 × 2/3 = 12 cm.'
- id: retrouver-le-rapport
  type: nombre
  difficulte: 3
  enonce: Une homothétie de rapport positif transforme un carré d'aire 5 cm² en un carré d'aire 80 cm². Quel est le rapport
    de cette homothétie ?
  reponse:
    valeur: 4
    forme: libre
  indices:
    relance: Par quel nombre l'aire a-t-elle été multipliée ? Que représente ce nombre par rapport à k ?
    methode: L'aire est multipliée par k². Calcule d'abord ce coefficient, puis cherche le nombre positif dont le carré est
      égal à ce coefficient.
    etape: Divise 80 par 5. Tu obtiens k². Quel nombre positif, multiplié par lui-même, donne ce résultat ?
  pieges:
  - si:
      valeur: 16
    relance: 16 est le coefficient des aires, c'est-à-dire k². On cherche k.
  - si:
      valeur: 75
    relance: Tu as fait la différence des aires. Le lien entre deux aires est un produit par k², pas une addition.
  solution: 80 ÷ 5 = 16, donc k² = 16. Comme k est positif, k = 4 (car 4 × 4 = 16).
