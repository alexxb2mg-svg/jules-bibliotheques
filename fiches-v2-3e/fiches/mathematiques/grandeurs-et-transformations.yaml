  reponse:
    acceptees:
    - k²
    fautes_tolerees: 1
  indices:
    relance: Pense à la puissance à laquelle est élevé le rapport k lorsqu'on calcule une surface (2D).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
