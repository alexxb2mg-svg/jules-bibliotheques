    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'isométrie. C''est exact : le mot ''isométrie'' désigne une transformation qui conserve les longueurs.'
- id: nblm-si-les-longueurs-d-une-figure-sont-multi-8
  type: texte_court
  difficulte: 1
  enonce: Si les longueurs d'une figure sont multipliées par k lors d'une homothétie, par quel coefficient est multipliée
