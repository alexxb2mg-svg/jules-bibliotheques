# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: ecritures-et-comparaison-nombres
version: 1
etat: verifiee
declencheurs:
- ranger du plus petit au plus grand
- lequel est le plus grand
- placer sur la droite
- encadrer entre deux entiers
- ordre croissant
- abscisse du point
prerequis:
- 4e-puissances-notation-scientifique
couverture: Couvre le passage d'une écriture à une autre (décimale, fractionnaire, scientifique), la comparaison, le rangement,
  l'encadrement, le repérage sur une droite graduée et les ordres de grandeur. Le calcul avec ces nombres est traité dans
  la fiche « calcul-nombres-rationnels ».
essentiel: 'Un même nombre peut s''écrire de plusieurs façons : 3/4 = 0,75 = 75/100 = 7,5 × 10⁻¹. On passe d''une fraction
  à l''écriture décimale en divisant le numérateur par le dénominateur.


  Pour comparer des nombres écrits différemment, on les écrit tous de la même façon : tous en écriture décimale, ou toutes
  les fractions avec le même dénominateur.


  Sur une droite graduée, chaque point a une abscisse. Plus un point est à droite, plus son abscisse est grande. Un nombre
  négatif est toujours plus petit qu''un nombre positif. Entre deux nombres négatifs, le plus petit est celui qui est le plus
  loin de zéro.


  Encadrer un nombre, c''est trouver deux nombres, l''un plus petit et l''autre plus grand, entre lesquels il se trouve.


  Un ordre de grandeur est une valeur simple et proche d''un nombre. Il sert à contrôler qu''un résultat est vraisemblable.

  '
methode:
- Écrire tous les nombres sous la même forme (par exemple en écriture décimale, avec une calculatrice si besoin).
- 'Séparer les nombres négatifs et les nombres positifs : les négatifs sont toujours les plus petits.'
- Comparer les parties entières, puis les chiffres des dixièmes, des centièmes, etc.
- Pour placer une fraction a/b sur une droite graduée, partager l'unité en b parts égales et compter a parts à partir de zéro
  (vers la gauche si le nombre est négatif).
- 'Vérifier le rangement en relisant la liste : chaque nombre doit être plus grand que le précédent.'
vocabulaire:
- terme: abscisse
  definition: le nombre qui repère un point sur une droite graduée
- terme: ordre croissant
  definition: du plus petit au plus grand
- terme: encadrement
  definition: deux nombres entre lesquels se trouve un nombre donné
erreurs_frequentes:
- Croire que 1,65 est plus petit que 1,6 parce que 65 est « plus long », ou l'inverse, en comparant les chiffres après la
  virgule comme des entiers.
- 'Ranger les nombres négatifs comme des positifs : penser que −3 est plus grand que −1.'
- 'Lire 7/8 comme 7,8 : la barre de fraction n''est pas une virgule.'
- Oublier le signe moins en lisant l'abscisse d'un point à gauche de zéro.
exemple:
  enonce: 'Range dans l''ordre croissant : 2/5 ; 0,38 ; −0,5 ; 3/8.'
  solution: 'On écrit tout en écriture décimale : 2/5 = 0,4 et 3/8 = 0,375. Le seul négatif est −0,5, c''est le plus petit.
    Puis 0,375 < 0,38 < 0,4. Donc −0,5 < 3/8 < 0,38 < 2/5.'
exercices:
- id: ranger-cinq-nombres
  type: ordre
  difficulte: 1
  enonce: Range ces nombres dans l'ordre croissant (du plus petit au plus grand).
  reponse:
    elements:
    - id: d
      texte: −3/2
    - id: a
      texte: −1,4
    - id: e
      texte: 1,6
    - id: b
      texte: 1,65
    - id: c
      texte: 5/3
  indices:
    relance: Lesquels de ces nombres sont négatifs ? Où se placent-ils par rapport aux autres ?
    methode: Écris chaque fraction en écriture décimale, puis compare les nombres chiffre par chiffre.
    etape: −3/2 s'écrit −1,5 et 5/3 vaut environ 1,667. Compare maintenant −1,5 avec −1,4, puis les trois nombres positifs.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux nombres voisins sont inversés. Pour deux négatifs, le plus petit est celui qui est le plus loin
      de zéro.
  - si:
      diagnostic: ordre_faux
    relance: Commence par écrire les deux fractions en écriture décimale, puis place d'abord les négatifs.
  solution: '−3/2 = −1,5 et 5/3 ≈ 1,667. Les négatifs d''abord : −1,5 est plus loin de zéro que −1,4, donc −3/2 < −1,4. Puis
    1,6 < 1,65 < 1,667. Ordre : −3/2 ; −1,4 ; 1,6 ; 1,65 ; 5/3.'
- id: fraction-en-decimal
  type: nombre
  difficulte: 1
  enonce: Donne l'écriture décimale de la fraction 7/8.
  reponse:
    valeur: 0.875
    forme: libre
  indices:
    relance: Que signifie la barre de fraction ? Quelle opération cache-t-elle ?
    methode: Une fraction a/b est le quotient de a par b. Pose la division de 7 par 8.
    etape: 'Commence : 7 divisé par 8 donne 0 unité. Écris 70 dixièmes : dans 70, combien de fois 8 ? Continue avec le reste.'
  pieges:
  - si:
      valeur: 7.8
    relance: 'La barre de fraction n''est pas une virgule. Le numérateur est plus petit que le dénominateur : le quotient
      peut-il dépasser 1 ?'
  - si:
      valeur: 0.78
    relance: 'On ne recopie pas les chiffres : il faut diviser 7 par 8. Vérifie en multipliant ton résultat par 8.'
  solution: '7/8 = 7 ÷ 8 = 0,875. Vérification : 0,875 × 8 = 7.'
- id: entre-un-tiers-et-un-demi
  type: choix
  difficulte: 2
  enonce: Quels nombres sont compris entre 1/3 et 1/2 ? (Il peut y en avoir plusieurs.)
  reponse:
    options:
    - id: a
      texte: 0,4
    - id: b
      texte: 0,25
    - id: c
      texte: 3/8
    - id: d
      texte: 0,6
    bonnes:
    - a
    - c
  indices:
    relance: Quelle est l'écriture décimale de 1/2 ? Et une valeur approchée de 1/3 ?
    methode: Écris chaque nombre en écriture décimale, puis regarde s'il est plus grand que 1/3 et plus petit que 1/2.
    etape: 1/3 ≈ 0,333 et 1/2 = 0,5. Pour chaque option, compare avec ces deux bornes.
  pieges:
  - si:
      contient:
      - b
    relance: Un quart est-il plus grand qu'un tiers ? Compare 0,25 avec 0,333.
  - si:
      contient:
      - d
    relance: 0,6 est-il plus petit que la moitié ?
  - si:
      diagnostic: incomplet
    relance: Il y a plusieurs bonnes réponses. Écris la fraction qui reste en écriture décimale.
  solution: '1/3 ≈ 0,333 et 1/2 = 0,5. 0,4 est entre les deux ; 3/8 = 0,375 aussi. 0,25 est trop petit et 0,6 trop grand.
    Réponses : 0,4 et 3/8.'
- id: abscisse-droite-graduee
  type: nombre
  difficulte: 2
  enonce: Sur une droite graduée, l'unité (de 0 à 1) est partagée en 6 parts égales. Le point A est à gauche de 0, à 5 graduations
    de 0. Quelle est l'abscisse de A ? Donne-la sous forme de fraction irréductible.
  reponse:
    valeur: -5/6
    forme: fraction_irreductible
  indices:
    relance: Le point A est-il à droite ou à gauche de zéro ? Que dit ce côté sur le signe de son abscisse ?
    methode: Une graduation vaut 1/6 de l'unité. Compte le nombre de graduations et n'oublie pas le signe.
    etape: Chaque graduation vaut un sixième. A est à 5 graduations, du côté des négatifs.
  pieges:
  - si:
      valeur: 5/6
    relance: Le point est à gauche de zéro. Quel signe a son abscisse ?
  - si:
      valeur: -5
    relance: 'Une graduation ne vaut pas 1 : l''unité est partagée en 6. Combien vaut une graduation ?'
  - si:
      valeur: -6/5
    relance: Tu as inversé numérateur et dénominateur. Le dénominateur dit en combien de parts on partage l'unité.
  solution: Une graduation vaut 1/6. A est à 5 graduations à gauche de 0, donc son abscisse est −5/6.
- id: ecritures-egales
  type: association
  difficulte: 2
  enonce: Relie chaque nombre à son écriture décimale.
  reponse:
    gauche:
    - id: a
      texte: 3/4
    - id: b
      texte: 2,5 × 10⁻¹
    - id: c
      texte: 1/5
    - id: d
      texte: 12/5
    droite:
    - id: x
      texte: 0,75
    - id: y
      texte: 0,25
    - id: z
      texte: 0,2
    - id: w
      texte: 2,4
    - id: v
      texte: '25'
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Pour une fraction, quelle division faut-il faire ? Pour une puissance de 10 négative, dans quel sens bouge la
      virgule ?
    methode: Divise le numérateur par le dénominateur. Multiplier par 10⁻¹, c'est diviser par 10.
    etape: 'Commence par 12/5 : 12 ÷ 5 donne un nombre entre 2 et 3. Puis fais les autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie celle avec la puissance de 10 : multiplier par 10⁻¹ rend-il le nombre
      plus grand ou plus petit ?'
  - si:
      diagnostic: associations_fausses
    relance: Fais chaque division à part, puis relie. Une des écritures de droite ne sert à rien.
  solution: 3/4 = 0,75 ; 2,5 × 10⁻¹ = 2,5 ÷ 10 = 0,25 ; 1/5 = 0,2 ; 12/5 = 2,4. Le nombre 25 ne correspond à aucun.
- id: ordre-de-grandeur-feuille
  type: ouverte
  difficulte: 3
  enonce: 'Léna lit que l''épaisseur d''une feuille de papier est de l''ordre de 10⁻⁴ m. Elle mesure une ramette de 500 feuilles
    : environ 5 cm d''épaisseur. Les deux informations sont-elles cohérentes ? Justifie.'
  criteres:
  - L'élève calcule l'épaisseur de 500 feuilles à partir de 10⁻⁴ m (500 × 10⁻⁴ m = 0,05 m) ou l'épaisseur d'une feuille à
    partir de 5 cm (5 cm ÷ 500 = 0,01 cm = 10⁻⁴ m).
  - L'élève convertit correctement entre mètres et centimètres et conclut que les informations sont cohérentes.
  indices:
    relance: Si une feuille a l'épaisseur annoncée, quelle serait l'épaisseur de 500 feuilles empilées ?
    methode: Multiplie l'épaisseur d'une feuille par 500, puis convertis le résultat en centimètres pour comparer.
    etape: 10⁻⁴ m = 0,0001 m. Multiplie ce nombre par 500, puis convertis en cm (1 m = 100 cm).
  solution: '500 × 10⁻⁴ m = 500 × 0,0001 m = 0,05 m = 5 cm. On retrouve la mesure de Léna : les deux informations sont cohérentes.'
- id: nblm-que-signifie-ranger-une-liste-de-nombres-1
  type: choix
  difficulte: 2
  enonce: Que signifie ranger une liste de nombres dans l'ordre croissant ?
  reponse:
    options:
    - id: o1
      texte: Ranger les nombres du plus petit au plus grand.
    - id: o2
      texte: Ranger les nombres du plus grand au plus petit.
    - id: o3
      texte: Ranger les nombres selon leur nombre de chiffres.
    - id: o4
      texte: Ranger uniquement les nombres positifs en premier.
    bonnes:
    - o1
  indices:
    relance: Pense au sens du verbe 'croître' (grandir).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est la définition de l'ordre décroissant, pas de l'ordre croissant.
  - si:
      contient:
      - o3
    relance: Le nombre de chiffres ne détermine pas la grandeur d'un nombre (par exemple, 0,123 est plus petit que 0,5).
  - si:
      contient:
      - o4
    relance: L'ordre croissant concerne tous les nombres, et les nombres négatifs doivent figurer au début car ils sont plus
      petits que les positifs.
  solution: Ranger les nombres du plus petit au plus grand. C'est la définition exacte de l'ordre croissant.
- id: nblm-parmi-les-nombres-suivants-lequel-est-le-2
  type: choix
  difficulte: 2
  enonce: Parmi les nombres suivants, lequel est le plus grand ?
  reponse:
    options:
    - id: o1
      texte: 1/2
    - id: o2
      texte: 0,45
    - id: o3
      texte: 0,6
    - id: o4
      texte: '-2'
    bonnes:
    - o3
  indices:
    relance: Convertis la fraction en écriture décimale pour comparer facilement tous les nombres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o4
    relance: Un nombre négatif est toujours plus petit qu'un nombre positif.
  solution: 0,6. En écriture décimale, 0,6 (soit 0,60) possède le plus grand chiffre des dixièmes parmi ces nombres.
- id: nblm-sur-une-droite-graduee-quel-terme-de-voc-3
  type: choix
  difficulte: 2
  enonce: Sur une droite graduée, quel terme de vocabulaire correspond au nombre qui indique la position exacte d'un point
    (l'abscisse du point) ?
  reponse:
    options:
    - id: o1
      texte: L'ordonnée
    - id: o2
      texte: L'abscisse
    - id: o3
      texte: L'encadrement
    - id: o4
      texte: L'ordre de grandeur
    bonnes:
    - o2
  indices:
    relance: Ce terme de vocabulaire commence par la lettre 'a'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: L'ordonnée sert à repérer un point sur l'axe vertical dans un repère du plan, pas sur une droite graduée.
  - si:
      contient:
      - o3
    relance: Un encadrement consiste à situer un nombre entre deux bornes, ce n'est pas la position d'un point.
  - si:
      contient:
      - o4
    relance: L'ordre de grandeur est une estimation ou valeur approchée d'un nombre.
  solution: L'abscisse. L'abscisse d'un point est le nombre qui permet de repérer sa position sur une droite graduée.
- id: nblm-comment-ranger-du-plus-petit-au-plus-gra-4
  type: choix
  difficulte: 2
  enonce: 'Comment ranger du plus petit au plus grand les nombres relatifs suivants : -3,5 ; -1,2 ; 0,8 et -5 ?'
  reponse:
    options:
    - id: o1
      texte: -5 < -3,5 < -1,2 < 0,8
    - id: o2
      texte: -1,2 < -3,5 < -5 < 0,8
    - id: o3
      texte: 0,8 < -1,2 < -3,5 < -5
    - id: o4
      texte: -3,5 < -5 < -1,2 < 0,8
    bonnes:
    - o1
  indices:
    relance: Sur une droite graduée, plus un nombre est situé vers la gauche, plus il est petit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : ranger les nombres négatifs selon leur partie numérique en oubliant l''effet du signe moins.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le nombre positif (0,8) est le plus grand et doit se trouver à la fin du rangement.'
  - si:
      contient:
      - o4
    relance: -5 est plus éloigné de zéro que -3,5, il est donc inférieur à -3,5.
  solution: -5 < -3,5 < -1,2 < 0,8. Entre deux nombres négatifs, le plus petit est celui qui est le plus éloigné de zéro (-5
    est plus éloigné de zéro que -3,5).
- id: nblm-comment-encadrer-entre-deux-entiers-rela-5
  type: choix
  difficulte: 2
  enonce: Comment encadrer entre deux entiers relatifs consécutifs le nombre -2,7 ?
  reponse:
    options:
    - id: o1
      texte: -2 < -2,7 < -3
    - id: o2
      texte: -3 < -2,7 < -2
    - id: o3
      texte: -2 < -2,7 < -1
    - id: o4
      texte: 2 < -2,7 < 3
    bonnes:
    - o2
  indices:
    relance: 'Attention aux nombres négatifs : l''entier immédiatement inférieur à -2,7 est -3.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: L'ordre des symboles de comparaison est faux car -2 est supérieur à -3.
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente sur les négatifs : -2,7 se trouve entre -3 et -2, et non entre -2 et -1.'
  - si:
      contient:
      - o4
    relance: Oubli des signes moins dans l'encadrement de ce nombre négatif.
  solution: -3 < -2,7 < -2. Le nombre -2,7 se situe bien entre l'entier inférieur -3 et l'entier supérieur -2.
- id: nblm-quelles-affirmations-sont-exactes-pour-p-6
  type: choix
  difficulte: 3
  enonce: Quelles affirmations sont exactes pour placer sur la droite graduée des nombres rationnels ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Plus un point est situé vers la droite, plus son abscisse est grande.
    - id: o2
      texte: Pour placer la fraction 3/4, on peut partager l'unité en 4 parts égales et compter 3 parts à partir de zéro vers
        la droite.
    - id: o3
      texte: Un nombre négatif se place toujours à droite de zéro.
    - id: o4
      texte: L'abscisse d'un point situé à gauche de zéro est toujours un nombre positif.
    bonnes:
    - o1
    - o2
  indices:
    relance: Rappelle-toi l'orientation de la droite graduée et la position relative des nombres négatifs et positifs par
      rapport à zéro.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Les nombres négatifs se situent toujours à gauche de zéro sur une droite graduée classique.
  - si:
      contient:
      - o4
    relance: Les points situés à gauche de zéro ont une abscisse négative.
  solution: Plus un point est situé vers la droite, plus son abscisse est grande ; Pour placer la fraction 3/4, on peut partager
    l'unité en 4 parts égales et compter 3 parts à partir de zéro vers la droite. C'est une propriété fondamentale de la droite
    graduée orientée de gauche à droite.
- id: nblm-quel-mot-designe-le-rangement-de-nombres-7
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le rangement de nombres du plus petit au plus grand (ordre croissant) ?
  reponse:
    acceptees:
    - croissant
    fautes_tolerees: 1
  indices:
    relance: On parle d'un ordre...
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: croissant. Le mot 'croissant' signifie que les valeurs vont du plus petit au plus grand.
- id: nblm-sur-une-droite-graduee-comment-appelle-t-8
  type: texte_court
  difficulte: 1
  enonce: Sur une droite graduée, comment appelle-t-on le nombre associé à un point pour donner sa position exacte (abscisse
    du point) ?
  reponse:
    acceptees:
    - abscisse
    fautes_tolerees: 1
  indices:
    relance: Ce terme désigne le nombre repérant la position d'un point sur la droite.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: abscisse. L'abscisse est le nom du nombre qui détermine la position d'un point sur une droite graduée.
