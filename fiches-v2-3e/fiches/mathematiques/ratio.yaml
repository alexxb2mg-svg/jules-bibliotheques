format: 2
notion: ratio
version: 2
etat: generee
declencheurs:
- partager selon
- parts inégales
- deux pour trois
- quantités mélangées
- partage proportionnel
- répartir en parts
- recette avec proportions
- associés qui se partagent
prerequis:
- 4e-proportionnalite-4e
essentiel: |
  Un ratio compare des quantités. Le ratio a : b se lit « a pour b ». Il sert à partager une quantité en parts inégales, ou à décrire un mélange.

  Partager une quantité selon le ratio a : b, c'est la couper en a + b parts égales : la première personne reçoit a parts, la seconde b parts.

  Exemple : partager 20 selon le ratio 1 : 3. On fait 1 + 3 = 4 parts. Une part vaut 20 ÷ 4 = 5. On obtient 1 × 5 = 5 et 3 × 5 = 15. Vérification : 5 + 15 = 20.

  Avec trois nombres a : b : c, on fait a + b + c parts. Exemple : 2 : 3 : 4 donne 9 parts.

  L'ordre compte : le ratio filles : garçons de 2 : 3 n'est pas le ratio garçons : filles. Les parts se donnent dans l'ordre des personnes citées.

  Un ratio ne change pas quand on multiplie ou divise tous ses nombres par un même nombre non nul : 12 : 18 est le même ratio que 2 : 3. On simplifie un ratio comme une fraction, avec le plus grand diviseur commun.

  Le ratio 1 : 1 partage en deux parts égales.

  Retrouver le total ou une part. Si on connaît la quantité d'une personne, on trouve la valeur d'une part, puis on refait le partage. Exemple : ratio 2 : 3, la première personne a 10 €. Une part vaut 10 ÷ 2 = 5 €, la seconde a 3 × 5 = 15 €, le total est 25 €.

  Pour partager en trois parts égales (ratio 1 : 1 : 1), chacun reçoit le tiers du total.

  Lien avec la proportionnalité : la part de chacun est proportionnelle à son nombre de parts. Une recette « 1 : 6 » (sirop : eau) garde le même goût quel que soit le volume préparé.

  Au brevet : partager une somme, une longueur ou un mélange (peinture, béton, boisson) selon un ratio de deux ou trois nombres, puis vérifier que la somme redonne le total.
methode:
- Additionner les nombres du ratio pour connaître le nombre total de parts.
- Diviser la quantité totale par ce nombre de parts pour trouver la valeur d'une part.
- Multiplier la valeur d'une part par le nombre de parts de chacun.
- Vérifier que la somme des parts redonne bien la quantité totale.
- Si on connaît une part, utiliser la valeur d'une part pour retrouver les autres parts et le total.
- Relire la question pour donner la part demandée, avec l'unité.
vocabulaire:
- terme: ratio
  definition: 'Écriture a : b qui indique comment une quantité est partagée entre deux (ou plusieurs) parties.'
- terme: part
  definition: Une des parts égales dans lesquelles on coupe la quantité totale.
- terme: valeur d'une part
  definition: La quantité totale divisée par le nombre total de parts.
- terme: partage proportionnel
  definition: Un partage où chacun reçoit une quantité proportionnelle à son nombre de parts.
- terme: ratio simplifié
  definition: 'Le ratio écrit avec les plus petits nombres entiers possibles, comme 2 : 3 pour 12 : 18.'
- terme: total
  definition: La quantité à partager, égale à la somme de toutes les parts.
erreurs_frequentes:
- Diviser par un des nombres du ratio au lieu de diviser par leur somme.
- Donner la valeur d'une part au lieu de la part demandée.
- Inverser l'ordre des nombres du ratio.
- Partager en parts égales sans tenir compte du ratio.
- Oublier de vérifier que la somme des parts redonne le total.
exemple:
  enonce: 'Partager 48 billes entre Sam et Inès selon le ratio 3 : 5.'
  solution: '3 + 5 = 8 parts ; une part vaut 48 ÷ 8 = 6 ; Sam reçoit 3 × 6 = 18 billes et Inès 5 × 6 = 30 billes. Vérification : 18 + 30 = 48.'
exercices:
- id: ratio-filles-garcons
  type: choix
  difficulte: 1
  enonce: 'Dans une classe, il y a 12 filles et 18 garçons. Quel ratio filles : garçons est correct ?'
  reponse:
    options:
    - id: a
      texte: '2 : 3'
    - id: b
      texte: '3 : 2'
    - id: c
      texte: '12 : 30'
    - id: d
      texte: '2 : 5'
    bonnes:
    - a
  indices:
    relance: 'Dans le ratio filles : garçons, quel nombre vient en premier ?'
    methode: 'Écris 12 : 18, puis divise les deux nombres par un même diviseur commun, le plus grand possible.'
    etape: 12 et 18 sont tous les deux divisibles par 6. Que deviennent-ils ?
  pieges:
  - si:
      contient:
      - b
    relance: 'Attention à l''ordre : on demande d''abord les filles, puis les garçons.'
  - si:
      contient:
      - c
    relance: 30 est le nombre total d'élèves. Le ratio compare les filles aux garçons, pas au total.
  - si:
      contient:
      - d
    relance: 'Compare 12 : 18 avec 2 : 5 en divisant 12 et 18 par un même nombre. Retrouves-tu 2 : 5 ?'
  solution: 'Le ratio filles : garçons est 12 : 18 ; en divisant les deux nombres par 6, on obtient 2 : 3.'
- id: partage-35-bonbons
  type: nombre
  difficulte: 1
  enonce: 'Léa et Tom se partagent 35 bonbons selon le ratio 2 : 5 (Léa : Tom). Combien de bonbons reçoit Léa ?'
  reponse:
    valeur: 10
    forme: entier
  indices:
    relance: 'Combien y a-t-il de parts en tout avec un ratio 2 : 5 ?'
    methode: Additionne les nombres du ratio, puis divise 35 par ce nombre de parts pour trouver la valeur d'une part.
    etape: Il y a 2 + 5 = 7 parts. Calcule d'abord la valeur d'une part, puis combien en reçoit Léa.
  pieges:
  - si:
      valeur: 25
    relance: 'Relis la question : c''est la part de Léa qu''on cherche, pas celle de Tom.'
  - si:
      valeur: 5
    relance: Ce nombre est la valeur d'une seule part. Combien de parts reçoit Léa ?
  solution: 2 + 5 = 7 parts ; une part vaut 35 ÷ 7 = 5 ; Léa reçoit 2 × 5 = 10 bonbons.
- id: sirop-280-ml
  type: nombre
  difficulte: 2
  enonce: 'Une boisson se prépare avec du sirop et de l''eau selon le ratio 1 : 6 (sirop : eau). On veut 280 mL de boisson. Quel volume d''eau faut-il, en mL ?'
  reponse:
    valeur: 240
    forme: libre
  indices:
    relance: En combien de parts égales la boisson est-elle partagée ?
    methode: 'Le ratio 1 : 6 donne 1 + 6 parts ; divise le volume total par le nombre de parts, puis multiplie par le nombre de parts d''eau.'
    etape: Il y a 7 parts, et une part vaut 280 ÷ 7. Combien de parts d'eau faut-il ?
  pieges:
  - si:
      valeur: 40
    relance: C'est le volume d'une part, donc celui du sirop. Combien de parts d'eau y a-t-il ?
  solution: 1 + 6 = 7 parts ; une part vaut 280 ÷ 7 = 40 mL ; il faut 6 × 40 = 240 mL d'eau.
- id: ruban-partage
  type: nombre
  difficulte: 2
  enonce: 'Un ruban de 96 cm est coupé en deux morceaux selon le ratio 5 : 3. Quelle est la longueur du plus court morceau, en cm ?'
  reponse:
    valeur: 36
    forme: libre
  indices:
    relance: Quel est le plus petit nombre du ratio, et à quel morceau correspond-il ?
    methode: Additionne les nombres du ratio, divise 96 par ce total pour avoir une part, puis multiplie par le plus petit nombre du ratio.
    etape: Il y a 5 + 3 = 8 parts. Calcule 96 ÷ 8, puis multiplie par 3.
  pieges:
  - si:
      valeur: 60
    relance: Ce nombre est la longueur du plus grand morceau. On demande le plus court.
  - si:
      valeur: 12
    relance: Ce nombre est la valeur d'une seule part. Combien de parts a le plus court morceau ?
  solution: 5 + 3 = 8 parts ; une part vaut 96 ÷ 8 = 12 cm ; le plus court morceau a 3 parts, soit 3 × 12 = 36 cm. L'autre morceau vaut 60 cm et 36 + 60 = 96.
- id: peinture-part-connue
  type: nombre
  difficulte: 3
  enonce: 'Pour une peinture, on mélange du bleu et du blanc selon le ratio 2 : 5 (bleu : blanc). On utilise 6 L de bleu. Quel est le volume total de peinture, en L ?'
  reponse:
    valeur: 21
    forme: libre
  indices:
    relance: Combien de parts représentent 6 L de bleu ? Quelle est alors la valeur d'une part ?
    methode: Le bleu représente 2 parts. Trouve la valeur d'une part, puis multiplie-la par le nombre total de parts.
    etape: Une part vaut 6 ÷ 2 = 3 L. Combien y a-t-il de parts en tout ?
  pieges:
  - si:
      valeur: 15
    relance: Ce nombre est le volume de blanc. On demande le volume total, bleu et blanc ensemble.
  - si:
      valeur: 3
    relance: Ce nombre est la valeur d'une seule part. Combien de parts y a-t-il au total ?
  solution: 2 parts de bleu = 6 L, donc une part vaut 3 L. Le total est 2 + 5 = 7 parts, soit 7 × 3 = 21 L (dont 15 L de blanc).
- id: associes-1800-euros
  type: nombre
  difficulte: 3
  enonce: 'Trois associés se partagent 1 800 € selon le ratio 2 : 3 : 4. Combien reçoit celui qui a la plus grande part, en euros ?'
  reponse:
    valeur: 800
    forme: libre
  indices:
    relance: Avec trois nombres dans le ratio, combien de parts faut-il faire en tout ?
    methode: Additionne les trois nombres du ratio, trouve la valeur d'une part, puis multiplie par le plus grand nombre du ratio.
    etape: Il y a 2 + 3 + 4 = 9 parts ; divise le montant total par 9 pour trouver une part. Qui en reçoit le plus ?
  pieges:
  - si:
      valeur: 600
    relance: 'Tu as partagé en trois parts égales. Le ratio 2 : 3 : 4 dit-il que les parts sont égales ?'
  - si:
      valeur: 200
    relance: Ce nombre est la valeur d'une seule part. Combien de parts reçoit le plus gros associé ?
  solution: 2 + 3 + 4 = 9 parts ; une part vaut 1 800 ÷ 9 = 200 € ; la plus grande part vaut 4 × 200 = 800 €.
- id: ratio-simplifie
  type: texte_court
  difficulte: 2
  enonce: 'Un jus contient 30 cL de sirop pour 90 cL d''eau. Écris le ratio sirop : eau sous sa forme la plus simple, avec deux nombres entiers.'
  reponse:
    acceptees:
    - '1 : 3'
    - '1:3'
    fautes_tolerees: 0
  indices:
    relance: Par quel nombre peux-tu diviser 30 et 90 en même temps ?
    methode: Divise les deux nombres du ratio par leur plus grand diviseur commun.
    etape: 30 et 90 sont tous deux multiples de 30. Que deviennent-ils quand tu les divises par 30 ?
  pieges:
  - si:
      valeur: '3 : 1'
    relance: 'Attention à l''ordre : on demande le ratio sirop : eau, avec le sirop en premier.'
  - si:
      diagnostic: mauvaise_reponse
    relance: Divise 30 et 90 par un même nombre, le plus grand possible, et garde l'ordre sirop puis eau.
  solution: 'Le ratio sirop : eau est 30 : 90. En divisant les deux nombres par 30, on obtient 1 : 3.'
- id: ratio-un-un
  type: ouverte
  difficulte: 2
  enonce: 'Explique avec tes mots pourquoi partager une quantité selon le ratio 1 : 1 revient à la partager en deux parts égales.'
  criteres:
  - 'L''élève dit que le ratio 1 : 1 donne 1 + 1 = 2 parts.'
  - L'élève dit que chaque personne reçoit une part, donc la même quantité.
  indices:
    relance: 'Avec le ratio 1 : 1, combien de parts fait-on en tout ?'
    methode: Additionne les nombres du ratio, puis regarde combien de parts reçoit chaque personne.
    etape: On fait 1 + 1 = 2 parts. Compare maintenant ce que reçoit chacun.
  solution: 'Avec le ratio 1 : 1, on fait 1 + 1 = 2 parts égales et chacun en reçoit une, donc chacun a la moitié.'
