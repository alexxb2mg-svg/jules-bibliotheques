# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: modes-representation-fonction
version: 2
etat: verifiee
declencheurs:
- programme de calcul en formule
- remplir le tableau avec la formule
- placer les points pour tracer
- traduire un programme de calcul
- point appartient à la courbe
- passer du tableau au graphique
- point sur la courbe
- tableau de valeurs fonction
- du programme à la formule
prerequis:
- 4e-notion-fonction
- 4e-calcul-litteral-developpement
essentiel: 'Une même fonction peut être donnée de quatre façons. Savoir passer de l''une à l''autre est une compétence du
  brevet.


  Une expression (une formule) : f(x) = 2x + 1. On lit : à x, la fonction associe 2x + 1.


  Un programme de calcul : « choisir un nombre, le multiplier par 2, ajouter 1 ». Le nombre choisi est x, le résultat est
  f(x).


  Un tableau de valeurs : une ligne pour les x, une ligne juste en dessous pour les f(x). Chaque colonne est un couple (x
  ; f(x)).


  Une représentation graphique (la courbe) : c''est l''ensemble des points de coordonnées (x ; f(x)). L''abscisse est le nombre
  de départ, l''ordonnée est son image. Le point (a ; b) est sur la courbe exactement quand f(a) = b.


  Passages à connaître.

  Programme vers expression : on part de x et on écrit chaque étape, avec des parenthèses quand une opération porte sur tout
  le résultat précédent. « Ajouter 3 puis multiplier par 2 » donne 2(x + 3).

  Expression vers tableau : on remplace x par chaque valeur et on calcule (attention aux nombres négatifs).

  Tableau vers graphique : on place les points (x ; f(x)) dans un repère, puis on les relie. Si tous les points sont alignés
  avec l''origine ou sur une droite, on trace une droite ; sinon, on relie à main levée par une courbe régulière.

  Graphique vers tableau : on lit l''ordonnée qui correspond à chaque abscisse choisie.


  Exemple : f(x) = x² − 1. f(−2) = 4 − 1 = 3 et f(0) = −1. Points (−2 ; 3) et (0 ; −1).


  Au brevet, on attend : traduire un programme de calcul, compléter un tableau, lire des coordonnées sur une courbe, et dire
  si un point appartient à la courbe en calculant.

  '
methode:
- 'Programme de calcul vers expression : partir de x et écrire le résultat de chaque étape, avec des parenthèses quand une
  opération porte sur tout le résultat précédent.'
- 'Expression vers tableau : pour chaque valeur de x, remplacer x par ce nombre (entre parenthèses s''il est négatif) et calculer.'
- 'Tableau vers graphique : chaque colonne donne un point (x ; f(x)) à placer dans un repère (abscisse d''abord), puis on
  relie les points sans faire de pointes.'
- 'Graphique vers valeurs : pour un point de la courbe, l''abscisse est le nombre de départ et l''ordonnée est son image.'
- 'Un point appartient à la courbe si l''ordonnée du point est égale à l''image de son abscisse : calculer f(a) et comparer.'
- Vérifier un résultat en testant une autre colonne du tableau.
vocabulaire:
- terme: fonction
  definition: Procédé qui, à chaque nombre x, associe un seul nombre noté f(x).
- terme: image
  definition: Le nombre f(x) associé à x par la fonction.
- terme: expression
  definition: La formule qui donne f(x) en fonction de x, par exemple 2x + 1.
- terme: tableau de valeurs
  definition: Tableau qui donne, pour plusieurs valeurs de x, les valeurs de f(x).
- terme: représentation graphique
  definition: La courbe formée de tous les points de coordonnées (x ; f(x)).
- terme: abscisse
  definition: 'La première coordonnée d''un point : sa position sur l''axe horizontal.'
- terme: ordonnée
  definition: 'La seconde coordonnée d''un point : sa position sur l''axe vertical.'
- terme: programme de calcul
  definition: Suite d'opérations à effectuer dans l'ordre sur un nombre choisi.
erreurs_frequentes:
- Oublier les parenthèses en traduisant un programme de calcul (écrire x + 3 × 2 au lieu de (x + 3) × 2).
- 'Inverser l''abscisse et l''ordonnée d''un point : (2 ; 5) signifie x = 2 et f(x) = 5.'
- Se tromper de signe en calculant avec un nombre négatif dans le tableau.
- Relier les points d'une courbe par des segments à la règle alors que ce n'est pas une droite.
- 'Croire qu''un point est sur la courbe parce qu''un des deux nombres est le bon : il faut que f(abscisse) soit égal à l''ordonnée.'
exemple:
  enonce: 'Programme : « Choisir un nombre, le multiplier par 3, puis soustraire 1. » Écrire l''expression f(x) et compléter
    le tableau pour x = −1, 0 et 2.'
  solution: f(x) = 3x − 1. f(−1) = 3 × (−1) − 1 = −4 ; f(0) = −1 ; f(2) = 3 × 2 − 1 = 5. Le tableau donne les points (−1 ;
    −4), (0 ; −1) et (2 ; 5).
exercices:
- id: tableau-image-negative
  type: nombre
  difficulte: 1
  enonce: On donne f(x) = 4x − 7. Dans le tableau de valeurs de f, quel nombre faut-il écrire sous x = −2 ?
  reponse:
    valeur: -15
    forme: libre
  indices:
    relance: Que faut-il calculer pour remplir la case sous x = −2 ?
    methode: Remplace x par (−2) dans l'expression, puis calcule en commençant par la multiplication.
    etape: Commence par 4 × (−2). Enlève ensuite 7 à ce résultat.
  pieges:
  - si:
      valeur: 1
    relance: 'Attention au signe : 4 multiplié par un nombre négatif donne-t-il un résultat positif ou négatif ?'
  - si:
      valeur: -1
    relance: 'Relis l''expression : on soustrait 7, on ne l''ajoute pas.'
  solution: f(−2) = 4 × (−2) − 7 = −8 − 7 = −15. On écrit −15 sous −2.
- id: programme-vers-expression
  type: expression
  difficulte: 1
  enonce: 'Programme de calcul : « Choisir un nombre. Lui ajouter 3. Multiplier le résultat par 2. » On note x le nombre choisi.
    Écris le résultat en fonction de x.'
  reponse:
    valeur: 2(x + 3)
    variables:
    - x
    forme: libre
  indices:
    relance: Après la deuxième étape, qu'as-tu obtenu en partant de x ?
    methode: Écris le résultat après chaque étape. Si on multiplie tout le résultat précédent, il faut des parenthèses.
    etape: Après l'étape 2, on a x + 3. C'est ce résultat entier qu'il faut multiplier par 2.
  pieges:
  - si:
      valeur: x + 3 × 2
    relance: Dans ton écriture, seul le 3 est multiplié par 2. Or le programme multiplie tout le résultat. Que faut-il ajouter
      ?
  - si:
      valeur: 2x + 3
    relance: Tu as multiplié x par 2 avant d'ajouter 3. Relis l'ordre des étapes du programme.
  solution: 'On part de x ; on ajoute 3 : x + 3 ; on multiplie le résultat par 2 : 2 × (x + 3), soit 2x + 6 une fois développé.'
- id: lire-points-courbe
  type: choix
  difficulte: 2
  enonce: La courbe représentative d'une fonction f passe par les points A(0 ; 2), B(1 ; 5) et C(3 ; −1). Quelles égalités
    sont vraies ?
  reponse:
    options:
    - id: a
      texte: f(1) = 5
    - id: b
      texte: f(5) = 1
    - id: c
      texte: f(3) = −1
    - id: d
      texte: f(2) = 0
    bonnes:
    - a
    - c
  indices:
    relance: Pour un point de la courbe, quelle coordonnée est le nombre de départ x, et laquelle est son image f(x) ?
    methode: 'Un point (a ; b) est sur la courbe de f exactement quand f(a) = b : l''abscisse d''abord, l''ordonnée ensuite.'
    etape: Le point A(0 ; 2) donne f(0) = 2. Fais pareil avec B et C, puis compare avec les égalités proposées.
  pieges:
  - si:
      contient:
      - b
    relance: Dans B(1 ; 5), le premier nombre est l'abscisse. Est-ce 1 ou 5 qui est le nombre de départ ?
  - si:
      contient:
      - d
    relance: Aucun des points donnés n'a pour abscisse 2. Peut-on savoir, avec ces seules informations, combien vaut f(2)
      ?
  - si:
      diagnostic: incomplet
    relance: Il y a une autre égalité vraie. Traduis chacun des trois points en égalité.
  solution: A donne f(0) = 2, B donne f(1) = 5 et C donne f(3) = −1. Les égalités a et c sont vraies. L'égalité b inverse
    les coordonnées de B, et on ne connaît pas f(2).
- id: programmes-et-expressions
  type: association
  difficulte: 2
  enonce: Associe chaque programme de calcul (a, b, c) à l'expression qui lui correspond (x, y, z ou w), où x est le nombre
    choisi. Une expression ne sert pas.
  reponse:
    gauche:
    - id: a
      texte: Multiplier par 3, puis soustraire 4.
    - id: b
      texte: Soustraire 4, puis multiplier le résultat par 3.
    - id: c
      texte: Élever au carré, puis ajouter 4.
    droite:
    - id: x
      texte: 3x − 4
    - id: y
      texte: 3(x − 4)
    - id: z
      texte: x² + 4
    - id: w
      texte: (x + 4)²
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Dans chaque programme, quelle opération est faite en premier ?
    methode: Écris le résultat de chaque étape en partant de x. Quand une opération porte sur tout le résultat précédent,
      mets des parenthèses.
    etape: Pour b, la première étape donne x − 4. Que devient ce résultat quand on le multiplie par 3 ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Regarde bien l'ordre des opérations dans chaque programme.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Pour chaque programme, écris les étapes une par une à partir de x.
  solution: 'a-x : 3 × x − 4 = 3x − 4. b-y : on calcule x − 4, puis 3 × (x − 4). c-z : x², puis x² + 4. L''expression (x +
    4)² correspond à « ajouter 4, puis élever au carré ».'
- id: tableau-vers-expression
  type: expression
  difficulte: 3
  enonce: 'Voici un tableau de valeurs d''une fonction p. Ligne des x : 0 ; 1 ; 2 ; 3. Ligne des p(x) : 1 ; 3 ; 5 ; 7. On
    sait que p(x) s''écrit sous la forme ax + b. Écris l''expression de p(x).'
  reponse:
    valeur: 2x + 1
    variables:
    - x
    forme: libre
  indices:
    relance: Que vaut p(0) ? Que devient ax + b quand on remplace x par 0 ?
    methode: Le nombre b est l'image de 0. Le nombre a est ce qu'on ajoute à p(x) quand x augmente de 1.
    etape: 'Regarde de combien augmente la ligne des images d''une colonne à la suivante : c''est le nombre a.'
  pieges:
  - si:
      valeur: x + 2
    relance: 'As-tu inversé a et b ? Vérifie avec x = 0 : ton expression donne-t-elle bien la valeur du tableau ?'
  - si:
      valeur: 2x
    relance: 'Vérifie ton expression avec x = 0 : trouves-tu la valeur donnée dans le tableau ?'
  solution: 'p(0) = 1, donc b = 1. Quand x augmente de 1, p(x) augmente de 2, donc a = 2. Ainsi p(x) = 2x + 1. Vérification
    : 2 × 3 + 1 = 7.'
- id: tracer-courbe-carre
  type: ouverte
  difficulte: 3
  enonce: 'On donne f(x) = x² − 1. Explique comment tracer la courbe de f pour x allant de −2 à 2 : quel tableau de valeurs
    tu fais, quels points tu places, et comment tu les relies.'
  criteres:
  - L'élève construit un tableau juste, par exemple f(−2) = 3, f(−1) = 0, f(0) = −1, f(1) = 0, f(2) = 3.
  - L'élève place les points (x ; f(x)) dans un repère et les relie par une courbe régulière, sans segments à la règle.
  indices:
    relance: Pour placer un point de la courbe, de quelles deux informations as-tu besoin ?
    methode: Choisis des valeurs de x entre −2 et 2, calcule leurs images, puis place chaque point (x ; f(x)).
    etape: 'Commence par x = −2 : (−2)² − 1. Attention, le carré d''un nombre négatif est positif.'
  solution: 'Tableau : pour x = −2, −1, 0, 1, 2, on trouve f(x) = 3, 0, −1, 0, 3. On place les points (−2 ; 3), (−1 ; 0),
    (0 ; −1), (1 ; 0) et (2 ; 3), puis on les relie à main levée par une courbe arrondie (ce n''est pas une droite).'
- id: ordre-tracer-courbe
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes pour tracer la courbe d'une fonction donnée par une formule.
  reponse:
    elements:
    - id: a
      texte: Choisir plusieurs valeurs de x
    - id: b
      texte: Calculer l'image de chaque valeur avec la formule
    - id: c
      texte: Écrire les résultats dans un tableau de valeurs
    - id: d
      texte: Placer les points (x ; f(x)) dans un repère
    - id: e
      texte: Relier les points par une courbe régulière
  indices:
    relance: Que faut-il avoir avant de pouvoir placer un point dans le repère ?
    methode: 'Pour placer un point, il faut ses deux coordonnées : il faut donc d''abord les calculer, à partir de valeurs
      de x choisies.'
    etape: On commence par choisir des valeurs de x, et on finit par relier les points.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont échangées. Demande-toi laquelle doit venir avant l''autre.'
  - si:
      diagnostic: ordre_faux
    relance: Pour placer un point, il faut connaître ses coordonnées. Reprends la liste depuis le début, étape par étape.
  solution: On choisit des valeurs de x, on calcule leurs images avec la formule, on écrit le tableau, on place les points
    (x ; f(x)), puis on les relie par une courbe régulière.
- id: point-sur-la-courbe
  type: texte_court
  difficulte: 2
  enonce: On donne f(x) = 2x + 1. Le point M(4 ; 10) appartient-il à la courbe de f ? Réponds par oui ou par non.
  reponse:
    acceptees:
    - non
    fautes_tolerees: 0
  indices:
    relance: Un point est sur la courbe si son ordonnée est l'image de son abscisse. Quelle est l'abscisse de M ?
    methode: Calcule f de l'abscisse de M avec la formule, puis compare le résultat à l'ordonnée de M.
    etape: Calcule 2 × 4 + 1. Ce nombre est-il égal à l'ordonnée de M ?
  pieges:
  - si:
      valeur: oui
    relance: Calcule f de l'abscisse de M avec la formule. Retrouves-tu exactement l'ordonnée de M ?
  solution: 'f(4) = 2 × 4 + 1 = 9. L''ordonnée de M est 10, qui est différente de 9 : M n''est pas sur la courbe. Réponse
    : non.'
