# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: etendue-serie-statistique
version: 3
etat: verifiee
declencheurs:
- écart entre le maximum et le minimum
- plus grande moins la plus petite
- résultats plus réguliers
- valeurs très dispersées
- écart entre les extrêmes
- série la plus dispersée
- écart entre max et min
- valeurs les plus éloignées
prerequis:
- 4e-calcul-rationnels
- indicateurs-position
essentiel: 'L''étendue d''une série statistique est la différence entre la plus grande valeur et la plus petite valeur : étendue
  = plus grande valeur − plus petite valeur.


  C''est un nombre positif (ou nul si toutes les valeurs sont égales). Il s''exprime dans la même unité que les valeurs :
  des points, des °C, des mètres, des buts.


  Exemple : notes 12 ; 7 ; 15 ; 9. Plus grande valeur 15, plus petite 7. Étendue : 15 − 7 = 8 points.


  L''étendue mesure la dispersion : plus elle est grande, plus les valeurs sont éloignées les unes des autres. Deux séries
  peuvent avoir la même moyenne et des étendues très différentes. Celle qui a la plus petite étendue est la plus régulière.


  Selon la présentation des données, on cherche les valeurs extrêmes différemment.

  Données brutes : on parcourt toute la liste (les extrêmes ne sont pas forcément le premier et le dernier nombre écrits).

  Tableau d''effectifs ou diagramme en bâtons : on regarde la ligne ou l''axe des valeurs, on garde les valeurs dont l''effectif
  n''est pas nul, et on calcule sur les valeurs, pas sur les effectifs.

  Diagramme circulaire : chaque secteur représente une valeur ou une catégorie de valeurs ; on repère les valeurs extrêmes
  présentes.

  Histogramme : les valeurs sont regroupées en classes. On calcule l''écart entre la borne supérieure de la dernière classe
  et la borne inférieure de la première : c''est une étendue de la série regroupée en classes.


  Avec des nombres négatifs, soustraire un nombre négatif revient à ajouter son opposé : 5 − (−4) = 9.


  Limite : une seule valeur très éloignée des autres suffit à rendre l''étendue grande. L''étendue ne dit rien de la moyenne.


  Au brevet, on attend : calculer l''étendue, l''interpréter en une phrase (« les valeurs varient de ... ») et comparer deux
  séries.

  '
methode:
- Repérer la plus grande valeur et la plus petite valeur de la série (pas la première et la dernière de la liste).
- 'Dans un tableau ou un diagramme : ne garder que les valeurs dont l''effectif n''est pas nul.'
- 'Pour un histogramme : prendre la borne supérieure de la dernière classe et la borne inférieure de la première.'
- 'Calculer : plus grande valeur − plus petite valeur, sans oublier l''unité.'
- 'Avec des nombres négatifs : soustraire un nombre négatif revient à ajouter son opposé.'
- 'Interpréter : comparer les étendues pour dire quelle série est la plus dispersée, et rester prudent si une valeur est isolée.'
vocabulaire:
- terme: série statistique
  definition: Liste de données (valeurs) recueillies pour une étude.
- terme: valeur
  definition: Une donnée de la série, par exemple une note ou une température.
- terme: effectif
  definition: Nombre de fois qu'une valeur apparaît dans la série.
- terme: étendue
  definition: Différence entre la plus grande et la plus petite valeur d'une série.
- terme: dispersion
  definition: Façon dont les valeurs sont plus ou moins éloignées les unes des autres.
- terme: valeur extrême
  definition: La plus grande ou la plus petite valeur de la série.
- terme: classe
  definition: Intervalle de valeurs regroupées, utilisé dans un histogramme.
- terme: diagramme en bâtons
  definition: Graphique où la hauteur de chaque bâton représente l'effectif d'une valeur.
erreurs_frequentes:
- Soustraire la première et la dernière valeur de la liste sans avoir cherché les valeurs extrêmes.
- Calculer l'étendue des effectifs au lieu de celle des valeurs.
- 'Se tromper de signe avec des valeurs négatives : 5 − (−4) n''est pas 1.'
- Compter une valeur dont l'effectif est 0 dans un tableau ou un diagramme.
- Croire qu'une grande étendue veut dire une grande moyenne.
exemple:
  enonce: 'Durées de sommeil d''un élève sur une semaine (en heures) : 8 ; 7,5 ; 9 ; 6 ; 8,5 ; 10 ; 7. Calcule l''étendue.'
  solution: 'Plus grande valeur : 10 h. Plus petite valeur : 6 h. Étendue : 10 − 6 = 4 h. Les durées varient de 4 heures au
    plus sur la semaine.'
exercices:
- id: etendue-scores
  type: nombre
  difficulte: 1
  enonce: 'Voici les scores de Yanis à un jeu : 14 ; 9 ; 21 ; 17 ; 6 ; 12. Calcule l''étendue de cette série.'
  reponse:
    valeur: 15
    forme: libre
  indices:
    relance: Quelle est la plus grande valeur de la série ? Et la plus petite ?
    methode: Étendue = plus grande valeur − plus petite valeur.
    etape: La plus grande valeur est 21. Cherche maintenant la plus petite, puis fais la soustraction.
  pieges:
  - si:
      valeur: 2
    relance: Tu as soustrait la première et la dernière valeur de la liste. Il faut chercher la plus grande et la plus petite
      valeur.
  - si:
      valeur: 21
    relance: 21 est la plus grande valeur. L'étendue est l'écart entre la plus grande et la plus petite.
  - si:
      diagnostic: valeur_fausse
    relance: 'Relis toute la liste : as-tu bien trouvé la plus petite valeur ?'
  solution: 'Plus grande valeur : 21 ; plus petite valeur : 6. Étendue = 21 − 6 = 15 points.'
- id: etendue-temperatures
  type: nombre
  difficulte: 2
  enonce: 'Températures minimales d''une semaine d''hiver, en °C : −4 ; 2 ; −1 ; 5 ; 3 ; −2 ; 0. Calcule l''étendue de cette
    série (en °C).'
  reponse:
    valeur: 9
    forme: libre
  indices:
    relance: Quelle est la température la plus basse ? Attention, c'est un nombre négatif.
    methode: Étendue = plus grande valeur − plus petite valeur. Soustraire un nombre négatif revient à ajouter son opposé.
    etape: La plus grande valeur est 5 et la plus petite est −4. Calcule 5 − (−4).
  pieges:
  - si:
      valeur: 1
    relance: Tu as calculé 5 − 4. Or la plus petite valeur est −4, pas 4. Que devient 5 − (−4) ?
  - si:
      valeur: -9
    relance: 'Une étendue n''est jamais négative : c''est la plus grande valeur moins la plus petite, dans cet ordre.'
  - si:
      valeur: 7
    relance: 'Tu as pris −2 comme plus petite valeur. Laquelle est la plus basse : −2 ou −4 ?'
  solution: 'Plus grande valeur : 5 °C ; plus petite valeur : −4 °C. Étendue = 5 − (−4) = 5 + 4 = 9 °C.'
- id: etendue-diagramme-batons
  type: nombre
  difficulte: 2
  enonce: 'Un diagramme en bâtons donne le nombre de buts marqués par une équipe à chaque match de la saison. 0 but : 4 matchs
    ; 1 but : 7 matchs ; 2 buts : 5 matchs ; 3 buts : 1 match ; 4 buts : 2 matchs ; 5 buts : 0 match. Quelle est l''étendue
    du nombre de buts marqués par match ?'
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Ici, les valeurs sont les nombres de buts, et les effectifs sont les nombres de matchs. Sur quoi porte l'étendue
      ?
    methode: Cherche le plus grand et le plus petit nombre de buts vraiment marqués dans un match (effectif non nul), puis
      fais la différence.
    etape: Le plus petit nombre de buts marqués dans un match est 0. Quel est le plus grand nombre de buts marqués dans au
      moins un match ?
  pieges:
  - si:
      valeur: 5
    relance: L'équipe a-t-elle marqué 5 buts dans un match ? Regarde l'effectif de cette valeur.
  - si:
      valeur: 7
    relance: 'Tu as calculé l''étendue des effectifs (nombres de matchs). L''étendue porte sur les valeurs : les nombres de
      buts.'
  - si:
      valeur: 6
    relance: Tu as fait la différence entre des nombres de matchs. L'étendue porte sur les nombres de buts.
  solution: 'Les valeurs prises sont 0, 1, 2, 3 et 4 buts (5 buts : aucun match). Étendue = 4 − 0 = 4 buts.'
- id: comparer-deux-equipes
  type: choix
  difficulte: 2
  enonce: 'Deux équipes de cinq élèves lancent un poids. Distances en mètres. Équipe A : 12 ; 15 ; 13 ; 14 ; 16. Équipe B
    : 5 ; 22 ; 10 ; 18 ; 15. Quelles affirmations sont vraies ?'
  reponse:
    options:
    - id: a
      texte: Les deux équipes ont la même moyenne.
    - id: b
      texte: Les résultats de l'équipe A sont plus réguliers que ceux de l'équipe B.
    - id: c
      texte: L'étendue de l'équipe B est 22 m.
    - id: d
      texte: L'équipe qui a la plus grande étendue a forcément la meilleure moyenne.
    bonnes:
    - a
    - b
  indices:
    relance: Calcule la moyenne et l'étendue de chaque équipe avant de choisir.
    methode: 'Moyenne : somme ÷ 5. Étendue : plus grande distance − plus petite distance. Une petite étendue veut dire des
      résultats proches les uns des autres.'
    etape: 'Pour l''équipe A : la somme fait 70 et l''étendue fait 16 − 12. Fais les mêmes calculs pour l''équipe B.'
  pieges:
  - si:
      contient:
      - c
    relance: 22 m est la plus grande distance de l'équipe B. L'étendue, c'est l'écart avec la plus petite.
  - si:
      contient:
      - d
    relance: L'étendue mesure l'écart entre les valeurs extrêmes. Dit-elle quelque chose sur la moyenne ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une affirmation vraie, mais il y en a une autre. As-tu calculé les deux moyennes et les deux étendues
      ?
  solution: 'Équipe A : somme 70, moyenne 14 m, étendue 16 − 12 = 4 m. Équipe B : somme 70, moyenne 14 m, étendue 22 − 5 =
    17 m. a est vraie, b est vraie (étendue bien plus petite), c est fausse (17 m), d est fausse : l''étendue ne dit rien
    de la moyenne.'
- id: note-manquante
  type: nombre
  difficulte: 3
  enonce: 'Voici quatre notes : 8 ; 13 ; 10 ; 15. Noa ajoute sa note, qui est la plus petite des cinq. L''étendue des cinq
    notes vaut alors 12. Quelle est la note de Noa ?'
  reponse:
    valeur: 3
    forme: libre
  indices:
    relance: Si la note de Noa est la plus petite, quelle est la plus grande note des cinq ?
    methode: 'Écris l''égalité : plus grande note − note de Noa = étendue, puis trouve la note de Noa.'
    etape: La plus grande note est 15. Quel nombre faut-il retirer à 15 pour obtenir 12 ?
  pieges:
  - si:
      valeur: 20
    relance: 'Tu as ajouté 12 à la plus petite des quatre notes. Mais la note de Noa est la plus petite : c''est la plus grande
      note qui sert de départ.'
  - si:
      valeur: 27
    relance: Avec cette note, Noa aurait la plus grande note, pas la plus petite. Relis l'énoncé.
  - si:
      valeur: 4
    relance: 'Tu as calculé 12 − 8. Mais 8 n''est plus la plus petite note : c''est la note de Noa qui l''est.'
  solution: La note de Noa est la plus petite, et la plus grande note reste 15. On cherche la note telle que 15 − note = 12,
    donc note = 15 − 12 = 3. Noa a eu 3.
- id: etendue-et-valeur-extreme
  type: ouverte
  difficulte: 3
  enonce: 'Âges des membres d''un club d''échecs : 12 ; 13 ; 13 ; 14 ; 14 ; 15 ; 58. Calcule l''étendue. Cette étendue décrit-elle
    bien le groupe ? Explique.'
  criteres:
  - 'L''élève calcule l''étendue : 58 − 12 = 46 ans.'
  - L'élève remarque qu'une seule valeur (58 ans, sans doute l'animateur) est très éloignée des autres et rend l'étendue grande.
  - 'L''élève conclut que sans cette valeur les âges sont très proches (étendue de 3 ans) : l''étendue seule ne décrit pas
    bien ce groupe.'
  indices:
    relance: Toutes les valeurs sont-elles proches les unes des autres ? Laquelle se démarque ?
    methode: Calcule l'étendue avec toutes les valeurs, puis sans la valeur qui se démarque, et compare les deux résultats.
    etape: Avec toutes les valeurs, la plus grande est 58 et la plus petite 12. Calcule, puis refais le calcul sans 58.
  solution: 'Étendue : 58 − 12 = 46 ans. Pourtant six membres ont entre 12 et 15 ans : sans la valeur 58, l''étendue serait
    15 − 12 = 3 ans. Une seule valeur extrême suffit à rendre l''étendue grande : ici, elle donne une fausse idée d''un groupe
    très varié.'
- id: nblm-quelle-est-la-formule-fondamentale-pour-1
  type: choix
  difficulte: 2
  enonce: Quelle est la formule fondamentale pour calculer l'étendue d'une série statistique (plus grande moins la plus petite)
    ?
  reponse:
    options:
    - id: o1
      texte: La plus grande valeur moins la plus petite valeur
    - id: o2
      texte: La somme de toutes les valeurs divisée par l'effectif total
    - id: o3
      texte: La valeur du milieu qui partage la série en deux groupes égaux
    - id: o4
      texte: Le plus grand effectif moins le plus petit effectif
    bonnes:
    - o1
  indices:
    relance: Pense à la différence entre les deux valeurs limites de la série.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Cette formule correspond au calcul de la moyenne de la série, pas de l'étendue.
  - si:
      contient:
      - o3
    relance: C'est la définition de la médiane d'une série statistique.
  - si:
      contient:
      - o4
    relance: C'est une erreur classique qui consiste à soustraire les effectifs au lieu des valeurs de la série.
  solution: 'La plus grande valeur moins la plus petite valeur. C''est la définition exacte de l''étendue : la différence
    entre la plus grande et la plus petite valeur de la série.'
- id: nblm-dans-un-releve-de-temperatures-c-3-2-5-8-2
  type: choix
  difficulte: 2
  enonce: 'Dans un relevé de températures (°C) : -3 ; 2 ; 5 ; -8 ; 11, quel est l''écart entre le maximum et le minimum (l''étendue)
    ?'
  reponse:
    options:
    - id: o1
      texte: 19 °C
    - id: o2
      texte: 3 °C
    - id: o3
      texte: 14 °C
    - id: o4
      texte: 11 °C
    bonnes:
    - o1
  indices:
    relance: Attention aux règles de calcul avec les nombres négatifs lors de la soustraction de la plus petite valeur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de signe fréquente : effectuer 11 − 8 = 3 au lieu de 11 − (−8).'
  - si:
      contient:
      - o3
    relance: Calcul incorrect résultant d'une soustraction entre la première et la dernière valeur de la liste.
  - si:
      contient:
      - o4
    relance: C'est simplement la valeur maximale de la série, sans avoir soustrait la valeur minimale.
  solution: 19 °C. On calcule 11 − (−8) = 11 + 8 = 19 °C. Soustraire un nombre négatif revient à ajouter son opposé.
- id: nblm-deux-eleves-ont-la-meme-moyenne-de-12-20-3
  type: choix
  difficulte: 2
  enonce: Deux élèves ont la même moyenne de 12/20. L'élève A a une étendue de 3 et l'élève B une étendue de 10. Pourquoi
    dit-on que l'élève A a des résultats plus réguliers ?
  reponse:
    options:
    - id: o1
      texte: Parce qu'une faible étendue indique des notes peu dispersées et proches les unes des autres
    - id: o2
      texte: Parce que sa note maximale est forcément supérieure à celle de l'élève B
    - id: o3
      texte: Parce que sa moyenne est plus élevée que celle de l'élève B
    - id: o4
      texte: Parce qu'il a obtenu plus de notes que l'élève B
    bonnes:
    - o1
  indices:
    relance: Une faible étendue signifie que toutes les valeurs sont serrées autour du centre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'étendue ne donne pas la valeur de la note maximale, mais l'écart entre le maximum et le minimum.
  - si:
      contient:
      - o3
    relance: L'énoncé indique clairement que les deux élèves ont exactement la même moyenne de 12/20.
  - si:
      contient:
      - o4
    relance: L'étendue dépend de l'écart entre les extrêmes et non du nombre de devoirs réalisés.
  solution: Parce qu'une faible étendue indique des notes peu dispersées et proches les unes des autres. Une étendue plus
    petite signifie une plus faible dispersion des notes autour de la moyenne, donc des résultats plus réguliers.
- id: nblm-que-signifie-concretement-le-fait-d-obte-4
  type: choix
  difficulte: 2
  enonce: Que signifie concrètement le fait d'obtenir des valeurs très dispersées dans une étude statistique ?
  reponse:
    options:
    - id: o1
      texte: Que l'étendue de la série statistique est grande
    - id: o2
      texte: Que la moyenne de la série est nécessairement égale à zéro
    - id: o3
      texte: Que toutes les données récoltées sont identiques
    - id: o4
      texte: Que l'effectif total de la série est très petit
    bonnes:
    - o1
  indices:
    relance: L'étendue sert d'indicateur pour mesurer la dispersion.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La dispersion et l'étendue n'imposent aucune valeur particulière pour la moyenne.
  - si:
      contient:
      - o3
    relance: Si toutes les données étaient identiques, l'étendue serait nulle (égale à 0).
  - si:
      contient:
      - o4
    relance: La dispersion concerne l'écart entre les valeurs, pas la quantité de données récoltées.
  solution: Que l'étendue de la série statistique est grande. Plus les valeurs sont éloignées les unes des autres, plus la
    dispersion est forte et l'étendue grande.
- id: nblm-dans-un-tableau-d-effectifs-comment-dete-5
  type: choix
  difficulte: 2
  enonce: Dans un tableau d'effectifs, comment détermine-t-on correctement l'écart entre les extrêmes pour trouver l'étendue
    ?
  reponse:
    options:
    - id: o1
      texte: On calcule la différence entre la plus grande et la plus petite valeur dont l'effectif est non nul
    - id: o2
      texte: On calcule la différence entre l'effectif maximal et l'effectif minimal
    - id: o3
      texte: On soustrait la première valeur de la dernière valeur du tableau sans vérifier l'ordre
    - id: o4
      texte: On divise la somme des effectifs par deux
    bonnes:
    - o1
  indices:
    relance: Regarde la ligne des valeurs observées, et non la ligne des effectifs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : l''étendue se calcule sur les valeurs du caractère, pas sur les effectifs.'
  - si:
      contient:
      - o3
    relance: Si les valeurs ne sont pas ordonnées ou si une extrémité a un effectif nul, le résultat sera faux.
  - si:
      contient:
      - o4
    relance: Cette opération n'a aucun lien avec la recherche de l'étendue.
  solution: On calcule la différence entre la plus grande et la plus petite valeur dont l'effectif est non nul. On repère
    les valeurs représentées (effectif > 0) et on calcule la différence sur la ligne des valeurs.
- id: nblm-quelles-sont-les-proprietes-correctes-co-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les propriétés correctes concernant l'étendue d'une série statistique ? (Sélectionne les 2 bonnes réponses)
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Elle s'exprime toujours dans la même unité que les valeurs de la série
    - id: o2
      texte: C'est un nombre toujours supérieur ou égal à zéro
    - id: o3
      texte: Elle augmente obligatoirement dès que l'effectif total augmente
    - id: o4
      texte: Elle permet de calculer directement la somme de toutes les données
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense au signe du résultat d'un tel calcul et aux unités de mesure.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Ajouter des valeurs situées entre le minimum et le maximum ne modifie pas l'étendue.
  - si:
      contient:
      - o4
    relance: L'étendue ne donne des informations que sur les extrêmes, pas sur la totalité des données.
  solution: 'Elle s''exprime toujours dans la même unité que les valeurs de la série ; C''est un nombre toujours supérieur
    ou égal à zéro. Comme c''est une soustraction entre deux valeurs de la série, l''étendue conserve l''unité des données
    (ex : cm, kg, °C).'
- id: nblm-quel-mot-designe-l-indicateur-statistiqu-7
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne l'indicateur statistique mesuré par l'étendue, qui indique si les données sont étalées ou resserrées
    ?
  reponse:
    acceptees:
    - dispersion
    fautes_tolerees: 1
  indices:
    relance: Ce terme qualifie la façon dont les valeurs sont éloignées les unes des autres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: dispersion. L'étendue est l'indicateur de dispersion au programme de 3ème.
- id: nblm-quelle-est-l-etendue-de-la-serie-de-note-8
  type: texte_court
  difficulte: 1
  enonce: 'Quelle est l''étendue de la série de notes suivantes : 4 ; 7 ; 12 ; 15 ; 18 ?'
  reponse:
    acceptees:
    - '14'
    fautes_tolerees: 1
  indices:
    relance: Calcule la différence entre la valeur maximale et la valeur minimale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 14. La plus grande valeur est 18 et la plus petite est 4. L'étendue vaut 18 − 4 = 14.
- id: etendue-tableau-effectifs
  type: nombre
  difficulte: 2
  enonce: 'Un tableau donne le nombre de frères et sœurs de 20 élèves. 0 : 6 élèves ; 1 : 8 élèves ; 2 : 4 élèves ; 3 : 0
    élève ; 4 : 2 élèves. Quelle est l''étendue du nombre de frères et sœurs ?'
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Ici, les valeurs sont des nombres de frères et sœurs. Que représente le nombre d'élèves de chaque ligne ?
    methode: Cherche la plus petite et la plus grande valeur qui apparaissent vraiment (effectif non nul), puis soustrais.
    etape: La plus petite valeur est 0. Quelle est la plus grande valeur dont l'effectif n'est pas nul ?
  pieges:
  - si:
      valeur: 8
    relance: 8 est le plus grand effectif. L'étendue se calcule sur les valeurs, pas sur les effectifs.
  - si:
      valeur: 6
    relance: 6 est l'effectif de la valeur 0, c'est un nombre d'élèves. Cherche les valeurs extrêmes, pas les effectifs.
  solution: Les valeurs prises sont 0, 1, 2 et 4 (l'effectif de 3 est 0, mais 4 est atteint). Étendue = 4 − 0 = 4.
- id: etendue-histogramme-tailles
  type: nombre
  difficulte: 2
  enonce: 'Un histogramme regroupe les tailles (en cm) de 30 élèves en classes : [140 ; 150[, [150 ; 160[, [160 ; 170[ et
    [170 ; 180[. Chaque classe contient au moins un élève. Quelle est l''étendue de la série regroupée en classes, en cm ?'
  reponse:
    valeur: 40
    forme: entier
  indices:
    relance: Quelle est la plus petite valeur possible de la série, et la plus grande, d'après les classes ?
    methode: Pour un histogramme, on prend la borne supérieure de la dernière classe moins la borne inférieure de la première.
    etape: La borne inférieure de la première classe est 140. Cherche la borne supérieure de la dernière classe, puis soustrais.
  pieges:
  - si:
      valeur: 30
    relance: 30 est le nombre d'élèves, c'est un effectif. L'étendue porte sur les valeurs, ici les tailles.
  - si:
      valeur: 10
    relance: 10 est la largeur d'une classe. L'étendue va de la première borne à la dernière.
  - si:
      valeur: 30.5
    relance: Tu as sans doute confondu classes et effectifs. Utilise seulement les bornes des classes.
  solution: La série va de 140 à 180 cm. Étendue = 180 − 140 = 40 cm.
