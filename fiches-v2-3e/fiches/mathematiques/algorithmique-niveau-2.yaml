# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: algorithmique-niveau-2
version: 2
etat: verifiee
declencheurs:
- quand la touche espace est pressée
- mettre la variable à
- ajouter 1 à la variable
- si alors sinon
- demander et attendre
- que vaut la variable à la fin
- quand je reçois un message
- la variable réponse
prerequis:
- algorithmique-niveau-1
essentiel: 'Événement. Un script démarre en réponse à un événement : « quand le drapeau vert est cliqué », « quand la touche
  espace est pressée », « quand ce lutin est cliqué », « quand je reçois un message ». Le bloc d''événement est toujours en
  haut du script. Un programme peut avoir plusieurs scripts, chacun lancé par son événement.


  Variable. Une variable est une case mémoire qui porte un nom et contient une valeur. « mettre score à 0 » remplace la valeur
  par 0. « ajouter 1 à score » augmente la valeur de 1. On initialise une variable au début du script. « demander … et attendre
  » range ce que l''utilisateur tape dans la variable « réponse ».


  Séquence. Les blocs s''exécutent dans l''ordre, de haut en bas, un par un. L''ordre compte : ajouter 4 puis multiplier par
  3 ne donne pas le même résultat que multiplier par 3 puis ajouter 4.


  Condition. « si … alors … sinon » teste une condition. Si elle est vraie, on exécute le premier groupe de blocs ; sinon,
  le second. On ne suit qu''un seul chemin. Les comparaisons utilisent >, <, = et les tests comme « n est pair ».


  Boucle. « répéter n fois » exécute n fois les blocs qu''elle contient. Une condition peut se trouver dans une boucle : elle
  est alors testée à chaque passage.


  Variable dans un programme. Une variable peut servir à un calcul (programme de calcul, somme, compteur), à une construction
  (la longueur du côté d''un carré qu''on augmente à chaque passage) ou à un déplacement (la position du lutin).


  Tableau de suivi. Pour savoir ce que vaut une variable à la fin, on fait un tableau : une colonne par variable, une ligne
  par étape ou par passage dans la boucle.


  Au brevet : on te demande de lire un script, de dire ce que vaut une variable ou ce que fait le lutin, de compléter ou d''écrire
  un script avec une variable, une boucle et une condition.

  '
methode:
- Repérer l'événement qui lance le script.
- 'Faire un tableau de suivi : une colonne par variable, et noter leur valeur de départ.'
- Exécuter les blocs un par un, dans l'ordre, et écrire la nouvelle valeur après chaque bloc qui modifie une variable.
- Dans une boucle, faire exactement le nombre de passages indiqué, en numérotant chaque passage.
- Pour une condition, calculer si elle est vraie ou fausse avec les valeurs du moment, puis ne suivre qu'un seul des deux
  chemins.
vocabulaire:
- terme: variable
  definition: Une case mémoire nommée dont la valeur peut changer pendant le programme.
- terme: événement
  definition: Une action (clic, touche, message) qui déclenche un script.
- terme: initialiser
  definition: Donner une valeur de départ à une variable, en général au début du script.
- terme: séquence
  definition: Une suite de blocs exécutés dans l'ordre, l'un après l'autre.
- terme: condition
  definition: Un test qui est vrai ou faux et qui décide du chemin suivi dans « si … alors … sinon ».
- terme: boucle
  definition: Un bloc qui fait répéter les blocs qu'il contient.
- terme: compteur
  definition: Une variable qui augmente d'un même nombre à chaque passage, pour compter.
- terme: tableau de suivi
  definition: Un tableau où l'on note la valeur des variables après chaque étape.
erreurs_frequentes:
- 'Oublier d''initialiser une variable : elle garde la valeur de l''exécution précédente.'
- Confondre « mettre … à » (remplacer la valeur) et « ajouter … à » (augmenter la valeur).
- Compter un passage de trop ou de moins dans une boucle.
- Suivre les deux branches d'un « si … alors … sinon » au lieu d'une seule.
- Utiliser l'ancienne valeur d'une variable alors qu'elle vient d'être modifiée par le bloc précédent.
exemple:
  enonce: 'Script : « mettre a à 2 ; répéter 3 fois : mettre a à a × 2 ». Que vaut a à la fin ?'
  solution: 'Tableau de suivi : départ a = 2 ; passage 1 : a = 4 ; passage 2 : a = 8 ; passage 3 : a = 16. À la fin, a vaut
    16.'
exercices:
- id: bloc-evenement
  type: choix
  difficulte: 1
  enonce: On veut que le lutin saute chaque fois qu'on appuie sur la touche espace. Quel bloc faut-il placer en haut du script
    ?
  reponse:
    options:
    - id: a
      texte: quand la touche espace est pressée
    - id: b
      texte: attendre 1 seconde
    - id: c
      texte: répéter 10 fois
    - id: d
      texte: quand ce lutin est cliqué
    bonnes:
    - a
  indices:
    relance: 'Qu''est-ce qui doit lancer le saut : un clic, une touche, un temps ?'
    methode: Un script démarre par un bloc d'événement, qui commence par « quand ».
    etape: Deux blocs commencent par « quand ». Lequel parle du clavier ?
  pieges:
  - si:
      contient:
      - d
    relance: Ce bloc lance le script quand on clique sur le lutin avec la souris. Est-ce ce qui est demandé ?
  - si:
      contient:
      - b
    relance: Ce bloc fait patienter, il ne lance rien. Quel type de bloc démarre un script ?
  - si:
      contient:
      - c
    relance: Une boucle répète des blocs, mais elle ne réagit pas au clavier. Quel type de bloc démarre un script ?
  solution: 'Le script doit démarrer quand on appuie sur la touche : c''est le bloc d''événement « quand la touche espace
    est pressée ».'
- id: total-dans-la-boucle
  type: nombre
  difficulte: 2
  enonce: 'Script : « mettre total à 0 ; mettre k à 1 ; répéter 4 fois : ajouter k à total, ajouter 1 à k ». Que vaut la variable
    total à la fin ?'
  reponse:
    valeur: 10
    forme: libre
  indices:
    relance: Que valent total et k au départ ? Que se passe-t-il au premier passage ?
    methode: Fais un tableau de suivi avec une colonne total et une colonne k, et une ligne par passage dans la boucle. Il
      y a exactement 4 passages.
    etape: 'Passage 1 : total devient 0 + 1 = 1, puis k devient 2. Continue pour les passages 2, 3 et 4.'
  pieges:
  - si:
      valeur: 15
    relance: 'Tu as fait un passage de trop dans la boucle. Numérote tes passages : combien y en a-t-il ?'
  - si:
      valeur: 6
    relance: Il te manque un passage. La boucle est exécutée combien de fois ?
  - si:
      valeur: 14
    relance: Dans la boucle, on ajoute k à total AVANT d'augmenter k. Au premier passage, quelle valeur de k ajoute-t-on ?
  solution: 'Passage 1 : total = 1, k = 2. Passage 2 : total = 3, k = 3. Passage 3 : total = 6, k = 4. Passage 4 : total =
    10, k = 5. À la fin, total vaut 10.'
- id: si-alors-sinon
  type: nombre
  difficulte: 2
  enonce: 'Script : « demander Choisis un nombre et attendre ; si réponse > 10 alors dire réponse − 10, sinon dire réponse
    × 3 ». Léo tape 7. Quel nombre le lutin dit-il ?'
  reponse:
    valeur: 21
    forme: libre
  indices:
    relance: La condition « réponse > 10 » est-elle vraie quand réponse vaut 7 ?
    methode: Si la condition est fausse, on saute le « alors » et on exécute seulement la partie « sinon ».
    etape: '7 n''est pas plus grand que 10 : c''est la partie « sinon » qui s''exécute. Calcule 7 × 3.'
  pieges:
  - si:
      valeur: -3
    relance: Tu as suivi la partie « alors ». Mais 7 est-il plus grand que 10 ?
  solution: '7 > 10 est faux, donc on exécute la partie « sinon » : le lutin dit 7 × 3 = 21.'
- id: programme-de-calcul-en-ordre
  type: ordre
  difficulte: 2
  enonce: 'Programme de calcul : choisir un nombre, lui ajouter 4, multiplier le résultat par 3, puis annoncer le résultat.
    Remets les blocs du script dans l''ordre.'
  reponse:
    elements:
    - id: a
      texte: quand le drapeau vert est cliqué
    - id: b
      texte: demander Choisis un nombre et attendre
    - id: c
      texte: mettre x à réponse
    - id: d
      texte: mettre x à x + 4
    - id: e
      texte: mettre x à x × 3
    - id: f
      texte: dire x
  indices:
    relance: Quel bloc lance le script ? Et que faut-il connaître avant de calculer ?
    methode: 'Suis l''ordre du programme de calcul : d''abord obtenir le nombre et le ranger dans x, puis les deux opérations
      dans l''ordre de l''énoncé, puis l''annonce.'
    etape: Le script commence par « quand le drapeau vert est cliqué », puis « demander Choisis un nombre et attendre ». Où
      ranger la réponse ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux blocs voisins sont inversés. Ajouter 4 puis multiplier par 3, est-ce la même chose que multiplier
      par 3 puis ajouter 4 ? Essaie avec 1.'
  solution: 'quand le drapeau vert est cliqué ; demander Choisis un nombre et attendre ; mettre x à réponse ; mettre x à x
    + 4 ; mettre x à x × 3 ; dire x. L''ordre des deux calculs compte : avec 1, on obtient (1 + 4) × 3 = 15, alors que 1 ×
    3 + 4 = 7.'
- id: somme-des-pairs
  type: nombre
  difficulte: 3
  enonce: 'Script : « mettre n à 0 ; mettre s à 0 ; répéter 6 fois : ajouter 1 à n, puis si n est pair alors ajouter n à s
    ». Que vaut la variable s à la fin ?'
  reponse:
    valeur: 12
    forme: libre
  indices:
    relance: Quelles valeurs prend n au fil des passages ? Pour lesquelles la condition est-elle vraie ?
    methode: 'Fais un tableau de suivi : à chaque passage, augmente n, puis regarde si n est pair avant de modifier s.'
    etape: 'Passage 1 : n = 1, impair, s ne change pas. Passage 2 : n = 2, pair, s = 0 + 2. Continue jusqu''au passage 6.'
  pieges:
  - si:
      valeur: 21
    relance: Tu as ajouté toutes les valeurs de n. La condition « si n est pair » laisse-t-elle passer 1, 3 et 5 ?
  - si:
      valeur: 9
    relance: 'Tu as ajouté les nombres impairs. Relis la condition : quelles valeurs de n sont ajoutées ?'
  - si:
      valeur: 6
    relance: Il te manque un nombre pair. Jusqu'à quelle valeur n monte-t-il en 6 passages ?
  solution: 'n prend les valeurs 1, 2, 3, 4, 5, 6. Seules les valeurs paires 2, 4 et 6 sont ajoutées à s : s = 2 + 4 + 6 =
    12.'
- id: majeur-ou-mineur
  type: ouverte
  difficulte: 3
  enonce: Écris un script qui, au clic sur le drapeau vert, demande l'âge de l'utilisateur, puis dit « majeur » si l'âge est
    supérieur ou égal à 18, et « mineur » sinon.
  criteres:
  - Le script commence par un événement et utilise « demander … et attendre » pour obtenir l'âge (dans « réponse » ou dans
    une variable).
  - Le script utilise un « si … alors … sinon » avec une condition correcte (âge ≥ 18, ou âge > 17, ou non âge < 18).
  - Le lutin dit « majeur » dans la partie « alors » et « mineur » dans la partie « sinon ».
  indices:
    relance: Quel bloc permet de poser une question à l'utilisateur ? Et quel bloc permet de choisir entre deux réponses ?
    methode: 'Enchaîne : l''événement, la question, puis une condition « si … alors … sinon » qui compare la réponse à 18.'
    etape: Commence par « quand le drapeau vert est cliqué » puis « demander Quel âge as-tu ? et attendre ». Écris ensuite
      la condition.
  solution: 'quand le drapeau vert est cliqué ; demander Quel âge as-tu ? et attendre ; si réponse < 18 alors dire mineur,
    sinon dire majeur. (Autre écriture correcte : si réponse > 17 alors dire majeur, sinon dire mineur.)'
- id: nblm-dans-scratch-quel-type-de-bloc-est-quand-1
  type: choix
  difficulte: 2
  enonce: Dans Scratch, quel type de bloc est « quand la touche espace est pressée » ?
  reponse:
    options:
    - id: o1
      texte: Un bloc d'événement qui déclenche l'exécution du script.
    - id: o2
      texte: Un bloc de variable qui stocke une valeur numérique.
    - id: o3
      texte: Une instruction conditionnelle qui teste une égalité.
    - id: o4
      texte: Une boucle de répétition qui exécute plusieurs fois des blocs.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui se passe au tout début du script lorsque l'utilisateur appuie sur une touche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, une variable est un espace mémoire comme 'score', pas un déclencheur d'événement.
  - si:
      contient:
      - o3
    relance: Faux, une condition s'écrit avec un bloc 'si ... alors', pas un bloc d'événement.
  - si:
      contient:
      - o4
    relance: Faux, une boucle répète des instructions, elle ne déclenche pas le début d'un script.
  solution: Un bloc d'événement qui déclenche l'exécution du script. Correct, ce bloc réagit à une action de l'utilisateur
    sur le clavier pour démarrer le script.
- id: nblm-si-la-variable-x-vaut-5-quelle-sera-la-n-2
  type: choix
  difficulte: 2
  enonce: Si la variable x vaut 5, quelle sera la nouvelle valeur de x après l'exécution du bloc « mettre x à 10 » ?
  reponse:
    options:
    - id: o1
      texte: '10'
    - id: o2
      texte: '15'
    - id: o3
      texte: '5'
    - id: o4
      texte: '50'
    bonnes:
    - o1
  indices:
    relance: Attention à la différence entre remplacer une valeur et lui ajouter un nombre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Faux, 5 est l'ancienne valeur qui est écrasée lors de l'affectation.
  - si:
      contient:
      - o4
    relance: Faux, il n'y a pas de multiplication effectuée par ce bloc.
  solution: 10. Correct, le bloc « mettre ... à » remplace l'ancienne valeur par la nouvelle valeur 10.
- id: nblm-la-variable-compteur-vaut-3-on-execute-l-3
  type: choix
  difficulte: 2
  enonce: La variable compteur vaut 3. On exécute le bloc « ajouter 1 à compteur » puis encore une fois « ajouter 1 à compteur
    ». Que vaut la variable à la fin ?
  reponse:
    options:
    - id: o1
      texte: '5'
    - id: o2
      texte: '1'
    - id: o3
      texte: '3'
    - id: o4
      texte: '4'
    bonnes:
    - o1
  indices:
    relance: Suis l'évolution de la variable étape par étape dans un tableau de suivi.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, 1 est la valeur ajoutée à chaque étape, pas le total contenu dans la variable.
  - si:
      contient:
      - o3
    relance: Faux, 3 est la valeur de départ avant d'exécuter les deux ajouts.
  - si:
      contient:
      - o4
    relance: Faux, 4 est la valeur de la variable après le premier ajout seulement.
  solution: 5. Correct, le compteur augmente de 1 (3 + 1 = 4), puis à nouveau de 1 (4 + 1 = 5).
- id: nblm-on-considere-la-structure-si-n-5-alors-m-4
  type: choix
  difficulte: 2
  enonce: On considère la structure « si n > 5 alors mettre resultat à 20 sinon mettre resultat à 10 ». Si n vaut 4, quelle
    est l'instruction exécutée et que vaut la variable à la fin ?
  reponse:
    options:
    - id: o1
      texte: La branche « sinon » est exécutée et resultat vaut 10.
    - id: o2
      texte: La branche « alors » est exécutée et resultat vaut 20.
    - id: o3
      texte: Les deux branches sont exécutées et resultat vaut 10.
    - id: o4
      texte: Aucune branche n'est exécutée et resultat vaut 0.
    bonnes:
    - o1
  indices:
    relance: Évalue d'abord si la condition 4 > 5 est vraie ou fausse.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, 4 n'est pas strictly supérieur à 5, la condition 'alors' n'est pas vérifiée.
  - si:
      contient:
      - o3
    relance: Faux, une structure conditionnelle n'exécute jamais les deux branches à la fois.
  - si:
      contient:
      - o4
    relance: Faux, la branche 'sinon' s'exécute obligatoirement lorsque la condition est fausse.
  solution: La branche « sinon » est exécutée et resultat vaut 10. Correct, la condition 4 > 5 est fausse, donc le programme
    exécute uniquement le bloc situé après 'sinon'.
- id: nblm-au-debut-du-script-on-execute-mettre-a-a-5
  type: choix
  difficulte: 2
  enonce: 'Au début du script, on exécute « mettre a à 2 ». Puis on exécute la boucle « répéter 3 fois : ajouter 2 à a ».
    Que vaut la variable à la fin ?'
  reponse:
    options:
    - id: o1
      texte: '8'
    - id: o2
      texte: '6'
    - id: o3
      texte: '16'
    - id: o4
      texte: '2'
    bonnes:
    - o1
  indices:
    relance: Dresse un tableau de suivi avec une ligne par passage dans la boucle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, 6 correspond à la valeur de a après seulement 2 passages dans la boucle.
  - si:
      contient:
      - o3
    relance: Faux, 16 s'obtiendrait en multipliant a par 2 à chaque tour au lieu de lui ajouter 2.
  - si:
      contient:
      - o4
    relance: Faux, 2 est la valeur initiale avant d'effectuer les passages dans la boucle.
  solution: '8. Correct, départ a = 2 ; passage 1 : a = 4 ; passage 2 : a = 6 ; passage 3 : a = 8.'
- id: nblm-quelles-affirmations-sont-vraies-concern-6
  type: choix
  difficulte: 3
  enonce: Quelles affirmations sont vraies concernant le bloc « demander [Quel est ton âge ?] et attendre » dans Scratch ?
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La valeur saisie par l'utilisateur est automatiquement enregistrée dans la variable « réponse ».
    - id: o2
      texte: Le script marque une pause jusqu'à ce que l'utilisateur valide sa réponse.
    - id: o3
      texte: Ce bloc remet automatiquement toutes les autres variables du projet à zéro.
    - id: o4
      texte: Ce bloc ne peut être exécuté que si la touche espace est pressée.
    bonnes:
    - o1
    - o2
  indices:
    relance: Réfléchis au rôle de la variable prédéfinie associée à ce bloc d'interaction.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Faux, poser une question à l'utilisateur ne réinitialise pas les variables existantes.
  - si:
      contient:
      - o4
    relance: Faux, il s'exécute dès qu'il est atteint dans le déroulement du script.
  solution: La valeur saisie par l'utilisateur est automatiquement enregistrée dans la variable « réponse » ; Le script marque
    une pause jusqu'à ce que l'utilisateur valide sa réponse. Correct, Scratch stocke toujours le texte ou le nombre tapé
    dans la variable système 'réponse'.
- id: nblm-dans-scratch-lorsqu-on-utilise-le-bloc-d-7
  type: texte_court
  difficulte: 1
  enonce: Dans Scratch, lorsqu'on utilise le bloc « demander ... et attendre », dans quelle variable prédéfinie la saisie
    de l'utilisateur est-elle stockée ?
  reponse:
    acceptees:
    - réponse
    fautes_tolerees: 1
  indices:
    relance: C'est le nom de la variable système créée par Scratch pour conserver la saisie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: réponse. Correct, la valeur saisie par l'utilisateur va directement dans la variable prédéfinie « réponse ».
- id: nblm-comment-appelle-t-on-l-action-de-donner-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'action de donner une valeur de départ à une variable (par exemple « mettre score à 0 » au
    début d'un script) ?
  reponse:
    acceptees:
    - initialiser
    fautes_tolerees: 1
  indices:
    relance: Pense au verbe qui signifie attribuer une valeur initiale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: initialiser. Correct, donner une valeur de départ à une variable s'appelle l'initialiser.
- id: carre-variable-cote
  type: nombre
  difficulte: 2
  enonce: 'Le lutin a le stylo posé. Script : « mettre c à 20 ; répéter 2 fois : avancer de c, tourner à droite de 90 degrés,
    ajouter 10 à c ». Quelle est la longueur totale tracée, en pas ?'
  reponse:
    valeur: 50
    forme: libre
  indices:
    relance: De combien de pas le lutin avance-t-il au premier passage ? Et au deuxième ?
    methode: Fais un tableau de suivi de c. Le bloc « avancer de c » utilise la valeur de c au moment où il est exécuté. Tourner
      ne trace rien.
    etape: 'Passage 1 : c vaut 20, le lutin avance de 20, puis c devient 30. Continue avec le passage 2.'
  pieges:
  - si:
      valeur: 40
    relance: Tu as utilisé 20 aux deux passages. Que fait « ajouter 10 à c » après le premier passage ?
  - si:
      valeur: 70
    relance: Tu as ajouté 10 avant d'avancer. Dans le script, « avancer » vient avant « ajouter 10 à c ».
  - si:
      valeur: 180
    relance: 'Tu as ajouté les angles de rotation. Mais tourner ne trace rien : seuls les blocs « avancer » comptent.'
  solution: 'Passage 1 : le lutin avance de 20, puis c = 30. Passage 2 : il avance de 30, puis c = 40. Longueur tracée : 20
    + 30 = 50 pas.'
- id: variable-echange
  type: nombre
  difficulte: 3
  enonce: 'Script : « mettre a à 5 ; mettre b à 2 ; mettre a à a + b ; mettre b à a − b ; mettre a à a − b ». Que vaut la
    variable a à la fin ?'
  reponse:
    valeur: 2
    forme: libre
  indices:
    relance: Que valent a et b après chaque bloc ? Une seule variable change à la fois.
    methode: Fais un tableau de suivi avec deux colonnes, a et b. Pour chaque bloc, utilise les valeurs du moment, pas celles
      du départ.
    etape: 'Commence par le troisième bloc : calcule a + b avec les valeurs de départ, et note la nouvelle valeur de a. Continue
      bloc par bloc.'
  pieges:
  - si:
      valeur: 5
    relance: '5 est la valeur de départ de a. Les blocs suivants la modifient : refais le tableau de suivi.'
  - si:
      valeur: 7
    relance: 7 est la valeur de a après le premier calcul, mais deux autres blocs modifient encore les variables.
  - si:
      valeur: 3
    relance: 'Vérifie le troisième calcul : b a changé au bloc précédent, utilise sa nouvelle valeur.'
  solution: 'Départ : a = 5, b = 2. Bloc 3 : a = 5 + 2 = 7. Bloc 4 : b = 7 − 2 = 5. Bloc 5 : a = 7 − 5 = 2. À la fin, a vaut
    2 (et b vaut 5 : les valeurs de départ ont été échangées).'
