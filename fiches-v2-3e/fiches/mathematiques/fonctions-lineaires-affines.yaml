- id: point-sur-la-droite
  type: choix
  difficulte: 2
  enonce: La droite (d) représente la fonction f(x) = −2x + 3. Quels points sont sur cette droite ?
  reponse:
    options:
    - id: a
      texte: A(1 ; 1)
    - id: b
      texte: B(2 ; −1)
    - id: c
      texte: C(0 ; −3)
    - id: d
      texte: D(−1 ; 1)
    bonnes:
    - a
    - b
  indices:
    relance: Un point est sur la droite si son ordonnée est l'image de son abscisse. Que faut-il calculer ?
    methode: Pour chaque point, calcule f de son abscisse et compare avec son ordonnée.
    etape: Pour A, calcule f(1) = −2 × 1 + 3 et compare avec 1. Fais de même pour les autres points.
  pieges:
  - si:
      contient:
      - c
    relance: L'ordonnée à l'origine est 3, et non −3. Calcule f(0) pour vérifier.
  - si:
      contient:
      - d
    relance: 'Calcule f(−1) : −2 × (−1) est-il négatif ou positif ?'
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé un point, mais il y en a un autre. Teste chaque point que tu n'as pas choisi.
  solution: 'f(1) = −2 + 3 = 1 : A est sur la droite. f(2) = −4 + 3 = −1 : B aussi. f(0) = 3, pas −3 : C n''y est pas. f(−1)
    = 2 + 3 = 5, pas 1 : D n''y est pas.'
- id: fonction-lineaire-image
  type: nombre
  difficulte: 2
  enonce: Une fonction linéaire f vérifie f(4) = 10. Quelle est l'image de 6 par f ?
  reponse:
    valeur: 15
    forme: libre
  indices:
    relance: Une fonction linéaire s'écrit f(x) = ax. Comment trouver a avec f(4) = 10 ?
    methode: Calcule a = f(4) ÷ 4, puis remplace x par 6 dans f(x) = ax.
    etape: a est le nombre qui, multiplié par 4, donne 10. Calcule-le en divisant, puis multiplie-le par 6.
  pieges:
  - si:
      valeur: 2.5
    relance: C'est le coefficient a de la fonction. On demande l'image de 6.
  - si:
      valeur: 10
    relance: C'est l'image de 4, donnée dans l'énoncé. Il faut trouver celle de 6.
  - si:
      valeur: 12
    relance: Tu as ajouté 2 à 10 comme si la fonction ajoutait toujours le même nombre. Une fonction linéaire multiplie.
  solution: a = 10 ÷ 4 = 2,5, donc f(x) = 2,5x. f(6) = 2,5 × 6 = 15.
