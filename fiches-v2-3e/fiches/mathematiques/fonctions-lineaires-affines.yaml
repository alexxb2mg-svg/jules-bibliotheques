# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: fonctions-lineaires-affines
version: 1
etat: verifiee
declencheurs:
- droite passant par l'origine
- pente de la droite
- droite coupe l'axe des ordonnées
- droite qui monte ou qui descend
- tracer une droite avec deux points
- nombre devant le x
prerequis:
- 4e-notion-fonction
- 4e-proportionnalite-4e
essentiel: 'Une fonction affine s''écrit f(x) = ax + b, où a et b sont deux nombres fixés.


  Si b = 0, f(x) = ax : la fonction est linéaire. Elle traduit une situation de proportionnalité.


  La représentation graphique d''une fonction affine est une droite. Celle d''une fonction linéaire est une droite qui passe
  par l''origine du repère.


  b est l''ordonnée à l''origine : la droite coupe l''axe des ordonnées au point (0 ; b), car f(0) = b.


  a est le coefficient directeur : quand x augmente de 1, f(x) augmente de a. Si a est positif, la droite monte (la fonction
  est croissante) ; si a est négatif, elle descend (décroissante) ; si a = 0, elle est horizontale (constante).


  Pour trouver a à partir de deux points : a = (différence des images) ÷ (différence des nombres de départ).

  '
methode:
- 'Pour tracer une droite : calculer les images de deux nombres bien choisis (0 est souvent pratique), placer les deux points,
  tracer la droite à la règle.'
- Vérifier avec un troisième point, qui doit être aligné avec les deux autres.
- 'Lire b : ordonnée du point où la droite coupe l''axe des ordonnées.'
- 'Lire a : de combien la droite monte (ou descend) quand on avance de 1 vers la droite.'
- 'Pour retrouver f(x) avec deux points : calculer a, puis trouver b en remplaçant x et f(x) par les coordonnées d''un point.'
vocabulaire:
- terme: fonction affine
  definition: Fonction de la forme x ↦ ax + b ; sa représentation est une droite.
- terme: fonction linéaire
  definition: Fonction de la forme x ↦ ax ; sa représentation est une droite qui passe par l'origine.
- terme: coefficient directeur
  definition: 'Le nombre a : il donne l''inclinaison de la droite.'
- terme: ordonnée à l'origine
  definition: 'Le nombre b : l''ordonnée du point de la droite situé sur l''axe des ordonnées.'
erreurs_frequentes:
- Confondre le coefficient directeur a et l'ordonnée à l'origine b.
- Croire qu'une fonction affine avec b différent de 0 est linéaire.
- Se tromper de sens dans le calcul de a (diviser la différence des x par la différence des images).
- Penser qu'une droite qui descend a un coefficient positif.
- Placer le point (0 ; b) sur l'axe des abscisses.
exemple:
  enonce: Tracer la représentation graphique de f(x) = 2x − 1 et interpréter a et b.
  solution: 'f(0) = −1 et f(2) = 2 × 2 − 1 = 3. On place (0 ; −1) et (2 ; 3), puis on trace la droite. b = −1 : la droite
    coupe l''axe des ordonnées en −1. a = 2 : quand x augmente de 1, f(x) augmente de 2, la droite monte.'
exercices:
- id: reconnaitre-lineaires
  type: choix
  difficulte: 1
  enonce: Parmi ces fonctions, lesquelles sont linéaires ?
  reponse:
    options:
    - id: a
      texte: f(x) = −4x
    - id: b
      texte: g(x) = 2x + 1
    - id: c
      texte: h(x) = x/3
    - id: d
      texte: k(x) = x²
    - id: e
      texte: m(x) = 5
    bonnes:
    - a
    - c
  indices:
    relance: Quelle forme doit avoir l'expression d'une fonction linéaire ?
    methode: 'Une fonction linéaire s''écrit ax : un nombre fixé multiplié par x, sans rien ajouter, sans carré.'
    etape: 'Diviser par 3, c''est multiplier par un tiers. Regarde chaque expression : peut-on l''écrire « un nombre × x »
      ?'
  pieges:
  - si:
      contient:
      - b
    relance: Dans g(x), on ajoute 1 après avoir multiplié. Une fonction linéaire a-t-elle un nombre ajouté ?
  - si:
      contient:
      - d
    relance: 'x² veut dire x × x : est-ce un nombre fixé multiplié par x ?'
  - si:
      contient:
      - e
    relance: 'm donne 5 pour tout x : sa droite passe-t-elle par l''origine du repère ?'
  - si:
      diagnostic: incomplet
    relance: Il y en a une autre. Pense qu'une division par un nombre est aussi une multiplication.
  solution: 'f(x) = −4x est linéaire (a = −4). h(x) = x/3 aussi, car x/3 = (1/3) × x. g est affine mais pas linéaire (on ajoute
    1), k n''est pas affine (carré), et m est constante : sa droite ne passe pas par l''origine.'
- id: ordonnee-a-l-origine
  type: nombre
  difficulte: 1
  enonce: La droite qui représente la fonction f(x) = −3x + 2 coupe l'axe des ordonnées en un point. Quelle est l'ordonnée
    de ce point ?
  reponse:
    valeur: 2
    forme: libre
  indices:
    relance: Sur l'axe des ordonnées, quelle est l'abscisse de tous les points ?
    methode: 'Un point de l''axe des ordonnées a pour abscisse 0 : calcule donc f(0).'
    etape: 'Remplace x par 0 : le terme −3x devient nul. Que reste-t-il ?'
  pieges:
  - si:
      valeur: -3
    relance: '−3 est le coefficient directeur : il dit si la droite monte ou descend. Où la droite coupe-t-elle l''axe vertical
      ? Calcule f(0).'
  - si:
      valeur: 2/3
    relance: Tu as trouvé où la droite coupe l'axe des abscisses (l'axe horizontal). On demande l'axe des ordonnées, l'axe
      vertical.
  solution: 'Sur l''axe des ordonnées, x = 0. f(0) = −3 × 0 + 2 = 2. La droite coupe l''axe des ordonnées au point (0 ; 2)
    : l''ordonnée à l''origine est 2.'
- id: fonctions-et-droites
  type: association
  difficulte: 2
  enonce: Associe chaque fonction (a, b, c, d) à la description de sa droite (x, y, z, w ou v). Une description ne sert pas.
  reponse:
    gauche:
    - id: a
      texte: f(x) = 2x + 3
    - id: b
      texte: g(x) = −x + 3
    - id: c
      texte: h(x) = 2x
    - id: d
      texte: k(x) = 3
    droite:
    - id: x
      texte: Droite qui monte et coupe l'axe des ordonnées au point (0 ; 3).
    - id: y
      texte: Droite qui descend et coupe l'axe des ordonnées au point (0 ; 3).
    - id: z
      texte: Droite qui monte et passe par l'origine du repère.
    - id: w
      texte: Droite parallèle à l'axe des abscisses.
    - id: v
      texte: Droite qui descend et passe par l'origine du repère.
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Pour chaque fonction, quel est le nombre a devant x, et quel est le nombre b ajouté ?
    methode: Le signe de a dit si la droite monte (a positif), descend (a négatif) ou reste horizontale (a = 0). Le nombre
      b donne le point (0 ; b).
    etape: 'Pour g(x) = −x + 3, le coefficient est −1 : il est négatif. Que fait alors la droite ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie pour chaque fonction le signe du coefficient et la valeur de f(0).
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Pour chaque fonction, écris a et b, puis relis les descriptions.
  solution: 'a-x : a = 2 positif, b = 3. b-y : a = −1 négatif, b = 3. c-z : fonction linéaire, a = 2 positif, la droite passe
    par l''origine. d-w : a = 0, la fonction est constante, la droite est horizontale.'
- id: coefficient-deux-images
  type: nombre
  difficulte: 2
  enonce: Une fonction affine f vérifie f(0) = 4 et f(2) = 10. Quel est son coefficient directeur a ?
  reponse:
    valeur: 3
    forme: libre
  indices:
    relance: Quand x passe de 0 à 2, de combien augmente f(x) ?
    methode: a = (différence des images) ÷ (différence des nombres de départ).
    etape: Les images passent de 4 à 10 quand x passe de 0 à 2. Calcule l'augmentation des images, puis divise-la par l'augmentation
      de x.
  pieges:
  - si:
      valeur: 6
    relance: 'Tu as trouvé l''augmentation des images. Mais x n''a pas augmenté de 1 : par quoi faut-il encore diviser ?'
  - si:
      valeur: 4
    relance: 4 est l'image de 0, c'est l'ordonnée à l'origine b. On demande le coefficient a, l'inclinaison de la droite.
  - si:
      valeur: 5
    relance: 'Tu as divisé 10 par 2, comme si la droite passait par l''origine. Or f(0) n''est pas nul : pars de la différence
      des images.'
  solution: 'a = (10 − 4) ÷ (2 − 0) = 6 ÷ 2 = 3. (Et b = f(0) = 4, donc f(x) = 3x + 4 ; vérification : 3 × 2 + 4 = 10.)'
- id: expression-deux-points
  type: expression
  difficulte: 3
  enonce: La droite qui représente une fonction affine g passe par les points A(1 ; 5) et B(3 ; 1). Donne l'expression de
    g(x).
  reponse:
    valeur: -2x + 7
    variables:
    - x
    forme: libre
  indices:
    relance: Quand on va de A à B, la droite monte-t-elle ou descend-elle ? Que peux-tu en déduire sur le signe de a ?
    methode: Calcule a = (différence des images) ÷ (différence des x), puis trouve b en utilisant g(1) = 5.
    etape: Le coefficient vaut (1 − 5) ÷ (3 − 1). Ensuite, écris a × 1 + b = 5 et trouve b.
  pieges:
  - si:
      valeur: 2x + 3
    relance: 'Vérifie le signe de a : quand x augmente de 1 à 3, g(x) passe de 5 à 1. La droite monte-t-elle ?'
  - si:
      valeur: -2x + 5
    relance: '5 est l''image de 1, pas celle de 0. Vérifie ton expression avec le point A : trouves-tu bien 5 ?'
  solution: 'a = (1 − 5) ÷ (3 − 1) = −4 ÷ 2 = −2. Avec A : −2 × 1 + b = 5, donc b = 7. Ainsi g(x) = −2x + 7. Vérification
    avec B : −2 × 3 + 7 = 1.'
- id: tracer-droite-expliquer
  type: ouverte
  difficulte: 3
  enonce: On donne f(x) = 0,5x − 1. Explique comment tracer sa représentation graphique, puis dis ce que les nombres 0,5 et
    −1 permettent de lire sur la droite.
  criteres:
  - L'élève calcule correctement deux points de la droite, par exemple (0 ; −1) et (4 ; 1), les place et trace la droite qui
    passe par eux.
  - L'élève interprète −1 comme l'ordonnée du point où la droite coupe l'axe des ordonnées, et 0,5 comme la hausse de f(x)
    quand x augmente de 1 (la droite monte).
  indices:
    relance: Combien de points suffit-il de connaître pour tracer une droite ?
    methode: Choisis deux valeurs de x qui donnent des calculs simples (0 et un nombre pair), calcule leurs images, puis place
      les points.
    etape: 'Commence par x = 0 : que vaut f(0) ? Puis essaie x = 4.'
  solution: 'f(0) = −1 et f(4) = 0,5 × 4 − 1 = 1. On place (0 ; −1) et (4 ; 1) et on trace la droite. −1 est l''ordonnée à
    l''origine : la droite coupe l''axe des ordonnées en −1. 0,5 est le coefficient directeur : quand x augmente de 1, f(x)
    augmente de 0,5, la droite monte.'
