# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: fonctions-lineaires-affines
version: 3
etat: verifiee
declencheurs:
- droite passant par l'origine
- pente de la droite
- droite coupe l'axe des ordonnées
- droite qui monte ou qui descend
- tracer une droite avec deux points
- nombre devant le x
- fonction dont la courbe est une droite
- coefficient directeur
- tracer f(x) égal
prerequis:
- 4e-notion-fonction
- 4e-proportionnalite-4e
essentiel: 'Une fonction affine s''écrit f(x) = ax + b, où a et b sont deux nombres fixés.


  Si b = 0, alors f(x) = ax : la fonction est linéaire. Elle traduit une situation de proportionnalité, et a est le coefficient
  de proportionnalité.

  Si a = 0, alors f(x) = b : la fonction est constante.


  La représentation graphique d''une fonction affine est une droite. Celle d''une fonction linéaire est une droite qui passe
  par l''origine du repère.

  Une constante est représentée par une droite parallèle à l''axe des abscisses.


  b est l''ordonnée à l''origine : la droite coupe l''axe des ordonnées au point (0 ; b), car f(0) = b.


  a est le coefficient directeur : quand x augmente de 1, f(x) augmente de a.

  - Si a > 0, la droite monte (la fonction est croissante).

  - Si a < 0, la droite descend (la fonction est décroissante).

  - Si a = 0, la droite est horizontale.


  Pour trouver a avec deux points : a = (différence des images) ÷ (différence des nombres de départ). Pour trouver b, on remplace
  x et f(x) par les coordonnées d''un point.


  Un point A(x ; y) est sur la droite si f(x) = y.


  Exemple : f(x) = 2x − 1. On calcule f(0) = −1 et f(2) = 3. On place (0 ; −1) et (2 ; 3), on trace la droite. Ici a = 2 (elle
  monte de 2 quand x augmente de 1) et b = −1.


  Exemple avec deux points : la droite passe par A(1 ; 5) et B(3 ; 1). Alors a = (1 − 5) ÷ (3 − 1) = −2. Comme 5 = −2 × 1
  + b, on trouve b = 7 : f(x) = −2x + 7.

  Une situation de proportionnalité (prix selon la quantité) se modélise par une fonction linéaire. Un tarif avec abonnement
  fixe se modélise par une fonction affine.


  Au brevet : on reconnaît une fonction linéaire ou affine, on trace la droite avec deux points, on lit a et b sur le graphique
  et on donne l''expression de f(x).

  '
methode:
- 'Pour tracer une droite : calculer les images de deux nombres bien choisis (0 est souvent pratique), placer les deux points,
  tracer la droite à la règle.'
- Vérifier avec un troisième point, qui doit être aligné avec les deux autres.
- 'Lire b : ordonnée du point où la droite coupe l''axe des ordonnées.'
- 'Lire a : de combien la droite monte (ou descend) quand on avance de 1 vers la droite.'
- 'Pour retrouver f(x) avec deux points : calculer a, puis trouver b en remplaçant x et f(x) par les coordonnées d''un point.'
- 'Pour savoir si un point est sur la droite : calculer f de son abscisse et comparer avec son ordonnée.'
vocabulaire:
- terme: fonction affine
  definition: Fonction de la forme x ↦ ax + b ; sa représentation est une droite.
- terme: fonction linéaire
  definition: Fonction de la forme x ↦ ax ; sa représentation est une droite qui passe par l'origine.
- terme: fonction constante
  definition: Fonction de la forme x ↦ b ; sa représentation est une droite horizontale.
- terme: coefficient directeur
  definition: 'Le nombre a : il donne l''inclinaison de la droite.'
- terme: ordonnée à l'origine
  definition: 'Le nombre b : l''ordonnée du point de la droite situé sur l''axe des ordonnées.'
- terme: croissante
  definition: Se dit d'une fonction dont les images augmentent quand x augmente.
- terme: décroissante
  definition: Se dit d'une fonction dont les images diminuent quand x augmente.
erreurs_frequentes:
- Confondre le coefficient directeur a et l'ordonnée à l'origine b.
- Croire qu'une fonction affine avec b différent de 0 est linéaire.
- Se tromper de sens dans le calcul de a (diviser la différence des x par la différence des images).
- Penser qu'une droite qui descend a un coefficient positif.
- Placer le point (0 ; b) sur l'axe des abscisses.
exemple:
  enonce: Tracer la représentation graphique de f(x) = 2x − 1 et interpréter a et b.
  solution: 'f(0) = −1 et f(2) = 2 × 2 − 1 = 3. On place (0 ; −1) et (2 ; 3), puis on trace la droite. b = −1 : la droite
    coupe l''axe des ordonnées en −1. a = 2 : quand x augmente de 1, f(x) augmente de 2, la droite monte.'
exercices:
- id: reconnaitre-lineaires
  type: choix
  difficulte: 1
  enonce: Parmi ces fonctions, lesquelles sont linéaires ?
  reponse:
    options:
    - id: a
      texte: f(x) = −4x
    - id: b
      texte: g(x) = 2x + 1
    - id: c
      texte: h(x) = x/3
    - id: d
      texte: k(x) = x²
    - id: e
      texte: m(x) = 5
    bonnes:
    - a
    - c
  indices:
    relance: Quelle forme doit avoir l'expression d'une fonction linéaire ?
    methode: 'Une fonction linéaire s''écrit ax : un nombre fixé multiplié par x, sans rien ajouter, sans carré.'
    etape: 'Diviser par 3, c''est multiplier par un tiers. Regarde chaque expression : peut-on l''écrire « un nombre × x »
      ?'
  pieges:
  - si:
      contient:
      - b
    relance: Dans g(x), on ajoute 1 après avoir multiplié. Une fonction linéaire a-t-elle un nombre ajouté ?
  - si:
      contient:
      - d
    relance: 'x² veut dire x × x : est-ce un nombre fixé multiplié par x ?'
  - si:
      contient:
      - e
    relance: 'm donne 5 pour tout x : sa droite passe-t-elle par l''origine du repère ?'
  - si:
      diagnostic: incomplet
    relance: Il y en a une autre. Pense qu'une division par un nombre est aussi une multiplication.
  solution: 'f(x) = −4x est linéaire (a = −4). h(x) = x/3 aussi, car x/3 = (1/3) × x. g est affine mais pas linéaire (on ajoute
    1), k n''est pas affine (carré), et m est constante : sa droite ne passe pas par l''origine.'
- id: ordonnee-a-l-origine
  type: nombre
  difficulte: 1
  enonce: La droite qui représente la fonction f(x) = −3x + 2 coupe l'axe des ordonnées en un point. Quelle est l'ordonnée
    de ce point ?
  reponse:
    valeur: 2
    forme: libre
  indices:
    relance: Sur l'axe des ordonnées, quelle est l'abscisse de tous les points ?
    methode: 'Un point de l''axe des ordonnées a pour abscisse 0 : calcule donc f(0).'
    etape: 'Remplace x par 0 : le terme −3x devient nul. Que reste-t-il ?'
  pieges:
  - si:
      valeur: -3
    relance: '−3 est le coefficient directeur : il dit si la droite monte ou descend. Où la droite coupe-t-elle l''axe vertical
      ? Calcule f(0).'
  - si:
      valeur: 2/3
    relance: Tu as trouvé où la droite coupe l'axe des abscisses (l'axe horizontal). On demande l'axe des ordonnées, l'axe
      vertical.
  solution: 'Sur l''axe des ordonnées, x = 0. f(0) = −3 × 0 + 2 = 2. La droite coupe l''axe des ordonnées au point (0 ; 2)
    : l''ordonnée à l''origine est 2.'
- id: fonctions-et-droites
  type: association
  difficulte: 2
  enonce: Associe chaque fonction (a, b, c, d) à la description de sa droite (x, y, z, w ou v). Une description ne sert pas.
  reponse:
    gauche:
    - id: a
      texte: f(x) = 2x + 3
    - id: b
      texte: g(x) = −x + 3
    - id: c
      texte: h(x) = 2x
    - id: d
      texte: k(x) = 3
    droite:
    - id: x
      texte: Droite qui monte et coupe l'axe des ordonnées au point (0 ; 3).
    - id: y
      texte: Droite qui descend et coupe l'axe des ordonnées au point (0 ; 3).
    - id: z
      texte: Droite qui monte et passe par l'origine du repère.
    - id: w
      texte: Droite parallèle à l'axe des abscisses.
    - id: v
      texte: Droite qui descend et passe par l'origine du repère.
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Pour chaque fonction, quel est le nombre a devant x, et quel est le nombre b ajouté ?
    methode: Le signe de a dit si la droite monte (a positif), descend (a négatif) ou reste horizontale (a = 0). Le nombre
      b donne le point (0 ; b).
    etape: 'Pour g(x) = −x + 3, le coefficient est −1 : il est négatif. Que fait alors la droite ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie pour chaque fonction le signe du coefficient et la valeur de f(0).
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Pour chaque fonction, écris a et b, puis relis les descriptions.
  solution: 'a-x : a = 2 positif, b = 3. b-y : a = −1 négatif, b = 3. c-z : fonction linéaire, a = 2 positif, la droite passe
    par l''origine. d-w : a = 0, la fonction est constante, la droite est horizontale.'
- id: coefficient-deux-images
  type: nombre
  difficulte: 2
  enonce: Une fonction affine f vérifie f(0) = 4 et f(2) = 10. Quel est son coefficient directeur a ?
  reponse:
    valeur: 3
    forme: libre
  indices:
    relance: Quand x passe de 0 à 2, de combien augmente f(x) ?
    methode: a = (différence des images) ÷ (différence des nombres de départ).
    etape: Les images passent de 4 à 10 quand x passe de 0 à 2. Calcule l'augmentation des images, puis divise-la par l'augmentation
      de x.
  pieges:
  - si:
      valeur: 6
    relance: 'Tu as trouvé l''augmentation des images. Mais x n''a pas augmenté de 1 : par quoi faut-il encore diviser ?'
  - si:
      valeur: 4
    relance: 4 est l'image de 0, c'est l'ordonnée à l'origine b. On demande le coefficient a, l'inclinaison de la droite.
  - si:
      valeur: 5
    relance: 'Tu as divisé 10 par 2, comme si la droite passait par l''origine. Or f(0) n''est pas nul : pars de la différence
      des images.'
  solution: 'a = (10 − 4) ÷ (2 − 0) = 6 ÷ 2 = 3. (Et b = f(0) = 4, donc f(x) = 3x + 4 ; vérification : 3 × 2 + 4 = 10.)'
- id: expression-deux-points
  type: expression
  difficulte: 3
  enonce: La droite qui représente une fonction affine g passe par les points A(1 ; 5) et B(3 ; 1). Donne l'expression de
    g(x).
  reponse:
    valeur: -2x + 7
    variables:
    - x
    forme: libre
  indices:
    relance: Quand on va de A à B, la droite monte-t-elle ou descend-elle ? Que peux-tu en déduire sur le signe de a ?
    methode: Calcule a = (différence des images) ÷ (différence des x), puis trouve b en utilisant g(1) = 5.
    etape: Le coefficient vaut (1 − 5) ÷ (3 − 1). Ensuite, écris a × 1 + b = 5 et trouve b.
  pieges:
  - si:
      valeur: 2x + 3
    relance: 'Vérifie le signe de a : quand x augmente de 1 à 3, g(x) passe de 5 à 1. La droite monte-t-elle ?'
  - si:
      valeur: -2x + 5
    relance: '5 est l''image de 1, pas celle de 0. Vérifie ton expression avec le point A : trouves-tu bien 5 ?'
  solution: 'a = (1 − 5) ÷ (3 − 1) = −4 ÷ 2 = −2. Avec A : −2 × 1 + b = 5, donc b = 7. Ainsi g(x) = −2x + 7. Vérification
    avec B : −2 × 3 + 7 = 1.'
- id: tracer-droite-expliquer
  type: ouverte
  difficulte: 3
  enonce: On donne f(x) = 0,5x − 1. Explique comment tracer sa représentation graphique, puis dis ce que les nombres 0,5 et
    −1 permettent de lire sur la droite.
  criteres:
  - L'élève calcule correctement deux points de la droite, par exemple (0 ; −1) et (4 ; 1), les place et trace la droite qui
    passe par eux.
  - L'élève interprète −1 comme l'ordonnée du point où la droite coupe l'axe des ordonnées, et 0,5 comme la hausse de f(x)
    quand x augmente de 1 (la droite monte).
  indices:
    relance: Combien de points suffit-il de connaître pour tracer une droite ?
    methode: Choisis deux valeurs de x qui donnent des calculs simples (0 et un nombre pair), calcule leurs images, puis place
      les points.
    etape: 'Commence par x = 0 : que vaut f(0) ? Puis essaie x = 4.'
  solution: 'f(0) = −1 et f(4) = 0,5 × 4 − 1 = 1. On place (0 ; −1) et (4 ; 1) et on trace la droite. −1 est l''ordonnée à
    l''origine : la droite coupe l''axe des ordonnées en −1. 0,5 est le coefficient directeur : quand x augmente de 1, f(x)
    augmente de 0,5, la droite monte.'
- id: nblm-dans-l-expression-d-une-fonction-affine-1
  type: choix
  difficulte: 2
  enonce: Dans l'expression d'une fonction affine f(x) = ax + b, que représente le nombre devant le x (le nombre a) ?
  reponse:
    options:
    - id: o1
      texte: Le coefficient directeur (ou pente de la droite).
    - id: o2
      texte: L'ordonnée à l'origine où la droite coupe l'axe des ordonnées.
    - id: o3
      texte: L'antécédent de zéro par la fonction.
    - id: o4
      texte: Le nombre de points nécessaires pour tracer la droite.
    bonnes:
    - o1
  indices:
    relance: Pense au terme qui indique l'inclinaison de la droite lorsque x augmente de 1.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''ordonnée à l''origine est le nombre b (le terme constant), pas le coefficient a placé
      devant le x.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''image de 0 est b et l''antécédent de 0 s''obtient en résolvant ax + b = 0, ce n''est pas
      directement la valeur de a.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : a est un coefficient numérique d''inclinaison, pas le nombre de points géométriques à placer.'
  solution: 'Le coefficient directeur (ou pente de la droite). C''est exact : le nombre a placé devant le x est le coefficient
    directeur, qui indique l''inclinaison ou la pente de la droite.'
- id: nblm-quelle-est-la-particularite-de-la-repres-2
  type: choix
  difficulte: 2
  enonce: Quelle est la particularité de la représentation graphique d'une fonction linéaire f(x) = ax par rapport à une fonction
    affine générale ?
  reponse:
    options:
    - id: o1
      texte: Sa représentation graphique est une droite passant par l'origine du repère.
    - id: o2
      texte: Sa représentation graphique est une courbe qui ne passe jamais par l'origine.
    - id: o3
      texte: Elle coupe l'axe des ordonnées au point d'ordonnée 1.
    - id: o4
      texte: Elle ne peut jamais être représentée par une droite.
    bonnes:
    - o1
  indices:
    relance: Calcule l'image de 0 par la fonction f(x) = ax pour trouver par quel point remarquable passe la droite.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la représentation d''une fonction linéaire est une droite (et non une courbe quelconque) et
      elle passe toujours par l''origine.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : pour une fonction linéaire f(0) = 0, elle coupe donc l''axe des ordonnées au point (0 ; 0)
      et non en 1.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : une fonction linéaire est un cas particulier de fonction affine, sa représentation graphique
      est bien une droite.'
  solution: 'Sa représentation graphique est une droite passant par l''origine du repère. C''est exact : pour une fonction
    linéaire, b = 0 donc f(0) = 0, ce qui signifie que la droite passe par le point (0 ; 0), l''origine.'
- id: nblm-pour-la-fonction-affine-f-x-2x-3-en-quel-3
  type: choix
  difficulte: 2
  enonce: Pour la fonction affine f(x) = 2x - 3, en quel point la droite coupe l'axe des ordonnées ?
  reponse:
    options:
    - id: o1
      texte: Au point de coordonnées (0 ; -3).
    - id: o2
      texte: Au point de coordonnées (-3 ; 0) sur l'axe des abscisses.
    - id: o3
      texte: Au point de coordonnées (0 ; 2).
    - id: o4
      texte: Au point de coordonnées (2 ; -3).
    bonnes:
    - o1
  indices:
    relance: L'axe des ordonnées correspond à une valeur de x égale à 0. Calcule f(0).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : confondre l''axe des ordonnées et l''axe des abscisses en plaçant le point (0 ; b) sur l''axe
      horizontal.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre le coefficient directeur a = 2 et l''ordonnée à l''origine b = -3.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : utiliser le coefficient directeur 2 comme abscisse au lieu de prendre x = 0.'
  solution: 'Au point de coordonnées (0 ; -3). C''est exact : l''ordonnée à l''origine b vaut -3, donc f(0) = -3, la droite
    coupe l''axe des ordonnées au point (0 ; -3).'
- id: nblm-comment-varie-la-representation-graphiqu-4
  type: choix
  difficulte: 2
  enonce: Comment varie la représentation graphique d'une fonction affine f(x) = ax + b lorsque le coefficient a est négatif
    (a < 0) ?
  reponse:
    options:
    - id: o1
      texte: C'est une droite qui descend (la fonction est décroissante).
    - id: o2
      texte: C'est une droite qui monte (la fonction est croissante).
    - id: o3
      texte: C'est une droite horizontale.
    - id: o4
      texte: C'est une droite qui passe obligatoirement par l'origine.
    bonnes:
    - o1
  indices:
    relance: Regarde si les valeurs de f(x) augmentent ou diminuent quand x augmente lorsque le nombre devant x est négatif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la droite monte uniquement lorsque le coefficient directeur a est strictement positif.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : une droite est horizontale seulement si a = 0 (fonction constante).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le passage par l''origine dépend de b (il faut b = 0), pas du signe du coefficient a.'
  solution: 'C''est une droite qui descend (la fonction est décroissante). C''est exact : si le coefficient directeur a est
    négatif, les valeurs diminuent quand x augmente, donc la droite descend de gauche à droite.'
- id: nblm-quelle-est-la-methode-correcte-pour-trac-5
  type: choix
  difficulte: 2
  enonce: Quelle est la méthode correcte pour tracer une droite avec deux points représentant la fonction affine f(x) = 3x
    - 1 ?
  reponse:
    options:
    - id: o1
      texte: Calculer les images de deux nombres comme f(0) = -1 et f(2) = 5, placer (0 ; -1) et (2 ; 5), puis les relier
        à la règle.
    - id: o2
      texte: Placer le point (3 ; -1) et tracer une ligne verticale passant par ce point.
    - id: o3
      texte: Tracer une courbe en reliant uniquement des points sur l'axe des abscisses.
    - id: o4
      texte: Placer seulement le point (0 ; 0) car toutes les droites passent par l'origine.
    bonnes:
    - o1
  indices:
    relance: N'oublie pas qu'il faut déterminer les coordonnées de deux points appartenant à la droite en calculant l'image
      de deux valeurs de x.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : combiner les coefficients a = 3 et b = -1 pour former un unique point fictif (3 ; -1).'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : une fonction affine est représentée par une droite continue dans tout le repère.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ici b = -1, la droite ne passe pas par l''origine (0 ; 0).'
  solution: 'Calculer les images de deux nombres comme f(0) = -1 et f(2) = 5, placer (0 ; -1) et (2 ; 5), puis les relier
    à la règle. C''est exact : calculer l''image de deux nombres permet d''obtenir deux points distincts de la droite pour
    la tracer à la règle.'
- id: nblm-parmi-les-affirmations-suivantes-concern-6
  type: choix
  difficulte: 3
  enonce: Parmi les affirmations suivantes concernant la fonction g(x) = -4x + 5, lesquelles sont EXACTES ? (Sélectionne 2
    réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le nombre devant le x est -4, c'est le coefficient directeur (pente de la droite).
    - id: o2
      texte: La droite coupe l'axe des ordonnées au point de coordonnées (0 ; 5).
    - id: o3
      texte: C'est une fonction linéaire dont la droite passe par l'origine.
    - id: o4
      texte: Puisque le coefficient devant x est négatif, la droite monte de gauche à droite.
    bonnes:
    - o1
    - o2
  indices:
    relance: Analyse d'une part le rôle du coefficient -4 (devant x) et d'autre part la valeur du terme constant +5.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la fonction n''est pas linéaire car b = 5 (non nul). Sa droite ne passe pas par l''origine.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : un coefficient directeur négatif (-4) signifie que la droite descend de gauche à droite.'
  solution: 'Le nombre devant le x est -4, c''est le coefficient directeur (pente de la droite) ; La droite coupe l''axe des
    ordonnées au point de coordonnées (0 ; 5). C''est exact : dans g(x) = ax + b, a = -4 est le coefficient directeur qui
    détermine la pente.'
