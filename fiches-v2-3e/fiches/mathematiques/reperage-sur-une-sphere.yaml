format: 2
notion: reperage-sur-une-sphere
version: 2
etat: verifiee
declencheurs:
- coordonnées géographiques
- méridien de Greenwich
- degrés nord
- hémisphère sud
- globe terrestre
- parallèles et méridiens
- situer une ville sur le globe
- degrés est ou ouest
- cercle autour de la Terre
prerequis:
- 4e-reperage-espace
essentiel: 'On modélise la Terre par une sphère. L''axe des pôles passe par le pôle Nord et le pôle Sud, et par le centre
  de la Terre.


  L''équateur est le grand cercle à égale distance des deux pôles : il partage la sphère en hémisphère Nord et hémisphère
  Sud.


  Les parallèles sont les cercles parallèles à l''équateur (l''équateur est le plus grand). Les méridiens sont les demi-cercles
  qui vont d''un pôle à l''autre ; le méridien de référence est celui de Greenwich.


  Un point se repère par deux angles, mesurés en degrés depuis le centre de la Terre :

  - la latitude, de 0° à 90° Nord ou Sud : c''est l''angle entre le plan de l''équateur et la direction du point. Tous les
  points d''un même parallèle ont la même latitude. Le pôle Nord a pour latitude 90° N.

  - la longitude, de 0° à 180° Est ou Ouest : c''est l''angle entre le méridien de Greenwich et le méridien du point. Tous
  les points d''un même méridien ont la même longitude.


  On écrit par exemple M (40° N ; 10° E) : latitude d''abord, longitude ensuite. Sur l''équateur, la latitude vaut 0°. Sur
  le méridien de Greenwich, la longitude vaut 0°.


  Écart entre deux points : pour deux points du même méridien, on soustrait les latitudes si elles sont du même côté de l''équateur,
  on les additionne sinon. C''est pareil pour les longitudes de part et d''autre de Greenwich, mais attention, l''écart ne
  dépasse jamais 180° (on choisit le plus court chemin).


  Lire une carte : sur un globe ou un planisphère, on lit la latitude sur les parallèles et la longitude sur les méridiens.


  Au brevet : lire ou donner les coordonnées d''un point, placer un point de coordonnées données, dire dans quel hémisphère
  il est, et calculer un écart entre deux points sur un même méridien ou un même parallèle.

  '
methode:
- Pour la latitude, repérer le parallèle du point et dire s'il est au nord ou au sud de l'équateur.
- Pour la longitude, repérer le méridien du point et dire s'il est à l'est ou à l'ouest du méridien de Greenwich.
- Écrire les coordonnées dans l'ordre (latitude ; longitude), sans oublier N/S et E/O.
- Pour un déplacement le long d'un parallèle, seule la longitude change ; le long d'un méridien, seule la latitude change.
- 'Pour un écart : additionner si les deux points sont de part et d''autre de l''équateur (ou de Greenwich), soustraire s''ils
  sont du même côté.'
- Faire un schéma de la sphère avec l'équateur et le méridien de Greenwich pour ne pas se tromper de côté.
vocabulaire:
- terme: parallèle
  definition: Cercle de la sphère parallèle à l'équateur ; ses points ont tous la même latitude.
- terme: méridien
  definition: Demi-cercle qui joint les deux pôles ; ses points ont tous la même longitude.
- terme: hémisphère
  definition: 'Moitié de la sphère : hémisphère Nord et hémisphère Sud sont séparés par l''équateur.'
- terme: équateur
  definition: Le grand cercle à égale distance des deux pôles ; sa latitude est 0°.
- terme: méridien de Greenwich
  definition: Le méridien de référence pour la longitude ; sa longitude est 0°.
- terme: latitude
  definition: L'angle, de 0° à 90°, qui situe un point au nord ou au sud de l'équateur.
- terme: longitude
  definition: L'angle, de 0° à 180°, qui situe un point à l'est ou à l'ouest de Greenwich.
- terme: pôle
  definition: Un des deux points où l'axe de rotation de la Terre coupe la sphère.
erreurs_frequentes:
- Inverser latitude et longitude dans l'écriture des coordonnées.
- 'Oublier d''indiquer N ou S, E ou O : 40° seul ne situe pas le point.'
- Croire que la latitude peut dépasser 90° ou que la longitude peut dépasser 180°.
- Soustraire au lieu d'additionner quand deux points sont de part et d'autre de l'équateur (ou de Greenwich).
- Confondre parallèle (même latitude) et méridien (même longitude).
exemple:
  enonce: Le point K est sur l'équateur, 30° à l'est du méridien de Greenwich. Quelles sont ses coordonnées ?
  solution: Sur l'équateur, la latitude est 0°. La longitude est 30° E. Donc K (0° ; 30° E).
exercices:
- id: cercle-de-latitude-zero
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle le grand cercle de la Terre dont tous les points ont une latitude de 0° ?
  reponse:
    acceptees:
    - équateur
    fautes_tolerees: 1
  indices:
    relance: Ce cercle sépare l'hémisphère Nord de l'hémisphère Sud. Comment s'appelle-t-il ?
    methode: La latitude se mesure à partir de ce cercle, vers le nord ou vers le sud. Il est à égale distance des deux pôles.
    etape: Ce n'est pas un méridien (ils vont d'un pôle à l'autre). C'est le plus grand des parallèles.
  pieges:
  - si:
      valeur: méridien de Greenwich
    relance: Le méridien de Greenwich sert de départ pour la longitude. Pour la latitude, quel est le cercle de départ ?
  - si:
      valeur: Greenwich
    relance: Greenwich sert de départ pour la longitude. Pour la latitude, quel est le cercle de départ ?
  - si:
      diagnostic: mauvaise_reponse
    relance: Pense au cercle qui fait le tour de la Terre en son milieu, entre les deux pôles.
  solution: 'C''est l''équateur : la latitude se mesure à partir de lui, de 0° à 90° vers le nord ou vers le sud.'
- id: hemisphere-sud
  type: choix
  difficulte: 1
  enonce: Quels points sont situés dans l'hémisphère Sud ?
  reponse:
    options:
    - id: a
      texte: A (20° S ; 40° E)
    - id: b
      texte: B (35° N ; 12° O)
    - id: c
      texte: C (5° S ; 100° O)
    - id: d
      texte: D (0° ; 50° E)
    bonnes:
    - a
    - c
  indices:
    relance: Laquelle des deux coordonnées dit si un point est au nord ou au sud de l'équateur ?
    methode: 'Regarde seulement la latitude (le premier nombre) et la lettre qui la suit : N ou S.'
    etape: 'Le point B a une latitude de 35° N : il est dans l''hémisphère Nord. Regarde les autres.'
  pieges:
  - si:
      contient:
      - b
    relance: La lettre O indique l'ouest de Greenwich, pas le sud. Regarde la lettre après la latitude.
  - si:
      contient:
      - d
    relance: 'Une latitude de 0° signifie que le point est sur l''équateur : ni au nord, ni au sud.'
  - si:
      diagnostic: incomplet
    relance: Il y a un autre point dans l'hémisphère Sud. Relis la latitude de chaque point.
  solution: 'Les points A (20° S) et C (5° S) ont une latitude Sud : ils sont dans l''hémisphère Sud. B est au nord, D est
    sur l''équateur.'
- id: parallele-ou-meridien
  type: association
  difficulte: 1
  enonce: Associe chaque ligne de la sphère à ce qui la caractérise.
  reponse:
    gauche:
    - id: a
      texte: un parallèle
    - id: b
      texte: un méridien
    - id: c
      texte: l'équateur
    droite:
    - id: x
      texte: tous ses points ont la même latitude
    - id: y
      texte: tous ses points ont la même longitude
    - id: z
      texte: son point de départ pour la latitude est 0°
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un parallèle est un cercle parallèle à l'équateur. Un méridien va d'un pôle à l'autre. Qu'est-ce qui reste constant
      sur chacun ?
    methode: Sur un parallèle, on se déplace vers l'est ou l'ouest ; sur un méridien, on se déplace vers le nord ou le sud.
    etape: Quand on avance le long d'un parallèle, quelle coordonnée ne change pas ? Commence par là.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis ce qui reste constant sur un parallèle et sur un méridien.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque ligne. Sur un parallèle, on se déplace vers l'est ou l'ouest ; sur un méridien, vers le nord
      ou le sud.
  solution: 'Un parallèle : même latitude. Un méridien : même longitude. L''équateur : latitude 0°.'
- id: ecart-entre-deux-villes
  type: nombre
  difficulte: 2
  enonce: Deux villes sont sur le même méridien. La première a une latitude de 48° N, la seconde de 12° S. Quel angle, en
    degrés, sépare leurs deux parallèles (angle mesuré au centre de la Terre) ? Écris seulement le nombre.
  reponse:
    valeur: 60
  indices:
    relance: Les deux villes sont-elles du même côté de l'équateur ?
    methode: Quand deux points sont de part et d'autre de l'équateur, on additionne leurs latitudes pour trouver l'écart.
    etape: De la première ville à l'équateur, il y a 48°. Ajoute l'angle entre l'équateur et la seconde ville.
  pieges:
  - si:
      valeur: 36
    relance: 'Tu as soustrait les latitudes. Mais l''une est au nord et l''autre au sud : l''équateur est entre les deux.'
  - si:
      diagnostic: valeur_fausse
    relance: 'Fais un schéma : place l''équateur, puis une ville au-dessus et l''autre en dessous.'
  solution: 'Une ville est à 48° au nord de l''équateur, l''autre à 12° au sud : l''écart est 48 + 12 = 60°.'
- id: ecart-meme-cote
  type: nombre
  difficulte: 2
  enonce: Deux villes sont sur le même parallèle. La première a une longitude de 20° E, la seconde de 75° E. Quel angle, en
    degrés, sépare leurs deux méridiens ? Écris seulement le nombre.
  reponse:
    valeur: 55
  indices:
    relance: Les deux villes sont-elles du même côté du méridien de Greenwich ?
    methode: Quand deux points sont du même côté de Greenwich, on soustrait leurs longitudes pour trouver l'écart.
    etape: Retire la plus petite longitude à la plus grande.
  pieges:
  - si:
      valeur: 95
    relance: 'Tu as additionné les longitudes. Mais les deux villes sont du même côté de Greenwich : que fait-on alors ?'
  solution: 'Les deux villes sont à l''est de Greenwich : l''écart est 75 − 20 = 55°.'
- id: longitude-apres-deplacement
  type: texte_court
  difficulte: 2
  enonce: Le point A a pour coordonnées (40° N ; 10° E). Le point B est sur le même parallèle que A, mais 25° plus à l'ouest.
    Quelle est la longitude de B ? Écris par exemple « 50° E » ou « 50° O ».
  reponse:
    acceptees:
    - 15° O
    - 15° ouest
  indices:
    relance: En allant vers l'ouest depuis A, franchit-on le méridien de Greenwich ?
    methode: Sur le méridien de Greenwich, la longitude vaut 0°. Compte combien de degrés il faut pour y arriver, puis combien
      il en reste au-delà.
    etape: De A jusqu'au méridien de Greenwich, on parcourt 10°. Combien de degrés reste-t-il à parcourir, et de quel côté
      de Greenwich ?
  pieges:
  - si:
      valeur: 35° E
    relance: En allant vers l'ouest, la longitude Est diminue. Faut-il ajouter ou retirer les 25° ?
  - si:
      valeur: 15° E
    relance: Le bon nombre de degrés, mais de quel côté du méridien de Greenwich se trouve B après l'avoir franchi ?
  - si:
      diagnostic: mauvaise_reponse
    relance: Place A à 10° à l'est de Greenwich, puis déplace-toi de 25° vers l'ouest sur un schéma.
  solution: De 10° E, on va d'abord de 10° vers l'ouest jusqu'au méridien de Greenwich (0°), puis encore de 25 - 10 = 15°
    vers l'ouest. B a donc pour longitude 15° O.
- id: du-nord-au-sud
  type: ordre
  difficulte: 2
  enonce: Range ces points du plus au nord au plus au sud.
  reponse:
    elements:
    - id: p
      texte: P (60° N ; 10° E)
    - id: q
      texte: Q (20° N ; 45° O)
    - id: r
      texte: R (0° ; 30° E)
    - id: s
      texte: S (35° S ; 70° E)
  indices:
    relance: Quelle coordonnée indique si un point est plus ou moins au nord ?
    methode: 'Compare seulement les latitudes : d''abord les latitudes Nord (de la plus grande à la plus petite), puis l''équateur,
      puis les latitudes Sud.'
    etape: Le point le plus au nord est celui qui a la plus grande latitude Nord. Commence par lui.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux points voisins sont inversés. Relis leurs latitudes et la lettre N ou S.'
  - si:
      diagnostic: ordre_faux
    relance: 'Vérifie le sens : du plus au nord au plus au sud. Seule la latitude compte, avec sa lettre N ou S.'
  solution: 'P (60° N), puis Q (20° N), puis R (sur l''équateur), puis S (35° S) : ordre p, q, r, s.'
- id: latitude-impossible
  type: ouverte
  difficulte: 3
  enonce: Malo pense qu'un point de la Terre peut avoir une latitude de 120° N. Explique pourquoi c'est impossible.
  criteres:
  - L'élève explique que la latitude est un angle mesuré depuis l'équateur (ou le plan de l'équateur), vers le nord ou vers
    le sud.
  - L'élève indique que cet angle atteint au plus 90°, au pôle Nord (ou au pôle Sud), donc 120° N n'existe pas.
  indices:
    relance: Où se trouve un point de latitude 0° ? Et quel est le point le plus au nord de la Terre ?
    methode: 'Pars de l''équateur et monte vers le nord le long d''un méridien : l''angle augmente jusqu''où ?'
    etape: Au pôle Nord, le rayon de la Terre est perpendiculaire au plan de l'équateur. Quelle est alors la latitude ?
  solution: 'La latitude est l''angle entre le plan de l''équateur et la direction du point, mesuré vers le nord ou vers le
    sud. Il vaut 0° sur l''équateur et au plus 90° au pôle Nord. On ne peut pas aller plus au nord que le pôle : 120° N est
    impossible.'
- id: nblm-sur-un-globe-terrestre-quel-grand-cercle-1
  type: choix
  difficulte: 2
  enonce: Sur un globe terrestre, quel grand cercle situé à égale distance des deux pôles sépare la Terre en hémisphère Nord
    et hémisphère Sud ?
  reponse:
    options:
    - id: o1
      texte: L'équateur
    - id: o2
      texte: Le méridien de Greenwich
    - id: o3
      texte: Le tropique du Cancer
    - id: o4
      texte: L'axe des pôles
    bonnes:
    - o1
  indices:
    relance: Pense au cercle imaginaire central qui se trouve à 0° de latitude.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : le méridien de Greenwich est un demi-cercle de référence pour la longitude, pas le cercle
      séparant les hémisphères Nord et Sud.'
  - si:
      contient:
      - o3
    relance: Le tropique du Cancer est un parallèle situé au Nord, mais il ne divise pas la Terre en deux hémisphères égaux.
  - si:
      contient:
      - o4
    relance: L'axe des pôles est une droite imaginaire passant par le centre de la Terre autour de laquelle elle tourne, et
      non un cercle.
  solution: L'équateur. L'équateur est le grand cercle perpendiculaire à l'axe des pôles qui divise le globe terrestre en
    deux hémisphères égaux.
- id: nblm-dans-quel-ordre-conventionnel-doit-on-ec-2
  type: choix
  difficulte: 2
  enonce: Dans quel ordre conventionnel doit-on écrire les coordonnées géographiques d'un point sur une sphère ?
  reponse:
    options:
    - id: o1
      texte: La latitude d'abord, puis la longitude
    - id: o2
      texte: La longitude d'abord, puis la latitude
    - id: o3
      texte: L'altitude d'abord, puis la latitude
    - id: o4
      texte: L'ordre n'a aucune importance
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la notation usuelle sous la forme M (latitude ; longitude).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Inverser la latitude et la longitude est une erreur fréquente ; la longitude s'écrit toujours en second.
  - si:
      contient:
      - o3
    relance: L'altitude est utilisée pour le repérage dans un pavé droit ou dans l'espace, pas pour les coordonnées de surface
      sur la sphère.
  - si:
      contient:
      - o4
    relance: L'ordre est strictement codifié pour éviter toute confusion entre la position Nord/Sud et la position Est/Ouest.
  solution: 'La latitude d''abord, puis la longitude. Selon la convention mathématique, on indique toujours la latitude en
    premier (ex: 40° N) puis la longitude en second (ex: 10° E).'
- id: nblm-quelle-est-la-valeur-maximale-que-peut-a-3
  type: choix
  difficulte: 2
  enonce: Quelle est la valeur maximale que peut atteindre la latitude d'un point sur le globe terrestre ?
  reponse:
    options:
    - id: o1
      texte: 90° Nord ou Sud
    - id: o2
      texte: 180° Est ou Ouest
    - id: o3
      texte: 360° Nord ou Sud
    - id: o4
      texte: 45° Nord ou Sud
    bonnes:
    - o1
  indices:
    relance: C'est la mesure de l'angle formé entre le plan de l'équateur et la direction des pôles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Confusion fréquente avec la longitude, qui varie de 0° à 180° Est ou Ouest.
  - si:
      contient:
      - o3
    relance: 360° est la mesure d'un cercle complet, non la valeur maximale d'une latitude.
  - si:
      contient:
      - o4
    relance: 45° correspond à une position à mi-chemin entre l'équateur et les pôles, pas au maximum.
  solution: 90° Nord ou Sud. La latitude s'exprime de 0° à l'équateur jusqu'à 90° Nord au pôle Nord ou 90° Sud au pôle Sud.
- id: nblm-comment-appelle-t-on-les-demi-cercles-im-4
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on les demi-cercles imaginaires qui joignent le pôle Nord au pôle Sud ?
  reponse:
    options:
    - id: o1
      texte: Les méridiens
    - id: o2
      texte: Les parallèles
    - id: o3
      texte: Les hémisphères
    - id: o4
      texte: Les tropiques
    bonnes:
    - o1
  indices:
    relance: Le demi-cercle d'origine le plus célèbre porte le nom d'un observatoire situé près de Londres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Les parallèles sont des cercles complets parallèles au plan de l'équateur.
  - si:
      contient:
      - o3
    relance: Un hémisphère désigne une moitié de la sphère terrestre, et non une ligne de repérage.
  - si:
      contient:
      - o4
    relance: Les tropiques sont des parallèles spécifiques, et non des demi-cercles joignant les pôles.
  solution: Les méridiens. Les méridiens sont des demi-cercles reliant les deux pôles. Tous les points d'un même méridien
    ont la même longitude.
- id: nblm-lorsqu-un-navire-se-deplace-en-restant-e-5
  type: choix
  difficulte: 2
  enonce: Lorsqu'un navire se déplace en restant exactement sur un même parallèle, quelle coordonnée varie ?
  reponse:
    options:
    - id: o1
      texte: Seule la longitude varie
    - id: o2
      texte: Seule la latitude varie
    - id: o3
      texte: La latitude et la longitude varient toutes les deux
    - id: o4
      texte: Aucune coordonnée ne varie
    bonnes:
    - o1
  indices:
    relance: Un parallèle réunit l'ensemble des points situés à égale hauteur par rapport à l'équateur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le navire restant sur le même parallèle, sa latitude demeure constante.'
  - si:
      contient:
      - o3
    relance: Un trajet le long d'un parallèle conserve une latitude fixe.
  - si:
      contient:
      - o4
    relance: Comme le navire progresse vers l'Est ou l'Ouest, sa longitude change au cours du trajet.
  solution: Seule la longitude varie. Tous les points situés sur un même parallèle partagent la même latitude. En le longeant,
    seule la longitude se modifie.
- id: nblm-parmi-les-affirmations-suivantes-sur-le-6
  type: choix
  difficulte: 3
  enonce: Parmi les affirmations suivantes sur le repérage sur une sphère, lesquelles sont exactes ? (2 bonnes réponses) (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Tous les points situés sur un même méridien ont la même longitude.
    - id: o2
      texte: Le méridien de Greenwich sert d'origine (0°) pour la mesure de la longitude.
    - id: o3
      texte: Un point situé dans l'hémisphère sud peut avoir une latitude de 120° Sud.
    - id: o4
      texte: La longitude indique l'angle mesuré par rapport au plan de l'équateur.
    bonnes:
    - o1
    - o2
  indices:
    relance: Vérifie attentivement les bornes d'angles autorisées et les lignes de référence associées à chaque coordonnée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la latitude est limitée à 90° Nord ou Sud au maximum.'
  - si:
      contient:
      - o4
    relance: C'est la latitude qui se mesure par rapport au plan de l'équateur ; la longitude se mesure par rapport au méridien
      de Greenwich.
  solution: Tous les points situés sur un même méridien ont la même longitude ; Le méridien de Greenwich sert d'origine (0°)
    pour la mesure de la longitude. C'est la définition exacte d'un méridien, lié à la mesure de l'angle de longitude.
- id: nblm-quel-est-le-nom-du-meridien-de-reference-7
  type: texte_court
  difficulte: 1
  enonce: Quel est le nom du méridien de référence d'angle 0° servant à mesurer la longitude sur le globe terrestre ?
  reponse:
    acceptees:
    - Greenwich
    fautes_tolerees: 1
  indices:
