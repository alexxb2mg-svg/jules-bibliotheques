format: 2
notion: melanges-solubilite
version: 1
etat: verifiee
declencheurs:
- sel qui se dissout
- sucre dans l'eau
- solution saturée
- eau et huile ne se mélangent pas
- composition de l'air
- deux couches dans un verre
prerequis: []
essentiel: 'Un mélange associe plusieurs espèces chimiques sans réaction chimique entre elles : mélange homogène (une seule

  phase visible, comme l''eau salée) ou hétérogène (plusieurs phases visibles, comme l''eau et l''huile).


  La solubilité d''une espèce dans un solvant (souvent l''eau) est la masse maximale que l''on peut y dissoudre pour un

  volume donné de solvant, à une température donnée ; au-delà, la solution est saturée et le solide en excès ne se

  dissout plus.


  Deux liquides qui forment un mélange homogène sont miscibles (eau et alcool) ; sinon ils sont non miscibles (eau

  et huile) et se séparent en deux couches.


  La solubilité étant proportionnelle au volume de solvant, on peut calculer la masse maximale dissoute dans un

  volume donné à partir d''une solubilité connue (en g/L par exemple).


  L''air est un mélange homogène de gaz : environ 78 % de diazote et 21 % de dioxygène, avec d''autres gaz en faible

  quantité (dont le dioxyde de carbone).

  '
methode:
- Identifier si le mélange étudié est homogène (aspect uniforme) ou hétérogène (on distingue plusieurs constituants).
- Pour un calcul de solubilité, repérer l'unité (g/L, g/100 mL...) et le volume de solvant utilisé.
- 'Utiliser la proportionnalité : masse dissoute = solubilité × (volume utilisé divisé par volume de référence).'
- Vérifier que la masse à dissoudre ne dépasse pas la masse maximale (sinon la solution est saturée, il reste un dépôt).
vocabulaire:
- terme: miscible
  definition: se dit de deux liquides qui, mélangés, forment un seul liquide homogène (comme l'eau et l'alcool)
- terme: solution saturée
  definition: une solution dans laquelle on ne peut plus dissoudre de soluté supplémentaire à cette température
erreurs_frequentes:
- Croire qu'un mélange homogène ne contient qu'une seule espèce chimique.
- Confondre miscible (deux liquides qui se mélangent) et soluble (un solide qui se dissout dans un liquide).
- Oublier de convertir le volume avant d'appliquer une solubilité donnée en g/L.
- Penser que l'on peut dissoudre une quantité infinie de soluté dans un volume donné de solvant.
exemple:
  enonce: La solubilité du sel dans l'eau est d'environ 360 g par litre à température ambiante. Quelle masse maximale de sel
    peut-on dissoudre dans 250 mL d'eau ?
  solution: 250 mL = 0,25 L. Masse maximale = 360 × 0,25 = 90 g.
exercices:
- id: masse-max-sucre
  type: nombre
  difficulte: 1
  enonce: Le sucre a une solubilité d'environ 2000 g/L dans l'eau. Quelle masse maximale de sucre peut-on dissoudre dans 150
    mL d'eau, en grammes ?
  reponse:
    valeur: 300
    forme: entier
    tolerance: 5
  indices:
    relance: Convertis d'abord le volume de mL en L.
    methode: Masse maximale = solubilité × (volume en L).
    etape: 150 mL vaut 0,15 L.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta conversion de 150 mL en litres avant de multiplier.
  solution: 150 mL = 0,15 L. Masse maximale = 2000 × 0,15 = 300 g.
- id: homogene-ou-heterogene-huile
  type: texte_court
  difficulte: 1
  enonce: On verse de l'huile dans un verre d'eau et on agite. Après quelques instants, deux couches distinctes apparaissent.
    Ce mélange est-il homogène ou hétérogène ?
  reponse:
    acceptees:
    - hétérogène
    fautes_tolerees: 1
  indices:
    relance: Un mélange homogène a-t-il un aspect uniforme, ou peut-on y distinguer plusieurs parties ?
    methode: Ici, on distingue deux couches différentes dans le verre.
    etape: Le mot cherché commence par « hétéro- ».
  pieges:
  - si:
      valeur: homogène
    relance: Un mélange homogène a un aspect uniforme, sans couches visibles. Est-ce le cas ici ?
  solution: 'Ce mélange est hétérogène : on distingue deux couches (l''huile au-dessus, l''eau en dessous), car l''huile et
    l''eau ne sont pas miscibles.'
- id: pourcentage-autres-gaz-air
  type: nombre
  difficulte: 2
  enonce: L'air contient environ 78 % de diazote et 21 % de dioxygène. Quel pourcentage reste pour les autres gaz (dont le
    dioxyde de carbone) ?
  reponse:
    valeur: 1
    forme: entier
    tolerance: 0
  indices:
    relance: Le total des pourcentages d'un mélange doit faire 100 %.
    methode: Additionne 78 et 21, puis soustrais ce total de 100.
    etape: 78 + 21 = 99.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Reprends le calcul 100 moins la somme des deux pourcentages donnés.
  solution: 100 − 78 − 21 = 1 % pour les autres gaz (argon, dioxyde de carbone...).
- id: choisir-definition-solubilite
  type: choix
  difficulte: 2
  enonce: Que signifie exactement la solubilité d'une espèce chimique dans l'eau ?
  reponse:
    options:
    - id: a
      texte: La masse maximale de cette espèce que l'on peut dissoudre dans un volume donné d'eau, à une température donnée
    - id: b
      texte: Le temps nécessaire pour que cette espèce se dissolve entièrement
    - id: c
      texte: La couleur que prend l'eau quand on y dissout cette espèce
    bonnes:
    - a
  indices:
    relance: La solubilité est une quantité, exprimée par exemple en g/L. Pense à ce que représente cette unité.
    methode: Élimine les propositions qui ne parlent pas d'une masse ou d'une quantité de matière.
    etape: Le temps de dissolution et la couleur ne sont pas des masses.
  pieges:
  - si:
      contient:
      - b
    relance: Le temps de dissolution est une autre grandeur ; la solubilité est une masse maximale, pas une durée.
  - si:
      contient:
      - c
    relance: La couleur n'a pas de lien direct avec la solubilité, qui est une masse maximale dissoute.
  solution: La solubilité est la masse maximale d'une espèce chimique que l'on peut dissoudre dans un volume donné d'eau,
    à une température donnée.
- id: sel-solution-saturee
  type: ouverte
  difficulte: 3
  enonce: On dissout 400 g de sel dans 1 L d'eau, alors que la solubilité du sel dans l'eau est d'environ 360 g/L. Que se
    passe-t-il, et pourquoi ?
  criteres:
  - L'élève compare la masse versée (400 g) à la masse maximale dissoute (360 g pour 1 L).
  - L'élève dit que la solution devient saturée, car 400 g dépasse la masse maximale dissoluble.
  - L'élève conclut qu'il reste du sel non dissous (un dépôt) au fond du récipient.
  indices:
    relance: Compare 400 g à la masse maximale de sel dissoluble dans 1 L d'eau.
    methode: Calcule la différence entre la masse versée et la solubilité, pour savoir ce qu'il reste de non dissous.
    etape: 400 g est supérieur à 360 g, la masse maximale dissoluble dans 1 L.
  solution: 400 g dépasse la solubilité du sel dans 1 L d'eau (360 g). La solution devient saturée, elle ne peut plus dissoudre
    plus de sel. Il reste donc environ 40 g de sel non dissous, visible en dépôt au fond du récipient.
