format: 2
notion: melanges-solubilite
version: 2
etat: verifiee
declencheurs:
- eau et huile
- sel dans l'eau
- soluté et solvant
- solution saturée
- non miscibles
- gaz qui composent l'air
- eau sucrée saturée
- sucre qui ne se dissout plus
- deux liquides superposés
- pourcentage de dioxygène
prerequis:
- etats-et-changements-etat
essentiel: 'Un mélange contient plusieurs espèces chimiques. Il est homogène si on ne peut pas distinguer ses constituants
  à l''œil nu (eau sucrée, eau et alcool, air). Il est hétérogène si on les distingue (eau boueuse, eau et huile, eau et sable).


  Deux liquides sont miscibles s''ils forment un mélange homogène (eau et alcool). Ils sont non miscibles s''ils forment deux
  couches (eau et huile). Le liquide de plus faible masse volumique est au-dessus : l''huile (0,92 g/cm³) flotte sur l''eau
  (1 g/cm³).


  Dissolution : un soluté (sel, sucre) se disperse dans un solvant (souvent l''eau). On obtient une solution. Une solution
  est un mélange homogène.

  Le soluté n''a pas disparu : sa masse compte. Masse de la solution = masse du solvant + masse du soluté dissous.

  Le sucre ne « fond » pas : il se dissout.


  Solubilité : c''est la masse maximale de soluté que l''on peut dissoudre dans un litre de solvant, à une température donnée.
  Elle s''exprime en g/L. Au-delà, le soluté ne se dissout plus : la solution est saturée, et il reste du solide au fond.

  La solubilité dépend du soluté, du solvant et de la température.


  Estimer une solubilité : on prend un volume connu d''eau (éprouvette graduée). On ajoute le soluté par petites quantités
  pesées, en agitant, jusqu''à ce qu''il ne se dissolve plus. On note la masse totale dissoute, puis on la ramène à un litre.

  Exemple : 18 g dissous dans 50 mL (0,050 L) donnent 18 ÷ 0,050 = 360 g/L.


  Composition de l''air : c''est un mélange homogène de gaz, en volume : environ 78 % de diazote N₂, 21 % de dioxygène O₂
  et 1 % d''autres gaz (argon, dioxyde de carbone, vapeur d''eau…).


  Au brevet : on te demande de classer des mélanges, de concevoir un protocole (matériel, étapes, calcul) pour caractériser
  un mélange ou estimer une solubilité, et de donner la composition de l''air.

  '
methode:
- 'Observer le mélange : distingue-t-on plusieurs constituants ? Si oui, il est hétérogène ; sinon, homogène.'
- 'Pour deux liquides : une seule phase, ils sont miscibles ; deux couches, ils ne le sont pas.'
- Pour une dissolution, repérer le soluté (ce qui est dissous) et le solvant (ce qui dissout).
- 'Pour une solubilité : diviser la masse maximale dissoute par le volume de solvant exprimé en litres (g/L).'
- 'Pour une masse de solution : additionner la masse du solvant et celle du soluté dissous.'
- 'Pour un protocole : indiquer le matériel, les étapes dans l''ordre, ce qu''on mesure et le calcul final.'
vocabulaire:
- terme: mélange homogène
  definition: mélange dont on ne distingue pas les constituants à l'œil nu
- terme: mélange hétérogène
  definition: mélange dont on distingue au moins deux constituants
- terme: soluté
  definition: espèce chimique dissoute (le sel dans l'eau salée)
- terme: solvant
  definition: liquide dans lequel on dissout le soluté (souvent l'eau)
- terme: solution
  definition: mélange homogène obtenu en dissolvant un soluté dans un solvant
- terme: solution saturée
  definition: 'solution dans laquelle on ne peut plus dissoudre de soluté : il en reste au fond'
- terme: solubilité
  definition: masse maximale de soluté dissoute dans un litre de solvant à une température donnée, en g/L
- terme: miscibles
  definition: se dit de deux liquides qui se mélangent en formant un mélange homogène
erreurs_frequentes:
- 'Croire que le sel disparaît quand il se dissout : il est toujours là (l''eau est salée) et sa masse compte.'
- 'Dire que le sucre « fond » dans l''eau : c''est une dissolution, pas une fusion.'
- Inverser soluté et solvant.
- Oublier de ramener la masse dissoute à un litre de solvant pour calculer une solubilité.
- 'Croire que l''air est surtout du dioxygène : c''est le diazote qui est majoritaire.'
exemple:
  enonce: On dissout au maximum 40 g de sucre dans 20 mL d'eau à 20 °C. Estimer la solubilité du sucre dans l'eau à cette
    température.
  solution: '20 mL = 0,020 L. Solubilité = 40 ÷ 0,020 = 2 000 g/L : on peut dissoudre environ 2 000 g de sucre dans un litre
    d''eau à 20 °C.'
exercices:
- id: nom-du-liquide-qui-dissout
  type: texte_court
  difficulte: 1
  enonce: On dissout du sel dans de l'eau. Comment appelle-t-on l'eau, le liquide dans lequel on dissout le sel ? Réponds
    par un seul mot.
  reponse:
    acceptees:
    - solvant
    fautes_tolerees: 1
  indices:
    relance: Le sel est dissous ; l'eau, elle, dissout. Quel mot désigne ce qui dissout ?
    methode: 'Dans une dissolution, il y a deux rôles : celui qui est dissous (le soluté) et celui qui dissout.'
    etape: Le sel est le soluté. Cherche le nom de l'autre rôle, celui de l'eau.
  pieges:
  - si:
      valeur: soluté
    relance: 'Le soluté, c''est ce qui est dissous : ici le sel. Et l''eau ?'
  - si:
      valeur: solution
    relance: La solution, c'est le mélange obtenu (l'eau salée). Quel est le nom de l'eau seule, qui dissout ?
  solution: 'L''eau est le solvant : elle dissout le sel, qui est le soluté. Le mélange obtenu (eau salée) est la solution.'
- id: classer-melanges
  type: association
  difficulte: 1
  enonce: Associe chaque mélange à son type.
  reponse:
    gauche:
    - id: g1
      texte: eau et huile agitées puis laissées au repos
    - id: g2
      texte: eau et sirop de menthe
    - id: g3
      texte: eau boueuse
    - id: g4
      texte: eau et alcool
    droite:
    - id: a
      texte: mélange homogène
    - id: b
      texte: mélange hétérogène
    paires:
      g1: b
      g2: a
      g3: b
      g4: a
  indices:
    relance: Pour chaque mélange, peut-on voir à l'œil nu plusieurs parties différentes ?
    methode: 'Homogène : on ne distingue qu''une seule phase. Hétérogène : on distingue plusieurs constituants ou plusieurs
      couches.'
    etape: 'L''eau boueuse : on voit des particules de terre en suspension. Fais de même pour les trois autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Un mélange coloré mais transparent, sans couches, est-il homogène ou hétérogène
      ?
  - si:
      diagnostic: associations_fausses
    relance: Deux liquides non miscibles forment deux couches ; deux liquides miscibles n'en forment qu'une. Reprends ligne
      par ligne.
  solution: 'Eau et huile : hétérogène (deux couches, non miscibles). Eau et sirop de menthe : homogène. Eau boueuse : hétérogène.
    Eau et alcool : homogène (miscibles).'
- id: masse-eau-salee
  type: nombre
  difficulte: 1
  enonce: On verse 15 g de sel dans 200 g d'eau et on agite jusqu'à ce que tout le sel soit dissous. Quelle est la masse de
    l'eau salée obtenue, en grammes ? Écris seulement le nombre.
  reponse:
    valeur: 215
  indices:
    relance: Le sel a-t-il vraiment disparu, ou est-il encore dans l'eau ?
    methode: 'Lors d''une dissolution, la masse se conserve : la masse de la solution est la somme de celle du solvant et
      de celle du soluté.'
    etape: 'Pose l''addition : masse de l''eau + masse du sel.'
  pieges:
  - si:
      valeur: 200
    relance: 'On ne voit plus le sel, mais l''eau a-t-elle un goût salé ? Le sel est toujours là : sa masse compte-t-elle
      ?'
  - si:
      diagnostic: valeur_fausse
    relance: 'Rien n''est sorti du récipient : additionne les masses de tout ce que tu as mis dedans.'
  solution: 'La masse se conserve lors d''une dissolution : 200 + 15 = 215 g.'
- id: estimer-solubilite-sel
  type: nombre
  difficulte: 2
  enonce: On ajoute du sel, petit à petit et en agitant, dans 50 mL d'eau à 20 °C. On arrive à dissoudre 18 g de sel ; au-delà,
    le sel ne se dissout plus. Estime la solubilité du sel dans l'eau à 20 °C, en g/L. Écris seulement le nombre.
  reponse:
    valeur: 360
  indices:
    relance: La solubilité se donne pour quel volume d'eau ? Et ici, quel volume a-t-on utilisé ?
    methode: Convertis 50 mL en litres, puis divise la masse dissoute par ce volume.
    etape: 50 mL = 0,05 L. Pose la division 18 ÷ 0,05 (ou cherche combien de fois 50 mL il y a dans 1 L).
  pieges:
  - si:
      valeur: 0.36
    relance: 'Tu as calculé en grammes par millilitre. On demande des grammes par litre : combien y a-t-il de mL dans 1 L
      ?'
  - si:
      valeur: 900
    relance: Tu as multiplié 18 par 50. Avec 1 L au lieu de 50 mL, on a combien de fois plus d'eau ?
  solution: 50 mL = 0,05 L. Solubilité = 18 ÷ 0,05 = 360 g/L (dans 1 L, il y a 20 fois 50 mL, et 18 × 20 = 360).
- id: gaz-majoritaire-air
  type: choix
  difficulte: 2
  enonce: Quel gaz représente environ 78 % du volume de l'air ?
  reponse:
    options:
    - id: a
      texte: le dioxygène (O2)
    - id: b
      texte: le diazote (N2)
    - id: c
      texte: le dioxyde de carbone (CO2)
    - id: d
      texte: la vapeur d'eau (H2O)
    bonnes:
    - b
  indices:
    relance: L'air contient environ 21 % d'un gaz indispensable à la respiration. Est-ce lui qui fait 78 % ?
    methode: 'Retiens la composition de l''air : un gaz majoritaire (environ 4/5), le dioxygène (environ 1/5), et 1 % d''autres
      gaz.'
    etape: 'Le dioxyde de carbone et la vapeur d''eau font partie du 1 % restant. Il reste deux candidats : lequel n''est
      pas le gaz de la respiration ?'
  pieges:
  - si:
      contient:
      - a
    relance: Le dioxygène est essentiel à la vie, mais il ne représente qu'environ un cinquième de l'air. Quel gaz occupe
      le reste ?
  - si:
      contient:
      - c
    relance: On parle beaucoup du dioxyde de carbone, mais il ne représente qu'une toute petite part de l'air (moins de 0,1
      %).
  solution: Le diazote (N2) représente environ 78 % de l'air, le dioxygène environ 21 %, et les autres gaz environ 1 %.
- id: protocole-solubilite-sucre
  type: ouverte
  difficulte: 3
  enonce: Propose un protocole pour estimer la solubilité du sucre dans l'eau à la température de la classe. Décris le matériel,
    les étapes et le calcul final.
  criteres:
  - L'élève utilise un volume d'eau connu (mesuré à l'éprouvette graduée) et ajoute le sucre par petites quantités pesées,
    en agitant.
  - L'élève s'arrête quand le sucre ne se dissout plus (solution saturée, il reste du solide au fond) et note la masse totale
    dissoute.
  - L'élève ramène la masse dissoute à un litre d'eau pour obtenir une solubilité en g/L.
  indices:
    relance: Comment sait-on qu'on ne peut plus dissoudre de sucre ?
    methode: Il faut connaître le volume d'eau et la masse de sucre dissous au maximum, puis ramener à un litre.
    etape: 'Commence ainsi : mesure 20 mL d''eau à l''éprouvette graduée et verse-les dans un bécher. Que fais-tu ensuite
      avec le sucre et la balance ?'
  solution: On verse 20 mL d'eau dans un bécher. On pèse des portions de sucre (par exemple 5 g) et on les ajoute une à une
    en agitant, jusqu'à ce qu'une portion ne se dissolve plus. On compte la masse dissoute (par exemple 40 g). Solubilité
    = 40 g ÷ 0,020 L = 2 000 g/L à la température de la classe.
- id: nblm-lorsqu-on-melange-de-l-eau-et-de-l-huile-1
  type: choix
  difficulte: 2
  enonce: Lorsqu'on mélange de l'eau et de l'huile dans un tube à essai, on observe deux couches distinctes. Comment qualifie-t-on
    ces deux liquides et le mélange obtenu ?
  reponse:
    options:
    - id: o1
      texte: Ces liquides sont non miscibles et forment un mélange hétérogène.
    - id: o2
      texte: Ces liquides sont miscibles et forment un mélange homogène.
    - id: o3
      texte: Ces liquides sont non miscibles et forment un mélange homogène.
    - id: o4
      texte: Ces liquides sont miscibles et forment un mélange hétérogène.
    bonnes:
    - o1
  indices:
    relance: Pense à la définition des liquides qui ne se mélangent pas et au nombre de phases ou constituants visibles à
      l'œil nu.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : des liquides miscibles se mélangent complètement en une seule phase, ce qui n''est pas le
      cas ici.'
  - si:
      contient:
      - o3
    relance: Un mélange comportant deux couches distinctes visibles à l'œil nu ne peut pas être qualifié d'homogène.
  - si:
      contient:
      - o4
    relance: Des liquides miscibles s'associent pour former une seule phase, ils ne peuvent donc pas donner un mélange hétérogène.
  solution: 'Ces liquides sont non miscibles et forment un mélange hétérogène. L''eau et l''huile ne se mélangent pas, formant
    deux couches visibles à l''œil nu : ils sont non miscibles et le mélange est hétérogène.'
- id: nblm-on-dissout-15-g-de-sel-dans-100-g-d-eau-2
  type: choix
  difficulte: 2
  enonce: On dissout 15 g de sel dans 100 g d'eau pure dans un récipient fermé. Quelle est la masse totale de la solution
    salée obtenue ?
  reponse:
    options:
    - id: o1
      texte: 115 g, car la masse du soluté et celle du solvant s'additionnent.
    - id: o2
      texte: 100 g, car le sel s'est dissous et sa masse a disparu.
    - id: o3
      texte: 85 g, car la dissolution fait diminuer la masse du liquide.
    - id: o4
      texte: 130 g, car la dissolution crée de la matière supplémentaire.
    bonnes:
    - o1
  indices:
    relance: 'La masse se conserve toujours lors d''une dissolution : il faut faire la somme des masses de tous les constituants.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que le sel ''disparaît'' à la dissolution. Ses particules se dispersent, mais leur
      masse se conserve.'
  - si:
      contient:
      - o3
    relance: 'La dissolution est une transformation physique qui ne détruit pas la matière : la masse ne diminue pas.'
  - si:
      contient:
      - o4
    relance: La dissolution ne crée pas de masse supplémentaire, elle conserve exactement la somme des masses de départ.
  solution: '115 g, car la masse du soluté et celle du solvant s''additionnent. Lors d''une dissolution, la masse se conserve
    : masse de la solution = masse du solvant + masse du soluté dissous (100 g + 15 g = 115 g).'
- id: nblm-quand-on-prepare-de-l-eau-sucree-comment-3
  type: choix
  difficulte: 2
  enonce: Quand on prépare de l'eau sucrée, comment nomme-t-on précisément le sucre et l'eau ?
  reponse:
    options:
    - id: o1
      texte: Le sucre est le soluté et l'eau est le solvant.
    - id: o2
      texte: Le sucre est le solvant et l'eau est le soluté.
    - id: o3
      texte: Le sucre et l'eau sont tous les deux des solutés.
    - id: o4
      texte: Le sucre est le réactif et l'eau est le produit.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à quel composant est la substance dissoute et quel composant est le liquide qui dissout.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : inverser soluté et solvant. Le liquide dispersant est le solvant, pas le soluté.'
  - si:
      contient:
      - o3
    relance: L'eau est le liquide dans lequel le solide se dissout, elle joue le rôle de solvant.
  - si:
      contient:
      - o4
    relance: Une dissolution est une transformation physique (mélange) et non une réaction chimique formant de nouveaux produits.
  solution: Le sucre est le soluté et l'eau est le solvant. Le soluté est l'espèce chimique dissoute (le sucre) et le solvant
    est le liquide qui dissout (l'eau).
- id: nblm-on-ajoute-du-sel-dans-un-verre-d-eau-en-4
  type: choix
  difficulte: 2
  enonce: On ajoute du sel dans un verre d'eau en agitant. Au bout d'un moment, le sel ne se dissout plus et reste déposé
    au fond du verre. Que peut-on affirmer sur cette solution ?
  reponse:
    options:
    - id: o1
      texte: La solution est saturée car la masse maximale de soluté dissous a été atteinte.
    - id: o2
      texte: La solution est un mélange parfaitement homogène.
    - id: o3
      texte: Le sel a fondu sous l'effet de l'agitation.
    - id: o4
      texte: Le solvant s'est entièrement évaporé.
    bonnes:
    - o1
  indices:
    relance: Quel terme scientifique qualifie une solution dans laquelle le solvant ne peut plus dissoudre de soluté supplémentaire
      ?
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Du sel solide reste visible au fond du récipient avec le liquide, le mélange global est donc hétérogène.
  - si:
      contient:
      - o3
    relance: 'Erreur classique : confondre dissolution et fusion. Le sel ne fond pas dans l''eau à température ambiante.'
  - si:
      contient:
      - o4
    relance: Le dépôt au fond indique que la solubilité maximale est dépassée, pas que l'eau s'est évaporée.
  solution: 'La solution est saturée car la masse maximale de soluté dissous a été atteinte. Lorsque le soluté ne se dissout
    plus et qu''il en reste au fond, la limite de solubilité est atteinte : la solution est dite saturée.'
- id: nblm-l-air-qui-nous-entoure-est-un-melange-ho-5
  type: choix
  difficulte: 2
  enonce: L'air qui nous entoure est un mélange homogène de plusieurs gaz. Quels sont les deux gaz majoritaires qui le composent
    et dans quelles proportions approximatives en volume ?
  reponse:
    options:
    - id: o1
      texte: Environ 78 % de diazote (N₂) et 21 % de dioxygène (O₂).
    - id: o2
      texte: Environ 78 % de dioxygène (O₂) et 21 % de diazote (N₂).
    - id: o3
      texte: Environ 50 % de dioxygène (O₂) et 50 % de dioxyde de carbone (CO₂).
    - id: o4
      texte: Environ 99 % de vapeur d'eau et 1 % de dioxygène.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi quel gaz est le plus abondant dans l'atmosphère terrestre par rapport à celui que nous consommons
      pour respirer.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que le dioxygène est le gaz majoritaire. En réalité, le diazote constitue plus des
      trois quarts de l''air.'
  - si:
      contient:
      - o3
    relance: Le dioxyde de carbone est un gaz minoritaire dans l'air (bien moins de 1 %).
  - si:
      contient:
      - o4
    relance: La vapeur d'eau est présente en faible quantité variable et ne constitue pas l'essentiel de l'atmosphère.
  solution: Environ 78 % de diazote (N₂) et 21 % de dioxygène (O₂). L'air est composé principalement de 78 % de diazote et
    21 % de dioxygène en volume (et 1 % d'autres gaz).
- id: nblm-parmi-les-affirmations-suivantes-concern-6
  type: choix
  difficulte: 3
  enonce: Parmi les affirmations suivantes concernant les mélanges et la solubilité, lesquelles sont correctes ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Mettre du sucre dans du thé chaud est une dissolution, pas une fusion.
    - id: o2
      texte: La solubilité d'un soluté dans l'eau dépend de la température.
    - id: o3
      texte: Quand un solide se dissout complètement dans l'eau, sa masse disparaît.
    - id: o4
      texte: Deux liquides qui forment un mélange homogène sont dits non miscibles.
    bonnes:
    - o1
    - o2
  indices:
    relance: Réfléchis à la différence entre dissoudre et fondre, à la conservation de la masse et aux définitions du vocabulaire
      des liquides.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la masse se conserve lors d''une dissolution. La masse de la solution finale est égale à
      la somme des masses de l''eau et du solide.'
  - si:
      contient:
      - o4
    relance: Deux liquides qui se mélangent en formant une seule phase homogène sont dits miscibles.
  solution: Mettre du sucre dans du thé chaud est une dissolution, pas une fusion ; La solubilité d'un soluté dans l'eau dépend
    de la température. Le sucre se disperse dans un solvant liquide (dissolution). La fusion consisterait à chauffer le sucre
    seul jusqu'à ce qu'il devienne liquide.
- id: nblm-deux-liquides-qui-ne-se-melangent-pas-et-7
  type: texte_court
  difficulte: 1
  enonce: Deux liquides qui ne se mélangent pas et forment deux couches distinctes (comme l'eau et l'huile) sont dits non
    ____________.
  reponse:
    acceptees:
    - miscibles
    fautes_tolerees: 1
  indices:
    relance: Recherche le terme scientifique exact désignant des liquides incapables de se mélanger de manière homogène.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: miscibles. Des liquides incapables de se mélanger pour former une seule phase homogène sont dits non miscibles.
- id: nblm-lors-de-la-preparation-d-une-solution-de-8
  type: texte_court
  difficulte: 1
  enonce: Lors de la préparation d'une solution de sel dans l'eau, le liquide qui dissout le sel s'appelle le ____________.
  reponse:
    acceptees:
    - solvant
    fautes_tolerees: 1
  indices:
    relance: Quel est le nom du liquide dispersant (ici l'eau) par opposition au solide dissous (le soluté) ?
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: solvant. Le solvant est le liquide dans lequel le soluté se dissout pour former la solution.
- id: liquide-au-dessus
  type: choix
  difficulte: 1
  enonce: On verse de l'huile (0,92 g/cm³) dans de l'eau (1 g/cm³) et on laisse reposer. Que observe-t-on ?
  reponse:
    options:
    - id: a
      texte: l'huile est au-dessus de l'eau, en deux couches
    - id: b
      texte: l'huile est au-dessous de l'eau, en deux couches
    - id: c
      texte: l'huile et l'eau forment un mélange homogène
    bonnes:
    - a
  indices:
    relance: 'Compare les deux masses volumiques : lequel des deux liquides est le moins dense ?'
    methode: 'Deux liquides non miscibles se superposent : le moins dense est au-dessus.'
    etape: 0,92 est plus petit que 1. Le liquide de masse volumique 0,92 est donc placé au-dessus.
  pieges:
  - si:
      contient:
      - b
    relance: C'est le liquide de plus grande masse volumique qui est au fond. Lequel est-ce ?
  - si:
      contient:
      - c
    relance: 'L''eau et l''huile ne se mélangent pas : s''ils formaient un mélange homogène, on ne verrait qu''une seule phase.'
  solution: 'L''huile a une masse volumique plus petite que l''eau et n''est pas miscible avec elle : elle forme une couche
    au-dessus.'
- id: masse-de-sel-dans-250-ml
  type: nombre
  difficulte: 3
  enonce: La solubilité du sel dans l'eau à 20 °C est d'environ 360 g/L. Quelle masse maximale de sel peut-on dissoudre dans
    250 mL d'eau à cette température ? Donne le résultat en grammes. Écris seulement le nombre.
  reponse:
    valeur: 90
    forme: libre
  indices:
    relance: 'Ne mélange pas les unités : la solubilité est donnée pour un litre, et l''eau est donnée en millilitres.'
    methode: Convertis d'abord le volume en litres, puis multiplie la solubilité par ce volume.
    etape: 250 mL = 0,25 L. Calcule 360 × 0,25.
  pieges:
  - si:
      valeur: 90000
    relance: Tu as multiplié par 250 sans convertir les mL en L.
  - si:
      valeur: 1440
    relance: Tu as divisé par 0,25 au lieu de multiplier. Dans un volume plus petit qu'un litre, on dissout moins de sel.
  solution: 250 mL = 0,25 L. m = 360 × 0,25 = 90 g.
