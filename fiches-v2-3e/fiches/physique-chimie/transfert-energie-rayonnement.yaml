format: 2
notion: transfert-energie-rayonnement
version: 3
etat: verifiee
declencheurs:
- rayonnement infrarouge
- la Terre émet un rayonnement
- absorption du rayonnement
- chauffé par le Soleil
- réchauffement de la Terre
- énergie du Soleil
- voiture au soleil
- gaz qui piègent la chaleur
prerequis:
- formes-energie
- types-rayonnements
essentiel: 'Un rayonnement (lumière visible, infrarouge, ultraviolet…) transporte de l''énergie. Il n''a pas besoin de matière
  pour se propager : il traverse le vide entre le Soleil et la Terre.


  Émission : un objet qui émet un rayonnement cède de l''énergie. Tout objet émet un rayonnement : le Soleil (très chaud)
  émet surtout de la lumière visible ; un corps tiède, comme le sol ou notre corps, émet un rayonnement infrarouge, invisible
  pour nos yeux.


  Absorption : un objet qui absorbe un rayonnement reçoit de l''énergie. Cette énergie est convertie : en énergie thermique
  (l''objet s''échauffe : voiture au soleil), en énergie électrique (panneau photovoltaïque) ou en énergie chimique (photosynthèse
  d''une plante).


  Émettre ou absorber un rayonnement, c''est donc transférer de l''énergie sans contact et sans matière entre les deux.


  L''effet de serre, étape par étape :

  1. Le Soleil émet un rayonnement, surtout visible. Le sol l''absorbe et s''échauffe.

  2. Le sol chaud émet à son tour un rayonnement infrarouge vers l''atmosphère.

  3. Les gaz à effet de serre (vapeur d''eau, dioxyde de carbone CO₂, méthane CH₄, protoxyde d''azote N₂O) absorbent une partie
  de ce rayonnement infrarouge.

  4. Ils réémettent de l''énergie dans toutes les directions, dont une partie vers le sol, qui se réchauffe davantage.


  Le diazote N₂ et le dioxygène O₂, qui forment presque tout l''air, ne sont pas des gaz à effet de serre.


  Cet effet de serre est naturel et utile : sans lui, la température moyenne de la Terre serait d''environ −18 °C au lieu
  d''environ +15 °C.


  Les activités humaines (combustions de charbon, de pétrole et de gaz) ajoutent du CO₂ dans l''air : l''effet de serre se
  renforce et la température moyenne augmente. C''est le réchauffement climatique.


  Au brevet : on te demande d''identifier qui émet et qui absorbe, de dire en quelle forme l''énergie reçue est convertie,
  et d''expliquer l''effet de serre avec le rayonnement infrarouge.

  '
methode:
- Repérer quel objet émet le rayonnement (il cède de l'énergie) et quel objet l'absorbe (il reçoit de l'énergie).
- 'Nommer le rayonnement : lumière visible du Soleil, infrarouge émis par un corps tiède.'
- Dire en quelle forme l'énergie reçue est convertie (thermique, électrique, chimique).
- 'Pour l''effet de serre, suivre l''énergie : Soleil, puis sol, puis rayonnement infrarouge, puis gaz de l''atmosphère, puis
  retour vers le sol.'
- Pour le réchauffement, conclure par la cause (plus de CO₂ ajouté par les combustions) et l'effet (plus d'infrarouge absorbé,
  température moyenne plus haute).
vocabulaire:
- terme: rayonnement
  definition: transport d'énergie sans matière, par exemple la lumière visible ou l'infrarouge
- terme: émettre
  definition: envoyer un rayonnement ; l'émetteur cède de l'énergie
- terme: absorber
  definition: recevoir un rayonnement sans le laisser passer ; le récepteur reçoit de l'énergie
- terme: infrarouge
  definition: rayonnement invisible émis par les corps tièdes ou chauds, comme le sol
- terme: gaz à effet de serre
  definition: gaz de l'atmosphère qui absorbe une partie du rayonnement infrarouge émis par la Terre
- terme: effet de serre
  definition: phénomène qui garde de l'énergie près du sol grâce aux gaz qui absorbent l'infrarouge
- terme: réchauffement climatique
  definition: hausse de la température moyenne de la Terre, liée à un effet de serre renforcé
erreurs_frequentes:
- Croire que l'effet de serre est uniquement causé par les humains, alors qu'il existe naturellement et qu'il est indispensable
  à la vie.
- Croire que les gaz à effet de serre absorbent surtout la lumière du Soleil, alors qu'ils absorbent surtout le rayonnement
  infrarouge émis par la Terre.
- Penser que le rayonnement a besoin d'air pour se propager.
- Citer le dioxygène ou le diazote comme gaz à effet de serre.
- 'Croire que seul un objet chaud émet un rayonnement : un corps tiède émet aussi, de l''infrarouge.'
exemple:
  enonce: Une voiture de couleur sombre est garée en plein soleil. Pourquoi l'intérieur devient-il très chaud ?
  solution: 'Le Soleil émet un rayonnement qui transporte de l''énergie. La carrosserie et les sièges absorbent ce rayonnement
    : ils reçoivent de l''énergie, qui est convertie en énergie thermique, et ils s''échauffent.'
exercices:
- id: nom-rayonnement-terre
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le rayonnement invisible émis par la Terre (et par notre corps), que les gaz à effet de serre
    absorbent ?
  reponse:
    acceptees:
    - infrarouge
    - infrarouges
    - rayonnement infrarouge
    - infra-rouge
    fautes_tolerees: 1
  indices:
    relance: Ce rayonnement est invisible. Est-il situé du côté du rouge ou du côté du violet de la lumière visible ?
    methode: Les caméras thermiques captent ce rayonnement émis par les corps tièdes. Dans l'arc-en-ciel de la lumière, il
      se trouve juste après une des deux extrémités.
    etape: Son nom commence par « infra », qui veut dire « en dessous » en latin. Complète.
  pieges:
  - si:
      valeur: ultraviolet
    relance: Les ultraviolets viennent surtout du Soleil, qui est très chaud. Un objet tiède comme la Terre émet un rayonnement
      situé de l'autre côté du visible.
  - si:
      diagnostic: mauvaise_reponse
    relance: C'est un rayonnement invisible, situé juste à côté du rouge dans la lumière. Quel est son nom ?
  solution: 'C''est le rayonnement infrarouge (IR) : invisible pour nos yeux, il est émis par tous les corps tièdes, comme
    la Terre.'
- id: gaz-effet-de-serre
  type: choix
  difficulte: 2
  enonce: Parmi ces gaz de l'atmosphère, lesquels sont des gaz à effet de serre ?
  reponse:
    options:
    - id: a
      texte: le dioxyde de carbone
    - id: b
      texte: le diazote
    - id: c
      texte: la vapeur d'eau
    - id: d
      texte: le méthane
    - id: e
      texte: le dioxygène
    bonnes:
    - a
    - c
    - d
  indices:
    relance: Un gaz à effet de serre absorbe une partie du rayonnement infrarouge émis par la Terre. Lesquels de ces gaz ont
      ce rôle ?
    methode: Pense aux gaz produits par les combustions, par l'élevage et par l'évaporation de l'eau.
    etape: Le diazote et le dioxygène forment presque tout l'air, mais ils n'absorbent presque pas l'infrarouge. Regarde les
      trois autres.
  pieges:
  - si:
      contient:
      - b
    relance: Le diazote est le gaz le plus abondant de l'air, mais absorbe-t-il le rayonnement infrarouge de la Terre ?
  - si:
      contient:
      - e
    relance: Le dioxygène est indispensable pour respirer, mais est-ce un gaz à effet de serre ?
  - si:
      diagnostic: incomplet
    relance: Il en manque. Pense aussi au gaz qui forme les nuages quand il se condense.
  solution: Le dioxyde de carbone, la vapeur d'eau et le méthane sont des gaz à effet de serre. Le diazote et le dioxygène,
    les deux gaz principaux de l'air, n'en sont pas.
- id: etapes-effet-de-serre
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes de l'effet de serre.
  reponse:
    elements:
    - id: a
      texte: Le Soleil émet un rayonnement, surtout de la lumière visible.
    - id: b
      texte: Le sol absorbe ce rayonnement et s'échauffe.
    - id: c
      texte: Le sol chaud émet un rayonnement infrarouge vers l'atmosphère.
    - id: d
      texte: Les gaz à effet de serre absorbent une partie de ce rayonnement infrarouge.
    - id: e
      texte: L'atmosphère renvoie une partie de cette énergie vers le sol, qui se réchauffe davantage.
  indices:
    relance: D'où vient toute l'énergie au départ ?
    methode: Suis l'énergie comme un voyageur, de sa source jusqu'à son retour au sol.
    etape: Tout commence avec le Soleil, puis le sol reçoit son rayonnement. Que fait ensuite le sol une fois chaud ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Tu y es presque, deux étapes voisines sont échangées. Les gaz peuvent-ils absorber un rayonnement que le sol
      n'a pas encore émis ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par la source d'énergie, puis ce qui la reçoit en premier. Termine par ce qui revient vers le sol.
  solution: Le Soleil émet un rayonnement, le sol l'absorbe et s'échauffe, le sol chaud émet un rayonnement infrarouge, les
    gaz à effet de serre en absorbent une partie, puis l'atmosphère renvoie une partie de cette énergie vers le sol.
- id: recepteurs-rayonnement
  type: association
  difficulte: 2
  enonce: Chaque dispositif absorbe ou émet un rayonnement. Associe-le à la conversion d'énergie qu'il réalise. Réponds par
    des paires, par exemple a-1.
  reponse:
    gauche:
    - id: a
      texte: un panneau solaire photovoltaïque
    - id: b
      texte: un chauffe-eau solaire
    - id: c
      texte: une feuille de plante (photosynthèse)
    - id: d
      texte: une lampe allumée
    droite:
    - id: '1'
      texte: énergie lumineuse convertie en énergie électrique
    - id: '2'
      texte: énergie lumineuse convertie en énergie thermique
    - id: '3'
      texte: énergie lumineuse convertie en énergie chimique
    - id: '4'
      texte: énergie électrique convertie en énergie lumineuse et thermique
    paires:
      a: '1'
      b: '2'
      c: '3'
      d: '4'
  indices:
    relance: Lequel de ces dispositifs émet un rayonnement au lieu d'en absorber un ?
    methode: Pour chaque dispositif, demande-toi ce qu'il produit d'utile, du courant, de l'eau chaude, de la matière, ou
      de la lumière.
    etape: Le panneau photovoltaïque alimente des appareils électriques. Le chauffe-eau solaire chauffe de l'eau. Continue
      avec les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule paire est fausse. Qu'est-ce que la plante fabrique grâce à la lumière ?
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs paires sont fausses. Ne confonds pas le panneau photovoltaïque (qui produit du courant) et le chauffe-eau
      solaire (qui chauffe de l'eau).
  solution: a-1 (le photovoltaïque produit de l'électricité), b-2 (le chauffe-eau solaire chauffe l'eau), c-3 (la plante fabrique
    de la matière, énergie chimique), d-4 (la lampe reçoit de l'énergie électrique et émet de la lumière, en chauffant).
- id: vrai-sur-rayonnement
  type: choix
  difficulte: 1
  enonce: Parmi ces affirmations, lesquelles sont vraies ?
  reponse:
    options:
    - id: a
      texte: Le rayonnement du Soleil traverse le vide de l'espace pour arriver sur Terre.
    - id: b
      texte: Un objet qui absorbe un rayonnement reçoit de l'énergie.
    - id: c
      texte: L'effet de serre est uniquement causé par les activités humaines.
    - id: d
      texte: Sans aucun effet de serre, la Terre serait beaucoup plus froide.
    bonnes:
    - a
    - b
    - d
  indices:
    relance: Entre le Soleil et la Terre, y a-t-il de l'air ?
    methode: Pour chaque phrase, demande-toi si elle est vraie tout le temps, ou seulement en partie.
    etape: L'effet de serre existait déjà bien avant l'apparition des humains, grâce à la vapeur d'eau et au CO₂ naturel.
      Relis les autres phrases avec cette idée.
  pieges:
  - si:
      contient:
      - c
    relance: Les humains renforcent l'effet de serre. Mais existait-il avant eux ?
  - si:
      diagnostic: incomplet
    relance: Il manque une affirmation vraie. Relis chaque phrase sur l'énergie et sur le vide.
  solution: a, b et d sont vraies. Le rayonnement se propage dans le vide ; absorber un rayonnement, c'est recevoir de l'énergie
    ; l'effet de serre est naturel (sans lui, environ −18 °C en moyenne), les humains ne font que le renforcer.
- id: expliquer-rechauffement
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi l'augmentation de la quantité de dioxyde de carbone dans l'atmosphère, due aux combustions de
    charbon, de pétrole et de gaz, entraîne une hausse de la température moyenne de la Terre.
  criteres:
  - L'élève explique que le sol, chauffé par le Soleil, émet un rayonnement infrarouge.
  - L'élève dit que le dioxyde de carbone est un gaz à effet de serre qui absorbe une partie de ce rayonnement infrarouge
    et renvoie de l'énergie vers le sol.
  - L'élève conclut que plus il y a de dioxyde de carbone, plus l'effet de serre est fort, donc plus la Terre se réchauffe.
  indices:
    relance: Quel rayonnement la Terre émet-elle, et que lui fait le dioxyde de carbone ?
    methode: 'Suis l''énergie : Soleil, sol, rayonnement infrarouge, gaz de l''atmosphère. Puis demande-toi ce qui change
      quand il y a plus de CO₂.'
    etape: Le sol chauffé par le Soleil émet un rayonnement infrarouge. Le CO₂ en absorbe une partie. Que se passe-t-il s'il
      y a davantage de CO₂ ?
  solution: 'Le sol, chauffé par le rayonnement solaire, émet un rayonnement infrarouge. Le dioxyde de carbone, gaz à effet
    de serre, absorbe une partie de ce rayonnement et renvoie de l''énergie vers le sol. Les combustions ajoutent du CO₂ dans
    l''air : une plus grande part du rayonnement infrarouge est absorbée, l''effet de serre se renforce et la température
    moyenne de la Terre augmente.'
- id: forme-energie-recue
  type: texte_court
  difficulte: 1
  enonce: Une plaque de métal noire est posée en plein soleil. Elle absorbe le rayonnement du Soleil et devient brûlante.
    Sous quelle forme d'énergie l'énergie reçue est-elle surtout convertie ? Réponds par un seul adjectif.
  reponse:
    acceptees:
    - thermique
    - energie thermique
    fautes_tolerees: 1
  indices:
    relance: 'Que constates-tu quand tu touches la plaque : que devient sa température ?'
    methode: Une énergie liée à la température d'un objet porte un nom qui vient du grec « therme », la chaleur.
    etape: Le mot commence par « ther » et se termine par « ique ». Complète.
  pieges:
  - si:
      valeur: electrique
    relance: L'énergie électrique est produite par un panneau photovoltaïque, pas par une simple plaque qui chauffe.
  - si:
      diagnostic: mauvaise_reponse
    relance: La plaque s'échauffe. Quelle forme d'énergie est associée à l'échauffement d'un objet ?
  solution: 'La plaque absorbe le rayonnement : elle reçoit de l''énergie, convertie en énergie thermique. C''est pour cela
    qu''elle s''échauffe.'
- id: ecart-effet-de-serre
  type: nombre
  difficulte: 2
  enonce: Sans effet de serre, la température moyenne de la Terre serait d'environ −18 °C. Avec l'effet de serre naturel,
    elle est d'environ +15 °C. De combien de degrés l'effet de serre naturel réchauffe-t-il la Terre ? Écris seulement le
    nombre.
  reponse:
    valeur: 33
    forme: libre
  indices:
    relance: Il faut trouver l'écart entre deux températures, l'une négative et l'autre positive.
    methode: Écart = température la plus haute − température la plus basse. Attention au signe moins d'un des nombres.
    etape: 'Écris le calcul : 15 − (−18). Retire les parenthèses en changeant le signe, puis calcule.'
  pieges:
  - si:
      valeur: -3
    relance: 'Tu as additionné +15 et −18 : ce n''est pas un écart. Combien de degrés faut-il monter pour aller de −18 °C
      à +15 °C ?'
  - si:
      valeur: 3
    relance: Tu as soustrait sans tenir compte du signe. Pour aller de −18 à 0, combien de degrés ? Puis de 0 à +15 ?
  solution: Écart = 15 − (−18) = 15 + 18 = 33. L'effet de serre naturel réchauffe la Terre d'environ 33 °C.
- id: nblm-comment-l-energie-du-soleil-parvient-ell-1
  type: choix
  difficulte: 2
  enonce: Comment l'énergie du Soleil parvient-elle jusqu'à la Terre à travers l'espace ?
  reponse:
    options:
    - id: o1
      texte: Par un rayonnement qui n'a pas besoin de matière pour se propager dans le vide.
    - id: o2
      texte: Par conduction thermique en réchauffant progressivement l'air de l'espace.
    - id: o3
      texte: Par des vibrations sonores de grande fréquence émises par le Soleil.
    - id: o4
      texte: Par un déplacement d'air chaud poussé du Soleil vers la surface terrestre.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux caractéristiques du milieu situé entre le Soleil et la Terre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur : l''espace entre le Soleil et la Terre est vide, il n''y a pas de matière ni d''air pour
      conduire la chaleur.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : le son nécessite un milieu matériel pour se propager et ne peut pas voyager dans le vide.'
  - si:
      contient:
      - o4
    relance: 'C''est inexact : l''énergie voyage sous forme de rayonnement électromagnétique à travers le vide, et non par
      mouvement de matière.'
  solution: 'Par un rayonnement qui n''a pas besoin de matière pour se propager dans le vide. C''est exact : un rayonnement
    transporte de l''énergie et peut traverser le vide entre le Soleil et la Terre.'
- id: nblm-quel-type-de-rayonnement-est-emis-par-le-2
  type: choix
  difficulte: 2
  enonce: Quel type de rayonnement est émis par le sol une fois qu'il a été chauffé par le Soleil ?
  reponse:
    options:
    - id: o1
      texte: Un rayonnement infrarouge, invisible pour nos yeux.
    - id: o2
      texte: Un rayonnement ultraviolet très intense.
    - id: o3
      texte: De la lumière visible verte intense.
    - id: o4
      texte: Des rayons X qui traversent l'atmosphère.
    bonnes:
    - o1
  indices:
    relance: Pense au rayonnement thermique invisible émis par le sol à sa température.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur : les ultraviolets proviennent principalement du Soleil, tandis que le sol chauffé émet de
      l''infrarouge.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : le rayonnement émis par le sol terrestre à sa température habituelle est invisible à l''œil humain.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : les rayons X sont très énergétiques et ne sont pas émis par le sol chauffé.'
  solution: 'Un rayonnement infrarouge, invisible pour nos yeux. C''est correct : la Terre émet un rayonnement infrarouge
    lorsqu''elle est chauffée par le Soleil.'
- id: nblm-que-se-passe-t-il-lorsqu-un-objet-effect-3
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il lorsqu'un objet effectue l'absorption du rayonnement ?
  reponse:
    options:
    - id: o1
      texte: Il reçoit de l'énergie et, souvent, il s'échauffe.
    - id: o2
      texte: Il cède de l'énergie à l'émetteur du rayonnement.
    - id: o3
      texte: Il perd immédiatement toute sa chaleur.
    - id: o4
      texte: Il réfléchit l'intégralité de l'énergie sans la conserver.
    bonnes:
    - o1
  indices:
    relance: Considère le bilan énergétique d'un récepteur qui capte un rayonnement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur : c''est l''objet qui émet le rayonnement qui cède de l''énergie, alors que celui qui l''absorbe
      en reçoit.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : recevoir de l''énergie par absorption entraîne un échauffement et non un refroidissement.'
  - si:
      contient:
      - o4
    relance: 'C''est inexact : absorber signifie emmagasiner l''énergie reçue, contrairement à la réflexion.'
  solution: 'Il reçoit de l''énergie et, souvent, il s''échauffe. C''est exact : l''objet qui absorbe un rayonnement reçoit
    de l''énergie, ce qui provoque généralement une hausse de température.'
- id: nblm-quels-sont-les-principaux-gaz-de-l-atmos-4
  type: choix
  difficulte: 2
  enonce: Quels sont les principaux gaz de l'atmosphère qui absorbent le rayonnement infrarouge terrestre ?
  reponse:
    options:
    - id: o1
      texte: La vapeur d'eau, le dioxyde de carbone (CO₂) et le méthane (CH₄).
    - id: o2
      texte: Le dioxygène (O₂) et le diazote (N₂).
    - id: o3
      texte: L'hélium et l'argon.
    - id: o4
      texte: Le monoxyde de carbone et le dihydrogène.
    bonnes:
    - o1
  indices:
    relance: Cherche la catégorie des gaz capables de retenir l'énergie rayonnée par la Terre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : bien qu''ultramajoritaires dans l''air, le dioxygène et le diazote ne sont pas
      des gaz à effet de serre.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : ces gaz rares n''interviennent pas dans l''absorption du rayonnement infrarouge terrestre.'
  - si:
