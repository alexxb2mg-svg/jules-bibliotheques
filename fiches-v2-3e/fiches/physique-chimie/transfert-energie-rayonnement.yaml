      - o4
    relance: 'C''est incorrect : ces gaz ne constituent pas les principaux gaz à effet de serre atmosphériques.'
  solution: 'La vapeur d''eau, le dioxyde de carbone (CO₂) et le méthane (CH₄). C''est exact : ce sont des gaz à effet de
