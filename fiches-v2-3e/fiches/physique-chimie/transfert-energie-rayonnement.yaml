format: 2
notion: transfert-energie-rayonnement
version: 1
etat: verifiee
declencheurs:
- rayonnement infrarouge terrestre
- réchauffement de l'atmosphère
- gaz à effet de serre qui absorbent
- chaleur reçue du Soleil
- renforcement de l'effet de serre
- longueur d'onde et fréquence
prerequis:
- formes-energie
essentiel: 'Un rayonnement (lumière, infrarouge...) transporte de l''énergie : quand un objet absorbe un rayonnement, il reçoit
  de l''énergie (souvent convertie en chaleur) ; quand il en émet un, il perd de l''énergie.


  Le Soleil émet un rayonnement qui traverse l''atmosphère et réchauffe la surface de la Terre ; en retour, la Terre réchauffée
  émet elle-même un rayonnement, principalement infrarouge (invisible, de grande longueur d''onde).


  Les gaz à effet de serre présents dans l''atmosphère (dioxyde de carbone, méthane, vapeur d''eau...) absorbent une partie
  de ce rayonnement infrarouge émis par la Terre, au lieu de le laisser repartir vers l''espace, et en réémettent une partie
  vers le sol : c''est l''effet de serre, qui réchauffe l''atmosphère.


  L''effet de serre naturel est indispensable à la vie sur Terre (sans lui, la température moyenne serait bien plus basse)
  ; le problème actuel vient de son renforcement par les activités humaines, qui augmentent la concentration de gaz à effet
  de serre.


  Chaque type de rayonnement est caractérisé par une longueur d''onde (ou une fréquence) : plus la longueur d''onde est grande,
  plus la fréquence est faible, et inversement.'
methode:
- Distinguer le rayonnement reçu du Soleil (plutôt visible) et le rayonnement réémis par la Terre (infrarouge).
- Retenir que les gaz à effet de serre absorbent le rayonnement infrarouge terrestre plutôt que de le laisser s'échapper vers
  l'espace.
- Ne pas confondre effet de serre naturel (indispensable) et son renforcement par les activités humaines (problème actuel).
- 'Relier fréquence et longueur d''onde : elles varient en sens inverse l''une de l''autre.'
vocabulaire:
- terme: effet de serre
  definition: phénomène par lequel les gaz à effet de serre absorbent et réémettent une partie du rayonnement infrarouge terrestre,
    réchauffant l'atmosphère
- terme: rayonnement
  definition: transport d'énergie sous forme d'ondes (lumière, infrarouge...), sans transport de matière
erreurs_frequentes:
- Croire que l'effet de serre est en lui-même un phénomène nouveau ou anormal (c'est son renforcement récent qui pose problème).
- Penser que les gaz à effet de serre bloquent la lumière du Soleil (ils absorbent surtout le rayonnement infrarouge réémis
  par la Terre).
- Confondre effet de serre et trou dans la couche d'ozone (deux phénomènes différents).
- Croire qu'un objet chaud n'émet un rayonnement que s'il est incandescent (tout corps chaud émet un rayonnement infrarouge,
  même invisible).
exemple:
  enonce: Pourquoi la nuit, sans nuages, la température baisse-t-elle davantage que sous un ciel nuageux ?
  solution: Le sol réchauffé pendant la journée réémet un rayonnement infrarouge la nuit. Sans nuages (ni gaz à effet de serre
    en quantité suffisante pour le retenir), ce rayonnement s'échappe plus facilement vers l'espace, ce qui refroidit davantage
    la surface.
exercices:
- id: rayonnement-emis-terre
  type: choix
  difficulte: 1
  enonce: Le rayonnement émis par la Terre vers l'espace est-il surtout de la lumière visible ou du rayonnement infrarouge
    ?
  reponse:
    options:
    - id: a
      texte: surtout du rayonnement infrarouge
    - id: b
      texte: surtout de la lumière visible
    - id: c
      texte: surtout des rayons X
    bonnes:
    - a
  indices:
    relance: Compare la température de la Terre à celle du Soleil.
    methode: Plus un corps est chaud, plus il émet un rayonnement de fréquence élevée ; la Terre est bien plus froide que
      le Soleil.
    etape: La Terre n'est pas assez chaude pour émettre beaucoup de lumière visible, contrairement au Soleil.
  pieges:
  - si:
      contient:
      - b
    relance: La lumière visible est surtout émise par des corps très chauds comme le Soleil ; la Terre, bien plus froide,
      émet un autre type de rayonnement.
  - si:
      contient:
      - c
    relance: Les rayons X sont émis par des phénomènes bien plus énergétiques que le rayonnement d'une planète comme la Terre.
  solution: C'est surtout du rayonnement infrarouge (la Terre n'est pas assez chaude pour émettre beaucoup de lumière visible).
- id: expliquer-renforcement-co2
  type: texte_court
  difficulte: 2
  enonce: Quel gaz, dont la concentration augmente avec les activités humaines, absorbe le rayonnement infrarouge terrestre
    et renforce le réchauffement climatique ?
  reponse:
    acceptees:
    - dioxyde de carbone
    - co2
    - gaz carbonique
    fautes_tolerees: 1
  indices:
    relance: C'est un gaz à effet de serre émis notamment par les combustions (moteurs, centrales).
    methode: 'Son nom est aussi son symbole chimique : deux lettres et un chiffre.'
    etape: Il est composé de carbone et d'oxygène, avec deux atomes d'oxygène pour un de carbone.
  pieges:
  - si:
      valeur: vapeur d'eau
    relance: La vapeur d'eau est aussi un gaz à effet de serre naturel, mais ce n'est pas celui dont la concentration augmente
      principalement à cause des activités humaines récentes.
  solution: Le dioxyde de carbone (CO2) absorbe le rayonnement infrarouge terrestre et sa concentration croissante, due aux
    activités humaines, renforce le réchauffement climatique.
- id: frequence-infrarouge-visible
  type: choix
  difficulte: 2
  enonce: Un rayonnement de longueur d'onde 10 micromètres (infrarouge) a-t-il une fréquence plus grande ou plus petite qu'un
    rayonnement de longueur d'onde 500 nanomètres (lumière visible) ?
  reponse:
    options:
    - id: a
      texte: une fréquence plus petite
    - id: b
      texte: une fréquence plus grande
    - id: c
      texte: exactement la même fréquence
    bonnes:
    - a
  indices:
    relance: Fréquence et longueur d'onde varient en sens inverse.
    methode: 10 micromètres est une longueur d'onde bien plus grande que 500 nanomètres.
    etape: 'Si la longueur d''onde augmente, la fréquence diminue : que peux-tu en conclure pour l''infrarouge par rapport
      au visible ?'
  pieges:
  - si:
      contient:
      - b
    relance: Souviens-toi que longueur d'onde et fréquence varient toujours en sens inverse l'une de l'autre.
  - si:
      contient:
      - c
    relance: Les deux longueurs d'onde sont très différentes (10 micromètres contre 500 nanomètres), leurs fréquences ne peuvent
      pas être égales.
  solution: 'Sa fréquence est plus petite : plus la longueur d''onde est grande, plus la fréquence est faible (l''infrarouge
    a une fréquence plus faible que la lumière visible).'
- id: expliquer-effet-serre-naturel
  type: ouverte
  difficulte: 3
  enonce: Explique en quoi l'effet de serre naturel est indispensable à la vie sur Terre, et pourquoi son renforcement actuel
    pose problème.
  criteres:
  - L'élève explique que l'effet de serre naturel retient une partie du rayonnement infrarouge terrestre, maintenant une température
    moyenne compatible avec la vie.
  - L'élève distingue l'effet de serre naturel (indispensable) de son renforcement récent par les activités humaines.
  - L'élève relie l'augmentation de la concentration en gaz à effet de serre à un réchauffement supplémentaire de l'atmosphère.
  indices:
    relance: Que se passerait-il si aucun gaz à effet de serre n'existait dans l'atmosphère ?
    methode: Distingue le phénomène naturel, ancien et utile, de son renforcement récent par l'humain.
    etape: Commence par expliquer ce que fait l'effet de serre naturel pour la température de la Terre.
  solution: L'effet de serre naturel retient une partie du rayonnement infrarouge émis par la Terre grâce aux gaz à effet
    de serre présents naturellement dans l'atmosphère, ce qui maintient une température moyenne suffisante pour la vie (sans
    lui, elle serait bien plus basse). Le problème actuel vient du renforcement de cet effet par les activités humaines, qui
    augmentent la concentration de gaz à effet de serre (notamment le dioxyde de carbone), ce qui retient davantage de rayonnement
    infrarouge et réchauffe l'atmosphère au-delà de son équilibre naturel.
