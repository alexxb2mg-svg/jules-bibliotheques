  solution: 'Elles libèrent du CO₂ qui augmente l''effet de serre en piégeant davantage d''infrarouges. C''est correct : l''excès
    de CO₂ renforce l''effet de serre naturel, augmentant la température moyenne de la Terre.'
- id: nblm-quelles-affirmations-concernant-l-effet-6
  type: choix
  difficulte: 3
  enonce: Quelles affirmations concernant l'effet de serre et les rayonnements sont exactes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'effet de serre est un phénomène naturel indispensable à la vie sur Terre.
    - id: o2
      texte: Les gaz à effet de serre absorbent principalement le rayonnement infrarouge émis par la Terre.
    - id: o3
      texte: L'effet de serre est un phénomène entièrement créé par les activités humaines.
    - id: o4
      texte: Les gaz à effet de serre absorbent principalement la lumière visible du Soleil.
    bonnes:
    - o1
    - o2
  indices:
    relance: Coche les deux propositions qui décrivent correctement l'origine naturelle et le mécanisme de l'effet de serre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est une erreur fréquente : l''effet de serre existe naturellement ; l''activité humaine ne fait que le renforcer.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : ils laissent passer la lumière solaire visible et absorbent le rayonnement infrarouge terrestre.'
  solution: 'L''effet de serre est un phénomène naturel indispensable à la vie sur Terre ; Les gaz à effet de serre absorbent
    principalement le rayonnement infrarouge émis par la Terre. C''est exact : sans effet de serre naturel, la température
    moyenne terrestre serait d''environ −18 °C au lieu de +15 °C.'
