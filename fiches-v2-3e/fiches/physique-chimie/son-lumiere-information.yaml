format: 2
notion: son-lumiere-information
version: 1
etat: verifiee
declencheurs:
- signal transportant une information
- fibre optique et internet
- signal analogique ou numérique
- alarme sonore qui alerte
- code Morse par flash lumineux
- communication longue distance
prerequis:
- propagation-lumiere
- propagation-son-frequence
essentiel: 'Un signal est une variation (de son, de lumière, de courant électrique...) utilisée pour transporter une information
  d''un émetteur vers un récepteur.


  Le son et la lumière peuvent tous deux servir de support à un signal : la voix (son) transporte un message dans une conversation,
  un flash lumineux peut coder un message (code Morse, fibre optique).


  Un signal peut être analogique (il varie de façon continue, comme le son d''une voix) ou numérique (codé sous forme de nombres,
  de 0 et de 1, comme dans les communications informatiques modernes).


  La lumière (utilisée en fibre optique) permet de transporter énormément d''informations sur de longues distances à très
  grande vitesse, car elle se propage beaucoup plus vite que le son et subit moins de perturbations sur de longs trajets.


  Choisir le son ou la lumière comme support dépend du besoin : le son se propage dans l''air sur de courtes distances (voix,
  alarme sonore), la lumière permet des communications rapides sur de longues distances (téléphone, internet).'
methode:
- Identifie l'émetteur, le signal utilisé (son ou lumière) et le récepteur dans une situation de communication.
- Distingue signal analogique (variation continue) et signal numérique (codé en 0 et 1).
- Compare les vitesses de propagation du son et de la lumière pour comprendre pourquoi la lumière est privilégiée pour les
  communications longue distance.
- Relie un exemple concret (téléphone, alarme, fibre optique) au type de signal utilisé.
vocabulaire:
- terme: signal
  definition: variation (de son, de lumière, de courant électrique...) utilisée pour transporter une information
- terme: signal analogique
  definition: signal qui varie de façon continue, comme le son d'une voix
- terme: signal numérique
  definition: signal codé sous forme de nombres, de 0 et de 1
erreurs_frequentes:
- Croire qu'un signal transporte de la matière plutôt que de l'information.
- Confondre signal analogique et signal numérique.
- Penser que le son est aussi efficace que la lumière pour communiquer sur de longues distances.
- Oublier que le son a besoin d'un milieu matériel, contrairement à la lumière qui traverse aussi le vide.
exemple:
  enonce: Pourquoi les communications à très longue distance (internet international) utilisent-elles des câbles à fibre optique
    (lumière) plutôt que des signaux sonores ?
  solution: La lumière se propage beaucoup plus vite que le son et peut parcourir de très longues distances (même sous l'océan)
    sans avoir besoin d'un support matériel qui l'atténuerait comme le ferait l'air pour le son ; elle permet de transporter
    énormément d'informations rapidement.
exercices:
- id: signal-alarme
  type: choix
  difficulte: 1
  enonce: Une sirène d'alarme utilise-t-elle un signal sonore ou lumineux ? Pourquoi ce choix pour une alarme ?
  reponse:
    options:
    - id: a
      texte: un signal sonore, car il se propage dans toutes les directions et peut être perçu sans regarder la source
    - id: b
      texte: un signal lumineux, car la lumière est toujours plus rapide que le son
    - id: c
      texte: un signal sonore, car le son ne peut jamais être numérique
    bonnes:
    - a
  indices:
    relance: Pense à ce qui alerte même si on ne regarde pas dans la bonne direction.
    methode: Une alarme doit être perçue rapidement par tout le monde autour, sans qu'il faille regarder vers elle.
    etape: Le son se propage dans toutes les directions autour de sa source, contrairement à un flash lumineux ponctuel.
  pieges:
  - si:
      contient:
      - b
    relance: 'La rapidité de la lumière n''est pas la raison principale du choix pour une alarme : ce qui compte, c''est que
      le signal soit perçu dans toutes les directions.'
  - si:
      contient:
      - c
    relance: Le son peut tout à fait être numérique (comme dans un fichier audio) ; ce n'est pas la raison du choix pour une
      alarme.
  solution: 'Un signal sonore : il se propage dans toutes les directions et peut être perçu même sans regarder la source,
    ce qui est utile pour alerter rapidement.'
- id: rapport-vitesses
  type: nombre
  difficulte: 2
  enonce: La vitesse de la lumière est environ 300 000 000 m/s, celle du son environ 340 m/s. Environ combien de fois la lumière
    va-t-elle plus vite que le son ? (arrondis au millier près)
  reponse:
    valeur: 882000
    forme: entier
    tolerance: 5000
  indices:
    relance: Quelle opération permet de comparer deux vitesses par un rapport ?
    methode: Divise la vitesse de la lumière par celle du son.
    etape: Pose la division vitesse de la lumière sur vitesse du son, et arrondis le résultat.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta division de la vitesse de la lumière par la vitesse du son.
  solution: 300 000 000 / 340 est environ égal à 882 000 fois plus vite.
- id: definir-signal-numerique
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un signal codé sous forme de 0 et de 1, utilisé par les appareils informatiques modernes ?
  reponse:
    acceptees:
    - signal numérique
    - numérique
    fautes_tolerees: 1
  indices:
    relance: Ce n'est pas le signal qui varie de façon continue, comme la voix.
    methode: Ce type de signal est codé avec seulement deux valeurs possibles.
    etape: Les ordinateurs et smartphones utilisent ce type de codage en binaire.
  pieges:
  - si:
      valeur: signal analogique
    relance: Le signal analogique varie de façon continue (comme la voix), ce n'est pas celui codé en 0 et en 1.
  solution: C'est le signal numérique, codé en 0 et en 1.
- id: expliquer-choix-fibre-optique
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi la lumière (via la fibre optique) est préférée au son pour les communications à très longue distance,
    comme l'internet international.
  criteres:
  - L'élève rappelle que la lumière se propage beaucoup plus vite que le son.
  - L'élève explique que la lumière peut voyager sur de longues distances (même sous l'océan) sans avoir besoin d'un milieu
    qui l'atténuerait comme le fait l'air pour le son.
  - L'élève relie ces deux avantages à la possibilité de transporter énormément d'informations rapidement sur de longues distances.
  indices:
    relance: Compare les vitesses de propagation de la lumière et du son sur une très longue distance.
    methode: Pense aussi à ce qui limite la propagation du son (besoin d'un milieu matériel, atténuation) par rapport à la
      lumière.
    etape: Commence par rappeler que la lumière est bien plus rapide que le son.
  solution: La lumière se propage beaucoup plus vite que le son (environ 300 000 000 m/s contre environ 340 m/s), ce qui permet
    de transmettre l'information presque instantanément même sur de très longues distances. De plus, la lumière guidée dans
    une fibre optique peut parcourir des milliers de kilomètres, y compris sous l'océan, sans avoir besoin d'un milieu matériel
    comme l'air qui atténuerait un signal sonore. Ces deux avantages permettent à la fibre optique de transporter énormément
    d'informations rapidement sur de longues distances, ce que le son ne pourrait pas faire aussi efficacement.
