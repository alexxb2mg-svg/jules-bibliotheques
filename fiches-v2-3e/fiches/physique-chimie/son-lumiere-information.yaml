format: 2
notion: son-lumiere-information
version: 2
etat: verifiee
declencheurs:
- code morse
- émetteur et récepteur
- signal lumineux
- signal sonore
- fibre optique
- chaîne de transmission
- porter un message
- lumière et son
- transmettre une information
prerequis:
- propagation-lumiere
- propagation-son-frequence
essentiel: 'Un signal permet de transmettre une information à distance. Le son et la lumière peuvent servir de signal.


  Une transmission comporte trois éléments :

  - un émetteur, qui produit le signal (sifflet, lampe, sirène, haut-parleur) ;

  - un milieu, dans lequel le signal se propage ;

  - un récepteur, qui reçoit le signal (oreille, œil, micro, capteur).


  L''ordre est toujours : émission, propagation, réception, puis compréhension.


  Pour que l''information soit comprise, émetteur et récepteur utilisent le même code : le rythme des éclats d''un phare,
  les couleurs d''un feu tricolore, les points et les traits du code Morse. Sans code partagé, le signal ne transmet rien.


  Un signal sonore a besoin d''un milieu matériel et va à environ 340 m/s dans l''air. Il ne traverse pas le vide. Un signal
  lumineux peut traverser le vide et va beaucoup plus vite : environ 300 000 km/s. Dans la vie courante, la lumière arrive
  donc presque instantanément, alors que le son met du temps. C''est pour cela qu''on voit l''éclair avant d''entendre le
  tonnerre. Pour trouver la durée d''un son : t = d ÷ v. Pour trouver la distance : d = v × t.


  On peut aussi transmettre une information par des impulsions de lumière dans une fibre optique : elle guide la lumière et
  transporte les données d''Internet.


  Le signal peut être sonore (sirène, voix) ou lumineux (feu, phare, fibre optique). Le choix dépend de la situation : la
  nuit ou de loin, on préfère la lumière ; dans le noir ou derrière un obstacle, le son peut passer.


  Au brevet, on attend que tu identifies émetteur, signal et récepteur dans une situation, que tu justifies le choix du signal
  et que tu calcules une durée ou une distance.

  '
methode:
- Repérer l'émetteur, le signal (sonore ou lumineux) et le récepteur.
- Repérer le code qui donne son sens au signal.
- 'Choisir le signal adapté : le son ne traverse pas le vide, la lumière va plus vite.'
- 'Pour un décalage entre son et lumière : la lumière arrive presque tout de suite, on calcule seulement la durée du son avec
  t = d ÷ v.'
- 'Pour une distance à partir d''une durée : d = v × t, avec v en m/s et t en s.'
- 'Présenter la chaîne dans l''ordre : émission, propagation, réception, compréhension du code.'
vocabulaire:
- terme: signal
  definition: son, lumière ou autre phénomène qui transporte une information d'un émetteur à un récepteur.
- terme: émetteur
  definition: ce qui produit le signal.
- terme: code
  definition: règle connue de l'émetteur et du récepteur qui donne un sens au signal.
- terme: récepteur
  definition: ce qui reçoit le signal (œil, oreille, micro, capteur).
- terme: information
  definition: message que le signal permet de transmettre.
- terme: fibre optique
  definition: fil de verre ou de plastique qui guide la lumière pour transporter des données.
erreurs_frequentes:
- Croire qu'un signal sonore peut traverser le vide.
- 'Inverser émetteur et récepteur : l''œil et l''oreille reçoivent, ils n''émettent pas.'
- Oublier qu'un signal ne sert à rien sans un code partagé.
- Penser que le son et la lumière arrivent en même temps.
exemple:
  enonce: Un arbitre siffle une faute. Décris la chaîne de transmission de l'information.
  solution: 'Émetteur : le sifflet. Signal : un son, qui se propage dans l''air. Récepteur : l''oreille des joueurs. Code
    : un coup de sifflet veut dire que le jeu s''arrête.'
exercices:
- id: sonore-ou-lumineux
  type: association
  difficulte: 1
  enonce: Pour chaque situation, indique si l'information est transportée par un signal sonore ou par un signal lumineux.
  reponse:
    gauche:
    - id: a
      texte: le sifflet de l'arbitre
    - id: b
      texte: un feu tricolore
    - id: c
      texte: la sirène des pompiers
    - id: d
      texte: le phare au bord de la mer
    - id: e
      texte: la fibre optique d'Internet
    droite:
    - id: s
      texte: signal sonore
    - id: l
      texte: signal lumineux
    paires:
      a: s
      b: l
      c: s
      d: l
      e: l
  indices:
    relance: Pour chaque situation, l'information se capte-t-elle avec l'oreille ou avec l'œil ?
    methode: Si on l'entend, le signal est sonore ; si on le voit ou si c'est de la lumière qui voyage, il est lumineux.
    etape: 'Le sifflet s''entend : signal sonore. Continue avec les autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule erreur. Que transporte une fibre optique : du son ou de la lumière ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque situation en te demandant : est-ce que je l''entends, ou est-ce que je le vois ?'
  solution: 'Sonores : le sifflet et la sirène. Lumineux : le feu tricolore, le phare et la fibre optique, qui guide de la
    lumière.'
- id: nom-du-recepteur
  type: texte_court
  difficulte: 1
  enonce: Dans une chaîne de transmission, comment s'appelle ce qui reçoit le signal (l'œil, l'oreille, un micro) ?
  reponse:
    acceptees:
    - récepteur
    - le récepteur
    - un récepteur
    fautes_tolerees: 1
  indices:
    relance: Ce qui produit le signal s'appelle l'émetteur. Et ce qui le reçoit ?
    methode: Le mot vient du verbe « recevoir ».
    etape: 'Il se termine comme « émetteur » : par « -teur ».'
  pieges:
  - si:
      valeur: émetteur
    relance: L'émetteur produit le signal. L'œil produit-il de la lumière, ou la reçoit-il ?
  solution: 'C''est le récepteur : l''œil, l''oreille ou un micro reçoivent le signal envoyé par l''émetteur.'
- id: message-du-phare
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre la transmission d'une information par un phare à un marin.
  reponse:
    elements:
    - id: a
      texte: La lampe du phare s'allume et s'éteint selon un rythme.
    - id: b
      texte: La lumière se propage jusqu'au bateau.
    - id: c
      texte: L'œil du marin reçoit les éclats de lumière.
    - id: d
      texte: Le marin reconnaît le phare grâce au rythme, qu'il lit sur sa carte.
  indices:
    relance: Qui est l'émetteur et qui est le récepteur ?
    methode: 'Une transmission va toujours dans cet ordre : émission, propagation, réception, puis compréhension du code.'
    etape: Le signal est d'abord produit par la lampe du phare. Que fait ensuite la lumière ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont échangées. Le marin peut-il comprendre le message avant de le recevoir ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par l'émetteur, finis par la compréhension du code.
  solution: Émission (la lampe s'allume selon un rythme), propagation (la lumière va jusqu'au bateau), réception (l'œil du
    marin), puis interprétation grâce au code.
- id: feu-artifice
  type: nombre
  difficulte: 2
  enonce: Un feu d'artifice explose à 680 m de toi. La vitesse du son dans l'air est de 340 m/s ; la lumière arrive presque
    instantanément. Combien de secondes après avoir vu l'explosion l'entends-tu ? Écris seulement le nombre.
  reponse:
    valeur: 2
    forme: libre
  indices:
    relance: 'Lequel des deux signaux met du temps à arriver : la lumière ou le son ?'
    methode: 'Pour le son, utilise t = d ÷ v, avec d en m et v en m/s : le résultat est en secondes.'
    etape: Divise la distance par la vitesse du son dans l'air.
  pieges:
  - si:
      valeur: 231200
    relance: Tu as multiplié. Pour trouver une durée à partir d'une distance et d'une vitesse, il faut diviser.
  - si:
      valeur: 0,5
    relance: Tu as divisé la vitesse par la distance. Dans t = d ÷ v, qu'est-ce qu'on divise par quoi ?
  solution: La lumière arrive presque tout de suite. Le son met t = d ÷ v = 680 ÷ 340 = 2 s.
- id: vrai-faux-signaux
  type: choix
  difficulte: 2
  enonce: Quelles affirmations sont vraies ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: Un signal lumineux peut traverser le vide.
    - id: b
      texte: Un signal sonore peut traverser le vide.
    - id: c
      texte: Dans l'air, un signal lumineux va beaucoup plus vite qu'un signal sonore.
    - id: d
      texte: Pour comprendre le message, émetteur et récepteur doivent utiliser le même code.
    - id: e
      texte: Une information ne peut être transportée que par un fil électrique.
    bonnes:
    - a
    - c
    - d
  indices:
    relance: Pense à la lumière des étoiles, puis à un réveil sous une cloche vide d'air.
    methode: 'Rappelle-toi les vitesses : environ 340 m/s pour le son dans l''air, environ 300 000 km/s pour la lumière.'
    etape: La lumière du Soleil nous arrive à travers l'espace vide. Vérifie maintenant chaque autre phrase.
  pieges:
  - si:
      contient:
      - b
    relance: Le son a besoin de matière qui vibre pour se propager. Y en a-t-il dans le vide ?
  - si:
      contient:
      - e
    relance: Un phare ou un sifflet utilisent-ils un fil électrique ?
  - si:
      diagnostic: incomplet
    relance: Il manque au moins une affirmation vraie. Relis celle sur le code.
  solution: 'Vraies : la lumière traverse le vide ; elle va beaucoup plus vite que le son dans l''air ; émetteur et récepteur
    doivent partager le même code. Le son ne traverse pas le vide, et le son ou la lumière transportent une information sans
    fil.'
- id: inventer-un-code
  type: ouverte
  difficulte: 3
  enonce: Deux amis veulent communiquer la nuit, d'une fenêtre à l'autre, avec une lampe de poche. Propose un code simple
    pour dire « oui », « non » et « viens », et décris la chaîne de transmission.
  criteres:
  - L'élève propose un code clair (nombre ou durée des éclats) qui distingue les trois messages.
  - L'élève nomme l'émetteur (la lampe), le signal lumineux qui se propage dans l'air et le récepteur (l'œil de l'ami).
  - L'élève précise que les deux amis doivent connaître le code à l'avance.
  indices:
    relance: Avec une lampe, que peux-tu faire varier pour envoyer des messages différents ?
    methode: Décide d'un nombre d'éclats ou d'une durée pour chaque mot, puis décris qui émet, ce qui se propage et qui reçoit.
    etape: Par exemple, un éclat court pour un mot. Choisis quelque chose de différent pour les deux autres mots.
  solution: 'Exemple de code : 1 éclat = « oui », 2 éclats = « non », un éclat long = « viens ». L''émetteur est la lampe
    ; le signal lumineux se propage dans l''air ; le récepteur est l''œil de l''ami. Les deux amis doivent avoir choisi le
    code ensemble à l''avance.'
- id: nom-du-code
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la règle, connue de l'émetteur et du récepteur, qui donne un sens aux éclats de lumière ou
    aux sons ? Réponds par un seul mot.
  reponse:
    acceptees:
    - code
    - le code
    - un code
    fautes_tolerees: 1
  indices:
    relance: Sans cette règle commune, tu verrais des éclats de lumière sans savoir ce qu'ils veulent dire.
    methode: 'Le Morse, les couleurs d''un feu tricolore et le rythme d''un phare en sont des exemples : donne le nom de ce
      qu''ils ont en commun.'
    etape: Cherche dans l'essentiel la phrase qui commence par « Pour que l'information soit comprise ».
  pieges:
  - si:
      valeur: signal
    relance: Le signal est ce qui se propage (son ou lumière). On cherche la règle qui donne un sens au signal.
  - si:
      valeur: émetteur
    relance: L'émetteur produit le signal. On cherche la règle partagée qui permet de le comprendre.
  solution: 'C''est le code : émetteur et récepteur doivent le partager pour que le signal transmette une information.'
- id: distance-orage
  type: nombre
  difficulte: 2
  enonce: Lors d'un orage, tu vois l'éclair puis tu entends le tonnerre 6 secondes plus tard. La lumière arrive presque instantanément
    et le son va à 340 m/s dans l'air. À quelle distance, en mètres, l'éclair a-t-il frappé ? Écris seulement le nombre.
  reponse:
    valeur: 2040
  indices:
    relance: Le son parcourt 340 m chaque seconde. Combien de mètres parcourt-il pendant toute la durée du décalage ?
    methode: 'd = v × t, avec v en m/s et t en s : le résultat est en mètres.'
    etape: Multiplie la vitesse du son par le nombre de secondes du décalage.
  pieges:
  - si:
      valeur: 56.67
    relance: Tu as divisé la vitesse par la durée. Pour trouver une distance, il faut multiplier.
  - si:
      valeur: 346
    relance: Tu as additionné. La distance est la vitesse multipliée par la durée.
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie ta multiplication : 340 × 6.'
  solution: d = v × t = 340 × 6 = 2 040 m. L'éclair est tombé à environ 2 km.
- id: nblm-dans-une-chaine-de-transmission-d-inform-1
  type: choix
  difficulte: 2
  enonce: Dans une chaîne de transmission d'information, quel est le rôle d'un émetteur comme une sirène ou un haut-parleur
    ?
  reponse:
    options:
    - id: o1
      texte: Produire le signal qui transporte l'information.
    - id: o2
      texte: Recevoir et capter le signal envoyé.
    - id: o3
      texte: Servir de milieu matériel de propagation.
    - id: o4
      texte: Définir la règle de décodage du message.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la fonction du composant situé au tout début de la chaîne de transmission.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention à la confusion classique : capter le signal est le rôle du récepteur (comme l''oreille ou un capteur),
      pas de l''émetteur.'
  - si:
      contient:
      - o3
    relance: Faux. Le milieu de propagation est la matière (comme l'air ou l'eau) située entre l'émetteur et le récepteur.
  - si:
      contient:
      - o4
    relance: Faux. La règle de décodage correspond au code partagé, non à l'émetteur lui-même.
  solution: Produire le signal qui transporte l'information. C'est exact. L'émetteur est l'élément de la chaîne qui produit
    le signal sonore ou lumineux.
- id: nblm-quelle-est-une-propriete-fondamentale-d-2
  type: choix
  difficulte: 2
  enonce: Quelle est une propriété fondamentale d'un signal sonore lors de sa propagation ?
  reponse:
    options:
    - id: o1
      texte: Il a obligatoirement besoin d'un milieu matériel pour se propager.
    - id: o2
      texte: Il se propage dans le vide à la vitesse de 300 000 km/s.
    - id: o3
      texte: Il se déplace dans l'air à une vitesse de 300 000 km/s.
    - id: o4
      texte: Il peut voyager dans le vide spatial sans aucun support.
    bonnes:
    - o1
  indices:
    relance: Pense au support physique dont le son a absolument besoin pour voyager.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : c''est le signal lumineux qui peut traverser le vide à cette vitesse, pas le signal sonore.'
  - si:
      contient:
      - o3
    relance: 'Erreur de valeur : dans l''air, un signal sonore va à environ 340 m/s, ce qui est bien plus lent que la lumière.'
  - si:
      contient:
      - o4
    relance: Faux. Dans le vide, l'absence de matière empêche la transmission des vibrations sonores.
  solution: Il a obligatoirement besoin d'un milieu matériel pour se propager. C'est exact. Un signal sonore nécessite de
    la matière (gaz, liquide, solide) et ne peut pas se propager dans le vide.
- id: nblm-quel-composant-technologique-guide-un-si-3
  type: choix
  difficulte: 2
  enonce: Quel composant technologique guide un signal lumineux pour transporter les données d'Internet à très grande vitesse
    ?
  reponse:
    options:
    - id: o1
      texte: La fibre optique
    - id: o2
      texte: Le câble en cuivre
    - id: o3
      texte: Le haut-parleur
    - id: o4
      texte: Le tube cathodique
    bonnes:
    - o1
  indices:
    relance: Cherche le fil très fin et transparent conçu pour canaliser la lumière.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. Le câble en cuivre classique véhicule un signal électrique et non de la lumière guidée.
  - si:
      contient:
      - o3
    relance: Faux. Le haut-parleur est un émetteur de signal sonore.
  - si:
      contient:
      - o4
    relance: Faux. Ce composant ne sert pas à guider la lumière pour le réseau Internet.
  solution: La fibre optique. C'est exact. Les fibres optiques guident la lumière pour transporter les données d'Internet.
- id: nblm-pourquoi-l-emetteur-et-le-recepteur-doiv-4
  type: choix
  difficulte: 2
  enonce: Pourquoi l'émetteur et le récepteur doivent-ils utiliser un même code, comme dans le cas du code Morse (points et
    traits) ?
  reponse:
    options:
    - id: o1
      texte: Pour que l'information véhiculée par le signal puisse être comprise.
    - id: o2
      texte: Pour augmenter la vitesse de propagation du signal dans l'air.
    - id: o3
      texte: Pour permettre au signal sonore de traverser le vide.
    - id: o4
      texte: Pour transformer un signal lumineux en signal sonore.
    bonnes:
    - o1
  indices:
    relance: Pense à la condition indispensable pour que deux personnes se comprennent lors d'un échange.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. Le code donne du sens au signal, il n'accélère pas la vitesse physique de l'onde.
  - si:
      contient:
      - o3
    relance: Attention. Aucun code ne permet à un signal sonore de franchir le vide.
  - si:
      contient:
      - o4
    relance: Faux. Le code est une règle de compréhension du message, pas un convertisseur d'onde physique.
  solution: Pour que l'information véhiculée par le signal puisse être comprise. C'est exact. Un signal ne sert à rien si
    l'émetteur et le récepteur ne partagent pas un code commun pour interpréter le message.
- id: nblm-dans-l-exemple-du-sifflet-de-l-arbitre-q-5
  type: choix
  difficulte: 2
  enonce: Dans l'exemple du sifflet de l'arbitre qui indique l'arrêt du jeu, quel élément constitue le récepteur de la chaîne
    de transmission ?
  reponse:
    options:
    - id: o1
      texte: L'oreille des joueurs
    - id: o2
      texte: Le sifflet de l'arbitre
    - id: o3
      texte: L'air du terrain
    - id: o4
      texte: Le coup de sifflet
    bonnes:
    - o1
  indices:
    relance: Cherche l'organe qui reçoit et capte le signal sonore.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le sifflet produit le son, il s''agit donc de l''émetteur.'
  - si:
      contient:
      - o3
    relance: Faux. L'air est le milieu matériel dans lequel le signal se propage.
  - si:
      contient:
      - o4
    relance: Faux. Le coup de sifflet correspond au signal sonore émis.
  solution: L'oreille des joueurs. C'est exact. L'oreille des joueurs capte le signal sonore produit par le sifflet ; c'est
    le récepteur.
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations exactes concernant la comparaison entre un signal lumineux et un signal sonore
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un signal lumineux peut se propager dans le vide.
    - id: o2
      texte: Un signal lumineux se propage beaucoup plus vite qu'un signal sonore.
    - id: o3
      texte: Un signal sonore se propage dans le vide à 340 m/s.
    - id: o4
      texte: L'œil est un émetteur de signal lumineux et l'oreille un émetteur de signal sonore.
    bonnes:
    - o1
    - o2
  indices:
    relance: Réfléchis aux milieux de propagation possibles et aux vitesses respectives de ces deux signaux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur classique : le son a besoin d''un milieu matériel et ne se propage jamais dans le vide.'
  - si:
      contient:
      - o4
    relance: 'Attention à l''inversion : l''œil et l''oreille sont des récepteurs, ils capte les signaux et ne les émettent
      pas.'
  solution: Un signal lumineux peut se propager dans le vide ; Un signal lumineux se propage beaucoup plus vite qu'un signal
    sonore. C'est exact. La lumière traverse le vide contrairement au son qui a besoin de matière.
- id: nblm-dans-une-chaine-de-transmission-d-inform-7
  type: texte_court
  difficulte: 1
  enonce: Dans une chaîne de transmission d'information, le composant qui capte le signal (comme l'œil, l'oreille ou un capteur)
    est appelé le ________.
  reponse:
    acceptees:
    - récepteur
    fautes_tolerees: 1
  indices:
    relance: C'est le mot désignant l'organe ou l'appareil qui reçoit le signal.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
