format: 2
notion: acide-base-combustion-corrosion
version: 2
etat: verifiee
declencheurs:
- papier pH
- solution acide ou basique
- ions hydrogène
- combustion du méthane
- clou qui rouille
- gaz qui réchauffent la planète
- acide ou basique
- réaction acide base
- rouille du fer
- dioxyde de carbone rejeté
prerequis:
- transformation-chimique-molecules-atomes-ions
- classification-periodique
essentiel: 'Le pH d''une solution aqueuse se mesure avec du papier pH ou un pH-mètre ; il va de 0 à 14.

  - pH inférieur à 7 : solution acide (jus de citron, vinaigre) ; plus le pH est petit, plus elle est acide.

  - pH égal à 7 : solution neutre (eau pure).

  - pH supérieur à 7 : solution basique (eau savonneuse, déboucheur) ; plus le pH est grand, plus elle est basique.


  Au niveau microscopique : une solution acide contient plus d''ions hydrogène H⁺ que d''ions hydroxyde HO⁻ (aussi écrit OH⁻)
  ; une solution basique contient plus d''ions HO⁻ que d''ions H⁺ ; une solution neutre en contient autant.


  Quand on dilue une solution acide avec de l''eau, son pH augmente et se rapproche de 7. Quand on mélange une solution acide
  et une solution basique, les ions H⁺ et HO⁻ réagissent pour former de l''eau : c''est une réaction acide-base, et le pH
  se rapproche de 7. Une solution acide réagit aussi avec certains métaux (le fer, le zinc) en produisant du dihydrogène.
  Sécurité : lunettes et gants pour les acides et les bases concentrés.


  Une combustion est une transformation chimique entre un combustible (bois, carbone, méthane, essence) et un comburant, le
  dioxygène. C + O2 → CO2 ; CH4 + 2 O2 → CO2 + 2 H2O. Une combustion complète produit du dioxyde de carbone (et de l''eau
  si le combustible contient de l''hydrogène). Incomplète (manque de dioxygène), elle peut produire du monoxyde de carbone
  CO, un gaz toxique.


  La corrosion : le fer rouille en présence de dioxygène et d''eau (l''humidité) ; le sel accélère la rouille. La rouille
  est poreuse : le fer continue de s''abîmer en profondeur. On protège le fer par une peinture ou une couche de zinc.


  Gaz à effet de serre produits par des transformations chimiques : le dioxyde de carbone (combustions du bois, du charbon,
  du pétrole, du gaz), le méthane (élevage, décomposition de déchets) et le protoxyde d''azote N2O (engrais azotés). Ils renforcent
  l''effet de serre et contribuent au réchauffement climatique.


  Au brevet, on attend que tu classes une solution selon son pH, que tu relies acide et basique aux ions, et que tu identifies
  les produits d''une combustion.

  '
methode:
- 'Mesurer le pH : déposer une goutte de solution sur le papier pH avec un agitateur, comparer la couleur à l''échelle ; ou
  plonger la sonde du pH-mètre.'
- 'Comparer à 7 : en dessous acide, égal neutre, au-dessus basique.'
- 'Relier au microscopique : acide, les ions H⁺ dominent ; basique, les ions HO⁻ dominent.'
- 'Pour une combustion : identifier le combustible, le comburant (dioxygène) et les produits, puis les tester (eau de chaux
  pour le dioxyde de carbone).'
- 'Pour une corrosion : chercher si le dioxygène et l''eau sont présents tous les deux.'
- 'Pour un gaz à effet de serre : chercher s''il s''agit de dioxyde de carbone, de méthane ou de protoxyde d''azote, et d''où
  il vient.'
vocabulaire:
- terme: pH
  definition: nombre de 0 à 14 qui indique si une solution est acide, neutre ou basique.
- terme: ion hydrogène H⁺
  definition: ion présent en plus grande quantité que HO⁻ dans une solution acide.
- terme: ion hydroxyde HO⁻
  definition: ion présent en plus grande quantité que H⁺ dans une solution basique.
- terme: comburant
  definition: 'espèce qui permet la combustion : le plus souvent le dioxygène de l''air.'
- terme: gaz à effet de serre
  definition: gaz de l'atmosphère qui retient une partie de l'énergie rayonnée par la Terre (dioxyde de carbone, méthane,
    protoxyde d'azote, vapeur d'eau).
- terme: combustible
  definition: espèce qui brûle en réagissant avec le dioxygène (bois, méthane, essence).
- terme: corrosion
  definition: transformation chimique lente d'un métal en contact avec l'air et l'eau (la rouille pour le fer).
erreurs_frequentes:
- 'Croire que plus le pH est grand, plus la solution est acide : c''est l''inverse.'
- 'Croire qu''une solution acide ne contient aucun ion HO⁻ : elle en contient, mais moins que d''ions H⁺.'
- 'Penser qu''en ajoutant de l''eau à un acide son pH peut dépasser 7 : il se rapproche de 7 sans le dépasser.'
- 'Oublier que le dioxygène est un réactif de la combustion : sans lui, pas de combustion.'
- 'Croire que la rouille se forme sans eau, ou sans dioxygène : il faut les deux.'
exemple:
  enonce: Une solution a un pH de 3. On la dilue avec beaucoup d'eau. Le pH va-t-il monter ou descendre, et quelles valeurs
    peut-il atteindre ?
  solution: 'La solution est acide (3 < 7) : elle contient plus d''ions H⁺ que d''ions HO⁻. En la diluant, elle devient moins
    acide : le pH augmente et se rapproche de 7, sans le dépasser.'
exercices:
- id: caractere-selon-ph
  type: association
  difficulte: 1
  enonce: Associe chaque solution au caractère indiqué par son pH.
  reponse:
    gauche:
    - id: s1
      texte: jus de citron, pH = 2
    - id: s2
      texte: eau pure, pH = 7
    - id: s3
      texte: déboucheur, pH = 13
    - id: s4
      texte: eau de mer, pH = 8
    - id: s5
      texte: jus de tomate, pH = 4
    droite:
    - id: a
      texte: acide
    - id: b
      texte: neutre
    - id: c
      texte: basique
    paires:
      s1: a
      s2: b
      s3: c
      s4: c
      s5: a
  indices:
    relance: Quelle valeur de pH sert de frontière entre les solutions acides et les solutions basiques ?
    methode: 'Compare chaque pH à 7 : plus petit, égal ou plus grand ?'
    etape: 'Le jus de citron a un pH de 2 : 2 est plus petit que 7. Fais la même comparaison pour les autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Regarde bien les valeurs proches de 7 : 8 est-il au-dessus ou en dessous ?'
  - si:
      diagnostic: associations_fausses
    relance: As-tu inversé acide et basique ? Un pH petit correspond à quel caractère ?
  solution: 'Citron (2) : acide. Eau pure (7) : neutre. Déboucheur (13) : basique. Eau de mer (8) : basique. Jus de tomate
    (4) : acide.'
- id: ranger-par-acidite
  type: ordre
  difficulte: 2
  enonce: 'On mesure le pH de quatre solutions : A (pH 11), B (pH 2), C (pH 7), D (pH 5). Range-les de la plus acide à la
    plus basique.'
  reponse:
    elements:
    - id: b
      texte: solution B (pH 2)
    - id: d
      texte: solution D (pH 5)
    - id: c
      texte: solution C (pH 7)
    - id: a
      texte: solution A (pH 11)
  indices:
    relance: La solution la plus acide a-t-elle le pH le plus grand ou le plus petit ?
    methode: Plus le pH est petit, plus la solution est acide ; plus il est grand, plus elle est basique.
    etape: Commence par la solution au pH le plus petit, puis continue en suivant les pH qui augmentent.
  pieges:
  - si:
      valeur: a, c, d, b
    relance: 'Tu as rangé de la plus basique à la plus acide. Relis : on commence par la plus acide.'
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux solutions voisines sont inversées. Compare leurs pH.'
  - si:
      diagnostic: ordre_faux
    relance: Range simplement les pH du plus petit au plus grand.
  solution: 'Du pH le plus petit au plus grand : B (2), D (5), C (7), A (11). B est la plus acide, A la plus basique.'
- id: ions-solution-acide
  type: choix
  difficulte: 2
  enonce: Une solution a un pH de 3. Que peut-on dire de ses ions ?
  reponse:
    options:
    - id: a
      texte: Elle contient plus d'ions H⁺ que d'ions HO⁻.
    - id: b
      texte: Elle contient plus d'ions HO⁻ que d'ions H⁺.
    - id: c
      texte: Elle ne contient aucun ion HO⁻.
    - id: d
      texte: Elle contient autant d'ions H⁺ que d'ions HO⁻.
    bonnes:
    - a
  indices:
    relance: 'Un pH de 3 : la solution est-elle acide, neutre ou basique ?'
    methode: Le caractère acide est lié à l'ion H⁺, le caractère basique à l'ion HO⁻ ; ce qui compte, c'est lequel est le
      plus nombreux.
    etape: La solution est acide. Quel ion y est présent en plus grande quantité ?
  pieges:
  - si:
      contient:
      - c
    relance: Une solution acide contient-elle vraiment zéro ion HO⁻ ? Ce qui compte, c'est la comparaison entre les deux sortes
      d'ions.
  - si:
      contient:
      - d
    relance: Autant d'ions des deux sortes, c'est le cas d'une solution neutre, de pH 7. Est-ce le cas ici ?
  - si:
      contient:
      - b
    relance: Plus d'ions HO⁻, c'est une solution basique (pH au-dessus de 7). Ici le pH vaut 3.
  solution: 'Réponse a : pH 3, la solution est acide, elle contient plus d''ions H⁺ que d''ions HO⁻ (elle contient quand même
    quelques ions HO⁻).'
- id: gaz-combustion-carbone
  type: texte_court
  difficulte: 1
  enonce: La combustion complète du carbone dans le dioxygène ne forme qu'un seul produit, un gaz à effet de serre qui trouble
    l'eau de chaux. Quel est son nom ? Écris-le en toutes lettres.
  reponse:
    acceptees:
    - dioxyde de carbone
    - gaz carbonique
    fautes_tolerees: 1
  indices:
    relance: Quels atomes sont présents dans les réactifs ? Le produit est fait avec eux.
    methode: Le produit contient des atomes de carbone (venus du combustible) et d'oxygène (venus du comburant).
    etape: 'La molécule formée contient 1 atome de carbone et 2 atomes d''oxygène : quel est son nom ?'
  pieges:
  - si:
      valeur: CO2
    relance: C'est bien sa formule. Écris maintenant son nom en toutes lettres.
  - si:
      valeur: monoxyde de carbone
    relance: 'Ce gaz se forme quand la combustion est incomplète, par manque de dioxygène. Ici elle est complète : combien
      d''atomes d''oxygène dans la molécule ?'
  - si:
      valeur: CO
    relance: CO est la formule du monoxyde de carbone, formé quand il manque du dioxygène. Et on demande un nom en toutes
      lettres.
  - si:
      valeur: vapeur d'eau
    relance: Pour former de l'eau, il faut des atomes d'hydrogène. Y en a-t-il dans le carbone et le dioxygène ?
  - si:
      valeur: dioxygène
    relance: 'Le dioxygène est un réactif : il est consommé. On cherche le gaz formé.'
  solution: 'C''est le dioxyde de carbone, CO2 : C + O2 → CO2. Il trouble l''eau de chaux et c''est un gaz à effet de serre.'
- id: masse-eau-combustion-methane
  type: nombre
  difficulte: 2
  enonce: Dans une enceinte fermée, 16 g de méthane brûlent complètement avec 64 g de dioxygène (CH4 + 2 O2 → CO2 + 2 H2O).
    Il se forme 44 g de dioxyde de carbone. Quelle masse d'eau se forme-t-il, en grammes ? Écris seulement le nombre.
  reponse:
    valeur: 36
  indices:
    relance: Que sais-tu de la masse totale lors d'une transformation chimique ?
    methode: Masse des réactifs consommés = masse des produits formés. Calcule d'abord la masse totale des réactifs.
    etape: 'Les réactifs ont une masse de 16 + 64 g. Une partie devient le dioxyde de carbone : quelle masse reste-t-il pour
      l''eau ?'
  pieges:
  - si:
      valeur: 80
    relance: 'C''est la masse de tous les produits ensemble. Une partie est déjà du dioxyde de carbone : que reste-t-il pour
      l''eau ?'
  - si:
      valeur: 124
    relance: 'Tu as additionné toutes les masses. Le dioxyde de carbone est un produit, pas un réactif : il faut le soustraire.'
  - si:
      valeur: 20
    relance: As-tu utilisé la masse de dioxygène ? Les deux réactifs comptent dans la masse totale.
  solution: 'Masse des réactifs : 16 + 64 = 80 g. La masse se conserve, donc masse d''eau = 80 − 44 = 36 g.'
- id: protocole-rouille
  type: ouverte
  difficulte: 3
  enonce: Propose une expérience avec plusieurs clous en fer pour montrer que la rouille ne se forme qu'en présence à la fois
    d'eau et de dioxygène. Décris les tubes préparés et ce que tu t'attends à observer.
  criteres:
  - 'L''élève prépare au moins trois tubes où un seul facteur change à la fois : eau et air (dioxygène) ; eau sans dioxygène
    (eau bouillie recouverte d''huile) ; air sec sans eau (tube bouché avec un desséchant).'
  - L'élève prévoit que seul le clou en présence d'eau et de dioxygène rouille, après quelques jours.
  - L'élève conclut que l'eau et le dioxygène sont tous les deux nécessaires à la formation de la rouille.
  indices:
    relance: Pour savoir si un facteur est nécessaire, que faut-il comparer ?
    methode: 'Prépare plusieurs tubes identiques et ne change qu''une chose à la fois : la présence d''eau, la présence de
      dioxygène.'
    etape: 'Premier tube : un clou dans de l''eau au contact de l''air. Comment faire un tube avec de l''eau mais sans dioxygène,
      et un autre avec de l''air mais sans eau ?'
  solution: 'Tube 1 : clou dans un peu d''eau, tube ouvert (eau et dioxygène). Tube 2 : clou dans de l''eau bouillie (qui
    a perdu son dioxygène) recouverte d''une couche d''huile (pas de dioxygène). Tube 3 : clou dans de l''air sec, tube bouché
    avec un desséchant (pas d''eau). Après quelques jours, seul le clou du tube 1 a rouillé : il faut à la fois de l''eau
    et du dioxygène.'
- id: nblm-lorsqu-on-mesure-le-ph-d-un-jus-de-citro-1
  type: choix
  difficulte: 2
  enonce: Lorsqu'on mesure le pH d'un jus de citron à l'aide de papier pH, on trouve une valeur inférieure à 7. Quelle est
    la particularité des ions présents dans cette solution acide ?
  reponse:
    options:
    - id: o1
      texte: Elle contient plus d'ions hydrogène H⁺ que d'ions hydroxyde HO⁻.
    - id: o2
      texte: Elle contient uniquement des ions hydrogène H⁺ et aucun ion hydroxyde HO⁻.
    - id: o3
      texte: Elle contient plus d'ions hydroxyde HO⁻ que d'ions hydrogène H⁺.
    - id: o4
      texte: Elle ne contient ni ions hydrogène H⁺ ni ions hydroxyde HO⁻.
    bonnes:
    - o1
  indices:
    relance: Pense à l'ion prédominant dans les solutions ayant un pH inférieur à 7.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : une solution acide contient bien des ions HO⁻, mais en quantité plus faible que
      les ions H⁺.'
  - si:
      contient:
      - o3
    relance: C'est la caractéristique d'une solution basique (pH supérieur à 7), et non d'une solution acide.
  - si:
      contient:
      - o4
    relance: Toute solution aqueuse contient à la fois des ions H⁺ et des ions HO⁻ en proportions différentes.
  solution: Elle contient plus d'ions hydrogène H⁺ que d'ions hydroxyde HO⁻. Une solution acide a un pH inférieur à 7 et contient
    une majorité d'ions hydrogène H⁺ par rapport aux ions hydroxyde HO⁻.
- id: nblm-lors-de-la-combustion-complete-du-methan-2
  type: choix
  difficulte: 2
  enonce: Lors de la combustion complète du méthane CH₄ dans le dioxygène O₂, quelles sont les nouvelles espèces chimiques
    formées ?
  reponse:
    options:
    - id: o1
      texte: Le dioxyde de carbone et l'eau.
    - id: o2
      texte: Le monoxyde de carbone et le dihydrogène.
    - id: o3
      texte: Uniquement du dioxyde de carbone.
    - id: o4
      texte: Du carbone solide et du dioxygène.
    bonnes:
    - o1
  indices:
    relance: Considère les deux produits d'une combustion complète d'un composé contenant du carbone et de l'hydrogène.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le monoxyde de carbone est issu d'une combustion incomplète par manque de dioxygène, et le dihydrogène n'est
      pas produit.
  - si:
      contient:
      - o3
    relance: Le méthane contient aussi des atomes d'hydrogène qui se combinent avec l'oxygène pour former de l'eau.
  - si:
      contient:
      - o4
    relance: Le dioxygène est un réactif consommé et non un produit, tandis que le carbone solide apparaît en cas de combustion
      incomplète.
  solution: 'Le dioxyde de carbone et l''eau. La combustion complète du méthane s''écrit CH₄ + 2 O₂ → CO₂ + 2 H₂O : les produits
    formés sont le dioxyde de carbone et l''eau.'
- id: nblm-dans-quelle-situation-un-clou-en-fer-rou-3
  type: choix
  difficulte: 2
  enonce: Dans quelle situation un clou en fer rouille-t-il ?
  reponse:
    options:
    - id: o1
      texte: Lorsqu'il est en présence simultanée de dioxygène et d'eau.
    - id: o2
      texte: Lorsqu'il est placé dans de l'air parfaitement sec sans aucune humidité.
    - id: o3
      texte: Lorsqu'il est immergé dans de l'eau bouillie privée d'air et scellée.
    - id: o4
      texte: Lorsqu'il est recouvert d'une couche de peinture de protection.
    bonnes:
    - o1
  indices:
    relance: Identifie les deux réactifs de l'environnement indispensables pour former de la rouille.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : sans eau ou humidité, le fer ne peut pas rouiller.'
  - si:
      contient:
      - o3
    relance: Sans dioxygène dissous dans l'eau, la réaction de corrosion ne se produit pas.
  - si:
      contient:
      - o4
    relance: La peinture isole le fer du dioxygène et de l'eau, ce qui empêche précisément la formation de rouille.
  solution: Lorsqu'il est en présence simultanée de dioxygène et d'eau. La corrosion du fer nécessite obligatoirement la présence
    combinée d'eau et de dioxygène.
- id: nblm-on-ajoute-de-l-eau-pure-a-une-solution-a-4
  type: choix
  difficulte: 2
  enonce: On ajoute de l'eau pure à une solution acide dont le pH initial vaut 2. Comment évolue la valeur du pH lors de cette
    dilution ?
  reponse:
    options:
    - id: o1
      texte: Le pH augmente et se rapproche de 7 sans jamais le dépasser.
    - id: o2
      texte: Le pH diminue et se rapproche de 0.
    - id: o3
      texte: Le pH augmente jusqu'à dépasser 7 et rendre la solution basique.
    - id: o4
      texte: Le pH reste inchangé à la valeur de 2.
    bonnes:
    - o1
  indices:
    relance: Pense à la valeur vers laquelle tend le pH d'un acide lorsque l'on ajoute de l'eau neutre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Une baisse de pH rendrait la solution plus acide, ce qui est contraire à l'effet d'une dilution avec de l'eau.
  - si:
      contient:
      - o3
    relance: 'Penser qu''en ajoutant de l''eau pure (pH 7) le pH peut dépasser 7 est une erreur : il se rapproche de 7 sans
      le dépasser.'
  - si:
      contient:
      - o4
    relance: L'ajout d'eau diminue la concentration en ions hydrogène H⁺, ce qui modifie la valeur du pH.
  solution: 'Le pH augmente et se rapproche de 7 sans jamais le dépasser. La dilution rend la solution moins acide : le pH
    augmente progressivement vers la neutralité (pH 7).'
- id: nblm-quel-gaz-rejete-lors-de-combustions-ou-d-5
  type: choix
  difficulte: 2
  enonce: Quel gaz rejeté lors de combustions ou d'activités humaines renforce l'effet de serre et contribue au réchauffement
    climatique ?
  reponse:
    options:
    - id: o1
      texte: Le dioxyde de carbone.
    - id: o2
      texte: Le dioxygène.
    - id: o3
      texte: Le diazote.
    - id: o4
      texte: Le monoxyde de carbone.
    bonnes:
    - o1
  indices:
    relance: Cherche le gaz produit lors de la combustion complète du carbone ou du méthane.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le dioxygène est indispensable aux combustions et à la respiration, mais n'est pas un gaz à effet de serre.
  - si:
      contient:
      - o3
    relance: Le diazote constitue la majeure partie de l'air (78 %) mais ne retient pas le rayonnement infrarouge terrestre.
  - si:
      contient:
      - o4
    relance: Le monoxyde de carbone est un gaz toxique issu de combustions incomplètes, mais pas le principal gaz à effet
      de serre retenu ici.
  solution: Le dioxyde de carbone. Le dioxyde de carbone (CO₂), produit par les combustions, est un gaz à effet de serre majeur
    qui retient l'énergie rayonnée par la Terre.
- id: nblm-quelles-sont-les-deux-affirmations-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations correctes concernant les propriétés des solutions basiques et les réactions acide-base
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Une solution basique a un pH supérieur à 7 et contient plus d'ions HO⁻ que d'ions H⁺.
    - id: o2
      texte: Lors d'une réaction entre un acide et une base, les ions H⁺ et HO⁻ réagissent ensemble pour former de l'eau.
    - id: o3
      texte: Plus le pH d'une solution aqueuse est grand, plus la solution est acide.
    - id: o4
      texte: Mélanger une solution acide et une solution basique éloigne toujours le pH de la valeur 7.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux propositions qui décrivent correctement le pH des bases et la formation d'eau lors de la
      neutralisation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : plus le pH est petit, plus la solution est acide ; plus il est grand, plus elle est basique.'
  - si:
      contient:
      - o4
    relance: Au contraire, la réaction acide-base neutralise les ions et fait se rapprocher le pH de 7.
  solution: Une solution basique a un pH supérieur à 7 et contient plus d'ions HO⁻ que d'ions H⁺ ; Lors d'une réaction entre
    un acide et une base, les ions H⁺ et HO⁻ réagissent ensemble pour former de l'eau. Une solution basique se caractérise
    par un pH situé entre 7 et 14 et une majorité d'ions hydroxyde HO⁻.
- id: nblm-pour-mesurer-le-ph-d-une-solution-aqueus-7
  type: texte_court
  difficulte: 1
  enonce: Pour mesurer le pH d'une solution aqueuse et déterminer si elle est acide ou basique, on peut utiliser du papier
    _____.
  reponse:
    acceptees:
    - pH
    fautes_tolerees: 1
  indices:
    relance: Donne le symbole de deux lettres qui mesure l'acidité d'une solution.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: pH. Le papier pH change de couleur au contact de la solution, permettant d'estimer son pH sur une échelle de 0
    à 14.
- id: nblm-lors-de-la-corrosion-d-un-clou-en-fer-so-8
  type: texte_court
  difficulte: 1
  enonce: Lors de la corrosion d'un clou en fer sous l'action du dioxygène et de l'eau, le produit poreux formé à la surface
    s'appelle la _____.
  reponse:
    acceptees:
    - rouille
    fautes_tolerees: 1
  indices:
    relance: Il s'agit du nom usuel du composé rougeâtre formé sur le fer oxydé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: rouille. La rouille est la substance poreuse produite par l'oxydation du fer en présence d'air humide.
- id: gaz-elevage
  type: texte_court
  difficulte: 1
  enonce: Quel gaz à effet de serre, de formule CH4, est produit par l'élevage de bovins et par la décomposition des déchets
    ? Réponds par son nom.
  reponse:
    acceptees:
    - méthane
    - le méthane
    fautes_tolerees: 1
  indices:
    relance: La formule CH4 contient un atome de carbone et quatre atomes d'hydrogène. C'est aussi le gaz naturel qui brûle
      dans une chaudière.
    methode: Ce gaz est aussi le combustible de l'équation CH4 + 2 O2 → CO2 + 2 H2O de l'essentiel.
    etape: 'Cherche dans l''essentiel la liste des trois gaz à effet de serre : un seul a pour formule CH4.'
  pieges:
  - si:
      valeur: dioxyde de carbone
    relance: 'Le dioxyde de carbone a pour formule CO2, avec deux atomes d''oxygène. Ici la formule est CH4 : quels atomes
      contient-elle ?'
  - si:
      valeur: protoxyde d'azote
    relance: Le protoxyde d'azote contient de l'azote et de l'oxygène (N2O). La formule CH4 contient-elle de l'azote ?
  solution: 'C''est le méthane, de formule CH4 : un gaz à effet de serre issu de l''élevage et de la décomposition des déchets.'
- id: vrai-faux-combustion
  type: choix
  difficulte: 2
  enonce: Quelles affirmations sur les combustions sont vraies ?
  reponse:
    options:
    - id: a
      texte: Une combustion a besoin d'un combustible et d'un comburant, souvent le dioxygène de l'air.
    - id: b
      texte: Une combustion incomplète peut produire du monoxyde de carbone, un gaz toxique.
    - id: c
      texte: La combustion du bois ne rejette aucun gaz à effet de serre.
    - id: d
      texte: Une combustion est une transformation physique.
    bonnes:
    - a
    - b
  indices:
    relance: Une combustion est-elle une transformation où des espèces nouvelles apparaissent ?
    methode: Combustible + comburant → produits. Le dioxyde de carbone formé est un gaz à effet de serre.
    etape: Élimine l'affirmation qui parle de transformation physique, puis celle qui nie la production d'un gaz à effet de
      serre.
  pieges:
  - si:
      contient:
      - c
    relance: Le bois contient du carbone. Quel gaz se forme quand le carbone brûle, et est-ce un gaz à effet de serre ?
  - si:
      contient:
      - d
    relance: Dans une combustion, de nouvelles espèces apparaissent. Est-ce une transformation physique ?
  - si:
      diagnostic: incomplet
    relance: Il y a une autre affirmation vraie. Que se passe-t-il quand il manque du dioxygène ?
  solution: 'a et b sont vraies. c est fausse : le bois qui brûle forme du dioxyde de carbone. d est fausse : une combustion
    est une transformation chimique.'
