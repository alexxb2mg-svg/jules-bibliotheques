format: 2
notion: acide-base-combustion-corrosion
version: 1
etat: verifiee
declencheurs:
- eau de Javel
- papier pH
- solution qui pique
- rouille du fer
- gaz à effet de serre d'une réaction
- combustible et comburant
prerequis:
- transformation-chimique-molecules-atomes-ions
essentiel: 'Le pH mesure le caractère acide ou basique d''une solution aqueuse, sur une échelle qui va généralement de 0 à
  14 :

  pH < 7 signale une solution acide, pH = 7 une solution neutre (comme l''eau pure), pH > 7 une solution basique.


  Le caractère acide est lié à la présence d''ions H+ (plus il y en a, plus le pH est bas) ; le caractère basique

  est lié à la présence d''ions OH- (plus il y en a, plus le pH est élevé).


  Une combustion est une transformation chimique entre un combustible et un comburant (souvent le dioxygène de

  l''air) qui produit de l''énergie (chaleur, lumière) ; une combustion complète d''un combustible contenant du carbone

  produit du dioxyde de carbone et souvent de l''eau.


  La corrosion est une réaction chimique lente entre un métal et son environnement (dioxygène, eau, parfois

  solutions acides) qui l''abîme progressivement, comme la rouille du fer.


  Certaines transformations chimiques (combustions notamment) produisent des gaz à effet de serre, en particulier

  le dioxyde de carbone, qui participent au réchauffement climatique.

  '
methode:
- Pour caractériser une solution, mesurer son pH (papier pH ou pH-mètre) et le comparer à 7.
- Relier un pH bas à une présence importante d'ions H+, un pH élevé à une présence importante d'ions OH-.
- Pour une combustion, identifier le combustible et le comburant, et repérer les produits formés (souvent CO2 et H2O).
- Pour la corrosion, identifier le métal et les substances de l'environnement responsables (dioxygène, eau, humidité).
vocabulaire:
- terme: comburant
  definition: la substance qui permet la combustion en réagissant avec le combustible, le plus souvent le dioxygène de l'air
erreurs_frequentes:
- Croire qu'un pH négatif ou supérieur à 14 est impossible dans l'absolu (l'échelle usuelle va de 0 à 14, mais ce n'est qu'une
  convention pratique).
- 'Confondre acide et basique : un produit « qui pique » n''est pas forcément acide.'
- Oublier qu'une combustion a besoin d'un comburant (souvent le dioxygène) pour se produire.
- Confondre corrosion (réaction chimique lente) et usure mécanique (frottement, sans réaction chimique).
exemple:
  enonce: Une solution a un pH de 3. Est-elle acide, neutre ou basique ? Quels ions y sont en excès ?
  solution: 'pH = 3 < 7 : la solution est acide. Elle contient un excès d''ions H+.'
exercices:
- id: ph-eau-de-javel
  type: texte_court
  difficulte: 1
  enonce: Le pH de l'eau de Javel est d'environ 12. Est-elle acide ou basique ?
  reponse:
    acceptees:
    - basique
    fautes_tolerees: 1
  indices:
    relance: Compare 12 à la valeur du pH neutre.
    methode: Rappelle-toi ce que signifie un pH supérieur à 7, et ce que signifie un pH inférieur à 7.
    etape: 12 est plus grand que 7.
  pieges:
  - si:
      valeur: acide
    relance: 'Un pH acide est inférieur à 7 : ici, le pH vaut 12, compare-le à 7.'
  solution: '12 > 7 : l''eau de Javel est basique.'
- id: rouille-fer-elements
  type: choix
  difficulte: 2
  enonce: Un morceau de fer laissé dehors se recouvre d'une couche orangée après plusieurs semaines. Quels sont les deux éléments
    de l'environnement responsables de ce phénomène ?
  reponse:
    options:
    - id: a
      texte: Le dioxygène et l'eau (humidité)
    - id: b
      texte: Le dioxyde de carbone et le froid
    - id: c
      texte: La lumière du soleil et le vent
    bonnes:
    - a
  indices:
    relance: Ce phénomène est une réaction chimique lente entre le métal et deux substances de l'air et de la pluie.
    methode: Pense à ce qui réagit chimiquement avec le fer, pas seulement à ce qui l'entoure physiquement.
    etape: Le froid et le vent ne provoquent pas de réaction chimique par eux-mêmes.
  pieges:
  - si:
      contient:
      - b
    relance: Le froid ne déclenche pas de réaction chimique avec le fer ; ce sont deux autres substances qui sont responsables.
  - si:
      contient:
      - c
    relance: La lumière et le vent n'attaquent pas chimiquement le fer ; cherche deux substances qui réagissent vraiment avec
      le métal.
  solution: C'est de la corrosion (rouille), due au dioxygène de l'air et à l'humidité (eau).
- id: combustion-gaz-naturel-produits
  type: ouverte
  difficulte: 2
  enonce: La combustion complète du gaz naturel (un combustible contenant du carbone) produit deux types de substances. Lesquelles,
    et pourquoi cela concerne-t-il le climat ?
  criteres:
  - L'élève cite le dioxyde de carbone comme produit de la combustion.
  - L'élève cite l'eau comme second produit de la combustion complète.
  - L'élève explique que le dioxyde de carbone est un gaz à effet de serre qui contribue au réchauffement climatique.
  indices:
    relance: Une combustion complète d'un combustible carboné produit deux substances précises.
    methode: Pense à ce qui se forme quand le carbone du gaz naturel réagit avec le dioxygène de l'air.
    etape: Le carbone se combine à l'oxygène pour former un gaz que l'on retrouve aussi dans nos rejets de respiration.
  solution: Elle produit du dioxyde de carbone et de l'eau. Le dioxyde de carbone est un gaz à effet de serre qui contribue
    au réchauffement climatique.
- id: comparaison-ph-deux-solutions
  type: nombre
  difficulte: 1
  enonce: Une solution A a un pH de 4 et une solution B a un pH de 9. Combien d'unités de pH séparent ces deux solutions ?
  reponse:
    valeur: 5
    forme: entier
    tolerance: 0
  indices:
    relance: Calcule la différence entre les deux valeurs de pH données.
    methode: Soustrais la plus petite valeur de la plus grande.
    etape: 9 moins 4.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Refais la soustraction entre les deux valeurs de pH, dans le bon sens.
  solution: 9 − 4 = 5 unités de pH séparent les deux solutions.
- id: combustible-comburant-definition
  type: texte_court
  difficulte: 2
  enonce: Dans une combustion, comment se nomme la substance qui réagit avec le combustible et lui permet de brûler (souvent
    le dioxygène de l'air) ?
  reponse:
    acceptees:
    - comburant
    fautes_tolerees: 1
  indices:
    relance: Ce mot ressemble à « combustible », mais ne désigne pas la même chose.
    methode: C'est la substance apportée par l'air qui permet la réaction, pas ce qui brûle.
    etape: Ce mot commence par « combu- » et se termine en « -ant ».
  pieges:
  - si:
      valeur: combustible
    relance: Le combustible est ce qui brûle ; cherche le nom de la substance qui lui permet de brûler.
  solution: Le comburant (souvent le dioxygène de l'air).
