format: 2
notion: propagation-son-frequence
version: 1
etat: verifiee
declencheurs:
- vitesse du son dans l'air
- délai entre éclair et tonnerre
- son grave ou aigu
- fréquence en hertz d'un son
- ultrasons utilisés en échographie
- son ne se propage pas dans le vide
prerequis:
- propagation-lumiere
essentiel: 'Le son est une vibration qui se propage de proche en proche dans un milieu matériel (air, eau, solide) : contrairement
  à la lumière, il ne peut pas se propager dans le vide.


  Le son se propage beaucoup moins vite que la lumière : environ 340 m/s dans l''air (à 20 °C), contre 300 000 km/s pour la
  lumière. C''est pourquoi on voit un éclair avant d''entendre le tonnerre.


  La distance parcourue par le son se calcule par d = v x t, avec v environ égal à 340 m/s dans l''air.


  La fréquence d''un son (en hertz, Hz) correspond au nombre de vibrations par seconde ; elle détermine la hauteur du son
  perçu (aigu ou grave).


  L''oreille humaine perçoit les sons de fréquence comprise entre environ 20 Hz et 20 000 Hz ; en dessous, ce sont des infrasons,
  au-dessus, des ultrasons, tous deux inaudibles par l''être humain mais perçus ou utilisés par certains animaux (chauves-souris,
  dauphins) ou en médecine (échographie).'
methode:
- Retiens que le son a besoin d'un milieu matériel pour se propager (pas de son dans le vide).
- Utilise d = v x t avec v environ égal à 340 m/s dans l'air pour calculer une distance ou une durée de propagation.
- Situe une fréquence de son par rapport aux limites de l'audition humaine (20 Hz à 20 000 Hz).
- Distingue infrasons (fréquence trop basse) et ultrasons (fréquence trop haute) pour l'oreille humaine.
vocabulaire:
- terme: fréquence
  definition: nombre de vibrations par seconde d'un son, en hertz (Hz), qui détermine sa hauteur
- terme: ultrasons
  definition: sons de fréquence supérieure à 20 000 Hz, inaudibles par l'être humain
- terme: infrasons
  definition: sons de fréquence inférieure à 20 Hz, inaudibles par l'être humain
erreurs_frequentes:
- Croire que le son se propage à la même vitesse que la lumière.
- Penser que le son peut se propager dans le vide, comme la lumière.
- Confondre fréquence (nombre de vibrations par seconde) et vitesse de propagation du son.
- Croire que les ultrasons sont plus « forts » que les sons audibles, alors qu'ils sont simplement d'une fréquence trop élevée
  pour être entendus par l'oreille humaine.
exemple:
  enonce: Un enfant voit un éclair, puis entend le tonnerre 6 secondes plus tard. Estimer la distance de l'orage (vitesse
    du son dans l'air environ égale à 340 m/s).
  solution: d = v x t = 340 x 6 = 2040 m, soit environ 2 km.
exercices:
- id: duree-propagation-son
  type: nombre
  difficulte: 1
  enonce: Le son parcourt 1700 m dans l'air. Combien de temps a-t-il mis, en secondes (v environ égal à 340 m/s) ?
  reponse:
    valeur: 5
    forme: entier
    tolerance: 0.1
  indices:
    relance: Quelle formule relie temps, distance et vitesse ?
    methode: Utilise t = d / v.
    etape: Remplace d et v par les valeurs de l'énoncé, puis effectue la division.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta division de la distance par la vitesse du son.
  solution: t = d / v = 1700 / 340 = 5 s.
- id: audible-chauve-souris
  type: choix
  difficulte: 2
  enonce: Une chauve-souris émet des sons de fréquence 50 000 Hz pour se repérer. L'être humain peut-il les entendre ?
  reponse:
    options:
    - id: a
      texte: non, car 50 000 Hz dépasse la limite supérieure de l'audition humaine
    - id: b
      texte: oui, tous les sons émis par les animaux sont audibles par l'être humain
    - id: c
      texte: non, car 50 000 Hz est en dessous de la limite inférieure de l'audition humaine
    bonnes:
    - a
  indices:
    relance: Compare 50 000 Hz à la limite supérieure de l'audition humaine.
    methode: L'oreille humaine perçoit les sons entre environ 20 Hz et 20 000 Hz.
    etape: 50 000 Hz est-il inférieur ou supérieur à 20 000 Hz ?
  pieges:
  - si:
      contient:
      - b
    relance: L'être humain ne perçoit qu'une gamme limitée de fréquences (20 Hz à 20 000 Hz), pas tous les sons émis par les
      animaux.
  - si:
      contient:
      - c
    relance: '50 000 Hz est un nombre très grand, bien au-dessus de 20 000 Hz : ce n''est pas la limite inférieure qui est
      concernée ici.'
  solution: 'Non, 50 000 Hz dépasse 20 000 Hz : l''être humain ne peut pas l''entendre. Ce sont des ultrasons.'
- id: definir-infrasons
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on les sons de fréquence trop basse pour être entendus par l'oreille humaine ?
  reponse:
    acceptees:
    - infrasons
    - infrason
    fautes_tolerees: 1
  indices:
    relance: Ce n'est pas le nom des sons trop aigus, mais celui des sons trop graves pour être entendus.
    methode: Le préfixe de ce mot signifie « en dessous ».
    etape: Ces sons ont une fréquence inférieure à 20 Hz.
  pieges:
  - si:
      valeur: ultrasons
    relance: 'Les ultrasons sont les sons de fréquence trop haute, pas trop basse : ce n''est pas la réponse cherchée ici.'
  solution: 'Ce sont des infrasons : des sons de fréquence trop basse pour être entendus par l''oreille humaine.'
- id: expliquer-eclair-tonnerre
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi on voit l'éclair d'un orage avant d'en entendre le tonnerre, alors que les deux sont produits
    au même instant.
  criteres:
  - L'élève rappelle que la lumière et le son sont émis en même temps par l'éclair.
  - L'élève compare les vitesses très différentes de la lumière (environ 300 000 km/s) et du son (environ 340 m/s).
  - L'élève conclut que la lumière nous parvient presque instantanément alors que le son met plusieurs secondes.
  indices:
    relance: L'éclair et le tonnerre sont-ils produits au même moment ou à des moments différents ?
    methode: Compare la vitesse de la lumière et la vitesse du son.
    etape: Commence par rappeler que la lumière et le son sont émis en même temps lors d'un éclair.
  solution: 'L''éclair (lumière) et le tonnerre (son) sont produits au même instant. Mais la lumière se propage beaucoup plus
    vite (environ 300 000 km/s) que le son (environ 340 m/s) : l''éclair nous parvient quasiment instantanément, alors que
    le son du tonnerre met plusieurs secondes à parcourir la même distance jusqu''à nous.'
