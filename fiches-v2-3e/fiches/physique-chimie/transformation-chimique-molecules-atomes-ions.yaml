format: 2
notion: transformation-chimique-molecules-atomes-ions
version: 1
etat: verifiee
declencheurs:
- avant/après une réaction
- atomes se réarrangent
- réactifs et produits
- équation équilibrée
- combustion du carbone
- synthèse de l'eau
prerequis:
- classification-periodique
couverture: Notion de transformation chimique, molécules, atomes, ions et conservation de la masse ; l'écriture d'équations
  de réaction équilibrées est traitée avec des exemples fournis.
essentiel: 'Une transformation chimique change la nature des espèces chimiques présentes : des réactifs disparaissent et de

  nouveaux produits apparaissent (contrairement à un simple mélange ou à un changement d''état, qui ne créent pas de

  nouvelle substance).


  La matière est faite de molécules (groupes d''atomes liés, comme H2O) et d''atomes isolés ou combinés. Un ion est un

  atome (ou un groupe d''atomes) qui a perdu ou gagné des électrons et porte donc une charge électrique.


  Lors d''une transformation chimique, les atomes présents dans les réactifs ne disparaissent pas : ils se

  réorganisent pour former les produits. C''est pourquoi la masse totale est conservée entre avant et après la

  réaction.


  Une équation de réaction traduit cette transformation avec des formules chimiques : réactifs suivis d''une flèche

  puis des produits, avec des nombres (coefficients) qui assurent qu''il y a le même nombre de chaque type d''atome

  de part et d''autre.


  Exemple : la combustion du carbone s''écrit C + O2 vers CO2 (un atome de carbone et deux atomes d''oxygène de chaque

  côté).

  '
methode:
- Repérer les réactifs (avant la flèche) et les produits (après la flèche) d'une équation.
- 'Pour vérifier qu''une équation est correcte, compter le nombre d''atomes de chaque élément de chaque côté de la flèche
  : ils doivent être égaux (conservation des atomes, donc de la masse).'
- Si les nombres ne correspondent pas, ajuster les coefficients devant les formules (jamais les indices à l'intérieur d'une
  formule, qui changeraient l'espèce chimique).
- Utiliser la conservation de la masse pour retrouver la masse d'un réactif ou d'un produit manquant dans une expérience.
vocabulaire:
- terme: réactif
  definition: une espèce chimique présente avant la transformation chimique et qui disparaît en partie ou entièrement
- terme: produit
  definition: une nouvelle espèce chimique qui apparaît après la transformation chimique
erreurs_frequentes:
- Changer les indices d'une formule (CO2 en CO3) pour équilibrer, ce qui change l'espèce chimique.
- Croire que la masse totale change pendant une réaction chimique (elle est conservée).
- Confondre transformation chimique et changement d'état ou simple mélange.
- Oublier de multiplier tous les atomes d'une formule par son coefficient lors du comptage.
exemple:
  enonce: Vérifier que l'équation de la combustion du méthane CH4 + 2 O2 vers CO2 + 2 H2O est équilibrée.
  solution: 'À gauche : 1 C, 4 H, 4 O (2 fois O2). À droite : 1 C (CO2), 4 H (2 fois H2O), 2 + 2 = 4 O (CO2 apporte 2 O, 2
    H2O apporte 2 O). Les nombres d''atomes correspondent : l''équation est équilibrée.'
exercices:
- id: verifier-synthese-eau
  type: texte_court
  difficulte: 1
  enonce: L'équation 2 H2 + O2 vers 2 H2O décrit la synthèse de l'eau. Cette équation est-elle équilibrée ? Réponds par oui
    ou par non.
  reponse:
    acceptees:
    - oui
    fautes_tolerees: 1
  indices:
    relance: Compte les atomes d'hydrogène et d'oxygène de chaque côté de la flèche.
    methode: 2 H2 contient combien d'atomes H au total ? Et 2 H2O ?
    etape: 'À gauche, il y a 2 O2 : compte le nombre total d''atomes O de ce côté.'
  pieges:
  - si:
      valeur: non
    relance: Recompte soigneusement les atomes H et O des deux côtés de la flèche avant de conclure.
  solution: 'Oui, elle est équilibrée : à gauche, 4 H (2 fois H2) et 2 O ; à droite, 4 H et 2 O (2 fois H2O).'
- id: equation-fer-soufre
  type: texte_court
  difficulte: 1
  enonce: Du fer (Fe) réagit avec du soufre (S) pour former du sulfure de fer (FeS), sans autre produit. Écrire l'équation
    de cette réaction (réactifs, flèche, produit), sans espaces.
  reponse:
    acceptees:
    - Fe+S→FeS
    fautes_tolerees: 0
  indices:
    relance: Combien d'atomes de fer et de soufre faut-il pour former une unité de FeS ?
    methode: Écris d'abord les réactifs séparés par un signe plus, puis une flèche, puis le produit.
    etape: Un atome de fer et un atome de soufre donnent une unité de FeS ; aucun coefficient n'est nécessaire.
  pieges:
  - si:
      valeur: 2Fe+S→FeS
    relance: 'Compte les atomes de fer de chaque côté de ta flèche : sont-ils en même nombre ?'
  solution: 'Fe+S→FeS. Il y a 1 Fe et 1 S de chaque côté : l''équation est équilibrée.'
- id: masse-sulfure-fer
  type: nombre
  difficulte: 2
  enonce: 5,6 g de fer réagissent entièrement avec 3,2 g de soufre pour former du sulfure de fer, sans autre produit. Quelle
    est la masse de sulfure de fer obtenue, en grammes ?
  reponse:
    valeur: 8.8
    forme: libre
    tolerance: 0.1
  indices:
    relance: Que dit la conservation de la masse pendant une transformation chimique ?
    methode: Additionne la masse des deux réactifs pour obtenir la masse totale des produits.
    etape: Additionne 5,6 et 3,2.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Revérifie l'addition des deux masses de réactifs donnés dans l'énoncé.
  solution: 5,6 + 3,2 = 8,8 g de sulfure de fer, car la masse totale est conservée pendant la transformation chimique.
- id: choisir-definition-ion
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qu'un ion ?
  reponse:
    options:
    - id: a
      texte: Un atome ou un groupe d'atomes qui a perdu ou gagné un ou plusieurs électrons
    - id: b
      texte: Un atome qui a changé de nombre de protons
    - id: c
      texte: Un groupe de plusieurs molécules identiques
    bonnes:
    - a
  indices:
    relance: Un ion porte une charge électrique. D'où vient cette charge ?
    methode: Élimine les propositions qui ne parlent pas d'une perte ou d'un gain d'électrons.
    etape: Le nombre de protons définit l'élément chimique et ne change pas quand un ion se forme.
  pieges:
  - si:
      contient:
      - b
    relance: Le nombre de protons définit l'élément chimique et ne change pas lors de la formation d'un ion.
  - si:
      contient:
      - c
    relance: Un groupe de molécules identiques n'est pas forcément chargé électriquement ; ce n'est pas la définition d'un
      ion.
  solution: Un ion est un atome ou un groupe d'atomes qui a perdu ou gagné un ou plusieurs électrons, ce qui lui donne une
    charge électrique.
- id: distinguer-transformation-melange
  type: ouverte
  difficulte: 3
  enonce: On mélange de l'eau et du sel, puis on fait brûler du charbon (carbone) dans l'air. Explique pourquoi l'un de ces
    deux événements est une transformation chimique et l'autre non.
  criteres:
  - L'élève dit que dissoudre le sel dans l'eau est un mélange, sans nouvelle espèce chimique formée (le sel et l'eau restent
    identifiables).
  - L'élève dit que la combustion du carbone est une transformation chimique, car de nouvelles espèces apparaissent (le dioxyde
    de carbone).
  - L'élève cite l'équation C + O2 vers CO2 pour illustrer le réarrangement des atomes.
  indices:
    relance: Dans un des deux cas, une nouvelle espèce chimique apparaît-elle ?
    methode: 'Compare ce qu''on peut retrouver après chaque événement : le sel dissous est-il toujours du sel ?'
    etape: Le sel dissous dans l'eau peut être récupéré par évaporation, sans avoir changé de nature.
  solution: 'Mélanger de l''eau et du sel est un simple mélange : le sel et l''eau restent des espèces chimiques identifiables,
    on peut même les séparer par évaporation. Faire brûler du carbone dans l''air est une transformation chimique : les réactifs
    (carbone et dioxygène) disparaissent et une nouvelle espèce apparaît, le dioxyde de carbone, selon l''équation C + O2
    vers CO2, où les atomes se sont réarrangés.'
