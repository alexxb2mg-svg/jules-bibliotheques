format: 2
notion: gravitation-poids-masse
version: 1
etat: verifiee
declencheurs:
- intensité de la pesanteur
- combien je pèse
- poids sur la lune
- newton par kilogramme
- formule du poids
- attraction entre deux corps
prerequis:
- actions-et-forces
essentiel: 'Gravitation : deux corps qui ont une masse s''attirent toujours l''un l''autre. C''est une interaction à distance.
  La valeur de cette force est donnée par la loi de gravitation universelle (elle est fournie dans les exercices) :

  F = G × mA × mB ÷ d²

  (mA et mB en kg, d : distance entre les centres des deux corps, en m ; F en N ; G est une constante.)

  Plus les masses sont grandes, plus la force est grande. Plus les corps sont éloignés, plus elle est faible : si la distance
  double, la force est divisée par 4.


  Le poids P d''un objet est la force d''attraction exercée par la Terre (ou par l''astre sur lequel il se trouve) sur cet
  objet :

  - point d''application : le centre de gravité de l''objet ;

  - direction : verticale ;

  - sens : vers le bas (vers le centre de l''astre) ;

  - valeur : P = m × g, avec P en newtons (N), m en kilogrammes (kg) et g, l''intensité de la pesanteur, en newtons par kilogramme
  (N/kg).


  Sur Terre, g ≈ 9,8 N/kg. Sur la Lune, g ≈ 1,6 N/kg : un objet y pèse environ 6 fois moins que sur Terre.


  Masse et poids sont deux grandeurs différentes :

  - la masse mesure la quantité de matière ; elle s''exprime en kg, se mesure avec une balance et ne dépend pas du lieu ;

  - le poids est une force ; il s''exprime en N, se mesure avec un dynamomètre et dépend du lieu (de g).

  '
methode:
- 'Repérer ce qu''on cherche : une masse (en kg) ou un poids (en N) ?'
- 'Pour un poids : écrire P = m × g, choisir la bonne valeur de g (Terre ou Lune), vérifier que m est en kg, puis calculer.'
- 'Pour une masse à partir d''un poids : m = P ÷ g.'
- 'Pour la loi de gravitation : regarder comment chaque grandeur apparaît dans la formule (au numérateur, au dénominateur,
  au carré).'
vocabulaire:
- terme: poids
  definition: Force d'attraction exercée par un astre sur un objet ; en newtons (N).
- terme: masse
  definition: Quantité de matière d'un objet ; en kilogrammes (kg), la même partout.
- terme: intensité de la pesanteur (g)
  definition: Coefficient de la relation P = m × g, en N/kg ; il dépend de l'astre.
erreurs_frequentes:
- 'Dire « je pèse 50 kg » : 50 kg est une masse. Le poids correspondant sur Terre est 50 × 9,8 = 490 N.'
- 'Croire que la masse change sur la Lune : seule la valeur du poids change.'
- 'Utiliser g = 9,8 N/kg sur la Lune : il faut prendre g ≈ 1,6 N/kg.'
- 'Oublier le carré de la distance dans la loi de gravitation : si la distance double, la force n''est pas divisée par 2.'
exemple:
  enonce: Un sac a un poids de 49 N sur Terre (g = 9,8 N/kg). Quelle est sa masse ?
  solution: m = P ÷ g = 49 ÷ 9,8 = 5 kg. Sur la Lune, sa masse serait toujours 5 kg, mais son poids ne serait plus que 5 ×
    1,6 = 8 N.
exercices:
- id: poids-d-un-eleve
  type: nombre
  difficulte: 1
  enonce: Sur Terre, g = 9,8 N/kg. Calcule le poids, en newtons, d'un élève dont la masse est de 50 kg. Écris seulement le
    nombre.
  reponse:
    valeur: 490
    forme: libre
  indices:
    relance: Quelle relation relie le poids P, la masse m et l'intensité de la pesanteur g ?
    methode: 'P = m × g, avec m en kg et g en N/kg : le résultat est en newtons.'
    etape: 'Remplace m et g par leurs valeurs : P = 50 × 9,8. Il reste à faire la multiplication.'
  pieges:
  - si:
      valeur: 50
    relance: '50, c''est la masse, en kilogrammes. Le poids est une force : utilise la relation avec g.'
  - si:
      valeur: 5,1
    relance: Tu as divisé. Dans la relation P = m × g, faut-il diviser ou multiplier ?
  - si:
      diagnostic: valeur_fausse
    relance: Écris P = m × g, remplace m et g, puis refais la multiplication.
  solution: P = m × g = 50 × 9,8 = 490 N.
- id: grandeurs-et-unites
  type: association
  difficulte: 1
  enonce: Associe chaque grandeur à son unité.
  reponse:
    gauche:
    - id: masse
      texte: la masse d'un objet
    - id: poids
      texte: le poids d'un objet
    - id: pesanteur
      texte: l'intensité de la pesanteur g
    droite:
    - id: kg
      texte: le kilogramme (kg)
    - id: n
      texte: le newton (N)
    - id: n-par-kg
      texte: le newton par kilogramme (N/kg)
    - id: m-par-s
      texte: le mètre par seconde (m/s)
    paires:
      masse: kg
      poids: n
      pesanteur: n-par-kg
  indices:
    relance: Le poids est-il une quantité de matière ou une force ?
    methode: 'Une force s''exprime en newtons. Pour g, pense à la relation P = m × g : g = P ÷ m.'
    etape: La masse se mesure avec une balance, graduée en kilogrammes. Continue avec les deux autres grandeurs.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Le poids est une force : quelle est l''unité d''une force ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Pars de la relation P = m × g : P en newtons, m en kilogrammes. En quelle unité s''exprime alors g = P ÷ m ?'
  solution: 'Masse : kilogramme (kg). Poids : newton (N). Intensité de la pesanteur : newton par kilogramme (N/kg). Le mètre
    par seconde est une unité de vitesse.'
- id: poids-ou-masse
  type: choix
  difficulte: 2
  enonce: Parmi ces affirmations, lesquelles sont justes ?
  reponse:
    options:
    - id: a
      texte: La masse d'un objet est la même sur Terre et sur la Lune.
    - id: b
      texte: Le poids d'un objet est plus faible sur la Lune que sur Terre.
    - id: c
      texte: Le poids se mesure avec une balance, en kilogrammes.
    - id: d
      texte: Poids et masse sont deux mots pour la même grandeur.
    bonnes:
    - a
    - b
  indices:
    relance: Un objet emporté sur la Lune perd-il de la matière ? Et la Lune l'attire-t-elle autant que la Terre ?
    methode: 'Rappelle-toi : la masse est une quantité de matière (en kg) ; le poids est une force (en N) qui dépend de g.'
    etape: Sur la Lune, g vaut environ 1,6 N/kg, contre 9,8 N/kg sur Terre. Que devient P = m × g ?
  pieges:
  - si:
      contient:
      - c
    relance: Le poids est une force. Avec quel appareil mesure-t-on une force, et en quelle unité ?
  - si:
      contient:
      - d
    relance: L'une s'exprime en kilogrammes, l'autre en newtons. Peuvent-elles être la même grandeur ?
  - si:
      diagnostic: incomplet
    relance: C'est juste, mais il manque une affirmation vraie. Compare ce qui change et ce qui ne change pas sur la Lune.
  solution: 'Justes : a (la masse ne dépend pas du lieu) et b (g est plus faible sur la Lune). Fausses : c (le poids se mesure
    avec un dynamomètre, en newtons) et d (la masse est en kg, le poids est une force en N).'
- id: astronaute-sur-la-lune
  type: nombre
  difficulte: 2
  enonce: Un astronaute équipé a une masse de 80 kg. Sur la Lune, g = 1,6 N/kg. Calcule son poids sur la Lune, en newtons.
    Écris seulement le nombre.
  reponse:
    valeur: 128
    forme: libre
  indices:
    relance: Sa masse change-t-elle quand il arrive sur la Lune ? Quelle valeur de g faut-il utiliser ?
    methode: Applique P = m × g, avec la valeur de g sur la Lune.
    etape: Il faut calculer 80 × 1,6, par exemple en faisant 80 × 1 plus 80 × 0,6.
  pieges:
  - si:
      valeur: 80
    relance: 80, c'est sa masse, en kilogrammes. On demande son poids, une force en newtons.
  - si:
      valeur: 784
    relance: Tu as utilisé g sur Terre. Sur la Lune, g a une autre valeur, donnée dans l'énoncé.
  - si:
      valeur: 50
    relance: Tu as divisé. Dans la relation P = m × g, faut-il diviser ou multiplier ?
  - si:
      diagnostic: valeur_fausse
    relance: Écris P = m × g avec g de la Lune, puis refais le calcul.
  solution: P = m × g = 80 × 1,6 = 128 N. Sur Terre, il pèserait 80 × 9,8 = 784 N, environ 6 fois plus.
- id: distance-doublee
  type: nombre
  difficulte: 3
  enonce: La loi de gravitation universelle s'écrit F = G × mA × mB ÷ d², où d est la distance entre les centres des deux
    corps. Si on double la distance d, sans changer les masses, par combien la force F est-elle divisée ? Écris seulement
    le nombre.
  reponse:
    valeur: 4
    forme: libre
  indices:
    relance: Dans la formule, la distance d apparaît-elle simplement, ou élevée au carré ?
    methode: Remplace d par le double de d dans la formule, et regarde ce que devient d².
    etape: Le double de d, au carré, c'est (2 × d) × (2 × d). Regroupe les nombres d'un côté et les d de l'autre.
  pieges:
  - si:
      valeur: 2
    relance: Tu as oublié le carré. Si d est multiplié par 2, par combien d² est-il multiplié ?
  - si:
      valeur: 0,25
    relance: Tu as trouvé par combien la force est multipliée. On demande par combien elle est divisée.
  - si:
      diagnostic: valeur_fausse
    relance: 'Calcule ce que devient d² quand d double : c''est ce nombre qui divise la force.'
  solution: Si d devient 2 × d, alors d² devient (2 × d)² = 2 × 2 × d² = 4 × d². Le dénominateur est multiplié par 4, donc
    la force est divisée par 4.
- id: je-pese-sur-la-lune
  type: ouverte
  difficulte: 3
  enonce: 'Léo, dont la masse est de 60 kg, affirme : « Sur la Lune, je pèserais 10 kg. » Explique ce qui ne va pas dans sa
    phrase, puis corrige-la à l''aide de calculs (g = 9,8 N/kg sur Terre et g = 1,6 N/kg sur la Lune).'
  criteres:
  - 'L''élève explique que la masse de Léo ne change pas : elle reste 60 kg sur la Lune.'
  - L'élève explique que le poids est une force, en newtons, qui dépend de g, et non une masse en kg.
  - 'L''élève calcule correctement les poids : 60 × 9,8 = 588 N sur Terre et 60 × 1,6 = 96 N sur la Lune.'
  indices:
    relance: Quand Léo va sur la Lune, perd-il de la matière ? Et dans quelle unité s'exprime un poids ?
    methode: 'Sépare les deux grandeurs : dis ce que devient la masse, puis calcule le poids avec P = m × g sur Terre et sur
      la Lune.'
    etape: 'Commence par : « La masse de Léo reste la même sur la Lune, car… »'
  solution: 'Léo confond masse et poids. Sa masse reste 60 kg partout, car il ne perd pas de matière. Son poids est une force,
    en newtons, qui dépend de g : sur Terre, P = 60 × 9,8 = 588 N ; sur la Lune, P = 60 × 1,6 = 96 N. Il devrait dire : «
    Sur la Lune, ma masse serait toujours de 60 kg, mais mon poids serait de 96 N au lieu de 588 N. »'
