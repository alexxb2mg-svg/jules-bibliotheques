format: 2
notion: gravitation-poids-masse
version: 2
etat: verifiee
declencheurs:
- intensité de la pesanteur
- combien je pèse
- poids sur la lune
- newton par kilogramme
- formule du poids
- attraction entre deux corps
- poids et masse
- pèse plus sur terre
- attraction de la terre
- force d'attraction universelle
prerequis:
- actions-et-forces
essentiel: 'Gravitation : deux corps qui ont une masse s''attirent toujours l''un l''autre. C''est une interaction à distance,
  toujours attractive.


  La loi de gravitation universelle (elle est fournie dans les exercices) donne la valeur de la force :

  F = G × mA × mB ÷ d²

  mA et mB sont les masses en kg, d la distance entre les centres des corps en m, F la force en N, et G une constante.

  Plus les masses sont grandes, plus la force est grande. Plus les corps sont éloignés, plus elle est faible.

  Effet du carré : si d double, F est divisée par 4 ; si d triple, F est divisée par 9 ; si une masse double, F double.

  La force exercée par A sur B et celle exercée par B sur A ont la même valeur.


  Le poids P d''un objet est la force d''attraction exercée par la Terre (ou par l''astre où il se trouve) sur cet objet :

  - point d''application : le centre de gravité de l''objet ;

  - direction : verticale ;

  - sens : vers le bas, vers le centre de l''astre ;

  - valeur : P = m × g (P en N, m en kg, g en N/kg).


  g est l''intensité de la pesanteur. Sur Terre, g ≈ 9,8 N/kg. Sur la Lune, g ≈ 1,6 N/kg : un objet y pèse environ 6 fois
  moins que sur Terre.

  On en déduit m = P ÷ g.


  Masse et poids sont deux grandeurs différentes :

  - la masse mesure la quantité de matière ; en kg, avec une balance ; elle est la même partout ;

  - le poids est une force ; en N, avec un dynamomètre ; il dépend du lieu (de g).

  Exemple : un objet de 5 kg pèse 5 × 9,8 = 49 N sur Terre et 5 × 1,6 = 8 N sur la Lune.


  Au brevet : on te demande de calculer un poids ou une masse, de distinguer les deux et d''exploiter la loi de gravitation
  fournie (comment F varie quand une masse ou la distance change).

  '
methode:
- 'Repérer ce qu''on cherche : une masse (en kg) ou un poids (en N) ?'
- 'Pour un poids : écrire P = m × g, choisir la bonne valeur de g (Terre ou Lune), vérifier que m est en kg, puis calculer.'
- 'Pour une masse à partir d''un poids : m = P ÷ g.'
- 'Pour les caractéristiques du poids : point d''application au centre de gravité, direction verticale, sens vers le bas,
  valeur P = m × g.'
- 'Pour la loi de gravitation : regarder comment chaque grandeur apparaît dans la formule (au numérateur, au dénominateur,
  au carré).'
- 'Donner le résultat avec son unité : N pour un poids, kg pour une masse.'
vocabulaire:
- terme: gravitation
  definition: attraction à distance entre deux corps qui ont une masse
- terme: poids
  definition: force d'attraction exercée par un astre sur un objet ; en newtons (N)
- terme: masse
  definition: quantité de matière d'un objet ; en kilogrammes (kg), la même partout
- terme: intensité de la pesanteur (g)
  definition: coefficient de la relation P = m × g, en N/kg ; il dépend de l'astre
- terme: newton (N)
  definition: unité de la valeur d'une force
- terme: dynamomètre
  definition: appareil qui mesure la valeur d'une force, donc un poids
- terme: centre de gravité
  definition: point où l'on place la flèche du poids d'un objet
erreurs_frequentes:
- 'Dire « je pèse 50 kg » : 50 kg est une masse. Le poids correspondant sur Terre est 50 × 9,8 = 490 N.'
- 'Croire que la masse change sur la Lune : seule la valeur du poids change.'
- 'Utiliser g = 9,8 N/kg sur la Lune : il faut prendre g ≈ 1,6 N/kg.'
- 'Oublier le carré de la distance dans la loi de gravitation : si la distance double, la force n''est pas divisée par 2.'
- 'Écrire que le poids est horizontal ou dirigé vers le haut : il est vertical, vers le bas.'
exemple:
  enonce: Un sac a un poids de 49 N sur Terre (g = 9,8 N/kg). Quelle est sa masse ?
  solution: m = P ÷ g = 49 ÷ 9,8 = 5 kg. Sur la Lune, sa masse serait toujours 5 kg, mais son poids ne serait plus que 5 ×
    1,6 = 8 N.
exercices:
- id: poids-d-un-eleve
  type: nombre
  difficulte: 1
  enonce: Sur Terre, g = 9,8 N/kg. Calcule le poids, en newtons, d'un élève dont la masse est de 50 kg. Écris seulement le
    nombre.
  reponse:
    valeur: 490
    forme: libre
  indices:
    relance: Quelle relation relie le poids P, la masse m et l'intensité de la pesanteur g ?
    methode: 'P = m × g, avec m en kg et g en N/kg : le résultat est en newtons.'
    etape: 'Remplace m et g par leurs valeurs : P = 50 × 9,8. Il reste à faire la multiplication.'
  pieges:
  - si:
      valeur: 50
    relance: '50, c''est la masse, en kilogrammes. Le poids est une force : utilise la relation avec g.'
  - si:
      valeur: 5,1
    relance: Tu as divisé. Dans la relation P = m × g, faut-il diviser ou multiplier ?
  - si:
      diagnostic: valeur_fausse
    relance: Écris P = m × g, remplace m et g, puis refais la multiplication.
  solution: P = m × g = 50 × 9,8 = 490 N.
- id: grandeurs-et-unites
  type: association
  difficulte: 1
  enonce: Associe chaque grandeur à son unité.
  reponse:
    gauche:
    - id: masse
      texte: la masse d'un objet
    - id: poids
      texte: le poids d'un objet
    - id: pesanteur
      texte: l'intensité de la pesanteur g
    droite:
    - id: kg
      texte: le kilogramme (kg)
    - id: n
      texte: le newton (N)
    - id: n-par-kg
      texte: le newton par kilogramme (N/kg)
    - id: m-par-s
      texte: le mètre par seconde (m/s)
    paires:
      masse: kg
      poids: n
      pesanteur: n-par-kg
  indices:
    relance: Le poids est-il une quantité de matière ou une force ?
    methode: 'Une force s''exprime en newtons. Pour g, pense à la relation P = m × g : g = P ÷ m.'
    etape: La masse se mesure avec une balance, graduée en kilogrammes. Continue avec les deux autres grandeurs.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Le poids est une force : quelle est l''unité d''une force ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Pars de la relation P = m × g : P en newtons, m en kilogrammes. En quelle unité s''exprime alors g = P ÷ m ?'
  solution: 'Masse : kilogramme (kg). Poids : newton (N). Intensité de la pesanteur : newton par kilogramme (N/kg). Le mètre
    par seconde est une unité de vitesse.'
- id: poids-ou-masse
  type: choix
  difficulte: 2
  enonce: Parmi ces affirmations, lesquelles sont justes ?
  reponse:
    options:
    - id: a
      texte: La masse d'un objet est la même sur Terre et sur la Lune.
    - id: b
      texte: Le poids d'un objet est plus faible sur la Lune que sur Terre.
    - id: c
      texte: Le poids se mesure avec une balance, en kilogrammes.
    - id: d
      texte: Poids et masse sont deux mots pour la même grandeur.
    bonnes:
    - a
    - b
  indices:
    relance: Un objet emporté sur la Lune perd-il de la matière ? Et la Lune l'attire-t-elle autant que la Terre ?
    methode: 'Rappelle-toi : la masse est une quantité de matière (en kg) ; le poids est une force (en N) qui dépend de g.'
    etape: Sur la Lune, g vaut environ 1,6 N/kg, contre 9,8 N/kg sur Terre. Que devient P = m × g ?
  pieges:
  - si:
      contient:
      - c
    relance: Le poids est une force. Avec quel appareil mesure-t-on une force, et en quelle unité ?
  - si:
      contient:
      - d
    relance: L'une s'exprime en kilogrammes, l'autre en newtons. Peuvent-elles être la même grandeur ?
  - si:
      diagnostic: incomplet
    relance: C'est juste, mais il manque une affirmation vraie. Compare ce qui change et ce qui ne change pas sur la Lune.
  solution: 'Justes : a (la masse ne dépend pas du lieu) et b (g est plus faible sur la Lune). Fausses : c (le poids se mesure
    avec un dynamomètre, en newtons) et d (la masse est en kg, le poids est une force en N).'
- id: astronaute-sur-la-lune
  type: nombre
  difficulte: 2
  enonce: Un astronaute équipé a une masse de 80 kg. Sur la Lune, g = 1,6 N/kg. Calcule son poids sur la Lune, en newtons.
    Écris seulement le nombre.
  reponse:
    valeur: 128
    forme: libre
  indices:
    relance: Sa masse change-t-elle quand il arrive sur la Lune ? Quelle valeur de g faut-il utiliser ?
    methode: Applique P = m × g, avec la valeur de g sur la Lune.
    etape: Il faut calculer 80 × 1,6, par exemple en faisant 80 × 1 plus 80 × 0,6.
  pieges:
  - si:
      valeur: 80
    relance: 80, c'est sa masse, en kilogrammes. On demande son poids, une force en newtons.
  - si:
      valeur: 784
    relance: Tu as utilisé g sur Terre. Sur la Lune, g a une autre valeur, donnée dans l'énoncé.
  - si:
      valeur: 50
    relance: Tu as divisé. Dans la relation P = m × g, faut-il diviser ou multiplier ?
  - si:
      diagnostic: valeur_fausse
    relance: Écris P = m × g avec g de la Lune, puis refais le calcul.
  solution: P = m × g = 80 × 1,6 = 128 N. Sur Terre, il pèserait 80 × 9,8 = 784 N, environ 6 fois plus.
- id: distance-doublee
  type: nombre
  difficulte: 3
  enonce: La loi de gravitation universelle s'écrit F = G × mA × mB ÷ d², où d est la distance entre les centres des deux
    corps. Si on double la distance d, sans changer les masses, par combien la force F est-elle divisée ? Écris seulement
    le nombre.
  reponse:
    valeur: 4
    forme: libre
  indices:
    relance: Dans la formule, la distance d apparaît-elle simplement, ou élevée au carré ?
    methode: Remplace d par le double de d dans la formule, et regarde ce que devient d².
    etape: Le double de d, au carré, c'est (2 × d) × (2 × d). Regroupe les nombres d'un côté et les d de l'autre.
  pieges:
  - si:
      valeur: 2
    relance: Tu as oublié le carré. Si d est multiplié par 2, par combien d² est-il multiplié ?
  - si:
      valeur: 0,25
    relance: Tu as trouvé par combien la force est multipliée. On demande par combien elle est divisée.
  - si:
      diagnostic: valeur_fausse
    relance: 'Calcule ce que devient d² quand d double : c''est ce nombre qui divise la force.'
  solution: Si d devient 2 × d, alors d² devient (2 × d)² = 2 × 2 × d² = 4 × d². Le dénominateur est multiplié par 4, donc
    la force est divisée par 4.
- id: je-pese-sur-la-lune
  type: ouverte
  difficulte: 3
  enonce: 'Léo, dont la masse est de 60 kg, affirme : « Sur la Lune, je pèserais 10 kg. » Explique ce qui ne va pas dans sa
    phrase, puis corrige-la à l''aide de calculs (g = 9,8 N/kg sur Terre et g = 1,6 N/kg sur la Lune).'
  criteres:
  - 'L''élève explique que la masse de Léo ne change pas : elle reste 60 kg sur la Lune.'
  - L'élève explique que le poids est une force, en newtons, qui dépend de g, et non une masse en kg.
  - 'L''élève calcule correctement les poids : 60 × 9,8 = 588 N sur Terre et 60 × 1,6 = 96 N sur la Lune.'
  indices:
    relance: Quand Léo va sur la Lune, perd-il de la matière ? Et dans quelle unité s'exprime un poids ?
    methode: 'Sépare les deux grandeurs : dis ce que devient la masse, puis calcule le poids avec P = m × g sur Terre et sur
      la Lune.'
    etape: 'Commence par : « La masse de Léo reste la même sur la Lune, car… »'
  solution: 'Léo confond masse et poids. Sa masse reste 60 kg partout, car il ne perd pas de matière. Son poids est une force,
    en newtons, qui dépend de g : sur Terre, P = 60 × 9,8 = 588 N ; sur la Lune, P = 60 × 1,6 = 96 N. Il devrait dire : «
    Sur la Lune, ma masse serait toujours de 60 kg, mais mon poids serait de 96 N au lieu de 588 N. »'
- id: nblm-deux-objets-ayant-une-masse-s-attirent-m-1
  type: choix
  difficulte: 2
  enonce: Deux objets ayant une masse s'attirent mutuellement à distance. Que devient la valeur de cette force d'attraction
    si la distance entre leurs centres double ?
  reponse:
    options:
    - id: o1
      texte: La force est divisée par 4.
    - id: o2
      texte: La force est divisée par 2.
    - id: o3
      texte: La force est multipliée par 2.
    - id: o4
      texte: La force reste inchangée.
    bonnes:
    - o1
  indices:
    relance: Considère le rôle de la distance au carré au dénominateur dans la formule de la gravitation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : la formule contient la distance au carré (d²). Doubler la distance divise donc
      la force par 4 et non par 2.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : l''attraction gravitationnelle diminue avec la distance, elle ne peut pas augmenter quand la distance
      grandit.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : l''attraction gravitationnelle varie fortement en fonction de la distance séparant les deux
      corps.'
  solution: La force est divisée par 4. La force d'attraction gravitationnelle varie selon l'inverse du carré de la distance
    (d²). Si la distance double, la force est donc divisée par 2² = 4.
- id: nblm-dans-la-vie-quotidienne-lorsqu-un-eleve-2
  type: choix
  difficulte: 2
  enonce: Dans la vie quotidienne, lorsqu'un élève demande « combien je pèse ? » et répond « 50 kg », quelle grandeur physique
    exprime-t-il réellement ?
  reponse:
    options:
    - id: o1
      texte: Sa masse, car elle mesure la quantité de matière et s'exprime en kilogrammes.
    - id: o2
      texte: Son poids, car le poids se mesure en kilogrammes sur une balance.
    - id: o3
      texte: Son intensité de pesanteur, car elle mesure l'attraction terrestre.
    - id: o4
      texte: Son volume, car 50 kg représente la place occupée par son corps.
    bonnes:
    - o1
  indices:
    relance: Pense à l'unité officielle utilisée pour indiquer la quantité de matière présente dans un corps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est la confusion classique du langage courant : le poids est une force qui s''exprime en newtons (N), et
      non en kilogrammes.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : l''intensité de la pesanteur g s''exprime en newtons par kilogramme (N/kg) et vaut environ 9,8
      N/kg sur Terre.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la masse mesure la quantité de matière en kg, alors que le volume s''exprime en litres ou mètres
      cubes.'
  solution: 'Sa masse, car elle mesure la quantité de matière et s''exprime en kilogrammes. C''est la bonne définition : 50
    kg correspond à la masse. Son poids réel sur Terre est une force d''environ 490 N.'
- id: nblm-quelle-est-la-relation-mathematique-form-3
  type: choix
  difficulte: 2
  enonce: Quelle est la relation mathématique (formule du poids) reliant le poids P, la masse m et l'intensité de la pesanteur
    g ?
  reponse:
    options:
    - id: o1
      texte: P = m × g
    - id: o2
      texte: P = m ÷ g
    - id: o3
      texte: P = g ÷ m
    - id: o4
      texte: P = m + g
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que le poids est proportionnel à la masse de l'objet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur d''inversion de formule : diviser la masse par l''intensité de la pesanteur ne donne pas une
      valeur de poids en newtons.'
  - si:
      contient:
      - o3
    relance: 'C''est incorrect : cette formule ne permet pas de calculer une force en newtons.'
  - si:
      contient:
      - o4
    relance: 'C''est impossible : on ne peut pas additionner des kilogrammes avec des newtons par kilogramme.'
  solution: 'P = m × g. C''est exact : le poids P (en N) est égal au produit de la masse m (en kg) par l''intensité de la
    pesanteur g (en N/kg).'
- id: nblm-quelle-est-l-unite-correcte-de-l-intensi-4
  type: choix
  difficulte: 2
  enonce: Quelle est l'unité correcte de l'intensité de la pesanteur g dans le Système international ?
  reponse:
    options:
    - id: o1
      texte: Le newton par kilogramme (N/kg)
    - id: o2
      texte: Le newton (N)
    - id: o3
      texte: Le kilogramme (kg)
    - id: o4
      texte: Le kilogramme par newton (kg/N)
    bonnes:
    - o1
  indices:
    relance: Isole g dans la formule P = m × g pour déterminer le rapport de ses unités.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : le newton est l''unité de mesure du poids (qui est une force), pas de l''intensité
      de la pesanteur.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : le kilogramme est l''unité de mesure de la masse.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : les unités sont inversées, la formule g = P / m montre qu''il s''agit de newtons divisés par des
      kilogrammes.'
  solution: 'Le newton par kilogramme (N/kg). C''est exact : g représente la force exercée par kilogramme de matière, elle
    s''exprime donc en newtons par kilogramme (N/kg).'
- id: nblm-si-l-on-etudie-le-poids-sur-la-lune-d-un-5
  type: choix
  difficulte: 2
  enonce: Si l'on étudie le poids sur la Lune d'un rover de masse m = 100 kg (sachant que g_Lune ≈ 1,6 N/kg et g_Terre ≈ 9,8
    N/kg), quelle affirmation est exacte ?
  reponse:
    options:
    - id: o1
      texte: Sa masse reste de 100 kg et son poids sur la Lune vaut 160 N.
    - id: o2
      texte: Sa masse diminue sur la Lune mais son poids reste identique.
    - id: o3
      texte: Sa masse et son poids sont tous les deux divisés par environ 6 sur la Lune.
    - id: o4
      texte: Son poids devient nul car il n'y a aucune gravité sur la Lune.
    bonnes:
    - o1
  indices:
    relance: N'oublie pas quelle grandeur reste universellement constante et quelle grandeur varie avec l'astre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est l''erreur classique : la masse est la quantité de matière et ne varie jamais. C''est le poids qui change
      selon l''astre.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : seul le poids est divisé par environ 6 car l''intensité de la pesanteur y est plus faible. La
      masse reste invariable.'
  - si:
      contient:
      - o4
    relance: 'C''est une idée reçue : la Lune a une masse et exerce donc une attraction gravitationnelle avec g ≈ 1,6 N/kg.'
  solution: 'Sa masse reste de 100 kg et son poids sur la Lune vaut 160 N. C''est exact : la masse ne varie pas selon le lieu
    (100 kg), et le poids sur la Lune se calcule par P = 100 kg × 1,6 N/kg = 160 N.'
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant les propriétés de la masse et du poids d'un corps ? (Sélectionne
    les 2 bonnes réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le poids est une force qui se mesure avec un dynamomètre en newtons (N).
    - id: o2
      texte: La masse mesure la quantité de matière, se mesure avec une balance et ne dépend pas du lieu.
    - id: o3
      texte: Le poids d'un objet conserve la même valeur sur Terre et sur la Lune.
    - id: o4
      texte: La masse d'un objet est une force verticale dirigée vers le centre de la Terre.
    bonnes:
    - o1
    - o2
  indices:
    relance: Fais bien la différence entre la force dépendant du lieu et la quantité de matière invariable.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : le poids varie avec le lieu car l''intensité de la pesanteur g change d''un astre à un autre.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la force verticale orientée vers le centre de la Terre est le poids, pas la masse.'
  solution: 'Le poids est une force qui se mesure avec un dynamomètre en newtons (N) ; La masse mesure la quantité de matière,
    se mesure avec une balance et ne dépend pas du lieu. C''est vrai : le poids est la force d''attraction subie par un objet,
    mesurée par un dynamomètre en N.'
- id: nblm-quel-est-le-nom-de-l-appareil-de-laborat-7
  type: texte_court
  difficulte: 1
  enonce: Quel est le nom de l'appareil de laboratoire utilisé pour mesurer directement la valeur du poids ou d'une force
    en newtons ?
  reponse:
    acceptees:
    - dynamomètre
    fautes_tolerees: 1
  indices:
    relance: Cet appareil contient un ressort qui s'allonge lorsqu'une force lui est appliquée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: dynamomètre. Le dynamomètre est l'appareil doté d'un ressort gradué servant à mesurer les forces en newtons.
- id: nblm-dans-la-relation-du-poids-p-m-g-comment-8
  type: texte_court
  difficulte: 1
  enonce: Dans la relation du poids P = m × g, comment appelle-t-on la grandeur représentée par la lettre g ?
  reponse:
    acceptees:
    - intensité de la pesanteur
    fautes_tolerees: 1
  indices:
    relance: Cette grandeur qualifie la force d'attraction par unité de masse propre à un astre donné.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: intensité de la pesanteur. La lettre g désigne l'intensité de la pesanteur, exprimée en newtons par kilogramme
    (N/kg).
- id: masse-depuis-le-poids
  type: nombre
  difficulte: 2
  enonce: Sur Terre (g = 9,8 N/kg), le poids d'un cartable est de 58,8 N. Quelle est sa masse, en kg ? Écris seulement le
    nombre.
  reponse:
    valeur: 6
    forme: libre
  indices:
    relance: 'On connaît le poids et g. On cherche la masse : quelle relation permet de la retrouver ?'
    methode: P = m × g, donc m = P ÷ g.
    etape: Calcule 58,8 ÷ 9,8.
  pieges:
  - si:
      valeur: 576.24
    relance: Tu as multiplié P par g. Pour trouver m, il faut diviser.
  - si:
      valeur: 58.8
    relance: Ce nombre est le poids. La masse s'obtient avec une division par g.
  solution: m = P ÷ g = 58,8 ÷ 9,8 = 6 kg.
- id: caracteristiques-du-poids
  type: choix
  difficulte: 2
  enonce: Un livre est posé sur une table. Quelles sont les caractéristiques de son poids ?
  reponse:
    options:
    - id: a
      texte: direction verticale
    - id: b
      texte: sens vers le bas
    - id: c
      texte: point d'application au centre de gravité du livre
    - id: d
      texte: direction horizontale
    - id: e
      texte: sens vers le haut
    bonnes:
    - a
    - b
    - c
  indices:
    relance: 'Pense à ce qui se passe quand on lâche le livre : dans quelle direction et quel sens tombe-t-il ?'
    methode: 'Le poids est l''attraction de la Terre : il est dirigé vers le centre de la Terre. Il s''applique au centre
      de gravité.'
    etape: 'Élimine les options horizontale et vers le haut : elles contredisent la chute d''un objet lâché.'
  pieges:
  - si:
      contient:
      - d
    relance: 'Un objet lâché ne part pas sur le côté : sa chute n''est pas horizontale.'
  - si:
      contient:
      - e
    relance: Un objet lâché ne monte pas tout seul. Vers où la Terre l'attire-t-elle ?
  solution: Le poids a pour direction la verticale, pour sens vers le bas, et s'applique au centre de gravité.
