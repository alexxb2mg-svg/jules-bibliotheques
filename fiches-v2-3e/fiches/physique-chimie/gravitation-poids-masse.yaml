format: 2
notion: gravitation-poids-masse
version: 1
etat: verifiee
declencheurs:
- poids en newton
- formule P égale m fois g
- différence poids masse
- peser moins sur la Lune
- intensité de la pesanteur
- masse en kilogrammes
prerequis: []
essentiel: 'La gravitation est l''interaction attractive qui existe entre deux objets du seul fait de leur matière ; elle
  s''exerce à distance, sans contact.


  À la surface d''un astre (Terre, Lune...), la gravitation se manifeste par le poids : la force d''attraction qui attire
  tout objet vers le centre de l''astre. Elle se calcule par P = m x g, avec P le poids en newtons (N), m la masse en kilogrammes
  (kg) et g l''intensité de la pesanteur, en N/kg.


  Sur Terre, g vaut environ 9,8 N/kg ; il est différent sur d''autres astres (environ 1,6 N/kg sur la Lune, six fois plus
  faible que sur Terre).


  La masse d''un objet est une propriété de la matière qu''il contient : elle ne change pas selon l''endroit où l''on se trouve
  (mesurée en kg avec une balance).


  Le poids, en revanche, dépend du lieu (de la valeur de g) : un même objet pèse moins sur la Lune que sur la Terre, bien
  que sa masse reste identique (mesuré en N avec un dynamomètre).'
methode:
- Bien distinguer masse (kg, propriété de l'objet, invariable) et poids (N, force qui dépend du lieu).
- Utiliser P = m x g pour calculer un poids à partir d'une masse et de la valeur de g du lieu.
- 'Pour retrouver la masse à partir du poids, diviser par g : m = P / g.'
- 'Retenir l''ordre de grandeur : g est environ 9,8 N/kg sur Terre, environ 6 fois moins sur la Lune.'
vocabulaire:
- terme: masse
  definition: quantité de matière d'un objet, en kilogrammes (kg), qui ne dépend pas du lieu où l'on se trouve
- terme: poids
  definition: force d'attraction exercée par un astre sur un objet, en newtons (N), qui dépend du lieu (de g)
- terme: pesanteur
  definition: intensité de l'attraction d'un astre sur les objets à sa surface, notée g, en newtons par kilogramme (N/kg)
erreurs_frequentes:
- Confondre masse et poids, et leurs unités (kg pour la masse, N pour le poids).
- Croire que la masse d'un objet change selon l'endroit où il se trouve.
- Oublier de convertir si la masse est donnée en grammes (il faut des kg dans P = m x g).
- Utiliser la valeur de g de la Terre pour calculer un poids sur la Lune.
exemple:
  enonce: Calculer le poids sur Terre d'une personne de masse 70 kg (g = 9,8 N/kg).
  solution: P = m x g = 70 x 9,8 = 686 N.
exercices:
- id: poids-sur-terre
  type: nombre
  difficulte: 1
  enonce: Un sac a une masse de 50 kg. Calcule son poids sur Terre, en newtons (g = 9,8 N/kg).
  reponse:
    valeur: 490
    forme: entier
    tolerance: 1
  indices:
    relance: Quelle formule relie le poids, la masse et g ?
    methode: Utilise P = m x g, avec m en kg et g = 9,8 N/kg.
    etape: 'Remplace : P = 50 x 9,8. Termine le calcul.'
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie ta multiplication : 50 x 9,8, pas 50 + 9,8.'
  solution: P = m x g = 50 x 9,8 = 490 N.
- id: masse-depuis-poids
  type: nombre
  difficulte: 2
  enonce: Un objet a un poids de 98 N sur Terre (g = 9,8 N/kg). Calcule sa masse, en kg.
  reponse:
    valeur: 10
    forme: entier
    tolerance: 0.1
  indices:
    relance: Comment isoler la masse dans P = m x g ?
    methode: Utilise m = P / g.
    etape: Remplace P et g par leurs valeurs dans m = P / g, puis pose la division.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Repose ta division P / g sans te tromper de virgule.
  solution: m = P / g = 98 / 9,8 = 10 kg.
- id: vrai-sur-lune
  type: choix
  difficulte: 2
  enonce: Une personne de masse 60 kg part sur la Lune (g = 1,6 N/kg). Que se passe-t-il par rapport à sa situation sur Terre
    ?
  reponse:
    options:
    - id: a
      texte: Sa masse reste 60 kg, mais son poids diminue.
    - id: b
      texte: Sa masse diminue, mais son poids reste le même.
    - id: c
      texte: Sa masse et son poids restent tous les deux identiques.
    bonnes:
    - a
  indices:
    relance: Laquelle des deux grandeurs, masse ou poids, dépend du lieu ?
    methode: La masse est une propriété de la matière ; le poids dépend de g, qui change d'un astre à l'autre.
    etape: 'g est plus petit sur la Lune que sur Terre : que devient P = m x g si g diminue et m ne change pas ?'
  pieges:
  - si:
      contient:
      - b
    relance: La masse ne dépend pas du lieu où l'on se trouve. Relis la définition de la masse.
  - si:
      contient:
      - c
    relance: g n'a pas la même valeur sur la Lune que sur Terre. Est-ce que P = m x g peut rester identique ?
  solution: Sa masse reste 60 kg (elle ne dépend pas du lieu), mais son poids diminue car g est plus faible sur la Lune (1,6
    N/kg contre 9,8 N/kg sur Terre).
- id: unite-poids
  type: texte_court
  difficulte: 1
  enonce: Dans quelle unité exprime-t-on le poids d'un objet ?
  reponse:
    acceptees:
    - newton
    - newtons
    fautes_tolerees: 1
  indices:
    relance: Ce n'est pas l'unité de la masse.
    methode: C'est l'unité d'une force, notée N.
    etape: Elle porte le nom d'un physicien anglais.
  pieges:
  - si:
      valeur: kilogramme
    relance: Le kilogramme est l'unité de la masse, pas du poids. Le poids est une force.
  solution: Le poids se mesure en newtons (N), unité de force.
- id: associer-grandeurs-unites
  type: association
  difficulte: 2
  enonce: Relie chaque grandeur à son unité.
  reponse:
    gauche:
    - id: a
      texte: masse
    - id: b
      texte: poids
    - id: c
      texte: intensité de la pesanteur (g)
    droite:
    - id: x
      texte: kilogramme (kg)
    - id: y
      texte: newton (N)
    - id: z
      texte: newton par kilogramme (N/kg)
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'La masse et le poids n''ont pas la même unité : laquelle se pèse avec une balance, laquelle avec un dynamomètre
      ?'
    methode: 'P = m x g : regarde quelle unité est nécessaire à chaque grandeur pour que l''égalité fonctionne.'
    etape: La masse se mesure en kg. Le poids, une force, se mesure en N. Il reste g.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends la formule P = m x g et l'unité de chaque terme.
  - si:
      diagnostic: associations_fausses
    relance: Repars de la masse (kg, avec une balance) et du poids (N, avec un dynamomètre), puis place g.
  solution: Masse -> kilogramme (kg) ; poids -> newton (N) ; intensité de la pesanteur (g) -> newton par kilogramme (N/kg).
- id: expliquer-apesanteur
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi un astronaute flotte en apesanteur dans une station spatiale, alors que la gravitation terrestre
    y existe encore.
  criteres:
  - L'élève dit que la gravitation terrestre agit toujours sur la station et l'astronaute.
  - L'élève explique que la station et l'astronaute sont en chute libre continue autour de la Terre.
  - L'élève conclut qu'il ne s'agit pas d'une absence de gravitation mais d'un état de chute libre permanent.
  indices:
    relance: L'apesanteur signifie-t-elle qu'il n'y a plus de gravitation du tout ?
    methode: 'Pense au mouvement de la station : elle tombe en permanence autour de la Terre, comme l''astronaute à l''intérieur.'
    etape: Commence par rappeler que la gravitation terrestre agit toujours sur la station, même en orbite.
  solution: 'La gravitation terrestre agit toujours sur la station et sur l''astronaute. Mais la station et l''astronaute
    sont tous les deux en état de chute libre continue autour de la Terre : ils tombent ensemble en permanence, ce qui donne
    une impesanteur apparente, bien que la gravitation terrestre agisse toujours sur eux.'
