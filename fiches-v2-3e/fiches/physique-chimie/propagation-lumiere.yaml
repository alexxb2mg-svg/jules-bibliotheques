# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: propagation-lumiere
version: 2
etat: verifiee
declencheurs:
- source primaire
- objet diffusant
- lumière en ligne droite
- distance en années-lumière
- trajet de la lumière
- vitesse de la lumière
- modèle du rayon
- distance parcourue par la lumière
- lumière du Soleil met
prerequis:
- vitesse-mouvement
essentiel: 'Une source primaire produit elle-même la lumière qu''elle émet : le Soleil, une étoile, une lampe allumée, une
  flamme, l''écran allumé d''un téléphone.


  Un objet diffusant ne produit pas de lumière. Il renvoie dans toutes les directions une partie de la lumière qu''il reçoit
  : la Lune, une planète, un livre, un mur. Il ne se voit que s''il est éclairé.


  On voit un objet quand de la lumière venant de lui (émise ou diffusée) entre dans notre œil.


  Dans le vide, et dans un milieu transparent et homogène (l''air, l''eau pure, le verre), la lumière se propage en ligne
  droite : c''est la propagation rectiligne. On le vérifie en alignant des trous percés dans des cartons : la lumière ne passe
  que si les trous sont alignés.


  Le rayon lumineux est un modèle : une droite fléchée dans le sens de propagation. Ce n''est pas un objet réel. On l''utilise
  pour représenter le trajet de la lumière, de la source vers l''œil.


  La lumière se propage même dans le vide, à environ 300 000 km/s. Elle est très rapide, mais pas instantanée : d = v × t
  (d en km, v en km/s, t en s).


  L''année-lumière (al) est une unité de distance : c''est la distance parcourue par la lumière dans le vide en un an, environ
  9 500 milliards de kilomètres. Une étoile à 10 al est si loin que sa lumière a voyagé 10 ans pour nous parvenir. Ce n''est
  pas une durée.


  Au brevet : classer des objets (source primaire ou diffusant), tracer un rayon lumineux, calculer une distance ou une durée
  avec d = v × t, et expliquer ce qu''est une année-lumière.

  '
methode:
- 'Pour classer un objet : se demander s''il produit sa lumière (source primaire) ou s''il renvoie celle qu''il reçoit (objet
  diffusant).'
- 'Pour tracer le trajet de la lumière : partir de la source, tracer des segments de droite fléchés jusqu''à l''œil ; un objet
  diffusant renvoie la lumière dans toutes les directions.'
- 'Pour une distance ou une durée : utiliser d = v × t (ou t = d ÷ v), avec v en km/s, d en km et t en secondes.'
- 'Penser à convertir : 1 min = 60 s ; 1 h = 3 600 s.'
- 'Pour une année-lumière : une étoile à n années-lumière est à la distance que la lumière parcourt en n ans.'
vocabulaire:
- terme: source primaire
  definition: Objet qui produit la lumière qu'il émet.
- terme: objet diffusant
  definition: Objet qui renvoie dans toutes les directions une partie de la lumière qu'il reçoit.
- terme: rayon lumineux
  definition: Droite fléchée qui modélise le trajet de la lumière.
- terme: propagation rectiligne
  definition: Déplacement de la lumière en ligne droite.
- terme: milieu transparent et homogène
  definition: Milieu qui laisse passer la lumière et qui a les mêmes propriétés partout (l'air, par exemple).
- terme: vide
  definition: Espace sans matière ; la lumière s'y propage.
- terme: année-lumière
  definition: 'Unité de distance : distance parcourue par la lumière dans le vide en une année.'
erreurs_frequentes:
- 'Croire que la Lune produit sa propre lumière : elle diffuse la lumière du Soleil.'
- 'Flécher le rayon de l''œil vers l''objet : la lumière va de l''objet vers l''œil.'
- Prendre l'année-lumière pour une durée.
- Oublier de convertir les minutes en secondes avant d'utiliser 300 000 km/s.
- 'Croire qu''un rayon lumineux est un objet réel : c''est un modèle, une droite fléchée.'
exemple:
  enonce: La lumière de la Lune met environ 1,3 s pour arriver sur Terre. À quelle distance est la Lune ?
  solution: 'd = v × t = 300 000 km/s × 1,3 s ≈ 390 000 km : la Lune est à environ 390 000 km de la Terre. La Lune ne produit
    pas cette lumière : elle diffuse celle du Soleil.'
exercices:
- id: sources-primaires
  type: choix
  difficulte: 1
  enonce: Parmi ces objets, lesquels sont des sources primaires de lumière ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: le Soleil
    - id: b
      texte: la Lune
    - id: c
      texte: une lampe allumée
    - id: d
      texte: une feuille de papier
    - id: e
      texte: la flamme d'une bougie
    bonnes:
    - a
    - c
    - e
  indices:
    relance: 'Pour chaque objet, se demander : produit-il sa propre lumière ?'
    methode: 'Imagine chaque objet dans une pièce complètement noire : lesquels verrais-tu encore ?'
    etape: 'La feuille de papier n''est visible que si on l''éclaire : ce n''est pas une source primaire. Continue avec les
      autres.'
  pieges:
  - si:
      contient:
      - b
    relance: La Lune brille la nuit, mais produit-elle sa lumière ? D'où vient la lumière qu'elle nous renvoie ?
  - si:
      contient:
      - d
    relance: Une feuille blanche paraît lumineuse au soleil. La verrais-tu dans le noir complet ?
  - si:
      diagnostic: incomplet
    relance: 'Il en manque. Relis la liste : quels autres objets produisent eux-mêmes de la lumière ?'
  solution: 'Le Soleil, la lampe allumée et la flamme produisent leur lumière : ce sont des sources primaires. La Lune et
    la feuille sont des objets diffusants.'
- id: nom-modele-trajet
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la droite fléchée qui représente le trajet de la lumière ?
  reponse:
    acceptees:
    - rayon lumineux
    - rayon de lumière
    - rayon
    fautes_tolerees: 1
  indices:
    relance: On dessine le trajet de la lumière avec un modèle. Comment s'appelle-t-il ?
    methode: Pense au mot qu'on emploie aussi pour les segments qui partent du centre d'un cercle.
    etape: C'est un nom suivi de l'adjectif « lumineux ».
  pieges:
  - si:
      valeur: faisceau
    relance: Un faisceau, c'est un ensemble de lumière. Comment s'appelle une seule droite fléchée ?
  solution: 'C''est un rayon lumineux : une droite fléchée dans le sens de propagation de la lumière.'
- id: sens-annee-lumiere
  type: choix
  difficulte: 1
  enonce: Une étoile est à 100 années-lumière de la Terre. Que signifie cette phrase ?
  reponse:
    options:
    - id: a
      texte: L'étoile existe depuis 100 ans.
    - id: b
      texte: La lumière de l'étoile met 100 ans pour arriver jusqu'à nous.
    - id: c
      texte: L'étoile est à une distance égale à celle que parcourt la lumière en 100 ans.
    - id: d
      texte: Il faut 100 ans à une fusée pour atteindre l'étoile.
    bonnes:
    - b
    - c
  indices:
    relance: L'année-lumière mesure-t-elle une durée ou une distance ?
    methode: 'Relis la définition : c''est la distance parcourue par la lumière dans le vide en une année.'
    etape: Si la lumière parcourt une année-lumière en un an, combien de temps lui faut-il pour en parcourir plusieurs ?
  pieges:
  - si:
      contient:
      - a
    relance: L'année-lumière parle-t-elle de l'âge de l'étoile ? Relis sa définition.
  - si:
      contient:
      - d
    relance: Une fusée va-t-elle aussi vite que la lumière ?
  - si:
      diagnostic: incomplet
    relance: 'Il y a deux bonnes réponses : une qui parle de distance et une qui parle de durée du trajet de la lumière.'
  solution: 'L''année-lumière est une distance : l''étoile est à la distance que la lumière parcourt en 100 ans ; donc sa
    lumière met 100 ans pour nous parvenir. Une fusée, bien plus lente, mettrait beaucoup plus longtemps.'
- id: classer-objets
  type: association
  difficulte: 1
  enonce: 'Classe chaque objet : source primaire ou objet diffusant. Réponds par des paires, par exemple a-primaire.'
  reponse:
    gauche:
    - id: a
      texte: le Soleil
    - id: b
      texte: la Lune
    - id: c
      texte: l'écran allumé d'une télévision
    - id: d
      texte: une page de cahier
    droite:
    - id: primaire
      texte: source primaire
    - id: diffusant
      texte: objet diffusant
    paires:
      a: primaire
      b: diffusant
      c: primaire
      d: diffusant
  indices:
    relance: 'Pour chaque objet, demande-toi : produit-il sa lumière, ou renvoie-t-il celle qu''il reçoit ?'
    methode: Un objet qu'on ne voit plus dans le noir complet est un objet diffusant.
    etape: La Lune est vue grâce à la lumière qu'elle reçoit du Soleil. Dans quelle colonne la ranger ? Fais de même pour
      les trois autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère l'objet qui ne fait que renvoyer la lumière d'un autre.
  - si:
      diagnostic: associations_fausses
    relance: 'Plusieurs associations sont fausses. Reprends chaque objet : produit-il sa lumière ?'
  solution: 'Le Soleil et l''écran allumé produisent leur lumière : sources primaires. La Lune et la page de cahier renvoient
    la lumière reçue : objets diffusants.'
- id: voir-un-livre
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre ce qui se passe quand tu vois un livre posé sous une lampe.
  reponse:
    elements:
    - id: a
      texte: La lampe produit de la lumière.
    - id: b
      texte: La lumière se propage en ligne droite jusqu'au livre.
    - id: c
      texte: Le livre diffuse la lumière dans toutes les directions.
    - id: d
      texte: Une partie de cette lumière entre dans ton œil.
  indices:
    relance: D'où part la lumière, et où finit-elle son trajet ?
    methode: 'Suis la lumière pas à pas : la source, puis l''objet éclairé, puis le récepteur.'
    etape: Le trajet commence à la lampe. Que se passe-t-il quand la lumière atteint le livre ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont échangées. La lumière peut-elle être diffusée avant d'arriver sur le livre
      ?
  - si:
      diagnostic: ordre_faux
    relance: 'L''œil n''envoie pas de lumière : il la reçoit. Recommence en partant de la lampe.'
  solution: La lampe produit la lumière, qui se propage en ligne droite jusqu'au livre ; le livre la diffuse dans toutes les
    directions ; une partie entre dans l'œil.
- id: distance-soleil
  type: nombre
  difficulte: 2
  enonce: La lumière du Soleil met environ 8 min 20 s pour arriver sur Terre. Sa vitesse est d'environ 300 000 km/s. Calcule
    la distance Soleil-Terre en kilomètres. Écris seulement le nombre.
  reponse:
    valeur: 150000000
    forme: libre
  indices:
    relance: 'La vitesse est donnée en km par seconde : dans quelle unité faut-il écrire la durée ?'
    methode: Convertis la durée en secondes (1 min = 60 s), puis utilise d = v × t.
    etape: 8 min = 480 s, donc 8 min 20 s = 500 s. Multiplie maintenant la vitesse par cette durée.
  pieges:
  - si:
      valeur: 2400000
    relance: Tu as multiplié par 8, un nombre de minutes. Convertis toute la durée en secondes.
  - si:
      valeur: 2460000
    relance: 8 min 20 s, ce n'est pas 8,2 min. Convertis toute la durée en secondes.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta conversion en secondes, puis refais d = v × t en comptant bien les zéros.
  solution: t = 8 × 60 + 20 = 500 s, donc d = v × t = 300 000 × 500 = 150 000 000 km (150 millions de km).
- id: duree-sonde
  type: nombre
  difficulte: 2
  enonce: Une sonde spatiale est à 3 000 000 000 km de la Terre. La lumière se propage à 300 000 km/s. Combien de secondes
    met un signal lumineux pour l'atteindre ? Écris seulement le nombre.
  reponse:
    valeur: 10000
    forme: libre
  indices:
    relance: Quelle relation relie la distance, la vitesse et la durée ? Que cherches-tu ?
    methode: 'Pour trouver la durée : t = d ÷ v, avec d en km et v en km/s. Le résultat est en secondes.'
    etape: Divise 3 000 000 000 par 300 000. Tu peux d'abord enlever les mêmes zéros en haut et en bas.
  pieges:
  - si:
      valeur: 0,0001
    relance: Tu as divisé la vitesse par la distance. Vérifie l'ordre de la division.
  - si:
      valeur: 900000000000000
    relance: Tu as multiplié. Une durée s'obtient en divisant la distance par la vitesse.
  - si:
      diagnostic: valeur_fausse
    relance: Refais la division de la distance en km par la vitesse en km/s.
  solution: t = d ÷ v = 3 000 000 000 ÷ 300 000 = 10 000 s.
- id: trous-alignes
  type: ouverte
  difficulte: 3
  enonce: On place trois cartons percés d'un petit trou entre une lampe et ton œil. Tu ne vois la lampe que si les trois trous
    sont alignés. Explique ce que cette expérience montre.
  criteres:
  - L'élève dit que la lumière se propage en ligne droite (dans l'air, milieu transparent et homogène).
  - L'élève explique que si un trou n'est pas aligné, un carton arrête la lumière et elle n'arrive pas à l'œil.
  - L'élève peut représenter la situation par un rayon lumineux allant de la lampe vers l'œil.
  indices:
    relance: Que faut-il pour que tu voies la lampe ?
    methode: Pense au chemin que suit la lumière entre la lampe et ton œil, et à ce qui se passe si un carton est décalé.
    etape: Quand un carton est décalé, la lumière rencontre le carton. Peut-elle le contourner ?
  solution: 'La lumière ne passe que si les trous sont alignés : elle ne peut pas contourner un carton. Cela montre que la
    lumière se propage en ligne droite dans l''air. On modélise son trajet par un rayon lumineux de la lampe vers l''œil.'
- id: nblm-parmi-les-propositions-suivantes-laquell-1
  type: choix
  difficulte: 2
  enonce: Parmi les propositions suivantes, laquelle désigne une source primaire de lumière ?
  reponse:
    options:
    - id: o1
      texte: Le Soleil
    - id: o2
      texte: La Lune
    - id: o3
      texte: Un livre
    - id: o4
      texte: Un miroir
    bonnes:
    - o1
  indices:
    relance: Réfléchis à quel objet fabrique lui-même la lumière qu'il émet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la Lune ne produit pas de lumière, elle diffuse la lumière qu''elle reçoit du Soleil.'
  - si:
      contient:
      - o3
    relance: 'Faux : un livre ne fabrique pas de lumière, il s''agit d''un objet diffusant qui renvoie la lumière éclairante.'
  - si:
      contient:
      - o4
    relance: 'Faux : un miroir renvoie la lumière reçue mais n''en produit pas par lui-même.'
  solution: 'Le Soleil. C''est exact : le Soleil fabrique et émet sa propre lumière, c''est donc une source primaire.'
- id: nblm-dans-un-milieu-transparent-et-homogene-c-2
  type: choix
  difficulte: 2
  enonce: Dans un milieu transparent et homogène comme l'air, comment la lumière se propage-t-elle ?
  reponse:
    options:
    - id: o1
      texte: En ligne droite
    - id: o2
      texte: En ligne courbe
    - id: o3
      texte: En zigzag
    - id: o4
      texte: En cercle
    bonnes:
    - o1
  indices:
    relance: Pense à la forme du rayon lumineux représenté en physique-chimie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la lumière ne courbe pas sa trajectoire dans un milieu homogène.'
  - si:
      contient:
      - o3
    relance: 'Faux : la propagation n''est pas désordonnée, elle suit des lignes droites.'
  - si:
      contient:
      - o4
    relance: 'Faux : la lumière ne tourne pas en boucle sans obstacle.'
  solution: 'En ligne droite. C''est exact : dans un milieu transparent et homogène, la lumière se déplace de façon rectiligne.'
- id: nblm-quelle-est-la-valeur-de-la-vitesse-de-la-3
  type: choix
  difficulte: 2
  enonce: Quelle est la valeur de la vitesse de la lumière dans le vide ?
  reponse:
    options:
    - id: o1
      texte: 300 000 km/s
    - id: o2
      texte: 340 m/s
    - id: o3
      texte: 300 000 m/s
    - id: o4
      texte: 3 000 km/h
    bonnes:
    - o1
  indices:
    relance: Ne confonds pas la vitesse du signal lumineux avec celle du signal sonore.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : 340 m/s correspond à la vitesse du son dans l''air.'
  - si:
      contient:
      - o4
    relance: 'Faux : cette valeur est très inférieure à la réalité et l''unité de temps n''est pas la bonne.'
  solution: '300 000 km/s. C''est exact : la lumière se propage dans le vide à environ 300 000 kilomètres par seconde.'
- id: nblm-que-mesure-exactement-une-annee-lumiere-4
  type: choix
  difficulte: 2
  enonce: Que mesure exactement une année-lumière ?
  reponse:
    options:
    - id: o1
      texte: Une distance en astronomie
    - id: o2
      texte: Une durée d'une année
    - id: o3
      texte: Une vitesse de déplacement
    - id: o4
      texte: Une intensité lumineuse
    bonnes:
    - o1
  indices:
    relance: Méfie-toi du mot 'année' qui peut induire en erreur sur la grandeur physique mesurée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : malgré la présence du mot ''année'', ce n''est pas une durée mais une distance.'
  - si:
      contient:
      - o3
    relance: 'Faux : une vitesse s''exprime en km/s ou m/s, alors que l''année-lumière mesure une longueur.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''année-lumière ne quantifie pas la quantité ou l''éclat de la lumière.'
  solution: 'Une distance en astronomie. C''est exact : l''année-lumière est la distance parcourue par la lumière dans le
    vide en un an.'
- id: nblm-comment-doit-on-flecher-un-rayon-lumineu-5
  type: choix
  difficulte: 2
  enonce: Comment doit-on flécher un rayon lumineux pour représenter le trajet de la lumière lorsqu'on observe un objet ?
  reponse:
    options:
    - id: o1
      texte: De l'objet vers l'œil
    - id: o2
      texte: De l'œil vers l'objet
    - id: o3
      texte: Dans les deux sens simultanément
    - id: o4
      texte: Vers le sol
    bonnes:
    - o1
  indices:
    relance: Réfléchis au sens dans lequel l'énergie lumineuse se déplace pour permettre la vision.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''œil ne projette pas de lumière, il la reçoit.'
  - si:
      contient:
      - o3
    relance: 'Faux : la lumière se déplace dans un sens unique de la source/objet vers le récepteur.'
  - si:
      contient:
      - o4
    relance: 'Faux : la direction dépend de la position relative de l''objet et de l''observateur.'
  solution: 'De l''objet vers l''œil. C''est exact : la lumière part de l''objet (émetteur ou diffusant) et entre dans l''œil
    du récepteur.'
- id: nblm-parmi-les-elements-suivants-lesquels-son-6
  type: choix
  difficulte: 3
  enonce: Parmi les éléments suivants, lesquels sont des objets diffusants ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La Lune
    - id: o2
      texte: Un panneau de signalisation éclairé
    - id: o3
      texte: Une luciole éclairée
    - id: o4
      texte: Le Soleil
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux corps qui ne fabriquent pas leur propre lumière mais reflètent celle qu'ils reçoivent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : la luciole produit sa propre lumière biologique, c''est une source primaire.'
  - si:
      contient:
      - o4
    relance: 'Faux : le Soleil fabrique sa propre lumière, c''est la source primaire principale du système solaire.'
  solution: 'La Lune ; Un panneau de signalisation éclairé. C''est exact : la Lune ne produit pas de lumière, elle renvoie
    la lumière du Soleil.'
- id: nblm-un-corps-qui-ne-fabrique-pas-sa-propre-l-7
  type: texte_court
  difficulte: 1
  enonce: Un corps qui ne fabrique pas sa propre lumière mais renvoie dans toutes les directions celle qu'il reçoit est un
    objet ____.
  reponse:
    acceptees:
    - diffusant
    fautes_tolerees: 1
  indices:
    relance: Cherche l'adjectif qualificatif associé au verbe diffuser.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'diffusant. C''est exact : le qualificatif ''diffusant'' s''applique aux objets qui renvoient la lumière reçue.'
- id: nblm-pour-modeliser-le-trajet-de-la-lumiere-e-8
  type: texte_court
  difficulte: 1
  enonce: Pour modéliser le trajet de la lumière en ligne droite, on trace une droite fléchée appelée ____ lumineux.
  reponse:
    acceptees:
    - rayon
