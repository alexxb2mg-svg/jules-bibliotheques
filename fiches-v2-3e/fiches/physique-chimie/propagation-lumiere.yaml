format: 2
notion: propagation-lumiere
version: 1
etat: verifiee
declencheurs:
- vitesse de la lumière dans le vide
- distance en année-lumière
- modèle du rayon lumineux
- source primaire de lumière
- objet qui diffuse la lumière
- temps mis par la lumière du Soleil
prerequis: []
essentiel: 'Une source primaire de lumière produit elle-même de la lumière (le Soleil, une ampoule allumée) ; un objet diffusant
  ne produit pas de lumière, il renvoie dans toutes les directions la lumière qu''il reçoit (la Lune, une page de livre, la
  plupart des objets qui nous entourent).


  Dans le vide (et approximativement dans l''air), la lumière se propage en ligne droite : on modélise sa trajectoire par
  un rayon lumineux, une flèche représentant le trajet de la lumière.


  La lumière se propage extrêmement vite : environ 300 000 km par seconde dans le vide, une vitesse bien supérieure à toutes
  les vitesses courantes.


  L''année-lumière (a.l.) est la distance parcourue par la lumière en une année ; elle sert d''unité pour exprimer les très
  grandes distances entre étoiles (environ 9 460 milliards de km, soit 9,46 x 10 puissance 12 km).


  Comme la lumière met du temps à voyager, observer un objet très lointain (une étoile) revient à le voir tel qu''il était
  dans le passé, au moment où la lumière a quitté sa surface.'
methode:
- Distingue source primaire (produit sa propre lumière) et objet diffusant (renvoie la lumière reçue).
- Utilise le modèle du rayon lumineux (trajet rectiligne) pour représenter la propagation de la lumière.
- Pour calculer un temps de propagation, utilise t = d / c, avec c environ égal à 300 000 km/s.
- Pour convertir une distance en années-lumière en kilomètres, multiplie par la distance parcourue en un an (environ 9,46
  x 10 puissance 12 km).
vocabulaire:
- terme: source primaire
  definition: objet qui produit lui-même de la lumière (le Soleil, une ampoule allumée)
- terme: objet diffusant
  definition: objet qui ne produit pas de lumière mais renvoie dans toutes les directions la lumière qu'il reçoit
- terme: année-lumière
  definition: distance parcourue par la lumière en une année, environ 9,46 x 10 puissance 12 km
erreurs_frequentes:
- Croire que la Lune ou les planètes produisent leur propre lumière (elles diffusent celle du Soleil).
- Confondre année-lumière (une distance) avec une durée.
- Oublier que la lumière met du temps à parcourir de grandes distances, même si ce temps semble négligeable à l'échelle de
  la Terre.
- Se tromper d'ordre de grandeur pour la vitesse de la lumière (elle n'est pas infinie, mais très grande).
exemple:
  enonce: Le Soleil est à environ 150 millions de km de la Terre. Combien de temps met sa lumière pour nous parvenir (c environ
    égal à 300 000 km/s) ?
  solution: t = d / c = 150 000 000 / 300 000 = 500 s, soit 8 min 20 s.
exercices:
- id: temps-lumiere-lune
  type: nombre
  difficulte: 1
  enonce: La Lune est à environ 384 000 km de la Terre. Calcule le temps mis par sa lumière (renvoyée du Soleil) pour nous
    parvenir, en secondes (c environ égal à 300 000 km/s).
  reponse:
    valeur: 1.28
    forme: libre
    tolerance: 0.05
  indices:
    relance: Quelle formule relie temps, distance et vitesse ?
    methode: Utilise t = d / c.
    etape: Remplace d et c par les valeurs de l'énoncé, puis effectue la division.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta division de la distance par la vitesse de la lumière.
  solution: t = d / c = 384 000 / 300 000 = 1,28 s.
- id: source-ou-diffusant
  type: choix
  difficulte: 1
  enonce: Une page de livre éclairée par une lampe est-elle une source primaire de lumière ou un objet diffusant ?
  reponse:
    options:
    - id: a
      texte: un objet diffusant
    - id: b
      texte: une source primaire
    - id: c
      texte: ni l'un ni l'autre, elle n'a rien à voir avec la lumière
    bonnes:
    - a
  indices:
    relance: La page produit-elle sa propre lumière ?
    methode: Une source primaire produit sa propre lumière ; un autre type d'objet ne fait que renvoyer la lumière qu'il reçoit.
    etape: 'La page ne s''allume pas toute seule dans le noir : elle a besoin de la lampe pour être visible.'
  pieges:
  - si:
      contient:
      - b
    relance: Une source primaire produit elle-même de la lumière, comme le Soleil ou une ampoule allumée ; la page ne fait
      que renvoyer la lumière de la lampe.
  - si:
      contient:
      - c
    relance: 'La page interagit bien avec la lumière : elle la reçoit et la renvoie vers nos yeux, sans en produire elle-même.'
  solution: 'C''est un objet diffusant : elle renvoie la lumière de la lampe, elle n''en produit pas.'
- id: convertir-annee-lumiere
  type: nombre
  difficulte: 2
  enonce: L'étoile la plus proche du Soleil, Proxima du Centaure, est à environ 4,2 années-lumière. Convertis cette distance
    en milliards de km (1 a.l. environ égal à 9,46 x 10 puissance 12 km, soit 9460 milliards de km).
  reponse:
    valeur: 39732
    forme: libre
    tolerance: 200
  indices:
    relance: Combien de milliards de km parcourt la lumière en une année ?
    methode: Multiplie 4,2 par 9460 (milliards de km parcourus en une année-lumière).
    etape: Pose la multiplication 4,2 fois 9460 et termine le calcul.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta multiplication de 4,2 par 9460 milliards de km.
  solution: 4,2 x 9460 est environ égal à 39 732 milliards de km.
- id: definir-rayon-lumineux
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le modèle qui représente le trajet rectiligne de la lumière par une flèche ?
  reponse:
    acceptees:
    - rayon lumineux
    fautes_tolerees: 1
  indices:
    relance: Ce modèle sert à représenter la propagation en ligne droite de la lumière.
    methode: Le mot évoque une ligne fine, comme un rayon de Soleil qu'on dessine.
    etape: C'est une flèche qui représente le trajet suivi par la lumière.
  pieges:
  - si:
      valeur: année-lumière
    relance: L'année-lumière est une unité de distance, pas le nom du modèle qui représente le trajet de la lumière.
  solution: 'C''est le rayon lumineux : une flèche représentant le trajet rectiligne de la lumière.'
- id: expliquer-voir-le-passe
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi observer une étoile très lointaine revient à la voir « telle qu'elle était dans le passé ».
  criteres:
  - L'élève explique que la lumière met du temps à parcourir la distance jusqu'à nous, même si elle est très rapide.
  - L'élève relie ce temps de parcours au fait que la lumière reçue a été émise il y a longtemps.
  - L'élève conclut que l'image observée montre l'état passé de l'étoile, pas son état actuel.
  indices:
    relance: La lumière est très rapide, mais met-elle un temps nul pour parcourir de très grandes distances ?
    methode: Pense au temps de parcours t = d / c pour une distance de plusieurs années-lumière.
    etape: Commence par rappeler que la lumière met du temps à voyager, même si ce temps est énorme pour de grandes distances.
  solution: 'La lumière que l''on reçoit d''une étoile lointaine a mis parfois des milliers d''années à parcourir la distance
    jusqu''à nous, car même si sa vitesse est très grande (environ 300 000 km/s), les distances entre étoiles sont elles-mêmes
    immenses. La lumière observée montre donc l''état de l''étoile au moment où elle a été émise, pas son état actuel : on
    la voit telle qu''elle était dans le passé.'
