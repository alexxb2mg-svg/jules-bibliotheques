format: 2
notion: bilan-energetique-conservation
version: 1
etat: verifiee
declencheurs:
- énergie perdue en chaleur
- appareil qui chauffe pour rien
- rendement d'un appareil
- P égale E sur t
- somme des puissances en sortie
- énergie utile
prerequis:
- formes-energie
essentiel: 'L''énergie totale d''un système isolé se conserve toujours : elle ne disparaît jamais, elle se transforme ou se
  transfère d''un objet à un autre.


  Dans un dispositif réel, l''énergie reçue en entrée se retrouve en sortie sous plusieurs formes : une partie utile (ce pour
  quoi le dispositif est fait) et une partie perdue, le plus souvent sous forme de chaleur due aux frottements ou à la résistance
  électrique.


  Un bilan énergétique additionne toutes les énergies (ou puissances) en sortie : elles doivent toujours redonner l''énergie
  (ou la puissance) totale entrante.


  La puissance P est l''énergie E transférée ou consommée par unité de temps t : P = E / t (P en watts W, E en joules J, t
  en secondes s) ; on en déduit E = P x t.


  Un appareil « économe en énergie » n''est pas celui qui consomme le plus d''énergie utile, mais celui qui limite le plus
  les pertes (souvent sous forme de chaleur).'
methode:
- Repérer l'énergie ou la puissance totale entrant dans le système.
- Identifier la part utile et la part perdue (souvent de la chaleur) en sortie.
- Vérifier que la somme des parts en sortie égale bien le total entrant (conservation de l'énergie).
- Utiliser P = E / t pour passer d'une puissance à une énergie (ou inversement), en respectant les unités (W, J, s).
vocabulaire:
- terme: puissance
  definition: énergie transférée ou consommée par unité de temps, en watts (W)
- terme: bilan énergétique
  definition: description de toutes les énergies (utile et perdue) entrant et sortant d'un système
erreurs_frequentes:
- Croire qu'un dispositif peut produire plus d'énergie en sortie qu'il n'en reçoit en entrée.
- Oublier de compter les pertes (souvent de la chaleur) dans un bilan énergétique.
- Confondre puissance (en watts, par seconde) et énergie (en joules, la quantité totale).
- Mélanger les unités de temps (secondes, heures) sans convertir avant de calculer P = E / t.
exemple:
  enonce: Une ampoule incandescente consomme une puissance électrique de 60 W, dont seulement 12 W sont convertis en lumière
    utile. Quelle puissance est perdue, et sous quelle forme principalement ?
  solution: 60 moins 12 égale 48 W sont perdus, principalement sous forme de chaleur.
exercices:
- id: puissance-depuis-energie
  type: nombre
  difficulte: 1
  enonce: Un appareil reçoit une énergie de 3600 J en 60 secondes. Calcule sa puissance, en watts.
  reponse:
    valeur: 60
    forme: entier
    tolerance: 1
  indices:
    relance: Quelle formule relie puissance, énergie et durée ?
    methode: Utilise P = E / t.
    etape: Remplace E et t par les valeurs de l'énoncé dans la formule, puis effectue la division.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Refais soigneusement ta division, sans confondre avec une soustraction.
  solution: P = E / t = 3600 / 60 = 60 W.
- id: energie-radiateur
  type: nombre
  difficulte: 2
  enonce: Un radiateur de puissance 1000 W fonctionne pendant 2 heures. Calcule l'énergie consommée, en Wh.
  reponse:
    valeur: 2000
    forme: entier
    tolerance: 1
  indices:
    relance: Quelle formule relie énergie, puissance et durée ?
    methode: Utilise E = P x t, avec t exprimé en heures pour obtenir des Wh.
    etape: Remplace P par 1000 et t par 2, puis effectue la multiplication.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta multiplication 1000 fois 2.
  solution: E = P x t = 1000 x 2 = 2000 Wh.
- id: bilan-moteur
  type: choix
  difficulte: 2
  enonce: Un moteur reçoit 500 W d'énergie électrique et fournit 350 W d'énergie mécanique utile. Que devient le reste de
    la puissance ?
  reponse:
    options:
    - id: a
      texte: elle disparaît, l'énergie n'a pas besoin de se conserver
    - id: b
      texte: elle est perdue, en général sous forme de chaleur due aux frottements
    - id: c
      texte: elle reste stockée telle quelle dans le moteur, inutilisée
    bonnes:
    - b
  indices:
    relance: L'énergie totale entrante doit-elle toujours se retrouver quelque part en sortie ?
    methode: 'Applique la conservation de l''énergie : la puissance non utile ne disparaît pas, elle change de forme.'
    etape: '500 moins 350 égale 150 W : sous quelle forme cette puissance restante se retrouve-t-elle généralement dans un
      moteur ?'
  pieges:
  - si:
      contient:
      - a
    relance: 'L''énergie totale d''un système se conserve toujours : elle ne peut pas disparaître sans se retrouver ailleurs.'
  - si:
      contient:
      - c
    relance: 'Dans un moteur réel, la puissance non convertie en énergie utile ne reste pas stockée : elle est dissipée, le
      plus souvent en chaleur due aux frottements.'
  solution: 500 moins 350 égale 150 W sont perdus, en général sous forme de chaleur due aux frottements dans le moteur.
- id: definir-conservation
  type: texte_court
  difficulte: 1
  enonce: Quel principe dit que l'énergie totale d'un système isolé ne disparaît jamais, mais se transforme ou se transfère
    ?
  reponse:
    acceptees:
    - conservation de l'énergie
    - principe de conservation de l'énergie
    fautes_tolerees: 1
  indices:
    relance: Ce principe porte sur ce qui arrive à l'énergie totale, pas seulement à sa forme utile.
    methode: Il affirme que rien ne se perd vraiment, tout se transforme.
    etape: Le mot-clé du principe est un synonyme de « se garder », « rester constant ».
  pieges:
  - si:
      valeur: rendement
    relance: Le rendement compare l'énergie utile à l'énergie totale ; ce n'est pas le principe qui dit que l'énergie ne disparaît
      jamais.
  solution: 'C''est la conservation de l''énergie : l''énergie totale d''un système isolé ne disparaît jamais, elle se transforme
    ou se transfère.'
- id: expliquer-rendement
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi un appareil qui consomme moins d'énergie utile n'est pas forcément moins économe qu'un appareil
    qui en consomme plus, en t'appuyant sur la notion de bilan énergétique.
  criteres:
  - L'élève distingue énergie utile et énergie perdue dans le bilan d'un appareil.
  - L'élève explique qu'être économe dépend de la part de pertes (souvent en chaleur), pas seulement de l'énergie utile fournie.
  - L'élève illustre avec un exemple montrant qu'un appareil peut avoir moins de pertes tout en fournissant une énergie utile
    différente.
  indices:
    relance: Qu'est-ce qui distingue un appareil économe d'un appareil qui gaspille de l'énergie ?
    methode: 'Repense au bilan énergétique : énergie totale entrante égale énergie utile plus énergie perdue.'
    etape: Commence par rappeler la différence entre énergie utile et énergie perdue dans un bilan énergétique.
  solution: Un appareil reçoit une énergie totale qui se répartit entre énergie utile et énergie perdue (souvent de la chaleur).
    Être économe signifie limiter la part des pertes, pas simplement consommer moins d'énergie utile. Par exemple, une ampoule
    LED consomme moins d'énergie totale qu'une ampoule incandescente pour produire la même quantité de lumière utile, car
    elle perd beaucoup moins d'énergie sous forme de chaleur.
