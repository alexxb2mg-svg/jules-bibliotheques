format: 2
notion: bilan-energetique-conservation
version: 1
etat: verifiee
declencheurs:
- énergie perdue
- énergie gaspillée
- énergie utile
- diagramme énergétique
- puissance fois durée
- rien ne se perd
prerequis:
- 4e-relation-puissance-energie
- formes-energie
essentiel: 'L''énergie se conserve : elle ne se crée pas et ne disparaît pas. Elle se transfère d''un système à un autre,
  ou se convertit d''une forme en une autre.


  Faire le bilan énergétique d''un système, c''est comparer l''énergie qu''il reçoit et l''énergie qu''il cède :

  - pour un convertisseur (lampe, moteur), énergie reçue = énergie utile + énergie « perdue » ; l''énergie perdue est le plus
  souvent de l''énergie thermique cédée à l''environnement ;

  - si le système reçoit plus d''énergie qu''il n''en cède, l''énergie stockée dans le système augmente (l''eau chauffe, la
  batterie se charge) ; s''il en cède plus qu''il n''en reçoit, elle diminue.


  La puissance P indique l''énergie transférée chaque seconde. Relation : E = P × t, avec E en joules (J), P en watts (W)
  et t en secondes (s).

  '
methode:
- Délimiter le système étudié (l'appareil, l'eau de la bouilloire...).
- Lister l'énergie reçue et les énergies cédées, avec leur forme.
- 'Écrire l''égalité du bilan : énergie reçue = énergies cédées + variation de l''énergie stockée.'
- 'Pour E = P × t : convertir la durée en secondes (1 min = 60 s, 1 h = 3 600 s), puis multiplier.'
vocabulaire:
- terme: énergie utile
  definition: partie de l'énergie qui sert à ce pour quoi l'appareil est fait
- terme: puissance
  definition: énergie transférée par seconde, en watts (W) ; 1 W = 1 J par seconde
erreurs_frequentes:
- Croire que l'énergie perdue disparaît, alors qu'elle est cédée à l'environnement (souvent sous forme thermique).
- Oublier de convertir la durée en secondes dans E = P × t.
- Diviser la puissance par la durée au lieu de multiplier.
- Croire qu'un appareil peut fournir plus d'énergie utile qu'il n'en reçoit.
exemple:
  enonce: Un moteur électrique reçoit 500 J d'énergie électrique et fournit 350 J d'énergie mécanique. Fais son bilan énergétique.
  solution: 'L''énergie se conserve : 500 J reçus = 350 J utiles + énergie perdue. L''énergie perdue vaut 500 − 350 = 150
    J, cédée à l''air sous forme thermique (le moteur chauffe).'
exercices:
- id: grandeurs-unites
  type: association
  difficulte: 1
  enonce: Associe chaque grandeur à son unité dans le Système international. Réponds par des paires, par exemple a-seconde.
  reponse:
    gauche:
    - id: a
      texte: énergie
    - id: b
      texte: puissance
    - id: c
      texte: durée
    droite:
    - id: joule
      texte: joule (J)
    - id: watt
      texte: watt (W)
    - id: seconde
      texte: seconde (s)
    - id: volt
      texte: volt (V)
    paires:
      a: joule
      b: watt
      c: seconde
  indices:
    relance: Laquelle de ces unités ne correspond à aucune des trois grandeurs ?
    methode: Pense à la relation E = P × t et aux unités qu'on utilise pour y remplacer les lettres.
    etape: La durée se mesure avec un chronomètre, dans une unité que tu connais depuis longtemps. Commence par celle-là.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule paire est fausse. As-tu échangé l'unité de l'énergie et celle de la puissance ?
  - si:
      diagnostic: associations_fausses
    relance: Le volt est l'unité de la tension électrique, il ne sert pas ici. Reprends chaque grandeur.
  solution: a-joule (l'énergie en J), b-watt (la puissance en W), c-seconde (la durée en s). Le volt est l'unité de la tension.
- id: seche-cheveux
  type: nombre
  difficulte: 1
  enonce: Un sèche-cheveux de puissance 1 500 W fonctionne pendant 60 s. Calcule l'énergie qu'il reçoit, en joules (J). Écris
    seulement le nombre.
  reponse:
    valeur: 90000
  indices:
    relance: Quelle relation relie l'énergie, la puissance et la durée ?
    methode: E = P × t, avec P en watts et t en secondes. Ici les unités sont déjà les bonnes.
    etape: 'Remplace les lettres : E = 1 500 × 60. Fais le calcul.'
  pieges:
  - si:
      valeur: 25
    relance: As-tu divisé ? L'énergie, c'est la puissance multipliée par la durée.
  - si:
      valeur: 1500
    relance: Tu as donné la puissance. Il faut encore tenir compte de la durée de fonctionnement.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta multiplication de la puissance par la durée.
  solution: E = P × t = 1 500 × 60 = 90 000 J.
- id: lampe-deux-heures
  type: nombre
  difficulte: 2
  enonce: Une lampe de puissance 11 W reste allumée pendant 2 h. Calcule l'énergie électrique qu'elle reçoit, en joules (J).
    Écris seulement le nombre.
  reponse:
    valeur: 79200
  indices:
    relance: Dans E = P × t, en quelle unité doit être la durée pour obtenir des joules ?
    methode: Convertis la durée en secondes (1 h = 3 600 s), puis multiplie par la puissance.
    etape: 2 h = 2 × 3 600 = 7 200 s. Il reste à multiplier par la puissance.
  pieges:
  - si:
      valeur: 22
    relance: Tu as laissé la durée en heures. Pour obtenir des joules, la durée doit être en secondes.
  - si:
      valeur: 1320
    relance: Tu as converti la durée en minutes. Pour obtenir des joules, il faut des secondes.
  - si:
      diagnostic: valeur_fausse
    relance: Reprends la conversion de 2 h en secondes, puis la multiplication.
  solution: t = 2 × 3 600 = 7 200 s. E = P × t = 11 × 7 200 = 79 200 J.
- id: bouilloire-bilan
  type: nombre
  difficulte: 2
  enonce: Pendant une minute, une bouilloire reçoit 120 000 J d'énergie électrique. Pendant ce temps, l'eau et la bouilloire
    cèdent 20 000 J d'énergie thermique à l'air de la cuisine. De combien de joules l'énergie stockée dans l'eau et la bouilloire
    augmente-t-elle ? Écris seulement le nombre.
  reponse:
    valeur: 100000
  indices:
    relance: L'énergie reçue et l'énergie cédée sont-elles égales ? Que devient la différence ?
    methode: 'Fais le bilan : énergie reçue = énergie cédée + augmentation de l''énergie stockée.'
    etape: 'Écris : 120 000 = 20 000 + augmentation. Trouve le nombre manquant.'
  pieges:
  - si:
      valeur: 140000
    relance: Tu as additionné. Une partie de l'énergie reçue repart dans l'air, elle ne reste pas dans l'eau.
  - si:
      valeur: 120000
    relance: Tu n'as pas tenu compte de l'énergie cédée à l'air de la cuisine. Enlève-la.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta soustraction entre l'énergie reçue et l'énergie cédée.
  solution: Énergie reçue = énergie cédée + augmentation de l'énergie stockée, donc augmentation = 120 000 − 20 000 = 100
    000 J.
- id: vrai-sur-conservation
  type: choix
  difficulte: 2
  enonce: Parmi ces affirmations, lesquelles sont vraies ?
  reponse:
    options:
    - id: a
      texte: L'énergie totale se conserve, elle se transfère ou se convertit.
    - id: b
      texte: Une lampe détruit une partie de l'énergie électrique qu'elle reçoit.
    - id: c
      texte: L'énergie perdue par un moteur est le plus souvent cédée à l'environnement sous forme thermique.
    - id: d
      texte: Un appareil bien conçu peut fournir plus d'énergie utile qu'il n'en reçoit.
    bonnes:
    - a
    - c
  indices:
    relance: L'énergie peut-elle apparaître ou disparaître ?
    methode: Pour chaque affirmation, demande-toi si elle respecte la conservation de l'énergie.
    etape: Une lampe allumée depuis longtemps est chaude. Qu'est-ce que cela t'apprend sur l'énergie qu'elle ne transforme
      pas en lumière ?
  pieges:
  - si:
      contient:
      - b
    relance: Une lampe peut-elle vraiment détruire de l'énergie ? Où va l'énergie qui ne devient pas de la lumière ?
  - si:
      contient:
      - d
    relance: Si un appareil fournissait plus qu'il ne reçoit, d'où viendrait l'énergie en plus ?
  - si:
      diagnostic: incomplet
    relance: Il manque une affirmation vraie. Relis celle qui parle du moteur.
  solution: 'a et c sont vraies. L''énergie ne se crée pas et ne se détruit pas : la lampe convertit l''énergie électrique
    en lumière et en énergie thermique, et aucun appareil ne peut fournir plus d''énergie qu''il n''en reçoit.'
- id: freinage-velo
  type: ouverte
  difficulte: 3
  enonce: 'Un élève affirme : « Quand je freine à vélo, l''énergie cinétique du vélo disparaît. » Es-tu d''accord ? Fais le
    bilan énergétique du freinage pour justifier ta réponse.'
  criteres:
  - L'élève répond que l'énergie ne disparaît pas, car l'énergie se conserve.
  - 'L''élève dit en quoi l''énergie cinétique est convertie : énergie thermique (les freins, la jante ou le pneu chauffent).'
  - L'élève précise que cette énergie thermique est ensuite cédée à l'environnement (l'air).
  indices:
    relance: Que sens-tu si tu touches les freins juste après un long freinage ?
    methode: 'Fais le bilan : quelle énergie le vélo perd-il, sous quelle forme la retrouve-t-on, et où va-t-elle ensuite
      ?'
    etape: Le vélo ralentit, donc son énergie cinétique diminue. Les freins frottent et chauffent. Continue le raisonnement.
  solution: 'Non : l''énergie se conserve, elle ne disparaît pas. En freinant, les freins frottent : l''énergie cinétique
    du vélo est convertie en énergie thermique (freins, jante et pneus chauffent). Cette énergie thermique est ensuite cédée
    à l''air, l''environnement.'
- id: nblm-que-signifie-le-principe-de-conservation-1
  type: choix
  difficulte: 2
  enonce: Que signifie le principe de conservation de l'énergie lors du fonctionnement d'un convertisseur d'énergie ?
  reponse:
    options:
    - id: o1
      texte: 'L''énergie ne se crée pas et ne disparaît pas : l''énergie reçue est égale à la somme de l''énergie utile et
        de l''énergie perdue.'
    - id: o2
      texte: L'énergie perdue est détruite et s'efface définitivement de l'environnement.
    - id: o3
      texte: Un appareil performant peut créer de l'énergie et en fournir plus qu'il n'en reçoit.
    - id: o4
      texte: Toute l'énergie reçue par un appareil est intégralement convertie en énergie utile.
    bonnes:
    - o1
  indices:
    relance: Pense à la célèbre formule exprimant que rien ne se crée, rien ne se perd, tout se transforme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : l''énergie « perdue » ne disparaît pas, elle est simplement cédée à l''environnement
      sous forme thermique.'
  - si:
      contient:
      - o3
    relance: 'C''est impossible : un appareil ne peut jamais produire plus d''énergie qu''il n''en reçoit, car l''énergie
      ne se crée pas.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : lors d''une conversion, une partie de l''énergie est presque toujours cédée à l''environnement
      sous forme de pertes.'
  solution: 'L''énergie ne se crée pas et ne disparaît pas : l''énergie reçue est égale à la somme de l''énergie utile et
    de l''énergie perdue. C''est exact : l''énergie se conserve toujours, elle se transforme ou se transfère sans création
    ni perte totale.'
- id: nblm-lorsqu-un-moteur-electrique-fonctionne-s-2
  type: choix
  difficulte: 2
  enonce: Lorsqu'un moteur électrique fonctionne, sous quelle forme principale est cédée l'énergie dite « perdue » ou « gaspillée
    » à l'environnement ?
  reponse:
    options:
    - id: o1
      texte: Sous forme d'énergie thermique.
    - id: o2
      texte: Sous forme d'énergie chimique.
    - id: o3
      texte: Sous forme d'énergie nucléaire.
    - id: o4
      texte: Elle n'est cédée sous aucune forme car elle s'annule.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi ce que tu ressens si tu touches un moteur après un long fonctionnement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est incorrect : l''énergie chimique est stockée dans les combustibles ou les piles, elle n''est pas la forme
      de perte d''un moteur en fonctionnement.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : l''énergie nucléaire concerne le noyau des atomes et n''intervient pas dans les pertes d''un moteur
      électrique.'
  - si:
      contient:
      - o4
    relance: 'C''est une erreur : l''énergie ne peut pas s''annuler ni disparaître, elle est obligatoirement transférée à
      l''extérieur.'
  solution: 'Sous forme d''énergie thermique. C''est exact : l''énergie perdue lors d''une conversion électrique s''échappe
    le plus souvent sous forme de chaleur (énergie thermique).'
- id: nblm-un-moteur-electrique-recoit-500-j-d-ener-3
  type: choix
  difficulte: 2
  enonce: Un moteur électrique reçoit 500 J d'énergie électrique et fournit 350 J d'énergie mécanique utile. Quelle est la
    valeur de l'énergie perdue ?
  reponse:
    options:
    - id: o1
      texte: 150 J
    - id: o2
      texte: 850 J
    - id: o3
      texte: 500 J
    - id: o4
      texte: 1,4 J
    bonnes:
    - o1
  indices:
    relance: 'Applique l''égalité du bilan énergétique : Énergie reçue = Énergie utile + Énergie perdue.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'erreur consiste à additionner l'énergie reçue et l'énergie utile au lieu de les soustraire.
  - si:
      contient:
      - o3
    relance: L'erreur consiste à confondre l'énergie perdue avec la totalité de l'énergie reçue.
  - si:
      contient:
      - o4
    relance: L'erreur provient d'une division (500 ÷ 350) au lieu d'une soustraction pour établir le bilan.
  solution: '150 J. C''est exact : d''après la conservation de l''énergie, Énergie perdue = Énergie reçue − Énergie utile
    = 500 J − 350 J = 150 J.'
- id: nblm-quelle-est-la-relation-litterale-permett-4
  type: choix
  difficulte: 2
  enonce: Quelle est la relation littérale permettant de calculer l'énergie électrique E transférée à un appareil à partir
    de sa puissance P et de sa durée de fonctionnement t ?
  reponse:
    options:
    - id: o1
      texte: E = P × t
    - id: o2
      texte: E = P ÷ t
    - id: o3
      texte: E = t ÷ P
    - id: o4
      texte: E = P + t
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que la puissance exprime l'énergie transférée chaque seconde.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : diviser la puissance par la durée au lieu de la multiplier est incorrect.'
  - si:
      contient:
      - o3
    relance: 'C''est incorrect : l''énergie augmente avec la puissance et la durée, il faut les multiplier.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : on ne peut pas additionner deux grandeurs physiques exprimées dans des unités différentes.'
  solution: 'E = P × t. C''est juste : l''énergie est égale au produit de la puissance par la durée d''utilisation.'
- id: nblm-pour-calculer-une-energie-e-en-joules-j-5
  type: choix
  difficulte: 2
  enonce: Pour calculer une énergie E en joules (J) à l'aide de la formule E = P × t avec une puissance P en watts (W) et
    une durée t exprimée en minutes, quelle conversion est obligatoire ?
  reponse:
    options:
    - id: o1
      texte: Convertir la durée t en secondes en multipliant le nombre de minutes par 60.
    - id: o2
      texte: Diviser la puissance par 1 000 pour la convertir en kilowatts.
    - id: o3
      texte: Conserver la durée en minutes sans effectuer de conversion.
    - id: o4
      texte: Diviser la durée par 60 pour l'exprimer en heures.
    bonnes:
    - o1
  indices:
    relance: Pense à l'unité de temps fondamentale du Système international pour calculer des joules.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur : convertir en kilowatts avec un temps en minutes ne donne pas des joules.'
  - si:
      contient:
      - o3
    relance: 'C''est l''erreur classique : ne pas convertir la durée en secondes conduit à un résultat faux en joules.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect pour des joules : cette conversion permet d''obtenir des wattheures (Wh) et non des joules.'
  solution: 'Convertir la durée t en secondes en multipliant le nombre de minutes par 60. C''est exact : 1 watt correspond
    à 1 joule par seconde, la durée doit donc impérativement être exprimée en secondes.'
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant le bilan et le diagramme énergétique d'une lampe électrique
    en fonctionnement ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'énergie lumineuse émise par la lampe constitue son énergie utile.
    - id: o2
      texte: L'énergie thermique émise par la lampe représente l'énergie perdue cédée à l'environnement.
    - id: o3
      texte: L'énergie utile fournie est supérieure à l'énergie électrique reçue par la lampe.
    - id: o4
      texte: L'énergie perdue sous forme thermique disparaît du bilan énergétique global.
    bonnes:
    - o1
    - o2
  indices:
    relance: Distingue l'effet souhaité (éclairer) de l'effet secondaire indésirable (chauffer).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : un appareil ne peut jamais produire plus d''énergie utile qu''il n''en a reçu au départ.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : l''énergie ne disparaît jamais, elle doit figurer parmi les énergies cédées au milieu extérieur.'
  solution: 'L''énergie lumineuse émise par la lampe constitue son énergie utile ; L''énergie thermique émise par la lampe
    représente l''énergie perdue cédée à l''environnement. C''est exact : l''énergie utile correspond à la forme d''énergie
    recherchée pour éclairer.'
- id: nblm-comment-qualifie-t-on-la-partie-de-l-ene-7
  type: texte_court
  difficulte: 1
  enonce: Comment qualifie-t-on la partie de l'énergie reçue par un convertisseur qui sert directement à la fonction pour
    laquelle il a été conçu ?
  reponse:
    acceptees:
    - énergie utile
    fautes_tolerees: 1
  indices:
    relance: Cherche l'adjectif s'opposant à « perdue » ou « gaspillée ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: énergie utile. L'énergie utile désigne la part d'énergie transformée qui répond au besoin pour lequel l'appareil
    est fait.
- id: nblm-quelle-grandeur-physique-notee-p-et-mesu-8
  type: texte_court
  difficulte: 1
  enonce: Quelle grandeur physique, notée P et mesurée en watts, indique la quantité d'énergie transférée par un système chaque
    seconde ?
  reponse:
    acceptees:
    - puissance
    fautes_tolerees: 1
  indices:
    relance: C'est le nom de la grandeur notée P dans la formule E = P × t.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: puissance. La puissance caractérise la rapidité d'un transfert d'énergie (1 W = 1 J par seconde).
