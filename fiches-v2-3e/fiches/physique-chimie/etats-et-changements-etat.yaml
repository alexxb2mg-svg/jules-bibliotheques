format: 2
notion: etats-et-changements-etat
version: 1
etat: verifiee
declencheurs:
- glaçon qui fond
- eau qui bout
- palier de température
- température de fusion
- point d'ébullition
- passer de liquide à gaz
prerequis: []
essentiel: 'La matière existe sous trois états.

  - Solide : il a une forme propre et un volume propre.

  - Liquide : il n''a pas de forme propre (il prend la forme du récipient) mais il a un volume propre ; au repos, sa surface
  libre est plane et horizontale.

  - Gaz : il n''a ni forme propre ni volume propre ; il occupe tout l''espace offert et on peut le comprimer.


  Les changements d''état : fusion (solide vers liquide), solidification (liquide vers solide), vaporisation (liquide vers
  gaz), liquéfaction (gaz vers liquide), sublimation (solide vers gaz), condensation (gaz vers solide).


  Au niveau microscopique, la matière est faite de particules (des molécules pour l''eau). Dans un solide, elles sont serrées
  et ordonnées ; dans un liquide, serrées mais désordonnées, elles glissent les unes sur les autres ; dans un gaz, éloignées,
  désordonnées et très agitées. Lors d''un changement d''état, les molécules ne changent pas : seules leur disposition et
  leur agitation changent.


  Lors d''un changement d''état :

  - la masse se conserve (le nombre de molécules ne change pas) ;

  - le volume change (l''eau est une exception : la glace occupe environ 9 % de volume de plus que l''eau liquide) ;

  - pour un corps pur, la température reste constante pendant tout le changement d''état : c''est un palier. Pour l''eau pure,
  à la pression atmosphérique normale : fusion à 0 °C, ébullition à 100 °C. Un mélange ne présente pas de palier net.'
methode:
- Repérer l'état de départ et l'état d'arrivée, puis nommer le changement d'état.
- 'Pour étudier un changement d''état : chauffer (ou refroidir) l''échantillon, relever la température à intervalles réguliers
  avec un thermomètre et un chronomètre.'
- Tracer la courbe de la température en fonction du temps ; chercher un palier (partie horizontale).
- 'Palier : c''est un corps pur, et la température du palier est sa température de changement d''état. Pas de palier : c''est
  un mélange.'
- 'Pour la masse : peser avant et après, sans que rien ne s''échappe ni n''entre ; elle est la même.'
vocabulaire:
- terme: corps pur
  definition: matière constituée d'une seule espèce chimique (par exemple de l'eau pure).
- terme: palier
  definition: 'partie horizontale d''une courbe de température : la température ne change pas pendant le changement d''état.'
- terme: ébullition
  definition: vaporisation qui se produit dans tout le liquide, avec des bulles de vapeur.
erreurs_frequentes:
- 'Dire que le sucre « fond » dans l''eau : c''est une dissolution, pas une fusion.'
- 'Croire que la masse change quand l''eau gèle ou s''évapore dans un récipient fermé : seule la disposition des molécules
  change, pas leur nombre.'
- 'Croire que les molécules grossissent ou se dilatent quand l''eau se vaporise : ce sont les distances entre elles qui augmentent.'
- Penser que la température continue de monter pendant l'ébullition de l'eau pure si on chauffe plus fort.
- Confondre la buée (de l'eau liquide, visible) et la vapeur d'eau (un gaz invisible).
exemple:
  enonce: 'On refroidit de l''eau pure liquide et on relève sa température : 8 °C, 4 °C, 1 °C, 0 °C, 0 °C, 0 °C, 0 °C, -3
    °C, -7 °C. Que se passe-t-il pendant les quatre mesures à 0 °C ?'
  solution: 'La température reste constante : c''est un palier. Pendant ce palier, l''eau passe de l''état liquide à l''état
    solide (solidification). Le palier montre que l''eau est un corps pur ; sa température de solidification est 0 °C.'
exercices:
- id: nommer-liquide-vers-solide
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle le changement d'état au cours duquel un liquide devient solide (par exemple de l'eau qui se transforme
    en glace) ? Réponds par un seul mot.
  reponse:
    acceptees:
    - solidification
    fautes_tolerees: 1
  indices:
    relance: Quel est l'état d'arrivée ? Le nom du changement d'état est construit sur ce mot.
    methode: 'Chaque changement d''état porte un nom : pense à l''état qu''on obtient à la fin.'
    etape: Le passage de solide à liquide s'appelle la fusion ; ici c'est le sens inverse, et on arrive à l'état solide.
  pieges:
  - si:
      valeur: fusion
    relance: 'La fusion, c''est quand un solide devient liquide. Ici, c''est l''inverse : quel est l''état d''arrivée ?'
  - si:
      valeur: congélation
    relance: C'est le mot de la vie courante (au congélateur). Quel est le nom utilisé en sciences pour tous les corps purs
      ?
  - si:
      valeur: condensation
    relance: 'La condensation part d''un gaz. Ici, on part d''un liquide : relis l''énoncé.'
  solution: 'C''est la solidification : un liquide qui devient solide se solidifie. Le sens inverse (solide vers liquide)
    est la fusion.'
- id: associer-changements-etat
  type: association
  difficulte: 1
  enonce: Associe chaque passage d'un état à un autre au nom du changement d'état (une des propositions de droite ne sert
    pas).
  reponse:
    gauche:
    - id: g1
      texte: solide vers liquide
    - id: g2
      texte: liquide vers gaz
    - id: g3
      texte: gaz vers liquide
    - id: g4
      texte: liquide vers solide
    droite:
    - id: a
      texte: fusion
    - id: b
      texte: vaporisation
    - id: c
      texte: liquéfaction
    - id: d
      texte: solidification
    - id: e
      texte: dissolution
    paires:
      g1: a
      g2: b
      g3: c
      g4: d
  indices:
    relance: Pour chaque ligne, quel est l'état d'arrivée ?
    methode: 'Le nom du changement d''état rappelle souvent l''état obtenu : liquide, solide, vapeur.'
    etape: 'Commence par « gaz vers liquide » : on obtient un liquide, cherche le nom qui contient « liqu ».'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pour chacune, vérifie l'état d'arrivée.
  - si:
      diagnostic: associations_fausses
    relance: 'Attention : la dissolution n''est pas un changement d''état (c''est un solide qui se disperse dans un liquide).
      Reprends ligne par ligne.'
  solution: 'Solide vers liquide : fusion. Liquide vers gaz : vaporisation. Gaz vers liquide : liquéfaction. Liquide vers
    solide : solidification. La dissolution n''est pas un changement d''état.'
- id: masse-glace-qui-fond
  type: nombre
  difficulte: 2
  enonce: Un bécher couvert contenant des glaçons est posé sur une balance, qui indique 312 g. On attend que toute la glace
    ait fondu, sans rien ajouter ni retirer. Quelle masse indique alors la balance, en grammes ? Écris seulement le nombre.
  reponse:
    valeur: 312
  indices:
    relance: Pendant la fusion, des molécules d'eau disparaissent-elles ou en arrive-t-il de nouvelles ?
    methode: 'Lors d''un changement d''état, le nombre de molécules ne change pas : que devient alors la masse ?'
    etape: 'Le bécher est couvert : aucune molécule ne s''échappe. Compare la masse avant et après la fusion.'
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Le volume change quand la glace fond, mais est-ce que la masse change aussi ? Pense au nombre de molécules.
  solution: 'Lors d''un changement d''état, la masse se conserve : la balance indique toujours 312 g. Seul le volume change
    (l''eau liquide occupe un peu moins de place que la glace).'
- id: lire-courbe-palier
  type: choix
  difficulte: 2
  enonce: 'Un élève chauffe de la glace pilée et relève la température chaque minute, de 0 à 8 min : -10 °C, -6 °C, -2 °C,
    0 °C, 0 °C, 0 °C, 0 °C, 3 °C, 7 °C. Quelles affirmations sont justes ?'
  reponse:
    options:
    - id: a
      texte: Entre 3 min et 6 min, la glace est en train de fondre.
    - id: b
      texte: La température de fusion de l'eau est 0 °C.
    - id: c
      texte: Pendant le palier, le chauffage ne sert plus à rien.
    - id: d
      texte: Le palier montre que l'échantillon est un mélange.
    bonnes:
    - a
    - b
  indices:
    relance: Que remarques-tu sur la température entre 3 min et 6 min ?
    methode: Une température qui reste constante pendant un chauffage signale un changement d'état d'un corps pur.
    etape: 'Relis chaque affirmation et demande-toi : que devient la glace pendant ces minutes, et l''énergie apportée sert-elle
      à quelque chose ?'
  pieges:
  - si:
      contient:
      - c
    relance: Si on arrête de chauffer pendant le palier, la glace finit-elle de fondre ? À quoi sert l'énergie apportée à
      ce moment-là ?
  - si:
      contient:
      - d
    relance: 'Relis la méthode : un palier net, est-ce le signe d''un mélange ou d''un corps pur ?'
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une bonne affirmation, mais il y en a une autre. À quelle température se trouve le palier ?
  solution: 'a et b sont justes : entre 3 et 6 min la température reste à 0 °C, c''est le palier de fusion. c est faux : l''énergie
    apportée sert à faire fondre la glace. d est faux : un palier net est la signature d''un corps pur.'
- id: vaporisation-microscopique
  type: choix
  difficulte: 2
  enonce: De l'eau liquide se vaporise dans un récipient fermé. Au niveau microscopique, que se passe-t-il ?
  reponse:
    options:
    - id: a
      texte: Les molécules d'eau s'éloignent les unes des autres et s'agitent davantage.
    - id: b
      texte: Les molécules d'eau grossissent.
    - id: c
      texte: Les molécules d'eau se transforment en d'autres molécules.
    - id: d
      texte: Le nombre de molécules d'eau reste le même.
    bonnes:
    - a
    - d
  indices:
    relance: Dans un gaz, comment sont disposées les particules par rapport à un liquide ?
    methode: 'Un changement d''état ne change pas la nature des molécules : il change leur disposition et leur agitation.'
    etape: Élimine d'abord les affirmations qui feraient changer les molécules elles-mêmes (leur taille ou leur nature).
  pieges:
  - si:
      contient:
      - b
    relance: Une molécule garde toujours la même taille. Qu'est-ce qui change alors quand le volume augmente ?
  - si:
      contient:
      - c
    relance: Si les molécules changeaient, ce serait une transformation chimique. La vapeur d'eau, est-ce encore de l'eau
      ?
  - si:
      diagnostic: incomplet
    relance: 'Il y a une autre affirmation juste. Le récipient est fermé : que devient le nombre de molécules ?'
  solution: 'a et d sont justes : les molécules restent les mêmes et aussi nombreuses (la masse se conserve), mais elles s''éloignent
    et s''agitent davantage. Elles ne grossissent pas et ne changent pas de nature.'
- id: protocole-corps-pur
  type: ouverte
  difficulte: 3
  enonce: On te donne un liquide incolore inconnu. Propose un protocole expérimental pour savoir, en étudiant sa solidification,
    s'il s'agit d'un corps pur ou d'un mélange. Décris le matériel, les mesures et la façon de conclure.
  criteres:
  - L'élève refroidit le liquide (par exemple dans un bain d'eau, de glace et de sel) et relève sa température à intervalles
    réguliers avec un thermomètre et un chronomètre.
  - L'élève trace (ou prévoit de tracer) la courbe de la température en fonction du temps.
  - 'L''élève conclut correctement : un palier de température signifie un corps pur ; pas de palier net signifie un mélange.'
  indices:
    relance: Qu'est-ce qui distingue un corps pur d'un mélange quand il change d'état ?
    methode: Il faut suivre la température au cours du temps pendant le refroidissement, puis regarder la forme de la courbe.
    etape: 'Commence par le matériel : un tube à essais contenant le liquide, un thermomètre, un chronomètre et un bain très
      froid.'
  solution: On place le liquide dans un tube à essais plongé dans un mélange de glace et de sel. On relève la température
    toutes les 30 secondes jusqu'à la solidification complète, puis on trace la courbe température-temps. Si la courbe présente
    un palier (température constante pendant la solidification), le liquide est un corps pur ; sinon, c'est un mélange.
