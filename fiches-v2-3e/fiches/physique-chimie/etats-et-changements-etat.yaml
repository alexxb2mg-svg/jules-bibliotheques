format: 2
notion: etats-et-changements-etat
version: 1
etat: verifiee
declencheurs:
- glace qui fond
- eau qui gèle
- buée sur la vitre
- neige carbonique qui disparaît
- passer de solide à liquide
- température de fusion
- nuage au-dessus d'une casserole
prerequis: []
essentiel: 'La matière existe sous trois états principaux : solide (forme et volume propres), liquide (volume propre, prend

  la forme du récipient) et gazeux (occupe tout l''espace disponible).


  Un corps pur passe d''un état à l''autre à une température fixe (par exemple l''eau pure fond à 0 °C et bout à

  100 °C sous pression atmosphérique normale) : c''est un changement d''état.


  Noms des changements : fusion (solide vers liquide), solidification (liquide vers solide), vaporisation ou

  évaporation (liquide vers gaz), liquéfaction ou condensation (gaz vers liquide), sublimation (solide vers gaz

  directement).


  Lors d''un changement d''état, la masse de matière est conservée, mais le volume change fortement : un gaz occupe

  un volume beaucoup plus grand que le même corps à l''état liquide ou solide.


  À l''échelle microscopique, les molécules restent les mêmes : seul leur arrangement et leur agitation changent.

  '
methode:
- Repérer l'état de départ et l'état d'arrivée pour nommer le changement d'état.
- Vérifier qu'il s'agit d'un corps pur (une seule espèce chimique) pour parler de température fixe de changement d'état ;
  un mélange change d'état sur une plage de températures.
- Retenir que la masse totale ne change jamais lors d'un changement d'état, seul le volume varie.
- Convertir les unités de masse (kg en g) avant de comparer deux valeurs.
vocabulaire:
- terme: fusion
  definition: le passage de l'état solide à l'état liquide
- terme: sublimation
  definition: le passage direct de l'état solide à l'état gazeux, sans passer par le liquide
erreurs_frequentes:
- Confondre évaporation et ébullition (l'évaporation se produit à toute température, en surface).
- Croire que la masse change quand la glace fond ou que l'eau s'évapore.
- 'Confondre sublimation et évaporation : la sublimation part directement du solide, sans passer par le liquide.'
- Penser que la vapeur d'eau est visible (le nuage blanc au-dessus d'une casserole est en fait de fines gouttelettes liquides,
  pas du gaz).
exemple:
  enonce: 50 g de glace fondent entièrement dans un verre. Quelle est la masse d'eau liquide obtenue ? Comment se nomme ce
    changement d'état ?
  solution: 'C''est une fusion (solide vers liquide). La masse est conservée : on obtient 50 g d''eau liquide.'
exercices:
- id: nommer-buee
  type: texte_court
  difficulte: 1
  enonce: Nommer le changement d'état quand de la buée (des gouttelettes) apparaît sur une vitre froide.
  reponse:
    acceptees:
    - condensation
    - liquéfaction
    fautes_tolerees: 1
  indices:
    relance: La vapeur d'eau de l'air, qui est un gaz, devient liquide au contact du froid. Quel nom porte ce passage de gaz
      à liquide ?
    methode: Repère l'état de départ (gaz) et l'état d'arrivée (liquide) de l'eau de l'air.
    etape: Le mot cherché se termine par « -ation » et commence par la même syllabe que « condensé ».
  pieges:
  - si:
      valeur: fusion
    relance: La fusion part d'un solide vers un liquide. Ici, l'eau part-elle d'un solide ?
  - si:
      valeur: vaporisation
    relance: La vaporisation va du liquide vers le gaz. Ici, dans quel sens l'eau change-t-elle d'état ?
  solution: 'C''est une condensation (ou liquéfaction) : le gaz devient liquide.'
- id: masse-glace-fondue
  type: nombre
  difficulte: 1
  enonce: 750 g de glace fondent entièrement dans un récipient fermé. Quelle est la masse d'eau liquide obtenue, en grammes
    ?
  reponse:
    valeur: 750
    forme: entier
    tolerance: 0
  indices:
    relance: Le changement d'état conserve-t-il la masse ?
    methode: La masse totale ne change jamais lors d'un changement d'état, seul le volume varie.
    etape: 'Réfléchis à la masse totale avant et après le changement d''état : que fait-elle ?'
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: 'Relis l''énoncé : la masse d''un corps pur change-t-elle quand il change d''état ?'
  solution: 'La masse est conservée lors d''un changement d''état : on obtient 750 g d''eau liquide.'
- id: nom-gaz-vers-liquide
  type: choix
  difficulte: 2
  enonce: Quel nom porte le changement d'état d'un gaz qui devient liquide ?
  reponse:
    options:
    - id: a
      texte: vaporisation
    - id: b
      texte: sublimation
    - id: c
      texte: liquéfaction
    - id: d
      texte: fusion
    bonnes:
    - c
  indices:
    relance: 'Repère le sens du changement : gaz vers liquide, ou liquide vers gaz ?'
    methode: Élimine d'abord les changements qui ne partent pas d'un gaz.
    etape: La fusion et la vaporisation ne partent pas d'un gaz ; il reste deux propositions à comparer.
  pieges:
  - si:
      contient:
      - a
    relance: La vaporisation va dans l'autre sens, du liquide vers le gaz.
  - si:
      contient:
      - b
    relance: La sublimation part directement d'un solide, pas d'un gaz.
  - si:
      contient:
      - d
    relance: La fusion part d'un solide vers un liquide, pas d'un gaz.
  solution: 'C''est une liquéfaction (ou condensation) : le gaz devient liquide.'
- id: associer-changements-directions
  type: association
  difficulte: 2
  enonce: Relie chaque changement d'état à la direction qu'il décrit.
  reponse:
    gauche:
    - id: a
      texte: fusion
    - id: b
      texte: solidification
    - id: c
      texte: vaporisation
    - id: d
      texte: sublimation
    droite:
    - id: x
      texte: solide vers liquide
    - id: y
      texte: liquide vers solide
    - id: z
      texte: liquide vers gaz
    - id: w
      texte: solide vers gaz
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: 'Le mot « solidification » ressemble à « solide » : dans quel sens va-t-on pour arriver à un solide ?'
    methode: Pour chaque nom, demande-toi quel est l'état de départ et quel est l'état d'arrivée.
    etape: La fusion et la solidification concernent le passage entre solide et liquide, dans des sens opposés.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout le sens (départ vers arrivée) de chaque changement.
  - si:
      diagnostic: associations_fausses
    relance: Repars du plus simple, fusion (solide vers liquide), puis range les trois autres par rapport à lui.
  solution: 'Fusion : solide vers liquide. Solidification : liquide vers solide. Vaporisation : liquide vers gaz. Sublimation
    : solide vers gaz.'
- id: masse-eau-vaporisee
  type: nombre
  difficulte: 2
  enonce: 1,2 kg d'eau liquide sont entièrement vaporisés. Quelle est la masse de vapeur obtenue, en grammes ?
  reponse:
    valeur: 1200
    forme: entier
    tolerance: 0
  indices:
    relance: Convertis d'abord les kilogrammes en grammes.
    methode: 1 kg vaut 1000 g. La masse ne change pas lors d'un changement d'état.
    etape: Convertis 1,2 kg en grammes en multipliant par 1000, puis rappelle-toi que la masse ne change pas.
  pieges:
  - si:
      valeur: 1.2
    relance: Ta réponse est en kilogrammes, mais l'énoncé demande la masse en grammes.
  - si:
      diagnostic: valeur_fausse
    relance: La masse d'un corps pur ne change pas lors d'un changement d'état. Reprends la conversion kg vers g.
  solution: 1,2 kg = 1200 g d'eau liquide, donc 1200 g de vapeur d'eau après vaporisation (même masse).
- id: expliquer-conservation-masse
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi la masse d'un corps pur ne change pas lors d'un changement d'état, alors que son volume peut beaucoup
    changer.
  criteres:
  - L'élève dit que les molécules restent les mêmes lors d'un changement d'état (aucune matière n'apparaît ni ne disparaît).
  - L'élève explique que seul l'arrangement et l'agitation des molécules changent (serrées dans un solide, dispersées dans
    un gaz).
  - L'élève relie ce changement d'arrangement à la forte variation de volume, sans variation de masse.
  indices:
    relance: 'Que deviennent les molécules d''eau quand elle passe de liquide à gaz : disparaissent-elles ?'
    methode: Décris ce qui change (l'arrangement des molécules) et ce qui ne change pas (leur nombre et leur nature).
    etape: Dans un gaz, les molécules sont très dispersées et agitées ; dans un liquide, elles restent proches.
  solution: 'Lors d''un changement d''état, les molécules qui constituent la matière restent les mêmes : aucune n''apparaît
    ni ne disparaît, donc la masse totale est conservée. Seul leur arrangement change (serrées et ordonnées dans un solide,
    mobiles et proches dans un liquide, très dispersées et agitées dans un gaz), ce qui fait varier fortement le volume occupé.'
