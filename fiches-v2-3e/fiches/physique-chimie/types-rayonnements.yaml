# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: types-rayonnements
version: 2
etat: verifiee
declencheurs:
- rayons ultraviolets
- infrarouge
- radiographie
- rayons gamma
- micro-ondes
- rayonnement invisible
- rayons x
- ondes radio
- lumière invisible
- crème solaire uv
prerequis:
- propagation-lumiere
essentiel: 'La lumière visible n''est qu''une petite partie des rayonnements. Il en existe d''autres, invisibles pour notre
  œil. Du moins énergétique au plus énergétique :

  - les ondes radio (radio, télévision, téléphone portable, wifi) ;

  - les micro-ondes (four à micro-ondes) ;

  - l''infrarouge (télécommande, caméra thermique, chaleur d''un radiateur) ;

  - la lumière visible (du rouge au violet, comme l''arc-en-ciel) ;

  - les ultraviolets ou UV (bronzage, coups de soleil) ;

  - les rayons X (radiographie) ;

  - les rayons gamma (émis par certains noyaux radioactifs).


  Un rayonnement est un transport d''énergie. Plus il est énergétique, plus il peut être dangereux pour le corps. Les UV peuvent
  brûler la peau et abîmer les yeux : on se protège avec de la crème solaire et des lunettes. Les rayons X sont arrêtés par
  le plomb, d''où les tabliers et les parois de protection des radiographies. On les utilise quand même à l''hôpital, car
  les os arrêtent les rayons X plus que les tissus mous : l''image montre les os.


  Le Soleil envoie de l''infrarouge, de la lumière visible et des UV. Les objets chauds émettent de l''infrarouge : c''est
  ce que voit une caméra thermique.


  Tous ces rayonnements sont de même nature que la lumière : ils se propagent dans le vide, à la même vitesse, environ 300
  000 km/s. Le son, lui, n''est pas un rayonnement : il ne se propage pas dans le vide.


  Pour une durée de trajet : t = d ÷ v, avec d en km et v en km/s.


  Au brevet, on attend que tu associes un rayonnement à son usage, que tu saches lesquels sont invisibles ou dangereux, et
  que tu calcules une durée de propagation.

  '
methode:
- Repérer l'usage ou l'effet décrit (voir, communiquer, chauffer, radiographier, bronzer).
- Associer cet usage au type de rayonnement.
- 'Pour classer les rayonnements en énergie : ondes radio, micro-ondes, infrarouge, visible, ultraviolets, rayons X, rayons
  gamma.'
- Se rappeler que tous se propagent dans le vide à environ 300 000 km/s.
- 'Pour une durée de trajet : t = d ÷ v, avec d en km et v en km/s ; le résultat est en secondes.'
- 'Pour la sécurité : plus le rayonnement est énergétique (UV, rayons X, gamma), plus il faut se protéger.'
vocabulaire:
- terme: rayonnement
  definition: transport d'énergie qui peut se faire même dans le vide, comme la lumière.
- terme: infrarouge
  definition: rayonnement invisible émis par les objets chauds, utilisé par les télécommandes.
- terme: ultraviolet (UV)
  definition: rayonnement invisible émis par le Soleil, responsable du bronzage et des coups de soleil.
- terme: ondes radio
  definition: rayonnement invisible utilisé pour la radio, la télévision, le téléphone portable et le wifi.
- terme: rayons X
  definition: rayonnement invisible très énergétique, utilisé pour les radiographies.
- terme: lumière visible
  definition: seul rayonnement que l'œil perçoit, du rouge au violet.
erreurs_frequentes:
- Croire que les ondes radio ont besoin d'air pour se propager, comme le son.
- Croire qu'on peut voir les rayons X ou les ultraviolets.
- 'Confondre ondes radio (rayonnement) et son : une radio reçoit un rayonnement, puis le haut-parleur produit un son.'
- Penser que seule la lumière visible va à 300 000 km/s.
- 'Classer les rayonnements dans le désordre : retiens l''ordre radio, micro-ondes, infrarouge, visible, UV, X, gamma.'
exemple:
  enonce: Pourquoi peut-on communiquer par radio avec des astronautes dans l'espace, alors qu'on ne pourrait pas les entendre
    crier ?
  solution: 'Les ondes radio sont un rayonnement, comme la lumière : elles se propagent dans le vide. Le son, lui, a besoin
    d''un milieu matériel et ne traverse pas le vide.'
exercices:
- id: usage-rayonnement
  type: association
  difficulte: 1
  enonce: Associe chaque utilisation au rayonnement qu'elle emploie.
  reponse:
    gauche:
    - id: a
      texte: radiographie des os
    - id: b
      texte: wifi et téléphone portable
    - id: c
      texte: télécommande de télévision
    - id: d
      texte: voir les couleurs d'un arc-en-ciel
    droite:
    - id: x
      texte: rayons X
    - id: r
      texte: ondes radio
    - id: i
      texte: infrarouge
    - id: v
      texte: lumière visible
    - id: u
      texte: ultraviolets
    paires:
      a: x
      b: r
      c: i
      d: v
  indices:
    relance: Parmi ces utilisations, laquelle se fait avec notre œil ? Laquelle se fait à l'hôpital ?
    methode: Traite d'abord les cas que tu connais sûrement, puis termine par élimination. Un rayonnement de la liste ne sert
      pas.
    etape: 'Voir un arc-en-ciel se fait avec l''œil : c''est le seul rayonnement visible. Continue avec la radiographie.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. La lumière d'une télécommande est-elle visible ?
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends une par une : lequel sert à l''hôpital, lequel sert à communiquer à distance ?'
  solution: 'Radiographie : rayons X. Wifi et téléphone : ondes radio. Télécommande : infrarouge. Arc-en-ciel : lumière visible.
    Les ultraviolets ne servaient pas ici.'
- id: coup-de-soleil
  type: texte_court
  difficulte: 1
  enonce: Quel rayonnement invisible, émis par le Soleil, provoque le bronzage et les coups de soleil ?
  reponse:
    acceptees:
    - ultraviolets
    - ultraviolet
    - UV
    - rayons ultraviolets
    - rayons UV
    - rayonnement ultraviolet
    fautes_tolerees: 1
  indices:
    relance: La crème solaire protège contre ce rayonnement. Comment s'appelle-t-il ?
    methode: Il est invisible et transporte plus d'énergie que la lumière violette.
    etape: 'Son nom commence par « ultra » : il est au-delà du violet.'
  pieges:
  - si:
      valeur: infrarouge
    relance: L'infrarouge donne une sensation de chaleur, mais ce n'est pas lui qui brûle la peau. Quel rayonnement est au-delà
      du violet ?
  solution: 'Ce sont les ultraviolets (UV) : invisibles, ils provoquent le bronzage et les coups de soleil. La crème solaire
    protège la peau contre eux.'
- id: classer-energie
  type: ordre
  difficulte: 2
  enonce: Classe ces rayonnements du moins énergétique au plus énergétique.
  reponse:
    elements:
    - id: a
      texte: ondes radio
    - id: b
      texte: infrarouge
    - id: c
      texte: lumière visible
    - id: d
      texte: ultraviolets
    - id: e
      texte: rayons X
  indices:
    relance: Lesquels de ces rayonnements sont dangereux pour le corps ? Ils transportent beaucoup d'énergie.
    methode: 'Place la lumière visible au milieu : l''infrarouge est « avant le rouge », l''ultraviolet est « après le violet
      ».'
    etape: 'Les ondes radio nous traversent sans danger : elles sont les moins énergétiques. Continue à partir d''elles.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux rayonnements voisins sont échangés. Que veulent dire « infra » (en dessous) et « ultra » (au-delà)
      ?
  - si:
      diagnostic: ordre_faux
    relance: Pars de la lumière visible, au milieu, puis place l'infrarouge avant et les ultraviolets après.
  solution: 'Ondes radio, infrarouge, lumière visible, ultraviolets, rayons X : les UV et les rayons X, les plus énergétiques,
    sont ceux dont il faut se protéger.'
- id: vrai-faux-rayonnements
  type: choix
  difficulte: 2
  enonce: Quelles affirmations sont vraies ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: a
      texte: Les ondes radio peuvent se propager dans le vide.
    - id: b
      texte: On peut voir les rayons X à l'œil nu.
    - id: c
      texte: Dans le vide, les rayons X et la lumière visible vont à la même vitesse.
    - id: d
      texte: Les ondes radio ont besoin d'air pour se propager, comme le son.
    bonnes:
    - a
    - c
  indices:
    relance: Les ondes radio et les rayons X sont-ils de même nature que la lumière ?
    methode: 'Rappelle-toi : la lumière du Soleil traverse le vide de l''espace. Qu''en est-il des autres rayonnements ?'
    etape: 'Une seule sorte de rayonnement est visible par l''œil : la lumière visible. Élimine d''abord la proposition sur
      les rayons X.'
  pieges:
  - si:
      contient:
      - d
    relance: Comment les satellites communiquent-ils avec la Terre, alors qu'il n'y a pas d'air dans l'espace ?
  - si:
      contient:
      - b
    relance: Lors d'une radiographie, vois-tu les rayons traverser ton bras ?
  - si:
      diagnostic: incomplet
    relance: Il y a une autre affirmation vraie. Que sais-tu de la vitesse de tous ces rayonnements dans le vide ?
  solution: 'Vraies : les ondes radio se propagent dans le vide, et tous les rayonnements vont à la même vitesse dans le vide
    (environ 300 000 km/s). Les rayons X sont invisibles, et les ondes radio n''ont pas besoin d''air.'
- id: signal-satellite
  type: nombre
  difficulte: 3
  enonce: Un signal radio est envoyé à un satellite situé à 36 000 km. Les ondes radio vont à environ 300 000 km/s. Calcule
    la durée du trajet, en secondes, en écriture décimale. Écris seulement le nombre.
  reponse:
    valeur: 0,12
    forme: libre
  indices:
    relance: Tu connais la distance et la vitesse. Quelle relation te donne la durée ?
    methode: 'De d = v × t on tire t = d ÷ v. La distance est en km et la vitesse en km/s : le résultat sera en secondes.'
    etape: Divise la distance par la vitesse, en posant la division ou en simplifiant par 1 000 d'abord.
  pieges:
  - si:
      valeur: 8,33
    relance: Tu as divisé la vitesse par la distance. Dans t = d ÷ v, qu'est-ce qu'on divise par quoi ?
  - si:
      valeur: 10 800 000 000
    relance: Tu as multiplié. Pour trouver une durée à partir d'une distance et d'une vitesse, il faut diviser.
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie ta division : distance en km divisée par vitesse en km/s. Ton résultat doit être inférieur à une seconde.'
  solution: t = d ÷ v = 36 000 ÷ 300 000 = 0,12 s. Le signal arrive en un peu plus d'un dixième de seconde.
- id: se-proteger
  type: ouverte
  difficulte: 2
  enonce: Explique pourquoi le manipulateur radio se met à l'abri derrière une paroi pendant une radiographie, alors que personne
    ne se protège de la lumière d'une lampe.
  criteres:
  - L'élève dit que la radiographie utilise des rayons X, un rayonnement invisible.
  - L'élève explique que les rayons X transportent beaucoup plus d'énergie que la lumière visible et peuvent être dangereux
    en cas d'expositions répétées.
  - L'élève indique que la protection (paroi, tablier de plomb) arrête ces rayons.
  indices:
    relance: Quel rayonnement utilise-t-on pour une radiographie ?
    methode: 'Compare ce rayonnement à la lumière visible : lequel transporte le plus d''énergie ?'
    etape: 'Pense au manipulateur : il fait des radiographies toute la journée. Que risque-t-il sans protection ?'
  solution: Une radiographie utilise des rayons X. Ils transportent beaucoup plus d'énergie que la lumière visible et peuvent
    abîmer les cellules du corps. Le manipulateur, exposé tous les jours, se protège derrière une paroi (ou un tablier de
    plomb) qui arrête ces rayons.
- id: duree-lumiere-soleil
  type: nombre
  difficulte: 2
  enonce: La lumière du Soleil parcourt environ 150 millions de kilomètres pour arriver sur Terre, à environ 300 000 km/s.
    Calcule la durée du trajet, en secondes. Écris seulement le nombre.
  reponse:
    valeur: 500
  indices:
    relance: Tu connais la distance et la vitesse. Quelle relation te donne la durée ?
    methode: 'De d = v × t on tire t = d ÷ v. La distance est en km et la vitesse en km/s : le résultat sera en secondes.'
    etape: 150 millions s'écrit 150 000 000. Divise-le par 300 000 en simplifiant les zéros.
  pieges:
  - si:
      valeur: 0.002
    relance: Tu as divisé la vitesse par la distance. Dans t = d ÷ v, qu'est-ce qu'on divise par quoi ?
  - si:
      valeur: 8.33
    relance: Tu as sans doute converti en minutes. Le résultat doit être en secondes.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie le nombre de zéros de 150 millions, puis simplifie avec ceux de 300 000.
  solution: t = d ÷ v = 150 000 000 ÷ 300 000 = 500 s (environ 8 minutes 20 secondes).
- id: rayonnements-invisibles
  type: choix
  difficulte: 2
  enonce: Lesquels de ces rayonnements sont invisibles pour l'œil humain ?
  reponse:
    options:
    - id: a
      texte: les ultraviolets
    - id: b
      texte: la lumière orange
    - id: c
      texte: l'infrarouge
    - id: d
      texte: les ondes radio
    - id: e
      texte: la lumière violette
    bonnes:
    - a
    - c
    - d
  indices:
    relance: 'Un seul type de rayonnement est perçu par l''œil : lequel ?'
    methode: La lumière visible va du rouge au violet. Ce qui est avant le rouge ou après le violet est invisible.
    etape: 'Élimine les deux couleurs de l''arc-en-ciel : ce sont de la lumière visible.'
  pieges:
  - si:
      contient:
      - b
    relance: L'orange est une couleur de l'arc-en-ciel. L'œil la voit-il ?
  - si:
      contient:
      - e
    relance: Le violet est la dernière couleur de l'arc-en-ciel. Est-il visible ?
  - si:
      diagnostic: incomplet
    relance: Il y a d'autres rayonnements invisibles. Pense à la télécommande et au wifi.
  solution: a, c et d sont invisibles. La lumière orange et la lumière violette font partie de la lumière visible.
- id: nblm-quel-type-de-rayonnement-invisible-est-p-1
  type: choix
  difficulte: 2
  enonce: Quel type de rayonnement invisible est principalement utilisé pour réaliser une radiographie médicale ?
  reponse:
    options:
    - id: o1
      texte: Les rayons X
    - id: o2
      texte: Les rayons gamma
    - id: o3
      texte: Les micro-ondes
    - id: o4
      texte: Les rayons ultraviolets
    bonnes:
    - o1
  indices:
    relance: Pense au rayonnement capable de traverser les tissus mous mais arrêté par les os.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : bien qu''ils traversent la matière, les rayons gamma sont issus de réactions nucléaires et
      ne sont pas utilisés pour les radiographies médicales courantes.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : les micro-ondes servent au chauffage des aliments ou aux télécommunications, pas aux radiographies.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : les ultraviolets sont responsables du bronzage et ne traversent pas le corps pour imager
      les os.'
  solution: Les rayons X. C'est exact. Les rayons X traversent la matière et sont utilisés en médecine pour réaliser des radiographies.
- id: nblm-quel-rayonnement-invisible-est-emis-par-2
  type: choix
  difficulte: 2
  enonce: Quel rayonnement invisible est émis par les objets chauds et est utilisé par les télécommandes ?
  reponse:
    options:
    - id: o1
      texte: L'infrarouge
    - id: o2
      texte: L'ultraviolet
    - id: o3
      texte: Les ondes radio
    - id: o4
      texte: La lumière visible
    bonnes:
    - o1
  indices:
    relance: Ce rayonnement est directement lié à la chaleur dégagée par les corps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : les ultraviolets proviennent principalement du Soleil et causent des coups de soleil, ils
      ne sont pas utilisés par les télécommandes.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : les ondes radio servent à la télévision ou au wifi, mais ne sont pas directement associées
      à l''émission thermique des objets chauds.'
  solution: L'infrarouge. C'est exact. L'infrarouge est émis par les objets chauds et est couramment utilisé dans les télécommandes.
- id: nblm-ou-se-situent-les-micro-ondes-dans-le-cl-3
  type: choix
  difficulte: 2
  enonce: Où se situent les micro-ondes dans le classement des rayonnements selon l'énergie qu'ils transportent ?
  reponse:
    options:
    - id: o1
      texte: Elles transportent plus d'énergie que les ondes radio mais moins que l'infrarouge.
    - id: o2
      texte: Elles transportent plus d'énergie que les rayons X.
    - id: o3
      texte: Elles transportent moins d'énergie que les ondes radio.
    - id: o4
      texte: Elles transportent autant d'énergie que la lumière visible.
    bonnes:
    - o1
  indices:
    relance: Pense à la place des micro-ondes au tout début du classement des rayonnements par énergie croissante.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : les rayons X sont situés bien plus haut dans l''échelle d''énergie et sont beaucoup plus
      dangereux.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : les ondes radio sont le rayonnement qui transporte le moins d''énergie de tout le spectre.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : chaque type de rayonnement transporte une quantité d''énergie différente ; la lumière visible
      en transporte plus que les micro-ondes.'
  solution: 'Elles transportent plus d''énergie que les ondes radio mais moins que l''infrarouge. C''est exact. L''ordre d''énergie
    croissante est : ondes radio, micro-ondes, infrarouge, lumière visible, ultraviolets, rayons X, rayons gamma.'
- id: nblm-parmi-ces-rayonnements-invisibles-lequel-4
  type: choix
  difficulte: 2
  enonce: Parmi ces rayonnements invisibles, lequel transporte le plus d'énergie et présente le plus grand danger ?
  reponse:
    options:
    - id: o1
      texte: Les rayons gamma
    - id: o2
      texte: Les micro-ondes
    - id: o3
      texte: Le rayonnement infrarouge
    - id: o4
      texte: Les ondes radio
    bonnes:
    - o1
  indices:
    relance: Cherche le rayonnement placé au dernier rang de la liste ordonnée par énergie croissante.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : les micro-ondes se trouvent au début du classement et transportent peu d''énergie.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : l''infrarouge transporte moins d''énergie que la lumière visible et que les rayonnements
      très dangereux.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : les ondes radio sont celles qui transportent le moins d''énergie.'
  solution: Les rayons gamma. C'est exact. Les rayons gamma sont situés tout à la fin de l'échelle d'énergie et transportent
    le plus d'énergie.
- id: nblm-a-quelle-vitesse-les-rayons-ultraviolets-5
  type: choix
  difficulte: 2
  enonce: À quelle vitesse les rayons ultraviolets se propagent-ils dans le vide ?
  reponse:
    options:
    - id: o1
      texte: À la même vitesse que la lumière visible, soit environ 300 000 km/s.
    - id: o2
      texte: Moins vite que la lumière visible car ils sont invisibles.
    - id: o3
      texte: À la vitesse du son dans l'air, soit 340 m/s.
    - id: o4
      texte: Ils ne peuvent pas se propager dans le vide.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que tous les rayonnements partageant la nature de la lumière possèdent la même vitesse constante
      dans le vide.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la vitesse dans le vide ne dépend pas de la visibilité du rayonnement ; tous vont à 300 000
      km/s.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : 340 m/s est la vitesse du son dans l''air, pas celle des rayonnements de nature lumineuse.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : les rayons ultraviolets sont des rayonnements qui traversent très bien le vide depuis le
      Soleil.'
  solution: À la même vitesse que la lumière visible, soit environ 300 000 km/s. C'est exact. Tous les rayonnements sont de
    même nature que la lumière et vont à environ 300 000 km/s dans le vide.
- id: nblm-quelles-sont-les-deux-affirmations-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations correctes concernant les caractéristiques des rayonnements invisibles ? [1-3]
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Tous les rayonnements invisibles se propagent dans le vide à environ 300 000 km/s.
    - id: o2
      texte: Les rayons ultraviolets, les rayons X et les rayons gamma peuvent être dangereux pour la santé.
    - id: o3
      texte: Les ondes radio nécessitent un milieu matériel comme l'air pour se propager.
    - id: o4
      texte: L'œil humain peut percevoir les rayons infrarouges si leur intensité est très élevée.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche une propriété liée à la vitesse de propagation dans le vide et une propriété liée aux risques biologiques
