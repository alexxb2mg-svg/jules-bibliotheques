format: 2
notion: types-rayonnements
version: 1
etat: verifiee
declencheurs:
- ondes radio et rayons X
- spectre électromagnétique
- rayons ultraviolets dangereux
- coup de soleil sur la peau
- imagerie médicale par rayons X
- c égale lambda fois f
prerequis:
- propagation-lumiere
essentiel: 'Il existe différents types de rayonnements, qui se distinguent par leur longueur d''onde (ou leur fréquence) :
  ondes radio, infrarouge, lumière visible, ultraviolet, rayons X, entre autres.


  Ils se propagent tous à la même vitesse dans le vide (la vitesse de la lumière, c environ égal à 300 000 km/s), mais leur
  longueur d''onde λ et leur fréquence f sont liées par la relation c = λ x f.


  Seule une petite partie de ces rayonnements est visible par l''œil humain : la lumière visible, comprise entre l''ultraviolet
  et l''infrarouge.


  Ces rayonnements ont des usages différents selon leurs propriétés : les ondes radio pour les télécommunications, l''infrarouge
  pour certaines télécommandes ou l''imagerie thermique, les rayons X pour l''imagerie médicale.


  Certains rayonnements (ultraviolets, rayons X) transportent plus d''énergie et peuvent être dangereux pour les organismes
  vivants à forte dose, ce qui impose des précautions (crème solaire, protections en radiologie).'
methode:
- Situe un rayonnement par sa longueur d'onde ou sa fréquence, par rapport à la lumière visible.
- Retiens que tous ces rayonnements se propagent à la même vitesse dans le vide.
- Utilise c = λ x f pour calculer une fréquence à partir d'une longueur d'onde, ou inversement.
- Associe chaque type de rayonnement à un usage courant ou à une précaution nécessaire.
vocabulaire:
- terme: longueur d'onde
  definition: distance caractéristique d'un rayonnement, notée λ, liée à sa fréquence par c = λ x f
- terme: fréquence
  definition: grandeur f, en hertz, qui caractérise un rayonnement et varie en sens inverse de la longueur d'onde
erreurs_frequentes:
- Croire que tous les rayonnements sont visibles par l'œil (seule une petite partie l'est).
- Confondre longueur d'onde et fréquence, qui varient en sens inverse.
- 'Penser que les rayonnements les plus dangereux sont ceux de plus grande longueur d''onde (c''est l''inverse : plus la fréquence
  est grande, plus l''énergie transportée est importante).'
- Croire que ces rayonnements se propagent à des vitesses différentes dans le vide.
exemple:
  enonce: Calculer la fréquence d'une lumière visible de longueur d'onde 500 nm (c environ égal à 3 x 10 puissance 8 m/s).
  solution: f = c / λ = 3 x 10 puissance 8 / (500 x 10 puissance moins 9) = 6 x 10 puissance 14 Hz.
exercices:
- id: usage-ondes-radio
  type: texte_court
  difficulte: 1
  enonce: Cite un exemple d'utilisation courante des ondes radio.
  reponse:
    acceptees:
    - radio
    - télévision
    - wifi
    - téléphone
    fautes_tolerees: 1
  indices:
    relance: Pense à ce qui transporte du son ou des images sans fil, sur de longues distances.
    methode: C'est un usage lié aux télécommunications, très courant à la maison.
    etape: Un poste qui diffuse de la musique en direct utilise ce type d'onde.
  pieges:
  - si:
      valeur: rayons X
    relance: Ce rayonnement sert surtout à l'imagerie médicale, pas aux télécommunications que tu cherches ici.
  solution: Les ondes radio servent par exemple pour la radio, la télévision ou le Wi-Fi.
- id: proteger-uv
  type: choix
  difficulte: 2
  enonce: Pourquoi conseille-t-on de se protéger des ultraviolets (crème solaire, lunettes) plutôt que des ondes radio ?
  reponse:
    options:
    - id: a
      texte: les ultraviolets ont une fréquence plus élevée et transportent plus d'énergie, ce qui peut abîmer la peau et
        les yeux
    - id: b
      texte: les ondes radio se propagent moins vite, donc elles sont plus dangereuses en réalité
    - id: c
      texte: les ultraviolets ont une longueur d'onde plus grande que les ondes radio
    bonnes:
    - a
  indices:
    relance: Compare l'énergie transportée par ces deux types de rayonnement.
    methode: Plus la fréquence d'un rayonnement est élevée, plus il transporte d'énergie.
    etape: Les ultraviolets ont une fréquence bien plus élevée que les ondes radio.
  pieges:
  - si:
      contient:
      - b
    relance: Tous les rayonnements électromagnétiques se propagent à la même vitesse dans le vide ; ce n'est pas la vitesse
      de propagation qui rend un rayonnement dangereux.
  - si:
      contient:
      - c
    relance: 'C''est l''inverse : les ultraviolets ont une longueur d''onde plus petite (et une fréquence plus élevée) que
      les ondes radio.'
  solution: Les ultraviolets ont une fréquence plus élevée que les ondes radio et transportent donc plus d'énergie, ce qui
    peut abîmer la peau et les yeux à forte dose.
- id: frequence-vs-longueur-onde
  type: choix
  difficulte: 2
  enonce: Un rayonnement infrarouge a une longueur d'onde plus grande que la lumière visible. Sa fréquence est-elle plus grande
    ou plus petite que celle de la lumière visible ?
  reponse:
    options:
    - id: a
      texte: plus petite
    - id: b
      texte: plus grande
    - id: c
      texte: la même
    bonnes:
    - a
  indices:
    relance: 'c = λ x f : si λ augmente et c reste constant, que devient f ?'
    methode: Longueur d'onde et fréquence varient toujours en sens inverse l'une de l'autre.
    etape: 'Une plus grande longueur d''onde correspond nécessairement à une valeur de fréquence différente : dans quel sens
      ?'
  pieges:
  - si:
      contient:
      - b
    relance: 'Si la longueur d''onde augmente, la fréquence ne peut pas augmenter aussi : c = λ x f reste constant.'
  - si:
      contient:
      - c
    relance: L'infrarouge et le visible ont des longueurs d'onde différentes, donc des fréquences différentes.
  solution: Sa fréquence est plus petite (longueur d'onde et fréquence varient en sens inverse).
- id: expliquer-position-visible
  type: ouverte
  difficulte: 3
  enonce: Explique où se situe la lumière visible parmi les différents types de rayonnements, et pourquoi seule cette petite
    partie est perçue par l'œil humain.
  criteres:
  - L'élève situe la lumière visible entre l'ultraviolet et l'infrarouge dans le classement des rayonnements.
  - L'élève rappelle que tous ces rayonnements se propagent à la même vitesse mais ont des longueurs d'onde (ou fréquences)
    différentes.
  - L'élève relie le fait que seule une petite gamme de longueurs d'onde est perçue par l'œil humain, le reste étant invisible.
  indices:
    relance: 'Repense au classement des rayonnements : lequel se trouve entre l''infrarouge et l''ultraviolet ?'
    methode: Rappelle que le spectre des rayonnements va des ondes radio aux rayons X, et que seule une petite partie est
      visible.
    etape: Commence par situer la lumière visible entre l'ultraviolet et l'infrarouge.
  solution: La lumière visible se situe entre l'ultraviolet et l'infrarouge dans le classement des différents types de rayonnements
    (qui vont des ondes radio aux rayons X). Tous ces rayonnements se propagent à la même vitesse dans le vide, mais ont des
    longueurs d'onde (et des fréquences) différentes. L'œil humain n'est sensible qu'à une toute petite gamme de longueurs
    d'onde, celle de la lumière visible ; les autres rayonnements (ondes radio, infrarouge, ultraviolet, rayons X...) existent
    bien mais restent invisibles pour nous.
