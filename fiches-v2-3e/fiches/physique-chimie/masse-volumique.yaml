# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: masse-volumique
version: 1
etat: verifiee
declencheurs:
- rho égal m sur v
- g/cm3
- kilogramme par mètre cube
- éprouvette graduée et balance
- flotte ou coule
- plus lourd que l'eau
prerequis:
- 4e-masse-volumique
essentiel: 'La masse volumique ρ (lettre grecque « rhô ») d''une matière est la masse d''un volume unité de cette matière
  : ρ = m / V, donc m = ρ × V et V = m / ρ.

  La masse m et le volume V d''un même échantillon sont proportionnels : ρ est le coefficient de proportionnalité.


  Unités : g/cm³ (ou g/mL), kg/L, kg/m³. Rappels : 1 mL = 1 cm³ ; 1 L = 1 000 mL = 1 dm³ ; 1 m³ = 1 000 L. Pour l''eau liquide
  : ρ = 1 g/cm³ = 1 kg/L = 1 000 kg/m³ (à peu près, vers 4 à 20 °C).


  Mesure : la masse avec une balance ; le volume d''un liquide avec une éprouvette graduée ; le volume d''un solide irrégulier
  par déplacement d''eau (on lit le niveau avant et après avoir plongé l''objet dans l''éprouvette).


  La masse volumique caractérise une espèce chimique : en comparant une valeur mesurée à un tableau de valeurs, on peut identifier
  une matière.

  Elle dépend de la température : en général, quand on chauffe, le volume augmente et la masse volumique diminue.

  Un objet plein flotte sur un liquide si sa masse volumique est plus petite que celle du liquide.'
methode:
- 'Écrire la relation utile : ρ = m / V, ou m = ρ × V, ou V = m / ρ.'
- 'Vérifier les unités : masse et volume doivent être dans des unités cohérentes avec celle de ρ (g et cm³ pour des g/cm³,
  kg et m³ pour des kg/m³).'
- Faire le calcul, puis écrire le résultat avec son unité.
- 'Contrôler l''ordre de grandeur : un métal a une masse volumique de plusieurs g/cm³, un liquide courant autour de 1 g/cm³.'
- 'Pour identifier une matière : comparer la valeur trouvée au tableau et choisir la plus proche.'
vocabulaire:
- terme: masse volumique
  definition: masse d'un volume unité d'une matière, ρ = m / V.
- terme: déplacement d'eau
  definition: 'méthode pour mesurer le volume d''un solide : différence entre le niveau d''eau avec et sans l''objet.'
- terme: éprouvette graduée
  definition: récipient gradué pour mesurer un volume de liquide ; on lit le bas du ménisque, l'œil à sa hauteur.
erreurs_frequentes:
- Inverser la formule et calculer V / m au lieu de m / V.
- 'Oublier de convertir : mélanger des kg et des cm³, ou des g et des L, dans un même calcul.'
- Prendre comme volume d'un solide le niveau final de l'éprouvette au lieu de la différence des niveaux.
- 'Confondre masse et masse volumique : un gros morceau de bois est plus lourd qu''un petit clou, mais le fer a une masse
  volumique plus grande que le bois.'
- Croire que la masse volumique d'une matière ne dépend jamais de la température.
exemple:
  enonce: Un bloc de 30 cm³ a une masse de 237 g. Calculer sa masse volumique.
  solution: ρ = m / V = 237 / 30 = 7,9 g/cm³. C'est proche de la valeur du fer (7,87 g/cm³).
exercices:
- id: calculer-rho-bloc
  type: nombre
  difficulte: 1
  enonce: Un petit bloc de métal a une masse de 54 g et un volume de 20 cm³. Calcule sa masse volumique en g/cm³. Écris seulement
    le nombre.
  reponse:
    valeur: 2.7
  indices:
    relance: Quelle relation relie la masse volumique, la masse et le volume ?
    methode: La masse volumique est la masse divisée par le volume ; ici les unités (g et cm³) donnent directement des g/cm³.
    etape: 'Pose la division : ρ = 54 ÷ 20. Effectue-la.'
  pieges:
  - si:
      valeur: 0.37
    relance: Tu as divisé le volume par la masse. Dans quel ordre faut-il faire la division ?
  - si:
      valeur: 1080
    relance: 'Tu as multiplié la masse par le volume. La masse volumique, c''est une masse par unité de volume : quelle opération
      ?'
  solution: ρ = m / V = 54 ÷ 20 = 2,7 g/cm³ (c'est la masse volumique de l'aluminium).
- id: masse-huile
  type: nombre
  difficulte: 2
  enonce: Une bouteille contient 250 mL d'huile. La masse volumique de l'huile est 0,92 g/mL. Quelle est la masse de cette
    huile, en grammes ? Écris seulement le nombre.
  reponse:
    valeur: 230
  indices:
    relance: 'Tu connais ρ et V : quelle relation donne la masse ?'
    methode: On a m = ρ × V ; les unités g/mL et mL donnent des grammes.
    etape: Pose le calcul m = 0,92 × 250 et effectue-le (tu peux calculer 250 × 0,92 = 250 × 1 − 250 × 0,08).
  pieges:
  - si:
      valeur: 271.74
    relance: Tu as divisé le volume par la masse volumique. Pour trouver une masse, faut-il diviser ou multiplier ?
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie l''ordre de grandeur : l''huile est un peu plus légère que l''eau, donc 250 mL d''huile pèsent un peu
      moins de 250 g.'
  solution: m = ρ × V = 0,92 × 250 = 230 g.
- id: volume-ethanol
  type: nombre
  difficulte: 3
  enonce: La masse volumique de l'éthanol est 0,79 g/mL. Quel volume occupent 500 g d'éthanol ? Donne le résultat en mL, arrondi
    à l'unité. Écris seulement le nombre.
  reponse:
    valeur: 633
    tolerance: 1
  indices:
    relance: 'Tu connais la masse et la masse volumique : que cherches-tu, et quelle relation le donne ?'
    methode: De m = ρ × V, on tire V = m / ρ. Avec des g et des g/mL, on obtient des mL.
    etape: Pose V = 500 ÷ 0,79 à la calculatrice, puis arrondis à l'unité.
  pieges:
  - si:
      valeur: 395
    relance: Tu as multiplié la masse par la masse volumique. Pour trouver un volume à partir d'une masse, quelle opération
      faut-il ?
  - si:
      diagnostic: valeur_fausse
    relance: 'L''éthanol est moins dense que l''eau : 500 g d''éthanol occupent-ils plus ou moins de 500 mL ? Vérifie ton
      calcul.'
  solution: V = m / ρ = 500 ÷ 0,79 ≈ 632,9 mL, soit 633 mL arrondi à l'unité.
- id: identifier-metal
  type: choix
  difficulte: 2
  enonce: 'Un objet métallique a une masse de 89,6 g. On le plonge dans une éprouvette graduée : le niveau de l''eau passe
    de 50,0 mL à 60,0 mL. Tableau (en g/cm³) : aluminium 2,70 ; fer 7,87 ; cuivre 8,96 ; plomb 11,3 ; or 19,3. De quel métal
    s''agit-il ?'
  reponse:
    options:
    - id: a
      texte: aluminium
    - id: b
      texte: fer
    - id: c
      texte: cuivre
    - id: d
      texte: plomb
    - id: e
      texte: or
    bonnes:
    - c
  indices:
    relance: Quel est le volume de l'objet ? Est-ce le niveau final de l'eau ?
    methode: Le volume de l'objet est la différence des deux niveaux ; puis ρ = m / V, et on compare au tableau (1 mL = 1
      cm³).
    etape: Le volume de l'objet est 60,0 − 50,0 mL. Calcule ρ avec ce volume, puis cherche la valeur la plus proche.
  pieges:
  - si:
      contient:
      - a
    relance: As-tu pris 60 mL comme volume ? Le volume de l'objet est seulement l'augmentation du niveau d'eau.
  - si:
      contient:
      - b
    relance: 'Refais la division : ta valeur est-elle vraiment plus proche de 7,87 que des autres valeurs du tableau ?'
  - si:
      diagnostic: mauvais_choix
    relance: Calcule d'abord le volume de l'objet (différence des niveaux), puis sa masse volumique, avant de comparer.
  solution: 'V = 60,0 − 50,0 = 10,0 mL = 10,0 cm³ ; ρ = 89,6 ÷ 10,0 = 8,96 g/cm³ : c''est le cuivre.'
- id: classer-masses-volumiques
  type: ordre
  difficulte: 2
  enonce: Range ces matières de la plus petite à la plus grande masse volumique. Attention aux unités.
  reponse:
    elements:
    - id: m1
      texte: 'liège : 240 kg/m³'
    - id: m2
      texte: 'huile : 0,92 g/cm³'
    - id: m3
      texte: 'eau : 1 kg/L'
    - id: m4
      texte: 'aluminium : 2 700 kg/m³'
    - id: m5
      texte: 'fer : 7,87 g/cm³'
  indices:
    relance: Peut-on comparer directement 240 et 7,87 ? Les unités sont-elles les mêmes ?
    methode: 'Convertis tout en g/cm³ : 1 g/cm³ = 1 kg/L = 1 000 kg/m³, donc on divise les kg/m³ par 1 000.'
    etape: 'Le liège : 240 kg/m³ = 0,24 g/cm³. Convertis de même l''aluminium, puis range les cinq valeurs.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux matières voisines sont inversées. Compare-les à nouveau dans la même unité.
  - si:
      diagnostic: ordre_faux
    relance: As-tu converti toutes les valeurs dans la même unité avant de comparer ? 2 700 kg/m³ n'est pas plus grand que
      7,87 g/cm³.
  solution: 'En g/cm³ : liège 0,24 ; huile 0,92 ; eau 1 ; aluminium 2,7 ; fer 7,87. Ordre : liège, huile, eau, aluminium,
    fer.'
- id: protocole-caillou
  type: ouverte
  difficulte: 3
  enonce: Propose un protocole pour déterminer la masse volumique d'un petit caillou de forme irrégulière. Indique le matériel,
    les mesures et le calcul.
  criteres:
  - L'élève mesure la masse du caillou avec une balance.
  - L'élève mesure le volume par déplacement d'eau dans une éprouvette graduée (différence entre le niveau final et le niveau
    initial).
  - L'élève calcule ρ = m / V avec des unités cohérentes et donne l'unité du résultat.
  indices:
    relance: De quelles deux grandeurs as-tu besoin pour calculer une masse volumique ?
    methode: La masse se mesure facilement ; pour le volume d'une forme irrégulière, pense à ce qui arrive au niveau de l'eau
      quand on y plonge l'objet.
    etape: 'Première étape : pose le caillou sec sur la balance et note sa masse. Continue avec le volume.'
  solution: On pèse le caillou sur une balance (par exemple m = 26 g). On verse de l'eau dans une éprouvette graduée et on
    lit le niveau (par exemple 40 mL), on y plonge doucement le caillou et on relit le niveau (par exemple 50 mL). Le volume
    du caillou est 50 − 40 = 10 mL = 10 cm³. Alors ρ = m / V = 26 ÷ 10 = 2,6 g/cm³.
- id: nblm-quelle-est-la-formule-mathematique-perme-1
  type: choix
  difficulte: 2
  enonce: Quelle est la formule mathématique permettant de calculer la masse volumique ρ d'un échantillon à partir de sa masse
    m et de son volume V ?
  reponse:
    options:
    - id: o1
      texte: ρ = m / V
    - id: o2
      texte: ρ = V / m
    - id: o3
      texte: ρ = m × V
    - id: o4
      texte: ρ = m - V
    bonnes:
    - o1
  indices:
    relance: 'Rappelle-toi la définition : la masse volumique est la masse d''un volume unité.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur fréquente d'inverser la formule en divisant le volume par la masse.
  - si:
      contient:
      - o3
    relance: Multiplier la masse par le volume ne donne pas la masse volumique.
  - si:
      contient:
      - o4
    relance: On ne soustrait pas un volume d'une masse car ce sont deux grandeurs physiques différentes.
  solution: 'ρ = m / V. C''est la formule exacte : la masse volumique est le quotient de la masse m par le volume V.'
- id: nblm-quels-instruments-de-laboratoire-faut-il-2
  type: choix
  difficulte: 2
  enonce: Quels instruments de laboratoire faut-il utiliser pour mesurer respectivement la masse et le volume d'un liquide
    ?
  reponse:
    options:
    - id: o1
      texte: Une balance pour la masse et une éprouvette graduée pour le volume
    - id: o2
      texte: Une éprouvette graduée pour la masse et une balance pour le volume
    - id: o3
      texte: Un dynamomètre pour la masse et un bécher gradué pour le volume
    - id: o4
      texte: Une balance pour la masse et un thermomètre pour le volume
    bonnes:
    - o1
  indices:
    relance: Pense à l'appareil qui affiche des grammes et à celui qui possède des graduations en millilitres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une inversion des rôles des deux instruments de mesure.
  - si:
      contient:
      - o3
    relance: Le dynamomètre mesure la valeur d'une force (le poids en N) et non la masse.
  - si:
      contient:
      - o4
    relance: Le thermomètre mesure la température d'un corps et non son volume.
  solution: Une balance pour la masse et une éprouvette graduée pour le volume. La balance permet de mesurer la masse (en
    g ou kg) et l'éprouvette graduée mesure le volume (en mL ou cm³).
- id: nblm-a-quelle-condition-un-objet-solide-plein-3
  type: choix
  difficulte: 2
  enonce: À quelle condition un objet solide plein flotte-t-il lorsqu'il est placé dans un liquide ?
  reponse:
    options:
    - id: o1
      texte: Si sa masse volumique est plus petite que celle du liquide
    - id: o2
      texte: Si sa masse volumique est plus grande que celle du liquide
    - id: o3
      texte: Si sa masse globale est inférieure à 100 grammes
    - id: o4
      texte: Si son volume est plus petit que celui du liquide
    bonnes:
    - o1
  indices:
    relance: Compare la masse volumique du solide à celle du liquide récepteur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Si sa masse volumique est plus grande, l'objet coule au fond du récipient.
  - si:
      contient:
      - o3
    relance: La flottaison ne dépend pas de la masse seule, mais du rapport entre la masse et le volume.
  - si:
      contient:
      - o4
    relance: Le volume seul ne détermine pas la flottaison ; c'est la masse volumique qui compte.
  solution: Si sa masse volumique est plus petite que celle du liquide. Un objet plein flotte sur un liquide si sa masse volumique
    est inférieure à celle du liquide.
- id: nblm-un-eleve-affirme-qu-une-grosse-buche-de-4
  type: choix
  difficulte: 2
  enonce: Un élève affirme qu'une grosse bûche de bois 'est plus lourde' qu'un petit clou en fer, et donc que le bois a une
    plus grande masse volumique que le fer. Quelle est l'erreur commise ?
  reponse:
    options:
    - id: o1
      texte: L'élève confond la masse globale de l'objet et la masse volumique de la matière
    - id: o2
      texte: L'élève a calculé la masse volumique en faisant V / m
    - id: o3
      texte: L'élève aurait dû mesurer la masse du clou avec une éprouvette graduée
    - id: o4
      texte: L'élève a oublié que le fer flotte toujours sur l'eau
    bonnes:
    - o1
  indices:
    relance: Fais la différence entre la quantité de matière totale d'un objet et la masse d'une unité de volume.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'erreur porte ici sur la confusion entre les concepts de masse et de masse volumique, pas sur le calcul.
  - si:
      contient:
      - o3
    relance: Une éprouvette graduée sert à mesurer un volume, pas une masse.
  - si:
      contient:
      - o4
    relance: Le fer a une masse volumique supérieure à celle de l'eau, il coule dans l'eau.
  solution: L'élève confond la masse globale de l'objet et la masse volumique de la matière. La bûche a une grande masse parce
    qu'elle a un très grand volume, mais le fer est une matière ayant une masse volumique plus grande que le bois.
- id: nblm-quelle-est-la-valeur-de-la-masse-volumiq-5
  type: choix
  difficulte: 2
  enonce: Quelle est la valeur de la masse volumique de l'eau liquide dans les unités usuelles et légales ?
  reponse:
    options:
    - id: o1
      texte: 1 g/cm³ (ou 1 kg/L), ce qui équivaut à 1 000 kg/m³
    - id: o2
      texte: 1 000 g/cm³ (ou 1 kg/L), ce qui équivaut à 1 kg/m³
    - id: o3
      texte: 100 g/cm³, ce qui équivaut à 100 kg/m³
    - id: o4
      texte: 1 kg/cm³, ce qui équivaut à 1 g/m³
    bonnes:
    - o1
  indices:
    relance: Souviens-toi qu'un millilitre (1 cm³) d'eau possède une masse d'environ 1 gramme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur de conversion : 1 g/cm³ correspond à 1 000 kg/m³ et non à 1 kg/m³.'
  - si:
      contient:
      - o3
    relance: Ces valeurs numériques sont inexactes pour l'eau liquide.
  - si:
      contient:
      - o4
    relance: Une masse volumique de 1 kg/cm³ correspondrait à un matériau extrêmement dense.
  solution: 1 g/cm³ (ou 1 kg/L), ce qui équivaut à 1 000 kg/m³. Pour l'eau liquide, 1 cm³ a une masse de 1 g, ce qui correspond
    bien à 1 000 kg/m³.
- id: nblm-parmi-les-unites-suivantes-lesquelles-so-6
  type: choix
  difficulte: 3
  enonce: Parmi les unités suivantes, lesquelles sont des unités de masse volumique valides ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: g/cm³
    - id: o2
      texte: kg/m³
    - id: o3
      texte: g/cm²
    - id: o4
      texte: kg/L²
    bonnes:
    - o1
    - o2
  indices:
    relance: Repère les unités formées d'une unité de masse divisée par une unité de volume.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Le cm² est une unité de surface et non de volume.
  - si:
      contient:
      - o4
    relance: L'unité de volume (le litre) ne doit pas être élevée au carré.
  solution: g/cm³ ; kg/m³. Unité usuelle très utilisée en laboratoire, équivalente au g/mL.
- id: nblm-comment-s-appelle-la-methode-experimenta-7
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle la méthode expérimentale qui permet de mesurer le volume d'un solide irrégulier en calculant la
    différence de niveau d'eau dans une éprouvette graduée avant et après y avoir immergé le solide ?
  reponse:
    acceptees:
    - déplacement d'eau
    fautes_tolerees: 1
  indices:
    relance: Elle tire son nom de l'eau qui est poussée ou 'déplacée' par le solide.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: déplacement d'eau. Cette méthode mesure le volume d'eau poussé par le solide immergé.
- id: nblm-quelle-est-l-unite-de-la-masse-volumique-8
  type: texte_court
  difficulte: 1
  enonce: Quelle est l'unité de la masse volumique dans le Système International lorsque la masse est exprimée en kilogrammes
    et le volume en mètres cubes ? Exprime ce nom en toutes lettres.
  reponse:
    acceptees:
    - kilogramme par mètre cube
    fautes_tolerees: 1
  indices:
    relance: Associe l'unité de masse (kg) et l'unité de volume (m³) reliées par la préposition 'par'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: kilogramme par mètre cube. L'unité du Système International associe le kilogramme pour la masse et le mètre cube
    pour le volume.
