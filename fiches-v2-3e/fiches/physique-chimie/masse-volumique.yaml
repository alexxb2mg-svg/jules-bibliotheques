format: 2
notion: masse-volumique
version: 1
etat: verifiee
declencheurs:
- flotte ou coule
- lingot d'or
- huile qui flotte sur l'eau
- comparer deux matériaux
- convertir g/cm3 en kg/m3
- combien pèse ce cube
prerequis: []
essentiel: 'La masse volumique ρ (« rhô ») d''une espèce chimique est le rapport de sa masse m à son volume V : ρ = m / V.


  Dans le système international, elle s''exprime en kg/m³ ; en chimie et en physique de collège on utilise souvent

  g/cm³ ou g/mL (1 g/cm³ = 1000 kg/m³).


  Elle permet de retrouver une masse (m = ρ × V) ou un volume (V = m / ρ) sans peser ou mesurer directement.


  Elle caractérise une espèce chimique : deux échantillons de tailles différentes de la même matière ont la même

  masse volumique, ce qui permet de distinguer deux matériaux ou d''identifier une substance inconnue.


  La masse volumique de l''eau vaut environ 1000 kg/m³ (1 g/cm³) ; elle sert souvent de référence : un matériau plus

  dense qu''elle coule dans l''eau, un matériau moins dense flotte.

  '
methode:
- Repérer l'unité de la masse volumique donnée (kg/m³ ou g/cm³) et l'unité demandée pour la réponse.
- Utiliser ρ = m / V pour calculer une masse volumique à partir d'une mesure de masse et de volume.
- Utiliser m = ρ × V pour calculer une masse, en veillant à ce que le volume soit dans la même unité que celle utilisée pour
  ρ.
- Pour comparer avec l'eau (flotte ou coule), convertir dans la même unité (1 g/cm³ = 1000 kg/m³).
vocabulaire:
- terme: masse volumique
  definition: le rapport de la masse d'un échantillon à son volume, noté ρ et calculé par ρ = m / V
erreurs_frequentes:
- Mélanger g/cm³ et kg/m³ sans convertir (facteur 1000 entre les deux).
- 'Confondre masse volumique et masse : deux objets de tailles différentes du même matériau ont la même masse volumique mais
  pas la même masse.'
- Diviser le volume par la masse au lieu de la masse par le volume.
- Oublier que la masse volumique dépend un peu de la température (surtout pour les gaz).
exemple:
  enonce: Un cube d'aluminium a un volume de 10 cm³. La masse volumique de l'aluminium est 2,7 g/cm³. Calculer sa masse.
  solution: m = ρ × V = 2,7 × 10 = 27 g.
exercices:
- id: masse-lingot-or
  type: nombre
  difficulte: 1
  enonce: Un lingot d'or a un volume de 5 cm³. La masse volumique de l'or est 19,3 g/cm³. Calculer sa masse, en grammes.
  reponse:
    valeur: 96.5
    forme: libre
    tolerance: 0.1
  indices:
    relance: Quelle formule relie la masse, la masse volumique et le volume ?
    methode: Utilise m = ρ × V, avec ρ en g/cm³ et V en cm³.
    etape: Multiplie 19,3 par 5.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Reprends la multiplication de la masse volumique par le volume, chiffre par chiffre.
  solution: m = ρ × V = 19,3 × 5 = 96,5 g.
- id: masse-volumique-huile
  type: nombre
  difficulte: 1
  enonce: Un échantillon d'huile a une masse de 780 g pour un volume de 1000 mL. Calculer sa masse volumique en g/mL.
  reponse:
    valeur: 0.78
    forme: libre
    tolerance: 0.01
  indices:
    relance: Quelle formule relie la masse volumique, la masse et le volume ?
    methode: Utilise ρ = m / V, avec m en g et V en mL.
    etape: Divise 780 par 1000.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que tu divises bien la masse par le volume, et non l'inverse.
  solution: ρ = m / V = 780 / 1000 = 0,78 g/mL.
- id: huile-flotte-ou-coule
  type: choix
  difficulte: 2
  enonce: Une huile a une masse volumique de 0,78 g/mL. Que se passe-t-il si on en verse dans un verre d'eau ?
  reponse:
    options:
    - id: a
      texte: L'huile flotte sur l'eau
    - id: b
      texte: L'huile coule au fond de l'eau
    - id: c
      texte: L'huile se dissout entièrement dans l'eau
    bonnes:
    - a
  indices:
    relance: Compare la masse volumique de l'huile à celle de l'eau (environ 1 g/mL).
    methode: Un liquide moins dense que l'eau flotte à sa surface ; un liquide plus dense coule.
    etape: 0,78 est plus petit ou plus grand que 1 ?
  pieges:
  - si:
      contient:
      - b
    relance: 0,78 g/mL est-il plus petit ou plus grand que la masse volumique de l'eau (1 g/mL) ?
  - si:
      contient:
      - c
    relance: L'huile et l'eau ne sont pas miscibles, elles ne se mélangent pas de façon homogène.
  solution: '0,78 g/mL est inférieur à 1 g/mL (l''eau) : l''huile flotte à la surface de l''eau.'
- id: comparer-densite-fer-aluminium
  type: association
  difficulte: 2
  enonce: Relie chaque matériau à sa masse volumique.
  reponse:
    gauche:
    - id: a
      texte: fer
    - id: b
      texte: aluminium
    - id: c
      texte: or
    - id: d
      texte: eau
    droite:
    - id: x
      texte: 7,9 g/cm³
    - id: y
      texte: 2,7 g/cm³
    - id: z
      texte: 19,3 g/cm³
    - id: w
      texte: 1 g/cm³
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: L'eau sert de repère, avec une valeur ronde. Place-la d'abord.
    methode: Classe les quatre valeurs de la plus petite à la plus grande, puis associe-les aux matériaux en te souvenant
      que l'or est le plus dense des quatre.
    etape: L'or a la plus grande masse volumique des quatre ; l'eau a la plus petite.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère d'abord l'eau (1 g/cm³) et l'or (le plus dense).
  - si:
      diagnostic: associations_fausses
    relance: Range d'abord les quatre valeurs numériques dans l'ordre, puis réfléchis à quel matériau est le plus dense.
  solution: 'Fer : 7,9 g/cm³. Aluminium : 2,7 g/cm³. Or : 19,3 g/cm³. Eau : 1 g/cm³.'
- id: convertir-unites-masse-volumique
  type: nombre
  difficulte: 2
  enonce: Convertir 2,7 g/cm³ (la masse volumique de l'aluminium) en kg/m³.
  reponse:
    valeur: 2700
    forme: entier
    tolerance: 0
  indices:
    relance: Combien de kg/m³ vaut 1 g/cm³ ?
    methode: 1 g/cm³ correspond à 1000 kg/m³. Multiplie la valeur en g/cm³ par 1000.
    etape: Multiplie 2,7 par 1000.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ton facteur de conversion entre g/cm³ et kg/m³.
  solution: 2,7 g/cm³ = 2,7 × 1000 = 2700 kg/m³.
- id: expliquer-identification-matiere
  type: ouverte
  difficulte: 3
  enonce: Un bijoutier a deux anneaux dorés, de tailles différentes. Explique comment la masse volumique peut l'aider à savoir
    s'ils sont faits du même métal.
  criteres:
  - L'élève rappelle que la masse volumique caractérise une espèce chimique, indépendamment de la taille de l'échantillon.
  - L'élève propose de mesurer la masse et le volume de chaque anneau, puis de calculer ρ = m / V pour chacun.
  - L'élève conclut que si les deux masses volumiques calculées sont égales, les anneaux sont probablement du même métal.
  indices:
    relance: Deux objets de tailles différentes du même matériau ont-ils la même masse volumique ?
    methode: Décris comment mesurer la masse et le volume de chaque anneau, puis comment comparer les deux résultats.
    etape: Pense à peser chaque anneau et à mesurer son volume (par exemple par immersion dans l'eau).
  solution: La masse volumique caractérise une espèce chimique et ne dépend pas de la taille de l'échantillon. Le bijoutier
    peut mesurer la masse et le volume de chaque anneau, puis calculer ρ = m / V pour chacun. Si les deux valeurs obtenues
    sont égales, les anneaux sont probablement faits du même métal ; si elles diffèrent, ce ne sont pas les mêmes métaux.
