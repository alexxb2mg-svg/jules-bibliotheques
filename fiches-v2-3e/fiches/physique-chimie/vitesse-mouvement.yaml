# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: vitesse-mouvement
version: 3
etat: verifiee
declencheurs:
- référentiel
- mouvement uniforme
- chronophotographie
- trajectoire rectiligne
- vitesse en km/h
- distance divisée par durée
- mouvement ralenti
- par rapport au sol
- relativité du mouvement
prerequis: []
essentiel: 'Un mouvement se décrit toujours par rapport à un objet de référence, appelé référentiel. Un même objet peut être
  immobile dans un référentiel et en mouvement dans un autre : c''est la relativité du mouvement.

  Exemple : un passager assis dans un train est immobile par rapport au wagon, mais en mouvement par rapport au quai.


  Pour caractériser un mouvement, on donne :

  - le référentiel choisi ;

  - sa trajectoire (l''ensemble des positions successives) : rectiligne (une droite), circulaire (un cercle) ou curviligne
  (une courbe quelconque) ;

  - l''évolution de sa vitesse : uniforme (vitesse constante), accéléré (elle augmente) ou ralenti (elle diminue).


  La vitesse a une direction, un sens et une valeur. Dans un mouvement uniforme, sa valeur se calcule par :

  v = d ÷ t (d : distance parcourue, t : durée du parcours).

  On en déduit d = v × t et t = d ÷ v.


  Unités : v en m/s si d est en m et t en s ; v en km/h si d est en km et t en h.

  Pour passer des km/h aux m/s, on divise par 3,6. Pour passer des m/s aux km/h, on multiplie par 3,6.

  Exemple : 72 km/h = 72 ÷ 3,6 = 20 m/s.

  Durées : 1 h = 60 min = 3 600 s ; 1,5 h = 1 h 30 min ; 0,25 h = 15 min.


  Chronophotographie : on note la position d''un objet à intervalles de temps égaux.

  - Points alignés et également espacés : rectiligne uniforme.

  - Points alignés, écarts qui augmentent : rectiligne accéléré.

  - Points alignés, écarts qui diminuent : rectiligne ralenti.

  - Points sur un cercle, également espacés : circulaire uniforme.


  Au brevet : on te demande de décrire un mouvement (référentiel, trajectoire, vitesse), de faire un calcul avec v = d ÷ t
  en convertissant les unités, et d''exploiter une chronophotographie.

  '
methode:
- 'Préciser le référentiel : par rapport à quoi décrit-on le mouvement ?'
- Décrire la trajectoire (rectiligne, circulaire, curviligne), puis l'évolution de la vitesse (uniforme, accéléré, ralenti).
- 'Pour une chronophotographie : comparer les écarts entre points consécutifs (intervalles de temps égaux).'
- 'Pour un calcul : écrire la relation (v = d ÷ t, d = v × t ou t = d ÷ v) et vérifier que les unités vont ensemble.'
- Convertir si besoin (km/h ↔ m/s avec 3,6 ; minutes en secondes ou en heures), puis calculer.
- Donner le résultat avec son unité, et vérifier qu'il est vraisemblable.
vocabulaire:
- terme: référentiel
  definition: objet par rapport auquel on décrit un mouvement
- terme: relativité du mouvement
  definition: un même objet peut être immobile dans un référentiel et en mouvement dans un autre
- terme: trajectoire
  definition: ensemble des positions successives occupées par un point de l'objet
- terme: mouvement uniforme
  definition: mouvement dont la valeur de la vitesse reste constante
- terme: mouvement accéléré
  definition: mouvement dont la valeur de la vitesse augmente
- terme: mouvement ralenti
  definition: mouvement dont la valeur de la vitesse diminue
- terme: chronophotographie
  definition: image qui enregistre les positions d'un objet à intervalles de temps égaux
- terme: vitesse
  definition: grandeur qui a une direction, un sens et une valeur ; la valeur s'écrit v = d ÷ t
erreurs_frequentes:
- Dire qu'un objet « bouge » ou « est immobile » sans préciser par rapport à quoi.
- 'Mélanger les unités : une distance en km avec une durée en minutes, par exemple.'
- Multiplier par 3,6 au lieu de diviser pour passer des km/h aux m/s.
- 'Écrire une durée de 1,5 h comme « 1 h 50 min » : 1,5 h, c''est 1 h 30 min.'
exemple:
  enonce: Une trottinette roule à vitesse constante et parcourt 600 m en 2 min. Calcule sa vitesse en m/s.
  solution: 'On convertit la durée : 2 min = 120 s. Puis v = d ÷ t = 600 ÷ 120 = 5 m/s.'
exercices:
- id: julie-dans-le-train
  type: choix
  difficulte: 1
  enonce: Julie est assise dans un train qui roule. Par rapport à quoi est-elle immobile ?
  reponse:
    options:
    - id: a
      texte: le quai de la gare
    - id: b
      texte: son siège
    - id: c
      texte: le wagon
    - id: d
      texte: un arbre au bord de la voie
    bonnes:
    - b
    - c
  indices:
    relance: Être immobile par rapport à un objet, c'est rester toujours à la même place par rapport à lui. Qu'est-ce qui
      voyage avec Julie ?
    methode: 'Pour chaque objet, demande-toi : la distance entre Julie et cet objet change-t-elle pendant le trajet ?'
    etape: 'Le quai et l''arbre restent sur place pendant que le train avance : la distance entre eux et Julie change.'
  pieges:
  - si:
      contient:
      - a
    relance: Le quai reste à la gare quand le train part. La distance entre Julie et le quai reste-t-elle la même ?
  - si:
      contient:
      - d
    relance: L'arbre défile par la fenêtre. Julie reste-t-elle à la même distance de lui ?
  - si:
      diagnostic: incomplet
    relance: C'est juste, mais il y a une autre bonne réponse. Cherche un autre objet qui se déplace avec Julie.
  solution: Julie est immobile par rapport à son siège et par rapport au wagon, car elle voyage avec eux. Elle est en mouvement
    par rapport au quai et à l'arbre.
- id: vitesse-du-cycliste
  type: nombre
  difficulte: 1
  enonce: Un cycliste parcourt 30 km en 2 h, à vitesse constante. Quelle est sa vitesse en km/h ? Écris seulement le nombre.
  reponse:
    valeur: 15
    forme: libre
  indices:
    relance: Combien de kilomètres parcourt-il en une seule heure ?
    methode: 'Utilise v = d ÷ t, avec d en km et t en h : la vitesse sera en km/h.'
    etape: Ici, d vaut 30 km et t vaut 2 h. Il reste à faire la division.
  pieges:
  - si:
      valeur: 60
    relance: Tu as multiplié. La vitesse, c'est la distance divisée par la durée.
  - si:
      diagnostic: valeur_fausse
    relance: Écris la relation v = d ÷ t, remplace d et t par leurs valeurs, puis calcule.
  solution: v = d ÷ t = 30 ÷ 2 = 15 km/h.
- id: convertir-en-metres-par-seconde
  type: nombre
  difficulte: 2
  enonce: Une voiture roule à 90 km/h. Exprime cette vitesse en m/s. Écris seulement le nombre.
  reponse:
    valeur: 25
    forme: libre
  indices:
    relance: Rouler à 90 km/h, c'est parcourir 90 km en une heure. Combien de mètres, et combien de secondes, cela fait-il
      ?
    methode: 'Convertis : 1 km = 1 000 m et 1 h = 3 600 s. Puis divise la distance en mètres par la durée en secondes.'
    etape: 90 km, c'est 90 000 m, et 1 h, c'est 3 600 s. Il reste à diviser la distance par la durée.
  pieges:
  - si:
      valeur: 324
    relance: Tu as multiplié par 3,6. En une seconde, la voiture parcourt-elle plus ou moins qu'en une heure ?
  - si:
      valeur: 90000
    relance: Tu as bien converti les kilomètres en mètres, mais pas l'heure en secondes.
  - si:
      valeur: 1,5
    relance: 'Tu as divisé par 60 : c''est le nombre de minutes dans une heure. Combien y a-t-il de secondes dans une heure
      ?'
  - si:
      diagnostic: valeur_fausse
    relance: Convertis la distance en mètres et la durée en secondes, puis applique v = d ÷ t.
  solution: 'v = 90 000 m ÷ 3 600 s = 25 m/s. Raccourci : 90 ÷ 3,6 = 25.'
- id: duree-du-tgv
  type: nombre
  difficulte: 2
  enonce: Un TGV roule à la vitesse constante de 300 km/h. Combien de temps met-il pour parcourir 450 km ? Donne la durée
    en minutes. Écris seulement le nombre.
  reponse:
    valeur: 90
    forme: libre
  indices:
    relance: En une heure, le TGV parcourt 300 km. Lui faut-il plus ou moins d'une heure pour parcourir 450 km ?
    methode: De v = d ÷ t, on tire t = d ÷ v. Calcule t en heures, puis multiplie par 60 pour l'avoir en minutes.
    etape: 'Calcule d''abord 450 ÷ 300 : le résultat est en heures. Puis convertis-le en minutes.'
  pieges:
  - si:
      valeur: 1,5
    relance: Ce résultat est une durée en heures. On demande des minutes.
  - si:
      valeur: 110
    relance: Attention, 1,5 h ne veut pas dire 1 h 50 min. Une demi-heure, c'est combien de minutes ?
  - si:
      valeur: 135000
    relance: Tu as multiplié la vitesse par la distance. Quelle relation donne une durée ?
  - si:
      diagnostic: valeur_fausse
    relance: Utilise t = d ÷ v, puis convertis les heures en minutes.
  solution: t = d ÷ v = 450 ÷ 300 = 1,5 h, et 1,5 × 60 = 90 min (1 h 30 min).
- id: nature-des-mouvements
  type: association
  difficulte: 2
  enonce: Associe chaque situation au mouvement qui la décrit, dans le référentiel du sol (ou de l'horloge).
  reponse:
    gauche:
    - id: aiguille
      texte: l'extrémité de la trotteuse (aiguille des secondes) d'une horloge
    - id: bille
      texte: une bille lâchée qui tombe verticalement
    - id: freinage
      texte: une voiture qui freine sur une route droite
    - id: valise
      texte: une valise sur un tapis roulant droit qui avance à vitesse constante
    droite:
    - id: circulaire-uniforme
      texte: circulaire uniforme
    - id: rectiligne-accelere
      texte: rectiligne accéléré
    - id: rectiligne-ralenti
      texte: rectiligne ralenti
    - id: rectiligne-uniforme
      texte: rectiligne uniforme
    paires:
      aiguille: circulaire-uniforme
      bille: rectiligne-accelere
      freinage: rectiligne-ralenti
      valise: rectiligne-uniforme
  indices:
    relance: Pour chaque situation, quelle est la forme de la trajectoire ? Et la vitesse augmente-t-elle, diminue-t-elle
      ou reste-t-elle la même ?
    methode: Donne d'abord la trajectoire (droite ou cercle), puis l'évolution de la vitesse (constante, qui augmente, qui
      diminue).
    etape: 'Le bout de l''aiguille décrit un cercle, à vitesse constante. Continue avec la bille : va-t-elle de plus en plus
      vite ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pour la bille qui tombe, sa vitesse reste-t-elle constante ?
  - si:
      diagnostic: associations_fausses
    relance: Sépare d'abord la trajectoire circulaire des trajectoires rectilignes, puis regarde comment varie la vitesse.
  solution: 'Trotteuse : circulaire uniforme. Bille qui tombe : rectiligne accéléré. Voiture qui freine : rectiligne ralenti.
    Valise sur le tapis : rectiligne uniforme.'
- id: lire-une-chronophotographie
  type: ouverte
  difficulte: 3
  enonce: Sur une chronophotographie, on a noté la position d'un palet qui glisse sur une table, toutes les 0,1 s. Les points
    obtenus sont alignés, et l'écart entre deux points consécutifs diminue régulièrement. Décris le mouvement du palet et
    justifie ta réponse.
  criteres:
  - L'élève précise le référentiel (la table ou le sol).
  - L'élève dit que la trajectoire est rectiligne, car les points sont alignés.
  - L'élève dit que le mouvement est ralenti, car la distance parcourue pendant chaque intervalle de 0,1 s diminue.
  indices:
    relance: Que t'apprend l'alignement des points ? Et que t'apprend l'écart entre deux points ?
    methode: Décris d'abord la trajectoire, puis l'évolution de la vitesse, et dis par rapport à quoi tu décris le mouvement.
    etape: Les images sont prises à intervalles de temps égaux. Si l'écart diminue, le palet parcourt-il plus ou moins de
      distance à chaque intervalle ?
  solution: 'Par rapport à la table, la trajectoire du palet est rectiligne, car les points sont alignés. Le mouvement est
    ralenti : pendant chaque intervalle de 0,1 s, le palet parcourt une distance de plus en plus petite, donc sa vitesse diminue.'
- id: metres-par-seconde-en-kmh
  type: nombre
  difficulte: 2
  enonce: Un coureur va à 5 m/s. Exprime sa vitesse en km/h. Écris seulement le nombre.
  reponse:
    valeur: 18
    forme: libre
  indices:
    relance: 'Le nombre en km/h est plus grand que celui en m/s : dans une heure, on parcourt beaucoup de mètres.'
    methode: Pour passer des m/s aux km/h, on multiplie par 3,6.
    etape: Calcule 5 × 3,6.
  pieges:
  - si:
      valeur: 1.39
    relance: 'Tu as divisé par 3,6 : c''est le calcul dans l''autre sens (km/h vers m/s).'
  - si:
      valeur: 5
    relance: Tu n'as pas converti. Une vitesse en km/h n'a pas le même nombre qu'en m/s.
  solution: v = 5 × 3,6 = 18 km/h.
- id: distance-du-scooter
  type: nombre
  difficulte: 2
  enonce: Un scooter roule à la vitesse constante de 40 km/h pendant 15 min. Quelle distance parcourt-il ? Donne le résultat
    en km. Écris seulement le nombre.
  reponse:
    valeur: 10
    forme: libre
  indices:
    relance: 'La vitesse est en km/h : la durée doit être dans une unité qui va avec.'
    methode: Convertis la durée en heures (15 min est un quart d'heure), puis d = v × t.
    etape: Calcule 40 × 0,25.
  pieges:
  - si:
      valeur: 600
    relance: Tu as multiplié 40 par 15 sans convertir les minutes en heures.
  - si:
      valeur: 160
    relance: Tu as divisé 40 par 0,25 au lieu de multiplier.
  solution: 15 min = 0,25 h. d = v × t = 40 × 0,25 = 10 km.
- id: nblm-un-passager-est-assis-dans-un-train-en-m-1
  type: choix
  difficulte: 2
  enonce: Un passager est assis dans un train en marche. Par rapport à quel objet de référence (référentiel) ce passager est-il
    immobile ?
  reponse:
    options:
    - id: o1
      texte: Le wagon du train
    - id: o2
      texte: Le quai de la gare
    - id: o3
      texte: Les rails du chemin de fer
    - id: o4
      texte: Un arbre situé au bord de la voie
    bonnes:
    - o1
  indices:
    relance: Pense au corps par rapport auquel la position du passager ne change pas du tout.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le quai se déplace par rapport au train, donc le passager est en mouvement par rapport au
      quai.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : les rails sont fixes par rapport au sol, donc le passager se déplace par rapport aux rails.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : l''arbre est immobile par rapport au sol, donc le passager s''en éloigne ou s''en rapproche.'
  solution: 'Le wagon du train. C''est exact : le passager ne change pas de position par rapport au wagon dans lequel il est
    assis.'
- id: nblm-comment-qualifie-t-on-la-trajectoire-d-u-2
  type: choix
  difficulte: 2
  enonce: Comment qualifie-t-on la trajectoire d'un objet dont l'ensemble des positions successives forme une ligne droite
    ?
  reponse:
    options:
    - id: o1
      texte: Rectiligne
    - id: o2
      texte: Circulaire
    - id: o3
      texte: Curviligne
    - id: o4
      texte: Uniforme
    bonnes:
    - o1
  indices:
    relance: Cherche le terme dont le radical renvoie directement à la notion de ligne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : une trajectoire circulaire forme un cercle, pas une ligne droite.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : une trajectoire curviligne forme une courbe quelconque.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : ''uniforme'' décrit la valeur de la vitesse (vitesse constante) et non la forme géométrique
      de la ligne.'
  solution: 'Rectiligne. C''est exact : une trajectoire sous forme de ligne droite est qualifiée de rectiligne.'
- id: nblm-un-mobile-se-deplace-le-long-d-une-ligne-3
  type: choix
  difficulte: 2
  enonce: Un mobile se déplace le long d'une ligne droite à vitesse constante. Comment qualifie-t-on son mouvement ?
  reponse:
    options:
    - id: o1
      texte: Rectiligne et uniforme
    - id: o2
      texte: Rectiligne et accéléré
    - id: o3
      texte: Circulaire et uniforme
    - id: o4
      texte: Rectiligne et ralenti
    bonnes:
    - o1
  indices:
    relance: Associe l'adjectif lié au déplacement en ligne droite à celui lié à une vitesse constante.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : un mouvement accéléré signifie que la valeur de la vitesse augmente au cours du temps.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : ''circulaire'' signifierait que le mobile décrit un cercle.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : un mouvement ralenti correspond à une baisse de la valeur de la vitesse.'
  solution: 'Rectiligne et uniforme. C''est exact : sa trajectoire suit une droite (rectiligne) et sa vitesse ne varie pas
    (uniforme).'
- id: nblm-une-voiture-parcourt-une-distance-d-150-4
  type: choix
  difficulte: 2
  enonce: Une voiture parcourt une distance d = 150 km en une durée t = 2 h. Quelle est sa vitesse moyenne v en km/h ?
  reponse:
    options:
    - id: o1
      texte: 75 km/h
    - id: o2
      texte: 300 km/h
    - id: o3
      texte: 0,013 km/h
    - id: o4
      texte: 148 km/h
    bonnes:
    - o1
  indices:
    relance: Applique la relation v = d ÷ t avec les valeurs fournies.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : tu as multiplié la distance par la durée (150 × 2) au lieu d''effectuer une division.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : tu as divisé la durée par la distance (2 ÷ 150) au lieu de faire la distance divisée par
      la durée.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : tu as soustrait la durée de la distance (150 − 2) au lieu de calculer leur quotient.'
  solution: '75 km/h. C''est exact : la vitesse s''obtient par la distance divisée par la durée : v = 150 km ÷ 2 h = 75 km/h.'
- id: nblm-sur-une-chronophotographie-dont-les-posi-5
  type: choix
  difficulte: 2
  enonce: Sur une chronophotographie dont les positions sont prises à intervalles de temps égaux, on observe des écarts entre
    les points de plus en plus grands. Que peut-on dire du mouvement ?
  reponse:
    options:
    - id: o1
      texte: Il est accéléré
    - id: o2
      texte: Il est uniforme
    - id: o3
      texte: Il est ralenti
    - id: o4
      texte: L'objet est immobile
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'évolution de la distance parcourue pendant chaque même intervalle de temps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : pour un mouvement uniforme, les points seraient séparés par des distances strictement égales.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : pour un mouvement ralenti, les écarts entre les positions successives diminueraient.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : si l''objet était immobile, toutes les images de l''objet seraient superposées au même endroit.'
  solution: 'Il est accéléré. C''est exact : des distances parcourues de plus en plus grandes pendant des durées égales indiquent
    une vitesse qui augmente.'
- id: nblm-quelles-sont-les-deux-affirmations-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations correctes concernant les formules et unités de vitesse ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Pour passer d'une vitesse en km/h à une vitesse en m/s, on divise par 3,6.
    - id: o2
      texte: La vitesse s'exprime en km/h lorsque la distance est en km et la durée en h.
    - id: o3
      texte: Pour passer d'une vitesse en km/h à une vitesse en m/s, on multiplie par 3,6.
    - id: o4
      texte: La valeur de la vitesse se calcule en multipliant la distance par la durée.
    bonnes:
    - o1
    - o2
  indices:
    relance: Vérifie la formule fondamentale de la vitesse et la règle de conversion exacte entre km/h et m/s.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : multiplier par 3,6 permet de passer des m/s aux km/h, alors qu''il faut diviser pour passer
      des km/h aux m/s.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la vitesse se calcule en faisant la distance divisée par la durée (v = d ÷ t).'
  solution: 'Pour passer d''une vitesse en km/h à une vitesse en m/s, on divise par 3,6 ; La vitesse s''exprime en km/h lorsque
    la distance est en km et la durée en h. C''est exact : 1 km/h correspond à 1 000 m / 3 600 s, soit 1 / 3,6 m/s, il faut
    donc diviser par 3,6.'
- id: nblm-complete-la-phrase-l-objet-de-reference-7
  type: texte_court
  difficulte: 1
