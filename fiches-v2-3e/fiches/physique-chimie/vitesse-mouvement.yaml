format: 2
notion: vitesse-mouvement
version: 1
etat: verifiee
declencheurs:
- vitesse en km/h
- convertir en m/s
- passager assis dans un train
- mouvement par rapport au sol
- distance parcourue en un temps donné
prerequis: []
essentiel: 'Un objet est en mouvement si sa position change au cours du temps par rapport à un référentiel (un objet ou un

  point choisi comme fixe) ; le mouvement est donc relatif : un passager assis dans un train est immobile par

  rapport au train, mais en mouvement par rapport au sol.


  La vitesse caractérise la rapidité du mouvement : v = d / t, avec d la distance parcourue et t la durée du

  parcours. Elle s''exprime en m/s (unité internationale) ou en km/h (usage courant).


  Un mouvement est uniforme si la vitesse reste constante au cours du temps ; sinon la vitesse varie (le mouvement

  accélère ou ralentit).


  La trajectoire (le chemin suivi) peut être rectiligne (une droite) ou circulaire (un cercle) ; elle dépend elle

  aussi du référentiel choisi.


  Pour convertir une vitesse de km/h en m/s, on multiplie par 1000 (m dans un km) et on divise par 3600 (s dans une

  heure).

  '
methode:
- Toujours préciser le référentiel par rapport auquel on décrit un mouvement.
- Utiliser v = d / t pour calculer une vitesse, en veillant à l'unité de d et de t.
- Pour convertir km/h en m/s, multiplier par 1000 et diviser par 3600 (ou diviser par 3,6).
- Repérer si le mouvement est uniforme (vitesse constante) en comparant les distances parcourues sur des durées égales.
vocabulaire:
- terme: référentiel
  definition: objet ou point choisi comme fixe, par rapport auquel on décrit le mouvement d'un autre objet
erreurs_frequentes:
- Oublier de préciser le référentiel, alors que le mouvement en dépend totalement.
- Confondre distance parcourue et déplacement (distance entre point de départ et d'arrivée).
- Se tromper dans la conversion km/h vers m/s (facteur 3,6, pas 3 ou 10).
- Croire qu'un objet est forcément immobile s'il ne bouge pas par rapport à soi.
exemple:
  enonce: Une voiture parcourt 120 km en 1 h 30 min. Calculer sa vitesse moyenne en km/h.
  solution: 1 h 30 min = 1,5 h. v = d / t = 120 / 1,5 = 80 km/h.
exercices:
- id: conversion-80kmh-en-ms
  type: nombre
  difficulte: 2
  enonce: Convertir 80 km/h en m/s (arrondir au dixième).
  reponse:
    valeur: 22.2
    forme: libre
    tolerance: 0.1
  indices:
    relance: Utilise le facteur de conversion entre km/h et m/s.
    methode: Multiplie par 1000 puis divise par 3600, ou divise directement par 3,6.
    etape: 80 000 divisé par 3600.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Revérifie ta conversion ; le facteur exact est 3,6, pas 3 ni 10.
  solution: 80 km/h = 80 000 / 3600, soit environ 22,2 m/s.
- id: distance-cycliste-18kmh
  type: nombre
  difficulte: 2
  enonce: Un cycliste roule à vitesse constante de 18 km/h pendant 20 min. Quelle distance parcourt-il, en km ?
  reponse:
    valeur: 6
    forme: entier
    tolerance: 0.1
  indices:
    relance: Convertis d'abord la durée en heures avant de calculer.
    methode: d = v × t, avec t exprimé dans la même unité de temps que v.
    etape: 20 min = 1/3 h.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta conversion de 20 min en heures avant de multiplier par la vitesse.
  solution: 20 min = 1/3 h. d = 18 × 1/3 = 6 km.
- id: referentiel-passager-train
  type: ouverte
  difficulte: 2
  enonce: Un passager assis dans un train qui roule est-il en mouvement par rapport au sol ? Est-il en mouvement par rapport
    à son siège ? Explique la différence.
  criteres:
  - L'élève dit que le passager est en mouvement par rapport au sol, car le train avance.
  - L'élève dit que le passager est immobile par rapport à son siège, car il ne bouge pas dans le train.
  - L'élève explique que le mouvement dépend du référentiel choisi.
  indices:
    relance: Pense au référentiel choisi dans chaque cas (le sol, ou le siège du train).
    methode: Compare la position du passager par rapport à deux référentiels différents.
    etape: Le train, lui, se déplace par rapport au sol.
  solution: 'Il est en mouvement par rapport au sol (le train avance), mais immobile par rapport à son siège (il ne bouge
    pas dans le train) : le mouvement dépend du référentiel choisi.'
- id: vitesse-moyenne-trajet-voiture
  type: nombre
  difficulte: 1
  enonce: Une voiture parcourt 90 km en 1 h 30 min. Calculer sa vitesse moyenne, en km/h.
  reponse:
    valeur: 60
    forme: entier
    tolerance: 0.5
  indices:
    relance: Convertis d'abord la durée du trajet en heures.
    methode: v = d / t, avec t en heures.
    etape: 1 h 30 min = 1,5 h.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Revérifie ta conversion de la durée en heures avant de diviser la distance par ce temps.
  solution: 1 h 30 min = 1,5 h. v = 90 / 1,5 = 60 km/h.
- id: mouvement-uniforme-definition
  type: texte_court
  difficulte: 1
  enonce: Comment qualifie-t-on un mouvement dont la vitesse reste constante au cours du temps ?
  reponse:
    acceptees:
    - uniforme
    fautes_tolerees: 1
  indices:
    relance: Ce mot décrit une régularité, une absence de variation.
    methode: Il s'agit d'un adjectif qui qualifie un mouvement à vitesse constante.
    etape: Pense au contraire d'un mouvement qui accélère ou ralentit sans cesse.
  pieges:
  - si:
      valeur: accéléré
    relance: Un mouvement accéléré a une vitesse qui augmente ; ici, on cherche le mot pour une vitesse qui reste constante.
  solution: On dit qu'il est uniforme.
