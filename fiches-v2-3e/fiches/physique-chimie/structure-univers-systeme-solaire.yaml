format: 2
notion: structure-univers-systeme-solaire
version: 2
etat: verifiee
declencheurs:
- voie lactée
- unité astronomique
- distance des étoiles
- planètes gazeuses
- planètes telluriques
- combien de planètes
- taille de l'univers
- étoiles et galaxies
- lumière des étoiles
- nombre de planètes
prerequis: []
essentiel: 'L''Univers contient des centaines de milliards de galaxies. Une galaxie est un immense ensemble d''étoiles (des
  centaines de milliards pour la nôtre), de gaz et de poussières. Notre galaxie s''appelle la Voie lactée.


  Le système solaire est une toute petite partie de la Voie lactée. Il est formé d''une étoile, le Soleil, et de tout ce qui
  tourne autour de lui :

  - 8 planètes : Mercure, Vénus, la Terre, Mars (rocheuses, dites telluriques), puis Jupiter, Saturne, Uranus, Neptune (géantes,
  dites gazeuses) ;

  - des satellites naturels qui tournent autour des planètes (la Lune pour la Terre) ;

  - des planètes naines, des astéroïdes et des comètes.


  Une étoile produit sa propre lumière ; une planète et un satellite ne font que renvoyer la lumière du Soleil.


  Emboîtement, du plus petit au plus grand : la Terre, le système solaire, la Voie lactée, l''Univers.


  Entre ces objets, il y a surtout du vide : les distances sont immenses. On utilise donc plusieurs unités :

  - le kilomètre (km) sur Terre ;

  - l''unité astronomique (ua) dans le système solaire : 1 ua ≈ 150 millions de km (distance moyenne Terre-Soleil) ;

  - l''année-lumière (al) pour les étoiles et les galaxies : c''est la distance parcourue par la lumière dans le vide en une
  année. 1 al ≈ 9 460 milliards de km.


  La lumière se propage dans le vide à environ 300 000 km/s. Elle met environ 8 min pour venir du Soleil et environ 1 s pour
  venir de la Lune.


  Conversions : pour passer des al aux km, on multiplie par 9 460 milliards. Pour une durée, on utilise t = d ÷ v.


  Repère : l''étoile la plus proche du Soleil, Proxima du Centaure, est à environ 4,2 al.


  Au brevet : on te demande de situer un astre dans l''emboîtement, de choisir l''unité adaptée et de convertir des distances
  (ua, al, km).

  '
methode:
- 'Repérer l''objet : étoile, planète, satellite, galaxie ? Le placer dans l''emboîtement Terre < système solaire < Voie lactée
  < Univers.'
- 'Choisir l''unité adaptée : km pour la Terre, ua pour le système solaire, al pour les étoiles et les galaxies.'
- 'Pour convertir des années-lumière en km : multiplier le nombre d''al par la valeur de 1 al en km.'
- 'Pour convertir des ua en km : multiplier le nombre d''ua par 150 millions de km.'
- 'Pour calculer la durée du trajet de la lumière : durée = distance ÷ vitesse, avec des unités qui vont ensemble (km et km/s
  donnent des secondes).'
vocabulaire:
- terme: Univers
  definition: 'l''ensemble de tout ce qui existe : des centaines de milliards de galaxies et du vide'
- terme: galaxie
  definition: immense ensemble d'étoiles, de gaz et de poussières ; la nôtre est la Voie lactée
- terme: système solaire
  definition: le Soleil et tous les objets qui tournent autour de lui
- terme: planète tellurique
  definition: planète rocheuse, comme la Terre ; les quatre plus proches du Soleil
- terme: planète gazeuse
  definition: 'planète géante formée surtout de gaz : Jupiter, Saturne, Uranus, Neptune'
- terme: unité astronomique (ua)
  definition: distance moyenne entre la Terre et le Soleil, environ 150 millions de km
- terme: année-lumière (al)
  definition: distance parcourue par la lumière dans le vide en une année, environ 9 460 milliards de km
- terme: satellite naturel
  definition: astre qui tourne autour d'une planète, comme la Lune autour de la Terre
erreurs_frequentes:
- 'Croire que l''année-lumière est une durée : c''est une distance, malgré le mot « année ».'
- 'Confondre système solaire et galaxie : le système solaire n''est qu''une toute petite partie de la Voie lactée.'
- 'Appeler le Soleil une planète : c''est une étoile, qui produit sa propre lumière.'
- Diviser la vitesse par la distance au lieu de diviser la distance par la vitesse pour trouver une durée.
exemple:
  enonce: L'étoile la plus proche du Soleil, Proxima du Centaure, est à environ 4,2 al. Exprime cette distance en milliards
    de km (1 al ≈ 9 460 milliards de km).
  solution: 'd = 4,2 × 9 460 ≈ 39 700 milliards de km, soit presque 40 000 milliards de km : un nombre énorme, d''où l''intérêt
    de l''année-lumière.'
exercices:
- id: ranger-par-taille
  type: ordre
  difficulte: 1
  enonce: Range ces objets du plus petit au plus grand.
  reponse:
    elements:
    - id: lune
      texte: la Lune
    - id: terre
      texte: la Terre
    - id: soleil
      texte: le Soleil
    - id: systeme-solaire
      texte: le système solaire
    - id: voie-lactee
      texte: la Voie lactée
    - id: univers
      texte: l'Univers
  indices:
    relance: Lequel de ces objets contient tous les autres ? Et lequel est contenu dans presque tous ?
    methode: 'Pense à un emboîtement : chaque objet est une partie du suivant, ou beaucoup plus petit que lui.'
    etape: Le système solaire contient le Soleil, et le Soleil est bien plus gros que la Terre. Place ensuite la Lune et la
      Voie lactée.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Tu y es presque : deux objets voisins sont inversés. Lequel contient l''autre, ou lequel est le plus gros ?'
  - si:
      diagnostic: ordre_faux
    relance: Commence par l'objet qui contient tous les autres, puis remonte vers le plus petit.
  solution: La Lune (satellite) < la Terre (planète) < le Soleil (étoile) < le système solaire < la Voie lactée (notre galaxie)
    < l'Univers.
- id: nommer-les-astres
  type: association
  difficulte: 1
  enonce: Associe chaque astre à sa catégorie.
  reponse:
    gauche:
    - id: soleil
      texte: le Soleil
    - id: terre
      texte: la Terre
    - id: lune
      texte: la Lune
    - id: jupiter
      texte: Jupiter
    - id: voie-lactee
      texte: la Voie lactée
    droite:
    - id: etoile
      texte: une étoile
    - id: planete
      texte: une planète
    - id: satellite
      texte: un satellite naturel
    - id: galaxie
      texte: une galaxie
    paires:
      soleil: etoile
      terre: planete
      lune: satellite
      jupiter: planete
      voie-lactee: galaxie
  indices:
    relance: Lequel de ces astres produit sa propre lumière ? Lequel tourne autour d'une planète ?
    methode: Une étoile brille par elle-même, une planète tourne autour d'une étoile, un satellite tourne autour d'une planète,
      une galaxie regroupe des milliards d'étoiles.
    etape: La Lune tourne autour de la Terre, et la Terre tourne autour du Soleil. Continue avec les autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie celle du Soleil : produit-il sa propre lumière ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends les définitions : qui tourne autour de qui ? Qui brille par lui-même ?'
  solution: Le Soleil est une étoile ; la Terre et Jupiter sont des planètes ; la Lune est un satellite naturel de la Terre
    ; la Voie lactée est une galaxie.
- id: definition-annee-lumiere
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une année-lumière ?
  reponse:
    options:
    - id: a
      texte: une durée égale à une année
    - id: b
      texte: la distance parcourue par la lumière dans le vide en une année
    - id: c
      texte: la vitesse de la lumière
    - id: d
      texte: l'âge d'une étoile
    bonnes:
    - b
  indices:
    relance: 'Dans quelle situation utilise-t-on l''année-lumière : pour dire combien de temps, ou à quelle distance se trouve
      une étoile ?'
    methode: 'Regarde l''unité : on l''emploie pour exprimer l''éloignement des étoiles et des galaxies.'
    etape: 'Proxima du Centaure est « à 4,2 années-lumière » de nous : cela répond à la question « à quelle distance ? ».'
  pieges:
  - si:
      contient:
      - a
    relance: 'Le mot « année » est trompeur. On dit qu''une étoile est « à 4 années-lumière » : est-ce une durée ou un éloignement
      ?'
  - si:
      contient:
      - c
    relance: La vitesse de la lumière s'exprime en km/s. L'année-lumière s'exprime-t-elle en km/s ?
  - si:
      contient:
      - d
    relance: L'année-lumière sert à situer une étoile, pas à dire depuis quand elle existe. Que mesure-t-on ?
  solution: 'Une année-lumière est une distance : celle que parcourt la lumière dans le vide en une année, environ 9 460 milliards
    de km.'
- id: lumiere-soleil-terre
  type: nombre
  difficulte: 2
  enonce: Le Soleil est à environ 150 000 000 km de la Terre. La lumière se propage à environ 300 000 km/s. Combien de secondes
    met la lumière du Soleil pour arriver sur Terre ? Écris seulement le nombre.
  reponse:
    valeur: 500
    forme: libre
  indices:
    relance: Tu connais une distance et une vitesse. Quelle grandeur cherches-tu ?
    methode: Utilise durée = distance ÷ vitesse. Avec une distance en km et une vitesse en km/s, la durée est en secondes.
    etape: 'Simplifie la division 150 000 000 ÷ 300 000 en enlevant quatre zéros à chacun des deux nombres : c''est comme
      15 000 ÷ 30.'
  pieges:
  - si:
      valeur: 0,002
    relance: Tu as divisé la vitesse par la distance. Pour une durée, c'est la distance qu'on divise par la vitesse.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie la relation (durée = distance ÷ vitesse) et compte bien les zéros.
  solution: t = d ÷ v = 150 000 000 ÷ 300 000 = 500 s, soit environ 8 minutes et 20 secondes.
- id: distance-sirius
  type: nombre
  difficulte: 2
  enonce: L'étoile Sirius est à environ 8,6 années-lumière de nous. Une année-lumière vaut environ 9 500 milliards de km.
    Calcule la distance de Sirius en milliards de km. Écris seulement le nombre.
  reponse:
    valeur: 81700
    forme: libre
  indices:
    relance: Combien de milliards de km représente une seule année-lumière ? Et 8,6 années-lumière ?
    methode: Multiplie le nombre d'années-lumière par la valeur d'une année-lumière en milliards de km.
    etape: Pour calculer 8,6 × 9 500, fais 8 × 9 500 puis ajoute 0,6 × 9 500.
  pieges:
  - si:
      valeur: 81700000000000
    relance: Ton calcul est bon, mais on demande le résultat en milliards de km, pas en km.
  - si:
      diagnostic: valeur_fausse
    relance: As-tu bien multiplié, et non divisé ? Une distance de plusieurs années-lumière est plus grande qu'une seule.
  solution: d = 8,6 × 9 500 = 81 700 milliards de km.
- id: pourquoi-annee-lumiere
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi les astronomes utilisent l'année-lumière plutôt que le kilomètre pour indiquer la distance des
    étoiles. Appuie-toi sur un exemple chiffré.
  criteres:
  - L'élève définit l'année-lumière comme une distance (celle parcourue par la lumière dans le vide en un an).
  - L'élève explique que les distances des étoiles en km sont des nombres énormes, difficiles à écrire et à comparer.
  - L'élève donne un exemple chiffré juste (par exemple 4,2 al ≈ 40 000 milliards de km pour Proxima du Centaure).
  indices:
    relance: Combien de kilomètres vaut une seule année-lumière ? Est-ce un petit ou un grand nombre ?
    methode: Définis l'unité, puis convertis la distance d'une étoile en km pour montrer la taille du nombre obtenu.
    etape: 'Commence par : « Une année-lumière est la distance parcourue par la lumière en un an, soit environ 9 460 milliards
      de km. »'
  solution: 'Une année-lumière est la distance parcourue par la lumière dans le vide en un an, environ 9 460 milliards de
    km. Les étoiles sont si loin qu''en km on obtient des nombres énormes : Proxima du Centaure, l''étoile la plus proche
    du Soleil, est à 4,2 al, soit environ 40 000 milliards de km. Avec l''année-lumière, les nombres restent petits et faciles
    à comparer.'
- id: unite-adaptee
  type: association
  difficulte: 2
  enonce: Associe chaque distance à l'unité la plus adaptée pour l'exprimer.
  reponse:
    gauche:
    - id: ville
      texte: la distance entre deux villes
    - id: neptune
      texte: la distance entre le Soleil et Neptune
    - id: etoile
      texte: la distance entre le Soleil et une autre étoile
    droite:
    - id: km
      texte: le kilomètre
    - id: ua
      texte: l'unité astronomique
    - id: al
      texte: l'année-lumière
    paires:
      ville: km
      neptune: ua
      etoile: al
  indices:
    relance: Classe les trois distances de la plus petite à la plus grande.
    methode: Le kilomètre sert sur Terre, l'unité astronomique dans le système solaire, l'année-lumière au-delà.
    etape: Neptune est une planète du système solaire. Une autre étoile est beaucoup plus loin que tout le système solaire.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule paire est fausse. Neptune fait partie du système solaire, l'étoile est hors du système solaire.
  - si:
      diagnostic: associations_fausses
    relance: 'Plusieurs paires sont fausses. Pars de l''échelle : Terre, système solaire, au-delà du système solaire.'
  solution: 'Entre deux villes : le kilomètre. Soleil-Neptune (dans le système solaire) : l''unité astronomique. Soleil-autre
    étoile : l''année-lumière.'
- id: ua-en-km
  type: nombre
  difficulte: 2
  enonce: Jupiter est à environ 5 ua du Soleil. Sachant que 1 ua vaut environ 150 millions de km, calcule cette distance en
    millions de km. Écris seulement le nombre.
  reponse:
    valeur: 750
    forme: libre
  indices:
    relance: Une ua vaut 150 millions de km. Combien de fois cette distance faut-il compter ?
    methode: Distance en km = nombre d'ua × valeur d'une ua en km. Reste en millions de km.
    etape: Calcule 5 × 150.
  pieges:
  - si:
      valeur: 30
    relance: 'Tu as divisé au lieu de multiplier. Jupiter est plus loin que la Terre : le résultat doit dépasser 150.'
  - si:
      valeur: 155
    relance: Tu as additionné. Il s'agit de 5 fois la distance Terre-Soleil.
  solution: d = 5 × 150 = 750 millions de km.
- id: nblm-combien-de-planetes-composent-le-systeme-1
  type: choix
  difficulte: 2
  enonce: Combien de planètes composent le système solaire et tournent autour du Soleil ?
  reponse:
    options:
    - id: o1
      texte: 8 planètes
    - id: o2
      texte: 9 planètes
    - id: o3
      texte: 12 planètes
    - id: o4
      texte: Des centaines de milliards
    bonnes:
    - o1
  indices:
    relance: 'Pense aux deux groupes : les planètes rocheuses et les planètes géantes.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : Pluton n''est plus considérée comme une planète principale, mais comme une planète
      naine.'
  - si:
      contient:
      - o3
    relance: Cette réponse confond le nombre de planètes avec d'autres découpages comme les mois de l'année ou les constellations.
  - si:
      contient:
      - o4
    relance: Ce nombre impressionnant correspond au nombre de galaxies dans l'Univers ou d'étoiles dans une galaxie, pas au
      nombre de planètes du système solaire.
  solution: '8 planètes. Le système solaire comprend exactement 8 planètes : quatre telluriques et quatre gazeuses.'
- id: nblm-parmi-les-propositions-suivantes-quelles-2
  type: choix
  difficulte: 2
  enonce: Parmi les propositions suivantes, quelles sont les quatre planètes telluriques (rocheuses) du système solaire ?
  reponse:
    options:
    - id: o1
      texte: Mercure, Vénus, la Terre et Mars
    - id: o2
      texte: Jupiter, Saturne, Uranus et Neptune
    - id: o3
      texte: La Terre, Mars, Jupiter et Saturne
    - id: o4
      texte: Mercure, Vénus, la Lune et la Terre
    bonnes:
    - o1
  indices:
    relance: Elles sont les plus proches du Soleil et possèdent une surface solide.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Il s'agit des quatre planètes géantes gazeuses, situées au-delà de Mars.
  - si:
      contient:
      - o3
    relance: 'C''est un mélange : la Terre et Mars sont telluriques, mais Jupiter et Saturne sont gazeuses.'
  - si:
      contient:
      - o4
    relance: Attention, la Lune n'est pas une planète, mais un satellite naturel qui tourne autour de la Terre.
  solution: Mercure, Vénus, la Terre et Mars. Ce sont bien les quatre planètes rocheuses situées le plus près du Soleil.
- id: nblm-comment-s-appelle-la-galaxie-a-laquelle-3
  type: choix
  difficulte: 2
  enonce: Comment s'appelle la galaxie à laquelle appartient notre système solaire ?
  reponse:
    options:
    - id: o1
      texte: La Voie lactée
    - id: o2
      texte: Le Système solaire
    - id: o3
      texte: L'Univers
    - id: o4
      texte: Proxima du Centaure
    bonnes:
    - o1
  indices:
    relance: Son nom évoque une traînée blanchâtre de lait dans le ciel nocturne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: L'Univers englobe l'ensemble de l'espace et contient des centaines de milliards de galaxies.
  - si:
      contient:
      - o4
    relance: Proxima du Centaure est le nom d'une étoile (la plus proche du Soleil), et non d'une galaxie.
  solution: La Voie lactée. La Voie lactée est la galaxie (ensemble de milliards d'étoiles) qui abrite notre système solaire.
- id: nblm-a-quoi-correspond-la-valeur-d-une-unite-4
  type: choix
  difficulte: 2
  enonce: À quoi correspond la valeur d'une unité astronomique (ua) ?
  reponse:
    options:
    - id: o1
      texte: À la distance moyenne entre la Terre et le Soleil (environ 150 millions de km)
    - id: o2
      texte: À la distance parcourue par la lumière en un an
    - id: o3
      texte: Au temps que met la Terre pour faire le tour du Soleil
    - id: o4
      texte: À la distance séparant le Soleil de l'étoile la plus proche
    bonnes:
    - o1
  indices:
    relance: C'est l'unité de mesure de distance privilégiée au sein du système solaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : la distance parcourue par la lumière en un an s''appelle l''année-lumière.'
  - si:
      contient:
      - o3
    relance: L'unité astronomique est une unité de distance (longueur) et non de durée.
  - si:
      contient:
      - o4
    relance: Pour mesurer les distances entre étoiles, l'unité astronomique est trop petite, on utilise l'année-lumière.
  solution: À la distance moyenne entre la Terre et le Soleil (environ 150 millions de km). L'unité astronomique est définie
    comme la distance moyenne entre la Terre et le Soleil.
- id: nblm-quelle-est-la-definition-de-l-annee-lumi-5
  type: choix
  difficulte: 2
  enonce: Quelle est la définition de l'année-lumière (al), utilisée pour mesurer la distance des étoiles ?
  reponse:
    options:
    - id: o1
      texte: La distance parcourue par la lumière dans le vide en une année
    - id: o2
      texte: La durée nécessaire à la lumière du Soleil pour parvenir jusqu'à la Terre
    - id: o3
      texte: Le temps que met une planète pour faire une révolution complète
    - id: o4
      texte: La vitesse de la lumière calculée sur un an
    bonnes:
    - o1
  indices:
    relance: Ne te laisse pas induire en erreur par la présence du mot 'année'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : malgré la présence du mot ''année'', il s''agit d''une distance et non d''une durée.'
  - si:
      contient:
      - o3
    relance: Une année-lumière n'exprime pas une période de révolution mais une longueur.
  - si:
      contient:
      - o4
    relance: L'année-lumière n'est pas une vitesse, c'est une distance équivalente à environ 9 460 milliards de kilomètres.
  solution: La distance parcourue par la lumière dans le vide en une année. L'année-lumière est une unité de distance adaptée
    aux échelles gigantesques des étoiles et des galaxies.
- id: nblm-parmi-les-affirmations-suivantes-sur-la-6
  type: choix
  difficulte: 3
  enonce: Parmi les affirmations suivantes sur la structure de l'Univers et du système solaire, quelles sont les DEUX propositions
    correctes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Jupiter, Saturne, Uranus et Neptune sont des planètes gazeuses géantes
    - id: o2
      texte: Le Soleil est une étoile qui produit sa propre lumière
    - id: o3
      texte: Les planètes telluriques sont constituées uniquement de gaz sans surface solide
    - id: o4
      texte: La Lune est une planète naine qui gravite directement autour du Soleil
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux caractéristiques du Soleil et au type des quatre planètes les plus éloignées du Soleil.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
