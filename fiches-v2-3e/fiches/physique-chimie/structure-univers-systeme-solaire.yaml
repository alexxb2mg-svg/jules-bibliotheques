format: 2
notion: structure-univers-systeme-solaire
version: 1
etat: verifiee
declencheurs:
- combien de planètes
- planète tellurique
- planète gazeuse
- unité astronomique
- distance Terre-Soleil
- Voie lactée
prerequis: []
essentiel: 'L''Univers contient des milliards de galaxies, dont la Voie lactée, qui elle-même contient des milliards d''étoiles,

  dont le Soleil.


  Le système solaire est formé du Soleil (une étoile) et de tout ce qui tourne autour de lui par gravitation :

  8 planètes, leurs satellites naturels (comme la Lune), des astéroïdes et des comètes.


  On distingue les planètes telluriques (rocheuses, proches du Soleil : Mercure, Vénus, Terre, Mars) des planètes

  gazeuses (Jupiter, Saturne, Uranus, Neptune), plus grandes et plus éloignées.


  Les distances dans l''espace sont énormes : on utilise des unités adaptées, comme l''unité astronomique (UA,

  distance moyenne Terre-Soleil, environ 150 millions de km) ou l''année-lumière pour les distances entre étoiles.


  Neptune, la planète la plus éloignée du Soleil, se trouve à environ 30 UA, soit environ 4,5 milliards de km.

  '
methode:
- 'Distinguer les échelles : planète, puis système solaire, puis galaxie, puis Univers, du plus petit au plus grand.'
- Utiliser l'unité astronomique (UA) pour les distances à l'intérieur du système solaire.
- Pour convertir un nombre d'UA en km, multiplier par la distance Terre-Soleil (environ 150 millions de km).
- Retenir l'ordre des planètes à partir du Soleil et la distinction telluriques/gazeuses.
vocabulaire:
- terme: unité astronomique (UA)
  definition: unité de distance utilisée dans le système solaire, égale à la distance moyenne entre la Terre et le Soleil
    (environ 150 millions de km)
erreurs_frequentes:
- Confondre système solaire (autour du Soleil) et galaxie (des milliards d'étoiles).
- Croire que toutes les planètes ont une surface solide (les planètes gazeuses n'en ont pas).
- Confondre étoile (le Soleil, qui produit sa propre lumière) et planète (qui réfléchit la lumière du Soleil).
- Se tromper d'ordre de grandeur en convertissant des UA en kilomètres.
exemple:
  enonce: Neptune est à environ 30 UA du Soleil. Sachant que 1 UA vaut environ 150 millions de km, calculer cette distance
    en km.
  solution: 30 × 150 000 000 = 4 500 000 000 km, soit 4,5 milliards de km.
exercices:
- id: systeme-solaire-dans-voie-lactee
  type: choix
  difficulte: 1
  enonce: Le système solaire fait-il partie de la Voie lactée, ou est-ce l'inverse ?
  reponse:
    options:
    - id: a
      texte: Le système solaire fait partie de la Voie lactée
    - id: b
      texte: La Voie lactée fait partie du système solaire
    - id: c
      texte: Ce sont deux choses sans lien entre elles
    bonnes:
    - a
  indices:
    relance: Laquelle des deux, le système solaire ou la Voie lactée, contient des milliards d'étoiles ?
    methode: Une galaxie regroupe des milliards d'étoiles, dont le Soleil et son système.
    etape: Le Soleil est une seule étoile parmi les milliards que compte la Voie lactée.
  pieges:
  - si:
      contient:
      - b
    relance: La Voie lactée contient des milliards d'étoiles ; le système solaire n'est formé que d'une seule étoile (le Soleil)
      et de ce qui tourne autour.
  - si:
      contient:
      - c
    relance: Le Soleil, avec ses planètes, est bien situé à l'intérieur d'une galaxie précise.
  solution: Le système solaire (avec le Soleil et ses planètes) fait partie de la Voie lactée, qui est une galaxie parmi des
    milliards d'autres.
- id: differences-tellurique-gazeuse
  type: ouverte
  difficulte: 2
  enonce: Citer deux différences entre une planète tellurique et une planète gazeuse.
  criteres:
  - L'élève dit qu'une planète tellurique est rocheuse (a une surface solide), contrairement à une planète gazeuse.
  - L'élève dit qu'une planète gazeuse est beaucoup plus grande qu'une planète tellurique.
  - L'élève peut citer un exemple de chaque catégorie (par exemple Terre pour tellurique, Jupiter pour gazeuse).
  indices:
    relance: Pense à la composition (roche ou gaz) et à la taille de chaque type de planète.
    methode: Compare une planète proche du Soleil, comme la Terre, à une planète lointaine, comme Jupiter.
    etape: Les planètes telluriques sont les quatre plus proches du Soleil.
  solution: Une planète tellurique est rocheuse et plutôt petite (comme la Terre) ; une planète gazeuse est composée surtout
    de gaz et est beaucoup plus grande (comme Jupiter). Les planètes telluriques sont aussi plus proches du Soleil que les
    planètes gazeuses.
- id: distance-mars-km
  type: nombre
  difficulte: 2
  enonce: Mars est à environ 1,5 UA du Soleil. Sachant que 1 UA vaut environ 150 millions de km, calculer cette distance en
    km.
  reponse:
    valeur: 225000000
    forme: entier
    tolerance: 5000000
  indices:
    relance: Multiplie le nombre d'UA par la valeur en km d'une UA.
    methode: 1 UA vaut environ 150 millions de km.
    etape: 1,5 × 150 000 000.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Revérifie ta multiplication ; n'oublie pas les zéros de 150 millions.
  solution: 1,5 × 150 000 000 = 225 000 000 km.
- id: nombre-planetes-telluriques
  type: nombre
  difficulte: 1
  enonce: Combien de planètes telluriques compte le système solaire (Mercure, Vénus, Terre, Mars) ?
  reponse:
    valeur: 4
    forme: entier
    tolerance: 0
  indices:
    relance: Liste les planètes rocheuses proches du Soleil citées dans le cours.
    methode: Compte Mercure, Vénus, Terre et Mars.
    etape: Ces quatre planètes sont les plus proches du Soleil.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Recompte les planètes rocheuses citées dans le cours, sans en oublier ni en ajouter.
  solution: '4 planètes telluriques : Mercure, Vénus, Terre et Mars.'
- id: distance-neptune-milliards-km
  type: texte_court
  difficulte: 3
  enonce: Neptune, la planète la plus éloignée du Soleil, se trouve à environ combien de milliards de km ? Réponds par un
    seul chiffre.
  reponse:
    acceptees:
    - 4,5
    - '4.5'
    fautes_tolerees: 0
  indices:
    relance: Cette distance correspond à environ 30 UA.
    methode: Multiplie 30 par 150 millions de km, puis convertis en milliards.
    etape: 30 × 150 000 000 = 4 500 000 000 km.
  pieges:
  - si:
      valeur: '30'
    relance: 30 est le nombre d'UA, pas le nombre de milliards de km ; il faut convertir en multipliant par 150 millions.
  solution: Environ 4,5 milliards de km.
