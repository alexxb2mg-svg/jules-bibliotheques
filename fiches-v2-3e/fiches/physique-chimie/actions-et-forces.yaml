# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: actions-et-forces
version: 2
etat: verifiee
declencheurs:
- action de contact
- action à distance
- dynamomètre
- diagramme objets-interactions
- représenter par une flèche
- valeur en newtons
- pousser ou tirer
- flèche de la force
- objets qui agissent
- force en newtons
prerequis:
- 4e-modelisation-force
essentiel: 'Une action mécanique est exercée par un objet (l''acteur) sur un autre objet (le receveur). Elle peut mettre l''objet
  en mouvement, modifier son mouvement ou le déformer.


  Il y a deux sortes d''actions :

  - les actions de contact : l''acteur touche le receveur (une main qui pousse, une corde qui tire, le sol qui soutient, l''air
  ou l''eau sur un objet). Elles peuvent être localisées (un point de contact, comme une corde) ou réparties (sur une surface,
  comme le vent sur une voile) ;

  - les actions à distance : l''acteur agit sans toucher (l''attraction de la Terre, un aimant qui attire un clou, une règle
  électrisée qui attire des petits papiers).


  Les actions vont par deux : si A agit sur B, alors B agit aussi sur A. C''est une interaction. On peut la représenter par
  un diagramme objets-interactions : des bulles pour les objets, reliées par un trait plein pour un contact et par un trait
  en pointillés pour une action à distance.

  Par exemple, un livre posé sur une table : la Terre attire le livre (distance) ; la table soutient le livre (contact).


  On modélise une action mécanique par une force, représentée par une flèche qui donne quatre caractéristiques :

  - le point d''application : là où l''action s''exerce ; pour une action à distance, le centre de gravité de l''objet ;

  - la direction : la droite qui porte la flèche (verticale, horizontale…) ;

  - le sens : vers le haut, vers la droite… ;

  - la valeur : en newtons (N), mesurée avec un dynamomètre.


  Échelle : la longueur de la flèche est proportionnelle à la valeur de la force. Exemple : avec 1 cm pour 5 N, une force
  de 15 N se représente par une flèche de 15 ÷ 5 = 3 cm.


  Au brevet : on te demande de faire l''inventaire des actions sur un objet, de les classer (contact ou distance) avec l''acteur
  et le receveur, et de donner ou de tracer une force avec ses quatre caractéristiques.

  '
methode:
- Choisir le système étudié (le receveur), puis faire la liste des objets qui agissent sur lui.
- Pour chaque action, dire quel est l'acteur, et si elle est de contact ou à distance.
- 'Pour représenter les interactions : bulles pour les objets, trait plein (contact) ou pointillé (distance).'
- 'Pour modéliser une action par une force, donner ses quatre caractéristiques : point d''application, direction, sens, valeur.'
- 'Avec une échelle : longueur de la flèche (en cm) = valeur de la force ÷ valeur représentée par 1 cm.'
vocabulaire:
- terme: action mécanique
  definition: action d'un objet sur un autre qui peut le déformer ou modifier son mouvement
- terme: acteur et receveur
  definition: l'acteur exerce l'action ; le receveur la subit
- terme: action de contact
  definition: action où l'acteur touche le receveur
- terme: action à distance
  definition: action où l'acteur agit sans toucher le receveur
- terme: interaction
  definition: actions réciproques de deux objets l'un sur l'autre
- terme: force
  definition: modèle d'une action mécanique, caractérisé par un point d'application, une direction, un sens et une valeur
- terme: newton (N)
  definition: unité de la valeur d'une force
- terme: dynamomètre
  definition: appareil qui mesure la valeur d'une force, en newtons
erreurs_frequentes:
- Oublier les actions à distance, en particulier l'attraction de la Terre, parce qu'on ne voit rien toucher l'objet.
- 'Confondre direction et sens : la direction est une droite (verticale), le sens indique de quel côté (vers le bas).'
- 'Croire qu''un objet immobile (un mur, une table) ne peut pas agir : il agit sur ce qui le touche.'
- 'Mesurer une force en kilogrammes : la valeur d''une force s''exprime en newtons.'
exemple:
  enonce: Un aimant attire une bille d'acier posée sur une table. Quelles actions s'exercent sur la bille ?
  solution: L'aimant attire la bille (action à distance) ; la Terre attire la bille (action à distance) ; la table soutient
    la bille (action de contact). En retour, la bille agit elle aussi sur l'aimant, sur la Terre et sur la table.
exercices:
- id: contact-ou-distance
  type: association
  difficulte: 1
  enonce: Pour chaque situation, indique s'il s'agit d'une action de contact ou d'une action à distance.
  reponse:
    gauche:
    - id: chariot
      texte: la main qui pousse un chariot
    - id: aimant
      texte: un aimant qui attire un clou sans le toucher
    - id: pomme
      texte: la Terre qui attire une pomme en train de tomber
    - id: voile
      texte: le vent qui gonfle une voile
    - id: livre
      texte: la table qui soutient un livre
    droite:
    - id: contact
      texte: action de contact
    - id: distance
      texte: action à distance
    paires:
      chariot: contact
      aimant: distance
      pomme: distance
      voile: contact
      livre: contact
  indices:
    relance: Dans chaque situation, l'acteur touche-t-il le receveur ?
    methode: S'il y a contact entre les deux objets, c'est une action de contact ; sinon, c'est une action à distance.
    etape: La main touche le chariot. Et la Terre, touche-t-elle la pomme pendant sa chute ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule erreur. Le vent est de l''air en mouvement : l''air touche-t-il la voile ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque situation en te demandant seulement : y a-t-il contact entre l''acteur et le receveur ?'
  solution: 'De contact : la main sur le chariot, le vent (l''air) sur la voile, la table sur le livre. À distance : l''aimant
    sur le clou, la Terre sur la pomme.'
- id: unite-de-force
  type: texte_court
  difficulte: 1
  enonce: Quel est le nom de l'unité de la valeur d'une force ? Écris le mot en entier.
  reponse:
    acceptees:
    - newton
    - newtons
    fautes_tolerees: 1
  indices:
    relance: Cette unité porte le nom d'un savant anglais, célèbre pour ses travaux sur la gravitation.
    methode: 'Pense à l''appareil qui mesure une force, le dynamomètre : quelle unité est écrite sur sa graduation ?'
    etape: Son symbole est la lettre N majuscule.
  pieges:
  - si:
      valeur: N
    relance: C'est bien son symbole. Écris maintenant le nom complet de l'unité.
  - si:
      valeur: kilogramme
    relance: Le kilogramme est l'unité de la masse, pas celle d'une force. Quel savant a donné son nom à l'unité de force
      ?
  - si:
      valeur: kg
    relance: Le kg est l'unité de la masse, pas celle d'une force. Quel savant a donné son nom à l'unité de force ?
  - si:
      diagnostic: mauvaise_reponse
    relance: 'Regarde la graduation d''un dynamomètre : quelle lettre y vois-tu ? Quel nom de savant commence par cette lettre
      ?'
  solution: Le newton (symbole N).
- id: fleche-a-l-echelle
  type: nombre
  difficulte: 2
  enonce: Sur un schéma, l'échelle est de 1 cm pour 5 N. La flèche qui représente une force mesure 3,2 cm. Quelle est la valeur
    de cette force, en newtons ? Écris seulement le nombre.
  reponse:
    valeur: 16
    forme: libre
  indices:
    relance: Combien de newtons représente 1 cm ? Et 2 cm ?
    methode: Valeur de la force = longueur de la flèche (en cm) × valeur représentée par 1 cm.
    etape: Il faut calculer 3,2 × 5, par exemple en faisant 3 × 5 puis 0,2 × 5.
  pieges:
  - si:
      valeur: 0,64
    relance: 'Tu as divisé. Chaque centimètre représente 5 N : pour 3,2 cm, y a-t-il plus ou moins de 5 N ?'
  - si:
      valeur: 8,2
    relance: 'Tu as additionné. Chaque centimètre de flèche compte pour 5 N : quelle opération faut-il faire ?'
  - si:
      diagnostic: valeur_fausse
    relance: Multiplie la longueur de la flèche par le nombre de newtons que représente 1 cm.
  solution: F = 3,2 × 5 = 16 N.
- id: caracteristiques-force-corde
  type: choix
  difficulte: 2
  enonce: Un enfant tire une luge vers la droite, sur un sol horizontal, avec une corde tendue horizontalement. Quelles sont
    les caractéristiques de la force exercée par la corde sur la luge ?
  reponse:
    options:
    - id: a
      texte: direction horizontale
    - id: b
      texte: direction verticale
    - id: c
      texte: sens vers la droite
    - id: d
      texte: sens vers la gauche
    - id: e
      texte: point d'application là où la corde est attachée à la luge
    - id: f
      texte: c'est une action à distance
    bonnes:
    - a
    - c
    - e
  indices:
    relance: La corde est tendue comment ? Et elle tire la luge de quel côté ?
    methode: 'Donne les caractéristiques une par une : où s''applique la force, quelle est sa direction (la droite de la corde),
      quel est son sens (du côté où la corde tire).'
    etape: 'La corde touche la luge à un endroit précis : c''est là que s''applique la force. Réfléchis ensuite à la direction
      et au sens.'
  pieges:
  - si:
      contient:
      - b
    relance: La corde est-elle tendue de haut en bas, ou parallèlement au sol ?
  - si:
      contient:
      - d
    relance: L'enfant tire la luge vers lui. Vers quel côté la luge est-elle tirée ?
  - si:
      contient:
      - f
    relance: La corde touche-t-elle la luge ? Quelle sorte d'action est-ce alors ?
  - si:
      diagnostic: incomplet
    relance: 'C''est juste, mais incomplet : plusieurs options décrivent correctement cette force. Reprends le point d''application,
      la direction et le sens.'
  solution: La force de la corde sur la luge a pour point d'application le point d'attache de la corde, une direction horizontale
    et un sens vers la droite. C'est une action de contact.
- id: pousser-un-mur
  type: choix
  difficulte: 2
  enonce: Tu pousses un mur avec tes mains. Laquelle de ces phrases est juste ?
  reponse:
    options:
    - id: a
      texte: Seules tes mains agissent, car un mur ne peut pas agir.
    - id: b
      texte: 'Le mur agit aussi sur tes mains : c''est une interaction.'
    - id: c
      texte: Le mur n'agit sur toi que s'il se déplace.
    bonnes:
    - b
  indices:
    relance: Quand tu pousses fort sur un mur, que ressens-tu dans tes mains ? Et si tu es sur des patins à roulettes ?
    methode: 'Rappelle-toi : si un objet A agit sur un objet B, alors B agit aussi sur A.'
    etape: Sur des patins, en poussant le mur, tu recules. Quel objet a pu te mettre en mouvement ?
  pieges:
  - si:
      contient:
      - a
    relance: 'Un objet immobile peut agir : une table soutient bien un livre. Que ressens-tu dans tes paumes en poussant le
      mur ?'
  - si:
      contient:
      - c
    relance: Une chaise immobile te soutient quand tu es assis. Un objet doit-il bouger pour agir ?
  solution: 'Le mur agit aussi sur tes mains : c''est une interaction. Toute action d''un objet A sur un objet B s''accompagne
    d''une action de B sur A, même si B reste immobile.'
- id: inventaire-du-skieur
  type: ouverte
  difficulte: 3
  enonce: Un skieur remonte une pente, tiré par la perche d'un téléski. Fais la liste des actions mécaniques qui s'exercent
    sur le skieur. Pour chacune, indique l'acteur et précise si c'est une action de contact ou à distance.
  criteres:
  - L'élève cite l'action de la Terre sur le skieur et la classe comme action à distance.
  - L'élève cite l'action de la neige (ou du sol) et celle de la perche, et les classe comme actions de contact.
  - L'élève désigne bien, pour chaque action, l'acteur et le receveur (le skieur) ; l'action de l'air peut être citée comme
    action de contact.
  indices:
    relance: Quels objets touchent le skieur ? Y a-t-il un objet qui agit sur lui sans le toucher ?
    methode: Le receveur est le skieur. Cherche d'abord tout ce qui le touche, puis pense aux actions à distance.
    etape: 'Commence par : « La perche tire le skieur : c''est une action de contact. »'
  solution: 'Sur le skieur s''exercent : l''action de la Terre (attraction, action à distance) ; l''action de la neige, qui
    le soutient et frotte sous les skis (contact) ; l''action de la perche, qui le tire (contact) ; et l''action de l''air
    (contact), souvent négligeable.'
- id: longueur-de-la-fleche
  type: nombre
  difficulte: 2
  enonce: Sur un schéma, l'échelle est de 1 cm pour 5 N. Quelle longueur, en cm, doit avoir la flèche qui représente une force
    de 20 N ? Écris seulement le nombre.
  reponse:
    valeur: 4
    forme: libre
  indices:
    relance: Chaque centimètre de flèche représente 5 N. Combien de fois 5 N contient-il 20 N ?
    methode: Longueur (cm) = valeur de la force ÷ valeur représentée par 1 cm.
    etape: Calcule 20 ÷ 5.
  pieges:
  - si:
      valeur: 100
    relance: Tu as multiplié 20 par 5. Pour trouver une longueur, il faut diviser la valeur par l'échelle.
  - si:
      valeur: 20
    relance: Tu as écrit la valeur de la force, pas la longueur de la flèche.
  solution: Longueur = 20 ÷ 5 = 4 cm.
- id: actions-sur-un-livre
  type: association
  difficulte: 2
  enonce: Un livre est posé sur une table. Associe chaque action à son acteur et à son type.
  reponse:
    gauche:
    - id: terre
      texte: l'action exercée par la Terre sur le livre
    - id: table
      texte: l'action exercée par la table sur le livre
    - id: livre
      texte: l'action exercée par le livre sur la table
    droite:
    - id: distance
      texte: action à distance
    - id: contact
      texte: action de contact
    paires:
      terre: distance
      table: contact
      livre: contact
  indices:
    relance: 'Pour chaque action, demande-toi : l''acteur touche-t-il le receveur ?'
    methode: La Terre attire le livre sans le toucher. La table et le livre sont en contact l'un avec l'autre.
    etape: 'Le livre agit aussi sur la table : c''est la réponse de l''interaction, et elle est de contact.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule paire est fausse. Relis les trois actions : laquelle se fait sans toucher ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Plusieurs paires sont fausses. Une seule des trois actions se fait sans contact : c''est celle de la Terre.'
  solution: 'La Terre agit à distance sur le livre. La table et le livre se touchent : leurs actions réciproques sont des
    actions de contact.'
