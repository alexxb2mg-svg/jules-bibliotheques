format: 2
notion: actions-et-forces
version: 1
etat: verifiee
declencheurs:
- flèche de force
- point d'application
- action à distance
- action de contact
- newton unité de force
- échelle d'une flèche
prerequis: []
essentiel: 'Une action mécanique est ce qu''exerce un objet sur un autre (pousser, tirer, retenir...). Elle peut être une

  action de contact (un coup de pied sur un ballon) ou une action à distance (la gravitation entre la Terre et un

  objet, un aimant).


  On modélise une action mécanique par une force, représentée par une flèche (vecteur) qui possède quatre

  caractéristiques : un point d''application (où la force s''exerce), une direction (la droite le long de laquelle

  elle agit), un sens (vers où) et une valeur (son intensité, en newtons, symbole N).


  Deux forces de même valeur mais de sens opposés ne se compensent pas forcément : il faut aussi regarder leur

  direction et leur point d''application.


  Plus une force est intense, plus la flèche qui la représente est longue, à une échelle donnée (par exemple 1 cm

  représente 10 N).

  '
methode:
- Identifier l'objet qui exerce l'action et l'objet qui la subit.
- Déterminer si l'action est de contact (les objets se touchent) ou à distance (pas de contact).
- Pour représenter une force, choisir une échelle, puis tracer une flèche avec le bon point d'application, la bonne direction,
  le bon sens et la bonne longueur.
- Pour lire la valeur d'une force sur un schéma, mesurer la longueur de la flèche et appliquer l'échelle donnée.
vocabulaire:
- terme: newton (N)
  definition: unité de mesure de la valeur (intensité) d'une force dans le système international
erreurs_frequentes:
- Oublier une des quatre caractéristiques d'une force (point d'application, direction, sens, valeur).
- Confondre action de contact et action à distance.
- Tracer une flèche de force sans respecter l'échelle donnée.
- Croire que seules les actions de contact existent (la gravitation agit à distance).
exemple:
  enonce: Sur un schéma à l'échelle 1 cm pour 10 N, une flèche de force mesure 3,5 cm. Quelle est la valeur de cette force
    ?
  solution: 3,5 × 10 = 35 N.
exercices:
- id: brouette-contact-ou-distance
  type: texte_court
  difficulte: 1
  enonce: Un enfant pousse une brouette avec ses mains. Cette action est-elle de contact ou à distance ? Réponds par « contact
    » ou « distance ».
  reponse:
    acceptees:
    - contact
    fautes_tolerees: 1
  indices:
    relance: Regarde si les deux objets se touchent physiquement ou non.
    methode: Une des deux catégories suppose un toucher direct entre les objets, l'autre non.
    etape: Les mains de l'enfant touchent-elles la brouette ?
  pieges:
  - si:
      valeur: distance
    relance: Regarde à nouveau si les deux objets, ici les mains et la brouette, se touchent ou non.
  solution: 'C''est une action de contact : les mains de l''enfant touchent la brouette.'
- id: lune-terre-contact-ou-distance
  type: texte_court
  difficulte: 1
  enonce: La Lune est attirée par la Terre. Cette action est-elle de contact ou à distance ? Réponds par « contact » ou «
    distance ».
  reponse:
    acceptees:
    - distance
    fautes_tolerees: 1
  indices:
    relance: La Terre et la Lune se touchent-elles physiquement ?
    methode: La gravitation agit même sans contact physique entre les deux objets.
    etape: Il n'y a aucun contact physique entre les deux astres.
  pieges:
  - si:
      valeur: contact
    relance: Une action de contact suppose que les deux objets se touchent ; ici, la Terre et la Lune ne se touchent pas.
  solution: 'C''est une action à distance (gravitation) : il n''y a pas de contact entre les deux astres.'
- id: quatre-caracteristiques-force
  type: ouverte
  difficulte: 2
  enonce: Citer les quatre caractéristiques nécessaires pour décrire complètement une force.
  criteres:
  - L'élève cite le point d'application (où la force s'exerce).
  - L'élève cite la direction (la droite le long de laquelle elle agit) et le sens (vers où).
  - L'élève cite la valeur (l'intensité, exprimée en newtons).
  indices:
    relance: Pense à ce qu'il faut préciser pour dessiner correctement une flèche de force.
    methode: Une flèche a un point de départ, une orientation, et une longueur.
    etape: Il y a quatre informations différentes à donner, pas seulement deux ou trois.
  solution: Le point d'application, la direction, le sens et la valeur (intensité, en newtons).
- id: calcul-valeur-force-echelle
  type: nombre
  difficulte: 2
  enonce: Sur un schéma à l'échelle 1 cm pour 20 N, une flèche de force mesure 4 cm. Quelle est la valeur de cette force,
    en N ?
  reponse:
    valeur: 80
    forme: entier
    tolerance: 0
  indices:
    relance: Multiplie la longueur mesurée par la valeur en newtons que représente 1 cm.
    methode: Valeur de la force égale longueur de la flèche multipliée par l'échelle.
    etape: 4 × 20.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Revérifie ta multiplication entre la longueur de la flèche et la valeur en newtons de 1 cm.
  solution: 4 × 20 = 80 N.
- id: gravitation-est-action-a-distance
  type: choix
  difficulte: 1
  enonce: Pourquoi dit-on que la gravitation est une action à distance ?
  reponse:
    options:
    - id: a
      texte: Parce qu'elle agit entre deux objets sans qu'ils se touchent
    - id: b
      texte: Parce qu'elle n'existe qu'entre deux objets très éloignés dans l'espace
    - id: c
      texte: Parce qu'elle est plus faible qu'une action de contact
    bonnes:
    - a
  indices:
    relance: Pense à la définition même d'une action à distance, indépendamment de la distance réelle entre les objets.
    methode: Une action à distance se définit par l'absence de contact, pas par une grande distance précise.
    etape: La gravitation agit aussi entre des objets proches, pas seulement entre des astres éloignés.
  pieges:
  - si:
      contient:
      - b
    relance: La gravitation agit aussi entre des objets proches (par exemple ton poids sur Terre) ; ce n'est pas une question
      d'éloignement.
  - si:
      contient:
      - c
    relance: La force de gravitation n'est pas toujours plus faible qu'une action de contact ; ce n'est pas ce qui définit
      une action à distance.
  solution: C'est une action à distance car elle agit entre deux objets sans qu'ils se touchent physiquement.
