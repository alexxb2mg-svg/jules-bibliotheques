format: 2
notion: classification-periodique
version: 1
etat: verifiee
declencheurs:
- symbole chimique
- tableau de Mendeleïev
- formule chimique
- ce que veut dire CO2
- ce que veut dire H2O
- dihydrogène
prerequis: []
essentiel: 'Chaque élément chimique (type d''atome) est représenté par un symbole : une lettre majuscule, parfois suivie d''une

  minuscule (H pour l''hydrogène, O pour l''oxygène, C pour le carbone, Fe pour le fer, Na pour le sodium...).


  Le tableau périodique (ou classification périodique, créé par Dmitri Mendeleïev au XIXe siècle) range tous les

  éléments chimiques connus ; des éléments d''une même colonne ont des propriétés chimiques proches.


  Une formule chimique indique quels atomes composent une molécule et en quelle quantité : le nombre en indice après

  un symbole donne le nombre d''atomes de cet élément (H2O = 2 atomes H + 1 atome O).


  Formules courantes à connaître : dioxygène O2, dihydrogène H2, diazote N2, eau H2O, dioxyde de carbone CO2,

  méthane CH4, protoxyde d''azote N2O.


  Un symbole chimique ne s''invente pas et ne se traduit pas : Na est le sodium (pas l''azote), le carbone est C (pas

  Ca, qui est le calcium).

  '
methode:
- Pour lire une formule, repérer chaque symbole (majuscule, éventuellement suivie d'une minuscule) puis le nombre en indice
  qui le suit.
- Un symbole sans indice signifie qu'il y a un seul atome de cet élément.
- Pour compter le nombre total d'atomes d'une molécule, additionner tous les indices.
- Utiliser le tableau périodique pour retrouver le symbole d'un élément à partir de son nom, ou inversement.
vocabulaire:
- terme: indice
  definition: le petit nombre placé après un symbole chimique, qui donne le nombre d'atomes de cet élément dans la molécule
erreurs_frequentes:
- Confondre le nombre d'atomes (indice après le symbole) et le nombre de molécules (coefficient devant la formule).
- Inventer un symbole à partir du nom français au lieu de le chercher dans le tableau.
- 'Confondre les symboles proches : N (azote) et Na (sodium), C (carbone) et Ca (calcium).'
- Oublier qu'un symbole chimique commence toujours par une majuscule.
exemple:
  enonce: La formule du dioxyde de carbone est CO2. Combien d'atomes de carbone et d'oxygène contient une molécule de CO2
    ? Combien d'atomes au total ?
  solution: '1 atome de carbone (C, pas d''indice) et 2 atomes d''oxygène (O2). Total : 3 atomes.'
exercices:
- id: atomes-methane
  type: nombre
  difficulte: 1
  enonce: La formule du méthane est CH4. Combien d'atomes au total (carbone + hydrogène) contient une molécule de méthane
    ?
  reponse:
    valeur: 5
    forme: entier
    tolerance: 0
  indices:
    relance: Combien d'atomes de carbone, puis combien d'atomes d'hydrogène ?
    methode: Additionne les indices de chaque symbole (1 pour C sans indice, 4 pour H).
    etape: 1 atome de carbone (C) et 4 atomes d'hydrogène (H4).
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: N'oublie pas de compter aussi l'atome de carbone, même sans indice écrit.
  solution: 1 atome de carbone et 4 atomes d'hydrogène, soit 1 + 4 = 5 atomes au total.
- id: elements-protoxyde-azote
  type: choix
  difficulte: 1
  enonce: Le protoxyde d'azote a pour formule N2O. Quels éléments chimiques contient-il ?
  reponse:
    options:
    - id: a
      texte: Azote et oxygène
    - id: b
      texte: Azote et or
    - id: c
      texte: Sodium et oxygène
    bonnes:
    - a
  indices:
    relance: Repère chaque symbole distinct dans la formule N2O.
    methode: N est l'azote, O est l'oxygène.
    etape: Il y a deux symboles différents dans cette formule, N et O.
  pieges:
  - si:
      contient:
      - b
    relance: Le symbole de l'or n'apparaît pas dans cette formule ; N est l'azote, pas une abréviation de l'or.
  - si:
      contient:
      - c
    relance: Le symbole du sodium est Na, pas N ; ici N désigne l'azote.
  solution: N2O contient de l'azote (N) et de l'oxygène (O).
- id: formules-dihydrogene-diazote
  type: texte_court
  difficulte: 2
  enonce: Écrire la formule chimique du dihydrogène (sans espace).
  reponse:
    acceptees:
    - H2
    fautes_tolerees: 0
  indices:
    relance: « Di » signifie deux atomes du même élément.
    methode: Le symbole de l'hydrogène est H.
    etape: Deux atomes d'hydrogène liés forment cette molécule.
  pieges:
  - si:
      valeur: H
    relance: Le préfixe « di » indique deux atomes, il faut donc un indice après le symbole.
  solution: H2.
- id: association-symboles-elements
  type: association
  difficulte: 2
  enonce: Associer chaque élément chimique à son symbole correct.
  reponse:
    gauche:
    - id: fer
      texte: Fer
    - id: sodium
      texte: Sodium
    - id: carbone
      texte: Carbone
    - id: azote
      texte: Azote
    droite:
    - id: fe
      texte: Fe
    - id: na
      texte: Na
    - id: c
      texte: C
    - id: n
      texte: N
    paires:
      fer: fe
      sodium: na
      carbone: c
      azote: n
  indices:
    relance: Attention aux symboles proches, comme le carbone et le calcium, ou l'azote et le sodium.
    methode: Le symbole d'un élément vient souvent de son nom latin ou anglais, pas toujours du français.
    etape: Le fer a pour symbole une abréviation de son nom latin, Ferrum.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse : revérifie chaque paire une par une, en particulier les symboles proches.'
  - si:
      diagnostic: associations_fausses
    relance: 'Plusieurs associations sont fausses : reprends chaque élément et cherche son symbole dans le tableau périodique.'
  solution: Fer → Fe, Sodium → Na, Carbone → C, Azote → N.
- id: formule-eau-explication
  type: ouverte
  difficulte: 2
  enonce: La formule de l'eau est H2O. Explique ce que signifient le symbole H, le symbole O, et le nombre 2 dans cette formule.
  criteres:
  - L'élève dit que H est le symbole de l'hydrogène et O celui de l'oxygène.
  - L'élève dit que le 2 est un indice qui indique qu'il y a deux atomes d'hydrogène dans la molécule.
  - L'élève dit qu'il n'y a pas d'indice après O, donc un seul atome d'oxygène.
  indices:
    relance: Chaque lettre de la formule est un symbole chimique ; chaque petit nombre est un indice.
    methode: Rappelle-toi que l'absence d'indice signifie un seul atome de cet élément.
    etape: H est toujours l'hydrogène, O est toujours l'oxygène, quel que soit le contexte.
  solution: 'H est le symbole de l''hydrogène et O celui de l''oxygène. Le 2 est un indice placé après H : il indique qu''il
    y a deux atomes d''hydrogène dans la molécule. Comme il n''y a pas d''indice après O, il y a un seul atome d''oxygène.
    La molécule d''eau contient donc deux atomes d''hydrogène et un atome d''oxygène.'
