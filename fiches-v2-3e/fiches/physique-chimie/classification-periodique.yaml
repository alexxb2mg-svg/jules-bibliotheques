    - id: o2
      texte: 'CO2 : 1 atome de carbone et 2 atomes d''oxygène'
    - id: o3
      texte: 'C4H : 4 atomes de carbone et 1 atome d''hydrogène'
    - id: o4
      texte: 'H2O : 2 atomes d''hydrogène et 1 atome d''oxygène'
    bonnes:
    - o1
  indices:
    relance: Cette molécule comporte du carbone (C) et quatre atomes d'hydrogène (H).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
