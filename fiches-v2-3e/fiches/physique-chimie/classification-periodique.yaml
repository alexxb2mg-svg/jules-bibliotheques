# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: classification-periodique
version: 4
etat: verifiee
declencheurs:
- tableau de Mendeleïev
- symbole du fer
- formule du méthane
- combien d'atomes dans la molécule
- lettres des éléments
- symbole de l'oxygène
- atomes dans la formule
- formule de l'eau
- que signifie H2O
prerequis:
- 4e-equations-reaction-tableau-periodique
essentiel: 'Chaque élément chimique a un symbole : une lettre majuscule, parfois suivie d''une lettre minuscule.

  H hydrogène, He hélium, C carbone, N azote, O oxygène, Na sodium, Al aluminium, S soufre, Cl chlore, Fe fer, Cu cuivre,
  Zn zinc, Ag argent, Au or.

  Certains symboles viennent du latin (Na, Fe, Cu, Ag, Au) : ce n''est pas toujours l''initiale du nom français.


  La classification périodique range les éléments (118 connus) par numéro atomique croissant. Les éléments d''une même colonne
  forment une famille : ils ont des propriétés chimiques voisines. Elle sert à retrouver le symbole d''un élément à partir
  de son nom.


  Une molécule est un groupe d''atomes liés. Sa formule chimique indique quels atomes la forment et combien il y en a : le
  petit chiffre écrit après un symbole (l''indice) donne le nombre d''atomes de cet élément. Pas d''indice : un seul atome.

  - dioxygène O₂ : 2 atomes d''oxygène ;

  - dihydrogène H₂ : 2 atomes d''hydrogène ;

  - diazote N₂ : 2 atomes d''azote ;

  - eau H₂O : 2 atomes d''hydrogène et 1 atome d''oxygène ;

  - dioxyde de carbone CO₂ : 1 atome de carbone et 2 atomes d''oxygène ;

  - méthane CH₄ : 1 atome de carbone et 4 atomes d''hydrogène ;

  - protoxyde d''azote N₂O : 2 atomes d''azote et 1 atome d''oxygène.


  Un nombre devant la formule compte les molécules : 3 H₂O, ce sont 3 molécules d''eau, donc 6 atomes d''hydrogène et 3 atomes
  d''oxygène.


  Le préfixe du nom aide : « di » veut dire deux (dioxygène : deux atomes d''oxygène liés).


  Attention aux majuscules : Co est le cobalt (un seul élément), CO est une molécule de monoxyde de carbone (deux symboles
  : C et O).


  Au brevet : on te demande d''associer un symbole à un élément, de lire une formule en nombre d''atomes et de compter les
  atomes dans plusieurs molécules.

  '
methode:
- 'Pour trouver un symbole : chercher le nom de l''élément dans la classification ; respecter majuscule puis minuscule.'
- 'Pour lire une formule : repérer chaque symbole (une majuscule commence un nouveau symbole), puis lire l''indice qui le
  suit (aucun indice = 1).'
- 'Pour compter les atomes d''une molécule : additionner les indices de tous les symboles.'
- 'Pour compter les atomes de plusieurs molécules : multiplier le nombre d''atomes d''une molécule par le nombre placé devant
  la formule.'
- 'Vérifier : Co (cobalt) n''est pas CO (un carbone et un oxygène) ; la majuscule compte.'
vocabulaire:
- terme: élément chimique
  definition: ensemble des atomes qui ont le même numéro atomique (même nombre de protons), quelle que soit la molécule où
    ils se trouvent
- terme: symbole chimique
  definition: une majuscule, parfois suivie d'une minuscule, qui désigne un élément
- terme: classification périodique
  definition: tableau qui range les éléments par numéro atomique croissant, en familles
- terme: formule chimique
  definition: écriture qui indique les atomes d'une molécule et leur nombre
- terme: indice
  definition: 'petit chiffre écrit en bas à droite d''un symbole dans une formule : nombre d''atomes de cet élément dans la
    molécule'
- terme: numéro atomique
  definition: numéro d'un élément dans la classification ; c'est le nombre de protons du noyau de ses atomes
- terme: molécule
  definition: groupe d'atomes liés entre eux, décrit par une formule
erreurs_frequentes:
- Écrire le symbole en deux majuscules (FE au lieu de Fe) ou confondre des symboles proches (F fluor et Fe fer, S soufre et
  Na sodium).
- Croire que le symbole est toujours l'initiale du nom français (Na pour sodium, Au pour or, Ag pour argent viennent du latin).
- Oublier qu'un symbole sans indice compte pour un atome (dans CO₂, il y a bien un atome de carbone).
- Oublier le nombre placé devant la formule quand on compte les atomes de plusieurs molécules.
- 'Confondre N₂O (protoxyde d''azote) et NO₂ : l''ordre et les indices changent la molécule.'
exemple:
  enonce: Que signifie la formule N2O du protoxyde d'azote ? Combien d'atomes compte une molécule ?
  solution: 'N2O : 2 atomes d''azote (symbole N, indice 2) et 1 atome d''oxygène (symbole O, sans indice). Une molécule compte
    2 + 1 = 3 atomes.'
exercices:
- id: symbole-fer
  type: texte_court
  difficulte: 1
  enonce: Quel est le symbole chimique de l'élément fer ? Écris seulement le symbole.
  reponse:
    acceptees:
    - Fe
    fautes_tolerees: 0
  indices:
    relance: Un symbole commence par une majuscule, parfois suivie d'une minuscule. Par quelle lettre commence le nom « fer
      » ?
    methode: 'Cherche le fer dans la classification périodique : il se trouve dans la quatrième ligne, parmi les métaux.'
    etape: 'La lettre F seule est déjà prise par le fluor : il faut donc une deuxième lettre, en minuscule.'
  pieges:
  - si:
      valeur: F
    relance: F est le symbole du fluor, un gaz. Le fer a un symbole de deux lettres.
  - si:
      valeur: fer
    relance: '« fer » est le nom de l''élément. On demande son symbole : une ou deux lettres, la première en majuscule.'
  - si:
      valeur: Fr
    relance: Fr est le symbole du francium. Quelle autre lettre du mot « fer » pourrait suivre le F ?
  solution: Le symbole du fer est Fe (F majuscule, e minuscule).
- id: atomes-methane
  type: nombre
  difficulte: 1
  enonce: La formule du méthane est CH4. Combien d'atomes compte une molécule de méthane, en tout ? Écris seulement le nombre.
  reponse:
    valeur: 5
  indices:
    relance: Quels symboles vois-tu dans CH4, et quel chiffre suit chacun ?
    methode: Un symbole sans indice compte pour un atome ; l'indice donne le nombre d'atomes de l'élément qu'il suit.
    etape: C n'a pas d'indice ; H est suivi de l'indice 4. Additionne les atomes de carbone et d'hydrogène.
  pieges:
  - si:
      valeur: 4
    relance: Tu as compté les atomes d'hydrogène. N'oublies-tu pas l'atome de carbone, écrit sans indice ?
  - si:
      valeur: 2
    relance: 'Tu as compté les sortes d''atomes (C et H). On demande le nombre total d''atomes : combien d''atomes d''hydrogène
      indique le 4 ?'
  solution: 'CH4 : 1 atome de carbone et 4 atomes d''hydrogène, soit 1 + 4 = 5 atomes.'
- id: oxygene-dans-trois-co2
  type: nombre
  difficulte: 2
  enonce: Combien d'atomes d'oxygène y a-t-il dans 3 CO2 (trois molécules de dioxyde de carbone) ? Écris seulement le nombre.
  reponse:
    valeur: 6
  indices:
    relance: Combien d'atomes d'oxygène y a-t-il dans une seule molécule de CO2 ?
    methode: 'Le 3 devant la formule compte les molécules : multiplie le nombre d''atomes d''oxygène d''une molécule par le
      nombre de molécules.'
    etape: 'Dans une molécule de CO2, l''indice de O est 2. Il y a 3 molécules : fais la multiplication.'
  pieges:
  - si:
      valeur: 2
    relance: C'est le nombre d'atomes d'oxygène dans une seule molécule. Combien de molécules y a-t-il ici ?
  - si:
      valeur: 5
    relance: 'Tu as additionné le 3 et le 2. Trois molécules, chacune avec deux atomes d''oxygène : faut-il additionner ou
      multiplier ?'
  - si:
      valeur: 9
    relance: Tu as compté tous les atomes (carbone compris). On ne demande que les atomes d'oxygène.
  solution: Une molécule de CO2 contient 2 atomes d'oxygène ; 3 molécules en contiennent 3 × 2 = 6.
- id: formules-et-noms
  type: association
  difficulte: 2
  enonce: Associe chaque formule chimique au nom de la molécule.
  reponse:
    gauche:
    - id: f1
      texte: H2O
    - id: f2
      texte: CO2
    - id: f3
      texte: CH4
    - id: f4
      texte: N2O
    - id: f5
      texte: N2
    droite:
    - id: a
      texte: eau
    - id: b
      texte: dioxyde de carbone
    - id: c
      texte: méthane
    - id: d
      texte: protoxyde d'azote
    - id: e
      texte: diazote
    - id: f
      texte: dihydrogène
    paires:
      f1: a
      f2: b
      f3: c
      f4: d
      f5: e
  indices:
    relance: Quels éléments contient chaque formule ? Le nom de la molécule en garde souvent la trace.
    methode: '« di » signifie deux : dioxyde de carbone = un carbone et deux oxygènes ; diazote = deux atomes d''azote.'
    etape: 'Commence par N2 : seulement des atomes d''azote (N), au nombre de deux. Puis cherche la formule qui contient azote
      et oxygène.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie les symboles : N est l''azote, H l''hydrogène.'
  - si:
      diagnostic: associations_fausses
    relance: Pour chaque formule, écris d'abord le nom des éléments qu'elle contient (C carbone, H hydrogène, N azote, O oxygène),
      puis cherche le nom qui correspond.
  solution: 'H2O : eau. CO2 : dioxyde de carbone. CH4 : méthane. N2O : protoxyde d''azote. N2 : diazote. Le dihydrogène (H2)
    ne sert pas.'
- id: rangement-classification
  type: choix
  difficulte: 1
  enonce: Dans la classification périodique, dans quel ordre les éléments sont-ils rangés ?
  reponse:
    options:
    - id: a
      texte: par ordre alphabétique de leur nom
    - id: b
      texte: par numéro atomique croissant
    - id: c
      texte: par date de découverte
    - id: d
      texte: par ordre alphabétique de leur symbole
    bonnes:
    - b
  indices:
    relance: 'Regarde les premières cases : H, He, Li, Be… Est-ce un ordre alphabétique ?'
    methode: 'Chaque case porte un numéro qui augmente de 1 d''une case à la suivante : que représente ce numéro ?'
    etape: 'L''hydrogène est dans la case 1, l''hélium dans la case 2 : le rangement suit ces numéros.'
  pieges:
  - si:
      contient:
      - a
    relance: 'L''hydrogène est le premier élément, l''hélium le deuxième : est-ce l''ordre alphabétique ?'
  - si:
      contient:
      - d
    relance: 'H puis He puis Li : l''alphabet mettrait He avant H ? Regarde plutôt le numéro de chaque case.'
  - si:
      contient:
      - c
    relance: Certains éléments connus depuis l'Antiquité (fer, or) sont loin dans le tableau. Quel numéro porte chaque case
      ?
  solution: Les éléments sont rangés par numéro atomique croissant (1 pour l'hydrogène, 2 pour l'hélium, 3 pour le lithium…).
- id: co-et-co2
  type: ouverte
  difficulte: 3
  enonce: Explique ce que signifient les formules CO2 et CO, et pourquoi ce ne sont pas les mêmes molécules. Explique aussi
    la différence entre CO et Co.
  criteres:
  - L'élève décrit CO2 comme 1 atome de carbone et 2 atomes d'oxygène, et CO comme 1 atome de carbone et 1 atome d'oxygène.
  - L'élève conclut que ces molécules n'ont pas la même composition, donc ce sont deux espèces chimiques différentes.
  - L'élève explique que Co (une majuscule suivie d'une minuscule) est le symbole d'un seul élément, le cobalt, alors que
    CO contient deux symboles (C et O).
  indices:
    relance: Dans une formule, qu'indique une lettre majuscule ? Et le petit chiffre ?
    methode: Compte les atomes de chaque élément dans CO2 puis dans CO, et compare.
    etape: 'Commence par CO2 : le symbole C n''a pas d''indice, le symbole O a l''indice 2. Que peux-tu en dire ?'
  solution: 'CO2 : 1 atome de carbone et 2 atomes d''oxygène (dioxyde de carbone). CO : 1 atome de carbone et 1 atome d''oxygène
    (monoxyde de carbone). Leurs compositions sont différentes, ce sont deux espèces différentes. Co s''écrit avec une seule
    majuscule : c''est un seul symbole, celui du cobalt ; CO contient deux majuscules, donc deux éléments, C et O.'
- id: nblm-comment-les-118-elements-chimiques-connu-1
  type: choix
  difficulte: 2
  enonce: Comment les 118 éléments chimiques connus sont-ils rangés dans la classification périodique (tableau de Mendeleïev)
    ?
  reponse:
    options:
    - id: o1
      texte: Par numéro atomique croissant
    - id: o2
      texte: Par ordre alphabétique de leurs noms
    - id: o3
      texte: Par taille croissante des molécules
    - id: o4
      texte: Par masse volumique décroissante
    bonnes:
    - o1
  indices:
    relance: Pense à la grandeur qui correspond au nombre de protons de chaque atome.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, l'ordre alphabétique ne détermine pas la position dans le tableau périodique.
  - si:
      contient:
      - o3
    relance: Attention, le tableau répertorie les atomes des éléments chimiques, pas les molécules.
  - si:
      contient:
      - o4
    relance: Attention, le critère d'organisation principal de la classification est le numéro atomique croissant.
  solution: 'Par numéro atomique croissant. C''est exact : la classification périodique range les éléments par numéro atomique
    croissant.'
