    - id: o2
      texte: 2 atomes au total (2 atomes d'azote uniquement)
    - id: o3
      texte: 2 atomes au total (1 atome d'azote et 1 atome d'oxygène)
    - id: o4
      texte: 4 atomes au total
    bonnes:
    - o1
  indices:
    relance: Pense à compter 1 pour un symbole écrit sans indice.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
