  - si:
      contient:
      - o3
    relance: 'Attention, l''indice se place après le symbole : l''indice 4 est placé après le H pour indiquer 4 atomes d''hydrogène.'
  - si:
      contient:
      - o4
    relance: Attention, H2O est la formule de la molécule d'eau.
  solution: 'CH4 : 1 atome de carbone et 4 atomes d''hydrogène. C''est exact : la formule du méthane est CH4, soit 1 atome
    de carbone et 4 atomes d''hydrogène.'
