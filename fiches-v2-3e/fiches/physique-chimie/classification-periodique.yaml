- id: atomes-eau-deux-molecules
  type: nombre
  difficulte: 2
  enonce: Combien d'atomes d'hydrogène y a-t-il dans 4 H2O (quatre molécules d'eau) ? Écris seulement le nombre.
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Combien d'atomes d'hydrogène dans une seule molécule d'eau ?
    methode: Nombre d'atomes = nombre de molécules × nombre d'atomes de cet élément dans une molécule.
    etape: Dans une molécule H2O, l'indice de H est 2. Multiplie ce nombre par le nombre de molécules.
  pieges:
  - si:
      valeur: 2
    relance: Tu as compté une seule molécule. Le 4 devant la formule indique combien de molécules on a.
  - si:
      valeur: 12
    relance: Tu as compté tous les atomes (hydrogène et oxygène). On te demande seulement l'hydrogène.
  solution: 'Une molécule H₂O contient 2 atomes d''hydrogène. Pour 4 molécules : 4 × 2 = 8 atomes d''hydrogène.'
- id: atomes-total-n2o
  type: nombre
  difficulte: 3
  enonce: On a 5 molécules de protoxyde d'azote, de formule N2O. Combien d'atomes y a-t-il en tout (azote et oxygène ensemble)
    ? Écris seulement le nombre.
  reponse:
    valeur: 15
    forme: entier
  indices:
    relance: Commence par compter les atomes d'une seule molécule N2O.
    methode: Additionne les indices pour une molécule (l'oxygène sans indice compte 1), puis multiplie par le nombre de molécules.
    etape: Une molécule compte 2 + 1 atomes. Multiplie ce total par le nombre de molécules.
  pieges:
  - si:
      valeur: 3
    relance: Tu as compté une seule molécule. Combien de molécules a-t-on ?
  - si:
      valeur: 10
    relance: 'Tu as oublié l''atome d''oxygène : un symbole sans indice compte pour un atome.'
  solution: 'Une molécule N₂O compte 2 + 1 = 3 atomes. Pour 5 molécules : 5 × 3 = 15 atomes.'
