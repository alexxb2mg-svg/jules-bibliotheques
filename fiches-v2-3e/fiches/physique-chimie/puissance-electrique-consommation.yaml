format: 2
notion: puissance-electrique-consommation
version: 1
etat: verifiee
declencheurs:
- P égale U fois I
- puissance en watts d'un appareil
- combien coûte un appareil électrique
- énergie en kilowattheure
- facture d'électricité
- comparer la consommation de deux appareils
prerequis:
- circuits-serie-derivation
- bilan-energetique-conservation
essentiel: 'La puissance électrique d''un appareil indique la rapidité avec laquelle il consomme (ou fournit) de l''énergie
  électrique : P = U x I, avec P en watts (W), U la tension en volts (V) et I l''intensité en ampères (A).


  L''énergie électrique consommée pendant une durée t se calcule par E = P x t, avec E en joules si t est en secondes, ou
  en wattheures (Wh) si t est en heures.


  Pour les appareils domestiques, l''énergie se compte souvent en kilowattheures (kWh), l''unité utilisée sur les factures
  d''électricité : 1 kWh = 1000 Wh.


  Plus un appareil a une puissance élevée et plus il fonctionne longtemps, plus il consomme d''énergie électrique.


  Comparer deux appareils sur leur seule puissance ne suffit pas pour comparer leur consommation : il faut aussi tenir compte
  de leur durée d''utilisation.'
methode:
- Utilise P = U x I pour calculer une puissance à partir de la tension et de l'intensité.
- Utilise E = P x t pour calculer une énergie, en veillant à l'unité de temps (s pour des J, h pour des Wh).
- Convertis les Wh en kWh en divisant par 1000 si besoin pour lire une facture.
- Pour comparer deux usages, calcule l'énergie totale consommée (puissance fois durée), pas seulement la puissance.
vocabulaire:
- terme: puissance électrique
  definition: grandeur P, en watts, égale au produit de la tension par l'intensité (P = U x I)
- terme: kilowattheure
  definition: unité d'énergie utilisée sur les factures d'électricité, égale à 1000 wattheures
erreurs_frequentes:
- Confondre puissance (W, instantanée) et énergie (Wh ou J, qui dépend de la durée).
- Oublier de convertir des minutes en heures avant de calculer une énergie en Wh.
- Croire qu'un appareil plus puissant consomme forcément plus d'énergie totale, sans tenir compte de sa durée d'utilisation.
- Confondre kWh (unité d'énergie) et kW (unité de puissance).
exemple:
  enonce: Un radiateur électrique fonctionne sous une tension de 230 V avec une intensité de 2 A. Calculer sa puissance, puis
    l'énergie consommée en 3 heures, en kWh.
  solution: P = U x I = 230 x 2 = 460 W. E = P x t = 460 x 3 = 1380 Wh = 1,38 kWh.
exercices:
- id: puissance-lampe
  type: nombre
  difficulte: 1
  enonce: Une lampe consomme une intensité de 0,5 A sous une tension de 230 V. Calcule sa puissance, en watts.
  reponse:
    valeur: 115
    forme: entier
    tolerance: 1
  indices:
    relance: Quelle formule relie puissance, tension et intensité ?
    methode: Utilise P = U x I.
    etape: Remplace U et I par les valeurs de l'énoncé, puis effectue la multiplication.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta multiplication de la tension par l'intensité.
  solution: P = U x I = 230 x 0,5 = 115 W.
- id: energie-four-micro-ondes
  type: nombre
  difficulte: 2
  enonce: Un four à micro-ondes de puissance 2000 W fonctionne pendant 30 minutes. Calcule l'énergie consommée, en Wh.
  reponse:
    valeur: 1000
    forme: entier
    tolerance: 1
  indices:
    relance: N'oublie pas de convertir la durée en heures avant de calculer une énergie en Wh.
    methode: 30 minutes égale 0,5 heure ; utilise E = P x t avec t en heures.
    etape: Multiplie 2000 par 0,5.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que tu as bien converti 30 minutes en 0,5 heure avant de multiplier.
  solution: E = P x t = 2000 x 0,5 = 1000 Wh, soit 1 kWh.
- id: comparer-deux-appareils
  type: choix
  difficulte: 2
  enonce: Deux appareils ont la même puissance de 1000 W, mais l'un fonctionne 1 heure et l'autre 3 heures. Lequel consomme
    le plus d'énergie ?
  reponse:
    options:
    - id: a
      texte: celui qui fonctionne 3 heures, car il consomme 2000 Wh de plus
    - id: b
      texte: les deux consomment la même énergie, car ils ont la même puissance
    - id: c
      texte: celui qui fonctionne 1 heure, car il utilise moins de temps
    bonnes:
    - a
  indices:
    relance: La puissance seule ne suffit pas pour comparer une consommation d'énergie.
    methode: Calcule l'énergie E = P x t pour chaque appareil, puis compare les deux résultats.
    etape: Le premier consomme 1000 x 1 = 1000 Wh, le second 1000 x 3 = 3000 Wh.
  pieges:
  - si:
      contient:
      - b
    relance: 'Même puissance ne veut pas dire même énergie consommée : il faut aussi tenir compte de la durée de fonctionnement.'
  - si:
      contient:
      - c
    relance: 'Fonctionner moins longtemps consomme moins d''énergie, pas plus : recalcule E = P x t pour chaque appareil.'
  solution: 'Le premier consomme 1000 Wh, le second 3000 Wh : le second (celui qui fonctionne 3 heures) consomme 2000 Wh de
    plus.'
- id: definir-kwh
  type: texte_court
  difficulte: 1
  enonce: Quelle unité d'énergie, utilisée sur les factures d'électricité, correspond à 1000 wattheures ?
  reponse:
    acceptees:
    - kilowattheure
    - kwh
    fautes_tolerees: 1
  indices:
    relance: C'est un multiple du wattheure, préfixé par « kilo ».
    methode: Ce préfixe se retrouve aussi dans d'autres unités, comme le kilomètre ou le kilogramme.
    etape: 'Kilo signifie mille : cette unité vaut donc mille fois l''unité de base d''énergie électrique domestique.'
  pieges:
  - si:
      valeur: kilowatt
    relance: 'Le kilowatt (kW) est une unité de puissance, pas d''énergie : il manque la notion de durée (l''heure).'
  solution: Le kilowattheure (kWh) correspond à 1000 wattheures.
- id: expliquer-comparaison-consommation
  type: ouverte
  difficulte: 3
  enonce: Un ami affirme qu'un appareil de 2000 W consomme forcément plus d'énergie qu'un appareil de 500 W. Explique pourquoi
    cette affirmation est incomplète, avec un exemple chiffré.
  criteres:
  - L'élève explique que la puissance seule ne détermine pas l'énergie consommée, il faut aussi la durée d'utilisation.
  - L'élève utilise la formule E = P x t pour illustrer son propos.
  - L'élève donne un exemple chiffré où l'appareil moins puissant consomme finalement plus d'énergie car utilisé plus longtemps.
  indices:
    relance: Que manque-t-il dans le raisonnement de ton ami pour calculer une énergie ?
    methode: 'Rappelle la formule E = P x t : l''énergie dépend de la puissance ET de la durée.'
    etape: Commence par expliquer que la puissance seule ne suffit pas, il faut connaître la durée de fonctionnement.
  solution: L'affirmation est incomplète car l'énergie consommée dépend de la puissance ET de la durée d'utilisation (E =
    P x t), pas seulement de la puissance. Par exemple, un appareil de 2000 W utilisé 10 minutes (soit environ 0,17 h) consomme
    environ 2000 x 0,17 = 340 Wh, alors qu'un appareil de 500 W utilisé 2 heures consomme 500 x 2 = 1000 Wh, donc bien plus,
    malgré sa puissance plus faible.
