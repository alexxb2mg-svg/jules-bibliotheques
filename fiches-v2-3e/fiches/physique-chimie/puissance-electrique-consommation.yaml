# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: puissance-electrique-consommation
version: 2
etat: verifiee
declencheurs:
- facture d'électricité
- kilowattheure
- kWh
- combien consomme un appareil
- puissance nominale
- compteur électrique
- prix du kWh
- puissance égale U fois I
- énergie consommée en une heure
prerequis:
- 4e-lois-electricite-formalisme
- 4e-relation-puissance-energie
essentiel: 'La puissance électrique P d''un appareil indique l''énergie qu''il reçoit chaque seconde. Elle se calcule avec
  P = U × I.

  P en watts (W), U en volts (V), I en ampères (A).


  On peut aussi écrire I = P ÷ U. Exemple : un four de 1 380 W branché sur 230 V est traversé par un courant de 1 380 ÷ 230
  = 6 A.


  La puissance nominale est la valeur écrite sur l''appareil (plaque ou notice), par exemple « 230 V – 1 500 W ». C''est sa
  puissance quand il fonctionne normalement.


  L''énergie électrique E reçue par un appareil dépend de sa puissance et de sa durée de fonctionnement : E = P × t.

  - P en watts (W) et t en secondes (s) : E en joules (J).

  - P en kilowatts (kW) et t en heures (h) : E en kilowattheures (kWh).

  - P en watts (W) et t en heures (h) : E en wattheures (Wh).


  Conversions à connaître : 1 kW = 1 000 W ; 1 kWh = 1 000 Wh = 3 600 000 J ; 1 h = 3 600 s ; 30 min = 0,5 h ; 15 min = 0,25
  h.


  Le compteur électrique mesure l''énergie en kWh. Le coût se calcule ainsi : coût = énergie en kWh × prix d''un kWh.


  Un appareil très puissant consomme peu s''il marche peu de temps. Un appareil peu puissant peut consommer beaucoup s''il
  reste allumé longtemps.


  Exemple de coût : un four de 2 kW qui fonctionne 1,5 h consomme E = 2 × 1,5 = 3 kWh. Si le kWh coûte 0,20 €, cela coûte
  3 × 0,20 = 0,60 €.


  Ordres de grandeur : une lampe LED consomme environ 10 W, un sèche-cheveux 1 500 W, un radiateur 2 000 W. Le watt et le
  joule ne sont pas la même chose : le watt mesure une puissance (des joules par seconde).


  Au brevet : on calcule P ou I, on convertit les unités, on calcule une énergie ou un coût, et on compare deux appareils
  dans la même unité.

  '
methode:
- Relever la puissance P de l'appareil et la durée t ; si P n'est pas donnée, la calculer avec P = U × I.
- 'Choisir l''unité voulue pour l''énergie : kWh (pour la facture) ou joules.'
- 'Convertir : P en kW et t en h pour des kWh ; P en W et t en s pour des joules.'
- Calculer E = P × t, puis écrire le résultat avec son unité.
- 'Pour un coût : multiplier l''énergie en kWh par le prix d''un kWh.'
- 'Pour comparer deux appareils : exprimer les deux énergies dans la même unité, puis conclure.'
vocabulaire:
- terme: puissance
  definition: Énergie reçue par un appareil en une seconde ; elle se mesure en watts (W).
- terme: puissance nominale
  definition: Puissance indiquée sur un appareil, valable quand il fonctionne normalement.
- terme: énergie électrique
  definition: Énergie transférée par le courant électrique ; E = P × t.
- terme: tension (U)
  definition: Grandeur électrique mesurée en volts (V) avec un voltmètre.
- terme: intensité (I)
  definition: Grandeur électrique mesurée en ampères (A) avec un ampèremètre.
- terme: kilowattheure (kWh)
  definition: Énergie consommée par un appareil de 1 kW qui fonctionne pendant 1 heure ; c'est l'unité de la facture.
- terme: joule (J)
  definition: Unité légale de l'énergie.
- terme: wattheure (Wh)
  definition: Énergie consommée par un appareil de 1 W en 1 heure ; 1 kWh = 1 000 Wh.
erreurs_frequentes:
- Confondre le watt (W, une puissance) et le wattheure (Wh, une énergie).
- Multiplier des kW par des minutes sans convertir les minutes en heures (30 min = 0,5 h, pas 0,30 h).
- Oublier de convertir les W en kW (diviser par 1 000) pour obtenir des kWh.
- 'Croire qu''un appareil de faible puissance consomme forcément peu : la durée compte aussi.'
- 'Oublier que le prix se calcule avec des kWh : convertir d''abord l''énergie, puis multiplier par le prix du kWh.'
exemple:
  enonce: Un sèche-cheveux de 1 200 W fonctionne pendant 15 min. Calcule l'énergie consommée en kWh, puis en joules.
  solution: 'En kWh : P = 1,2 kW et t = 15 min = 0,25 h, donc E = 1,2 × 0,25 = 0,3 kWh. En joules : P = 1 200 W et t = 15
    × 60 = 900 s, donc E = 1 200 × 900 = 1 080 000 J.'
exercices:
- id: puissance-lampe
  type: nombre
  difficulte: 1
  enonce: Une lampe branchée sous une tension de 230 V est traversée par un courant d'intensité 0,5 A. Calcule sa puissance
    en watts. Écris seulement le nombre.
  reponse:
    valeur: 115
    forme: libre
  indices:
    relance: Quelle relation relie la puissance, la tension et l'intensité ?
    methode: 'Utilise P = U × I avec U en volts et I en ampères : le résultat est en watts.'
    etape: Remplace les lettres par les valeurs de l'énoncé, puis fais la multiplication de la tension par l'intensité.
  pieges:
  - si:
      valeur: 460
    relance: 'Tu as divisé la tension par l''intensité. Relis la relation : faut-il diviser ou multiplier ?'
  - si:
      valeur: 230,5
    relance: Tu as additionné la tension et l'intensité. Quelle opération donne la relation P = U × I ?
  solution: P = U × I = 230 × 0,5 = 115 W.
- id: unites-grandeurs
  type: association
  difficulte: 1
  enonce: Associe chaque grandeur électrique à son unité.
  reponse:
    gauche:
    - id: p
      texte: puissance
    - id: u
      texte: tension
    - id: i
      texte: intensité
    - id: e
      texte: énergie
    droite:
    - id: w
      texte: watt (W)
    - id: v
      texte: volt (V)
    - id: a
      texte: ampère (A)
    - id: j
      texte: joule (J)
    paires:
      p: w
      u: v
      i: a
      e: j
  indices:
    relance: Dans P = U × I, quelle unité porte chacune des trois lettres ?
    methode: Commence par ce que tu mesures avec un voltmètre et avec un ampèremètre.
    etape: 'Le voltmètre mesure une tension. Il reste la puissance et l''énergie : laquelle s''écrit aussi en kWh ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie la puissance et l''énergie : ce ne sont pas les mêmes grandeurs.'
  solution: 'Puissance : watt (W). Tension : volt (V). Intensité : ampère (A). Énergie : joule (J), qu''on exprime aussi en
    kWh.'
- id: radiateur-trois-heures
  type: choix
  difficulte: 2
  enonce: Un radiateur de 2 000 W fonctionne pendant 3 h. Quelles écritures donnent l'énergie qu'il consomme ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: a
      texte: 6 kWh
    - id: b
      texte: 6 000 W
    - id: c
      texte: 6 000 Wh
    - id: d
      texte: 0,67 kWh
    bonnes:
    - a
    - c
  indices:
    relance: Une énergie s'écrit-elle en W, ou en Wh et kWh ?
    methode: Calcule E = P × t une fois avec P en W, une fois avec P en kW, la durée restant en heures.
    etape: 2 000 W = 2 kW. Multiplie chaque puissance par la durée, puis compare avec les propositions.
  pieges:
  - si:
      contient:
      - b
    relance: Le watt est l'unité d'une puissance. Quelle unité faut-il pour une énergie ?
  - si:
      contient:
      - d
    relance: Tu as divisé la puissance par la durée. Dans E = P × t, quelle opération faut-il faire ?
  - si:
      diagnostic: incomplet
    relance: 'Il y a une autre bonne réponse : la même énergie peut s''écrire dans une autre unité.'
  solution: E = P × t = 2 kW × 3 h = 6 kWh, soit aussi 2 000 W × 3 h = 6 000 Wh. « 6 000 W » est une puissance, pas une énergie.
- id: four-trente-minutes
  type: nombre
  difficulte: 2
  enonce: Un four de 1 500 W fonctionne pendant 30 min. Calcule l'énergie consommée en kilowattheures (kWh). Écris seulement
    le nombre.
  reponse:
    valeur: 0,75
    forme: libre
  indices:
    relance: Pour obtenir des kWh, dans quelles unités faut-il écrire la puissance et la durée ?
    methode: Convertis la puissance en kW (divise par 1 000) et la durée en heures (divise les minutes par 60), puis utilise
      E = P × t.
    etape: 1 500 W = 1,5 kW et 30 min = 0,5 h. Il reste à multiplier.
  pieges:
  - si:
      valeur: 45
    relance: Tu as multiplié par des minutes. Combien d'heures font 30 minutes ?
  - si:
      valeur: 750
    relance: Ton résultat est en wattheures (Wh). Comment passer des Wh aux kWh ?
  - si:
      valeur: 45000
    relance: Tu as gardé des watts et des minutes. Convertis la puissance en kW et la durée en heures.
  - si:
      valeur: 0,45
    relance: 30 minutes, ce n'est pas 0,30 h. Quelle fraction d'une heure représentent 30 minutes ?
  solution: P = 1 500 W = 1,5 kW et t = 30 min = 0,5 h, donc E = P × t = 1,5 × 0,5 = 0,75 kWh.
- id: intensite-radiateur
  type: nombre
  difficulte: 2
  enonce: Un radiateur porte l'indication « 230 V – 2 300 W ». Quelle est l'intensité du courant qui le traverse quand il
    fonctionne normalement, en ampères (A) ? Écris seulement le nombre.
  reponse:
    valeur: 10
    forme: libre
  indices:
    relance: Dans P = U × I, quelle grandeur cherches-tu ? Comment l'isoler ?
    methode: 'Ici on connaît P et U : I = P ÷ U, avec P en watts et U en volts, donne I en ampères.'
    etape: Remplace P et U par les valeurs de l'appareil (2 300 et 230), puis fais la division.
  pieges:
  - si:
      valeur: 529000
    relance: 'Tu as multiplié la puissance par la tension. Retourne la relation P = U × I : que vaut I ?'
  - si:
      valeur: 0,1
    relance: Tu as divisé la tension par la puissance. Vérifie l'ordre de la division.
  - si:
      diagnostic: valeur_fausse
    relance: Refais la division de la puissance en watts par la tension en volts.
  solution: I = P ÷ U = 2 300 ÷ 230 = 10 A.
- id: bouilloire-joules
  type: nombre
  difficulte: 3
  enonce: Une bouilloire de 2 000 W chauffe de l'eau pendant 2 min. Calcule l'énergie consommée en joules (J). Écris seulement
    le nombre.
  reponse:
    valeur: 240000
    forme: libre
  indices:
    relance: Pour obtenir des joules, dans quelles unités faut-il écrire la puissance et la durée ?
    methode: Garde la puissance en watts, convertis la durée en secondes (1 min = 60 s), puis utilise E = P × t.
    etape: 2 min = 120 s. Multiplie maintenant la puissance en watts par cette durée.
  pieges:
  - si:
      valeur: 4000
    relance: Tu as multiplié par des minutes. Pour des joules, la durée doit être en secondes.
  - si:
      valeur: 0,0667
    relance: 'Ce résultat serait en kWh (et arrondi). L''énoncé demande des joules : garde des watts et des secondes.'
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie tes conversions : la puissance en W, la durée en s. Refais la multiplication.'
  solution: t = 2 min = 120 s, donc E = P × t = 2 000 × 120 = 240 000 J.
- id: cout-lavage
  type: nombre
  difficulte: 3
  enonce: Un lave-linge de 2 000 W fonctionne 2 h pour un lavage. Le prix du kWh est de 0,20 € (prix choisi pour l'exercice).
    Quel est le coût d'un lavage, en euros ? Écris seulement le nombre.
  reponse:
    valeur: 0.8
    forme: libre
  indices:
    relance: Il te faut d'abord l'énergie consommée. Dans quelle unité doit-elle être pour utiliser le prix du kWh ?
    methode: Calcule E = P × t en kWh (P en kW, t en h), puis multiplie E par le prix d'un kWh.
    etape: 2 000 W = 2 kW. Calcule E = 2 × 2 en kWh, puis multiplie par 0,20.
  pieges:
  - si:
      valeur: 4
    relance: Ce nombre est l'énergie consommée, pas le coût. Que faut-il faire du prix du kWh ?
  - si:
      valeur: 800
    relance: 'Tu as gardé la puissance en watts. Le prix est donné par kWh : convertis d''abord en kW.'
  - si:
      valeur: 0,4
    relance: As-tu tenu compte de la durée du lavage dans le calcul de l'énergie ?
  - si:
      diagnostic: valeur_fausse
    relance: Calcule l'énergie en kWh, puis multiplie par 0,20 €.
  solution: P = 2 kW et t = 2 h, donc E = 2 × 2 = 4 kWh. Coût = 4 × 0,20 = 0,80 €.
- id: lampe-ou-box
  type: ouverte
  difficulte: 3
  enonce: Une lampe de 60 W reste allumée 5 h par jour. Une box internet de 15 W reste branchée 24 h sur 24. Lequel des deux
    appareils consomme le plus d'énergie en un jour ? Justifie par des calculs.
  criteres:
  - L'élève calcule l'énergie de chaque appareil avec E = P × t (300 Wh pour la lampe, 360 Wh pour la box, ou 0,3 kWh et 0,36
    kWh).
  - L'élève compare les deux énergies exprimées dans la même unité.
  - L'élève conclut que la box consomme le plus et explique que la durée compte autant que la puissance.
  indices:
    relance: L'appareil le plus puissant est-il forcément celui qui consomme le plus ?
    methode: Calcule l'énergie de chaque appareil avec E = P × t, en gardant les mêmes unités pour les deux.
    etape: 'Pour la lampe : E = 60 W × 5 h. Fais le même calcul pour la box, puis compare.'
  solution: 'Lampe : E = 60 × 5 = 300 Wh = 0,3 kWh. Box : E = 15 × 24 = 360 Wh = 0,36 kWh. La box consomme plus, car elle
    fonctionne beaucoup plus longtemps, même si sa puissance est plus faible.'
- id: nblm-que-represente-la-puissance-nominale-ins-1
  type: choix
  difficulte: 2
  enonce: Que représente la puissance nominale inscrite sur un appareil électrique ?
  reponse:
    options:
    - id: o1
      texte: Sa puissance lorsqu'il fonctionne dans des conditions normales.
    - id: o2
      texte: L'énergie maximale que l'appareil peut stocker.
    - id: o3
      texte: La tension électrique minimale nécessaire à son allumage.
    - id: o4
      texte: Le nombre d'heures pendant lesquelles l'appareil peut fonctionner.
    bonnes:
    - o1
  indices:
    relance: Pense aux conditions habituelles d'utilisation prévues par le fabricant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La puissance mesure un transfert d'énergie par seconde, pas une réserve d'énergie.
  - si:
      contient:
      - o3
    relance: La tension s'exprime en volts (V), alors que la puissance nominale s'exprime en watts (W).
  - si:
      contient:
      - o4
    relance: Cette grandeur représente une durée de fonctionnement, pas une puissance.
  solution: Sa puissance lorsqu'il fonctionne dans des conditions normales. C'est la définition exacte de la puissance nominale
    inscrite par le fabricant.
- id: nblm-quelle-unite-est-utilisee-sur-une-factur-2
  type: choix
  difficulte: 2
  enonce: Quelle unité est utilisée sur une facture d'électricité pour compter l'énergie consommée ?
  reponse:
    options:
    - id: o1
      texte: Le kilowattheure (kWh)
    - id: o2
      texte: Le watt (W)
    - id: o3
      texte: Le volt (V)
    - id: o4
      texte: Le joule par seconde (J/s)
    bonnes:
    - o1
  indices:
    relance: Cherche l'unité adaptée aux consommations d'un logement au cours d'un mois.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le watt mesure la puissance électrique, et non l'énergie consommée.
  - si:
      contient:
      - o3
    relance: Le volt mesure la tension électrique aux bornes d'un appareil.
  - si:
      contient:
      - o4
    relance: Le joule par seconde correspond au watt, qui est une unité de puissance et non d'énergie.
  solution: Le kilowattheure (kWh). C'est l'unité usuelle utilisée par les fournisseurs d'électricité pour la facturation.
- id: nblm-un-seche-cheveux-de-puissance-1-200-w-fo-3
  type: choix
  difficulte: 2
  enonce: Un sèche-cheveux de puissance 1 200 W fonctionne pendant 15 minutes. Combien consomme cet appareil en kilowattheures
    (kWh) ?
  reponse:
    options:
    - id: o1
      texte: 0,3 kWh
    - id: o2
      texte: 18 kWh
    - id: o3
      texte: 300 kWh
    - id: o4
      texte: 18 000 kWh
    bonnes:
    - o1
  indices:
    relance: Pense à convertir les watts en kilowatts et les minutes en heures avant d'effectuer le calcul.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : multiplier 1,2 kW par 15 minutes sans convertir les minutes en heures.'
  - si:
      contient:
      - o3
    relance: 'Erreur : multiplier la puissance en watts (1 200 W) par 0,25 h sans convertir d''abord en kW.'
  - si:
      contient:
      - o4
    relance: 'Erreur : multiplier 1 200 W par 15 min sans effectuer aucune conversion d''unités.'
  solution: 0,3 kWh. P = 1,2 kW et t = 15 min = 0,25 h, d'où E = 1,2 × 0,25 = 0,3 kWh.
- id: nblm-de-quels-facteurs-depend-l-energie-elect-4
  type: choix
  difficulte: 2
  enonce: De quels facteurs dépend l'énergie électrique consommée par un appareil domestique ?
  reponse:
    options:
    - id: o1
      texte: De sa puissance électrique et de sa durée de fonctionnement.
    - id: o2
      texte: Uniquement de sa puissance électrique.
    - id: o3
      texte: Uniquement de sa durée d'utilisation.
    - id: o4
      texte: De sa masse et de son volume.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi les deux variables qui apparaissent dans la formule E = P × t.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : oublier que la durée intervient aussi ; un appareil peu puissant utilisé longtemps peut consommer
      beaucoup.'
  - si:
      contient:
      - o3
    relance: La durée seule ne suffit pas, car la puissance de l'appareil détermine la quantité d'énergie reçue chaque seconde.
  - si:
      contient:
      - o4
    relance: La masse et le volume n'interviennent pas dans la formule de la consommation électrique.
  solution: De sa puissance électrique et de sa durée de fonctionnement. D'après la formule E = P × t, l'énergie dépend de
    la puissance et de la durée d'utilisation.
- id: nblm-combien-de-joules-j-represente-exactemen-5
  type: choix
  difficulte: 2
  enonce: Combien de joules (J) représente exactement une énergie de 1 kilowattheure (kWh) ?
  reponse:
    options:
    - id: o1
      texte: 3 600 000 J
    - id: o2
      texte: 1 000 J
    - id: o3
      texte: 3 600 J
    - id: o4
      texte: 60 000 J
    bonnes:
    - o1
  indices:
    relance: 'Pense aux deux conversions : 1 kW en watts et 1 heure en secondes.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 1 000 J correspond à l'énergie transférée par 1 kW pendant 1 seule seconde.
  - si:
      contient:
      - o3
    relance: 3 600 J correspond à 1 watt pendant 1 heure (1 Wh) et non 1 kW.
  - si:
      contient:
      - o4
    relance: Erreur due à la conversion de l'heure en 60 minutes au lieu de 3 600 secondes.
  solution: 3 600 000 J. 1 kW = 1 000 W et 1 h = 3 600 s, donc 1 kWh = 1 000 × 3 600 = 3 600 000 J.
- id: nblm-parmi-les-associations-d-unites-suivante-6
  type: choix
  difficulte: 3
  enonce: Parmi les associations d'unités suivantes, lesquelles sont correctes pour calculer l'énergie avec E = P × t ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: P en watts (W) et t en secondes (s) pour donner E en joules (J)
    - id: o2
      texte: P en kilowatts (kW) et t en heures (h) pour donner E en kilowattheures (kWh)
    - id: o3
      texte: P en watts (W) et t en heures (h) pour donner E en kilowattheures (kWh)
    - id: o4
      texte: P en kilowatts (kW) et t en minutes (min) pour donner E en joules (J)
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux associations qui respectent la cohérence des unités pour l'énergie (légale ou usuelle).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Si la puissance est en watts et le temps en heures, le résultat est en wattheures (Wh), pas en kWh.
  - si:
      contient:
      - o4
    relance: Pour obtenir des joules, la durée doit être exprimée en secondes et la puissance en watts.
  solution: P en watts (W) et t en secondes (s) pour donner E en joules (J) ; P en kilowatts (kW) et t en heures (h) pour
    donner E en kilowattheures (kWh). C'est l'association de l'unité légale du système international.
