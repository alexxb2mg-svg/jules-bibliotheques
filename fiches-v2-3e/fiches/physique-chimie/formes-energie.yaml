format: 2
notion: formes-energie
version: 1
etat: verifiee
declencheurs:
- énergie cinétique du vent
- énergie potentielle de position
- énergie thermique ressentie
- convertir de l'énergie
- panneau solaire électricité
- pile chimique électrique
prerequis: []
essentiel: 'L''énergie existe sous différentes formes : cinétique (liée au mouvement), potentielle (liée à la position, par
  exemple l''altitude, ou à un état, comme un ressort comprimé), thermique (liée à l''agitation des particules, ressentie
  comme la chaleur), électrique (liée au déplacement de charges électriques), chimique (stockée dans les liaisons entre atomes,
  libérée par une réaction chimique), nucléaire (stockée dans le noyau des atomes) et lumineuse (transportée par la lumière).


  Un dispositif ne crée jamais d''énergie : il la convertit d''une forme à une autre (une pile convertit de l''énergie chimique
  en énergie électrique, un panneau solaire convertit de l''énergie lumineuse en énergie électrique, une éolienne convertit
  de l''énergie cinétique du vent en énergie électrique).


  Certains dispositifs de conversion d''énergie (moteurs à combustion, centrales thermiques) libèrent du dioxyde de carbone
  au cours de la conversion, ce qui a un impact sur l''effet de serre.


  L''énergie se mesure en joules (J) ; pour l''énergie électrique domestique, on utilise souvent le kilowattheure (kWh), avec
  1 kWh = 3,6 millions de joules.'
methode:
- Pour analyser un dispositif, repérer la forme d'énergie en entrée et la ou les formes d'énergie en sortie.
- Se souvenir qu'un dispositif ne fait que convertir l'énergie, jamais n'en crée ou n'en détruit.
- Repérer si la conversion s'accompagne d'une émission de dioxyde de carbone (combustion, centrale thermique) ou non (panneau
  solaire, éolienne).
- Convertir entre joules et kilowattheures si besoin (1 kWh = 3 600 000 J).
vocabulaire:
- terme: énergie cinétique
  definition: forme d'énergie liée au mouvement d'un objet
- terme: énergie potentielle
  definition: forme d'énergie liée à la position (altitude) ou à un état (ressort comprimé) d'un objet
- terme: conversion
  definition: transformation d'une forme d'énergie en une autre, sans création ni disparition d'énergie
erreurs_frequentes:
- 'Croire qu''un appareil « produit » de l''énergie à partir de rien : il la convertit toujours à partir d''une source.'
- Confondre énergie cinétique (mouvement) et énergie potentielle (position ou état).
- Penser que toutes les conversions d'énergie émettent du CO2 (un panneau solaire n'en émet pas pendant son fonctionnement).
- Oublier de convertir kWh en J (ou inversement) avant de comparer deux valeurs.
exemple:
  enonce: Une centrale thermique brûle du charbon pour produire de l'électricité. Quelles formes d'énergie sont mises en jeu,
    et cette conversion émet-elle du CO2 ?
  solution: Énergie chimique (du charbon) vers énergie thermique (combustion) vers énergie électrique. La combustion du charbon
    (carboné) émet du dioxyde de carbone.
exercices:
- id: kwh-en-joules
  type: nombre
  difficulte: 1
  enonce: Convertis 3 kWh en joules (1 kWh = 3 600 000 J).
  reponse:
    valeur: 10800000
    forme: entier
    tolerance: 0
  indices:
    relance: Combien de joules y a-t-il dans 1 kWh ?
    methode: Multiplie le nombre de kWh par 3 600 000.
    etape: Pose la multiplication 3 fois 3 600 000 et termine le calcul.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que tu as bien multiplié par 3 600 000, et non par 1000 ou par 3600 seul.
  solution: 3 x 3 600 000 = 10 800 000 J.
- id: forme-eolienne
  type: choix
  difficulte: 1
  enonce: Une éolienne fait tourner ses pales grâce au vent et produit de l'électricité. Quelle forme d'énergie est convertie
    en énergie électrique ?
  reponse:
    options:
    - id: a
      texte: l'énergie cinétique du vent
    - id: b
      texte: l'énergie chimique du vent
    - id: c
      texte: l'énergie nucléaire du vent
    bonnes:
    - a
  indices:
    relance: Qu'est-ce qui fait tourner les pales de l'éolienne ?
    methode: 'Le vent est de l''air en mouvement : quelle forme d''énergie est liée au mouvement ?'
    etape: L'énergie liée au mouvement d'un objet ou d'un fluide porte un nom précis, différent de chimique ou nucléaire.
  pieges:
  - si:
      contient:
      - b
    relance: L'énergie chimique est stockée dans les liaisons entre atomes (comme dans un carburant), pas dans un flux d'air
      en mouvement.
  - si:
      contient:
      - c
    relance: L'énergie nucléaire est stockée dans le noyau des atomes, elle n'a rien à voir avec le vent.
  solution: L'éolienne convertit l'énergie cinétique du vent (liée à son mouvement) en énergie électrique.
- id: dispositif-lumiere-electricite
  type: texte_court
  difficulte: 2
  enonce: Quel appareil convertit de l'énergie lumineuse en énergie électrique ?
  reponse:
    acceptees:
    - panneau solaire
    - panneau photovoltaïque
    - cellule photovoltaïque
    fautes_tolerees: 1
  indices:
    relance: Pense à un appareil posé sur les toits, exposé au Soleil.
    methode: Il transforme la lumière du Soleil en électricité utilisable.
    etape: Ce dispositif est souvent composé de plusieurs plaques sombres orientées vers le Soleil.
  pieges:
  - si:
      valeur: ampoule
    relance: 'Une ampoule fait la conversion inverse : elle transforme l''énergie électrique en lumière, pas l''inverse.'
  solution: Un panneau solaire (ou panneau photovoltaïque) convertit l'énergie lumineuse en énergie électrique.
- id: associer-forme-exemple
  type: association
  difficulte: 2
  enonce: Relie chaque forme d'énergie à un exemple qui l'illustre.
  reponse:
    gauche:
    - id: a
      texte: énergie chimique
    - id: b
      texte: énergie thermique
    - id: c
      texte: énergie potentielle
    droite:
    - id: x
      texte: une pile avant utilisation
    - id: y
      texte: l'eau chaude d'une casserole
    - id: z
      texte: un objet en hauteur, prêt à tomber
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Laquelle de ces formes est liée à l'agitation des particules ?
    methode: La chimique est stockée dans les liaisons entre atomes ; la thermique est ressentie comme la chaleur ; la potentielle
      dépend de la position.
    etape: Une pile stocke de l'énergie dans ses réactifs chimiques ; l'eau chaude est liée à l'agitation des particules ;
      un objet en hauteur a de l'énergie liée à sa position.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends la définition de chaque forme d'énergie.
  - si:
      diagnostic: associations_fausses
    relance: 'Repars de la définition de chaque forme : chimique (liaisons entre atomes), thermique (agitation des particules),
      potentielle (position).'
  solution: Énergie chimique -> une pile avant utilisation ; énergie thermique -> l'eau chaude d'une casserole ; énergie potentielle
    -> un objet en hauteur, prêt à tomber.
- id: expliquer-conversion-centrale
  type: ouverte
  difficulte: 3
  enonce: Une centrale thermique au gaz brûle du gaz naturel pour produire de l'électricité. Explique quelles formes d'énergie
    sont mises en jeu, dans l'ordre, et si cette conversion a un impact sur l'effet de serre.
  criteres:
  - L'élève identifie l'énergie chimique du gaz comme énergie de départ.
  - L'élève décrit la conversion en énergie thermique (combustion) puis en énergie électrique.
  - L'élève relie la combustion du gaz (carboné) à une émission de dioxyde de carbone qui renforce l'effet de serre.
  indices:
    relance: Le gaz naturel stocke de l'énergie sous quelle forme, avant d'être brûlé ?
    methode: 'Suis la chaîne de conversion : énergie chimique, puis thermique par combustion, puis électrique.'
    etape: Commence par nommer la forme d'énergie stockée dans le gaz avant la combustion.
  solution: Le gaz naturel stocke de l'énergie chimique. La combustion convertit cette énergie chimique en énergie thermique,
    qui est ensuite convertie en énergie électrique. Le gaz naturel étant un combustible carboné, sa combustion émet du dioxyde
    de carbone, ce qui renforce l'effet de serre.
