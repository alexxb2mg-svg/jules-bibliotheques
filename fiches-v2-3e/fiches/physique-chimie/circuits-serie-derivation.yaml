# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: circuits-serie-derivation
version: 1
etat: verifiee
declencheurs:
- branchement en série
- branchement en dérivation
- additivité des tensions
- additivité des intensités
- loi des nœuds
- branche principale
prerequis:
- 4e-lois-electricite-formalisme
essentiel: 'Circuit en série (une seule boucle) :

  - l''intensité du courant est la même en tout point du circuit ;

  - loi d''additivité des tensions : la tension aux bornes du générateur est égale à la somme des tensions aux bornes des
  autres dipôles.


  Circuit avec des dipôles en dérivation (plusieurs boucles) :

  - loi d''unicité des tensions : des dipôles branchés en dérivation ont la même tension à leurs bornes ;

  - loi d''additivité des intensités : l''intensité dans la branche principale est égale à la somme des intensités dans les
  branches dérivées.


  Mesures : la tension U se mesure en volts (V) avec un voltmètre branché en dérivation ; l''intensité I se mesure en ampères
  (A) avec un ampèremètre branché en série.


  Loi d''Ohm : pour une résistance (conducteur ohmique), U = R × I, avec U en volts (V), R en ohms (Ω) et I en ampères (A).

  '
methode:
- Repérer le montage, une seule boucle (série) ou plusieurs boucles (dérivation).
- 'En série : même intensité partout, et les tensions s''additionnent.'
- 'En dérivation : même tension aux bornes des branches, et les intensités s''additionnent.'
- Écrire la loi avec les valeurs connues, puis calculer la valeur manquante.
- Pour une résistance, utiliser U = R × I (ou I = U ÷ R).
vocabulaire:
- terme: dipôle
  definition: composant électrique à deux bornes (lampe, moteur, pile, résistance...)
- terme: nœud
  definition: point du circuit où se rejoignent au moins trois fils
- terme: branche principale
  definition: partie du circuit, en dérivation, qui contient le générateur
erreurs_frequentes:
- Additionner les tensions dans un montage en dérivation, alors qu'elles sont égales.
- Croire que l'intensité est la même dans toutes les branches d'un montage en dérivation.
- Croire que le courant « s'use » en traversant une lampe dans un circuit en série.
- Brancher le voltmètre en série ou l'ampèremètre en dérivation.
- Dans la loi d'Ohm, diviser R par I au lieu de multiplier.
exemple:
  enonce: Une pile de 9 V alimente deux lampes identiques branchées en série. Quelle est la tension aux bornes de chaque lampe
    ?
  solution: 'Circuit en série : additivité des tensions, U pile = U1 + U2. Les lampes sont identiques, donc U1 = U2 = 9 ÷
    2 = 4,5 V.'
exercices:
- id: grandeurs-unites-appareils
  type: association
  difficulte: 1
  enonce: Associe chaque grandeur électrique à son unité. Réponds par des paires, par exemple a-watt.
  reponse:
    gauche:
    - id: a
      texte: la tension U
    - id: b
      texte: l'intensité I
    - id: c
      texte: la résistance R
    droite:
    - id: volt
      texte: le volt (V)
    - id: ampere
      texte: l'ampère (A)
    - id: ohm
      texte: l'ohm (Ω)
    - id: watt
      texte: le watt (W)
    paires:
      a: volt
      b: ampere
      c: ohm
  indices:
    relance: Laquelle de ces unités sert à mesurer autre chose, la puissance ?
    methode: Pense aux appareils de mesure, le voltmètre et l'ampèremètre. Leur nom contient l'unité qu'ils mesurent.
    etape: L'ampèremètre mesure l'intensité. Fais le même raisonnement avec le voltmètre.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule paire est fausse. Relis le nom des appareils de mesure.
  - si:
      diagnostic: associations_fausses
    relance: Le watt est l'unité de la puissance, il ne sert pas ici. Reprends chaque grandeur avec le nom de son appareil
      de mesure.
  solution: a-volt (la tension en V), b-ampère (l'intensité en A), c-ohm (la résistance en Ω). Le watt est l'unité de puissance.
- id: tension-moteur-serie
  type: nombre
  difficulte: 1
  enonce: Un générateur de tension 12 V alimente une lampe et un moteur branchés en série. La tension aux bornes de la lampe
    vaut 4,5 V. Quelle est la tension aux bornes du moteur, en volts (V) ? Écris seulement le nombre.
  reponse:
    valeur: 7.5
  indices:
    relance: Le circuit a-t-il une seule boucle ou plusieurs ? Quelle loi sur les tensions s'applique alors ?
    methode: 'En série, la tension du générateur est égale à la somme des tensions aux bornes des dipôles : U générateur =
      U lampe + U moteur.'
    etape: 'Écris : 12 = 4,5 + U moteur. Trouve U moteur.'
  pieges:
  - si:
      valeur: 12
    relance: 'L''égalité des tensions, c''est pour des dipôles en dérivation. Ici, lampe et moteur sont en série : que dit
      la loi sur les tensions ?'
  - si:
      valeur: 16.5
    relance: La tension du générateur est la somme des deux autres, elle ne s'y ajoute pas. Refais l'égalité.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta soustraction entre la tension du générateur et celle de la lampe.
  solution: 'Additivité des tensions en série : U moteur = 12 − 4,5 = 7,5 V.'
- id: intensite-derivation
  type: nombre
  difficulte: 2
  enonce: Deux lampes L1 et L2 sont branchées en dérivation aux bornes d'une pile. L'ampèremètre placé dans la branche principale
    indique 0,50 A. Celui placé dans la branche de L1 indique 0,20 A. Quelle est l'intensité du courant qui traverse L2, en
    ampères (A) ? Écris seulement le nombre.
  reponse:
    valeur: 0.3
  indices:
    relance: Au nœud, le courant de la branche principale se partage entre les deux branches. Quelle loi l'exprime ?
    methode: 'Loi d''additivité des intensités : I principale = I1 + I2.'
    etape: 'Écris : 0,50 = 0,20 + I2. Trouve I2.'
  pieges:
  - si:
      valeur: 0.5
    relance: 'La même intensité partout, c''est dans un circuit en série. Ici, le courant se partage entre deux branches :
      que dit la loi ?'
  - si:
      valeur: 0.2
    relance: Les deux lampes ne sont pas forcément identiques. Utilise la loi d'additivité des intensités.
  - si:
      valeur: 0.7
    relance: L'intensité de la branche principale est la somme des deux autres, pas un terme en plus. Refais l'égalité.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta soustraction entre l'intensité de la branche principale et celle de L1.
  solution: 'Additivité des intensités : I2 = 0,50 − 0,20 = 0,30 A.'
- id: loi-ohm-tension
  type: nombre
  difficulte: 2
  enonce: Une résistance de 220 Ω est traversée par un courant d'intensité 0,05 A. Calcule la tension à ses bornes, en volts
    (V). Écris seulement le nombre.
  reponse:
    valeur: 11
  indices:
    relance: Quelle loi relie la tension, la résistance et l'intensité ?
    methode: 'Loi d''Ohm : U = R × I, avec R en ohms et I en ampères. Les unités sont déjà les bonnes.'
    etape: 'Remplace les lettres : U = 220 × 0,05. Fais le calcul.'
  pieges:
  - si:
      valeur: 4400
    relance: As-tu divisé la résistance par l'intensité ? La loi d'Ohm est un produit.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta multiplication de la résistance par l'intensité.
  solution: U = R × I = 220 × 0,05 = 11 V.
- id: vrai-derivation
  type: choix
  difficulte: 2
  enonce: Deux lampes différentes sont branchées en dérivation aux bornes d'une pile. Quelles affirmations sont vraies ?
  reponse:
    options:
    - id: a
      texte: Les tensions aux bornes des deux lampes sont égales.
    - id: b
      texte: Les intensités dans les deux lampes sont forcément égales.
    - id: c
      texte: L'intensité dans la branche principale est la somme des intensités dans les deux branches.
    - id: d
      texte: Si on dévisse une lampe, l'autre s'éteint.
    bonnes:
    - a
    - c
  indices:
    relance: En dérivation, qu'est-ce qui est pareil pour les deux lampes, la tension ou l'intensité ?
    methode: Rappelle-toi les deux lois du montage en dérivation, une sur les tensions, une sur les intensités. Puis pense
      à ce qui se passe quand une branche est ouverte.
    etape: Chaque lampe forme une boucle avec la pile. Si une boucle est ouverte, l'autre est-elle encore fermée ?
  pieges:
  - si:
      contient:
      - b
    relance: Les lampes sont différentes. Le courant se partage-t-il forcément en deux parts égales ?
  - si:
      contient:
      - d
    relance: Chaque lampe a sa propre boucle avec la pile. Si l'une est ouverte, l'autre boucle est-elle coupée ?
  - si:
      diagnostic: incomplet
    relance: Il manque une affirmation vraie. Pense aux deux lois du montage en dérivation.
  solution: a et c sont vraies (unicité des tensions et additivité des intensités). Les intensités ne sont égales que si les
    lampes sont identiques, et si on dévisse une lampe, l'autre reste allumée car sa boucle reste fermée.
- id: protocole-additivite
  type: ouverte
  difficulte: 3
  enonce: 'Un circuit en série comprend un générateur, une lampe et un moteur. Propose un protocole pour vérifier la loi d''additivité
    des tensions dans ce circuit : quel appareil, comment le brancher, quelles mesures, quelle comparaison ?'
  criteres:
  - L'élève utilise un voltmètre branché en dérivation aux bornes de chaque dipôle.
  - 'L''élève prévoit trois mesures : la tension aux bornes du générateur, de la lampe et du moteur.'
  - L'élève compare la tension du générateur à la somme des tensions de la lampe et du moteur, et conclut que la loi est vérifiée
    si elles sont égales (aux erreurs de mesure près).
  indices:
    relance: Avec quel appareil mesure-t-on une tension, et comment le branche-t-on ?
    methode: 'Décris dans l''ordre : l''appareil, son branchement, les mesures à faire, puis le calcul qui permet de conclure.'
    etape: On branche le voltmètre en dérivation aux bornes du générateur et on note la tension. Que fait-on ensuite ?
  solution: 'On branche un voltmètre en dérivation aux bornes du générateur, puis de la lampe, puis du moteur, et on note
    les trois tensions. On calcule U lampe + U moteur et on compare à U générateur : si les deux valeurs sont égales (aux
    erreurs de mesure près), la loi d''additivité des tensions est vérifiée.'
- id: nblm-dans-un-circuit-comportant-une-seule-bou-1
  type: choix
  difficulte: 2
  enonce: Dans un circuit comportant une seule boucle (branchement en série), que sait-on sur l'intensité du courant électrique
    ?
  reponse:
    options:
    - id: o1
      texte: Elle est la même en tout point du circuit.
    - id: o2
      texte: Elle diminue au fur et à mesure qu'elle traverse les dipôles.
    - id: o3
      texte: Elle s'additionne aux bornes de chaque dipôle.
    - id: o4
      texte: Elle s'annule juste après le premier dipôle.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au nombre de boucles dans un circuit en série et à la façon dont le courant y circule.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur fréquente de croire que le courant s'use en traversant une lampe ou un autre dipôle.
  - si:
      contient:
      - o3
    relance: L'additivité concerne la tension électrique dans un circuit en série, et non l'intensité.
  - si:
      contient:
      - o4
    relance: Le courant électrique circule de façon continue dans l'ensemble de la boucle fermée.
  solution: 'Elle est la même en tout point du circuit. C''est la règle fondamentale du circuit en série : l''intensité du
    courant ne varie pas le long de la boucle.'
- id: nblm-dans-un-montage-comportant-plusieurs-bou-2
  type: choix
  difficulte: 2
  enonce: Dans un montage comportant plusieurs boucles (branchement en dérivation), comment se calcule l'intensité du courant
    dans la branche principale ?
  reponse:
    options:
    - id: o1
      texte: Elle est égale à la somme des intensités dans les branches dérivées.
    - id: o2
      texte: Elle est la même dans toutes les branches dérivées.
    - id: o3
      texte: Elle est égale à la tension aux bornes du générateur.
    - id: o4
      texte: Elle est toujours égale à zéro au niveau des nœuds.
    bonnes:
    - o1
  indices:
    relance: Pense au partage du courant électrique issu du générateur lorsqu'il se sépare dans les différentes boucles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Croire que l'intensité est identique dans toutes les branches d'un montage en dérivation est une erreur classique.
  - si:
      contient:
      - o3
    relance: Attention à ne pas confondre l'intensité (en ampères) et la tension (en volts).
  - si:
      contient:
      - o4
    relance: 'Le courant ne s''annule pas aux nœuds : la quantité de courant arrivant à un nœud en repart.'
  solution: Elle est égale à la somme des intensités dans les branches dérivées. Selon la loi d'additivité des intensités,
    l'intensité totale issue de la branche principale se partage entre les branches dérivées.
- id: nblm-une-pile-de-9-v-alimente-deux-lampes-ide-3
  type: choix
  difficulte: 2
  enonce: Une pile de 9 V alimente deux lampes identiques branchées en série. Quelle est la tension aux bornes de chaque lampe
    ?
  reponse:
    options:
    - id: o1
      texte: 4,5 V aux bornes de chaque lampe.
    - id: o2
      texte: 9 V aux bornes de chaque lampe.
    - id: o3
      texte: 18 V aux bornes de chaque lampe.
    - id: o4
      texte: 0 V aux bornes de chaque lampe.
    bonnes:
    - o1
  indices:
    relance: Utilise la loi d'additivité des tensions pour un circuit en série avec deux récepteurs identiques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est l'erreur fréquente d'appliquer la loi d'unicité des tensions (valable en dérivation) à un circuit en série.
  - si:
      contient:
      - o3
    relance: La tension du générateur est divisée entre les récepteurs en série, elle ne se multiplie pas.
  - si:
      contient:
      - o4
    relance: Chaque lampe réceptrice traversée par le courant possède une tension non nulle à ses bornes.
  solution: 4,5 V aux bornes de chaque lampe. En série, la tension du générateur s'additionne (U_pile = U1 + U2). Les lampes
    étant identiques, la tension se partage équitablement (9 / 2 = 4,5 V).
- id: nblm-comment-doivent-etre-branches-un-voltmet-4
  type: choix
  difficulte: 2
  enonce: Comment doivent être branchés un voltmètre (pour mesurer une tension) et un ampèremètre (pour mesurer une intensité)
    ?
  reponse:
    options:
    - id: o1
      texte: Le voltmètre en dérivation et l'ampèremètre en série.
    - id: o2
      texte: Le voltmètre en série et l'ampèremètre en dérivation.
    - id: o3
      texte: Les deux appareils en dérivation.
    - id: o4
      texte: Les deux appareils en série.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi quel appareil mesure une différence entre deux points et lequel mesure le flux qui traverse le fil.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est l'erreur classique d'inversion des modes de branchement des appareils de mesure.
  - si:
      contient:
      - o3
    relance: L'ampèremètre doit être traversé par le courant de la boucle, il ne se branche pas en dérivation.
  - si:
      contient:
      - o4
    relance: Un voltmètre possède une résistance très élevée et bloquerait le courant s'il était placé en série.
  solution: Le voltmètre en dérivation et l'ampèremètre en série. Le voltmètre se branche aux bornes du dipôle (en dérivation)
    et l'ampèremètre s'insère dans la boucle (en série).
- id: nblm-dans-un-circuit-electrique-comment-defin-5
  type: choix
  difficulte: 2
  enonce: Dans un circuit électrique, comment définit-on un nœud ?
  reponse:
    options:
    - id: o1
      texte: Un point du circuit où se rejoignent au moins trois fils.
    - id: o2
      texte: Un composant électrique qui possède deux bornes.
    - id: o3
      texte: La partie du circuit qui contient uniquement le générateur.
    - id: o4
      texte: L'endroit du circuit où l'intensité s'annule.
    bonnes:
    - o1
  indices:
    relance: Pense aux intersections de fils dans un montage comportant plusieurs boucles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Cette description correspond à la définition d'un dipôle.
  - si:
      contient:
      - o3
    relance: Cette description correspond à la définition de la branche principale.
  - si:
      contient:
      - o4
    relance: Au niveau d'un nœud, le courant se répartit mais son intensité globale ne s'annule pas.
  solution: Un point du circuit où se rejoignent au moins trois fils. C'est la définition exacte d'un nœud, endroit où le
    courant se sépare ou se rassemble.
- id: nblm-dans-un-circuit-comportant-des-dipoles-b-6
  type: choix
  difficulte: 3
  enonce: Dans un circuit comportant des dipôles branchés en dérivation, quelles sont les deux affirmations correctes ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Des dipôles branchés en dérivation ont la même tension à leurs bornes.
    - id: o2
      texte: L'intensité dans la branche principale est égale à la somme des intensités dans les branches dérivées.
    - id: o3
      texte: La tension aux bornes du générateur est égale à la somme des tensions des autres dipôles.
    - id: o4
      texte: L'intensité du courant est obligatoirement la même dans toutes les branches.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie la loi relative à la tension et la loi relative à l'intensité pour les montages à plusieurs boucles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Il s'agit de la loi d'additivité des tensions, qui s'applique aux circuits en série et non en dérivation.
  - si:
      contient:
      - o4
    relance: 'C''est une erreur fréquente : dans un montage en dérivation, chaque branche dérivée peut avoir une intensité
      différente.'
  solution: Des dipôles branchés en dérivation ont la même tension à leurs bornes ; L'intensité dans la branche principale
    est égale à la somme des intensités dans les branches dérivées. C'est la loi d'unicité des tensions applicable aux circuits
    en dérivation.
- id: nblm-dans-un-circuit-en-derivation-la-partie-7
  type: texte_court
  difficulte: 1
  enonce: Dans un circuit en dérivation, la partie du circuit qui contient le générateur s'appelle la branche ________.
  reponse:
    acceptees:
    - principale
    fautes_tolerees: 1
  indices:
    relance: Ce terme s'oppose aux branches dites « dérivées ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: principale. Par définition, la branche d'un circuit en dérivation contenant le générateur est la branche principale.
- id: nblm-un-composant-electrique-possedant-deux-b-8
  type: texte_court
  difficulte: 1
  enonce: Un composant électrique possédant deux bornes, tel qu'une lampe ou une pile, est appelé un ________.
  reponse:
    acceptees:
    - dipôle
    fautes_tolerees: 1
  indices:
    relance: Pense au terme commençant par le préfixe désignant deux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: dipôle. Tout composant électrique muni de deux bornes de connexion s'appelle un dipôle.
