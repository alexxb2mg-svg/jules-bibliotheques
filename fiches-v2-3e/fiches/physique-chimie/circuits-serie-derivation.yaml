format: 2
notion: circuits-serie-derivation
version: 1
etat: verifiee
declencheurs:
- ampoules branchées en série
- montage en dérivation
- loi d'Ohm U égale R fois I
- additivité des tensions dans une maille
- répartition du courant entre branches
- résistor traversé par un courant
prerequis:
- formes-energie
essentiel: 'Dans un circuit en série, les dipôles sont branchés les uns à la suite des autres sur une seule boucle : l''intensité
  du courant électrique est la même en tout point du circuit.


  Dans un circuit en série, les tensions aux bornes de chaque dipôle s''additionnent pour donner la tension totale du circuit
  (loi d''additivité des tensions).


  Dans un circuit en dérivation (parallèle), chaque branche est reliée directement aux deux mêmes points : la tension est
  la même aux bornes de chaque branche (loi d''unicité des tensions), et l''intensité totale qui arrive du générateur se répartit
  entre les branches, leur somme redonnant l''intensité totale (loi d''additivité des intensités).


  La loi d''Ohm relie la tension U aux bornes d''un résistor (ou conducteur ohmique) et l''intensité I qui le traverse : U
  = R x I, avec U en volts (V), I en ampères (A) et R la résistance en ohms (Ω).


  Plus la résistance R est grande, plus il faut de tension pour faire passer la même intensité de courant (le conducteur s''oppose
  davantage au passage du courant).'
methode:
- Identifier d'abord si le circuit est en série (une seule boucle) ou en dérivation (plusieurs branches).
- 'En série : appliquer l''égalité des intensités partout, et l''addition des tensions.'
- 'En dérivation : appliquer l''égalité des tensions entre les branches, et l''addition des intensités.'
- Pour un résistor, utiliser U = R x I (ou I = U / R, ou R = U / I selon l'inconnue).
vocabulaire:
- terme: loi d'Ohm
  definition: relation U = R x I entre la tension aux bornes d'un résistor et l'intensité qui le traverse
- terme: résistance
  definition: grandeur R, en ohms, qui mesure l'opposition d'un résistor au passage du courant
erreurs_frequentes:
- Additionner les intensités dans un circuit en série (elles sont égales, pas additionnées).
- Additionner les tensions dans un circuit en dérivation (elles sont égales entre les branches).
- Oublier de convertir les unités avant d'appliquer U = R x I (kΩ en Ω, mA en A).
- Confondre résistance R (en ohms) et résistor (le composant physique).
exemple:
  enonce: Un résistor de résistance 100 Ω est traversé par un courant d'intensité 0,2 A. Calculer la tension à ses bornes.
  solution: U = R x I = 100 x 0,2 = 20 V.
exercices:
- id: intensite-depuis-loi-ohm
  type: nombre
  difficulte: 1
  enonce: Un résistor est soumis à une tension de 12 V et sa résistance vaut 60 Ω. Calcule l'intensité qui le traverse, en
    ampères.
  reponse:
    valeur: 0.2
    forme: libre
    tolerance: 0.01
  indices:
    relance: Quelle formule relie tension, résistance et intensité ?
    methode: Utilise I = U / R.
    etape: Remplace U et R par les valeurs de l'énoncé, puis effectue la division.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que tu as bien divisé la tension par la résistance, sans inverser les deux valeurs.
  solution: I = U / R = 12 / 60 = 0,2 A.
- id: tension-ampoules-serie
  type: nombre
  difficulte: 2
  enonce: Deux ampoules identiques sont branchées en série sur une pile de 6 V. La tension aux bornes de la première ampoule
    est de 3 V. Calcule la tension aux bornes de la seconde, en volts.
  reponse:
    valeur: 3
    forme: entier
    tolerance: 0.1
  indices:
    relance: Dans un circuit en série, comment les tensions de chaque dipôle se combinent-elles ?
    methode: 'Applique la loi d''additivité des tensions : la somme des tensions égale la tension totale.'
    etape: Soustrais la tension de la première ampoule à la tension totale de la pile.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: 'Reprends la loi d''additivité : tension totale égale somme des tensions de chaque dipôle en série.'
  solution: 6 moins 3 égale 3 V (les deux ampoules identiques se partagent également la tension).
- id: intensite-totale-derivation
  type: choix
  difficulte: 2
  enonce: Dans un circuit en dérivation, deux branches sont parcourues par des intensités de 0,5 A et 0,3 A. Quelle est l'intensité
    totale débitée par le générateur ?
  reponse:
    options:
    - id: a
      texte: 0,8 A
    - id: b
      texte: 0,5 A
    - id: c
      texte: 0,2 A
    bonnes:
    - a
  indices:
    relance: En dérivation, comment se combinent les intensités des différentes branches ?
    methode: 'Applique la loi d''additivité des intensités : leur somme redonne l''intensité totale.'
    etape: Additionne les deux intensités données, 0,5 A et 0,3 A.
  pieges:
  - si:
      contient:
      - b
    relance: '0,5 A est l''intensité d''une seule branche, pas l''intensité totale débitée par le générateur : il faut additionner
      les deux branches.'
  - si:
      contient:
      - c
    relance: En dérivation, les intensités des branches s'additionnent, elles ne se soustraient pas.
  solution: 0,5 plus 0,3 égale 0,8 A.
- id: definir-unicite-tension
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on la loi qui dit que la tension est la même aux bornes de chaque branche d'un circuit en dérivation
    ?
  reponse:
    acceptees:
    - loi d'unicité des tensions
    - unicité des tensions
    - loi d'unicité
    fautes_tolerees: 1
  indices:
    relance: Ce n'est pas la loi d'additivité, qui concerne l'addition d'une grandeur.
    methode: Le nom de cette loi contient le mot qui signifie « être identique, unique ».
    etape: Cette loi affirme que la tension est unique (la même) pour toutes les branches en dérivation.
  pieges:
  - si:
      valeur: loi d'additivité des tensions
    relance: La loi d'additivité des tensions concerne un circuit en série, pas l'égalité des tensions entre les branches
      en dérivation.
  solution: 'C''est la loi d''unicité des tensions : la tension est la même aux bornes de chaque branche d''un circuit en
    dérivation.'
- id: expliquer-serie-vs-derivation
  type: ouverte
  difficulte: 3
  enonce: Explique la différence entre un circuit en série et un circuit en dérivation, en précisant pour chacun ce qui est
    égal partout (intensité ou tension) et ce qui s'additionne.
  criteres:
  - L'élève explique qu'en série l'intensité est la même partout et que les tensions s'additionnent.
  - L'élève explique qu'en dérivation la tension est la même aux bornes de chaque branche et que les intensités s'additionnent.
  - L'élève relie ces différences à la structure du circuit (une seule boucle pour le série, plusieurs branches pour la dérivation).
  indices:
    relance: 'Pense à la structure physique de chaque type de circuit : une seule boucle, ou plusieurs branches séparées.'
    methode: Pour chaque type de circuit, identifie la grandeur qui est égale partout et celle qui s'additionne.
    etape: 'Commence par décrire un circuit en série : une seule boucle, dipôles les uns après les autres.'
  solution: 'Dans un circuit en série, les dipôles sont branchés les uns à la suite des autres sur une seule boucle : l''intensité
    du courant est la même en tout point, et les tensions aux bornes de chaque dipôle s''additionnent pour donner la tension
    totale. Dans un circuit en dérivation, chaque branche relie directement les deux mêmes points : la tension est la même
    aux bornes de chaque branche (loi d''unicité des tensions), et les intensités de chaque branche s''additionnent pour donner
    l''intensité totale débitée par le générateur (loi d''additivité des intensités).'
