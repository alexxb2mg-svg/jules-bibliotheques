format: 2
notion: constitution-atome-noyau
version: 1
etat: verifiee
declencheurs:
- combien de protons
- ion sodium
- ion chlorure
- nombre de masse
- charge de l'ion
- particules du noyau
prerequis:
- classification-periodique
essentiel: 'Un atome est constitué d''un noyau, très petit et très dense, entouré d''électrons qui se déplacent autour de
  lui.


  Le noyau est formé de nucléons : des protons (charge électrique positive) et des neutrons (aucune charge

  électrique, neutres). Le nombre de protons définit l''élément chimique (par exemple, tout atome de 6 protons est

  du carbone).


  Les électrons portent une charge électrique négative. Dans un atome neutre, le nombre d''électrons est égal au

  nombre de protons, ce qui rend l''atome électriquement neutre au total.


  Un ion se forme quand un atome (ou un groupe d''atomes) gagne ou perd un ou plusieurs électrons : s''il perd des

  électrons, il devient un ion positif (cation) ; s''il en gagne, il devient un ion négatif (anion).


  La charge d''un ion se calcule par la différence entre le nombre de protons (charges positives) et le nombre

  d''électrons (charges négatives).

  '
methode:
- Repérer le nombre de protons d'un atome pour identifier l'élément chimique correspondant.
- Pour un atome neutre, poser nombre d'électrons égal au nombre de protons.
- Pour un ion, comparer le nombre de protons et le nombre d'électrons donnés pour déterminer le signe et la valeur de la charge.
- 'Distinguer clairement les trois particules : le proton, positif et dans le noyau ; le neutron, neutre et dans le noyau
  ; l''électron, négatif et autour du noyau.'
vocabulaire:
- terme: nombre de masse
  definition: le nombre total de nucléons (protons + neutrons) contenus dans le noyau d'un atome
erreurs_frequentes:
- Croire que les neutrons portent une charge électrique.
- Confondre nombre de protons (qui définit l'élément) et nombre de neutrons (qui peut varier, isotopes).
- 'Se tromper de signe pour un ion : un atome qui perd des électrons devient positif, pas négatif.'
- Oublier qu'un atome non chargé (neutre) a autant d'électrons que de protons.
exemple:
  enonce: Un atome de carbone a 6 protons et 6 neutrons dans son noyau. Combien a-t-il d'électrons, sachant qu'il est neutre
    ? Quel est son nombre de masse (nombre de nucléons) ?
  solution: 'Atome neutre : 6 électrons (autant que de protons). Nombre de masse = 6 protons + 6 neutrons = 12.'
exercices:
- id: charge-ion-sodium
  type: nombre
  difficulte: 1
  enonce: L'ion sodium Na+ possède 11 protons et 10 électrons. Calculer sa charge (protons moins électrons).
  reponse:
    valeur: 1
    forme: entier
    tolerance: 0
  indices:
    relance: La charge se calcule par une soustraction entre deux nombres donnés dans l'énoncé.
    methode: Charge égale nombre de protons moins nombre d'électrons.
    etape: 11 moins 10.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Reprends la soustraction entre le nombre de protons et le nombre d'électrons, dans ce sens précis.
  solution: '11 − 10 = 1 : la charge est +1 (un excès d''une charge positive).'
- id: electrons-ion-chlorure
  type: nombre
  difficulte: 2
  enonce: L'ion chlorure Cl- possède 17 protons et porte une charge de −1. Combien a-t-il d'électrons ?
  reponse:
    valeur: 18
    forme: entier
    tolerance: 0
  indices:
    relance: Utilise la même formule que pour calculer une charge, mais en sens inverse.
    methode: Charge égale protons moins électrons ; ici la charge vaut −1.
    etape: 17 moins électrons égale −1 ; résous pour trouver le nombre d'électrons.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Résous l'équation 17 moins électrons égale −1 pas à pas pour trouver le nombre d'électrons.
  solution: 17 − électrons = −1, donc électrons = 18.
- id: atome-oxygene-neutre-ou-charge
  type: choix
  difficulte: 1
  enonce: Un atome a 8 protons, 8 neutrons et 8 électrons. Est-il neutre ou chargé électriquement ?
  reponse:
    options:
    - id: a
      texte: Il est neutre
    - id: b
      texte: Il est chargé positivement
    - id: c
      texte: Il est chargé négativement
    bonnes:
    - a
  indices:
    relance: Compare le nombre de protons et le nombre d'électrons de cet atome.
    methode: Un atome est neutre quand son nombre de protons est égal à son nombre d'électrons.
    etape: Ici, protons et électrons ont la même valeur.
  pieges:
  - si:
      contient:
      - b
    relance: Un atome chargé positivement a moins d'électrons que de protons ; ici les deux nombres sont égaux.
  - si:
      contient:
      - c
    relance: Un atome chargé négativement a plus d'électrons que de protons ; ici les deux nombres sont égaux.
  solution: '8 protons égale 8 électrons : l''atome est neutre.'
- id: nombre-masse-atome-oxygene
  type: nombre
  difficulte: 2
  enonce: Un atome a 8 protons et 8 neutrons dans son noyau. Quel est son nombre de masse (nombre total de nucléons) ?
  reponse:
    valeur: 16
    forme: entier
    tolerance: 0
  indices:
    relance: Le nombre de masse additionne deux types de particules du noyau.
    methode: Additionne le nombre de protons et le nombre de neutrons.
    etape: 8 + 8.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: N'oublie pas d'additionner les deux nombres donnés dans l'énoncé, pas d'en soustraire un.
  solution: Nombre de masse = 8 protons + 8 neutrons = 16.
- id: trois-particules-atome
  type: ouverte
  difficulte: 2
  enonce: Décris les trois particules qui constituent un atome, en précisant leur charge électrique et leur position (dans
    le noyau ou autour).
  criteres:
  - L'élève cite le proton, de charge positive, situé dans le noyau.
  - L'élève cite le neutron, sans charge électrique (neutre), situé dans le noyau.
  - L'élève cite l'électron, de charge négative, situé autour du noyau.
  indices:
    relance: Deux de ces particules se trouvent dans le noyau, une seule tourne autour.
    methode: Pense au signe de la charge électrique de chaque particule (positive, négative, ou aucune).
    etape: Le noyau regroupe des nucléons de deux types différents.
  solution: Le proton porte une charge positive et se trouve dans le noyau. Le neutron n'a pas de charge électrique et se
    trouve aussi dans le noyau. L'électron porte une charge négative et se déplace autour du noyau.
