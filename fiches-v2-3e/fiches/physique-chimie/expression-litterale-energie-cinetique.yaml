format: 2
notion: expression-litterale-energie-cinetique
version: 1
etat: verifiee
declencheurs:
- Ec égale un demi m v carré
- calculer l'énergie cinétique
- énergie d'un objet en mouvement
- choc à grande vitesse
- danger de la vitesse au volant
- doubler la vitesse d'une voiture
prerequis:
- formes-energie
essentiel: 'L''énergie cinétique est l''énergie que possède un objet du fait de son mouvement ; elle dépend de sa masse et
  de sa vitesse.


  Sa formule est Ec = 1/2 x m x v carré, avec Ec en joules (J), m la masse en kilogrammes (kg) et v la vitesse en mètres par
  seconde (m/s).


  Comme la vitesse est élevée au carré, l''énergie cinétique augmente très vite avec la vitesse : doubler la vitesse multiplie
  l''énergie cinétique par 4 (2 au carré = 4), la tripler la multiplie par 9.


  Un objet immobile (v = 0) a une énergie cinétique nulle.


  Cette relation explique pourquoi les distances de freinage augmentent beaucoup plus vite que la vitesse, et pourquoi un
  choc à grande vitesse est bien plus dangereux qu''à faible vitesse.'
methode:
- Vérifier que la masse est en kg et la vitesse en m/s avant de calculer (convertir si besoin).
- Appliquer Ec = 1/2 x m x v carré, en calculant d'abord v au carré puis en multipliant par m et par 0,5.
- Pour comparer deux énergies cinétiques à masse égale, comparer le carré des vitesses.
- Retenir que multiplier la vitesse par k multiplie l'énergie cinétique par k au carré.
vocabulaire:
- terme: énergie cinétique
  definition: énergie que possède un objet du fait de son mouvement, en joules (J)
erreurs_frequentes:
- Oublier le carré sur la vitesse (calculer 1/2 x m x v au lieu de 1/2 x m x v carré).
- Oublier le facteur 1/2 dans la formule.
- Ne pas convertir une vitesse donnée en km/h en m/s avant le calcul.
- Croire que doubler la vitesse double seulement l'énergie cinétique (elle la multiplie par 4).
exemple:
  enonce: Calculer l'énergie cinétique d'une voiture de masse 1000 kg roulant à 20 m/s.
  solution: Ec = 1/2 x 1000 x 20 au carré = 1/2 x 1000 x 400 = 200 000 J, soit 200 kJ.
exercices:
- id: ec-cycliste
  type: nombre
  difficulte: 1
  enonce: Calcule l'énergie cinétique, en joules, d'un cycliste (avec son vélo) de masse 70 kg roulant à 8 m/s.
  reponse:
    valeur: 2240
    forme: entier
    tolerance: 1
  indices:
    relance: Quelle est la formule de l'énergie cinétique ?
    methode: Utilise Ec = 1/2 x m x v au carré, avec m = 70 kg et v = 8 m/s.
    etape: Calcule d'abord 8 au carré, puis multiplie par 70, puis par 0,5.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que tu as bien élevé la vitesse au carré avant de multiplier par la masse et par 0,5.
  solution: Ec = 1/2 x 70 x 8 au carré = 1/2 x 70 x 64 = 2240 J.
- id: ec-vitesse-doublee
  type: choix
  difficulte: 2
  enonce: Une voiture roule d'abord à 10 m/s puis à 20 m/s, sa masse ne changeant pas. Par combien son énergie cinétique est-elle
    multipliée ?
  reponse:
    options:
    - id: a
      texte: par 2
    - id: b
      texte: par 4
    - id: c
      texte: par 8
    bonnes:
    - b
  indices:
    relance: L'énergie cinétique dépend du carré de la vitesse, pas de la vitesse elle-même.
    methode: Compare 20 au carré et 10 au carré.
    etape: '20 au carré vaut 400 et 10 au carré vaut 100 : quel est le rapport entre ces deux nombres ?'
  pieges:
  - si:
      contient:
      - a
    relance: Ce serait vrai si l'énergie cinétique était proportionnelle à la vitesse, mais elle dépend du carré de la vitesse.
  - si:
      contient:
      - c
    relance: 'Recalcule le rapport entre 20 au carré et 10 au carré : ce n''est pas 8.'
  solution: '20 au carré divisé par 10 au carré vaut 400 divisé par 100, soit 4 : l''énergie cinétique est multipliée par
    4.'
- id: unite-energie-cinetique
  type: texte_court
  difficulte: 1
  enonce: Dans quelle unité s'exprime l'énergie cinétique dans le système international ?
  reponse:
    acceptees:
    - joule
    - joules
    fautes_tolerees: 1
  indices:
    relance: C'est l'unité de toutes les formes d'énergie.
    methode: Elle porte le nom d'un physicien anglais, notée J.
    etape: Ce n'est ni le watt (puissance) ni le newton (force).
  pieges:
  - si:
      valeur: watt
    relance: Le watt est l'unité de la puissance, pas de l'énergie cinétique.
  solution: L'énergie cinétique s'exprime en joules (J).
- id: vitesse-depuis-ec
  type: nombre
  difficulte: 3
  enonce: Un objet de masse 2 kg a une énergie cinétique de 25 J. Quelle est sa vitesse, en m/s ?
  reponse:
    valeur: 5
    forme: entier
    tolerance: 0.1
  indices:
    relance: Comment isoler v au carré dans la formule de l'énergie cinétique ?
    methode: v au carré = 2 x Ec / m.
    etape: Calcule d'abord 2 x 25 / 2, puis prends la racine carrée du résultat.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: N'oublie pas de prendre la racine carrée après avoir calculé v au carré.
  solution: v au carré = 2 x 25 / 2 = 25, donc v = 5 m/s.
- id: expliquer-freinage
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi un choc à grande vitesse est beaucoup plus dangereux qu'un choc à faible vitesse, en t'appuyant
    sur la formule de l'énergie cinétique.
  criteres:
  - L'élève rappelle que l'énergie cinétique dépend du carré de la vitesse (Ec = 1/2 x m x v au carré).
  - L'élève explique qu'une augmentation même modérée de la vitesse entraîne une augmentation beaucoup plus grande de l'énergie
    cinétique.
  - L'élève relie cette forte augmentation d'énergie à la dangerosité accrue d'un choc à grande vitesse.
  indices:
    relance: Qu'est-ce qui rend l'énergie cinétique très sensible à la vitesse ?
    methode: Repense à ce que fait le carré dans la formule Ec = 1/2 x m x v au carré.
    etape: Commence par rappeler que l'énergie cinétique dépend du carré de la vitesse, pas simplement de la vitesse.
  solution: L'énergie cinétique dépend du carré de la vitesse (Ec = 1/2 x m x v au carré). Une augmentation même modérée de
    la vitesse entraîne donc une augmentation beaucoup plus grande de l'énergie cinétique (doubler la vitesse la multiplie
    par 4). Comme cette énergie doit être dissipée lors d'un choc, un choc à grande vitesse libère beaucoup plus d'énergie
    et est donc bien plus dangereux qu'à faible vitesse.
