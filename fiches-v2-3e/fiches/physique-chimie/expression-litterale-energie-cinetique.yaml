format: 2
notion: expression-litterale-energie-cinetique
version: 3
etat: verifiee
declencheurs:
- un demi m v carré
- vitesse au carré
- distance de freinage
- énergie quatre fois plus grande
- formule de Ec
- vitesse multipliée par deux
- énergie d'un véhicule lancé
- Ec égal un demi
prerequis:
- formes-energie
- vitesse-mouvement
essentiel: 'L''énergie cinétique est l''énergie que possède un objet parce qu''il est en mouvement. Un objet immobile a une
  énergie cinétique nulle.


  Pour un objet de masse m qui se déplace à la vitesse v :

  Ec = ½ × m × v² (on lit « un demi m v carré »)

  avec Ec en joules (J), m en kilogrammes (kg) et v en mètres par seconde (m/s).


  v² veut dire v × v. Exemple : 10² = 10 × 10 = 100. Ne confonds pas v² avec 2 × v.


  Attention aux unités : il faut convertir avant de calculer.

  - Une masse en grammes se convertit en kg : on divise par 1 000 (60 g = 0,06 kg).

  - Une vitesse en km/h se convertit en m/s : on divise par 3,6 (72 km/h = 20 m/s). Pour l''inverse, on multiplie par 3,6.


  Comment Ec change :

  - si la masse double, Ec double ;

  - si la vitesse double, Ec est multipliée par 4 ; si elle triple, par 9.


  Sur la route, plus la vitesse est grande, plus l''énergie cinétique est grande. Pour s''arrêter, les freins doivent la convertir
  en énergie thermique : la distance de freinage augmente très vite avec la vitesse.


  Un objet qui tombe perd de la hauteur (son énergie potentielle diminue) et gagne de la vitesse : son énergie cinétique augmente.


  Exemple : une voiture de 1 000 kg roule à 20 m/s. Ec = ½ × 1 000 × 20² = ½ × 1 000 × 400 = 200 000 J. Si elle roule à 40
  m/s (deux fois plus vite), Ec = ½ × 1 000 × 1 600 = 800 000 J : quatre fois plus.


  Repère utile : 36 km/h = 10 m/s et 72 km/h = 20 m/s. Deux objets de même masse n''ont la même énergie cinétique que s''ils
  ont la même vitesse.


  Au brevet : on applique la formule avec les bonnes unités, et on compare deux énergies sans tout recalculer.

  '
methode:
- Convertir la masse en kg et la vitesse en m/s.
- Calculer d'abord v² (la vitesse multipliée par elle-même).
- Multiplier par la masse, puis par ½ (ou diviser par 2).
- Écrire le résultat en joules (J).
- 'Pour comparer deux situations : regarder par combien la masse et la vitesse sont multipliées, puis utiliser « vitesse ×
  2 donne Ec × 4 ».'
- 'Pour une question de sécurité routière : relier l''énergie cinétique à l''énergie thermique que les freins doivent produire.'
vocabulaire:
- terme: énergie cinétique
  definition: Énergie que possède un objet parce qu'il est en mouvement.
- terme: joule (J)
  definition: Unité d'énergie.
- terme: masse (m)
  definition: Quantité de matière d'un objet, en kilogrammes (kg) dans la formule.
- terme: vitesse (v)
  definition: Distance parcourue par seconde, en mètres par seconde (m/s) dans la formule.
- terme: v²
  definition: v au carré, c'est-à-dire v × v.
- terme: énergie potentielle de position
  definition: Énergie liée à la hauteur d'un objet ; elle se convertit en énergie cinétique quand l'objet tombe.
- terme: distance de freinage
  definition: Distance parcourue par un véhicule entre le début du freinage et l'arrêt.
erreurs_frequentes:
- Oublier de mettre la vitesse au carré (calculer ½ × m × v).
- Oublier le facteur ½.
- Laisser la vitesse en km/h au lieu de la convertir en m/s.
- Multiplier par 3,6 au lieu de diviser pour passer des km/h aux m/s.
- Laisser la masse en grammes.
- Croire qu'une vitesse deux fois plus grande donne une énergie deux fois plus grande.
exemple:
  enonce: Un cycliste et son vélo ont une masse totale de 80 kg et roulent à 36 km/h. Calcule leur énergie cinétique.
  solution: 'On convertit : 36 ÷ 3,6 = 10 m/s. Puis Ec = ½ × 80 × 10² = ½ × 80 × 100 = 4 000 J.'
exercices:
- id: ecrire-formule-ec
  type: expression
  difficulte: 1
  enonce: Écris l'expression de l'énergie cinétique Ec en fonction de la masse m et de la vitesse v. Écris seulement l'expression,
    sans « Ec = » devant. Utilise * pour multiplier et ^ pour la puissance, par exemple m*v/3.
  reponse:
    valeur: 1/2*m*v^2
    variables:
    - m
    - v
  indices:
    relance: De quelles deux grandeurs dépend l'énergie cinétique ? Laquelle compte le plus ?
    methode: La formule contient un facteur un demi, la masse, et la vitesse élevée à une puissance. Laquelle ?
    etape: Commence par écrire le facteur 0,5 multiplié par m. Il reste à ajouter la vitesse, avec la bonne puissance.
  pieges:
  - si:
      valeur: 0,5*m*v
    relance: Il manque quelque chose sur la vitesse. Dans la formule, la vitesse est-elle seule ou élevée à une puissance
      ?
  - si:
      valeur: m*v^2
    relance: Ta formule donne une énergie deux fois trop grande. Quel facteur as-tu oublié devant m ?
  - si:
      diagnostic: non_equivalente
    relance: 'Relis ton cours : l''énergie cinétique contient un facteur un demi, la masse et la vitesse au carré.'
  solution: Ec = 1/2 × m × v^2, qu'on écrit aussi ½ m v² ou 0,5 × m × v².
- id: ec-ballon
  type: nombre
  difficulte: 1
  enonce: Un ballon de masse 0,4 kg se déplace à la vitesse de 10 m/s. Calcule son énergie cinétique en joules (J). Écris
    seulement le nombre.
  reponse:
    valeur: 20
  indices:
    relance: Quelle formule relie l'énergie cinétique, la masse et la vitesse ? Les unités sont-elles déjà les bonnes ?
    methode: Ec = ½ × m × v². Calcule d'abord v², puis multiplie par la masse, puis prends la moitié.
    etape: v² = 10 × 10 = 100. Il reste à multiplier par 0,4 puis par ½.
  pieges:
  - si:
      valeur: 2
    relance: As-tu bien mis la vitesse au carré ? Recalcule v² avant de multiplier.
  - si:
      valeur: 40
    relance: Tu as presque tout, mais as-tu oublié le facteur ½ ?
  - si:
      diagnostic: valeur_fausse
    relance: Reprends dans l'ordre, v² d'abord, puis × m, puis × ½.
  solution: Ec = ½ × 0,4 × 10² = ½ × 0,4 × 100 = 20 J.
- id: convertir-50-kmh
  type: nombre
  difficulte: 2
  enonce: Une voiture roule à 50 km/h. Convertis cette vitesse en mètres par seconde (m/s), arrondie au dixième. Écris seulement
    le nombre.
  reponse:
    valeur: 13.9
    tolerance: 0.05
  indices:
    relance: En une heure, combien de mètres parcourt la voiture, et combien y a-t-il de secondes dans une heure ?
    methode: 1 km = 1 000 m et 1 h = 3 600 s. Pour passer des km/h aux m/s, on divise par 3,6.
    etape: Calcule 50 ÷ 3,6 à la calculatrice, puis garde un seul chiffre après la virgule.
  pieges:
  - si:
      valeur: 180
    relance: Une vitesse en m/s est un nombre plus petit qu'en km/h. As-tu multiplié au lieu de diviser ?
  - si:
      valeur: 14
    relance: Ta valeur est proche, mais on demande un arrondi au dixième. Garde un chiffre après la virgule.
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie ta division : c''est la vitesse en km/h divisée par 3,6.'
  solution: v = 50 ÷ 3,6 ≈ 13,9 m/s (arrondi au dixième).
- id: vitesse-double
  type: choix
  difficulte: 2
  enonce: La vitesse d'un vélo double (sa masse ne change pas). Par combien son énergie cinétique est-elle multipliée ?
  reponse:
    options:
    - id: a
      texte: par 2
    - id: b
      texte: par 4
    - id: c
      texte: par 8
    - id: d
      texte: elle ne change pas
    bonnes:
    - b
  indices:
    relance: Dans la formule de l'énergie cinétique, comment la vitesse apparaît-elle ?
    methode: Essaie avec des nombres simples. Garde m = 2 kg, calcule Ec pour v = 1 m/s, puis pour v = 2 m/s, et compare.
    etape: Pour v = 1 m/s, v² vaut 1. Calcule v² pour v = 2 m/s, et compare les deux.
  pieges:
  - si:
      contient:
      - a
    relance: Ce serait vrai si l'énergie dépendait de v tout court. Mais dans la formule, la vitesse est au carré. Essaie
      avec des nombres.
  - si:
      contient:
      - c
    relance: La vitesse est au carré, pas au cube. Recalcule en essayant avec v = 1 puis v = 2.
  - si:
      contient:
      - d
    relance: L'énergie cinétique dépend de la vitesse. Si la vitesse change, l'énergie peut-elle rester la même ?
  solution: 'Ec = ½ × m × v². Si v devient 2v, v² devient (2v)² = 4v² : l''énergie cinétique est multipliée par 4.'
- id: ec-balle-tennis
  type: nombre
  difficulte: 2
  enonce: Une balle de tennis de masse 60 g est lancée à la vitesse de 30 m/s. Calcule son énergie cinétique en joules (J).
    Écris seulement le nombre.
  reponse:
    valeur: 27
  indices:
    relance: La masse est-elle dans l'unité qu'exige la formule ?
    methode: Convertis la masse en kg (divise par 1 000), puis applique Ec = ½ × m × v².
    etape: 60 g = 0,06 kg et v² = 30 × 30 = 900. Il reste à multiplier 0,06 par 900, puis par ½.
  pieges:
  - si:
      valeur: 27000
    relance: Tu as gardé la masse en grammes. Convertis-la en kilogrammes.
  - si:
      valeur: 54
    relance: As-tu oublié le facteur ½ ?
  - si:
      diagnostic: valeur_fausse
    relance: 'Reprends dans l''ordre : masse en kg, puis v², puis × m, puis × ½.'
  solution: m = 60 g = 0,06 kg. Ec = ½ × 0,06 × 30² = ½ × 0,06 × 900 = 27 J.
- id: ec-voiture-72
  type: nombre
  difficulte: 3
  enonce: Une voiture de masse 1 000 kg roule à 72 km/h. Calcule son énergie cinétique en joules (J). Écris seulement le nombre.
  reponse:
    valeur: 200000
  indices:
    relance: La vitesse est-elle dans la bonne unité pour utiliser la formule ?
    methode: Convertis d'abord la vitesse en m/s (divise par 3,6), puis applique Ec = ½ × m × v².
    etape: 'Première étape : 72 ÷ 3,6 = 20 m/s. Calcule maintenant v², puis Ec.'
  pieges:
  - si:
      valeur: 2592000
    relance: Tu as utilisé la vitesse en km/h. Convertis-la d'abord en m/s.
  - si:
      valeur: 10000
    relance: As-tu bien mis la vitesse au carré ?
  - si:
      valeur: 400000
    relance: As-tu oublié le facteur ½ ?
  - si:
      diagnostic: valeur_fausse
    relance: Reprends dans l'ordre, conversion en m/s, puis v², puis × m, puis × ½.
  solution: v = 72 ÷ 3,6 = 20 m/s. Ec = ½ × 1 000 × 20² = ½ × 1 000 × 400 = 200 000 J.
- id: vitesse-triple
  type: nombre
  difficulte: 3
  enonce: Un objet a une énergie cinétique de 50 J. Sa vitesse triple, sa masse ne change pas. Quelle est sa nouvelle énergie
    cinétique, en joules (J) ? Écris seulement le nombre.
  reponse:
    valeur: 450
  indices:
    relance: Dans la formule, comment la vitesse apparaît-elle ? Que devient v² quand v triple ?
    methode: Si v devient 3v, alors v² devient (3v)² = 9v². Compare avec ce qui se passe quand la vitesse double.
    etape: L'énergie cinétique est multipliée par le même nombre que v². Multiplie 50 J par ce nombre.
  pieges:
  - si:
      valeur: 150
    relance: Tu as multiplié par 3. Mais la vitesse est au carré dans la formule.
  - si:
      valeur: 100
    relance: Ce serait la vitesse doublée au lieu de triplée, avec un facteur 2 au lieu de 4. Recompte.
  - si:
      diagnostic: valeur_fausse
    relance: 'Vitesse × 3 : v² devient 3² fois plus grand. Multiplie 50 J par ce facteur.'
  solution: Ec = ½ × m × v². Si v devient 3v, v² est multiplié par 3² = 9. La nouvelle énergie vaut 50 × 9 = 450 J.
- id: danger-vitesse
  type: ouverte
  difficulte: 3
  enonce: Une voiture de 1 000 kg roule d'abord à 50 km/h, puis à 100 km/h. En t'appuyant sur la formule de l'énergie cinétique,
    explique pourquoi la distance de freinage est beaucoup plus longue à 100 km/h.
  criteres:
  - L'élève utilise Ec = ½ × m × v² et remarque que la vitesse est au carré.
  - L'élève montre que la vitesse double donc que l'énergie cinétique est multipliée par 4 (calcul ou raisonnement).
  - L'élève relie une énergie cinétique plus grande à une distance de freinage plus longue (les freins doivent faire disparaître
    toute cette énergie cinétique en la convertissant en énergie thermique).
  indices:
    relance: Par combien la vitesse est-elle multipliée entre les deux situations ? Et l'énergie cinétique ?
    methode: Compare les deux énergies cinétiques, avec un calcul ou avec la règle sur le carré de la vitesse. Puis dis ce
      que doivent faire les freins de cette énergie.
    etape: 'La vitesse passe de 50 à 100 km/h : elle double. Dans la formule, v est au carré. Que devient Ec ?'
  solution: 'La vitesse double (de 50 à 100 km/h). Comme Ec = ½ × m × v², l''énergie cinétique est multipliée par 2² = 4 (environ
    96 000 J à 50 km/h et 386 000 J à 100 km/h). Pour s''arrêter, les freins doivent convertir toute cette énergie en énergie
    thermique : avec quatre fois plus d''énergie, il faut une distance de freinage bien plus longue (environ quatre fois plus
    longue).'
- id: nblm-quelle-est-l-expression-litterale-de-la-1
  type: choix
  difficulte: 2
  enonce: Quelle est l'expression littérale de la formule de Ec (l'énergie cinétique) pour un objet de masse m et de vitesse
    v ?
  reponse:
    options:
    - id: o1
      texte: Ec = ½ × m × v²
    - id: o2
      texte: Ec = m × v²
    - id: o3
      texte: Ec = ½ × m × v
    - id: o4
      texte: Ec = m × v
    bonnes:
    - o1
  indices:
    relance: 'Pense aux deux éléments fondamentaux : le facteur un demi et le carré de la vitesse.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Incorrect. C'est l'erreur classique d'oublier le facteur un demi (½).
  - si:
      contient:
      - o3
    relance: Incorrect. C'est l'erreur fréquente d'oublier de mettre la vitesse au carré.
  - si:
      contient:
      - o4
    relance: Incorrect. Cette formule oublie à la fois le coefficient un demi et le carré de la vitesse.
  solution: Ec = ½ × m × v². C'est exact. La formule de Ec s'écrit un demi m v carré (½ × m × v²).
- id: nblm-si-la-vitesse-d-un-vehicule-est-doublee-2
  type: choix
  difficulte: 2
  enonce: Si la vitesse d'un véhicule est doublée, que devient son énergie cinétique ?
  reponse:
    options:
    - id: o1
      texte: L'énergie devient quatre fois plus grande.
    - id: o2
      texte: L'énergie double également.
    - id: o3
      texte: L'énergie reste identique.
    - id: o4
      texte: L'énergie est multipliée par huit.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'influence de la vitesse au carré dans le calcul.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect. C''est une erreur courante : la vitesse étant au carré, l''énergie n''est pas simplement doublée.'
  - si:
      contient:
      - o3
    relance: Incorrect. L'énergie cinétique varie fortement avec la vitesse.
  - si:
      contient:
      - o4
    relance: Incorrect. La vitesse étant au carré, le facteur multiplicateur est 2² = 4, et non 8.
  solution: L'énergie devient quatre fois plus grande. Exact. Comme la vitesse est élevée au carré (2² = 4), doubler la vitesse
    donne une énergie quatre fois plus grande.
- id: nblm-quel-est-l-effet-de-l-augmentation-de-l-3
  type: choix
  difficulte: 2
  enonce: Quel est l'effet de l'augmentation de l'énergie cinétique sur la distance de freinage d'un véhicule ?
  reponse:
    options:
    - id: o1
      texte: La distance de freinage augmente car le véhicule doit perdre toute son énergie cinétique pour s'arrêter.
    - id: o2
      texte: La distance de freinage diminue car les freins deviennent plus efficaces à grande vitesse.
    - id: o3
      texte: La distance de freinage reste strictement identique quelle que soit la vitesse.
    - id: o4
      texte: La distance de freinage dépend uniquement de la masse, pas de l'énergie cinétique.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au lien entre l'énergie à dissiper lors du freinage et la trajectoire d'arrêt du véhicule.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Incorrect. L'efficacité des freins ne permet pas de réduire la distance de freinage si l'énergie à dissiper est
      plus élevée.
  - si:
      contient:
      - o3
    relance: Incorrect. La vitesse influe directement sur l'énergie cinétique et donc sur la distance nécessaire pour s'arrêter.
  - si:
      contient:
      - o4
    relance: Incorrect. L'énergie cinétique dépend à la fois de la masse et de la vitesse, et conditionne le freinage.
  solution: La distance de freinage augmente car le véhicule doit perdre toute son énergie cinétique pour s'arrêter. Exact.
    Plus l'énergie cinétique est grande, plus la distance de freinage nécessaire pour l'éliminer est longue.
- id: nblm-dans-la-formule-de-ec-quelles-sont-les-u-4
  type: choix
  difficulte: 2
  enonce: Dans la formule de Ec, quelles sont les unités légales du Système international pour la masse, la vitesse et l'énergie
    ?
  reponse:
    options:
    - id: o1
      texte: Masse en kg, vitesse en m/s, énergie en joules (J).
    - id: o2
      texte: Masse en g, vitesse en km/h, énergie en joules (J).
    - id: o3
      texte: Masse en kg, vitesse en km/h, énergie en watts (W).
    - id: o4
      texte: Masse en kg, vitesse en m/s, énergie en kilowattheures (kWh).
    bonnes:
    - o1
  indices:
    relance: Utilise le kilogramme, le mètre par seconde et le joule.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Incorrect. Laisser la masse en grammes ou la vitesse en km/h est une erreur de conversion classique.
  - si:
      contient:
      - o3
    relance: Incorrect. Le watt est une unité de puissance et la vitesse doit être exprimée en m/s.
  - si:
      contient:
      - o4
    relance: Incorrect. Bien que le kWh mesure l'énergie électrique, l'unité légale dans cette formule mécanique est le joule.
  solution: Masse en kg, vitesse en m/s, énergie en joules (J). Exact. Ce sont les trois unités obligatoires pour appliquer
    correctement la formule.
- id: nblm-quelle-methode-permet-de-convertir-une-v-5
  type: choix
  difficulte: 2
  enonce: Quelle méthode permet de convertir une vitesse exprimée en km/h afin de l'utiliser dans le calcul de Ec ?
  reponse:
    options:
    - id: o1
      texte: Diviser la vitesse en km/h par 3,6.
    - id: o2
      texte: Multiplier la vitesse en km/h par 3,6.
    - id: o3
      texte: Diviser la vitesse en km/h par 1 000.
    - id: o4
      texte: Multiplier la vitesse en km/h par 60.
    bonnes:
    - o1
  indices:
    relance: N'oublie pas le coefficient 3,6 et le sens de la conversion (de km/h vers m/s).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect. C''est l''erreur fréquente : multiplier par 3,6 permet de passer des m/s aux km/h.'
  - si:
      contient:
      - o3
    relance: Incorrect. La division par 1 000 s'applique à la conversion des grammes en kilogrammes.
  - si:
      contient:
      - o4
    relance: Incorrect. Le facteur 60 sert pour les conversions de minutes en secondes, pas pour les km/h en m/s.
  solution: 'Diviser la vitesse en km/h par 3,6. Exact. Pour convertir des km/h en m/s, il faut diviser par 3,6 (par exemple
    : 36 km/h ÷ 3,6 = 10 m/s).'
- id: nblm-quelles-sont-les-deux-erreurs-classiques-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX erreurs classiques à éviter lors du calcul de l'énergie cinétique ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Oublier d'élever la vitesse au carré.
    - id: o2
      texte: Garder la vitesse en km/h au lieu de la convertir en m/s.
    - id: o3
      texte: Exprimer le résultat du calcul de l'énergie en joules (J).
    - id: o4
      texte: Convertir une masse donnée en grammes vers des kilogrammes.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux pièges fréquents liés au carré de la vitesse et à ses unités.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Incorrect. Le joule est l'unité exacte et obligatoire pour l'énergie cinétique.
  - si:
      contient:
      - o4
    relance: Incorrect. Convertir les grammes en kilogrammes est une étape correcte et indispensable.
  solution: Oublier d'élever la vitesse au carré ; Garder la vitesse en km/h au lieu de la convertir en m/s. Exact. Calculer
    ½ × m × v au lieu de ½ × m × v² est une erreur très fréquente.
- id: nblm-dans-le-systeme-international-quelle-est-7
  type: texte_court
  difficulte: 1
  enonce: Dans le Système international, quelle est l'unité légale de l'énergie cinétique Ec ?
  reponse:
    acceptees:
    - joule
    fautes_tolerees: 1
  indices:
    relance: Cette unité est représentée par la lettre majuscule J.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: joule. Le joule (symbole J) est l'unité légale de mesure de toutes les formes d'énergie, y compris l'énergie cinétique.
- id: nblm-si-la-masse-d-un-objet-en-mouvement-est-8
  type: texte_court
  difficulte: 1
  enonce: 'Si la masse d''un objet en mouvement est doublée sans modifier sa vitesse, son énergie cinétique va :'
  reponse:
    acceptees:
    - doubler
    fautes_tolerees: 1
  indices:
    relance: Dans la formule, la masse n'est pas au carré, contrairement à la vitesse.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: doubler. L'énergie cinétique est directement proportionnelle à la masse m. Si m double, Ec double aussi.
