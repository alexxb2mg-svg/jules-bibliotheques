format: 2
notion: expression-litterale-energie-cinetique
version: 2
etat: generee
declencheurs:
- un demi m v carré
- vitesse au carré
- distance de freinage
- énergie quatre fois plus grande
- formule de Ec
- vitesse multipliée par deux
- énergie d'un véhicule lancé
- Ec égal un demi
prerequis:
- formes-energie
- vitesse-mouvement
essentiel: |
  L'énergie cinétique est l'énergie que possède un objet parce qu'il est en mouvement. Un objet immobile a une énergie cinétique nulle.

  Pour un objet de masse m qui se déplace à la vitesse v :
  Ec = ½ × m × v² (on lit « un demi m v carré »)
  avec Ec en joules (J), m en kilogrammes (kg) et v en mètres par seconde (m/s).

  v² veut dire v × v. Exemple : 10² = 10 × 10 = 100. Ne confonds pas v² avec 2 × v.

  Attention aux unités : il faut convertir avant de calculer.
  - Une masse en grammes se convertit en kg : on divise par 1 000 (60 g = 0,06 kg).
  - Une vitesse en km/h se convertit en m/s : on divise par 3,6 (72 km/h = 20 m/s). Pour l'inverse, on multiplie par 3,6.

  Comment Ec change :
  - si la masse double, Ec double ;
  - si la vitesse double, Ec est multipliée par 4 ; si elle triple, par 9.

  Sur la route, plus la vitesse est grande, plus l'énergie cinétique est grande. Pour s'arrêter, les freins doivent la convertir en énergie thermique : la distance de freinage augmente très vite avec la vitesse.

  Un objet qui tombe perd de la hauteur (son énergie potentielle diminue) et gagne de la vitesse : son énergie cinétique augmente.

  Exemple : une voiture de 1 000 kg roule à 20 m/s. Ec = ½ × 1 000 × 20² = ½ × 1 000 × 400 = 200 000 J. Si elle roule à 40 m/s (deux fois plus vite), Ec = ½ × 1 000 × 1 600 = 800 000 J : quatre fois plus.

  Repère utile : 36 km/h = 10 m/s et 72 km/h = 20 m/s. Deux objets de même masse n'ont la même énergie cinétique que s'ils ont la même vitesse.

  Au brevet : on applique la formule avec les bonnes unités, et on compare deux énergies sans tout recalculer.
methode:
- Convertir la masse en kg et la vitesse en m/s.
- Calculer d'abord v² (la vitesse multipliée par elle-même).
- Multiplier par la masse, puis par ½ (ou diviser par 2).
- Écrire le résultat en joules (J).
- 'Pour comparer deux situations : regarder par combien la masse et la vitesse sont multipliées, puis utiliser « vitesse × 2 donne Ec × 4 ».'
- 'Pour une question de sécurité routière : relier l''énergie cinétique à l''énergie thermique que les freins doivent produire.'
vocabulaire:
- terme: énergie cinétique
  definition: Énergie que possède un objet parce qu'il est en mouvement.
- terme: joule (J)
  definition: Unité d'énergie.
- terme: masse (m)
  definition: Quantité de matière d'un objet, en kilogrammes (kg) dans la formule.
- terme: vitesse (v)
  definition: Distance parcourue par seconde, en mètres par seconde (m/s) dans la formule.
- terme: v²
  definition: v au carré, c'est-à-dire v × v.
- terme: énergie potentielle de position
  definition: Énergie liée à la hauteur d'un objet ; elle se convertit en énergie cinétique quand l'objet tombe.
- terme: distance de freinage
  definition: Distance parcourue par un véhicule entre le début du freinage et l'arrêt.
erreurs_frequentes:
- Oublier de mettre la vitesse au carré (calculer ½ × m × v).
- Oublier le facteur ½.
- Laisser la vitesse en km/h au lieu de la convertir en m/s.
- Multiplier par 3,6 au lieu de diviser pour passer des km/h aux m/s.
- Laisser la masse en grammes.
- Croire qu'une vitesse deux fois plus grande donne une énergie deux fois plus grande.
exemple:
  enonce: Un cycliste et son vélo ont une masse totale de 80 kg et roulent à 36 km/h. Calcule leur énergie cinétique.
  solution: 'On convertit : 36 ÷ 3,6 = 10 m/s. Puis Ec = ½ × 80 × 10² = ½ × 80 × 100 = 4 000 J.'
exercices:
- id: ecrire-formule-ec
  type: expression
  difficulte: 1
  enonce: Écris l'expression de l'énergie cinétique Ec en fonction de la masse m et de la vitesse v. Écris seulement l'expression, sans « Ec = » devant. Utilise * pour multiplier et ^ pour la puissance, par exemple m*v/3.
  reponse:
    valeur: 1/2*m*v^2
    variables:
    - m
    - v
  indices:
    relance: De quelles deux grandeurs dépend l'énergie cinétique ? Laquelle compte le plus ?
    methode: La formule contient un facteur un demi, la masse, et la vitesse élevée à une puissance. Laquelle ?
    etape: Commence par écrire le facteur 0,5 multiplié par m. Il reste à ajouter la vitesse, avec la bonne puissance.
  pieges:
  - si:
      valeur: 0,5*m*v
    relance: Il manque quelque chose sur la vitesse. Dans la formule, la vitesse est-elle seule ou élevée à une puissance ?
  - si:
      valeur: m*v^2
    relance: Ta formule donne une énergie deux fois trop grande. Quel facteur as-tu oublié devant m ?
  - si:
      diagnostic: non_equivalente
    relance: 'Relis ton cours : l''énergie cinétique contient un facteur un demi, la masse et la vitesse au carré.'
  solution: Ec = 1/2 × m × v^2, qu'on écrit aussi ½ m v² ou 0,5 × m × v².
- id: ec-ballon
  type: nombre
  difficulte: 1
  enonce: Un ballon de masse 0,4 kg se déplace à la vitesse de 10 m/s. Calcule son énergie cinétique en joules (J). Écris seulement le nombre.
  reponse:
    valeur: 20
  indices:
    relance: Quelle formule relie l'énergie cinétique, la masse et la vitesse ? Les unités sont-elles déjà les bonnes ?
    methode: Ec = ½ × m × v². Calcule d'abord v², puis multiplie par la masse, puis prends la moitié.
    etape: v² = 10 × 10 = 100. Il reste à multiplier par 0,4 puis par ½.
  pieges:
  - si:
      valeur: 2
    relance: As-tu bien mis la vitesse au carré ? Recalcule v² avant de multiplier.
  - si:
      valeur: 40
    relance: Tu as presque tout, mais as-tu oublié le facteur ½ ?
  - si:
      diagnostic: valeur_fausse
    relance: Reprends dans l'ordre, v² d'abord, puis × m, puis × ½.
  solution: Ec = ½ × 0,4 × 10² = ½ × 0,4 × 100 = 20 J.
- id: convertir-50-kmh
  type: nombre
  difficulte: 2
  enonce: Une voiture roule à 50 km/h. Convertis cette vitesse en mètres par seconde (m/s), arrondie au dixième. Écris seulement le nombre.
  reponse:
    valeur: 13.9
    tolerance: 0.05
  indices:
    relance: En une heure, combien de mètres parcourt la voiture, et combien y a-t-il de secondes dans une heure ?
    methode: 1 km = 1 000 m et 1 h = 3 600 s. Pour passer des km/h aux m/s, on divise par 3,6.
    etape: Calcule 50 ÷ 3,6 à la calculatrice, puis garde un seul chiffre après la virgule.
  pieges:
  - si:
      valeur: 180
    relance: Une vitesse en m/s est un nombre plus petit qu'en km/h. As-tu multiplié au lieu de diviser ?
  - si:
      valeur: 14
    relance: Ta valeur est proche, mais on demande un arrondi au dixième. Garde un chiffre après la virgule.
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie ta division : c''est la vitesse en km/h divisée par 3,6.'
  solution: v = 50 ÷ 3,6 ≈ 13,9 m/s (arrondi au dixième).
- id: vitesse-double
  type: choix
  difficulte: 2
  enonce: La vitesse d'un vélo double (sa masse ne change pas). Par combien son énergie cinétique est-elle multipliée ?
  reponse:
    options:
    - id: a
      texte: par 2
    - id: b
      texte: par 4
    - id: c
      texte: par 8
    - id: d
      texte: elle ne change pas
    bonnes:
    - b
  indices:
    relance: Dans la formule de l'énergie cinétique, comment la vitesse apparaît-elle ?
    methode: Essaie avec des nombres simples. Garde m = 2 kg, calcule Ec pour v = 1 m/s, puis pour v = 2 m/s, et compare.
    etape: Pour v = 1 m/s, v² vaut 1. Calcule v² pour v = 2 m/s, et compare les deux.
  pieges:
  - si:
      contient:
      - a
    relance: Ce serait vrai si l'énergie dépendait de v tout court. Mais dans la formule, la vitesse est au carré. Essaie avec des nombres.
  - si:
      contient:
      - c
    relance: La vitesse est au carré, pas au cube. Recalcule en essayant avec v = 1 puis v = 2.
  - si:
      contient:
      - d
    relance: L'énergie cinétique dépend de la vitesse. Si la vitesse change, l'énergie peut-elle rester la même ?
  solution: 'Ec = ½ × m × v². Si v devient 2v, v² devient (2v)² = 4v² : l''énergie cinétique est multipliée par 4.'
- id: ec-balle-tennis
  type: nombre
  difficulte: 2
  enonce: Une balle de tennis de masse 60 g est lancée à la vitesse de 30 m/s. Calcule son énergie cinétique en joules (J). Écris seulement le nombre.
  reponse:
    valeur: 27
  indices:
    relance: La masse est-elle dans l'unité qu'exige la formule ?
    methode: Convertis la masse en kg (divise par 1 000), puis applique Ec = ½ × m × v².
    etape: 60 g = 0,06 kg et v² = 30 × 30 = 900. Il reste à multiplier 0,06 par 900, puis par ½.
  pieges:
  - si:
      valeur: 27000
    relance: Tu as gardé la masse en grammes. Convertis-la en kilogrammes.
  - si:
      valeur: 54
    relance: As-tu oublié le facteur ½ ?
  - si:
      diagnostic: valeur_fausse
    relance: 'Reprends dans l''ordre : masse en kg, puis v², puis × m, puis × ½.'
  solution: m = 60 g = 0,06 kg. Ec = ½ × 0,06 × 30² = ½ × 0,06 × 900 = 27 J.
- id: ec-voiture-72
  type: nombre
  difficulte: 3
  enonce: Une voiture de masse 1 000 kg roule à 72 km/h. Calcule son énergie cinétique en joules (J). Écris seulement le nombre.
  reponse:
    valeur: 200000
  indices:
    relance: La vitesse est-elle dans la bonne unité pour utiliser la formule ?
    methode: Convertis d'abord la vitesse en m/s (divise par 3,6), puis applique Ec = ½ × m × v².
    etape: 'Première étape : 72 ÷ 3,6 = 20 m/s. Calcule maintenant v², puis Ec.'
  pieges:
  - si:
      valeur: 2592000
    relance: Tu as utilisé la vitesse en km/h. Convertis-la d'abord en m/s.
  - si:
      valeur: 10000
    relance: As-tu bien mis la vitesse au carré ?
  - si:
      valeur: 400000
    relance: As-tu oublié le facteur ½ ?
  - si:
      diagnostic: valeur_fausse
    relance: Reprends dans l'ordre, conversion en m/s, puis v², puis × m, puis × ½.
  solution: v = 72 ÷ 3,6 = 20 m/s. Ec = ½ × 1 000 × 20² = ½ × 1 000 × 400 = 200 000 J.
- id: vitesse-triple
  type: nombre
  difficulte: 3
  enonce: Un objet a une énergie cinétique de 50 J. Sa vitesse triple, sa masse ne change pas. Quelle est sa nouvelle énergie cinétique, en joules (J) ? Écris seulement le nombre.
  reponse:
    valeur: 450
  indices:
    relance: Dans la formule, comment la vitesse apparaît-elle ? Que devient v² quand v triple ?
    methode: Si v devient 3v, alors v² devient (3v)² = 9v². Compare avec ce qui se passe quand la vitesse double.
    etape: L'énergie cinétique est multipliée par le même nombre que v². Multiplie 50 J par ce nombre.
  pieges:
  - si:
      valeur: 150
    relance: Tu as multiplié par 3. Mais la vitesse est au carré dans la formule.
  - si:
      valeur: 100
    relance: Ce serait la vitesse doublée au lieu de triplée, avec un facteur 2 au lieu de 4. Recompte.
  - si:
      diagnostic: valeur_fausse
    relance: 'Vitesse × 3 : v² devient 3² fois plus grand. Multiplie 50 J par ce facteur.'
  solution: Ec = ½ × m × v². Si v devient 3v, v² est multiplié par 3² = 9. La nouvelle énergie vaut 50 × 9 = 450 J.
- id: danger-vitesse
  type: ouverte
  difficulte: 3
  enonce: Une voiture de 1 000 kg roule d'abord à 50 km/h, puis à 100 km/h. En t'appuyant sur la formule de l'énergie cinétique, explique pourquoi la distance de freinage est beaucoup plus longue à 100 km/h.
  criteres:
  - L'élève utilise Ec = ½ × m × v² et remarque que la vitesse est au carré.
  - L'élève montre que la vitesse double donc que l'énergie cinétique est multipliée par 4 (calcul ou raisonnement).
  - L'élève relie une énergie cinétique plus grande à une distance de freinage plus longue (les freins doivent faire disparaître toute cette énergie cinétique en la convertissant en énergie thermique).
  indices:
    relance: Par combien la vitesse est-elle multipliée entre les deux situations ? Et l'énergie cinétique ?
    methode: Compare les deux énergies cinétiques, avec un calcul ou avec la règle sur le carré de la vitesse. Puis dis ce que doivent faire les freins de cette énergie.
    etape: 'La vitesse passe de 50 à 100 km/h : elle double. Dans la formule, v est au carré. Que devient Ec ?'
  solution: 'La vitesse double (de 50 à 100 km/h). Comme Ec = ½ × m × v², l''énergie cinétique est multipliée par 2² = 4 (environ 96 000 J à 50 km/h et 386 000 J à 100 km/h). Pour s''arrêter, les freins doivent convertir toute cette énergie en énergie thermique : avec quatre fois plus d''énergie, il faut une distance de freinage bien plus longue (environ quatre fois plus longue).'
