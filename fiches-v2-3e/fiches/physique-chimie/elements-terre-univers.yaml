  - si:
      contient:
      - o4
    relance: 'Faux : une fois dispersés dans l''environnement ou les déchets, les atomes sont extrêmement difficiles à récupérer.'
  solution: 'L''hydrogène et l''hélium représentent environ 98 % de la masse des atomes de l''Univers ; L''oxygène et le silicium
    sont les deux éléments les plus abondants dans la croûte terrestre. C''est exact : l''hydrogène (74 %) et l''hélium (24
    %) constituent ensemble 98 % de la masse atomique de l''Univers.'
- id: nblm-quel-est-le-nom-de-l-evenement-initial-s-7
  type: texte_court
  difficulte: 1
  enonce: Quel est le nom de l'événement initial survenu il y a 13,8 milliards d'années d'où l'Univers a évolué ?
  reponse:
