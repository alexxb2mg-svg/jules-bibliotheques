  indices:
    relance: Vérifie les pourcentages d'abondance dans l'Univers d'une part, et dans la croûte terrestre d'autre part.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : seuls les éléments légers viennent du Big Bang ; les éléments lourds ont été fabriqués ensuite au cœur
