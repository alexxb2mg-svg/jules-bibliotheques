  reponse:
    options:
    - id: o1
      texte: L'hydrogène et l'hélium représentent environ 98 % de la masse des atomes de l'Univers.
    - id: o2
      texte: L'oxygène et le silicium sont les deux éléments les plus abondants dans la croûte terrestre.
    - id: o3
      texte: Tous les éléments chimiques de l'Univers ont été créés au moment du Big Bang.
