# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: elements-terre-univers
version: 1
etat: verifiee
declencheurs:
- big bang
- poussières d'étoiles
- terres rares
- éléments lourds
- d'où viennent les atomes
- abondance des éléments
prerequis:
- classification-periodique
- structure-univers-systeme-solaire
essentiel: 'La matière observable est partout de même nature : sur Terre, dans le Soleil et dans les étoiles lointaines, on
  retrouve les mêmes éléments chimiques (les mêmes sortes d''atomes), et ils obéissent partout aux mêmes lois. On le sait
  en analysant la lumière des étoiles.


  Origine de la matière :

  - juste après le Big Bang (il y a environ 13,8 milliards d''années), seuls les éléments les plus légers se forment : surtout
  l''hydrogène et l''hélium ;

  - les éléments plus lourds (carbone, oxygène, silicium, fer…) sont fabriqués plus tard, au cœur des étoiles, par fusion
  de noyaux légers ;

  - à la fin de leur vie, les étoiles dispersent ces éléments dans l''espace ; de nouvelles étoiles et des planètes, comme
  le Soleil et la Terre, se forment à partir de ce nuage enrichi. Les atomes de notre corps ont donc été fabriqués dans des
  étoiles.


  Abondance des éléments :

  - dans l''Univers : l''hydrogène (environ 74 % de la masse des atomes) et l''hélium (environ 24 %) dominent ; tous les autres
  éléments réunis ne font que 2 % environ ;

  - dans la croûte terrestre : l''oxygène (environ 46 % en masse) et le silicium (environ 28 %) dominent, puis l''aluminium
  et le fer ; le noyau de la Terre est surtout fait de fer ;

  - l''hélium est très rare sur Terre, et l''hydrogène s''y trouve surtout combiné (dans l''eau, par exemple).


  Les ressources terrestres en éléments sont limitées et inégalement réparties. Certains métaux rares, comme les terres rares
  (utilisées dans les aimants d''éoliennes, les téléphones, les écrans), sont extraits en petites quantités, souvent avec
  une forte pollution : il faut les économiser et les recycler.

  '
methode:
- 'Se demander où l''on se place : dans tout l''Univers, ou seulement sur Terre (croûte terrestre) ? Les éléments abondants
  ne sont pas les mêmes.'
- 'Classer l''élément : léger (hydrogène, hélium, formés après le Big Bang) ou lourd (fabriqué dans les étoiles) ?'
- 'Pour une ressource, se demander : est-elle abondante ou rare sur Terre ? Se renouvelle-t-elle à l''échelle d''une vie humaine
  ? Peut-on la recycler ?'
vocabulaire:
- terme: élément chimique
  definition: Ensemble des atomes de même sorte (même nombre de protons), qu'ils soient seuls ou dans des molécules et des
    ions.
- terme: Big Bang
  definition: Nom donné à l'état très chaud et très dense d'où l'Univers a évolué, il y a environ 13,8 milliards d'années.
- terme: terres rares
  definition: Groupe de métaux utilisés dans les technologies modernes (aimants, écrans), extraits en petites quantités.
erreurs_frequentes:
- 'Croire que l''oxygène est l''élément le plus abondant de l''Univers : c''est vrai pour la croûte terrestre, pas pour l''Univers.'
- 'Penser que la matière des étoiles est différente de celle de la Terre : ce sont les mêmes éléments chimiques.'
- 'Croire que tous les éléments sont apparus au moment du Big Bang : les éléments lourds ont été fabriqués ensuite dans les
  étoiles.'
- 'Penser que les ressources en éléments sont inépuisables parce que les atomes ne disparaissent pas : une fois dispersés,
  ils sont très difficiles à récupérer.'
exemple:
  enonce: Le fer de notre sang existait-il au moment du Big Bang ?
  solution: Non. Juste après le Big Bang, seuls les éléments les plus légers se sont formés. Le fer, élément lourd, a été
    fabriqué plus tard au cœur d'étoiles massives, puis dispersé dans l'espace à leur mort, avant de se retrouver dans le
    nuage qui a donné le système solaire.
exercices:
- id: elements-du-big-bang
  type: choix
  difficulte: 1
  enonce: Quels éléments chimiques se sont formés en premier, juste après le Big Bang ?
  reponse:
    options:
    - id: a
      texte: l'hydrogène
    - id: b
      texte: l'hélium
    - id: c
      texte: le fer
    - id: d
      texte: le carbone
    - id: e
      texte: l'oxygène
    bonnes:
    - a
    - b
  indices:
    relance: Juste après le Big Bang, seuls les noyaux les plus simples et les plus légers ont pu se former. Lesquels sont
      les plus légers ?
    methode: 'Regarde le début de la classification périodique : les tout premiers éléments sont les plus légers.'
    etape: Le fer, le carbone et l'oxygène ont été fabriqués bien plus tard, au cœur des étoiles. Que reste-t-il ?
  pieges:
  - si:
      contient:
      - c
    relance: Le fer est un élément lourd. Où les éléments lourds ont-ils été fabriqués ?
  - si:
      contient:
      - d
    relance: Le carbone de ton corps a été fabriqué dans une étoile. Les étoiles existaient-elles juste après le Big Bang
      ?
  - si:
      contient:
      - e
    relance: L'oxygène est abondant sur Terre, mais c'est un élément assez lourd. Où a-t-il été fabriqué ?
  - si:
      diagnostic: incomplet
    relance: 'C''est juste, mais il en manque un : un autre élément très léger s''est formé en même temps.'
  solution: L'hydrogène et l'hélium, les deux éléments les plus légers. Le carbone, l'oxygène et le fer ont été fabriqués
    plus tard dans les étoiles.
- id: plus-abondant-univers
  type: texte_court
  difficulte: 1
  enonce: Quel est l'élément chimique le plus abondant dans l'Univers ?
  reponse:
    acceptees:
    - hydrogène
    fautes_tolerees: 1
  indices:
    relance: C'est aussi l'élément le plus léger de tous. Lequel est-ce ?
    methode: 'Pense à la classification périodique : il occupe la toute première case, avec le numéro atomique 1.'
    etape: C'est le principal constituant du Soleil et des étoiles. Son symbole est H, comme dans la formule de l'eau H2O.
  pieges:
  - si:
      valeur: oxygène
    relance: L'oxygène est le plus abondant dans la croûte terrestre. Mais dans tout l'Univers, dans les étoiles ?
  - si:
      valeur: hélium
    relance: L'hélium est le deuxième. Lequel est encore plus abondant, et encore plus léger ?
  - si:
      diagnostic: mauvaise_reponse
    relance: Les étoiles sont surtout faites de l'élément le plus léger. Lequel ?
  solution: 'L''hydrogène : il représente environ les trois quarts de la masse des atomes de l''Univers.'
- id: part-des-elements-lourds
  type: nombre
  difficulte: 1
  enonce: Dans l'Univers, l'hydrogène représente environ 74 % de la masse des atomes et l'hélium environ 24 %. Quel pourcentage
    reste-t-il pour tous les autres éléments réunis (carbone, oxygène, fer…) ? Écris seulement le nombre.
  reponse:
    valeur: 2
    forme: libre
  indices:
    relance: Tous les atomes de l'Univers, cela fait 100 %. Quelle part est déjà prise par les deux éléments les plus légers
      ?
    methode: Additionne les deux pourcentages donnés, puis retire le résultat de 100 %.
    etape: 74 % + 24 % = 98 %. Combien manque-t-il pour arriver à 100 % ?
  pieges:
  - si:
      valeur: 98
    relance: Tu as trouvé la part des deux éléments les plus légers ensemble. Que reste-t-il pour les autres ?
  - si:
      diagnostic: valeur_fausse
    relance: Additionne d'abord les deux pourcentages de l'énoncé, puis cherche ce qu'il manque pour faire 100 %.
  solution: '100 − (74 + 24) = 100 − 98 = 2 : il reste environ 2 %. Les éléments lourds sont donc très rares dans l''Univers.'
- id: histoire-des-atomes
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre chronologique l'histoire des atomes de carbone de ton corps.
  reponse:
    elements:
    - id: big-bang
      texte: Juste après le Big Bang, formation des noyaux d'hydrogène et d'hélium
    - id: premieres-etoiles
      texte: Formation des premières étoiles à partir de nuages d'hydrogène et d'hélium
    - id: fusion
      texte: Fabrication d'éléments plus lourds, comme le carbone, au cœur des étoiles
    - id: dispersion
      texte: À la fin de la vie des étoiles, dispersion de ces éléments dans l'espace
    - id: systeme-solaire
      texte: Formation du Soleil et de la Terre à partir d'un nuage enrichi en éléments lourds
  indices:
    relance: Pour qu'une étoile fabrique du carbone, qu'est-ce qui doit déjà exister ?
    methode: Commence par le tout début de l'Univers, et termine par la naissance de notre planète.
    etape: Au début, il n'y a que les éléments les plus légers. Puis les étoiles s'allument. Que font-elles ensuite ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Un élément peut-il être dispersé avant d'avoir été fabriqué ?
  - si:
      diagnostic: ordre_faux
    relance: Pars du Big Bang. Les étoiles doivent naître avant de fabriquer quoi que ce soit, et la Terre arrive à la fin.
  solution: Big Bang (hydrogène et hélium) → premières étoiles → fabrication du carbone et des autres éléments lourds dans
    les étoiles → dispersion à la mort des étoiles → formation du Soleil et de la Terre à partir de ce nuage enrichi.
- id: ressources-terrestres
  type: association
  difficulte: 2
  enonce: Associe chaque élément (ou groupe d'éléments) à la phrase qui lui correspond.
  reponse:
    gauche:
    - id: helium
      texte: l'hélium
    - id: oxygene
      texte: l'oxygène
    - id: silicium
      texte: le silicium
    - id: fer
      texte: le fer
    - id: terres-rares
      texte: les terres rares
    droite:
    - id: rare
      texte: très rare sur Terre, car ce gaz très léger s'échappe dans l'espace
    - id: croute
      texte: l'élément le plus abondant de la croûte terrestre
    - id: sable
      texte: présent dans le sable et les roches, utilisé dans les puces électroniques
    - id: noyau
      texte: principal constituant du noyau de la Terre
    - id: aimants
      texte: métaux utilisés dans les aimants d'éoliennes et les téléphones, extraits en petites quantités
    paires:
      helium: rare
      oxygene: croute
      silicium: sable
      fer: noyau
      terres-rares: aimants
  indices:
    relance: Lequel de ces éléments est un gaz très léger ? Lequel est un métal très lourd et abondant au centre de la Terre
      ?
    methode: Commence par les associations dont tu es sûr, puis procède par élimination.
    etape: Le sable contient beaucoup de silice, un composé du silicium et de l'oxygène. Continue avec les autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Revois l''élément le plus abondant de la croûte terrestre : ce n''est pas
      un métal.'
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends élément par élément : gaz léger, métal du noyau terrestre, constituant du sable, métaux rares des technologies…'
  solution: 'Hélium : très rare sur Terre (il s''échappe). Oxygène : le plus abondant de la croûte terrestre. Silicium : sable,
    roches, puces. Fer : noyau de la Terre. Terres rares : aimants, téléphones, extraits en petites quantités.'
- id: recycler-telephones
  type: ouverte
  difficulte: 3
  enonce: Les téléphones portables contiennent des terres rares et d'autres métaux. Explique pourquoi il est important de
    recycler les vieux téléphones.
  criteres:
  - L'élève explique que ces éléments sont des ressources limitées sur Terre (peu abondantes, inégalement réparties, non renouvelables
    à l'échelle humaine).
  - L'élève cite un inconvénient de l'extraction (pollution, énergie, destruction de milieux naturels).
  - 'L''élève explique que les atomes ne disparaissent pas : le recyclage permet de récupérer ces éléments pour les réutiliser.'
  indices:
    relance: Les terres rares sont-elles abondantes dans la croûte terrestre ? Que se passe-t-il quand on jette un téléphone
      ?
    methode: 'Organise ta réponse en deux parties : ce que coûte l''extraction de ces éléments, puis ce que permet le recyclage.'
    etape: 'Commence par : « Les terres rares sont des éléments peu abondants sur Terre, et leur extraction… »'
  solution: 'Les terres rares sont des ressources limitées : peu abondantes, concentrées dans quelques pays et non renouvelables
    à l''échelle humaine. Leur extraction consomme beaucoup d''énergie et pollue. Or les atomes d''un téléphone ne disparaissent
    pas : en le recyclant, on récupère ces éléments pour fabriquer de nouveaux objets, au lieu d''en extraire de nouveaux.'
