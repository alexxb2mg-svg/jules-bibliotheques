format: 2
notion: elements-terre-univers
version: 1
etat: verifiee
declencheurs:
- poussière d'étoiles
- d'où viennent les atomes
- abondance dans l'Univers
- ressources en terres rares
- éléments formés dans les étoiles
prerequis:
- classification-periodique
essentiel: 'La matière observable dans l''Univers, sur Terre comme dans les étoiles les plus lointaines, est constituée des

  mêmes éléments chimiques et obéit aux mêmes lois physiques : c''est un principe fondamental de l''astrophysique.


  L''hydrogène et l''hélium, formés très tôt dans l''histoire de l''Univers, en constituent l''essentiel de la matière

  ordinaire ; les éléments plus lourds (oxygène, carbone, fer, silicium, terres rares...) sont produits par les

  réactions nucléaires au cœur des étoiles, puis dispersés dans l''espace lors de leur explosion en fin de vie.


  Sur Terre, la disponibilité des éléments est très inégale : l''hydrogène et l''hélium, abondants dans l''Univers,

  sont rares à l''état libre sur Terre, tandis que des éléments plus lourds comme l''oxygène, le silicium ou le fer

  sont beaucoup plus présents dans les roches terrestres.


  Certaines ressources terrestres en éléments chimiques (métaux, terres rares) sont limitées, ce qui pose des

  questions de gestion et d''exploitation raisonnée de ces ressources.

  '
methode:
- Retenir que les mêmes éléments chimiques se retrouvent partout dans l'Univers observable.
- Distinguer les éléments légers (hydrogène, hélium), très abondants dans l'Univers, et les éléments plus lourds, produits
  dans les étoiles.
- 'Comparer deux notions différentes : l''abondance d''un élément dans l''Univers et sa disponibilité effective sur Terre.'
- Relier la rareté de certaines ressources terrestres (terres rares, métaux) aux enjeux de leur exploitation.
vocabulaire:
- terme: terres rares
  definition: groupe de métaux dont les réserves terrestres exploitables sont limitées, utilisés notamment dans l'électronique
erreurs_frequentes:
- Croire que les éléments chimiques sont différents selon l'endroit de l'Univers où on les observe.
- Confondre abondance dans l'Univers et abondance sur Terre (l'hydrogène est très abondant dans l'Univers mais rare à l'état
  libre sur Terre).
- Penser que les éléments lourds ont toujours existé depuis l'origine de l'Univers, alors qu'ils sont produits progressivement
  dans les étoiles.
- Ignorer que certaines ressources en éléments chimiques sont limitées sur Terre.
exemple:
  enonce: L'hydrogène et l'hélium représentent environ 74 % et 24 % de la matière ordinaire de l'Univers. Quel pourcentage
    représentent tous les autres éléments réunis (oxygène, carbone, fer...) ?
  solution: 100 − 74 − 24 = 2 % pour tous les autres éléments réunis.
exercices:
- id: pourquoi-poussiere-etoiles
  type: ouverte
  difficulte: 2
  enonce: Pourquoi dit-on que « nous sommes faits de poussière d'étoiles » ?
  criteres:
  - L'élève dit que les éléments lourds présents dans notre corps (carbone, oxygène, fer...) ont été formés au cœur d'étoiles.
  - L'élève dit que ces éléments ont été dispersés dans l'espace après l'explosion de ces étoiles en fin de vie.
  - L'élève relie ces éléments dispersés à la formation ultérieure du système solaire et de la Terre.
  indices:
    relance: D'où viennent les éléments plus lourds que l'hydrogène et l'hélium présents dans notre corps (carbone, oxygène...)
      ?
    methode: Pense au lieu où se forment les éléments lourds, et à ce qui se passe quand une étoile arrive en fin de vie.
    etape: Les réactions nucléaires qui produisent ces éléments ont lieu au cœur des étoiles.
  solution: Les éléments lourds qui composent notre corps (carbone, oxygène, fer...) ont été formés au cœur d'étoiles disparues,
    puis dispersés dans l'espace avant de participer à la formation du système solaire et de la Terre.
- id: hydrogene-univers-vs-terre
  type: choix
  difficulte: 2
  enonce: L'hydrogène est très abondant dans l'Univers. L'est-il aussi à l'état libre à la surface de la Terre ?
  reponse:
    options:
    - id: a
      texte: Non, il est rare à l'état libre sur Terre (souvent combiné, par exemple dans l'eau)
    - id: b
      texte: Oui, il est tout aussi abondant à l'état libre sur Terre que dans l'Univers
    - id: c
      texte: L'hydrogène n'existe pas du tout sur Terre
    bonnes:
    - a
  indices:
    relance: Compare l'abondance dans l'Univers et la disponibilité effective sur Terre, ce sont deux choses différentes.
    methode: L'hydrogène terrestre se trouve surtout combiné à d'autres éléments, notamment dans l'eau (H2O).
    etape: Pense à la formule de l'eau, qui contient de l'hydrogène combiné à de l'oxygène.
  pieges:
  - si:
      contient:
      - b
    relance: L'abondance dans l'Univers et la disponibilité effective à l'état libre sur Terre sont deux choses différentes.
  - si:
      contient:
      - c
    relance: L'hydrogène existe bien sur Terre, mais surtout combiné à d'autres éléments (par exemple dans l'eau), pas à l'état
      libre.
  solution: 'Non, l''hydrogène est rare à l''état libre sur Terre (surtout combiné, par exemple dans l''eau) : abondance dans
    l''Univers et disponibilité terrestre sont deux choses différentes.'
- id: exemple-ressource-limitee
  type: texte_court
  difficulte: 2
  enonce: Citer un exemple de groupe d'éléments chimiques dont la ressource terrestre est limitée et pose des enjeux d'exploitation
    (utilisés notamment dans l'électronique).
  reponse:
    acceptees:
    - terres rares
    fautes_tolerees: 1
  indices:
    relance: Pense à un groupe de métaux utilisés dans les appareils électroniques.
    methode: Ce groupe porte un nom qui indique justement leur rareté sur Terre.
    etape: L'expression cherchée contient le mot « rares ».
  pieges:
  - si:
      valeur: pétrole
    relance: Le pétrole n'est pas un élément chimique, mais un mélange de plusieurs composés ; cherche plutôt un groupe de
      métaux.
  solution: Les terres rares (utilisées dans l'électronique), dont les réserves terrestres sont limitées.
- id: pourcentage-autres-elements-univers
  type: nombre
  difficulte: 1
  enonce: L'hydrogène et l'hélium représentent environ 74 % et 24 % de la matière ordinaire de l'Univers. Quel pourcentage
    représentent tous les autres éléments réunis ?
  reponse:
    valeur: 2
    forme: entier
    tolerance: 0
  indices:
    relance: Le total des pourcentages doit faire 100 %.
    methode: Additionne 74 et 24, puis soustrais ce total de 100.
    etape: 74 + 24 = 98.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Reprends le calcul 100 moins la somme des deux pourcentages donnés.
  solution: 100 − 74 − 24 = 2 % pour tous les autres éléments réunis (oxygène, carbone, fer...).
