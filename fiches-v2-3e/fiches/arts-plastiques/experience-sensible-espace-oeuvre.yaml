  solution: Le spectateur se déplace physiquement au milieu de milliers de fils ou de tubes suspendus ; Plusieurs sens sont
    mobilisés, comme la vue et le toucher lors du contact avec les matières. C'est exact. Les Pénétrables de Soto sont conçus
    pour que le spectateur marche à travers les éléments suspendus dans l'espace.
