- id: nblm-quelle-est-la-difference-essentielle-ent-5
  type: choix
  difficulte: 2
  enonce: Quelle est la différence essentielle entre un espace représenté et un espace construit dans les arts plastiques
    ?
  reponse:
    options:
    - id: o1
      texte: L'espace représenté est une image regardée de l'extérieur, alors que l'espace construit est un lieu réel dans
        lequel le spectateur entre avec son corps.
    - id: o2
      texte: L'espace représenté est fait de sculpture, alors que l'espace construit ne comporte que des dessins.
    - id: o3
      texte: L'espace représenté nécessite de marcher, alors que l'espace construit se regarde obligatoirement les yeux fermés.
    - id: o4
      texte: Les deux expressions désignent exactement la même chose sans aucune différence.
    bonnes:
    - o1
  indices:
    relance: 'Réfléchis à ce que fait le corps du spectateur : regarde-t-il une image plate ou entre-t-il dans un environnement
      réel ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : associer à tort la notion d''espace représenté à la sculpture et l''espace construit au dessin.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : inverser les rôles en attribuant le déplacement corporel à la simple observation d''une image.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : négliger la distinction fondamentale entre une surface plane (image) et un environnement tridimensionnel
      réel (lieu).'
  solution: L'espace représenté est une image regardée de l'extérieur, alors que l'espace construit est un lieu réel dans
    lequel le spectateur entre avec son corps. C'est exact. L'espace représenté est une illusion visuelle (comme un tableau),
    tandis que l'espace construit est une installation où le spectateur évolue physiquement.
