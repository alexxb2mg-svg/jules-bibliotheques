format: 2
notion: experience-sensible-espace-oeuvre
version: 1
etat: verifiee
declencheurs:
- installation immersive
- salle remplie de miroirs
- entrer dans l'œuvre
- traverser une installation
- forme qui se recompose d'un seul endroit
- soleil artificiel dans un musée
prerequis:
- 4e-experience-sensible-espace-oeuvre
- presence-materielle-oeuvre-espace
essentiel: 'Une œuvre peut représenter un espace ou en construire un.

  - Un espace représenté est une image : un paysage peint en perspective sur une toile plane, par exemple. On le regarde de
  l''extérieur.

  - Un espace construit est réel : une installation dans laquelle le spectateur entre, marche, se retourne. Il le perçoit
  avec son corps et le ressent : se sentir petit, enfermé, perdu, apaisé.


  L''espace et le temps deviennent des matériaux de l''œuvre : le parcours, la durée de la visite, la lumière qui change.
  Plusieurs sens peuvent être mobilisés : la vue, mais aussi l''ouïe (sons), le toucher (matières, fils), parfois l''odorat.

  - Yayoi Kusama crée à partir de 1965 des Infinity Mirror Rooms : des pièces couvertes de miroirs où les reflets donnent
  l''impression d''un espace sans fin.

  - Olafur Eliasson installe en 2003, dans le grand hall de la Tate Modern à Londres, The Weather Project : un immense soleil
  artificiel, de la brume et un miroir au plafond où les visiteurs allongés se voient.

  - Jesús Rafael Soto crée à partir de la fin des années 1960 des Pénétrables : des milliers de fils ou de tubes suspendus
  que le spectateur traverse.


  Le point de vue compte : celui de l''auteur, qui choisit où placer le spectateur, et celui du spectateur, qui se déplace.
  Felice Varini peint des formes sur des murs et des bâtiments : elles ne se recomposent qu''à partir d''un seul endroit ;
  ailleurs, on ne voit que des fragments.

  '
methode:
- Dire si l'espace est représenté (une image) ou construit (un lieu où l'on entre).
- 'Décrire ce que le corps du spectateur fait : regarder de face, marcher, traverser, s''allonger, se retourner.'
- 'Repérer les sens mobilisés : vue, ouïe, toucher, odorat.'
- 'Repérer le rôle du temps : parcours, durée, lumière ou son qui changent.'
- Dire le ressenti produit et comment les choix de l'artiste le provoquent (lumière, miroirs, matières, échelle).
vocabulaire:
- terme: installation
  definition: œuvre qui occupe et transforme un espace, dans lequel le spectateur peut souvent entrer
- terme: œuvre immersive
  definition: œuvre qui entoure le spectateur de tous côtés
- terme: point de vue
  definition: endroit d'où l'on regarde, qui détermine ce que l'on voit
- terme: espace perçu
  definition: l'espace tel que le corps et les sens le vivent réellement
- terme: anamorphose
  definition: image déformée qui ne se lit correctement que depuis un point de vue précis
erreurs_frequentes:
- Décrire seulement ce qu'on voit, en oubliant ce que le corps ressent et fait dans l'espace.
- Confondre espace représenté (une image, même très réaliste) et espace construit (un lieu réel).
- 'Oublier le temps : une installation se découvre en marchant, pas d''un seul coup d''œil.'
- 'Croire que le spectateur est passif : dans ces œuvres, son déplacement et sa place font partie de l''expérience.'
exemple:
  enonce: 'Production fictive d''élèves : dans une salle obscure, des élèves ont tendu du sol au plafond des centaines de
    fils de laine blanche, éclairés par une lampe noire ; on doit se frayer un chemin entre eux. Analyse l''expérience du
    spectateur.'
  solution: 'L''espace n''est pas représenté mais construit : le spectateur entre dans l''œuvre. Son corps touche les fils
    en avançant, ce qui mobilise le toucher en plus de la vue. La lumière fait briller les fils dans le noir et brouille les
    distances : on se sent un peu perdu. La traversée prend du temps et le point de vue change à chaque pas, comme dans les
    Pénétrables de Soto.'
exercices:
- id: mot-installation
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une œuvre qui occupe et transforme tout un espace, dans lequel le spectateur peut entrer et
    se déplacer ?
  reponse:
    acceptees:
    - installation
    - installation immersive
    fautes_tolerees: 1
  indices:
    relance: Dans The Weather Project d'Olafur Eliasson, le public est-il devant l'œuvre ou dedans ?
    methode: Le mot vient d'un verbe qui veut dire « mettre en place, disposer dans un lieu ».
    etape: Le mot se termine par « -ation » et commence comme le verbe « installer ».
  pieges:
  - si:
      valeur: sculpture
    relance: Une sculpture se regarde souvent en tournant autour. Ici, on entre dedans. Quel mot convient ?
  - si:
      valeur: performance
    relance: Une performance est une action de l'artiste devant un public. Ici, c'est un espace qu'on parcourt. Quel mot convient
      ?
  - si:
      diagnostic: mauvaise_reponse
    relance: Pense au verbe qui veut dire « mettre en place dans un lieu », puis au nom qui en vient.
  solution: 'Une installation : l''œuvre occupe et transforme un espace où le spectateur entre, comme The Weather Project
    d''Olafur Eliasson (2003) ou les Infinity Mirror Rooms de Yayoi Kusama.'
- id: represente-ou-construit
  type: choix
  difficulte: 1
  enonce: Dans laquelle de ces situations l'espace est-il représenté, et non construit ?
  reponse:
    options:
    - id: a
      texte: Un paysage peint en perspective sur une toile accrochée au mur
    - id: b
      texte: Une pièce remplie de fils suspendus que l'on traverse
    - id: c
      texte: Une salle couverte de miroirs dans laquelle on entre
    - id: d
      texte: Un couloir de lumière colorée que l'on parcourt
    bonnes:
    - a
  indices:
    relance: Dans quelle situation ne peux-tu pas entrer dans l'espace montré ?
    methode: Un espace représenté est une image sur une surface plane. Un espace construit est un lieu réel où le corps va.
    etape: Les fils, les miroirs et le couloir sont des lieux où l'on entre. Reste-t-il une image ?
  pieges:
  - si:
      contient:
      - c
    relance: Les reflets donnent une illusion, mais la salle est-elle réelle ? Peut-on y entrer ?
  - si:
      contient:
      - b
    relance: Si l'on peut traverser les fils, l'espace est-il une image ou un lieu réel ?
  - si:
      contient:
      - d
    relance: On parcourt ce couloir avec son corps. Cherche la situation où l'espace n'est qu'une image.
  solution: 'Le paysage peint en perspective : c''est une image sur une surface plane, l''espace y est représenté. Les fils,
    les miroirs et le couloir sont des espaces construits où le corps entre.'
- id: oeuvres-experiences
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à l'expérience qu'elle fait vivre au spectateur.
  reponse:
    gauche:
    - id: a
      texte: Yayoi Kusama, Infinity Mirror Rooms (à partir de 1965)
    - id: b
      texte: Olafur Eliasson, The Weather Project (2003, Tate Modern, Londres)
    - id: c
      texte: Jesús Rafael Soto, Pénétrables (à partir de la fin des années 1960)
    - id: d
      texte: Felice Varini, formes peintes sur des murs et des bâtiments
    droite:
    - id: x
      texte: Les reflets donnent l'impression d'un espace sans fin
    - id: y
      texte: Un soleil artificiel et de la brume changent la lumière d'un immense hall
    - id: z
      texte: Le corps traverse des fils suspendus qu'il touche et fait bouger
    - id: w
      texte: La forme ne se recompose qu'à partir d'un seul endroit
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Quel titre contient le mot « infini » en anglais ? Et lequel parle de la météo ?
    methode: 'Traduis ou décompose les titres : ils donnent souvent un indice sur l''expérience.'
    etape: « Mirror » veut dire miroir, « weather » veut dire météo, et « pénétrable » veut dire qu'on peut y entrer. Place
      l'œuvre qui reste.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle de ces œuvres est peinte sur des surfaces déjà existantes ?
  - si:
      diagnostic: associations_fausses
    relance: 'Repars des titres : miroirs, météo, entrer. Puis place l''artiste qui peint sur des bâtiments.'
  solution: 'Kusama : les miroirs donnent un espace sans fin. Eliasson : soleil artificiel et brume dans le hall de la Tate
    Modern. Soto : on traverse des fils suspendus. Varini : la forme se recompose depuis un seul endroit.'
- id: mot-point-de-vue
  type: texte_court
  difficulte: 2
  enonce: Dans les œuvres de Felice Varini, la forme peinte n'apparaît entière que si l'on se place à un endroit précis. Comment
    appelle-t-on l'endroit d'où l'on regarde, qui détermine ce que l'on voit ?
  reponse:
    acceptees:
    - point de vue
    - angle de vue
    fautes_tolerees: 1
  indices:
    relance: Quand tu changes de place devant une œuvre, qu'est-ce qui change pour toi ?
    methode: L'expression est faite de trois mots ; elle sert aussi pour dire « mon opinion ». Le dernier mot vient du verbe
      « voir ».
    etape: Le premier mot désigne un endroit très précis ; c'est aussi le nom du signe qui termine une phrase.
  pieges:
  - si:
      valeur: point de fuite
    relance: Le point de fuite est dans l'image, là où les lignes se rejoignent en perspective. On cherche la place de celui
      qui regarde.
  - si:
      valeur: perspective
    relance: La perspective est une manière de représenter la profondeur. On cherche l'expression qui désigne la place de
      celui qui regarde.
  - si:
      diagnostic: mauvaise_reponse
    relance: Pense à l'expression de trois mots qu'on emploie aussi pour dire « mon avis ».
  solution: 'Le point de vue : chez Varini, la forme ne se recompose que depuis un point de vue unique ; ailleurs, on ne voit
    que des fragments. Le spectateur doit se déplacer pour le trouver.'
- id: demarche-anamorphose
  type: ordre
  difficulte: 2
  enonce: 'Projet fictif en classe : peindre dans une salle une forme qui ne se recompose que d''un seul endroit. Range les
    étapes dans l''ordre.'
  reponse:
    elements:
    - id: choisir
      texte: Choisir un emplacement fixe dans la salle et le marquer au sol
    - id: projeter
      texte: Depuis cet emplacement, projeter la forme avec un vidéoprojecteur
    - id: tracer
      texte: Tracer au crayon les contours projetés sur les murs, le sol et les meubles
    - id: peindre
      texte: Peindre les zones tracées
    - id: verifier
      texte: Vérifier depuis l'emplacement marqué que la forme se recompose, puis se déplacer pour la voir se briser
  indices:
    relance: D'où faut-il projeter la forme pour qu'elle se recompose ensuite à cet endroit précis ?
    methode: 'Fixe d''abord le lieu d''où l''on regardera, puis suis le chemin de la forme : lumière, crayon, peinture, vérification.'
    etape: On commence par marquer l'emplacement au sol, puis on projette la forme depuis là. Que fait-on de la lumière projetée
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque. Deux étapes voisines sont inversées : peut-on peindre avant d''avoir tracé les contours ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère la première étape (choisir d'où l'on regarde) et la dernière (vérifier), puis range le reste.
  solution: Marquer l'emplacement, projeter la forme depuis cet endroit, tracer les contours projetés, peindre, puis vérifier
    depuis l'emplacement que la forme se recompose et se brise ailleurs.
- id: analyse-couloir-calque
  type: ouverte
  difficulte: 3
  enonce: 'Production fictive d''élèves : dans un couloir sombre, des élèves ont suspendu des centaines de bandes de papier
    calque, éclairées par une lampe qui se balance lentement ; un léger bruit de vent est diffusé. Pour sortir, il faut traverser
    le couloir. Analyse en quelques phrases l''expérience du spectateur.'
  criteres:
  - L'élève explique que l'espace est construit et que le corps du spectateur est dans l'œuvre (il la traverse).
  - L'élève relève au moins deux sens mobilisés (vue, ouïe, toucher) et le rôle du temps (lumière qui bouge, durée de la traversée).
  - L'élève décrit un ressenti possible et le justifie par des choix plastiques précis (obscurité, transparence du calque,
    mouvement, son).
  indices:
    relance: Que ressentirais-tu en traversant ce couloir ? Que verrais-tu, entendrais-tu, toucherais-tu ?
    methode: Parle de l'espace (construit ou représenté), puis des sens, puis du temps, puis du ressenti.
    etape: 'Tu peux commencer ainsi « Le spectateur n''est pas devant l''œuvre, il est dedans : ... »'
  solution: 'Le spectateur n''est pas devant l''œuvre, il est dedans : l''espace est construit et il doit le traverser. Il
    voit les bandes translucides s''éclairer puis s''assombrir au rythme de la lampe, il entend le vent, il frôle le papier
    : la vue, l''ouïe et le toucher sont mobilisés. La lumière qui bouge et la durée de la traversée font du temps un matériau.
    L''obscurité et le mouvement peuvent donner une impression de mystère, comme une forêt la nuit.'
