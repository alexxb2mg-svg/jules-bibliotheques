format: 2
notion: la-ressemblance
version: 2
etat: verifiee
declencheurs:
- ça ressemble pas au modèle
- dessiner comme en vrai
- copier la réalité
- hyperréalisme
- déformer un visage exprès
prerequis:
- 4e-la-ressemblance
couverture: Couvre le rapport au réel, la valeur expressive de l'écart et la différence entre ressemblance et vraisemblance.
  L'abstraction n'est évoquée que pour la distinguer de l'écart.
essentiel: 'Une image ressemble à son modèle quand on reconnaît en elle ce qui existe dans le réel : formes, proportions,
  couleurs, lumière. Mais une image n''est jamais la chose elle-même. René Magritte le rappelle dans La Trahison des images
  (1929, huile sur toile) : sous une pipe très bien peinte, il écrit « Ceci n''est pas une pipe ».


  Certains artistes cherchent une ressemblance très poussée. Chuck Close peint son Big Self-Portrait (1967-1968, acrylique
  sur toile) à partir d''une photographie, avec une précision qui rappelle la photo : c''est l''hyperréalisme.


  D''autres créent volontairement un écart avec le réel : ils déforment, simplifient, exagèrent ou changent les couleurs.
  Cet écart a une valeur expressive. Dans le Portrait de Dora Maar (1937, huile sur toile), Pablo Picasso montre le visage
  à la fois de face et de profil. Vers 1590, Giuseppe Arcimboldo peint l''empereur Rodolphe II en Vertumne, avec un visage
  entièrement fait de fruits, de légumes et de fleurs : on reconnaît un visage, construit avec autre chose.


  Ressemblance et vraisemblance ne sont pas la même chose. La ressemblance compare l''image à un modèle réel. La vraisemblance,
  c''est ce qui paraît possible, crédible : un dragon bien dessiné, avec des écailles, des ombres et un décor cohérent, peut
  être vraisemblable alors qu''il n''existe pas. C''est ainsi que les images construisent des fictions.

  '
methode:
- Se demander s'il existe un modèle réel, et si l'image cherche à lui ressembler.
- 'Repérer les écarts avec le réel : proportions, formes, couleurs, matières, point de vue.'
- 'Dire l''effet de ces écarts : expression, humour, étrangeté, émotion.'
- 'Distinguer : ressemble-t-elle à quelque chose de réel (ressemblance), ou paraît-elle crédible (vraisemblance) ?'
vocabulaire:
- terme: ressemblance
  definition: le rapport d'une image à un modèle réel que l'on reconnaît
- terme: vraisemblance
  definition: le caractère de ce qui paraît possible et crédible, même si cela n'existe pas
- terme: écart
  definition: la différence volontaire entre l'image et le réel (déformation, simplification, exagération)
- terme: hyperréalisme
  definition: courant artistique qui recherche une ressemblance extrême avec le réel, souvent à partir de photographies
- terme: figuration
  definition: le fait de représenter des êtres ou des choses reconnaissables
erreurs_frequentes:
- Croire qu'une image réussie est forcément une image ressemblante.
- Confondre ressemblance (rapport à un modèle réel) et vraisemblance (ce qui paraît crédible).
- Penser qu'un écart avec le réel est une maladresse, alors qu'il peut être un choix expressif.
- Confondre une image déformée, où l'on reconnaît encore le modèle, et une image abstraite, où l'on ne reconnaît plus rien.
- Oublier qu'une image, même très ressemblante, n'est pas la chose elle-même.
exemple:
  enonce: 'Production fictive : un élève dessine son chat très fidèlement au crayon, puis le redessine avec des yeux énormes
    et un corps minuscule. Qu''est-ce qui change ?'
  solution: 'Le premier dessin cherche la ressemblance : on reconnaît le chat tel qu''il est. Le second crée un écart : les
    proportions sont exagérées. On reconnaît encore le chat, mais l''image exprime autre chose, par exemple la tendresse ou
    l''humour. L''écart devient un choix expressif.'
exercices:
- id: paraitre-credible
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le caractère d'une image qui paraît possible et crédible, même si ce qu'elle montre n'existe pas
    (par exemple un dragon dessiné avec des écailles et des ombres réalistes) ?
  reponse:
    acceptees:
    - vraisemblance
    fautes_tolerees: 1
  indices:
    relance: Le dragon n'a pas de modèle réel. Qu'est-ce qui le rend quand même convaincant ?
    methode: 'Cherche un nom formé sur l''expression « vrai » + « semblable » : ce qui semble vrai.'
    etape: Le mot commence par « vrai… » et se termine par « -ance ».
  pieges:
  - si:
      valeur: ressemblance
    relance: 'La ressemblance compare l''image à un modèle réel. Ici il n''y a pas de modèle : on se demande si l''image paraît
      crédible.'
  - si:
      valeur: réalisme
    relance: Tu es proche. Quel nom désigne ce qui semble vrai, même quand c'est inventé ?
  solution: 'La vraisemblance : l''image paraît possible et crédible, même si ce qu''elle montre n''existe pas. Le dragon
    est vraisemblable, mais il ne ressemble à aucun modèle réel.'
- id: magritte-pipe
  type: choix
  difficulte: 1
  enonce: Dans La Trahison des images (1929), René Magritte peint une pipe très reconnaissable et écrit dessous « Ceci n'est
    pas une pipe ». Pourquoi ?
  reponse:
    options:
    - id: a
      texte: Il s'est trompé dans le texte
    - id: b
      texte: Parce que c'est l'image d'une pipe, et pas une vraie pipe qu'on pourrait fumer
    - id: c
      texte: Pour faire la publicité d'une marque de pipes
    - id: d
      texte: Parce que l'objet peint est en réalité un chapeau
    bonnes:
    - b
  indices:
    relance: Peux-tu fumer, remplir ou tenir la pipe du tableau ?
    methode: Demande-toi quelle est la différence entre un objet et sa représentation.
    etape: Ce que l'on voit sur la toile, ce sont des couleurs posées sur une surface plane. Quelle réponse le dit ?
  pieges:
  - si:
      contient:
      - a
    relance: Magritte a peint cette phrase avec soin, exprès, sous la pipe. Que veut-il nous faire remarquer ?
  - si:
      contient:
      - c
    relance: 'Le tableau ne donne aucune marque. Qu''est-ce que Magritte interroge plutôt : l''objet ou son image ?'
  - si:
      contient:
      - d
    relance: 'La pipe est très reconnaissable. Le jeu porte ailleurs : est-ce une vraie pipe ?'
  solution: 'Magritte rappelle qu''une image n''est pas la chose représentée (b) : c''est une peinture de pipe, pas une pipe.
    Même très ressemblante, une image reste une image.'
- id: rapport-au-reel
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre ou production à son rapport au réel.
  reponse:
    gauche:
    - id: a
      texte: Big Self-Portrait de Chuck Close (1967-1968), peint à partir d'une photographie avec une grande précision
    - id: b
      texte: Portrait de Dora Maar de Pablo Picasso (1937), un visage montré à la fois de face et de profil
    - id: c
      texte: La Trahison des images de René Magritte (1929), une pipe peinte avec « Ceci n'est pas une pipe »
    - id: d
      texte: 'Production fictive : un dragon dessiné avec ombres et écailles, intégré dans une photo de la cour du collège'
    droite:
    - id: w
      texte: Recherche une ressemblance extrême avec le réel
    - id: x
      texte: Crée un écart expressif en déformant le visage
    - id: y
      texte: Rappelle qu'une image ressemblante n'est pas la chose elle-même
    - id: z
      texte: Rend crédible une fiction sans modèle réel
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Laquelle de ces images montre quelque chose qui n'existe pas du tout ?
    methode: Pour chaque image, demande-toi s'il y a un modèle réel, et si l'image s'en rapproche, s'en éloigne, ou interroge
      ce rapport.
    etape: Le dragon n'a pas de modèle réel. Chuck Close part d'une photographie. Place maintenant Picasso et Magritte.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel des deux tableaux du XXe siècle déforme les traits, et lequel joue avec
      les mots ?
  - si:
      diagnostic: associations_fausses
    relance: Pars du dragon, qui n'a pas de modèle, puis de l'œuvre peinte d'après une photo, et place les deux autres.
  solution: 'Chuck Close : ressemblance extrême (hyperréalisme). Picasso : écart expressif, face et profil réunis. Magritte
    : une image n''est pas la chose. Le dragon : fiction vraisemblable, sans modèle réel.'
- id: modifier-les-formes
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le fait de modifier volontairement les formes ou les proportions d'un modèle, tout en le laissant
    reconnaissable, pour exprimer quelque chose ?
  reponse:
    acceptees:
    - déformation
    - déformer
    - distorsion
    fautes_tolerees: 1
  indices:
    relance: 'Pense au visage de Dora Maar peint par Picasso : que fait-il subir aux formes du visage ?'
    methode: Cherche un nom formé sur « forme » avec un préfixe qui veut dire « défaire ».
    etape: Le mot commence par « dé- » et contient « forme ».
  pieges:
  - si:
      valeur: abstraction
    relance: Dans l'abstraction, on ne reconnaît plus de modèle. Ici on le reconnaît encore, mais transformé. Quel mot convient
      ?
  - si:
      valeur: caricature
    relance: La caricature en est un exemple, souvent pour faire rire. Quel mot plus général désigne le fait de modifier les
      formes ?
  solution: 'La déformation : on modifie volontairement les formes ou les proportions d''un modèle, qui reste reconnaissable,
    pour exprimer quelque chose.'
- id: arcimboldo-ecart
  type: choix
  difficulte: 2
  enonce: 'Vers 1590, Giuseppe Arcimboldo peint l''empereur Rodolphe II en Vertumne : le visage est entièrement composé de
    fruits, de légumes et de fleurs. Que peut-on dire de ce portrait ?'
  reponse:
    options:
    - id: a
      texte: Il ressemble au visage de l'empereur comme une photographie
    - id: b
      texte: 'Il joue sur un écart : on reconnaît un visage, mais construit avec autre chose'
    - id: c
      texte: C'est une peinture abstraite, sans rien de reconnaissable
    bonnes:
    - b
  indices:
    relance: Reconnaît-on encore un visage ? Et avec quoi est-il fait ?
    methode: 'Compare deux choses : ce que l''on reconnaît dans l''ensemble, et ce que l''on voit de près.'
    etape: De loin on voit un visage, de près des fruits et des légumes. Est-ce une copie fidèle, ou autre chose ?
  pieges:
  - si:
      contient:
      - a
    relance: 'Un nez en forme de poire, des joues en pommes : est-ce la façon dont on voit un visage réel ?'
  - si:
      contient:
      - c
    relance: Dans une peinture abstraite, on ne reconnaît rien. Ici, reconnaît-on un visage ?
  solution: 'Arcimboldo joue sur un écart (b) : le visage reste reconnaissable, mais il est composé de fruits, de légumes
    et de fleurs. L''image surprend et amuse, tout en étant un portrait.'
- id: deux-portraits
  type: ouverte
  difficulte: 3
  enonce: 'Productions fictives : Adam dessine sa grand-mère au crayon, très fidèlement, d''après une photo. Maëlle peint
    la sienne avec des couleurs vives inventées, un sourire immense et des mains très grandes. Compare les deux portraits
    : quel est leur rapport au réel, et lequel, selon toi, dit le plus de choses sur la personne ? Justifie.'
  criteres:
  - L'élève identifie la recherche de ressemblance chez Adam et l'écart volontaire chez Maëlle.
  - L'élève explique l'effet d'au moins un écart (couleurs, sourire, mains) avec le vocabulaire plastique.
  - L'élève donne un avis argumenté, en reconnaissant ce que chaque choix apporte.
  indices:
    relance: Lequel des deux portraits cherche à être exact, et lequel transforme la personne ?
    methode: Décris chaque portrait, dis son rapport au réel, puis explique ce qu'exprime chaque écart chez Maëlle avant de
      donner ton avis.
    etape: 'Tu peux commencer ainsi : « Le portrait d''Adam cherche à ressembler exactement au modèle, alors que Maëlle… »'
  solution: 'Exemple de réponse : le portrait d''Adam cherche la ressemblance : on reconnaît précisément la grand-mère. Maëlle
    crée des écarts : les couleurs vives expriment la joie, le sourire immense la gentillesse, les grandes mains peut-être
    tout ce que sa grand-mère fait pour elle. Pour moi, le portrait de Maëlle dit plus de choses sur le caractère, et celui
    d''Adam garde mieux l''apparence : les deux choix se défendent.'
