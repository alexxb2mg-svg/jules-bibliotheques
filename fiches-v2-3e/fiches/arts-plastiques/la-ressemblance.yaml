format: 2
notion: la-ressemblance
version: 4
etat: verifiee
declencheurs:
- ça ressemble pas au modèle
- dessiner comme en vrai
- copier la réalité
- hyperréalisme
- déformer un visage exprès
- c'est pas réaliste
- image trompeuse retouchée
- portrait déformé
- dessin fidèle ou fantaisiste
- Magritte ceci
prerequis:
- 4e-la-ressemblance
essentiel: 'Une image ressemble à son modèle quand on reconnaît en elle ce qui existe dans le réel : formes, proportions,
  couleurs, lumière. Mais une image n''est jamais la chose elle-même. René Magritte le rappelle dans La Trahison des images
  (1929, huile sur toile) : sous une pipe très bien peinte, il écrit « Ceci n''est pas une pipe ».


  Certains artistes cherchent une ressemblance très poussée. Chuck Close peint son Big Self-Portrait (1967-1968, acrylique
  sur toile) à partir d''une photographie, avec une précision qui rappelle la photo : c''est l''hyperréalisme.


  D''autres créent volontairement un écart avec le réel : ils déforment, simplifient, exagèrent ou changent les couleurs.
  Cet écart a une valeur expressive : il dit une émotion, un point de vue, de l''humour ou de l''étrangeté. Dans le Portrait
  de Dora Maar (1937, huile sur toile), Pablo Picasso montre le visage à la fois de face et de profil. Vers 1590, Giuseppe
  Arcimboldo peint l''empereur Rodolphe II en Vertumne, avec un visage entièrement fait de fruits, de légumes et de fleurs
  : on reconnaît un visage, construit avec autre chose.


  Il faut distinguer trois cas :

  - la figuration ressemblante : on reconnaît le modèle tel qu''il est ;

  - la figuration avec écart : on reconnaît encore le modèle, mais l''image le transforme ;

  - l''abstraction : on ne reconnaît plus rien de réel.


  Ressemblance et vraisemblance ne sont pas la même chose. La ressemblance compare l''image à un modèle réel. La vraisemblance,
  c''est ce qui paraît possible, crédible : un dragon bien dessiné, avec des écailles, des ombres et un décor cohérent, peut
  être vraisemblable alors qu''il n''existe pas. C''est ainsi que les images construisent des fictions : cinéma, jeux vidéo,
  images retouchées.


  Une image très ressemblante peut d''ailleurs tromper : une photo retouchée ou générée à l''ordinateur peut sembler vraie
  sans l''être.


  Au brevet, on attend que tu identifies le rapport au réel (ressemblance, écart, fiction), que tu nommes l''écart et son
  effet, et que tu distingues ressemblance et vraisemblance.

  '
methode:
- Se demander s'il existe un modèle réel, et si l'image cherche à lui ressembler.
- 'Repérer les écarts avec le réel : proportions, formes, couleurs, matières, point de vue.'
- 'Dire l''effet de ces écarts : expression, humour, étrangeté, émotion.'
- 'Distinguer : ressemble-t-elle à quelque chose de réel (ressemblance), ou paraît-elle crédible (vraisemblance) ?'
vocabulaire:
- terme: ressemblance
  definition: le rapport d'une image à un modèle réel que l'on reconnaît
- terme: vraisemblance
  definition: le caractère de ce qui paraît possible et crédible, même si cela n'existe pas
- terme: écart
  definition: la différence volontaire entre l'image et le réel (déformation, simplification, exagération)
- terme: hyperréalisme
  definition: courant artistique qui recherche une ressemblance extrême avec le réel, souvent à partir de photographies
- terme: figuration
  definition: le fait de représenter des êtres ou des choses reconnaissables
- terme: abstraction
  definition: le fait de ne plus représenter rien de reconnaissable dans le réel
- terme: fiction
  definition: histoire ou image inventée, qui ne décrit pas le réel
- terme: valeur expressive
  definition: ce qu'un écart fait ressentir ou dit de la personne ou du sujet
erreurs_frequentes:
- Croire qu'une image réussie est forcément une image ressemblante.
- Confondre ressemblance (rapport à un modèle réel) et vraisemblance (ce qui paraît crédible).
- Penser qu'un écart avec le réel est une maladresse, alors qu'il peut être un choix expressif.
- Confondre une image déformée, où l'on reconnaît encore le modèle, et une image abstraite, où l'on ne reconnaît plus rien.
- Oublier qu'une image, même très ressemblante, n'est pas la chose elle-même.
exemple:
  enonce: 'Production fictive : un élève dessine son chat très fidèlement au crayon, puis le redessine avec des yeux énormes
    et un corps minuscule. Qu''est-ce qui change ?'
  solution: 'Le premier dessin cherche la ressemblance : on reconnaît le chat tel qu''il est. Le second crée un écart : les
    proportions sont exagérées. On reconnaît encore le chat, mais l''image exprime autre chose, par exemple la tendresse ou
    l''humour. L''écart devient un choix expressif.'
exercices:
- id: paraitre-credible
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le caractère d'une image qui paraît possible et crédible, même si ce qu'elle montre n'existe pas
    (par exemple un dragon dessiné avec des écailles et des ombres réalistes) ?
  reponse:
    acceptees:
    - vraisemblance
    fautes_tolerees: 1
  indices:
    relance: Le dragon n'a pas de modèle réel. Qu'est-ce qui le rend quand même convaincant ?
    methode: 'Cherche un nom formé sur l''expression « vrai » + « semblable » : ce qui semble vrai.'
    etape: Le mot commence par « vrai… » et se termine par « -ance ».
  pieges:
  - si:
      valeur: ressemblance
    relance: 'La ressemblance compare l''image à un modèle réel. Ici il n''y a pas de modèle : on se demande si l''image paraît
      crédible.'
  - si:
      valeur: réalisme
    relance: Tu es proche. Quel nom désigne ce qui semble vrai, même quand c'est inventé ?
  solution: 'La vraisemblance : l''image paraît possible et crédible, même si ce qu''elle montre n''existe pas. Le dragon
    est vraisemblable, mais il ne ressemble à aucun modèle réel.'
- id: magritte-pipe
  type: choix
  difficulte: 1
  enonce: Dans La Trahison des images (1929), René Magritte peint une pipe très reconnaissable et écrit dessous « Ceci n'est
    pas une pipe ». Pourquoi ?
  reponse:
    options:
    - id: a
      texte: Il s'est trompé dans le texte
    - id: b
      texte: Parce que c'est l'image d'une pipe, et pas une vraie pipe qu'on pourrait fumer
    - id: c
      texte: Pour faire la publicité d'une marque de pipes
    - id: d
      texte: Parce que l'objet peint est en réalité un chapeau
    bonnes:
    - b
  indices:
    relance: Peux-tu fumer, remplir ou tenir la pipe du tableau ?
    methode: Demande-toi quelle est la différence entre un objet et sa représentation.
    etape: Ce que l'on voit sur la toile, ce sont des couleurs posées sur une surface plane. Quelle réponse le dit ?
  pieges:
  - si:
      contient:
      - a
    relance: Magritte a peint cette phrase avec soin, exprès, sous la pipe. Que veut-il nous faire remarquer ?
  - si:
      contient:
      - c
    relance: 'Le tableau ne donne aucune marque. Qu''est-ce que Magritte interroge plutôt : l''objet ou son image ?'
  - si:
      contient:
      - d
    relance: 'La pipe est très reconnaissable. Le jeu porte ailleurs : est-ce une vraie pipe ?'
  solution: 'Magritte rappelle qu''une image n''est pas la chose représentée (b) : c''est une peinture de pipe, pas une pipe.
    Même très ressemblante, une image reste une image.'
- id: rapport-au-reel
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre ou production à son rapport au réel.
  reponse:
    gauche:
    - id: a
      texte: Big Self-Portrait de Chuck Close (1967-1968), peint à partir d'une photographie avec une grande précision
    - id: b
      texte: Portrait de Dora Maar de Pablo Picasso (1937), un visage montré à la fois de face et de profil
    - id: c
      texte: La Trahison des images de René Magritte (1929), une pipe peinte avec « Ceci n'est pas une pipe »
    - id: d
      texte: 'Production fictive : un dragon dessiné avec ombres et écailles, intégré dans une photo de la cour du collège'
    droite:
    - id: w
      texte: Recherche une ressemblance extrême avec le réel
    - id: x
      texte: Crée un écart expressif en déformant le visage
    - id: y
      texte: Rappelle qu'une image ressemblante n'est pas la chose elle-même
    - id: z
      texte: Rend crédible une fiction sans modèle réel
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Laquelle de ces images montre quelque chose qui n'existe pas du tout ?
    methode: Pour chaque image, demande-toi s'il y a un modèle réel, et si l'image s'en rapproche, s'en éloigne, ou interroge
      ce rapport.
    etape: Le dragon n'a pas de modèle réel. Chuck Close part d'une photographie. Place maintenant Picasso et Magritte.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel des deux tableaux du XXe siècle déforme les traits, et lequel joue avec
      les mots ?
  - si:
      diagnostic: associations_fausses
    relance: Pars du dragon, qui n'a pas de modèle, puis de l'œuvre peinte d'après une photo, et place les deux autres.
  solution: 'Chuck Close : ressemblance extrême (hyperréalisme). Picasso : écart expressif, face et profil réunis. Magritte
    : une image n''est pas la chose. Le dragon : fiction vraisemblable, sans modèle réel.'
- id: modifier-les-formes
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le fait de modifier volontairement les formes ou les proportions d'un modèle, tout en le laissant
    reconnaissable, pour exprimer quelque chose ?
  reponse:
    acceptees:
    - déformation
    - déformer
    - distorsion
    fautes_tolerees: 1
  indices:
    relance: 'Pense au visage de Dora Maar peint par Picasso : que fait-il subir aux formes du visage ?'
    methode: Cherche un nom formé sur « forme » avec un préfixe qui veut dire « défaire ».
    etape: Le mot commence par « dé- » et contient « forme ».
  pieges:
  - si:
      valeur: abstraction
    relance: Dans l'abstraction, on ne reconnaît plus de modèle. Ici on le reconnaît encore, mais transformé. Quel mot convient
      ?
  - si:
      valeur: caricature
    relance: La caricature en est un exemple, souvent pour faire rire. Quel mot plus général désigne le fait de modifier les
      formes ?
  solution: 'La déformation : on modifie volontairement les formes ou les proportions d''un modèle, qui reste reconnaissable,
    pour exprimer quelque chose.'
- id: arcimboldo-ecart
  type: choix
  difficulte: 2
  enonce: 'Vers 1590, Giuseppe Arcimboldo peint l''empereur Rodolphe II en Vertumne : le visage est entièrement composé de
    fruits, de légumes et de fleurs. Que peut-on dire de ce portrait ?'
  reponse:
    options:
    - id: a
      texte: Il ressemble au visage de l'empereur comme une photographie
    - id: b
      texte: 'Il joue sur un écart : on reconnaît un visage, mais construit avec autre chose'
    - id: c
      texte: C'est une peinture abstraite, sans rien de reconnaissable
    bonnes:
    - b
  indices:
    relance: Reconnaît-on encore un visage ? Et avec quoi est-il fait ?
    methode: 'Compare deux choses : ce que l''on reconnaît dans l''ensemble, et ce que l''on voit de près.'
    etape: De loin on voit un visage, de près des fruits et des légumes. Est-ce une copie fidèle, ou autre chose ?
  pieges:
  - si:
      contient:
      - a
    relance: 'Un nez en forme de poire, des joues en pommes : est-ce la façon dont on voit un visage réel ?'
  - si:
      contient:
      - c
    relance: Dans une peinture abstraite, on ne reconnaît rien. Ici, reconnaît-on un visage ?
  solution: 'Arcimboldo joue sur un écart (b) : le visage reste reconnaissable, mais il est composé de fruits, de légumes
    et de fleurs. L''image surprend et amuse, tout en étant un portrait.'
- id: deux-portraits
  type: ouverte
  difficulte: 3
  enonce: 'Productions fictives : Adam dessine sa grand-mère au crayon, très fidèlement, d''après une photo. Maëlle peint
    la sienne avec des couleurs vives inventées, un sourire immense et des mains très grandes. Compare les deux portraits
    : quel est leur rapport au réel, et lequel, selon toi, dit le plus de choses sur la personne ? Justifie.'
  criteres:
  - L'élève identifie la recherche de ressemblance chez Adam et l'écart volontaire chez Maëlle.
  - L'élève explique l'effet d'au moins un écart (couleurs, sourire, mains) avec le vocabulaire plastique.
  - L'élève donne un avis argumenté, en reconnaissant ce que chaque choix apporte.
  indices:
    relance: Lequel des deux portraits cherche à être exact, et lequel transforme la personne ?
    methode: Décris chaque portrait, dis son rapport au réel, puis explique ce qu'exprime chaque écart chez Maëlle avant de
      donner ton avis.
    etape: 'Tu peux commencer ainsi : « Le portrait d''Adam cherche à ressembler exactement au modèle, alors que Maëlle… »'
  solution: 'Exemple de réponse : le portrait d''Adam cherche la ressemblance : on reconnaît précisément la grand-mère. Maëlle
    crée des écarts : les couleurs vives expriment la joie, le sourire immense la gentillesse, les grandes mains peut-être
    tout ce que sa grand-mère fait pour elle. Pour moi, le portrait de Maëlle dit plus de choses sur le caractère, et celui
    d''Adam garde mieux l''apparence : les deux choix se défendent.'
- id: nblm-quel-courant-artistique-cherche-une-ress-1
  type: choix
  difficulte: 2
  enonce: Quel courant artistique cherche une ressemblance extrême avec le réel en cherchant à copier la réalité, le plus
    souvent à partir de photographies ?
  reponse:
    options:
    - id: o1
      texte: L'hyperréalisme
    - id: o2
      texte: L'abstraction
    - id: o3
      texte: L'art informel
    - id: o4
      texte: Le surréalisme
    bonnes:
    - o1
  indices:
    relance: Réfléchis au terme qui pousse le mot 'réalisme' à son degré le plus extrême.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''art abstrait ne cherche pas à copier le réel et ne représente aucun objet ou personnage
      reconnaissable.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : l''art informel est une démarche abstraite centrée sur la matière et le geste, non sur l''imitation
      du réel.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le surréalisme explore le rêve et l''inconscient plutôt que la copie exacte de la réalité.'
  solution: L'hyperréalisme. L'hyperréalisme est le courant représenté par des artistes comme Chuck Close qui recherchent
    une précision photographique extrême.
- id: nblm-lorsqu-un-artiste-choisit-de-deformer-un-2
  type: choix
  difficulte: 2
  enonce: Lorsqu'un artiste choisit de déformer un visage exprès, comme Pablo Picasso montrant un visage de face et de profil
    dans le Portrait de Dora Maar, comment qualifie-t-on ce choix ?
  reponse:
    options:
    - id: o1
      texte: Un écart volontaire à valeur expressive
    - id: o2
      texte: Une maladresse technique du peintre
    - id: o3
      texte: Un passage irréversible vers l'art abstrait
    - id: o4
      texte: Une recherche de vraisemblance photographique
    bonnes:
    - o1
  indices:
    relance: Pense au terme qui désigne la différence créée volontairement entre l'image peinte et la réalité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que déformer ou ne pas dessiner de manière ressemblante est une faute ou un manque
      de savoir-faire.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre déformation figurative (où le modèle reste reconnaissable) et abstraction (où rien
      n''est identifiable).'
  - si:
      contient:
      - o4
    relance: 'Erreur : la déformation créée par Picasso s''éloigne délibérément de la fidélité photographique au modèle.'
  solution: Un écart volontaire à valeur expressive. Déformer le modèle est un choix plastique intentionnel qui permet de
    transmettre une émotion, une idée ou un point de vue.
- id: nblm-un-eleve-pense-que-pour-dessiner-comme-e-3
  type: choix
  difficulte: 2
  enonce: Un élève pense que pour « dessiner comme en vrai », il faut obligatoirement un modèle réel. Pourquoi un dragon imaginé
    peut-il paraître « vrai » alors qu'il n'existe pas ?
  reponse:
    options:
    - id: o1
      texte: Parce qu'il possède de la vraisemblance (des détails crédibles comme des écailles, des ombres et un décor cohérent)
    - id: o2
      texte: Parce qu'il s'agit d'une ressemblance directe avec un animal réel
    - id: o3
      texte: Parce que c'est une représentation entièrement abstraite
    - id: o4
      texte: Parce qu'il copie fidèlement une photographie du modèle
    bonnes:
    - o1
  indices:
    relance: Distingue la comparaison avec un modèle réel existant (ressemblance) et le caractère crédible d'une fiction (vraisemblance).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la ressemblance nécessite la comparaison avec un modèle du monde réel, ce qui n''existe pas pour un
      dragon.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le dragon est une figure reconnaissable, il ne s''agit donc pas d''art abstrait.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la créature étant fictive, elle ne provient pas de la photographie d''un spécimen vivant.'
  solution: Parce qu'il possède de la vraisemblance (des détails crédibles comme des écailles, des ombres et un décor cohérent).
    La vraisemblance rend une créature imaginaire crédible et possible aux yeux du spectateur grâce à une cohérence visuelle.
- id: nblm-devant-le-dessin-d-un-chat-aux-yeux-enor-4
  type: choix
  difficulte: 2
  enonce: 'Devant le dessin d''un chat aux yeux énormes, un élève affirme : « ça ressemble pas au modèle, la peinture est
    donc ratée ! ». Quelle est la bonne analyse artistique ?'
  reponse:
    options:
    - id: o1
      texte: 'Une œuvre réussie n''est pas forcément ressemblante : l''exagération est un choix expressif'
    - id: o2
      texte: L'élève a raison, le dessin aurait dû reproduire le chat à l'identique
    - id: o3
      texte: Le dessin est devenu une œuvre abstraite car les proportions ont changé
    - id: o4
      texte: Il s'agit d'une œuvre hyperréaliste basée sur un chat mutant
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi qu'un écart intentionnel avec le modèle n'est pas une faute mais un parti pris plastique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : juger la valeur d''une production artistique uniquement sur le critère de la copie conforme.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le chat reste clairement reconnaissable, il s''agit d''une figuration déformée et non d''abstraction.'
  - si:
      contient:
      - o4
    relance: 'Erreur : l''hyperréalisme recherche une fidélité photographique stricte sans déformer les proportions de manière
      expressive.'
  solution: 'Une œuvre réussie n''est pas forcément ressemblante : l''exagération est un choix expressif. La réussite d''une
    œuvre ne se réduit pas à l''imitation exacte du réel ; l''écart apporte de l''émotion, de l''humour ou du sens.'
- id: nblm-dans-la-trahison-des-images-de-rene-magr-5
  type: choix
  difficulte: 2
  enonce: Dans La Trahison des images de René Magritte, l'artiste peint une pipe très fidèle puis écrit dessous « Ceci n'est
    pas une pipe ». Que démontre cette œuvre ?
  reponse:
    options:
    - id: o1
      texte: Une image, même très ressemblante, n'est jamais la chose elle-même
    - id: o2
      texte: Magritte ne savait pas peindre correctement les objets du quotidien
    - id: o3
      texte: Il faut obligatoirement écrire du texte sous un tableau pour qu'il soit ressemblant
    - id: o4
      texte: Il s'agit d'un ready-made fabriqué en usine et exposé dans un musée
    bonnes:
    - o1
  indices:
    relance: Demande-toi si l'on peut bourrer de tabac et allumer la pipe représentée sur le tableau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la pipe est peinte avec une grande précision classique et un réel souci du détail.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la légende fait partie de la démarche philosophique de Magritte, elle n''est pas une condition de la
      ressemblance.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre une peinture représentant un objet et un ready-made qui est un objet réel présenté
      tel quel.'
  solution: Une image, même très ressemblante, n'est jamais la chose elle-même. Magritte rappelle qu'une peinture est une
    représentation constituée de pigments sur toile, qu'on ne peut pas fumer comme un vrai objet.
- id: nblm-parmi-les-propositions-suivantes-quelles-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes, quelles sont les DEUX affirmations correctes concernant la ressemblance et l'écart
    en arts plastiques ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La ressemblance est le rapport d'une image à un modèle réel que l'on reconnaît
    - id: o2
      texte: L'écart est la différence volontaire entre l'image et le réel (déformation, simplification, exagération)
    - id: o3
      texte: Une œuvre n'est considérée comme réussie que si elle ressemble parfaitement à son modèle
    - id: o4
      texte: Toute déformation d'un visage transforme immédiatement l'image en œuvre abstraite
    bonnes:
    - o1
    - o2
  indices:
