- id: mot-hyperrealisme
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le courant artistique qui recherche une ressemblance extrême avec le réel, souvent à partir
    de photographies, comme les portraits de Chuck Close ?
  reponse:
    acceptees:
    - hyperréalisme
    - hyperrealisme
    - l'hyperréalisme
    - hyper-réalisme
    - hyper réalisme
    fautes_tolerees: 2
  indices:
    relance: Ce courant pousse la ressemblance au-delà du réalisme habituel. Quel préfixe exprime « très, extrême » ?
    methode: Le mot est formé de « hyper » et de « réalisme ».
    etape: Le mot commence par « hyper- » et se termine par « -réalisme ».
  pieges:
  - si:
      valeur: réalisme
    relance: Le réalisme représente le réel avec fidélité, mais ici la ressemblance est poussée à l'extrême. Quel préfixe
      ajoute-t-on ?
  - si:
      valeur: abstraction
    relance: 'L''abstraction ne montre rien de reconnaissable : c''est l''inverse d''une ressemblance extrême.'
  - si:
      diagnostic: mauvaise_reponse
    relance: Cherche un mot formé de « hyper » et de « réalisme ».
  solution: 'C''est l''hyperréalisme : une ressemblance extrême avec le réel, souvent à partir de photographies.'
- id: trois-cas
  type: choix
  difficulte: 3
  enonce: 'Une élève (fictive) peint un visage avec une peau verte et des yeux énormes : on reconnaît bien un visage. De quel
    rapport au réel s''agit-il ?'
  reponse:
    options:
    - id: a
      texte: 'Une figuration avec écart : le modèle reste reconnaissable, mais il est transformé'
    - id: b
      texte: 'Une figuration ressemblante : le visage est représenté tel qu''il est'
    - id: c
      texte: 'Une abstraction : plus rien de réel n''est reconnaissable'
    - id: d
      texte: Une photographie retouchée
    bonnes:
    - a
  indices:
    relance: Le visage est-il reconnaissable ? Est-il représenté tel qu'il est ?
    methode: 'Reprends les trois cas de ta leçon : ressemblante, avec écart, abstraction.'
    etape: Comme le visage est reconnaissable mais transformé, cherche le cas qui associe les deux.
  pieges:
  - si:
      contient:
      - b
    relance: Une peau verte n'est pas la couleur réelle d'un visage. Le modèle est-il vraiment représenté tel qu'il est ?
  - si:
      contient:
      - c
    relance: 'On reconnaît encore un visage : ce n''est donc pas de l''abstraction.'
  - si:
      contient:
      - d
    relance: Il s'agit d'une peinture, pas d'une photographie.
  solution: 'Figuration avec écart : on reconnaît le visage, mais les couleurs et les proportions sont transformées.'
