  - si:
      contient:
      - o4
    relance: 'Erreur typique : tant que le visage reste identifiable, l''œuvre demeure figurative.'
  solution: La ressemblance est le rapport d'une image à un modèle réel que l'on reconnaît ; L'écart est la différence volontaire
    entre l'image et le réel (déformation, simplification, exagération). C'est la définition exacte de la ressemblance vis-à-vis
    d'un modèle existant dans le monde réel.
