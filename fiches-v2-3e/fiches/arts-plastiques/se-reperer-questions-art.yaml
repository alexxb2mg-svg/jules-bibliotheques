# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: se-reperer-questions-art
version: 1
etat: verifiee
declencheurs:
- est-ce que c'est de l'art
- n'importe qui pourrait le faire
- de quelle époque date
- pourquoi c'est exposé dans un musée
- c'est quoi un chef-d'œuvre
prerequis:
- 4e-se-reperer-questions-art
- sexprimer-analyser-sa-pratique
couverture: 'Couvre quelques repères d''œuvres de domaines, d''époques et d''aires culturelles variés, et les questions qu''elles
  posent sur l''art. La liste d''œuvres est volontairement courte : ce sont des exemples, pas un programme.'
essentiel: 'Se repérer, c''est reconnaître des œuvres de domaines, d''époques et de cultures variés, et comprendre pourquoi
  elles comptent.


  Quelques repères. Les peintures de la grotte de Lascaux (Dordogne) datent de la Préhistoire : des animaux peints sur les
  parois d''une grotte. La Joconde, de Léonard de Vinci (peinte vers 1503-1519), est une peinture à l''huile sur panneau de
  bois de la Renaissance italienne. La Grande Vague de Kanagawa, de Hokusai (vers 1830-1831), est une estampe japonaise gravée
  sur bois. Fontaine, de Marcel Duchamp (1917), est un urinoir du commerce, signé « R. Mutt » et présenté comme une œuvre
  : c''est un ready-made. Guernica, de Pablo Picasso (1937), est une grande peinture en noirs, blancs et gris, peinte après
  le bombardement de la ville basque de Guernica pendant la guerre d''Espagne.


  Pour situer une œuvre, on observe ses caractéristiques : plastiques (technique, matériaux, formes), culturelles (lieu, usage),
  sémantiques (ce qu''elle raconte ou signifie) et symboliques.


  Les œuvres posent des questions : qu''est-ce qu''une œuvre d''art ? Une image doit-elle ressembler à quelque chose ? L''art
  peut-il réagir à l''actualité ?


  On interroge une œuvre de deux points de vue : celui de l''auteur (ses intentions, son contexte) et celui du spectateur
  (ce qu''il perçoit, ressent, comprend). On peut prendre part au débat, avec des arguments.

  '
methode:
- 'Identifier l''œuvre : titre, artiste, date, technique, lieu.'
- Relever ses caractéristiques plastiques, culturelles et symboliques pour la situer dans le temps et dans l'espace.
- Se demander quelle question l'œuvre pose sur l'art.
- Distinguer le point de vue de l'auteur et celui du spectateur.
- Donner son avis en l'appuyant sur des arguments, et écouter les arguments opposés.
vocabulaire:
- terme: ready-made
  definition: objet manufacturé choisi par un artiste et présenté comme une œuvre, sans ou presque sans transformation
- terme: estampe
  definition: image imprimée à partir d'une matrice gravée (bois, métal, pierre…), que l'on peut tirer en plusieurs exemplaires
- terme: peinture pariétale
  definition: peinture réalisée sur les parois d'une grotte
- terme: patrimoine
  definition: ensemble des œuvres et des biens hérités du passé, que l'on conserve et transmet
erreurs_frequentes:
- Juger une œuvre seulement avec « j'aime » ou « je n'aime pas », sans argument.
- Croire qu'une œuvre d'art doit forcément être belle ou demander une grande habileté.
- 'Confondre les époques : la Renaissance (XVe-XVIe siècles) n''est pas le XXe siècle.'
- 'Oublier le contexte : Guernica ne se comprend pas sans la guerre d''Espagne.'
- Ne voir l'œuvre que du point de vue du spectateur, sans se demander ce que l'artiste voulait interroger.
exemple:
  enonce: Pourquoi Fontaine de Marcel Duchamp (1917) fait-elle encore débat ?
  solution: 'Duchamp n''a pas fabriqué cet urinoir : il l''a choisi, retourné, signé « R. Mutt » et proposé à une exposition.
    Du point de vue de l''auteur, c''est le choix de l''artiste qui fait l''œuvre. Du point de vue du spectateur, on peut
    être choqué ou amusé. L''œuvre pose une question : qu''est-ce qui fait qu''un objet devient une œuvre d''art ?'
exercices:
- id: oeuvre-et-technique
  type: association
  difficulte: 1
  enonce: Relie chaque œuvre à sa technique.
  reponse:
    gauche:
    - id: a
      texte: Les animaux de la grotte de Lascaux
    - id: b
      texte: La Grande Vague de Kanagawa, de Hokusai
    - id: c
      texte: La Joconde, de Léonard de Vinci
    - id: d
      texte: Fontaine, de Marcel Duchamp
    droite:
    - id: w
      texte: Peinture sur les parois d'une grotte
    - id: x
      texte: Estampe gravée sur bois
    - id: y
      texte: Peinture à l'huile sur panneau de bois
    - id: z
      texte: Objet manufacturé présenté comme une œuvre
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Laquelle de ces œuvres se trouve encore aujourd'hui à l'endroit exact où elle a été peinte ?
    methode: 'Pour chaque œuvre, demande-toi : a-t-elle été peinte, imprimée, ou choisie toute faite ?'
    etape: Lascaux est une grotte. Fontaine est un urinoir que Duchamp n'a pas fabriqué. Place maintenant l'œuvre japonaise
      et le portrait de la Renaissance.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle de ces œuvres peut être imprimée en plusieurs exemplaires ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'œuvre préhistorique et par l'objet du commerce, puis place les deux autres.
  solution: 'Lascaux : peinture sur les parois d''une grotte. La Grande Vague : estampe gravée sur bois (vers 1830-1831).
    La Joconde : peinture à l''huile sur panneau de bois (vers 1503-1519). Fontaine : objet manufacturé présenté comme une
    œuvre, un ready-made (1917).'
- id: chronologie-des-oeuvres
  type: ordre
  difficulte: 2
  enonce: Range ces œuvres de la plus ancienne à la plus récente.
  reponse:
    elements:
    - id: lascaux
      texte: Les peintures de la grotte de Lascaux
    - id: joconde
      texte: La Joconde, de Léonard de Vinci
    - id: vague
      texte: La Grande Vague de Kanagawa, de Hokusai
    - id: fontaine
      texte: Fontaine, de Marcel Duchamp
    - id: guernica
      texte: Guernica, de Pablo Picasso
  indices:
    relance: Laquelle de ces œuvres date d'avant l'invention de l'écriture ?
    methode: Place d'abord la plus ancienne, puis la Renaissance, puis le XIXe siècle, et enfin les deux œuvres du XXe siècle.
    etape: 'Lascaux date de la Préhistoire ; La Joconde de la Renaissance. Hokusai travaille au XIXe siècle. Les deux dernières
      œuvres sont du XXe siècle : laquelle a été peinte pendant la guerre d''Espagne ?'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque. Deux œuvres voisines sont inversées. Fontaine date de 1917, Guernica de 1937 : as-tu bien placé les
      deux dernières ?'
  - si:
      diagnostic: ordre_faux
    relance: Commence par la Préhistoire, puis la Renaissance italienne, et range ensuite les œuvres plus récentes.
  solution: Lascaux (Préhistoire), La Joconde (vers 1503-1519), La Grande Vague (vers 1830-1831), Fontaine (1917), Guernica
    (1937).
- id: objet-choisi-par-lartiste
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on un objet manufacturé choisi par un artiste et présenté comme une œuvre, comme Fontaine de Marcel
    Duchamp (1917) ?
  reponse:
    acceptees:
    - ready-made
    - readymade
    fautes_tolerees: 1
  indices:
    relance: Duchamp a-t-il fabriqué cet urinoir lui-même ?
    methode: 'Le mot est anglais : il veut dire « déjà fait », « tout fait ».'
    etape: 'C''est un mot composé anglais : « ready » (prêt) suivi du participe de « to make ».'
  pieges:
  - si:
      valeur: sculpture
    relance: Une sculpture est façonnée par l'artiste. Ici, l'objet est acheté dans le commerce. Quel mot anglais désigne
      un objet « déjà fait » ?
  - si:
      valeur: installation
    relance: Une installation occupe un lieu. Ici, c'est un seul objet, choisi tout fait. Quel est son nom ?
  solution: 'Un ready-made : un objet manufacturé, « déjà fait », que l''artiste choisit et présente comme une œuvre. Fontaine
    (1917) est un urinoir signé « R. Mutt ».'
- id: oeuvre-et-question
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à la question sur l'art qu'elle pose surtout.
  reponse:
    gauche:
    - id: a
      texte: Fontaine, de Marcel Duchamp (1917), un urinoir du commerce
    - id: b
      texte: Guernica, de Pablo Picasso (1937), peint après le bombardement d'une ville
    - id: c
      texte: Carré noir sur fond blanc, de Kasimir Malevitch (1915), un carré noir peint sur une toile
    - id: d
      texte: Le Pont-Neuf emballé, de Christo et Jeanne-Claude (Paris, 1985), un pont recouvert de toile pendant environ deux
        semaines
    droite:
    - id: w
      texte: Un objet que l'artiste n'a pas fabriqué peut-il être une œuvre ?
    - id: x
      texte: Comment l'art peut-il réagir à la violence de la guerre ?
    - id: y
      texte: Une peinture doit-elle représenter quelque chose de reconnaissable ?
    - id: z
      texte: Une œuvre peut-elle être éphémère et transformer un lieu de tous les jours ?
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Laquelle de ces œuvres ne représente ni personnage, ni objet, ni paysage ?
    methode: 'Pour chaque œuvre, demande-toi ce qu''elle a de surprenant : son origine, son sujet, son absence de sujet, sa
      durée ?'
    etape: Guernica est liée à un événement tragique. L'œuvre de Christo et Jeanne-Claude n'est restée en place que peu de
      temps. Place les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle de ces œuvres est un objet acheté tout fait ?
  - si:
      diagnostic: associations_fausses
    relance: 'Pars de ce que tu sais sur chaque œuvre : un objet du commerce, une guerre, une forme géométrique, un pont emballé.'
  solution: 'Fontaine : un objet non fabriqué peut-il être une œuvre ? Guernica : comment l''art réagit à la guerre. Carré
    noir : une peinture doit-elle représenter quelque chose ? Le Pont-Neuf emballé : une œuvre éphémère qui transforme un
    lieu du quotidien.'
- id: contexte-guernica
  type: choix
  difficulte: 1
  enonce: Pourquoi Pablo Picasso peint-il Guernica en 1937 ?
  reponse:
    options:
    - id: a
      texte: En réaction au bombardement de la ville basque de Guernica pendant la guerre d'Espagne
    - id: b
      texte: Pour célébrer la fin de la Première Guerre mondiale
    - id: c
      texte: Pour décorer une église de Guernica
    - id: d
      texte: Pour illustrer un conte pour enfants
    bonnes:
    - a
  indices:
    relance: Guernica est le nom d'une ville. Que s'est-il passé en Espagne en 1937 ?
    methode: 'Pense à ce que montre le tableau : des corps, des cris, une scène de chaos en noir et blanc. Quel événement
      peut-il évoquer ?'
    etape: En 1937, l'Espagne est en pleine guerre civile, et une ville basque est détruite par des avions. Quelle réponse
      correspond ?
  pieges:
  - si:
      contient:
      - b
    relance: La Première Guerre mondiale s'achève en 1918, près de vingt ans plus tôt. Quelle guerre a lieu en Espagne en
      1937 ?
  - si:
      contient:
      - c
    relance: Le tableau montre des scènes de souffrance et de destruction. Est-ce un décor religieux ?
  - si:
      contient:
      - d
    relance: Le tableau montre des corps et des cris. Ressemble-t-il à une illustration de conte ?
  solution: Picasso peint Guernica en 1937 en réaction au bombardement de la ville basque de Guernica pendant la guerre d'Espagne
    (a). Le tableau est présenté la même année à l'Exposition internationale de Paris.
- id: debat-fontaine
  type: ouverte
  difficulte: 3
  enonce: 'Débat : « Un urinoir acheté dans un magasin peut-il être une œuvre d''art ? » À propos de Fontaine de Marcel Duchamp
    (1917), donne ton avis en quelques phrases, avec au moins un argument du point de vue de l''artiste et un argument du
    point de vue du spectateur.'
  criteres:
  - L'élève donne un avis clair (oui, non, ou nuancé).
  - L'élève avance un argument du point de vue de l'artiste (le choix, le geste de présenter l'objet, la question posée).
  - L'élève avance un argument du point de vue du spectateur (surprise, rejet, réflexion), et tient compte d'un avis opposé.
  indices:
    relance: Qu'est-ce que Duchamp a fait lui-même, s'il n'a pas fabriqué l'objet ?
    methode: Donne ton avis, puis un argument pour l'artiste, puis un argument pour le spectateur, puis réponds à une objection.
    etape: 'Tu peux commencer ainsi : « Pour moi, Fontaine est (ou n''est pas) une œuvre, parce que… »'
  solution: 'Exemple de réponse : pour moi, Fontaine est une œuvre, même si Duchamp ne l''a pas fabriquée. Du point de vue
    de l''artiste, c''est son choix et le fait de présenter l''objet dans une exposition qui en font une œuvre. Du point de
    vue du spectateur, l''objet surprend et oblige à se demander ce qu''est l''art. On peut répondre que l''œuvre ne demande
    aucune habileté, mais elle a changé la façon de penser l''art au XXe siècle.'
- id: nblm-lorsqu-un-eleve-se-demande-est-ce-que-c-1
  type: choix
  difficulte: 2
  enonce: Lorsqu'un élève se demande « est-ce que c'est de l'art ? », quelle erreur fréquente liée aux qualités de l'œuvre
    convient-il d'éviter selon la fiche ?
  reponse:
    options:
    - id: o1
      texte: Croire qu'une œuvre d'art doit forcément être belle ou exiger une grande habileté technique.
    - id: o2
      texte: Penser qu'une œuvre d'art doit obligatoirement raconter une histoire vraie et documentée.
    - id: o3
      texte: Estimer qu'un objet ne devient artistique que s'il est applaudi par une majorité de spectateurs.
    - id: o4
      texte: Penser qu'une œuvre d'art est toujours réalisée de façon collective par plusieurs artistes.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux préjugés fréquents sur la beauté et la virtuosité manuelle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre le récit historique avec la valeur artistique d''une création.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : réduire la nature artistique d''une œuvre à la popularité immédiate auprès du public.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre les projets collaboratifs et les démarches individuelles d''artistes.'
  solution: 'Croire qu''une œuvre d''art doit forcément être belle ou exiger une grande habileté technique. C''est exact :
    la fiche rappelle expressément que juger l''art uniquement par la beauté ou la prouesse technique est une idée reçue fréquente.'
- id: nblm-devant-fontaine-1917-de-marcel-duchamp-c-2
  type: choix
  difficulte: 2
  enonce: Devant « Fontaine » (1917) de Marcel Duchamp, certains disent « n'importe qui pourrait le faire ». Du point de vue
    de l'auteur, qu'est-ce qui transforme cet urinoir en œuvre d'art ?
  reponse:
    options:
    - id: o1
      texte: Le choix de l'artiste, le fait de le retourner, de le signer et de le présenter dans une exposition.
    - id: o2
      texte: Le fait que Duchamp ait sculpté lui-même la porcelaine dans son atelier.
    - id: o3
      texte: La grande rareté et le coût financier extrêmement élevé du matériau d'origine.
    - id: o4
      texte: L'accord préalable et la commande officielle formulée par un musée national.
    bonnes:
    - o1
  indices:
    relance: Pense au rôle de la démarche, de l'intention et du choix conceptuel de l'artiste.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : croire que l''artiste a fabriqué l''objet de ses mains, alors qu''il s''agit d''un objet industriel
      du commerce.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre la valeur marchande du matériau et la démarche conceptuelle de l''artiste.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : penser qu''un objet doit être commandé par une institution pour devenir de l''art.'
  solution: 'Le choix de l''artiste, le fait de le retourner, de le signer et de le présenter dans une exposition. C''est
    exact : c''est l''intention, le choix intellectuel et le changement de contexte imposés par l''artiste qui créent l''œuvre.'
- id: nblm-pour-repondre-a-la-question-de-quelle-ep-3
  type: choix
  difficulte: 2
  enonce: Pour répondre à la question « de quelle époque date cette œuvre ? », à quelle période historique la fiche rattache-t-elle
    « La Joconde » de Léonard de Vinci ?
  reponse:
    options:
    - id: o1
      texte: La Renaissance italienne (vers 1503-1519).
    - id: o2
      texte: La Préhistoire, à la même époque que Lascaux.
    - id: o3
      texte: Le XXe siècle, la même période que le ready-made de Duchamp.
    - id: o4
      texte: Le XIXe siècle japonais, l'époque de la Grande Vague de Hokusai.
    bonnes:
    - o1
  indices:
    relance: Associe Léonard de Vinci au grand mouvement culturel européen des XVe et XVIe siècles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre la Renaissance avec la Préhistoire et les peintures pariétales.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : mélanger les époques en plaçant Léonard de Vinci au XXe siècle.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre la peinture à l''huile italienne du XVIe siècle et l''estampe japonaise du XIXe siècle.'
  solution: 'La Renaissance italienne (vers 1503-1519). C''est exact : la fiche situe précisément La Joconde au début du XVIe
    siècle, durant la Renaissance italienne.'
- id: nblm-pour-comprendre-pourquoi-une-uvre-est-ex-4
  type: choix
  difficulte: 2
  enonce: Pour comprendre « pourquoi une œuvre est exposée dans un musée », sur quoi l'élève doit-il s'appuyer pour dépasser
    le simple jugement « j'aime / je n'aime pas » ?
  reponse:
    options:
    - id: o1
      texte: Sur des arguments analysant les caractéristiques de l'œuvre et son contexte.
    - id: o2
      texte: Sur la somme d'argent dépensée par le musée pour acheter l'œuvre.
    - id: o3
      texte: Sur le nombre de mentions « j'aime » accumulées sur les réseaux sociaux.
    - id: o4
      texte: Sur les dimensions physiques exceptionnelles de l'œuvre par rapport à la salle.
    bonnes:
    - o1
  indices:
    relance: Cherche la démarche d'analyse méthodique qui repose sur la culture plastique et le contexte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : réduire la valeur patrimoniale et artistique d''une œuvre à sa valeur financière.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre l''intérêt artistique d''une œuvre conservée au musée et sa popularité numérique
      actuelle.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : associer la présence au musée uniquement à des critères de taille ou de poids.'
  solution: 'Sur des arguments analysant les caractéristiques de l''œuvre et son contexte. C''est exact : l''analyse des caractéristiques
    plastiques, culturelles, sémantiques et historiques permet de construire une argumentation solide.'
- id: nblm-dans-le-vocabulaire-de-la-fiche-quel-ter-5
  type: choix
  difficulte: 2
  enonce: Dans le vocabulaire de la fiche, quel terme désigne l'ensemble des œuvres héritées du passé que l'on conserve et
    transmet, permettant de comprendre ce qu'est un chef-d'œuvre patrimonial ?
  reponse:
    options:
    - id: o1
      texte: Le patrimoine.
    - id: o2
      texte: Le ready-made.
    - id: o3
      texte: L'estampe.
    - id: o4
      texte: La peinture pariétale.
    bonnes:
    - o1
  indices:
    relance: Pense au mot qui désigne les biens culturels transmis de génération en génération.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le ready-made est un objet du commerce présenté comme œuvre, pas l''héritage culturel dans
      son ensemble.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : l''estampe est une technique d''impression gravée, non le terme générique désignant les biens
      hérités du passé.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ce terme concerne uniquement les peintures réalisées sur la roche ou dans des grottes.'
  solution: 'Le patrimoine. C''est exact : la fiche définit le patrimoine comme l''ensemble des œuvres et des biens hérités
    du passé, conservés et transmis.'
- id: nblm-selon-la-fiche-quels-sont-les-deux-point-6
  type: choix
  difficulte: 3
  enonce: Selon la fiche, quels sont les DEUX points de vue complémentaires qu'il convient de distinguer pour interroger et
    analyser une œuvre d'art ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Celui de l'auteur (ses intentions, son contexte).
    - id: o2
      texte: Celui du spectateur (ce qu'il perçoit, ressent et comprend).
    - id: o3
      texte: Celui du marchand d'art qui fixe le prix de vente.
