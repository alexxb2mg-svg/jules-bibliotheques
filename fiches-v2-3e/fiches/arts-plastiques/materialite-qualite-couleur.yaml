format: 2
notion: materialite-qualite-couleur
version: 2
etat: verifiee
declencheurs:
- pigment et liant
- fabriquer sa propre peinture
- peinture mate ou brillante
- bleu de Klein
- outrenoir de Soulages
- mélanger le cyan et le jaune
prerequis:
- 4e-materialite-qualite-couleur
- qualites-physiques-materiaux
essentiel: 'En peinture, la couleur est une matière. Une peinture est faite de pigments (poudres colorées, d''origine minérale,
  végétale, animale ou chimique) mélangés à un liant, qui les colle au support. Le liant change la peinture : huile de lin
  pour la peinture à l''huile, gomme arabique pour l''aquarelle et la gouache, résine pour l''acrylique, jaune d''œuf pour
  la tempera.


  La sensation colorée dépend de la matière : une même couleur ne se ressent pas pareil si elle est mate ou brillante, épaisse
  ou diluée, lisse ou striée, posée sur du papier ou sur de la toile. Une couche diluée et transparente laisse voir le support
  ; une couche épaisse le couvre.


  Au collège, on utilise souvent les trois primaires du peintre : magenta, cyan et jaune. En les mélangeant deux à deux, on
  obtient les secondaires : cyan + jaune = vert ; magenta + jaune = rouge (orangé) ; magenta + cyan = bleu (violet). La complémentaire
  d''une primaire est le mélange des deux autres (le vert pour le magenta). Ajouter du blanc éclaircit une couleur ; ajouter
  du noir ou sa complémentaire la rabat. Une couleur très vive, pure, est dite saturée.


  Quantité et qualité : une même couleur ne fait pas le même effet en petite touche ou en grand aplat, ni à côté de n''importe
  quelle autre couleur.


  Yves Klein dépose en 1960 la formule de son bleu, l''IKB (International Klein Blue) : un pigment bleu outremer fixé par
  un liant choisi pour garder son aspect mat et poudreux, très intense. Depuis 1979, Pierre Soulages peint ses « outrenoirs
  » : avec un seul noir, selon que la surface est lisse ou striée, la lumière se reflète différemment et le noir paraît clair
  ou sombre.


  Attention au vocabulaire : pigment, liant et support sont trois choses différentes. Le pigment donne la couleur, le liant
  la fixe, le support la reçoit.


  Une même quantité de couleur peut produire des effets opposés selon la qualité : un grand aplat de rouge vif peut écraser
  le regard, alors qu''une petite touche de rouge attire l''œil sur une surface grise.


  Au brevet, on attend que tu relies la sensation (éclat, profondeur, calme) à des choix précis de matière et de quantité.

  '
methode:
- 'Nommer la couleur, puis décrire sa matière : épaisse ou diluée, mate ou brillante, opaque ou transparente, lisse ou striée.'
- Pour un mélange, préciser le modèle utilisé (primaires magenta, cyan, jaune) et les couleurs mélangées.
- 'Observer la quantité : petite touche ou grand aplat, et les couleurs voisines.'
- Dire la sensation produite (chaleur, calme, profondeur, éclat) et la relier aux qualités de la matière colorée.
vocabulaire:
- terme: pigment
  definition: poudre colorée qui donne sa couleur à une peinture
- terme: liant
  definition: substance qui colle les pigments entre eux et au support (huile, gomme arabique, résine, œuf)
- terme: saturation
  definition: 'l''intensité d''une couleur : saturée, elle est vive et pure ; peu saturée, elle paraît grisée'
- terme: couleurs complémentaires
  definition: 'avec les primaires magenta, cyan, jaune : une primaire et le mélange des deux autres (magenta et vert, cyan
    et rouge, jaune et bleu-violet)'
- terme: aplat
  definition: surface de couleur uniforme, sans modelé ni trace visible
erreurs_frequentes:
- 'Croire qu''une couleur n''est qu''un nom (« bleu ») : la matière colorée compte autant que la teinte.'
- 'Mélanger les modèles de couleurs : dire la couleur que l''on mélange, et avec quelles primaires on travaille.'
- Penser qu'on éclaircit toujours une couleur avec de l'eau (en gouache, l'eau la rend plus transparente ; le blanc l'éclaircit).
- 'Oublier que la quantité change l''effet : une petite touche de rouge vif n''agit pas comme un grand mur rouge.'
exemple:
  enonce: 'Une élève (fictive) peint deux carrés avec la même gouache bleue : l''un en couche épaisse, l''autre très diluée
    à l''eau sur papier blanc. Décris la différence.'
  solution: 'Le carré peint en couche épaisse est opaque et couvrant : le bleu est dense et intense, on ne voit plus le papier.
    Le carré dilué est transparent : le blanc du papier passe à travers, le bleu paraît plus clair et plus léger, et on voit
    les traces du pinceau et les variations d''eau. La même couleur produit deux sensations différentes selon la quantité
    de matière.'
exercices:
- id: mot-pigment
  type: texte_court
  difficulte: 1
  enonce: Pour fabriquer une peinture, on mélange une poudre colorée avec un liant (huile, gomme arabique, œuf). Comment s'appelle
    cette poudre colorée ?
  reponse:
    acceptees:
    - pigment
    - pigments
    - un pigment
    fautes_tolerees: 0
  indices:
    relance: Dans une peinture, qu'est-ce qui apporte la couleur, et qu'est-ce qui colle ?
    methode: Le liant colle ; l'autre composant donne la couleur. Cherche son nom dans le vocabulaire de la leçon.
    etape: Le mot commence par « pig- » et a sept lettres.
  pieges:
  - si:
      valeur: liant
    relance: Le liant colle la poudre au support. Comment s'appelle la poudre colorée elle-même ?
  - si:
      valeur: teinte
    relance: La teinte est la couleur que l'on voit. Comment s'appelle la matière en poudre qui la donne ?
  solution: 'C''est le pigment : une poudre colorée que le liant fixe sur le support.'
- id: melange-cyan-jaune
  type: texte_court
  difficulte: 1
  enonce: Avec les trois primaires du peintre (magenta, cyan et jaune), quelle couleur secondaire obtient-on en mélangeant
    le cyan et le jaune ?
  reponse:
    acceptees:
    - vert
    - le vert
    fautes_tolerees: 0
  indices:
    relance: Le cyan est un bleu clair. Que devient un bleu quand on y ajoute du jaune ?
    methode: Une secondaire est le mélange de deux primaires. Fais l'essai sur ta palette avec une goutte de chaque couleur.
    etape: 'Le résultat n''est ni chaud comme l''orange, ni sombre comme le violet : c''est la couleur de la plupart des feuilles
      d''arbres en été.'
  pieges:
  - si:
      valeur: orange
    relance: L'orange s'obtient avec du jaune et une couleur plus chaude. Ici, on mélange le jaune avec le cyan, un bleu clair.
      Quel résultat ?
  - si:
      valeur: violet
    relance: Le violet s'obtient sans jaune. Ici, le jaune fait partie du mélange avec le cyan. Quelle couleur obtient-on
      ?
  solution: Cyan + jaune = vert. C'est une couleur secondaire, complémentaire du magenta.
- id: liants-peintures
  type: association
  difficulte: 2
  enonce: Relie chaque liant à la peinture qu'il permet de fabriquer avec des pigments.
  reponse:
    gauche:
    - id: a
      texte: Huile de lin
    - id: b
      texte: Gomme arabique
    - id: c
      texte: Jaune d'œuf
    - id: d
      texte: Résine acrylique
    droite:
    - id: w
      texte: La peinture à l'huile
    - id: x
      texte: L'aquarelle
    - id: y
      texte: La tempera
    - id: z
      texte: L'acrylique
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Deux associations se devinent au nom même du liant. Lesquelles ?
    methode: Place d'abord les associations évidentes par le nom, puis réfléchis aux deux autres.
    etape: L'huile de lin sert pour la peinture à l'huile. Entre l'œuf et la gomme arabique, lequel sert pour une peinture
      à l'eau très transparente ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux liants dont le nom ne rappelle pas la peinture.
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'huile de lin et la résine acrylique, dont le nom aide ; il reste l'œuf et la gomme arabique.
  solution: 'Huile de lin : peinture à l''huile. Gomme arabique : aquarelle. Jaune d''œuf : tempera. Résine acrylique : acrylique.'
- id: soulages-noir
  type: choix
  difficulte: 2
  enonce: Dans les « outrenoirs » de Pierre Soulages (à partir de 1979), une seule peinture noire couvre toute la toile, mais
    certaines zones paraissent claires et d'autres sombres. Pourquoi ?
  reponse:
    options:
    - id: a
      texte: 'Parce que la surface est tantôt lisse, tantôt striée : elle reflète la lumière de façons différentes'
    - id: b
      texte: Parce que l'artiste a mélangé du blanc dans certaines zones
    - id: c
      texte: Parce que la toile est éclairée par des lampes de couleur
    bonnes:
    - a
  indices:
    relance: Si la couleur est la même partout, qu'est-ce qui peut changer d'une zone à l'autre ?
    methode: 'Pense aux qualités physiques de la matière colorée : épaisseur, texture, aspect mat ou brillant.'
    etape: 'Le noir n''a pas été mélangé. Regarde plutôt le relief de la peinture : que fait-il à la lumière ?'
  pieges:
  - si:
      contient:
      - b
    relance: 'L''énoncé le dit : une seule peinture noire couvre toute la toile. D''où vient alors la différence ?'
  - si:
      contient:
      - c
    relance: Les outrenoirs sont éclairés normalement. C'est la surface de la peinture elle-même qui agit. Comment ?
  solution: 'La surface est tantôt lisse, tantôt striée : selon le relief, la lumière se reflète différemment et le même noir
    paraît clair ou sombre. La sensation colorée dépend de la matière.'
- id: quantite-couleur
  type: choix
  difficulte: 2
  enonce: 'Un élève (fictif) peint le même rouge vif deux fois : en une petite touche au milieu d''une grande feuille grise,
    puis en un grand aplat qui couvre toute une feuille. Que peut-on dire ?'
  reponse:
    options:
    - id: a
      texte: 'La sensation est différente : la petite touche attire l''œil comme un point, le grand aplat envahit le regard'
    - id: b
      texte: C'est exactement le même effet, puisque c'est la même peinture
    - id: c
      texte: Le rouge du grand aplat est moins saturé, puisqu'il y a plus de peinture
    bonnes:
    - a
  indices:
    relance: Devant la grande feuille rouge, que remplit ton champ de vision ? Et devant la feuille grise ?
    methode: 'Pense aux relations entre quantité et qualité de la couleur : la surface couverte et les couleurs voisines comptent.'
    etape: La peinture est bien la même. Ce qui change, c'est la quantité et l'entourage. Quelle réponse en tient compte ?
  pieges:
  - si:
      contient:
      - b
    relance: La peinture est la même, mais est-ce que tu ressens la même chose devant une petite touche et devant un grand
      mur rouge ?
  - si:
      contient:
      - c
    relance: La saturation dépend de la pureté de la couleur, pas de la quantité de peinture. Qu'est-ce qui change vraiment
      ?
  solution: 'La sensation change avec la quantité : la petite touche rouge, entourée de gris, attire l''œil comme un signal
    ; le grand aplat rouge remplit tout le regard et peut sembler chaud, fort, voire envahissant.'
- id: analyser-bleu-klein
  type: ouverte
  difficulte: 3
  enonce: 'Yves Klein a déposé en 1960 la formule de son bleu, l''IKB : un pigment bleu outremer fixé par un liant qui garde
    son aspect mat et poudreux. Il en couvre des toiles entières, d''un seul bleu, sans rien représenter. Explique en quelques
    phrases pourquoi la matière de ce bleu compte autant que sa couleur, et justifie le choix d''un grand format.'
  criteres:
  - L'élève emploie le vocabulaire de la matière colorée (pigment, liant, mat, intensité ou saturation).
  - L'élève explique que l'aspect mat et poudreux, choisi grâce au liant, donne sa sensation au bleu (profondeur, intensité).
  - 'L''élève relie le grand format à la quantité de couleur : le bleu remplit le regard du spectateur.'
  indices:
    relance: Un bleu brillant comme un vernis et un bleu mat et poudreux font-ils le même effet ?
    methode: Parle d'abord de la matière (pigment, liant, aspect), puis de la quantité (format), puis de l'effet sur le spectateur.
    etape: 'Tu peux commencer ainsi : « Klein ne choisit pas seulement une couleur, il choisit une matière… »'
  solution: 'Klein ne choisit pas seulement une couleur, il choisit une matière : un pigment bleu outremer et un liant qui
    garde son aspect mat et poudreux, sans reflet brillant. Le bleu paraît alors très intense et profond. Sur une grande toile,
    la quantité de couleur est telle qu''elle remplit le regard : on n''a plus devant soi une image, mais une sensation de
    bleu.'
- id: nblm-comment-fabrique-t-on-une-peinture-de-ma-1
  type: choix
  difficulte: 2
  enonce: Comment fabrique-t-on une peinture de manière artisanale selon sa composition matérielle ?
  reponse:
    options:
    - id: o1
      texte: En mélangeant des pigments (poudres colorées) avec un liant qui les colle au support.
    - id: o2
      texte: En diluant uniquement des poudres colorées dans de l'eau sans aucun additif.
    - id: o3
      texte: En mélangeant du vernis brillant avec des solvants chimiques transparents.
    - id: o4
      texte: En faisant fondre des matières plastiques directement sur la toile.
    bonnes:
    - o1
  indices:
    relance: 'Pense aux deux composants fondamentaux : la poudre qui donne la couleur et la matière qui la colle.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : sans liant, les pigments en poudre ne colleraient pas au support une fois l''eau évaporée.'
  - si:
      contient:
      - o3
    relance: Attention, le vernis apporte de la brillance ou de la protection, mais il ne donne pas la couleur de base sans
      pigments.
  - si:
      contient:
      - o4
    relance: Confusion avec d'autres techniques plastiques ; la peinture repose sur l'association d'un pigment et d'un liant.
  solution: En mélangeant des pigments (poudres colorées) avec un liant qui les colle au support. C'est exact ! Toute peinture
    est constituée de pigments en poudre associés à un liant (comme l'huile, l'œuf ou la résine).
- id: nblm-en-peinture-quelle-couleur-secondaire-ob-2
  type: choix
  difficulte: 2
  enonce: En peinture, quelle couleur secondaire obtient-on en mélangeant le cyan et le jaune ?
  reponse:
    options:
    - id: o1
      texte: Du vert
    - id: o2
      texte: Du rouge orangé
    - id: o3
      texte: Du bleu violet
    - id: o4
      texte: Du marron rabattu
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi le cercle chromatique et le mélange de deux des trois couleurs primaires du peintre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le rouge orangé s''obtient en mélangeant le magenta et le jaune.'
  - si:
      contient:
      - o3
    relance: 'Attention : le bleu violet s''obtient en mélangeant le magenta et le cyan.'
  - si:
      contient:
      - o4
    relance: 'Faux : le marron s''obtient en mélangeant les trois primaires ensemble ou une couleur avec sa complémentaire.'
  solution: Du vert. C'est exact ! Le cyan et le jaune sont deux couleurs primaires dont le mélange produit la couleur secondaire
    verte.
- id: nblm-quelle-est-la-specificite-materielle-de-3
  type: choix
  difficulte: 2
  enonce: Quelle est la spécificité matérielle de la formule du bleu IKB déposée par Yves Klein en 1960 ?
  reponse:
    options:
    - id: o1
      texte: Il utilise un pigment bleu outremer fixé par un liant spécial qui conserve un aspect mat, poudreux et très intense.
    - id: o2
      texte: Il utilise une peinture très brillante et vernie pour refléter la lumière comme un miroir.
    - id: o3
      texte: Il dilue énormément la peinture à l'eau pour rendre la couleur transparente sur le support.
    - id: o4
      texte: Il mélange du noir et du cyan pour obtenir un bleu très sombre et brillant.
    bonnes:
    - o1
  indices:
    relance: Observe comment l'artiste a choisi son liant pour préserver l'état d'origine du pigment.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : Klein cherchait au contraire un rendu mat et velouté, et non un effet brillant miroir.'
  - si:
      contient:
      - o3
    relance: 'Faux : l''IKB est une couleur très saturée, dense et opaque, et non un lavis transparent.'
  - si:
      contient:
      - o4
    relance: 'Confusion : l''IKB repose sur un pigment outremer pur et un liant spécifique, sans ajout de noir.'
  solution: Il utilise un pigment bleu outremer fixé par un liant spécial qui conserve un aspect mat, poudreux et très intense.
    C'est exact ! Yves Klein a choisi un liant particulier pour que le pigment garde la fraîcheur et la matité de la poudre
    pure.
- id: nblm-dans-ses-peintures-dites-outrenoirs-comm-4
  type: choix
  difficulte: 2
  enonce: Dans ses peintures dites « outrenoirs », comment Pierre Soulages parvient-il à faire varier la couleur et la lumière
    en n'utilisant qu'un seul noir ?
  reponse:
    options:
    - id: o1
      texte: En travaillant la surface (lisse ou striée) pour que la lumière s'y reflète différemment.
    - id: o2
      texte: En ajoutant des touches de blanc et de gris sur les zones qu'il veut éclaircir.
    - id: o3
      texte: En mélangeant du pigment bleu outremer à sa peinture noire.
    - id: o4
      texte: En diluant la peinture noire avec plus ou moins d'eau pour créer des transparences.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au travail du peintre sur le relief, la texture et la surface du tableau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : Soulages n''utilise pas de peinture blanche, c''est la lumière physique reflétée par la matière
      noire qui varie.'
  - si:
      contient:
      - o3
    relance: Confusion avec Yves Klein ; Soulages travaille exclusivement la matière de la peinture noire.
  - si:
      contient:
      - o4
    relance: 'Faux : l''effet ne provient pas d''une dilution transparente mais du travail de la texture en surface (reliefs,
      stries).'
  solution: En travaillant la surface (lisse ou striée) pour que la lumière s'y reflète différemment. C'est exact ! Selon
    que la matière est travaillée de façon lisse ou striée, la lumière crée des reflets clairs ou sombres sur le noir.
- id: nblm-pourquoi-deux-peintures-de-meme-teinte-n-5
  type: choix
  difficulte: 2
  enonce: Pourquoi deux peintures de même teinte ne produisent-elles pas la même sensation visuelle selon qu'elles sont mates
    ou brillantes ?
  reponse:
    options:
    - id: o1
      texte: Parce que la sensation colorée dépend de la matière, du liant et de la réaction de la surface avec la lumière.
    - id: o2
      texte: Parce que la peinture brillante contient des pigments d'une teinte complètement différente.
    - id: o3
      texte: Parce qu'une peinture mate est obligatoirement diluée avec de l'eau.
    - id: o4
      texte: Parce que la peinture mate s'efface au bout de quelques minutes sur la toile.
    bonnes:
    - o1
  indices:
    relance: Pense à l'influence de la matière et du liant sur la perception visuelle de la couleur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : le pigment peut être strictement le même, c''est le liant ou la finition qui change la réflexion lumineuse.'
  - si:
      contient:
      - o3
    relance: 'Faux : une peinture mate peut être très épaisse et opaque (comme la gouache ou certaines peintures au liant
      mat).'
  - si:
      contient:
      - o4
    relance: 'Absurde : la matité est une qualité esthétique et physique durable, pas un défaut de fixation.'
  solution: Parce que la sensation colorée dépend de la matière, du liant et de la réaction de la surface avec la lumière.
    C'est exact ! La matité ou la brillance modifie la façon dont la lumière accroche la matière et change notre perception.
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant les pigments et les liants en peinture ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Le pigment est une poudre colorée qui peut être d'origine minérale, végétale, animale ou chimique.
    - id: o2
      texte: Le liant est la substance qui colle les pigments entre eux et permet de les fixer sur le support.
    - id: o3
      texte: En gouache, rajouter de l'eau permet d'éclaircir la couleur en la rendant plus opaque.
    - id: o4
      texte: Le jaune d'œuf est le liant utilisé pour fabriquer la peinture acrylique.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux propositions qui définissent correctement le pigment et le rôle du liant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : ajouter de l''eau rend la peinture plus transparente, alors que c''est l''ajout de blanc
      qui l''éclaircit tout en gardant son opacité.'
  - si:
      contient:
      - o4
    relance: 'Attention : le jaune d''œuf est le liant de la tempera, tandis que l''acrylique utilise une résine synthétique.'
  solution: Le pigment est une poudre colorée qui peut être d'origine minérale, végétale, animale ou chimique ; Le liant est
    la substance qui colle les pigments entre eux et permet de les fixer sur le support. C'est exact ! Les pigments sont les
    particules en poudre qui apportent la teinte à la peinture.
- id: nblm-quel-terme-designe-la-substance-comme-l-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne la substance (comme l'huile de lin, la gomme arabique ou la résine) mélangée aux pigments pour
    les coller au support ?
  reponse:
    acceptees:
    - Le liant
    fautes_tolerees: 1
  indices:
    relance: Pense au mot qui signifie 'lier' ou 'coller' les poudres colorées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Le liant. C''est la réponse exacte : le liant est la substance qui agglomère les pigments et les fixe sur la
    surface.'
- id: nblm-comment-qualifie-t-on-une-couleur-tres-v-8
  type: texte_court
  difficulte: 1
  enonce: Comment qualifie-t-on une couleur très vive et pure, qui n'a pas été mélangée avec du noir, du blanc ou sa complémentaire
    ?
  reponse:
    acceptees:
    - Saturée
    fautes_tolerees: 1
  indices:
    relance: C'est un mot de vocabulaire relatif à l'intensité de la couleur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Saturée. C''est la réponse exacte : une couleur saturée est une couleur intense, éclatante et pure.'
- id: ajouter-du-blanc
  type: choix
  difficulte: 1
  enonce: Que se passe-t-il quand on ajoute du blanc à une peinture colorée ?
  reponse:
    options:
    - id: a
      texte: La couleur devient plus claire
    - id: b
      texte: La couleur devient plus sombre
    - id: c
      texte: La couleur devient plus saturée, plus vive
    - id: d
      texte: La couleur se transforme en sa complémentaire
    bonnes:
    - a
  indices:
    relance: 'Pense à un rouge auquel on ajoute un peu de blanc : que devient-il ?'
    methode: 'Le blanc est la couleur la plus lumineuse : que fait-il à une couleur avec laquelle on le mélange ?'
    etape: 'Écarte d''abord la réponse qui parle de complémentaire : il faut deux primaires pour l''obtenir, pas du blanc.'
  pieges:
  - si:
      contient:
      - b
    relance: C'est le noir qui assombrit. Le blanc fait l'effet inverse.
  - si:
      contient:
      - c
    relance: Une couleur saturée est pure et vive. Ajouter du blanc la dilue en la mélangeant à une autre matière.
  - si:
      contient:
      - d
    relance: La complémentaire d'une primaire est un mélange des deux autres primaires, pas un ajout de blanc.
  solution: Le blanc éclaircit la couleur. Le noir ou la complémentaire la rabattent, et une couleur pure est dite saturée.
