format: 2
notion: representations-statuts-objet
version: 3
etat: generee
declencheurs:
- urinoir de Duchamp
- objet détourné
- objet banal exposé au musée
- objet manufacturé exposé
- nature morte et objet
- accumulation d'objets
prerequis:
- 4e-representations-statuts-objet
- objet-comme-materiau
essentiel: |
  Un objet peut entrer dans l'art de plusieurs façons.

  Il peut être représenté : peint, dessiné, photographié ou sculpté, comme dans une nature morte.

  Il peut aussi être présenté tel quel : c'est le ready-made. En 1917, Marcel Duchamp propose à une exposition un urinoir en porcelaine, retourné et signé « R. Mutt », qu'il intitule Fontaine. L'artiste ne l'a pas fabriqué : c'est son choix, le titre, la signature et le lieu d'exposition qui changent le statut de l'objet.

  Un objet peut enfin être détourné, assemblé ou accumulé. Pablo Picasso assemble une selle et un guidon de vélo pour faire une Tête de taureau (1942). Méret Oppenheim recouvre de fourrure une tasse, sa soucoupe et une cuillère (Le Déjeuner en fourrure, 1936) : l'objet perd sa fonction. L'accumulation répète le même objet en grand nombre pour lui donner un autre sens.

  Le statut de l'objet change selon la façon dont il est présenté : socle, vitrine, cartel, titre, lieu (musée, galerie, rue). Le même objet peut être utile dans une cuisine et devenir œuvre dans un musée.

  L'œuvre est elle-même un objet, de trois manières :
  - un objet matériel, fait de matières, qui peut s'abîmer et qu'on restaure ;
  - un objet d'art, reconnu, exposé et conservé, par exemple dans un musée ;
  - un objet d'étude, que l'on décrit, analyse et compare.

  René Magritte peint une pipe et écrit dessous « Ceci n'est pas une pipe » (La Trahison des images, vers 1929) : l'image d'un objet n'est pas l'objet.

  Ces œuvres posent des questions : qu'est-ce qu'une œuvre d'art ? quel est le rôle de l'artiste ? que regarde le spectateur ?

  Au brevet, on attend que l'élève distingue représenter et présenter, cite un exemple d'artiste et explique comment l'objet change de statut.
methode:
- 'Identifier l''objet : qu''est-ce que c''est, et à quoi sert-il d''habitude ?'
- 'Dire ce que l''artiste en fait : il le représente, le présente tel quel, le détourne, l''assemble ou l''accumule.'
- 'Repérer ce qui a changé : sa fonction, son lieu, son titre, sa signature, sa présentation (socle, vitrine, cartel).'
- 'Dire quelle question l''œuvre pose : qu''est-ce qu''une œuvre d''art ? quel est le rôle de l''artiste ? que regarde
  le spectateur ?'
- Relier à une œuvre d'artiste connue pour appuyer l'explication.
vocabulaire:
- terme: ready-made
  definition: objet manufacturé choisi par un artiste et exposé presque tel quel comme œuvre
- terme: détournement
  definition: le fait de modifier un objet pour lui enlever sa fonction habituelle ou lui donner un autre sens
- terme: assemblage
  definition: œuvre faite en réunissant plusieurs objets ou morceaux d'objets
- terme: nature morte
  definition: représentation d'objets inanimés (fruits, vaisselle, fleurs coupées…)
- terme: statut de l'objet
  definition: 'ce qu''est l''objet aux yeux de tous : objet utile, objet d''art, objet d''étude'
- terme: accumulation
  definition: le fait de réunir en grand nombre le même objet ou des objets semblables dans une œuvre
erreurs_frequentes:
- 'Croire qu''un ready-made est fabriqué par l''artiste : il est choisi, pas fabriqué.'
- Confondre représenter un objet (le peindre, le dessiner) et présenter un objet (exposer l'objet lui-même).
- 'Penser qu''un objet exposé garde son statut d''objet utile : dans l''œuvre, il ne sert plus à sa fonction.'
- Oublier que l'œuvre est aussi un objet matériel, qui s'use, se transporte et se conserve.
exemple:
  enonce: 'Production fictive d''élève : Sami pose une vieille chaise d''école sur un socle blanc au CDI, avec un
    cartel « Attente, 2026 ». Qu''est-ce qui a changé pour cette chaise ?'
  solution: 'La chaise n''est plus faite pour s''asseoir : posée sur un socle, avec un titre et une date, elle est
    présentée comme une œuvre à regarder. Son statut passe d''objet utile à objet d''art, un peu comme les ready-made
    de Marcel Duchamp. Le titre « Attente » donne un sens nouveau : la chaise évoque le temps passé à attendre.'
exercices:
- id: mot-ready-made
  type: texte_court
  difficulte: 1
  enonce: Quel mot anglais désigne un objet manufacturé, choisi par l'artiste et exposé presque tel quel comme œuvre,
    comme Fontaine de Marcel Duchamp (1917) ?
  reponse:
    acceptees:
    - ready-made
    - readymade
    - ready made
    fautes_tolerees: 1
  indices:
    relance: Duchamp a-t-il fabriqué cet urinoir lui-même, ou l'a-t-il trouvé déjà fait ?
    methode: 'Le mot est anglais et veut dire « tout fait » : l''objet est déjà prêt quand l''artiste le choisit.'
    etape: C'est un mot composé de deux mots anglais, « prêt » et « fait », reliés par un tiret.
  pieges:
  - si:
      valeur: assemblage
    relance: Un assemblage réunit plusieurs objets. Fontaine est un seul objet, exposé presque sans changement.
      Quel mot anglais convient ?
  - si:
      valeur: détournement
    relance: C'est proche, mais on cherche le nom anglais précis de ce type d'objet choisi tout fait par l'artiste.
  - si:
      diagnostic: mauvaise_reponse
    relance: Pense à un mot anglais qui dit que l'objet était déjà fabriqué avant que l'artiste le choisisse.
  solution: 'Un ready-made : un objet manufacturé que l''artiste choisit et expose presque tel quel. Fontaine (1917),
    l''urinoir signé « R. Mutt » par Marcel Duchamp, en est l''exemple le plus connu.'
- id: presenter-ou-representer
  type: choix
  difficulte: 1
  enonce: Dans laquelle de ces situations l'objet est-il présenté lui-même, et non représenté ?
  reponse:
    options:
    - id: a
      texte: Une pomme peinte à l'huile sur une toile
    - id: b
      texte: Un vrai vélo posé au milieu d'une salle d'exposition
    - id: c
      texte: Le dessin au crayon d'une chaise
    - id: d
      texte: La photographie d'une tasse
    bonnes:
    - b
  indices:
    relance: Dans quelle situation pourrais-tu toucher l'objet réel ?
    methode: Représenter, c'est faire une image de l'objet. Présenter, c'est montrer l'objet lui-même.
    etape: La peinture, le dessin et la photographie sont des images. Quelle réponse n'est pas une image ?
  pieges:
  - si:
      contient:
      - d
    relance: Une photographie montre la tasse, mais est-ce la vraie tasse ou une image de la tasse ?
  - si:
      contient:
      - a
    relance: Peindre une pomme, c'est en faire une image. Cherche la situation où l'objet réel est là.
  - si:
      contient:
      - c
    relance: Le dessin est une image de la chaise. Où est l'objet réel ?
  solution: 'Le vrai vélo exposé : l''objet est présenté lui-même. La pomme peinte, le dessin et la photographie
    sont des représentations, des images d''objets.'
- id: oeuvres-objets
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à ce que l'artiste fait avec l'objet.
  reponse:
    gauche:
    - id: a
      texte: Marcel Duchamp, Fontaine (1917), un urinoir en porcelaine signé « R. Mutt »
    - id: b
      texte: Pablo Picasso, Tête de taureau (1942), une selle et un guidon de vélo
    - id: c
      texte: Méret Oppenheim, Le Déjeuner en fourrure (1936), une tasse, une soucoupe et une cuillère couvertes
        de fourrure
    - id: d
      texte: René Magritte, La Trahison des images (vers 1929), une pipe peinte avec l'inscription « Ceci n'est
        pas une pipe »
    droite:
    - id: x
      texte: Il choisit un objet tout fait et l'expose presque sans le modifier
    - id: y
      texte: Il assemble deux objets pour en faire une image nouvelle
    - id: z
      texte: Il recouvre un objet d'une matière qui lui fait perdre sa fonction
    - id: w
      texte: Il représente un objet pour rappeler que l'image n'est pas l'objet
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Dans quelle œuvre l'objet n'est-il pas réel du tout, mais peint ?
    methode: Pour chaque œuvre, compte les objets utilisés et demande-toi s'ils sont modifiés.
    etape: 'Magritte peint une image : il représente. Duchamp n''utilise qu''un seul objet, sans presque rien changer.
      Place les deux autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle des œuvres réunit plusieurs objets différents pour former
      une figure ?
  - si:
      diagnostic: associations_fausses
    relance: 'Repars de la question : l''objet est-il présenté tel quel, assemblé, recouvert, ou seulement peint
      ?'
  solution: 'Fontaine : objet tout fait exposé (ready-made). Tête de taureau : assemblage d''une selle et d''un
    guidon. Le Déjeuner en fourrure : objet recouvert qui perd sa fonction. La Trahison des images : représentation
    peinte qui rappelle que l''image n''est pas l''objet.'
- id: changer-le-statut
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qui peut faire d'un objet ordinaire une œuvre d'art ? Choisis les deux bonnes réponses.
  reponse:
    options:
    - id: a
      texte: Le choix de l'artiste, le titre et la signature qu'il lui donne
    - id: b
      texte: 'Le lieu et la manière de le présenter : musée, socle, cartel'
    - id: c
      texte: Le prix de l'objet dans un magasin
    - id: d
      texte: La marque de l'objet
    bonnes:
    - a
    - b
  indices:
    relance: Pour Fontaine, Duchamp n'a pas fabriqué l'objet. Qu'a-t-il ajouté ou changé ?
    methode: Cherche ce qui dépend de l'artiste et de la présentation, pas de l'objet lui-même.
    etape: Duchamp a retourné l'urinoir, l'a signé, lui a donné un titre et l'a proposé à une exposition. Quelles
      réponses correspondent ?
  pieges:
  - si:
      contient:
      - c
    relance: Un objet très cher dans un magasin reste un objet à vendre. Qu'est-ce qui change quand il devient œuvre
      ?
  - si:
      contient:
      - d
    relance: La marque vient du fabricant, pas de l'artiste. Qu'est-ce que l'artiste ajoute ?
  - si:
      diagnostic: incomplet
    relance: Tu as une bonne réponse. Il y en a une autre, liée à l'endroit où l'objet est montré.
  solution: Le choix de l'artiste (avec un titre et une signature) et la présentation (musée, socle, cartel) changent
    le statut de l'objet. Le prix et la marque ne font pas d'un objet une œuvre.
- id: demarche-detournement
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes d'une démarche de détournement d'objet en classe.
  reponse:
    elements:
    - id: choisir
      texte: Choisir un objet du quotidien et noter à quoi il sert d'habitude
    - id: imaginer
      texte: Imaginer une transformation qui change sa fonction ou son sens
    - id: realiser
      texte: 'Réaliser la transformation : couper, assembler, recouvrir, accumuler'
    - id: presenter
      texte: Choisir une présentation et donner un titre
    - id: expliquer
      texte: Expliquer à la classe ce qui a changé dans le statut de l'objet
  indices:
    relance: Peut-on transformer un objet avant de l'avoir choisi ?
    methode: Pars de l'objet, passe par le projet puis la fabrication, et termine par ce que voit et entend le public.
    etape: La première étape est de choisir l'objet et de noter sa fonction. Qu'est-ce qui vient juste avant de
      le transformer ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque. Deux étapes voisines sont inversées : peut-on présenter une production qui n''est pas encore
      faite ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère la première étape (l'objet de départ) et la dernière (parler à la classe), puis range les autres
      entre elles.
  solution: Choisir l'objet et noter sa fonction, imaginer une transformation, la réaliser, choisir une présentation
    et un titre, puis expliquer à la classe ce qui a changé.
- id: analyse-trophee
  type: ouverte
  difficulte: 3
  enonce: 'Production fictive d''élève : Lina a collé vingt fourchettes en plastique sur une planche peinte en doré,
    posée sur un socle, avec pour titre « Trophée du self ». En quelques phrases, analyse cette production : que
    fait-elle des objets, et comment leur statut change-t-il ? Justifie avec un exemple d''artiste.'
  criteres:
  - L'élève dit ce que Lina fait des objets (accumulation, assemblage, détournement) et que les fourchettes perdent
    leur fonction.
  - L'élève explique le rôle de la présentation (socle, couleur dorée, titre) dans le changement de statut.
  - L'élève fait un lien juste avec une œuvre réelle (par exemple un ready-made de Duchamp ou l'assemblage de Picasso).
  indices:
    relance: Peut-on encore manger avec ces fourchettes ?
    methode: Décris d'abord les objets, puis ce qui a été fait avec eux, puis ce qu'ajoutent le socle, la couleur
      et le titre.
    etape: Tu peux commencer ainsi « Lina utilise des objets du quotidien, des fourchettes, mais... »
  solution: 'Lina accumule et assemble des fourchettes en plastique, objets banals et jetables : collées, elles
    ne servent plus à manger. La planche dorée, le socle et le titre « Trophée du self » les présentent comme un
    objet précieux à regarder, presque un trophée : leur statut change, de couverts jetables à objet d''art. Comme
    Duchamp avec Fontaine, c''est le choix de l''artiste et la présentation qui transforment le regard porté sur
    l''objet ; comme Picasso avec Tête de taureau, l''assemblage crée une image nouvelle.'
- id: objet-trois-statuts
  type: association
  difficulte: 2
  enonce: Relie chaque situation à la façon dont l'œuvre est considérée comme un objet.
  reponse:
    gauche:
    - id: a
      texte: Un tableau dont on restaure la toile abîmée
    - id: b
      texte: Un tableau accroché et conservé au musée
    - id: c
      texte: Un tableau que la classe décrit et compare à un autre
    droite:
    - id: x
      texte: Un objet matériel
    - id: y
      texte: Un objet d'art
    - id: z
      texte: Un objet d'étude
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque situation, demande-toi si l'on parle de matière, de reconnaissance ou d'analyse.
    methode: Une œuvre peut être un objet matériel, un objet d'art ou un objet d'étude.
    etape: La restauration concerne la matière qui s'abîme. Place-la d'abord.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends la situation où l'on décrit et compare.
  - si:
      diagnostic: associations_fausses
    relance: Commence par la situation qui parle de matière abîmée.
  solution: 'Un tableau restauré : objet matériel. Un tableau exposé au musée : objet d''art. Un tableau décrit
    et comparé en classe : objet d''étude.'
