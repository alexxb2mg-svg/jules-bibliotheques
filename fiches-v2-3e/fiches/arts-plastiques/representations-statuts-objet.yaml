# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: representations-statuts-objet
version: 4
etat: verifiee
declencheurs:
- urinoir de Duchamp
- objet détourné
- objet banal exposé au musée
- objet manufacturé exposé
- nature morte et objet
- accumulation d'objets
prerequis:
- 4e-representations-statuts-objet
- objet-comme-materiau
essentiel: 'Un objet peut entrer dans l''art de plusieurs façons.


  Il peut être représenté : peint, dessiné, photographié ou sculpté, comme dans une nature morte.


  Il peut aussi être présenté tel quel : c''est le ready-made. En 1917, Marcel Duchamp propose à une exposition un urinoir
  en porcelaine, retourné et signé « R. Mutt », qu''il intitule Fontaine. L''artiste ne l''a pas fabriqué : c''est son choix,
  le titre, la signature et le lieu d''exposition qui changent le statut de l''objet.


  Un objet peut enfin être détourné, assemblé ou accumulé. Pablo Picasso assemble une selle et un guidon de vélo pour faire
  une Tête de taureau (1942). Méret Oppenheim recouvre de fourrure une tasse, sa soucoupe et une cuillère (Le Déjeuner en
  fourrure, 1936) : l''objet perd sa fonction. L''accumulation répète le même objet en grand nombre pour lui donner un autre
  sens.


  Le statut de l''objet change selon la façon dont il est présenté : socle, vitrine, cartel, titre, lieu (musée, galerie,
  rue). Le même objet peut être utile dans une cuisine et devenir œuvre dans un musée.


  L''œuvre est elle-même un objet, de trois manières :

  - un objet matériel, fait de matières, qui peut s''abîmer et qu''on restaure ;

  - un objet d''art, reconnu, exposé et conservé, par exemple dans un musée ;

  - un objet d''étude, que l''on décrit, analyse et compare.


  René Magritte peint une pipe et écrit dessous « Ceci n''est pas une pipe » (La Trahison des images, vers 1929) : l''image
  d''un objet n''est pas l''objet.


  Ces œuvres posent des questions : qu''est-ce qu''une œuvre d''art ? quel est le rôle de l''artiste ? que regarde le spectateur
  ?


  Au brevet, on attend que l''élève distingue représenter et présenter, cite un exemple d''artiste et explique comment l''objet
  change de statut.

  '
methode:
- 'Identifier l''objet : qu''est-ce que c''est, et à quoi sert-il d''habitude ?'
- 'Dire ce que l''artiste en fait : il le représente, le présente tel quel, le détourne, l''assemble ou l''accumule.'
- 'Repérer ce qui a changé : sa fonction, son lieu, son titre, sa signature, sa présentation (socle, vitrine, cartel).'
- 'Dire quelle question l''œuvre pose : qu''est-ce qu''une œuvre d''art ? quel est le rôle de l''artiste ? que regarde le
  spectateur ?'
- Relier à une œuvre d'artiste connue pour appuyer l'explication.
vocabulaire:
- terme: ready-made
  definition: objet manufacturé choisi par un artiste et exposé presque tel quel comme œuvre
- terme: détournement
  definition: le fait de modifier un objet pour lui enlever sa fonction habituelle ou lui donner un autre sens
- terme: assemblage
  definition: œuvre faite en réunissant plusieurs objets ou morceaux d'objets
- terme: nature morte
  definition: représentation d'objets inanimés (fruits, vaisselle, fleurs coupées…)
- terme: statut de l'objet
  definition: 'ce qu''est l''objet aux yeux de tous : objet utile, objet d''art, objet d''étude'
- terme: accumulation
  definition: le fait de réunir en grand nombre le même objet ou des objets semblables dans une œuvre
erreurs_frequentes:
- 'Croire qu''un ready-made est fabriqué par l''artiste : il est choisi, pas fabriqué.'
- Confondre représenter un objet (le peindre, le dessiner) et présenter un objet (exposer l'objet lui-même).
- 'Penser qu''un objet exposé garde son statut d''objet utile : dans l''œuvre, il ne sert plus à sa fonction.'
- Oublier que l'œuvre est aussi un objet matériel, qui s'use, se transporte et se conserve.
exemple:
  enonce: 'Production fictive d''élève : Sami pose une vieille chaise d''école sur un socle blanc au CDI, avec un cartel «
    Attente, 2026 ». Qu''est-ce qui a changé pour cette chaise ?'
  solution: 'La chaise n''est plus faite pour s''asseoir : posée sur un socle, avec un titre et une date, elle est présentée
    comme une œuvre à regarder. Son statut passe d''objet utile à objet d''art, un peu comme les ready-made de Marcel Duchamp.
    Le titre « Attente » donne un sens nouveau : la chaise évoque le temps passé à attendre.'
exercices:
- id: mot-ready-made
  type: texte_court
  difficulte: 1
  enonce: Quel mot anglais désigne un objet manufacturé, choisi par l'artiste et exposé presque tel quel comme œuvre, comme
    Fontaine de Marcel Duchamp (1917) ?
  reponse:
    acceptees:
    - ready-made
    - readymade
    - ready made
    fautes_tolerees: 1
  indices:
    relance: Duchamp a-t-il fabriqué cet urinoir lui-même, ou l'a-t-il trouvé déjà fait ?
    methode: 'Le mot est anglais et veut dire « tout fait » : l''objet est déjà prêt quand l''artiste le choisit.'
    etape: C'est un mot composé de deux mots anglais, « prêt » et « fait », reliés par un tiret.
  pieges:
  - si:
      valeur: assemblage
    relance: Un assemblage réunit plusieurs objets. Fontaine est un seul objet, exposé presque sans changement. Quel mot anglais
      convient ?
  - si:
      valeur: détournement
    relance: C'est proche, mais on cherche le nom anglais précis de ce type d'objet choisi tout fait par l'artiste.
  - si:
      diagnostic: mauvaise_reponse
    relance: Pense à un mot anglais qui dit que l'objet était déjà fabriqué avant que l'artiste le choisisse.
  solution: 'Un ready-made : un objet manufacturé que l''artiste choisit et expose presque tel quel. Fontaine (1917), l''urinoir
    signé « R. Mutt » par Marcel Duchamp, en est l''exemple le plus connu.'
- id: presenter-ou-representer
  type: choix
  difficulte: 1
  enonce: Dans laquelle de ces situations l'objet est-il présenté lui-même, et non représenté ?
  reponse:
    options:
    - id: a
      texte: Une pomme peinte à l'huile sur une toile
    - id: b
      texte: Un vrai vélo posé au milieu d'une salle d'exposition
    - id: c
      texte: Le dessin au crayon d'une chaise
    - id: d
      texte: La photographie d'une tasse
    bonnes:
    - b
  indices:
    relance: Dans quelle situation pourrais-tu toucher l'objet réel ?
    methode: Représenter, c'est faire une image de l'objet. Présenter, c'est montrer l'objet lui-même.
    etape: La peinture, le dessin et la photographie sont des images. Quelle réponse n'est pas une image ?
  pieges:
  - si:
      contient:
      - d
    relance: Une photographie montre la tasse, mais est-ce la vraie tasse ou une image de la tasse ?
  - si:
      contient:
      - a
    relance: Peindre une pomme, c'est en faire une image. Cherche la situation où l'objet réel est là.
  - si:
      contient:
      - c
    relance: Le dessin est une image de la chaise. Où est l'objet réel ?
  solution: 'Le vrai vélo exposé : l''objet est présenté lui-même. La pomme peinte, le dessin et la photographie sont des
    représentations, des images d''objets.'
- id: oeuvres-objets
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à ce que l'artiste fait avec l'objet.
  reponse:
    gauche:
    - id: a
      texte: Marcel Duchamp, Fontaine (1917), un urinoir en porcelaine signé « R. Mutt »
    - id: b
      texte: Pablo Picasso, Tête de taureau (1942), une selle et un guidon de vélo
    - id: c
      texte: Méret Oppenheim, Le Déjeuner en fourrure (1936), une tasse, une soucoupe et une cuillère couvertes de fourrure
    - id: d
      texte: René Magritte, La Trahison des images (vers 1929), une pipe peinte avec l'inscription « Ceci n'est pas une pipe
        »
    droite:
    - id: x
      texte: Il choisit un objet tout fait et l'expose presque sans le modifier
    - id: y
      texte: Il assemble deux objets pour en faire une image nouvelle
    - id: z
      texte: Il recouvre un objet d'une matière qui lui fait perdre sa fonction
    - id: w
      texte: Il représente un objet pour rappeler que l'image n'est pas l'objet
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Dans quelle œuvre l'objet n'est-il pas réel du tout, mais peint ?
    methode: Pour chaque œuvre, compte les objets utilisés et demande-toi s'ils sont modifiés.
    etape: 'Magritte peint une image : il représente. Duchamp n''utilise qu''un seul objet, sans presque rien changer. Place
      les deux autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle des œuvres réunit plusieurs objets différents pour former une figure
      ?
  - si:
      diagnostic: associations_fausses
    relance: 'Repars de la question : l''objet est-il présenté tel quel, assemblé, recouvert, ou seulement peint ?'
  solution: 'Fontaine : objet tout fait exposé (ready-made). Tête de taureau : assemblage d''une selle et d''un guidon. Le
    Déjeuner en fourrure : objet recouvert qui perd sa fonction. La Trahison des images : représentation peinte qui rappelle
    que l''image n''est pas l''objet.'
- id: changer-le-statut
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qui peut faire d'un objet ordinaire une œuvre d'art ? Choisis les deux bonnes réponses.
  reponse:
    options:
    - id: a
      texte: Le choix de l'artiste, le titre et la signature qu'il lui donne
    - id: b
      texte: 'Le lieu et la manière de le présenter : musée, socle, cartel'
    - id: c
      texte: Le prix de l'objet dans un magasin
    - id: d
      texte: La marque de l'objet
    bonnes:
    - a
    - b
  indices:
    relance: Pour Fontaine, Duchamp n'a pas fabriqué l'objet. Qu'a-t-il ajouté ou changé ?
    methode: Cherche ce qui dépend de l'artiste et de la présentation, pas de l'objet lui-même.
    etape: Duchamp a retourné l'urinoir, l'a signé, lui a donné un titre et l'a proposé à une exposition. Quelles réponses
      correspondent ?
  pieges:
  - si:
      contient:
      - c
    relance: Un objet très cher dans un magasin reste un objet à vendre. Qu'est-ce qui change quand il devient œuvre ?
  - si:
      contient:
      - d
    relance: La marque vient du fabricant, pas de l'artiste. Qu'est-ce que l'artiste ajoute ?
  - si:
      diagnostic: incomplet
    relance: Tu as une bonne réponse. Il y en a une autre, liée à l'endroit où l'objet est montré.
  solution: Le choix de l'artiste (avec un titre et une signature) et la présentation (musée, socle, cartel) changent le statut
    de l'objet. Le prix et la marque ne font pas d'un objet une œuvre.
- id: demarche-detournement
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes d'une démarche de détournement d'objet en classe.
  reponse:
    elements:
    - id: choisir
      texte: Choisir un objet du quotidien et noter à quoi il sert d'habitude
    - id: imaginer
      texte: Imaginer une transformation qui change sa fonction ou son sens
    - id: realiser
      texte: 'Réaliser la transformation : couper, assembler, recouvrir, accumuler'
    - id: presenter
      texte: Choisir une présentation et donner un titre
    - id: expliquer
      texte: Expliquer à la classe ce qui a changé dans le statut de l'objet
  indices:
    relance: Peut-on transformer un objet avant de l'avoir choisi ?
    methode: Pars de l'objet, passe par le projet puis la fabrication, et termine par ce que voit et entend le public.
    etape: La première étape est de choisir l'objet et de noter sa fonction. Qu'est-ce qui vient juste avant de le transformer
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque. Deux étapes voisines sont inversées : peut-on présenter une production qui n''est pas encore faite
      ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère la première étape (l'objet de départ) et la dernière (parler à la classe), puis range les autres entre
      elles.
  solution: Choisir l'objet et noter sa fonction, imaginer une transformation, la réaliser, choisir une présentation et un
    titre, puis expliquer à la classe ce qui a changé.
- id: analyse-trophee
  type: ouverte
  difficulte: 3
  enonce: 'Production fictive d''élève : Lina a collé vingt fourchettes en plastique sur une planche peinte en doré, posée
    sur un socle, avec pour titre « Trophée du self ». En quelques phrases, analyse cette production : que fait-elle des objets,
    et comment leur statut change-t-il ? Justifie avec un exemple d''artiste.'
  criteres:
  - L'élève dit ce que Lina fait des objets (accumulation, assemblage, détournement) et que les fourchettes perdent leur fonction.
  - L'élève explique le rôle de la présentation (socle, couleur dorée, titre) dans le changement de statut.
  - L'élève fait un lien juste avec une œuvre réelle (par exemple un ready-made de Duchamp ou l'assemblage de Picasso).
  indices:
    relance: Peut-on encore manger avec ces fourchettes ?
    methode: Décris d'abord les objets, puis ce qui a été fait avec eux, puis ce qu'ajoutent le socle, la couleur et le titre.
    etape: Tu peux commencer ainsi « Lina utilise des objets du quotidien, des fourchettes, mais... »
  solution: 'Lina accumule et assemble des fourchettes en plastique, objets banals et jetables : collées, elles ne servent
    plus à manger. La planche dorée, le socle et le titre « Trophée du self » les présentent comme un objet précieux à regarder,
    presque un trophée : leur statut change, de couverts jetables à objet d''art. Comme Duchamp avec Fontaine, c''est le choix
    de l''artiste et la présentation qui transforment le regard porté sur l''objet ; comme Picasso avec Tête de taureau, l''assemblage
    crée une image nouvelle.'
- id: nblm-en-1917-marcel-duchamp-presente-un-urino-1
  type: choix
  difficulte: 2
  enonce: En 1917, Marcel Duchamp présente un urinoir sous le titre Fontaine. Quel terme désigne cet objet manufacturé usuel
    choisi par un artiste et exposé tel quel comme une œuvre d'art ?
  reponse:
    options:
    - id: o1
      texte: Un ready-made
    - id: o2
      texte: Une nature morte
    - id: o3
      texte: Un moulage
    - id: o4
      texte: Une fresque
    bonnes:
    - o1
  indices:
    relance: Pense au terme anglophone signifiant « déjà fait », utilisé pour désigner un objet industriel promu au rang d'œuvre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : une nature morte est la représentation peinte, dessinée ou sculptée d''objets inanimés, alors
      qu''ici l''objet réel est directement présenté.'
  - si:
      contient:
      - o3
    relance: 'Faux : le moulage consiste à couler une matière liquide dans un moule pour qu''elle en prenne la forme, ce qui
      ne correspond pas à l''utilisation d''un objet déjà fabriqué industriellement.'
  - si:
      contient:
      - o4
    relance: 'Faux : une fresque est une peinture réalisée sur un enduit mural frais, ce qui n''a aucun rapport avec le choix
      d''un objet usuel.'
  solution: 'Un ready-made. C''est exact : un ready-made est un objet manufacturé usuel choisi par l''artiste et présenté
    comme une œuvre d''art sans transformation ni fabrication manuelle.'
- id: nblm-lorsqu-un-objet-banal-du-quotidien-comme-2
  type: choix
  difficulte: 2
  enonce: Lorsqu'un objet banal du quotidien (comme une vieille chaise d'école) est posé sur un socle dans un musée avec un
    titre et un cartel, que se passe-t-il pour lui ?
  reponse:
    options:
    - id: o1
      texte: 'Son statut change : il perd sa fonction d''usage pour devenir un objet d''art à regarder.'
    - id: o2
      texte: Il conserve strictly sa fonction d'usage et les visiteurs peuvent s'y asseoir.
    - id: o3
      texte: Il devient automatiquement une sculpture taillée dans le marbre par l'artiste.
    - id: o4
      texte: Il perd toute valeur matérielle et doit être jeté.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la différence entre utiliser une chaise pour s'asseoir et l'observer exposée sur un socle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : une fois présenté comme œuvre sur un socle dans un musée, l''objet ne sert plus à sa fonction
      utilitaire première.'
  - si:
      contient:
      - o3
    relance: 'Faux : présenter un objet manufacturé tel quel ne signifie pas qu''il a été sculpté ou taillé par l''artiste.'
  - si:
      contient:
      - o4
    relance: 'Faux : au contraire, le dispositif d''exposition le valorise et le conserve en tant qu''objet d''art.'
  solution: 'Son statut change : il perd sa fonction d''usage pour devenir un objet d''art à regarder. C''est juste : le changement
    de lieu (le musée) et la présentation (socle, cartel) modifient le statut de l''objet, qui passe d''objet utile à objet
    d''art.'
- id: nblm-en-1936-meret-oppenheim-recouvre-de-four-3
  type: choix
  difficulte: 2
  enonce: En 1936, Meret Oppenheim recouvre de fourrure une tasse, une soucoupe et une cuillère (Le Déjeuner en fourrure).
    Quelle opération plastique enlève à l'objet sa fonction habituelle ?
  reponse:
    options:
    - id: o1
      texte: Le détournement
    - id: o2
      texte: La taille
    - id: o3
      texte: La restauration
    - id: o4
      texte: La numérisation
    bonnes:
    - o1
  indices:
    relance: Cherche le terme qui exprime l'action de changer la fonction première ou le sens d'un objet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : la taille consiste à enlever de la matière dans un bloc dur (pierre, bois), et non à recouvrir un objet
      de fourrure.'
  - si:
      contient:
      - o3
    relance: 'Faux : la restauration vise à remettre en état un objet ou une œuvre abîmée, pas à lui faire perdre sa fonction
      utile.'
  - si:
      contient:
      - o4
    relance: 'Faux : la numérisation est la transformation d''un objet ou d''une image réelle en fichier informatique.'
  solution: 'Le détournement. C''est exact : le détournement consiste à modifier un objet pour lui enlever sa fonction habituelle
    ou lui donner un autre sens.'
- id: nblm-quelle-est-l-une-des-erreurs-les-plus-fr-4
  type: choix
  difficulte: 2
  enonce: Quelle est l'une des erreurs les plus fréquentes commises lors de l'analyse d'un ready-made comme Fontaine de Marcel
    Duchamp ?
  reponse:
    options:
    - id: o1
      texte: Croire que l'objet a été fabriqué à la main par l'artiste.
    - id: o2
      texte: Confondre l'urinoir avec une peinture à l'huile du Moyen Âge.
    - id: o3
      texte: Penser que Duchamp l'a imprimé grâce à une imprimante 3D.
    - id: o4
      texte: Oublier qu'il s'agit d'un fichier vidéo interactif.
    bonnes:
    - o1
  indices:
    relance: Demande-toi si Duchamp a lui-même façonné et cuit la porcelaine de cet urinoir du commerce.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : il s''agit bien d''un objet tridimensionnel en porcelaine du XXe siècle, pas d''une peinture ancienne.'
  - si:
      contient:
      - o3
    relance: 'Faux : la technologie d''impression 3D n''existait pas en 1917, l''objet est issu d''une fabrication industrielle
      classique.'
  - si:
      contient:
      - o4
    relance: 'Faux : Fontaine est un objet physique matériel (un urinoir en porcelaine), non un support vidéo ou virtuel.'
  solution: 'Croire que l''objet a été fabriqué à la main par l''artiste. C''est exact : l''artiste ne fabrique pas le ready-made
    ; ce sont son choix, son titre, sa signature et le lieu d''exposition qui font l''œuvre.'
- id: nblm-selon-la-fiche-de-revision-de-quelles-ma-5
  type: choix
  difficulte: 2
  enonce: Selon la fiche de révision, de quelles manières une œuvre d'art existe-t-elle simultanément en tant qu'objet ?
  reponse:
    options:
    - id: o1
      texte: Comme objet matériel, objet d'art et objet d'étude.
    - id: o2
      texte: Comme calque, pixel et image vectorielle.
    - id: o3
      texte: Comme outil utile, ustensile ménager et meuble de rangement.
    - id: o4
      texte: Comme pigment, liant et support.
    bonnes:
    - o1
  indices:
    relance: 'L''œuvre se compose de matières, elle est conservée au musée et elle s''analyse en classe : retrouve ces trois
      dimensions.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : ces termes désignent les composants d''une création numérique, pas les trois statuts généraux de l''œuvre-objet.'
  - si:
      contient:
      - o3
    relance: 'Faux : ce sont des fonctions d''objets usuels du quotidien, pas le statut d''une œuvre d''art.'
  - si:
      contient:
      - o4
    relance: 'Faux : ce sont les éléments matériels d''une peinture, pas les trois dimensions statutaires de l''œuvre.'
  solution: 'Comme objet matériel, objet d''art et objet d''étude. C''est exact : l''œuvre est un objet matériel (fait de
    matières), un objet d''art (reconnu, exposé et conservé) et un objet d''étude (que l''on décrit et analyse).'
- id: nblm-dans-le-cas-de-fontaine-1917-de-marcel-d-6
  type: choix
  difficulte: 3
  enonce: Dans le cas de Fontaine (1917) de Marcel Duchamp, quels éléments permettent de transformer le statut de cet urinoir
    manufacturé en œuvre d'art ? (Sélectionne 2 bonnes réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le choix de l'objet par l'artiste, son titre, sa signature (R. Mutt) et sa présentation dans un lieu d'exposition.
    - id: o2
      texte: La question posée par la démarche sur la définition de l'art (« qu'est-ce qu'une œuvre d'art ? »).
    - id: o3
      texte: La sculpture minutieuse du bloc de porcelaine réalisée à la main par Duchamp dans son atelier.
    - id: o4
      texte: L'ajout d'un moteur et de capteurs électroniques pour le rendre interactif.
    bonnes:
    - o1
    - o2
  indices:
    relance: Concentre-toi sur la démarche conceptuelle et les interventions de choix/lieu plutôt que sur une fabrication
      artisanale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : Duchamp n''a pas sculpté l''urinoir ; il a acheté un objet industriel du commerce déjà fabriqué.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''œuvre ne comporte aucun système électronique ni mécanisme motorisé.'
  solution: 'Le choix de l''objet par l''artiste, son titre, sa signature (R. Mutt) et sa présentation dans un lieu d''exposition
    ; La question posée par la démarche sur la définition de l''art (« qu''est-ce qu''une œuvre d''art ? »). C''est exact
    : l''artiste n''a pas fabriqué l''objet, mais ses choix de sélection, de dénomination, de signature et de lieu d''exposition
    changent le statut de l''objet.'
- id: nblm-complete-la-phrase-l-uvre-tete-de-taurea-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : L''œuvre Tête de taureau (1942) de Pablo Picasso, réalisée en réunissant une selle et un guidon
    de vélo, est un __________.'
  reponse:
    acceptees:
    - assemblage
    fautes_tolerees: 1
  indices:
    relance: Pense au terme qui désigne la réunion de plusieurs éléments ou objets.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: assemblage. L'assemblage est une technique artistique qui consiste à réunir plusieurs objets ou morceaux d'objets
    pour former une œuvre nouvelle.
- id: nblm-complete-la-phrase-lorsqu-un-artiste-rep-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : Lorsqu''un artiste représente des objets inanimés (vaisselle, fruits, instruments) en peinture
    ou en dessin, ce genre artistique s''appelle une __________.'
  reponse:
    acceptees:
    - nature morte
    fautes_tolerees: 1
  indices:
    relance: Expression en deux mots désignant la représentation d'objets inanimés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: nature morte. La nature morte désigne la représentation d'objets inanimés par le dessin, la peinture ou la sculpture.
- id: objet-trois-statuts
  type: association
  difficulte: 2
  enonce: Relie chaque situation à la façon dont l'œuvre est considérée comme un objet.
  reponse:
    gauche:
    - id: a
      texte: Un tableau dont on restaure la toile abîmée
    - id: b
      texte: Un tableau accroché et conservé au musée
    - id: c
      texte: Un tableau que la classe décrit et compare à un autre
    droite:
    - id: x
      texte: Un objet matériel
    - id: y
      texte: Un objet d'art
    - id: z
      texte: Un objet d'étude
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque situation, demande-toi si l'on parle de matière, de reconnaissance ou d'analyse.
    methode: Une œuvre peut être un objet matériel, un objet d'art ou un objet d'étude.
    etape: La restauration concerne la matière qui s'abîme. Place-la d'abord.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends la situation où l'on décrit et compare.
  - si:
      diagnostic: associations_fausses
    relance: Commence par la situation qui parle de matière abîmée.
  solution: 'Un tableau restauré : objet matériel. Un tableau exposé au musée : objet d''art. Un tableau décrit et comparé
    en classe : objet d''étude.'
