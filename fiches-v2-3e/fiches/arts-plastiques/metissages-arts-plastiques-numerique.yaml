format: 2
notion: metissages-arts-plastiques-numerique
version: 3
etat: verifiee
declencheurs:
- œuvre interactive
- sculpture avec capteurs
- machine à dessiner
- art et sciences
- le public déclenche l'œuvre
- ordinateur et art
- robot artiste
- réalité virtuelle et art
- art génératif
prerequis:
- 4e-metissages-arts-plastiques-numerique
- numerique-processus-materiau
essentiel: 'Depuis le milieu du XXe siècle, des artistes croisent les arts plastiques avec les sciences et les technologies
  : électronique, vidéo, robotique, informatique. Aujourd''hui, les environnements numériques (ordinateur, Internet, réalité
  virtuelle) prolongent ces croisements.


  On parle de métissage ou d''hybridation quand une œuvre mêle des pratiques, des techniques ou des matériaux différents.


  Trois exemples à connaître :

  - Nicolas Schöffer présente en 1956 CYSP 1, une sculpture en métal qui se déplace et réagit à la lumière et aux sons de
  son environnement grâce à des capteurs et à un circuit électronique.

  - Jean Tinguely construit à partir de 1959 des Méta-matics : des machines qui dessinent elles-mêmes quand un visiteur les
  met en marche.

  - Nam June Paik, pionnier de l''art vidéo, crée TV Buddha (1974) : une statue de Bouddha fait face à un téléviseur qui montre
  son image, filmée en direct par une caméra.


  Avec l''ordinateur, l''artiste peut écrire un programme : une suite d''instructions que la machine exécute. Le résultat
  peut changer à chaque lancement (art génératif). Une œuvre peut aussi exister sur un écran, en ligne, en plusieurs copies,
  ou s''explorer en réalité virtuelle.


  Ces croisements font évoluer les notions d''œuvre, d''artiste et de public :

  - l''œuvre peut bouger, changer, réagir : elle n''est plus forcément un objet fixe, unique et fini ;

  - l''artiste conçoit parfois un dispositif, des règles ou un programme, et travaille avec des ingénieurs ou des scientifiques
  ; la machine exécute ;

  - le spectateur peut devenir acteur : dans une œuvre interactive, ses gestes, sa voix ou sa présence déclenchent ou transforment
  l''œuvre. On parle alors de récepteur actif.


  Au brevet, on attend que tu décrives le dispositif (matériaux, machines, capteurs, écrans), que tu nommes le croisement
  entre art et science ou technologie, et que tu dises ce qui change pour l''œuvre, l''artiste et le public.

  '
methode:
- 'Décrire le dispositif : matériaux, machines, capteurs, écrans, caméras, programme.'
- 'Repérer le croisement : quelle science ou quelle technologie rencontre quelle pratique artistique (sculpture, dessin, peinture)
  ?'
- 'Dire qui fait quoi : ce que l''artiste a conçu, ce que la machine exécute, ce que le public déclenche.'
- Expliquer ce qui change dans la notion d'œuvre (mobile, changeante), d'artiste (concepteur) et de public (participant).
vocabulaire:
- terme: œuvre interactive
  definition: œuvre qui réagit aux actions du spectateur (mouvement, voix, toucher)
- terme: capteur
  definition: composant électronique qui détecte la lumière, le son, un mouvement ou la chaleur
- terme: hybridation
  definition: mélange de techniques, de pratiques ou de matériaux différents dans une même œuvre
- terme: art vidéo
  definition: pratique artistique qui utilise la caméra, l'image vidéo et les écrans comme matériaux
- terme: circuit fermé
  definition: dispositif où une caméra filme et où l'image apparaît en direct sur un écran placé à côté
- terme: programme
  definition: suite d'instructions écrites par un humain et exécutées par un ordinateur
- terme: art génératif
  definition: œuvre produite par un programme dont le résultat peut varier à chaque exécution
- terme: récepteur
  definition: 'la personne qui reçoit l''œuvre : le spectateur, le public'
erreurs_frequentes:
- 'Croire que la machine est l''artiste : c''est l''artiste qui conçoit le dispositif et ses règles.'
- Penser qu'une œuvre technologique n'a pas besoin d'être regardée ou analysée comme une autre œuvre.
- 'Oublier le rôle du public : dans une œuvre interactive, sans lui l''œuvre ne se déclenche pas.'
- 'Croire que ces croisements datent seulement d''Internet : ils existent depuis les années 1950.'
exemple:
  enonce: 'Production fictive d''élèves : une boîte en carton peinte contient une petite carte électronique ; quand quelqu''un
    approche la main, des lumières s''allument et un son se déclenche. Qui fait quoi dans cette œuvre ?'
  solution: 'Les élèves ont conçu le dispositif : la boîte peinte, le programme et le choix des réactions. La carte électronique
    et son capteur exécutent ce programme. Le spectateur déclenche l''œuvre en approchant la main : c''est une œuvre interactive,
    qui mêle pratique plastique (peinture, volume) et technologie.'
exercices:
- id: mot-interactive
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une œuvre qui réagit aux actions du spectateur (mouvement, voix, toucher), souvent grâce à
    des capteurs ?
  reponse:
    acceptees:
    - œuvre interactive
    - oeuvre interactive
    - interactive
    - installation interactive
    fautes_tolerees: 1
  indices:
    relance: Entre l'œuvre et le spectateur, y a-t-il une action dans un seul sens, ou dans les deux sens ?
    methode: 'Le mot contient « inter » (entre) et « action » : l''œuvre et le public agissent l''un sur l''autre.'
    etape: L'adjectif commence par « inter » et se termine par « -ive ».
  pieges:
  - si:
      valeur: performance
    relance: Une performance est une action de l'artiste. Ici, c'est le spectateur qui agit et l'œuvre qui réagit. Quel adjectif
      convient ?
  - si:
      valeur: cinétique
    relance: Une œuvre cinétique bouge, mais pas forcément en réponse au public. Quel adjectif dit que l'œuvre répond à nos
      actions ?
  - si:
      diagnostic: mauvaise_reponse
    relance: Cherche un adjectif formé avec « inter » et « action ».
  solution: 'Une œuvre interactive : elle réagit aux actions du spectateur, qui devient acteur de l''œuvre.'
- id: role-du-public
  type: choix
  difficulte: 1
  enonce: Quel changement les œuvres interactives apportent-elles au rôle du public ?
  reponse:
    options:
    - id: a
      texte: 'Le public participe : ses actions déclenchent ou modifient l''œuvre'
    - id: b
      texte: Le public doit rester loin et immobile
    - id: c
      texte: Le public n'a plus aucun rôle
    - id: d
      texte: Le public doit fabriquer lui-même les machines
    bonnes:
    - a
  indices:
    relance: Que se passe-t-il dans une œuvre interactive si personne ne s'approche ?
    methode: 'Pense à l''échange entre l''œuvre et le spectateur : qui agit, qui réagit ?'
    etape: Dans une œuvre interactive, l'œuvre réagit à quelqu'un. À qui ?
  pieges:
  - si:
      contient:
      - b
    relance: Si le public reste loin et immobile, que détecteraient les capteurs ?
  - si:
      contient:
      - c
    relance: Sans le public, l'œuvre interactive se déclencherait-elle ?
  - si:
      contient:
      - d
    relance: La machine est conçue par l'artiste. Que fait le public quand il arrive devant l'œuvre ?
  solution: 'Le public participe : par ses gestes, sa voix ou sa présence, il déclenche ou modifie l''œuvre. Le spectateur
    devient acteur.'
- id: oeuvres-croisements
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre au croisement entre art et technologie qu'elle propose.
  reponse:
    gauche:
    - id: a
      texte: Nicolas Schöffer, CYSP 1 (1956)
    - id: b
      texte: Jean Tinguely, Méta-matics (à partir de 1959)
    - id: c
      texte: Nam June Paik, TV Buddha (1974)
    droite:
    - id: x
      texte: Une sculpture qui se déplace et réagit à la lumière et aux sons grâce à des capteurs
    - id: y
      texte: Des machines qui produisent elles-mêmes des dessins
    - id: z
      texte: Une statue qui regarde sa propre image filmée en direct sur un téléviseur
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Quel titre contient les lettres « TV » ? Quel appareil évoquent-elles ?
    methode: 'Cherche dans chaque titre un indice : un appareil, un mot qui évoque la machine.'
    etape: « TV » renvoie au téléviseur, et « matic » à une machine automatique. Place l'œuvre qui reste.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle de ces œuvres produit des dessins sur papier ?
  - si:
      diagnostic: associations_fausses
    relance: 'Repars des titres : TV, « matic », puis la sculpture qui réagit à son environnement.'
  solution: 'CYSP 1 : sculpture qui réagit à la lumière et aux sons grâce à des capteurs. Méta-matics : machines à dessiner.
    TV Buddha : une statue face à son image vidéo en direct (circuit fermé).'
- id: qui-est-le-createur
  type: choix
  difficulte: 2
  enonce: Avec les Méta-matics de Jean Tinguely, une machine dessine quand un visiteur la met en marche. Choisis les deux
    affirmations justes.
  reponse:
    options:
    - id: a
      texte: 'Tinguely reste l''auteur : il a conçu et construit la machine'
    - id: b
      texte: Le dessin obtenu dépend aussi du hasard et du visiteur qui met la machine en marche
    - id: c
      texte: La machine a eu seule l'idée de l'œuvre
    - id: d
      texte: Un dessin fait par une machine ne peut pas être une œuvre
    bonnes:
    - a
    - b
  indices:
    relance: La machine existerait-elle sans Tinguely ? Et le dessin existerait-il sans le visiteur ?
    methode: Pour chaque affirmation, demande-toi qui a conçu, qui a déclenché, et ce qui n'est pas prévu.
    etape: 'Le rôle de l''artiste change : il invente la machine plutôt que de tenir le crayon. Quelles affirmations le disent,
      avec le rôle du visiteur ?'
  pieges:
  - si:
      contient:
      - c
    relance: Une machine peut-elle avoir une idée ? Qui a imaginé et construit celle-ci ?
  - si:
      contient:
      - d
    relance: 'Les Méta-matics sont exposées dans des musées. Qu''est-ce qui fait l''œuvre : la main, ou l''idée et le dispositif
      ?'
  - si:
      diagnostic: incomplet
    relance: Tu as une bonne réponse. Une autre parle du rôle du visiteur et de ce qui n'est pas prévu.
  solution: 'Tinguely reste l''auteur, car il a conçu et construit la machine ; le dessin dépend aussi du hasard et du visiteur
    qui la met en marche. La notion d''artiste évolue : il devient concepteur d''un dispositif.'
- id: projet-interactif
  type: ordre
  difficulte: 2
  enonce: 'Projet fictif en classe : créer une petite œuvre qui réagit au public. Range les étapes dans l''ordre.'
  reponse:
    elements:
    - id: effet
      texte: Définir l'effet voulu sur le spectateur
    - id: capteur
      texte: 'Choisir le capteur et la réaction : une lumière, un son, un mouvement'
    - id: prototype
      texte: Programmer et fabriquer un prototype
    - id: tester
      texte: Le tester avec quelques camarades et corriger ce qui ne marche pas
    - id: exposer
      texte: Présenter l'œuvre au public et observer ses réactions
  indices:
    relance: Peut-on choisir un capteur sans savoir ce qu'on veut faire ressentir au spectateur ?
    methode: Va de l'intention vers la technique, puis vers les essais, et termine par le public.
    etape: On commence par définir l'effet voulu, puis on choisit le capteur. Que fait-on ensuite ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque. Deux étapes voisines sont inversées : peut-on tester un prototype qui n''est pas encore fabriqué ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère la première étape (l'intention) et la dernière (le public), puis range le reste.
  solution: Définir l'effet voulu, choisir capteur et réaction, programmer et fabriquer un prototype, le tester et le corriger,
    puis le présenter au public.
- id: analyse-tv-buddha
  type: ouverte
  difficulte: 3
  enonce: 'Nam June Paik, TV Buddha (1974) : une statue de Bouddha est assise face à un téléviseur ; une caméra filme la statue
    et le téléviseur montre son image en direct. En quelques phrases, analyse ce dispositif et la rencontre qu''il organise
    entre art et technologie.'
  criteres:
  - 'L''élève décrit le dispositif (statue, caméra, téléviseur, image en direct : circuit fermé).'
  - L'élève explique le croisement entre un objet traditionnel (la statue) et une technologie de son époque (la vidéo).
  - L'élève dit quelle question l'œuvre pose (se regarder, la méditation face aux écrans, le rôle du spectateur qui peut entrer
    dans l'image) et la justifie.
  indices:
    relance: Que regarde la statue ? Et que se passe-t-il si un visiteur passe entre elle et la caméra ?
    methode: Décris d'abord les éléments, puis ce qui relie la statue et l'écran, puis ce que cela fait penser.
    etape: Tu peux commencer ainsi « Paik place face à face un objet ancien et un appareil moderne... »
  solution: 'Paik place face à face une statue de Bouddha et un téléviseur. Une caméra filme la statue et l''écran montre
    son image en direct : c''est un circuit fermé, la statue semble se contempler sans fin. L''œuvre fait se rencontrer un
    objet religieux traditionnel, lié à la méditation, et la technologie vidéo des années 1970. Elle pose la question de notre
    rapport aux écrans : on s''y regarde soi-même. Si un visiteur passe devant la caméra, il apparaît lui aussi à l''écran
    et entre dans l''œuvre.'
- id: nblm-quelle-sculpture-pionniere-de-1956-creee-1
  type: choix
  difficulte: 2
  enonce: Quelle sculpture pionnière de 1956 créée par Nicolas Schöffer est une sculpture avec capteurs qui réagit à la lumière
    et aux sons de son environnement ?
  reponse:
    options:
    - id: o1
      texte: CYSP 1
    - id: o2
      texte: Méta-matic
    - id: o3
      texte: TV Buddha
    - id: o4
      texte: Les Pénétrables
    bonnes:
    - o1
  indices:
    relance: Réfléchis au nom de la sculpture métallique élaborée dans les années 1950 par Nicolas Schöffer.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : Les Méta-matics sont les machines à dessiner créées par Jean Tinguely à partir de 1959.'
  - si:
      contient:
      - o3
    relance: 'Faux : TV Buddha est une installation vidéo de Nam June Paik réalisée en 1974.'
  - si:
      contient:
      - o4
    relance: 'Faux : Les Pénétrables sont des installations suspendues créées par Jesús Rafael Soto.'
  solution: 'CYSP 1. C''est exact : CYSP 1 (1956) est une sculpture en métal pionnière dotée de capteurs réagissant à la lumière
    et aux sons.'
- id: nblm-comment-s-appellent-les-creations-de-jea-2
  type: choix
  difficulte: 2
  enonce: Comment s'appellent les créations de Jean Tinguely (à partir de 1959) conçues comme une machine à dessiner qui produit
    des dessins quand un visiteur la met en marche ?
  reponse:
    options:
    - id: o1
      texte: Les Méta-matics
    - id: o2
      texte: Les Pénétrables
    - id: o3
      texte: Les Ready-mades
    - id: o4
      texte: Les Outrenoirs
    bonnes:
    - o1
  indices:
    relance: Cherche le terme qui associe la notion de machine et de dessin automatique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : Les Pénétrables sont des installations immersives traversables de Jesús Rafael Soto.'
  - si:
      contient:
      - o3
    relance: 'Faux : Les ready-mades sont des objets manufacturés exposés sans transformation importante par Marcel Duchamp.'
  - si:
      contient:
      - o4
    relance: 'Faux : Les Outrenoirs sont des peintures fondées sur la lumière et la matière noire par Pierre Soulages.'
  solution: 'Les Méta-matics. C''est exact : les Méta-matics de Jean Tinguely sont des machines qui réalisent des dessins
    automatiquement.'
- id: nblm-dans-le-cas-d-une-uvre-interactive-quel-3
  type: choix
  difficulte: 2
  enonce: Dans le cas d'une œuvre interactive, quel rôle joue le spectateur lorsque le public déclenche l'œuvre ?
  reponse:
    options:
    - id: o1
      texte: Le public devient acteur car ses gestes, sa voix ou sa présence déclenchent ou transforment l'œuvre.
    - id: o2
      texte: Le public doit obligatoirement écrire le code informatique ou construire les circuits électroniques.
    - id: o3
      texte: Le public reste un observateur immobile devant une sculpture totalement fixe.
    - id: o4
      texte: Le public remplace l'artiste en inventant les règles plastiques de l'œuvre.
    bonnes:
    - o1
  indices:
    relance: Pense à la transformation du statut du spectateur qui passe d'observateur passif à participant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : C''est l''artiste (parfois aidé d''ingénieurs) qui conçoit le programme et le dispositif, pas le public.'
  - si:
      contient:
      - o3
    relance: 'Faux : Dans une œuvre interactive, l''œuvre bouge, réagit ou change grâce à l''intervention du public.'
  - si:
      contient:
      - o4
    relance: 'Faux : L''artiste reste le concepteur des règles et du dispositif original.'
  solution: 'Le public devient acteur car ses gestes, sa voix ou sa présence déclenchent ou transforment l''œuvre. C''est
    exact : dans une œuvre interactive, les actions ou la présence du public sont indispensables pour activer ou faire évoluer
    la création.'
- id: nblm-dans-les-projets-associant-art-et-scienc-4
  type: choix
  difficulte: 2
  enonce: Dans les projets associant art et sciences, qui demeure l'auteur et le véritable concepteur de la création artistique
    ?
  reponse:
    options:
    - id: o1
      texte: L'artiste, car il définit l'intention, le dispositif et les règles que la machine exécute.
    - id: o2
      texte: La machine ou l'ordinateur, car elle réalise physiquement l'action.
    - id: o3
      texte: Le capteur électronique, car il prend les décisions esthétiques.
    - id: o4
      texte: Le public seul, car l'artiste n'intervient plus du tout dans la conception.
    bonnes:
    - o1
  indices:
    relance: Considère l'origine de l'idée, de l'intention plastique et des règles du jeu.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : C''est une erreur fréquente de croire que la machine est l''artiste ; elle ne fait qu''exécuter les instructions
      pensées par l''humain.'
  - si:
      contient:
      - o3
    relance: 'Faux : Le capteur est un outil de détection technique, sans intention ni choix artistique.'
  - si:
      contient:
      - o4
    relance: 'Faux : L''artiste imagine et conçoit l''ensemble du dispositif interactif.'
  solution: 'L''artiste, car il définit l''intention, le dispositif et les règles que la machine exécute. C''est exact : l''artiste
    fixe l''intention et le programme ; la machine et la technologie ne font qu''exécuter.'
- id: nblm-depuis-quelle-periode-les-artistes-crois-5
  type: choix
  difficulte: 2
  enonce: Depuis quelle période les artistes croisent-ils les arts plastiques avec les sciences et les technologies (électronique,
    robotique) ?
  reponse:
    options:
    - id: o1
      texte: Depuis le milieu du XXe siècle (années 1950).
    - id: o2
      texte: Uniquement depuis l'apparition du Web et d'Internet dans les années 1990.
    - id: o3
      texte: Depuis la période de la Renaissance au XVIe siècle.
    - id: o4
      texte: Depuis le début des années 2020 avec l'intelligence artificielle.
    bonnes:
    - o1
  indices:
    relance: Pense aux premières sculptures cinétiques et électroniques créées dans les années 1950.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : C''est une erreur classique de penser que l''art technologique est né avec Internet ; il a débuté dès
      les années 1950.'
  - si:
      contient:
      - o3
    relance: 'Faux : La Renaissance s''intéressait à la perspective et aux sciences de l''observation, pas à l''électronique
      ou la robotique.'
  - si:
      contient:
      - o4
    relance: 'Faux : Les rencontres entre art, robotique et électronique sont bien plus anciennes.'
  solution: 'Depuis le milieu du XXe siècle (années 1950). C''est exact : ces métissages existent depuis le milieu du XXe
    siècle (ex. Schöffer en 1956 ou Tinguely en 1959).'
- id: nblm-quelles-sont-les-deux-definitions-exacte-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux définitions exactes dans le domaine des métissages entre arts plastiques et numérique ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un capteur est un composant électronique qui détecte la lumière, le son, un mouvement ou la chaleur.
    - id: o2
      texte: L'hybridation désigne le mélange de techniques, de pratiques ou de matériaux différents dans une même œuvre.
    - id: o3
      texte: Une œuvre interactive est une peinture traditionnelle que le public n'a pas le droit de toucher ni de faire évoluer.
    - id: o4
      texte: Un circuit fermé est une installation qui interdit l'usage des caméras et des écrans vidéo.
    bonnes:
    - o1
    - o2
  indices:
    relance: Repère les définitions exactes du composant de détection et du mélange des techniques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : Une œuvre interactive réagit aux actions ou à la présence du spectateur.'
  - si:
      contient:
      - o4
    relance: 'Faux : Un circuit fermé est un dispositif où une caméra filme et retransmet immédiatement l''image en direct
      sur un écran proche.'
  solution: 'Un capteur est un composant électronique qui détecte la lumière, le son, un mouvement ou la chaleur ; L''hybridation
    désigne le mélange de techniques, de pratiques ou de matériaux différents dans une même œuvre. C''est exact : le capteur
    permet au dispositif de capter un paramètre de l''environnement.'
- id: nblm-une-uvre-qui-reagit-aux-gestes-a-la-voix-7
  type: texte_court
  difficulte: 1
  enonce: Une œuvre qui réagit aux gestes, à la voix ou à la présence du spectateur est qualifiée d'œuvre ______ .
  reponse:
    acceptees:
    - interactive
    fautes_tolerees: 1
  indices:
    relance: Pense au terme qui caractérise l'interaction directe entre le public et l'œuvre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'interactive. C''est exact : l''adjectif ''interactive'' désigne une œuvre qui réagit aux interventions ou à la
    présence du public.'
- id: nblm-pour-detecter-la-lumiere-le-son-ou-le-mo-8
  type: texte_court
  difficulte: 1
  enonce: Pour détecter la lumière, le son ou le mouvement autour d'une sculpture numérique, l'artiste utilise un ______ .
  reponse:
    acceptees:
    - capteur
    fautes_tolerees: 1
  indices:
    relance: Pense au composant électronique qui capte les éléments du milieu extérieur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'capteur. C''est exact : un capteur est le composant électronique qui détecte les signaux de l''environnement.'
- id: annee-cysp
  type: nombre
  difficulte: 1
  enonce: En quelle année Nicolas Schöffer présente-t-il CYSP 1, une sculpture qui réagit à la lumière et aux sons grâce à
    des capteurs ?
  reponse:
    valeur: 1956
    forme: entier
  indices:
    relance: 'Relis les trois exemples de ta leçon : quelle date accompagne le nom de Schöffer ?'
    methode: Cherche dans la leçon la date écrite en face de CYSP 1.
    etape: C'est la plus ancienne des trois dates de la leçon (les deux autres sont 1959 et 1974).
  pieges:
  - si:
      valeur: 1959
    relance: 1959, c'est le début des Méta-matics de Tinguely, pas CYSP 1 de Schöffer.
  - si:
      valeur: 1974
    relance: 1974, c'est la date de TV Buddha de Paik, pas de CYSP 1.
  solution: 'CYSP 1 de Nicolas Schöffer date de 1956 : les croisements entre art et technologie existent depuis le milieu
    du XXe siècle.'
- id: mot-programme
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on la suite d'instructions que l'artiste écrit et que l'ordinateur exécute pour produire une image
    ou une animation ?
  reponse:
    acceptees:
    - programme
    - un programme
    - algorithme
    - un algorithme
    - programme informatique
    - code
    fautes_tolerees: 1
  indices:
    relance: Qui décide de ce que fait la machine, étape après étape ? Pense à une recette de cuisine pour ordinateur.
    methode: En informatique, on l'écrit dans un langage ; c'est ce qui indique à la machine quoi faire.
    etape: Ce mot désigne aussi, à la télévision, l'ensemble des émissions prévues dans la soirée.
  pieges:
  - si:
      valeur: logiciel
    relance: Un logiciel est l'outil que l'on utilise. Ici, on demande les instructions écrites par l'artiste elle-même.
  - si:
      valeur: machine
    relance: La machine exécute. Comment appelle-t-on ce qu'elle exécute, écrit par l'artiste ?
  - si:
      diagnostic: mauvaise_reponse
    relance: Cherche le mot qui désigne la liste d'instructions données à un ordinateur.
  solution: 'Le programme (ou algorithme) : l''artiste écrit les instructions, l''ordinateur les exécute. Le résultat peut
    changer à chaque lancement.'
