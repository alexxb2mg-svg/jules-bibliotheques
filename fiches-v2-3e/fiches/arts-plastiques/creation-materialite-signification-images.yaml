format: 2
notion: creation-materialite-signification-images
version: 2
etat: verifiee
declencheurs:
- ceci n'est pas une pipe
- image publicitaire
- reproduction d'un tableau
- différence entre une œuvre et une affiche
- la Joconde sur un tee-shirt
- message d'une image
- image de communication
prerequis:
- 4e-creation-materialite-signification-images
- sexprimer-analyser-sa-pratique
essentiel: 'Nous vivons entourés d''images très diverses : peintures, photographies, dessins, affiches, images de films, images
  d''écran, logos, panneaux. Elles n''ont pas toutes le même statut, ni la même intention.


  Pour analyser une image, on distingue plusieurs propriétés :

  - plastiques : ce qui la constitue matériellement (support, format, couleurs, lignes, matière, technique) ;

  - iconiques : ce qu''elle représente, ce qu''on y reconnaît (une pomme, un visage) ;

  - sémantiques : le sens, le message qu''elle transmet ;

  - symboliques : ce qu''un élément évoque par convention dans une culture (la colombe pour la paix, la balance pour la justice).


  Une image de communication visuelle (publicité, affiche, logo, signalisation) veut transmettre un message clair et rapide,
  souvent pour informer ou faire vendre. Une œuvre d''art relève d''une expression artistique : elle peut rester ouverte,
  faire douter, poser une question.


  Une œuvre n''est pas son image. « La Joconde » de Léonard de Vinci (vers 1503-1519) est une peinture à l''huile sur un panneau
  de bois d''environ 77 × 53 cm, conservée au musée du Louvre. Sa photo dans un livre, sur un écran ou sur un tee-shirt est
  une reproduction : elle change la taille, la matière, les couleurs et le contexte.


  René Magritte l''a montré avec humour dans « La Trahison des images » (1929, huile sur toile) : sous une pipe peinte, il
  écrit « Ceci n''est pas une pipe ». Il a raison : c''est l''image peinte d''une pipe, on ne peut pas la fumer.


  Une œuvre et l''image d''une œuvre n''ont pas le même statut. L''œuvre est un objet unique, avec ses dimensions et sa matière.
  L''image d''œuvre est une trace utile pour la connaître, mais elle la transforme.


  Une même image peut changer d''intention selon l''endroit où on la voit : un dessin exposé au musée est regardé comme une
  œuvre ; le même dessin sur une boîte de biscuits sert à vendre.


  Au brevet, on attend que tu nommes le statut de l''image, que tu distingues ses propriétés (plastiques, iconiques, sémantiques,
  symboliques) et que tu justifies l''intention (exprimer ou communiquer) avec un détail précis de l''image.

  '
methode:
- 'Identifier la nature de l''image : œuvre originale, reproduction, photographie, publicité, image d''écran…'
- Décrire ses propriétés plastiques (support, format, couleurs, technique), puis ce qu'elle représente.
- 'Chercher son sens : quel message ? quels symboles ?'
- 'Se demander quelle est l''intention : exprimer, questionner (œuvre) ou informer, convaincre, vendre (communication visuelle).'
- 'Pour une reproduction, dire ce qui change par rapport à l''œuvre : taille, matière, couleurs, lieu où on la voit.'
vocabulaire:
- terme: statut d'une image
  definition: 'ce qu''est une image et à quoi elle sert : œuvre, reproduction, document, publicité…'
- terme: communication visuelle
  definition: 'des images conçues pour transmettre un message clair et rapide : affiches, logos, publicités, signalisation'
- terme: reproduction
  definition: une copie d'une œuvre (photo, impression, carte postale) qui n'a ni la taille, ni la matière de l'original
- terme: symbole
  definition: un élément qui évoque une idée par convention (la colombe pour la paix)
- terme: propriété iconique
  definition: ce qu'une image représente et que l'on reconnaît (une pomme, un visage)
erreurs_frequentes:
- Confondre une œuvre et sa reproduction, comme si voir la photo d'un tableau revenait à voir le tableau.
- Ne décrire que ce que l'image représente, en oubliant ses qualités plastiques (support, format, matière).
- Croire qu'une affiche publicitaire et une œuvre ont forcément la même intention parce qu'elles utilisent les mêmes moyens.
- Confondre ce qu'une image montre (une pipe) et ce qu'elle est (de la peinture sur une toile).
exemple:
  enonce: Quelle différence y a-t-il entre voir « La Joconde » au Louvre et la voir sur l'écran d'un téléphone ?
  solution: 'Au Louvre, on voit l''œuvre elle-même : une peinture à l''huile sur panneau de bois, d''environ 77 × 53 cm, avec
    sa matière et ses craquelures. Sur l''écran, on voit une reproduction : une image faite de lumière, beaucoup plus petite,
    aux couleurs modifiées, sortie de son lieu. L''image renvoie à l''œuvre, mais ce n''est pas l''œuvre.'
exercices:
- id: mot-reproduction
  type: texte_court
  difficulte: 1
  enonce: La photo de « La Joconde » imprimée sur un tee-shirt n'est pas l'œuvre de Léonard de Vinci. Quel mot désigne cette
    copie de l'œuvre ?
  reponse:
    acceptees:
    - reproduction
    - une reproduction
    - image d'œuvre
    fautes_tolerees: 1
  indices:
    relance: Le tee-shirt porte-t-il la peinture originale, sur son panneau de bois ?
    methode: Cherche le mot qui désigne une image fabriquée à partir de l'œuvre, par photo ou impression, en de nombreux exemplaires.
    etape: Le mot contient le verbe « produire », précédé de « re- ».
  pieges:
  - si:
      valeur: original
    relance: L'original est la peinture conservée au Louvre. Comment appelle-t-on son image imprimée sur un tee-shirt ?
  - si:
      valeur: faux
    relance: 'Un faux cherche à tromper en se faisant passer pour l''original. Ici, personne n''est trompé : comment appelle-t-on
      cette copie ?'
  solution: 'C''est une reproduction : une image d''œuvre, qui n''a ni la taille, ni la matière, ni le lieu de l''original.'
- id: proprietes-image
  type: association
  difficulte: 2
  enonce: 'Une élève analyse une affiche (fictive) contre la guerre : une colombe blanche peinte à gros coups de pinceau sur
    un fond rouge. Relie chacune de ses remarques au type de propriété qu''elle décrit.'
  reponse:
    gauche:
    - id: a
      texte: « Les coups de pinceau sont épais et visibles, sur un fond rouge. »
    - id: b
      texte: « On reconnaît un oiseau blanc, les ailes ouvertes. »
    - id: c
      texte: « La colombe évoque la paix. »
    - id: d
      texte: « L'affiche dit qu'il faut arrêter la guerre. »
    droite:
    - id: w
      texte: propriété plastique (matière, couleurs, technique)
    - id: x
      texte: propriété iconique (ce qu'on reconnaît)
    - id: y
      texte: propriété symbolique (ce qu'un élément évoque par convention)
    - id: z
      texte: propriété sémantique (le message)
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Quelle remarque parle seulement de la peinture elle-même, sans dire ce qu'elle représente ?
    methode: 'Pour chaque remarque, demande-toi : parle-t-elle de la matière, de ce qu''on reconnaît, de ce qu''un élément
      évoque, ou du message ?'
    etape: La remarque sur les coups de pinceau parle de la matière. Laquelle dit ce qu'on reconnaît, sans interpréter ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Attention à ne pas confondre ce qu'un élément évoque et le message de toute
      l'affiche.
  - si:
      diagnostic: associations_fausses
    relance: Classe les remarques de la plus concrète (la matière) à la plus interprétée (le message).
  solution: 'Coups de pinceau et fond rouge : propriété plastique. Un oiseau blanc : propriété iconique. La colombe évoque
    la paix : propriété symbolique. Il faut arrêter la guerre : propriété sémantique.'
- id: magritte-pipe
  type: choix
  difficulte: 2
  enonce: Dans « La Trahison des images » (1929), René Magritte peint une pipe et écrit dessous « Ceci n'est pas une pipe
    ». Pourquoi cette phrase est-elle vraie ?
  reponse:
    options:
    - id: a
      texte: Parce que l'objet peint est en réalité un cigare
    - id: b
      texte: 'Parce que c''est une image de pipe, faite de peinture sur une toile : on ne peut pas la fumer'
    - id: c
      texte: Parce que Magritte s'est trompé en écrivant sa phrase
    - id: d
      texte: Parce que le tableau est une publicité pour un magasin de pipes
    bonnes:
    - b
  indices:
    relance: Si tu décrochais le tableau, pourrais-tu mettre du tabac dans cette pipe ?
    methode: Distingue ce que l'image représente et ce qu'elle est matériellement.
    etape: On reconnaît bien une pipe. Mais de quoi est-elle faite, sur ce tableau ?
  pieges:
  - si:
      contient:
      - a
    relance: On reconnaît clairement la forme d'une pipe. La question porte ailleurs. Qu'est-ce que le tableau, matériellement
      ?
  - si:
      contient:
      - d
    relance: C'est une huile sur toile de Magritte, pas une affiche. Que veut-il nous faire comprendre sur les images ?
  solution: 'La phrase est vraie : ce n''est pas une pipe, mais l''image peinte d''une pipe. Magritte nous rappelle qu''une
    représentation n''est pas la chose représentée.'
- id: intention-image
  type: choix
  difficulte: 1
  enonce: Parmi ces images, lesquelles relèvent de la communication visuelle ? (Plusieurs réponses possibles.)
  reponse:
    options:
    - id: a
      texte: Une affiche qui annonce les soldes d'un magasin
    - id: b
      texte: Le logo d'une marque de chaussures
    - id: c
      texte: Une huile sur toile exposée dans un musée
    - id: d
      texte: Un panneau qui indique la sortie de secours
    bonnes:
    - a
    - b
    - d
  indices:
    relance: Quelles images veulent transmettre un message clair et rapide, sans laisser de doute ?
    methode: Pour chaque image, demande-toi si elle sert à informer, signaler ou vendre.
    etape: Il y a plus d'une bonne réponse. Une seule image a d'abord une intention artistique.
  pieges:
  - si:
      contient:
      - c
    relance: 'Une peinture exposée au musée relève d''abord de l''expression artistique : elle peut rester ouverte, faire
      réfléchir. Quelles autres images servent à informer ou vendre ?'
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé une partie. Une image qui guide les gens dans un bâtiment ou qui fait connaître une marque transmet-elle
      aussi un message ?
  solution: L'affiche de soldes (vendre), le logo (faire reconnaître une marque) et le panneau de sortie (informer) relèvent
    de la communication visuelle. La peinture au musée relève de l'expression artistique.
- id: mot-symbole
  type: texte_court
  difficulte: 2
  enonce: Dans beaucoup d'images, une colombe évoque la paix et une balance évoque la justice. Comment appelle-t-on un élément
    qui évoque ainsi une idée, par convention ?
  reponse:
    acceptees:
    - symbole
    - un symbole
    fautes_tolerees: 0
  indices:
    relance: La colombe représente un oiseau. Mais quelle idée, plus abstraite, fait-elle penser ?
    methode: Cherche le mot qui désigne une image concrète renvoyant à une idée, reconnue par toute une culture.
    etape: Le mot commence par « sym- », comme « sympathie », et il a sept lettres.
  pieges:
  - si:
      valeur: logo
    relance: Un logo représente une marque ou une entreprise. Quel mot plus général désigne un élément qui évoque une idée
      comme la paix ?
  solution: 'C''est un symbole : un élément concret qui évoque une idée par convention (la colombe pour la paix).'
- id: comparer-oeuvre-affiche
  type: ouverte
  difficulte: 3
  enonce: 'Compare deux images (fictives) qui montrent la même pomme rouge : une affiche de supermarché, nette et lumineuse,
    avec le prix écrit en gros ; un tableau peint à l''huile, où la pomme, tachée et à moitié croquée, est posée seule sur
    une table sombre. Explique en quelques phrases la différence d''intention et justifie par les choix plastiques.'
  criteres:
  - 'L''élève distingue les intentions : informer et faire acheter (communication visuelle) d''un côté, exprimer ou faire
    réfléchir (expression artistique) de l''autre.'
  - L'élève justifie avec au moins deux choix plastiques précis (netteté, lumière, texte, matière, couleurs sombres, pomme
    croquée).
  - L'élève emploie le vocabulaire de la notion (statut, propriétés plastiques, iconiques, sémantiques ou symboliques).
  indices:
    relance: Que veut obtenir le supermarché de celui qui regarde l'affiche ? Et le peintre ?
    methode: Décris chaque image (couleurs, lumière, texte, matière), puis dis à quoi elle sert.
    etape: 'Tu peux commencer ainsi : « Les deux images représentent une pomme, mais elles n''ont pas le même statut… »'
  solution: 'Les deux images représentent une pomme, mais elles n''ont pas le même statut. L''affiche est de la communication
    visuelle : image nette, lumière vive et prix écrit en gros servent à donner envie d''acheter, vite et sans doute possible.
    Le tableau relève de l''expression artistique : la matière de la peinture, le fond sombre et la pomme croquée et tachée
    font penser au temps qui passe ; le sens reste ouvert.'
- id: mot-iconique
  type: texte_court
  difficulte: 2
  enonce: Parmi les propriétés d'une image (plastiques, sémantiques, symboliques…), comment appelle-t-on celle qui concerne
    ce que l'image représente et que l'on reconnaît, par exemple une pomme ou un visage ?
  reponse:
    acceptees:
    - iconique
    - iconiques
    - propriété iconique
    - propriétés iconiques
    fautes_tolerees: 1
  indices:
    relance: Quelle propriété répond à la question « qu'est-ce que je reconnais dans cette image ? »
    methode: Les propriétés plastiques parlent de la matière, les sémantiques du sens, les symboliques des conventions. Il
      en reste une.
    etape: Le mot est un adjectif de quatre syllabes qui se termine par « -ique ».
  pieges:
  - si:
      valeur: plastique
    relance: Les propriétés plastiques décrivent la matière de l'image (support, couleurs, technique). Ici, on parle de ce
      qu'on reconnaît dedans.
  - si:
      valeur: symbolique
    relance: Une propriété symbolique évoque une idée par convention (la colombe pour la paix). Ici, il s'agit de ce qu'on
      reconnaît simplement.
  - si:
      diagnostic: mauvaise_reponse
    relance: 'Relis les quatre propriétés d''une image dans la leçon : laquelle concerne ce qu''on reconnaît ?'
  solution: 'La propriété iconique : ce que l''image représente et que l''on reconnaît (une pomme, un visage).'
