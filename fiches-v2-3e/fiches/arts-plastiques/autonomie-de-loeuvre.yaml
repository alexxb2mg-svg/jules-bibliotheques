format: 2
notion: autonomie-de-loeuvre
version: 2
etat: verifiee
declencheurs:
- tableau qui ne représente rien
- peinture abstraite
- carré noir de Malevitch
- tableau dans le tableau
- rien que des formes et des couleurs
- art non figuratif
- miroir dans un tableau
prerequis:
- 4e-autonomie-de-loeuvre
- dispositif-de-representation
essentiel: 'Une œuvre est autonome quand elle ne cherche plus d''abord à copier le monde visible : elle existe pour elle-même,
  par ses formes, ses couleurs, ses matières, son format.

  En 1890, le peintre Maurice Denis rappelle qu''un tableau est « essentiellement une surface plane recouverte de couleurs
  en un certain ordre assemblées ».


  L''art abstrait ne représente ni objet ni personnage reconnaissable. En 1915, Kasimir Malevitch expose « Carré noir sur
  fond blanc », une peinture à l''huile sur toile réduite à un carré noir. Dans les années 1910, Piet Mondrian simplifie peu
  à peu des arbres jusqu''à ne garder que des lignes ; ses compositions des années 1920 n''utilisent plus que des lignes noires,
  du blanc et quelques aplats de couleurs.


  L''art concret (manifeste de Theo van Doesburg, 1930) va plus loin : une ligne, une couleur, un plan ne signifient rien
  d''autre qu''eux-mêmes. L''art informel, lui, laisse parler la matière et le geste : vers 1947-1950, Jackson Pollock pose
  sa toile au sol et y fait couler ou projeter la peinture (dripping). Depuis 1979, Pierre Soulages peint ses « outrenoirs
  », où c''est la lumière reflétée par la matière noire qui fait l''œuvre.


  Une œuvre peut aussi parler d''elle-même en montrant ses propres constituants : c''est l''autoréférence. La mise en abyme
  place une image dans l''image. Dans « Les Époux Arnolfini » (Jan van Eyck, 1434, huile sur panneau de bois), un petit miroir
  rond au fond de la pièce reflète la scène ; dans « Les Ménines » (Diego Velázquez, 1656, huile sur toile), le peintre se
  représente en train de peindre devant une immense toile.


  Entre les deux extrêmes, il existe des degrés : une image figurative reconnaissable, une image simplifiée, une image abstraite.
  Le mot « informel » ne veut pas dire « sans forme » : il désigne des formes non construites par la géométrie, nées du geste
  et de la matière.


  Au brevet, on attend que tu dises si l''œuvre renvoie ou non au monde visible, que tu nommes la démarche (abstraction, art
  concret, art informel, mise en abyme) et que tu justifies avec des éléments plastiques visibles (couleurs, lignes, matière,
  format).

  '
methode:
- 'Décrire ce que l''on voit vraiment : formes, couleurs, lignes, matière, format, sans chercher tout de suite « ce que ça
  représente ».'
- Se demander si l'œuvre renvoie au monde visible (figuration), s'en éloigne (simplification) ou n'y renvoie plus du tout
  (abstraction).
- Repérer si l'œuvre montre ses propres moyens (trace du pinceau, toile, cadre, atelier, image dans l'image).
- 'Nommer l''effet produit et relier l''œuvre à une démarche d''artiste : abstraction, art concret, art informel, mise en
  abyme.'
vocabulaire:
- terme: autonomie de l'œuvre
  definition: l'œuvre vaut pour elle-même, par ses moyens plastiques, sans avoir besoin d'imiter le monde visible
- terme: abstraction
  definition: un art qui ne représente ni objet, ni personnage, ni paysage reconnaissable
- terme: art concret
  definition: un art fait de formes géométriques et de couleurs qui ne renvoient qu'à elles-mêmes
- terme: art informel
  definition: un art abstrait où comptent la matière, la tache et l'énergie du geste plutôt que les formes géométriques
- terme: mise en abyme
  definition: une image placée à l'intérieur d'une image, qui peut renvoyer à l'œuvre elle-même
erreurs_frequentes:
- 'Croire qu''une œuvre abstraite est « facile » ou « faite au hasard » : les choix de couleurs, de format et de geste sont
  réfléchis.'
- Chercher à tout prix ce que l'œuvre abstraite « représente », au lieu de décrire ses formes, ses couleurs et sa matière.
- Confondre simplification (on reconnaît encore l'arbre) et abstraction (on ne reconnaît plus rien).
- 'Confondre mise en abyme et simple reflet : il faut que l''image dans l''image renvoie à la représentation elle-même.'
exemple:
  enonce: 'Une élève (production fictive) peint une grande toile couverte de bandes verticales bleues de largeurs différentes,
    sans rien représenter. Un camarade dit : « Ça ne veut rien dire. » Que peux-tu lui répondre ?'
  solution: 'L''œuvre ne représente rien du monde visible : elle est abstraite, donc autonome. Elle ne « veut » pas dire une
    histoire, mais elle agit sur celui qui regarde par ses moyens plastiques : le rythme des bandes, les différences de largeur,
    les nuances de bleu. On la regarde pour ce qu''elle est : une surface plane couverte de couleurs assemblées dans un certain
    ordre.'
exercices:
- id: mot-art-abstrait
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'art qui ne représente ni objet, ni personnage, ni paysage reconnaissable, comme le « Carré
    noir sur fond blanc » de Malevitch (1915) ?
  reponse:
    acceptees:
    - abstraction
    - art abstrait
    - abstrait
    - peinture abstraite
    fautes_tolerees: 1
  indices:
    relance: Peux-tu reconnaître quelque chose du monde réel dans ce carré noir ?
    methode: Le contraire de l'art figuratif, qui représente ce qu'on voit, porte un nom précis. Cherche-le dans ta leçon.
    etape: 'Le mot commence par « abs- », comme dans « absent » : le sujet reconnaissable est absent.'
  pieges:
  - si:
      valeur: figuratif
    relance: L'art figuratif représente des choses reconnaissables. Ici, que reconnais-tu ? Cherche le mot contraire.
  - si:
      valeur: art concret
    relance: C'est une forme proche, mais plus précise, née en 1930. Quel mot plus général désigne tout art qui ne représente
      rien de reconnaissable ?
  solution: 'C''est l''abstraction (l''art abstrait) : l''œuvre ne représente rien de reconnaissable, elle vaut par ses formes
    et ses couleurs.'
- id: mot-image-dans-image
  type: texte_court
  difficulte: 2
  enonce: Dans « Les Époux Arnolfini » de Jan van Eyck (1434), un petit miroir rond, au fond de la pièce, reflète toute la
    scène. Comment appelle-t-on ce procédé qui place une image dans l'image ?
  reponse:
    acceptees:
    - mise en abyme
    - mise en abîme
    fautes_tolerees: 1
  indices:
    relance: Que voit-on dans le miroir ? Est-ce une autre scène, ou la même, en plus petit ?
    methode: Une expression de trois mots désigne une image qui en contient une autre, comme une boîte dans une boîte.
    etape: L'expression commence par « mise en… » et son dernier mot désigne un gouffre sans fond.
  pieges:
  - si:
      valeur: reflet
    relance: C'est bien un reflet, mais le procédé a un nom précis quand l'image se répète à l'intérieur d'elle-même. Lequel
      ?
  - si:
      valeur: trompe-l'œil
    relance: 'Un trompe-l''œil cherche à tromper le spectateur. Ici, l''image se retrouve à l''intérieur d''elle-même : quel
      est le nom de ce procédé ?'
  solution: 'C''est une mise en abyme : le miroir montre, en petit, la scène que le tableau représente.'
- id: oeuvres-questions
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre réelle à la question qu'elle pose.
  reponse:
    gauche:
    - id: a
      texte: Kasimir Malevitch, « Carré noir sur fond blanc », 1915, huile sur toile
    - id: b
      texte: 'Diego Velázquez, « Les Ménines », 1656 : le peintre se représente devant une grande toile'
    - id: c
      texte: Jackson Pollock, toiles peintes au sol par coulures et projections, vers 1947-1950
    - id: d
      texte: 'Pierre Soulages, « outrenoirs », à partir de 1979 : toiles couvertes de noir strié'
    droite:
    - id: w
      texte: Une peinture peut-elle ne rien représenter du tout ?
    - id: x
      texte: Un tableau peut-il montrer l'acte même de peindre ?
    - id: y
      texte: Le geste et la trace de la peinture peuvent-ils suffire à faire l'œuvre ?
    - id: z
      texte: Une couleur sombre peut-elle faire apparaître de la lumière ?
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Pour chaque œuvre, qu'est-ce qui frappe en premier ? Un sujet, un geste, une forme, un reflet ?
    methode: Commence par l'œuvre la plus simple à décrire, puis élimine les questions déjà utilisées.
    etape: Chez Velázquez, on voit le peintre au travail, pinceau à la main. Quelle question parle de l'acte de peindre ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la description de chaque œuvre et vérifie celle qui te semble la moins
      sûre.
  - si:
      diagnostic: associations_fausses
    relance: Décris chaque œuvre en un mot (forme, atelier, geste, lumière) avant de chercher la question qui lui correspond.
  solution: 'Malevitch : une peinture peut ne rien représenter. Velázquez : le tableau montre l''acte de peindre. Pollock
    : le geste et la trace font l''œuvre. Soulages : le noir, par ses stries, fait apparaître la lumière.'
- id: production-autoreferentielle
  type: choix
  difficulte: 2
  enonce: Voici quatre productions d'élèves (fictives). Laquelle parle surtout d'elle-même, en montrant ses propres constituants
    ?
  reponse:
    options:
    - id: a
      texte: Un paysage de montagne peint de façon très réaliste
    - id: b
      texte: Une toile où l'on a peint le châssis en bois, les agrafes et le dos de la toile, comme si on la voyait de derrière
    - id: c
      texte: Le portrait d'un camarade dessiné au crayon
    - id: d
      texte: Une affiche qui annonce la fête du collège
    bonnes:
    - b
  indices:
    relance: Parmi ces productions, laquelle représente un tableau, plutôt qu'un paysage, une personne ou un événement ?
    methode: 'Une œuvre autoréférentielle prend pour sujet ce dont elle est faite : toile, cadre, peinture, geste.'
    etape: Élimine d'abord les productions qui représentent quelque chose du monde extérieur (montagne, camarade, fête).
  pieges:
  - si:
      contient:
      - a
    relance: Ce paysage renvoie au monde visible, à une vraie montagne. Laquelle renvoie plutôt à la peinture elle-même ?
  - si:
      contient:
      - d
    relance: L'affiche sert à informer sur un événement extérieur. Laquelle ne parle que de ce qui la constitue ?
  solution: 'La toile qui représente son propre châssis et son dos : elle prend pour sujet ce dont elle est faite. C''est
    une œuvre qui parle d''elle-même.'
- id: vers-abstraction
  type: ordre
  difficulte: 2
  enonce: Un élève (production fictive) s'éloigne peu à peu du monde visible en quatre dessins d'un arbre. Range ses dessins
    du plus figuratif au plus abstrait.
  reponse:
    elements:
    - id: observe
      texte: Un arbre dessiné d'après nature, avec son écorce et ses feuilles
    - id: simplifie
      texte: Le tronc et les branches simplifiés en quelques traits, sans feuilles
    - id: lignes
      texte: Un réseau de lignes courbes et droites où l'on devine encore des branches
    - id: aplats
      texte: Des lignes horizontales et verticales et des aplats colorés, sans arbre reconnaissable
  indices:
    relance: Dans quel dessin reconnais-tu le mieux un arbre ? Et dans lequel plus du tout ?
    methode: Place d'abord le dessin le plus proche du réel et le plus éloigné, puis range les deux autres entre eux.
    etape: Le dessin fait d'après nature vient en premier. Entre les deux du milieu, dans lequel devine-t-on encore des branches
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux dessins voisins sont inversés. Dans lequel des deux l'arbre est-il le plus reconnaissable ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pour chaque dessin, demande-toi : reconnaît-on encore l''arbre ? Beaucoup, un peu, à peine, plus du tout ?'
  solution: D'après nature, puis tronc simplifié, puis réseau de lignes, puis lignes et aplats sans arbre reconnaissable.
    Piet Mondrian a suivi un chemin comparable avec ses arbres dans les années 1910.
- id: analyser-oeuvre-abstraite
  type: ouverte
  difficulte: 3
  enonce: Une élève (production fictive) présente une toile carrée couverte de noir, où elle a creusé des stries avec un peigne
    dans la peinture épaisse. Elle l'intitule « Sans titre ». En quelques phrases, explique pourquoi on peut parler d'une
    œuvre autonome, et justifie le choix de ne pas lui donner de titre.
  criteres:
  - L'élève décrit les moyens plastiques de la toile (format carré, noir, matière épaisse, stries, lumière) avec le vocabulaire
    juste.
  - L'élève explique que la toile ne représente rien du monde visible et vaut par ce qu'elle est (autonomie, abstraction).
  - L'élève justifie le choix de « Sans titre » (ne pas orienter le regard vers un sujet), éventuellement en citant une œuvre
    réelle comparable.
  indices:
    relance: Que voit-on vraiment sur cette toile ? Y a-t-il un sujet reconnaissable ?
    methode: Décris d'abord (format, couleur, matière, geste), puis dis ce que l'œuvre ne fait pas (représenter), puis ce
      qu'un titre changerait.
    etape: 'Tu peux commencer ainsi : « Cette toile ne représente rien de reconnaissable : elle montre seulement… »'
  solution: 'Cette toile ne représente rien du monde visible : elle montre seulement un format carré, du noir, une matière
    épaisse et des stries faites au peigne, qui accrochent la lumière différemment. Elle est autonome : elle vaut par ses
    moyens plastiques, comme les outrenoirs de Pierre Soulages. Sans titre, le spectateur ne cherche pas un sujet caché ;
    il regarde la matière et la lumière.'
- id: annee-carre-noir
  type: nombre
  difficulte: 1
  enonce: En quelle année Kasimir Malevitch expose-t-il son « Carré noir sur fond blanc » ?
  reponse:
    valeur: 1915
    forme: entier
  indices:
    relance: C'est pendant la Première Guerre mondiale. Quelle année ?
    methode: 'Relis le deuxième paragraphe de la leçon : l''œuvre y est datée.'
    etape: L'année commence par « 19 » et se termine par un cinq.
  pieges:
  - si:
      valeur: 1890
    relance: 1890 est la date de la phrase de Maurice Denis sur le tableau comme surface plane. Malevitch expose plus tard.
  solution: Malevitch expose « Carré noir sur fond blanc » en 1915.
