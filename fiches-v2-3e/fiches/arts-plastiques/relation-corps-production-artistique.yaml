# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: relation-corps-production-artistique
version: 4
etat: verifiee
declencheurs:
- dripping
- anthropométries
- happening
- peindre avec tout son corps
- trace du geste
- action filmée par l'artiste
prerequis:
- 4e-relation-corps-production-artistique
essentiel: 'Le corps de l''artiste est engagé dans la production. Le geste (ample ou précis, lent ou rapide, appuyé ou léger)
  et l''instrument choisi (pinceau, brosse, couteau, bâton, éponge, ou le corps lui-même) laissent des traces différentes
  : coulures, éclaboussures, empreintes, frottements.

  Jackson Pollock, à la fin des années 1940, pose ses toiles au sol et tourne autour en faisant couler et projeter la peinture
  : c''est le dripping. Tout son corps se déplace, et la toile garde la trace de ses gestes.

  En 1960, à Paris, Yves Klein réalise ses Anthropométries : devant un public, des modèles enduites de peinture bleue appliquent
  leur corps sur de grandes feuilles. Le corps devient l''instrument qui laisse l''empreinte.


  Le processus peut devenir visible, et même devenir l''œuvre :

  - la performance : l''artiste réalise une action devant un public, en un lieu et un temps donnés. Marina Abramović reste
  assise en silence face aux visiteurs du MoMA de New York pendant près de trois mois dans The Artist Is Present (2010) ;

  - le happening : un événement en partie improvisé où le public participe, comme ceux d''Allan Kaprow à la fin des années
  1950 ;

  - l''œuvre éphémère, qui disparaît après l''action. La captation (photographie, vidéo) en garde la trace : Hans Namuth a
  photographié et filmé Pollock au travail en 1950.

  En 1961, Niki de Saint Phalle tire à la carabine sur des reliefs de plâtre qui cachent des poches de peinture (les Tirs)
  : l''action et son résultat comptent autant l''un que l''autre.


  Un même geste ne laisse pas la même trace selon l''instrument : un bâton laisse un trait fin, une brosse large une bande
  épaisse, la main une empreinte. Le support compte aussi (sol, mur, très grande feuille) : il détermine les mouvements possibles
  du corps.


  Le temps est un matériau : une action dure, se déploie dans un lieu, puis s''arrête. Quand l''œuvre est éphémère, il ne
  reste que la mémoire du public et les captations (photographies, films). Une captation n''est pas l''œuvre : c''est un document
  sur l''action.


  Au brevet, on attend que tu lises les traces (geste, instrument), que tu situes le corps de l''artiste et que tu dises comment
  le processus est rendu visible.

  '
methode:
- 'Observer les traces : quelle forme, quelle taille, quelle direction, quelle épaisseur ?'
- 'En déduire le geste et l''instrument : ample ou précis, rapide ou lent, avec quel outil, à quelle distance du support ?'
- 'Repérer la place du corps : la main seule, le bras, tout le corps, le corps d''autres personnes ?'
- 'Se demander si le processus est visible : trace finale, action devant un public, captation photo ou vidéo ?'
vocabulaire:
- terme: performance
  definition: action réalisée par l'artiste, avec son corps, devant un public, en un lieu et un temps donnés
- terme: happening
  definition: événement artistique en partie improvisé, où le public participe
- terme: dripping
  definition: technique qui consiste à faire couler et projeter la peinture sur un support posé au sol
- terme: œuvre éphémère
  definition: œuvre qui ne dure qu'un temps et disparaît
- terme: captation
  definition: enregistrement d'une action (photographie, film, vidéo) qui en garde la trace
- terme: trace
  definition: marque laissée par un geste, un instrument ou un corps sur un support
erreurs_frequentes:
- 'Confondre performance et happening : dans le happening, le public participe à un événement en partie improvisé.'
- 'Croire que les coulures de Pollock sont faites au hasard complet : ses gestes sont choisis et répétés.'
- 'Penser que la photo ou la vidéo d''une performance est la performance elle-même : c''est une captation, une trace.'
- Décrire seulement l'image finale sans dire quel geste et quel instrument l'ont produite.
exemple:
  enonce: 'Production fictive d''élève : Nora trempe une ficelle dans l''encre et la fait claquer plusieurs fois sur une grande
    feuille posée au sol. Décris le rôle du corps et de l''instrument.'
  solution: 'Nora se tient debout au-dessus de la feuille : son bras entier donne un geste rapide et répété. La ficelle, instrument
    souple, laisse des lignes fines et nettes avec des éclaboussures. La feuille garde la trace de chaque geste, comme les
    toiles de Pollock gardent la trace de ses déplacements.'
exercices:
- id: mot-performance
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une œuvre où l'artiste réalise une action avec son corps devant un public, en un lieu et un
    temps précis ?
  reponse:
    acceptees:
    - performance
    fautes_tolerees: 1
  indices:
    relance: 'Pense à Marina Abramović assise face aux visiteurs du MoMA : comment appelle-t-on ce type d''œuvre ?'
    methode: Le mot désigne une action en direct, un peu comme au spectacle, et il se dit aussi en anglais.
    etape: Le mot commence par « perf ».
  pieges:
  - si:
      valeur: happening
    relance: Dans un happening, le public participe à un événement en partie improvisé. Ici, c'est l'artiste qui agit devant
      le public. Quel mot convient ?
  - si:
      valeur: installation
    relance: Une installation occupe un espace, mais elle ne suppose pas une action de l'artiste en direct. Quel mot convient
      ?
  - si:
      diagnostic: mauvaise_reponse
    relance: Pense au mot qu'on emploie aussi pour un sportif qui réalise un exploit en direct.
  solution: 'Une performance : l''artiste agit avec son corps devant un public, en un lieu et un temps donnés, comme Marina
    Abramović dans The Artist Is Present (2010).'
- id: effet-du-balai
  type: choix
  difficulte: 1
  enonce: 'Situation fictive : un élève peint avec un large balai, en grands gestes rapides, sur une feuille de trois mètres
    posée au sol. Quel effet visuel peut-il attendre ?'
  reponse:
    options:
    - id: a
      texte: De larges traces énergiques, avec des éclaboussures et des épaisseurs variées
    - id: b
      texte: Des contours fins et très précis
    - id: c
      texte: Une couche de couleur parfaitement lisse et uniforme
    - id: d
      texte: Des détails minuscules
    bonnes:
    - a
  indices:
    relance: Un balai est-il un instrument fait pour la précision ?
    methode: Relie la taille de l'instrument et la vitesse du geste à la trace laissée.
    etape: Un geste rapide projette la peinture ; un instrument large laisse une trace large. Quelle réponse réunit les deux
      ?
  pieges:
  - si:
      contient:
      - b
    relance: Pour des contours fins, quel instrument faudrait-il ? Est-ce un balai ?
  - si:
      contient:
      - c
    relance: Des gestes rapides laissent-ils une couche bien régulière ?
  - si:
      contient:
      - d
    relance: Peut-on faire des détails minuscules avec un balai et de grands gestes ?
  solution: 'De larges traces énergiques : l''instrument large et le geste rapide et ample laissent des traînées épaisses,
    irrégulières, avec des éclaboussures. La trace garde l''énergie du corps.'
- id: mot-dripping
  type: texte_court
  difficulte: 2
  enonce: Quel mot anglais désigne la technique de Jackson Pollock qui consiste à faire couler et projeter la peinture sur
    une toile posée au sol ?
  reponse:
    acceptees:
    - dripping
    fautes_tolerees: 1
  indices:
    relance: En anglais, comment dit-on « goutter » ou « couler goutte à goutte » ?
    methode: Le mot vient du verbe anglais « to drip » (goutter), avec la terminaison qui forme un nom d'action.
    etape: Ajoute au verbe anglais la terminaison « -ing », en doublant la dernière consonne.
  pieges:
  - si:
      valeur: action painting
    relance: L'action painting est le nom du courant auquel on rattache Pollock. On cherche le nom de sa technique.
  - si:
      valeur: all over
    relance: « All over » décrit une composition qui couvre toute la toile. On cherche le nom de la technique de la peinture
      qui coule.
  - si:
      diagnostic: mauvaise_reponse
    relance: Pense au verbe anglais qui veut dire « goutter ».
  solution: 'Le dripping : Pollock fait couler et projeter la peinture sur la toile posée au sol, en tournant autour. Sa technique
    est rattachée à l''action painting.'
- id: corps-et-oeuvres
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à la manière dont le corps y est impliqué.
  reponse:
    gauche:
    - id: a
      texte: Jackson Pollock, toiles peintes au sol (fin des années 1940)
    - id: b
      texte: Yves Klein, Anthropométries (1960)
    - id: c
      texte: Niki de Saint Phalle, Tirs (1961)
    - id: d
      texte: Marina Abramović, The Artist Is Present (2010)
    droite:
    - id: x
      texte: L'artiste tourne autour de la toile et projette la peinture
    - id: y
      texte: Des corps enduits de peinture laissent leur empreinte sur le papier
    - id: z
      texte: L'artiste tire à la carabine et fait éclater des poches de peinture
    - id: w
      texte: L'artiste reste assise en silence face aux visiteurs, pendant des semaines
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Dans quelle œuvre le mot du titre évoque-t-il une arme ?
    methode: Pour chaque œuvre, demande-toi si le corps projette, imprime, vise ou simplement est présent.
    etape: '« Anthropo- » veut dire « humain » : les Anthropométries utilisent des corps humains. Place les autres.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Dans laquelle de ces œuvres aucune peinture n'est utilisée ?
  - si:
      diagnostic: associations_fausses
    relance: 'Repars des titres : lequel parle de tir ? lequel parle de la présence de l''artiste ?'
  solution: Pollock projette la peinture en tournant autour de la toile. Klein fait imprimer des corps enduits de peinture.
    Niki de Saint Phalle tire à la carabine sur des poches de peinture. Marina Abramović est présente, assise face aux visiteurs.
- id: rendre-le-processus-visible
  type: ordre
  difficulte: 2
  enonce: 'Projet fictif en classe : rendre visible le processus d''une production. Range les étapes dans l''ordre. Les essais
    sur de petites feuilles se font avant toute préparation du tournage.'
  reponse:
    elements:
    - id: choisir
      texte: Choisir le geste, l'instrument et le support
    - id: essais
      texte: Faire des essais sur de petites feuilles et comparer les traces
    - id: camera
      texte: Installer la caméra pour filmer l'action
    - id: action
      texte: Réaliser l'action devant la classe
    - id: presenter
      texte: Présenter ensemble la trace obtenue et la vidéo
  indices:
    relance: Peut-on filmer une action si la caméra n'est pas encore installée ?
    methode: Sépare la préparation, l'action elle-même, puis la présentation au public.
    etape: On commence par choisir le geste et l'instrument, puis on fait des essais. Que faut-il préparer avant l'action
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque. Deux étapes voisines sont inversées : la caméra doit-elle être prête avant ou après le début de l''action
      ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère la première étape (les choix de départ) et la dernière (montrer le résultat), puis range le reste.
  solution: Choisir geste, instrument et support ; faire des essais ; installer la caméra ; réaliser l'action devant la classe
    ; présenter la trace avec la vidéo, qui rend le processus lisible.
- id: justifier-un-geste
  type: ouverte
  difficulte: 3
  enonce: Tu dois réaliser une production où ton geste reste bien visible. Décris l'instrument, le geste et le support que
    tu choisis, explique l'effet visuel attendu, puis dis comment tu garderais une trace du processus. Appuie-toi sur un exemple
    d'artiste.
  criteres:
  - L'élève décrit précisément un instrument, un geste (amplitude, vitesse, place du corps) et un support.
  - L'élève relie ces choix à un effet visuel attendu (type de trace, énergie, échelle).
  - L'élève propose un moyen de rendre le processus lisible (captation photo ou vidéo, action devant un public) et cite un
    artiste de façon juste.
  indices:
    relance: Avec quel instrument ton geste laisserait-il une trace qu'on ne peut pas confondre avec une autre ?
    methode: 'Présente tes choix dans l''ordre : instrument, geste, support, effet, trace du processus, exemple d''artiste.'
    etape: Tu peux commencer ainsi « Je choisis un grand pinceau-brosse et une feuille posée au sol, parce que... »
  solution: 'Je choisis une brosse large et une feuille de deux mètres posée au sol. Je travaille debout, avec des gestes
    amples et rapides du bras entier : les traces seront larges, avec des coulures et des éclaboussures qui montrent la vitesse
    du geste. Comme Pollock, qui tournait autour de ses toiles posées au sol, mon corps entier se déplace. Pour rendre le
    processus lisible, un camarade filme l''action, et je présente la vidéo à côté de la feuille terminée, comme les films
    de Hans Namuth montrant Pollock au travail.'
- id: nblm-en-quoi-consiste-la-technique-du-drippin-1
  type: choix
  difficulte: 2
  enonce: En quoi consiste la technique du dripping utilisée par Jackson Pollock à la fin des années 1940 ?
  reponse:
    options:
    - id: o1
      texte: À poser la toile au sol et à faire couler ou projeter la peinture en déplaçant tout son corps autour d'elle.
    - id: o2
      texte: À appliquer la peinture bleue directement avec le corps de modèles vivants sur de grandes feuilles verticales.
    - id: o3
      texte: À peindre avec une extrême précision des motifs géométriques à l'aide de règles et de pinceaux très fins.
    - id: o4
      texte: À réaliser des coulures aléatoires en laissant tomber de la peinture au hasard sans aucun choix de geste.
    bonnes:
    - o1
  indices:
    relance: Pense au support posé à plat et à la manière dont l'artiste tourne autour de la toile.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : cette description correspond aux Anthropométries d''Yves Klein et non au dripping de Jackson Pollock.'
  - si:
      contient:
      - o3
    relance: 'Faux : le dripping repose sur la projection et les coulures de peinture par le mouvement du corps, et non sur
      un tracé géométrique rigide.'
  - si:
      contient:
      - o4
    relance: 'Faux : c''est une erreur fréquente de croire que les coulures de Pollock sont faites au hasard complet ; ses
      gestes sont réfléchis, choisis et répétés.'
  solution: 'À poser la toile au sol et à faire couler ou projeter la peinture en déplaçant tout son corps autour d''elle.
    C''est exact : dans le dripping, Pollock pose la toile au sol et déplace tout son corps autour pour projeter ou laisser
    couler la peinture, laissant la trace de ses gestes.'
- id: nblm-comment-yves-klein-realise-t-il-ses-anth-2
  type: choix
  difficulte: 2
  enonce: Comment Yves Klein réalise-t-il ses Anthropométries en 1960 ?
  reponse:
    options:
    - id: o1
      texte: Des modèles enduites de peinture bleue appliquent leur corps sur de grandes feuilles, le corps devenant l'instrument
        qui laisse l'empreinte.
    - id: o2
      texte: L'artiste peint son propre corps en noir pour réaliser une performance silencieuse assis devant un public.
    - id: o3
      texte: L'artiste projette de la peinture à la carabine sur des assemblages de plâtre contenant des poches de couleur.
    - id: o4
      texte: Les spectateurs sont invités à tremper leurs mains dans la peinture pour peindre ensemble sur les murs.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui sert d'instrument pour déposer la couleur bleue sur le papier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : cela confond la démarche d''Yves Klein avec une performance comme celle de Marina Abramović (The Artist
      Is Present).'
  - si:
      contient:
      - o3
    relance: 'Faux : les Tirs à la carabine sont l''œuvre de Niki de Saint Phalle (1961), pas des Anthropométries d''Yves
      Klein.'
  - si:
      contient:
      - o4
    relance: 'Faux : dans les Anthropométries, ce sont des modèles guidées par l''artiste qui appliquent leur corps enduit
      de peinture, et non le public.'
  solution: 'Des modèles enduites de peinture bleue appliquent leur corps sur de grandes feuilles, le corps devenant l''instrument
    qui laisse l''empreinte. C''est exact : pour les Anthropométries, le corps des modèles enduites de peinture bleue devient
    l''instrument qui dépose l''empreinte sur le support.'
- id: nblm-quelle-est-la-difference-principale-entr-3
  type: choix
  difficulte: 2
  enonce: Quelle est la différence principale entre une performance et un happening ?
  reponse:
    options:
    - id: o1
      texte: Dans un happening, l'événement est en partie improvisé et le public y participe activement.
    - id: o2
      texte: La performance est toujours enregistrée en vidéo alors que le happening ne laisse aucune trace.
    - id: o3
      texte: Le happening est exécuté uniquement par l'artiste sans jamais faire intervenir le moindre spectateur.
    - id: o4
      texte: La performance est une sculpture en volume alors que le happening est une peinture sur toile.
    bonnes:
    - o1
  indices:
    relance: Porte attention au rôle du public et à la part d'improvisation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : les deux types d''actions peuvent être conservés par captation (photographie ou film).'
  - si:
      contient:
      - o3
    relance: 'Faux : au contraire, le happening se caractérise par la participation active du public.'
  - si:
      contient:
      - o4
    relance: 'Faux : performance et happening sont toutes deux des actions artistiques liées au corps et au temps, pas des
      catégories d''objets fixes.'
  solution: 'Dans un happening, l''événement est en partie improvisé et le public y participe activement. C''est exact : l''erreur
    fréquente est de les confondre, mais le happening implique une part d''improvisation et la participation du public.'
- id: nblm-quel-est-le-statut-de-la-photographie-ou-4
  type: choix
  difficulte: 2
  enonce: Quel est le statut de la photographie ou du film (comme ceux de Hans Namuth montrant Jackson Pollock) pour une action
    artistique éphémère ?
  reponse:
    options:
    - id: o1
      texte: C'est une captation, c'est-à-dire un enregistrement qui garde la trace de l'action, mais ce n'est pas l'action
        elle-même.
    - id: o2
      texte: C'est l'œuvre elle-même, car l'action physique de l'artiste n'a aucune valeur artistique.
    - id: o3
      texte: C'est un document juridique prouvant l'authenticité de la toile auprès des musées.
    - id: o4
      texte: C'est un fichier créé automatiquement par un ordinateur sans intervention humaine.
    bonnes:
    - o1
  indices:
    relance: Cherche le terme exact désignant la mémoire enregistrée d'un événement éphémère.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : dans ces démarches, le geste et l''action de l''artiste constituent le cœur du processus créatif.'
  - si:
      contient:
      - o3
    relance: 'Faux : la captation a une fonction documentaire et de mémoire de la démarche artistique, et non un rôle juridique.'
  - si:
      contient:
      - o4
    relance: 'Faux : la captation photo ou vidéo réclame un enregistrement photographique ou cinématographique réel de la
      démarche de l''artiste.'
  solution: 'C''est une captation, c''est-à-dire un enregistrement qui garde la trace de l''action, mais ce n''est pas l''action
    elle-même. C''est exact : penser que la photo ou la vidéo est l''action elle-même est une erreur typique ; il s''agit
    d''une captation qui en garde la mémoire.'
- id: nblm-dans-la-serie-des-tirs-1961-de-niki-de-s-5
  type: choix
  difficulte: 2
  enonce: Dans la série des « Tirs » (1961) de Niki de Saint Phalle, comment l'action de l'artiste se répercute-t-elle sur
    l'œuvre ?
  reponse:
    options:
    - id: o1
      texte: 'L''artiste tire à la carabine sur des reliefs de plâtre piégeant de la peinture : l''action et son résultat
        comptent autant l''un que l''autre.'
    - id: o2
      texte: L'artiste dessine des carabines avec une précision hyperréaliste au pinceau fin.
    - id: o3
      texte: L'artiste demande au public de sculpter la peinture fraîche avec des couteaux de cuisine.
    - id: o4
      texte: L'œuvre est générée virtuellement par un logiciel informatique simulant des tirs.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'instrument particulier utilisé pour faire jaillir la peinture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : il ne s''agit pas de peindre des armes, mais d''accomplir le geste réel de tirer à la carabine.'
  - si:
      contient:
      - o3
    relance: 'Faux : Niki de Saint Phalle accomplit elle-même l''action du tir à la carabine sur les reliefs de plâtre.'
  - si:
      contient:
      - o4
    relance: 'Faux : il s''agit d''une action matérielle et physique bien réelle avec une arme et du plâtre.'
  solution: 'L''artiste tire à la carabine sur des reliefs de plâtre piégeant de la peinture : l''action et son résultat comptent
    autant l''un que l''autre. C''est exact : la performance du tir fait éclater les poches de peinture sous le plâtre, rendant
    l''action indissociable du résultat visuel.'
- id: nblm-parmi-les-propositions-suivantes-concern-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes concernant l'engagement du corps dans la création artistique, quelles sont les
    DEUX affirmations exactes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le geste de l'artiste (ample ou précis, rapide ou lent) et l'instrument choisi laissent des traces observables
        sur le support.
    - id: o2
      texte: Le corps de l'artiste peut devenir lui-même l'instrument qui applique directement la peinture sur le support.
    - id: o3
      texte: Les traces de coulures sur une toile sont toujours la preuve d'une erreur technique ou d'un manque de maîtrise.
    - id: o4
      texte: Pour analyser une œuvre engagée du corps, il suffit de regarder l'image finale sans se soucier des gestes qui
        l'ont produite.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense au lien direct entre la trace physique sur le support, le mouvement du corps et le choix de l'instrument.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : les coulures et projections (comme dans le dripping) peuvent être un choix délibéré et maîtrisé pour
      garder la trace du mouvement.'
  - si:
      contient:
      - o4
    relance: 'Faux : c''est une erreur fréquente de négliger le geste et l''instrument pour ne s''intéresser qu''au résultat
      final statique.'
  solution: 'Le geste de l''artiste (ample ou précis, rapide ou lent) et l''instrument choisi laissent des traces observables
    sur le support ; Le corps de l''artiste peut devenir lui-même l''instrument qui applique directement la peinture sur le
    support. C''est exact : la forme, l''épaisseur et la direction des traces conservent la mémoire du geste et de l''outil
    utilisé.'
