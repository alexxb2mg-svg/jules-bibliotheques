    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: ready-made. Le ready-made (littéralement « déjà fait ») est le terme consacré pour désigner l'objet industriel
    promu au rang d'œuvre d'art par le geste de l'artiste.
