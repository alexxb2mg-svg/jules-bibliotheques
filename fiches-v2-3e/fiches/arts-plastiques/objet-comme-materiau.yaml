format: 2
notion: objet-comme-materiau
version: 2
etat: verifiee
declencheurs:
- ready-made
- détourner un objet du quotidien
- sculpture faite avec des objets récupérés
- tasse en fourrure
- un objet banal exposé au musée
prerequis:
- 4e-objet-comme-materiau
- qualites-physiques-materiaux
essentiel: 'Depuis le début du XXe siècle, des artistes utilisent de vrais objets comme matériau de leurs œuvres.


  Le ready-made (« déjà fait ») est un objet manufacturé choisi par l''artiste et exposé presque sans modification. En 1913,
  Marcel Duchamp fixe une roue de bicyclette sur un tabouret (« Roue de bicyclette ») ; en 1917, il présente un urinoir en
  porcelaine, posé à l''envers et signé « R. Mutt », sous le titre « Fontaine ». C''est une décontextualisation : l''objet
  est sorti de son lieu et de son usage habituels, puis recontextualisé dans un lieu d''exposition, où il pose la question
  « qu''est-ce qu''une œuvre d''art ? ».


  Les artistes peuvent aussi transformer les objets :

  - le détournement donne à l''objet un autre sens ou une autre fonction : en 1921, Man Ray colle une rangée de clous sous
  un fer à repasser (« Cadeau »), qui ne peut plus repasser ; en 1936, Meret Oppenheim recouvre de fourrure une tasse, sa
  soucoupe et sa cuillère (« Objet », dit aussi « Le Déjeuner en fourrure ») ;

  - l''assemblage réunit plusieurs objets : en 1942, Pablo Picasso assemble une selle et un guidon de vélo pour faire une
  « Tête de taureau » ;

  - l''accumulation répète un même objet : à partir de la fin des années 1950, Arman remplit des boîtes transparentes d''objets
  identiques.


  La sublimation rend précieux ou poétique un objet banal (la « Tête de taureau » de Picasso a ensuite été coulée en bronze).
  La citation reprend un objet ou une œuvre connue pour la faire parler autrement.

  '
methode:
- 'Identifier l''objet de départ : ce qu''il est, à quoi il sert, où on le trouve d''habitude.'
- 'Nommer l''opération : ready-made, détournement, assemblage, accumulation, transformation.'
- 'Observer le changement de contexte : d''où vient l''objet, où est-il présenté maintenant ?'
- Dire l'effet produit (humour, surprise, malaise, poésie) et la question que l'œuvre pose.
vocabulaire:
- terme: ready-made
  definition: objet manufacturé choisi par un artiste et exposé presque sans modification comme une œuvre
- terme: détournement
  definition: le fait de donner à un objet un autre sens ou une autre fonction que ceux prévus
- terme: décontextualisation
  definition: le fait de sortir un objet de son lieu et de son usage habituels
- terme: recontextualisation
  definition: le fait de placer l'objet dans un nouveau contexte (musée, installation) qui change son sens
- terme: sublimation
  definition: le fait de rendre précieux, noble ou poétique un objet banal
erreurs_frequentes:
- 'Croire qu''un ready-made est « n''importe quoi » : le choix de l''objet, du titre et du lieu d''exposition est un geste
  d''artiste.'
- Confondre détournement (l'objet change de sens ou d'usage) et simple décoration de l'objet.
- 'Oublier le rôle du lieu : c''est souvent l''exposition qui change le regard porté sur l''objet.'
- Décrire l'objet sans dire ce que l'artiste en a fait ni la question que l'œuvre pose.
exemple:
  enonce: Un élève (fictif) remplit une boîte en plexiglas de cent brosses à dents usagées et l'expose au CDI. Quelle opération
    a-t-il réalisée, et quel effet cela produit-il ?
  solution: 'Il a réalisé une accumulation, comme Arman : il répète un même objet banal. Sorties de la salle de bains et réunies
    dans une boîte exposée, les brosses à dents ne servent plus à rien : on les regarde pour leurs formes et leurs couleurs.
    La quantité fait aussi penser à tout ce que nous consommons et jetons.'
exercices:
- id: mot-ready-made
  type: texte_court
  difficulte: 1
  enonce: En 1917, Marcel Duchamp expose un urinoir en porcelaine, acheté dans le commerce et signé « R. Mutt ». Comment appelle-t-on
    un objet manufacturé choisi par un artiste et exposé presque sans modification ?
  reponse:
    acceptees:
    - ready-made
    - ready made
    - readymade
    - objet tout fait
    fautes_tolerees: 1
  indices:
    relance: L'artiste a-t-il fabriqué cet objet lui-même, ou l'a-t-il trouvé « déjà fait » ?
    methode: Le mot vient de l'anglais et signifie « déjà fait », « prêt à l'emploi ».
    etape: 'Il s''agit de deux mots anglais reliés par un trait d''union : le premier veut dire « prêt », le second « fait
      ».'
  pieges:
  - si:
      valeur: sculpture
    relance: Duchamp n'a pas sculpté cet objet, il l'a choisi tel quel. Quel mot anglais désigne ce type d'œuvre ?
  - si:
      valeur: assemblage
    relance: Un assemblage réunit plusieurs éléments. Ici, un seul objet est exposé presque tel quel. Quel est le mot ?
  solution: 'C''est un ready-made (« déjà fait ») : Duchamp choisit un objet manufacturé et le présente comme une œuvre.'
- id: oeuvres-operations
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre réelle à l'opération que l'artiste fait subir aux objets.
  reponse:
    gauche:
    - id: a
      texte: 'Pablo Picasso, « Tête de taureau », 1942 : une selle et un guidon de vélo'
    - id: b
      texte: 'Man Ray, « Cadeau », 1921 : un fer à repasser avec des clous collés sous la semelle'
    - id: c
      texte: 'Arman, « Accumulations », à partir de la fin des années 1950 : des objets identiques dans une boîte'
    - id: d
      texte: 'Marcel Duchamp, « Fontaine », 1917 : un urinoir posé à l''envers, signé et exposé'
    droite:
    - id: w
      texte: Assembler des objets différents pour créer une image nouvelle
    - id: x
      texte: Rendre un objet inutilisable pour lui donner un autre sens
    - id: y
      texte: Répéter un même objet en grande quantité
    - id: z
      texte: Choisir un objet tout fait et le présenter dans un lieu d'exposition
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Dans laquelle de ces œuvres y a-t-il beaucoup d'exemplaires du même objet ?
    methode: Pour chaque œuvre, compte les objets (un seul, deux, beaucoup) et demande-toi si l'objet peut encore servir.
    etape: Chez Picasso, deux objets différents forment une tête d'animal. Chez Man Ray, le fer peut-il encore repasser ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie les deux œuvres faites d''un seul objet : laquelle transforme l''objet,
      laquelle le montre tel quel ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par compter les objets dans chaque œuvre : un seul, deux, beaucoup. Cela en place déjà plusieurs.'
  solution: 'Picasso : assemblage de deux objets en une tête de taureau. Man Ray : détournement qui rend le fer inutilisable.
    Arman : accumulation d''un même objet. Duchamp : ready-made, objet tout fait présenté dans un lieu d''exposition.'
- id: decontextualiser
  type: choix
  difficulte: 2
  enonce: Parmi ces productions d'élèves (fictives), laquelle repose surtout sur une décontextualisation de l'objet ?
  reponse:
    options:
    - id: a
      texte: Une chaise d'école posée seule, sur un socle blanc, au milieu du hall, avec un cartel et un titre
    - id: b
      texte: Une chaise d'école dessinée au crayon d'après nature
    - id: c
      texte: Une chaise d'école réparée et remise dans la salle de classe
    bonnes:
    - a
  indices:
    relance: Dans quelle production l'objet a-t-il quitté son lieu et son usage habituels ?
    methode: Décontextualiser, c'est sortir un objet réel de son contexte pour le montrer ailleurs, autrement.
    etape: Le dessin n'utilise pas le vrai objet ; la chaise réparée reste en classe. Que reste-t-il ?
  pieges:
  - si:
      contient:
      - b
    relance: Un dessin représente l'objet, il n'utilise pas le vrai objet. Dans quelle production la vraie chaise change-t-elle
      de lieu ?
  - si:
      contient:
      - c
    relance: La chaise réparée retourne dans la classe, à son usage habituel. Laquelle quitte son contexte ?
  solution: 'La chaise sur un socle, dans le hall, avec un cartel : sortie de la classe et de son usage, présentée comme une
    œuvre, elle est décontextualisée puis recontextualisée.'
- id: mot-detournement
  type: texte_court
  difficulte: 2
  enonce: En 1936, Meret Oppenheim recouvre de fourrure une tasse, sa soucoupe et sa cuillère. L'objet garde sa forme, mais
    on ne peut plus boire dedans sans dégoût. Comment appelle-t-on le fait de donner ainsi à un objet un autre sens ou un
    autre usage que celui prévu ?
  reponse:
    acceptees:
    - détournement
    - un détournement
    - détournement d'objet
    fautes_tolerees: 1
  indices:
    relance: La tasse sert-elle encore à boire ? Que lui est-il arrivé ?
    methode: 'Le mot évoque un changement de direction : on fait prendre à l''objet un autre chemin que prévu.'
    etape: Le mot commence par « dé- » et se termine par « -ment », comme quand on change la route d'un avion.
  pieges:
  - si:
      valeur: ready-made
    relance: 'Un ready-made est exposé presque sans modification. Ici, la tasse est transformée : quel mot désigne ce changement
      de sens ?'
  - si:
      valeur: assemblage
    relance: 'L''artiste n''assemble pas des objets différents : elle change le sens d''un seul objet. Quel est le mot ?'
  solution: 'C''est un détournement : la tasse garde sa forme, mais la fourrure lui donne un autre sens et empêche son usage.'
- id: demarche-assemblage
  type: ordre
  difficulte: 1
  enonce: Range les étapes d'une démarche d'assemblage d'objets récupérés, de la première à la dernière.
  reponse:
    elements:
    - id: collecter
      texte: Collecter des objets usagés
    - id: essayer
      texte: Essayer plusieurs agencements sans rien fixer
    - id: fixer
      texte: Fixer les objets dans l'agencement choisi
    - id: presenter
      texte: Présenter l'assemblage avec un titre
  indices:
    relance: De quoi as-tu besoin avant de pouvoir essayer quoi que ce soit ?
    methode: 'Pense à l''ordre logique : rassembler, chercher, décider, montrer.'
    etape: On commence par collecter les objets. Faut-il fixer avant ou après avoir essayé ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Peut-on faire la seconde avant la première ?
  - si:
      diagnostic: ordre_faux
    relance: Place d'abord la toute première étape et la toute dernière, puis range les deux autres.
  solution: Collecter les objets, essayer plusieurs agencements, fixer l'agencement choisi, présenter avec un titre.
- id: analyser-tete-taureau
  type: ouverte
  difficulte: 3
  enonce: En 1942, Pablo Picasso assemble une selle et un guidon de vélo pour faire une « Tête de taureau ». En quelques phrases,
    explique ce qu'il fait des objets et ce que l'œuvre nous fait comprendre.
  criteres:
  - L'élève identifie les objets de départ (selle, guidon de vélo) et l'opération (assemblage, détournement).
  - 'L''élève explique le changement de sens : les objets perdent leur usage et deviennent une image (la tête et les cornes).'
  - L'élève dit l'effet ou la question posée (humour, regard neuf sur les objets banals, sublimation par le bronze), avec
    le vocabulaire de la notion.
  indices:
    relance: Quelle partie du vélo devient les cornes ? Et laquelle devient la tête ?
    methode: Décris les objets, dis ce que Picasso en fait, puis ce que l'on voit maintenant et ce que cela nous apprend.
    etape: 'Tu peux commencer ainsi : « Picasso part de deux objets d''un vélo : une selle et un guidon… »'
  solution: 'Picasso part de deux objets d''un vélo : une selle et un guidon. Il les assemble : la selle devient la tête,
    le guidon devient les cornes. Les objets perdent leur usage et sont détournés pour former une image simple et forte. L''œuvre
    montre qu''un regard d''artiste peut voir autre chose dans des objets banals ; coulée ensuite en bronze, la tête de taureau
    transforme ces objets usés en sculpture précieuse.'
- id: nblm-qu-est-ce-qu-un-ready-made-en-arts-plast-1
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qu'un ready-made en arts plastiques lorsqu'un artiste choisit un objet banal exposé au musée ?
  reponse:
    options:
    - id: o1
      texte: Un objet manufacturé du quotidien choisi par l'artiste et exposé presque sans modification.
    - id: o2
      texte: Une peinture de grande taille représentant fidèlement un objet du quotidien.
    - id: o3
      texte: Une sculpture en marbre taillée à la main par l'artiste d'après un modèle réel.
    - id: o4
      texte: Une simple décoration faite sur un objet usagé pour le rendre plus joli.
    bonnes:
    - o1
  indices:
    relance: Pense au sens littéral de l'expression anglaise désignant un objet « déjà fait » et au geste de Marcel Duchamp.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, peindre un objet relève de la représentation (comme une nature morte) et non de la présentation d'un
      ready-made.
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''artiste ne fabrique pas le ready-made de ses mains, il choisit un objet déjà fait.'
  - si:
      contient:
      - o4
    relance: Non, la décoration ne transforme pas le statut de l'objet en œuvre d'art au sens du ready-made.
  solution: Un objet manufacturé du quotidien choisi par l'artiste et exposé presque sans modification. C'est exact ! Le ready-made
    désigne un objet industriel déjà fabriqué que l'artiste choisit, décontextualise et expose sans le fabriquer lui-même.
- id: nblm-dans-l-uvre-objet-ou-le-dejeuner-en-four-2
  type: choix
  difficulte: 2
  enonce: Dans l'œuvre « Objet » (ou « Le Déjeuner en fourrure », 1936) de Meret Oppenheim, l'artiste recouvre une tasse de
    fourrure. Comment appelle-t-on cette façon de détourner un objet du quotidien ?
  reponse:
    options:
    - id: o1
      texte: Le détournement, car il donne à l'objet un autre sens en lui enlevant sa fonction habituelle.
    - id: o2
      texte: Le moulage, car l'artiste a coulé la tasse dans un produit liquide.
    - id: o3
      texte: L'accumulation, car l'artiste rassemble cent tasses identiques.
    - id: o4
      texte: L'hyperréalisme, car la tasse imite une photographie.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au terme qui exprime le changement de destination ou d'usage d'un objet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, le moulage consiste à couler un liquide dans un moule pour qu'il prenne une forme, ce qui n'est pas
      le procédé utilisé ici.
  - si:
      contient:
      - o3
    relance: 'Confusion : l''accumulation consiste à répéter un même objet en grand nombre, alors qu''il s''agit ici de transformer
      une seule tasse.'
  - si:
      contient:
      - o4
    relance: Faux, l'hyperréalisme vise une ressemblance quasi photographique en dessin ou en peinture, pas la modification
      d'un objet réel.
  solution: Le détournement, car il donne à l'objet un autre sens en lui enlevant sa fonction habituelle. Bravo ! En recouvrant
    la tasse de fourrure, l'artiste empêche son utilisation pratique pour lui donner une portée poétique et étrange.
- id: nblm-pour-realiser-la-tete-de-taureau-1942-pa-3
  type: choix
  difficulte: 2
  enonce: Pour réaliser la « Tête de taureau » (1942), Pablo Picasso réunit une selle et un guidon de vélo. Quelle opération
    décrit cette sculpture faite avec des objets récupérés ?
  reponse:
    options:
    - id: o1
      texte: L'assemblage, car il réunit plusieurs objets ou morceaux d'objets pour former une œuvre nouvelle.
    - id: o2
      texte: La taille, car l'artiste enlève de la matière dans un bloc de bois ou de pierre.
    - id: o3
      texte: La numérisation, car l'artiste a utilisé un logiciel 3D.
    - id: o4
      texte: La performance, car il s'agit d'une action corporelle réalisée en direct devant un public.
    bonnes:
    - o1
  indices:
    relance: Pense au verbe qui signifie regrouper et combiner deux pièces de vélo.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la taille consiste à couper ou sculpter un bloc brut, alors que Picasso associe des éléments déjà fabriqués.'
  - si:
      contient:
      - o3
    relance: Non, la « Tête de taureau » est une réalisation matérielle à partir d'objets réels de récupération.
  - si:
      contient:
      - o4
    relance: Incorrect, c'est une sculpture physique permanente et non une action éphémère devant des spectateurs.
  solution: L'assemblage, car il réunit plusieurs objets ou morceaux d'objets pour former une œuvre nouvelle. Excellente réponse
    ! L'assemblage est la réunion de plusieurs objets ou fragments d'objets formant une nouvelle sculpture.
- id: nblm-que-se-passe-t-il-lorsqu-un-objet-banal-4
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il lorsqu'un objet banal exposé au musée est extrait de sa place habituelle dans la vie quotidienne
    ?
  reponse:
    options:
    - id: o1
      texte: L'objet subit une décontextualisation puis une recontextualisation, ce qui change son statut en objet d'art.
    - id: o2
      texte: L'objet conserve exactement la même fonction utilitaire qu'auparavant.
    - id: o3
      texte: L'objet se transforme immédiatement en une peinture sur toile.
    - id: o4
      texte: L'objet perd toute réalité matérielle pour devenir une image virtuelle.
    bonnes:
    - o1
  indices:
    relance: Considère les termes désignant le fait de retirer un objet de son milieu pour le replacer dans un musée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : une fois exposé au musée, l''objet ne sert plus à son usage pratique initial.'
  - si:
      contient:
      - o3
    relance: Faux, un objet tridimensionnel reste un objet physique et ne devient pas un tableau plan.
  - si:
      contient:
      - o4
    relance: Non, la réalité concrète de l'objet persiste dans l'espace d'exposition.
  solution: L'objet subit une décontextualisation puis une recontextualisation, ce qui change son statut en objet d'art. Exact
    ! En sortant de son lieu d'usage pour être présenté au musée, l'objet perd sa fonction pratique et devient une œuvre à
    regarder.
- id: nblm-quelle-operation-plastique-l-artiste-arm-5
  type: choix
  difficulte: 2
  enonce: Quelle opération plastique l'artiste Arman réalise-t-il lorsqu'il réunit une grande quantité de brosses à dents
    ou d'objets identiques dans des boîtes ?
  reponse:
    options:
    - id: o1
      texte: L'accumulation, qui répète un même objet pour interroger la quantité et la société de consommation.
    - id: o2
      texte: La mise en abyme, qui consiste à insérer une image dans une autre image.
    - id: o3
      texte: Le dripping, qui consiste à projeter des coulures de peinture sur une toile.
    - id: o4
      texte: L'anamorphose, qui est une déformation visible depuis un point de vue unique.
    bonnes:
    - o1
  indices:
    relance: Cherche le nom correspondant au fait d'amasser ou d'entasser de nombreux objets semblables.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion : la mise en abyme est un procédé de représentation (une image dans l''image), pas une répétition
      d''objets réels.'
  - si:
      contient:
      - o3
    relance: Faux, le dripping est une technique picturale de projection de peinture.
  - si:
      contient:
      - o4
    relance: Incorrect, l'anamorphose est une illusion d'optique liée au point de vue du spectateur.
  solution: L'accumulation, qui répète un même objet pour interroger la quantité et la société de consommation. C'est bien
    cela ! L'accumulation est la répétition en série d'un même objet banal, modifiant notre regard par le nombre.
- id: nblm-parmi-les-affirmations-suivantes-sur-la-6
  type: choix
  difficulte: 3
  enonce: Parmi les affirmations suivantes sur la notion « objet-comme-materiau », lesquelles sont exactes ? (Sélectionne
    2 réponses) [1-3] (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un ready-made est un objet manufacturé choisi par l'artiste et exposé presque sans modification.
    - id: o2
      texte: Détourner un objet du quotidien consiste à modifier sa forme ou sa matière pour lui enlever sa fonction première.
    - id: o3
      texte: Un artiste de ready-made doit obligatoirement fabriquer l'objet lui-même de ses propres mains.
    - id: o4
      texte: Un objet banal conserve toujours sa fonction utilitaire lorsqu'il est exposé au musée.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les propositions qui définissent correctement le ready-made et le détournement, sans exiger de fabrication
      manuelle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : la spécificité du ready-made réside dans le choix d''un objet déjà fabriqué par l''industrie.'
  - si:
      contient:
      - o4
    relance: 'Faux : au musée, l''objet perd son rôle utilitaire pour devenir un objet d''art à contempler.'
  solution: Un ready-made est un objet manufacturé choisi par l'artiste et exposé presque sans modification ; Détourner un
    objet du quotidien consiste à modifier sa forme ou sa matière pour lui enlever sa fonction première. Exact ! C'est la
    définition officielle du ready-made initié par Marcel Duchamp.
- id: nblm-quel-terme-cree-par-marcel-duchamp-desig-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme créé par Marcel Duchamp désigne un objet manufacturé « déjà fait », choisi par l'artiste et exposé tel
    quel au musée ?
  reponse:
    acceptees:
    - ready-made
    fautes_tolerees: 1
  indices:
    relance: Ce terme anglais composé de deux mots signifie littéralement 'déjà fait'.
