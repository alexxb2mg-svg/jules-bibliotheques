format: 2
notion: qualites-physiques-materiaux
version: 2
etat: verifiee
declencheurs:
- lisse ou rugueux
- transparent ou opaque
- sculpture inachevée
- Captifs de Michel-Ange
- choisir le bon matériau pour sa sculpture
- matières qui contrastent
- sculpture en fourrure
- œuvre non finie
prerequis:
- 4e-qualites-physiques-materiaux
- transformation-de-la-matiere
essentiel: 'Chaque matériau a une nature (pierre, bois, métal, verre, papier, tissu, plastique, fourrure…) et des caractéristiques
  physiques : dur ou mou, lourd ou léger, rigide ou souple, lisse ou rugueux, opaque ou transparent, mat ou brillant, solide
  ou fragile, durable ou éphémère.


  Un artiste peut choisir un matériau noble (marbre, bronze), un matériau ordinaire ou industriel (carton, béton, plastique)
  ou un objet de récupération. Ce choix fait partie de son intention.


  Ces qualités ne sont pas seulement techniques : elles portent du sens. On distingue :

  - les caractéristiques plastiques : couleur, texture, poids, transparence, brillance ;

  - les caractéristiques techniques : comment on travaille la matière (tailler, coller, souder) et comment elle résiste ;

  - le sens (sémantique) : ce que le matériau évoque, les idées et souvenirs qu''il fait naître ;

  - la valeur symbolique : ce qu''il représente dans une culture, comme le marbre (durée, prestige).


  Le papier de soie évoque la légèreté et la fragilité, le verre la transparence, la fourrure la douceur et la chaleur. Joseph
  Beuys utilise souvent le feutre et la graisse, des matériaux qui protègent et gardent la chaleur.


  Agencer des matériaux de caractéristiques différentes crée des contrastes : lourd et léger, dur et doux, brut et poli. Ces
  rencontres peuvent surprendre ou faire réfléchir. En 1936, Meret Oppenheim recouvre de fourrure une tasse, sa soucoupe et
  sa cuillère : un objet fait pour boire devient doux et troublant.


  Fini et non fini : une œuvre finie a une surface achevée, polie, où les traces du travail ont disparu. Une œuvre non finie
  laisse voir le matériau brut et les traces des outils. Les « Captifs » (ou « Esclaves ») de Michel-Ange, sculptés dans le
  marbre vers 1520-1530 et restés inachevés, montrent des corps qui semblent sortir du bloc de pierre brute. Aujourd''hui,
  le non fini peut aussi être un choix de l''artiste.


  Au brevet, on attend que tu nommes le matériau, décrives ses qualités, dises ce qu''elles évoquent et relies le choix à
  l''intention de l''artiste.

  '
methode:
- 'Nommer le matériau (sa nature), puis ses qualités physiques en paires de contraires : dur/mou, lisse/rugueux, opaque/transparent…'
- Distinguer ce qui est plastique (aspect), technique (travail) et symbolique (valeur donnée par une culture).
- Dire ce que ces qualités évoquent ou font ressentir.
- Repérer les contrastes quand plusieurs matériaux sont agencés.
- 'Observer la surface : achevée et polie (fini) ou brute, avec les traces d''outils (non fini).'
- Relier le choix du matériau à l'intention de l'artiste.
vocabulaire:
- terme: texture
  definition: 'l''aspect d''une surface, perçu au toucher ou à la vue : lisse, rugueuse, granuleuse, soyeuse…'
- terme: translucide
  definition: qui laisse passer la lumière sans qu'on voie nettement à travers (papier calque, verre dépoli)
- terme: fini
  definition: état d'une œuvre achevée, à la surface travaillée, où les traces du travail ont disparu
- terme: non fini
  definition: état d'une œuvre qui laisse voir le matériau brut et les traces du travail, par hasard ou par choix
- terme: agencement
  definition: la façon d'associer et d'organiser plusieurs matériaux dans une même œuvre
- terme: contraste
  definition: forte différence entre deux éléments placés côte à côte (lourd et léger, dur et doux)
- terme: valeur symbolique
  definition: ce qu'un matériau représente dans une culture (l'or et la richesse)
- terme: matériau noble
  definition: matériau traditionnellement précieux ou prestigieux, comme le marbre ou le bronze
erreurs_frequentes:
- Choisir un matériau seulement parce qu'il est facile à travailler, sans penser à ce qu'il évoque.
- Confondre transparent (on voit nettement à travers) et translucide (la lumière passe, mais l'image est floue).
- 'Croire qu''une œuvre non finie est forcément ratée : le non fini peut être voulu et donner du sens.'
- Décrire la forme d'une sculpture sans jamais parler de son matériau.
exemple:
  enonce: 'Deux élèves (fictifs) réalisent la même petite maison : l''un en béton, l''autre en papier de soie éclairé de l''intérieur.
    Qu''est-ce qui change ?'
  solution: 'La forme est la même, mais les matériaux changent le sens. La maison en béton est lourde, opaque, rugueuse :
    elle évoque la solidité, l''abri, peut-être l''enfermement. La maison en papier de soie est légère, translucide et fragile
    : éclairée, elle évoque la douceur, un souvenir, ou une maison qui pourrait disparaître.'
exercices:
- id: mot-texture
  type: texte_court
  difficulte: 1
  enonce: 'Lisse, rugueuse, granuleuse, soyeuse : comment appelle-t-on l''aspect d''une surface qu''on perçoit au toucher
    ou à la vue ?'
  reponse:
    acceptees:
    - texture
    - la texture
    fautes_tolerees: 0
  indices:
    relance: Si tu fermes les yeux et passes la main sur une écorce, puis sur une vitre, qu'est-ce qui change ?
    methode: C'est un mot du vocabulaire plastique qui désigne la qualité d'une surface, comme la matière d'un tissu.
    etape: Le mot commence par « tex- », comme « textile ».
  pieges:
  - si:
      valeur: couleur
    relance: La couleur se voit, mais ne se touche pas. Quel mot désigne l'aspect lisse ou rugueux d'une surface ?
  - si:
      valeur: forme
    relance: Deux objets de même forme peuvent être l'un lisse, l'autre rugueux. Comment s'appelle cette qualité de la surface
      ?
  solution: 'C''est la texture : l''aspect d''une surface, lisse, rugueuse, granuleuse ou soyeuse.'
- id: materiau-qualite
  type: association
  difficulte: 1
  enonce: Relie chaque matériau à la qualité physique qui le caractérise le mieux.
  reponse:
    gauche:
    - id: a
      texte: Une vitre en verre
    - id: b
      texte: Un bloc de granit
    - id: c
      texte: Une feuille de papier de soie
    - id: d
      texte: Un morceau de fourrure
    droite:
    - id: w
      texte: transparent
    - id: x
      texte: dur et lourd
    - id: y
      texte: léger et fragile
    - id: z
      texte: doux et souple
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: À travers lequel de ces matériaux voit-on nettement ?
    methode: 'Imagine que tu prends chaque matériau en main : est-il lourd, se déchire-t-il, est-il doux ?'
    etape: La vitre laisse voir à travers elle. Lequel des autres matériaux serait difficile à soulever ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux matériaux les plus légers.
  - si:
      diagnostic: associations_fausses
    relance: 'Pense à un geste pour chaque matériau : regarder à travers, soulever, déchirer, caresser.'
  solution: Le verre est transparent, le granit dur et lourd, le papier de soie léger et fragile, la fourrure douce et souple.
- id: choisir-materiau
  type: choix
  difficulte: 2
  enonce: Une élève (fictive) veut réaliser un nuage suspendu qui évoque la fragilité et la légèreté. Quel matériau sert le
    mieux son intention ?
  reponse:
    options:
    - id: a
      texte: Du papier de soie blanc froissé
    - id: b
      texte: Du béton coulé dans un moule
    - id: c
      texte: Une plaque d'acier découpée
    - id: d
      texte: Un bloc de pierre taillée
    bonnes:
    - a
  indices:
    relance: Parmi ces matériaux, lequel pourrait flotter au moindre souffle ?
    methode: Compare les qualités de chaque matériau (poids, solidité) avec les deux idées à évoquer.
    etape: Le béton, l'acier et la pierre sont lourds et solides. Que reste-t-il ?
  pieges:
  - si:
      contient:
      - b
    relance: Le béton peut prendre la forme d'un nuage, mais que ressent-on devant un nuage lourd et solide ? Est-ce l'intention
      ?
  - si:
      contient:
      - c
    relance: L'acier est rigide et solide. Évoque-t-il la fragilité ? Cherche un matériau qui se déchire facilement.
  solution: 'Le papier de soie : léger, fin, qui se déchire facilement, il évoque la fragilité et la légèreté du nuage.'
- id: mot-non-fini
  type: texte_court
  difficulte: 2
  enonce: 'Les « Captifs » de Michel-Ange, sculptés dans le marbre vers 1520-1530, n''ont jamais été terminés : les corps
    semblent sortir du bloc brut, où l''on voit encore les traces des outils. Comment appelle-t-on cet état d''une œuvre,
    en deux mots ?'
  reponse:
    acceptees:
    - non fini
    - non-fini
    - le non-fini
    - inachevé
    fautes_tolerees: 0
  indices:
    relance: Une œuvre achevée, à la surface polie, est dite « finie ». Et celle-ci ?
    methode: 'Observe la surface : est-elle polie partout ? Cherche l''expression qui désigne une œuvre laissant voir le matériau
      brut et le travail.'
    etape: Cherche l'expression contraire de « fini », formée avec une négation.
  pieges:
  - si:
      valeur: brut
    relance: Le bloc est bien brut. Mais quel mot, formé à partir de « fini », désigne l'état de l'œuvre tout entière ?
  - si:
      valeur: fini
    relance: Une œuvre finie a une surface achevée et polie. Est-ce le cas ici ?
  solution: 'C''est le non fini : l''œuvre laisse voir le matériau brut et les traces du travail.'
- id: agencement-contraste
  type: choix
  difficulte: 2
  enonce: Un élève (fictif) pose une plume sur un gros pavé de granit. Quel effet cet agencement de matériaux produit-il surtout
    ?
  reponse:
    options:
    - id: a
      texte: Un contraste entre le lourd et le léger
    - id: b
      texte: Une harmonie entre deux matériaux semblables
    - id: c
      texte: 'Aucun effet : seul le choix des couleurs compte'
    bonnes:
    - a
  indices:
    relance: La plume et le granit se ressemblent-ils par leur poids ?
    methode: 'Compare les qualités physiques des deux matériaux : quand elles s''opposent, que produit leur rencontre ?'
    etape: Le granit est dur et très lourd. Et la plume ?
  pieges:
  - si:
      contient:
      - b
    relance: Une plume et un pavé de granit sont-ils vraiment semblables ? Compare leur poids et leur dureté.
  - si:
      contient:
      - c
    relance: Les qualités physiques des matériaux comptent autant que les couleurs. Que ressent-on devant une plume posée
      sur une pierre ?
  solution: 'Un contraste entre le lourd et le léger (et entre le dur et le doux) : l''agencement fait ressentir l''opposition
    des deux matériaux.'
- id: justifier-fini-non-fini
  type: ouverte
  difficulte: 3
  enonce: Un élève (fictif) sculpte un visage dans un bloc de plâtre. Il polit soigneusement le visage, mais laisse le reste
    du bloc brut, avec les traces de la râpe. Il dit que c'est voulu. Explique en quelques phrases l'effet de ce choix et
    justifie-le.
  criteres:
  - L'élève emploie les notions de fini et de non fini en les appliquant aux deux parties de la sculpture.
  - L'élève décrit les qualités physiques des deux surfaces (lisse et polie, rugueuse et brute) et le contraste produit.
  - L'élève propose un sens justifié (un visage qui sort de la matière, qui naît ou disparaît), éventuellement en citant les
    Captifs de Michel-Ange.
  indices:
    relance: 'Quand on regarde cette sculpture, où l''œil va-t-il d''abord : vers la partie polie, ou vers la partie brute
      ?'
    methode: Décris les deux surfaces, nomme le contraste, puis dis ce que ce contraste fait ressentir.
    etape: 'Tu peux commencer ainsi : « Le visage est fini, poli et lisse, alors que le reste du bloc… »'
  solution: 'Le visage est fini : poli, lisse, il accroche la lumière. Le reste du bloc est non fini : brut, rugueux, marqué
    par la râpe. Ce contraste attire le regard vers le visage, qui semble sortir de la matière, comme les Captifs de Michel-Ange
    sortent du marbre. Le choix est justifié : on voit à la fois l''œuvre et le travail qui l''a fait naître.'
- id: nblm-lorsqu-un-eleve-compare-la-surface-d-un-1
  type: choix
  difficulte: 2
  enonce: Lorsqu'un élève compare la surface d'un marbre poli et celle d'une pierre brute, quelles caractéristiques physiques
    opposées observe-t-il ?
  reponse:
    options:
    - id: o1
      texte: Lisse et rugueux
    - id: o2
      texte: Transparent et opaque
    - id: o3
      texte: Rigide et souple
    - id: o4
      texte: Durable et éphémère
    bonnes:
    - o1
  indices:
    relance: Pense aux sensations de tes doigts en touchant une pierre polie par rapport à un bloc brut.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, la transparence concerne le passage de la lumière à travers la matière, non l'état de sa surface.
  - si:
      contient:
      - o3
    relance: 'Erreur classique : la rigidité ou la souplesse caractérisent la capacité à se déformer, pas l''aspect de surface.'
  - si:
      contient:
      - o4
    relance: Attention, cela concerne la résistance de la matière dans le temps et non son aspect tactile ou visuel.
  solution: 'Lisse et rugueux. C''est exact : le caractère lisse ou rugueux qualifie la texture de la surface d''un matériau,
    perçue au toucher ou à la vue.'
- id: nblm-un-eleve-utilise-une-plaque-de-verre-pou-2
  type: choix
  difficulte: 2
  enonce: Un élève utilise une plaque de verre pour voir nettement à travers son installation, alors que son voisin utilise
    du carton qui bloque la lumière. Quelle qualité physique oppose le verre au carton ?
  reponse:
    options:
    - id: o1
      texte: Translucide
    - id: o2
      texte: Transparent
    - id: o3
      texte: Brillant
    - id: o4
      texte: Souple
    bonnes:
    - o2
  indices:
    relance: Cherche le terme qui désigne un matériau à travers lequel l'image reste claire et nette.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: 'Erreur fréquente : un matériau translucide laisse passer la lumière mais ne permet pas de voir nettement à travers.'
  - si:
      contient:
      - o3
    relance: Attention, la brillance qualifie la réflexion de la lumière sur la surface, pas la possibilité de voir à travers.
  - si:
      contient:
      - o4
    relance: 'Faux : la souplesse est la faculté de se plier sans rompre, cela ne concerne pas la lumière.'
  solution: 'Transparent. C''est exact : le verre est transparent car la lumière le traverse et permet de voir nettement ce
    qui est derrière, alors que le carton est opaque.'
- id: nblm-dans-les-captifs-de-michel-ange-sculptes-3
  type: choix
  difficulte: 2
  enonce: Dans les « Captifs » de Michel-Ange sculptés dans le marbre, pourquoi l'artiste laisse-t-il apparaître la pierre
    brute à côté des parties sculptées ?
  reponse:
    options:
    - id: o1
      texte: Parce qu'il a manqué d'outils pour finir d'enlever toute la pierre.
    - id: o2
      texte: Parce qu'il ne savait pas polir le marbre.
    - id: o3
      texte: Pour réaliser une sculpture inachevée (non fini) où les corps semblent surgir du bloc brut.
    - id: o4
      texte: Pour dissimuler une cassure accidentelle dans la pierre.
    bonnes:
    - o3
  indices:
    relance: Observe comment les corps semblent chercher à se libérer de la matière encore brute.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: 'Faux : laisser la pierre brute fait partie de la démarche expressive et du sens de l''œuvre.'
  - si:
      contient:
      - o2
    relance: 'Erreur : Michel-Ange maîtrisait parfaitement la taille et le polissage de la pierre.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''opposition entre la surface polie et la matière brute est un choix plastique délibéré.'
  solution: 'Pour réaliser une sculpture inachevée (non fini) où les corps semblent surgir du bloc brut. C''est exact : le
    non fini montre le matériau brut et donne le sentiment d''un corps luttant pour sortir de la pierre.'
- id: nblm-pourquoi-est-il-essentiel-pour-un-eleve-4
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il essentiel pour un élève de bien choisir le bon matériau pour sa sculpture ?
  reponse:
    options:
    - id: o1
      texte: Uniquement pour choisir le matériau le plus rapide et le plus facile à travailler.
    - id: o2
      texte: Parce que les qualités physiques du matériau portent du sens et expriment l'intention artistique.
    - id: o3
      texte: Parce qu'une sculpture réussie doit obligatoirement être réalisée en pierre ou en bronze.
    - id: o4
      texte: Pour s'assurer que la sculpture aura une surface totalement lisse et sans traces.
    bonnes:
    - o2
  indices:
    relance: Pense à ce que la matière elle-même communique au spectateur au-delà de sa forme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: 'Erreur fréquente : choisir un matériau seulement par facilité fait oublier le sens qu''il apporte à l''œuvre.'
  - si:
      contient:
      - o3
    relance: 'Attention : une sculpture peut être réalisée avec n''importe quel matériau (papier, béton, plastique, etc.).'
  - si:
      contient:
      - o4
    relance: 'Faux : selon l''intention de l''artiste, la surface peut être rugueuse, brute ou striée.'
  solution: 'Parce que les qualités physiques du matériau portent du sens et expriment l''intention artistique. C''est exact
    : les caractéristiques physiques (lourd, léger, rugueux, transparent) évoquent des idées et des sensations.'
- id: nblm-comment-definit-on-la-notion-plastique-d-5
  type: choix
  difficulte: 2
  enonce: Comment définit-on la notion plastique de « non fini » dans une œuvre d'art ?
  reponse:
    options:
    - id: o1
      texte: Une œuvre abandonnée ou ratée par manque de travail.
    - id: o2
      texte: Une peinture dont les contours ont été tracés au crayon noir.
    - id: o3
      texte: Un état de l'œuvre qui laisse voir le matériau brut et les traces des outils de l'artiste.
    - id: o4
      texte: Une sculpture dont la surface a été entièrement polie et vernie.
    bonnes:
    - o3
  indices:
    relance: Réfléchis aux œuvres qui gardent visibles la matière d'origine et les marques des outils.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: 'Erreur classique : le non fini n''est pas une faute technique, c''est souvent un choix artistique expressif.'
  - si:
      contient:
      - o2
    relance: 'Faux : cela désigne une étape de dessin ou de cerne, pas la notion de non fini.'
  - si:
      contient:
      - o4
    relance: 'Attention : une surface totalement achevée et polie correspond au « fini ».'
  solution: 'Un état de l''œuvre qui laisse voir le matériau brut et les traces des outils de l''artiste. C''est exact : le
    non fini conserve le matériau à l''état brut et garde la mémoire du travail et des gestes.'
- id: nblm-quelles-paires-de-termes-designent-des-q-6
  type: choix
  difficulte: 3
  enonce: Quelles paires de termes désignent des qualités physiques opposées des matériaux que l'on peut associer dans une
    sculpture ? (Choisis 2 réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Lisse / rugueux
    - id: o2
      texte: Beau / laid
    - id: o3
      texte: Transparent / opaque
    - id: o4
      texte: Figuratif / abstrait
    bonnes:
    - o1
    - o3
  indices:
    relance: Sélectionne uniquement les termes qui décrivent le comportement ou l'aspect physique de la matière.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : beau et laid sont des jugements de valeur personnels, pas des propriétés physiques de la matière.'
  - si:
      contient:
      - o4
    relance: 'Attention : figuratif et abstrait désignent le rapport de l''image au monde visible, non une qualité physique
      du matériau.'
  solution: 'Lisse / rugueux ; Transparent / opaque. C''est exact : ces deux termes qualifient l''aspect tactile et visuel
    de la surface.'
- id: nblm-quel-terme-compose-designe-une-sculpture-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme composé désigne une sculpture inachevée qui laisse volontairement voir le matériau brut, comme dans les
    Captifs de Michel-Ange ?
  reponse:
    acceptees:
    - non fini
    fautes_tolerees: 1
  indices:
    relance: Nom composé désignant l'état d'une œuvre non lissée qui garde les traces de la matière brute.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: non fini. Le 'non fini' désigne l'état d'une œuvre qui laisse apparaître la matière brute et les traces du travail.
- id: nblm-quel-mot-designe-l-aspect-de-la-surface-8
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne l'aspect de la surface d'un matériau (lisse, rugueux ou granuleux) perçu au toucher ou à la vue
    ?
  reponse:
    acceptees:
    - texture
    fautes_tolerees: 1
  indices:
    relance: Nom féminin qualifiant le grain ou le relief de la surface d'un matériau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: texture. La texture est l'aspect spécifique de la surface d'un matériau.
- id: quatre-caracteristiques
  type: association
  difficulte: 2
  enonce: Relie chaque exemple à la sorte de caractéristique du matériau qu'il illustre.
  reponse:
    gauche:
    - id: a
      texte: Le bois est brun clair et présente des veines
    - id: b
      texte: Le marbre se taille au ciseau, mais un coup mal placé peut le casser
    - id: c
      texte: Le papier de soie fait penser à quelque chose de fragile
    - id: d
      texte: Dans notre culture, l'or symbolise la richesse
    droite:
    - id: w
      texte: Caractéristique plastique (ce qu'on voit ou touche)
    - id: x
      texte: Caractéristique technique (comment on le travaille)
    - id: y
      texte: Sens, ce que le matériau évoque
    - id: z
      texte: Valeur symbolique dans une culture
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Quel exemple décrit seulement ce qu'on voit, sans parler du travail ni du sens ?
    methode: 'Pour chaque phrase, demande-toi : parle-t-elle de l''aspect, du travail, de l''idée évoquée ou de la valeur
      donnée par une culture ?'
    etape: L'exemple du marbre parle d'un outil et d'un risque de casse. Il correspond à la façon de travailler le matériau.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux exemples qui parlent d'idées (évocation, culture).
  - si:
      diagnostic: associations_fausses
    relance: Commence par le marbre et son ciseau, puis le bois et sa couleur. Il reste ce que l'on évoque et ce qu'une culture
      symbolise.
  solution: 'Bois : plastique. Marbre qui se taille et se casse : technique. Papier de soie fragile : sens. Or et richesse
    : symbolique.'
- id: dejeuner-fourrure
  type: choix
  difficulte: 2
  enonce: En 1936, Meret Oppenheim recouvre de fourrure une tasse, sa soucoupe et sa cuillère. Quel effet cet agencement produit-il
    ?
  reponse:
    options:
    - id: a
      texte: 'Un objet fait pour boire devient doux et étrange : le matériau change le sens de l''objet'
    - id: b
      texte: 'Une harmonie parfaite : rien ne surprend'
    - id: c
      texte: Un simple choix de couleur, sans rapport avec le matériau
    - id: d
      texte: Une tasse plus solide et plus pratique
    bonnes:
    - a
  indices:
    relance: Une tasse sert à boire. Que devient-elle avec de la fourrure ?
    methode: Compare la fonction habituelle de l'objet avec la texture du matériau qui le recouvre.
    etape: La fourrure est douce et chaude, la tasse est dure et lisse. Quel effet donne cette rencontre inattendue ?
  pieges:
  - si:
      contient:
      - b
    relance: Une tasse en fourrure est-elle attendue ? Ce genre de rencontre surprend.
  - si:
      contient:
      - c
    relance: Ici, c'est la texture de la fourrure qui compte, pas seulement la couleur.
  - si:
      contient:
      - d
    relance: La fourrure rendrait-elle la tasse plus pratique pour boire ? Qu'est-ce qui change plutôt ?
  solution: 'Le matériau change le sens de l''objet : une tasse recouverte de fourrure devient douce, troublante, impossible
    à utiliser normalement.'
