# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: mettre-en-oeuvre-projet
version: 1
etat: verifiee
declencheurs:
- carnet de recherches
- note d'intention
- étapes de ma réalisation
- mon idée ne marche pas
- réajuster ma production
- travail en groupe en arts plastiques
prerequis:
- 4e-mettre-en-oeuvre-projet
- experimenter-produire-creer
couverture: Couvre les étapes d'un projet plastique, individuel ou collectif, l'anticipation des difficultés et la confrontation
  entre intention et réalisation. Ne traite pas des projets numériques en détail.
essentiel: 'Un projet artistique se conçoit, se réalise et se donne à voir. Il peut être individuel ou collectif, et il est
  accompagné par le professeur.


  Il avance par étapes : comprendre la demande et formuler son intention (ce que l''on veut produire comme effet), chercher
  (croquis, essais, documentation, souvent réunis dans un carnet de recherches), réaliser, prendre du recul, puis présenter.


  Mener un projet, c''est aussi anticiper les difficultés : le temps, le matériel, la taille, la solidité, le lieu, les autorisations.


  Pendant la réalisation, on confronte régulièrement l''intention et ce qui est réellement produit. S''il y a un écart, on
  adapte ou on réoriente le projet, sans perdre de vue sa dimension artistique.


  Exemple d''artistes : Christo et Jeanne-Claude ont emballé de toile le Pont-Neuf à Paris en 1985, après des années de démarches
  pour obtenir les autorisations. Leurs dessins et maquettes préparatoires montrent toutes les étapes du projet.


  On attend de l''élève de l''autonomie, de l''initiative, de l''engagement et un esprit critique sur son propre travail.

  '
methode:
- Lire la demande et formuler son intention en une ou deux phrases.
- 'Chercher : faire des croquis et des essais, rassembler de la documentation, les garder dans le carnet de recherches.'
- Lister ce qui pourrait poser problème (temps, matériel, taille, lieu) et prévoir une solution.
- Réaliser, en s'arrêtant régulièrement pour comparer la production à l'intention.
- Adapter ou réorienter si besoin, puis penser à la présentation et à l'explication orale.
vocabulaire:
- terme: intention
  definition: ce que l'on veut produire comme effet ou comme sens avec sa production
- terme: carnet de recherches
  definition: carnet où l'on garde croquis, essais, notes et images qui préparent et accompagnent le projet
- terme: maquette
  definition: modèle réduit qui permet de tester un projet en volume ou dans un lieu avant de le réaliser en grand
- terme: esquisse
  definition: premier dessin rapide qui cherche une idée ou une composition
erreurs_frequentes:
- Commencer directement la production finale sans aucun essai ni croquis.
- Abandonner le projet au premier problème au lieu de chercher la cause et d'adapter.
- Changer d'idée sans garder de trace dans le carnet de recherches.
- 'Oublier d''anticiper le temps et le matériel : le projet n''est pas terminé à l''heure.'
- Ne jamais comparer la production à l'intention de départ.
exemple:
  enonce: 'Projet fictif : Noé veut exprimer « l''enfermement » avec une boîte en carton dans laquelle on regarde par un petit
    trou. À mi-chemin, l''intérieur est trop sombre, on ne voit rien. Que doit-il faire ?'
  solution: 'Il compare la réalisation à son intention : l''obscurité renforce l''idée d''enfermement, mais si on ne voit
    rien, le spectateur ne comprend pas. Il cherche une solution sans changer d''intention : percer une petite fente en haut
    pour laisser passer un filet de lumière. Il note ce changement et sa raison dans son carnet de recherches.'
exercices:
- id: etapes-du-projet
  type: ordre
  difficulte: 1
  enonce: Range ces étapes d'un projet plastique dans l'ordre le plus logique.
  reponse:
    elements:
    - id: intention
      texte: Lire la demande et formuler son intention
    - id: recherches
      texte: Faire des croquis, des essais et chercher de la documentation
    - id: realisation
      texte: Réaliser la production
    - id: recul
      texte: 'Prendre du recul : comparer la production à l''intention et ajuster'
    - id: presentation
      texte: Présenter la production et expliquer ses choix
  indices:
    relance: 'Par quoi faut-il commencer : savoir ce que l''on veut, ou se lancer dans la production finale ?'
    methode: Place d'abord la première et la dernière étape, puis range celles du milieu.
    etape: On commence par formuler son intention et on finit par la présentation. Entre les deux, que faut-il faire avant
      de réaliser ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Peut-on comparer une production à l'intention avant de l'avoir
      réalisée ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape où l'on sait ce que l'on veut faire, puis celle où l'on montre le résultat au public.
  solution: 'Formuler son intention, chercher (croquis, essais, documentation), réaliser, prendre du recul et ajuster, présenter.
    En pratique, on revient souvent en arrière : prendre du recul peut relancer de nouveaux essais.'
- id: dessin-de-recherche
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le dessin rapide, souvent simplifié, que l'on fait pour chercher une idée avant de réaliser
    la production ?
  reponse:
    acceptees:
    - croquis
    - esquisse
    fautes_tolerees: 0
  indices:
    relance: Dans ton carnet de recherches, que fais-tu avec un crayon avant de te lancer ?
    methode: Cherche un mot qui désigne un dessin rapide, fait pour chercher et non pour être exposé.
    etape: Le mot commence par « cro… » ou par « esq… ».
  pieges:
  - si:
      valeur: brouillon
    relance: C'est bien l'idée. En arts plastiques, quel mot précis désigne ce dessin rapide de recherche ?
  - si:
      valeur: maquette
    relance: Une maquette est un modèle réduit en volume. On cherche un dessin rapide sur papier.
  solution: 'Un croquis (on dit aussi une esquisse) : un dessin rapide qui sert à chercher une idée ou une composition.'
- id: projet-qui-seffondre
  type: choix
  difficulte: 2
  enonce: 'Situation fictive : Tom construit une grande sculpture en carton. À mi-chemin, elle s''effondre. Coche les réactions
    qui montrent qu''il mène son projet avec esprit critique.'
  reponse:
    options:
    - id: a
      texte: Il abandonne le projet
    - id: b
      texte: Il recommence exactement de la même façon
    - id: c
      texte: Il cherche pourquoi elle s'est effondrée et renforce sa structure
    - id: d
      texte: Il garde son intention mais change d'échelle ou de matériau
    bonnes:
    - c
    - d
  indices:
    relance: Si Tom refait la même chose, que risque-t-il de se passer ?
    methode: Garde les réactions où Tom tire une leçon de l'effondrement pour faire avancer son projet.
    etape: Abandonner n'est pas mener à terme. Parmi les réactions restantes, lesquelles changent quelque chose pour que ça
      tienne ?
  pieges:
  - si:
      contient:
      - a
    relance: Le programme demande de mener sa production à terme. Tom peut-il sauver son projet ?
  - si:
      contient:
      - b
    relance: Sans rien changer, la sculpture a toutes les chances de s'effondrer à nouveau. Qu'est-ce qu'il faudrait modifier
      ?
  - si:
      diagnostic: incomplet
    relance: 'Il existe une autre bonne réaction : réorienter le projet sans renoncer à ce qu''il voulait exprimer.'
  solution: Tom cherche la cause et renforce la structure (c), ou il réoriente le projet en gardant son intention (changement
    d'échelle ou de matériau) (d). Abandonner ou refaire à l'identique ne règle rien.
- id: traces-du-projet
  type: association
  difficulte: 2
  enonce: Relie chaque outil du projet à ce à quoi il sert.
  reponse:
    gauche:
    - id: a
      texte: Le carnet de recherches
    - id: b
      texte: La note d'intention
    - id: c
      texte: La maquette
    - id: d
      texte: Le choix de l'accrochage
    droite:
    - id: w
      texte: Garder la trace des croquis, des essais et des idées abandonnées
    - id: x
      texte: Dire en quelques phrases l'effet que l'on veut produire
    - id: y
      texte: Tester en petit un volume ou une installation
    - id: z
      texte: Décider comment le public verra la production
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lequel de ces outils est un objet en volume, en plus petit ?
    methode: 'Pour chaque outil, demande-toi à quel moment du projet on s''en sert : au début, pendant les recherches, avant
      de réaliser en grand, ou à la fin.'
    etape: La maquette sert à tester en petit. L'accrochage concerne le moment où l'on montre la production. Il te reste deux
      outils.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel des deux sert à écrire ce que l'on veut, et lequel garde tout le chemin
      parcouru ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par la maquette, qui est le seul outil en volume, puis place les autres.
  solution: 'Carnet de recherches : garder la trace des croquis et essais. Note d''intention : dire l''effet voulu. Maquette
    : tester en petit. Accrochage : décider comment le public verra la production.'
- id: anticiper-une-installation
  type: choix
  difficulte: 1
  enonce: Ta classe prépare une installation dans le hall du collège. Coche ce qu'il faut anticiper avant de commencer.
  reponse:
    options:
    - id: a
      texte: Les dimensions du hall et l'endroit où passent les élèves
    - id: b
      texte: L'autorisation du chef d'établissement
    - id: c
      texte: Le temps nécessaire pour tout monter
    - id: d
      texte: Le prix auquel on pourra vendre l'installation
    - id: e
      texte: La couleur préférée de chaque élève de la classe
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Qu'est-ce qui pourrait empêcher l'installation d'être montée, ou la rendre dangereuse ?
    methode: Pense au lieu, aux personnes qui doivent donner leur accord, et au calendrier.
    etape: 'Le hall est un lieu de passage : il faut le mesurer et savoir où les élèves circulent. Qu''est-ce qu''il faut
      encore obtenir et prévoir ?'
  pieges:
  - si:
      contient:
      - d
    relance: Un projet de classe n'est pas fait pour être vendu. Qu'est-ce qui compte vraiment pour qu'il puisse exister dans
      le hall ?
  - si:
      contient:
      - e
    relance: Les couleurs se choisissent selon l'intention du projet, pas selon les goûts de chacun. Pense plutôt au lieu
      et au temps.
  - si:
      diagnostic: incomplet
    relance: Il manque quelque chose. Pense au lieu, à l'accord à obtenir et au calendrier.
  solution: Il faut anticiper les dimensions du lieu et les passages (a), l'autorisation du chef d'établissement (b) et le
    temps de montage (c). Le prix de vente et les goûts personnels ne comptent pas ici.
- id: ecart-intention-realisation
  type: ouverte
  difficulte: 3
  enonce: 'Projet fictif : Inès voulait donner une impression de calme avec une peinture de paysage marin. Une fois finie,
    sa peinture utilise surtout du rouge et des traits en zigzag, et ses camarades disent qu''elle paraît agitée. Explique
    l''écart entre l''intention et la réalisation, puis propose deux ajustements en justifiant chacun.'
  criteres:
  - 'L''élève identifie l''écart : les couleurs et les traits produisent un effet contraire à l''intention.'
  - L'élève propose deux ajustements plastiques précis (couleurs, lignes, gestes, composition).
  - L'élève justifie chaque ajustement par l'effet recherché, ou explique pourquoi garder l'écart pourrait aussi être un choix.
  indices:
    relance: Quels éléments de la peinture donnent une impression d'agitation ?
    methode: Compare l'effet voulu (le calme) et les moyens utilisés (couleur, lignes), puis cherche des moyens qui produiraient
      l'effet voulu.
    etape: 'Tu peux commencer ainsi : « Inès voulait du calme, mais le rouge et les zigzags donnent une impression de… »'
  solution: 'Exemple de réponse : Inès voulait du calme, mais le rouge vif et les zigzags donnent une impression d''agitation.
    Elle pourrait utiliser des couleurs froides et peu contrastées (bleus, gris clairs), qui apaisent le regard, et des lignes
    horizontales longues, qui évoquent l''horizon et le repos. Elle peut aussi décider de garder l''agitation si elle change
    d''intention, à condition de l''expliquer.'
- id: nblm-dans-un-projet-en-arts-plastiques-a-quoi-1
  type: choix
  difficulte: 2
  enonce: Dans un projet en arts plastiques, à quoi sert principalement le carnet de recherches ?
  reponse:
    options:
    - id: o1
      texte: À rassembler les croquis, les essais, les notes et la documentation qui préparent et accompagnent le projet.
    - id: o2
      texte: À recopier à l'identique une œuvre d'art connue sans y apporter de modification.
    - id: o3
      texte: À rédiger uniquement le bilan final destiné au professeur après la présentation.
    - id: o4
      texte: À ranger la production plastique finale une fois qu'elle est achevée.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au document personnel qui garde la trace de toutes tes recherches d'idées et de tes essais.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la documentation sert d''inspiration et d''appui pour alimenter son propre projet, non à
      faire une simple copie servile.'
  - si:
      contient:
      - o3
    relance: 'Faux : le carnet est un outil de travail continuel tout au long du projet, et non un document administratif
      à remplir à la fin.'
  - si:
      contient:
      - o4
    relance: 'Faux : la réalisation finale est destinée à être exposée ou présentée dans un espace, pas stockée dans le carnet.'
  solution: 'À rassembler les croquis, les essais, les notes et la documentation qui préparent et accompagnent le projet.
    C''est exact : le carnet de recherches conserve la mémoire des idées, des recherches graphiques et des expérimentations
    de matériaux.'
- id: nblm-quelle-est-la-definition-d-une-note-d-in-2
  type: choix
  difficulte: 2
  enonce: Quelle est la définition d'une note d'intention au début d'un projet artistique ?
  reponse:
    options:
    - id: o1
      texte: La formulation en une ou deux phrases de ce que l'on veut produire comme effet ou comme sens.
    - id: o2
      texte: La liste exhaustive du matériel que l'établissement scolaire doit fournir.
    - id: o3
      texte: La note chiffrée que l'élève espère obtenir lors de l'évaluation.
    - id: o4
      texte: Le dessin définitif et complet de la réalisation avant tout essai préalable.
    bonnes:
    - o1
  indices:
    relance: Pense à ce que tu cherches à communiquer ou faire ressentir au spectateur dès le lancement de ta création.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : l''anticipation des besoins matériels relève de la gestion logistique, pas de l''intention artistique.'
  - si:
      contient:
      - o3
    relance: 'Erreur : l''intention concerne la démarche créative et la portée de l''œuvre, absolument pas la note scolaire.'
  - si:
      contient:
      - o4
    relance: 'Faux : un dessin rapide de recherche est une esquisse, tandis que l''intention s''exprime par le sens et l''effet
      visé.'
  solution: 'La formulation en une ou deux phrases de ce que l''on veut produire comme effet ou comme sens. Exact : l''intention
    exprime clairement l''effet plastique ou l''idée que l''élève souhaite faire ressentir au spectateur.'
- id: nblm-quelles-sont-les-grandes-etapes-de-la-re-3
  type: choix
  difficulte: 2
  enonce: Quelles sont les grandes étapes de la réalisation d'un projet artistique ordonnées chronologiquement ?
  reponse:
    options:
    - id: o1
      texte: Comprendre la demande et formuler l'intention, chercher (croquis, essais), réaliser, prendre du recul, puis présenter.
    - id: o2
      texte: Commencer la réalisation finale, puis faire des croquis si l'on rencontre un problème.
    - id: o3
      texte: Présenter le projet au groupe, réaliser la production, puis chercher l'intention.
    - id: o4
      texte: Faire l'évaluation, réaliser l'œuvre, puis comprendre les consignes du sujet.
    bonnes:
    - o1
  indices:
    relance: Pense à la suite logique qui commence par la réflexion et l'expérimentation avant la construction finale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : commencer directement la production finale sans croquis préalable empêche de tester ses idées.'
  - si:
      contient:
      - o3
    relance: 'Faux : la présentation intervient au terme du projet, une fois la production réalisée et analysée.'
  - si:
      contient:
      - o4
    relance: 'Faux : il est indispensable de comprendre la demande avant d''engager toute démarche de recherche ou de fabrication.'
  solution: 'Comprendre la demande et formuler l''intention, chercher (croquis, essais), réaliser, prendre du recul, puis
    présenter. C''est le déroulement méthodique : la recherche et la formulation de l''idée précèdent la réalisation et l''exposition.'
- id: nblm-pendant-la-realisation-si-tu-te-rends-co-4
  type: choix
  difficulte: 2
  enonce: Pendant la réalisation, si tu te rends compte que « mon idée ne marche pas », quelle attitude dois-tu adopter ?
  reponse:
    options:
    - id: o1
      texte: Analyser la cause du problème, adapter son projet et consigner la modification dans son carnet de recherches.
    - id: o2
      texte: Jeter immédiatement tout son travail et changer complètement de sujet sans rien noter.
    - id: o3
      texte: Ignorer le blocage et présenter la réalisation défectueuse sans chercher de solution.
    - id: o4
      texte: Effacer les erreurs passées du carnet pour faire croire que tout a fonctionné du premier coup.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la manière d'adapter ta technique tout en gardant une trace réflexive de ce changement dans tes notes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : abandonner au premier obstacle fait perdre le bénéfice de toute la démarche de recherche
      déjà engagée.'
  - si:
      contient:
      - o3
    relance: 'Faux : mener un projet exige d''interroger ce qu''on produit et d''adapter sa pratique pour résoudre les difficultés.'
  - si:
      contient:
      - o4
    relance: 'Faux : le carnet de recherches doit refléter les tâtonnements, les choix et la progression réelle de l''élève.'
  solution: 'Analyser la cause du problème, adapter son projet et consigner la modification dans son carnet de recherches.
    Exact : réajuster sa réalisation face aux contraintes permet de faire évoluer le projet sans abandonner son sens.'
- id: nblm-comment-le-travail-en-groupe-ou-individu-5
  type: choix
  difficulte: 2
  enonce: Comment le travail en groupe ou individuel en arts plastiques est-il encadré selon le programme ?
  reponse:
    options:
    - id: o1
      texte: Le projet peut être individuel ou collectif, et il est accompagné par le professeur.
    - id: o2
      texte: Le travail est obligatoirement individuel et l'intervention du professeur est interdite.
    - id: o3
      texte: Le travail doit impérativement être fait en groupe où tous les élèves exécutent la même tâche.
    - id: o4
      texte: Le professeur réalise la production et les élèves se contentent d'observer la démonstration.
    bonnes:
    - o1
  indices:
    relance: Considère les différentes formes d'organisation de la pratique plastique en classe avec l'aide de ton enseignant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : le projet peut s''effectuer en collectif et l''accompagnement par le professeur est une composante essentielle.'
  - si:
      contient:
      - o3
    relance: 'Faux : les projets individuels sont tout à fait possibles et l''initiative personnelle est encouragée.'
  - si:
      contient:
      - o4
    relance: 'Erreur : on attend de l''élève qu''il développe son autonomie, son initiative et son engagement dans sa propre
      création.'
  solution: 'Le projet peut être individuel ou collectif, et il est accompagné par le professeur. Exact : l''élève peut mener
    son travail seul ou en groupe, tout en étant guidé et conseillé par l''enseignant.'
- id: nblm-quelles-sont-les-deux-actions-indispensa-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux actions indispensables pour réussir à réajuster ma production au cours de sa fabrication ?
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Confronter régulièrement l'intention initiale avec ce qui est réellement produit.
    - id: o2
      texte: Anticiper les contraintes matérielles, de temps, de taille ou de solidité.
    - id: o3
      texte: Changer d'intention artistique à chaque fois qu'un outil est difficile à utiliser.
    - id: o4
      texte: Ne jamais vérifier la solidité ni les dimensions avant l'exposition finale.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux choix qui incitent à l'anticipation pratique et à la comparaison constante entre l'idée
      et le résultat.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : céder au moindre obstacle technique sans chercher d''adaptation fait perdre la cohérence du projet.'
  - si:
      contient:
      - o4
    relance: 'Faux : ne pas anticiper la taille ou la solidité risque d''aboutir à un projet irréalisable ou fragile.'
  solution: 'Confronter régulièrement l''intention initiale avec ce qui est réellement produit ; Anticiper les contraintes
    matérielles, de temps, de taille ou de solidité. Exact : comparer ce qu''on souhaite exprimer et le résultat obtenu permet
    de détecter les écarts et de corriger le tir.'
- id: nblm-comment-appelle-t-on-le-premier-dessin-r-7
  type: texte_court
