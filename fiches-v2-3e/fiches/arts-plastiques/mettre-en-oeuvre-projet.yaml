# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: mettre-en-oeuvre-projet
version: 2
etat: generee
declencheurs:
- carnet de recherches
- note d'intention
- étapes de ma réalisation
- mon idée ne marche pas
- réajuster ma production
- travail en groupe en arts plastiques
- projet de classe en art
prerequis:
- 4e-mettre-en-oeuvre-projet
- experimenter-produire-creer
essentiel: |
  Un projet artistique se conçoit, se réalise et se donne à voir. Il peut être individuel ou collectif, et il est accompagné par le professeur.

  Il avance par étapes : comprendre la demande et formuler son intention (l'effet que l'on veut produire), chercher (croquis, essais, documentation, souvent réunis dans un carnet de recherches), réaliser, prendre du recul, puis présenter. Ces étapes ne sont pas toujours dans cet ordre strict : on revient souvent en arrière.

  Un projet collectif demande de se répartir les tâches, d'écouter les autres, de décider ensemble et de tenir les délais. Chacun garde une part personnelle dans la production commune.

  Mener un projet, c'est aussi anticiper les difficultés : le temps disponible, le matériel, la taille, la solidité, le lieu, les autorisations, la sécurité.

  Pendant la réalisation, on compare régulièrement l'intention et ce qui est réellement produit. S'il y a un écart, on peut adapter la production ou réorienter l'intention, sans perdre de vue sa dimension artistique. Un accident ou un échec peut devenir une piste.

  On garde des traces de son travail : carnet de recherches, photographies des étapes, note d'intention. Elles servent à expliquer ses choix.

  Exemple d'artistes : Christo et Jeanne-Claude ont emballé de toile le Pont-Neuf à Paris en 1985, après des années de démarches pour obtenir les autorisations. Leurs dessins et maquettes préparatoires montrent toutes les étapes du projet.

  Enfin, on présente sa production et on explique oralement ses choix : pourquoi ces moyens, quelles difficultés, quels ajustements.

  Ce que l'on attend de l'élève : de l'autonomie, de l'initiative, de l'engagement, de la persévérance et un esprit critique sur son propre travail.
methode:
- Lire la demande et formuler son intention en une ou deux phrases.
- 'Chercher : faire des croquis et des essais, rassembler de la documentation, les garder dans le carnet de recherches.'
- Lister ce qui pourrait poser problème (temps, matériel, taille, lieu, autorisations) et prévoir une solution.
- Dans un projet collectif, répartir les tâches et fixer un calendrier avec le groupe.
- Réaliser, en s'arrêtant régulièrement pour comparer la production à l'intention.
- Adapter ou réorienter si besoin, en notant le changement et sa raison.
- Penser à la présentation et à l'explication orale de ses choix.
vocabulaire:
- terme: intention
  definition: ce que l'on veut produire comme effet ou comme sens avec sa production
- terme: carnet de recherches
  definition: carnet où l'on garde croquis, essais, notes et images qui préparent et accompagnent le projet
- terme: maquette
  definition: modèle réduit qui permet de tester un projet en volume ou dans un lieu avant de le réaliser en grand
- terme: esquisse
  definition: premier dessin rapide qui cherche une idée ou une composition
- terme: projet collectif
  definition: projet mené à plusieurs, avec une répartition des tâches et des décisions prises ensemble
erreurs_frequentes:
- Commencer directement la production finale sans aucun essai ni croquis.
- Abandonner le projet au premier problème au lieu de chercher la cause et d'adapter.
- Changer d'idée sans garder de trace dans le carnet de recherches.
- 'Oublier d''anticiper le temps et le matériel : le projet n''est pas terminé à l''heure.'
- Ne jamais comparer la production à l'intention de départ.
exemple:
  enonce: 'Projet fictif : Noé veut exprimer « l''enfermement » avec une boîte en carton dans laquelle on regarde
    par un petit trou. À mi-chemin, l''intérieur est trop sombre, on ne voit rien. Que doit-il faire ?'
  solution: 'Il compare la réalisation à son intention : l''obscurité renforce l''idée d''enfermement, mais si on
    ne voit rien, le spectateur ne comprend pas. Il cherche une solution sans changer d''intention : percer une
    petite fente en haut pour laisser passer un filet de lumière. Il note ce changement et sa raison dans son carnet
    de recherches.'
exercices:
- id: etapes-du-projet
  type: ordre
  difficulte: 1
  enonce: Range ces étapes d'un projet plastique dans l'ordre le plus logique.
  reponse:
    elements:
    - id: intention
      texte: Lire la demande et formuler son intention
    - id: recherches
      texte: Faire des croquis, des essais et chercher de la documentation
    - id: realisation
      texte: Réaliser la production
    - id: recul
      texte: 'Prendre du recul : comparer la production à l''intention et ajuster'
    - id: presentation
      texte: Présenter la production et expliquer ses choix
  indices:
    relance: 'Par quoi faut-il commencer : savoir ce que l''on veut, ou se lancer dans la production finale ?'
    methode: Place d'abord la première et la dernière étape, puis range celles du milieu.
    etape: On commence par formuler son intention et on finit par la présentation. Entre les deux, que faut-il faire
      avant de réaliser ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Peut-on comparer une production à l'intention avant de
      l'avoir réalisée ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape où l'on sait ce que l'on veut faire, puis celle où l'on montre le résultat au
      public.
  solution: 'Formuler son intention, chercher (croquis, essais, documentation), réaliser, prendre du recul et ajuster,
    présenter. En pratique, on revient souvent en arrière : prendre du recul peut relancer de nouveaux essais.'
- id: dessin-de-recherche
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le dessin rapide, souvent simplifié, que l'on fait pour chercher une idée avant de
    réaliser la production ?
  reponse:
    acceptees:
    - croquis
    - esquisse
    fautes_tolerees: 0
  indices:
    relance: Dans ton carnet de recherches, que fais-tu avec un crayon avant de te lancer ?
    methode: Cherche un mot qui désigne un dessin rapide, fait pour chercher et non pour être exposé.
    etape: Le mot commence par « cro… » ou par « esq… ».
  pieges:
  - si:
      valeur: brouillon
    relance: C'est bien l'idée. En arts plastiques, quel mot précis désigne ce dessin rapide de recherche ?
  - si:
      valeur: maquette
    relance: Une maquette est un modèle réduit en volume. On cherche un dessin rapide sur papier.
  solution: 'Un croquis (on dit aussi une esquisse) : un dessin rapide qui sert à chercher une idée ou une composition.'
- id: projet-qui-seffondre
  type: choix
  difficulte: 2
  enonce: 'Situation fictive : Tom construit une grande sculpture en carton. À mi-chemin, elle s''effondre. Coche
    les réactions qui montrent qu''il mène son projet avec esprit critique.'
  reponse:
    options:
    - id: a
      texte: Il abandonne le projet
    - id: b
      texte: Il recommence exactement de la même façon
    - id: c
      texte: Il cherche pourquoi elle s'est effondrée et renforce sa structure
    - id: d
      texte: Il garde son intention mais change d'échelle ou de matériau
    bonnes:
    - c
    - d
  indices:
    relance: Si Tom refait la même chose, que risque-t-il de se passer ?
    methode: Garde les réactions où Tom tire une leçon de l'effondrement pour faire avancer son projet.
    etape: Abandonner n'est pas mener à terme. Parmi les réactions restantes, lesquelles changent quelque chose
      pour que ça tienne ?
  pieges:
  - si:
      contient:
      - a
    relance: Le programme demande de mener sa production à terme. Tom peut-il sauver son projet ?
  - si:
      contient:
      - b
    relance: Sans rien changer, la sculpture a toutes les chances de s'effondrer à nouveau. Qu'est-ce qu'il faudrait
      modifier ?
  - si:
      diagnostic: incomplet
    relance: 'Il existe une autre bonne réaction : réorienter le projet sans renoncer à ce qu''il voulait exprimer.'
  solution: Tom cherche la cause et renforce la structure (c), ou il réoriente le projet en gardant son intention
    (changement d'échelle ou de matériau) (d). Abandonner ou refaire à l'identique ne règle rien.
- id: traces-du-projet
  type: association
  difficulte: 2
  enonce: Relie chaque outil du projet à ce à quoi il sert.
  reponse:
    gauche:
    - id: a
      texte: Le carnet de recherches
    - id: b
      texte: La note d'intention
    - id: c
      texte: La maquette
    - id: d
      texte: Le choix de l'accrochage
    droite:
    - id: w
      texte: Garder la trace des croquis, des essais et des idées abandonnées
    - id: x
      texte: Dire en quelques phrases l'effet que l'on veut produire
    - id: y
      texte: Tester en petit un volume ou une installation
    - id: z
      texte: Décider comment le public verra la production
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lequel de ces outils est un objet en volume, en plus petit ?
    methode: 'Pour chaque outil, demande-toi à quel moment du projet on s''en sert : au début, pendant les recherches,
      avant de réaliser en grand, ou à la fin.'
    etape: La maquette sert à tester en petit. L'accrochage concerne le moment où l'on montre la production. Il
      te reste deux outils.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel des deux sert à écrire ce que l'on veut, et lequel garde tout
      le chemin parcouru ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par la maquette, qui est le seul outil en volume, puis place les autres.
  solution: 'Carnet de recherches : garder la trace des croquis et essais. Note d''intention : dire l''effet voulu.
    Maquette : tester en petit. Accrochage : décider comment le public verra la production.'
- id: anticiper-une-installation
  type: choix
  difficulte: 1
  enonce: Ta classe prépare une installation dans le hall du collège. Coche ce qu'il faut anticiper avant de commencer.
  reponse:
    options:
    - id: a
      texte: Les dimensions du hall et l'endroit où passent les élèves
    - id: b
      texte: L'autorisation du chef d'établissement
    - id: c
      texte: Le temps nécessaire pour tout monter
    - id: d
      texte: Le prix auquel on pourra vendre l'installation
    - id: e
      texte: La couleur préférée de chaque élève de la classe
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Qu'est-ce qui pourrait empêcher l'installation d'être montée, ou la rendre dangereuse ?
    methode: Pense au lieu, aux personnes qui doivent donner leur accord, et au calendrier.
    etape: 'Le hall est un lieu de passage : il faut le mesurer et savoir où les élèves circulent. Qu''est-ce qu''il
      faut encore obtenir et prévoir ?'
  pieges:
  - si:
      contient:
      - d
    relance: Un projet de classe n'est pas fait pour être vendu. Qu'est-ce qui compte vraiment pour qu'il puisse
      exister dans le hall ?
  - si:
      contient:
      - e
    relance: Les couleurs se choisissent selon l'intention du projet, pas selon les goûts de chacun. Pense plutôt
      au lieu et au temps.
  - si:
      diagnostic: incomplet
    relance: Il manque quelque chose. Pense au lieu, à l'accord à obtenir et au calendrier.
  solution: Il faut anticiper les dimensions du lieu et les passages (a), l'autorisation du chef d'établissement
    (b) et le temps de montage (c). Le prix de vente et les goûts personnels ne comptent pas ici.
- id: ecart-intention-realisation
  type: ouverte
  difficulte: 3
  enonce: 'Projet fictif : Inès voulait donner une impression de calme avec une peinture de paysage marin. Une fois
    finie, sa peinture utilise surtout du rouge et des traits en zigzag, et ses camarades disent qu''elle paraît
    agitée. Explique l''écart entre l''intention et la réalisation, puis propose deux ajustements en justifiant
    chacun.'
  criteres:
  - 'L''élève identifie l''écart : les couleurs et les traits produisent un effet contraire à l''intention.'
  - L'élève propose deux ajustements plastiques précis (couleurs, lignes, gestes, composition).
  - L'élève justifie chaque ajustement par l'effet recherché, ou explique pourquoi garder l'écart pourrait aussi
    être un choix.
  indices:
    relance: Quels éléments de la peinture donnent une impression d'agitation ?
    methode: Compare l'effet voulu (le calme) et les moyens utilisés (couleur, lignes), puis cherche des moyens
      qui produiraient l'effet voulu.
    etape: 'Tu peux commencer ainsi : « Inès voulait du calme, mais le rouge et les zigzags donnent une impression
      de… »'
  solution: 'Exemple de réponse : Inès voulait du calme, mais le rouge vif et les zigzags donnent une impression
    d''agitation. Elle pourrait utiliser des couleurs froides et peu contrastées (bleus, gris clairs), qui apaisent
    le regard, et des lignes horizontales longues, qui évoquent l''horizon et le repos. Elle peut aussi décider
    de garder l''agitation si elle change d''intention, à condition de l''expliquer.'
- id: projet-collectif
  type: choix
  difficulte: 2
  enonce: 'Situation fictive : ta classe réalise ensemble une fresque. Coche les comportements qui font avancer
    un projet collectif.'
  reponse:
    options:
    - id: a
      texte: Se répartir les tâches et fixer un calendrier
    - id: b
      texte: Décider seul de tout sans consulter le groupe
    - id: c
      texte: Écouter les propositions des autres et décider ensemble
    - id: d
      texte: Attendre que les autres fassent le travail
    bonnes:
    - a
    - c
  indices:
    relance: Un projet collectif réussit quand chacun sait ce qu'il fait et écoute les autres.
    methode: Garde les comportements qui organisent le travail commun et écarte ceux qui l'empêchent.
    etape: Décider seul ou ne rien dire ne sert pas le groupe. Cherche la répartition et l'écoute.
  pieges:
  - si:
      contient:
      - b
    relance: Dans un projet collectif, une seule personne décide-t-elle pour tous ?
  - si:
      contient:
      - d
    relance: Attendre, est-ce s'engager dans le projet ?
  - si:
      diagnostic: incomplet
    relance: 'Il y a une autre bonne réponse : pense à la façon de prendre les décisions à plusieurs.'
  solution: Répartir les tâches (a) et écouter les propositions des autres pour décider ensemble (c) font avancer
    le projet. Tout faire seul (b) ou ne rien proposer (d) empêche le groupe de progresser.
- id: mot-carnet
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le carnet où l'on garde croquis, essais, notes et images qui préparent et accompagnent
    un projet ?
  reponse:
    acceptees:
    - carnet de recherches
    - carnet de recherche
    - carnet de bord
    fautes_tolerees: 2
  indices:
    relance: Où gardes-tu tes croquis et tes essais pour t'en souvenir ?
    methode: 'Le nom du carnet dit ce que l''on y fait : on y garde le résultat de ce que l''on cherche.'
    etape: 'Il se compose de deux mots : « carnet de ... » suivi d''un nom pluriel.'
  pieges:
  - si:
      valeur: cahier de texte
    relance: Le cahier de texte sert aux devoirs. Quel carnet garde les recherches plastiques ?
  solution: 'C''est le carnet de recherches : il garde la trace des croquis, des essais et des idées abandonnées,
    ce qui permet d''expliquer ses choix.'
