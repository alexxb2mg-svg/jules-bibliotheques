format: 2
notion: presence-materielle-oeuvre-espace
version: 2
etat: verifiee
declencheurs:
- monument emballé
- sculpture géante sur une place
- socle et cartel
- accrocher une exposition
- land art
- rapport d'échelle
- exposition au collège
- œuvre dans la rue
- Christo emballage
- Spiral Jetty
prerequis:
- 4e-presence-materielle-oeuvre-espace
essentiel: 'Une œuvre occupe un espace réel : sa taille, sa matière, sa place et sa présentation changent la façon dont on
  la voit.

  - Le rapport d''échelle : la taille de l''œuvre comparée à celle du spectateur et du lieu. Claes Oldenburg agrandit des
  objets banals jusqu''à les rendre géants, comme Clothespin (1976), une pince à linge en acier haute de plusieurs étages
  sur une place de Philadelphie.

  - L''in situ : une œuvre conçue pour un lieu précis, qui tient compte de son architecture et n''a de sens qu''à cet endroit.
  Daniel Buren installe en 1986 Les Deux Plateaux dans la cour d''honneur du Palais-Royal à Paris : des colonnes rayées noir
  et blanc, de hauteurs différentes.

  - La dimension éphémère : certaines œuvres ne durent que quelques jours. Christo et Jeanne-Claude emballent de toile le
  Pont-Neuf à Paris en 1985, pendant quatorze jours ; en 2021, l''Arc de Triomphe est empaqueté à son tour. Photos et films
  en gardent la trace.

  - L''espace public : rues, places, parcs, paysages. Robert Smithson construit en 1970 Spiral Jetty, une spirale de roches
  et de terre dans le Grand Lac Salé (Utah) : c''est le land art.


  Les dispositifs de présentation (socle, cadre, mur ou cimaise, vitrine, suspension, sol, éclairage, cartel) ne sont pas
  neutres : ils désignent l''œuvre, la mettent à distance ou au contraire la mêlent à l''espace du spectateur. Une sculpture
  sur un socle se regarde de loin ; posée au sol, elle partage notre espace ; suspendue, elle change de point de vue.


  L''architecture aussi organise l''espace : un musée, une place, un escalier guident nos déplacements, la lumière, la circulation.
  Une exposition est une construction : on choisit un lieu, un parcours, un ordre, des dispositifs.


  Présenter ses propres productions, c''est aussi faire des choix plastiques : où les mettre, à quelle hauteur, avec quelle
  lumière, avec ou sans cartel.


  Au brevet, on attend que tu repères l''échelle, le lieu, la durée et le dispositif de présentation, puis que tu dises l''effet
  produit sur le spectateur (distance, surprise, déplacement, regard nouveau sur le lieu).

  '
methode:
- Mesurer ou estimer la taille de l'œuvre par rapport au corps du spectateur et au lieu.
- 'Repérer le lieu : musée, salle de classe, rue, paysage, bâtiment. L''œuvre a-t-elle été pensée pour lui (in situ) ?'
- 'Décrire le dispositif de présentation : socle, mur, sol, suspension, vitrine, éclairage, cartel.'
- Se demander combien de temps l'œuvre existe (durable ou éphémère) et comment on en garde la trace.
- 'Dire l''effet produit sur le spectateur : distance, surprise, déplacement, regard nouveau sur le lieu.'
vocabulaire:
- terme: in situ
  definition: se dit d'une œuvre conçue pour un lieu précis, en fonction de ses caractéristiques
- terme: échelle
  definition: rapport entre la taille de l'œuvre (ou de ce qu'elle montre) et une taille de référence, souvent celle du corps
    humain
- terme: éphémère
  definition: qui ne dure qu'un temps limité
- terme: cartel
  definition: 'petite étiquette placée près de l''œuvre : artiste, titre, date, matériaux'
- terme: land art
  definition: art qui utilise le paysage et les matériaux naturels comme lieu et matière de l'œuvre
- terme: cimaise
  definition: mur d'exposition sur lequel on accroche les œuvres dans un musée ou une galerie
- terme: espace public
  definition: 'lieu ouvert à tous : rue, place, parc, paysage'
- terme: installation
  definition: œuvre qui occupe un espace et que le spectateur parcourt ou traverse
erreurs_frequentes:
- 'Croire que le socle ou le cadre ne comptent pas : ils font partie de la façon dont l''œuvre est vue.'
- Confondre in situ (pensé pour un lieu précis) et simplement « exposé dehors ».
- 'Penser qu''une œuvre éphémère a échoué parce qu''elle disparaît : sa courte durée fait partie du projet.'
- Parler de « grande » ou « petite » œuvre sans la comparer au corps du spectateur ou au lieu.
exemple:
  enonce: 'Production fictive d''élèves : une classe suspend cinquante grues en papier au-dessus de l''escalier principal
    du collège, pour une semaine. Analyse la présentation de cette production.'
  solution: 'Les grues ne sont pas sur un socle ni dans un cadre : elles sont suspendues dans un lieu de passage, l''escalier,
    choisi pour sa hauteur. On peut parler d''une installation pensée pour ce lieu (in situ). En montant, les élèves voient
    les grues d''en dessous puis à leur hauteur : le point de vue change. L''œuvre est éphémère, une semaine ; des photos
    en garderont la trace.'
exercices:
- id: mot-in-situ
  type: texte_court
  difficulte: 1
  enonce: Comment dit-on d'une œuvre conçue pour un lieu précis, qui tient compte de ses caractéristiques et perdrait son
    sens ailleurs ? (deux mots latins)
  reponse:
    acceptees:
    - in situ
    - in-situ
    fautes_tolerees: 0
  indices:
    relance: Les Deux Plateaux de Daniel Buren pourraient-ils être déplacés dans un autre jardin sans rien perdre ?
    methode: L'expression latine veut dire « sur place », « dans son lieu ».
    etape: Le premier mot latin est « in » ; le second ressemble au mot français « site ».
  pieges:
  - si:
      valeur: éphémère
    relance: Éphémère parle de durée. On cherche un mot qui parle du lien entre l'œuvre et son lieu.
  - si:
      valeur: installation
    relance: Une installation peut être montrée dans plusieurs lieux. On cherche l'expression latine pour une œuvre liée à
      un seul lieu.
  - si:
      diagnostic: mauvaise_reponse
    relance: Pense à une expression latine qui veut dire « sur place ».
  solution: 'In situ : l''œuvre est conçue pour un lieu précis, comme Les Deux Plateaux de Daniel Buren (1986) dans la cour
    d''honneur du Palais-Royal.'
- id: pont-neuf-emballe
  type: choix
  difficulte: 1
  enonce: Christo et Jeanne-Claude ont emballé le Pont-Neuf à Paris en 1985, pendant quatorze jours seulement. Quelle dimension
    de l'œuvre cette durée met-elle en avant ?
  reponse:
    options:
    - id: a
      texte: Sa dimension éphémère
    - id: b
      texte: Sa taille miniature
    - id: c
      texte: Sa présentation sous vitrine
    - id: d
      texte: Sa fabrication numérique
    bonnes:
    - a
  indices:
    relance: Que reste-t-il de l'emballage du Pont-Neuf aujourd'hui, à part des photos ?
    methode: Cherche la réponse qui parle du temps, puisque l'énoncé insiste sur la durée.
    etape: Quatorze jours, c'est très court pour une œuvre. Comment appelle-t-on ce qui ne dure pas ?
  pieges:
  - si:
      contient:
      - b
    relance: Emballer un pont entier, est-ce miniature ? L'énoncé parle surtout de durée.
  - si:
      contient:
      - c
    relance: Peut-on mettre un pont sous vitrine ? L'œuvre était dehors, dans la ville.
  - si:
      contient:
      - d
    relance: L'emballage était fait de toile et de cordes. Quelle réponse parle de la durée ?
  solution: 'Sa dimension éphémère : l''œuvre n''a existé que quatorze jours, dans l''espace public. Les photographies et
    les films en gardent la trace.'
- id: dispositifs-effets
  type: association
  difficulte: 2
  enonce: Relie chaque dispositif de présentation à son effet sur le spectateur.
  reponse:
    gauche:
    - id: a
      texte: Un socle
    - id: b
      texte: Une vitrine
    - id: c
      texte: Une sculpture posée directement au sol, sans socle
    - id: d
      texte: Un cartel
    droite:
    - id: x
      texte: Il sépare l'œuvre du sol et la désigne comme une chose à regarder
    - id: y
      texte: Elle protège l'œuvre et crée une distance qu'on ne peut pas franchir
    - id: z
      texte: Elle partage le même espace que le spectateur
    - id: w
      texte: 'Il informe : artiste, titre, date, matériaux'
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Lequel de ces dispositifs contient des mots plutôt que de porter l'œuvre ?
    methode: 'Pour chaque dispositif, demande-toi : l''œuvre est-elle surélevée, enfermée, à notre niveau, ou expliquée ?'
    etape: Le cartel donne des informations. La vitrine est une boîte en verre. Place le socle et la sculpture au sol.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel de ces dispositifs met un verre entre l'œuvre et toi ?
  - si:
      diagnostic: associations_fausses
    relance: 'Imagine-toi devant chaque dispositif : l''œuvre est-elle plus haute, derrière un verre, à tes pieds, ou décrite
      ?'
  solution: 'Socle : il isole l''œuvre et la désigne. Vitrine : elle protège et met à distance. Sculpture au sol : elle partage
    l''espace du spectateur. Cartel : il informe sur l''œuvre.'
- id: agrandir-une-gomme
  type: nombre
  difficulte: 2
  enonce: 'Production fictive d''élève : Maël agrandit une gomme de 5 cm de long en une sculpture de 2 m de long, à la manière
    des objets géants de Claes Oldenburg. Par combien la longueur a-t-elle été multipliée ?'
  reponse:
    valeur: 40
    forme: entier
  indices:
    relance: Tes deux longueurs sont-elles dans la même unité ?
    methode: Convertis les mètres en centimètres, puis divise la grande longueur par la petite.
    etape: Il y a 100 cm dans un mètre. Calcule d'abord la longueur de la sculpture en centimètres.
  pieges:
  - si:
      valeur: 0.4
    relance: Tu as divisé la petite longueur par la grande. L'objet a-t-il été rapetissé ou agrandi ?
  - si:
      valeur: 2.5
    relance: As-tu converti les 2 m en centimètres avant de diviser ?
  - si:
      valeur: 0.025
    relance: Tu as divisé la petite longueur par la grande, sans convertir. Commence par mettre tout en centimètres.
  - si:
      diagnostic: valeur_fausse
    relance: Mets les deux longueurs en centimètres, puis cherche combien de fois la petite tient dans la grande.
  solution: '2 m = 200 cm, et 200 ÷ 5 = 40. La longueur est multipliée par 40 : ce fort changement d''échelle rend l''objet
    banal étrange et imposant, comme les objets géants d''Oldenburg.'
- id: preparer-une-exposition
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour présenter les productions de la classe dans le hall du collège.
  reponse:
    elements:
    - id: observer
      texte: 'Observer le lieu : lumière, passages, murs, hauteur'
    - id: choisir
      texte: 'Choisir un dispositif pour chaque production : mur, socle, sol, suspension'
    - id: installer
      texte: Installer les productions
    - id: cartels
      texte: Placer un cartel près de chaque production installée
    - id: accueillir
      texte: Accueillir le public et observer comment il circule
  indices:
    relance: Peut-on choisir où accrocher une production sans connaître le lieu ?
    methode: Va du lieu vers les choix, puis vers l'installation, et termine par le public.
    etape: On commence par observer le hall. Qu'est-ce qu'on décide juste après, avant d'installer ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque. Deux étapes voisines sont inversées : peut-on placer un cartel près d''une production pas encore installée
      ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère la première étape (découvrir le lieu) et la dernière (le public arrive), puis range le reste.
  solution: Observer le lieu, choisir les dispositifs, installer les productions, placer les cartels, puis accueillir le public.
- id: analyse-clothespin
  type: ouverte
  difficulte: 3
  enonce: 'Claes Oldenburg, Clothespin (1976) : une pince à linge en acier, haute de plusieurs étages, installée sur une place
    publique de Philadelphie, au milieu des immeubles de bureaux. Analyse en quelques phrases la présence de cette œuvre dans
    l''espace.'
  criteres:
  - 'L''élève analyse le rapport d''échelle : un objet banal et petit agrandi au-delà de la taille humaine, face au spectateur
    et aux immeubles.'
  - 'L''élève explique le rôle de l''espace public : l''œuvre est vue par des passants qui ne vont pas au musée, sans socle
    de musée ni vitrine.'
  - L'élève dit l'effet produit (surprise, humour, regard nouveau sur la ville ou sur l'objet) et le justifie.
  indices:
    relance: Quelle est la taille d'une vraie pince à linge ? Et celle de celle-ci ?
    methode: Parle successivement de l'échelle, du lieu, puis de l'effet sur le passant.
    etape: Tu peux commencer ainsi « Oldenburg choisit un objet du quotidien minuscule et... »
  solution: 'Oldenburg choisit un objet minuscule et banal, la pince à linge, et l''agrandit jusqu''à la hauteur d''un immeuble
    : ce changement d''échelle rend l''objet surprenant, presque monumental. Placée sur une place publique, l''œuvre est vue
    chaque jour par des passants qui ne l''ont pas cherchée ; elle dialogue avec les immeubles qui l''entourent. L''effet
    est plein d''humour : un objet de la maison devient un monument de la ville, et on regarde autrement l''objet comme le
    lieu.'
- id: buren-in-situ
  type: choix
  difficulte: 2
  enonce: Daniel Buren installe en 1986 Les Deux Plateaux, des colonnes rayées de hauteurs différentes, dans la cour d'honneur
    du Palais-Royal à Paris. Qu'est-ce qui montre que l'œuvre est pensée pour ce lieu ?
  reponse:
    options:
    - id: a
      texte: Elle tient compte de l'architecture et du sol de la cour, et n'a de sens qu'à cet endroit
    - id: b
      texte: Elle est posée sur un socle de musée
    - id: c
      texte: Elle pourrait être installée n'importe où sans rien changer
    - id: d
      texte: Elle disparaît après quatorze jours
    bonnes:
    - a
  indices:
    relance: Que ferait-on de ces colonnes dans un autre lieu ? Garderaient-elles le même sens ?
    methode: Cherche la réponse qui relie l'œuvre à l'architecture de la cour.
    etape: 'Élimine la réponse qui parle d''un socle de musée et celle qui parle de disparition : elles ne disent rien du
      lieu.'
  pieges:
  - si:
      contient:
      - b
    relance: Ces colonnes sont dans une cour, pas sur un socle de musée.
  - si:
      contient:
      - c
    relance: Si l'œuvre pouvait aller n'importe où sans changement, elle ne serait pas conçue pour ce lieu.
  - si:
      contient:
      - d
    relance: Ces quatorze jours sont la durée de l'emballage du Pont-Neuf, pas celle de cette œuvre.
  solution: 'L''œuvre est in situ : elle tient compte de l''architecture de la cour et n''a de sens qu''à cet endroit.'
- id: role-architecture
  type: choix
  difficulte: 3
  enonce: Quel rôle joue l'architecture d'un lieu d'exposition (hall, escalier, salle) dans la présentation des œuvres ?
  reponse:
    options:
    - id: a
      texte: Elle organise la circulation, la lumière et le point de vue du spectateur
    - id: b
      texte: 'Aucun : un lieu ne change jamais la façon de voir une œuvre'
    - id: c
      texte: Elle sert uniquement à protéger les œuvres de la pluie
    - id: d
      texte: Elle décide seule du sens de l'œuvre
    bonnes:
    - a
  indices:
    relance: Comment se déplace-t-on dans un lieu ? Où vient la lumière ? Qui guide notre regard ?
    methode: 'Pense à un musée : couloirs, salles, escalier, éclairage. Que produisent-ils sur le spectateur ?'
    etape: Cherche la réponse qui parle de circulation, de lumière et de point de vue.
  pieges:
  - si:
      contient:
      - b
    relance: Un escalier, une salle, un éclairage changent le regard porté sur une œuvre.
  - si:
      contient:
      - c
    relance: Protéger de la pluie est une fonction, mais l'architecture agit aussi sur le regard du spectateur.
  - si:
      contient:
      - d
    relance: L'architecture influence la présentation, mais le sens vient aussi de l'artiste et du spectateur.
  solution: 'L''architecture organise la circulation, la lumière et le point de vue du spectateur : elle fait partie de la
    présentation.'
