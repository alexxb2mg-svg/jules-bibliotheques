- id: matiere-outil-geste
  type: association
  difficulte: 2
  enonce: Relie chaque matière à l'outil et au geste qui vont avec, pour un sculpteur ou un peintre.
  reponse:
    gauche:
    - id: a
      texte: Un bloc de marbre
    - id: b
      texte: Un pain d'argile
    - id: c
      texte: Une toile peinte, avec une couche épaisse
    - id: d
      texte: Une carrosserie de voiture
    droite:
    - id: w
      texte: 'Ciseau et maillet : on taille'
    - id: x
      texte: 'Les doigts et l''ébauchoir : on modèle'
    - id: y
      texte: 'Couteau à palette : on étale la peinture en pâte'
    - id: z
      texte: 'Presse hydraulique : on comprime'
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Quelle matière est très dure et demande des outils pour la creuser ?
    methode: 'Pour chaque matière, pense à son état (dure, molle, épaisse, métallique) : quel outil et quel geste lui conviennent
      ?'
    etape: 'La carrosserie est en métal : seule une machine très puissante peut la transformer. Cherche l''outil qui n''est
      pas manuel.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie la matière molle et la matière dure.
  - si:
      diagnostic: associations_fausses
    relance: 'Repars de l''état de chaque matière : dure, molle, en couche épaisse, ou en métal à écraser.'
  solution: 'Marbre : ciseau et maillet (taille). Argile : doigts (modelage). Peinture épaisse : couteau (empâtement). Carrosserie
    : presse hydraulique (compression).'
- id: cesar-sens
  type: choix
  difficulte: 3
  enonce: 'En 1960, César présente ses « Compressions » : des carrosseries de voitures écrasées en blocs de métal. Quelles
    affirmations sont justes ? (deux réponses)'
  reponse:
    options:
    - id: a
      texte: La matière, le poids et la forme du bloc font partie de ce que l'œuvre exprime
    - id: b
      texte: Un objet du quotidien, transformé par une machine, devient une sculpture
    - id: c
      texte: L'œuvre représente un paysage de montagne peint sur une toile
    - id: d
      texte: Seule compte la couleur de la voiture, pas la matière
    bonnes:
    - a
    - b
  indices:
    relance: Que reste-t-il de la voiture après la presse ? Est-ce une image ou un objet réel ?
    methode: Cherche les réponses qui parlent de la matière et de la transformation, pas d'une image peinte.
    etape: 'César ne peint pas : il utilise une presse sur un objet réel. Élimine les réponses qui parlent de peinture ou
      de couleur seule.'
  pieges:
  - si:
      contient:
      - c
    relance: Les Compressions sont des blocs de métal, pas des peintures de paysage.
  - si:
      contient:
      - d
    relance: 'La couleur est un détail. Qu''est-ce qui est vraiment transformé : la couleur ou la matière ?'
  - si:
      diagnostic: incomplet
    relance: Tu as une bonne réponse. Une autre parle de la matière du bloc ou de l'objet du quotidien transformé.
  solution: 'Les Compressions sont de vrais objets : la réalité concrète (métal, poids, bloc) porte le sens, et un objet du
    quotidien devient sculpture par transformation.'
