# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: transformation-de-la-matiere
version: 3
etat: verifiee
declencheurs:
- modeler de l'argile
- tailler dans un bloc
- froisser ou déchirer le papier
- la trace du geste
- compressions de César
- toile fendue de Fontana
- travailler la matière
- presse hydraulique
- sculpture en plâtre
- peinture épaisse au couteau
prerequis:
- 4e-transformation-de-la-matiere
- experimenter-produire-creer
essentiel: 'Une production plastique naît toujours de la rencontre entre une matière, un outil et un geste. Le même papier
  peut être plié, froissé, déchiré, mouillé, brûlé ; la même argile peut être pincée, étirée, creusée, lissée. Chaque geste
  laisse une trace et donne un sens différent.


  Trois éléments à toujours nommer :

  - la matière : dure (pierre, bois), molle (argile, cire), liquide (plâtre, peinture), souple (papier, tissu) ;

  - l''outil : ciseau, maillet, gouge, pinceau, couteau, presse, ou simplement la main ;

  - le geste : tailler, modeler, couler, assembler, froisser, gratter, projeter, fendre.


  En sculpture, on distingue plusieurs grandes opérations :

  - la taille : on enlève de la matière dans un bloc (pierre, bois) avec un ciseau et un maillet ; on ne peut pas revenir
  en arrière ;

  - le modelage : on façonne une matière molle (argile, cire, pâte à modeler) en ajoutant, en retirant, en poussant ;

  - le moulage : on coule une matière liquide (plâtre, bronze fondu) dans un moule, puis on démoule ;

  - l''assemblage : on réunit des éléments différents (collage, clouage, soudure).


  En peinture, la matière peut être fluide et transparente (lavis) ou épaisse (empâtement), étalée au pinceau, au couteau,
  à la main, projetée ou coulée. Selon l''outil et le geste, on voit ou non la trace de la main.


  La réalité concrète de l''œuvre compte autant que ce qu''elle représente : sa matière, son poids, sa texture, ses dimensions.
  Cette réalité physique peut elle-même produire du sens. En 1960, César présente ses premières « Compressions » : des carrosseries
  de voitures écrasées par une presse hydraulique, devenues des blocs de métal. L''objet de consommation perd sa forme, et
  cette transformation fait réfléchir. À partir de 1958, Lucio Fontana fend d''un coup de lame des toiles peintes d''une seule
  couleur : l''entaille, qui ouvre la toile sur l''espace, est le sujet même de l''œuvre.


  Au brevet, on attend que tu nommes la matière, l''outil et le geste, décrives la trace laissée et dises ce que cette transformation
  signifie.

  '
methode:
- Nommer la matière utilisée et son état de départ (dure, molle, liquide, souple).
- 'Nommer l''outil et le geste : tailler, modeler, couler, assembler, froisser, gratter, projeter…'
- Décrire la trace que le geste a laissée et l'effet produit (fragilité, violence, douceur, énergie).
- 'Décrire la réalité concrète de l''œuvre : matière, poids, texture, dimensions.'
- 'Relier la transformation au sens de l''œuvre : que nous dit la matière transformée ?'
vocabulaire:
- terme: taille
  definition: opération qui consiste à enlever de la matière dans un bloc dur
- terme: modelage
  definition: opération qui consiste à façonner une matière molle avec les mains ou des outils
- terme: moulage
  definition: opération qui consiste à couler une matière liquide dans un moule pour qu'elle en prenne la forme
- terme: empâtement
  definition: une couche de peinture épaisse, en relief, qui garde la trace de l'outil
- terme: réalité concrète de l'œuvre
  definition: 'ce dont l''œuvre est matériellement faite : matière, poids, texture, dimensions'
- terme: assemblage
  definition: opération qui consiste à réunir des éléments différents (collage, clouage, soudure)
- terme: lavis
  definition: peinture très diluée, fluide et transparente
- terme: trace
  definition: ce que le geste et l'outil laissent visible sur la matière
erreurs_frequentes:
- Ne décrire que ce que l'œuvre représente, sans parler de la matière et des gestes qui l'ont transformée.
- Confondre taille (on enlève de la matière) et modelage (on façonne une matière molle, en ajoutant ou en retirant).
- 'Croire qu''une trace de geste est une maladresse : elle peut être voulue et donner son sens à l''œuvre.'
- Oublier le rôle de l'outil (pinceau, couteau, peigne, main) dans l'effet obtenu.
exemple:
  enonce: Un élève (fictif) froisse une grande feuille de papier blanc, puis la déplie et la fixe au mur. Décris la transformation
    de la matière et l'effet produit.
  solution: 'La matière de départ est une feuille lisse et plate. Le geste de froisser, fait à la main, la transforme : elle
    se couvre de plis et de creux et prend du relief. La lumière crée des ombres dans les plis. La feuille garde la trace
    du geste, un peu violent : elle peut évoquer quelque chose de chiffonné, d''abîmé, ou un paysage de montagnes vu du ciel.'
exercices:
- id: mot-taille
  type: texte_court
  difficulte: 1
  enonce: Un sculpteur enlève de la matière dans un bloc de pierre avec un ciseau et un maillet. Comment s'appelle cette opération
    ?
  reponse:
    acceptees:
    - taille
    - la taille
    - taille directe
    - tailler
    fautes_tolerees: 0
  indices:
    relance: Le sculpteur ajoute-t-il de la matière, ou en retire-t-il ?
    methode: Pour la pierre et le bois, matières dures, l'opération de retrait a un nom précis. Relis la liste des opérations
      de la sculpture.
    etape: 'Pense à l''outil qui rend un crayon pointu : le premier mot de son nom est celui que tu cherches.'
  pieges:
  - si:
      valeur: modelage
    relance: Le modelage se fait dans une matière molle, comme l'argile. Ici, la pierre est dure et on la creuse. Comment
      s'appelle cette opération ?
  - si:
      valeur: moulage
    relance: Le moulage consiste à couler une matière liquide dans un moule. Ici, que fait le sculpteur au bloc ?
  solution: 'C''est la taille : on enlève de la matière dans un bloc dur, sans pouvoir revenir en arrière.'
- id: gestes-transformations
  type: association
  difficulte: 1
  enonce: Relie chaque geste à la transformation de la matière qu'il produit.
  reponse:
    gauche:
    - id: a
      texte: Tailler un bloc de bois avec une gouge
    - id: b
      texte: Façonner une boule d'argile avec les doigts
    - id: c
      texte: Verser du plâtre liquide dans un moule
    - id: d
      texte: Coller ensemble des morceaux de carton
    droite:
    - id: w
      texte: On retire de la matière
    - id: x
      texte: On pousse et on déplace une matière molle
    - id: y
      texte: La matière prend la forme d'un creux en durcissant
    - id: z
      texte: On réunit des éléments séparés
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Dans quel geste la matière est-elle liquide au départ ?
    methode: 'Pour chaque geste, demande-toi : la matière diminue-t-elle, se déforme-t-elle, se fige-t-elle, ou s''additionne-t-elle
      ?'
    etape: 'Avec la gouge, des copeaux tombent : la matière diminue. Continue avec l''argile.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux gestes qui touchent une matière molle ou liquide.
  - si:
      diagnostic: associations_fausses
    relance: 'Pense à l''état de chaque matière au départ : dure, molle, liquide, ou en morceaux.'
  solution: 'Tailler le bois : on retire de la matière. Façonner l''argile : on déplace une matière molle. Couler le plâtre
    : il prend la forme du moule. Coller le carton : on réunit des éléments (assemblage).'
- id: mot-empatement
  type: texte_court
  difficulte: 2
  enonce: Une élève (fictive) étale au couteau une peinture très épaisse, qui forme des reliefs où l'on voit la trace de l'outil.
    Comment appelle-t-on cette couche de peinture épaisse ?
  reponse:
    acceptees:
    - empâtement
    - empâtements
    - un empâtement
    fautes_tolerees: 1
  indices:
    relance: La peinture est-elle ici fluide et transparente, ou épaisse comme une pâte ?
    methode: 'Le mot est de la même famille que « pâte » : on parle d''une peinture « en pâte ».'
    etape: Le mot commence par « em- » et se termine par « -ment ».
  pieges:
  - si:
      valeur: lavis
    relance: Le lavis est une peinture très diluée, transparente. Ici, la peinture est épaisse et fait du relief. Quel mot
      convient ?
  - si:
      valeur: aplat
    relance: 'Un aplat est une surface de couleur uniforme, sans relief visible. Ici, la matière est épaisse et marquée par
      l''outil : quel est le mot ?'
  solution: 'C''est un empâtement : une couche de peinture épaisse, en relief, qui garde la trace du couteau.'
- id: fontana-geste
  type: choix
  difficulte: 2
  enonce: À partir de 1958, Lucio Fontana fend d'un coup de lame des toiles peintes d'une seule couleur. Que montre surtout
    ce geste ?
  reponse:
    options:
    - id: a
      texte: Que la toile est une matière réelle, qu'on peut ouvrir, et non une simple fenêtre sur une image
    - id: b
      texte: Que l'artiste a abîmé sa toile par accident
    - id: c
      texte: Qu'il voulait représenter un paysage avec une rivière
    - id: d
      texte: Que la peinture était de mauvaise qualité
    bonnes:
    - a
  indices:
    relance: Représente-t-on quelque chose sur ces toiles, ou agit-on directement sur elles ?
    methode: 'Pense à la réalité concrète de l''œuvre : le support lui-même devient ce qu''on regarde.'
    etape: Le geste est voulu et répété sur de nombreuses toiles. Élimine l'accident. Que devient le support quand on le fend
      ?
  pieges:
  - si:
      contient:
      - b
    relance: Fontana a répété ce geste sur de nombreuses toiles, avec soin. Est-ce un accident ? Que montre l'entaille ?
  - si:
      contient:
      - c
    relance: Les toiles sont d'une seule couleur, sans paysage. L'entaille représente-t-elle quelque chose, ou agit-elle sur
      la toile elle-même ?
  solution: L'entaille montre que la toile est une matière réelle, qu'on peut ouvrir sur l'espace qui est derrière. Le geste
    est le sujet même de l'œuvre.
- id: etapes-moulage
  type: ordre
  difficulte: 2
  enonce: Range les étapes d'un moulage en plâtre, de la première à la dernière.
  reponse:
    elements:
    - id: modele
      texte: Modeler un modèle en argile
    - id: moule
      texte: Fabriquer un moule autour du modèle
    - id: couler
      texte: Couler le plâtre liquide dans le moule
    - id: prise
      texte: Attendre que le plâtre durcisse
    - id: demouler
      texte: Retirer le moule pour découvrir la pièce en plâtre
  indices:
    relance: De quoi a-t-on besoin avant de pouvoir fabriquer un moule ?
    methode: Place la première et la dernière étape, puis range celles du milieu.
    etape: On commence par le modèle en argile. Peut-on couler le plâtre avant d'avoir un moule ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Peut-on faire la seconde avant la première ?
  - si:
      diagnostic: ordre_faux
    relance: 'Suis la matière : d''abord le modèle, puis le creux qui le copie, puis le plâtre qui remplit ce creux.'
  solution: Modeler le modèle, fabriquer le moule autour, couler le plâtre, attendre qu'il durcisse, démouler.
- id: analyser-compression
  type: ouverte
  difficulte: 3
  enonce: 'En 1960, César présente des « Compressions » : des carrosseries de voitures écrasées par une presse hydraulique
    jusqu''à former des blocs de métal. En quelques phrases, décris la transformation de la matière (matière, outil, geste)
    et dis ce que cette transformation peut signifier.'
  criteres:
  - L'élève nomme la matière (métal, carrosserie), l'outil (la presse hydraulique) et l'action (compresser, écraser).
  - L'élève décrit le résultat concret (bloc, plis, couleurs mêlées, perte de la forme de la voiture).
  - L'élève propose un sens justifié (objet de consommation réduit à un bloc, rebut devenu œuvre, force de la machine).
  indices:
    relance: Que reste-t-il de la voiture après le passage de la presse ?
    methode: 'Décris dans l''ordre : la matière de départ, l''outil, le geste, le résultat, puis ce que cela évoque.'
    etape: 'Tu peux commencer ainsi : « César part d''une carrosserie de voiture, en métal. Il utilise… »'
  solution: 'César part d''une carrosserie de voiture en métal. Il ne la sculpte pas à la main : il utilise une presse hydraulique
    qui l''écrase jusqu''à en faire un bloc. La forme de la voiture disparaît ; il reste des plis de métal et des morceaux
    de peinture mêlés. Un objet de consommation, qui valait cher, devient un bloc presque abstrait : l''œuvre fait réfléchir
    à ce que deviennent nos objets.'
- id: nblm-quelle-est-la-difference-fondamentale-en-1
  type: choix
  difficulte: 2
  enonce: Quelle est la différence fondamentale entre tailler dans un bloc et modeler de l'argile ?
  reponse:
    options:
    - id: o1
      texte: La taille enlève de la matière dans un bloc dur de façon irréversible, alors que le modelage façonne une matière
        molle en ajoutant ou retirant.
    - id: o2
      texte: La taille utilise uniquement les mains, alors que le modelage nécessite un ciseau et un maillet.
    - id: o3
      texte: La taille consiste à couler de la matière liquide, alors que le modelage réunit des éléments séparés.
    - id: o4
      texte: Le modelage est irréversible, tandis qu'on peut remettre de la matière lors de la taille.
    bonnes:
    - o1
  indices:
    relance: Pense à la consistance de la matière au départ (dure ou molle) et à la possibilité d'ajouter ou de retirer de
      la matière.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : c''est l''inverse, la taille nécessite des outils comme le ciseau et le maillet pour retirer
      la matière dure, alors que le modelage se fait principalement avec les mains ou de petits outils.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : couler de la matière liquide correspond au moulage, tandis que réunir des éléments séparés
      correspond à l''assemblage.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : c''est la taille qui est irréversible car la matière retirée d''un bloc dur ne peut pas y être
      réintégrée.'
  solution: 'La taille enlève de la matière dans un bloc dur de façon irréversible, alors que le modelage façonne une matière
    molle en ajoutant ou retirant. C''est exact : la taille extrait de la matière d''un bloc dur (pierre, bois) sans retour
    possible, tandis que le modelage permet de façonner une matière souple comme l''argile.'
- id: nblm-en-1960-cesar-presente-ses-premieres-com-2
  type: choix
  difficulte: 2
  enonce: En 1960, César présente ses premières « Compressions » à partir de carrosseries de voitures écrasées par une presse
    hydraulique. Que deviennent ces carrosseries ?
  reponse:
    options:
    - id: o1
      texte: Des blocs de métal.
    - id: o2
      texte: Des toiles peintes.
    - id: o3
      texte: Des sculptures en argile modélisée.
    - id: o4
      texte: Des moulages en plâtre liquide.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la forme physique que prend du métal industriel fortement compacté par une machine.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : les carrosseries métalliques compressées ne deviennent pas des toiles, qui sont des supports
      souples pour la peinture.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : César travaille à partir de véritables carrosseries industrielles en métal, pas avec de l''argile.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : il s''agit d''une déformation mécanique directe du métal par compression, et non d''une coulée
      dans un moule.'
  solution: 'Des blocs de métal. C''est exact : la puissance de la presse hydraulique compacte le métal des voitures jusqu''à
    former d''imposants blocs de métal.'
- id: nblm-a-partir-de-1958-lucio-fontana-fend-d-un-3
  type: choix
  difficulte: 2
  enonce: À partir de 1958, Lucio Fontana fend d'un coup de lame des toiles peintes d'une seule couleur. Que représente cette
    entaille ?
  reponse:
    options:
    - id: o1
      texte: Le sujet même de l'œuvre, qui ouvre la toile sur l'espace.
    - id: o2
      texte: Une déchirure accidentelle survenue lors du transport.
    - id: o3
      texte: Un moyen de préparer la toile avant d'y modeler de l'argile.
    - id: o4
      texte: Une technique d'empâtement pour ajouter de la peinture en relief.
    bonnes:
    - o1
  indices:
    relance: Pense à l'effet produit lorsqu'une lame traverse la surface plane de la peinture pour révéler ce qu'il y a derrière.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : l''entaille est un geste artistique délibéré et maîtrisé, non un accident involontaire.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la fente est l''acte final sur la peinture unicolore, Fontana n''y ajoute pas d''argile.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : l''empâtement consiste à superposer une couche épaisse de peinture, alors que la lame retire
      l''intégrité de la surface en la fendant.'
  solution: 'Le sujet même de l''œuvre, qui ouvre la toile sur l''espace. C''est exact : le geste de fendre la toile rompt
    la surface plane et fait de l''ouverture vers l''espace réel le sujet central de l''œuvre.'
- id: nblm-si-un-eleve-decide-de-froisser-ou-dechir-4
  type: choix
  difficulte: 2
  enonce: Si un élève décide de froisser ou déchirer le papier d'une grande feuille blanche, quelle transformation subit la
    matière ?
  reponse:
    options:
    - id: o1
      texte: La feuille se couvre de plis et de creux en gardant la trace du geste.
    - id: o2
      texte: Le papier redeviendra parfaitement lisse une fois accroché au mur.
    - id: o3
      texte: Cette action équivaut à tailler dans un bloc de pierre.
    - id: o4
      texte: Le papier perd toute réalité concrète et devient une image numérique.
    bonnes:
    - o1
  indices:
    relance: Considère le résultat visuel et tactile qu'abandonne l'action de la main sur la feuille.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : l''action de froisser ou déchirer altère la structure du papier de façon permanente.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le papier est un matériau souple travaillé par déformation ou déchirement, alors que la taille
      concerne l''enlèvement de matière dans un bloc dur.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : le papier froissé reste un objet physique doté d''une réalité concrète (texture, relief, épaisseur).'
  solution: 'La feuille se couvre de plis et de creux en gardant la trace du geste. C''est exact : le geste manuel transforme
    la surface lisse et plate en créant du relief, des ombres et la mémoire visible de l''action.'
- id: nblm-en-quoi-consiste-la-trace-du-geste-laiss-5
  type: choix
  difficulte: 2
  enonce: En quoi consiste la trace du geste laissée sur une matière transformée par l'artiste ?
  reponse:
    options:
    - id: o1
      texte: Elle témoigne de l'action physique de l'outil ou de la main et participe au sens de l'œuvre.
    - id: o2
      texte: C'est une erreur de débutant qu'il faut poncer ou effacer systématiquement.
    - id: o3
      texte: Elle n'apparaît que si l'on utilise la technique du moulage en bronze.
    - id: o4
      texte: Elle prouve que l'œuvre cherche uniquement à copier la réalité.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que nous apprend la marque visible de la main ou de l'outil sur la matière travaillée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la trace du geste est très souvent conservée intentionnellement par l''artiste pour son potentiel
      expressif.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la trace du geste s''observe dans la peinture, le travail du papier, le modelage ou la sculpture
      directe.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la trace du geste renvoie à l''acte de faire et à la matérialité de l''œuvre, non à l''imitation
      figurative du monde.'
  solution: 'Elle témoigne de l''action physique de l''outil ou de la main et participe au sens de l''œuvre. C''est exact
    : les marques, empreintes ou coulures laissées par le geste expriment l''énergie du créateur et donnent une signification
    particulière à la matière.'
- id: nblm-quelles-sont-les-deux-affirmations-vraie-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations vraies concernant la notion de transformation de la matière ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Le modelage de l'argile permet d'ajuster la forme en ajoutant, retirant ou poussant la matière molle.
    - id: o2
      texte: Tailler dans un bloc dur (pierre, bois) est une opération soustractive irréversible.
    - id: o3
      texte: Fendre une toile peinte détruit obligatoirement la démarche artistique de l'auteur.
    - id: o4
      texte: La trace du geste doit obligatoirement être cachée pour qu'une œuvre soit considérée comme réussie.
    bonnes:
    - o1
    - o2
  indices:
    relance: Choisis les deux options qui décrivent correctement les procédés du modelage et de la taille.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : des artistes comme Fontana ont fait du geste de fendre la toile le cœur de leur travail créatif.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la trace du geste apporte du relief, du rythme et du sens à l''œuvre.'
  solution: 'Le modelage de l''argile permet d''ajuster la forme en ajoutant, retirant ou poussant la matière molle ; Tailler
    dans un bloc dur (pierre, bois) est une opération soustractive irréversible. C''est juste : l''argile étant malléable,
    le plasticien peut retravailler la forme tant que la matière reste humide.'
