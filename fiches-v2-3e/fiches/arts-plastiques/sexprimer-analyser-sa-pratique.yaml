format: 2
notion: sexprimer-analyser-sa-pratique
version: 1
etat: verifiee
declencheurs:
- verbalisation
- présenter ma production à l'oral
- expliquer mes choix plastiques
- avis de mes camarades
- décrire ce que je vois
prerequis:
- 4e-sexprimer-analyser-sa-pratique
couverture: Couvre la description, l'analyse et l'interprétation d'une production ou d'une œuvre avec un vocabulaire précis,
  l'écoute des avis des autres et les liens avec les démarches d'artistes. Les exemples sont des productions d'élèves fictives.
essentiel: 'En arts plastiques, on apprend à parler de sa production, de celle des autres et des œuvres d''artistes. En classe,
  ce moment s''appelle souvent la verbalisation.


  On avance en plusieurs temps. Décrire : dire ce que l''on voit, sans juger (sujet, formes, couleurs, support, format). Analyser
  : expliquer comment c''est fait (cadrage, point de vue, composition, matière, geste) et quels effets cela produit. Interpréter
  : proposer un sens, en s''appuyant sur ce que l''on a observé. Enfin, donner un avis argumenté.


  Le vocabulaire plastique rend la parole précise : plan (gros plan, plan d''ensemble), cadrage, point de vue (plongée, contre-plongée),
  couleurs chaudes ou froides, contraste, texture, geste, support, médium.


  On relie son travail aux œuvres rencontrées et aux démarches d''artistes : « comme cet artiste, j''ai utilisé… ».


  On écoute les avis des autres, même contradictoires. Une remarque n''est pas une attaque : elle montre ce qu''un spectateur
  a perçu, et aide à vérifier si l''intention est lisible.


  On porte aussi un regard curieux sur toutes sortes d''images : fixes ou animées, anciennes ou numériques, d''ici ou d''ailleurs.

  '
methode:
- Décrire d'abord ce que l'on voit, sans juger.
- Analyser les moyens plastiques avec le mot juste (cadrage, point de vue, couleur, matière, geste) et dire leur effet.
- 'Interpréter : proposer un sens en s''appuyant sur les observations.'
- Relier à une œuvre ou à une démarche d'artiste connue.
- Écouter les avis, demander ce qui les a fait naître, puis décider si l'on garde ou si l'on modifie.
vocabulaire:
- terme: cadrage
  definition: le choix de ce qui est montré dans l'image et de ce qui est laissé en dehors
- terme: plongée
  definition: point de vue où l'on regarde le sujet d'en haut ; il paraît souvent plus petit ou plus fragile
- terme: contre-plongée
  definition: point de vue où l'on regarde le sujet d'en bas ; il paraît souvent plus grand ou plus puissant
- terme: interprétation
  definition: le sens que l'on propose pour une production, appuyé sur ce que l'on a observé
erreurs_frequentes:
- Donner un jugement (« c'est beau », « c'est raté ») à la place d'une description.
- Interpréter sans s'appuyer sur ce que l'on voit (« l'artiste était triste »).
- Employer des mots vagues (« le truc », « la couleur ») au lieu du vocabulaire plastique.
- Prendre une remarque d'un camarade comme une attaque au lieu de s'en servir.
- Confondre plongée et contre-plongée.
exemple:
  enonce: 'Production fictive : une photographie en noir et blanc montre une chaise d''écolier vide, prise d''en bas, au milieu
    d''une cour déserte. Présente-la en trois temps.'
  solution: 'Je décris : une chaise vide, au centre, dans une cour sans personne, en noir et blanc. J''analyse : la prise
    de vue en contre-plongée agrandit la chaise, et le cadrage large laisse beaucoup de vide autour d''elle. J''interprète
    : la chaise devient presque un monument, elle peut évoquer l''absence ou le silence après la sortie des classes.'
exercices:
- id: temps-de-lanalyse
  type: ordre
  difficulte: 1
  enonce: Range ces temps de l'analyse d'une production dans l'ordre.
  reponse:
    elements:
    - id: decrire
      texte: Dire ce que l'on voit, sans juger
    - id: analyser
      texte: Expliquer comment c'est fait et quels effets cela produit
    - id: interpreter
      texte: Proposer un sens, appuyé sur les observations
    - id: avis
      texte: Donner un avis argumenté
  indices:
    relance: Peut-on proposer un sens avant d'avoir bien regardé ?
    methode: Va du plus concret (ce qui est visible) au plus personnel (ce que tu en penses).
    etape: On commence par dire ce que l'on voit, et l'on finit par son avis. Range les deux temps du milieu.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux temps voisins sont inversés. Pour proposer un sens, n'a-t-on pas besoin de savoir d'abord comment c'est
      fait ?
  - si:
      diagnostic: ordre_faux
    relance: Pars de l'observation. Qu'est-ce qui ne demande que tes yeux, sans rien supposer ?
  solution: Décrire, puis analyser (comment et avec quel effet), puis interpréter (quel sens), et enfin donner un avis argumenté.
- id: phrase-de-description
  type: choix
  difficulte: 1
  enonce: 'Production fictive : un grand personnage peint en rouge vif sur un fond gris. Quelle phrase est une description,
    sans jugement ni interprétation ?'
  reponse:
    options:
    - id: a
      texte: Au centre, un grand personnage est peint en rouge vif sur un fond gris.
    - id: b
      texte: Le personnage semble en colère contre le monde.
    - id: c
      texte: C'est vraiment trop beau.
    - id: d
      texte: L'élève a voulu montrer sa tristesse.
    bonnes:
    - a
  indices:
    relance: Laquelle de ces phrases dirait n'importe quel observateur, quel que soit son avis ?
    methode: 'Une description dit seulement ce qui est visible : place, formes, couleurs. Elle ne suppose rien et ne juge
      pas.'
    etape: « Trop beau » est un jugement. « En colère » et « sa tristesse » supposent un sens. Il reste une phrase.
  pieges:
  - si:
      contient:
      - b
    relance: '« En colère » : est-ce que cela se voit, ou est-ce ce que tu imagines ? C''est déjà une interprétation.'
  - si:
      contient:
      - c
    relance: « Trop beau », c'est ton goût. Qu'est-ce qu'on voit, concrètement ?
  - si:
      contient:
      - d
    relance: 'Sais-tu ce que l''élève a voulu ? Cette phrase suppose une intention : c''est une interprétation.'
  solution: 'La description est « Au centre, un grand personnage est peint en rouge vif sur un fond gris. » (a) : elle dit
    seulement ce qui est visible. Les autres phrases interprètent ou jugent.'
- id: point-de-vue-den-bas
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le point de vue où l'on regarde le sujet d'en bas, ce qui le fait souvent paraître plus grand
    ou plus puissant ?
  reponse:
    acceptees:
    - contre-plongée
    - contreplongée
    fautes_tolerees: 1
  indices:
    relance: Si tu t'allonges par terre pour photographier un camarade debout, comment le vois-tu ?
    methode: Le point de vue d'en haut a un nom venu du plongeon. Celui d'en bas est son contraire.
    etape: 'C''est un mot composé : « contre- » suivi du nom du point de vue d''en haut.'
  pieges:
  - si:
      valeur: plongée
    relance: 'La plongée, c''est l''inverse : on regarde le sujet d''en haut. Et quand on le regarde d''en bas ?'
  - si:
      valeur: gros plan
    relance: Le gros plan parle de la taille du sujet dans l'image, pas de l'endroit d'où l'on regarde. On cherche un point
      de vue.
  solution: 'La contre-plongée : on regarde le sujet d''en bas, il paraît plus grand, plus imposant. Son contraire est la
    plongée.'
- id: procede-effet-image
  type: association
  difficulte: 2
  enonce: Relie chaque choix de prise de vue à l'effet qu'il produit le plus souvent.
  reponse:
    gauche:
    - id: a
      texte: Un gros plan sur un visage
    - id: b
      texte: Un plan d'ensemble sur une personne dans une rue
    - id: c
      texte: Une prise de vue en plongée sur une personne
    - id: d
      texte: Un cadrage qui coupe une partie du sujet au bord de l'image
    droite:
    - id: w
      texte: Isole un détail et rapproche le spectateur
    - id: x
      texte: Situe le sujet dans son environnement
    - id: y
      texte: Rend le sujet plus petit, plus fragile
    - id: z
      texte: Fait imaginer ce qui continue en dehors du cadre
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Plus on est près du sujet, que voit-on de ce qui l'entoure ?
    methode: 'Pour chaque choix, imagine la photo : qu''est-ce qu''on voit, et d''où la regarde-t-on ?'
    etape: Le gros plan montre de très près ; le plan d'ensemble montre aussi le décor. Continue avec les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Relis la prise de vue d''en haut : quel effet a-t-elle sur la taille apparente
      du sujet ?'
  - si:
      diagnostic: associations_fausses
    relance: Pars du gros plan, puis du plan d'ensemble, qui sont opposés, et place les deux autres.
  solution: 'Gros plan : isole un détail. Plan d''ensemble : situe dans l''environnement. Plongée : rend le sujet plus petit.
    Cadrage coupé : fait imaginer le hors-champ, ce qui continue en dehors du cadre.'
- id: accueillir-un-avis
  type: choix
  difficulte: 2
  enonce: 'Situation fictive : pendant la verbalisation, un camarade dit de ta peinture : « On ne comprend pas que c''est
    la nuit ». Quelle réaction est la plus adaptée ?'
  reponse:
    options:
    - id: a
      texte: Répondre que c'est ta production et que son avis ne compte pas
    - id: b
      texte: Lui demander ce qui lui donne cette impression, expliquer ton intention, puis te demander si un changement la
        rendrait plus lisible
    - id: c
      texte: Effacer toute ta peinture
    - id: d
      texte: Ne rien dire et ne rien en penser
    bonnes:
    - b
  indices:
    relance: Que t'apprend cette remarque sur ce qu'un spectateur perçoit de ta peinture ?
    methode: Écouter un avis, c'est chercher à le comprendre, puis décider soi-même si l'on garde ou si l'on modifie.
    etape: Écarte les réactions qui refusent d'écouter ou qui détruisent tout. Laquelle reste ?
  pieges:
  - si:
      contient:
      - a
    relance: C'est bien ta production, mais un spectateur te dit ce qu'il voit. Cela ne peut-il pas t'aider ?
  - si:
      contient:
      - c
    relance: Une remarque ne veut pas dire que tout est raté. Peut-on ajuster sans tout effacer ?
  - si:
      contient:
      - d
    relance: Se taire, c'est perdre une occasion. Que pourrais-tu lui demander ?
  solution: 'La réaction adaptée est b : comprendre la remarque, expliquer son intention, puis décider si un changement (couleurs
    plus sombres, une lune, des lumières de fenêtres) rendrait la nuit plus lisible.'
- id: presenter-une-production
  type: ouverte
  difficulte: 3
  enonce: 'Production fictive : un élève a photographié ses baskets usées en très gros plan, en contre-plongée, sur fond de
    ciel bleu. Présente cette production en trois temps (décrire, analyser, interpréter) avec au moins trois mots du vocabulaire
    plastique.'
  criteres:
  - L'élève décrit ce qui est visible sans juger (sujet, couleurs, fond).
  - L'élève analyse au moins deux choix (gros plan, contre-plongée, fond de ciel) avec leur effet, en employant le vocabulaire
    plastique.
  - L'élève propose une interprétation appuyée sur ses observations.
  indices:
    relance: D'où a été prise la photo, et à quelle distance des baskets ?
    methode: 'Fais trois parties : ce que l''on voit, comment c''est fait et avec quel effet, puis ce que cela peut vouloir
      dire.'
    etape: 'Tu peux commencer ainsi : « On voit une paire de baskets usées, qui occupe presque toute l''image, devant un ciel
      bleu… »'
  solution: 'Exemple de réponse : on voit une paire de baskets usées qui occupe presque toute l''image, devant un ciel bleu.
    Le très gros plan montre les détails de l''usure, et la contre-plongée rend les baskets immenses, comme un monument. Le
    ciel isole l''objet de tout décor. On peut interpréter la photo comme un hommage à un objet ordinaire, qui garde la trace
    de tous les pas de son propriétaire.'
