    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: support. Le support est le terme qui désigne l'élément physique recevant les matériaux ou médiums.
- id: association-champs
  type: association
  difficulte: 1
  enonce: Relie chaque production à son champ de pratique.
  reponse:
    gauche:
    - id: a
      texte: Un paysage pris avec un appareil
    - id: b
      texte: Un film de trente secondes
    - id: c
      texte: Une figure modelée en terre
    - id: d
      texte: Un portrait tracé à l'encre
    droite:
    - id: w
      texte: La photographie
    - id: x
      texte: La vidéo
    - id: y
      texte: La sculpture
    - id: z
      texte: Le dessin
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Pour chaque production, demande-toi avec quel outil ou quel moyen elle est faite.
    methode: Une image fixe prise avec un appareil, une image animée, un volume et une image à la main appartiennent à des
      champs différents.
    etape: La photographie utilise un appareil ; commence par elle, puis distingue le volume de l'image animée.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare l'image fixe et l'image animée.
  - si:
      diagnostic: associations_fausses
    relance: Commence par la production en volume, puis distingue les images.
  solution: 'Un paysage à l''appareil : photographie. Un film de trente secondes : vidéo. Une figure modelée en terre : sculpture.
    Un portrait à l''encre : dessin.'
