  type: texte_court
  difficulte: 1
  enonce: Le croisement de plusieurs techniques plastiques au sein d'une même œuvre, comme mélanger peinture et photo, s'appelle
    l'____.
  reponse:
    acceptees:
    - hybridation
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par un H muet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: hybridation. L'hybridation est le terme précis pour désigner le croisement de techniques ou médiums artistiques.
- id: nblm-la-surface-physique-feuille-carton-mur-e-8
  type: texte_court
  difficulte: 1
  enonce: La surface physique (feuille, carton, mur, écran) qui reçoit la production plastique s'appelle le ____.
  reponse:
