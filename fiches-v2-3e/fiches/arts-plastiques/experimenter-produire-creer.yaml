# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: experimenter-produire-creer
version: 2
etat: verifiee
declencheurs:
- essayer plusieurs techniques
- effet imprévu
- garder un accident
- mélanger peinture et photo
- tester des matériaux
- tester plusieurs techniques
prerequis:
- 4e-experimenter-produire-creer
essentiel: 'Expérimenter, c''est essayer des moyens plastiques (outils, matériaux, gestes, supports, médiums) pour voir quels
  effets ils produisent, avant de choisir ceux qui servent le mieux son intention. On teste, on observe, on compare.


  On reste attentif à l''inattendu : une tache, une coulure, un déchirement peuvent devenir une piste. Au lieu de les effacer,
  on se demande s''ils peuvent servir l''intention, et on peut apprendre à les reproduire exprès. L''accident fait partie
  de la démarche, comme chez Jackson Pollock qui laisse couler et projette la peinture sur une toile posée au sol (fin des
  années 1940).


  Le choix des moyens dépend de l''effet voulu. Frotter un crayon sur du relief fait apparaître une texture (le frottage,
  utilisé par Max Ernst dès 1925). Le pochoir répète une forme aux bords nets. Le collage rapproche des images d''origines
  différentes.


  Les champs de la pratique plastique sont variés : dessin, peinture, sculpture, photographie, vidéo, installation, création
  numérique. On peut les croiser dans une même production : c''est l''hybridation.


  Les outils numériques de captation (appareil photo, scanner, enregistreur de son, caméra) enregistrent une part du réel.
  Les outils de réalisation (logiciels de retouche, de montage, de dessin) la transforment.


  Des images et des documents (photos, reproductions d''œuvres, croquis) nourrissent un projet : on les consulte, on les choisit,
  on les transforme, sans les recopier tels quels. On cite ses sources.


  Enfin, on pense dès le départ à la présentation : au mur, sur un socle, au sol, sur un écran, en ligne. Le mode de présentation
  change la façon dont le spectateur voit la production. On peut aussi montrer une série d''essais ou une trace du processus.


  Ce que l''on attend : essayer plusieurs pistes, justifier ses choix plastiques et savoir dire ce que chaque moyen apporte.

  '
methode:
- 'Partir de l''intention : quel effet est-ce que je veux produire sur le spectateur ?'
- Faire plusieurs essais rapides avec des moyens différents (outil, geste, support, médium).
- Observer chaque essai, y compris les accidents, et noter ce qu'il produit.
- Choisir les moyens qui servent le mieux l'intention, et savoir dire pourquoi.
- Si besoin, croiser des pratiques (hybridation) ou utiliser le numérique pour capter ou transformer.
- 'Penser à la présentation : où, comment et à quelle distance la production sera regardée.'
vocabulaire:
- terme: support
  definition: la surface ou l'objet qui reçoit la production (feuille, toile, carton, mur, écran…)
- terme: médium
  definition: la matière ou le moyen utilisé pour produire (gouache, encre, fusain, photographie, vidéo…)
- terme: geste
  definition: la manière dont la main ou le corps agit sur la matière (frotter, projeter, gratter, étaler…)
- terme: hybridation
  definition: le croisement de plusieurs techniques ou champs artistiques dans une même production
- terme: captation
  definition: l'enregistrement d'une image ou d'un son du réel avec un appareil (photo, vidéo, scanner, micro)
erreurs_frequentes:
- Effacer ou jeter un essai raté sans regarder si l'accident produit un effet intéressant.
- Choisir une technique parce qu'on la maîtrise, et non pour l'effet qu'elle produit.
- Confondre le support (ce qui reçoit) et le médium (ce qui sert à produire).
- 'Oublier la présentation : une production posée à plat sur une table n''est pas vue comme au mur.'
- Recopier une image trouvée au lieu de s'en servir comme documentation.
exemple:
  enonce: 'Consigne fictive : « Rendre visible le vent ». Une élève hésite entre un dessin au crayon et d''autres moyens.
    Comment peut-elle expérimenter ?'
  solution: 'Elle fait plusieurs essais : souffler à la paille sur de l''encre, photographier des draps qui bougent avec un
    temps de pose long, déchirer du papier fin. Elle observe les effets : l''encre soufflée laisse des traces qui filent dans
    une direction, la photo floue montre le mouvement. Elle choisit l''encre soufflée, qui garde la trace du souffle, et décide
    de présenter ses essais en série au mur pour que le spectateur suive le mouvement.'
exercices:
- id: surface-qui-recoit
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la surface ou l'objet qui reçoit une production plastique (feuille, toile, carton, mur, écran…)
    ?
  reponse:
    acceptees:
    - support
    fautes_tolerees: 0
  indices:
    relance: Avant de peindre, sur quoi pose-t-on la couleur ?
    methode: Distingue ce qui sert à produire (la gouache, l'encre) et ce qui reçoit la production. On cherche le second.
    etape: C'est le même mot que pour l'objet sur lequel on pose quelque chose pour le tenir. Il commence par « sup… ».
  pieges:
  - si:
      valeur: médium
    relance: Le médium, c'est la matière qu'on utilise (gouache, encre…). On cherche ce qui la reçoit.
  - si:
      valeur: toile
    relance: La toile en est un exemple. Quel mot général regroupe la feuille, la toile, le carton et le mur ?
  solution: 'Le support : c''est la surface ou l''objet qui reçoit la production (feuille, toile, carton, mur, écran…).'
- id: outils-de-captation
  type: choix
  difficulte: 1
  enonce: Coche tous les outils qui permettent de capter, c'est-à-dire d'enregistrer, une image ou un son du réel.
  reponse:
    options:
    - id: a
      texte: L'appareil photo d'un téléphone
    - id: b
      texte: Un scanner
    - id: c
      texte: Un enregistreur de son
    - id: d
      texte: Un pinceau
    - id: e
      texte: Un tube de colle
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Lesquels de ces outils fabriquent une copie de ce qui existe devant eux ?
    methode: Pour chaque outil, demande-toi s'il enregistre quelque chose du réel, ou s'il sert seulement à poser ou à assembler
      de la matière.
    etape: Le pinceau pose de la peinture, il n'enregistre rien. Regarde maintenant les outils qui ont un capteur.
  pieges:
  - si:
      contient:
      - d
    relance: Avec un pinceau, on produit une image à la main. Est-ce qu'il enregistre ce qu'il y a devant lui ?
  - si:
      contient:
      - e
    relance: La colle sert à assembler. Enregistre-t-elle une image ou un son ?
  - si:
      diagnostic: incomplet
    relance: Il en manque. Pense aussi aux outils qui enregistrent un son, ou qui copient un document posé sur une vitre.
  solution: L'appareil photo, le scanner et l'enregistreur de son captent une image ou un son du réel. Le pinceau et la colle
    servent à produire ou à assembler, pas à capter.
- id: procede-et-effet
  type: association
  difficulte: 2
  enonce: Relie chaque procédé à l'effet qu'il produit le plus souvent.
  reponse:
    gauche:
    - id: a
      texte: Frotter un crayon sur une feuille posée sur une surface en relief (le frottage)
    - id: b
      texte: Laisser couler et projeter de la peinture sur une toile posée au sol
    - id: c
      texte: Passer de la peinture à travers une forme découpée (le pochoir)
    - id: d
      texte: Coller ensemble des morceaux d'images découpées dans des magazines
    droite:
    - id: w
      texte: Fait apparaître la texture d'une surface
    - id: x
      texte: Garde la trace du geste et laisse une place à l'inattendu
    - id: y
      texte: Répète une même forme aux bords nets
    - id: z
      texte: Rapproche des images d'origines différentes
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lequel de ces procédés fait apparaître ce qui est caché sous la feuille ?
    methode: 'Pour chaque procédé, imagine le résultat sur le papier : qu''est-ce qu''on voit apparaître ?'
    etape: Le frottage révèle le relief d'une planche, d'une feuille d'arbre. Avec le pochoir, on peut refaire la même forme
      autant de fois qu'on veut. Continue avec les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Relis le procédé des coulures : est-ce que l''artiste contrôle chaque trace
      ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Pars du plus sûr : quel procédé permet de refaire plusieurs fois exactement la même forme ?'
  solution: 'Frottage : fait apparaître la texture (Max Ernst l''utilise dès 1925). Coulures et projections : gardent la trace
    du geste et laissent place à l''inattendu (c''est le « dripping » de Jackson Pollock, à la fin des années 1940). Pochoir
    : répète une forme aux bords nets. Collage : rapproche des images d''origines différentes.'
- id: tache-inattendue
  type: choix
  difficulte: 2
  enonce: 'Situation fictive : Lina peint un ciel à l''encre. Une goutte d''eau tombe et l''encre s''étale en auréole. Coche
    les réactions d''une élève qui reste attentive à l''inattendu.'
  reponse:
    options:
    - id: a
      texte: Elle jette la feuille et recommence tout de suite
    - id: b
      texte: Elle observe l'effet et se demande s'il peut servir son intention
    - id: c
      texte: Elle cache la tache sous une couche de gouache
    - id: d
      texte: Elle refait l'effet exprès sur un autre essai pour apprendre à le maîtriser
    bonnes:
    - b
    - d
  indices:
    relance: Cet accident est-il forcément une erreur ? Qu'est-ce qu'il produit à regarder ?
    methode: Garde les réactions où Lina regarde l'accident et en tire quelque chose, et écarte celles où elle le fait disparaître.
    etape: Jeter la feuille ou recouvrir la tache, c'est effacer l'accident. Parmi les autres réactions, lesquelles l'exploitent
      ?
  pieges:
  - si:
      contient:
      - a
    relance: En jetant la feuille, Lina perd un effet qu'elle n'aurait peut-être pas trouvé seule. Que pourrait-elle en faire
      ?
  - si:
      contient:
      - c
    relance: Recouvrir la tache, c'est la faire disparaître. Est-ce rester attentive à l'inattendu ?
  - si:
      diagnostic: incomplet
    relance: 'Il y a une autre bonne réponse : un accident peut aussi devenir une technique qu''on apprend à reproduire.'
  solution: Lina observe l'effet et se demande s'il sert son intention (b), puis elle le refait exprès pour le maîtriser (d).
    Jeter la feuille ou cacher la tache, c'est perdre une piste.
- id: croiser-les-pratiques
  type: texte_court
  difficulte: 2
  enonce: Quand on croise plusieurs techniques ou champs artistiques dans une même production (par exemple de la peinture
    sur une photographie projetée en vidéo), comment appelle-t-on ce croisement ?
  reponse:
    acceptees:
    - hybridation
    - métissage
    fautes_tolerees: 1
  indices:
    relance: Comment appelle-t-on une voiture qui roule à la fois à l'essence et à l'électricité ?
    methode: Cherche le nom qui vient de l'adjectif « hybride ».
    etape: C'est un nom en « -ation », formé sur « hybride ».
  pieges:
  - si:
      valeur: collage
    relance: Le collage est une technique parmi d'autres. On cherche le mot qui désigne le mélange de plusieurs techniques
      ou champs.
  solution: 'L''hybridation (on dit aussi métissage) : plusieurs techniques ou champs artistiques sont croisés dans une même
    production.'
- id: justifier-ses-choix
  type: ouverte
  difficulte: 3
  enonce: 'Production fictive : un élève photographie au téléphone les ombres des feuilles d''un arbre sur un mur, imprime
    la photo en grand, puis peint à la gouache blanche par-dessus certaines ombres. Explique ce que chacun de ces moyens apporte,
    et propose une façon de présenter la production en justifiant ton choix.'
  criteres:
  - L'élève nomme au moins deux moyens plastiques (captation photo, impression, gouache, support) et l'effet de chacun.
  - L'élève relie ces choix à une intention possible (par exemple garder la trace d'un moment, jouer entre ombre et lumière).
  - L'élève propose une présentation précise (au mur, en série, projetée, à quelle taille) et explique ce qu'elle change pour
    le spectateur.
  indices:
    relance: Qu'est-ce que la photo garde que la peinture seule n'aurait pas gardé ?
    methode: Prends les moyens un par un (photo, impression en grand, gouache blanche) et dis pour chacun ce qu'il produit,
      puis choisis où et comment la montrer.
    etape: 'Tu peux commencer ainsi : « La photo capte un moment précis, car les ombres bougent avec le soleil… »'
  solution: 'Exemple de réponse : la photo capte un moment précis, car les ombres changent avec le soleil. L''impression en
    grand rend les formes des feuilles plus présentes. La gouache blanche recouvre certaines ombres et crée un jeu entre ce
    qui est capté et ce qui est peint. Je la présenterais au mur, à hauteur des yeux, à côté du mur d''origine photographié,
    pour que le spectateur compare l''ombre réelle et l''image transformée.'
- id: nblm-que-signifie-experimenter-en-arts-plasti-1
  type: choix
  difficulte: 2
  enonce: Que signifie « expérimenter » en arts plastiques avant de réaliser sa production finale ?
  reponse:
    options:
    - id: o1
      texte: Essayer différents outils, gestes, supports ou médiums pour observer leurs effets.
    - id: o2
      texte: Choisir immédiatement la seule technique que l'on maîtrise sans rien tenter d'autre.
    - id: o3
      texte: Recopier fidèlement une image trouvée sur Internet du premier coup.
    - id: o4
      texte: Effacer tous ses croquis d'essai pour ne conserver que la réalisation finale.
    bonnes:
    - o1
  indices:
    relance: Pense au fait de tester plusieurs moyens plastiques avant de fixer ses choix.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : choisir une technique uniquement par habitude empêche d''explorer des moyens plastiques
      plus adaptés à son projet.'
  - si:
      contient:
      - o3
    relance: Recopier une image n'est pas expérimenter ; la documentation doit nourrir le projet et être transformée, pas
      copiée à l'identique.
  - si:
      contient:
      - o4
    relance: Les croquis et essais préliminaires sont précieux pour analyser sa démarche et faire évoluer son travail.
  solution: 'Essayer différents outils, gestes, supports ou médiums pour observer leurs effets. C''est la définition exacte
    de l''expérimentation : tester plusieurs moyens plastiques pour observer les effets produits avant de choisir ceux qui
    répondent le mieux à son intention.'
- id: nblm-lors-d-un-essai-plastique-quelle-est-la-2
  type: choix
  difficulte: 2
  enonce: Lors d'un essai plastique, quelle est la bonne attitude face à un effet imprévu comme une coulure ou une tache ?
  reponse:
    options:
    - id: o1
      texte: Observer cet accident et se demander s'il peut servir son intention artistique.
    - id: o2
      texte: Jeter immédiatement sa feuille à la poubelle sans prendre le temps d'observer.
    - id: o3
      texte: Camoufler le problème à tout prix avec du blanc pour obtenir un dessin parfait.
    - id: o4
      texte: Recommencer exactement le même geste sans rien changer à sa méthode.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que l'inattendu peut devenir une piste de création.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : jeter un essai raté empêche de vérifier si l''accident produit un effet plastique
      intéressant.'
  - si:
      contient:
      - o3
    relance: Vouloir tout masquer empêche d'accueillir l'inattendu, qui est pourtant au cœur de la recherche artistique.
  - si:
      contient:
      - o4
    relance: Répéter l'action sans analyser l'effet obtenu fait perdre l'opportunité de découvrir une nouvelle technique.
  solution: Observer cet accident et se demander s'il peut servir son intention artistique. Un fait inattendu (tache, coulure,
    déchirure) peut devenir une nouvelle piste créative et enrichir le projet au lieu d'être rejeté.
- id: nblm-quelle-est-la-difference-fondamentale-en-3
  type: choix
  difficulte: 2
  enonce: Quelle est la différence fondamentale entre le support et le médium dans une production plastique ?
  reponse:
    options:
    - id: o1
      texte: Le support est la surface qui reçoit la production, tandis que le médium est la matière ou le moyen utilisé.
    - id: o2
      texte: Le support est la peinture liquide et le médium est la feuille de papier.
    - id: o3
      texte: Le support et le médium sont deux mots exactement synonymes.
    - id: o4
      texte: Le support concerne la vidéo et le médium concerne uniquement le crayon à papier.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui reçoit l'œuvre par rapport à la matière employée pour créer.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est l''inverse : la peinture est le médium (ce qui sert à produire) et le papier est le support (ce qui reçoit).'
  - si:
      contient:
      - o3
    relance: 'Attention à ne pas les confondre : l''un est la surface d''accueil, l''autre est le matériau ou moyen de création.'
  - si:
      contient:
      - o4
    relance: Ces deux termes s'appliquent à tous les champs plastiques, bidimensionnels comme tridimensionnels ou numériques.
  solution: Le support est la surface qui reçoit la production, tandis que le médium est la matière ou le moyen utilisé. Le
    support désigne la surface réceptrice (feuille, toile, mur, écran) et le médium désigne la matière ou le moyen créatif
    (gouache, encre, photo, vidéo).
- id: nblm-comment-appelle-t-on-le-croisement-de-pl-4
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on le croisement de plusieurs techniques ou champs artistiques (par exemple mélanger peinture
    et photographie) ?
  reponse:
    options:
    - id: o1
      texte: L'hybridation.
    - id: o2
      texte: La captation.
    - id: o3
      texte: La reproduction.
    - id: o4
      texte: La numérisation.
    bonnes:
    - o1
  indices:
    relance: Ce mot évoque le croisement et l'association de deux pratiques distinctes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La captation désigne l'enregistrement d'une image ou d'un son du réel avec un appareil (appareil photo, caméra,
      micro).
  - si:
      contient:
      - o3
    relance: La reproduction est la copie d'une œuvre existante, ce qui est différent du croisement créatif de techniques.
  - si:
      contient:
      - o4
    relance: La numérisation est la conversion d'un document physique en fichier informatique.
  solution: L'hybridation. L'hybridation est le terme plastique désignant le mélange et le croisement de différentes pratiques
    ou techniques dans une même production.
- id: nblm-pourquoi-l-eleve-doit-il-anticiper-la-pr-5
  type: choix
  difficulte: 2
  enonce: Pourquoi l'élève doit-il anticiper la présentation de sa réalisation dès le début de son projet ?
  reponse:
    options:
    - id: o1
      texte: Parce que le lieu, la hauteur et le mode d'exposition influencent la façon dont le spectateur perçoit l'œuvre.
    - id: o2
      texte: Parce que la présentation sert uniquement à masquer les hésitations du travail.
    - id: o3
      texte: Parce que le professeur impose une présentation identique pour l'ensemble de la classe.
    - id: o4
      texte: Parce que seuls les volumes en sculpture nécessitent d'être présentés.
    bonnes:
    - o1
  indices:
    relance: Pense à la relation entre l'objet plastique, l'espace d'exposition et le regard du spectateur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La mise en valeur et le dispositif d'exposition participent au sens de la création, ils ne cherchent pas à cacher
      le travail.
  - si:
      contient:
      - o3
    relance: Le choix de présentation fait partie de l'intention plastique personnelle de l'élève.
  - si:
      contient:
      - o4
    relance: Toutes les formes de pratiques plastiques (dessin, peinture, photo, vidéo, installation) requièrent un choix
      de présentation.
  solution: Parce que le lieu, la hauteur et le mode d'exposition influencent la façon dont le spectateur perçoit l'œuvre.
    Une production au mur, sur un socle, au sol, suspendue ou sur un écran crée un rapport spatial précis avec le spectateur.
- id: nblm-concernant-l-usage-du-numerique-dans-la-6
  type: choix
  difficulte: 3
  enonce: Concernant l'usage du numérique dans la création plastique, quelles sont les DEUX affirmations exactes ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Les outils de captation (appareil photo, scanner) enregistrent une part du réel.
    - id: o2
      texte: Les outils de réalisation (logiciels de retouche, de montage) permettent de transformer le réel capté.
    - id: o3
      texte: L'ordinateur réalise l'œuvre tout seul sans aucune intention de l'auteur.
    - id: o4
      texte: Le numérique empêche tout mélange avec les médiums traditionnels comme la peinture.
    bonnes:
    - o1
    - o2
  indices:
    relance: Distingue l'action de capter le réel de celle de le transformer.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est une erreur classique : l''outil informatique reste au service des choix et de la démarche de l''élève.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : on peut tout à fait croiser des pratiques numériques et matérielles (hybridation).'
  solution: 'Les outils de captation (appareil photo, scanner) enregistrent une part du réel ; Les outils de réalisation (logiciels
    de retouche, de montage) permettent de transformer le réel capté. C''est exact : les appareils de captation saisissent
    des données visuelles ou sonores issues du réel.'
