# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: narration-visuelle
version: 3
etat: verifiee
declencheurs:
- raconter une histoire en images
- bande dessinée
- roman-photo
- storyboard
- stop motion
- saut dans le temps
- case de bande dessinée
- faire un film d'animation
- Muybridge cheval
prerequis:
- 4e-narration-visuelle
essentiel: 'Les images peuvent raconter. Une seule image peut suggérer un mouvement ou un temps : flou, lignes de vitesse,
  personnage en déséquilibre, moment choisi juste avant l''action. Dans Nu descendant un escalier n° 2 (1912, huile sur toile),
  Marcel Duchamp décompose un mouvement en plusieurs positions superposées.


  Plusieurs images mises en suite forment un dispositif séquentiel : bande dessinée, roman-photo, storyboard, film d''animation.
  La Tapisserie de Bayeux (fin du XIe siècle), une broderie de laine sur toile de lin d''environ 70 mètres de long, raconte
  déjà, scène après scène, la conquête de l''Angleterre par Guillaume de Normandie en 1066.


  En 1878, Eadweard Muybridge photographie un cheval au galop avec une série d''appareils déclenchés l''un après l''autre
  : la séquence montre des étapes du mouvement que l''œil ne peut pas voir. On parle de chronophotographie.


  Le mouvement peut être suggéré (image fixe) ou réel (vidéo, animation, objet qui bouge). Une animation est une suite d''images
  fixes : à 12 images par seconde, il faut 12 images pour une seconde.


  Pour raconter, on découpe l''histoire en moments (le découpage), puis on choisit l''ordre et l''enchaînement des images
  (le montage). L''ellipse est un saut dans le temps : on ne montre pas un moment, le spectateur le devine.


  Il faut distinguer deux durées : la durée de l''histoire (des années, une journée) et la durée du récit (le temps qu''on
  met à lire ou à regarder). Une ellipse permet de faire tenir de longues années en une case ou en un plan.


  Le rythme dépend du nombre d''images, de leur taille et de leur durée : beaucoup de petites cases ou de plans courts accélèrent
  ; une grande image ou un plan long ralentissent et installent la durée. La vitesse d''un mouvement peut aussi se suggérer
  par des lignes ou un flou.


  Au brevet, on attend que tu repères le dispositif (image seule ou séquence), le découpage, le montage, les ellipses et le
  rythme, puis que tu dises l''effet produit sur le spectateur.

  '
methode:
- Repérer si le mouvement est suggéré (image fixe) ou réel (image animée, objet qui bouge).
- Découper l'histoire en moments clés, puis choisir lesquels montrer.
- Choisir l'ordre et l'enchaînement des images (le montage), et les moments à sauter (les ellipses).
- 'Jouer sur le rythme : taille, nombre et durée des images.'
- Vérifier qu'un spectateur peut suivre le récit sans explication.
vocabulaire:
- terme: séquence
  definition: suite d'images qui raconte un moment ou une action
- terme: découpage
  definition: division d'une histoire en moments ou en images successives
- terme: montage
  definition: le choix de l'ordre et de l'enchaînement des images ou des plans
- terme: ellipse
  definition: 'saut dans le temps : un moment n''est pas montré, le spectateur le devine'
- terme: chronophotographie
  definition: série de photographies prises à intervalles rapprochés pour décomposer un mouvement
- terme: cadrage
  definition: 'ce que l''image montre et laisse hors du cadre : gros plan, plan large…'
- terme: storyboard
  definition: suite de dessins qui prévoit les images clés d'un film ou d'une animation
- terme: durée du récit
  definition: le temps qu'on met à lire ou à regarder l'histoire, différent du temps de l'histoire
erreurs_frequentes:
- Croire qu'une image fixe ne peut pas montrer de mouvement.
- 'Vouloir tout montrer : sans ellipse, le récit devient long et lent.'
- Confondre découpage (diviser l'histoire en moments) et montage (ordonner et enchaîner les images).
- 'Négliger le rythme : toutes les cases de la même taille donnent souvent un récit monotone.'
- Oublier qu'une séquence doit rester lisible pour le spectateur.
exemple:
  enonce: 'Production fictive : trois cases. Case 1 : un garçon plante une graine. Case 2 : il arrose un tout petit pot. Case
    3 : il se repose à l''ombre d''un grand arbre. Quel procédé temporel est utilisé entre la case 2 et la case 3 ?'
  solution: 'Une ellipse : des années passent entre la case 2 et la case 3, mais on ne les montre pas. Le spectateur comprend
    que la graine est devenue un grand arbre. L''ellipse rend le récit rapide et laisse le spectateur imaginer le temps écoulé.'
exercices:
- id: image-encadree
  type: texte_court
  difficulte: 1
  enonce: Dans une bande dessinée, comment appelle-t-on chaque image encadrée ?
  reponse:
    acceptees:
    - case
    - vignette
    fautes_tolerees: 0
  indices:
    relance: Sur une page de BD, chaque image est entourée d'un cadre. Comment dit-on ?
    methode: C'est le même mot que pour chaque carré d'un jeu de marelle ou d'un damier.
    etape: C'est un mot court de quatre lettres, qui commence par « c ».
  pieges:
  - si:
      valeur: planche
    relance: La planche, c'est la page entière. On cherche le nom de chaque image encadrée.
  - si:
      valeur: bulle
    relance: La bulle contient les paroles des personnages. On cherche le nom de l'image encadrée.
  solution: 'Une case (on dit aussi une vignette) : chaque image encadrée d''une bande dessinée. La page entière s''appelle
    une planche.'
- id: remettre-en-ordre
  type: ordre
  difficulte: 1
  enonce: Roman-photo fictif en quatre images. Range-les dans l'ordre du récit.
  reponse:
    elements:
    - id: soleil
      texte: Sous un ciel bleu, un garçon étend du linge
    - id: nuages
      texte: De gros nuages noirs arrivent au-dessus du jardin
    - id: pluie
      texte: La pluie tombe et le vent fait s'envoler le linge
    - id: boue
      texte: Le garçon ramasse le linge trempé dans la boue
  indices:
    relance: 'Comment commence l''histoire : par le beau temps ou par la tempête ?'
    methode: 'Cherche la cause et la conséquence : qu''est-ce qui doit arriver avant que le linge ne s''envole ?'
    etape: Le récit commence au soleil et finit dans la boue. Range les deux images du milieu.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux images voisines sont inversées. Les nuages arrivent-ils avant ou après la pluie ?
  - si:
      diagnostic: ordre_faux
    relance: Repère la situation de départ, calme, et la situation finale, puis range les autres entre elles.
  solution: Ciel bleu et linge étendu, arrivée des nuages, pluie et linge qui s'envole, linge ramassé dans la boue.
- id: saut-dans-le-temps
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le procédé qui consiste à ne pas montrer un moment de l'histoire, en laissant le spectateur
    deviner le temps écoulé ?
  reponse:
    acceptees:
    - ellipse
    - ellipse temporelle
    fautes_tolerees: 0
  indices:
    relance: Dans un film, on voit un personnage enfant, puis adulte dans le plan suivant. Qu'a-t-on fait avec les années
      entre les deux ?
    methode: Cherche le mot qui désigne un manque volontaire dans le récit, un « trou » dans le temps.
    etape: C'est aussi le nom d'une figure géométrique en forme d'ovale. Il commence par « e ».
  pieges:
  - si:
      valeur: hors-champ
    relance: Le hors-champ est ce qui est hors du cadre, dans l'espace. On cherche un saut dans le temps.
  - si:
      valeur: montage
    relance: Le montage enchaîne les images. On cherche le nom du moment qu'on choisit de ne pas montrer.
  solution: 'Une ellipse : un moment n''est pas montré, le spectateur devine le temps écoulé.'
- id: procede-et-temps
  type: association
  difficulte: 2
  enonce: Relie chaque procédé à son effet sur le temps ou le mouvement.
  reponse:
    gauche:
    - id: a
      texte: Un flou de bougé sur une photographie fixe
    - id: b
      texte: Une série de photographies prises à intervalles très rapprochés
    - id: c
      texte: Une grande case panoramique, ou un plan long et fixe
    - id: d
      texte: Une suite de petites cases, ou de plans très courts
    droite:
    - id: w
      texte: Suggère la vitesse dans une image unique
    - id: x
      texte: Décompose un mouvement trop rapide pour l'œil
    - id: y
      texte: Ralentit le récit et installe la durée
    - id: z
      texte: Accélère le rythme du récit
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lesquels de ces procédés utilisent une seule image, et lesquels plusieurs ?
    methode: 'Pour les deux derniers, compare : que ressens-tu devant une grande image calme, et devant une rafale d''images
      courtes ?'
    etape: Le flou est dans une seule image. La série de photos rapprochées est la méthode de Muybridge. Place les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Des images nombreuses et courtes, est-ce plutôt rapide ou lent ?
  - si:
      diagnostic: associations_fausses
    relance: Pars du procédé qui ne compte qu'une seule image, puis de celui qui en compte le plus.
  solution: 'Flou de bougé : suggère la vitesse dans une image fixe. Série de photos rapprochées (chronophotographie) : décompose
    un mouvement. Grande case ou plan long : ralentit et installe la durée. Petites cases ou plans courts : accélèrent le
    rythme.'
- id: muybridge-galop
  type: choix
  difficulte: 2
  enonce: En 1878, Eadweard Muybridge photographie un cheval au galop avec une série d'appareils déclenchés l'un après l'autre.
    Qu'a montré cette séquence ?
  reponse:
    options:
    - id: a
      texte: À un moment du galop, le cheval a les quatre sabots en l'air, repliés sous le corps
    - id: b
      texte: Au galop, le cheval a toujours au moins un sabot posé sur le sol
    - id: c
      texte: Le cheval galope les pattes tendues à la fois vers l'avant et vers l'arrière
    bonnes:
    - a
  indices:
    relance: Pourquoi fallait-il des photographies pour répondre à cette question ? Que ne voit pas l'œil ?
    methode: La séquence décompose un mouvement trop rapide. Cherche la réponse qui décrit une position surprenante, que l'on
      ne voyait pas avant.
    etape: Pendant longtemps, les peintres ont représenté le cheval au galop les pattes étendues, « ventre à terre ». Les
      photos ont contredit cette image. Quelle réponse reste ?
  pieges:
  - si:
      contient:
      - b
    relance: C'était justement la question débattue. Sur certaines photos de la série, le cheval touche-t-il le sol ?
  - si:
      contient:
      - c
    relance: C'est la position que l'on voyait dans beaucoup de tableaux avant 1878. Les photos l'ont-elles confirmée ?
  solution: La séquence de Muybridge a montré qu'à un moment du galop, le cheval a les quatre sabots en l'air, repliés sous
    le corps (a), et non tendus vers l'avant et l'arrière comme dans beaucoup de tableaux.
- id: raconter-en-quatre-images
  type: ouverte
  difficulte: 3
  enonce: 'Prépare le découpage d''une histoire en quatre images : « un élève attend le bus sous la pluie ». Décris chaque
    image en une phrase (cadrage, point de vue), place au moins une ellipse, et explique le rythme que tu donnes au récit.'
  criteres:
  - L'élève décrit quatre images ordonnées et lisibles, en précisant au moins deux cadrages ou points de vue.
  - L'élève place une ellipse et explique ce que le spectateur doit deviner.
  - L'élève justifie le rythme choisi (taille, nombre ou durée des images) par l'effet recherché.
  indices:
    relance: Quel est le moment le plus important de cette histoire, celui qu'il faut absolument montrer ?
    methode: Choisis un début, un moment fort et une fin, puis décide quel moment tu sautes et comment tu varies la taille
      des images.
    etape: 'Tu peux commencer ainsi : « Image 1 : plan d''ensemble de l''arrêt de bus sous la pluie, l''élève est seul… »'
  solution: 'Exemple de réponse. Image 1 : plan d''ensemble de l''arrêt sous la pluie, l''élève est seul. Image 2 : gros plan
    sur sa montre. Image 3 : le bus passe sans s''arrêter, en plongée, avec un flou de vitesse. Image 4 : l''élève arrive
    trempé au collège. L''ellipse, entre les images 3 et 4, cache le trajet à pied : le spectateur le devine. Les trois premières
    images sont petites, pour montrer l''attente qui s''étire ; la dernière est grande, pour la chute comique.'
- id: nblm-en-narration-visuelle-comment-appelle-t-1
  type: choix
  difficulte: 2
  enonce: En narration visuelle, comment appelle-t-on le procédé qui consiste à faire un saut dans le temps en ne montrant
    pas un moment de l'histoire, que le spectateur doit deviner ?
  reponse:
    options:
    - id: o1
      texte: L'ellipse
    - id: o2
      texte: Le montage
    - id: o3
      texte: Le découpage
    - id: o4
      texte: Le cadrage
    bonnes:
    - o1
  indices:
    relance: Réfléchis au terme plastique et littéraire qui désigne l'omission volontaire d'un passage temporel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : le montage désigne le choix de l''ordre et de l''enchaînement des images, pas le fait de sauter
      un moment.'
  - si:
      contient:
      - o3
    relance: 'Attention : le découpage consiste à diviser une histoire en moments ou images successives, et non à sauter un
      temps.'
  - si:
      contient:
      - o4
    relance: 'Attention : le cadrage concerne le choix de ce qui est montré dans l''image (champ/hors-champ), pas la gestion
      du temps.'
  solution: 'L''ellipse. C''est exact : l''ellipse est un saut dans le temps où un moment non montré est deviné par le spectateur
    pour dynamiser le récit.'
- id: nblm-quel-terme-designe-un-ensemble-de-plusie-2
  type: choix
  difficulte: 2
  enonce: Quel terme désigne un ensemble de plusieurs images mises à la suite pour forming un récit séquentiel, comme dans
    une bande dessinée, un roman-photo ou un storyboard ?
  reponse:
    options:
    - id: o1
      texte: Une séquence
    - id: o2
      texte: Une chronophotographie
    - id: o3
      texte: Une anamorphose
    - id: o4
      texte: Une contre-plongée
    bonnes:
    - o1
  indices:
    relance: Pense au mot qui qualifie une suite ordonnée d'images ou de plans racontant une scène.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : la chronophotographie décompose scientifiquement un mouvement rapide, ce n''est pas le terme général
      pour une suite d''images narratives.'
  - si:
      contient:
      - o3
    relance: 'Attention : l''anamorphose est une image déformée qui se lit d''un point de vue précis, sans lien avec le récit
      séquentiel.'
  - si:
      contient:
      - o4
    relance: 'Attention : la contre-plongée est un angle de prise de vue du bas vers le haut, et non une suite d''images.'
  solution: 'Une séquence. C''est exact : une séquence est une suite d''images qui raconte un moment ou une action dans un
    dispositif séquentiel.'
- id: nblm-si-un-auteur-de-bande-dessinee-souhaite-3
  type: choix
  difficulte: 2
  enonce: Si un auteur de bande dessinée souhaite accélérer le rythme de sa narration visuelle dans une scène d'action, que
    doit-il privilégier ?
  reponse:
    options:
    - id: o1
      texte: Utiliser un grand nombre de petites cases ou de plans courts
    - id: o2
      texte: Dessiner une seule grande case occupant toute la page
    - id: o3
      texte: Supprimer toutes les ellipses narratives entre les actions
    - id: o4
      texte: Garder des cases de taille strictement identique tout au long du récit
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'effet de la taille et du nombre d'images sur la rapidité de la lecture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : une grande image ou un plan long ralentissent la narration et installent la durée.'
  - si:
      contient:
      - o3
    relance: 'Attention : vouloir tout montrer sans ellipse rend le récit long et lent au lieu d''accélérer le rythme.'
  - si:
      contient:
      - o4
    relance: 'Attention : conserver des cases toujours de même taille donne souvent un récit monotone.'
  solution: 'Utiliser un grand nombre de petites cases ou de plans courts. C''est exact : multiplier les petites cases ou
    les plans courts donne une impression de vitesse et accélère le rythme.'
- id: nblm-quelle-est-la-difference-fondamentale-en-4
  type: choix
  difficulte: 2
  enonce: Quelle est la différence fondamentale entre le découpage et le montage dans la création d'un récit en images comme
    un storyboard ?
  reponse:
    options:
    - id: o1
      texte: Le découpage divise l'histoire en moments clés, tandis que le montage choisit l'ordre et l'enchaînement des images
    - id: o2
      texte: Le découpage s'occupe des couleurs et le montage gère la taille du support
    - id: o3
      texte: Le découpage s'applique seulement à la BD et le montage uniquement à la peinture
    - id: o4
      texte: Le découpage consiste à effacer des images et le montage à les redessiner
    bonnes:
    - o1
  indices:
    relance: L'un sépare l'action en étapes, l'autre les réunit et les enchaîne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : découpage et montage concernent la structure narrative et temporelle, pas la couleur ou le support.'
  - si:
      contient:
      - o3
    relance: 'Attention : ces deux notions s''appliquent à tous les dispositifs séquentiels (BD, storyboard, cinéma, roman-photo).'
  - si:
      contient:
      - o4
    relance: 'Attention : ce sont des étapes d''organisation du récit, pas des opérations de dessin ou de nettoyage.'
  solution: 'Le découpage divise l''histoire en moments clés, tandis que le montage choisit l''ordre et l''enchaînement des
    images. C''est exact : le découpage consiste à fractionner le récit en étapes, et le montage à les ordonner et les enchaîner.'
- id: nblm-dans-l-uvre-nu-descendant-un-escalier-n-5
  type: choix
  difficulte: 2
  enonce: Dans l'œuvre Nu descendant un escalier n° 2 (1912) de Marcel Duchamp, quel moyen plastique est utilisé pour raconter
    et suggérer le mouvement sur une image fixe ?
  reponse:
    options:
    - id: o1
      texte: La décomposition du mouvement en plusieurs positions superposées
    - id: o2
      texte: L'utilisation d'un moteur électrique placé derrière la toile
    - id: o3
      texte: La projection d'une vidéo animée directement sur la peinture
    - id: o4
      texte: L'alignement de vingt cases séparées comme dans une bande dessinée
    bonnes:
    - o1
  indices:
    relance: Observe la façon dont l'artiste répète et chevauche la silhouette du personnage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : il s''agit d''une peinture fixe à l''huile sur toile, sans mécanisme motorisé.'
  - si:
      contient:
      - o3
    relance: 'Attention : c''est un tableau de 1912 réalisé en peinture à l''huile, sans technologie vidéo.'
  - si:
      contient:
      - o4
    relance: 'Attention : l''œuvre est une peinture unique où les positions sont superposées, et non une suite de cases.'
  solution: 'La décomposition du mouvement en plusieurs positions superposées. C''est exact : Marcel Duchamp superpose plusieurs
    positions successives du corps pour suggérer son déplacement sur la toile.'
- id: nblm-quels-sont-les-deux-procedes-ou-disposit-6
  type: choix
  difficulte: 3
  enonce: Quels sont les DEUX procédés ou dispositifs qui permettent de raconter une histoire en images à travers une suite
    d'images fixes ou animées ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le roman-photo
    - id: o2
      texte: Le stop motion
    - id: o3
      texte: L'outrenoir
    - id: o4
      texte: Le ready-made
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne deux techniques basées sur la succession d'images (photographiées ou dessinées).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Attention : l''outrenoir désigne le travail de Pierre Soulages sur la lumière du noir en peinture abstraite,
      sans démarche narrative.'
  - si:
      contient:
      - o4
    relance: 'Attention : le ready-made est l''exposition d''un objet manufacturé choisi par l''artiste, et non un récit séquentiel
      en images.'
  solution: 'Le roman-photo ; Le stop motion. C''est exact : le roman-photo est un dispositif séquentiel qui utilise une suite
    de photographies pour raconter une histoire.'
- id: nblm-quelle-technique-d-animation-consiste-a-7
  type: texte_court
  difficulte: 1
  enonce: Quelle technique d'animation consiste à photographier un objet ou un dessin image par image en le déplaçant légèrement
    à chaque fois pour raconter une histoire ?
  reponse:
    acceptees:
    - stop motion
    fautes_tolerees: 1
  indices:
    relance: Terme anglais de deux mots signifiant « arrêt » et « mouvement ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'stop motion. C''est exact : le stop motion (ou animation image par image) permet d''animer des objets ou de la
    pâte à modeler en les photographiant étape par étape.'
- id: nblm-dans-une-bande-dessinee-ou-la-case-1-mon-8
  type: texte_court
  difficulte: 1
  enonce: Dans une bande dessinée où la case 1 montre la plantation d'une graine et la case 2 le personnage à l'ombre d'un
    grand arbre, quelle figure narrative correspond à ce saut dans le temps ?
  reponse:
    acceptees:
    - ellipse
    fautes_tolerees: 1
  indices:
    relance: Mot féminin commençant par 'E' qui désigne l'omission d'un moment dans le récit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'ellipse. C''est exact : l''ellipse est l''omission du temps de pousse de l''arbre, ce qui permet un saut temporel
    direct que le lecteur devine.'
- id: bayeux-recit
  type: choix
  difficulte: 2
  enonce: La Tapisserie de Bayeux (fin du XIe siècle) est une broderie de laine d'environ 70 mètres de long. Quelle histoire
    raconte-t-elle, scène après scène ?
  reponse:
    options:
    - id: a
      texte: La conquête de l'Angleterre par Guillaume de Normandie en 1066
    - id: b
      texte: La construction d'une cathédrale gothique
    - id: c
      texte: Le voyage d'un explorateur autour du monde
    - id: d
      texte: Le règne de Louis XIV
    bonnes:
    - a
  indices:
    relance: Une histoire y est racontée en suite de scènes brodées, comme une bande dessinée avant l'heure. Quel événement
      de 1066 est représenté ?
    methode: Cherche dans ta leçon la date 1066 et le nom du chef normand.
    etape: 'Élimine les réponses qui ne correspondent pas à une conquête du XIe siècle : le règne de Louis XIV est bien plus
      tardif.'
  pieges:
  - si:
      contient:
      - b
    relance: Aucune cathédrale gothique ici. Cherche l'événement lié à 1066.
  - si:
      contient:
      - c
    relance: Ce n'est pas un voyage autour du monde. Il s'agit d'une conquête militaire.
  - si:
      contient:
      - d
    relance: Louis XIV règne au XVIIe siècle, la tapisserie date de la fin du XIe siècle.
  solution: 'La Tapisserie de Bayeux raconte, scène après scène, la conquête de l''Angleterre par Guillaume de Normandie en
    1066 : c''est un récit en séquence.'
- id: mot-chronophotographie
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on une série de photographies prises à intervalles très rapprochés pour décomposer un mouvement,
    comme celle du cheval par Muybridge ?
  reponse:
    acceptees:
    - chronophotographie
    - la chronophotographie
    - chronophotographies
    fautes_tolerees: 2
  indices:
    relance: Le mot est composé de « chrono » (le temps) et de « photographie ». Que décompose-t-on ?
    methode: Ce procédé, inventé à la fin du XIXe siècle, permet de voir ce que l'œil ne distingue pas.
    etape: Le mot commence par « chrono- » et finit par « -photographie ».
  pieges:
  - si:
      valeur: ellipse
    relance: L'ellipse est un saut dans le temps dans un récit. Ici, on demande le procédé photographique.
  - si:
      valeur: montage
    relance: Le montage ordonne des images. Ici, ce sont des photos prises très vite l'une après l'autre.
  - si:
      diagnostic: mauvaise_reponse
    relance: Associe « chrono » (temps) et « photographie ».
  solution: 'C''est la chronophotographie : une série de photographies rapprochées dans le temps qui décompose un mouvement.'
