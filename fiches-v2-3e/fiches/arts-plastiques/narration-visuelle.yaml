format: 2
notion: narration-visuelle
version: 1
etat: verifiee
declencheurs:
- raconter une histoire en images
- bande dessinée
- roman-photo
- storyboard
- stop motion
- saut dans le temps
prerequis:
- 4e-narration-visuelle
couverture: Couvre le mouvement et le temps suggérés ou réels, le dispositif séquentiel, la durée, la vitesse, le rythme,
  le montage, le découpage et l'ellipse. Le cinéma n'est abordé qu'à travers ces notions.
essentiel: 'Les images peuvent raconter. Une seule image peut suggérer un mouvement ou un temps : flou, lignes de vitesse,
  personnage en déséquilibre, moment choisi juste avant l''action. Dans Nu descendant un escalier n° 2 (1912, huile sur toile),
  Marcel Duchamp décompose un mouvement en plusieurs positions superposées.


  Plusieurs images mises en suite forment un dispositif séquentiel : bande dessinée, roman-photo, storyboard, film d''animation.
  La Tapisserie de Bayeux (fin du XIe siècle), une broderie de laine sur toile de lin d''environ 70 mètres de long, raconte
  déjà, scène après scène, la conquête de l''Angleterre par Guillaume de Normandie en 1066.


  En 1878, Eadweard Muybridge photographie un cheval au galop avec une série d''appareils déclenchés l''un après l''autre
  : la séquence montre des étapes du mouvement que l''œil ne peut pas voir.


  Le mouvement peut être suggéré (image fixe) ou réel (vidéo, animation, objet qui bouge).


  Pour raconter, on découpe l''histoire en moments (le découpage), puis on choisit l''ordre et l''enchaînement des images
  (le montage). L''ellipse est un saut dans le temps : on ne montre pas un moment, le spectateur le devine.


  Le rythme dépend du nombre d''images, de leur taille et de leur durée : beaucoup de petites cases ou de plans courts accélèrent
  ; une grande image ou un plan long ralentissent et installent la durée.

  '
methode:
- Repérer si le mouvement est suggéré (image fixe) ou réel (image animée, objet qui bouge).
- Découper l'histoire en moments clés, puis choisir lesquels montrer.
- Choisir l'ordre et l'enchaînement des images (le montage), et les moments à sauter (les ellipses).
- 'Jouer sur le rythme : taille, nombre et durée des images.'
- Vérifier qu'un spectateur peut suivre le récit sans explication.
vocabulaire:
- terme: séquence
  definition: suite d'images qui raconte un moment ou une action
- terme: découpage
  definition: division d'une histoire en moments ou en images successives
- terme: montage
  definition: le choix de l'ordre et de l'enchaînement des images ou des plans
- terme: ellipse
  definition: 'saut dans le temps : un moment n''est pas montré, le spectateur le devine'
- terme: chronophotographie
  definition: série de photographies prises à intervalles rapprochés pour décomposer un mouvement
erreurs_frequentes:
- Croire qu'une image fixe ne peut pas montrer de mouvement.
- 'Vouloir tout montrer : sans ellipse, le récit devient long et lent.'
- Confondre découpage (diviser l'histoire en moments) et montage (ordonner et enchaîner les images).
- 'Négliger le rythme : toutes les cases de la même taille donnent souvent un récit monotone.'
- Oublier qu'une séquence doit rester lisible pour le spectateur.
exemple:
  enonce: 'Production fictive : trois cases. Case 1 : un garçon plante une graine. Case 2 : il arrose un tout petit pot. Case
    3 : il se repose à l''ombre d''un grand arbre. Quel procédé temporel est utilisé entre la case 2 et la case 3 ?'
  solution: 'Une ellipse : des années passent entre la case 2 et la case 3, mais on ne les montre pas. Le spectateur comprend
    que la graine est devenue un grand arbre. L''ellipse rend le récit rapide et laisse le spectateur imaginer le temps écoulé.'
exercices:
- id: image-encadree
  type: texte_court
  difficulte: 1
  enonce: Dans une bande dessinée, comment appelle-t-on chaque image encadrée ?
  reponse:
    acceptees:
    - case
    - vignette
    fautes_tolerees: 0
  indices:
    relance: Sur une page de BD, chaque image est entourée d'un cadre. Comment dit-on ?
    methode: C'est le même mot que pour chaque carré d'un jeu de marelle ou d'un damier.
    etape: C'est un mot court de quatre lettres, qui commence par « c ».
  pieges:
  - si:
      valeur: planche
    relance: La planche, c'est la page entière. On cherche le nom de chaque image encadrée.
  - si:
      valeur: bulle
    relance: La bulle contient les paroles des personnages. On cherche le nom de l'image encadrée.
  solution: 'Une case (on dit aussi une vignette) : chaque image encadrée d''une bande dessinée. La page entière s''appelle
    une planche.'
- id: remettre-en-ordre
  type: ordre
  difficulte: 1
  enonce: Roman-photo fictif en quatre images. Range-les dans l'ordre du récit.
  reponse:
    elements:
    - id: soleil
      texte: Sous un ciel bleu, un garçon étend du linge
    - id: nuages
      texte: De gros nuages noirs arrivent au-dessus du jardin
    - id: pluie
      texte: La pluie tombe et le vent fait s'envoler le linge
    - id: boue
      texte: Le garçon ramasse le linge trempé dans la boue
  indices:
    relance: 'Comment commence l''histoire : par le beau temps ou par la tempête ?'
    methode: 'Cherche la cause et la conséquence : qu''est-ce qui doit arriver avant que le linge ne s''envole ?'
    etape: Le récit commence au soleil et finit dans la boue. Range les deux images du milieu.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux images voisines sont inversées. Les nuages arrivent-ils avant ou après la pluie ?
  - si:
      diagnostic: ordre_faux
    relance: Repère la situation de départ, calme, et la situation finale, puis range les autres entre elles.
  solution: Ciel bleu et linge étendu, arrivée des nuages, pluie et linge qui s'envole, linge ramassé dans la boue.
- id: saut-dans-le-temps
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le procédé qui consiste à ne pas montrer un moment de l'histoire, en laissant le spectateur
    deviner le temps écoulé ?
  reponse:
    acceptees:
    - ellipse
    - ellipse temporelle
    fautes_tolerees: 0
  indices:
    relance: Dans un film, on voit un personnage enfant, puis adulte dans le plan suivant. Qu'a-t-on fait avec les années
      entre les deux ?
    methode: Cherche le mot qui désigne un manque volontaire dans le récit, un « trou » dans le temps.
    etape: C'est aussi le nom d'une figure géométrique en forme d'ovale. Il commence par « e ».
  pieges:
  - si:
      valeur: hors-champ
    relance: Le hors-champ est ce qui est hors du cadre, dans l'espace. On cherche un saut dans le temps.
  - si:
      valeur: montage
    relance: Le montage enchaîne les images. On cherche le nom du moment qu'on choisit de ne pas montrer.
  solution: 'Une ellipse : un moment n''est pas montré, le spectateur devine le temps écoulé.'
- id: procede-et-temps
  type: association
  difficulte: 2
  enonce: Relie chaque procédé à son effet sur le temps ou le mouvement.
  reponse:
    gauche:
    - id: a
      texte: Un flou de bougé sur une photographie fixe
    - id: b
      texte: Une série de photographies prises à intervalles très rapprochés
    - id: c
      texte: Une grande case panoramique, ou un plan long et fixe
    - id: d
      texte: Une suite de petites cases, ou de plans très courts
    droite:
    - id: w
      texte: Suggère la vitesse dans une image unique
    - id: x
      texte: Décompose un mouvement trop rapide pour l'œil
    - id: y
      texte: Ralentit le récit et installe la durée
    - id: z
      texte: Accélère le rythme du récit
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lesquels de ces procédés utilisent une seule image, et lesquels plusieurs ?
    methode: 'Pour les deux derniers, compare : que ressens-tu devant une grande image calme, et devant une rafale d''images
      courtes ?'
    etape: Le flou est dans une seule image. La série de photos rapprochées est la méthode de Muybridge. Place les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Des images nombreuses et courtes, est-ce plutôt rapide ou lent ?
  - si:
      diagnostic: associations_fausses
    relance: Pars du procédé qui ne compte qu'une seule image, puis de celui qui en compte le plus.
  solution: 'Flou de bougé : suggère la vitesse dans une image fixe. Série de photos rapprochées (chronophotographie) : décompose
    un mouvement. Grande case ou plan long : ralentit et installe la durée. Petites cases ou plans courts : accélèrent le
    rythme.'
- id: muybridge-galop
  type: choix
  difficulte: 2
  enonce: En 1878, Eadweard Muybridge photographie un cheval au galop avec une série d'appareils déclenchés l'un après l'autre.
    Qu'a montré cette séquence ?
  reponse:
    options:
    - id: a
      texte: À un moment du galop, le cheval a les quatre sabots en l'air, repliés sous le corps
    - id: b
      texte: Au galop, le cheval a toujours au moins un sabot posé sur le sol
    - id: c
      texte: Le cheval galope les pattes tendues à la fois vers l'avant et vers l'arrière
    bonnes:
    - a
  indices:
    relance: Pourquoi fallait-il des photographies pour répondre à cette question ? Que ne voit pas l'œil ?
    methode: La séquence décompose un mouvement trop rapide. Cherche la réponse qui décrit une position surprenante, que l'on
      ne voyait pas avant.
    etape: Pendant longtemps, les peintres ont représenté le cheval au galop les pattes étendues, « ventre à terre ». Les
      photos ont contredit cette image. Quelle réponse reste ?
  pieges:
  - si:
      contient:
      - b
    relance: C'était justement la question débattue. Sur certaines photos de la série, le cheval touche-t-il le sol ?
  - si:
      contient:
      - c
    relance: C'est la position que l'on voyait dans beaucoup de tableaux avant 1878. Les photos l'ont-elles confirmée ?
  solution: La séquence de Muybridge a montré qu'à un moment du galop, le cheval a les quatre sabots en l'air, repliés sous
    le corps (a), et non tendus vers l'avant et l'arrière comme dans beaucoup de tableaux.
- id: raconter-en-quatre-images
  type: ouverte
  difficulte: 3
  enonce: 'Prépare le découpage d''une histoire en quatre images : « un élève attend le bus sous la pluie ». Décris chaque
    image en une phrase (cadrage, point de vue), place au moins une ellipse, et explique le rythme que tu donnes au récit.'
  criteres:
  - L'élève décrit quatre images ordonnées et lisibles, en précisant au moins deux cadrages ou points de vue.
  - L'élève place une ellipse et explique ce que le spectateur doit deviner.
  - L'élève justifie le rythme choisi (taille, nombre ou durée des images) par l'effet recherché.
  indices:
    relance: Quel est le moment le plus important de cette histoire, celui qu'il faut absolument montrer ?
    methode: Choisis un début, un moment fort et une fin, puis décide quel moment tu sautes et comment tu varies la taille
      des images.
    etape: 'Tu peux commencer ainsi : « Image 1 : plan d''ensemble de l''arrêt de bus sous la pluie, l''élève est seul… »'
  solution: 'Exemple de réponse. Image 1 : plan d''ensemble de l''arrêt sous la pluie, l''élève est seul. Image 2 : gros plan
    sur sa montre. Image 3 : le bus passe sans s''arrêter, en plongée, avec un flou de vitesse. Image 4 : l''élève arrive
    trempé au collège. L''ellipse, entre les images 3 et 4, cache le trajet à pied : le spectateur le devine. Les trois premières
    images sont petites, pour montrer l''attente qui s''étire ; la dernière est grande, pour la chute comique.'
