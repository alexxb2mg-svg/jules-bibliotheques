# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: numerique-processus-materiau
version: 2
etat: verifiee
declencheurs:
- dessin sur tablette graphique
- pixel art
- image pixellisée
- art algorithmique
- retoucher un dessin scanné
- énergie consommée par les images
- outil processus matériau numérique
- résolution d'une image
prerequis:
- 4e-numerique-processus-materiau
essentiel: 'En arts plastiques, le numérique peut être un outil, un processus et un matériau.


  - Un outil : une tablette, un logiciel de dessin ou de retouche, un appareil photo remplacent ou prolongent le crayon et
  le pinceau. David Hockney, par exemple, dessine sur iPhone puis sur iPad depuis la fin des années 2000.

  - Un processus : l''artiste écrit des règles (un algorithme, un programme) et la machine produit l''image. Vera Molnar crée
  dès 1968 des dessins avec un ordinateur, tracés ensuite par une machine. Le hasard peut faire partie des règles.

  - Un matériau : le pixel (petit carré de couleur), la lumière de l''écran, le fichier, et même l''erreur d''affichage (le
  glitch) peuvent devenir le sujet de l''œuvre.


  Le numérique permet de répéter, d''annuler, de superposer des calques, de copier, de modifier sans limite, et de diffuser
  une image très largement.


  Pratiques traditionnelles et numériques dialoguent : on peut numériser un dessin (scanner, photo), le transformer dans un
  logiciel, l''imprimer puis le retravailler à la main. Ce va-et-vient est une démarche à part entière.


  Une image numérique est faite de pixels. La résolution est leur nombre : plus elle est grande, plus l''image est fine et
  plus le fichier est lourd. Agrandie beaucoup, l''image se pixellise.


  Le numérique n''est pas immatériel : fabriquer les appareils utilise des métaux, et stocker, envoyer ou calculer des images
  consomme de l''électricité (ordinateurs, serveurs). Un regard critique consiste à se demander si le numérique est utile
  au projet, à choisir une résolution adaptée et à éviter les copies et envois inutiles.


  Ce que l''on attend : distinguer les trois rôles du numérique, donner un exemple, expliquer un dialogue avec la pratique
  traditionnelle et porter un regard critique sur l''usage.

  '
methode:
- 'Repérer le rôle du numérique : outil qui remplace un instrument, processus (règles, programme) ou matériau (pixel, écran,
  erreur).'
- 'Dire ce que le numérique permet : répéter, transformer, annuler, superposer des calques, générer au hasard.'
- 'Repérer le dialogue avec une pratique traditionnelle : dessin, peinture, collage avant ou après le passage par l''écran.'
- Nommer un exemple d'artiste ou de démarche pour appuyer l'analyse.
- 'Porter un regard critique : l''usage du numérique est-il nécessaire ? consomme-t-il beaucoup d''énergie ?'
vocabulaire:
- terme: pixel
  definition: plus petit élément d'une image numérique, un petit carré d'une seule couleur
- terme: numériser
  definition: transformer une image réelle en fichier numérique, par exemple avec un scanner
- terme: algorithme
  definition: suite de règles précises qu'une machine peut suivre pour produire un résultat
- terme: résolution
  definition: nombre de pixels d'une image ; plus il est grand, plus l'image est fine et plus le fichier est lourd
- terme: glitch
  definition: erreur ou bug d'affichage numérique, parfois provoqué volontairement pour son effet visuel
erreurs_frequentes:
- 'Croire que le numérique n''est qu''un outil : il peut aussi être le matériau et le sujet de l''œuvre.'
- 'Penser qu''une œuvre numérique est faite « toute seule » par l''ordinateur : l''artiste choisit les règles et les résultats.'
- Opposer traditionnel et numérique alors qu'on peut passer de l'un à l'autre dans une même production.
- 'Croire qu''une image numérique ne consomme rien : stockage et envois utilisent de l''énergie.'
exemple:
  enonce: 'Production fictive d''élève : Inès photographie une feuille morte, agrandit l''image jusqu''à voir de gros carrés,
    puis peint ces carrés à l''acrylique sur un grand carton. Quel rôle joue le numérique ?'
  solution: 'Le numérique est d''abord un outil (photo, agrandissement), puis un matériau : les pixels, devenus visibles,
    sont le sujet de la peinture. La production fait dialoguer pratique numérique et pratique traditionnelle, puisque l''image
    d''écran est repeinte à la main.'
exercices:
- id: mot-pixel
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle le plus petit élément d'une image numérique, un petit carré d'une seule couleur ?
  reponse:
    acceptees:
    - pixel
    - pixels
    fautes_tolerees: 0
  indices:
    relance: Si tu agrandis beaucoup une photo sur un écran, que finis-tu par voir apparaître ?
    methode: Pense au mot qui sert à mesurer la définition d'un écran ou d'un appareil photo (« 12 méga... »).
    etape: Le mot vient de l'anglais « picture element » et commence par « pix ».
  pieges:
  - si:
      valeur: octet
    relance: L'octet mesure la taille d'un fichier. Le mot cherché désigne un petit carré de couleur visible dans l'image.
  - si:
      valeur: bit
    relance: Le bit est une information 0 ou 1. On cherche le petit carré de couleur qui compose l'image.
  - si:
      diagnostic: mauvaise_reponse
    relance: 'Agrandis une image numérique dans ta tête : de quoi est faite la mosaïque qui apparaît ?'
  solution: 'Le pixel : chaque image numérique est une mosaïque de pixels. Quand on agrandit beaucoup l''image, ils deviennent
    visibles et peuvent devenir un matériau de l''œuvre.'
- id: dialogue-traditionnel-numerique
  type: choix
  difficulte: 1
  enonce: Dans quelle situation l'élève fait-il dialoguer une pratique traditionnelle et une pratique numérique dans sa production
    ?
  reponse:
    options:
    - id: a
      texte: Il peint à la gouache, scanne sa peinture, change les couleurs dans un logiciel, imprime puis ajoute des collages
    - id: b
      texte: Il peint à la gouache du début à la fin
    - id: c
      texte: Il regarde une vidéo sur un peintre célèbre
    - id: d
      texte: Il dessine au fusain sans jamais utiliser d'appareil
    bonnes:
    - a
  indices:
    relance: Dans quelle situation la production passe-t-elle à la fois par le papier et par l'écran ?
    methode: Pour chaque réponse, cherche une étape à la main et une étape sur ordinateur dans la même production.
    etape: Les réponses b et d n'utilisent aucun appareil. La réponse c n'est pas une production. Reste-t-il une réponse ?
  pieges:
  - si:
      contient:
      - c
    relance: Regarder une vidéo, c'est s'informer. Mais l'élève produit-il quelque chose avec le numérique ?
  - si:
      contient:
      - b
    relance: La gouache est une pratique traditionnelle. Où est le numérique dans cette production ?
  - si:
      contient:
      - d
    relance: Le fusain est traditionnel. Cherche une production qui passe aussi par l'écran.
  solution: 'La réponse a : la peinture à la gouache (traditionnelle) est numérisée, transformée dans un logiciel, imprimée
    puis reprise à la main par des collages. Les deux pratiques s''enrichissent.'
- id: role-du-numerique
  type: association
  difficulte: 2
  enonce: Relie chaque démarche au rôle que joue le numérique.
  reponse:
    gauche:
    - id: a
      texte: Dessiner un paysage à la tablette, comme on le ferait au crayon
    - id: b
      texte: Écrire un programme qui trace des lignes selon des règles et un peu de hasard
    - id: c
      texte: Agrandir une photo jusqu'à voir ses petits carrés de couleur et en faire le sujet de l'œuvre
    - id: d
      texte: Provoquer volontairement un bug d'affichage pour déformer une image
    droite:
    - id: x
      texte: Un outil qui remplace un instrument traditionnel
    - id: y
      texte: 'Un processus : des règles produisent l''image'
    - id: z
      texte: 'Un matériau : la structure de l''image numérique devient visible'
    - id: w
      texte: L'erreur numérique devient un effet plastique
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Dans quelle démarche le numérique fait-il exactement la même chose qu'un crayon ?
    methode: 'Demande-toi pour chaque démarche : l''ordinateur sert-il d''instrument, suit-il des règles, ou devient-il ce
      qu''on regarde ?'
    etape: 'La tablette remplace le crayon : c''est l''outil. Le programme suit des règles : c''est le processus. Place les
      deux dernières.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle des démarches utilise une erreur de la machine ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par la démarche la plus proche du dessin à la main, puis celle qui utilise un programme.
  solution: 'Tablette : outil. Programme à règles : processus. Pixels agrandis : matériau. Bug d''affichage provoqué : l''erreur
    numérique devient un effet plastique (le glitch).'
- id: sobriete-numerique
  type: choix
  difficulte: 2
  enonce: Pour un projet en classe, quelles pratiques réduisent l'énergie consommée par le numérique ? Choisis les deux bonnes
    réponses.
  reponse:
    options:
    - id: a
      texte: Enregistrer les images dans une résolution adaptée à leur usage
    - id: b
      texte: Supprimer les doublons et les essais inutiles stockés en ligne
    - id: c
      texte: Envoyer une vidéo en très haute définition à toute la classe après chaque essai
    - id: d
      texte: Garder toutes les versions de tous les fichiers en ligne « au cas où »
    bonnes:
    - a
    - b
  indices:
    relance: Un fichier lourd, stocké et envoyé souvent, demande-t-il plus ou moins d'électricité ?
    methode: Pour chaque pratique, demande-toi si elle augmente ou diminue la quantité de données stockées et envoyées.
    etape: Stocker en ligne, c'est faire tourner des serveurs en permanence. Quelles pratiques diminuent ce stockage ou le
      poids des fichiers ?
  pieges:
  - si:
      contient:
      - c
    relance: Une vidéo très haute définition est un fichier très lourd. L'envoyer souvent à tous, est-ce économe ?
  - si:
      contient:
      - d
    relance: Chaque fichier gardé en ligne occupe des serveurs allumés jour et nuit. Est-ce économe ?
  - si:
      diagnostic: incomplet
    relance: Tu as une bonne réponse. Une autre pratique réduit aussi la quantité de fichiers stockés.
  solution: Choisir une résolution adaptée et supprimer les doublons réduisent les données stockées et donc l'énergie consommée.
    Envoyer souvent des vidéos très lourdes ou tout garder en ligne l'augmente.
- id: demarche-aller-retour
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes d'une production qui passe du papier à l'écran, puis revient au papier.
  reponse:
    elements:
    - id: dessiner
      texte: Réaliser un dessin à l'encre sur papier
    - id: numeriser
      texte: Numériser le dessin avec un scanner ou un appareil photo
    - id: transformer
      texte: 'Le transformer dans un logiciel : couleurs, calques, répétitions'
    - id: imprimer
      texte: Imprimer l'image transformée
    - id: reprendre
      texte: Reprendre le tirage à la main avec de la peinture ou des collages
  indices:
    relance: Peut-on transformer un dessin dans un logiciel avant qu'il soit dans l'ordinateur ?
    methode: 'Suis le trajet de l''image : papier, puis écran, puis de nouveau papier.'
    etape: On commence par le dessin à l'encre et on le numérise. Que fait-on ensuite à l'écran ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque. Deux étapes voisines sont inversées : peut-on reprendre à la main un tirage qui n''est pas encore imprimé
      ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère l'étape où l'image entre dans l'ordinateur et celle où elle en sort, puis range le reste.
  solution: Dessin à l'encre, numérisation, transformation dans le logiciel, impression, reprise à la main. L'image fait l'aller-retour
    entre pratique traditionnelle et numérique.
- id: analyse-arbre-pixellise
  type: ouverte
  difficulte: 3
  enonce: 'Production fictive d''élève : Tom a photographié un arbre, l''a fortement pixellisé à l''ordinateur, puis a recopié
    chaque carré à la gouache sur une grande feuille. Analyse cette production en quelques phrases : quel rôle joue le numérique,
    et que gagne-t-on à revenir à la peinture ?'
  criteres:
  - L'élève distingue le numérique comme outil (photo, logiciel) et comme matériau (les pixels visibles deviennent le sujet).
  - L'élève explique le dialogue entre pratique numérique et pratique traditionnelle (la gouache, la trace de la main, le
    temps passé).
  - L'élève justifie par un effet visuel précis (mosaïque, image reconnaissable de loin et abstraite de près, taille de la
    feuille).
  indices:
    relance: Que voit-on de loin sur la grande feuille ? Et de près ?
    methode: Dis d'abord ce que fait l'ordinateur, puis ce que fait la main, puis l'effet obtenu sur le spectateur.
    etape: Tu peux commencer ainsi « Tom utilise l'ordinateur pour..., puis il... »
  solution: 'Tom utilise le numérique comme outil (photo, logiciel), puis comme matériau : les pixels agrandis deviennent
    le motif de sa peinture. En recopiant chaque carré à la gouache, il fait dialoguer numérique et tradition : la main, les
    petites irrégularités de la peinture et le temps passé remplacent le calcul instantané de la machine. De loin, on reconnaît
    l''arbre ; de près, on ne voit qu''une mosaïque de carrés colorés, presque abstraite.'
- id: nblm-quand-un-artiste-utilise-une-tablette-gr-1
  type: choix
  difficulte: 2
  enonce: Quand un artiste utilise une tablette graphique ou un logiciel pour réaliser un dessin à la place d'un crayon, quel
    rôle joue principalement le numérique ?
  reponse:
    options:
    - id: o1
      texte: Un outil qui remplace ou prolonge les instruments traditionnels.
    - id: o2
      texte: Un matériau physique fait de peinture et de papier.
    - id: o3
      texte: Un algorithme autonome qui génère le dessin sans intervention humaine.
    - id: o4
      texte: Un glitch provoqué par une erreur de serveur.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que remplace directement la tablette graphique par rapport aux instruments traditionnels du dessinateur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la tablette et le logiciel ne sont pas de la matière physique traditionnelle, mais des équipements
      et programmes numériques.'
  - si:
      contient:
      - o3
    relance: 'Confusion entre outil et processus : la tablette est un outil dirigé par la main de l''artiste, elle ne dessine
      pas toute seule.'
  - si:
      contient:
      - o4
    relance: Le glitch est un bug ou une erreur d'affichage numérique, pas l'utilisation d'une tablette graphique.
  solution: 'Un outil qui remplace ou prolonge les instruments traditionnels. C''est exact : selon la fiche de cours, la tablette
    graphique ou le logiciel de dessin jouent le rôle d''outil en remplaçant ou prolongeant le crayon et le pinceau.'
- id: nblm-que-se-passe-t-il-lorsqu-on-agrandit-for-2
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il lorsqu'on agrandit fortement une image matricielle (comme dans la pratique du pixel art ou lors
    de l'observation d'une image pixellisée) ?
  reponse:
    options:
    - id: o1
      texte: Les pixels deviennent visibles sous forme de petits carrés de couleur et constituent le matériau visuel de l'image.
    - id: o2
      texte: L'image se transforme automatiquement en un dessin vectoriel parfaitement lisse.
    - id: o3
      texte: L'ordinateur efface définitivement le fichier car la définition est trop faible.
    - id: o4
      texte: L'image prend instantanément du relief pour devenir une sculpture en bronze.
    bonnes:
    - o1
  indices:
    relance: Pense à la structure élémentaire d'une image matricielle quand on se rapproche très près de l'écran.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : agrandir une image matricielle fait apparaître la grille de pixels (image pixellisée) et
      ne la transforme pas en image vectorielle.'
  - si:
      contient:
      - o3
    relance: L'ordinateur n'efface pas l'image, il affiche simplement les pixels agrandis sur l'écran.
  - si:
      contient:
      - o4
    relance: L'agrandissement d'une image sur écran reste une image numérique à deux dimensions.
  solution: 'Les pixels deviennent visibles sous forme de petits carrés de couleur et constituent le matériau visuel de l''image.
    C''est exact : en agrandissant l''image matricielle, les pixels (petits carrés de couleur) deviennent visibles et deviennent
    le matériau ou le sujet plastique de l''œuvre.'
- id: nblm-dans-le-domaine-de-l-art-algorithmique-c-3
  type: choix
  difficulte: 2
  enonce: Dans le domaine de l'art algorithmique (comme dans les travaux de Vera Molnar), quel est le rôle du numérique en
    tant que « processus » ?
  reponse:
    options:
    - id: o1
      texte: L'artiste écrit des règles ou un programme qu'une machine exécute pour produire l'image.
    - id: o2
      texte: L'ordinateur invente l'idée artistique de lui-même sans aucune instruction humaine.
    - id: o3
      texte: L'artiste prend une photo d'une œuvre classique sans rien y modifier.
    - id: o4
      texte: La machine détruit systématiquement tous les fichiers informatiques.
    bonnes:
    - o1
  indices:
    relance: Pense aux instructions et aux règles logiques données à la machine pour créer des formes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''ordinateur ne crée pas tout seul, c''est toujours l''artiste qui conçoit les règles et
      les paramètres du programme.'
  - si:
      contient:
      - o3
    relance: Photographier une œuvre est une opération de numérisation ou de captation, pas de l'art algorithmique.
  - si:
      contient:
      - o4
    relance: L'art algorithmique s'appuie sur la création et l'exécution de programmes informatiques pour générer des formes.
  solution: 'L''artiste écrit des règles ou un programme qu''une machine exécute pour produire l''image. C''est juste : en
    tant que processus, le numérique repose sur des règles précises (un algorithme) définies par l''artiste et exécutées par
    la machine.'
- id: nblm-comment-qualifie-t-on-la-demarche-artist-4
  type: choix
  difficulte: 2
  enonce: Comment qualifie-t-on la démarche artistique consistant à numériser un dessin fait main (via un scanner) pour le
    retoucher sur ordinateur puis l'imprimer et le repeindre ?
  reponse:
    options:
    - id: o1
      texte: Un dialogue entre pratique traditionnelle et pratique numérique.
    - id: o2
      texte: Une opposition stricte où le numérique cherche à détruire l'art traditionnel.
    - id: o3
      texte: Une tricherie car le logiciel remplace entièrement le travail de l'artiste.
    - id: o4
      texte: Un processus 100 % virtuel qui n'utilise aucun matériau réel.
    bonnes:
    - o1
  indices:
    relance: Observe la circulation du travail entre le support physique (papier) et l'outil informatique (écran).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : les pratiques traditionnelles et numériques ne s''opposent pas, elles se croisent et se complètent.'
  - si:
      contient:
      - o3
    relance: L'utilisation du scanner et du logiciel de retouche constitue un choix plastique et une étape de création, pas
      une tricherie.
  - si:
      contient:
      - o4
    relance: Le dessin de départ et la peinture finale utilisent des matériaux physiques bien réels (papier, peinture).
  solution: 'Un dialogue entre pratique traditionnelle et pratique numérique. C''est exact : faire des allers-retours entre
    le papier (dessiner, repeindre) et l''écran (scanner, retoucher) établit un dialogue entre techniques traditionnelles
    et numériques.'
- id: nblm-pourquoi-la-fiche-de-cours-rappelle-t-el-5
  type: choix
  difficulte: 2
  enonce: Pourquoi la fiche de cours rappelle-t-elle que « le numérique n'est pas immatériel » en évoquant l'énergie consommée
    par les images ?
  reponse:
    options:
    - id: o1
      texte: Car la fabrication des appareils nécessite des métaux et leur stockage/calcul consomme de l'électricité.
    - id: o2
      texte: Car les images numériques sont systématiquement imprimées sur des dalles en pierre.
    - id: o3
      texte: Car les pixels sont composés de vraies touches de peinture à l'huile.
    - id: o4
      texte: Car les serveurs informatiques fonctionnent uniquement grâce à la force du vent.
    bonnes:
    - o1
  indices:
    relance: Pense aux ressources nécessaires pour fabriquer les ordinateurs et alimenter les serveurs réseau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Les images numériques existent largement sur écran, mais leur présence virtuelle nécessite une infrastructure
      physique sous-jacente.
  - si:
      contient:
      - o3
    relance: Les pixels sont des points lumineux sur un écran, pas de la matière picturale liquide.
  - si:
      contient:
      - o4
    relance: Les serveurs et centres de données nécessitent un approvisionnement continu en électricité.
  solution: 'Car la fabrication des appareils nécessite des métaux et leur stockage/calcul consomme de l''électricité. C''est
    juste : fabriquer le matériel exige des ressources physiques et faire fonctionner les ordinateurs ou serveurs consomme
    de l''énergie électrique.'
- id: nblm-selon-la-fiche-de-notion-quels-sont-deux-6
  type: choix
  difficulte: 3
  enonce: Selon la fiche de notion, quels sont DEUX des trois rôles majeurs que peut jouer le numérique en arts plastiques
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un outil (qui remplace ou prolonge les instruments comme le crayon ou le pinceau).
    - id: o2
      texte: Un matériau (comme le pixel, la lumière de l'écran, le fichier ou le glitch).
    - id: o3
      texte: Un substitut magique qui crée de l'art sans aucune intention de l'auteur.
    - id: o4
      texte: Un liant chimique liquide utilisé pour diluer les gouaches.
    bonnes:
    - o1
    - o2
  indices:
    relance: 'Rappelle-toi le triptyque clé du cours : outil, processus, ...'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : le numérique ne remplace jamais l''intention artistique et les choix créatifs de l''auteur.'
  - si:
      contient:
      - o4
    relance: Le numérique concerne les technologies informatiques et d'affichage, ce n'est pas une substance chimique liquide.
  solution: 'Un outil (qui remplace ou prolonge les instruments comme le crayon ou le pinceau) ; Un matériau (comme le pixel,
    la lumière de l''écran, le fichier ou le glitch). C''est exact : le numérique sert d''outil lorsqu''on utilise une tablette
    graphique ou un logiciel de retouche.'
- id: nblm-quel-terme-designe-le-plus-petit-element-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne le plus petit élément d'une image numérique matricielle, prenant la forme d'un petit carré d'une
    seule couleur ?
  reponse:
    acceptees:
    - pixel
    fautes_tolerees: 1
  indices:
    relance: C'est le petit carré de couleur de base qui compose les images matricielles sur un écran.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'pixel. C''est exact : le pixel est le plus petit élément d''une image matricielle.'
- id: nblm-quelle-suite-de-regles-precises-une-mach-8
  type: texte_court
  difficulte: 1
  enonce: Quelle suite de règles précises une machine peut-elle exécuter pour produire un résultat visuel dans l'art informatique
    ?
  reponse:
    acceptees:
    - algorithme
    fautes_tolerees: 1
  indices:
    relance: Ce mot masculin commence par « algo » et désigne le programme ou la suite d'instructions données à la machine.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'algorithme. C''est exact : un algorithme est une suite de règles précises exécutée par un ordinateur.'
- id: association-artistes-numerique
  type: association
  difficulte: 2
  enonce: Relie chaque artiste à sa pratique du numérique.
  reponse:
    gauche:
    - id: a
      texte: David Hockney
    - id: b
      texte: Vera Molnar
    droite:
    - id: x
      texte: Dessine sur iPhone puis sur iPad
    - id: y
      texte: Crée dès 1968 des dessins avec un ordinateur
    paires:
      a: x
      b: y
  indices:
    relance: Pour chaque artiste, demande-toi s'il dessine avec un appareil ou s'il fait tracer des règles à une machine.
    methode: L'un dessine directement sur une tablette, l'autre fait produire des dessins par un ordinateur.
    etape: 'Hockney dessine sur iPhone puis iPad : c''est un outil qui remplace le carnet.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Qui utilise un ordinateur dès 1968 ?
  solution: David Hockney dessine sur iPhone puis iPad (outil). Vera Molnar crée dès 1968 des dessins avec un ordinateur (processus).
