format: 2
notion: dispositif-de-representation
version: 2
etat: verifiee
declencheurs:
- point de fuite
- donner de la profondeur au dessin
- ligne d'horizon
- in situ
- une œuvre dans laquelle on entre
- lignes qui convergent
- colonnes de Buren
- organisation ou composition
prerequis:
- 4e-dispositif-de-representation
essentiel: 'En deux dimensions, il y a deux espaces. L''espace littéral est la surface réelle du support : son format, ses
  bords, sa matière, plate. L''espace suggéré est la profondeur imaginaire que l''image fait croire : on a l''impression de
  voir loin, alors que la surface est plate.


  Pour suggérer la profondeur, on peut superposer les formes (devant, derrière), représenter plus petit ce qui est loin, pâlir
  et bleuir les couleurs au loin, ou utiliser la perspective, avec une ligne d''horizon et des lignes qui convergent vers
  un point de fuite. Vers 1425-1427, Masaccio peint à fresque La Trinité, à Florence, l''une des premières peintures construites
  avec cette perspective.


  Organiser, c''est répartir des éléments selon un principe simple (grille, alignement, répétition), sans forcément de hiérarchie.
  Composer, c''est agencer les éléments de façon pensée pour un effet d''ensemble : on crée un centre d''intérêt, des lignes
  qui guident le regard, des équilibres ou des déséquilibres.


  En trois dimensions : la structure est l''ossature qui fait tenir et organise un volume ; la construction est l''assemblage
  d''éléments pour édifier un volume ; l''installation dispose des éléments dans un lieu, que le spectateur parcourt ou dans
  lequel il entre.


  Une œuvre peut aussi intervenir sur un lieu réel. Une œuvre in situ est conçue pour un lieu précis et en dépend : Les Deux
  Plateaux de Daniel Buren (1986), des colonnes rayées dans la cour d''honneur du Palais-Royal à Paris, ont été pensés pour
  cette cour.


  Pour distinguer : une frise de carrés identiques alignés est une organisation ; un paysage où un arbre au premier plan cache
  une colline et guide l''œil vers une maison est une composition.


  En trois dimensions, ne pas confondre : un échafaudage est d''abord une structure ; une maison de cartes est une construction
  ; des chaises suspendues dans une salle forment une installation. Dans l''installation, le spectateur fait partie du dispositif
  : il se déplace et change de point de vue.


  Au brevet, on attend que tu identifies la dimension (2D ou 3D), que tu emploies le vocabulaire juste et que tu cites un
  procédé précis choisi par l''artiste.

  '
methode:
- En deux dimensions, distinguer ce qui est réellement là (le support, sa surface) et ce que l'image fait croire (la profondeur).
- 'Repérer les procédés qui suggèrent la profondeur : superposition, taille, couleurs, perspective.'
- Se demander si les éléments sont simplement répartis (organisation) ou agencés pour un effet d'ensemble (composition).
- En trois dimensions, repérer ce qui fait tenir (structure), comment c'est assemblé (construction), et la place du spectateur
  dans le lieu (installation).
- Se demander si l'œuvre a été pensée pour un lieu précis (in situ).
vocabulaire:
- terme: espace littéral
  definition: la surface réelle du support, avec son format, ses bords et sa matière
- terme: espace suggéré
  definition: la profondeur imaginaire que l'image fait croire sur une surface plane
- terme: perspective
  definition: procédé qui donne l'illusion de la profondeur, avec une ligne d'horizon et des lignes qui convergent vers un
    point de fuite
- terme: composition
  definition: l'agencement pensé des éléments d'une œuvre pour produire un effet d'ensemble
- terme: installation
  definition: œuvre faite d'éléments disposés dans un lieu, que le spectateur parcourt ou dans lequel il entre
- terme: in situ
  definition: se dit d'une œuvre conçue pour un lieu précis, et qui en dépend
erreurs_frequentes:
- 'Oublier que la profondeur d''un tableau est une illusion : la surface reste plate.'
- Croire que la perspective est le seul moyen de suggérer la profondeur.
- Confondre organisation (répartition simple) et composition (agencement pensé pour un effet).
- Appeler installation n'importe quelle sculpture posée sur un socle.
- 'Oublier le spectateur : dans une installation, son déplacement fait partie de l''expérience.'
exemple:
  enonce: 'Production fictive : sur une feuille A4, un élève dessine une route qui se rétrécit jusqu''à un point sur l''horizon,
    avec des arbres de plus en plus petits. Décris l''espace littéral et l''espace suggéré.'
  solution: 'L''espace littéral est la feuille A4 : une surface plate, de format vertical ou horizontal, limitée par ses bords.
    L''espace suggéré est la route qui semble s''enfoncer au loin : les lignes des bords de la route convergent vers un point
    de fuite sur la ligne d''horizon, et les arbres rapetissent avec la distance. On croit voir loin, alors que tout est sur
    le même plan.'
exercices:
- id: illusion-de-profondeur
  type: texte_court
  difficulte: 1
  enonce: Quel procédé donne l'illusion de la profondeur sur une surface plane, avec une ligne d'horizon et des lignes qui
    convergent vers un point de fuite ?
  reponse:
    acceptees:
    - perspective
    - perspective linéaire
    fautes_tolerees: 1
  indices:
    relance: Quand tu dessines une route qui s'éloigne, que font ses deux bords ?
    methode: Ce procédé a été mis au point par les peintres et architectes de la Renaissance italienne, au XVe siècle.
    etape: Le mot commence par « pers… » et désigne aussi, dans la vie courante, une façon de voir les choses de loin.
  pieges:
  - si:
      valeur: profondeur
    relance: La profondeur est l'effet obtenu. On cherche le nom du procédé qui la crée avec des lignes.
  - si:
      valeur: trompe-l'œil
    relance: Le trompe-l'œil utilise souvent ce procédé, mais on cherche le nom du système de lignes et de point de fuite.
  solution: 'La perspective (linéaire) : les lignes convergent vers un point de fuite placé sur la ligne d''horizon, ce qui
    crée l''illusion de la profondeur.'
- id: suggerer-la-profondeur
  type: choix
  difficulte: 2
  enonce: Coche les procédés qui suggèrent la profondeur sur une surface plane.
  reponse:
    options:
    - id: a
      texte: 'Superposer les formes : l''une passe devant l''autre'
    - id: b
      texte: Représenter plus petit ce qui est loin
    - id: c
      texte: Pâlir et bleuir les couleurs de ce qui est au loin
    - id: d
      texte: Accrocher la feuille bien droite au mur
    - id: e
      texte: Choisir un format carré
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Quand tu regardes un paysage, qu'est-ce qui change pour les montagnes lointaines ?
    methode: Garde les procédés qui agissent sur ce qu'on voit dans l'image, et écarte ceux qui concernent seulement le support.
    etape: Accrocher la feuille ou choisir le format concerne l'espace littéral. Parmi les autres, lesquels font croire à
      un « loin » ?
  pieges:
  - si:
      contient:
      - d
    relance: Accrocher la feuille, c'est présenter le support. Cela crée-t-il une profondeur dans l'image ?
  - si:
      contient:
      - e
    relance: Le format est une caractéristique de l'espace littéral. Rend-il l'image plus profonde ?
  - si:
      diagnostic: incomplet
    relance: Il en manque. Pense à la taille, à la couleur, et à ce qui passe devant quoi.
  solution: Superposer les formes (a), représenter plus petit ce qui est loin (b) et pâlir les couleurs au loin (c) suggèrent
    la profondeur. Le format et l'accrochage concernent le support, l'espace littéral.
- id: vocabulaire-de-lespace
  type: association
  difficulte: 2
  enonce: Relie chaque terme à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Espace littéral
    - id: b
      texte: Espace suggéré
    - id: c
      texte: Structure
    - id: d
      texte: Installation
    droite:
    - id: w
      texte: La surface réelle du support, avec ses bords et son format
    - id: x
      texte: La profondeur imaginaire que l'image fait croire
    - id: y
      texte: L'ossature qui fait tenir un volume
    - id: z
      texte: Des éléments disposés dans un lieu que le spectateur parcourt
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: « Littéral » veut dire « au sens propre, tel quel ». Qu'est-ce qui est vraiment là, sous tes yeux ?
    methode: Sépare d'abord les deux termes qui parlent d'images en deux dimensions, puis les deux qui parlent de volumes
      et de lieux.
    etape: « Suggéré » veut dire « que l'on fait imaginer ». Place ces deux termes, puis ceux du volume.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel des deux termes du volume concerne le squelette de l'œuvre, et lequel
      le lieu entier ?
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par le sens des mots : « littéral » (tel quel), « suggéré » (imaginé), puis passe aux volumes.'
  solution: 'Espace littéral : la surface réelle du support. Espace suggéré : la profondeur imaginaire. Structure : l''ossature
    d''un volume. Installation : des éléments disposés dans un lieu que le spectateur parcourt.'
- id: organiser-ou-composer
  type: choix
  difficulte: 2
  enonce: Productions fictives. Sarah aligne 24 photos identiques en grille régulière. Hugo place un personnage à gauche,
    un grand vide à droite, et des lignes qui guident le regard vers le visage du personnage. Léo range ses crayons côte à
    côte par ordre de taille. Laquelle de ces productions relève d'une composition, et pas seulement d'une organisation ?
  reponse:
    options:
    - id: a
      texte: La grille de photos de Sarah
    - id: b
      texte: L'image de Hugo
    - id: c
      texte: Les crayons rangés de Léo
    bonnes:
    - b
  indices:
    relance: Dans quelle production les éléments n'ont-ils pas tous la même importance ?
    methode: Organiser, c'est répartir selon une règle simple. Composer, c'est agencer pour un effet d'ensemble, en guidant
      le regard.
    etape: La grille et le rangement par taille suivent une règle simple et répétée. Quelle production crée un centre d'intérêt
      ?
  pieges:
  - si:
      contient:
      - a
    relance: 'Une grille régulière répartit les photos selon une règle simple : toutes ont la même place. Le regard est-il
      guidé vers un point ?'
  - si:
      contient:
      - c
    relance: Ranger par taille suit une règle simple. Y a-t-il un centre d'intérêt, un effet d'ensemble recherché ?
  solution: 'L''image de Hugo (b) est une composition : le vide, la place du personnage et les lignes guident le regard vers
    le visage. La grille de Sarah et les crayons de Léo sont des organisations, selon une règle simple.'
- id: concu-pour-un-lieu
  type: texte_court
  difficulte: 2
  enonce: Quelle expression latine désigne une œuvre conçue pour un lieu précis et qui en dépend, comme Les Deux Plateaux
    de Daniel Buren (1986) dans la cour d'honneur du Palais-Royal à Paris ?
  reponse:
    acceptees:
    - in situ
    - insitu
    fautes_tolerees: 0
  indices:
    relance: Pourrait-on déplacer les colonnes de Buren dans un autre lieu sans changer l'œuvre ?
    methode: L'expression latine veut dire « sur place », « dans son lieu ». Elle est faite de deux petits mots.
    etape: Le premier mot est une préposition latine qui veut dire « dans ». Le second commence par « s » et désigne le site.
  pieges:
  - si:
      valeur: installation
    relance: C'est proche, mais une installation peut parfois être montrée ailleurs. Quelle expression latine dit que l'œuvre
      dépend d'un lieu précis ?
  - si:
      valeur: land art
    relance: Le land art intervient dans la nature. Ici, c'est la cour d'un palais en ville. Quelle expression latine générale
      convient ?
  solution: 'In situ : l''œuvre est conçue pour un lieu précis et en dépend. Les Deux Plateaux de Buren ont été pensés pour
    la cour d''honneur du Palais-Royal.'
- id: installation-escalier
  type: ouverte
  difficulte: 3
  enonce: 'Projet fictif : une classe suspend cinquante avions en papier blanc dans la cage d''escalier du collège, à différentes
    hauteurs, comme un vol. Est-ce une installation ? Explique le rôle du lieu et du spectateur, puis dis ce qui changerait
    si l''on présentait les mêmes avions dans une petite boîte posée sur une table.'
  criteres:
  - L'élève reconnaît une installation et explique que le lieu (la cage d'escalier) fait partie de l'œuvre.
  - L'élève décrit le rôle du spectateur, qui découvre l'œuvre en montant ou en descendant.
  - L'élève compare avec la boîte (maquette, point de vue unique, espace réduit) et justifie la différence d'effet.
  indices:
    relance: Comment découvre-t-on les avions quand on monte l'escalier ?
    methode: Parle d'abord du lieu, puis du déplacement du spectateur, puis compare avec la boîte.
    etape: 'Tu peux commencer ainsi : « C''est une installation, car les avions occupent un lieu réel que le spectateur traverse…
      »'
  solution: 'Exemple de réponse : c''est une installation, car les avions occupent un lieu réel, la cage d''escalier, et utilisent
    sa hauteur pour évoquer un vol. Le spectateur les découvre en montant ou en descendant : son point de vue change à chaque
    marche. Dans une petite boîte sur une table, on verrait les avions d''un seul coup d''œil, de l''extérieur, comme une
    maquette : on ne serait plus dans l''œuvre, et l''effet d''envol disparaîtrait.'
- id: mot-espace-litteral
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on, en deux dimensions, la surface réelle du support (papier, toile), avec son format et ses bords,
    qui reste plate même quand l'image donne l'illusion de la profondeur ?
  reponse:
    acceptees:
    - espace littéral
    - littéral
    - le littéral
    fautes_tolerees: 1
  indices:
    relance: Quand on touche la toile, est-elle plate ou profonde ? Comment appelle-t-on cet espace réel ?
    methode: 'En deux dimensions il y a deux espaces : celui qui est vraiment là, et celui que l''image fait croire. On cherche
      le premier.'
    etape: 'C''est l''espace qui est dit « lit- » comme dans « à la lettre » : ce qui est réel, sans illusion.'
  pieges:
  - si:
      valeur: espace suggéré
    relance: L'espace suggéré est la profondeur imaginaire de l'image. On cherche la surface réelle, plate.
  - si:
      diagnostic: mauvaise_reponse
    relance: 'Relis le début de la leçon : deux espaces en deux dimensions, l''un est la surface réelle du support.'
  solution: 'L''espace littéral : la surface réelle et plate du support, avec son format et ses bords. L''espace suggéré est
    la profondeur que l''image fait croire.'
