# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: niveau-lv1-a2-b1
version: 2
etat: verifiee
declencheurs:
- niveau A2 ou B1 en anglais
- comprendre le CECRL en anglais
- progresser en anglais LV1
- niveau visé en fin de troisième
- échelle A1 à C2
- profil par activité langagière
- différence entre A2 et B1
- niveau attendu en LV1
prerequis:
- ecouter-et-comprendre
- lire
essentiel: 'Le CECRL (Cadre européen commun de référence pour les langues) classe le niveau en langue sur six degrés : A1,
  A2, B1, B2, C1, C2. La lettre A désigne un utilisateur élémentaire, B un utilisateur indépendant, C un utilisateur expérimenté.
  Dans chaque lettre, le chiffre 2 est plus avancé que le chiffre 1.


  Il y a cinq activités langagières : écouter et comprendre, lire, parler en continu, écrire, réagir et dialoguer.


  Pour la LV1 (souvent l''anglais), le programme demande qu''en fin de cycle 4, tous les élèves aient atteint au moins le
  niveau A2 dans les cinq activités.


  Les activités proposées permettent aussi d''atteindre le niveau B1 dans plusieurs activités.


  Ce que cela veut dire, en gros. À A2, on comprend et on produit des phrases simples sur des sujets familiers : se présenter,
  parler de sa famille, de ses goûts, de son quotidien. À B1, on est plus autonome : on raconte un événement, on décrit un
  projet, on donne un avis simple et on le justifie brièvement.


  Le niveau n''est pas un score unique. Un élève peut être B1 en lecture ou pour réagir et dialoguer, et A2 dans d''autres
  activités. C''est un profil individualisé. Le niveau dépend de la correction de la langue, du choix du registre, de l''aisance
  à l''oral et de l''étendue du vocabulaire à l''écrit.


  Ne pas confondre avec la LV2 : pour la LV2, l''objectif est A2 dans au moins deux activités langagières (voir la fiche dédiée).


  Au brevet : savoir ranger les niveaux, dire ce qui est visé en LV1, et expliquer qu''un niveau varie selon l''activité.

  '
methode:
- 'Retenir l''ordre des niveaux : A1, A2, B1, B2, C1, C2, du plus simple au plus avancé.'
- Associer A2 à des tâches simples et courtes (se présenter, comprendre des phrases très simples).
- Associer B1 à des tâches plus longues et autonomes (raconter un événement, donner un avis simple).
- 'Se rappeler l''objectif officiel en LV1 : au moins A2 dans les cinq activités, B1 dans plusieurs.'
- Repérer l'activité langagière concernée (écouter, lire, parler, écrire, dialoguer) avant de parler de niveau.
- 'Ne pas conclure qu''un élève a un seul niveau : décrire son profil activité par activité.'
vocabulaire:
- terme: CEFR / CECRL
  definition: l'échelle européenne commune qui classe le niveau en langue de A1 à C2
- terme: level
  definition: le niveau atteint dans une langue, selon cette échelle
- terme: activité langagière
  definition: une des cinq façons d'utiliser une langue (écouter, lire, parler en continu, écrire, dialoguer)
- terme: LV1
  definition: la première langue vivante étudiée, souvent l'anglais
- terme: profil individualisé
  definition: le fait qu'un même élève ait des niveaux différents selon l'activité
- terme: fin de cycle
  definition: le moment où on fait le bilan du cycle 4, en fin de troisième
erreurs_frequentes:
- Croire que le niveau CECRL est le même dans toutes les activités langagières pour un même élève.
- Inverser l'ordre des niveaux (croire que B1 est plus simple que A2).
- Confondre le niveau visé en LV1 (A2 au moins, puis B1 dans plusieurs activités) avec celui visé en LV2 (A2 dans deux activités).
- 'Croire que A2 est un échec : c''est le niveau minimum visé pour tous.'
- 'Croire que le niveau B1 est exigé pour tous en fin de troisième : il est atteint dans plusieurs activités seulement.'
exemple:
  enonce: Un élève comprend bien un texte simple mais hésite encore beaucoup à l'oral. A-t-il forcément le même niveau dans
    les deux activités ?
  solution: 'Non : il peut être à un niveau plus avancé en lecture (par exemple B1) et à un niveau plus simple à l''oral (par
    exemple A2). Le niveau CECRL varie selon les activités langagières, ce n''est pas un score unique.'
exercices:
- id: ordre-niveaux
  type: ordre
  difficulte: 1
  enonce: Range ces niveaux du CECRL du plus simple au plus avancé.
  reponse:
    elements:
    - id: a
      texte: A1
    - id: b
      texte: A2
    - id: c
      texte: B1
  indices:
    relance: La lettre A désigne les niveaux les plus simples, la lettre B des niveaux plus avancés.
    methode: Dans chaque lettre, le chiffre 1 est plus simple que le chiffre 2.
    etape: A1 est le tout premier niveau, avant A2, lui-même avant B1.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux niveaux voisins sont inversés. A1 est-il plus simple ou plus avancé que A2 ?
  - si:
      diagnostic: ordre_faux
    relance: 'Rappelle-toi l''ordre complet : A1, puis A2, puis B1, du plus simple au plus avancé.'
  solution: L'ordre du plus simple au plus avancé est A1, puis A2, puis B1.
- id: niveau-vise-3e
  type: choix
  difficulte: 1
  enonce: En fin de cycle 4, quel est l'objectif minimum en anglais LV1 pour les cinq activités langagières ?
  reponse:
    options:
    - id: a
      texte: Le niveau A2 au moins
    - id: b
      texte: Le niveau C1
    - id: c
      texte: Aucun niveau précis n'est visé
    bonnes:
    - a
  indices:
    relance: 'Relis l''essentiel de la fiche : quel niveau minimum est mentionné pour toutes les activités langagières ?'
    methode: Le niveau visé pour tous les élèves en LV1 est un des tout premiers niveaux du CECRL.
    etape: Ce niveau est plus avancé que A1, mais plus simple que B1.
  pieges:
  - si:
      contient:
      - b
    relance: C1 est un niveau très avancé, bien au-delà de l'objectif de fin de collège. Cherche un niveau plus simple.
  - si:
      contient:
      - c
    relance: 'Un niveau minimum est bien fixé par les textes officiels : ce n''est pas laissé au hasard.'
  solution: L'objectif minimum en fin de cycle 4 pour la LV1 est le niveau A2 dans les cinq activités langagières.
- id: profil-individualise
  type: texte_court
  difficulte: 2
  enonce: Un élève est B1 en lecture ('lire') mais A2 en expression orale ('parler en continu'). Cela signifie-t-il qu'il
    a un niveau CECRL unique pour toutes les activités ? Réponds par 'yes' ou 'no'.
  reponse:
    acceptees:
    - 'no'
    fautes_tolerees: 0
  indices:
    relance: 'Relis l''essentiel : le niveau CECRL est-il toujours le même dans toutes les activités langagières ?'
    methode: Le texte parle d'un profil individualisé, pas d'un niveau transversal uniformisé.
    etape: 'Cet élève a justement deux niveaux différents selon l''activité : lecture et oral.'
  pieges:
  - si:
      valeur: 'yes'
    relance: 'L''exemple donné montre justement deux niveaux différents pour un même élève : lecture et oral. Le niveau est-il
      donc unique ?'
  solution: 'Non (''no'') : le niveau CECRL peut varier selon l''activité langagière pour un même élève, comme le montre cet
    exemple.'
- id: associer-niveau-tache
  type: association
  difficulte: 2
  enonce: Associe chaque niveau à une description simplifiée de ce qu'il permet de faire.
  reponse:
    gauche:
    - id: a
      texte: A2
    - id: b
      texte: B1
    droite:
    - id: x
      texte: Comprendre et produire des phrases simples sur des sujets familiers
    - id: y
      texte: Raconter un événement ou donner un avis simple de façon plus autonome
    paires:
      a: x
      b: y
  indices:
    relance: Lequel des deux niveaux permet des tâches un peu plus longues et autonomes ?
    methode: A2 correspond à des tâches courtes et simples ; B1 permet déjà de raconter ou d'argumenter un peu.
    etape: '''Comprendre et produire des phrases simples'' correspond au niveau le plus proche du début de l''échelle.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une association est fausse. Le niveau qui permet de raconter un événement est-il A2 ou B1 ?
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par repérer quel niveau correspond aux phrases les plus simples : c''est A2.'
  solution: A2 correspond à des phrases simples sur des sujets familiers ; B1 permet de raconter un événement ou de donner
    un avis simple avec plus d'autonomie.
- id: nombre-activites
  type: nombre
  difficulte: 1
  enonce: Combien d'activités langagières le programme du cycle 4 distingue-t-il ?
  reponse:
    valeur: 5
    forme: entier
  indices:
    relance: Cite celles que tu connais, par exemple écouter et lire, puis compte-les.
    methode: Il y a deux activités de réception, deux de production, et une qui associe les deux dans un échange.
    etape: Écouter et comprendre, lire, parler en continu, écrire… Il en reste une qui associe parler et écouter.
  pieges:
  - si:
      valeur: 4
    relance: Il en manque une, celle où l'on réagit à ce que dit l'autre. Laquelle ?
  solution: 'Cinq activités langagières : écouter et comprendre, lire, parler en continu, écrire, réagir et dialoguer (2 +
    2 + 1 = 5).'
- id: niveau-b1-plusieurs
  type: choix
  difficulte: 2
  enonce: Que dit le programme du niveau B1 en LV1 à la fin du cycle 4 ?
  reponse:
    options:
    - id: a
      texte: Il est atteint dans plusieurs activités langagières
    - id: b
      texte: Il est exigé dans les cinq activités pour tous les élèves
    - id: c
      texte: Il est réservé aux élèves qui ont une LV2
    bonnes:
    - a
  indices:
    relance: Le niveau minimum pour tous est un autre niveau que B1.
    methode: Cherche la phrase qui parle de plusieurs activités, sans obliger tous les élèves partout.
    etape: Le programme dit que les activités proposées permettent d'atteindre ce niveau, pas qu'il est imposé partout.
  pieges:
  - si:
      contient:
      - b
    relance: Ce que tous les élèves doivent atteindre dans les cinq activités est le niveau minimum, plus bas que B1.
  - si:
      contient:
      - c
    relance: Le niveau B1 vise la LV1. La LV2 a un objectif différent, plus modeste.
  solution: En LV1, tous les élèves doivent atteindre au moins A2 dans les cinq activités, et les activités proposées permettent
    d'atteindre B1 dans plusieurs d'entre elles.
- id: lv1-ou-lv2
  type: association
  difficulte: 2
  enonce: Associe chaque langue à l'objectif de fin de cycle 4.
  reponse:
    gauche:
    - id: a
      texte: LV1
    - id: b
      texte: LV2
    droite:
    - id: x
      texte: Au moins A2 dans les cinq activités, B1 dans plusieurs
    - id: y
      texte: A2 dans au moins deux activités
    paires:
      a: x
      b: y
  indices:
    relance: La LV1 est étudiée depuis plus longtemps que la LV2.
    methode: La langue étudiée le plus longtemps a l'objectif le plus ambitieux.
    etape: Une des deux descriptions cite le niveau B1, l'autre ne le cite pas.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une association est fausse. Laquelle des deux langues a l'objectif le plus élevé ?
  - si:
      diagnostic: associations_fausses
    relance: Tu as inversé les deux objectifs. Quelle langue est étudiée le plus longtemps ?
  solution: 'LV1 : au moins A2 dans les cinq activités langagières, B1 dans plusieurs. LV2 : A2 dans au moins deux activités.'
- id: expliquer-profil
  type: ouverte
  difficulte: 3
  enonce: Explique en quelques phrases pourquoi on ne peut pas dire qu'un élève « est B1 » sans préciser l'activité langagière,
    et donne un exemple.
  criteres:
  - L'élève explique que le niveau CECRL varie selon l'activité langagière (profil individualisé).
  - L'élève donne un exemple précis avec deux activités et deux niveaux différents (par exemple B1 en lecture et A2 à l'oral).
  - L'élève a une phrase d'introduction et une phrase de conclusion.
  indices:
    relance: Un élève est-il aussi à l'aise pour lire que pour parler ?
    methode: Pose l'idée (le niveau varie), puis donne un exemple avec deux activités, puis conclus.
    etape: Tu peux commencer ainsi « Le niveau n'est pas le même dans toutes les activités… », puis donner ton exemple.
  solution: 'Le niveau CECRL n''est pas un score unique. Un élève peut être B1 en lecture et A2 à l''oral. On parle d''un
    profil individualisé : il faut donc préciser l''activité langagière.'
