# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: niveau-lv2-a2
version: 1
etat: verifiee
declencheurs:
- niveau visé en LV2
- différence entre LV1 et LV2 en anglais
- objectif A2 en langue vivante 2
prerequis:
- niveau-lv1-a2-b1
couverture: Travaille la compréhension du niveau visé en LV2 (A2 dans au moins deux activités) et sa différence avec le niveau
  visé en LV1. Ne couvre pas le choix des langues LV2 ni leur enseignement spécifique.
essentiel: 'En 3e, un élève étudie généralement deux langues vivantes : la LV1 (souvent l''anglais) commencée plus tôt, et

  la LV2 (souvent l''espagnol, l''allemand ou une autre langue) commencée plus tard, en général en 5e.


  Comme la LV2 est étudiée depuis moins longtemps, l''objectif de niveau est plus modeste que pour la LV1 : le

  niveau A2 du CECRL est visé dans au moins deux des cinq activités langagières, et non dans les cinq comme pour

  la LV1.


  Cette différence ne signifie pas que la LV2 est moins importante, mais qu''elle bénéficie de moins d''heures

  d''apprentissage cumulées au moment de la 3e.

  '
methode:
- Distinguer la LV1 (commencée plus tôt, objectif plus élevé) de la LV2 (commencée plus tard, objectif plus modeste).
- Retenir que l'objectif LV2 porte sur au moins deux activités langagières, pas sur les cinq.
- Comparer le nombre d'années d'apprentissage entre LV1 et LV2 pour comprendre l'écart d'objectif.
- 'Ne pas confondre ''objectif plus modeste'' avec ''langue moins utile'' : c''est une différence de temps d''apprentissage,
  pas d''importance.'
- Vérifier, en cas de doute, le nombre d'activités langagières concernées par chaque objectif (cinq pour LV1, deux pour LV2).
vocabulaire:
- terme: LV1 / LV2
  definition: première langue vivante étudiée (LV1) et deuxième langue vivante étudiée (LV2), commencée plus tard
- terme: target level
  definition: le niveau visé, l'objectif à atteindre dans une langue
erreurs_frequentes:
- Croire que l'objectif A2 en LV2 porte sur les cinq activités langagières, comme pour la LV1.
- Penser que la LV2 est moins importante parce que son objectif de niveau est plus modeste.
- Confondre le nombre minimum d'activités concernées (deux) avec le nombre total d'activités langagières (cinq).
exemple:
  enonce: Un élève est A2 en 'lire' et en 'écouter et comprendre' dans sa LV2. A-t-il atteint l'objectif visé pour cette langue
    ?
  solution: 'Oui : l''objectif pour la LV2 est le niveau A2 dans au moins deux activités langagières, ce qui est bien le cas
    ici (lire et écouter).'
exercices:
- id: nombre-activites-lv2
  type: choix
  difficulte: 1
  enonce: Pour la LV2, le niveau A2 est visé dans combien d'activités langagières au minimum ?
  reponse:
    options:
    - id: a
      texte: Deux
    - id: b
      texte: Cinq
    - id: c
      texte: Aucune en particulier
    bonnes:
    - a
  indices:
    relance: 'Relis l''essentiel de la fiche : quel nombre précis est donné pour la LV2 ?'
    methode: Ce nombre est plus petit que le nombre total des cinq activités langagières.
    etape: Ce nombre est plus petit que celui prévu pour la LV1, qui concerne toutes les activités.
  pieges:
  - si:
      contient:
      - b
    relance: Cinq activités, c'est l'objectif pour la LV1, pas pour la LV2. Cherche le nombre plus petit prévu pour la LV2.
  - si:
      contient:
      - c
    relance: 'Un nombre précis est bien fixé pour la LV2 : ce n''est pas laissé au hasard.'
  solution: Pour la LV2, le niveau A2 est visé dans au moins deux activités langagières.
- id: difference-lv1-lv2
  type: texte_court
  difficulte: 1
  enonce: Laquelle de LV1 ou LV2 vise un niveau A2 dans les cinq activités langagières ? Réponds 'LV1' ou 'LV2'.
  reponse:
    acceptees:
    - lv1
    fautes_tolerees: 0
  indices:
    relance: 'Relis les deux fiches sur les niveaux visés : laquelle mentionne les cinq activités ?'
    methode: La langue commencée plus tôt a l'objectif le plus complet.
    etape: Compare le nombre d'années d'apprentissage cumulées de chaque langue au moment de la 3e.
  pieges:
  - si:
      valeur: lv2
    relance: La LV2 vise A2 dans deux activités seulement, pas dans les cinq. Cherche l'autre langue.
  solution: C'est la LV1 qui vise le niveau A2 (puis B1) dans les cinq activités langagières.
- id: raison-objectif-modeste
  type: choix
  difficulte: 2
  enonce: Pourquoi l'objectif de niveau en LV2 est-il plus modeste qu'en LV1 ?
  reponse:
    options:
    - id: a
      texte: Parce que la LV2 est commencée plus tard, avec moins d'années d'apprentissage cumulées
    - id: b
      texte: Parce que la LV2 est une langue moins utile dans le monde
    - id: c
      texte: Parce que les élèves ne sont pas notés en LV2
    bonnes:
    - a
  indices:
    relance: Pense au moment où commence l'apprentissage de chaque langue au collège.
    methode: Un objectif de niveau dépend souvent du temps d'apprentissage disponible avant l'évaluation.
    etape: 'La LV1 commence en général plus tôt que la LV2 : elle a donc plus d''années pour progresser.'
  pieges:
  - si:
      contient:
      - b
    relance: L'utilité d'une langue dans le monde n'est pas ce qui explique la différence d'objectif ici. Pense plutôt au
      temps d'apprentissage.
  - si:
      contient:
      - c
    relance: 'Les deux langues sont bien évaluées au collège. La différence vient d''ailleurs : du temps d''apprentissage.'
  solution: L'objectif est plus modeste en LV2 car cette langue est commencée plus tard, avec moins d'années d'apprentissage
    cumulées au moment de la 3e.
- id: valider-cas-eleve
  type: ouverte
  difficulte: 2
  enonce: Un élève est A2 en 'écrire' et en 'parler en continu' dans sa LV2. Explique en une ou deux phrases si l'objectif
    visé pour sa LV2 est atteint, et pourquoi.
  criteres:
  - Affirme que l'objectif est atteint (ou reconnaît que deux activités en A2 suffisent).
  - Justifie en mentionnant que l'objectif LV2 porte sur au moins deux activités langagières.
  indices:
    relance: Compte le nombre d'activités langagières où l'élève est déjà A2 dans cet exemple.
    methode: Compare ce nombre au minimum exigé pour la LV2, expliqué dans l'essentiel de la fiche.
    etape: 'L''élève est A2 dans deux activités précises : écrire et parler en continu.'
  solution: 'Oui, l''objectif est atteint : l''élève est A2 dans deux activités langagières (''écrire'' et ''parler en continu''),
    ce qui correspond exactement au minimum demandé pour la LV2.'
- id: nblm-en-classe-de-3e-dans-combien-d-activites-1
  type: choix
  difficulte: 2
  enonce: En classe de 3e, dans combien d'activités langagières au minimum le niveau A2 est-il visé pour la LV2 ?
  reponse:
    options:
    - id: o1
      texte: Au moins deux activités
    - id: o2
      texte: Dans les cinq activités
    - id: o3
      texte: Dans une seule activité
    - id: o4
      texte: Dans aucune activité
    bonnes:
    - o1
  indices:
    relance: Pense au nombre minimum d'activités langagières requises en LV2 comparativement aux 5 activités de la LV1.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : viser le niveau A2 dans l''ensemble des cinq activités langagières est l''objectif de la
      LV1, pas de la LV2.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : il existe bien un objectif officiel de niveau A2 fixé pour la LV2 en fin de classe de 3e.'
  solution: 'Au moins deux activités. C''est exact : l''objectif de niveau en LV2 est d''atteindre le niveau A2 du CECRL dans
    au moins deux des cinq activités langagières.'
- id: nblm-pourquoi-l-objectif-de-niveau-en-3e-est-2
  type: choix
  difficulte: 2
  enonce: Pourquoi l'objectif de niveau en 3e est-il plus modeste pour la LV2 que pour la LV1 ?
  reponse:
    options:
    - id: o1
      texte: Car la LV2 bénéficie de moins d'heures d'apprentissage cumulées
    - id: o2
      texte: Car la LV2 est une matière moins importante au collège
    - id: o3
      texte: Car la LV2 n'est pas évaluée au collège
    - id: o4
      texte: Car le niveau A2 est réservé uniquement à la LV1
    bonnes:
    - o1
  indices:
    relance: Réfléchis au nombre d'années d'apprentissage accumulées depuis le début du collège pour chaque langue.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''objectif plus modeste s''explique par le temps d''apprentissage cumulé et non par une
      différence d''importance.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la LV2 fait pleinement partie des compétences travaillées et évaluées au collège.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : le niveau A2 est bien le niveau cible visé en LV2 (pour au moins deux activités).'
  solution: 'Car la LV2 bénéficie de moins d''heures d''apprentissage cumulées. C''est exact : la LV2 étant commencée plus
    tard (en 5e), elle compte moins d''heures d''apprentissage cumulées en 3e que la LV1.'
- id: nblm-en-regle-generale-dans-quelle-classe-du-3
  type: choix
  difficulte: 2
  enonce: En règle générale, dans quelle classe du collège débute l'apprentissage de la LV2 ?
  reponse:
    options:
    - id: o1
      texte: En classe de 5e
    - id: o2
      texte: En classe de 6e
    - id: o3
      texte: En classe de 3e
    - id: o4
      texte: En classe de 4e
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'année du collège où tu as commencé ta deuxième langue vivante.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion fréquente : la classe de 6e est le moment où l''on poursuit la LV1 commencée dès le primaire.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la classe de 3e correspond à l''année du bilan de fin de collège, la LV2 y est déjà étudiée depuis
      deux ans.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : depuis la réforme du collège, le début de la LV2 a été avancé de la classe de 4e à la classe
      de 5e.'
  solution: 'En classe de 5e. C''est exact : la deuxième langue vivante (LV2) est généralement commencée en classe de 5e.'
- id: nblm-un-eleve-de-3e-obtient-le-niveau-a2-en-l-4
  type: choix
  difficulte: 2
  enonce: Un élève de 3e obtient le niveau A2 en 'lire' et en 'écouter et comprendre' en LV2. A-t-il atteint l'objectif visé
    ?
  reponse:
    options:
    - id: o1
      texte: Oui, car il est A2 dans au moins deux activités langagières
    - id: o2
      texte: Non, car il doit obligatoirement être A2 à l'expression orale
    - id: o3
      texte: Non, car il doit obligatoirement atteindre A2 dans les cinq activités
    - id: o4
      texte: Oui, mais seulement s'il est aussi niveau B1 en lecture
    bonnes:
    - o1
  indices:
    relance: Compte combien d'activités langagières sont validées au niveau A2 dans cet exemple.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : l''objectif exige la maîtrise du niveau A2 dans au moins deux activités, quelles qu''elles soient.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : la validation des cinq activités langagières au niveau A2 correspond à l''exigence de la
      LV1.'
  - si:
      contient:
      - o4
    relance: 'Inexact : le niveau B1 peut être visé en LV1, mais n''est pas requis pour valider l''objectif A2 en LV2.'
  solution: 'Oui, car il est A2 dans au moins deux activités langagières. C''est exact : avoir le niveau A2 dans deux activités
    langagières (ici lire et écouter) suffit à valider l''objectif visé en LV2.'
- id: nblm-que-designe-l-expression-anglaise-target-5
  type: choix
  difficulte: 2
  enonce: Que désigne l'expression anglaise 'target level' selon le vocabulaire de la fiche ?
  reponse:
    options:
    - id: o1
      texte: Le niveau visé ou l'objectif à atteindre dans une langue
    - id: o2
      texte: Le niveau initial de l'élève en début de collège
    - id: o3
      texte: La note globale obtenue à l'épreuve du brevet
    - id: o4
      texte: Le niveau de maîtrise de la langue maternelle
    bonnes:
    - o1
  indices:
    relance: Le mot 'target' signifie 'cible' ou 'objectif' en anglais.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : cela désignerait le niveau de départ et non le ''target level'' (niveau cible).'
  - si:
      contient:
      - o3
    relance: 'Confusion : le ''target level'' concerne les échelons de compétences du CECRL (A1, A2, B1), pas une note chiffrée.'
  - si:
      contient:
      - o4
    relance: 'Inexact : cette notion s''applique aux langues vivantes étrangères étudiées par l''élève.'
  solution: 'Le niveau visé ou l''objectif à atteindre dans une langue. C''est exact : ''target level'' se traduit par le
    niveau cible ou l''objectif de compétence visé dans la langue.'
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations exactes concernant les objectifs de la LV1 et de la LV2 en 3e ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: L'objectif A2 en LV1 porte sur l'ensemble des cinq activités langagières
    - id: o2
      texte: L'objectif A2 en LV2 porte sur au moins deux activités langagières
    - id: o3
      texte: La LV2 exige un niveau plus élevé que la LV1 en fin de 3e
    - id: o4
      texte: L'objectif A2 en LV2 doit obligatoirement être validé dans les cinq activités
    bonnes:
    - o1
    - o2
  indices:
    relance: Compare le nombre d'activités langagières exigées pour la LV1 et pour la LV2.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : la LV1 vise un niveau plus élevé (A2 dans 5 activités et vers B1) que la LV2.'
  - si:
      contient:
      - o4
    relance: 'Confusion fréquente : l''obligation de valider les 5 activités au niveau A2 concerne la LV1, pas la LV2.'
  solution: 'L''objectif A2 en LV1 porte sur l''ensemble des cinq activités langagières ; L''objectif A2 en LV2 porte sur
    au moins deux activités langagières. C''est exact : en LV1, le niveau A2 est visé dans la totalité des 5 activités langagières.'
- id: nblm-en-lv2-le-niveau-a2-doit-etre-atteint-da-7
  type: texte_court
  difficulte: 1
  enonce: En LV2, le niveau A2 doit être atteint dans au moins combien d'activités langagières en 3e ? (écris le nombre en
    lettres)
  reponse:
    acceptees:
    - deux
    fautes_tolerees: 1
  indices:
    relance: C'est le nombre minimum d'activités requis pour la LV2 (un mot de 4 lettres).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: deux. L'objectif pour la LV2 est d'atteindre le niveau A2 du CECRL dans au moins deux activités langagières.
- id: nblm-quelle-est-l-abreviation-officielle-desi-8
  type: texte_court
  difficulte: 1
  enonce: Quelle est l'abréviation officielle désignant la seconde langue vivante étudiée au collège ?
  reponse:
    acceptees:
    - LV2
    fautes_tolerees: 1
  indices:
    relance: Il s'agit du sigle courant composé de deux lettres et d'un chiffre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: LV2. LV2 est le sigle utilisé pour 'Langue Vivante 2', la seconde langue étrangère apprise à partir de la 5e.
