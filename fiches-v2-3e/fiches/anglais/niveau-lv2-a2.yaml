# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: niveau-lv2-a2
version: 2
etat: verifiee
declencheurs:
- niveau visé en LV2
- différence entre LV1 et LV2 en anglais
- objectif A2 en langue vivante 2
- niveau attendu en LV2 au collège
- combien d'activités pour A2
- niveaux A1 A2 B1 en langue
- objectif de fin de cycle 4 en LV2
prerequis:
- niveau-lv1-a2-b1
couverture: Travaille la compréhension du niveau visé en LV2 (A2 dans au moins deux activités) et sa différence avec le niveau
  visé en LV1. Ne couvre pas le choix des langues LV2 ni leur enseignement spécifique.
essentiel: 'Au cycle 4, le niveau visé s''appuie sur le CECRL, le cadre européen qui décrit les niveaux en langue : A1, A2,
  B1, B2, C1, C2. A2 est un niveau élémentaire : on comprend des phrases simples sur des sujets familiers et on communique
  dans des situations courantes.


  Les cinq activités langagières sont : écouter et comprendre, lire, parler en continu, écrire, réagir et dialoguer.


  En 3e, un élève étudie souvent deux langues vivantes. La LV1 (souvent l''anglais) est commencée plus tôt, dès l''école primaire.
  La LV2 (espagnol, allemand, italien...) est commencée plus tard, en général en 5e. Les deux langues suivent les mêmes thèmes
  culturels et les mêmes activités langagières.


  Le niveau visé en fin de cycle 4 est différent.

  - En LV1 : le niveau A2 puis B1. C''est un objectif plus élevé.

  - En LV2 : le niveau A2 dans au moins deux activités langagières. « Au moins deux » veut dire deux, trois, quatre ou cinq.
  C''est un minimum, pas un plafond.


  Pourquoi cet écart ? La LV2 est étudiée depuis moins longtemps : elle bénéficie de moins d''années d''apprentissage cumulées.
  Cela ne veut pas dire qu''elle est moins importante ni moins utile.


  Comment lire un cas. On compte les activités où l''élève atteint A2. Par exemple : A2 en lire et en écouter, donc deux activités,
  donc l''objectif LV2 est atteint. S''il n''est A2 que dans une seule activité, l''objectif n''est pas encore atteint.


  Ce qu''on attend de toi : savoir dire quel niveau est visé en LV1 et en LV2, expliquer l''écart, et juger un cas à partir
  du nombre d''activités où le niveau A2 est atteint.

  '
methode:
- 'Repérer la langue concernée : LV1 (commencée plus tôt) ou LV2 (commencée plus tard).'
- 'Se rappeler l''objectif : A2 puis B1 en LV1 ; A2 dans au moins deux activités langagières en LV2.'
- Lister les cinq activités langagières et compter celles où l'élève est au niveau A2.
- 'Comparer ce nombre au minimum de deux et conclure : atteint ou pas encore atteint.'
- Expliquer l'écart LV1 / LV2 par le temps d'apprentissage, jamais par l'importance de la langue.
vocabulaire:
- terme: LV1 / LV2
  definition: première langue vivante étudiée (LV1) et deuxième langue vivante étudiée (LV2), commencée plus tard
- terme: target level
  definition: le niveau visé, l'objectif à atteindre dans une langue
- terme: CECRL
  definition: Cadre européen commun de référence pour les langues, qui classe les niveaux de A1 à C2
- terme: A2
  definition: 'niveau élémentaire du CECRL : phrases simples sur des sujets familiers'
- terme: B1
  definition: niveau intermédiaire du CECRL, supérieur à A2
- terme: activité langagière
  definition: 'une des cinq façons d''utiliser une langue : écouter, lire, parler en continu, écrire, dialoguer'
erreurs_frequentes:
- Croire que l'objectif A2 en LV2 porte sur les cinq activités langagières.
- Penser que la LV2 est moins importante parce que son objectif de niveau est plus modeste.
- Confondre le minimum d'activités concernées (deux) avec le nombre total d'activités langagières (cinq).
- Croire que « au moins deux » interdit d'avoir A2 dans trois activités.
exemple:
  enonce: Un élève est A2 en 'lire' et en 'écouter et comprendre' dans sa LV2. A-t-il atteint l'objectif visé pour cette langue
    ?
  solution: 'Oui : l''objectif pour la LV2 est le niveau A2 dans au moins deux activités langagières, ce qui est bien le cas
    ici (lire et écouter).'
exercices:
- id: nombre-activites-lv2
  type: choix
  difficulte: 1
  enonce: Pour la LV2, le niveau A2 est visé dans combien d'activités langagières au minimum ?
  reponse:
    options:
    - id: a
      texte: Deux
    - id: b
      texte: Cinq
    - id: c
      texte: Aucune en particulier
    bonnes:
    - a
  indices:
    relance: 'Relis l''essentiel de la fiche : quel nombre précis est donné pour la LV2 ?'
    methode: Ce nombre est plus petit que le nombre total des activités langagières, qui est cinq.
    etape: Ce nombre est plus petit que le nombre total des activités langagières.
  pieges:
  - si:
      contient:
      - b
    relance: Cinq est le nombre total d'activités langagières, pas le minimum demandé en LV2. Cherche le nombre plus petit.
  - si:
      contient:
      - c
    relance: 'Un nombre précis est bien fixé pour la LV2 : ce n''est pas laissé au hasard.'
  solution: Pour la LV2, le niveau A2 est visé dans au moins deux activités langagières (sur cinq).
- id: difference-lv1-lv2
  type: texte_court
  difficulte: 1
  enonce: Laquelle de LV1 ou LV2 vise le niveau le plus élevé en fin de cycle 4 (A2 puis B1) ? Réponds 'LV1' ou 'LV2'.
  reponse:
    acceptees:
    - lv1
    fautes_tolerees: 0
  indices:
    relance: 'Relis l''essentiel : quelle langue est commencée le plus tôt, et donc a l''objectif le plus élevé ?'
    methode: La langue commencée plus tôt a l'objectif le plus élevé.
    etape: Compare le nombre d'années d'apprentissage cumulées de chaque langue au moment de la 3e.
  pieges:
  - si:
      valeur: lv2
    relance: La LV2 vise A2 dans deux activités au moins, un objectif plus modeste. Cherche l'autre langue.
  solution: 'C''est la LV1 qui vise le niveau le plus élevé : A2 puis B1. La LV2 vise A2 dans au moins deux activités.'
- id: raison-objectif-modeste
  type: choix
  difficulte: 2
  enonce: Pourquoi l'objectif de niveau en LV2 est-il plus modeste qu'en LV1 ?
  reponse:
    options:
    - id: a
      texte: Parce que la LV2 est commencée plus tard, avec moins d'années d'apprentissage cumulées
    - id: b
      texte: Parce que la LV2 est une langue moins utile dans le monde
    - id: c
      texte: Parce que les élèves ne sont pas notés en LV2
    bonnes:
    - a
  indices:
    relance: Pense au moment où commence l'apprentissage de chaque langue au collège.
    methode: Un objectif de niveau dépend souvent du temps d'apprentissage disponible avant l'évaluation.
    etape: 'La LV1 commence en général plus tôt que la LV2 : elle a donc plus d''années pour progresser.'
  pieges:
  - si:
      contient:
      - b
    relance: L'utilité d'une langue dans le monde n'est pas ce qui explique la différence d'objectif ici. Pense plutôt au
      temps d'apprentissage.
  - si:
      contient:
      - c
    relance: 'Les deux langues sont bien évaluées au collège. La différence vient d''ailleurs : du temps d''apprentissage.'
  solution: L'objectif est plus modeste en LV2 car cette langue est commencée plus tard, avec moins d'années d'apprentissage
    cumulées au moment de la 3e.
- id: valider-cas-eleve
  type: ouverte
  difficulte: 2
  enonce: Un élève est A2 en 'écrire' et en 'parler en continu' dans sa LV2. Explique en une ou deux phrases si l'objectif
    visé pour sa LV2 est atteint, et pourquoi.
  criteres:
  - Affirme que l'objectif est atteint (ou reconnaît que deux activités en A2 suffisent).
  - Justifie en mentionnant que l'objectif LV2 porte sur au moins deux activités langagières.
  indices:
    relance: Compte le nombre d'activités langagières où l'élève est déjà A2 dans cet exemple.
    methode: Compare ce nombre au minimum exigé pour la LV2, expliqué dans l'essentiel de la fiche.
    etape: 'L''élève est A2 dans deux activités précises : écrire et parler en continu.'
  solution: 'Oui, l''objectif est atteint : l''élève est A2 dans deux activités langagières (''écrire'' et ''parler en continu''),
    ce qui correspond exactement au minimum demandé pour la LV2.'
- id: compter-activites
  type: nombre
  difficulte: 1
  enonce: 'Les cinq activités langagières sont : écouter, lire, parler en continu, écrire, réagir et dialoguer. Combien d''activités
    langagières y a-t-il en tout ?'
  reponse:
    valeur: 5
    forme: entier
  indices:
    relance: Compte les activités citées dans l'énoncé, une par une.
    methode: 'Sépare bien chaque activité : ''réagir et dialoguer'' est une seule activité.'
    etape: Numérote-les de 1 à la dernière.
  pieges:
  - si:
      valeur: 6
    relance: Tu as compté un mot de trop. 'Réagir et dialoguer' forme une seule activité.
  - si:
      valeur: 2
    relance: Deux est le minimum pour la LV2, mais on demande le nombre total d'activités.
  solution: 'Écouter (1), lire (2), parler en continu (3), écrire (4), réagir et dialoguer (5) : 5 activités.'
- id: cas-eleve-lv2
  type: choix
  difficulte: 2
  enonce: 'Quel élève a atteint l''objectif LV2 ? a : A2 seulement en lire ; b : A2 en lire, écrire et écouter ; c : B1 en
    lire mais aucun niveau A2 ailleurs.'
  reponse:
    options:
    - id: a
      texte: A2 seulement en lire
    - id: b
      texte: A2 en lire, écrire et écouter
    - id: c
      texte: B1 en lire, rien ailleurs
    bonnes:
    - b
  indices:
    relance: Compte pour chaque élève le nombre d'activités où il atteint au moins A2.
    methode: L'objectif LV2 est A2 dans au moins deux activités. Un niveau supérieur dans une seule activité ne compte que
      pour une activité.
    etape: Un seul élève a au moins deux activités au niveau A2.
  pieges:
  - si:
      contient:
      - a
    relance: Une seule activité, c'est moins que le minimum demandé.
  - si:
      contient:
      - c
    relance: Un très bon niveau dans une seule activité ne remplace pas la deuxième activité.
  solution: 'b : trois activités au niveau A2 (lire, écrire, écouter), au-dessus du minimum de deux. Les autres élèves n''ont
    qu''une activité.'
- id: niveaux-vises
  type: association
  difficulte: 2
  enonce: Associe chaque situation au niveau visé en fin de cycle 4.
  reponse:
    gauche:
    - id: a
      texte: LV1
    - id: b
      texte: LV2
    droite:
    - id: x
      texte: A2 puis B1
    - id: y
      texte: A2 dans au moins deux activités langagières
    paires:
      a: x
      b: y
  indices:
    relance: 'Une des deux langues est commencée plus tôt : son objectif est plus élevé.'
    methode: La LV2 est associée à un nombre minimum d'activités. L'autre langue est associée à deux niveaux.
    etape: Associe d'abord l'objectif qui parle d'activités langagières.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis-les une par une et repère celle qui ne convient pas.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Commence par celle dont tu es le plus sûr, puis avance par élimination.
  solution: 'LV1 : A2 puis B1. LV2 : A2 dans au moins deux activités langagières.'
