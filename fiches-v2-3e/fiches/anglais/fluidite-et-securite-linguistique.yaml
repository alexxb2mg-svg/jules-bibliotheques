format: 2
notion: fluidite-et-securite-linguistique
version: 2
etat: generee
declencheurs:
- intonation montante question anglais
- formes contractees anglais
- reformuler en anglais sans mot
- parler anglais sans accent natif
- strategies pour ne pas bloquer en anglais
- être compris en anglais
- oser parler anglais
- prononciation et accent
prerequis:
- regularites-langue-orale
essentiel: |
  En anglais oral, l'objectif n'est pas d'avoir un accent parfait de locuteur natif. Le programme vise trois choses : la fluidité (parler sans trop s'arrêter), l'intelligibilité (être compris facilement) et la sécurité linguistique personnelle (oser parler, même avec de petites erreurs).

  Avoir un accent français est normal. Ce qui compte, c'est que l'interlocuteur comprenne.

  Intonation. Les questions fermées (réponse yes ou no) ont souvent une intonation montante à la fin : Are you ready ? ⤴. Les questions ouvertes, avec un mot interrogatif (what, where, why, who…), ont souvent une intonation descendante : Where do you live ? ⤵. C'est une tendance générale, pas une règle absolue.

  Accent de mot et de phrase. Chaque mot de plusieurs syllabes a une syllabe plus forte (photograph : la première). Dans une phrase, on appuie sur les mots importants (noms, verbes, adjectifs) et on prononce vite les petits mots (a, of, to).

  Formes contractées. À l'oral, on contracte souvent : I'm (I am), don't (do not), can't (cannot), it's (it is), they're (they are). L'apostrophe remplace des lettres manquantes. Cela rend la parole plus naturelle et plus fluide.

  Stratégies pour ne pas bloquer. Quand un mot manque, on ne s'arrête pas : on reformule avec un mot plus simple, on décrit l'objet (the thing you use to…), on demande de l'aide (How do you say … ?) ou on se corrige en disant « I mean… ». On peut aussi demander de répéter : Sorry, could you say that again ?

  Au brevet : savoir choisir une intonation, produire des formes contractées et réagir à un blocage à l'oral.
methode:
- Pour choisir l'intonation d'une question, vérifie si elle attend yes/no (montante) ou une information précise avec un mot interrogatif (descendante).
- Pour reconnaître une forme contractée, cherche l'apostrophe qui remplace des lettres manquantes.
- Pour un mot long, repère la syllabe la plus forte et appuie dessus.
- Face à un blocage, essaie d'abord de reformuler avec des mots plus simples plutôt que de t'arrêter.
- Si tu ne comprends pas, demande de répéter en anglais (Sorry, could you say that again ?).
- 'Parle sans attendre d''être parfait : vise d''abord à être compris.'
vocabulaire:
- terme: intelligibility
  definition: le fait d'être compris facilement par son interlocuteur
- terme: fluency
  definition: la fluidité, le fait de parler sans trop s'arrêter
- terme: linguistic confidence
  definition: la sécurité linguistique, le fait d'oser parler sans avoir peur de l'erreur
- terme: contraction
  definition: une forme contractée, comme I'm, don't, can't
- terme: rephrasing
  definition: le fait de reformuler autrement quand un mot manque
- terme: intonation
  definition: la mélodie de la voix qui monte ou descend dans une phrase
- terme: stress
  definition: l'accent de mot, la syllabe prononcée plus fort
erreurs_frequentes:
- Croire qu'il faut imiter parfaitement un accent natif pour bien parler anglais.
- S'arrêter complètement de parler dès qu'un mot manque, au lieu de reformuler.
- Utiliser une intonation montante pour toutes les questions, même celles avec un mot interrogatif (what, where…).
- 'Avoir peur de faire des fautes et se taire : l''objectif est d''être compris.'
exemple:
  enonce: Quelle intonation utiliser pour la question "Are you coming?"
  solution: Une intonation montante, car c'est une question fermee qui attend une reponse "yes" ou "no".
exercices:
- id: intonation-question-fermee
  type: choix
  difficulte: 1
  enonce: Quelle intonation utilise-t-on generalement pour la question "Do you like pizza?"
  reponse:
    options:
    - id: a
      texte: Intonation montante
    - id: b
      texte: Intonation descendante
    bonnes:
    - a
  indices:
    relance: Cette question attend-elle une reponse "yes/no" ou une information precise ?
    methode: Les questions fermees (yes/no) ont generalement une intonation qui monte a la toute fin de la phrase.
    etape: '"Do you like pizza?" n''a pas de mot interrogatif (what, where...) : c''est une question fermee.'
  pieges:
  - si:
      contient:
      - b
    relance: L'intonation descendante s'utilise plutot pour les questions avec un mot interrogatif comme "what" ou "where". Ici, c'est une question fermee.
  solution: On utilise une intonation montante, car "Do you like pizza?" est une question fermee qui attend yes ou no.
- id: intonation-question-ouverte
  type: choix
  difficulte: 1
  enonce: Quelle intonation utilise-t-on generalement pour la question "Where do you live?"
  reponse:
    options:
    - id: a
      texte: Intonation montante
    - id: b
      texte: Intonation descendante
    bonnes:
    - b
  indices:
    relance: 'Cette question commence par un mot interrogatif : "where".'
    methode: Les questions ouvertes avec un mot interrogatif ont generalement une intonation qui baisse a la toute fin de la phrase.
    etape: '"Where" indique que la personne attend une information precise, pas un simple oui ou non.'
  pieges:
  - si:
      contient:
      - a
    relance: L'intonation montante s'utilise plutot pour les questions fermees (yes/no). Ici, "where" introduit une question ouverte.
  solution: On utilise une intonation descendante, car "Where do you live?" est une question ouverte avec un mot interrogatif.
- id: forme-contractee
  type: texte_court
  difficulte: 1
  enonce: Ecris la forme contractee de "I am not ready".
  reponse:
    acceptees:
    - I'm not ready
    fautes_tolerees: 0
  indices:
    relance: 'Deux mots peuvent se contracter dans cette phrase : lesquels ?'
    methode: '"I am" se contracte souvent en "I''m" a l''oral.'
    etape: Remplace "I am" par "I'm" et garde le reste de la phrase inchange.
  pieges:
  - si:
      valeur: I am not ready
    relance: 'Ce n''est pas encore une forme contractee : il faut fusionner "I" et "am" avec une apostrophe.'
  solution: La forme contractee est "I'm not ready".
- id: strategie-reformulation
  type: association
  difficulte: 2
  enonce: Associe chaque situation a la bonne strategie de reformulation.
  reponse:
    gauche:
    - id: a
      texte: Tu ne connais pas le mot exact pour un objet
    - id: b
      texte: Tu te trompes en parlant et veux te corriger
    droite:
    - id: x
      texte: Decrire l'objet avec des mots simples (the thing you use to...)
    - id: y
      texte: Dire "I mean..." puis donner la bonne information
    paires:
      a: x
      b: y
  indices:
    relance: Une des strategies sert a decrire un objet inconnu, l'autre sert a se corriger.
    methode: Pense a ce que tu ferais en francais si tu cherchais un mot ou si tu te trompais.
    etape: Decrire un objet et se corriger sont deux situations differentes qui demandent deux strategies differentes.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Relis bien les deux situations proposees avant d'associer chaque strategie.
  solution: Pour un mot inconnu, on decrit l'objet avec des mots simples ; pour se corriger, on dit "I mean..." puis on donne la bonne information.
- id: presentation-orale-fluide
  type: ouverte
  difficulte: 3
  enonce: En anglais, ecris trois phrases pour te presenter a l'oral en utilisant au moins deux formes contractees differentes (par exemple I am, do not, cannot).
  criteres:
  - Les trois phrases sont ecrites en anglais, avec un sujet et un verbe conjugue.
  - Au moins deux formes contractees differentes sont utilisees correctement.
  - Les phrases restent simples et comprehensibles (intelligibles).
  indices:
    relance: Comment dirais-tu "je suis" et "je n'aime pas" en forme contractee ?
    methode: Commence par te presenter avec la forme contractee de "I am", puis ajoute un gout avec la forme contractee de "do not".
    etape: Tu peux commencer par une phrase sur ton age, puis continuer avec une phrase sur ce que tu n'aimes pas.
  solution: 'Exemple possible : « I''m thirteen years old. I don''t like football, but I love music. I can''t play the guitar yet. »'
- id: bonne-attitude-orale
  type: choix
  difficulte: 1
  enonce: Selon le programme, que vise-t-on à l'oral en anglais ?
  reponse:
    options:
    - id: a
      texte: Être compris et parler avec assurance
    - id: b
      texte: Avoir exactement l'accent d'un locuteur natif
    - id: c
      texte: Ne jamais faire la moindre faute
    bonnes:
    - a
  indices:
    relance: Relis le début de l'essentiel.
    methode: Le programme cite la fluidité, l'intelligibilité et la sécurité linguistique.
    etape: Deux propositions demandent d'être parfait. Une seule demande d'être compris.
  pieges:
  - si:
      contient:
      - b
    relance: Le programme dit justement de ne pas viser l'accent natif.
  - si:
      contient:
      - c
    relance: Le programme accepte de petites erreurs, si on reste compris.
  solution: On vise la fluidité, l'intelligibilité et la sécurité linguistique, pas l'accent natif.
- id: reformuler-un-mot
  type: choix
  difficulte: 2
  enonce: Tu veux dire « a fork » mais tu as oublié le mot. Quelle est la meilleure stratégie ?
  reponse:
    options:
    - id: a
      texte: Dire « the thing you use to eat »
    - id: b
      texte: Ne plus rien dire
    - id: c
      texte: Parler en français
    bonnes:
    - a
  indices:
    relance: Le but est de continuer à te faire comprendre.
    methode: Décris l'objet avec des mots simples que tu connais.
    etape: Une proposition est en anglais et décrit l'objet. Les deux autres arrêtent la conversation.
  pieges:
  - si:
      contient:
      - b
    relance: Se taire arrête la conversation. Essaie de contourner le mot manquant.
  - si:
      contient:
      - c
    relance: L'interlocuteur risque de ne pas comprendre le français. Reste en anglais.
  solution: On décrit l'objet en anglais (« the thing you use to eat »).
- id: parler-sans-bloquer
  type: ouverte
  difficulte: 3
  enonce: En anglais, écris un petit dialogue de quatre répliques où tu ne connais pas un mot et où tu utilises une stratégie pour continuer à parler.
  criteres:
  - Le dialogue est écrit en anglais, avec des phrases simples et compréhensibles.
  - Une stratégie est utilisée (décrire, I mean…, demander de l'aide, faire répéter).
  - Au moins une forme contractée est utilisée correctement.
  indices:
    relance: Quel objet ou quelle idée te manque en anglais ?
    methode: Réplique 1, tu parles. Réplique 2, tu bloques et tu utilises une stratégie. Réplique 3, on t'aide. Réplique 4, tu remercies.
    etape: Tu peux commencer par « I need the thing you use to… » puis continuer.
  solution: 'Exemple possible : « A: I can''t find my … the thing you use to write. B: Do you mean a pen? A: Yes, a pen! Thanks. B: You''re welcome. »'
