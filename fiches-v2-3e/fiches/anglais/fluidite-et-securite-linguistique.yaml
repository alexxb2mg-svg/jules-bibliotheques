# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: fluidite-et-securite-linguistique
version: 1
etat: verifiee
declencheurs:
- intonation montante question anglais
- formes contractees anglais
- reformuler en anglais sans mot
- parler anglais sans accent natif
- strategies pour ne pas bloquer en anglais
prerequis:
- regularites-langue-orale
couverture: Traite l'intonation des questions, les formes contractees a l'oral et les strategies de reformulation pour continuer
  a parler sans bloquer. Ne couvre pas l'evaluation detaillee de la prononciation individuelle de l'eleve.
essentiel: 'En anglais, l''objectif n''est pas d''avoir un accent parfait comme un locuteur natif,

  mais d''etre compris facilement (intelligible) et de parler avec assurance (securite

  linguistique), meme en faisant de petites erreurs.


  Les questions fermees (qui attendent yes/no) ont souvent une intonation montante

  a la fin : Are you ready? ⤴. Les questions ouvertes (qui commencent par what, where,

  why...) ont souvent une intonation descendante : Where do you live? ⤵.


  A l''oral, les anglophones utilisent tres souvent des formes contractees : I''m (I

  am), don''t (do not), can''t (cannot), it''s (it is), they''re (they are). Les utiliser

  rend la parole plus naturelle et plus fluide.


  Quand on ne connait pas un mot, plutot que de s''arreter de parler, on peut reformuler

  : utiliser un mot plus simple, decrire l''objet (« the thing you use to... »), ou

  dire « I mean... » pour se corriger sans stress.

  '
methode:
- Pour choisir l'intonation d'une question, verifie si elle attend une reponse yes/no (montante) ou une information precise
  avec un mot interrogatif (descendante).
- Pour reconnaitre une forme contractee, cherche l'apostrophe qui remplace des lettres manquantes.
- Face a un blocage, essaie d'abord de reformuler avec des mots plus simples plutot que de t'arreter de parler.
vocabulaire:
- terme: intelligibility
  definition: le fait d'etre compris facilement par son interlocuteur
- terme: linguistic confidence
  definition: la securite linguistique, le fait d'oser parler sans avoir peur de l'erreur
- terme: contraction
  definition: une forme contractee, comme I'm, don't, can't
- terme: rephrasing
  definition: le fait de reformuler autrement quand un mot manque
erreurs_frequentes:
- Croire qu'il faut imiter parfaitement un accent natif pour bien parler anglais.
- S'arreter completement de parler des qu'un mot manque, au lieu de reformuler.
- Utiliser une intonation montante pour toutes les questions, meme celles avec un mot interrogatif (what, where...).
exemple:
  enonce: Quelle intonation utiliser pour la question "Are you coming?"
  solution: Une intonation montante, car c'est une question fermee qui attend une reponse "yes" ou "no".
exercices:
- id: intonation-question-fermee
  type: choix
  difficulte: 1
  enonce: Quelle intonation utilise-t-on generalement pour la question "Do you like pizza?"
  reponse:
    options:
    - id: a
      texte: Intonation montante
    - id: b
      texte: Intonation descendante
    bonnes:
    - a
  indices:
    relance: Cette question attend-elle une reponse "yes/no" ou une information precise ?
    methode: Les questions fermees (yes/no) ont generalement une intonation qui monte a la toute fin de la phrase.
    etape: '"Do you like pizza?" n''a pas de mot interrogatif (what, where...) : c''est une question fermee.'
  pieges:
  - si:
      contient:
      - b
    relance: L'intonation descendante s'utilise plutot pour les questions avec un mot interrogatif comme "what" ou "where".
      Ici, c'est une question fermee.
  solution: On utilise une intonation montante, car "Do you like pizza?" est une question fermee qui attend yes ou no.
- id: intonation-question-ouverte
  type: choix
  difficulte: 1
  enonce: Quelle intonation utilise-t-on generalement pour la question "Where do you live?"
  reponse:
    options:
    - id: a
      texte: Intonation montante
    - id: b
      texte: Intonation descendante
    bonnes:
    - b
  indices:
    relance: 'Cette question commence par un mot interrogatif : "where".'
    methode: Les questions ouvertes avec un mot interrogatif ont generalement une intonation qui baisse a la toute fin de
      la phrase.
    etape: '"Where" indique que la personne attend une information precise, pas un simple oui ou non.'
  pieges:
  - si:
      contient:
      - a
    relance: L'intonation montante s'utilise plutot pour les questions fermees (yes/no). Ici, "where" introduit une question
      ouverte.
  solution: On utilise une intonation descendante, car "Where do you live?" est une question ouverte avec un mot interrogatif.
- id: forme-contractee
  type: texte_court
  difficulte: 1
  enonce: Ecris la forme contractee de "I am not ready".
  reponse:
    acceptees:
    - I'm not ready
    fautes_tolerees: 0
  indices:
    relance: 'Deux mots peuvent se contracter dans cette phrase : lesquels ?'
    methode: '"I am" se contracte souvent en "I''m" a l''oral.'
    etape: Remplace "I am" par "I'm" et garde le reste de la phrase inchange.
  pieges:
  - si:
      valeur: I am not ready
    relance: 'Ce n''est pas encore une forme contractee : il faut fusionner "I" et "am" avec une apostrophe.'
  solution: La forme contractee est "I'm not ready".
- id: strategie-reformulation
  type: association
  difficulte: 2
  enonce: Associe chaque situation a la bonne strategie de reformulation.
  reponse:
    gauche:
    - id: a
      texte: Tu ne connais pas le mot exact pour un objet
    - id: b
      texte: Tu te trompes en parlant et veux te corriger
    droite:
    - id: x
      texte: Decrire l'objet avec des mots simples (the thing you use to...)
    - id: y
      texte: Dire "I mean..." puis donner la bonne information
    paires:
      a: x
      b: y
  indices:
    relance: Une des strategies sert a decrire un objet inconnu, l'autre sert a se corriger.
    methode: Pense a ce que tu ferais en francais si tu cherchais un mot ou si tu te trompais.
    etape: Decrire un objet et se corriger sont deux situations differentes qui demandent deux strategies differentes.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Relis bien les deux situations proposees avant d'associer chaque strategie.
  solution: Pour un mot inconnu, on decrit l'objet avec des mots simples ; pour se corriger, on dit "I mean..." puis on donne
    la bonne information.
- id: presentation-orale-fluide
  type: ouverte
  difficulte: 3
  enonce: En anglais, ecris trois phrases pour te presenter a l'oral en utilisant au moins deux formes contractees differentes
    (par exemple I am, do not, cannot).
  criteres:
  - Les trois phrases sont ecrites en anglais, avec un sujet et un verbe conjugue.
  - Au moins deux formes contractees differentes sont utilisees correctement.
  - Les phrases restent simples et comprehensibles (intelligibles).
  indices:
    relance: Comment dirais-tu "je suis" et "je n'aime pas" en forme contractee ?
    methode: Commence par te presenter avec la forme contractee de "I am", puis ajoute un gout avec la forme contractee de
      "do not".
    etape: Tu peux commencer par une phrase sur ton age, puis continuer avec une phrase sur ce que tu n'aimes pas.
  solution: 'Exemple possible : « I''m thirteen years old. I don''t like football, but I love music. I can''t play the guitar
    yet. »'
- id: nblm-selon-la-fiche-de-revision-quel-est-l-ob-1
  type: choix
  difficulte: 2
  enonce: Selon la fiche de révision, quel est l'objectif principal à l'oral en anglais en classe de 3e ?
  reponse:
    options:
    - id: o1
      texte: Être compris facilement et parler avec assurance
    - id: o2
      texte: Avoir un accent parfaitement natif sans aucun défaut
    - id: o3
      texte: Ne commettre aucune faute de grammaire sous aucun prétexte
    - id: o4
      texte: Connaître par cœur tous les mots du dictionnaire anglais
    bonnes:
    - o1
  indices:
    relance: Pense à l'intelligibilité et à la sécurité linguistique plutôt qu'à la perfection.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur fréquente de croire qu'il faut viser un accent natif parfait au lieu de privilégier l'intelligibilité.
  - si:
      contient:
      - o3
    relance: Il est normal de faire de petites erreurs ; l'important est de s'exprimer sans se bloquer.
  - si:
      contient:
      - o4
    relance: Il n'est pas nécessaire de tout connaître ; la fiche conseille plutôt d'utiliser des stratégies de reformulation
      en cas de manque de vocabulaire.
  solution: 'Être compris facilement et parler avec assurance. C''est exact : l''objectif est d''être intelligible et de développer
    sa sécurité linguistique, même en faisant de petites erreurs.'
- id: nblm-quelle-intonation-utilise-t-on-generalem-2
  type: choix
  difficulte: 2
  enonce: Quelle intonation utilise-t-on généralement à la fin d'une question fermée (qui attend une réponse par 'yes' ou
    'no') comme « Are you ready? » ?
  reponse:
    options:
    - id: o1
      texte: Une intonation montante ⤴
    - id: o2
      texte: Une intonation descendante ⤵
    - id: o3
      texte: Une intonation parfaitement monotone
    - id: o4
      texte: Une intonation variable sans aucune règle
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la direction de la voix pour une question fermée à laquelle on répond par oui ou non.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, l'intonation descendante est réservée aux questions ouvertes commençant par un mot interrogatif (what,
      where...).
  - si:
      contient:
      - o3
    relance: L'anglais oral varie son intonation pour marquer le type de question.
  - si:
      contient:
      - o4
    relance: Il existe des régularités d'intonation bien précises selon que la question est ouverte ou fermée.
  solution: 'Une intonation montante ⤴. Exact : les questions fermées (qui attendent ''yes'' ou ''no'') ont souvent une intonation
    montante à la fin.'
- id: nblm-quelle-intonation-doit-on-employer-pour-3
  type: choix
  difficulte: 2
  enonce: Quelle intonation doit-on employer pour une question ouverte commençant par un mot interrogatif tel que « Where
    do you live? » ?
  reponse:
    options:
    - id: o1
      texte: Une intonation descendante ⤵
    - id: o2
      texte: Une intonation montante ⤴
    - id: o3
      texte: Une intonation montante puis descendante
    - id: o4
      texte: Une intonation strictement identique aux questions fermées
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la différence entre une question ouverte avec un mot en WH- et une question fermée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur fréquente d'utiliser une intonation montante pour toutes les questions, y compris les questions
      ouvertes.
  - si:
      contient:
      - o4
    relance: Les questions ouvertes et les questions fermées n'adoptent pas le même schéma d'intonation.
  solution: 'Une intonation descendante ⤵. C''est correct : les questions ouvertes commençant par un mot interrogatif (what,
    where, why...) ont souvent une intonation descendante.'
- id: nblm-pourquoi-la-fiche-recommande-t-elle-d-ut-4
  type: choix
  difficulte: 2
  enonce: Pourquoi la fiche recommande-t-elle d'utiliser des formes contractées à l'oral comme « I'm », « don't » ou « can't
    » ?
  reponse:
    options:
    - id: o1
      texte: Elles rendent la parole plus naturelle et plus fluide
    - id: o2
      texte: Elles sont obligatoires sous peine d'erreur grammaticale
    - id: o3
      texte: Elles remplacent totalement l'apprentissage des verbes
    - id: o4
      texte: Elles ne s'utilisent qu'à l'écrit dans les textes formels
    bonnes:
    - o1
  indices:
    relance: Réfléchis au lien entre les contractions et la fluidité de la langue orale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Les formes complètes sont grammaticalement correctes, mais les contractions favorisent la fluidité orale.
  - si:
      contient:
      - o3
    relance: Les contractions associent un pronom/sujet et un auxiliaire ou verbe, mais ne remplacent pas la grammaire.
  - si:
      contient:
      - o4
    relance: Au contraire, les formes contractées sont caractéristiques de l'oral et du langage informel.
  solution: 'Elles rendent la parole plus naturelle et plus fluide. C''est exact : les anglophones utilisent très souvent
    les contractions à l''oral pour s''exprimer de manière fluide.'
- id: nblm-que-devez-vous-faire-en-priorite-face-a-5
  type: choix
  difficulte: 2
  enonce: Que devez-vous faire en priorité face à un blocage de vocabulaire lors d'une prise de parole en anglais ?
  reponse:
    options:
    - id: o1
      texte: Reformuler en utilisant des mots simples ou en décrivant l'objet
    - id: o2
      texte: S'arrêter immédiatement de parler et abandonner son idée
    - id: o3
      texte: Prononcer le mot français avec un ton accentué
    - id: o4
      texte: Changer brusquement de sujet sans terminer sa phrase
    bonnes:
    - o1
  indices:
    relance: Cherche la méthode pour contourner un mot manquant sans interrompre l'échange.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: S'arrêter complètement est une erreur classique qui rompt le fil de la parole.
  - si:
      contient:
      - o3
    relance: Dire un mot français ne permettra pas à l'interlocuteur anglophone de comprendre l'idée.
  - si:
      contient:
      - o4
    relance: Ignorer son idée crée une rupture au lieu d'expliquer la pensée simplement.
  solution: 'Reformuler en utilisant des mots simples ou en décrivant l''objet. Exact : au lieu de s''arrêter, il vaut mieux
    reformuler (« the thing you use to... ») ou utiliser « I mean... ».'
- id: nblm-quelles-sont-les-deux-attitudes-recomman-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX attitudes recommandées dans la fiche pour développer sa sécurité linguistique et sa fluidité
    à l'oral ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Oser parler sans avoir peur de faire de petites erreurs
    - id: o2
      texte: S'exprimer de façon à être compris facilement par son interlocuteur
    - id: o3
      texte: Rechercher une imitation parfaite de l'accent natif
    - id: o4
      texte: Se taire dès qu'un mot de vocabulaire manque
    bonnes:
    - o1
    - o2
  indices:
    relance: Choisis les deux options qui privilégient la confiance d'expression et la clarté du message.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: La fiche rappelle que chercher un accent parfait comme un locuteur natif n'est pas l'objectif visé.
  - si:
      contient:
      - o4
    relance: S'arrêter de parler est une erreur fréquente ; la fiche conseille de reformuler.
  solution: 'Oser parler sans avoir peur de faire de petites erreurs ; S''exprimer de façon à être compris facilement par
    son interlocuteur. Exactement : la sécurité linguistique (linguistic confidence) consiste à oser s''exprimer sans se bloquer
    par peur de l''erreur.'
- id: nblm-comment-appelle-t-on-en-anglais-la-strat-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on en anglais la stratégie qui consiste à reformuler autrement son idée quand un mot manque ?
  reponse:
    acceptees:
    - rephrasing
    fautes_tolerees: 1
  indices:
    relance: Ce mot anglais commence par 're-' et désigne l'action de reformuler.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: rephrasing. Le terme « rephrasing » figure dans le vocabulaire officiel de la fiche pour désigner la reformulation.
- id: nblm-quel-terme-anglais-present-dans-le-vocab-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme anglais présent dans le vocabulaire de la fiche désigne l'utilisation d'une forme raccourcie comme «
    don't » ou « I'm » ?
  reponse:
    acceptees:
    - contraction
    fautes_tolerees: 1
  indices:
    relance: Ce terme anglais est quasiment identique au mot français désignant l'action de raccourcir.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: contraction. Le mot « contraction » est le terme utilisé dans la fiche pour désigner une forme contractée.
