# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: groupe-verbal
version: 3
etat: verifiee
declencheurs:
- present simple ou BE+ING
- preterit irregulier anglais
- present perfect anglais
- modal must have to anglais
- passif en anglais
- will ou going to
- must ou have to
- forme passive anglais
- listen to wait for
- past simple ou present perfect
prerequis:
- determination
essentiel: 'Le groupe verbal est le verbe et ce qui l''accompagne (auxiliaire, modal, forme en -ing, participe passé). Il
  sert à situer l''action dans le temps.


  Le présent. Le présent simple exprime une habitude ou un fait général : « I play football every Saturday. » À la 3e personne
  du singulier on ajoute -s : « she plays ». Le présent en BE + -ING exprime une action en cours : « I am playing football
  now. »


  Le passé. Le prétérit dit une action terminée, souvent avec une date : « Yesterday, I watched a film. » Les verbes réguliers
  prennent -ed ; beaucoup sont irréguliers : go → went, see → saw, have → had, buy → bought. Le present perfect (have/has
  + participe passé) relie le passé au présent : « I have lived here since 2020 » (since + point de départ) ; « for six years
  » (for + durée). Il ne s''emploie pas avec une date passée précise comme « yesterday ».


  L''avenir. On utilise « will » + verbe pour une décision ou une prédiction (« It will rain tomorrow »), et « be going to
  » + verbe pour un projet ou une intention (« I am going to visit London »).


  Les modaux. Must, can, should, may, will sont suivis du verbe sans « to » et ne prennent jamais de -s : « She must go. »
  Must exprime l''obligation, should le conseil, can la capacité ou la permission. « Have to » exprime aussi l''obligation
  et se conjugue : « She has to go. » « Mustn''t » exprime l''interdiction, « don''t have to » exprime l''absence d''obligation.


  Le passif. Il se forme avec BE conjugué + participe passé : « The window was broken. » On l''emploie quand l''action compte
  plus que celui qui la fait ; l''auteur peut être ajouté avec « by » : « by a boy ».


  La construction des verbes. Certains verbes sont suivis d''un complément direct (I like music), d''autres d''une préposition
  (I listen to music, I wait for the bus), d''autres du verbe en -ing (I enjoy swimming) ou de « to » + verbe (I want to go).


  Au brevet, on attend que tu choisisses le bon temps, que tu formes un passif ou un modal, et que tu emploies la bonne construction
  après un verbe.

  '
methode:
- 'Repère les indices de temps : every day (présent simple), now (BE+-ING), yesterday (prétérit), since ou for (present perfect),
  tomorrow (avenir).'
- 'Choisis le temps, puis conjugue : présent simple (verbe, -s à he/she/it), prétérit (-ed ou forme irrégulière), present
  perfect (have/has + participe passé).'
- Pour l'avenir, choisis will (décision, prédiction) ou be going to (projet, intention).
- Pour un modal, place-le juste après le sujet et fais-le suivre du verbe sans « to » ni -s.
- Pour un passif, repère le complément qui devient sujet, puis écris BE au bon temps + participe passé.
- 'Pour la construction d''un verbe, vérifie ce qui le suit : préposition (listen to), -ing (enjoy swimming) ou to + verbe
  (want to go).'
vocabulaire:
- terme: preterit
  definition: le temps du passe simple en anglais, pour une action terminee
- terme: present perfect
  definition: le temps qui relie une action passee au moment present, forme avec have/has + participe passe
- terme: modal
  definition: un verbe comme must, can, should, qui exprime l'obligation, la capacite ou le conseil
- terme: passive voice
  definition: la voix passive, formee avec be + participe passe
- terme: future
  definition: le futur, avec will ou be going to
- terme: past participle
  definition: le participe passé (played, gone), utilisé au present perfect et au passif
- terme: irregular verb
  definition: un verbe dont le prétérit et le participe passé ne se forment pas avec -ed
erreurs_frequentes:
- Oublier le « -s » a la troisieme personne du singulier au present simple (she play au lieu de she plays).
- Confondre le preterit et le present perfect quand une date precise est donnee (utiliser have gone au lieu de went avec «
  yesterday »).
- Ajouter « to » apres un modal (she must to go est incorrect, on dit she must go).
- Employer will ou going to sans distinguer décision et projet.
- Oublier le verbe BE au passif (« The window broken » au lieu de « The window was broken »).
exemple:
  enonce: 'Traduis en anglais : « Elle vit ici depuis 2020. »'
  solution: 'On peut dire : « She has lived here since 2020. » (present perfect avec since, car 2020 est un point de depart
    precis).'
exercices:
- id: present-simple-3e-personne
  type: texte_court
  difficulte: 1
  enonce: 'Complete au present simple : « She ___ (play) tennis every Sunday. »'
  reponse:
    acceptees:
    - plays
    fautes_tolerees: 0
  indices:
    relance: Le sujet est « she », une troisieme personne du singulier.
    methode: Au present simple, on ajoute « -s » au verbe a la troisieme personne du singulier.
    etape: Le verbe "play" doit prendre la terminaison de la troisieme personne du singulier avec « she ».
  pieges:
  - si:
      valeur: play
    relance: 'Le sujet est "she" : n''oublie pas le "-s" a la troisieme personne du singulier.'
  solution: On dit « She plays tennis every Sunday. », avec le « -s » de la troisieme personne du singulier.
- id: preterit-irregulier-go
  type: texte_court
  difficulte: 1
  enonce: 'Complete au preterit : « Last summer, we ___ (go) to Scotland. »'
  reponse:
    acceptees:
    - went
    fautes_tolerees: 0
  indices:
    relance: Le verbe « go » est un verbe irregulier, sa forme au preterit ne se termine pas par « -ed ».
    methode: Apprends par coeur la forme irreguliere de « go » au preterit.
    etape: Cherche dans ta memoire la forme irreguliere de « go » au preterit.
  pieges:
  - si:
      valeur: goed
    relance: '« Goed » n''existe pas : « go » est un verbe irregulier, sa forme au preterit est totalement differente.'
  solution: On dit « we went to Scotland », car « go » est irregulier au preterit (went).
- id: present-perfect-since-for
  type: choix
  difficulte: 2
  enonce: 'Complete : « I have known him ___ ten years. »'
  reponse:
    options:
    - id: a
      texte: for
    - id: b
      texte: since
    - id: c
      texte: from
    - id: d
      texte: during
    bonnes:
    - a
  indices:
    relance: « Ten years » designe-t-il une duree ou un point de depart precis ?
    methode: « Since » s'utilise avec un point de depart (comme une annee precise), l'autre mot s'utilise avec une duree.
    etape: Ici, « ten years » est une duree, pas une date precise.
  pieges:
  - si:
      contient:
      - b
    relance: « Since » s'utilise avec un point de depart precis (comme une annee), pas avec une duree comme « ten years ».
  solution: 'On dit « for ten years » : « for » s''utilise avec une duree, « since » avec un point de depart precis.'
- id: modal-obligation
  type: ordre
  difficulte: 2
  enonce: Remets les mots dans l'ordre pour former une phrase correcte avec un modal.
  reponse:
    elements:
    - id: sujet
      texte: You
    - id: modal
      texte: must
    - id: verbe
      texte: wear
    - id: complement
      texte: a seatbelt
  indices:
    relance: Un modal comme « must » se place directement apres le sujet, sans « to » apres lui.
    methode: 'La structure est : sujet + modal + verbe (sans to) + complement.'
    etape: Le sujet « you » vient en premier, suivi du modal « must ».
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Verifie que le modal est bien juste apres le sujet et juste avant le verbe, sans "to" entre les deux.
  - si:
      diagnostic: ordre_faux
    relance: Commence par le sujet, puis place le modal juste avant le verbe.
  solution: 'La phrase correcte est : « You must wear a seatbelt. »'
- id: description-habitudes-vs-passe
  type: ouverte
  difficulte: 3
  enonce: 'En anglais, ecris trois phrases : une au present simple pour une habitude, une au preterit pour un evenement passe
    precis, une avec un modal pour un conseil.'
  criteres:
  - Les trois phrases sont ecrites en anglais, avec un sujet et un verbe conjugue.
  - Le present simple est utilise correctement pour une habitude.
  - Le preterit ou un modal est utilise correctement dans les deux autres phrases.
  indices:
    relance: Quelle activite fais-tu regulierement, et quel evenement s'est passe une seule fois dans le passe ?
    methode: Commence par l'habitude au present simple, puis raconte un evenement passe au preterit, puis donne un conseil
      avec should ou must.
    etape: Tu peux commencer par « I play football every week. » puis continuer avec « Last year, I went to London. » et «
      You should visit it too. »
  solution: 'Exemple possible : « I play football every week. Last year, I went to London. You should visit this city. »'
- id: nblm-au-present-simple-quelle-est-la-regle-sp-1
  type: choix
  difficulte: 2
  enonce: Au présent simple, quelle est la règle spécifique à appliquer à la 3e personne du singulier (he, she, it) ?
  reponse:
    options:
    - id: o1
      texte: On ajoute la terminaison « -s » à la fin du verbe.
    - id: o2
      texte: On utilise obligatoirement l'auxiliaire BE suivi du verbe en -ING.
    - id: o3
      texte: On ajoute « -ed » à la fin du verbe.
    - id: o4
      texte: On ne change jamais la forme du verbe, quel que soit le sujet.
    bonnes:
    - o1
  indices:
    relance: Pense à la forme du verbe quand le sujet est 'she' ou 'he' pour exprimer une habitude.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : la forme BE + -ING sert à décrire une action en train de se dérouler, pas une
      habitude au présent simple.'
  - si:
      contient:
      - o3
    relance: La terminaison « -ed » est la marque du prétérit régulier au passé, pas du présent.
  - si:
      contient:
      - o4
    relance: 'C''est faux : la 3e personne du singulier exige un « -s » au présent simple (son oubli est une erreur fréquente).'
  solution: 'On ajoute la terminaison « -s » à la fin du verbe. C''est exact. Au présent simple, la 3e personne du singulier
    prend la terminaison « -s » (par exemple : she plays).'
- id: nblm-comment-se-conjugue-le-verbe-irregulier-2
  type: choix
  difficulte: 2
  enonce: Comment se conjugue le verbe irrégulier « go » au prétérit dans une phrase exprimant une action passée et terminée
    ?
  reponse:
    options:
    - id: o1
      texte: went
    - id: o2
      texte: goed
    - id: o3
      texte: has gone
    - id: o4
      texte: going
    bonnes:
    - o1
  indices:
    relance: Ce verbe change complètement de forme au passé révolu et ne prend pas la terminaison régulière en -ed.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est l'erreur fréquente consistant à appliquer la règle des verbes réguliers (-ed) à un verbe irrégulier.
  - si:
      contient:
      - o3
    relance: Il s'agit du Present Perfect (have + participe passé), alors qu'une action passée et datée nécessite le prétérit
      simple.
  - si:
      contient:
      - o4
    relance: « Going » est le participe présent (forme en -ING) et ne s'emploie pas seul comme verbe au prétérit.
  solution: 'went. C''est exact. « Go » est un verbe irrégulier dont la forme au prétérit est « went » (par exemple : Yesterday,
    I went).'
- id: nblm-dans-la-phrase-i-have-lived-here-six-yea-3
  type: choix
  difficulte: 2
  enonce: Dans la phrase « I have lived here [...] six years », quel mot faut-il utiliser pour introduire cette durée ?
  reponse:
    options:
    - id: o1
      texte: for
    - id: o2
      texte: since
    - id: o3
      texte: ago
    - id: o4
      texte: during
    bonnes:
    - o1
  indices:
    relance: Demande-toi si le groupe de mots qui suit indique un point de départ précis ou bien une quantité de temps (durée).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : « since » s''utilise pour indiquer un point de départ temporel précis (ex. since 2020), non
      une durée.'
  - si:
      contient:
      - o3
    relance: « Ago » s'utilise avec le prétérit simple pour indiquer un recul temporel, pas avec le Present Perfect pour exprimer
      une durée.
  - si:
      contient:
      - o4
    relance: « During » s'utilise pour situer un événement au cours d'une période (during the holidays), mais ne s'emploie
      pas pour mesurer une durée avec le Present Perfect.
  solution: for. C'est exact. On utilise « for » devant l'expression d'une durée (six years) avec le Present Perfect.
- id: nblm-quelle-regle-grammaticale-essentielle-s-4
  type: choix
  difficulte: 2
  enonce: Quelle règle grammaticale essentielle s'applique au verbe modal « must » ?
  reponse:
    options:
    - id: o1
      texte: Il est suivi d'une base verbale sans « to » et ne prend pas de « -s » à la 3e personne du singulier.
    - id: o2
      texte: Il doit toujours être suivi d'un verbe à l'infinitif précédé de « to ».
    - id: o3
      texte: Il prend la terminaison « -s » à la 3e personne du singulier au présent.
    - id: o4
      texte: Il se conjugue uniquement avec l'auxiliaire BE à la forme progressive.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la forme du verbe qui suit directement un modal comme must ou should.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : dire « she must to go » est incorrect, on dit « she must go ».'
  - si:
      contient:
      - o3
    relance: Les modaux ne prennent jamais de « -s » à la 3e personne du singulier (on ne dit pas « she musts »).
  - si:
      contient:
      - o4
    relance: Les modaux expriment l'obligation, la capacité ou le conseil et sont suivis d'une base verbale simple.
  solution: 'Il est suivi d''une base verbale sans « to » et ne prend pas de « -s » à la 3e personne du singulier. C''est
    exact. Les modaux comme « must » sont invariables et directement suivis de la base verbale (ex : she must go).'
- id: nblm-comment-se-forme-la-voix-passive-en-angl-5
  type: choix
  difficulte: 2
  enonce: Comment se forme la voix passive en anglais lorsqu'on veut insister sur l'action subie ?
  reponse:
    options:
    - id: o1
      texte: Auxiliaire BE + participe passé du verbe
    - id: o2
      texte: Auxiliaire HAVE + participe passé du verbe
    - id: o3
      texte: Auxiliaire BE + forme en -ING du verbe
    - id: o4
      texte: Verbe à l'infinitif précédé de « to »
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux deux éléments indispensables pour construire la forme passive lorsqu'on insiste sur l'action subie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'association HAVE + participe passé sert à former le Present Perfect, pas la voix passive.
  - si:
      contient:
      - o3
    relance: BE + -ING exprime l'aspect progressif d'une action en train de se dérouler à la voix active.
  - si:
      contient:
      - o4
    relance: L'infinitif seul ne permet pas d'exprimer la voix passive.
  solution: 'Auxiliaire BE + participe passé du verbe. C''est exact. La voix passive se forme avec l''auxiliaire BE (conjugué)
    + le participe passé (ex : The window was broken).'
- id: nblm-parmi-les-propositions-suivantes-quelles-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes, quelles sont les DEUX phrases correctement construites en anglais ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: She has lived here since 2020.
    - id: o2
      texte: She must go to school.
    - id: o3
      texte: She plays tennis yesterday.
    - id: o4
      texte: She must to speak English.
    bonnes:
    - o1
    - o2
  indices:
    relance: Vérifie attentivement l'accord du temps avec l'indicateur temporel passé ainsi que l'absence de 'to' après un
      modal.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est incorrect : l''indicateur passé « yesterday » impose l''utilisation du prétérit (« played ») et non du
      présent simple.'
  - si:
      contient:
      - o4
    relance: 'C''est une erreur classique : ajouter « to » après un modal comme « must » est incorrect.'
  solution: 'She has lived here since 2020 ; She must go to school. C''est correct : le Present Perfect est correctement associé
    à « since » pour indiquer un point de départ précis.'
- id: nblm-complete-la-phrase-suivante-avec-le-verb-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase suivante avec le verbe ''see'' au prétérit : « Yesterday, I [...] a film. »'
  reponse:
    acceptees:
    - saw
    fautes_tolerees: 1
  indices:
    relance: Pense à la forme du prétérit irrégulier du verbe 'voir' au passé révolu.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: saw. Le verbe « see » est un verbe irrégulier dont le prétérit est « saw » pour exprimer une action passée et
    terminée.
- id: nblm-complete-la-phrase-au-present-perfect-av-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase au Present Perfect avec le mot indiquant le point de départ : « She has lived here [...] 2020.
    »'
  reponse:
    acceptees:
    - since
    fautes_tolerees: 1
  indices:
    relance: Réfléchis au mot qui introduit un point de départ temporel précis (comme une année).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: since. On utilise « since » devant un point de départ temporel précis (une année, un moment précis) avec le Present
    Perfect.
- id: association-temps
  type: association
  difficulte: 2
  enonce: Relie chaque phrase au temps utilisé.
  reponse:
    gauche:
    - id: a
      texte: I am reading a book now.
    - id: b
      texte: I lost my keys yesterday.
    - id: c
      texte: I have lived here since 2020.
    - id: d
      texte: I will call you tomorrow.
    droite:
    - id: w
      texte: BE + -ING
    - id: x
      texte: Prétérit
    - id: y
      texte: Present perfect
    - id: z
      texte: Futur avec will
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Repère le petit mot ou la forme du verbe qui donne l'indice (now, yesterday, since, will).
    methode: 'Chaque phrase contient un indice différent : now, yesterday, since ou tomorrow.'
    etape: « Yesterday » va avec une action terminée dans le passé. Place cette phrase d'abord.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis l'indice de temps de chaque phrase.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la phrase avec « since » et celle avec un auxiliaire de futur, puis les deux autres.
  solution: 'I am reading now : BE + -ING (action en cours). I read yesterday : prétérit. I have read since Monday : present
    perfect. I will read tomorrow : futur avec will.'
- id: passif-forme
  type: choix
  difficulte: 2
  enonce: Quelle phrase est au passif ?
  reponse:
    options:
    - id: a
      texte: The cake was eaten by the children.
    - id: b
      texte: The children ate the cake.
    - id: c
      texte: The children are eating the cake.
    - id: d
      texte: The children have eaten the cake.
    bonnes:
    - a
  indices:
    relance: Au passif, le sujet subit l'action. Lequel des sujets subit ?
    methode: Le passif se forme avec BE + participe passé.
    etape: Cherche « was » ou « is » suivi d'un participe passé.
  pieges:
  - si:
      contient:
      - b
    relance: 'Ici, les enfants font l''action : le sujet agit. Est-ce un passif ?'
  - si:
      contient:
      - c
    relance: 'Cette phrase est en BE + -ING : le sujet agit toujours. Cherche BE + participe passé.'
  - si:
      contient:
      - d
    relance: « Have eaten » est un present perfect à la voix active. Cherche le sujet qui subit l'action.
  solution: '« The cake was eaten by the children » est au passif : was + participe passé (eaten), le gâteau subit l''action.'
- id: futur-going-to
  type: choix
  difficulte: 2
  enonce: 'Complète : « Look at those black clouds ! It ___ rain. »'
  reponse:
    options:
    - id: a
      texte: is going to
    - id: b
      texte: rained
    - id: c
      texte: must
    - id: d
      texte: rains
    bonnes:
    - a
  indices:
    relance: Il y a un signe visible maintenant. Quelle forme de futur s'appuie sur un signe présent ?
    methode: Going to exprime une intention ou une prévision fondée sur un signe visible.
    etape: 'Écarte le présent simple, le prétérit et « must » : aucun ne parle d''avenir ici.'
  pieges:
  - si:
      contient:
      - b
    relance: Le prétérit parle d'une action terminée. Ici, on parle de ce qui va arriver.
  - si:
      contient:
      - c
    relance: Must exprime l'obligation, pas un événement à venir.
  - si:
      contient:
      - d
    relance: Le présent simple parle d'habitudes. Cherche une forme qui annonce l'avenir.
  solution: 'On voit les nuages : « It is going to rain. » Going to s''emploie pour une prévision fondée sur un signe visible.'
