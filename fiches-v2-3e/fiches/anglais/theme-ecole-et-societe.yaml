format: 2
notion: theme-ecole-et-societe
version: 2
etat: generee
declencheurs:
- uniforme à l'école anglaise
- high school c'est quoi
- vocabulaire écologie en anglais
- parler de son collège en anglais
- eco-schools programme
- fiche métier en anglais
- trier les déchets en anglais
- économiser l'énergie en anglais
- school subjects en anglais
prerequis:
- aspects-culturels
couverture: Compare les grandes lignes des systèmes scolaires britannique et américain, le vocabulaire de l'environnement
  à l'école et des métiers liés à l'environnement. Ne couvre pas le détail des diplômes (GCSE, A-levels, high school
  diploma).
essentiel: |
  Ce thème compare l'école dans les pays anglophones et en France, et parle de l'environnement et du monde du travail.

  1. Les systèmes scolaires
  Au Royaume-Uni, beaucoup d'élèves portent un « school uniform » (tenue obligatoire). Ils sont regroupés par « year groups » : des groupes d'âge, de Year 7 (11-12 ans) à Year 11 (15-16 ans) environ. Aux États-Unis, après l'« elementary school », les élèves vont à la « middle school » (11-14 ans), puis à la « high school » (14-18 ans). En France, on va à l'école primaire, au collège, puis au lycée.

  Attention aux faux amis : « college » en anglais désigne surtout des études après le lycée, pas notre collège.

  Pour comparer, on utilise : « In France, we… but in the UK, they… », « like in France », « different from », « the same as ». Exemple : « In the UK, pupils wear a uniform, but in France we don't. »

  2. L'environnement au quotidien
  On parle de l'eau (water), des espaces verts (green spaces), de l'urbanisme (town planning), des déchets et du recyclage (rubbish, recycling), des économies d'énergie (saving energy), de la pollution (pollution) et de la consommation responsable (responsible consumption).

  Une action est « eco-friendly » quand elle respecte l'environnement. Exemples au présent : « We recycle paper. », « We turn off the lights. », « We use a water bottle. »

  3. Activités scolaires et extrascolaires
  Loisirs et consommation écoresponsables : marcher ou faire du vélo pour aller à l'école (« to walk or cycle to school »), réparer plutôt que jeter, s'inscrire à un club nature. Les « national parks » sont de grands espaces naturels protégés ; les « urban parks » sont des parcs en ville.

  4. Le monde du travail
  Une fiche métier (« job profile ») donne le nom du métier, ce qu'on fait, les qualités demandées. Métiers liés à l'environnement : « renewable energy engineer » (ingénieur en énergies renouvelables), « recycling worker » (agent de recyclage), « park ranger » (garde d'un parc naturel), « water treatment technician » (technicien en traitement de l'eau).

  5. Numérique et environnement
  Les appareils numériques consomment de l'énergie et deviennent des déchets : on peut éteindre son ordinateur, garder son téléphone plus longtemps, recycler les appareils (« to recycle electronic devices »).

  Au brevet, on attend que tu comprennes ce vocabulaire dans un texte ou un document sonore, et que tu écrives quelques phrases simples pour comparer ou présenter une action écoresponsable.
methode:
- Repere d'abord si la phrase parle du systeme scolaire (uniform, year group, high school) ou de l'environnement
  (recycling, eco-friendly, national park).
- Pour un mot de vocabulaire nouveau, cherche s'il ressemble a un mot francais (recycling proche de recyclage) avant
  de deviner au hasard.
- Pour comparer deux systemes scolaires, utilise des connecteurs simples comme « but » (mais) ou « like in France
  » (comme en France).
- 'Pour parler d''une habitude de l''école, utilise le présent simple : « We recycle paper. » (sujet + verbe).'
- 'Pour présenter un métier, donne son nom, ce que la personne fait, puis une qualité : « A park ranger protects
  animals. »'
- 'Attention aux faux amis (« college », « eventually ») : vérifie le sens dans le contexte de la phrase.'
vocabulaire:
- terme: school uniform
  definition: la tenue obligatoire que portent les eleves dans de nombreuses ecoles britanniques
- terme: year group
  definition: au Royaume-Uni, le groupe d'eleves du meme age (par exemple Year 7)
- terme: high school
  definition: aux Etats-Unis, l'etablissement qui accueille les eleves de 14 a 18 ans
- terme: eco-friendly
  definition: respectueux de l'environnement
- terme: national park
  definition: un grand espace naturel protege, ouvert aux visiteurs
- terme: middle school
  definition: aux États-Unis, l'établissement qui accueille les élèves de 11 à 14 ans
- terme: recycling
  definition: le tri et la réutilisation des déchets
- terme: park ranger
  definition: garde d'un parc naturel, qui protège les lieux et informe les visiteurs
- terme: renewable energy
  definition: énergie qui ne s'épuise pas (soleil, vent, eau)
- terme: to save energy
  definition: économiser l'énergie
erreurs_frequentes:
- Confondre « high school » (etablissement americain, 14-18 ans) et « middle school » (11-14 ans).
- Croire que « school uniform » designe un vetement de sport uniquement, alors que c'est la tenue obligatoire de
  tous les jours.
- Utiliser « ecologic » au lieu de « eco-friendly » ou « environmentally friendly ».
- 'Traduire « college » par « collège » : en anglais, ce mot désigne surtout des études après le lycée.'
- 'Oublier le « s » du présent simple avec « he/she » : « She recycles paper. », pas « She recycle paper. »'
exemple:
  enonce: 'Traduis en anglais : « Dans mon college, nous trions les dechets. »'
  solution: 'On peut dire : « In my school, we recycle our rubbish. » (le mot « rubbish » designe les dechets en
    anglais britannique).'
exercices:
- id: uniform-sens
  type: choix
  difficulte: 1
  enonce: En anglais britannique, que designe un « school uniform » ?
  reponse:
    options:
    - id: a
      texte: Une tenue que portent les eleves a l'ecole
    - id: b
      texte: Un repas servi a la cantine
    - id: c
      texte: Un devoir a faire a la maison
    - id: d
      texte: Une matiere scolaire
    bonnes:
    - a
  indices:
    relance: 'Le mot « uniform » existe aussi en francais : a quoi ressemble-t-il ?'
    methode: Pense a ce que portent les militaires ou les eleves de certaines ecoles privees en France.
    etape: Le mot anglais « uniform » et le mot francais « uniforme » viennent de la meme racine.
  pieges:
  - si:
      contient:
      - b
    relance: Un repas se dit « meal » ou « lunch » en anglais, pas « uniform ».
  - si:
      contient:
      - d
    relance: Une matiere scolaire se dit « subject » en anglais. Le uniform, lui, se porte sur soi.
  solution: Un « school uniform » est la tenue obligatoire (par exemple une chemise, une cravate, un pull) que portent
    les eleves dans de nombreuses ecoles britanniques.
- id: traduire-lycee-americain
  type: texte_court
  difficulte: 2
  enonce: 'Traduis en anglais americain : « lycee » (l''etablissement qui accueille les eleves de 14 a 18 ans).'
  reponse:
    acceptees:
    - high school
    fautes_tolerees: 0
  indices:
    relance: 'Ce mot est compose de deux mots anglais tres courants : un adjectif et un nom.'
    methode: Pense a ce qui vient apres la « middle school » (11-14 ans) dans le systeme americain.
    etape: Le premier mot signifie « eleve, superieur » et le second signifie « ecole ».
  pieges:
  - si:
      diagnostic: mauvaise_reponse
    relance: Attention, ce n'est pas « college », qui en anglais designe plutot l'universite.
  solution: On dit « high school ». Aux Etats-Unis, la high school accueille les eleves de 14 a 18 ans, apres la
    middle school.
- id: vocabulaire-ecole-environnement
  type: association
  difficulte: 2
  enonce: Associe chaque mot anglais a sa signification en francais.
  reponse:
    gauche:
    - id: a
      texte: year group
    - id: b
      texte: recycling
    - id: c
      texte: national park
    - id: d
      texte: eco-friendly
    droite:
    - id: x
      texte: Au Royaume-Uni, le groupe d'eleves du meme age
    - id: y
      texte: Le tri et la reutilisation des dechets
    - id: z
      texte: Un grand espace naturel protege
    - id: w
      texte: Respectueux de l'environnement
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Deux mots parlent de l'ecole, deux mots parlent de l'environnement. Commence par les separer.
    methode: Pour « recycling », pense au verbe francais qui lui ressemble.
    etape: '« Year group » parle forcement de l''ecole : associe-le a la definition qui contient « eleves ».'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Verifie d'abord les deux mots qui parlent de l'environnement.
  - si:
      diagnostic: associations_fausses
    relance: Separe d'abord les mots scolaires (year group) des mots environnementaux (recycling, national park,
      eco-friendly).
  solution: year group = le groupe d'eleves du meme age au Royaume-Uni ; recycling = le tri et la reutilisation
    des dechets ; national park = un grand espace naturel protege ; eco-friendly = respectueux de l'environnement.
- id: choisir-action-ecoresponsable
  type: choix
  difficulte: 2
  enonce: Which activity is « eco-friendly » ?
  reponse:
    options:
    - id: a
      texte: Recycling paper and bottles
    - id: b
      texte: Leaving the lights on all day
    - id: c
      texte: Throwing rubbish in a river
    - id: d
      texte: Driving the car for a five-minute trip
    bonnes:
    - a
  indices:
    relance: Trois de ces actions sont mauvaises pour l'environnement. Une seule le respecte.
    methode: Cherche l'action qui reduit les dechets plutot que d'en produire.
    etape: Le mot « recycling » (trier, reutiliser) est presque toujours une bonne action pour l'environnement.
  pieges:
  - si:
      contient:
      - b
    relance: 'Laisser la lumiere allumee toute la journee gaspille de l''energie : ce n''est pas eco-friendly.'
  - si:
      contient:
      - c
    relance: 'Jeter des dechets dans une riviere pollue l''eau : ce n''est pas eco-friendly.'
  - si:
      contient:
      - d
    relance: 'Prendre la voiture pour cinq minutes de trajet consomme du carburant inutilement : ce n''est pas eco-friendly.'
  solution: 'La bonne reponse est « Recycling paper and bottles » : trier et reutiliser les dechets respecte l''environnement,
    contrairement aux trois autres actions.'
- id: age-high-school
  type: nombre
  difficulte: 1
  enonce: À quel âge les élèves américains entrent-ils à la « high school » ?
  reponse:
    valeur: 14
    forme: entier
  indices:
    relance: 'Reprends la leçon : la « middle school » précède la « high school ». Quel âge la middle school se
      termine-t-elle ?'
    methode: 'Cherche dans la leçon la tranche d''âge de la « middle school » : la « high school » commence juste
      après.'
    etape: 'Il s''agit de l''âge le plus élevé de la middle school : celui où l''on en sort.'
  pieges:
  - si:
      valeur: 11
    relance: 11 ans, c'est l'âge d'entrée à la « middle school », pas à la « high school ».
  - si:
      valeur: 18
    relance: 18 ans, c'est plutôt l'âge où l'on quitte la « high school ».
  solution: 'La middle school accueille les 11-14 ans, puis la high school les 14-18 ans : on y entre à 14 ans.'
- id: metier-ranger
  type: choix
  difficulte: 2
  enonce: What does a « park ranger » do?
  reponse:
    options:
    - id: a
      texte: He or she protects a natural park and helps visitors.
    - id: b
      texte: He or she teaches maths at school.
    - id: c
      texte: He or she drives a bus in the city.
    - id: d
      texte: He or she cooks meals in a restaurant.
    bonnes:
    - a
  indices:
    relance: 'Décompose le mot : « park » veut dire parc. Cherche la phrase qui parle d''un parc.'
    methode: « Ranger » désigne quelqu'un qui surveille et protège un espace naturel.
    etape: Une seule phrase contient l'idée de protéger la nature. Cherche le mot « park » ou « natural ».
  pieges:
  - si:
      contient:
      - b
    relance: Un professeur de maths, c'est « a maths teacher ». Où travaille un « park ranger » ?
  - si:
      contient:
      - c
    relance: Conduire un bus, c'est le métier d'un « bus driver ». Un « park ranger » travaille dans la nature.
  - si:
      contient:
      - d
    relance: Faire la cuisine, c'est le métier d'un « cook » ou d'un « chef ». Un « park ranger » travaille dans
      un parc.
  solution: A park ranger protects a natural park and helps visitors. C'est un métier lié à l'environnement.
- id: ordre-phrase-recycle
  type: ordre
  difficulte: 3
  enonce: 'Remets ces mots dans l''ordre pour former une phrase correcte au présent simple : « We ... every week.
    »'
  reponse:
    elements:
    - id: we
      texte: We
    - id: recycle
      texte: recycle
    - id: paper
      texte: paper
    - id: and
      texte: and
    - id: bottles
      texte: bottles
    - id: week
      texte: every week
  indices:
    relance: Une phrase anglaise commence par le sujet, suivi du verbe, puis du complément.
    methode: Place le sujet, puis le verbe, puis ce que l'on recycle, puis l'expression de temps à la fin.
    etape: 'Le sujet est « We ». Quel mot vient juste après : le verbe ou le complément ?'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux mots voisins sont inversés. Vérifie l''ordre sujet, verbe, complément.'
  - si:
      diagnostic: ordre_faux
    relance: Commence par le sujet, puis le verbe. Le complément (avec « and ») vient ensuite, et l'expression de
      temps termine la phrase.
  solution: 'We recycle paper and bottles every week : sujet (We), verbe (recycle), complément (paper and bottles),
    expression de temps (every week).'
- id: presenter-son-college
  type: ouverte
  difficulte: 3
  enonce: En anglais, ecris trois phrases pour presenter ton college et une action ecoresponsable qu'il mene (recyclage,
    economies d'energie...).
  criteres:
  - Les trois phrases sont ecrites en anglais, au present simple, avec un sujet et un verbe conjugue.
  - Au moins un mot de vocabulaire scolaire (school, class, pupil...) est utilise correctement.
  - Au moins un mot ou une expression du vocabulaire environnemental (recycling, eco-friendly, save energy...) est
    utilise correctement.
  indices:
    relance: De quoi ton college a-t-il besoin pour etre plus eco-friendly ?
    methode: Commence par une phrase qui presente ton college, puis une phrase sur une action ecoresponsable, puis
      une phrase de conclusion.
    etape: Tu peux commencer par « My school is called... » puis continuer avec « We recycle... » ou « We save energy
      by... ».
  solution: 'Exemple possible : « My school is called Jules College. We recycle paper and plastic bottles every
    week. It is a small but eco-friendly school. »'
