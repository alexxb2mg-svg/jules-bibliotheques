    relance: Incorrect, 'school uniform' désigne la tenue obligatoire quotidienne des élèves, pas une action environnementale.
  solution: Recycling ; National parks. Correct ! Le tri et le recyclage des déchets ('recycling') font partie des actions
    écologiques à l'école.
- id: nblm-en-anglais-britannique-quel-mot-designan-7
  type: texte_court
  difficulte: 1
  enonce: 'En anglais britannique, quel mot désignant les déchets complète la phrase : « In my school, we recycle our _______
    » ?'
  reponse:
    acceptees:
    - rubbish
    fautes_tolerees: 1
  indices:
    relance: Ce mot britannique de 7 lettres signifie 'déchets' ou 'ordures'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: rubbish. Bravo ! En anglais britannique, 'rubbish' désigne les déchets qu'on recycle à l'école.
- id: nblm-comment-traduit-on-le-verbe-trier-recycl-8
  type: texte_court
