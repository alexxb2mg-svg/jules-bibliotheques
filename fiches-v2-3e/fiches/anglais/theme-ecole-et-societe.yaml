  - si:
      contient:
      - o4
    relance: Faux, 'eco-police' est un terme inventé qui n'existe pas en anglais pour désigner ce métier.
  solution: Park ranger. Exact ! Le terme 'park ranger' désigne le garde d'un parc naturel protégé.
- id: nblm-au-royaume-uni-comment-appelle-t-on-les-5
  type: choix
  difficulte: 2
  enonce: Au Royaume-Uni, comment appelle-t-on les groupes d'élèves de même âge (comme Year 7 ou Year 11) ?
  reponse:
