    fautes_tolerees: 1
  indices:
    relance: C'est un mot transparent très proche du verbe français 'recycler'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: recycle. Exact ! Le verbe 'recycle' signifie recycler ou trier les déchets à l'école.
