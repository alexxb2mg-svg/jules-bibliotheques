format: 2
notion: determination
version: 2
etat: generee
declencheurs:
- a ou an en anglais
- some ou any en anglais
- article the en anglais
- comparatif et superlatif anglais
- adjectif possessif anglais
- much ou many en anglais
- a few ou a little
- pas d'article en anglais
prerequis:
- nom-et-groupe-nominal
essentiel: |
  Les articles en anglais.

  « A » s'utilise devant un son de consonne (a dog, a university : « university » commence par le son « you »). « An » s'utilise devant un son de voyelle (an apple, an hour : le « h » de « hour » est muet). On regarde le son, pas la lettre.

  « A » et « an » servent pour un nom comptable singulier dont on parle pour la première fois. « The » sert pour une chose précise ou déjà connue (the book on the table). On n'utilise pas d'article (Ø) pour un sens général avec un nom pluriel ou non comptable : I like music. Dogs are loyal.

  Les quantifieurs disent « combien ». « Some » s'utilise dans les phrases affirmatives (I have some apples). « Any » s'utilise dans les phrases négatives et les questions (I don't have any apples. Do you have any apples?).

  Avec un nom comptable (qu'on peut compter : apples), on dit many et a few (many apples, a few apples). Avec un nom non comptable (water, money), on dit much et a little (not much water, a little water). « A lot of » marche avec les deux et se dit surtout à la forme affirmative (a lot of apples, a lot of water). « No » veut dire « aucun » (no apples).

  Les adjectifs possessifs se placent devant le nom et ne changent pas avec le nom : my, your, his, her, its, our, their. Ils s'accordent avec le possesseur : his brother (le frère de lui), her brother (le frère d'elle).

  Pour comparer, on ajoute « -er » aux adjectifs courts (taller) et « more » devant les adjectifs longs (more interesting), suivi de « than ». Pour le superlatif, on ajoute « -est » (the tallest) ou « the most » (the most interesting). Certains adjectifs sont irréguliers : good, better, the best ; bad, worse, the worst.

  Au brevet : choisir le bon article, le bon quantifieur et la bonne forme de comparaison dans une phrase.
methode:
- Pour choisir a/an, écoute le son du mot qui suit, pas seulement sa première lettre écrite.
- Pour choisir the ou Ø, demande-toi si l'objet est déjà connu et précis, ou général.
- Pour some/any, vérifie d'abord si la phrase est affirmative, négative ou interrogative.
- Pour much/many/a few/a little, vérifie si le nom est comptable (on peut le compter) ou non comptable.
- Pour un adjectif possessif, cherche qui possède (I, you, he, she, we, they), pas ce qui est possédé.
- 'Pour un comparatif, compte les syllabes de l''adjectif : un adjectif court prend souvent « -er », un adjectif long prend « more ».'
vocabulaire:
- terme: article
  definition: le petit mot qui précède un nom (a, an, the) ou son absence
- terme: comparative
  definition: la forme d'un adjectif qui sert à comparer deux éléments
- terme: superlative
  definition: la forme d'un adjectif qui sert à désigner l'élément le plus (ou le moins) extrême d'un groupe
- terme: quantifier
  definition: un mot qui indique la quantité (some, any, many, much, a few, a little)
- terme: countable noun
  definition: un nom qu'on peut compter, qui a un pluriel (apple, apples)
- terme: uncountable noun
  definition: un nom qu'on ne compte pas, sans pluriel (water, money, music)
- terme: possessive adjective
  definition: un mot comme my, your, his, her qui indique à qui appartient le nom
erreurs_frequentes:
- Choisir a/an selon la lettre écrite au lieu du son entendu (dire « a hour » au lieu de « an hour »).
- Utiliser « any » dans une phrase affirmative au lieu de « some ».
- Ajouter à la fois « more » et « -er » sur le même adjectif (« more taller » est incorrect).
- 'Dire « many water » : avec un nom non comptable, on dit « much » ou « a lot of ».'
- 'Accorder le possessif avec le nom possédé comme en français : on dit « his sister » même si la sœur est une fille, car c''est le possesseur (he) qui compte.'
exemple:
  enonce: 'Traduis en anglais : « Elle est plus intelligente que son frere. »'
  solution: 'On peut dire : « She is more intelligent than her brother. » (« intelligent » est un adjectif long, on utilise « more »).'
exercices:
- id: choix-a-an-hour
  type: choix
  difficulte: 1
  enonce: 'Complete : « I waited for ___ hour. »'
  reponse:
    options:
    - id: a
      texte: an
    - id: b
      texte: a
    - id: c
      texte: the
    - id: d
      texte: (rien, pas d'article)
    bonnes:
    - a
  indices:
    relance: Le mot « hour » commence par la lettre « h », mais comment se prononce-t-il ?
    methode: 'Le « h » de « hour » est muet : le mot commence par un son de voyelle.'
    etape: Devant un son de voyelle, on utilise toujours un article court, meme si la lettre ecrite est une consonne.
  pieges:
  - si:
      contient:
      - b
    relance: 'Attention, "a" s''utilise devant un son de consonne. Le "h" de "hour" est muet : le mot se prononce comme s''il commencait par une voyelle.'
  solution: 'On dit « an hour » car le « h » de « hour » est muet : le mot commence par un son de voyelle.'
- id: choix-some-any
  type: texte_court
  difficulte: 1
  enonce: 'Complete avec « some » ou « any » : « Do you have ___ questions? »'
  reponse:
    acceptees:
    - any
    fautes_tolerees: 0
  indices:
    relance: Cette phrase est-elle affirmative, negative ou interrogative ?
    methode: Dans les questions, on utilise generalement le mot le plus court des deux, pas le mot utilise en phrase affirmative.
    etape: 'La phrase commence par « Do you » : c''est une question.'
  pieges:
  - si:
      valeur: some
    relance: 'Cette phrase est une question, pas une phrase affirmative : le mot qui convient ici n''est pas celui des phrases affirmatives.'
  solution: On dit « Do you have any questions? » car c'est une question, et on utilise « any » dans les questions.
- id: comparatif-tall
  type: texte_court
  difficulte: 2
  enonce: 'Complete : « My brother is ___ (tall) than me. »'
  reponse:
    acceptees:
    - taller
    fautes_tolerees: 0
  indices:
    relance: « Tall » est un adjectif court, d'une seule syllabe.
    methode: Pour un adjectif court, on ajoute le suffixe « -er » pour former le comparatif.
    etape: Ajoute simplement « -er » a la fin de « tall ».
  pieges:
  - si:
      valeur: more tall
    relance: '« Tall » est un adjectif court : on n''utilise pas « more » devant, mais le suffixe « -er ».'
  solution: 'On dit « taller » : « My brother is taller than me. »'
- id: superlatif-irregulier
  type: choix
  difficulte: 2
  enonce: Quel est le superlatif de « good » ?
  reponse:
    options:
    - id: a
      texte: the best
    - id: b
      texte: the goodest
    - id: c
      texte: the most good
    - id: d
      texte: the gooder
    bonnes:
    - a
  indices:
    relance: '« Good » ne suit pas la regle habituelle : c''est un adjectif irregulier.'
    methode: Comme en francais avec « bon -> meilleur -> le meilleur », l'anglais a une forme totalement differente pour « good ».
    etape: Le superlatif de « good » commence par « be- ».
  pieges:
  - si:
      contient:
      - b
    relance: '« Goodest » n''existe pas : « good » est un adjectif irregulier.'
  - si:
      contient:
      - d
    relance: '« Gooder » n''existe pas non plus : il faut la forme irreguliere complete.'
  solution: Le superlatif de « good » est « the best » (bon -> meilleur -> le meilleur), une forme irreguliere.
- id: description-comparative
  type: ouverte
  difficulte: 3
  enonce: En anglais, ecris trois phrases pour comparer deux villes que tu connais (taille, interet, distance...) en utilisant un comparatif et un superlatif.
  criteres:
  - Les trois phrases sont ecrites en anglais, avec un sujet et un verbe conjugue.
  - Un comparatif (taller, more interesting...) est utilise correctement.
  - Un superlatif (the biggest, the most famous...) est utilise correctement.
  indices:
    relance: Quelle ville te semble la plus grande ou la plus interessante des deux ?
    methode: Compare d'abord deux villes avec un comparatif, puis situe l'une d'elles parmi plusieurs autres avec un superlatif.
    etape: Tu peux commencer par « Paris is bigger than... » puis continuer avec « It is the most famous city in France. »
  solution: 'Exemple possible : « London is bigger than Bristol. It is more expensive too. London is one of the most visited cities in the world. »'
- id: much-ou-many
  type: choix
  difficulte: 1
  enonce: 'Complète : « There are not ___ students in the room. »'
  reponse:
    options:
    - id: a
      texte: many
    - id: b
      texte: much
    - id: c
      texte: a little
    bonnes:
    - a
  indices:
    relance: « Students » est-il un nom qu'on peut compter ?
    methode: Avec un nom comptable au pluriel, on utilise le quantifieur des choses qu'on compte.
    etape: Un des trois quantifieurs sert seulement aux noms qu'on ne compte pas.
  pieges:
  - si:
      contient:
      - b
    relance: « Much » s'utilise avec un nom non comptable comme water. Peut-on compter des élèves ?
  - si:
      contient:
      - c
    relance: « A little » s'utilise avec un nom non comptable. Ici, le nom est pluriel et comptable.
  solution: 'On dit « There are not many students in the room. » : students est un nom comptable pluriel, donc many.'
- id: possessif-her
  type: texte_court
  difficulte: 1
  enonce: 'Complète avec un adjectif possessif : « Anna loves ___ brother. »'
  reponse:
    acceptees:
    - her
    fautes_tolerees: 0
  indices:
    relance: Qui possède le frère ? Anna est un garçon ou une fille ?
    methode: L'adjectif possessif s'accorde avec le possesseur, pas avec le nom qui suit.
    etape: Le possesseur est une fille. Choisis l'adjectif qui correspond à « she ».
  pieges:
  - si:
      valeur: his
    relance: « His » correspond à un possesseur masculin. Anna est-elle un garçon ?
  solution: 'Anna est le possesseur, c''est une fille (she), donc l''adjectif possessif est « her » : « Anna loves her brother. »'
- id: ecrire-comparaison
  type: ouverte
  difficulte: 3
  enonce: En anglais, écris trois phrases pour comparer deux personnes ou deux objets de ton choix, avec un comparatif, un superlatif et un adjectif possessif.
  criteres:
  - Les trois phrases sont écrites en anglais, avec un sujet et un verbe conjugué.
  - Un comparatif (-er ou more, suivi de than) et un superlatif (the -est ou the most) sont bien construits.
  - Un adjectif possessif (my, his, her, their…) est utilisé correctement.
  indices:
    relance: Qui ou quoi compares-tu ? Choisis deux personnes que tu connais bien.
    methode: Phrase 1, un comparatif avec than. Phrase 2, un superlatif avec the. Phrase 3, un possessif.
    etape: Tu peux commencer par « My brother is taller than me. » puis ajouter un superlatif.
  solution: 'Exemple possible : « My brother is taller than me. He is the tallest boy in his class. Their teacher is more strict than mine. »'
