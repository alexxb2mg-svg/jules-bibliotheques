# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: theme-langages
version: 2
etat: verifiee
declencheurs:
- codes culturels dans les médias anglais
- comprendre un logo ou une pub en anglais
- langages artistiques dans le monde anglophone
- réseaux sociaux en anglais
- analyser une affiche de cinéma
- lire un graphique en anglais
- publicité en anglais
- musique et chansons anglophones
prerequis:
- aspects-culturels
essentiel: 'Le thème « Langages » regroupe tout ce qui sert à communiquer et à représenter le monde dans une culture : les
  codes des médias et les langages artistiques.


  Les documents à savoir lire : graphiques, schémas, cartes, logos, tableaux. On regarde le titre, la légende, les unités
  (graph, chart, map, table) avant de lire les détails.


  Les médias et modes de communication : presse, télévision, radio, réseaux sociaux (social media), publicité (advert). Une
  publicité utilise peu de mots et beaucoup de symboles : une image, une couleur, un slogan court. On peut aussi étudier des
  extraits de manuels scolaires de pays anglophones.


  Les codes socio-culturels : la date américaine s''écrit mois/jour/année (07/04/2026 = 4 juillet 2026), différente du format
  français jour/mois/année. Le drapeau américain s''appelle « the Stars and Stripes ».


  Les langages artistiques : peinture (painting), musique et chansons (music, songs), poésie (poetry), cinéma et théâtre (cinema,
  theatre), littérature (literature), bande dessinée (comic strip), science-fiction. On étudie aussi la représentation de
  sculptures, de tableaux, d''œuvres architecturales et de monuments (par exemple Big Ben à Londres, la Statue de la Liberté
  à New York).


  Dimensions géographiques et historiques : un document situe souvent une culture dans un lieu et une époque. Cherche où et
  quand il a été produit.


  Au brevet : décrire un document (nature, source, idée principale), repérer un code culturel, nommer un langage artistique
  et écrire quelques phrases pour le présenter.

  '
methode:
- Identifier la nature du document (affiche, logo, graphique, extrait de journal, tableau, chanson) avant de lire en détail.
- Observer d'abord les images, couleurs et symboles, puis lire le titre, la légende et le slogan.
- 'Repérer un slogan publicitaire court : il résume souvent l''idée principale du message.'
- Comparer les codes numériques (dates, unités) avec ceux de la France pour éviter les erreurs de lecture.
- Nommer le langage artistique concerné (musique, cinéma, peinture, BD, poésie) puis décrire ce qu'on voit ou entend.
- Situer le document dans un lieu et une époque quand c'est possible.
vocabulaire:
- terme: slogan
  definition: une phrase courte et facile à retenir, utilisée dans une publicité
- terme: logo
  definition: un symbole ou un dessin simple qui représente une marque ou une organisation
- terme: social media
  definition: les réseaux sociaux, où l'on publie et partage des messages
- terme: advert
  definition: une publicité, un message qui vend un produit ou une idée
- terme: comic strip
  definition: une bande dessinée courte, faite d'images qui racontent une histoire
- terme: chart
  definition: un graphique ou un tableau qui présente des données
- terme: landmark
  definition: un monument célèbre qui représente une ville ou un pays
erreurs_frequentes:
- Lire une date américaine (mois/jour/année) comme si elle suivait le format français (jour/mois/année).
- Ignorer les images et symboles d'un document, alors qu'ils donnent souvent l'idée principale.
- Confondre un langage artistique avec un autre (par exemple penser qu'un poème est une bande dessinée).
- Se contenter de traduire les mots sans regarder la source, le titre et la légende du document.
exemple:
  enonce: Une publicité américaine affiche la date '07/04/2026'. À quelle date française cela correspond-il ?
  solution: 'Aux États-Unis, le format est mois/jour/année : ''07/04/2026'' signifie donc le 4 juillet 2026 (le mois est écrit
    en premier), et non le 7 avril comme on pourrait le lire en France.'
exercices:
- id: format-date-americain
  type: choix
  difficulte: 1
  enonce: Aux États-Unis, la date '12/25/2026' correspond à quel jour, en lisant le format américain (mois/jour/année) ?
  reponse:
    options:
    - id: a
      texte: Le 25 décembre 2026
    - id: b
      texte: Le 12 janvier 2026
    - id: c
      texte: Le 25 janvier 2026
    bonnes:
    - a
  indices:
    relance: 'Dans le format américain, quel nombre représente le mois : le premier ou le deuxième ?'
    methode: Le format américain place toujours le mois en premier, puis le jour, puis l'année.
    etape: '''12'' est donc le mois (décembre), et ''25'' le jour du mois.'
  pieges:
  - si:
      contient:
      - b
    relance: Tu as lu '12' comme un jour. Dans le format américain, le premier nombre est le mois, pas le jour.
  - si:
      contient:
      - c
    relance: Le mois est '12' (décembre), pas '01' (janvier). Relis bien l'ordre mois/jour/année.
  solution: '''12/25/2026'' au format américain (mois/jour/année) correspond au 25 décembre 2026.'
- id: reconnaitre-slogan
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases ressemble le plus à un slogan publicitaire ?
  reponse:
    options:
    - id: a
      texte: Just do it.
    - id: b
      texte: The train arrives at platform three at nine o'clock.
    - id: c
      texte: She has lived in London for ten years.
    bonnes:
    - a
  indices:
    relance: Un slogan est très court, facile à retenir, et ne donne pas d'information précise comme une heure ou un lieu.
    methode: 'Compare la longueur et le style des trois phrases : laquelle sonne comme une accroche publicitaire ?'
    etape: Les deux autres phrases donnent des informations factuelles précises (horaire, durée), pas un slogan.
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase donne une information pratique précise (heure, quai), ce n'est pas le style d'un slogan.
  - si:
      contient:
      - c
    relance: Cette phrase raconte un fait précis sur une durée, ce n'est pas une accroche publicitaire courte.
  solution: '''Just do it.'' est une phrase courte et facile à retenir, typique du style d''un slogan publicitaire.'
- id: ordre-lecture-logo
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour analyser un logo ou une publicité en anglais.
  reponse:
    elements:
    - id: a
      texte: Look at the colours and images first.
    - id: b
      texte: Read the short slogan, if there is one.
    - id: c
      texte: Check any date or number written on the document.
  indices:
    relance: Que regarde-t-on en premier sur une image, avant même de lire le texte écrit ?
    methode: On observe d'abord le visuel, puis le texte court (slogan), puis les détails précis comme les chiffres.
    etape: '''Look at the colours and images first'' correspond à la toute première étape d''observation.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Lit-on d'abord le slogan ou vérifie-t-on d'abord les chiffres et dates ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'observation visuelle, puis la lecture du slogan, puis la vérification des chiffres.
  solution: D'abord observer les couleurs et images, puis lire le slogan court, puis vérifier les dates ou nombres précis.
- id: symbole-drapeau-americain
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on en anglais le drapeau des États-Unis, à bandes et étoiles ? (deux mots, en anglais)
  reponse:
    acceptees:
    - stars and stripes
    - the stars and stripes
    fautes_tolerees: 1
  indices:
    relance: 'Ce nom décrit directement ce que l''on voit sur le drapeau : des étoiles et des bandes.'
    methode: Traduis 'étoiles' et 'bandes' en anglais, puis relie les deux mots avec 'and'.
    etape: '''Stars'' veut dire étoiles, ''stripes'' veut dire bandes ou rayures.'
  pieges:
  - si:
      valeur: union jack
    relance: '''Union Jack'' est le nom du drapeau britannique, pas celui des États-Unis. Cherche le nom du drapeau américain.'
  solution: Le drapeau des États-Unis s'appelle 'the Stars and Stripes' (les étoiles et les bandes).
- id: nblm-si-une-publicite-americaine-affiche-la-d-1
  type: choix
  difficulte: 2
  enonce: Si une publicité américaine affiche la date '07/04/2026', à quelle date cela correspond-il en France ?
  reponse:
    options:
    - id: o1
      texte: Le 4 juillet 2026
    - id: o2
      texte: Le 7 avril 2026
    - id: o3
      texte: Le 7 juillet 2026
    - id: o4
      texte: Le 4 avril 2026
    bonnes:
    - o1
  indices:
    relance: Pense au format numérique américain des dates présenté dans la fiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : lire le premier chiffre comme le jour selon le format français (jour/mois/année).'
  - si:
      contient:
      - o3
    relance: 'C''est incorrect : le deuxième chiffre 04 ne correspond pas à un 7, la date exacte est le 4 juillet.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : cela inverse le jour et le mois par rapport au format américain.'
  solution: 'Le 4 juillet 2026. C''est exact : aux États-Unis, le format de date est mois/jour/année. Le chiffre 07 désigne
    donc le mois de juillet.'
- id: nblm-dans-le-domaine-des-medias-anglophones-q-2
  type: choix
  difficulte: 2
  enonce: Dans le domaine des médias anglophones, qu'est-ce qu'un « slogan » d'après la fiche ?
  reponse:
    options:
    - id: o1
      texte: Une phrase courte et facile à retenir utilisée dans une publicité
    - id: o2
      texte: Un dessin complexe représentant une grande entreprise
    - id: o3
      texte: Un article de journal détaillant une œuvre d'art
    - id: o4
      texte: Un tableau récapitulatif des dates importantes
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la définition donnée dans la rubrique Vocabulaire de la fiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est la définition proche d'un logo ou d'une illustration visuelle, pas d'un slogan.
  - si:
      contient:
      - o3
    relance: Un slogan est une formule publicitaire très courte, pas un article d'analyse.
  - si:
      contient:
      - o4
    relance: Le slogan est un élément textuel d'accroche publicitaire, pas un tableau de dates.
  solution: 'Une phrase courte et facile à retenir utilisée dans une publicité. C''est exact : la fiche définit le slogan
    comme une phrase courte et facile à retenir.'
- id: nblm-lorsqu-on-etudie-un-document-publicitair-3
  type: choix
  difficulte: 2
  enonce: Lorsqu'on étudie un document publicitaire ou un logo en anglais, quelle est la première étape méthodique recommandée
    ?
  reponse:
    options:
    - id: o1
      texte: Observer d'abord les images, couleurs et symboles avant de lire le texte en détail
    - id: o2
      texte: Traduire chaque mot du texte en s'interdisant de regarder les images
    - id: o3
      texte: Chercher tous les mots inconnus dans un dictionnaire avant de regarder le document
    - id: o4
      texte: Répéter le titre à voix haute pour vérifier l'accent de mot
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments visuels que l'œil repère en premier sur une affiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : ignorer les visuels fait perdre des indices essentiels pour la compréhension.'
  - si:
      contient:
      - o3
    relance: La fiche préconise au contraire de s'appuyer sur les symboles visuels pour comprendre le sens global.
  - si:
      contient:
      - o4
    relance: L'observation d'un document visuel commence par l'analyse des images et symboles, pas par la prononciation.
  solution: 'Observer d''abord les images, couleurs et symboles avant de lire le texte en détail. C''est exact : la méthode
    conseille d''observer les visuels et symboles avant de lire le texte.'
- id: nblm-que-regroupe-la-notion-langages-dans-le-4
  type: choix
  difficulte: 2
  enonce: Que regroupe la notion « Langages » dans le programme d'anglais de 3e ?
  reponse:
    options:
    - id: o1
      texte: Les codes des médias et les langages artistiques
    - id: o2
      texte: Seulement les règles de prononciation des verbes au prétérit
    - id: o3
      texte: La liste des pays membres du Commonwealth
    - id: o4
      texte: Les règles d'utilisation de 'a' et 'an'
    bonnes:
    - o1
  indices:
    relance: Considère les deux grands axes de communication et de représentation cités dans l'Essentiel de la fiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est réducteur : les règles phonétiques font partie de la langue orale, pas du thème culturel ''Langages''.'
  - si:
      contient:
      - o3
    relance: Cela concerne la notion 'Rencontres avec d'autres cultures', pas la notion 'Langages'.
  - si:
      contient:
      - o4
    relance: Cela relève de la grammaire (fiche Détermination), pas de la notion 'Langages'.
  solution: 'Les codes des médias et les langages artistiques. C''est exact : la fiche indique que ce thème regroupe les codes
    des médias et les langages artistiques.'
- id: nblm-pourquoi-est-il-important-de-comprendre-5
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il important de comprendre les symboles et visuels d'une publicité en anglais ?
  reponse:
    options:
    - id: o1
      texte: Cela aide à lire un document authentique même sans connaître tout le vocabulaire
    - id: o2
      texte: Cela permet d'apprendre la conjugaison des verbes irréguliers
    - id: o3
      texte: Cela remplace totalement la lecture du texte écrit
    - id: o4
      texte: Cela garantit d'avoir un accent natif parfait à l'oral
    bonnes:
    - o1
  indices:
    relance: Pense à l'utilité des symboles pour saisir le sens d'un document authentique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Les symboles visuels apportent du sens culturel et informatif, pas des règles de conjugaison.
  - si:
      contient:
      - o3
    relance: Les visuels aident à la compréhension, mais ils complètent la lecture sans l'annuler totalement.
  - si:
      contient:
      - o4
    relance: L'analyse des médias développe la compréhension écrite/visuelle, pas l'accent oral.
  solution: 'Cela aide à lire un document authentique même sans connaître tout le vocabulaire. C''est exact : la fiche explique
    que les symboles visuels aident à comprendre le sens global sans tout traduire.'
- id: nblm-parmi-les-propositions-suivantes-quelles-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes, quelles sont les DEUX formes qui correspondent à des langages artistiques cités
    dans la fiche ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La peinture
    - id: o2
      texte: La bande dessinée
    - id: o3
      texte: Le format de date mois/jour/année
    - id: o4
      texte: L'intonation montante
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche deux domaines d'expression artistique figurant dans la liste de la fiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est un code numérique et médiatique, pas un langage artistique.
  - si:
      contient:
      - o4
    relance: C'est un élément de phonétique orale, pas une forme d'expression artistique.
  solution: 'La peinture ; La bande dessinée. C''est exact : la peinture est explicitement listée parmi les langages artistiques.'
- id: nblm-quel-terme-de-vocabulaire-designe-un-sym-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme de vocabulaire désigne un symbole ou dessin simple qui représente une marque dans un document média ?
  reponse:
    acceptees:
    - logo
    fautes_tolerees: 1
  indices:
    relance: Ce mot masculin très court désigne l'image de marque visuelle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'logo. C''est la bonne réponse : la fiche définit le logo comme un symbole ou dessin simple représentant une marque.'
- id: nblm-dans-une-publicite-quelle-phrase-courte-8
  type: texte_court
  difficulte: 1
  enonce: Dans une publicité, quelle phrase courte permet de résumer l'idée principale du message ?
  reponse:
    acceptees:
    - slogan
    fautes_tolerees: 1
  indices:
    relance: Ce mot de vocabulaire désigne l'accroche publicitaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'slogan. C''est la bonne réponse : repérer un slogan court permet de résumer l''idée principale selon la fiche.'
- id: langage-artistique
  type: association
  difficulte: 1
  enonce: Associe chaque mot anglais à son langage artistique.
  reponse:
    gauche:
    - id: a
      texte: painting
    - id: b
      texte: poetry
    - id: c
      texte: comic strip
    droite:
    - id: x
      texte: La peinture
    - id: y
      texte: La poésie
    - id: z
      texte: La bande dessinée
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces mots ressemble presque au mot français.
    methode: « Poetry » vient du même mot latin que « poésie ». « Comic » fait penser à « comique ».
    etape: « Paint » veut dire peindre, comme dans la peinture.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux mots qui ressemblent au français.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le mot qui contient « paint », lié à la couleur, puis par « poetry ».
  solution: painting = la peinture ; poetry = la poésie ; comic strip = la bande dessinée.
- id: sens-social-media
  type: choix
  difficulte: 1
  enonce: Que désigne l'expression « social media » ?
  reponse:
    options:
    - id: a
      texte: Les réseaux sociaux
    - id: b
      texte: Les journaux imprimés
    - id: c
      texte: Une chaîne de télévision publique
    bonnes:
    - a
  indices:
    relance: Pense aux applications sur lesquelles tu échanges des messages et des photos.
    methode: « Social » ressemble au français « social » et « media » à « médias ».
    etape: Une des propositions parle de papier, une autre de télévision. Aucune ne correspond à une application en ligne.
  pieges:
  - si:
      contient:
      - b
    relance: Un journal imprimé est sur papier. Cherche plutôt un lieu en ligne où chacun publie.
  - si:
      contient:
      - c
    relance: Une chaîne de télévision publique n'est pas un lieu où chacun publie et partage. Cherche une autre proposition.
  solution: « Social media » désigne les réseaux sociaux, où chacun publie et partage des messages.
- id: lire-une-date
  type: texte_court
  difficulte: 2
  enonce: Un site américain affiche la date « 03/15/2026 ». Écris en anglais le nom du mois de cette date.
  reponse:
    acceptees:
    - march
    fautes_tolerees: 1
  indices:
    relance: Il n'existe pas de quinzième mois dans l'année.
    methode: Aux États-Unis, le premier nombre d'une date est le mois, le deuxième est le jour.
    etape: Un des deux nombres ne peut pas être un mois, car il dépasse douze. L'autre est donc le mois. Cherche son nom en
      anglais.
  pieges:
  - si:
      valeur: may
    relance: Compte les mois depuis janvier avec le bon nombre du format américain (le premier nombre).
  solution: 'Format américain : mois/jour/année. « 03/15/2026 » = mois 3 (March), jour 15, année 2026, donc le 15 mars 2026.'
- id: presenter-un-document
  type: ouverte
  difficulte: 3
  enonce: En anglais, écris trois phrases pour présenter une publicité ou une affiche de cinéma anglophone que tu connais
    (type de document, ce qu'on y voit, message principal).
  criteres:
  - Les trois phrases sont écrites en anglais, avec un sujet et un verbe conjugué.
  - Le type de document est précisé (advert, poster, logo…) et un élément visuel est décrit (couleur, image, personnage).
  - Le message principal ou le slogan est identifié.
  indices:
    relance: Quel est le produit ou le film, et que montre l'image ?
    methode: Phrase 1, la nature du document. Phrase 2, ce qu'on y voit. Phrase 3, le message principal.
    etape: Tu peux commencer par « This is a poster for a film. » puis décrire l'image.
  solution: 'Exemple possible : « This is an advert for a sports brand. I can see a runner and a short slogan in big letters.
    The message is that everybody can do sport. »'
