format: 2
notion: theme-rencontres-autres-cultures
version: 2
etat: generee
declencheurs:
- Commonwealth c'est quoi
- Thanksgiving en anglais
- parcs naturels des pays anglophones
- energies renouvelables en anglais
- patrimoine mondial anglophone
- climat des pays anglophones
- biodiversité en Australie
- réserve de biosphère
- inclusion et exclusion en anglais
prerequis:
- theme-voyages-et-migrations
essentiel: |
  Ce thème porte sur les rencontres entre cultures : repères historiques et géographiques, patrimoine, environnement, inclusion et exclusion.

  Le patrimoine (heritage) peut être historique (un château, une ville ancienne), naturel (un parc, une montagne) ou architectural (un pont, une cathédrale). Un pays le protège pour le transmettre aux générations futures.

  Le Commonwealth est un groupe de 56 pays, la plupart anciennement liés au Royaume-Uni (Canada, Australie, Inde, Kenya…). Ces pays coopèrent sur l'éducation, le sport ou l'environnement. Ce n'est pas le Royaume-Uni seul.

  Inclusion et exclusion : une société est inclusive quand chacun a sa place, quelle que soit son origine. L'exclusion, c'est mettre des personnes à l'écart. Les rencontres entre cultures posent la question de l'accueil des autres.

  Aux États-Unis, Thanksgiving est une fête nationale célébrée le quatrième jeudi de novembre. Les familles se réunissent pour un grand repas, traditionnellement avec de la dinde (turkey).

  Parcs et réserves : les pays anglophones comptent de grands espaces protégés (national parks), comme Yellowstone aux États-Unis, premier parc national du monde, créé en 1872. Une réserve de biosphère (biosphere reserve) est un espace où l'on protège la nature tout en permettant des activités humaines.

  Climat et biodiversité : les climats varient beaucoup d'un pays à l'autre (désert en Australie, froid au Canada, pluie fréquente en Irlande). Ils expliquent une faune et une flore différentes : c'est la biodiversité.

  Énergies renouvelables (renewable energy) : elles ne s'épuisent pas. Exemples : l'éolien (wind power), le solaire (solar power), l'hydraulique (hydropower). À l'inverse, le pétrole et le charbon (fossil fuels) sont non renouvelables.

  Au brevet : donner un repère précis (fête, parc, organisation), utiliser le vocabulaire de l'environnement et présenter en quelques phrases une rencontre entre cultures.
methode:
- 'Repérer le sujet : patrimoine, inclusion, fête, environnement ou énergie.'
- Pour un fait culturel, retenir un nom propre, une date ou un chiffre précis avant de répondre.
- Pour le vocabulaire des énergies, associer le type d'énergie (wind, solar) au mot power ou energy.
- Séparer les énergies renouvelables (vent, soleil, eau) des énergies fossiles (pétrole, charbon).
- Comparer le pays étudié avec la France sur un point précis (climat, fête, parc naturel).
- Rédiger en phrases simples, au présent, avec un vocabulaire précis.
vocabulaire:
- terme: the Commonwealth
  definition: un groupe de 56 pays, la plupart anciennement liés au Royaume-Uni, qui coopèrent sur plusieurs sujets
- terme: Thanksgiving
  definition: fête nationale américaine célébrée le quatrième jeudi de novembre, avec un grand repas en famille
- terme: a national park
  definition: un grand espace naturel protégé, ouvert aux visiteurs
- terme: renewable energy
  definition: une énergie qui ne s'épuise pas, comme le vent ou le soleil
- terme: wind power
  definition: l'énergie produite par le vent, grâce à des éoliennes
- terme: heritage
  definition: le patrimoine, ce qu'un pays veut protéger et transmettre
- terme: biodiversity
  definition: la variété des espèces vivantes d'un lieu
- terme: inclusion
  definition: le fait de donner une place à chacun dans la société
erreurs_frequentes:
- Confondre le Commonwealth (56 pays) avec le Royaume-Uni seul.
- Croire que Thanksgiving se célèbre à la même date qu'en France ou qu'au Canada (au Canada, c'est le deuxième lundi d'octobre).
- Utiliser « renewable » pour parler du pétrole ou du charbon, qui sont des énergies non renouvelables.
- Confondre un parc national (espace protégé) avec un parc d'attractions.
exemple:
  enonce: 'Traduis en anglais : « Le parc national de Yellowstone a ete cree en 1872. »'
  solution: 'On peut dire : « Yellowstone National Park was created in 1872. »'
exercices:
- id: sens-commonwealth
  type: choix
  difficulte: 1
  enonce: Que designe « the Commonwealth » ?
  reponse:
    options:
    - id: a
      texte: Un groupe de 56 pays, la plupart anciennement lies au Royaume-Uni
    - id: b
      texte: Une seule ville du Royaume-Uni
    - id: c
      texte: Une monnaie utilisee en Europe
    - id: d
      texte: Un traite militaire entre la France et les Etats-Unis
    bonnes:
    - a
  indices:
    relance: Ce mot est compose de « common » (commun) et « wealth » (richesse). A quoi cela peut-il faire penser ?
    methode: Pense aux pays qui ont ete lies au Royaume-Uni dans le passe, comme le Canada ou l'Australie.
    etape: Le Commonwealth reunit plusieurs pays, pas une seule ville ni une seule monnaie.
  pieges:
  - si:
      contient:
      - b
    relance: 'Le Commonwealth n''est pas une ville : c''est un groupe de plusieurs pays.'
  - si:
      contient:
      - c
    relance: Il ne s'agit pas d'une monnaie. Cherche plutot un ensemble de pays.
  solution: Le Commonwealth est un groupe de 56 pays, la plupart anciennement lies au Royaume-Uni, comme le Canada, l'Australie, l'Inde ou le Kenya.
- id: mois-thanksgiving
  type: texte_court
  difficulte: 1
  enonce: En anglais, quel mois de l'annee celebre-t-on Thanksgiving aux Etats-Unis (le quatrieme jeudi de ce mois) ?
  reponse:
    acceptees:
    - november
    fautes_tolerees: 1
  indices:
    relance: C'est un mois d'automne dans l'hemisphere nord.
    methode: Compte les mois de l'annee en anglais et cherche celui qui precede decembre.
    etape: Ce mois commence par la lettre « N » en anglais.
  pieges:
  - si:
      valeur: october
    relance: En octobre, c'est plutot Halloween qui est celebre aux Etats-Unis. Thanksgiving a lieu le mois suivant.
  solution: 'La reponse est "november" : Thanksgiving est celebre en novembre (le quatrieme jeudi du mois) aux Etats-Unis.'
- id: associer-energie
  type: association
  difficulte: 2
  enonce: Associe chaque type d'energie a sa source.
  reponse:
    gauche:
    - id: a
      texte: wind power
    - id: b
      texte: solar power
    - id: c
      texte: fossil fuel
    droite:
    - id: x
      texte: L'energie du vent
    - id: y
      texte: L'energie du soleil
    - id: z
      texte: Le petrole ou le charbon, une energie non renouvelable
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Deux de ces energies sont renouvelables, une seule ne l'est pas.
    methode: Le mot « wind » signifie vent et « solar » vient de « soleil » (sun).
    etape: « Fossil fuel » signifie « combustible fossile », comme le petrole.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Verifie d'abord wind et solar, qui sont proches de mots francais.
  - si:
      diagnostic: associations_fausses
    relance: Separe d'abord les deux energies renouvelables (wind, solar) de l'energie non renouvelable (fossil fuel).
  solution: wind power = l'energie du vent ; solar power = l'energie du soleil ; fossil fuel = le petrole ou le charbon, une energie non renouvelable.
- id: annee-creation-yellowstone
  type: nombre
  difficulte: 2
  enonce: En quelle annee le parc national de Yellowstone, le premier parc national du monde, a-t-il ete cree ?
  reponse:
    valeur: 1872
    forme: entier
  indices:
    relance: C'est le tout premier parc national jamais cree, au XIXe siecle.
    methode: Cette date se situe apres la fin de la guerre de Secession americaine (1865), au debut des annees 1870.
    etape: L'annee commence par « 18 » et se termine par « 72 ».
  pieges:
  - si:
      valeur: 1972
    relance: 'C''est un siecle trop tard. Yellowstone est bien plus ancien : cherche dans le XIXe siecle.'
  solution: Yellowstone National Park a ete cree en 1872, ce qui en fait le premier parc national du monde.
- id: description-fete-anglophone
  type: ouverte
  difficulte: 3
  enonce: 'En anglais, ecris trois phrases pour decrire la fete de Thanksgiving : la date, la tradition principale, et pourquoi les familles se reunissent.'
  criteres:
  - Les trois phrases sont ecrites en anglais, avec un sujet et un verbe conjugue.
  - La date (le quatrieme jeudi de novembre) est mentionnee correctement.
  - Une tradition (le repas, la dinde, la reunion de famille) est decrite.
  indices:
    relance: Quel plat traditionnel les familles americaines mangent-elles ce jour-la ?
    methode: Commence par la date, puis decris le repas, puis explique pourquoi les familles se reunissent.
    etape: Tu peux commencer par « Thanksgiving is in November. » puis continuer avec « Families eat turkey together. »
  solution: 'Exemple possible : « Thanksgiving is celebrated on the fourth Thursday of November. Families eat a big meal with turkey. They come together to give thanks. »'
- id: energies-renouvelables
  type: choix
  difficulte: 2
  enonce: Quelles énergies sont renouvelables ? Choisis toutes les bonnes réponses.
  reponse:
    options:
    - id: a
      texte: wind power
    - id: b
      texte: coal
    - id: c
      texte: solar power
    - id: d
      texte: oil
    bonnes:
    - a
    - c
  indices:
    relance: Une énergie renouvelable ne s'épuise pas à l'usage.
    methode: Le vent et le soleil reviennent chaque jour. Le charbon et le pétrole se forment en millions d'années.
    etape: « Coal » signifie charbon et « oil » signifie pétrole.
  pieges:
  - si:
      contient:
      - b
    relance: Le charbon est une énergie fossile, qui s'épuise. Il n'est pas renouvelable.
  - si:
      contient:
      - d
    relance: Le pétrole est une énergie fossile, qui s'épuise. Il n'est pas renouvelable.
  solution: Wind power (le vent) et solar power (le soleil) sont renouvelables. Coal (charbon) et oil (pétrole) sont des énergies fossiles.
- id: nombre-pays-commonwealth
  type: nombre
  difficulte: 2
  enonce: Combien de pays compte le Commonwealth ?
  reponse:
    valeur: 56
    forme: entier
  indices:
    relance: Relis la définition du Commonwealth dans l'essentiel.
    methode: Le Commonwealth est un groupe de pays, la plupart anciennement liés au Royaume-Uni.
    etape: Cherche dans l'essentiel la phrase qui commence par « Le Commonwealth est un groupe de… ».
  pieges:
  - si:
      valeur: 54
    relance: Ce nombre se rapproche, mais il n'est pas exact. Relis la définition.
  solution: Le Commonwealth réunit 56 pays, la plupart anciennement liés au Royaume-Uni.
- id: presenter-un-parc
  type: ouverte
  difficulte: 3
  enonce: En anglais, écris trois phrases pour présenter un espace naturel protégé d'un pays anglophone (nom, pays, intérêt pour la nature).
  criteres:
  - Les trois phrases sont écrites en anglais, avec un sujet et un verbe conjugué.
  - Le nom du lieu et son pays sont exacts (par exemple Yellowstone, États-Unis).
  - Un intérêt pour la nature ou la biodiversité est mentionné (animaux, paysages, protection).
  indices:
    relance: Quel parc ou quelle réserve connais-tu, et dans quel pays ?
    methode: Phrase 1, le nom et le pays. Phrase 2, ce qu'on y voit. Phrase 3, pourquoi il faut le protéger.
    etape: Tu peux commencer par « Yellowstone is a national park in the United States. » puis continuer.
  solution: 'Exemple possible : « Yellowstone is a national park in the United States. Many animals live there, like bears and bison. We must protect this place for the future. »'
