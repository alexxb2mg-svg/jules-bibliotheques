# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: theme-rencontres-autres-cultures
version: 1
etat: verifiee
declencheurs:
- Commonwealth c'est quoi
- Thanksgiving en anglais
- parcs naturels des pays anglophones
- energies renouvelables en anglais
- patrimoine mondial anglophone
prerequis:
- theme-voyages-et-migrations
couverture: 'Presente des reperes culturels factuels des pays anglophones : le Commonwealth, Thanksgiving, quelques parcs
  nationaux et le vocabulaire des energies renouvelables. Ne couvre pas l''histoire detaillee de la colonisation ni les debats
  politiques actuels.'
essentiel: 'Le « Commonwealth » est un groupe de 56 pays, la plupart anciennement lies au Royaume-Uni

  (par exemple le Canada, l''Australie, l''Inde, le Kenya). Ces pays cooperent sur des

  sujets comme l''education, le sport ou l''environnement.


  Aux Etats-Unis, « Thanksgiving » est une fete nationale celebree le quatrieme jeudi

  de novembre. Les familles se reunissent pour un grand repas, traditionnellement

  avec de la dinde (« turkey »).


  Les pays anglophones comptent de grands parcs naturels proteges, comme le « Yellowstone

  National Park » aux Etats-Unis, le premier parc national du monde, cree en 1872.

  Beaucoup de ces pays developpent aussi des « renewable energy » (energies renouvelables)

  comme l''eolien (« wind power ») et le solaire (« solar power »).

  '
methode:
- Repere si la question porte sur une organisation (Commonwealth), une fete (Thanksgiving) ou l'environnement (parcs, energies
  renouvelables).
- Pour un fait culturel, retiens un nom propre, une date ou un chiffre precis avant de repondre.
- Pour le vocabulaire des energies, associe le type d'energie (wind, solar) au mot « power » ou « energy ».
vocabulaire:
- terme: the Commonwealth
  definition: un groupe de 56 pays, la plupart anciennement lies au Royaume-Uni, qui cooperent sur plusieurs sujets
- terme: Thanksgiving
  definition: fete nationale americaine celebree le quatrieme jeudi de novembre, avec un grand repas en famille
- terme: a national park
  definition: un grand espace naturel protege, ouvert aux visiteurs
- terme: renewable energy
  definition: une energie qui ne s'epuise pas, comme le vent ou le soleil
- terme: wind power
  definition: l'energie produite par le vent, grace a des eoliennes
erreurs_frequentes:
- Confondre le Commonwealth (56 pays) avec le Royaume-Uni seul.
- Croire que Thanksgiving se celebre a la meme date qu'en France ou qu'au Canada (au Canada, c'est le deuxieme lundi d'octobre).
- Utiliser « renewable » pour parler du petrole ou du charbon, qui sont des energies non renouvelables.
exemple:
  enonce: 'Traduis en anglais : « Le parc national de Yellowstone a ete cree en 1872. »'
  solution: 'On peut dire : « Yellowstone National Park was created in 1872. »'
exercices:
- id: sens-commonwealth
  type: choix
  difficulte: 1
  enonce: Que designe « the Commonwealth » ?
  reponse:
    options:
    - id: a
      texte: Un groupe de 56 pays, la plupart anciennement lies au Royaume-Uni
    - id: b
      texte: Une seule ville du Royaume-Uni
    - id: c
      texte: Une monnaie utilisee en Europe
    - id: d
      texte: Un traite militaire entre la France et les Etats-Unis
    bonnes:
    - a
  indices:
    relance: Ce mot est compose de « common » (commun) et « wealth » (richesse). A quoi cela peut-il faire penser ?
    methode: Pense aux pays qui ont ete lies au Royaume-Uni dans le passe, comme le Canada ou l'Australie.
    etape: Le Commonwealth reunit plusieurs pays, pas une seule ville ni une seule monnaie.
  pieges:
  - si:
      contient:
      - b
    relance: 'Le Commonwealth n''est pas une ville : c''est un groupe de plusieurs pays.'
  - si:
      contient:
      - c
    relance: Il ne s'agit pas d'une monnaie. Cherche plutot un ensemble de pays.
  solution: Le Commonwealth est un groupe de 56 pays, la plupart anciennement lies au Royaume-Uni, comme le Canada, l'Australie,
    l'Inde ou le Kenya.
- id: mois-thanksgiving
  type: texte_court
  difficulte: 1
  enonce: En anglais, quel mois de l'annee celebre-t-on Thanksgiving aux Etats-Unis (le quatrieme jeudi de ce mois) ?
  reponse:
    acceptees:
    - november
    fautes_tolerees: 1
  indices:
    relance: C'est un mois d'automne dans l'hemisphere nord.
    methode: Compte les mois de l'annee en anglais et cherche celui qui precede decembre.
    etape: Ce mois commence par la lettre « N » en anglais.
  pieges:
  - si:
      valeur: october
    relance: En octobre, c'est plutot Halloween qui est celebre aux Etats-Unis. Thanksgiving a lieu le mois suivant.
  solution: 'La reponse est "november" : Thanksgiving est celebre en novembre (le quatrieme jeudi du mois) aux Etats-Unis.'
- id: associer-energie
  type: association
  difficulte: 2
  enonce: Associe chaque type d'energie a sa source.
  reponse:
    gauche:
    - id: a
      texte: wind power
    - id: b
      texte: solar power
    - id: c
      texte: fossil fuel
    droite:
    - id: x
      texte: L'energie du vent
    - id: y
      texte: L'energie du soleil
    - id: z
      texte: Le petrole ou le charbon, une energie non renouvelable
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Deux de ces energies sont renouvelables, une seule ne l'est pas.
    methode: Le mot « wind » signifie vent et « solar » vient de « soleil » (sun).
    etape: « Fossil fuel » signifie « combustible fossile », comme le petrole.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Verifie d'abord wind et solar, qui sont proches de mots francais.
  - si:
      diagnostic: associations_fausses
    relance: Separe d'abord les deux energies renouvelables (wind, solar) de l'energie non renouvelable (fossil fuel).
  solution: wind power = l'energie du vent ; solar power = l'energie du soleil ; fossil fuel = le petrole ou le charbon, une
    energie non renouvelable.
- id: annee-creation-yellowstone
  type: nombre
  difficulte: 2
  enonce: En quelle annee le parc national de Yellowstone, le premier parc national du monde, a-t-il ete cree ?
  reponse:
    valeur: 1872
    forme: entier
  indices:
    relance: C'est le tout premier parc national jamais cree, au XIXe siecle.
    methode: Cette date se situe apres la fin de la guerre de Secession americaine (1865), au debut des annees 1870.
    etape: L'annee commence par « 18 » et se termine par « 72 ».
  pieges:
  - si:
      valeur: 1972
    relance: 'C''est un siecle trop tard. Yellowstone est bien plus ancien : cherche dans le XIXe siecle.'
  solution: Yellowstone National Park a ete cree en 1872, ce qui en fait le premier parc national du monde.
- id: description-fete-anglophone
  type: ouverte
  difficulte: 3
  enonce: 'En anglais, ecris trois phrases pour decrire la fete de Thanksgiving : la date, la tradition principale, et pourquoi
    les familles se reunissent.'
  criteres:
  - Les trois phrases sont ecrites en anglais, avec un sujet et un verbe conjugue.
  - La date (le quatrieme jeudi de novembre) est mentionnee correctement.
  - Une tradition (le repas, la dinde, la reunion de famille) est decrite.
  indices:
    relance: Quel plat traditionnel les familles americaines mangent-elles ce jour-la ?
    methode: Commence par la date, puis decris le repas, puis explique pourquoi les familles se reunissent.
    etape: Tu peux commencer par « Thanksgiving is in November. » puis continuer avec « Families eat turkey together. »
  solution: 'Exemple possible : « Thanksgiving is celebrated on the fourth Thursday of November. Families eat a big meal with
    turkey. They come together to give thanks. »'
- id: nblm-qu-est-ce-que-le-commonwealth-selon-la-f-1
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que le Commonwealth selon la fiche de cours ?
  reponse:
    options:
    - id: o1
      texte: Un groupe de 56 pays, la plupart d'anciennes colonies britanniques, qui coopèrent sur divers sujets.
    - id: o2
      texte: Le nom officiel désignant uniquement le territoire du Royaume-Uni.
    - id: o3
      texte: Une alliance militaire exclusive réservée aux pays européens.
    - id: o4
      texte: Une organisation regroupant uniquement les 50 États américains.
    bonnes:
    - o1
  indices:
    relance: Pense au nombre de pays membres et à leurs liens historiques avec le Royaume-Uni.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, c'est une erreur fréquente. Le Commonwealth regroupe 56 pays membres à travers le monde, et non pas
      seulement le Royaume-Uni.
  - si:
      contient:
      - o3
    relance: C'est incorrect. Il s'agit d'une coopération multilatérale axée sur l'éducation, le sport ou l'environnement,
      avec des membres sur tous les continents.
  - si:
      contient:
      - o4
    relance: Faux. Les États-Unis ne font pas partie du Commonwealth, qui regroupe d'anciennes colonies britanniques.
  solution: Un groupe de 56 pays, la plupart d'anciennes colonies britanniques, qui coopèrent sur divers sujets. C'est exact.
    Le Commonwealth rassemble 56 pays (comme le Canada, l'Australie, l'Inde ou le Kenya) qui coopèrent notamment dans l'éducation,
    le sport et l'environnement.
- id: nblm-a-quelle-date-est-celebree-la-fete-natio-2
  type: choix
  difficulte: 2
  enonce: À quelle date est célébrée la fête nationale américaine de Thanksgiving aux États-Unis ?
  reponse:
    options:
    - id: o1
      texte: Le quatrième jeudi de novembre.
    - id: o2
      texte: Le deuxième lundi d'octobre.
    - id: o3
      texte: Le quatrième vendredi de novembre.
    - id: o4
      texte: Le dernier dimanche de décembre.
    bonnes:
    - o1
  indices:
    relance: Cherche le jour de la semaine et le mois précis où les familles américaines se réunissent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention ! Le deuxième lundi d'octobre correspond à la date de Thanksgiving au Canada, pas aux États-Unis.
  - si:
      contient:
      - o3
    relance: Faux. La fête a lieu un jeudi (le vendredi qui suit étant le Black Friday).
  - si:
      contient:
      - o4
    relance: Incorrect. Thanksgiving est célébré en novembre, bien avant les fêtes de fin d'année.
  solution: Le quatrième jeudi de novembre. Exact ! Aux États-Unis, Thanksgiving se fête chaque année le quatrième jeudi de
    novembre.
- id: nblm-comment-traduit-on-l-expression-energies-3
  type: choix
  difficulte: 2
  enonce: Comment traduit-on l'expression « énergies renouvelables » en anglais ?
  reponse:
    options:
    - id: o1
      texte: renewable energy
    - id: o2
      texte: ecologic power
    - id: o3
      texte: fossil energy
    - id: o4
      texte: recycled power
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'adjectif anglais désignant ce qui se renouvelle à l'infini comme le vent ou le soleil.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Incorrect. « Fossil energy » désigne les énergies fossiles comme le pétrole ou le charbon, qui sont non renouvelables.
  - si:
      contient:
      - o4
    relance: Faux. « Recycled » s'applique au recyclage des objets/déchets (« recycling »), pas aux sources d'énergie.
  solution: renewable energy. Bravo ! L'expression exacte pour désigner une énergie qui ne s'épuise pas est « renewable energy
    ».
- id: nblm-quel-est-le-premier-parc-national-du-mon-4
  type: choix
  difficulte: 2
  enonce: Quel est le premier parc national du monde, créé aux États-Unis en 1872 ?
  reponse:
    options:
    - id: o1
      texte: Yellowstone National Park
    - id: o2
      texte: Grand Canyon National Park
    - id: o3
      texte: Central Park
    - id: o4
      texte: Ellis Island Park
    bonnes:
    - o1
  indices:
    relance: Son nom est mentionné dans la fiche avec l'année exacte de sa création (1872).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Incorrect. Bien que très célèbre, le Grand Canyon n'a pas été le tout premier parc national mondial créé en 1872.
  - si:
      contient:
      - o3
    relance: Faux. Central Park est un parc urbain situé à New York, et non une grande réserve naturelle nationale.
  - si:
      contient:
      - o4
    relance: Attention. Ellis Island est un site historique lié à l'immigration, pas le premier parc national naturel.
  solution: Yellowstone National Park. C'est la bonne réponse ! Créé en 1872 aux États-Unis, Yellowstone est historiquement
    le premier parc national au monde.
- id: nblm-quelle-est-la-traduction-anglaise-exacte-5
  type: choix
  difficulte: 2
  enonce: Quelle est la traduction anglaise exacte de « l'énergie éolienne » ?
  reponse:
    options:
    - id: o1
      texte: wind power
    - id: o2
      texte: solar power
    - id: o3
      texte: air energy
    - id: o4
      texte: water power
    bonnes:
    - o1
  indices:
    relance: Associe le mot anglais désignant le vent avec le mot exprimant l'énergie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention. « Solar power » désigne l'énergie solaire, pas l'énergie éolienne.
  - si:
      contient:
      - o3
    relance: Incorrect. Pour le vent, le terme anglais précis est « wind », et non pas simplement « air ».
  - si:
      contient:
      - o4
    relance: Faux. « Water power » (ou hydro power) fait référence à l'énergie hydraulique.
  solution: wind power. Très bien ! L'énergie éolienne (produite par le vent) se traduit par « wind power ».
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations exactes concernant le thème des rencontres et de l'environnement ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le Commonwealth est une organisation réunissant 56 pays.
    - id: o2
      texte: Le charbon et le pétrole sont des exemples de « renewable energy ».
    - id: o3
      texte: Au Royaume-Uni, Thanksgiving est célébré le deuxième lundi d'octobre.
    - id: o4
      texte: Le parc national de Yellowstone a été créé en 1872 aux États-Unis.
    bonnes:
    - o1
    - o4
  indices:
    relance: Vérifie attentivement les chiffres clés de la fiche (nombre de pays membres et date de création de Yellowstone).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux ! La fiche rappelle que le pétrole et le charbon sont des énergies fossiles non renouvelables.
  - si:
      contient:
      - o3
    relance: Incorrect ! Thanksgiving est une fête américaine/canadienne, pas britannique.
  solution: Le Commonwealth est une organisation réunissant 56 pays ; Le parc national de Yellowstone a été créé en 1872 aux
    États-Unis. Exact ! La fiche indique clairement que le Commonwealth regroupe 56 pays qui coopèrent entre eux.
- id: nblm-complete-la-phrase-lors-du-repas-traditi-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : Lors du repas traditionnel de Thanksgiving aux États-Unis, le plat principal servi est la
    dinde, qui se dit ________ en anglais.'
  reponse:
    acceptees:
    - turkey
    fautes_tolerees: 1
  indices:
    relance: Il s'agit du nom anglais de la volaille traditionnelle de ce repas familial.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: turkey. Exact ! La dinde servie pour Thanksgiving se dit « turkey » en anglais.
- id: nblm-complete-la-phrase-un-grand-espace-natur-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : Un grand espace naturel protégé et ouvert aux visiteurs se traduit par l''expression ________
    en anglais.'
  reponse:
    acceptees:
    - national park
    fautes_tolerees: 1
  indices:
    relance: Cette expression anglaise de deux mots se traduit littéralement par parc national.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: national park. Bravo ! L'expression de deux mots désignant un grand parc naturel protégé est « national park ».
