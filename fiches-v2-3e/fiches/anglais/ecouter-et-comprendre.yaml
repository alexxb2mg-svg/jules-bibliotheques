- id: mot-outil-because
  type: texte_court
  difficulte: 2
  enonce: 'Transcription : ''I''m late because the bus was cancelled.'' Quel mot annonce la cause du retard ? Réponds en un
    mot anglais.'
  reponse:
    acceptees:
    - because
    fautes_tolerees: 1
  indices:
    relance: Cherche le mot qui répond à la question « pourquoi est-il en retard ? ».
    methode: Le mot qui annonce une cause s'écrit comme « parce que » en français.
    etape: Il commence par 'be' et se trouve au milieu de la phrase.
  pieges:
  - si:
      valeur: late
    relance: '''Late'' veut dire en retard : c''est le résultat. Cherche le mot qui annonce la cause de ce retard.'
  - si:
      valeur: but
    relance: '''But'' n''est pas dans la phrase. Relis-la et repère le mot qui donne la raison.'
  solution: '''Because'' (parce que) annonce la cause : le bus a été annulé.'
- id: indices-situation
  type: association
  difficulte: 2
  enonce: Associe chaque indice entendu à la situation qu'il évoque.
  reponse:
    gauche:
    - id: a
      texte: '''Please fasten your seat belts'''
    - id: b
      texte: '''That will be five euros, please'''
    - id: c
      texte: '''Open your books at page ten'''
    droite:
    - id: x
      texte: dans un avion
    - id: y
      texte: dans un magasin
    - id: z
      texte: dans une salle de classe
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque phrase, imagine qui la dit et où.
    methode: 'Cherche le mot-clé : ''seat belts'', ''euros'', ''books'' te renseignent sur le lieu.'
    etape: '''Open your books'' est dit par un professeur. Associe-la d''abord.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis-les une par une et repère celle qui ne convient pas.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Commence par celle dont tu es le plus sûr, puis avance par élimination.
  solution: '''Fasten your seat belts'' = avion ; ''five euros, please'' = magasin ; ''open your books'' = classe.'
- id: ecoute-message-vocal
  type: ouverte
  difficulte: 3
  enonce: 'Transcription d''un message vocal écrit pour l''exercice : ''Hi Lucy, it''s Sam. I''m at the sports centre, but
    the swimming pool is closed today. So I''m going to the park with Jack. Meet us there at two o''clock. See you!'' En français,
    dis qui parle et à qui, où se trouve Sam, ce qui pose problème, ce qu''il propose. Cite les mots qui te l''ont fait comprendre.'
  criteres:
  - L'élève identifie Sam qui parle à Lucy (« it's Sam », « Hi Lucy ») et le lieu de départ, le centre sportif.
  - L'élève explique que la piscine est fermée et repère le mot-outil « but ».
  - L'élève dit que Sam propose de se retrouver au parc à deux heures, avec Jack, et relève « So » et « two o'clock ».
  indices:
    relance: Quels mots te disent qui parle et où ? Quel mot-outil annonce un problème ? Lequel annonce la suite ?
    methode: 'Organise ta réponse en quatre points : qui, où, problème, proposition. Cite un mot pour chacun.'
    etape: 'Commence ainsi : « C''est Sam qui parle à Lucy, car le message dit ''it''s Sam''... »'
  solution: Sam laisse un message à Lucy. Il est au centre sportif, mais la piscine est fermée (« but »). Donc (« so ») il
    va au parc avec Jack et propose de se retrouver là-bas à deux heures (« two o'clock »).
