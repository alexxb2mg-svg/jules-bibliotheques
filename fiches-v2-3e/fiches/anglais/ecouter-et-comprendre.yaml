# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: ecouter-et-comprendre
version: 1
etat: verifiee
declencheurs:
- comprendre un anglais qui parle vite
- repérer des mots dans une écoute
- deviner le sens sans tout comprendre
- comprendre une vidéo en anglais
prerequis: []
couverture: Travaille le repérage d'indices sur des transcriptions courtes (pas de fichier audio réel). Ne couvre pas la compréhension
  de documents sonores longs ou authentiques (interviews, journaux radio complets).
essentiel: 'Écouter et comprendre en anglais ne veut pas dire comprendre chaque mot. On s''appuie sur des indices : le ton

  de la voix, les mots reconnus (souvent au début ou à la fin d''une phrase), les nombres, les noms propres, les

  mots répétés.


  Avant d''écouter, on se demande : qui parle ? où ? pourquoi ? Ces questions aident à deviner le sens même si

  certains mots manquent.


  Des mots comme "but", "so", "because" annoncent une explication ou une opposition à venir : ils aident à suivre

  le fil du message.

  '
methode:
- 'Lire ou écouter d''abord le titre ou le contexte, s''il y en a un : cela donne une idée du sujet.'
- Repérer les mots que l'on reconnaît (nombres, noms, mots proches du français) sans paniquer sur les autres.
- 'Repérer les mots-outils qui annoncent une suite logique : ''because'' (parce que), ''but'' (mais), ''so'' (donc).'
- Se demander qui parle, à qui, et dans quel but, avant de chercher le détail.
- Reformuler en français ce que l'on a compris, même de façon incomplète, plutôt que de rester bloqué sur un mot.
vocabulaire:
- terme: clue
  definition: un indice qui aide à comprendre le sens
- terme: guess
  definition: deviner, à partir des indices, sans tout comprendre
erreurs_frequentes:
- Vouloir traduire mot à mot au lieu de repérer les indices utiles.
- Se bloquer sur un mot inconnu et perdre le fil de toute la phrase.
- Ignorer les mots-outils ('but', 'because', 'so') qui annoncent la logique du message.
exemple:
  enonce: 'Un camarade dit : ''I like tennis, but I prefer swimming because it''s more relaxing.'' Que préfère-t-il, et pourquoi
    ?'
  solution: Il préfère la natation ('swimming'), parce que ('because') c'est plus relaxant ('more relaxing'). Le mot 'but'
    annonce que la suite contredit le premier goût cité (le tennis).
exercices:
- id: reperer-mot-cle
  type: choix
  difficulte: 1
  enonce: 'Lis cette phrase : ''The train leaves at nine o''clock from platform two.'' Quelle information donne-t-elle ?'
  reponse:
    options:
    - id: a
      texte: L'heure et le quai de départ d'un train
    - id: b
      texte: Le prix d'un billet de train
    - id: c
      texte: La destination finale du voyage
    bonnes:
    - a
  indices:
    relance: Quels mots de la phrase ressemblent à des mots français que tu connais déjà ?
    methode: 'Repère les nombres et les mots comme ''train'', ''platform'' : ce sont des indices directs.'
    etape: '''Nine o''clock'' donne une heure, et ''platform two'' donne un numéro de quai.'
  pieges:
  - si:
      contient:
      - b
    relance: Aucun prix n'est mentionné dans cette phrase. Quels mots donnent une heure et un lieu précis ?
  - si:
      contient:
      - c
    relance: La phrase ne dit pas où va le train, seulement d'où et quand il part. Relis les deux informations données.
  solution: La phrase donne l'heure de départ (neuf heures) et le quai de départ (le quai deux).
- id: mot-outil-but
  type: choix
  difficulte: 1
  enonce: Dans la phrase 'She wanted to go out, but it was raining', que fait le mot 'but' ?
  reponse:
    options:
    - id: a
      texte: Il annonce une idée contraire ou un contraste
    - id: b
      texte: Il donne une explication logique
    - id: c
      texte: Il indique un moment dans le temps
    bonnes:
    - a
  indices:
    relance: 'Compare les deux parties de la phrase : sont-elles dans le même sens, ou opposées ?'
    methode: '''But'' relie deux idées qui s''opposent, comme ''mais'' en français.'
    etape: 'Elle voulait sortir, ''but'' il pleuvait : la pluie contredit son envie de sortir.'
  pieges:
  - si:
      contient:
      - b
    relance: Ce rôle-là, c'est celui de 'because'. Ici, les deux idées de la phrase s'opposent-elles ou s'expliquent-elles
      ?
  - si:
      contient:
      - c
    relance: '''But'' ne donne pas de moment. Regarde si les deux parties de la phrase vont dans le même sens ou pas.'
  solution: '''But'' introduit une opposition, comme ''mais'' en français : ici, l''envie de sortir s''oppose à la pluie qui
    tombe.'
- id: ordre-dialogue-court
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre logique ce court échange entendu à la cantine.
  reponse:
    elements:
    - id: a
      texte: What's for lunch today?
    - id: b
      texte: There's chicken and rice.
    - id: c
      texte: Great, I love rice!
  indices:
    relance: Quelle phrase pose une question, et laquelle y répond directement ?
    methode: Une question précède toujours sa réponse ; une réaction ('Great!') vient après la réponse.
    etape: '''What''s for lunch today?'' est la question de départ : place-la en premier.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux répliques voisines sont inversées. Laquelle répond directement à la question posée ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la question, puis la réponse qui lui correspond, puis la réaction finale.
  solution: D'abord la question 'What's for lunch today?', puis la réponse 'There's chicken and rice.', puis la réaction 'Great,
    I love rice!'.
- id: indice-lieu
  type: texte_court
  difficulte: 2
  enonce: Dans la phrase 'Welcome aboard flight 204 to London', où se trouve la personne qui parle ? Réponds en un mot en
    anglais.
  reponse:
    acceptees:
    - plane
    - airplane
    - aeroplane
    fautes_tolerees: 1
  indices:
    relance: Le mot 'aboard' et 'flight' te donnent un indice sur le moyen de transport.
    methode: '''Flight'' signifie ''vol'' : cherche le moyen de transport qui fait des vols.'
    etape: On dit 'welcome aboard' en montant dans un avion, pas dans une voiture ou un train.
  pieges:
  - si:
      valeur: train
    relance: '''Flight'' ne désigne pas un trajet en train. Quel moyen de transport fait des ''flights'' ?'
  solution: 'La personne est dans un avion (''plane'' / ''airplane'') : ''flight'' et ''aboard'' sont les indices.'
- id: nblm-lorsque-tu-ecoutes-une-personne-parler-v-1
  type: choix
  difficulte: 2
  enonce: Lorsque tu écoutes une personne parler vite en anglais, quelle est la bonne attitude à adopter pour comprendre le
    message ?
  reponse:
    options:
    - id: o1
      texte: S'appuyer sur les mots reconnus, le ton de la voix et les mots répétés sans chercher à tout comprendre.
    - id: o2
      texte: S'arrêter sur chaque mot inconnu et essayer de le traduire immédiatement.
    - id: o3
      texte: Attendre la fin de l'enregistrement sans chercher à repérer d'indices.
    - id: o4
      texte: Ignorer l'intonation et se concentrer uniquement sur la grammaire.
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments sonores et aux mots familiers qui t'aident sans tout traduire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : vouloir tout traduire mot à mot fait perdre le fil de toute la phrase.'
  - si:
      contient:
      - o3
    relance: 'C''est incorrect : il faut chercher activement des indices durant l''écoute.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : le ton de la voix est un indice précieux pour deviner le sens.'
  solution: 'S''appuyer sur les mots reconnus, le ton de la voix et les mots répétés sans chercher à tout comprendre. C''est
    exact : comprendre ne veut pas dire traduire chaque mot, mais s''appuyer sur des indices comme le ton de la voix ou les
    mots connus.'
- id: nblm-quels-types-de-mots-sont-particulieremen-2
  type: choix
  difficulte: 2
  enonce: Quels types de mots sont particulièrement faciles et utiles à repérer lors d'une première écoute pour saisir le
    sujet ?
  reponse:
    options:
    - id: o1
      texte: Les nombres, les noms propres et les mots proches du français.
    - id: o2
      texte: Uniquement les adjectifs qualificatifs complexes.
    - id: o3
      texte: Seulement les verbes de conjugaison irrégulière.
    - id: o4
      texte: Les articles indéfinis comme 'a' ou 'an'.
    bonnes:
    - o1
  indices:
    relance: Cherche les éléments d'information précis qui ressemblent à ce que tu connais déjà.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur : les adjectifs complexes méconnus risquent de bloquer la compréhension.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : se fixer sur des verbes complexes isole des formes verbales au lieu d''attraper des repères clairs.'
  - si:
      contient:
      - o4
    relance: 'Faux : les petits articles n''apportent pas d''information sur le sujet du message.'
  solution: 'Les nombres, les noms propres et les mots proches du français. C''est la bonne méthode : ces mots faciles à reconnaître
    donnent rapidement des repères sur le contenu.'
- id: nblm-dans-une-comprehension-orale-a-quoi-serv-3
  type: choix
  difficulte: 2
  enonce: Dans une compréhension orale, à quoi servent des mots-outils comme 'but', 'so' ou 'because' ?
  reponse:
    options:
    - id: o1
      texte: Ils annoncent la logique du message, comme une explication ou une opposition.
    - id: o2
      texte: Ils indiquent que la phrase est obligatoirement au passé.
    - id: o3
      texte: Ils servent à remplacer le nom du locuteur principal.
    - id: o4
      texte: Ils doivent être ignorés car ils n'apportent aucun sens.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au lien logique que ces mots établissent entre deux propos.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : ces mots relient des idées, quel que soit le temps du verbe.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : ce ne sont pas des pronoms mais des mots-outils de liaison.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : ignorer ces mots-outils fait perdre la logique du message.'
  solution: 'Ils annoncent la logique du message, comme une explication ou une opposition. Exactement : ces mots structurants
    permettent de suivre le fil des idées et la suite du message.'
- id: nblm-avant-d-ecouter-un-enregistrement-ou-de-4
  type: choix
  difficulte: 2
  enonce: Avant d'écouter un enregistrement ou de regarder une vidéo en anglais, quelles questions clés dois-tu te poser pour
    anticiper le sens ?
  reponse:
    options:
    - id: o1
      texte: Qui parle ? Où ? Pourquoi ?
    - id: o2
      texte: Combien de mots contient la phrase ?
    - id: o3
      texte: Comment s'écrit chaque mot prononcé ?
    - id: o4
      texte: Quel est le nom précis du logiciel d'enregistrement ?
    bonnes:
    - o1
  indices:
    relance: Pense aux questions essentielles sur la situation globale de communication.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect : compter les mots n''apporte aucune information sur le sens du message.'
  - si:
      contient:
      - o3
    relance: 'Faux : chercher l''orthographe exacte à l''écoute est impossible et bloque l''attention.'
  - si:
      contient:
      - o4
    relance: 'Hors sujet : cela n''aide pas à comprendre la situation de communication.'
  solution: 'Qui parle ? Où ? Pourquoi ?. C''est la méthode préconisée : identifier la situation de communication aide à deviner
    le sens global.'
- id: nblm-un-camarade-dit-i-like-tennis-but-i-pref-5
  type: choix
  difficulte: 2
  enonce: 'Un camarade dit : ''I like tennis, but I prefer swimming because it''s more relaxing.'' Que comprends-tu grâce
    aux mots ''but'' et ''because'' ?'
  reponse:
    options:
    - id: o1
      texte: Il aime le tennis, mais il préfère la natation car c'est plus relaxant.
    - id: o2
      texte: Il n'aime ni le tennis ni la natation.
    - id: o3
      texte: Il préfère le tennis parce que la natation est trop fatigante.
    - id: o4
      texte: Il pratique le tennis parce que c'est plus relaxant.
    bonnes:
    - o1
  indices:
    relance: Observe quel sport est associé au mot 'because' et ce que le mot 'but' nuance.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : ''I like'' indique qu''il aime le tennis, bien qu''il préfère la natation.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : ''but'' annonce l''opposition et ''swimming'' est le sport préféré.'
  - si:
      contient:
      - o4
    relance: 'Erreur de compréhension : ''more relaxing'' explique le choix de la natation.'
  solution: 'Il aime le tennis, mais il préfère la natation car c''est plus relaxant. C''est exact : ''but'' introduit la
    préférence (swimming) et ''because'' en donne la raison (more relaxing).'
- id: nblm-quelles-sont-les-deux-bonnes-reactions-a-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX bonnes réactions à avoir lorsqu'on écoute un enregistrement ou regarde une vidéo en anglais
    sans tout comprendre ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: S'appuyer sur le titre ou le contexte s'il y en a un.
    - id: o2
      texte: Reformuler en français ce que l'on a compris, même de façon incomplète.
    - id: o3
      texte: Vouloir traduire mot à mot chaque phrase dans sa tête.
    - id: o4
      texte: S'arrêter d'écouter dès qu'un mot inconnu apparaît.
    bonnes:
    - o1
    - o2
  indices:
    relance: Choisis les deux méthodes actives qui t'aident à garder le fil sans paniquer.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Mauvaise réponse : la traduction mot à mot fait perdre le fil du message.'
  - si:
      contient:
      - o4
    relance: 'Mauvaise réponse : se bloquer sur un mot empêche de comprendre la suite.'
  solution: 'S''appuyer sur le titre ou le contexte s''il y en a un ; Reformuler en français ce que l''on a compris, même
    de façon incomplète. Bonne réponse : le titre ou le contexte donne une première idée du sujet.'
- id: nblm-en-anglais-quel-mot-designe-un-indice-qu-7
  type: texte_court
  difficulte: 1
  enonce: En anglais, quel mot désigne un 'indice' qui aide à deviner le sens d'un message oral ?
  reponse:
    acceptees:
    - clue
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'un mot anglais de 4 lettres présent dans la fiche de vocabulaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'clue. C''est exact : le mot ''clue'' signifie indice.'
- id: nblm-quel-verbe-anglais-signifie-deviner-le-s-8
  type: texte_court
  difficulte: 1
  enonce: Quel verbe anglais signifie 'deviner' le sens à partir des indices repérés lors d'une écoute ?
  reponse:
    acceptees:
    - guess
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'un verbe anglais de 5 lettres présent dans la fiche de vocabulaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'guess. C''est exact : le verbe ''guess'' signifie deviner sans tout comprendre.'
