- id: dialogue-cantine
  type: ouverte
  difficulte: 3
  enonce: Écris en anglais un mini-dialogue de 6 répliques entre toi et un camarade, sur le sport ou les loisirs. Dans ton
    dialogue, un des deux ne comprend pas une phrase et demande de répéter. Chaque personne doit aussi relancer l'autre avec
    une question.
  criteres:
  - Le dialogue compte environ 6 répliques qui se répondent, sur le sport ou les loisirs, et chaque réplique répond à la précédente.
  - Une expression pour demander de répéter est utilisée correctement (Could you repeat, please? / Sorry, I didn't understand).
  - Chaque personne pose au moins une question de relance (And you? / Why? / What about you?) et l'un donne un avis (I agree
    / I don't agree).
  indices:
    relance: Qui parle en premier ? Qui demande de répéter ? Quelle question relance l'échange ?
    methode: 'Écris ligne par ligne : A pose une question, B répond, A relance, B ne comprend pas, A répète, B donne un avis.'
    etape: 'Commence ainsi : « A: Do you like sport? B: Yes, I do. And you? »'
  solution: 'Exemple : A: Do you like sport? B: Yes, I love tennis. And you? A: I prefer swimming because it''s relaxing.
    B: Sorry, could you repeat, please? A: I prefer swimming. B: I see. I don''t agree, tennis is more fun! But swimming is
    good too. What about basketball?'
