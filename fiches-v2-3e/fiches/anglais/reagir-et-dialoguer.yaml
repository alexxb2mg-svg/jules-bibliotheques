- id: desaccord-poli
  type: choix
  difficulte: 2
  enonce: 'Ton camarade dit : ''Football is the best sport.'' Tu n''es pas d''accord. Quelle réponse est polie et claire ?'
  reponse:
    options:
    - id: a
