    - id: b
      texte: I'm not sure. I think tennis is better.
    - id: c
      texte: I agree with you.
    bonnes:
    - b
  indices:
    relance: On peut contredire sans blesser l'autre. Quelle réponse donne ton avis avec douceur ?
    methode: Pour contredire poliment, on utilise des expressions comme 'I'm not sure' puis on donne son avis.
    etape: Écarte la phrase agressive, puis celle qui exprime l'accord. Il reste la bonne.
  pieges:
  - si:
      contient:
      - a
    relance: Cette réponse est agressive. On peut donner un avis contraire sans insulter.
  - si:
      contient:
      - c
    relance: 'Tu n''es pas d''accord : cette phrase dit l''inverse de ton avis.'
  solution: '''I''m not sure. I think tennis is better.'' contredit poliment et donne ton avis.'
