# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: reagir-et-dialoguer
version: 1
etat: verifiee
declencheurs:
- répondre spontanément en anglais
- dialoguer en anglais
- demander de répéter en anglais
- réagir à ce que quelqu'un dit en anglais
prerequis:
- ecouter-et-comprendre
- parler-en-continu
couverture: Travaille les expressions utiles pour réagir et dialoguer spontanément (demander de répéter, relancer, approuver).
  Ne couvre pas la conduite d'un débat argumenté long.
essentiel: 'Réagir et dialoguer, c''est répondre à ce que dit quelqu''un d''autre, dans un échange qui avance : on écoute,
  on

  répond, on relance, sans avoir préparé ses phrases à l''avance.


  Pour bien dialoguer, il faut des expressions utiles toutes prêtes : demander de répéter ("Could you repeat,

  please?"), demander de reformuler ("Can you say that another way?"), montrer qu''on suit ("I see", "Really?"),

  ou donner son accord ("I agree" / "I don''t agree").


  Un bon dialogue s''appuie sur ce que l''autre vient de dire : on répond à sa question ou à son idée, on ne

  change pas de sujet sans lien.

  '
methode:
- Écouter la phrase de l'autre en repérant les mots-clés, avant de préparer sa réponse.
- 'Utiliser une expression utile si l''on n''a pas compris : ''Could you repeat, please?'' ou ''Sorry, I didn''t understand.'''
- Répondre directement à la question ou à l'idée de l'autre, pas à côté du sujet.
- Relancer le dialogue avec une question ou un commentaire, pour que l'échange continue.
- Montrer qu'on écoute avec de petites réactions ('I see', 'Really?', 'That's interesting').
vocabulaire:
- terme: to repeat
  definition: répéter, redire une phrase déjà dite
- terme: to agree / to disagree
  definition: être d'accord / ne pas être d'accord
erreurs_frequentes:
- Rester silencieux quand on n'a pas compris, au lieu de demander de répéter.
- Répondre à côté de la question posée par l'autre personne.
- Ne jamais relancer le dialogue, ce qui l'arrête après une seule réponse.
exemple:
  enonce: 'Un camarade te demande : ''Do you like pizza?'' Tu n''as pas bien entendu. Que dis-tu ?'
  solution: Tu peux dire 'Sorry, could you repeat, please?' (désolé, peux-tu répéter s'il te plaît ?) pour demander poliment
    de redire la phrase, plutôt que de rester silencieux ou de répondre au hasard.
exercices:
- id: demander-repeter
  type: choix
  difficulte: 1
  enonce: Tu n'as pas compris ce que ton camarade vient de dire en anglais. Quelle phrase dis-tu ?
  reponse:
    options:
    - id: a
      texte: Could you repeat, please?
    - id: b
      texte: I don't care.
    - id: c
      texte: Yes, yes.
    bonnes:
    - a
  indices:
    relance: Quelle phrase demande poliment à quelqu'un de redire ce qu'il vient de dire ?
    methode: Une expression utile pour cette situation contient le mot 'repeat' (répéter).
    etape: '''Could you...?'' est une formule polie pour demander quelque chose.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase ne demande rien : elle dit que le sujet n''intéresse pas la personne. Cherche une phrase qui demande
      une répétition.'
  - si:
      contient:
      - c
    relance: Répondre 'oui, oui' sans avoir compris n'aide pas à suivre le dialogue. Cherche une phrase qui demande de répéter.
  solution: '''Could you repeat, please?'' est la formule polie pour demander à quelqu''un de redire ce qu''il vient de dire.'
- id: reagir-a-une-question
  type: choix
  difficulte: 1
  enonce: 'Ton camarade te demande : ''Do you like sport?'' Quelle réponse répond directement à la question ?'
  reponse:
    options:
    - id: a
      texte: Yes, I really like football.
    - id: b
      texte: My birthday is in June.
    - id: c
      texte: The weather is nice today.
    bonnes:
    - a
  indices:
    relance: La question porte sur un goût pour le sport. Quelle réponse parle bien de sport ?
    methode: Une bonne réponse reste sur le même sujet que la question posée.
    etape: '''Do you like sport?'' attend une réponse sur le sport, pas sur un autre sujet.'
  pieges:
  - si:
      contient:
      - b
    relance: Cette réponse change complètement de sujet. Quelle phrase répond bien à une question sur le sport ?
  - si:
      contient:
      - c
    relance: Parler de la météo ne répond pas à une question sur le sport. Cherche la réponse liée au sujet.
  solution: '''Yes, I really like football'' répond directement à la question posée sur le goût pour le sport.'
- id: ordre-mini-dialogue
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre logique ce court dialogue entre deux camarades.
  reponse:
    elements:
    - id: a
      texte: Are you free this weekend?
    - id: b
      texte: Yes, I am. Why?
    - id: c
      texte: Do you want to go to the cinema with me?
  indices:
    relance: Quelle phrase pose la première question, et laquelle propose une activité précise ensuite ?
    methode: Un dialogue commence souvent par une question ouverte, suivie d'une réponse, puis d'une proposition plus précise.
    etape: '''Are you free this weekend?'' est la question de départ : place-la en premier.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux répliques voisines sont inversées. Laquelle répond à la première question, et laquelle propose une sortie
      précise ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la question ouverte, puis la réponse, puis la proposition précise qui suit.
  solution: D'abord 'Are you free this weekend?', puis 'Yes, I am. Why?', puis la proposition 'Do you want to go to the cinema
    with me?'.
- id: accord-desaccord
  type: association
  difficulte: 2
  enonce: Associe chaque expression anglaise à ce qu'elle exprime.
  reponse:
    gauche:
    - id: a
      texte: I agree with you.
    - id: b
      texte: I don't agree at all.
    - id: c
      texte: That's a good point.
    droite:
    - id: x
      texte: Exprimer son accord total
    - id: y
      texte: Exprimer son désaccord
    - id: z
      texte: Reconnaître la valeur de l'idée de l'autre
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Le mot ''agree'' apparaît deux fois : quelle différence fait ''don''t'' entre les deux phrases ?'
    methode: '''I agree'' montre l''accord ; ''I don''t agree'' montre le désaccord ; ''a good point'' valorise l''idée de
      l''autre sans forcément trancher.'
    etape: '''I agree with you'' exprime clairement un accord total : associe-la à la bonne case.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Repère la phrase qui contient ''don''t'' : elle exprime un désaccord.'
  - si:
      diagnostic: associations_fausses
    relance: Commence par la phrase la plus claire, 'I agree with you', puis distingue les deux autres.
  solution: '''I agree with you'' = accord total ; ''I don''t agree at all'' = désaccord ; ''That''s a good point'' = reconnaître
    la valeur de l''idée de l''autre.'
- id: nblm-selon-la-fiche-officielle-quelle-est-la-1
  type: choix
  difficulte: 2
  enonce: Selon la fiche officielle, quelle est la caractéristique essentielle d'un dialogue à l'oral en anglais ?
  reponse:
    options:
    - id: o1
      texte: C'est un échange spontané où l'on écoute, répond et relance sans phrases préparées à l'avance.
    - id: o2
      texte: C'est réciter un texte appris par cœur pour éviter toute faute de grammaire.
    - id: o3
      texte: C'est un monologue où une seule personne parle le plus longtemps possible sans interruption.
    - id: o4
      texte: C'est une traduction mot à mot systématique du français vers l'anglais.
    bonnes:
    - o1
  indices:
    relance: Pense au caractère interactif et non rédigé d'une conversation à deux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre une récitation théâtrale préparée avec une interaction spontanée.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : parler seul relève de la prise de parole en continu, pas du dialogue.'
  - si:
      contient:
      - o4
    relance: 'Piège fréquent : la traduction littérale bloque la fluidité et la spontanéité de l''échange.'
  solution: 'C''est un échange spontané où l''on écoute, répond et relance sans phrases préparées à l''avance. Correct : dialoguer
    exige d''écouter et de répondre spontanément sans répliques rédigées au préalable.'
- id: nblm-quelle-expression-est-recommandee-pour-d-2
  type: choix
  difficulte: 2
  enonce: Quelle expression est recommandée pour demander poliment à son interlocuteur de répéter en anglais ?
  reponse:
    options:
    - id: o1
      texte: Could you repeat, please?
    - id: o2
      texte: I don't agree with you.
    - id: o3
      texte: Can you say that in French?
    - id: o4
      texte: I see, that's interesting.
    bonnes:
    - o1
  indices:
    relance: Pense au verbe anglais qui signifie « répéter ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : cette phrase exprime le désaccord et non une demande de répétition.'
  - si:
      contient:
      - o3
    relance: 'Piège : le but du dialogue en cours d''anglais est de maintenir la communication en anglais.'
  - si:
      contient:
      - o4
    relance: 'Erreur : cette réaction sert à montrer qu''on écoute, pas à demander qu''on répète.'
  solution: 'Could you repeat, please?. Correct : c''est l''expression clé enseignée pour demander de répéter gentiment.'
- id: nblm-pendant-un-dialogue-que-dois-tu-faire-si-3
  type: choix
  difficulte: 2
  enonce: Pendant un dialogue, que dois-tu faire si tu n'as pas compris ce que l'autre personne vient de dire ?
  reponse:
    options:
    - id: o1
      texte: Utiliser une expression de clarification comme « Sorry, I didn't understand » au lieu de se taire.
    - id: o2
      texte: Rester complètement silencieux en attendant que l'interlocuteur change de sujet.
    - id: o3
      texte: Répondre « Yes » ou « No » au hasard sans chercher à comprendre.
    - id: o4
      texte: Quitter la conversation immédiatement.
    bonnes:
    - o1
  indices:
    relance: Cherche le comportement actif qui permet de poursuivre la conversation malgré une hésitation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le silence interrompt l''échange au lieu de le faire progresser.'
  - si:
      contient:
      - o3
    relance: 'Piège classique : répondre au hasard entraîne souvent des contresens et un hors-sujet.'
  - si:
      contient:
      - o4
    relance: 'Erreur : abandonner la conversation stoppe brutalement toute communication.'
  solution: 'Utiliser une expression de clarification comme « Sorry, I didn''t understand » au lieu de se taire. Correct :
    demander de répéter ou de reformuler permet d''éviter la rupture du dialogue.'
- id: nblm-comment-reagir-a-ce-que-dit-quelqu-un-po-4
  type: choix
  difficulte: 2
  enonce: Comment réagir à ce que dit quelqu'un pour lui montrer que tu suis attentivement son discours ?
  reponse:
    options:
    - id: o1
      texte: Utiliser de courtes réactions comme « I see » ou « Really? ».
    - id: o2
      texte: Répéter exactement toutes les phrases que l'interlocuteur vient de prononcer.
    - id: o3
      texte: Interrompre la personne toutes les deux secondes pour la corriger.
    - id: o4
      texte: Ne donner aucun signe de tête ni aucun mot d'encouragement.
    bonnes:
    - o1
  indices:
    relance: Pense aux petits mots brefs qui confirment la compréhension au fil du dialogue.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : répéter en écho n''est pas une réaction naturelle dans un échange.'
  - si:
      contient:
      - o3
    relance: 'Piège : couper la parole inutilement nuit à la fluidité du dialogue.'
  - si:
      contient:
      - o4
    relance: 'Erreur : l''absence de réaction fait croire à l''autre qu''on ne l''écoute plus.'
  solution: 'Utiliser de courtes réactions comme « I see » ou « Really? ». Correct : ces petites expressions régulatrices
    montrent l''écoute active.'
- id: nblm-apres-avoir-repondu-a-la-question-de-ton-5
  type: choix
  difficulte: 2
  enonce: Après avoir répondu à la question de ton camarade, quelle est la meilleure stratégie pour relancer le dialogue ?
  reponse:
    options:
    - id: o1
      texte: Poser à ton tour une question ou ajouter un commentaire lié au sujet.
    - id: o2
      texte: Se taire définitivement pour indiquer que la conversation est terminée.
    - id: o3
      texte: Changer totalement de sujet sans aucun lien avec ce qui vient d'être dit.
    - id: o4
      texte: Lui demander de réécrire sa question sur une feuille de papier.
    bonnes:
    - o1
  indices:
    relance: Pense au moyen de renvoyer la balle à ton interlocuteur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : s''arrêter net après une seule réponse bloque l''échange.'
  - si:
      contient:
      - o3
    relance: 'Piège : sauter du coq à l''âne rend le dialogue décousu et artificiel.'
  - si:
      contient:
      - o4
    relance: 'Erreur : passer par l''écrit casse la dynamique naturelle d''un dialogue oral.'
  solution: 'Poser à ton tour une question ou ajouter un commentaire lié au sujet. Correct : la relance permet de poursuivre
    l''interaction de manière dynamique.'
- id: nblm-quelles-sont-les-deux-bonnes-pratiques-r-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX bonnes pratiques recommandées dans la fiche pour réussir un dialogue en anglais ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Écouter la phrase de l'autre en repérant les mots-clés avant de répondre.
    - id: o2
      texte: Répondre directement à la question ou à l'idée exprimée par l'autre.
    - id: o3
      texte: Rédiger entièrement sa réponse sur un brouillon avant de la dire à voix haute.
    - id: o4
      texte: Éviter toute expression de relance pour terminer l'exercice le plus vite possible.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux choix qui mettent l'accent sur la compréhension et la pertinence de la réponse.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : préparer ses phrases à l''écrit empêche la spontanéité requise à l''oral.'
  - si:
      contient:
      - o4
    relance: 'Erreur : les relances sont essentielles pour entretenir une conversation naturelle.'
  solution: 'Écouter la phrase de l''autre en repérant les mots-clés avant de répondre ; Répondre directement à la question
    ou à l''idée exprimée par l''autre. Correct : repérer les mots-clés aide à saisir l''essentiel du message de l''interlocuteur.'
- id: nblm-selon-la-fiche-de-vocabulaire-quel-verbe-7
  type: texte_court
  difficulte: 1
  enonce: Selon la fiche de vocabulaire, quel verbe anglais signifie « être d'accord » dans un dialogue ?
  reponse:
    acceptees:
    - agree
    fautes_tolerees: 1
  indices:
    relance: 'Relis l''énoncé : quel mot-clé du cours est en jeu ici ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'agree. Correct : le verbe ''agree'' (ou ''to agree'') signifie être d''accord en anglais.'
- id: nblm-quel-est-l-adverbe-qui-decrit-l-action-d-8
  type: texte_court
  difficulte: 1
  enonce: Quel est l'adverbe qui décrit l'action de répondre immédiatement et sans phrase apprise par cœur dans un dialogue
    ? On répond...
  reponse:
    acceptees:
    - spontanément
    fautes_tolerees: 1
  indices:
    relance: Ce mot partage la même racine que l'adjectif « spontané ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'spontanément. Correct : répondre spontanément est au cœur de l''interaction orale en dialogue.'
