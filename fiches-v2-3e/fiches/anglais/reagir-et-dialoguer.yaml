format: 2
notion: reagir-et-dialoguer
version: 2
etat: generee
declencheurs:
- répondre spontanément en anglais
- dialoguer en anglais
- demander de répéter en anglais
- réagir à ce que quelqu'un dit en anglais
- poser une question en retour
- donner son avis à l'oral en anglais
- être d'accord ou pas en anglais
- s'excuser de ne pas comprendre
- échanger avec un camarade en anglais
prerequis:
- ecouter-et-comprendre
- parler-en-continu
couverture: Travaille les expressions utiles pour réagir et dialoguer spontanément (demander de répéter, relancer, approuver, contredire poliment) par écrit. Ne couvre pas la conduite d'un débat argumenté long ni la prononciation, qui demandent un travail à l'oral réel.
essentiel: |
  Réagir et dialoguer, c'est échanger avec quelqu'un à l'oral, sans avoir préparé ses phrases. On écoute, on répond, on relance : la conversation avance à deux.

  Comprendre pendant l'échange. On applique les stratégies de compréhension orale : repérer les mots-clés, le ton, les gestes et l'expression du visage. On n'a pas besoin de tout comprendre. On construit un discours commun : chacun s'appuie sur ce que l'autre vient de dire.

  Réagir spontanément. Il faut des expressions toutes prêtes.
  - Demander de répéter : « Could you repeat, please? », « Sorry, I didn't understand. »
  - Demander de reformuler : « Can you say that another way? », « What does ... mean? »
  - Montrer qu'on suit : « I see. », « Really? », « That's interesting. »
  - Donner son accord : « I agree. », « Me too. », « That's a good point. »
  - Contredire poliment : « I don't agree. », « I'm not sure. », « I think ... but ... »
  - Gagner du temps : « Let me think... », « Well, ... »

  Alimenter ou contredire le message. Un bon dialogue enchaîne les échanges. Soit on alimente (on ajoute une information, un exemple : « Me too, I love football! »), soit on contredit (« Really? I prefer tennis. »). On répond à la question posée, puis on relance avec une question : « And you? », « Why? », « What about you? »

  Des énoncés adaptés au contexte. Avec un camarade, on parle de façon simple et directe. Avec un adulte, on ajoute « please » et « thank you » et on choisit « Could you...? » plutôt que « Can you...? ».

  Se corriger. Si on se trompe, on peut dire « Sorry, I mean... » et reprendre. C'est une bonne stratégie, pas une faute.

  Ce qu'on attend de toi : réagir à des questions simples, se faire répéter, donner un avis court, et poursuivre l'échange avec une question.
methode:
- Écouter la phrase de l'autre en repérant les mots-clés, le ton et les gestes, avant de préparer sa réponse.
- 'Si l''on n''a pas compris, utiliser une expression utile : ''Could you repeat, please?'' ou ''Sorry, I didn''t understand.'''
- Répondre directement à la question ou à l'idée de l'autre, pas à côté du sujet.
- Alimenter l'échange (ajouter une information ou un exemple) ou contredire poliment, avec 'I don't agree' ou 'I'm not sure'.
- Relancer le dialogue avec une question ('And you?', 'Why?') pour que l'échange continue.
- 'Adapter le ton au contexte : simple avec un camarade, plus poli (''please'', ''Could you...?'') avec un adulte.'
vocabulaire:
- terme: to repeat
  definition: répéter, redire une phrase déjà dite
- terme: to agree / to disagree
  definition: être d'accord / ne pas être d'accord
- terme: to react
  definition: répondre tout de suite à ce que dit quelqu'un
- terme: to reply
  definition: répondre à une question ou à un message
- terme: a follow-up question
  definition: question posée pour continuer l'échange, comme 'And you?'
- terme: to mean
  definition: vouloir dire ; 'What does it mean?' = qu'est-ce que cela veut dire ?
- terme: polite
  definition: poli, qui respecte les règles de la politesse
erreurs_frequentes:
- Rester silencieux quand on n'a pas compris, au lieu de demander de répéter.
- Répondre à côté de la question posée par l'autre personne.
- Ne jamais relancer le dialogue, ce qui l'arrête après une seule réponse.
- Répondre 'yes' ou 'no' tout seul, sans ajouter une information ni un avis.
- Employer un ton trop direct avec un adulte, sans 'please' ni 'Could you...?'.
exemple:
  enonce: 'Un camarade te demande : ''Do you like pizza?'' Tu n''as pas bien entendu. Que dis-tu ?'
  solution: Tu peux dire 'Sorry, could you repeat, please?' (désolé, peux-tu répéter s'il te plaît ?) pour demander poliment de redire la phrase, plutôt que de rester silencieux ou de répondre au hasard.
exercices:
- id: demander-repeter
  type: choix
  difficulte: 1
  enonce: Tu n'as pas compris ce que ton camarade vient de dire en anglais. Quelle phrase dis-tu ?
  reponse:
    options:
    - id: a
      texte: Could you repeat, please?
    - id: b
      texte: I don't care.
    - id: c
      texte: Yes, yes.
    bonnes:
    - a
  indices:
    relance: Quelle phrase demande poliment à quelqu'un de redire ce qu'il vient de dire ?
    methode: Une expression utile pour cette situation contient le mot 'repeat' (répéter).
    etape: '''Could you...?'' est une formule polie pour demander quelque chose.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase ne demande rien : elle dit que le sujet n''intéresse pas la personne. Cherche une phrase qui demande une répétition.'
  - si:
      contient:
      - c
    relance: Répondre 'oui, oui' sans avoir compris n'aide pas à suivre le dialogue. Cherche une phrase qui demande de répéter.
  solution: '''Could you repeat, please?'' est la formule polie pour demander à quelqu''un de redire ce qu''il vient de dire.'
- id: reagir-a-une-question
  type: choix
  difficulte: 1
  enonce: 'Ton camarade te demande : ''Do you like sport?'' Quelle réponse répond directement à la question ?'
  reponse:
    options:
    - id: a
      texte: Yes, I really like football.
    - id: b
      texte: My birthday is in June.
    - id: c
      texte: The weather is nice today.
    bonnes:
    - a
  indices:
    relance: La question porte sur un goût pour le sport. Quelle réponse parle bien de sport ?
    methode: Une bonne réponse reste sur le même sujet que la question posée.
    etape: '''Do you like sport?'' attend une réponse sur le sport, pas sur un autre sujet.'
  pieges:
  - si:
      contient:
      - b
    relance: Cette réponse change complètement de sujet. Quelle phrase répond bien à une question sur le sport ?
  - si:
      contient:
      - c
    relance: Parler de la météo ne répond pas à une question sur le sport. Cherche la réponse liée au sujet.
  solution: '''Yes, I really like football'' répond directement à la question posée sur le goût pour le sport.'
- id: ordre-mini-dialogue
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre logique ce court dialogue entre deux camarades.
  reponse:
    elements:
    - id: a
      texte: Are you free this weekend?
    - id: b
      texte: Yes, I am. Why?
    - id: c
      texte: Do you want to go to the cinema with me?
  indices:
    relance: Quelle phrase pose la première question, et laquelle propose une activité précise ensuite ?
    methode: Un dialogue commence souvent par une question ouverte, suivie d'une réponse, puis d'une proposition plus précise.
    etape: '''Are you free this weekend?'' est la question de départ : place-la en premier.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux répliques voisines sont inversées. Laquelle répond à la première question, et laquelle propose une sortie précise ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la question ouverte, puis la réponse, puis la proposition précise qui suit.
  solution: D'abord 'Are you free this weekend?', puis 'Yes, I am. Why?', puis la proposition 'Do you want to go to the cinema with me?'.
- id: accord-desaccord
  type: association
  difficulte: 2
  enonce: Associe chaque expression anglaise à ce qu'elle exprime.
  reponse:
    gauche:
    - id: a
      texte: I agree with you.
    - id: b
      texte: I don't agree at all.
    - id: c
      texte: That's a good point.
    droite:
    - id: x
      texte: Exprimer son accord total
    - id: y
      texte: Exprimer son désaccord
    - id: z
      texte: Reconnaître la valeur de l'idée de l'autre
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Le mot ''agree'' apparaît deux fois : quelle différence fait ''don''t'' entre les deux phrases ?'
    methode: '''I agree'' montre l''accord ; ''I don''t agree'' montre le désaccord ; ''a good point'' valorise l''idée de l''autre sans forcément trancher.'
    etape: '''I agree with you'' exprime clairement un accord total : associe-la à la bonne case.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Repère la phrase qui contient ''don''t'' : elle exprime un désaccord.'
  - si:
      diagnostic: associations_fausses
    relance: Commence par la phrase la plus claire, 'I agree with you', puis distingue les deux autres.
  solution: '''I agree with you'' = accord total ; ''I don''t agree at all'' = désaccord ; ''That''s a good point'' = reconnaître la valeur de l''idée de l''autre.'
- id: reactions-courtes
  type: association
  difficulte: 1
  enonce: Associe chaque réplique à la réaction qui convient.
  reponse:
    gauche:
    - id: a
      texte: I won a prize at school!
    - id: b
      texte: I have a dog and two cats.
    - id: c
      texte: I don't like maths.
    droite:
    - id: x
      texte: Really? Congratulations!
    - id: y
      texte: Oh, I love animals. What are their names?
    - id: z
      texte: Why not? Is it difficult?
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque réplique, demande-toi ce que tu dirais pour montrer que tu écoutes.
    methode: 'Une bonne réaction répond au thème de la phrase : un prix, des animaux, une matière.'
    etape: La phrase sur les animaux appelle une réaction sur les animaux. Associe-la en premier.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis-les une par une et repère celle qui ne convient pas.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Commence par celle dont tu es le plus sûr, puis avance par élimination.
  solution: 'a-x (un prix : félicitations), b-y (des animaux : une question sur eux), c-z (une matière : on demande pourquoi).'
- id: desaccord-poli
  type: choix
  difficulte: 2
  enonce: 'Ton camarade dit : ''Football is the best sport.'' Tu n''es pas d''accord. Quelle réponse est polie et claire ?'
  reponse:
    options:
    - id: a
      texte: That's stupid!
    - id: b
      texte: I'm not sure. I think tennis is better.
    - id: c
      texte: I agree with you.
    bonnes:
    - b
  indices:
    relance: On peut contredire sans blesser l'autre. Quelle réponse donne ton avis avec douceur ?
    methode: Pour contredire poliment, on utilise des expressions comme 'I'm not sure' puis on donne son avis.
    etape: Écarte la phrase agressive, puis celle qui exprime l'accord. Il reste la bonne.
  pieges:
  - si:
      contient:
      - a
    relance: Cette réponse est agressive. On peut donner un avis contraire sans insulter.
  - si:
      contient:
      - c
    relance: 'Tu n''es pas d''accord : cette phrase dit l''inverse de ton avis.'
  solution: '''I''m not sure. I think tennis is better.'' contredit poliment et donne ton avis.'
- id: repeter-poliment
  type: texte_court
  difficulte: 2
  enonce: 'Complète la phrase de politesse pour demander de répéter : ''Sorry, could you ___ that, please?'' Écris le verbe manquant.'
  reponse:
    acceptees:
    - repeat
    - say again
    fautes_tolerees: 1
  indices:
    relance: 'Tu n''as pas compris : que demandes-tu à l''autre de faire avec sa phrase ?'
    methode: Le verbe est dans le vocabulaire de la fiche. Il commence par 're'.
    etape: C'est le verbe qui veut dire « redire ». Il se termine par '-peat'.
  pieges:
  - si:
      valeur: say
    relance: Ce mot seul ne suffit pas. Il faut le verbe qui veut dire « redire ».
  solution: '''Repeat'' : ''Sorry, could you repeat that, please?'' est la formule polie pour demander de redire.'
- id: dialogue-cantine
  type: ouverte
  difficulte: 3
  enonce: Écris en anglais un mini-dialogue de 6 répliques entre toi et un camarade, sur le sport ou les loisirs. Dans ton dialogue, un des deux ne comprend pas une phrase et demande de répéter. Chaque personne doit aussi relancer l'autre avec une question.
  criteres:
  - Le dialogue compte environ 6 répliques qui se répondent, sur le sport ou les loisirs, et chaque réplique répond à la précédente.
  - Une expression pour demander de répéter est utilisée correctement (Could you repeat, please? / Sorry, I didn't understand).
  - Chaque personne pose au moins une question de relance (And you? / Why? / What about you?) et l'un donne un avis (I agree / I don't agree).
  indices:
    relance: Qui parle en premier ? Qui demande de répéter ? Quelle question relance l'échange ?
    methode: 'Écris ligne par ligne : A pose une question, B répond, A relance, B ne comprend pas, A répète, B donne un avis.'
    etape: 'Commence ainsi : « A: Do you like sport? B: Yes, I do. And you? »'
  solution: 'Exemple : A: Do you like sport? B: Yes, I love tennis. And you? A: I prefer swimming because it''s relaxing. B: Sorry, could you repeat, please? A: I prefer swimming. B: I see. I don''t agree, tennis is more fun! But swimming is good too. What about basketball?'
