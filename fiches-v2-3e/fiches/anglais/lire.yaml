# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: lire
version: 2
etat: generee
declencheurs:
- comprendre un texte en anglais
- deviner un mot inconnu en lisant
- stratégies pour lire en anglais
- lire un court texte anglais
- mots transparents anglais
- faux amis en anglais
- compréhension écrite anglais
- lire un mail en anglais
- justifier avec le texte anglais
prerequis:
- ecouter-et-comprendre
essentiel: |
  Lire en anglais, ce n'est pas traduire chaque mot. On cherche d'abord à comprendre l'idée générale, puis les détails.

  Avant de lire, on observe les indices extralinguistiques : le titre, les images, la mise en page, la source, la date. Ils donnent le type de document (annonce, mail, article, affiche, récit, dialogue, page web) et son sujet.

  Deux façons de lire. Le skimming : lire vite pour saisir l'idée générale. Le scanning : parcourir le texte pour trouver une information précise (un nom, une date, un prix).

  Les indices linguistiques aident à deviner un mot inconnu.
  - Les mots transparents ressemblent au français : « hospital », « important ».
  - Les mots de la même famille ou les terminaisons : « -less » veut dire « sans » (useless), « -ful » veut dire « plein de » (helpful), « un- » donne le contraire (unhappy).
  - Le contexte : les mots autour, la ponctuation, les mots répétés.
  - Attention aux faux amis : « library » est une bibliothèque, « actually » veut dire « en fait ».

  Les mots de liaison guident le sens : « and » (addition), « but » et « however » (opposition), « because » (cause), « so » (conséquence), « then » (ce qui vient après).

  Les temps donnent des indices : la terminaison « -ed » ou un verbe irrégulier (went, saw) signale le passé ; « will » annonce le futur.

  Reconstituer le sens, c'est relier les indices : qui parle, à qui, où, quand, pourquoi ? On relit une première fois pour le sens général, une seconde fois pour les détails. On peut alors répondre en justifiant avec un mot ou une phrase du texte.

  Pour progresser, il faut lire souvent, des textes courts et variés, et noter les mots nouveaux. Ce qu'on attend de toi : comprendre un texte court de nature variée et prouver ta compréhension avec des éléments du texte.
methode:
- 'Regarder le titre, les images et la mise en page avant de lire : cela donne le type de document et le sujet.'
- Lire une première fois sans s'arrêter sur les mots inconnus, pour saisir l'idée générale (skimming).
- 'Repérer les mots transparents, les mots répétés et les mots de liaison : ils portent le sens principal.'
- Deviner un mot inconnu avec les mots autour, sa famille de mots (-less, -ful, un-) ou sa ressemblance avec le français, avant d'ouvrir le dictionnaire.
- Relire pour les détails (qui, quoi, quand, où, pourquoi) en cherchant l'information précise (scanning).
- Justifier chaque réponse avec un mot ou une phrase du texte.
vocabulaire:
- terme: skimming
  definition: lire vite pour saisir l'idée générale d'un texte
- terme: scanning
  definition: parcourir un texte pour trouver une information précise (une date, un nom)
- terme: mot transparent
  definition: mot anglais qui ressemble au français et a le même sens, comme « important »
- terme: faux ami
  definition: mot qui ressemble à un mot français mais n'a pas le même sens
- terme: context
  definition: les mots et les phrases autour d'un mot, qui aident à deviner son sens
- terme: connector
  definition: mot de liaison (and, but, because, so, then) qui relie deux idées
- terme: suffix
  definition: fin de mot qui change son sens, comme « -less » (sans) ou « -ful » (plein de)
erreurs_frequentes:
- Vouloir traduire chaque mot au lieu de chercher le sens général d'abord.
- S'arrêter sur un mot inconnu et abandonner la lecture au lieu de continuer et de deviner grâce au contexte.
- Répondre à une question de détail sans avoir compris le sujet général du texte.
- 'Se laisser piéger par un faux ami : « library » n''est pas une librairie.'
- Répondre sans justifier avec le texte, alors que la consigne demande de prouver sa réponse.
exemple:
  enonce: 'Lis : ''Emma works at the hospital. She helps sick people every day.'' Que fait Emma ?'
  solution: Emma travaille à l'hôpital ('hospital', mot transparent) et aide des personnes malades ('sick people') chaque jour. Le mot 'hospital' ressemble au français et donne un indice fort sur son métier.
exercices:
- id: type-de-texte
  type: choix
  difficulte: 1
  enonce: 'Lis : ''Lost cat, orange fur, answers to Milo. Please call 06 12 34 56 78 if found.'' Quel type de texte est-ce ?'
  reponse:
    options:
    - id: a
      texte: Une petite annonce pour retrouver un animal perdu
    - id: b
      texte: Une recette de cuisine
    - id: c
      texte: Un bulletin météo
    bonnes:
    - a
  indices:
    relance: Quels mots du texte parlent d'un animal, et pourquoi donne-t-on un numéro de téléphone ?
    methode: '''Lost cat'' signifie ''chat perdu'' : cherche quel type de texte demande de l''aide pour retrouver un animal.'
    etape: '''Lost'' (perdu), ''cat'' (chat) et un numéro à appeler : c''est une annonce.'
  pieges:
  - si:
      contient:
      - b
    relance: Il n'y a ni ingrédient ni étape de préparation ici. Que cherche-t-on à retrouver dans ce texte ?
  - si:
      contient:
      - c
    relance: Il n'est pas question de pluie ou de température. De quel être vivant parle le texte ?
  solution: C'est une petite annonce pour retrouver un chat perdu ('Lost cat'), avec un numéro de téléphone à appeler.
- id: mot-transparent
  type: texte_court
  difficulte: 1
  enonce: Dans la phrase 'This information is important', quel mot ressemble beaucoup à un mot français et veut dire la même chose ?
  reponse:
    acceptees:
    - important
    - information
    fautes_tolerees: 1
  indices:
    relance: 'Regarde les deux mots les plus longs de la phrase : lequel te fait penser à un mot français, et se prononce presque pareil à l''écrit ?'
    methode: Un mot transparent s'écrit presque comme en français et garde le même sens.
    etape: Ce mot long s'écrit exactement pareil dans les deux langues et garde le même sens.
  pieges:
  - si:
      valeur: this
    relance: '''This'' veut dire ''ceci'', mais il ne ressemble pas à un mot français. Cherche un mot plus long dans la phrase.'
  solution: '''Important'' est un mot transparent : il s''écrit comme en français et signifie la même chose.'
- id: devine-mot-contexte
  type: choix
  difficulte: 2
  enonce: 'Lis : ''The soup was too spicy, so I drank a lot of water.'' D''après le contexte, que veut probablement dire ''spicy'' ?'
  reponse:
    options:
    - id: a
      texte: Épicée, piquante
    - id: b
      texte: Froide
    - id: c
      texte: Sucrée
    bonnes:
    - a
  indices:
    relance: Pourquoi la personne boit-elle beaucoup d'eau juste après avoir mangé la soupe ?
    methode: Boire beaucoup d'eau après un plat suggère souvent une sensation de piquant en bouche.
    etape: '''So'' relie la cause (la soupe) à la conséquence (boire de l''eau) : quelle qualité d''un plat pousse à boire ?'
  pieges:
  - si:
      contient:
      - b
    relance: Boire de l'eau après un plat froid n'est pas une réaction habituelle. Quelle sensation pousse à boire beaucoup d'eau ?
  - si:
      contient:
      - c
    relance: Un plat sucré ne donne pas forcément envie de boire de l'eau. Repense à la réaction de la personne.
  solution: '''Spicy'' signifie épicée ou piquante : boire beaucoup d''eau après en manger est un indice de contexte fort.'
- id: ordre-annonce
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre logique les phrases de cette courte annonce de club de sport.
  reponse:
    elements:
    - id: a
      texte: Our tennis club is looking for new members.
    - id: b
      texte: Lessons take place on Wednesday afternoons.
    - id: c
      texte: Contact us at the school office to sign up.
  indices:
    relance: Quelle phrase présente le club, et laquelle explique comment s'inscrire ?
    methode: Une annonce commence en général par une présentation, puis donne les détails pratiques, puis dit quoi faire pour participer.
    etape: '''Our tennis club is looking for new members'' présente le sujet : place-la en premier.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux phrases voisines sont inversées. Laquelle donne l'information pratique (le jour), et laquelle explique comment s'inscrire ensuite ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la présentation du club, puis le jour des cours, puis la façon de s'inscrire.
  solution: D'abord la présentation du club, puis le jour des cours (le mercredi après-midi), puis le contact pour s'inscrire.
- id: faux-ami-library
  type: choix
  difficulte: 2
  enonce: 'Lis : ''I go to the library after school to borrow books.'' Que veut dire ''library'' ?'
  reponse:
    options:
    - id: a
      texte: Une librairie où l'on achète des livres
    - id: b
      texte: Une bibliothèque où l'on emprunte des livres
    - id: c
      texte: Une salle de classe
    bonnes:
    - b
  indices:
    relance: 'Regarde le verbe qui suit : que fait-on avec les livres, les acheter ou les emprunter ?'
    methode: '''Library'' est un faux ami : il ressemble à un mot français, mais le sens n''est pas exactement le même. Le mot ''borrow'' t''aide.'
    etape: '''To borrow'' veut dire emprunter. Cherche le lieu où l''on emprunte des livres sans les acheter.'
  pieges:
  - si:
      contient:
      - a
    relance: 'Dans une librairie, on achète. Ici, le texte dit ''borrow'' : on emprunte.'
  - si:
      contient:
      - c
    relance: Le texte parle de livres empruntés après l'école, pas d'une salle de cours.
  solution: '''Library'' veut dire bibliothèque. ''To borrow'' (emprunter) le montre. Le mot ressemble à « librairie », mais c''est un faux ami.'
- id: suffixe-less
  type: choix
  difficulte: 2
  enonce: 'Lis : ''Don''t take this old pen, it is useless : it has no ink.'' D''après le contexte et la fin du mot, que veut dire ''useless'' ?'
  reponse:
    options:
    - id: a
      texte: Très pratique
    - id: b
      texte: Sans utilité
    - id: c
      texte: Nouveau et cher
    bonnes:
    - b
  indices:
    relance: Que dit la fin de la phrase sur le stylo ? Est-il pratique pour écrire ?
    methode: La terminaison '-less' veut dire « sans ». 'Use' veut dire « utilité » ou « usage ».
    etape: 'Assemble ''use'' et ''-less'' : que donne « sans usage » ? Vérifie avec ''it has no ink''.'
  pieges:
  - si:
      contient:
      - a
    relance: Un stylo sans encre est-il pratique ? Relis la fin de la phrase.
  - si:
      contient:
      - c
    relance: Le texte dit que le stylo est vieux ('old'), pas nouveau. Relis la phrase.
  solution: '''Useless'' = ''use'' + ''-less'' : sans utilité, inutile. Le contexte (un stylo sans encre) confirme.'
- id: connecteurs-sens
  type: association
  difficulte: 2
  enonce: Associe chaque mot de liaison à son rôle.
  reponse:
    gauche:
    - id: a
      texte: because
    - id: b
      texte: but
    - id: c
      texte: so
    - id: d
      texte: then
    droite:
    - id: x
      texte: la cause
    - id: y
      texte: l'opposition
    - id: z
      texte: la conséquence
    - id: w
      texte: ce qui vient ensuite
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Pour chaque mot, imagine une phrase en français avec « parce que », « mais », « donc » ou « puis ».
    methode: 'Deux mots se ressemblent par leur rôle de lien, mais l''un explique et l''autre oppose : distingue-les d''abord.'
    etape: Commence par le mot qui relie deux idées contraires, comme « mais » en français.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis-les une par une et repère celle qui ne convient pas.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Commence par celle dont tu es le plus sûr, puis avance par élimination.
  solution: because = cause ; but = opposition ; so = conséquence ; then = ce qui vient ensuite.
- id: lire-message-ben
  type: ouverte
  difficulte: 3
  enonce: 'Lis ce message écrit pour l''exercice : « Hi Tom, I''m sorry, but I can''t come to your party on Saturday because I have a football match at three o''clock. It is an important game for our team. However, I''m free on Sunday. Can we go to the cinema then? Best wishes, Ben » En français, dis quel est le type de document, ce que Ben propose à Tom, et pourquoi il ne peut pas venir. Justifie chaque réponse avec un mot ou une phrase du texte.'
  criteres:
  - L'élève identifie un court message écrit à un ami (mots comme « Hi Tom » et « Best wishes »).
  - L'élève dit que Ben ne peut pas venir samedi à cause d'un match de football à trois heures, et cite « because » ou « football match ».
  - L'élève dit que Ben propose d'aller au cinéma dimanche et justifie avec « free on Sunday » ou « go to the cinema ».
  indices:
    relance: Quel mot de liaison explique pourquoi Ben ne vient pas ? Quel autre mot annonce une solution ?
    methode: 'Fais trois réponses : type de document, raison de l''absence, proposition. Recopie un extrait pour chacune.'
    etape: 'Commence ainsi : « C''est un message à un ami, car il commence par ''Hi Tom''... »'
  solution: C'est un message à un ami (« Hi Tom », « Best wishes »). Ben ne peut pas venir samedi parce qu'il a un match de football à trois heures (« because I have a football match »). Il propose le dimanche, où il est libre (« I'm free on Sunday »), pour aller au cinéma.
