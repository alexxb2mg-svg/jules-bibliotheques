# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: lire
version: 1
etat: verifiee
declencheurs:
- comprendre un texte en anglais
- deviner un mot inconnu en lisant
- stratégies pour lire en anglais
- lire un court texte anglais
prerequis:
- ecouter-et-comprendre
couverture: Travaille sur de courts textes rédigés pour l'exercice (3 à 6 phrases). Ne couvre pas la lecture de textes littéraires
  longs ni de documents authentiques complexes.
essentiel: 'Lire en anglais, ce n''est pas traduire chaque mot. On repère d''abord le type de texte (une annonce, un message,

  un article court) et son sujet général, avant de chercher le détail.


  Certains mots inconnus se devinent grâce au contexte : les mots autour, la ponctuation, ou des mots proches du

  français (les "mots transparents", comme "important" ou "hospital").


  On relit plusieurs fois : une première fois pour le sens général, une deuxième fois pour les détails précis

  (qui, quoi, quand, où).

  '
methode:
- 'Regarder le titre, les images ou la mise en page avant de lire le texte en entier : cela donne le sujet.'
- Lire une première fois sans s'arrêter sur les mots inconnus, pour saisir l'idée générale.
- 'Repérer les mots transparents (proches du français) et les mots répétés : ils portent souvent le sens principal.'
- Deviner un mot inconnu à partir des mots juste avant et après lui, plutôt que de le chercher dans un dictionnaire.
- Relire une deuxième fois pour répondre aux questions précises (qui, quoi, quand, où).
vocabulaire:
- terme: skimming
  definition: lire vite pour saisir l'idée générale d'un texte
- terme: scanning
  definition: parcourir un texte pour trouver une information précise (une date, un nom)
erreurs_frequentes:
- Vouloir traduire chaque mot au lieu de chercher le sens général d'abord.
- S'arrêter sur un mot inconnu et abandonner la lecture au lieu de continuer et deviner grâce au contexte.
- Répondre à une question de détail sans avoir compris le sujet général du texte.
exemple:
  enonce: 'Lis : ''Emma works at the hospital. She helps sick people every day.'' Que fait Emma ?'
  solution: Emma travaille à l'hôpital ('hospital', mot transparent) et aide des personnes malades ('sick people') chaque
    jour. Le mot 'hospital' ressemble au français et donne un indice fort sur son métier.
exercices:
- id: type-de-texte
  type: choix
  difficulte: 1
  enonce: 'Lis : ''Lost cat, orange fur, answers to Milo. Please call 06 12 34 56 78 if found.'' Quel type de texte est-ce
    ?'
  reponse:
    options:
    - id: a
      texte: Une petite annonce pour retrouver un animal perdu
    - id: b
      texte: Une recette de cuisine
    - id: c
      texte: Un bulletin météo
    bonnes:
    - a
  indices:
    relance: Quels mots du texte parlent d'un animal, et pourquoi donne-t-on un numéro de téléphone ?
    methode: '''Lost cat'' signifie ''chat perdu'' : cherche quel type de texte demande de l''aide pour retrouver un animal.'
    etape: '''Lost'' (perdu), ''cat'' (chat) et un numéro à appeler : c''est une annonce.'
  pieges:
  - si:
      contient:
      - b
    relance: Il n'y a ni ingrédient ni étape de préparation ici. Que cherche-t-on à retrouver dans ce texte ?
  - si:
      contient:
      - c
    relance: Il n'est pas question de pluie ou de température. De quel être vivant parle le texte ?
  solution: C'est une petite annonce pour retrouver un chat perdu ('Lost cat'), avec un numéro de téléphone à appeler.
- id: mot-transparent
  type: texte_court
  difficulte: 1
  enonce: Dans la phrase 'This information is important', quel mot ressemble beaucoup à un mot français et veut dire la même
    chose ?
  reponse:
    acceptees:
    - important
    - information
    fautes_tolerees: 1
  indices:
    relance: 'Regarde les deux mots les plus longs de la phrase : lequel te fait penser à un mot français, et se prononce
      presque pareil à l''écrit ?'
    methode: Un mot transparent s'écrit presque comme en français et garde le même sens.
    etape: Ce mot long s'écrit exactement pareil dans les deux langues et garde le même sens.
  pieges:
  - si:
      valeur: this
    relance: '''This'' veut dire ''ceci'', mais il ne ressemble pas à un mot français. Cherche un mot plus long dans la phrase.'
  solution: '''Important'' est un mot transparent : il s''écrit comme en français et signifie la même chose.'
- id: devine-mot-contexte
  type: choix
  difficulte: 2
  enonce: 'Lis : ''The soup was too spicy, so I drank a lot of water.'' D''après le contexte, que veut probablement dire ''spicy''
    ?'
  reponse:
    options:
    - id: a
      texte: Épicée, piquante
    - id: b
      texte: Froide
    - id: c
      texte: Sucrée
    bonnes:
    - a
  indices:
    relance: Pourquoi la personne boit-elle beaucoup d'eau juste après avoir mangé la soupe ?
    methode: Boire beaucoup d'eau après un plat suggère souvent une sensation de piquant en bouche.
    etape: '''So'' relie la cause (la soupe) à la conséquence (boire de l''eau) : quelle qualité d''un plat pousse à boire
      ?'
  pieges:
  - si:
      contient:
      - b
    relance: Boire de l'eau après un plat froid n'est pas une réaction habituelle. Quelle sensation pousse à boire beaucoup
      d'eau ?
  - si:
      contient:
      - c
    relance: Un plat sucré ne donne pas forcément envie de boire de l'eau. Repense à la réaction de la personne.
  solution: '''Spicy'' signifie épicée ou piquante : boire beaucoup d''eau après en manger est un indice de contexte fort.'
- id: ordre-annonce
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre logique les phrases de cette courte annonce de club de sport.
  reponse:
    elements:
    - id: a
      texte: Our tennis club is looking for new members.
    - id: b
      texte: Lessons take place on Wednesday afternoons.
    - id: c
      texte: Contact us at the school office to sign up.
  indices:
    relance: Quelle phrase présente le club, et laquelle explique comment s'inscrire ?
    methode: Une annonce commence en général par une présentation, puis donne les détails pratiques, puis dit quoi faire pour
      participer.
    etape: '''Our tennis club is looking for new members'' présente le sujet : place-la en premier.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux phrases voisines sont inversées. Laquelle donne l'information pratique (le jour), et laquelle explique comment
      s'inscrire ensuite ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la présentation du club, puis le jour des cours, puis la façon de s'inscrire.
  solution: D'abord la présentation du club, puis le jour des cours (le mercredi après-midi), puis le contact pour s'inscrire.
- id: nblm-lors-d-une-premiere-lecture-d-un-texte-c-1
  type: choix
  difficulte: 2
  enonce: Lors d'une première lecture d'un texte court en anglais, quelle est la meilleure stratégie à adopter ?
  reponse:
    options:
    - id: o1
      texte: Lire le texte une première fois sans s'arrêter pour saisir l'idée générale.
    - id: o2
      texte: Traduire chaque mot un par un dans le dictionnaire dès la première ligne.
    - id: o3
      texte: S'arrêter de lire immédiatement dès qu'un mot inconnu apparaît.
    - id: o4
      texte: Chercher directement des détails précis sans avoir pris connaissance du sujet.
    bonnes:
    - o1
  indices:
    relance: Pense à l'objectif principal de la toute première lecture avant de chercher les détails.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : vouloir tout traduire mot à mot ralentit la lecture et fait perdre le fil de l''histoire.'
  - si:
      contient:
      - o3
    relance: 'C''est un piège classique : s''arrêter sur un mot empêche d''avoir une vision d''ensemble du texte.'
  - si:
      contient:
      - o4
    relance: 'C''est une erreur de démarche : chercher un détail sans comprendre le sujet général peut conduire à des contresens.'
  solution: 'Lire le texte une première fois sans s''arrêter pour saisir l''idée générale. C''est la méthode préconisée :
    la première lecture vise à comprendre le sens global sans se bloquer sur les mots inconnus.'
- id: nblm-que-sont-les-mots-transparents-que-l-on-2
  type: choix
  difficulte: 2
  enonce: Que sont les « mots transparents » que l'on retrouve en lisant un texte en anglais ?
  reponse:
    options:
    - id: o1
      texte: Des mots anglais qui ressemblent au français et ont un sens similaire.
    - id: o2
      texte: Des mots invisibles dans le texte qu'il faut sauter sans les lire.
    - id: o3
      texte: Des mots de liaison grammaticaux comme 'but' ou 'because'.
    - id: o4
      texte: Des mots pièges qui ont un sens totalement opposé au français.
    bonnes:
    - o1
  indices:
    relance: Pense aux mots anglais qui ressemblent très fortement à des mots français connus.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion sur le terme : ces mots sont bien écrits et très utiles pour comprendre le texte.'
  - si:
      contient:
      - o3
    relance: 'Erreur de catégorie : ''but'' ou ''because'' sont des mots-outils ou connecteurs, pas des mots transparents.'
  - si:
      contient:
      - o4
    relance: 'Faux : ce que tu décris correspond aux faux-amis, alors que les mots transparents ont un sens similaire au français.'
  solution: 'Des mots anglais qui ressemblent au français et ont un sens similaire. C''est exact : les mots transparents (comme
    ''hospital'' ou ''important'') s''appuient sur la ressemblance avec le français pour faciliter la compréhension.'
- id: nblm-comment-peut-on-deviner-le-sens-d-un-mot-3
  type: choix
  difficulte: 2
  enonce: Comment peut-on deviner le sens d'un mot inconnu lors de la lecture d'un texte anglais ?
  reponse:
    options:
    - id: o1
      texte: En s'aidant du contexte, c'est-à-dire des mots placés juste avant et après lui.
    - id: o2
      texte: En ignorant toute la phrase et en passant directement au paragraphe suivant.
    - id: o3
      texte: En inventant une traduction au hasard sans tenir compte de la phrase.
    - id: o4
      texte: En abandonnant définitivement la lecture du document.
    bonnes:
    - o1
  indices:
    relance: Observe l'environnement direct du mot difficile dans la phrase.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : ignorer la phrase complète te prive d''indices essentiels pour comprendre la suite.'
  - si:
      contient:
      - o3
    relance: 'Mauvaise pratique : deviner sans s''appuyer sur des indices logiques mène très souvent à des erreurs.'
  - si:
      contient:
      - o4
    relance: 'C''est une réaction à éviter : abandonner dès la première difficulté empêche de progresser.'
  solution: 'En s''aidant du contexte, c''est-à-dire des mots placés juste avant et après lui. C''est la bonne stratégie :
    le contexte immédiat et la structure de la phrase donnent des indices pour déduire le sens.'
- id: nblm-quelle-observation-prealable-est-recomma-4
  type: choix
  difficulte: 2
  enonce: Quelle observation préalable est recommandée avant de lire le texte anglais en entier ?
  reponse:
    options:
    - id: o1
      texte: Regarder le titre, les images et la mise en page pour identifier le sujet.
    - id: o2
      texte: Rédiger d'abord la traduction complète du texte au brouillon.
    - id: o3
      texte: Compter le nombre exact de mots contenus dans chaque paragraphe.
    - id: o4
      texte: Ignorer le titre et commencer directement par la fin du texte.
    bonnes:
    - o1
  indices:
    relance: Regarde les éléments visuels et d'organisation autour du texte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est impossible et inutile de traduire un texte avant même de l'avoir observé.
  - si:
      contient:
      - o3
    relance: Cette étape ne donne aucune information sur le sens ou le sujet du document.
  - si:
      contient:
      - o4
    relance: 'Mauvaise approche : le titre est l''élément le plus important pour anticiper le sujet.'
  solution: 'Regarder le titre, les images et la mise en page pour identifier le sujet. C''est la bonne méthode : les indices
    visuels et le titre donnent immédiatement une idée du thème abordé.'
- id: nblm-dans-la-phrase-emma-works-at-the-hospita-5
  type: choix
  difficulte: 2
  enonce: Dans la phrase 'Emma works at the hospital. She helps sick people every day', quel mot permet de comprendre facilement
    où travaille Emma ?
  reponse:
    options:
    - id: o1
      texte: Le mot 'hospital', car c'est un mot transparent proche du français 'hôpital'.
    - id: o2
      texte: Le mot 'sick', car il signifie 'école' en anglais.
    - id: o3
      texte: Le mot 'every day', car il indique le nom du bâtiment.
    - id: o4
      texte: Le mot 'works', car il désigne spécifiquement le métier de médecin.
    bonnes:
    - o1
  indices:
    relance: Identifie le mot anglais qui ressemble à un bâtiment de santé en français.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de vocabulaire : ''sick'' signifie ''malade'' et non ''école''.'
  - si:
      contient:
      - o3
    relance: 'Erreur de traduction : ''every day'' signifie ''chaque jour'' et exprime la fréquence.'
  - si:
      contient:
      - o4
    relance: 'Confusion : ''works'' est le verbe ''travailler'' au présent simple, pas le nom d''un métier.'
  solution: 'Le mot ''hospital'', car c''est un mot transparent proche du français ''hôpital''. C''est exact : la ressemblance
    entre ''hospital'' et ''hôpital'' fournit un indice immédiat sur le lieu de travail.'
- id: nblm-quelles-sont-les-deux-raisons-principale-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux raisons principales d'effectuer une deuxième lecture d'un court texte en anglais ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Repérer des informations précises pour répondre aux questions (qui, quoi, quand, où).
    - id: o2
      texte: Vérifier et approfondir les détails précis après avoir compris l'idée générale.
    - id: o3
      texte: Découvrir pour la toute première fois le sujet général du texte.
    - id: o4
      texte: Traduire obligatoirement l'intégralité du texte mot à mot.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense à ce que l'on cherche lors de la deuxième relecture par rapport à la première.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : le sujet général doit être identifié dès l''observation préalable ou la première lecture.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la relecture ne doit pas se transformer en une traduction mot à mot systématique.'
  solution: 'Repérer des informations précises pour répondre aux questions (qui, quoi, quand, où) ; Vérifier et approfondir
    les détails précis après avoir compris l''idée générale. C''est correct : la deuxième lecture est ciblée et permet d''extraire
    des détails spécifiques.'
- id: nblm-quel-terme-anglais-designe-la-technique-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme anglais désigne la technique de lecture rapide consistant à parcourir un texte pour trouver une information
    précise (comme un nom ou une date) ?
  reponse:
    acceptees:
    - scanning
    fautes_tolerees: 1
  indices:
    relance: Ce terme en -ing s'apparente au fait de balayer du regard le texte à la recherche d'un détail.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'scanning. C''est exact : le ''scanning'' est la lecture ciblée pour repérer une information spécifique.'
- id: nblm-quel-terme-anglais-designe-la-lecture-ra-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme anglais désigne la lecture rapide visant à saisir uniquement l'idée générale d'un texte ?
  reponse:
    acceptees:
    - skimming
    fautes_tolerees: 1
  indices:
    relance: Ce mot anglais se termine par -ing et désigne le survol global du texte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'skimming. C''est exact : le ''skimming'' consiste à parcourir rapidement un texte pour en attraper l''idée générale.'
