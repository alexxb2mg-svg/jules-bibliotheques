# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: ecrire
version: 2
etat: generee
declencheurs:
- structurer un texte en anglais
- corriger une phrase en anglais
- raconter par écrit en anglais
- écrire un message en anglais
- rédaction en anglais
- expression écrite anglais
- relier des phrases en anglais
- écrire un mail en anglais
- donner son avis par écrit en anglais
prerequis:
- parler-en-continu
couverture: Travaille la structuration et la relecture d'un écrit court en anglais (message, récit bref, avis). Ne couvre pas la rédaction de textes longs ni les registres d'écrit très formels (lettre administrative).
essentiel: |
  Écrire en anglais, c'est produire un texte clair, structuré, que l'on a le temps de préparer et de corriger.

  Les stratégies de l'oral servent aussi à l'écrit : préparer un plan, choisir des mots simples et sûrs, contourner un mot inconnu par une reformulation, adapter le registre au lecteur.

  Structurer son écrit. Un texte a un début (on présente le sujet), un développement (les idées, dans l'ordre, une idée par paragraphe) et une fin (une conclusion). Les mots de liaison donnent la cohérence : « and » (addition), « but » (opposition), « because » (cause), « so » (conséquence), « first / then / finally » (ordre).

  Les outils pour écrire. Le dictionnaire (papier ou en ligne) donne le sens et l'orthographe. La liste de verbes irréguliers et le cahier de leçons donnent les formes. Le correcteur d'un traitement de texte aide, mais ne remplace pas la relecture.

  Corriger et modifier son écrit. On relit plusieurs fois avec des questions précises.
  - Sens : mon texte est-il clair et complet ?
  - Verbes : le temps est-il le bon ? Le passé demande le prétérit (went, saw) ; le verbe s'accorde avec le sujet (she likes, he has).
  - Ponctuation et majuscules : « I » prend toujours une majuscule, comme les jours, les mois et les nationalités.
  - Orthographe : les mots vus en classe.

  Les fonctions. Reformuler un message, rendre compte (faire un compte rendu), raconter (au passé), décrire (au présent), expliquer (because, so), argumenter (I think that..., in my opinion..., first..., however...).

  Ce qu'on attend de toi : écrire quelques phrases simples et correctes, bien reliées, adaptées à la situation (mail, message, récit), en te servant des outils pour te relire.
methode:
- Lire la consigne et repérer le type de texte demandé (message, récit, description, avis), le destinataire et le temps à employer.
- 'Faire un plan rapide : de quoi je parle, dans quel ordre, comment je conclus.'
- Écrire un premier jet avec des phrases simples et sûres plutôt que des phrases compliquées mal maîtrisées.
- Relier les phrases avec des mots comme 'and', 'but', 'because', 'so', 'then'.
- 'Se relire avec les outils (leçons, liste de verbes irréguliers, dictionnaire) : d''abord le sens, ensuite les verbes, puis l''orthographe.'
- Recopier proprement la version corrigée.
vocabulaire:
- terme: draft
  definition: un brouillon, une première version d'un texte que l'on va corriger
- terme: connector
  definition: un mot qui relie deux idées ou deux phrases, comme 'and' ou 'because'
- terme: paragraph
  definition: un bloc de phrases qui développe une même idée
- terme: to proofread
  definition: relire son texte pour corriger les erreurs
- terme: past simple
  definition: le prétérit, temps du passé utilisé pour raconter (went, played)
- terme: to sum up
  definition: résumer, conclure un texte en quelques mots
- terme: opinion
  definition: ce que l'on pense d'un sujet ; on écrit « In my opinion, ... »
erreurs_frequentes:
- Écrire un texte sans plan, avec des idées dans le désordre.
- Oublier les mots de liaison entre les phrases, ce qui rend le texte décousu.
- Ne se relire qu'une fois, en oubliant de vérifier les verbes et l'orthographe séparément du sens.
- Écrire au présent une action passée (« I go » au lieu de « I went ») ou oublier la majuscule à « I ».
- Traduire mot à mot du français au lieu d'employer des phrases simples que l'on connaît.
exemple:
  enonce: 'Corrige cette phrase de brouillon : ''I go to London last year and I like it a lot.'''
  solution: '''I went to London last year and I liked it a lot.'' : le voyage a eu lieu dans le passé (''last year''), donc les deux verbes doivent être au prétérit (''went'', ''liked''), pas au présent.'
exercices:
- id: choisir-connecteur
  type: choix
  difficulte: 1
  enonce: 'Complète : ''I wanted to go to the party, ___ I was too tired.'' Quel mot relie le mieux les deux idées ?'
  reponse:
    options:
    - id: a
      texte: but
    - id: b
      texte: and
    - id: c
      texte: because
    bonnes:
    - a
  indices:
    relance: Les deux idées (vouloir aller à la fête / être trop fatigué) vont-elles dans le même sens, ou s'opposent-elles ?
    methode: Un mot de contraste relie deux idées opposées, comme 'mais' en français.
    etape: 'Vouloir sortir mais être fatigué : ce sont deux idées contraires, donc le connecteur d''opposition convient.'
  pieges:
  - si:
      contient:
      - b
    relance: '''And'' additionne deux idées qui vont dans le même sens. Ici, les deux idées s''opposent : cherche un autre mot.'
  - si:
      contient:
      - c
    relance: '''Because'' introduit une cause. La fatigue n''explique pas l''envie d''aller à la fête, elle s''y oppose.'
  solution: '''But'' relie les deux idées opposées : l''envie d''aller à la fête et la fatigue qui en empêche.'
- id: corriger-verbe-passe
  type: texte_court
  difficulte: 1
  enonce: 'Corrige le verbe de cette phrase de brouillon qui raconte hier : ''Yesterday, I go to school by bus.'' Écris seulement le verbe correct.'
  reponse:
    acceptees:
    - went
    fautes_tolerees: 0
  indices:
    relance: '''Yesterday'' indique un moment déjà passé. Le verbe doit-il rester au présent ?'
    methode: Pour un fait passé, on utilise le prétérit du verbe, pas sa forme du présent.
    etape: 'Le prétérit de ''go'' est irrégulier : ce n''est pas ''goed''.'
  pieges:
  - si:
      valeur: goed
    relance: '''Go'' est un verbe irrégulier : son prétérit ne se forme pas en ajoutant ''-ed''. Quelle est sa forme irrégulière ?'
  - si:
      valeur: go
    relance: '''Yesterday'' montre que l''action est passée : le verbe doit changer de forme, pas rester au présent.'
  solution: 'Le prétérit correct est ''went'' : ''Yesterday, I went to school by bus.'''
- id: ordre-recit-court
  type: ordre
  difficulte: 2
  enonce: Range ces phrases pour former un petit récit cohérent sur une sortie au cinéma.
  reponse:
    elements:
    - id: a
      texte: Last Saturday, I went to the cinema with my friends.
    - id: b
      texte: We watched a funny film and ate popcorn.
    - id: c
      texte: In the end, we had a great evening together.
  indices:
    relance: Quelle phrase présente la sortie, et laquelle la conclut ?
    methode: 'Un récit suit un ordre : d''abord la situation de départ, puis les événements, puis la conclusion.'
    etape: '''Last Saturday, I went to the cinema...'' présente le début du récit : place-la en premier.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux phrases voisines sont inversées. Laquelle raconte l'action principale, et laquelle conclut le récit ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le début du récit, puis l'action principale, puis la conclusion introduite par 'in the end'.
  solution: D'abord la sortie au cinéma, puis le film et le pop-corn, puis la conclusion 'in the end, we had a great evening'.
- id: mot-draft
  type: choix
  difficulte: 2
  enonce: Que signifie le mot 'draft' quand on parle d'écriture ?
  reponse:
    options:
    - id: a
      texte: Un brouillon, une première version du texte
    - id: b
      texte: La version finale, déjà corrigée
    - id: c
      texte: Un dictionnaire de vocabulaire
    bonnes:
    - a
  indices:
    relance: 'Relis le vocabulaire de la fiche : ce mot désigne une étape avant le texte final.'
    methode: 'Un ''draft'' se relit et se corrige : ce n''est donc pas la version terminée.'
    etape: On écrit un 'draft' avant de le corriger et d'en faire la version définitive.
  pieges:
  - si:
      contient:
      - b
    relance: Le 'draft' est justement l'étape avant la version finale, celle qu'on va encore corriger.
  - si:
      contient:
      - c
    relance: Ce n'est pas un outil de vocabulaire, mais une étape de la rédaction d'un texte.
  solution: Un 'draft' est un brouillon, une première version du texte que l'on relit et corrige avant la version finale.
- id: accord-sujet-verbe
  type: choix
  difficulte: 2
  enonce: 'Complète : ''My sister ___ football every Saturday.'' Quelle forme est correcte ?'
  reponse:
    options:
    - id: a
      texte: play
    - id: b
      texte: plays
    - id: c
      texte: played
    bonnes:
    - b
  indices:
    relance: Le sujet 'My sister' remplace 'she'. Que devient le verbe au présent avec 'she' ?
    methode: Au présent, avec he, she ou it, le verbe prend un -s. 'Every Saturday' montre une habitude, donc le présent.
    etape: Choisis la forme qui garde le présent et ajoute la marque de la 3e personne.
  pieges:
  - si:
      contient:
      - a
    relance: '''Play'' convient avec I, you, we, they. Ici le sujet est ''my sister'' : que faut-il ajouter ?'
  - si:
      contient:
      - c
    relance: '''Played'' est un passé. ''Every Saturday'' décrit une habitude actuelle : reste au présent.'
  solution: '''She plays'' : au présent, la 3e personne du singulier prend un -s. ''Every Saturday'' marque une habitude.'
- id: majuscules
  type: choix
  difficulte: 1
  enonce: Quelle phrase est écrite correctement ?
  reponse:
    options:
    - id: a
      texte: Last monday i went to london with my friends.
    - id: b
      texte: Last Monday I went to London with my friends.
    - id: c
      texte: last Monday, I went to london.
    bonnes:
    - b
  indices:
    relance: En anglais, quels mots prennent une majuscule au milieu d'une phrase ?
    methode: Le pronom 'I', les jours de la semaine, les mois et les noms de villes prennent toujours une majuscule.
    etape: 'Vérifie la phrase entière : ''Monday'', ''I'' et ''London''. Une seule phrase respecte les trois.'
  pieges:
  - si:
      contient:
      - a
    relance: Cette phrase oublie des majuscules à 'Monday', à 'I' et à 'London'.
  - si:
      contient:
      - c
    relance: Le premier mot d'une phrase prend une majuscule, et le nom de la ville aussi. Relis-la.
  solution: '''Last Monday I went to London with my friends.'' : Monday, I et London prennent une majuscule.'
- id: mot-liaison-so
  type: texte_court
  difficulte: 2
  enonce: 'Complète avec un mot de liaison : ''It was raining, ___ I took my umbrella.'' Écris un seul mot qui exprime la conséquence.'
  reponse:
    acceptees:
    - so
    fautes_tolerees: 0
  indices:
    relance: La pluie est-elle la cause ou la conséquence ? Que fait-on à cause d'elle ?
    methode: Le mot cherché veut dire « donc » et n'a que deux lettres.
    etape: Il commence par la lettre s.
  pieges:
  - si:
      valeur: because
    relance: '''Because'' introduit une cause. Ici, prendre le parapluie est la conséquence de la pluie.'
  - si:
      valeur: but
    relance: '''But'' oppose deux idées. Ici, la deuxième idée découle de la première.'
  solution: '''So'' (donc) introduit la conséquence : il pleut, donc je prends mon parapluie.'
- id: ecrire-avis-mail
  type: ouverte
  difficulte: 3
  enonce: Tu écris à un ami anglais. En 5 phrases en anglais, raconte ce que tu as fait le week-end dernier (au passé) et donne ton avis sur ce week-end. Utilise au moins deux mots de liaison.
  criteres:
  - Le texte comporte 4 à 6 phrases simples, avec une majuscule à 'I' et une ponctuation correcte.
  - Les verbes qui racontent le week-end dernier sont au prétérit (went, played, watched...), sans mélanger avec le présent.
  - Au moins deux mots de liaison (and, but, because, so, then) sont bien utilisés, et une phrase donne un avis (I think..., In my opinion...).
  indices:
    relance: Quel temps faut-il pour parler du week-end dernier ? Quels mots relient tes idées ?
    methode: 'Fais un plan : début (où, avec qui), développement (deux actions), fin (ton avis). Relis les verbes puis l''orthographe.'
    etape: 'Commence ainsi : « Last weekend, I went to... with my... »'
  solution: 'Exemple : « Last weekend, I went to the beach with my family. We swam and then we ate ice cream. The water was cold, but it was fun. In my opinion, it was a great weekend because we laughed a lot. »'
