# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: ecrire
version: 1
etat: verifiee
declencheurs:
- structurer un texte en anglais
- corriger une phrase en anglais
- raconter par écrit en anglais
- écrire un message en anglais
prerequis:
- parler-en-continu
couverture: Travaille la structuration et la relecture d'un écrit court en anglais (message, récit bref). Ne couvre pas la
  rédaction de textes longs ni les registres d'écrit très formels (lettre administrative).
essentiel: 'Écrire en anglais reprend les stratégies utilisées à l''oral : préparer un plan, choisir des mots simples et

  sûrs, adapter le registre. À l''écrit, on a en plus le temps de se relire et de se corriger.


  Un texte bien structuré a un début (qui présente le sujet), un développement (les idées, dans l''ordre) et une

  fin (une conclusion ou une phrase qui referme le texte).


  Se corriger, c''est vérifier surtout : les verbes (temps, accord avec le sujet), les mots reliant les phrases

  ("and", "but", "because", "then"), et l''orthographe des mots déjà vus en classe.

  '
methode:
- 'Faire un plan rapide avant d''écrire : de quoi je parle, dans quel ordre, comment je conclus.'
- Écrire un premier jet avec des phrases simples et sûres plutôt que des phrases compliquées mal maîtrisées.
- Relier les phrases avec des mots comme 'and', 'but', 'because', 'then' pour donner de la cohérence au texte.
- Se relire une première fois pour le sens, une deuxième fois pour vérifier les verbes et l'orthographe.
- Comparer sa phrase à un modèle connu en cas de doute, plutôt que d'inventer une forme incertaine.
vocabulaire:
- terme: draft
  definition: un brouillon, une première version d'un texte que l'on va corriger
- terme: connector
  definition: un mot qui relie deux idées ou deux phrases, comme 'and' ou 'because'
erreurs_frequentes:
- Écrire un texte sans plan, avec des idées dans le désordre.
- Oublier les mots de liaison entre les phrases, ce qui rend le texte décousu.
- Ne se relire qu'une fois, en oubliant de vérifier les verbes et l'orthographe séparément du sens.
exemple:
  enonce: 'Corrige cette phrase de brouillon : ''I go to London last year and I like it a lot.'''
  solution: '''I went to London last year and I liked it a lot.'' : le voyage a eu lieu dans le passé (''last year''), donc
    les deux verbes doivent être au prétérit (''went'', ''liked''), pas au présent.'
exercices:
- id: choisir-connecteur
  type: choix
  difficulte: 1
  enonce: 'Complète : ''I wanted to go to the party, ___ I was too tired.'' Quel mot relie le mieux les deux idées ?'
  reponse:
    options:
    - id: a
      texte: but
    - id: b
      texte: and
    - id: c
      texte: because
    bonnes:
    - a
  indices:
    relance: Les deux idées (vouloir aller à la fête / être trop fatigué) vont-elles dans le même sens, ou s'opposent-elles
      ?
    methode: Un mot de contraste relie deux idées opposées, comme 'mais' en français.
    etape: 'Vouloir sortir mais être fatigué : ce sont deux idées contraires, donc le connecteur d''opposition convient.'
  pieges:
  - si:
      contient:
      - b
    relance: '''And'' additionne deux idées qui vont dans le même sens. Ici, les deux idées s''opposent : cherche un autre
      mot.'
  - si:
      contient:
      - c
    relance: '''Because'' introduit une cause. La fatigue n''explique pas l''envie d''aller à la fête, elle s''y oppose.'
  solution: '''But'' relie les deux idées opposées : l''envie d''aller à la fête et la fatigue qui en empêche.'
- id: corriger-verbe-passe
  type: texte_court
  difficulte: 1
  enonce: 'Corrige le verbe de cette phrase de brouillon qui raconte hier : ''Yesterday, I go to school by bus.'' Écris seulement
    le verbe correct.'
  reponse:
    acceptees:
    - went
    fautes_tolerees: 0
  indices:
    relance: '''Yesterday'' indique un moment déjà passé. Le verbe doit-il rester au présent ?'
    methode: Pour un fait passé, on utilise le prétérit du verbe, pas sa forme du présent.
    etape: 'Le prétérit de ''go'' est irrégulier : ce n''est pas ''goed''.'
  pieges:
  - si:
      valeur: goed
    relance: '''Go'' est un verbe irrégulier : son prétérit ne se forme pas en ajoutant ''-ed''. Quelle est sa forme irrégulière
      ?'
  - si:
      valeur: go
    relance: '''Yesterday'' montre que l''action est passée : le verbe doit changer de forme, pas rester au présent.'
  solution: 'Le prétérit correct est ''went'' : ''Yesterday, I went to school by bus.'''
- id: ordre-recit-court
  type: ordre
  difficulte: 2
  enonce: Range ces phrases pour former un petit récit cohérent sur une sortie au cinéma.
  reponse:
    elements:
    - id: a
      texte: Last Saturday, I went to the cinema with my friends.
    - id: b
      texte: We watched a funny film and ate popcorn.
    - id: c
      texte: In the end, we had a great evening together.
  indices:
    relance: Quelle phrase présente la sortie, et laquelle la conclut ?
    methode: 'Un récit suit un ordre : d''abord la situation de départ, puis les événements, puis la conclusion.'
    etape: '''Last Saturday, I went to the cinema...'' présente le début du récit : place-la en premier.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux phrases voisines sont inversées. Laquelle raconte l'action principale, et laquelle conclut le récit ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le début du récit, puis l'action principale, puis la conclusion introduite par 'in the end'.
  solution: D'abord la sortie au cinéma, puis le film et le pop-corn, puis la conclusion 'in the end, we had a great evening'.
- id: mot-draft
  type: choix
  difficulte: 2
  enonce: Que signifie le mot 'draft' quand on parle d'écriture ?
  reponse:
    options:
    - id: a
      texte: Un brouillon, une première version du texte
    - id: b
      texte: La version finale, déjà corrigée
    - id: c
      texte: Un dictionnaire de vocabulaire
    bonnes:
    - a
  indices:
    relance: 'Relis le vocabulaire de la fiche : ce mot désigne une étape avant le texte final.'
    methode: 'Un ''draft'' se relit et se corrige : ce n''est donc pas la version terminée.'
    etape: On écrit un 'draft' avant de le corriger et d'en faire la version définitive.
  pieges:
  - si:
      contient:
      - b
    relance: Le 'draft' est justement l'étape avant la version finale, celle qu'on va encore corriger.
  - si:
      contient:
      - c
    relance: Ce n'est pas un outil de vocabulaire, mais une étape de la rédaction d'un texte.
  solution: Un 'draft' est un brouillon, une première version du texte que l'on relit et corrige avant la version finale.
- id: nblm-selon-la-fiche-d-anglais-de-3e-quelles-s-1
  type: choix
  difficulte: 2
  enonce: Selon la fiche d'anglais de 3E, quelles sont les trois parties indispensables pour structurer un texte ?
  reponse:
    options:
    - id: o1
      texte: Un début, un développement et une fin
    - id: o2
      texte: Une introduction, trois exemples et un titre
    - id: o3
      texte: Un titre, un dictionnaire et une signature
    - id: o4
      texte: Un brouillon, une traduction mot à mot et une relecture
    bonnes:
    - o1
  indices:
    relance: Pense à la construction logique d'un récit ou d'un paragraphe ordinaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : imposer trois exemples n''est pas la structure fondamentale (début, développement, fin) définie par
      le programme.'
  - si:
      contient:
      - o3
    relance: 'Erreur : ce sont des éléments annexes ou des outils, pas la structure logique du texte.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ce sont des étapes de travail (dont une mauvaise habitude, la traduction mot à mot), pas la structure
      du texte final.'
  solution: 'Un début, un développement et une fin. Exact : la fiche indique qu''un texte bien structuré présente le sujet
    au début, développe les idées dans l''ordre, et se termine par une conclusion.'
- id: nblm-quel-terme-de-vocabulaire-anglais-design-2
  type: choix
  difficulte: 2
  enonce: Quel terme de vocabulaire anglais désigne la première version d'un texte (le brouillon) que l'on s'apprête à corriger
    ?
  reponse:
    options:
    - id: o1
      texte: Draft
    - id: o2
      texte: Connector
    - id: o3
      texte: Layout
    - id: o4
      texte: Summary
    bonnes:
    - o1
  indices:
    relance: Cherche le mot anglais de 5 lettres cité dans la fiche de vocabulaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : un ''connector'' désigne un mot de liaison comme ''and'' ou ''because'', pas un brouillon.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le terme ''layout'' concerne la mise en page du document.'
  - si:
      contient:
      - o4
    relance: 'Erreur : un ''summary'' est un résumé d''un texte existant.'
  solution: 'Draft. Exact : en anglais, un ''draft'' est la première version d''un texte destinée à être relue et corrigée.'
- id: nblm-pourquoi-est-il-essentiel-d-inserer-des-3
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il essentiel d'insérer des mots de liaison ('connectors') comme 'and', 'but' ou 'because' dans sa rédaction
    ?
  reponse:
    options:
    - id: o1
      texte: Pour relier les phrases et donner de la cohérence au texte
    - id: o2
      texte: Pour remplacer les verbes conjugués trop difficiles
    - id: o3
      texte: Pour rallonger artificiellement des phrases simples
    - id: o4
      texte: Pour traduire mot à mot une expression française
    bonnes:
    - o1
  indices:
    relance: Pense au rôle de lien logique entre les différentes propositions.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : les mots de liaison relient les propositions mais ne remplacent pas les verbes.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la fiche préconise des phrases simples et sûres ; les connecteurs servent la cohérence, pas la lourdeur.'
  - si:
      contient:
      - o4
    relance: 'Erreur : les mots de liaison ne doivent pas servir à calquer le français mot à mot.'
  solution: 'Pour relier les phrases et donner de la cohérence au texte. Exact : les connecteurs établissent des liens logiques
    entre les idées et évitent d''avoir un texte décousu.'
- id: nblm-comment-corriger-efficacement-cette-phra-4
  type: choix
  difficulte: 2
  enonce: 'Comment corriger efficacement cette phrase de brouillon : ''I go to London last year and I like it a lot'' ?'
  reponse:
    options:
    - id: o1
      texte: I went to London last year and I liked it a lot.
    - id: o2
      texte: I go to London last year and I liked it a lot.
    - id: o3
      texte: I went to London last year and I like it a lot.
    - id: o4
      texte: I going to London last year and I liking it a lot.
    bonnes:
    - o1
  indices:
    relance: Repère l'expression de temps 'last year' pour choisir la bonne conjugaison au passé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : laisser le premier verbe au présent (''go'') malgré le contexte passé ''last year''.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : corriger le premier verbe mais oublier de conjuguer le second verbe (''like'') au prétérit.'
  - si:
      contient:
      - o4
    relance: 'Erreur : employer la forme en -ING sans auxiliaire à la place du prétérit révolu.'
  solution: 'I went to London last year and I liked it a lot. Exact : la présence de ''last year'' indique que l''action est
    terminée dans le passé, exigeant le prétérit pour les deux verbes (''went'' et ''liked'').'
- id: nblm-selon-la-methode-preconisee-quelle-est-l-5
  type: choix
  difficulte: 2
  enonce: Selon la méthode préconisée, quelle est la meilleure stratégie de relecture avant de rendre sa copie ?
  reponse:
    options:
    - id: o1
      texte: Se relire une première fois pour le sens, puis une seconde fois pour les verbes et l'orthographe
    - id: o2
      texte: Ne se relire qu'une seule fois très rapidement en diagonale
    - id: o3
      texte: Vérifier uniquement les majuscules et ignorer les verbes
    - id: o4
      texte: Remplacer tous les mots simples par des mots complexes non maîtrisés
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi du nombre d'étapes de relecture recommandées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : faire une seule relecture rapide conduit souvent à oublier la vérification ciblée des verbes et de
      l''orthographe.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la vérification des verbes (temps et accord) fait partie des priorités absolues.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la fiche recommande expressément d''utiliser des phrases simples et sûres.'
  solution: 'Se relire une première fois pour le sens, puis une seconde fois pour les verbes et l''orthographe. Exact : séparer
    la vérification du sens de celle de la grammaire et de l''orthographe garantit une relecture efficace.'
- id: nblm-quelles-sont-deux-erreurs-frequentes-ide-6
  type: choix
  difficulte: 3
  enonce: Quelles sont DEUX erreurs fréquentes identifiées dans la fiche qu'il faut éviter en rédaction ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Écrire un texte sans plan préalable
    - id: o2
      texte: Oublier les mots de liaison entre les phrases
    - id: o3
      texte: Écrire des phrases simples et sûres
    - id: o4
      texte: Se relire une deuxième fois pour l'orthographe
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie les deux pièges mentionnés dans les 'Erreurs fréquentes' de la fiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : c''est au contraire la méthode préconisée pour éviter les fautes !'
  - si:
      contient:
      - o4
    relance: 'Erreur : c''est la bonne habitude à adopter, pas une erreur.'
  solution: 'Écrire un texte sans plan préalable ; Oublier les mots de liaison entre les phrases. Exact : rédiger sans plan
    produit un texte avec des idées dans le désordre.'
- id: nblm-un-mot-qui-sert-a-relier-deux-idees-ou-d-7
  type: texte_court
  difficulte: 1
  enonce: Un mot qui sert à relier deux idées ou deux phrases, comme 'and' ou 'because', s'appelle un ______.
  reponse:
    acceptees:
    - connector
    fautes_tolerees: 1
  indices:
    relance: Pense au terme anglais désignant un mot de liaison.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'connector. Exact : ''connector'' est le terme de vocabulaire désignant un mot de liaison en anglais.'
- id: nblm-avant-d-ecrire-son-texte-il-est-recomman-8
  type: texte_court
  difficulte: 1
  enonce: Avant d'écrire son texte, il est recommandé de faire un ______ rapide pour organiser ses idées.
  reponse:
    acceptees:
    - plan
    fautes_tolerees: 1
  indices:
    relance: C'est l'étape préalable d'organisation indispensable avant la rédaction.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'plan. Exact : la méthode de rédaction demande de préparer un plan rapide avant d''écrire.'
