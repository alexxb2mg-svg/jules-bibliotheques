format: 2
notion: theme-voyages-et-migrations
version: 2
etat: verifiee
declencheurs:
- voyage scolaire en anglais
- Ellis Island c'est quoi
- empreinte carbone en anglais
- vocabulaire de l'exil en anglais
- migrer aux Etats-Unis histoire
- immigrer ou émigrer en anglais
- tourisme durable en anglais
- rêve et imaginaire en anglais
- Ellis Island 1892
- réfugié en anglais
prerequis:
- theme-ecole-et-societe
couverture: Aborde le vocabulaire du voyage, du tourisme responsable, de la migration historique (Ellis Island) et de l'imaginaire
  (rêve, fantastique). Ne couvre pas les débats contemporains sur les politiques migratoires ni le droit d'asile.
essentiel: 'Ce thème réunit deux idées : voyager et migrer. Il se prolonge par l''imaginaire, le rêve et le fantastique.


  Voyager. « To travel » est le verbe général : voyager. « A trip » est un voyage précis et court : « a school trip » (un
  voyage scolaire), « a day trip » (une excursion). « A journey » est un trajet, souvent long. « A holiday » (vacances) est
  le temps de repos. On dit « to go on a trip », « to book a ticket », « to pack a suitcase ». Un touriste est « a tourist
  », le tourisme est « tourism ».


  Le tourisme écoresponsable. On dit « eco-friendly tourism » ou « responsible tourism » quand un voyage respecte l''environnement.
  L''empreinte carbone (« carbon footprint ») est la quantité de gaz à effet de serre produite par une activité. On la réduit
  en prenant le train plutôt que l''avion, en marchant, en faisant du vélo ou en évitant de gaspiller (« to reduce », « to
  save », « to recycle »). Exemple : « We reduce our carbon footprint by taking the train. »


  Exil, migration, émigration. « To migrate » : quitter son pays ou sa région pour vivre ailleurs. « To emigrate » : quitter
  son pays. « To immigrate » : arriver dans un nouveau pays pour y vivre. Une personne qui arrive s''appelle « an immigrant
  » ; « a migrant » désigne une personne qui migre. « An exile » vit loin de son pays, souvent à cause de la politique. «
  A refugee » a fui son pays à cause d''un danger, d''une guerre ou d''une persécution.


  Un exemple historique : Ellis Island. Entre 1892 et 1954, des millions d''immigrants arrivés par bateau aux États-Unis passent
  par Ellis Island, une île près de New York. On y contrôle leur identité et leur santé avant de les laisser entrer. Ce n''est
  pas une prison. Le parcours : départ en bateau, arrivée près de New York, contrôle sur l''île, installation dans le pays.


  L''imaginaire, le rêve, le fantastique. « A dream » est un rêve, « a nightmare » un cauchemar, « imagination » l''imagination,
  « a fantasy » un monde fantastique, « a ghost » un fantôme, « magic » la magie. « The American Dream » est l''idée d''une
  vie meilleure aux États-Unis, qui a attiré beaucoup d''immigrants.


  Ce qu''on attend de toi : employer le vocabulaire du voyage, de la migration et de l''imaginaire, et écrire quelques phrases
  simples sur ces thèmes.

  '
methode:
- Repérer si la phrase parle de voyage touristique (trip, tourism, carbon footprint), de migration ou d'exil (migration, refugee,
  Ellis Island) ou d'imaginaire (dream, fantasy).
- Pour le vocabulaire du voyage responsable, chercher le mot « eco » ou « responsible » qui indique le respect de l'environnement.
- Pour les faits historiques comme Ellis Island, retenir un lieu, une période (1892-1954) et une action précise.
- 'Distinguer les mots proches : travel / trip, emigrate / immigrate, migrant / refugee.'
- Pour écrire, construire des phrases simples avec un sujet, un verbe conjugué et un mot du thème.
vocabulaire:
- terme: a school trip
  definition: un voyage scolaire
- terme: carbon footprint
  definition: l'empreinte carbone, c'est-à-dire la quantité de gaz à effet de serre produite par une activité
- terme: migration
  definition: le fait de quitter son pays ou sa région pour s'installer ailleurs
- terme: a refugee
  definition: une personne qui a fui son pays, souvent à cause d'un danger ou d'un conflit
- terme: Ellis Island
  definition: une île près de New York où étaient contrôlés les immigrants arrivant aux États-Unis entre 1892 et 1954
- terme: an immigrant
  definition: une personne qui arrive dans un nouveau pays pour y vivre
- terme: exile
  definition: le fait de vivre loin de son pays, souvent pour des raisons politiques
- terme: a dream
  definition: un rêve, ce que l'on imagine en dormant ou ce que l'on espère
erreurs_frequentes:
- Confondre « travel » (voyager, verbe général) et « trip » (un voyage précis, nom).
- Croire qu'Ellis Island est une prison, alors que c'est un centre de contrôle des immigrants.
- Utiliser « migration » pour parler d'un simple voyage touristique de courte durée.
- Confondre « emigrate » (quitter son pays) et « immigrate » (arriver dans un pays).
- Croire que « refugee » et « tourist » désignent le même type de voyageur.
exemple:
  enonce: 'Traduis en anglais : « Nous reduisons notre empreinte carbone en prenant le train. »'
  solution: 'On peut dire : « We reduce our carbon footprint by taking the train. »'
exercices:
- id: sens-carbon-footprint
  type: choix
  difficulte: 1
  enonce: Que signifie l'expression « carbon footprint » ?
  reponse:
    options:
    - id: a
      texte: L'empreinte carbone, la quantite de gaz a effet de serre produite
    - id: b
      texte: Une chaussure de randonnee
    - id: c
      texte: Un billet de train
    - id: d
      texte: Un passeport
    bonnes:
    - a
  indices:
    relance: Le mot « footprint » signifie « empreinte de pas ». A quoi cette empreinte peut-elle s'appliquer ici ?
    methode: Le mot « carbon » designe le carbone, souvent lie a la pollution et au climat.
    etape: 'Associe « carbon » (carbone) et « footprint » (empreinte) : cela donne une expression liee a l''environnement.'
  pieges:
  - si:
      contient:
      - b
    relance: Une chaussure de randonnee se dit « hiking boot », pas « carbon footprint ».
  - si:
      contient:
      - d
    relance: Un passeport se dit « passport ». Le carbon footprint parle d'environnement, pas de documents de voyage.
  solution: 'Le « carbon footprint » est l''empreinte carbone : la quantite de gaz a effet de serre qu''une activite produit.'
- id: traduire-voyage-scolaire
  type: texte_court
  difficulte: 1
  enonce: 'Traduis en anglais : « un voyage scolaire ».'
  reponse:
    acceptees:
    - a school trip
    - school trip
    fautes_tolerees: 0
  indices:
    relance: 'Deux mots anglais tres simples suffisent : un mot pour « ecole » et un mot pour « voyage court ».'
    methode: Le mot « school » signifie ecole. Cherche le mot qui designe un voyage de courte duree.
    etape: Le second mot est « trip », pas « travel » (qui est un verbe ou un nom plus general).
  pieges:
  - si:
      diagnostic: mauvaise_reponse
    relance: Attention a ne pas utiliser « travel », qui ne convient pas ici pour designer un voyage precis.
  solution: On dit « a school trip ». Le mot « trip » designe un voyage court et precis.
- id: chronologie-ellis-island
  type: ordre
  difficulte: 2
  enonce: Range ces etapes du parcours d'un immigrant a Ellis Island dans l'ordre chronologique.
  reponse:
    elements:
    - id: depart
      texte: L'immigrant quitte son pays en bateau
    - id: arrivee
      texte: Le bateau arrive pres de New York
    - id: controle
      texte: Les autorites controlent l'immigrant sur Ellis Island
    - id: installation
      texte: L'immigrant s'installe aux Etats-Unis
  indices:
    relance: Quelle est la toute premiere etape, avant meme d'arriver en Amerique ?
    methode: Situe d'abord le depart et l'installation finale, puis place les deux etapes intermediaires.
    etape: Le depart en bateau vient avant l'arrivee pres de New York, qui vient elle-meme avant le controle.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux etapes voisines sont inversees. Le controle a-t-il lieu avant ou apres l'arrivee du bateau ?
  - si:
      diagnostic: ordre_faux
    relance: Repere d'abord le depart (premiere etape) et l'installation (derniere etape).
  solution: Depart en bateau, arrivee pres de New York, controle sur Ellis Island, puis installation aux Etats-Unis.
- id: mot-refugie
  type: texte_court
  difficulte: 2
  enonce: Quel mot anglais designe une personne qui a fui son pays a cause d'un danger ou d'un conflit ?
  reponse:
    acceptees:
    - a refugee
    - refugee
    fautes_tolerees: 1
  indices:
    relance: Ce mot ressemble beaucoup a son equivalent francais.
    methode: Pense au mot francais « refugie » et adapte-le a l'orthographe anglaise.
    etape: Le mot commence par « ref » et se termine par « ee ».
  pieges:
  - si:
      valeur: migrant
    relance: Un « migrant » quitte son pays pour des raisons variees, pas forcement un danger. Quel mot precis designe une
      fuite face a un danger ?
  solution: Le mot est « refugee ». Il designe une personne qui a fui son pays, souvent a cause d'un danger ou d'un conflit.
- id: recit-voyage-responsable
  type: ouverte
  difficulte: 3
  enonce: En anglais, ecris trois phrases pour decrire un voyage scolaire imaginaire et une action qui reduit son empreinte
    carbone.
  criteres:
  - Les trois phrases sont ecrites en anglais, avec un sujet et un verbe conjugue.
  - Le mot « trip » ou « travel » est utilise correctement pour parler du voyage.
  - Une action concrete de reduction de l'empreinte carbone est mentionnee (train, bus, walking...).
  indices:
    relance: Quel moyen de transport pollue le moins pour se rendre a destination ?
    methode: Commence par presenter le voyage, puis explique le moyen de transport choisi, puis conclus sur son interet ecologique.
    etape: Tu peux commencer par « Our school trip is to... » puis continuer avec « We travel by train to reduce our carbon
      footprint. »
  solution: 'Exemple possible : « Our school trip is to a national park. We travel by train instead of by car. This helps
    to reduce our carbon footprint. »'
- id: migration-mots
  type: association
  difficulte: 2
  enonce: Associe chaque mot anglais à sa définition.
  reponse:
    gauche:
    - id: a
      texte: immigrant
    - id: b
      texte: refugee
    - id: c
      texte: tourist
    - id: d
      texte: exile
    droite:
    - id: x
      texte: personne qui arrive dans un nouveau pays pour y vivre
    - id: y
      texte: personne qui a fui un danger
    - id: z
      texte: personne qui voyage pour le plaisir
    - id: w
      texte: vie loin de son pays, souvent pour des raisons politiques
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Pour chaque mot, cherche s'il parle d'un voyage de loisir ou d'un départ de son pays.
    methode: '''Tourist'' parle de plaisir. Les trois autres mots parlent de quitter son pays.'
    etape: Associe d'abord le mot le plus simple, 'tourist'.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis-les une par une et repère celle qui ne convient pas.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Commence par celle dont tu es le plus sûr, puis avance par élimination.
  solution: immigrant = arrive pour vivre ; refugee = a fui un danger ; tourist = voyage pour le plaisir ; exile = loin de
    son pays.
- id: duree-ellis-island
  type: nombre
  difficulte: 2
  enonce: Ellis Island a servi de centre de contrôle des immigrants de 1892 à 1954. Combien d'années cette période représente-t-elle
    ?
  reponse:
    valeur: 62
    forme: entier
  indices:
    relance: Pour trouver une durée, il faut comparer la date de fin et la date de début.
    methode: Soustrais la date de début à la date de fin.
    etape: Calcule 1954 moins 1892.
  pieges:
  - si:
      valeur: 72
    relance: 'Vérifie ta soustraction : regarde les unités et les dizaines.'
  solution: 1954 − 1892 = 62 ans.
- id: reduire-empreinte
  type: choix
  difficulte: 2
  enonce: Quelle action réduit le mieux l'empreinte carbone d'un voyage scolaire de 200 km ?
  reponse:
    options:
    - id: a
      texte: Prendre le train
    - id: b
      texte: Prendre un vol privé
    - id: c
      texte: Louer plusieurs voitures
    bonnes:
    - a
  indices:
    relance: L'empreinte carbone mesure les gaz à effet de serre. Quel transport en produit le moins par personne ?
    methode: Un transport collectif qui emmène beaucoup de personnes produit moins de gaz par personne.
    etape: Élimine les deux options qui utilisent beaucoup d'énergie pour peu de personnes.
  pieges:
  - si:
      contient:
      - b
    relance: Un vol privé pollue beaucoup pour peu de passagers. Cherche un transport collectif.
  - si:
      contient:
      - c
    relance: Plusieurs voitures produisent beaucoup de gaz pour le même groupe. Cherche un transport collectif.
  solution: Le train est un transport collectif qui produit moins de gaz à effet de serre par personne.
