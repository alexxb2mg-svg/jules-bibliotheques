format: 2
notion: theme-voyages-et-migrations
version: 1
etat: verifiee
declencheurs:
- voyage scolaire en anglais
- Ellis Island c'est quoi
- empreinte carbone en anglais
- vocabulaire de l'exil en anglais
- migrer aux Etats-Unis histoire
prerequis:
- theme-ecole-et-societe
couverture: Aborde le vocabulaire du voyage, du tourisme responsable et de la migration historique (Ellis Island). Ne couvre
  pas les debats contemporains sur les politiques migratoires ni le droit d'asile.
essentiel: 'Voyager se dit « to travel » en anglais. Un voyage scolaire se dit « a school trip ».

  On parle de « eco-friendly tourism » ou « responsible tourism » quand un voyage

  respecte l''environnement, par exemple en reduisant son « carbon footprint » (empreinte

  carbone).


  Historiquement, des millions de personnes ont quitte leur pays pour s''installer

  ailleurs : c''est la « migration ». Entre 1892 et 1954, des millions d''immigrants

  arrivant aux Etats-Unis sont passes par « Ellis Island », une ile pres de New York

  ou ils etaient controles avant d''entrer dans le pays.


  Quitter son pays de force, souvent pour des raisons politiques, s''appelle « exile

  » (l''exil). Un refugie se dit « a refugee ».

  '
methode:
- Repere si la phrase parle de voyage touristique (trip, tourism, carbon footprint) ou de migration/exil (migration, refugee,
  Ellis Island).
- Pour le vocabulaire du voyage responsable, cherche le mot « eco » ou « responsible » qui indique le respect de l'environnement.
- Pour les faits historiques comme Ellis Island, retiens un lieu, une periode et une action precise.
vocabulaire:
- terme: a school trip
  definition: un voyage scolaire
- terme: carbon footprint
  definition: l'empreinte carbone, c'est-a-dire la quantite de gaz a effet de serre produite par une activite
- terme: migration
  definition: le fait de quitter son pays pour s'installer dans un autre
- terme: a refugee
  definition: une personne qui a fui son pays, souvent a cause d'un danger ou d'un conflit
- terme: Ellis Island
  definition: une ile pres de New York ou etaient controles les immigrants arrivant aux Etats-Unis entre 1892 et 1954
erreurs_frequentes:
- Confondre « travel » (voyager, verbe general) et « trip » (un voyage precis, nom).
- Croire qu'Ellis Island est une prison, alors que c'est un centre de controle des immigrants.
- Utiliser « migration » pour parler d'un simple voyage touristique de courte duree.
exemple:
  enonce: 'Traduis en anglais : « Nous reduisons notre empreinte carbone en prenant le train. »'
  solution: 'On peut dire : « We reduce our carbon footprint by taking the train. »'
exercices:
- id: sens-carbon-footprint
  type: choix
  difficulte: 1
  enonce: Que signifie l'expression « carbon footprint » ?
  reponse:
    options:
    - id: a
      texte: L'empreinte carbone, la quantite de gaz a effet de serre produite
    - id: b
      texte: Une chaussure de randonnee
    - id: c
      texte: Un billet de train
    - id: d
      texte: Un passeport
    bonnes:
    - a
  indices:
    relance: Le mot « footprint » signifie « empreinte de pas ». A quoi cette empreinte peut-elle s'appliquer ici ?
    methode: Le mot « carbon » designe le carbone, souvent lie a la pollution et au climat.
    etape: 'Associe « carbon » (carbone) et « footprint » (empreinte) : cela donne une expression liee a l''environnement.'
  pieges:
  - si:
      contient:
      - b
    relance: Une chaussure de randonnee se dit « hiking boot », pas « carbon footprint ».
  - si:
      contient:
      - d
    relance: Un passeport se dit « passport ». Le carbon footprint parle d'environnement, pas de documents de voyage.
  solution: 'Le « carbon footprint » est l''empreinte carbone : la quantite de gaz a effet de serre qu''une activite produit.'
- id: traduire-voyage-scolaire
  type: texte_court
  difficulte: 1
  enonce: 'Traduis en anglais : « un voyage scolaire ».'
  reponse:
    acceptees:
    - a school trip
    - school trip
    fautes_tolerees: 0
  indices:
    relance: 'Deux mots anglais tres simples suffisent : un mot pour « ecole » et un mot pour « voyage court ».'
    methode: Le mot « school » signifie ecole. Cherche le mot qui designe un voyage de courte duree.
    etape: Le second mot est « trip », pas « travel » (qui est un verbe ou un nom plus general).
  pieges:
  - si:
      diagnostic: mauvaise_reponse
    relance: Attention a ne pas utiliser « travel », qui ne convient pas ici pour designer un voyage precis.
  solution: On dit « a school trip ». Le mot « trip » designe un voyage court et precis.
- id: chronologie-ellis-island
  type: ordre
  difficulte: 2
  enonce: Range ces etapes du parcours d'un immigrant a Ellis Island dans l'ordre chronologique.
  reponse:
    elements:
    - id: depart
      texte: L'immigrant quitte son pays en bateau
    - id: arrivee
      texte: Le bateau arrive pres de New York
    - id: controle
      texte: Les autorites controlent l'immigrant sur Ellis Island
    - id: installation
      texte: L'immigrant s'installe aux Etats-Unis
  indices:
    relance: Quelle est la toute premiere etape, avant meme d'arriver en Amerique ?
    methode: Situe d'abord le depart et l'installation finale, puis place les deux etapes intermediaires.
    etape: Le depart en bateau vient avant l'arrivee pres de New York, qui vient elle-meme avant le controle.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux etapes voisines sont inversees. Le controle a-t-il lieu avant ou apres l'arrivee du bateau ?
  - si:
      diagnostic: ordre_faux
    relance: Repere d'abord le depart (premiere etape) et l'installation (derniere etape).
  solution: Depart en bateau, arrivee pres de New York, controle sur Ellis Island, puis installation aux Etats-Unis.
- id: mot-refugie
  type: texte_court
  difficulte: 2
  enonce: Quel mot anglais designe une personne qui a fui son pays a cause d'un danger ou d'un conflit ?
  reponse:
    acceptees:
    - a refugee
    - refugee
    fautes_tolerees: 1
  indices:
    relance: Ce mot ressemble beaucoup a son equivalent francais.
    methode: Pense au mot francais « refugie » et adapte-le a l'orthographe anglaise.
    etape: Le mot commence par « ref » et se termine par « ee ».
  pieges:
  - si:
      valeur: migrant
    relance: Un « migrant » quitte son pays pour des raisons variees, pas forcement un danger. Quel mot precis designe une
      fuite face a un danger ?
  solution: Le mot est « refugee ». Il designe une personne qui a fui son pays, souvent a cause d'un danger ou d'un conflit.
- id: recit-voyage-responsable
  type: ouverte
  difficulte: 3
  enonce: En anglais, ecris trois phrases pour decrire un voyage scolaire imaginaire et une action qui reduit son empreinte
    carbone.
  criteres:
  - Les trois phrases sont ecrites en anglais, avec un sujet et un verbe conjugue.
  - Le mot « trip » ou « travel » est utilise correctement pour parler du voyage.
  - Une action concrete de reduction de l'empreinte carbone est mentionnee (train, bus, walking...).
  indices:
    relance: Quel moyen de transport pollue le moins pour se rendre a destination ?
    methode: Commence par presenter le voyage, puis explique le moyen de transport choisi, puis conclus sur son interet ecologique.
    etape: Tu peux commencer par « Our school trip is to... » puis continuer avec « We travel by train to reduce our carbon
      footprint. »
  solution: 'Exemple possible : « Our school trip is to a national park. We travel by train instead of by car. This helps
    to reduce our carbon footprint. »'
- id: nblm-comment-dit-on-un-voyage-scolaire-en-ang-1
  type: choix
  difficulte: 2
  enonce: Comment dit-on « un voyage scolaire » en anglais ?
  reponse:
    options:
    - id: o1
      texte: a school trip
    - id: o2
      texte: a school travel
    - id: o3
      texte: a school voyage
    - id: o4
      texte: a school journey
    bonnes:
    - o1
  indices:
    relance: Pense au mot anglais employé pour désigner une sortie ou un déplacement précis.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : « travel » est un verbe général ou une notion, pas le nom utilisé pour désigner un voyage
      précis.'
  - si:
      contient:
      - o3
    relance: « Voyage » en anglais s'emploie principalement pour de longues traversées en mer ou dans l'espace.
  - si:
      contient:
      - o4
    relance: « Journey » désigne le trajet ou le déplacement physique d'un point à un autre, non le séjour scolaire.
  solution: 'a school trip. C''est la traduction exacte : « trip » désigne un voyage ou une sortie précise.'
- id: nblm-qu-est-ce-qu-ellis-island-dans-l-histoir-2
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qu'Ellis Island dans l'histoire des migrations vers les États-Unis ?
  reponse:
    options:
    - id: o1
      texte: Une île près de New York où étaient contrôlés les immigrants arrivant aux États-Unis.
    - id: o2
      texte: Une prison pénitencière pour les criminels traversant l'Atlantique.
    - id: o3
      texte: Une station balnéaire réservée aux touristes aisés du XIXe siècle.
    - id: o4
      texte: Un port marchand exclusivement réservé au transit de marchandises.
    bonnes:
    - o1
  indices:
    relance: Pense au rôle d'inspection administrative de ce lieu situé près de New York entre 1892 et 1954.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : croire qu''Ellis Island était une prison, alors qu''il s''agissait d''un centre de contrôle
      d''immigration.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : ce n''était pas un lieu de vacances mais un centre administratif d''entrée sur le territoire.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : ce lieu concernait les flux humains d''immigration et non les marchandises.'
  solution: 'Une île près de New York où étaient contrôlés les immigrants arrivant aux États-Unis. C''est exact : entre 1892
    et 1954, des millions d''immigrants y ont été contrôlés à leur arrivée.'
- id: nblm-comment-traduit-on-l-expression-empreint-3
  type: choix
  difficulte: 2
  enonce: Comment traduit-on l'expression « empreinte carbone » en anglais ?
  reponse:
    options:
    - id: o1
      texte: carbon footprint
    - id: o2
      texte: carbon mark
    - id: o3
      texte: carbon print
    - id: o4
      texte: ecological travel
    bonnes:
    - o1
  indices:
    relance: Le second mot signifie littéralement l'empreinte de pas.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: « Mark » signifie marque ou tache, ce qui ne correspond pas au concept d'empreinte écologique.
  - si:
      contient:
      - o3
    relance: « Print » désigne une impression ou une trace écrite, pas l'empreinte carbone.
  - si:
      contient:
      - o4
    relance: Cette expression signifie « voyage écologique », ce qui est différent de la mesure de l'empreinte carbone.
  solution: carbon footprint. C'est le terme exact pour désigner la quantité de gaz à effet de serre produite par une activité.
- id: nblm-quel-mot-anglais-designe-specifiquement-4
  type: choix
  difficulte: 2
  enonce: Quel mot anglais désigne spécifiquement une personne qui a fui son pays à cause d'un danger ou d'un conflit ?
  reponse:
    options:
    - id: o1
      texte: a refugee
    - id: o2
      texte: a tourist
    - id: o3
      texte: a traveler
    - id: o4
      texte: a guide
    bonnes:
    - o1
  indices:
    relance: Ce terme appartient au vocabulaire de l'asile et de la protection internationale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un touriste voyage par plaisir et de manière temporaire, ce qui ne correspond pas à une situation d'exil.
  - si:
      contient:
      - o3
    relance: « Traveler » est un terme neutre et général qui ne reflète pas le caractère forcé du départ.
  - si:
      contient:
      - o4
    relance: Un guide est une personne qui accompagne des visiteurs, sans lien avec l'exil ou la fuite.
  solution: a refugee. C'est le mot juste pour désigner un réfugié ayant fui son pays pour des raisons de sécurité.
- id: nblm-quelle-est-la-difference-d-usage-essenti-5
  type: choix
  difficulte: 2
  enonce: Quelle est la différence d'usage essentielle entre « travel » et « trip » ?
  reponse:
    options:
    - id: o1
      texte: « travel » est le verbe général pour voyager, tandis que « trip » est un nom désignant un voyage précis.
    - id: o2
      texte: « travel » s'utilise pour les voyages en avion et « trip » pour les déplacements en train.
    - id: o3
      texte: « travel » est un nom uniquement au pluriel et « trip » est un adjectif qualificatif.
    - id: o4
      texte: Il n'y a aucune différence, ce sont deux termes parfaitement interchangeables.
    bonnes:
    - o1
  indices:
    relance: L'un s'utilise comme verbe général, l'autre comme nom comptable pour désigner un séjour déterminé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect : le moyen de transport utilisé n''influence pas le choix entre ces deux mots.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : travel est principalement un verbe et trip est un nom comptable.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : les intervertir conduit à des erreurs comme dire « a school travel » au lieu de « a school
      trip ».'
  solution: '« travel » est le verbe général pour voyager, tandis que « trip » est un nom désignant un voyage précis. C''est
    la règle fondamentale : on emploie le verbe « to travel » pour l''action et le nom « a trip » pour un déplacement particulier.'
- id: nblm-quels-termes-anglais-designent-un-touris-6
  type: choix
  difficulte: 3
  enonce: Quels termes anglais désignent un tourisme respectueux de l'environnement ? (Sélectionne 2 réponses) (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: eco-friendly tourism
    - id: o2
      texte: responsible tourism
    - id: o3
      texte: forced migration
    - id: o4
      texte: exile tourism
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les adjectifs évoquant l'écologie ou la responsabilité environnementale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Incorrect : la migration forcée relève de l''exil et des déplacements de population sous contrainte.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : cette association de mots ne correspond à aucun concept de tourisme durable.'
  solution: eco-friendly tourism ; responsible tourism. C's'agit de l'un des termes officiels pour qualifier le tourisme écologique.
- id: nblm-comment-traduit-on-l-exil-le-fait-de-qui-7
  type: texte_court
  difficulte: 1
  enonce: Comment traduit-on « l'exil » (le fait de quitter son pays de force pour des raisons politiques) en anglais ?
  reponse:
    acceptees:
    - exile
    fautes_tolerees: 1
  indices:
    relance: Ce mot ressemble énormément au terme français et contient 5 lettres.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: exile. « Exile » est le mot anglais exact pour traduire l'exil.
- id: nblm-entre-1892-et-1954-quelle-ile-situee-pre-8
  type: texte_court
  difficulte: 1
  enonce: Entre 1892 et 1954, quelle île située près de New York servait de centre de contrôle pour les immigrants arrivant
    aux États-Unis ?
  reponse:
    acceptees:
    - Ellis Island
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'un nom propre composé de deux mots.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: Ellis Island. Ellis Island est le nom historique officiel de ce point d'entrée et de contrôle.
