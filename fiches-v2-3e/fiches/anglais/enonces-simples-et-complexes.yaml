format: 2
notion: enonces-simples-et-complexes
version: 2
etat: verifiee
declencheurs:
- relative who which en anglais
- discours indirect anglais
- if clause type 1 anglais
- connecteurs logiques en anglais
- question tag en anglais
- interrogation indirecte en anglais
- relier deux phrases en anglais
- because ou so en anglais
prerequis:
- groupe-verbal
essentiel: 'Un énoncé simple a un seul verbe conjugué (She plays tennis). Un énoncé complexe en a plusieurs et relie des propositions.


  Coordination. On relie deux propositions de même importance avec « and » (et), « but » (mais), « or » (ou), « so » (donc).
  Exemple : I like tennis, but my brother prefers football.


  Subordination. Une proposition dépend d''une autre. « Because » (parce que) donne la cause : I stay home because it is raining.
  « When », « if », « although » (bien que) sont d''autres connecteurs de subordination. Ne pas confondre « so » (conséquence
  : It rained, so we stayed home) et « because » (cause).


  Relatifs. Une proposition relative précise un nom : « who » pour une personne (the boy who lives here), « which » pour une
  chose ou un animal (the book which I read). « That » peut remplacer who ou which dans la plupart des cas.


  Discours indirect. On rapporte les paroles de quelqu''un sans guillemets. Au passé, le verbe recule souvent d''un temps
  : « I am tired » devient « She said (that) she was tired ». Les pronoms changent aussi : I devient he ou she.


  Interrogation indirecte. On rapporte une question. Il n''y a plus d''inversion et pas de point d''interrogation : « Where
  do you live ? » devient « He asked where I lived ». Pour une question fermée, on utilise « if » : « He asked if I was ready
  ».


  Condition de type 1. If + présent simple, will + verbe : If it rains, we will stay home.


  Question tag. Courte question de confirmation en fin de phrase : You are French, aren''t you ? Phrase affirmative, tag négatif
  ; phrase négative, tag affirmatif.


  Au brevet : relier des phrases avec le bon connecteur, choisir who ou which, transformer une phrase au discours indirect.

  '
methode:
- 'Pour relier deux idées, identifie leur rapport : addition (and), opposition (but), cause (because), conséquence (so).'
- Pour choisir who ou which, identifie d'abord si le nom remplacé désigne une personne ou une chose.
- Pour le discours indirect, vérifie si le temps du verbe doit reculer (présent → prétérit) quand le verbe introducteur est
  au passé.
- Pour une interrogation indirecte, rétablis l'ordre sujet + verbe, sans inversion ni point d'interrogation.
- 'Pour une if-clause de type 1, vérifie la structure : présent simple après if, will dans l''autre partie.'
- 'Pour un question tag, vérifie d''abord si la phrase principale est affirmative ou négative : le tag est toujours de sens
  opposé.'
vocabulaire:
- terme: relative clause
  definition: une proposition relative, qui apporte une précision sur un nom (who, which, that)
- terme: reported speech
  definition: le discours indirect, qui rapporte les paroles de quelqu'un sans guillemets
- terme: if-clause
  definition: une proposition introduite par « if », qui exprime une condition
- terme: question tag
  definition: une courte question ajoutée à la fin d'une phrase pour demander une confirmation
- terme: connective
  definition: un mot de liaison qui relie deux idées (and, but, because, so)
- terme: coordination
  definition: le fait de relier deux propositions de même importance
- terme: subordination
  definition: le fait de rattacher une proposition à une autre dont elle dépend
- terme: indirect question
  definition: une question rapportée dans une phrase, sans inversion (He asked where I lived)
erreurs_frequentes:
- Utiliser « which » pour parler d'une personne au lieu de « who ».
- Oublier de faire reculer le temps du verbe au discours indirect quand le verbe introducteur est au passé.
- Faire un question tag du même sens que la phrase principale (affirmatif + affirmatif) au lieu d'un sens opposé.
- Garder l'inversion dans une interrogation indirecte (He asked where do I live) au lieu de l'ordre sujet + verbe.
- Confondre « because » (la cause) et « so » (la conséquence).
exemple:
  enonce: 'Traduis en anglais : « S''il pleut, nous resterons a la maison. »'
  solution: 'On peut dire : « If it rains, we will stay home. » (present simple apres if, will dans l''autre partie).'
exercices:
- id: choix-relatif
  type: choix
  difficulte: 1
  enonce: 'Complete : « I have a friend ___ lives in London. »'
  reponse:
    options:
    - id: a
      texte: who
    - id: b
      texte: which
    - id: c
      texte: what
    - id: d
      texte: whose
    bonnes:
    - a
  indices:
    relance: Le mot "friend" designe-t-il une personne ou une chose ?
    methode: Un pronom relatif differe selon qu'on parle d'une personne ou d'une chose/un animal.
    etape: '"Friend" est une personne : choisis le pronom relatif reserve aux personnes.'
  pieges:
  - si:
      contient:
      - b
    relance: '"Which" s''utilise pour une chose ou un animal, pas pour une personne comme "a friend".'
  solution: On dit « I have a friend who lives in London. », car "who" s'utilise pour une personne.
- id: discours-indirect-simple
  type: texte_court
  difficulte: 2
  enonce: 'Transforme au discours indirect : Tom said, "I am hungry." -> Tom said (that) he ___ hungry.'
  reponse:
    acceptees:
    - was
    fautes_tolerees: 0
  indices:
    relance: 'Le verbe introducteur "said" est au passe : le temps du verbe rapporte doit reculer.'
    methode: Au discours indirect, le verbe recule d'un temps quand le verbe introducteur est au passe.
    etape: Le pronom "I" devient "he", et le verbe change de temps en consequence.
  pieges:
  - si:
      valeur: is
    relance: 'Le verbe introducteur est au passe ("said") : le temps doit reculer, choisis la forme passee du verbe "be".'
  solution: On dit « Tom said (that) he was hungry. », le present "am" reculant au preterit "was".
- id: if-clause-type-1
  type: texte_court
  difficulte: 2
  enonce: 'Complete : « If you ___ (study), you will pass the exam. »'
  reponse:
    acceptees:
    - study
    fautes_tolerees: 0
  indices:
    relance: Dans une if-clause de type 1, quel temps utilise-t-on juste apres "if" ?
    methode: Apres "if" dans une condition realiste sur le futur, on utilise le present simple, pas will.
    etape: Le verbe reste a sa forme de base, sans -s puisque le sujet est "you".
  pieges:
  - si:
      valeur: will study
    relance: 'On n''utilise jamais "will" directement apres "if" dans une if-clause de type 1 : c''est le present simple qui
      convient.'
  solution: On dit « If you study, you will pass the exam. », present simple apres if, will dans l'autre partie.
- id: question-tag
  type: choix
  difficulte: 2
  enonce: 'Complete : « You aren''t hungry, ___? »'
  reponse:
    options:
    - id: a
      texte: are you
    - id: b
      texte: aren't you
    - id: c
      texte: don't you
    - id: d
      texte: do you
    bonnes:
    - a
  indices:
    relance: La phrase principale est negative ("aren't"). Le question tag doit-il etre affirmatif ou negatif ?
    methode: Quand la phrase principale est negative, le question tag est affirmatif, et inversement.
    etape: 'Le verbe "be" (are) est deja utilise dans la phrase : le tag reprend le meme verbe, sans negation.'
  pieges:
  - si:
      contient:
      - b
    relance: 'La phrase principale est deja negative ("aren''t") : le tag doit etre affirmatif, pas negatif.'
  solution: On dit « You aren't hungry, are you? », car une phrase negative appelle un tag affirmatif.
- id: recit-avec-connecteurs
  type: ouverte
  difficulte: 3
  enonce: En anglais, ecris trois phrases sur un projet de voyage en utilisant au moins un connecteur (because, but, so) et
    une if-clause de type 1.
  criteres:
  - Les trois phrases sont ecrites en anglais, avec un sujet et un verbe conjugue.
  - Un connecteur logique (because, but, so...) relie deux idees correctement.
  - Une if-clause de type 1 (if + present simple, will) est utilisee correctement.
  indices:
    relance: Quelle condition dois-tu remplir pour que ton voyage se passe bien ?
    methode: Commence par presenter le projet, relie deux idees avec un connecteur, puis ajoute une condition avec if.
    etape: Tu peux commencer par « We want to visit London because it is famous. » puis continuer avec « If we save money,
      we will go there. »
  solution: 'Exemple possible : « We want to visit London because it is famous. It is expensive, but we are saving money.
    If we save enough, we will go there next year. »'
- id: connecteur-cause
  type: choix
  difficulte: 1
  enonce: 'Complète : « I stay at home ___ it is raining. »'
  reponse:
    options:
    - id: a
      texte: because
    - id: b
      texte: but
    - id: c
      texte: or
    bonnes:
    - a
  indices:
    relance: La pluie est-elle la cause ou l'opposé de rester à la maison ?
    methode: Cherche le connecteur qui donne la raison.
    etape: Un des trois connecteurs exprime l'opposition, un autre le choix. Un seul exprime la cause.
  pieges:
  - si:
      contient:
      - b
    relance: Ce connecteur exprime l'opposition. Ici, la pluie explique pourquoi on reste.
  - si:
      contient:
      - c
    relance: Ce connecteur exprime un choix entre deux possibilités. Ici, on donne une raison.
  solution: '« I stay at home because it is raining. » : la pluie est la cause.'
- id: interrogation-indirecte
  type: texte_court
  difficulte: 2
  enonce: 'Complète : « Where do you live ? » devient « He asked me where I ___ ».'
  reponse:
    acceptees:
    - lived
    fautes_tolerees: 0
  indices:
    relance: Le verbe introducteur « asked » est au passé.
    methode: Comme au discours indirect, le verbe recule d'un temps. Il n'y a plus d'auxiliaire do.
    etape: Le verbe « live » se met au prétérit en ajoutant -ed.
  pieges:
  - si:
      valeur: live
    relance: 'Le verbe introducteur est au passé : le temps doit reculer.'
  solution: Présent simple → prétérit, sans auxiliaire. On écrit « He asked me where I lived ».
- id: relier-avec-so-ou-but
  type: association
  difficulte: 2
  enonce: Associe chaque connecteur à son rôle.
  reponse:
    gauche:
    - id: a
      texte: but
    - id: b
      texte: so
    - id: c
      texte: because
    droite:
    - id: x
      texte: L'opposition
    - id: y
      texte: La conséquence
    - id: z
      texte: La cause
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Deux de ces connecteurs sont souvent confondus, l'un donne la cause, l'autre la conséquence.
    methode: « Because » répond à « pourquoi ? ». « So » veut dire « donc ».
    etape: « But » veut dire « mais ».
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie because et so, qui sont souvent inversés.
  - si:
      diagnostic: associations_fausses
    relance: Commence par « but », qui veut dire « mais ». Puis sépare cause et conséquence.
  solution: but = opposition ; so = conséquence (donc) ; because = cause (parce que).
