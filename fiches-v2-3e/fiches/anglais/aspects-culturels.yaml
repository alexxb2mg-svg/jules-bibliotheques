# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: aspects-culturels
version: 2
etat: verifiee
declencheurs:
- pays anglophones
- fêtes du monde anglophone
- capitale du Royaume-Uni
- éviter les clichés sur l'Angleterre
- capitale de l'Australie
- fête nationale américaine
- stéréotypes sur les Américains
- Union Jack drapeau
prerequis: []
essentiel: 'L''anglais est langue officielle dans de nombreux pays, pas seulement au Royaume-Uni : États-Unis, Canada (avec
  le français), Australie, Irlande, Nouvelle-Zélande…


  Capitales à connaître : Londres (London) pour le Royaume-Uni, Washington, D.C. pour les États-Unis, Ottawa pour le Canada,
  Canberra pour l''Australie, Dublin pour l''Irlande, Wellington pour la Nouvelle-Zélande. La capitale n''est pas toujours
  la plus grande ville : Sydney n''est pas la capitale de l''Australie, New York n''est pas celle des États-Unis.


  Le Royaume-Uni réunit quatre nations : l''Angleterre, l''Écosse, le pays de Galles et l''Irlande du Nord. Dire « England
  » pour tout le pays est une erreur.


  Les fêtes et les symboles racontent l''histoire d''un pays : Thanksgiving aux États-Unis (quatrième jeudi de novembre, repas
  de famille), Independence Day le 4 juillet (fête nationale américaine), Halloween le 31 octobre, Bonfire Night le 5 novembre
  au Royaume-Uni, la Saint-Patrick le 17 mars en Irlande. Le drapeau du Royaume-Uni, l''Union Jack, réunit plusieurs croix.


  Un stéréotype est une idée toute faite sur un groupe (« tous les Anglais boivent du thé à cinq heures »). Pour le dépasser
  : remplace « tous » par « beaucoup » ou « certains », cherche un fait précis et vérifiable, rappelle que chaque pays est
  divers (régions, origines, modes de vie).


  Les références culturelles aident à comprendre un message : Big Ben évoque Londres, la Statue de la Liberté évoque New York,
  l''Opéra de Sydney évoque l''Australie. On s''en sert aussi pour décrire un personnage (Sherlock Holmes, détective qui vit
  à Londres) ou pour raconter.


  Au brevet : situer un pays et sa capitale, repérer une fête ou un symbole, et savoir reconnaître un cliché.

  '
methode:
- Repérer le pays concerné par le document (drapeau, ville, monnaie, fête) avant de lire en détail.
- Associer à chaque pays sa capitale exacte, sans la confondre avec sa plus grande ville.
- 'Pour une fête, retenir trois choses : le nom, la date et la tradition principale.'
- 'Repérer les généralisations (« tous », « toujours ») : ce sont souvent des stéréotypes.'
- Remplacer un cliché par un fait précis et vérifiable (une date, un lieu, un symbole réel).
- Utiliser un repère culturel (ville, monument, fête) pour comprendre un message ou décrire un personnage.
vocabulaire:
- terme: stereotype
  definition: une idée toute faite, souvent fausse ou trop simple, sur un groupe de personnes
- terme: commonwealth
  definition: une association de pays, souvent d'anciennes colonies britanniques, liés au Royaume-Uni
- terme: capital city
  definition: la ville où siègent le gouvernement et le parlement d'un pays
- terme: national holiday
  definition: une fête ou un jour férié célébré dans tout un pays
- terme: flag
  definition: le drapeau, symbole officiel d'un pays
- terme: custom
  definition: une coutume, une habitude propre à une culture
- terme: landmark
  definition: un monument ou un lieu très connu qui fait penser à une ville ou à un pays
erreurs_frequentes:
- Confondre la capitale d'un pays avec sa plus grande ville (par exemple, croire que Sydney est la capitale de l'Australie).
- Croire que tous les habitants d'un pays correspondent à un cliché unique.
- Confondre les monnaies de différents pays anglophones (le dollar américain n'est pas le dollar australien).
- Dire « England » pour parler de tout le Royaume-Uni, qui compte quatre nations.
- Confondre Thanksgiving (novembre) et Noël (25 décembre), ou l'Independence Day américain avec le 14 juillet français.
exemple:
  enonce: Sydney est-elle la capitale de l'Australie ?
  solution: Non. Sydney est la plus grande ville d'Australie, mais la capitale du pays est Canberra. C'est un exemple classique
    de confusion entre grande ville et capitale.
exercices:
- id: capitale-royaume-uni
  type: texte_court
  difficulte: 1
  enonce: Quelle est la capitale du Royaume-Uni ?
  reponse:
    acceptees:
    - london
    - londres
    fautes_tolerees: 1
  indices:
    relance: C'est la ville où se trouve le Parlement britannique et la résidence du monarque.
    methode: Pense à la ville la plus connue du Royaume-Uni, siège du gouvernement.
    etape: Cette ville est traversée par la Tamise ('the Thames').
  pieges:
  - si:
      valeur: manchester
    relance: Manchester est une grande ville britannique, mais ce n'est pas la capitale. Quelle ville abrite le Parlement
      ?
  solution: La capitale du Royaume-Uni est Londres ('London').
- id: capitale-vs-grande-ville
  type: choix
  difficulte: 1
  enonce: Quelle est la capitale de l'Australie ?
  reponse:
    options:
    - id: a
      texte: Canberra
    - id: b
      texte: Sydney
    - id: c
      texte: Melbourne
    bonnes:
    - a
  indices:
    relance: La plus grande ville d'un pays n'est pas toujours sa capitale.
    methode: La capitale australienne est une ville plus petite, choisie spécialement pour ce rôle politique.
    etape: Sydney et Melbourne sont de grandes villes connues, mais aucune n'est la capitale officielle.
  pieges:
  - si:
      contient:
      - b
    relance: Sydney est la ville la plus connue et la plus peuplée d'Australie, mais elle n'est pas la capitale. Cherche une
      autre ville.
  - si:
      contient:
      - c
    relance: Melbourne est une grande ville australienne, mais pas la capitale officielle du pays.
  solution: La capitale de l'Australie est Canberra, et non Sydney ni Melbourne qui sont de plus grandes villes.
- id: pays-anglophones
  type: association
  difficulte: 2
  enonce: Associe chaque pays à sa capitale.
  reponse:
    gauche:
    - id: a
      texte: United States
    - id: b
      texte: Canada
    - id: c
      texte: Ireland
    droite:
    - id: x
      texte: Washington, D.C.
    - id: y
      texte: Ottawa
    - id: z
      texte: Dublin
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Fais attention : la capitale des États-Unis n''est pas la ville la plus connue du pays.'
    methode: Pour chaque pays, cherche la ville où siège le gouvernement, pas forcément la plus grande.
    etape: La capitale des États-Unis porte le nom du premier président du pays.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Vérifie surtout les États-Unis : ce n''est ni New York ni Los Angeles.'
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par un repère sûr : la capitale du Canada n''est ni Toronto ni Montréal, c''est une ville plus petite.'
  solution: 'États-Unis : Washington, D.C. Canada : Ottawa. Irlande : Dublin.'
- id: thanksgiving
  type: choix
  difficulte: 2
  enonce: 'Thanksgiving, fête célébrée aux États-Unis, a lieu chaque année :'
  reponse:
    options:
    - id: a
      texte: Le quatrième jeudi de novembre
    - id: b
      texte: Le 25 décembre
    - id: c
      texte: Le 14 juillet
    bonnes:
    - a
  indices:
    relance: 'Cette fête est différente de Noël : à quel moment de l''année a-t-elle lieu aux États-Unis ?'
    methode: Thanksgiving se situe en automne, avant les fêtes de fin d'année.
    etape: Le jour de la semaine choisi est toujours un jeudi, en novembre.
  pieges:
  - si:
      contient:
      - b
    relance: Le 25 décembre, c'est Noël ('Christmas'), une fête différente. Thanksgiving a lieu plus tôt, en novembre.
  - si:
      contient:
      - c
    relance: Le 14 juillet est une fête nationale française, pas une fête du monde anglophone. Cherche la bonne date de Thanksgiving.
  solution: Thanksgiving a lieu le quatrième jeudi de novembre aux États-Unis, une fête de remerciement à la fin des récoltes.
- id: nblm-comment-la-fiche-recommande-t-elle-d-abo-1
  type: choix
  difficulte: 2
  enonce: Comment la fiche recommande-t-elle d'aborder la culture anglaise pour éviter les clichés figés ?
  reponse:
    options:
    - id: o1
      texte: En cherchant des informations précises (dates, lieux, symboles réels) plutôt que de répéter des généralisations.
    - id: o2
      texte: En supposant que tous les Anglais boivent du thé à cinq heures tous les jours.
    - id: o3
      texte: En imitant l'accent britannique sans étudier les réalités culturelles du pays.
    - id: o4
      texte: En appliquant les habitudes d'une seule ville à l'ensemble de la population.
    bonnes:
    - o1
  indices:
    relance: Pense à l'attitude recommandée face à une idée toute faite.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est un exemple typique de cliché figé cité par la fiche qu'il faut justement éviter.
  - si:
      contient:
      - o3
    relance: L'apprentissage culturel repose sur des connaissances factuelles précises et non sur la seule imitation sonore.
  - si:
      contient:
      - o4
    relance: 'C''est une erreur de généralisation : la fiche rappelle qu''une idée unique ne décrit pas tout un pays.'
  solution: 'En cherchant des informations précises (dates, lieux, symboles réels) plutôt que de répéter des généralisations.
    C''est exact : comprendre une culture nécessite de chercher des faits précis et de dépasser les idées reçues.'
- id: nblm-quelle-est-l-erreur-frequente-a-eviter-c-2
  type: choix
  difficulte: 2
  enonce: Quelle est l'erreur fréquente à éviter concernant la capitale d'un pays anglophone comme l'Australie ?
  reponse:
    options:
    - id: o1
      texte: Confondre la capitale d'un pays avec sa plus grande ville (ex. croire que Sydney est la capitale).
    - id: o2
      texte: Penser que tous les pays anglophones partagent la même capitale administrative.
    - id: o3
      texte: Croire que les pays anglophones n'ont pas de ville capitale officielle.
    - id: o4
      texte: Penser que la capitale change automatiquement à chaque élection.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la distinction entre la taille d'une ville et son statut politique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Chaque pays anglophone possède sa propre capitale distincte et ses propres institutions.
  - si:
      contient:
      - o3
    relance: Tous les pays anglophones disposent d'une capitale officielle bien définie.
  - si:
      contient:
      - o4
    relance: La capitale d'un pays est fixe et déterminée de manière permanente.
  solution: 'Confondre la capitale d''un pays avec sa plus grande ville (ex. croire que Sydney est la capitale). C''est exact
    : la capitale de l''Australie est Canberra, bien que Sydney soit sa plus grande ville.'
- id: nblm-a-quel-moment-est-celebree-la-fete-natio-3
  type: choix
  difficulte: 2
  enonce: À quel moment est célébrée la fête nationale de Thanksgiving aux États-Unis ?
  reponse:
    options:
    - id: o1
      texte: Le quatrième jeudi de novembre.
    - id: o2
      texte: Le deuxième lundi d'octobre.
    - id: o3
      texte: Le premier jour du mois de décembre.
    - id: o4
      texte: Le dernier vendredi du mois de mai.
    bonnes:
    - o1
  indices:
    relance: Se souvenir du jour précis de la semaine et du mois d'automne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Cette date correspond à Thanksgiving au Canada, à ne pas confondre avec la version américaine.
  - si:
      contient:
      - o3
    relance: Thanksgiving a lieu en novembre et non en décembre.
  - si:
      contient:
      - o4
    relance: C'est une date incorrecte qui ne correspond à aucune tradition de Thanksgiving.
  solution: Le quatrième jeudi de novembre. C'est la date exacte de Thanksgiving aux États-Unis mentionnée dans la fiche.
- id: nblm-que-represente-le-drapeau-du-royaume-uni-4
  type: choix
  difficulte: 2
  enonce: Que représente le drapeau du Royaume-Uni appelé Union Jack ?
  reponse:
    options:
    - id: o1
      texte: Un symbole national qui combine plusieurs croix représentant les nations du pays.
    - id: o2
      texte: Le drapeau personnel du souverain britannique utilisé uniquement à Londres.
    - id: o3
      texte: Un symbole représentant l'ensemble des pays du Commonwealth.
    - id: o4
      texte: Le drapeau officiel utilisé aux États-Unis pour les cérémonies d'État.
    bonnes:
    - o1
  indices:
    relance: Observe la composition visuelle de ce drapeau célèbre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: L'Union Jack est le drapeau national de tout le pays, pas un étendard royal privé.
  - si:
      contient:
      - o3
    relance: L'Union Jack est le drapeau du Royaume-Uni ; chaque pays du Commonwealth a son propre drapeau.
  - si:
      contient:
      - o4
    relance: Les États-Unis ont leur propre drapeau national.
  solution: 'Un symbole national qui combine plusieurs croix représentant les nations du pays. C''est exact : l''Union Jack
    associe plusieurs croix représentant les nations du Royaume-Uni.'
- id: nblm-d-apres-le-vocabulaire-de-la-fiche-que-d-5
  type: choix
  difficulte: 2
  enonce: D'après le vocabulaire de la fiche, que désigne exactement le terme « stereotype » ?
  reponse:
    options:
    - id: o1
      texte: Une idée toute faite, souvent fausse ou trop simple, sur un groupe de personnes.
    - id: o2
      texte: Une fête traditionnelle célébrée lors du changement de saison.
    - id: o3
      texte: La monnaie officielle utilisée au Royaume-Uni.
    - id: o4
      texte: Une association de pays d'anciennes colonies britanniques.
    bonnes:
    - o1
  indices:
    relance: Pense au mot français équivalent qui parle d'idées préconçues.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Ce terme ne désigne pas une fête mais un préjugé ou une idée reçue.
  - si:
      contient:
      - o3
    relance: La monnaie du Royaume-Uni est la livre sterling, pas un stereotype.
  - si:
      contient:
      - o4
    relance: Cette association s'appelle le Commonwealth.
  solution: Une idée toute faite, souvent fausse ou trop simple, sur un groupe de personnes. C'est la définition exacte donnée
    dans la fiche pour ce mot anglais.
- id: nblm-quels-pays-parmi-les-suivants-ont-l-angl-6
  type: choix
  difficulte: 3
  enonce: Quels pays parmi les suivants ont l'anglais comme langue officielle d'après la fiche ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'Australie
    - id: o2
      texte: L'Irlande
    - id: o3
      texte: L'Espagne
    - id: o4
      texte: Le Brésil
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux pays anglophones figurant dans la liste officielle de la fiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: L'Espagne est un pays hispanophone dont la langue officielle est l'espagnol.
  - si:
      contient:
      - o4
    relance: Le Brésil est un pays lusophone dont la langue officielle est le portugais.
  solution: L'Australie ; L'Irlande. L'Australie fait bien partie des pays anglophones cités dans la fiche.
- id: nblm-londres-est-la-capitale-du-royaume-uni-m-7
  type: texte_court
  difficulte: 1
  enonce: 'Londres est la capitale du Royaume-Uni, mais pour l''Australie, la ville de Canberra est la :'
  reponse:
    acceptees:
    - capitale
    fautes_tolerees: 1
  indices:
    relance: C'est le mot désignant le siège officiel du gouvernement d'un pays.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'capitale. C''est exact : Canberra est la capitale de l''Australie (et Sydney est sa plus grande ville).'
- id: nblm-comment-s-appelle-l-association-de-pays-8
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle l'association de pays, souvent d'anciennes colonies britanniques, liés au Royaume-Uni ?
  reponse:
    acceptees:
    - Commonwealth
    fautes_tolerees: 1
  indices:
    relance: Trouve le nom anglais de cette organisation cité dans le vocabulaire de la fiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Commonwealth. C''est exact : le Commonwealth regroupe ces pays associés au Royaume-Uni.'
- id: dates-des-fetes
  type: association
  difficulte: 2
  enonce: Associe chaque fête à sa date.
  reponse:
    gauche:
    - id: a
      texte: Independence Day
    - id: b
      texte: Halloween
    - id: c
      texte: St Patrick's Day
    droite:
    - id: x
      texte: Le 4 juillet
    - id: y
      texte: Le 31 octobre
    - id: z
      texte: Le 17 mars
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une de ces fêtes est célébrée en automne, une autre en été, la dernière au début du printemps.
    methode: Independence Day est la fête nationale des États-Unis. Halloween précède la Toussaint.
    etape: La Saint-Patrick est la fête nationale irlandaise, célébrée en mars.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends les deux fêtes dont tu es le plus sûr, puis place la dernière.
  - si:
      diagnostic: associations_fausses
    relance: Commence par la fête qui a lieu juste avant la Toussaint, puis cherche la fête nationale américaine.
  solution: 'Independence Day : 4 juillet. Halloween : 31 octobre. St Patrick''s Day : 17 mars.'
- id: nations-du-royaume-uni
  type: choix
  difficulte: 2
  enonce: Quelles nations font partie du Royaume-Uni ? Choisis toutes les bonnes réponses.
  reponse:
    options:
    - id: a
      texte: L'Angleterre
    - id: b
      texte: Le pays de Galles
    - id: c
      texte: Le Canada
    - id: d
      texte: L'Écosse
    - id: e
      texte: La République d'Irlande
    bonnes:
    - a
    - b
    - d
  indices:
    relance: Le Royaume-Uni compte plus d'une nation, mais moins de cinq.
    methode: Un des pays proposés est en Amérique du Nord, un autre est un État indépendant, voisin du Royaume-Uni.
    etape: La quatrième nation du Royaume-Uni, l'Irlande du Nord, n'est pas proposée. Élimine les deux pays qui ne sont pas
      britanniques.
  pieges:
  - si:
      contient:
      - c
    relance: Le Canada est un pays indépendant d'Amérique du Nord, membre du Commonwealth. Ce n'est pas une nation britannique.
  - si:
      contient:
      - e
    relance: La République d'Irlande est un pays indépendant, différent de l'Irlande du Nord qui, elle, fait partie du Royaume-Uni.
  solution: Le Royaume-Uni réunit l'Angleterre, l'Écosse, le pays de Galles et l'Irlande du Nord. Le Canada et la République
    d'Irlande sont des pays indépendants.
- id: eviter-le-cliche
  type: choix
  difficulte: 2
  enonce: Laquelle de ces phrases évite le stéréotype ?
  reponse:
    options:
    - id: a
      texte: All Americans eat hamburgers every day.
    - id: b
      texte: Many Americans celebrate Thanksgiving with a family meal.
    - id: c
      texte: All British people drink tea at five o'clock.
    bonnes:
    - b
  indices:
    relance: Cherche les mots de généralisation totale comme « all » ou « every ».
    methode: Une phrase sans stéréotype décrit un fait précis et dit « many » ou « some », pas « all ».
    etape: Deux phrases parlent de tout un peuple sans nuance. L'autre parle d'une fête réelle et de ce que font beaucoup
      de gens.
  pieges:
  - si:
      contient:
      - a
    relance: « All Americans… every day » généralise à tout un peuple. Est-ce un fait précis ?
  - si:
      contient:
      - c
    relance: « All British people… » applique une habitude à tout un pays. C'est un cliché.
  solution: La phrase B parle d'un fait précis et nuancé (« many »). Les phrases A et C généralisent avec « all », ce sont
    des stéréotypes.
- id: decrire-un-personnage
  type: ouverte
  difficulte: 3
  enonce: En anglais, écris trois phrases pour décrire un personnage réel ou imaginaire du monde anglophone (ville, pays,
    activité) en utilisant au moins un repère culturel.
  criteres:
  - Les trois phrases sont écrites en anglais, avec un sujet et un verbe conjugué.
  - Le personnage est situé grâce à un repère culturel exact (ville, pays, monument, fête ou symbole).
  - La description évite les stéréotypes (pas de « all » ni de généralisation).
  indices:
    relance: Qui est ton personnage, et dans quel pays ou quelle ville vit-il ?
    methode: Phrase 1, le nom et le lieu. Phrase 2, ce qu'il fait. Phrase 3, un détail culturel précis (fête, monument, habitude).
    etape: Tu peux commencer par « Sherlock Holmes is a detective. » puis ajouter où il vit.
  solution: 'Exemple possible : « Sherlock Holmes is a detective. He lives in London, in Baker Street. He often takes a train
    to visit the countryside. »'
sources:
- titre: Programme du cycle 4 (annexe 3) — partie « Langues vivantes (étrangères ou régionales) » — BO n° 31 du 30 juillet
