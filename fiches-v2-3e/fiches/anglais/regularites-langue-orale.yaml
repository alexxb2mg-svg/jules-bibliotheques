    - id: o1
      texte: Des mots qui se prononcent de la même façon mais s'écrivent différemment et ont des sens différents.
    - id: o2
      texte: Des mots qui s'écrivent de la même manière mais n'ont pas du tout la même prononciation.
    - id: o3
      texte: Des mots qui ont exactement le même sens mais des prononciations complètement différentes.
    - id: o4
      texte: Des verbes qui prennent tous la terminaison /id/ lorsqu'ils sont au prétérit.
    bonnes:
    - o1
  indices:
    relance: Pense au préfixe 'homo-' (même) et au radical '-phone' (son).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion fréquente : cela ne correspond pas à des homophones (qui ont le même son).'
  - si:
      contient:
      - o3
    relance: 'Erreur : cela correspond à la définition de mots synonymes.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : cela concerne la terminaison régulière du prétérit, pas la notion d''homophonie.'
  solution: 'Des mots qui se prononcent de la même façon mais s''écrivent différemment et ont des sens différents. C''est
    exact : comme ''their'', ''there'' et ''they''re'', ils partagent la même prononciation mais pas l''orthographe ni le
    sens.'
