    - id: o2
      texte: La lettre 'n'.
    - id: o3
      texte: La lettre 'o'.
    - id: o4
      texte: La lettre 'w'.
    bonnes:
    - o1
  indices:
    relance: Cherche la consonne au début du mot qui ne s'entend pas du tout à l'oral.
