# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: regularites-langue-orale
version: 2
etat: verifiee
declencheurs:
- prononcer le -ed en anglais
- prononcer le -s final en anglais
- accent tonique mot anglais
- lettres muettes en anglais
- homophones en anglais
- anglais britannique américain
- intonation en anglais
- syllabe accentuée anglais
- prononciation du s pluriel
prerequis:
- groupe-verbal
essentiel: 'En anglais, l''écriture et la prononciation ne se correspondent pas toujours. Mais il existe des régularités :
  des règles qui reviennent et qui aident à bien prononcer.


  La terminaison « -ed » des verbes réguliers au prétérit se dit de trois façons, selon le dernier son du verbe. Après un
  son sourd (p, k, ch, sh, f, s) : /t/ (watched, looked, jumped). Après un son sonore ou une voyelle : /d/ (played, cleaned).
  Après « t » ou « d » : /id/, avec une syllabe en plus (wanted, needed).


  Le « -s » final suit la même logique. Après un son sourd : /s/ (cats, books). Après un son sonore ou une voyelle : /z/ (dogs,
  plays). Après un son sifflant (s, sh, ch, ge) : /iz/, avec une syllabe en plus (buses, watches, changes). Cela vaut pour
  le pluriel des noms et pour la 3e personne du présent.


  L''accent de mot est la syllabe dite plus fort. En anglais, les voyelles non accentuées sont souvent affaiblies. Déplacer
  l''accent peut changer la nature du mot : PREsent (nom, le cadeau) et preSENT (verbe, présenter) ; de même REcord (nom)
  et reCORD (verbe).


  L''intonation aussi suit des tendances : la voix monte souvent à la fin d''une question fermée (Do you like tea ?) et descend
  à la fin d''une phrase affirmative.


  Certaines lettres sont muettes : le « h » de hour, le « k » de know, le « b » de comb, le « w » de write. Des homophones
  se prononcent pareil mais s''écrivent différemment : their / there / they''re, to / two / too, write / right.


  Enfin, une même langue varie selon les pays et les régions. L''anglais britannique et l''anglais américain ne se prononcent
  pas pareil (par exemple le « r » de car s''entend en anglais américain, pas en anglais britannique standard). Ces variations
  ne sont pas des fautes : il faut savoir les repérer et comprendre les deux.


  Au brevet, on attend que tu saches choisir la bonne prononciation d''un -ed ou d''un -s, repérer un accent de mot, une lettre
  muette ou un homophone, et que tu saches dire que deux accents peuvent être corrects.

  '
methode:
- 'Pour le -ed : isole le dernier son du verbe (pas la dernière lettre) et décide s''il est sourd, sonore ou un t/d.'
- 'Sourd → /t/. Sonore ou voyelle → /d/. « t » ou « d » → /id/ : c''est le seul cas où le mot gagne une syllabe.'
- 'Pour le -s : même démarche, avec un troisième cas, le son sifflant qui donne /iz/.'
- 'Pour l''accent de mot : compte les syllabes, écoute celle qui est dite plus fort, et vérifie si le mot est un nom ou un
  verbe.'
- 'Pour un homophone : lis toute la phrase et choisis l''orthographe d''après le sens (possession, lieu, verbe).'
- 'Pour une variation : compare avec un exemple entendu (britannique, américain) et retiens que les deux sont corrects.'
vocabulaire:
- terme: silent letter
  definition: une lettre muette, qui s'écrit mais ne se prononce pas
- terme: homophone
  definition: un mot qui se prononce comme un autre mais qui s'écrit différemment et a un sens différent
- terme: word stress
  definition: l'accent de mot, la syllabe prononcée plus fort dans un mot
- terme: son sourd
  definition: un son produit sans vibration de la gorge (p, k, f, s, ch, sh, t)
- terme: son sonore
  definition: un son produit avec vibration de la gorge (b, d, g, v, z, m, n et les voyelles)
- terme: intonation
  definition: la mélodie de la voix, qui monte ou descend sur la phrase
- terme: accent
  definition: une façon de prononcer une langue selon le pays ou la région (britannique, américain...)
erreurs_frequentes:
- 'Croire que « -ed » se dit toujours /id/ : ce n''est le cas qu''après « t » ou « d ».'
- 'Se fier à la dernière lettre plutôt qu''au dernier son : « watch » finit par la lettre h mais par un son sourd.'
- 'Dire « the buses » avec un simple /s/ : après un son sifflant, le -s ajoute une syllabe.'
- 'Penser qu''un seul accent (britannique ou américain) est le bon : les deux sont corrects.'
exemple:
  enonce: Comment se prononce le "-ed" du verbe "watched" ?
  solution: '"Watched" se prononce avec un /t/ final, car "watch" se termine par un son sourd.'
exercices:
- id: prononciation-ed-watched
  type: choix
  difficulte: 1
  enonce: Comment se prononce le "-ed" de "watched" ?
  reponse:
    options:
    - id: a
      texte: /t/
    - id: b
      texte: /d/
    - id: c
      texte: /id/
    bonnes:
    - a
  indices:
    relance: Le son juste avant "-ed" dans "watch" est-il sourd ou sonore ?
    methode: Un son sourd a la fin d'un verbe donne une prononciation courte et sourde du -ed.
    etape: 'Prononce "watch" seul et ecoute son tout dernier son : n''ajoute une syllabe supplementaire que si ce son ressemble
      deja au son du verbe a l''infinitif final.'
  pieges:
  - si:
      contient:
      - c
    relance: 'Cette syllabe supplementaire ne s''ajoute que pour certains verbes precis : "watch" n''en fait pas partie.'
  solution: Le "-ed" de "watched" se prononce /t/, car "watch" se termine par un son sourd.
- id: prononciation-ed-wanted
  type: choix
  difficulte: 1
  enonce: Comment se prononce le "-ed" de "wanted" ?
  reponse:
    options:
    - id: a
      texte: /t/
    - id: b
      texte: /d/
    - id: c
      texte: /id/
    bonnes:
    - c
  indices:
    relance: Le verbe "want" se termine deja par quel son ?
    methode: Quand le verbe se termine deja par un son proche de "t" ou "d", le -ed cree une syllabe supplementaire a la prononciation.
    etape: '"Want" se termine par un "t" : cela ajoute une syllabe supplementaire a la prononciation du -ed.'
  pieges:
  - si:
      contient:
      - a
    relance: Quand le verbe se termine deja par un "t", le -ed cree une syllabe supplementaire plutot qu'un simple son court.
  solution: Le "-ed" de "wanted" se prononce /id/, car "want" se termine deja par un son "t".
- id: accent-mot-present
  type: association
  difficulte: 2
  enonce: Associe chaque mot a son role grammatical selon la place de l'accent tonique.
  reponse:
    gauche:
    - id: a
      texte: PREsent (accent sur la premiere syllabe)
    - id: b
      texte: preSENT (accent sur la deuxieme syllabe)
    droite:
    - id: x
      texte: Nom, le cadeau
    - id: y
      texte: Verbe, presenter
    paires:
      a: x
      b: y
  indices:
    relance: En anglais, ou se place souvent l'accent d'un nom, par rapport a un verbe de meme orthographe ?
    methode: Les noms sont souvent accentues sur la premiere syllabe, les verbes sur la deuxieme.
    etape: '"PREsent" (accent au debut) correspond au nom, "preSENT" (accent a la fin) correspond au verbe.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Reflechis a la regle generale, plutot rare mais utile, qui distingue les noms et les verbes homographes en anglais.
  solution: '"PREsent" (accent au debut) est le nom, le cadeau ; "preSENT" (accent a la fin) est le verbe, presenter.'
- id: lettre-muette-hour
  type: choix
  difficulte: 2
  enonce: Quelle lettre est muette dans le mot "hour" ?
  reponse:
    options:
    - id: a
      texte: h
    - id: b
      texte: o
    - id: c
      texte: u
    - id: d
      texte: r
    bonnes:
    - a
  indices:
    relance: 'Le mot "hour" se prononce presque comme le mot "our" : quelle lettre ne s''entend pas ?'
    methode: 'Compare la prononciation de "hour" et de "our" : une lettre en plus a l''ecrit ne s''entend pas.'
    etape: La lettre qui commence le mot a l'ecrit ne se prononce pas.
  pieges:
  - si:
      contient:
      - b
    relance: 'Le "o" de "hour" se prononce bien : ce n''est pas la lettre muette.'
  solution: 'Le "h" de "hour" est muet : le mot se prononce comme "our".'
- id: choix-homophone-there
  type: choix
  difficulte: 2
  enonce: 'Complete : « ___ house is very big. » (leur maison)'
  reponse:
    options:
    - id: a
      texte: Their
    - id: b
      texte: There
    - id: c
      texte: They're
    bonnes:
    - a
  indices:
    relance: Ces trois mots se prononcent de la meme facon mais ont un sens different. Lequel exprime la possession (leur)
      ?
    methode: Un de ces trois mots exprime la possession, un autre indique un lieu, le dernier est une contraction de "they
      are".
    etape: 'Ici, on parle de la maison qui appartient a des personnes : c''est donc la possession.'
  pieges:
  - si:
      contient:
      - b
    relance: '"There" indique un lieu (la-bas), pas une possession. Ici, il s''agit de "leur maison".'
  - si:
      contient:
      - c
    relance: '"They''re" est la contraction de "they are" (ils sont), ce qui ne convient pas ici.'
  solution: On ecrit « Their house is very big. », car "their" exprime la possession (leur maison).
- id: association-s-final
  type: association
  difficulte: 2
  enonce: Relie chaque mot à la prononciation de son « -s » final.
  reponse:
    gauche:
    - id: a
      texte: cats
    - id: b
      texte: dogs
    - id: c
      texte: watches
    droite:
    - id: x
      texte: /s/
    - id: y
      texte: /z/
    - id: z
      texte: /iz/
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Regarde le dernier son du mot avant le -s : est-il sourd, sonore ou sifflant ?'
    methode: 'Sourd, sonore ou sifflant : chaque type de son donne une prononciation différente du -s.'
    etape: Le mot « cats » se termine par le son « t », un son sourd. Place-le d'abord, puis passe aux deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque mot et demande-toi si son dernier son est sourd, sonore ou
      sifflant.
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par le mot qui se termine par un son sifflant : c''est le seul où la prononciation gagne une syllabe.'
  solution: 'cats : /s/ (après le son sourd t). dogs : /z/ (après le son sonore g). watches : /iz/ (après le son sifflant
    ch, avec une syllabe en plus).'
- id: variations-accents
  type: choix
  difficulte: 2
  enonce: Quelle affirmation sur les accents de l'anglais est juste ?
  reponse:
    options:
    - id: a
      texte: Les accents britannique et américain diffèrent, mais les deux sont corrects
    - id: b
      texte: Seul l'accent britannique est correct
    - id: c
      texte: Seul l'accent américain est correct
    - id: d
      texte: Un mot anglais n'a qu'une seule prononciation dans le monde
    bonnes:
    - a
  indices:
    relance: 'Pense aux pays où l''on parle anglais : parle-t-on partout exactement de la même façon ?'
    methode: Une langue vivante varie selon les régions et les pays, sans qu'aucune variante soit une faute.
    etape: Écarte les réponses qui disent qu'un seul accent est le bon ou qu'un mot n'a qu'une prononciation.
  pieges:
  - si:
      contient:
      - b
    relance: 'Aucun accent n''est « le bon » seul : les Britanniques ne se trompent pas plus que les autres.'
  - si:
      contient:
      - c
    relance: L'accent américain est très répandu, mais il n'est pas le seul correct.
  - si:
      contient:
      - d
    relance: Un même mot se dit parfois différemment selon le pays ou la région. Est-ce une faute ?
  solution: 'Les accents britannique et américain diffèrent, mais les deux sont corrects : ce sont des variations d''une même
    langue.'
- id: expliquer-prononciations-ed
  type: ouverte
  difficulte: 3
  enonce: Explique comment se prononce le « -ed » de looked, stayed et needed. Justifie chaque réponse par le dernier son
    du verbe.
  criteres:
  - L'élève donne la bonne prononciation pour les trois verbes (/t/, /d/, /id/).
  - L'élève justifie chaque réponse par le dernier son du verbe (sourd, voyelle ou sonore, t/d).
  - L'élève précise que seul le cas /id/ ajoute une syllabe.
  indices:
    relance: Quel est le dernier son de chaque verbe avant d'ajouter la terminaison ?
    methode: 'Pour chaque verbe : dis le dernier son, dis s''il est sourd, sonore ou t/d, puis donne la prononciation.'
    etape: 'Tu peux commencer ainsi : « Look finit par un son sourd, donc... », puis fais de même pour les deux autres.'
  solution: 'Exemple : look finit par un son sourd, donc looked se dit avec un /t/. Stay finit par une voyelle, donc stayed
    se dit avec un /d/. Need finit par un d, donc needed se dit /id/, avec une syllabe en plus.'
