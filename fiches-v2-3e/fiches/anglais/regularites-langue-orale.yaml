# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: regularites-langue-orale
version: 1
etat: verifiee
declencheurs:
- prononcer le -ed en anglais
- prononcer le -s final en anglais
- accent tonique mot anglais
- lettres muettes en anglais
- homophones en anglais
prerequis:
- groupe-verbal
couverture: Traite la prononciation du -ed (/t/, /d/, /id/), du -s final, l'accent de mot et quelques lettres muettes et homophones
  courants. Ne couvre pas l'alphabet phonetique international complet ni les accents regionaux detailles.
essentiel: 'La terminaison « -ed » des verbes reguliers au preterit se prononce de trois facons

  differentes selon le son qui precede : /t/ apres un son sourd (watched), /d/ apres

  un son sonore ou une voyelle (played), et /id/ apres un son « t » ou « d » (wanted,

  needed).


  Le « -s » final (pluriel des noms, troisieme personne du singulier) se prononce

  aussi de plusieurs facons : /s/ apres un son sourd (cats), /z/ apres un son sonore

  ou une voyelle (dogs, plays), et /iz/ apres un son sifflant comme « s », « sh »,

  « ch » (buses, watches).


  L''accent de mot est tres important en anglais : deplacer l''accent peut changer

  le sens d''un mot. Par exemple, « PREsent » (nom, le cadeau) et « preSENT » (verbe,

  presenter) ont le meme orthographe mais un accent different.


  Certaines lettres sont muettes en anglais : le « h » de « hour », le « k » de «

  know », le « b » de « comb ». Des mots differents peuvent aussi se prononcer de

  la meme facon : ce sont des homophones, comme « their », « there » et « they''re

  ».

  '
methode:
- 'Pour choisir la prononciation du -ed, ecoute le dernier son du verbe avant d''ajouter -ed : sourd -> /t/, sonore/voyelle
  -> /d/, t ou d -> /id/.'
- 'Pour le -s final, applique la meme logique : sourd -> /s/, sonore/voyelle -> /z/, son sifflant -> /iz/.'
- Pour l'accent de mot, verifie si le mot est un nom (souvent accentue sur la premiere syllabe) ou un verbe (souvent accentue
  sur la deuxieme).
- Pour un homophone, appuie-toi sur le contexte de la phrase pour choisir l'orthographe correcte.
vocabulaire:
- terme: silent letter
  definition: une lettre muette, qui ne se prononce pas
- terme: homophone
  definition: un mot qui se prononce comme un autre mais qui s'ecrit differemment et a un sens different
- terme: word stress
  definition: l'accent de mot, la syllabe prononcee plus fort dans un mot
erreurs_frequentes:
- Prononcer systematiquement « -ed » comme /id/, alors que ce son n'existe qu'apres un « t » ou un « d ».
- Prononcer le « k » de « know » ou le « h » de « hour », qui sont des lettres muettes.
- Confondre « their » (leur), « there » (la-bas) et « they're » (ils sont), qui se prononcent de la meme facon.
exemple:
  enonce: Comment se prononce le "-ed" du verbe "watched" ?
  solution: '"Watched" se prononce avec un /t/ final, car "watch" se termine par un son sourd.'
exercices:
- id: prononciation-ed-watched
  type: choix
  difficulte: 1
  enonce: Comment se prononce le "-ed" de "watched" ?
  reponse:
    options:
    - id: a
      texte: /t/
    - id: b
      texte: /d/
    - id: c
      texte: /id/
    bonnes:
    - a
  indices:
    relance: Le son juste avant "-ed" dans "watch" est-il sourd ou sonore ?
    methode: Un son sourd a la fin d'un verbe donne une prononciation courte et sourde du -ed.
    etape: 'Prononce "watch" seul et ecoute son tout dernier son : n''ajoute une syllabe supplementaire que si ce son ressemble
      deja au son du verbe a l''infinitif final.'
  pieges:
  - si:
      contient:
      - c
    relance: 'Cette syllabe supplementaire ne s''ajoute que pour certains verbes precis : "watch" n''en fait pas partie.'
  solution: Le "-ed" de "watched" se prononce /t/, car "watch" se termine par un son sourd.
- id: prononciation-ed-wanted
  type: choix
  difficulte: 1
  enonce: Comment se prononce le "-ed" de "wanted" ?
  reponse:
    options:
    - id: a
      texte: /t/
    - id: b
      texte: /d/
    - id: c
      texte: /id/
    bonnes:
    - c
  indices:
    relance: Le verbe "want" se termine deja par quel son ?
    methode: Quand le verbe se termine deja par un son proche de "t" ou "d", le -ed cree une syllabe supplementaire a la prononciation.
    etape: '"Want" se termine par un "t" : cela ajoute une syllabe supplementaire a la prononciation du -ed.'
  pieges:
  - si:
      contient:
      - a
    relance: Quand le verbe se termine deja par un "t", le -ed cree une syllabe supplementaire plutot qu'un simple son court.
  solution: Le "-ed" de "wanted" se prononce /id/, car "want" se termine deja par un son "t".
- id: accent-mot-present
  type: association
  difficulte: 2
  enonce: Associe chaque mot a son role grammatical selon la place de l'accent tonique.
  reponse:
    gauche:
    - id: a
      texte: PREsent (accent sur la premiere syllabe)
    - id: b
      texte: preSENT (accent sur la deuxieme syllabe)
    droite:
    - id: x
      texte: Nom, le cadeau
    - id: y
      texte: Verbe, presenter
    paires:
      a: x
      b: y
  indices:
    relance: En anglais, ou se place souvent l'accent d'un nom, par rapport a un verbe de meme orthographe ?
    methode: Les noms sont souvent accentues sur la premiere syllabe, les verbes sur la deuxieme.
    etape: '"PREsent" (accent au debut) correspond au nom, "preSENT" (accent a la fin) correspond au verbe.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Reflechis a la regle generale, plutot rare mais utile, qui distingue les noms et les verbes homographes en anglais.
  solution: '"PREsent" (accent au debut) est le nom, le cadeau ; "preSENT" (accent a la fin) est le verbe, presenter.'
- id: lettre-muette-hour
  type: choix
  difficulte: 2
  enonce: Quelle lettre est muette dans le mot "hour" ?
  reponse:
    options:
    - id: a
      texte: h
    - id: b
      texte: o
    - id: c
      texte: u
    - id: d
      texte: r
    bonnes:
    - a
  indices:
    relance: 'Le mot "hour" se prononce presque comme le mot "our" : quelle lettre ne s''entend pas ?'
    methode: 'Compare la prononciation de "hour" et de "our" : une lettre en plus a l''ecrit ne s''entend pas.'
    etape: La lettre qui commence le mot a l'ecrit ne se prononce pas.
  pieges:
  - si:
      contient:
      - b
    relance: 'Le "o" de "hour" se prononce bien : ce n''est pas la lettre muette.'
  solution: 'Le "h" de "hour" est muet : le mot se prononce comme "our".'
- id: choix-homophone-there
  type: choix
  difficulte: 2
  enonce: 'Complete : « ___ house is very big. » (leur maison)'
  reponse:
    options:
    - id: a
      texte: Their
    - id: b
      texte: There
    - id: c
      texte: They're
    bonnes:
    - a
  indices:
    relance: Ces trois mots se prononcent de la meme facon mais ont un sens different. Lequel exprime la possession (leur)
      ?
    methode: Un de ces trois mots exprime la possession, un autre indique un lieu, le dernier est une contraction de "they
      are".
    etape: 'Ici, on parle de la maison qui appartient a des personnes : c''est donc la possession.'
  pieges:
  - si:
      contient:
      - b
    relance: '"There" indique un lieu (la-bas), pas une possession. Ici, il s''agit de "leur maison".'
  - si:
      contient:
      - c
    relance: '"They''re" est la contraction de "they are" (ils sont), ce qui ne convient pas ici.'
  solution: On ecrit « Their house is very big. », car "their" exprime la possession (leur maison).
- id: nblm-comment-se-prononce-la-terminaison-ed-du-1
  type: choix
  difficulte: 2
  enonce: Comment se prononce la terminaison « -ed » du verbe « wanted » ?
  reponse:
    options:
    - id: o1
      texte: /id/
    - id: o2
      texte: /t/
    - id: o3
      texte: /d/
    - id: o4
      texte: /ed/
    bonnes:
    - o1
  indices:
    relance: Pense au dernier son du verbe de base 'want' avant d'ajouter la terminaison.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : la prononciation /t/ s''applique après un son sourd (comme dans ''watched''),
      mais pas après le son ''t''.'
  - si:
      contient:
      - o3
    relance: 'Attention : le son /d/ est utilisé après un son sonore ou une voyelle (comme dans ''played''), pas après un
      son ''t''.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la terminaison « -ed » ne se lit jamais comme le mot français ''ed''.'
  solution: '/id/. C''est exact : la terminaison « -ed » se prononce /id/ uniquement lorsque le verbe de base se termine par
    le son ''t'' ou ''d''.'
- id: nblm-dans-quel-cas-le-s-final-du-pluriel-ou-d-2
  type: choix
  difficulte: 2
  enonce: Dans quel cas le « -s » final (du pluriel ou de la 3e personne) se prononce-t-il /iz/ ?
  reponse:
    options:
    - id: o1
      texte: Après un son sifflant comme 's', 'sh' ou 'ch'.
    - id: o2
      texte: Après n'importe quel son sonore ou voyelle.
    - id: o3
      texte: Après un son sourd comme 'p', 'k' ou 't'.
    - id: o4
      texte: Systématiquement pour tous les mots au pluriel.
    bonnes:
    - o1
  indices:
    relance: Observe ce qui se passe quand le mot se termine déjà par un son proche de 's' ou 'ch'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : après un son sonore ou une voyelle, le ''-s'' se prononce /z/ (ex. dogs).'
  - si:
      contient:
      - o3
    relance: 'Attention : après un son sourd, le ''-s'' se prononce /s/ (ex. cats).'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la prononciation du ''-s'' varie (/s/, /z/ ou /iz/) selon le dernier son du mot.'
  solution: 'Après un son sifflant comme ''s'', ''sh'' ou ''ch''. C''est exact : après un son sifflant, on ajoute la syllabe
    /iz/ (ex. buses, watches).'
- id: nblm-comment-l-emplacement-de-l-accent-toniqu-3
  type: choix
  difficulte: 2
  enonce: Comment l'emplacement de l'accent tonique modifie-t-il la nature du mot « present » ?
  reponse:
    options:
    - id: o1
      texte: Accentué sur la 1re syllabe ('PREsent'), c'est un nom ; accentué sur la 2e ('preSENT'), c'est un verbe.
    - id: o2
      texte: Accentué sur la 1re syllabe, c'est un verbe ; accentué sur la 2e, c'est un nom.
    - id: o3
      texte: L'accent tonique ne change jamais la catégorie d'un mot en anglais.
    - id: o4
      texte: Accentué sur la 2e syllabe, le mot devient obligatoirement un adjectif pluriel.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la règle générale concernant l'accentuation des noms et des verbes à deux syllabes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique d''inversion : en anglais, la première syllabe est souvent accentuée pour un nom, et la deuxième
      pour un verbe.'
  - si:
      contient:
      - o3
    relance: 'Attention : en anglais, la place de l''accent de mot est essentielle et peut modifier la nature grammaticale
      d''un mot.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : la variation d''accentuation entre la 1re et la 2e syllabe distingue ici le nom du verbe.'
  solution: 'Accentué sur la 1re syllabe (''PREsent''), c''est un nom ; accentué sur la 2e (''preSENT''), c''est un verbe.
    C''est exact : déplacer l''accent tonique sur la seconde syllabe transforme ce mot d''un nom (un cadeau) en un verbe (présenter).'
- id: nblm-quelle-lettre-est-une-lettre-muette-sile-4
  type: choix
  difficulte: 2
  enonce: Quelle lettre est une lettre muette (« silent letter ») dans le mot « know » ?
  reponse:
    options:
    - id: o1
      texte: La lettre 'k'.
    - id: o2
      texte: La lettre 'n'.
    - id: o3
      texte: La lettre 'o'.
    - id: o4
      texte: La lettre 'w'.
    bonnes:
    - o1
  indices:
    relance: Cherche la consonne au début du mot qui ne s'entend pas du tout à l'oral.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la lettre ''n'' est bien prononcée, c''est le ''k'' initial qui est muet.'
  - si:
      contient:
      - o3
    relance: 'Attention : la voyelle ''o'' participe au son voyelle prononcé dans le mot.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : le ''w'' s''associe à la voyelle, mais c''est la consonne ''k'' en début de mot qui est muette.'
  solution: 'La lettre ''k''. C''est exact : le ''k'' initial placé devant le ''n'' est muet dans le mot ''know''.'
- id: nblm-quelle-est-la-definition-exacte-des-mots-5
  type: choix
  difficulte: 2
  enonce: Quelle est la définition exacte des mots « homophones » en anglais ?
  reponse:
    options:
    - id: o1
      texte: Des mots qui se prononcent de la même façon mais s'écrivent différemment et ont des sens différents.
    - id: o2
      texte: Des mots qui s'écrivent de la même manière mais n'ont pas du tout la même prononciation.
    - id: o3
      texte: Des mots qui ont exactement le même sens mais des prononciations complètement différentes.
    - id: o4
      texte: Des verbes qui prennent tous la terminaison /id/ lorsqu'ils sont au prétérit.
    bonnes:
    - o1
  indices:
    relance: Pense au préfixe 'homo-' (même) et au radical '-phone' (son).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion fréquente : cela ne correspond pas à des homophones (qui ont le même son).'
  - si:
      contient:
      - o3
    relance: 'Erreur : cela correspond à la définition de mots synonymes.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : cela concerne la terminaison régulière du prétérit, pas la notion d''homophonie.'
  solution: 'Des mots qui se prononcent de la même façon mais s''écrivent différemment et ont des sens différents. C''est
    exact : comme ''their'', ''there'' et ''they''re'', ils partagent la même prononciation mais pas l''orthographe ni le
    sens.'
- id: nblm-quelles-sont-les-deux-erreurs-frequentes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX erreurs fréquentes commises à l'oral selon la fiche « régularités de la langue orale » ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Prononcer systématiquement « -ed » comme /id/ pour tous les verbes au prétérit.
    - id: o2
      texte: Prononcer le 'k' de 'know' ou le 'h' de 'hour'.
    - id: o3
      texte: Confondre l'accentuation des mots d'une seule syllabe.
    - id: o4
      texte: Utiliser une intonation descendante sur les questions fermées.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux pièges liés à la prononciation du '-ed' et aux lettres muettes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur de raisonnement : les mots d''une seule syllabe n''ont pas de déplacement d''accent entre plusieurs syllabes.'
  - si:
      contient:
      - o4
    relance: 'Hors sujet : cette fiche traite de la prononciation des terminaisons, accents de mots, lettres muettes et homophones.'
  solution: 'Prononcer systématiquement « -ed » comme /id/ pour tous les verbes au prétérit ; Prononcer le ''k'' de ''know''
    ou le ''h'' de ''hour''. C''est exact : le son /id/ n''existe qu''après ''t'' ou ''d'', le prononcer partout est une erreur
    fréquente.'
- id: nblm-comment-se-prononce-la-terminaison-ed-a-7
  type: texte_court
  difficulte: 1
  enonce: Comment se prononce la terminaison « -ed » à la fin du verbe « watched » ?
  reponse:
    acceptees:
    - /t/
    fautes_tolerees: 1
  indices:
    relance: Réfléchis au dernier son du verbe 'watch' (son sourd).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: '/t/. C''est exact : ''watched'' se prononce avec un /t/ final car ''watch'' se termine par un son sourd.'
- id: nblm-quel-est-le-terme-anglais-designant-l-ac-8
  type: texte_court
  difficulte: 1
  enonce: Quel est le terme anglais désignant l'accent de mot, c'est-à-dire la syllabe prononcée plus fort ?
  reponse:
    acceptees:
    - word stress
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'une expression anglaise de deux mots contenant le mot 'stress'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'word stress. C''est exact : ''word stress'' est le terme anglais désignant l''accent de mot.'
