- id: association-s-final
  type: association
  difficulte: 2
  enonce: Relie chaque mot à la prononciation de son « -s » final.
  reponse:
    gauche:
    - id: a
      texte: cats
    - id: b
      texte: dogs
    - id: c
      texte: watches
    droite:
    - id: x
      texte: /s/
    - id: y
      texte: /z/
    - id: z
      texte: /iz/
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Regarde le dernier son du mot avant le -s : est-il sourd, sonore ou sifflant ?'
    methode: 'Sourd, sonore ou sifflant : chaque type de son donne une prononciation différente du -s.'
    etape: Le mot « cats » se termine par le son « t », un son sourd. Place-le d'abord, puis passe aux deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
