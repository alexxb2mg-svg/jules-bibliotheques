  - si:
      contient:
      - d
    relance: Un même mot se dit parfois différemment selon le pays ou la région. Est-ce une faute ?
  solution: 'Les accents britannique et américain diffèrent, mais les deux sont corrects : ce sont des variations d''une même
    langue.'
- id: expliquer-prononciations-ed
  type: ouverte
  difficulte: 3
  enonce: Explique comment se prononce le « -ed » de looked, stayed et needed. Justifie chaque réponse par le dernier son
    du verbe.
  criteres:
  - L'élève donne la bonne prononciation pour les trois verbes (/t/, /d/, /id/).
  - L'élève justifie chaque réponse par le dernier son du verbe (sourd, voyelle ou sonore, t/d).
  - L'élève précise que seul le cas /id/ ajoute une syllabe.
  indices:
    relance: Quel est le dernier son de chaque verbe avant d'ajouter la terminaison ?
    methode: 'Pour chaque verbe : dis le dernier son, dis s''il est sourd, sonore ou t/d, puis donne la prononciation.'
    etape: 'Tu peux commencer ainsi : « Look finit par un son sourd, donc... », puis fais de même pour les deux autres.'
  solution: 'Exemple : look finit par un son sourd, donc looked se dit avec un /t/. Stay finit par une voyelle, donc stayed
    se dit avec un /d/. Need finit par un d, donc needed se dit /id/, avec une syllabe en plus.'
