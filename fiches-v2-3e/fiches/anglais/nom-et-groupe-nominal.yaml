# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: nom-et-groupe-nominal
version: 3
etat: verifiee
declencheurs:
- pluriel irregulier en anglais
- genitif en 's en anglais
- pronom reflechi en anglais
- pronom complement en anglais
- his her its difference
- him ou her en anglais
- himself herself themselves
- the children's toys
- he she it pronom
prerequis: []
essentiel: 'En anglais, les noms n''ont pas de genre grammatical comme en français. « The table » n''est ni masculin ni féminin,
  et « the » ne change jamais.


  Le genre se voit seulement dans certains pronoms et déterminants. Pour une personne : he / him / his (masculin) et she /
  her / her (féminin). Pour un objet, une idée ou souvent un animal : it. Certains noms désignent un homme ou une femme par
  leur sens : actor / actress, waiter / waitress, brother / sister.


  Les pronoms personnels sujets sont : I, you, he, she, it, we, you, they. Les pronoms compléments (après un verbe ou une
  préposition) sont : me, you, him, her, it, us, you, them. Ils remplacent un nom complément : « I see Tom » devient « I see
  him ». Après une préposition : « I talk to them ».


  Attention : « her » est à la fois pronom complément (I know her) et déterminant possessif (her book). Le contexte décide.


  Les pronoms réfléchis se terminent par « -self » au singulier et « -selves » au pluriel : myself, yourself, himself, herself,
  itself, ourselves, yourselves, themselves. On les utilise quand le sujet et le complément sont la même personne : « She
  hurt herself. » (Elle s''est fait mal.) Si ce sont deux personnes différentes, on utilise un pronom complément : « She hurt
  him. »


  Le nom se met au pluriel avec « -s » (a book → books), « -es » après s, sh, ch, x (a box → boxes). Certains pluriels sont
  irréguliers : man → men, woman → women, child → children, foot → feet, mouse → mice.


  La possession se marque par le génitif : « ''s » après un nom singulier (Tom''s dog), seulement l''apostrophe après un pluriel
  en -s (my parents'' house), et « ''s » après un pluriel irrégulier (the children''s toys).


  Au brevet, on attend que tu choisisses le bon pronom (sujet, complément ou réfléchi), que tu accordes un nom au pluriel
  et que tu construises un génitif simple.

  '
methode:
- 'Repère la fonction du mot à remplacer : sujet (I, he, they...) ou complément (me, him, them...).'
- 'Identifie le nom remplacé : une personne (he/she), un objet ou un animal (it), plusieurs personnes ou choses (they/them).'
- Pour un pronom réfléchi, vérifie que le sujet et le complément sont la même personne, puis choisis -self ou -selves.
- 'Pour le pluriel d''un nom : ajoute -s ou -es, et pense aux pluriels irréguliers appris par cœur.'
- 'Pour le génitif : place le possesseur en premier, puis ''s (ou l''apostrophe seule après un pluriel en -s), puis l''objet
  possédé.'
vocabulaire:
- terme: pronoun
  definition: un pronom, mot qui remplace un nom
- terme: reflexive pronoun
  definition: un pronom reflechi, qui indique que le sujet fait l'action sur lui-meme (myself, herself...)
- terme: plural
  definition: le pluriel d'un nom
- terme: genitive ('s)
  definition: la marque de la possession en anglais, ajoutee apres le possesseur
- terme: subject pronoun
  definition: un pronom sujet, qui fait l'action (I, you, he, she, it, we, they)
- terme: object pronoun
  definition: un pronom complément, placé après un verbe ou une préposition (me, him, them...)
- terme: grammatical gender
  definition: le genre des noms (masculin, féminin), qui n'existe pas en anglais pour les noms
erreurs_frequentes:
- Utiliser « its » (pronom possessif, sans apostrophe) a la place de « it's » (contraction de « it is »), ou l'inverse.
- Ecrire « mans » ou « childs » au lieu des pluriels irreguliers « men » et « children ».
- 'Mettre le genitif sur le nom possede au lieu du possesseur : dire « the dog Tom''s » au lieu de « Tom''s dog ».'
- 'Dire « I see he » : après un verbe, on emploie le pronom complément (him).'
- Utiliser un pronom réfléchi quand ce sont deux personnes différentes (« she hurt herself » n'est pas « she hurt him »).
exemple:
  enonce: 'Traduis en anglais : « Le chien de Tom se lave. »'
  solution: 'On peut dire : « Tom''s dog washes itself. » (« Tom''s » est le genitif, « itself » est le pronom reflechi pour
    un animal/objet).'
exercices:
- id: pluriel-children
  type: texte_court
  difficulte: 1
  enonce: Ecris le pluriel de « a child ».
  reponse:
    acceptees:
    - children
    fautes_tolerees: 1
  indices:
    relance: Ce pluriel ne se forme pas en ajoutant simplement « -s ».
    methode: C'est un pluriel irregulier a apprendre par coeur, comme « a man » devient « men ».
    etape: Le mot commence par « child » mais se termine differemment au pluriel.
  pieges:
  - si:
      valeur: childs
    relance: Ce pluriel n'existe pas en anglais. « Child » a un pluriel irregulier.
  solution: Le pluriel de « a child » est « children », un pluriel irregulier.
- id: choisir-pronom-complement
  type: choix
  difficulte: 1
  enonce: 'Complete : « I see Anna and Paul. I talk to ___. »'
  reponse:
    options:
    - id: a
      texte: them
    - id: b
      texte: they
    - id: c
      texte: it
    - id: d
      texte: her
    bonnes:
    - a
  indices:
    relance: 'Anna et Paul sont deux personnes : quel pronom pluriel les remplace quand elles sont complement ?'
    methode: Distingue les pronoms sujets (ils/elles) des pronoms complements (eux/elles, apres une preposition ou comme complement).
    etape: Apres une preposition comme « to », on utilise toujours un pronom complement, jamais un pronom sujet.
  pieges:
  - si:
      contient:
      - b
    relance: « They » est un pronom sujet, pas complement. Ici, il faut un pronom apres la preposition « to ».
  - si:
      contient:
      - d
    relance: « Her » ne remplace qu'une seule personne feminine. Ici, il y a deux personnes, Anna et Paul.
  solution: 'La bonne reponse est « them » : « I talk to them. » (them remplace Anna and Paul, complement).'
- id: pronom-reflechi
  type: texte_court
  difficulte: 2
  enonce: 'Complete avec le bon pronom reflechi : « She hurt ___ while playing football. »'
  reponse:
    acceptees:
    - herself
    fautes_tolerees: 0
  indices:
    relance: Le sujet de la phrase est « she ». Quel pronom reflechi correspond a ce sujet ?
    methode: Les pronoms reflechis se terminent par « -self » au singulier.
    etape: Pour « she », le pronom reflechi commence par « her- ».
  pieges:
  - si:
      valeur: himself
    relance: « Himself » correspond a « he », pas a « she ». Relis le sujet de la phrase.
  solution: 'La bonne reponse est « herself » : « She hurt herself while playing football. »'
- id: genitif-parents
  type: choix
  difficulte: 2
  enonce: Comment ecrit-on correctement « la maison de mes parents » (my parents, pluriel en -s) ?
  reponse:
    options:
    - id: a
      texte: my parents' house
    - id: b
      texte: my parent's house
    - id: c
      texte: my parents's house
    - id: d
      texte: the house of my parents'
    bonnes:
    - a
  indices:
    relance: « Parents » est deja au pluriel et se termine par « s ». Que fait-on alors avec le genitif ?
    methode: Quand le possesseur est un pluriel en -s, on ajoute seulement une apostrophe, sans « s » supplementaire.
    etape: Compare avec un pluriel irregulier comme « the children's toys » (avec un « 's » complet).
  pieges:
  - si:
      contient:
      - b
    relance: « Parent's » (avec 's) suppose un seul parent. Ici, il y a plusieurs parents (pluriel en -s).
  - si:
      contient:
      - c
    relance: 'On n''ajoute jamais « ''s » apres un pluriel deja termine par « s » : seule l''apostrophe suffit.'
  solution: 'On ecrit « my parents'' house » : le possesseur « parents » est un pluriel en -s, on ajoute seulement l''apostrophe.'
- id: presentation-famille
  type: ouverte
  difficulte: 3
  enonce: En anglais, ecris trois phrases pour presenter un membre de ta famille en utilisant au moins un pronom complement
    et un genitif en 's.
  criteres:
  - Les trois phrases sont ecrites en anglais, avec un sujet et un verbe conjugue.
  - Un pronom personnel complement (him, her, them...) est utilise correctement.
  - Un genitif en 's est utilise correctement pour montrer une possession.
  indices:
    relance: Comment dirais-tu « le livre de ma soeur » en anglais ?
    methode: Commence par presenter la personne, puis utilise un genitif pour parler de ce qui lui appartient, puis un pronom
      complement.
    etape: Tu peux commencer par « My sister is called... » puis continuer avec « I see her every day. » et « Her book is
      on the table. »
  solution: 'Exemple possible : « My sister is called Lisa. I see her every day. Her cat''s name is Tom. »'
- id: nblm-quel-est-le-pluriel-correct-du-nom-child-1
  type: choix
  difficulte: 2
  enonce: Quel est le pluriel correct du nom « child » en anglais ?
  reponse:
    options:
    - id: o1
      texte: children
    - id: o2
      texte: childs
    - id: o3
      texte: childrens
    - id: o4
      texte: childes
    bonnes:
    - o1
  indices:
    relance: Certains noms anglais ont un pluriel irrégulier qui ne se termine pas simplement par un « -s ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est l'erreur classique qui consiste à ajouter un « -s » régulier à un nom dont le pluriel est irrégulier.
  - si:
      contient:
      - o4
    relance: Cette terminaison n'existe pas pour former le pluriel du mot « child ».
  solution: children. C'est la forme correcte du pluriel irrégulier de « child », à apprendre par cœur.
- id: nblm-comment-traduit-on-correctement-le-chien-2
  type: choix
  difficulte: 2
  enonce: Comment traduit-on correctement « Le chien de Tom » en utilisant le génitif ?
  reponse:
    options:
    - id: o1
      texte: Tom's dog
    - id: o2
      texte: The dog Tom's
    - id: o3
      texte: The dog of Tom's
    - id: o4
      texte: Toms' dog
    bonnes:
    - o1
  indices:
    relance: N'oublie pas de placer le possesseur en premier avec son apostrophe et son « s ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la marque du génitif (''s) se met sur le possesseur et non sur le nom possédé.'
  - si:
      contient:
      - o3
    relance: C'est une combinaison superflue de la préposition « of » et du génitif.
  - si:
      contient:
      - o4
    relance: L'apostrophe seule après le « s » s'utilise pour les pluriels se terminant par « -s », pas pour un prénom au
      singulier.
  solution: Tom's dog. On place la marque du génitif ('s) sur le possesseur (Tom) suivi du nom possédé (dog).
- id: nblm-par-quel-pronom-complement-faut-il-rempl-3
  type: choix
  difficulte: 2
  enonce: Par quel pronom complément faut-il remplacer « Tom » dans la phrase « I see Tom » ?
  reponse:
    options:
    - id: o1
      texte: him
    - id: o2
      texte: he
    - id: o3
      texte: his
    - id: o4
      texte: himself
    bonnes:
    - o1
  indices:
    relance: Cherche la forme du pronom personnel qui s'utilise quand la personne est complément de la phrase.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: « he » est un pronom sujet, alors qu'ici le nom remplacé est complément d'objet.
  - si:
      contient:
      - o3
    relance: « his » est un adjectif ou pronom possessif, pas un pronom complément.
  solution: him. « him » est le pronom personnel complément masculin singulier correspondant à un nom de personne masculin.
- id: nblm-dans-la-phrase-she-hurt-quel-pronom-refl-4
  type: choix
  difficulte: 2
  enonce: Dans la phrase « She hurt ... », quel pronom réfléchi faut-il utiliser pour indiquer qu'elle s'est fait mal elle-même
    ?
  reponse:
    options:
    - id: o1
      texte: herself
    - id: o2
      texte: her
    - id: o3
      texte: herselves
    - id: o4
      texte: himself
    bonnes:
    - o1
  indices:
    relance: Au singulier, le pronom réfléchi se termine par « -self » et s'accorde avec le sujet féminin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: « her » est un pronom complément ou possessif, pas un pronom réfléchi en « -self ».
  - si:
      contient:
      - o3
    relance: La terminaison « -selves » s'utilise au pluriel, or le sujet « she » est au singulier.
  - si:
      contient:
      - o4
    relance: « himself » s'emploie pour un sujet masculin (he), or le sujet ici est féminin (she).
  solution: herself. « herself » est le pronom réfléchi féminin singulier, indiquant que le sujet fait l'action sur lui-même.
- id: nblm-quelle-est-la-difference-fondamentale-en-5
  type: choix
  difficulte: 2
  enonce: Quelle est la différence fondamentale entre « its » (sans apostrophe) et « it's » (avec apostrophe) ?
  reponse:
    options:
    - id: o1
      texte: « its » marque la possession pour un objet/animal, tandis que « it's » est la contraction de « it is ».
    - id: o2
      texte: « its » est une forme au pluriel, tandis que « it's » est au singulier.
    - id: o3
      texte: « it's » s'utilise pour les personnes et « its » pour les objets.
    - id: o4
      texte: « its » est la forme sujet et « it's » est la forme complément.
    bonnes:
    - o1
  indices:
    relance: L'une des deux formes comporte une apostrophe qui remplace une lettre manquante du verbe « be ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Confusion fréquente : la présence ou l''absence d''apostrophe ne signale pas le pluriel ici.'
  - si:
      contient:
      - o3
    relance: « it » et ses dérivés s'appliquent aux choses ou animaux, pas aux personnes.
  - si:
      contient:
      - o4
    relance: Le pronom sujet et complément pour les objets est « it », pas « its ».
  solution: '« its » marque la possession pour un objet/animal, tandis que « it''s » est la contraction de « it is ». C''est
    la règle exacte : l''apostrophe dans « it''s » marque la contraction du verbe, alors que « its » est le déterminant possessif.'
- id: nblm-parmi-les-phrases-suivantes-lesquelles-u-6
  type: choix
  difficulte: 3
  enonce: Parmi les phrases suivantes, lesquelles utilisent correctement un pluriel irrégulier ou un génitif ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: My parents' house is very big.
    - id: o2
      texte: The women are talking in the room.
    - id: o3
      texte: The mans are working in the garden.
    - id: o4
      texte: This is my brother's-s car.
    bonnes:
    - o1
    - o2
  indices:
    relance: Repère la phrase qui applique la règle de l'apostrophe seule après un pluriel en -s et celle qui utilise la bonne
      forme du pluriel de « woman ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur de pluriel : le pluriel irrégulier de « man » est « men », et non « mans ».'
  - si:
      contient:
      - o4
    relance: 'Erreur de formation : la marque du génitif au singulier est simplement « ''s ».'
  solution: My parents' house is very big ; The women are talking in the room. Au pluriel régulier se terminant par « -s »,
    le génitif prend seulement une apostrophe à la fin du possesseur.
- id: nblm-complete-la-phrase-avec-le-pluriel-irreg-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase avec le pluriel irrégulier du mot « man » : « Three ... are waiting outside. »'
  reponse:
    acceptees:
    - men
    fautes_tolerees: 1
  indices:
    relance: Ce mot d'une seule syllabe change sa voyelle « a » en « e » au pluriel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: men. « men » est la forme exacte du pluriel irrégulier du nom « man ».
- id: nblm-complete-la-phrase-suivante-avec-le-pron-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase suivante avec le pronom réfléchi qui convient pour un animal ou un objet : « Tom''s dog washes
    ... »'
  reponse:
    acceptees:
    - itself
    fautes_tolerees: 1
  indices:
    relance: Utilise le pronom réfléchi composé de « it » et de la terminaison du singulier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: itself. « itself » est le pronom réfléchi au singulier utilisé pour un animal ou un objet.
- id: association-pronoms
  type: association
  difficulte: 1
  enonce: Relie chaque groupe nominal au pronom complément qui le remplace.
  reponse:
    gauche:
    - id: a
      texte: Tom
    - id: b
      texte: Anna
    - id: c
      texte: the book
    - id: d
      texte: my friends
    droite:
    - id: w
      texte: him
    - id: x
      texte: her
    - id: y
      texte: it
    - id: z
      texte: them
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: 'Pour chaque groupe, demande-toi : une personne, un animal ou un objet, ou plusieurs ?'
    methode: Un homme, une femme, une chose et plusieurs personnes n'ont pas le même pronom complément.
    etape: 'Commence par « my friends » : c''est un pluriel, il faut un pronom pluriel.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie ce qui est singulier et ce qui est pluriel, puis le genre des personnes.
  - si:
      diagnostic: associations_fausses
    relance: Place d'abord le seul groupe pluriel, puis distingue la personne masculine, la personne féminine et la chose.
  solution: 'Tom (un homme) : him. Anna (une femme) : her. the dog (un animal, non nommé personne) : it. my friends (pluriel)
    : them.'
- id: reflechi-nous
  type: texte_court
  difficulte: 2
  enonce: 'Complète avec le bon pronom réfléchi : « We enjoyed ___ at the party. »'
  reponse:
    acceptees:
    - ourselves
    fautes_tolerees: 1
  indices:
    relance: 'Le sujet est « we » : quelle terminaison prennent les réfléchis au pluriel ?'
    methode: Un pronom réfléchi se termine par -self au singulier et par -selves au pluriel.
    etape: Le mot commence par « our- » et se termine par « -selves ».
  pieges:
  - si:
      valeur: ourself
    relance: '« Ourself » est singulier. Ici, le sujet est pluriel : que devient la fin du mot ?'
  - si:
      valeur: themselves
    relance: « Themselves » correspond à « they ». Relis le sujet de la phrase.
  solution: 'Le sujet est « we » (nous) : le réfléchi est le pluriel de la première personne. « We enjoyed ourselves at the
    party. »'
- id: sujet-ou-complement
  type: choix
  difficulte: 2
  enonce: 'Complète : « My sister is nice. I often help ___. »'
  reponse:
    options:
    - id: a
      texte: her
    - id: b
      texte: she
    - id: c
      texte: herself
    - id: d
      texte: it
    bonnes:
    - a
  indices:
    relance: 'Le mot à choisir est complément du verbe « help » : sujet ou complément ?'
    methode: 'Une sœur est une personne de sexe féminin : quel pronom complément la remplace ?'
    etape: Élimine « she » (sujet), « herself » (réfléchi, mais le sujet est « I ») et « it » (objet).
  pieges:
  - si:
      contient:
      - b
    relance: « She » est un pronom sujet. Ici, le mot est le complément du verbe.
  - si:
      contient:
      - c
    relance: Un pronom réfléchi suppose que le sujet et le complément soient la même personne. Ici, « I » et « my sister »
      sont deux personnes.
  - si:
      contient:
      - d
    relance: « It » désigne une chose ou un animal. Une sœur est une personne.
  solution: '« I help her » : le complément remplace « my sister », une femme. « She » est un sujet, « herself » supposerait
    que le sujet soit la même personne, « it » désigne une chose.'
