format: 2
notion: parler-en-continu
version: 2
etat: verifiee
declencheurs:
- présenter un exposé en anglais
- parler anglais sans hésiter
- reformuler quand on ne trouve pas un mot
- raconter une histoire en anglais
- prendre la parole en anglais
- parler longtemps en anglais
- faire un exposé en anglais
- décrire une image en anglais
- donner son opinion en anglais
prerequis:
- ecouter-et-comprendre
couverture: Travaille par écrit les stratégies de prise de parole longue (plan, reformulation, registre, fonctions). Ne couvre
  pas la prononciation ni l'intonation, qui demandent un travail à l'oral réel.
essentiel: 'Parler en continu, c''est prendre la parole seul, pendant plusieurs phrases, pour raconter, décrire, expliquer
  ou argumenter, sans être interrompu.


  Le plus important est de se faire comprendre, pas de ne faire aucune erreur. On prépare son discours : un plan simple (introduction,
  deux ou trois idées, conclusion) et des mots-clés, jamais un texte appris mot à mot.


  Mobiliser ce qu''on sait. On choisit à bon escient les mots (lexique), les faits (culture) et les structures (grammaire)
  que l''on maîtrise, pour parler de sujets variés : sa vie, ses loisirs, un voyage, un avis.


  Les fonctions à connaître.

  - Raconter : au passé, avec « first », « then », « finally ».

  - Décrire : au présent, avec « there is », « it is », « he has ».

  - Expliquer : avec « because » et « so ».

  - Argumenter : « I think that... », « In my opinion... », « for example », « however ».


  Surmonter un manque de mots. Si un mot manque, on ne s''arrête pas.

  - On le remplace par un mot plus simple ou un mot voisin.

  - On décrit l''objet : « It''s a thing you use when it rains. »

  - On dit : « I don''t know the word, but it''s like... »

  - On s''autocorrige : « Sorry, I mean... ». C''est une force, pas une faute.


  Respecter un registre. Un exposé en classe demande un langage soigné : « Today, I would like to talk about... ». Entre amis,
  on peut être plus direct. « Could you help me, please? » est plus poli que « Help me! ».


  Mettre en voix. La prononciation est claire, l''intonation monte pour une question et descend pour une affirmation, les
  mots importants sont accentués. Les gestes et le regard aident à convaincre.


  Ce qu''on attend de toi : présenter un sujet en quelques phrases, construites, compréhensibles, en reformulant quand un
  mot manque.

  '
methode:
- 'Préparer un plan simple avant de parler : une introduction, deux ou trois idées, une conclusion.'
- Noter quelques mots-clés seulement, sans rédiger tout le texte.
- Choisir des mots que l'on maîtrise plutôt que des mots compliqués mal connus.
- Si un mot manque, le remplacer par une description simple ou un mot proche, plutôt que de s'arrêter de parler.
- 'Adapter son registre de langue : plus poli et plus complet pour un exposé, plus direct entre amis.'
- 'S''entraîner à voix haute : articuler, accentuer les mots importants et regarder son auditoire.'
vocabulaire:
- terme: fluency
  definition: la capacité à parler de façon fluide, sans trop s'arrêter
- terme: register
  definition: le niveau de langue (formel ou familier) adapté à une situation
- terme: to rephrase
  definition: dire autrement, avec d'autres mots, pour se faire comprendre
- terme: intonation
  definition: la mélodie de la voix, qui monte ou descend selon le sens
- terme: pronunciation
  definition: la façon de prononcer les sons et les mots
- terme: to self-correct
  definition: s'autocorriger, corriger soi-même une erreur en parlant
- terme: outline
  definition: 'le plan d''un exposé : introduction, idées, conclusion'
- terme: opinion
  definition: ce que l'on pense d'un sujet ; on dit 'In my opinion...'
erreurs_frequentes:
- S'arrêter complètement de parler dès qu'un mot manque, au lieu de reformuler.
- Employer le même registre familier dans toutes les situations, même les plus formelles.
- Parler sans plan, ce qui rend le discours décousu et difficile à suivre.
- Apprendre un texte par cœur et le réciter sans regarder son auditoire, au lieu de s'appuyer sur des mots-clés.
- Parler trop vite ou sans accentuer les mots importants, ce qui rend le discours peu clair.
exemple:
  enonce: Un élève ne connaît pas le mot anglais pour 'valise'. Que peut-il dire à la place ?
  solution: 'Il peut dire quelque chose comme ''It''s a bag you use for travelling'' (c''est un sac qu''on utilise pour voyager)
    : il décrit l''objet avec des mots plus simples au lieu de s''arrêter de parler.'
exercices:
- id: reformuler-mot-manquant
  type: choix
  difficulte: 1
  enonce: Tu ne connais pas le mot anglais pour 'parapluie'. Que dis-tu pour continuer à te faire comprendre ?
  reponse:
    options:
    - id: a
      texte: It's a thing you use when it rains.
    - id: b
      texte: I don't speak.
    - id: c
      texte: Umbrella, umbrella, umbrella.
    bonnes:
    - a
  indices:
    relance: Que peux-tu dire pour décrire l'objet, plutôt que de t'arrêter de parler ?
    methode: Décris à quoi sert l'objet ou quand on l'utilise, avec des mots simples que tu connais déjà.
    etape: 'Un parapluie sert quand il pleut : quelle phrase décrit cette utilité en anglais simple ?'
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase arrête complètement la communication. Peux-tu décrire l'objet autrement, avec des mots que tu connais
      ?
  - si:
      contient:
      - c
    relance: Répéter le mot français ne t'aidera pas à te faire comprendre en anglais. Essaie de décrire l'objet.
  solution: '''It''s a thing you use when it rains'' décrit l''objet sans connaître le mot exact : c''est une bonne stratégie
    de reformulation.'
- id: registre-formel
  type: choix
  difficulte: 1
  enonce: Tu commences un exposé devant la classe en anglais. Quelle phrase d'introduction est la plus adaptée ?
  reponse:
    options:
    - id: a
      texte: Today, I would like to talk about my favourite sport.
    - id: b
      texte: Hey, so, sport, yeah, let's go.
    - id: c
      texte: Sport is cool, whatever.
    bonnes:
    - a
  indices:
    relance: Un exposé devant la classe est-il une situation formelle ou une conversation entre amis ?
    methode: Pour un exposé, on choisit un registre plus soigné, avec une phrase complète et claire.
    etape: '''Today, I would like to talk about...'' est une formule complète et adaptée à une présentation.'
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase est trop familière et peu claire pour ouvrir un exposé devant la classe. Quelle formule est plus
      structurée ?
  - si:
      contient:
      - c
    relance: '''Whatever'' est un mot très familier, peu adapté à un exposé. Cherche la phrase la plus soignée.'
  solution: '''Today, I would like to talk about my favourite sport'' est une formule claire et adaptée à un exposé devant
    la classe.'
- id: ordre-plan-expose
  type: ordre
  difficulte: 2
  enonce: Range ces parties d'un court exposé sur les vacances dans l'ordre logique.
  reponse:
    elements:
    - id: a
      texte: Today, I'm going to talk about my summer holidays.
    - id: b
      texte: I went to the seaside with my family for two weeks.
    - id: c
      texte: In conclusion, it was a great holiday and I want to go back next year.
  indices:
    relance: Quelle phrase annonce le sujet, et laquelle conclut le discours ?
    methode: 'Un exposé suit toujours le même plan : introduction, développement, puis conclusion.'
    etape: '''Today, I''m going to talk about...'' annonce le sujet : place-la en premier.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux parties voisines sont inversées. Laquelle développe le sujet, et laquelle conclut le discours ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'annonce du sujet, puis le développement, puis la conclusion introduite par 'in conclusion'.
  solution: D'abord l'annonce du sujet, puis le développement (les vacances à la mer), puis la conclusion introduite par 'in
    conclusion'.
- id: mot-fluency
  type: texte_court
  difficulte: 2
  enonce: Quel mot anglais désigne la capacité à parler de façon fluide, sans trop s'arrêter ? (vu dans le vocabulaire de
    la fiche)
  reponse:
    acceptees:
    - fluency
    fautes_tolerees: 1
  indices:
    relance: Ce mot ressemble à un mot français qui parle de fluidité, d'écoulement sans obstacle.
    methode: 'Relis le vocabulaire de la fiche : un mot y désigne exactement cette capacité.'
    etape: Le mot commence par 'flu-', comme 'fluide' en français.
  pieges:
  - si:
      valeur: register
    relance: '''Register'' désigne le niveau de langue, pas la fluidité de la parole. Cherche l''autre mot du vocabulaire.'
  solution: '''Fluency'' désigne la capacité à parler de façon fluide, sans trop s''arrêter ni chercher longtemps ses mots.'
- id: nblm-en-quoi-consiste-precisement-l-activite-1
  type: choix
  difficulte: 2
  enonce: En quoi consiste précisément l'activité langagière « parler en continu » pour un élève de 3e ?
  reponse:
    options:
    - id: o1
      texte: Prendre la parole seul pendant plusieurs phrases pour raconter, décrire, expliquer ou donner son avis sans être
        interrompu.
    - id: o2
      texte: Répondre du tac au tac aux questions d'un camarade dans un débat spontané.
    - id: o3
      texte: Traduire mot à mot un texte écrit par l'enseignant devant toute la classe.
    - id: o4
      texte: Répéter des phrases enregistrées en cherchant à imiter un accent natif parfait.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que signifie prendre la parole seul pour enchaîner ses idées sans se faire couper.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, réagir et échanger des répliques spontanées relève de l'activité « réagir et dialoguer », pas du parler
      en continu.
  - si:
      contient:
      - o3
    relance: Le parler en continu n'est pas de la traduction littérale, mais une production orale autonome.
  - si:
      contient:
      - o4
    relance: L'objectif prioritaire n'est pas d'imiter un accent parfait, mais de transmettre un message intelligible.
  solution: 'Prendre la parole seul pendant plusieurs phrases pour raconter, décrire, expliquer ou donner son avis sans être
    interrompu. C''est la définition exacte du parler en continu : s''exprimer seul de manière suivie pour développer une
    idée ou raconter une histoire.'
- id: nblm-lorsqu-on-doit-raconter-une-histoire-ou-2
  type: choix
  difficulte: 2
  enonce: Lorsqu'on doit raconter une histoire ou présenter un exposé en anglais, que convient-il de faire si un mot de vocabulaire
    manque ?
  reponse:
    options:
    - id: o1
      texte: Reformuler en utilisant des mots plus simples ou en décrivant la chose autrement.
    - id: o2
      texte: S'arrêter immédiatement de parler et chercher la traduction exacte dans un dictionnaire.
    - id: o3
      texte: Dire le mot en français avec un accent anglais pour continuer sa phrase.
    - id: o4
      texte: Abandonner le sujet de l'exposé et parler brusquement de tout autre chose.
    bonnes:
    - o1
  indices:
    relance: 'Pense à l''exemple de la valise : comment s''exprimer quand on ne connaît pas le terme exact ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: S'arrêter complètement casse la continuité du discours et crée des blocages inutiles.
  - si:
      contient:
      - o3
    relance: Basculer en français ne montre pas votre capacité à vous exprimer et à trouver une solution en anglais.
  - si:
      contient:
      - o4
    relance: Changer brusquement de sujet rompt la cohérence du plan et égare votre auditoire.
  solution: 'Reformuler en utilisant des mots plus simples ou en décrivant la chose autrement. C''est la bonne méthode : reformuler
    permet de contourner l''obstacle et de maintenir sa fluidité orale.'
- id: nblm-quelle-etape-de-methode-est-essentielle-3
  type: choix
  difficulte: 2
  enonce: Quelle étape de méthode est essentielle pour réussir à présenter un exposé en anglais de manière claire et organisée
    ?
  reponse:
    options:
    - id: o1
      texte: Préparer un plan simple avec une introduction, deux ou trois idées clés et une conclusion.
    - id: o2
      texte: Apprendre par cœur un long texte au vocabulaire complexe pour impressionner la classe.
    - id: o3
      texte: Improviser totalement sans aucune préparation préalable pour paraître naturel.
    - id: o4
      texte: Rédiger uniquement des questions destinées à faire interroger le public pendant la présentation.
    bonnes:
    - o1
  indices:
    relance: Pense aux trois parties fondamentales qui permettent d'ordonner tes idées avant de parler.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Réciter par cœur du texte complexe mène souvent à des oublis et nuit au naturel de l'exposé.
  - si:
      contient:
      - o3
    relance: Parler sans plan rend le discours décousu et difficile à suivre pour les personnes qui vous écoutent.
  - si:
      contient:
      - o4
    relance: Une série de questions ne constitue pas un exposé oral continu et structuré.
  solution: Préparer un plan simple avec une introduction, deux ou trois idées clés et une conclusion. Organiser son propos
    à l'aide d'un plan simple garantit une présentation claire et structurée.
- id: nblm-comment-faut-il-gerer-son-niveau-de-lang-4
  type: choix
  difficulte: 2
  enonce: Comment faut-il gérer son niveau de langue (registre) lorsqu'on s'exprime en continu selon la situation ?
  reponse:
    options:
    - id: o1
      texte: 'Adapter son registre à la situation : employer des formules plus polies et formelles pour un exposé en classe.'
    - id: o2
      texte: Conserver le même ton familier en toutes circonstances, même lors d'une présentation officielle.
    - id: o3
      texte: Utiliser un vocabulaire scientifique très rare même si l'on n'en comprend pas le sens.
    - id: o4
      texte: Chuchoter pour ne pas prendre le risque d'être entendu par les autres élèves.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la différence de ton entre s'adresser à un professeur ou présenter devant la classe et discuter entre
      amis.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Employer un registre familier dans un contexte formel constitue une maladresse de communication.
  - si:
      contient:
      - o3
    relance: Il faut toujours privilégier des mots simples que l'on maîtrise plutôt que du vocabulaire inutilement obscur.
  - si:
      contient:
      - o4
    relance: La confiance linguistique consiste à s'exprimer à haute voix avec assurance sans craindre les erreurs.
  solution: 'Adapter son registre à la situation : employer des formules plus polies et formelles pour un exposé en classe.
    Un exposé scolaire exige un registre de langue formel et respectueux, contrairement à une discussion amicale.'
- id: nblm-pour-parler-anglais-sans-hesiter-lors-d-5
  type: choix
  difficulte: 2
  enonce: Pour parler anglais sans hésiter lors d'une prise de parole en continu, quelle doit être ta priorité ?
  reponse:
    options:
    - id: o1
      texte: Se faire comprendre clairement et maintenir la continuité de son discours, même avec de petites erreurs.
    - id: o2
      texte: Ne commettre aucune erreur grammaticale, quitte à faire de longues pauses entre chaque mot.
    - id: o3
      texte: Parler extrêmement vite pour donner l'impression d'une grande maîtrise.
    - id: o4
      texte: Utiliser impérativement des phrases très longues et complexes pour bien se faire évaluer.
    bonnes:
    - o1
  indices:
    relance: Qu'est-ce qui compte le plus pour que la personne qui t'écoute comprenne ton histoire ?
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Chercher à ne faire aucune faute au détriment du rythme bloque la prise de parole et nuit à la fluidité.
  - si:
      contient:
      - o3
    relance: Parler trop vite peut rendre le discours incompréhensible et entraîner de nombreuses confusions.
  - si:
      contient:
      - o4
    relance: Des phrases simples et bien maîtrisées sont préférables pour éviter de s'emmêler dans sa présentation.
  solution: Se faire comprendre clairement et maintenir la continuité de son discours, même avec de petites erreurs. L'intelligibilité
    et le maintien du fil de la parole priment sur la recherche d'une perfection absolue.
- id: nblm-quelles-sont-les-deux-bonnes-strategies-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX bonnes stratégies à employer pour continuer à parler sans bloquer quand on ne trouve pas un
    mot exact ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: 'Remplacer le mot manquant par une description simple (par exemple : ''It''s a bag you use for travelling'').'
    - id: o2
      texte: Utiliser un terme plus général ou un mot proche que l'on maîtrise bien.
    - id: o3
      texte: Rester totalement silencieux en attendant que quelqu'un nous donne le mot.
    - id: o4
      texte: Traduire mentalement chaque mot français avant de le prononcer à voix haute.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux actions positives qui t'aident à garder la parole de façon fluide en anglais.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Le silence prolongé interrompt le discours et fait perdre le fil de l'exposé.
  - si:
      contient:
      - o4
    relance: La traduction mot à mot dans sa tête ralentit le débit et gêne la fluidité orale.
  solution: 'Remplacer le mot manquant par une description simple (par exemple : ''It''s a bag you use for travelling'') ;
    Utiliser un terme plus général ou un mot proche que l''on maîtrise bien. Décrire l''objet avec des mots simples est une
    excellente stratégie pour contourner l''obstacle.'
- id: nblm-quel-mot-anglais-designe-la-capacite-a-p-7
  type: texte_court
  difficulte: 1
  enonce: Quel mot anglais désigne la capacité à parler anglais sans hésiter de manière fluide et continue ?
  reponse:
    acceptees:
    - fluency
    fautes_tolerees: 1
  indices:
    relance: Ce mot partage la même origine latine que le mot français 'fluidité'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: fluency. Le terme 'fluency' désigne la capacité à parler de façon fluide, sans trop d'hésitations ou de blocages.
- id: nblm-quel-terme-anglais-designe-le-niveau-de-8
  type: texte_court
  difficulte: 1
  enonce: Quel terme anglais désigne le niveau de langue (formel ou familier) que tu dois adapter quand tu présentes un exposé
    ?
  reponse:
    acceptees:
    - register
    fautes_tolerees: 1
  indices:
    relance: Ce mot est un vrai ami très similaire au terme français 'registre'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: register. Le terme 'register' (registre) correspond au degré de formalité adapté au contexte d'expression orale.
- id: choisir-fonction
  type: choix
  difficulte: 2
  enonce: Tu veux raconter tes vacances de l'été dernier. Quelle phrase convient le mieux ?
  reponse:
    options:
    - id: a
      texte: There is a big beach near my house.
    - id: b
      texte: Last summer, I went to Spain and I visited Madrid.
    - id: c
      texte: In my opinion, holidays are important.
    bonnes:
    - b
  indices:
    relance: Raconter, c'est parler d'événements passés. Quelle phrase contient un verbe au passé ?
    methode: Une phrase décrit, une autre donne un avis, une autre raconte. Cherche 'last summer' et un verbe au passé.
    etape: '''Went'' et ''visited'' sont deux verbes au passé. Trouve la phrase qui les contient.'
  pieges:
  - si:
      contient:
      - a
    relance: Cette phrase décrit un lieu au présent. Elle ne raconte pas un événement passé.
  - si:
      contient:
      - c
    relance: Cette phrase donne un avis. Elle ne raconte pas d'événement.
  solution: '''Last summer, I went to Spain and I visited Madrid.'' raconte des événements passés (went, visited).'
- id: mot-because
  type: texte_court
  difficulte: 1
  enonce: 'Complète pour expliquer : ''I like this film ___ it is funny.'' Écris le mot qui donne la raison.'
  reponse:
    acceptees:
    - because
    fautes_tolerees: 1
  indices:
    relance: Tu expliques pourquoi tu aimes le film. Quel mot introduit la raison ?
    methode: Ce mot veut dire « parce que ». Il est dans le vocabulaire de connecteurs.
    etape: Il commence par 'be' et finit par 'use'.
  pieges:
  - si:
      valeur: so
    relance: '''So'' veut dire « donc » et introduit une conséquence. Ici, tu donnes la raison de ton goût.'
  solution: '''Because'' (parce que) introduit la raison : j''aime le film parce qu''il est drôle.'
- id: connecteurs-oral
  type: association
  difficulte: 2
  enonce: Associe chaque expression à sa fonction dans un discours.
  reponse:
    gauche:
    - id: a
      texte: First, then, finally
    - id: b
      texte: I think that, in my opinion
    - id: c
      texte: For example
    droite:
    - id: x
      texte: raconter dans l'ordre
    - id: y
      texte: donner un avis
    - id: z
      texte: donner un exemple
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque expression, imagine la phrase française qui lui ressemble.
    methode: « First, then, finally » se traduit par « d'abord, puis, enfin ».
    etape: Associe d'abord l'expression qui mentionne une opinion.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis-les une par une et repère celle qui ne convient pas.
  - si:
      diagnostic: associations_fausses
    relance: Plusieurs associations sont fausses. Commence par celle dont tu es le plus sûr, puis avance par élimination.
  solution: First, then, finally = raconter dans l'ordre ; I think that = donner un avis ; for example = donner un exemple.
- id: presenter-passion
  type: ouverte
  difficulte: 3
  enonce: Prépare en anglais une courte présentation de 6 à 8 phrases sur un loisir que tu aimes. Ton texte doit avoir une
    introduction, deux idées expliquées avec 'because' ou 'so', et une conclusion. Si tu ne connais pas un mot, reformule-le
    en anglais simple.
  criteres:
  - 'Le texte compte 6 à 8 phrases et suit un plan clair : introduction, deux idées, conclusion.'
  - Au moins deux explications sont introduites avec 'because' ou 'so', et le registre est soigné pour un exposé (par exemple
    'Today, I would like to talk about...').
  - Un mot manquant est remplacé par une description simple (it's a thing you use to...) ou un mot proche, sans s'arrêter.
  indices:
    relance: Quelle phrase annonce ton sujet ? Quelle phrase conclut ?
    methode: Écris ton plan en trois lignes, puis développe chaque ligne en une ou deux phrases.
    etape: 'Commence ainsi : « Today, I would like to talk about my favourite hobby... »'
  solution: 'Exemple : « Today, I would like to talk about drawing. I like it because it is relaxing. I also draw with my
    sister, so we spend time together. I use a thing you put on the wall to show my pictures. In conclusion, drawing is my
    favourite hobby. »'
