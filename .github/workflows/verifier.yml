name: Vérification des fiches

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Contrat des fiches v2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: jules-bibliotheques
          persist-credentials: false
      # Le verificateur et le referentiel vivent dans le depot du code. Variable de depot JULES_REF pour
      # verifier contre une autre branche de jules (par defaut : main).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alexxb2mg-svg/jules
          ref: ${{ vars.JULES_REF || 'main' }}
          path: jules
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Installer Jules
        run: python -m pip install -e ./jules
      - name: jules fiches verifier
        run: jules fiches verifier jules-bibliotheques/fiches-v2-*
