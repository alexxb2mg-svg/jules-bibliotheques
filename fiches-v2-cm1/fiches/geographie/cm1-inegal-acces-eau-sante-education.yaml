format: 2
notion: cm1-inegal-acces-eau-sante-education
version: 3
etat: verifiee
declencheurs:
- pourquoi tout le monde n'a pas d'eau potable
- pourquoi certains enfants ne vont pas à l'école
- pourquoi il n'y a pas d'hôpital partout
- des enfants qui marchent longtemps pour chercher de l'eau
- pas de robinet à la maison
- chercher de l'eau au puits
- pas de médecin au village
- les filles privées d'école
prerequis: []
couverture: Se limite à des exemples simples d'inégal accès à l'eau, à la santé et à l'éducation dans le monde. Ne traite
  pas les causes économiques ou politiques détaillées de ces inégalités, ni de chiffres.
essentiel: 'Dans le monde, tous les habitants n''ont pas accès aux mêmes ressources essentielles. Trois besoins sont très
  importants : boire de l''eau propre, se soigner, et aller à l''école. Quand certaines personnes y accèdent facilement et
  d''autres non, on parle d''inégalités.


  L''eau. En France, on ouvre le robinet et l''eau potable coule. Dans certaines régions du monde, l''eau n''arrive pas dans
  les maisons. Des enfants et des femmes marchent parfois plusieurs kilomètres chaque jour pour aller chercher de l''eau à
  un puits ou à une rivière.


  La santé. Dans certaines régions, les hôpitaux et les médecins sont rares et éloignés. Il faut parfois parcourir une longue
  distance pour se faire soigner, même quand on est très malade.


  L''éducation. Dans certaines régions, tous les enfants ne vont pas à l''école, surtout les filles dans certains pays. Certains
  doivent aider leur famille. Pour d''autres, l''école la plus proche est trop loin.


  Ces trois problèmes se retrouvent souvent dans les mêmes régions. Ce sont des manifestations des inégalités de niveau de
  vie : ils montrent que les gens ne vivent pas dans les mêmes conditions partout.


  Attention : ces inégalités existent sur plusieurs continents. Et « mal desservi » ne veut pas dire « rien du tout » : l''eau
  existe, mais elle est loin ou difficile à obtenir.

  '
methode:
- Lire la situation décrite (un texte, une photo, un témoignage).
- 'Repérer de quelle ressource il s''agit : l''eau, la santé ou l''éducation.'
- Chercher l'indice concret qui montre l'inégalité (distance à parcourir, absence d'école, absence d'hôpital).
- Comparer avec ta propre vie (robinet, médecin, école près de chez toi).
- Relier cet exemple au niveau de vie de la région concernée.
vocabulaire:
- terme: accès à l'eau potable
  definition: le fait de pouvoir obtenir facilement de l'eau propre à boire, par exemple grâce à un robinet à la maison
- terme: eau potable
  definition: une eau assez propre pour être bue sans danger
- terme: accès à la santé
  definition: le fait de pouvoir se faire soigner facilement par un médecin ou dans un hôpital
- terme: accès à l'éducation
  definition: le fait de pouvoir aller à l'école pour apprendre
- terme: inégalités
  definition: des différences entre les personnes, qui font que tout le monde n'a pas les mêmes chances
- terme: niveau de vie
  definition: les conditions de vie d'une population, par exemple son accès à l'eau, à la santé ou à l'éducation
erreurs_frequentes:
- Croire que ces inégalités n'existent que dans un seul continent.
- Confondre le manque d'accès à une ressource (elle est difficile à obtenir) et son absence totale (elle n'existe jamais).
- Oublier que l'eau, la santé et l'éducation sont trois domaines différents, même s'ils sont souvent liés dans les mêmes régions.
- Croire que les enfants qui ne vont pas à l'école ne veulent pas apprendre, alors qu'ils en sont souvent empêchés.
exemple:
  enonce: Donne un exemple d'inégal accès à l'eau et un exemple d'inégal accès à l'éducation.
  solution: Dans certaines régions, des enfants marchent plusieurs kilomètres pour chercher de l'eau à un puits, faute de
    robinet à la maison. Dans certaines régions, des enfants, surtout des filles, ne vont pas à l'école car elle est trop
    loin ou car ils doivent aider leur famille.
exercices:
- id: identifier-inegalite-eau
  type: choix
  difficulte: 1
  enonce: Que montre le fait que des enfants marchent plusieurs kilomètres chaque jour pour chercher de l'eau ?
  reponse:
    options:
    - id: a
      texte: Un inégal accès à l'eau potable
    - id: b
      texte: Un inégal accès à l'éducation
    - id: c
      texte: Une pratique alimentaire différente
    bonnes:
    - a
  indices:
    relance: De quelle ressource ces enfants ont-ils besoin, et qu'ils n'ont pas directement chez eux ?
    methode: 'Regarde ce que les enfants vont chercher : de l''eau, pas un livre ni de la nourriture.'
    etape: 'Ils marchent pour trouver de l''eau : cela concerne l''accès à l''eau.'
  pieges:
  - si:
      contient:
      - b
    relance: Ici, les enfants cherchent de l'eau, pas une école. Regarde bien ce qu'ils vont chercher.
  - si:
      contient:
      - c
    relance: Cela ne parle pas de ce que les enfants mangent, mais de ce qu'ils boivent.
  solution: 'Cela montre un inégal accès à l''eau potable : dans certaines régions, l''eau n''arrive pas directement à la
    maison.'
- id: signe-acces-sante
  type: choix
  difficulte: 1
  enonce: Laquelle de ces situations montre un inégal accès à la santé ?
  reponse:
    options:
    - id: a
      texte: L'école du village est à 10 kilomètres
    - id: b
      texte: Le premier hôpital est à plusieurs heures de route
    - id: c
      texte: Le puits est loin de la maison
    bonnes:
    - b
  indices:
    relance: Où va-t-on quand on est malade ou blessé ?
    methode: La santé, c'est le fait de pouvoir se faire soigner. Cherche la situation qui parle d'un lieu où l'on soigne.
    etape: L'école concerne l'éducation, pas la santé. Parmi les deux autres situations, laquelle parle de soins ?
  pieges:
  - si:
      contient:
      - a
    relance: L'école concerne l'éducation. Cherche un lieu où l'on se fait soigner.
  - si:
      contient:
      - c
    relance: Le puits concerne l'eau. Cherche un lieu où l'on se fait soigner.
  solution: 'Un hôpital à plusieurs heures de route montre un inégal accès à la santé : il est difficile de se faire soigner.'
- id: associer-domaine-exemple
  type: association
  difficulte: 2
  enonce: 'Associe chaque exemple au domaine concerné : l''eau, la santé ou l''éducation.'
  reponse:
    gauche:
    - id: a
      texte: Marcher plusieurs kilomètres pour trouver un puits
    - id: b
      texte: Ne pas avoir d'hôpital à moins de plusieurs heures de route
    - id: c
      texte: Ne pas aller à l'école car elle est trop loin
    droite:
    - id: x
      texte: Eau
    - id: y
      texte: Santé
    - id: z
      texte: Éducation
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Lis chaque exemple et demande-toi de quel besoin il parle : boire, se soigner, ou apprendre.'
    methode: 'Repère les mots-clés de chaque exemple : puits (eau), hôpital (santé), école (éducation).'
    etape: « Puits » renvoie à l'eau, pas à la santé ni à l'éducation.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les mots-clés de chaque exemple.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord l'exemple qui parle clairement de l'eau, pour t'aider à classer les autres.
  solution: Le puits concerne l'eau, l'hôpital concerne la santé, l'école concerne l'éducation.
- id: mot-inegalites
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le fait que tout le monde n'a pas les mêmes chances d'accéder à l'eau, à la santé ou à l'éducation
    dans le monde ?
  reponse:
    acceptees:
    - inégalités
    - inégalité
    - les inégalités
    fautes_tolerees: 1
  indices:
    relance: C'est le contraire d'« égalité ».
    methode: Cherche le mot qui commence par le préfixe « in- », qui signifie « pas ».
    etape: Le mot est formé à partir d'« égalité », avec le préfixe « in- ».
  pieges:
  - si:
      valeur: pauvreté
    relance: La pauvreté est une des causes possibles, mais le mot cherché décrit plutôt la différence de situation entre
      les personnes.
  solution: 'Le mot est « inégalités » : cela désigne le fait que tout le monde n''a pas les mêmes chances face à l''eau,
    à la santé ou à l''éducation.'
- id: mot-eau-potable
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on une eau assez propre pour être bue sans danger ? Complète « de l'eau ... ».
  reponse:
    acceptees:
    - potable
    - eau potable
    - l'eau potable
    fautes_tolerees: 1
  indices:
    relance: C'est l'eau qui coule du robinet en France, et qu'on peut boire.
    methode: Relis le vocabulaire de ta leçon sur l'accès à l'eau.
    etape: C'est le même mot que dans l'expression de ta leçon « l'eau … coule du robinet ».
  pieges:
  - si:
      valeur: propre
    relance: Tu as la bonne idée. Il existe un mot plus précis pour dire qu'une eau peut se boire.
  - si:
      valeur: minérale
    relance: L'eau minérale est une eau en bouteille. Cherche le mot général qui veut dire « bonne à boire ».
  solution: On parle d'eau potable. C'est une eau qu'on peut boire sans danger.
- id: vrai-acces-ou-absence
  type: choix
  difficulte: 2
  enonce: Dans un village, l'eau existe, mais il faut marcher longtemps jusqu'au puits. Que peut-on dire ?
  reponse:
    options:
    - id: a
      texte: Il n'y a pas du tout d'eau dans cette région
    - id: b
      texte: L'eau existe, mais son accès est difficile
    - id: c
      texte: Les habitants ont le même accès à l'eau qu'en France
    bonnes:
    - b
  indices:
    relance: Le texte dit-il qu'il n'y a pas d'eau, ou qu'elle est loin ?
    methode: Distingue une ressource absente et une ressource difficile à obtenir.
    etape: Il y a bien un puits. Le problème, c'est la distance à parcourir.
  pieges:
  - si:
      contient:
      - a
    relance: Relis l'énoncé. Il y a bien un puits avec de l'eau.
  - si:
      contient:
      - c
    relance: En France, l'eau arrive au robinet. Ici, il faut marcher longtemps. Est-ce vraiment pareil ?
  solution: 'L''eau existe, mais son accès est difficile : c''est un inégal accès à l''eau, pas une absence totale d''eau.'
- id: expliquer-deux-domaines
  type: ouverte
  difficulte: 3
  enonce: Choisis deux domaines parmi l'eau, la santé et l'éducation, et donne un exemple d'inégalité pour chacun.
  criteres:
  - L'élève choisit deux domaines différents parmi l'eau, la santé et l'éducation.
  - L'élève donne un exemple concret et réaliste pour chaque domaine choisi.
  - L'élève compare au moins un exemple avec sa propre vie ou avec la France.
  indices:
    relance: 'Pense à ce que certains enfants n''ont pas facilement : de l''eau au robinet, un hôpital proche, une école proche.'
    methode: Choisis deux domaines différents, puis donne un exemple concret pour chacun.
    etape: 'Tu peux commencer ainsi : « Dans certaines régions du monde... »'
  solution: Dans certaines régions du monde, des enfants marchent plusieurs kilomètres pour trouver de l'eau, faute de robinet
    à la maison. Moi, j'ai l'eau au robinet. Dans d'autres régions, des enfants, surtout des filles, ne vont pas à l'école
    car elle est trop loin de chez eux.
