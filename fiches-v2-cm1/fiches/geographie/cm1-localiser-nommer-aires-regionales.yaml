format: 2
notion: cm1-localiser-nommer-aires-regionales
version: 3
etat: verifiee
declencheurs:
- comment s'appellent les grandes zones du monde
- les grandes régions sur la carte du monde
- placer les continents sur une carte
- nommer les zones du planisphère
- carte du monde entier
- où se trouve le Maghreb
- afrique au sud du Sahara
- asie du sud-est
prerequis: []
couverture: Se limite à nommer et situer sur un planisphère les huit aires régionales du repère officiel. Ne détaille pas
  la liste complète des pays de chaque aire.
essentiel: 'Le monde peut être découpé en grandes zones. On les appelle des aires régionales. Une aire régionale regroupe
  plusieurs pays proches les uns des autres.


  Pour les voir toutes en même temps, on utilise un planisphère. C''est une carte plate qui représente toute la surface de
  la Terre. On s''y repère grâce aux continents, aux océans et à l''équateur.


  Le programme demande de connaître huit aires régionales. En Afrique, il y en a deux. Le Maghreb est au nord, autour du Maroc,
  de l''Algérie et de la Tunisie. L''Afrique subsaharienne est au sud du désert du Sahara : « subsaharienne » veut dire «
  sous le Sahara ».


  Sur le continent américain, il y en a deux aussi. L''Amérique du Nord regroupe les États-Unis, le Canada et le Mexique.
  L''Amérique du Sud regroupe par exemple le Brésil et l''Argentine.


  En Asie, on distingue l''Asie de l''Est (la Chine, le Japon, la Corée) et l''Asie du Sud-Est (le Vietnam, la Thaïlande,
  l''Indonésie). Enfin, l''Europe et l''Océanie forment chacune une aire régionale.


  Astuce : le nom de l''aire contient souvent une direction (nord, sud, est). Elle t''aide à la placer sur la carte. Sur un
  planisphère, le nord est en haut, le sud en bas, l''est à droite.

  '
methode:
- Repérer sur le planisphère les grands océans qui séparent les continents.
- Repérer l'équateur et le haut de la carte, qui indique le nord.
- Trouver le continent sur lequel se situe l'aire régionale.
- Lire la direction contenue dans le nom de l'aire (nord, sud, est, sud-est) pour la placer dans le continent.
- Associer le nom de l'aire régionale à sa position sur la carte.
vocabulaire:
- terme: aire régionale
  definition: une grande zone du monde regroupant plusieurs pays proches, ayant des caractéristiques communes
- terme: planisphère
  definition: une carte plate qui représente toute la surface de la Terre
- terme: continent
  definition: une très grande étendue de terre, comme l'Afrique, l'Amérique, l'Asie ou l'Europe
- terme: Maghreb
  definition: l'aire régionale du nord de l'Afrique, autour du Maroc, de l'Algérie et de la Tunisie
- terme: Afrique subsaharienne
  definition: l'aire régionale de l'Afrique située au sud du désert du Sahara
- terme: équateur
  definition: une ligne imaginaire qui fait le tour de la Terre et la partage en deux moitiés, nord et sud
erreurs_frequentes:
- Confondre l'Asie de l'Est et l'Asie du Sud-Est.
- Confondre le Maghreb, au nord de l'Afrique, et l'Afrique subsaharienne, au sud du Sahara.
- Oublier que l'Océanie et l'Europe sont aussi des aires régionales, pas seulement des continents.
- Croire que le Mexique est en Amérique du Sud, alors qu'il fait partie de l'Amérique du Nord.
exemple:
  enonce: Cite deux aires régionales du continent africain et situe chacune.
  solution: Le Maghreb se situe au nord de l'Afrique, autour du Maroc, de l'Algérie et de la Tunisie. L'Afrique subsaharienne
    se situe au sud du désert du Sahara.
exercices:
- id: nommer-aire-etats-unis
  type: choix
  difficulte: 1
  enonce: Dans quelle aire régionale se trouvent les États-Unis ?
  reponse:
    options:
    - id: a
      texte: Amérique du Nord
    - id: b
      texte: Amérique du Sud
    - id: c
      texte: Europe
    bonnes:
    - a
  indices:
    relance: 'Regarde sur le planisphère où se trouve le Mexique par rapport aux États-Unis : au nord ou au sud ?'
    methode: Une aire régionale du continent américain regroupe les États-Unis, le Canada et le Mexique, en haut du continent.
    etape: Les États-Unis sont au nord du continent américain, pas au sud.
  pieges:
  - si:
      contient:
      - b
    relance: L'aire régionale citée dans cette réponse regroupe des pays comme le Brésil ou l'Argentine, plus au sud.
  - si:
      contient:
      - c
    relance: Les États-Unis ne sont pas sur le continent européen.
  solution: Les États-Unis se trouvent en Amérique du Nord, au nord du continent américain.
- id: aire-du-japon
  type: choix
  difficulte: 1
  enonce: Dans quelle aire régionale se trouve le Japon ?
  reponse:
    options:
    - id: a
      texte: Asie du Sud-Est
    - id: b
      texte: Asie de l'Est
    - id: c
      texte: Océanie
    bonnes:
    - b
  indices:
    relance: Le Japon est voisin de la Chine et de la Corée. Dans quelle aire régionale sont-elles ?
    methode: Relis la leçon. Elle range la Chine, le Japon et la Corée dans la même aire régionale d'Asie.
    etape: Le Vietnam, la Thaïlande et l'Indonésie forment une autre aire, plus au sud. Le Japon n'en fait pas partie.
  pieges:
  - si:
      contient:
      - a
    relance: Cette aire regroupe le Vietnam, la Thaïlande ou l'Indonésie. Le Japon est plus au nord.
  - si:
      contient:
      - c
    relance: Le Japon fait partie de l'Asie, pas de l'Océanie.
  solution: Le Japon se trouve en Asie de l'Est, avec la Chine et la Corée.
- id: associer-aire-continent
  type: association
  difficulte: 2
  enonce: Associe chaque aire régionale au continent auquel elle appartient.
  reponse:
    gauche:
    - id: a
      texte: Asie de l'Est
    - id: b
      texte: Maghreb
    - id: c
      texte: Amérique du Sud
    - id: d
      texte: Océanie
    droite:
    - id: x
      texte: Asie
    - id: y
      texte: Afrique
    - id: z
      texte: Amérique
    - id: w
      texte: Océanie
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Le nom de l'aire régionale contient parfois déjà le nom du continent.
    methode: Repère le mot du continent dans le nom de chaque aire régionale, quand il y est présent.
    etape: « Asie de l'Est » se trouve sur le continent asiatique.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie chaque aire régionale une par une.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord une aire régionale dont le nom contient déjà le continent, comme « Asie de l'Est ».
  solution: Asie de l'Est appartient à l'Asie, Maghreb à l'Afrique, Amérique du Sud à l'Amérique, Océanie est elle-même son
    continent.
- id: associer-pays-aire
  type: association
  difficulte: 2
  enonce: Associe chaque pays à son aire régionale.
  reponse:
    gauche:
    - id: a
      texte: Maroc
    - id: b
      texte: Brésil
    - id: c
      texte: Vietnam
    - id: d
      texte: Canada
    droite:
    - id: x
      texte: Maghreb
    - id: y
      texte: Amérique du Sud
    - id: z
      texte: Asie du Sud-Est
    - id: w
      texte: Amérique du Nord
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Commence par le pays que tu connais le mieux et cherche son continent.
    methode: Trouve d'abord le continent de chaque pays, puis la partie du continent (nord, sud, sud-est).
    etape: Le Canada et le Brésil sont tous les deux en Amérique. L'un est tout en haut du continent, l'autre plus bas.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie chaque pays un par un.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le seul pays d'Afrique de la liste, puis le seul pays d'Asie.
  solution: Le Maroc est au Maghreb, le Brésil en Amérique du Sud, le Vietnam en Asie du Sud-Est, le Canada en Amérique du
    Nord.
- id: ordonner-nord-sud-afrique
  type: ordre
  difficulte: 2
  enonce: Range ces trois aires régionales de la plus au nord à la plus au sud.
  reponse:
    elements:
    - id: europe
      texte: Europe
    - id: maghreb
      texte: Maghreb
    - id: subsaharienne
      texte: Afrique subsaharienne
  indices:
    relance: Laquelle de ces trois aires régionales se trouve juste au sud du désert du Sahara ?
    methode: Le mot « subsaharienne » veut dire « sous le Sahara », donc plus au sud. L'Europe est encore plus au nord que
      le Maghreb.
    etape: Le Maghreb regroupe des pays comme le Maroc, situés au nord de l'Afrique, au sud de l'Europe.
  pieges:
  - si:
      diagnostic: ordre_faux
    relance: 'Regarde le mot « subsaharienne » : il indique une position par rapport au Sahara.'
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux aires régionales voisines sont inversées. Laquelle est la plus au nord des deux ?'
  solution: L'Europe est la plus au nord, puis le Maghreb, puis l'Afrique subsaharienne, au sud du désert du Sahara.
- id: nombre-aires-regionales
  type: nombre
  difficulte: 2
  enonce: 'Compte les aires régionales de cette liste : Afrique subsaharienne, Maghreb, Amérique du Nord, Amérique du Sud,
    Asie du Sud-Est, Asie de l''Est, Europe, Océanie. Combien y en a-t-il ?'
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Compte chaque nom de la liste, un par un, en t'aidant de tes doigts.
    methode: Compte d'abord les aires d'Afrique, puis celles d'Amérique, puis celles d'Asie, puis les autres, et additionne.
    etape: 'Afrique : 2. Amérique : 2. Asie : 2. Il reste encore deux noms à compter.'
  pieges:
  - si:
      valeur: 6
    relance: Tu as oublié deux aires. As-tu compté l'Europe et l'Océanie ?
  - si:
      valeur: 7
    relance: Tu en as oublié une. Recompte la liste en entier, du premier au dernier nom.
  solution: 'Afrique : 2 (Afrique subsaharienne, Maghreb). Amérique : 2 (Amérique du Nord, Amérique du Sud). Asie : 2 (Asie
    du Sud-Est, Asie de l''Est). Plus l''Europe et l''Océanie : 2. Total : 2 + 2 + 2 + 2 = 8 aires régionales.'
- id: decrire-planisphere
  type: ouverte
  difficulte: 3
  enonce: Choisis deux aires régionales sur des continents différents et explique où elles se situent sur un planisphère.
  criteres:
  - L'élève nomme deux aires régionales appartenant à deux continents différents.
  - L'élève situe chacune par rapport à un repère géographique (océan, équateur, autre aire régionale).
  - L'élève emploie au moins une direction (nord, sud, est, ouest) pour situer une aire.
  indices:
    relance: Choisis une aire régionale d'Afrique ou d'Asie, et une autre d'Amérique ou d'Europe.
    methode: Pour chaque aire régionale choisie, indique un repère qui aide à la situer sur la carte.
    etape: 'Tu peux commencer ainsi : « Sur le planisphère, l''Europe se situe... »'
  solution: Sur le planisphère, l'Europe se situe au nord, entre l'océan Atlantique et l'Asie. L'Amérique du Sud se situe
    plus au sud, entre l'océan Pacifique et l'océan Atlantique.
- id: nblm-comment-appelle-t-on-une-grande-zone-du-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on une grande zone du monde regroupant plusieurs pays proches ayant des caractéristiques communes
    ?
  reponse:
    options:
    - id: o1
      texte: Une aire régionale
    - id: o2
      texte: Un continent
    - id: o3
      texte: Un planisphère
    - id: o4
      texte: Un pays
    bonnes:
    - o1
  indices:
    relance: Pense au terme géographique désignant un ensemble de pays voisins.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. Un continent est une vaste étendue de terre qui peut contenir plusieurs aires régionales.
  - si:
      contient:
      - o3
    relance: Faux. Un planisphère est la carte plate utilisée pour représenter la Terre, pas la zone géographique elle-même.
  solution: Une aire régionale. C'est exact ! Une aire régionale regroupe plusieurs pays voisins partageant des caractéristiques
    communes.
- id: nblm-comment-appelle-t-on-la-carte-plate-qui-2
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on la carte plate qui représente toute la surface de la Terre ?
  reponse:
    options:
    - id: o1
      texte: Un planisphère
    - id: o2
      texte: Un globe terrestre
    - id: o3
      texte: Une aire régionale
    - id: o4
      texte: Un continent
    bonnes:
    - o1
  indices:
    relance: Ce mot commence par 'plani-' car la carte est représentée à plat.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. Le globe terrestre est une représentation en forme de sphère (ronde) et non une carte plate.
  - si:
      contient:
      - o3
    relance: Faux. Une aire régionale est un espace géographique sur la Terre, pas un dessin cartographique.
  - si:
      contient:
      - o4
    relance: Faux. Un continent est une grande masse terrestre, pas une carte.
  solution: Un planisphère. C'est exact ! Le planisphère est la carte plate représentant l'ensemble de la surface terrestre.
- id: nblm-quelles-sont-les-deux-grandes-aires-regi-3
  type: choix
  difficulte: 2
  enonce: Quelles sont les deux grandes aires régionales que l'on distingue sur le continent africain ?
  reponse:
    options:
    - id: o1
      texte: Le Maghreb et l'Afrique subsaharienne
    - id: o2
      texte: L'Afrique du Nord et l'Asie du Sud-Est
    - id: o3
      texte: Le Maghreb et l'Amérique du Sud
    - id: o4
      texte: L'Afrique de l'Est et l'Afrique de l'Ouest
    bonnes:
    - o1
  indices:
    relance: Pense au grand désert du Sahara qui sépare le nord du reste du continent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. L'Asie du Sud-Est est une aire régionale située sur le continent asiatique.
  - si:
      contient:
      - o3
    relance: Faux. L'Amérique du Sud se situe sur le continent américain.
  solution: Le Maghreb et l'Afrique subsaharienne. C'est exact ! Le Maghreb se trouve au nord et l'Afrique subsaharienne se
    situe au sud du Sahara.
- id: nblm-ou-se-situe-le-maghreb-en-afrique-et-que-4
  type: choix
  difficulte: 2
  enonce: Où se situe le Maghreb en Afrique et quels pays en font notamment partie ?
  reponse:
    options:
    - id: o1
      texte: Au nord de l'Afrique (Maroc, Algérie, Tunisie)
    - id: o2
      texte: Au sud du Sahara (Brésil, Argentine)
    - id: o3
      texte: En Asie de l'Est (Chine, Japon, Corée)
    - id: o4
      texte: En Asie du Sud-Est (Vietnam, Thaïlande)
    bonnes:
    - o1
  indices:
    relance: Cherche la région située au nord du continent africain.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. Le Brésil et l'Argentine sont situés en Amérique du Sud.
  - si:
      contient:
      - o3
    relance: Faux. La Chine, le Japon et la Corée forment l'Asie de l'Est.
  - si:
      contient:
      - o4
    relance: Faux. Le Vietnam et la Thaïlande se trouvent en Asie du Sud-Est.
  solution: Au nord de l'Afrique (Maroc, Algérie, Tunisie). C'est exact ! Le Maghreb regroupe les pays situés au nord de l'Afrique
    comme le Maroc, l'Algérie et la Tunisie.
- id: nblm-quels-pays-composent-l-aire-regionale-de-5
  type: choix
  difficulte: 2
  enonce: Quels pays composent l'aire régionale de l'Asie de l'Est ?
  reponse:
    options:
    - id: o1
      texte: La Chine, le Japon et la Corée
    - id: o2
      texte: Le Vietnam, la Thaïlande et l'Indonésie
    - id: o3
      texte: Les États-Unis, le Canada et le Mexique
    - id: o4
      texte: Le Maroc, l'Algérie et la Tunisie
    bonnes:
    - o1
  indices:
    relance: Attention à ne pas confondre l'Asie de l'Est avec l'Asie du Sud-Est.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. Ces pays font partie de l'Asie du Sud-Est.
  - si:
      contient:
      - o3
    relance: Faux. Ces trois pays forment l'Amérique du Nord.
  - si:
      contient:
      - o4
    relance: Faux. Ces pays forment le Maghreb au nord de l'Afrique.
  solution: La Chine, le Japon et la Corée. C'est exact ! La Chine, le Japon et la Corée constituent l'Asie de l'Est.
- id: nblm-quelles-sont-les-deux-aires-regionales-s-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux aires régionales situées sur le continent américain ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: L'Amérique du Nord
    - id: o2
      texte: L'Amérique du Sud
    - id: o3
      texte: L'Afrique subsaharienne
    - id: o4
      texte: L'Asie de l'Est
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense à la séparation entre la partie nord et la partie sud de ce continent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Faux. L'Afrique subsaharienne se trouve sur le continent africain.
  - si:
      contient:
      - o4
    relance: Faux. L'Asie de l'Est se trouve sur le continent asiatique.
  solution: L'Amérique du Nord ; L'Amérique du Sud. C'est exact ! L'Amérique du Nord est une aire régionale du continent américain.
- id: nblm-en-afrique-la-grande-zone-situee-au-sud-7
  type: texte_court
  difficulte: 1
  enonce: En Afrique, la grande zone située au sud du désert du Sahara s'appelle l'Afrique _____.
  reponse:
    acceptees:
    - subsaharienne
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par 'sub-' et indique la situation au sud du Sahara.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: subsaharienne. C'est exact ! L'Afrique subsaharienne désigne la région située au sud du Sahara.
- id: nblm-en-asie-le-vietnam-la-thailande-et-l-ind-8
  type: texte_court
  difficulte: 1
  enonce: En Asie, le Vietnam, la Thaïlande et l'Indonésie font partie de l'Asie du _____.
  reponse:
    acceptees:
    - Sud-Est
    fautes_tolerees: 1
  indices:
    relance: Associe la direction vers le bas et vers la droite sur une carte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: Sud-Est. C'est exact ! Ces pays forment l'aire régionale de l'Asie du Sud-Est.
