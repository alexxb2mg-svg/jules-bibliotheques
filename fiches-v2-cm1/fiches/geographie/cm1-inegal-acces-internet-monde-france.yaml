format: 2
notion: cm1-inegal-acces-internet-monde-france
version: 3
etat: verifiee
declencheurs:
- pourquoi tout le monde n'a pas internet
- pourquoi la 4g ou la 5g n'est pas partout
- des régions du monde sans internet
- des villages sans bonne connexion
- pas de réseau à la campagne
- connexion lente chez mamie
- pays mal connectés
prerequis:
- cm1-fonctionnement-internet-cables-satellites
essentiel: 'Tout le monde n''a pas le même accès à Internet. Ces différences s''appellent des inégalités d''accès à Internet,
  ou inégalités numériques. On les observe à deux échelles : l''échelle mondiale et l''échelle de la France.


  À l''échelle mondiale, on utilise une carte du taux d''accès à Internet, pays par pays. Le taux d''accès, c''est la part
  de la population qui peut se connecter. La légende de la carte explique ce que veut dire chaque couleur.


  Certaines aires régionales, comme l''Europe ou l''Amérique du Nord, sont très bien reliées à Internet : la grande majorité
  de la population peut s''y connecter facilement.


  D''autres aires régionales, comme certaines parties de l''Afrique subsaharienne, sont faiblement reliées. Une partie importante
  de la population ne peut pas se connecter facilement, faute de câbles, de satellites ou d''appareils.


  En France aussi, il existe des inégalités. On les voit sur la carte du déploiement de la 5G. La 5G est une technologie récente
  et rapide de connexion mobile. Elle est d''abord installée dans les grandes villes. Dans certaines zones rurales, à la campagne,
  la connexion reste plus lente ou plus difficile.


  Attention : il y a deux inégalités différentes. Pouvoir se connecter ou pas, c''est l''accès. Se connecter vite ou lentement,
  c''est le débit.

  '
methode:
- 'Lire le titre de la carte pour savoir de quoi elle parle et à quelle échelle : le monde ou la France.'
- Lire la légende pour comprendre ce que veut dire chaque couleur.
- Repérer les zones les mieux connectées et les zones les moins bien connectées.
- Nommer une aire régionale très bien reliée et une aire régionale faiblement reliée à Internet.
- Pour la France, comparer les grandes villes et les zones rurales.
vocabulaire:
- terme: taux d'accès à Internet
  definition: la part de la population d'un pays qui peut se connecter à Internet
- terme: inégalités numériques
  definition: les différences entre les personnes ou les territoires pour se connecter à Internet
- terme: 5G
  definition: une technologie récente de connexion mobile à Internet, plus rapide que les précédentes, mais pas encore installée
    partout
- terme: déploiement
  definition: l'installation progressive d'une technologie sur un territoire
- terme: zone rurale
  definition: un espace de campagne, avec des villages et des champs, loin des grandes villes
- terme: débit
  definition: la vitesse d'une connexion à Internet
erreurs_frequentes:
- Croire que l'accès à Internet est le même partout dans le monde.
- Croire que les inégalités d'accès à Internet n'existent qu'entre pays, alors qu'elles existent aussi à l'intérieur de la
  France.
- 'Confondre avoir accès à Internet et avoir un bon débit (une connexion rapide) : les deux inégalités existent.'
- Lire une carte sans regarder sa légende, et se tromper sur le sens des couleurs.
exemple:
  enonce: Donne un exemple d'inégalité d'accès à Internet à l'échelle mondiale et un exemple à l'échelle française.
  solution: À l'échelle mondiale, l'Europe a un taux d'accès à Internet plus élevé qu'une partie de l'Afrique subsaharienne.
    À l'échelle française, la 5G est d'abord déployée dans les grandes villes, avant les zones rurales.
exercices:
- id: aire-forte-connexion
  type: choix
  difficulte: 1
  enonce: Laquelle de ces aires régionales a, en général, le taux d'accès à Internet le plus élevé ?
  reponse:
    options:
    - id: a
      texte: Europe
    - id: b
      texte: Afrique subsaharienne
    - id: c
      texte: Asie du Sud-Est
    bonnes:
    - a
  indices:
    relance: Pense à une aire régionale riche, avec beaucoup de câbles et d'infrastructures.
    methode: Les aires régionales les plus riches ont en général un taux d'accès à Internet plus élevé.
    etape: Cherche l'aire régionale riche, bien reliée par câbles, citée en premier dans les options.
  pieges:
  - si:
      contient:
      - b
    relance: Cette aire régionale a, en général, un taux d'accès à Internet plus faible que la première option proposée.
  - si:
      contient:
      - c
    relance: Cette aire régionale a un taux d'accès variable, mais moins élevé en moyenne que la première option proposée.
  solution: L'Europe a, en général, un taux d'accès à Internet parmi les plus élevés du monde.
- id: aire-faible-connexion
  type: choix
  difficulte: 1
  enonce: Laquelle de ces aires régionales est donnée en exemple d'aire faiblement reliée à Internet ?
  reponse:
    options:
    - id: a
      texte: Amérique du Nord
    - id: b
      texte: Europe
    - id: c
      texte: Afrique subsaharienne
    bonnes:
    - c
  indices:
    relance: Deux de ces aires régionales sont très bien reliées à Internet. Lesquelles ?
    methode: Élimine les aires régionales riches, où la grande majorité des habitants peut se connecter.
    etape: La leçon donne l'Europe en exemple d'aire très bien reliée. Compare les deux autres aires.
  pieges:
  - si:
      contient:
      - a
    relance: Cette aire régionale est très bien reliée à Internet. Cherche celle qui l'est faiblement.
  - si:
      contient:
      - b
    relance: Cette aire régionale est très bien reliée à Internet. Cherche celle qui l'est faiblement.
  solution: 'Une partie de l''Afrique subsaharienne est faiblement reliée à Internet : beaucoup d''habitants ne peuvent pas
    se connecter facilement.'
- id: echelle-inegalite
  type: association
  difficulte: 2
  enonce: 'Associe chaque exemple à son échelle : mondiale ou française.'
  reponse:
    gauche:
    - id: a
      texte: L'Europe est mieux connectée qu'une partie de l'Afrique subsaharienne
    - id: b
      texte: La 5G arrive d'abord dans les grandes villes françaises
    droite:
    - id: x
      texte: Échelle mondiale
    - id: y
      texte: Échelle française
    paires:
      a: x
      b: y
  indices:
    relance: L'un des deux exemples compare des aires régionales du monde, l'autre compare des zones à l'intérieur d'un seul
      pays.
    methode: Repère si l'exemple parle de plusieurs continents ou uniquement de la France.
    etape: 'Le premier exemple compare deux continents différents : c''est à l''échelle mondiale.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque exemple.
  - si:
      diagnostic: associations_fausses
    relance: 'Repère d''abord l''exemple qui compare deux continents : il est à l''échelle mondiale.'
  solution: Comparer l'Europe et l'Afrique subsaharienne est à l'échelle mondiale. Comparer les grandes villes et les campagnes
    françaises est à l'échelle française.
- id: mot-5g
  type: texte_court
  difficulte: 2
  enonce: Quelle technologie récente de connexion mobile est d'abord installée dans les grandes villes françaises ?
  reponse:
    acceptees:
    - 5g
    - la 5g
    fautes_tolerees: 0
  indices:
    relance: C'est une technologie plus récente que la 4G.
    methode: Cherche le nom de la technologie mobile la plus récente, composée d'un chiffre et d'une lettre.
    etape: Le nom commence par le chiffre 5.
  pieges:
  - si:
      valeur: 4g
    relance: La 4G est plus ancienne et déjà largement installée. Cherche la technologie plus récente.
  solution: La 5G est la technologie récente d'abord installée dans les grandes villes françaises.
- id: ou-arrive-5g
  type: choix
  difficulte: 2
  enonce: D'après la carte du déploiement de la 5G en France, où la 5G est-elle installée en premier ?
  reponse:
    options:
    - id: a
      texte: Dans les grandes villes
    - id: b
      texte: Dans les zones rurales isolées
    - id: c
      texte: Partout en même temps
    bonnes:
    - a
  indices:
    relance: Où vivent le plus de personnes qui utilisent leur téléphone ?
    methode: Une nouvelle technologie n'est pas installée partout en même temps. On commence là où il y a beaucoup d'habitants.
    etape: À la campagne, la connexion reste souvent plus lente. La 5G n'y arrive donc pas en premier.
  pieges:
  - si:
      contient:
      - b
    relance: Dans les zones rurales, la connexion est souvent plus difficile. La 5G n'y arrive pas en premier.
  - si:
      contient:
      - c
    relance: Le déploiement se fait petit à petit. Ce n'est pas partout en même temps.
  solution: La 5G est installée d'abord dans les grandes villes. Certaines zones rurales restent moins bien connectées.
- id: mot-zone-rurale
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on un espace de campagne, avec des villages et des champs ? Complète « une zone ... ».
  reponse:
    acceptees:
    - rurale
    - zone rurale
    - une zone rurale
    fautes_tolerees: 1
  indices:
    relance: C'est le contraire d'une zone urbaine, qui désigne la ville.
    methode: Relis le vocabulaire de ta leçon sur la 5G en France.
    etape: C'est l'adjectif que ta leçon emploie pour les zones où la 5G arrive après les grandes villes.
  pieges:
  - si:
      valeur: urbaine
    relance: Une zone urbaine, c'est la ville. Cherche le mot pour la campagne.
  - si:
      valeur: campagne
    relance: C'est bien l'idée. Cherche l'adjectif qui veut dire « de la campagne ».
  solution: On parle de zone rurale. C'est un espace de campagne, loin des grandes villes.
- id: expliquer-deux-echelles
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi on peut dire qu'Internet est inégalement accessible, en donnant un exemple à l'échelle mondiale
    et un exemple à l'échelle française.
  criteres:
  - L'élève cite un exemple d'inégalité d'accès à Internet entre deux aires régionales du monde.
  - L'élève cite un exemple d'inégalité d'accès à Internet à l'intérieur de la France (par exemple la 5G).
  - L'élève donne au moins une raison ou une conséquence de cette inégalité (manque de câbles, connexion lente...).
  indices:
    relance: Pense d'abord à une différence entre deux continents, puis à une différence entre des villes françaises.
    methode: Donne un exemple pour chaque échelle, en expliquant pourquoi c'est inégal.
    etape: 'Tu peux commencer ainsi : « À l''échelle mondiale... »'
  solution: À l'échelle mondiale, l'Europe a un accès à Internet plus élevé qu'une partie de l'Afrique subsaharienne, qui
    manque de câbles et d'infrastructures. À l'échelle française, la 5G est d'abord installée dans les grandes villes, tandis
    que certaines zones rurales restent moins bien connectées.
