    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : confondre le taux d''accès (la possibilité de se connecter) et le débit (la vitesse de la
      connexion).'
  - si:
      contient:
      - o3
    relance: 'Erreur : les satellites sont des outils matériels, pas la mesure de la population connectée.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le taux d''accès concerne la proportion d''habitants connectés, pas une valeur financière.'
  solution: 'La part de la population d''un pays qui peut se connecter à Internet. C''est exact : cet indicateur mesure la
    proportion d''habitants qui ont la possibilité de se connecter au réseau.'
