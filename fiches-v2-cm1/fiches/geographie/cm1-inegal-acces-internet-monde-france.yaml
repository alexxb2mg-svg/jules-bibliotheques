- id: nblm-qu-est-ce-que-la-5g-selon-la-fiche-de-vo-3
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que la 5G selon la fiche de vocabulaire du CM1 ?
  reponse:
    options:
    - id: o1
      texte: Une technologie récente de connexion mobile à Internet, plus rapide
    - id: o2
      texte: Un câble sous-marin qui traverse les océans
    - id: o3
      texte: Un satellite qui tourne autour de la Terre
    - id: o4
      texte: Un ancien modèle d'ordinateur d'école
    bonnes:
    - o1
  indices:
    relance: Il s'agit d'un réseau sans fil récent pour téléphone portable permettant une navigation très rapide.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : il ne faut pas confondre le réseau mobile sans fil (5G) et les câbles physiques posés au fond des mers.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la 5G fonctionne grâce à des réseaux terrestres mobiles, pas par des satellites en orbite.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la 5G désigne un réseau de communication sans fil, pas un appareil informatique.'
  solution: 'Une technologie récente de connexion mobile à Internet, plus rapide. C''est correct : la 5G est une technologie
    récente de connexion mobile plus rapide, mais pas encore installée partout.'
- id: nblm-pourquoi-une-partie-de-la-population-dan-4
  type: choix
  difficulte: 2
  enonce: Pourquoi une partie de la population dans certaines régions du monde ne peut-elle pas se connecter facilement à
    Internet ?
  reponse:
    options:
    - id: o1
      texte: Par manque de câbles, de satellites ou d'appareils
    - id: o2
      texte: Parce qu'Internet est interdit sur la planète
    - id: o3
      texte: Parce que les câbles sous-marins n'existent plus
    - id: o4
      texte: Parce que personne ne souhaite se connecter
    bonnes:
    - o1
  indices:
    relance: Pense au matériel et aux infrastructures indispensables pour faire circuler et recevoir les données.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : Internet existe et est largement utilisé là où les réseaux matériels sont présents.'
  - si:
      contient:
      - o3
    relance: 'Erreur : les câbles sous-marins constituent toujours la dorsale principale du réseau Internet mondial.'
  - si:
      contient:
      - o4
    relance: 'Erreur : les difficultés d''accès découlent d''un manque d''équipements et de réseaux, pas d''un refus des habitants.'
  solution: 'Par manque de câbles, de satellites ou d''appareils. C''est la bonne réponse : l''absence d''infrastructures
    physiques (câbles, satellites) et de matériel empêche une connexion aisée.'
- id: nblm-que-designe-precisement-l-expression-tau-5
  type: choix
  difficulte: 2
  enonce: Que désigne précisément l'expression « taux d'accès à Internet » ?
  reponse:
    options:
    - id: o1
      texte: La part de la population d'un pays qui peut se connecter à Internet
    - id: o2
      texte: La vitesse maximale de téléchargement d'un fichier
