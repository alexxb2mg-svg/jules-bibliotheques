format: 2
notion: cm1-fonctionnement-internet-cables-satellites
version: 2
etat: verifiee
declencheurs:
- comment marche internet dans le monde
- comment les messages voyagent sous l'océan
- comment internet arrive chez nous
- comment les vidéos voyagent d'un pays à l'autre
- des fils au fond de la mer
- à quoi sert internet
- regarder des vidéos en ligne
- envoyer un message très loin
prerequis: []
couverture: 'Se limite aux usages courants d''Internet et à son fonctionnement matériel à l''échelle mondiale : câbles sous-marins,
  câbles continentaux et satellites. Ne traite pas l''inégal accès à Internet, vu dans une autre fiche, ni le fonctionnement
  technique détaillé (protocoles, serveurs).'
essentiel: 'Internet permet d''envoyer et de recevoir des informations partout dans le monde, presque instantanément. On s''en
  sert de beaucoup de façons. Par exemple, on envoie des messages, on regarde des vidéos, on fait des recherches pour un exposé,
  on joue ou on parle avec sa famille éloignée.


  Pour faire voyager ces informations, Internet repose surtout sur un immense réseau de câbles. Un réseau, c''est un ensemble
  de lignes reliées entre elles, comme une toile d''araignée qui couvre le monde.


  Il y a deux sortes de câbles. Les câbles continentaux passent sur la terre ferme : ils relient les villes à l''intérieur
  d''un même continent. Les câbles sous-marins sont posés au fond des océans : ils relient les continents et les aires régionales
  entre eux.


  Les câbles sous-marins ne sont pas posés au hasard. Certaines zones en concentrent un très grand nombre, comme l''océan
  Atlantique entre l''Europe et l''Amérique du Nord.


  Internet utilise aussi des satellites. Ce sont des appareils qui tournent autour de la Terre et envoient les informations
  par les airs. Ils sont surtout utiles pour les zones difficiles à relier par câble, comme les régions isolées.


  Par exemple, quand tu envoies une photo à un cousin aux États-Unis, elle voyage dans des câbles en Europe, puis dans un
  câble sous-marin au fond de l''Atlantique, puis à nouveau dans des câbles en Amérique du Nord.

  '
methode:
- Citer ce que l'on fait sur Internet (messages, vidéos, recherches, jeux).
- 'Distinguer les deux moyens matériels utilisés par Internet : les câbles et les satellites.'
- Distinguer les câbles continentaux, à l'intérieur d'un continent, et les câbles sous-marins, entre les continents.
- Suivre sur une carte le trajet d'une information d'un continent à un autre.
- Repérer une zone du monde où les câbles sous-marins sont très concentrés.
vocabulaire:
- terme: Internet
  definition: un réseau mondial qui permet d'échanger des informations (messages, photos, vidéos) entre ordinateurs et téléphones
- terme: réseau
  definition: un ensemble de lignes ou de câbles reliés entre eux
- terme: câble continental
  definition: un câble posé sur la terre ferme qui relie des villes d'un même continent
- terme: câble sous-marin
  definition: un câble posé au fond des océans qui relie deux continents pour faire passer les informations d'Internet
- terme: satellite
  definition: un appareil qui tourne autour de la Terre et qui peut envoyer des informations d'Internet par les airs
erreurs_frequentes:
- Croire qu'Internet fonctionne uniquement grâce aux satellites, alors que la plupart des informations passent par des câbles.
- Confondre câble continental (à l'intérieur d'un continent) et câble sous-marin (entre les continents).
- Croire que les câbles sous-marins sont posés au hasard, alors qu'ils sont concentrés sur certains trajets précis.
- Croire qu'Internet est « dans l'air » ou « dans le téléphone » seulement, en oubliant le réseau matériel qui le fait fonctionner.
exemple:
  enonce: Explique comment un message envoyé depuis la France peut arriver aux États-Unis.
  solution: Le message passe d'abord par des câbles continentaux en Europe. Il traverse ensuite l'océan Atlantique dans un
    câble sous-marin, qui relie l'Europe à l'Amérique du Nord. Il arrive enfin aux États-Unis par d'autres câbles.
exercices:
- id: moyen-principal-internet
  type: choix
  difficulte: 1
  enonce: Par quel moyen la majorité des informations d'Internet circulent-elles dans le monde ?
  reponse:
    options:
    - id: a
      texte: Des câbles, notamment sous-marins
    - id: b
      texte: Uniquement des satellites
    - id: c
      texte: Des avions qui transportent des données
    bonnes:
    - a
  indices:
    relance: Pense à ce qui est posé au fond des océans pour relier les continents.
    methode: Un réseau de câbles, dont certains passent sous les océans, transporte la majorité des informations d'Internet.
    etape: Les satellites existent, mais ils ne sont pas le moyen principal.
  pieges:
  - si:
      contient:
      - b
    relance: Les satellites existent aussi, mais la majorité des informations passent par des câbles, pas seulement par les
      airs.
  - si:
      contient:
      - c
    relance: Les avions ne transportent pas les informations d'Internet.
  solution: La majorité des informations d'Internet circulent grâce à un réseau de câbles, notamment des câbles sous-marins.
- id: usage-internet
  type: choix
  difficulte: 1
  enonce: Laquelle de ces activités utilise Internet ?
  reponse:
    options:
    - id: a
      texte: Lire un livre en papier
    - id: b
      texte: Envoyer un message à un cousin qui habite loin
    - id: c
      texte: Jouer au ballon dans la cour
    bonnes:
    - b
  indices:
    relance: Laquelle de ces activités a besoin d'un téléphone, d'une tablette ou d'un ordinateur connecté ?
    methode: Internet sert à échanger des informations à distance. Cherche l'activité qui fait voyager une information.
    etape: Un livre en papier et un ballon fonctionnent sans connexion. Il reste une seule activité.
  pieges:
  - si:
      contient:
      - a
    relance: Un livre en papier se lit sans aucune connexion. Cherche une activité qui envoie une information à distance.
  - si:
      contient:
      - c
    relance: Jouer au ballon ne demande aucune connexion. Cherche une activité qui envoie une information à distance.
  solution: Envoyer un message à un cousin qui habite loin utilise Internet. L'information voyage à travers le réseau.
- id: associer-cable-usage
  type: association
  difficulte: 2
  enonce: Associe chaque type de câble à son usage.
  reponse:
    gauche:
    - id: a
      texte: Câble continental
    - id: b
      texte: Câble sous-marin
    droite:
    - id: x
      texte: Relie des villes à l'intérieur d'un même continent
    - id: y
      texte: Relie deux continents en passant sous l'océan
    paires:
      a: x
      b: y
  indices:
    relance: Le mot « sous-marin » te donne un indice sur où se trouve ce câble.
    methode: Repère si le câble relie des lieux proches (même continent) ou très éloignés (deux continents).
    etape: « Continental » veut dire à l'intérieur d'un continent.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux définitions.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le câble sous-marin, posé sous l'océan entre deux continents.
  solution: Le câble continental relie des villes d'un même continent. Le câble sous-marin relie deux continents en passant
    sous l'océan.
- id: mot-satellite
  type: texte_court
  difficulte: 2
  enonce: Quel appareil, qui tourne autour de la Terre, permet aussi de transmettre des informations d'Internet, en plus des
    câbles ?
  reponse:
    acceptees:
    - satellite
    - satellites
    - un satellite
    - les satellites
    fautes_tolerees: 1
  indices:
    relance: 'Il n''est pas posé au sol ni sous l''eau : il tourne dans l''espace, autour de la Terre.'
    methode: Cherche le mot qui désigne un appareil placé en orbite autour de la Terre.
    etape: Le mot commence par « sate- ».
  pieges:
  - si:
      valeur: antenne
    relance: Une antenne reste au sol. Cherche l'appareil qui tourne autour de la Terre, dans l'espace.
  solution: Le satellite est l'appareil qui tourne autour de la Terre et transmet aussi des informations d'Internet.
- id: trajet-photo-france-etats-unis
  type: ordre
  difficulte: 2
  enonce: Une photo est envoyée de France vers les États-Unis. Range les étapes de son trajet dans l'ordre.
  reponse:
    elements:
    - id: europe
      texte: La photo circule dans des câbles continentaux en Europe
    - id: ocean
      texte: La photo traverse l'océan Atlantique dans un câble sous-marin
    - id: amerique
      texte: La photo circule dans des câbles en Amérique du Nord
    - id: arrivee
      texte: La photo s'affiche sur l'écran du cousin
  indices:
    relance: Où se trouve la photo au tout début de son voyage ?
    methode: Suis le trajet sur une carte, de la France jusqu'aux États-Unis, sans sauter d'étape.
    etape: Pour passer d'un continent à l'autre, la photo doit traverser l'océan. Cette étape est au milieu du trajet.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. La photo peut-elle arriver en Amérique avant d''avoir traversé
      l''océan ?'
  - si:
      diagnostic: ordre_faux
    relance: Commence par ce qui se passe en Europe, et termine par l'écran du cousin.
  solution: La photo circule d'abord dans des câbles en Europe, puis traverse l'Atlantique dans un câble sous-marin, puis
    circule dans des câbles en Amérique du Nord, et enfin s'affiche sur l'écran du cousin.
- id: zone-concentration-cables
  type: choix
  difficulte: 2
  enonce: Quelle zone est un exemple de forte concentration de câbles sous-marins ?
  reponse:
    options:
    - id: a
      texte: Le désert du Sahara
    - id: b
      texte: L'océan Atlantique entre l'Europe et l'Amérique du Nord
    - id: c
      texte: Le sommet des montagnes
    bonnes:
    - b
  indices:
    relance: Où pose-t-on un câble sous-marin ?
    methode: Un câble sous-marin est posé au fond de l'eau. Élimine les zones sans océan.
    etape: Le désert et les montagnes ne sont pas sous l'eau. Il reste une seule réponse.
  pieges:
  - si:
      contient:
      - a
    relance: Un désert n'a pas d'océan. Un câble sous-marin se pose au fond de l'eau.
  - si:
      contient:
      - c
    relance: Les montagnes ne sont pas sous l'eau. Un câble sous-marin se pose au fond de l'océan.
  solution: L'océan Atlantique, entre l'Europe et l'Amérique du Nord, concentre un très grand nombre de câbles sous-marins.
- id: expliquer-fonctionnement-internet
  type: ouverte
  difficulte: 3
  enonce: Explique, avec les mots « câbles » et « satellites », comment Internet relie les continents entre eux.
  criteres:
  - L'élève explique que des câbles, notamment sous-marins, relient les continents.
  - L'élève mentionne les satellites comme second moyen de transmission.
  - L'élève donne un exemple d'usage d'Internet ou de trajet d'une information.
  indices:
    relance: Pense à ce qui passe sous les océans et à ce qui tourne au-dessus de la Terre.
    methode: Explique d'abord le rôle des câbles, puis celui des satellites.
    etape: 'Tu peux commencer ainsi : « Internet relie les continents grâce à... »'
  solution: Internet relie les continents grâce à un réseau de câbles, dont des câbles sous-marins posés au fond des océans.
    Il utilise aussi des satellites, qui tournent autour de la Terre et transmettent des informations par les airs, notamment
    vers les zones difficiles à relier par câble.
