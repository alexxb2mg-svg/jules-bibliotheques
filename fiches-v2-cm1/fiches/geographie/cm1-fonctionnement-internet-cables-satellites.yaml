  enonce: Dans quel cas les satellites sont-ils principalement utiles pour transmettre Internet ?
  reponse:
    options:
    - id: o1
      texte: Pour connecter les régions isolées et difficiles d'accès par câble.
    - id: o2
      texte: Pour remplacer l'ensemble des câbles sous-marins du monde.
    - id: o3
      texte: Pour faire rouler les trains plus vite.
