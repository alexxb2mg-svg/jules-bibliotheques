    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : les câbles sous-marins ne sont pas posés au hasard, mais concentrés sur des trajets très
      précis.'
  - si:
      contient:
      - o3
    relance: 'Faux : ce n''est pas au centre de la banquise du pôle Nord que se trouvent les grandes concentrations de câbles.'
  - si:
      contient:
      - o4
    relance: 'Faux : les câbles sous-marins relient les continents à travers les océans.'
  solution: 'Dans l''océan Atlantique, entre l''Europe et l''Amérique du Nord. C''est exact : l''océan Atlantique concentre
    un très grand nombre de câbles sous-marins.'
