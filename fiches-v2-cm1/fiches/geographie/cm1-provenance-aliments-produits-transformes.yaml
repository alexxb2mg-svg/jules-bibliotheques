# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-provenance-aliments-produits-transformes
version: 3
etat: verifiee
declencheurs:
- d'où vient ce que je mange
- comment on fabrique un yaourt
- comment on fait les biscuits
- d'où viennent les fruits du marché
- de la ferme au magasin
- fabriqué dans une usine
- le lait de la vache
- lire l'étiquette du paquet
prerequis:
- cm1-diversite-pratiques-alimentaires
couverture: Se limite à la provenance des aliments courants et à la distinction entre produit agricole et produit transformé,
  illustrée par une chaîne de production simple (yaourt, biscuit, fruit). Ne détaille pas le transport international des marchandises.
essentiel: 'Les aliments que nous mangeons ne viennent pas tous du même endroit. Ils ne sont pas non plus fabriqués de la
  même façon. Certains viennent d''une ferme proche, d''autres de régions ou de pays lointains. Sur l''emballage, l''étiquette
  indique souvent d''où vient le produit.


  Un produit agricole est récolté ou élevé directement, sans transformation. Par exemple, une pomme est cueillie dans un verger.
  Le lait est trait dans une ferme. Une carotte est récoltée dans un champ.


  Un produit alimentaire transformé est fabriqué à partir d''un ou de plusieurs produits agricoles, dans une usine ou un atelier.
  Un yaourt est fabriqué à partir de lait. Un biscuit est fabriqué à partir de farine de blé, de sucre et d''œufs. Même un
  produit transformé a donc toujours une origine agricole.


  La chaîne de production, ce sont toutes les étapes qui mènent un aliment jusqu''à ton assiette. Pour un yaourt : le lait
  est collecté dans les fermes, transporté vers une laiterie, transformé en yaourt, puis emballé et envoyé dans les magasins.


  Pour un fruit, la chaîne est plus courte : il est cueilli, trié, emballé, transporté, puis vendu. Il n''y a pas d''étape
  de transformation.


  Attention : le magasin est le lieu où l''on achète l''aliment. Ce n''est pas le lieu où il est produit ou fabriqué.

  '
methode:
- Nommer l'aliment étudié (au goûter, à la cantine, à la maison).
- Se demander s'il est récolté ou élevé tel quel (produit agricole) ou fabriqué à partir d'autres produits (produit transformé).
- Retrouver le ou les produits agricoles de départ.
- Repérer les grandes étapes, de la ferme ou du champ jusqu'au magasin.
- Mettre ces étapes dans l'ordre chronologique.
vocabulaire:
- terme: produit agricole
  definition: un aliment récolté ou élevé directement, sans transformation
- terme: produit alimentaire transformé
  definition: un aliment fabriqué à partir d'un ou plusieurs produits agricoles, dans une usine ou un atelier
- terme: chaîne de production
  definition: toutes les étapes qui mènent un aliment du champ ou de la ferme jusqu'au magasin
- terme: provenance
  definition: le lieu d'où vient un produit
- terme: laiterie
  definition: une usine où l'on transforme le lait, par exemple en yaourt
erreurs_frequentes:
- Croire qu'un produit transformé n'a pas d'origine agricole (un biscuit vient bien de la farine, donc du blé).
- Inverser les étapes de la chaîne de production, par exemple emballer avant de transformer.
- Confondre le lieu de vente (le magasin) et le lieu de fabrication (l'usine ou la ferme).
- Croire que tous les aliments viennent de la même région, alors que leur provenance varie.
exemple:
  enonce: Explique la différence entre une pomme et un yaourt du point de vue de leur fabrication.
  solution: 'Une pomme est un produit agricole : elle est cueillie directement dans un verger. Un yaourt est un produit transformé
    : il est fabriqué à partir de lait, dans une laiterie.'
exercices:
- id: definir-produit-agricole
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un produit agricole ?
  reponse:
    options:
    - id: a
      texte: Un aliment récolté ou élevé directement, sans transformation
    - id: b
      texte: Un aliment fabriqué en usine à partir de plusieurs ingrédients
    - id: c
      texte: Un aliment vendu uniquement en supermarché
    bonnes:
    - a
  indices:
    relance: 'Pense à une pomme cueillie dans un verger : a-t-elle été transformée avant d''être mangée ?'
    methode: 'Un produit agricole n''a pas besoin d''usine pour exister : il est récolté ou élevé tel quel.'
    etape: Élimine la réponse qui parle d'usine et celle qui parle du lieu de vente.
  pieges:
  - si:
      contient:
      - b
    relance: C'est la définition d'un produit transformé, pas d'un produit agricole.
  - si:
      contient:
      - c
    relance: Le lieu de vente ne dit rien sur la façon dont l'aliment a été produit.
  solution: Un produit agricole est récolté ou élevé directement, sans transformation, comme une pomme ou du lait.
- id: origine-du-yaourt
  type: choix
  difficulte: 1
  enonce: À partir de quel produit agricole fabrique-t-on le yaourt ?
  reponse:
    options:
    - id: a
      texte: Le blé
    - id: b
      texte: Le lait
    - id: c
      texte: La pomme
    bonnes:
    - b
  indices:
    relance: Le yaourt est fabriqué dans une laiterie. Que transforme-t-on dans une laiterie ?
    methode: Pense à ce qu'on collecte dans les fermes pour l'emmener à la laiterie.
    etape: Le blé sert à faire de la farine. Parmi les deux autres produits, lequel part des fermes vers la laiterie ?
  pieges:
  - si:
      contient:
      - a
    relance: Le blé donne de la farine, utilisée pour les biscuits ou le pain. Le yaourt vient d'un autre produit.
  - si:
      contient:
      - c
    relance: La pomme est un fruit. Le yaourt est fabriqué dans une laiterie, à partir d'un autre produit.
  solution: Le yaourt est fabriqué à partir du lait, collecté dans les fermes puis transformé dans une laiterie.
- id: chaine-production-yaourt
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes de la fabrication d'un yaourt, de la ferme au magasin.
  reponse:
    elements:
    - id: collecte
      texte: Le lait est collecté dans les fermes
    - id: transport
      texte: Le lait est transporté vers une laiterie
    - id: transformation
      texte: Le lait est transformé en yaourt dans la laiterie
    - id: vente
      texte: Le yaourt emballé est envoyé et vendu en magasin
  indices:
    relance: Où commence le lait, et où finit le yaourt ?
    methode: Place d'abord la première étape (la ferme) et la dernière (le magasin), puis range les deux autres entre elles.
    etape: Le lait doit d'abord être collecté, avant même d'être transporté.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Laquelle vient juste avant l''autre ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la toute première étape, à la ferme, et la toute dernière, au magasin.
  solution: Le lait est collecté dans les fermes, transporté vers une laiterie, transformé en yaourt dans la laiterie, puis
    emballé et vendu en magasin.
- id: chaine-production-fruit
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes qui mènent une pomme du verger jusqu'au magasin.
  reponse:
    elements:
    - id: cueillette
      texte: La pomme est cueillie dans le verger
    - id: tri
      texte: Les pommes sont triées et mises en cagettes
    - id: transport
      texte: Les cagettes sont transportées en camion
    - id: vente
      texte: Les pommes sont vendues au magasin
  indices:
    relance: Que faut-il faire en tout premier pour avoir une pomme ?
    methode: Place d'abord l'étape dans le verger et l'étape au magasin, puis range les deux autres entre elles.
    etape: On ne peut pas mettre une pomme en cagette avant de l'avoir cueillie.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Peut-on transporter les cagettes avant de les remplir ?'
  - si:
      diagnostic: ordre_faux
    relance: Commence par ce qui se passe dans le verger, et termine par ce qui se passe au magasin.
  solution: 'La pomme est cueillie, puis triée et mise en cagette, puis transportée en camion, puis vendue au magasin. Il
    n''y a pas d''étape de transformation : c''est un produit agricole.'
- id: associer-aliment-categorie
  type: association
  difficulte: 2
  enonce: Associe chaque aliment à sa catégorie.
  reponse:
    gauche:
    - id: a
      texte: Pomme
    - id: b
      texte: Lait
    - id: c
      texte: Biscuit
    - id: d
      texte: Yaourt
    droite:
    - id: x
      texte: Produit agricole
    - id: y
      texte: Produit alimentaire transformé
    paires:
      a: x
      b: x
      c: y
      d: y
  indices:
    relance: La pomme et le lait sont-ils transformés en usine avant d'être mangés ?
    methode: Demande-toi, pour chaque aliment, s'il existe déjà tel quel dans la nature ou la ferme, ou s'il faut le fabriquer.
    etape: 'La pomme se mange telle qu''elle est cueillie : c''est un produit agricole.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie chaque aliment un par un.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la pomme, un produit agricole simple, pour t'aider à classer les autres.
  solution: Pomme et lait sont des produits agricoles. Biscuit et yaourt sont des produits alimentaires transformés.
- id: mot-chaine-production
  type: texte_court
  difficulte: 3
  enonce: Comment appelle-t-on l'ensemble des étapes qui mènent un aliment de la ferme jusqu'au magasin ? Complète « la chaîne
    de ... ».
  reponse:
    acceptees:
    - production
    - la production
    - chaîne de production
    - la chaîne de production
    fautes_tolerees: 1
  indices:
    relance: Pense au yaourt. Collecte, transport, transformation, emballage, vente... Comment la leçon appelle-t-elle cette
      suite d'étapes ?
    methode: Relis le vocabulaire de ta leçon. Une expression désigne toutes les étapes de fabrication d'un aliment.
    etape: Relis la partie de ta leçon qui commence par « La chaîne de ... » et recopie le mot qui manque.
  pieges:
  - si:
      valeur: fabrication
    relance: L'idée est juste, mais ce n'est pas le mot de la leçon. Relis ton vocabulaire.
  - si:
      valeur: transformation
    relance: La transformation n'est qu'une des étapes. Cherche le mot qui désigne toute la suite d'étapes.
  solution: On parle de la chaîne de production. Elle va du produit agricole de départ jusqu'à la vente en magasin.
- id: expliquer-chaine-production
  type: ouverte
  difficulte: 3
  enonce: Choisis un aliment transformé (yaourt, biscuit...) et explique en trois étapes sa chaîne de production, du produit
    agricole de départ jusqu'au magasin.
  criteres:
  - L'élève cite le ou les produits agricoles de départ.
  - L'élève décrit au moins une étape de transformation dans une usine ou un atelier.
  - L'élève termine par la vente en magasin.
  indices:
    relance: Choisis un aliment que tu manges souvent et qui est fabriqué à partir d'un autre produit.
    methode: Commence par le produit agricole de départ, puis explique où et comment il est transformé, puis où il est vendu.
    etape: 'Tu peux commencer ainsi : « Le biscuit est fabriqué à partir de farine de blé... »'
  solution: Le biscuit est fabriqué à partir de farine de blé, de sucre et d'œufs. Ces produits agricoles sont transformés
    dans une biscuiterie, où la pâte est cuite. Les biscuits sont ensuite emballés et vendus en magasin.
- id: nblm-d-ou-vient-ce-que-je-mange-quand-je-cons-1
  type: choix
  difficulte: 2
  enonce: D'où vient ce que je mange quand je consomme un produit agricole comme une pomme ?
  reponse:
    options:
    - id: o1
      texte: Elle est cueillie directement dans un verger, sans transformation.
    - id: o2
      texte: Elle est fabriquée dans une usine à partir de plusieurs ingrédients.
    - id: o3
      texte: Elle est créée dans un laboratoire sans origine agricole.
    - id: o4
      texte: Elle est fabriquée dans le magasin avant d'être vendue.
    bonnes:
    - o1
  indices:
    relance: Pense à la manière dont pousse le fruit sur un arbre avant d'arriver dans ton assiette.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : la pomme n''est pas fabriquée en usine, c''est un produit agricole brut.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la pomme pousse naturellement sur un pommier dans un verger.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : l''erreur est de confondre le lieu de vente (le magasin) et le lieu de production (le verger).'
  solution: 'Elle est cueillie directement dans un verger, sans transformation. C''est juste : un produit agricole est récolté
    ou élevé directement dans la nature, sans aucune transformation.'
- id: nblm-d-ou-viennent-les-fruits-du-marche-comme-2
  type: choix
  difficulte: 2
  enonce: D'où viennent les fruits du marché comme les pommes ou les oranges ?
  reponse:
    options:
    - id: o1
      texte: Ce sont des produits agricoles récoltés directement dans la nature (verger, champ).
    - id: o2
      texte: Ce sont des produits transformés fabriqués dans une laiterie.
    - id: o3
      texte: Ce me sont des produits fabriqués directement sur l'étal du marchand.
    - id: o4
      texte: Ce sont des aliments créés en usine en mélangeant de la farine et du sucre.
    bonnes:
    - o1
  indices:
    relance: Demande-toi si les fruits ont besoin d'être fabriqués dans une usine ou s'ils poussent dans la nature.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : la laiterie transforme le lait en yaourt, elle ne produit pas de fruits.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : l''erreur classique est de confondre le lieu de vente (le marché) et le lieu de récolte (la ferme
      ou le verger).'
  - si:
      contient:
      - o4
    relance: 'C''est faux : mélanger de la farine et du sucre permet de fabriquer des biscuits, pas des fruits.'
  solution: 'Ce sont des produits agricoles récoltés directement dans la nature (verger, champ). C''est juste : les fruits
    vendus sur le marché sont des produits agricoles cueillis directement sans être transformés.'
- id: nblm-comment-on-fabrique-un-yaourt-a-partir-d-3
  type: choix
  difficulte: 2
  enonce: Comment on fabrique un yaourt à partir des produits de la ferme ?
  reponse:
    options:
    - id: o1
      texte: En collectant le lait trait dans les fermes, puis en le transformant dans une laiterie.
    - id: o2
      texte: En cueillant directement les pots de yaourt sur des arbres fruitiers.
    - id: o3
      texte: En mélangeant uniquement de la farine et du sucre dans le magasin.
    - id: o4
      texte: En emballant le lait au magasin avant de le transformer.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi quel aliment liquide issu des vaches est indispensable pour faire du yaourt.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : le yaourt n''est pas un fruit, c''est un aliment transformé à partir du lait.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la farine et le sucre servent à faire des biscuits, et le magasin est seulement le lieu de vente.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : l''erreur est d''inverser les étapes, car l''emballage se fait après la transformation en laiterie.'
  solution: 'En collectant le lait trait dans les fermes, puis en le transformant dans une laiterie. C''est juste : le yaourt
    est un produit transformé fabriqué dans une laiterie à partir d''un produit agricole (le lait).'
- id: nblm-comment-on-fait-les-biscuits-si-l-on-reg-4
  type: choix
  difficulte: 2
  enonce: Comment on fait les biscuits si l'on regarde l'origine de leurs ingrédients ?
  reponse:
    options:
    - id: o1
      texte: Ils sont fabriqués en usine en transformant des produits agricoles (farine de blé, sucre, œufs).
    - id: o2
      texte: Ils sont cueillis directement dans les champs de biscuits.
    - id: o3
      texte: Ils sont fabriqués sans aucun produit d'origine agricole.
    - id: o4
      texte: Ils sont récoltés directement sous forme de pâte dans un verger.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux ingrédients de base (farine, œufs) et à leur provenance dans les fermes et les champs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : l''erreur est de croire que les biscuits poussent naturellement dans les champs.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : c''est une erreur fréquente de croire qu''un produit transformé n''a pas d''origine agricole,
      alors que la farine vient du blé.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : un verger produit des fruits, pas de la pâte à biscuit.'
  solution: 'Ils sont fabriqués en usine en transformant des produits agricoles (farine de blé, sucre, œufs). C''est juste
    : le biscuit est un produit transformé issu de plusieurs ingrédients d''origine agricole.'
- id: nblm-quel-est-l-ordre-chronologique-correct-d-5
  type: choix
  difficulte: 2
  enonce: Quel est l'ordre chronologique correct de la chaîne de production d'un yaourt ?
  reponse:
    options:
    - id: o1
      texte: Collecte du lait à la ferme -> Transport -> Transformation en laiterie -> Emballage -> Magasin
    - id: o2
      texte: Magasin -> Emballage -> Transformation en laiterie -> Collecte du lait à la ferme
    - id: o3
      texte: Emballage -> Transformation en laiterie -> Collecte du lait -> Magasin
    - id: o4
      texte: Transformation en laiterie -> Magasin -> Collecte du lait -> Emballage
    bonnes:
    - o1
  indices:
    relance: Suis le chemin du lait depuis l'animal jusqu'au rayon du magasin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : cet ordre représente la chaîne complètement à l''envers.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : une erreur fréquente est d''inverser les étapes en emballant le produit avant de le transformer.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : on ne peut pas transformer le lait en laiterie avant de l''avoir collecté à la ferme.'
  solution: 'Collecte du lait à la ferme -> Transport -> Transformation en laiterie -> Emballage -> Magasin. C''est juste
    : la chaîne de production commence à la ferme pour se terminer dans le magasin.'
- id: nblm-quelles-sont-les-deux-affirmations-vraie-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations vraies concernant la provenance des aliments ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un produit agricole est récolté ou élevé directement, sans transformation.
    - id: o2
      texte: Un produit alimentaire transformé est fabriqué à partir d'un ou plusieurs produits agricoles.
    - id: o3
      texte: Les produits transformés n'ont jamais aucune origine agricole.
    - id: o4
      texte: Le magasin où l'on achète l'aliment est toujours le lieu où il a été fabriqué.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie les définitions exactes du produit agricole et du produit transformé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : les produits transformés sont toujours faits à partir de produits agricoles de base.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : il ne faut pas confondre le lieu de vente (magasin) et le lieu de fabrication (usine, laiterie,
      ferme).'
  solution: 'Un produit agricole est récolté ou élevé directement, sans transformation ; Un produit alimentaire transformé
    est fabriqué à partir d''un ou plusieurs produits agricoles. C''est juste : c''est la définition exacte d''un produit
    agricole (comme la pomme ou le lait).'
- id: nblm-un-aliment-recolte-ou-eleve-directement-7
  type: texte_court
  difficulte: 1
  enonce: Un aliment récolté ou élevé directement dans la nature, sans transformation (comme une pomme ou du lait), est appelé
    un produit __________ .
  reponse:
    acceptees:
    - agricole
    fautes_tolerees: 1
  indices:
    relance: Pense au mot en rapport avec le travail de la ferme et des champs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'agricole. C''est juste : un produit agricole est récolté ou élevé directement, sans transformation.'
- id: nblm-un-aliment-fabrique-dans-une-usine-ou-un-8
  type: texte_court
  difficulte: 1
  enonce: Un aliment fabriqué dans une usine ou une laiterie à partir de produits agricoles (comme un yaourt ou un biscuit)
    est appelé un produit __________ .
  reponse:
    acceptees:
    - transformé
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne un aliment qui a été modifié ou fabriqué en atelier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'transformé. C''est juste : un produit transformé est fabriqué à partir d''un ou plusieurs produits agricoles.'
sources:
