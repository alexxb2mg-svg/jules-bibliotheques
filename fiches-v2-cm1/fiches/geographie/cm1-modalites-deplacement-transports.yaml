format: 2
notion: cm1-modalites-deplacement-transports
version: 3
etat: verifiee
declencheurs:
- comment on se déplace dans le monde
- les différents moyens de transport
- combien de temps pour aller loin
- se déplacer à pied ou en voiture
- prendre l'avion
- aller à la gare
- trajet pour l'école
- prendre le métro
prerequis: []
essentiel: 'Se déplacer, c''est aller d''un lieu à un autre. Chaque jour, les élèves de la classe se déplacent : pour aller
  à l''école, au sport ou chez un ami. Le premier moyen de se déplacer, c''est la marche.


  On peut observer ses déplacements à différentes échelles de temps. Dans une journée : la maison, l''école, le parc. Dans
  une semaine : la piscine, le marché, les grands-parents. Pendant les vacances, on va parfois beaucoup plus loin.


  Chaque mode de transport utilise une infrastructure : un lieu ou une voie construits pour lui. L''avion part de l''aéroport.
  Le bateau part du port. Le train s''arrête à la gare. La voiture roule sur la route. Le métro s''arrête à la station. Le
  vélo roule sur la voie cyclable.


  On choisit son mode de déplacement selon la distance à parcourir. Pour un trajet court, on marche ou on prend le vélo. Pour
  aller dans une autre ville, on prend la voiture ou le train. Pour aller sur un autre continent, on prend l''avion, ou parfois
  le bateau.


  On mesure un déplacement de deux façons. La distance kilométrique dit combien de kilomètres on parcourt. La distance en
  temps dit combien de minutes ou d''heures dure le trajet.


  Attention : un même trajet ne dure pas le même temps selon le mode de transport. Par exemple, aller à la piscine à 3 kilomètres
  prend bien plus de temps à pied qu''en voiture.

  '
methode:
- Repérer d'où l'on part et où l'on va.
- 'Estimer la distance à parcourir : courte, moyenne ou très longue.'
- Choisir le mode de transport adapté à cette distance.
- Associer ce mode de transport à son infrastructure (gare, port, aéroport, station, route, voie cyclable).
- Dire la mesure du trajet en kilomètres (distance kilométrique) ou en minutes et en heures (distance en temps).
vocabulaire:
- terme: déplacement
  definition: le fait d'aller d'un lieu à un autre, à pied ou avec un moyen de transport
- terme: mode de transport
  definition: le moyen utilisé pour se déplacer, comme le train, l'avion ou le vélo
- terme: infrastructure
  definition: un lieu ou une voie construits pour un mode de transport, comme une gare, un port ou une route
- terme: voie cyclable
  definition: une voie réservée aux vélos
- terme: distance kilométrique
  definition: la longueur d'un trajet mesurée en kilomètres
- terme: distance en temps
  definition: la durée d'un trajet, mesurée en minutes ou en heures
erreurs_frequentes:
- Croire qu'un trajet plus court en kilomètres est toujours plus rapide (cela dépend du mode de transport).
- Confondre l'infrastructure et le mode de transport, par exemple dire « gare » pour parler du train lui-même.
- Oublier que la marche est aussi un mode de déplacement, utilisé pour de courtes distances.
- Oublier le trajet du retour quand on calcule le temps passé à se déplacer dans une journée ou une semaine.
exemple:
  enonce: Cite un mode de transport adapté à une courte distance et un mode adapté à une très longue distance, avec leur infrastructure.
  solution: Pour une courte distance, on peut marcher ou prendre un vélo, sur une voie cyclable. Pour une très longue distance,
    entre deux continents par exemple, on prend l'avion, qui part d'un aéroport.
exercices:
- id: transport-tres-longue-distance
  type: choix
  difficulte: 1
  enonce: Quel mode de transport utilise-t-on le plus souvent pour parcourir une très longue distance entre deux continents
    ?
  reponse:
    options:
    - id: a
      texte: Avion
    - id: b
      texte: Vélo
    - id: c
      texte: À pied
    bonnes:
    - a
  indices:
    relance: Quel est le mode de transport le plus rapide pour aller très loin ?
    methode: Pense à un mode de transport qui utilise un aéroport et qui va très vite.
    etape: Le vélo et la marche ne conviennent que pour de courtes distances.
  pieges:
  - si:
      contient:
      - b
    relance: Le vélo convient pour de courtes distances, pas pour traverser un océan.
  - si:
      contient:
      - c
    relance: La marche convient pour de très courtes distances, pas pour parcourir des milliers de kilomètres.
  solution: L'avion est le mode de transport utilisé pour parcourir une très longue distance entre deux continents.
- id: infrastructure-metro
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle l'arrêt où l'on monte dans le métro et où l'on en descend ?
  reponse:
    acceptees:
    - station
    - une station
    - station de métro
    fautes_tolerees: 1
  indices:
    relance: Le train s'arrête à la gare. Le métro, lui, s'arrête à un autre endroit. Comment l'appelle-t-on ?
    methode: Relis la liste des infrastructures de ta leçon et cherche celle qui va avec le métro.
    etape: Ce n'est ni la gare, ni le port, ni l'aéroport. Cherche le mot que la leçon associe au métro.
  pieges:
  - si:
      valeur: gare
    relance: La gare, c'est pour le train. Pour le métro, on emploie un autre mot.
  - si:
      valeur: arret
    relance: C'est bien un arrêt. Quel est le nom précis de l'arrêt du métro ?
  solution: Le métro s'arrête à la station.
- id: associer-transport-infrastructure
  type: association
  difficulte: 2
  enonce: Associe chaque mode de transport à son infrastructure.
  reponse:
    gauche:
    - id: a
      texte: Avion
    - id: b
      texte: Bateau
    - id: c
      texte: Train
    - id: d
      texte: Vélo
    droite:
    - id: x
      texte: Aéroport
    - id: y
      texte: Port
    - id: z
      texte: Gare
    - id: w
      texte: Voie cyclable
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Où un train s'arrête-t-il pour prendre des voyageurs ?
    methode: Repère l'infrastructure associée à chaque mode de transport dans ta leçon.
    etape: L'avion utilise l'aéroport, comme le train utilise la gare.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie chaque mode de transport un par un.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord l'avion et son aéroport, pour t'aider à classer les autres.
  solution: L'avion utilise l'aéroport, le bateau utilise le port, le train utilise la gare, le vélo utilise la voie cyclable.
- id: deux-unites-mesure
  type: texte_court
  difficulte: 2
  enonce: Outre le kilomètre, quelle autre unité permet de mesurer un déplacement ?
  reponse:
    acceptees:
    - temps
    - le temps
    - heure
    - heures
    - minute
    - minutes
    fautes_tolerees: 1
  indices:
    relance: On peut dire « c'est à 10 kilomètres » ou « c'est à... » quoi d'autre ?
    methode: Pense à la façon dont on répond souvent à la question « c'est loin ? » sans donner de kilomètres.
    etape: Pense à une façon de répondre à « c'est loin ? » qui ne soit pas un nombre de kilomètres.
  pieges:
  - si:
      valeur: distance
    relance: La distance kilométrique est déjà une des deux unités. Cherche l'autre façon de mesurer un trajet.
  solution: On peut aussi mesurer un déplacement en temps (minutes ou heures), en plus de la distance kilométrique.
- id: ranger-trajets-distance
  type: ordre
  difficulte: 2
  enonce: Range ces trajets du plus court au plus long, en kilomètres.
  reponse:
    elements:
    - id: cour
      texte: Aller de la classe à la cour de récréation
    - id: quartier
      texte: Aller à la boulangerie du quartier
    - id: ville
      texte: Aller dans une autre ville de la région
    - id: continent
      texte: Aller sur un autre continent
  indices:
    relance: Lequel de ces trajets peut se faire en quelques pas, sans sortir de l'école ?
    methode: Place d'abord le trajet le plus court et le plus long, puis range les deux autres entre eux.
    etape: Le trajet qui demande de traverser un océan est forcément le dernier. Lequel vient juste avant ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux trajets voisins sont inversés. Lequel des deux demande le moins de kilomètres ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par le trajet qu'on fait à pied en une minute, et termine par celui qui demande de prendre l'avion.
  solution: La classe vers la cour (quelques mètres), puis la boulangerie du quartier, puis une autre ville de la région,
    puis un autre continent (des milliers de kilomètres).
- id: distance-en-temps-plus-longue
  type: choix
  difficulte: 2
  enonce: Pour un même trajet de 10 kilomètres, avec quel mode de déplacement la distance en temps est-elle la plus longue
    ?
  reponse:
    options:
    - id: a
      texte: La voiture
    - id: b
      texte: La marche
    - id: c
      texte: Le train
    bonnes:
    - b
  indices:
    relance: Lequel de ces moyens avance le moins vite ?
    methode: Les kilomètres sont les mêmes pour tous. Plus on avance lentement, plus le trajet dure longtemps.
    etape: La voiture et le train vont beaucoup plus vite qu'une personne sans véhicule.
  pieges:
  - si:
      contient:
      - a
    relance: La voiture parcourt 10 kilomètres assez vite. Cherche le moyen le plus lent.
  - si:
      contient:
      - c
    relance: Le train va très vite. Cherche le moyen qui avance le plus lentement.
  solution: 'La marche : 10 kilomètres à pied demandent beaucoup de temps, alors qu''en voiture ou en train il faut beaucoup
    moins de temps. La distance kilométrique est la même, mais la distance en temps change.'
- id: temps-marche-semaine
  type: nombre
  difficulte: 3
  enonce: Chaque jour d'école, Léa marche 10 minutes pour aller à l'école et 10 minutes pour rentrer chez elle. Elle va à
    l'école 4 jours par semaine. Combien de minutes marche-t-elle en tout dans la semaine pour ces trajets ?
  reponse:
    valeur: 80
    forme: entier
  indices:
    relance: Combien de minutes Léa marche-t-elle en une seule journée d'école, aller et retour compris ?
    methode: Calcule d'abord le temps de marche d'une journée, puis multiplie par le nombre de jours d'école.
    etape: 'En une journée : 10 + 10 = 20 minutes. Il reste à compter pour tous les jours d''école de la semaine.'
  pieges:
  - si:
      valeur: 20
    relance: C'est le temps d'une seule journée. Léa va à l'école plusieurs jours dans la semaine.
  - si:
      valeur: 40
    relance: As-tu oublié le trajet du retour ? Léa marche aussi pour rentrer chez elle.
  solution: 'En une journée : 10 + 10 = 20 minutes. Dans la semaine : 20 × 4 = 80 minutes. Vérification : 4 allers de 10 minutes
    (40) et 4 retours de 10 minutes (40), soit 40 + 40 = 80 minutes.'
- id: expliquer-choix-transport
  type: ouverte
  difficulte: 3
  enonce: Explique comment tu te déplaces pour aller à l'école, puis explique comment tu ferais pour te rendre dans un autre
    pays très lointain.
  criteres:
  - L'élève décrit un mode de déplacement adapté à une courte distance (marche, vélo, voiture...).
  - L'élève décrit un mode de transport adapté à une très longue distance (avion, bateau...).
  - L'élève nomme l'infrastructure utilisée ou donne une mesure du trajet (en kilomètres ou en temps).
  indices:
    relance: Pense à comment tu te déplaces chaque jour, puis à comment tu partirais en vacances très loin.
    methode: Choisis un mode de transport pour chaque distance, puis explique pourquoi il est adapté.
    etape: 'Tu peux commencer ainsi : « Pour aller à l''école, je... »'
  solution: Pour aller à l'école, je marche ou je prends le vélo car c'est une courte distance. Pour me rendre dans un pays
    très lointain, je prendrais l'avion, car c'est le mode de transport le plus rapide pour une très longue distance.
- id: nblm-comment-appelle-t-on-la-duree-necessaire-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on la durée nécessaire pour réaliser un trajet, mesurée en minutes ou en heures ?
  reponse:
    options:
    - id: o1
      texte: La distance en temps
    - id: o2
      texte: La distance kilométrique
    - id: o3
      texte: L'infrastructure de transport
    - id: o4
      texte: La vitesse maximale
    bonnes:
    - o1
  indices:
    relance: Pense au temps que tu peux mesurer avec une montre durant un voyage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention, c''est une erreur fréquente : la distance kilométrique mesure la longueur du trajet en kilomètres,
      pas sa durée.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : une infrastructure désigne un équipement comme la gare ou l''aéroport, et non une mesure de temps.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : la vitesse indique l''allure du véhicule, pas la durée totale du trajet.'
  solution: La distance en temps. C'est exact ! La distance en temps mesure la durée d'un déplacement en minutes ou en heures.
- id: nblm-quel-mode-de-transport-est-le-plus-adapt-2
  type: choix
  difficulte: 2
  enonce: Quel mode de transport est le plus adapté pour voyager d'un continent à un autre sur une très longue distance ?
  reponse:
    options:
    - id: o1
      texte: L'avion
    - id: o2
      texte: La voiture
    - id: o3
      texte: Le vélo
    - id: o4
      texte: Le métro
    bonnes:
    - o1
  indices:
    relance: Recherche le moyen de transport qui vole dans les airs au départ d'un aéroport.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la voiture circule sur les routes et ne permet pas d''effectuer de très longs trajets entre
      continents séparés par des océans.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : le vélo est un moyen de transport réservé aux courtes distances.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : le métro circule uniquement au sein d''une ville ou d''une agglomération.'
  solution: L'avion. C'est exact ! L'avion permet de parcourir de très grandes distances entre continents rapidement.
- id: nblm-quelle-est-la-difference-essentielle-ent-3
  type: choix
  difficulte: 2
  enonce: Quelle est la différence essentielle entre la gare et le train ?
  reponse:
    options:
    - id: o1
      texte: La gare est l'infrastructure et le train est le moyen de transport.
    - id: o2
      texte: La gare est le moyen de transport et le train est l'infrastructure.
    - id: o3
      texte: La gare et le train sont deux mots pour désigner le même véhicule.
    - id: o4
      texte: Le train circule dans le ciel et la gare se trouve sur l'océan.
    bonnes:
    - o1
  indices:
    relance: L'un est le bâtiment dans lequel on attend, l'autre est le véhicule sur rails.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : on confond souvent l''infrastructure fixe (la gare) et le véhicule en mouvement (le train).'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la gare est un bâtiment d''accueil tandis que le train est le véhicule roulant sur les rails.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : les gares et les trains appartiennent au réseau ferroviaire terrestre.'
  solution: La gare est l'infrastructure et le train est le moyen de transport. C'est exact ! Il convient de ne pas confondre
    le lieu d'embarquement (l'infrastructure) et le véhicule qui se déplace.
- id: nblm-un-trajet-ayant-une-distance-kilometriqu-4
  type: choix
  difficulte: 2
  enonce: Un trajet ayant une distance kilométrique plus courte est-il toujours plus rapide qu'un trajet plus long ?
  reponse:
    options:
    - id: o1
      texte: Non, car la durée dépend aussi du mode de transport choisi.
    - id: o2
      texte: Oui, car un nombre de kilomètres inférieur garantit un temps plus court.
    - id: o3
      texte: Oui, la distance kilométrique et la distance en temps sont toujours identiques.
    - id: o4
      texte: Non, la marche à pied est toujours plus rapide que les véhicules motorisés.
    bonnes:
    - o1
  indices:
    relance: Compare la vitesse d'un piéton sur 2 km à celle d'un TGV sur 10 km.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : on oublie que le mode de transport influe fortement sur la durée.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la longueur en kilomètres et la durée en minutes sont deux notions différentes.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : la marche à pied est en général plus lente que les véhicules.'
  solution: Non, car la durée dépend aussi du mode de transport choisi. C'est exact ! Par exemple, un trajet court à pied
    peut prendre plus de temps qu'un trajet plus long en train rapide.
- id: nblm-quel-mode-de-deplacement-est-particulier-5
  type: choix
  difficulte: 2
  enonce: Quel mode de déplacement est particulièrement adapté pour de très courtes distances du quotidien ?
  reponse:
    options:
    - id: o1
      texte: La marche à pied
    - id: o2
      texte: L'avion
    - id: o3
      texte: Le bateau
    - id: o4
      texte: Le train à grande vitesse
    bonnes:
    - o1
  indices:
    relance: Pense au moyen de déplacement que tu utilises avec tes jambes sans aucun véhicule.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''avion est réservé aux très longues distances et non aux petits déplacements quotidiens.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : le bateau s''utilise sur des voies navigables et nécessite des installations portuaires.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : le train à grande vitesse est conçu pour relier des villes éloignées.'
  solution: La marche à pied. C'est exact ! La marche est le mode de déplacement le plus simple et adapté pour les courtes
    distances.
- id: nblm-quelles-associations-entre-un-mode-de-tr-6
  type: choix
  difficulte: 3
  enonce: Quelles associations entre un mode de transport et son infrastructure sont correctes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le vélo avec la voie cyclable
    - id: o2
      texte: L'avion avec l'aéroport
    - id: o3
      texte: Le train avec l'aéroport
    - id: o4
      texte: La voiture avec la station de métro
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux associations qui apparient correctement le véhicule avec son installation de transport.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : le train utilise une gare ferroviaire, pas un aéroport.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la voiture circule sur le réseau routier, alors que la station dessert le métro.'
  solution: Le vélo avec la voie cyclable ; L'avion avec l'aéroport. C'est exact ! La voie cyclable est l'aménagement réservé
    à la circulation du vélo.
- id: nblm-comment-appelle-t-on-l-infrastructure-am-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on l'infrastructure aménagée pour accueillir les bateaux lors de leurs déplacements ?
  reponse:
    acceptees:
    - le port
    fautes_tolerees: 1
  indices:
    relance: C'est un aménagement côtier ou fluvial indispensable aux navires.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: le port. C'est exact ! Le port est l'infrastructure bordant l'eau dédiée à l'embarquement et au stationnement
    des navires.
- id: nblm-comment-appelle-t-on-la-mesure-d-un-depl-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la mesure d'un déplacement exprimée en kilomètres ?
  reponse:
    acceptees:
    - distance kilométrique
    fautes_tolerees: 1
  indices:
    relance: Cette expression comprend l'unité de mesure utilisée pour mesurer les longueurs sur route.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: distance kilométrique. C'est exact ! La distance kilométrique indique la longueur physique d'un parcours.
