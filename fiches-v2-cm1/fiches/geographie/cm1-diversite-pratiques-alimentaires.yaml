format: 2
notion: cm1-diversite-pratiques-alimentaires
version: 2
etat: verifiee
declencheurs:
- pourquoi on ne mange pas pareil partout
- des pays ont plus à manger que d'autres
- manger différemment selon les pays
- pourquoi certains enfants n'ont pas assez à manger
- les repas dans les autres pays
- pas assez de nourriture
- des enfants qui ont faim
prerequis: []
couverture: Se limite à la diversité des pratiques alimentaires et à la différence entre un pays où l'alimentation est abondante
  et un pays où elle est insuffisante, avec des exemples de pays sur des continents différents. Ne traite pas la provenance
  des aliments ni la chaîne de production, vues dans une autre fiche.
essentiel: 'Dans le monde, on ne mange pas tous la même chose, ni en même quantité. Les plats, les goûts, les heures des repas
  et les façons de manger changent d''un pays à l''autre, et même d''une famille à l''autre. C''est la diversité des pratiques
  alimentaires.


  Il faut distinguer deux choses. Manger différemment, c''est une question de goûts et d''habitudes. Manger insuffisamment,
  c''est un manque de nourriture.


  Dans certains pays, dits « pays riches », la nourriture est abondante et variée. On y trouve facilement des produits venus
  du monde entier, toute l''année. Les magasins sont pleins. On dit que la ration alimentaire, c''est-à-dire la quantité de
  nourriture mangée chaque jour, y est très riche. C''est le cas par exemple en France (en Europe) et aux États-Unis (en Amérique
  du Nord).


  Dans d''autres pays, dits « pays en développement », une partie de la population n''a pas assez à manger pour rester en
  bonne santé : c''est la sous-nutrition. C''est le cas par exemple à Madagascar (en Afrique) et en Haïti (en Amérique), où
  beaucoup d''habitants manquent régulièrement de nourriture.


  Ces différences s''expliquent par la richesse du pays, mais aussi par le climat, les guerres ou les catastrophes naturelles
  qui peuvent détruire les récoltes.


  Attention : sur un même continent, on peut trouver un pays riche et un pays en développement. Par exemple, les États-Unis
  et Haïti sont tous les deux en Amérique.

  '
methode:
- Lire le nom du pays étudié.
- Chercher sur quel continent il se trouve.
- Repérer si c'est un pays riche ou un pays en développement.
- Décrire son alimentation (abondante et variée, ou insuffisante).
- Comparer deux pays riches situés sur deux continents différents, puis deux pays à alimentation insuffisante situés sur deux
  continents différents.
vocabulaire:
- terme: pratiques alimentaires
  definition: les habitudes d'une population pour se nourrir (ce qu'elle mange, quand et comment)
- terme: ration alimentaire
  definition: la quantité de nourriture qu'une personne mange chaque jour
- terme: sous-nutrition
  definition: le fait de ne pas manger assez pour rester en bonne santé
- terme: malnutrition
  definition: le fait de mal se nourrir, par exemple en ne mangeant pas assez ou pas assez varié
- terme: pays riche
  definition: un pays où la plupart des habitants ont de quoi vivre, et où la nourriture est abondante
- terme: pays en développement
  definition: un pays où une partie importante de la population manque de ressources, par exemple de nourriture
erreurs_frequentes:
- Croire que tous les pays d'un même continent ont la même alimentation.
- Confondre « manger différemment » (goûts, habitudes) et « manger insuffisamment » (manque de nourriture).
- Oublier qu'un pays riche et un pays en développement peuvent tous les deux exister sur un même continent.
- Choisir deux pays du même continent alors que l'exercice demande deux continents différents.
exemple:
  enonce: Cite un pays où l'alimentation est abondante et un pays où elle est insuffisante, situés sur deux continents différents.
  solution: La France (Europe) a une alimentation abondante et variée. Madagascar (Afrique) connaît une alimentation insuffisante
    pour une partie de sa population.
exercices:
- id: pays-alimentation-abondante
  type: choix
  difficulte: 1
  enonce: Dans lequel de ces pays la nourriture est-elle abondante et variée pour la grande majorité des habitants ?
  reponse:
    options:
    - id: a
      texte: France
    - id: b
      texte: Madagascar
    - id: c
      texte: Haïti
    bonnes:
    - a
  indices:
    relance: Pense à un pays d'Europe où les magasins sont pleins toute l'année.
    methode: Un pays riche a une alimentation abondante. Un pays en développement a souvent une alimentation insuffisante
      pour une partie de sa population.
    etape: Parmi ces trois pays, un seul est un pays riche d'Europe.
  pieges:
  - si:
      contient:
      - b
    relance: Madagascar est un pays où une partie de la population manque de nourriture. Cherche plutôt un pays riche.
  - si:
      contient:
      - c
    relance: Haïti est un pays où une partie de la population manque de nourriture. Cherche plutôt un pays riche.
  solution: 'La France est un pays riche : son alimentation est abondante et variée pour la grande majorité des habitants.'
- id: continent-madagascar
  type: choix
  difficulte: 1
  enonce: Sur quel continent se trouve Madagascar ?
  reponse:
    options:
    - id: a
      texte: Europe
    - id: b
      texte: Amérique
    - id: c
      texte: Afrique
    bonnes:
    - c
  indices:
    relance: Madagascar est une grande île. Près de quel continent se trouve-t-elle sur le planisphère ?
    methode: Relis ta leçon. Chaque pays cité est suivi de son continent entre parenthèses.
    etape: La France est en Europe, Haïti et les États-Unis en Amérique. Madagascar est sur le continent qui reste.
  pieges:
  - si:
      contient:
      - a
    relance: L'Europe est le continent de la France. Madagascar est sur un autre continent.
  - si:
      contient:
      - b
    relance: L'Amérique est le continent d'Haïti et des États-Unis. Madagascar est sur un autre continent.
  solution: Madagascar se trouve en Afrique.
- id: associer-pays-continent-alimentation
  type: association
  difficulte: 2
  enonce: Associe chaque pays à sa situation alimentaire.
  reponse:
    gauche:
    - id: a
      texte: France
    - id: b
      texte: États-Unis
    - id: c
      texte: Madagascar
    - id: d
      texte: Haïti
    droite:
    - id: x
      texte: Alimentation abondante et variée
    - id: y
      texte: Alimentation insuffisante pour une partie des habitants
    paires:
      a: x
      b: x
      c: y
      d: y
  indices:
    relance: La France et les États-Unis sont deux pays riches. Madagascar et Haïti sont deux pays en développement.
    methode: Commence par les deux pays que tu connais le mieux, puis déduis les deux autres.
    etape: 'La France est en Europe, les États-Unis en Amérique du Nord : ce sont deux pays riches.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revérifie chaque pays un par un.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la France, un pays riche d'Europe, pour t'aider à classer les autres.
  solution: France et États-Unis ont une alimentation abondante et variée. Madagascar et Haïti connaissent une alimentation
    insuffisante pour une partie de la population.
- id: mot-sous-nutrition
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le fait de ne pas manger assez pour rester en bonne santé ?
  reponse:
    acceptees:
    - sous-nutrition
    - sous nutrition
    - la sous-nutrition
    fautes_tolerees: 1
  indices:
    relance: 'Le mot commence par « sous- », comme dans « sous-marin » : il y a un manque.'
    methode: 'Relis le vocabulaire de ta leçon : un mot désigne le manque de nourriture pour rester en bonne santé.'
    etape: Le mot est formé de « sous » et d'un mot qui veut dire « le fait de se nourrir ».
  pieges:
  - si:
      valeur: famine
    relance: La famine est une situation extrême. Cherche plutôt le mot qui désigne, plus largement, le manque de nourriture.
  - si:
      valeur: malnutrition
    relance: Ce mot existe, mais il veut dire « mal se nourrir ». Cherche le mot qui commence par « sous- ».
  solution: 'Le mot est « sous-nutrition » : il désigne le fait de ne pas manger assez pour rester en bonne santé.'
- id: differemment-ou-insuffisamment
  type: association
  difficulte: 2
  enonce: 'Associe chaque situation à ce qu''elle montre : une habitude différente ou un manque de nourriture.'
  reponse:
    gauche:
    - id: a
      texte: Dans une famille, on dîne tard le soir
    - id: b
      texte: Un enfant ne mange qu'un petit repas par jour faute de nourriture
    - id: c
      texte: Dans un pays, on mange souvent du poisson
    droite:
    - id: x
      texte: Manger différemment
    - id: y
      texte: Manger insuffisamment
    paires:
      a: x
      b: y
      c: x
  indices:
    relance: Dans quelle situation la personne n'a-t-elle pas assez à manger ?
    methode: 'Pour chaque situation, demande-toi : est-ce un choix ou une habitude, ou bien un manque ?'
    etape: Dîner tard est une habitude. Ce n'est pas un manque de nourriture.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Cherche la seule situation où il manque de la nourriture.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la situation où l'enfant manque de nourriture, puis classe les deux autres.
  solution: Dîner tard et manger souvent du poisson sont des habitudes différentes. Ne manger qu'un petit repas par jour faute
    de nourriture est un manque de nourriture.
- id: deux-continents-ration-riche
  type: choix
  difficulte: 3
  enonce: On cherche deux pays à ration alimentaire très riche, situés sur deux continents différents. Quelle paire convient
    ?
  reponse:
    options:
    - id: a
      texte: La France et les États-Unis
    - id: b
      texte: Madagascar et Haïti
    - id: c
      texte: Les États-Unis et Haïti
    bonnes:
    - a
  indices:
    relance: Vérifie deux choses pour chaque paire. Les deux pays sont-ils riches ? Sont-ils sur deux continents différents
      ?
    methode: Élimine d'abord les paires qui contiennent un pays où une partie des habitants manque de nourriture.
    etape: Madagascar et Haïti sont des pays en développement. Toute paire qui en contient un est à écarter.
  pieges:
  - si:
      contient:
      - b
    relance: Ces deux pays sont bien sur deux continents différents, mais leur alimentation est insuffisante pour une partie
      des habitants.
  - si:
      contient:
      - c
    relance: Haïti n'a pas une ration très riche. Et les deux pays de cette paire sont sur le même continent.
  solution: 'La France (Europe) et les États-Unis (Amérique du Nord) : ce sont deux pays riches, situés sur deux continents
    différents.'
- id: expliquer-diversite-deux-exemples
  type: ouverte
  difficulte: 3
  enonce: Explique, avec deux exemples de pays situés sur deux continents différents, qu'on ne mange pas la même chose partout
    dans le monde.
  criteres:
  - L'élève cite au moins un pays où l'alimentation est abondante et un pays où elle est insuffisante.
  - L'élève précise le continent de chaque pays cité.
  - L'élève emploie un mot de la leçon (sous-nutrition, pays riche, pays en développement).
  indices:
    relance: Pense à un pays riche et à un pays en développement que tu connais.
    methode: Choisis un pays pour chaque situation, puis indique son continent.
    etape: 'Tu peux commencer ainsi : « Dans le monde, on ne mange pas tous la même chose... »'
  solution: 'Dans le monde, on ne mange pas tous la même chose. En France (Europe), l''alimentation est abondante et variée.
    À Madagascar (Afrique), une partie de la population manque de nourriture : c''est la sous-nutrition.'
