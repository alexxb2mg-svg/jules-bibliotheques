# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-parametres-son-exploration
version: 3
etat: verifiee
declencheurs:
- hauteur d'un son
- timbre d'un instrument
- son grave ou aigu
- durée d'un son
- intensité d'un son
- paramètres du son
- expérimenter des sons
- objet sonore
- son court ou long
prerequis:
- cm1-reperes-culture-musicale
essentiel: 'Un son peut être transformé de quatre façons. Ce sont les quatre paramètres du son : la hauteur, le timbre, la
  durée et l''intensité. Expérimenter, c''est essayer de changer un paramètre pour entendre ce qui se passe.


  La hauteur dit si un son est grave (bas, comme la voix d''un ogre) ou aigu (haut, comme le cri d''une souris). L''intensité
  dit si un son est fort ou doux. Attention : un son aigu n''est pas forcément fort !


  La durée dit combien de temps le son dure : il est court (un claquement de doigts) ou long (un « ou » que tu tiens jusqu''au
  bout de ton souffle).


  Le timbre, c''est la couleur du son. Grâce à lui, tu reconnais la voix de ta maman au téléphone. Tu distingues aussi une
  guitare et un piano qui jouent la même note. Si tu frappes une casserole avec une cuillère en bois puis en métal, tu changes
  le timbre.


  On entend trois sortes de sons. Le son vocal est produit par la voix. Le son instrumental est produit par un instrument
  de musique. Un objet sonore est un objet de tous les jours qui fait du bruit : une boîte de riz qu''on secoue, un gobelet
  qu''on tapote.


  Pour décrire un son, on utilise des mots précis : grave ou aigu, fort ou doux, court ou long, et pour le timbre des mots
  comme métallique, sec, soufflé, frotté. Ensuite, on peut imaginer des utilisations : un son de plus en plus fort pour un
  orage qui approche, des sons aigus et courts pour des gouttes de pluie.

  '
methode:
- Choisis une source sonore (ta voix, un instrument ou un objet) et écoute son son de départ.
- Change un seul paramètre à la fois et écoute la différence (plus grave ou plus aigu, plus fort ou plus doux, plus court
  ou plus long).
- Change ta façon de produire le son (frotter, taper, souffler, secouer) pour entendre un autre timbre.
- Décris chaque son avec un mot précis du vocabulaire (grave, aigu, fort, doux, court, long, métallique...).
- Imagine à quoi ce son pourrait servir dans une petite histoire sonore (pluie, orage, pas qui s'approchent).
vocabulaire:
- terme: hauteur
  definition: le fait qu'un son soit grave ou aigu
- terme: timbre
  definition: la couleur d'un son, ce qui permet de reconnaître qui ou quoi le produit
- terme: durée
  definition: le temps pendant lequel un son dure, court ou long
- terme: intensité
  definition: la force d'un son, fort ou doux
- terme: objet sonore
  definition: un objet de tous les jours dont on se sert pour produire des sons
- terme: son vocal
  definition: un son produit par la voix
erreurs_frequentes:
- Confondre hauteur (grave ou aigu) et intensité (fort ou doux) en croyant qu'un son aigu est forcément fort.
- Croire que le timbre, c'est la même chose que la hauteur.
- Changer plusieurs paramètres en même temps sans savoir lequel a produit la différence entendue.
- Décrire un son avec « joli » ou « bizarre » au lieu d'un mot précis comme grave, long ou métallique.
exemple:
  enonce: Tu frappes une même casserole avec une cuillère en bois, puis avec une cuillère en métal. Quel paramètre du son
    changes-tu surtout ?
  solution: 'Tu changes surtout le timbre : la matière de la cuillère change la couleur du son, même si la casserole reste
    la même. Pour le décrire, tu peux dire que le son est plus sec avec le bois et plus métallique avec le métal.'
exercices:
- id: definir-hauteur
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que la hauteur d'un son ?
  reponse:
    options:
    - id: a
      texte: Le fait qu'un son soit grave ou aigu
    - id: b
      texte: Le fait qu'un son soit fort ou doux
    - id: c
      texte: Le temps pendant lequel un son dure
    bonnes:
    - a
  indices:
    relance: Pense à la voix d'un ogre et au cri d'une souris. Qu'est-ce qui change entre les deux ?
    methode: Élimine d'abord les réponses qui parlent de la force du son ou du temps qu'il dure.
    etape: La force du son et le temps qu'il dure ont chacun leur propre nom. Lequel des trois reste ?
  pieges:
  - si:
      contient:
      - b
    relance: Fort ou doux, c'est l'intensité, pas la hauteur.
  - si:
      contient:
      - c
    relance: Le temps pendant lequel un son dure, c'est la durée, pas la hauteur.
  solution: La hauteur d'un son, c'est le fait qu'il soit grave ou aigu.
- id: mot-timbre
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la couleur d'un son, ce qui permet de reconnaître qui ou quoi le produit ?
  reponse:
    acceptees:
    - timbre
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne pourquoi tu reconnais une guitare et un piano même sur la même note.
    methode: Relis le vocabulaire de ta leçon, ce mot n'est ni la hauteur, ni la durée, ni l'intensité.
    etape: Trois paramètres parlent de grave ou aigu, de fort ou doux, de court ou long. Quel est le nom du quatrième ?
  pieges:
  - si:
      valeur: hauteur
    relance: La hauteur, c'est grave ou aigu. Le mot cherché désigne plutôt la couleur du son.
  solution: On appelle cela le timbre, la couleur d'un son qui permet de reconnaître qui ou quoi le produit.
- id: son-court-ou-long
  type: choix
  difficulte: 1
  enonce: Tu siffles d'abord un tout petit coup, puis un sifflement qui ne s'arrête pas. Quel paramètre du son changes-tu
    ?
  reponse:
    options:
    - id: a
      texte: La hauteur
    - id: b
      texte: La durée
    - id: c
      texte: L'intensité
    bonnes:
    - b
  indices:
    relance: Qu'est-ce qui est différent entre un petit coup de sifflet et un sifflement qui ne s'arrête pas ?
    methode: Demande-toi si le son devient plus aigu, plus fort, ou s'il dure plus longtemps.
    etape: Le premier son est court, le second est long. Quel paramètre parle de court et de long ?
  pieges:
  - si:
      contient:
      - a
    relance: La hauteur, c'est grave ou aigu. Ici, on ne dit pas que le son monte ou descend.
  - si:
      contient:
      - c
    relance: L'intensité, c'est fort ou doux. Ici, c'est le temps du son qui change.
  solution: Tu changes la durée du son, le temps pendant lequel il dure, en passant d'un son court à un son long.
- id: paires-parametres
  type: association
  difficulte: 2
  enonce: Relie chaque paramètre du son à sa définition.
  reponse:
    gauche:
    - id: hauteur-mot
      texte: Hauteur
    - id: duree-mot
      texte: Durée
    - id: intensite-mot
      texte: Intensité
    droite:
    - id: def-grave-aigu
      texte: Grave ou aigu
    - id: def-court-long
      texte: Court ou long
    - id: def-fort-doux
      texte: Fort ou doux
    paires:
      hauteur-mot: def-grave-aigu
      duree-mot: def-court-long
      intensite-mot: def-fort-doux
  indices:
    relance: Lequel de ces trois mots parle du temps ? Commence par celui-là.
    methode: Associe d'abord le mot que tu connais le mieux, puis élimine sa définition pour les deux autres mots.
    etape: La durée parle du temps que dure le son. Reste à répartir les deux autres définitions.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque mot en te demandant s'il parle de hauteur, de durée ou d'intensité.
  - si:
      diagnostic: associations_fausses
    relance: Pars du mot « durée », qui parle du temps, puis distingue hauteur et intensité pour les deux autres mots.
  solution: 'Hauteur : grave ou aigu. Durée : court ou long. Intensité : fort ou doux.'
- id: identifier-parametre-change
  type: choix
  difficulte: 2
  enonce: Tu chantes la même note, d'abord très doucement, puis très fort. Quel paramètre du son changes-tu ?
  reponse:
    options:
    - id: a
      texte: L'intensité
    - id: b
      texte: La hauteur
    - id: c
      texte: Le timbre
    bonnes:
    - a
  indices:
    relance: La note reste la même et c'est toujours ta voix. Qu'est-ce qui change alors ?
    methode: Relis le vocabulaire de ta leçon, doux et fort définissent un paramètre précis.
    etape: Ce paramètre parle de la force du son. Cherche-le parmi les trois réponses.
  pieges:
  - si:
      contient:
      - b
    relance: La hauteur, c'est grave ou aigu, pas fort ou doux. Ici la note reste la même.
  - si:
      contient:
      - c
    relance: Le timbre, c'est la couleur du son (l'instrument ou la voix qui le produit), pas sa force.
  solution: Tu changes l'intensité, la force du son, en chantant la même note d'abord doucement puis fort.
- id: voix-instrument-objet
  type: association
  difficulte: 2
  enonce: Relie chaque source sonore au type de son qu'elle produit.
  reponse:
    gauche:
    - id: voix-chante
      texte: Ta voix qui chante « la la la »
    - id: guitare
      texte: Une guitare dont on pince les cordes
    - id: boite-riz
      texte: Une boîte de riz qu'on secoue
    droite:
    - id: son-vocal
      texte: Un son vocal
    - id: son-instrumental
      texte: Un son instrumental
    - id: objet-sonore
      texte: Un objet sonore
    paires:
      voix-chante: son-vocal
      guitare: son-instrumental
      boite-riz: objet-sonore
  indices:
    relance: Parmi ces trois sources, laquelle est un vrai instrument de musique ?
    methode: Demande-toi pour chaque source si le son vient de la voix, d'un instrument de musique, ou d'un objet de tous
      les jours.
    etape: Une boîte de riz n'est pas un instrument de musique, mais elle fait du bruit quand on la secoue. Quel nom lui donne-t-on
      ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pour chaque source, d'où vient le son exactement ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par la voix, le plus facile, puis sépare l'instrument de musique de l'objet de tous les jours.
  solution: 'Ta voix produit un son vocal. La guitare, instrument de musique, produit un son instrumental. La boîte de riz
    est un objet sonore : un objet de tous les jours dont on se sert pour faire des sons.'
- id: imaginer-orage
  type: texte_court
  difficulte: 3
  enonce: Pour imiter un orage qui s'approche, tu frappes un tambour de plus en plus fort. Quel paramètre du son fais-tu grandir
    peu à peu ?
  reponse:
    acceptees:
    - intensité
    - l'intensité
    fautes_tolerees: 1
  indices:
    relance: Tu frappes toujours le même tambour, de la même façon. Qu'est-ce qui change quand l'orage approche ?
    methode: Rappelle-toi les quatre paramètres et cherche celui qui parle de la force du son.
    etape: Un orage lointain s'entend doux, un orage tout proche s'entend fort. Quel paramètre décrit fort et doux ?
  pieges:
  - si:
      valeur: hauteur
    relance: La hauteur, c'est grave ou aigu. Ici le tambour ne devient pas plus aigu, il devient plus fort.
  - si:
      valeur: durée
    relance: La durée, c'est court ou long. Ici, c'est la force de chaque coup qui change.
  - si:
      valeur: timbre
    relance: Le timbre ne change pas, c'est toujours le même tambour. Qu'est-ce qui augmente ?
  solution: 'Tu fais grandir l''intensité, la force du son : l''orage semble s''approcher parce que les coups sont de plus
    en plus forts.'
- id: expliquer-parametres-son
  type: ouverte
  difficulte: 3
  enonce: Choisis un objet sonore de ta maison et explique en deux ou trois phrases comment tu peux changer deux paramètres
    différents du son qu'il produit, puis à quoi ce son pourrait servir dans une histoire.
  criteres:
  - L'élève cite un objet précis et un premier paramètre qu'il peut changer (hauteur, timbre, durée ou intensité).
  - L'élève explique un deuxième paramètre différent qu'il peut changer avec le même objet.
  - L'élève imagine une utilisation du son (bruitage, petite histoire) ou le décrit avec un mot précis (grave, aigu, fort,
    doux, court, long, métallique...).
  indices:
    relance: Pense à un objet que tu peux frapper, secouer ou souffler de différentes façons.
    methode: Une phrase pour le premier paramètre, une phrase pour le second, puis une phrase pour l'utilisation que tu imagines.
    etape: Tu peux commencer par « Avec mon objet, je peux changer... », puis continuer par « Je peux aussi changer... ».
  solution: Par exemple, avec une casserole, je peux changer l'intensité en la frappant plus ou moins fort. Je peux aussi
    changer le timbre en utilisant une cuillère en bois puis une cuillère en métal. Des coups de plus en plus forts pourraient
    imiter des pas de géant qui s'approchent.
- id: nblm-quel-parametre-du-son-permet-de-savoir-s-1
  type: choix
  difficulte: 2
  enonce: Quel paramètre du son permet de savoir si un son est grave ou aigu ?
  reponse:
    options:
    - id: o1
      texte: La hauteur
    - id: o2
      texte: L'intensité
    - id: o3
      texte: La durée
    - id: o4
      texte: Le timbre
    bonnes:
    - o1
  indices:
    relance: Pense au terme qui qualifie la position d'un son entre le grave et l'aigu.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : l''intensité concerne la force du son (fort ou doux), pas s''il est grave ou aigu.'
  solution: 'La hauteur. C''est exact : la hauteur indique si un son est grave ou aigu.'
- id: nblm-qu-est-ce-que-le-timbre-d-un-son-ou-d-un-2
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que le timbre d'un son ou d'un instrument ?
  reponse:
    options:
    - id: o1
      texte: La couleur du son qui permet de reconnaître quel instrument ou quelle voix le produit.
    - id: o2
      texte: La vitesse de la musique quand on joue très vite.
    - id: o3
      texte: Le fait qu'un son soit très fort ou très doux.
    - id: o4
      texte: La longueur du son mesurée en secondes.
    bonnes:
    - o1
  indices:
    relance: C'est ce qui te permet de reconnaître une flûte d'un piano même s'ils jouent la même note.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la vitesse concerne le tempo ou le rythme, pas le timbre.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : cela définit l''intensité (la force du son), non le timbre.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la longueur du son correspond à sa durée.'
  solution: 'La couleur du son qui permet de reconnaître quel instrument ou quelle voix le produit. Exact : le timbre est
    la couleur spécifique du son qui identifie sa source.'
- id: nblm-si-tu-joues-d-un-instrument-de-plus-en-p-3
  type: choix
  difficulte: 2
  enonce: Si tu joues d'un instrument de plus en plus fort, quel paramètre du son modifies-tu ?
  reponse:
    options:
    - id: o1
      texte: L'intensité
    - id: o2
      texte: La hauteur
    - id: o3
      texte: Le timbre
    - id: o4
      texte: La durée
    bonnes:
    - o1
  indices:
    relance: Pense au mot qui désigne la force ou la puissance d'un son.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : le timbre est la couleur du son, qui ne dépend pas uniquement du volume.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la durée indique combien de temps le son dure, pas son volume.'
  solution: 'L''intensité. C''est juste : l''intensité varie quand on joue fort ou doucement.'
- id: nblm-comment-definit-on-la-duree-d-un-son-en-4
  type: choix
  difficulte: 2
  enonce: Comment définit-on la durée d'un son en éducation musicale ?
  reponse:
    options:
    - id: o1
      texte: Le temps pendant lequel un son dure, qu'il soit court ou long.
    - id: o2
      texte: Le fait qu'un son soit grave ou aigu.
    - id: o3
      texte: La couleur du son produite par la voix de quelqu'un.
    - id: o4
      texte: La nuance forte ou douce d'un coup de tambour.
    bonnes:
    - o1
  indices:
    relance: Pense à la différence entre une cloche qui résonne longtemps et un claquement de doigts.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : c''est la hauteur qui définit un son grave ou aigu.'
  - si:
      contient:
      - o3
    relance: 'Erreur : cela correspond au timbre de la voix.'
  - si:
      contient:
      - o4
    relance: 'Erreur : fort ou doux fait référence à l''intensité.'
  solution: 'Le temps pendant lequel un son dure, qu''il soit court ou long. Exactement : la durée correspond au temps de
    résonance du son (court ou long).'
- id: nblm-si-tu-frappes-une-meme-casserole-d-abord-5
  type: choix
  difficulte: 2
  enonce: Si tu frappes une même casserole d'abord avec une cuillère en bois, puis avec une cuillère en métal, quel paramètre
    du son changes-tu principalement ?
  reponse:
    options:
    - id: o1
      texte: Le timbre
    - id: o2
      texte: La hauteur
    - id: o3
      texte: La durée
    - id: o4
      texte: L'intensité
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que la matière apporte à la couleur de l'écoute.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la casserole reste la même, la hauteur (grave/aigu) ne change pas.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le changement principal causé par le matériau est la couleur du son.'
  solution: 'Le timbre. C''est bien cela : changer de matériau modifie la couleur du son (le timbre).'
- id: nblm-quels-sont-deux-des-quatre-parametres-fo-6
  type: choix
  difficulte: 3
  enonce: Quels sont deux des quatre paramètres fondamentaux du son que l'on peut explorer et transformer ? (Choisis 2 réponses)
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La hauteur
    - id: o2
      texte: L'intensité
    - id: o3
      texte: Le refrain
    - id: o4
      texte: L'intonation
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les termes qui décrivent si un son est grave/aigu ou fort/doux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : le refrain est un élément de la forme musicale, pas un paramètre du son.'
  - si:
      contient:
      - o4
    relance: 'Erreur : l''intonation concerne la justesse du chant, pas un des 4 paramètres fondamentaux du son.'
  solution: 'La hauteur ; L''intensité. C''est juste : la hauteur (grave/aigu) est l''un des 4 paramètres du son.'
- id: nblm-complete-la-phrase-le-parametre-du-son-q-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : Le paramètre du son qui indique la force du son (s''il est fort ou doux) s''appelle l''_____.'
  reponse:
    acceptees:
    - intensité
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par la lettre I et signifie la force d'un son.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: intensité. Bravo ! L'intensité caractérise la force d'un son (fort ou doux).
- id: nblm-complete-la-phrase-ce-qui-permet-de-reco-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : Ce qui permet de reconnaître la couleur particulière d''un instrument ou d''une voix est le
    _____.'
  reponse:
    acceptees:
    - timbre
    fautes_tolerees: 1
  indices:
    relance: Ce mot de 6 lettres commence par un T et désigne la couleur du son.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: timbre. Exact ! Le timbre est la couleur sonore propre à chaque instrument ou voix.
sources:
- titre: Programme du cycle 3 (annexe 2), version consolidée BO n° 31 du 30/07/2020, p. 49
  url: https://cache.media.education.gouv.fr/file/31/88/7/ensel714_annexe2_1312887.pdf
  auteurs: Ministère de l'Éducation nationale (DGESCO)
  licence: etalab-2.0
  consulte_le: '2026-09-24'
  usage: reformulé et résumé
