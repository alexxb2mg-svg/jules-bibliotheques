  url: https://eduscol.education.gouv.fr/sites/default/files/document/ra16c2c3emusecouterepere-ecoute837653pdf-74949.pdf
  auteurs: Ministère de l'Éducation nationale (DGESCO)
  licence: etalab-2.0
  consulte_le: '2026-09-24'
  usage: détail du paramètre timbre et espace sonore pour l'écoute
relecture:
