format: 2
notion: cm1-argumentation-jugement-musical
version: 3
etat: verifiee
declencheurs:
- j'aime pas cette musique
- donner son avis sur une musique
- argumenter un avis
- goûts musicaux
- pourquoi j'aime une chanson
- débat sur la musique
- respecter les avis des autres
- choisir ensemble une interprétation
- c'est nul cette chanson
prerequis:
- cm1-creation-organisation-sonore
essentiel: 'Quand tu écoutes une musique, tu ressens tout de suite quelque chose : tu aimes, tu n''aimes pas, elle te rend
  joyeux ou triste. C''est ton ressenti immédiat. Il compte, mais il ne suffit pas pour donner un vrai avis.


  Argumenter, c''est expliquer pourquoi tu penses cela, avec une raison précise tirée de ce que tu entends. Par exemple :
  « J''aime ce morceau parce que le tempo est rapide et que les percussions me donnent envie de danser. » La raison arrive
  souvent après « parce que ».


  Pour trouver des raisons, appuie-toi sur ce que tu as appris : le tempo (rapide ou lent), les nuances (fort ou doux), les
  instruments, les voix, les paroles, l''ambiance, ce qui se répète. Plus tes mots sont précis, plus ton avis est clair pour
  les autres.


  Il n''y a pas de musique qu''on serait obligé d''aimer. Ce que l''on peut juger, c''est si un avis est bien expliqué. Ton
  camarade a donc le droit de penser le contraire de toi : tu l''écoutes jusqu''au bout, sans te moquer, et tu compares sa
  raison à la tienne.


  En classe, il arrive qu''on doive choisir ensemble une façon de chanter un chant (doucement ou fort, lentement ou vite).
  Chacun propose son idée avec une raison, on écoute toutes les propositions, puis on choisit celle qui sert le mieux le chant.
  Tu peux changer d''avis si un argument t''a vraiment convaincu, pas juste pour faire comme tout le monde.

  '
methode:
- Écoute la musique attentivement, en entier.
- Repère ton ressenti immédiat (j'aime, je n'aime pas, ça me rend joyeux, triste, calme...).
- Cherche une raison précise dans ce que tu entends (tempo, nuances, instruments, voix, paroles, ambiance).
- Formule une phrase avec ton avis, le mot « parce que » et ta raison.
- Écoute l'avis des autres jusqu'au bout, sans te moquer, et compare leur raison à la tienne.
vocabulaire:
- terme: argumenter
  definition: expliquer une raison précise pour justifier son avis
- terme: ressenti immédiat
  definition: ce que l'on éprouve tout de suite en écoutant une musique, avant d'y réfléchir
- terme: argument
  definition: une raison précise que l'on donne pour expliquer ou défendre son avis
- terme: point de vue
  definition: la façon dont une personne voit ou juge une chose, qui peut être différente de la tienne
erreurs_frequentes:
- Dire seulement « c'est nul » ou « c'est génial » sans donner de raison.
- Donner une raison qui ne parle pas de la musique, comme « parce que mon frère l'écoute ».
- Se moquer de l'avis de quelqu'un d'autre parce qu'il est différent du sien.
- Changer d'avis juste pour être d'accord avec tout le monde, sans avoir été convaincu par un argument.
exemple:
  enonce: Un camarade dit qu'il n'aime pas du tout une musique que tu adores. Comment réagir en argumentant un jugement musical
    ?
  solution: 'Tu lui demandes pourquoi il ne l''aime pas et tu écoutes sa raison sans te moquer (par exemple : « c''est trop
    lent pour moi »). Puis tu expliques ta propre raison : « Moi, j''aime ce morceau parce que la flûte joue une mélodie douce
    qui me calme. » Chacun garde son avis, et chacun a expliqué pourquoi.'
