  reponse:
    acceptees:
    - immédiat
    - ressenti immédiat
    - le ressenti immédiat
    fautes_tolerees: 1
  indices:
    relance: Ce mot veut dire « tout de suite, sans attendre ».
    methode: Relis le vocabulaire de ta leçon, le mot cherché accompagne « ressenti ».
    etape: Relis le début de l'essentiel de ta leçon. Ce mot y suit « ressenti ».
  pieges:
  - si:
      valeur: argument
    relance: Un argument est une raison réfléchie. Ici, on cherche ce qu'on éprouve avant même de réfléchir.
  solution: On appelle cela le ressenti immédiat, ce que l'on éprouve tout de suite en écoutant une musique.
- id: methode-donner-avis
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour donner un avis argumenté sur une musique.
  reponse:
    elements:
    - id: ecouter
      texte: Écouter la musique attentivement, en entier
    - id: ressenti
      texte: Réfléchir à son ressenti immédiat
    - id: raison
      texte: Chercher une raison précise à ce ressenti
    - id: formuler
      texte: Formuler une phrase avec son avis et sa raison
  indices:
    relance: Que dois-tu faire avant même de savoir si tu aimes ou pas ?
    methode: Commence par écouter, puis ressens, puis cherche une raison, puis formule ta phrase complète.
    etape: Écouter la musique vient toujours en premier, formuler la phrase complète vient toujours en dernier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'écoute complète, en premier, puis la formulation de la phrase, en dernier.
  solution: On écoute d'abord la musique attentivement, puis on réfléchit à son ressenti immédiat, puis on cherche une raison
    précise, et enfin on formule une phrase avec son avis et sa raison.
- id: raison-musicale
  type: choix
  difficulte: 2
  enonce: 'Léa dit : « Je n''aime pas cette chanson parce que... ». Quelle fin de phrase est une raison qui parle vraiment
    de la musique ?'
  reponse:
    options:
    - id: a
      texte: parce que mon grand frère l'écoute tout le temps
    - id: b
      texte: parce que la voix chante très fort du début à la fin, sans moment doux
    - id: c
      texte: parce que c'est comme ça
    bonnes:
    - b
  indices:
    relance: Une raison musicale parle de ce que l'on entend dans la musique elle-même.
    methode: Cherche dans chaque fin de phrase un mot de musique (voix, tempo, nuances, instrument...).
    etape: Une des fins parle d'une personne, une autre ne donne aucune raison. Il en reste une seule.
  pieges:
  - si:
      contient:
      - a
    relance: Ton grand frère n'est pas dans la musique ! Cette raison ne dit rien de ce qu'on entend.
  - si:
      contient:
      - c
    relance: « C'est comme ça » n'explique rien. Une vraie raison dit ce qui, dans la musique, te déplaît.
  solution: 'La bonne fin est « parce que la voix chante très fort du début à la fin, sans moment doux » : elle parle des
    nuances, donc de la musique elle-même.'
- id: reagir-avis-different
  type: choix
  difficulte: 2
  enonce: Un camarade donne un avis très différent du tien sur une musique. Que dois-tu faire ?
  reponse:
    options:
    - id: a
      texte: Écouter sa raison sans te moquer, même si tu n'es pas d'accord
    - id: b
      texte: Te moquer de son avis parce qu'il est différent du tien
    - id: c
      texte: Changer immédiatement d'avis pour être d'accord avec lui
    bonnes:
    - a
  indices:
    relance: Relis les erreurs fréquentes de ta leçon sur le respect des avis différents.
    methode: Respecter un avis différent, ce n'est ni se moquer, ni changer d'avis sans réfléchir.
    etape: Élimine la réponse qui blesse ton camarade et celle où tu abandonnes ton avis sans raison.
  pieges:
  - si:
      contient:
      - b
    relance: Se moquer de l'avis d'un camarade est une erreur fréquente à éviter, même si son avis est différent du tien.
  - si:
      contient:
      - c
    relance: Changer d'avis juste pour être d'accord avec l'autre, sans réfléchir, est aussi une erreur fréquente.
  solution: Il faut écouter la raison de ton camarade sans te moquer, même si son avis est différent du tien, en gardant ton
    propre avis si tu le souhaites.
- id: choix-interpretation-collective
  type: choix
  difficulte: 3
  enonce: La classe doit décider comment chanter une berceuse. Quelle proposition est la mieux argumentée ?
  reponse:
    options:
    - id: a
      texte: Chantons-la doucement et lentement, parce qu'une berceuse sert à endormir un bébé
    - id: b
      texte: Chantons-la très fort, parce que c'est plus drôle
    - id: c
      texte: Chantons-la comme Tom a dit, parce que c'est Tom
    bonnes:
    - a
  indices:
    relance: Une bonne raison doit aider le chant à faire ce pour quoi il est fait.
    methode: Demande-toi à quoi sert une berceuse, puis cherche la proposition dont la raison va avec ce but.
    etape: Une raison parle de la personne qui propose, une autre ne pense pas au sens du chant. Il en reste une.
  pieges:
  - si:
      contient:
      - b
    relance: Chanter très fort réveillerait le bébé ! Cette raison ne tient pas compte du sens de la berceuse.
  - si:
      contient:
      - c
    relance: Choisir à cause de la personne qui propose, ce n'est pas un argument sur la musique.
  solution: 'La meilleure proposition est de la chanter doucement et lentement, parce qu''une berceuse sert à endormir un
    bébé : la raison s''appuie sur le sens du chant.'
- id: expliquer-jugement-argumente
  type: ouverte
  difficulte: 3
  enonce: Choisis une musique que tu connais et explique en deux ou trois phrases ton avis argumenté sur elle, en citant au
    moins un élément précis (tempo, nuances, instrument, voix, ambiance, paroles).
  criteres:
  - L'élève donne un avis clair (aime ou n'aime pas, ou ce que la musique lui fait ressentir).
  - L'élève justifie cet avis avec au moins un élément musical précis (tempo, nuances, instrument, voix, ambiance, paroles).
  - L'élève relie son avis à sa raison par un mot comme « parce que » ou « car ».
  indices:
    relance: N'oublie pas de citer un élément précis, pas seulement « j'aime » ou « j'aime pas ».
    methode: Une première phrase pour ton avis, une deuxième phrase pour ta raison précise.
    etape: Tu peux commencer par « J'aime / je n'aime pas... », puis continuer par « parce que... ».
  solution: 'Par exemple : « J''aime cette chanson parce que son tempo est entraînant et me donne envie de bouger. La guitare
    donne aussi une ambiance joyeuse que j''apprécie. »'
