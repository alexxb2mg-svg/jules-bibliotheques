  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : il ne faut pas changer d''avis juste pour faire comme tout le monde sans réfléchir par soi-même.'
  solution: 'Expliquer pourquoi on aime ou on n''aime pas une musique en utilisant des mots précis (tempo, instruments, ambiance).
