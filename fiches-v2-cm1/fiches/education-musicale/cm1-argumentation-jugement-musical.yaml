    - id: a
      texte: Expliquer une raison précise pour justifier son avis
    - id: b
      texte: Dire seulement si on aime ou si on n'aime pas
    - id: c
      texte: Changer d'avis pour être d'accord avec tout le monde
    bonnes:
    - a
  indices:
    relance: Un avis argumenté répond à la question « pourquoi ? ».
    methode: Relis l'essentiel de ta leçon sur l'argumentation d'un jugement musical.
    etape: Élimine la réponse où l'on ne dit que « j'aime » et celle où l'on abandonne son propre avis.
  pieges:
  - si:
      contient:
      - b
    relance: Dire seulement « j'aime » ou « j'aime pas » sans raison, c'est justement une erreur fréquente à éviter.
  - si:
      contient:
      - c
    relance: Changer d'avis pour faire plaisir aux autres, ce n'est pas argumenter, c'est abandonner son propre jugement.
  solution: Argumenter un jugement musical, c'est expliquer une raison précise pour justifier son avis, avec des mots comme
    le tempo, les instruments ou l'ambiance.
- id: reconnaitre-avis-argumente
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases est un avis correctement argumenté ?
  reponse:
    options:
    - id: a
      texte: J'aime cette musique parce que le tempo est rapide et cela me donne de l'énergie
    - id: b
      texte: C'est nul, je n'aime pas du tout
    - id: c
      texte: C'est génial
    bonnes:
    - a
  indices:
    relance: Une phrase argumentée contient un avis ET une raison précise.
    methode: Cherche la phrase qui contient le petit mot « parce que ».
    etape: Deux phrases donnent un avis sans dire pourquoi. Laquelle donne une raison ?
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase donne un avis mais aucune raison précise, ce n'est pas un avis argumenté.
  - si:
      contient:
      - c
    relance: Cette phrase est trop courte, elle ne donne aucune raison précise.
  solution: 'La phrase argumentée est : « J''aime cette musique parce que le tempo est rapide et cela me donne de l''énergie
    », car elle contient un avis et une raison précise.'
- id: mot-ressenti
  type: texte_court
  difficulte: 1
  enonce: Ce que l'on éprouve tout de suite en écoutant une musique, avant d'y réfléchir, s'appelle « le ressenti ... ». Quel
