    relance: C'est au contraire une étape essentielle de la méthode pour former un jugement réfléchi.
  solution: 'Dire uniquement « c''est nul » sans expliquer pourquoi ; Se moquer de l''avis d''un camarade parce qu''il n''a
    pas les mêmes goûts que soi. C''est une erreur fréquente : donner un jugement tranché sans explication n''est pas un avis
    argumenté.'
