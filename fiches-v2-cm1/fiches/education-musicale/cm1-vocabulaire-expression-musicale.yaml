format: 2
notion: cm1-vocabulaire-expression-musicale
version: 1
etat: verifiee
declencheurs:
- nuances en musique
- tempo d'une chanson
- chanter fort ou doucement
- vitesse d'une chanson
- caractère d'une musique
- vocabulaire de la musique
- expression musicale
prerequis:
- cm1-polyphonie-simple
essentiel: 'Pour bien interpréter une musique, on utilise un vocabulaire précis pour dire comment la chanter ou la jouer.

  Les nuances disent si on chante fort ou doucement.

  Le tempo, c''est la vitesse de la musique : lent, rapide, modéré...

  Le caractère, c''est l''ambiance donnée à la musique : joyeux, triste, solennel...

  Dans une polyphonie, chaque partie a un rôle complémentaire : les parties simultanées se complètent sans faire la même chose.

  Le mot « interprétation » désigne la façon dont une musique est chantée ou jouée : deux interprétations d''un même chant
  peuvent être différentes.'
methode:
- 'Écoute une musique en te demandant : est-ce fort ou doux (nuance) ?'
- Demande-toi si c'est lent, rapide ou modéré (tempo).
- 'Cherche le caractère : qu''est-ce que cette musique te fait ressentir ?'
- Si plusieurs voix ou instruments jouent ensemble, repère leurs rôles différents.
- Utilise ces mots (nuance, tempo, caractère, interprétation) pour décrire ce que tu entends ou ce que tu chantes.
vocabulaire:
- terme: nuance
  definition: le fait de chanter ou jouer plus ou moins fort
- terme: tempo
  definition: la vitesse de la musique (lent, rapide, modéré)
- terme: interprétation
  definition: la façon de chanter ou de jouer une musique
erreurs_frequentes:
- Confondre nuance (fort/doux) et tempo (vitesse).
- Croire qu'une interprétation doit toujours être exactement pareille à une autre.
- Ne pas savoir dire pourquoi une musique paraît joyeuse ou triste (le caractère).
exemple:
  enonce: 'Tu écoutes deux versions de la même chanson : la première est chantée très vite et fort, la deuxième lentement
    et doucement. Utilise le vocabulaire musical pour les comparer.'
  solution: 'La première interprétation a un tempo rapide et une nuance forte, la deuxième a un tempo lent et une nuance douce
    : ce sont deux interprétations différentes de la même chanson.'
exercices:
- id: mot-vitesse
  type: choix
  difficulte: 1
  enonce: Quel mot désigne la vitesse d'une musique (lente, rapide, modérée) ?
  reponse:
    options:
    - id: a
      texte: Le tempo
    - id: b
      texte: La nuance
    - id: c
      texte: Le caractère
    bonnes:
    - a
  indices:
    relance: Ce mot vient de l'italien et sert à mesurer si une musique est lente ou rapide.
    methode: Relis le vocabulaire de ta leçon, la vitesse d'une musique porte un nom précis, différent de la force ou de l'ambiance.
    etape: Le mot cherché n'est ni « nuance » ni « caractère ».
  pieges:
  - si:
      contient:
      - b
    relance: La nuance parle de la force (fort/doux), pas de la vitesse. Cherche un autre mot.
  - si:
      contient:
      - c
    relance: Le caractère parle de l'ambiance (joyeux, triste), pas de la vitesse. Cherche un autre mot.
  solution: Le mot qui désigne la vitesse d'une musique est le tempo (lent, rapide, modéré).
- id: definition-nuance
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le fait de chanter ou jouer plus ou moins fort ?
  reponse:
    acceptees:
    - nuance
    fautes_tolerees: 1
  indices:
    relance: Ce n'est ni la vitesse ni l'ambiance, mais la force du son.
    methode: Relis le vocabulaire de ta leçon, le mot commence par « n ».
    etape: Le mot cherché est court et désigne si l'on chante fort ou doucement.
  pieges:
  - si:
      valeur: tempo
    relance: Le tempo parle de la vitesse, pas de la force. Cherche un autre mot.
  solution: Ce mot est la nuance, qui désigne le fait de chanter ou jouer plus ou moins fort.
- id: association-vocabulaire
  type: association
  difficulte: 2
  enonce: Relie chaque mot du vocabulaire musical à sa définition.
  reponse:
    gauche:
    - id: nuance-mot
      texte: Nuance
    - id: tempo-mot
      texte: Tempo
    - id: interpretation-mot
      texte: Interprétation
    droite:
    - id: def-force
      texte: Le fait de chanter ou jouer plus ou moins fort
    - id: def-vitesse
      texte: La vitesse de la musique
    - id: def-facon
      texte: La façon de chanter ou de jouer une musique
    paires:
      nuance-mot: def-force
      tempo-mot: def-vitesse
      interpretation-mot: def-facon
  indices:
    relance: La nuance parle de la force, le tempo de la vitesse, l'interprétation de la façon générale de jouer.
    methode: Associe d'abord le mot que tu connais le mieux, puis élimine sa définition pour les deux autres.
    etape: Nuance va avec « plus ou moins fort ». Reste à choisir entre vitesse et façon de jouer pour les deux autres mots.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque mot en te demandant s'il parle de la force, de la vitesse,
      ou de la façon générale de jouer.
  - si:
      diagnostic: associations_fausses
    relance: Pars du mot « nuance », qui parle de la force du son, puis distingue vitesse et façon de jouer pour les deux
      autres mots.
  solution: 'Nuance : le fait de chanter ou jouer plus ou moins fort. Tempo : la vitesse de la musique. Interprétation : la
    façon de chanter ou de jouer une musique.'
- id: comparer-interpretations
  type: choix
  difficulte: 2
  enonce: 'Deux chorales chantent la même chanson : la première très lentement et doucement, la deuxième très vite et fort.
    Que peux-tu dire de ces deux versions ?'
  reponse:
    options:
    - id: a
      texte: Ce sont deux interprétations différentes, avec un tempo et une nuance différents
    - id: b
      texte: Ce ne sont pas la même chanson puisqu'elles sont différentes
    - id: c
      texte: Une seule des deux versions est la bonne interprétation
    bonnes:
    - a
  indices:
    relance: Une même chanson peut-elle être interprétée de façons différentes tout en restant la même chanson ?
    methode: Deux interprétations d'un même chant peuvent être différentes, sans que l'une soit fausse.
    etape: La bonne réponse ne rejette aucune des deux versions et emploie le mot « interprétations ».
  pieges:
  - si:
      contient:
      - b
    relance: 'La mélodie et les paroles restent les mêmes : ce qui change, c''est le tempo et la nuance, pas la chanson elle-même.'
  - si:
      contient:
      - c
    relance: Il n'y a pas qu'une seule bonne façon d'interpréter une chanson. Les deux peuvent être valables, simplement différentes.
  solution: Ce sont deux interprétations différentes de la même chanson, avec un tempo et une nuance différents (lent et doux
    pour l'une, rapide et fort pour l'autre).
- id: expliquer-vocabulaire-musical
  type: ouverte
  difficulte: 3
  enonce: Explique en deux phrases la différence entre le tempo, la nuance et le caractère d'une musique.
  criteres:
  - L'élève explique que le tempo est la vitesse et la nuance est la force (fort/doux).
  - L'élève explique que le caractère est l'ambiance ou le sentiment donné par la musique.
  indices:
    relance: Pense à trois questions différentes que tu peux te poser en écoutant une musique.
    methode: Une phrase pour distinguer tempo et nuance, une phrase pour définir le caractère.
    etape: Tu peux commencer par « Le tempo et la nuance sont différents parce que... », puis continuer par « Le caractère,
      lui... ».
  solution: 'Le tempo est la vitesse de la musique (lente, rapide, modérée), alors que la nuance est la force du son (fort
    ou doux) : ce sont deux choses différentes. Le caractère, lui, est l''ambiance ou le sentiment donné par la musique, comme
    joyeux, triste ou solennel.'
