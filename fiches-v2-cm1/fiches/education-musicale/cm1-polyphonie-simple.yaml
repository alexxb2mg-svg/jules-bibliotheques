format: 2
notion: cm1-polyphonie-simple
version: 3
etat: verifiee
declencheurs:
- chanter à plusieurs voix
- chanter en canon
- ma voix se mélange à l'autre
- chorale
- tenir sa partie
- chanter en même temps que les autres
- polyphonie
- ostinato
- je me perds quand on chante en canon
prerequis:
- cm1-memorisation-chant-solo
essentiel: 'Une polyphonie, c''est quand plusieurs voix ou parties chantent ou jouent en même temps, sans faire exactement
  la même chose. Le mot vient du grec : « poly » veut dire plusieurs, « phonie » veut dire voix ou son.


  Le canon est la polyphonie la plus connue à l''école. Tous chantent la même mélodie, mais les groupes commencent les uns
  après les autres. Par exemple, le groupe 2 commence au signal, quand le groupe 1 a déjà chanté le début. À un même moment,
  on entend donc des paroles différentes.


  Une autre polyphonie simple, c''est l''ostinato : un groupe répète sans arrêt un petit motif (quelques notes, quelques mots
  ou un rythme frappé avec le corps) pendant que l''autre groupe chante la mélodie.


  Tenir sa partie, c''est continuer à chanter ou à jouer ce qui t''est demandé, même si tu entends une autre voix faire autre
  chose à côté. Pour y arriver, il faut d''abord connaître ta partie par cœur, toute seule. Ensuite, tu écoutes l''autre partie,
  et enfin tu essaies ensemble.


  Les parties ne se battent pas : elles se complètent, comme les pièces d''un puzzle. Chacun garde le même tempo et les mêmes
  nuances que les autres, et écoute l''ensemble pour ne pas couvrir les autres voix.

  '
methode:
- Écoute d'abord chaque partie séparément, pour bien la connaître.
- Chante ou joue ta partie seul, plusieurs fois, jusqu'à la savoir par cœur sans hésiter.
- Écoute ensuite l'autre partie pendant que quelqu'un la chante, sans chanter la tienne.
- Essaie de tenir ta partie pendant que l'autre partie est chantée en même temps, en gardant le même tempo.
- Recommence en gardant ton attention sur ta partie tout en écoutant l'ensemble, sans chanter plus fort que les autres.
vocabulaire:
- terme: polyphonie
  definition: plusieurs voix ou parties qui chantent ou jouent en même temps, sans faire exactement la même chose
- terme: tenir sa partie
  definition: continuer à chanter ou jouer ce qui est demandé, même en entendant une autre voix faire autre chose
- terme: canon
  definition: une façon de chanter où tous chantent la même mélodie, mais en commençant les uns après les autres
- terme: ostinato
  definition: un petit motif (mélodie ou rythme) répété sans arrêt pendant qu'une autre partie se déroule
- terme: unisson
  definition: quand tout le monde chante exactement la même chose en même temps
erreurs_frequentes:
- Se mettre à chanter la partie de l'autre parce qu'on l'entend plus fort.
- Ne pas avoir assez répété sa propre partie seul avant d'essayer à plusieurs.
- Dans un canon, partir trop tôt ou trop tard au lieu d'attendre le signal ou le bon mot.
- Chanter trop fort ou trop vite pour « couvrir » l'autre partie au lieu de s'accorder avec elle.
exemple:
  enonce: La classe chante un chant en canon à deux groupes. Tu es dans le groupe 2. Quand dois-tu commencer, et que fais-tu
    si tu entends le groupe 1 chanter d'autres paroles que toi ?
  solution: 'Tu commences au signal donné par l''enseignant, ni trop tôt ni trop tard. Ensuite, tu continues ta propre phrase
    sans t''arrêter ni te laisser entraîner par les paroles du groupe 1 : c''est cela, tenir sa partie dans un canon.'
exercices:
- id: definition-polyphonie
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que la polyphonie ?
  reponse:
    options:
    - id: a
      texte: Plusieurs voix ou parties qui chantent ou jouent en même temps, sans faire exactement la même chose
    - id: b
      texte: Une seule personne qui chante plusieurs chants à la suite
    - id: c
      texte: Un chant que l'on chante toujours seul
    bonnes:
    - a
  indices:
    relance: Pense à une chorale où certains chantent une phrase pendant que d'autres en chantent une différente.
    methode: « Poly » veut dire plusieurs. Cherche la réponse où plusieurs voix se font entendre au même moment.
    etape: Élimine la réponse où l'on chante seul et celle où les chants viennent l'un après l'autre.
  pieges:
  - si:
      contient:
      - b
    relance: 'Chanter plusieurs chants à la suite, l''un après l''autre, ce n''est pas de la polyphonie : il faut que ce soit
      en même temps.'
  - si:
      contient:
      - c
    relance: Un chant en solo, c'est une seule voix. La polyphonie demande plusieurs voix simultanées.
  solution: La polyphonie, c'est quand plusieurs voix ou parties chantent ou jouent en même temps, sans faire exactement la
    même chose.
- id: mot-tenir-partie
  type: texte_court
  difficulte: 1
  enonce: Comment dit-on le fait de continuer à chanter ce qui t'est demandé, même en entendant une autre voix faire autre
    chose à côté ?
  reponse:
    acceptees:
    - tenir sa partie
    - tenir sa voix
    fautes_tolerees: 2
  indices:
    relance: Le premier mot est un verbe qui veut dire « garder, ne pas lâcher ».
    methode: Relis le vocabulaire de ta leçon, l'expression parle de ce que tu dois garder malgré l'autre voix.
    etape: Le dernier mot désigne le morceau du chant qui t'est confié, ton rôle dans le groupe.
  pieges:
  - si:
      valeur: chanter fort
    relance: Ce n'est pas une question de force de voix, mais de rester fidèle à ce qui t'est demandé malgré l'autre partie.
  solution: On appelle cela tenir sa partie, c'est-à-dire continuer à chanter ce qui t'est demandé même en entendant une autre
    voix faire autre chose.
- id: mot-canon
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une façon de chanter où tous chantent la même mélodie, mais en commençant les uns après les
    autres ?
  reponse:
    acceptees:
    - canon
    - un canon
    - en canon
    fautes_tolerees: 1
  indices:
    relance: Les groupes chantent la même mélodie, mais ne partent pas en même temps. Quel mot de ta leçon décrit cela ?
    methode: Relis le vocabulaire de ta leçon, ce mot désigne des départs décalés sur la même mélodie.
    etape: Ce n'est pas l'unisson, où tout le monde chante pareil en même temps, ni l'ostinato, qui répète un petit motif.
  pieges:
  - si:
      valeur: unisson
    relance: À l'unisson, tout le monde chante la même chose en même temps. Ici, les groupes partent les uns après les autres.
  solution: On appelle cela un canon. Tous chantent la même mélodie, mais avec des départs décalés.
- id: methode-polyphonie
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour apprendre à tenir sa partie dans une polyphonie.
  reponse:
    elements:
    - id: separee
      texte: Écouter chaque partie séparément
    - id: seul
      texte: Chanter sa partie seul plusieurs fois
    - id: ecouter-autre
      texte: Écouter l'autre partie sans chanter la sienne
    - id: ensemble
      texte: Tenir sa partie pendant que l'autre est chantée en même temps
  indices:
    relance: Que dois-tu bien connaître avant même d'essayer de chanter avec l'autre partie ?
    methode: On va du plus facile au plus difficile, de l'écoute seule jusqu'au chant à plusieurs.
    etape: Écouter chaque partie séparément vient toujours en premier, chanter ensemble vient toujours en dernier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape d'écoute séparée, en premier, puis l'étape où l'on chante ensemble, en dernier.
  solution: On écoute d'abord chaque partie séparément, puis on chante sa partie seul plusieurs fois, puis on écoute l'autre
    partie sans chanter la sienne, et enfin on tient sa partie pendant que l'autre est chantée en même temps.
- id: reaction-melange
  type: choix
  difficulte: 2
  enonce: Tu chantes ta partie dans une polyphonie et tu entends l'autre partie se mélanger à la tienne. Que dois-tu faire
    ?
  reponse:
    options:
    - id: a
      texte: Continuer ta partie sans t'arrêter ni la changer
    - id: b
      texte: Te mettre à chanter la partie de l'autre groupe
    - id: c
      texte: Arrêter de chanter jusqu'à ce que l'autre partie s'arrête
    bonnes:
    - a
  indices:
    relance: Que signifie « tenir sa partie » quand une autre voix se fait entendre en même temps ?
    methode: Tenir sa partie, c'est justement ne pas se laisser entraîner par l'autre voix.
    etape: Élimine la réponse où tu changes de partie et celle où tu te tais.
  pieges:
  - si:
      contient:
      - b
    relance: Se mettre à chanter la partie de l'autre, c'est justement l'erreur fréquente à éviter dans une polyphonie.
  - si:
      contient:
      - c
    relance: 'Arrêter de chanter, ce n''est pas tenir sa partie : il faut continuer malgré l''autre voix.'
  solution: 'Il faut continuer à chanter ta partie sans t''arrêter ni la changer, même si tu entends l''autre partie se mélanger
    à la tienne : c''est cela, tenir sa partie.'
- id: reconnaitre-polyphonie
  type: choix
  difficulte: 2
  enonce: Dans laquelle de ces situations entend-on une polyphonie ?
  reponse:
    options:
    - id: a
      texte: Toute la classe chante la même mélodie, au même moment
    - id: b
      texte: Un groupe tape un rythme qui se répète pendant que l'autre groupe chante la mélodie
    - id: c
      texte: Un élève chante seul le premier couplet, puis un autre élève chante seul le deuxième
    bonnes:
    - b
  indices:
    relance: Il faut deux choses différentes, entendues au même moment.
    methode: Pour chaque situation, demande-toi combien de parties différentes on entend en même temps.
    etape: Dans une situation tout le monde fait pareil, dans une autre les voix se suivent. Il en reste une.
  pieges:
  - si:
      contient:
      - a
    relance: Quand tout le monde chante la même chose en même temps, c'est l'unisson, pas une polyphonie.
  - si:
      contient:
      - c
    relance: Les deux élèves chantent l'un après l'autre, jamais en même temps. Ce sont deux solos à la suite.
  solution: 'C''est la situation où un groupe tape un rythme qui se répète (un ostinato) pendant que l''autre chante la mélodie
    : deux parties différentes s''entendent en même temps.'
- id: ecouter-ensemble
  type: choix
  difficulte: 3
  enonce: Pendant un canon, ton groupe chante beaucoup plus fort et plus vite que l'autre pour ne pas se perdre. Pourquoi
    est-ce une mauvaise idée ?
  reponse:
    options:
    - id: a
      texte: Parce que l'autre groupe ne s'entend plus et que les deux parties ne vont plus ensemble
    - id: b
      texte: Parce qu'il faut toujours chanter le plus doucement possible
    - id: c
      texte: Ce n'est pas une mauvaise idée, c'est ce qu'il faut faire
    bonnes:
    - a
  indices:
    relance: Dans une polyphonie, les parties se complètent comme les pièces d'un puzzle.
    methode: Demande-toi ce qui arrive à l'autre groupe si ton groupe chante plus fort et plus vite.
    etape: Si l'un va plus vite, les deux groupes ne gardent plus le même tempo. Que devient l'ensemble ?
  pieges:
  - si:
      contient:
      - b
    relance: Il ne s'agit pas de chanter le plus doucement possible, mais de garder les mêmes nuances et le même tempo que
      les autres.
  - si:
      contient:
      - c
    relance: Couvrir l'autre partie est une erreur fréquente. On garde le même tempo et on écoute l'ensemble.
  solution: 'C''est une mauvaise idée parce que l''autre groupe ne s''entend plus et que les deux parties ne vont plus ensemble
    : chacun doit garder le même tempo et les mêmes nuances, en écoutant l''ensemble.'
- id: expliquer-polyphonie
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases ce qu'est une polyphonie, donne un exemple, et dis comment tu fais pour tenir
    ta partie.
  criteres:
  - L'élève explique que la polyphonie, c'est plusieurs voix ou parties différentes entendues en même temps.
  - L'élève donne un exemple (un canon, un ostinato, une chorale à plusieurs voix).
  - L'élève explique qu'il apprend d'abord sa partie seul, puis la continue sans se laisser entraîner par l'autre voix.
  indices:
    relance: Que se passe-t-il en même temps dans une polyphonie, et que dois-tu faire pour ne pas te perdre ?
    methode: Une phrase pour définir, une phrase pour l'exemple, une phrase pour expliquer comment tenir ta partie.
    etape: Tu peux commencer par « Une polyphonie, c'est... », puis « Par exemple... », puis « Pour tenir ma partie, je...
      ».
  solution: Une polyphonie, c'est quand plusieurs voix ou parties chantent ou jouent des choses différentes en même temps.
    Par exemple, un chant en canon à deux groupes. Pour tenir ma partie, je l'apprends d'abord seul par cœur, puis je continue
    à la chanter sans m'arrêter, même quand j'entends l'autre groupe.
