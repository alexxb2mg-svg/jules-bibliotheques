- id: nblm-comment-nomme-t-on-la-superposition-de-p-7
  type: texte_court
  difficulte: 1
  enonce: Comment nomme-t-on la superposition de plusieurs voix ou parties qui chantent en même temps des choses différentes
    ?
  reponse:
    acceptees:
    - polyphonie
    fautes_tolerees: 1
  indices:
    relance: Ce terme musical désigne le fait de chanter à plusieurs voix simultanées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'polyphonie. C''est exact : la polyphonie est l''organisation musicale où plusieurs parties indépendantes se superposent.'
- id: nblm-quel-procede-permet-de-chanter-a-plusieu-8
  type: texte_court
  difficulte: 1
  enonce: Quel procédé permet de chanter à plusieurs voix en faisant entrer des groupes les uns après les autres sur le même
    chant ?
  reponse:
    acceptees:
    - canon
    fautes_tolerees: 1
  indices:
    relance: C'est une forme de chant polyphonique très connue apprise en classe, comme pour la chanson Frère Jacques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'canon. C''est exact : le canon est un chant où les entrées successives des voix créent une polyphonie.'
