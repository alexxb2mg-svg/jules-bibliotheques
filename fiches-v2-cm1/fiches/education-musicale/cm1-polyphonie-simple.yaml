format: 2
notion: cm1-polyphonie-simple
version: 1
etat: verifiee
declencheurs:
- chanter à plusieurs voix
- chanter en canon
- ma voix se mélange à l'autre
- chorale
- tenir sa partie
- chanter en même temps que les autres
- polyphonie
prerequis:
- cm1-memorisation-chant-solo
essentiel: 'La polyphonie, c''est quand plusieurs voix ou parties chantent ou jouent en même temps, mais pas exactement la
  même chose.

  Tenir sa partie, c''est continuer à chanter (ou jouer) ce qui t''est demandé, même si tu entends une autre voix faire autre
  chose à côté.

  Chaque partie a un rôle complémentaire : les parties simultanées s''assemblent pour créer un ensemble, comme dans une chorale
  à plusieurs voix.

  Il faut interpréter sa partie avec expressivité, en respectant les choix (nuances, tempo) donnés avant.'
methode:
- Écoute d'abord chaque partie séparément, pour bien la connaître.
- Chante ou joue ta partie seul, plusieurs fois, jusqu'à la savoir sans hésiter.
- Écoute ensuite l'autre partie pendant que quelqu'un la chante, sans chanter la tienne.
- Essaie de tenir ta partie pendant que l'autre partie est chantée en même temps.
- Recommence en gardant ton attention sur ta partie sans te laisser entraîner par l'autre.
vocabulaire:
- terme: polyphonie
  definition: plusieurs voix ou parties qui chantent ou jouent en même temps, sans faire exactement la même chose
- terme: tenir sa partie
  definition: continuer à chanter ou jouer ce qui est demandé, même en entendant une autre voix faire autre chose
erreurs_frequentes:
- Se mettre à chanter la partie de l'autre parce qu'on l'entend plus fort.
- Ne pas avoir assez répété sa propre partie seul avant d'essayer à plusieurs.
- Chanter trop fort ou trop vite pour « couvrir » l'autre partie au lieu de s'accorder avec elle.
exemple:
  enonce: 'Dans un jeu vocal à deux groupes, le groupe A chante une phrase pendant que le groupe B tape un rythme avec les
    mains, en même temps. Tu es dans le groupe A : que dois-tu faire si tu entends le rythme du groupe B se mélanger à ta
    phrase ?'
  solution: 'Continuer à chanter ta phrase telle que tu l''as apprise, sans t''arrêter ni changer ton chant à cause du rythme
    du groupe B : c''est justement cela, tenir sa partie dans une polyphonie.'
exercices:
- id: definition-polyphonie
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que la polyphonie ?
  reponse:
    options:
    - id: a
      texte: Plusieurs voix ou parties qui chantent ou jouent en même temps, sans faire exactement la même chose
    - id: b
      texte: Une seule personne qui chante plusieurs chants à la suite
    - id: c
      texte: Un chant que l'on chante toujours seul
    bonnes:
    - a
  indices:
    relance: Pense à une chorale où certains chantent une phrase pendant que d'autres en chantent une différente, en même
      temps.
    methode: La polyphonie parle de plusieurs voix simultanées, pas d'une seule personne ni d'un chant en solo.
    etape: La bonne réponse évoque plusieurs voix ou parties en même temps.
  pieges:
  - si:
      contient:
      - b
    relance: 'Chanter plusieurs chants à la suite, l''un après l''autre, ce n''est pas de la polyphonie : il faut que ce soit
      en même temps.'
  - si:
      contient:
      - c
    relance: Un chant en solo, c'est une seule voix. La polyphonie demande plusieurs voix simultanées.
  solution: La polyphonie, c'est quand plusieurs voix ou parties chantent ou jouent en même temps, sans faire exactement la
    même chose.
- id: mot-tenir-partie
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le fait de continuer à chanter ce qui t'est demandé, même en entendant une autre voix faire
    autre chose à côté ?
  reponse:
    acceptees:
    - tenir sa partie
    fautes_tolerees: 2
  indices:
    relance: Cette expression contient le verbe « tenir » et le mot « partie ».
    methode: Relis le vocabulaire de ta leçon, l'expression parle de ce que tu dois garder malgré l'autre voix.
    etape: L'expression commence par « tenir » et se termine par « sa partie ».
  pieges:
  - si:
      valeur: chanter fort
    relance: Ce n'est pas une question de force de voix, mais de rester fidèle à ce qui t'est demandé malgré l'autre partie.
  solution: On appelle cela tenir sa partie, c'est-à-dire continuer à chanter ce qui t'est demandé même en entendant une autre
    voix faire autre chose.
- id: methode-polyphonie
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour apprendre à tenir sa partie dans une polyphonie.
  reponse:
    elements:
    - id: separee
      texte: Écouter chaque partie séparément
    - id: seul
      texte: Chanter sa partie seul plusieurs fois
    - id: ecouter-autre
      texte: Écouter l'autre partie sans chanter la sienne
    - id: ensemble
      texte: Tenir sa partie pendant que l'autre est chantée en même temps
  indices:
    relance: Que dois-tu bien connaître avant même d'essayer de chanter avec l'autre partie ?
    methode: Commence par écouter chaque partie séparément, puis maîtrise la tienne seul, puis écoute l'autre, puis essaie
      ensemble.
    etape: Écouter chaque partie séparément vient toujours en premier, chanter ensemble vient toujours en dernier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape d'écoute séparée, en premier, puis l'étape où l'on chante ensemble, en dernier.
  solution: On écoute d'abord chaque partie séparément, puis on chante sa partie seul plusieurs fois, puis on écoute l'autre
    partie sans chanter la sienne, et enfin on tient sa partie pendant que l'autre est chantée en même temps.
- id: reaction-melange
  type: choix
  difficulte: 2
  enonce: Tu chantes ta partie dans une polyphonie et tu entends l'autre partie se mélanger à la tienne. Que dois-tu faire
    ?
  reponse:
    options:
    - id: a
      texte: Continuer ta partie sans t'arrêter ni la changer
    - id: b
      texte: Te mettre à chanter la partie de l'autre groupe
    - id: c
      texte: Arrêter de chanter jusqu'à ce que l'autre partie s'arrête
    bonnes:
    - a
  indices:
    relance: Que signifie « tenir sa partie » quand une autre voix se fait entendre en même temps ?
    methode: Tenir sa partie, c'est justement continuer sans se laisser entraîner par l'autre voix.
    etape: La bonne réponse ne change rien à ce que tu chantes déjà.
  pieges:
  - si:
      contient:
      - b
    relance: Se mettre à chanter la partie de l'autre, c'est justement l'erreur fréquente à éviter dans une polyphonie.
  - si:
      contient:
      - c
    relance: 'Arrêter de chanter, ce n''est pas tenir sa partie : il faut continuer malgré l''autre voix.'
  solution: 'Il faut continuer à chanter ta partie sans t''arrêter ni la changer, même si tu entends l''autre partie se mélanger
    à la tienne : c''est cela, tenir sa partie.'
- id: expliquer-polyphonie
  type: ouverte
  difficulte: 3
  enonce: Explique en deux phrases ce qu'est une polyphonie et comment tu fais pour tenir ta partie dedans.
  criteres:
  - L'élève explique que la polyphonie, c'est plusieurs voix qui chantent des choses différentes en même temps.
  - L'élève explique qu'il faut bien connaître sa partie seul avant, puis continuer à la chanter sans se laisser entraîner
    par l'autre voix.
  indices:
    relance: Que se passe-t-il en même temps dans une polyphonie, et que dois-tu faire pour ne pas te perdre ?
    methode: Une première phrase pour définir la polyphonie, une deuxième pour expliquer comment tenir sa partie.
    etape: Tu peux commencer par « Une polyphonie, c'est... », puis continuer par « Pour tenir ma partie, je... ».
  solution: Une polyphonie, c'est quand plusieurs voix ou parties chantent ou jouent des choses différentes en même temps.
    Pour tenir ma partie, je l'apprends d'abord seul jusqu'à la savoir sans hésiter, puis je continue à la chanter sans m'arrêter,
    même quand j'entends l'autre partie en même temps.
