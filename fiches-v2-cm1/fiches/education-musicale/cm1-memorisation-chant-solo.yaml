format: 2
notion: cm1-memorisation-chant-solo
version: 3
etat: verifiee
declencheurs:
- chanter par cœur
- chanter tout seul
- chanter en solo
- retenir une chanson
- j'oublie les paroles
- chanter sans le texte
- mémoriser une chanson
- j'ai peur de chanter seul
- couplet et refrain à apprendre
prerequis:
- cm1-interpretation-chant-modele
essentiel: 'Mémoriser un chant, c''est le savoir par cœur : tu le chantes sans lire les paroles et sans que le modèle chante
  avec toi. Il faut retenir trois choses à la fois : les paroles, la mélodie (les notes qui montent et descendent) et le rythme.


  On apprend un chant par imitation et par petits morceaux. D''abord, tu l''écoutes en entier. Puis tu le découpes phrase
  par phrase : tu répètes la première phrase, puis la deuxième, puis tu enchaînes les deux, et ainsi de suite. Le refrain
  revient plusieurs fois, il est souvent le plus facile à retenir.


  Pour t''aider, tu peux faire un geste pour chaque phrase, imaginer les images que racontent les paroles, ou fredonner la
  mélodie sans les mots. La mémoire aime la répétition : chanter un peu chaque jour vaut mieux que beaucoup une seule fois.


  Il est normal de rencontrer des difficultés : un mot qui coince, une note trop haute, une phrase oubliée. Repérer précisément
  l''endroit où tu hésites te dit sur quoi t''entraîner. Tu répètes ce passage seul, lentement, puis tu le remets dans le
  chant entier.


  Une fois le chant su par cœur, tu peux tenir un court solo : chanter seul quelques phrases devant la classe. Pour être à
  l''aise, respire avant de commencer, regarde un point devant toi et garde le même tempo que le groupe. Si tu te trompes,
  continue : le plus important est de ne pas s''arrêter.

  '
methode:
- Écoute et chante le chant plusieurs fois avec le modèle, en entier.
- Découpe le chant en petits morceaux (une phrase à la fois), puis enchaîne-les peu à peu.
- Chante sans regarder le texte, en te faisant aider par quelqu'un au début.
- 'Repère les endroits où tu hésites : répète-les seuls, lentement, puis remets-les dans le chant.'
- Essaie de chanter seul un petit passage (un solo), en respirant avant de commencer et sans t'arrêter.
vocabulaire:
- terme: chanter par cœur
  definition: chanter en connaissant toutes les paroles et toute la mélodie sans les lire
- terme: solo
  definition: un moment où l'on chante seul, sans les autres
- terme: refrain
  definition: la partie d'une chanson qui revient plusieurs fois avec les mêmes paroles
- terme: couplet
  definition: une partie d'une chanson dont les paroles changent à chaque fois
- terme: fredonner
  definition: chanter la mélodie à mi-voix, bouche fermée ou sans les paroles
erreurs_frequentes:
- Vouloir mémoriser tout le chant d'un coup, au lieu d'un morceau après l'autre.
- Chanter toujours en même temps que les autres, sans jamais essayer seul.
- Ne pas repérer les passages où l'on hésite, donc ne jamais s'entraîner dessus.
- S'arrêter net pendant un solo au moindre oubli, au lieu de continuer.
exemple:
  enonce: Tu dois savoir chanter par cœur un couplet d'une chanson apprise en classe. Comment t'entraîner à la maison ?
  solution: Réécouter le couplet plusieurs fois, puis le chanter phrase par phrase avec l'enregistrement. Ensuite, essayer
    de le chanter seul, sans l'enregistrement ni le texte, en repérant les passages où tu hésites pour les répéter lentement.
    Recommencer un peu chaque jour plutôt que tout le même soir.
exercices:
- id: definition-par-coeur
  type: choix
  difficulte: 1
  enonce: Que signifie chanter un chant « par cœur » ?
  reponse:
    options:
    - id: a
      texte: Le chanter en connaissant toutes les paroles et la mélodie, sans les lire
    - id: b
      texte: Le chanter uniquement en même temps que le modèle enregistré
    - id: c
      texte: Le chanter en lisant le texte écrit devant soi
    bonnes:
    - a
  indices:
    relance: Si tu dois lire le texte ou écouter le modèle en même temps, sais-tu vraiment le chant par cœur ?
    methode: Chanter par cœur veut dire ne plus avoir besoin d'aide extérieure (texte, enregistrement) pour chanter.
    etape: Élimine les deux réponses où quelque chose t'aide pendant que tu chantes.
  pieges:
  - si:
      contient:
      - b
    relance: Si tu as toujours besoin du modèle en même temps, tu ne chantes pas encore par cœur.
  - si:
      contient:
      - c
    relance: Lire le texte, c'est justement ce qu'on ne fait plus quand on connaît le chant par cœur.
  solution: Chanter un chant par cœur, c'est le chanter en connaissant toutes les paroles et toute la mélodie, sans lire le
    texte ni écouter le modèle en même temps.
- id: mot-solo
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un bref moment où l'on chante seul, sans les autres ?
  reponse:
    acceptees:
    - solo
    - un solo
    fautes_tolerees: 1
  indices:
    relance: Ce mot est utilisé aussi pour un musicien qui joue seul un passage.
    methode: Relis le vocabulaire de ta leçon, ce mot est court et vient de l'italien.
    etape: Ce n'est ni le refrain ni le couplet. C'est le moment où ta voix est la seule qu'on entend.
  pieges:
  - si:
      valeur: chorale
    relance: Une chorale, c'est un groupe qui chante ensemble. Le mot cherché désigne au contraire un moment où l'on chante
      seul.
  solution: On appelle cela un solo, un bref moment où l'on chante seul, sans les autres.
- id: refrain-ou-couplet
  type: choix
  difficulte: 1
  enonce: Dans une chanson, quelle partie revient plusieurs fois avec les mêmes paroles ?
  reponse:
    options:
    - id: a
      texte: Le couplet
    - id: b
      texte: Le refrain
    - id: c
      texte: Le solo
    bonnes:
    - b
  indices:
    relance: Pense à la partie que tout le monde reprend en chœur, encore et encore.
    methode: Relis le vocabulaire de ta leçon et compare les deux parties d'une chanson.
    etape: Dans une des deux parties, les paroles changent à chaque fois. Ce n'est donc pas celle-là.
  pieges:
  - si:
      contient:
      - a
    relance: Les paroles du couplet changent à chaque fois. On cherche la partie qui revient à l'identique.
  - si:
      contient:
      - c
    relance: Un solo est un moment où l'on chante seul, ce n'est pas une partie qui revient avec les mêmes paroles.
  solution: C'est le refrain qui revient plusieurs fois avec les mêmes paroles, alors que les paroles du couplet changent.
- id: methode-memorisation
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour mémoriser un chant.
  reponse:
    elements:
    - id: ecouter
      texte: Écouter et chanter le chant plusieurs fois avec le modèle
    - id: decouper
      texte: Découper le chant en petits morceaux
    - id: sans-texte
      texte: Chanter sans regarder le texte
    - id: reperer
      texte: Repérer les endroits où tu hésites
  indices:
    relance: Que dois-tu faire en tout premier, avant même de découper le chant ?
    methode: On va de l'écoute avec de l'aide jusqu'au chant tout seul, de plus en plus autonome.
    etape: Écouter le chant en entier avec le modèle vient toujours en premier dans cette méthode.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient logiquement avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape d'écoute globale, qui vient en premier, puis range les autres étapes dans un ordre logique
      de plus en plus autonome.
  solution: On écoute et on chante le chant plusieurs fois avec le modèle, puis on le découpe en petits morceaux, puis on
    chante sans regarder le texte, et enfin on repère les endroits où l'on hésite.
- id: difficulte-precise
  type: choix
  difficulte: 2
  enonce: Tu hésites toujours sur la même note trop haute dans un chant. Que dois-tu faire ?
  reponse:
    options:
    - id: a
      texte: Repérer précisément ce passage et t'entraîner dessus
    - id: b
      texte: Arrêter d'apprendre ce chant
    - id: c
      texte: Chanter le chant en entier plus vite pour ne plus y penser
    bonnes:
    - a
  indices:
    relance: Identifier précisément une difficulté sert justement à savoir sur quoi s'entraîner.
    methode: La méthode dit de repérer les passages où l'on hésite, pour s'entraîner dessus spécifiquement.
    etape: Élimine la réponse où tu abandonnes et celle où tu fais comme si la difficulté n'existait pas.
  pieges:
  - si:
      contient:
      - b
    relance: Arrêter n'aide pas à progresser. Une difficulté identifiée peut être travaillée spécifiquement.
  - si:
      contient:
      - c
    relance: Chanter plus vite sans s'arrêter sur la difficulté ne la résout pas, elle risque même de rester.
  solution: Il faut repérer précisément ce passage difficile (la note trop haute) et s'entraîner dessus, en le répétant plusieurs
    fois séparément.
- id: oubli-pendant-solo
  type: choix
  difficulte: 2
  enonce: Pendant ton solo devant la classe, tu oublies un mot. Quelle est la meilleure réaction ?
  reponse:
    options:
    - id: a
      texte: T'arrêter net et retourner à ta place
    - id: b
      texte: Continuer à chanter la mélodie et reprendre les paroles dès que tu les retrouves
    - id: c
      texte: Recommencer tout le chant depuis le début
    bonnes:
    - b
  indices:
    relance: Le plus important pendant un solo, c'est de ne pas casser le fil de la musique.
    methode: Relis la fin de l'essentiel de ta leçon sur le solo.
    etape: Élimine les deux réactions qui arrêtent la musique.
  pieges:
  - si:
      contient:
      - a
    relance: S'arrêter net casse la musique. Même un chanteur professionnel continue quand il oublie un mot.
  - si:
      contient:
      - c
    relance: Recommencer depuis le début arrête la musique et fait perdre le groupe. Mieux vaut continuer.
  solution: 'La meilleure réaction est de continuer à chanter la mélodie et de reprendre les paroles dès que tu les retrouves
    : on ne s''arrête pas pendant un solo.'
- id: chaque-jour
  type: choix
  difficulte: 3
  enonce: Lina a une semaine pour apprendre un chant. Quel est le meilleur plan ?
  reponse:
    options:
    - id: a
      texte: Le chanter pendant une heure la veille du jour où elle doit le chanter
    - id: b
      texte: Le chanter un peu chaque jour, une phrase de plus à chaque fois, en reprenant les phrases déjà apprises
    - id: c
      texte: Lire les paroles une fois par jour sans jamais les chanter
    bonnes:
    - b
  indices:
    relance: La mémoire aime la répétition, mais par petites doses.
    methode: Relis l'essentiel de ta leçon sur ce que la mémoire préfère.
    etape: Un des plans oublie la mélodie, un autre met tout au dernier moment. Il en reste un.
  pieges:
  - si:
      contient:
      - a
    relance: Tout apprendre la veille fatigue et on oublie vite. Un peu chaque jour vaut mieux.
  - si:
      contient:
      - c
    relance: Lire les paroles ne suffit pas, il faut aussi retenir la mélodie et le rythme en chantant.
  solution: 'Le meilleur plan est de chanter un peu chaque jour, une phrase de plus à chaque fois, en reprenant celles déjà
    apprises : la répétition régulière aide la mémoire.'
- id: expliquer-memorisation-solo
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases comment tu t'y prends pour mémoriser un chant et réussir un moment de chant en
    solo.
  criteres:
  - L'élève explique qu'il écoute et répète le chant plusieurs fois, en le découpant en morceaux.
  - L'élève explique qu'il repère ses difficultés et s'entraîne dessus.
  - L'élève donne au moins un conseil pour le solo (respirer avant, garder le tempo, continuer en cas d'oubli).
  indices:
    relance: Que fais-tu d'abord pour apprendre les paroles et la mélodie, puis que fais-tu pour réussir à chanter seul ?
    methode: Une première phrase sur l'écoute et la répétition par morceaux, une deuxième sur les difficultés, une troisième
      sur le solo.
    etape: Tu peux commencer par « Pour mémoriser, j'écoute... », puis continuer par « Pour réussir un solo, je... ».
  solution: Pour mémoriser un chant, j'écoute et je chante le chant plusieurs fois avec le modèle, en le découpant phrase
    par phrase. Je repère les passages où j'hésite et je les répète lentement. Pour réussir un solo, je respire avant de commencer
    et, si j'oublie un mot, je continue sans m'arrêter.
