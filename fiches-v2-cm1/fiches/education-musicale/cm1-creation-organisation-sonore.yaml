format: 2
notion: cm1-creation-organisation-sonore
version: 3
etat: verifiee
declencheurs:
- inventer une musique
- créer des sons
- organiser des sons
- partition graphique
- musicogramme
- composer un morceau
- fabriquer une musique avec des objets
- histoire sonore
- codage des sons
prerequis:
- cm1-parametres-son-exploration
essentiel: 'Créer une organisation sonore, c''est choisir des sons et les placer dans un ordre précis pour inventer une petite
  pièce musicale nouvelle. Les sons peuvent venir de ta voix, de ton corps (claquements de mains, frappes sur les cuisses),
  d''objets ou d''instruments.


  Le travail se fait en deux temps. D''abord, tu es explorateur du son : tu cherches, tu essaies, tu écoutes, sans encore
  décider. Ensuite, tu deviens compositeur : tu tries les sons, tu choisis ceux qui te plaisent et tu décides de leur ordre.


  Pour organiser les sons, tu peux jouer avec leurs paramètres. Par exemple : un son grave puis des sons aigus, des sons courts
  puis un son long. Tu peux aussi jouer de plus en plus fort, ou placer un silence pour faire une pause. Le silence fait aussi
  partie de la musique !


  Pour ne pas oublier ton organisation, tu la dessines : c''est une représentation graphique, qu''on appelle aussi partition
  graphique ou codage. Tu choisis un symbole pour chaque son : un point pour un son court, un trait pour un son long, un dessin
  plus gros pour un son fort. Puis tu places les symboles de gauche à droite, dans l''ordre où on les entend.


  Enfin, tu interprètes ta création en suivant ton dessin, comme on lit une phrase. Un camarade qui connaît ton code peut
  même la jouer à ta place. Tu peux ensuite l''améliorer si quelque chose ne sonne pas comme tu l''imaginais.

  '
methode:
- Explore plusieurs sources sonores (voix, corps, objets, instruments) sans encore chercher à créer.
- Trie les sons que tu préfères ou qui te semblent intéressants.
- Choisis un ordre pour les organiser, en jouant sur leurs paramètres (doux puis fort, court puis long, grave puis aigu, silence).
- Dessine une représentation graphique de gauche à droite, avec un symbole pour chaque son.
- Interprète ton organisation en suivant ta représentation graphique, puis améliore-la si besoin.
vocabulaire:
- terme: organisation sonore
  definition: un ensemble de sons choisis et mis dans un ordre précis
- terme: représentation graphique
  definition: un dessin ou des symboles qui aident à se souvenir d'une organisation sonore et à l'interpréter
- terme: compositeur
  definition: une personne qui invente une musique en choisissant et en organisant des sons
- terme: silence
  definition: un moment où aucun son n'est produit, qui fait partie de la musique
- terme: source sonore
  definition: ce qui produit un son (la voix, le corps, un objet, un instrument)
erreurs_frequentes:
- Choisir des sons au hasard sans réfléchir à un ordre ou une organisation.
- Oublier de garder une trace (dessin, symboles) de son organisation sonore.
- Dessiner les symboles dans le désordre, au lieu de les placer de gauche à droite dans l'ordre où on les entend.
- Changer l'organisation prévue au moment de l'interpréter, sans le vouloir.
exemple:
  enonce: 'Tu veux créer une petite organisation sonore avec ta voix : un son grave et long, puis trois sons aigus et courts,
    puis un silence. Comment la représenter graphiquement ?'
  solution: De gauche à droite, on dessine une ligne longue et basse pour le son grave et long, puis trois petits points placés
    haut pour les sons aigus et courts, puis un espace vide pour le silence. Ce dessin aide à se souvenir de l'organisation
    et à l'interpréter.
exercices:
- id: definir-organisation-sonore
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que créer une organisation sonore ?
  reponse:
    options:
    - id: a
      texte: Choisir des sons et les mettre dans un ordre pour construire quelque chose de nouveau
    - id: b
      texte: Écouter une musique déjà enregistrée sans rien changer
    - id: c
      texte: Répéter exactement un chant appris par imitation
    bonnes:
    - a
  indices:
    relance: Créer, c'est inventer quelque chose de nouveau, pas répéter ou seulement écouter.
    methode: Relis l'essentiel de ta leçon sur la création d'une organisation sonore.
    etape: Élimine la réponse où l'on ne fait qu'écouter et celle où l'on ne fait que répéter.
  pieges:
  - si:
      contient:
      - b
    relance: Écouter une musique déjà enregistrée, ce n'est pas créer, c'est plutôt de l'écoute.
  - si:
      contient:
      - c
    relance: Répéter un chant appris, c'est de l'interprétation, pas une création d'organisation sonore.
  solution: Créer une organisation sonore, c'est choisir des sons et les mettre dans un ordre pour construire quelque chose
    de nouveau.
- id: mot-representation-graphique
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un dessin ou des symboles qui aident à se souvenir d'une organisation sonore et à l'interpréter
    ?
  reponse:
    acceptees:
    - représentation graphique
    - une représentation graphique
    - partition graphique
    - codage
    fautes_tolerees: 2
  indices:
    relance: Cette expression contient un mot qui parle de dessin, comme dans « arts graphiques ».
    methode: Relis le vocabulaire de ta leçon, l'expression parle d'une manière de représenter avec des dessins.
    etape: Relis le paragraphe de ta leçon où tu dessines ton organisation pour ne pas l'oublier.
  pieges:
  - si:
      valeur: partition musicale
    relance: Une partition musicale classique utilise des notes de musique. Ici, cherche l'expression qui parle de dessins
      ou de symboles simples.
  solution: On appelle cela une représentation graphique, un dessin ou des symboles qui aident à se souvenir de l'organisation
    sonore et à l'interpréter.
- id: lire-symboles
  type: association
  difficulte: 1
  enonce: Dans une partition graphique, relie chaque symbole au son qu'il représente.
  reponse:
    gauche:
    - id: point
      texte: Un petit point
    - id: trait
      texte: Un long trait
    - id: vide
      texte: Un espace vide
    droite:
    - id: son-court
      texte: Un son court
    - id: son-long
      texte: Un son long
    - id: silence
      texte: Un silence
    paires:
      point: son-court
      trait: son-long
      vide: silence
  indices:
    relance: La longueur du dessin te renseigne sur le temps que dure le son.
    methode: Commence par le symbole où il n'y a rien du tout. À quoi correspond l'absence de son ?
    etape: Il reste le point et le trait. Lequel prend le plus de place, donc dure le plus longtemps ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare la longueur de chaque dessin à la durée du son.
  - si:
      diagnostic: associations_fausses
    relance: Pars de l'espace vide, où l'on n'entend rien, puis compare le point et le trait.
  solution: Le petit point représente un son court, le long trait un son long, et l'espace vide un silence.
- id: methode-creation
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour créer une organisation sonore.
  reponse:
    elements:
    - id: explorer
      texte: Explorer plusieurs sources sonores
    - id: trier
      texte: Trier les sons préférés
    - id: choisir-ordre
      texte: Choisir un ordre pour les organiser
    - id: dessiner
      texte: Dessiner une représentation graphique de l'organisation
  indices:
    relance: Que dois-tu faire avant même de choisir tes sons préférés ?
    methode: Commence par explorer sans choisir, puis trie, puis choisis un ordre, puis dessine ta représentation.
    etape: Explorer plusieurs sources sonores vient toujours en premier, dessiner la représentation vient toujours en dernier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape d'exploration, en premier, puis l'étape de dessin, en dernier.
  solution: On explore d'abord plusieurs sources sonores, puis on trie les sons préférés, puis on choisit un ordre pour les
    organiser, et enfin on dessine une représentation graphique de l'organisation.
- id: postures-explorateur-compositeur
  type: choix
  difficulte: 2
  enonce: Quelle est la différence entre la posture d'explorateur du son et celle de compositeur ?
  reponse:
    options:
    - id: a
      texte: L'explorateur cherche et écoute des sons, le compositeur trie, choisit et organise
    - id: b
      texte: L'explorateur choisit et organise, le compositeur cherche et écoute
    - id: c
      texte: Il n'y a aucune différence entre les deux postures
    bonnes:
    - a
  indices:
    relance: Un explorateur part à la découverte. Que fait-il avant de décider quoi que ce soit ?
    methode: L'exploration vient avant l'organisation dans la démarche de création.
    etape: Élimine d'abord la réponse qui dit qu'il n'y a pas de différence, puis vérifie qui découvre et qui décide.
  pieges:
  - si:
      contient:
      - b
    relance: 'C''est l''inverse : relis le sens du mot « explorateur », celui qui part à la découverte.'
  - si:
      contient:
      - c
    relance: 'Il y a bien une différence : l''une est une posture de recherche, l''autre une posture d''organisation.'
  solution: L'explorateur du son cherche et écoute des sons, tandis que le compositeur trie, choisit et organise ces sons
    pour créer une organisation sonore.
- id: lire-de-gauche-a-droite
  type: choix
  difficulte: 2
  enonce: 'Sur la partition graphique de Nina, on voit de gauche à droite : un gros rond, puis trois petits ronds. Si un gros
    rond veut dire « son fort » et un petit rond « son doux », comment Nina doit-elle jouer ?'
  reponse:
    options:
    - id: a
      texte: Trois sons doux, puis un son fort
    - id: b
      texte: Un son fort, puis trois sons doux
    - id: c
      texte: Quatre sons forts
    bonnes:
    - b
  indices:
    relance: Une partition graphique se lit comme une phrase. Par quel côté commence-t-on ?
    methode: Lis les symboles un par un de gauche à droite, et traduis chacun avec le code donné.
    etape: Le premier symbole à gauche est un gros rond. Que veut dire un gros rond ?
  pieges:
  - si:
      contient:
      - a
    relance: Tu as lu de droite à gauche. Une partition graphique se lit de gauche à droite, comme un texte.
  - si:
      contient:
      - c
    relance: Regarde la taille des ronds. Ils ne sont pas tous gros, et la taille dit si le son est fort ou doux.
  solution: 'On lit de gauche à droite : le gros rond donne un son fort, puis les trois petits ronds donnent trois sons doux.'
- id: role-du-silence
  type: choix
  difficulte: 3
  enonce: Pour ta création, tu veux qu'on sente une surprise avant le dernier son très fort. Que peux-tu placer juste avant
    ce dernier son ?
  reponse:
    options:
    - id: a
      texte: Un silence
    - id: b
      texte: Encore beaucoup de sons forts sans arrêt
    - id: c
      texte: Rien de spécial, l'ordre des sons n'a pas d'importance
    bonnes:
    - a
  indices:
    relance: Pour qu'un son surprenne, il faut que les oreilles soient d'abord au calme.
    methode: Pense à la pause qu'on fait avant de crier « Bouh ! » pour faire peur à quelqu'un.
    etape: Ce n'est pas un son, c'est l'absence de son, et elle fait aussi partie de la musique.
  pieges:
  - si:
      contient:
      - b
    relance: Après beaucoup de sons forts, un son fort de plus ne surprend plus personne.
  - si:
      contient:
      - c
    relance: Au contraire, l'ordre est tout l'intérêt d'une organisation sonore. C'est le compositeur qui le décide.
  solution: 'On peut placer un silence juste avant le dernier son très fort : après ce moment calme, le son fort surprend
    davantage.'
- id: expliquer-creation-sonore
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases comment tu t'y prends pour créer et interpréter une organisation sonore avec des
    objets ou ta voix.
  criteres:
  - L'élève explique qu'il explore d'abord plusieurs sons puis en choisit certains dans un ordre précis.
  - L'élève explique qu'il dessine une représentation graphique (symboles placés dans l'ordre) pour s'en souvenir.
  - L'élève dit qu'il interprète ensuite sa création en suivant son dessin.
  indices:
    relance: Que fais-tu d'abord pour trouver tes sons, puis que fais-tu pour ne pas oublier ton organisation ?
    methode: Une première phrase sur l'exploration et le choix, une deuxième sur la représentation graphique, une troisième
      sur l'interprétation.
    etape: Tu peux commencer par « D'abord, j'explore... », puis continuer par « Ensuite, je dessine... ».
  solution: D'abord, j'explore plusieurs sons avec des objets ou ma voix, puis je choisis ceux que je préfère et je les mets
    dans un ordre précis. Ensuite, je dessine une représentation graphique, avec un symbole par son, de gauche à droite. Enfin,
    je joue ma création en suivant mon dessin.
- id: nblm-lors-d-un-travail-de-creation-sonore-que-1
  type: choix
  difficulte: 2
  enonce: Lors d'un travail de création sonore, quel est le rôle de l'élève lorsqu'il agit dans la posture de compositeur
    ?
  reponse:
    options:
    - id: o1
      texte: Il trie, choisit et organise les sons retenus pour structurer la création.
    - id: o2
      texte: Il cherche et expérimente tous les bruits possibles sans effectuer de choix.
    - id: o3
      texte: Il récite par cœur les paroles d'une chanson apprise en classe.
    - id: o4
      texte: Il joue le plus fort possible pour couvrir les bruits des autres élèves.
    bonnes:
    - o1
  indices:
    relance: Pense aux actions qui succèdent à l'exploration et à l'écoute des sons.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la recherche globale et l''écoute de toutes les sources sonores correspondent à la posture
      d''explorateur du son.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : interpréter un chant appris relève du domaine de l''interprétation, non de la composition originale.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la composition cherche une organisation équilibrée des sons et des nuances, pas un volume
      excessif.'
  solution: Il trie, choisit et organise les sons retenus pour structurer la création. C'est exact. Après la phase d'exploration,
    le compositeur sélectionne et ordonne les événements sonores.
- id: nblm-a-quoi-sert-principalement-une-represent-2
  type: choix
  difficulte: 2
  enonce: À quoi sert principalement une représentation graphique lors de l'invention d'une musique ?
  reponse:
    options:
    - id: o1
      texte: À garder une trace de l'organisation sonore pour la mémoriser et l'interpréter.
    - id: o2
      texte: À remplacer le jeu musical pour ne pas avoir à produire de sons.
    - id: o3
      texte: À illustrer l'histoire avec un dessin décoratif sans lien avec la musique.
    - id: o4
      texte: À copier obligatoirement une clé de sol et des notes sur une portée classique.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au moyen visuel qui permet de ne pas oublier l'agencement des sons.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le dessin ne remplace pas la production sonore, il constitue le guide visuel pour la jouer.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la représentation graphique doit coder directement la durée, l''ordre ou la hauteur des sons.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : la création sonore utilise un codage graphique libre (symboles, formes) adapté au projet.'
  solution: À garder une trace de l'organisation sonore pour la mémoriser et l'interpréter. C'est exact. Les dessins et symboles
    servent de repères visuels pour fixer l'ordre des sons et les rejouer.
- id: nblm-quelle-est-l-une-des-erreurs-frequentes-3
  type: choix
  difficulte: 2
  enonce: Quelle est l'une des erreurs fréquentes à éviter lors de la création d'une organisation sonore ?
  reponse:
    options:
    - id: o1
      texte: Choisir des sons au hasard sans réfléchir à une organisation ou un ordre précis.
    - id: o2
      texte: Utiliser sa propre voix comme source sonore.
    - id: o3
      texte: Prévoir des moments de silence dans sa création.
    - id: o4
      texte: Dessiner des symboles pour se rappeler de la suite des sons.
    bonnes:
    - o1
  indices:
    relance: Pense à la différence entre un bruit produit sans projet et une véritable composition.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux. La voix est une source sonore privilégiée et vivement recommandée pour inventer des sons.
  - si:
      contient:
      - o3
    relance: Faux. Le silence fait partie intégrante de la structure et du rythme d'une organisation sonore.
  - si:
      contient:
      - o4
    relance: Faux. Garder une trace graphique est la méthode conseillée pour se souvenir de la composition.
  solution: Choisir des sons au hasard sans réfléchir à une organisation ou un ordre précis. C'est juste. Une création sonore
    exige de choisir une succession intentionnelle d'événements sonores.
- id: nblm-selon-la-methode-de-creation-sonore-quel-4
  type: choix
  difficulte: 2
  enonce: Selon la méthode de création sonore, quelle action faut-il réaliser au tout début du travail ?
  reponse:
    options:
    - id: o1
      texte: Explorer plusieurs sources sonores (voix, objets, instruments) pour découvrir des sons.
    - id: o2
      texte: Dessiner directement la partition graphique finale sans faire d'essais sonores.
    - id: o3
      texte: Jouer le morceau final sur scène devant un public.
    - id: o4
      texte: Trier uniquement deux sons avant même d'avoir testé d'autres instruments.
    bonnes:
    - o1
  indices:
    relance: Cherche l'étape où l'élève adopte l'attitude du chercheur de sons.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : on ne peut pas fixer un codage visuel avant d''avoir sélectionné les sons à organiser.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''interprétation finale est la dernière étape du processus de création.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : le tri intervient dans un deuxième temps, après une phase d''exploration vaste.'
  solution: Explorer plusieurs sources sonores (voix, objets, instruments) pour découvrir des sons. C'est exact. L'exploration
    et la découverte de matériaux sonores est la première étape obligatoire.
- id: nblm-pour-representer-graphiquement-un-son-gr-5
  type: choix
  difficulte: 2
  enonce: Pour représenter graphiquement un son grave et long suivi de trois sons aigus et courts, quelle est la disposition
    la plus adaptée ?
  reponse:
    options:
    - id: o1
      texte: Une ligne basse et allongée suivie de trois petits points placés vers le haut.
    - id: o2
      texte: Trois grands carrés en bas suivis d'une longue ligne verticale.
    - id: o3
      texte: Un dessin d'arbre suivi de trois dessins de fleurs.
    - id: o4
      texte: Un seul grand cercle colorié au milieu de la feuille.
    bonnes:
    - o1
  indices:
    relance: Associe la hauteur à la position verticale et la durée à la forme du trait.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : cette disposition inverse le nombre d''événements sonores et ne respecte pas la hauteur des
      sons.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : un dessin figuratif ne traduit pas visuellement les caractéristiques sonores de hauteur et
      de durée.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : un symbole unique ne permet pas de coder la succession temporelle de quatre sons distincts.'
  solution: Une ligne basse et allongée suivie de trois petits points placés vers le haut. C'est exact. La position basse
    indique le son grave, la longueur traduit la durée, et les points hauts représentent les sons brefs et aigus.
- id: nblm-quelles-sont-les-deux-propositions-qui-d-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX propositions qui décrivent des pratiques adaptées pour construire une création sonore en CM1
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Sélectionner des sons variés (voix, objets, instruments) et les ordonner de façon intentionnelle.
    - id: o2
      texte: Créer une représentation graphique avec des symboles pour mémoriser et guider l'interprétation.
    - id: o3
      texte: Recopier une partition traditionnelle en notes classiques sans explorer de nouveaux sons.
    - id: o4
      texte: Refuser de faire des essais sonores pour ne garder que la toute première idée.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie les deux choix qui associent l'agencement des sons et le support visuel de mémoire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la recopie d''une notation traditionnelle n''est pas une démarche de création et d''exploration
      sonore.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la création exige une phase préalable d''exploration et de tri avant de fixer l''organisation.'
  solution: Sélectionner des sons variés (voix, objets, instruments) et les ordonner de façon intentionnelle ; Créer une représentation
    graphique avec des symboles pour mémoriser et guider l'interprétation. C'est exact. La sélection et l'agencement réfléchi
    de sources sonores variées définissent la création sonore.
- id: nblm-comment-appelle-t-on-l-ensemble-de-dessi-7
