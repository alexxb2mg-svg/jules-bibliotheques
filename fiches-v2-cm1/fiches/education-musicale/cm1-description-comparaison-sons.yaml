# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-description-comparaison-sons
version: 3
etat: verifiee
declencheurs:
- comparer deux musiques
- décrire un son
- ressemblances entre deux musiques
- différences entre deux extraits
- à quoi ça ressemble cette musique
- décrire ce que j'entends
- chant d'oiseau et musique
- musique d'un autre pays
- musique d'autrefois
prerequis:
- cm1-vocabulaire-expression-musicale
essentiel: 'Décrire un son ou une musique, c''est dire avec des mots précis ce que l''on entend. On ne dit pas seulement «
  j''aime » ou « j''aime pas » : on explique ce qui se passe dans la musique.


  Pour décrire, pose-toi des questions simples. Qui produit le son : des voix, des instruments, la nature ? Est-ce aigu ou
  grave ? Fort ou doux ? Lent ou rapide ? Quelle ambiance cela donne-t-il ? Le timbre, c''est ce qui permet de reconnaître
  qui joue, par exemple une flûte ou un tambour.


  Comparer deux extraits, c''est chercher leurs ressemblances, ce qui est pareil, et leurs différences, ce qui change. Compare
  toujours sur le même point : par exemple le tempo des deux extraits, puis leurs instruments.


  On peut comparer des sons très variés. Il y a les sons de la biodiversité, c''est-à-dire de la nature vivante : le chant
  d''un oiseau, le cri d''un animal. Il y a aussi des musiques venues d''aires géographiques ou culturelles différentes, c''est-à-dire
  d''autres pays ou d''autres façons de vivre.


  On compare aussi des musiques de temps différents. Une musique contemporaine est une musique d''aujourd''hui. Une musique
  d''un temps historique peut être proche de nous ou très lointaine.


  Exemple : un chant d''oiseau et une flûte qui l''imite. Ressemblance : les deux sons sont aigus et légers. Différence :
  l''un vient de la nature, l''autre d''un instrument joué par un musicien.


  Pour bien comparer, réécoute chaque extrait. Puis dis au moins une ressemblance et une différence, avec des phrases complètes.

  '
methode:
- Écoute l'extrait en entier, une première fois, sans rien dire.
- Réécoute-le en cherchant des mots pour le décrire (instruments, voix, rythme, ambiance).
- Écoute un deuxième extrait de la même façon.
- Cherche un point commun entre les deux extraits (même instrument, même rythme...).
- Cherche une différence claire entre les deux extraits, en comparant le même point.
- Formule tes ressemblances et différences avec des phrases complètes.
vocabulaire:
- terme: ressemblance
  definition: ce qui est pareil entre deux musiques ou deux sons
- terme: différence
  definition: ce qui change entre deux musiques ou deux sons
- terme: extrait
  definition: un petit morceau d'une musique que l'on écoute en classe
- terme: timbre
  definition: ce qui permet de reconnaître la voix ou l'instrument qui produit un son
- terme: biodiversité
  definition: l'ensemble des êtres vivants de la nature, dont les animaux qui produisent des sons
- terme: contemporain
  definition: qui est de notre époque, d'aujourd'hui
erreurs_frequentes:
- Dire seulement « j'aime » ou « j'aime pas » au lieu de décrire ce qu'on entend.
- Comparer sans avoir bien réécouté les deux extraits.
- Confondre une ressemblance (ce qui est pareil) et une différence (ce qui change).
- Mélanger les points comparés, par exemple le tempo du premier extrait avec les instruments du second.
exemple:
  enonce: Tu écoutes un chant d'oiseau enregistré dans la nature, puis un extrait où un instrument imite le chant d'un oiseau.
    Compare les deux.
  solution: 'Ressemblance : les deux sons sont aigus et légers, avec des motifs qui se répètent. Différence : le premier est
    un son naturel (biodiversité), le second est produit par un instrument joué par un musicien.'
exercices:
- id: definir-comparer
  type: choix
  difficulte: 1
  enonce: Que signifie comparer deux musiques ?
  reponse:
    options:
    - id: a
      texte: Chercher ce qu'elles ont en commun et ce qui les différencie
    - id: b
      texte: Dire seulement laquelle on préfère
    - id: c
      texte: Les écouter une seule fois rapidement
    bonnes:
    - a
  indices:
    relance: Comparer, ce n'est pas donner une préférence, c'est chercher des points communs et des différences.
    methode: Relis l'essentiel de ta leçon. Comparer suppose de chercher deux choses précises entre les musiques.
    etape: La bonne réponse parle à la fois de points communs et de différences.
  pieges:
  - si:
      contient:
      - b
    relance: Dire ce que l'on préfère, c'est un jugement, pas une comparaison. Comparer demande de décrire des points communs
      et des différences.
  - si:
      contient:
      - c
    relance: Une seule écoute rapide ne permet pas de bien repérer les ressemblances et les différences.
  solution: Comparer deux musiques, c'est chercher ce qu'elles ont en commun et ce qui les différencie.
- id: mot-ce-qui-est-pareil
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on ce qui est pareil entre deux musiques ou deux sons ?
  reponse:
    acceptees:
    - ressemblance
    fautes_tolerees: 1
  indices:
    relance: C'est le contraire d'une différence.
    methode: Relis le vocabulaire de ta leçon, ce mot vient de « ressembler ».
    etape: Quand deux sons sont aigus tous les deux, on dit qu'ils ont un point commun. Quel nom de ta leçon dit cela ?
  pieges:
  - si:
      valeur: différence
    relance: La différence, c'est ce qui change. Cherche plutôt le mot pour ce qui est pareil.
  solution: 'On appelle cela une ressemblance : ce qui est pareil entre deux musiques ou deux sons.'
- id: phrase-difference
  type: choix
  difficulte: 1
  enonce: Laquelle de ces phrases décrit une différence entre deux extraits ?
  reponse:
    options:
    - id: a
      texte: Le premier extrait est lent, le second est rapide.
    - id: b
      texte: Les deux extraits sont chantés par des voix d'enfants.
    - id: c
      texte: J'aime bien le premier extrait.
    bonnes:
    - a
  indices:
    relance: Une différence, c'est ce qui change d'un extrait à l'autre. Quelle phrase oppose les deux extraits ?
    methode: Pour chaque phrase, demande-toi si elle dit ce qui est pareil, ce qui change, ou seulement un avis.
    etape: Une phrase dit ce qui est pareil et une autre donne seulement un goût. Il reste une seule phrase.
  pieges:
  - si:
      contient:
      - b
    relance: Les deux extraits ont des voix d'enfants, c'est donc pareil. Est-ce une ressemblance ou une différence ?
  - si:
      contient:
      - c
    relance: Dire que l'on aime, c'est un avis, pas une description. Cherche la phrase qui montre ce qui change.
  solution: '« Le premier extrait est lent, le second est rapide » décrit une différence : le tempo change d''un extrait à
    l''autre. Les voix d''enfants dans les deux extraits sont une ressemblance, et « j''aime bien » est un avis.'
- id: methode-comparaison
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour comparer deux extraits musicaux.
  reponse:
    elements:
    - id: ecouter1
      texte: Écouter le premier extrait en entier
    - id: decrire1
      texte: Réécouter en cherchant des mots pour le décrire
    - id: ecouter2
      texte: Écouter le deuxième extrait de la même façon
    - id: comparer
      texte: Chercher un point commun puis une différence entre les deux
  indices:
    relance: Que dois-tu faire avec le premier extrait avant même d'écouter le deuxième ?
    methode: Commence par bien connaître le premier extrait, puis fais pareil pour le deuxième, puis compare les deux.
    etape: Écouter le premier extrait vient toujours en premier, comparer les deux vient toujours en dernier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'écoute du premier extrait, en premier, puis la comparaison finale, en dernier.
  solution: On écoute le premier extrait en entier, puis on le réécoute en cherchant des mots pour le décrire, puis on écoute
    le deuxième extrait de la même façon, et enfin on cherche un point commun et une différence entre les deux.
- id: son-biodiversite
  type: choix
  difficulte: 2
  enonce: Un son de pluie enregistré dans la nature peut-il être décrit et comparé à une musique ?
  reponse:
    options:
    - id: a
      texte: Oui, les sons de la biodiversité peuvent être décrits et comparés à des musiques
    - id: b
      texte: Non, seuls les sons produits par des instruments peuvent être comparés
    - id: c
      texte: Non, un son de la nature n'a ni rythme ni ambiance
    bonnes:
    - a
  indices:
    relance: Relis l'essentiel de ta leçon sur ce que l'on peut décrire et comparer.
    methode: La leçon dit clairement que les sons de la biodiversité peuvent être décrits et comparés à des musiques.
    etape: La bonne réponse ne limite pas la comparaison aux seuls instruments.
  pieges:
  - si:
      contient:
      - b
    relance: La leçon dit au contraire que les sons de la nature peuvent aussi être décrits et comparés à des musiques.
  - si:
      contient:
      - c
    relance: Un son de la nature peut très bien avoir un rythme (régulier ou non) et une ambiance, comme une musique.
  solution: Oui, les sons de la biodiversité (comme la pluie) peuvent être décrits et comparés à des musiques, par exemple
    sur leur rythme ou leur ambiance.
- id: origine-des-sons
  type: association
  difficulte: 2
  enonce: Relie chaque extrait écouté en classe à ce qu'il représente.
  reponse:
    gauche:
    - id: merle
      texte: Le chant d'un merle enregistré dans un jardin
    - id: chanson-recente
      texte: Une chanson enregistrée cette année
    - id: musique-ancienne
      texte: Une musique jouée il y a très longtemps, avec des instruments d'autrefois
    - id: autre-pays
      texte: Une musique d'un autre pays, avec des instruments que tu ne connais pas
    droite:
    - id: biodiversite
      texte: Un son de la biodiversité
    - id: contemporaine
      texte: Une musique contemporaine
    - id: temps-lointain
      texte: Une musique d'un temps lointain
    - id: autre-aire
      texte: Une musique d'une autre aire géographique ou culturelle
    paires:
      merle: biodiversite
      chanson-recente: contemporaine
      musique-ancienne: temps-lointain
      autre-pays: autre-aire
  indices:
    relance: Lequel de ces extraits ne vient pas d'un musicien ? Commence par lui.
    methode: Pour les trois musiques, demande-toi si la description parle de l'époque ou du lieu d'où elles viennent.
    etape: Le merle est un animal de la nature. Pour les autres, « cette année » et « il y a très longtemps » parlent du temps,
      « un autre pays » parle du lieu.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien les deux musiques qui parlent du temps, l'une récente et l'autre
      ancienne.
  - si:
      diagnostic: associations_fausses
    relance: 'Classe d''abord chaque extrait : nature, temps ou lieu ? Puis relie-le au bon mot.'
  solution: 'Le chant du merle : un son de la biodiversité. La chanson de cette année : une musique contemporaine. La musique
    d''il y a très longtemps : une musique d''un temps lointain. La musique d''un autre pays : une musique d''une autre aire
    géographique ou culturelle.'
- id: differences-flute-tambours
  type: choix
  difficulte: 3
  enonce: 'Extrait 1 : une flûte joue doucement un air lent. Extrait 2 : des tambours jouent fort un rythme rapide. Coche
    toutes les phrases qui décrivent une différence entre les deux extraits.'
  reponse:
    options:
    - id: a
      texte: La nuance change, douce dans le premier et forte dans le second.
    - id: b
      texte: Le tempo change, lent dans le premier et rapide dans le second.
    - id: c
      texte: Les instruments ne sont pas les mêmes, donc le timbre change.
    - id: d
      texte: Les deux extraits sont joués par des instruments.
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Combien de points peux-tu comparer ici ? Pense à la force, à la vitesse et à qui joue.
    methode: Pour chaque phrase, demande-toi si elle dit ce qui change ou ce qui est pareil. Il peut y avoir plusieurs bonnes
      réponses.
    etape: Commence par la force du son, doucement puis fort. Fais de même pour la vitesse, puis pour les instruments.
  pieges:
  - si:
      contient:
      - d
    relance: Les deux extraits utilisent des instruments, c'est donc pareil. Est-ce une différence ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une partie des différences, mais pas toutes. As-tu pensé à la force, à la vitesse et à qui joue
      ?
  solution: 'Trois phrases décrivent une différence : la nuance (douce puis forte), le tempo (lent puis rapide) et le timbre,
    car une flûte et des tambours ne sonnent pas pareil. La dernière phrase, « joués par des instruments », est une ressemblance.'
- id: expliquer-comparaison
  type: ouverte
  difficulte: 3
  enonce: Choisis deux musiques que tu connais et explique en deux phrases une ressemblance et une différence entre elles.
  criteres:
  - L'élève donne le nom ou la description de deux musiques précises.
  - L'élève formule une ressemblance et une différence précises entre les deux, avec du vocabulaire musical.
  - L'élève écrit des phrases complètes et ne se limite pas à dire « j'aime » ou « j'aime pas ».
  indices:
    relance: Pense à deux chansons ou musiques très différentes que tu connais bien.
    methode: Une phrase pour la ressemblance, une phrase pour la différence.
    etape: Tu peux commencer par « Une ressemblance entre... », puis continuer par « Une différence... ».
  solution: 'Par exemple, entre une berceuse douce et lente et une musique de fête rapide et forte : une ressemblance est
    que les deux ont une mélodie chantée, une différence est que le tempo et la nuance sont opposés (lent et doux contre rapide
    et fort).'
- id: nblm-que-signifie-decrire-un-son-ou-une-musiq-1
  type: choix
  difficulte: 2
  enonce: Que signifie décrire un son ou une musique selon la fiche de cours ?
  reponse:
    options:
    - id: o1
      texte: Dire avec des mots précis ce qu'on entend comme le timbre, le rythme ou l'ambiance.
    - id: o2
      texte: Dire simplement si on aime ou si on n'aime pas le morceau.
    - id: o3
      texte: Deviner le nom du compositeur sans écouter l'extrait.
    - id: o4
      texte: Répéter exactement l'avis de ses camarades.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux mots précis qui permettent de dire ce que l'on entend vraiment.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : donner uniquement son avis personnel (« j''aime / j''aime pas ») ne décrit pas
      le son.'
  - si:
      contient:
      - o3
    relance: Décrire un son nécessite d'écouter attentivement l'extrait sonore, et non de deviner sans écouter.
  - si:
      contient:
      - o4
    relance: Décrire un son demande une écoute personnelle et de trouver ses propres mots précis.
  solution: 'Dire avec des mots précis ce qu''on entend comme le timbre, le rythme ou l''ambiance. C''est exact : décrire
    un son consiste à utiliser un vocabulaire précis pour exprimer ce qu''on entend (timbre, rythme, ambiance).'
- id: nblm-en-education-musicale-au-cm1-que-cherche-2
  type: choix
  difficulte: 2
  enonce: En éducation musicale au CM1, que cherche-t-on à faire lorsqu'on compare deux musiques ?
  reponse:
    options:
    - id: o1
      texte: Identifier ce qui rassemble les deux morceaux et ce qui les différencie.
    - id: o2
      texte: Choisir uniquement la musique la plus rapide.
    - id: o3
      texte: Vérifier la date exacte d'enregistrement du morceau.
    - id: o4
      texte: Chercher les erreurs commises par les musiciens.
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments communs et aux contrastes entre deux extraits.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La comparaison vise à analyser les caractéristiques des deux extraits, pas à en choisir un selon son tempo.
  - si:
      contient:
      - o3
    relance: On compare les éléments sonores (timbre, rythme, organisation), non les données techniques de studio.
  - si:
      contient:
      - o4
    relance: L'objectif est d'analyser la musique et son organisation, non de chercher à piéger les interprètes.
  solution: 'Identifier ce qui rassemble les deux morceaux et ce qui les différencie. C''est exact : comparer deux musiques
    consiste à chercher leurs points communs (ressemblances) et leurs différences.'
- id: nblm-de-quels-types-de-contextes-peuvent-prov-3
  type: choix
  difficulte: 2
  enonce: De quels types de contextes peuvent provenir des musiques que l'on compare entre elles ?
  reponse:
    options:
    - id: o1
      texte: D'époques différentes (anciennes ou contemporaines) et d'aires géographiques ou culturelles variées.
    - id: o2
      texte: Uniquement du même album d'un seul artiste.
    - id: o3
      texte: Uniquement des chansons apprises le matin même en classe.
    - id: o4
      texte: Seulement des bruits d'objets du quotidien.
    bonnes:
    - o1
  indices:
    relance: Pense aux voyages dans le temps et à travers différentes régions du monde.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: On peut comparer des musiques très éloignées dans le temps et dans l'espace.
  - si:
      contient:
      - o3
    relance: Le domaine d'écoute s'ouvre à des œuvres du patrimoine, contemporaines ou du monde entier.
  - si:
      contient:
      - o4
    relance: On peut comparer aussi bien des musiques d'époques et de cultures diverses que des sons de la nature.
  solution: 'D''époques différentes (anciennes ou contemporaines) et d''aires géographiques ou culturelles variées. C''est
    exact : les musiques comparées peuvent venir de cultures, de régions et d''époques proches ou lointaines.'
- id: nblm-si-l-on-compare-un-chant-d-oiseau-dans-l-4
  type: choix
  difficulte: 2
  enonce: Si l'on compare un chant d'oiseau dans la nature et un morceau de musique jouant le même motif, quelle est leur
    différence principale ?
  reponse:
    options:
    - id: o1
      texte: Le premier est un son naturel de la biodiversité, le second est produit par un instrument de musique.
    - id: o2
      texte: Le chant d'oiseau est toujours très grave alors que l'instrument est très aigu.
    - id: o3
      texte: L'instrument est un oiseau alors que le chant provient d'une guitare.
    - id: o4
      texte: Il n'y a aucune différence entre un son naturel et un son instrumental.
    bonnes:
    - o1
  indices:
    relance: 'Réfléchis à l''origine du son : vient-il d''un être vivant dans la nature ou d''un objet fabriqué ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : les deux sons partagent la ressemblance d''être aigus et légers.'
  - si:
      contient:
      - o3
    relance: 'C''est une confusion illogique : l''oiseau produit le son naturel et l''instrument est l''objet musical.'
  - si:
      contient:
      - o4
    relance: Même s'ils se ressemblent par leur hauteur, la nature de la source sonore constitue une différence évidente.
  solution: 'Le premier est un son naturel de la biodiversité, le second est produit par un instrument de musique. C''est
    exact : la provenance du son (naturel/biodiversité vs instrument joué par un musicien) est la différence clé.'
- id: nblm-quelle-est-une-erreur-frequente-lors-de-5
  type: choix
  difficulte: 2
  enonce: Quelle est une erreur fréquente lors de la description ou de la comparaison de deux extraits sonores ?
  reponse:
    options:
    - id: o1
      texte: Se limiter à dire « j'aime » ou « j'aime pas » sans décrire ce qu'on entend.
    - id: o2
      texte: Réécouter une seconde fois les deux extraits attentivement.
    - id: o3
      texte: Utiliser un vocabulaire musical précis comme le timbre ou le rythme.
    - id: o4
      texte: Formuler des phrases complètes pour expliquer les ressemblances.
    bonnes:
    - o1
  indices:
    relance: Cherche l'attitude qui consiste à donner un sentiment immédiat sans analyser la musique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Réécouter est au contraire l'étape indispensable de la méthode pour repérer les détails.
  - si:
      contient:
      - o3
    relance: Employer les bons mots musicaux est l'objectif recherché, pas une erreur.
  - si:
      contient:
      - o4
    relance: Rédiger des phrases explicatives fait partie de la démarche d'analyse correcte.
  solution: 'Se limiter à dire « j''aime » ou « j''aime pas » sans décrire ce qu''on entend. C''est exact : donner son avis
    sans expliquer ce qu''on entend est une erreur fréquente rappelée dans la fiche.'
- id: nblm-parmi-les-etapes-suivantes-quelles-sont-6
  type: choix
  difficulte: 3
  enonce: Parmi les étapes suivantes, quelles sont les DEUX bonnes étapes de la méthode pour comparer deux extraits musicaux
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Chercher un point commun (une ressemblance) entre les deux extraits.
    - id: o2
      texte: Chercher une différence claire entre les deux extraits.
    - id: o3
      texte: Écouter seulement les 2 premières secondes du premier morceau.
    - id: o4
      texte: Interdire d'utiliser des mots décrivant le rythme ou l'ambiance.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les deux actions qui permettent de comparer les éléments communs et les oppositions.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : la méthode exige d''écouter les extraits en entier pour pouvoir bien les comparer.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : il faut au contraire chercher des mots précis pour décrire ce qu''on entend.'
  solution: 'Chercher un point commun (une ressemblance) entre les deux extraits ; Chercher une différence claire entre les
    deux extraits. C''est juste : identifier un point commun (ressemblance) est l''une des deux étapes clés de la comparaison.'
