# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-reperes-culture-musicale
version: 3
etat: verifiee
declencheurs:
- orchestre symphonique
- grandes œuvres de musique
- compositeur célèbre
- musique classique
- instruments de l'orchestre
- culture musicale
- repères sur la musique
- familles d'instruments
- chef d'orchestre
prerequis:
- cm1-forme-musicale-simple
essentiel: 'Écouter des musiques de différentes époques et de différents pays permet de construire des repères de culture
  musicale. Tu connais quelques grandes œuvres, leur titre et leur compositeur, la personne qui les a inventées. Tu sais aussi
  les relier à ce que tu apprends ailleurs.


  L''orchestre symphonique est un grand ensemble de musiciens. Les instruments y sont rangés par familles. Les cordes (violon,
  alto, violoncelle, contrebasse) sont les plus nombreuses. Les vents se partagent en bois (flûte, clarinette, hautbois, basson)
  et en cuivres (trompette, cor, trombone, tuba). Les percussions (timbales, grosse caisse, cymbales, triangle) marquent le
  rythme et les effets.


  Le chef d''orchestre, debout face aux musiciens, ne joue pas d''instrument : avec sa baguette et ses gestes, il donne le
  tempo, les nuances et les départs.


  Une musique peut être vocale (chantée), instrumentale (jouée sans voix) ou les deux à la fois, comme à l''opéra. Elle peut
  être jouée par un soliste (une seule personne) ou par un ensemble (un groupe, une chorale, un orchestre).


  Relier une œuvre à d''autres matières aide à la retenir. Par exemple, l''opéra « Carmen » de Bizet raconte une histoire
  : tu peux le relier au français. Une œuvre qui imite des animaux avec des instruments se relie aux sciences. Une œuvre qui
  raconte un conte se relie à la lecture.

  '
methode:
- Écoute l'œuvre en entier et repère si elle est chantée, jouée par des instruments, ou les deux.
- Cherche si un ou plusieurs interprètes jouent (soliste ou ensemble).
- Si c'est un orchestre, essaie de repérer une famille d'instruments (cordes, bois, cuivres, percussions).
- Relie ce que tu entends à ce que tu sais déjà (une époque, un pays, une histoire, un tableau vus en classe).
- Retiens le titre, le nom du compositeur et une particularité de l'œuvre pour construire tes repères.
vocabulaire:
- terme: orchestre symphonique
  definition: un grand ensemble de musiciens qui jouent ensemble plusieurs familles d'instruments (cordes, vents, percussions)
- terme: soliste
  definition: un musicien ou un chanteur qui interprète seul
- terme: compositeur
  definition: la personne qui a inventé et écrit une œuvre musicale
- terme: chef d'orchestre
  definition: la personne qui dirige l'orchestre avec ses gestes, sans jouer d'instrument
- terme: œuvre
  definition: une création artistique, ici un morceau de musique qui a un titre et un auteur
- terme: opéra
  definition: une œuvre où l'on raconte une histoire en chantant, sur scène, avec un orchestre
erreurs_frequentes:
- Croire qu'un orchestre symphonique n'a qu'une seule famille d'instruments.
- Ranger la flûte dans les cuivres parce qu'elle peut être en métal, alors qu'elle fait partie des bois.
- Confondre le compositeur, qui a inventé l'œuvre, et l'interprète, qui la joue ou la chante.
- Confondre une œuvre vocale (chantée) et une œuvre instrumentale (jouée sans voix).
exemple:
  enonce: Ta classe écoute un extrait de l'opéra « Carmen » de Bizet. On entend un chanteur soliste et un orchestre. Que peux-tu
    retenir pour construire tes repères de culture musicale ?
  solution: 'Le titre est « Carmen » et le compositeur est Bizet. C''est un extrait d''opéra : l''œuvre est à la fois vocale
    (le soliste chante) et instrumentale (l''orchestre joue). Je peux la relier au français, car un opéra raconte une histoire.'
exercices:
- id: definir-orchestre
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un orchestre symphonique ?
  reponse:
    options:
    - id: a
      texte: Un grand ensemble de musiciens qui jouent ensemble plusieurs familles d'instruments
    - id: b
      texte: Un seul musicien qui joue de plusieurs instruments à la suite
    - id: c
      texte: Un groupe de chanteurs sans aucun instrument
    bonnes:
    - a
  indices:
    relance: Pense à ce que tu vois sur une scène de concert classique, avec beaucoup de musiciens différents.
    methode: Relis le vocabulaire de ta leçon. Compte combien de musiciens et quelles sortes d'instruments il y a.
    etape: Élimine la réponse avec un seul musicien et celle où il n'y a aucun instrument.
  pieges:
  - si:
      contient:
      - b
    relance: Un orchestre symphonique rassemble plusieurs musiciens différents, pas un seul qui joue de plusieurs instruments.
  - si:
      contient:
      - c
    relance: Un orchestre symphonique joue des instruments (cordes, vents, percussions), ce n'est pas un groupe de chanteurs
      sans instruments.
  solution: Un orchestre symphonique est un grand ensemble de musiciens qui jouent ensemble plusieurs familles d'instruments
    (cordes, vents, percussions).
- id: mot-soliste
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un musicien ou un chanteur qui interprète seul ?
  reponse:
    acceptees:
    - soliste
    - un soliste
    fautes_tolerees: 1
  indices:
    relance: Ce mot ressemble au mot « solo ».
    methode: Relis le vocabulaire de ta leçon, ce mot désigne celui qui joue ou chante seul.
    etape: Ce n'est ni le compositeur ni l'orchestre. Relis la phrase de ta leçon sur la musique jouée par une seule personne.
  pieges:
  - si:
      valeur: orchestre
    relance: Un orchestre, c'est un ensemble de plusieurs musiciens. Le mot cherché désigne celui qui joue seul.
  - si:
      valeur: compositeur
    relance: Le compositeur invente la musique. On cherche ici celui qui la joue ou la chante seul.
  solution: 'On appelle cela un soliste : un musicien ou un chanteur qui interprète seul.'
- id: familles-instruments
  type: association
  difficulte: 2
  enonce: Relie chaque instrument à sa famille dans l'orchestre symphonique.
  reponse:
    gauche:
    - id: violoncelle
      texte: Le violoncelle
    - id: trompette
      texte: La trompette
    - id: timbales
      texte: Les timbales
    - id: clarinette
      texte: La clarinette
    droite:
    - id: cordes
      texte: Les cordes
    - id: cuivres
      texte: Les cuivres
    - id: percussions
      texte: Les percussions
    - id: bois
      texte: Les bois
    paires:
      violoncelle: cordes
      trompette: cuivres
      timbales: percussions
      clarinette: bois
  indices:
    relance: Demande-toi comment on joue de chaque instrument, en frottant, en soufflant ou en frappant.
    methode: Commence par l'instrument que l'on frappe, puis celui qui a des cordes, puis sépare les deux instruments à vent.
    etape: Parmi les deux instruments à vent, l'un est en métal brillant avec une embouchure ronde, l'autre est souvent noir
      avec des clés.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout les deux instruments où l'on souffle.
  - si:
      diagnostic: associations_fausses
    relance: Pars de l'instrument que l'on frappe avec des baguettes, puis de celui que l'on frotte avec un archet.
  solution: Le violoncelle fait partie des cordes, la trompette des cuivres, les timbales des percussions et la clarinette
    des bois.
- id: types-production
  type: association
  difficulte: 2
  enonce: Relie chaque type de production musicale à sa description.
  reponse:
    gauche:
    - id: vocale-mot
      texte: Vocale
    - id: instrumentale-mot
      texte: Instrumentale
    - id: soliste-mot
      texte: Soliste
    droite:
    - id: def-chantee
      texte: Une musique chantée par une ou plusieurs voix
    - id: def-jouee
      texte: Une musique jouée par des instruments, sans voix
    - id: def-seul
      texte: Une musique interprétée par une seule personne
    paires:
      vocale-mot: def-chantee
      instrumentale-mot: def-jouee
      soliste-mot: def-seul
  indices:
    relance: Un de ces mots parle de la voix, un autre des instruments, le dernier du nombre de musiciens.
    methode: Associe d'abord le mot que tu connais le mieux, puis élimine sa définition pour les deux autres mots.
    etape: « Vocale » ressemble au mot « voix ». Reste à répartir les deux autres définitions.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque mot en te demandant s'il parle de voix, d'instruments, ou du
      nombre d'interprètes.
  - si:
      diagnostic: associations_fausses
    relance: Pars du mot « vocale », qui parle de voix chantée, puis distingue instruments et nombre d'interprètes pour les
      deux autres mots.
  solution: 'Vocale : une musique chantée par une ou plusieurs voix. Instrumentale : une musique jouée par des instruments,
    sans voix. Soliste : une musique interprétée par une seule personne.'
- id: role-chef
  type: choix
  difficulte: 1
  enonce: Que fait le chef d'orchestre pendant un concert ?
  reponse:
    options:
    - id: a
      texte: Il joue de tous les instruments à tour de rôle
    - id: b
      texte: Il dirige les musiciens avec ses gestes, en donnant le tempo, les nuances et les départs
    - id: c
      texte: Il a écrit toutes les œuvres que l'orchestre joue
    bonnes:
    - b
  indices:
    relance: Le chef d'orchestre tient souvent une petite baguette, mais ce n'est pas un instrument.
    methode: Relis l'essentiel de ta leçon sur le chef d'orchestre.
    etape: Celui qui a écrit l'œuvre a un autre nom. Et le chef ne joue pas d'instrument.
  pieges:
  - si:
      contient:
      - a
    relance: Le chef d'orchestre ne joue d'aucun instrument pendant le concert, il est face aux musiciens.
  - si:
      contient:
      - c
    relance: Celui qui a écrit l'œuvre, c'est le compositeur. Le chef d'orchestre peut diriger des œuvres écrites par d'autres.
  solution: Le chef d'orchestre dirige les musiciens avec ses gestes et sa baguette, en donnant le tempo, les nuances et les
    départs, sans jouer lui-même d'instrument.
- id: pierre-et-le-loup
  type: choix
  difficulte: 2
  enonce: Dans un conte musical, chaque personnage est joué par un instrument. Quel instrument choisir pour jouer un petit
    oiseau ?
  reponse:
    options:
    - id: a
      texte: La flûte traversière
    - id: b
      texte: La contrebasse
    - id: c
      texte: Les timbales
    bonnes:
    - a
  indices:
    relance: Un oiseau chante avec un son aigu, léger et rapide.
    methode: Cherche l'instrument dont le son est le plus aigu et le plus léger.
    etape: La contrebasse et les timbales donnent des sons graves et lourds. Lequel reste ?
  pieges:
  - si:
      contient:
      - b
    relance: La contrebasse a un son très grave. Un petit oiseau chante plutôt aigu.
  - si:
      contient:
      - c
    relance: Les timbales sont des percussions au son grave et puissant. Un petit oiseau chante plutôt aigu et léger.
  solution: On choisit la flûte traversière, dont le son aigu et léger imite bien le chant d'un oiseau.
- id: relier-connaissances
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il utile de relier une œuvre écoutée en musique à d'autres connaissances (histoire, géographie...)
    ?
  reponse:
    options:
    - id: a
      texte: Cela aide à mieux comprendre le contexte de l'œuvre
    - id: b
      texte: Cela permet de ne plus avoir besoin d'écouter la musique
    - id: c
      texte: Cela n'a aucun intérêt pour la culture musicale
    bonnes:
    - a
  indices:
    relance: Relis l'essentiel de ta leçon sur les repères de culture musicale.
    methode: Associer une œuvre à d'autres savoirs permet de mieux comprendre son contexte, pas de remplacer l'écoute.
    etape: La bonne réponse parle d'une meilleure compréhension du contexte.
  pieges:
  - si:
      contient:
      - b
    relance: Relier une œuvre à d'autres connaissances ne remplace pas l'écoute, cela l'enrichit.
  - si:
      contient:
      - c
    relance: Au contraire, la leçon dit que cela aide à construire des repères de culture musicale.
  solution: Relier une œuvre écoutée à d'autres connaissances (histoire, géographie, français...) aide à mieux comprendre
    son contexte et construit des repères de culture musicale.
- id: lien-quatre-saisons
  type: choix
  difficulte: 3
  enonce: Ta classe écoute une œuvre dont chaque partie décrit une saison de l'année. Quel lien avec une autre matière t'aide
    le mieux à retenir cette œuvre ?
  reponse:
    options:
    - id: a
      texte: En sciences, on étudie les saisons, et chaque partie de l'œuvre décrit une saison
    - id: b
      texte: Aucun lien n'est possible, la musique n'a rien à voir avec les autres matières
    - id: c
      texte: On peut retenir l'œuvre sans jamais l'écouter, seulement en lisant son titre
    bonnes:
    - a
  indices:
    relance: Relis bien l'énoncé. De quoi parle chaque partie de l'œuvre ?
    methode: Relis l'essentiel de ta leçon sur les liens entre une œuvre et d'autres matières.
    etape: Élimine la réponse qui refuse tout lien et celle qui supprime l'écoute.
  pieges:
  - si:
      contient:
      - b
    relance: Au contraire, relier une œuvre à d'autres connaissances aide à construire des repères de culture musicale.
  - si:
      contient:
      - c
    relance: Relier une œuvre à d'autres connaissances ne remplace pas l'écoute, cela l'enrichit.
  solution: 'Le meilleur lien est avec les sciences : on y étudie les saisons, et chaque partie de cette œuvre décrit une
    saison. Ce lien aide à mieux comprendre et retenir l''œuvre.'
- id: expliquer-reperes-culturels
  type: ouverte
  difficulte: 3
  enonce: Cite le titre et le compositeur d'une œuvre que tu as écoutée en classe, et explique en deux phrases ce qui t'aide
    à la retenir.
  criteres:
  - L'élève donne un titre réel d'œuvre et son compositeur.
  - L'élève décrit une caractéristique musicale (vocale, instrumentale, soliste, orchestre, famille d'instruments).
  - L'élève fait un lien avec une connaissance d'un autre domaine (histoire, sciences, français, arts plastiques).
  indices:
    relance: Pense à une œuvre déjà écoutée en classe et à ce que tu sais d'elle (compositeur, époque, instruments).
    methode: Nomme d'abord l'œuvre et son compositeur, puis décris ce que tu entends, puis fais un lien avec une autre matière.
    etape: Tu peux commencer par « J'ai écouté... de... », puis continuer par « Je la retiens parce que... ».
  solution: Par exemple, j'ai écouté un extrait de l'opéra « Carmen » de Bizet. Cette œuvre est à la fois vocale et instrumentale,
    car un soliste chante avec l'orchestre. Je la retiens grâce au français, car un opéra raconte une histoire.
