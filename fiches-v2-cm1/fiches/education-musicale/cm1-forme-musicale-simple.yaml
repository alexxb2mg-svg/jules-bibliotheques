format: 2
notion: cm1-forme-musicale-simple
version: 3
etat: verifiee
declencheurs:
- couplet refrain
- structure d'une chanson
- ça se répète dans la musique
- forme ABA
- organisation d'une musique
- motif qui revient
- le refrain revient
- même air qui revient
- chanson en plusieurs parties
prerequis:
- cm1-description-comparaison-sons
essentiel: 'La forme d''une musique, c''est la façon dont elle est organisée dans le temps. On cherche ce qui se répète et
  ce qui change.


  Pour la trouver, écoute ce qui revient. Cela peut être une mélodie, un air que tu peux fredonner. Cela peut être un motif
  rythmique, un petit rythme de quelques sons, comme « tam tam ta-ta tam ». Cela peut aussi être un thème, l''air principal
  du morceau, ou une partie caractéristique, facile à reconnaître.


  Quand tu repères des parties, donne-leur une lettre. La première partie s''appelle A. Une partie différente s''appelle B.
  Si la première partie revient, tu écris encore A.


  La forme couplet/refrain est celle de beaucoup de chansons. Le refrain revient plusieurs fois, avec les mêmes paroles et
  la même mélodie. Entre deux refrains, les couplets changent de paroles à chaque fois.


  La forme ABA a trois moments : une partie A, puis une partie B différente, puis le retour de la partie A. C''est comme une
  sortie : tu pars de la maison (A), tu vas au parc (B), puis tu rentres à la maison (A).


  Exemple : en classe, tu chantes le refrain, un couplet, le refrain, un autre couplet, puis encore le refrain. Le refrain
  revient entre des couplets différents : c''est une forme couplet/refrain.


  Un passage déjà entendu peut revenir joué plus fort ou par un autre instrument. Si la mélodie est la même, c''est quand
  même une répétition. Écoute plusieurs fois avant de nommer la forme.

  '
methode:
- Écoute la musique en entier une première fois.
- Repère si un morceau de mélodie ou de rythme revient plusieurs fois (une répétition).
- Compte combien de parties différentes tu entends (A, B, un refrain, un couplet...).
- Donne une lettre à chaque partie, dans l'ordre où tu l'entends.
- Regarde dans quel ordre ces parties reviennent.
- 'Nomme la forme que tu as trouvée : couplet/refrain, ABA, ou une autre organisation simple.'
vocabulaire:
- terme: forme musicale
  definition: la façon dont une musique est organisée dans le temps, avec ce qui se répète et ce qui change
- terme: répétition
  definition: le retour d'une mélodie, d'un rythme ou d'une partie déjà entendue
- terme: motif rythmique
  definition: un petit rythme de quelques sons qui revient dans la musique
- terme: thème
  definition: l'air principal d'un morceau, celui que l'on reconnaît
- terme: couplet
  definition: une partie d'une chanson qui change de paroles à chaque fois qu'elle revient
- terme: refrain
  definition: une partie d'une chanson qui revient identique, avec les mêmes paroles et la même mélodie
erreurs_frequentes:
- Confondre le couplet et le refrain (le refrain est celui qui ne change pas).
- Croire qu'une seule écoute suffit pour repérer une répétition.
- Dire « ABA » sans avoir vérifié que la partie A revient bien identique à la fin.
- Prendre pour une nouvelle partie un passage déjà entendu, mais joué plus fort ou par un autre instrument.
- Oublier de compter le premier ou le dernier refrain d'une chanson.
exemple:
  enonce: 'Dans une musique, tu entends : une première partie calme jouée à la flûte, une deuxième partie rapide avec des
    tambours, puis la partie calme à la flûte qui revient identique. Quelle forme reconnais-tu ?'
  solution: 'La partie calme est la partie A. La partie rapide, différente, est la partie B. Ensuite, la partie A revient
    identique. L''ordre est donc A, puis B, puis A : c''est une forme ABA.'
exercices:
- id: definir-refrain
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que le refrain d'une chanson ?
  reponse:
    options:
    - id: a
      texte: Une partie qui revient identique, avec les mêmes paroles et la même mélodie
    - id: b
      texte: Une partie qui change de paroles à chaque fois qu'elle revient
    - id: c
      texte: La toute première partie de la chanson, qui ne revient jamais
    bonnes:
    - a
  indices:
    relance: Pense à une chanson que tu connais bien. Quelle partie chantes-tu toujours pareil, à chaque fois qu'elle revient
      ?
    methode: Le refrain se distingue du couplet parce qu'il ne change pas.
    etape: La bonne réponse dit que la partie revient identique.
  pieges:
  - si:
      contient:
      - b
    relance: Une partie qui change de paroles à chaque fois, c'est plutôt la définition du couplet, pas du refrain.
  - si:
      contient:
      - c
    relance: Le refrain revient plusieurs fois dans la chanson, il n'est pas limité à une seule apparition.
  solution: Le refrain est une partie d'une chanson qui revient identique, avec les mêmes paroles et la même mélodie.
- id: mot-forme-aba
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la forme musicale en trois moments, où une première partie revient après une partie différente
    ?
  reponse:
    acceptees:
    - ABA
    fautes_tolerees: 1
  indices:
    relance: On donne une lettre à chaque partie. Quelle lettre porte la première partie ? Et la partie différente ?
    methode: Relis l'essentiel de ta leçon sur les formes musicales simples.
    etape: Écris la lettre de chaque moment dans l'ordre d'écoute. La première partie revient à la fin.
  pieges:
  - si:
      valeur: couplet-refrain
    relance: Couplet/refrain est une autre forme simple, mais ici on cherche celle avec les lettres A et B.
  solution: On appelle cela la forme ABA, où la partie A revient après la partie B.
- id: compter-refrains
  type: nombre
  difficulte: 1
  enonce: 'Une chanson se déroule dans cet ordre : refrain, premier couplet, refrain, deuxième couplet, refrain. Combien de
    fois entends-tu le refrain ?'
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Relis l'ordre des parties. Lesquelles portent le nom « refrain » ?
    methode: Pose ton doigt sur chaque partie de la liste, l'une après l'autre, et compte seulement les refrains.
    etape: La chanson commence par un refrain, cela fait déjà un. Continue jusqu'à la fin de la liste.
  pieges:
  - si:
      valeur: 2
    relance: As-tu bien compté le refrain du tout début et celui de la toute fin ?
  - si:
      valeur: 5
    relance: Tu as compté toutes les parties. Ne compte que les refrains, pas les couplets.
  solution: 'On compte les refrains dans la liste : le 1er au début, le 2e au milieu, le 3e à la fin. On entend donc le refrain
    3 fois (1 + 1 + 1 = 3).'
- id: methode-repere-forme
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour repérer la forme d'une musique.
  reponse:
    elements:
    - id: ecouter
      texte: Écouter la musique en entier une première fois
    - id: reperer
      texte: Repérer si un morceau de mélodie ou de rythme revient plusieurs fois
    - id: compter
      texte: Compter combien de parties différentes tu entends
    - id: nommer
      texte: Nommer la forme trouvée
  indices:
    relance: Que dois-tu faire avant même de chercher des répétitions ?
    methode: Commence par une écoute globale, puis repère les répétitions, puis compte les parties, puis nomme la forme.
    etape: Écouter la musique en entier vient toujours en premier, nommer la forme vient toujours en dernier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'écoute globale, en premier, puis nommer la forme, en dernier.
  solution: On écoute la musique en entier une première fois, puis on repère si un morceau revient plusieurs fois, puis on
    compte les parties différentes, et enfin on nomme la forme trouvée.
- id: verifier-aba
  type: choix
  difficulte: 2
  enonce: Tu penses avoir entendu une forme ABA dans une musique. Que dois-tu vérifier avant d'être sûr ?
  reponse:
    options:
    - id: a
      texte: Que la partie A revient bien identique à la fin
    - id: b
      texte: Que la musique dure plus de trois minutes
    - id: c
      texte: Qu'il y a exactement quatre parties différentes
    bonnes:
    - a
  indices:
    relance: L'erreur fréquente est de dire « ABA » sans avoir vérifié un détail important sur la dernière partie.
    methode: Relis les erreurs fréquentes de ta leçon sur la forme ABA.
    etape: La bonne réponse concerne la ressemblance entre la première et la dernière partie.
  pieges:
  - si:
      contient:
      - b
    relance: La durée de la musique n'a rien à voir avec le fait qu'elle soit en forme ABA ou non.
  - si:
      contient:
      - c
    relance: La forme ABA a seulement deux parties différentes (A et B), pas quatre.
  solution: Il faut vérifier que la partie A revient bien identique à la fin, sinon ce n'est pas vraiment une forme ABA.
- id: ce-qui-se-repete
  type: association
  difficulte: 2
  enonce: Relie chaque description à ce que l'on repère dans la musique.
  reponse:
    gauche:
    - id: petit-rythme
      texte: Un petit rythme de quelques sons qui revient souvent
    - id: memes-paroles
      texte: Une partie chantée qui revient avec les mêmes paroles et la même mélodie
    - id: paroles-changent
      texte: Une partie chantée dont les paroles changent à chaque fois
    - id: entre-deux-a
      texte: Une partie différente, placée entre deux parties A
    droite:
    - id: motif-rythmique
      texte: Un motif rythmique
    - id: refrain
      texte: Le refrain
    - id: couplet
      texte: Un couplet
    - id: partie-b
      texte: La partie B
    paires:
      petit-rythme: motif-rythmique
      memes-paroles: refrain
      paroles-changent: couplet
      entre-deux-a: partie-b
  indices:
    relance: Parmi ces descriptions, lesquelles parlent de chansons avec des paroles, et laquelle parle seulement de rythme
      ?
    methode: Commence par les deux parties chantées en te demandant si les paroles restent pareilles ou changent. Place ensuite
      les deux autres.
    etape: Une partie différente glissée entre deux parties A porte la lettre qui suit A dans l'alphabet. Reste le rythme
      et les deux parties chantées.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pour les parties chantées, demande-toi si les paroles restent pareilles ou
      changent.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends une description à la fois : parle-t-elle d''un rythme, de paroles qui reviennent, de paroles qui changent,
      ou d''une lettre ?'
  solution: 'Un petit rythme qui revient : un motif rythmique. Une partie qui revient avec les mêmes paroles et la même mélodie
    : le refrain. Une partie dont les paroles changent : un couplet. Une partie différente entre deux parties A : la partie
    B.'
- id: trouver-forme-flute-tambours
  type: choix
  difficulte: 3
  enonce: Tu écoutes une musique. D'abord, une flûte joue un air calme. Ensuite, des tambours jouent un rythme rapide, très
    différent. Enfin, la flûte rejoue exactement le même air calme qu'au début. Quelle est la forme de cette musique ?
  reponse:
    options:
    - id: a
      texte: ABA
    - id: b
      texte: AB
    - id: c
      texte: Couplet/refrain
    - id: d
      texte: AAB
    bonnes:
    - a
  indices:
    relance: Combien de parties différentes entends-tu ? Et laquelle revient ?
    methode: Donne la lettre A à la première partie, une autre lettre à la partie différente, puis regarde quelle lettre porte
      la dernière partie.
    etape: L'air de flûte du début est la partie A et les tambours sont une partie différente. L'air de la fin est-il nouveau
      ou déjà entendu ?
  pieges:
  - si:
      contient:
      - b
    relance: Tu as oublié la dernière partie. Que joue la flûte à la fin ?
  - si:
      contient:
      - c
    relance: Il n'y a ni paroles ni chanson ici. Utilise plutôt des lettres pour nommer les parties.
  - si:
      contient:
      - d
    relance: La partie des tambours arrive en deuxième, pas en dernier. Remets les lettres dans l'ordre d'écoute.
  solution: 'La flûte du début est la partie A. Les tambours, très différents, sont la partie B. La flûte rejoue le même air
    : c''est le retour de A. L''ordre est A, B, A : c''est une forme ABA.'
- id: expliquer-forme-musicale
  type: ouverte
  difficulte: 3
  enonce: Explique en deux phrases la différence entre la forme couplet/refrain et la forme ABA.
  criteres:
  - L'élève explique que dans couplet/refrain, le refrain revient identique entre des couplets qui changent.
  - L'élève explique que dans la forme ABA, la partie A revient identique après une partie B différente.
  - L'élève donne un exemple, une chanson qu'il connaît ou un plan écrit avec des lettres.
  indices:
    relance: Pense à ce qui change et à ce qui reste identique dans chacune des deux formes.
    methode: Une phrase pour couplet/refrain, une phrase pour ABA.
    etape: Tu peux commencer par « Dans couplet/refrain... », puis continuer par « Dans la forme ABA... ».
  solution: Dans la forme couplet/refrain, le refrain revient identique plusieurs fois entre des couplets qui changent de
    paroles à chaque fois. Dans la forme ABA, une partie A est suivie d'une partie B différente, puis la partie A revient
    identique à la fin.
