format: 2
notion: cm1-prise-en-compte-spectateur
version: 1
etat: verifiee
declencheurs:
- exposition de classe
- comment on regarde mon dessin
- tourner autour de la sculpture
- accrocher haut ou bas
- présenter à la classe
- effet sur le public
prerequis: []
essentiel: 'Quand on crée une production plastique, on peut penser à la personne qui va la regarder : c''est prendre en compte
  le spectateur.


  Il existe différentes façons de présenter une œuvre pour que le spectateur la reçoive bien : l''accrochage (comment elle
  est fixée ou posée), la mise en espace, la mise en scène.


  La frontalité, c''est quand on regarde l''œuvre bien en face ; la circulation ou le parcours, c''est quand il faut se déplacer
  autour ou à travers pour tout voir.


  Le spectateur peut être passif (il regarde sans bouger) ou participer activement (il doit se déplacer, toucher, agir). Le
  rapport d''échelle (une œuvre très grande ou très petite) change aussi l''effet recherché sur le spectateur.'
methode:
- Se demander qui va regarder la production et comment il va se placer devant elle.
- Choisir si l'œuvre se regarde de face (frontalité) ou si le spectateur doit se déplacer.
- Décider de la taille de l'œuvre en pensant à l'effet voulu sur celui qui la regarde.
- Vérifier, en regardant sa propre production comme un spectateur, si l'effet recherché fonctionne.
vocabulaire:
- terme: frontalité
  definition: le fait de regarder une œuvre bien en face, sans se déplacer
- terme: parcours
  definition: déplacement du spectateur autour ou à travers une œuvre pour la découvrir
erreurs_frequentes:
- Créer une production sans jamais se demander comment le spectateur va la voir.
- Faire une œuvre minuscule alors qu'on veut qu'elle impressionne de loin, ou l'inverse.
- Oublier que la façon d'accrocher ou de poser une production change son effet sur le spectateur.
exemple:
  enonce: Pour la fête de l'école, tu dois présenter un dessin. Dois-tu le poser sur une petite table basse ou l'accrocher
    haut sur un mur bien éclairé ?
  solution: 'Cela dépend de l''effet recherché : accroché haut sur un mur éclairé, le dessin est vu de loin par beaucoup de
    monde dès l''entrée (bonne visibilité pour un grand public) ; posé bas sur une table, il invite le spectateur à s''approcher
    et à le regarder de près, dans un moment plus intime.'
exercices:
- id: mot-frontalite
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le fait de regarder une œuvre bien en face, sans avoir besoin de se déplacer ?
  reponse:
    acceptees:
    - frontalité
    fautes_tolerees: 1
  indices:
    relance: Pense à ce que tu fais quand tu te tiens droit devant une œuvre, sans bouger sur les côtés.
    methode: Relis le vocabulaire de ta leçon. Un mot désigne le fait de regarder une œuvre bien en face.
    etape: Le mot commence par « front » et se termine par « -alité ».
  pieges:
  - si:
      valeur: parcours
    relance: Le parcours implique de se déplacer autour d'une œuvre. On cherche le mot pour regarder une œuvre en face, sans
      bouger.
  - si:
      valeur: accrochage
    relance: L'accrochage désigne la façon de fixer une œuvre. On cherche le mot pour la façon de la regarder bien en face.
  solution: 'Le mot est « frontalité » : le fait de regarder une œuvre bien en face, sans se déplacer.'
- id: sculpture-cachee
  type: choix
  difficulte: 1
  enonce: Nina fabrique une sculpture avec un détail important caché derrière, visible seulement si on tourne autour. Que
    doit faire le spectateur pour tout voir ?
  reponse:
    options:
    - id: a
      texte: Rester bien en face de la sculpture, sans bouger
    - id: b
      texte: Se déplacer autour de la sculpture (un parcours)
    - id: c
      texte: Regarder la sculpture de très loin
    bonnes:
    - b
  indices:
    relance: Si un détail est caché derrière l'œuvre, peut-on le voir en restant immobile devant elle ?
    methode: Repense à la différence entre regarder une œuvre bien en face (frontalité) et devoir se déplacer autour (parcours).
    etape: Un détail caché derrière la sculpture n'est visible que si le spectateur se déplace pour en faire le tour.
  pieges:
  - si:
      contient:
      - a
    relance: En restant bien en face, sans bouger, peut-on voir un détail caché derrière la sculpture ?
  - si:
      contient:
      - c
    relance: S'éloigner ne permet pas de voir un détail caché derrière l'objet. Il faut plutôt se déplacer autour de la sculpture.
  solution: 'Le spectateur doit se déplacer autour de la sculpture, c''est un parcours : c''est le seul moyen de découvrir
    le détail caché derrière.'
- id: mot-parcours
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le déplacement du spectateur autour ou à travers une œuvre pour la découvrir entièrement ?
  reponse:
    acceptees:
    - parcours
    fautes_tolerees: 1
  indices:
    relance: Pense à ce que fait un visiteur de musée qui doit marcher tout autour d'une statue pour la voir sous tous les
      angles.
    methode: Ce mot désigne un déplacement, pas le fait de rester immobile devant l'œuvre.
    etape: Le mot commence par « par » et se termine par « -cours ».
  pieges:
  - si:
      valeur: frontalité
    relance: La frontalité désigne le fait de rester immobile en face de l'œuvre. On cherche le mot pour le déplacement autour
      d'elle.
  - si:
      valeur: circulation
    relance: C'est une idée proche, mais le mot précis de ta leçon pour ce déplacement commence par « par ».
  solution: 'Le mot est « parcours » : déplacement du spectateur autour ou à travers une œuvre pour la découvrir.'
- id: vocabulaire-associations
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: frontalité
    - id: b
      texte: parcours
    - id: c
      texte: rapport d'échelle
    droite:
    - id: x
      texte: regarder une œuvre bien en face, sans se déplacer
    - id: y
      texte: déplacement du spectateur autour ou à travers une œuvre
    - id: z
      texte: la taille de l'œuvre pensée en fonction de l'effet recherché sur le spectateur
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un mot parle de regarder en face, un autre de se déplacer autour, le dernier de la taille de l'œuvre.
    methode: Commence par le mot que tu connais le mieux, puis élimine sa définition pour les deux autres.
    etape: « Frontalité » va avec la définition qui parle de regarder une œuvre bien en face.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque définition en te demandant à quel mot elle correspond le mieux.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un et demande-toi ce qu'il signifie précisément dans ta leçon.
  solution: Frontalité = regarder en face sans se déplacer. Parcours = déplacement autour ou à travers une œuvre. Rapport
    d'échelle = taille de l'œuvre pensée pour l'effet recherché.
- id: etapes-spectateur
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre pour prendre en compte le spectateur lors d'une présentation.
  reponse:
    elements:
    - id: qui
      texte: Se demander qui va regarder et comment il se placera devant l'œuvre
    - id: mode
      texte: Choisir si l'œuvre se regarde de face ou si le spectateur doit se déplacer
    - id: taille
      texte: Décider de la taille de l'œuvre en pensant à l'effet voulu
    - id: verifier
      texte: Vérifier en se plaçant soi-même comme spectateur si l'effet fonctionne
  indices:
    relance: Que dois-tu te demander en tout premier, avant même de choisir la taille de ton œuvre ?
    methode: Pense d'abord au spectateur, puis au mode de présentation (face ou déplacement), puis à la taille, puis vérifie.
    etape: La première étape est de se demander qui va regarder l'œuvre et comment il se placera devant elle.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qui se fait en tout premier (penser au spectateur) et ce qui se fait en tout dernier (vérifier
      l'effet).
  solution: On se demande d'abord qui va regarder l'œuvre, puis on choisit le mode de présentation (face ou déplacement),
    puis la taille de l'œuvre, puis on vérifie l'effet en se plaçant soi-même comme spectateur.
- id: expliquer-echelle
  type: ouverte
  difficulte: 2
  enonce: Tu veux que ton dessin impressionne tous les visiteurs dès l'entrée de l'exposition de classe. En deux ou trois
    phrases, explique quel choix de taille et d'accrochage faire, et pourquoi.
  criteres:
  - L'élève propose une grande taille pour le dessin ou un accrochage bien visible.
  - L'élève relie ce choix à l'effet recherché (être vu de loin, par beaucoup de monde).
  - L'élève montre qu'il pense au spectateur et pas seulement au dessin lui-même.
  indices:
    relance: Une œuvre minuscule posée sur une table basse impressionne-t-elle facilement de loin ?
    methode: Explique d'abord le choix de taille et d'accrochage, puis pourquoi cela produit l'effet recherché sur le spectateur.
    etape: 'Tu peux commencer ainsi : « Je choisis de faire un grand dessin, accroché... ».'
  solution: Je choisis de faire un grand dessin, accroché haut sur un mur bien éclairé, près de l'entrée. Ce choix de taille
    et d'accrochage permet au dessin d'être vu de loin par beaucoup de visiteurs dès qu'ils entrent dans l'exposition.
