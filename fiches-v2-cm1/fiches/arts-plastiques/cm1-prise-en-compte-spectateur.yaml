format: 2
notion: cm1-prise-en-compte-spectateur
version: 3
etat: verifiee
declencheurs:
- exposition de classe
- comment on regarde mon dessin
- tourner autour de la sculpture
- accrocher haut ou bas
- présenter à la classe
- effet sur le public
- où mettre mon dessin
- œuvre géante ou minuscule
- visiteurs de l'exposition
prerequis: []
essentiel: 'Quand tu crées une production, tu peux penser à la personne qui va la regarder. C''est prendre en compte le spectateur
  et l''effet que tu veux produire sur lui.


  La façon de présenter une œuvre change la manière dont on la reçoit. L''accrochage, c''est la façon de fixer ou de poser
  l''œuvre : au mur, au plafond, sur une table, haut ou bas. La mise en espace, c''est la place qu''on donne à l''œuvre dans
  un lieu. La mise en scène, c''est l''organisation de tout ce qui l''entoure, comme la lumière ou un décor, pour créer un
  effet.


  On peut regarder une œuvre de deux façons. La frontalité, c''est quand on la regarde bien en face, sans bouger, comme un
  tableau au mur. La circulation ou le parcours, c''est quand il faut se déplacer autour ou à travers l''œuvre pour tout découvrir,
  comme une sculpture au milieu d''une pièce.


  Le lieu de présentation compte aussi : le couloir de l''école, la classe, la cour, une vitrine. Une même production ne fait
  pas le même effet partout.


  Le rapport d''échelle, c''est la taille de l''œuvre comparée à celle du spectateur. Une œuvre géante, plus grande que toi,
  peut impressionner de loin. Une œuvre minuscule oblige à s''approcher et à regarder de près.


  Avant de présenter ta production, demande-toi : qui va la voir, d''où, et que doit-il ressentir ?

  '
methode:
- Se demander qui va regarder la production et comment il va se placer devant elle.
- Choisir le lieu de présentation, la classe, le couloir, la cour.
- Choisir si l'œuvre se regarde de face (frontalité) ou si le spectateur doit se déplacer.
- Décider de la taille de l'œuvre et de son accrochage en pensant à l'effet voulu sur celui qui la regarde.
- Vérifier, en regardant sa propre production comme un spectateur, si l'effet recherché fonctionne.
vocabulaire:
- terme: frontalité
  definition: le fait de regarder une œuvre bien en face, sans se déplacer
- terme: parcours
  definition: déplacement du spectateur autour ou à travers une œuvre pour la découvrir
- terme: accrochage
  definition: la façon de fixer ou de poser une œuvre pour la présenter
- terme: mise en espace
  definition: la place qu'on choisit de donner à une œuvre dans un lieu
- terme: mise en scène
  definition: l'organisation de ce qui entoure l'œuvre, comme la lumière ou un décor, pour créer un effet
- terme: rapport d'échelle
  definition: la taille de l'œuvre comparée à celle du spectateur
erreurs_frequentes:
- Créer une production sans jamais se demander comment le spectateur va la voir.
- Faire une œuvre minuscule alors qu'on veut qu'elle impressionne de loin, ou l'inverse.
- Oublier que la façon d'accrocher ou de poser une production change son effet sur le spectateur.
- Coller au mur une sculpture qui a des détails importants derrière, que personne ne pourra voir.
exemple:
  enonce: Pour la fête de l'école, tu dois présenter un dessin. Dois-tu le poser sur une petite table basse ou l'accrocher
    haut sur un mur bien éclairé ?
  solution: 'Cela dépend de l''effet recherché : accroché haut sur un mur éclairé, le dessin est vu de loin par beaucoup de
    monde dès l''entrée (bonne visibilité pour un grand public) ; posé bas sur une table, il invite le spectateur à s''approcher
    et à le regarder de près, dans un moment plus intime.'
exercices:
- id: mot-frontalite
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le fait de regarder une œuvre bien en face, sans avoir besoin de se déplacer ?
  reponse:
    acceptees:
    - frontalité
    fautes_tolerees: 1
  indices:
    relance: Pense à ce que tu fais quand tu te tiens droit devant une œuvre, sans bouger sur les côtés.
    methode: Relis le vocabulaire de ta leçon. Un mot désigne le fait de regarder une œuvre bien en face.
    etape: Relis le paragraphe de la leçon sur les deux façons de regarder une œuvre, avec le tableau au mur.
  pieges:
  - si:
      valeur: parcours
    relance: Le parcours implique de se déplacer autour d'une œuvre. On cherche le mot pour regarder une œuvre en face, sans
      bouger.
  - si:
      valeur: accrochage
    relance: L'accrochage désigne la façon de fixer une œuvre. On cherche le mot pour la façon de la regarder bien en face.
  solution: 'Le mot est « frontalité » : le fait de regarder une œuvre bien en face, sans se déplacer.'
- id: sculpture-cachee
  type: choix
  difficulte: 1
  enonce: Nina fabrique une sculpture avec un détail important caché derrière, visible seulement si on tourne autour. Que
    doit faire le spectateur pour tout voir ?
  reponse:
    options:
    - id: a
      texte: Rester bien en face de la sculpture, sans bouger
    - id: b
      texte: Se déplacer autour de la sculpture (un parcours)
    - id: c
      texte: Regarder la sculpture de très loin
    bonnes:
    - b
  indices:
    relance: Si un détail est caché derrière l'œuvre, peut-on le voir en restant immobile devant elle ?
    methode: Repense à la différence entre regarder une œuvre bien en face (frontalité) et devoir se déplacer autour (parcours).
    etape: Un détail caché derrière la sculpture n'est visible que si le spectateur se déplace pour en faire le tour.
  pieges:
  - si:
      contient:
      - a
    relance: En restant bien en face, sans bouger, peut-on voir un détail caché derrière la sculpture ?
  - si:
      contient:
      - c
    relance: S'éloigner ne permet pas de voir un détail caché derrière l'objet. Il faut plutôt se déplacer autour de la sculpture.
  solution: 'Le spectateur doit se déplacer autour de la sculpture, c''est un parcours : c''est le seul moyen de découvrir
    le détail caché derrière.'
- id: mot-accrochage
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la façon de fixer ou de poser une œuvre pour la présenter, au mur, au plafond ou sur une table
    ?
  reponse:
    acceptees:
    - accrochage
    - l'accrochage
    fautes_tolerees: 1
  indices:
    relance: Pense à ce que tu fais quand tu fixes ton dessin au mur avec une punaise ou un crochet.
    methode: Relis le vocabulaire de ta leçon. Un mot désigne la façon de fixer ou de poser une œuvre.
    etape: Le mot vient du verbe qu'on utilise pour suspendre un tableau à un clou.
  pieges:
  - si:
      valeur: frontalité
    relance: La frontalité est la façon de regarder une œuvre bien en face. Ici, on cherche le mot pour la façon de la fixer
      ou de la poser.
  - si:
      valeur: parcours
    relance: Le parcours est le déplacement du spectateur. Ici, on cherche le mot pour la façon de fixer l'œuvre.
  solution: 'Le mot est « accrochage » : la façon de fixer ou de poser une œuvre pour la présenter.'
- id: mot-parcours
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le déplacement du spectateur autour ou à travers une œuvre pour la découvrir entièrement ?
  reponse:
    acceptees:
    - parcours
    - circulation
    fautes_tolerees: 1
  indices:
    relance: Pense à ce que fait un visiteur de musée qui doit marcher tout autour d'une statue pour la voir sous tous les
      angles.
    methode: Ce mot désigne un déplacement, pas le fait de rester immobile devant l'œuvre.
    etape: Relis le paragraphe de la leçon sur la sculpture au milieu d'une pièce.
  pieges:
  - si:
      valeur: frontalité
    relance: La frontalité désigne le fait de rester immobile en face de l'œuvre. On cherche le mot pour le déplacement autour
      d'elle.
  - si:
      valeur: déplacement
    relance: C'est bien ce que fait le spectateur, mais ta leçon donne un mot plus précis pour ce déplacement autour de l'œuvre.
  solution: 'Le mot est « parcours » (on dit aussi « circulation ») : déplacement du spectateur autour ou à travers une œuvre
    pour la découvrir.'
- id: vocabulaire-associations
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: frontalité
    - id: b
      texte: parcours
    - id: c
      texte: rapport d'échelle
    droite:
    - id: x
      texte: regarder une œuvre bien en face, sans se déplacer
    - id: y
      texte: déplacement du spectateur autour ou à travers une œuvre
    - id: z
      texte: la taille de l'œuvre pensée en fonction de l'effet recherché sur le spectateur
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un mot parle de regarder en face, un autre de se déplacer autour, le dernier de la taille de l'œuvre.
    methode: Commence par le mot que tu connais le mieux, puis élimine sa définition pour les deux autres.
    etape: « Frontalité » va avec la définition qui parle de regarder une œuvre bien en face.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque définition en te demandant à quel mot elle correspond le mieux.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un et demande-toi ce qu'il signifie précisément dans ta leçon.
  solution: Frontalité = regarder en face sans se déplacer. Parcours = déplacement autour ou à travers une œuvre. Rapport
    d'échelle = taille de l'œuvre pensée pour l'effet recherché.
- id: oeuvre-minuscule
  type: choix
  difficulte: 3
  enonce: Sami fabrique une maison minuscule, pas plus grande qu'un dé à jouer, pleine de petits détails. Quels choix aident
    le spectateur à bien la recevoir ? Choisis toutes les bonnes réponses.
  reponse:
    options:
    - id: a
      texte: La poser à hauteur des yeux, sur une étagère ou une table
    - id: b
      texte: L'accrocher tout en haut d'un grand mur, loin des visiteurs
    - id: c
      texte: Laisser assez de place autour pour que l'on puisse s'approcher tout près
    - id: d
      texte: La placer au fond de la cour, pour qu'on la voie depuis la porte
    bonnes:
    - a
    - c
  indices:
    relance: Une œuvre aussi petite qu'un dé, la voit-on bien de loin, ou faut-il s'approcher ?
    methode: Pense au rapport d'échelle. Plus une œuvre est petite par rapport au spectateur, plus il doit pouvoir la regarder
      de près.
    etape: Tout en haut d'un mur ou au fond de la cour, la maison serait trop loin des yeux du spectateur.
  pieges:
  - si:
      contient:
      - b
    relance: Tout en haut d'un grand mur, le spectateur peut-il voir les petits détails d'une maison grande comme un dé ?
  - si:
      contient:
      - d
    relance: Depuis la porte, au loin, une œuvre minuscule est presque invisible. Le spectateur pourra-t-il voir ses détails
      ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une bonne réponse, mais il y en a une autre. Cherche encore un choix qui permet de regarder de près.
  solution: 'Il faut la poser à hauteur des yeux et laisser de la place pour s''approcher tout près : à cause du rapport d''échelle,
    une œuvre minuscule se regarde de près. Tout en haut d''un mur ou au fond de la cour, ses détails seraient invisibles.'
- id: etapes-spectateur
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre pour prendre en compte le spectateur lors d'une présentation.
  reponse:
    elements:
    - id: qui
      texte: Se demander qui va regarder et comment il se placera devant l'œuvre
    - id: mode
      texte: Choisir si l'œuvre se regarde de face ou si le spectateur doit se déplacer
    - id: taille
      texte: Décider de la taille de l'œuvre en pensant à l'effet voulu
    - id: verifier
      texte: Vérifier en se plaçant soi-même comme spectateur si l'effet fonctionne
  indices:
    relance: Que dois-tu te demander en tout premier, avant même de choisir la taille de ton œuvre ?
    methode: Pense d'abord au spectateur, puis au mode de présentation (face ou déplacement), puis à la taille, puis vérifie.
    etape: La première étape est de se demander qui va regarder l'œuvre et comment il se placera devant elle.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qui se fait en tout premier (penser au spectateur) et ce qui se fait en tout dernier (vérifier
      l'effet).
  solution: On se demande d'abord qui va regarder l'œuvre, puis on choisit le mode de présentation (face ou déplacement),
    puis la taille de l'œuvre, puis on vérifie l'effet en se plaçant soi-même comme spectateur.
- id: expliquer-echelle
  type: ouverte
  difficulte: 2
  enonce: Tu veux que ton dessin impressionne tous les visiteurs dès l'entrée de l'exposition de classe. En deux ou trois
    phrases, explique quel choix de taille et d'accrochage faire, et pourquoi.
  criteres:
  - L'élève propose une grande taille pour le dessin ou un accrochage bien visible.
  - L'élève relie ce choix à l'effet recherché (être vu de loin, par beaucoup de monde).
  - L'élève montre qu'il pense au spectateur et pas seulement au dessin lui-même.
  indices:
    relance: Une œuvre minuscule posée sur une table basse impressionne-t-elle facilement de loin ?
    methode: Explique d'abord le choix de taille et d'accrochage, puis pourquoi cela produit l'effet recherché sur le spectateur.
    etape: 'Tu peux commencer ainsi : « Je choisis de faire un grand dessin, accroché... ».'
  solution: Je choisis de faire un grand dessin, accroché haut sur un mur bien éclairé, près de l'entrée. Ce choix de taille
    et d'accrochage permet au dessin d'être vu de loin par beaucoup de visiteurs dès qu'ils entrent dans l'exposition.
- id: nblm-en-arts-plastiques-au-cm1-que-signifie-p-1
  type: choix
  difficulte: 2
  enonce: En arts plastiques au CM1, que signifie « prendre en compte le spectateur » lorsqu'on crée et présente une œuvre
    ?
  reponse:
    options:
    - id: o1
      texte: Anticiper la présence du public et réfléchir à la façon dont il va observer et recevoir la création.
    - id: o2
      texte: Exiger que chaque spectateur réécrive le titre de l'œuvre sur une feuille.
    - id: o3
      texte: Forcer le public à acheter les fournitures utilisées par la classe.
    - id: o4
      texte: Cacher la réalisation dans un placard pour qu'elle reste secrète.
    bonnes:
    - o1
  indices:
    relance: Pense à la personne qui vient découvrir ton travail lors de l'exposition.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le spectateur découvre l''œuvre, mais l''élève reste l''auteur qui conçoit sa présentation.'
  - si:
      contient:
      - o3
    relance: 'Erreur de confusion : une exposition scolaire vise le partage artistique, pas la vente de matériel.'
  - si:
      contient:
      - o4
    relance: 'Erreur : cacher l''œuvre empêche toute rencontre avec le public et annule l''effet recherché.'
  solution: 'Anticiper la présence du public et réfléchir à la façon dont il va observer et recevoir la création. C''est exact
    : prendre en compte le spectateur, c''est concevoir la présentation en fonction de la personne qui regarde.'
- id: nblm-si-tu-veux-que-le-public-puisse-tourner-2
  type: choix
  difficulte: 2
  enonce: Si tu veux que le public puisse tourner autour de ta sculpture en trois dimensions lors de l'exposition de classe,
    comment dois-tu l'installer ?
  reponse:
    options:
    - id: o1
      texte: La poser au centre de l'espace sur un socle pour permettre la circulation tout autour.
    - id: o2
      texte: La plaquer à plat contre un mur pour gagner de la place.
    - id: o3
      texte: La ranger au fond d'un tiroir fermé sous un livre.
    - id: o4
      texte: La recouvrir entièrement d'un carton opaque pour la protéger.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la possibilité pour le spectateur de se déplacer librement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : coller une sculpture au mur masque la face arrière et empêche d''en faire le tour.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la ranger la rend invisible, le spectateur ne peut pas l''observer.'
  - si:
      contient:
      - o4
    relance: 'Erreur : recouvrir l''œuvre empêche le spectateur de la regarder et d''apprécier son volume.'
  solution: 'La poser au centre de l''espace sur un socle pour permettre la circulation tout autour. C''est exact : placer
    un volume au centre permet au spectateur de se déplacer autour (parcours) pour voir tous les angles.'
- id: nblm-comment-s-appelle-le-mode-de-presentatio-3
  type: choix
  difficulte: 2
  enonce: Comment s'appelle le mode de présentation où le spectateur regarde une œuvre bien en face, sans avoir besoin de
    se déplacer ?
  reponse:
    options:
    - id: o1
      texte: La frontalité.
    - id: o2
      texte: Le parcours décalé.
    - id: o3
      texte: L'assemblage en volume.
    - id: o4
      texte: L'aplat de couleur.
    bonnes:
    - o1
  indices:
    relance: Cherche le mot qui contient l'idée de regarder droit devant soi.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de notion : le parcours exige au contraire un déplacement du spectateur.'
  - si:
      contient:
      - o3
    relance: 'Erreur : l''assemblage est une technique de construction 3D, pas une position d''observation.'
  - si:
      contient:
      - o4
    relance: 'Erreur de vocabulaire : l''aplat désigne une surface de peinture uniforme, pas un mode de présentation.'
  solution: 'La frontalité. C''est exact : la frontalité désigne la réception d''une œuvre observée directement de face.'
- id: nblm-lors-d-une-presentation-a-la-classe-quel-4
  type: choix
  difficulte: 2
  enonce: Lors d'une présentation à la classe, quel est l'effet produit sur le public si un dessin est accroché très haut
    sur un mur bien éclairé ?
  reponse:
    options:
    - id: o1
      texte: Le dessin offre une grande visibilité de loin pour l'ensemble des visiteurs dès l'entrée.
    - id: o2
      texte: Le dessin devient totalement sombre et impossible à repérer.
    - id: o3
      texte: Le spectateur est obligé de s'allonger au sol pour bien distinguer les formes.
    - id: o4
      texte: Le dessin plat se transforme en une véritable sculpture en pâte à modeler.
    bonnes:
    - o1
  indices:
    relance: Pense à la portée du regard quand on entre dans la salle d'exposition.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : l''éclairage et la hauteur augmentent au contraire la visibilité globale.'
  - si:
      contient:
      - o3
    relance: 'Erreur : c''est une présentation au niveau du sol qui inciterait à se baisser.'
  - si:
      contient:
      - o4
    relance: 'Erreur : l''accrochage modifie le point de vue du public, mais ne change pas la matière du support.'
  solution: 'Le dessin offre une grande visibilité de loin pour l''ensemble des visiteurs dès l''entrée. C''est exact : un
    accrochage haut et éclairé permet d''être vu immédiatement par un grand groupe.'
- id: nblm-quand-une-realisation-demande-au-spectat-5
  type: choix
  difficulte: 2
  enonce: Quand une réalisation demande au spectateur de se déplacer ou de manipuler un élément, quel est son rôle ?
  reponse:
    options:
    - id: o1
      texte: Le spectateur participe activement à l'œuvre.
    - id: o2
      texte: Le spectateur demeure totalement passif et immobile.
    - id: o3
      texte: Le spectateur est transformé en outil de peinture.
    - id: o4
      texte: L'œuvre est immédiatement annulée par l'enseignant.
    bonnes:
    - o1
  indices:
    relance: Demande-toi si la personne reste immobile ou si elle agit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la passivité caractérise un spectateur qui regarde sans bouger ni intervenir.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le spectateur interagit avec le dispositif, mais il ne devient pas un outil.'
  - si:
      contient:
      - o4
    relance: 'Erreur : solliciter l''action du public est une démarche créative reconnue dans le programme d''arts plastiques.'
  solution: 'Le spectateur participe activement à l''œuvre. C''est juste : en effectuant des actions ou des déplacements,
    le public devient un participant actif.'
- id: nblm-quelles-sont-les-deux-modalites-de-prese-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX modalités de présentation qui incitent le spectateur à s'approcher tout près pour vivre un
    moment d'observation intime ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Poser le travail bas sur une petite table.
    - id: o2
      texte: Proposer une réalisation de très petit format (échelle réduite).
    - id: o3
      texte: Suspendre une grande bannière au sommet du toit de l'école.
    - id: o4
      texte: Projeter une image géante sur l'immeuble d'en face.
    bonnes:
    - o1
    - o2
  indices:
    relance: Considère les choix d'installation et de taille qui imposent la proximité physique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : l''accrochage très haut vise une vision distante et monumentale, pas une observation rapprochée.'
  - si:
      contient:
