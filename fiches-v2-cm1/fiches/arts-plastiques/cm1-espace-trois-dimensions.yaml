# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-espace-trois-dimensions
version: 3
etat: verifiee
declencheurs:
- construire en volume
- forme qui tient debout
- faire une forme en relief
- vide au milieu
- objet qu'on peut voir de tous les côtés
- bâtir une petite tour
- tour qui penche
- squelette en fil de fer
prerequis: []
essentiel: 'Travailler en trois dimensions, c''est créer une production qui a du volume. On peut en faire le tour et la regarder
  sous plusieurs angles, comme une vraie chose posée dans l''espace.


  Il existe plusieurs façons de travailler en volume. Le modelage, c''est façonner une matière souple avec les mains, comme
  l''argile ou la pâte à modeler. L''assemblage et la construction, c''est réunir et fixer des éléments, comme des boîtes,
  des rouleaux ou des bâtonnets. L''installation, c''est disposer des éléments dans un lieu, pour que le spectateur les découvre
  en se déplaçant.


  Pour parler d''un volume, on utilise des mots qui vont par paires. Une forme fermée cache son intérieur, comme une boule.
  Une forme ouverte laisse voir dedans ou à travers, comme une cage ou un panier. Le plein, c''est la matière ; le vide, c''est
  l''espace sans matière, comme le creux d''un bol. On distingue aussi l''intérieur et l''extérieur.


  L''enveloppe, c''est la « peau » qui entoure une forme, comme le papier collé autour d''un ballon. La structure, c''est
  le squelette qui la tient debout, comme des fils de fer cachés dans une sculpture.


  Les volumes se déploient dans l''espace, comme en architecture, avec une maison, un pont ou une tour. Une construction en
  équilibre tient bien, avec une base large et solide. Un artiste peut aussi jouer avec le déséquilibre, une forme qui penche
  donne une impression de mouvement ou de danger.

  '
methode:
- Choisir une technique en volume, modeler, assembler ou construire.
- Décider si la forme sera fermée, pleine, ou ouverte, avec du vide à l'intérieur.
- Prévoir une structure solide si la forme doit tenir debout, puis son enveloppe.
- Construire en pensant à l'équilibre, la production doit-elle tenir debout, être stable ?
- Regarder sa production sous plusieurs angles pour vérifier qu'elle fonctionne en volume.
vocabulaire:
- terme: volume
  definition: l'espace occupé par une forme en trois dimensions
- terme: forme ouverte
  definition: une forme qui laisse voir son intérieur, avec du vide visible
- terme: forme fermée
  definition: une forme qui cache son intérieur, sans ouverture, comme une boule
- terme: modelage
  definition: la technique qui consiste à façonner une matière souple, comme l'argile, avec les mains
- terme: enveloppe
  definition: la surface qui entoure une forme en volume, comme une peau
- terme: structure
  definition: le squelette qui tient une forme debout de l'intérieur
- terme: équilibre
  definition: l'état d'une construction stable, qui tient sans tomber
erreurs_frequentes:
- Faire un dessin à plat en pensant avoir fait une œuvre en volume.
- Ne jamais vérifier la stabilité d'une construction qui doit tenir debout.
- Ne regarder sa production que d'un seul côté, en oubliant les autres angles.
- Croire que le vide est un oubli, alors que c'est une partie de la forme qu'on peut choisir.
- Confondre la structure, qui tient la forme, et l'enveloppe, qui l'entoure.
exemple:
  enonce: Avec de la pâte à modeler, tu fais une boule pleine, puis tu fais une forme creuse en forme de coupe. Quelle est
    la différence en termes de volume ?
  solution: La boule pleine est une forme fermée, il n'y a que du plein, pas de vide à l'intérieur. La coupe est une forme
    plus ouverte, elle a un vide entouré d'une enveloppe de matière. Si tu fais le tour des deux, tu vois que la boule cache
    tout, alors que la coupe laisse voir son intérieur.
exercices:
- id: mot-volume
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne l'espace occupé par une forme en trois dimensions ?
  reponse:
    acceptees:
    - volume
    fautes_tolerees: 1
  indices:
    relance: C'est le mot qu'on emploie pour dire qu'une forme a de l'épaisseur, pas seulement de la hauteur et de la largeur.
    methode: Relis le vocabulaire de la fiche, un mot désigne l'espace occupé par une forme en trois dimensions.
    etape: Relis la première phrase de la leçon. On dit qu'une production en trois dimensions a du...
  pieges:
  - si:
      valeur: relief
    relance: Le relief, c'est plutôt une surface qui dépasse légèrement. Ici on cherche le mot qui désigne l'espace occupé
      par toute une forme en trois dimensions.
  - si:
      valeur: espace
    relance: L'espace est plus général. Le mot cherché désigne précisément la place occupée par une forme en trois dimensions.
  solution: Le volume désigne l'espace occupé par une forme en trois dimensions.
- id: forme-fermee-ou-ouverte
  type: choix
  difficulte: 1
  enonce: Une boule de pâte à modeler entièrement pleine, sans aucun trou, est une forme...
  reponse:
    options:
    - id: a
      texte: Fermée
    - id: b
      texte: Ouverte
    - id: c
      texte: Symbolique
    bonnes:
    - a
  indices:
    relance: Cette boule laisse-t-elle voir un vide à l'intérieur, ou cache-t-elle tout son intérieur ?
    methode: Une forme qui cache tout son intérieur, sans trou ni vide visible, se distingue d'une forme qui laisse voir un
      vide dedans.
    etape: La boule est entièrement pleine, il n'y a aucun vide qu'on peut voir dedans.
  pieges:
  - si:
      contient:
      - b
    relance: Une forme ouverte laisse voir un vide à l'intérieur, comme une cage. Cette boule a-t-elle un vide visible ?
  - si:
      contient:
      - c
    relance: Symbolique n'est pas une catégorie de volume. Ici on cherche si la forme est pleine ou si elle laisse voir un
      vide.
  solution: Une boule pleine, sans aucun vide visible à l'intérieur, est une forme fermée.
- id: technique-robot-boites
  type: choix
  difficulte: 1
  enonce: Tu fixes ensemble des boîtes et des rouleaux de carton pour fabriquer un robot. Quelle façon de travailler en volume
    utilises-tu ?
  reponse:
    options:
    - id: a
      texte: Le modelage
    - id: b
      texte: L'assemblage
    - id: c
      texte: Le dessin à plat
    bonnes:
    - b
  indices:
    relance: Est-ce que tu pétris une matière molle, ou est-ce que tu réunis des objets déjà fabriqués ?
    methode: Modeler, c'est façonner une matière souple avec les mains. L'autre technique consiste à réunir et fixer plusieurs
      éléments entre eux.
    etape: Ici, tu ne pétris rien du tout, tu colles des boîtes et des rouleaux les uns aux autres.
  pieges:
  - si:
      contient:
      - a
    relance: Modeler, c'est pétrir une matière souple, comme l'argile. Pour ton robot, est-ce que tu pétris quelque chose
      ?
  - si:
      contient:
      - c
    relance: Un dessin à plat n'a pas d'épaisseur. Ton robot, lui, peut-on en faire le tour ?
  solution: C'est un assemblage, on réunit et on fixe des éléments déjà fabriqués (boîtes, rouleaux) pour créer une forme
    en volume.
- id: paires-opposees
  type: association
  difficulte: 2
  enonce: Les notions du volume vont par paires. Relie chaque mot à celui qui forme une paire avec lui.
  reponse:
    gauche:
    - id: a
      texte: Vide
    - id: b
      texte: Intérieur
    - id: c
      texte: Enveloppe
    - id: d
      texte: Fermée
    droite:
    - id: x
      texte: Plein
    - id: y
      texte: Extérieur
    - id: z
      texte: Structure
    - id: w
      texte: Ouverte
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Le vide, c'est l'absence de matière. Quel mot désigne le contraire, la présence de matière ?
    methode: Pour chaque mot de gauche, cherche celui de droite qui forme une paire avec lui dans la leçon.
    etape: Vide et plein sont une paire. Intérieur et extérieur en sont une autre.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque mot en cherchant le mot qui va avec lui dans la leçon.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'une paire sûre, vide et plein, puis range les autres mots par paires.
  solution: Vide va avec plein, intérieur avec extérieur, enveloppe avec structure, fermée avec ouverte.
- id: etapes-construire-volume
  type: ordre
  difficulte: 2
  enonce: Range ces étapes dans l'ordre pour construire une production en volume.
  reponse:
    elements:
    - id: choisir
      texte: Choisir une technique en volume, modeler, assembler ou construire
    - id: decider
      texte: Décider si la forme sera fermée ou ouverte
    - id: construire
      texte: Construire en pensant à l'équilibre
    - id: regarder
      texte: Regarder sa production sous plusieurs angles
  indices:
    relance: Peux-tu regarder ta production sous plusieurs angles avant même de l'avoir construite ?
    methode: Range d'abord le choix de la technique, puis la décision sur la forme, puis la construction, puis la vérification
      finale.
    etape: La première étape est de choisir une technique en volume, modeler, assembler ou construire.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient normalement avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape de départ, choisir la technique, et l'étape de fin, regarder sous plusieurs angles, puis
      range les deux autres entre elles.
  solution: On choisit une technique en volume, puis on décide si la forme sera fermée ou ouverte, puis on construit en pensant
    à l'équilibre, puis on regarde sous plusieurs angles.
- id: equilibre-tour
  type: choix
  difficulte: 2
  enonce: Pour construire une tour stable avec des boîtes de tailles différentes, que dois-tu faire ?
  reponse:
    options:
    - id: a
      texte: Mettre les boîtes les plus grandes ou les plus lourdes en bas
    - id: b
      texte: Mettre les boîtes les plus petites en bas
    - id: c
      texte: Empiler les boîtes dans n'importe quel ordre
    bonnes:
    - a
  indices:
    relance: Pense à une pyramide, où sont placées les pierres les plus grandes ?
    methode: Pour qu'une construction soit stable, la base doit être la plus solide et la plus large possible.
    etape: Si les grandes boîtes sont en haut, la tour risque-t-elle de basculer plus facilement ?
  pieges:
  - si:
      contient:
      - b
    relance: Si les petites boîtes sont en bas, la base est plus étroite et moins stable. La tour risque de tomber plus facilement.
  - si:
      contient:
      - c
    relance: Sans ordre réfléchi, l'équilibre n'est pas cherché. Il faut penser à la stabilité dès le début.
  solution: Il faut mettre les boîtes les plus grandes ou les plus lourdes en bas, pour donner une base stable à la construction.
- id: tour-qui-penche
  type: texte_court
  difficulte: 3
  enonce: Lina construit en carton une tour qui penche très fort, comme si elle allait tomber. Elle l'a voulu ainsi, pour
    donner une impression de danger. Avec quelle notion, contraire de la stabilité, joue-t-elle ?
  reponse:
    acceptees:
    - déséquilibre
    - desequilibre
    - le déséquilibre
    fautes_tolerees: 1
  indices:
    relance: Une tour bien droite, avec une base large, est stable. Et une tour qui semble sur le point de basculer ?
    methode: Cherche le mot qui désigne une construction stable, puis ajoute devant un petit morceau qui veut dire le contraire.
    etape: Pense aux mots « faire » et « défaire », « coller » et « décoller ». Fais pareil avec le mot de la stabilité.
  pieges:
  - si:
      valeur: équilibre
    relance: Une tour qui penche fort, comme si elle allait tomber, est-elle vraiment stable ? On cherche le contraire de
      ce mot.
  - si:
      valeur: penché
    relance: C'est bien ce qu'on voit, mais on cherche le nom de la notion, le contraire d'une construction stable.
  solution: Lina joue avec le déséquilibre. Sa tour penche volontairement, ce qui donne une impression de mouvement ou de
    danger, alors qu'une construction en équilibre paraît stable.
- id: decrire-volume-personnel
  type: ouverte
  difficulte: 3
  enonce: Décris, en deux ou trois phrases, une petite construction en volume que tu pourrais fabriquer, en disant si elle
    serait fermée ou ouverte et comment tu chercherais l'équilibre.
  criteres:
  - L'élève décrit une construction précise en trois dimensions.
  - L'élève dit si sa forme est fermée ou ouverte.
  - L'élève explique comment il chercherait l'équilibre ou la stabilité.
  indices:
    relance: Imagine une construction avec des boîtes, de la pâte à modeler ou du carton. À quoi ressemblerait-elle ?
    methode: Choisis d'abord la technique, puis décide si elle serait fermée ou ouverte, puis explique comment tu la stabiliserais.
    etape: Tu peux commencer ainsi, je construirais...
  solution: Par exemple, je construirais une petite maison en carton avec un toit, ce serait une forme plutôt fermée, et je
    mettrais les murs les plus larges en bas pour qu'elle tienne debout sans tomber.
- id: nblm-que-signifie-travailler-en-trois-dimensi-1
  type: choix
  difficulte: 2
  enonce: Que signifie travailler en trois dimensions en arts plastiques pour construire en volume ?
  reponse:
    options:
    - id: o1
      texte: Créer une production qui a du volume et qu'on peut voir sous plusieurs angles.
    - id: o2
      texte: Faire un dessin très détaillé au crayon sur une feuille à plat.
    - id: o3
      texte: Étaler une couche de peinture uniforme sur une toile.
    - id: o4
      texte: Découper des images et les coller à plat dans un cahier.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui différencie une vraie sculpture d'un dessin sur une feuille.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un dessin sur une feuille demeure une réalisation plate à deux dimensions.
  - si:
      contient:
      - o3
    relance: Appliquer de la peinture à plat ne crée pas de volume physique dans l'espace.
  - si:
      contient:
      - o4
    relance: Un collage plat reste une réalisation bidimensionnelle sans relief ni volume.
  solution: 'Créer une production qui a du volume et qu''on peut voir sous plusieurs angles. C''est exact : le travail en
    trois dimensions occupe un volume réel dans l''espace et s''observe sous tous ses côtés.'
- id: nblm-comment-appelle-t-on-une-forme-en-volume-2
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on une forme en volume qui laisse voir son intérieur parce qu'elle a du vide au milieu ?
  reponse:
    options:
    - id: o1
      texte: Une forme ouverte
    - id: o2
      texte: Une forme fermée
    - id: o3
      texte: Une forme plate
    - id: o4
      texte: Une forme invisible
    bonnes:
    - o1
  indices:
    relance: Pense à la différence entre un bloc de pâte à modeler bien plein et une cage ou un panier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Une forme fermée est entièrement pleine et cache son intérieur, comme une boule.
  - si:
      contient:
      - o3
    relance: Une forme plate est en deux dimensions et ne possède pas de volume.
  - si:
      contient:
      - o4
    relance: La forme existe réellement dans l'espace, elle est simplement creuse ou ouverte.
  solution: 'Une forme ouverte. C''est la définition exacte : une forme ouverte laisse voir à travers ou dedans et contient
    du vide visible.'
- id: nblm-quand-tu-veux-batir-une-petite-tour-en-v-3
  type: choix
  difficulte: 2
  enonce: Quand tu veux bâtir une petite tour en volume, à quoi dois-tu penser pour que ce soit une forme qui tient debout
    ?
  reponse:
    options:
    - id: o1
      texte: À l'équilibre et à la stabilité de la construction.
    - id: o2
      texte: À la peindre uniquement avec de la peinture brillante.
    - id: o3
      texte: À la dessiner d'abord sur une feuille sans la fabriquer.
    - id: o4
      texte: À cacher la tour dans un carton fermé.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui évite à un bâtiment ou un empilement de basculer et de tomber.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La peinture ou la brillance n'ont pas d'impact sur la stabilité physique de la tour.
  - si:
      contient:
      - o3
    relance: Dessiner ne suffit pas à créer une structure qui tient debout en trois dimensions.
  - si:
      contient:
      - o4
    relance: Cacher l'objet ne garantit pas qu'il soit stable et tienne debout.
  solution: 'À l''équilibre et à la stabilité de la construction. C''est exact : pour qu''une construction ou une tour tienne
    debout, il faut veiller à son équilibre.'
- id: nblm-un-eleve-fabrique-un-objet-qu-on-peut-vo-4
  type: choix
  difficulte: 2
  enonce: Un élève fabrique un objet qu'on peut voir de tous les côtés. Quelle erreur fréquente doit-il éviter ?
  reponse:
    options:
    - id: o1
      texte: Ne regarder sa production que d'un seul côté.
    - id: o2
      texte: Vérifier la stabilité de sa sculpture sur la table.
    - id: o3
      texte: Utiliser plusieurs matériaux pour construire.
    - id: o4
      texte: Laisser du vide à l'intérieur de sa création.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la manière dont le spectateur se déplace autour d'une œuvre en trois dimensions.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Vérifier la stabilité est une très bonne habitude, pas une erreur.
  - si:
      contient:
      - o3
    relance: Utiliser différents matériaux permet justement de bâtir en volume.
  - si:
      contient:
      - o4
    relance: Ménager du vide permet d'expérimenter les formes ouvertes, ce n'est pas une erreur.
  solution: 'Ne regarder sa production que d''un seul côté. C''est une erreur classique : en 3D, il faut vérifier l''effet
    de son travail sous tous les angles de vue.'
- id: nblm-si-tu-colles-des-elements-qui-depassent-5
  type: choix
  difficulte: 2
  enonce: Si tu colles des éléments qui dépassent d'une plaque pour faire une forme en relief, que viens-tu de créer ?
  reponse:
    options:
    - id: o1
      texte: Du volume qui s'avance dans l'espace.
    - id: o2
      texte: Un simple dessin à plat.
    - id: o3
      texte: Une image totalement transparente.
    - id: o4
      texte: Une forme sans aucune matière.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui se passe quand la surface n'est plus toute lisse mais présente une épaisseur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le dessin à plat n'a pas de relief ni d'épaisseur qui dépasse.
  - si:
      contient:
      - o3
    relance: Ajouter du relief apporte de la matière concrète, pas de la transparence.
  - si:
      contient:
      - o4
    relance: Le relief nécessite au contraire de la matière physique pour créer une épaisseur.
  solution: 'Du volume qui s''avance dans l''espace. C''est juste : le relief donne de l''épaisseur et fait sortir la création
    de la surface plane.'
- id: nblm-quelles-sont-les-deux-techniques-qui-per-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux techniques qui permettent de construire en volume en arts plastiques ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Le modelage avec une matière comme la pâte à modeler.
    - id: o2
      texte: L'assemblage d'objets ou de matériaux.
    - id: o3
      texte: Le coloriage avec des feutres sur du papier.
    - id: o4
      texte: La récitation à voix haute d'une poésie.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les actions où l'on façonne ou réunit de la matière concrète dans l'espace.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Le coloriage est une technique bidimensionnelle réalisée à plat.
  - si:
      contient:
      - o4
    relance: Réciter un poème relève du langage oral et non des arts plastiques.
  solution: Le modelage avec une matière comme la pâte à modeler ; L'assemblage d'objets ou de matériaux. Le modelage permet
    de donner forme à la matière et d'occuper de l'espace en 3D.
- id: nblm-une-forme-entierement-pleine-qui-cache-s-7
  type: texte_court
  difficulte: 1
  enonce: Une forme entièrement pleine qui cache son intérieur, comme une boule de pâte à modeler, est appelée une forme ________.
  reponse:
    acceptees:
    - fermée
    fautes_tolerees: 1
  indices:
    relance: C'est l'opposé d'une forme ouverte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: fermée. La forme fermée est entièrement pleine et ne laisse pas voir l'intérieur.
- id: nblm-l-espace-occupe-par-une-creation-realise-8
  type: texte_court
  difficulte: 1
  enonce: L'espace occupé par une création réalisée en trois dimensions s'appelle le ________.
  reponse:
    acceptees:
    - volume
    fautes_tolerees: 1
  indices:
    relance: C'est le mot-clé fondamental utilisé pour désigner les créations qui ne sont pas plates.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: volume. Le volume désigne la présence physique et l'espace occupé par un objet 3D.
