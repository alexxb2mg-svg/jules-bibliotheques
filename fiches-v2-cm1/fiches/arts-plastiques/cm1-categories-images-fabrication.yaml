# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-categories-images-fabrication
version: 3
etat: verifiee
declencheurs:
- photo ou dessin
- coller des images
- modifier une photo
- montage d'images
- appareil photo caméra
- image documentaire
- photo sur la tablette
- schéma dans le livre de sciences
- découper des photos de magazine
prerequis: []
essentiel: 'Il existe plusieurs sortes d''images. Les images à caractère artistique expriment une idée, une émotion ou un
  regard d''artiste, comme un tableau ou une photo d''art. Les images scientifiques ou documentaires servent d''abord à informer,
  comme le schéma d''une plante dans un livre de sciences ou la photo d''un volcan dans un dictionnaire.


  Une image peut être fabriquée de plusieurs façons. Elle peut être dessinée au crayon, peinte au pinceau, photographiée avec
  un appareil photo ou filmée avec une caméra. Une image filmée est une image animée, elle bouge.


  Tu peux toi-même produire des images avec un appareil photo ou une caméra, souvent numériques, comme ceux d''une tablette.
  Tu choisis alors ce que tu montres, de près ou de loin, et ce que tu laisses hors de l''image.


  On peut aussi intervenir sur des images qui existent déjà, pour en changer le sens. Le collage consiste à coller des morceaux
  découpés. On peut dessiner ou peindre par-dessus. Le montage assemble plusieurs images pour en faire une nouvelle. Les outils
  numériques permettent de faire tout cela sur un écran.


  Par exemple, une photo de ta rue en plein jour, avec une lune collée dans le ciel, semble se passer la nuit. Attention,
  une photo peut donc être transformée : elle n''est pas forcément plus « vraie » qu''un dessin.

  '
methode:
- 'Regarder d''abord l''image de départ : que montre-t-elle exactement ?'
- Se demander si c'est une image artistique ou une image qui informe.
- 'Choisir une technique de transformation : collage, dessin par-dessus, peinture, montage ou outil numérique.'
- Modifier l'image en gardant une intention claire (que veut-on dire de nouveau ?).
- Comparer le sens de l'image avant et après la transformation.
vocabulaire:
- terme: image artistique
  definition: une image faite pour exprimer une idée, une émotion ou un regard, comme un tableau
- terme: image documentaire
  definition: une image qui sert d'abord à informer sur un fait, comme une photo dans un dictionnaire
- terme: image scientifique
  definition: une image qui explique ou montre quelque chose de façon précise, comme un schéma de sciences
- terme: collage
  definition: coller des éléments (images, papiers) découpés sur un support
- terme: montage
  definition: assembler plusieurs images ou parties d'images pour en créer une nouvelle
- terme: outil numérique
  definition: un appareil ou un logiciel, comme une tablette, qui permet de créer ou modifier des images sur un écran
erreurs_frequentes:
- Confondre une image artistique (qui exprime quelque chose) et une image documentaire (qui informe).
- Transformer une image sans intention, juste en découpant au hasard.
- Croire qu'une photographie est forcément plus « vraie » qu'un dessin.
- Oublier qu'en prenant une photo, on choisit ce qu'on montre et ce qu'on laisse en dehors.
exemple:
  enonce: Tu prends la photo d'un arbre dans ton jardin, puis tu colles dessus un morceau de papier découpé en forme de soleil
    orange. Qu'as-tu fait ?
  solution: 'Tu as d''abord produit une image toi-même, avec un appareil photo. Puis tu as transformé cette image par un collage
    : tu as ajouté un élément qui change l''ambiance de l''image (l''arbre paraît maintenant au soleil couchant), sans changer
    l''arbre lui-même. Ton image n''informe plus seulement sur l''arbre, elle exprime une ambiance.'
exercices:
- id: mot-collage
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le fait de coller des éléments découpés (images, papiers) sur un support pour transformer une image
    ?
  reponse:
    acceptees:
    - collage
    fautes_tolerees: 1
  indices:
    relance: Pense à ce que tu fais quand tu colles un morceau de papier découpé sur un dessin ou une photo.
    methode: Relis le vocabulaire de ta leçon. Un mot désigne l'action de coller des éléments découpés sur un support.
    etape: Relis le paragraphe de la leçon qui explique comment intervenir sur des images qui existent déjà.
  pieges:
  - si:
      valeur: montage
    relance: Le montage assemble plusieurs images ou parties d'images. On cherche plutôt le mot pour coller des éléments découpés.
  - si:
      valeur: dessin
    relance: Le dessin, c'est tracer soi-même des formes. On cherche le mot pour coller des éléments découpés sur un support.
  solution: 'Le mot est « collage » : coller des éléments découpés sur un support.'
- id: photo-vs-dessin
  type: choix
  difficulte: 1
  enonce: Tu veux montrer exactement à quoi ressemble ton chat aujourd'hui, sans rien inventer. Quelle technique choisir ?
  reponse:
    options:
    - id: a
      texte: La photographie
    - id: b
      texte: Le dessin imaginaire
    - id: c
      texte: Le collage
    bonnes:
    - a
  indices:
    relance: Quelle technique montre exactement ce qui existe devant l'appareil, sans rien inventer ?
    methode: Repense à la différence entre une image qui montre le réel exactement et une image qui invente des détails.
    etape: Une de ces trois techniques capture directement ce qui se trouve devant l'appareil, sans y ajouter d'invention.
  pieges:
  - si:
      contient:
      - b
    relance: Le dessin peut inventer des détails qui n'existent pas dans la réalité. Cherche la technique qui montre le réel
      tel quel.
  - si:
      contient:
      - c
    relance: Le collage assemble des éléments différents pour transformer une image. Cherche plutôt la technique qui capture
      le réel directement.
  solution: 'La photographie est la bonne réponse : elle enregistre ce qui se trouve devant l''appareil, sans inventer de
    détails. Attention, une photo peut ensuite être transformée.'
- id: image-qui-bouge
  type: choix
  difficulte: 1
  enonce: Avec la tablette de la classe, tu enregistres ton copain qui court dans la cour. Ton image bouge. Comment a-t-elle
    été fabriquée ?
  reponse:
    options:
    - id: a
      texte: Elle a été peinte
    - id: b
      texte: Elle a été dessinée
    - id: c
      texte: Elle a été filmée
    bonnes:
    - c
  indices:
    relance: Une image qui bouge, comme au cinéma, est-elle faite avec un pinceau ou avec un appareil ?
    methode: Pense aux quatre façons de fabriquer une image, dessiner, peindre, photographier, et la dernière qui donne des
      images animées.
    etape: Tu as utilisé la tablette comme une caméra, pas comme une feuille de dessin.
  pieges:
  - si:
      contient:
      - a
    relance: Une image peinte est faite au pinceau et ne bouge pas. Ton image, elle, bouge.
  - si:
      contient:
      - b
    relance: Un dessin est fait à la main et reste fixe. Ici, tu as utilisé un appareil et l'image bouge.
  solution: Elle a été filmée, avec la tablette utilisée comme une caméra. C'est une image animée.
- id: mot-montage
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le fait d'assembler plusieurs images ou parties d'images pour en créer une nouvelle ?
  reponse:
    acceptees:
    - montage
    fautes_tolerees: 1
  indices:
    relance: Pense à un film ou une image où plusieurs morceaux ont été assemblés ensemble pour créer un résultat nouveau.
    methode: Ce mot désigne une technique qui combine plusieurs images, pas une seule technique de collage simple.
    etape: Relis le paragraphe de la leçon sur les images qui existent déjà. Cherche la technique qui assemble plusieurs images.
  pieges:
  - si:
      valeur: collage
    relance: Le collage colle des éléments découpés sur un support. On cherche plutôt le mot pour assembler plusieurs images
      entre elles.
  - si:
      valeur: numérique
    relance: Le numérique est un outil possible, pas le nom de la technique d'assemblage d'images elle-même.
  solution: 'Le mot est « montage » : assembler plusieurs images ou parties d''images pour en créer une nouvelle.'
- id: vocabulaire-associations
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: collage
    - id: b
      texte: montage
    - id: c
      texte: image documentaire
    droite:
    - id: x
      texte: coller des éléments découpés sur un support
    - id: y
      texte: assembler plusieurs images ou parties d'images pour en créer une nouvelle
    - id: z
      texte: une image qui informe sur un fait, sans intention artistique
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un mot parle de coller des éléments, un autre d'assembler des images, le dernier d'une image qui informe.
    methode: Commence par le mot que tu connais le mieux, puis élimine sa définition pour les deux autres.
    etape: « Collage » va avec la définition qui parle de coller des éléments découpés.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque définition en te demandant à quel mot elle correspond le mieux.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un et demande-toi ce qu'il signifie précisément dans ta leçon.
  solution: Collage = coller des éléments découpés. Montage = assembler plusieurs images pour en créer une nouvelle. Image
    documentaire = une image qui informe sur un fait.
- id: artistique-ou-documentaire
  type: association
  difficulte: 2
  enonce: Relie chaque image à sa catégorie.
  reponse:
    gauche:
    - id: a
      texte: Le schéma d'une fleur dans ton livre de sciences
    - id: b
      texte: Un tableau peint exposé dans un musée
    - id: c
      texte: La photo d'un volcan dans un dictionnaire
    - id: d
      texte: Une photo d'artiste qui joue avec les ombres pour créer une ambiance
    droite:
    - id: x
      texte: Image artistique
    - id: y
      texte: Image scientifique ou documentaire
    paires:
      a: y
      b: x
      c: y
      d: x
  indices:
    relance: Parmi ces images, lesquelles servent surtout à t'apprendre quelque chose ?
    methode: Pour chaque image, demande-toi si elle sert d'abord à informer ou d'abord à exprimer une idée ou une émotion.
    etape: Le schéma de la fleur sert à apprendre les parties de la plante.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Attention, une photo peut être documentaire ou artistique, selon son but.
  - si:
      diagnostic: associations_fausses
    relance: Ne regarde pas la technique, photo ou peinture, mais le but de l'image, informer ou exprimer.
  solution: Le schéma de la fleur et la photo du volcan sont des images scientifiques ou documentaires, elles informent. Le
    tableau du musée et la photo d'artiste sont des images artistiques, elles expriment une idée ou une ambiance.
- id: etapes-transformation
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre pour transformer le sens d'une image existante.
  reponse:
    elements:
    - id: regarder
      texte: Regarder l'image de départ et comprendre ce qu'elle montre
    - id: choisir
      texte: Choisir une technique de transformation (collage, dessin, montage)
    - id: modifier
      texte: Modifier l'image en gardant une intention claire
    - id: comparer
      texte: Comparer le sens de l'image avant et après la transformation
  indices:
    relance: Que dois-tu faire en tout premier, avant même de choisir une technique de transformation ?
    methode: Regarde d'abord l'image de départ, puis choisis ta technique, puis modifie l'image, puis compare le résultat.
    etape: La première étape est de regarder l'image de départ pour comprendre ce qu'elle montre exactement.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qui se fait en tout premier (regarder l'image) et ce qui se fait en tout dernier (comparer
      le résultat).
  solution: On regarde d'abord l'image de départ, puis on choisit une technique de transformation, puis on modifie l'image
    avec une intention claire, puis on compare le sens avant et après.
- id: expliquer-transformation
  type: ouverte
  difficulte: 2
  enonce: Tu colles un morceau de papier découpé en forme de lune sur la photo de ta maison, prise en plein jour. En deux
    ou trois phrases, explique ce que cette transformation change dans le sens de l'image.
  criteres:
  - L'élève identifie la technique utilisée (le collage).
  - L'élève dit que le sens de l'image change (de jour à nuit, ou une ambiance différente).
  - L'élève montre qu'il comprend que la transformation garde une intention (pas fait au hasard).
  indices:
    relance: La photo montrait ta maison en plein jour. Que suggère maintenant la lune collée dessus ?
    methode: Explique d'abord la technique utilisée, puis ce que cela change dans le sens de l'image.
    etape: 'Tu peux commencer ainsi : « J''ai utilisé un collage pour... ».'
  solution: 'J''ai utilisé un collage en ajoutant une lune découpée sur la photo de ma maison prise en plein jour. Cela change
    le sens de l''image : elle donne maintenant l''impression que la scène se passe la nuit, alors que la photo de départ
    montrait le jour.'
