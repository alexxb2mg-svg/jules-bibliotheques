  solution: 'Les pigments ; Les liants. C''est juste : les pigments constituent la poudre ou matière qui donne la teinte.'
- id: nblm-comment-appelle-t-on-la-matiere-coloree-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la matière colorée fondamentale qui donne sa couleur à la peinture lorsqu'on effectue des mélanges
    ?
  reponse:
    acceptees:
