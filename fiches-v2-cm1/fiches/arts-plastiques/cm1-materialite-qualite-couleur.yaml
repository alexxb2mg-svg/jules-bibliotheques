- id: nblm-quel-nom-donne-t-on-a-une-peinture-tres-8
  type: texte_court
  difficulte: 1
  enonce: Quel nom donne-t-on à une peinture très diluée avec de l'eau, appliquée en couche légère et fluide ?
  reponse:
    acceptees:
    - jus
