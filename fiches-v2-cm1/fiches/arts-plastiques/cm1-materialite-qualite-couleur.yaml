format: 2
notion: cm1-materialite-qualite-couleur
version: 3
etat: verifiee
declencheurs:
- mélanger des couleurs
- peinture épaisse
- couleur qui coule
- petite touche de couleur vive
- grand aplat de couleur
- diluer une couleur
- ajouter de l'eau à la gouache
- projeter des gouttes de peinture
- couleur pâle ou foncée
prerequis: []
essentiel: 'La couleur n''est pas seulement ce que tu vois. Elle vient d''une matière colorée bien concrète. Les pigments
  sont la matière qui donne la couleur. Le liant fait tenir les pigments ensemble et les colle au support. Parfois, on ajoute
  un siccatif, qui fait sécher plus vite.


  On peut utiliser la couleur de bien des façons, et chacune donne un effet différent. Le jus est une couleur très diluée,
  presque transparente. Le glacis est une fine couche transparente qui laisse voir ce qu''il y a dessous.


  L''empâtement est une couche épaisse, en relief. L''aplat est une surface couverte d''une seule couleur unie ; une grande
  zone de couleur s''appelle aussi une plage. La couverture cache complètement le support. La giclure est une couleur projetée
  en gouttes.


  La quantité de couleur compte : le format de la feuille, la surface couverte, l''étendue. La qualité de la couleur compte
  aussi : sa teinte (rouge, bleu…), son intensité (vive ou terne), ses nuances, sa lumière (claire ou sombre).


  Quantité et qualité sont liées. Une petite touche de rouge vif sur une grande feuille blanche attire l''œil. Un grand aplat
  du même rouge remplit tout et donne une impression bien plus forte.


  Le mélange avec d''autres médiums et le support choisi changent aussi l''effet. La même gouache ne rend pas pareil sur du
  papier blanc et sur du carton brun.

  '
methode:
- Choisir une couleur et un médium, peinture, encre ou feutre.
- Essayer plusieurs usages, une couche très diluée, une couche très épaisse, une petite touche, un aplat.
- Faire varier la quantité, une petite surface puis une grande surface de la même couleur.
- Observer comment la quantité de couleur change l'intensité ressentie.
- Comparer les effets obtenus pour choisir l'usage le plus adapté à l'intention voulue.
vocabulaire:
- terme: pigment
  definition: matière colorée qui donne sa couleur à la peinture
- terme: liant
  definition: substance qui fait tenir les pigments ensemble et les colle au support
- terme: jus
  definition: couleur très diluée, presque transparente
- terme: glacis
  definition: fine couche de couleur transparente qui laisse voir ce qu'il y a dessous
- terme: empâtement
  definition: couche de peinture épaisse, appliquée en relief
- terme: aplat
  definition: surface couverte d'une seule couleur unie et uniforme
- terme: giclure
  definition: couleur projetée en gouttes sur le support
erreurs_frequentes:
- Toujours utiliser la peinture de la même façon, même épaisseur, même dilution.
- Penser que la couleur ne dépend que de la teinte, sans tenir compte de sa quantité ou de son épaisseur.
- Ignorer que le support, papier ou carton, change aussi l'effet de la couleur appliquée.
- Confondre le pigment, qui donne la couleur, et le liant, qui le fait tenir.
exemple:
  enonce: Tu appliques du bleu très dilué, un jus, sur une feuille, puis du bleu épais directement sorti du tube, un empâtement,
    à côté. Les deux bleus donnent-ils la même impression ?
  solution: Non, le jus de bleu très dilué donne une couleur pâle, presque une ombre, l'empâtement de bleu épais donne une
    couleur intense, en relief, qui attire davantage le regard. La teinte est la même, mais la matière et l'usage changent
    l'effet.
exercices:
- id: mot-pigment
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la matière colorée qui donne sa couleur à la peinture ?
  reponse:
    acceptees:
    - pigment
    - pigments
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne le petit grain de couleur qu'on mélange à un liant pour fabriquer de la peinture.
    methode: Relis le vocabulaire de la fiche, un mot désigne la matière colorée elle-même.
    etape: Relis la deuxième phrase de la leçon.
  pieges:
  - si:
      valeur: liant
    relance: Le liant fait tenir cette matière colorée ensemble, mais ce n'est pas lui qui donne la couleur elle-même.
  - si:
      valeur: couleur
    relance: La couleur est la sensation qu'on voit, le mot cherché désigne plutôt la matière concrète qui la produit.
  solution: Le pigment désigne la matière colorée qui donne sa couleur à la peinture.
- id: jus-ou-empatement
  type: choix
  difficulte: 1
  enonce: Une couche de peinture très diluée, presque transparente, s'appelle un...
  reponse:
    options:
    - id: a
      texte: Jus
    - id: b
      texte: Empâtement
    - id: c
      texte: Aplat
    bonnes:
    - a
  indices:
    relance: Cette couche contient-elle beaucoup d'eau, ou est-elle appliquée directement sortie du tube ?
    methode: Une couche très diluée, presque transparente, est appelée par le mot le plus proche de « liquide léger ».
    etape: Le mot cherché ressemble à ce qu'on obtient en ajoutant beaucoup d'eau à une couleur.
  pieges:
  - si:
      contient:
      - b
    relance: L'empâtement est une couche épaisse en relief, pas une couche diluée et transparente.
  - si:
      contient:
      - c
    relance: L'aplat est une surface couverte d'une couleur unie, sans préciser si elle est diluée ou épaisse.
  solution: Une couche de peinture très diluée, presque transparente, s'appelle un jus.
- id: mot-liant
  type: texte_court
  difficulte: 2
  enonce: Dans une peinture, quel mot désigne la substance qui fait tenir les pigments ensemble et les colle au support ?
  reponse:
    acceptees:
    - liant
    - le liant
    fautes_tolerees: 1
  indices:
    relance: Sans cette substance, les grains de couleur resteraient une poudre qui s'envole. À quoi sert-elle ?
    methode: Relis le vocabulaire de la fiche, un mot désigne ce qui fait tenir les pigments ensemble.
    etape: Le mot vient du verbe « lier », qui veut dire attacher ensemble.
  pieges:
  - si:
      valeur: pigment
    relance: Le pigment est la matière qui donne la couleur. Ici, on cherche ce qui le fait tenir ensemble.
  - si:
      valeur: siccatif
    relance: Le siccatif fait sécher plus vite. Ici, on cherche ce qui fait tenir les pigments ensemble.
  solution: 'Le mot est « liant » : la substance qui fait tenir les pigments ensemble et les colle au support.'
- id: associer-usages-couleur
  type: association
  difficulte: 2
  enonce: Relie chaque description à l'usage de la couleur correspondant.
  reponse:
    gauche:
    - id: a
      texte: Une fine couche transparente qui laisse voir ce qu'il y a dessous
    - id: b
      texte: Une couleur projetée en petites gouttes
    - id: c
      texte: Une surface couverte d'une seule couleur unie
    - id: d
      texte: Une couche épaisse en relief
    droite:
    - id: x
      texte: Glacis
    - id: y
      texte: Giclure
    - id: z
      texte: Aplat
    - id: w
      texte: Empâtement
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: La couleur projetée en petites gouttes, quel mot du vocabulaire décrit cela ?
    methode: Pour chaque description, cherche le mot qui correspond exactement à cette façon d'appliquer la couleur.
    etape: Une fine couche transparente qui laisse voir dessous est un glacis.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque description en te demandant quel usage précis de la couleur
      elle décrit.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, la couche épaisse en relief est un empâtement, puis range les autres descriptions.
  solution: La fine couche transparente est un glacis, la couleur projetée est une giclure, la surface unie est un aplat,
    la couche épaisse en relief est un empâtement.
- id: etapes-explorer-couleur
  type: ordre
  difficulte: 2
  enonce: Range ces étapes dans l'ordre pour explorer les usages de la couleur.
  reponse:
    elements:
    - id: choisir
      texte: Choisir une couleur et un médium
    - id: essayer
      texte: Essayer plusieurs usages, dilué, épais, en petite touche
    - id: observer
      texte: Observer comment la quantité de couleur change l'intensité ressentie
    - id: comparer
      texte: Comparer les effets pour choisir l'usage le plus adapté
  indices:
    relance: Peux-tu comparer les effets obtenus avant même d'avoir essayé plusieurs usages ?
    methode: Range d'abord le choix de la couleur et du médium, puis les essais, puis l'observation, puis la comparaison finale.
    etape: La première étape est de choisir une couleur et un médium.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient normalement avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape de départ, choisir la couleur et le médium, et l'étape de fin, comparer pour choisir,
      puis range les deux autres entre elles.
  solution: On choisit une couleur et un médium, puis on essaie plusieurs usages, puis on observe l'effet de la quantité,
    puis on compare pour choisir l'usage le plus adapté.
- id: quantite-vs-qualite
  type: choix
  difficulte: 2
  enonce: Une petite touche de rouge vif au centre d'une grande feuille blanche, comparée à un grand aplat de ce même rouge,
    donne une impression...
  reponse:
    options:
    - id: a
      texte: Différente, même si la teinte est identique
    - id: b
      texte: Identique, car la teinte est la même
    - id: c
      texte: Impossible à comparer
    bonnes:
    - a
  indices:
    relance: La quantité de couleur, la surface couverte, change-t-elle l'impression, même si la teinte reste la même ?
    methode: La quantité de couleur et la qualité de la couleur sont liées, une petite touche et un grand aplat ne produisent
      pas forcément la même impression.
    etape: Une petite touche attire le regard différemment d'une grande surface colorée.
  pieges:
  - si:
      contient:
      - b
    relance: Même si la teinte est identique, la quantité de surface couverte change l'impression ressentie.
  - si:
      contient:
      - c
    relance: On peut bien comparer les deux, en observant l'effet de chacune sur le regard, même avec la même teinte.
  solution: La petite touche et le grand aplat de la même teinte donnent une impression différente, car la quantité de couleur
    influence aussi l'effet ressenti.
- id: qualites-de-la-couleur
  type: choix
  difficulte: 3
  enonce: Parmi ces mots, lesquels décrivent la qualité d'une couleur, et non sa quantité ? Choisis toutes les bonnes réponses.
  reponse:
    options:
    - id: a
      texte: La teinte
    - id: b
      texte: Le format de la feuille
    - id: c
      texte: L'intensité
    - id: d
      texte: La surface couverte
    - id: e
      texte: Les nuances
    bonnes:
    - a
    - c
    - e
  indices:
    relance: Pour chaque mot, demande-toi s'il dit comment est la couleur, ou combien il y en a et sur quelle taille.
    methode: La quantité parle de taille et d'étendue. La qualité parle de l'aspect de la couleur elle-même, quelle que soit
      sa taille.
    etape: Le format de la feuille et la surface couverte disent combien de place prend la couleur. Ce sont des mots de quantité.
  pieges:
  - si:
      contient:
      - b
    relance: Le format de la feuille dit la taille du support, donc la place disponible pour la couleur. Est-ce une qualité
      ou une quantité ?
  - si:
      contient:
      - d
    relance: La surface couverte dit combien de place prend la couleur. Est-ce une qualité ou une quantité ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une partie des bonnes réponses. Il y a trois mots qui décrivent la couleur elle-même.
  solution: La teinte, l'intensité et les nuances décrivent la qualité de la couleur. Le format de la feuille et la surface
    couverte décrivent sa quantité.
- id: decrire-projet-couleur
  type: ouverte
  difficulte: 3
  enonce: Décris, en deux ou trois phrases, comment tu utiliserais deux usages différents de la couleur, par exemple un jus
    et un empâtement, dans une même production, et quel effet tu rechercherais.
  criteres:
  - L'élève nomme au moins deux usages précis de la couleur.
  - L'élève explique où ou comment il les utiliserait dans sa production.
  - L'élève relie ces usages à un effet recherché.
  indices:
    relance: Pense à une peinture où certaines zones seraient légères et transparentes, et d'autres épaisses et en relief.
    methode: Choisis d'abord les deux usages, puis explique leur emplacement, puis relie-les à l'effet voulu.
    etape: Tu peux commencer ainsi, dans mon dessin, je ferais...
  solution: Par exemple, dans mon dessin, je ferais le ciel avec un jus très dilué pour un effet léger et transparent, et
    les rochers au sol avec un empâtement épais pour donner une impression de matière lourde et solide.
- id: nblm-comment-appelle-t-on-une-surface-peinte-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on une surface peinte avec une seule couleur unie et uniforme ?
  reponse:
    options:
    - id: o1
      texte: Un aplat
    - id: o2
      texte: Un empâtement
    - id: o3
      texte: Un glacis
    - id: o4
      texte: Un jus
    bonnes:
    - o1
  indices:
    relance: Pense à une zone de couleur très régulière, sans relief ni trace de pinceau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : l''empâtement est une couche de peinture épaisse posée en relief.'
  - si:
      contient:
      - o3
    relance: 'Faux : le glacis est une fine couche de peinture transparente.'
  - si:
      contient:
      - o4
    relance: 'Faux : le jus est une peinture très liquide et fortement diluée.'
  solution: 'Un aplat. C''est juste : l''aplat désigne une surface couverte d''une seule couleur unie et uniforme.'
- id: nblm-quelle-technique-utilise-t-on-pour-appli-2
  type: choix
  difficulte: 2
  enonce: Quelle technique utilise-t-on pour appliquer de la peinture épaisse en relief sur son support ?
  reponse:
    options:
    - id: o1
      texte: L'empâtement
    - id: o2
      texte: Le jus
    - id: o3
      texte: L'aplat
    - id: o4
      texte: Le liant
    bonnes:
    - o1
  indices:
    relance: Cherche le terme qui évoque une pâte lourde et en volume sur la toile.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : le jus est une peinture très liquide obtenue en diluant la couleur.'
  - si:
      contient:
      - o3
    relance: 'Faux : l''aplat est une surface lisse et unie, sans épaisseur ni relief.'
  - si:
      contient:
      - o4
    relance: 'Faux : le liant est le composant qui fixe les pigments, pas une technique d''épaisseur.'
  solution: 'L''empâtement. C''est juste : l''empâtement désigne une couche de peinture très épaisse posée en relief.'
- id: nblm-que-se-passe-t-il-lorsqu-on-choisit-de-d-3
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il lorsqu'on choisit de diluer une couleur avec beaucoup d'eau pour obtenir un « jus » ?
  reponse:
    options:
    - id: o1
      texte: La couleur devient pâle et transparente, presque comme une ombre
    - id: o2
      texte: La peinture devient très foncée et opaque
    - id: o3
      texte: La couleur forme des paquets épais en relief
    - id: o4
      texte: Le support en papier rejette totalement la couleur
    bonnes:
    - o1
  indices:
    relance: Pense à l'effet produit lorsqu'on ajoute beaucoup d'eau sur son pinceau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : ajouter du liquide rend la couleur plus claire et transparente, non opaque.'
  - si:
      contient:
      - o3
    relance: 'Faux : les reliefs et paquets proviennent d''une peinture non diluée (empâtement).'
  - si:
      contient:
      - o4
    relance: 'Faux : la peinture très diluée pénètre et s''étale sur le support selon sa porosité.'
  solution: 'La couleur devient pâle et transparente, presque comme une ombre. C''est juste : diluer fortement la couleur
    avec de l''eau donne une teinte claire et peu intense.'
- id: nblm-d-apres-les-fiches-officielles-quel-est-4
