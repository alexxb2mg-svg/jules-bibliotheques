  difficulte: 2
  enonce: D'après les fiches officielles, quel est l'effet d'une petite touche de couleur vive par rapport à un grand aplat
    de cette même couleur ?
  reponse:
    options:
    - id: o1
      texte: Elle n'a pas le même effet car la quantité et la surface modifient l'intensité ressentie
    - id: o2
      texte: Elle produit exactement la même impression visuelle que le grand aplat
    - id: o3
      texte: Elle efface immédiatement toutes les autres nuances du dessin
    - id: o4
      texte: Elle transforme instantanément la peinture en matière solide
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'impact sur les yeux entre une toute petite zone et toute une grande surface.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : la taille et la quantité modifient la perception visuelle de la couleur.'
  - si:
      contient:
      - o3
    relance: 'Faux : une petite touche attire l''attention sans supprimer le reste du travail.'
  - si:
      contient:
      - o4
    relance: 'Faux : la touche est une façon de poser la peinture, elle ne change pas sa nature physique.'
  solution: 'Elle n''a pas le même effet car la quantité et la surface modifient l''intensité ressentie. C''est juste : l''effet
    visuel dépend directement de la surface couverte et de la quantité de couleur.'
- id: nblm-comment-appelle-t-on-la-trace-laissee-pa-5
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on la trace laissée par une peinture très liquide ou une couleur qui coule sur la feuille ?
  reponse:
    options:
    - id: o1
      texte: Une coulure
    - id: o2
      texte: Une griffure
    - id: o3
      texte: Un aplat
    - id: o4
      texte: Un siccatif
    bonnes:
    - o1
  indices:
    relance: Recherche un mot de la même famille que le verbe « couler ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : la griffure est une marque faite en grattant le support avec un outil pointu.'
  - si:
      contient:
      - o3
    relance: 'Faux : l''aplat est une surface nette, uniforme et parfaitement maîtrisée.'
  - si:
      contient:
      - o4
    relance: 'Faux : le siccatif est un produit ajouté à la peinture pour accélérer son séchage.'
  solution: 'Une coulure. C''est juste : la coulure est la marque laissée par une matière liquide qui glisse sur le support.'
