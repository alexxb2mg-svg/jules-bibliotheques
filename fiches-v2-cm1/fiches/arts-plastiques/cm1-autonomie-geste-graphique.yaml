format: 2
notion: cm1-autonomie-geste-graphique
version: 3
etat: verifiee
declencheurs:
- mon geste tremble
- peindre au pinceau vite
- dessiner plusieurs fois pareil
- geste lent geste rapide
- une série de dessins
- pas deux fois pareil
- refaire le même dessin
- imprimer avec un tampon
prerequis: []
essentiel: 'Le geste, c''est la façon dont ta main bouge quand tu crées : vite ou lentement, fort ou léger, en ligne continue
  ou par petites touches. Le geste graphique est celui du dessin, au crayon ou au feutre. Le geste pictural est celui de la
  peinture, au pinceau. Le geste sculptural est celui du modelage, quand tes doigts creusent ou pincent la terre.


  Le geste change la représentation. Un arbre tracé lentement, avec soin, n''a pas le même aspect qu''un arbre tracé d''un
  seul coup rapide. Une peinture faite à grands coups de pinceau ne ressemble pas à une peinture faite à petites touches.


  Deux personnes qui font « le même » dessin ne font jamais exactement le même geste. Même toi, tu ne refais jamais deux fois
  le même trait. C''est pour cela que chaque œuvre faite à la main est unique.


  Un original, c''est l''œuvre unique, faite à la main. Une copie essaie de reproduire un original, mais le geste de celui
  qui copie laisse toujours des différences. Un multiple, ce sont plusieurs exemplaires presque pareils d''une même image,
  fabriqués avec le même procédé, par exemple avec un tampon. Une série, ce sont plusieurs œuvres liées autour d''un même
  sujet, chacune un peu différente.


  En essayant plusieurs gestes différents pour le même sujet, on découvre que le geste change complètement le résultat.

  '
methode:
- Choisir un même sujet simple (une ligne, une forme, un objet).
- Le représenter une première fois avec un geste lent et contrôlé.
- Le représenter une deuxième fois avec un geste rapide ou moins contrôlé.
- Essayer un troisième geste, en appuyant fort ou par petites touches.
- 'Comparer les résultats : qu''est-ce que le geste a changé ?'
vocabulaire:
- terme: geste
  definition: la manière dont la main bouge pour dessiner, peindre ou sculpter
- terme: original
  definition: l'œuvre unique, faite à la main
- terme: copie
  definition: une œuvre qui essaie de reproduire un original
- terme: multiple
  definition: plusieurs exemplaires presque pareils d'une même image, faits avec le même procédé, comme un tampon
- terme: série
  definition: plusieurs œuvres liées entre elles autour d'un même sujet
erreurs_frequentes:
- Penser qu'il existe un seul bon geste pour bien dessiner.
- Vouloir que deux dessins d'un même sujet soient absolument identiques.
- Ne jamais changer de vitesse ou de pression du geste, toujours dessiner pareil.
- Croire qu'une copie faite à la main est exactement pareille à l'original.
- Confondre une série, où chaque œuvre est différente, et un multiple, où les exemplaires sont presque pareils.
exemple:
  enonce: 'Tu traces trois fois la même vague sur une feuille : une fois vite, une fois lentement, une fois en appuyant très
    fort. Les trois vagues seront-elles identiques ?'
  solution: 'Non : même en essayant de tracer « la même » vague, la vitesse et la pression du geste changent l''épaisseur
    et l''aspect du trait. Chaque vague est unique, parce que le geste change à chaque fois. Ensemble, tes trois vagues forment
    une petite série autour du même sujet.'
exercices:
- id: mot-original
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne une œuvre unique, faite à la main, et non une reproduction ?
  reponse:
    acceptees:
    - original
    fautes_tolerees: 1
  indices:
    relance: C'est le contraire d'une copie. Pense à la toute première version d'une œuvre, faite directement à la main.
    methode: Relis le vocabulaire de ta leçon. Un mot désigne l'œuvre unique, faite à la main.
    etape: Relis le paragraphe de la leçon qui parle de copie, de multiple et de série. Le mot cherché y est défini en premier.
  pieges:
  - si:
      valeur: copie
    relance: Une copie essaie de reproduire une autre œuvre. Ici, on cherche le mot pour l'œuvre unique de départ.
  - si:
      valeur: série
    relance: Une série regroupe plusieurs œuvres liées. On cherche le mot pour une seule œuvre unique faite à la main.
  solution: 'Le mot est « original » : l''œuvre unique, faite à la main.'
- id: vagues-identiques
  type: choix
  difficulte: 1
  enonce: 'Tom trace trois fois la même vague : une fois vite, une fois lentement, une fois en appuyant très fort. Les trois
    vagues seront-elles identiques ?'
  reponse:
    options:
    - id: a
      texte: Oui, car c'est toujours la même main qui trace
    - id: b
      texte: Non, car la vitesse et la pression du geste changent le résultat
    - id: c
      texte: Oui, si Tom utilise toujours le même crayon
    bonnes:
    - b
  indices:
    relance: Est-ce que changer la vitesse ou la force de la main change l'épaisseur ou la régularité du trait ?
    methode: Repense à ce qui différencie un geste lent d'un geste rapide ou appuyé.
    etape: La vitesse et la pression de la main changent l'épaisseur et la régularité du trait, même pour le même sujet.
  pieges:
  - si:
      contient:
      - a
    relance: Même avec la même main, la vitesse et la force du geste changent le résultat. Les trois vagues seront-elles vraiment
      identiques ?
  - si:
      contient:
      - c
    relance: Le crayon utilisé n'est pas ce qui change ici. C'est la vitesse et la pression du geste qui font la différence.
  solution: 'Non, les trois vagues ne seront pas identiques : la vitesse et la pression du geste changent l''épaisseur et
    l''aspect du trait, même pour le même sujet.'
- id: mot-serie
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne plusieurs œuvres liées entre elles autour d'un même sujet, chacune un peu différente ?
  reponse:
    acceptees:
    - série
    fautes_tolerees: 1
  indices:
    relance: 'Pense à plusieurs dessins du même chat, chacun un peu différent : comment appelle-t-on cet ensemble ?'
    methode: Ce mot désigne un ensemble d'œuvres liées, pas une seule œuvre isolée.
    etape: Relis le paragraphe de la leçon sur l'original et la copie. Le mot cherché y est défini en dernier.
  pieges:
  - si:
      valeur: original
    relance: L'original désigne une seule œuvre unique. On cherche le mot pour plusieurs œuvres liées entre elles.
  - si:
      valeur: copie
    relance: Une copie est une seule reproduction. On cherche le mot pour un ensemble de plusieurs œuvres liées.
  solution: 'Le mot est « série » : plusieurs œuvres liées entre elles autour d''un même sujet.'
- id: vocabulaire-associations
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: geste
    - id: b
      texte: original
    - id: c
      texte: série
    droite:
    - id: x
      texte: la manière dont la main bouge pour dessiner, peindre ou sculpter
    - id: y
      texte: l'œuvre unique, faite à la main
    - id: z
      texte: plusieurs œuvres liées entre elles autour d'un même sujet
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un mot parle du mouvement de la main, un autre d'une œuvre unique, le dernier d'un ensemble d'œuvres.
    methode: Commence par le mot que tu connais le mieux, puis élimine sa définition pour les deux autres.
    etape: « Geste » va avec la définition qui parle du mouvement de la main.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque définition en te demandant à quel mot elle correspond le mieux.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un et demande-toi ce qu'il signifie précisément dans ta leçon.
  solution: Geste = manière dont la main bouge. Original = œuvre unique, faite à la main. Série = plusieurs œuvres liées autour
    d'un même sujet.
- id: trois-gestes
  type: association
  difficulte: 2
  enonce: Relie chaque sorte de geste à l'activité qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: Geste graphique
    - id: b
      texte: Geste pictural
    - id: c
      texte: Geste sculptural
    droite:
    - id: x
      texte: Tracer un trait au crayon ou au feutre
    - id: y
      texte: Poser de la couleur au pinceau
    - id: z
      texte: Creuser et pincer de la terre avec les doigts
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Lequel de ces gestes se fait avec les doigts dans une matière qu'on peut modeler ?
    methode: Pense aux trois grandes activités de la classe d'arts plastiques, dessiner, peindre et modeler.
    etape: Le mot « pictural » fait penser au mot « peinture ».
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Demande-toi quel outil ou quelle matière va avec chaque geste.
  - si:
      diagnostic: associations_fausses
    relance: Pars du geste sculptural, qui va avec le modelage et la sculpture, puis range les deux autres.
  solution: Geste graphique, tracer au crayon ou au feutre. Geste pictural, poser de la couleur au pinceau. Geste sculptural,
    creuser et pincer la terre.
- id: tampon-multiple
  type: choix
  difficulte: 3
  enonce: Zoé creuse un dessin de poisson dans une gomme, l'encre, puis l'imprime dix fois sur une affiche. Les dix poissons
    sont presque pareils. Comment appelle-t-on cet ensemble d'exemplaires ?
  reponse:
    options:
    - id: a
      texte: Un original unique
    - id: b
      texte: Un multiple
    - id: c
      texte: Une série de dessins tous différents
    bonnes:
    - b
  indices:
    relance: Les dix poissons ont-ils été dessinés à la main un par un, ou fabriqués avec le même procédé ?
    methode: Un original est une seule œuvre. Une série regroupe des œuvres différentes. Il existe un autre mot pour des exemplaires
      presque pareils.
    etape: La gomme sert ici de tampon, et le même tampon a fabriqué les dix exemplaires.
  pieges:
  - si:
      contient:
      - a
    relance: Un original est une seule œuvre unique. Ici, il y a dix exemplaires.
  - si:
      contient:
      - c
    relance: Dans une série, chaque œuvre est différente. Ici, les dix poissons sont presque pareils.
  solution: C'est un multiple, plusieurs exemplaires presque pareils fabriqués avec le même procédé, le tampon. Chaque impression
    garde quand même de petites différences, selon la quantité d'encre et la force de la main.
- id: etapes-experience
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre pour découvrir l'effet du geste sur un dessin.
  reponse:
    elements:
    - id: choisir
      texte: Choisir un même sujet simple à représenter
    - id: lent
      texte: Le représenter une première fois avec un geste lent et contrôlé
    - id: rapide
      texte: Le représenter une deuxième fois avec un geste rapide ou moins contrôlé
    - id: comparer
      texte: Comparer les deux résultats obtenus
  indices:
    relance: Que dois-tu choisir en tout premier, avant même de commencer à dessiner ?
    methode: Choisis d'abord ton sujet, puis dessine-le lentement, puis dessine-le vite, puis compare les deux résultats.
    etape: La première étape est de choisir un sujet simple, comme une ligne ou une forme.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qui se fait en tout premier (choisir le sujet) et ce qui se fait en tout dernier (comparer
      les résultats).
  solution: On choisit d'abord un sujet simple, puis on le dessine avec un geste lent, puis avec un geste rapide, puis on
    compare les deux résultats obtenus.
- id: expliquer-serie
  type: ouverte
  difficulte: 2
  enonce: Tu fais trois dessins du même chat, mais à chaque fois ta main appuie différemment (fort, léger, tremblant). En
    deux ou trois phrases, explique pourquoi ces trois dessins forment une série et pas trois copies identiques.
  criteres:
  - L'élève dit que le sujet (le chat) reste le même dans les trois dessins.
  - L'élève dit que le geste (force, vitesse) change à chaque fois.
  - L'élève relie ce changement de geste au fait que les trois dessins sont différents malgré le même sujet.
  indices:
    relance: Le sujet des trois dessins change-t-il, ou est-ce autre chose qui change à chaque fois ?
    methode: Explique d'abord ce qui reste pareil (le sujet), puis ce qui change (le geste), puis pourquoi cela forme une
      série.
    etape: 'Tu peux commencer ainsi : « Le chat est le même dans les trois dessins, mais... ».'
  solution: 'Le chat est le même sujet dans les trois dessins, mais ma main appuie différemment à chaque fois : fort, léger,
    tremblant. C''est ce changement de geste qui rend les trois dessins différents, tout en formant une série autour du même
    sujet.'
- id: nblm-qu-est-ce-que-le-geste-en-arts-plastique-1
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que le geste en arts plastiques lorsque tu dessines ou peins ?
  reponse:
    options:
    - id: o1
      texte: La manière dont ta main bouge, par exemple avec un geste lent ou un geste rapide.
    - id: o2
      texte: L'outil mécanique que tu achètes au magasin pour peindre.
    - id: o3
      texte: La couleur exacte du tube de peinture.
    - id: o4
      texte: Le support de papier découpé.
    bonnes:
    - o1
  indices:
    relance: Pense au mouvement de ton bras et de ta main pendant que tu crées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''outil est l''instrument (comme le pinceau), alors que le geste est le mouvement propre
      de ta main.'
  - si:
      contient:
      - o3
    relance: 'Faux : la couleur est le médium utilisé, pas le mouvement physique de la main.'
  - si:
      contient:
      - o4
    relance: 'Non : le papier est le support qui reçoit la trace, pas le mouvement de l''élève.'
  solution: La manière dont ta main bouge, par exemple avec un geste lent ou un geste rapide. C'est exact ! Le geste désigne
    le mouvement de la main, qui peut varier en vitesse (lent ou rapide) et en pression.
- id: nblm-si-deux-eleves-essaient-de-recopier-exac-2
  type: choix
  difficulte: 2
  enonce: Si deux élèves essaient de recopier exactement le même modèle de dessin, que remarque-t-on ?
  reponse:
    options:
    - id: o1
      texte: Leurs dessins ne seront pas deux fois pareil car chaque geste fait à la main est unique.
    - id: o2
      texte: Ils obtiendront deux dessins rigoureusement identiques au millimètre près.
    - id: o3
      texte: L'un des deux dessins sera obligatoirement raté.
    - id: o4
      texte: La trace du crayon va disparaître immédiatement.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui distingue deux réalisations faites à la main par des personnes différentes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : fait à la main, un dessin n''est jamais la copie conforme d''un autre.'
  - si:
      contient:
      - o3
    relance: 'Faux : une variation dans le geste ne signifie pas que le dessin est raté, mais simplement qu''il est unique.'
  - si:
      contient:
      - o4
    relance: 'Non : le geste laisse une trace durable sur le support.'
  solution: Leurs dessins ne seront pas deux fois pareil car chaque geste fait à la main est unique. C'est juste ! Même en
    voulant recopier à l'identique, le geste propre à chaque personne produit un résultat unique.
- id: nblm-que-se-passe-t-il-si-tu-decides-de-peind-3
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il si tu décides de peindre au pinceau vite plutôt que lentement sur un même sujet ?
  reponse:
    options:
    - id: o1
      texte: Changer la vitesse du geste modifie l'épaisseur et l'aspect de la trace.
    - id: o2
      texte: La peinture change instantanément de couleur.
    - id: o3
      texte: Le pinceau se transforme automatiquement en crayon de bois.
    - id: o4
      texte: Il n'y a aucune différence visible sur la feuille.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi l'expérience où l'on trace un même sujet à des vitesses différentes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : la vitesse du geste modifie la forme et l''allure du trait, pas le pigment coloré.'
  - si:
      contient:
      - o3
    relance: 'Non : l''instrument reste le même, c''est l''effet du mouvement qui varie.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : croire que la vitesse n''impacte pas le dessin alors qu''elle transforme la trace.'
  solution: Changer la vitesse du geste modifie l'épaisseur et l'aspect de la trace. Exactement ! La vitesse du geste influence
    directement le rendu et la qualité de la trace du pinceau.
- id: nblm-comment-appelle-t-on-un-ensemble-de-plus-4
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on un ensemble de plusieurs dessins liés entre eux autour d'un même sujet ?
  reponse:
    options:
    - id: o1
      texte: Une série de dessins.
    - id: o2
      texte: Une copie conforme.
    - id: o3
      texte: Un outil de sculpture.
    - id: o4
      texte: Une photographie documentaire.
    bonnes:
    - o1
  indices:
    relance: Recherche le terme qui désigne une suite de créations associées autour d'un thème.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Non : une copie vise la reproduction exacte d''un original sans chercher de variations créatives.'
  - si:
      contient:
      - o3
    relance: 'Non : cela désigne un instrument de travail et non un ensemble de productions artistiques.'
  - si:
      contient:
      - o4
    relance: 'Non : une photo documentaire informe sur un fait réel, ce n''est pas un ensemble de dessins déclinés.'
  solution: Une série de dessins. Bravo ! Une série regroupe plusieurs œuvres articulées autour d'un même thème tout en présentant
    des variations.
- id: nblm-si-un-eleve-constate-mon-geste-tremble-q-5
  type: choix
  difficulte: 2
  enonce: 'Si un élève constate : « mon geste tremble quand je dessine », quelle est la bonne réaction en arts plastiques
    ?'
  reponse:
    options:
    - id: o1
      texte: Accepter ce tremblement car la particularité et l'imprévisibilité du geste donnent une valeur unique à la trace.
    - id: o2
      texte: Jeter son travail en pensant qu'un dessin doit toujours être fait avec un trait lisse et parfait.
    - id: o3
      texte: Laisser un appareil photo faire tout le dessin à sa place.
    - id: o4
      texte: Remplacer le dessin par du découpage sans jamais utiliser d'outil graphique.
    bonnes:
    - o1
  indices:
    relance: Pense au fait que chaque geste apporte une touche personnelle et qu'aucun geste n'est interdit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : croire qu''il n''existe qu''une seule façon de bien dessiner et refuser les variations du
      geste.'
  - si:
      contient:
      - o3
    relance: 'Non : l''objectif est d''explorer les qualités expressives de son propre geste graphique.'
  - si:
      contient:
      - o4
    relance: 'Non : un geste qui tremble est tout aussi valable et expressif qu''un geste très contrôlé.'
  solution: Accepter ce tremblement car la particularité et l'imprévisibilité du geste donnent une valeur unique à la trace.
    Tout à fait ! En arts plastiques, il n'y a pas qu'un seul bon geste parfait ; l'imprévisibilité enrichit la création.
- id: nblm-quelles-sont-les-deux-erreurs-frequentes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux erreurs fréquentes concernant le geste graphique en arts plastiques ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Vouloir dessiner plusieurs fois pareil un même sujet de façon totalement identique.
    - id: o2
      texte: Penser qu'il n'existe qu'un seul « bon » geste pour bien dessiner.
    - id: o3
      texte: Essayer de varier la vitesse de sa main entre deux tentatives.
    - id: o4
      texte: Observer les effets d'un geste lent par rapport à un geste rapide.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les idées reçues fausses qui limitent la liberté ou la variété du geste.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : changer de vitesse est au contraire une excellente méthode d''expérimentation plastique.'
  - si:
      contient:
      - o4
    relance: 'Faux : analyser les effets de la vitesse sur la trace est vivement encouragé en cours d''arts plastiques.'
  solution: Vouloir dessiner plusieurs fois pareil un même sujet de façon totalement identique ; Penser qu'il n'existe qu'un
    seul « bon » geste pour bien dessiner. C'est juste ! Rechercher une identité absolue entre deux dessins faits main est
    une erreur car le geste crée toujours des nuances.
- id: nblm-complete-la-phrase-l-uvre-unique-faite-a-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase : L''œuvre unique faite à la main par un élève ou un artiste s''appelle un ____.'
  reponse:
    acceptees:
    - original
    fautes_tolerees: 1
  indices:
    relance: Ce mot masculin désigne l'œuvre première avant toute reproduction.
