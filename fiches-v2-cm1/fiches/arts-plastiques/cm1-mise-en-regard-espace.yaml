format: 2
notion: cm1-mise-en-regard-espace
version: 1
etat: verifiee
declencheurs:
- accrocher mon dessin
- présenter au mur
- avec ou sans cadre
- socle pour sculpture
- exposer dans une vitrine
- où montrer mon dessin
prerequis: []
essentiel: 'Une œuvre ou une production plastique ne se montre pas toujours de la même façon : c''est ce qu''on appelle sa
  mise en regard et en espace.


  Il existe différentes modalités de présentation : avec ou sans cadre, avec ou sans socle (pour poser une sculpture), avec
  ou sans piédestal.


  Le lieu où l''on présente une œuvre change aussi la façon dont on la reçoit : un espace privé (chez soi), un espace public,
  un écran, une vitrine, un musée.


  Regarder comment des œuvres sont présentées (dans une salle d''exposition, in situ c''est-à-dire directement dans un lieu
  existant) aide à comprendre pourquoi ce choix de présentation compte.'
methode:
- Choisir la production plastique qu'on veut montrer.
- 'Se demander où on va la présenter : sur un mur, sur une table, dans une vitrine.'
- Décider si elle a besoin d'un cadre, d'un socle, ou de rien du tout.
- Observer comment ce choix de présentation change ce qu'on remarque en premier.
vocabulaire:
- terme: socle
  definition: support sur lequel on pose une sculpture ou un objet pour le présenter
- terme: cadre
  definition: bordure qui entoure une image pour la présenter et la délimiter
erreurs_frequentes:
- Penser qu'une œuvre se présente toujours de la même façon, quel que soit le lieu.
- Oublier que le choix du lieu (mur, table, vitrine) change ce que le spectateur remarque.
- Croire qu'un cadre ou un socle est obligatoire pour toute œuvre.
exemple:
  enonce: Tu as fait un dessin. Tu peux le coller dans ton cahier, l'accrocher au mur avec un cadre, ou le poser sur une étagère
    debout contre un livre. Ces trois choix changent-ils quelque chose ?
  solution: 'Oui : dans le cahier, le dessin reste privé et petit ; encadré au mur, il devient visible de loin comme une vraie
    œuvre exposée ; posé sur une étagère, il se mêle à d''autres objets du quotidien. Le lieu et le dispositif de présentation
    changent la façon dont on regarde le même dessin.'
exercices:
- id: mot-socle
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le support sur lequel on pose une sculpture ou un objet pour le présenter ?
  reponse:
    acceptees:
    - socle
    fautes_tolerees: 1
  indices:
    relance: Pense à ce sur quoi repose une statue dans un musée, pour qu'on la voie surélevée.
    methode: Relis le vocabulaire de ta leçon. Un mot désigne le support pour poser une sculpture.
    etape: Le mot commence par « so » et compte cinq lettres.
  pieges:
  - si:
      valeur: cadre
    relance: Le cadre entoure une image à plat, pas une sculpture en volume. On cherche le mot pour le support d'une sculpture.
  - si:
      valeur: piédestal
    relance: 'C''est une idée proche, mais le mot de ta leçon est plus court : il commence par « so ».'
  solution: 'Le mot est « socle » : support sur lequel on pose une sculpture ou un objet pour le présenter.'
- id: dessin-trois-lieux
  type: choix
  difficulte: 1
  enonce: Emma colle son dessin dans son cahier, puis l'accroche au mur avec un cadre, puis le pose sur une étagère. Ces trois
    présentations changent-elles la façon dont on regarde le dessin ?
  reponse:
    options:
    - id: a
      texte: Oui, le lieu et le dispositif de présentation changent le regard porté sur le dessin
    - id: b
      texte: Non, un dessin se regarde toujours pareil, quel que soit le lieu
    - id: c
      texte: Cela dépend uniquement du dessin, jamais du lieu où il est présenté
    bonnes:
    - a
  indices:
    relance: Un dessin dans un cahier est-il vu de la même façon qu'un dessin encadré au mur, visible de loin ?
    methode: Repense à comment le lieu (cahier privé, mur visible, étagère mêlée à d'autres objets) change ce qu'on remarque.
    etape: Encadré au mur, le dessin devient visible de loin comme une vraie œuvre exposée, ce qui n'est pas le cas dans un
      cahier.
  pieges:
  - si:
      contient:
      - b
    relance: Le lieu et le dispositif de présentation changent bien ce que le spectateur remarque en premier. Est-ce vraiment
      pareil partout ?
  - si:
      contient:
      - c
    relance: Le dessin reste le même dans les trois cas, mais c'est justement le lieu qui change la façon dont on le regarde.
  solution: 'Oui : le lieu et le dispositif de présentation (cahier, cadre au mur, étagère) changent la façon dont on regarde
    le même dessin, même si le dessin lui-même ne change pas.'
- id: mot-cadre
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne la bordure qui entoure une image pour la présenter et la délimiter ?
  reponse:
    acceptees:
    - cadre
    fautes_tolerees: 1
  indices:
    relance: Pense à ce qui entoure un tableau accroché au mur, pour délimiter ses bords.
    methode: Ce mot désigne une bordure autour d'une image à plat, pas un support pour une sculpture.
    etape: Le mot commence par « ca » et compte cinq lettres.
  pieges:
  - si:
      valeur: socle
    relance: Le socle est un support pour une sculpture en volume. On cherche le mot pour la bordure d'une image à plat.
  - si:
      valeur: vitrine
    relance: Une vitrine est un contexte de présentation, pas la bordure autour d'une image elle-même.
  solution: 'Le mot est « cadre » : bordure qui entoure une image pour la présenter et la délimiter.'
- id: vocabulaire-associations
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: socle
    - id: b
      texte: cadre
    - id: c
      texte: mise en espace
    droite:
    - id: x
      texte: support sur lequel on pose une sculpture pour la présenter
    - id: y
      texte: bordure qui entoure une image pour la présenter et la délimiter
    - id: z
      texte: façon d'organiser une production dans un lieu de présentation
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un mot parle du support d'une sculpture, un autre de la bordure d'une image, le dernier de l'organisation dans
      un lieu.
    methode: Commence par le mot que tu connais le mieux, puis élimine sa définition pour les deux autres.
    etape: « Socle » va avec la définition qui parle du support d'une sculpture.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque définition en te demandant à quel mot elle correspond le mieux.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un et demande-toi ce qu'il signifie précisément dans ta leçon.
  solution: Socle = support pour une sculpture. Cadre = bordure autour d'une image. Mise en espace = façon d'organiser une
    production dans un lieu de présentation.
- id: etapes-presentation
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre pour choisir comment présenter une production plastique.
  reponse:
    elements:
    - id: choisir
      texte: Choisir la production plastique qu'on veut montrer
    - id: lieu
      texte: Se demander où on va la présenter (mur, table, vitrine)
    - id: dispositif
      texte: Décider si elle a besoin d'un cadre, d'un socle, ou de rien
    - id: observer
      texte: Observer comment ce choix change ce qu'on remarque en premier
  indices:
    relance: Que dois-tu choisir en tout premier, avant même de penser au lieu de présentation ?
    methode: Choisis d'abord ta production, puis le lieu, puis le dispositif (cadre ou socle), puis observe l'effet.
    etape: La première étape est de choisir la production plastique qu'on veut montrer.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qui se fait en tout premier (choisir la production) et ce qui se fait en tout dernier (observer
      l'effet).
  solution: On choisit d'abord la production à montrer, puis on décide du lieu de présentation, puis du dispositif (cadre,
    socle ou rien), puis on observe l'effet de ce choix.
- id: expliquer-presentation
  type: ouverte
  difficulte: 2
  enonce: Tu as fait une sculpture en pâte à modeler. Tu peux la poser directement sur une table ou la poser sur un petit
    socle en carton. En deux ou trois phrases, explique la différence entre ces deux choix.
  criteres:
  - L'élève identifie les deux dispositifs de présentation (sans socle, avec socle).
  - L'élève dit que le socle change la façon dont on regarde la sculpture (elle paraît plus importante ou mise en valeur).
  - L'élève montre qu'il comprend que ce choix de présentation a un effet sur le spectateur.
  indices:
    relance: Une sculpture posée sur un socle paraît-elle différente d'une sculpture posée à même la table ?
    methode: Explique d'abord les deux dispositifs, puis l'effet que chacun produit sur le regard du spectateur.
    etape: 'Tu peux commencer ainsi : « Posée directement sur la table, ma sculpture... ».'
  solution: 'Posée directement sur la table, ma sculpture se mêle aux autres objets du quotidien. Posée sur un socle en carton,
    elle est surélevée et mise en valeur : elle paraît plus importante, comme une vraie œuvre exposée.'
