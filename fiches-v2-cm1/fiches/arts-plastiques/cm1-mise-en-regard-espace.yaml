format: 2
notion: cm1-mise-en-regard-espace
version: 3
etat: verifiee
declencheurs:
- accrocher mon dessin
- présenter au mur
- avec ou sans cadre
- socle pour sculpture
- exposer dans une vitrine
- où montrer mon dessin
- montrer mon dessin sur un écran
- peindre sur le mur de la cour
prerequis: []
essentiel: 'Une production plastique ne se montre pas toujours de la même façon. Choisir comment et où on la présente, c''est
  sa mise en regard et en espace. Ce choix change ce que le spectateur remarque.


  Il existe plusieurs modalités de présentation. Un cadre entoure une image et délimite ses bords. Un socle est un support
  sur lequel on pose une sculpture ou un objet. Un piédestal est un support haut qui élève une œuvre au-dessus du sol. On
  peut aussi choisir de ne mettre ni cadre, ni socle, ni piédestal.


  Avec un socle, une petite sculpture en pâte à modeler est surélevée et mise en valeur. Posée à même la table, elle se mêle
  aux objets du quotidien, comme la trousse ou les cahiers.


  Le lieu de présentation compte aussi. Un espace privé est un lieu où l''on vit, comme ta chambre. Un espace public est ouvert
  à tous, comme la cour de l''école, une rue ou une place. On peut aussi montrer une production sur un écran, dans une vitrine,
  ou dans un musée.


  Une œuvre in situ est faite directement dans un lieu précis et pensée pour lui, comme une peinture faite sur le mur de la
  cour. En regardant comment des œuvres sont présentées, on comprend pourquoi ce choix compte.

  '
methode:
- Choisir la production plastique qu'on veut montrer.
- 'Se demander où on va la présenter : chez soi, dans la classe, dans la cour, sur un écran, dans une vitrine.'
- Décider si elle a besoin d'un cadre, d'un socle, d'un piédestal, ou de rien du tout.
- Installer la production à la bonne hauteur, pour qu'on la voie bien.
- Observer comment ce choix de présentation change ce qu'on remarque en premier.
vocabulaire:
- terme: socle
  definition: support sur lequel on pose une sculpture ou un objet pour le présenter
- terme: cadre
  definition: bordure qui entoure une image pour la présenter et la délimiter
- terme: piédestal
  definition: support haut qui élève une œuvre au-dessus du sol
- terme: espace privé
  definition: un lieu réservé à quelques personnes, comme sa maison ou sa chambre
- terme: espace public
  definition: un lieu ouvert à tous, comme une rue, une place ou la cour de l'école
- terme: vitrine
  definition: un meuble ou un endroit fermé par une vitre, où l'on montre des objets sans qu'on puisse les toucher
- terme: in situ
  definition: se dit d'une œuvre faite directement dans un lieu précis et pensée pour ce lieu
erreurs_frequentes:
- Penser qu'une œuvre se présente toujours de la même façon, quel que soit le lieu.
- Oublier que le choix du lieu (mur, table, vitrine) change ce que le spectateur remarque.
- Croire qu'un cadre ou un socle est obligatoire pour toute œuvre.
- Confondre le cadre, qui entoure une image à plat, et le socle, qui porte un objet en volume.
- Croire qu'une œuvre ne peut être montrée que dans un musée.
exemple:
  enonce: Tu as fait un dessin. Tu peux le coller dans ton cahier, l'accrocher au mur avec un cadre, ou le poser sur une étagère
    debout contre un livre. Ces trois choix changent-ils quelque chose ?
  solution: 'Oui : dans le cahier, le dessin reste privé et petit ; encadré au mur, il devient visible de loin comme une vraie
    œuvre exposée ; posé sur une étagère, il se mêle à d''autres objets du quotidien. Le lieu et le dispositif de présentation
    changent la façon dont on regarde le même dessin, même si le dessin, lui, n''a pas changé.'
exercices:
- id: mot-socle
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le support sur lequel on pose une sculpture ou un objet pour le présenter ?
  reponse:
    acceptees:
    - socle
    fautes_tolerees: 1
  indices:
    relance: Pense à ce sur quoi repose une statue dans un musée, pour qu'on la voie surélevée.
    methode: Relis le vocabulaire de ta leçon. Un mot désigne le support pour poser une sculpture.
    etape: Relis le paragraphe de la leçon sur la petite sculpture en pâte à modeler.
  pieges:
  - si:
      valeur: cadre
    relance: Le cadre entoure une image à plat, pas une sculpture en volume. On cherche le mot pour le support d'une sculpture.
  - si:
      valeur: piédestal
    relance: C'est une idée proche, mais le piédestal est un support haut. Cherche le mot plus général pour un support, haut
      ou bas.
  solution: 'Le mot est « socle » : support sur lequel on pose une sculpture ou un objet pour le présenter.'
- id: dessin-trois-lieux
  type: choix
  difficulte: 1
  enonce: Emma colle son dessin dans son cahier, puis l'accroche au mur avec un cadre, puis le pose sur une étagère. Ces trois
    présentations changent-elles la façon dont on regarde le dessin ?
  reponse:
    options:
    - id: a
      texte: Oui, le lieu et le dispositif de présentation changent le regard porté sur le dessin
    - id: b
      texte: Non, un dessin se regarde toujours pareil, quel que soit le lieu
    - id: c
      texte: Cela dépend uniquement du dessin, jamais du lieu où il est présenté
    bonnes:
    - a
  indices:
    relance: Un dessin dans un cahier est-il vu de la même façon qu'un dessin encadré au mur, visible de loin ?
    methode: Repense à comment le lieu (cahier privé, mur visible, étagère mêlée à d'autres objets) change ce qu'on remarque.
    etape: Encadré au mur, le dessin devient visible de loin comme une vraie œuvre exposée, ce qui n'est pas le cas dans un
      cahier.
  pieges:
  - si:
      contient:
      - b
    relance: Le lieu et le dispositif de présentation changent bien ce que le spectateur remarque en premier. Est-ce vraiment
      pareil partout ?
  - si:
      contient:
      - c
    relance: Le dessin reste le même dans les trois cas, mais c'est justement le lieu qui change la façon dont on le regarde.
  solution: 'Oui : le lieu et le dispositif de présentation (cahier, cadre au mur, étagère) changent la façon dont on regarde
    le même dessin, même si le dessin lui-même ne change pas.'
- id: mot-cadre
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne la bordure qui entoure une image pour la présenter et la délimiter ?
  reponse:
    acceptees:
    - cadre
    fautes_tolerees: 1
  indices:
    relance: Pense à ce qui entoure un tableau accroché au mur, pour délimiter ses bords.
    methode: Ce mot désigne une bordure autour d'une image à plat, pas un support pour une sculpture.
    etape: Relis la leçon. C'est le premier dispositif de présentation cité, celui qui entoure une image.
  pieges:
  - si:
      valeur: socle
    relance: Le socle est un support pour une sculpture en volume. On cherche le mot pour la bordure d'une image à plat.
  - si:
      valeur: vitrine
    relance: Une vitrine est un contexte de présentation, pas la bordure autour d'une image elle-même.
  solution: 'Le mot est « cadre » : bordure qui entoure une image pour la présenter et la délimiter.'
- id: vocabulaire-associations
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: socle
    - id: b
      texte: cadre
    - id: c
      texte: mise en espace
    droite:
    - id: x
      texte: support sur lequel on pose une sculpture pour la présenter
    - id: y
      texte: bordure qui entoure une image pour la présenter et la délimiter
    - id: z
      texte: façon d'organiser une production dans un lieu de présentation
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un mot parle du support d'une sculpture, un autre de la bordure d'une image, le dernier de l'organisation dans
      un lieu.
    methode: Commence par le mot que tu connais le mieux, puis élimine sa définition pour les deux autres.
    etape: « Socle » va avec la définition qui parle du support d'une sculpture.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque définition en te demandant à quel mot elle correspond le mieux.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un et demande-toi ce qu'il signifie précisément dans ta leçon.
  solution: Socle = support pour une sculpture. Cadre = bordure autour d'une image. Mise en espace = façon d'organiser une
    production dans un lieu de présentation.
- id: prive-ou-public
  type: association
  difficulte: 2
  enonce: Relie chaque lieu de présentation au type d'espace qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: Ta chambre
    - id: b
      texte: La place du marché de ta ville
    - id: c
      texte: Le salon de tes grands-parents
    - id: d
      texte: La cour de l'école
    droite:
    - id: x
      texte: Espace privé
    - id: y
      texte: Espace public
    paires:
      a: x
      b: y
      c: x
      d: y
  indices:
    relance: Dans lequel de ces lieux n'importe qui peut-il passer et voir ton dessin ?
    methode: Pour chaque lieu, demande-toi s'il est réservé à une famille ou ouvert à beaucoup de personnes.
    etape: Ta chambre est un lieu où seule ta famille entre, en général.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pour chaque lieu, demande-toi qui peut y entrer.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, ta chambre, puis range les autres lieux selon qu'ils sont ouverts à tous ou non.
  solution: La chambre et le salon des grands-parents sont des espaces privés. La place du marché et la cour de l'école sont
    des espaces publics, ouverts à beaucoup de monde.
- id: etapes-presentation
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre pour choisir comment présenter une production plastique.
  reponse:
    elements:
    - id: choisir
      texte: Choisir la production plastique qu'on veut montrer
    - id: lieu
      texte: Se demander où on va la présenter (mur, table, vitrine)
    - id: dispositif
      texte: Décider si elle a besoin d'un cadre, d'un socle, ou de rien
    - id: observer
      texte: Observer comment ce choix change ce qu'on remarque en premier
  indices:
    relance: Que dois-tu choisir en tout premier, avant même de penser au lieu de présentation ?
    methode: Choisis d'abord ta production, puis le lieu, puis le dispositif (cadre ou socle), puis observe l'effet.
    etape: La première étape est de choisir la production plastique qu'on veut montrer.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qui se fait en tout premier (choisir la production) et ce qui se fait en tout dernier (observer
      l'effet).
  solution: On choisit d'abord la production à montrer, puis on décide du lieu de présentation, puis du dispositif (cadre,
    socle ou rien), puis on observe l'effet de ce choix.
- id: fresque-cour
  type: choix
  difficulte: 3
  enonce: Ta classe peint une grande fresque directement sur un mur de la cour de l'école, en pensant à la forme du mur et
    aux enfants qui jouent autour. Comment dit-on d'une œuvre faite ainsi, pour un lieu précis ?
  reponse:
    options:
    - id: a
      texte: Elle est présentée dans une vitrine
    - id: b
      texte: Elle est in situ
    - id: c
      texte: Elle est posée sur un socle
    bonnes:
    - b
  indices:
    relance: La fresque peut-elle être décrochée et emportée ailleurs, ou fait-elle partie du lieu ?
    methode: Une œuvre pensée pour un endroit précis, et faite directement dedans, porte un nom particulier.
    etape: La fresque est faite sur le mur lui-même, elle n'a ni vitre, ni support en dessous.
  pieges:
  - si:
      contient:
      - a
    relance: Une vitrine protège des objets derrière une vitre. La fresque est-elle derrière une vitre ?
  - si:
      contient:
      - c
    relance: Un socle porte une sculpture posée dessus. La fresque est-elle posée sur un support ?
  solution: Elle est in situ, elle est faite directement dans un lieu précis et pensée pour lui. On ne peut pas la déplacer
    sans qu'elle perde son sens.
- id: expliquer-presentation
  type: ouverte
  difficulte: 2
  enonce: Tu as fait une sculpture en pâte à modeler. Tu peux la poser directement sur une table ou la poser sur un petit
    socle en carton. En deux ou trois phrases, explique la différence entre ces deux choix.
  criteres:
  - L'élève identifie les deux dispositifs de présentation (sans socle, avec socle).
  - L'élève dit que le socle change la façon dont on regarde la sculpture (elle paraît plus importante ou mise en valeur).
  - L'élève montre qu'il comprend que ce choix de présentation a un effet sur le spectateur.
  indices:
    relance: Une sculpture posée sur un socle paraît-elle différente d'une sculpture posée à même la table ?
    methode: Explique d'abord les deux dispositifs, puis l'effet que chacun produit sur le regard du spectateur.
    etape: 'Tu peux commencer ainsi : « Posée directement sur la table, ma sculpture... ».'
  solution: 'Posée directement sur la table, ma sculpture se mêle aux autres objets du quotidien. Posée sur un socle en carton,
    elle est surélevée et mise en valeur : elle paraît plus importante, comme une vraie œuvre exposée.'
- id: nblm-quel-support-utilise-t-on-habituellement-1
  type: choix
  difficulte: 2
  enonce: Quel support utilise-t-on habituellement pour poser et présenter une sculpture en volume dans un espace d'exposition
    ?
  reponse:
    options:
    - id: o1
      texte: Un socle
    - id: o2
      texte: Un cadre
    - id: o3
      texte: Un pinceau
    - id: o4
      texte: Un cahier
    bonnes:
    - o1
  indices:
    relance: Pense à la structure sur laquelle repose une statue dans un musée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le cadre est utilisé pour entourer une image plane (en deux dimensions), pas pour poser une
      sculpture.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le pinceau est un outil pour appliquer la peinture, pas un dispositif de présentation.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le cahier sert à ranger ou réaliser des travaux à plat, mais ne permet pas de présenter une sculpture
      dans l''espace.'
  solution: 'Un socle. C''est exact : le socle est le support spécialement conçu pour poser et mettre en valeur une sculpture
    ou un objet en trois dimensions.'
- id: nblm-lorsqu-un-eleve-prepare-une-image-pour-u-2
  type: choix
  difficulte: 2
  enonce: Lorsqu'un élève prépare une image pour une exposition, quelle décision plastique peut-il prendre pour l'entourer
    ?
  reponse:
    options:
    - id: o1
      texte: Choisir de la présenter avec ou sans cadre
    - id: o2
      texte: Mettre obligatoirement un cadre autour de chaque dessin
    - id: o3
      texte: Cacher les bords du dessin sous du ruban adhésif noir
    - id: o4
      texte: Ranger systématiquement le dessin dans un tiroir
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la présence ou à l'absence de bordure autour d'une image au mur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : croire qu''un cadre est obligatoire pour qu''une image soit considérée comme une œuvre exposée.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la présentation cherche à valoriser la création, pas à la masquer de façon désordonnée.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ranger un dessin au fond d''un tiroir ne constitue pas un dispositif d''exposition au public.'
  solution: 'Choisir de la présenter avec ou sans cadre. C''est juste : choisir de mettre un cadre ou de laisser l''image
    sans cadre est un choix plastique qui modifie le regard du spectateur.'
- id: nblm-que-change-la-decision-de-presenter-au-m-3
  type: choix
  difficulte: 2
  enonce: Que change la décision de présenter au mur mon dessin plutôt que de le laisser fermé dans mon cahier ?
  reponse:
    options:
    - id: o1
      texte: Au mur, le dessin devient une œuvre exposée, visible de loin par le public
    - id: o2
      texte: Cela modifie automatiquement la taille de la feuille de papier
    - id: o3
      texte: Cela efface immédiatement les traits de crayon
    - id: o4
      texte: Le lieu d'exposition n'a aucun impact sur le spectateur
    bonnes:
    - o1
  indices:
    relance: Pense à la différence entre feuilleter un travail privé et l'offrir au regard collectif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : le format physique du papier reste le même, c''est le contexte de visionnage qui change.'
  - si:
      contient:
      - o3
    relance: 'Erreur : accrocher un dessin ne détruit pas sa matérialité.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : oublier que le lieu et le dispositif de présentation influencent directement le regard porté
      sur l''œuvre.'
  solution: 'Au mur, le dessin devient une œuvre exposée, visible de loin par le public. C''est juste : changer le lieu et
    la modalité de présentation transforme le statut du dessin et la façon dont le spectateur le reçoit.'
- id: nblm-pourquoi-un-artiste-ou-une-ecole-peut-il-4
  type: choix
  difficulte: 2
  enonce: Pourquoi un artiste ou une école peut-il choisir d'exposer dans une vitrine certaines créations tridimensionnelles
    ?
  reponse:
    options:
    - id: o1
      texte: Pour protéger la création tout en la rendant visible dans l'espace d'exposition
    - id: o2
      texte: Pour empêcher complètement le public de voir l'objet
    - id: o3
      texte: Parce que les vitrines sont réservées exclusivement aux peintures liquides
    - id: o4
      texte: Parce qu'il s'agit du seul moyen de présentation autorisé en art
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la fonction des meubles vitrés dans les musées.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : le verre de la vitrine est transparent pour permettre l''observation.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la vitrine accueille principalement des objets en volume ou des créations précieuses.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : croire qu''il n''existe qu''une seule modalité de présentation possible.'
  solution: 'Pour protéger la création tout en la rendant visible dans l''espace d''exposition. C''est juste : la vitrine
    est un dispositif d''exposition fermé et transparent qui protège l''objet tout en le montrant.'
- id: nblm-comment-appelle-t-on-la-facon-de-fixer-e-5
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on la façon de fixer et d'installer des réalisations sur un support vertical pour accrocher mon
    dessin ?
  reponse:
    options:
    - id: o1
      texte: L'accrochage
    - id: o2
      texte: Le modelage
    - id: o3
      texte: Le gommage
    - id: o4
      texte: Le mélange
    bonnes:
    - o1
  indices:
    relance: Pense au mot qui dérive directement du verbe accrocher.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : le modelage est une technique de mise en forme de la matière (trois dimensions), pas de présentation.'
  - si:
      contient:
      - o3
    relance: 'Erreur : gommage désigne l''action d''effacer une trace de crayon.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le mélange concerne la préparation des couleurs ou des pigments.'
  solution: 'L''accrochage. C''est juste : l''accrochage désigne les modalités de fixation et d''agencement des œuvres sur
    une surface verticale.'
- id: nblm-lorsque-je-me-demande-ou-montrer-mon-des-6
  type: choix
  difficulte: 3
  enonce: Lorsque je me demande où montrer mon dessin, quels espaces de présentation puis-je choisir selon la leçon ? (Choisis
    les 2 bonnes réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un espace privé comme mon cahier ou ma maison
    - id: o2
      texte: Un espace public comme le mur de la classe, une vitrine ou un musée
    - id: o3
      texte: Un endroit complètement masqué où personne ne peut regarder
    - id: o4
      texte: Une poubelle fermée dans la cour
    bonnes:
    - o1
    - o2
  indices:
    relance: Distingue le lieu intime du lieu d'exposition collectif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre la mise en regard et en espace d''une œuvre avec le fait de la dissimuler.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la poubelle n''est ni un lieu d''art ni un dispositif de présentation.'
  solution: 'Un espace privé comme mon cahier ou ma maison ; Un espace public comme le mur de la classe, une vitrine ou un
    musée. C''est juste : l''espace privé est un lieu intimiste où l''œuvre est vue de près ou conservée.'
- id: nblm-comment-appelle-t-on-la-bordure-qui-ento-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la bordure qui entoure une image pour la délimiter et la présenter au mur ?
  reponse:
    acceptees:
    - Un cadre
    fautes_tolerees: 1
  indices:
