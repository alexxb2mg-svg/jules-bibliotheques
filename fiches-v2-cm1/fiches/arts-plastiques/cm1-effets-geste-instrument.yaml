format: 2
notion: cm1-effets-geste-instrument
version: 3
etat: verifiee
declencheurs:
- outil pour peindre
- trace laissée sur la feuille
- geste large ou petit
- éponge pour peindre
- griffer la peinture
- outil inventé pour dessiner
- peindre avec les doigts
- grand mouvement du bras
- gratter la peinture fraîche
prerequis: []
essentiel: 'En arts plastiques, un outil n''est pas seulement un pinceau. La main, les doigts, des brosses de tailles différentes,
  un chiffon, une éponge ou un outil que tu inventes peuvent servir à peindre ou à dessiner.


  Chaque outil dialogue avec la matière : il la pose, l''étale, la gratte ou la coupe. Il laisse donc une marque différente
  : la touche, la trace, la texture, la facture, la griffure, la traînée, la découpe, la coulure.


  La touche est la petite marque d''un coup de pinceau. La griffure est grattée dans la peinture fraîche. La traînée est la
  longue marque d''un outil qu''on fait glisser. La coulure vient d''une matière liquide qui coule. La facture, c''est la
  manière dont l''œuvre a été faite, qu''on devine en regardant ses traces.


  Le geste compte autant que l''outil. Un geste ample est grand et large : il part du bras. Un geste retenu est petit et contrôlé
  : il part du poignet ou des doigts.


  Un geste peut être maîtrisé, quand tu sais où ira la trace. Il peut être imprévisible, quand tu laisses une part de surprise,
  par exemple de l''encre qui coule sur une feuille penchée.


  Le médium (peinture, encre, craie) et le support (papier, carton, tissu) changent aussi l''effet. Essayer plusieurs outils,
  médiums et supports t''aide à choisir tes moyens selon l''effet que tu cherches.

  '
methode:
- Choisir un médium, peinture ou encre, et un support.
- Rassembler plusieurs outils différents, y compris un outil inventé.
- Tester chaque outil sur le support en variant le geste, ample puis retenu, lent puis rapide.
- Observer et nommer les traces obtenues, griffure, coulure, traînée, texture, touche.
- Choisir l'outil et le geste qui produisent l'effet le plus proche de ce qu'on recherche.
vocabulaire:
- terme: trace
  definition: la marque laissée sur le support par un outil et un geste
- terme: touche
  definition: la petite marque laissée par un coup de pinceau ou d'outil
- terme: griffure
  definition: une marque grattée dans la matière encore fraîche
- terme: traînée
  definition: une longue marque laissée par un outil qu'on fait glisser sur le support
- terme: coulure
  definition: trace laissée par une matière liquide qui coule sur le support
- terme: texture
  definition: l'aspect de la surface, lisse, granuleuse ou rayée, qu'on voit et qu'on peut sentir au toucher
- terme: facture
  definition: la manière dont une œuvre a été faite, qu'on devine en regardant ses traces
erreurs_frequentes:
- N'utiliser qu'un seul outil, le pinceau classique, sans explorer d'autres possibilités.
- Toujours faire le même geste sans varier son amplitude ou sa vitesse.
- Vouloir absolument contrôler le geste alors qu'un effet imprévu peut être intéressant.
- Confondre la touche, petite marque d'un coup de pinceau, et la traînée, longue marque d'un outil qu'on fait glisser.
exemple:
  enonce: Tu peins une ligne avec un pinceau fin, puis la même ligne avec une éponge. Les deux traces sont-elles identiques
    ?
  solution: Non, le pinceau fin laisse une ligne nette et régulière, une touche précise, tandis que l'éponge laisse une texture
    plus irrégulière, plus granuleuse. Le même geste avec deux outils différents ne donne pas le même effet.
exercices:
- id: mot-coulure
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la trace laissée par une matière liquide qui coule sur le support ?
  reponse:
    acceptees:
    - coulure
    fautes_tolerees: 1
  indices:
    relance: Ce mot vient du verbe « couler », comme une matière liquide qui glisse vers le bas.
    methode: Relis le vocabulaire de la fiche, un mot désigne la trace laissée par une matière qui coule.
    etape: Pense à l'encre qui glisse toute seule sur une feuille penchée, comme dans la leçon.
  pieges:
  - si:
      valeur: trace
    relance: La trace est le mot général pour toute marque laissée sur le support. Ici on cherche le mot précis pour une matière
      qui coule.
  - si:
      valeur: griffure
    relance: La griffure est une trace qui gratte la surface. Ici on cherche le mot pour une matière liquide qui coule vers
      le bas.
  solution: La coulure désigne la trace laissée par une matière liquide qui coule sur le support.
- id: outil-eponge-ou-pinceau-fin
  type: choix
  difficulte: 1
  enonce: Pour obtenir une ligne nette, précise et régulière, quel outil est le plus adapté ?
  reponse:
    options:
    - id: a
      texte: Un pinceau fin
    - id: b
      texte: Une éponge
    - id: c
      texte: Un chiffon
    bonnes:
    - a
  indices:
    relance: Quel outil a une pointe fine qui permet de contrôler précisément le tracé ?
    methode: Un outil fin et précis se distingue d'un outil large qui produit une texture plus irrégulière.
    etape: L'éponge et le chiffon laissent plutôt des textures irrégulières, larges et granuleuses.
  pieges:
  - si:
      contient:
      - b
    relance: L'éponge laisse une texture plus irrégulière, plus granuleuse, pas une ligne nette et précise.
  - si:
      contient:
      - c
    relance: Le chiffon sert plutôt à étaler ou essuyer largement, pas à tracer une ligne fine et précise.
  solution: Un pinceau fin permet de tracer une ligne nette, précise et régulière, contrairement à l'éponge ou au chiffon.
- id: brosse-qui-glisse
  type: choix
  difficulte: 1
  enonce: Tu fais glisser une brosse chargée de peinture d'un bout à l'autre de la feuille, sans jamais la soulever. Quelle
    marque obtiens-tu ?
  reponse:
    options:
    - id: a
      texte: Une traînée
    - id: b
      texte: Une coulure
    - id: c
      texte: Une découpe
    bonnes:
    - a
  indices:
    relance: La peinture a-t-elle coulé toute seule, ou est-ce l'outil qui a glissé longtemps sur la feuille ?
    methode: Relis le vocabulaire de la fiche, un mot désigne la longue marque laissée par un outil qu'on fait glisser.
    etape: La coulure vient d'un liquide qui coule tout seul, et une découpe se fait avec des ciseaux. Ici, c'est la brosse
      qui glisse.
  pieges:
  - si:
      contient:
      - b
    relance: Une coulure se forme quand une matière liquide coule toute seule. Ici, c'est toi qui fais glisser la brosse.
  - si:
      contient:
      - c
    relance: Une découpe se fait en coupant le support, avec des ciseaux par exemple. Ici, on ne coupe rien.
  solution: 'On obtient une traînée : la longue marque laissée par un outil qu''on fait glisser sur le support sans le soulever.'
- id: associer-outils-effets
  type: association
  difficulte: 2
  enonce: Relie chaque outil ou geste à l'effet qu'il produit le plus souvent.
  reponse:
    gauche:
    - id: a
      texte: Un pinceau fin utilisé avec un geste retenu
    - id: b
      texte: De la peinture très liquide versée sur une feuille inclinée
    - id: c
      texte: Une éponge tamponnée sur le support
    - id: d
      texte: Un ongle qui gratte la peinture encore fraîche
    droite:
    - id: x
      texte: Une touche précise et régulière
    - id: y
      texte: Une coulure
    - id: z
      texte: Une texture granuleuse
    - id: w
      texte: Une griffure
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: La peinture très liquide qui glisse sur une feuille inclinée, quel effet cela produit-il en général ?
    methode: Pour chaque outil ou geste, demande-toi s'il produit une ligne précise, une matière qui coule, une texture irrégulière,
      ou une marque grattée.
    etape: Le pinceau fin avec un geste retenu donne une touche précise et régulière.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque outil ou geste en te demandant quel effet il produit le plus
      souvent.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, le pinceau fin retenu donne une touche précise, puis range les autres cas.
  solution: Le pinceau fin retenu donne une touche précise, la peinture liquide qui glisse donne une coulure, l'éponge tamponnée
    donne une texture granuleuse, l'ongle qui gratte donne une griffure.
- id: etapes-explorer-outils
  type: ordre
  difficulte: 2
  enonce: Range ces étapes dans l'ordre pour explorer les effets des outils et du geste.
  reponse:
    elements:
    - id: choisir
      texte: Choisir un médium et plusieurs outils différents
    - id: tester
      texte: Tester chaque outil en variant l'amplitude du geste
    - id: observer
      texte: Observer et nommer les traces obtenues
    - id: adapter
      texte: Choisir l'outil et le geste qui produisent l'effet recherché
  indices:
    relance: Peux-tu choisir l'outil final avant même d'avoir observé les traces obtenues ?
    methode: Range d'abord le choix du médium et des outils, puis leur test, puis l'observation, puis le choix final.
    etape: La première étape est de choisir un médium et plusieurs outils différents.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient normalement avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape de départ, choisir le médium et les outils, et l'étape de fin, choisir l'effet recherché,
      puis range les deux autres entre elles.
  solution: On choisit un médium et plusieurs outils, puis on teste chaque outil en variant le geste, puis on observe et on
    nomme les traces, puis on choisit l'outil et le geste qui produisent l'effet recherché.
- id: geste-ample-ou-retenu
  type: choix
  difficulte: 2
  enonce: Un grand mouvement du bras qui trace une ligne large et rapide est un geste...
  reponse:
    options:
    - id: a
      texte: Ample
    - id: b
      texte: Retenu
    - id: c
      texte: Malléable
    bonnes:
    - a
  indices:
    relance: Ce mouvement est-il grand et large, ou petit et contrôlé ?
    methode: Un mouvement grand et large se distingue d'un mouvement petit et contrôlé.
    etape: Un grand mouvement du bras est plus large qu'un petit mouvement du poignet.
  pieges:
  - si:
      contient:
      - b
    relance: Un geste retenu est petit et contrôlé, comme un mouvement du poignet. Ici, c'est un grand mouvement du bras.
  - si:
      contient:
      - c
    relance: Malléable concerne la matière qui se déforme, pas l'amplitude d'un geste.
  solution: Un grand mouvement du bras, large et rapide, est un geste ample.
- id: gestes-avec-surprise
  type: choix
  difficulte: 3
  enonce: Parmi ces façons de travailler, lesquelles laissent une part d'imprévu, où l'on ne sait pas exactement à l'avance
    où ira la trace ? Choisis toutes les bonnes réponses.
  reponse:
    options:
    - id: a
      texte: Laisser couler de l'encre liquide sur une feuille penchée
    - id: b
      texte: Tracer lentement le contour d'une forme avec un pinceau fin
    - id: c
      texte: Projeter de la peinture en secouant une brosse au-dessus du support
    - id: d
      texte: Colorier soigneusement l'intérieur d'une forme sans dépasser
    bonnes:
    - a
    - c
  indices:
    relance: Pour chaque façon de faire, demande-toi si c'est ta main qui guide la trace jusqu'au bout, ou si la matière part
      un peu où elle veut.
    methode: Un geste maîtrisé guide la trace de près. Un geste imprévisible laisse la matière s'échapper toute seule.
    etape: Tracer lentement un contour avec un pinceau fin est un geste très contrôlé. Cherche les façons où la matière échappe
      à la main.
  pieges:
  - si:
      contient:
      - b
    relance: Quand tu traces lentement un contour avec un pinceau fin, sais-tu où va la trace ? C'est plutôt un geste maîtrisé.
  - si:
      contient:
      - d
    relance: Colorier sans dépasser demande de tout contrôler. Y a-t-il une surprise dans ce geste ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une bonne réponse, mais il y en a une autre. Cherche encore une façon où la matière part toute seule.
  solution: 'Laisser couler l''encre sur une feuille penchée et projeter la peinture en secouant une brosse laissent une part
    d''imprévu : la matière va où elle veut. Tracer un contour lentement et colorier sans dépasser sont des gestes maîtrisés.'
- id: decrire-effet-outil-choisi
  type: ouverte
  difficulte: 3
  enonce: Choisis un outil inhabituel, comme une fourchette, un coton-tige ou tes doigts, et explique en deux ou trois phrases
    quel effet il pourrait produire sur une peinture, en citant au moins un mot du vocabulaire de la fiche.
  criteres:
  - L'élève nomme un outil précis, inhabituel pour peindre.
  - L'élève décrit l'effet visuel probable de cet outil.
  - L'élève utilise au moins un mot du vocabulaire, comme trace, texture ou coulure.
  indices:
    relance: Pense à la forme de l'outil, laisse-t-il une trace pointue, large, régulière ou irrégulière ?
    methode: Choisis l'outil, imagine le contact avec la peinture, puis décris la trace ou la texture obtenue.
    etape: Tu peux commencer ainsi, avec une fourchette, je pourrais...
  solution: Par exemple, avec une fourchette trempée dans la peinture, je pourrais tracer des lignes parallèles fines qui
    créent une texture rayée, différente de la touche lisse d'un pinceau.
