format: 2
notion: cm1-heterogeneite-coherence-plastiques
version: 1
etat: verifiee
declencheurs:
- mélanger des matériaux différents
- coller plein de choses
- assemblage d'objets divers
- des trucs qui ne vont pas ensemble
- collage hétéroclite
- trouver un lien entre matériaux
prerequis: []
essentiel: 'En arts plastiques, on peut associer des matériaux, des objets ou des images très différents les uns des autres
  : c''est ce qu''on appelle l''hétérogénéité (des choses variées, pas pareilles).


  Même quand les éléments sont très différents, on peut créer une cohérence, c''est-à-dire faire en sorte qu''ils aillent
  ensemble et forment un tout qui a du sens.


  Cela demande de faire des choix et d''établir des relations formelles (de forme, de couleur, de matière) entre les éléments
  assemblés.


  On travaille cette question aussi bien à plat (en deux dimensions, par exemple un collage) qu''en volume (en trois dimensions,
  par exemple un assemblage d''objets).'
methode:
- Rassembler plusieurs matériaux ou images très différents entre eux.
- 'Chercher un point commun possible entre eux : une couleur, une forme, un thème.'
- Organiser les éléments pour qu'ils se répondent, même s'ils restent très différents.
- Vérifier que l'ensemble a un sens ou un effet voulu, malgré la diversité des éléments.
vocabulaire:
- terme: hétérogène
  definition: composé d'éléments très différents les uns des autres
- terme: cohérence
  definition: le fait que des éléments différents s'organisent ensemble avec du sens
erreurs_frequentes:
- Coller des éléments au hasard sans chercher aucun lien entre eux.
- N'utiliser que des matériaux très ressemblants, ce qui n'explore pas l'hétérogénéité.
- Penser que « différent » veut dire automatiquement « incohérent ».
exemple:
  enonce: Tu colles sur une feuille un morceau de tissu, un bouchon en plastique et un bout de papier journal. Comment leur
    donner de la cohérence ?
  solution: Tu peux, par exemple, choisir de tout peindre dans les mêmes couleurs (bleu et blanc) ou organiser les trois éléments
    pour qu'ils dessinent ensemble une même forme (un bateau, un visage). Même si le tissu, le plastique et le papier sont
    très différents comme matières, l'organisation ou la couleur commune crée la cohérence.
exercices:
- id: mot-heterogene
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne ce qui est composé d'éléments très différents les uns des autres ?
  reponse:
    acceptees:
    - hétérogène
    fautes_tolerees: 1
  indices:
    relance: 'Pense à un assemblage de tissu, plastique et papier : ces matières se ressemblent-elles entre elles ?'
    methode: Relis le vocabulaire de ta leçon. Un mot désigne des éléments très variés, pas pareils.
    etape: Le mot commence par « hétéro » et se termine par « -gène ».
  pieges:
  - si:
      valeur: cohérent
    relance: Cohérent veut dire que les éléments s'organisent avec du sens. On cherche plutôt le mot pour des éléments très
      différents entre eux.
  - si:
      valeur: varié
    relance: C'est une idée proche, mais le mot précis de ta leçon commence par « hétéro ».
  solution: 'Le mot est « hétérogène » : composé d''éléments très différents les uns des autres.'
- id: collage-hasard-vs-organise
  type: choix
  difficulte: 1
  enonce: Sam colle un morceau de tissu, un bouchon et un bout de papier journal au hasard sur sa feuille, sans chercher aucun
    lien entre eux. Que manque-t-il à son collage ?
  reponse:
    options:
    - id: a
      texte: Rien, un collage n'a jamais besoin de lien entre les éléments
    - id: b
      texte: La cohérence, c'est-à-dire un lien qui fait que les éléments vont ensemble
    - id: c
      texte: Il faudrait remplacer tous les matériaux par des matériaux identiques
    bonnes:
    - b
  indices:
    relance: Même avec des matériaux très différents, peut-on leur trouver un point commun (couleur, forme, thème) ?
    methode: Repense à la différence entre coller au hasard et organiser les éléments pour qu'ils se répondent.
    etape: Sans couleur commune, ni forme, ni organisation, les éléments restent juste hétéroclites sans former un tout qui
      a du sens.
  pieges:
  - si:
      contient:
      - a
    relance: Un collage sans aucun lien entre les éléments manque de cohérence. Est-ce vraiment suffisant pour un bon assemblage
      ?
  - si:
      contient:
      - c
    relance: L'hétérogénéité (matériaux différents) n'est pas le problème ; on peut garder des matériaux différents tout en
      créant un lien entre eux.
  solution: 'Il manque la cohérence : même avec des matériaux très différents (hétérogènes), il faut chercher un lien (couleur,
    forme, thème) pour que l''ensemble ait du sens.'
- id: mot-coherence
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le fait que des éléments différents s'organisent ensemble avec du sens ?
  reponse:
    acceptees:
    - cohérence
    fautes_tolerees: 1
  indices:
    relance: Pense à ce qui manque à un collage fait au hasard, sans aucun lien entre les éléments.
    methode: 'Ce mot est le contraire du désordre : il désigne l''organisation qui donne du sens à un ensemble.'
    etape: Le mot commence par « cohér » et se termine par « -ence ».
  pieges:
  - si:
      valeur: hétérogène
    relance: Hétérogène désigne des éléments très différents entre eux. On cherche le mot pour l'organisation qui leur donne
      du sens ensemble.
  - si:
      valeur: harmonie
    relance: C'est une idée proche, mais le mot précis de ta leçon commence par « cohér ».
  solution: 'Le mot est « cohérence » : le fait que des éléments différents s''organisent ensemble avec du sens.'
- id: vocabulaire-associations
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: hétérogène
    - id: b
      texte: cohérence
    - id: c
      texte: relation formelle
    droite:
    - id: x
      texte: composé d'éléments très différents les uns des autres
    - id: y
      texte: le fait que des éléments différents s'organisent ensemble avec du sens
    - id: z
      texte: un lien de forme, de couleur ou de matière entre des éléments assemblés
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un mot parle d'éléments différents, un autre du sens de l'ensemble, le dernier du type de lien entre les éléments.
    methode: Commence par le mot que tu connais le mieux, puis élimine sa définition pour les deux autres.
    etape: « Hétérogène » va avec la définition qui parle d'éléments très différents.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque définition en te demandant à quel mot elle correspond le mieux.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un et demande-toi ce qu'il signifie précisément dans ta leçon.
  solution: Hétérogène = éléments très différents entre eux. Cohérence = organisation qui donne du sens à l'ensemble. Relation
    formelle = lien de forme, couleur ou matière entre les éléments.
- id: etapes-assemblage
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre pour créer un assemblage hétérogène et cohérent.
  reponse:
    elements:
    - id: rassembler
      texte: Rassembler plusieurs matériaux ou images très différents
    - id: chercher
      texte: Chercher un point commun possible entre eux (couleur, forme, thème)
    - id: organiser
      texte: Organiser les éléments pour qu'ils se répondent
    - id: verifier
      texte: Vérifier que l'ensemble a un sens malgré la diversité
  indices:
    relance: Que dois-tu faire en tout premier, avant même de chercher un point commun entre les matériaux ?
    methode: Rassemble d'abord tes matériaux, puis cherche un point commun, puis organise-les, puis vérifie le résultat.
    etape: La première étape est de rassembler plusieurs matériaux ou images très différents entre eux.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qui se fait en tout premier (rassembler les matériaux) et ce qui se fait en tout dernier (vérifier
      le sens).
  solution: On rassemble d'abord plusieurs matériaux très différents, puis on cherche un point commun entre eux, puis on les
    organise pour qu'ils se répondent, puis on vérifie que l'ensemble a du sens.
- id: expliquer-cohesion
  type: ouverte
  difficulte: 2
  enonce: Tu assembles un bouchon, une plume et un bout de laine sur une feuille. En deux ou trois phrases, explique comment
    tu peux leur donner de la cohérence malgré leurs différences.
  criteres:
  - L'élève identifie que les trois matériaux sont hétérogènes (très différents entre eux).
  - L'élève propose un point commun (couleur, forme ou thème) pour les relier.
  - L'élève montre qu'il comprend que la cohérence vient de l'organisation, pas de la ressemblance des matériaux.
  indices:
    relance: Le bouchon, la plume et la laine se ressemblent-ils comme matières ? Que peux-tu leur donner en commun malgré
      tout ?
    methode: Explique d'abord que les matériaux sont différents, puis quel point commun tu choisis pour les relier.
    etape: 'Tu peux commencer ainsi : « Ces trois matériaux sont très différents, mais je peux... ».'
  solution: 'Ces trois matériaux sont très différents, hétérogènes : un bouchon, une plume et de la laine n''ont pas la même
    matière. Je peux leur donner de la cohérence en les peignant tous de la même couleur, ou en les organisant pour qu''ils
    forment ensemble une seule forme reconnaissable, comme un oiseau.'
