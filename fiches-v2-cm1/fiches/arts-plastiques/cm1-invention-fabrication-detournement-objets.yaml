# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-invention-fabrication-detournement-objets
version: 3
etat: verifiee
declencheurs:
- donner un nouvel usage
- transformer une boite en autre chose
- objet qui raconte une histoire
- objet a plusieurs fonctions
- fourchette qui devient un peigne
- inventer un objet imaginaire
- vieux gant en marionnette
- fabriquer un objet souvenir
prerequis: []
essentiel: 'En arts plastiques, on peut créer des objets, mais aussi intervenir sur des objets qui existent déjà. On peut
  les transformer ou les manipuler. Le but peut être de raconter une histoire, d''exprimer une idée par un symbole, ou de
  créer quelque chose de poétique, qui fait rêver.


  Un même objet peut avoir différents statuts. Il est artistique quand c''est une œuvre qu''on regarde. Il est symbolique
  quand il représente une idée, comme un drapeau. Il est utilitaire quand il sert à quelque chose, comme une cuillère. Il
  est de communication quand il transmet un message, comme un panneau.


  Chaque objet a une forme, c''est-à-dire son aspect, et une fonction, c''est-à-dire ce à quoi il sert. D''habitude, la forme
  est pensée pour la fonction. Les dents d''une fourchette servent à piquer les aliments.


  Détourner un objet, c''est lui donner un autre usage ou un autre sens que celui pour lequel il a été fabriqué. Dans une
  histoire imaginée, une fourchette peut devenir un peigne, parce que ses dents ressemblent à celles d''un peigne. On joue
  alors sur la relation entre la forme et la fonction.


  On peut aussi fabriquer ou transformer un objet pour un moment important, qui a beaucoup de sens. Par exemple, une boîte
  décorée pour garder les souvenirs d''un ami qui déménage n''est plus une simple boîte. Elle devient un objet symbolique.

  '
methode:
- Choisir un objet du quotidien et observer sa forme et son usage habituel.
- Imaginer un nouvel usage ou un nouveau sens, différent de sa fonction d'origine.
- Décider ce que l'objet doit faire, raconter une histoire, représenter une idée ou faire rêver.
- Transformer l'objet, en le peignant, en l'assemblant à un autre objet ou en le déformant, pour ce nouvel usage.
- Vérifier que le nouvel objet raconte bien quelque chose de différent de l'objet de départ.
vocabulaire:
- terme: détournement
  definition: donner à un objet un usage ou un sens différent de celui prévu au départ
- terme: statut de l'objet
  definition: le rôle d'un objet, qui peut être artistique, symbolique, utilitaire ou de communication
- terme: forme
  definition: l'aspect d'un objet, ce à quoi il ressemble
- terme: fonction
  definition: ce à quoi sert un objet dans la vie de tous les jours
- terme: symbole
  definition: un objet ou une image qui représente une idée, comme un cœur pour l'amour
erreurs_frequentes:
- Ne faire qu'assembler des objets sans leur donner un nouveau sens ou une nouvelle fonction.
- Garder l'objet exactement dans son usage d'origine, ce qui n'est pas un détournement.
- Oublier de dire ou montrer ce que le nouvel usage imaginé représente.
- Croire qu'un objet n'a qu'un seul statut pour toujours, alors qu'il peut en changer quand on le transforme.
exemple:
  enonce: Tu prends une vieille boîte à chaussures et tu la transformes en petit théâtre pour des personnages en papier. Qu'as-tu
    fait ?
  solution: Tu as détourné un objet utilitaire pour lui donner un nouveau statut artistique et narratif, en changeant sa fonction
    sans forcément changer beaucoup sa forme. La boîte ne sert plus à ranger des chaussures, elle sert maintenant à raconter
    des histoires.
exercices:
- id: mot-detournement
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le fait de donner à un objet un usage différent de celui prévu au départ ?
  reponse:
    acceptees:
    - détournement
    - detournement
    fautes_tolerees: 1
  indices:
    relance: Pense au mot qui décrit le fait de changer l'usage d'un objet, comme une fourchette qui devient un peigne dans
      une histoire.
    methode: Relis le vocabulaire de la fiche, un mot désigne le fait de donner un autre usage à un objet.
    etape: Relis le paragraphe de la leçon sur la fourchette qui devient un peigne.
  pieges:
  - si:
      valeur: transformation
    relance: Transformer, c'est changer la forme. Ici il faut le mot qui dit qu'on change plutôt l'usage de l'objet.
  - si:
      valeur: fabrication
    relance: Fabriquer, c'est créer un objet neuf. Ici l'objet existe déjà et change seulement d'usage.
  solution: Le détournement, c'est donner à un objet un usage ou un sens différent de celui pour lequel il a été fabriqué.
- id: statut-cuillere
  type: choix
  difficulte: 1
  enonce: Une cuillère qui sert à manger la soupe a quel statut ?
  reponse:
    options:
    - id: a
      texte: Utilitaire
    - id: b
      texte: Artistique
    - id: c
      texte: Symbolique
    - id: d
      texte: De communication
    bonnes:
    - a
  indices:
    relance: À quoi sert une cuillère dans la vraie vie, avant toute transformation ?
    methode: Demande-toi si l'objet sert à faire quelque chose de pratique au quotidien, ou s'il représente plutôt une idée.
    etape: Manger la soupe, est-ce pratique, ou est-ce que ça représente une idée ?
  pieges:
  - si:
      contient:
      - b
    relance: Une cuillère accrochée dans un musée pourrait devenir artistique, mais ici elle sert juste à manger.
  - si:
      contient:
      - c
    relance: Symbolique, c'est quand l'objet représente une idée. Manger la soupe, est-ce représenter une idée ?
  - si:
      contient:
      - d
    relance: De communication, c'est quand l'objet transmet un message, comme un panneau. Une cuillère fait-elle cela ?
  solution: Une cuillère qui sert à manger a un statut utilitaire, elle sert à faire quelque chose de pratique.
- id: associer-statuts
  type: association
  difficulte: 2
  enonce: Relie chaque objet à son statut.
  reponse:
    gauche:
    - id: a
      texte: Un tableau accroché dans un musée
    - id: b
      texte: Un drapeau qui représente un pays
    - id: c
      texte: Une fourchette qui sert à manger
    - id: d
      texte: Un panneau qui indique une sortie
    droite:
    - id: x
      texte: Statut artistique
    - id: y
      texte: Statut symbolique
    - id: z
      texte: Statut utilitaire
    - id: w
      texte: Statut de communication
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Le tableau au musée, sert-il d'abord à représenter une idée ou à être regardé comme une œuvre ?
    methode: Demande-toi pour chaque objet s'il sert à faire quelque chose, à représenter une idée, à transmettre un message,
      ou à être une œuvre.
    etape: Le drapeau ne sert pas à manger ni à indiquer une sortie, il représente quelque chose.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque objet en te demandant à quoi il sert d'abord.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, la fourchette sert à manger, c'est utilitaire, puis range les autres objets.
  solution: Tableau, artistique. Drapeau, symbolique. Fourchette, utilitaire. Panneau, de communication.
- id: etapes-detournement
  type: ordre
  difficulte: 2
  enonce: Range ces étapes dans l'ordre pour détourner un objet.
  reponse:
    elements:
    - id: choisir
      texte: Choisir un objet du quotidien et observer sa forme
    - id: imaginer
      texte: Imaginer un nouvel usage différent de la fonction d'origine
    - id: transformer
      texte: Transformer l'objet pour ce nouvel usage
    - id: verifier
      texte: Vérifier que l'objet raconte bien quelque chose de nouveau
  indices:
    relance: Peux-tu imaginer un nouvel usage avant même d'avoir choisi un objet ?
    methode: Range d'abord ce qu'on fait avec l'objet de départ, puis ce qu'on imagine, puis ce qu'on fabrique, puis ce qu'on
      vérifie à la fin.
    etape: La première étape est de choisir un objet et d'observer sa forme et son usage habituel.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient normalement avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape de départ, choisir l'objet, et l'étape de fin, vérifier le résultat, puis range les deux
      autres entre elles.
  solution: On choisit un objet et on observe sa forme, puis on imagine un nouvel usage, puis on transforme l'objet, puis
    on vérifie que le résultat raconte bien autre chose.
- id: mot-statut
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le rôle d'un objet, qui peut être artistique, symbolique, utilitaire ou de communication ?
  reponse:
    acceptees:
    - statut
    - statut de l'objet
    fautes_tolerees: 1
  indices:
    relance: Ce mot se trouve dans le vocabulaire de ta fiche, juste avant « de l'objet ».
    methode: Relis le vocabulaire, un mot désigne le rôle d'un objet parmi quatre possibilités.
    etape: Relis le deuxième paragraphe de la leçon, celui qui parle du drapeau et de la cuillère.
  pieges:
  - si:
      valeur: fonction
    relance: La fonction, c'est plutôt à quoi sert l'objet concrètement. Ici on cherche le mot plus général qui désigne son
      rôle parmi quatre catégories.
  - si:
      valeur: usage
    relance: L'usage, c'est ce qu'on fait de l'objet. Le mot cherché désigne plutôt la catégorie de son rôle.
  solution: Le statut de l'objet, c'est son rôle, qui peut être artistique, symbolique, utilitaire ou de communication.
- id: forme-et-fonction
  type: choix
  difficulte: 2
  enonce: Dans une histoire, Malo imagine qu'une passoire retournée devient le casque d'un chevalier. Pourquoi cette idée
    marche-t-elle bien ?
  reponse:
    options:
    - id: a
      texte: Parce que la forme arrondie de la passoire ressemble à celle d'un casque
    - id: b
      texte: Parce qu'une passoire sert déjà à protéger la tête
    - id: c
      texte: Parce qu'on n'a rien changé à l'usage de la passoire
    bonnes:
    - a
  indices:
    relance: Pose une passoire à l'envers sur une table. À quoi ressemble son contour ?
    methode: Un détournement réussi joue souvent sur la forme de l'objet, qui fait penser à un autre objet.
    etape: D'habitude, une passoire sert à égoutter les pâtes. Ce n'est donc pas sa fonction qui fait penser au chevalier.
  pieges:
  - si:
      contient:
      - b
    relance: À quoi sert une passoire dans la cuisine ? Est-ce vraiment à protéger la tête ?
  - si:
      contient:
      - c
    relance: Dans l'histoire, la passoire ne sert plus à égoutter. Son usage a-t-il vraiment été gardé ?
  solution: L'idée marche parce que la forme arrondie de la passoire ressemble à un casque. On garde la forme mais on change
    la fonction, c'est un détournement qui joue sur la relation entre forme et fonction.
- id: but-de-l-objet
  type: association
  difficulte: 3
  enonce: Relie chaque objet transformé au but principal de sa transformation.
  reponse:
    gauche:
    - id: a
      texte: Une boîte à chaussures devenue le décor d'une histoire de pirates
    - id: b
      texte: Une boîte décorée pour garder les souvenirs d'un ami qui déménage
    - id: c
      texte: Une vieille chaise couverte de fleurs en papier qui semble sortie d'un rêve
    droite:
    - id: x
      texte: Raconter une histoire
    - id: y
      texte: Représenter une idée forte, un symbole
    - id: z
      texte: Créer quelque chose de poétique, qui fait rêver
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Lequel de ces objets sert à jouer une aventure avec des personnages ?
    methode: Pour chaque objet, demande-toi s'il sert à raconter, à représenter une idée importante, ou à faire rêver.
    etape: La boîte aux souvenirs représente l'amitié avec la personne qui part.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis ce que chaque objet doit faire ressentir ou comprendre.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le décor de pirates, qui sert à jouer une aventure, puis range les deux autres.
  solution: Le décor de pirates sert à raconter une histoire. La boîte aux souvenirs représente l'amitié, c'est un symbole.
    La chaise couverte de fleurs est poétique, elle fait rêver.
- id: inventer-detournement
  type: ouverte
  difficulte: 3
  enonce: Choisis un objet du quotidien et explique, en deux ou trois phrases, comment tu pourrais le détourner pour qu'il
    devienne un personnage ou un décor imaginaire.
  criteres:
  - L'élève nomme un objet précis du quotidien.
  - L'élève décrit une transformation qui change l'usage ou le sens de l'objet.
  - L'élève explique ce que représente le nouvel objet obtenu.
  indices:
    relance: Pense à un objet que tu utilises souvent. Que pourrait-il devenir s'il changeait d'usage ?
    methode: Choisis l'objet, imagine son nouvel usage, puis explique comment tu le transformerais.
    etape: Tu peux commencer ainsi, je prends un objet et je le transforme en...
  solution: Par exemple, je prends un vieux gant de laine et je le transforme en marionnette, en lui cousant des yeux, pour
    qu'il devienne un personnage dans une petite histoire que je raconte.
