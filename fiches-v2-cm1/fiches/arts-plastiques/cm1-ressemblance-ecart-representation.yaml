format: 2
notion: cm1-ressemblance-ecart-representation
version: 3
etat: verifiee
declencheurs:
- pas beau mon dessin
- ressemble pas au modèle
- copier un modèle
- déformer exprès un dessin
- accentuer un détail
- comme dans la vraie vie
- dessiner en vrai
- couleur inventée exprès
- exagérer un personnage
prerequis: []
essentiel: 'Dessiner ou peindre, ce n''est pas seulement recopier exactement ce qu''on voit : c''est faire des choix.


  La ressemblance, c''est quand une représentation fait reconnaître facilement la chose réelle. Devant un dessin de chat ressemblant,
  tu dis tout de suite : « c''est un chat ».


  L''écart, c''est la différence volontaire entre le réel et ce qu''on représente : une couleur inventée, une forme déformée,
  un détail agrandi. Cet écart n''est pas une erreur. Il a une valeur expressive : il sert à montrer une émotion ou une idée
  qu''une copie exacte ne montrerait pas.


  On peut choisir entre quatre façons de faire. Imiter, c''est chercher à ressembler le plus possible au réel. Accentuer,
  c''est exagérer un détail, comme des oreilles de lapin immenses pour montrer qu''il écoute tout. Interpréter, c''est représenter
  à sa façon, avec ses propres couleurs et formes. S''éloigner, c''est s''écarter tellement du réel qu''on le reconnaît à
  peine.


  Par exemple, un arbre peint tout rouge peut faire penser au feu ou à la colère. Un visage aux yeux énormes peut montrer
  la surprise. Ce sont des choix différents, pas des ratés.


  Avant de dessiner, décide donc ce que tu veux garder du réel et ce que tu veux changer exprès.

  '
methode:
- 'Observer d''abord ce qu''on veut représenter : sa forme, ses proportions, ses couleurs.'
- Choisir ce qu'on veut exprimer, une émotion ou une idée.
- 'Décider d''un choix : imiter, accentuer un détail, interpréter ou s''éloigner.'
- Assumer ce choix jusqu'au bout du dessin plutôt que de vouloir « corriger » vers le réel.
- Se demander ce que l'écart choisi fait comprendre ou ressentir de plus qu'une copie exacte.
vocabulaire:
- terme: ressemblance
  definition: ce qui, dans une représentation, fait reconnaître la chose réelle
- terme: écart
  definition: la différence volontaire entre le réel et sa représentation
- terme: imitation
  definition: le fait de chercher à reproduire le réel le plus fidèlement possible
- terme: accentuation
  definition: le fait d'exagérer exprès un détail ou une caractéristique du réel
- terme: interprétation
  definition: une façon personnelle de représenter, différente d'une copie exacte
- terme: éloignement
  definition: le fait de s'écarter beaucoup du réel, au point qu'on le reconnaît à peine
erreurs_frequentes:
- Croire qu'un dessin n'est réussi que s'il ressemble parfaitement au modèle.
- Effacer un écart volontaire (couleur, forme) en pensant que c'est une erreur à corriger.
- Ne faire que de l'imitation sans jamais oser accentuer ou interpréter.
- Faire un écart au hasard, sans savoir ce qu'on veut exprimer avec lui.
exemple:
  enonce: Tu dessines ton chat, mais tu le dessines tout bleu avec des moustaches immenses. Est-ce raté ?
  solution: 'Non : le chat reste reconnaissable, la ressemblance est là. Mais la couleur bleue et les moustaches immenses
    sont des écarts volontaires : ils peuvent montrer que ce chat est mystérieux, par exemple. Les moustaches immenses sont
    une accentuation, la couleur bleue est une interprétation. C''est un choix, pas une erreur.'
exercices:
- id: mot-ecart
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne une différence volontaire entre le réel et ce qu'on en dessine, comme une couleur inventée ou une
    forme déformée exprès ?
  reponse:
    acceptees:
    - écart
    fautes_tolerees: 1
  indices:
    relance: 'Ce mot ne veut pas dire « erreur » : c''est un choix fait exprès par celui qui dessine.'
    methode: Relis le vocabulaire de ta leçon. Un mot désigne la différence volontaire entre le réel et sa représentation.
    etape: Relis le deuxième paragraphe de la leçon, celui qui parle d'une couleur inventée.
  pieges:
  - si:
      valeur: erreur
    relance: Une erreur n'est pas voulue. Ici, le dessinateur a choisi exprès de changer quelque chose. Quel est le bon mot
      ?
  - si:
      valeur: copie
    relance: Une copie cherche au contraire à ne pas s'éloigner du réel. Quel mot désigne au contraire une différence choisie
      ?
  solution: 'Le mot est « écart » : une différence volontaire entre le réel et sa représentation, faite pour exprimer quelque
    chose.'
- id: chat-violet
  type: choix
  difficulte: 1
  enonce: Léa dessine son chien tout violet avec des ailes de papillon dans le dos, mais on reconnaît bien que c'est un chien.
    Qu'a-t-elle fait ?
  reponse:
    options:
    - id: a
      texte: Une erreur de dessin qu'il faudrait corriger
    - id: b
      texte: Un écart volontaire pour interpréter son chien à sa façon
    - id: c
      texte: Une copie exacte de son chien
    bonnes:
    - b
  indices:
    relance: Le chien reste reconnaissable, mais sa couleur et ses ailes ne viennent pas du réel. Est-ce fait par hasard ?
    methode: Repense à la différence entre une erreur qu'on ne voulait pas et un choix fait exprès pour montrer quelque chose.
    etape: La couleur violette et les ailes n'existent pas chez un vrai chien. Léa les a ajoutées volontairement.
  pieges:
  - si:
      contient:
      - a
    relance: Une erreur, ce n'est pas voulu. Léa a choisi exprès la couleur violette et les ailes. Est-ce vraiment un raté
      ?
  - si:
      contient:
      - c
    relance: Une copie exacte ressemblerait en tout point au vrai chien, sans couleur ni ailes inventées. Est-ce le cas ici
      ?
  solution: 'Léa fait un écart volontaire : le chien reste reconnaissable (la ressemblance), mais la couleur et les ailes
    sont des choix d''interprétation, pas une erreur.'
- id: mot-ressemblance
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne ce qui, dans un dessin, fait reconnaître facilement la chose réelle représentée ?
  reponse:
    acceptees:
    - ressemblance
    fautes_tolerees: 1
  indices:
    relance: C'est le contraire de l'écart. Pense à ce qui permet de dire tout de suite « c'est un chat » devant un dessin
      de chat.
    methode: Ce mot vient du verbe « ressembler ». Cherche le nom qui va avec.
    etape: Relis le paragraphe de la leçon sur le dessin de chat qu'on reconnaît tout de suite.
  pieges:
  - si:
      valeur: copie
    relance: Une copie cherche à reproduire à l'identique. Ici, on demande le mot qui dit juste que la chose reste reconnaissable.
  - si:
      valeur: interprétation
    relance: L'interprétation est une façon personnelle de représenter. On cherche plutôt le mot qui dit que la chose reste
      identifiable.
  solution: 'Le mot est « ressemblance » : ce qui fait reconnaître facilement la chose réelle dans une représentation.'
- id: lapin-grandes-oreilles
  type: choix
  difficulte: 2
  enonce: Tom dessine un lapin bien reconnaissable, mais il lui fait des oreilles trois fois plus grandes que son corps pour
    montrer qu'il entend tout. Quel choix a-t-il fait ?
  reponse:
    options:
    - id: a
      texte: L'imitation
    - id: b
      texte: L'accentuation
    - id: c
      texte: L'éloignement
    bonnes:
    - b
  indices:
    relance: Tom a-t-il tout changé, ou a-t-il seulement exagéré un détail du vrai lapin ?
    methode: Relis les quatre façons de faire de la fiche. Une seule consiste à exagérer exprès un détail du réel.
    etape: Le lapin reste bien reconnaissable, donc Tom ne s'est pas éloigné du réel. Mais il n'a pas non plus copié exactement.
  pieges:
  - si:
      contient:
      - a
    relance: L'imitation cherche à ressembler le plus possible au réel. Un vrai lapin a-t-il des oreilles trois fois plus
      grandes que son corps ?
  - si:
      contient:
      - c
    relance: S'éloigner, c'est changer tellement qu'on reconnaît à peine la chose. Ici, on reconnaît très bien le lapin.
  solution: 'Tom a fait une accentuation : il a exagéré exprès un détail, les oreilles, pour montrer que le lapin entend tout.
    Le lapin reste reconnaissable.'
- id: vocabulaire-associations
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: ressemblance
    - id: b
      texte: écart
    - id: c
      texte: interprétation
    droite:
    - id: x
      texte: ce qui fait reconnaître la chose réelle
    - id: y
      texte: différence volontaire entre le réel et sa représentation
    - id: z
      texte: façon personnelle de représenter, différente d'une copie exacte
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un des trois mots parle de ce qu'on reconnaît, un autre d'une différence choisie exprès, le dernier d'une façon
      personnelle de faire.
    methode: Commence par le mot que tu connais le mieux, puis élimine sa définition pour les deux autres.
    etape: « Ressemblance » va avec la définition qui parle de reconnaître la chose réelle.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque définition en te demandant à quel mot elle correspond le mieux.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un et demande-toi ce qu'il signifie précisément dans ta leçon.
  solution: Ressemblance = ce qui fait reconnaître la chose réelle. Écart = différence volontaire entre le réel et sa représentation.
    Interprétation = façon personnelle de représenter.
- id: quatre-facons-de-representer
  type: association
  difficulte: 3
  enonce: Quatre élèves dessinent la même pomme. Relie chaque dessin à la façon de faire choisie.
  reponse:
    gauche:
    - id: a
      texte: Une pomme rouge et ronde, dessinée avec soin pour qu'elle paraisse vraie
    - id: b
      texte: Une pomme normale, mais avec une queue immense qui monte jusqu'en haut de la feuille
    - id: c
      texte: Une pomme bien reconnaissable, peinte en bleu et jaune parce que l'élève aime ces couleurs
    - id: d
      texte: Quelques taches rondes et une ligne, où l'on devine à peine une pomme
    droite:
    - id: x
      texte: Imitation
    - id: y
      texte: Accentuation
    - id: z
      texte: Interprétation
    - id: w
      texte: Éloignement
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Quel dessin cherche à paraître le plus vrai possible ? Commence par lui.
    methode: Pour chaque dessin, demande-toi s'il copie le réel, s'il exagère un détail, s'il change à sa façon tout en restant
      reconnaissable, ou s'il s'écarte presque complètement du réel.
    etape: La pomme avec une queue immense garde sa forme, mais un seul détail est exagéré.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare les deux dessins où la pomme reste reconnaissable mais change, un détail
      exagéré ou des couleurs personnelles.
  - si:
      diagnostic: associations_fausses
    relance: Range d'abord les deux extrêmes, le dessin le plus proche du réel et celui où l'on devine à peine la pomme, puis
      les deux autres.
  solution: La pomme dessinée pour paraître vraie est une imitation. La queue immense est une accentuation. Les couleurs bleue
    et jaune choisies par goût sont une interprétation. Les taches où l'on devine à peine la pomme sont un éloignement.
- id: etapes-demarche
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre pour dessiner un objet en choisissant un écart volontaire.
  reponse:
    elements:
    - id: observer
      texte: Observer la forme, les proportions et les couleurs de l'objet
    - id: decider
      texte: Décider d'un écart à faire (accentuer, interpréter ou s'éloigner)
    - id: assumer
      texte: Assumer ce choix jusqu'au bout du dessin
    - id: effet
      texte: Se demander ce que l'écart fait comprendre ou ressentir de plus
  indices:
    relance: Que dois-tu faire en tout premier, avant même de choisir un écart ?
    methode: Regarde d'abord l'objet réel, puis choisis ton écart, puis dessine sans revenir en arrière, puis réfléchis à
      l'effet obtenu.
    etape: 'La première étape est d''observer l''objet réel : sa forme, ses proportions, ses couleurs.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qui se fait en tout premier (regarder l'objet) et ce qui se fait en tout dernier (réfléchir
      à l'effet).
  solution: On observe d'abord l'objet réel, puis on décide de l'écart à faire, puis on assume ce choix jusqu'au bout du dessin,
    puis on se demande ce que cet écart fait ressentir.
- id: expliquer-ecart
  type: ouverte
  difficulte: 2
  enonce: Tu dessines un arbre de ton jardin avec des feuilles roses géantes au lieu de vertes normales. En deux ou trois
    phrases, explique pourquoi ce n'est pas raté.
  criteres:
  - L'élève dit que l'arbre reste reconnaissable (la ressemblance).
  - L'élève dit que la couleur et la taille des feuilles sont un écart volontaire, pas une erreur.
  - L'élève propose une idée de ce que cet écart peut exprimer ou faire ressentir.
  indices:
    relance: L'arbre est-il encore reconnaissable comme un arbre malgré les feuilles roses géantes ?
    methode: Explique d'abord ce qui reste pareil (la ressemblance), puis ce qui change volontairement (l'écart), puis ce
      que cela montre.
    etape: 'Tu peux commencer ainsi : « Mon arbre reste reconnaissable, mais... ».'
  solution: 'Mon arbre reste reconnaissable comme un arbre : c''est la ressemblance. Les feuilles roses géantes sont un écart
    volontaire, pas une erreur. Cela peut montrer que mon arbre est magique ou qu''il fleurit d''une façon extraordinaire.'
- id: nblm-un-eleve-regarde-son-travail-et-s-ecrie-1
  type: choix
  difficulte: 2
  enonce: 'Un élève regarde son travail et s''écrie : « C''est pas beau mon dessin, il ne ressemble pas au modèle ! » Que
    doit-on lui expliquer ?'
  reponse:
    options:
    - id: o1
      texte: Un dessin n'a pas besoin de recopier exactement la réalité pour être réussi, c'est un choix d'expression.
    - id: o2
      texte: Il a raison, car tout dessin qui ne ressemble pas au modèle est considéré comme un raté.
    - id: o3
      texte: Il doit immédiatement tout effacer et recommencer pour obtenir une copie exacte.
    - id: o4
      texte: Il faut obligatoirement décalquer ou utiliser une photo pour faire une œuvre d'art.
    bonnes:
    - o1
  indices:
    relance: 'Réfléchis au rôle de l''artiste : cherche-t-il toujours à faire une copie conforme du réel ?'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Croire qu'un dessin doit obligatoirement être la copie exacte du modèle est une erreur fréquente.
  - si:
      contient:
      - o3
    relance: Effacer un écart créatif empêche l'élève de développer son expression personnelle et d'assumer son idée.
  - si:
      contient:
      - o4
    relance: L'apprentissage des arts plastiques repose sur des choix de représentation et d'interprétation, pas sur le décalquage.
  solution: Un dessin n'a pas besoin de recopier exactement la réalité pour être réussi, c'est un choix d'expression. Dessiner
    ou peindre n'est pas une simple copie conforme du réel, mais un choix plastique personnel.
- id: nblm-que-cherche-t-on-a-faire-en-arts-plastiq-2
  type: choix
  difficulte: 2
  enonce: Que cherche-t-on à faire en arts plastiques lorsqu'on essaie de copier un modèle « comme dans la vraie vie » ?
  reponse:
    options:
    - id: o1
      texte: On cherche la ressemblance pour faire reconnaître facilement la chose réelle.
    - id: o2
      texte: On cherche à créer un écart en déformant toutes les formes du modèle.
    - id: o3
      texte: On cherche à commettre une erreur technique sans s'en rendre compte.
    - id: o4
      texte: On cherche à inventer des couleurs abstraites sans rapport avec le sujet.
    bonnes:
    - o1
  indices:
    relance: Pense au mot qui désigne le fait qu'un dessin permette de reconnaître immédiatement le sujet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Déformer les formes crée un écart, ce qui s'éloigne de l'imitation exacte du réel.
  - si:
      contient:
      - o3
    relance: La recherche de ressemblance est une intention claire de représenter le réel, pas une erreur.
  - si:
      contient:
      - o4
    relance: Inventer des couleurs abstraites s'éloigne de la recherche d'imitation du modèle réel.
  solution: On cherche la ressemblance pour faire reconnaître facilement la chose réelle. La ressemblance est ce qui, dans
    une représentation, permet de reconnaître le sujet réel.
- id: nblm-pour-quelle-raison-un-eleve-peut-il-deci-3
  type: choix
  difficulte: 2
  enonce: Pour quelle raison un élève peut-il décider de déformer exprès un dessin ou de changer une couleur ?
  reponse:
    options:
    - id: o1
      texte: Pour créer un écart volontaire afin d'exprimer une émotion ou une idée particulière.
    - id: o2
      texte: Parce qu'il ne sait pas utiliser ses crayons ou ses pinceaux correctement.
    - id: o3
      texte: Pour respecter obligatoirement les proportions exactes du sujet réel.
    - id: o4
      texte: Parce qu'il a commis un accident et qu'il cherche à le cacher.
    bonnes:
    - o1
  indices:
    relance: Demande-toi ce que l'élève souhaite transmettre au spectateur lorsqu'il s'éloigne du réel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Déformer exprès est une démarche artistique consciente, pas un manque de maîtrise technique.
  - si:
      contient:
      - o3
    relance: Déformer exprès est le contraire d'une reproduction stricte des proportions réelles.
  - si:
      contient:
      - o4
    relance: Un écart artistique volontaire est une intention créative assumée, pas le masquage d'une erreur.
  solution: Pour créer un écart volontaire afin d'exprimer une émotion ou une idée particulière. L'écart volontaire sert à
    communiquer des émotions ou des idées qu'une copie exacte ne montrerait pas.
- id: nblm-si-tu-dessines-un-animal-en-choisissant-4
