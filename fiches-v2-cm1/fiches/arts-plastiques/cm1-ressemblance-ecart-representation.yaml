      texte: L'accentuation des caractéristiques d'un sujet
    - id: o2
      texte: L'interprétation personnelle d'un modèle
    - id: o3
      texte: L'erreur de tracé involontaire
    - id: o4
      texte: La copie conforme obligatoire
    bonnes:
