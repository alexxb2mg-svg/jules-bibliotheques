- id: nblm-dans-ton-cours-si-tu-dessines-un-chat-to-5
  type: choix
  difficulte: 2
  enonce: Dans ton cours, si tu dessines un chat tout bleu avec des moustaches immenses au lieu de le faire comme dans la
    vraie vie, quelle est la méthode à suivre ?
  reponse:
    options:
    - id: o1
      texte: Assumer ce choix créatif jusqu'au bout pour exprimer ton idée ou le côté mystérieux.
    - id: o2
      texte: Effacer immédiatement le bleu pour repeindre le chat en marron comme dans la réalité.
    - id: o3
      texte: Penser que le dessin est complètement gâché car les chats bleus n'existent pas.
    - id: o4
      texte: Mettre une mauvaise note au dessin parce que les moustaches sont trop grandes.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi ce que la fiche conseille de faire lorsqu'on a choisi une interprétation originale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Effacer un écart volontaire est une erreur courante chez l'élève qui pense s'être trompé.
  - si:
      contient:
      - o3
    relance: L'art permet de s'éloigner des caractéristiques du réel sans que la production soit gâchée.
  - si:
      contient:
      - o4
    relance: Agrandir un détail est une démarche d'accentuation expressive tout à fait légitime.
  solution: Assumer ce choix créatif jusqu'au bout pour exprimer ton idée ou le côté mystérieux. La méthode préconise d'assumer
    ses choix d'écart créatif au lieu de vouloir tout corriger vers le réel.
- id: nblm-quelles-sont-les-deux-propositions-qui-c-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX propositions qui correspondent à des démarches créatives volontaires de l'élève en arts plastiques
