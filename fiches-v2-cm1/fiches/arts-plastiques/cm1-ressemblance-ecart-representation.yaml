  - si:
      contient:
      - o4
    relance: S'éloigner de la réalité pour exprimer une idée ou une intention n'est pas un raté en arts plastiques.
  solution: Tu fais un choix d'accentuation et d'interprétation personnelle du sujet. Agrandir ou souligner un détail précis
