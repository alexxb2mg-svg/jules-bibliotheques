  difficulte: 2
  enonce: Si tu dessines un animal en choisissant d'accentuer un détail, par exemple en lui faisant des dents gigantesques,
    que fais-tu ?
  reponse:
    options:
    - id: o1
      texte: Tu fais un choix d'accentuation et d'interprétation personnelle du sujet.
    - id: o2
      texte: Tu commets une erreur de proportion qu'il faut corriger avec une règle.
    - id: o3
      texte: Tu réussis une copie conforme du modèle tel qu'il existe dans la nature.
    - id: o4
      texte: Tu prouves que ton dessin est raté car les proportions ne sont pas vraies.
    bonnes:
    - o1
  indices:
    relance: Pense à l'action de mettre en valeur ou d'agrandir une partie précise du dessin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Accentuer un détail est une démarche créative assumée, pas une faute de mesure.
  - si:
