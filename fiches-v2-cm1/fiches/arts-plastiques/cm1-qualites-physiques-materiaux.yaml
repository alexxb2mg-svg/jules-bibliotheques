format: 2
notion: cm1-qualites-physiques-materiaux
version: 3
etat: verifiee
declencheurs:
- matériau rugueux
- matériau qui absorbe l'eau
- matériau mou
- matériau de récupération
- quels matériaux utiliser
- tester un matériau au toucher
- papier qui boit l'eau
- pâte qui se déforme
- vieux cartons pour bricoler
prerequis: []
essentiel: 'En arts plastiques, on crée avec des matériaux très variés. On peut les ranger en trois familles.


  Les matériaux de récupération ont déjà servi : un vieux carton, un bouchon, un journal, un tissu usé. Les matériaux non
  transformés sont naturels et bruts, pris tels quels : une pierre, du sable, une branche, des feuilles. Les matériaux transformés
  ont été fabriqués par des transformations physiques ou chimiques : le papier, le plastique, la pâte à modeler.


  Chaque matériau a des qualités physiques qu''on peut observer, toucher et nommer. La porosité : le matériau absorbe-t-il
  l''eau, comme une éponge, ou non, comme le plastique ? La rugosité : sa surface est-elle lisse ou râpeuse ? La liquidité
  : coule-t-il, comme de l''encre ? La malléabilité : se déforme-t-il facilement et garde-t-il sa nouvelle forme, comme la
  pâte à modeler ?


  Ces qualités changent ce que tu peux faire. À plat, en deux dimensions, un papier très poreux boit la peinture et peut gondoler.
  En volume, en trois dimensions, un matériau malléable se modèle, alors qu''un carton rigide se découpe et s''assemble pour
  construire.


  Avant de peindre, dessiner, sculpter ou construire, teste donc tes matériaux, tes médiums et tes supports. Tu choisiras
  mieux celui qui convient à ton projet.

  '
methode:
- Choisir plusieurs matériaux différents, papier, carton, tissu, pâte à modeler.
- Ranger chaque matériau dans sa famille, récupération, non transformé ou transformé.
- Tester leurs qualités physiques, les toucher, essayer de les plier, d'y mettre de l'eau.
- Nommer ce que l'on observe, rugueux, lisse, poreux, malléable, rigide.
- Choisir le matériau le plus adapté selon ce qu'on veut réaliser, peindre, modeler, construire.
vocabulaire:
- terme: porosité
  definition: la capacité d'un matériau à absorber un liquide
- terme: malléabilité
  definition: la capacité d'un matériau à se déformer et garder sa nouvelle forme
- terme: rugosité
  definition: le caractère lisse ou râpeux de la surface d'un matériau
- terme: liquidité
  definition: le fait qu'une matière soit liquide et coule, comme l'encre ou l'eau
- terme: matériau de récupération
  definition: un matériau qui a déjà servi à autre chose et qu'on réutilise pour créer
- terme: matériau non transformé
  definition: un matériau naturel et brut, utilisé tel qu'on le trouve, comme une pierre ou une branche
erreurs_frequentes:
- Utiliser toujours le même matériau sans tester s'il convient à ce qu'on veut faire.
- Confondre la rugosité, le toucher de la surface, et la porosité, l'absorption d'un liquide.
- Croire qu'un matériau de récupération ne peut pas avoir d'intérêt plastique.
- Oublier qu'un matériau qui convient à plat ne convient pas forcément en volume, et l'inverse.
exemple:
  enonce: Tu peins avec de l'aquarelle sur une feuille de papier journal, puis sur une feuille de papier épais pour aquarelle.
    Pourquoi le résultat est-il différent ?
  solution: Les deux papiers n'ont pas la même porosité, le papier journal boit vite la peinture et gondole, le papier épais
    absorbe l'eau plus régulièrement et garde sa forme. La qualité physique du support change donc l'effet de la peinture.
exercices:
- id: mot-porosite
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la capacité d'un matériau à absorber un liquide ?
  reponse:
    acceptees:
    - porosité
    - porosite
    fautes_tolerees: 1
  indices:
    relance: Ce mot vient du mot « pore », les petits trous par lesquels un liquide peut passer dans une matière.
    methode: Relis le vocabulaire de la fiche, un mot désigne la capacité d'un matériau à absorber un liquide.
    etape: Relis le deuxième paragraphe de la leçon. La première qualité citée parle de l'éponge et du plastique.
  pieges:
  - si:
      valeur: rugosité
    relance: La rugosité concerne le toucher de la surface, lisse ou râpeux. Ici on cherche le mot qui concerne l'absorption
      d'un liquide.
  - si:
      valeur: liquidité
    relance: La liquidité décrit l'état d'un matériau liquide lui-même. Ici on cherche le mot qui décrit la capacité d'un
      matériau à absorber un liquide.
  solution: La porosité désigne la capacité d'un matériau à absorber un liquide.
- id: rugueux-ou-lisse
  type: choix
  difficulte: 1
  enonce: Un morceau de papier de verre, quand on passe le doigt dessus, est plutôt...
  reponse:
    options:
    - id: a
      texte: Rugueux
    - id: b
      texte: Lisse
    - id: c
      texte: Malléable
    bonnes:
    - a
  indices:
    relance: Le doigt glisse-t-il facilement sur cette surface, ou sent-il des petits grains qui accrochent ?
    methode: La rugosité désigne le caractère râpeux d'une surface, qui accroche au toucher.
    etape: Le papier de verre est fait pour poncer, il accroche au toucher.
  pieges:
  - si:
      contient:
      - b
    relance: Une surface lisse ne fait pas accrocher le doigt. Le papier de verre accroche-t-il ou glisse-t-il ?
  - si:
      contient:
      - c
    relance: La malléabilité concerne la capacité à se déformer, pas le toucher de la surface.
  solution: Le papier de verre est rugueux, sa surface accroche le doigt au toucher.
- id: mot-malleabilite
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la capacité d'un matériau, comme la pâte à modeler, à se déformer et à garder sa nouvelle forme
    ?
  reponse:
    acceptees:
    - malléabilité
    - malleabilite
    fautes_tolerees: 1
  indices:
    relance: Pense à la pâte à modeler que tu écrases et qui reste comme tu l'as façonnée. Quelle qualité physique est-ce
      ?
    methode: Relis le vocabulaire de la fiche, un mot désigne la capacité à se déformer en gardant la nouvelle forme.
    etape: Relis le deuxième paragraphe de la leçon. La dernière qualité citée parle de la pâte à modeler.
  pieges:
  - si:
      valeur: porosité
    relance: La porosité concerne l'absorption d'un liquide. Ici, on parle d'un matériau qu'on déforme avec les doigts.
  - si:
      valeur: rugosité
    relance: La rugosité concerne le toucher de la surface. Ici, on parle d'un matériau qui change de forme et la garde.
  solution: La malléabilité est la capacité d'un matériau à se déformer et à garder sa nouvelle forme.
- id: associer-materiaux-qualites
  type: association
  difficulte: 2
  enonce: Relie chaque matériau à la qualité physique qui le décrit le mieux.
  reponse:
    gauche:
    - id: a
      texte: Une éponge qui boit l'eau facilement
    - id: b
      texte: Une pâte à modeler qu'on écrase avec les doigts
    - id: c
      texte: Un morceau de plastique sur lequel le doigt glisse sans accrocher
    - id: d
      texte: Un morceau de bois brut, non poncé
    droite:
    - id: x
      texte: Poreux
    - id: y
      texte: Malléable
    - id: z
      texte: Lisse
    - id: w
      texte: Rugueux
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: L'éponge qui boit l'eau, absorbe-t-elle un liquide, ou se déforme-t-elle sous les doigts ?
    methode: Pour chaque matériau, demande-toi s'il absorbe un liquide, s'il se déforme, ou comment il est au toucher.
    etape: La pâte à modeler qu'on écrase et qui garde sa nouvelle forme est malléable.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque matériau en te demandant sa qualité physique principale.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, l'éponge qui boit l'eau est poreuse, puis range les autres matériaux.
  solution: L'éponge est poreuse, la pâte à modeler est malléable, le plastique sur lequel le doigt glisse est lisse, le bois
    brut est rugueux.
- id: familles-de-materiaux
  type: association
  difficulte: 2
  enonce: Relie chaque matériau à sa famille.
  reponse:
    gauche:
    - id: a
      texte: Un vieux bouchon de bouteille déjà utilisé
    - id: b
      texte: Un galet ramassé au bord de la rivière
    - id: c
      texte: Une feuille de papier neuve
    droite:
    - id: x
      texte: Matériau de récupération
    - id: y
      texte: Matériau non transformé, naturel et brut
    - id: z
      texte: Matériau issu d'une transformation
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Lequel de ces objets a déjà servi à autre chose avant ?
    methode: Pour chaque matériau, demande-toi s'il a déjà servi, s'il est pris tel qu'on le trouve dans la nature, ou s'il
      a été fabriqué.
    etape: Le vieux bouchon a déjà servi à fermer une bouteille. On le réutilise.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Le galet a-t-il été fabriqué, ou est-il pris tel qu'on le trouve ?
  - si:
      diagnostic: associations_fausses
    relance: Pars du vieux bouchon, qui a déjà servi, puis demande-toi lequel des deux autres vient directement de la nature.
  solution: Le vieux bouchon est un matériau de récupération, le galet est un matériau non transformé, naturel et brut, la
    feuille de papier neuve est un matériau issu d'une transformation.
- id: etapes-tester-materiaux
  type: ordre
  difficulte: 2
  enonce: Range ces étapes dans l'ordre pour tester les qualités physiques de plusieurs matériaux.
  reponse:
    elements:
    - id: choisir
      texte: Choisir plusieurs matériaux différents
    - id: tester
      texte: Tester leurs qualités physiques, les toucher, essayer de les plier ou d'y mettre de l'eau
    - id: nommer
      texte: Nommer ce que l'on observe
    - id: adapter
      texte: Choisir le matériau le plus adapté à ce qu'on veut réaliser
  indices:
    relance: Peux-tu nommer ce que tu observes avant même d'avoir testé les matériaux ?
    methode: Range d'abord le choix des matériaux, puis leur test, puis la description observée, puis le choix final.
    etape: La première étape est de choisir plusieurs matériaux différents.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient normalement avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape de départ, choisir les matériaux, et l'étape de fin, choisir le matériau adapté, puis
      range les deux autres entre elles.
  solution: On choisit plusieurs matériaux, puis on teste leurs qualités physiques, puis on nomme ce qu'on observe, puis on
    choisit le matériau le plus adapté.
- id: incidence-2d-3d
  type: choix
  difficulte: 2
  enonce: Un matériau très malléable comme la pâte à modeler est surtout utile pour...
  reponse:
    options:
    - id: a
      texte: Travailler en volume, en trois dimensions
    - id: b
      texte: Peindre à plat sur une feuille
    - id: c
      texte: Dessiner avec un crayon
    bonnes:
    - a
  indices:
    relance: Une matière qui se déforme et garde sa forme sert-elle plutôt à modeler des volumes, ou à peindre à plat ?
    methode: La malléabilité permet de déformer et de garder une nouvelle forme, ce qui sert surtout au modelage en volume.
    etape: Peux-tu peindre à plat avec de la pâte à modeler, ou est-ce plutôt fait pour être modelée en volume ?
  pieges:
  - si:
      contient:
      - b
    relance: Peindre à plat demande plutôt un médium liquide ou pâteux étalé sur une surface, pas une matière qu'on modèle
      en volume.
  - si:
      contient:
      - c
    relance: Dessiner au crayon utilise un outil différent, la malléabilité de la pâte sert surtout à modeler des formes en
      volume.
  solution: Un matériau malléable comme la pâte à modeler sert surtout à travailler en volume, en trois dimensions, car il
    se déforme et garde sa nouvelle forme.
- id: choisir-materiau-projet
  type: ouverte
  difficulte: 3
  enonce: Tu veux fabriquer un petit personnage en volume qui doit être solide et garder sa forme. Explique quel matériau
    tu choisirais et pourquoi, en citant au moins une qualité physique.
  criteres:
  - L'élève propose un matériau précis adapté au volume.
  - L'élève cite au moins une qualité physique du matériau choisi.
  - L'élève explique le lien entre la qualité physique et l'usage voulu.
  indices:
    relance: Pense à un matériau qui peut se modeler puis durcir, ou qui est déjà rigide.
    methode: Choisis d'abord le matériau, puis nomme sa qualité physique, puis explique pourquoi cela convient à ton projet.
    etape: Tu peux commencer ainsi, je choisirais...
  solution: Par exemple, je choisirais de la pâte à sel, car elle est malléable pour modeler la forme du personnage, puis
    elle durcit en séchant et devient rigide, ce qui lui permet de garder sa forme solidement.
