format: 2
notion: cm1-narration-visuelle
version: 3
etat: verifiee
declencheurs:
- raconter avec des dessins
- histoire en plusieurs images
- bande dessinée sans texte
- raconter une journée en images
- ordre des images
- témoigner en images
- film au ralenti
- petit film image par image
- raconter ce que j'ai vu
prerequis: []
essentiel: 'La narration visuelle, c''est raconter une histoire ou témoigner de quelque chose avec des images, sans forcément
  écrire de texte. Un récit raconte une histoire, vraie ou inventée. Un témoignage montre ce qu''on a vu ou vécu, par exemple
  une sortie scolaire.


  On peut raconter en deux dimensions, à plat, avec des dessins, des peintures ou des photos. On peut aussi raconter en trois
  dimensions, avec des objets ou une petite scène en volume, comme une boîte où l''on installe des personnages en pâte à modeler.


  Pour raconter, il faut organiser les images. On les place dans un certain ordre, avec une logique : ce qui se passe avant,
  pendant, après. On choisit aussi où placer chaque élément dans l''image, pour que le spectateur comprenne ce qui est important.


  Les images peuvent être fixes, comme un dessin, ou animées, comme un film ou un dessin animé. Avec des images animées, on
  joue sur le rythme du récit. Le ralenti montre une action plus lentement que dans la réalité. L''accélération la montre
  plus vite.


  Le séquençage, c''est découper le récit en plusieurs moments. Par exemple, pour raconter la récréation, on peut faire trois
  moments : la sonnerie, les jeux, le retour en classe. Chaque moment devient une image ou un petit morceau de film.

  '
methode:
- Choisir l'histoire ou le témoignage qu'on veut raconter en images.
- Découper cette histoire en plusieurs moments clés (début, milieu, fin).
- Choisir de raconter à plat (dessins, photos) ou en volume (petite scène, objets).
- Représenter chaque moment par une image ou un élément plastique différent.
- Organiser les images dans l'ordre pour que l'histoire se comprenne en les regardant.
- Pour des images animées, décider si un moment doit passer au ralenti ou en accéléré.
vocabulaire:
- terme: narration visuelle
  definition: raconter une histoire ou un témoignage avec des images
- terme: récit
  definition: une histoire racontée, vraie ou inventée
- terme: témoignage
  definition: ce qu'on montre ou raconte de ce qu'on a vu ou vécu soi-même
- terme: image animée
  definition: une suite d'images qui donne l'impression du mouvement, comme un film ou un dessin animé
- terme: ralenti
  definition: une façon de montrer une action plus lentement que dans la réalité
- terme: accélération
  definition: une façon de montrer une action plus vite que dans la réalité
- terme: séquençage
  definition: découper un récit en plusieurs moments, en images animées
erreurs_frequentes:
- Faire une seule image et penser qu'elle suffit à raconter toute une histoire complexe.
- Mettre les images dans le désordre, ce qui empêche de comprendre l'histoire.
- Oublier de montrer clairement un début et une fin.
- Croire qu'on ne peut raconter qu'avec des dessins à plat, alors qu'une scène en volume raconte aussi.
- Confondre le ralenti, qui montre l'action plus lentement, et l'accélération, qui la montre plus vite.
exemple:
  enonce: Tu veux raconter en images le trajet de ta maison jusqu'à l'école. Comment faire ?
  solution: Tu dessines plusieurs images qui montrent les étapes importantes du trajet (sortir de chez toi, traverser une
    rue, arriver devant l'école) et tu les places dans l'ordre où elles se passent, pour que quelqu'un comprenne l'histoire
    du trajet en les regardant les unes après les autres. Si tu en fais un petit film, tu peux passer au ralenti le moment
    où tu traverses la rue, pour montrer qu'il est important.
exercices:
- id: mot-narration
  type: texte_court
  difficulte: 1
  enonce: Quelle expression désigne le fait de raconter une histoire ou un témoignage avec des images, sans forcément écrire
    de texte ?
  reponse:
    acceptees:
    - narration visuelle
    fautes_tolerees: 2
  indices:
    relance: 'Cette expression contient deux mots : un qui parle de raconter, un autre qui parle des images.'
    methode: Relis le vocabulaire de ta leçon. Une expression désigne le fait de raconter avec des images.
    etape: Relis la toute première phrase de la leçon.
  pieges:
  - si:
      valeur: séquençage
    relance: Le séquençage découpe un récit en plusieurs moments. On cherche plutôt l'expression générale pour raconter avec
      des images.
  - si:
      valeur: bande dessinée
    relance: La bande dessinée est un exemple, mais on cherche l'expression plus générale de ta leçon pour raconter avec des
      images.
  solution: 'L''expression est « narration visuelle » : raconter une histoire ou un témoignage avec des images.'
- id: trois-dessins-trajet
  type: choix
  difficulte: 1
  enonce: Léo dessine 3 images pour raconter son trajet jusqu'à l'école, mais il les colle sur sa feuille dans le désordre
    (arrivée à l'école, puis sortie de chez lui, puis traversée de la rue). Que va-t-il se passer ?
  reponse:
    options:
    - id: a
      texte: L'histoire du trajet sera facile à comprendre malgré le désordre
    - id: b
      texte: L'histoire du trajet sera difficile à comprendre à cause du désordre
    - id: c
      texte: Cela n'a aucune importance, l'ordre des images ne compte pas
    bonnes:
    - b
  indices:
    relance: Si l'arrivée est montrée avant le départ, peut-on comprendre facilement ce qui se passe avant et après ?
    methode: Repense à l'importance de l'ordre logique (avant, pendant, après) pour comprendre une histoire en images.
    etape: Montrer l'arrivée avant le départ brouille la logique du récit visuel.
  pieges:
  - si:
      contient:
      - a
    relance: Si l'ordre est brouillé (l'arrivée avant le départ), est-ce vraiment facile de comprendre l'histoire du trajet
      ?
  - si:
      contient:
      - c
    relance: L'ordre des images compte beaucoup dans la narration visuelle. Que se passe-t-il si l'ordre est brouillé ?
  solution: 'L''histoire sera difficile à comprendre : sans un ordre logique (avant, pendant, après), le spectateur ne peut
    pas suivre le déroulement du trajet.'
- id: mot-sequencage
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne le fait de découper un récit en plusieurs moments, notamment en images animées ?
  reponse:
    acceptees:
    - séquençage
    fautes_tolerees: 1
  indices:
    relance: Pense à un film découpé en plusieurs petits morceaux, chacun montrant un moment différent de l'histoire.
    methode: Ce mot vient du mot « séquence », qui désigne un moment ou une partie d'un récit.
    etape: Relis le dernier paragraphe de la leçon, celui qui découpe la récréation en trois moments.
  pieges:
  - si:
      valeur: narration
    relance: La narration désigne le fait de raconter en général. On cherche le mot précis pour découper un récit en plusieurs
      moments.
  - si:
      valeur: montage
    relance: Le montage assemble des images. On cherche plutôt le mot qui parle de découper un récit en plusieurs moments.
  solution: 'Le mot est « séquençage » : découper un récit en plusieurs moments, notamment en images animées.'
- id: vocabulaire-associations
  type: association
  difficulte: 2
  enonce: Relie chaque mot ou expression à sa définition.
  reponse:
    gauche:
    - id: a
      texte: narration visuelle
    - id: b
      texte: séquençage
    - id: c
      texte: ordre logique
    droite:
    - id: x
      texte: raconter une histoire ou un témoignage avec des images
    - id: y
      texte: découper un récit en plusieurs moments, en images animées
    - id: z
      texte: organisation des images selon ce qui se passe avant, pendant, après
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Une expression parle de raconter en général, une autre de découper en moments, la dernière de l'organisation
      avant/pendant/après.
    methode: Commence par le mot que tu connais le mieux, puis élimine sa définition pour les deux autres.
    etape: « Narration visuelle » va avec la définition qui parle de raconter une histoire avec des images.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque définition en te demandant à quel mot elle correspond le mieux.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un et demande-toi ce qu'il signifie précisément dans ta leçon.
  solution: Narration visuelle = raconter avec des images. Séquençage = découper un récit en plusieurs moments. Ordre logique
    = organisation avant, pendant, après.
- id: but-ralenti
  type: choix
  difficulte: 2
  enonce: Dans un petit film fait en classe, on voit un ballon qui tombe dans un but beaucoup plus lentement que dans la réalité.
    Quel procédé a-t-on utilisé ?
  reponse:
    options:
    - id: a
      texte: L'accélération
    - id: b
      texte: Le ralenti
    - id: c
      texte: Le collage
    bonnes:
    - b
  indices:
    relance: Le ballon va-t-il plus vite ou moins vite que dans la vraie vie ?
    methode: Un procédé des images animées montre l'action plus vite, un autre la montre moins vite. Lequel correspond ici
      ?
    etape: Le ballon tombe beaucoup moins vite que dans la réalité.
  pieges:
  - si:
      contient:
      - a
    relance: L'accélération montre l'action plus vite que dans la réalité. Ici, le ballon va-t-il plus vite ?
  - si:
      contient:
      - c
    relance: Le collage sert à transformer une image fixe. Ici, on parle de la vitesse d'une action dans un film.
  solution: C'est le ralenti, il montre l'action plus lentement que dans la réalité, ce qui permet de mieux voir ce moment
    important du récit.
- id: recit-ou-temoignage
  type: association
  difficulte: 2
  enonce: Relie chaque production à ce qu'elle fait, raconter une histoire inventée ou témoigner de quelque chose de vécu.
  reponse:
    gauche:
    - id: a
      texte: Des dessins de la sortie au musée que ta classe a faite hier
    - id: b
      texte: Des dessins d'un dragon qui part sur la Lune
    - id: c
      texte: Des photos de ta propre fête d'anniversaire
    droite:
    - id: x
      texte: Témoignage de quelque chose de vécu
    - id: y
      texte: Récit d'une histoire inventée
    paires:
      a: x
      b: y
      c: x
  indices:
    relance: Parmi ces productions, laquelle montre quelque chose qui n'a pas pu arriver en vrai ?
    methode: Pour chaque production, demande-toi si c'est arrivé pour de vrai à la personne qui la fait, ou si c'est imaginé.
    etape: Une sortie au musée faite hier par ta classe, c'est arrivé pour de vrai.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pour chaque production, demande-toi si elle est vécue ou imaginée.
  - si:
      diagnostic: associations_fausses
    relance: Pars de la production la plus facile, le dragon sur la Lune, qui ne peut pas être vécu, puis range les autres.
  solution: La sortie au musée et l'anniversaire sont des témoignages de choses vécues. Le dragon sur la Lune est un récit
    inventé.
- id: etapes-narration
  type: ordre
  difficulte: 3
  enonce: Range ces étapes dans l'ordre pour construire une narration visuelle.
  reponse:
    elements:
    - id: choisir
      texte: Choisir l'histoire ou le témoignage à raconter
    - id: decouper
      texte: Découper l'histoire en plusieurs moments clés
    - id: representer
      texte: Représenter chaque moment par une image différente
    - id: organiser
      texte: Organiser les images dans l'ordre logique
  indices:
    relance: Que dois-tu choisir en tout premier, avant même de découper l'histoire en moments ?
    methode: Choisis d'abord l'histoire, puis découpe-la en moments, puis dessine chaque moment, puis organise l'ordre.
    etape: La première étape est de choisir l'histoire ou le témoignage à raconter.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qui se fait en tout premier (choisir l'histoire) et ce qui se fait en tout dernier (organiser
      l'ordre).
  solution: On choisit d'abord l'histoire à raconter, puis on la découpe en plusieurs moments clés, puis on représente chaque
    moment par une image, puis on organise ces images dans l'ordre logique.
- id: expliquer-narration
  type: ouverte
  difficulte: 2
  enonce: Tu racontes en 3 dessins ta journée au parc (arrivée, jeu sur le toboggan, retour à la maison). En deux ou trois
    phrases, explique comment tu dois organiser ces 3 dessins pour que l'histoire se comprenne.
  criteres:
  - L'élève identifie les trois moments (arrivée, jeu, retour).
  - L'élève dit qu'il faut les organiser dans l'ordre chronologique (avant, pendant, après).
  - L'élève relie cet ordre au fait que l'histoire devient compréhensible pour un spectateur.
  indices:
    relance: Dans quel ordre se passent réellement ces trois moments de ta journée ?
    methode: Explique d'abord quels sont les trois moments, puis dans quel ordre les placer, puis pourquoi c'est important.
    etape: 'Tu peux commencer ainsi : « Je place mes trois dessins dans l''ordre... ».'
  solution: 'Je place mes trois dessins dans l''ordre chronologique : l''arrivée au parc, puis le jeu sur le toboggan, puis
    le retour à la maison. Cet ordre logique (avant, pendant, après) permet à quelqu''un qui regarde mes dessins de comprendre
    l''histoire de ma journée.'
- id: nblm-selon-la-fiche-d-arts-plastiques-de-cm1-1
  type: choix
  difficulte: 2
  enonce: Selon la fiche d'arts plastiques de CM1, que signifie l'expression « narration visuelle » ?
  reponse:
    options:
    - id: o1
      texte: Raconter une histoire ou témoigner d'un événement avec des images, sans forcément écrire de texte.
    - id: o2
      texte: Écrire un roman très long sans jamais faire le moindre dessin.
    - id: o3
      texte: Peindre un tableau abstrait sans chercher à raconter un récit ni témoigner.
    - id: o4
      texte: Recopier une photographie le plus exactement possible pour faire une imitation.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux moyens visuels utilisés pour faire comprendre une histoire sans obligatoirement utiliser des mots
      écrits.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la narration visuelle utilise des images et non uniquement du texte rédigé.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la narration visuelle vise précisément à transmettre un récit ou un témoignage en images.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : recopier une photo concerne la ressemblance, pas la création d''un récit.'
  solution: 'Raconter une histoire ou témoigner d''un événement avec des images, sans forcément écrire de texte. C''est la
    définition exacte de la narration visuelle : utiliser des images (fixes ou animées) pour raconter un récit ou témoigner.'
- id: nblm-pour-raconter-une-histoire-avec-une-suit-2
  type: choix
  difficulte: 2
  enonce: Pour raconter une histoire avec une suite d'images fixes, dans quel ordre faut-il les organiser ?
  reponse:
    options:
    - id: o1
      texte: Dans un ordre chronologique et logique (ce qui se passe avant, pendant et après).
    - id: o2
      texte: Dans un ordre totalement mélangé au hasard.
    - id: o3
      texte: En conservant une seule image unique pour résumer toute une histoire complexe.
    - id: o4
      texte: En supprimant le début et la fin pour ne garder qu'un détail flou.
    bonnes:
    - o1
  indices:
    relance: Pense au déroulement du temps et à la succession des étapes dans un récit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : placer les images dans le désordre empêche le spectateur de comprendre l''histoire.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : une seule image ne suffit pas à raconter une suite complexe d''événements.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : il faut obligatoirement montrer clairement un début et une fin.'
  solution: 'Dans un ordre chronologique et logique (ce qui se passe avant, pendant et après). C''est la règle essentielle
    : organiser les images selon la logique du temps (début, milieu, fin) permet au lecteur de comprendre le récit.'
- id: nblm-si-tu-veux-raconter-ton-trajet-jusqu-a-l-3
  type: choix
  difficulte: 2
  enonce: Si tu veux raconter ton trajet jusqu'à l'école ou raconter une journée en images (comme une bande dessinée sans
    texte), quelle méthode dois-tu suivre ?
  reponse:
    options:
    - id: o1
      texte: Dessiner plusieurs images représentant les étapes clés dans l'ordre (partir de chez soi, traverser la rue, arriver
        à l'école).
    - id: o2
      texte: Dessiner une seule image globale qui mélange tous les moments de la journée en même temps.
    - id: o3
      texte: Placer l'image de l'arrivée à l'école au début, avant l'image de la sortie de la maison.
    - id: o4
      texte: Remplir plusieurs pages de texte rédigé sans faire aucun dessin.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux étapes clés qu'il faut montrer les unes après les autres pour qu'un observateur comprenne le parcours.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : une seule image ne suffit pas à retracer la succession des moments d''un trajet.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : ne pas respecter l''ordre chronologique rend le récit incompréhensible.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : raconter en images implique de créer des représentations visuelles et non un long texte écrit.'
  solution: 'Dessiner plusieurs images représentant les étapes clés dans l''ordre (partir de chez soi, traverser la rue, arriver
    à l''école). C''est la méthode recommandée : représenter les étapes clés successives permet au lecteur de comprendre le
    trajet.'
- id: nblm-sous-quelles-formes-plastiques-peut-on-r-4
  type: choix
  difficulte: 2
  enonce: Sous quelles formes plastiques peut-on réaliser une narration visuelle d'après les programmes officiels de CM1 ?
  reponse:
    options:
    - id: o1
      texte: Aussi bien en deux dimensions (dessin, peinture) qu'en trois dimensions (objets, petites scènes).
    - id: o2
      texte: Uniquement avec de la peinture sur feuille de papier.
    - id: o3
      texte: Uniquement avec des sculptures en métal.
    - id: o4
      texte: Seulement avec des enregistrements audio sans aucun visuel.
    bonnes:
    - o1
  indices:
    relance: Pense aux différentes possibilités de création en arts plastiques (à plat ou en volume).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la narration visuelle ne se limite pas aux surfaces planes, elle peut aussi utiliser le volume
      ou les images animées.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : les formes bidimensionnelles comme le dessin ou la peinture sont très courantes pour raconter
      en images.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la narration visuelle nécessite par définition des supports visuels (images ou volumes).'
  solution: Aussi bien en deux dimensions (dessin, peinture) qu'en trois dimensions (objets, petites scènes). Les compositions
    plastiques pour raconter peuvent être réalisées en 2D (dessin, peinture) ou en 3D (objets, scènes).
- id: nblm-lorsqu-on-utilise-des-images-animees-pou-5
  type: choix
  difficulte: 2
  enonce: Lorsqu'on utilise des images animées pour raconter une histoire, comment peut-on modifier le rythme du récit ?
  reponse:
    options:
    - id: o1
      texte: En ralentissant, en accélérant ou en découpant l'histoire en plusieurs moments (séquençage).
    - id: o2
      texte: En effaçant toutes les images pour laisser un écran noir.
    - id: o3
      texte: En refusant de découper l'histoire en moments clés.
    - id: o4
      texte: En projetant le film à l'envers de la fin vers le début.
    bonnes:
    - o1
  indices:
    relance: Pense aux variations de vitesse et au découpage des scènes dans un film.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : supprimer les images fait disparaître la narration visuelle.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le découpage en moments clés est nécessaire pour structurer le récit visuel.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la logique chronologique doit rester compréhensible pour le spectateur.'
  solution: En ralentissant, en accélérant ou en découpant l'histoire en plusieurs moments (séquençage). Avec l'image animée,
    jouer sur la vitesse (ralenti, accélération) et le séquençage permet de donner du rythme à la narration.
