      texte: Faire une seule image et penser qu'elle suffit à raconter toute une histoire complexe.
    - id: o3
      texte: Organiser les images en montrant clairement un début, un milieu et une fin.
    - id: o4
      texte: Découper le récit en plusieurs moments clés pour former une suite logique.
    bonnes:
    - o1
    - o2
