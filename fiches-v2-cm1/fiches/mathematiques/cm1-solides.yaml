format: 2
notion: cm1-solides
version: 2
etat: verifiee
declencheurs:
- faces d'un solide
- plier un patron
- assemblage de carrés
- sommet d'une pyramide
- faces latérales
- combien de faces
- reconnaître un cube
- forme d'une boîte
- objet qui roule
prerequis: []
essentiel: 'Un solide, c''est un objet en trois dimensions, qu''on peut tenir dans la main ou poser sur une table. Il faut
  savoir nommer : le cube, le pavé, la pyramide, le prisme droit, la boule, le cylindre et le cône.


  Certains solides ont des surfaces courbes et peuvent rouler : la boule (comme un ballon), le cylindre (comme une boîte de
  conserve) et le cône (comme un cornet de glace).


  D''autres solides n''ont que des faces planes. Une face est une surface plate. Deux faces se rejoignent le long d''une arête.
  Plusieurs arêtes se rejoignent en un sommet.


  Le pavé ressemble à une boîte à chaussures : il a 6 faces rectangulaires et 8 sommets. Le cube est un pavé particulier,
  comme un dé : ses 6 faces sont des carrés identiques.


  Une pyramide a une base, qui est un polygone, et des faces triangulaires qui se rejoignent en un sommet commun. Si la base
  est un carré, c''est une pyramide à base carrée.


  Un prisme droit a deux bases identiques et superposables, posées l''une en face de l''autre. Ses faces latérales, qui relient
  les deux bases, sont des rectangles.


  Un patron de cube est un assemblage de six carrés qui, une fois découpé et plié, forme un cube fermé. Attention : tous les
  assemblages de six carrés ne sont pas des patrons de cube. On vérifie en pliant.


  On sait construire un cube, un pavé, une pyramide ou un prisme droit à partir d''un modèle, d''un dessin ou d''une description,
  par exemple avec un patron ou avec des pailles et de la pâte à modeler.

  '
methode:
- Regarder si le solide a des surfaces courbes (il peut rouler) ou seulement des faces planes.
- Compter les faces et observer leur forme (carrés, rectangles, triangles...).
- Chercher la ou les bases (une seule pour la pyramide, deux pour le prisme droit).
- 'Utiliser le vocabulaire précis pour décrire : face, arête, sommet, base, face latérale.'
- Pour reconnaître un patron de cube, vérifier qu'il forme bien un cube fermé une fois plié (par manipulation si possible).
vocabulaire:
- terme: face
  definition: surface plate d'un solide.
- terme: arête
  definition: segment où se rejoignent deux faces d'un solide.
- terme: sommet
  definition: point où se rejoignent plusieurs arêtes d'un solide.
- terme: patron
  definition: figure plane qui, une fois pliée, forme un solide.
- terme: base (d'une pyramide ou d'un prisme)
  definition: la face qui n'est pas un triangle latéral (pyramide) ou l'une des deux faces superposables (prisme).
- terme: face latérale
  definition: face qui relie les deux bases d'un prisme droit ou qui monte vers le sommet d'une pyramide.
erreurs_frequentes:
- Confondre pyramide et prisme droit (les faces latérales ne sont pas les mêmes).
- Croire qu'un assemblage de six carrés est toujours un patron de cube.
- Se tromper sur le nombre de faces d'un pavé (il en a six).
- Confondre face, arête et sommet quand on décrit un solide.
- Appeler « carré » un cube ou « rectangle » un pavé, alors que ce sont des figures planes.
exemple:
  enonce: Un solide a six faces carrées identiques. Quel est ce solide ?
  solution: 'C''est un cube : un pavé dont les six faces sont des carrés identiques, comme un dé à jouer.'
exercices:
- id: nombre-faces-pave
  type: nombre
  difficulte: 1
  enonce: Combien de faces a un pavé droit ?
  reponse:
    valeur: 6
    forme: entier
  indices:
    relance: 'Imagine une boîte rectangulaire : compte le dessus, le dessous, et les côtés.'
    methode: Un pavé a une face en haut, une en bas, et quatre faces sur les côtés.
    etape: 'Additionne : 1 (dessus) + 1 (dessous) + 4 (côtés).'
  pieges:
  - si:
      valeur: 4
    relance: Tu as compté seulement les faces latérales, sans le dessus et le dessous.
  - si:
      valeur: 8
    relance: Un pavé a des sommets, pas des faces, au nombre de 8. Recompte les faces.
  solution: 'Un pavé droit a 6 faces : le dessus, le dessous, et les quatre faces latérales.'
- id: solide-qui-roule-partout
  type: choix
  difficulte: 1
  enonce: Un solide n'a aucune face plate et roule dans tous les sens, comme un ballon. Quel est ce solide ?
  reponse:
    options:
    - id: a
      texte: Une boule
    - id: b
      texte: Un cylindre
    - id: c
      texte: Un cône
    bonnes:
    - a
  indices:
    relance: Le solide n'a aucune face plate. Lesquels de ces solides ont au moins une face plate ?
    methode: Pense à une boîte de conserve et à un cornet de glace. Ont-ils une partie plate ?
    etape: Le cylindre a deux disques plats et le cône en a un. Il reste un seul solide sans partie plate.
  pieges:
  - si:
      contient:
      - b
    relance: Un cylindre a deux faces plates en forme de disque ; il ne roule que dans un sens.
  - si:
      contient:
      - c
    relance: Un cône a une face plate en forme de disque et une pointe ; il ne roule pas dans tous les sens.
  solution: 'C''est une boule : elle n''a aucune face plate et peut rouler dans tous les sens, comme un ballon.'
- id: nom-solide-triangles
  type: choix
  difficulte: 1
  enonce: Un solide a des faces triangulaires qui se rejoignent en un même point, et une face qui est un carré. Quel est ce
    solide ?
  reponse:
    options:
    - id: a
      texte: Une pyramide à base carrée
    - id: b
      texte: Un prisme droit
    - id: c
      texte: Un cube
    bonnes:
    - a
  indices:
    relance: Le point commun aux triangles est le sommet du solide.
    methode: Cherche le solide dont les faces latérales sont des triangles qui se rejoignent en un sommet unique.
    etape: Un prisme a des faces latérales rectangulaires, pas triangulaires. Un cube n'a que des carrés.
  pieges:
  - si:
      contient:
      - b
    relance: Un prisme droit a des faces latérales qui sont des rectangles, pas des triangles.
  - si:
      contient:
      - c
    relance: Un cube n'a que des faces carrées, pas de faces triangulaires.
  solution: 'C''est une pyramide à base carrée : ses faces triangulaires se rejoignent au sommet, et sa base est un carré.'
- id: sommets-d-un-cube
  type: nombre
  difficulte: 2
  enonce: Un dé à jouer a la forme d'un cube. Combien a-t-il de sommets (les « coins ») ?
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Un sommet est un coin, là où plusieurs arêtes se rejoignent.
    methode: Compte les coins de la face du dessus, puis ceux de la face du dessous.
    etape: La face du dessus est un carré qui a 4 coins. Combien de coins a la face du dessous ?
  pieges:
  - si:
      valeur: 6
    relance: Tu as compté les faces. Ici, on cherche les coins, c'est-à-dire les sommets.
  - si:
      valeur: 4
    relance: Tu as compté seulement les coins d'une face. N'oublie pas ceux de la face opposée.
  - si:
      valeur: 12
    relance: Tu as compté les arêtes, les segments entre deux faces. On cherche les coins.
  solution: 'La face du dessus a 4 sommets et la face du dessous en a 4 aussi : 4 + 4 = 8 sommets.'
- id: forme-faces-laterales-prisme
  type: texte_court
  difficulte: 2
  enonce: Un prisme droit a deux bases pentagonales. Quelle est la forme de ses faces latérales ?
  reponse:
    acceptees:
    - rectangles
    - rectangle
    - des rectangles
    fautes_tolerees: 2
  indices:
    relance: Les faces latérales d'un prisme droit ont toujours la même forme, quelle que soit la forme de la base.
    methode: Pense à un prisme dont tu connais bien les faces latérales, par exemple un simple pavé.
    etape: 'Les faces latérales d''un prisme droit relient les deux bases : ce sont des quadrilatères à angles droits.'
  pieges:
  - si:
      valeur: triangles
    relance: Les triangles se trouvent dans les pyramides, pas dans les faces latérales d'un prisme droit.
  - si:
      valeur: pentagones
    relance: Les pentagones sont la forme des deux bases, pas des faces latérales.
  solution: Ses faces latérales sont des rectangles, comme pour tout prisme droit.
- id: construire-patron-cube
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour vérifier qu'un assemblage de six carrés est bien un patron de cube.
  reponse:
    elements:
    - id: verifier-carres
      texte: Vérifier que les six figures sont bien des carrés de même taille
    - id: decouper
      texte: Découper l'assemblage sur son contour
    - id: plier
      texte: Plier l'assemblage le long des traits intérieurs
    - id: constater
      texte: Constater si les carrés forment un cube fermé, sans trou ni superposition
  indices:
    relance: Peux-tu plier l'assemblage avant même de savoir s'il est fait de carrés ?
    methode: Il faut d'abord vérifier les figures, puis les manipuler, puis conclure.
    etape: La toute première étape consiste à vérifier que les six figures sont bien des carrés identiques.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Doit-on découper avant ou après avoir vérifié les carrés ?
  - si:
      diagnostic: ordre_faux
    relance: On ne peut constater le résultat qu'après avoir réellement plié l'assemblage.
  solution: On vérifie d'abord que ce sont bien six carrés identiques, on découpe, on plie le long des traits, puis on constate
    si un cube fermé se forme.
- id: solide-et-face-base
  type: association
  difficulte: 2
  enonce: Relie chaque solide à la forme de sa base ou de ses faces principales.
  reponse:
    gauche:
    - id: a
      texte: Cube
    - id: b
      texte: Pyramide à base carrée
    - id: c
      texte: Prisme droit à base triangulaire
    droite:
    - id: x
      texte: Six faces carrées
    - id: y
      texte: Une base carrée et des faces triangulaires
    - id: z
      texte: Deux bases triangulaires et des faces latérales rectangulaires
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Le cube est le seul solide ici où toutes les faces sont identiques.
    methode: Distingue la pyramide (un seul sommet commun aux faces triangulaires) du prisme (deux bases identiques).
    etape: Le prisme à base triangulaire a deux triangles (les bases) et des rectangles (les faces latérales).
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien la pyramide et le prisme, qui ont tous deux des triangles.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque solide et compte ses faces une par une.
  solution: Cube → six faces carrées ; pyramide à base carrée → une base carrée et des faces triangulaires ; prisme droit
    à base triangulaire → deux bases triangulaires et des faces latérales rectangulaires.
- id: expliquer-difference-pyramide-prisme
  type: ouverte
  difficulte: 3
  enonce: Explique à un camarade la différence entre une pyramide à base carrée et un prisme droit à base carrée. Tu peux
    t'aider d'objets de la maison.
  criteres:
  - L'élève indique que la pyramide a une seule base et des faces latérales triangulaires qui se rejoignent en un seul sommet.
  - L'élève indique que le prisme a deux bases carrées superposables reliées par des faces latérales rectangulaires.
  - L'élève utilise correctement le vocabulaire (face, base, sommet, face latérale).
  indices:
    relance: 'Combien de bases a chaque solide : une ou deux ?'
    methode: 'Compare la forme des faces latérales : triangles pour l''un, rectangles pour l''autre.'
    etape: La pyramide n'a qu'une base ; le prisme en a deux, identiques et superposables.
  solution: La pyramide à base carrée a une seule base (le carré) et des faces triangulaires qui se rejoignent en un sommet.
    Le prisme droit à base carrée a deux bases carrées superposables, reliées par des faces latérales rectangulaires.
