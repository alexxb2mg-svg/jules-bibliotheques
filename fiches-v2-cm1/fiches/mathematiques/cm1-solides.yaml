format: 2
notion: cm1-solides
version: 3
etat: verifiee
declencheurs:
- faces d'un solide
- plier un patron
- assemblage de carrés
- sommet d'une pyramide
- faces latérales
- combien de faces
- reconnaître un cube
- forme d'une boîte
- objet qui roule
prerequis: []
essentiel: 'Un solide, c''est un objet en trois dimensions, qu''on peut tenir dans la main ou poser sur une table. Il faut
  savoir nommer : le cube, le pavé, la pyramide, le prisme droit, la boule, le cylindre et le cône.


  Certains solides ont des surfaces courbes et peuvent rouler : la boule (comme un ballon), le cylindre (comme une boîte de
  conserve) et le cône (comme un cornet de glace).


  D''autres solides n''ont que des faces planes. Une face est une surface plate. Deux faces se rejoignent le long d''une arête.
  Plusieurs arêtes se rejoignent en un sommet.


  Le pavé ressemble à une boîte à chaussures : il a 6 faces rectangulaires et 8 sommets. Le cube est un pavé particulier,
  comme un dé : ses 6 faces sont des carrés identiques.


  Une pyramide a une base, qui est un polygone, et des faces triangulaires qui se rejoignent en un sommet commun. Si la base
  est un carré, c''est une pyramide à base carrée.


  Un prisme droit a deux bases identiques et superposables, posées l''une en face de l''autre. Ses faces latérales, qui relient
  les deux bases, sont des rectangles.


  Un patron de cube est un assemblage de six carrés qui, une fois découpé et plié, forme un cube fermé. Attention : tous les
  assemblages de six carrés ne sont pas des patrons de cube. On vérifie en pliant.


  On sait construire un cube, un pavé, une pyramide ou un prisme droit à partir d''un modèle, d''un dessin ou d''une description,
  par exemple avec un patron ou avec des pailles et de la pâte à modeler.

  '
methode:
- Regarder si le solide a des surfaces courbes (il peut rouler) ou seulement des faces planes.
- Compter les faces et observer leur forme (carrés, rectangles, triangles...).
- Chercher la ou les bases (une seule pour la pyramide, deux pour le prisme droit).
- 'Utiliser le vocabulaire précis pour décrire : face, arête, sommet, base, face latérale.'
- Pour reconnaître un patron de cube, vérifier qu'il forme bien un cube fermé une fois plié (par manipulation si possible).
vocabulaire:
- terme: face
  definition: surface plate d'un solide.
- terme: arête
  definition: segment où se rejoignent deux faces d'un solide.
- terme: sommet
  definition: point où se rejoignent plusieurs arêtes d'un solide.
- terme: patron
  definition: figure plane qui, une fois pliée, forme un solide.
- terme: base (d'une pyramide ou d'un prisme)
  definition: la face qui n'est pas un triangle latéral (pyramide) ou l'une des deux faces superposables (prisme).
- terme: face latérale
  definition: face qui relie les deux bases d'un prisme droit ou qui monte vers le sommet d'une pyramide.
erreurs_frequentes:
- Confondre pyramide et prisme droit (les faces latérales ne sont pas les mêmes).
- Croire qu'un assemblage de six carrés est toujours un patron de cube.
- Se tromper sur le nombre de faces d'un pavé (il en a six).
- Confondre face, arête et sommet quand on décrit un solide.
- Appeler « carré » un cube ou « rectangle » un pavé, alors que ce sont des figures planes.
exemple:
  enonce: Un solide a six faces carrées identiques. Quel est ce solide ?
  solution: 'C''est un cube : un pavé dont les six faces sont des carrés identiques, comme un dé à jouer.'
exercices:
- id: nombre-faces-pave
  type: nombre
  difficulte: 1
  enonce: Combien de faces a un pavé droit ?
  reponse:
    valeur: 6
    forme: entier
  indices:
    relance: 'Imagine une boîte rectangulaire : compte le dessus, le dessous, et les côtés.'
    methode: Un pavé a une face en haut, une en bas, et quatre faces sur les côtés.
    etape: 'Additionne : 1 (dessus) + 1 (dessous) + 4 (côtés).'
  pieges:
  - si:
      valeur: 4
    relance: Tu as compté seulement les faces latérales, sans le dessus et le dessous.
  - si:
      valeur: 8
    relance: 8, c'est le nombre de sommets (les coins) du pavé. Recompte les faces.
  solution: 'Un pavé droit a 6 faces : le dessus, le dessous, et les quatre faces latérales.'
- id: solide-qui-roule-partout
  type: choix
  difficulte: 1
  enonce: Un solide n'a aucune face plate et roule dans tous les sens, comme un ballon. Quel est ce solide ?
  reponse:
    options:
    - id: a
      texte: Une boule
    - id: b
      texte: Un cylindre
    - id: c
      texte: Un cône
    bonnes:
    - a
  indices:
    relance: Le solide n'a aucune face plate. Lesquels de ces solides ont au moins une face plate ?
    methode: Pense à une boîte de conserve et à un cornet de glace. Ont-ils une partie plate ?
    etape: Le cylindre a deux disques plats et le cône en a un. Il reste un seul solide sans partie plate.
  pieges:
  - si:
      contient:
      - b
    relance: Un cylindre a deux faces plates en forme de disque ; il ne roule que dans un sens.
  - si:
      contient:
      - c
    relance: Un cône a une face plate en forme de disque et une pointe ; il ne roule pas dans tous les sens.
  solution: 'C''est une boule : elle n''a aucune face plate et peut rouler dans tous les sens, comme un ballon.'
- id: nom-solide-triangles
  type: choix
  difficulte: 1
  enonce: Un solide a des faces triangulaires qui se rejoignent en un même point, et une face qui est un carré. Quel est ce
    solide ?
  reponse:
    options:
    - id: a
      texte: Une pyramide à base carrée
    - id: b
      texte: Un prisme droit
    - id: c
      texte: Un cube
    bonnes:
    - a
  indices:
    relance: Le point commun aux triangles est le sommet du solide.
    methode: Cherche le solide dont les faces latérales sont des triangles qui se rejoignent en un sommet unique.
    etape: Un prisme a des faces latérales rectangulaires, pas triangulaires. Un cube n'a que des carrés.
  pieges:
  - si:
      contient:
      - b
    relance: Un prisme droit a des faces latérales qui sont des rectangles, pas des triangles.
  - si:
      contient:
      - c
    relance: Un cube n'a que des faces carrées, pas de faces triangulaires.
  solution: 'C''est une pyramide à base carrée : ses faces triangulaires se rejoignent au sommet, et sa base est un carré.'
- id: sommets-d-un-cube
  type: nombre
  difficulte: 2
  enonce: Un dé à jouer a la forme d'un cube. Combien a-t-il de sommets (les « coins ») ?
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Un sommet est un coin, là où plusieurs arêtes se rejoignent.
    methode: Compte les coins de la face du dessus, puis ceux de la face du dessous.
    etape: La face du dessus est un carré qui a 4 coins. Combien de coins a la face du dessous ?
  pieges:
  - si:
      valeur: 6
    relance: Tu as compté les faces. Ici, on cherche les coins, c'est-à-dire les sommets.
  - si:
      valeur: 4
    relance: Tu as compté seulement les coins d'une face. N'oublie pas ceux de la face opposée.
  - si:
      valeur: 12
    relance: Tu as compté les arêtes, les segments entre deux faces. On cherche les coins.
  solution: 'La face du dessus a 4 sommets et la face du dessous en a 4 aussi : 4 + 4 = 8 sommets.'
- id: forme-faces-laterales-prisme
  type: texte_court
  difficulte: 2
  enonce: Un prisme droit a deux bases à cinq côtés (des pentagones). Quelle est la forme de ses faces latérales ?
  reponse:
    acceptees:
    - rectangles
    - rectangle
    - des rectangles
    fautes_tolerees: 2
  indices:
    relance: Les faces latérales d'un prisme droit ont toujours la même forme, quelle que soit la forme de la base.
    methode: Pense à un prisme dont tu connais bien les faces latérales, par exemple un simple pavé.
    etape: 'Les faces latérales d''un prisme droit relient les deux bases : ce sont des quadrilatères à angles droits.'
  pieges:
  - si:
      valeur: triangles
    relance: Les triangles se trouvent dans les pyramides, pas dans les faces latérales d'un prisme droit.
  - si:
      valeur: pentagones
    relance: Les pentagones sont la forme des deux bases, pas des faces latérales.
  solution: Ses faces latérales sont des rectangles, comme pour tout prisme droit.
- id: construire-patron-cube
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour fabriquer un assemblage de six carrés et tester si c'est un patron de cube.
  reponse:
    elements:
    - id: verifier-carres
      texte: Tracer sur une feuille l'assemblage de six carrés de même taille
    - id: decouper
      texte: Découper l'assemblage sur son contour
    - id: plier
      texte: Plier l'assemblage le long des traits intérieurs
    - id: constater
      texte: Constater si les carrés forment un cube fermé, sans trou ni superposition
  indices:
    relance: Peux-tu découper ou plier un assemblage qui n'est pas encore dessiné ?
    methode: Il faut d'abord dessiner, puis manipuler, puis conclure.
    etape: La toute première étape se fait avec la règle et le crayon, sur la feuille.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Peut-on plier un assemblage qui est encore attaché à la feuille ?
  - si:
      diagnostic: ordre_faux
    relance: On ne peut constater le résultat qu'après avoir réellement plié l'assemblage.
  solution: On trace d'abord les six carrés identiques, on découpe, on plie le long des traits, puis on regarde si un cube
    fermé se forme.
- id: solide-et-face-base
  type: association
  difficulte: 2
  enonce: Relie chaque solide à la forme de sa base ou de ses faces principales.
  reponse:
    gauche:
    - id: a
      texte: Cube
    - id: b
      texte: Pyramide à base carrée
    - id: c
      texte: Prisme droit à base triangulaire
    droite:
    - id: x
      texte: Six faces carrées
    - id: y
      texte: Une base carrée et des faces triangulaires
    - id: z
      texte: Deux bases triangulaires et des faces latérales rectangulaires
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Le cube est le seul solide ici où toutes les faces sont identiques.
    methode: Distingue la pyramide (un seul sommet commun aux faces triangulaires) du prisme (deux bases identiques).
    etape: Le prisme à base triangulaire a deux triangles (les bases) et des rectangles (les faces latérales).
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien la pyramide et le prisme, qui ont tous deux des triangles.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque solide et compte ses faces une par une.
  solution: Cube → six faces carrées ; pyramide à base carrée → une base carrée et des faces triangulaires ; prisme droit
    à base triangulaire → deux bases triangulaires et des faces latérales rectangulaires.
- id: expliquer-difference-pyramide-prisme
  type: ouverte
  difficulte: 3
  enonce: Explique à un camarade la différence entre une pyramide à base carrée et un prisme droit à base carrée. Tu peux
    t'aider d'objets de la maison.
  criteres:
  - L'élève indique que la pyramide a une seule base et des faces latérales triangulaires qui se rejoignent en un seul sommet.
  - L'élève indique que le prisme a deux bases carrées superposables reliées par des faces latérales rectangulaires.
  - L'élève utilise correctement le vocabulaire (face, base, sommet, face latérale).
  indices:
    relance: 'Combien de bases a chaque solide : une ou deux ?'
    methode: 'Compare la forme des faces latérales : triangles pour l''un, rectangles pour l''autre.'
    etape: La pyramide n'a qu'une base ; le prisme en a deux, identiques et superposables.
  solution: La pyramide à base carrée a une seule base (le carré) et des faces triangulaires qui se rejoignent en un sommet.
    Le prisme droit à base carrée a deux bases carrées superposables, reliées par des faces latérales rectangulaires.
- id: nblm-combien-de-faces-possede-un-pave-droit-1
  type: choix
  difficulte: 2
  enonce: Combien de faces possède un pavé droit ?
  reponse:
    options:
    - id: o1
      texte: 6 faces
    - id: o2
      texte: 4 faces
    - id: o3
      texte: 8 faces
    - id: o4
      texte: 12 faces
    bonnes:
    - o1
  indices:
    relance: Pense aux faces d'une boîte de mouchoirs ou d'un pavé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, 4 est le nombre de faces d'une pyramide à base triangulaire, pas d'un pavé droit.
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : 8 est le nombre de sommets d''un pavé droit, pas le nombre de ses faces.'
  - si:
      contient:
      - o4
    relance: Attention, 12 est le nombre d'arêtes d'un pavé droit, il ne faut pas confondre les arêtes et les faces.
  solution: 6 faces. C'est exact, un pavé droit possède 6 faces (rectangulaires ou carrées).
- id: nblm-que-se-passe-t-il-au-niveau-du-sommet-d-2
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il au niveau du sommet d'une pyramide ?
  reponse:
    options:
    - id: o1
      texte: Toutes les faces triangulaires se rejoignent en ce point commun.
    - id: o2
      texte: Toutes les faces rectangulaires s'y croisent.
    - id: o3
      texte: C'est le centre de la base carrée.
    - id: o4
      texte: Deux bases superposables s'y rencontrent.
    bonnes:
    - o1
  indices:
    relance: Observe vers quoi montent les faces triangulaires du solide.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, les faces latérales d'une pyramide sont des triangles, pas des rectangles.
  - si:
      contient:
      - o3
    relance: Incorrect, le sommet d'une pyramide est un sommet en hauteur opposé à sa base.
  - si:
      contient:
      - o4
    relance: Attention, ce sont les prismes droits qui possèdent deux bases superposables, pas les pyramides.
  solution: Toutes les faces triangulaires se rejoignent en ce point commun. C'est juste, les faces latérales triangulaires
    de la pyramide se rejoignent toutes au sommet de la pyramide.
- id: nblm-quelle-est-la-forme-des-faces-laterales-3
  type: choix
  difficulte: 2
  enonce: Quelle est la forme des faces latérales d'un prisme droit ?
  reponse:
    options:
    - id: o1
      texte: Des rectangles
    - id: o2
      texte: Des triangles
    - id: o3
      texte: Des cercles
    - id: o4
      texte: Des disques
    bonnes:
    - o1
  indices:
    relance: Ne confonds pas la forme des faces latérales du prisme droit avec celle de la pyramide.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, ce sont les pyramides qui ont des faces latérales triangulaires.
  - si:
      contient:
      - o3
    relance: Faux, un cercle n'est pas un polygone et ne peut pas constituer une face de prisme.
  - si:
      contient:
      - o4
    relance: Incorrect, un disque n'est pas la face latérale d'un prisme droit.
  solution: Des rectangles. C'est exact, les faces latérales d'un prisme droit sont toujours des rectangles.
- id: nblm-parmi-ces-propositions-sur-un-assemblage-4
  type: choix
  difficulte: 2
  enonce: Parmi ces propositions sur un assemblage de carrés, laquelle est exacte au sujet du cube ?
  reponse:
    options:
    - id: o1
      texte: Un assemblage de 6 carrés ne forme pas toujours un patron de cube.
    - id: o2
      texte: N'importe quel assemblage de 6 carrés forme un patron de cube.
    - id: o3
      texte: Un patron de cube nécessite un assemblage de 8 carrés.
    - id: o4
      texte: Un assemblage de carrés ne peut jamais former de solide.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui arrive quand certaines faces se chevauchent au pliage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : si les 6 carrés sont mal positionnés (par exemple tous en ligne), le cube ne pourra pas se
      fermer.'
  - si:
      contient:
      - o3
    relance: Faux, le cube n'a que 6 faces, son patron contient donc exactement 6 carrés.
  - si:
      contient:
      - o4
    relance: Incorrect, en pliant un assemblage correct de 6 carrés, on obtient un cube.
  solution: Un assemblage de 6 carrés ne forme pas toujours un patron de cube. C'est exact, il faut que les 6 carrés soient
    disposés selon un bon patron pour pouvoir se refermer en cube.
- id: nblm-que-se-passe-t-il-lorsque-l-on-vient-pli-5
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il lorsque l'on vient plier un patron de solide le long de ses arêtes ?
  reponse:
    options:
    - id: o1
      texte: On forme un solide en trois dimensions.
    - id: o2
      texte: On obtient une figure plane plus grande.
    - id: o3
      texte: On obtient toujours une pyramide.
    - id: o4
      texte: Le patron perd toutes ses faces.
    bonnes:
    - o1
  indices:
    relance: Imagine le passage d'une feuille plate à un objet en volume.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, le pliage permet de passer de 2 dimensions (surface plane) à 3 dimensions (solide).
  - si:
      contient:
      - o3
    relance: Incorrect, selon la forme des faces, le pliage peut donner un cube, un pavé ou un prisme.
  - si:
      contient:
      - o4
    relance: Attention, les faces à plat du patron deviennent les faces du solide plié.
  solution: On forme un solide en trois dimensions. C'est exact, un patron est une figure plane qui, une fois pliée, constitue
    un solide en volume.
- id: nblm-quelles-affirmations-concernant-les-face-6
  type: choix
  difficulte: 3
  enonce: Quelles affirmations concernant les faces d'un solide sont vraies ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un cube possède 6 faces carrées identiques.
    - id: o2
      texte: Une pyramide possède une seule base et des faces latérales triangulaires.
    - id: o3
      texte: Un pavé droit possède seulement 4 faces au total.
    - id: o4
      texte: Un prisme droit possède des faces latérales en forme de cercles.
    bonnes:
    - o1
    - o2
  indices:
    relance: Analyse bien le nombre et la forme des faces du cube, du pavé et de la pyramide.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Faux, un pavé droit possède 6 faces tout comme le cube.
  - si:
      contient:
      - o4
    relance: Attention, les faces latérales d'un prisme droit sont des rectangles.
  solution: Un cube possède 6 faces carrées identiques ; Une pyramide possède une seule base et des faces latérales triangulaires.
    C'est exact, toutes les faces d'un cube sont des carrés égaux.
- id: nblm-comment-appelle-t-on-la-face-d-une-pyram-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la face d'une pyramide qui n'est pas une face latérale triangulaire ?
  reponse:
    acceptees:
    - la base
    fautes_tolerees: 1
  indices:
    relance: C'est la face particulière sur laquelle s'appuie la pyramide.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: la base. C'est exact, la face polygonale d'une pyramide opposée au sommet principal est appelée la base.
- id: nblm-quel-solide-a-6-faces-carrees-obtient-on-8
  type: texte_court
  difficulte: 1
  enonce: Quel solide à 6 faces carrées obtient-on après avoir plié un patron constitué d'un bon assemblage de carrés ?
  reponse:
    acceptees:
    - un cube
    fautes_tolerees: 1
  indices:
    relance: Pense à la forme du dé à jouer.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: un cube. C'est parfait, le pliage d'un patron formé de 6 carrés donne un cube.
