    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ranger les nombres dans l''ordre décroissant au lieu de l''ordre croissant.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : croire que 9 centièmes est plus grand que 12 centièmes.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : comparer les nombres situés après la virgule comme des entiers (6, 9 puis 12).'
  solution: '2,09 < 2,12 < 2,6. C''est exact : 2,09 a 0 dixième, 2,12 a 1 dixième et 2,6 (ou 2,60) a 6 dixièmes.'
- id: nblm-quelles-sont-les-deux-affirmations-vraie-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations vraies concernant le nombre 4,17 ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Il peut se lire « quatre unités, un dixième et sept centièmes ».
    - id: o2
      texte: Il est égal à la somme 4 + 1/10 + 7/100.
    - id: o3
      texte: Le chiffre 7 est le chiffre des dixièmes.
    - id: o4
      texte: Il est plus petit que 4,09.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense à la valeur de chaque chiffre situé après la virgule et à la décomposition avec des fractions décimales.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre les dixièmes et les centièmes (7 est le deuxième chiffre après la virgule, donc le
      chiffre des centièmes).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : 4,17 contient 1 dixième alors que 4,09 contient 0 dixième, donc 4,17 est plus grand.'
  solution: 'Il peut se lire « quatre unités, un dixième et sept centièmes » ; Il est égal à la somme 4 + 1/10 + 7/100. C''est
    exact : 4 est la partie entière, 1 est le chiffre des dixièmes et 7 est le chiffre des centièmes.'
