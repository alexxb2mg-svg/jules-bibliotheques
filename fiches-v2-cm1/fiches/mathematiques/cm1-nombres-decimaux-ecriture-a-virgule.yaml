- id: nblm-comment-ranger-des-nombres-a-virgule-com-5
  type: choix
  difficulte: 2
  enonce: Comment ranger des nombres à virgule comme 2,12 ; 2,6 et 2,09 dans l'ordre croissant ?
  reponse:
    options:
    - id: o1
      texte: 2,09 < 2,12 < 2,6
    - id: o2
      texte: 2,6 < 2,12 < 2,09
    - id: o3
      texte: 2,12 < 2,09 < 2,6
    - id: o4
