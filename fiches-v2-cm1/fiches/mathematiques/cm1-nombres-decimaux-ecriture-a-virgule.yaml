  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : intercaler un zéro entre la virgule et le 6 modifie la valeur des dixièmes.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : déplacer la virgule vers la droite multiplie le nombre par 10.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : changer la position de la virgule modifie la partie entière.'
  solution: '2,60. C''est exact : ajouter un zéro tout à la fin de la partie décimale (après la virgule) ne change pas la
