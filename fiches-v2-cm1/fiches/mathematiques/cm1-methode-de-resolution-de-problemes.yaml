- id: nblm-quelles-sont-les-deux-actions-essentiell-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux actions essentielles à réaliser lors de la quatrième étape (« Répondre ») ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Écrire une phrase-réponse claire qui répond à la question posée
    - id: o2
      texte: Vérifier que le résultat obtenu est plausible et cohérent avec l'histoire
    - id: o3
      texte: Recopier l'énoncé du problème en entier sur son cahier
    - id: o4
      texte: Changer les nombres de l'énoncé pour refaire un autre calcul
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche l'action d'écriture finale et l'action de contrôle de la réponse.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
