# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-methode-de-resolution-de-problemes
version: 3
etat: verifiee
declencheurs:
- comprendre l'énoncé
- quelle opération faire
- faire un schéma
- vérifier la réponse
- raconter le problème
- résultat plausible
- phrase-réponse
- trouver la bonne opération
- schéma de l'histoire
prerequis: []
essentiel: 'Pour résoudre un problème, on suit quatre étapes, dans l''ordre : comprendre, modéliser, calculer, répondre.


  1. Comprendre. On lit l''énoncé, puis on raconte « l''histoire » avec ses propres mots, comme à un camarade. On repère la
  question : qu''est-ce qu''on cherche exactement ? On repère aussi les nombres utiles.


  2. Modéliser. On cherche la ou les opérations qui permettent de trouver la réponse. Pour s''aider, on peut faire un schéma,
  un dessin, ou utiliser du matériel (jetons, cubes). On choisit l''opération grâce au sens de l''histoire, pas grâce à un
  seul mot. Par exemple, « Léo a 6 billes de plus que Zoé » ne veut pas toujours dire qu''il faut additionner.


  3. Calculer. Au CM1, on calcule de tête (calcul mental) ou en posant l''opération. Certains problèmes demandent plusieurs
  calculs, l''un après l''autre.


  4. Répondre. On écrit une phrase-réponse qui reprend la question, avec l''unité (cerises, euros, mètres...). Puis on se
  demande si le résultat est plausible, c''est-à-dire possible dans la vraie vie. « Une voiture de 4,5 m de long » : c''est
  plausible. « Zoé avait 20 billes, elle en a perdu, il lui en reste 35 » : c''est impossible, il faut chercher l''erreur.


  Exemple : Léa avait 43 cerises, elle en a mangé 18. Elle a moins de cerises qu''avant : c''est une soustraction. 43 − 18
  = 25. Il reste 25 cerises à Léa. 25 est plus petit que 43 : c''est cohérent.

  '
methode:
- Lire l'énoncé et le raconter avec ses propres mots.
- Repérer la question posée, c'est-à-dire ce qu'on cherche exactement, et les nombres utiles.
- Choisir l'opération ou les opérations à faire, avec un schéma ou un dessin si besoin.
- Calculer, mentalement ou en posant l'opération.
- Écrire une phrase-réponse avec l'unité, puis vérifier que le résultat est plausible.
vocabulaire:
- terme: énoncé
  definition: Le texte du problème, qui raconte l'histoire et donne les nombres.
- terme: question
  definition: Ce que le problème demande de trouver.
- terme: modéliser
  definition: Choisir les opérations qui correspondent à l'histoire, en s'aidant si besoin d'un schéma.
- terme: phrase-réponse
  definition: La phrase qui répond à la question, avec le résultat et son unité.
- terme: plausible
  definition: Qui est possible dans la vraie vie, qui a du sens.
erreurs_frequentes:
- Choisir l'opération seulement à cause d'un mot de l'énoncé (par exemple « plus » = addition), sans réfléchir au sens.
- Se lancer dans le calcul sans avoir compris ce que demande la question.
- Oublier d'écrire une phrase-réponse.
- Ne pas vérifier si le résultat trouvé est raisonnable.
- Dans un problème à plusieurs étapes, s'arrêter après le premier calcul.
exemple:
  enonce: Léa avait 43 cerises. Elle en a mangé 18. Combien lui en reste-t-il ?
  solution: 'On comprend : Léa avait des cerises, elle en a mangé, il en reste moins. On modélise par une soustraction : 43
    − 18. On calcule : 43 − 10 = 33, puis 33 − 8 = 25. On répond par une phrase : il reste 25 cerises à Léa. On vérifie :
    25 est plus petit que 43, c''est cohérent.'
exercices:
- id: ordre-des-quatre-etapes
  type: ordre
  difficulte: 1
  enonce: Range les quatre étapes de la méthode pour résoudre un problème, de la première à la dernière.
  reponse:
    elements:
    - id: comprendre
      texte: Comprendre l'énoncé et la question posée
    - id: modeliser
      texte: Modéliser, c'est-à-dire choisir l'opération à faire
    - id: calculer
      texte: Calculer, mentalement ou en posant l'opération
    - id: repondre
      texte: Répondre par une phrase et vérifier le résultat
  indices:
    relance: Que fais-tu en tout premier quand tu lis un problème, avant même de penser à un calcul ?
    methode: Range d'abord ce qui vient en premier (lire et comprendre) et ce qui vient en dernier (écrire la réponse), puis
      place les deux autres entre les deux.
    etape: On commence toujours par comprendre l'histoire du problème. Que fait-on juste après avoir compris, avant de calculer
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes voisines sont inversées. Laquelle des deux vient normalement en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repense à la toute première chose que tu fais (lire et comprendre) et à la toute dernière (répondre), puis place
      les deux autres entre elles.
  solution: 'L''ordre est : comprendre l''énoncé, modéliser (choisir l''opération), calculer, puis répondre par une phrase
    en vérifiant le résultat.'
- id: quelle-operation-billes
  type: choix
  difficulte: 1
  enonce: Léo avait 15 billes. Il en a donné 6 à son frère. Quelle opération permet de trouver combien il lui en reste ?
  reponse:
    options:
    - id: a
      texte: Une addition
    - id: b
      texte: Une soustraction
    - id: c
      texte: Une multiplication
    bonnes:
    - b
  indices:
    relance: Léo a-t-il plus ou moins de billes après en avoir donné ?
    methode: 'Raconte l''histoire avec tes mots : Léo avait des billes, il en a donné, donc il lui en reste moins qu''avant.'
    etape: Quand une quantité diminue parce qu'on en enlève une partie, quelle opération utilise-t-on ?
  pieges:
  - si:
      contient:
      - a
    relance: Une addition ferait augmenter le nombre de billes de Léo. Or il en a donné, donc il lui en reste moins.
  - si:
      contient:
      - c
    relance: Une multiplication répète une même quantité plusieurs fois. Ici, Léo enlève une seule fois une partie de ses
      billes.
  solution: 'Léo avait des billes et il en a donné une partie : il lui en reste moins qu''avant. C''est une soustraction :
    15 − 6.'
- id: resultat-plausible-crayons
  type: choix
  difficulte: 2
  enonce: 'Une trousse contenait 12 crayons. Nina en a prêté 4. Elle trouve comme réponse : « il reste 16 crayons dans la
    trousse ». Que doit-elle faire ?'
  reponse:
    options:
    - id: a
      texte: Accepter ce résultat, il est correct
    - id: b
      texte: Revérifier son calcul, car ce résultat n'est pas plausible
    - id: c
      texte: Changer la question du problème
    bonnes:
    - b
  indices:
    relance: Nina a prêté des crayons. Peut-il y en avoir plus qu'au départ dans la trousse ?
    methode: Compare le résultat trouvé à ce qui est possible dans la réalité, avant de décider s'il est bon.
    etape: Au départ, il y avait 12 crayons. Compare 16 et 12.
  pieges:
  - si:
      contient:
      - a
    relance: Après avoir prêté des crayons, Nina ne peut pas en avoir plus qu'au départ. Ce résultat doit l'alerter.
  - si:
      contient:
      - c
    relance: Le problème n'est pas forcément mal posé. C'est le calcul ou le choix de l'opération qu'il faut d'abord revérifier.
  solution: '16 crayons, c''est plus que les 12 du départ : ce n''est pas plausible. Nina a sans doute additionné au lieu
    de soustraire. Elle doit revérifier son opération : 12 − 4 = 8.'
- id: longueur-voiture-plausible
  type: choix
  difficulte: 2
  enonce: Trois élèves ont résolu un problème sur la longueur d'une voiture. Quelle réponse est plausible ?
  reponse:
    options:
    - id: a
      texte: La voiture mesure 4,5 m de long
    - id: b
      texte: La voiture mesure 45 m de long
    - id: c
      texte: La voiture mesure 4,5 cm de long
    bonnes:
    - a
  indices:
    relance: Imagine une voiture garée dans la rue. Combien de grands pas d'adulte faut-il pour la longer ?
    methode: 'Compare chaque longueur avec des objets que tu connais : ta règle, ta classe, la cour de l''école.'
    etape: Une vraie voiture transporte plusieurs personnes. Est-elle plus petite que ta trousse ? Est-elle plus longue que
      plusieurs voitures alignées ?
  pieges:
  - si:
      contient:
      - b
    relance: 45 m, c'est la longueur de plusieurs voitures garées l'une derrière l'autre. Une seule voiture est bien plus
      courte.
  - si:
      contient:
      - c
    relance: 4,5 cm, c'est la taille d'une petite voiture miniature, pas d'une vraie voiture.
  solution: 4,5 m est plausible pour une vraie voiture. 45 m est beaucoup trop long, et 4,5 cm est la taille d'un jouet.
- id: quelle-operation-cerises
  type: texte_court
  difficulte: 2
  enonce: Dans le problème « Léa avait 61 cerises, elle en a donné 24 à son frère, combien lui en reste-t-il ? », quelle opération
    faut-il poser ? Réponds par un mot.
  reponse:
    acceptees:
    - soustraction
    - une soustraction
    fautes_tolerees: 1
  indices:
    relance: Léa a-t-elle plus ou moins de cerises après en avoir donné ?
    methode: Raconte l'histoire avec tes mots pour voir si la quantité de cerises augmente ou diminue.
    etape: Une quantité qui diminue parce qu'on en enlève une partie se calcule avec cette opération.
  pieges:
  - si:
      valeur: addition
    relance: Une addition ferait augmenter le nombre de cerises. Ici, Léa en a donné, donc il lui en reste moins.
  solution: 'Il faut poser une soustraction, car Léa avait des cerises et elle en a donné une partie : 61 − 24.'
- id: verifier-le-calcul-reste
  type: nombre
  difficulte: 2
  enonce: Léa avait 61 cerises, elle en a donné 24 à son frère. Un élève calcule 61 − 24. Vérifie ce calcul et donne son résultat.
  reponse:
    valeur: 37
    forme: entier
  indices:
    relance: Pose la soustraction 61 − 24 et calcule-la étape par étape.
    methode: Soustrais d'abord les unités, puis les dizaines, en cassant une dizaine si besoin.
    etape: Tu peux enlever d'abord 20 à 61, puis enlever encore 4.
  pieges:
  - si:
      valeur: 85
    relance: 85 correspond à une addition (61 + 24). Ici il faut soustraire, pas additionner.
  - si:
      valeur: 43
    relance: 'Attention : 1 unité moins 4 unités, ce n''est pas 4 − 1. Il faut d''abord casser une dizaine.'
  - si:
      valeur: 47
    relance: Tu as cassé une dizaine pour les unités. N'oublie pas qu'il reste alors une dizaine de moins.
  solution: 61 − 24 = 37 (61 − 20 = 41, puis 41 − 4 = 37). Il reste 37 cerises à Léa.
- id: probleme-deux-etapes-cahiers
  type: nombre
  difficulte: 3
  enonce: Tom achète 3 cahiers à 2 € chacun et un stylo à 4 €. Combien paie-t-il en tout, en euros ?
  reponse:
    valeur: 10
    forme: entier
  indices:
    relance: 'Raconte l''histoire : qu''achète Tom ? Combien de choses différentes ?'
    methode: 'Il y a deux étapes : d''abord le prix de tous les cahiers, ensuite on ajoute le prix du stylo.'
    etape: Commence par trouver le prix des 3 cahiers, sachant qu'un cahier coûte 2 €.
  pieges:
  - si:
      valeur: 9
    relance: 'Tu as additionné 3, 2 et 4. Mais 3, c''est le nombre de cahiers, pas un prix : chaque cahier coûte 2 €.'
  - si:
      valeur: 6
    relance: 'Tu as trouvé le prix des cahiers. N''oublie pas la deuxième étape : Tom achète aussi un stylo.'
  solution: 'Étape 1 : 3 × 2 = 6, les cahiers coûtent 6 €. Étape 2 : 6 + 4 = 10. Tom paie 10 € en tout. C''est plausible pour
    quelques fournitures.'
- id: expliquer-les-quatre-etapes
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases les quatre étapes que tu suis pour résoudre un problème de mathématiques.
  criteres:
  - L'élève cite l'étape « comprendre » (lire et reformuler l'énoncé).
  - L'élève cite l'étape « modéliser » (choisir l'opération, avec un schéma si besoin).
  - L'élève cite les étapes « calculer » et « répondre » (écrire une phrase-réponse et vérifier si le résultat est plausible).
  indices:
    relance: Quelle est la toute première chose que tu fais quand tu lis un problème ?
    methode: Nomme les quatre étapes dans l'ordre, puis explique brièvement ce qu'on fait à chacune.
    etape: 'Tu peux commencer ainsi : « D''abord, je comprends l''énoncé en le racontant avec mes mots... » puis continuer.'
  solution: D'abord, je comprends l'énoncé en le racontant avec mes mots. Ensuite, je modélise en choisissant l'opération
    à faire, avec un schéma si besoin. Puis je calcule, mentalement ou en posant l'opération. Enfin, je réponds par une phrase
    et je vérifie que le résultat est plausible.
- id: nblm-dans-quel-ordre-chronologique-faut-il-su-1
  type: choix
  difficulte: 2
  enonce: Dans quel ordre chronologique faut-il suivre les quatre étapes de la méthode pour résoudre un problème ?
  reponse:
    options:
    - id: o1
      texte: Comprendre, modéliser, calculer, répondre
    - id: o2
      texte: Calculer, comprendre, modéliser, répondre
    - id: o3
      texte: Modéliser, répondre, calculer, comprendre
    - id: o4
      texte: Répondre, calculer, comprendre, modéliser
    bonnes:
    - o1
  indices:
    relance: Pense aux actions que tu réalises depuis la lecture du texte jusqu'à l'écriture de la phrase finale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Une erreur fréquente consiste à effectuer des calculs avant d'avoir compris le sens de l'histoire et de la question.
  - si:
      contient:
      - o3
    relance: On ne peut pas modéliser ni répondre à la question sans avoir d'abord lu et compris l'énoncé.
  - si:
      contient:
      - o4
    relance: La réponse intervient toujours à la toute fin, après la modélisation et le calcul.
  solution: Comprendre, modéliser, calculer, répondre. C'est la chronologie exacte préconisée pour analyser et résoudre méthodiquement
    un problème.
- id: nblm-lors-de-la-premiere-etape-comprendre-que-2
  type: choix
  difficulte: 2
  enonce: Lors de la première étape (« Comprendre »), que permet de vérifier l'action de raconter l'histoire du problème avec
    ses propres mots ?
  reponse:
    options:
    - id: o1
      texte: S'assurer qu'on a bien saisi le sens de l'énoncé et de la question posée
    - id: o2
      texte: Trouver immédiatement le résultat numérique sans faire de calcul
    - id: o3
      texte: Deviner directement l'opération à faire en cherchant un mot-clé
    - id: o4
      texte: Savoir si le texte contient des fautes de grammaire
    bonnes:
    - o1
  indices:
    relance: Pense à ce que t'apporte la reformulation de l'histoire avant de chercher des opérations.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Raconter l'histoire aide à comprendre la situation, mais ne donne pas la réponse chiffrée directement.
  - si:
      contient:
      - o3
    relance: Se fier à un seul mot sans comprendre l'histoire globale conduit souvent à choisir la mauvaise opération.
  - si:
      contient:
      - o4
    relance: L'objectif en mathématiques est de comprendre la situation du problème, pas d'évaluer la grammaire.
  solution: S'assurer qu'on a bien saisi le sens de l'énoncé et de la question posée. Reformuler l'histoire dans ses propres
    mots montre qu'on a compris la situation concrète avant de passer aux mathématiques.
- id: nblm-dans-l-enonce-lea-a-15-billes-elle-en-a-3
  type: choix
  difficulte: 2
  enonce: 'Dans l''énoncé : « Léa a 15 billes. Elle en a 6 de plus que Tom. Combien Tom a-t-il de billes ? », quelle opération
    faut-il choisir pour trouver la réponse ?'
  reponse:
    options:
    - id: o1
      texte: Une soustraction (15 - 6)
    - id: o2
      texte: Une addition (15 + 6)
    - id: o3
      texte: Une multiplication (15 × 6)
    - id: o4
      texte: Une division (15 ÷ 6)
    bonnes:
    - o1
  indices:
    relance: Identifie qui possède le plus grand nombre de billes entre Léa et Tom avant de décider du calcul.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est l''erreur classique : se jeter sur le mot « plus » pour faire une addition sans analyser qui en a le
      plus.'
  - si:
      contient:
      - o3
    relance: La situation n'implique pas de répéter 6 fois une collection de 15 billes.
  - si:
      contient:
      - o4
    relance: On ne cherche pas à partager équitablement 15 billes en 6 groupes.
  solution: Une soustraction (15 - 6). Puisque Léa a 6 billes de plus que Tom, Tom en a 6 de moins que Léa ; il faut donc
    faire une soustraction.
- id: nblm-a-quoi-sert-principalement-la-realisatio-4
  type: choix
  difficulte: 2
  enonce: À quoi sert principalement la réalisation d'un schéma lors de la phase « Modéliser » ?
  reponse:
    options:
    - id: o1
      texte: À représenter visuellement la situation pour identifier l'opération à effectuer
    - id: o2
      texte: À remplacer l'écriture de la phrase-réponse à la fin du problème
    - id: o3
      texte: À décorer la feuille de travail après avoir fini les calculs
    - id: o4
      texte: À poser l'opération en colonnes sans se tromper de retenues
    bonnes:
    - o1
  indices:
    relance: Réfléchis au lien que crée le dessin entre l'histoire concrète et le choix du calcul.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le schéma sert à modéliser la recherche, mais la phrase-réponse reste obligatoire.
  - si:
      contient:
      - o3
    relance: Le schéma est un outil mathématique d'aide à la résolution, pas une illustration décorative.
  - si:
      contient:
      - o4
    relance: La pose des opérations se fait lors de la phase « Calculer », le schéma sert à l'étape « Modéliser ».
  solution: À représenter visuellement la situation pour identifier l'opération à effectuer. Le schéma en barres ou le dessin
    aide à comprendre la structure du problème et à choisir la bonne opération.
- id: nblm-un-eleve-calcule-la-longueur-d-une-voitu-5
  type: choix
  difficulte: 2
  enonce: Un élève calcule la longueur d'une voiture dans un problème et trouve un résultat de 800 mètres. Quelle démarche
    de vérification doit-il adopter ?
  reponse:
    options:
    - id: o1
      texte: Se rendre compte que le résultat n'est pas plausible car une voiture mesure quelques mètres
    - id: o2
      texte: Valider le résultat car l'opération posée ne comporte aucune erreur de calcul
    - id: o3
      texte: Considérer que la réponse est juste tant qu'il a écrit une phrase-réponse
    - id: o4
      texte: Penser qu'une voiture peut mesurer 800 mètres dans les problèmes de mathématiques
    bonnes:
    - o1
  indices:
    relance: Compare ce nombre de 800 mètres avec la taille réelle d'une automobile.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un calcul peut être bien exécuté mais s'appuyer sur une opération ou une unité incorrecte.
  - si:
      contient:
      - o3
    relance: Rédiger une phrase ne suffit pas si le nombre trouvé est complètement irréaliste.
  - si:
      contient:
      - o4
    relance: Les problèmes s'inscrivent dans des situations concrètes où les ordres de grandeur doivent rester crédibles.
  solution: Se rendre compte que le résultat n'est pas plausible car une voiture mesure quelques mètres. Vérifier la vraisemblance
