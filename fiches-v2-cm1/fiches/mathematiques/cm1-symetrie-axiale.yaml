format: 2
notion: cm1-symetrie-axiale
version: 3
etat: verifiee
declencheurs:
- plier la feuille
- se superposer
- construire le symétrique
- distance à l'axe
- axe vertical ou horizontal
- figure qui se replie sur elle-même
- compléter le dessin pliage
- effet miroir quadrillage
prerequis: []
essentiel: 'Une figure a un axe de symétrie si, en pliant la feuille le long de cette droite, les deux parties de la figure
  se superposent exactement. Par exemple, un cœur découpé dans une feuille pliée en deux a un axe de symétrie : la ligne du
  pli.


  Une figure peut avoir un seul axe de symétrie, plusieurs, ou aucun. Un rectangle (qui n''est pas un carré) en a 2. Un carré
  en a 4. Un triangle quelconque n''en a aucun.


  Pour construire un symétrique, au CM1, on utilise un axe horizontal (couché) ou vertical (debout), jamais penché.


  Compléter une figure pour qu''elle soit symétrique, c''est dessiner la partie qui manque de l''autre côté de l''axe, comme
  un reflet dans un miroir.


  Pour construire le symétrique d''un point sur papier quadrillé, on compte les carreaux entre le point et l''axe. Puis on
  compte le même nombre de carreaux de l''autre côté. Avec un axe vertical, on reste sur la même ligne du quadrillage. Avec
  un axe horizontal, on reste sur la même colonne. Un point placé sur l''axe est son propre symétrique.


  Pour une figure (un segment, un polygone), on construit le symétrique de chaque sommet, puis on relie les points obtenus
  dans le même ordre.


  Exemple : M est à 3 carreaux à gauche d''un axe vertical. Son symétrique M'' est à 3 carreaux à droite de l''axe, sur la
  même ligne.


  On vérifie en pliant la feuille le long de l''axe : la figure et son symétrique doivent se superposer.

  '
methode:
- Repérer l'axe de symétrie (horizontal ou vertical) sur le quadrillage.
- Choisir un sommet de la figure et compter le nombre de carreaux jusqu'à l'axe.
- Reporter la même distance de l'autre côté de l'axe pour placer le point symétrique.
- Recommencer pour chaque sommet, puis relier les points obtenus dans le même ordre.
- Vérifier par pliage le long de l'axe.
vocabulaire:
- terme: axe de symétrie
  definition: Droite par rapport à laquelle une figure se superpose à elle-même par pliage.
- terme: figure symétrique
  definition: Figure obtenue en retournant une figure de l'autre côté d'un axe, comme dans un miroir.
- terme: se superposer
  definition: Être exactement l'un sur l'autre quand on plie la feuille.
- terme: axe horizontal
  definition: Un axe couché, tracé de gauche à droite sur la feuille.
- terme: axe vertical
  definition: Un axe debout, tracé de haut en bas sur la feuille.
- terme: papier quadrillé
  definition: Papier avec des carreaux réguliers, qui permet de compter les distances à l'axe.
erreurs_frequentes:
- Compter les carreaux à partir du mauvais point de départ.
- Oublier de vérifier le résultat par pliage.
- Chercher un axe de symétrie penché alors qu'au CM1 on ne travaille qu'avec des axes horizontaux ou verticaux.
- Recopier la figure à côté de l'axe sans la retourner (on fait glisser la figure au lieu de la plier).
- Changer de ligne ou de colonne en reportant les carreaux de l'autre côté de l'axe.
exemple:
  enonce: Un point M est à 3 carreaux à gauche d'un axe de symétrie vertical. Où placer son symétrique M' ?
  solution: 'On compte 3 carreaux entre M et l''axe. On reporte 3 carreaux de l''autre côté : M'' est à 3 carreaux à droite
    de l''axe, sur la même ligne horizontale que M. En pliant la feuille le long de l''axe, M et M'' se superposent.'
exercices:
- id: definir-axe
  type: texte_court
  difficulte: 1
  enonce: Une figure se superpose exactement à elle-même quand on plie la feuille selon une droite. Comment appelle-t-on cette
    droite ?
  reponse:
    acceptees:
    - axe de symétrie
    - un axe de symétrie
    fautes_tolerees: 2
  indices:
    relance: Relis le vocabulaire de la leçon. Quel nom donne-t-on à la ligne du pli ?
    methode: 'Pense à ce que fait le pliage : il révèle une droite particulière de la figure.'
    etape: Cette notion s'appelle la symétrie axiale. Le nom de la droite vient de là.
  pieges:
  - si:
      valeur: pliage
    relance: Le pliage est l'action qui permet de vérifier. La droite elle-même a un autre nom.
  solution: On appelle cette droite un axe de symétrie.
- id: distance-symetrique
  type: nombre
  difficulte: 2
  enonce: Sur un quadrillage, un point M est à quatre carreaux d'un axe de symétrie vertical. À combien de carreaux de l'axe
    se trouve son symétrique M', de l'autre côté ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Le symétrique est-il plus proche, plus loin, ou à la même distance de l'axe ?
    methode: 'Rappelle-toi : chaque point du symétrique est à la même distance de l''axe que le point de départ.'
    etape: Le nombre de carreaux entre M et l'axe, donné dans l'énoncé, doit être appliqué à M' de l'autre côté.
  pieges:
  - si:
      valeur: 8
    relance: Tu as peut-être additionné les deux distances. M' est à la même distance que M, pas au double.
  - si:
      valeur: 2
    relance: Tu as peut-être divisé la distance par deux. Ce n'est pas ce que dit la règle de la symétrie.
  solution: Le symétrique M' est à la même distance de l'axe que M, donc à 4 carreaux, de l'autre côté.
- id: ecart-point-et-symetrique
  type: nombre
  difficulte: 2
  enonce: Sur un quadrillage, l'axe de symétrie est horizontal. Le point A est 2 carreaux au-dessus de l'axe. On construit
    son symétrique A'. Combien de carreaux séparent A et A' ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: 'Où se trouve A'' : au-dessus ou en dessous de l''axe ? À combien de carreaux de l''axe ?'
    methode: Pour aller de A à A', on va d'abord de A jusqu'à l'axe, puis de l'axe jusqu'à A'.
    etape: A est à 2 carreaux de l'axe, et A' est à la même distance de l'autre côté. Ajoute les deux morceaux du trajet.
  pieges:
  - si:
      valeur: 2
    relance: 2 carreaux, c'est la distance entre A et l'axe. La question demande la distance entre A et A'.
  solution: 'A est à 2 carreaux au-dessus de l''axe, A'' est à 2 carreaux en dessous, sur la même colonne. Entre A et A''
    : 2 + 2 = 4 carreaux.'
- id: nombre-axes-figure
  type: choix
  difficulte: 2
  enonce: Combien d'axes de symétrie une figure peut-elle avoir ?
  reponse:
    options:
    - id: a
      texte: Toujours un seul
    - id: b
      texte: Aucun, un seul, ou plusieurs, selon la figure
    - id: c
      texte: Toujours plusieurs
    bonnes:
    - b
  indices:
    relance: Pense à un rectangle (deux axes), à une figure quelconque (aucun axe), et à un cœur (un axe).
    methode: Le nombre d'axes dépend de la forme précise de la figure, pas d'une règle fixe.
    etape: Certaines figures n'ont aucun axe, d'autres un seul, d'autres plusieurs.
  pieges:
  - si:
      contient:
      - a
    relance: Certaines figures ont plusieurs axes de symétrie, et d'autres n'en ont aucun.
  - si:
      contient:
      - c
    relance: Beaucoup de figures n'ont qu'un seul axe de symétrie, voire aucun.
  solution: 'Cela dépend de la figure : elle peut avoir aucun axe, un seul, ou plusieurs axes de symétrie.'
- id: etapes-construction-symetrique
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour construire le symétrique d'un point M par rapport à un axe vertical, sur quadrillage.
  reponse:
    elements:
    - id: compter
      texte: Compter le nombre de carreaux entre M et l'axe
    - id: reporter
      texte: Reporter le même nombre de carreaux de l'autre côté de l'axe, sur la même ligne
    - id: placer
      texte: Placer le point M' à cet endroit
    - id: verifier
      texte: Vérifier par pliage que M et M' se superposent
  indices:
    relance: Peux-tu reporter une distance avant de l'avoir comptée ?
    methode: Il faut d'abord mesurer, puis reporter la mesure, puis placer le point, puis vérifier.
    etape: La toute première étape consiste à compter les carreaux entre M et l'axe.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Doit-on placer le point avant ou après avoir reporté la distance ?
  - si:
      diagnostic: ordre_faux
    relance: La vérification par pliage se fait forcément en dernier, une fois le point placé.
  solution: On compte les carreaux entre M et l'axe, on reporte cette distance de l'autre côté, on place M', puis on vérifie
    par pliage.
- id: figure-et-nombre-axes
  type: association
  difficulte: 2
  enonce: Relie chaque figure à son nombre d'axes de symétrie.
  reponse:
    gauche:
    - id: a
      texte: Carré
    - id: b
      texte: Rectangle (non carré)
    - id: c
      texte: Triangle quelconque (sans propriété particulière)
    droite:
    - id: x
      texte: 4 axes
    - id: y
      texte: 2 axes
    - id: z
      texte: 0 axe
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Le carré a plus de symétries que le simple rectangle car il combine plusieurs propriétés.
    methode: Un triangle sans particularité n'a généralement pas d'axe de symétrie.
    etape: Découpe un carré et un rectangle dans du papier. Plie-les de toutes les façons possibles et compte les plis qui
      marchent.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien le carré et le rectangle.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque figure et imagine ses plis possibles.
  solution: Carré → 4 axes ; rectangle (non carré) → 2 axes ; triangle quelconque → 0 axe.
- id: symetrique-point-axe-vertical
  type: choix
  difficulte: 3
  enonce: Sur un quadrillage, l'axe de symétrie est vertical. Le point B est 5 carreaux à droite de l'axe. Où faut-il placer
    son symétrique B' ?
  reponse:
    options:
    - id: a
      texte: 5 carreaux à gauche de l'axe, sur la même ligne que B
    - id: b
      texte: 5 carreaux à gauche de l'axe, une ligne plus haut que B
    - id: c
      texte: 10 carreaux à gauche de l'axe, sur la même ligne que B
    - id: d
      texte: 5 carreaux sous l'axe, sur la même colonne que B
    bonnes:
    - a
  indices:
    relance: Le symétrique d'un point se trouve-t-il du même côté de l'axe, ou de l'autre côté ?
    methode: Avec un axe vertical, on reste sur la même ligne du quadrillage, et on reporte la même distance de l'autre côté.
    etape: B est à droite de l'axe. Son symétrique est donc de l'autre côté. Vérifie maintenant la distance et la ligne de
      chaque proposition.
  pieges:
  - si:
      contient:
      - b
    relance: Avec un axe vertical, le point et son symétrique restent sur la même ligne horizontale du quadrillage.
  - si:
      contient:
      - c
    relance: Le symétrique est à la même distance de l'axe que B, pas au double.
  - si:
      contient:
      - d
    relance: 'L''axe est vertical, debout : on ne passe pas en dessous, on passe de l''autre côté, à gauche ou à droite.'
  solution: 'B'' est de l''autre côté de l''axe, à la même distance que B : 5 carreaux à gauche de l''axe, sur la même ligne
    que B. En pliant le long de l''axe, B et B'' se superposent.'
- id: expliquer-verification-pliage
  type: ouverte
  difficulte: 3
  enonce: Un camarade a construit le symétrique d'une figure sur un quadrillage. Explique-lui comment vérifier que sa construction
    est juste.
  criteres:
  - L'élève propose de plier la feuille selon l'axe de symétrie.
  - L'élève précise que les deux figures doivent se superposer exactement pour que la construction soit correcte.
  - 'L''élève propose aussi de vérifier en comptant les carreaux : chaque sommet et son symétrique sont à la même distance
    de l''axe.'
  indices:
    relance: Quelle manipulation physique permet de vérifier une symétrie ?
    methode: Pense à ce qu'on fait avec la feuille de papier, et à ce qu'on peut compter sur le quadrillage.
    etape: On plie le long d'une droite précise de la figure. Laquelle ?
  solution: 'Il faut plier la feuille le long de l''axe de symétrie : si la construction est juste, la figure de départ et
    son symétrique se superposent exactement. On peut aussi compter les carreaux : chaque sommet et son symétrique doivent
    être à la même distance de l''axe.'
