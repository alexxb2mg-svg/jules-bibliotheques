format: 2
notion: cm1-multiples-et-diviseurs
version: 1
etat: verifiee
declencheurs:
- divisible par
- partager en groupes égaux
- reste de la division
- table de multiplication
- sachets égaux
prerequis:
- cm1-numeration-des-entiers
essentiel: 'Un nombre est un multiple d''un autre nombre si on peut l''obtenir en multipliant cet autre nombre par un nombre
  entier. Par exemple, 72 est un multiple de 9 car 8 × 9 = 72.

  Un nombre entier inférieur ou égal à 10 est un diviseur d''un nombre donné si ce nombre peut se partager exactement (sans
  reste) en groupes de cette taille.

  Pour savoir si un nombre est multiple de 2, on regarde juste son dernier chiffre : il doit être pair (0, 2, 4, 6, 8). Pour
  5 : le dernier chiffre doit être 0 ou 5. Pour 10 : le dernier chiffre doit être 0.

  Pour les autres nombres (3, 4, 6, 7, 8, 9), il n''y a pas de règle simple à connaître au CM1 : on s''appuie sur les tables
  de multiplication ou on effectue une division.'
methode:
- 'Pour tester 2, 5 ou 10 : regarder uniquement le dernier chiffre du nombre.'
- 'Pour tester un autre diviseur (3, 4, 6, 7, 8, 9) : chercher dans la table de multiplication ou effectuer la division.'
- Si la division tombe juste (reste 0), le diviseur testé est bien un diviseur du nombre.
- Si la division laisse un reste, le nombre testé n'est pas un diviseur.
erreurs_frequentes:
- Appliquer une règle de dernier chiffre à 3, 4, 6, 7, 8 ou 9, qui n'existe pas au CM1.
- 'Confondre « multiple de » et « diviseur de » : 72 est un multiple de 9, et 9 est un diviseur de 72.'
- Oublier de vérifier que la division tombe bien juste avant de conclure.
exemple:
  enonce: 141 est-il un multiple de 2 ? Est-il un multiple de 7 ?
  solution: '141 n''est pas un multiple de 2, car 141 est un nombre impair (son dernier chiffre est 1). Pour 7 : 141 = 7 ×
    20 + 1, la division laisse un reste de 1, donc 141 n''est pas un multiple de 7.'
exercices:
- id: dernier-chiffre-130
  type: texte_court
  difficulte: 1
  enonce: 130 est un multiple de 2, de 5 et de 10. Vrai ou faux ?
  reponse:
    acceptees:
    - vrai
    fautes_tolerees: 0
  indices:
    relance: 'Regarde seulement le dernier chiffre de 130 : est-il pair ? est-il 0 ou 5 ? est-il 0 ?'
    methode: Le dernier chiffre de 130 est 0. Compare-le aux trois règles (2, 5, 10).
    etape: 'Un dernier chiffre 0 vérifie les trois règles à la fois : pair, égal à 0 ou 5, et égal à 0.'
  pieges:
  - si:
      valeur: faux
    relance: Regarde bien le dernier chiffre de 130. Est-il pair ? Est-il 0 ou 5 ?
  solution: 'Vrai : le dernier chiffre de 130 est 0, donc 130 est multiple de 2 (0 est pair), de 5 (0 ou 5) et de 10 (0).'
- id: multiples-de-cinq-et-dix
  type: choix
  difficulte: 1
  enonce: Parmi 130, 205, 348, quels nombres sont des multiples de 5 ?
  reponse:
    options:
    - id: a
      texte: '130'
    - id: b
      texte: '205'
    - id: c
      texte: '348'
    bonnes:
    - a
    - b
  indices:
    relance: Un multiple de 5 a un dernier chiffre 0 ou 5. Regarde le dernier chiffre de chaque nombre.
    methode: Vérifie chaque nombre un par un en ne regardant que son dernier chiffre.
    etape: Note le dernier chiffre de chacun des trois nombres, puis compare-le à la règle du multiple de 5.
  pieges:
  - si:
      contient:
      - c
    relance: 348 se termine par 8. Est-ce que 8 vaut 0 ou 5 ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé un, mais il en manque un autre. Vérifie aussi 205.
  solution: 'Multiples de 5 : 130 (dernier chiffre 0) et 205 (dernier chiffre 5). 348 n''est pas un multiple de 5, car il
    se termine par 8.'
- id: diviseur-trois-de-141
  type: nombre
  difficulte: 2
  enonce: 3 est-il un diviseur de 141 ? Si oui, donne le nombre entier par lequel il faut multiplier 3 pour obtenir 141.
  reponse:
    valeur: 47
    forme: entier
  indices:
    relance: Cherche un nombre entier qui, multiplié par 3, donne 141.
    methode: Essaie 3 × 40, puis ajuste en avançant par tables de 3 jusqu'à atteindre 141.
    etape: 3 × 40 = 120. Il reste 141 - 120 = 21 à ajouter, soit encore 3 × 7.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie ton calcul en multipliant ta réponse par 3 : retrouves-tu bien 141 ?'
  solution: 'Oui, 3 est un diviseur de 141 : 3 × 47 = 141.'
- id: sachets-de-billes
  type: nombre
  difficulte: 2
  enonce: Léo veut ranger 75 billes dans des sachets contenant tous 5 billes, sans en garder aucune de côté. Combien de sachets
    peut-il faire ?
  reponse:
    valeur: 15
    forme: entier
  indices:
    relance: 75 est-il un multiple de 5 ? Si oui, combien de fois 5 entre-t-il dans 75 ?
    methode: Effectue la division de 75 par 5, ou cherche le nombre qui, multiplié par 5, donne 75.
    etape: 75 se termine par 5, donc 75 est bien un multiple de 5.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: 'Multiplie ta réponse par 5 : retrouves-tu 75 billes en tout ?'
  solution: '75 est un multiple de 5 (dernier chiffre 5) : 75 ÷ 5 = 15, Léo peut faire 15 sachets de 5 billes.'
- id: sachets-de-dix-impossible
  type: choix
  difficulte: 2
  enonce: Léo a aussi 75 billes. Peut-il les ranger dans des sachets de 10 billes, sans en garder aucune de côté ?
  reponse:
    options:
    - id: a
      texte: Oui, car 75 est un multiple de 10.
    - id: b
      texte: Non, car le dernier chiffre de 75 n'est pas 0.
    - id: c
      texte: Oui, car 75 est un multiple de 5.
    bonnes:
    - b
  indices:
    relance: Un multiple de 10 se termine toujours par 0. Regarde le dernier chiffre de 75.
    methode: Compare le dernier chiffre de 75 à la règle du multiple de 10.
    etape: Le dernier chiffre de 75 est 5, pas 0.
  pieges:
  - si:
      contient:
      - a
    relance: 'Relis la règle du multiple de 10 : quel doit être le dernier chiffre ?'
  - si:
      contient:
      - c
    relance: Cette phrase est vraie sur 75 et 5, mais elle ne répond pas à la question posée sur les sachets de 10.
  solution: 'Non : 75 n''est pas un multiple de 10, car son dernier chiffre est 5, pas 0. Il resterait des billes non rangées.'
