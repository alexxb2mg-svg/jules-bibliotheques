# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-multiples-et-diviseurs
version: 3
etat: verifiee
declencheurs:
- divisible par
- partager en groupes égaux
- reste de la division
- table de multiplication
- sachets égaux
- nombre pair
- finit par zéro
- paquets sans reste
- tombe juste
prerequis:
- cm1-numeration-des-entiers
essentiel: 'Un multiple d''un nombre, c''est un résultat de sa table de multiplication. 72 est un multiple de 9, car 8 × 9
  = 72. La table continue après 10 : 90, 99, 108 sont aussi des multiples de 9.


  Un diviseur, c''est l''autre sens. 9 est un diviseur de 72, car on peut partager 72 en paquets de 9 sans qu''il reste rien.
  On dit aussi que 72 est divisible par 9. Les deux phrases « 72 est un multiple de 9 » et « 9 est un diviseur de 72 » disent
  la même chose.


  Pour 2, 5 et 10, il suffit de regarder le dernier chiffre, celui des unités. Un multiple de 2 se termine par 0, 2, 4, 6
  ou 8 : c''est un nombre pair. Un multiple de 5 se termine par 0 ou par 5. Un multiple de 10 se termine par 0.


  Exemple : 560 se termine par 0, c''est donc un multiple de 2, de 5 et de 10. 235 se termine par 5 : c''est un multiple de
  5, mais pas de 2 ni de 10.


  Pour les autres nombres jusqu''à 10 (3, 4, 6, 7, 8 et 9), il n''y a pas de règle du dernier chiffre à connaître au CM1.
  On cherche dans les tables de multiplication, ou on pose la division. Si le reste est 0, on dit que la division « tombe
  juste ».


  Exemple : 56 bonbons pour 7 enfants. 7 × 8 = 56, donc 7 est un diviseur de 56 : chaque enfant en a 8 et il n''en reste aucun.
  Avec 58 bonbons, il en resterait 2 : 7 n''est pas un diviseur de 58.

  '
methode:
- 'Lire la question : cherche-t-on si un nombre est un multiple, ou si un petit nombre est un diviseur ?'
- 'Pour 2, 5 ou 10 : regarder uniquement le dernier chiffre du nombre.'
- 'Pour 3, 4, 6, 7, 8 ou 9 : chercher le nombre dans la table de multiplication, ou poser la division.'
- Si la division tombe juste (reste 0), le nombre est un multiple, et le petit nombre est un diviseur.
- S'il y a un reste, ce n'est ni un multiple ni un diviseur.
- Vérifier en multipliant le quotient par le diviseur.
vocabulaire:
- terme: multiple
  definition: Un multiple de 9 est un nombre qu'on trouve dans la table de 9 (9, 18, 27...).
- terme: diviseur
  definition: Un diviseur d'un nombre permet de le partager en paquets égaux sans aucun reste.
- terme: divisible par
  definition: « 72 est divisible par 9 » veut dire que 9 est un diviseur de 72.
- terme: nombre pair
  definition: Un nombre pair se termine par 0, 2, 4, 6 ou 8 ; c'est un multiple de 2.
- terme: reste
  definition: Ce qui reste quand on ne peut plus faire de paquet entier dans une division.
erreurs_frequentes:
- Appliquer une règle de dernier chiffre à 3, 4, 6, 7, 8 ou 9, qui n'existe pas au CM1.
- 'Confondre « multiple de » et « diviseur de » : 72 est un multiple de 9, et 9 est un diviseur de 72.'
- Oublier de vérifier que la division tombe bien juste avant de conclure.
- Croire qu'un nombre qui se termine par 5 est un multiple de 10, ou qu'il est pair.
- Regarder le premier chiffre du nombre au lieu du dernier.
exemple:
  enonce: 141 est-il un multiple de 2 ? Est-il un multiple de 7 ?
  solution: '141 n''est pas un multiple de 2, car 141 est un nombre impair (son dernier chiffre est 1). Pour 7 : 7 × 20 =
    140 et 141 = 140 + 1. La division de 141 par 7 laisse un reste de 1, donc 141 n''est pas un multiple de 7.'
exercices:
- id: dernier-chiffre-130
  type: texte_court
  difficulte: 1
  enonce: 130 est un multiple de 2, de 5 et de 10. Vrai ou faux ?
  reponse:
    acceptees:
    - vrai
    fautes_tolerees: 0
  indices:
    relance: 'Regarde seulement le dernier chiffre de 130 : est-il pair ? est-il 0 ou 5 ? est-il 0 ?'
    methode: Le dernier chiffre de 130 est 0. Compare-le aux trois règles (2, 5, 10).
    etape: 'Un dernier chiffre 0 vérifie les trois règles à la fois : pair, égal à 0 ou 5, et égal à 0.'
  pieges:
  - si:
      valeur: faux
    relance: Regarde bien le dernier chiffre de 130. Est-il pair ? Est-il 0 ou 5 ?
  solution: 'Vrai : le dernier chiffre de 130 est 0, donc 130 est multiple de 2 (0 est pair), de 5 (0 ou 5) et de 10 (0).'
- id: nombres-pairs-parmi
  type: choix
  difficulte: 1
  enonce: Parmi 47, 86, 130 et 205, quels nombres sont des multiples de 2 ?
  reponse:
    options:
    - id: a
      texte: '47'
    - id: b
      texte: '86'
    - id: c
      texte: '130'
    - id: d
      texte: '205'
    bonnes:
    - b
    - c
  indices:
    relance: Un multiple de 2 est un nombre pair. Regarde le dernier chiffre de chaque nombre.
    methode: Un nombre pair se termine par 0, 2, 4, 6 ou 8. Teste les quatre nombres un par un.
    etape: '47 se termine par 7 : 7 n''est pas dans la liste 0, 2, 4, 6, 8. Continue avec les trois autres.'
  pieges:
  - si:
      contient:
      - a
    relance: 47 se termine par 7. Est-ce un chiffre pair ?
  - si:
      contient:
      - d
    relance: 205 se termine par 5. Un nombre qui se termine par 5 est-il pair ?
  - si:
      diagnostic: incomplet
    relance: Il manque un bon nombre. Regarde à nouveau le dernier chiffre de chacun des quatre nombres.
  solution: '86 (dernier chiffre 6) et 130 (dernier chiffre 0) sont pairs, donc multiples de 2. 47 et 205 se terminent par
    7 et 5 : ils sont impairs.'
- id: multiples-de-cinq-et-dix
  type: choix
  difficulte: 1
  enonce: Parmi 130, 205, 348, quels nombres sont des multiples de 5 ?
  reponse:
    options:
    - id: a
      texte: '130'
    - id: b
      texte: '205'
    - id: c
      texte: '348'
    bonnes:
    - a
    - b
  indices:
    relance: Un multiple de 5 a un dernier chiffre 0 ou 5. Regarde le dernier chiffre de chaque nombre.
    methode: Vérifie chaque nombre un par un en ne regardant que son dernier chiffre.
    etape: Note le dernier chiffre de chacun des trois nombres, puis compare-le à la règle du multiple de 5.
  pieges:
  - si:
      contient:
      - c
    relance: 348 se termine par 8. Est-ce que 8 vaut 0 ou 5 ?
  - si:
      diagnostic: incomplet
    relance: Il manque un bon nombre. Regarde à nouveau le dernier chiffre de chacun des trois nombres.
  solution: 'Multiples de 5 : 130 (dernier chiffre 0) et 205 (dernier chiffre 5). 348 n''est pas un multiple de 5, car il
    se termine par 8.'
- id: relier-nombres-et-regles
  type: association
  difficulte: 2
  enonce: Relie chaque nombre à la phrase qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: '340'
    - id: b
      texte: '125'
    - id: c
      texte: '76'
    droite:
    - id: x
      texte: Multiple de 2, de 5 et de 10
    - id: y
      texte: Multiple de 5, mais pas de 2
    - id: z
      texte: Multiple de 2, mais pas de 5
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque nombre, regarde seulement son dernier chiffre.
    methode: 'Applique les trois règles : pair pour 2, 0 ou 5 pour 5, 0 pour 10.'
    etape: Un nombre qui se termine par 0 vérifie les trois règles. Cherche lequel des trois nombres se termine par 0.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revois le nombre qui se termine par 6, puis celui qui se termine par 5.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends nombre par nombre : quel est son dernier chiffre, et quelles règles vérifie-t-il ?'
  solution: '340 se termine par 0 : multiple de 2, de 5 et de 10. 125 se termine par 5 : multiple de 5, impair. 76 se termine
    par 6 : pair, mais pas multiple de 5.'
- id: diviseur-trois-de-141
  type: nombre
  difficulte: 2
  enonce: 3 est-il un diviseur de 141 ? Si oui, donne le nombre entier par lequel il faut multiplier 3 pour obtenir 141.
  reponse:
    valeur: 47
    forme: entier
  indices:
    relance: Cherche un nombre entier qui, multiplié par 3, donne 141.
    methode: Essaie 3 × 40, puis ajuste en avançant par tables de 3 jusqu'à atteindre 141.
    etape: 3 × 40 = 120. Il reste 141 - 120 = 21 à ajouter, soit encore 3 × 7.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie ton calcul en multipliant ta réponse par 3 : retrouves-tu bien 141 ?'
  solution: 'Oui, 3 est un diviseur de 141 : 3 × 40 = 120 et 3 × 7 = 21, donc 3 × 47 = 141.'
- id: reste-soixante-par-sept
  type: nombre
  difficulte: 2
  enonce: Pour savoir si 7 est un diviseur de 60, Lina fait la division de 60 par 7. Quel est le reste ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Dans la table de 7, quel est le plus grand résultat qui ne dépasse pas 60 ?
    methode: Trouve ce résultat dans la table de 7, puis calcule l'écart entre lui et 60.
    etape: 7 × 8 = 56, et 7 × 9 = 63 dépasse 60. Combien faut-il ajouter à 56 pour arriver à 60 ?
  pieges:
  - si:
      valeur: 0
    relance: Un reste 0 voudrait dire que 7 est un diviseur de 60. Est-ce que 60 est dans la table de 7 ?
  - si:
      diagnostic: valeur_fausse
    relance: Le reste est toujours plus petit que 7. Repars du plus grand résultat de la table de 7 qui ne dépasse pas 60.
  solution: '7 × 8 = 56 et 60 - 56 = 4. Le reste est 4 : la division ne tombe pas juste, donc 7 n''est pas un diviseur de
    60.'
- id: sachets-de-billes
  type: nombre
  difficulte: 2
  enonce: Léo veut ranger 75 billes dans des sachets contenant tous 5 billes, sans en garder aucune de côté. Combien de sachets
    peut-il faire ?
  reponse:
    valeur: 15
    forme: entier
  indices:
    relance: 75 est-il un multiple de 5 ? Si oui, combien de fois 5 entre-t-il dans 75 ?
    methode: Effectue la division de 75 par 5, ou cherche le nombre qui, multiplié par 5, donne 75.
    etape: 75 se termine par 5, donc 75 est bien un multiple de 5.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: 'Multiplie ta réponse par 5 : retrouves-tu 75 billes en tout ?'
  solution: '75 est un multiple de 5 (dernier chiffre 5) : 75 ÷ 5 = 15, car 5 × 15 = 75. Léo peut faire 15 sachets de 5 billes.'
- id: sachets-de-dix-impossible
  type: choix
  difficulte: 2
  enonce: Léo a aussi 75 billes. Peut-il les ranger dans des sachets de 10 billes, sans en garder aucune de côté ?
  reponse:
    options:
    - id: a
      texte: Oui, car 75 est un multiple de 10.
    - id: b
      texte: Non, car le dernier chiffre de 75 n'est pas 0.
    - id: c
      texte: Oui, car 75 est un multiple de 5.
    bonnes:
    - b
  indices:
    relance: Un multiple de 10 se termine toujours par 0. Regarde le dernier chiffre de 75.
    methode: Compare le dernier chiffre de 75 à la règle du multiple de 10.
    etape: Le dernier chiffre de 75 est 5, pas 0.
  pieges:
  - si:
      contient:
      - a
    relance: 'Relis la règle du multiple de 10 : quel doit être le dernier chiffre ?'
  - si:
      contient:
      - c
    relance: Cette phrase est vraie sur 75 et 5, mais elle ne répond pas à la question posée sur les sachets de 10.
  solution: 'Non : 75 n''est pas un multiple de 10, car son dernier chiffre est 5, pas 0. Il resterait des billes non rangées.'
- id: paquets-a-la-maison
  type: ouverte
  difficulte: 3
  enonce: À la maison, prends 24 petits objets (pâtes, perles, briques). Cherche tous les nombres de 2 à 10 qui permettent
    de faire des paquets égaux sans aucun reste. Écris tes résultats et explique comment tu as fait.
  criteres:
  - L'élève fait de vrais paquets ou utilise les tables de multiplication pour chaque nombre de 2 à 10.
  - L'élève trouve 2, 3, 4, 6 et 8 comme diviseurs de 24.
  - L'élève explique que 5, 7, 9 et 10 laissent un reste, donc ne sont pas des diviseurs de 24.
  indices:
    relance: Avec 24 objets, peux-tu faire des paquets de 2 sans qu'il en reste ?
    methode: Pour chaque nombre de 2 à 10, fais les paquets ou cherche 24 dans la table de ce nombre.
    etape: 'Commence par 2 : 24 est pair. Puis essaie 3 : 3 × 8 = 24. Continue avec 4, 5, 6...'
  solution: 24 = 2 × 12 = 3 × 8 = 4 × 6 = 6 × 4 = 8 × 3. Les diviseurs de 24 entre 2 et 10 sont 2, 3, 4, 6 et 8. Avec 5, 7,
    9 ou 10, il reste des objets.
- id: nblm-pourquoi-dit-on-que-72-est-un-multiple-d-1
  type: choix
  difficulte: 2
  enonce: Pourquoi dit-on que 72 est un multiple de 9 ?
  reponse:
    options:
    - id: o1
      texte: Car 72 est dans la table de multiplication de 9 (8 × 9 = 72).
    - id: o2
      texte: Car 72 est plus petit que 9.
    - id: o3
      texte: Car 72 est un nombre impair.
    - id: o4
      texte: Car si on divise 72 par 9, il reste 2.
    bonnes:
    - o1
  indices:
    relance: Pense à la relation entre multiplication et multiple.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : un multiple d''un nombre entier non nul est toujours supérieur ou égal à ce nombre.'
  - si:
      contient:
      - o3
    relance: 'Erreur de vocabulaire : 72 se termine par 2, c''est donc un nombre pair.'
  - si:
      contient:
      - o4
    relance: 'Erreur de calcul : 72 divisé par 9 égale 8 pile, le reste de la division est 0.'
  solution: 'Car 72 est dans la table de multiplication de 9 (8 × 9 = 72). C''est exact : 72 s''obtient en multipliant 9 par
    l''entier 8.'
- id: nblm-parmi-ces-nombres-lequel-est-un-multiple-2
  type: choix
  difficulte: 2
  enonce: Parmi ces nombres, lequel est un multiple de 2 car c'est un nombre pair ?
  reponse:
    options:
    - id: o1
      texte: '142'
    - id: o2
      texte: '141'
    - id: o3
      texte: '325'
    - id: o4
      texte: '709'
    bonnes:
    - o1
  indices:
    relance: Regarde uniquement le chiffre des unités de chaque nombre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : 141 se termine par 1, c''est un nombre impair, donc il n''est pas divisible par 2.'
  - si:
      contient:
      - o3
    relance: 'Erreur : 325 se termine par 5, il est multiple de 5 mais pas de 2.'
  - si:
      contient:
      - o4
    relance: 'Erreur : 709 se termine par 9, c''est un nombre impair.'
  solution: '142. C''est juste : 142 se termine par 2, c''est donc un nombre pair et un multiple de 2.'
- id: nblm-un-nombre-est-divisible-par-5-si-son-der-3
  type: choix
  difficulte: 2
  enonce: 'Un nombre est divisible par 5 si son dernier chiffre est :'
  reponse:
    options:
    - id: o1
      texte: 0 ou 5
    - id: o2
      texte: Uniquement 0
    - id: o3
      texte: 2, 4, 6 ou 8
    - id: o4
      texte: 1, 3, 7 ou 9
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi comment se terminent tous les résultats dans la table de 5.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incomplet : finir par 0 est le critère pour être divisible par 10. Pour 5, les nombres finissant par 5 conviennent
      aussi.'
  - si:
      contient:
      - o3
    relance: 'Confusion : ce sont les chiffres des unités des nombres pairs.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ces chiffres des unités correspondent à des nombres impairs non multiples de 5.'
  solution: '0 ou 5. C''est exact : les multiples de 5 se terminent toujours par 0 ou 5.'
- id: nblm-lorsqu-on-effectue-la-division-euclidien-4
  type: choix
  difficulte: 2
  enonce: Lorsqu'on effectue la division euclidienne de 141 par 7, on trouve 141 = (7 × 20) + 1. Pourquoi 7 n'est-il pas un
    diviseur de 141 ?
  reponse:
    options:
    - id: o1
      texte: Car le reste de la division est 1 et non 0.
    - id: o2
      texte: Car 141 est plus grand que 7.
    - id: o3
      texte: Car 7 est un chiffre impair.
    - id: o4
      texte: Car le quotient est 20.
    bonnes:
    - o1
  indices:
    relance: Regarde ce qu'il reste à la fin du partage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de raisonnement : un diviseur est toujours plus petit que le nombre qu''il divise.'
  - si:
      contient:
      - o3
    relance: 'Erreur : un nombre impair peut très bien être un diviseur (par exemple 3 divise 141 car 3 × 47 = 141).'
  - si:
      contient:
      - o4
    relance: 'Erreur : la présence d''un quotient ne pose pas problème, c''est le reste non nul qui empêche 7 d''être un diviseur.'
  solution: 'Car le reste de la division est 1 et non 0. C''est exact : pour qu''un nombre soit un diviseur, la division doit
    tomber juste avec un reste égal à 0.'
- id: nblm-fanny-veut-ranger-75-billes-dans-des-sac-5
  type: choix
  difficulte: 2
  enonce: Fanny veut ranger 75 billes dans des sachets égaux sans qu'il ne reste aucune bille. Dans quel type de sachets peut-elle
    les répartir ?
  reponse:
    options:
    - id: o1
      texte: Dans des sachets de 5 billes.
    - id: o2
      texte: Dans des sachets de 2 billes.
    - id: o3
      texte: Dans des sachets de 10 billes.
    - id: o4
      texte: Dans aucun sachet car 75 ne se divise pas.
    bonnes:
    - o1
  indices:
    relance: Observe le dernier chiffre de 75 pour tester la divisibilité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : 75 est un nombre impair (il se termine par 5), il n''est donc pas divisible par 2.'
  - si:
      contient:
      - o3
    relance: 'Erreur de critère : pour être divisible par 10, le nombre doit se terminer par 0.'
  - si:
      contient:
      - o4
    relance: 'Erreur : 75 est divisible par 5 (et aussi par 3).'
  solution: 'Dans des sachets de 5 billes. C''est exact : 75 se termine par 5, c''est donc un multiple de 5 (5 × 15 = 75).'
- id: nblm-si-on-veut-partager-en-groupes-egaux-30-6
  type: choix
  difficulte: 3
  enonce: Si on veut partager en groupes égaux 30 élèves sans laisser aucun élève seul, quelles sont les deux tailles de groupes
    possibles ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Des groupes de 5 élèves.
    - id: o2
      texte: Des groupes de 10 élèves.
    - id: o3
      texte: Des groupes de 4 élèves.
    - id: o4
      texte: Des groupes de 7 élèves.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche les nombres dont 30 est un multiple dans leurs tables.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur de calcul : 30 n''est pas dans la table de 4 (4 × 7 = 28 et 4 × 8 = 32), il resterait 2 élèves.'
  - si:
      contient:
      - o4
    relance: 'Erreur de calcul : 30 n''est pas dans la table de 7 (7 × 4 = 28), il resterait 2 élèves.'
  solution: 'Des groupes de 5 élèves ; Des groupes de 10 élèves. C''est juste : 30 est un multiple de 5 (5 × 6 = 30), il y
    aura 6 groupes égaux sans reste.'
- id: nblm-dans-l-egalite-8-9-72-le-nombre-72-est-u-7
  type: texte_court
  difficulte: 1
  enonce: Dans l'égalité 8 × 9 = 72, le nombre 72 est un multiple de 9, et le nombre 9 est un ... de 72.
  reponse:
    acceptees:
    - diviseur
    fautes_tolerees: 1
  indices:
    relance: C'est le mot de vocabulaire complémentaire de 'multiple'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'diviseur. C''est exact : 9 est un diviseur de 72 car 72 peut être partagé exactement en 8 groupes de 9.'
- id: nblm-un-nombre-dont-le-dernier-chiffre-est-1-8
  type: texte_court
  difficulte: 1
  enonce: Un nombre dont le dernier chiffre est 1, 3, 5, 7 ou 9 n'est pas divisible par 2. On dit que c'est un nombre ...
    .
  reponse:
    acceptees:
    - impair
    fautes_tolerees: 1
  indices:
    relance: C'est l'opposé du mot 'pair'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'impair. C''est exact : un nombre impair ne se termine pas par 0, 2, 4, 6 ou 8 et n''est pas un multiple de 2.'
