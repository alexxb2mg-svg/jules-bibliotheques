format: 2
notion: cm1-sens-et-ecriture-des-fractions
version: 3
etat: verifiee
declencheurs:
- pizza en parts
- gâteau partagé
- numérateur et dénominateur
- plus grand qu'une unité entière
- point sur la droite graduée
- trois quarts de pizza
- nombre du haut et du bas
- parts égales d'une bande
- lire sept quarts
prerequis:
- cm1-numeration-des-entiers
essentiel: 'Une fraction dit combien de parts égales on prend quand on partage une unité (une pizza, une bande de papier,
  un segment). Les parts doivent être égales, sinon ce n''est pas une fraction de l''unité.


  Dans 7/4 (« sept quarts »), le nombre du bas, le dénominateur, dit en combien de parts égales on coupe l''unité : ici 4,
  ce sont des quarts. Le nombre du haut, le numérateur, dit combien de parts on prend : ici 7.


  Pour lire une fraction, on dit le numérateur puis le nom des parts : 1/2 un demi, 2/3 deux tiers, 3/4 trois quarts, 4/5
  quatre cinquièmes, 5/6 cinq sixièmes, et ainsi de suite.


  7/4, c''est 7 fois un quart : 1/4 + 1/4 + 1/4 + 1/4 + 1/4 + 1/4 + 1/4. Quatre quarts font une unité entière (4/4 = 1). Donc
  7/4 = 4/4 + 3/4 = 1 + 3/4 : une pizza entière et trois quarts de pizza. Une fraction peut donc être plus grande que 1.


  On peut aussi faire le chemin inverse : 2 + 1/3, c''est 3/3 + 3/3 + 1/3 = 7/3. On transforme chaque unité en parts, puis
  on compte toutes les parts.


  Une fraction plus grande que 1 peut s''encadrer entre deux nombres entiers qui se suivent : 1 < 7/4 < 2.


  Sur une demi-droite graduée, on place 7/4 en partageant chaque unité en 4 parts égales et en comptant 7 petits intervalles
  depuis 0. À l''inverse, pour repérer un point, on compte les petits intervalles depuis 0 : c''est le numérateur.

  '
methode:
- 'Lire le dénominateur : en combien de parts égales l''unité est-elle partagée ?'
- 'Lire le numérateur : combien de ces parts prend-on ?'
- Regrouper les parts par paquets qui font une unité (par exemple 3/3 = 1) pour trouver combien d'unités entières il y a.
- 'Écrire le reste comme une fraction plus petite que 1 : 14/5 = 5/5 + 5/5 + 4/5 = 2 + 4/5.'
- Vérifier avec un dessin (bande, pizza) ou sur la demi-droite graduée.
vocabulaire:
- terme: fraction
  definition: Une écriture comme 3/4 qui dit combien de parts égales d'une unité on prend.
- terme: numérateur
  definition: 'le nombre du haut : combien de parts on prend'
- terme: dénominateur
  definition: 'le nombre du bas : en combien de parts égales on partage l''unité'
- terme: unité
  definition: Le tout que l'on partage, par exemple une pizza entière ou une bande entière ; elle vaut 1.
- terme: demi-droite graduée
  definition: Une ligne qui part de 0, avec des repères régulièrement espacés pour placer des nombres.
- terme: encadrer
  definition: Trouver deux nombres entiers qui se suivent, l'un plus petit et l'autre plus grand que le nombre donné.
erreurs_frequentes:
- 'Croire qu''une fraction est toujours plus petite que 1 : 7/4 est plus grand que 1.'
- Inverser numérateur et dénominateur (lire 7/4 comme « quatre septièmes »).
- Partager l'unité en parts qui ne sont pas égales sur le dessin.
- Pour écrire 2 + 3/5 en une fraction, additionner 2 et 3 en haut (5/5) au lieu de transformer les unités en cinquièmes.
- Sur la demi-droite graduée, compter les traits au lieu des petits intervalles, ou partager tout le segment au lieu de chaque
  unité.
exemple:
  enonce: Écris 9/4 comme un nombre entier plus une fraction plus petite que 1.
  solution: 4/4 = 1, donc 9/4 = 4/4 + 4/4 + 1/4 = 1 + 1 + 1/4 = 2 + 1/4. 9/4 est entre 2 et 3.
exercices:
- id: numerateur-de-cinq-tiers
  type: nombre
  difficulte: 1
  enonce: Dans la fraction 5/3, quel est le numérateur ?
  reponse:
    valeur: 5
    forme: entier
  indices:
    relance: Le numérateur est le nombre écrit en haut (ou avant la barre /), le dénominateur celui écrit en bas.
    methode: Dans a/b, a est toujours le numérateur.
    etape: Dans a/b, repère quel nombre est écrit en haut de la barre de fraction.
  pieges:
  - si:
      valeur: 3
    relance: 3 est le nombre du bas. Le numérateur est le nombre du haut.
  solution: Dans 5/3, le numérateur est 5.
- id: ecrire-neuf-quarts
  type: nombre
  difficulte: 1
  enonce: Écris sous la forme d'une fraction a/b la quantité correspondant à 9 fois un quart.
  reponse:
    valeur: 9/4
    forme: libre
  indices:
    relance: Un quart s'écrit 1/4. Neuf fois cette quantité s'écrit avec quel numérateur ?
    methode: Compte le nombre total de quarts pris ; ce nombre devient le numérateur, sans changer le dénominateur.
    etape: 1/4 + 1/4 + ... (9 fois) donne un numérateur de 9 sur un dénominateur de 4.
  pieges:
  - si:
      diagnostic: pas_une_fraction
    relance: Écris ta réponse sous la forme a/b, avec deux nombres entiers séparés par une barre de fraction.
  - si:
      diagnostic: valeur_fausse
    relance: Le dénominateur ne change pas quand on compte plusieurs quarts. Combien de quarts au total ?
  solution: 9 fois 1/4 s'écrit 9/4.
- id: decompose-huit-tiers
  type: nombre
  difficulte: 2
  enonce: Écris 8/3 comme la somme d'un nombre entier et d'une fraction plus petite que 1. Donne cette fraction sous la forme
    a/b.
  reponse:
    valeur: 2/3
    forme: fraction_irreductible
  indices:
    relance: Combien de tiers font une unité entière ? Combien d'unités entières peux-tu former avec 8 tiers ?
    methode: 3/3 = 1. Regroupe les tiers de 8/3 par paquets de 3 pour former des unités entières.
    etape: Regroupe les tiers de 8/3 par paquets de 3 (chaque paquet fait une unité), et compte ce qui reste.
  pieges:
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est juste mais peut encore se simplifier.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie combien de tiers il reste après avoir formé 2 unités entières (6 tiers).
  solution: 3/3 = 1, donc 6/3 = 2. Il reste 8/3 - 6/3 = 2/3. Donc 8/3 = 2 + 2/3.
- id: entier-plus-fraction-en-cinquiemes
  type: nombre
  difficulte: 2
  enonce: Écris 2 + 3/5 sous la forme d'une seule fraction a/b.
  reponse:
    valeur: 13/5
    forme: fraction_irreductible
  indices:
    relance: Combien de cinquièmes font une unité entière ?
    methode: Transforme les 2 unités en cinquièmes, puis ajoute les 3 cinquièmes.
    etape: Une unité, c'est 5 cinquièmes. Combien de cinquièmes y a-t-il dans 2 unités ?
  pieges:
  - si:
      valeur: 5/5
    relance: Tu as ajouté 2 et 3 en haut. Il faut d'abord transformer les 2 unités en cinquièmes.
  - si:
      diagnostic: valeur_fausse
    relance: Compte d'abord les cinquièmes contenus dans 2 unités entières, puis ajoute les 3 cinquièmes.
  solution: 1 = 5/5, donc 2 = 10/5. Alors 2 + 3/5 = 10/5 + 3/5 = 13/5 (treize cinquièmes).
- id: reperer-point-en-tiers
  type: nombre
  difficulte: 2
  enonce: Sur une demi-droite graduée, chaque unité est partagée en 3 parts égales. Le point B est placé 5 petits intervalles
    après 0. Quelle fraction repère le point B ? Écris-la sous la forme a/b.
  reponse:
    valeur: 5/3
    forme: fraction_irreductible
  indices:
    relance: Chaque petit intervalle vaut un tiers de l'unité.
    methode: Le dénominateur dit en combien de parts chaque unité est partagée ; le numérateur compte les petits intervalles
      depuis 0.
    etape: Ici, chaque unité est partagée en 3. Combien de tiers y a-t-il entre 0 et le point B ?
  pieges:
  - si:
      valeur: 3/5
    relance: Tu as inversé le numérateur et le dénominateur. Le nombre du bas dit en combien de parts on partage l'unité.
  - si:
      diagnostic: valeur_fausse
    relance: Compte bien les petits intervalles depuis 0, pas les traits, et rappelle-toi qu'une unité contient 3 intervalles.
  solution: 'Chaque petit intervalle vaut 1/3. Le point B est à 5 intervalles de 0 : il est repéré par 5/3, soit 1 + 2/3.'
- id: encadrer-vingt-un-huitiemes
  type: choix
  difficulte: 2
  enonce: Entre quels deux nombres entiers qui se suivent se trouve 21/8 ?
  reponse:
    options:
    - id: a
      texte: entre 1 et 2
    - id: b
      texte: entre 2 et 3
    - id: c
      texte: entre 3 et 4
    bonnes:
    - b
  indices:
    relance: Combien de huitièmes font une unité entière ? Combien d'unités entières y a-t-il dans 21/8 ?
    methode: 8/8 = 1. Cherche combien de fois 8 huitièmes entrent dans 21 huitièmes.
    etape: 16/8 = 2 et 24/8 = 3.
  pieges:
  - si:
      contient:
      - a
    relance: 16/8 vaut déjà 2, donc 21/8 est plus grand que 2.
  - si:
      contient:
      - c
    relance: 24/8 vaut 3. 21/8 est plus petit que 24/8, donc plus petit que 3.
  solution: '8/8 = 1, donc 16/8 = 2 et 24/8 = 3 : 21/8 = 2 + 5/8, il est entre 2 et 3.'
- id: relier-ecritures-neuf-quarts
  type: association
  difficulte: 2
  enonce: Relie chaque écriture à la fraction qu'elle représente.
  reponse:
    gauche:
    - id: a
      texte: neuf quarts
    - id: b
      texte: 5 fois un quart
    - id: c
      texte: trois unités et un tiers
    droite:
    - id: x
      texte: 9/4
    - id: y
      texte: 1 + 1/4
    - id: z
      texte: 10/3
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque phrase, demande-toi d'abord si ce sont des quarts ou des tiers.
    methode: Transforme chaque phrase en écriture avec des nombres, puis compare avec les écritures proposées.
    etape: 5 fois un quart, c'est 5/4, soit 4/4 + 1/4. Une unité, c'est 3/3.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association ne va pas. Vérifie en transformant chaque phrase en fraction.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque phrase et écris-la avec des nombres, en comptant les parts une par une.
  solution: Neuf quarts → 9/4. 5 fois un quart = 5/4 = 4/4 + 1/4 = 1 + 1/4. Trois unités et un tiers = 3/3 + 3/3 + 3/3 + 1/3
    = 10/3.
- id: expliquer-fraction-superieure-un
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi une fraction comme 7/4 peut être plus grande que 1, en donnant un exemple concret. Tu peux aussi
    faire un dessin et le décrire.
  criteres:
  - L'élève explique que 4/4 vaut une unité entière et que 7/4 contient plus de 4 quarts.
  - L'élève donne un exemple concret (pizza, bande de papier) pour illustrer.
  - L'élève écrit 7/4 comme 1 + 3/4 ou l'encadre correctement entre 1 et 2.
  indices:
    relance: Combien de quarts font une unité entière ?
    methode: Compare le numérateur de la fraction (7) au nombre de quarts qui font une unité (4).
    etape: 4/4 = 1 unité entière.
  solution: '7/4 contient 7 quarts, alors que 4 quarts seulement font une unité entière (4/4 = 1). Comme 7 est plus grand
    que 4, il y a plus d''une unité : par exemple, une pizza entière (4 parts) plus 3 quarts d''une autre pizza. Donc 7/4
    = 1 + 3/4, et 7/4 est entre 1 et 2.'
