format: 2
notion: cm1-temps-et-durees
version: 3
etat: generee
declencheurs:
- heure
- minute
- durée
- horloge
- combien de temps
- quelle heure
- aiguilles
- grande aiguille
- temps écoulé
- heure d'arrivée
prerequis:
- cm1-methode-de-resolution-de-problemes
essentiel: 'Une horloge à aiguilles a une petite aiguille, qui montre les heures, et une grande aiguille, qui montre les minutes.
  On sait aussi lire l''heure sur un affichage digital, par exemple 8 h 25 min.


  La grande aiguille fait le tour du cadran en une heure, c''est-à-dire 60 minutes. Entre deux nombres du cadran, il y a 5
  minutes. Quand elle montre le 1, il est 5 minutes ; le 2, 10 minutes ; le 3, 15 minutes, et ainsi de suite.


  Pour placer les aiguilles à une heure donnée, on place d''abord la grande aiguille sur les minutes, puis la petite aiguille
  sur l''heure, un peu après le nombre de l''heure si les minutes avancent.


  Une heure vaut 60 minutes, et non 100. Une demi-heure = 30 minutes, un quart d''heure = 15 minutes, trois-quarts d''heure
  = 45 minutes.


  Il ne faut pas confondre un instant et une durée. Un instant, c''est un moment précis : « la récréation commence à 10 h
  15 min ». Une durée, c''est le temps qui passe entre deux instants : « la récréation dure 15 minutes ».


  Pour calculer une durée entre deux instants, on avance par étapes faciles, en passant par l''heure pile. Par exemple, de
  8 h 52 min à 11 h 37 min : 8 min pour aller à 9 h, puis 2 h pour aller à 11 h, puis 37 min. Cela fait 2 h 45 min.


  Pour comparer deux durées, on les écrit de la même façon : 90 minutes, c''est 1 h 30 min. On peut aussi utiliser un axe
  du temps pour placer des instants et représenter une durée.


  Au cours moyen, on ne pose pas de calcul écrit avec les heures et les minutes : on raisonne par étapes.

  '
methode:
- Repérer l'heure de départ et l'heure d'arrivée (ou la durée donnée).
- Avancer d'abord jusqu'à l'heure pile suivante.
- Avancer ensuite par heures entières, puis par minutes jusqu'à l'instant d'arrivée.
- Additionner les durées de chaque étape pour trouver la durée totale.
- 'Se souvenir qu''une heure vaut 60 minutes : 60 minutes font 1 h, pas 100.'
- Vérifier avec un axe du temps ou une horloge dessinée si besoin.
vocabulaire:
- terme: durée
  definition: le temps écoulé entre deux instants.
- terme: instant
  definition: moment précis, que l'on lit sur une horloge (par exemple 10 h 15 min).
- terme: petite aiguille
  definition: aiguille de l'horloge qui indique les heures.
- terme: grande aiguille
  definition: aiguille de l'horloge qui indique les minutes.
- terme: quart d'heure
  definition: durée de 15 minutes, le quart d'une heure.
- terme: demi-heure
  definition: durée de 30 minutes, la moitié d'une heure.
erreurs_frequentes:
- Compter comme si une heure valait 100 minutes (1 heure = 60 minutes, pas 100).
- Oublier une étape intermédiaire et se tromper de plusieurs minutes.
- Confondre l'heure (un instant) et la durée (un temps écoulé).
- Inverser la petite et la grande aiguille en lisant l'heure.
- Lire le nombre montré par la grande aiguille comme des minutes (le 4 pour 4 minutes au lieu de 20).
exemple:
  enonce: Ismaël est sorti de chez lui à 7 h 47 min. Il est arrivé au travail à 8 h 16 min. Combien de temps a-t-il mis ?
  solution: 'De 7 h 47 min à 8 h : 13 minutes. De 8 h à 8 h 16 min : 16 minutes. 13 + 16 = 29 minutes.'
exercices:
- id: combien-minutes-demi-heure
  type: nombre
  difficulte: 1
  enonce: Une demi-heure, c'est combien de minutes ?
  reponse:
    valeur: 30
    forme: entier
  indices:
    relance: Un quart d'heure vaut 15 minutes. Une demi-heure vaut deux quarts d'heure.
    methode: Double le nombre de minutes d'un quart d'heure pour obtenir une demi-heure.
    etape: 15 + 15 = ?
  pieges:
  - si:
      valeur: 50
    relance: Une heure ne vaut pas 100 minutes mais 60 minutes ; une demi-heure en est donc la moitié.
  solution: Une demi-heure = 30 minutes (2 × 15 min).
- id: lire-grande-aiguille
  type: nombre
  difficulte: 1
  enonce: Sur une horloge, la grande aiguille est pointée sur le 4. Combien de minutes indique-t-elle ?
  reponse:
    valeur: 20
    forme: entier
  indices:
    relance: La grande aiguille indique les minutes. Entre deux nombres du cadran, il y a 5 minutes.
    methode: Compte de 5 en 5 depuis le 12 jusqu'au nombre montré par la grande aiguille.
    etape: Sur le 1, il est 5 minutes ; sur le 2, 10 minutes ; continue jusqu'au 4.
  pieges:
  - si:
      valeur: 4
    relance: La grande aiguille ne compte pas les minutes une par une. Entre deux nombres du cadran, il y a 5 minutes.
  solution: 'La grande aiguille avance de 5 minutes à chaque nombre : 4 × 5 = 20. Elle indique 20 minutes.'
- id: combien-minutes-trois-quarts
  type: nombre
  difficulte: 1
  enonce: Trois-quarts d'heure, c'est combien de minutes ?
  reponse:
    valeur: 45
    forme: entier
  indices:
    relance: Un quart d'heure vaut 15 minutes. Trois-quarts d'heure vaut trois fois cette durée.
    methode: Multiplie le nombre de minutes d'un quart d'heure par 3.
    etape: 15 × 3 = ?
  pieges:
  - si:
      valeur: 75
    relance: Vérifie ta multiplication ; trois-quarts d'heure est plus court qu'une heure entière (60 minutes).
  solution: Trois-quarts d'heure = 45 minutes (3 × 15 min).
- id: placer-grande-aiguille
  type: association
  difficulte: 2
  enonce: On veut régler une horloge. Relie chaque heure au nombre du cadran sur lequel il faut placer la grande aiguille.
  reponse:
    gauche:
    - id: h-8-05
      texte: 8 h 05 min
    - id: h-8-15
      texte: 8 h 15 min
    - id: h-8-30
      texte: 8 h 30 min
    - id: h-8-45
      texte: 8 h 45 min
    droite:
    - id: sur-1
      texte: sur le 1
    - id: sur-3
      texte: sur le 3
    - id: sur-6
      texte: sur le 6
    - id: sur-9
      texte: sur le 9
    paires:
      h-8-05: sur-1
      h-8-15: sur-3
      h-8-30: sur-6
      h-8-45: sur-9
  indices:
    relance: La grande aiguille montre les minutes, et chaque nombre du cadran vaut 5 minutes de plus que le précédent.
    methode: Pour chaque heure, cherche combien de fois 5 minutes il y a dans le nombre de minutes.
    etape: À 8 h 05 min, la grande aiguille a avancé d'un seul pas de 5 minutes depuis le 12.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compte de 5 en 5 depuis le 12 pour chaque heure.
  - si:
      diagnostic: associations_fausses
    relance: Ne lis pas les minutes directement sur les nombres du cadran. Chaque nombre vaut 5 minutes.
  solution: 8 h 05 min → sur le 1 ; 8 h 15 min → sur le 3 (un quart d'heure) ; 8 h 30 min → sur le 6 (une demi-heure) ; 8
    h 45 min → sur le 9 (trois-quarts d'heure).
- id: duree-trajet-ismael
  type: nombre
  difficulte: 2
  enonce: Ismaël est sorti de chez lui à 7 h 38 min. Il est arrivé au travail à 8 h 14 min. Combien de minutes a-t-il mis
    pour ce trajet ?
  reponse:
    valeur: 36
    forme: entier
  indices:
    relance: Avance d'abord de 7 h 38 min jusqu'à 8 h, puis de 8 h jusqu'à 8 h 14 min.
    methode: Calcule chaque étape séparément, puis additionne les deux durées.
    etape: De 7 h 38 min à 8 h, combien de minutes ? Puis de 8 h à 8 h 14 min, combien de minutes ?
  pieges:
  - si:
      valeur: 76
    relance: As-tu compté comme si une heure valait 100 minutes ? Passe par 8 h pile.
  - si:
      valeur: 14
    relance: 14 minutes, c'est seulement après 8 h. Il faut aussi compter le temps entre 7 h 38 min et 8 h.
  solution: 'De 7 h 38 min à 8 h : 22 minutes. De 8 h à 8 h 14 min : 14 minutes. 22 + 14 = 36 minutes.'
- id: comparer-deux-films
  type: choix
  difficulte: 2
  enonce: Le film A dure 1 h 25 min. Le film B dure 90 minutes. Que peut-on dire ?
  reponse:
    options:
    - id: a
      texte: Le film A est le plus long
    - id: b
      texte: Le film B est le plus long
    - id: c
      texte: Les deux films ont la même durée
    bonnes:
    - b
  indices:
    relance: Pour comparer, il faut écrire les deux durées de la même façon.
    methode: Transforme 90 minutes en heures et minutes, en te rappelant qu'une heure vaut 60 minutes.
    etape: 90 minutes, c'est 60 minutes et encore 30 minutes. Compare avec 1 h 25 min.
  pieges:
  - si:
      contient:
      - a
    relance: As-tu compté une heure comme 100 minutes ? Une heure vaut 60 minutes ; convertis 90 minutes avant de comparer.
  - si:
      contient:
      - c
    relance: Les deux durées ne sont pas égales. Convertis 90 minutes en heures et minutes, puis compare les minutes.
  solution: '90 min = 60 min + 30 min = 1 h 30 min. Or 1 h 30 min est plus long que 1 h 25 min : le film B est le plus long,
    de 5 minutes.'
- id: heure-depart-course
  type: texte_court
  difficulte: 2
  enonce: Lucie a mis 1 h 17 min pour la première étape d'une course. Elle a franchi l'arrivée de cette étape à 12 h 10 min.
    À quelle heure est-elle partie ? Réponds au format « H h MM min », par exemple « 9 h 05 min ».
  reponse:
    acceptees:
    - 10 h 53 min
    - 10h53min
    - 10h53
    - 10 h 53
    fautes_tolerees: 0
  indices:
    relance: Retire d'abord 10 minutes pour atteindre midi pile, puis continue à reculer.
    methode: Avance à reculons par étapes faciles, en passant par une heure pile, puis retire le reste de la durée.
    etape: 12 h 10 min moins 10 min donne midi pile ; il reste ensuite à retirer le reste de la durée totale.
  pieges:
  - si:
      valeur: 11 h 23 min
    relance: Vérifie chaque étape du calcul à reculons ; il semble manquer une étape dans ton raisonnement.
  solution: 12 h 10 min − 10 min = 12 h ; 12 h − 7 min = 11 h 53 min ; 11 h 53 min − 1 h = 10 h 53 min. Elle est partie à
    10 h 53 min.
- id: heure-arrivee-deuxieme-gare
  type: texte_court
  difficulte: 3
  enonce: Le train part à 7 h 43 min. Il met 1 h 34 min pour la première gare, puis 52 min de plus pour la deuxième gare.
    À quelle heure arrive-t-il à la deuxième gare ? Réponds au format « H h MM min ».
  reponse:
    acceptees:
    - 10 h 09 min
    - 10h09min
    - 10 h 9 min
    - 10h9min
    - 10 h 09
    - 10h09
    fautes_tolerees: 0
  indices:
    relance: Calcule d'abord l'heure d'arrivée à la première gare, puis ajoute la deuxième durée.
    methode: Additionne d'abord la première durée à l'heure de départ, puis ajoute la deuxième durée au résultat obtenu.
    etape: 7 h 43 min plus 1 h 34 min donne l'heure de la première gare ; il reste ensuite à ajouter la deuxième durée à ce
      résultat.
  pieges:
  - si:
      valeur: 9 h 17 min
    relance: Cette heure correspond seulement à l'arrivée à la première gare. N'oublie pas d'ajouter la deuxième durée du
      trajet.
  solution: 7 h 43 min + 1 h 34 min = 9 h 17 min (première gare). 9 h 17 min + 52 min = 10 h 9 min (deuxième gare).
- id: expliquer-calcul-duree-etapes
  type: ouverte
  difficulte: 3
  enonce: Explique comment tu calcules une durée entre deux instants en heures et minutes, sans poser de calcul écrit.
  criteres:
  - L'élève explique qu'il avance par étapes, en passant par un instant intermédiaire facile (l'heure pile).
  - L'élève explique qu'il additionne les durées de chaque étape pour obtenir la durée totale.
  - L'élève mentionne qu'une heure vaut 60 minutes, pas 100, pour éviter une erreur de base.
  indices:
    relance: Par quel instant intermédiaire passes-tu souvent pour simplifier un calcul de durée ?
    methode: Explique comment tu découpes le calcul en petites étapes plus faciles, avant de tout additionner.
    etape: Pense à préciser pourquoi 1 heure ne vaut pas 100 minutes mais 60 minutes.
  solution: 'Pour calculer une durée, j''avance par étapes faciles, en passant souvent par une heure pile comme instant intermédiaire.
    Je calcule chaque étape séparément, puis j''additionne toutes les durées pour trouver la durée totale. Il faut faire attention
    : une heure vaut 60 minutes, pas 100, donc je ne peux pas calculer comme avec les nombres habituels.'
