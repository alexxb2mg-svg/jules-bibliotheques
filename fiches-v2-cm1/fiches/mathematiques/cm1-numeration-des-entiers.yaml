- id: nblm-on-situe-un-point-sur-la-droite-graduee-5
  type: choix
  difficulte: 2
  enonce: On situe un point sur la droite graduée de 100 en 100, placé 3 graduations après 400. Quel est ce nombre ?
  reponse:
