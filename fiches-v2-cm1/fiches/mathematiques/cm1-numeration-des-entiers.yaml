    - id: o1
      texte: '700'
    - id: o2
      texte: '403'
    - id: o3
      texte: '430'
    - id: o4
      texte: '300'
    bonnes:
    - o1
  indices:
    relance: Chaque graduation vaut 100. Calcule 400 + (3 × 100).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : compter de 1 en 1 au lieu d''avancer de 100 en 100 à chaque graduation.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : cela correspondrait à compter de 10 en 10 sur la droite graduée.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : 300 est la valeur du saut (3 × 100), pas le nombre atteint sur la droite graduée.'
  solution: '700. C''est exact : 3 graduations de 100 ajoutent 300 à 400, ce qui donne 400 + 300 = 700.'
- id: nblm-si-l-on-cherche-a-ranger-du-plus-petit-a-6
  type: choix
  difficulte: 3
  enonce: Si l'on cherche à ranger du plus petit au plus grand les nombres 4 057, 4 075, 4 705 et 4 750, quelles sont les
    deux affirmations exactes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: 4 057 est le plus petit nombre de la liste.
    - id: o2
      texte: 4 750 est le plus grand nombre de la liste.
    - id: o3
      texte: 4 705 est plus petit que 4 075.
    - id: o4
      texte: L'ordre obtenu est 4 750 < 4 705 < 4 075 < 4 057.
    bonnes:
    - o1
    - o2
  indices:
    relance: Ranger du plus petit au plus grand s'appelle l'ordre croissant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : 4 705 a 7 centaines alors que 4 075 en a 0, donc 4 705 est plus grand.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : ceci correspond à l''ordre décroissant (du plus grand au plus petit).'
  solution: '4 057 est le plus petit nombre de la liste ; 4 750 est le plus grand nombre de la liste. C''est exact : 4 057
    a 0 centaine et 5 dizaines, c''est la valeur la plus petite.'
