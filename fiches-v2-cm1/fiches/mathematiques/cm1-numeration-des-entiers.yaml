format: 2
notion: cm1-numeration-des-entiers
version: 1
etat: verifiee
declencheurs:
- ranger du plus petit
- chiffre des centaines
- lequel est le plus grand
- plus grand nombre
- point sur la droite
- décomposition additive
prerequis: []
essentiel: 'Un nombre entier s''écrit avec des chiffres. La position de chaque chiffre lui donne sa valeur : à partir de la
  droite, ce sont les unités, puis les dizaines, les centaines, les milliers, les dizaines de milliers, les centaines de milliers.

  Un même nombre peut s''écrire de plusieurs façons : en chiffres (3 405), en unités de numération (3 milliers 4 centaines
  5 unités), ou en décomposition additive (3 000 + 400 + 5).

  Pour comparer deux nombres, on regarde d''abord combien ils ont de chiffres : le nombre qui en a le plus est le plus grand.
  S''ils en ont autant, on compare chiffre par chiffre en partant de la gauche, et on s''arrête au premier chiffre différent.

  On utilise les signes = (égal à), < (inférieur à, plus petit) et > (supérieur à, plus grand).'
methode:
- 'Compter le nombre de chiffres : le nombre avec le plus de chiffres est le plus grand.'
- Si les deux nombres ont autant de chiffres, comparer chiffre par chiffre à partir de la gauche.
- 'S''arrêter au premier chiffre différent : celui qui a le chiffre le plus grand à cette position l''emporte.'
- 'Pour ranger plusieurs nombres : comparer les deux premiers, puis insérer les suivants un par un.'
- Pour décomposer un nombre, écrire la valeur de chaque chiffre non nul, du plus grand rang au plus petit.
erreurs_frequentes:
- Croire qu'un nombre qui commence par un grand chiffre est toujours le plus grand, sans compter le nombre de chiffres.
- Confondre le sens des symboles < et >.
- Oublier un rang dans une décomposition additive.
exemple:
  enonce: 'Range dans l''ordre croissant : 4 705 ; 4 075 ; 4 750 ; 4 057.'
  solution: 'Les quatre nombres ont 4 chiffres et commencent tous par 4. Au chiffre des centaines : 0 (pour 4 075 et 4 057)
    puis 7 (pour 4 705 et 4 750). Entre 4 075 et 4 057, le chiffre des dizaines les distingue : 5 < 7. Entre 4 705 et 4 750,
    le chiffre des dizaines les distingue aussi : 0 < 5. Ordre croissant : 4 057 < 4 075 < 4 705 < 4 750.'
exercices:
- id: valeur-chiffre-billes
  type: nombre
  difficulte: 1
  enonce: Une caisse contient 3 405 billes. Quelle est la valeur du chiffre 4 dans ce nombre ?
  reponse:
    valeur: 400
    forme: entier
  indices:
    relance: Le chiffre 4 n'est pas à la place des unités. À quelle place est-il dans 3 405 ?
    methode: 'Repère la position du chiffre 4 en partant de la droite : unités, dizaines, centaines, milliers.'
    etape: Dans 3 405, le chiffre 4 est à la place des centaines.
  pieges:
  - si:
      valeur: 4
    relance: 4 est le chiffre écrit, mais sa place dans le nombre lui donne une valeur plus grande. Laquelle ?
  - si:
      valeur: 40
    relance: 'Regarde bien : le chiffre 4 est-il à la place des dizaines ou des centaines dans 3 405 ?'
  solution: 'Dans 3 405, le chiffre 4 est à la place des centaines : sa valeur est donc 400 (4 centaines).'
- id: symbole-comparaison-club
  type: choix
  difficulte: 1
  enonce: Un club compte 3 199 adhérents une année, puis 3 209 l'année suivante. Quel symbole complète « 3 199 … 3 209 » ?
  reponse:
    options:
    - id: a
      texte: <
    - id: b
      texte: '>'
    - id: c
      texte: '='
    bonnes:
    - a
  indices:
    relance: Les deux nombres ont 4 chiffres et commencent par « 3 1... » et « 3 2... ». Lequel est le plus loin sur la droite
      des nombres ?
    methode: Compare chiffre par chiffre à partir de la gauche. Les deux nombres sont identiques sauf à un rang.
    etape: Au chiffre des centaines, 1 (dans 3 199) est plus petit que 2 (dans 3 209).
  pieges:
  - si:
      contient:
      - b
    relance: '> signifie « supérieur à ». Le premier nombre est-il vraiment plus grand que le second ?'
  - si:
      contient:
      - c
    relance: Les deux nombres ne sont pas identiques, compare leurs chiffres des centaines.
  solution: 3 199 < 3 209, car au chiffre des centaines, 1 est inférieur à 2.
- id: chiffre-centaines-licencies
  type: texte_court
  difficulte: 1
  enonce: Un club sportif compte 4 057 licenciés. Quel est le chiffre des centaines dans ce nombre ?
  reponse:
    acceptees:
    - '0'
    fautes_tolerees: 0
  indices:
    relance: 'Repère les rangs à partir de la droite : unités, dizaines, centaines, milliers.'
    methode: Dans 4 057, compte trois rangs en partant de la droite pour trouver le chiffre des centaines.
    etape: '4 057 : le chiffre des unités est 7, celui des dizaines est 5. Le rang suivant est celui des centaines.'
  pieges:
  - si:
      valeur: '4'
    relance: 4 est le chiffre des milliers, pas des centaines. Cherche un rang plus proche de la droite.
  - si:
      valeur: '5'
    relance: 5 est le chiffre des dizaines. Le chiffre des centaines est juste avant, à gauche.
  solution: Dans 4 057, le chiffre des centaines est 0.
- id: ranger-quatre-nombres
  type: ordre
  difficulte: 2
  enonce: Range ces nombres du plus petit au plus grand.
  reponse:
    elements:
    - id: n4057
      texte: 4 057
    - id: n4075
      texte: 4 075
    - id: n4705
      texte: 4 705
    - id: n4750
      texte: 4 750
  indices:
    relance: Les quatre nombres ont 4 chiffres et commencent tous par 4. Compare ensuite le chiffre des centaines.
    methode: Range d'abord ceux qui ont 0 au chiffre des centaines, puis ceux qui ont 7.
    etape: 4 057 et 4 075 ont 0 aux centaines ; compare ensuite leur chiffre des dizaines pour les départager.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux nombres voisins sont inversés. Compare leur chiffre des dizaines.
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le chiffre des centaines de chaque nombre, puis range-les par ce chiffre.
  solution: 'Ordre croissant : 4 057 < 4 075 < 4 705 < 4 750, car au chiffre des centaines on trouve 0 puis 7, et au chiffre
    des dizaines 5 puis 7 ou 0 puis 5.'
- id: relier-nombre-decomposition
  type: association
  difficulte: 2
  enonce: Relie chaque nombre à sa décomposition additive.
  reponse:
    gauche:
    - id: a
      texte: 6 208
    - id: b
      texte: 3 405
    - id: c
      texte: 2 010
    droite:
    - id: x
      texte: 6 000 + 200 + 8
    - id: y
      texte: 3 000 + 400 + 5
    - id: z
      texte: 2 000 + 10
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Repère d'abord le chiffre des milliers de chaque nombre pour éliminer les décompositions impossibles.
    methode: Décompose chaque nombre rang par rang (milliers, centaines, dizaines, unités), en gardant seulement les rangs
      non nuls.
    etape: 6 208 a 6 milliers, 2 centaines, 0 dizaine et 8 unités.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque nombre et compte ses milliers, centaines, dizaines et unités.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le nombre qui a le moins de rangs non nuls, 2 010, puis fais les deux autres.
  solution: 6 208 = 6 000 + 200 + 8 ; 3 405 = 3 000 + 400 + 5 ; 2 010 = 2 000 + 10.
- id: expliquer-comparaison-tailles
  type: ouverte
  difficulte: 3
  enonce: Explique en deux phrases comment comparer 950 et 1 200, qui n'ont pas le même nombre de chiffres.
  criteres:
  - L'élève dit qu'il faut d'abord compter le nombre de chiffres de chaque nombre.
  - L'élève conclut que le nombre qui a le plus de chiffres est le plus grand, donc 1 200 est plus grand que 950.
  indices:
    relance: Combien de chiffres a 950 ? Combien en a 1 200 ?
    methode: Compare d'abord le nombre de chiffres des deux nombres, avant de comparer chiffre par chiffre.
    etape: 950 s'écrit avec 3 chiffres.
  solution: 950 a 3 chiffres et 1 200 en a 4. Un nombre qui a plus de chiffres qu'un autre est toujours plus grand ; donc
    1 200 est plus grand que 950.
