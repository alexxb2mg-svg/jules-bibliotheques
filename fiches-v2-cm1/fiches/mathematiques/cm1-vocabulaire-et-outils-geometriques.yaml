# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-vocabulaire-et-outils-geometriques
version: 2
etat: generee
declencheurs:
- tracer un cercle
- vérifier un angle droit
- droites qui ne se croisent jamais
- pointe du compas
- mesurer avec la règle
- rayon du cercle
- disque ou cercle
- deux droites parallèles
- se coupent à angle droit
prerequis: []
essentiel: 'En géométrie, on utilise des mots précis. Un point se nomme avec une lettre majuscule. Une droite est un trait
  droit qui ne s''arrête jamais. Un segment est un morceau de droite limité par deux points, par exemple le segment [AB].
  Une demi-droite part d''un point et ne s''arrête pas de l''autre côté. Le milieu d''un segment est le point qui le coupe
  en deux parties de même longueur.


  On utilise quatre outils. La règle sert à tracer des droites et des segments. La règle graduée sert à mesurer des longueurs.
  L''équerre sert à tracer et à vérifier les angles droits. Le compas sert à tracer des cercles, et aussi à reporter une longueur.


  On utilise aussi des codes sur les figures. Un petit carré dans le coin d''un angle veut dire que l''angle est droit. Des
  petits traits identiques sur deux segments veulent dire qu''ils ont la même longueur.


  Un cercle de centre A, c''est tous les points situés à la même distance de A. Cette distance s''appelle le rayon. Le disque
  de centre A et de rayon 4 cm, c''est tous les points situés à 4 cm de A au plus : le contour et tout l''intérieur. Le cercle
  est le bord ; le disque est la surface.


  Deux droites sécantes se coupent en un point. Si elles se coupent en formant un angle droit, elles sont perpendiculaires.
  Deux droites parallèles ne se coupent jamais, même si on les prolonge. Exemple : les deux bords d''une règle sont parallèles.


  Si deux droites sont perpendiculaires à une même troisième droite, alors elles sont parallèles entre elles.

  '
methode:
- Nommer précisément les objets (point, droite, segment, demi-droite) avec le vocabulaire officiel.
- 'Choisir le bon outil : règle pour tracer, règle graduée pour mesurer, équerre pour les angles droits, compas pour les cercles.'
- Lire les codes de la figure (petit carré, petits traits) avant de répondre.
- Pour vérifier une perpendicularité, poser l'équerre ; pour comparer deux longueurs, utiliser le compas ou la règle graduée
  plutôt que l'œil.
- Pour savoir si deux droites sont parallèles, les prolonger ou vérifier qu'elles sont perpendiculaires à une même droite.
vocabulaire:
- terme: segment
  definition: Un morceau de droite limité par deux points, ses extrémités.
- terme: droites sécantes
  definition: Deux droites qui se coupent en un point.
- terme: droites perpendiculaires
  definition: Deux droites qui se coupent en formant un angle droit.
- terme: droites parallèles
  definition: Deux droites qui ne se coupent jamais.
- terme: cercle
  definition: Tous les points situés à la même distance d'un point appelé centre.
- terme: rayon
  definition: La distance entre le centre d'un cercle et un point du cercle.
- terme: disque
  definition: La surface formée par un cercle et tout son intérieur.
erreurs_frequentes:
- Dire que deux droites sont parallèles seulement parce qu'elles ne se coupent pas sur la feuille.
- Confondre cercle (le contour) et disque (la surface).
- Ne pas vérifier une perpendicularité à l'équerre alors que ce n'est pas évident.
- Croire que deux droites sécantes sont toujours perpendiculaires.
- Ne pas tenir compte des codes (petit carré, petits traits) dessinés sur la figure.
exemple:
  enonce: Deux droites sont toutes les deux perpendiculaires à une même droite d. Que peut-on dire d'elles ?
  solution: Elles sont parallèles entre elles, car deux droites perpendiculaires à une même droite sont parallèles. On peut
    le vérifier en posant l'équerre le long de la droite d.
exercices:
- id: outil-pour-cercle
  type: texte_court
  difficulte: 1
  enonce: Quel outil utilises-tu pour tracer un cercle ?
  reponse:
    acceptees:
    - compas
    fautes_tolerees: 1
  indices:
    relance: Cet outil a une pointe et une mine, et on l'ouvre pour choisir la taille du cercle.
    methode: Pense à l'outil qui a une pointe qu'on plante sur le papier, et une mine qui tourne autour.
    etape: 'Ce n''est ni la règle ni l''équerre : cherche l''outil qui tourne autour d''un point fixe.'
  pieges:
  - si:
      valeur: règle
    relance: La règle sert à tracer des droites, pas des cercles. Quel autre outil connais-tu ?
  - si:
      valeur: équerre
    relance: L'équerre sert à vérifier les angles droits, pas à tracer des cercles.
  solution: 'On utilise le compas : on plante la pointe au centre et on fait tourner la mine autour.'
- id: outil-angle-droit
  type: choix
  difficulte: 1
  enonce: Quel outil sert à vérifier qu'un angle est droit ?
  reponse:
    options:
    - id: a
      texte: L'équerre
    - id: b
      texte: Le compas
    - id: c
      texte: La règle graduée
    bonnes:
    - a
  indices:
    relance: Cet outil a la forme d'un triangle avec un coin bien précis.
    methode: Pense à l'outil qu'on pose contre les deux côtés d'un angle pour voir s'il correspond à son coin.
    etape: Ce n'est pas l'outil qui trace les cercles, ni celui qui mesure les longueurs.
  pieges:
  - si:
      contient:
      - b
    relance: Le compas sert à tracer des cercles, pas à vérifier des angles.
  - si:
      contient:
      - c
    relance: La règle graduée sert à mesurer des longueurs, pas des angles.
  solution: 'C''est l''équerre : on pose son coin sur l''angle pour vérifier qu''il est droit.'
- id: code-petits-traits
  type: choix
  difficulte: 1
  enonce: Sur une figure, les segments [AB] et [CD] portent chacun le même petit trait. Que veut dire ce code ?
  reponse:
    options:
    - id: a
      texte: Les deux segments ont la même longueur.
    - id: b
      texte: Les deux segments sont perpendiculaires.
    - id: c
      texte: Les deux segments sont parallèles.
    bonnes:
    - a
  indices:
    relance: Quel est le code de l'angle droit ? Le petit trait est-il le même code ?
    methode: 'Rappelle-toi les deux codes usuels : le petit carré dans un coin, et les petits traits identiques sur des segments.'
    etape: Le petit carré sert pour les angles droits. Les petits traits identiques servent pour autre chose.
  pieges:
  - si:
      contient:
      - b
    relance: Pour dire que deux traits sont perpendiculaires, on dessine un petit carré dans le coin, pas un petit trait.
  - si:
      contient:
      - c
    relance: Les petits traits ne parlent pas de droites parallèles. Que comparent-ils entre les deux segments ?
  solution: 'Des petits traits identiques sur deux segments veulent dire qu''ils ont la même longueur : AB = CD.'
- id: trouver-le-rayon
  type: nombre
  difficulte: 2
  enonce: Un cercle a pour centre le point A. Un point B du cercle est à 6 cm de A. Quel est le rayon de ce cercle, en cm
    ?
  reponse:
    valeur: 6
    forme: entier
  indices:
    relance: Le rayon, c'est la distance entre le centre et un point du cercle.
    methode: Retrouve dans l'énoncé la distance entre le centre A et le point B, qui est sur le cercle.
    etape: Le point B est sur le cercle, donc sa distance à A donne directement le rayon.
  pieges:
  - si:
      valeur: 3
    relance: Tu as peut-être divisé par deux. Le rayon est la distance donnée entre A et B, sans la diviser.
  - si:
      valeur: 12
    relance: 'Tu as peut-être doublé la distance. Relis : quelle est la distance entre A et B ?'
  solution: 'Le rayon est la distance entre le centre et un point du cercle : ici, 6 cm.'
- id: point-dans-le-disque
  type: choix
  difficulte: 2
  enonce: Un cercle a pour centre O et pour rayon 4 cm. Le point M est à 2 cm de O. Où se trouve le point M ?
  reponse:
    options:
    - id: a
      texte: Sur le cercle
    - id: b
      texte: Dans le disque, à l'intérieur du cercle
    - id: c
      texte: En dehors du disque
    bonnes:
    - b
  indices:
    relance: Compare la distance de M au centre avec le rayon. Laquelle est la plus petite ?
    methode: Un point est sur le cercle s'il est exactement à la distance du rayon. S'il est plus près du centre, ou plus
      loin, ce n'est pas le cas.
    etape: Le rayon mesure 4 cm. M est à 2 cm de O, donc M est plus près du centre que les points du cercle.
  pieges:
  - si:
      contient:
      - a
    relance: Pour être sur le cercle, M devrait être à 4 cm de O. Est-ce le cas ?
  - si:
      contient:
      - c
    relance: M est à 2 cm du centre, et le rayon fait 4 cm. M est-il plus près ou plus loin que le bord ?
  solution: 'M est à 2 cm de O, ce qui est moins que le rayon de 4 cm. M n''est pas sur le cercle : il est dans le disque,
    à l''intérieur du cercle.'
- id: construire-un-cercle
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour tracer, au compas, un cercle de centre A et de rayon 3 cm.
  reponse:
    elements:
    - id: ecarter
      texte: Écarter le compas de 3 cm entre la pointe et la mine, avec la règle graduée
    - id: piquer
      texte: Planter la pointe du compas sur le point A
    - id: tourner
      texte: Faire tourner le compas d'un tour complet pour tracer le cercle
  indices:
    relance: Peux-tu tracer le cercle avant d'avoir réglé l'écartement du compas ?
    methode: Il faut d'abord préparer l'outil (l'écartement), puis le positionner, puis tracer.
    etape: La toute première étape se fait avec la règle graduée, avant même de toucher le papier avec la pointe.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Doit-on planter la pointe avant ou après avoir réglé l'écartement ?
  - si:
      diagnostic: ordre_faux
    relance: Repense à ce qui doit être prêt avant de poser la pointe du compas sur le papier.
  solution: On écarte d'abord le compas de 3 cm avec la règle graduée, puis on plante la pointe en A, puis on fait tourner
    le compas.
- id: outils-et-usages
  type: association
  difficulte: 2
  enonce: Relie chaque outil à ce qu'il permet de faire.
  reponse:
    gauche:
    - id: a
      texte: Règle
    - id: b
      texte: Règle graduée
    - id: c
      texte: Équerre
    - id: d
      texte: Compas
    droite:
    - id: x
      texte: Tracer une droite
    - id: y
      texte: Mesurer une longueur
    - id: z
      texte: Vérifier un angle droit
    - id: w
      texte: Tracer un cercle
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: 'Deux outils se ressemblent (règle et règle graduée) : lequel a des graduations pour mesurer ?'
    methode: 'Associe d''abord les outils que tu reconnais bien : le compas pour les cercles, l''équerre pour les angles droits.'
    etape: 'Il reste alors la règle et la règle graduée : seule la règle graduée porte des chiffres pour mesurer.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout la règle et la règle graduée.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends outil par outil : à quoi sert-il précisément ?'
  solution: Règle → tracer une droite ; règle graduée → mesurer une longueur ; équerre → vérifier un angle droit ; compas
    → tracer un cercle.
- id: droites-et-leurs-noms
  type: association
  difficulte: 3
  enonce: Relie chaque description au mot qui lui correspond.
  reponse:
    gauche:
    - id: coupent-angle-droit
      texte: Deux droites qui se coupent en formant un angle droit
    - id: jamais
      texte: Deux droites qui ne se coupent jamais
    - id: coupent-sans-angle-droit
      texte: Deux droites qui se coupent sans former d'angle droit
    droite:
    - id: perpendiculaires
      texte: Droites perpendiculaires
    - id: paralleles
      texte: Droites parallèles
    - id: secantes
      texte: Droites sécantes, mais pas perpendiculaires
    paires:
      coupent-angle-droit: perpendiculaires
      jamais: paralleles
      coupent-sans-angle-droit: secantes
  indices:
    relance: Les droites se coupent-elles ? Si oui, forment-elles un angle droit ?
    methode: Sépare d'abord les droites qui ne se coupent jamais, puis regarde l'angle formé par celles qui se coupent.
    etape: Des droites qui ne se coupent jamais, même prolongées, ont un nom bien à elles.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Revois les deux descriptions où les droites se coupent.
  - si:
      diagnostic: associations_fausses
    relance: 'Commence par la question : les droites se coupent-elles, oui ou non ?'
  solution: Se coupent en formant un angle droit → perpendiculaires ; ne se coupent jamais → parallèles ; se coupent sans
    angle droit → sécantes, mais pas perpendiculaires.
- id: expliquer-cercle-disque
  type: ouverte
  difficulte: 3
  enonce: Explique, avec tes mots, la différence entre un cercle et un disque de même centre et de même rayon. Tu peux faire
    un dessin au compas et le décrire.
  criteres:
  - L'élève dit que le cercle est l'ensemble des points situés exactement à la distance du rayon du centre.
  - L'élève dit que le disque contient aussi tous les points situés à une distance inférieure ou égale au rayon.
  - L'élève utilise correctement les mots centre et rayon, ou donne un exemple chiffré juste.
  indices:
    relance: Lequel des deux, le cercle ou le disque, est juste le contour ?
    methode: Pense au trait tracé au compas (le contour) et à toute la surface qu'il entoure.
    etape: Le cercle, c'est seulement le trait. Le disque, c'est le trait et tout l'intérieur.
  solution: 'Le cercle est seulement le contour : les points situés exactement à la distance du rayon du centre. Le disque
    contient en plus tous les points à l''intérieur, à une distance inférieure ou égale au rayon.'
- id: nblm-quel-outil-geometrique-utilise-t-on-pour-1
  type: choix
  difficulte: 2
  enonce: Quel outil géométrique utilise-t-on pour tracer un cercle parfait ?
  reponse:
    options:
    - id: o1
      texte: Le compas
    - id: o2
      texte: La règle graduée
    - id: o3
      texte: L'équerre
    - id: o4
      texte: Le rapporteur
    bonnes:
    - o1
  indices:
    relance: Pense à l'outil qui possède une pointe sèche et un crayon.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la règle graduée sert à mesurer des longueurs ou tracer des lignes droites, pas des cercles.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : l''équerre sert à vérifier ou tracer des angles droits.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : le rapporteur n''est pas utilisé en CM1 pour tracer un cercle.'
  solution: 'Le compas. C''est exact : la pointe du compas se pique sur le centre et la mine trace le cercle.'
- id: nblm-quel-outil-geometrique-faut-il-obligatoi-2
  type: choix
  difficulte: 2
  enonce: Quel outil géométrique faut-il obligatoirement utiliser pour vérifier si un angle est un angle droit ?
  reponse:
    options:
    - id: o1
      texte: L'équerre
    - id: o2
      texte: Le compas
    - id: o3
      texte: La règle non graduée
    - id: o4
      texte: L'œil nu
    bonnes:
    - o1
  indices:
    relance: C'est un outil en forme de triangle ayant lui-même un angle droit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : le compas sert à tracer des cercles ou reporter des distances.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : la règle permet seulement de tracer des traits droits, pas de vérifier un angle.'
  solution: 'L''équerre. C''est exact : l''équerre est l''outil indispensable pour contrôler et tracer les angles droits.'
- id: nblm-comment-appelle-t-on-deux-droites-qui-ne-3
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on deux droites qui ne se croisent jamais, quelle que soit leur longueur ?
  reponse:
    options:
    - id: o1
      texte: Des droites parallèles
    - id: o2
      texte: Des droites perpendiculaires
    - id: o3
      texte: Des droites sécantes
    - id: o4
      texte: Des demi-droites
    bonnes:
    - o1
  indices:
    relance: Pense aux lignes de chemin de fer qui gardent toujours le même écartement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : des droites perpendiculaires se coupent en formant un angle droit.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : des droites sécantes se coupent en un point.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : une demi-droite est une portion de droite, pas un type de relation entre droites.'
  solution: 'Des droites parallèles. C''est exact : par définition, deux droites parallèles ne se coupent jamais.'
- id: nblm-comment-definit-on-le-rayon-d-un-cercle-4
  type: choix
  difficulte: 2
  enonce: Comment définit-on le rayon d'un cercle ?
  reponse:
    options:
    - id: o1
      texte: La distance entre le centre et n'importe quel point du cercle
    - id: o2
      texte: La ligne fermée qui forme le contour du cercle
    - id: o3
      texte: Un segment reliant deux points du cercle en passant par le centre
    - id: o4
      texte: La surface remplie située à l'intérieur du cercle
    bonnes:
    - o1
  indices:
    relance: C'est la longueur correspondant à l'écartement des branches du compas.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : cette ligne est le cercle lui-même ou son périmètre.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : cela définit le diamètre, qui mesure le double du rayon.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : la surface intérieure s''appelle le disque.'
  solution: 'La distance entre le centre et n''importe quel point du cercle. C''est exact : le rayon est le segment qui relie
    le centre à un point du cercle.'
- id: nblm-quel-outil-geometrique-permet-de-mesurer-5
  type: choix
  difficulte: 2
  enonce: Quel outil géométrique permet de mesurer avec précision la longueur d'un segment en centimètres ?
  reponse:
    options:
    - id: o1
      texte: La règle graduée
    - id: o2
      texte: La règle non graduée
    - id: o3
      texte: Un gabarit d'angle
    - id: o4
      texte: L'équerre non graduée
    bonnes:
    - o1
  indices:
    relance: Cet outil possède des petits traits numérotés pour lire la mesure.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : sans graduations, une règle sert uniquement à tracer des lignes droites.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : un gabarit sert à comparer l''ouverture des angles, pas des longueurs.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : sans graduations, l''équerre sert seulement à vérifier l''angle droit.'
  solution: 'La règle graduée. C''est exact : les graduations de la règle permettent de mesurer des longueurs.'
- id: nblm-quelles-sont-les-deux-affirmations-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations correctes parmi les propositions suivantes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Deux droites perpendiculaires se coupent en formant un angle droit.
    - id: o2
      texte: Le cercle est la ligne de contour alors que le disque est la surface intérieure.
    - id: o3
      texte: Deux droites qui ne se croisent pas sur une feuille sont obligatoirement parallèles.
    - id: o4
      texte: Le rayon d'un cercle est deux fois plus grand que son diamètre.
    bonnes:
    - o1
    - o2
  indices:
    relance: Réfléchis à la définition de l'angle droit et à la différence entre le contour et la surface.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur classique : elles peuvent être sécantes et se croiser plus loin en dehors de la feuille.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : c''est le diamètre qui est le double du rayon.'
  solution: 'Deux droites perpendiculaires se coupent en formant un angle droit ; Le cercle est la ligne de contour alors
    que le disque est la surface intérieure. C''est exact : c''est la définition même de deux droites perpendiculaires.'
- id: nblm-pour-tracer-un-cercle-avec-un-compas-on-7
  type: texte_court
  difficulte: 1
  enonce: Pour tracer un cercle avec un compas, on pose la pointe sèche sur le _____ du cercle.
  reponse:
    acceptees:
    - centre
    fautes_tolerees: 1
  indices:
    relance: C'est le point situé exactement au milieu du cercle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'centre. C''est exact : le centre est le point fixe autour duquel est tracé le cercle.'
- id: nblm-deux-droites-qui-se-coupent-en-formant-u-8
  type: texte_court
  difficulte: 1
  enonce: Deux droites qui se coupent en formant un angle droit s'appellent des droites _____.
