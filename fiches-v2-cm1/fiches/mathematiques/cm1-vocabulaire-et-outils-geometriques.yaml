format: 2
notion: cm1-vocabulaire-et-outils-geometriques
version: 1
etat: verifiee
declencheurs:
- tracer un cercle
- vérifier un angle droit
- droites qui ne se croisent jamais
- pointe du compas
- mesurer avec la règle
- rayon du cercle
- disque ou cercle
- deux droites parallèles
prerequis: []
essentiel: 'En géométrie, on utilise un vocabulaire précis : point, droite, segment, demi-droite, milieu d''un segment, droites
  sécantes.


  Les outils : la règle (pour tracer des droites), la règle graduée (pour mesurer des longueurs), l''équerre (pour les angles
  droits) et le compas (pour les cercles).


  Un cercle de centre A passant par B, c''est l''ensemble des points situés à la même distance de A que B. Le disque de centre
  A et de rayon 4 cm, c''est l''ensemble des points situés à 4 cm au plus de A.


  Deux droites perpendiculaires se coupent en formant un angle droit. Deux droites parallèles ne se coupent jamais ; sinon
  elles sont sécantes.


  Si deux droites sont perpendiculaires à une même troisième droite, alors elles sont parallèles entre elles.

  '
methode:
- Nommer précisément les objets (point, droite, segment...) avec le vocabulaire officiel.
- 'Choisir le bon outil : règle pour tracer, règle graduée pour mesurer, équerre pour les angles droits, compas pour les cercles.'
- Pour vérifier une perpendicularité ou une longueur égale, utiliser l'équerre ou le compas plutôt que l'œil.
vocabulaire:
- terme: droites sécantes
  definition: deux droites qui se coupent en un point
- terme: droites perpendiculaires
  definition: deux droites qui se coupent en formant un angle droit
- terme: droites parallèles
  definition: deux droites qui ne se coupent jamais
- terme: rayon
  definition: distance entre le centre d'un cercle et un point du cercle
erreurs_frequentes:
- Dire que deux droites sont parallèles seulement parce qu'elles ne se coupent pas sur la feuille.
- Confondre cercle (le contour) et disque (la surface).
- Ne pas vérifier une perpendicularité à l'équerre alors que ce n'est pas évident.
exemple:
  enonce: Deux droites sont toutes les deux perpendiculaires à une même droite d. Que peut-on dire d'elles ?
  solution: Elles sont parallèles entre elles, car deux droites perpendiculaires à une même droite sont parallèles.
exercices:
- id: outil-pour-cercle
  type: texte_court
  difficulte: 1
  enonce: Quel outil utilises-tu pour tracer un cercle ?
  reponse:
    acceptees:
    - compas
    fautes_tolerees: 1
  indices:
    relance: Cet outil a une pointe et une mine, et on l'ouvre pour choisir la taille du cercle.
    methode: Pense à l'outil qui a une pointe qu'on plante sur le papier, et une mine qui tourne autour.
    etape: 'Ce n''est ni la règle ni l''équerre : cherche l''outil qui tourne autour d''un point fixe.'
  pieges:
  - si:
      valeur: règle
    relance: La règle sert à tracer des droites, pas des cercles. Quel autre outil connais-tu ?
  - si:
      valeur: équerre
    relance: L'équerre sert à vérifier les angles droits, pas à tracer des cercles.
  solution: 'On utilise le compas : on plante la pointe au centre et on fait tourner la mine autour.'
- id: outil-angle-droit
  type: choix
  difficulte: 1
  enonce: Quel outil sert à vérifier qu'un angle est droit ?
  reponse:
    options:
    - id: a
      texte: L'équerre
    - id: b
      texte: Le compas
    - id: c
      texte: La règle graduée
    bonnes:
    - a
  indices:
    relance: Cet outil a la forme d'un triangle avec un coin bien précis.
    methode: Pense à l'outil qu'on pose contre les deux côtés d'un angle pour voir s'il correspond à son coin.
    etape: Ce n'est pas l'outil qui trace les cercles, ni celui qui mesure les longueurs.
  pieges:
  - si:
      contient:
      - b
    relance: Le compas sert à tracer des cercles, pas à vérifier des angles.
  - si:
      contient:
      - c
    relance: La règle graduée sert à mesurer des longueurs, pas des angles.
  solution: 'C''est l''équerre : on pose son coin sur l''angle pour vérifier qu''il est droit.'
- id: trouver-le-rayon
  type: nombre
  difficulte: 2
  enonce: Un cercle a pour centre le point A. Un point B du cercle est à 6 cm de A. Quel est le rayon de ce cercle, en cm
    ?
  reponse:
    valeur: 6
    forme: entier
  indices:
    relance: Le rayon, c'est la distance entre le centre et un point du cercle.
    methode: Retrouve dans l'énoncé la distance entre le centre A et le point B, qui est sur le cercle.
    etape: Le point B est sur le cercle, donc sa distance à A donne directement le rayon.
  pieges:
  - si:
      valeur: 3
    relance: Tu as peut-être divisé par deux. Le rayon est la distance donnée entre A et B, sans la diviser.
  - si:
      valeur: 12
    relance: 'Tu as peut-être doublé la distance. Relis : quelle est la distance entre A et B ?'
  solution: 'Le rayon est la distance entre le centre et un point du cercle : ici, 6 cm.'
- id: construire-un-cercle
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour tracer, au compas, un cercle de centre A et de rayon 3 cm.
  reponse:
    elements:
    - id: ecarter
      texte: Écarter le compas de 3 cm entre la pointe et la mine, avec la règle graduée
    - id: piquer
      texte: Planter la pointe du compas sur le point A
    - id: tourner
      texte: Faire tourner le compas d'un tour complet pour tracer le cercle
  indices:
    relance: Peux-tu tracer le cercle avant d'avoir réglé l'écartement du compas ?
    methode: Il faut d'abord préparer l'outil (l'écartement), puis le positionner, puis tracer.
    etape: La toute première étape se fait avec la règle graduée, avant même de toucher le papier avec la pointe.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Doit-on planter la pointe avant ou après avoir réglé l'écartement ?
  - si:
      diagnostic: ordre_faux
    relance: Repense à ce qui doit être prêt avant de poser la pointe du compas sur le papier.
  solution: On écarte d'abord le compas de 3 cm avec la règle graduée, puis on plante la pointe en A, puis on fait tourner
    le compas.
- id: outils-et-usages
  type: association
  difficulte: 2
  enonce: Relie chaque outil à ce qu'il permet de faire.
  reponse:
    gauche:
    - id: a
      texte: Règle
    - id: b
      texte: Règle graduée
    - id: c
      texte: Équerre
    - id: d
      texte: Compas
    droite:
    - id: x
      texte: Tracer une droite
    - id: y
      texte: Mesurer une longueur
    - id: z
      texte: Vérifier un angle droit
    - id: w
      texte: Tracer un cercle
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: 'Deux outils se ressemblent (règle et règle graduée) : lequel a des graduations pour mesurer ?'
    methode: 'Associe d''abord les outils que tu reconnais bien : le compas pour les cercles, l''équerre pour les angles droits.'
    etape: 'Il reste alors la règle et la règle graduée : seule la règle graduée porte des chiffres pour mesurer.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout la règle et la règle graduée.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends outil par outil : à quoi sert-il précisément ?'
  solution: Règle → tracer une droite ; règle graduée → mesurer une longueur ; équerre → vérifier un angle droit ; compas
    → tracer un cercle.
- id: expliquer-cercle-disque
  type: ouverte
  difficulte: 3
  enonce: Explique, avec tes mots, la différence entre un cercle et un disque de même centre et de même rayon.
  criteres:
  - L'élève dit que le cercle est l'ensemble des points situés exactement à la distance du rayon du centre.
  - L'élève dit que le disque contient aussi tous les points situés à une distance inférieure ou égale au rayon.
  indices:
    relance: Lequel des deux, le cercle ou le disque, est juste le contour ?
    methode: Pense au trait tracé au compas (le contour) et à toute la surface qu'il entoure.
    etape: Le cercle, c'est seulement le trait. Le disque, c'est le trait et tout l'intérieur.
  solution: 'Le cercle est seulement le contour : les points situés exactement à la distance du rayon du centre. Le disque
    contient en plus tous les points à l''intérieur, à une distance inférieure ou égale au rayon.'
