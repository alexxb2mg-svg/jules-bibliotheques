# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-longueurs
version: 3
etat: verifiee
declencheurs:
- mètre
- centimètre
- kilomètre
- millimètre
- périmètre
- longueur d'un côté
- convertir une longueur
- mesurer le contour
- combien de kilomètres
prerequis: []
essentiel: 'Les unités de longueur vont du millimètre au kilomètre. De la plus petite à la plus grande : millimètre (mm),
  centimètre (cm), décimètre (dm), mètre (m), décamètre (dam), hectomètre (hm), kilomètre (km).


  Deux unités qui se suivent sont liées par 10. Par exemple 1 cm = 10 mm, 1 dm = 10 cm, 1 m = 10 dm. Donc 1 m = 100 cm = 1
  000 mm, et 1 km = 1 000 m. Dans l''autre sens, 1 cm = 1/10 dm = 0,1 dm.


  Au cours moyen, on ne se sert pas d''un tableau pour convertir. On s''appuie sur une relation connue entre les unités. Exemple
  : 3,5 m = 350 cm, car 1 m = 100 cm.


  On choisit une unité adaptée à ce qu''on mesure. L''épaisseur d''une pièce de monnaie se dit en millimètres, la longueur
  d''une gomme en centimètres, la longueur d''une cour en mètres, un trajet en voiture en kilomètres. Des longueurs de référence
  aident à estimer : la largeur d''un doigt est d''environ 1 cm, une grande enjambée d''environ 1 m.


  Pour comparer des longueurs, on les écrit d''abord dans la même unité. Exemple : 2 m et 150 cm. 2 m = 200 cm, donc 2 m >
  150 cm.


  Le périmètre d''une figure plane est la longueur de son contour. Pour un polygone, on mesure chaque côté à la règle graduée,
  puis on additionne toutes les longueurs. Pour un carré, c''est quatre fois la longueur d''un côté. Pour un rectangle, c''est
  deux fois la somme de la longueur et de la largeur.

  '
methode:
- Pour convertir une longueur, s'appuyer sur une relation connue entre les deux unités (par exemple 1 m = 100 cm), pas sur
  un tableau.
- Pour comparer des longueurs, les convertir d'abord dans la même unité.
- Pour calculer un périmètre, mesurer à la règle graduée ou repérer la longueur de chaque côté du polygone.
- Additionner toutes les longueurs des côtés pour obtenir le périmètre.
- Pour un carré, multiplier la longueur d'un côté par 4 ; pour un rectangle, additionner longueur et largeur puis multiplier
  par 2.
- Vérifier que le résultat est plausible et écrire l'unité.
vocabulaire:
- terme: périmètre
  definition: La longueur du contour d'une figure plane.
- terme: polygone
  definition: Une figure plane fermée dont tous les côtés sont des segments.
- terme: kilomètre
  definition: Une grande unité de longueur ; 1 km = 1 000 m.
- terme: millimètre
  definition: Une très petite unité de longueur ; 1 cm = 10 mm.
- terme: convertir
  definition: Écrire une même longueur avec une autre unité.
- terme: longueur de référence
  definition: Une longueur connue qui aide à estimer, comme la largeur d'un doigt pour 1 cm.
erreurs_frequentes:
- Confondre périmètre et aire d'une figure.
- Oublier un côté en calculant le périmètre d'un polygone.
- Se tromper de sens dans une conversion (multiplier au lieu de diviser, ou l'inverse).
- Comparer des longueurs données dans des unités différentes sans les convertir dans la même unité.
- Choisir une unité qui ne convient pas, par exemple donner la distance entre deux villes en centimètres.
exemple:
  enonce: Convertis 12,3 hm en mètres, puis en centimètres.
  solution: 1 hm = 100 m, donc 12,3 hm = 12,3 × 100 m = 1 230 m. Comme 1 m = 100 cm, 1 230 m = 1 230 × 100 cm = 123 000 cm.
exercices:
- id: conversion-hm-vers-m
  type: nombre
  difficulte: 1
  enonce: Convertis 5,4 hm en mètres. Donne le résultat en mètres.
  reponse:
    valeur: 540
    forme: entier
  indices:
    relance: 1 hm vaut 100 m. Utilise cette relation.
    methode: Multiplie le nombre d'hectomètres par 100 pour obtenir des mètres.
    etape: 5,4 × 100 = ?
  pieges:
  - si:
      valeur: 5.4
    relance: N'oublie pas de convertir, car 1 hm vaut 100 fois plus qu'1 m ; il faut multiplier par 100.
  solution: 1 hm = 100 m, donc 5,4 hm = 5,4 × 100 m = 540 m.
- id: perimetre-triangle
  type: nombre
  difficulte: 1
  enonce: Un triangle a des côtés qui mesurent 7 cm, 9 cm et 12 cm. Quel est son périmètre, en centimètres ?
  reponse:
    valeur: 28
    forme: entier
  indices:
    relance: Le périmètre d'un polygone est la somme des longueurs de tous ses côtés.
    methode: Additionne les trois longueurs des côtés du triangle.
    etape: Commence par 7 + 9, puis ajoute 12 au résultat.
  pieges:
  - si:
      valeur: 63
    relance: Tu as multiplié deux longueurs. Pour un périmètre, il faut additionner les côtés, pas les multiplier.
  solution: Le périmètre est 7 + 9 + 12 = 16 + 12 = 28 cm.
- id: unite-adaptee
  type: association
  difficulte: 1
  enonce: Relie chaque longueur à l'unité la mieux adaptée pour l'exprimer.
  reponse:
    gauche:
    - id: fourmi
      texte: La longueur d'une fourmi
    - id: crayon
      texte: La longueur d'un crayon
    - id: porte
      texte: La hauteur d'une porte
    - id: villes
      texte: La distance entre deux villes
    droite:
    - id: mm
      texte: Millimètre (mm)
    - id: cm
      texte: Centimètre (cm)
    - id: m
      texte: Mètre (m)
    - id: km
      texte: Kilomètre (km)
    paires:
      fourmi: mm
      crayon: cm
      porte: m
      villes: km
  indices:
    relance: Quelle est la plus petite de ces longueurs ? Et la plus grande ?
    methode: Range les quatre longueurs de la plus petite à la plus grande, puis fais de même avec les unités.
    etape: La plus petite unité, le millimètre, va avec la plus petite longueur.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare le crayon et la porte avec ta règle graduée en tête.
  - si:
      diagnostic: associations_fausses
    relance: Associe la plus petite longueur à la plus petite unité, puis continue dans l'ordre.
  solution: Fourmi → millimètre ; crayon → centimètre ; porte → mètre ; distance entre deux villes → kilomètre.
- id: perimetre-carre
  type: nombre
  difficulte: 2
  enonce: Un carré a des côtés de 9 cm. Quel est son périmètre, en centimètres ?
  reponse:
    valeur: 36
    forme: entier
  indices:
    relance: Combien de côtés a un carré ? Ont-ils tous la même longueur ?
    methode: Additionne les longueurs des quatre côtés, ou multiplie la longueur d'un côté par 4.
    etape: Un carré a 4 côtés, et ils mesurent tous la même longueur.
  pieges:
  - si:
      valeur: 81
    relance: Tu as multiplié le côté par lui-même. Le périmètre est le tour de la figure. Combien de côtés faut-il additionner
      ?
  - si:
      valeur: 18
    relance: Tu as compté seulement deux côtés. Un carré en a combien ?
  - si:
      diagnostic: valeur_fausse
    relance: Fais le tour du carré en ajoutant la longueur de chaque côté.
  solution: Le périmètre est 9 + 9 + 9 + 9 = 4 × 9 = 36 cm.
- id: ranger-longueurs
  type: ordre
  difficulte: 2
  enonce: 'Range ces longueurs dans l''ordre croissant : 33 m ; 56,8 cm ; 0,2 km.'
  reponse:
    elements:
    - id: b
      texte: 56,8 cm
    - id: a
      texte: 33 m
    - id: c
      texte: 0,2 km
  indices:
    relance: Compare chaque longueur à 1 m (100 cm), puis convertis 0,2 km en mètres.
    methode: 1 m = 100 cm et 1 km = 1 000 m. Compare chaque longueur à 1 m, puis convertis 0,2 km en mètres.
    etape: 56,8 cm, c'est moins que 100 cm, donc moins qu'1 m. Combien de mètres font 0,2 km ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux longueurs voisines sont inversées. As-tu bien converti 0,2 km en mètres ?
  - si:
      diagnostic: ordre_faux
    relance: Écris d'abord les longueurs dans la même unité, puis compare les nombres obtenus.
  solution: '56,8 cm est moins qu''1 m (100 cm) ; 0,2 km = 200 m. Ordre croissant : 56,8 cm < 33 m < 0,2 km.'
- id: estimer-hauteur-porte
  type: choix
  difficulte: 2
  enonce: Quelle est la hauteur la plus vraisemblable pour une porte de classe ?
  reponse:
    options:
    - id: a
      texte: Environ 2 cm
    - id: b
      texte: Environ 2 m
    - id: c
      texte: Environ 2 km
    bonnes:
    - b
  indices:
    relance: Une grande enjambée mesure environ 1 m. Une porte est-elle beaucoup plus haute que cela ?
    methode: Compare chaque proposition à des longueurs que tu connais (la largeur d'un doigt, une enjambée, le trajet de
      l'école).
    etape: La largeur d'un doigt fait environ 1 cm. Une porte est bien plus haute qu'un ou deux doigts.
  pieges:
  - si:
      contient:
      - a
    relance: 2 cm, c'est la largeur de deux doigts. Une porte n'est pas si petite !
  - si:
      contient:
      - c
    relance: 2 km, c'est une longue promenade à pied. Une porte n'est pas si haute !
  solution: Une porte mesure environ 2 m de haut, soit à peu près deux grandes enjambées. 2 cm est bien trop petit, 2 km bien
    trop grand.
- id: perimetre-rectangle-cote-inconnu
  type: nombre
  difficulte: 2
  enonce: Un rectangle ABCD a un côté [AB] qui mesure 8 cm, et son périmètre est 27 cm. Quelle est la longueur du côté [BC],
    en centimètres ?
  reponse:
    valeur: 5.5
    forme: libre
  indices:
    relance: Le périmètre d'un rectangle est deux fois (longueur + largeur).
    methode: Divise le périmètre par 2 pour trouver la somme des deux côtés différents, puis retire la longueur connue.
    etape: 27 ÷ 2 = ?, puis retire 8 à ce résultat.
  pieges:
  - si:
      valeur: 11
    relance: Tu as retiré deux fois 8 à 27, puis tu as oublié de partager en deux. Commence par diviser le périmètre par 2.
  - si:
      valeur: 13.5
    relance: C'est la moitié du périmètre. Il reste encore à retirer la longueur du côté [AB], déjà connue.
  solution: 27 = 2 × (8 + BC), donc 8 + BC = 27 ÷ 2 = 13,5, donc BC = 13,5 - 8 = 5,5 cm.
- id: somme-longueurs-unites-differentes
  type: nombre
  difficulte: 2
  enonce: Calcule la somme de deux longueurs données dans des unités différentes, 8,2 m + 0,43 dam. Donne le résultat en mètres.
  reponse:
    valeur: 12.5
    forme: libre
  indices:
    relance: 1 dam = 10 m. Convertis 0,43 dam en mètres avant d'additionner.
    methode: Multiplie 0,43 par 10 pour obtenir des mètres, puis additionne au nombre de mètres déjà donné.
    etape: 0,43 × 10 = ?, puis additionne ce résultat à 8,2.
  pieges:
  - si:
      valeur: 8.63
    relance: N'oublie pas de convertir les décamètres en mètres avant d'additionner les deux longueurs.
  solution: 0,43 dam = 0,43 × 10 m = 4,3 m, donc 8,2 m + 4,3 m = 12,5 m.
- id: expliquer-conversion-sans-tableau
  type: ouverte
  difficulte: 3
  enonce: Explique comment tu convertis une longueur d'une unité à une autre sans utiliser de tableau de conversion, en donnant
    un exemple.
  criteres:
  - L'élève explique qu'il utilise une relation connue entre les deux unités (par exemple 1 m = 100 cm).
  - L'élève explique qu'il multiplie ou divise selon que l'on passe d'une grande unité à une petite, ou l'inverse.
  - L'élève donne un exemple chiffré cohérent avec son explication.
  indices:
    relance: Quelle relation connais-tu entre le mètre et le centimètre ?
    methode: Explique dans quel sens tu multiplies ou tu divises selon que tu passes d'une petite unité à une grande, ou l'inverse.
    etape: 'Par exemple, pour passer de mètres à centimètres, que fais-tu : tu multiplies ou tu divises par 100 ?'
  solution: Pour convertir une longueur, je pars d'une relation connue entre les deux unités, par exemple 1 m = 100 cm. Pour
    passer d'une grande unité à une petite, je multiplie (3,5 m = 350 cm, car je multiplie par 100). Pour passer d'une petite
    unité à une grande, je divise (350 cm = 3,5 m, car je divise par 100).
- id: nblm-un-carre-a-des-cotes-de-6-cm-comment-cal-1
  type: choix
  difficulte: 2
  enonce: Un carré a des côtés de 6 cm. Comment calcule-t-on le périmètre de ce carré ?
  reponse:
    options:
    - id: o1
      texte: En multipliant la longueur d'un côté par 4 (6 × 4 = 24 cm).
    - id: o2
      texte: En multipliant la longueur d'un côté par elle-même (6 × 6 = 36 cm).
    - id: o3
      texte: En additionnant seulement 2 côtés (6 + 6 = 12 cm).
    - id: o4
      texte: En multipliant la longueur d'un côté par 2 (6 × 2 = 12 cm).
    bonnes:
    - o1
  indices:
    relance: Pense au nombre de côtés d'un carré et au fait qu'ils ont tous la même longueur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : cela correspond au calcul de l''aire du carré, pas à son périmètre.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : un carré possède 4 côtés, il faut additionner les 4 côtés et non seulement deux.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : multiplier par 2 ne donne que la somme de deux côtés au lieu du contour complet.'
  solution: 'En multipliant la longueur d''un côté par 4 (6 × 4 = 24 cm). C''est exact : comme les 4 côtés du carré ont la
    même longueur, le périmètre est égal à 4 fois la longueur d''un côté.'
- id: nblm-combien-de-centimetres-y-a-t-il-dans-1-m-2
  type: choix
  difficulte: 2
  enonce: Combien de centimètres y a-t-il dans 1 mètre ?
  reponse:
    options:
    - id: o1
      texte: 100 centimètres
    - id: o2
      texte: 10 centimètres
    - id: o3
      texte: 1 000 centimètres
    - id: o4
      texte: 1 000 000 centimètres
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi la signification du préfixe 'centi'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : 10 centimètres font 1 décimètre (dm), et non 1 mètre.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : 1 000 est la relation entre le millimètre et le mètre, ou entre le mètre et le kilomètre.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : c''est un nombre bien trop grand pour la relation entre mètre et centimètre.'
  solution: '100 centimètres. C''est exact : le préfixe ''centi'' indique qu''il faut 100 centimètres pour faire 1 mètre.'
