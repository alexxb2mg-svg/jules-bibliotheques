format: 2
notion: cm1-reperage-dans-espace
version: 3
etat: verifiee
declencheurs:
- avancer et tourner
- quart de tour
- point de départ et d'arrivée
- cubes cachés
- compter les cubes
- aller vers le nord
- plan d'une ville
- faire demi-tour
- empilement de cubes
prerequis: []
essentiel: 'Pour décrire un déplacement, on utilise un vocabulaire précis. Avancer, c''est aller tout droit devant soi. Reculer,
  c''est aller en arrière sans se retourner.


  Tourner d''un quart de tour à gauche ou à droite, c''est changer de direction, comme quand on prend une rue sur le côté.
  Faire demi-tour, c''est se retourner complètement : on repart dans le sens inverse. Deux quarts de tour dans le même sens
  font un demi-tour.


  On peut aussi utiliser les directions de la carte : le nord (en haut du plan), le sud (en bas), l''est (à droite) et l''ouest
  (à gauche). Si on marche vers le nord et qu''on tourne d''un quart de tour à droite, on marche ensuite vers l''est.


  Une suite d''instructions décrit un déplacement d''un point de départ à un point d''arrivée. On sait la lire et la suivre,
  mais aussi l''écrire soi-même. Exemple sur un quadrillage : « avance de 3 cases, tourne d''un quart de tour à gauche, avance
  de 2 cases ». Les instructions se suivent dans l''ordre, et chaque mot compte.


  Attention : gauche et droite dépendent de la direction dans laquelle on regarde. Pour ne pas se tromper, on peut tourner
  le plan ou se mettre à la place du personnage.


  On résout aussi des problèmes sur des assemblages de cubes. Par exemple, on compte les petits cubes d''un empilement. Certains
  cubes sont cachés derrière ou sous d''autres : pour ne pas les oublier, on compte couche par couche, du bas vers le haut.

  '
methode:
- Repérer le point de départ et la direction dans laquelle on regarde au départ.
- 'Lire les instructions une par une, dans l''ordre : avancer, reculer, tourner, faire demi-tour.'
- Après chaque quart de tour, se demander dans quelle direction on regarde maintenant.
- Vérifier qu'on arrive bien au point d'arrivée, en suivant le trajet avec le doigt.
- Pour un assemblage de cubes, compter couche par couche, en pensant aux cubes cachés, puis additionner.
vocabulaire:
- terme: quart de tour
  definition: Un quart d'un tour complet, pour tourner à gauche ou à droite.
- terme: demi-tour
  definition: Un mouvement qui fait repartir dans le sens inverse, égal à deux quarts de tour.
- terme: avancer
  definition: Se déplacer tout droit, dans la direction où l'on regarde.
- terme: reculer
  definition: Se déplacer en arrière, sans changer la direction où l'on regarde.
- terme: points cardinaux
  definition: 'Les quatre directions de la carte : nord, sud, est et ouest.'
- terme: assemblage de cubes
  definition: Un solide fait de petits cubes posés les uns contre les autres ou empilés.
erreurs_frequentes:
- Confondre la gauche et la droite dans les instructions.
- Oublier de compter les cubes cachés dans un assemblage.
- Mélanger l'ordre des instructions d'un déplacement.
- Oublier qu'après un quart de tour, la gauche et la droite ont changé de côté sur le plan.
exemple:
  enonce: Depuis la mairie, on avance vers le nord puis on tourne d'un quart de tour à droite. Dans quelle direction se dirige-t-on
    ensuite ?
  solution: On regarde vers le nord, c'est-à-dire vers le haut du plan. Quand on regarde vers le haut, sa droite est du côté
    droit du plan. En tournant d'un quart de tour à droite, on se dirige donc vers l'est.
exercices:
- id: direction-apres-quart-tour
  type: choix
  difficulte: 1
  enonce: On avance vers l'est puis on tourne d'un quart de tour à gauche. Dans quelle direction se dirige-t-on ensuite ?
  reponse:
    options:
    - id: a
      texte: Vers le nord
    - id: b
      texte: Vers le sud
    - id: c
      texte: Vers l'ouest
    bonnes:
    - a
  indices:
    relance: 'Imagine une boussole : est, puis un quart de tour vers la gauche.'
    methode: Sur le plan, l'est est à droite. Pose ton doigt dessus, puis tourne-le d'un quart de tour vers la gauche.
    etape: Place-toi face à l'est, puis tourne ton corps d'un quart de tour vers ta gauche.
  pieges:
  - si:
      contient:
      - b
    relance: Le sud correspondrait à un quart de tour à droite depuis l'est, pas à gauche.
  - si:
      contient:
      - c
    relance: L'ouest correspondrait à un demi-tour complet, pas à un simple quart de tour.
  solution: En tournant d'un quart de tour à gauche depuis l'est, on se dirige vers le nord.
- id: compter-cubes-couches
  type: nombre
  difficulte: 1
  enonce: 'Un solide est formé d''un empilement de cubes : une couche de 5 cubes au sol, et une couche de 3 cubes au-dessus.
    Combien de cubes au total ?'
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Additionne le nombre de cubes de chaque couche.
    methode: 'Il y a deux couches : compte le nombre de cubes dans chacune, puis fais la somme.'
    etape: 5 cubes dans la première couche, 3 cubes dans la deuxième.
  pieges:
  - si:
      valeur: 15
    relance: Tu as peut-être multiplié les deux nombres au lieu de les additionner.
  - si:
      valeur: 2
    relance: Tu as peut-être soustrait les deux nombres. Il faut les additionner pour compter tous les cubes.
  solution: 5 + 3 = 8 cubes au total.
- id: demi-tour-depuis-le-nord
  type: choix
  difficulte: 1
  enonce: Tu marches vers le nord et tu fais demi-tour. Vers quelle direction marches-tu maintenant ?
  reponse:
    options:
    - id: a
      texte: Vers l'est
    - id: b
      texte: Vers le sud
    - id: c
      texte: Vers l'ouest
    bonnes:
    - b
  indices:
    relance: Faire demi-tour, c'est repartir dans le sens inverse. Quelle direction est à l'opposé du nord ?
    methode: Un demi-tour, ce sont deux quarts de tour dans le même sens.
    etape: Le nord est en haut du plan. Après un demi-tour, tu regardes vers le côté opposé du plan.
  pieges:
  - si:
      contient:
      - a
    relance: L'est, c'est un seul quart de tour à droite depuis le nord. Un demi-tour te fait tourner deux fois plus.
  - si:
      contient:
      - c
    relance: L'ouest, c'est un seul quart de tour à gauche depuis le nord. Un demi-tour te fait tourner deux fois plus.
  solution: 'Un demi-tour fait repartir dans le sens inverse. L''opposé du nord est le sud : on marche maintenant vers le
    sud.'
- id: instructions-deplacement
  type: texte_court
  difficulte: 2
  enonce: 'Sur un quadrillage, on veut aller d''une case à une autre située 3 cases vers l''est puis deux cases vers le nord.
    Complète : on avance de 3 cases, on tourne d''un quart de tour, puis on avance de ___ cases.'
  reponse:
    acceptees:
    - '2'
    - deux
    fautes_tolerees: 0
  indices:
    relance: 'Relis l''énoncé : combien de cases faut-il parcourir dans la deuxième direction (vers le nord) ?'
    methode: L'énoncé donne une distance pour chaque direction du trajet ; la première est déjà écrite dans la phrase, il
      reste l'autre à retrouver.
    etape: La première distance (3 cases) est déjà utilisée. Il reste l'autre nombre donné dans l'énoncé.
  pieges:
  - si:
      valeur: '5'
    relance: 5 n'apparaît pas dans cet énoncé. Relis les distances données au début de la phrase.
  solution: On avance de 3 cases, on tourne d'un quart de tour, puis on avance de 2 cases (vers le nord).
- id: etapes-trajet-quadrillage
  type: ordre
  difficulte: 2
  enonce: 'Range dans l''ordre les étapes pour suivre ce déplacement : avancer de 2 cases, tourner d''un quart de tour à droite,
    avancer de 4 cases, puis faire demi-tour.'
  reponse:
    elements:
    - id: e1
      texte: Avancer de 2 cases
    - id: e2
      texte: Tourner d'un quart de tour à droite
    - id: e3
      texte: Avancer de 4 cases
    - id: e4
      texte: Faire demi-tour
  indices:
    relance: 'L''ordre est donné directement dans l''énoncé du déplacement : relis-le attentivement.'
    methode: Chaque instruction doit être suivie dans l'ordre où elle est écrite pour arriver au bon endroit.
    etape: La toute première instruction du texte est d'avancer de 2 cases.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Relis l'énoncé dans l'ordre exact où les instructions sont données.
  - si:
      diagnostic: ordre_faux
    relance: Le demi-tour est la toute dernière instruction du texte.
  solution: On avance de 2 cases, on tourne d'un quart de tour à droite, on avance de 4 cases, puis on fait demi-tour.
- id: vocabulaire-deplacement-actions
  type: association
  difficulte: 2
  enonce: Relie chaque mot du vocabulaire des déplacements à sa signification.
  reponse:
    gauche:
    - id: a
      texte: Avancer
    - id: b
      texte: Faire demi-tour
    - id: c
      texte: Tourner d'un quart de tour
    droite:
    - id: x
      texte: Se déplacer tout droit dans la direction actuelle
    - id: y
      texte: Se retourner complètement, pour repartir en sens inverse
    - id: z
      texte: Partir sur le côté, à gauche ou à droite, comme pour prendre une autre rue
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Le demi-tour change complètement la direction, à l'opposé de la direction de départ.
    methode: Avancer ne change pas la direction, contrairement à tourner ou faire demi-tour.
    etape: Un quart de tour est un changement de direction plus petit qu'un demi-tour.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien le quart de tour et le demi-tour.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot et imagine le mouvement qu'il décrit.
  solution: Avancer → se déplacer tout droit ; faire demi-tour → se retourner complètement ; tourner d'un quart de tour →
    partir sur le côté, à gauche ou à droite.
- id: cubes-pave-deux-couches
  type: nombre
  difficulte: 3
  enonce: Léo construit un pavé avec des petits cubes. Il pose deux couches identiques l'une sur l'autre. Chaque couche est
    formée de 3 rangées de 4 cubes. Combien de petits cubes a-t-il utilisés en tout, y compris ceux qu'on ne voit pas ?
  reponse:
    valeur: 24
    forme: entier
  indices:
    relance: Combien de cubes y a-t-il dans une seule couche ?
    methode: Compte d'abord les cubes d'une couche (le nombre de rangées fois le nombre de cubes par rangée), puis tiens compte
      du nombre de couches.
    etape: Une couche est formée de 3 rangées, et chaque rangée contient 4 cubes. Calcule ce que contient une couche, puis
      pense à la deuxième couche.
  pieges:
  - si:
      valeur: 12
    relance: Tu as compté une seule couche. Léo en a posé deux l'une sur l'autre.
  - si:
      valeur: 9
    relance: Tu as additionné les nombres de l'énoncé. Il faut compter les cubes rangée par rangée et couche par couche.
  solution: 'Une couche : 3 rangées de 4 cubes, soit 3 × 4 = 12 cubes. Deux couches : 12 + 12 = 24 cubes. Léo a utilisé 24
    petits cubes, même si certains sont cachés à l''intérieur ou en dessous.'
- id: expliquer-cubes-caches
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi, pour compter le nombre total de cubes d'un assemblage, il ne suffit pas de regarder seulement
    la face visible.
  criteres:
  - L'élève indique que des cubes peuvent être cachés derrière ou en dessous d'autres cubes.
  - L'élève propose de compter couche par couche pour ne pas oublier ces cubes cachés.
  - L'élève donne un petit exemple chiffré (par exemple un empilement de deux couches) pour illustrer.
  indices:
    relance: Un cube posé derrière un autre cube est-il visible depuis l'avant ?
    methode: Pense à un empilement où un cube du bas est entièrement recouvert par un cube du dessus.
    etape: Il faut analyser l'assemblage couche par couche pour repérer tous les cubes, même invisibles depuis l'extérieur.
  solution: Certains cubes peuvent être entièrement cachés par d'autres, par exemple à l'intérieur ou en dessous de l'assemblage.
    Pour ne pas les oublier, on compte les cubes couche par couche plutôt que de se fier seulement à ce qui est visible.
- id: nblm-si-tu-te-diriges-vers-le-nord-et-que-tu-1
  type: choix
  difficulte: 2
  enonce: Si tu te diriges vers le Nord et que tu tournes d'un quart de tour à droite, vers quelle direction te diriges-tu
    ensuite ?
  reponse:
    options:
    - id: o1
      texte: L'Est
    - id: o2
      texte: L'Ouest
    - id: o3
      texte: Le Sud
    - id: o4
      texte: Le Nord
    bonnes:
    - o1
  indices:
    relance: Pense aux points cardinaux et au sens des aiguilles d'une montre quand tu tournes à droite.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique de confusion : tourner d''un quart de tour à gauche mène à l''ouest, pas à droite.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : tourner vers le sud correspond à faire un demi-tour (deux quarts de tour).'
  - si:
      contient:
      - o4
    relance: 'C''est faux : continuer tout droit conserve la direction du nord, sans tourner.'
  solution: 'L''Est. C''est exact : en partant vers le nord et en tournant d''un quart de tour à droite, on s''oriente vers
    l''est.'
- id: nblm-que-signifie-faire-un-quart-de-tour-lors-2
  type: choix
  difficulte: 2
  enonce: Que signifie faire un « quart de tour » lors d'un déplacement ?
  reponse:
    options:
    - id: o1
      texte: Pivoter à 90° vers la gauche ou vers la droite pour changer de direction
    - id: o2
      texte: Faire un tour complet sur soi-même
    - id: o3
      texte: Faire demi-tour et repartir en arrière
    - id: o4
      texte: Avancer de quatre cases sur le quadrillage
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi le mouvement pour changer d'orientation vers la droite ou la gauche sans faire un demi-tour.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : un tour complet te ramène dans la même direction qu''au départ.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : faire demi-tour correspond à deux quarts de tour.'
  - si:
      contient:
      - o4
    relance: C'est une confusion fréquente entre avancer d'un nombre de cases et pivoter sur place.
  solution: 'Pivoter à 90° vers la gauche ou vers la droite pour changer de direction. C''est exact : un quart de tour correspond
    à pivoter à gauche ou à droite d''un angle droit.'
- id: nblm-pour-decrire-precisement-un-deplacement-3
  type: choix
  difficulte: 2
  enonce: Pour décrire précisément un déplacement sur un plan ou un quadrillage, quelle est la première chose à repérer ?
  reponse:
    options:
    - id: o1
      texte: Le point de départ et la direction initiale
    - id: o2
      texte: Le nombre de virages du trajet
    - id: o3
      texte: La couleur des cases du quadrillage
    - id: o4
      texte: Le nombre de cases de la carte
    bonnes:
    - o1
  indices:
    relance: Pense à ce que tu dois observer en tout premier avant de lire les instructions de déplacement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est insuffisant : connaître le nombre de virages ne donne pas le lieu d''origine ni le chemin précis.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : les couleurs n''indiquent pas la position de départ du trajet.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : le nombre total de cases de la carte n''indique pas où commence le parcours.'
  solution: 'Le point de départ et la direction initiale. C''est exact : il faut savoir d''où l''on part et dans quelle direction
    on est orienté pour suivre ou écrire les instructions.'
- id: nblm-comment-faut-il-compter-les-petits-cubes-4
  type: choix
  difficulte: 2
  enonce: Comment faut-il compter les petits cubes qui composent un assemblage en relief (3D) ?
  reponse:
    options:
    - id: o1
      texte: Compter couche par couche, sans oublier les cubes cachés
    - id: o2
      texte: Compter seulement les cubes qu'on voit sur la face de devant
    - id: o3
      texte: Compter uniquement les cubes posés tout en haut
    - id: o4
      texte: Multiplier le nombre de faces visibles par deux
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui soutient les cubes du haut que tu vois directement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : cela oublie les cubes situés derrière ou en dessous.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : cela néglige les cubes des étages inférieurs.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : cette opération ne donne pas le nombre réel de cubes.'
  solution: 'Compter couche par couche, sans oublier les cubes cachés. C''est exact : procéder niveau par niveau permet de
    dénombrer tous les cubes, y compris ceux qui ne sont pas visibles.'
- id: nblm-tu-avances-de-3-cases-puis-tu-fais-demi-5
  type: choix
  difficulte: 2
  enonce: Tu avances de 3 cases puis tu fais « demi-tour ». Que dois-tu faire pour revenir exactement à ton point de départ
    ?
  reponse:
    options:
    - id: o1
      texte: Avancer de 3 cases tout droit
    - id: o2
      texte: Reculer de 3 cases
    - id: o3
      texte: Tourner d'un quart de tour à droite et avancer de 3 cases
    - id: o4
      texte: Faire un nouveau demi-tour et reculer de 3 cases
    bonnes:
    - o1
  indices:
    relance: Considère le sens dans lequel tu es tourné(e) une fois que ton demi-tour est effectué.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : comme tu as fait demi-tour, reculer te ferait t''éloigner encore plus du départ.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : tourner à droite te ferait sortir de l''axe de retour.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : refaire demi-tour te réoriente vers l''arrivée, puis reculer te ferait revenir en arrière par
      rapport au départ.'
  solution: 'Avancer de 3 cases tout droit. C''est exact : après un demi-tour, avancer de 3 cases permet de refaire le chemin
    inverse vers le point de départ.'
- id: nblm-quelles-instructions-font-partie-du-voca-6
  type: choix
  difficulte: 3
  enonce: Quelles instructions font partie du vocabulaire officiel pour décrire un déplacement ? (Choisis 2 réponses) (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Tourner d'un quart de tour à gauche
    - id: o2
      texte: Faire demi-tour
    - id: o3
      texte: Sauter par-dessus une case
    - id: o4
      texte: Grandir d'un carreau
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les deux termes de géométrie qui décrivent comment pivoter ou changer d'orientation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : ''sauter'' n''est pas un terme du vocabulaire mathématique de codage des déplacements.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : ce terme ne décrit pas une action de déplacement sur un plan ou un quadrillage.'
  solution: 'Tourner d''un quart de tour à gauche ; Faire demi-tour. C''est exact : c''est l''expression précise pour indiquer
    un changement de direction d''un angle droit vers la gauche.'
- id: nblm-pour-trouver-le-nombre-total-de-cubes-d-7
  type: texte_court
  difficulte: 1
  enonce: Pour trouver le nombre total de cubes d'un solide, il ne faut pas oublier de compter les cubes...
  reponse:
    acceptees:
    - cachés
    fautes_tolerees: 1
  indices:
    relance: Pense aux cubes invisibles sur le dessin mais qui soutiennent ceux du haut.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'cachés. C''est exact : les cubes cachés sous ou derrière les autres doivent impérativement être comptés.'
- id: nblm-un-demi-tour-correspond-exactement-a-com-8
  type: texte_court
  difficulte: 1
  enonce: Un demi-tour correspond exactement à combien de quarts de tour ?
  reponse:
    acceptees:
    - deux
    fautes_tolerees: 1
  indices:
    relance: Pense au nombre de quarts de tour nécessaires pour se retrouver orienté à l'opposé de sa direction initiale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'deux. C''est exact : faire deux quarts de tour successifs fait pivoter de 180°, ce qui équivaut à un demi-tour.'
