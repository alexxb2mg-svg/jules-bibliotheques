  type: choix
  difficulte: 2
  enonce: Dans la suite de nombres « 3 ; 7 ; 11 ; 15 », quelle est la régularité et quel est le nombre suivant ?
  reponse:
    options:
    - id: o1
      texte: On ajoute 4 à chaque étape ; le nombre suivant est 19.
    - id: o2
      texte: On ajoute 3 à chaque étape ; le nombre suivant est 18.
    - id: o3
      texte: On multiplie par 2 à chaque étape ; le nombre suivant est 30.
    - id: o4
      texte: On ajoute 5 à chaque étape ; le nombre suivant est 20.
    bonnes:
    - o1
  indices:
    relance: Calcule la différence entre deux nombres qui se suivent dans la suite.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre l''écart de 4 avec un ajout de 3 (3 + 3 donnerait 6 et non 7).'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : chercher une règle multiplicative alors qu''il s''agit d''une addition constante de 4.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : mal compter l''écart entre deux termes consécutifs.'
  solution: 'On ajoute 4 à chaque étape ; le nombre suivant est 19. C''est exact : 3 + 4 = 7, 7 + 4 = 11, 11 + 4 = 15, et
    15 + 4 = 19.'
- id: nblm-comment-continuer-la-suite-de-nombres-1-3
  type: choix
  difficulte: 2
  enonce: Comment continuer la suite de nombres « 1 ; 2 ; 6 ; 7 ; 11 ; 12 ; 16 » pour trouver le terme suivant ?
  reponse:
    options:
    - id: o1
      texte: En ajoutant 1, ce qui donne 17.
    - id: o2
      texte: En ajoutant 4, ce qui donne 20.
    - id: o3
      texte: En multipliant par 2, ce qui donne 32.
    - id: o4
      texte: En ajoutant 5, ce qui donne 21.
    bonnes:
    - o1
  indices:
    relance: 'Observe bien l''écart entre chaque terme consécutif : il alterne d''un nombre à l''autre.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : réappliquer l''addition +4 alors que la règle alterne et que c''est le tour du +1.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : penser à une multiplication alors que la suite utilise des additions alternées.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ajouter 5 permet de sauter deux rangs, mais pour le nombre immédiatement suivant, la règle
      exige +1.'
  solution: 'En ajoutant 1, ce qui donne 17. C''est exact : la régularité alterne entre +1 et +4 (16 + 1 = 17).'
- id: nblm-dans-une-suite-de-motifs-evolutive-il-y-4
  type: choix
  difficulte: 2
  enonce: Dans une suite de motifs évolutive, il y a 3 cœurs à l'étape 1, 6 cœurs à l'étape 2 et 9 cœurs à l'étape 3. Quelle
    est la régularité pour continuer la suite à l'étape 4 ?
  reponse:
    options:
    - id: o1
      texte: On ajoute 3 cœurs à chaque étape, donc l'étape 4 compte 12 cœurs.
    - id: o2
      texte: On multiplie par 2 à chaque étape, donc l'étape 4 compte 18 cœurs.
    - id: o3
      texte: On ajoute 1 cœur à chaque étape, donc l'étape 4 compte 10 cœurs.
    - id: o4
      texte: On garde le même nombre qu'à l'étape 1, donc l'étape 4 compte 3 cœurs.
    bonnes:
    - o1
  indices:
    relance: Compare le nombre de cœurs d'une étape à la suivante pour repérer la régularité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : croire qu''on multiplie par 2 alors que 6 × 2 donnerait 12 à l''étape 3 et non 9.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : sous-estimer la régularité ajoutée entre les étapes.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ne pas prendre en compte le caractère évolutif de la suite de motifs.'
  solution: 'On ajoute 3 cœurs à chaque étape, donc l''étape 4 compte 12 cœurs. C''est exact : 3 + 3 = 6, 6 + 3 = 9, et 9
    + 3 = 12.'
