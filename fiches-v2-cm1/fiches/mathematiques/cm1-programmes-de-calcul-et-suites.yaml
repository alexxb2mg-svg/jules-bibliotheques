format: 2
notion: cm1-programmes-de-calcul-et-suites
version: 3
etat: verifiee
declencheurs:
- programme de calcul
- suite de nombres
- quel est le nombre suivant
- régularité
- continuer la suite
- suite de motifs
- trouver la règle de la suite
- dessins qui grandissent
- suivre les instructions de calcul
- nombre de départ
prerequis:
- cm1-methode-de-resolution-de-problemes
essentiel: 'Un programme de calcul est une liste d''instructions à suivre dans l''ordre. On part d''un nombre de départ, on
  applique les instructions l''une après l''autre, et on obtient un nombre d''arrivée.


  Par exemple : choisir un nombre, ajouter 2, multiplier le résultat par 4. Avec 5, on calcule 5 + 2 = 7, puis 7 × 4 = 28.
  Si on change l''ordre des instructions, le résultat change : il faut donc respecter l''ordre.


  Une suite de nombres est une liste de nombres fabriquée avec une règle. Pour la poursuivre, on observe comment on passe
  d''un nombre au suivant. Puis on formule la règle avec une phrase, par exemple « on ajoute 4 à chaque fois ».


  Il existe plusieurs sortes de règles. On peut ajouter toujours le même nombre (2 ; 6 ; 10 ; 14), enlever toujours le même
  nombre (50 ; 45 ; 40 ; 35) ou multiplier toujours par le même nombre (3 ; 6 ; 12 ; 24). On vérifie la règle sur plusieurs
  nombres, pas seulement sur les deux premiers.


  Une suite de motifs est une suite de dessins qui changent d''une étape à l''autre. On compte les éléments de chaque étape
  (ronds, carrés, allumettes) et on cherche une régularité : ce qui augmente toujours de la même façon, ou ce qui change selon
  le numéro de l''étape.


  Exemple : une rangée de carrés faits avec des allumettes. Il faut 4 allumettes pour 1 carré, 7 pour 2 carrés, 10 pour 3
  carrés. À chaque nouveau carré, on ajoute 3 allumettes.


  Pour retrouver le nombre de départ d''un programme, on défait les opérations en partant de la dernière.

  '
methode:
- Pour un programme de calcul, lire toutes les instructions, puis les appliquer une par une, dans l'ordre donné.
- Écrire le résultat de chaque instruction avant de passer à la suivante.
- Pour une suite de nombres, calculer l'écart (ou par combien on multiplie) entre plusieurs nombres qui se suivent.
- Formuler la règle trouvée par une phrase claire, puis la vérifier sur tous les nombres connus.
- Pour une suite de motifs, compter les éléments de chaque étape et chercher comment ce nombre évolue d'une étape à l'autre.
- Appliquer la règle au dernier nombre connu (ou à la dernière étape) pour continuer la suite.
vocabulaire:
- terme: programme de calcul
  definition: Une liste d'instructions de calcul à appliquer dans l'ordre à un nombre de départ.
- terme: suite de nombres
  definition: Une liste de nombres rangés selon une règle qui permet de trouver le nombre suivant.
- terme: règle
  definition: La phrase qui dit comment on passe d'un nombre au suivant, par exemple « on ajoute 5 ».
- terme: régularité
  definition: Ce qui se répète ou change toujours de la même façon dans une suite.
- terme: suite de motifs
  definition: Une suite de dessins dont le nombre d'éléments change d'une étape à l'autre selon une règle.
erreurs_frequentes:
- Sauter une instruction ou changer l'ordre des instructions d'un programme de calcul.
- Trouver une règle avec seulement les deux premiers nombres, sans la vérifier sur les autres.
- Confondre « ajouter toujours le même nombre » et « multiplier toujours par le même nombre ».
- Continuer une suite de motifs en ajoutant toujours le même nombre alors que la règle change à chaque étape.
- Pour retrouver le nombre de départ, défaire les opérations dans le mauvais ordre.
exemple:
  enonce: 'Applique ce programme de calcul à 5 : choisir un nombre, ajouter 2, multiplier le résultat par 4, écrire le nombre
    obtenu.'
  solution: 'On applique les instructions dans l''ordre. Ajouter 2 : 5 + 2 = 7. Multiplier le résultat par 4 : 7 × 4 = 28.
    Le nombre obtenu est 28.'
exercices:
- id: programme-calcul-depart-8
  type: nombre
  difficulte: 1
  enonce: 'Applique ce programme de calcul à 8 : choisir un nombre, ajouter 2, multiplier le résultat par 4, écrire le nombre
    obtenu.'
  reponse:
    valeur: 40
    forme: entier
  indices:
    relance: Applique les instructions dans l'ordre, une par une.
    methode: Ajoute d'abord 2 au nombre de départ, puis multiplie le résultat par 4.
    etape: Effectue d'abord l'addition indiquée, puis la multiplication sur le résultat obtenu.
  pieges:
  - si:
      valeur: 34
    relance: Vérifie l'ordre des instructions. Il faut d'abord ajouter 2, puis multiplier le résultat par 4, pas l'inverse.
  solution: 8 + 2 = 10, puis 10 × 4 = 40. Le nombre obtenu est 40.
- id: suite-arithmetique-plus-4
  type: nombre
  difficulte: 1
  enonce: 'Cette suite suit une règle simple : 3 ; 7 ; 11 ; 15... Quel est le terme suivant ?'
  reponse:
    valeur: 19
    forme: entier
  indices:
    relance: Calcule la différence entre deux termes qui se suivent.
    methode: Trouve ce qu'on ajoute à chaque terme pour obtenir le suivant, puis applique cette règle au dernier terme.
    etape: Observe l'écart entre chaque paire de termes voisins de la suite ; il est toujours le même.
  pieges:
  - si:
      valeur: 16
    relance: Vérifie la différence entre chaque terme de la suite. Elle n'est pas de 1 mais toujours la même valeur, plus
      grande.
  solution: 'On ajoute toujours 4 : 15 + 4 = 19. Le terme suivant est 19.'
- id: suite-geometrique-fois-3
  type: nombre
  difficulte: 2
  enonce: 'Cette suite suit une règle de multiplication : 4 ; 12 ; 36 ; 108... Quel est le terme suivant ?'
  reponse:
    valeur: 324
    forme: entier
  indices:
    relance: Calcule le rapport entre deux termes qui se suivent, c'est-à-dire par combien on multiplie.
    methode: Trouve le nombre par lequel chaque terme est multiplié pour obtenir le suivant.
    etape: Divise chaque terme par le terme qui le précède ; le résultat obtenu est toujours le même.
  pieges:
  - si:
      valeur: 111
    relance: Cette suite ne s'obtient pas en ajoutant toujours le même nombre, mais en multipliant toujours par le même nombre.
  solution: 'On multiplie toujours par 3 : 108 × 3 = 324. Le terme suivant est 324.'
- id: suite-motifs-ronds
  type: nombre
  difficulte: 2
  enonce: Une suite de motifs commence avec 2 ronds à l'étape 1, 4 ronds à l'étape 2, 7 ronds à l'étape 3. La règle est "on
    ajoute le numéro de l'étape suivante". Combien de ronds y aura-t-il à l'étape 4 ?
  reponse:
    valeur: 11
    forme: entier
  indices:
    relance: De l'étape 1 à l'étape 2, on a ajouté 2. De l'étape 2 à l'étape 3, on a ajouté 3. Que doit-on ajouter ensuite
      ?
    methode: Le nombre ajouté correspond au numéro de l'étape que l'on va atteindre.
    etape: Pour passer de l'étape 3 à l'étape 4, quel nombre faut-il ajouter au nombre de ronds de l'étape 3 ?
  pieges:
  - si:
      valeur: 10
    relance: Vérifie combien on ajoute à chaque étape. Ce nombre change et n'est pas toujours le même.
  solution: 'De l''étape 3 à l''étape 4, on ajoute 4 : 7 + 4 = 11 ronds à l''étape 4.'
- id: relier-suite-et-regle
  type: association
  difficulte: 2
  enonce: Relie chaque suite de nombres à la règle qui permet de la continuer.
  reponse:
    gauche:
    - id: suite-a
      texte: 5 ; 10 ; 15 ; 20
    - id: suite-b
      texte: 2 ; 4 ; 8 ; 16
    - id: suite-c
      texte: 60 ; 55 ; 50 ; 45
    droite:
    - id: ajouter-cinq
      texte: on ajoute 5 à chaque fois
    - id: fois-deux
      texte: on multiplie par 2 à chaque fois
    - id: enlever-cinq
      texte: on enlève 5 à chaque fois
    paires:
      suite-a: ajouter-cinq
      suite-b: fois-deux
      suite-c: enlever-cinq
  indices:
    relance: Pour chaque suite, les nombres augmentent-ils ou diminuent-ils ?
    methode: Calcule l'écart entre deux nombres voisins, puis vérifie s'il reste le même sur toute la suite.
    etape: 'Dans la suite 2 ; 4 ; 8 ; 16, les écarts sont 2, puis 4, puis 8 : ils ne restent pas pareils. Cherche alors par
      combien on multiplie.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association ne va pas. Vérifie la règle sur tous les nombres de chaque suite.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque suite et teste chaque règle sur ses deux premiers nombres, puis sur les suivants.
  solution: '5 ; 10 ; 15 ; 20 : on ajoute 5. 2 ; 4 ; 8 ; 16 : on multiplie par 2 (2 × 2 = 4, 4 × 2 = 8, 8 × 2 = 16). 60 ;
    55 ; 50 ; 45 : on enlève 5.'
- id: motifs-triangles-allumettes
  type: nombre
  difficulte: 3
  enonce: Léa fabrique une rangée de triangles avec des allumettes. À l'étape 1, elle utilise 3 allumettes ; à l'étape 2,
    5 allumettes ; à l'étape 3, 7 allumettes. La régularité continue. Combien d'allumettes utilise-t-elle à l'étape 6 ?
  reponse:
    valeur: 13
    forme: entier
  indices:
    relance: Combien d'allumettes Léa ajoute-t-elle à chaque nouvelle étape ?
    methode: Trouve la règle, puis continue la suite étape par étape jusqu'à l'étape 6, sans en sauter.
    etape: 'Étape 4 : 7 + 2 = 9 allumettes. Continue pour les étapes 5 et 6.'
  pieges:
  - si:
      valeur: 11
    relance: Tu t'es arrêté une étape trop tôt. Compte bien les étapes jusqu'à la sixième.
  - si:
      valeur: 12
    relance: 'Attention, à l''étape 1 il y a déjà 3 allumettes, pas 2 : pars bien du premier dessin et ajoute la même quantité
      à chaque étape.'
  solution: 'On ajoute 2 allumettes à chaque étape : 3 ; 5 ; 7 ; 9 ; 11 ; 13. À l''étape 6, Léa utilise 13 allumettes.'
- id: programme-calcul-inverse
  type: nombre
  difficulte: 3
  enonce: 'Un programme de calcul donne : choisir un nombre, le multiplier par 3, puis soustraire 5. Un élève applique ce
    programme et obtient 16. Quel était le nombre de départ ?'
  reponse:
    valeur: 7
    forme: entier
  indices:
    relance: Pour retrouver le nombre de départ, défais les opérations dans l'ordre inverse de celui du programme.
    methode: Ajoute d'abord 5 au résultat obtenu, puis divise par 3.
    etape: Refais le chemin à l'envers, en commençant par annuler la dernière opération du programme.
  pieges:
  - si:
      valeur: 21
    relance: Cette valeur est celle obtenue juste avant la soustraction, mais il reste encore une opération à défaire pour
      retrouver le nombre de départ.
  solution: 'On défait les opérations en sens inverse : 16 + 5 = 21, puis 21 ÷ 3 = 7. Le nombre de départ était 7. Vérification
    : 7 × 3 = 21, puis 21 - 5 = 16.'
- id: expliquer-decouverte-regle
  type: ouverte
  difficulte: 3
  enonce: Explique comment tu procèdes pour découvrir la règle d'une suite de nombres et pour continuer cette suite.
  criteres:
  - L'élève explique qu'il compare plusieurs termes successifs (au moins deux écarts ou rapports) pour être sûr de la règle.
  - L'élève explique la différence entre une règle d'addition (même écart) et une règle de multiplication (même rapport).
  - L'élève explique qu'il faut ensuite appliquer la règle trouvée au dernier terme connu pour continuer la suite.
  indices:
    relance: Que calcules-tu en premier quand tu observes une suite de nombres ?
    methode: Explique comment tu compares les termes entre eux pour repérer si on ajoute ou si on multiplie toujours le même
      nombre.
    etape: Pense à vérifier ta règle sur plusieurs termes, pas seulement les deux premiers, avant de continuer la suite.
  solution: Je calcule l'écart entre plusieurs nombres qui se suivent, pas seulement les deux premiers, pour être sûr de la
    règle. Si l'écart est toujours le même, on ajoute toujours le même nombre. Sinon, je cherche si on multiplie toujours
    par le même nombre. Une fois la règle trouvée, je l'applique au dernier nombre connu pour continuer la suite.
