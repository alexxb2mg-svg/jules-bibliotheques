format: 2
notion: cm1-calculer-mentalement-avec-la-numeration
version: 3
etat: generee
declencheurs:
- multiplier par mille
- diviser par cent
- décaler d'un rang
- ajouter sans poser
- valeur du chiffre qui grandit
- nombre fois cent
- la virgule bouge
- ajouter des dixièmes
- enlever des centièmes
prerequis:
- cm1-numeration-des-entiers
- cm1-nombres-decimaux-ecriture-a-virgule
essentiel: 'Dans un nombre, chaque chiffre a une valeur qui dépend de son rang : unités, dizaines, centaines, milliers, et
  après la virgule dixièmes et centièmes. Connaître ces rangs permet de calculer vite, sans poser l''opération.


  Pour multiplier un nombre entier par 10, 100 ou 1 000, chaque chiffre prend une valeur plus grande : les unités deviennent
  des dizaines (× 10), des centaines (× 100) ou des milliers (× 1 000), et ainsi de suite pour les autres chiffres. Par exemple,
  100 × 53 = 5 300 : les 5 dizaines deviennent 5 milliers et les 3 unités deviennent 3 centaines.


  Pour multiplier un nombre décimal par 10, chaque chiffre prend une valeur 10 fois plus grande : un dixième devient une unité,
  un centième devient un dixième. Par exemple, 10 × 72,41 = 724,1. Attention, ajouter un zéro à la fin ne marche pas pour
  un décimal : 10 × 4,5 ne fait pas 4,50.


  Pour diviser un nombre décimal par 10, chaque chiffre prend une valeur 10 fois plus petite : une dizaine devient une unité,
  une unité devient un dixième. Par exemple, 72,4 ÷ 10 = 7,24. Le résultat est plus petit que le nombre de départ.


  Pour ajouter ou soustraire un petit nombre (moins de 10) d''unités, de dizaines, de centaines, de dixièmes ou de centièmes,
  sans retenue, on repère le bon chiffre et on ne touche pas aux autres. Par exemple, 5,12 + 0,6 : on ajoute 6 dixièmes au
  1 dixième, et on obtient 5,72. Au marché, 2,35 € + 0,02 € donne 2,37 €.

  '
methode:
- Identifier ce qu'on multiplie ou divise (un nombre entier ou décimal) et par quoi (10, 100 ou 1 000).
- Se rappeler que multiplier rend chaque chiffre plus grand, diviser le rend plus petit.
- Décaler mentalement la valeur de chaque chiffre d'un rang (pour ×10 ou ÷10), deux rangs (×100), trois rangs (×1 000).
- Pour une addition ou soustraction sans retenue, repérer le rang du nombre ajouté ou enlevé (unités, dizaines, dixièmes,
  centièmes).
- Modifier seulement le chiffre de ce rang dans l'autre nombre, sans toucher aux autres.
- Vérifier que le résultat a du sens (plus grand après ×, plus petit après ÷).
vocabulaire:
- terme: rang
  definition: La place d'un chiffre dans un nombre, qui donne sa valeur (unités, dizaines, centaines...).
- terme: dizaine
  definition: Un groupe de 10 unités.
- terme: centaine
  definition: Un groupe de 100 unités, ou de 10 dizaines.
- terme: millier
  definition: Un groupe de 1 000 unités, ou de 10 centaines.
- terme: dixième
  definition: Une unité partagée en 10 parts égales ; 10 dixièmes font une unité.
- terme: centième
  definition: Une unité partagée en 100 parts égales ; 10 centièmes font un dixième.
erreurs_frequentes:
- Ajouter des zéros à un nombre décimal sans réfléchir au sens (10 × 4,5 n'est pas 4,50).
- Confondre le sens de ×10 (les chiffres grandissent) et ÷10 (les chiffres rapetissent).
- Oublier de décaler tous les chiffres, pas seulement le premier.
- Ajouter des dixièmes au chiffre des centièmes (ou l'inverse) parce qu'on n'a pas repéré le bon rang.
- Décaler d'un seul rang pour × 100 ou × 1 000.
exemple:
  enonce: Calcule 10 × 72,41 et explique ce qui se passe pour chaque chiffre.
  solution: '10 × 72,41 = 724,1. Chaque chiffre prend une valeur 10 fois plus grande : le 7 des dizaines devient centaines,
    le 2 des unités devient dizaines, le 4 des dixièmes devient unités, le 1 des centièmes devient dixième.'
exercices:
- id: addition-sans-retenue-milliers
  type: nombre
  difficulte: 1
  enonce: Calcule 1 462 + 300.
  reponse:
    valeur: 1762
    forme: entier
  indices:
    relance: Seul un chiffre de 1 462 va changer. Lequel ?
    methode: 300, c'est 3 centaines. Repère le chiffre des centaines dans 1 462 et modifie-le seul.
    etape: Dans 1 462, le chiffre des centaines est 4.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que tu as ajouté 3 au chiffre des centaines seulement, sans toucher aux autres chiffres.
  solution: 1 462 + 300 = 1 762, car seul le chiffre des centaines change (4 devient 7).
- id: multiplier-par-cent-et-mille
  type: nombre
  difficulte: 1
  enonce: Calcule 100 × 24.
  reponse:
    valeur: 2400
    forme: entier
  indices:
    relance: Chaque chiffre de 24 change de valeur. De combien de rangs ?
    methode: Multiplier par 100, c'est décaler chaque chiffre de deux rangs vers la gauche.
    etape: Le 2 des dizaines devient des centaines, et il faut continuer le décalage pour tous les chiffres.
  pieges:
  - si:
      valeur: 240
    relance: Ce résultat correspond à une multiplication par 10, pas par 100.
  solution: 100 × 24 = 2 400.
- id: multiplier-entier-par-mille
  type: nombre
  difficulte: 1
  enonce: Calcule 1 000 × 37.
  reponse:
    valeur: 37000
    forme: entier
  indices:
    relance: Multiplier par 1 000, c'est décaler chaque chiffre de combien de rangs ?
    methode: Chaque chiffre prend une valeur 1 000 fois plus grande. Les unités deviennent des milliers.
    etape: Les 7 unités de 37 deviennent 7 milliers. Que deviennent les 3 dizaines ?
  pieges:
  - si:
      valeur: 3700
    relance: Ce résultat correspond à une multiplication par 100. Pour × 1 000, on décale de trois rangs.
  - si:
      valeur: 370
    relance: Ce résultat correspond à une multiplication par 10. Pour × 1 000, on décale de trois rangs.
  solution: '1 000 × 37 = 37 000 : les 7 unités deviennent 7 milliers et les 3 dizaines deviennent 3 dizaines de milliers.'
- id: multiplier-decimal-par-dix
  type: nombre
  difficulte: 2
  enonce: Calcule 4,45 + 0,3.
  reponse:
    valeur: 4.75
    forme: libre
  indices:
    relance: Regarde quel chiffre de 4,45 correspond aux dixièmes.
    methode: 0,3, c'est 3 dixièmes. Ajoute-les seulement au chiffre des dixièmes de 4,45.
    etape: Le chiffre des dixièmes de 4,45 est 4.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que tu as bien ajouté 3 dixièmes, sans toucher aux centièmes ni à la partie entière.
  solution: 4,45 + 0,3 = 4,75, car on ajoute 3 dixièmes à 4 dixièmes.
- id: soustraire-des-centiemes
  type: nombre
  difficulte: 2
  enonce: Calcule 8,47 - 0,03.
  reponse:
    valeur: 8.44
    forme: libre
  indices:
    relance: 0,03, ce sont des dixièmes ou des centièmes ?
    methode: Repère le chiffre des centièmes de 8,47 et enlève-lui 3, sans toucher aux autres chiffres.
    etape: Le chiffre des centièmes de 8,47 est 7.
  pieges:
  - si:
      valeur: 8.17
    relance: Tu as enlevé 3 dixièmes. Or 0,03, ce sont 3 centièmes.
  - si:
      valeur: 5.47
    relance: Tu as enlevé 3 unités. Or 0,03, ce sont 3 centièmes.
  solution: '0,03, c''est 3 centièmes. Le chiffre des centièmes de 8,47 passe de 7 à 4 : 8,47 - 0,03 = 8,44.'
- id: decimal-fois-dix
  type: nombre
  difficulte: 2
  enonce: Calcule 10 × 6,25.
  reponse:
    valeur: 62.5
    forme: libre
  indices:
    relance: Multiplier par 10 rend chaque chiffre 10 fois plus grand.
    methode: Les unités deviennent des dizaines, les dixièmes deviennent des unités, les centièmes deviennent des dixièmes.
    etape: Le 6 des unités devient 6 dizaines. Que deviennent le 2 des dixièmes et le 5 des centièmes ?
  pieges:
  - si:
      valeur: 625
    relance: Ce résultat correspond à une multiplication par 100. Pour × 10, on décale d'un seul rang.
  - si:
      valeur: 6.25
    relance: Ton nombre n'a pas changé de valeur. Multiplier par 10 doit donner un nombre plus grand.
  solution: '10 × 6,25 = 62,5 : 6 unités deviennent 6 dizaines, 2 dixièmes deviennent 2 unités, 5 centièmes deviennent 5 dixièmes.'
- id: decimal-divise-par-dix
  type: nombre
  difficulte: 3
  enonce: Calcule 48,3 ÷ 10.
  reponse:
    valeur: 4.83
    forme: libre
  indices:
    relance: Diviser par 10 rend chaque chiffre 10 fois plus petit.
    methode: Les dizaines deviennent des unités, les unités deviennent des dixièmes, les dixièmes deviennent des centièmes.
    etape: Le 4 des dizaines devient 4 unités. Que deviennent le 8 des unités et le 3 des dixièmes ?
  pieges:
  - si:
      valeur: 483
    relance: Tu as multiplié par 10. Diviser par 10 doit donner un nombre plus petit.
  - si:
      valeur: 0.483
    relance: Tu as décalé de deux rangs, comme pour ÷ 100. Pour ÷ 10, on décale d'un seul rang.
  solution: '48,3 ÷ 10 = 4,83 : 4 dizaines deviennent 4 unités, 8 unités deviennent 8 dixièmes, 3 dixièmes deviennent 3 centièmes.'
- id: choisir-operation-decalage
  type: choix
  difficulte: 2
  enonce: Pour calculer 10 × 72,41, quel décalage des chiffres faut-il effectuer ?
  reponse:
    options:
    - id: a
      texte: chaque chiffre prend une valeur 10 fois plus grande
    - id: b
      texte: chaque chiffre prend une valeur 10 fois plus petite
    - id: c
      texte: on ajoute simplement un zéro à la fin
    bonnes:
    - a
  indices:
    relance: Multiplier par 10 rend-il un nombre plus grand ou plus petit ?
    methode: Chaque chiffre change de rang dans le même sens que le résultat global (plus grand, ici).
    etape: 10 × 72,41 est bien plus grand que 72,41.
  pieges:
  - si:
      contient:
      - b
    relance: C'est le décalage utilisé pour une division par 10, pas une multiplication.
  - si:
      contient:
      - c
    relance: Cette astuce ne fonctionne pas pour un nombre décimal comme 72,41.
  solution: '10 × 72,41 = 724,1 : chaque chiffre prend une valeur 10 fois plus grande, la virgule se décale.'
- id: expliquer-diviser-par-dix
  type: ouverte
  difficulte: 3
  enonce: Explique ce qui se passe pour chaque chiffre d'un nombre décimal quand on le divise par 10, avec l'exemple de 35,6.
  criteres:
  - L'élève dit que chaque chiffre prend une valeur 10 fois plus petite.
  - L'élève applique cette idée à 35,6 (les dizaines deviennent unités, etc.) sans se tromper de sens.
  - L'élève donne le bon résultat et vérifie qu'il est plus petit que le nombre de départ.
  indices:
    relance: Diviser par 10 rend-il un nombre plus grand ou plus petit qu'avant ?
    methode: Le sens du décalage des chiffres dépend du sens de l'opération (multiplier ou diviser).
    etape: 35,6 divisé par 10 est plus petit que 35,6.
  solution: 'Diviser par 10 rend chaque chiffre 10 fois plus petit : dans 35,6, les dizaines (3) deviennent des unités, les
    unités (5) deviennent des dixièmes, et les dixièmes (6) deviennent des centièmes. On obtient 3,56, qui est bien plus petit
    que 35,6.'
- id: nblm-que-se-passe-t-il-pour-le-chiffre-des-un-1
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il pour le chiffre des unités quand on multiplie un nombre entier par 1 000 ?
  reponse:
    options:
    - id: o1
      texte: Il prend une valeur 1 000 fois plus grande et devient le chiffre des milliers.
    - id: o2
      texte: Il devient le chiffre des dizaines.
    - id: o3
      texte: Il prend une valeur 100 fois plus petite.
    - id: o4
      texte: Sa valeur de position ne change pas.
    bonnes:
    - o1
  indices:
    relance: Pense à la valeur qu'obtient une unité quand elle est multipliée par 1 000.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur typique : devenir le chiffre des dizaines correspond à une multiplication par 10, pas par
      1 000.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la multiplication rend la valeur des chiffres plus grande, tandis que la division la rend plus
      petite.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : la multiplication par 1 000 modifie la valeur de position de tous les chiffres du nombre.'
  solution: 'Il prend une valeur 1 000 fois plus grande et devient le chiffre des milliers. C''est exact : lors d''une multiplication
    par 1 000, chaque chiffre prend une valeur 1 000 fois plus grande, donc le chiffre des unités devient celui des milliers.'
- id: nblm-lorsqu-on-divise-un-nombre-decimal-par-1-2
  type: choix
  difficulte: 2
  enonce: Lorsqu'on divise un nombre décimal par 10, comment la valeur de chaque chiffre évolue-t-elle ?
  reponse:
    options:
    - id: o1
      texte: Elle prend une valeur 10 fois plus petite, ce qui décale chaque chiffre d'un rang vers le bas.
    - id: o2
      texte: Elle prend une valeur 10 fois plus grande.
    - id: o3
      texte: Chaque chiffre se décale de deux rangs.
    - id: o4
      texte: Seul le premier chiffre du nombre change de valeur.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que diviser rend le nombre plus petit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la multiplication augmente la valeur du chiffre, alors que la division la diminue.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : le décalage de deux rangs correspond à une opération par 100, pas par 10.'
  - si:
      contient:
      - o4
    relance: 'Attention : la division par 10 modifie la valeur de position de tous les chiffres du nombre, pas seulement le
      premier.'
  solution: 'Elle prend une valeur 10 fois plus petite, ce qui décale chaque chiffre d''un rang vers le bas. C''est exact
    : diviser par 10 rend chaque chiffre 10 fois plus petit, par exemple une unité devient un dixième.'
- id: nblm-comment-calcule-t-on-mentalement-4-45-0-3
  type: choix
  difficulte: 2
  enonce: Comment calcule-t-on mentalement 4,45 + 0,3 sans poser l'opération ?
  reponse:
    options:
    - id: o1
      texte: On repère le chiffre des dixièmes (4) et on lui ajoute 3 dixièmes pour obtenir 4,75.
    - id: o2
      texte: On ajoute 3 aux centièmes pour obtenir 4,48.
    - id: o3
      texte: On ajoute 3 à la partie entière pour trouver 7,45.
    - id: o4
      texte: On ajoute un zéro à la fin du nombre pour obtenir 4,450.
    bonnes:
    - o1
  indices:
    relance: Observe bien la position du chiffre 3 dans 0,3.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : cela revient à confondre les dixièmes avec les centièmes.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : 0,3 est plus petit que 1, il ne s''agit pas de 3 unités entières.'
  - si:
      contient:
      - o4
    relance: 'Faux : ajouter un zéro à la fin ne réalise pas l''addition de 0,3.'
  solution: 'On repère le chiffre des dixièmes (4) et on lui ajoute 3 dixièmes pour obtenir 4,75. C''est exact : 0,3 représente
    3 dixièmes. On repère le chiffre des dixièmes (4) et on modifie seulement celui-ci sans toucher aux autres.'
- id: nblm-pour-calculer-le-produit-d-un-nombre-ent-4
  type: choix
  difficulte: 2
  enonce: Pour calculer le produit d'un nombre entier par 100, comment varie la valeur de ses chiffres ?
  reponse:
    options:
    - id: o1
      texte: Chaque chiffre prend une valeur 100 fois plus grande (les unités deviennent des centaines).
    - id: o2
      texte: Chaque chiffre prend une valeur 10 fois plus grande.
    - id: o3
      texte: On colle simplement le nombre 100 à la fin du nombre.
    - id: o4
      texte: Chaque chiffre prend une valeur 100 fois plus petite.
    bonnes:
    - o1
  indices:
    relance: Pense à la relation entre le rang des unités et celui des centaines.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : rendre chaque chiffre 10 fois plus grand correspond à une multiplication par 10.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : la valeur de position de chaque chiffre doit changer de deux rangs.'
  - si:
      contient:
      - o4
    relance: 'Faux : la multiplication agrandit la valeur des chiffres, elle ne la réduit pas.'
  solution: 'Chaque chiffre prend une valeur 100 fois plus grande (les unités deviennent des centaines). C''est exact : multiplier
    par 100 décale la valeur de chaque chiffre de deux rangs vers le haut.'
- id: nblm-quel-est-le-resultat-du-calcul-mental-10-5
