  - si:
      contient:
      - o4
    relance: 'Incorrect : rajouter des zéros inutilement après la virgule montre une confusion sur la règle.'
  solution: '724,1 car chaque chiffre prend une valeur 10 fois plus grande. C''est exact : chaque chiffre prend une valeur
    10 fois plus grande (les dixièmes deviennent unités, les centièmes deviennent dixièmes).'
