format: 2
notion: cm1-memoriser-des-faits-numeriques
version: 3
etat: verifiee
declencheurs:
- réponse instantanée
- sans recompter
- multiple de 25
- décomposer soixante
- écriture décimale simple
- réciter les tables
- apprendre par cœur
- double d'un nombre
- moitié d'un nombre
prerequis:
- cm1-fractions-decimales-et-ecriture-a-virgule
essentiel: 'Un fait numérique, c''est un résultat que l''on connaît par cœur et que l''on retrouve tout de suite, sans recompter.
  Cela libère la tête pour réfléchir au reste d''un problème.


  Au CM1, on connaît par cœur les tables d''addition et de multiplication, et on les restitue très vite. Par exemple, 8 +
  7 = 15 et 6 × 7 = 42 doivent venir sans compter sur ses doigts.


  On connaît aussi les doubles des nombres de 1 à 20 (le double de 17, c''est 34) et les moitiés des nombres pairs de 2 à
  40 (la moitié de 36, c''est 18). Le double et la moitié sont deux opérations inverses.


  On connaît les multiples de 25 jusqu''à 100 : 25, 50, 75, 100. C''est comme les pièces de monnaie : quatre fois 25 centimes
  font 100 centimes.


  On connaît des façons d''écrire 60 comme produit de deux nombres : 6 × 10, 5 × 12, 4 × 15, 3 × 20, 2 × 30.


  On connaît des relations entre fractions usuelles : 1/2 + 1/2 = 1, 1/4 + 1/4 = 1/2, 1 - 1/2 = 1/2, 1/2 - 1/4 = 1/4. Deux
  moitiés de pizza font une pizza entière ; deux quarts font une moitié.


  On sait aussi qu''un dixième vaut dix centièmes (1/10 = 10/100) et qu''une unité vaut cent centièmes (1 = 100/100).


  Enfin, on connaît l''écriture décimale de deux fractions usuelles : 1/10 = 0,1 et 1/100 = 0,01.


  Pour bien retenir, on s''entraîne un peu chaque jour et on relie un nouveau fait à un fait déjà connu.

  '
methode:
- S'entraîner chaque jour un peu, à l'oral ou par écrit, sur les tables d'addition et de multiplication.
- Répondre de plus en plus vite, sans recompter sur ses doigts.
- Réciter régulièrement les doubles et les moitiés pour les fixer en mémoire.
- Relier un fait nouveau à un fait connu (par exemple, 3 × 25 est juste avant 4 × 25 = 100).
- Utiliser les relations entre fractions usuelles pour compléter une égalité sans calculer.
- Se tester avec un camarade ou avec des cartes pour repérer les faits encore fragiles.
vocabulaire:
- terme: fait numérique
  definition: résultat de calcul que l'on connaît par cœur, comme 6 × 7 = 42.
- terme: double
  definition: le double d'un nombre, c'est ce nombre ajouté à lui-même, ou multiplié par 2.
- terme: moitié
  definition: la moitié d'un nombre, c'est ce qu'on obtient en le partageant en deux parts égales.
- terme: multiple de 25
  definition: nombre que l'on obtient en multipliant 25 par un nombre entier (25, 50, 75, 100...).
- terme: dixième
  definition: une des dix parts égales d'une unité ; il s'écrit 1/10 ou 0,1.
- terme: centième
  definition: une des cent parts égales d'une unité ; il s'écrit 1/100 ou 0,01.
erreurs_frequentes:
- Recalculer une table connue au lieu de la restituer directement.
- Confondre le double et la moitié d'un nombre.
- Oublier qu'un dixième vaut dix centièmes.
- Confondre 0,1 (un dixième) et 0,01 (un centième).
- Confondre deux résultats voisins des tables (par exemple 7 × 8 et 6 × 9).
exemple:
  enonce: 'Complète sans calculer : 1/4 + 1/4 = … ; 1/2 - 1/4 = ….'
  solution: 1/4 + 1/4 = 1/2 (deux quarts font une moitié). 1/2 - 1/4 = 1/4 (il reste un quart quand on retire un quart d'une
    moitié).
exercices:
- id: double-de-seize
  type: nombre
  difficulte: 1
  enonce: Donne rapidement le double de 16.
  reponse:
    valeur: 32
    forme: entier
  indices:
    relance: Le double de 16, c'est 16 + 16.
    methode: Additionne 16 à lui-même, ou pense à un fait connu proche (double de 15 = 30).
    etape: 16, c'est 15 + 1. Le double de 15 est 30. Quel est le double de 1 ? Ajoute les deux doubles.
  pieges:
  - si:
      valeur: 30
    relance: Tu as peut-être pensé au double de 15. Recommence avec 16.
  solution: Le double de 16 est 32.
- id: moitie-de-trente
  type: nombre
  difficulte: 1
  enonce: Donne rapidement la moitié de 30.
  reponse:
    valeur: 15
    forme: entier
  indices:
    relance: La moitié de 30, c'est le nombre qui, ajouté à lui-même, donne 30.
    methode: 'Pense à la table de multiplication par 2 : quel nombre multiplié par 2 donne 30 ?'
    etape: Cherche un nombre qui, multiplié par 2, donne 30.
  pieges:
  - si:
      valeur: 60
    relance: 60 est le double de 30, pas sa moitié. Cherche un nombre plus petit.
  solution: La moitié de 30 est 15.
- id: table-sept-fois-huit
  type: nombre
  difficulte: 1
  enonce: Donne rapidement le résultat de 7 × 8.
  reponse:
    valeur: 56
    forme: entier
  indices:
    relance: Cherche dans la table de 7 ou dans la table de 8.
    methode: Si tu hésites, pars d'un fait que tu connais bien dans la même table, puis avance d'un pas.
    etape: Tu sais que 7 × 7 = 49 ; ajoute encore 7.
  pieges:
  - si:
      valeur: 54
    relance: 54 est le résultat d'une autre multiplication, de la table de 6 ou de 9. Récite la table de 7.
  - si:
      valeur: 15
    relance: Tu as additionné les deux nombres. Ici, il faut les multiplier.
  solution: 7 × 8 = 56 (7 × 7 = 49, et 49 + 7 = 56).
- id: multiple-de-vingt-cinq
  type: nombre
  difficulte: 1
  enonce: 'Complète : 3 × 25 = ...'
  reponse:
    valeur: 75
    forme: entier
  indices:
    relance: Pense à la liste des nombres qu'on obtient en comptant de 25 en 25.
    methode: 25 + 25 + 25, ou utilise le fait que 3 × 25 est juste avant 100.
    etape: 2 × 25 = 50.
  pieges:
  - si:
      valeur: 50
    relance: 50 est 2 × 25. Il faut encore ajouter 25 une fois.
  solution: 3 × 25 = 75.
- id: decomposer-soixante
  type: nombre
  difficulte: 1
  enonce: 'Complète : 60 = 4 × ...'
  reponse:
    valeur: 15
    forme: entier
  indices:
    relance: Pense aux décompositions de 60 en produit de deux nombres.
    methode: Cherche le nombre qui, multiplié par 4, donne 60.
    etape: 4 × 10 = 40, il manque encore 20 pour atteindre 60.
  pieges:
  - si:
      valeur: 10
    relance: 4 × 10 = 40, ce n'est pas encore 60. Continue à chercher.
  solution: 60 = 4 × 15.
- id: relations-fractions-usuelles
  type: association
  difficulte: 2
  enonce: Relie chaque calcul de fractions usuelles à son résultat.
  reponse:
    gauche:
    - id: a
      texte: 1/2 + 1/2
    - id: b
      texte: 1/4 + 1/4
    - id: c
      texte: 1/2 - 1/4
    droite:
    - id: x
      texte: '1'
    - id: y
      texte: 1/4
    - id: z
      texte: 1/2
    paires:
      a: x
      b: z
      c: y
  indices:
    relance: Utilise les relations usuelles apprises par cœur, sans recalculer avec un dessin.
    methode: Deux moitiés font une unité entière ; deux quarts font une moitié ; une moitié, c'est deux quarts.
    etape: 1/2 + 1/2 est la somme des deux moitiés qui composent une unité entière.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association ne va pas. Revérifie les relations entre moitié et quart.
  - si:
      diagnostic: associations_fausses
    relance: Imagine une pizza coupée en deux, puis en quatre, et compte les parts pour chaque calcul.
  solution: 1/2 + 1/2 = 1 ; 1/4 + 1/4 = 1/2 ; 1/2 - 1/4 = 1/4.
- id: centiemes-dans-un-dixieme
  type: nombre
  difficulte: 2
  enonce: Combien de centièmes y a-t-il dans un dixième ?
  reponse:
    valeur: 10
    forme: entier
  indices:
    relance: Un dixième, c'est une part quand on partage l'unité en dix ; un centième, quand on la partage en cent.
    methode: Cherche combien de petites parts d'un centième il faut pour remplir une part d'un dixième.
    etape: Dans l'unité, il y a cent centièmes et dix dixièmes. Partage les cent centièmes en dix paquets égaux.
  pieges:
  - si:
      valeur: 100
    relance: Cent centièmes font une unité entière, pas un dixième. Un dixième est plus petit qu'une unité.
  solution: Un dixième vaut 10 centièmes, car 1/10 = 10/100.
- id: ecriture-decimale-centieme
  type: texte_court
  difficulte: 2
  enonce: Écris 1/100 avec une virgule, sans calcul intermédiaire.
  reponse:
    acceptees:
    - 0,01
    - '0.01'
    fautes_tolerees: 0
  indices:
    relance: Un centième est une fraction usuelle dont l'écriture décimale est à connaître par cœur.
    methode: Un centième s'écrit avec deux chiffres après la virgule.
    etape: Tu sais que 1/10 = 0,1. Un centième est dix fois plus petit qu'un dixième. Où se place alors le chiffre 1 ?
  pieges:
  - si:
      valeur: 0,1
    relance: 0,1 correspond à 1/10, pas à 1/100. Un centième a deux chiffres après la virgule.
  solution: 1/100 = 0,01.
- id: expliquer-retenir-faits
  type: ouverte
  difficulte: 3
  enonce: Explique à un camarade comment tu fais pour retenir un résultat de table difficile, puis comment tu retrouves sans
    calculer que deux quarts font une moitié. Tu peux proposer un petit jeu à faire à la maison.
  criteres:
  - L'élève décrit une façon concrète de s'entraîner (réciter, cartes, jeu, un peu chaque jour).
  - L'élève explique qu'on peut relier un fait difficile à un fait déjà connu (par exemple partir d'un double ou d'un résultat
    voisin de la table).
  - L'élève explique correctement que deux quarts font une moitié (1/4 + 1/4 = 1/2), par exemple avec une pizza ou une bande.
  indices:
    relance: Quel résultat de table te pose le plus de difficultés ? Quel fait proche connais-tu déjà bien ?
    methode: Décris ce que tu fais chaque jour pour t'entraîner, puis utilise un dessin de pizza pour les quarts.
    etape: Commence par choisir un résultat difficile, puis dis à partir de quel résultat facile tu peux le retrouver.
  solution: Pour retenir un résultat difficile, je le récite un peu chaque jour et je le relie à un fait connu, par exemple
    je pars de 7 × 7 = 49 pour retrouver 7 × 8 = 56. Pour les fractions, je pense à une pizza coupée en quatre parts égales
    ; deux parts forment une moitié, donc 1/4 + 1/4 = 1/2.
