- id: nblm-quelle-est-la-bonne-maniere-de-decompose-3
  type: choix
  difficulte: 2
  enonce: Quelle est la bonne manière de décomposer soixante en un produit de deux nombres selon la fiche de notion ?
  reponse:
    options:
    - id: o1
      texte: 4 × 15
    - id: o2
      texte: 5 × 10
    - id: o3
      texte: 8 × 7
    - id: o4
      texte: 3 × 25
    bonnes:
    - o1
  indices:
    relance: Recherche la paire de facteurs dont le produit est égal à 60.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur de produit : 5 × 10 donne 50. Pour obtenir 60, il faut faire 6 × 10.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : 8 × 7 est égal à 56, pas à 60.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : 3 × 25 donne 75, qui est un multiple de 25.'
