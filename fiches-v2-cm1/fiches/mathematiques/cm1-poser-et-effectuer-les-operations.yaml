format: 2
notion: cm1-poser-et-effectuer-les-operations
version: 2
etat: verifiee
declencheurs:
- dividende et diviseur
- calcul avec parenthèses
- vérifier avec un ordre de grandeur
- aligner les virgules
- résultat cohérent
- poser en colonnes
- multiplication à deux chiffres
- virgule dans la multiplication
- quotient et reste
prerequis:
- cm1-numeration-des-entiers
- cm1-nombres-decimaux-ecriture-a-virgule
essentiel: 'Au cours moyen, on n''a pas de calculatrice personnelle : on pose les opérations en colonnes ou on calcule mentalement.


  Avant de calculer, on peut estimer un ordre de grandeur du résultat en remplaçant les nombres par des nombres ronds proches
  : 52 × 37 est proche de 50 × 40, donc proche de 2 000. On utilise le symbole ≈ pour écrire une estimation. Après le calcul,
  on compare : si le résultat est très loin de l''estimation, on a sans doute fait une erreur.


  Dans un calcul avec des parenthèses, on effectue toujours ce qu''il y a dans les parenthèses en premier : 3 × (10 - 6) =
  3 × 4 = 12.


  Pour additionner ou soustraire des nombres décimaux en colonnes, on aligne les virgules : unités sous unités, dixièmes sous
  dixièmes, centièmes sous centièmes. On peut ajouter des zéros à la fin pour avoir autant de chiffres après la virgule (45,3
  = 45,30).


  Pour multiplier deux nombres entiers, on multiplie par le chiffre des unités, puis par le chiffre des dizaines en décalant
  d''un rang (on écrit un 0 au rang des unités), puis on additionne les lignes. Pour multiplier un nombre décimal par un entier
  inférieur à 10, on calcule sans la virgule, puis on la place : le produit a autant de chiffres après la virgule que le nombre
  décimal.


  Dans une division euclidienne, le dividende est le nombre partagé, le diviseur le nombre de parts, le quotient le résultat,
  et le reste ce qui n''a pas pu être partagé. Au CM1, le diviseur n''a qu''un chiffre. Le reste est toujours plus petit que
  le diviseur, et on vérifie avec : dividende = diviseur × quotient + reste.

  '
methode:
- Avant de poser l'opération, estimer un ordre de grandeur pour pouvoir vérifier le résultat ensuite.
- S'il y a des parenthèses, calculer d'abord ce qu'elles contiennent.
- Aligner correctement les chiffres selon leur rang (unités sous unités, dixièmes sous dixièmes…) avant de poser.
- Poser l'opération et effectuer le calcul étape par étape, sans oublier les retenues.
- Pour un produit avec un nombre décimal, placer la virgule à la fin du calcul.
- 'Comparer le résultat obtenu à l''ordre de grandeur estimé au début : est-ce cohérent ?'
vocabulaire:
- terme: ordre de grandeur
  definition: Un résultat approché, calculé avec des nombres ronds, qui permet de vérifier un calcul.
- terme: produit
  definition: Le résultat d'une multiplication.
- terme: dividende
  definition: Dans une division, le nombre que l'on partage.
- terme: diviseur
  definition: Dans une division, le nombre de parts ou la taille des paquets.
- terme: quotient
  definition: Le résultat d'une division euclidienne, c'est-à-dire le nombre de parts ou de paquets obtenus.
- terme: reste
  definition: Ce qui n'a pas pu être partagé ; il est toujours plus petit que le diviseur.
erreurs_frequentes:
- Mal aligner les chiffres d'une addition ou d'une soustraction de nombres décimaux (oublier d'aligner les virgules).
- Oublier de calculer d'abord ce qui est entre parenthèses.
- Confondre le dividende et le diviseur dans une division.
- Oublier le décalage (le 0 des unités) sur la deuxième ligne d'une multiplication posée.
- Oublier de placer la virgule dans le produit d'un nombre décimal par un entier.
exemple:
  enonce: 'Estime puis calcule : 3 × (10 - 6).'
  solution: 'On calcule d''abord la parenthèse : 10 - 6 = 4. Puis 3 × 4 = 12. C''est cohérent : 3 × 4 est un peu plus de 10.'
exercices:
- id: addition-avec-virgules
  type: nombre
  difficulte: 1
  enonce: Pose et effectue 56,75 + 234 + 0,8.
  reponse:
    valeur: 291.55
    forme: libre
  indices:
    relance: Aligne bien les virgules avant d'additionner, comme sur une opération posée.
    methode: Écris 234 comme 234,00 et 0,8 comme 0,80, pour avoir le même nombre de chiffres après la virgule.
    etape: 56,75 a deux chiffres après la virgule ; complète les deux autres nombres pour qu'ils en aient autant.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Revérifie l'alignement des unités, dixièmes et centièmes avant d'additionner colonne par colonne.
  solution: 56,75 + 234,00 + 0,80 = 291,55.
- id: calcul-avec-parentheses
  type: nombre
  difficulte: 1
  enonce: Calcule 3 × (10 - 6).
  reponse:
    valeur: 12
    forme: entier
  indices:
    relance: Que faut-il calculer en premier dans une expression avec des parenthèses ?
    methode: Calcule d'abord ce qui est entre parenthèses, puis multiplie le résultat par le nombre extérieur.
    etape: 10 - 6 = 4.
  pieges:
  - si:
      valeur: 24
    relance: As-tu bien calculé la parenthèse avant de multiplier par 3 ?
  solution: 10 - 6 = 4, puis 3 × 4 = 12.
- id: soustraction-decimaux-posee
  type: nombre
  difficulte: 2
  enonce: Pose et effectue 45,3 - 18,76.
  reponse:
    valeur: 26.54
    forme: libre
  indices:
    relance: Aligne les virgules, puis complète 45,3 pour qu'il ait deux chiffres après la virgule.
    methode: Écris 45,3 sous la forme 45,30, puis soustrais colonne par colonne en commençant par les centièmes.
    etape: Aux centièmes, tu ne peux pas enlever 6 à 0 ; il faut faire une retenue.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie l'alignement des virgules et les retenues. Tu peux contrôler en additionnant ton résultat et 18,76.
  solution: '45,30 - 18,76 = 26,54. Vérification : 26,54 + 18,76 = 45,30.'
- id: multiplication-deux-entiers
  type: nombre
  difficulte: 2
  enonce: Pose et effectue 34 × 26.
  reponse:
    valeur: 884
    forme: entier
  indices:
    relance: 'Ordre de grandeur : 34 × 26 est proche de 30 × 30.'
    methode: Multiplie 34 par 6, puis 34 par 20 (en écrivant un 0 au rang des unités), puis additionne les deux lignes.
    etape: La première ligne est 34 × 6 = 204.
  pieges:
  - si:
      valeur: 272
    relance: Tu as oublié le décalage de la deuxième ligne. 34 × 2 dizaines, ce sont des dizaines, pas des unités.
  - si:
      diagnostic: valeur_fausse
    relance: Revérifie chaque ligne et les retenues, puis compare ton résultat à l'ordre de grandeur, environ 900.
  solution: 34 × 6 = 204 ; 34 × 20 = 680 ; 204 + 680 = 884. C'est proche de l'ordre de grandeur 30 × 30 = 900.
- id: division-euclidienne-743-par-9
  type: nombre
  difficulte: 2
  enonce: Pose et effectue la division euclidienne de 743 par 9. Donne le quotient.
  reponse:
    valeur: 82
    forme: entier
  indices:
    relance: 743 est le dividende, 9 est le diviseur.
    methode: Cherche combien de fois 9 entre dans 74, puis abaisse le chiffre suivant.
    etape: 9 × 8 = 72, ce qui est proche de 74.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: 'Vérifie ton calcul en multipliant ton quotient par 9 et en ajoutant le reste : retrouves-tu 743 ?'
  solution: 743 = 9 × 82 + 5, donc le quotient est 82 (et le reste est 5).
- id: reste-division-743
  type: nombre
  difficulte: 2
  enonce: Dans la division euclidienne de 743 par 9, donne le reste.
  reponse:
    valeur: 5
    forme: entier
  indices:
    relance: Le reste est ce qui n'a pas pu être partagé après avoir formé le plus de groupes de 9 possible.
    methode: Multiplie le quotient par le diviseur, puis soustrais ce produit au dividende.
    etape: 9 × 82 = 738.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que ton reste est bien plus petit que le diviseur (9).
  solution: '743 - (9 × 82) = 743 - 738 = 5 : le reste est 5.'
- id: decimal-fois-entier-pose
  type: nombre
  difficulte: 3
  enonce: Un cahier coûte 4,75 €. Pose et effectue la multiplication pour trouver le prix, en euros, de 6 cahiers.
  reponse:
    valeur: 28.5
    forme: libre
  indices:
    relance: 'Ordre de grandeur : 4,75 € est proche de 5 €, et 5 × 6 = 30.'
    methode: Calcule d'abord 475 × 6 sans la virgule, puis place la virgule dans le produit.
    etape: 4,75 a deux chiffres après la virgule, donc le produit en a aussi deux avant de supprimer le zéro final.
  pieges:
  - si:
      valeur: 2850
    relance: Tu as oublié de placer la virgule. Compare ton résultat à l'ordre de grandeur, environ 30 €.
  - si:
      valeur: 285
    relance: La virgule est mal placée. Le produit doit avoir deux chiffres après la virgule, comme 4,75.
  solution: 475 × 6 = 2 850. 4,75 a deux chiffres après la virgule, donc 4,75 × 6 = 28,50 = 28,5. Les 6 cahiers coûtent 28,50
    €, proche de l'ordre de grandeur 30 €.
- id: choisir-bon-ordre-de-grandeur
  type: choix
  difficulte: 2
  enonce: Quel est le meilleur ordre de grandeur pour 212 + 298 + 496 ?
  reponse:
    options:
    - id: a
      texte: environ 1 000
    - id: b
      texte: environ 500
    - id: c
      texte: environ 2 000
    bonnes:
    - a
  indices:
    relance: Remplace chaque nombre par un nombre rond proche (centaine la plus proche), puis additionne ces nombres ronds.
    methode: 212 est proche de 200, 298 est proche de 300, 496 est proche de 500.
    etape: 200 + 300 + 500.
  pieges:
  - si:
      contient:
      - b
    relance: 500 est trop petit pour la somme de trois nombres qui sont chacun proches de plusieurs centaines.
  - si:
      contient:
      - c
    relance: Additionne bien les trois nombres ronds choisis, sans en oublier un.
  solution: '200 + 300 + 500 = 1 000 : c''est le meilleur ordre de grandeur pour 212 + 298 + 496 (résultat exact 1 006).'
- id: expliquer-verifier-division
  type: ouverte
  difficulte: 3
  enonce: Sans calculatrice, explique comment tu peux vérifier que la division euclidienne de 743 par 9 donne bien un quotient
    de 82 et un reste de 5.
  criteres:
  - L'élève multiplie le quotient par le diviseur (9 × 82) et ajoute le reste.
  - L'élève compare le résultat obtenu au dividende 743.
  - L'élève vérifie aussi que le reste est plus petit que le diviseur.
  indices:
    relance: Quelle égalité relie le dividende, le diviseur, le quotient et le reste ?
    methode: Multiplie le quotient par le diviseur, ajoute le reste, et regarde si tu retrouves le dividende.
    etape: Pense aussi à comparer le reste avec le diviseur.
  solution: 'On calcule 9 × 82 = 738, puis 738 + 5 = 743 : on retrouve le dividende. De plus, le reste 5 est plus petit que
    le diviseur 9. La division est donc juste.'
