# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-fractions-decimales-et-ecriture-a-virgule
version: 3
etat: verifiee
declencheurs:
- dénominateur 10 ou 100
- passer en centièmes
- fraction sur cent
- au-delà de l'unité
- ranger des dixièmes
- nombre à virgule
- dix dixièmes
- transformer en fraction
prerequis:
- cm1-sens-et-ecriture-des-fractions
essentiel: 'Une fraction décimale est une fraction dont le dénominateur est 10, 100 ou 1 000. Si on partage une unité en 10
  parts égales, chaque part est un dixième : 1/10. Si on la partage en 100 parts égales, chaque part est un centième : 1/100.


  Les relations à connaître : 1 = 10/10 = 100/100, et 1/10 = 10/100. Une unité, c''est dix dixièmes. Un dixième, c''est dix
  centièmes. Exemple : une plaque de chocolat de 10 carreaux. 3 carreaux, c''est 3/10 de la plaque.


  Une fraction décimale peut être plus grande que 1. On l''écrit alors comme un nombre entier plus une fraction plus petite
  que 1 : 356/100 = 300/100 + 56/100 = 3 + 56/100. On peut séparer encore plus : 3 + 5/10 + 6/100.


  On peut ensuite passer à l''écriture à virgule. On écrit la partie entière, puis la virgule, puis le chiffre des dixièmes
  et celui des centièmes : 356/100 = 3,56. Dans l''autre sens, 1,8 = 1 + 8/10 = 18/10. Attention : 5 + 4/100 s''écrit 5,04,
  avec un 0 à la place des dixièmes.


  Sur une demi-droite graduée, on partage chaque unité en 10 (ou en 100) parts égales. Puis on compte les petites graduations
  depuis 0.


  Pour comparer, encadrer, intercaler ou ranger des fractions décimales, on les écrit avec le même dénominateur. Exemple :
  16/10 = 160/100, donc 16/10 > 130/100. On utilise les symboles =, < et >.

  '
methode:
- 'Repérer le dénominateur (10, 100 ou 1 000) : il dit si ce sont des dixièmes, des centièmes ou des millièmes.'
- 'Pour séparer la partie entière : chercher combien de fois le dénominateur entre entièrement dans le numérateur.'
- Écrire le reste comme une fraction décimale plus petite que 1.
- 'Pour passer à l''écriture à virgule : écrire la partie entière, la virgule, puis les dixièmes et les centièmes.'
- Pour comparer deux fractions décimales de dénominateurs différents, les transformer pour avoir le même dénominateur.
vocabulaire:
- terme: fraction décimale
  definition: Une fraction dont le dénominateur est 10, 100 ou 1 000.
- terme: dixième
  definition: Une des 10 parts égales d'une unité ; elle s'écrit 1/10.
- terme: centième
  definition: Une des 100 parts égales d'une unité ; elle s'écrit 1/100.
- terme: écriture à virgule
  definition: Une autre façon d'écrire une fraction décimale, par exemple 3,56 pour 356/100.
- terme: partie entière
  definition: Le nombre entier écrit à gauche de la virgule.
- terme: encadrer
  definition: Trouver un nombre juste plus petit et un nombre juste plus grand qu'un nombre donné.
erreurs_frequentes:
- Croire que 14/10 est plus petit que 9/10 parce que 14 semble être « après la virgule ».
- Oublier qu'un dixième vaut dix centièmes (1/10 = 10/100) quand on compare.
- Se tromper en séparant la partie entière d'une fraction décimale supérieure à 1.
- Écrire 5,4 au lieu de 5,04 pour 5 + 4/100, en oubliant le 0 à la place des dixièmes.
exemple:
  enonce: 'Range dans l''ordre croissant : 3 ; 25/10 ; 270/100 ; 8/10.'
  solution: 'On met tout en centièmes : 3 = 300/100 ; 25/10 = 250/100 ; 270/100 reste 270/100 ; 8/10 = 80/100. Ordre croissant
    : 8/10 < 25/10 < 270/100 < 3.'
exercices:
- id: separer-quatre-cent-dix-sept-centiemes
  type: nombre
  difficulte: 1
  enonce: Écris 417/100 comme la somme d'un nombre entier et d'une fraction décimale plus petite que 1. Donne cette fraction
    sous la forme a/b.
  reponse:
    valeur: 17/100
    forme: libre
  indices:
    relance: '100/100 = 1 : combien de fois 100 entre-t-il entièrement dans 417 ?'
    methode: Multiplie ta réponse pour la partie entière par 100, puis soustrais du numérateur de départ pour trouver le reste.
    etape: 4 × 100 = 400, ce qui est le plus grand multiple de 100 ne dépassant pas 417.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que ta fraction, ajoutée à la partie entière trouvée, redonne bien 417/100.
  solution: 417/100 = 4 + 17/100, car 4 × 100 = 400 et il reste 17.
- id: encadrer-soixante-sept-dixiemes
  type: nombre
  difficulte: 1
  enonce: Encadre la fraction décimale 67/10 par deux nombres entiers consécutifs. Donne le plus petit des deux.
  reponse:
    valeur: 6
    forme: entier
  indices:
    relance: '10/10 = 1 : combien de fois 10 entre-t-il entièrement dans 67 ?'
    methode: Cherche le plus grand multiple de 10 qui ne dépasse pas 67.
    etape: Repère le plus grand multiple de 10 qui ne dépasse pas 67.
  pieges:
  - si:
      valeur: 7
    relance: 7 est le nombre entier juste au-dessus de 67/10, pas le plus petit des deux encadrants.
  solution: '60/10 = 6 et 70/10 = 7, donc 6 < 67/10 < 7 : le plus petit encadrant est 6.'
- id: ecrire-a-virgule-trois-cent-sept-centiemes
  type: nombre
  difficulte: 1
  enonce: Écris la fraction décimale 307/100 avec une virgule.
  reponse:
    valeur: 3.07
    forme: libre
  indices:
    relance: Combien d'unités entières y a-t-il dans cette fraction ? Combien de centièmes restent-ils ?
    methode: Sépare la partie entière, puis place les dixièmes et les centièmes après la virgule.
    etape: 300/100 = 1 + 1 + 1. Il reste 7 centièmes et aucun dixième.
  pieges:
  - si:
      valeur: 3.7
    relance: Le 7 compte des centièmes, pas des dixièmes. Quel chiffre faut-il écrire à la place des dixièmes ?
  - si:
      diagnostic: valeur_fausse
    relance: Écris d'abord la fraction comme un nombre entier plus des centièmes, puis passe à la virgule.
  solution: '307/100 = 300/100 + 7/100 = 3 + 7/100. Il n''y a aucun dixième, donc on écrit 0 à sa place : 307/100 = 3,07.'
- id: virgule-vers-fraction
  type: choix
  difficulte: 2
  enonce: Quelles écritures sont égales à 5,3 ?
  reponse:
    options:
    - id: a
      texte: 53/10
    - id: b
      texte: 53/100
    - id: c
      texte: 5 + 3/10
    - id: d
      texte: 5/3
    bonnes:
    - a
    - c
  indices:
    relance: Dans 5,3, le chiffre 3 compte-t-il des dixièmes ou des centièmes ?
    methode: Écris 5,3 comme 5 unités plus des dixièmes, puis transforme les 5 unités en dixièmes.
    etape: 5 unités, c'est 50 dixièmes. Ajoute les dixièmes qui sont après la virgule.
  pieges:
  - si:
      contient:
      - b
    relance: 53/100, ce sont des centièmes. Le 3 de 5,3 est-il à la place des centièmes ?
  - si:
      contient:
      - d
    relance: 5/3 se lit « cinq tiers » ; ce n'est pas une fraction décimale. Quel doit être le dénominateur ?
  - si:
      diagnostic: incomplet
    relance: Il y a deux bonnes écritures. Cherche aussi celle qui sépare la partie entière.
  solution: 5,3 = 5 + 3/10. Et 5 = 50/10, donc 5,3 = 50/10 + 3/10 = 53/10. Les bonnes écritures sont 53/10 et 5 + 3/10.
- id: point-sur-demi-droite-en-dixiemes
  type: nombre
  difficulte: 2
  enonce: Sur une demi-droite graduée, chaque unité est partagée en 10 parts égales. Le point A est placé 4 petites graduations
    après le repère 2. Quelle fraction décimale, en dixièmes, repère le point A ?
  reponse:
    valeur: 24/10
    forme: libre
  indices:
    relance: Combien de dixièmes y a-t-il de 0 jusqu'au repère 2 ?
    methode: Compte les dixièmes des unités entières, puis ajoute les petites graduations en plus.
    etape: Une unité, c'est 10 dixièmes. Deux unités, c'est 20 dixièmes.
  pieges:
  - si:
      valeur: 4/10
    relance: Tu as compté les graduations après le repère 2, mais il faut compter depuis 0.
  - si:
      diagnostic: valeur_fausse
    relance: Chaque petite graduation vaut un dixième. Compte-les toutes depuis 0.
  solution: 'De 0 à 2, il y a 20 dixièmes : 2 = 20/10. On ajoute 4 dixièmes : 20/10 + 4/10 = 24/10. Le point A est repéré
    par 24/10, soit 2,4.'
- id: comparer-quatorze-dixiemes-cent-vingt-centiemes
  type: choix
  difficulte: 2
  enonce: Compare 14/10 et 120/100. Laquelle est la plus grande ?
  reponse:
    options:
    - id: a
      texte: 14/10 est plus grand
    - id: b
      texte: 120/100 est plus grand
    - id: c
      texte: elles sont égales
    bonnes:
    - a
  indices:
    relance: Transforme 14/10 en centièmes pour comparer avec 120/100.
    methode: Multiplie le numérateur et le dénominateur de 14/10 par 10 pour obtenir des centièmes.
    etape: 14/10 = 140/100, car 14 × 10 = 140 et 10 × 10 = 100.
  pieges:
  - si:
      contient:
      - b
    relance: Transforme d'abord 14/10 en centièmes avant de comparer les deux numérateurs.
  - si:
      contient:
      - c
    relance: Une fois les deux fractions au même dénominateur, compare bien leurs numérateurs.
  solution: 14/10 = 140/100. Comme 140 est plus grand que 120, 14/10 est plus grand que 120/100.
- id: ranger-quatre-fractions-decimales
  type: ordre
  difficulte: 2
  enonce: Range ces quantités du plus petit au plus grand.
  reponse:
    elements:
    - id: n90
      texte: 9/10
    - id: n120
      texte: 120/100
    - id: n14
      texte: 14/10
    - id: n2
      texte: '2'
  indices:
    relance: Transforme toutes les quantités en centièmes pour pouvoir les comparer facilement.
    methode: 9/10 = 90/100 ; 14/10 = 140/100 ; 2 = 200/100 ; 120/100 reste 120/100.
    etape: Compare d'abord 9/10 aux trois autres quantités transformées en centièmes.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux quantités voisines sont inversées. Revérifie leur transformation en centièmes.
  - si:
      diagnostic: ordre_faux
    relance: Transforme chaque quantité en centièmes avant de les ranger.
  solution: 'En centièmes : 9/10 = 90/100 ; 120/100 ; 14/10 = 140/100 ; 2 = 200/100. Ordre croissant : 9/10 < 120/100 < 14/10
    < 2.'
- id: intercaler-entre-quatorze-quinze-dixiemes
  type: nombre
  difficulte: 2
  enonce: Trouve la fraction décimale en centièmes comprise entre 14/10 et 15/10 dont le numérateur se termine par 2.
  reponse:
    valeur: 142/100
    forme: libre
  indices:
    relance: Transforme 14/10 et 15/10 en centièmes pour chercher une valeur entre les deux.
    methode: 14/10 = 140/100 et 15/10 = 150/100. Cherche un numérateur strictement entre 140 et 150.
    etape: Parmi les numérateurs entre 140 et 150, un seul se termine par 2.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie que ta fraction est bien strictement entre 140/100 et 150/100, et que son numérateur finit par 2.
  solution: 142/100 convient, car 140/100 < 142/100 < 150/100 et 142 se termine par 2.
- id: expliquer-avec-du-chocolat
  type: ouverte
  difficulte: 3
  enonce: 'Prends une plaque de chocolat de 10 carreaux (ou dessine-la). Explique à quelqu''un de ta famille ce que vaut 23/10
    de plaque : combien de plaques entières, combien de carreaux en plus, et comment on l''écrit avec une virgule.'
  criteres:
  - L'élève explique qu'un carreau est un dixième de la plaque et que 10 carreaux font une plaque entière.
  - L'élève sépare 23/10 en 2 plaques entières et 3 carreaux, soit 2 + 3/10.
  - L'élève écrit 23/10 = 2,3 et explique que le 3 après la virgule compte des dixièmes.
  indices:
    relance: Combien de carreaux faut-il pour faire une plaque entière ?
    methode: Fais des paquets de 10 carreaux avec les 23 carreaux, puis regarde ce qui reste.
    etape: 20 carreaux font 2 plaques entières. Combien de carreaux reste-t-il ?
  solution: 'Un carreau vaut 1/10 de la plaque. 23/10, c''est 23 carreaux : 20 carreaux font 2 plaques entières, et il reste
    3 carreaux. Donc 23/10 = 2 + 3/10 = 2,3.'
- id: nblm-parmi-ces-fractions-laquelle-est-une-fra-1
  type: choix
  difficulte: 2
  enonce: Parmi ces fractions, laquelle est une fraction décimale ?
  reponse:
    options:
    - id: o1
      texte: 7/100
    - id: o2
      texte: 7/4
    - id: o3
      texte: 10/7
    - id: o4
      texte: 7/12
    bonnes:
    - o1
  indices:
    relance: 'Regarde bien le nombre du bas (le dénominateur) : il doit être 10, 100 ou 1 000.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est faux car le dénominateur est 4, ce n'est pas une puissance de 10.
  - si:
      contient:
      - o3
    relance: C'est faux car 10 est au numérateur (en haut) et non au dénominateur.
  - si:
      contient:
      - o4
    relance: C'est faux car le dénominateur est 12, qui n'est ni 10 ni 100.
  solution: 7/100. C'est juste car son dénominateur est 100, ce qui en fait une fraction décimale.
- id: nblm-comment-ecrit-on-la-fraction-14-10-sous-2
  type: choix
  difficulte: 2
  enonce: Comment écrit-on la fraction 14/10 sous la forme d'une fraction sur cent (en centièmes) ?
  reponse:
    options:
    - id: o1
      texte: 140/100
    - id: o2
      texte: 14/100
    - id: o3
      texte: 104/100
    - id: o4
      texte: 1400/100
    bonnes:
    - o1
  indices:
    relance: 'Pense au fait que 1 dixième vaut 10 centièmes : il faut multiplier le haut et le bas par 10.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : changer le dénominateur sans multiplier aussi le numérateur par 10.'
  - si:
      contient:
      - o3
    relance: C'est faux car ajouter un zéro à la fin de 14 donne 140, et non 104.
  - si:
      contient:
      - o4
    relance: C'est faux car 1400/100 équivaut à 14 et non à 14/10.
  solution: 140/100. C'est juste car 1 dixième vaut 10 centièmes, donc 14/10 est égal à 140/100.
- id: nblm-comment-s-ecrit-la-fraction-decimale-417-3
  type: choix
  difficulte: 2
  enonce: Comment s'écrit la fraction décimale 417/100 (qui va au-delà de l'unité) sous la forme de la somme d'un nombre entier
    et d'une fraction décimale ?
  reponse:
    options:
    - id: o1
      texte: 4 + 17/100
    - id: o2
      texte: 41 + 7/100
    - id: o3
      texte: 1 + 417/100
    - id: o4
      texte: 4 + 17/10
    bonnes:
    - o1
  indices:
    relance: Cherche combien de paquets de 100 centièmes (100/100 = 1) sont contenus dans 417.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur de rang : 41 unités correspond à 4100/100, ce qui est beaucoup trop grand.'
  - si:
      contient:
      - o3
    relance: C'est faux car 417/100 est plus grand que 1 ; la partie entière contenue dans 417/100 est 4.
  - si:
      contient:
      - o4
    relance: C'est faux car 17/10 vaut 1 + 7/10 (plus grand que 1) et n'est pas exprimé en centièmes.
  solution: 4 + 17/100. C'est juste car 400/100 est égal à 4 unités entières, auxquelles on ajoute les 17 centièmes restants.
- id: nblm-quelle-est-l-ecriture-sous-forme-de-nomb-4
  type: choix
  difficulte: 2
  enonce: Quelle est l'écriture sous forme de nombre à virgule qui correspond à la décomposition 4 + 1/10 + 7/100 ?
  reponse:
    options:
    - id: o1
      texte: 4,17
    - id: o2
      texte: 4,71
    - id: o3
      texte: 41,7
    - id: o4
      texte: 4,107
    bonnes:
    - o1
  indices:
    relance: 'Identifie d''abord les unités avant la virgule, puis dans l''ordre après la virgule : dixièmes, puis centièmes.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est faux car le chiffre des dixièmes (1) et celui des centièmes (7) ont été inversés.
  - si:
      contient:
      - o3
    relance: 'C''est une erreur de placement de la virgule : la partie entière est 4 et non 41.'
  - si:
      contient:
      - o4
    relance: C'est faux car l'ajout d'un zéro place le 7 au rang des millièmes au lieu des centièmes.
  solution: 4,17. C'est juste car 4 est la partie entière, 1 est le chiffre des dixièmes et 7 est le chiffre des centièmes.
- id: nblm-pour-ranger-des-dixiemes-et-des-centieme-5
  type: choix
  difficulte: 2
  enonce: Pour ranger des dixièmes et des centièmes, on compare 4,52 et 4,7. Quel est le nombre le plus grand ?
  reponse:
    options:
    - id: o1
      texte: 4,7
    - id: o2
      texte: 4,52
    - id: o3
      texte: Ils sont égaux
    - id: o4
      texte: On ne peut pas les comparer
    bonnes:
    - o1
  indices:
    relance: Écris les deux nombres avec le même nombre de chiffres après la virgule (ajoute un zéro à la fin si besoin),
      puis compare d'abord les chiffres des dixièmes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : croire que 4,52 est plus grand parce que 52 est plus grand que 7, sans comparer
      le rang des dixièmes.'
  - si:
      contient:
      - o4
    relance: C'est faux car on peut toujours comparer deux nombres décimaux en alignant le nombre de chiffres après la virgule.
  solution: 4,7. C'est juste car 4,7 possède 7 dixièmes (4,7 = 4,70), alors que 4,52 n'en possède que 5.
- id: nblm-quelles-sont-les-deux-egalites-correctes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX égalités correctes concernant les nombres à virgule et les fractions décimales ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: 2,6 = 2,60
    - id: o2
      texte: 1/100 = 0,01
    - id: o3
      texte: 14/10 = 0,14
    - id: o4
      texte: 3/10 = 0,03
    bonnes:
    - o1
    - o2
  indices:
    relance: Sois attentif au rang du premier chiffre après la virgule (dixièmes) et du second (centièmes).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est faux car 14/10 est égal à 1,4 (une unité et 4 dixièmes). L'écriture 0,14 correspond à 14/100.
  - si:
      contient:
      - o4
    relance: C'est faux car 3/10 s'écrit 0,3 (3 dixièmes). L'écriture 0,03 vaut 3/100 (3 centièmes).
  solution: 2,6 = 2,60 ; 1/100 = 0,01. C'est juste car ajouter un zéro à la fin de la partie décimale ne change pas la valeur
    du nombre.
- id: nblm-ecris-la-fraction-1-10-sous-la-forme-d-u-7
  type: texte_court
  difficulte: 1
  enonce: Écris la fraction 1/10 sous la forme d'un nombre à virgule.
  reponse:
    acceptees:
    - 0,1
    fautes_tolerees: 1
  indices:
    relance: Place le chiffre 1 au rang des dixièmes, juste après la virgule.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 0,1. Un dixième s'écrit 0,1 sous forme de nombre à virgule.
- id: nblm-quel-est-l-arrondi-a-l-entier-du-nombre-8
  type: texte_court
  difficulte: 1
  enonce: Quel est l'arrondi à l'entier du nombre à virgule 5,78 ?
  reponse:
    acceptees:
    - '6'
    fautes_tolerees: 1
  indices:
    relance: Regarde si le chiffre des dixièmes est supérieur ou égal à 5 pour choisir l'entier juste au-dessus.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 6. Comme le chiffre des dixièmes est 7 (supérieur ou égal à 5), le nombre entier le plus proche de 5,78 est 6.
