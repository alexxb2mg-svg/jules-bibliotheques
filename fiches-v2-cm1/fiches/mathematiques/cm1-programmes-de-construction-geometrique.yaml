format: 2
notion: cm1-programmes-de-construction-geometrique
version: 3
etat: verifiee
declencheurs:
- trace un rectangle
- trace un carré de côté
- instructions pour construire
- programme de construction
- logiciel de géométrie dynamique
- cercle de centre
- suivre les consignes de tracé
- construire la figure demandée
prerequis: []
essentiel: 'Un programme de construction est une suite d''instructions. En les suivant une par une, dans l''ordre, on trace
  une figure géométrique.


  Les instructions utilisent des mots précis. [AB] est le segment qui va du point A au point B. AB = 5 cm veut dire que ce
  segment mesure 5 cm. Le milieu d''un segment est le point placé exactement à égale distance des deux bouts.


  On peut avoir à tracer des segments, des droites perpendiculaires (qui forment un angle droit) ou parallèles, des cercles,
  et des figures connues comme le carré, le rectangle ou le triangle.


  Chaque instruction a son outil. La règle graduée sert à tracer un segment d''une longueur donnée. L''équerre sert à tracer
  un angle droit. Le compas sert à tracer un cercle : on pique la pointe sur le centre, et l''écart du compas est le rayon.


  L''ordre est important, car une instruction utilise souvent un point déjà tracé. On ne peut pas tracer un cercle de centre
  A si le point A n''existe pas encore.


  Exemple officiel : « Trace un rectangle ABCD tel que AB = 5 cm et BC = 3 cm. Trace le cercle de centre A qui passe par le
  milieu du côté [AB]. » On trace d''abord le rectangle. On place le milieu de [AB], à 2,5 cm de A. Puis on trace au compas
  le cercle de centre A qui passe par ce milieu.


  On peut aussi suivre un programme de construction avec un logiciel de géométrie dynamique, sur ordinateur ou tablette.

  '
methode:
- Lire tout le programme une première fois, et faire un petit croquis à main levée de la figure attendue.
- Repérer, pour chaque instruction, l'outil à utiliser (règle graduée, équerre, compas).
- Tracer les instructions une par une, dans l'ordre, et nommer chaque point dès qu'il est placé.
- Cocher chaque instruction faite pour ne pas en oublier.
- 'Vérifier la figure finale : mesurer les longueurs et contrôler les angles droits avec l''équerre.'
vocabulaire:
- terme: programme de construction
  definition: Suite d'instructions à suivre dans l'ordre pour tracer une figure.
- terme: segment [AB]
  definition: Le morceau de droite qui va du point A au point B.
- terme: milieu
  definition: Le point d'un segment qui est à la même distance de ses deux extrémités.
- terme: centre
  definition: Le point où l'on pique la pointe du compas pour tracer un cercle.
- terme: rayon
  definition: La distance entre le centre du cercle et n'importe quel point du cercle.
- terme: droites perpendiculaires
  definition: Deux droites qui se coupent en formant un angle droit.
erreurs_frequentes:
- Changer l'ordre des instructions.
- Se tromper d'outil (par exemple, tracer un cercle à main levée au lieu d'utiliser le compas).
- Oublier une instruction du programme.
- Oublier de nommer les points, puis se tromper de point pour la suite du programme.
- Confondre le centre du cercle et un point par lequel passe le cercle.
exemple:
  enonce: 'Programme : « Trace un rectangle ABCD tel que AB = 5 cm et BC = 3 cm. Trace le cercle de centre A qui passe par
    le milieu du côté [AB]. » Quelle est la dernière étape ?'
  solution: 'On trace d''abord [AB] de 5 cm, puis on complète le rectangle avec l''équerre (BC = 3 cm). On place le milieu
    de [AB] : 5 ÷ 2 = 2,5, il est donc à 2,5 cm de A. La dernière étape est de tracer, avec le compas, le cercle de centre
    A qui passe par ce milieu : son rayon est 2,5 cm.'
exercices:
- id: outil-premiere-etape-carre
  type: choix
  difficulte: 1
  enonce: Pour tracer un carré KLMN de 6 cm de côté, quel outil utilises-tu en premier ?
  reponse:
    options:
    - id: a
      texte: La règle graduée
    - id: b
      texte: L'équerre
    - id: c
      texte: Le compas
    bonnes:
    - a
  indices:
    relance: Il faut d'abord tracer une longueur avant de tracer des angles droits.
    methode: Cherche l'outil qui permet de mesurer et de tracer un premier côté de longueur donnée.
    etape: Un côté de 6 cm se trace avec un outil gradué.
  pieges:
  - si:
      contient:
      - b
    relance: L'équerre sert aux angles droits, utile seulement après avoir tracé le premier côté.
  - si:
      contient:
      - c
    relance: Le compas sert aux cercles, pas au tracé d'un premier côté droit.
  solution: On utilise d'abord la règle graduée pour tracer un côté de 6 cm, puis l'équerre pour les angles droits.
- id: deuxieme-etape-perpendiculaire
  type: texte_court
  difficulte: 2
  enonce: 'Un programme dit : « Trace un segment [AB] de 4 cm. Trace la droite perpendiculaire à (AB) passant par A. » Quel
    outil utilises-tu pour la deuxième instruction ?'
  reponse:
    acceptees:
    - équerre
    - l'équerre
    fautes_tolerees: 2
  indices:
    relance: La deuxième instruction parle d'une droite perpendiculaire.
    methode: Cherche l'outil qui sert à tracer ou vérifier des angles droits.
    etape: Ce n'est ni la règle graduée (mesurer) ni le compas (cercles).
  pieges:
  - si:
      valeur: règle
    relance: La règle seule ne garantit pas un angle droit précis.
  - si:
      valeur: compas
    relance: Le compas sert aux cercles, pas aux perpendiculaires.
  solution: On utilise l'équerre pour tracer, en A, la droite perpendiculaire à (AB).
- id: etapes-programme-cercle-rectangle
  type: ordre
  difficulte: 2
  enonce: 'Range ces étapes dans l''ordre où le programme les demande : « Trace un rectangle ABCD tel que AB = 5 cm et BC
    = 3 cm. Trace le cercle de centre A qui passe par le milieu du côté [AB]. »'
  reponse:
    elements:
    - id: cote-ab
      texte: Tracer le côté AB de 5 cm avec la règle graduée
    - id: perpendiculaires
      texte: Tracer, avec l'équerre, les angles droits pour compléter le rectangle ABCD
    - id: milieu
      texte: Repérer le milieu du côté [AB]
    - id: cercle
      texte: Tracer, au compas, le cercle de centre A passant par ce milieu
  indices:
    relance: Peux-tu tracer le cercle avant même d'avoir le rectangle et son côté [AB] ?
    methode: Il faut d'abord construire la figure de base (le rectangle) avant de pouvoir utiliser l'un de ses points.
    etape: La toute première étape du programme consiste à tracer le côté AB.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Le programme parle du milieu dans sa deuxième phrase, après le rectangle.
  - si:
      diagnostic: ordre_faux
    relance: Le cercle, dernière instruction du programme, ne peut se tracer qu'après avoir repéré le milieu de [AB].
  solution: On trace AB = 5 cm, on complète le rectangle avec l'équerre, on repère le milieu de [AB], puis on trace au compas
    le cercle de centre A passant par ce milieu.
- id: instructions-et-outils
  type: association
  difficulte: 2
  enonce: Relie chaque type d'instruction d'un programme de construction à l'outil qu'elle nécessite.
  reponse:
    gauche:
    - id: a
      texte: Tracer un segment de longueur donnée
    - id: b
      texte: Tracer une droite perpendiculaire à une autre
    - id: c
      texte: Tracer un cercle de centre et de rayon donnés
    droite:
    - id: x
      texte: Règle graduée
    - id: y
      texte: Équerre
    - id: z
      texte: Compas
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Chaque type d'instruction correspond à un seul outil précis, vu dans la leçon sur le vocabulaire géométrique.
    methode: Associe d'abord l'instruction sur le cercle, la plus facile à repérer.
    etape: Il reste alors à distinguer la longueur donnée (mesure) de la perpendicularité (angle droit).
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien la règle graduée et l'équerre.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque instruction et demande-toi ce qu'elle mesure ou vérifie.
  solution: Segment de longueur donnée → règle graduée ; droite perpendiculaire → équerre ; cercle de centre et rayon donnés
    → compas.
- id: rayon-cercle-milieu
  type: nombre
  difficulte: 2
  enonce: 'Programme : « Trace un segment [AB] de 8 cm. Place le milieu M de [AB]. Trace le cercle de centre A qui passe par
    M. » Quel est le rayon de ce cercle, en centimètres ?'
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Le rayon, c'est la distance entre le centre A et le point M. Où se trouve M sur le segment ?
    methode: Le milieu partage le segment en deux morceaux de même longueur. Cherche la longueur d'un de ces morceaux.
    etape: Il faut partager les 8 cm du segment en deux longueurs égales.
  pieges:
  - si:
      valeur: 8
    relance: 8 cm, c'est la longueur de tout le segment [AB]. Le cercle passe par M, le milieu, pas par B.
  - si:
      valeur: 16
    relance: Le rayon ne peut pas être plus long que le segment [AB]. Le point M est au milieu de [AB].
  solution: M est le milieu de [AB], donc AM = 8 ÷ 2 = 4 cm. Le rayon du cercle de centre A qui passe par M est 4 cm.
- id: reconnaitre-figure-programme
  type: choix
  difficulte: 3
  enonce: 'Programme : « Trace un segment [AB] de 4 cm. Trace la perpendiculaire à (AB) en A et la perpendiculaire à (AB)
    en B. Place D sur la première et C sur la seconde, du même côté, avec AD = 4 cm et BC = 4 cm. Trace [DC]. » Quelle figure
    ABCD obtiens-tu ?'
  reponse:
    options:
    - id: a
      texte: Un carré
    - id: b
      texte: Un rectangle qui n'est pas un carré
    - id: c
      texte: Un triangle
    - id: d
      texte: Un cercle
    bonnes:
    - a
  indices:
    relance: Combien de côtés a la figure ABCD ? Et ses angles, comment sont-ils ?
    methode: Fais un croquis à main levée en suivant les instructions, puis compare les longueurs des côtés.
    etape: Les perpendiculaires donnent des angles droits. Regarde maintenant les longueurs AB, AD et BC données dans le programme.
  pieges:
  - si:
      contient:
      - b
    relance: 'Compare les longueurs AB, AD et BC : sont-elles différentes ?'
  - si:
      contient:
      - c
    relance: 'La figure a quatre sommets : A, B, C et D. Un triangle n''en a que trois.'
  - si:
      contient:
      - d
    relance: 'Aucune instruction n''utilise le compas : on ne trace que des segments et des droites.'
  solution: 'Les angles en A et en B sont droits, et AB = AD = BC = 4 cm. La figure ABCD a quatre angles droits et quatre
    côtés de même longueur : c''est un carré.'
- id: expliquer-importance-ordre-programme
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi suivre les instructions dans l'ordre est important dans un programme de construction, avec un
    exemple.
  criteres:
  - L'élève explique que certaines instructions s'appuient sur des éléments tracés précédemment (points, segments).
  - L'élève donne un exemple concret, comme un cercle centré sur un point déjà construit.
  - L'élève utilise le vocabulaire géométrique (segment, milieu, centre, cercle) et cite l'outil adapté.
  indices:
    relance: Peux-tu tracer un cercle centré sur un point qui n'existe pas encore sur la figure ?
    methode: Pense à une instruction qui dépend d'un point ou d'un segment tracé à une étape antérieure.
    etape: Un cercle de centre A, par exemple, suppose que le point A soit déjà placé sur la figure.
  solution: 'Certaines instructions s''appuient sur des éléments tracés avant : par exemple, un cercle centré sur le milieu
    d''un segment suppose que ce segment et son milieu soient déjà tracés. Changer l''ordre peut rendre la construction impossible
    ou fausse.'
- id: nblm-qu-est-ce-qu-un-programme-de-constructio-1
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qu'un programme de construction en géométrie au CM1 ?
  reponse:
    options:
    - id: o1
      texte: Une suite d'instructions qui permet de tracer une figure géométrique étape par étape.
    - id: o2
      texte: Un calcul pour trouver l'aire d'un rectangle.
    - id: o3
      texte: Une liste de règles pour ranger des nombres entiers.
    - id: o4
      texte: Un dessin réalisé à main levée sans aucun outil.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui permet d'expliquer comment réaliser une figure géométrique dans l'ordre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre un programme de construction géométrique avec un calcul de grandeur.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre la géométrie plane avec la numération des entiers.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ignorer qu''un programme de construction exige l''utilisation d''outils géométriques précis.'
  solution: 'Une suite d''instructions qui permet de tracer une figure géométrique étape par étape. C''est la définition exacte
    : un programme de construction fournit les instructions pour construire une figure étape par étape.'
- id: nblm-selon-les-regles-d-un-programme-de-const-2
  type: choix
  difficulte: 2
  enonce: Selon les règles d'un programme de construction, quelle méthode permet de réussir le tracé de la figure ?
  reponse:
    options:
    - id: o1
      texte: Suivre toutes les instructions pour construire dans l'ordre donné avec les bons outils.
    - id: o2
      texte: Modifier l'ordre des étapes selon sa préférence.
    - id: o3
      texte: Tracer les cercles à main levée sans utiliser le compas.
    - id: o4
      texte: Sauter la dernière étape si elle paraît difficile.
    bonnes:
    - o1
  indices:
    relance: Pense à l'importance du respect de l'ordre et des outils appropriés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : changer l''ordre des instructions est une erreur fréquente qui déforme la figure.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : se tromper d''outil en n''utilisant pas le compas pour les cercles.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : oublier une instruction empêche d''obtenir la figure complète.'
  solution: Suivre toutes les instructions pour construire dans l'ordre donné avec les bons outils. Pour réussir une construction,
    il faut appliquer les instructions dans l'ordre et utiliser les outils adaptés (règle, équerre, compas).
- id: nblm-on-suit-les-etapes-1-trace-un-rectangle-3
  type: choix
  difficulte: 2
  enonce: 'On suit les étapes : « 1. Trace un rectangle ABCD tel que AB = 5 cm et BC = 3 cm. 2. Trace le cercle de centre
    A qui passe par le milieu du côté [AB]. » Quel est le rayon de ce cercle ?'
  reponse:
    options:
    - id: o1
      texte: 2,5 cm
    - id: o2
      texte: 5 cm
    - id: o3
      texte: 3 cm
    - id: o4
      texte: 10 cm
    bonnes:
    - o1
  indices:
    relance: La distance du centre A jusqu'au milieu d'un segment de 5 cm correspond à la moitié de 5 cm.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre la longueur totale du côté [AB] avec la distance entre le sommet A et son milieu.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : utiliser la longueur du côté [BC] au lieu du demi-côté [AB].'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : multiplier la longueur au lieu de la diviser par deux pour trouver le milieu.'
  solution: 2,5 cm. Le segment [AB] mesure 5 cm. Le milieu de [AB] est à 2,5 cm de A. Le cercle de centre A passant par ce
    milieu a donc un rayon de 2,5 cm.
- id: nblm-quel-outil-informatique-peut-on-utiliser-4
  type: choix
  difficulte: 2
  enonce: Quel outil informatique peut-on utiliser pour réaliser une figure à partir d'un programme de construction ?
  reponse:
    options:
    - id: o1
      texte: Un logiciel de géométrie dynamique.
    - id: o2
      texte: Un traitement de texte simple sans outils de dessin.
    - id: o3
      texte: Une calculatrice sans écran graphique.
    - id: o4
      texte: Un tableau de conversion numérique.
    bonnes:
    - o1
  indices:
    relance: Il s'agit d'un logiciel informatique spécialement conçu pour tracer et faire évoluer des figures géométriques.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : un logiciel de traitement de texte ne permet pas d''exécuter des constructions géométriques
      interactives.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la calculatrice est destinée aux opérations numériques et non à la géométrie.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre la géométrie plane avec les outils de grandeurs et mesures.'
  solution: Un logiciel de géométrie dynamique. Les programmes officiels prévoient la réalisation de figures géométriques
    à l'aide d'un logiciel de géométrie dynamique.
- id: nblm-dans-une-consigne-qui-demande-trace-un-c-5
  type: choix
  difficulte: 2
  enonce: Dans une consigne qui demande « trace un carré de côté 4 cm », quelle propriété essentielle permet d'effectuer la
    construction ?
  reponse:
    options:
    - id: o1
      texte: Un carré a quatre côtés de même longueur et quatre angles droits.
    - id: o2
      texte: Un carré a trois côtés égaux et un angle aigu.
    - id: o3
      texte: Un carré possède des côtés opposés non parallèles.
    - id: o4
      texte: Un carré se trace uniquement sans équerre ni règle.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi des caractéristiques des angles et des côtés d'un carré.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre les propriétés du carré avec celles d''un triangle.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : ignorer la propriété de parallélisme des côtés opposés du carré.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : penser qu''on peut tracer un carré précis sans utiliser d''instruments géométriques.'
  solution: 'Un carré a quatre côtés de même longueur et quatre angles droits. Pour construire un carré à partir de la longueur
    de son côté, on utilise la définition : 4 côtés égaux (4 cm) et 4 angles droits.'
- id: nblm-quelles-sont-deux-erreurs-frequentes-com-6
  type: choix
  difficulte: 3
  enonce: Quelles sont deux erreurs fréquentes commises par les élèves lors de l'exécution d'un programme de construction
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Changer l'ordre des instructions.
    - id: o2
      texte: Oublier une instruction du programme.
    - id: o3
      texte: Lire l'ensemble des instructions avant de commencer.
    - id: o4
      texte: Utiliser un compas pour tracer un cercle.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche deux fausses manœuvres qui entraînent une figure fausse ou incomplète.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : c''est au contraire la bonne méthode conseillée pour anticiper la figure finale.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : c''est l''utilisation correcte de l''instrument adapté.'
  solution: Changer l'ordre des instructions ; Oublier une instruction du programme. C'est une erreur fréquente car modifier
    la séquence des étapes altère la figure finale.
- id: nblm-pour-executer-l-instruction-trace-le-cer-7
  type: texte_court
  difficulte: 1
  enonce: Pour exécuter l'instruction « trace le cercle de centre O et de rayon 3 cm », quel outil géométrique faut-il utiliser
    ?
  reponse:
    acceptees:
    - compas
    fautes_tolerees: 1
  indices:
    relance: Cet outil possède deux branches et sert spécifiquement à tracer des cercles.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: compas. Le compas est l'instrument géométrique indispensable pour tracer un cercle de centre et de rayon déterminés.
- id: nblm-la-suite-d-instructions-ordonnees-permet-8
  type: texte_court
  difficulte: 1
  enonce: La suite d'instructions ordonnées permettant de tracer une figure géométrique étape par étape s'appelle un __________
    de construction.
  reponse:
    acceptees:
    - programme
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne la suite logique d'instructions à exécuter.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: programme. Un programme de construction est le terme officiel désignant cette liste d'instructions géométriques
    ordonnées.
