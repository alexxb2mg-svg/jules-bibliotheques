format: 2
notion: cm1-procedures-de-calcul-mental
version: 1
etat: verifiee
declencheurs:
- ajouter vingt-neuf
- astuce du nombre rond
- doubler deux fois
- décomposer un facteur
- calculer plus vite
prerequis:
- cm1-memoriser-des-faits-numeriques
- cm1-calculer-mentalement-avec-la-numeration
essentiel: 'Pour ajouter 8, 9, 18, 19, 28, 29, 38 ou 39 à un nombre, on peut ajouter le nombre rond juste au-dessus (10, 20,
  30 ou 40), puis retrancher la petite différence. Par exemple, pour ajouter 38, on ajoute 40 puis on retranche 2.

  Pour multiplier par 4, on peut faire le double du double du nombre. Pour multiplier par 8, on fait le double, encore le
  double, puis encore le double (2 × 2 × 2 = 8).

  Pour multiplier par 5, on peut multiplier par 10 puis prendre la moitié du résultat.

  Pour multiplier par un nombre entier de dizaines ou de centaines (comme 400), on décompose ce nombre (400 = 4 × 100), on
  multiplie d''abord par 4, puis on multiplie le résultat par 100.

  La distributivité permet de décomposer un facteur en une somme pour faciliter le calcul : 21 × 35 = (20 + 1) × 35 = (20
  × 35) + (1 × 35).'
methode:
- 'Pour ajouter 8, 9, 18… : remplacer par le nombre rond juste au-dessus, puis corriger en retranchant la différence.'
- 'Pour multiplier par 4 ou 8 : doubler deux ou trois fois de suite.'
- 'Pour multiplier par 5 : multiplier par 10, puis prendre la moitié.'
- 'Pour multiplier par un multiple de 10 ou de 100 : décomposer en produit puis multiplier étape par étape.'
- 'Pour la distributivité : décomposer un des deux facteurs en une somme, multiplier chaque partie, puis additionner les résultats.'
erreurs_frequentes:
- Oublier de corriger après avoir ajouté le nombre rond (ajouter 40 sans retrancher 2 pour +38).
- Confondre « doubler deux fois » (× 4) et « doubler trois fois » (× 8).
- Appliquer la distributivité en oubliant d'additionner les deux résultats à la fin.
exemple:
  enonce: Calcule 8 × 27 en utilisant les doubles successifs.
  solution: 27 × 2 = 54, puis 54 × 2 = 108, puis 108 × 2 = 216. Donc 8 × 27 = 216.
exercices:
- id: ajouter-dix-neuf-astuce
  type: nombre
  difficulte: 1
  enonce: Calcule 156 + 19 en utilisant l'astuce du nombre rond.
  reponse:
    valeur: 175
    forme: entier
  indices:
    relance: 19, c'est 20 moins 1.
    methode: Ajoute d'abord 20 à 156, puis retranche 1 au résultat.
    etape: 156 + 20 = 176.
  pieges:
  - si:
      valeur: 176
    relance: Tu as ajouté 20 au lieu de 19. N'oublie pas de retrancher 1.
  solution: 156 + 20 = 176, puis 176 - 1 = 175. Donc 156 + 19 = 175.
- id: multiplier-par-quatre-cents
  type: nombre
  difficulte: 2
  enonce: Calcule 9 × 400.
  reponse:
    valeur: 3600
    forme: entier
  indices:
    relance: 400 = 4 × 100.
    methode: Multiplie d'abord 9 par 4, puis multiplie le résultat par 100.
    etape: 9 × 4 = 36.
  pieges:
  - si:
      valeur: 360
    relance: 'Vérifie ta multiplication finale par 100 : as-tu bien décalé de deux rangs ?'
  solution: 9 × 400 = 9 × (4 × 100) = (9 × 4) × 100 = 36 × 100 = 3 600.
- id: distributivite-vingt-et-un-fois-trente-cinq
  type: nombre
  difficulte: 2
  enonce: Calcule 21 × 35 en utilisant la distributivité.
  reponse:
    valeur: 735
    forme: entier
  indices:
    relance: 21 = 20 + 1.
    methode: Multiplie chaque partie de la décomposition par 35, puis additionne les deux résultats.
    etape: 20 × 35 = 700.
  pieges:
  - si:
      valeur: 700
    relance: Il ne faut pas oublier d'ajouter le produit de la seconde partie de la décomposition (1 × 35).
  solution: 21 × 35 = (20 × 35) + (1 × 35) = 700 + 35 = 735.
- id: multiplier-par-huit-doubles
  type: nombre
  difficulte: 2
  enonce: Calcule 8 × 27 en utilisant les doubles successifs.
  reponse:
    valeur: 216
    forme: entier
  indices:
    relance: 8, c'est 2 × 2 × 2. Combien de fois faut-il doubler 27 ?
    methode: Double 27, puis double encore le résultat, puis double une troisième fois.
    etape: 27 × 2 = 54.
  pieges:
  - si:
      valeur: 108
    relance: Tu t'es arrêté après deux doublements (× 4). Il en faut un troisième pour × 8.
  solution: 27 × 2 = 54, puis 54 × 2 = 108, puis 108 × 2 = 216. Donc 8 × 27 = 216.
- id: choisir-bonne-astuce-multiplier-cinq
  type: choix
  difficulte: 1
  enonce: Quelle astuce permet de calculer rapidement 5 × 48 ?
  reponse:
    options:
    - id: a
      texte: multiplier par 10, puis prendre la moitié
    - id: b
      texte: doubler deux fois
    - id: c
      texte: ajouter le nombre rond puis corriger
    bonnes:
    - a
  indices:
    relance: 5, c'est la moitié de 10. Quelle opération simple sur 10 peut aider ici ?
    methode: Calcule d'abord 10 × 48, puis divise le résultat par 2.
    etape: 10 × 48 = 480.
  pieges:
  - si:
      contient:
      - b
    relance: Doubler deux fois donne × 4, pas × 5.
  - si:
      contient:
      - c
    relance: Cette astuce sert pour une addition, pas pour une multiplication par 5.
  solution: '5 × 48 = (10 × 48) ÷ 2 = 480 ÷ 2 = 240 : on multiplie par 10, puis on prend la moitié.'
