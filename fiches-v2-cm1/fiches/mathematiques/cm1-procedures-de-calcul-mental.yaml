format: 2
notion: cm1-procedures-de-calcul-mental
version: 3
etat: generee
declencheurs:
- ajouter vingt-neuf
- astuce du nombre rond
- doubler deux fois
- décomposer un facteur
- calculer plus vite
- enlever dix-neuf
- double du double
- multiplier par huit
- moitié de dix fois
prerequis:
- cm1-memoriser-des-faits-numeriques
- cm1-calculer-mentalement-avec-la-numeration
essentiel: 'Calculer mentalement, c''est calculer dans sa tête, en choisissant une astuce qui rend le calcul plus facile.
  Il faut connaître ses tables et savoir faire des doubles et des moitiés.


  Pour ajouter 8, 9, 18, 19, 28, 29, 38 ou 39 à un nombre, on peut ajouter le nombre rond juste au-dessus (10, 20, 30 ou 40),
  puis retrancher la petite différence. Par exemple, pour ajouter 38, on ajoute 40 puis on retranche 2 : 25 + 38 = 65 - 2
  = 63.


  Pour soustraire ces nombres, on fait l''inverse : on enlève le nombre rond, puis on rajoute la petite différence, car on
  a enlevé un peu trop. Par exemple, 352 - 19 : on enlève 20, puis on rajoute 1.


  Pour multiplier par 4, on peut faire le double du double du nombre. Pour multiplier par 8, on fait le double, encore le
  double, puis encore le double (2 × 2 × 2 = 8). Pour multiplier par 5, on peut multiplier par 10 puis prendre la moitié du
  résultat.


  Pour multiplier par un nombre entier de dizaines ou de centaines (comme 60 ou 400), on décompose ce nombre (400 = 4 × 100),
  on multiplie d''abord par 4, puis on multiplie le résultat par 100. Ainsi 7 × 60 = 7 × 6 × 10 = 42 × 10 = 420.


  La distributivité permet de décomposer un facteur en une somme pour faciliter le calcul : 31 × 12 = (30 + 1) × 12 = (30
  × 12) + (1 × 12). On multiplie chaque morceau, puis on additionne les résultats.

  '
methode:
- Observer le calcul et choisir l'astuce adaptée (nombre rond, doubles, × 10 puis moitié, décomposition).
- 'Pour ajouter ou soustraire 8, 9, 18… : remplacer par le nombre rond juste au-dessus, puis corriger la petite différence.'
- 'Pour multiplier par 4 ou 8 : doubler deux ou trois fois de suite ; pour multiplier par 5 : multiplier par 10, puis prendre
  la moitié.'
- 'Pour multiplier par un nombre entier de dizaines ou de centaines : décomposer en produit puis multiplier étape par étape.'
- 'Pour la distributivité : décomposer un des deux facteurs en une somme, multiplier chaque partie, puis additionner les résultats.'
- Vérifier le résultat avec un ordre de grandeur.
vocabulaire:
- terme: double
  definition: Le double d'un nombre, c'est ce nombre multiplié par 2.
- terme: moitié
  definition: La moitié d'un nombre, c'est ce nombre partagé en 2 parts égales.
- terme: produit
  definition: Le résultat d'une multiplication.
- terme: facteur
  definition: Chacun des nombres que l'on multiplie entre eux.
- terme: décomposer
  definition: Écrire un nombre autrement, par exemple 21 = 20 + 1 ou 400 = 4 × 100.
- terme: distributivité
  definition: Propriété qui permet de multiplier chaque morceau d'une somme, puis d'additionner les résultats.
erreurs_frequentes:
- Oublier de corriger après avoir ajouté le nombre rond (ajouter 40 sans retrancher 2 pour +38).
- Corriger dans le mauvais sens pour une soustraction (enlever 20 puis enlever encore 1 pour -19, au lieu de rajouter 1).
- Confondre « doubler deux fois » (× 4) et « doubler trois fois » (× 8).
- Pour × 5, prendre la moitié du nombre sans l'avoir multiplié par 10.
- Appliquer la distributivité en oubliant d'additionner les deux résultats à la fin.
exemple:
  enonce: Calcule 8 × 13 en utilisant les doubles successifs.
  solution: 8 = 2 × 2 × 2, donc on double trois fois. 13 × 2 = 26, puis 26 × 2 = 52, puis 52 × 2 = 104. Donc 8 × 13 = 104.
exercices:
- id: ajouter-dix-neuf-astuce
  type: nombre
  difficulte: 1
  enonce: Calcule 156 + 19 en utilisant l'astuce du nombre rond.
  reponse:
    valeur: 175
    forme: entier
  indices:
    relance: 19, c'est 20 moins 1.
    methode: Ajoute d'abord 20 à 156, puis retranche 1 au résultat.
    etape: 156 + 20 = 176.
  pieges:
  - si:
      valeur: 176
    relance: Tu as ajouté 20 au lieu de 19. N'oublie pas de retrancher 1.
  solution: 156 + 20 = 176, puis 176 - 1 = 175. Donc 156 + 19 = 175.
- id: multiplier-par-quatre-doubles
  type: nombre
  difficulte: 1
  enonce: Calcule 4 × 35 en faisant le double du double.
  reponse:
    valeur: 140
    forme: entier
  indices:
    relance: Multiplier par 4, c'est doubler, puis doubler encore.
    methode: Calcule d'abord le double de 35, puis le double du résultat.
    etape: Le double de 35, c'est 70.
  pieges:
  - si:
      valeur: 70
    relance: Tu n'as doublé qu'une seule fois, ce qui fait × 2. Pour × 4, il faut doubler encore.
  - si:
      valeur: 280
    relance: Tu as doublé trois fois, ce qui fait × 8. Pour × 4, on double deux fois seulement.
  solution: Le double de 35 est 70, et le double de 70 est 140. Donc 4 × 35 = 140.
- id: soustraire-vingt-neuf
  type: nombre
  difficulte: 2
  enonce: Calcule 243 - 29 en utilisant l'astuce du nombre rond.
  reponse:
    valeur: 214
    forme: entier
  indices:
    relance: 29, c'est 30 moins 1.
    methode: Enlève d'abord 30, puis corrige, car tu as enlevé 1 de trop.
    etape: 243 - 30 = 213. Faut-il maintenant ajouter ou enlever 1 ?
  pieges:
  - si:
      valeur: 212
    relance: En enlevant 30, tu as déjà enlevé 1 de trop. Il faut le rajouter, pas l'enlever encore.
  - si:
      valeur: 213
    relance: Tu as enlevé 30 au lieu de 29. N'oublie pas de corriger la petite différence.
  solution: '243 - 30 = 213. On a enlevé 1 de trop, donc on le rajoute : 213 + 1 = 214. Donc 243 - 29 = 214.'
- id: multiplier-par-quatre-cents
  type: nombre
  difficulte: 2
  enonce: Calcule 9 × 400.
  reponse:
    valeur: 3600
    forme: entier
  indices:
    relance: 400 = 4 × 100.
    methode: Multiplie d'abord 9 par 4, puis multiplie le résultat par 100.
    etape: 9 × 4 = 36.
  pieges:
  - si:
      valeur: 360
    relance: 'Vérifie ta multiplication finale par 100 : as-tu bien décalé de deux rangs ?'
  solution: 9 × 400 = 9 × (4 × 100) = (9 × 4) × 100 = 36 × 100 = 3 600.
- id: distributivite-vingt-et-un-fois-trente-cinq
  type: nombre
  difficulte: 2
  enonce: Calcule 21 × 35 en utilisant la distributivité.
  reponse:
    valeur: 735
    forme: entier
  indices:
    relance: 21 = 20 + 1.
    methode: Multiplie chaque partie de la décomposition par 35, puis additionne les deux résultats.
    etape: 20 × 35 = 700.
  pieges:
  - si:
      valeur: 700
    relance: Il ne faut pas oublier d'ajouter le produit de la seconde partie de la décomposition (1 × 35).
  solution: 21 × 35 = (20 × 35) + (1 × 35) = 700 + 35 = 735.
- id: multiplier-par-huit-doubles
  type: nombre
  difficulte: 2
  enonce: Calcule 8 × 27 en utilisant les doubles successifs.
  reponse:
    valeur: 216
    forme: entier
  indices:
    relance: 8, c'est 2 × 2 × 2. Combien de fois faut-il doubler 27 ?
    methode: Double 27, puis double encore le résultat, puis double une troisième fois.
    etape: 27 × 2 = 54.
  pieges:
  - si:
      valeur: 108
    relance: Tu t'es arrêté après deux doublements (× 4). Il en faut un troisième pour × 8.
  solution: 27 × 2 = 54, puis 54 × 2 = 108, puis 108 × 2 = 216. Donc 8 × 27 = 216.
- id: choisir-bonne-astuce-multiplier-cinq
  type: choix
  difficulte: 1
  enonce: Quelle astuce permet de calculer rapidement 5 × 48 ?
  reponse:
    options:
    - id: a
      texte: multiplier par 10, puis prendre la moitié
    - id: b
      texte: doubler deux fois
    - id: c
      texte: ajouter le nombre rond puis corriger
    bonnes:
    - a
  indices:
    relance: 5, c'est la moitié de 10. Quelle opération simple sur 10 peut aider ici ?
    methode: Calcule d'abord 10 × 48, puis divise le résultat par 2.
    etape: 10 × 48 = 480.
  pieges:
  - si:
      contient:
      - b
    relance: Doubler deux fois donne × 4, pas × 5.
  - si:
      contient:
      - c
    relance: Cette astuce sert pour une addition, pas pour une multiplication par 5.
  solution: '5 × 48 = (10 × 48) ÷ 2 = 480 ÷ 2 = 240 : on multiplie par 10, puis on prend la moitié.'
