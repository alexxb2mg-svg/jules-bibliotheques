      fois-trois-cents: table-puis-cent
  indices:
    relance: Regarde d'abord l'opération (addition ou multiplication), puis le nombre par lequel on calcule.
    methode: Une addition de 28 utilise un nombre rond ; une multiplication par 4, 5 ou un nombre de centaines a chacune son
      astuce.
