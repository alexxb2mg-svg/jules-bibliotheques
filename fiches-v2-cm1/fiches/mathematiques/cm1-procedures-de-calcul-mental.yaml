  solution: 37 + 28 → ajouter 30 puis enlever 2 (67 - 2 = 65) ; 4 × 23 → double du double (46, puis 92) ; 5 × 64 → × 10 puis
    moitié (640 ÷ 2 = 320) ; 7 × 300 → 7 × 3 = 21, puis 21 × 100 = 2 100.
- id: expliquer-distributivite-maison
  type: ouverte
  difficulte: 3
  enonce: Explique à quelqu'un de ta famille comment calculer 12 × 15 de tête en décomposant 12. Écris chaque étape.
  criteres:
  - L'élève décompose 12 en une somme simple, par exemple 10 + 2.
  - L'élève multiplie chaque morceau par 15 (10 × 15 et 2 × 15) sans en oublier.
  - L'élève additionne les deux produits et trouve le bon résultat.
  indices:
    relance: 12, c'est 10 plus combien ?
    methode: Multiplie 15 par chaque morceau de la décomposition, puis additionne les deux produits.
    etape: Commence par 10 × 15, qui est facile à calculer.
  solution: 12 = 10 + 2. Donc 12 × 15 = (10 × 15) + (2 × 15) = 150 + 30 = 180. On a multiplié chaque morceau par 15, puis
    additionné les deux résultats.
