# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-types-de-problemes-arithmetiques
version: 3
etat: generee
declencheurs:
- fois plus
- fois moins
- partager équitablement
- combien de façons
- problème en plusieurs étapes
- trouver le nombre maximum
- comparaison multiplicative
- de moins que
- combien de possibilités
prerequis:
- cm1-methode-de-resolution-de-problemes
essentiel: 'Avant de calculer, on cherche de quel type est le problème. Cela aide à choisir la bonne opération.


  Problème additif « parties-tout » : on réunit des parties pour trouver le tout, ou on cherche une partie. 13 filles et 14
  garçons font 27 élèves. Si on connaît le tout et une partie, on trouve l''autre partie par une soustraction.


  Problème de « comparaison » : on compare deux quantités avec « de plus » ou « de moins ». On cherche un écart, ou une quantité
  à partir d''un écart connu. Attention, « de moins » ne veut pas toujours dire soustraire : regarde bien qui a le plus.


  Problème multiplicatif « parties-tout » : le tout est fait de parts égales. 6 boîtes de 8 crayons, c''est 6 × 8 = 48 crayons.
  Pour trouver la valeur d''une part, on divise.


  Comparaison multiplicative : « 3 fois plus » veut dire multiplier par 3, « 3 fois moins » veut dire diviser par 3. Ne confonds
  pas « 3 fois plus » avec « 3 de plus ».


  Certains problèmes se résolvent en deux ou trois étapes. On trouve d''abord un résultat intermédiaire, puis on répond à
  la question finale. Un problème mixte mélange des étapes additives et multiplicatives.


  Dénombrement : on compte tous les cas possibles, sans en oublier et sans en compter deux fois. Un tableau, un arbre ou une
  liste aide à s''organiser.


  Optimisation : on cherche la meilleure solution (le plus grand nombre possible, par exemple) en respectant toutes les contraintes
  à la fois.

  '
methode:
- Lire l'énoncé et dire avec ses mots ce que l'on cherche.
- Repérer si le problème réunit des parties, compare deux quantités, ou demande de compter des cas.
- Chercher les mots « fois plus » / « fois moins » ou « de plus » / « de moins », sans les confondre.
- Pour un problème en plusieurs étapes, écrire d'abord la question intermédiaire et la calculer.
- Pour un dénombrement, organiser les cas dans un tableau, un arbre ou une liste.
- Vérifier que chaque contrainte est respectée, puis écrire une phrase réponse.
vocabulaire:
- terme: parties-tout
  definition: Un problème où plusieurs parties réunies forment un tout.
- terme: comparaison additive
  definition: Une comparaison avec « de plus » ou « de moins », qui parle d'un écart.
- terme: comparaison multiplicative
  definition: Une comparaison avec « fois plus » ou « fois moins », qui demande de multiplier ou de diviser.
- terme: étape intermédiaire
  definition: Un calcul à faire avant de pouvoir répondre à la question finale.
- terme: dénombrer
  definition: Compter tous les cas possibles, un par un, sans oubli ni répétition.
- terme: contrainte
  definition: Une condition que la solution doit respecter.
- terme: optimiser
  definition: Trouver la meilleure solution, par exemple le plus grand nombre possible.
erreurs_frequentes:
- Confondre "trois fois plus" (multiplication) avec "trois de plus" (addition).
- Faire une soustraction dès qu'on lit « de moins », sans regarder qui a le plus.
- Oublier une étape intermédiaire dans un problème à deux ou trois étapes.
- Compter deux fois le même cas, ou en oublier, dans un problème de dénombrement.
- Ne vérifier qu'une seule contrainte dans un problème d'optimisation.
exemple:
  enonce: Un ballon coûte trois fois plus cher qu'une corde à sauter. La corde à sauter coûte 6 €. Combien coûte le ballon
    ?
  solution: '"Trois fois plus cher" est une comparaison multiplicative : on multiplie. 6 × 3 = 18. Le ballon coûte 18 €.'
exercices:
- id: type-comparaison-cout
  type: choix
  difficulte: 1
  enonce: Un vélo coûte trois fois plus cher qu'une trottinette. Quel type de comparaison est-ce ?
  reponse:
    options:
    - id: a
      texte: Une comparaison additive (avec "de plus")
    - id: b
      texte: Une comparaison multiplicative (avec "fois plus")
    - id: c
      texte: Un problème de dénombrement
    bonnes:
    - b
  indices:
    relance: Le mot "fois" est-il présent dans l'énoncé ?
    methode: Repère si l'énoncé parle d'un écart ("de plus") ou d'un nombre de fois ("fois plus").
    etape: '"Trois fois plus cher" signifie qu''il faut multiplier par 3, ce n''est pas une addition.'
  pieges:
  - si:
      contient:
      - a
    relance: Une comparaison additive utiliserait "de plus" (un écart), pas "fois plus" (on multiplie).
  - si:
      contient:
      - c
    relance: Ici, on ne compte pas des façons ou des possibilités. Ce n'est donc pas un problème de dénombrement.
  solution: 'C''est une comparaison multiplicative : "fois plus" signifie qu''il faut multiplier.'
- id: album-images-reste
  type: nombre
  difficulte: 1
  enonce: Un album peut contenir 250 images. Hugo en a déjà collé 178. Combien d'images doit-il encore coller pour le remplir
    ?
  reponse:
    valeur: 72
    forme: entier
  indices:
    relance: Le tout, c'est l'album plein. Quelle partie connais-tu déjà ?
    methode: Quand on connaît le tout et une partie, on trouve l'autre partie par une soustraction.
    etape: Pose 250 − 178, ou cherche ce qu'il faut ajouter à 178 pour arriver à 250.
  pieges:
  - si:
      valeur: 428
    relance: Tu as additionné. Hugo ne peut pas coller plus d'images que l'album n'en contient.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta soustraction en ajoutant ton résultat à 178.
  solution: 250 − 178 = 72. Vérification, 178 + 72 = 250. Hugo doit encore coller 72 images.
- id: cartes-de-moins-que
  type: nombre
  difficulte: 2
  enonce: Inès a 47 cartes. Elle a 18 cartes de moins que Noé. Combien de cartes a Noé ?
  reponse:
    valeur: 65
    forme: entier
  indices:
    relance: Qui a le plus de cartes, Inès ou Noé ?
    methode: Si Inès a moins de cartes que Noé, alors Noé en a plus qu'Inès. Il faut donc ajouter l'écart.
    etape: Noé a 18 cartes de plus qu'Inès. Pose le calcul à partir de 47.
  pieges:
  - si:
      valeur: 29
    relance: Tu as soustrait. Mais c'est Inès qui a le moins de cartes, donc Noé en a plus que 47.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ton addition de 47 et de l'écart.
  solution: Inès a 18 cartes de moins que Noé, donc Noé a 18 cartes de plus qu'Inès. 47 + 18 = 65. Noé a 65 cartes.
- id: calcul-comparaison-multiplicative
  type: nombre
  difficulte: 2
  enonce: Un casque coûte 32 €. Une trottinette coûte quatre fois plus cher que le casque. Combien coûte la trottinette, en
    euros ?
  reponse:
    valeur: 128
    forme: entier
  indices:
    relance: '"Quatre fois plus cher" signifie qu''il faut multiplier par 4.'
    methode: Multiplie le prix du casque par 4.
    etape: 32 × 4 = ?
  pieges:
  - si:
      valeur: 36
    relance: 36 correspond à une addition (32 + 4). Ici "quatre fois plus" demande une multiplication.
  - si:
      valeur: 8
    relance: 8 correspond à une division. Ici il faut multiplier le prix du casque par 4.
  solution: 32 × 4 = 128. La trottinette coûte 128 €.
- id: denombrement-habits-ours
  type: nombre
  difficulte: 2
  enonce: Un enfant veut habiller son ours avec un tee-shirt (parmi 4 différents) et un pantalon (parmi 3 différents). De
    combien de façons différentes peut-il l'habiller ?
  reponse:
    valeur: 12
    forme: entier
  indices:
    relance: Organise les possibilités dans un tableau à double entrée ou un arbre.
    methode: Pour chaque tee-shirt, compte combien de pantalons sont possibles, puis additionne ou multiplie.
    etape: Il y a 4 tee-shirts, et pour chacun 3 pantalons possibles.
  pieges:
  - si:
      valeur: 7
    relance: 7 correspond à une addition (4 + 3). Ici il faut combiner chaque tee-shirt avec chaque pantalon, donc multiplier.
  solution: Il y a 4 × 3 = 12 façons différentes d'habiller l'ours.
- id: probleme-deux-etapes-euros
  type: nombre
  difficulte: 2
  enonce: Léo a 25,60 €. Lucie a 7,55 € de plus que Léo. Combien d'euros les deux enfants ont-ils en tout ?
  reponse:
    valeur: 58.75
    forme: libre
  indices:
    relance: Trouve d'abord combien Lucie a d'euros, puis additionne les deux sommes.
    methode: Calcule d'abord la somme de Lucie (25,60 + 7,55), puis additionne-la à celle de Léo.
    etape: 25,60 + 7,55 = ? (somme de Lucie), puis 25,60 + cette somme.
  pieges:
  - si:
      valeur: 33.15
    relance: 33,15 € est la somme de Lucie seule. La question demande le total des deux enfants.
  solution: Lucie a 25,60 + 7,55 = 33,15 €. Ensemble, ils ont 25,60 + 33,15 = 58,75 €.
- id: cahiers-cartons-mixte
  type: nombre
  difficulte: 3
  enonce: Une école commande 4 cartons de 125 cahiers chacun, puis 260 cahiers de plus. Combien de cahiers l'école reçoit-elle
    en tout ?
  reponse:
    valeur: 760
    forme: entier
  indices:
    relance: Combien de cahiers y a-t-il dans les 4 cartons ?
    methode: Première étape, un calcul multiplicatif pour les cartons. Deuxième étape, ajoute les cahiers en plus.
    etape: 4 cartons de 125 cahiers, calcule 4 × 125.
  pieges:
  - si:
      valeur: 500
    relance: C'est le nombre de cahiers des cartons seulement. N'oublie pas les 260 cahiers en plus.
  - si:
      valeur: 389
    relance: Tu as additionné tous les nombres. 4 cartons de 125 cahiers, ce n'est pas 4 + 125.
  - si:
      diagnostic: valeur_fausse
    relance: Fais le calcul en deux étapes, d'abord les cartons, puis le total.
  solution: 4 × 125 = 500 cahiers dans les cartons. 500 + 260 = 760. L'école reçoit 760 cahiers.
- id: optimisation-colliers
  type: nombre
  difficulte: 3
  enonce: Pour un collier, il faut 5 perles rouges et 3 perles bleues. On dispose de 22 perles rouges et de 10 perles bleues.
    Combien de colliers identiques peut-on fabriquer au maximum ?
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Combien de colliers permettent les perles rouges ? Combien permettent les perles bleues ?
    methode: Calcule séparément le nombre de colliers possibles avec les perles rouges, puis avec les perles bleues.
    etape: Compare les deux résultats de division, le nombre de colliers possibles étant limité par la plus petite des deux
      valeurs trouvées.
  pieges:
  - si:
      valeur: 4
    relance: 4 colliers seraient possibles avec les perles rouges seules, mais il faut aussi respecter la contrainte des perles
      bleues, plus stricte.
  solution: 'Avec les perles rouges : 22 ÷ 5 = 4 colliers possibles (reste 2). Avec les perles bleues : 10 ÷ 3 = 3 colliers
    possibles (reste 1). La contrainte la plus stricte limite à 3 colliers au maximum.'
- id: expliquer-difference-comparaisons
  type: ouverte
  difficulte: 3
  enonce: Explique la différence entre une comparaison additive ("de plus") et une comparaison multiplicative ("fois plus"),
    avec un exemple pour chacune.
  criteres:
  - L'élève explique que la comparaison additive porte sur un écart, qu'on trouve avec une addition ou une soustraction.
  - L'élève explique que la comparaison multiplicative porte sur un rapport, qu'on trouve avec une multiplication ou une division.
  - L'élève donne un exemple cohérent pour chaque type.
  indices:
    relance: Pense à deux phrases différentes, l'une avec "de plus", l'autre avec "fois plus".
    methode: Donne un exemple pour chaque type, puis explique quelle opération il faut faire dans chaque cas.
    etape: Imagine deux enfants qui ont des billes. Écris une phrase avec « de plus », puis une avec « fois plus ».
  solution: 'Une comparaison additive ("de plus" ou "de moins") porte sur un écart : par exemple "Lucie a 3 billes de plus
    que Léo" se traite avec une addition ou une soustraction. Une comparaison multiplicative ("fois plus" ou "fois moins")
    porte sur un rapport : par exemple "Lucie a 3 fois plus de billes que Léo" se traite avec une multiplication ou une division.'
- id: nblm-un-livre-coute-8-un-dictionnaire-coute-4-1
  type: choix
  difficulte: 2
  enonce: Un livre coûte 8 €. Un dictionnaire coûte 4 fois plus cher que le livre. Quel est le prix du dictionnaire ?
  reponse:
    options:
    - id: o1
      texte: 32 €
    - id: o2
      texte: 12 €
    - id: o3
      texte: 2 €
    - id: o4
      texte: 24 €
    bonnes:
    - o1
  indices:
    relance: L'expression 'fois plus' indique une comparaison multiplicative, pas une addition.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''élève a confondu ''4 fois plus'' (multiplication) avec ''4 de plus'' (addition : 8 + 4
      = 12 €).'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''élève a divisé 8 par 4 au lieu de multiplier par 4.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : l''élève a commis une erreur de calcul dans la table de 8 (8 × 3 au lieu de 8 × 4).'
  solution: '32 €. C''est exact : ''4 fois plus cher'' indique une comparaison multiplicative, il faut multiplier le prix
    par 4 (8 × 4 = 32 €).'
- id: nblm-un-camion-mesure-15-metres-de-long-une-v-2
  type: choix
  difficulte: 2
  enonce: Un camion mesure 15 mètres de long. Une voiture est 3 fois moins longue que le camion. Quelle est la longueur de
    la voiture ?
  reponse:
    options:
    - id: o1
      texte: 5 mètres
    - id: o2
      texte: 12 mètres
    - id: o3
      texte: 45 mètres
    - id: o4
      texte: 18 mètres
    bonnes:
    - o1
  indices:
    relance: La locution 'fois moins' est liée à l'opération de division.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''élève a confondu ''3 fois moins'' avec ''3 de moins'' et a fait une soustraction (15 -
      3 = 12 m).'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''élève a multiplié par 3 au lieu de diviser par 3.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : l''élève a ajouté 3 au lieu de diviser.'
  solution: '5 mètres. C''est exact : ''3 fois moins'' est une comparaison multiplicative qui se traduit par une division
    par 3 (15 ÷ 3 = 5 m).'
- id: nblm-un-maitre-veut-partager-equitablement-48-3
  type: choix
  difficulte: 2
  enonce: Un maître veut partager équitablement 48 images entre 6 élèves. Combien d'images chaque élève recevra-t-il ?
  reponse:
    options:
    - id: o1
      texte: 8 images
    - id: o2
      texte: 42 images
    - id: o3
      texte: 54 images
    - id: o4
      texte: 288 images
    bonnes:
    - o1
  indices:
    relance: Partager équitablement signifie chercher la valeur d'une part égale grâce aux tables de multiplication.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''élève a effectué une soustraction (48 - 6 = 42) au lieu d''un partage en parts égales.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''élève a effectué une addition (48 + 6 = 54) au lieu d''un partage.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : l''élève a multiplié 48 par 6 au lieu de diviser.'
  solution: '8 images. C''est exact : partager équitablement 48 en 6 parts égales revient à diviser 48 par 6 (6 × 8 = 48).'
- id: nblm-felicien-veut-habiller-son-ours-en-peluc-4
  type: choix
  difficulte: 2
  enonce: Félicien veut habiller son ours en peluche. Il a 6 teeshirts différents et 3 pantalons différents. De combien de
    façons différentes peut-il habiller son ours ?
  reponse:
    options:
    - id: o1
      texte: 18 façons
    - id: o2
      texte: 9 façons
    - id: o3
      texte: 3 façons
    - id: o4
      texte: 12 façons
    bonnes:
    - o1
  indices:
    relance: Utilise un arbre ou un tableau de dénombrement pour associer chaque haut à chaque bas.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''élève a additionné les teeshirts et les pantalons (6 + 3 = 9) au lieu de multiplier les
      possibilités.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''élève n''a compté que le nombre de pantalons disponibles.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : l''élève a fait un calcul erroné en ajoutant 6 à 6 au lieu de multiplier par 3.'
  solution: '18 façons. C''est exact : pour chacun des 3 pantalons, il y a 6 teeshirts possibles, soit 6 × 3 = 18 combinaisons.'
- id: nblm-ilyes-veut-realiser-des-bracelets-pour-u-5
  type: choix
  difficulte: 2
  enonce: Ilyes veut réaliser des bracelets. Pour un bracelet, il lui faut 6 perles vertes. S'il dispose de 47 perles vertes,
    pour trouver le nombre maximum de bracelets qu'il peut fabriquer, combien de bracelets au maximum peut-il faire ?
  reponse:
    options:
    - id: o1
      texte: 7 bracelets
    - id: o2
      texte: 8 bracelets
    - id: o3
      texte: 41 bracelets
    - id: o4
      texte: 5 bracelets
    bonnes:
    - o1
  indices:
    relance: Il faut trouver le nombre de groupes complets de 6 perles que l'on peut former dans 47.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : l''élève a arrondi à l''entier supérieur sans vérifier s''il restait assez de perles pour
      le 8e bracelet.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : l''élève a soustrait 6 de 47 (47 - 6 = 41) au lieu de diviser.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : l''élève a confondu le nombre de bracelets avec le nombre de perles restantes (5).'
  solution: '7 bracelets. C''est exact : 47 ÷ 6 donne 7 avec un reste de 5 perles, donc il peut fabriquer 7 bracelets complets
    au maximum.'
- id: nblm-un-probleme-en-plusieurs-etapes-necessit-6
  type: choix
  difficulte: 3
  enonce: Un problème en plusieurs étapes nécessite de réaliser des calculs intermédiaires. Quelles sont les deux affirmations
    vraies parmi les suivantes ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Il faut calculer d'abord ce que permettent de trouver les données connues pour obtenir un résultat intermédiaire.
    - id: o2
      texte: Oublier une étape intermédiaire est une erreur fréquente lors de la résolution de ce type de problème.
    - id: o3
      texte: Ce type de problème se résout toujours avec une seule opération directe.
    - id: o4
      texte: Dans un problème en plusieurs étapes, il est interdit de réaliser des schémas.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux caractéristiques des problèmes qui demandent de trouver un résultat intermédiaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : par définition, un problème en plusieurs étapes exige au moins deux étapes calculatoires.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la modélisation à l''aide de schémas en barres est au contraire recommandée.'
  solution: 'Il faut calculer d''abord ce que permettent de trouver les données connues pour obtenir un résultat intermédiaire
    ; Oublier une étape intermédiaire est une erreur fréquente lors de la résolution de ce type de problème. C''est vrai :
    dans un problème à plusieurs étapes, une première opération permet de trouver une donnée intermédiaire nécessaire à la
    réponse finale.'
- id: nblm-dans-un-probleme-ou-l-on-cherche-la-vale-7
  type: texte_court
  difficulte: 1
  enonce: Dans un problème où l'on cherche la valeur d'un tout formé de plusieurs parts égales, quel type de problème multiplicatif
    résout-on ? Réponds par l'expression exacte de deux mots.
  reponse:
    acceptees:
    - parties-tout
    fautes_tolerees: 1
  indices:
    relance: Ce terme désigne la relation entre les différentes parts égales et le tout qu'elles constituent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'parties-tout. C''est exact : les problèmes multiplicatifs recherchant la valeur d''un tout constitué de parts
    égales sont qualifiés de type parties-tout.'
- id: nblm-comment-appelle-t-on-les-problemes-arith-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on les problèmes arithmétiques où l'on doit compter tous les cas possibles sans oubli ni répétition
    ? Réponds en un seul mot.
  reponse:
    acceptees:
    - dénombrement
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne la recherche exhaustive de toutes les possibilités d'une situation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'dénombrement. C''est la bonne réponse : le dénombrement consiste à organiser et comptabiliser l''ensemble des
    cas possibles.'
