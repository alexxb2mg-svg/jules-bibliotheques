format: 2
notion: cm1-codage-de-deplacements
version: 3
etat: generee
declencheurs:
- programmer un trajet
- suite d'instructions
- aller de la mairie à
- robot programmable
- coder un déplacement
- deuxième rue à droite
- trajet dans le quartier
- écrire le chemin
- faire bouger le robot
prerequis: []
essentiel: 'Coder un déplacement, c''est écrire une suite d''instructions précises pour aller d''un point de départ à un point
  d''arrivée. Les instructions peuvent être écrites avec des mots (« avance de 3 cases ») ou codées avec des symboles.


  Au CM1, on utilise des codages : on les lit et on les suit. On en produit aussi : on les écrit soi-même. Les déplacements
  se font sur un quadrillage, mais aussi dans des lieux plus grands, comme le plan d''un quartier ou d''une ville.


  Les instructions de base sont : avancer (d''un nombre de cases, ou jusqu''à une rue) et tourner d''un quart de tour à gauche
  ou à droite. Tourner change la direction dans laquelle on regarde. Ensuite, « avancer » se fait dans cette nouvelle direction.


  L''ordre compte. « Avancer de 2 cases puis tourner à droite » ne mène pas au même endroit que « tourner à droite puis avancer
  de 2 cases ». Si on oublie une instruction, on n''arrive pas au bon endroit non plus.


  Exemple dans un quartier : « Sors de l''école, prends la deuxième rue à gauche, puis avance jusqu''à la boulangerie. » Chaque
  instruction doit être claire pour qu''une autre personne arrive au bon endroit sans demander d''aide.


  Si l''école a un robot, on peut le programmer : on lui donne la suite d''instructions, et il l''exécute exactement, sans
  rien deviner. S''il n''arrive pas au bon endroit, on cherche l''instruction fausse et on corrige le programme.

  '
methode:
- Repérer le point de départ, le point d'arrivée et la direction dans laquelle on regarde au départ.
- Repérer les repères utiles sur le plan ou le quadrillage (rues, bâtiments, cases).
- 'Découper le trajet en petites étapes simples : avancer, tourner.'
- Écrire les instructions une par une, dans l'ordre exact du trajet.
- Vérifier en suivant le codage pas à pas avec le doigt (ou en faisant jouer le robot), et corriger si on n'arrive pas au
  bon endroit.
vocabulaire:
- terme: codage
  definition: Suite d'instructions, écrites avec des mots ou des symboles, qui décrit un déplacement.
- terme: instruction
  definition: Un ordre simple, comme « avance de 2 cases » ou « tourne d'un quart de tour à droite ».
- terme: programme
  definition: La suite d'instructions que l'on donne à un robot pour qu'il se déplace.
- terme: quart de tour
  definition: Le mouvement qui fait tourner à gauche ou à droite pour changer de direction.
- terme: point de départ et point d'arrivée
  definition: L'endroit d'où l'on part et l'endroit où l'on veut aller.
erreurs_frequentes:
- Changer l'ordre des instructions.
- Oublier une étape du trajet.
- Confondre la gauche et la droite en suivant les instructions, surtout quand le personnage descend vers le bas du plan.
- Oublier qu'après un quart de tour, on n'avance plus dans la même direction qu'avant.
exemple:
  enonce: 'Instructions : « Depuis la mairie, avancer vers le nord, puis prendre la deuxième rue à droite. » Que doit faire
    la personne qui suit ce codage ?'
  solution: Elle part de la mairie et avance vers le nord. Elle laisse passer la première rue, puis, à la deuxième rue, elle
    tourne à droite et avance dans cette rue. Comme elle marchait vers le nord, tourner à droite la fait partir vers l'est.
exercices:
- id: instruction-manquante-quadrillage
  type: nombre
  difficulte: 1
  enonce: 'Pour aller d''une case à une autre, séparées de 2 cases vers l''est et une case vers le sud, on écrit : avancer
    de 2 cases, tourner d''un quart de tour, puis avancer de ___ case(s). Quel est ce nombre ?'
  reponse:
    valeur: 1
    forme: entier
  indices:
    relance: 'Relis l''énoncé : combien de cases faut-il parcourir vers le sud ?'
    methode: L'énoncé donne une distance pour chaque direction du trajet ; la première (2 cases) est déjà utilisée dans la
      phrase.
    etape: Il reste à retrouver l'autre distance donnée au début de l'énoncé, associée au sud.
  pieges:
  - si:
      valeur: 2
    relance: 2 correspond au déplacement vers l'est, déjà utilisé dans la phrase. Cherche l'autre nombre.
  solution: On avance de 2 cases, on tourne d'un quart de tour, puis on avance d'1 case (vers le sud).
- id: programme-robot-simple
  type: ordre
  difficulte: 1
  enonce: Un robot doit avancer de 2 cases, puis tourner d'un quart de tour à droite, puis avancer de 3 cases. Range les instructions
    de son programme dans l'ordre.
  reponse:
    elements:
    - id: e1
      texte: Avancer de 2 cases
    - id: e2
      texte: Tourner d'un quart de tour à droite
    - id: e3
      texte: Avancer de 3 cases
  indices:
    relance: 'Relis l''énoncé : dans quel ordre les trois actions sont-elles citées ?'
    methode: Le programme suit exactement l'ordre du texte de l'énoncé.
    etape: La toute première instruction citée dans l'énoncé est d'avancer de 2 cases.
  pieges:
  - si:
      diagnostic: ordre_faux
    relance: Relis l'énoncé dans l'ordre exact où les trois actions sont citées.
  solution: 1. Avancer de 2 cases. 2. Tourner d'un quart de tour à droite. 3. Avancer de 3 cases.
- id: pourquoi-ordre-important
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il important de donner les instructions d'un codage de déplacement dans le bon ordre ?
  reponse:
    options:
    - id: a
      texte: Parce qu'inverser l'ordre change le trajet et on n'arrive plus au même endroit
    - id: b
      texte: Parce que sinon le trajet prend plus de temps à lire
    - id: c
      texte: Parce que l'ordre n'a en réalité pas d'importance
    bonnes:
    - a
  indices:
    relance: 'Imagine que tu inverses « avancer » et « tourner » dans un trajet : arrives-tu au même endroit ?'
    methode: Chaque instruction dépend souvent de la position atteinte après l'instruction précédente.
    etape: Changer l'ordre des actions modifie la position et la direction à chaque étape du trajet.
  pieges:
  - si:
      contient:
      - b
    relance: Le problème n'est pas le temps de lecture, mais bien le résultat du trajet suivi.
  - si:
      contient:
      - c
    relance: 'L''ordre change bel et bien le trajet final : ce n''est pas sans importance.'
  solution: 'Parce qu''inverser l''ordre change le trajet : on n''arrive plus au même endroit.'
- id: etapes-produire-codage
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour produire le codage d'un déplacement sur un plan de quartier.
  reponse:
    elements:
    - id: reperer
      texte: Repérer le point de départ, le point d'arrivée et les repères disponibles
    - id: decouper
      texte: Découper le trajet en étapes simples (avancer, tourner...)
    - id: ecrire
      texte: Écrire les instructions dans l'ordre exact du trajet
    - id: verifier
      texte: Vérifier le résultat en suivant les instructions pas à pas sur le plan
  indices:
    relance: Peux-tu écrire des instructions avant d'avoir découpé le trajet en étapes simples ?
    methode: Il faut d'abord comprendre le trajet dans son ensemble, puis le découper, avant de l'écrire.
    etape: La toute première étape consiste à identifier le départ, l'arrivée et les repères du plan.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Doit-on écrire les instructions avant ou après avoir découpé le trajet ?
  - si:
      diagnostic: ordre_faux
    relance: La vérification finale se fait forcément après avoir écrit toutes les instructions.
  solution: On repère le départ, l'arrivée et les repères, on découpe le trajet en étapes simples, on écrit les instructions
    dans l'ordre, puis on vérifie sur le plan.
- id: association-erreurs-codage
  type: association
  difficulte: 2
  enonce: Relie chaque erreur fréquente à sa conséquence sur le trajet.
  reponse:
    gauche:
    - id: a
      texte: Changer l'ordre des instructions
    - id: b
      texte: Oublier une étape du trajet
    - id: c
      texte: Confondre la gauche et la droite
    droite:
    - id: x
      texte: On fait les bonnes actions, mais pas au bon moment
    - id: y
      texte: Il manque une action, le trajet est incomplet
    - id: z
      texte: On tourne du mauvais côté
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Pour chaque erreur, demande-toi : manque-t-il une action ? Est-elle faite trop tôt ou trop tard ? Ou du mauvais
      côté ?'
    methode: Changer l'ordre ne retire aucune action. Oublier une étape en retire une.
    etape: Confondre la gauche et la droite fait tourner du mauvais côté.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien « oublier une étape » et « confondre gauche et droite ».
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque erreur et imagine concrètement ce qui se passe sur le trajet.
  solution: Changer l'ordre → les bonnes actions sont faites au mauvais moment ; oublier une étape → il manque une action
    ; confondre gauche et droite → on tourne du mauvais côté. Dans les trois cas, on n'arrive pas au bon endroit.
- id: cases-parcourues-robot
  type: nombre
  difficulte: 2
  enonce: 'Le programme d''un robot est : avancer de 3 cases, avancer de 2 cases, tourner d''un quart de tour à gauche, avancer
    de 4 cases. Combien de cases le robot a-t-il parcourues en tout ?'
  reponse:
    valeur: 9
    forme: entier
  indices:
    relance: Quand le robot tourne, est-ce qu'il change de case ?
    methode: Additionne seulement les nombres de cases des instructions « avancer » ; tourner ne fait pas avancer.
    etape: Les deux premières instructions font déjà 5 cases. Ajoute les cases de la dernière instruction.
  pieges:
  - si:
      valeur: 10
    relance: As-tu compté le quart de tour comme une case ? Tourner change seulement la direction du robot.
  - si:
      valeur: 5
    relance: Tu t'es arrêté avant le quart de tour. Le robot avance encore après avoir tourné.
  solution: 'On additionne les cases des instructions « avancer » : 3 + 2 + 4 = 9 cases. Le quart de tour ne fait pas avancer
    le robot.'
- id: choisir-programme-juste
  type: choix
  difficulte: 3
  enonce: Un robot est sur une case et regarde vers le nord (le haut de la feuille). Il doit arriver sur la case située 2
    cases plus au nord, puis 3 cases plus à l'est. Quel programme est juste ?
  reponse:
    options:
    - id: a
      texte: Avancer de 2 cases, tourner d'un quart de tour à droite, avancer de 3 cases
    - id: b
      texte: Avancer de 2 cases, tourner d'un quart de tour à gauche, avancer de 3 cases
    - id: c
      texte: Avancer de 3 cases, tourner d'un quart de tour à droite, avancer de 2 cases
    - id: d
      texte: Tourner d'un quart de tour à droite, avancer de 2 cases, avancer de 3 cases
    bonnes:
    - a
  indices:
    relance: 'Le robot regarde vers le nord : de combien de cases doit-il avancer avant de tourner ?'
    methode: Suis chaque programme avec ton doigt sur un quadrillage, en partant vers le haut, et regarde où il s'arrête.
    etape: Quand on regarde vers le nord, l'est est du côté de la main droite. Cherche le programme qui avance d'abord vers
      le nord du bon nombre de cases.
  pieges:
  - si:
      contient:
      - b
    relance: Quand on regarde vers le nord, tourner à gauche fait partir vers l'ouest. Le robot doit aller vers l'est.
  - si:
      contient:
      - c
    relance: Ce robot avance trop vers le nord et pas assez vers l'est. Compare les nombres de cases avec l'énoncé.
  - si:
      contient:
      - d
    relance: 'Ce robot tourne tout de suite : il ne monte jamais vers le nord.'
  solution: Le robot avance de 2 cases vers le nord, tourne d'un quart de tour à droite (il regarde alors vers l'est), puis
    avance de 3 cases vers l'est. C'est le programme « avancer de 2 cases, tourner d'un quart de tour à droite, avancer de
    3 cases ».
- id: expliquer-codage-vs-langage-naturel
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi un codage de déplacement précis, comme celui donné à un robot, doit être encore plus rigoureux
    que des indications données oralement à une personne.
  criteres:
  - L'élève indique qu'un robot suit les instructions à la lettre, sans pouvoir corriger une erreur ou une ambiguïté.
  - L'élève illustre avec un exemple montrant qu'une instruction imprécise perturberait un robot alors qu'une personne pourrait
    deviner l'intention.
  - L'élève emploie le vocabulaire du codage (instruction, ordre, programme, avancer, tourner).
  indices:
    relance: Une personne peut-elle deviner ce que tu veux dire même avec une indication un peu floue ? Et un robot ?
    methode: 'Pense à ce qui se passe si une instruction est ambiguë : une personne peut interpréter, pas un robot.'
    etape: Un robot exécute exactement ce qui est écrit, sans pouvoir corriger une imprécision par lui-même.
  solution: Un robot suit les instructions exactement telles qu'elles sont écrites, sans pouvoir deviner une intention floue,
    contrairement à une personne qui peut interpréter une indication imprécise. Par exemple, si on oublie de préciser le nombre
    de cases à avancer, une personne devinera peut-être, mais le robot restera bloqué ou ira au mauvais endroit.
- id: nblm-que-signifie-coder-un-deplacement-pour-a-1
  type: choix
  difficulte: 2
  enonce: Que signifie coder un déplacement pour aller d'un point de départ à un point d'arrivée ?
  reponse:
    options:
    - id: o1
      texte: Décrire le trajet avec une suite d'instructions précises et ordonnées.
    - id: o2
      texte: Dessiner un plan sans indiquer de point de départ.
    - id: o3
      texte: Mélanger les consignes dans n'importe quel ordre.
    - id: o4
      texte: Mesurer seulement la longueur des rues sans donner de direction.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce dont on a besoin pour guider quelqu'un pas à pas jusqu'à la destination.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : sans point de départ, il est impossible de savoir d''où commence le déplacement.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : changer l''ordre des instructions empêche d''arriver au bon endroit.'
  - si:
      contient:
      - o4
    relance: 'Erreur : mesurer une distance ne fournit pas les indications de direction nécessaires.'
  solution: 'Décrire le trajet avec une suite d''instructions précises et ordonnées. C''est exact : coder un déplacement consiste
    à décrire le parcours avec des instructions précises et dans l''ordre exact.'
- id: nblm-si-l-instruction-indique-depuis-la-mairi-2
  type: choix
  difficulte: 2
  enonce: 'Si l''instruction indique : « Depuis la mairie, avancer vers le nord, puis prendre la deuxième rue à droite »,
    quelle est la bonne exécution du trajet ?'
  reponse:
    options:
    - id: o1
      texte: Partir de la mairie, aller vers le nord jusqu'à la 2e rue et tourner à droite.
    - id: o2
      texte: Partir de la mairie et tourner directement à la première rue à droite.
    - id: o3
      texte: Partir de la mairie, aller vers le nord et tourner à gauche à la deuxième rue.
    - id: o4
      texte: Partir de la deuxième rue pour aller vers la mairie.
    bonnes:
    - o1
  indices:
    relance: Fais bien attention au point de départ, au nombre d'intersections et au sens du virage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : oublier de compter les rues et tourner dès le premier croisement.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre la gauche et la droite lors du changement de direction.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : inverser le point de départ et le point d''arrivée.'
  solution: 'Partir de la mairie, aller vers le nord jusqu''à la 2e rue et tourner à droite. C''est la bonne exécution : on
    part du bon lieu (la mairie), dans la bonne direction (nord), on compte deux rues puis on tourne à droite.'
- id: nblm-pour-programmer-un-trajet-que-doit-execu-3
  type: choix
  difficulte: 2
  enonce: Pour programmer un trajet que doit exécuter un robot programmable sur un quadrillage, que faut-il lui fournir ?
  reponse:
    options:
    - id: o1
      texte: Une suite d'instructions précises et dans le bon ordre.
    - id: o2
      texte: Des consignes vagues comme « avance un petit peu ».
    - id: o3
      texte: L'ordre des étapes inversé par rapport au départ.
    - id: o4
      texte: Une seule instruction indiquant directement l'arrivée sans les étapes.
    bonnes:
    - o1
  indices:
    relance: Pense à la manière dont une machine lit et applique les commandes pas à pas.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : un robot a besoin d''ordres codés ou précis (par exemple le nombre de cases) pour fonctionner.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : modifier l''ordre des consignes amène le robot au mauvais endroit.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : oublier de découper le trajet en étapes simples.'
  solution: 'Une suite d''instructions précises et dans le bon ordre. C''est exact : le robot exécute les instructions pas
    à pas dans l''ordre où elles sont programmées.'
- id: nblm-quel-vocabulaire-spatial-precis-utilise-4
  type: choix
  difficulte: 2
  enonce: Quel vocabulaire spatial précis utilise-t-on pour indiquer un changement de direction à angle droit lors d'un déplacement
    ?
  reponse:
    options:
    - id: o1
      texte: Tourner d'un quart de tour à gauche ou à droite.
    - id: o2
      texte: Faire un saut de deux cases vers le haut.
    - id: o3
      texte: Reculer en fermant les yeux.
    - id: o4
      texte: Calculer la durée totale du trajet.
    bonnes:
    - o1
  indices:
    relance: Pense au terme qui correspond à un pivotement de 90 degrés sur un quadrillage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : sauter n''indique pas un changement d''orientation spatial à un croisement.'
  - si:
      contient:
      - o3
    relance: 'Erreur : ceci n''est pas une instruction de repérage spatial valide pour pivoter.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la durée est une grandeur de temps, pas un terme de repérage spatial.'
  solution: 'Tourner d''un quart de tour à gauche ou à droite. C''est exact : l''expression « tourner d''un quart de tour
    à gauche ou à droite » est le vocabulaire spatial officiel au CM1.'
- id: nblm-quelle-est-l-une-des-erreurs-frequentes-5
  type: choix
  difficulte: 2
  enonce: Quelle est l'une des erreurs fréquentes commises par les élèves lorsqu'ils doivent coder un déplacement ?
  reponse:
    options:
    - id: o1
      texte: Oublier une étape du trajet ou confondre la gauche et la droite.
    - id: o2
      texte: Identifier le point de départ avant de commencer.
    - id: o3
      texte: Vérifier le résultat en suivant les instructions pas à pas.
    - id: o4
      texte: Écrire les instructions dans l'ordre exact du parcours.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui risque de faire tromper de chemin la personne qui suit le code.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect : repérer le point de départ est une bonne méthode et non une erreur.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : la vérification pas à pas est la démarche recommandée pour réussir.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : respecter l''ordre exact est indispensable pour que le codage soit correct.'
  solution: 'Oublier une étape du trajet ou confondre la gauche et la droite. C''est exact : l''oubli d''une étape et la confusion
