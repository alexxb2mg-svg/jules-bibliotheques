    - id: o1
      texte: Repérer le point de départ, le point d'arrivée et les repères disponibles.
    - id: o2
      texte: Découper le trajet en étapes simples et les écrire dans l'ordre exact.
    - id: o3
      texte: Changer l'ordre des étapes pour aller plus vite.
    - id: o4
