  indices:
    relance: Sélectionne les deux bonnes règles de la méthode officielle pour préparer et rédiger le codage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : modifier l''ordre des instructions fausse complètement le parcours.'
  - si:
      contient:
      - o4
    relance: 'Erreur : le point de départ doit rester la référence initiale pour valider le trajet.'
  solution: 'Repérer le point de départ, le point d''arrivée et les repères disponibles ; Découper le trajet en étapes simples
    et les écrire dans l''ordre exact. C''est exact : situer le départ, l''arrivée et les repères est la première étape de
    la méthode.'
- id: nblm-pour-guider-un-robot-sur-un-quadrillage-7
  type: texte_court
  difficulte: 1
  enonce: Pour guider un robot sur un quadrillage, on doit écrire une suite d'_________.
  reponse:
    acceptees:
    - instructions
