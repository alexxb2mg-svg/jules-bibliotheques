# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-lire-et-produire-des-representations-de-donnees
version: 3
etat: generee
declencheurs:
- diagramme en barres
- tableau à double entrée
- lire un graphique
- combien d'élèves
- courbe des températures
- légende du graphique
- axe et graduation
- faire une enquête
- hauteur de la barre
prerequis: []
essentiel: 'Des données, ce sont des informations que l''on recueille : les réponses à une enquête dans la classe, des mesures
  (la température chaque jour, la taille des élèves). Pour les recueillir, on peut faire une petite marque à chaque réponse,
  puis compter.


  Pour présenter ces données, on peut produire un tableau, un diagramme en barres, ou placer des points dans un repère.


  Un tableau à simple entrée donne une information par ligne (par exemple : bus 12, vélo 5, à pied 7). Un tableau à double
  entrée croise deux informations : par exemple, les filles et les garçons d''un côté, les moyens de transport de l''autre.
  La valeur cherchée est dans la case où la ligne et la colonne se croisent.


  Dans un diagramme en barres, chaque barre correspond à une réponse. Plus la barre est haute, plus la quantité est grande.
  On lit sa valeur sur l''axe gradué.


  Pour suivre une mesure qui change dans le temps, comme la température heure par heure, on place des points dans un repère.
  Quand on relie ces points, on obtient une courbe. Le point le plus haut montre la valeur la plus grande.


  Avant de lire une valeur, on regarde toujours le titre, ce que représente chaque axe et la graduation. Un axe peut être
  gradué de 1 en 1, de 2 en 2, de 10 en 10...


  On résout ensuite des problèmes en une ou plusieurs étapes avec ces données. Exemple : 12 élèves viennent en bus et 7 à
  pied. 12 − 7 = 5 : il y a 5 élèves de plus en bus qu''à pied.

  '
methode:
- Lire le titre pour savoir de quoi parlent les données.
- Repérer ce que représentent les lignes et colonnes, ou les deux axes.
- Lire la graduation de l'axe (l'échelle) avant de lire une valeur.
- Prélever seulement les données utiles pour répondre à la question.
- Faire les calculs nécessaires, puis écrire une phrase-réponse.
vocabulaire:
- terme: données
  definition: Les informations recueillies, par exemple les réponses à une enquête ou des mesures.
- terme: tableau à double entrée
  definition: Tableau qui croise deux informations, par exemple filles/garçons et moyen de transport.
- terme: diagramme en barres
  definition: Graphique où chaque réponse est représentée par une barre, d'autant plus haute que la quantité est grande.
- terme: courbe
  definition: Ligne qui relie des points placés dans un repère, pour montrer comment une mesure évolue.
- terme: graduation
  definition: Les traits réguliers marqués sur un axe, avec leurs nombres, qui permettent de lire les valeurs.
erreurs_frequentes:
- Lire la mauvaise graduation ou se tromper d'échelle sur un axe.
- Confondre les lignes et les colonnes d'un tableau à double entrée.
- Répondre sans avoir vérifié le titre ou la légende du graphique.
- Additionner toutes les cases d'un tableau alors que la question ne porte que sur une partie des données.
exemple:
  enonce: Un diagramme en barres montre les moyens de transport des élèves de CM1. La barre « bus » atteint 12. Que représente
    ce nombre ?
  solution: 'On lit le titre : le diagramme parle des moyens de transport des élèves de CM1. Chaque barre correspond à un
    moyen de transport. La barre « bus » atteint 12 sur l''axe gradué : 12 élèves de CM1 viennent à l''école en bus.'
exercices:
- id: intersection-tableau-double-entree
  type: texte_court
  difficulte: 1
  enonce: Dans un tableau à double entrée, une ligne montre les filles et une colonne montre « à pied ». Où trouver combien
    de filles viennent à pied ?
  reponse:
    acceptees:
    - case
    - la case
    - dans la case
    - intersection
    - à l'intersection
    - croisement
    - au croisement
    fautes_tolerees: 2
  indices:
    relance: 'Le tableau croise deux informations : la ligne et la colonne se rejoignent quelque part.'
    methode: Un tableau à double entrée donne une valeur précise à l'endroit où une ligne et une colonne se rencontrent.
    etape: Trouve d'abord la ligne « filles », puis suis-la jusqu'à la colonne « à pied ».
  pieges:
  - si:
      valeur: ligne
    relance: La ligne seule donne toutes les données des filles, pas seulement celles à pied.
  - si:
      valeur: colonne
    relance: La colonne seule donne les données de tous les élèves à pied, pas seulement des filles.
  solution: On regarde la case qui croise la ligne « filles » et la colonne « à pied ».
- id: garcons-total-moins-filles
  type: nombre
  difficulte: 1
  enonce: Un diagramme donne 11 filles dans une classe et un total de 24 élèves. Combien y a-t-il de garçons ?
  reponse:
    valeur: 13
    forme: entier
  indices:
    relance: Le total, ce sont les filles plus les garçons.
    methode: Pour retrouver une partie quand on connaît le tout et l'autre partie, on utilise une opération vue en numération.
    etape: 24 est le total, 11 est la partie connue (les filles). Calcule la différence.
  pieges:
  - si:
      valeur: 35
    relance: 'Tu as additionné les deux nombres. Le total est déjà donné : il faut plutôt le comparer à une des parties.'
  - si:
      valeur: 11
    relance: 11, c'est le nombre de filles. La question porte sur les garçons.
  solution: 24 − 11 = 13. Il y a 13 garçons.
- id: point-le-plus-haut-courbe
  type: choix
  difficulte: 2
  enonce: Sur une courbe des précipitations mois par mois, comment savoir quel mois il a le plus plu ?
  reponse:
    options:
    - id: a
      texte: En cherchant le point de la courbe le plus haut
    - id: b
      texte: En cherchant le point de la courbe le plus à droite
    - id: c
      texte: En comptant le nombre total de points de la courbe
    bonnes:
    - a
  indices:
    relance: La hauteur d'un point sur ce type de graphique correspond à une quantité.
    methode: Sur ce genre de courbe, l'axe vertical représente la quantité de pluie, pas le temps.
    etape: Le point le plus à droite indique seulement le dernier mois de l'année, pas forcément le plus arrosé.
  pieges:
  - si:
      contient:
      - b
    relance: La position à droite indique le mois dans l'année, pas la quantité de pluie.
  - si:
      contient:
      - c
    relance: Compter les points ne renseigne pas sur les quantités représentées.
  solution: 'On cherche le point de la courbe qui est le plus haut : il correspond au mois où il a le plus plu.'
- id: lire-barre-graduee-de-deux-en-deux
  type: nombre
  difficulte: 2
  enonce: Sur un diagramme en barres, l'axe vertical est gradué de 2 en 2 (0, 2, 4, 6...). La barre « vélo » s'arrête exactement
    sur la 4e graduation au-dessus de 0. Combien d'élèves viennent à vélo ?
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Que vaut la première graduation au-dessus de 0 ? Et la deuxième ?
    methode: Chaque graduation ajoute 2 élèves. Compte de 2 en 2 en montant, graduation après graduation.
    etape: Les trois premières graduations au-dessus de 0 valent 2, 4 et 6. Continue d'une graduation.
  pieges:
  - si:
      valeur: 4
    relance: 4, c'est le numéro de la graduation, pas sa valeur. L'axe est gradué de 2 en 2.
  - si:
      valeur: 6
    relance: Tu t'es arrêté à la 3e graduation. Monte encore d'une graduation.
  solution: 'On compte de 2 en 2 : 1re graduation = 2, 2e = 4, 3e = 6, 4e = 8. 8 élèves viennent à vélo.'
- id: etapes-lecture-diagramme
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour répondre à une question à partir d'un diagramme en barres.
  reponse:
    elements:
    - id: titre
      texte: Lire le titre du diagramme pour savoir ce qu'il représente
    - id: echelle
      texte: Observer la graduation de l'axe pour connaître l'échelle utilisée
    - id: preleve
      texte: Lire, grâce à la graduation, la valeur de la barre utile
    - id: calcul
      texte: Faire les calculs nécessaires à partir de la valeur lue
  indices:
    relance: Peux-tu répondre à une question sans savoir d'abord ce que représente le diagramme ?
    methode: Il faut comprendre le graphique avant de le lire, puis le lire avant de calculer.
    etape: La toute première étape consiste à lire le titre du diagramme.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Peut-on lire la valeur d'une barre sans connaître la graduation ?
  - si:
      diagnostic: ordre_faux
    relance: Le calcul final ne peut se faire qu'après avoir lu une valeur précise sur le diagramme.
  solution: On lit d'abord le titre, puis la graduation de l'axe, puis la valeur de la barre utile, et enfin on fait les calculs.
- id: types-representations
  type: association
  difficulte: 2
  enonce: Relie chaque type de représentation à sa description.
  reponse:
    gauche:
    - id: a
      texte: Tableau à double entrée
    - id: b
      texte: Diagramme en barres
    - id: c
      texte: Courbe
    droite:
    - id: x
      texte: Croise deux informations dans des cases
    - id: y
      texte: Compare des quantités avec des rectangles de hauteurs différentes
    - id: z
      texte: Relie des points pour montrer une évolution
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Pense à la forme de chaque représentation : des cases, des rectangles, ou des points reliés.'
    methode: Distingue le diagramme en barres, avec ses rectangles, de la courbe, avec ses points reliés.
    etape: Une courbe sert surtout à montrer une évolution dans le temps, contrairement au diagramme en barres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien le diagramme en barres et la courbe.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque type de représentation et pense à sa forme visuelle.
  solution: Tableau à double entrée → croise deux informations dans des cases ; diagramme en barres → compare des quantités
    avec des rectangles ; courbe → relie des points pour montrer une évolution.
- id: probleme-tableau-bus
  type: nombre
  difficulte: 3
  enonce: 'Voici un tableau à double entrée sur les élèves de CM1. Filles : 6 à pied, 5 en bus. Garçons : 4 à pied, 9 en bus.
    Combien d''élèves de CM1 viennent en bus, filles et garçons ensemble ?'
  reponse:
    valeur: 14
    forme: entier
  indices:
    relance: Quelle colonne du tableau parle du bus ?
    methode: Prélève seulement les cases de la colonne « bus » (une pour les filles, une pour les garçons), puis additionne-les.
    etape: Dans la colonne « bus », les filles sont 5. Trouve les garçons dans la même colonne.
  pieges:
  - si:
      valeur: 9
    relance: 9, ce sont seulement les garçons. La question demande les filles et les garçons ensemble.
  - si:
      valeur: 24
    relance: Tu as additionné toutes les cases, même celles des élèves à pied. Garde seulement la colonne « bus ».
  solution: 'Colonne « bus » : 5 filles et 9 garçons. 5 + 9 = 14. 14 élèves de CM1 viennent en bus.'
- id: expliquer-lecture-echelle
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi il est indispensable de regarder la graduation d'un axe avant de lire une valeur sur un diagramme.
  criteres:
  - L'élève indique que sans connaître l'échelle, on ne peut pas savoir ce que représente chaque graduation.
  - L'élève donne un exemple montrant qu'une même hauteur peut représenter des valeurs différentes selon l'échelle.
  - L'élève utilise le vocabulaire du chapitre (axe, graduation, barre ou courbe).
  indices:
    relance: Deux diagrammes peuvent avoir la même hauteur de barre mais représenter des nombres différents.
    methode: Pense à ce qui se passerait si un axe était gradué de 2 en 2 au lieu de 1 en 1.
    etape: Sans regarder l'échelle, une même position sur l'axe pourrait correspondre à des valeurs très différentes.
  solution: 'Sans connaître l''échelle, on ne sait pas combien vaut chaque graduation : une même hauteur de barre peut représenter
    5 ou 10 selon que l''axe est gradué de 1 en 1 ou de 2 en 2. Il faut donc toujours vérifier l''échelle avant de lire une
    valeur.'
- id: nblm-dans-un-tableau-a-double-entree-que-perm-1
  type: choix
  difficulte: 2
  enonce: Dans un tableau à double entrée, que permet de faire le croisement d'une ligne et d'une colonne ?
  reponse:
    options:
    - id: o1
      texte: À trouver une donnée qui croise deux informations (par exemple filles/garçons et moyen de transport).
    - id: o2
      texte: À calculer automatiquement la somme de tous les nombres du tableau.
    - id: o3
      texte: À tracer la courbe des températures de la semaine.
    - id: o4
      texte: À mesurer la hauteur d'une barre verticale.
    bonnes:
    - o1
  indices:
    relance: Pense à la manière dont s'organisent les en-têtes des lignes et des colonnes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le croisement indique une valeur précise, il ne réalise pas de calcul automatique d'ensemble.
  - si:
      contient:
      - o3
    relance: La courbe des températures est une représentation graphique dans un repère, pas une case de tableau.
  - si:
      contient:
      - o4
    relance: La hauteur d'une barre concerne un diagramme en barres, pas un tableau.
  solution: À trouver une donnée qui croise deux informations (par exemple filles/garçons et moyen de transport). Un tableau
    à double entrée sert précisément à croiser deux types d'informations pour lire une donnée précise.
- id: nblm-un-diagramme-en-barres-indique-le-moyen-2
  type: choix
  difficulte: 2
  enonce: Un diagramme en barres indique le moyen de transport des élèves de CM1. La barre « bus » monte jusqu'à 12. Pour
    savoir combien d'élèves viennent en bus, que représente ce nombre 12 ?
  reponse:
    options:
    - id: o1
      texte: Il indique qu'il y a 12 élèves de CM1 qui viennent en bus.
    - id: o2
      texte: Il indique que le trajet en bus dure 12 minutes.
    - id: o3
      texte: Il indique qu'il y a 12 bus devant l'école.
    - id: o4
      texte: Il indique le numéro de la ligne de bus.
    bonnes:
    - o1
  indices:
    relance: Regarde la quantité mesurée sur l'axe gradué du graphique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la barre indique le nombre d''élèves (l''effectif), pas la durée du trajet.'
  - si:
      contient:
      - o3
    relance: Le graphique compte le nombre d'élèves par moyen de transport, pas le nombre de véhicules.
  - si:
      contient:
      - o4
    relance: L'axe gradué mesure une quantité d'élèves, pas un numéro d'identifiant.
  solution: Il indique qu'il y a 12 élèves de CM1 qui viennent en bus. Dans un diagramme en barres, la hauteur de la barre
    sur l'axe gradué donne le nombre d'élèves correspondant.
- id: nblm-pour-observer-l-evolution-d-une-grandeur-3
  type: choix
  difficulte: 2
  enonce: Pour observer l'évolution d'une grandeur qui varie au fil du temps, comme une courbe des températures, quelle représentation
    graphique est la plus adaptée ?
  reponse:
    options:
    - id: o1
      texte: Un ensemble de points reliés par une courbe dans un repère.
    - id: o2
      texte: Un patron de solide géométrique.
    - id: o3
      texte: Un programme de calcul en trois étapes.
    - id: o4
      texte: Une demi-droite graduée avec des fractions.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi quel graphique montre les montées et descentes de valeurs au fil des jours.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un patron sert à fabriquer un solide en volume, pas à présenter l'évolution de mesures.
  - si:
      contient:
      - o3
    relance: Un programme de calcul est une suite d'instructions mathématiques, pas un graphique.
  - si:
      contient:
      - o4
    relance: La demi-droite sert à placer des nombres, alors qu'une courbe montre des variations temporelles.
  solution: Un ensemble de points reliés par une courbe dans un repère. Une courbe relie des points relevés au cours du temps
    pour visualiser clairement l'évolution d'une grandeur.
- id: nblm-lorsqu-un-repere-comporte-plusieurs-seri-4
  type: choix
  difficulte: 2
  enonce: Lorsqu'un repère comporte plusieurs séries de données, à quoi sert la légende du graphique ?
  reponse:
    options:
    - id: o1
      texte: À savoir à quoi correspond chaque couleur ou chaque symbole représenté.
    - id: o2
      texte: À donner la réponse finale du problème d'arithmétique.
    - id: o3
      texte: À calculer le périmètre de la feuille de papier.
    - id: o4
      texte: À indiquer l'heure du cours de mathématiques.
    bonnes:
    - o1
  indices:
    relance: Pense au petit encadré qui indique ce que désignent les différentes couleurs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La légende apporte une aide à la lecture des clés du graphique, mais elle ne fait pas le problème à ta place.
  - si:
      contient:
      - o3
    relance: La légende est un élément d'information du graphique, ce n'est pas un calcul de longueur.
  - si:
      contient:
      - o4
    relance: La légende explique le contenu visualisé, pas l'emploi du temps de la classe.
  solution: À savoir à quoi correspond chaque couleur ou chaque symbole représenté. La légende explique la signification des
    couleurs, formes ou tracés utilisés dans le graphique.
- id: nblm-pour-bien-lire-un-graphique-et-eviter-de-5
  type: choix
  difficulte: 2
  enonce: Pour bien lire un graphique et éviter de se tromper dans les réponses, quelle est l'étape essentielle de la méthode
    ?
  reponse:
    options:
    - id: o1
      texte: Repérer le titre et lire l'échelle des axes avant de prélever une valeur.
    - id: o2
      texte: Additionner systématiquement toutes les valeurs inscrites au hasard.
    - id: o3
      texte: Changer la couleur des barres ou des points du graphique.
    - id: o4
      texte: Effacer la légende du graphique.
    bonnes:
    - o1
  indices:
    relance: Pense aux indications graduées situées sur le côté et en bas du graphique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Additionner au hasard sans lire l'échelle conduit à des résultats faux.
  - si:
      contient:
      - o3
    relance: Changer l'apparence visuelle ne donne pas la valeur exacte inscrite sur les axes.
  - si:
      contient:
      - o4
    relance: Effacer la légende empêche de comprendre à quoi correspondent les données.
  solution: Repérer le titre et lire l'échelle des axes avant de prélever une valeur. Comprendre le titre et la graduation
    (l'échelle) des axes est indispensable pour prélever la bonne information.
- id: nblm-quelles-sont-les-deux-erreurs-frequentes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux erreurs fréquentes commises lors de la lecture d'un tableau ou d'un graphique ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Lire la mauvaise graduation ou se tromper d'échelle sur un axe.
    - id: o2
      texte: Confondre les lignes et les colonnes d'un tableau à double entrée.
    - id: o3
      texte: Raconter l'histoire du problème avec ses propres mots.
    - id: o4
      texte: Utiliser un crayon de papier pour repérer une valeur sur un axe.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche deux fautes d'attention courantes identifiées dans les fiches de cours.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Reformuler l'histoire du problème est une excellente habitude pour bien comprendre l'énoncé.
  - si:
      contient:
      - o4
    relance: Suivre l'axe avec son crayon est un bon moyen de ne pas se décaler de ligne.
  solution: Lire la mauvaise graduation ou se tromper d'échelle sur un axe ; Confondre les lignes et les colonnes d'un tableau
    à double entrée. Se tromper d'échelle ou de graduation est une erreur classique qui donne une valeur inexacte.
- id: nblm-un-tableau-qui-croise-deux-informations-7
  type: texte_court
  difficulte: 1
  enonce: Un tableau qui croise deux informations (comme le sexe des élèves et leur moyen de transport) est un tableau à double
    ____.
  reponse:
    acceptees:
    - entrée
    fautes_tolerees: 1
  indices:
    relance: C'est le mot utilisé pour qualifier un tableau à deux axes de lecture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: entrée. Ce type de tableau croisé s'appelle un tableau à double entrée.
- id: nblm-la-representation-graphique-qui-utilise-8
  type: texte_court
  difficulte: 1
  enonce: La représentation graphique qui utilise des rectangles verticaux pour comparer des données s'appelle un diagramme
    en ____.
  reponse:
    acceptees:
    - barres
    fautes_tolerees: 1
  indices:
    relance: Ce mot évoque la forme allongée des rectangulaires dessinés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
