    relance: Une petite cuillère contient-elle beaucoup ou très peu de liquide ?
    methode: Pour un tout petit récipient, on choisit une toute petite unité.
    etape: Range les trois unités de la plus petite à la plus grande, puis choisis celle qui convient à un tout petit récipient.
  pieges:
  - si:
      contient:
      - b
    relance: Un litre, c'est une grande bouteille. Une petite cuillère en contient beaucoup moins.
  - si:
      contient:
      - c
    relance: 'Un hectolitre vaut 100 litres : c''est une unité pour de très grands récipients.'
  solution: 'Une petite cuillère contient très peu de liquide : on utilise la plus petite unité, le millilitre (mL).'
- id: ranger-contenances
  type: ordre
  difficulte: 2
  enonce: 'Range ces contenances dans l''ordre croissant : 3 L, 25 cL, 400 mL, 1 dL.'
  reponse:
    elements:
    - id: d
      texte: 1 dL
    - id: b
      texte: 25 cL
    - id: c
      texte: 400 mL
    - id: a
      texte: 3 L
  indices:
    relance: Mets toutes les contenances en centilitres pour pouvoir les comparer.
    methode: 1 L = 100 cL, 1 dL = 10 cL, 10 mL = 1 cL ; convertis chaque contenance dans cette unité commune.
    etape: Convertis chacune des quatre contenances en centilitres, puis compare les quatre nombres obtenus.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux contenances voisines sont inversées. As-tu bien converti 400 mL en centilitres ?
  - si:
      diagnostic: ordre_faux
    relance: Convertis d'abord toutes les contenances en centilitres, puis compare les nombres obtenus.
  solution: 'En cL : 3 L = 300 cL, 25 cL, 400 mL = 40 cL, 1 dL = 10 cL. Ordre croissant : 1 dL, 25 cL, 400 mL, 3 L.'
