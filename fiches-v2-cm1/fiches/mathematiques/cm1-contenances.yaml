prerequis:
- cm1-longueurs
essentiel: 'La contenance, c''est la quantité de liquide qu''un récipient peut contenir : un verre, une bouteille, un arrosoir,
  une baignoire.


  L''unité de référence est le litre, de symbole L. Les autres unités, de la plus grande à la plus petite, sont : l''hectolitre
  (hL), le décalitre (daL), le litre (L), le décilitre (dL), le centilitre (cL) et le millilitre (mL). Chaque unité est 10
  fois plus petite que la précédente.


  Les relations à connaître : 1 hL = 100 L et 1 daL = 10 L. 1 L = 10 dL = 100 cL = 1000 mL. On s''en sert pour changer d''unité,
  sans tableau de conversion. Par exemple, 3 L = 300 cL, car 1 L = 100 cL.


  On choisit une unité adaptée à ce que l''on mesure. Pour une petite cuillère de sirop, on parle en millilitres. Pour un
  verre, on parle souvent en centilitres (un verre de 20 cL). Pour une bouteille d''eau, en litres (1,5 L). Pour un très grand
  récipient, comme une cuve, on peut parler en hectolitres.


  Pour comparer deux contenances, on les écrit d''abord dans la même unité. Laquelle est la plus grande : 2 L ou 150 cL ?
  2 L = 200 cL, et 200 cL est plus grand que 150 cL : c''est donc 2 L.


  Attention : on n''additionne jamais des nombres écrits dans des unités différentes. 1 L + 25 cL, c''est 100 cL + 25 cL =
  125 cL.


  Un verre gradué sert à mesurer ou à préparer une quantité précise de liquide.

  '
methode:
- Repérer l'unité de chaque contenance (hL, daL, L, dL, cL, mL).
- Choisir une unité commune, souvent la plus petite des unités présentes.
- Convertir avec une relation connue (1 L = 100 cL, 1 hL = 100 L...), sans tableau.
- Comparer ou calculer une fois que tout est dans la même unité.
- Vérifier que le résultat est raisonnable (une baignoire ne contient pas 2 mL).
vocabulaire:
- terme: contenance
  definition: Ce qu'un récipient peut contenir, mesuré en litres et ses unités.
- terme: litre (L)
  definition: Unité de référence pour mesurer une contenance.
- terme: millilitre (mL)
  definition: 'Unité très petite : il en faut 1000 pour faire 1 litre.'
- terme: centilitre (cL)
  definition: 'Unité souvent utilisée pour les verres et les canettes : 100 cL font 1 litre.'
- terme: hectolitre (hL)
  definition: 'Grande unité de contenance : 1 hL vaut 100 litres.'
- terme: verre gradué
  definition: Récipient avec des graduations qui permet de mesurer une quantité de liquide.
erreurs_frequentes:
- 'Chercher un tableau de conversion : au CM1, on utilise les relations entre unités, pas de tableau.'
- Additionner deux contenances sans les mettre dans la même unité (1 L + 25 cL n'est pas 26).
- Confondre la contenance (ce que contient le récipient) avec sa taille ou son poids.
- 'Se tromper de relation : croire que 1 L = 10 cL alors que 1 L = 100 cL.'
exemple:
  enonce: Un verre contient 20 cL et une bouteille contient 1,5 L. Combien de verres peut-on remplir avec la bouteille ?
  solution: 'On met tout dans la même unité : 1 L = 100 cL, donc 1,5 L = 150 cL. On cherche combien de fois 20 cL entrent
    dans 150 cL : 7 × 20 = 140 et 8 × 20 = 160. On peut donc remplir 7 verres pleins, et il reste 150 − 140 = 10 cL dans la
    bouteille.'
exercices:
- id: conversion-l-vers-cl
  type: nombre
  difficulte: 1
  enonce: Convertis 2,5 L en centilitres. Donne le résultat en centilitres.
  reponse:
    valeur: 250
    forme: entier
  indices:
    relance: 1 L vaut 100 cL. Utilise cette relation.
    methode: Multiplie le nombre de litres par 100 pour obtenir des centilitres.
    etape: 2,5 L, c'est 2 L et un demi-litre. Convertis chaque morceau en centilitres, puis ajoute.
  pieges:
  - si:
      valeur: 25
    relance: Vérifie ta multiplication, 1 litre vaut 100 centilitres, pas 10.
  solution: 1 L = 100 cL, donc 2 L = 200 cL et un demi-litre = 50 cL. 2,5 L = 200 cL + 50 cL = 250 cL.
- id: unite-adaptee-cuillere
  type: choix
  difficulte: 1
  enonce: Quelle unité est la mieux adaptée pour exprimer la contenance d'une petite cuillère ?
  reponse:
    options:
    - id: a
      texte: Le millilitre (mL)
    - id: b
      texte: Le litre (L)
    - id: c
      texte: L'hectolitre (hL)
    bonnes:
    - a
