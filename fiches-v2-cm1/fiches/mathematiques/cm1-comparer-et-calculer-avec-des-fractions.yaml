format: 2
notion: cm1-comparer-et-calculer-avec-des-fractions
version: 3
etat: verifiee
declencheurs:
- comparer des parts
- même dénominateur
- fraction d'une boîte
- une part sur plusieurs
- combien vaut un tiers
- ajouter deux fractions
- fraction la plus grande
- enlever des parts
prerequis:
- cm1-sens-et-ecriture-des-fractions
essentiel: 'Une fraction, ce sont des parts égales d''une unité. Le dénominateur, en bas, dit en combien de parts égales on
  coupe l''unité. Le numérateur, en haut, dit combien de parts on prend.


  Pour comparer deux fractions qui ont le même dénominateur, on compare les numérateurs. 5/8 d''une pizza, c''est plus que
  3/8, car on prend plus de parts de la même taille. On écrit 3/8 < 5/8.


  Pour comparer deux fractions qui ont le même numérateur, on regarde la taille des parts. Plus le dénominateur est grand,
  plus les parts sont petites. Des dixièmes sont plus petits que des sixièmes, donc 3/10 < 3/6.


  Quand un dénominateur est un multiple de l''autre (par exemple 4 et 12), on transforme la fraction qui a le petit dénominateur.
  On multiplie son numérateur et son dénominateur par le même nombre, avec les tables : 3/4 = 9/12, car 4 × 3 = 12 et 3 ×
  3 = 9. Les deux fractions ont alors le même dénominateur.


  Pour additionner ou soustraire deux fractions de même dénominateur, on additionne ou on soustrait les numérateurs, et on
  garde le dénominateur. 2/5 + 1/5 = 3/5 : 2 parts plus 1 part font 3 parts de la même taille. On n''ajoute jamais les dénominateurs.


  Calculer une fraction unitaire d''une quantité, c''est partager cette quantité en parts égales et prendre une part. Un tiers
  de 15 billes, c''est 15 ÷ 3 = 5 billes. Un quart de 20 mètres, c''est 20 ÷ 4 = 5 mètres. Le dénominateur dit par combien
  on partage.

  '
methode:
- 'Regarder les dénominateurs : sont-ils égaux, ou l''un est-il un multiple de l''autre ?'
- Si besoin, transformer la fraction au petit dénominateur en multipliant son numérateur et son dénominateur par le même nombre.
- 'Pour comparer : comparer les numérateurs (même dénominateur) ou la taille des parts (même numérateur).'
- 'Pour additionner ou soustraire : calculer avec les numérateurs seulement, et garder le dénominateur.'
- 'Pour une fraction unitaire d''une quantité : diviser la quantité par le dénominateur.'
- Vérifier avec un dessin (bande, pizza) ou avec une multiplication.
vocabulaire:
- terme: numérateur
  definition: Le nombre du haut, qui dit combien de parts on prend.
- terme: dénominateur
  definition: Le nombre du bas, qui dit en combien de parts égales on partage l'unité.
- terme: fraction unitaire
  definition: Une fraction dont le numérateur est 1, comme un demi (1/2), un tiers (1/3) ou un quart (1/4).
- terme: même dénominateur
  definition: Deux fractions ont le même dénominateur quand leurs parts ont la même taille, comme 2/7 et 5/7.
- terme: multiple
  definition: 12 est un multiple de 4 parce que 12 est dans la table de 4 (4 × 3 = 12).
- terme: signes < et >
  definition: Ils servent à comparer, la pointe est toujours tournée vers le plus petit nombre.
erreurs_frequentes:
- Additionner numérateurs et dénominateurs entre eux (5/8 + 1/8 = 6/16 est faux).
- Comparer seulement les numérateurs sans vérifier que les dénominateurs sont bien identiques.
- Croire que 3/10 est plus grand que 3/6 parce que 10 est plus grand que 6.
- Oublier de transformer une des deux fractions avant d'additionner ou de soustraire.
- Pour une fraction d'une quantité, multiplier au lieu de partager.
exemple:
  enonce: Calcule 3/2 + 7/4 en donnant le résultat sous forme d'une seule fraction.
  solution: '4 est un multiple de 2 (2 × 2 = 4), donc on transforme 3/2 en quarts : 3/2 = 6/4, car 3 × 2 = 6 et 2 × 2 = 4.
    Ensuite 6/4 + 7/4 = 13/4 : on ajoute les numérateurs (6 + 7 = 13) et on garde le dénominateur 4.'
exercices:
- id: comparer-cinq-douziemes-huitiemes
  type: choix
  difficulte: 1
  enonce: Compare 5/12 et 5/8. Laquelle est la plus grande ?
  reponse:
    options:
    - id: a
      texte: 5/12 est plus grande
    - id: b
      texte: 5/8 est plus grande
    - id: c
      texte: elles sont égales
    bonnes:
    - b
  indices:
    relance: Les deux fractions ont le même numérateur. Compare seulement leurs dénominateurs.
    methode: Pour un même numérateur, plus le dénominateur est petit, plus chaque part est grande.
    etape: 8 est plus petit que 12.
  pieges:
  - si:
      contient:
      - a
    relance: Des douzièmes sont des parts plus petites que des huitièmes, car on partage en plus de morceaux.
  - si:
      contient:
      - c
    relance: Les numérateurs sont identiques, mais les dénominateurs sont différents. Les fractions ne sont donc pas égales.
  solution: '5/8 est plus grand que 5/12 : pour un même numérateur, plus le dénominateur est petit, plus chaque part est grande.'
- id: additionner-deux-septiemes-trois-septiemes
  type: nombre
  difficulte: 1
  enonce: Calcule 2/7 + 3/7. Donne le résultat sous la forme a/b.
  reponse:
    valeur: 5/7
    forme: fraction_irreductible
  indices:
    relance: Les deux fractions ont-elles le même dénominateur ?
    methode: Additionne seulement les numérateurs et garde le dénominateur.
    etape: Des septièmes plus des septièmes, ce sont encore des septièmes. Compte combien de septièmes tu as en tout.
  pieges:
  - si:
      valeur: 5/14
    relance: Tu as additionné les dénominateurs. Des septièmes plus des septièmes restent des septièmes.
  - si:
      diagnostic: pas_une_fraction
    relance: Écris ta réponse sous la forme a/b, avec deux nombres entiers.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ton addition des numérateurs.
  solution: 2/7 + 3/7 = (2 + 3)/7 = 5/7. On garde le dénominateur 7.
- id: soustraire-cinq-sixiemes-un-douzieme
  type: nombre
  difficulte: 2
  enonce: Calcule 5/6 - 1/12. Donne le résultat sous la forme a/b.
  reponse:
    valeur: 3/4
    forme: fraction_irreductible
  indices:
    relance: '12 est un multiple de 6 : transforme 5/6 en douzièmes avant de soustraire.'
    methode: Multiplie le numérateur et le dénominateur de 5/6 par le même nombre pour obtenir des douzièmes.
    etape: 5/6 = 10/12, car 6 × 2 = 12 et 5 × 2 = 10.
  pieges:
  - si:
      diagnostic: non_irreductible
    relance: Ta fraction est juste mais peut encore se simplifier.
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta transformation de 5/6 en douzièmes avant de soustraire les numérateurs.
  solution: 5/6 = 10/12, donc 5/6 - 1/12 = 10/12 - 1/12 = 9/12 = 3/4.
- id: ranger-demi-trois-quarts-cinq-huitiemes
  type: ordre
  difficulte: 2
  enonce: Range ces trois fractions de la plus petite à la plus grande.
  reponse:
    elements:
    - id: un-demi
      texte: 1/2
    - id: cinq-huitiemes
      texte: 5/8
    - id: trois-quarts
      texte: 3/4
  indices:
    relance: Peux-tu écrire ces trois fractions avec le même dénominateur ?
    methode: 8 est un multiple de 2 et de 4. Transforme chaque fraction en huitièmes, puis compare les numérateurs.
    etape: 1/2 = 4/8, car 2 × 4 = 8 et 1 × 4 = 4. Fais de même avec 3/4.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux fractions voisines sont inversées. Écris-les en huitièmes pour les comparer.
  - si:
      diagnostic: ordre_faux
    relance: Écris chaque fraction en huitièmes, puis range les numérateurs du plus petit au plus grand.
  solution: 1/2 = 4/8 et 3/4 = 6/8. Comme 4 < 5 < 6, on obtient 1/2 < 5/8 < 3/4.
- id: quart-de-soixante-kilos
  type: nombre
  difficulte: 1
  enonce: Une boulangère a 60 kg de farine. Elle en utilise un quart pour le pain. Quelle masse de farine utilise-t-elle pour
    le pain ?
  reponse:
    valeur: 15
    forme: entier
  indices:
    relance: Un quart, c'est partager en 4 parts égales.
    methode: Divise la quantité totale par le dénominateur de la fraction (4).
    etape: 60 divisé par 4.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta division de 60 par 4.
  solution: '60 kg partagés en 4 parts égales font 15 kg par part : elle utilise 15 kg de farine.'
- id: tiers-de-douze-oeufs
  type: nombre
  difficulte: 1
  enonce: Une boîte contient 12 œufs. Combien d'œufs représente un tiers de cette boîte ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Un tiers, c'est partager en 3 parts égales.
    methode: Divise 12 par 3, le dénominateur de la fraction.
    etape: 12 divisé par 3.
  pieges:
  - si:
      diagnostic: valeur_fausse
    relance: Vérifie ta division de 12 par 3.
  solution: 12 œufs partagés en 3 parts égales font 4 œufs par part.
- id: relier-fraction-quantite
  type: association
  difficulte: 2
  enonce: Relie chaque fraction d'une quantité à sa valeur.
  reponse:
    gauche:
    - id: a
      texte: un tiers de 12 billes
    - id: b
      texte: un quart de 100 mètres
    - id: c
      texte: un cinquième de 15 gommes
    droite:
    - id: x
      texte: 25 mètres
    - id: y
      texte: 4 billes
    - id: z
      texte: 3 gommes
    paires:
      a: y
      b: x
      c: z
  indices:
    relance: Pour chaque fraction, divise la quantité totale par le dénominateur.
    methode: Un tiers divise par 3, un quart divise par 4, un cinquième divise par 5.
    etape: 12 billes partagées en 3 parts égales.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Recalcule chaque division.
  - si:
      diagnostic: associations_fausses
    relance: Pour chaque ligne, divise la quantité par le dénominateur, puis cherche ce résultat à droite.
  solution: Un tiers de 12 billes fait 4 billes (12 ÷ 3). Un quart de 100 mètres fait 25 mètres (100 ÷ 4). Un cinquième de
    15 gommes fait 3 gommes (15 ÷ 5).
- id: sixieme-de-vingt-quatre-billes-reste
  type: nombre
  difficulte: 3
  enonce: Tom a 24 billes. Il donne un sixième de ses billes à Léa. Combien de billes reste-t-il à Tom ?
  reponse:
    valeur: 20
    forme: entier
  indices:
    relance: Commence par trouver combien de billes Tom donne à Léa.
    methode: Un sixième, c'est partager en 6 parts égales. Calcule une part, puis enlève-la du total.
    etape: Une part, c'est 24 ÷ 6. Ensuite, retire cette part des 24 billes.
  pieges:
  - si:
      valeur: 4
    relance: C'est le nombre de billes données à Léa. La question demande combien il en reste à Tom.
  - si:
      valeur: 18
    relance: Tu as enlevé 6 billes. Mais un sixième de 24, c'est partager 24 en 6 parts égales.
  - si:
      diagnostic: valeur_fausse
    relance: Fais le calcul en deux étapes, la part donnée puis ce qui reste.
  solution: '24 ÷ 6 = 4 : Tom donne 4 billes à Léa. 24 − 4 = 20. Il reste 20 billes à Tom.'
- id: expliquer-methode-fraction-quantite
  type: ouverte
  difficulte: 3
  enonce: Explique comment calculer un cinquième de 40 billes, sans donner directement le résultat.
  criteres:
  - L'élève dit qu'il faut partager 40 en 5 parts égales.
  - L'élève dit que la valeur d'une part est la réponse (un cinquième correspond à une seule part).
  - L'élève propose une façon de vérifier (une multiplication, ou un dessin de 5 tas égaux).
  indices:
    relance: Que représente le dénominateur 5 dans « un cinquième » ?
    methode: Le dénominateur indique en combien de parts égales partager la quantité totale.
    etape: 40 billes partagées en 5 parts égales.
  solution: Pour trouver un cinquième de 40 billes, on partage 40 en 5 parts égales ; la valeur d'une seule part est la réponse
    cherchée. On vérifie en multipliant cette part par 5.
