# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-figures-planes-usuelles
version: 3
etat: verifiee
declencheurs:
- quatre côtés égaux
- figure a des angles droits
- reconnaître un losange
- tracer un rectangle
- côtés parallèles
- triangle avec un angle droit
- assembler des figures
- trois côtés de même longueur
- construire avec le compas
prerequis: []
essentiel: 'Une figure plane est une figure dessinée à plat, sur une feuille. On reconnaît et on nomme les figures usuelles
  grâce à leur définition, pas seulement grâce à leur allure.


  Un triangle a trois côtés. Un triangle rectangle a un angle droit. Un triangle isocèle a deux côtés de même longueur. Un
  triangle équilatéral a ses trois côtés de même longueur, et ses trois angles sont égaux.


  Un quadrilatère a quatre côtés. Le rectangle a quatre angles droits ; ses côtés opposés sont parallèles et de même longueur,
  comme une porte ou une feuille de cahier. Le losange a quatre côtés de même longueur ; ses côtés opposés sont parallèles.


  Le carré a quatre angles droits et quatre côtés de même longueur. C''est donc à la fois un rectangle et un losange, comme
  une case de jeu de dames.


  Pour justifier la nature d''une figure, on vérifie ses propriétés : les angles droits avec l''équerre, les longueurs avec
  la règle graduée ou le compas. On peut aussi lire le codage de la figure.


  On sait reproduire ou construire un carré, un rectangle, un triangle, un triangle rectangle ou un cercle, sur papier quadrillé,
  pointé ou uni. On utilise la règle graduée, l''équerre et le compas. Pour un cercle, on écarte le compas de la longueur
  du rayon.


  On sait aussi construire une figure composée, par exemple une maison faite d''un carré surmonté d''un triangle, ou un rectangle
  avec un cercle à l''intérieur.

  '
methode:
- 'Observer la figure : combien de côtés, quelle forme générale ?'
- Vérifier les angles droits avec l'équerre.
- Comparer les longueurs des côtés avec la règle graduée ou le compas.
- Repérer les côtés opposés parallèles.
- Comparer ces propriétés à la définition de chaque figure usuelle pour la nommer.
- Pour construire, tracer d'abord un premier côté, puis les angles droits ou les arcs de cercle, puis fermer la figure.
vocabulaire:
- terme: quadrilatère
  definition: polygone à quatre côtés.
- terme: losange
  definition: quadrilatère dont les quatre côtés ont la même longueur.
- terme: rectangle
  definition: quadrilatère qui a quatre angles droits.
- terme: carré
  definition: quadrilatère qui a quatre angles droits et quatre côtés de même longueur.
- terme: triangle isocèle
  definition: triangle qui a deux côtés de même longueur.
- terme: triangle équilatéral
  definition: triangle qui a ses trois côtés de même longueur.
- terme: triangle rectangle
  definition: triangle qui a un angle droit.
erreurs_frequentes:
- Nommer une figure seulement d'après son allure sans vérifier les propriétés.
- Confondre carré et losange (le carré est un losange avec des angles droits en plus).
- Oublier de mesurer tous les côtés avant de dire qu'ils ont tous la même longueur.
- Croire qu'un carré posé sur une pointe n'est plus un carré.
- Vérifier un angle droit « à l'œil » au lieu d'utiliser l'équerre.
exemple:
  enonce: Une figure a quatre côtés, ses côtés opposés sont parallèles et elle a quatre angles droits mais pas tous les côtés
    égaux. Quelle figure est-ce ?
  solution: 'C''est un rectangle : quadrilatère avec quatre angles droits, mais les côtés ne sont pas tous égaux (sinon ce
    serait un carré).'
exercices:
- id: nom-quadrilatere-quatre-cotes
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un polygone qui a exactement quatre côtés ?
  reponse:
    acceptees:
    - quadrilatère
    - un quadrilatère
    fautes_tolerees: 1
  indices:
    relance: Le carré, le rectangle et le losange ont tous quatre côtés. Quel nom les regroupe ?
    methode: Relis le vocabulaire de la fiche. Un mot désigne toutes les figures à quatre côtés.
    etape: Un « quadricycle » a quatre roues. Le nom cherché commence de la même façon.
  pieges:
  - si:
      valeur: polygone
    relance: Un polygone peut avoir n'importe quel nombre de côtés. Il faut un mot plus précis pour 4 côtés.
  solution: 'On appelle cela un quadrilatère : un polygone à quatre côtés.'
- id: est-ce-un-carre
  type: choix
  difficulte: 1
  enonce: Une figure a quatre côtés égaux mais aucun angle droit. Quelle figure est-ce ?
  reponse:
    options:
    - id: a
      texte: Un carré
    - id: b
      texte: Un losange
    - id: c
      texte: Un rectangle
    bonnes:
    - b
  indices:
    relance: Un carré a-t-il forcément des angles droits ?
    methode: 'Compare les propriétés : quatre côtés égaux, mais pas d''angle droit. Quelle figure garde-t-on ?'
    etape: Le carré a quatre côtés égaux ET quatre angles droits. Ici, il manque les angles droits.
  pieges:
  - si:
      contient:
      - a
    relance: Un carré a aussi quatre angles droits, ce que cette figure n'a pas.
  - si:
      contient:
      - c
    relance: Un rectangle a quatre angles droits, mais ses côtés ne sont pas forcément tous égaux. Ici, aucun angle n'est
      droit.
  solution: 'C''est un losange : quadrilatère à quatre côtés égaux, sans forcément d''angle droit.'
- id: nature-triangle-deux-cotes
  type: choix
  difficulte: 1
  enonce: Un triangle a deux côtés de 5 cm et un troisième côté de 3 cm. Comment s'appelle ce triangle ?
  reponse:
    options:
    - id: a
      texte: Un triangle équilatéral
    - id: b
      texte: Un triangle isocèle
    - id: c
      texte: Un triangle rectangle
    bonnes:
    - b
  indices:
    relance: Compte combien de côtés ont la même longueur.
    methode: Rappelle-toi les définitions des triangles particuliers selon leurs côtés égaux.
    etape: Deux côtés seulement sont égaux, le troisième est différent.
  pieges:
  - si:
      contient:
      - a
    relance: Un triangle équilatéral a ses trois côtés égaux. Ici, le troisième côté est plus court.
  - si:
      contient:
      - c
    relance: Un triangle rectangle se reconnaît à son angle droit, pas aux longueurs de ses côtés. Regarde plutôt les côtés
      égaux.
  solution: 'Il a deux côtés de même longueur (5 cm et 5 cm) : c''est un triangle isocèle.'
- id: cote-manquant-triangle-equilateral
  type: nombre
  difficulte: 2
  enonce: Un triangle équilatéral a un côté de 5 cm. Quelle est la longueur de son deuxième côté, en cm ?
  reponse:
    valeur: 5
    forme: entier
  indices:
    relance: Un triangle équilatéral a une particularité sur ses côtés.
    methode: 'Rappelle-toi la définition du triangle équilatéral : que dit-elle sur ses trois côtés ?'
    etape: Ses trois côtés ont la même longueur, donc le deuxième côté a la même mesure que le premier.
  pieges:
  - si:
      valeur: 10
    relance: 'Tu as peut-être doublé la longueur. Relis la définition : les côtés sont-ils doublés ou identiques ?'
  - si:
      valeur: 0
    relance: Le triangle a bien trois côtés de longueur non nulle. Relis la définition du triangle équilatéral.
  solution: 'Un triangle équilatéral a ses trois côtés de même longueur : le deuxième côté mesure donc aussi 5 cm.'
- id: cotes-opposes-rectangle
  type: choix
  difficulte: 2
  enonce: Dans un rectangle, que peut-on dire de deux côtés opposés ?
  reponse:
    options:
    - id: a
      texte: Ils sont parallèles et de même longueur
    - id: b
      texte: Ils se coupent en formant un angle droit
    - id: c
      texte: Ils n'ont jamais la même longueur
    bonnes:
    - a
  indices:
    relance: Pense à une feuille de cahier et regarde le bord du haut et le bord du bas.
    methode: Deux côtés opposés ne se touchent pas. Mesure-les et regarde s'ils pourraient se croiser.
    etape: Le bord du haut et le bord du bas d'une feuille ne se croisent jamais. Compare aussi leurs longueurs.
  pieges:
  - si:
      contient:
      - b
    relance: Ce sont deux côtés qui se suivent qui forment un angle droit. Deux côtés opposés ne se touchent pas.
  - si:
      contient:
      - c
    relance: Mesure le bord du haut et le bord du bas d'une feuille de cahier. Ont-ils des longueurs différentes ?
  solution: Dans un rectangle, deux côtés opposés sont parallèles et ont la même longueur.
- id: construire-rectangle-etapes
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour construire, sur papier uni, un rectangle ABCD avec AB = 7 cm et BC = 3 cm.
  reponse:
    elements:
    - id: tracer-ab
      texte: Tracer le côté AB de 7 cm avec la règle graduée
    - id: perpendiculaires
      texte: Tracer, avec l'équerre, des perpendiculaires de 3 cm en A et en B
    - id: relier
      texte: Relier les extrémités des deux perpendiculaires pour former le rectangle
  indices:
    relance: Peux-tu tracer les angles droits avant même d'avoir un premier côté ?
    methode: Il faut d'abord un côté de départ, puis les angles droits à ses extrémités, puis fermer la figure.
    etape: La toute première étape utilise la règle graduée pour tracer AB.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Doit-on relier les points avant ou après avoir tracé les perpendiculaires
      ?
  - si:
      diagnostic: ordre_faux
    relance: Repense à ce qu'il faut avoir tracé avant de pouvoir utiliser l'équerre.
  solution: On trace d'abord AB = 7 cm, puis en A et B des perpendiculaires de 3 cm avec l'équerre, puis on relie les extrémités.
- id: ecartement-compas-cercle
  type: nombre
  difficulte: 2
  enonce: Tu veux tracer un cercle de rayon 4 cm. De combien de centimètres dois-tu écarter ton compas ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: L'écartement du compas, c'est la distance entre la pointe et la mine.
    methode: Cette distance est la même que la distance entre le centre du cercle et n'importe quel point du cercle.
    etape: La distance entre le centre et un point du cercle s'appelle le rayon. Relis l'énoncé.
  pieges:
  - si:
      valeur: 8
    relance: Tu as doublé la longueur. La pointe est au centre, la mine est sur le cercle ; mesure seulement du centre au
      bord.
  solution: 'On écarte le compas de la longueur du rayon : 4 cm, la pointe au centre et la mine sur le cercle.'
- id: figures-et-proprietes
  type: association
  difficulte: 2
  enonce: Relie chaque figure à sa propriété principale.
  reponse:
    gauche:
    - id: a
      texte: Carré
    - id: b
      texte: Rectangle
    - id: c
      texte: Losange
    - id: d
      texte: Triangle rectangle
    droite:
    - id: x
      texte: Quatre côtés égaux et quatre angles droits
    - id: y
      texte: Quatre angles droits, côtés opposés égaux
    - id: z
      texte: Quatre côtés égaux
    - id: w
      texte: Un angle droit
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: 'Le carré combine deux propriétés : celle du rectangle et celle du losange.'
    methode: Commence par le triangle rectangle, facile à repérer avec son seul angle droit.
    etape: Ensuite, distingue le carré (angles droits ET côtés égaux) du rectangle (angles droits seulement) et du losange
      (côtés égaux seulement).
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie surtout le carré et le losange, qui se ressemblent.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque figure et compare ses propriétés à celles données.
  solution: Carré → quatre côtés égaux et quatre angles droits ; rectangle → quatre angles droits, côtés opposés égaux ; losange
    → quatre côtés égaux ; triangle rectangle → un angle droit.
- id: justifier-non-carre
  type: ouverte
  difficulte: 3
  enonce: Un quadrilatère a quatre angles droits mais deux côtés mesurent 4 cm et les deux autres mesurent 6 cm. Explique
    pourquoi ce n'est pas un carré, et dis avec quels instruments tu vérifierais ses propriétés.
  criteres:
  - L'élève identifie qu'il s'agit d'un rectangle.
  - L'élève explique qu'un carré a en plus ses quatre côtés de même longueur, ce qui n'est pas le cas ici.
  - L'élève cite les instruments de vérification (équerre pour les angles droits, règle graduée ou compas pour les longueurs).
  indices:
    relance: Un carré a-t-il besoin de plus que des angles droits ?
    methode: 'Compare les propriétés du carré et de ce quadrilatère : que manque-t-il ?'
    etape: Le carré a quatre angles droits ET quatre côtés égaux. Ici, les côtés ne sont pas tous égaux.
  solution: Ce quadrilatère est un rectangle, car il a quatre angles droits. Mais un carré doit en plus avoir ses quatre côtés
    égaux, ce qui n'est pas le cas ici (4 cm et 6 cm). Je vérifie les angles droits avec l'équerre et les longueurs avec la
    règle graduée.
- id: nblm-comment-peut-on-reconnaitre-un-losange-p-1
  type: choix
  difficulte: 2
  enonce: Comment peut-on reconnaître un losange parmi les quadrilatères ?
  reponse:
    options:
    - id: o1
      texte: C'est un quadrilatère dont les quatre côtés ont la même longueur.
    - id: o2
      texte: C'est un quadrilatère qui a seulement trois côtés égaux.
    - id: o3
      texte: C'est un quadrilatère qui a obligatoirement quatre angles droits.
    - id: o4
      texte: C'est un triangle avec trois côtés de même longueur.
    bonnes:
    - o1
  indices:
    relance: Pense à la définition basée sur la longueur de tous ses côtés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un quadrilatère a quatre côtés, et pour être un losange, ses quatre côtés doivent tous être égaux.
  - si:
      contient:
      - o3
    relance: Un losange n'a pas nécessairement d'angles droits ; s'il a quatre angles droits, c'est un carré.
  - si:
      contient:
      - o4
    relance: Un losange est un quadrilatère (quatre côtés) et non un triangle (trois côtés).
  solution: 'C''est un quadrilatère dont les quatre côtés ont la même longueur. C''est la définition exacte du losange : un
    quadrilatère qui a quatre côtés de même longueur.'
- id: nblm-quelle-figure-a-quatre-angles-droits-et-2
  type: choix
  difficulte: 2
  enonce: Quelle figure a quatre angles droits et ses côtés opposés parallèles deux à deux, sans avoir obligatoirement ses
    quatre côtés égaux ?
  reponse:
    options:
    - id: o1
      texte: Le rectangle
    - id: o2
      texte: Le losange
    - id: o3
      texte: Le triangle rectangle
    - id: o4
      texte: Le cercle
    bonnes:
    - o1
  indices:
    relance: Cette figure possède 4 angles droits mais ses côtés adjacents peuvent être de longueurs différentes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le losange a ses quatre côtés de même longueur, mais il n'a pas nécessairement d'angles droits.
  - si:
      contient:
      - o4
    relance: Le cercle n'est pas un polygone et ne possède ni côtés ni angles droits.
  solution: Le rectangle. Le rectangle est un quadrilatère qui possède quatre angles droits et dont les côtés opposés sont
    parallèles et de même longueur deux à deux.
- id: nblm-comment-appelle-t-on-un-triangle-qui-pos-3
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on un triangle qui possède un angle droit ?
  reponse:
    options:
    - id: o1
      texte: Un triangle rectangle
    - id: o2
      texte: Un triangle isocèle
    - id: o3
      texte: Un triangle équilatéral
    - id: o4
      texte: Un quadrilatère
    bonnes:
    - o1
  indices:
    relance: Le nom de ce triangle rappelle une figure caractérisée par des angles droits.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un triangle isocèle se caractérise par deux côtés de même longueur, pas obligatoirement par un angle droit.
  - si:
      contient:
      - o3
    relance: Un triangle équilatéral possède trois côtés de même longueur et trois angles égaux.
  - si:
      contient:
      - o4
    relance: Un quadrilatère est une figure à quatre côtés, alors qu'un triangle a trois côtés.
  solution: Un triangle rectangle. Par définition, un triangle ayant un angle droit est appelé un triangle rectangle.
- id: nblm-pour-tracer-un-rectangle-avec-des-mesure-4
  type: choix
  difficulte: 2
  enonce: Pour tracer un rectangle avec des mesures précises sur papier uni, quels outils géométriques doit-on utiliser ?
  reponse:
    options:
    - id: o1
      texte: La règle graduée et l'équerre
    - id: o2
      texte: Le compas uniquement
    - id: o3
      texte: Un gabarit de cercle et des ciseaux
    - id: o4
      texte: Une feuille pliée uniquement
    bonnes:
    - o1
  indices:
    relance: Tu as besoin d'un outil pour mesurer les distances et d'un autre pour construire les angles droits.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le compas seul ne permet pas de tracer des segments droits ni d'assurer la précision des angles droits.
  - si:
      contient:
      - o3
    relance: Les ciseaux servent au découpage et le gabarit de cercle n'aide pas à tracer des côtés droits.
  - si:
      contient:
      - o4
    relance: Le pliage ne suffit pas pour tracer et mesurer des côtés avec des longueurs précises.
  solution: La règle graduée et l'équerre. L'équerre permet de tracer les angles droits et la règle graduée sert à mesurer
    précisément la longueur des côtés.
- id: nblm-quelle-est-la-particularite-du-carre-par-5
  type: choix
  difficulte: 2
  enonce: Quelle est la particularité du carré par rapport au losange ?
  reponse:
    options:
    - id: o1
      texte: Le carré est un losange qui a quatre angles droits en plus.
    - id: o2
      texte: Le carré n'a pas ses côtés opposés parallèles.
    - id: o3
      texte: Le carré a trois côtés seulement.
    - id: o4
      texte: Le carré n'a aucun côté de même longueur.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui différencie les angles entre un losange classique et un carré.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est faux, le carré a ses côtés opposés parallèles deux à deux.
  - si:
      contient:
      - o3
    relance: Le carré est un quadrilatère et possède donc quatre côtés.
  - si:
      contient:
      - o4
    relance: Au contraire, le carré a ses quatre côtés de même longueur.
  solution: Le carré est un losange qui a quatre angles droits en plus. Le carré possède les quatre côtés égaux du losange
    et ajoute la propriété d'avoir quatre angles droits.
- id: nblm-quelles-figures-usuelles-possedent-oblig-6
  type: choix
  difficulte: 3
  enonce: Quelles figures usuelles possèdent obligatoirement quatre angles droits et des côtés opposés parallèles ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le rectangle
    - id: o2
      texte: Le carré
    - id: o3
      texte: Le losange non carré
    - id: o4
      texte: Le triangle équilatéral
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les deux quadrilatères qui possèdent systématiquement 4 angles droits.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Un losange non carré a ses côtés opposés parallèles, mais il ne possède pas d'angles droits.
  - si:
      contient:
      - o4
    relance: Le triangle équilatéral a trois côtés et ne comporte aucun angle droit.
  solution: Le rectangle ; Le carré. Le rectangle a quatre angles droits et ses côtés opposés sont parallèles deux à deux.
- id: nblm-un-quadrilatere-qui-a-ses-quatre-cotes-d-7
  type: texte_court
  difficulte: 1
  enonce: Un quadrilatère qui a ses quatre côtés de même longueur s'appelle un ______.
  reponse:
    acceptees:
    - losange
    fautes_tolerees: 1
  indices:
    relance: C'est un quadrilatère à 4 côtés égaux qui ressemble parfois à un diamant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: losange. Un quadrilatère ayant ses quatre côtés de même longueur répond à la définition exacte du losange.
- id: nblm-pour-verifier-qu-un-triangle-possede-un-8
  type: texte_court
  difficulte: 1
  enonce: Pour vérifier qu'un triangle possède un angle droit, on utilise une ______.
  reponse:
    acceptees:
    - équerre
    fautes_tolerees: 1
  indices:
    relance: C'est l'outil géométrique en forme de triangle utilisé pour mesurer ou vérifier les angles droits.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: équerre. L'équerre est l'outil géométrique spécialement conçu pour vérifier et tracer des angles droits.
