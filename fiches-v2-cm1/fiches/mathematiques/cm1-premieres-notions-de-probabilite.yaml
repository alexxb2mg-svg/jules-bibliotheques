- id: nblm-dans-un-jeu-de-32-cartes-si-tu-viens-a-t-4
  type: choix
  difficulte: 2
  enonce: Dans un jeu de 32 cartes, si tu viens à tirer une carte au hasard, quelle est la chance de gagner en obtenant une
    carte rouge (cœur ou carreau) ?
  reponse:
    options:
    - id: o1
      texte: Une chance sur deux
    - id: o2
      texte: Une chance sur quatre
    - id: o3
      texte: C'est un événement certain
    - id: o4
      texte: C'est un événement impossible
    bonnes:
    - o1
  indices:
    relance: Compare la quantité de cartes rouges au nombre total de cartes du jeu.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Une chance sur quatre correspondrait à tirer une enseigne précise (comme uniquement le cœur), alors qu'ici les
      cartes rouges regroupent cœurs et carreaux.
  - si:
      contient:
      - o3
    relance: On peut aussi tirer une carte noire (pique ou trèfle), ce n'est donc pas certain.
  - si:
      contient:
      - o4
    relance: Il y a des cartes rouges dans le jeu, il est donc possible d'en tirer une.
  solution: Une chance sur deux. Dans un jeu de 32 cartes, il y a exactement autant de cartes rouges (16) que de cartes noires
    (16).
- id: nblm-on-fait-tourner-une-roue-partagee-en-4-s-5
  type: choix
  difficulte: 2
  enonce: 'On fait tourner une roue partagée en 4 secteurs égaux : 3 secteurs sont noirs et 1 secteur est blanc. Quelle proposition
    est exacte ?'
  reponse:
    options:
    - id: o1
      texte: Il y a plus de chances d'obtenir la couleur noire que la couleur blanche.
    - id: o2
      texte: Il y a exactement une chance sur deux d'obtenir la couleur blanche.
    - id: o3
      texte: Obtenir la couleur blanche est un événement impossible.
    - id: o4
      texte: Obtenir la couleur noire est un événement certain.
    bonnes:
    - o1
  indices:
    relance: Observe la proportion de chaque couleur sur la roue pour comparer les chances.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : ce n''est pas parce qu''il y a deux couleurs possibles qu''elles ont la même probabilité.'
  - si:
      contient:
      - o3
    relance: Il y a un secteur blanc sur la roue, la flèche peut donc s'arrêter dessus.
  - si:
      contient:
      - o4
    relance: Ce n'est pas certain car la flèche peut s'arrêter sur le secteur blanc.
  solution: Il y a plus de chances d'obtenir la couleur noire que la couleur blanche. Puisqu'il y a 3 secteurs noirs sur 4,
    l'événement « obtenir du noir » a plus d'une chance sur deux de se réaliser.
- id: nblm-quelles-sont-les-deux-affirmations-sur-l-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations sur les probabilités qui sont vraies ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Une expérience aléatoire est une expérience dont on ne connaît pas le résultat à l'avance.
    - id: o2
      texte: Un événement certain est un événement qui arrive à coup sûr.
    - id: o3
      texte: Avoir deux issues possibles garantit toujours d'avoir une chance sur deux.
    - id: o4
      texte: Un événement peu probable est un événement totalement impossible.
    bonnes:
    - o1
    - o2
  indices:
    relance: Rappelle-toi les définitions exactes d'une expérience aléatoire et d'un événement certain.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : il faut s''assurer que les deux issues sont équiprobables (mênes chances de se réaliser).'
  - si:
      contient:
      - o4
    relance: Un événement peu probable a peu de chances d'arriver, alors qu'un événement impossible ne peut jamais arriver.
  solution: Une expérience aléatoire est une expérience dont on ne connaît pas le résultat à l'avance ; Un événement certain
    est un événement qui arrive à coup sûr. C'est la définition exacte d'une expérience aléatoire.
- id: nblm-lorsqu-on-effectue-le-lancer-un-de-a-6-f-7
  type: texte_court
  difficulte: 1
  enonce: Lorsqu'on effectue le lancer un dé à 6 faces, obtenir le chiffre 8 est un événement ________.
  reponse:
    acceptees:
    - impossible
