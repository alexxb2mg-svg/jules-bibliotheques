# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-premieres-notions-de-probabilite
version: 3
etat: generee
declencheurs:
- lancer un dé
- tirer une carte
- pile ou face
- chance de gagner
- événement impossible
- événement certain
- sac de billes
- tirer au sort
- plus de chances
prerequis: []
essentiel: 'Une expérience aléatoire est une expérience dont on ne connaît pas le résultat à l''avance. Lancer un dé, lancer
  une pièce, tirer une carte ou une bille au hasard sont des expériences aléatoires.


  Chaque résultat possible s''appelle une issue. Avec un dé à 6 faces, il y a 6 issues : 1, 2, 3, 4, 5 et 6. Avec une pièce,
  il y a 2 issues : pile ou face. On apprend à lister toutes les issues, sans en oublier et sans en répéter.


  Un évènement peut être impossible : il ne peut jamais arriver. Exemple : obtenir 7 avec un dé à 6 faces. Il peut être certain
  : il arrive à coup sûr. Exemple : obtenir un nombre plus petit que 7 avec ce dé. Entre les deux, il est possible : il peut
  arriver, ou pas.


  Un évènement possible peut être probable (il a beaucoup de chances d''arriver) ou peu probable (il en a peu). Dans un sac
  avec 9 billes bleues et 1 bille rouge, tirer une bleue est probable, tirer la rouge est peu probable. On compare ainsi les
  chances des issues.


  Quand deux issues ont exactement les mêmes chances, on parle d''équiprobabilité. Avec une pièce non truquée, pile et face
  ont chacune une chance sur deux.


  Attention : deux issues possibles ne veulent pas toujours dire une chance sur deux. Dans le sac de 9 billes bleues et 1
  rouge, il y a deux couleurs possibles, mais la rouge n''a pas une chance sur deux. Il faut vérifier si les issues sont vraiment
  équiprobables.

  '
methode:
- Identifier l'expérience aléatoire.
- Lister toutes les issues possibles, sans en oublier ni en répéter.
- Se demander si l'évènement étudié est impossible, certain ou seulement possible.
- S'il est possible, comparer ses chances avec celles des autres issues (probable ou peu probable).
- Vérifier s'il y a équiprobabilité avant de dire « une chance sur deux ».
vocabulaire:
- terme: expérience aléatoire
  definition: Une expérience dont on ne connaît pas le résultat à l'avance.
- terme: issue
  definition: Un des résultats possibles d'une expérience aléatoire.
- terme: impossible
  definition: Se dit d'un évènement qui ne peut jamais arriver.
- terme: certain
  definition: Se dit d'un évènement qui arrive à coup sûr.
- terme: peu probable
  definition: Se dit d'un évènement possible qui a peu de chances d'arriver.
- terme: une chance sur deux
  definition: Il y a autant de chances que l'évènement arrive ou qu'il n'arrive pas.
- terme: équiprobabilité
  definition: Situation où plusieurs issues ont exactement la même chance de se réaliser.
erreurs_frequentes:
- Croire que deux issues possibles ont toujours chacune une chance sur deux.
- Confondre « peu probable » et « impossible ».
- Oublier une issue possible en les listant, ou en compter une deux fois.
- Croire qu'un évènement probable est certain.
exemple:
  enonce: On lance un dé à 6 faces. L'évènement « obtenir un nombre inférieur à 7 » est-il certain, possible ou impossible
    ?
  solution: 'Les issues possibles sont 1, 2, 3, 4, 5 et 6. Elles sont toutes inférieures à 7. L''évènement arrive donc à coup
    sûr : il est certain.'
exercices:
- id: lister-issues-de
  type: texte_court
  difficulte: 1
  enonce: On lance un dé à 6 faces, numéroté de 1 à 6. Quel est le plus grand nombre que l'on peut obtenir ?
  reponse:
    acceptees:
    - '6'
    fautes_tolerees: 0
  indices:
    relance: Un dé classique a six faces numérotées à partir de 1.
    methode: Compte le nombre total de faces du dé pour trouver le plus grand nombre possible.
    etape: Les nombres du dé vont de 1 jusqu'à un nombre égal au nombre de faces.
  pieges:
  - si:
      valeur: '7'
    relance: 'Un dé classique n''a que six faces : 7 n''est pas une valeur possible.'
  solution: Le plus grand nombre possible est 6, car le dé a six faces numérotées de 1 à 6.
- id: compter-issues-cartons
  type: nombre
  difficulte: 1
  enonce: Dans une boîte, il y a des cartons numérotés de 1 à 8, un seul carton par numéro. On en tire un au hasard. Combien
    y a-t-il d'issues possibles ?
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Chaque carton tiré donne une issue différente. Combien de cartons différents y a-t-il ?
    methode: Écris la liste de tous les numéros possibles, sans en oublier ni en répéter, puis compte-les.
    etape: La liste commence par 1, 2, 3. Continue jusqu'au dernier numéro.
  pieges:
  - si:
      valeur: 2
    relance: Il n'y a pas seulement « gagné » ou « perdu » ici. Chaque numéro est une issue.
  - si:
      diagnostic: valeur_fausse
    relance: Relis ta liste de numéros. Tu en as peut-être oublié un, ou compté un deux fois.
  solution: Les issues possibles sont 1, 2, 3, 4, 5, 6, 7 et 8. Il y a 8 issues possibles.
- id: equiprobabilite-piece
  type: choix
  difficulte: 1
  enonce: On lance une pièce non truquée. Que peut-on dire des chances d'obtenir pile ou face ?
  reponse:
    options:
    - id: a
      texte: Il y a autant de chances d'obtenir pile que face
    - id: b
      texte: Il y a plus de chances d'obtenir pile
    - id: c
      texte: On ne peut pas savoir sans faire l'expérience plusieurs fois
    bonnes:
    - a
  indices:
    relance: Une pièce non truquée a deux faces qui se ressemblent en tout point pour le hasard.
    methode: 'Pense à ce que signifie « non truquée » : aucune face n''est favorisée par rapport à l''autre.'
    etape: Une pièce non truquée place les deux issues sur un pied d'égalité totale.
  pieges:
  - si:
      contient:
      - b
    relance: Rien ne favorise pile par rapport à face si la pièce n'est pas truquée.
  - si:
      contient:
      - c
    relance: La régularité d'une pièce non truquée permet de connaître les chances sans faire l'expérience.
  solution: 'Il y a autant de chances (une chance sur deux) d''obtenir pile que face : c''est une situation d''équiprobabilité.'
- id: probabilite-sac-uniquement-rouge
  type: choix
  difficulte: 1
  enonce: 'Dans un sac, il y a seulement des billes rouges. On tire une bille au hasard. Tirer une bille bleue, c''est :'
  reponse:
    options:
    - id: a
      texte: Impossible
    - id: b
      texte: Certain
    - id: c
      texte: Peu probable mais possible
    bonnes:
    - a
  indices:
    relance: Combien de billes bleues sont réellement présentes dans le sac ?
    methode: Vérifie si l'objet recherché existe même en un seul exemplaire dans le sac.
    etape: S'il n'y a aucune bille bleue, tirer une bille bleue ne peut jamais arriver.
  pieges:
  - si:
      contient:
      - b
    relance: Certain signifierait que l'évènement arrive à coup sûr, ce qui n'est pas le cas ici.
  - si:
      contient:
      - c
    relance: Peu probable mais possible signifierait qu'il existe au moins une bille bleue, ce qui n'est pas le cas.
  solution: 'C''est impossible : il n''y a aucune bille bleue dans le sac.'
- id: deux-couleurs-pas-une-chance-sur-deux
  type: choix
  difficulte: 2
  enonce: Un sac contient 1 bille rouge et 5 billes bleues. Inès dit « Il y a deux couleurs, donc j'ai une chance sur deux
    de tirer la rouge. » Qu'en penses-tu ?
  reponse:
    options:
    - id: a
      texte: Inès a raison, il y a deux couleurs possibles.
    - id: b
      texte: Inès se trompe, tirer la rouge est peu probable.
    - id: c
      texte: Inès se trompe, tirer la rouge est impossible.
    bonnes:
    - b
  indices:
    relance: Les deux couleurs ont-elles autant de billes dans le sac ?
    methode: Compare le nombre de billes rouges et le nombre de billes bleues.
    etape: Il y a 1 bille rouge pour 5 billes bleues. Les deux issues ne sont pas équiprobables.
  pieges:
  - si:
      contient:
      - a
    relance: Deux issues possibles ne veulent pas toujours dire une chance sur deux. Les deux couleurs ont-elles autant de
      billes ?
  - si:
      contient:
      - c
    relance: Il y a bien une bille rouge dans le sac. Peut-on la tirer, même rarement ?
  solution: 'Inès se trompe. Il y a 1 bille rouge et 5 billes bleues : les deux couleurs n''ont pas les mêmes chances. Tirer
    la rouge est possible, mais peu probable.'
- id: etapes-analyse-experience
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour analyser une expérience aléatoire, comme le tirage d'une carte dans un jeu.
  reponse:
    elements:
    - id: identifier
      texte: Identifier l'expérience aléatoire étudiée
    - id: lister
      texte: Lister toutes les issues possibles, sans en oublier
    - id: qualifier
      texte: Se demander si l'évènement étudié est impossible, certain ou seulement possible
    - id: comparer
      texte: Pour finir, comparer les chances des issues en vérifiant s'il y a équiprobabilité
  indices:
    relance: Peux-tu qualifier un évènement avant même d'avoir listé les issues possibles ?
    methode: Il faut d'abord bien comprendre l'expérience, puis en connaître toutes les issues, avant de juger un évènement
      précis.
    etape: La toute première étape consiste à bien identifier de quelle expérience il s'agit.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Doit-on lister les issues avant ou après avoir qualifié l'évènement ?
  - si:
      diagnostic: ordre_faux
    relance: La vérification de l'équiprobabilité vient en dernier, une fois les issues bien identifiées et qualifiées.
  solution: On identifie l'expérience, on liste toutes les issues possibles, on qualifie l'évènement (impossible, certain,
    possible), puis on vérifie l'équiprobabilité si besoin.
- id: qualifier-evenements
  type: association
  difficulte: 2
  enonce: Relie chaque situation à sa qualification.
  reponse:
    gauche:
    - id: a
      texte: Obtenir un nombre pair en lançant un dé classique à 6 faces
    - id: b
      texte: Tirer une bille verte dans un sac ne contenant que des billes jaunes
    - id: c
      texte: Obtenir un nombre inférieur à 10 en lançant un dé classique à 6 faces
    droite:
    - id: x
      texte: Certain
    - id: y
      texte: Impossible
    - id: z
      texte: Possible, sans certitude
    paires:
      a: z
      b: y
      c: x
  indices:
    relance: Un dé classique ne dépasse jamais un certain nombre de faces.
    methode: Distingue une situation qui arrive toujours (certaine) d'une situation qui ne peut jamais arriver (impossible).
    etape: 'Obtenir un nombre pair n''est ni garanti ni impossible : le résultat dépend du hasard du lancer.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Compare bien les situations certaines et impossibles.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque situation et demande-toi si le résultat peut varier ou non.
  solution: Obtenir un nombre pair → possible sans certitude ; tirer une bille verte parmi des jaunes → impossible ; obtenir
    un nombre inférieur à 10 avec un dé à 6 faces → certain.
- id: ranger-couleurs-selon-chances
  type: ordre
  difficulte: 3
  enonce: Un sac contient 6 billes vertes, 1 bille jaune et 3 billes bleues. On tire une bille au hasard. Range les couleurs
    de la moins probable à la plus probable.
  reponse:
    elements:
    - id: jaune
      texte: Jaune
    - id: bleue
      texte: Bleue
    - id: verte
      texte: Verte
  indices:
    relance: Une couleur a plus de chances d'être tirée quand il y a plus de billes de cette couleur. Laquelle a le moins
      de billes ?
    methode: Compte les billes de chaque couleur, puis range les couleurs du plus petit nombre de billes au plus grand.
    etape: La couleur qui n'a qu'une seule bille est la moins probable.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux couleurs voisines sont inversées. Compare encore le nombre de billes de chaque couleur.
  - si:
      diagnostic: ordre_faux
    relance: Commence par la couleur qui a le moins de billes, et finis par celle qui en a le plus.
  solution: 'Il y a 1 bille jaune, 3 bleues et 6 vertes. De la moins probable à la plus probable : jaune, bleue, verte.'
- id: expliquer-improbable-vs-impossible
  type: ouverte
  difficulte: 3
  enonce: Explique la différence entre un évènement « peu probable » et un évènement « impossible », avec un exemple pour
    chacun.
  criteres:
  - L'élève explique qu'un évènement peu probable peut arriver, mais rarement.
  - L'élève explique qu'un évènement impossible ne peut jamais arriver.
  - L'élève donne un exemple juste pour chacun des deux mots (dé, pièce, sac de billes...).
  indices:
    relance: Un évènement peu probable peut-il quand même se produire, même rarement ?
    methode: Pense à un tirage avec très peu de billes gagnantes parmi beaucoup de billes perdantes, comparé à un tirage sans
      aucune bille gagnante.
    etape: Le peu probable garde une petite chance de se réaliser ; l'impossible n'en a aucune.
  solution: 'Un évènement peu probable peut arriver, mais c''est rare : par exemple, tirer la seule bille rouge parmi 99 billes
    bleues. Un évènement impossible ne peut jamais arriver : par exemple, tirer une bille rouge dans un sac qui n''en contient
    aucune.'
- id: nblm-si-tu-effectues-un-lancer-de-piece-de-mo-1
  type: choix
  difficulte: 2
  enonce: Si tu effectues un lancer de pièce de monnaie non truquée, quelle est la chance d'obtenir « pile » lors de ce pile
    ou face ?
  reponse:
    options:
    - id: o1
      texte: Une chance sur deux
    - id: o2
      texte: C'est un événement certain
    - id: o3
      texte: C'est un événement impossible
    - id: o4
      texte: Trois chances sur quatre
    bonnes:
    - o1
  indices:
    relance: Pense au nombre de côtés d'une pièce et vérifie si chaque côté a la même chance d'apparaître.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : on n''est pas sûr d''obtenir pile, car on peut aussi obtenir face.'
  - si:
      contient:
      - o3
    relance: Il est possible d'obtenir pile lors d'un lancer de pièce, ce n'est pas impossible.
  - si:
      contient:
      - o4
    relance: Une pièce de monnaie n'a que 2 côtés, il n'y a donc pas 4 issues possibles.
  solution: Une chance sur deux. Il y a deux issues possibles (pile ou face) qui ont exactement la même chance de se réaliser.
- id: nblm-lors-d-un-lancer-un-de-classique-a-6-fac-2
  type: choix
  difficulte: 2
  enonce: Lors d'un lancer un dé classique à 6 faces (numérotées de 1 à 6), quel résultat correspond à un événement certain
    ?
  reponse:
    options:
    - id: o1
      texte: Obtenir un nombre inférieur à 7
    - id: o2
      texte: Obtenir le chiffre 6
    - id: o3
      texte: Obtenir un nombre supérieur à 10
    - id: o4
      texte: Obtenir un nombre pair
    bonnes:
    - o1
  indices:
    relance: Un événement certain se produit obligatoirement, quelle que soit la face du dé qui apparaît.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Obtenir un 6 est possible mais ce n'est pas certain, car le dé peut tomber sur une autre face.
  - si:
      contient:
      - o3
    relance: C'est un événement impossible car les numéros du dé s'arrêtent à 6.
  - si:
      contient:
      - o4
    relance: C'est un événement possible (une chance sur deux), mais pas certain car on peut aussi obtenir un nombre impair.
  solution: Obtenir un nombre inférieur à 7. Toutes les faces du dé (1, 2, 3, 4, 5, 6) portent un nombre inférieur à 7, donc
    cet événement se réalise à coup sûr.
- id: nblm-si-tu-realises-le-lancer-un-de-a-6-faces-3
  type: choix
  difficulte: 2
  enonce: Si tu réalises le lancer un dé à 6 faces, quel résultat est un événement impossible ?
  reponse:
    options:
    - id: o1
      texte: Obtenir le nombre 7
    - id: o2
      texte: Obtenir le nombre 1
    - id: o3
      texte: Obtenir un nombre impair
    - id: o4
      texte: Obtenir un nombre plus petit que 7
    bonnes:
    - o1
  indices:
    relance: Examine les numéros qui sont réellement écrits sur les faces d'un dé ordinaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le nombre 1 est présent sur le dé, c'est donc une issue possible.
  - si:
      contient:
      - o3
    relance: Les nombres 1, 3 et 5 sont sur le dé, cet événement est tout à fait possible.
  - si:
      contient:
      - o4
    relance: Cet événement est certain, et non pas impossible.
  solution: Obtenir le nombre 7. Un dé classique ne possède que des faces numérotées de 1 à 6, il ne peut jamais donner un
