format: 2
notion: cm1-aires
version: 3
etat: generee
declencheurs:
- aire
- surface
- carreaux
- centimètre carré
- plus grand que
- pavage
- recouvrir de carreaux
- compter les carreaux
- prend le plus de place
prerequis:
- cm1-longueurs
essentiel: 'L''aire d''une figure, c''est la mesure de sa surface : la place qu''elle occupe à plat. Par exemple, on peut
  parler de l''aire d''une feuille de cahier, d''un tapis ou d''une case de jeu de dames.


  On peut comparer deux aires sans les mesurer. On pose une figure sur l''autre : si elle tient entièrement dedans, son aire
  est plus petite. On peut aussi découper une figure et recoller les morceaux autrement : la forme change, mais l''aire reste
  la même.


  Pour déterminer une aire, on choisit une unité, souvent un carreau. On compte combien de carreaux recouvrent la figure,
  sans trou et sans chevauchement : c''est un pavage. Deux demi-carreaux font un carreau entier.


  L''unité à connaître est le centimètre carré, noté cm². C''est l''aire d''un carré de 1 cm de côté. Une figure recouverte
  exactement par 12 carrés de 1 cm de côté a une aire de 12 cm².


  Quand le bord de la figure ne suit pas le quadrillage, on ne peut pas toujours compter exactement. On encadre alors l''aire
  : au moins le nombre de carreaux complets à l''intérieur, au plus le nombre de carreaux qui touchent la figure.


  Au CM1, on n''apprend pas de formule par cœur. On comprend ce qu''est une aire et on la trouve en comptant sur un quadrillage,
  rangée par rangée si besoin.


  Attention : l''aire et le périmètre sont deux choses différentes. Le périmètre est la longueur du contour, l''aire est la
  surface à l''intérieur. Deux figures peuvent avoir la même aire et des périmètres différents.

  '
methode:
- Pour comparer sans mesurer, superposer les deux figures ou découper et recoller les morceaux.
- Poser la figure sur un quadrillage (ou l'imaginer quadrillée).
- Compter les carreaux entiers à l'intérieur de la figure, en marquant chaque carreau compté.
- Ajouter les demi-carreaux (deux demi-carreaux font un carreau entier).
- Si la figure est irrégulière, encadrer l'aire entre deux nombres de carreaux (carreaux complets à l'intérieur, et carreaux
  qui touchent la figure).
- Exprimer le résultat en cm² si chaque carreau est un carré de 1 cm de côté.
vocabulaire:
- terme: aire
  definition: mesure de la surface occupée par une figure.
- terme: centimètre carré (cm²)
  definition: aire d'un carré de 1 cm de côté.
- terme: pavage
  definition: recouvrement d'une figure par des carreaux identiques, sans trou et sans chevauchement.
- terme: quadrillage
  definition: réseau de carreaux identiques qui aide à compter une aire.
- terme: encadrer une aire
  definition: donner un nombre plus petit et un nombre plus grand entre lesquels l'aire se trouve.
- terme: périmètre
  definition: longueur du contour d'une figure, à ne pas confondre avec son aire.
erreurs_frequentes:
- Confondre aire et périmètre.
- 'Vouloir appliquer une formule apprise par cœur : au CM1 on compte les carreaux.'
- Oublier les demi-carreaux quand la figure ne suit pas exactement le quadrillage.
- Compter deux fois le même carreau ou en oublier un, faute de les marquer.
- Croire qu'une figure découpée et recollée autrement change d'aire.
exemple:
  enonce: Sur un quadrillage, une figure au bord arrondi recouvre entièrement 18 carreaux. En tout, 36 carreaux sont touchés
    par la figure, en entier ou en partie. Que peut-on dire de son aire ?
  solution: 'Son aire est comprise entre 18 carreaux et 36 carreaux : on l''encadre car on ne peut pas la compter exactement.
    Elle vaut au moins 18 carreaux (les carreaux complets) et au plus 36 carreaux (tous les carreaux touchés).'
exercices:
- id: aire-carreaux-demi
  type: nombre
  difficulte: 1
  enonce: Une figure est composée de 7 carreaux entiers et de 4 demi-carreaux. Quelle est son aire en carreaux ?
  reponse:
    valeur: 9
    forme: entier
  indices:
    relance: Deux demi-carreaux font un carreau entier.
    methode: Transforme les demi-carreaux en carreaux entiers, puis additionne au nombre de carreaux entiers déjà comptés.
    etape: 4 demi-carreaux correspondent à combien de carreaux entiers ?
  pieges:
  - si:
      valeur: 11
    relance: Vérifie combien de carreaux entiers forment les 4 demi-carreaux ; deux demi-carreaux ne font qu'un seul carreau.
  solution: 4 demi-carreaux = 2 carreaux entiers. 7 + 2 = 9 carreaux.
- id: aire-carre-1cm
  type: nombre
  difficulte: 1
  enonce: Un carré de 1 cm de côté est posé sur une figure 12 fois exactement, sans trou ni recouvrement. Quelle est l'aire
    de la figure, en cm² ?
  reponse:
    valeur: 12
    forme: entier
  indices:
    relance: Le carré de 1 cm de côté mesure 1 cm².
    methode: Si un carré de 1 cm² recouvre la figure un certain nombre de fois exactement, l'aire de la figure correspond
      directement à ce nombre de carrés.
    etape: Combien de fois le carré de 1 cm² recouvre-t-il la figure ?
  pieges:
  - si:
      valeur: 4
    relance: 4 correspondrait au périmètre d'un carré, pas à une aire mesurée en carreaux de 1 cm².
  solution: L'aire de la figure est 12 cm², car elle est recouverte par 12 carrés de 1 cm².
- id: comparer-aire-perimetre
  type: choix
  difficulte: 2
  enonce: Deux figures A et B ont la même aire mais pas la même forme. Peut-on dire qu'elles ont le même périmètre ?
  reponse:
    options:
    - id: a
      texte: Oui, deux figures de même aire ont toujours le même périmètre
    - id: b
      texte: Non, deux figures peuvent avoir la même aire mais des périmètres différents
    bonnes:
    - b
  indices:
    relance: Aire et périmètre ne mesurent pas la même chose.
    methode: Pense à deux figures très différentes de forme (par exemple une longue et fine, une autre plus carrée) qui pourraient
      recouvrir le même nombre de carreaux.
    etape: L'aire compte les carreaux recouverts ; le périmètre mesure le contour. Ces deux mesures évoluent-elles forcément
      ensemble ?
  pieges:
  - si:
      contient:
      - a
    relance: L'aire et le périmètre sont deux mesures différentes ; une figure allongée et une figure compacte peuvent avoir
      la même aire avec des périmètres différents.
  solution: 'Non : deux figures peuvent avoir la même aire mais des périmètres différents.'
- id: comparer-deux-figures-demi-carreaux
  type: choix
  difficulte: 2
  enonce: La figure A est faite de 14 carreaux entiers. La figure B est faite de 11 carreaux entiers et de 6 demi-carreaux.
    Que peut-on dire de leurs aires ?
  reponse:
    options:
    - id: a
      texte: La figure A a la plus grande aire
    - id: b
      texte: La figure B a la plus grande aire
    - id: c
      texte: Les deux figures ont la même aire
    bonnes:
    - c
  indices:
    relance: Avant de comparer, il faut exprimer les deux aires avec la même unité, le carreau entier.
    methode: Transforme les demi-carreaux de la figure B en carreaux entiers, puis ajoute ses carreaux entiers.
    etape: 6 demi-carreaux, c'est combien de carreaux entiers ? Ajoute ce nombre à 11.
  pieges:
  - si:
      contient:
      - b
    relance: As-tu compté chaque demi-carreau comme un carreau entier ? Deux demi-carreaux ne font qu'un carreau.
  - si:
      contient:
      - a
    relance: N'oublie pas les demi-carreaux de la figure B, ils font aussi partie de son aire.
  solution: 'Figure B : 6 demi-carreaux = 3 carreaux, et 11 + 3 = 14 carreaux. La figure A a aussi 14 carreaux : les deux
    figures ont la même aire.'
- id: ranger-figures-par-aire
  type: ordre
  difficulte: 2
  enonce: Range ces trois figures de la plus petite aire à la plus grande.
  reponse:
    elements:
    - id: figure-c
      texte: Figure C, faite de 12 demi-carreaux
    - id: figure-a
      texte: Figure A, faite de 9 carreaux entiers
    - id: figure-b
      texte: Figure B, faite de 6 carreaux entiers et de 8 demi-carreaux
  indices:
    relance: Exprime d'abord chaque aire en carreaux entiers.
    methode: Pour chaque figure, transforme les demi-carreaux en carreaux entiers (deux demi-carreaux pour un carreau), puis
      compare les trois nombres.
    etape: Commence par la figure C, faite seulement de demi-carreaux. Combien de carreaux entiers cela fait-il ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux figures voisines sont inversées. Recalcule l'aire de chacune en carreaux entiers.
  - si:
      diagnostic: ordre_faux
    relance: As-tu compté les demi-carreaux comme des carreaux entiers ? Convertis-les avant de ranger.
  solution: 'Figure C : 12 demi-carreaux = 6 carreaux. Figure A : 9 carreaux. Figure B : 6 + 4 = 10 carreaux. Ordre : C (6),
    puis A (9), puis B (10).'
- id: encadrement-aire-figure
  type: nombre
  difficulte: 2
  enonce: Sur un quadrillage, une figure au bord arrondi recouvre entièrement 18 carreaux. En tout, 36 carreaux sont touchés
    par la figure, en entier ou en partie. Son aire vaut au moins combien de carreaux ?
  reponse:
    valeur: 18
    forme: entier
  indices:
    relance: Certains carreaux sont recouverts en entier, d'autres seulement en partie. Lesquels es-tu sûr de compter ?
    methode: Repère le nombre de carreaux complets à l'intérieur de la figure, sans les morceaux qui débordent.
    etape: Combien de carreaux sont entièrement recouverts par la figure, sans compter les carreaux partiellement recouverts
      ?
  pieges:
  - si:
      valeur: 36
    relance: 36 correspond au maximum possible si on compte tous les carreaux même partiellement recouverts. La plus petite
      valeur est plus basse.
  solution: La plus petite valeur possible de l'aire est 18 carreaux, car c'est le nombre de carreaux entièrement recouverts
    par la figure.
- id: rectangle-paves-rangees
  type: nombre
  difficulte: 3
  enonce: Sur un quadrillage de carreaux de 1 cm de côté, un rectangle est recouvert exactement par 3 rangées de 5 carreaux
    chacune. Quelle est son aire, en cm² ?
  reponse:
    valeur: 15
    forme: entier
  indices:
    relance: Chaque carreau est un carré de 1 cm de côté, donc il mesure 1 cm².
    methode: Compte les carreaux d'une rangée, puis ajoute autant de fois ce nombre qu'il y a de rangées.
    etape: Une rangée contient 5 carreaux. Combien de carreaux y a-t-il dans les trois rangées réunies ?
  pieges:
  - si:
      valeur: 8
    relance: Tu as ajouté le nombre de carreaux d'une rangée et le nombre de rangées. Il faut compter tous les carreaux, rangée
      après rangée.
  - si:
      valeur: 16
    relance: Ce nombre ressemble à la longueur du contour du rectangle, son périmètre. L'aire compte les carreaux à l'intérieur.
  solution: 'Chaque rangée a 5 carreaux et il y a 3 rangées : 5 + 5 + 5 = 15 carreaux de 1 cm². L''aire du rectangle est 15
    cm².'
- id: expliquer-difference-aire-perimetre
  type: ouverte
  difficulte: 3
  enonce: Explique la différence entre l'aire et le périmètre d'une figure, en donnant un exemple qui montre qu'elles ne varient
    pas forcément ensemble.
  criteres:
  - L'élève explique que l'aire mesure la surface occupée (nombre de carreaux) et le périmètre mesure le contour (longueur
    des côtés).
  - L'élève explique qu'au CM1 on détermine l'aire en comptant les carreaux, sans formule à mémoriser.
  - L'élève donne un exemple cohérent de deux figures de même aire mais de périmètres différents (ou l'inverse).
  indices:
    relance: Qu'est-ce qui change entre « compter le contour d'une figure » et « compter sa surface » ?
    methode: Pense à deux figures de formes différentes mais qui recouvrent le même nombre de carreaux.
    etape: Décris comment tu comptes l'aire (carreaux) et comment tu comptes le périmètre (longueur des côtés), puis compare
      les deux avec un exemple.
  solution: L'aire mesure la surface occupée par une figure, en comptant le nombre de carreaux qui la recouvrent ; au CM1,
    on ne mémorise pas de formule, on compte les carreaux. Le périmètre mesure la longueur du contour de la figure, en additionnant
    la longueur de tous ses côtés. Par exemple, une figure allongée et une figure plus compacte peuvent recouvrir le même
    nombre de carreaux (même aire) tout en ayant un contour de longueur différente (périmètre différent).
- id: nblm-qu-est-ce-que-l-aire-d-une-figure-plane-1
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que l'aire d'une figure plane ?
  reponse:
    options:
    - id: o1
      texte: La mesure de la surface occupée par la figure à plat.
    - id: o2
      texte: La longueur du contour tout autour de la figure.
    - id: o3
      texte: Le nombre d'angles droits présents dans la figure.
    - id: o4
      texte: Le poids de la feuille sur laquelle la figure est dessinée.
    bonnes:
    - o1
  indices:
    relance: Pense à l'espace occupé à plat par la figure.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est la définition du périmètre, pas de l'aire.
  - si:
      contient:
      - o3
    relance: Le nombre d'angles caractérise la forme géométrique, pas la mesure de sa surface.
  - si:
      contient:
      - o4
    relance: Le poids correspond à une masse, alors que l'aire mesure une surface.
  solution: 'La mesure de la surface occupée par la figure à plat. C''est la définition exacte : l''aire mesure la surface
    occupée par une figure à plat.'
- id: nblm-comment-determine-t-on-l-aire-d-une-figu-2
  type: choix
  difficulte: 2
  enonce: Comment détermine-t-on l'aire d'une figure dessinée sur un quadrillage au CM1 ?
  reponse:
    options:
    - id: o1
      texte: En comptant le nombre de carreaux (et demi-carreaux) qui recouvrent la surface.
    - id: o2
      texte: En multipliant toujours la longueur par la largeur.
    - id: o3
      texte: En mesurant le contour de la figure avec une règle graduée.
    - id: o4
      texte: En comptant le nombre de sommets de la figure.
    bonnes:
    - o1
  indices:
    relance: Utilise l'unité donnée par les cases de la feuille.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Au CM1, on ne retient pas de formule par cœur, on s'appuie sur le comptage des carreaux.
  - si:
      contient:
      - o3
    relance: Mesurer le contour permet d'obtenir le périmètre, pas l'aire.
  - si:
      contient:
      - o4
    relance: Les sommets sont les coins de la figure, ils ne donnent pas la surface.
  solution: En comptant le nombre de carreaux (et demi-carreaux) qui recouvrent la surface. Au CM1, la mesure de l'aire s'effectue
    en comptant l'unité de quadrillage (carreaux et demi-carreaux).
- id: nblm-qu-est-ce-qu-un-centimetre-carre-cm2-3
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qu'un centimètre carré (cm²) ?
  reponse:
    options:
    - id: o1
      texte: L'aire d'un carré de 1 cm de côté.
    - id: o2
      texte: Un segment qui mesure 1 cm de longueur.
    - id: o3
      texte: Un carré dont le périmètre mesure 1 cm.
    - id: o4
      texte: Un outil en plastique pour mesurer les angles droits.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la forme et aux dimensions du carré étalon.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le centimètre mesure une longueur, tandis que le centimètre carré mesure une surface.
  - si:
      contient:
      - o3
    relance: Un carré de 1 cm de côté a un périmètre de 4 cm (4 × 1 cm).
  - si:
      contient:
      - o4
    relance: L'outil pour mesurer les angles droits est l'équerre, pas le centimètre carré.
  solution: L'aire d'un carré de 1 cm de côté. Il s'agit de la définition officielle du centimètre carré, unité usuelle d'aire.
- id: nblm-si-la-figure-a-recouvre-12-carreaux-et-l-4
  type: choix
  difficulte: 2
  enonce: Si la figure A recouvre 12 carreaux et la figure B recouvre 8 carreaux, que peut-on affirmer ?
  reponse:
    options:
    - id: o1
      texte: L'aire de la figure A est plus grand que l'aire de la figure B.
    - id: o2
      texte: L'aire de la figure B est plus grande que celle de la figure A.
    - id: o3
      texte: Les deux figures ont obligatoirement le même périmètre.
    - id: o4
      texte: Il est impossible de comparer leurs aires sans formule.
    bonnes:
    - o1
  indices:
    relance: Compare simplement le nombre de carreaux recouverts par chaque forme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 8 carreaux étant inférieur à 12 carreaux, la figure B a une aire plus petite.
  - si:
      contient:
      - o3
    relance: L'aire et le périmètre sont deux grandeurs différentes ; le nombre de carreaux n'impose pas le même périmètre.
  - si:
      contient:
      - o4
    relance: Le comptage du nombre de carreaux d'unité permet une comparaison directe des aires.
  solution: L'aire de la figure A est plus grand que l'aire de la figure B. Puisque 12 carreaux est supérieur à 8 carreaux,
    la figure A a une aire plus grande que B.
- id: nblm-sur-quoi-s-appuie-t-on-au-cm1-pour-deter-5
  type: choix
  difficulte: 2
  enonce: Sur quoi s'appuie-t-on au CM1 pour déterminer la mesure d'une aire sans appliquer de formule ?
  reponse:
    options:
    - id: o1
      texte: Sur des pavages ou des quadrillages.
    - id: o2
      texte: Sur l'utilisation d'une calculatrice.
    - id: o3
      texte: Sur la mesure des angles avec un rapporteur.
    - id: o4
      texte: Sur la pesée de la figure avec une balance.
    bonnes:
    - o1
  indices:
    relance: Pense au recouvrement de la surface par un motif régulier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Les élèves n'utilisent pas de calculatrice au quotidien en CM1.
  - si:
      contient:
      - o3
    relance: Le rapporteur n'est pas utilisé au CM1 et les angles ne mesurent pas une surface.
  - si:
      contient:
      - o4
    relance: La balance sert à mesurer des masses, pas des aires géométriques.
  solution: Sur des pavages ou des quadrillages. Le programme du CM1 privilégie l'acquisition du sens de la mesure à l'aide
    de pavages.
- id: nblm-quelles-sont-les-deux-methodes-permettan-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX méthodes permettant de comparer l'aire de deux surfaces sans effectuer de mesure ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: En les superposant directement l'une sur l'autre.
    - id: o2
      texte: En découpant et en recollant les morceaux d'une surface.
    - id: o3
      texte: En mesurant le contour de chaque figure à la règle.
    - id: o4
      texte: En comptant le nombre de côtés de chaque polygone.
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche deux techniques de manipulation directe des formes en papier.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Mesurer le contour donne le périmètre et non l'aire.
  - si:
      contient:
      - o4
    relance: Le nombre de côtés n'indique pas la grandeur de la surface occupée.
  solution: En les superposant directement l'une sur l'autre ; En découpant et en recollant les morceaux d'une surface. La
    superposition permet de vérifier visuellement si une surface déborde de l'autre.
- id: nblm-quelle-est-l-unite-d-aire-representee-pa-7
  type: texte_court
  difficulte: 1
  enonce: Quelle est l'unité d'aire représentée par la surface d'un carré de 1 cm de côté ?
  reponse:
    acceptees:
    - centimètre carré
    fautes_tolerees: 1
  indices:
    relance: Écris le nom complet de cette unité de surface (deux mots).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: centimètre carré. Le centimètre carré est l'unité usuelle représentant la surface d'un carré de 1 cm de côté.
- id: nblm-comment-appelle-t-on-la-mesure-de-la-sur-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la mesure de la surface occupée par une figure à plat ?
  reponse:
    acceptees:
    - aire
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'un mot court de 4 lettres désignant la grandeur mesurée.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: aire. L'aire désigne exactement la mesure de la surface occupée par une figure.
