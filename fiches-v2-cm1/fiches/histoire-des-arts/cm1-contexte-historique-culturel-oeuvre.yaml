# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-contexte-historique-culturel-oeuvre
version: 3
etat: verifiee
declencheurs:
- à quelle époque a été fait ce tableau
- relier une œuvre à l'histoire
- illustrations d'un même conte
- objet ancien à quoi il servait
- musée imaginaire d'une époque
- mode de vie d'autrefois dans une œuvre
- conte devenu dessin animé
- vieux meuble d'un château
prerequis: []
essentiel: 'Une œuvre d''art ne naît pas toute seule. Elle a été créée à une époque, dans un lieu, par des personnes qui vivaient
  d''une certaine façon. C''est son contexte historique et culturel.


  On peut relier une œuvre à ce qu''on apprend en classe : un fait historique ou une époque (en histoire), une aire géographique,
  c''est-à-dire une région du monde (en géographie), ou un texte (en français). Par exemple, un tableau de bataille peut être
  relié à une bataille étudiée en histoire.


  Attention à ne pas confondre deux époques : celle où l''œuvre a été fabriquée et celle de l''histoire qu''elle raconte.
  Un tableau peint en 1850 peut très bien montrer une scène de l''Antiquité.


  Un texte connu (un récit, une fable, une poésie, un texte religieux ou mythologique) a souvent été transposé. Transposer,
  c''est raconter la même histoire sous une autre forme : des images (transposition visuelle), une musique, une pièce de théâtre
  (scénique), une danse (chorégraphique) ou un film (filmique). Le conte du Petit Chaperon rouge a été illustré par de nombreux
  artistes. En comparant leurs images, on voit ce que chacun a choisi de montrer.


  Les objets mobiliers (meubles, vaisselle, armures) racontent les usages et les modes de vie. On se demande à quoi servait
  l''objet, qui l''utilisait et comment on vivait alors. Une armure montre comment les chevaliers se protégeaient au combat.


  En classe, on peut rassembler des œuvres d''une même époque dans un « musée imaginaire ».

  '
methode:
- Repérer, si elle est connue, la date ou l'époque de création de l'œuvre.
- Ne pas la confondre avec l'époque de l'histoire que l'œuvre raconte.
- 'Chercher un lien avec ce qui est étudié en classe : un fait, une époque, une région du monde, un texte.'
- Pour un texte connu, comparer plusieurs de ses illustrations ou transpositions.
- Pour un objet, se demander à quoi il servait et qui l'utilisait.
- Expliquer en une phrase ce que ce contexte aide à comprendre dans l'œuvre.
vocabulaire:
- terme: contexte historique et culturel
  definition: l'époque, le lieu et les événements liés à la création d'une œuvre
- terme: usage
  definition: la façon dont un objet ou une œuvre était utilisé à son époque
- terme: époque
  definition: une période du passé, comme l'Antiquité ou le Moyen Âge
- terme: aire géographique
  definition: une région du monde où une œuvre a été créée
- terme: transposition
  definition: une même histoire racontée sous une autre forme (image, musique, scène, danse, film)
- terme: objet mobilier
  definition: un objet que l'on peut déplacer, comme un meuble, de la vaisselle ou une armure
- terme: musée imaginaire
  definition: un ensemble d'œuvres rassemblées par la classe, en images, autour d'une époque ou d'un thème
erreurs_frequentes:
- Décrire une œuvre sans jamais se demander à quelle époque ou dans quel lieu elle a été créée.
- Confondre l'époque de l'histoire racontée par l'œuvre et l'époque où l'œuvre a été fabriquée.
- Ne pas relier un objet mobilier ancien à l'usage qu'on en faisait réellement.
- 'Croire qu''un texte n''a qu''une seule image possible : chaque artiste le transpose à sa façon.'
- Juger un objet ancien avec nos habitudes d'aujourd'hui, sans se demander comment on vivait alors.
exemple:
  enonce: Tu observes plusieurs illustrations différentes du conte du Petit Chaperon rouge, réalisées à des époques différentes.
    Que peux-tu en faire ?
  solution: Tu peux mettre en relation ces illustrations avec le texte connu qu'elles transposent, le conte. Puis tu compares.
    Tu remarques comment chaque artiste a représenté différemment le loup, la forêt ou les vêtements. Tu peux aussi chercher
    à quelle époque chaque image a été faite.
exercices:
- id: epoque-oeuvre-ou-histoire
  type: choix
  difficulte: 1
  enonce: Un tableau peint en 1850 représente une bataille de l'Antiquité. Quelle est l'époque de création de ce tableau ?
  reponse:
    options:
    - id: a
      texte: '1850'
    - id: b
      texte: l'Antiquité
    - id: c
      texte: on ne peut pas savoir
    bonnes:
    - a
  indices:
    relance: 'Il y a deux époques dans cette question : celle où le tableau a été peint, et celle qu''il représente.'
    methode: L'énoncé donne directement une date pour la peinture du tableau. Cherche cette date.
    etape: Le tableau raconte une bataille ancienne, mais quand a-t-il été peint ?
  pieges:
  - si:
      contient:
      - b
    relance: L'Antiquité est l'époque de l'histoire racontée dans le tableau, pas l'époque où le tableau a été peint.
  - si:
      contient:
      - c
    relance: L'énoncé donne bien une date de création du tableau. Relis-le.
  solution: Le tableau a été créé en 1850, même s'il représente une bataille de l'Antiquité.
- id: mot-usage
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la façon dont un objet ancien était utilisé à son époque ?
  reponse:
    acceptees:
    - usage
    fautes_tolerees: 1
  indices:
    relance: Relis le vocabulaire de la fiche. Un mot dit comment on se servait d'un objet.
    methode: Cherche le nom qui désigne la manière dont on employait un objet autrefois.
    etape: C'est un nom de la même famille que « un usager », la personne qui utilise un service.
  pieges:
  - si:
      valeur: époque
    relance: L'époque, c'est le moment où l'objet a été fabriqué. Cherche le mot qui désigne comment on l'utilisait.
  solution: 'Le mot est « usage » : il désigne la façon dont un objet ou une œuvre était utilisé à son époque.'
- id: objet-ancien-usage
  type: choix
  difficulte: 2
  enonce: Une armure de chevalier retrouvée dans un château servait à quoi, à son époque ?
  reponse:
    options:
    - id: a
      texte: Protéger le corps du chevalier pendant un combat
    - id: b
      texte: Décorer la table du repas
    - id: c
      texte: Servir d'instrument de musique
    bonnes:
    - a
  indices:
    relance: 'Pense au mode de vie d''un chevalier au Moyen Âge : à quoi lui servait ce vêtement de métal ?'
    methode: Relie l'objet à ce que tu sais déjà de cette époque en histoire.
    etape: 'Une armure recouvre tout le corps : à quoi cela peut-il servir dans un combat ?'
  pieges:
  - si:
      contient:
      - b
    relance: 'Une armure n''est pas un objet de décoration de table : pense à sa forme, qui recouvre tout le corps.'
  - si:
      contient:
      - c
    relance: 'Une armure ne produit aucun son : pense plutôt à sa fonction pendant un combat.'
  solution: L'armure servait à protéger le corps du chevalier pendant un combat, à son époque.
- id: mot-transposition
  type: texte_court
  difficulte: 2
  enonce: Une fable connue devient une pièce de théâtre, puis un dessin animé. Quel nom donne-t-on au fait de raconter la
    même histoire sous une autre forme ?
  reponse:
    acceptees:
    - transposition
    - transpositions
    - une transposition
    fautes_tolerees: 1
  indices:
    relance: Relis l'essentiel. Un verbe dit ce qu'on fait quand on raconte la même histoire sous une autre forme.
    methode: Transforme ce verbe en nom.
    etape: « Décorer » donne « décoration », « créer » donne « création ». Fais pareil avec le verbe de l'essentiel.
  pieges:
  - si:
      valeur: illustration
    relance: Une illustration, c'est seulement une image. Ici, l'histoire devient aussi du théâtre et un film. Cherche le
      mot plus général.
  solution: 'C''est une transposition : la même histoire est racontée sous une autre forme (scène, film, image, musique, danse).'
- id: illustrations-meme-texte
  type: association
  difficulte: 2
  enonce: Relie chaque type de lien avec un exemple.
  reponse:
    gauche:
    - id: a
      texte: œuvre reliée à un fait historique
    - id: b
      texte: texte connu relié à ses illustrations
    - id: c
      texte: objet mobilier relié à un usage
    droite:
    - id: x
      texte: une armure reliée à son rôle de protection au combat
    - id: y
      texte: plusieurs images différentes du Petit Chaperon rouge
    - id: z
      texte: un tableau relié à une bataille étudiée en histoire
    paires:
      a: z
      b: y
      c: x
  indices:
    relance: 'Commence par l''exemple le plus clair : l''armure est un objet, à quel type de lien correspond-elle ?'
    methode: Pour chaque exemple, demande-toi s'il relie une œuvre à l'histoire, un texte à ses images, ou un objet à son
      usage.
    etape: Les images du Petit Chaperon rouge illustrent toutes le même texte connu.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre un fait historique et un texte connu.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque exemple : relie-t-il une œuvre à l''histoire, un texte à ses images, ou un objet à son usage
      ?'
  solution: L'armure est reliée à son usage de protection ; les images du Petit Chaperon rouge illustrent un même texte connu
    ; le tableau de bataille est relié à un fait historique.
- id: types-de-transposition
  type: association
  difficulte: 3
  enonce: Imagine quatre façons de transposer le conte du Petit Chaperon rouge. Relie chaque œuvre au type de transposition.
  reponse:
    gauche:
    - id: a
      texte: un album avec des dessins
    - id: b
      texte: une pièce jouée par des acteurs
    - id: c
      texte: un ballet où des danseurs racontent le conte
    - id: d
      texte: un dessin animé au cinéma
    droite:
    - id: w
      texte: transposition visuelle
    - id: x
      texte: transposition scénique
    - id: y
      texte: transposition chorégraphique
    - id: z
      texte: transposition filmique
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: 'Commence par le plus facile : quel mot ressemble à « film » ?'
    methode: 'Cherche dans chaque mot de droite un indice : la vue, la scène du théâtre, la danse, le film.'
    etape: Les acteurs d'une pièce jouent sur une scène. Quel mot de droite contient ce mot ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au mot qui désigne la danse.
  - si:
      diagnostic: associations_fausses
    relance: Prends chaque œuvre de gauche et demande-toi si on la regarde en dessin, au théâtre, en danse ou au cinéma.
  solution: L'album dessiné est une transposition visuelle ; la pièce jouée par des acteurs est scénique ; le ballet est chorégraphique
    (la chorégraphie, c'est l'art de la danse) ; le dessin animé est filmique.
- id: etapes-contexte-oeuvre
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre ces étapes pour relier une œuvre à son contexte historique.
  reponse:
    elements:
    - id: date
      texte: Repérer la date ou l'époque de création de l'œuvre
    - id: lien
      texte: Chercher un lien avec un fait ou un texte étudié en classe
    - id: comparer
      texte: Comparer, si possible, plusieurs œuvres de la même époque
    - id: expliquer
      texte: Expliquer ce que ce contexte apporte à la compréhension
  indices:
    relance: Que dois-tu chercher en premier, avant même de comparer plusieurs œuvres ?
    methode: La première étape cherche une date, la dernière explique l'apport du contexte.
    etape: Après avoir trouvé un lien avec un fait étudié, compares-tu plusieurs œuvres ou expliques-tu déjà ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle vient en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape sur la date et celle sur l'explication finale, puis range les deux autres.
  solution: On repère d'abord la date ou l'époque, puis on cherche un lien avec un fait ou un texte étudié, puis on compare
    plusieurs œuvres si possible, et enfin on explique l'apport du contexte.
- id: objet-histoire-explique
  type: ouverte
  difficulte: 3
  enonce: Choisis un objet ancien que tu as étudié en histoire (une armure, un objet de l'époque de Louis XIV) et explique
    en deux ou trois phrases à quel usage et à quel mode de vie il correspondait.
  criteres:
  - L'élève relie correctement l'objet choisi à son usage réel.
  - L'élève relie l'objet à l'époque ou au mode de vie étudiés en classe.
  - L'élève dit qui utilisait cet objet (un chevalier, un roi, une famille...).
  indices:
    relance: Pense à qui utilisait cet objet et pourquoi.
    methode: Relie l'objet à ce que tu sais déjà de cette époque en histoire.
    etape: Commence par nommer l'objet, puis explique à quoi il servait à son époque.
  solution: 'Exemple réussi : « Cette armure servait à protéger un chevalier pendant un combat au Moyen Âge. Elle montre que
    les chevaliers de cette époque se battaient avec des armes lourdes qui nécessitaient une forte protection. »'
- id: nblm-que-signifie-relier-une-uvre-d-art-a-son-1
  type: choix
  difficulte: 2
  enonce: Que signifie relier une œuvre d'art à son contexte historique et culturel ?
  reponse:
    options:
    - id: o1
      texte: La mettre en relation avec l'époque, le lieu et les événements où elle a été créée.
    - id: o2
      texte: Observer uniquement la matière utilisée pour fabriquer l'œuvre sans s'intéresser à sa date.
    - id: o3
      texte: Dire si on aime ou si on n'aime pas l'œuvre en exprimant ses émotions.
    - id: o4
      texte: Compter le nombre de formes géométriques présentes dans la composition.
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments extérieurs qui entourent la fabrication de l'œuvre dans le temps et l'espace.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : ceci concerne les caractéristiques techniques de l''œuvre, pas son contexte historique.'
  - si:
      contient:
      - o3
    relance: 'Erreur : ceci correspond à donner un avis argumenté, pas à analyser le contexte historique.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ceci concerne l''analyse formelle et visuelle, pas le contexte historique et culturel.'
  solution: 'La mettre en relation avec l''époque, le lieu et les événements où elle a été créée. C''est la définition exacte
    : le contexte regroupe l''époque, le lieu et les événements liés à la création de l''œuvre.'
- id: nblm-quand-on-cherche-a-savoir-a-quelle-epoqu-2
  type: choix
  difficulte: 2
  enonce: Quand on cherche à savoir à quelle époque a été fait un tableau, quelle erreur fréquente faut-il éviter ?
  reponse:
    options:
    - id: o1
      texte: Confondre l'époque de l'histoire racontée par l'œuvre et l'époque où l'œuvre a été fabriquée.
    - id: o2
      texte: Chercher la date de création du tableau dans un document d'information.
    - id: o3
      texte: Comparer le tableau avec d'autres œuvres faites à la même période.
    - id: o4
      texte: Se renseigner sur le lieu où le tableau a été réalisé.
    bonnes:
    - o1
  indices:
    relance: Attention à bien faire la différence entre l'histoire représentée et le moment où l'artiste a créé le tableau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : chercher la date exacte de création est au contraire la bonne méthode pour situer l''œuvre.'
  - si:
      contient:
      - o3
    relance: 'Erreur : comparer des œuvres d''une même époque est une méthode recommandée par la fiche.'
  - si:
      contient:
      - o4
    relance: 'Erreur : identifier le lieu de création permet d''enrichir l''analyse du contexte.'
  solution: 'Confondre l''époque de l''histoire racontée par l''œuvre et l''époque où l''œuvre a été fabriquée. C''est l''erreur
    classique : un artiste peut peindre une scène de la Préhistoire, mais son tableau a été fabriqué à une époque bien plus
    récente.'
- id: nblm-si-tu-compares-plusieurs-illustrations-r-3
  type: choix
  difficulte: 2
  enonce: Si tu compares plusieurs illustrations réalisées à des époques différentes pour un même conte (comme Le Petit Chaperon
    rouge), que peux-tu remarquer ?
  reponse:
    options:
    - id: o1
      texte: Que chaque époque représente différemment les personnages, la forêt ou les vêtements selon son propre contexte.
    - id: o2
      texte: Que toutes les illustrations sont strictement identiques car elles racontent le même texte.
    - id: o3
      texte: Que le texte écrit du conte change totalement à chaque nouvelle illustration.
    - id: o4
      texte: Qu'il est interdit d'illustrer un texte ancien plus d'une seule fois.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'influence du temps où vit l'illustrateur sur les détails de ses dessins.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : les artistes de chaque époque apportent la vision, le style et les objets de leur propre temps.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le texte d''origine reste le même, ce sont ses transpositions visuelles qui diffèrent.'
  - si:
      contient:
      - o4
    relance: 'Erreur : un même récit peut être illustré et transposé à de nombreuses époques successives.'
  solution: 'Que chaque époque représente différemment les personnages, la forêt ou les vêtements selon son propre contexte.
    Exact : la façon d''illustrer les vêtements ou le loup évolue selon l''époque à laquelle l''image a été créée.'
- id: nblm-lorsqu-on-etudie-un-objet-ancien-dans-un-4
  type: choix
  difficulte: 2
  enonce: Lorsqu'on étudie un objet ancien dans un musée imaginaire ou réel, quelle question fondamentale doit-on se poser
    ?
  reponse:
    options:
    - id: o1
      texte: À quoi servait cet objet et comment vivait-on à son époque ?
    - id: o2
      texte: Combien d'argent cet objet coûte-t-il aujourd'hui ?
    - id: o3
      texte: Pourquoi la personne qui l'a fabriqué n'a pas utilisé de matière plastique ?
    - id: o4
      texte: Si l'on peut ramener cet objet chez soi après la visite.
    bonnes:
    - o1
  indices:
    relance: Pense au lien entre la fonction d'un objet et le quotidien des personnes autrefois.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : la valeur financière actuelle ne donne pas d''information sur le contexte culturel d''origine de l''objet.'
  - si:
      contient:
      - o3
    relance: 'Erreur anachronique : il faut comprendre les matériaux utilisés à l''époque sans juger avec des critères modernes.'
  - si:
      contient:
      - o4
    relance: 'Erreur : un objet ancien fait partie du patrimoine à protéger et ne peut pas être emporté.'
  solution: 'À quoi servait cet objet et comment vivait-on à son époque ?. C''est la bonne démarche : il faut relier l''objet
    mobilier à son usage réel et au mode de vie d''autrefois.'
- id: nblm-comment-une-uvre-d-art-nous-renseigne-t-5
  type: choix
  difficulte: 2
  enonce: Comment une œuvre d'art nous renseigne-t-elle sur le mode de vie d'autrefois ?
  reponse:
    options:
    - id: o1
      texte: En montrant des faits, des vêtements, des objets ou des habitudes d'une époque déjà étudiés en classe.
    - id: o2
      texte: En prédisant l'avenir des élèves qui observent le tableau.
    - id: o3
      texte: En indiquant le prix de vente exact des meubles représentés dans la pièce.
    - id: o4
      texte: En remplaçant totalement les cours d'histoire et de géographie.
    bonnes:
    - o1
  indices:
    relance: Recherche les éléments du quotidien figurant dans les représentations du passé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : une œuvre témoigne du passé et de son contexte de création, elle ne prédit pas le futur.'
  - si:
      contient:
      - o3
    relance: 'Erreur : l''observation historique porte sur les usages et le mode de vie, pas sur des tarifs.'
  - si:
      contient:
      - o4
    relance: 'Erreur : l''œuvre d''art enrichit la compréhension de l''histoire, mais elle ne remplace pas les cours.'
  solution: 'En montrant des faits, des vêtements, des objets ou des habitudes d''une époque déjà étudiés en classe. Exact
    : l''œuvre témoigne de la façon dont les personnes s''habillaient, vivaient ou agissaient à leur époque.'
- id: nblm-quels-sont-les-deux-elements-qu-il-est-p-6
  type: choix
  difficulte: 3
  enonce: Quels sont les DEUX éléments qu'il est pertinent de mettre en relation pour comprendre le contexte d'une œuvre ?
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Un fait historique ou une époque étudiés en histoire ou en géographie.
    - id: o2
      texte: Un texte connu (récit, fable, poésie) avec ses illustrations ou transpositions visuelles.
    - id: o3
      texte: La couleur du mur du musée contemporain où l'œuvre est accrochée.
    - id: o4
      texte: Le goût personnel d'un camarade de classe pour la couleur choisie.
    bonnes:
    - o1
    - o2
  indices:
