format: 2
notion: cm1-caracteristiques-techniques-formelles-oeuvre
version: 2
etat: verifiee
declencheurs:
- comment c'est fait ce tableau
- les matériaux d'une sculpture
- formes géométriques d'un tapis
- façade avec des motifs répétés
- décrire comment une œuvre est faite
- de quels matériaux sonores est fait ce morceau
- de quoi est faite cette statue
- motifs qui se répètent au sol
prerequis: []
essentiel: 'Pour comprendre une œuvre, on ne regarde pas seulement ce qu''elle représente. On observe aussi comment elle est
  faite et comment elle est organisée : ce sont ses caractéristiques techniques et formelles.


  Les caractéristiques techniques, c''est la matière et la fabrication. On identifie d''abord les matériaux : de la peinture,
  de la pierre, du bois, des fils de laine. En musique, les matériaux sont sonores : la voix, le son d''un violon, d''une
  flûte ou d''un tambour. Puis on cherche comment l''artiste leur a donné forme : il a taillé la pierre, peint sur une toile,
  tissé des fils, joué des notes.


  Les caractéristiques formelles, c''est l''organisation de ce qu''on voit. On cherche des formes géométriques : carrés, rectangles,
  triangles, cercles, lignes droites. Puis on regarde leur agencement, c''est-à-dire la façon dont elles sont placées les
  unes par rapport aux autres : répétées, alignées, symétriques.


  On trouve ces formes partout. Ce sont les fenêtres alignées d''une façade, les dalles d''un pavement, les motifs d''un tapis,
  les lignes d''un tableau. Dans ta cuisine, le carrelage montre souvent des carrés qui se répètent en lignes et en colonnes.


  Enfin, on dégage des éléments de sens. On se demande ce que ces choix font comprendre ou ressentir. Des formes très régulières
  peuvent donner une impression d''ordre et de calme. Une matière dure comme la pierre peut donner une impression de solidité.

  '
methode:
- 'Nommer le type d''œuvre : tableau, sculpture, façade, pavement, tapis ou morceau de musique.'
- Identifier le ou les matériaux utilisés (peinture, pierre, bois, fils, sons).
- Dire comment l'artiste a donné forme à ce matériau (peint, taillé, tissé, joué).
- Repérer les formes géométriques, puis décrire leur agencement (répétition, alignement, symétrie).
- Dire ce que ces choix font comprendre ou ressentir à celui qui regarde ou écoute.
vocabulaire:
- terme: caractéristique technique
  definition: ce qui concerne la matière et la façon dont l'œuvre a été fabriquée
- terme: caractéristique formelle
  definition: 'ce qui concerne l''organisation visuelle : formes, lignes, agencement'
- terme: matériau
  definition: la matière avec laquelle l'œuvre est faite, ou les sons pour une musique
- terme: forme géométrique
  definition: une forme simple comme le carré, le rectangle, le triangle ou le cercle
- terme: agencement
  definition: la façon dont les formes sont placées les unes par rapport aux autres
- terme: pavement
  definition: un sol fait de dalles ou de carreaux assemblés
erreurs_frequentes:
- Décrire seulement le sujet de l'œuvre (« c'est un chat ») sans observer sa fabrication.
- Ne pas remarquer les formes géométriques qui organisent une façade ou un tapis.
- Confondre le matériau (la matière utilisée) avec le sujet représenté.
- 'Oublier qu''un morceau de musique a aussi des matériaux : les voix et les sons des instruments.'
- Nommer les formes sans dire comment elles sont agencées entre elles.
exemple:
  enonce: Tu observes un tapis avec des motifs répétés en carrés et en triangles de couleurs différentes. Que peux-tu dire
    de ses caractéristiques techniques et formelles ?
  solution: 'Technique : le tapis est fait de fils tissés. Formelle : il est organisé à partir de formes géométriques simples
    (carrés, triangles) qui se répètent selon un agencement régulier, et les couleurs soulignent cette organisation. Sens
    : cette régularité donne une impression d''ordre.'
exercices:
- id: materiau-ou-sujet
  type: choix
  difficulte: 1
  enonce: Une sculpture est faite en bois et représente un cheval. Quel mot désigne le bois ?
  reponse:
    options:
    - id: a
      texte: le matériau
    - id: b
      texte: le sujet
    - id: c
      texte: l'éclairage
    bonnes:
    - a
  indices:
    relance: Ce mot désigne ce dont l'œuvre est faite matériellement, pas ce qu'elle représente.
    methode: Le sujet, c'est ce qui est représenté (ici, le cheval). Cherche l'autre mot.
    etape: Le bois est la matière utilisée pour fabriquer la sculpture.
  pieges:
  - si:
      contient:
      - b
    relance: Le sujet, c'est ce que la sculpture représente (le cheval), pas la matière dont elle est faite.
  - si:
      contient:
      - c
    relance: L'éclairage concerne la lumière, pas la matière de la sculpture.
  solution: Le bois est le matériau, c'est-à-dire la matière avec laquelle la sculpture a été fabriquée.
- id: mot-organisation-visuelle
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne l'organisation visuelle d'une œuvre (formes, lignes, agencement) ?
  reponse:
    acceptees:
    - formelle
    - formel
    fautes_tolerees: 1
  indices:
    relance: Ce mot vient de « forme ».
    methode: Cherche l'adjectif qui qualifie ce qui concerne les formes, les lignes et leur agencement.
    etape: Le mot commence par « form- ».
  pieges:
  - si:
      valeur: technique
    relance: Ce mot concerne la matière et la fabrication, pas l'organisation des formes et des lignes.
  solution: 'Le mot est « formelle » : la caractéristique formelle désigne l''organisation visuelle d''une œuvre.'
- id: former-geometrique-facade
  type: choix
  difficulte: 2
  enonce: Une façade est décorée de fenêtres rondes alignées régulièrement. Quelle forme géométrique reconnais-tu ?
  reponse:
    options:
    - id: a
      texte: le cercle
    - id: b
      texte: le triangle
    - id: c
      texte: le carré
    bonnes:
    - a
  indices:
    relance: Pense à la forme d'une roue de vélo ou d'une assiette.
    methode: Pense à la forme d'une fenêtre ronde, pas à celle d'un toit ou d'une porte.
    etape: Élimine les formes à angles droits ou à trois côtés.
  pieges:
  - si:
      contient:
      - b
    relance: Le triangle a trois côtés droits, ce n'est pas la forme d'une fenêtre ronde.
  - si:
      contient:
      - c
    relance: Le carré a quatre côtés droits, ce n'est pas la forme d'une fenêtre ronde.
  solution: Une fenêtre ronde a la forme d'un cercle.
- id: matiere-son
  type: association
  difficulte: 2
  enonce: Relie chaque œuvre à son matériau principal.
  reponse:
    gauche:
    - id: a
      texte: une sculpture en pierre
    - id: b
      texte: un tableau à l'huile
    - id: c
      texte: un morceau de musique joué au violon
    droite:
    - id: x
      texte: la peinture
    - id: y
      texte: la pierre
    - id: z
      texte: le son des cordes frottées
    paires:
      a: y
      b: x
      c: z
  indices:
    relance: 'Commence par la sculpture : quel matériau la compose ?'
    methode: Pour la musique, pense à ce qui produit le son sur un violon.
    etape: Le violon produit un son grâce à ses cordes frottées par un archet.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au matériau qui produit le son du violon.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque œuvre : de quoi est-elle faite matériellement ?'
  solution: La sculpture est faite de pierre, le tableau est fait de peinture, le morceau de violon est fait du son des cordes
    frottées.
- id: materiaux-sonores
  type: choix
  difficulte: 2
  enonce: Coche tous les matériaux sonores, c'est-à-dire les matériaux d'un morceau de musique.
  reponse:
    options:
    - id: a
      texte: la voix d'un chanteur
    - id: b
      texte: le son d'une flûte
    - id: c
      texte: la pierre d'une statue
    - id: d
      texte: la toile d'un tableau
    bonnes:
    - a
    - b
  indices:
    relance: Un matériau sonore, on ne le touche pas, on l'entend. Lesquels s'écoutent avec les oreilles ?
    methode: Pour chaque proposition, demande-toi si on la regarde ou si on l'écoute.
    etape: La pierre et la toile se voient et se touchent. Que reste-t-il ?
  pieges:
  - si:
      contient:
      - c
    relance: La pierre est le matériau d'une sculpture. On la voit, on ne l'entend pas.
  - si:
      contient:
      - d
    relance: La toile est le support d'un tableau. Est-ce qu'elle fait de la musique ?
  - si:
      diagnostic: incomplet
    relance: Il y a plus d'une bonne réponse. Cherche tout ce qui s'écoute.
  solution: 'Les matériaux sonores sont la voix du chanteur et le son de la flûte : ils s''entendent. La pierre et la toile
    sont des matériaux d''œuvres que l''on regarde.'
- id: agencement-pavement
  type: choix
  difficulte: 2
  enonce: Un pavement est fait de carreaux carrés noirs et blancs qui alternent comme sur un jeu de dames. Comment sont agencés
    ces carreaux ?
  reponse:
    options:
    - id: a
      texte: ils se répètent de façon régulière
    - id: b
      texte: ils sont posés au hasard
    - id: c
      texte: il n'y a qu'un seul carreau
    bonnes:
    - a
  indices:
    relance: Sur un jeu de dames, peux-tu deviner la couleur de la case suivante ?
    methode: 'Regarde si un même motif revient toujours de la même façon : noir, blanc, noir, blanc.'
    etape: Si tu peux prévoir où sera le prochain carreau noir, l'agencement n'est pas dû au hasard.
  pieges:
  - si:
      contient:
      - b
    relance: Au hasard, on ne pourrait pas prévoir la case suivante. Est-ce le cas sur un jeu de dames ?
  - si:
      contient:
      - c
    relance: L'énoncé parle de carreaux, au pluriel. Relis-le.
  solution: 'Les carreaux se répètent de façon régulière : noir, blanc, noir, blanc, en lignes et en colonnes. C''est un agencement
    régulier.'
- id: etapes-analyse-forme
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre ces étapes pour dégager les caractéristiques d'une œuvre.
  reponse:
    elements:
    - id: materiau
      texte: Identifier de quoi l'œuvre est matériellement faite
    - id: formes
      texte: Repérer les formes visibles et leur agencement
    - id: decrire
      texte: Décrire cette organisation avec un vocabulaire précis
    - id: sens
      texte: Relier l'observation à un sens possible de l'artiste
  indices:
    relance: Que dois-tu observer avant même de chercher les formes géométriques ?
    methode: La première étape regarde la matière, la dernière cherche le sens.
    etape: Après avoir repéré les formes, décris-tu leur agencement ou cherches-tu déjà le sens ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle vient en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape sur le matériau et celle sur le sens, puis range les deux autres entre elles.
  solution: On identifie d'abord le matériau, puis on repère les formes et leur agencement, puis on décrit cette organisation,
    et enfin on relie l'observation à un sens possible.
- id: element-de-sens-facade
  type: choix
  difficulte: 3
  enonce: Une façade a des fenêtres toutes identiques, bien alignées, placées de la même façon à gauche et à droite de la
    porte. Quel élément de sens peut-on en dégager ?
  reponse:
    options:
    - id: a
      texte: une impression d'ordre et de calme
    - id: b
      texte: une impression de désordre et d'agitation
    - id: c
      texte: la façade est construite en bois
    bonnes:
    - a
  indices:
    relance: Quand tout est rangé et bien aligné dans ta chambre, quelle impression cela te donne-t-il ?
    methode: Un élément de sens, c'est ce que l'organisation fait ressentir, pas la matière de l'œuvre.
    etape: Les fenêtres sont identiques, alignées et symétriques. Est-ce plutôt rangé ou plutôt mélangé ?
  pieges:
  - si:
      contient:
      - b
    relance: Le désordre, ce serait des fenêtres de toutes les tailles placées n'importe où. Est-ce le cas ici ?
  - si:
      contient:
      - c
    relance: Le bois, c'est le matériau, une caractéristique technique. On te demande ce que l'organisation fait ressentir.
  solution: 'Des fenêtres identiques, alignées et symétriques donnent une impression d''ordre et de calme : c''est l''élément
    de sens que l''on peut dégager de cette organisation.'
- id: observer-formes-objet
  type: ouverte
  difficulte: 3
  enonce: Observe un objet ou une image chez toi (un tissu, un carrelage, une façade, un tableau) et note trois formes géométriques
    que tu y retrouves, en expliquant comment elles sont agencées et ce que cela te fait ressentir.
  criteres:
  - Trois formes géométriques différentes sont identifiées.
  - Leur agencement (répétition, alignement, symétrie) est décrit.
  - Une impression ou un élément de sens est relié à cette organisation.
  indices:
    relance: Cherche des lignes droites, des cercles, des triangles, des carrés.
    methode: Regarde si les formes se répètent ou s'organisent en motif, puis demande-toi quelle impression cela donne.
    etape: Note d'abord une forme, puis observe si elle se répète ailleurs sur l'objet.
  solution: 'Exemple réussi : un tissu à carreaux présente des carrés qui se répètent en lignes et en colonnes, formant un
    quadrillage régulier. Des lignes droites les séparent et un petit cercle orne chaque carré. Cette régularité donne une
    impression d''ordre.'
