format: 2
notion: cm1-reperage-musee-lieu-art
version: 3
etat: verifiee
declencheurs:
- se repérer dans un musée
- lire le plan d'un musée
- préparer une sortie au musée
- pourquoi ne pas toucher les œuvres
- métiers de la restauration
- vulnérabilité du patrimoine
- trouver la salle sur le plan
- visite de classe au château
prerequis: []
essentiel: 'Un musée, un lieu d''art ou un site patrimonial (un château, une église, un monument ancien) se visite. Pour bien
  en profiter, il faut savoir préparer la sortie et s''orienter une fois sur place.


  Avant la sortie culturelle, la classe fait une recherche ensemble. Elle suit des consignes précises données par l''enseignant
  : trouver le nom du lieu, ce qu''on peut y voir, une ou deux œuvres à ne pas manquer. On prépare aussi des questions. Ainsi,
  en arrivant, on sait déjà ce qu''on cherche.


  Sur place, on se repère grâce au plan et aux indications. Le plan est un dessin du lieu vu de dessus : il montre les salles,
  les étages, l''entrée et la sortie. Les indications, ce sont les panneaux, les flèches et les numéros des salles.


  Pour lire un plan, on cherche d''abord l''endroit où l''on se trouve, puis celui où l''on veut aller, et enfin le chemin
  entre les deux. C''est comme chercher son chemin sur le plan d''un parc ou d''une gare.


  Enfin, le patrimoine est vulnérable : il est fragile et peut s''abîmer. Le temps, les mains, les chocs peuvent l''endommager.
  C''est pour cela qu''on ne touche pas les œuvres, qu''on garde ses distances, qu''on ne court pas et qu''on respecte les
  consignes du lieu.


  Des personnes ont pour métier de protéger ce patrimoine : la conservation (le garder en bon état), la restauration (réparer
  ce qui est abîmé) et la diffusion (le faire connaître au public).

  '
methode:
- Avant la sortie, faire la recherche collective en suivant les consignes de l'enseignant.
- Noter deux ou trois questions ou œuvres à chercher une fois sur place.
- À l'arrivée, prendre le plan et repérer l'endroit où l'on se trouve.
- Suivre les panneaux, les flèches et les numéros de salles jusqu'à l'œuvre cherchée.
- 'Respecter les consignes qui protègent les œuvres : ne pas toucher, ne pas courir, garder ses distances.'
vocabulaire:
- terme: patrimoine
  definition: l'ensemble des œuvres et lieux anciens transmis et à protéger
- terme: restauration
  definition: le travail qui répare et entretient une œuvre abîmée par le temps
- terme: sortie culturelle
  definition: une visite de la classe dans un musée, un lieu d'art ou un site patrimonial
- terme: plan
  definition: un dessin du lieu vu de dessus, qui montre les salles et les chemins
- terme: indications
  definition: les panneaux, flèches et numéros qui guident le visiteur sur place
- terme: vulnérable
  definition: fragile, qui peut s'abîmer facilement
erreurs_frequentes:
- Se déplacer dans un musée sans jamais regarder le plan ou les indications fournies.
- Croire que les œuvres d'un musée ne risquent jamais de s'abîmer.
- Ne pas préparer de questions avant une sortie culturelle, et donc ne pas savoir quoi chercher sur place.
- Lire le plan sans chercher d'abord l'endroit où l'on se trouve.
- Penser que le patrimoine, ce sont seulement les tableaux, alors que les monuments et les sites anciens en font partie aussi.
exemple:
  enonce: Avant une visite de musée, la classe prépare une petite recherche pour savoir quelles salles visiter en priorité.
    Pourquoi est-ce utile ?
  solution: Cette recherche préparatoire permet de savoir à l'avance ce qu'on va chercher à observer. Une fois sur place,
    on lit le plan pour trouver rapidement les salles choisies, au lieu de marcher au hasard. On profite mieux de la visite.
exercices:
- id: preparer-ou-improviser
  type: choix
  difficulte: 1
  enonce: Avant une sortie culturelle au musée, que faut-il faire en classe ?
  reponse:
    options:
    - id: a
      texte: Effectuer une recherche collective sur la base de consignes précises
    - id: b
      texte: Ne rien préparer et improviser sur place
    - id: c
      texte: Attendre d'être dans le musée pour choisir un sujet
    bonnes:
    - a
  indices:
    relance: Une visite se prépare avant d'y aller, pas seulement une fois sur place.
    methode: Cherche la réponse qui parle d'un travail de préparation avant la sortie.
    etape: Élimine les réponses qui n'impliquent aucune préparation avant la visite.
  pieges:
  - si:
      contient:
      - b
    relance: Sans préparation, on ne sait pas quoi chercher à observer une fois sur place.
  - si:
      contient:
      - c
    relance: Le programme demande une préparation avant la visite, sur la base de consignes précises.
  solution: Avant une sortie culturelle, on effectue une recherche collective, sur la base de consignes précises, pour préparer
    la visite.
- id: mot-patrimoine
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne l'ensemble des œuvres et lieux anciens transmis et à protéger ?
  reponse:
    acceptees:
    - patrimoine
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne ce qui est transmis d'une génération à une autre et qu'il faut protéger.
    methode: Pense au mot qui regroupe les monuments, les œuvres et les sites anciens à préserver.
    etape: 'C''est un héritage commun : tout ce que les générations d''avant nous ont laissé, comme les châteaux et les tableaux.'
  pieges:
  - si:
      valeur: musée
    relance: Un musée est un lieu qui conserve des œuvres. Cherche le mot plus général qui désigne l'ensemble des œuvres et
      lieux anciens à protéger.
  solution: 'Le mot est « patrimoine » : il désigne l''ensemble des œuvres et lieux anciens transmis et à protéger.'
- id: gestes-qui-protegent
  type: choix
  difficulte: 1
  enonce: Coche tous les gestes qui protègent les œuvres pendant une visite.
  reponse:
    options:
    - id: a
      texte: Regarder une peinture sans la toucher
    - id: b
      texte: Rester à distance d'une sculpture
    - id: c
      texte: S'appuyer contre une statue pour se reposer
    - id: d
      texte: Courir dans les salles
    bonnes:
    - a
    - b
  indices:
    relance: Les œuvres sont fragiles. Quels gestes évitent de les abîmer ?
    methode: Pour chaque geste, demande-toi s'il risque de toucher, de cogner ou de salir une œuvre.
    etape: Courir et s'appuyer peuvent provoquer un choc. Que reste-t-il ?
  pieges:
  - si:
      contient:
      - c
    relance: S'appuyer contre une statue la touche et peut la faire bouger ou l'abîmer.
  - si:
      contient:
      - d
    relance: En courant, on peut bousculer quelqu'un ou heurter une œuvre.
  - si:
      diagnostic: incomplet
    relance: Il y a plus d'un bon geste. Cherche tous ceux qui évitent de toucher ou de cogner les œuvres.
  solution: Regarder sans toucher et rester à distance protègent les œuvres. S'appuyer contre une statue ou courir risque
    de les toucher ou de les heurter.
- id: lire-le-plan
  type: choix
  difficulte: 2
  enonce: Une fois arrivé dans un musée, comment te repérer pour trouver les salles que tu veux visiter ?
  reponse:
    options:
    - id: a
      texte: Lire le plan et les indications proposées sur place
    - id: b
      texte: Marcher au hasard jusqu'à trouver la bonne salle
    - id: c
      texte: Demander à chaque visiteur croisé dans les couloirs
    bonnes:
    - a
  indices:
    relance: Le musée met à disposition un document qui montre où se trouve chaque salle.
    methode: Cherche la réponse qui utilise un outil fiable proposé sur place.
    etape: Ce document est un dessin du musée vu de dessus.
  pieges:
  - si:
      contient:
      - b
    relance: Marcher au hasard risque de faire perdre du temps et de manquer des salles importantes.
  - si:
      contient:
      - c
    relance: 'Les autres visiteurs ne connaissent pas forcément mieux le musée que toi : préfère un document fiable.'
  solution: On se repère en lisant le plan du musée ou du lieu d'art et les indications proposées sur place.
- id: mot-vulnerable
  type: texte_court
  difficulte: 2
  enonce: 'On parle de la « vulnérabilité » du patrimoine. Trouve l''adjectif de la même famille, qui veut dire « fragile
    » : le patrimoine est ...'
  reponse:
    acceptees:
    - vulnérable
    - vulnerable
    fautes_tolerees: 1
  indices:
    relance: Le nom « vulnérabilité » cache un adjectif. Lequel ?
    methode: Fais comme avec « possibilité », qui vient de l'adjectif « possible ».
    etape: « Possibilité » donne « possible ». Fais pareil avec « vulnérabilité ».
  pieges:
  - si:
      valeur: fragile
    relance: C'est bien le sens. Mais on te demande le mot de la même famille que « vulnérabilité ».
  solution: 'Le patrimoine est vulnérable : il est fragile et peut s''abîmer. C''est pour cela qu''il faut le protéger.'
- id: salles-a-traverser
  type: nombre
  difficulte: 2
  enonce: Sur le plan d'un musée, les salles se suivent dans l'ordre des numéros. Tu es dans la salle 9 et tu veux aller dans
    la salle 12. Combien de salles dois-tu traverser entre les deux, sans compter la salle où tu es ni celle où tu vas ?
  reponse:
    valeur: 2
    forme: entier
  indices:
    relance: Quels numéros de salles se trouvent entre 9 et 12 ?
    methode: Écris les numéros qui suivent 9, un par un, et arrête-toi juste avant 12.
    etape: Après la salle 9 vient la salle 10. Laquelle vient ensuite, avant la 12 ?
  pieges:
  - si:
      valeur: 3
    relance: Tu as sans doute compté la salle 12. On te demande seulement les salles entre les deux.
  - si:
      valeur: 4
    relance: Tu as compté la salle où tu es et celle où tu vas. Enlève-les.
  solution: 'Entre la salle 9 et la salle 12, il y a la salle 10 et la salle 11 : tu traverses 2 salles (12 − 9 − 1 = 2).'
- id: pourquoi-pas-toucher
  type: association
  difficulte: 2
  enonce: Relie chaque danger pour une œuvre au risque qu'il fait courir.
  reponse:
    gauche:
    - id: a
      texte: toucher une peinture avec les mains
    - id: b
      texte: exposer une œuvre à trop de lumière
    - id: c
      texte: un choc sur une sculpture
    droite:
    - id: x
      texte: casser ou fissurer la sculpture
    - id: y
      texte: décolorer ou abîmer la peinture avec le temps
    - id: z
      texte: laisser des traces de sueur qui abîment la peinture
    paires:
      a: z
      b: y
      c: x
  indices:
    relance: 'Commence par le choc : quel dégât cela peut-il causer sur une sculpture ?'
    methode: Pour chaque danger, demande-toi ce qu'il abîme concrètement sur l'œuvre.
    etape: La sueur des mains contient des substances qui abîment lentement une peinture.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre un choc et une exposition prolongée à la lumière.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque danger : abîme-t-il la matière immédiatement (choc) ou lentement (lumière, sueur) ?'
  solution: Toucher une peinture laisse des traces de sueur qui l'abîment ; une exposition prolongée à la lumière décolore
    la peinture ; un choc peut casser ou fissurer une sculpture.
- id: etapes-preparation-visite
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre ces étapes pour préparer et réussir une visite de musée.
  reponse:
    elements:
    - id: rechercher
      texte: En classe, chercher des informations et préparer des questions
    - id: arriver
      texte: Arriver au musée et repérer sur le plan l'endroit où l'on est
    - id: suivre
      texte: Suivre les flèches et les numéros jusqu'à la salle cherchée
    - id: respecter
      texte: Observer l'œuvre cherchée sans la toucher
  indices:
    relance: Que fais-tu avant même d'arriver au musée ?
    methode: La première étape se passe en classe, la deuxième à l'entrée du musée.
    etape: Peux-tu observer l'œuvre avant d'avoir trouvé sa salle ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle vient en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape de préparation en classe et celle devant l'œuvre, puis range les deux autres.
  solution: On prépare d'abord la visite en classe. Au musée, on repère sur le plan où l'on est. Puis on suit les flèches
    et les numéros jusqu'à la salle. Enfin, on observe l'œuvre sans la toucher.
- id: expliquer-vulnerabilite
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases pourquoi on ne doit pas toucher les œuvres dans un musée, en utilisant l'idée
    de vulnérabilité du patrimoine.
  criteres:
  - L'explication mentionne que les œuvres sont fragiles (vulnérables).
  - L'explication donne au moins un danger concret (les mains, un choc, le temps).
  - L'explication mentionne l'existence de métiers chargés de les conserver ou de les restaurer.
  indices:
    relance: 'Pense à ce qui pourrait abîmer une œuvre : la lumière, la sueur des mains, les chocs.'
    methode: Relie ton explication au travail des métiers de la restauration.
    etape: Commence par expliquer que les œuvres sont fragiles, puis relie cela au travail des restaurateurs.
  solution: 'Exemple réussi : « Les œuvres d''un musée sont fragiles : la sueur des mains ou un choc peuvent les abîmer durablement.
    C''est pourquoi il existe des métiers de la restauration, chargés de réparer et d''entretenir le patrimoine abîmé par
    le temps. »'
- id: nblm-que-faut-il-faire-avant-une-sortie-au-mu-1
  type: choix
  difficulte: 2
  enonce: Que faut-il faire avant une sortie au musée pour bien la préparer ?
  reponse:
    options:
    - id: o1
      texte: Chercher des informations sur le lieu et préparer des questions précises.
    - id: o2
      texte: Attendre d'être sur place sans rien rechercher à l'avance.
    - id: o3
      texte: Apprendre par cœur la liste de toutes les œuvres présentées.
    - id: o4
      texte: Dessiner un faux plan du musée pour s'entraîner à la maison.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux actions méthodologiques préconisées avant de passer les portes du musée pour guider ton observation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : sans préparation avant la visite, on risque de ne pas savoir quoi chercher dans
      les salles.'
  - si:
      contient:
      - o3
    relance: Il ne s'agit pas de tout réciter par cœur, mais d'avoir un objectif de recherche précis pour guider son observation.
  - si:
      contient:
      - o4
    relance: 'Inventer un plan n''est pas utile : c''est le vrai plan du musée qu''il faut lire et comprendre sur place.'
  solution: 'Chercher des informations sur le lieu et préparer des questions précises. C''est la méthode recommandée : effectuer
    une recherche préparatoire et poser des questions ciblées permet de savoir quoi observer une fois sur place.'
- id: nblm-a-quoi-sert-la-lecture-du-plan-du-musee-2
  type: choix
  difficulte: 2
  enonce: À quoi sert la lecture du plan du musée lorsqu'on est sur place ?
  reponse:
    options:
    - id: o1
      texte: À s'orienter et à repérer les salles ou zones à visiter.
    - id: o2
      texte: À connaître le tarif exact des billets d'entrée du musée.
    - id: o3
      texte: À deviner le nom de l'artiste de chaque tableau sans regarder les cartels.
    - id: o4
      texte: À remplacer le déplacement dans les salles en restant assis.
    bonnes:
    - o1
  indices:
    relance: Pense à l'utilité d'une carte géographique ou d'un schéma d'orientation dans un grand bâtiment.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le plan sert à l'orientation spatiale dans le bâtiment, pas à la gestion des prix.
  - si:
      contient:
      - o3
    relance: Le plan indique la disposition des espaces et des salles, pas le détail des artistes pour chaque œuvre.
  - si:
      contient:
      - o4
    relance: 'C''est une erreur : le plan est un outil pour accompagner et guider son déplacement réel.'
  solution: 'À s''orienter et à repérer les salles ou zones à visiter. C''est exact : lire le plan permet de se repérer dans
    l''espace du musée et de trouver les salles recherchées.'
- id: nblm-pourquoi-est-il-important-d-etre-sensibi-3
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il important d'être sensibilisé à la vulnérabilité du patrimoine ?
  reponse:
    options:
    - id: o1
      texte: Parce que les œuvres et les monuments sont fragiles et peuvent s'abîmer.
    - id: o2
      texte: Parce que les œuvres d'art risquent de disparaître si on ne les prend pas en photo.
    - id: o3
      texte: Parce que les œuvres changent spontanément de forme chaque année.
    - id: o4
      texte: Parce que les bâtiments anciens sont tous construits en plastique incassable.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui peut arriver à des objets très anciens s'ils ne sont pas protégés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La vulnérabilité concerne la dégradation physique des matériaux, pas la prise de photos.
  - si:
      contient:
      - o3
    relance: Les œuvres ne se transforment pas toutes seules, mais elles s'abîment si elles ne sont pas entretenues et protégées.
  - si:
      contient:
      - o4
    relance: 'C''est faux : le patrimoine est constitué de matériaux anciens fragiles soumis au vieillissement et aux dégradations.'
  solution: 'Parce que les œuvres et les monuments sont fragiles et peuvent s''abîmer. C''est juste : les œuvres du patrimoine
    risquent de se détériorer, ce qui justifie l''existence de métiers dédiés à leur protection.'
- id: nblm-quelles-consignes-de-comportement-permet-4
  type: choix
  difficulte: 2
  enonce: Quelles consignes de comportement permettent de protéger les œuvres dans un musée ?
  reponse:
    options:
    - id: o1
      texte: Respecter une distance de sécurité avec les œuvres et garder le silence.
    - id: o2
      texte: Toucher les sculptures pour vérifier la matière dont elles sont faites.
    - id: o3
      texte: Courir entre les salles pour réussir à tout voir très rapidement.
    - id: o4
      texte: Manger son repas à proximité immédiate des tableaux exposés.
    bonnes:
    - o1
  indices:
    relance: Considère les règles affichées dans les musées qui évitent tout contact physique avec les objets exposés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur : toucher les œuvres les fragilise et risque de les détériorer irréversiblement.'
  - si:
      contient:
      - o3
    relance: Courir dans un musée crée des risques de bousculade et d'impact accidentel avec des œuvres exposées.
  - si:
      contient:
      - o4
    relance: La nourriture et les boissons sont proscrites près des œuvres pour éviter les taches et détériorations.
  solution: 'Respecter une distance de sécurité avec les œuvres et garder le silence. C''est la bonne attitude : maintenir
    une distance évite les contacts accidentels et le silence préserve la sérénité du lieu.'
- id: nblm-que-signifie-le-mot-patrimoine-d-apres-l-5
  type: choix
  difficulte: 2
  enonce: Que signifie le mot « patrimoine » d'après la leçon d'histoire des arts ?
  reponse:
    options:
    - id: o1
      texte: L'ensemble des œuvres et lieux anciens transmis qu'il faut protéger.
    - id: o2
      texte: Les fournitures scolaires neuves achetées pour l'année de CM1.
    - id: o3
      texte: Uniquement les bâtiments très récents construits cette semaine.
    - id: o4
      texte: Les jouets en plastique vendus à la boutique de la gare.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi le vocabulaire qui définit ce que les générations passées nous ont transmis.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le matériel scolaire personnel n'appartient pas au patrimoine artistique et culturel collectif.
  - si:
      contient:
      - o3
    relance: Le patrimoine désigne des biens et lieux anciens transmis à travers le temps.
  - si:
      contient:
      - o4
    relance: Les objets de consommation courante modernes ne constituent pas le patrimoine historique à protéger.
  solution: 'L''ensemble des œuvres et lieux anciens transmis qu''il faut protéger. C''est la définition exacte : le patrimoine
    regroupe les monuments, objets et œuvres hérités du passé et précieux à conserver.'
- id: nblm-quelles-sont-les-deux-methodes-indispens-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux méthodes indispensables pour réussir sa visite d'un musée ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Préparer des questions avant la visite pour savoir quoi chercher sur place.
    - id: o2
      texte: Lire le plan du musée pour repérer les zones et salles à visiter.
    - id: o3
      texte: Parcourir le musée au hasard sans jamais consulter les indications.
    - id: o4
      texte: Considérer que les œuvres d'art ne risquent jamais de s'abîmer.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux étapes positives de la méthode (une avant la visite, une pendant la visite).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
