format: 2
notion: cm1-avis-argumente-oeuvre-art
version: 3
etat: verifiee
declencheurs:
- donner un avis sur un tableau
- j'aime pas ce tableau pourquoi
- résumer l'action d'une image
- personnage mythologique dans un tableau
- caractériser un morceau de musique
- expliquer pourquoi j'aime une œuvre
- dire ce que je ressens devant une œuvre
- ce film m'a fait peur pourquoi
prerequis:
- cm1-caracteristiques-techniques-formelles-oeuvre
essentiel: 'Devant une œuvre d''art (un tableau, une sculpture, un film, un morceau de musique), on peut donner un avis argumenté.
  C''est dire ce qu''on pense ou ce qu''on ressent, en expliquant pourquoi grâce à ce qu''on observe dans l''œuvre.


  On commence par observer et identifier ce qui est représenté. Ce peut être des personnages, parfois mythologiques (Hercule,
  Zeus) ou religieux. Ce peut être des objets, un type d''espace (une forêt, une ville, l''intérieur d''une maison) ou un
  éclairage (une lumière douce, une nuit sombre).


  On peut ensuite résumer l''action, c''est-à-dire dire en une ou deux phrases ce qui se passe. Cela vaut pour une image,
  une scène de théâtre ou un film. On caractérise aussi les personnages : courageux, effrayé, joyeux.


  Pour un morceau de musique, on le caractérise en termes simples : est-il lent ou rapide ? fort ou doux ? joyeux ou triste
  ? Quels instruments entend-on ?


  Un avis argumenté n''est donc pas « j''aime » ou « j''aime pas » tout seul. C''est un avis appuyé sur ce qu''on a vraiment
  observé ou entendu. Les petits mots « parce que » servent à relier les deux. Par exemple, pour un dessin animé : « J''ai
  eu peur parce que la musique devenait forte et que tout était sombre. »


  Chacun peut avoir un avis différent, et c''est normal. Ce qui compte, c''est de savoir l''expliquer.

  '
methode:
- 'Observer attentivement l''œuvre : qui ou quoi est représenté, quel espace, quel éclairage.'
- Résumer en une ou deux phrases ce qui se passe ou ce qui est montré.
- Pour une musique, dire si elle est lente ou rapide, forte ou douce, et quels instruments on entend.
- Choisir un mot ou une phrase qui exprime ce qu'on ressent devant l'œuvre.
- Relier cet avis à un détail précis observé (une couleur, un geste, un son) avec « parce que ».
vocabulaire:
- terme: avis argumenté
  definition: un avis personnel expliqué et appuyé sur des observations précises
- terme: personnage mythologique
  definition: personnage issu d'un mythe ou d'un récit ancien
- terme: éclairage
  definition: la lumière dans l'œuvre, qui peut être douce, vive, sombre ou dorée
- terme: résumer
  definition: dire l'essentiel de ce qui se passe en peu de mots
- terme: caractériser
  definition: dire comment est quelqu'un ou quelque chose, avec des mots précis
- terme: type d'espace
  definition: le lieu représenté dans l'œuvre, comme une forêt, une ville ou l'intérieur d'une maison
erreurs_frequentes:
- Donner un avis (« j'aime » ou « je n'aime pas ») sans dire pourquoi.
- Décrire l'œuvre sans jamais exprimer d'avis ni de ressenti personnel.
- Inventer une histoire sans lien avec ce qui est réellement représenté dans l'œuvre.
- Penser qu'il n'existe qu'un seul bon avis, alors que chacun peut ressentir une œuvre différemment.
- Caractériser une musique par « bien » ou « nul » au lieu de dire si elle est lente, rapide, forte ou douce.
exemple:
  enonce: Devant un tableau qui représente une tempête en mer avec un bateau, comment donner un avis argumenté plutôt que
    dire juste « c'est beau » ?
  solution: 'On peut dire : « Je trouve ce tableau impressionnant parce que les vagues sont peintes avec des couleurs sombres
    et le bateau paraît minuscule à côté d''elles. » L''avis (« impressionnant ») est appuyé sur des observations précises.'
exercices:
- id: avis-ou-description
  type: choix
  difficulte: 1
  enonce: Quelle phrase est un avis argumenté sur une œuvre ?
  reponse:
    options:
    - id: a
      texte: J'aime ce tableau parce que les couleurs sont vives et joyeuses.
    - id: b
      texte: J'aime ce tableau.
    - id: c
      texte: Ce tableau représente un paysage de montagne.
    bonnes:
    - a
  indices:
    relance: Un avis argumenté dit ce qu'on pense, mais il ajoute encore quelque chose. Quoi donc ?
    methode: Cherche la phrase qui donne un avis ET qui explique ce qui a été observé dans l'œuvre.
    etape: Élimine d'abord la phrase qui ne donne aucun avis, seulement une description.
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase donne un avis, mais elle n'explique pas pourquoi. Il manque une observation précise.
  - si:
      contient:
      - c
    relance: Cette phrase décrit l'œuvre, mais elle ne donne aucun avis personnel.
  solution: La phrase a) donne un avis (« j'aime ») et l'appuie sur une observation précise (les couleurs vives et joyeuses).
- id: mot-personnage-mythe
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne un personnage issu d'un mythe ou d'un récit ancien, comme Zeus ou Hercule ?
  reponse:
    acceptees:
    - mythologique
    fautes_tolerees: 1
  indices:
    relance: Ce mot vient du mot « mythe », un récit ancien souvent lié à des dieux.
    methode: Pense à l'adjectif qui qualifie un personnage sorti d'un mythe.
    etape: Les récits anciens sur Zeus et les dieux s'appellent la mythologie. Cherche l'adjectif qui en vient.
  pieges:
  - si:
      valeur: religieux
    relance: 'Un personnage religieux vient d''une religion. Zeus ou Hercule viennent des mythes, des récits anciens : cherche
      l''autre mot.'
  solution: 'Le mot est « mythologique » : Zeus et Hercule sont des personnages mythologiques, issus des mythes anciens.'
- id: mot-qui-relie
  type: texte_court
  difficulte: 1
  enonce: 'Complète l''avis avec les deux petits mots qui relient le ressenti à l''observation : « J''aime cette sculpture
    ... ses formes sont arrondies et douces. »'
  reponse:
    acceptees:
    - parce que
    - car
    fautes_tolerees: 1
  indices:
    relance: Quels mots utilises-tu pour expliquer pourquoi tu dis quelque chose ?
    methode: Cherche les mots qui répondent à la question « pourquoi ? ».
    etape: 'Demande-toi : « Pourquoi j''aime cette sculpture ? ». Par quels mots commence ta réponse ?'
  pieges:
  - si:
      valeur: et
    relance: « Et » ajoute une idée, mais il n'explique pas pourquoi tu aimes la sculpture.
  solution: « J'aime cette sculpture parce que ses formes sont arrondies et douces. » Les mots « parce que » relient l'avis
    à l'observation.
- id: resumer-action
  type: choix
  difficulte: 2
  enonce: Pour résumer une action représentée sur une image, que dois-tu faire ?
  reponse:
    options:
    - id: a
      texte: Décrire en une ou deux phrases ce qui se passe.
    - id: b
      texte: Copier tous les détails du décor sans parler de l'action.
    - id: c
      texte: Inventer une histoire qui n'a aucun lien avec l'image.
    bonnes:
    - a
  indices:
    relance: Résumer, c'est dire l'essentiel en peu de mots. Que dois-tu observer d'abord ?
    methode: 'Demande-toi : que font les personnages sur cette image ?'
    etape: Élimine la réponse qui ne parle pas du tout de l'action représentée.
  pieges:
  - si:
      contient:
      - b
    relance: Décrire le décor peut aider, mais cela ne résume pas l'action elle-même. Que font les personnages ?
  - si:
      contient:
      - c
    relance: Un résumé doit rester fidèle à ce qui est réellement représenté, pas à une histoire inventée.
  solution: Il faut décrire en une ou deux phrases ce qui se passe réellement sur l'image, en observant l'action des personnages.
- id: caracteriser-musique
  type: choix
  difficulte: 2
  enonce: Tu écoutes un morceau très lent, joué doucement au violon, dans un ton triste. Coche toutes les phrases qui le caractérisent
    bien.
  reponse:
    options:
    - id: a
      texte: Le morceau est lent.
    - id: b
      texte: Le morceau est joué doucement.
    - id: c
      texte: Le morceau est rapide et joyeux.
    - id: d
      texte: On entend surtout des tambours.
    bonnes:
    - a
    - b
  indices:
    relance: Relis l'énoncé. Que dit-il de la vitesse, du volume et de l'instrument ?
    methode: Garde seulement les phrases qui disent la même chose que l'énoncé.
    etape: Le violon est un instrument à cordes, pas un tambour. Que reste-t-il ?
  pieges:
  - si:
      contient:
      - c
    relance: L'énoncé dit que le morceau est très lent et triste. Est-ce rapide et joyeux ?
  - si:
      contient:
      - d
    relance: L'énoncé parle d'un violon, pas de tambours.
  - si:
      diagnostic: incomplet
    relance: Il y a plus d'une bonne réponse. Une phrase parle de la vitesse, une autre du volume.
  solution: 'Le morceau est lent et joué doucement. Ce sont des mots simples pour caractériser une musique : la vitesse (lent)
    et le volume (doux).'
- id: categories-observees
  type: association
  difficulte: 2
  enonce: Relie chaque élément observé dans une œuvre à un exemple qui l'illustre.
  reponse:
    gauche:
    - id: a
      texte: personnage mythologique
    - id: b
      texte: objet
    - id: c
      texte: type d'espace
    - id: d
      texte: éclairage
    droite:
    - id: x
      texte: Zeus dans un tableau
    - id: y
      texte: une épée peinte dans un tableau
    - id: z
      texte: un temple représenté en peinture
    - id: w
      texte: une lumière dorée de coucher de soleil
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: 'Commence par le personnage : quel élément du programme correspond à Zeus ?'
    methode: Pour chaque exemple, demande-toi s'il s'agit d'un personnage, d'un objet, d'un espace ou d'une lumière.
    etape: L'épée est un objet ; à quel élément la relies-tu ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre un objet et un type d'espace.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque exemple un par un : est-ce un personnage, un objet, un espace ou une lumière ?'
  solution: Zeus est un personnage mythologique ; l'épée est un objet ; le temple est un type d'espace ; la lumière dorée
    du coucher de soleil est un éclairage.
- id: etapes-avis-argumente
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre ces étapes pour donner un avis argumenté sur une œuvre.
  reponse:
    elements:
    - id: observer
      texte: Observer attentivement l'œuvre
    - id: resumer
      texte: Résumer ce qui est représenté
    - id: ressenti
      texte: Choisir un mot qui exprime ce que l'on ressent
    - id: relier
      texte: Relier cet avis à un détail précis observé
  indices:
    relance: Que dois-tu faire avant même de choisir un avis ?
    methode: La première étape regarde l'œuvre, la dernière relie l'avis à un détail précis.
    etape: Après avoir observé l'œuvre, résumes-tu ce qui est représenté, ou donnes-tu déjà ton avis ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux vient en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape qui ouvre la démarche (observer) et celle qui la termine (relier à un détail).
  solution: On observe d'abord l'œuvre, on résume ce qui est représenté, on choisit un mot pour son ressenti, puis on relie
    cet avis à un détail précis observé.
- id: mon-avis-sur-une-oeuvre
  type: ouverte
  difficulte: 3
  enonce: 'Choisis un tableau, une photo, une sculpture ou un morceau de musique que tu connais et écris deux phrases : une
    qui décrit ce que tu observes ou entends, une qui donne ton avis en expliquant pourquoi.'
  criteres:
  - La phrase d'observation décrit un élément réel de l'œuvre choisie.
  - La phrase d'avis exprime clairement un ressenti ou une opinion.
  - L'avis est relié à ce détail observé, par exemple avec « parce que ».
  indices:
    relance: Commence par « J'observe... » ou « J'entends... » puis « Je pense/je ressens... parce que... ».
    methode: 'Appuie-toi sur un détail précis : une couleur, une forme, un personnage, un son.'
    etape: Écris d'abord ta phrase d'observation, puis relie-la à ton avis avec le mot « parce que ».
  solution: 'Exemple réussi : « J''observe un bateau minuscule au milieu de vagues sombres. Je trouve ce tableau impressionnant
    parce que les couleurs sombres et la taille du bateau montrent le danger de la tempête. »'
- id: nblm-comment-donne-t-on-un-avis-argumente-lor-1
  type: choix
  difficulte: 2
  enonce: Comment donne-t-on un avis argumenté lorsque l'on observe un tableau ?
  reponse:
    options:
    - id: o1
      texte: En expliquant ce que l'on pense ou ressent à partir d'observations précises de l'œuvre.
    - id: o2
      texte: En disant seulement « j'aime » ou « c'est beau » sans donner d'explications.
    - id: o3
      texte: En décrivant tous les éléments du tableau sans jamais donner son opinion personnelle.
    - id: o4
      texte: En inventant une histoire imaginaire sans rapport avec ce qui est peint.
    bonnes:
    - o1
  indices:
    relance: Pense à la combinaison entre ton ressenti personnel et ce que tu observes réellement dans l'œuvre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : exprimer un goût simple sans expliquer pourquoi ne constitue pas un avis argumenté.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : décrire l''œuvre sans donner son avis ou son ressenti oublie la dimension personnelle de l''avis.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : inventer des faits sans lien avec ce qui est réellement représenté est une erreur de méthode.'
  solution: 'En expliquant ce que l''on pense ou ressent à partir d''observations précises de l''œuvre. C''est la bonne réponse
    : un avis argumenté associe un ressenti personnel à des preuves ou détails observés dans le tableau.'
- id: nblm-si-tu-n-aimes-pas-un-tableau-comment-doi-2
  type: choix
  difficulte: 2
  enonce: Si tu n'aimes pas un tableau, comment dois-tu expliquer pourquoi pour avoir un avis argumenté ?
  reponse:
    options:
    - id: o1
      texte: En disant « je n'aime pas » et en reliant ce refus à un détail précis comme une couleur ou un geste.
    - id: o2
      texte: En disant juste « j'aime pas ce tableau » et en refusant d'en parler.
    - id: o3
      texte: En prétendant que l'on aime le tableau pour faire plaisir au professeur.
    - id: o4
      texte: En récitant la biographie du peintre sans parler du tableau.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au moyen d'associer ta désapprobation à ce que tes yeux voient dans la peinture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : s''arrêter à « j''aime pas » ne donne aucun argument ni explication.'
  - si:
      contient:
      - o3
    relance: 'Faux : en histoire des arts, ton avis peut être négatif, ce qui compte c''est la qualité de ton explication.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : parler d''autre chose ne permet pas d''argumenter ton ressenti devant l''œuvre.'
  solution: 'En disant « je n''aime pas » et en reliant ce refus à un détail précis comme une couleur ou un geste. Exact :
    on a le droit de ne pas aimer une œuvre, à condition d''appuyer son avis sur un détail précis observé.'
- id: nblm-lorsqu-on-observe-une-image-ou-un-tablea-3
  type: choix
  difficulte: 2
  enonce: Lorsqu'on observe une image ou un tableau, quelle étape permet de résumer ce qui s'y passe ?
  reponse:
    options:
    - id: o1
      texte: Résumer l'action représentée en une ou deux phrases simples.
    - id: o2
      texte: Écrire un roman complet de dix pages sur la vie des personnages.
    - id: o3
      texte: Décrire uniquement le cadre en bois autour du tableau.
    - id: o4
      texte: Lister tous les outils utilisés par l'artiste pour fabriquer la peinture.
    bonnes:
    - o1
  indices:
    relance: Cherche une formulation très courte qui explique l'événement principal montré par l'artiste.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : il ne faut pas inventer un long récit, mais faire un résumé court et précis.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le cadre ne fait pas partie de l''action représentée dans l''image.'
  - si:
      contient:
      - o4
    relance: 'Attention : lister la technique est important, mais cela ne résume pas l''action montrée dans l''image.'
  solution: 'Résumer l''action représentée en une ou deux phrases simples. C''est exact : l''une des étapes de la méthode
    consiste à résumer en une ou deux phrases ce qui est montré ou se passe.'
- id: nblm-si-un-tableau-represente-un-personnage-m-4
  type: choix
  difficulte: 2
  enonce: Si un tableau représente un personnage mythologique, de quel type de personnage s'agit-il ?
  reponse:
    options:
    - id: o1
      texte: Un personnage issu d'un mythe ou d'un récit ancien.
    - id: o2
      texte: Un personnage historique vivant à notre époque.
    - id: o3
      texte: Le peintre lui-même dessiné dans son atelier.
    - id: o4
      texte: Un ami de la classe pris en photo.
    bonnes:
    - o1
  indices:
    relance: Pense aux grands récits légendaires transmis depuis l'Antiquité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : un personnage mythologique ne fait pas partie du monde réel actuel.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le peintre est une personne réelle, alors qu''un personnage mythologique appartient à la légende.'
  - si:
      contient:
      - o4
    relance: 'Faux : une personne réelle n''est pas une figure mythologique.'
  solution: 'Un personnage issu d''un mythe ou d''un récit ancien. Bonne réponse : selon le vocabulaire de la fiche, un personnage
    mythologique vient d''un mythe ou d''un récit ancien.'
- id: nblm-comment-peut-on-caracteriser-un-morceau-5
  type: choix
  difficulte: 2
  enonce: Comment peut-on caractériser un morceau de musique pour donner son avis ?
  reponse:
    options:
    - id: o1
      texte: En utilisant des termes simples pour décrire ce qu'on entend et ressent.
    - id: o2
      texte: En inventant une histoire d'amour sans lien avec l'ambiance sonore.
    - id: o3
      texte: En disant seulement « c'est du bruit » sans autre commentaire.
    - id: o4
      texte: En comptant le nombre de pages de la partition musicale.
    bonnes:
    - o1
  indices:
    relance: Pense aux mots simples qui permettent de décrire les sensations sonores ressenties.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : inventer une histoire non justifiée par l''œuvre est une mauvaise démarche.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : un jugement rejetant sans justification n''est pas un avis argumenté.'
  - si:
      contient:
      - o4
    relance: 'Faux : compter des pages ne caractérise pas ce que l''on entend lors de l''écoute.'
  solution: 'En utilisant des termes simples pour décrire ce qu''on entend et ressent. C''est juste : on peut caractériser
    un morceau de musique en termes simples à partir de l''écoute attentive.'
- id: nblm-quelles-sont-les-deux-demarches-indispen-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX démarches indispensables pour expliquer pourquoi j'aime ou je n'aime pas une œuvre ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Choisir un mot ou une phrase qui exprime clairement son ressenti devant l'œuvre.
    - id: o2
      texte: Relier son avis à un détail précis observé ou entendu (une couleur, un geste, un son).
    - id: o3
      texte: Se contenter de dire « c'est beau » sans regarder les détails.
    - id: o4
      texte: Raconter une anecdote personnelle qui n'a aucun rapport avec l'œuvre.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les deux actions qui associent ton sentiment personnel à une observation concrète.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : dire juste ''c''est beau'' manque d''argumentation et d''observation.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : l''argumentation doit porter sur l''œuvre et non sur une histoire extérieure.'
  solution: 'Choisir un mot ou une phrase qui exprime clairement son ressenti devant l''œuvre ; Relier son avis à un détail
    précis observé ou entendu (une couleur, un geste, un son). Bonne réponse : donner son avis nécessite d''exprimer clairement
    ce qu''on ressent.'
- id: nblm-un-avis-personnel-explique-et-appuye-sur-7
  type: texte_court
