format: 2
notion: cm1-modes-de-vie-seigneurs-paysans-villes
version: 3
etat: verifiee
declencheurs:
- vie des paysans
- travaux des champs
- impôts au moyen âge
- marché et foire
- artisan
- corvée pour le seigneur
- vivre en ville au moyen âge
- calendrier des travaux
prerequis:
- cm1-seigneurie-et-paroisse
essentiel: 'Au Moyen Âge, on ne vit pas de la même façon selon qu''on est seigneur, paysanne ou paysan, ou habitant d''une
  ville. La plupart des gens sont des paysannes et des paysans : ils vivent à la campagne et cultivent la terre.


  Le seigneur domine un territoire et les hommes qui y vivent. Il habite un château, qui le protège, lui sert de maison et
  montre sa puissance.


  Les paysannes et les paysans suivent un calendrier annuel des travaux : chaque saison a ses travaux, et tout recommence
  l''année suivante. Par exemple, on sème les graines, puis on récolte les céréales en été : c''est la moisson. Comme dans
  ton année d''école, chaque période a ses activités.


  Ils ont des obligations envers le seigneur. Ils paient des redevances, en argent ou en produits de leurs récoltes. Ils font
  aussi des corvées, c''est-à-dire du travail gratuit sur les terres du seigneur.


  Ils ont aussi des obligations envers l''Église, dans le cadre de la paroisse, par exemple la dîme : une partie des récoltes
  donnée à l''Église. Retiens bien : deux destinataires, le seigneur ET l''Église.


  Dans les villes, la vie est différente. On y trouve des marchés et des foires, où l''on vend et achète des marchandises.
  On y trouve aussi l''artisanat : des artisans fabriquent des objets à la main, dans leur atelier.

  '
methode:
- Se demander d'abord où vit la personne, à la campagne ou en ville.
- 'Se demander qui fait l''action : le paysan aux champs, ou le marchand et l''artisan en ville.'
- Se souvenir que les paysannes et paysans suivent un calendrier annuel de travaux, qui suit les saisons.
- Se rappeler qu'ils doivent des obligations au seigneur (redevances, corvées) et à l'Église.
- 'Associer la ville médiévale à deux activités précises : marché/foire et artisanat.'
vocabulaire:
- terme: paysanne et paysan
  definition: personne qui cultive la terre et doit des obligations au seigneur et à l'Église
- terme: seigneur
  definition: personne qui domine un territoire et les hommes qui y vivent, et habite un château
- terme: corvée
  definition: travail gratuit que les paysans doivent faire pour le seigneur
- terme: redevance
  definition: paiement en argent ou en produits que les paysans doivent au seigneur
- terme: artisan
  definition: personne qui fabrique des objets à la main, dans un atelier
- terme: dîme
  definition: partie des récoltes que les paysans doivent donner à l'Église
- terme: foire
  definition: grand marché qui a lieu à certaines dates, où l'on vend et achète des marchandises
erreurs_frequentes:
- 'Croire que tout le monde au Moyen Âge vit dans un château : la majorité vit et travaille aux champs.'
- Oublier que les paysans doivent des obligations au seigneur ET à l'Église, pas seulement à l'un des deux.
- Confondre les activités des villes (marché, foire, artisanat) avec celles des campagnes.
- Confondre la corvée (un travail gratuit) et la redevance (un paiement).
exemple:
  enonce: Explique en une ou deux phrases ce que doit faire une paysanne au Moyen Âge, en plus de cultiver ses propres terres.
  solution: Elle suit le calendrier annuel des travaux des champs. Elle doit aussi des obligations au seigneur, par exemple
    des corvées (travail gratuit) et des redevances (paiements), et des obligations envers l'Église.
exercices:
- id: qui-cultive-la-terre
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on, au Moyen Âge, une personne qui cultive la terre et doit des obligations au seigneur et à l'Église
    ?
  reponse:
    acceptees:
    - paysan
    - paysanne
    - paysanne et paysan
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne une personne qui travaille aux champs, pas en ville.
    methode: Pense à qui cultive la terre dans une seigneurie.
    etape: Le mot commence comme « pays ».
  pieges:
  - si:
      valeur: seigneur
    relance: Le seigneur domine le territoire, mais ce n'est pas lui qui cultive directement la terre.
  - si:
      valeur: artisan
    relance: L'artisan fabrique des objets en ville. Qui cultive la terre à la campagne ?
  solution: On parle d'une paysanne ou d'un paysan.
- id: deux-destinataires-obligations
  type: choix
  difficulte: 1
  enonce: À qui les paysannes et paysans doivent-ils des obligations, au Moyen Âge ?
  reponse:
    options:
    - id: a
      texte: Au seigneur et à l'Église
    - id: b
      texte: Au roi seulement
    - id: c
      texte: Aux artisans de la ville
    bonnes:
    - a
  indices:
    relance: Le programme cite deux destinataires, pas un seul.
    methode: Repense à qui domine le territoire et à qui encadre la vie religieuse.
    etape: Un des destinataires est un seigneur, l'autre est une institution religieuse.
  pieges:
  - si:
      contient:
      - b
    relance: Le roi n'est pas cité comme destinataire direct des obligations paysannes dans cette notion.
  - si:
      contient:
      - c
    relance: Les artisans travaillent en ville, ils ne reçoivent pas les obligations des paysans.
  solution: Les paysannes et paysans doivent des obligations au seigneur et à l'Église.
- id: mot-corvee
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le travail gratuit qu'un paysan doit faire sur les terres du seigneur ?
  reponse:
    acceptees:
    - corvée
    - corvee
    - la corvée
    - une corvée
    fautes_tolerees: 1
  indices:
    relance: Ce mot est entré dans la langue de tous les jours, pour une tâche pénible qu'on doit faire.
    methode: Relis le vocabulaire de ta fiche, au mot qui parle de travail gratuit.
    etape: Ce n'est pas la redevance, qui est un paiement. Cherche l'autre obligation envers le seigneur dans ta fiche.
  pieges:
  - si:
      valeur: redevance
    relance: La redevance est un paiement. Ici, on parle d'un travail gratuit.
  solution: C'est la corvée, un travail gratuit que les paysans doivent faire pour le seigneur.
- id: activites-des-villes
  type: choix
  difficulte: 2
  enonce: Parmi ces quatre activités, laquelle ne se voit PAS dans une ville au Moyen Âge ?
  reponse:
    options:
    - id: a
      texte: Le marché
    - id: b
      texte: La foire
    - id: c
      texte: L'artisanat
    - id: d
      texte: Les travaux des champs
    bonnes:
    - d
  indices:
    relance: Trois de ces activités sont bien décrites par le programme pour la ville, une seule ne l'est pas.
    methode: Pense à ce qui se passe plutôt à la campagne qu'en ville.
    etape: Cultiver la terre ne se fait pas dans les rues d'une ville.
  pieges:
  - si:
      contient:
      - a
    relance: Le marché est bien une activité que l'on trouve dans une ville médiévale.
  - si:
      contient:
      - b
    relance: La foire est bien une activité que l'on trouve dans une ville médiévale.
  - si:
      contient:
      - c
    relance: L'artisanat est bien une activité que l'on trouve dans une ville médiévale.
  solution: Les travaux des champs ne se voient pas dans une ville, ils se font à la campagne.
- id: qui-vit-ou
  type: association
  difficulte: 2
  enonce: Relie chaque personne à ce qu'elle fait.
  reponse:
    gauche:
    - id: seigneur
      texte: Le seigneur
    - id: paysan
      texte: La paysanne ou le paysan
    - id: artisan
      texte: L'artisan
    droite:
    - id: domine
      texte: Domine un territoire et habite un château
    - id: cultive
      texte: Cultive la terre selon les saisons
    - id: fabrique
      texte: Fabrique des objets à la main en ville
    paires:
      seigneur: domine
      paysan: cultive
      artisan: fabrique
  indices:
    relance: Une personne vit au château, une autre aux champs, une autre en ville.
    methode: Pour chaque personne, demande-toi d'abord où elle vit.
    etape: L'artisan vit en ville. Que fait-il dans son atelier ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque personne et le lieu où elle vit.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le seigneur et son château, puis place le paysan et l'artisan.
  solution: Le seigneur domine un territoire et habite un château ; la paysanne ou le paysan cultive la terre selon les saisons
    ; l'artisan fabrique des objets à la main en ville.
- id: campagne-ou-ville
  type: choix
  difficulte: 2
  enonce: Coche toutes les activités que l'on trouve dans une ville au Moyen Âge.
  reponse:
    options:
    - id: a
      texte: Le marché
    - id: b
      texte: La foire
    - id: c
      texte: L'artisanat
    - id: d
      texte: La moisson des céréales
    - id: e
      texte: La corvée sur les terres du seigneur
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Plusieurs réponses sont justes. Lesquelles se passent dans les rues et les ateliers ?
    methode: Barre d'abord ce qui se fait aux champs, à la campagne.
    etape: Il reste trois activités où l'on vend, achète ou fabrique. Les as-tu toutes cochées ?
  pieges:
  - si:
      contient:
      - d
    relance: La moisson se fait aux champs, à la campagne, pas en ville.
  - si:
      contient:
      - e
    relance: La corvée se fait sur les terres du seigneur, à la campagne.
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une partie des bonnes réponses. Il y a trois activités de la ville à cocher.
  solution: En ville, on trouve le marché, la foire et l'artisanat. La moisson et la corvée se font à la campagne.
- id: calendrier-travaux
  type: ouverte
  difficulte: 2
  enonce: Qu'est-ce que le calendrier annuel des travaux d'une paysanne ou d'un paysan ?
  criteres:
  - L'élève explique que les travaux agricoles changent selon les saisons de l'année.
  - L'élève relie ce calendrier à la culture de la terre.
  - L'élève donne au moins un exemple de travail lié à une saison.
  indices:
    relance: Ce calendrier suit les saisons de l'année.
    methode: Pense à ce que fait un paysan au printemps, en été, en automne, en hiver.
    etape: Le mot « annuel » veut dire que cela se répète chaque année.
  solution: C'est l'ensemble des travaux agricoles que les paysannes et paysans effectuent, dans un ordre qui suit les saisons,
    et qui recommence chaque année. Par exemple, on sème les graines, puis on récolte les céréales en été.
- id: obligation-corvee-dime
  type: choix
  difficulte: 3
  enonce: 'Une paysanne dit : « Je dois donner une partie de mes récoltes et travailler gratuitement pour d''autres personnes.
    » À qui doit-elle ces obligations ?'
  reponse:
    options:
    - id: a
      texte: Au seigneur et à l'Église
    - id: b
      texte: Au roi seulement
    - id: c
      texte: Aux artisans de la ville
    bonnes:
    - a
  indices:
    relance: Il y a deux destinataires possibles dans le programme.
    methode: Repense à la notion de seigneurie et de paroisse.
    etape: Un destinataire possède les terres, l'autre encadre la vie religieuse.
  pieges:
  - si:
      contient:
      - b
    relance: Le roi n'est pas le destinataire direct de ces obligations dans cette notion.
  - si:
      contient:
      - c
    relance: Les artisans travaillent en ville, ils ne reçoivent pas les obligations des paysans.
  solution: Elle doit ces obligations au seigneur et à l'Église.
