format: 2
notion: cm1-progres-techniques-navigation
version: 3
etat: generee
declencheurs:
- boussole
- caravelle
- naviguer loin en mer
- grands explorateurs
- tour du monde
- débarquement en amérique
- bateaux des explorateurs
- christophe colomb
- magellan
prerequis:
- cm1-societe-ordres-clerge-noblesse-tiers-etat
essentiel: 'Du XVe au XVIIe siècle, des Européens partent explorer des terres qu''ils ne connaissent pas. Pour cela, ils doivent
  naviguer au grand large : loin des côtes, en pleine mer, là où on ne voit plus la terre.


  C''est possible grâce à des progrès techniques : des inventions et des outils qui rendent ces longs voyages possibles. Il
  faut retenir le nom de plusieurs d''entre eux.


  La boussole indique le nord. Même au milieu de l''océan, sans aucun repère, le marin sait dans quelle direction il avance.
  C''est comme dans la cour de l''école : si tu sais où est le nord, tu peux retrouver ton chemin.


  La caravelle est un type de bateau solide, capable d''affronter la haute mer et de faire de longs voyages.


  Les cartes montrent les côtes et les routes de la mer déjà connues. Les marins s''en servent pour préparer leur route.


  Ces progrès permettent de grandes explorations. En 1492, Christophe Colomb débarque en Amérique. De 1519 à 1522, l''expédition
  de Magellan fait le tour du monde : le voyage dure 3 ans.


  Astuce de frise : 1492, l''année où Colomb débarque en Amérique, est aussi l''année qui marque la fin du Moyen Âge.

  '
methode:
- Expliquer ce que veut dire « naviguer au grand large » (loin des côtes, en pleine mer).
- 'Mémoriser le nom d''au moins deux inventions : la boussole et la caravelle.'
- Dire à quoi sert chaque invention citée (la boussole indique le nord, la caravelle affronte la haute mer).
- Relier 1492 à l'arrivée de Christophe Colomb en Amérique.
- Relier 1519-1522 à l'expédition de Magellan, qui fait le tour du monde.
vocabulaire:
- terme: caravelle
  definition: type de bateau utilisé par les Européens pour naviguer au grand large
- terme: boussole
  definition: instrument qui indique le nord et aide à se diriger en mer
- terme: carte
  definition: dessin qui montre les côtes et les routes de la mer connues
- terme: grand large
  definition: la pleine mer, loin des côtes
- terme: exploration
  definition: voyage pour découvrir des terres que l'on ne connaît pas
- terme: expédition
  definition: grand voyage organisé avec des bateaux et des marins
erreurs_frequentes:
- Confondre la date de l'arrivée de Christophe Colomb en Amérique (1492) et l'expédition de Magellan (1519-1522).
- Oublier de nommer au moins une invention (boussole ou caravelle) permettant la navigation au grand large.
- Confondre la boussole, un instrument qui indique le nord, et la caravelle, un bateau.
- Dire que Colomb a fait le tour du monde, alors que c'est l'expédition de Magellan.
exemple:
  enonce: Cite deux inventions qui permettent aux Européens de naviguer au grand large, et dis à quoi elles servent.
  solution: 'La boussole indique le nord : le marin sait dans quelle direction il avance, même loin des côtes. La caravelle
    est un bateau solide, capable d''affronter la haute mer et de faire de longs voyages.'
exercices:
- id: annee-colomb
  type: nombre
  difficulte: 1
  enonce: En quelle année Christophe Colomb débarque-t-il en Amérique ?
  reponse:
    valeur: 1492
    forme: entier
  indices:
    relance: Cette date est l'une des plus connues des grandes explorations.
    methode: Elle marque l'arrivée des Européens sur un nouveau continent, l'Amérique.
    etape: L'expédition de Magellan a lieu plus tard, entre 1519 et 1522. Colomb arrive avant.
  pieges:
  - si:
      valeur: 1519
    relance: 1519, c'est le début de l'expédition de Magellan. Colomb débarque bien avant.
  - si:
      valeur: 1522
    relance: 1522, c'est la fin de l'expédition de Magellan. Cherche une date plus ancienne pour Colomb.
  solution: Christophe Colomb débarque en Amérique en 1492.
- id: instrument-nord
  type: texte_court
  difficulte: 1
  enonce: Quel instrument indique le nord aux marins, même au milieu de l'océan ?
  reponse:
    acceptees:
    - boussole
    - une boussole
    - la boussole
    fautes_tolerees: 1
  indices:
    relance: Ce n'est pas un bateau, c'est un petit instrument que le marin tient ou pose devant lui.
    methode: Relis le vocabulaire de ta fiche, au mot qui parle du nord.
    etape: Relis le paragraphe de ta fiche qui compare cet instrument à la cour de l'école.
  pieges:
  - si:
      valeur: caravelle
    relance: La caravelle est un bateau. Quel instrument montre la direction du nord ?
  - si:
      valeur: carte
    relance: La carte montre les côtes, mais elle n'indique pas toute seule le nord. Quel instrument le fait ?
  solution: C'est la boussole, qui indique le nord et aide à se diriger en mer.
- id: duree-magellan
  type: nombre
  difficulte: 2
  enonce: L'expédition de Magellan dure de 1519 à 1522. Combien d'années dure-t-elle ?
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Pour trouver une durée, que fais-tu avec les deux dates ?
    methode: Soustrais la date de début à la date de fin.
    etape: Calcule 1522 moins 1519.
  pieges:
  - si:
      valeur: 1519
    relance: Ce n'est pas une durée mais une date de début. Fais la soustraction 1522 - 1519.
  - si:
      valeur: 1522
    relance: Ce n'est pas une durée mais une date de fin. Fais la soustraction 1522 - 1519.
  solution: 'L''expédition de Magellan dure 1522 − 1519 = 3 ans. Vérification : 1519 + 3 = 1522.'
- id: nom-invention-navigation
  type: texte_court
  difficulte: 1
  enonce: Quel type de bateau permet aux Européens de naviguer au grand large ?
  reponse:
    acceptees:
    - caravelle
    fautes_tolerees: 1
  indices:
    relance: Ce mot est cité dans le vocabulaire de ta leçon.
    methode: C'est un type de bateau, pas un instrument de mesure.
    etape: Ce mot commence par « cara- ».
  pieges:
  - si:
      valeur: boussole
    relance: La boussole est un instrument, pas un bateau. Cherche le nom du bateau.
  solution: La caravelle, un type de bateau utilisé par les Européens pour naviguer au grand large.
- id: chronologie-explorations
  type: ordre
  difficulte: 2
  enonce: Range ces trois évènements dans l'ordre chronologique.
  reponse:
    elements:
    - id: colomb
      texte: Christophe Colomb débarque en Amérique
    - id: depart
      texte: L'expédition de Magellan commence
    - id: retour
      texte: L'expédition de Magellan achève son tour du monde
  indices:
    relance: Compare les dates 1492, 1519 et 1522.
    methode: 1492 est une date plus ancienne que 1519, elle-même plus ancienne que 1522.
    etape: Colomb débarque en 1492, avant le début de l'expédition de Magellan en 1519.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux évènements voisins sont inversés. Compare leurs dates.
  - si:
      diagnostic: ordre_faux
    relance: 'Repère d''abord le plus ancien des trois évènements : Colomb débarque en 1492.'
  solution: D'abord l'arrivée de Christophe Colomb en Amérique (1492), puis le début de l'expédition de Magellan (1519), puis
    la fin de son tour du monde (1522).
- id: association-inventions
  type: association
  difficulte: 2
  enonce: Relie chaque invention à ce qu'elle permet de faire.
  reponse:
    gauche:
    - id: a
      texte: La boussole
    - id: b
      texte: La caravelle
    droite:
    - id: x
      texte: Indiquer le nord pour se diriger en mer
    - id: y
      texte: Naviguer au grand large grâce à sa solidité
    paires:
      a: x
      b: y
  indices:
    relance: L'une des deux inventions est un bateau, l'autre un instrument de mesure.
    methode: Un instrument de mesure indique une direction ; un bateau permet de naviguer.
    etape: La boussole indique le nord. Que fait la caravelle ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends les deux inventions une par une.
  - si:
      diagnostic: associations_fausses
    relance: Demande-toi lequel des deux est un bateau. Un bateau sert à naviguer.
  solution: La boussole indique le nord pour se diriger en mer ; la caravelle est le bateau qui permet de naviguer au grand
    large.
- id: outils-grand-large
  type: choix
  difficulte: 2
  enonce: Coche tous les outils qui aident les marins européens du XVe au XVIIe siècle à naviguer au grand large.
  reponse:
    options:
    - id: a
      texte: La boussole
    - id: b
      texte: La caravelle
    - id: c
      texte: La carte
    - id: d
      texte: L'avion
    - id: e
      texte: Le téléphone
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Plusieurs réponses sont justes. Lesquelles existaient déjà à l'époque de Christophe Colomb ?
    methode: Barre d'abord les objets d'aujourd'hui que les marins de cette époque ne pouvaient pas connaître.
    etape: Il reste un instrument, un bateau et un dessin des côtes. Les as-tu tous cochés ?
  pieges:
  - si:
      contient:
      - d
    relance: Les explorateurs voyagent en bateau. L'avion est inventé bien plus tard.
  - si:
      contient:
      - e
    relance: Le téléphone n'existe pas à cette époque. Quels outils ont les marins ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une partie des bonnes réponses. Il y a trois outils à cocher.
  solution: La boussole (elle indique le nord), la caravelle (un bateau solide pour la haute mer) et la carte (elle montre
    les côtes et les routes connues). L'avion et le téléphone n'existent pas encore.
- id: pourquoi-progres-techniques
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases pourquoi les progrès techniques ont permis aux Européens de s'aventurer au loin.
  criteres:
  - L'élève cite au moins une invention (boussole ou caravelle).
  - L'élève dit à quoi sert l'invention citée.
  - L'élève relie cette invention à un repère chronologique (1492 ou 1519-1522).
  indices:
    relance: Quelle invention aide à se diriger, et laquelle aide à naviguer loin des côtes ?
    methode: Choisis une invention, dis à quoi elle sert, puis relie-la à un évènement daté.
    etape: 'Tu peux commencer ainsi : « Grâce à la boussole et à la caravelle... »'
  solution: Grâce à la boussole, qui indique le nord, et à la caravelle, un bateau solide, les Européens peuvent naviguer
    au grand large. C'est ainsi que Christophe Colomb débarque en Amérique en 1492.
- id: nblm-au-xve-siecle-quel-instrument-permet-aux-1
  type: choix
  difficulte: 2
  enonce: Au XVe siècle, quel instrument permet aux marins d'indiquer le nord et de se diriger en mer ?
  reponse:
    options:
    - id: o1
      texte: La boussole
    - id: o2
      texte: La caravelle
    - id: o3
      texte: Le château fort
    - id: o4
      texte: L'imprimerie
    bonnes:
    - o1
  indices:
    relance: C'est un outil d'orientation doté d'une aiguille indiquant une direction cardinale.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : la caravelle est un type de bateau, pas un instrument d''orientation.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le château fort est une demeure seigneuriale du Moyen Âge, rien à voir avec la navigation.'
  - si:
      contient:
      - o4
    relance: 'Erreur : l''imprimerie concerne la fabrication des livres, pas la navigation au grand large.'
  solution: 'La boussole. C''est la bonne réponse : la boussole est l''instrument qui indique le nord et aide à se diriger
    en mer.'
- id: nblm-quel-type-de-bateau-est-capable-d-affron-2
  type: choix
  difficulte: 2
