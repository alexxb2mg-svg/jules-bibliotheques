format: 2
notion: cm1-progres-techniques-navigation
version: 1
etat: verifiee
declencheurs:
- boussole
- caravelle
- naviguer loin en mer
- grands explorateurs
- tour du monde
- débarquement en amérique
prerequis:
- cm1-societe-ordres-clerge-noblesse-tiers-etat
couverture: 'Ne couvre que ce que dit le programme : les progrès techniques (boussole et caravelle) qui ont permis aux Européens
  de s''aventurer vers de nouveaux territoires, et les repères 1492 et 1519-1522.'
essentiel: 'À partir du XVe siècle, des progrès techniques permettent aux Européens de s''aventurer vers de nouveaux territoires,
  en naviguant au grand large.


  Deux de ces inventions sont la boussole, qui indique le nord, et la caravelle, un type de bateau capable d''affronter la
  haute mer.


  En 1492, Christophe Colomb débarque en Amérique.


  De 1519 à 1522, l''expédition de Magellan fait le tour du monde.'
methode:
- 'Mémoriser le nom d''au moins deux inventions : la boussole et la caravelle.'
- Relier 1492 à l'arrivée de Christophe Colomb en Amérique.
- Relier 1519-1522 à l'expédition de Magellan, qui fait le tour du monde.
- Vérifier que l'on sait dire à quoi sert chaque invention citée.
vocabulaire:
- terme: caravelle
  definition: type de bateau utilisé par les Européens pour naviguer au grand large
- terme: boussole
  definition: instrument qui indique le nord et aide à se diriger en mer
erreurs_frequentes:
- Confondre la date de l'arrivée de Christophe Colomb en Amérique (1492) et la durée de l'expédition de Magellan (1519-1522).
- Oublier de nommer au moins une invention (boussole ou caravelle) permettant la navigation au grand large.
exemple:
  enonce: Cite le nom d'une invention qui permet aux Européens de naviguer au grand large.
  solution: La boussole, ou la caravelle.
exercices:
- id: annee-colomb
  type: nombre
  difficulte: 1
  enonce: En quelle année Christophe Colomb débarque-t-il en Amérique ?
  reponse:
    valeur: 1492
    forme: entier
  indices:
    relance: Cette date est l'une des plus connues des grandes explorations.
    methode: Elle marque l'arrivée des Européens sur un nouveau continent, l'Amérique.
    etape: L'expédition de Magellan a lieu plus tard, entre 1519 et 1522. Colomb arrive avant.
  pieges:
  - si:
      valeur: 1519
    relance: 1519, c'est le début de l'expédition de Magellan. Colomb débarque bien avant.
  - si:
      valeur: 1522
    relance: 1522, c'est la fin de l'expédition de Magellan. Cherche une date plus ancienne pour Colomb.
  solution: Christophe Colomb débarque en Amérique en 1492.
- id: duree-magellan
  type: nombre
  difficulte: 2
  enonce: L'expédition de Magellan dure de 1519 à 1522. Combien d'années dure-t-elle ?
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Pour trouver une durée, que fais-tu avec les deux dates ?
    methode: Soustrais la date de début à la date de fin.
    etape: Calcule 1522 moins 1519.
  pieges:
  - si:
      valeur: 1519
    relance: Ce n'est pas une durée mais une date de début. Fais la soustraction 1522 - 1519.
  - si:
      valeur: 1522
    relance: Ce n'est pas une durée mais une date de fin. Fais la soustraction 1522 - 1519.
  solution: L'expédition de Magellan dure 1522 - 1519 = 3 ans.
- id: nom-invention-navigation
  type: texte_court
  difficulte: 1
  enonce: Quel type de bateau permet aux Européens de naviguer au grand large ?
  reponse:
    acceptees:
    - caravelle
    fautes_tolerees: 1
  indices:
    relance: Ce mot est cité dans le vocabulaire de ta leçon.
    methode: C'est un type de bateau, pas un instrument de mesure.
    etape: Ce mot commence par « cara- ».
  pieges:
  - si:
      valeur: boussole
    relance: La boussole est un instrument, pas un bateau. Cherche le nom du bateau.
  solution: La caravelle, un type de bateau utilisé par les Européens pour naviguer au grand large.
- id: chronologie-explorations
  type: ordre
  difficulte: 2
  enonce: Range ces trois évènements dans l'ordre chronologique.
  reponse:
    elements:
    - id: colomb
      texte: Christophe Colomb débarque en Amérique
    - id: depart
      texte: L'expédition de Magellan commence
    - id: retour
      texte: L'expédition de Magellan achève son tour du monde
  indices:
    relance: Compare les dates 1492, 1519 et 1522.
    methode: 1492 est une date plus ancienne que 1519, elle-même plus ancienne que 1522.
    etape: Colomb débarque en 1492, avant le début de l'expédition de Magellan en 1519.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux évènements voisins sont inversés. Compare leurs dates.
  - si:
      diagnostic: ordre_faux
    relance: 'Repère d''abord le plus ancien des trois évènements : Colomb débarque en 1492.'
  solution: D'abord l'arrivée de Christophe Colomb en Amérique (1492), puis le début de l'expédition de Magellan (1519), puis
    la fin de son tour du monde (1522).
- id: association-inventions
  type: association
  difficulte: 2
  enonce: Relie chaque invention à ce qu'elle permet de faire.
  reponse:
    gauche:
    - id: a
      texte: La boussole
    - id: b
      texte: La caravelle
    droite:
    - id: x
      texte: Indiquer le nord pour se diriger en mer
    - id: y
      texte: Naviguer au grand large grâce à sa solidité
    paires:
      a: x
      b: y
  indices:
    relance: L'une des deux inventions est un bateau, l'autre un instrument de mesure.
    methode: Un instrument de mesure indique une direction ; un bateau permet de naviguer.
    etape: La boussole indique le nord. Que fait la caravelle ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends les deux inventions une par une.
  solution: La boussole indique le nord pour se diriger en mer ; la caravelle est le bateau qui permet de naviguer au grand
    large.
- id: pourquoi-progres-techniques
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases pourquoi les progrès techniques ont permis aux Européens de s'aventurer au loin.
  criteres:
  - L'élève cite au moins une invention (boussole ou caravelle).
  - L'élève relie cette invention à un repère chronologique (1492 ou 1519-1522).
  indices:
    relance: Quelle invention aide à se diriger, et laquelle aide à naviguer loin des côtes ?
    methode: Choisis une invention, dis à quoi elle sert, puis relie-la à un évènement daté.
    etape: 'Tu peux commencer ainsi : « Grâce à la boussole et à la caravelle... »'
  solution: Grâce à la boussole, qui indique le nord, et à la caravelle, un bateau solide, les Européens peuvent naviguer
    au grand large. C'est ainsi que Christophe Colomb débarque en Amérique en 1492.
