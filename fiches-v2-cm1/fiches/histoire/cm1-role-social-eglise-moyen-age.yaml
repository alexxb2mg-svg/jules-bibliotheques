- id: role-social-ouverte
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases le rôle social de l'Église au Moyen Âge, avec un exemple d'action et un exemple
    de bâtiment repère.
  criteres:
  - L'élève cite l'assistance aux pauvres et aux malades et l'enseignement.
  - L'élève donne un exemple concret d'action (nourrir un pauvre, soigner un malade, apprendre à lire à un enfant).
  - L'élève cite au moins un bâtiment repère (abbaye de Cluny ou cathédrale Notre-Dame de Paris, ou un bâtiment proche).
  indices:
    relance: Deux aspects du rôle social sont à citer, puis un exemple d'action et un exemple de bâtiment.
    methode: Utilise le vocabulaire de ta fiche pour chaque aspect.
    etape: Commence par « L'Église assiste... » puis cite un bâtiment.
  solution: L'Église assiste les pauvres et les malades, par exemple en soignant les malades, et elle assure l'enseignement,
    par exemple quand des moines apprennent à lire à des enfants. On peut citer comme repère l'abbaye de Cluny ou la cathédrale
    Notre-Dame de Paris.
- id: nblm-au-moyen-age-quel-est-le-role-social-con-1
  type: choix
  difficulte: 2
  enonce: Au Moyen Âge, quel est le rôle social concret de l'Église auprès des personnes démunies et des malades ?
  reponse:
    options:
    - id: o1
      texte: Elle assure l'assistance aux pauvres et aux malades.
    - id: o2
      texte: Elle s'occupe uniquement de prier sans jamais aider la population.
    - id: o3
      texte: Elle oblige les paysans à construire des châteaux fortifiés.
    - id: o4
      texte: Elle interdit de soigner les personnes souffrantes.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi que l'Église n'a pas seulement une mission spirituelle, mais aussi une action solidaire au quotidien.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : il ne faut pas oublier que l''Église a un rôle social concret d''assistance auprès de la
      population et ne se limite pas à la prière.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur : la construction des châteaux concerne le domaine du seigneur et la seigneurie, pas le rôle
      social de l''Église.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : soigner et assister les malades fait pleinement partie du rôle social assuré par l''Église.'
  solution: 'Elle assure l''assistance aux pauvres et aux malades. C''est exact : l''Église joue un rôle social concret en
    apportant de l''aide et de l''assistance aux pauvres et aux personnes souffrantes.'
