format: 2
notion: cm1-role-social-eglise-moyen-age
version: 3
etat: verifiee
declencheurs:
- aider les pauvres au moyen âge
- soigner les malades autrefois
- apprendre à lire au moyen âge
- bâtiment religieux célèbre
- rôle des moines
- lieu de prière et de soin
- grande église d'une ville
- là où vivent les moines
prerequis:
- cm1-seigneurie-et-paroisse
essentiel: 'Au Moyen Âge, l''Église joue un rôle très important dans la vie des femmes et des hommes. Dans la paroisse, elle
  encadre leur vie de leur naissance à leur mort. Les religieux forment le clergé, et les paysans versent à l''Église une
  part de leurs récoltes : c''est la dîme.


  L''Église a aussi un rôle social : elle aide les gens dans leur vie de tous les jours. Ce rôle social a deux aspects.


  Le premier aspect est l''assistance aux pauvres et aux malades. Les religieux donnent de la nourriture aux pauvres et accueillent
  les malades pour les soigner.


  Le second aspect est l''enseignement. Des religieux, par exemple des moines, apprennent à lire et à écrire à des enfants.
  Ils transmettent ainsi le savoir.


  Deux bâtiments servent de repères. Une abbaye est un ensemble de bâtiments où vivent des moines ou des moniales, qui prient
  et travaillent ensemble : par exemple l''abbaye de Cluny. Une cathédrale est la grande église d''une ville : par exemple
  Notre-Dame de Paris. Tu peux aussi chercher une abbaye ou une cathédrale près de chez toi.


  Un exemple pour comprendre : aujourd''hui, l''école t''apprend à lire et l''hôpital soigne les malades. Au Moyen Âge, c''est
  souvent l''Église qui s''occupe de ces deux choses. Si un moine soigne un malade, c''est de l''assistance. S''il apprend
  à lire à un enfant, c''est de l''enseignement.

  '
methode:
- Se demander ce que fait l'Église pour aider les gens.
- 'Classer cette action : assistance aux pauvres et aux malades, ou enseignement ?'
- Associer « abbaye » à un lieu religieux de référence (par exemple Cluny, ou une abbaye près de chez toi).
- Associer « cathédrale » à un autre lieu religieux de référence (par exemple Notre-Dame de Paris, ou une cathédrale près
  de chez toi).
- Se rappeler que, dans la paroisse, l'Église encadre la vie des gens de leur naissance à leur mort.
vocabulaire:
- terme: Église
  definition: l'ensemble des chrétiens et des religieux ; avec une minuscule, une église est le bâtiment où l'on prie.
- terme: clergé
  definition: l'ensemble des religieux, comme les curés et les moines.
- terme: paroisse
  definition: le territoire où l'Église encadre la vie des habitants, de leur naissance à leur mort.
- terme: dîme
  definition: la part des récoltes que les paysans versent à l'Église.
- terme: abbaye
  definition: un ensemble de bâtiments religieux où vivent des moines ou des moniales, comme l'abbaye de Cluny.
- terme: cathédrale
  definition: la grande église d'une ville, comme Notre-Dame de Paris.
erreurs_frequentes:
- 'Oublier que l''Église a un rôle social concret : aider les pauvres et les malades, pas seulement prier.'
- 'Confondre une abbaye et une cathédrale : ce sont deux repères différents cités par le programme.'
- 'Ne citer qu''un seul aspect du rôle social : il y en a deux, l''assistance et l''enseignement.'
- 'Classer « apprendre à lire » dans l''assistance : apprendre, c''est l''enseignement.'
exemple:
  enonce: Cite les deux aspects du rôle social de l'Église au Moyen Âge, avec un exemple pour chacun.
  solution: 'Le premier aspect est l''assistance aux pauvres et aux malades : par exemple, des religieux donnent de la nourriture
    aux pauvres et soignent les malades. Le second aspect est l''enseignement : par exemple, des moines apprennent à lire
    et à écrire à des enfants.'
exercices:
- id: deux-aspects-role-social
  type: choix
  difficulte: 1
  enonce: Quels sont les deux aspects du rôle social de l'Église au Moyen Âge ?
  reponse:
    options:
    - id: a
      texte: L'assistance aux pauvres et aux malades, et l'enseignement
    - id: b
      texte: La construction de châteaux et la guerre
    - id: c
      texte: Le commerce et l'artisanat
    bonnes:
    - a
  indices:
    relance: Pense à aider des personnes en difficulté et à transmettre un savoir.
    methode: Le rôle social ne concerne pas la guerre ni le commerce.
    etape: Un aspect concerne la santé et la pauvreté, l'autre concerne le savoir.
  pieges:
  - si:
      contient:
      - b
    relance: La construction de châteaux et la guerre concernent le seigneur, pas le rôle social de l'Église.
  - si:
      contient:
      - c
    relance: Le commerce et l'artisanat sont des activités des villes, pas le rôle social de l'Église.
  solution: Les deux aspects sont l'assistance aux pauvres et aux malades, et l'enseignement.
- id: classer-actions-eglise
  type: association
  difficulte: 1
  enonce: Relie chaque action des religieux à l'aspect du rôle social de l'Église qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: Un moine apprend à lire à un enfant
    - id: b
      texte: Des religieux donnent du pain à des pauvres
    - id: c
      texte: Des religieux soignent un malade
    - id: d
      texte: Une moniale apprend à écrire à une fille
    droite:
    - id: x
      texte: L'assistance aux pauvres et aux malades
    - id: y
      texte: L'enseignement
    paires:
      a: y
      b: x
      c: x
      d: y
  indices:
    relance: Pour chaque action, demande-toi si l'on aide quelqu'un qui souffre, ou si l'on transmet un savoir.
    methode: Lire et écrire, c'est apprendre. Nourrir et soigner, c'est aider.
    etape: Donner du pain à des pauvres, c'est aider des personnes en difficulté. Continue avec les autres actions.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque action en te demandant si elle transmet un savoir.
  - si:
      diagnostic: associations_fausses
    relance: Fais deux paquets, les actions où l'on apprend quelque chose et celles où l'on aide quelqu'un qui souffre.
  solution: 'Enseignement : apprendre à lire et apprendre à écrire. Assistance : donner du pain aux pauvres et soigner un
    malade.'
