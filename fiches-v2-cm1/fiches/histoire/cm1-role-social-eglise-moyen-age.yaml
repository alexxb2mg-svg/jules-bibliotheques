format: 2
notion: cm1-role-social-eglise-moyen-age
version: 1
etat: verifiee
declencheurs:
- aider les pauvres au moyen âge
- soigner les malades autrefois
- apprendre à lire au moyen âge
- bâtiment religieux célèbre
- rôle des moines
- lieu de prière et de soin
prerequis:
- cm1-seigneurie-et-paroisse
couverture: 'Ne couvre que ce que dit le programme : le rôle social de l''Église (assistance aux pauvres et malades, enseignement)
  et les repères d''une abbaye et d''une cathédrale.'
essentiel: 'Au Moyen Âge, l''Église joue un rôle important dans la vie des femmes et des hommes.


  Elle a un rôle social : elle assiste les pauvres et les malades, et elle assure l''enseignement.


  Deux bâtiments sont des repères de ce rôle : une abbaye (par exemple l''abbaye de Cluny) et une cathédrale (par exemple
  Notre-Dame de Paris).'
methode:
- 'Se demander ce que fait l''Église pour aider les gens : assistance ou enseignement.'
- Associer « abbaye » à un lieu religieux de référence (par exemple Cluny).
- Associer « cathédrale » à un autre lieu religieux de référence (par exemple Notre-Dame de Paris).
vocabulaire:
- terme: abbaye
  definition: bâtiment religieux, repère du rôle de l'Église au Moyen Âge
- terme: cathédrale
  definition: grande église, repère du rôle de l'Église au Moyen Âge
erreurs_frequentes:
- 'Oublier que l''Église a un rôle social concret : aider les pauvres et les malades, pas seulement prier.'
- 'Confondre une abbaye et une cathédrale : ce sont deux repères différents cités par le programme.'
exemple:
  enonce: Cite les deux aspects du rôle social de l'Église au Moyen Âge.
  solution: L'assistance aux pauvres et aux malades, et l'enseignement.
exercices:
- id: deux-aspects-role-social
  type: choix
  difficulte: 1
  enonce: Quels sont les deux aspects du rôle social de l'Église au Moyen Âge ?
  reponse:
    options:
    - id: a
      texte: L'assistance aux pauvres et aux malades, et l'enseignement
    - id: b
      texte: La construction de châteaux et la guerre
    - id: c
      texte: Le commerce et l'artisanat
    bonnes:
    - a
  indices:
    relance: Pense à aider des personnes en difficulté et à transmettre un savoir.
    methode: Le rôle social ne concerne pas la guerre ni le commerce.
    etape: Un aspect concerne la santé et la pauvreté, l'autre concerne le savoir.
  pieges:
  - si:
      contient:
      - b
    relance: La construction de châteaux et la guerre concernent le seigneur, pas le rôle social de l'Église.
  - si:
      contient:
      - c
    relance: Le commerce et l'artisanat sont des activités des villes, pas le rôle social de l'Église.
  solution: Les deux aspects sont l'assistance aux pauvres et aux malades, et l'enseignement.
- id: nom-abbaye-repere
  type: texte_court
  difficulte: 2
  enonce: Quelle abbaye est citée comme repère du Moyen Âge dans ton cours ?
  reponse:
    acceptees:
    - cluny
    - abbaye de cluny
    fautes_tolerees: 1
  indices:
    relance: Ce n'est pas une cathédrale, mais une abbaye.
    methode: Le nom de ce lieu commence par la lettre C.
    etape: C'est un des deux bâtiments repères du rôle de l'Église, avec la cathédrale.
  pieges:
  - si:
      valeur: notre-dame
    relance: Notre-Dame de Paris est une cathédrale, pas l'abbaye repère de ce cours.
  solution: L'abbaye de Cluny.
- id: nom-cathedrale-repere
  type: texte_court
  difficulte: 2
  enonce: Quelle cathédrale est citée comme repère du Moyen Âge dans ton cours ?
  reponse:
    acceptees:
    - notre-dame de paris
    - notre-dame
    fautes_tolerees: 1
  indices:
    relance: Ce n'est pas une abbaye, mais une cathédrale.
    methode: Cette cathédrale est très connue et se trouve dans la capitale de la France.
    etape: C'est un des deux bâtiments repères du rôle de l'Église, avec l'abbaye.
  pieges:
  - si:
      valeur: cluny
    relance: Cluny est une abbaye, pas la cathédrale repère de ce cours.
  solution: La cathédrale Notre-Dame de Paris.
- id: abbaye-ou-cathedrale
  type: association
  difficulte: 2
  enonce: Relie chaque bâtiment à sa description.
  reponse:
    gauche:
    - id: a
      texte: abbaye
    - id: b
      texte: cathédrale
    droite:
    - id: x
      texte: bâtiment religieux, repère du rôle de l'Église, exemple Cluny
    - id: y
      texte: grande église, repère du rôle de l'Église, exemple Notre-Dame de Paris
    paires:
      a: x
      b: y
  indices:
    relance: Un des deux bâtiments a pour exemple Cluny, l'autre Notre-Dame de Paris.
    methode: Relis le vocabulaire de ta fiche pour chaque mot.
    etape: Commence par retrouver l'exemple donné pour l'abbaye.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse, relis les deux descriptions.
  - si:
      diagnostic: associations_fausses
    relance: Recommence en associant d'abord l'abbaye à son exemple, Cluny.
  solution: 'Abbaye : bâtiment religieux, exemple Cluny. Cathédrale : grande église, exemple Notre-Dame de Paris.'
- id: enseignement-moines
  type: choix
  difficulte: 3
  enonce: Un enfant du Moyen Âge apprend à lire auprès de moines. À quel aspect du rôle social de l'Église cela correspond-il
    ?
  reponse:
    options:
    - id: a
      texte: L'enseignement
    - id: b
      texte: L'assistance aux pauvres et aux malades
    - id: c
      texte: La construction de cathédrales
    bonnes:
    - a
  indices:
    relance: Apprendre à lire, c'est recevoir un savoir.
    methode: Le rôle social de l'Église a deux aspects, un seul concerne le savoir.
    etape: Ce n'est pas de l'aide médicale ni matérielle.
  pieges:
  - si:
      contient:
      - b
    relance: L'assistance aux pauvres et aux malades concerne la santé et la pauvreté, pas l'apprentissage de la lecture.
  - si:
      contient:
      - c
    relance: Construire des cathédrales n'est pas décrit comme un des deux aspects du rôle social de l'Église dans ce cours.
  solution: Cela correspond à l'enseignement, un des deux rôles sociaux de l'Église.
- id: role-social-ouverte
  type: ouverte
  difficulte: 3
  enonce: Explique en deux phrases le rôle social de l'Église au Moyen Âge, avec un exemple de bâtiment repère.
  criteres:
  - L'élève cite l'assistance aux pauvres et aux malades et l'enseignement.
  - L'élève cite au moins un bâtiment repère (abbaye de Cluny ou cathédrale Notre-Dame de Paris).
  indices:
    relance: Deux aspects du rôle social sont à citer, puis un exemple de bâtiment.
    methode: Utilise le vocabulaire de ta fiche pour chaque aspect.
    etape: Commence par « L'Église assiste... » puis cite un bâtiment.
  solution: L'Église assiste les pauvres et les malades, et elle assure l'enseignement. On peut citer comme repère l'abbaye
    de Cluny ou la cathédrale Notre-Dame de Paris.
