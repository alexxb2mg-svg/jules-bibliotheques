  type: choix
  difficulte: 2
  enonce: Comment le château de Versailles exprime-t-il le pouvoir absolu de Louis XIV ?
  reponse:
    options:
    - id: o1
      texte: Par sa taille immense et sa richesse qui montrent sa puissance.
    - id: o2
      texte: Par sa petite taille qui ressemble à une simple maison de village.
    - id: o3
      texte: Parce qu'il servait uniquement de prison fortifiée pour le royaume.
    - id: o4
      texte: Parce qu'il appartenait aux paysans du tiers état.
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments d'architecture et de décoration qui impressionnent les visiteurs.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
