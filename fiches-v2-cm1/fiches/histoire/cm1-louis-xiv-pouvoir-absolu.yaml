format: 2
notion: cm1-louis-xiv-pouvoir-absolu
version: 3
etat: generee
declencheurs:
- roi qui détient tout le pouvoir
- château très grand et richement décoré
- règne le plus long de l'histoire de France
- personnes qui entourent le roi
- symbole de la puissance royale
- roi du XVIIe siècle tout-puissant
- entourage du roi à versailles
- roi qui décide de tout
- femmes à la cour du roi
prerequis:
- cm1-henri-iv-pacificateur
couverture: Le texte officiel ne détaille pas le rôle des femmes à la Cour de Versailles ; la fiche dit seulement qu'elles
  en font partie et y ont un rôle, sans exemples précis.
essentiel: 'Louis XIV est un roi de France. Il règne de 1643 à 1715, soit 72 ans : c''est un règne très long.


  Louis XIV affirme son pouvoir absolu. Cela veut dire qu''il détient tout le pouvoir : c''est lui qui décide, et il ne partage
  ce pouvoir avec personne. On parle de monarchie absolue.


  Le château de Versailles exprime ce pouvoir absolu. Il est immense et très riche. Sa taille et sa richesse montrent à tous
  la puissance du roi. Quand on le voit, on comprend que celui qui y vit est le personnage le plus puissant du royaume. Le
  roi y vit entouré de la Cour, son entourage.


  Les femmes ont un rôle à la Cour de Versailles. Elles font partie de l''entourage du roi, comme les hommes, et participent
  à la vie de la Cour. Le programme te demande de savoir décrire ce rôle : ta maîtresse ou ton maître t''en montrera des exemples.


  Pour situer Louis XIV sur une frise, retiens trois rois : François Ier (1515-1547), puis Henri IV (1589-1610), puis Louis
  XIV (1643-1715). Louis XIV est le plus récent des trois.


  Un exemple pour comprendre le pouvoir absolu : imagine un capitaine d''équipe qui décide tout seul. Il fixe les règles du
  jeu, choisit qui joue et qui est puni, sans demander l''avis de personne.

  '
methode:
- Retenir que Louis XIV règne de 1643 à 1715.
- Associer Louis XIV à l'expression « pouvoir absolu » (il détient tout le pouvoir).
- Expliquer comment le château de Versailles exprime ce pouvoir absolu du roi, par sa taille et sa richesse.
- Se rappeler que les femmes, comme les hommes, ont un rôle à la Cour de Versailles.
- Placer Louis XIV sur une frise, après François Ier et Henri IV.
vocabulaire:
- terme: monarchie absolue
  definition: un pouvoir royal où le roi détient tout le pouvoir, affirmé par Louis XIV.
- terme: règne
  definition: la période pendant laquelle un roi gouverne.
- terme: château de Versailles
  definition: l'immense château de Louis XIV, qui montre sa puissance.
- terme: Cour
  definition: l'entourage du roi, les femmes et les hommes qui vivent autour de lui.
- terme: courtisan
  definition: une personne qui vit à la Cour, près du roi.
erreurs_frequentes:
- 'Oublier que Louis XIV a régné très longtemps : de 1643 à 1715.'
- Ne pas savoir expliquer en quoi le château de Versailles est un symbole du pouvoir absolu, et pas seulement une belle maison.
- 'Croire que seuls les hommes ont un rôle à la Cour : les femmes y participent aussi.'
- 'Placer Louis XIV avant Henri IV sur la frise : il est le plus récent des trois rois du programme.'
exemple:
  enonce: Explique en une ou deux phrases comment le château de Versailles exprime le pouvoir absolu de Louis XIV.
  solution: Par sa taille immense et sa richesse, le château de Versailles montre à tous la puissance du roi qui détient tout
    le pouvoir. Le roi y vit entouré de la Cour, les femmes et les hommes qui forment son entourage.
exercices:
- id: expression-pouvoir-louis-xiv
  type: choix
  difficulte: 1
  enonce: Quelle expression désigne le pouvoir royal de Louis XIV, qui détient tout le pouvoir ?
  reponse:
    options:
    - id: a
      texte: Le pouvoir absolu
    - id: b
      texte: Le pouvoir pacificateur
    - id: c
      texte: Le mécénat
    bonnes:
    - a
  indices:
    relance: Cette expression signifie que le roi détient TOUT le pouvoir, sans partage.
    methode: Ce n'est ni le mot qui décrit Henri IV, ni celui qui décrit François Ier.
    etape: L'expression contient le mot « pouvoir ».
  pieges:
  - si:
      contient:
      - b
    relance: Un roi « pacificateur » ramène la paix, comme Henri IV, ce n'est pas Louis XIV dans cette notion.
  - si:
      contient:
      - c
    relance: Le mécénat, c'est soutenir des artistes, comme François Ier, ce n'est pas ce dont on parle ici.
  solution: On appelle cela le pouvoir absolu.
- id: annee-debut-regne-louis-xiv
  type: nombre
  difficulte: 1
  enonce: En quelle année commence le règne de Louis XIV ?
  reponse:
    valeur: 1643
    forme: entier
  indices:
    relance: Cette année est bien avant la fin de son règne, très long.
    methode: L'année a quatre chiffres et commence par 16.
    etape: Ce n'est pas l'année de fin de son règne.
  pieges:
  - si:
      valeur: 1715
    relance: 1715, c'est l'année où le règne de Louis XIV se termine, pas celle où il commence.
  solution: Le règne de Louis XIV commence en 1643.
- id: duree-regne-louis-xiv
  type: nombre
  difficulte: 2
  enonce: Combien d'années a duré le règne de Louis XIV (1643-1715) ?
  reponse:
    valeur: 72
    forme: entier
  indices:
    relance: Soustrais l'année de début à l'année de fin.
    methode: 1715 moins 1643.
    etape: Le résultat est un nombre à deux chiffres, supérieur à 50.
  pieges:
  - si:
      valeur: 1643
    relance: 1643 est l'année de début du règne, pas sa durée.
  - si:
      valeur: 1715
    relance: 1715 est l'année de fin du règne, pas sa durée.
  solution: 1715 - 1643 = 72 ans (vérification 1643 + 72 = 1715).
- id: role-versailles
  type: choix
  difficulte: 2
  enonce: Comment le château de Versailles exprime-t-il le pouvoir absolu de Louis XIV ?
  reponse:
    options:
    - id: a
      texte: Par sa taille immense et sa richesse, qui montrent la puissance du roi
    - id: b
      texte: Parce qu'il sert uniquement à cultiver la terre
    - id: c
      texte: Parce qu'il est un petit bâtiment discret
    bonnes:
    - a
  indices:
    relance: Pense à ce que l'on remarque en premier quand on voit ce château.
    methode: Le château n'est pas décrit comme petit ou agricole dans ta fiche.
    etape: La réponse parle de deux qualités du château qui montrent la puissance du roi.
  pieges:
  - si:
      contient:
      - b
    relance: Le château de Versailles n'est pas décrit comme un lieu de culture de la terre dans ta fiche.
  - si:
      contient:
      - c
    relance: Le château de Versailles est au contraire immense et richement décoré, pas petit et discret.
  solution: Par sa taille immense et sa richesse, le château de Versailles montre à tous la puissance du roi qui détient tout
    le pouvoir.
- id: nom-entourage-roi
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on l'entourage du roi, les femmes et les hommes qui vivent autour de lui au château de Versailles
    ?
  reponse:
    acceptees:
    - Cour
    - la Cour
    - Cour de Versailles
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne tout l'entourage du roi à Versailles, pas seulement sa famille.
    methode: Relis le vocabulaire de ta fiche. Cherche le mot dont la définition parle de l'entourage du roi.
    etape: Relis la partie de ta fiche sur le rôle des femmes à Versailles. Le mot y revient plusieurs fois.
  pieges:
  - si:
      valeur: famille
    relance: La famille du roi en fait partie, mais le mot désigne tout son entourage.
  solution: La Cour, l'entourage du roi.
- id: qui-a-un-role-a-la-cour
  type: choix
  difficulte: 2
  enonce: Qui a un rôle à la Cour de Versailles, l'entourage du roi Louis XIV ?
  reponse:
    options:
    - id: a
      texte: Les femmes, comme les hommes
    - id: b
      texte: Seulement les hommes
    - id: c
      texte: Seulement les enfants du roi
    bonnes:
    - a
  indices:
    relance: Ta fiche précise que ce ne sont pas seulement des hommes qui entourent le roi.
    methode: Pense à ce que dit le programme sur la place des femmes à la Cour.
    etape: La bonne réponse mentionne les deux, pas un seul groupe.
  pieges:
  - si:
      contient:
      - b
    relance: Les femmes ont aussi un rôle à la Cour de Versailles, pas seulement les hommes.
  - si:
      contient:
      - c
    relance: La Cour ne se limite pas aux enfants du roi, elle regroupe tout son entourage, hommes et femmes.
  solution: Les femmes ont un rôle à la Cour de Versailles, tout comme les hommes.
- id: frise-trois-rois
  type: ordre
  difficulte: 2
  enonce: Range ces trois règnes du plus ancien au plus récent.
  reponse:
    elements:
    - id: francois
      texte: Le règne de François Ier
    - id: henri
      texte: Le règne de Henri IV
    - id: louis
      texte: Le règne de Louis XIV
  indices:
    relance: Lequel de ces trois rois est le roi mécène de la Renaissance, au début du XVIe siècle ?
    methode: 'Compare les années de début de règne : 1515, 1589 et 1643.'
    etape: François Ier commence à régner en 1515, c'est le plus ancien des trois. Lequel vient ensuite ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux règnes voisins sont inversés. Compare leurs années de début.
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le roi dont le règne commence en 1515, puis range les deux autres.
  solution: François Ier (1515-1547), puis Henri IV (1589-1610), puis Louis XIV (1643-1715).
- id: louis-xiv-ouverte
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases pourquoi on dit que Louis XIV affirme son pouvoir absolu, avec l'exemple du château
    de Versailles.
  criteres:
  - L'élève explique que Louis XIV détient tout le pouvoir (pouvoir absolu).
  - L'élève relie ce pouvoir absolu au château de Versailles, symbole de sa puissance par sa taille et sa richesse.
  - L'élève situe le règne de Louis XIV (1643-1715) ou parle de la Cour qui entoure le roi, femmes et hommes.
  indices:
    relance: Une phrase sur le pouvoir absolu, une phrase sur le château de Versailles.
    methode: Utilise le vocabulaire de ta fiche pour chaque idée.
    etape: Termine par « le château de Versailles montre sa puissance ».
  solution: 'Louis XIV, qui règne de 1643 à 1715, affirme son pouvoir absolu, c''est-à-dire qu''il détient tout le pouvoir.
    Le château de Versailles exprime ce pouvoir : par sa taille immense et sa richesse, il montre à tous la puissance du roi.'
- id: nblm-que-signifie-l-expression-monarchie-abso-1
  type: choix
  difficulte: 2
  enonce: Que signifie l'expression « monarchie absolue » pour qualifier le gouvernement de Louis XIV ?
  reponse:
    options:
    - id: o1
      texte: Le roi détient tout le pouvoir à lui tout seul.
    - id: o2
      texte: Le roi partage l'ensemble de ses décisions avec les paysans.
    - id: o3
      texte: Le pouvoir est confié à des députés élus par le peuple.
    - id: o4
      texte: Le roi n'a aucun rôle et laisse les seigneurs tout diriger.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au sens du mot « absolu » pour décrire l'autorité du souverain.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur. Sous la monarchie absolue, le roi ne partage pas son pouvoir avec la population.
  - si:
      contient:
      - o3
    relance: Incorrect. Louis XIV ne tenait pas son pouvoir d'élections démocratiques.
  - si:
      contient:
      - o4
    relance: C'est le contraire. Un roi absolu contrôle et concentre tout le pouvoir entre ses mains.
  solution: Le roi détient tout le pouvoir à lui tout seul. C'est la bonne définition. Louis XIV affirme son pouvoir absolu
    en détenant l'ensemble des pouvoirs dans le royaume.
- id: nblm-pendant-quelles-annees-le-roi-louis-xiv-2
  type: choix
  difficulte: 2
  enonce: Pendant quelles années le roi Louis XIV a-t-il régné sur la France ?
  reponse:
    options:
    - id: o1
      texte: De 1643 à 1715.
    - id: o2
      texte: De 1515 à 1547.
    - id: o3
      texte: De 1589 à 1610.
    - id: o4
      texte: De 1789 à 1799.
    bonnes:
    - o1
  indices:
    relance: Recherche les deux dates du XVIIe siècle et du début du XVIIIe siècle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, ces années correspondent au règne du roi François Ier au XVIe siècle.
  - si:
      contient:
      - o3
    relance: Erreur fréquente. Cette période correspond au règne du roi Henri IV.
  - si:
      contient:
      - o4
    relance: Faux. L'année 1789 est le début de la Révolution française qui met fin à la monarchie absolue.
  solution: De 1643 à 1715. Exact ! Louis XIV a régné de 1643 à 1715, ce qui constitue un règne particulièrement long.
