# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-louis-xiv-pouvoir-absolu
version: 1
etat: verifiee
declencheurs:
- roi qui détient tout le pouvoir
- château très grand et richement décoré
- règne le plus long de l'histoire de France
- personnes qui entourent le roi
- symbole de la puissance royale
- roi du XVIIe siècle tout-puissant
prerequis:
- cm1-henri-iv-pacificateur
couverture: 'Ne couvre que ce que dit le programme : Louis XIV (1643-1715), roi qui affirme son pouvoir absolu, le château
  de Versailles, et le rôle des femmes à la Cour de Versailles.'
essentiel: 'Louis XIV est un roi de France qui a régné de 1643 à 1715, un règne très long.


  C''est un roi qui affirme son pouvoir absolu : il détient tout le pouvoir.


  Le château de Versailles exprime ce pouvoir absolu du roi : sa taille et sa richesse montrent sa puissance.


  Les femmes ont un rôle à la Cour de Versailles, l''entourage du roi.'
methode:
- Retenir que Louis XIV règne de 1643 à 1715.
- Associer Louis XIV à l'expression « pouvoir absolu ».
- Expliquer comment le château de Versailles exprime ce pouvoir absolu du roi.
- Se rappeler que les femmes ont un rôle à la Cour de Versailles.
vocabulaire:
- terme: monarchie absolue
  definition: un pouvoir royal où le roi détient tout le pouvoir, affirmé par Louis XIV
erreurs_frequentes:
- 'Oublier que Louis XIV a régné très longtemps : de 1643 à 1715.'
- Ne pas savoir expliquer en quoi le château de Versailles est un symbole du pouvoir absolu, et pas seulement une belle maison.
exemple:
  enonce: Explique en une phrase comment le château de Versailles exprime le pouvoir absolu de Louis XIV.
  solution: Par sa taille immense et sa richesse, le château de Versailles montre à tous la puissance du roi qui détient tout
    le pouvoir.
exercices:
- id: expression-pouvoir-louis-xiv
  type: choix
  difficulte: 1
  enonce: Quelle expression désigne le pouvoir royal de Louis XIV, qui détient tout le pouvoir ?
  reponse:
    options:
    - id: a
      texte: Le pouvoir absolu
    - id: b
      texte: Le pouvoir pacificateur
    - id: c
      texte: Le mécénat
    bonnes:
    - a
  indices:
    relance: Cette expression signifie que le roi détient TOUT le pouvoir, sans partage.
    methode: Ce n'est ni le mot qui décrit Henri IV, ni celui qui décrit François Ier.
    etape: L'expression contient le mot « pouvoir ».
  pieges:
  - si:
      contient:
      - b
    relance: Un roi « pacificateur » ramène la paix, comme Henri IV, ce n'est pas Louis XIV dans cette notion.
  - si:
      contient:
      - c
    relance: Le mécénat, c'est soutenir des artistes, comme François Ier, ce n'est pas ce dont on parle ici.
  solution: On appelle cela le pouvoir absolu.
- id: annee-debut-regne-louis-xiv
  type: nombre
  difficulte: 1
  enonce: En quelle année commence le règne de Louis XIV ?
  reponse:
    valeur: 1643
    forme: entier
  indices:
    relance: Cette année est bien avant la fin de son règne, très long.
    methode: L'année a quatre chiffres et commence par 16.
    etape: Ce n'est pas l'année de fin de son règne.
  pieges:
  - si:
      valeur: 1715
    relance: 1715, c'est l'année où le règne de Louis XIV se termine, pas celle où il commence.
  solution: Le règne de Louis XIV commence en 1643.
- id: duree-regne-louis-xiv
  type: nombre
  difficulte: 2
  enonce: Combien d'années a duré le règne de Louis XIV (1643-1715) ?
  reponse:
    valeur: 72
    forme: entier
  indices:
    relance: Soustrais l'année de début à l'année de fin.
    methode: 1715 moins 1643.
    etape: Le résultat est un nombre à deux chiffres, supérieur à 50.
  pieges:
  - si:
      valeur: 1643
    relance: 1643 est l'année de début du règne, pas sa durée.
  - si:
      valeur: 1715
    relance: 1715 est l'année de fin du règne, pas sa durée.
  solution: 1715 - 1643 = 72 ans.
- id: role-versailles
  type: choix
  difficulte: 2
  enonce: Comment le château de Versailles exprime-t-il le pouvoir absolu de Louis XIV ?
  reponse:
    options:
    - id: a
      texte: Par sa taille immense et sa richesse, qui montrent la puissance du roi
    - id: b
      texte: Parce qu'il sert uniquement à cultiver la terre
    - id: c
      texte: Parce qu'il est un petit bâtiment discret
    bonnes:
    - a
  indices:
    relance: Pense à ce que l'on remarque en premier quand on voit ce château.
    methode: Le château n'est pas décrit comme petit ou agricole dans ta fiche.
    etape: La réponse parle de deux qualités du château qui montrent la puissance du roi.
  pieges:
  - si:
      contient:
      - b
    relance: Le château de Versailles n'est pas décrit comme un lieu de culture de la terre dans ta fiche.
  - si:
      contient:
      - c
    relance: Le château de Versailles est au contraire immense et richement décoré, pas petit et discret.
  solution: Par sa taille immense et sa richesse, le château de Versailles montre à tous la puissance du roi qui détient tout
    le pouvoir.
- id: qui-a-un-role-a-la-cour
  type: choix
  difficulte: 2
  enonce: Qui a un rôle à la Cour de Versailles, l'entourage du roi Louis XIV ?
  reponse:
    options:
    - id: a
      texte: Les femmes, comme les hommes
    - id: b
      texte: Seulement les hommes
    - id: c
      texte: Seulement les enfants du roi
    bonnes:
    - a
  indices:
    relance: Ta fiche précise que ce ne sont pas seulement des hommes qui entourent le roi.
    methode: Pense à ce que dit le programme sur la place des femmes à la Cour.
    etape: La bonne réponse mentionne les deux, pas un seul groupe.
  pieges:
  - si:
      contient:
      - b
    relance: Les femmes ont aussi un rôle à la Cour de Versailles, pas seulement les hommes.
  - si:
      contient:
      - c
    relance: La Cour ne se limite pas aux enfants du roi, elle inclut d'autres nobles, hommes et femmes.
  solution: Les femmes ont un rôle à la Cour de Versailles, tout comme les hommes.
- id: louis-xiv-ouverte
  type: ouverte
  difficulte: 3
  enonce: Explique en deux phrases pourquoi on dit que Louis XIV affirme son pouvoir absolu, avec l'exemple du château de
    Versailles.
  criteres:
  - L'élève explique que Louis XIV détient tout le pouvoir (pouvoir absolu).
  - L'élève relie ce pouvoir absolu au château de Versailles, symbole de sa puissance par sa taille et sa richesse.
  indices:
    relance: Une phrase sur le pouvoir absolu, une phrase sur le château de Versailles.
    methode: Utilise le vocabulaire de ta fiche pour chaque idée.
    etape: Termine par « le château de Versailles montre sa puissance ».
  solution: 'Louis XIV affirme son pouvoir absolu, c''est-à-dire qu''il détient tout le pouvoir. Le château de Versailles
    exprime ce pouvoir : par sa taille immense et sa richesse, il montre à tous la puissance du roi.'
