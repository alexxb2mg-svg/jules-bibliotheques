format: 2
notion: cm1-seigneurie-et-paroisse
version: 1
etat: verifiee
declencheurs:
- qui protège le village
- domaine du seigneur
- vivre au moyen âge
- frise du moyen âge
- de la naissance à la mort
- trois fonctions du château
prerequis: []
couverture: 'Ne couvre que ce que dit le programme : les définitions de la seigneurie et de la paroisse, les trois fonctions
  du château, et la frise du Moyen Âge (476-1492, XIe-XIIIe siècle).'
essentiel: 'Au Moyen Âge, entre le XIe et le XIIIe siècle, la vie des femmes et des hommes est organisée par deux cadres.


  La seigneurie, c''est la domination d''un seigneur sur un territoire et sur les hommes qui y vivent.


  La paroisse, c''est l''encadrement par l''Église de la vie des femmes et des hommes, de leur naissance à leur mort.


  Le seigneur habite un château. Ce château a trois fonctions : il protège, il sert de lieu de vie au seigneur, et il est
  le symbole de sa puissance.


  Sur la frise chronologique, le Moyen Âge va de 476 à 1492 ; les XIe-XIIIe siècles se situent au milieu de cette longue période.'
methode:
- Repérer si la phrase parle du territoire et du pouvoir (→ seigneurie) ou de l'Église (→ paroisse).
- 'Se rappeler les trois rôles du château : protéger, loger le seigneur, montrer sa puissance.'
- Situer une date ou une période sur la frise du Moyen Âge (476-1492).
- 'Vérifier : « qui commande le territoire ? » = le seigneur ; « qui encadre les âmes ? » = l''Église.'
vocabulaire:
- terme: seigneurie
  definition: la domination d'un seigneur sur un territoire et les hommes qui y vivent
- terme: paroisse
  definition: l'encadrement par l'Église de la vie des femmes et des hommes, de leur naissance à leur mort
erreurs_frequentes:
- Confondre seigneurie (pouvoir sur le territoire) et paroisse (encadrement religieux).
- Croire que le château ne sert qu'à se battre, en oubliant qu'il est aussi le lieu de vie du seigneur et un symbole de sa
  puissance.
- Placer le Moyen Âge n'importe où sur la frise, alors qu'il va précisément de 476 à 1492.
exemple:
  enonce: 'Un document dit : « Le seigneur possède des terres et les hommes qui y vivent lui doivent des services. » De quel
    cadre parle-t-on : la seigneurie ou la paroisse ?'
  solution: 'On parle de la seigneurie : le texte décrit la domination du seigneur sur un territoire et sur les hommes qui
    y vivent.'
exercices:
- id: mot-domination-seigneur
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne la domination d'un seigneur sur un territoire et sur les hommes qui y vivent ?
  reponse:
    acceptees:
    - seigneurie
    fautes_tolerees: 1
  indices:
    relance: Ce mot ne parle pas de l'Église, mais du pouvoir sur des terres et des hommes.
    methode: Cherche dans ton vocabulaire le mot qui commence comme « seigneur ».
    etape: Le mot se termine par « -ie », comme dans « seigneur » + « ie ».
  pieges:
  - si:
      valeur: paroisse
    relance: La paroisse, c'est l'encadrement par l'Église. Ici, on parle du pouvoir sur un territoire.
  solution: On appelle cela la seigneurie.
- id: qui-encadre-la-vie
  type: choix
  difficulte: 1
  enonce: Qui encadre la vie des femmes et des hommes, de leur naissance à leur mort, dans la paroisse ?
  reponse:
    options:
    - id: a
      texte: L'Église
    - id: b
      texte: Le seigneur
    - id: c
      texte: Le roi
    bonnes:
    - a
  indices:
    relance: 'Pense au mot « paroisse » : à quelle institution appartient-il ?'
    methode: La paroisse encadre la vie religieuse des gens, pas leur travail sur les terres.
    etape: Ce n'est ni le seigneur ni le roi qui suivent chaque personne de sa naissance à sa mort.
  pieges:
  - si:
      contient:
      - b
    relance: Le seigneur domine le territoire et les hommes, mais ce n'est pas lui qui encadre la vie religieuse.
  - si:
      contient:
      - c
    relance: Le roi gouverne le royaume, mais ce n'est pas lui qui suit chaque personne de sa naissance à sa mort.
  solution: C'est l'Église qui encadre la vie des femmes et des hommes, de leur naissance à leur mort, dans la paroisse.
- id: seigneurie-paroisse-chateau
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: seigneurie
    - id: b
      texte: paroisse
    - id: c
      texte: château
    droite:
    - id: x
      texte: domination d'un seigneur sur un territoire et les hommes qui y vivent
    - id: y
      texte: encadrement par l'Église de la vie des gens, de leur naissance à leur mort
    - id: z
      texte: lieu qui protège, où vit le seigneur, symbole de sa puissance
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un mot parle du territoire, un autre de l'Église, un autre d'un bâtiment.
    methode: Retrouve d'abord la définition du château, c'est un bâtiment avec trois rôles.
    etape: La seigneurie et la paroisse sont deux cadres différents ; le château est l'endroit où vit le seigneur.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les trois définitions une par une.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le château, c'est un bâtiment, puis distingue seigneurie et paroisse.
  solution: 'Seigneurie : domination du seigneur sur un territoire et les hommes. Paroisse : encadrement par l''Église de
    la naissance à la mort. Château : lieu de protection, de vie du seigneur et symbole de sa puissance.'
- id: debut-moyen-age
  type: nombre
  difficulte: 2
  enonce: En quelle année commence le Moyen Âge sur la frise chronologique ?
  reponse:
    valeur: 476
    forme: entier
  indices:
    relance: Cette année est bien avant l'an 1000.
    methode: Le Moyen Âge va de cette année jusqu'à 1492.
    etape: C'est une année à trois chiffres, juste après l'an 400.
  pieges:
  - si:
      valeur: 1492
    relance: 1492, c'est l'année où le Moyen Âge se termine, pas celle où il commence.
  solution: Le Moyen Âge commence en 476.
- id: fin-moyen-age
  type: nombre
  difficulte: 2
  enonce: En quelle année finit le Moyen Âge sur la frise chronologique ?
  reponse:
    valeur: 1492
    forme: entier
  indices:
    relance: Cette année est bien après l'an 1000.
    methode: Le Moyen Âge commence en 476 et dure très longtemps.
    etape: C'est une année à quatre chiffres qui commence par 14.
  pieges:
  - si:
      valeur: 476
    relance: 476, c'est l'année où le Moyen Âge commence, pas celle où il finit.
  solution: Le Moyen Âge finit en 1492.
- id: troisieme-fonction-chateau
  type: choix
  difficulte: 2
  enonce: Le château protège et il est un symbole de la puissance du seigneur. Quelle est sa troisième fonction ?
  reponse:
    options:
    - id: a
      texte: Il est le lieu de vie du seigneur
    - id: b
      texte: Il est un lieu de marché
    - id: c
      texte: Il est une école pour les enfants du village
    bonnes:
    - a
  indices:
    relance: Le seigneur ne dort pas dehors, il habite quelque part.
    methode: Pense à ce que fait le seigneur chaque jour, en dehors de se défendre.
    etape: Le château sert aussi de maison au seigneur.
  pieges:
  - si:
      contient:
      - b
    relance: Le marché a lieu plutôt dans une ville, pas dans les trois fonctions du château.
  - si:
      contient:
      - c
    relance: Le château n'est pas décrit comme une école dans ton cours.
  solution: La troisième fonction du château est d'être le lieu de vie du seigneur.
- id: seigneurie-ou-paroisse-ouverte
  type: ouverte
  difficulte: 3
  enonce: Explique en deux phrases ce qu'est la seigneurie et ce qu'est la paroisse, au Moyen Âge.
  criteres:
  - L'élève définit la seigneurie comme la domination d'un seigneur sur un territoire et les hommes qui y vivent.
  - L'élève définit la paroisse comme l'encadrement par l'Église de la vie des gens, de leur naissance à leur mort.
  indices:
    relance: Un cadre concerne le territoire, l'autre concerne l'Église.
    methode: Écris une phrase pour chaque mot, en utilisant leur définition.
    etape: Commence par « La seigneurie, c'est... » puis « La paroisse, c'est... ».
  solution: La seigneurie, c'est la domination d'un seigneur sur un territoire et sur les hommes qui y vivent. La paroisse,
    c'est l'encadrement par l'Église de la vie des femmes et des hommes, de leur naissance à leur mort.
