- id: description-plantation
  type: choix
  difficulte: 2
  enonce: Comment sont les conditions de vie des esclaves dans une plantation ?
  reponse:
    options:
    - id: a
      texte: Très difficiles
    - id: b
      texte: Agréables et confortables
    - id: c
      texte: Identiques à celles des colons
    bonnes:
    - a
  indices:
    relance: Les esclaves sont-ils libres de leurs choix dans la plantation ?
    methode: Les esclaves sont forcés de travailler, sans liberté, pour le propriétaire de la plantation.
    etape: Ce ne sont ni des conditions confortables ni des conditions identiques à celles des propriétaires.
  pieges:
  - si:
      contient:
      - b
    relance: Les esclaves sont forcés de travailler sans liberté. Ce n'est pas agréable ni confortable.
  - si:
      contient:
      - c
    relance: Les propriétaires de plantation ne vivent pas dans les mêmes conditions que les esclaves qu'ils possèdent.
  solution: Les esclaves vivent et travaillent dans une plantation d'Amérique, dans des conditions de vie très difficiles
    imposées par leurs propriétaires.
