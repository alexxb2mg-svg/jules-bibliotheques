# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-traite-esclaves-plantations
version: 2
etat: verifiee
declencheurs:
- traite des esclaves
- commerce triangulaire
- plantations
- code noir
- esclavage entre l'afrique et l'amérique
- denrées venues des colonies
- esclaves africains
- sucre de canne et chocolat
prerequis:
- cm1-empires-coloniaux-amerindiens
essentiel: 'Du XVe au XVIIe siècle, des pays européens construisent des colonies en Amérique. Pour faire travailler les grandes
  exploitations agricoles de ces colonies, ils organisent la traite des esclaves.


  La traite des esclaves, c''est le commerce d''êtres humains. Des femmes et des hommes africains sont capturés en Afrique,
  puis emmenés de force en Amérique, de l''autre côté de l''océan. Un esclave est une personne qui n''est pas libre : elle
  appartient à quelqu''un, qui la force à travailler sans salaire.


  En Amérique, les esclaves travaillent dans des plantations, de grandes exploitations agricoles où l''on cultive par exemple
  la canne à sucre. Leurs conditions de vie sont très difficiles : ils travaillent de force, sans liberté et sans être payés.


  En 1685, le roi Louis XIV signe un édit royal, c''est-à-dire un texte de loi du roi, appelé le « Code noir ». Il organise
  l''esclavage dans les colonies françaises.


  Des échanges commerciaux ont lieu avec les colonies. On en rapporte en Europe des denrées : la tomate, le chocolat, le haricot,
  la pomme de terre et le sucre de canne. Ce sont des aliments que tu manges peut-être aujourd''hui.


  On parle de commerce triangulaire, car les bateaux relient trois continents : l''Europe, l''Afrique et l''Amérique.

  '
methode:
- Situer la traite des esclaves entre deux continents, l'Afrique et l'Amérique.
- Pour le commerce triangulaire, nommer les trois continents reliés (Europe, Afrique, Amérique).
- Décrire les conditions de vie difficiles des esclaves dans une plantation (travail forcé, sans liberté).
- Relier l'année 1685 au Code noir, un édit royal de Louis XIV.
- Nommer au moins une denrée issue des colonies.
vocabulaire:
- terme: commerce triangulaire
  definition: échanges commerciaux entre l'Europe, l'Afrique et l'Amérique liés à la traite des esclaves
- terme: plantation
  definition: grande exploitation agricole des colonies où travaillent des esclaves
- terme: Code noir
  definition: édit royal signé par Louis XIV en 1685 qui organise l'esclavage dans les colonies
- terme: esclave
  definition: personne qui n'est pas libre, qui appartient à quelqu'un et qui est forcée de travailler sans salaire
- terme: traite
  definition: commerce d'êtres humains capturés et vendus comme esclaves
- terme: denrée
  definition: produit qui se mange, comme le chocolat ou la tomate
erreurs_frequentes:
- 'Oublier que la traite des esclaves se fait entre deux continents : l''Afrique et l''Amérique.'
- Confondre les denrées venues des colonies avec des produits d'Europe.
- 'Placer le Code noir à une mauvaise date : il date de 1685.'
- Croire que les esclaves partent de leur plein gré, alors qu'ils sont capturés et emmenés de force.
exemple:
  enonce: En quelle année Louis XIV signe-t-il l'édit royal appelé le « Code noir », et à quoi sert ce texte ?
  solution: 'En 1685. Ce texte de loi du roi organise l''esclavage dans les colonies françaises : il concerne les esclaves
    africains emmenés de force en Amérique pour travailler dans les plantations.'
exercices:
- id: annee-code-noir
  type: nombre
  difficulte: 1
  enonce: En quelle année Louis XIV signe-t-il l'édit royal appelé le « Code noir » ?
  reponse:
    valeur: 1685
    forme: entier
  indices:
    relance: Cette date est un repère du programme sur la traite des esclaves.
    methode: C'est un édit royal signé par Louis XIV, dans la seconde moitié du XVIIe siècle.
    etape: C'est au XVIIe siècle, sous le règne de Louis XIV, plus de cent ans avant la Révolution de 1789.
  pieges:
  - si:
      valeur: 1789
    relance: 1789, c'est l'année de la Révolution française. Le Code noir est signé bien avant.
  - si:
      valeur: 1492
    relance: 1492, c'est l'arrivée de Christophe Colomb en Amérique. Le Code noir vient bien plus tard.
  solution: Louis XIV signe le Code noir en 1685.
- id: continents-traite
  type: choix
  difficulte: 1
  enonce: Entre quels deux continents se fait la traite des esclaves ?
  reponse:
    options:
    - id: a
      texte: L'Afrique et l'Amérique
    - id: b
      texte: L'Europe et l'Asie
    - id: c
      texte: L'Afrique et l'Europe
    bonnes:
    - a
  indices:
    relance: Le titre de cette fiche cite les deux continents.
    methode: Les esclaves sont capturés sur un continent et emmenés de force sur un autre, où sont les plantations.
    etape: Les plantations où travaillent les esclaves se trouvent en Amérique.
  pieges:
  - si:
      contient:
      - b
    relance: Ni l'Europe ni l'Asie ne sont les continents de la traite des esclaves étudiée ici.
  - si:
      contient:
      - c
    relance: Les esclaves ne restent pas en Europe. Ils sont emmenés de force sur un autre continent.
  solution: La traite des esclaves se fait entre l'Afrique et l'Amérique.
- id: denree-colonie
  type: texte_court
  difficulte: 1
  enonce: Cite une denrée issue des colonies, ramenée par les échanges commerciaux.
  reponse:
    acceptees:
    - chocolat
    - tomate
    - haricot
    - pomme de terre
    - sucre de canne
    - le chocolat
    - la tomate
    - le haricot
    - la pomme de terre
    - le sucre de canne
    fautes_tolerees: 1
  indices:
    relance: Pense à des aliments que tu manges peut-être aujourd'hui.
    methode: Le programme en cite plusieurs, dont un fruit rouge et un produit sucré venu de la canne.
    etape: Une de ces denrées sert à fabriquer des tablettes sucrées que tu connais bien.
  pieges: []
  solution: Par exemple le chocolat, ou la tomate, le haricot, la pomme de terre, le sucre de canne.
- id: trois-continents
  type: choix
  difficulte: 2
  enonce: Coche les trois continents reliés par le commerce triangulaire.
  reponse:
    options:
    - id: a
      texte: L'Europe
    - id: b
      texte: L'Afrique
    - id: c
      texte: L'Amérique
    - id: d
      texte: L'Asie
    - id: e
      texte: L'Océanie
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Plusieurs réponses sont justes. Un triangle a combien de côtés et de sommets ?
    methode: Pense d'où partent les bateaux, où sont capturés les esclaves, et où sont les plantations.
    etape: Les esclaves sont capturés en Afrique et emmenés en Amérique. D'où viennent les bateaux ?
  pieges:
  - si:
      contient:
      - d
    relance: L'Asie ne fait pas partie du commerce triangulaire étudié ici.
  - si:
      contient:
      - e
    relance: L'Océanie ne fait pas partie du commerce triangulaire étudié ici.
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une partie des bonnes réponses. Il y a trois continents à cocher.
  solution: 'Le commerce triangulaire relie trois continents : l''Europe, l''Afrique et l''Amérique.'
- id: description-plantation
  type: choix
  difficulte: 2
  enonce: Comment sont les conditions de vie des esclaves dans une plantation ?
  reponse:
    options:
    - id: a
      texte: Très difficiles
    - id: b
      texte: Agréables et confortables
    - id: c
      texte: Identiques à celles des colons
    bonnes:
    - a
  indices:
    relance: Les esclaves sont-ils libres de leurs choix dans la plantation ?
    methode: Les esclaves sont forcés de travailler, sans liberté, pour le propriétaire de la plantation.
    etape: Ce ne sont ni des conditions confortables ni des conditions identiques à celles des propriétaires.
  pieges:
  - si:
      contient:
      - b
    relance: Les esclaves sont forcés de travailler sans liberté. Ce n'est pas agréable ni confortable.
  - si:
      contient:
      - c
    relance: Les propriétaires de plantation ne vivent pas dans les mêmes conditions que les esclaves qu'ils possèdent.
  solution: Les esclaves vivent et travaillent dans une plantation d'Amérique, dans des conditions de vie très difficiles
    imposées par leurs propriétaires.
- id: association-commerce-triangulaire
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Commerce triangulaire
    - id: b
      texte: Plantation
    - id: c
      texte: Code noir
    droite:
    - id: x
      texte: Échanges commerciaux entre l'Europe, l'Afrique et l'Amérique liés à la traite des esclaves
    - id: y
      texte: Grande exploitation agricole des colonies où travaillent des esclaves
    - id: z
      texte: Édit royal de Louis XIV, en 1685, qui organise l'esclavage dans les colonies
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un mot désigne des échanges, un autre un lieu de travail, un autre un texte du roi.
    methode: Le commerce triangulaire relie trois continents ; la plantation est un lieu précis en Amérique.
    etape: Relie d'abord « Code noir » à la définition qui contient une date.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends les trois mots un par un.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le Code noir, le seul qui a une date, puis distingue les échanges et le lieu de travail.
  solution: Le commerce triangulaire désigne les échanges entre l'Europe, l'Afrique et l'Amérique liés à la traite des esclaves
    ; la plantation est l'exploitation agricole des colonies où travaillent les esclaves ; le Code noir est l'édit royal de
    Louis XIV (1685) qui organise l'esclavage.
- id: frise-traite
  type: ordre
  difficulte: 2
  enonce: Range ces évènements du plus ancien au plus récent.
  reponse:
    elements:
    - id: colomb
      texte: Christophe Colomb débarque en Amérique
    - id: code-noir
      texte: Louis XIV signe le Code noir
    - id: bastille
      texte: La prise de la Bastille
  indices:
    relance: Retrouve l'année de chaque évènement.
    methode: Range les années de la plus petite à la plus grande.
    etape: Colomb débarque en 1492, la Bastille est prise en 1789. Où se place 1685 ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux évènements voisins sont inversés. Compare leurs années.
  - si:
      diagnostic: ordre_faux
    relance: Commence par 1492, la plus ancienne des trois dates.
  solution: Colomb débarque en Amérique (1492), puis Louis XIV signe le Code noir (1685), puis la Bastille est prise (1789).
- id: pourquoi-code-noir
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases ce qu'est la traite des esclaves, puis cite la date et le nom de l'édit royal
    de Louis XIV qui organise l'esclavage.
  criteres:
  - L'élève situe la traite des esclaves entre l'Afrique et l'Amérique.
  - L'élève dit que les esclaves sont emmenés de force pour travailler dans les plantations.
  - L'élève cite l'année 1685 et le Code noir de Louis XIV.
  indices:
    relance: Entre quels continents les esclaves sont-ils emmenés de force ?
    methode: Situe d'abord les deux continents, puis termine par la date et le nom de l'édit royal.
    etape: 'Tu peux commencer ainsi : « La traite des esclaves se fait entre l''Afrique et l''Amérique... »'
  solution: 'La traite des esclaves se fait entre l''Afrique et l''Amérique : des femmes et des hommes africains sont emmenés
    de force pour travailler dans les plantations. En 1685, le roi Louis XIV signe un édit royal appelé le Code noir.'
