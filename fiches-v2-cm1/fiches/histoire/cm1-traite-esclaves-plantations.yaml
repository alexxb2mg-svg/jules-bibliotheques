    methode: Pense d'où partent les bateaux, où sont capturés les esclaves, et où sont les plantations.
    etape: Les esclaves sont capturés en Afrique et emmenés en Amérique. D'où viennent les bateaux ?
  pieges:
  - si:
      contient:
      - d
