    methode: Situe d'abord les deux continents, puis termine par la date et le nom de l'édit royal.
    etape: 'Tu peux commencer ainsi : « La traite des esclaves se fait entre l''Afrique et l''Amérique... »'
  solution: 'La traite des esclaves se fait entre l''Afrique et l''Amérique : des femmes et des hommes africains sont emmenés
    de force pour travailler dans les plantations. En 1685, le roi Louis XIV signe un édit royal appelé le Code noir.'
