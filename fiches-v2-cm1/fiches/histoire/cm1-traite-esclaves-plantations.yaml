format: 2
notion: cm1-traite-esclaves-plantations
version: 2
etat: generee
declencheurs:
- traite des esclaves
- commerce triangulaire
- plantations
- code noir
- esclavage entre l'afrique et l'amérique
- denrées venues des colonies
- esclaves africains
- sucre de canne et chocolat
prerequis:
- cm1-empires-coloniaux-amerindiens
essentiel: 'Du XVe au XVIIe siècle, des pays européens construisent des colonies en Amérique. Pour faire travailler les grandes
  exploitations agricoles de ces colonies, ils organisent la traite des esclaves.


  La traite des esclaves, c''est le commerce d''êtres humains. Des femmes et des hommes africains sont capturés en Afrique,
  puis emmenés de force en Amérique, de l''autre côté de l''océan. Un esclave est une personne qui n''est pas libre : elle
  appartient à quelqu''un, qui la force à travailler sans salaire.


  En Amérique, les esclaves travaillent dans des plantations, de grandes exploitations agricoles où l''on cultive par exemple
  la canne à sucre. Leurs conditions de vie sont très difficiles : ils travaillent de force, sans liberté et sans être payés.


  En 1685, le roi Louis XIV signe un édit royal, c''est-à-dire un texte de loi du roi, appelé le « Code noir ». Il organise
  l''esclavage dans les colonies françaises.


  Des échanges commerciaux ont lieu avec les colonies. On en rapporte en Europe des denrées : la tomate, le chocolat, le haricot,
  la pomme de terre et le sucre de canne. Ce sont des aliments que tu manges peut-être aujourd''hui.


  On parle de commerce triangulaire, car les bateaux relient trois continents : l''Europe, l''Afrique et l''Amérique.

  '
methode:
- Situer la traite des esclaves entre deux continents, l'Afrique et l'Amérique.
- Pour le commerce triangulaire, nommer les trois continents reliés (Europe, Afrique, Amérique).
- Décrire les conditions de vie difficiles des esclaves dans une plantation (travail forcé, sans liberté).
- Relier l'année 1685 au Code noir, un édit royal de Louis XIV.
- Nommer au moins une denrée issue des colonies.
vocabulaire:
- terme: commerce triangulaire
  definition: échanges commerciaux entre l'Europe, l'Afrique et l'Amérique liés à la traite des esclaves
- terme: plantation
  definition: grande exploitation agricole des colonies où travaillent des esclaves
- terme: Code noir
  definition: édit royal signé par Louis XIV en 1685 qui organise l'esclavage dans les colonies
- terme: esclave
  definition: personne qui n'est pas libre, qui appartient à quelqu'un et qui est forcée de travailler sans salaire
- terme: traite
  definition: commerce d'êtres humains capturés et vendus comme esclaves
- terme: denrée
  definition: produit qui se mange, comme le chocolat ou la tomate
erreurs_frequentes:
- 'Oublier que la traite des esclaves se fait entre deux continents : l''Afrique et l''Amérique.'
- Confondre les denrées venues des colonies avec des produits d'Europe.
- 'Placer le Code noir à une mauvaise date : il date de 1685.'
- Croire que les esclaves partent de leur plein gré, alors qu'ils sont capturés et emmenés de force.
exemple:
  enonce: En quelle année Louis XIV signe-t-il l'édit royal appelé le « Code noir », et à quoi sert ce texte ?
  solution: 'En 1685. Ce texte de loi du roi organise l''esclavage dans les colonies françaises : il concerne les esclaves
    africains emmenés de force en Amérique pour travailler dans les plantations.'
exercices:
- id: annee-code-noir
  type: nombre
  difficulte: 1
  enonce: En quelle année Louis XIV signe-t-il l'édit royal appelé le « Code noir » ?
  reponse:
    valeur: 1685
    forme: entier
  indices:
    relance: Cette date est un repère du programme sur la traite des esclaves.
    methode: C'est un édit royal signé par Louis XIV, dans la seconde moitié du XVIIe siècle.
    etape: C'est au XVIIe siècle, sous le règne de Louis XIV, plus de cent ans avant la Révolution de 1789.
  pieges:
  - si:
      valeur: 1789
    relance: 1789, c'est l'année de la Révolution française. Le Code noir est signé bien avant.
  - si:
      valeur: 1492
    relance: 1492, c'est l'arrivée de Christophe Colomb en Amérique. Le Code noir vient bien plus tard.
  solution: Louis XIV signe le Code noir en 1685.
