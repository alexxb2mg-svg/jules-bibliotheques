format: 2
notion: cm1-henri-iv-pacificateur
version: 3
etat: verifiee
declencheurs:
- roi qui met fin à des guerres
- catholiques contre protestants
- texte qui apaise un conflit religieux
- règne après François Ier
- ramener la paix dans un royaume
- roi du XVIe siècle qui pacifie
- loi du roi en 1598
- deux religions qui se battent
- roi avant Louis XIV
prerequis:
- cm1-francois-1er-mecene-renaissance
essentiel: 'Henri IV est un roi de France. Il règne de 1589 à 1610, à la fin du XVIe siècle et au début du XVIIe siècle.


  Le royaume connaît alors les guerres de religion. Les chrétiens de France sont divisés en deux groupes : les catholiques
  et les protestants. Ils ne pratiquent pas leur religion de la même façon, et ils se combattent.


  Henri IV veut ramener la paix entre ses sujets. C''est pour cela qu''on l''appelle un roi pacificateur : pacifier, c''est
  rétablir la paix.


  En 1598, il signe l''édit de Nantes. Un édit est une loi décidée par le roi. Ce texte pacifie le royaume : il doit permettre
  aux catholiques et aux protestants de vivre dans le même royaume sans se faire la guerre.


  Pour placer Henri IV sur une frise, retiens l''ordre de trois rois : François Ier (1515-1547), puis Henri IV (1589-1610),
  puis Louis XIV (1643-1715). L''édit de Nantes, en 1598, se trouve au milieu du règne de Henri IV.


  Un exemple pour comprendre : dans la cour de récréation, deux groupes se disputent. On peut fixer une règle qui permet à
  chacun de jouer à sa façon, sans bagarre. L''édit de Nantes joue un peu ce rôle pour tout le royaume.

  '
methode:
- 'Situer le règne de Henri IV sur une frise : de 1589 à 1610.'
- 'Rappeler le contexte : les guerres de religion entre catholiques et protestants.'
- 'Associer Henri IV au mot « pacificateur » : il ramène la paix.'
- Relier Henri IV à l'édit de Nantes, signé en 1598, au milieu de son règne.
- 'Expliquer le but de l''édit : ramener la paix entre catholiques et protestants.'
vocabulaire:
- terme: guerres de religion
  definition: conflits entre catholiques et protestants que Henri IV cherche à apaiser.
- terme: catholique
  definition: un chrétien qui suit l'Église catholique.
- terme: protestant
  definition: un chrétien qui pratique sa religion d'une autre façon que les catholiques.
- terme: pacificateur
  definition: celui qui ramène la paix là où il y avait la guerre.
- terme: édit
  definition: une loi décidée par le roi.
- terme: édit de Nantes
  definition: le texte signé par Henri IV en 1598 pour ramener la paix entre catholiques et protestants.
erreurs_frequentes:
- Confondre la date du règne de Henri IV (1589-1610) et la date de l'édit de Nantes (1598), qui est au milieu de son règne.
- 'Oublier le mot « pacificateur » : Henri IV est connu pour avoir ramené la paix, pas pour avoir fait la guerre.'
- 'Croire que l''édit de Nantes est une déclaration de guerre : au contraire, c''est un texte qui ramène la paix.'
- Placer Henri IV avant François Ier ou après Louis XIV sur la frise.
exemple:
  enonce: Pourquoi appelle-t-on Henri IV un roi « pacificateur » ?
  solution: 'Parce qu''il ramène la paix dans le royaume de France, déchiré par les guerres de religion entre catholiques
    et protestants. En 1598, il signe l''édit de Nantes, un texte qui pacifie le royaume : les deux groupes doivent pouvoir
    vivre dans le même royaume sans se faire la guerre.'
exercices:
- id: mot-pacificateur
  type: choix
  difficulte: 1
  enonce: Comment appelle-t-on un roi qui ramène la paix dans son royaume ?
  reponse:
    options:
    - id: a
      texte: Un roi pacificateur
    - id: b
      texte: Un roi mécène
    - id: c
      texte: Un roi absolu
    bonnes:
    - a
  indices:
    relance: Ce mot vient de « paix », comme dans « faire la paix ».
    methode: Henri IV est décrit avec ce mot dans ta fiche.
    etape: Ce n'est pas le mot qui décrit François Ier, ni celui qui décrit un pouvoir total.
  pieges:
  - si:
      contient:
      - b
    relance: Un mécène est une personne qui soutient des artistes, ce n'est pas ce dont on parle ici.
  - si:
      contient:
      - c
    relance: Un roi « absolu » détient tout le pouvoir, ce n'est pas le mot qui décrit Henri IV dans cette notion.
  solution: On appelle cela un roi pacificateur.
- id: deux-camps-guerres-religion
  type: choix
  difficulte: 1
  enonce: Quels sont les deux groupes qui s'affrontent dans les guerres de religion ?
  reponse:
    options:
    - id: a
      texte: Les catholiques et les protestants
    - id: b
      texte: Les seigneurs et les paysans
    - id: c
      texte: Les Français et les Anglais
    bonnes:
    - a
  indices:
    relance: Ce sont deux groupes religieux différents.
    methode: Henri IV cherche à les réconcilier.
    etape: Un des deux mots commence par « cath », l'autre par « prot ».
  pieges:
  - si:
      contient:
      - b
    relance: Les seigneurs et les paysans appartiennent à une autre notion, pas aux guerres de religion.
  - si:
      contient:
      - c
    relance: Ce conflit n'oppose pas deux pays, mais deux groupes religieux dans le royaume de France.
  solution: Les catholiques et les protestants.
- id: nom-texte-1598
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle le texte qu'Henri IV signe en 1598 pour ramener la paix ?
  reponse:
    acceptees:
    - édit de Nantes
    - l'édit de Nantes
    - edit de Nantes
    fautes_tolerees: 1
  indices:
    relance: C'est une loi décidée par le roi, qui porte le nom d'une ville.
    methode: Relis le vocabulaire de ta fiche. Il y a un mot pour une loi du roi, suivi du nom d'une ville.
    etape: Relis la ligne de ta fiche qui parle de l'année 1598.
  pieges:
  - si:
      valeur: traité de Nantes
    relance: Ce n'est pas un traité entre deux pays, mais une loi décidée par le roi. Quel mot désigne cette loi ?
  solution: L'édit de Nantes, signé en 1598.
- id: annee-edit-de-nantes
  type: nombre
  difficulte: 2
  enonce: En quelle année Henri IV signe-t-il l'édit de Nantes ?
  reponse:
    valeur: 1598
    forme: entier
  indices:
    relance: Cette année se situe pendant le règne de Henri IV, pas au tout début.
    methode: L'année a quatre chiffres et commence par 15.
    etape: Ce n'est ni 1589 (début du règne), ni 1610 (fin du règne).
  pieges:
  - si:
      valeur: 1589
    relance: 1589, c'est le début du règne de Henri IV, pas l'année de l'édit de Nantes.
  - si:
      valeur: 1610
    relance: 1610, c'est la fin du règne de Henri IV, pas l'année de l'édit de Nantes.
  solution: L'édit de Nantes date de 1598.
- id: edit-nantes-position-regne
  type: choix
  difficulte: 2
  enonce: L'édit de Nantes (1598) se situe-t-il au début, pendant, ou après le règne de Henri IV (1589-1610) ?
  reponse:
    options:
    - id: a
      texte: Pendant son règne
    - id: b
      texte: Avant son règne
    - id: c
      texte: Après son règne
    bonnes:
    - a
  indices:
    relance: Compare 1598 aux deux dates du règne, 1589 et 1610.
    methode: 1598 est plus grand que 1589 et plus petit que 1610.
    etape: L'édit de Nantes n'est ni le tout premier acte du règne, ni un acte après la mort du roi.
  pieges:
  - si:
      contient:
      - b
    relance: 1598 est après 1589, l'édit de Nantes n'est donc pas avant le règne de Henri IV.
  - si:
      contient:
      - c
    relance: 1598 est avant 1610, l'édit de Nantes n'est donc pas après le règne de Henri IV.
  solution: L'édit de Nantes date de 1598, donc pendant son règne (1589-1610).
- id: but-edit-de-nantes
  type: choix
  difficulte: 2
  enonce: À quoi sert l'édit de Nantes, signé par Henri IV en 1598 ?
  reponse:
    options:
    - id: a
      texte: À ramener la paix entre catholiques et protestants
    - id: b
      texte: À déclarer une nouvelle guerre de religion
    - id: c
      texte: À faire construire un château pour le roi
    bonnes:
    - a
  indices:
    relance: Henri IV est appelé un roi pacificateur. Que veut dire « pacifier » ?
    methode: Ce texte est signé dans le contexte des guerres de religion. Le roi veut y mettre fin.
    etape: Élimine d'abord le choix qui parle d'une nouvelle guerre. Puis relis le but de l'édit dans ta fiche.
  pieges:
  - si:
      contient:
      - b
    relance: Un roi pacificateur ne déclare pas la guerre. Que cherche-t-il à faire ?
  - si:
      contient:
      - c
    relance: L'édit de Nantes n'est pas lié à un château. Il concerne les deux groupes religieux du royaume.
  solution: L'édit de Nantes sert à pacifier le royaume, c'est-à-dire à ramener la paix entre catholiques et protestants après
    les guerres de religion.
- id: frise-trois-rois
  type: ordre
  difficulte: 2
  enonce: Range ces trois règnes du plus ancien au plus récent.
  reponse:
    elements:
    - id: francois
      texte: Le règne de François Ier
    - id: henri
      texte: Le règne de Henri IV
    - id: louis
      texte: Le règne de Louis XIV
  indices:
    relance: Lequel de ces trois rois est le roi mécène de la Renaissance, au début du XVIe siècle ?
    methode: 'Compare les années de début de règne : 1515, 1589 et 1643.'
    etape: François Ier commence à régner en 1515, c'est le plus ancien des trois. Lequel vient ensuite ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux règnes voisins sont inversés. Compare leurs années de début.
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord le roi dont le règne commence en 1515, puis range les deux autres.
  solution: François Ier (1515-1547), puis Henri IV (1589-1610), puis Louis XIV (1643-1715).
- id: annees-regne-henri-iv
  type: nombre
  difficulte: 3
  enonce: Combien d'années a duré le règne de Henri IV (1589-1610) ?
  reponse:
    valeur: 21
    forme: entier
  indices:
    relance: Soustrais l'année de début à l'année de fin.
    methode: 1610 moins 1589.
    etape: Le résultat est un nombre entre 15 et 25.
  pieges:
  - si:
      valeur: 1598
    relance: 1598 est l'année de l'édit de Nantes, pas la durée du règne.
  solution: 1610 - 1589 = 21 ans (vérification 1589 + 21 = 1610).
- id: henri-iv-ouverte
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases comment Henri IV pacifie le royaume de France dans le contexte des guerres de
    religion.
  criteres:
  - L'élève explique que Henri IV met fin aux violences entre catholiques et protestants.
  - L'élève cite l'édit de Nantes signé en 1598.
  - L'élève explique le but de l'édit (ramener la paix entre catholiques et protestants) ou emploie le mot « pacificateur
    ».
  indices:
    relance: Une phrase sur le contexte des guerres de religion, une phrase sur le texte signé en 1598.
    methode: Utilise le vocabulaire et la date de ta fiche.
    etape: Termine par « en signant l'édit de Nantes en 1598 ».
  solution: Henri IV, roi pacificateur, met fin aux violences des guerres de religion entre catholiques et protestants, notamment
    en signant l'édit de Nantes en 1598. Ce texte ramène la paix entre catholiques et protestants.
- id: nblm-pourquoi-le-roi-henri-iv-est-il-qualifie-1
  type: choix
  difficulte: 2
  enonce: Pourquoi le roi Henri IV est-il qualifié de roi « pacificateur » ?
  reponse:
    options:
    - id: o1
      texte: Parce qu'il a ramené la paix dans le royaume en apaisant les conflits religieux.
    - id: o2
      texte: Parce qu'il a cherché à faire la guerre à tous ses voisins européens.
    - id: o3
      texte: Parce qu'il a affirmé son pouvoir absolu en faisant construire le château de Versailles.
    - id: o4
      texte: Parce qu'il a été un roi mécène en faisant venir Léonard de Vinci en France.
    bonnes:
    - o1
  indices:
    relance: Pense au sens du mot « pacificateur » et à son action pour mettre fin aux divisions dans le royaume.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur : la fiche précise qu''Henri IV est connu pour avoir ramené la paix, pas pour avoir fait la
      guerre.'
  - si:
      contient:
      - o3
    relance: C'est une confusion avec le roi Louis XIV, qui a régné plus tard de 1643 à 1715.
  - si:
      contient:
      - o4
    relance: C'est une confusion avec François Ier, qui est le roi mécène de la Renaissance.
  solution: 'Parce qu''il a ramené la paix dans le royaume en apaisant les conflits religieux. C''est exact : Henri IV est
    qualifié de pacificateur car il ramène la paix après les guerres de religion entre catholiques et protestants.'
- id: nblm-quels-groupes-religieux-s-affrontaient-p-2
  type: choix
  difficulte: 2
  enonce: Quels groupes religieux s'affrontaient pendant les guerres de religion qu'Henri IV a cherché à apaiser ?
  reponse:
    options:
    - id: o1
      texte: Les catholiques et les protestants.
    - id: o2
      texte: Les nobles et les paysans du tiers état.
    - id: o3
      texte: Les Français et les populations amérindiennes.
    - id: o4
      texte: Les moines de l'abbaye de Cluny et les évêques de Paris.
    bonnes:
    - o1
  indices:
