    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur : cela concerne la division de la société en ordres, pas les guerres de religion.'
  - si:
      contient:
      - o3
    relance: C'est une confusion avec la conquête des territoires en Amérique et les empires coloniaux.
  - si:
      contient:
      - o4
    relance: 'C''est une erreur : le conflit opposait deux confessions chrétiennes (catholiques et protestants), pas deux
      groupes de l''Église catholique.'
  solution: 'Les catholiques et les protestants. C''est exact : les guerres de religion opposaient les catholiques et les
    protestants.'
