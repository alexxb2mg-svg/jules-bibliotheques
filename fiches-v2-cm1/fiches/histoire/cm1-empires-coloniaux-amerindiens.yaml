format: 2
notion: cm1-empires-coloniaux-amerindiens
version: 3
etat: generee
declencheurs:
- colonies en amérique
- empires coloniaux
- amérindiens
- territoires conquis
- conséquences pour les populations d'amérique
- carte des empires coloniaux
- peuples d'amérique
- conquête de l'amérique
prerequis:
- cm1-progres-techniques-navigation
couverture: 'Le texte officiel ne nomme ni les pays européens qui dominent chaque empire, ni le détail des conséquences pour
  les Amérindiens : la fiche renvoie à la carte et à la légende du cours pour les noms, et l''enseignant complète les conséquences
  précises vues en classe.'
essentiel: 'Du XVe au XVIIe siècle, des Européens explorent les océans, puis conquièrent des terres lointaines. En 1492, Christophe
  Colomb débarque en Amérique. Après lui, des pays européens prennent le contrôle de grands territoires sur ce continent.


  Un empire colonial, c''est un ensemble de territoires conquis et dominés par un pays européen, loin de chez lui. Chacun
  de ces territoires est une colonie. La colonisation, c''est le fait de conquérir un territoire et de le dominer.


  Les Amérindiens sont les populations qui vivaient en Amérique bien avant l''arrivée des Européens. Le continent n''était
  pas vide : ces peuples y avaient déjà leurs terres et leur façon de vivre.


  Sur une carte de l''Amérique, on peut localiser les grands empires coloniaux. Chaque empire a sa couleur. Pour lire la carte,
  on regarde la couleur d''une zone, puis on cherche dans la légende quel pays européen la domine.


  La conquête a des conséquences pour les Amérindiens : leurs terres passent sous la domination d''un pays européen, qui décide
  à leur place. C''est un peu comme si quelqu''un arrivait dans ton quartier et imposait ses règles à tous les habitants.


  Plus tard, pour faire travailler les plantations de ces colonies, des esclaves africains sont emmenés de force en Amérique.

  '
methode:
- Situer d'abord la période sur la frise, du XVe au XVIIe siècle, après le débarquement de Christophe Colomb en 1492.
- Se rappeler qui conquiert (des pays européens) et qui vivait déjà là (les Amérindiens).
- Sur la carte, repérer la couleur d'une zone de l'Amérique.
- Chercher cette couleur dans la légende pour nommer le pays européen qui domine la zone.
- Pour les conséquences, partir d'une idée simple, les Amérindiens perdent la maîtrise de leurs terres, puis donner un exemple
  vu en classe.
vocabulaire:
- terme: empire colonial
  definition: ensemble de territoires conquis et dominés par un pays européen, ici en Amérique
- terme: colonie
  definition: territoire conquis et dominé par un pays, loin de ce pays
- terme: colonisation
  definition: le fait de conquérir un territoire lointain et de le dominer
- terme: amérindiens
  definition: populations qui vivaient en Amérique avant l'arrivée des Européens
- terme: conquête
  definition: le fait de prendre un territoire par la force
erreurs_frequentes:
- Oublier que les populations amérindiennes vivaient sur ces territoires avant la constitution des empires coloniaux.
- Ne pas savoir localiser un empire colonial sur une carte, faute de lire la légende.
- Croire que les Amérindiens sont arrivés en même temps que les Européens.
- Confondre la colonie (un territoire) et l'empire colonial (l'ensemble des territoires dominés par un même pays).
exemple:
  enonce: Que se passe-t-il pour les populations amérindiennes quand des empires coloniaux se constituent en Amérique ?
  solution: 'Les Amérindiens vivaient déjà sur ces territoires avant l''arrivée des Européens. Quand des pays européens conquièrent
    ces terres et forment des empires coloniaux, les Amérindiens passent sous leur domination : cette conquête a des conséquences
    pour eux.'
exercices:
- id: qui-vivait-avant
  type: choix
  difficulte: 1
  enonce: Qui vivait en Amérique avant la constitution des empires coloniaux européens ?
  reponse:
    options:
    - id: a
      texte: Les populations amérindiennes
    - id: b
      texte: Les colons européens
    - id: c
      texte: Personne, le continent était inhabité
    bonnes:
    - a
  indices:
    relance: Le mot est proche du titre de cette fiche.
    methode: Ce ne sont pas les Européens, qui arrivent après, par la conquête.
    etape: Ce sont des populations déjà présentes, avant les grandes explorations.
  pieges:
  - si:
      contient:
      - b
    relance: Les colons européens arrivent avec la conquête. Qui était là avant eux ?
  - si:
      contient:
      - c
    relance: Le continent n'était pas inhabité. Des populations y vivaient déjà.
  solution: Les populations amérindiennes vivaient en Amérique avant la constitution des empires coloniaux.
- id: qui-constitue-empires
  type: choix
  difficulte: 1
  enonce: Qui constitue les premiers empires coloniaux en Amérique ?
  reponse:
    options:
    - id: a
      texte: Des pays européens
    - id: b
      texte: Les populations amérindiennes elles-mêmes
    - id: c
      texte: Des marchands d'Afrique
    bonnes:
    - a
  indices:
    relance: Pense aux progrès techniques de navigation qui permettent de traverser l'océan.
    methode: Ce sont les Européens qui explorent puis conquièrent ces territoires.
    etape: Ce sont les mêmes qui utilisent la boussole et la caravelle pour naviguer au grand large.
  pieges:
  - si:
      contient:
      - b
    relance: Les empires coloniaux sont imposés aux Amérindiens, pas construits par eux.
  - si:
      contient:
      - c
    relance: Reviens à ceux qui explorent l'océan avec la boussole et la caravelle. Ce ne sont pas des marchands venus d'Afrique.
  solution: Ce sont des pays européens qui constituent les premiers empires coloniaux en Amérique.
- id: mot-colonie
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un territoire conquis et dominé par un pays européen, loin de ce pays ?
  reponse:
    acceptees:
    - colonie
    - colonies
    - une colonie
    fautes_tolerees: 1
  indices:
    relance: Plusieurs de ces territoires réunis forment un empire. Comment s'appelle chacun d'eux ?
    methode: Relis le vocabulaire de ta fiche, juste après « empire colonial ».
    etape: Relis le paragraphe de ta fiche qui explique ce qu'est un empire colonial.
  pieges:
  - si:
      valeur: empire
    relance: Un empire regroupe plusieurs territoires. Quel mot désigne un seul de ces territoires ?
  - si:
      valeur: conquête
    relance: La conquête, c'est l'action de prendre le territoire. Comment s'appelle le territoire une fois dominé ?
  solution: On l'appelle une colonie. Plusieurs colonies dominées par un même pays forment un empire colonial.
- id: consequence-conquete
  type: texte_court
  difficulte: 2
  enonce: La conquête des empires coloniaux a-t-elle des conséquences pour les populations amérindiennes ? Réponds par oui
    ou par non.
  reponse:
    acceptees:
    - oui
    fautes_tolerees: 0
  indices:
    relance: Le territoire conquis appartenait à qui, avant la conquête ?
    methode: Une conquête de territoire habité a toujours des conséquences pour ceux qui y vivaient.
    etape: Relis l'essentiel de la fiche, en particulier le paragraphe sur la conquête.
  pieges:
  - si:
      valeur: non
    relance: Un territoire déjà habité ne peut pas être conquis sans conséquences pour ses habitants.
  solution: Oui, la conquête a des conséquences pour les populations amérindiennes, qui vivaient déjà sur ces territoires.
- id: association-empire-continent
  type: association
  difficulte: 2
  enonce: Relie chaque élément à sa bonne définition.
  reponse:
    gauche:
    - id: a
      texte: Empire colonial
    - id: b
      texte: Amérindiens
    droite:
    - id: x
      texte: Territoires conquis et dominés par un pays européen
    - id: y
      texte: Populations qui vivaient en Amérique avant l'arrivée des Européens
    paires:
      a: x
      b: y
  indices:
    relance: L'un des deux mots désigne un territoire, l'autre des habitants.
    methode: Un empire colonial est fait de territoires ; les Amérindiens sont des populations.
    etape: Relie d'abord « empire colonial » à sa définition, qui parle de territoires.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends les deux mots un par un.
  - si:
      diagnostic: associations_fausses
    relance: Demande-toi pour chaque mot s'il désigne des terres ou des personnes.
  solution: Un empire colonial est un ensemble de territoires conquis et dominés par un pays européen ; les Amérindiens sont
    les populations qui vivaient en Amérique avant l'arrivée des Européens.
- id: chronologie-amerique
  type: ordre
  difficulte: 2
  enonce: Range ces faits du plus ancien au plus récent.
  reponse:
    elements:
    - id: amerindiens
      texte: Les Amérindiens vivent seuls sur le continent américain
    - id: colomb
      texte: Christophe Colomb débarque en Amérique
    - id: empires
      texte: Des pays européens constituent des empires coloniaux en Amérique
    - id: code-noir
      texte: Louis XIV signe le Code noir, qui organise l'esclavage dans les colonies
  indices:
    relance: Qui était en Amérique avant tout le monde ?
    methode: Place d'abord ce qui se passe avant l'arrivée des Européens, puis l'arrivée, puis la conquête, puis le texte
      du roi.
    etape: Christophe Colomb débarque en 1492 et le Code noir date de 1685. Où se place la conquête des territoires ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux faits voisins sont inversés. Lequel des deux arrive en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Pars de ceux qui vivaient déjà en Amérique, puis range l'arrivée des Européens et ce qui suit.
  solution: D'abord les Amérindiens vivent seuls en Amérique ; puis Christophe Colomb débarque (1492) ; puis des pays européens
    constituent des empires coloniaux ; enfin Louis XIV signe le Code noir (1685).
- id: localiser-empire
  type: ouverte
  difficulte: 2
  enonce: Sur la carte de l'Amérique de ton cahier, colorie ou entoure un grand empire colonial et nomme le pays européen
    qui le domine.
  criteres:
  - L'élève localise correctement un empire colonial sur la carte de l'Amérique.
  - L'élève nomme le pays européen qui le domine.
  - L'élève s'est servi de la légende de la carte pour vérifier sa réponse.
  indices:
    relance: Aide-toi de la légende de la carte de ton cours.
    methode: Repère d'abord les couleurs ou les zones indiquées dans la légende, puis nomme le pays associé.
    etape: Choisis une seule zone de la carte et vérifie sa couleur dans la légende avant de répondre.
  solution: Les grands empires coloniaux sont localisés sur la carte de ton cours ; vérifie ta réponse avec la légende et
    le nom du pays européen associé à la zone choisie.
- id: pourquoi-consequences
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases pourquoi la constitution des empires coloniaux a des conséquences pour les populations
    amérindiennes.
  criteres:
  - L'élève rappelle que les Amérindiens vivaient déjà sur ces territoires.
  - L'élève dit que des pays européens conquièrent et dominent ces territoires.
  - L'élève dit que la conquête a des conséquences pour les Amérindiens, avec un exemple vu en classe.
  indices:
    relance: Qui habitait les territoires avant que les Européens les conquièrent ?
    methode: Explique d'abord qui vivait là avant, puis ce que change la conquête pour ces populations.
    etape: 'Tu peux commencer ainsi : « Avant l''arrivée des Européens, les Amérindiens vivaient... »'
  solution: Avant l'arrivée des Européens, les Amérindiens vivaient déjà sur les territoires d'Amérique. Quand des pays européens
    constituent des empires coloniaux en conquérant ces territoires, cela a des conséquences pour les populations amérindiennes
    qui y vivaient.
- id: nblm-que-constitue-un-pays-europeen-lorsqu-il-1
  type: choix
  difficulte: 2
  enonce: Que constitue un pays européen lorsqu'il conquiert et domine de grands territoires en Amérique ?
  reponse:
    options:
    - id: o1
      texte: Un empire colonial
    - id: o2
      texte: Une paroisse médiévale
    - id: o3
      texte: Un domaine royal européen
    - id: o4
      texte: Une seigneurie locale
    bonnes:
    - o1
  indices:
    relance: Réfléchis au terme de la leçon qui désigne des territoires conquis et dominés à l'étranger par une puissance
      européenne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre l''organisation religieuse du Moyen Âge avec les conquêtes territoriales en Amérique.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : croire qu''il s''agit du territoire même du roi en Europe, alors qu''il s''agit de colonies
      situées en Amérique.'
  solution: Un empire colonial. C'est exact ! Un empire colonial est l'ensemble des territoires conquis et dominés par un
    pays européen.
- id: nblm-qui-sont-les-amerindiens-selon-la-fiche-2
  type: choix
  difficulte: 2
  enonce: Qui sont les Amérindiens selon la fiche de cours d'histoire ?
  reponse:
    options:
    - id: o1
      texte: Les populations qui vivaient en Amérique avant l'arrivée des Européens
    - id: o2
      texte: Les marins européens arrivés lors des grandes explorations
    - id: o3
      texte: Les habitants arrivés en Amérique en même temps que les Européens
    - id: o4
      texte: Des artisans venus des villes d'Europe au Moyen Âge
    bonnes:
    - o1
  indices:
    relance: Pense aux personnes qui étaient déjà installées sur le continent américain avant l'arrivée des navires européens.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre les navigateurs européens avec les populations autochtones déjà sur place.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : croire à tort que les Amérindiens sont arrivés au même moment que les Européens.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre les populations du continent américain avec les métiers des villes européennes.'
  solution: Les populations qui vivaient en Amérique avant l'arrivée des Européens. C'est exact ! Les Amérindiens habitaient
    déjà ces territoires avant la constitution des empires coloniaux.
- id: nblm-quelle-est-la-consequence-essentielle-de-3
  type: choix
  difficulte: 2
  enonce: Quelle est la conséquence essentielle de la constitution des empires coloniaux pour les Amérindiens ?
  reponse:
    options:
    - id: o1
      texte: Cette conquête a eu des conséquences pour les populations amérindiennes déjà présentes
    - id: o2
      texte: Aucun changement car les territoires conquis étaient totalement inhabités
    - id: o3
      texte: Les Amérindiens sont partis conquérir des territoires en Europe
    - id: o4
      texte: Les Amérindiens ont pris le contrôle des pays européens
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui arrive aux habitants d'un territoire lorsqu'il est conquis et dominé par un autre pays.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : oublier que les populations amérindiennes vivaient déjà sur ces terres avant l''arrivée des
      Européens.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : inverser le sens des conquêtes coloniales entre l''Europe et l''Amérique.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : méconnaître le rapport de domination exercé par les pays européens sur ces territoires.'
  solution: Cette conquête a eu des conséquences pour les populations amérindiennes déjà présentes. C'est exact ! La leçon
    rappelle que la conquête européenne a eu des conséquences directes sur les Amérindiens et leurs territoires.
- id: nblm-quel-document-de-geographie-permet-de-re-4
  type: choix
