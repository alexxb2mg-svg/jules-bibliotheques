    relance: Avant 1789, qui a tous les pouvoirs, et qui a des avantages que les autres n'ont pas ?
    methode: Repense à ce qui se passe le 14 juillet et dans la nuit du 4 août.
    etape: La Bastille, symbole du pouvoir du roi, est prise, puis un grand changement a lieu le 4 août. Lequel ?
