  difficulte: 3
  enonce: Raconte en deux ou trois phrases l'action des femmes qui marchent sur Versailles en octobre 1789.
  criteres:
  - L'élève situe l'évènement dans le temps (5-6 octobre 1789).
  - L'élève dit que ce sont des femmes de Paris qui marchent jusqu'à Versailles.
  - L'élève donne au moins un but de la marche (réclamer du pain ou ramener le roi à Paris).
