format: 2
notion: cm1-1789-fin-monarchie-absolue
version: 3
etat: generee
declencheurs:
- prise de la bastille
- 14 juillet
- abolition des privilèges
- marche des femmes sur versailles
- fin de l'ancien régime
- frise de l'année révolutionnaire
- révolution française
- nuit du 4 août
prerequis:
- cm1-contexte-royaume-1789
essentiel: 'Avant 1789, la France est une monarchie absolue : le roi a tous les pouvoirs et décide seul. La société est divisée
  en trois ordres : le clergé, la noblesse et le tiers état. Le clergé et la noblesse ont des privilèges, des avantages que
  les autres n''ont pas. Cette organisation s''appelle l''Ancien Régime.


  L''année 1789 marque la fin de la monarchie absolue et de l''Ancien Régime. On parle de la Révolution française : de grands
  changements arrivent en très peu de temps.


  Le 14 juillet 1789, le peuple de Paris prend la Bastille. C''est une prison-forteresse, symbole du pouvoir du roi.


  Dans la nuit du 4 août 1789, les privilèges des nobles et du clergé sont abolis, c''est-à-dire supprimés. Par exemple, imagine
  qu''à l''école, seuls certains élèves aient le droit de ne jamais ranger la classe. Abolir ce privilège, c''est dire que
  la règle est la même pour tous.


  Les 5 et 6 octobre 1789, des femmes de Paris marchent jusqu''à Versailles, où vit le roi. Elles réclament du pain et ramènent
  le roi à Paris.


  Sur une frise de l''année 1789, on place ces trois évènements dans l''ordre : juillet, puis août, puis octobre.

  '
methode:
- Placer l'année 1789 sur la frise du temps, à la fin de l'Ancien Régime.
- 'Retenir l''ordre des évènements : 14 juillet, nuit du 4 août, 5-6 octobre 1789.'
- Relier chaque date à son évènement précis (prise de la Bastille, abolition des privilèges, marche des femmes).
- Pour ranger les évènements, comparer d'abord les mois, puis les jours.
- Expliquer avec ses mots ce qui change en 1789 (fin du pouvoir absolu du roi et des privilèges).
vocabulaire:
- terme: Révolution
  definition: les changements de 1789 qui mettent fin à la monarchie absolue et à l'Ancien Régime
- terme: privilège
  definition: avantage réservé à la noblesse et au clergé sous l'Ancien Régime, aboli dans la nuit du 4 août 1789
- terme: monarchie absolue
  definition: régime où le roi a tous les pouvoirs et décide seul
- terme: Ancien Régime
  definition: l'organisation de la France avant 1789, avec un roi tout-puissant et une société divisée en trois ordres
- terme: Bastille
  definition: prison-forteresse de Paris, symbole du pouvoir du roi, prise le 14 juillet 1789
- terme: abolir
  definition: supprimer, faire disparaître une loi ou un avantage
erreurs_frequentes:
- Confondre les dates du 14 juillet (prise de la Bastille) et de la nuit du 4 août (abolition des privilèges).
- Oublier la marche des femmes à Versailles, un évènement des 5-6 octobre 1789.
- Croire que la Bastille est un château du roi, alors que c'est une prison-forteresse.
- Penser qu'« abolir les privilèges » veut dire les donner à tout le monde, alors que c'est les supprimer.
exemple:
  enonce: Que se passe-t-il le 14 juillet 1789, et pourquoi est-ce important ?
  solution: 'Le 14 juillet 1789, le peuple de Paris prend la Bastille, une prison-forteresse. C''est important car la Bastille
    est un symbole du pouvoir du roi : sa prise marque le début de la fin de la monarchie absolue.'
