    - id: b
      texte: Donner à tout le monde
    - id: c
      texte: Garder pour les nobles seulement
    bonnes:
    - a
  indices:
    relance: Après le 4 août, les privilèges existent-ils encore ?
    methode: Relis le vocabulaire de ta fiche au mot « abolir ».
    etape: Après la nuit du 4 août, les nobles ne gardent pas leurs privilèges. Élimine ce choix, puis compare les deux autres.
  pieges:
  - si:
      contient:
      - b
    relance: Les privilèges ne sont pas partagés, ils disparaissent. La règle devient la même pour tous.
  - si:
      contient:
      - c
    relance: C'était la situation avant le 4 août. Abolir, c'est changer cela.
  solution: Abolir veut dire supprimer. Dans la nuit du 4 août 1789, les privilèges des nobles et du clergé sont supprimés.
