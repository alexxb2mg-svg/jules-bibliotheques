format: 2
notion: cm1-declaration-droits-homme-citoyen
version: 3
etat: verifiee
declencheurs:
- déclaration des droits de l'homme
- 26 août 1789
- liberté égalité
- droits du citoyen
- nouveaux principes de la société
- souveraineté nationale
- libres et égaux en droits
- texte important de la révolution
- tous les mêmes droits
prerequis:
- cm1-1789-fin-monarchie-absolue
essentiel: 'Le 26 août 1789, l''Assemblée nationale adopte la Déclaration des Droits de l''Homme et du Citoyen. C''est un
  texte très important de l''année révolutionnaire 1789.


  Avant 1789, sous l''Ancien Régime, le roi détient tout le pouvoir et la société est divisée en trois ordres qui ne sont
  pas égaux. Pendant la nuit du 4 août 1789, les privilèges sont abolis. Puis, le 26 août, la Déclaration affirme de nouveaux
  principes d''organisation de la société.


  Le premier principe est la liberté : chaque personne est libre. Le deuxième est l''égalité : tous les hommes ont les mêmes
  droits, quel que soit l''ordre dans lequel ils sont nés. Un noble et un paysan, par exemple, ont désormais les mêmes droits.


  La Déclaration affirme aussi la souveraineté nationale : le pouvoir appartient à la Nation, c''est-à-dire à l''ensemble
  des citoyens, et non plus seulement au roi. Un citoyen est un membre de la Nation qui a des droits. Ces principes servent
  à préparer une constitution, le texte qui fixe les règles du pouvoir dans le pays.


  Sur la frise de 1789, retiens quatre moments. Au printemps, les États-Généraux se réunissent. Le 14 juillet, c''est la prise
  de la Bastille. La nuit du 4 août, les privilèges sont abolis. Le 26 août, la Déclaration est adoptée.


  Un exemple pour comprendre l''égalité : dans ta classe, la même règle s''applique à tous les élèves, quel que soit leur
  prénom ou leur famille. La Déclaration veut la même chose pour tous les habitants du pays.

  '
methode:
- Retenir la date du 26 août 1789 pour la Déclaration des Droits de l'Homme et du Citoyen.
- Citer au moins un principe qu'elle affirme (par exemple la liberté ou l'égalité).
- 'Expliquer la souveraineté nationale : le pouvoir appartient à la Nation, plus seulement au roi.'
- Relier ce texte à l'idée de nouveaux principes d'organisation de la société, différents de ceux de l'Ancien Régime.
- 'Placer la Déclaration sur la frise de 1789 : après la prise de la Bastille et la nuit du 4 août.'
vocabulaire:
- terme: droits de l'Homme
  definition: les droits que possède chaque être humain, affirmés par la Déclaration du 26 août 1789.
- terme: citoyenneté
  definition: le fait d'être citoyen, c'est-à-dire membre de la Nation avec des droits.
- terme: liberté
  definition: le droit de chaque personne d'être libre.
- terme: égalité
  definition: le principe selon lequel tous les hommes ont les mêmes droits.
- terme: souveraineté nationale
  definition: principe selon lequel le pouvoir appartient à la Nation, et non plus seulement au roi.
- terme: constitution
  definition: le texte qui fixe les règles du pouvoir dans un pays.
erreurs_frequentes:
- Confondre la date de la Déclaration des Droits de l'Homme et du Citoyen (26 août) avec celle de l'abolition des privilèges
  (nuit du 4 août).
- Ne citer aucun principe affirmé par la Déclaration (liberté, égalité...).
- 'Croire que la Déclaration donne tout le pouvoir au roi : elle dit au contraire que le pouvoir appartient à la Nation.'
- Oublier que l'égalité veut dire les mêmes droits pour tous, alors que la société d'ordres avait des privilèges.
exemple:
  enonce: À quelle date la Déclaration des Droits de l'Homme et du Citoyen est-elle adoptée, et quels principes affirme-t-elle
    ?
  solution: Elle est adoptée le 26 août 1789 par l'Assemblée nationale. Elle affirme de nouveaux principes, comme la liberté,
    l'égalité en droits et la souveraineté nationale (le pouvoir appartient à la Nation).
exercices:
- id: jour-declaration
  type: nombre
  difficulte: 1
  enonce: Quel jour du mois d'août 1789 la Déclaration des Droits de l'Homme et du Citoyen est-elle adoptée ?
  reponse:
    valeur: 26
    forme: entier
  indices:
    relance: Cette date est un repère du programme, à ne pas confondre avec une autre du même mois.
    methode: Ce jour vient après la nuit du 4 août, qui a aboli les privilèges.
    etape: Le nombre se termine par 6.
  pieges:
  - si:
      valeur: 4
    relance: Le 4 août, c'est l'abolition des privilèges. La Déclaration est adoptée plus tard dans le mois.
  solution: La Déclaration des Droits de l'Homme et du Citoyen est adoptée le 26 août 1789.
- id: type-principes
  type: choix
  difficulte: 1
  enonce: La Déclaration des Droits de l'Homme et du Citoyen affirme-t-elle les anciens principes de l'Ancien Régime ou de
    nouveaux principes ?
  reponse:
    options:
    - id: a
      texte: De nouveaux principes
    - id: b
      texte: Les anciens principes de l'Ancien Régime
    - id: c
      texte: Aucun principe
    bonnes:
    - a
  indices:
    relance: 'Relis le titre du thème : « 1789, une année révolutionnaire ».'
    methode: Un texte révolutionnaire change les principes, il ne garde pas ceux d'avant.
    etape: Ce texte marque une rupture avec la société d'ordres de l'Ancien Régime.
  pieges:
  - si:
      contient:
      - b
    relance: L'Ancien Régime prend fin en 1789. Ce texte n'en garde pas les principes.
  - si:
      contient:
      - c
    relance: La Déclaration affirme bien des principes précis, comme la liberté ou l'égalité.
  solution: Elle affirme de nouveaux principes d'organisation de la société.
- id: citer-principe
  type: texte_court
  difficulte: 2
  enonce: Cite un mot-clé associé à la Déclaration des Droits de l'Homme et du Citoyen.
  reponse:
    acceptees:
    - liberté
    - égalité
    - citoyenneté
    - constitution
    - souveraineté nationale
    - droits de l'Homme
    fautes_tolerees: 1
  indices:
    relance: Un de ces mots est déjà dans le titre du texte.
    methode: Pense à des mots qui décrivent ce que chaque citoyen peut désormais espérer.
    etape: Deux de ces mots commencent par la lettre « l » et la lettre « é ».
  pieges: []
  solution: Par exemple liberté et égalité (ou droits de l'Homme, citoyenneté, constitution, souveraineté nationale).
- id: association-mots-cles-declaration
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Citoyenneté
    - id: b
      texte: Souveraineté nationale
    droite:
    - id: x
      texte: Mot-clé associé à la Déclaration des Droits de l'Homme et du Citoyen
    - id: y
      texte: Principe selon lequel le pouvoir appartient à la Nation
    paires:
      a: x
      b: y
  indices:
    relance: L'un des deux mots est un principe très général sur le pouvoir, l'autre un mot-clé plus large.
    methode: La souveraineté nationale parle du pouvoir et de la Nation ; la citoyenneté est un mot-clé du texte.
    etape: Relie d'abord « souveraineté nationale » à sa définition, qui parle du pouvoir de la Nation.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends les deux mots un par un.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, le principe qui parle du pouvoir de la Nation, puis place l'autre mot.
  solution: La citoyenneté est un mot-clé associé à la Déclaration ; la souveraineté nationale est le principe selon lequel
    le pouvoir appartient à la Nation.
- id: egalite-en-droits
  type: choix
  difficulte: 2
  enonce: Après la Déclaration du 26 août 1789, un noble et un paysan ont-ils les mêmes droits ?
  reponse:
    options:
    - id: a
      texte: Oui, ils sont égaux en droits
    - id: b
      texte: Non, le noble garde plus de droits que le paysan
    - id: c
      texte: Non, le paysan a plus de droits que le noble
    bonnes:
    - a
  indices:
    relance: Quel principe de la Déclaration parle des droits de chacun ?
    methode: Pense au principe d'égalité, affirmé par la Déclaration, et aux privilèges abolis le 4 août.
    etape: Les privilèges ont été abolis la nuit du 4 août. Un des deux peut-il encore avoir plus de droits que l'autre ?
  pieges:
  - si:
      contient:
      - b
    relance: Les privilèges de la noblesse ont été abolis la nuit du 4 août. Que dit la Déclaration sur les droits de chacun
      ?
  - si:
      contient:
      - c
    relance: La Déclaration ne donne pas plus de droits à un groupe qu'à un autre. Pense au principe d'égalité.
  solution: Oui. La Déclaration affirme l'égalité, tous les hommes ont les mêmes droits. Le noble et le paysan ont donc les
    mêmes droits.
- id: mot-du-titre
  type: texte_court
  difficulte: 1
  enonce: Complète le titre du texte du 26 août 1789 avec le mot qui désigne un membre de la Nation ayant des droits. « Déclaration
    des Droits de l'Homme et du ... »
  reponse:
    acceptees:
    - Citoyen
    - le Citoyen
    - citoyens
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne une personne qui fait partie de la Nation.
    methode: Relis le vocabulaire de ta fiche, à côté du mot « Nation ».
    etape: C'est le mot que ta fiche emploie pour dire « membre de la Nation qui a des droits ».
  pieges:
  - si:
      valeur: roi
    relance: Le texte ne parle pas des droits du roi, mais de ceux de chaque membre de la Nation.
  solution: La Déclaration des Droits de l'Homme et du Citoyen.
- id: chronologie-1789
  type: ordre
  difficulte: 2
  enonce: Range ces événements de l'année 1789 du plus ancien au plus récent.
  reponse:
    elements:
    - id: etats
      texte: Réunion des États-Généraux
    - id: bastille
      texte: Prise de la Bastille
    - id: privileges
      texte: Abolition des privilèges
    - id: declaration
      texte: Déclaration des Droits de l'Homme et du Citoyen
  indices:
    relance: Lequel de ces événements a lieu au printemps, et lequel à la fin du mois d'août ?
    methode: 'Pense aux dates de ta frise : le printemps, le 14 juillet, la nuit du 4 août, le 26 août.'
    etape: La réunion des États-Généraux a lieu au printemps, c'est la plus ancienne. Quel événement a lieu le 14 juillet
      ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux événements voisins sont inversés. Compare leurs dates.
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'événement du printemps, puis range les autres grâce à leurs dates, du 14 juillet au 26 août.
  solution: Réunion des États-Généraux (printemps 1789), prise de la Bastille (14 juillet), abolition des privilèges (nuit
    du 4 août), Déclaration des Droits de l'Homme et du Citoyen (26 août).
- id: pourquoi-declaration
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases ce qu'affirme la Déclaration des Droits de l'Homme et du Citoyen et à quelle date.
  criteres:
  - L'élève donne la date du 26 août 1789.
  - L'élève cite au moins un principe affirmé (liberté, égalité, ou autre mot-clé).
  - L'élève explique un principe avec ses mots (par exemple, tous les hommes ont les mêmes droits, ou le pouvoir appartient
    à la Nation).
  indices:
    relance: Quelle date faut-il retenir, et quels mots sont associés à ce texte ?
    methode: Donne d'abord la date, puis cite un ou deux principes affirmés par le texte.
    etape: 'Tu peux commencer ainsi : « Le 26 août 1789, la Déclaration des Droits de l''Homme et du Citoyen... »'
  solution: Le 26 août 1789, la Déclaration des Droits de l'Homme et du Citoyen est adoptée. Elle affirme de nouveaux principes
    d'organisation de la société, comme la liberté et l'égalité. Désormais, tous les hommes ont les mêmes droits.
