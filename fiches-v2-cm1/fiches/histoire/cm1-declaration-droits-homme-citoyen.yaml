format: 2
notion: cm1-declaration-droits-homme-citoyen
version: 1
etat: verifiee
declencheurs:
- déclaration des droits de l'homme
- 26 août 1789
- liberté égalité
- droits du citoyen
- nouveaux principes de la société
- souveraineté nationale
prerequis:
- cm1-1789-fin-monarchie-absolue
couverture: 'Ne couvre que ce que dit le programme : la Déclaration des Droits de l''Homme et du Citoyen, datée du 26 août
  1789, affirme de nouveaux principes d''organisation de la société. Le programme ne détaille pas les articles précis : les
  mots-clés associés sont liberté, égalité, droits de l''Homme, citoyenneté, constitution, souveraineté nationale.'
essentiel: 'Le 26 août 1789, la Déclaration des Droits de l''Homme et du Citoyen est adoptée par l''Assemblée nationale.


  Elle affirme de nouveaux principes d''organisation de la société, à la place de ceux de l''Ancien Régime.


  Des mots sont associés à ce texte : liberté, égalité, droits de l''Homme, citoyenneté, constitution, souveraineté nationale.'
methode:
- Retenir la date du 26 août 1789 pour la Déclaration des Droits de l'Homme et du Citoyen.
- Citer au moins un principe qu'elle affirme (par exemple la liberté ou l'égalité).
- Relier ce texte à l'idée de nouveaux principes d'organisation de la société, différents de ceux de l'Ancien Régime.
vocabulaire:
- terme: droits de l'Homme
  definition: principes affirmés par la Déclaration du 26 août 1789
- terme: citoyenneté
  definition: mot-clé associé à la Déclaration des Droits de l'Homme et du Citoyen
- terme: souveraineté nationale
  definition: principe selon lequel le pouvoir appartient à la Nation, et non plus seulement au roi
erreurs_frequentes:
- Confondre la date de la Déclaration des Droits de l'Homme et du Citoyen (26 août) avec celle de l'abolition des privilèges
  (nuit du 4 août).
- Ne citer aucun principe affirmé par la Déclaration (liberté, égalité...).
exemple:
  enonce: À quelle date la Déclaration des Droits de l'Homme et du Citoyen est-elle adoptée ?
  solution: Le 26 août 1789.
exercices:
- id: jour-declaration
  type: nombre
  difficulte: 1
  enonce: Quel jour du mois d'août 1789 la Déclaration des Droits de l'Homme et du Citoyen est-elle adoptée ?
  reponse:
    valeur: 26
    forme: entier
  indices:
    relance: Cette date est un repère du programme, à ne pas confondre avec une autre du même mois.
    methode: Ce jour vient après la nuit du 4 août, qui a aboli les privilèges.
    etape: Le nombre se termine par 6.
  pieges:
  - si:
      valeur: 4
    relance: Le 4 août, c'est l'abolition des privilèges. La Déclaration est adoptée plus tard dans le mois.
  solution: La Déclaration des Droits de l'Homme et du Citoyen est adoptée le 26 août 1789.
- id: type-principes
  type: choix
  difficulte: 1
  enonce: La Déclaration des Droits de l'Homme et du Citoyen affirme-t-elle les anciens principes de l'Ancien Régime ou de
    nouveaux principes ?
  reponse:
    options:
    - id: a
      texte: De nouveaux principes
    - id: b
      texte: Les anciens principes de l'Ancien Régime
    - id: c
      texte: Aucun principe
    bonnes:
    - a
  indices:
    relance: 'Relis le titre du thème : « 1789, une année révolutionnaire ».'
    methode: Un texte révolutionnaire change les principes, il ne garde pas ceux d'avant.
    etape: Ce texte marque une rupture avec la société d'ordres de l'Ancien Régime.
  pieges:
  - si:
      contient:
      - b
    relance: L'Ancien Régime prend fin en 1789. Ce texte n'en garde pas les principes.
  - si:
      contient:
      - c
    relance: La Déclaration affirme bien des principes précis, comme la liberté ou l'égalité.
  solution: Elle affirme de nouveaux principes d'organisation de la société.
- id: citer-principe
  type: texte_court
  difficulte: 2
  enonce: Cite un mot-clé associé à la Déclaration des Droits de l'Homme et du Citoyen.
  reponse:
    acceptees:
    - liberté
    - égalité
    - citoyenneté
    - constitution
    - souveraineté nationale
    fautes_tolerees: 1
  indices:
    relance: Un de ces mots est déjà dans le titre du texte.
    methode: Pense à des mots qui décrivent ce que chaque citoyen peut désormais espérer.
    etape: Deux de ces mots commencent par la lettre « l » et la lettre « é ».
  pieges: []
  solution: Par exemple liberté et égalité (ou droits de l'Homme, citoyenneté, constitution, souveraineté nationale).
- id: association-mots-cles-declaration
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Citoyenneté
    - id: b
      texte: Souveraineté nationale
    droite:
    - id: x
      texte: Mot-clé associé à la Déclaration des Droits de l'Homme et du Citoyen
    - id: y
      texte: Principe selon lequel le pouvoir appartient à la Nation
    paires:
      a: x
      b: y
  indices:
    relance: L'un des deux mots est un principe très général sur le pouvoir, l'autre un mot-clé plus large.
    methode: La souveraineté nationale parle du pouvoir et de la Nation ; la citoyenneté est un mot-clé du texte.
    etape: Relie d'abord « souveraineté nationale » à sa définition, qui parle du pouvoir de la Nation.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends les deux mots un par un.
  solution: La citoyenneté est un mot-clé associé à la Déclaration ; la souveraineté nationale est le principe selon lequel
    le pouvoir appartient à la Nation.
- id: pourquoi-declaration
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases ce qu'affirme la Déclaration des Droits de l'Homme et du Citoyen et à quelle date.
  criteres:
  - L'élève donne la date du 26 août 1789.
  - L'élève cite au moins un principe affirmé (liberté, égalité, ou autre mot-clé).
  indices:
    relance: Quelle date faut-il retenir, et quels mots sont associés à ce texte ?
    methode: Donne d'abord la date, puis cite un ou deux principes affirmés par le texte.
    etape: 'Tu peux commencer ainsi : « Le 26 août 1789, la Déclaration des Droits de l''Homme et du Citoyen... »'
  solution: Le 26 août 1789, la Déclaration des Droits de l'Homme et du Citoyen est adoptée. Elle affirme de nouveaux principes
    d'organisation de la société, comme la liberté et l'égalité.
