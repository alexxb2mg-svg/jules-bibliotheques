  difficulte: 2
  enonce: Que signifie le principe de la « souveraineté nationale » défini dans le vocabulaire de la fiche ?
  reponse:
    options:
    - id: o1
      texte: Le pouvoir appartient à la Nation, et non plus seulement au roi.
    - id: o2
      texte: Le roi conserve tout le pouvoir de décision dans le royaume.
    - id: o3
      texte: Le pouvoir appartient uniquement aux seigneurs.
    - id: o4
      texte: L'Église dirige l'ensemble des affaires politiques.
    bonnes:
    - o1
  indices:
    relance: Pense à l'entité globale qui détient désormais l'autorité suprême.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Cela décrivait le pouvoir absolu sous l'Ancien Régime, rejeté par la Déclaration.
  - si:
      contient:
      - o3
    relance: C'est une confusion avec le pouvoir féodal des seigneurs au Moyen Âge.
  - si:
      contient:
      - o4
    relance: L'Église avait un rôle religieux et social, mais pas la souveraineté nationale.
  solution: Le pouvoir appartient à la Nation, et non plus seulement au roi. C'est la définition exacte donnée par la fiche
    de révision.
