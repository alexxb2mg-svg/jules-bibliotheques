format: 2
notion: cm1-societe-ordres-clerge-noblesse-tiers-etat
version: 3
etat: generee
declencheurs:
- trois ordres de la société
- clergé noblesse tiers état
- qui paie les impôts avant 1789
- groupes de la société d'ancien régime
- société divisée en groupes
- majoritairement des paysans
- avantages réservés à certains
- société en pyramide
prerequis: []
essentiel: 'Sous l''Ancien Régime, c''est-à-dire avant 1789, la société du royaume de France est divisée en trois groupes.
  On les appelle les trois ordres, et on parle d''une société d''ordres.


  Le premier ordre est le clergé : ce sont les religieux, comme le curé de la paroisse ou les moines d''une abbaye. Le deuxième
  ordre est la noblesse : ce sont les nobles. Le troisième ordre est le tiers état : il regroupe tous ceux qui ne sont ni
  religieux ni nobles.


  Le tiers état est de loin le plus nombreux. La société d''ordres est majoritairement composée de paysannes et de paysans,
  qui travaillent la terre. Le tiers état compte aussi les artisans et les autres habitants des villes.


  Les trois ordres ne sont pas égaux : la société d''ordres connaît des privilèges, c''est-à-dire des avantages réservés à
  certains. Ces privilèges seront abolis pendant la nuit du 4 août 1789, l''année où la société d''ordres prend fin.


  Pour trouver l''ordre d''une personne, pose-toi deux questions. Est-elle religieuse ? Alors elle est du clergé. Est-elle
  noble ? Alors elle est de la noblesse. Sinon, elle fait partie du tiers état, comme une paysanne, un boulanger ou un forgeron.


  Une image pour retenir : une pyramide. En haut, deux petits groupes, le clergé et la noblesse. En bas, un très grand groupe,
  le tiers état.

  '
methode:
- 'Retenir les trois ordres, dans l''ordre du programme : clergé, noblesse, tiers état.'
- 'Pour une personne, se demander d''abord : est-elle religieuse ? Si oui, elle est du clergé.'
- 'Se demander ensuite : est-elle noble ? Si oui, elle est de la noblesse. Sinon, elle est du tiers état.'
- Se rappeler que la majorité des gens du royaume sont des paysans, et qu'ils font partie du tiers état.
- Se rappeler que les ordres ne sont pas égaux, et que les privilèges sont abolis la nuit du 4 août 1789.
- Vérifier qu'aucun des trois ordres n'est oublié quand on décrit la société d'Ancien Régime.
vocabulaire:
- terme: Ancien Régime
  definition: le nom donné à l'organisation du royaume de France avant 1789.
- terme: société d'ordres
  definition: 'une société divisée en trois groupes : le clergé, la noblesse, le tiers état.'
- terme: clergé
  definition: l'un des trois ordres, formé des religieux.
- terme: noblesse
  definition: l'un des trois ordres, formé des nobles.
- terme: tiers état
  definition: l'un des trois ordres, formé de tous ceux qui ne sont ni du clergé ni de la noblesse, majoritairement des paysans.
- terme: privilège
  definition: un avantage réservé à certains, que les autres n'ont pas.
erreurs_frequentes:
- Oublier un des trois ordres (clergé, noblesse, tiers état).
- Croire que les paysans sont peu nombreux, alors que la société d'ordres en est majoritairement composée.
- 'Placer un artisan ou un habitant de la ville dans la noblesse : s''il n''est ni noble ni religieux, il fait partie du tiers
  état.'
- 'Croire que les trois ordres sont égaux : la société d''ordres connaît des privilèges, abolis en 1789.'
exemple:
  enonce: Nomme les trois ordres de la société d'Ancien Régime, puis dis dans quel ordre se trouve un paysan.
  solution: Les trois ordres sont le clergé (les religieux), la noblesse (les nobles) et le tiers état (tous les autres).
    Un paysan n'est ni religieux ni noble, il fait donc partie du tiers état, l'ordre le plus nombreux.
