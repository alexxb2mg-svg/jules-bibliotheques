format: 2
notion: cm1-contexte-royaume-1789
version: 3
etat: verifiee
declencheurs:
- avant la révolution
- les lumières
- cahiers de doléances
- état des choses en 1789
- philosophe des lumières
- états-généraux
- plaintes des habitants du royaume
- idées nouvelles au XVIIIe siècle
- grand livre des connaissances
prerequis:
- cm1-traite-esclaves-plantations
essentiel: 'En 1789, le royaume de France vit une période difficile, qui prépare la Révolution. Pour la comprendre, on regarde
  trois aspects du contexte : social, économique et intellectuel.


  Le contexte social, c''est l''organisation de la société. Elle est encore divisée en trois ordres : le clergé, la noblesse
  et le tiers état. Le tiers état, surtout composé de paysans, est le plus nombreux, mais il n''a pas les privilèges du clergé
  et de la noblesse.


  Le contexte économique, c''est la façon dont les habitants gagnent leur vie : le travail, les récoltes, le commerce. Dans
  le royaume, la plupart des habitants sont des paysans qui vivent du travail de la terre. D''autres sont artisans ou commerçants
  dans les villes.


  Le contexte intellectuel, ce sont les idées. Des philosophes des Lumières réfléchissent à la société. Leurs idées, comme
  la liberté et l''égalité, remettent en question la monarchie absolue et la société d''ordres. Leurs idées circulent, par
  exemple dans l''Encyclopédie, un grand ouvrage qui veut réunir les connaissances de son temps.


  Au printemps 1789, dans tout le royaume, les habitants rédigent des cahiers de doléances : ils y écrivent leurs plaintes
  et leurs demandes. Au même moment, les États-Généraux se réunissent : c''est une assemblée de représentants des trois ordres.


  Un exemple pour comprendre les cahiers de doléances : imagine que chaque classe écrive sur un cahier ce qui ne va pas à
  l''école. Elle y note aussi ce qu''elle voudrait changer, avant une grande réunion.

  '
methode:
- 'Distinguer les trois aspects du contexte de 1789 : social, économique, intellectuel.'
- Pour l'aspect social, rappeler la société d'ordres et les privilèges du clergé et de la noblesse.
- Pour l'aspect économique, parler du travail des habitants, surtout des paysans qui vivent de la terre.
- Pour l'aspect intellectuel, citer une idée des Lumières et un philosophe.
- Relier le printemps 1789 aux cahiers de doléances et à la réunion des États-Généraux.
vocabulaire:
- terme: les Lumières
  definition: mouvement d'idées de philosophes dont les idées circulent en France en 1789.
- terme: philosophe
  definition: une personne qui réfléchit sur le monde et la société.
- terme: l'Encyclopédie
  definition: un grand ouvrage des Lumières qui veut réunir les connaissances de son temps.
- terme: cahiers de doléances
  definition: cahiers où sont notées les plaintes et demandes des habitants du royaume, rédigés au printemps 1789.
- terme: États-Généraux
  definition: une assemblée de représentants des trois ordres, réunie au printemps 1789.
- terme: Ancien Régime
  definition: le nom donné à l'organisation du royaume de France avant 1789.
erreurs_frequentes:
- 'Oublier qu''il y a trois aspects au contexte de 1789 : social, économique et intellectuel.'
- 'Placer la rédaction des cahiers de doléances à une mauvaise période : c''est le printemps 1789.'
- Confondre les cahiers de doléances et la Déclaration des Droits de l'Homme et du Citoyen, rédigée plus tard.
- 'Croire que les Lumières sont des lampes : ce sont des idées, portées par des philosophes.'
exemple:
  enonce: Que se passe-t-il au printemps 1789 ?
  solution: Dans tout le royaume, les habitants rédigent des cahiers de doléances, où ils notent leurs plaintes et leurs demandes.
    Au même moment, les États-Généraux, une assemblée de représentants des trois ordres, se réunissent.
exercices:
- id: aspects-contexte
  type: choix
  difficulte: 1
  enonce: Quels sont les trois aspects du contexte du royaume de France en 1789 ?
  reponse:
    options:
    - id: a
      texte: Social, économique, intellectuel
    - id: b
      texte: Militaire, religieux, artistique
    - id: c
      texte: Politique, sportif, culinaire
    bonnes:
    - a
  indices:
    relance: Pense à la société, à l'argent et aux idées.
    methode: Le premier aspect concerne les groupes de population, le deuxième l'argent, le troisième les idées.
    etape: Un de ces trois mots est « intellectuel », qui concerne les idées des Lumières.
  pieges:
  - si:
      contient:
      - b
    relance: Le programme ne cite ni l'aspect militaire, ni religieux, ni artistique pour ce contexte.
  - si:
      contient:
      - c
    relance: Le programme ne cite ni le sport ni la cuisine pour décrire ce contexte.
  solution: Le contexte est social, économique et intellectuel.
- id: mouvement-idees
  type: texte_court
  difficulte: 1
  enonce: À quel mouvement d'idées appartiennent les philosophes dont les idées circulent en 1789 ?
  reponse:
    acceptees:
    - lumières
    fautes_tolerees: 1
  indices:
    relance: Ce mot est un mot-clé du programme, cité aussi dans le vocabulaire de la fiche.
    methode: Ce mouvement porte le nom d'une source de clarté.
    etape: Ce mot commence par « Lu- » et évoque la clarté qui chasse l'obscurité des idées anciennes.
  pieges: []
  solution: Les Lumières, un mouvement d'idées de philosophes.
- id: idee-des-lumieres
  type: choix
  difficulte: 1
  enonce: Laquelle de ces idées est une idée défendue par les philosophes des Lumières ?
  reponse:
    options:
    - id: a
      texte: Les hommes doivent être libres et égaux
    - id: b
      texte: Le roi doit décider de tout, seul
    - id: c
      texte: Le clergé et la noblesse doivent garder leurs privilèges
    bonnes:
    - a
  indices:
    relance: Les philosophes des Lumières veulent-ils garder la société comme elle est, ou la changer ?
    methode: Leurs idées remettent en question le pouvoir absolu du roi et l'inégalité entre les ordres.
    etape: Un roi qui décide de tout seul, c'est la monarchie absolue de l'Ancien Régime. Élimine ce choix, puis compare les
      deux autres.
  pieges:
  - si:
      contient:
      - b
    relance: Un roi qui décide de tout seul, c'est le pouvoir absolu. Les idées des Lumières le remettent en question.
  - si:
      contient:
      - c
    relance: Les privilèges rendent les ordres inégaux. Les philosophes des Lumières défendent-ils l'inégalité ?
  solution: Les philosophes des Lumières défendent l'idée que les hommes doivent être libres et égaux.
- id: quand-cahiers-doleances
  type: choix
  difficulte: 2
  enonce: À quel moment de l'année 1789 les cahiers de doléances sont-ils rédigés ?
  reponse:
    options:
    - id: a
      texte: Au printemps
    - id: b
      texte: En hiver
    - id: c
      texte: En automne
    bonnes:
    - a
  indices:
    relance: C'est aussi le moment où les États-Généraux se réunissent.
    methode: Ce moment de l'année précède l'été, entre l'hiver et l'été.
    etape: C'est la même saison que celle qui voit fleurir les arbres.
  pieges:
  - si:
      contient:
      - b
    relance: L'hiver précède le printemps. Les cahiers de doléances sont rédigés un peu plus tard dans l'année.
  - si:
      contient:
      - c
    relance: L'automne vient après l'été. Cherche une saison plus tôt dans l'année, entre l'hiver et l'été.
  solution: Les cahiers de doléances sont rédigés au printemps 1789.
- id: association-mots-cles
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Les Lumières
    - id: b
      texte: Cahiers de doléances
    droite:
    - id: x
      texte: Mouvement d'idées de philosophes
    - id: y
      texte: Cahiers où sont notées les plaintes et demandes des habitants
    paires:
      a: x
      b: y
  indices:
    relance: L'un des deux mots désigne un mouvement d'idées, l'autre des documents écrits.
    methode: Les Lumières sont portées par des philosophes ; les cahiers de doléances sont rédigés par les habitants.
    etape: Relie d'abord « Les Lumières » à sa définition, qui parle de philosophes.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends les deux mots un par un.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, le mouvement d'idées des philosophes, puis place l'autre mot.
  solution: Les Lumières sont un mouvement d'idées de philosophes ; les cahiers de doléances sont les cahiers où sont notées
    les plaintes et demandes des habitants du royaume.
- id: aspects-et-exemples
  type: association
  difficulte: 2
  enonce: Relie chaque aspect du contexte de 1789 à l'exemple qui lui correspond.
  reponse:
    gauche:
    - id: a
      texte: Le contexte social
    - id: b
      texte: Le contexte économique
    - id: c
      texte: Le contexte intellectuel
    droite:
    - id: x
      texte: La société est divisée en trois ordres qui ne sont pas égaux
    - id: y
      texte: La plupart des habitants vivent du travail de la terre
    - id: z
      texte: Les philosophes des Lumières font circuler des idées nouvelles
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un aspect parle de la société, un autre du travail des habitants, le dernier des idées.
    methode: Pour chaque exemple, demande-toi s'il parle des groupes de la société, du travail ou des idées.
    etape: Les idées nouvelles des philosophes vont avec le contexte intellectuel. Place les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque exemple en te demandant s'il parle de société, de travail ou
      d'idées.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, les idées des philosophes, puis place le travail et la société.
  solution: 'Social : la société divisée en trois ordres inégaux. Économique : la plupart des habitants vivent du travail
    de la terre. Intellectuel : les idées nouvelles des philosophes des Lumières.'
- id: grand-ouvrage-lumieres
  type: texte_court
  difficulte: 2
  enonce: Quel grand ouvrage des Lumières veut réunir les connaissances de son temps ?
  reponse:
    acceptees:
    - Encyclopédie
    - l'Encyclopédie
    - encyclopedie
    fautes_tolerees: 1
  indices:
    relance: C'est un très grand ouvrage, qui parle de presque tous les sujets.
    methode: Relis le vocabulaire de ta fiche. C'est un mot-clé du programme sur les Lumières.
    etape: Ce nom est aussi un mot-clé de ta fiche, dans la partie sur le contexte intellectuel.
  pieges:
  - si:
      valeur: dictionnaire
    relance: C'est proche, mais cet ouvrage des Lumières porte un nom précis. Relis ton vocabulaire.
  solution: L'Encyclopédie, un grand ouvrage des Lumières.
- id: pourquoi-contexte-1789
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases le contexte du royaume de France en 1789.
  criteres:
  - L'élève cite les trois aspects du contexte (social, économique, intellectuel).
  - L'élève mentionne les Lumières ou les cahiers de doléances et les États-Généraux.
  - L'élève donne un exemple précis pour au moins un aspect (trois ordres inégaux, paysans qui vivent de la terre, idée de
    liberté ou d'égalité).
  indices:
    relance: Quels sont les trois domaines qui composent ce contexte ?
    methode: Cite d'abord les trois aspects, puis donne un exemple précis pour l'un d'eux.
    etape: 'Tu peux commencer ainsi : « En 1789, le royaume de France connaît un contexte social, économique et intellectuel...
      »'
  solution: En 1789, le royaume de France connaît un contexte social, économique et intellectuel particulier. Les idées des
    Lumières, portées par des philosophes, circulent dans le royaume. Au printemps 1789, des cahiers de doléances sont rédigés
    et les États-Généraux se réunissent.
