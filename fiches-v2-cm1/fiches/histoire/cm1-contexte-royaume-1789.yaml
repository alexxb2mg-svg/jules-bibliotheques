  enonce: Quels sont les trois aspects du contexte du royaume de France en 1789 ?
  reponse:
    options:
    - id: a
      texte: Social, économique, intellectuel
    - id: b
      texte: Militaire, religieux, artistique
    - id: c
      texte: Politique, sportif, culinaire
    bonnes:
    - a
  indices:
    relance: Pense à la société, à l'argent et aux idées.
    methode: Le premier aspect concerne les groupes de population, le deuxième l'argent, le troisième les idées.
    etape: Un de ces trois mots est « intellectuel », qui concerne les idées des Lumières.
  pieges:
  - si:
      contient:
      - b
    relance: Le programme ne cite ni l'aspect militaire, ni religieux, ni artistique pour ce contexte.
  - si:
      contient:
      - c
    relance: Le programme ne cite ni le sport ni la cuisine pour décrire ce contexte.
  solution: Le contexte est social, économique et intellectuel.
- id: mouvement-idees
  type: texte_court
  difficulte: 1
  enonce: À quel mouvement d'idées appartiennent les philosophes dont les idées circulent en 1789 ?
  reponse:
    acceptees:
    - lumières
    fautes_tolerees: 1
  indices:
    relance: Ce mot est un mot-clé du programme, cité aussi dans le vocabulaire de la fiche.
    methode: Ce mouvement porte le nom d'une source de clarté.
    etape: Ce mot commence par « Lu- » et évoque la clarté qui chasse l'obscurité des idées anciennes.
  pieges: []
  solution: Les Lumières, un mouvement d'idées de philosophes.
- id: idee-des-lumieres
  type: choix
  difficulte: 1
  enonce: Laquelle de ces idées est une idée défendue par les philosophes des Lumières ?
  reponse:
    options:
    - id: a
      texte: Les hommes doivent être libres et égaux
    - id: b
      texte: Le roi doit décider de tout, seul
    - id: c
      texte: Le clergé et la noblesse doivent garder leurs privilèges
    bonnes:
    - a
  indices:
    relance: Les philosophes des Lumières veulent-ils garder la société comme elle est, ou la changer ?
    methode: Leurs idées remettent en question le pouvoir absolu du roi et l'inégalité entre les ordres.
    etape: Un roi qui décide de tout seul, c'est la monarchie absolue de l'Ancien Régime. Élimine ce choix, puis compare les
      deux autres.
  pieges:
  - si:
      contient:
      - b
    relance: Un roi qui décide de tout seul, c'est le pouvoir absolu. Les idées des Lumières le remettent en question.
  - si:
      contient:
      - c
    relance: Les privilèges rendent les ordres inégaux. Les philosophes des Lumières défendent-ils l'inégalité ?
  solution: Les philosophes des Lumières défendent l'idée que les hommes doivent être libres et égaux.
- id: quand-cahiers-doleances
  type: choix
  difficulte: 2
  enonce: À quel moment de l'année 1789 les cahiers de doléances sont-ils rédigés ?
  reponse:
    options:
    - id: a
      texte: Au printemps
    - id: b
      texte: En hiver
    - id: c
      texte: En automne
    bonnes:
    - a
  indices:
    relance: C'est aussi le moment où les États-Généraux se réunissent.
    methode: Ce moment de l'année précède l'été, entre l'hiver et l'été.
    etape: C'est la même saison que celle qui voit fleurir les arbres.
  pieges:
  - si:
      contient:
      - b
    relance: L'hiver précède le printemps. Les cahiers de doléances sont rédigés un peu plus tard dans l'année.
  - si:
      contient:
      - c
    relance: L'automne vient après l'été. Cherche une saison plus tôt dans l'année, entre l'hiver et l'été.
  solution: Les cahiers de doléances sont rédigés au printemps 1789.
