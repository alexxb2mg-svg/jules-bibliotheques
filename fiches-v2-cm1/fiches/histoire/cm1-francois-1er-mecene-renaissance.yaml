    - mécène
    - mecene
    fautes_tolerees: 1
  indices:
    relance: Ce mot ne désigne pas l'artiste, mais celui qui l'aide.
    methode: François Ier est décrit avec ce mot dans ta fiche.
    etape: Le mot commence par « mé ».
  pieges:
  - si:
      valeur: artiste
    relance: L'artiste est celui qui crée les œuvres, pas celui qui le soutient.
  solution: On appelle cela un mécène.
- id: annee-debut-regne
  type: nombre
  difficulte: 1
  enonce: En quelle année commence le règne de François Ier ?
  reponse:
