    forme: entier
  indices:
    relance: Cette année est aussi celle de l'arrivée de Léonard de Vinci en France.
    methode: L'année a quatre chiffres et commence par 15.
    etape: Ce n'est pas l'année de la mort de Léonard de Vinci.
  pieges:
  - si:
      valeur: 1547
    relance: 1547, c'est l'année où le règne de François Ier se termine, pas celle où il commence.
  - si:
      valeur: 1519
    relance: 1519, c'est l'année de la mort de Léonard de Vinci, pas le début du règne de François Ier.
  solution: Le règne de François Ier commence en 1515.
- id: annee-fin-regne
  type: nombre
  difficulte: 2
  enonce: En quelle année se termine le règne de François Ier ?
  reponse:
    valeur: 1547
    forme: entier
  indices:
    relance: Cette année est bien après le début de son règne.
    methode: Le règne dure plusieurs dizaines d'années à partir de 1515.
    etape: L'année a quatre chiffres et commence par 15.
  pieges:
  - si:
      valeur: 1515
    relance: 1515, c'est l'année où le règne de François Ier commence, pas celle où il se termine.
  - si:
      valeur: 1519
    relance: 1519, c'est la mort de Léonard de Vinci. Le roi, lui, règne encore longtemps après.
  solution: Le règne de François Ier se termine en 1547.
- id: annees-lda-vinci-en-france
  type: nombre
  difficulte: 2
  enonce: Combien d'années Léonard de Vinci a-t-il vécu en France, de son arrivée en 1515 à sa mort en 1519 ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Soustrais l'année d'arrivée à l'année de la mort.
    methode: 1519 moins 1515.
    etape: Le résultat est un petit nombre, moins de dix.
  pieges:
  - si:
      valeur: 1519
    relance: 1519 est l'année de la mort de Léonard de Vinci, pas le nombre d'années vécues en France.
  solution: Léonard de Vinci a vécu en France 4 ans (1519 - 1515 = 4).
- id: duree-regne
  type: nombre
  difficulte: 2
  enonce: François Ier règne de 1515 à 1547. Combien d'années dure son règne ?
  reponse:
    valeur: 32
    forme: entier
  indices:
    relance: Pour trouver une durée entre deux dates, quelle opération fais-tu ?
    methode: Soustrais l'année du début à l'année de la fin.
    etape: 'Pose la soustraction 1547 − 1515 : commence par les unités, 7 − 5.'
  pieges:
  - si:
      valeur: 1547
    relance: 1547 est une date, la fin du règne. On te demande une durée en années.
  - si:
      valeur: 1515
    relance: 1515 est une date, le début du règne. On te demande une durée en années.
  - si:
      valeur: 4
    relance: 4 ans, c'est le séjour de Léonard de Vinci en France. Calcule plutôt la durée du règne.
  solution: '1547 − 1515 = 32. Vérification : 1515 + 32 = 1547. Le règne de François Ier dure 32 ans.'
- id: qui-fait-quoi
  type: association
  difficulte: 2
  enonce: Relie chaque nom à ce qu'il désigne.
  reponse:
    gauche:
    - id: francois
      texte: François Ier
    - id: leonard
      texte: Léonard de Vinci
    - id: renaissance
      texte: La Renaissance
    droite:
    - id: roi-mecene
      texte: Un roi de France qui soutient les artistes
    - id: artiste
      texte: Un grand artiste invité en France
    - id: mouvement
      texte: Un mouvement artistique et culturel
    paires:
      francois: roi-mecene
      leonard: artiste
      renaissance: mouvement
  indices:
    relance: Parmi ces trois noms, lequel n'est pas une personne ?
    methode: Place d'abord le roi, puis l'artiste, puis le mouvement.
    etape: Le mouvement, c'est la Renaissance. Lequel des deux hommes est roi ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel des deux hommes crée les œuvres, et lequel l'aide ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par la Renaissance, qui n'est pas une personne, puis distingue le roi et l'artiste.
  solution: 'François Ier : un roi de France qui soutient les artistes. Léonard de Vinci : un grand artiste invité en France.
    La Renaissance : un mouvement artistique et culturel.'
- id: frise-francois-1er
  type: ordre
  difficulte: 2
  enonce: Range ces évènements du plus ancien au plus récent.
  reponse:
    elements:
