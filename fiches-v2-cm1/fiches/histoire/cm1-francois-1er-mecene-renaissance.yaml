format: 2
notion: cm1-francois-1er-mecene-renaissance
version: 2
etat: verifiee
declencheurs:
- roi qui invite un artiste
- soutenir un peintre célèbre
- règne au XVIe siècle
- roi et Léonard de Vinci
- diffuser un mouvement artistique
- protéger les artistes
- roi qui aime les arts
- peintre invité en france
prerequis: []
essentiel: 'François Ier est un roi de France. Il règne de 1515 à 1547, au XVIe siècle, soit 32 ans. C''est l''un des trois
  rois emblématiques de la monarchie française étudiés en CM1, avec Henri IV et Louis XIV.


  À son époque, c''est la Renaissance. C''est un grand mouvement artistique et culturel : des artistes peignent, sculptent
  et construisent de belles œuvres. Le mot veut dire « naître de nouveau » : on dit que les arts renaissent.


  François Ier est un roi mécène. Un mécène est une personne qui aide et soutient des artistes : il les accueille, les protège
  et leur donne les moyens de travailler. Attention : le mécène n''est pas l''artiste. Par exemple, quelqu''un qui offre un
  atelier et des pinceaux à un peintre pour qu''il puisse créer est son mécène.


  Le grand exemple est Léonard de Vinci. Invité par François Ier, ce célèbre artiste vient vivre en France en 1515. Il y reste
  jusqu''à sa mort, en 1519, soit 4 ans.


  Ce séjour montre le rôle d''un roi dans la diffusion de la Renaissance. En faisant venir un grand artiste et en le soutenant,
  le roi fait connaître dans son royaume les œuvres et les idées nouvelles. Grâce à lui, la Renaissance se répand en France.


  Retiens bien : 1515 est à la fois le début du règne de François Ier et le début du séjour de Léonard de Vinci en France.

  '
methode:
- Placer le règne de François Ier sur la frise, de 1515 à 1547.
- 'Retenir la définition du mot « mécène » : celui qui aide et soutient les artistes.'
- Distinguer le mécène (François Ier) de l'artiste (Léonard de Vinci).
- Relier Léonard de Vinci aux dates de son séjour en France, de 1515 à sa mort en 1519.
- Expliquer le rôle du roi en une phrase, en partant de l'exemple de Léonard de Vinci.
vocabulaire:
- terme: mécène
  definition: personne qui aide et soutient des artistes
- terme: Renaissance
  definition: grand mouvement artistique et culturel de l'époque de François Ier, qu'il aide à diffuser en France
- terme: artiste
  definition: personne qui crée des œuvres, comme un peintre ou un sculpteur
- terme: règne
  definition: la période pendant laquelle un roi gouverne
- terme: diffusion
  definition: le fait de faire connaître quelque chose à beaucoup de personnes
erreurs_frequentes:
- Confondre la date du début du règne de François Ier (1515) et la date de la mort de Léonard de Vinci (1519).
- Oublier que « mécène » signifie qu'il soutient des artistes, pas qu'il est lui-même artiste.
- Croire que Léonard de Vinci a vécu en France pendant tout le règne de François Ier, alors qu'il y reste de 1515 à 1519.
- Donner la date de fin du séjour de Léonard (1519) comme fin du règne, qui se termine en 1547.
exemple:
  enonce: Pourquoi dit-on que François Ier est un roi mécène de la Renaissance ?
  solution: Parce qu'il aide et soutient des artistes. Par exemple, il invite Léonard de Vinci à vivre en France à partir
    de 1515, jusqu'à sa mort en 1519. En le soutenant, il fait connaître les œuvres de la Renaissance dans son royaume.
exercices:
- id: definition-mecene
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une personne qui aide et soutient des artistes ?
  reponse:
    acceptees:
    - mécène
    - mecene
    fautes_tolerees: 1
  indices:
    relance: Ce mot ne désigne pas l'artiste, mais celui qui l'aide.
    methode: François Ier est décrit avec ce mot dans ta fiche.
    etape: Le mot commence par « mé ».
  pieges:
  - si:
      valeur: artiste
    relance: L'artiste est celui qui crée les œuvres, pas celui qui le soutient.
  solution: On appelle cela un mécène.
- id: annee-debut-regne
  type: nombre
  difficulte: 1
  enonce: En quelle année commence le règne de François Ier ?
  reponse:
    valeur: 1515
    forme: entier
  indices:
    relance: Cette année est aussi celle de l'arrivée de Léonard de Vinci en France.
    methode: L'année a quatre chiffres et commence par 15.
    etape: Ce n'est pas l'année de la mort de Léonard de Vinci.
  pieges:
  - si:
      valeur: 1547
    relance: 1547, c'est l'année où le règne de François Ier se termine, pas celle où il commence.
  - si:
      valeur: 1519
    relance: 1519, c'est l'année de la mort de Léonard de Vinci, pas le début du règne de François Ier.
  solution: Le règne de François Ier commence en 1515.
- id: annee-fin-regne
  type: nombre
  difficulte: 2
  enonce: En quelle année se termine le règne de François Ier ?
  reponse:
    valeur: 1547
    forme: entier
  indices:
    relance: Cette année est bien après le début de son règne.
    methode: Le règne dure plusieurs dizaines d'années à partir de 1515.
    etape: L'année a quatre chiffres et commence par 15.
  pieges:
  - si:
      valeur: 1515
    relance: 1515, c'est l'année où le règne de François Ier commence, pas celle où il se termine.
  - si:
      valeur: 1519
    relance: 1519, c'est la mort de Léonard de Vinci. Le roi, lui, règne encore longtemps après.
  solution: Le règne de François Ier se termine en 1547.
- id: annees-lda-vinci-en-france
  type: nombre
  difficulte: 2
  enonce: Combien d'années Léonard de Vinci a-t-il vécu en France, de son arrivée en 1515 à sa mort en 1519 ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Soustrais l'année d'arrivée à l'année de la mort.
    methode: 1519 moins 1515.
    etape: Le résultat est un petit nombre, moins de dix.
  pieges:
  - si:
      valeur: 1519
    relance: 1519 est l'année de la mort de Léonard de Vinci, pas le nombre d'années vécues en France.
  solution: Léonard de Vinci a vécu en France 4 ans (1519 - 1515 = 4).
- id: duree-regne
  type: nombre
  difficulte: 2
  enonce: François Ier règne de 1515 à 1547. Combien d'années dure son règne ?
  reponse:
    valeur: 32
    forme: entier
  indices:
    relance: Pour trouver une durée entre deux dates, quelle opération fais-tu ?
    methode: Soustrais l'année du début à l'année de la fin.
    etape: 'Pose la soustraction 1547 − 1515 : commence par les unités, 7 − 5.'
  pieges:
  - si:
      valeur: 1547
    relance: 1547 est une date, la fin du règne. On te demande une durée en années.
  - si:
      valeur: 1515
    relance: 1515 est une date, le début du règne. On te demande une durée en années.
  - si:
      valeur: 4
    relance: 4 ans, c'est le séjour de Léonard de Vinci en France. Calcule plutôt la durée du règne.
  solution: '1547 − 1515 = 32. Vérification : 1515 + 32 = 1547. Le règne de François Ier dure 32 ans.'
- id: qui-fait-quoi
  type: association
  difficulte: 2
  enonce: Relie chaque nom à ce qu'il désigne.
  reponse:
    gauche:
    - id: francois
      texte: François Ier
    - id: leonard
      texte: Léonard de Vinci
    - id: renaissance
      texte: La Renaissance
    droite:
    - id: roi-mecene
      texte: Un roi de France qui soutient les artistes
    - id: artiste
      texte: Un grand artiste invité en France
    - id: mouvement
      texte: Un mouvement artistique et culturel
    paires:
      francois: roi-mecene
      leonard: artiste
      renaissance: mouvement
  indices:
    relance: Parmi ces trois noms, lequel n'est pas une personne ?
    methode: Place d'abord le roi, puis l'artiste, puis le mouvement.
    etape: Le mouvement, c'est la Renaissance. Lequel des deux hommes est roi ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel des deux hommes crée les œuvres, et lequel l'aide ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par la Renaissance, qui n'est pas une personne, puis distingue le roi et l'artiste.
  solution: 'François Ier : un roi de France qui soutient les artistes. Léonard de Vinci : un grand artiste invité en France.
    La Renaissance : un mouvement artistique et culturel.'
- id: frise-francois-1er
  type: ordre
  difficulte: 2
  enonce: Range ces évènements du plus ancien au plus récent.
  reponse:
    elements:
    - id: colomb
      texte: Christophe Colomb débarque en Amérique
    - id: debut
      texte: François Ier devient roi et Léonard de Vinci arrive en France
    - id: mort-leonard
      texte: Léonard de Vinci meurt en France
    - id: fin-regne
      texte: Le règne de François Ier se termine
  indices:
    relance: Lequel de ces évènements a lieu au XVe siècle, avant tous les autres ?
    methode: Écris l'année de chaque évènement, puis range les années de la plus petite à la plus grande.
    etape: Colomb débarque en 1492 et Léonard meurt en 1519. Où placer le début et la fin du règne ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux évènements voisins sont inversés. Compare leurs années.
  - si:
      diagnostic: ordre_faux
    relance: Retrouve l'année de chaque évènement dans ta fiche, puis range-les.
  solution: Colomb débarque en Amérique (1492) ; François Ier devient roi et Léonard arrive en France (1515) ; Léonard meurt
    (1519) ; le règne de François Ier se termine (1547).
- id: role-du-roi-diffusion
  type: choix
  difficulte: 3
  enonce: Comment François Ier aide-t-il à faire connaître la Renaissance dans son royaume ?
  reponse:
    options:
    - id: a
      texte: En accueillant et en soutenant des artistes comme Léonard de Vinci
    - id: b
      texte: En interdisant les œuvres d'art dans son royaume
    - id: c
      texte: En envoyant tous les artistes à l'étranger
    bonnes:
    - a
  indices:
    relance: Pense au mot « mécène » et à ce qu'il permet à un artiste de faire.
    methode: François Ier ne repousse pas les artistes, il les accueille.
    etape: Léonard de Vinci vient vivre en France grâce à François Ier.
  pieges:
  - si:
      contient:
      - b
    relance: François Ier ne combat pas les œuvres d'art, il soutient au contraire les artistes.
  - si:
      contient:
      - c
    relance: François Ier fait venir des artistes en France, il ne les envoie pas à l'étranger.
  solution: En accueillant et en soutenant Léonard de Vinci en France, François Ier aide à faire connaître les idées et les
    œuvres de la Renaissance dans son royaume.
- id: francois-1er-ouverte
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases pourquoi on appelle François Ier un roi mécène de la Renaissance.
  criteres:
  - L'élève explique que François Ier soutient des artistes.
  - L'élève cite l'exemple de Léonard de Vinci venu vivre en France de 1515 à sa mort en 1519.
  - L'élève dit que, grâce au roi, la Renaissance se fait connaître en France.
  indices:
    relance: Une phrase pour le mot « mécène », une phrase pour l'exemple de Léonard de Vinci.
    methode: Utilise le vocabulaire et les dates de ta fiche.
    etape: Commence par « François Ier est un mécène car... ».
  solution: François Ier est un roi mécène car il aide et soutient des artistes. Il fait venir Léonard de Vinci vivre en France
    à partir de 1515, jusqu'à sa mort en 1519.
