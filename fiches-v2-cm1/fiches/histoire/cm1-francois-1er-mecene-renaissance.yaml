      texte: Christophe Colomb débarque en Amérique
    - id: debut
      texte: François Ier devient roi et Léonard de Vinci arrive en France
    - id: mort-leonard
      texte: Léonard de Vinci meurt en France
    - id: fin-regne
      texte: Le règne de François Ier se termine
  indices:
    relance: Lequel de ces évènements a lieu au XVe siècle, avant tous les autres ?
    methode: Écris l'année de chaque évènement, puis range les années de la plus petite à la plus grande.
    etape: Colomb débarque en 1492 et Léonard meurt en 1519. Où placer le début et la fin du règne ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux évènements voisins sont inversés. Compare leurs années.
  - si:
      diagnostic: ordre_faux
    relance: Retrouve l'année de chaque évènement dans ta fiche, puis range-les.
  solution: Colomb débarque en Amérique (1492) ; François Ier devient roi et Léonard arrive en France (1515) ; Léonard meurt
    (1519) ; le règne de François Ier se termine (1547).
- id: role-du-roi-diffusion
