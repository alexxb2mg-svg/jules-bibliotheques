format: 2
notion: cm1-art-roman-art-gothique
version: 3
etat: verifiee
declencheurs:
- style d'une église ancienne
- comparer deux photos d'églises
- reconnaître le style d'une cathédrale
- deux styles d'architecture religieuse
- observer un bâtiment médiéval
- différencier deux monuments
- église avec des vitraux
- arcs pointus des églises
- église aux murs épais
prerequis:
- cm1-role-social-eglise-moyen-age
essentiel: 'Le Moyen Âge va de 476 à 1492. Du XIe au XIIIe siècle, on construit beaucoup d''églises, d''abbayes et de cathédrales.
  Elles suivent deux grands styles à savoir différencier : l''art roman et l''art gothique.


  Une église romane est massive et plutôt basse. Ses murs sont très épais pour porter le poids de la voûte en pierre. Ses
  fenêtres sont petites, donc l''intérieur est souvent sombre. Au-dessus des portes et des fenêtres, les arcs sont arrondis,
  comme un demi-cercle.


  Une église gothique monte très haut vers le ciel. Ses arcs sont brisés : ils se terminent en pointe. Ses murs sont percés
  de grandes fenêtres garnies de vitraux, des images faites de morceaux de verre de couleur. L''intérieur est donc rempli
  de lumière. Dehors, des arcs-boutants, comme de grands bras de pierre, aident les murs à tenir debout.


  Pour différencier les deux styles, observe trois indices : la hauteur du bâtiment, la taille des fenêtres et la forme des
  arcs. Une église aux murs épais et aux fenêtres étroites est romane. Une église très haute, aux grands vitraux et aux arcs
  en pointe, est gothique. Tu peux t''entraîner avec une abbaye ou une cathédrale près de chez toi.


  Une astuce pour t''en souvenir : roman, c''est rond et sombre ; gothique, c''est pointu et lumineux.

  '
methode:
- Observer le bâtiment religieux en entier (abbaye, église ou cathédrale), sur place ou sur une photo.
- 'Regarder la hauteur : le bâtiment est-il massif et bas, ou très élancé vers le ciel ?'
- 'Regarder les fenêtres : sont-elles petites, ou grandes avec des vitraux ?'
- 'Regarder la forme des arcs au-dessus des portes et des fenêtres : arrondis ou en pointe ?'
- Chercher à l'extérieur des arcs-boutants, ces bras de pierre qui soutiennent les murs.
- 'Conclure : roman ou gothique, et justifier avec au moins deux indices observés.'
vocabulaire:
- terme: art roman
  definition: un des deux styles d'églises du Moyen Âge, avec des murs épais, de petites fenêtres et des arcs arrondis.
- terme: art gothique
  definition: l'autre style d'églises du Moyen Âge, avec des bâtiments très hauts, des arcs en pointe et de grandes fenêtres.
- terme: arc brisé
  definition: un arc qui se termine en pointe, typique de l'art gothique.
- terme: vitrail
  definition: une fenêtre faite de morceaux de verre de couleur qui forment une image (au pluriel, des vitraux).
- terme: arc-boutant
  definition: un grand bras de pierre, à l'extérieur d'une église gothique, qui aide les murs à tenir.
- terme: cathédrale
  definition: la grande église d'une ville, comme Notre-Dame de Paris.
erreurs_frequentes:
- Croire qu'il n'existe qu'un seul style d'église au Moyen Âge.
- 'Se fier à un seul indice : il faut regarder à la fois la hauteur, les fenêtres et la forme des arcs.'
- 'Confondre les arcs : les arcs arrondis sont romans, les arcs en pointe sont gothiques.'
- Donner un style sans le justifier par des indices observés (hauteur, fenêtres, arcs).
exemple:
  enonce: On te montre deux photos d'églises du Moyen Âge. La première est basse, avec des murs épais et de petites fenêtres.
    La seconde est très haute, avec de grands vitraux et des arcs en pointe. Quel est le style de chacune ?
  solution: 'La première est de style roman : elle est massive, ses murs sont épais et ses fenêtres petites, donc l''intérieur
    est sombre. La seconde est de style gothique : elle est très haute, ses arcs sont brisés (en pointe) et ses grands vitraux
    laissent entrer la lumière.'
exercices:
- id: deux-styles-existent
  type: choix
  difficulte: 1
  enonce: Combien de styles d'architecture des églises du Moyen Âge dois-tu savoir différencier ?
  reponse:
    options:
    - id: a
      texte: Deux styles
    - id: b
      texte: Un seul style
    - id: c
      texte: Quatre styles
    bonnes:
    - a
  indices:
    relance: Compte les termes appris dans le vocabulaire de la notion.
    methode: Le vocabulaire de ta fiche donne des mots différents pour des styles distincts.
    etape: Les noms des styles commencent par R et par G.
  pieges:
  - si:
      contient:
      - b
    relance: Il n'existe pas qu'un seul style, il y en a plusieurs à différencier.
  - si:
      contient:
      - c
    relance: Le programme cite moins de styles que cela à différencier.
  solution: Tu dois savoir différencier deux styles.
- id: question-a-se-poser
  type: choix
  difficulte: 1
  enonce: Ta classe visite une cathédrale du Moyen Âge. Quelle question dois-tu te poser pour utiliser ce que tu sais ?
  reponse:
    options:
    - id: a
      texte: Est-ce que cette cathédrale est de style roman ou de style gothique ?
    - id: b
      texte: Est-ce que cette cathédrale sert de château ?
    - id: c
      texte: Est-ce que cette cathédrale a été construite hier ?
    bonnes:
    - a
  indices:
    relance: 'Pense au but de la notion : différencier deux styles.'
    methode: La question doit porter sur le style de construction, pas sur son usage ou son âge.
    etape: Choisis la question qui mentionne les deux styles à différencier.
  pieges:
  - si:
      contient:
      - b
    relance: Une cathédrale n'est pas un château, ce n'est pas la question à te poser ici.
  - si:
      contient:
      - c
    relance: Une cathédrale du Moyen Âge n'a pas été construite hier, ce n'est pas la question utile ici.
  solution: Je dois me demander si cette cathédrale est de style roman ou de style gothique.
- id: definition-art-roman
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le style d'architecture religieuse du Moyen Âge que l'on doit différencier de l'art gothique
    ?
  reponse:
    acceptees:
    - art roman
    - roman
    fautes_tolerees: 1
  indices:
    relance: Ce style n'est pas l'art gothique, c'est l'autre style.
    methode: Le mot commence par la même lettre que « Rome ».
    etape: C'est le premier des deux styles cités dans ta fiche.
  pieges:
  - si:
      valeur: gothique
    relance: L'art gothique est l'autre style, celui que tu ne dois pas donner ici.
  solution: L'art roman.
- id: definition-art-gothique
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on le style d'architecture religieuse du Moyen Âge que l'on doit différencier de l'art roman ?
  reponse:
    acceptees:
    - art gothique
    - gothique
    fautes_tolerees: 1
  indices:
    relance: Ce style n'est pas l'art roman, c'est l'autre style.
    methode: Le mot commence par un G.
    etape: C'est le second des deux styles cités dans ta fiche.
  pieges:
  - si:
      valeur: roman
    relance: L'art roman est l'autre style, celui que tu ne dois pas donner ici.
  solution: L'art gothique.
- id: eglise-sombre-murs-epais
  type: choix
  difficulte: 2
  enonce: Tu entres dans une église du Moyen Âge. Elle est basse, ses murs sont très épais, ses fenêtres sont petites et l'intérieur
    est sombre. De quel style est-elle ?
  reponse:
    options:
    - id: a
      texte: L'art roman
    - id: b
      texte: L'art gothique
    - id: c
      texte: On ne peut pas le savoir en l'observant
    bonnes:
    - a
  indices:
    relance: Les fenêtres laissent-elles entrer beaucoup de lumière ici ?
    methode: 'Souviens-toi de l''astuce de la fiche : un style est rond et sombre, l''autre pointu et lumineux.'
    etape: Des murs épais et de petites fenêtres donnent un intérieur sombre. Quel style est sombre ?
  pieges:
  - si:
      contient:
      - b
    relance: Une église gothique est très haute, avec de grandes fenêtres et beaucoup de lumière. Est-ce le cas ici ?
  - si:
      contient:
      - c
    relance: Au contraire, la hauteur, les murs et les fenêtres sont des indices qui permettent de reconnaître le style.
  solution: 'C''est une église romane : elle est massive, avec des murs épais et de petites fenêtres, donc un intérieur sombre.'
- id: nom-des-vitraux
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on une fenêtre faite de morceaux de verre de couleur qui forment une image, comme dans les cathédrales
    gothiques ?
  reponse:
    acceptees:
    - vitrail
    - vitraux
    - un vitrail
    - des vitraux
    fautes_tolerees: 1
  indices:
    relance: Quand le soleil passe à travers, ces fenêtres colorent la lumière dans la cathédrale.
    methode: Relis le vocabulaire de ta fiche, il y a un mot pour ces fenêtres en verre coloré.
    etape: C'est le mot que ta fiche emploie pour les grandes fenêtres colorées des églises gothiques.
  pieges:
  - si:
      valeur: fenêtre
    relance: C'est bien une sorte de fenêtre, mais elle porte un nom précis. Lequel ?
  - si:
      valeur: arc-boutant
    relance: L'arc-boutant est un bras de pierre à l'extérieur. Quel nom porte la fenêtre en verre de couleur ?
  solution: Un vitrail (au pluriel, des vitraux).
- id: indices-roman-ou-gothique
  type: association
  difficulte: 2
  enonce: Relie chaque indice que tu observes au style auquel il correspond.
  reponse:
    gauche:
    - id: a
      texte: Des murs très épais et de petites fenêtres
    - id: b
      texte: De grandes fenêtres avec des vitraux
    - id: c
      texte: Des arcs arrondis au-dessus des portes
    - id: d
      texte: Des arcs brisés, qui se terminent en pointe
    - id: e
      texte: Des arcs-boutants à l'extérieur
    droite:
    - id: x
      texte: Art roman
    - id: y
      texte: Art gothique
    paires:
      a: x
      b: y
      c: x
      d: y
      e: y
  indices:
    relance: Quel style est sombre, et lequel est plein de lumière ?
    methode: 'Utilise l''astuce : un style est rond et sombre, l''autre est pointu et lumineux et monte très haut.'
    etape: Les petites fenêtres rendent l'intérieur sombre. Place les autres indices de la même façon.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends les indices un par un en pensant à la lumière et à la forme des arcs.
  - si:
      diagnostic: associations_fausses
    relance: Pars d'un repère sûr, la forme des arcs, puis classe les fenêtres et les murs.
  solution: 'Art roman : murs épais et petites fenêtres, arcs arrondis. Art gothique : grandes fenêtres avec vitraux, arcs
    brisés, arcs-boutants.'
- id: un-seul-style-erreur
  type: choix
  difficulte: 3
  enonce: Un camarade dit qu'il n'existe qu'un seul style d'église au Moyen Âge. A-t-il raison ?
  reponse:
    options:
    - id: a
      texte: 'Non, il existe deux styles à différencier : l''art roman et l''art gothique'
    - id: b
      texte: Oui, toutes les églises du Moyen Âge se ressemblent
    - id: c
      texte: Non, il existe trois styles différents
    bonnes:
    - a
  indices:
    relance: Ta fiche te demande de différencier deux styles, pas un seul, ni trois.
    methode: Compte le nombre de styles que tu as appris dans le vocabulaire de la fiche.
    etape: Les deux noms des styles commencent par R et par G.
  pieges:
  - si:
      contient:
      - b
    relance: Il existe bien deux styles différents à différencier, ce n'est pas un seul style.
  - si:
      contient:
      - c
    relance: Le programme ne cite que deux styles à différencier, pas trois.
  solution: 'Non, il existe deux styles à différencier au Moyen Âge : l''art roman et l''art gothique.'
- id: comparer-deux-photos
  type: ouverte
  difficulte: 3
  enonce: On te montre deux photos d'églises du Moyen Âge, l'une de style roman, l'autre de style gothique. Explique en deux
    ou trois phrases comment tu les reconnais. Tu peux aussi dessiner une fenêtre de chaque style et la décrire.
  criteres:
  - L'élève explique qu'il doit observer chaque bâtiment.
  - L'élève dit à quel style chacun appartient, roman ou gothique, et justifie son choix.
  - L'élève donne au moins un indice observable pour chaque style (hauteur, épaisseur des murs, taille des fenêtres, forme
    des arcs, lumière).
  indices:
    relance: Il faut d'abord regarder, puis se poser une question sur le style.
    methode: Reprends la méthode de ta fiche, étape par étape (hauteur, fenêtres, arcs).
    etape: Termine en expliquant que tu dois justifier ton choix en comparant les deux photos.
  solution: Je dois observer chaque bâtiment religieux, puis me demander s'il appartient au style roman ou au style gothique,
    et justifier mon choix en comparant les deux photos.
