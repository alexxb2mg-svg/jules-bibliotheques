  difficulte: 2
  enonce: Au Moyen Âge, selon combien de grands styles principaux les églises et les cathédrales sont-elles construites ?
  reponse:
    options:
    - id: o1
      texte: 'Deux grands styles : l''art roman et l''art gothique'
    - id: o2
      texte: Un seul style d'architecture unique
    - id: o3
      texte: Quatre styles totalement différents
    - id: o4
      texte: Trois styles venus de l'Antiquité
    bonnes:
    - o1
  indices:
    relance: Pense aux deux principaux courants d'architecture religieuse étudiés en histoire au CM1.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
