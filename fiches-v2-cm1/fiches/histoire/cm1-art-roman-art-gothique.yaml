    relance: C'est faux. Le programme identifie deux grands styles principaux pour l'architecture religieuse médiévale.
  - si:
      contient:
      - o4
    relance: C'est incorrect. Les deux styles d'architecture religieuse du Moyen Âge sont l'art roman et l'art gothique.
  solution: 'Deux grands styles : l''art roman et l''art gothique. C''est exact. Les sources indiquent que les églises et
    cathédrales au Moyen Âge sont construites selon deux grands styles : l''art roman et l''art gothique.'
