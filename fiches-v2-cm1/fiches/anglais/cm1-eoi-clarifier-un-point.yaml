format: 2
notion: cm1-eoi-clarifier-un-point
version: 2
etat: verifiee
declencheurs:
- demander de répéter en anglais quand on n'a pas compris
- épeler un mot en anglais lettre par lettre
- demander ce que veut dire un mot en anglais
- how do you spell it
- lettres de l'alphabet anglais à l'oral
- demander la traduction d'un mot en anglais
- dire I don't understand
- what does it mean
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
- cm1-eoi-echanger-informations
essentiel: 'En classe d''anglais, il arrive souvent qu''on ne comprenne pas tout. Ce n''est pas grave ! Il existe des petites
  phrases toutes faites pour faire clarifier un point, c''est-à-dire le rendre plus clair.


  Si tu n''as pas bien entendu, tu demandes de répéter : « Sorry? » (pardon ?) ou « Can you repeat, please? » (peux-tu répéter,
  s''il te plait ?). Si tu n''as pas compris, tu le dis : « I don''t understand. » (je ne comprends pas). Quand c''est clair,
  tu peux dire « I understand. » (je comprends) ou « OK! ».


  Si tu ne connais pas le sens d''un mot, tu demandes « What does it mean? » (qu''est-ce que ça veut dire ?). Si tu cherches
  un mot anglais, tu demandes sa traduction : « How do you say "chat" in English? » (comment dit-on « chat » en anglais ?).


  Pour vérifier l''écriture d''un mot, on l''épelle, lettre par lettre : « How do you spell it? » (comment ça s''écrit ?).
  L''alphabet anglais ne se prononce pas comme en français. Par exemple, A se dit « eï », E se dit « i », I se dit « aï »
  et R se dit « ar ». Ainsi, le mot « red » s''épelle « ar, i, di ».


  Pour être sûr d''avoir bien compris une consigne, tu peux la répéter toi-même. Si la maitresse dit « Open your book. »,
  tu répètes « Open my book? OK! » avant de l''ouvrir.

  '
methode:
- Si tu n'as pas entendu, dis « Sorry? » ou « Can you repeat, please? ».
- Si tu n'as pas compris, dis « I don't understand. ».
- Si un mot t'est inconnu, demande « What does it mean? ».
- Si tu cherches un mot anglais, demande « How do you say ... in English? ».
- Pour épeler, dis chaque lettre avec son nom anglais, une par une.
- Répète la consigne toi-même pour vérifier que tu l'as bien comprise.
vocabulaire:
- terme: Sorry?
  definition: pardon ? (pour demander de répéter).
- terme: Can you repeat, please?
  definition: peux-tu répéter, s'il te plait ?
- terme: What does it mean?
  definition: qu'est-ce que ça veut dire ?
- terme: I don't understand.
  definition: je ne comprends pas.
- terme: How do you spell it?
  definition: comment ça s'écrit ? (pour faire épeler un mot).
- terme: épeler
  definition: dire les lettres d'un mot une par une, dans l'ordre.
erreurs_frequentes:
- Rester silencieux quand on n'a pas compris, au lieu d'utiliser une formule simple pour demander de répéter.
- Confondre « What does it mean? » (demander le sens) et « Can you repeat? » (demander une répétition).
- Épeler avec les noms français des lettres (dire « i » pour la lettre I au lieu de « aï »).
- Confondre les lettres E (« i ») et I (« aï ») quand on écrit un mot épelé.
exemple:
  enonce: Le professeur dit un mot que tu ne connais pas, puis tu veux savoir comment il s'écrit. Que dis-tu ?
  solution: 'D''abord, tu demandes le sens du mot : « What does it mean? ». Ensuite, tu demandes comment il s''écrit : « How
    do you spell it? ». Le professeur épelle le mot lettre par lettre et tu l''écris.'
exercices:
- id: demander-repeter
  type: choix
  difficulte: 1
  enonce: Tu n'as pas entendu ce qu'a dit ton professeur. Que dis-tu pour lui demander de répéter ?
  reponse:
    options:
    - id: a
      texte: Can you repeat, please?
    - id: b
      texte: What does it mean?
    - id: c
      texte: I am happy.
    bonnes:
    - a
  indices:
    relance: Tu as un problème d'audition, pas de compréhension du sens d'un mot.
    methode: « What does it mean? » sert à demander un sens, pas une répétition.
    etape: Élimine la formule qui demande un sens et la phrase qui dit une émotion.
  pieges:
  - si:
      contient:
      - b
    relance: Cette formule sert à demander le sens d'un mot, pas à demander de répéter.
  - si:
      contient:
      - c
    relance: « I am happy. » dit que tu es content. Ici, tu veux qu'on te redise la phrase.
  solution: « Can you repeat, please? » demande à quelqu'un de répéter.
- id: demander-le-sens
  type: texte_court
  difficulte: 2
  enonce: Quelle question poses-tu en anglais pour demander ce que veut dire un mot ? Réponds par la question complète.
  reponse:
    acceptees:
    - what does it mean
    - what does it mean?
    fautes_tolerees: 2
  indices:
    relance: Relis la partie de la fiche sur les mots inconnus.
    methode: Pense à la question qui demande une signification, pas une répétition.
    etape: La question utilise le verbe « mean » (signifier) à la fin.
  pieges:
  - si:
      valeur: can you repeat
    relance: Cette phrase demande une répétition, pas le sens d'un mot. Quelle est la bonne question ?
  solution: « What does it mean? » demande la signification d'un mot.
- id: alphabet-lettre-i
  type: choix
  difficulte: 2
  enonce: Comment prononce-t-on la lettre « I » quand on épelle un mot en anglais ?
  reponse:
    options:
    - id: a
      texte: Comme « aille »
    - id: b
      texte: Comme en français
    - id: c
      texte: Comme « i » très bref
    bonnes:
    - a
  indices:
    relance: La prononciation anglaise de cette lettre est différente de la lettre française.
    methode: Pense au mot anglais « I » qui veut dire « je », il se prononce de la même façon.
    etape: Cette lettre se prononce comme le mot anglais « je ».
  pieges:
  - si:
      contient:
      - b
    relance: Non, l'alphabet anglais ne se prononce pas comme le français pour cette lettre.
  - si:
      contient:
      - c
    relance: 'Non : en anglais, cette lettre ne se dit pas comme un « i » court. Pense au mot anglais qui veut dire « je ».'
  solution: La lettre « I » se prononce « aille » en anglais, comme le mot « I » (je).
- id: dire-pas-compris
  type: choix
  difficulte: 1
  enonce: La maitresse explique un jeu, mais tu n'as pas compris. Que dis-tu en anglais ?
  reponse:
    options:
    - id: a
      texte: I don't understand.
    - id: b
      texte: I understand.
    - id: c
      texte: Thank you.
    bonnes:
    - a
  indices:
    relance: Veux-tu dire que tu as compris, ou le contraire ?
    methode: Cherche la phrase qui contient une négation (le petit mot « don't »).
    etape: « I understand. » veut dire « je comprends ». Il te faut le contraire.
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase veut dire « je comprends ». Il manque un petit mot pour dire le contraire.
  - si:
      contient:
      - c
    relance: « Thank you » veut dire « merci ». Tu dois plutôt dire que tu n'as pas compris.
  solution: « I don't understand. » veut dire « je ne comprends pas ».
- id: formule-et-usage
  type: association
  difficulte: 2
  enonce: Associe chaque formule anglaise à ce qu'elle sert à faire.
  reponse:
    gauche:
    - id: a
      texte: How do you spell it?
    - id: b
      texte: How do you say « chat » in English?
    - id: c
      texte: I don't understand.
    droite:
    - id: x
      texte: demander comment un mot s'écrit
    - id: y
      texte: demander la traduction d'un mot
    - id: z
      texte: dire qu'on ne comprend pas
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Quelle formule contient le mot « English » ?
    methode: 'Repère le mot-clé de chaque formule : spell (épeler), say (dire), understand (comprendre).'
    etape: '« spell » veut dire « épeler » : cette formule demande comment s''écrit un mot.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au mot « spell » (épeler) et au mot « say » (dire).
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque formule en cherchant son mot-clé, puis trouve ce qu'elle permet de faire.
  solution: How do you spell it? = demander comment un mot s'écrit ; How do you say « chat » in English? = demander la traduction
    ; I don't understand. = dire qu'on ne comprend pas.
- id: mot-epele
  type: texte_court
  difficulte: 2
  enonce: 'Ton camarade épelle une couleur en anglais : « ar, i, di » (prononciation écrite à la française). Écris le mot.'
  reponse:
    acceptees:
    - red
    fautes_tolerees: 0
  indices:
    relance: Quelle lettre anglaise se dit « ar » ?
    methode: Retrouve chaque lettre à partir de son nom anglais, puis écris-les dans l'ordre.
    etape: 'La première lettre est R. Attention : en anglais, la lettre qui se dit « i » n''est pas la lettre I.'
  pieges:
  - si:
      valeur: rid
    relance: En anglais, le son « i » est le nom de la lettre E. La lettre I, elle, se dit « aï ».
  - si:
      valeur: ride
    relance: Le mot a seulement trois lettres. Reprends les trois noms de lettres un par un.
  solution: 'ar = R, i = E, di = D : le mot est « red » (rouge).'
- id: etapes-clarifier
  type: ordre
  difficulte: 3
  enonce: Tu ne comprends pas un mot dans une consigne. Range ce que tu fais, dans l'ordre.
  reponse:
    elements:
    - id: pardon
      texte: Je dis « Sorry? » pour que la maitresse répète.
    - id: ecoute
      texte: J'écoute la consigne une deuxième fois.
    - id: sens
      texte: Si je ne connais toujours pas le mot, je demande « What does it mean? ».
    - id: verifie
      texte: Je répète la consigne pour vérifier que j'ai bien compris.
  indices:
    relance: Que fais-tu en premier quand tu n'as pas compris ?
    methode: On essaie d'abord de réentendre, puis on demande le sens, puis on vérifie.
    etape: La première étape est de dire « Sorry? ».
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Peut-on demander le sens avant d'avoir réécouté ?
  - si:
      diagnostic: ordre_faux
    relance: Repère la première étape (faire répéter) et la dernière (vérifier en répétant la consigne).
  solution: Sorry? → écouter une deuxième fois → What does it mean? → répéter la consigne pour vérifier.
- id: epeler-son-prenom
  type: ouverte
  difficulte: 3
  enonce: 'Entraine-toi avec un adulte : épelle ton prénom en anglais, lettre par lettre. Puis demande-lui « How do you spell
    your name? » et écris son prénom pendant qu''il l''épelle.'
  criteres:
  - L'élève épelle son prénom en entier avec les noms anglais des lettres.
  - L'élève pose correctement la question « How do you spell your name? ».
  - Le prénom écrit sous la dictée de l'adulte est juste, lettre par lettre.
  indices:
    relance: Comment se disent en anglais les lettres de ton prénom ?
    methode: Dis les lettres une par une, lentement, avec leur nom anglais.
    etape: Commence par la première lettre de ton prénom et vérifie son nom anglais.
  solution: 'Exemple pour LÉA : « el, i, eï ». Puis : « How do you spell your name? » et on écrit les lettres entendues.'
- id: nblm-si-tu-n-as-pas-compris-ce-que-le-profess-1
  type: choix
  difficulte: 2
  enonce: Si tu n'as pas compris ce que le professeur a dit en anglais, quelle formule lui permet de demander de répéter ?
  reponse:
    options:
    - id: o1
      texte: Can you repeat, please?
    - id: o2
      texte: What is your name?
    - id: o3
      texte: I am happy.
    - id: o4
      texte: How old are you?
    bonnes:
    - o1
  indices:
    relance: Pense au verbe qui signifie 'répéter' en anglais.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Cette formule sert à demander le nom de quelqu'un, pas à demander une répétition.
  - si:
      contient:
      - o3
    relance: Cette phrase sert à exprimer une émotion (la joie), pas à demander de répéter.
  - si:
      contient:
      - o4
    relance: Cette question permet de demander l'âge d'une personne, pas de faire clarifier un message.
  solution: Can you repeat, please?. C'est la formule de politesse adaptée pour demander à quelqu'un de répéter son propos.
