- id: nblm-quelle-est-l-erreur-frequente-identifiee-3
  type: choix
  difficulte: 2
  enonce: Quelle est l'erreur fréquente identifiée dans la fiche quand un élève ne comprend pas un mot en anglais ?
  reponse:
    options:
    - id: o1
      texte: Rester silencieux au lieu d'utiliser une formule simple.
    - id: o2
      texte: Dire 'Sorry?' pour demander de répéter.
    - id: o3
      texte: Demander à épeler le mot.
    - id: o4
      texte: Prononcer les lettres avec l'alphabet anglais.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui bloque la communication entre l'élève et l'enseignant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Utiliser 'Sorry?' est au contraire une excellente réaction préconisée.
  - si:
      contient:
      - o3
    relance: Demander d'épeler est une bonne stratégie de clarification.
  - si:
      contient:
      - o4
