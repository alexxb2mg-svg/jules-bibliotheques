format: 2
notion: cm1-eoi-echanger-informations
version: 2
etat: verifiee
declencheurs:
- demander des nouvelles à quelqu'un en anglais
- poser une petite question à un camarade en anglais
- répondre par oui ou par non en anglais
- répondre à how are you
- dire me too en anglais
- demander can I en anglais
- poser une question avec where
- dire merci et s'il te plait en anglais
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
- cm1-eoc-se-presenter-exprimer-gouts
essentiel: 'Échanger des informations, c''est parler AVEC quelqu''un : tu poses une question, l''autre répond, puis c''est
  à toi. En CM1, ces petits dialogues sont souvent des rituels : on les répète chaque jour en classe.


  Pour demander des nouvelles, tu dis « Hello! How are you? » (bonjour, comment vas-tu ?). On te répond « I''m fine, thank
  you. And you? » (ça va, merci, et toi ?). Les formules de politesse rendent l''échange gentil : « please » (s''il te plait),
  « thank you » (merci), « you''re welcome » (de rien).


  Pour poser une question simple, tu utilises un petit mot interrogatif au début : « What » (quoi, quel), « Where » (où),
  « Who » (qui), « How » (comment). Par exemple : « What is your name? », « Where do you live? » (où habites-tu ?), « How
  old are you? ».


  Pour répondre vite à une question fermée, tu utilises une réponse courte : « Do you like pizza? » → « Yes, I do. » ou «
  No, I don''t. ». Pour réagir à ce que dit l''autre, tu as des formules toutes faites : « Me too! » (moi aussi !), « Really?
  » (vraiment ?), « Great! » (super !).


  En classe, tu entends aussi des consignes courtes à l''impératif, comme « Sit down, please. » (assieds-toi, s''il te plait).
  Pour demander la permission, tu dis « Can I...? » (est-ce que je peux... ?). La réponse est « Yes, you can. » (oui, tu peux)
  ou « No, you can''t. » (non, tu ne peux pas).

  '
methode:
- Écoute la question jusqu'au bout et repère son premier mot (What, Where, Who, How, Do).
- 'Si la question commence par « Do you...? », prépare une réponse courte : « Yes, I do. » ou « No, I don''t. ».'
- 'Si elle commence par un mot interrogatif, donne l''information demandée : un nom, un âge, un lieu.'
- Pour demander la permission, commence par « Can I...? » et ajoute « please ».
- Réagis à ce que dit l'autre avec une formule toute faite (Me too!, Really?, Great!).
- Termine poliment avec « thank you » ou « goodbye ».
vocabulaire:
- terme: How are you?
  definition: comment vas-tu ?
- terme: I'm fine, thank you.
  definition: ça va, merci.
- terme: What / Where / Who / How
  definition: 'quoi / où / qui / comment : des mots pour poser une question.'
- terme: Yes, I do. / No, I don't.
  definition: des réponses courtes pour dire oui ou non.
- terme: Can I...?
  definition: 'est-ce que je peux... ? : pour demander la permission.'
- terme: Me too!
  definition: 'moi aussi ! : pour réagir quand on est d''accord.'
- terme: please / thank you
  definition: 's''il te plait / merci : des formules de politesse.'
erreurs_frequentes:
- Répondre à « How are you? » par une phrase trop longue au lieu d'une formule courte connue.
- Confondre la question sur le nom (« What is your name? ») et la question sur l'âge (« How old are you? »).
- Répondre seulement « Yes » ou « No » sans la suite de la réponse courte (« Yes, I do. »).
- Confondre « Where » (où) et « Who » (qui), qui commencent par les mêmes lettres.
- Oublier « please » quand on demande la permission avec « Can I...? ».
exemple:
  enonce: Un camarade te demande « How are you? ». Que réponds-tu simplement, et comment relances-tu l'échange ?
  solution: Tu réponds « I'm fine, thank you. » (ça va, merci), une formule courte et toute faite. Puis tu relances avec «
    And you? » (et toi ?) pour lui demander à ton tour de ses nouvelles.
exercices:
- id: reponse-comment-vas-tu
  type: choix
  difficulte: 1
  enonce: Que réponds-tu quand on te demande « How are you? » ?
  reponse:
    options:
    - id: a
      texte: I'm fine, thank you.
    - id: b
      texte: My name is Léo.
    - id: c
      texte: I am ten years old.
    bonnes:
    - a
  indices:
    relance: « How are you? » demande comment tu te sens, pas ton prénom ni ton âge.
    methode: Repère la formule toute faite qui répond à une question sur l'état de forme.
    etape: La bonne réponse contient le mot « fine ».
  pieges:
  - si:
      contient:
      - b
    relance: « My name is... » répond à « What is your name? », pas à « How are you? ».
  - si:
      contient:
      - c
    relance: « I am ten years old » répond à une question sur l'âge, pas sur l'état de forme.
  solution: « I'm fine, thank you. » répond à « How are you? ».
- id: question-age-ou-nom
  type: association
  difficulte: 1
  enonce: Associe chaque question anglaise à ce qu'elle demande.
  reponse:
    gauche:
    - id: a
      texte: What is your name?
    - id: b
      texte: How old are you?
    - id: c
      texte: How are you?
    droite:
    - id: x
      texte: Le prénom
    - id: y
      texte: L'âge
    - id: z
      texte: L'état de forme
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Repère d''abord le mot « name » dans une des questions : il indique clairement ce qui est demandé.'
    methode: 'Chaque question contient un mot-clé : name (prénom), old (âge), are you (forme).'
    etape: '« What is your name? » contient le mot « name » : associe-la au prénom.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense au mot-clé de chaque question.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque question une par une en cherchant son mot-clé (name, old, are you).
  solution: What is your name? = le prénom ; How old are you? = l'âge ; How are you? = l'état de forme.
- id: reponse-courte-oui
  type: texte_court
  difficulte: 2
  enonce: On te demande « Do you like chocolate? » et tu réponds oui. Écris la réponse courte complète en anglais.
  reponse:
    acceptees:
    - yes i do
    - yes, i do
    fautes_tolerees: 1
  indices:
    relance: Une réponse courte anglaise reprend le sujet et l'auxiliaire de la question, sans répéter le mot chocolat.
    methode: Une réponse courte commence par « Yes » ou « No », suivi du sujet et de l'auxiliaire de la question.
    etape: La réponse reprend le sujet « I » et l'auxiliaire de la question, sans répéter « chocolate ».
  pieges:
  - si:
      valeur: 'yes'
    relance: En anglais, une réponse courte complète reprend aussi le sujet et l'auxiliaire, pas seulement « yes ».
  solution: « Yes, I do. » est la réponse courte complète.
- id: politesse-anglais
  type: association
  difficulte: 1
  enonce: Associe chaque formule de politesse anglaise à sa traduction.
  reponse:
    gauche:
    - id: a
      texte: Please
    - id: b
      texte: Thank you
    - id: c
      texte: You're welcome
    droite:
    - id: x
      texte: s'il te plait
    - id: y
      texte: merci
    - id: z
      texte: de rien
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Quelle formule dis-tu quand quelqu'un te donne un objet ?
    methode: 'Pense à l''ordre d''un échange poli : on demande, on remercie, puis l''autre répond au merci.'
    etape: '« You''re welcome » se dit APRÈS un merci : c''est la réponse à un remerciement.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle des trois formules répond à un merci ?
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends dans l''ordre : demander poliment, remercier, répondre au remerciement.'
  solution: Please = s'il te plait ; Thank you = merci ; You're welcome = de rien.
- id: mot-interrogatif-lieu
  type: choix
  difficulte: 1
  enonce: Tu veux savoir OÙ habite ton correspondant. Par quel mot commence ta question ?
  reponse:
    options:
    - id: a
      texte: Where
    - id: b
      texte: Who
    - id: c
      texte: How
    bonnes:
    - a
  indices:
    relance: Tu cherches un lieu, pas une personne ni une manière.
    methode: 'Chaque mot interrogatif a son rôle : qui, où, comment, quoi.'
    etape: Écarte d'abord le mot qui veut dire « qui » et celui qui veut dire « comment ».
  pieges:
  - si:
      contient:
      - b
    relance: « Who » sert à demander QUI. Toi, tu cherches un endroit.
  - si:
      contient:
      - c
    relance: « How » sert à demander COMMENT. Toi, tu cherches un endroit.
  solution: '« Where » veut dire « où » : « Where do you live? » = où habites-tu ?'
- id: reagir-moi-aussi
  type: choix
  difficulte: 2
  enonce: Ton ami dit « I like football. » Toi aussi, tu aimes le football. Que réponds-tu ?
  reponse:
    options:
    - id: a
      texte: Me too!
    - id: b
      texte: Goodbye!
    - id: c
      texte: How old are you?
    bonnes:
    - a
  indices:
    relance: Tu veux dire « moi aussi ».
    methode: Cherche une formule courte et toute faite qui montre que tu es d'accord.
    etape: La bonne réponse contient le mot « too ».
  pieges:
  - si:
      contient:
      - b
    relance: « Goodbye » sert à dire au revoir, pas à réagir à ce que dit ton ami.
  - si:
      contient:
      - c
    relance: 'C''est une question sur l''âge : elle ne répond pas à ce que dit ton ami.'
  solution: '« Me too! » veut dire « moi aussi ! » : c''est une réaction courte et toute faite.'
- id: permission-oui
  type: texte_court
  difficulte: 2
  enonce: Tu demandes à ta maitresse « Can I open the window? ». Elle est d'accord. Écris sa réponse courte en anglais (elle
    commence par Yes).
  reponse:
    acceptees:
    - yes you can
    - yes, you can
    fautes_tolerees: 1
  indices:
    relance: 'La maitresse te parle à toi : quel pronom utilise-t-elle pour dire « tu » ?'
    methode: La réponse courte reprend « Yes », puis le sujet, puis le mot de la question qui exprime la permission.
    etape: Le mot de la permission dans la question est « can » ; le sujet pour « tu » est un mot de trois lettres.
  pieges:
  - si:
      valeur: yes i can
    relance: 'C''est la maitresse qui parle : elle ne dit pas « je peux », elle te dit « tu peux ».'
  - si:
      valeur: 'yes'
    relance: Une réponse courte complète reprend aussi le sujet et le mot de la permission.
  solution: La maitresse répond « Yes, you can. » (oui, tu peux).
- id: mini-dialogue
  type: ordre
  difficulte: 3
  enonce: Remets ce petit dialogue dans l'ordre.
  reponse:
    elements:
    - id: salut
      texte: Hello, Tom! How are you?
    - id: reponse
      texte: I'm fine, thank you. And you?
    - id: question
      texte: I'm very well. Do you like pizza?
    - id: courte
      texte: Yes, I do!
  indices:
    relance: Quelle réplique ouvre forcément un dialogue ?
    methode: Un échange commence par une salutation, puis chacun répond à la question qu'on vient de lui poser.
    etape: La première réplique contient « Hello ».
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux répliques voisines sont inversées. Vérifie que chaque réponse vient juste après sa question.
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la salutation (au début) et la réponse courte (à la fin).
  solution: Hello, Tom! How are you? → I'm fine, thank you. And you? → I'm very well. Do you like pizza? → Yes, I do!
- id: jouer-dialogue
  type: ouverte
  difficulte: 3
  enonce: 'Avec un camarade ou un adulte, joue un petit dialogue en anglais de 4 répliques : saluez-vous, demandez des nouvelles,
    puis posez une question sur ce que l''autre aime.'
  criteres:
  - Le dialogue commence par une salutation et une demande de nouvelles (How are you?).
  - Il contient au moins une question simple et une réponse courte (Yes, I do. / No, I don't.).
  - Il utilise au moins une formule de politesse (please, thank you) ou une réaction toute faite (Me too!).
  indices:
    relance: Par quoi commence-t-on quand on rencontre quelqu'un ?
    methode: Salue, demande des nouvelles, réponds, puis pose une question avec « Do you like...? ».
    etape: Commence par « Hello! How are you? ».
  solution: 'Exemple : « Hello! How are you? » « I''m fine, thank you. And you? » « Very well. Do you like cats? » « Yes,
    I do! »'
