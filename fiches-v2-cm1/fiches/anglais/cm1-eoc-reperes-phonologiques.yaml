# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-eoc-reperes-phonologiques
version: 2
etat: verifiee
declencheurs:
- bien prononcer les mots anglais
- lire un petit texte en anglais à voix haute
- l'accent anglais quand on parle
- prononcer le th anglais
- dire the et think
- voix qui monte question anglaise
- réciter un poème en anglais
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
couverture: Cette fiche porte sur la prononciation de mots et de courts textes déjà préparés. Elle ne couvre pas la construction
  de phrases nouvelles à l'oral (voir les fiches « se présenter » et « raconter »).
essentiel: 'En anglais, certains sons n''existent pas en français. Le plus connu est le « th » de « the » ou de « think »
  : on place le bout de la langue entre les dents et on souffle. Le « h » de « hello » ou de « house » s''entend aussi : c''est
  un petit souffle.


  Tu dois savoir prononcer de façon compréhensible les mots et les expressions que tu as appris par cœur. Par exemple les
  jours de la semaine, les couleurs, les nombres, ou « Good morning! ». Il n''est pas grave d''avoir un accent : l''important
  est qu''on te comprenne.


  Quand tu lis un texte court à voix haute (un petit dialogue, un poème, une page d''album), tu dois l''avoir préparé avant.
  Ainsi, tu peux le lire de façon expressive, avec le bon ton, et pas seulement en déchiffrant les mots un par un.


  Si tu ne sais pas dire une phrase, ton professeur ou un camarade peut la dire lentement pour toi. Tu la répètes après lui,
  puis tu essaies de la redire tout seul.


  La musique de la phrase s''appelle l''intonation. Dans une question comme « Do you like cats? », la voix monte souvent à
  la fin. Dans une phrase qui affirme, comme « I like cats. », la voix reste stable ou descend à la fin.

  '
methode:
- Écoute d'abord un modèle (professeur, enregistrement) avant d'essayer de prononcer un mot nouveau.
- Répète plusieurs fois le mot ou la phrase pour bien placer ta bouche et ta voix.
- Fais attention aux sons spéciaux de l'anglais, comme le « th » ou le « h » soufflé.
- Pour lire un texte à voix haute, prépare-le en silence avant, pour savoir où sont les questions et les phrases importantes.
- Lis-le ensuite avec le bon ton, en faisant monter ta voix à la fin des questions.
vocabulaire:
- terme: th
  definition: un son anglais qui n'existe pas en français, comme dans « the » ou « think ».
- terme: prononciation
  definition: la façon de dire les sons d'un mot avec sa bouche.
- terme: intonation
  definition: la musique de la phrase, quand la voix monte ou descend.
- terme: lecture expressive
  definition: lire à voix haute en donnant le bon ton, comme si on racontait vraiment.
- terme: mot mémorisé
  definition: un mot que tu as appris par cœur et que tu sais redire sans le lire.
erreurs_frequentes:
- Prononcer « th » comme un « z » ou un « s » français.
- Oublier de faire entendre le « h » de « hello » ou de « house ».
- Lire un texte sans l'avoir préparé, en déchiffrant les mots un par un.
- Lire un texte préparé sans y mettre le ton, comme si on lisait une liste de mots.
- Garder une voix plate à la fin d'une question.
exemple:
  enonce: Tu dois lire à voix haute le petit dialogue « Is the cat black? — Yes, the cat is black. » Que fais-tu pour bien
    le lire devant la classe ?
  solution: 'D''abord, tu le prépares en silence et tu t''entraines à prononcer le son « th » de « the ». Ensuite, tu repères
    la question : la première phrase finit par un point d''interrogation, donc ta voix monte à la fin. La réponse affirme
    quelque chose, donc ta voix reste stable ou descend. Enfin, tu lis le dialogue de façon expressive, comme deux personnes
    qui se parlent.'
exercices:
- id: son-th
  type: choix
  difficulte: 1
  enonce: Quel mot anglais contient le son spécial où l'on place la langue entre les dents ?
  reponse:
    options:
    - id: a
      texte: the
    - id: b
      texte: cat
    - id: c
      texte: dog
    bonnes:
    - a
  indices:
    relance: Dis chaque mot à voix haute. Pour lequel ta langue passe-t-elle entre tes dents ?
    methode: Le son spécial de l'anglais ressemble à un souffle entre les dents, différent du français.
    etape: Regarde les deux premières lettres de chaque mot proposé.
  pieges:
  - si:
      contient:
      - b
    relance: Pour dire « cat », ta langue ne passe pas entre tes dents.
  - si:
      contient:
      - c
    relance: Pour dire « dog », ta langue ne passe pas entre tes dents.
  solution: « the » contient le son « th », qui n'existe pas en français.
- id: preparer-avant-de-lire
  type: choix
  difficulte: 1
  enonce: Avant de lire un petit texte à voix haute devant la classe, que dois-tu faire ?
  reponse:
    options:
    - id: a
      texte: Le préparer et t'entrainer à le lire avant
    - id: b
      texte: Le lire directement sans l'avoir jamais vu
    - id: c
      texte: Le traduire mot à mot en français d'abord
    bonnes:
    - a
  indices:
    relance: Peux-tu lire un texte de façon expressive si tu ne l'as jamais vu avant ?
    methode: Une lecture expressive demande une préparation.
    etape: La bonne réponse parle de préparation et d'entrainement avant la lecture.
  pieges:
  - si:
      contient:
      - c
    relance: 'Traduire mot à mot n''aide pas à bien prononcer : il faut s''entrainer à le dire à voix haute.'
  - si:
      contient:
      - b
    relance: Sans préparation, tu risques de déchiffrer les mots un par un, sans le bon ton.
  solution: Tu dois préparer le texte et t'entrainer à le lire avant de le dire à voix haute.
- id: intonation-question
  type: choix
  difficulte: 2
  enonce: À la fin d'une question en anglais, que fait souvent ta voix ?
  reponse:
    options:
    - id: a
      texte: Elle monte
    - id: b
      texte: Elle descend toujours
    - id: c
      texte: Elle ne change jamais
    bonnes:
    - a
  indices:
    relance: Pense à comment ta voix change en français quand tu poses une question.
    methode: L'intonation d'une question n'est pas la même que celle d'une phrase qui affirme.
    etape: Dis à voix haute « Tu viens ? » puis « Tu viens. » et écoute la fin de chaque phrase.
  pieges:
  - si:
      contient:
      - b
    relance: 'C''est plutôt le contraire : en fin de question, la voix ne descend pas.'
  - si:
      contient:
      - c
    relance: Une voix plate ne permet pas d'entendre que c'est une question. Écoute la fin d'une question en français.
  solution: La voix monte souvent en fin de question.
- id: lettres-du-souffle
  type: texte_court
  difficulte: 1
  enonce: Dans le mot « think », quelles sont les deux lettres qui font le son spécial de l'anglais, avec la langue entre
    les dents ?
  reponse:
    acceptees:
    - th
    - t h
    - t-h
    fautes_tolerees: 0
  indices:
    relance: Regarde le tout début du mot « think ».
    methode: Le son spécial est fait par deux lettres collées, au début du mot.
    etape: La première lettre du mot est un t. Quelle lettre la suit ?
  pieges:
  - si:
      valeur: in
    relance: Ces deux lettres se prononcent comme en français. Regarde plutôt le tout début du mot.
  solution: Les deux lettres sont « th » (t et h), au début de « think ».
- id: phrase-question-ou-pas
  type: choix
  difficulte: 2
  enonce: Dans quelle phrase ta voix doit-elle monter à la fin ?
  reponse:
    options:
    - id: a
      texte: Do you like apples?
    - id: b
      texte: I like apples.
    - id: c
      texte: My name is Tom.
    bonnes:
    - a
  indices:
    relance: Quelle phrase pose une question ?
    methode: Regarde la ponctuation à la fin de chaque phrase.
    etape: Une seule phrase se termine par un point d'interrogation.
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase affirme quelque chose, elle finit par un point. La voix reste stable ou descend.
  - si:
      contient:
      - c
    relance: Cette phrase donne une information, elle finit par un point. Ce n'est pas une question.
  solution: « Do you like apples? » est une question (point d'interrogation), donc la voix monte à la fin.
- id: repeter-avec-aide
  type: choix
  difficulte: 2
  enonce: Tu n'arrives pas à dire la phrase « I like this book ». Ton professeur la dit lentement pour toi. Que fais-tu ?
  reponse:
    options:
    - id: a
      texte: Je la répète après lui, puis j'essaie de la redire seul
    - id: b
      texte: Je ne dis rien et j'attends
    - id: c
      texte: Je la dis en français à la place
    bonnes:
    - a
  indices:
    relance: À quoi sert le modèle que ton professeur te donne ?
    methode: On apprend à prononcer en imitant un modèle, plusieurs fois.
    etape: Écoute le modèle, puis utilise ta propre voix pour faire pareil.
  pieges:
  - si:
      contient:
      - b
    relance: Si tu ne dis rien, tu ne t'entraines pas. Que peux-tu faire avec le modèle de ton professeur ?
  - si:
      contient:
      - c
    relance: Le but est de s'entrainer à dire la phrase en anglais. Le français ne t'aide pas à la prononcer.
  solution: Tu répètes la phrase après ton professeur, puis tu essaies de la redire seul. C'est comme ça qu'on s'approprie
    une phrase.
- id: preparer-une-lecture
  type: ordre
  difficulte: 3
  enonce: Range dans l'ordre les étapes pour lire un petit poème en anglais devant la classe.
  reponse:
    elements:
    - id: ecouter
      texte: Écouter le poème lu par le professeur
    - id: repeter
      texte: Répéter après le professeur les mots difficiles
    - id: preparer
      texte: S'entrainer seul à lire tout le poème, avec le ton
    - id: lire
      texte: Lire le poème à voix haute de façon expressive
  indices:
    relance: Que faut-il faire avant même d'ouvrir la bouche ?
    methode: On écoute un modèle, on s'entraine, on prépare, puis on lit devant les autres.
    etape: La première étape est d'écouter le modèle. La dernière se fait devant la classe.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Que fais-tu juste avant de lire devant la classe ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par ce qu'on fait avec ses oreilles, et finis par ce qu'on fait devant toute la classe.
  solution: On écoute le modèle, on répète les mots difficiles, on s'entraine seul à lire tout le poème, puis on le lit à
    voix haute de façon expressive.
- id: lire-un-dialogue-a-la-maison
  type: ouverte
  difficulte: 3
  enonce: 'Entraine-toi à la maison à lire ce petit dialogue à voix haute devant un adulte : « Hello Sam! — Hello Lily! Do
    you like the sun? — Yes, I do! I think it is great! ». Puis explique ce que tu as fait pour bien le lire.'
  criteres:
  - L'élève a préparé le dialogue avant de le lire (lecture silencieuse ou entrainement).
  - L'élève fait entendre au moins un son propre à l'anglais (le « th » de « the » ou « think », ou le « h » de « hello »).
  - L'élève fait monter sa voix à la fin de la question « Do you like the sun? ».
  indices:
    relance: Où sont les sons spéciaux de l'anglais dans ce dialogue ?
    methode: Lis d'abord en silence, repère la question et les mots avec « th » ou « h », puis entraine-toi.
    etape: 'Commence par repérer la question : elle finit par un point d''interrogation.'
  solution: 'Exemple : « J''ai lu le dialogue en silence. J''ai répété the, think et hello. J''ai fait monter ma voix à la
    fin de Do you like the sun? »'
- id: nblm-comment-doit-on-prononcer-le-son-th-en-a-1
  type: choix
  difficulte: 2
  enonce: Comment doit-on prononcer le son « th » en anglais (comme dans « the » ou « think ») ?
  reponse:
    options:
    - id: o1
      texte: En utilisant le son anglais spécifique « th », sans le remplacer par un « z » ou un « s » français.
    - id: o2
      texte: En le prononçant systématiquement comme le son « z » français.
    - id: o3
      texte: En le prononçant exactement comme la lettre « t » en français.
    - id: o4
      texte: En ne le prononçant pas du tout car ce sont des lettres muettes.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux sons anglais qui n'existent pas dans la langue française.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : remplacer le son « th » par un « z » français déforme la prononciation du mot.'
  - si:
      contient:
      - o3
    relance: 'C''est incorrect : la combinaison « th » forme un son particulier en anglais, différent d''un simple « t ».'
  - si:
      contient:
      - o4
    relance: 'C''est faux : le groupe de lettres « th » se prononce bien en anglais.'
  solution: En utilisant le son anglais spécifique « th », sans le remplacer par un « z » ou un « s » français. C'est exact.
    Le son « th » est un son propre à l'anglais qui n'existe pas en français.
- id: nblm-selon-le-programme-officiel-de-cm1-quell-2
  type: choix
  difficulte: 2
  enonce: Selon le programme officiel de CM1, quelle est la condition requise pour lire un texte bref à voix haute de manière
    expressive ?
  reponse:
    options:
    - id: o1
      texte: Le texte doit avoir été préparé auparavant par l'élève.
    - id: o2
      texte: L'élève doit connaître par cœur l'intégralité du texte sans regarder la feuille.
    - id: o3
      texte: Le texte doit être découvert et lu immédiatement sans aucune préparation.
    - id: o4
      texte: Le texte doit obligatoirement être traduit en français pendant la lecture.
    bonnes:
    - o1
  indices:
    relance: Pense à ce que tu dois faire en silence avant de lire le texte devant la classe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : il s''agit de lire à voix haute un texte préparé, pas de le réciter par cœur.'
  - si:
      contient:
      - o3
    relance: 'C''est incorrect : la lecture expressive à voix haute nécessite une préparation préalable.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : l''objectif est de lire en anglais avec la bonne intonation, pas de traduire.'
  solution: Le texte doit avoir été préparé auparavant par l'élève. C'est juste. Les attendus précisent que la lecture à voix
    haute d'un texte bref se fait à condition qu'il ait été préparé auparavant.
- id: nblm-quelle-est-la-premiere-etape-recommandee-3
  type: choix
  difficulte: 2
  enonce: Quelle est la première étape recommandée pour réussir à bien prononcer un nouveau mot en anglais ?
  reponse:
    options:
    - id: o1
      texte: Écouter d'abord un modèle oral (professeur ou enregistrement) avant d'essayer de le prononcer.
    - id: o2
      texte: Essayer de deviner la prononciation en lisant les lettres à la française.
    - id: o3
      texte: Écrire le mot dix fois dans son cahier sans jamais l'écouter.
    - id: o4
      texte: Demander à un camarade d'épeler le mot avec l'alphabet français.
    bonnes:
    - o1
  indices:
    relance: Pense au sens que tu dois utiliser en premier pour entendre la prononciation exacte.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : lire un mot anglais comme s''il était écrit en français produit de mauvaises prononciations.'
  - si:
      contient:
      - o3
    relance: 'C''est incorrect : l''écriture seule ne permet pas d''entendre ni de reproduire la bonne prononciation.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : épeler des lettres ne donne pas la mélodie ni le son global du mot.'
  solution: Écouter d'abord un modèle oral (professeur ou enregistrement) avant d'essayer de le prononcer. C'est exact. La
    méthode préconise d'écouter d'abord un modèle pour bien percevoir la prononciation.
- id: nblm-comment-evolue-generalement-la-musique-d-4
  type: choix
  difficulte: 2
  enonce: Comment évolue généralement la musique de la voix (l'intonation) à la fin d'une question en anglais ?
  reponse:
    options:
    - id: o1
      texte: La voix monte souvent à la fin de la phrase.
    - id: o2
      texte: La voix s'arrête brutalement au milieu de la phrase.
    - id: o3
      texte: La voix descend très fort comme pour donner un ordre.
    - id: o4
      texte: La voix reste parfaitement monotone comme un robot.
    bonnes:
    - o1
  indices:
    relance: Pense à la direction de ta voix lorsque tu poses une question.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est incorrect : s''arrêter au milieu gêne la compréhension.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : une baisse de la voix caractérise plutôt une affirmation ou un ordre.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la langue anglaise a une intonation expressive et mélodique.'
  solution: La voix monte souvent à la fin de la phrase. C'est juste. La mélodie d'une phrase interrogative se caractérise
    souvent par une intonation montante à la fin.
- id: nblm-quelle-est-une-erreur-frequente-a-eviter-5
