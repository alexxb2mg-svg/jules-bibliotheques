    - id: o2
      texte: S'entraîner à lire le texte en silence avant le passage à voix haute.
    - id: o3
      texte: S'entraîner à bien prononcer les sons spécifiques de l'anglais comme le « th ».
    - id: o4
      texte: Mettre de l'expression dans sa voix pour rendre l'histoire vivante.
    bonnes:
    - o1
  indices:
    relance: Cherche l'attitude qui rend la lecture ennuyeuse et peu naturelle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
