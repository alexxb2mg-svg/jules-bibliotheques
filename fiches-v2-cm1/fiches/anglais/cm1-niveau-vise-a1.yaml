format: 2
notion: cm1-niveau-vise-a1
version: 1
etat: verifiee
declencheurs:
- à quel niveau je dois être en anglais à la fin du CM1
- c'est quoi le niveau A1 en anglais
- est-ce que je suis assez bon en anglais pour mon niveau
prerequis:
- cm1-six-activites-langagieres
couverture: Cette fiche présente seulement l'idée générale du niveau A1. Elle ne détaille pas le contenu de chaque activité
  langagière, qui est expliqué dans les autres fiches.
essentiel: 'À la fin du CM1, tu dois savoir utiliser l''anglais au niveau A1. C''est le premier niveau : celui d''un

  débutant qui commence à se débrouiller.

  Au niveau A1, tu peux comprendre et dire des choses très simples sur toi, ta famille et les choses

  que tu connais bien, à condition que la personne parle lentement et clairement.

  Certains élèves, dans une classe qui fait plus d''anglais, peuvent aller un peu plus loin : c''est le

  niveau A1+. Mais pour tous les élèves de CM1, l''objectif est d''atteindre A1.

  '
methode:
- 'Retiens que A1 est le tout premier niveau : celui du débutant qui commence à se débrouiller en anglais.'
- 'Retiens que ce niveau concerne des sujets simples et familiers : toi, ta famille, ton école.'
- 'N''oublie pas la condition : au niveau A1, on te parle lentement et clairement pour que tu comprennes.'
vocabulaire:
- terme: Niveau A1
  definition: 'le premier niveau en langue : comprendre et dire des choses très simples sur soi et son entourage'
- terme: Niveau A1+
  definition: un niveau un peu plus avancé que A1, atteint par certains élèves
erreurs_frequentes:
- 'Croire qu''il faut déjà parler couramment à la fin du CM1 : le niveau A1 reste très simple.'
- 'Confondre A1 et A1+ : A1+ est un peu plus avancé, mais pas obligatoire pour tous.'
exemple:
  enonce: Un élève de CM1 peut dire « My name is Léo » et comprendre une phrase simple si on parle lentement. À quel niveau
    cela correspond-il ?
  solution: 'Cela correspond au niveau A1 : des phrases très simples sur soi, comprises quand on parle lentement.'
exercices:
- id: quel-niveau-cm1
  type: texte_court
  difficulte: 1
  enonce: Quel niveau d'anglais tous les élèves doivent-ils atteindre à la fin du CM1 ?
  reponse:
    acceptees:
    - a1
    - niveau a1
    fautes_tolerees: 1
  indices:
    relance: C'est le tout premier niveau, celui du débutant.
    methode: Le niveau s'écrit avec une lettre et un chiffre.
    etape: C'est la lettre A suivie du chiffre 1.
  solution: Le niveau A1 est visé par tous les élèves à la fin du CM1.
- id: condition-comprehension
  type: choix
  difficulte: 1
  enonce: Au niveau A1, dans quelle condition peux-tu comprendre ce que dit une personne en anglais ?
  reponse:
    options:
    - id: a
      texte: Si la personne parle lentement et clairement
    - id: b
      texte: Si la personne parle très vite
    - id: c
      texte: Seulement si elle écrit ce qu'elle dit
    bonnes:
    - a
  indices:
    relance: Pense à un débutant qui commence tout juste à apprendre une langue.
    methode: Un débutant a besoin que l'on adapte sa façon de parler pour lui.
    etape: Il faut que la personne fasse un effort de lenteur et de clarté.
  pieges:
  - si:
      contient:
      - b
    relance: Au contraire, parler vite rend la compréhension plus difficile pour un débutant.
  solution: Au niveau A1, on comprend si l'interlocuteur parle lentement et distinctement.
- id: niveau-plus-avance
  type: choix
  difficulte: 2
  enonce: Comment s'appelle le niveau un peu plus avancé que certains élèves peuvent atteindre ?
  reponse:
    options:
    - id: a
      texte: A1+
    - id: b
      texte: B1
    - id: c
      texte: A0
    bonnes:
    - a
  indices:
    relance: Ce niveau s'écrit presque comme le niveau visé par tous, avec un signe en plus.
    methode: Ce niveau porte le même nom que le niveau visé en CM1, avec un symbole ajouté à la fin.
    etape: Le symbole ajouté ressemble à un signe d'addition.
  pieges:
  - si:
      contient:
      - b
    relance: B1 est un niveau bien plus avancé, pas encore visé en CM1.
  solution: Le niveau un peu plus avancé s'appelle A1+.
- id: sujets-a1
  type: ouverte
  difficulte: 2
  enonce: Donne deux exemples de sujets sur lesquels tu peux parler en anglais au niveau A1.
  criteres:
  - L'élève cite un sujet familier (soi-même, sa famille, son école, ses gouts).
  - L'élève cite un deuxième sujet différent du premier.
  indices:
    relance: Pense à ce que tu sais déjà dire sur toi en anglais.
    methode: Choisis deux sujets très simples et proches de ta vie quotidienne.
    etape: Tu peux commencer par « me présenter » puis trouver un deuxième sujet.
  solution: Au niveau A1, on peut par exemple se présenter (son prénom, son âge) et parler de sa famille ou de ses gouts.
sources:
