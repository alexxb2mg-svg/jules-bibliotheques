format: 2
notion: cm1-niveau-vise-a1
version: 2
etat: verifiee
declencheurs:
- à quel niveau je dois être en anglais à la fin du CM1
- c'est quoi le niveau A1 en anglais
- est-ce que je suis assez bon en anglais pour mon niveau
- c'est quoi A1+ en anglais
- je suis en classe bilingue anglais
- ce que je dois savoir en anglais en CM1
- le niveau débutant en anglais
prerequis:
- cm1-six-activites-langagieres
couverture: Cette fiche présente l'idée générale du niveau A1 et du niveau A1+. Elle ne détaille pas le contenu de chaque
  activité langagière, qui est expliqué dans les autres fiches.
essentiel: 'Les langues ont des niveaux, un peu comme les ceintures au judo. Ces niveaux sont les mêmes dans toute l''Europe
  : on les appelle le CECRL (Cadre européen commun de référence pour les langues). Le premier niveau s''appelle A1.


  À la fin du CM1, tous les élèves doivent atteindre le niveau A1. C''est le niveau d''un débutant qui commence à se débrouiller.
  Tu peux comprendre et dire des choses très simples sur toi, ta famille, ton école et ce que tu connais bien, si la personne
  parle lentement et clairement.


  Par exemple, au niveau A1, tu peux dire « My name is Léo. I am nine. » et comprendre « Open your book, please. ». Tu peux
  aussi poser une question simple comme « How are you? ». Tu n''as pas besoin de parler couramment.


  Le niveau A1 est visé dans toutes les activités : comprendre à l''oral, lire, parler, discuter, écrire, et aussi la médiation.
  La médiation, c''est aider quelqu''un à comprendre un message ou un document, par exemple expliquer une consigne à un camarade.


  Certains élèves vont un peu plus loin : c''est le niveau A1+. Dans un parcours renforcé ou bilingue, ou en EMILE (quand
  on apprend une autre matière en anglais), on vise A1+ pour comprendre et s''exprimer, et A1 pour la médiation. Dans le programme,
  les exemples marqués « (A1+) » montrent comment aller un peu plus loin. D''autres élèves peuvent aussi atteindre A1+ dans
  certaines activités.

  '
methode:
- 'Retiens que A1 est le tout premier niveau : celui du débutant qui commence à se débrouiller.'
- 'Retiens que ce niveau concerne des sujets simples et familiers : toi, ta famille, ton école.'
- 'N''oublie pas la condition : au niveau A1, on te parle lentement et clairement.'
- Retiens que A1 est visé pour TOUS les élèves à la fin du CM1, dans toutes les activités.
- 'Retiens que A1+ est un peu plus avancé : il est visé dans les parcours renforcés, sauf pour la médiation.'
vocabulaire:
- terme: niveau A1
  definition: 'le premier niveau en langue : comprendre et dire des choses très simples sur soi et son entourage.'
- terme: niveau A1+
  definition: un niveau un peu plus avancé que A1, atteint par certains élèves.
- terme: CECRL
  definition: le cadre commun des niveaux de langue en Europe (A1, A1+...).
- terme: médiation
  definition: aider quelqu'un à comprendre un message ou un document.
- terme: parcours renforcé ou bilingue
  definition: une classe qui fait plus de langue vivante que les autres.
erreurs_frequentes:
- 'Croire qu''il faut déjà parler couramment à la fin du CM1 : le niveau A1 reste très simple.'
- 'Confondre A1 et A1+ : A1+ est un peu plus avancé, mais pas obligatoire pour tous.'
- 'Croire qu''en parcours renforcé, A1+ est visé partout : pour la médiation, on vise A1.'
- Oublier que la médiation fait partie des activités où l'on vise aussi le niveau A1.
exemple:
  enonce: Un élève de CM1 peut dire « My name is Léo » et comprendre une phrase simple si on parle lentement. À quel niveau
    cela correspond-il ?
  solution: Il parle de lui avec une phrase très simple, et il comprend quand on parle lentement et clairement. Cela correspond
    au niveau A1, le niveau visé par tous les élèves à la fin du CM1.
exercices:
- id: quel-niveau-cm1
  type: texte_court
  difficulte: 1
  enonce: Quel niveau d'anglais tous les élèves doivent-ils atteindre à la fin du CM1 ?
  reponse:
    acceptees:
    - a1
    - niveau a1
    fautes_tolerees: 1
  indices:
    relance: C'est le tout premier niveau, celui du débutant.
    methode: Le niveau s'écrit avec une lettre et un chiffre.
    etape: Relis le début de la fiche. On y donne le nom du tout premier niveau du CECRL.
  solution: Le niveau A1 est visé par tous les élèves à la fin du CM1.
- id: condition-comprehension
  type: choix
  difficulte: 1
  enonce: Au niveau A1, dans quelle condition peux-tu comprendre ce que dit une personne en anglais ?
  reponse:
    options:
    - id: a
      texte: Si la personne parle lentement et clairement
    - id: b
      texte: Si la personne parle très vite
    - id: c
      texte: Seulement si elle écrit ce qu'elle dit
    bonnes:
    - a
  indices:
    relance: Pense à un débutant qui commence tout juste à apprendre une langue.
    methode: Un débutant a besoin que l'on adapte sa façon de parler pour lui.
    etape: Il faut que la personne fasse un effort de lenteur et de clarté.
  pieges:
  - si:
      contient:
      - b
    relance: Au contraire, parler vite rend la compréhension plus difficile pour un débutant.
  - si:
      contient:
      - c
    relance: Au niveau A1, tu peux comprendre à l'oral aussi, à une condition sur la façon de parler.
  solution: Au niveau A1, on comprend si l'interlocuteur parle lentement et distinctement.
- id: niveau-plus-avance
  type: choix
  difficulte: 2
  enonce: Comment s'appelle le niveau un peu plus avancé que certains élèves peuvent atteindre ?
  reponse:
    options:
    - id: a
      texte: A1+
    - id: b
      texte: B1
    - id: c
      texte: A0
    bonnes:
    - a
  indices:
    relance: Ce niveau s'écrit presque comme le niveau visé par tous, avec un signe en plus.
    methode: Ce niveau porte le même nom que le niveau visé en CM1, avec un symbole ajouté à la fin.
    etape: Le symbole ajouté ressemble à un signe d'addition.
  pieges:
  - si:
      contient:
      - b
    relance: B1 est un niveau bien plus avancé, pas encore visé en CM1.
  - si:
      contient:
      - c
    relance: Ce niveau n'existe pas dans le programme. Cherche un niveau juste un peu au-dessus du niveau visé par tous.
  solution: Le niveau un peu plus avancé s'appelle A1+.
- id: sujets-a1
  type: ouverte
  difficulte: 2
  enonce: Donne deux exemples de sujets sur lesquels tu peux parler en anglais au niveau A1.
  criteres:
  - L'élève cite un sujet familier (soi-même, sa famille, son école, ses gouts).
  - L'élève cite un deuxième sujet différent du premier.
  - L'élève donne pour chaque sujet un exemple de phrase très simple en anglais ou en français.
  indices:
    relance: Pense à ce que tu sais déjà dire sur toi en anglais.
    methode: Choisis deux sujets très simples et proches de ta vie quotidienne.
    etape: Tu peux commencer par « me présenter » puis trouver un deuxième sujet.
  solution: Au niveau A1, on peut par exemple se présenter (son prénom, son âge) et parler de sa famille ou de ses gouts.
- id: parler-couramment
  type: choix
  difficulte: 1
  enonce: 'Vrai ou faux : à la fin du CM1, il faut savoir parler anglais aussi bien qu''en français.'
  reponse:
    options:
    - id: a
      texte: 'Faux : on vise un niveau de débutant, avec des phrases très simples'
    - id: b
      texte: 'Vrai : il faut parler couramment'
    bonnes:
    - a
  indices:
    relance: Le niveau visé en CM1 est-il le premier niveau ou un niveau très avancé ?
    methode: 'Repense à ce qu''on sait faire au niveau visé : des choses très simples sur soi.'
    etape: Au niveau visé en fin de CM1, on n'a pas besoin de parler couramment.
  pieges:
  - si:
      contient:
      - b
    relance: 'Non : le niveau visé est celui d''un débutant qui commence à se débrouiller.'
  solution: 'C''est faux : en fin de CM1, on vise le premier niveau, celui du débutant qui dit des choses très simples.'
- id: signe-a1-plus
  type: choix
  difficulte: 2
  enonce: Dans le programme, que veut dire « (A1+) » écrit à côté d'un exemple ?
  reponse:
    options:
    - id: a
      texte: C'est un exemple un peu plus difficile, pour aller plus loin
    - id: b
      texte: C'est un exemple obligatoire pour tous les élèves
    - id: c
      texte: C'est un exemple pour les élèves débutants
    bonnes:
    - a
  indices:
    relance: Que veut dire le signe « + » à côté de A1 ?
    methode: Pense à la différence entre le niveau visé par tous et un niveau un peu plus avancé.
    etape: Le « + » indique un petit pas au-delà du niveau visé par tous.
  pieges:
  - si:
      contient:
      - b
    relance: 'Non : ce qui est visé pour tous les élèves, c''est A1. Le « + » indique autre chose.'
  - si:
      contient:
      - c
    relance: Les débutants visent A1. Le « + » montre plutôt une petite difficulté en plus.
  solution: '« (A1+) » signale un exemple un peu plus difficile : il montre comment aller plus loin que A1.'
- id: nom-mediation
  type: texte_court
  difficulte: 2
  enonce: Comment s'appelle l'activité où tu aides quelqu'un à comprendre un message, par exemple en expliquant une consigne
    anglaise à un camarade ?
  reponse:
    acceptees:
    - mediation
    - la mediation
    fautes_tolerees: 1
  indices:
    relance: Cette activité sert à aider deux personnes à se comprendre.
    methode: C'est l'une des six activités travaillées en langue vivante, à côté de comprendre, parler et écrire.
    etape: C'est la sixième activité, celle qui ne sert pas à toi mais à quelqu'un d'autre.
  pieges:
  - si:
      valeur: comprehension
    relance: Comprendre, c'est pour toi-même. Ici, tu aides quelqu'un d'autre à comprendre.
  solution: 'C''est la médiation : expliquer un message ou un document à quelqu''un pour l''aider à le comprendre.'
- id: parcours-renforce-mediation
  type: choix
  difficulte: 3
  enonce: Dans un parcours renforcé ou bilingue, quel niveau vise-t-on pour la médiation en fin de CM1 ?
  reponse:
    options:
    - id: a
      texte: A1
    - id: b
      texte: A1+
    - id: c
      texte: B1
    bonnes:
    - a
  indices:
    relance: Le niveau visé est-il le même pour toutes les activités dans un parcours renforcé ?
    methode: Sépare les activités de compréhension et d'expression d'un côté, la médiation de l'autre.
    etape: Pour comprendre et s'exprimer, le parcours renforcé vise le niveau « plus ». La médiation est une exception.
  pieges:
  - si:
      contient:
      - b
    relance: Le niveau « plus » est visé pour comprendre et s'exprimer, mais la médiation est une exception.
  - si:
      contient:
      - c
    relance: 'B1 est un niveau bien plus avancé : il n''est pas visé en CM1.'
  solution: En parcours renforcé ou bilingue, on vise A1+ pour comprendre et s'exprimer, mais A1 pour la médiation.
- id: nblm-a-quel-niveau-de-maitrise-de-l-anglais-d-1
  type: choix
  difficulte: 2
  enonce: À quel niveau de maîtrise de l'anglais dois-tu être à la fin de ton année de CM1 dans le parcours de droit commun
    ?
  reponse:
    options:
    - id: o1
      texte: Au niveau A1
    - id: o2
      texte: Au niveau A2
    - id: o3
      texte: Au niveau B1
    - id: o4
      texte: Au niveau B2
    bonnes:
    - o1
  indices:
    relance: Réfléchis au tout premier niveau pour un débutant qui commence à se débrouiller.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est faux. Le niveau A2 est un niveau plus avancé qui n'est pas exigé pour tous les élèves en CM1.
  - si:
      contient:
      - o3
    relance: C'est faux. Le niveau B1 est un niveau indépendant atteint plus tard au collège ou au lycée.
  - si:
      contient:
      - o4
    relance: C'est faux. Le niveau B2 est un niveau avancé visé au lycée, pas en primaire.
  solution: Au niveau A1. C'est juste ! Le niveau A1 est le premier niveau du cadre européen, visé pour tous les élèves à
    la fin du CM1.
- id: nblm-c-est-quoi-exactement-le-niveau-a1-en-an-2
  type: choix
  difficulte: 2
  enonce: C'est quoi exactement le niveau A1 en anglais selon ta fiche de révision ?
  reponse:
    options:
    - id: o1
      texte: Le niveau d'un débutant qui sait comprendre et dire des choses très simples sur lui et son quotidien
    - id: o2
      texte: Le niveau d'un élève qui parle couramment et sans aucune hésitation comme un anglophone
    - id: o3
      texte: Le niveau où l'on doit savoir traduire de longs romans complexes
    - id: o4
      texte: Le niveau où l'on ne comprend l'anglais que si la personne parle très rapidement
    bonnes:
    - o1
  indices:
    relance: Pense à la simplicité des expressions et aux sujets familiers comme la famille ou l'école.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux. Penser qu''il faut parler couramment en CM1 est une erreur : le niveau A1 reste très simple.'
  - si:
      contient:
      - o3
    relance: C'est faux. La traduction de textes longs et complexes ne fait pas partie du niveau A1.
  - si:
      contient:
      - o4
    relance: C'est faux. Au contraire, au niveau A1, il faut que la personne s'exprime lentement et clairement.
  solution: Le niveau d'un débutant qui sait comprendre et dire des choses très simples sur lui et son quotidien. C'est juste
    ! Le niveau A1 est le niveau élémentaire où l'on s'exprime simplement sur des sujets très familiers.
- id: nblm-a-quelle-condition-essentielle-peux-tu-b-3
  type: choix
  difficulte: 2
  enonce: À quelle condition essentielle peux-tu bien comprendre un message oral au niveau A1 ?
  reponse:
    options:
    - id: o1
      texte: Si la personne parle lentement et clairement
    - id: o2
      texte: Si la personne parle très vite et sans s'arrêter
    - id: o3
      texte: Si la personne utilise des mots très compliqués et scientifiques
    - id: o4
      texte: Si la personne crie très fort sans prononcer les mots
    bonnes:
    - o1
  indices:
    relance: Pense à la façon dont l'interlocuteur doit adapter sa vitesse de parole.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est faux. Un débit trop rapide empêche un élève de niveau A1 de saisir le message.
  - si:
      contient:
      - o3
    relance: C'est faux. Les mots utilisés doivent être simples et faire partie de l'environnement proche.
  - si:
      contient:
      - o4
    relance: C'est faux. La clarté de la prononciation et le rythme lent sont ce qui compte, pas le volume sonore.
  solution: Si la personne parle lentement et clairement. C'est juste ! Au niveau A1, la compréhension s'appuie sur une parole
    lente et bien articulée.
- id: nblm-un-eleve-de-cm1-sait-dire-my-name-is-leo-4
  type: choix
  difficulte: 2
  enonce: Un élève de CM1 sait dire « My name is Léo » et comprendre des phrases simples dites lentement. Est-il assez bon
    pour son niveau ?
  reponse:
    options:
    - id: o1
      texte: Oui, car cela correspond parfaitement aux attendus du niveau A1 en CM1
    - id: o2
      texte: Non, car il doit obligatoirement maîtriser le niveau A2 pour être assez bon en CM1
    - id: o3
      texte: Non, car il devrait être capable de tenir un discours scientifique complexe
    - id: o4
      texte: Non, car savoir se présenter ne fait pas partie du programme d'anglais
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi ce que doit savoir faire un élève au niveau débutant A1.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est faux. Le niveau A2 n'est pas obligatoire en CM1, le niveau A1 est l'objectif visé.
  - si:
      contient:
      - o3
    relance: C'est faux. On ne demande pas de discours complexe à un débutant de niveau A1.
  - si:
      contient:
      - o4
    relance: C'est faux. Se présenter et parler de soi est un élément central du niveau A1.
  solution: Oui, car cela correspond parfaitement aux attendus du niveau A1 en CM1. C'est juste ! Savoir se présenter et comprendre
    des énoncés simples dits lentement montre qu'il a le niveau A1 requis.
- id: nblm-qu-est-ce-que-le-niveau-a1-evoque-dans-l-5
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que le niveau A1+ évoqué dans les textes officiels et la fiche de révision ?
  reponse:
    options:
    - id: o1
      texte: Un niveau un peu plus avancé que A1, qui peut être atteint par certains élèves ou dans des parcours renforcés
    - id: o2
      texte: Le niveau obligatoire que tous les élèves sans exception doivent obtenir en fin de CM1
    - id: o3
      texte: Un niveau de langue des signes enseigné uniquement au collège
    - id: o4
      texte: La note maximale donnée sur 20 lors des évaluations de grammaire
    bonnes:
    - o1
  indices:
    relance: Pense à la nuance apportée par le signe « + » par rapport au niveau A1 de base.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est faux. Ne confonds pas A1 (obligatoire pour tous) et A1+ (un peu plus avancé mais pas obligatoire).
  - si:
      contient:
      - o3
    relance: C'est faux. A1+ est un échelon du Cadre européen pour les langues vivantes en primaire.
  - si:
      contient:
      - o4
    relance: C'est faux. A1+ est un niveau de compétence linguistique, pas un barème de notation.
  solution: Un niveau un peu plus avancé que A1, qui peut être atteint par certains élèves ou dans des parcours renforcés.
    C'est juste ! Le niveau A1+ indique une complexification possible pour dépasser légèrement le niveau A1 de base.
- id: nblm-quelles-sont-les-deux-affirmations-exact-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations exactes sur le niveau d'anglais attendu à la fin du CM1 ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Le niveau A1 est le niveau visé pour tous les élèves dans le parcours de droit commun.
    - id: o2
      texte: Au niveau A1, tu apprends à parler de sujets simples et familiers comme toi, ta famille et ton école.
    - id: o3
      texte: Pour réussir son CM1, il est obligatoire de parler l'anglais aussi couramment qu'un adulte anglophone.
    - id: o4
      texte: Le niveau A1 exige d'écrire de longs romans littéraires sans aucune faute de grammaire.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche la réponse qui parle du niveau officiel visé et celle qui décrit les sujets abordés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est faux. Penser qu'il faut parler couramment est une erreur fréquente ; A1 est un niveau de débutant.
  - si:
      contient:
      - o4
    relance: C'est faux. En CM1 au niveau A1, on produit des phrases courtes et des messages très simples.
  solution: Le niveau A1 est le niveau visé pour tous les élèves dans le parcours de droit commun ; Au niveau A1, tu apprends
    à parler de sujets simples et familiers comme toi, ta famille et ton école. C'est juste ! C'est le niveau cible officiel
    du programme à la fin de l'année de CM1.
- id: nblm-a-la-fin-de-l-annee-de-cm1-le-niveau-vis-7
  type: texte_court
  difficulte: 1
  enonce: À la fin de l'année de CM1, le niveau visé pour tous les élèves dans le parcours de droit commun est le niveau ____.
  reponse:
    acceptees:
    - A1
    fautes_tolerees: 1
  indices:
    relance: Repère la lettre et le chiffre qui désignent le niveau de débutant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: A1. C'est juste ! Le niveau A1 est le premier niveau du cadre européen, attendu à la fin du CM1.
- id: nblm-pour-qu-un-eleve-de-niveau-a1-comprenne-8
  type: texte_court
  difficulte: 1
  enonce: Pour qu'un élève de niveau A1 comprenne bien un message oral, l'interlocuteur doit s'exprimer ____ et clairement.
  reponse:
    acceptees:
    - lentement
    fautes_tolerees: 1
  indices:
    relance: Cherche l'adverbe qui indique le contraire de 'rapidement'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: lentement. C'est juste ! L'interlocuteur doit parler lentement pour permettre à l'élève de niveau A1 de tout comprendre.
sources:
