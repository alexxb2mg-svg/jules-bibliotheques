# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-ee-decrire-informer-point-de-vue
version: 2
etat: verifiee
declencheurs:
- dire si on aime ou pas quelque chose à l'écrit en anglais
- remplir une fiche de renseignements en anglais
- écrire un avis avec un adjectif en anglais
- répondre à un message écrit en anglais
- i really like
- i don't agree
- favourite colour
- écrire à mon correspondant
- it's very boring
prerequis:
- cm1-ee-structures-simples-trame-connue
essentiel: 'Écrire pour décrire, informer ou donner son avis, c''est écrire quelques mots ou de petites phrases sur soi, sur
  un objet ou sur ce qu''on aime.


  Pour décrire un objet familier, quelques mots suffisent : un nom et un adjectif. Exemples : « a red bike » (un vélo rouge),
  « my big bag » (mon grand sac), « a funny game » (un jeu amusant).


  Une fiche de renseignements demande des informations simples. Tu écris ta réponse juste après chaque mot-clé : « Name: »
  (nom), « Age: » (âge), « Town: » (ville), « Favourite colour: » (couleur préférée).


  Pour écrire un message ou un petit courrier, tu suis un modèle vu en classe. Tu commences par « Dear Sam, » ou « Hi Sam!
  ». Tu écris deux ou trois phrases. Tu termines par « Bye! » ou « Love, » suivi de ton prénom. C''est pareil sur une carte
  ou sur un message à l''ordinateur.


  Pour dire ce que tu aimes : « I like... » (j''aime), « I love... » (j''adore), « I don''t like... » (je n''aime pas). Pour
  une activité, le verbe prend « -ing » : « I like swimming ». Tu peux aussi donner ton avis avec un adjectif : « It''s great!
  » (c''est super), « It''s boring. » (c''est ennuyeux).


  Pour dire si tu es d''accord : « I agree » ou « I don''t agree ». Pour réagir à un message : « Cool! », « Me too! » (moi
  aussi), « Oh no! ». Pour renforcer ton avis, ajoute « very » (très) ou « really » (vraiment) : « It''s very good. »

  '
methode:
- Utilise "I like" ou "I love" pour un gout positif, et "I don't like" pour un gout négatif.
- Ajoute "-ing" au verbe après "like" ou "love" quand tu parles d'une activité.
- Utilise "I agree" ou "I don't agree" pour dire simplement si tu es d'accord.
- Ajoute "very" ou "really" pour renforcer ton opinion.
- Pour une fiche de renseignements, réponds juste après chaque mot-clé ("Name:", "Age:").
- Pour un message, suis le modèle (Dear... / deux ou trois phrases / Love, + ton prénom).
vocabulaire:
- terme: I like / I love / I don't like
  definition: J'aime / j'adore / je n'aime pas.
- terme: I agree / I don't agree
  definition: Je suis d'accord / je ne suis pas d'accord.
- terme: very / really
  definition: Très / vraiment. Ces mots rendent un avis plus fort.
- terme: great / boring
  definition: Super / ennuyeux, deux adjectifs pour donner son avis.
- terme: Me too!
  definition: Moi aussi ! On l'écrit pour réagir quand on pense pareil.
- terme: fiche de renseignements
  definition: Une petite fiche où l'on écrit des informations sur soi (nom, âge, ville...).
erreurs_frequentes:
- Oublier le "-ing" après "like" ou "love" quand on parle d'une activité ("I like swim" au lieu de "I like swimming").
- Confondre "I agree" (je suis d'accord) et "I like" (j'aime), qui n'expriment pas la même chose.
- Laisser une case vide sur une fiche de renseignements au lieu d'écrire une réponse simple.
- Oublier la formule du début (Dear...) ou la signature à la fin d'un message.
exemple:
  enonce: Écris une phrase pour dire que tu aimes vraiment jouer au football.
  solution: '"I really like playing football." Le verbe "play" devient "playing" après "like", et "really" renforce l''opinion.'
exercices:
- id: forme-verbe-apres-like
  type: choix
  difficulte: 1
  enonce: Quelle phrase est correctement écrite pour exprimer un gout pour une activité ?
  reponse:
    options:
    - id: a
      texte: I like reading books.
    - id: b
      texte: I like read books.
    - id: c
      texte: I like to reading books.
    bonnes:
    - a
  indices:
    relance: Après "like", le verbe qui parle d'une activité prend une terminaison particulière.
    methode: Le verbe après "like" pour une activité se termine par "-ing".
    etape: '"Read" prend la terminaison "-ing" après "like".'
  pieges:
  - si:
      contient:
      - b
    relance: Il manque la terminaison "-ing" sur le verbe "read". Cherche la forme complète.
  - si:
      contient:
      - c
    relance: On ne met pas "to" avant le verbe en "-ing". Cherche la forme correcte.
  solution: '"I like reading books." est correcte : le verbe prend la terminaison "-ing" après "like".'
- id: reagir-message
  type: choix
  difficulte: 1
  enonce: 'Ton correspondant t''écrit : « I love pizza! ». Toi aussi, tu adores la pizza. Que lui réponds-tu ?'
  reponse:
    options:
    - id: a
      texte: Me too!
    - id: b
      texte: Oh no!
    - id: c
      texte: I don't like pizza.
    bonnes:
    - a
  indices:
    relance: Tu penses la même chose que lui. Comment dit-on « moi aussi » ?
    methode: Pour réagir positivement quand on pense pareil, on utilise une petite expression de deux mots.
    etape: « Oh no! » montre qu'on est déçu. Ce n'est pas ce que tu veux dire.
  pieges:
  - si:
      contient:
      - b
    relance: « Oh no! » veut dire « oh non ! ». Tu montrerais que tu n'es pas content.
  - si:
      contient:
      - c
    relance: Cette phrase dit que tu n'aimes pas la pizza. Or tu l'adores aussi.
  solution: « Me too! » veut dire « moi aussi ! ». C'est une réaction positive quand on pense pareil.
- id: accord-ou-desaccord
  type: texte_court
  difficulte: 2
  enonce: 'Complète : "I ___ agree with you." pour dire que tu n''es pas d''accord. Quel mot manque ?'
  reponse:
    acceptees:
    - don't
    - do not
    fautes_tolerees: 1
  indices:
    relance: C'est le même petit mot que pour dire "je n'aime pas".
    methode: Pour dire le contraire de "I agree", on ajoute le petit mot de la négation juste avant "agree".
    etape: Le mot manquant se place juste entre "I" et "agree".
  pieges:
  - si:
      valeur: not
    relance: '"Not" seul ne suffit pas ici : il faut le mot complet utilisé avec les verbes au présent simple.'
  solution: 'Le mot manquant est "don''t" (ou "do not") : "I don''t agree with you.".'
- id: ordre-fiche-renseignements
  type: ordre
  difficulte: 2
  enonce: 'Range ces lignes dans l''ordre de la fiche modèle : d''abord le nom, puis l''âge, puis la couleur préférée.'
  reponse:
    elements:
    - id: a
      texte: 'Name: Alex'
    - id: b
      texte: 'Age: 9'
    - id: c
      texte: 'Favourite colour: blue'
  indices:
    relance: 'Quelle information donne-t-on généralement en premier sur une fiche : le nom, l''âge, ou une préférence ?'
    methode: Une fiche de renseignements commence en général par le nom, puis l'âge, puis les préférences.
    etape: '"Name: Alex" est la première ligne attendue sur une fiche de renseignements.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux lignes voisines sont inversées. Laquelle donne l'âge, et laquelle donne la couleur préférée ?
  - si:
      diagnostic: ordre_faux
    relance: 'Commence par le nom, puis l''âge, puis la couleur préférée : c''est l''ordre le plus courant.'
  solution: 'D''abord "Name: Alex", puis "Age: 9", puis "Favourite colour: blue".'
- id: association-gouts-forces
  type: association
  difficulte: 2
  enonce: Associe chaque phrase anglaise au niveau de gout qu'elle exprime.
  reponse:
    gauche:
    - id: a
      texte: I love chocolate.
    - id: b
      texte: I like chocolate.
    - id: c
      texte: I don't like chocolate.
    droite:
    - id: x
      texte: Un gout très fort et positif
    - id: y
      texte: Un gout simple et positif
    - id: z
      texte: Un gout négatif
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par la phrase la plus facile à reconnaitre : celle avec "don''t".'
    methode: '"Love" exprime un gout plus fort que "like" ; "don''t like" exprime un gout négatif.'
    etape: '"I don''t like chocolate" exprime clairement un gout négatif.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère la phrase qui exprime le gout le plus fort.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la phrase négative, puis distingue "love" et "like".
  solution: '"I love chocolate" = gout très fort et positif ; "I like chocolate" = gout simple et positif ; "I don''t like
    chocolate" = gout négatif.'
- id: renforcer-avis
  type: texte_court
  difficulte: 2
  enonce: 'Tu trouves ce film très bien. Complète avec le mot qui veut dire « très » : « It''s ___ good. »'
  reponse:
    acceptees:
    - very
    fautes_tolerees: 1
  indices:
    relance: C'est un petit mot qui se place juste devant l'adjectif « good ».
    methode: Pour rendre un avis plus fort, on ajoute un adverbe d'intensité devant l'adjectif.
    etape: Relis la fin de la fiche. Le mot pour « très » est donné juste avant « really ».
  pieges:
  - si:
      valeur: really
    relance: « really » veut dire « vraiment ». C'est juste comme idée, mais on demande le mot qui veut dire « très ».
  - si:
      valeur: good
    relance: « good » est déjà écrit dans la phrase. Il manque le mot placé devant.
  solution: On écrit « It's very good. ». « very » veut dire « très ».
- id: modele-de-message
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les parties de ce message à ta correspondante.
  reponse:
    elements:
    - id: a
      texte: Dear Emma,
    - id: b
      texte: I'm nine. I like swimming.
    - id: c
      texte: Love,
    - id: d
      texte: Chloé
  indices:
    relance: Par quoi commence une lettre ou une carte en anglais ?
    methode: Un message suit toujours le même modèle. Il y a la formule du début, les phrases, la formule de fin, puis le
      prénom de celui qui écrit.
    etape: Le message commence par « Dear Emma, ». Le prénom de celle qui écrit vient tout à la fin.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux parties voisines sont inversées. Le prénom de celle qui écrit vient-il avant ou après « Love, » ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par « Dear... », mets les phrases au milieu, et termine par la formule de fin puis la signature.
  solution: D'abord « Dear Emma, », puis « I'm nine. I like swimming. », puis « Love, », puis la signature « Chloé ».
- id: avis-adjectif
  type: choix
  difficulte: 3
  enonce: 'Ton correspondant écrit : « Football is great! ». Toi, tu trouves que le football est ennuyeux. Quelle réponse
    écrit ton avis ?'
  reponse:
    options:
    - id: a
      texte: I don't agree. Football is boring.
    - id: b
      texte: I agree. Football is great.
    - id: c
      texte: I don't agree. Football is very good.
    bonnes:
    - a
  indices:
    relance: Tu n'es pas du même avis que lui. Il faut donc dire ton désaccord, puis ton avis.
    methode: Vérifie deux choses. La phrase dit-elle que tu n'es pas d'accord ? L'adjectif veut-il dire « ennuyeux » ?
    etape: « great » et « very good » sont des avis positifs. Cherche un adjectif négatif.
  pieges:
  - si:
      contient:
      - b
    relance: « I agree » veut dire que tu es d'accord. Or toi, tu trouves le football ennuyeux.
  - si:
      contient:
      - c
    relance: Le début est juste, mais « very good » veut dire « très bien ». Cela contredit ton désaccord.
  solution: « I don't agree. Football is boring. » Tu dis ton désaccord, puis ton avis avec l'adjectif « boring » (ennuyeux).
- id: ma-fiche-et-mon-message
  type: ouverte
  difficulte: 3
  enonce: 'Remplis en anglais une petite fiche sur toi (Name, Age, Town, Favourite colour). Puis écris un message de trois
    phrases à un correspondant : décris un objet que tu aimes, dis ce que tu aimes faire et ce que tu n''aimes pas.'
  criteres:
  - Les quatre lignes de la fiche sont remplies juste après chaque mot-clé.
  - Le message commence par « Dear... » ou « Hi... » et finit par une formule de fin et ton prénom.
  - Le message contient un gout positif et un gout négatif (I like... / I don't like...), avec un verbe en « -ing » ou un
    adjectif.
  indices:
    relance: 'Commence par la fiche, c''est le plus facile. Qu''écris-tu après « Name: » ?'
    methode: Pour le message, suis le modèle. Dear..., trois phrases, puis Love, et ton prénom.
    etape: Pour l'objet, utilise un nom et un adjectif, comme « my red bike ».
  solution: 'Exemple : Name: Noé. Age: 9. Town: Lyon. Favourite colour: green. « Dear Tom, I have got a red bike. It''s great!
    I like swimming. I don''t like football. Love, Noé »'
- id: nblm-comment-ecrit-on-correctement-en-anglais-1
  type: choix
  difficulte: 2
  enonce: Comment écrit-on correctement en anglais « J'aime nager » ?
  reponse:
    options:
    - id: o1
      texte: I like swimming
    - id: o2
      texte: I like swim
    - id: o3
      texte: I am swim
    - id: o4
      texte: I agree swimming
    bonnes:
    - o1
  indices:
    relance: Pense à la terminaison particulière que prend le verbe d'action placé après 'like'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : il ne faut pas oublier d''ajouter la terminaison ''-ing'' au verbe d''action après ''like''.'
  - si:
      contient:
      - o3
    relance: On n'utilise pas 'I am' directement devant la forme de base d'un verbe pour exprimer un goût.
  - si:
      contient:
      - o4
    relance: Confusion entre 'I agree' (je suis d'accord) et 'I like' (j'aime).
  solution: 'I like swimming. C''est la bonne forme : après ''like'', le verbe d''action prend la terminaison ''-ing''.'
- id: nblm-sur-une-fiche-de-renseignements-en-angla-2
  type: choix
  difficulte: 2
  enonce: 'Sur une fiche de renseignements en anglais, que dois-tu écrire en face de la rubrique « Age: » ?'
  reponse:
    options:
    - id: o1
      texte: Un nombre, par exemple 9 ou Nine
    - id: o2
      texte: Ton prénom, par exemple Jules
    - id: o3
      texte: Ta couleur préférée, par exemple Blue
    - id: o4
      texte: Ce que tu aimes faire, par exemple Swimming
    bonnes:
    - o1
  indices:
    relance: Cette rubrique cherche à savoir depuis combien d'années tu es né.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le prénom se donne en face de la rubrique 'Name:', pas 'Age:'.
  - si:
      contient:
      - o3
    relance: La couleur préférée correspond à la rubrique 'Favourite colour:'.
  - si:
      contient:
      - o4
    relance: Les activités ou loisirs se placent dans d'autres rubriques comme 'Hobbies:' ou 'Likes:'.
  solution: 'Un nombre, par exemple 9 ou Nine. C''est correct : la rubrique ''Age:'' demande d''indiquer ton âge sous forme
    de nombre.'
- id: nblm-quel-mot-permet-de-donner-plus-d-intensi-3
  type: choix
  difficulte: 2
  enonce: Quel mot permet de donner plus d'intensité à la phrase « I like pizza » pour dire qu'on aime « vraiment » la pizza
    ?
  reponse:
    options:
    - id: o1
      texte: really
    - id: o2
      texte: agree
    - id: o3
      texte: not
    - id: o4
      texte: under
    bonnes:
    - o1
  indices:
    relance: C'est un adverbe court qui signifie 'vraiment' en anglais.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: '''agree'' signifie ''être d''accord'', ce n''est pas un adverbe d''intensité.'
  - si:
      contient:
      - o3
    relance: '''not'' sert à exprimer la négation, pas à renforcer un goût positif.'
  - si:
      contient:
      - o4
    relance: '''under'' est une préposition de lieu qui signifie ''sous''.'
  solution: 'really. C''est exact : l''adverbe ''really'' permet de renforcer son opinion pour dire ''vraiment''.'
- id: nblm-si-un-camarade-ecrit-cats-are-better-tha-4
  type: choix
  difficulte: 2
  enonce: Si un camarade écrit « Cats are better than dogs » et que tu veux écrire que tu n'es pas d'accord, quelle formule
    utilises-tu ?
  reponse:
    options:
    - id: o1
      texte: I don't agree
    - id: o2
      texte: I don't like
    - id: o3
      texte: I don't know Name
    - id: o4
      texte: I am happy
    bonnes:
    - o1
  indices:
    relance: Cherche la formule anglaise qui exprime le contraire de 'I agree'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: '''I don''t like'' sert à dire qu''on n''aime pas quelque chose, pas à exprimer un désaccord sur une affirmation.'
  - si:
      contient:
      - o3
    relance: Cette expression ne répond pas au propos et mélange 'ne pas savoir' et la rubrique 'Name'.
  - si:
      contient:
      - o4
    relance: '''I am happy'' exprime la joie, ce qui ne traduit pas un désaccord.'
  solution: 'I don''t agree. C''est exact : ''I don''t agree'' signifie ''je ne suis pas d''accord''.'
- id: nblm-dans-un-message-ecrit-en-anglais-quel-ve-5
  type: choix
  difficulte: 2
  enonce: Dans un message écrit en anglais, quel verbe utilise-t-on pour exprimer un goût positif très fort (« j'adore »)
    ?
  reponse:
    options:
    - id: o1
      texte: I love...
    - id: o2
      texte: I don't agree...
    - id: o3
      texte: I don't like...
    - id: o4
      texte: 'Name:'
    bonnes:
    - o1
  indices:
    relance: C'est le verbe anglais qui signifie 'adorer'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: '''I don''t agree'' exprime un désaccord, pas un goût très fort.'
  - si:
      contient:
      - o3
    relance: '''I don''t like'' sert à exprimer un goût négatif (''je n''aime pas'').'
  - si:
      contient:
      - o4
    relance: '''Name:'' est une rubrique de fiche de renseignements, pas un verbe de goût.'
  solution: 'I love. C''est la bonne réponse : ''I love'' exprime un goût positif très fort (''j''adore'').'
- id: nblm-quelles-sont-les-deux-expressions-correc-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX expressions correctes pour exprimer un goût positif ou un accord à l'écrit ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: I like
    - id: o2
      texte: I agree
    - id: o3
      texte: I don't like
    - id: o4
      texte: I don't agree
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les deux formules qui expriment du positif (aimer) ou de la confirmation (être d'accord).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Incorrect : ''I don''t like'' exprime un goût négatif (''je n''aime pas'').'
  - si:
      contient:
      - o4
    relance: 'Incorrect : ''I don''t agree'' exprime un désaccord (''je ne suis pas d''accord'').'
  solution: 'I like ; I agree. C''est juste : ''I like'' est la structure de base pour dire ''j''aime''.'
- id: nblm-complete-la-phrase-pour-dire-je-n-aime-p-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase pour dire « Je n''aime pas » à l''écrit en anglais : « ... like ».'
  reponse:
    acceptees:
    - I don't
    fautes_tolerees: 1
  indices:
    relance: Pense à la forme négative de 'I like'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'I don''t. C''est exact : ''I don''t'' placé devant ''like'' forme ''I don''t like'' pour dire ''Je n''aime pas''.'
- id: nblm-quel-mot-anglais-signifiant-tres-utilise-8
  type: texte_court
  difficulte: 1
  enonce: Quel mot anglais signifiant « très » utilise-t-on devant un adjectif pour renforcer son avis (par exemple dans «
    very good ») ?
  reponse:
    acceptees:
    - very
    fautes_tolerees: 1
  indices:
    relance: C'est un mot de 4 lettres commençant par V.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'very. C''est exact : l''adverbe ''very'' signifie ''très'' et permet d''exprimer un degré d''intensité.'
sources:
