# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-eoc-raconter
version: 1
etat: verifiee
declencheurs:
- raconter une petite histoire en anglais avec des images
- compter des objets en anglais dans une histoire
- raconter sa journée d'école en anglais en quelques mots
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
- cm1-eoc-se-presenter-exprimer-gouts
couverture: Cette fiche porte sur raconter des faits brefs à l'aide d'images ou d'une trame connue. Elle ne couvre pas le
  récit au passé (le prétérit n'est pas au programme de CM1).
essentiel: 'Pour raconter une petite histoire en anglais, tu utilises des phrases simples que tu relies avec

  des mots comme « and » (et) ou « then » (puis, ensuite).

  Tu peux t''aider d''images pour raconter dans l''ordre : d''abord une chose, puis une autre.

  Tu utilises aussi les nombres pour compter des objets ou des personnages, et quelques adjectifs

  pour les décrire, comme « big » (grand) ou « small » (petit).

  Une histoire répétitive (comme une histoire en randonnée) répète souvent la même phrase avec un

  nouveau personnage à chaque fois : cela t''aide à mémoriser la trame.

  '
methode:
- Regarde les images de l'histoire dans l'ordre avant de commencer à raconter.
- Utilise « and » ou « then » pour relier deux phrases simples entre elles.
- Si l'histoire est répétitive, repère la phrase qui revient et change seulement le personnage ou le nombre.
vocabulaire:
- terme: and
  definition: et
- terme: then
  definition: puis, ensuite
- terme: big
  definition: grand
- terme: small
  definition: petit
erreurs_frequentes:
- Raconter les images dans le désordre au lieu de suivre l'ordre logique de l'histoire.
- Oublier d'utiliser « and » ou « then » pour relier les phrases entre elles.
exemple:
  enonce: Tu racontes une histoire avec trois animaux, un chat, puis un chien, puis un oiseau. Comment relies-tu tes phrases
    ?
  solution: Tu dis par exemple « First, a cat. Then, a dog. And then, a bird. » en utilisant « then » et « and » pour enchainer
    les personnages.
exercices:
- id: mot-de-liaison
  type: choix
  difficulte: 1
  enonce: Quel mot anglais sert à relier deux phrases en signifiant « et » ?
  reponse:
    options:
    - id: a
      texte: and
    - id: b
      texte: big
    - id: c
      texte: small
    bonnes:
    - a
  indices:
    relance: Ce mot ne décrit rien, il sert juste à relier deux idées.
    methode: « big » et « small » sont des adjectifs, pas des mots de liaison.
    etape: Le mot de liaison commence par la lettre A.
  pieges:
  - si:
      contient:
      - b
    relance: « big » veut dire « grand », c'est un adjectif, pas un mot de liaison.
  solution: « and » signifie « et » et sert à relier deux phrases ou deux mots.
- id: grand-ou-petit
  type: association
  difficulte: 1
  enonce: Associe chaque mot anglais à sa traduction.
  reponse:
    gauche:
    - id: a
      texte: big
    - id: b
      texte: small
    - id: c
      texte: then
    droite:
    - id: x
      texte: grand
    - id: y
      texte: petit
    - id: z
      texte: puis, ensuite
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Deux mots sont des adjectifs opposés, un mot sert à enchainer les actions.
    methode: Commence par les deux adjectifs de taille, qui sont contraires.
    etape: '« big » est le contraire de « small »: associe-les d''abord.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre « grand » et « petit ».
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque mot un par un : deux sont des tailles opposées, un sert à enchainer les actions.'
  solution: big = grand ; small = petit ; then = puis, ensuite.
- id: ordre-histoire
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour raconter une petite histoire en t'aidant d'images.
  reponse:
    elements:
    - id: regarder
      texte: Regarder les images dans l'ordre
    - id: premiere
      texte: Dire la première phrase simple
    - id: relier
      texte: Relier avec « and » ou « then » à la phrase suivante
    - id: finir
      texte: Terminer par la dernière image de l'histoire
  indices:
    relance: Que dois-tu faire avant même de commencer à parler ?
    methode: Regarde d'abord les images, puis raconte dans l'ordre en reliant les phrases.
    etape: La toute première étape est de regarder les images.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Que fait-on juste avant de relier les phrases ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce que l'on fait en tout premier (regarder les images) et en tout dernier (finir l'histoire).
  solution: On regarde d'abord les images, on dit la première phrase, on relie avec « and » ou « then », puis on termine par
    la dernière image.
