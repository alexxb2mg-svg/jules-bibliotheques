# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-eoc-raconter
version: 2
etat: verifiee
declencheurs:
- raconter une petite histoire en anglais avec des images
- compter des objets en anglais dans une histoire
- raconter sa journée d'école en anglais en quelques mots
- first then and then
- histoire en randonnée anglais
- on monday i play
- in the park
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
- cm1-eoc-se-presenter-exprimer-gouts
couverture: Cette fiche porte sur raconter des faits brefs à l'aide d'images ou d'une trame connue. Elle ne couvre pas le
  récit au passé (le prétérit n'est pas au programme de CM1).
essentiel: 'Raconter, c''est dire à l''oral une suite de faits courts, dans l''ordre. En CM1, tu racontes au présent, à l''aide
  d''images ou d''une histoire que tu connais bien, par exemple un album lu en classe ou un kamishibaï (un petit théâtre d''images).


  Pour enchainer tes phrases simples, tu les mets bout à bout avec des petits mots : « first » (d''abord), « then » (puis,
  ensuite), « and » (et). Exemple : « First, I see a cat. Then, I see a dog. »


  Pour situer ton histoire dans le temps, tu peux dire le jour : « On Monday » (lundi), ou un moment : « in the morning »
  (le matin). Pour la situer dans l''espace, tu dis où cela se passe : « at school » (à l''école), « in the park » (au parc).
  Tu peux aussi parler de toi : « On Saturday, I play football in the park. »


  Tu utilises les nombres pour compter les objets ou les personnages : « one cat, two dogs, three birds ». Quand il y en a
  plusieurs, le nom prend souvent un « s » : un chat, « a cat », mais deux chats, « two cats ».


  Tu décris les personnages avec quelques adjectifs simples, comme « big » (grand), « small » (petit) ou « happy » (content).
  En anglais, l''adjectif se place avant le nom : « a big dog » (un grand chien).


  Une histoire en randonnée répète la même phrase avec un nouveau personnage à chaque fois. Par exemple : « Grey mouse, what
  do you see? I see a red bird. » Puis l''oiseau parle à son tour. Cette répétition t''aide à mémoriser la trame et à raconter
  à ton tour.

  '
methode:
- Regarde les images de l'histoire dans l'ordre avant de commencer à raconter.
- Commence par « first », puis enchaine avec « then » ou « and ».
- Situe ton histoire avec le jour (« On Monday ») ou le lieu (« in the park »).
- Compte les personnages ou les objets avec les nombres, et ajoute un « s » au nom s'il y en a plusieurs.
- Si l'histoire est répétitive, repère la phrase qui revient et change seulement le personnage, la couleur ou le nombre.
vocabulaire:
- terme: first
  definition: d'abord.
- terme: then
  definition: puis, ensuite.
- terme: On Monday
  definition: lundi (pour dire quel jour cela se passe).
- terme: repère temporel
  definition: un mot qui dit quand cela se passe, comme un jour ou un moment de la journée.
- terme: big / small
  definition: grand / petit.
- terme: mot de liaison
  definition: un petit mot qui relie deux phrases ou deux idées, comme « and » ou « then ».
- terme: histoire en randonnée
  definition: une histoire où la même phrase revient avec un nouveau personnage à chaque fois.
erreurs_frequentes:
- Raconter les images dans le désordre au lieu de suivre l'ordre logique de l'histoire.
- Oublier d'utiliser « and » ou « then » pour relier les phrases entre elles.
- Oublier le « s » au pluriel, par exemple dire « two cat » au lieu de « two cats ».
- Placer l'adjectif après le nom comme en français (« a dog big ») au lieu de « a big dog ».
exemple:
  enonce: Tu racontes une histoire avec trois images. Sur la première, il y a un petit chat. Sur la deuxième, deux grands
    chiens arrivent. Sur la troisième, le chat est triste. Comment racontes-tu ?
  solution: Tu dis par exemple « First, there is a small cat. Then, two big dogs arrive. And then, the cat is sad. ». « First
    » et « then » donnent l'ordre. « Two dogs » prend un « s » car il y en a deux. « Small » et « big » sont placés avant
    le nom. « Sad » décrit le chat à la fin.
exercices:
- id: mot-de-liaison
  type: choix
  difficulte: 1
  enonce: Quel mot anglais sert à relier deux phrases en signifiant « et » ?
  reponse:
    options:
    - id: a
      texte: and
    - id: b
      texte: big
    - id: c
      texte: small
    bonnes:
    - a
  indices:
    relance: Ce mot ne décrit rien, il sert juste à relier deux idées.
    methode: « big » et « small » sont des adjectifs, pas des mots de liaison.
    etape: Élimine les deux mots qui décrivent une taille.
  pieges:
  - si:
      contient:
      - b
    relance: « big » veut dire « grand », c'est un adjectif, pas un mot de liaison.
  - si:
      contient:
      - c
    relance: « small » veut dire « petit », c'est un adjectif, pas un mot de liaison.
  solution: « and » signifie « et » et sert à relier deux phrases ou deux mots.
- id: grand-ou-petit
  type: association
  difficulte: 1
  enonce: Associe chaque mot anglais à sa traduction.
  reponse:
    gauche:
    - id: a
      texte: big
    - id: b
      texte: small
    - id: c
      texte: then
    droite:
    - id: x
      texte: grand
    - id: y
      texte: petit
    - id: z
      texte: puis, ensuite
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Deux mots sont des adjectifs opposés, un mot sert à enchainer les actions.
    methode: Commence par les deux adjectifs de taille, qui sont contraires.
    etape: '« big » est le contraire de « small » : associe-les d''abord.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre « grand » et « petit ».
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque mot un par un : deux sont des tailles opposées, un sert à enchainer les actions.'
  solution: big = grand ; small = petit ; then = puis, ensuite.
- id: ordre-histoire
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre logique les étapes pour raconter une petite histoire en t'aidant d'images.
  reponse:
    elements:
    - id: regarder
      texte: Regarder les images dans l'ordre
    - id: premiere
      texte: Dire la première phrase simple
    - id: relier
      texte: Relier avec « and » ou « then » à la phrase suivante
    - id: finir
      texte: Terminer par la dernière image de l'histoire
  indices:
    relance: Que dois-tu faire avant même de commencer à parler ?
    methode: Regarde d'abord les images, puis raconte dans l'ordre en reliant les phrases.
    etape: La toute première étape est de regarder les images.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Que fait-on juste avant de relier les phrases ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce que l'on fait en tout premier (regarder les images) et en tout dernier (finir l'histoire).
  solution: On regarde d'abord les images, on dit la première phrase, on relie avec « and » ou « then », puis on termine par
    la dernière image.
- id: pluriel-compter
  type: texte_court
  difficulte: 1
  enonce: 'Dans ton histoire, il y a trois chats. Complète en anglais : « three ___ ». Écris seulement le mot qui manque.'
  reponse:
    acceptees:
    - cats
    fautes_tolerees: 0
  indices:
    relance: Un chat se dit « a cat ». Que se passe-t-il quand il y en a plusieurs ?
    methode: Au pluriel, on ajoute souvent une lettre à la fin du nom.
    etape: Prends le mot pour un seul chat et ajoute la lettre du pluriel.
  pieges:
  - si:
      valeur: cat
    relance: Il y a trois chats, donc plusieurs. Il manque la lettre du pluriel à la fin.
  solution: On écrit « cats », avec un « s » car il y a plusieurs chats.
- id: repere-temps
  type: choix
  difficulte: 2
  enonce: 'Dans l''histoire, tu entends : « On Monday, Tom goes to the park. » Quand Tom va-t-il au parc ?'
  reponse:
    options:
    - id: a
      texte: Lundi
    - id: b
      texte: Dimanche
    - id: c
      texte: Le matin
    bonnes:
    - a
  indices:
    relance: Quel mot de la phrase est un jour de la semaine ?
    methode: Les jours de la semaine en anglais commencent par une majuscule, comme « Monday » ou « Sunday ».
    etape: « Sunday » est dimanche, et « morning » veut dire matin. Élimine ces deux réponses.
  pieges:
  - si:
      contient:
      - b
    relance: Dimanche se dit « Sunday ». Le jour entendu est différent, il commence par « Mon ».
  - si:
      contient:
      - c
    relance: Le matin se dit « in the morning ». Ici, la phrase donne un jour de la semaine.
  solution: « On Monday » veut dire lundi. Tom va au parc lundi.
- id: place-adjectif
  type: choix
  difficulte: 2
  enonce: Comment dis-tu « un grand chien » en anglais ?
  reponse:
    options:
    - id: a
      texte: a big dog
    - id: b
      texte: a dog big
    - id: c
      texte: a big dogs
    bonnes:
    - a
  indices:
    relance: En anglais, où se place l'adjectif par rapport au nom ?
    methode: En anglais, l'adjectif se met toujours avant le nom, et il n'y a qu'un seul chien ici.
    etape: Élimine d'abord l'option où le nom est au pluriel.
  pieges:
  - si:
      contient:
      - b
    relance: En français, on peut mettre l'adjectif après le nom, mais pas en anglais.
  - si:
      contient:
      - c
    relance: Il n'y a qu'un seul chien. Faut-il mettre un « s » ?
  solution: « a big dog ». En anglais, l'adjectif se place avant le nom.
- id: histoire-en-randonnee
  type: ordre
  difficulte: 3
  enonce: 'Range dans l''ordre les phrases de cette histoire en randonnée : une souris voit un oiseau, l''oiseau voit un canard,
    le canard voit un chat.'
  reponse:
    elements:
    - id: ours
      texte: Grey mouse, what do you see? I see a red bird.
    - id: oiseau
      texte: Red bird, what do you see? I see a yellow duck.
    - id: canard
      texte: Yellow duck, what do you see? I see a white cat.
    - id: fin
      texte: White cat, what do you see? I see all of you!
  indices:
    relance: Quel personnage parle en premier ?
    methode: Dans une histoire en randonnée, l'animal qui est vu devient celui qui parle dans la phrase suivante.
    etape: La souris commence. Elle voit un oiseau, donc la phrase suivante commence par l'oiseau.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux phrases voisines sont inversées. Vérifie que l'animal vu devient bien celui qui parle ensuite.
  - si:
      diagnostic: ordre_faux
    relance: Commence par la souris, puis suis la chaine, chaque animal vu parle dans la phrase suivante.
  solution: La souris voit l'oiseau, l'oiseau voit le canard, le canard voit le chat, et le chat voit tout le monde.
- id: raconter-sa-journee
  type: ouverte
  difficulte: 3
  enonce: Raconte à un adulte, en anglais, trois choses de ta journée d'école, dans l'ordre, au présent. Utilise au moins
    deux mots de liaison.
  criteres:
  - L'élève raconte au moins trois faits dans un ordre logique.
  - L'élève utilise au moins deux mots pour enchainer (first, then, and) ou situe un fait dans le temps (jour, moment).
  - L'élève utilise des phrases simples au présent, compréhensibles.
  indices:
    relance: Que fais-tu en premier en arrivant à l'école ?
    methode: Commence par « First », continue avec « Then », et termine avec « And ».
    etape: 'Tu peux commencer par : « First, I go to school. »'
  solution: 'Exemple : « First, I go to school. Then, I read a book. And in the afternoon, I play football with my friends!
    »'
