format: 2
notion: cm1-six-activites-langagieres
version: 1
etat: verifiee
declencheurs:
- les différentes façons de travailler l'anglais en classe
- à quoi sert d'écouter, de parler et d'écrire en anglais
- c'est quoi discuter en anglais
- aider un copain à comprendre l'anglais
prerequis: []
essentiel: 'En anglais, tu ne fais pas qu''une seule chose : tu travailles six activités différentes.

  Écouter : tu comprends ce que tu entends (une histoire, une consigne).

  Parler tout seul : tu parles sans que quelqu''un te réponde, par exemple pour te présenter.

  Discuter : tu parles avec quelqu''un et il te répond, comme dans une vraie conversation.

  Lire : tu comprends un texte écrit en anglais.

  Écrire : tu écris des mots ou des phrases en anglais.

  Expliquer à quelqu''un : quand un camarade ne comprend pas, tu l''aides en expliquant avec d''autres mots.

  '
methode:
- 'Repère quelle activité tu fais : est-ce que tu écoutes, tu parles tout seul, tu discutes, tu lis, tu écris, ou tu expliques
  à quelqu''un ?'
- Retiens que parler tout seul (par exemple te présenter) est différent de discuter avec quelqu'un qui te répond.
- Retiens qu'expliquer à quelqu'un qui ne comprend pas est aussi une activité que tu travailles en anglais.
vocabulaire:
- terme: Écouter
  definition: comprendre ce que tu entends en anglais
- terme: Parler tout seul
  definition: parler en anglais sans que quelqu'un te réponde, par exemple pour te présenter
- terme: Discuter
  definition: parler en anglais avec quelqu'un qui te répond
- terme: Lire
  definition: comprendre un texte écrit en anglais
- terme: Écrire
  definition: écrire des mots ou des phrases en anglais
- terme: Expliquer à quelqu'un
  definition: aider une personne à comprendre en lui expliquant avec d'autres mots
erreurs_frequentes:
- Confondre parler tout seul et discuter avec quelqu'un qui répond.
- Oublier qu'expliquer à quelqu'un qui ne comprend pas est aussi une activité travaillée en anglais.
exemple:
  enonce: Ton camarade ne comprend pas une phrase en anglais et tu la lui expliques avec d'autres mots. Quelle activité fais-tu
    ?
  solution: 'Tu aides ton camarade à comprendre en expliquant avec d''autres mots : c''est l''activité où l''on explique à
    quelqu''un.'
exercices:
- id: ecouter-ou-lire
  type: choix
  difficulte: 1
  enonce: Quand tu écoutes une histoire en anglais et que tu essaies de la comprendre, quelle activité fais-tu ?
  reponse:
    options:
    - id: a
      texte: Tu écoutes et tu comprends ce que tu entends
    - id: b
      texte: Tu écris une phrase en anglais
    - id: c
      texte: Tu discutes avec un camarade
    - id: d
      texte: Tu lis un texte écrit
    bonnes:
    - a
  indices:
    relance: Est-ce que tes yeux lisent des mots écrits, ou est-ce que tes oreilles entendent des mots ?
    methode: 'Repère par quel sens l''information arrive : les oreilles ou les yeux.'
    etape: Dans cette situation, l'information arrive par les oreilles.
  pieges:
  - si:
      contient:
      - d
    relance: Lire, c'est comprendre un texte écrit avec les yeux. Ici, l'information arrive-t-elle par les yeux ou par les
      oreilles ?
  - si:
      contient:
      - c
    relance: Discuter, c'est parler avec quelqu'un qui te répond. Ici, est-ce que quelqu'un te répond ?
  solution: Quand tu comprends ce que tu entends, tu fais l'activité « écouter » (compréhension de l'oral).
- id: associer-activite-definition
  type: association
  difficulte: 1
  enonce: Associe chaque activité à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Écouter
    - id: b
      texte: Parler tout seul
    - id: c
      texte: Discuter
    - id: d
      texte: Écrire
    droite:
    - id: x
      texte: Comprendre ce qu'on entend
    - id: y
      texte: Parler sans que quelqu'un réponde, par exemple pour se présenter
    - id: z
      texte: Parler avec quelqu'un qui répond
    - id: w
      texte: Écrire des mots ou des phrases
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Repère d'abord l'activité où l'on ne fait qu'écrire, elle est la plus simple à reconnaître.
    methode: Pour chaque activité, demande-toi si elle passe par les oreilles, la bouche seule, la bouche avec un échange,
      ou la main qui écrit.
    etape: Écouter concerne toujours les oreilles ; commence par cette paire.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre parler seul et discuter.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque activité une par une en te demandant si elle implique une réponse de quelqu'un d'autre.
  solution: Écouter = comprendre ce qu'on entend ; parler tout seul = parler sans réponse ; discuter = parler avec réponse
    ; écrire = écrire des mots ou des phrases.
- id: mot-mediation
  type: texte_court
  difficulte: 2
  enonce: Quel mot du programme désigne le fait d'aider quelqu'un à comprendre, en lui expliquant avec d'autres mots ?
  reponse:
    acceptees:
    - mediation
    fautes_tolerees: 1
  indices:
    relance: 'Ce n''est ni écouter, ni parler, ni lire, ni écrire : c''est une sixième activité.'
    methode: Pense à ce que tu fais quand un camarade ne comprend pas et que tu l'aides avec d'autres mots.
    etape: Le mot commence par « médi- ».
  pieges:
  - si:
      valeur: traduction
    relance: 'Traduire un mot est proche, mais le mot du programme est plus général : il désigne le fait d''aider quelqu''un
      à comprendre.'
  solution: 'Le mot est « médiation » : aider quelqu''un à comprendre en expliquant avec d''autres mots.'
- id: expliquer-a-quoi-ca-sert
  type: ouverte
  difficulte: 3
  enonce: Explique avec tes mots à quoi servent ces six activités quand on apprend l'anglais.
  criteres:
  - L'élève cite au moins deux activités langagières (parmi écouter, parler seul, discuter, lire, écrire, expliquer à quelqu'un).
  - L'élève explique une différence, par exemple entre parler tout seul et discuter, ou entre lire et écrire.
  indices:
    relance: Pense à une activité où tu es seul(e) à parler, et une autre où on te répond.
    methode: Choisis deux activités bien différentes et explique ce qui les distingue.
    etape: 'Tu peux commencer par : « Quand j''écoute, je... » puis continuer avec une deuxième activité.'
  solution: 'Ces six activités permettent de travailler toutes les façons d''utiliser l''anglais : comprendre à l''oral et
    à l''écrit, s''exprimer seul ou avec quelqu''un, et aider les autres à comprendre.'
