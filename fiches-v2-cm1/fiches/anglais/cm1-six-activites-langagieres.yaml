format: 2
notion: cm1-six-activites-langagieres
version: 2
etat: verifiee
declencheurs:
- les différentes façons de travailler l'anglais en classe
- à quoi sert d'écouter, de parler et d'écrire en anglais
- c'est quoi discuter en anglais
- aider un copain à comprendre l'anglais
- c'est quoi la médiation
- parler en continu
- compréhension de l'écrit
prerequis: []
essentiel: 'En anglais, tu ne fais pas qu''une seule chose : le programme te fait travailler six activités langagières différentes.


  1. Écouter et comprendre (on dit aussi « compréhension de l''oral ») : tu comprends ce que tu entends, par exemple une consigne,
  une chanson ou une histoire.


  2. Lire et comprendre (« compréhension de l''écrit ») : tu comprends un texte écrit en anglais, comme une affiche, une carte
  postale ou un album.


  3. Parler en continu : tu parles tout seul, sans que quelqu''un te réponde. Par exemple, tu te présentes, tu récites un
  poème ou tu racontes une petite histoire.


  4. Écrire : tu écris des mots ou des phrases en anglais, comme une liste ou un petit message.


  5. Discuter (« interaction orale ») : tu parles avec quelqu''un qui te répond, comme dans une vraie conversation. Tu poses
  des questions et tu réponds.


  6. Expliquer à quelqu''un (« médiation ») : quand un camarade ne comprend pas, tu l''aides en redisant le message avec d''autres
  mots, parfois en français.


  Ces activités se mélangent souvent. Dans un jeu de rôle, tu écoutes ton camarade puis tu lui réponds : tu écoutes et tu
  discutes à la fois.


  Pour chaque activité, le programme s''appuie sur des niveaux communs à toute l''Europe, ceux du CECRL (Cadre européen commun
  de référence pour les langues). Ils servent à savoir où tu en es.

  '
methode:
- 'Repère d''où vient le message : par les oreilles (écouter) ou par les yeux (lire).'
- 'Si tu produis quelque chose, regarde comment : avec ta voix (parler) ou avec ta main (écrire).'
- Si tu parles, demande-toi si quelqu'un te répond (discuter) ou non (parler en continu).
- Si tu aides quelqu'un à comprendre, c'est l'activité où l'on explique à quelqu'un (la médiation).
- Rappelle-toi qu'une même situation peut mélanger plusieurs activités.
vocabulaire:
- terme: activité langagière
  definition: une des façons d'utiliser une langue, comme écouter, lire, parler ou écrire.
- terme: compréhension de l'oral
  definition: comprendre ce que tu entends en anglais.
- terme: compréhension de l'écrit
  definition: comprendre un texte écrit en anglais.
- terme: parler en continu
  definition: parler en anglais sans que quelqu'un te réponde, par exemple pour te présenter.
- terme: interaction orale
  definition: discuter en anglais avec quelqu'un qui te répond.
- terme: médiation
  definition: aider une personne à comprendre en lui expliquant le message avec d'autres mots.
erreurs_frequentes:
- Confondre parler tout seul (parler en continu) et discuter avec quelqu'un qui répond.
- Confondre écouter (par les oreilles) et lire (par les yeux).
- Oublier qu'expliquer à quelqu'un qui ne comprend pas est aussi une activité travaillée en anglais.
- Croire qu'une situation correspond toujours à une seule activité, alors qu'elles se mélangent souvent.
exemple:
  enonce: Ton camarade ne comprend pas une phrase en anglais lue au tableau, et tu la lui expliques avec d'autres mots en
    français. Quelles activités fais-tu ?
  solution: 'D''abord, tu lis la phrase au tableau : c''est la compréhension de l''écrit. Ensuite, tu aides ton camarade à
    comprendre en redisant le message avec d''autres mots : c''est l''activité où l''on explique à quelqu''un, la médiation.
    Une même situation mélange donc deux activités.'
exercices:
- id: ecouter-ou-lire
  type: choix
  difficulte: 1
  enonce: Quand tu écoutes une histoire en anglais et que tu essaies de la comprendre, quelle activité fais-tu ?
  reponse:
    options:
    - id: a
      texte: Tu écoutes et tu comprends ce que tu entends
    - id: b
      texte: Tu écris une phrase en anglais
    - id: c
      texte: Tu discutes avec un camarade
    - id: d
      texte: Tu lis un texte écrit
    bonnes:
    - a
  indices:
    relance: Est-ce que tes yeux lisent des mots écrits, ou est-ce que tes oreilles entendent des mots ?
    methode: 'Repère par quel sens l''information arrive : les oreilles ou les yeux.'
    etape: Dans cette situation, l'information arrive par les oreilles.
  pieges:
  - si:
      contient:
      - d
    relance: Lire, c'est comprendre un texte écrit avec les yeux. Ici, l'information arrive-t-elle par les yeux ou par les
      oreilles ?
  - si:
      contient:
      - c
    relance: Discuter, c'est parler avec quelqu'un qui te répond. Ici, est-ce que quelqu'un te répond ?
  - si:
      contient:
      - b
    relance: Écrire, c'est produire des mots avec ta main. Ici, tu reçois une histoire, tu ne produis rien.
  solution: Quand tu comprends ce que tu entends, tu fais l'activité « écouter » (compréhension de l'oral).
- id: associer-activite-definition
  type: association
  difficulte: 1
  enonce: Associe chaque activité à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Écouter
    - id: b
      texte: Parler tout seul
    - id: c
      texte: Discuter
    - id: d
      texte: Écrire
    droite:
    - id: x
      texte: Comprendre ce qu'on entend
    - id: y
      texte: Parler sans que quelqu'un réponde, par exemple pour se présenter
    - id: z
      texte: Parler avec quelqu'un qui répond
    - id: w
      texte: Écrire des mots ou des phrases
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Repère d'abord l'activité où l'on ne fait qu'écrire, elle est la plus simple à reconnaître.
    methode: Pour chaque activité, demande-toi si elle passe par les oreilles, la bouche seule, la bouche avec un échange,
      ou la main qui écrit.
    etape: Écouter concerne toujours les oreilles ; commence par cette paire.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre parler seul et discuter.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque activité une par une en te demandant si elle implique une réponse de quelqu'un d'autre.
  solution: Écouter = comprendre ce qu'on entend ; parler tout seul = parler sans réponse ; discuter = parler avec réponse
    ; écrire = écrire des mots ou des phrases.
- id: mot-mediation
  type: texte_court
  difficulte: 2
  enonce: Quel mot du programme désigne le fait d'aider quelqu'un à comprendre, en lui expliquant avec d'autres mots ?
  reponse:
    acceptees:
    - mediation
    fautes_tolerees: 1
  indices:
    relance: 'Ce n''est ni écouter, ni parler, ni lire, ni écrire : c''est une sixième activité.'
    methode: Pense à ce que tu fais quand un camarade ne comprend pas et que tu l'aides avec d'autres mots.
    etape: Le mot commence par « médi- ».
  pieges:
  - si:
      valeur: traduction
    relance: 'Traduire un mot est proche, mais le mot du programme est plus général : il désigne le fait d''aider quelqu''un
      à comprendre.'
  solution: 'Le mot est « médiation » : aider quelqu''un à comprendre en expliquant avec d''autres mots.'
- id: se-presenter-quelle-activite
  type: choix
  difficulte: 1
  enonce: Tu te présentes devant la classe en anglais (« My name is Jules. I am nine. »). Personne ne te répond. Quelle activité
    fais-tu ?
  reponse:
    options:
    - id: a
      texte: Parler en continu
    - id: b
      texte: Discuter avec quelqu'un
    - id: c
      texte: Lire un texte
    bonnes:
    - a
  indices:
    relance: Est-ce que quelqu'un te répond pendant que tu parles ?
    methode: Quand on parle, il y a deux activités possibles, selon qu'on te répond ou non.
    etape: Personne ne te répond. Tu parles donc tout seul.
  pieges:
  - si:
      contient:
      - b
    relance: Discuter, c'est quand quelqu'un te répond. Ici, personne ne te répond.
  - si:
      contient:
      - c
    relance: Tu ne lis pas de texte, tu parles avec ta voix.
  solution: Tu parles tout seul, sans réponse. C'est l'activité « parler en continu ».
- id: situation-activite
  type: association
  difficulte: 2
  enonce: Associe chaque situation de classe à l'activité qu'elle fait travailler.
  reponse:
    gauche:
    - id: a
      texte: Tu lis une carte postale en anglais
    - id: b
      texte: Tu poses une question à ton voisin et il te répond
    - id: c
      texte: Tu écris la liste des courses en anglais
    - id: d
      texte: Tu expliques en français une consigne anglaise à un camarade
    droite:
    - id: x
      texte: Lire et comprendre
    - id: y
      texte: Discuter
    - id: z
      texte: Écrire
    - id: w
      texte: Expliquer à quelqu'un (médiation)
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Pour chaque situation, demande-toi si tu reçois un message ou si tu en produis un.
    methode: Cherche le sens utilisé (yeux, oreilles, voix, main) et s'il y a quelqu'un d'autre.
    etape: Une carte postale se regarde avec les yeux. Commence par cette paire.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Quelle situation sert à aider quelqu'un d'autre à comprendre ?
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends chaque situation et demande-toi : est-ce que je lis, est-ce que j''écris, est-ce qu''on me répond,
      est-ce que j''aide quelqu''un ?'
  solution: Lire une carte postale = lire et comprendre ; poser une question et avoir une réponse = discuter ; écrire une
    liste = écrire ; expliquer une consigne = médiation.
- id: nombre-activites
  type: nombre
  difficulte: 1
  enonce: Combien d'activités langagières différentes travailles-tu en anglais d'après le programme ?
  reponse:
    valeur: '6'
  indices:
    relance: Compte les activités, celles qui reçoivent et celles qui produisent.
    methode: Il y a écouter, lire, parler tout seul, écrire, discuter, et une dernière où l'on aide quelqu'un.
    etape: Compte sur tes doigts chaque activité citée dans la méthode.
  pieges:
  - si:
      valeur: '4'
    relance: Tu as compté écouter, lire, parler et écrire. Il manque discuter et aider quelqu'un à comprendre.
  - si:
      valeur: '5'
    relance: Il en manque une. As-tu pensé à l'activité où l'on aide un camarade à comprendre ?
  solution: Il y a 6 activités langagières (écouter, lire, parler en continu, écrire, discuter, médiation).
- id: jeu-de-role
  type: choix
  difficulte: 3
  enonce: Dans un jeu de rôle au marché, ton camarade te demande « What do you want? » et tu réponds « Two apples, please
    ». Quelles activités travailles-tu ?
  reponse:
    options:
    - id: a
      texte: Écouter
    - id: b
      texte: Discuter
    - id: c
      texte: Écrire
    - id: d
      texte: Lire
    bonnes:
    - a
    - b
  indices:
    relance: Plusieurs réponses sont justes. Que fais-tu avec tes oreilles, puis avec ta voix ?
    methode: Une même situation peut mélanger plusieurs activités. Passe en revue chaque option.
    etape: Tu dois d'abord comprendre la question entendue. Ensuite, tu réponds à quelqu'un qui t'a parlé.
  pieges:
  - si:
      contient:
      - c
    relance: Dans ce jeu, personne n'écrit. Tout se passe à l'oral.
  - si:
      contient:
      - d
    relance: Il n'y a pas de texte écrit dans ce jeu. Tout se passe à l'oral.
  solution: Tu écoutes la question de ton camarade (écouter), puis tu lui réponds dans un échange (discuter). Les deux activités
    se mélangent.
- id: expliquer-a-quoi-ca-sert
  type: ouverte
  difficulte: 3
  enonce: Explique avec tes mots à quoi servent ces six activités quand on apprend l'anglais. Donne un exemple de ta classe
    pour deux d'entre elles.
  criteres:
  - L'élève cite au moins deux activités langagières (parmi écouter, parler seul, discuter, lire, écrire, expliquer à quelqu'un).
  - L'élève explique une différence, par exemple entre parler tout seul et discuter, ou entre lire et écrire.
  - L'élève donne un exemple concret de situation de classe pour au moins une activité.
  indices:
    relance: Pense à une activité où tu es seul(e) à parler, et une autre où on te répond.
    methode: Choisis deux activités bien différentes et explique ce qui les distingue.
    etape: 'Tu peux commencer par : « Quand j''écoute, je... » puis continuer avec une deuxième activité.'
  solution: 'Ces six activités permettent de travailler toutes les façons d''utiliser l''anglais : comprendre à l''oral et
    à l''écrit, s''exprimer seul ou avec quelqu''un, et aider les autres à comprendre. Par exemple, quand je chante une chanson,
    je parle en continu ; quand je joue au marchand avec mon voisin, je discute.'
