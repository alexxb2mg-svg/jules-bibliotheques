# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-ce-comprendre-textes-courts-simples
version: 2
etat: verifiee
declencheurs:
- comprendre une carte postale en anglais
- deviner le sens d'un texte anglais grâce aux images
- reconnaitre le type d'un texte en anglais
- repérer les nombres dans un texte anglais
- lire une bd en anglais
- comprendre un petit mail en anglais
- c'est quoi dear
- lire une publicité en anglais
prerequis: []
essentiel: 'Lire un texte court en anglais, ce n''est pas traduire chaque mot. C''est repérer ce que tu connais déjà pour
  comprendre de quoi parle le texte.


  Commence par ce qui se voit sans lire : le titre, les mots écrits en gros, les images. Ce sont des indices visuels. Une
  photo de plage et le titre « My holidays » annoncent un texte sur les vacances.


  Ensuite, repère les mots isolés que tu connais : la maison, l''école, la famille, les repas, les jeux. Dans « I play football
  with my brother », tu reconnais « football » et « brother » : le texte parle d''un jeu avec un frère.


  Les chiffres et les nombres se repèrent vite : une date, une heure, un prix, un âge. Dans « Party at 4 o''clock », tu sais
  déjà à quelle heure est la fête.


  Chaque type de texte a sa mise en forme. Une carte postale commence par « Dear... » et finit par un prénom. Un message ou
  un courriel commence souvent par « Hi ». Une bande dessinée a des bulles. Une publicité montre un produit et un prix en
  gros. Un poème ou une chanson est écrit en lignes courtes, souvent avec des rimes.


  Un texte informatif (sur un animal, un lieu) est souvent accompagné d''une photo. L''image t''aide à deviner le sens des
  mots nouveaux.

  '
methode:
- 'Regarde d''abord le titre et les images avant de lire le texte : ils donnent le sujet général.'
- Repère la mise en forme (bulles, « Dear... », prix en gros, lignes courtes) pour deviner le type de texte.
- Repère les mots que tu connais déjà (couleurs, chiffres, famille, école) pour te faire une idée du contenu.
- 'Repère les chiffres et les nombres : ils donnent souvent une information précise (une date, un prix, un âge).'
- 'Ne cherche pas à traduire mot à mot : construis le sens général à partir de ce que tu reconnais.'
vocabulaire:
- terme: indice visuel
  definition: Une image, un dessin ou un titre en gros qui aide à deviner le sens d'un texte.
- terme: postcard
  definition: Une carte postale, qu'on envoie souvent pendant les vacances.
- terme: Dear...
  definition: Cher ou chère..., le mot qui commence une lettre ou une carte.
- terme: comic strip
  definition: Une bande dessinée, avec des cases et des bulles.
- terme: advertisement
  definition: Une publicité, qui donne envie d'acheter un produit.
- terme: poem / song
  definition: Un poème ou une chanson, écrits en lignes courtes qui riment souvent.
erreurs_frequentes:
- Vouloir traduire chaque mot du texte, au lieu de s'appuyer sur les images et les mots connus.
- Ne pas regarder le titre ni les images avant de commencer à lire.
- Ignorer les nombres présents dans le texte alors qu'ils donnent une information utile.
- S'arrêter au premier mot inconnu, alors que les autres mots suffisent souvent pour comprendre.
exemple:
  enonce: Tu lis une carte postale qui commence par « Dear Tom, I am in London. The weather is sunny. » De quoi parle ce texte
    ?
  solution: Le texte parle d'un séjour à Londres et du temps qu'il fait (« sunny » = ensoleillé). C'est une carte postale,
    car elle commence par « Dear Tom ». Même sans connaitre chaque mot, on comprend le sujet grâce aux mots « London » et
    « sunny ».
exercices:
- id: type-de-texte
  type: choix
  difficulte: 1
  enonce: Un document a une adresse en haut, commence par "Dear Mum" et se termine par "Love, Ben". Quel type de texte est-ce
    ?
  reponse:
    options:
    - id: a
      texte: Une carte postale
    - id: b
      texte: Une bande dessinée
    - id: c
      texte: Une publicité
    bonnes:
    - a
  indices:
    relance: Cherche le type de texte qui commence toujours par "Dear..." et finit par un prénom.
    methode: Ce type de texte s'adresse toujours à une personne précise ("Dear Mum") et se termine par une signature.
    etape: '"Dear Mum" au début et "Love, Ben" à la fin sont les marques typiques de ce type de texte.'
  pieges:
  - si:
      contient:
      - b
    relance: Une bande dessinée a des bulles de dialogue, pas d'adresse ni de formule "Dear...". Regarde encore la mise en
      forme.
  - si:
      contient:
      - c
    relance: Une publicité met en avant un produit ou un prix, pas une formule "Dear..." adressée à une personne.
  solution: 'C''est une carte postale : elle commence par "Dear..." et se termine par une signature comme "Love, Ben".'
- id: mots-animaux
  type: choix
  difficulte: 1
  enonce: Dans le message « I have got a cat and a dog. », quels mots désignent des animaux ? (Il y a deux bonnes réponses.)
  reponse:
    options:
    - id: a
      texte: cat
    - id: b
      texte: dog
    - id: c
      texte: have
    - id: d
      texte: and
    bonnes:
    - a
    - b
  indices:
    relance: Quels mots de la phrase pourrais-tu dessiner ?
    methode: Les animaux sont des noms. Les petits mots qui relient ou qui disent une action ne sont pas des animaux.
    etape: Un des animaux est le chat. Cherche maintenant l'autre animal.
  pieges:
  - si:
      contient:
      - c
    relance: « have » veut dire « avoir » ; ce n'est pas un animal. Cherche les mots que tu pourrais dessiner.
  - si:
      contient:
      - d
    relance: « and » veut dire « et » ; il relie deux mots. Ce n'est pas un animal.
  solution: « cat » (chat) et « dog » (chien) sont les deux animaux. « have » veut dire avoir et « and » veut dire et.
- id: information-precise
  type: texte_court
  difficulte: 2
  enonce: 'Une petite annonce dit : "Cat for sale. Price: 20 pounds." Quel est le prix indiqué ? Écris juste le nombre.'
  reponse:
    acceptees:
    - '20'
    - vingt
    fautes_tolerees: 0
  indices:
    relance: Le prix est un nombre écrit juste après le mot "Price".
    methode: Cherche le nombre situé juste après "Price:" dans le texte.
    etape: 'Le texte donne "Price:" suivi d''un nombre en livres : c''est ce nombre qu''il faut écrire.'
  pieges:
  - si:
      valeur: cat
    relance: '"Cat" est l''animal vendu, pas le prix. Cherche le nombre écrit après "Price".'
  solution: Le prix indiqué est 20 (livres, "pounds").
- id: ordre-lecture-strategie
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour comprendre un texte court en anglais, de la première à la dernière.
  reponse:
    elements:
    - id: a
      texte: Regarder le titre et les images
    - id: b
      texte: Repérer les mots déjà connus et les nombres
    - id: c
      texte: Construire le sens général du texte
    - id: d
      texte: Vérifier que ce sens va bien avec les images
  indices:
    relance: Quelle étape se fait avant même de commencer à lire les mots du texte ?
    methode: On part toujours du plus visible (titre, images) vers le sens global du texte.
    etape: Regarder le titre et les images est la toute première étape, avant de lire les mots.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle vient juste après avoir regardé le titre et les images ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par ce qui se voit sans lire (titre, images). Termine en vérifiant le sens trouvé avec les images.
  solution: D'abord regarder le titre et les images, puis repérer les mots connus et les nombres, puis construire le sens
    général, enfin vérifier qu'il va bien avec les images.
- id: association-types-textes
  type: association
  difficulte: 2
  enonce: Associe chaque type de texte à ce qui le caractérise.
  reponse:
    gauche:
    - id: a
      texte: Postcard
    - id: b
      texte: Comic strip
    - id: c
      texte: Advertisement
    droite:
    - id: x
      texte: Commence par "Dear..." et finit par une signature
    - id: y
      texte: Contient des bulles de dialogue
    - id: z
      texte: Met en avant un produit ou un prix
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par le type de texte le plus facile à reconnaitre : celui avec des bulles.'
    methode: 'Chaque type de texte a une mise en forme différente : adresse, bulles, ou prix en avant.'
    etape: '"Comic strip" (bande dessinée) est le texte avec des bulles de dialogue.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère le texte qui commence par "Dear...".
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la bande dessinée grâce à ses bulles, puis distingue les deux autres.
  solution: '"Postcard" = commence par "Dear..." ; "Comic strip" = bulles de dialogue ; "Advertisement" = met en avant un
    produit ou un prix.'
- id: poeme-type
  type: choix
  difficulte: 2
  enonce: 'Un texte est écrit en lignes courtes : « The sun is red, / I go to bed. » Les mots « red » et « bed » riment. Quel
    type de texte est-ce ?'
  reponse:
    options:
    - id: a
      texte: Un poème
    - id: b
      texte: Une publicité
    - id: c
      texte: Un courriel
    bonnes:
    - a
  indices:
    relance: Regarde la forme du texte plutôt que le sens des mots.
    methode: Des lignes courtes et des mots qui finissent par le même son, c'est la marque d'un certain type de texte.
    etape: Une publicité montre un produit, un courriel commence par « Hi » ou « Dear ». Il reste un seul choix.
  pieges:
  - si:
      contient:
      - b
    relance: Il n'y a ni produit ni prix dans ce texte. Regarde plutôt les lignes courtes et les rimes.
  - si:
      contient:
      - c
    relance: Ce texte ne s'adresse à personne et ne finit pas par un prénom. Regarde les rimes.
  solution: 'C''est un poème : il est écrit en lignes courtes et les mots « red » et « bed » riment.'
- id: texte-informatif-chat
  type: choix
  difficulte: 2
  enonce: 'Un petit texte a pour titre « Cats » et une photo de chat. Il dit : « Cats like milk. They sleep a lot. They can
    jump very high. » De quoi parle ce texte ?'
  reponse:
    options:
    - id: a
      texte: De ce que les chats aiment et savent faire
    - id: b
      texte: D'une recette avec du lait
    - id: c
      texte: D'un chat perdu que l'on cherche
    bonnes:
    - a
  indices:
    relance: Regarde le titre et la photo. Quel est le sujet du texte ?
    methode: Repère les mots connus de chaque phrase (milk, sleep, jump) et demande-toi de qui ils parlent.
    etape: « Cats » veut dire « les chats ». Chaque phrase dit quelque chose sur eux.
  pieges:
  - si:
      contient:
      - b
    relance: Le lait (« milk ») est cité, mais il n'y a ni ingrédients ni étapes à suivre. Relis le titre.
  - si:
      contient:
      - c
    relance: Le texte ne dit pas qu'un chat est perdu. Il donne des informations sur les chats en général.
  solution: 'Le texte parle de ce que les chats aiment et savent faire : ils aiment le lait (« milk »), dorment beaucoup («
    sleep ») et sautent très haut (« jump »).'
- id: courriel-invitation
  type: choix
  difficulte: 3
  enonce: 'Tu lis ce courriel : « Hi Léo! Come to my house on Saturday. We can play video games and eat pizza. See you! Emma
    » Que propose Emma ?'
  reponse:
    options:
    - id: a
      texte: De venir chez elle samedi pour jouer et manger
    - id: b
      texte: D'aller à la piscine dimanche
    - id: c
      texte: De faire les devoirs ensemble samedi
    bonnes:
    - a
  indices:
    relance: Quel jour est cité dans le message, et quelles activités ?
    methode: Repère le jour de la semaine, puis les verbes d'activité (play, eat) et les mots connus (house, pizza).
    etape: « Saturday » est un jour de la semaine, et « my house » veut dire « ma maison ».
  pieges:
  - si:
      contient:
      - b
    relance: Le message ne parle ni de piscine ni de dimanche. Cherche le jour écrit dans le texte.
  - si:
      contient:
      - c
    relance: Le jour est bon, mais le message ne parle pas de devoirs. Quelles activités sont citées ?
  solution: Emma propose à Léo de venir chez elle (« my house ») samedi (« Saturday ») pour jouer aux jeux vidéo et manger
    une pizza.
- id: enquete-texte-maison
  type: ouverte
  difficulte: 3
  enonce: 'À la maison, trouve un court texte en anglais (un emballage, une affiche, une boite de jeu, un livre illustré).
    Écris en français : quel type de texte c''est, trois mots anglais que tu as reconnus avec leur sens, et un nombre que
    tu as repéré avec ce qu''il indique.'
  criteres:
  - Le type de texte est nommé et justifié par sa mise en forme (images, titre, prix, bulles...).
  - Trois mots anglais reconnus sont recopiés sans erreur, avec leur sens en français.
  - Un nombre est repéré et l'élève dit ce qu'il indique (prix, âge, quantité, date...).
  indices:
    relance: Quel objet de la maison a des mots anglais écrits dessus ?
    methode: Regarde d'abord le titre et les images, puis cherche les mots que tu connais et les chiffres.
    etape: Commence par écrire le nom de l'objet et le type de texte (publicité, livre, boite de jeu...).
  solution: 'Exemple : une boite de jeu, avec une image et un titre en gros. Mots reconnus : « cards » (cartes), « players
    » (joueurs), « red » (rouge). Nombre : « 2-4 players », c''est le nombre de joueurs.'
- id: nblm-comment-reconnait-on-facilement-une-cart-1
  type: choix
  difficulte: 2
  enonce: Comment reconnaît-on facilement une carte postale en anglais (« postcard ») sans tout lire ?
  reponse:
    options:
    - id: o1
      texte: Elle commence souvent par « Dear... » et se termine par un prénom.
    - id: o2
      texte: Elle comporte uniquement des bulles de dialogue dessinées.
    - id: o3
      texte: Elle présente une liste d'ingrédients numérotés.
    - id: o4
      texte: Elle est rédigée sans aucun signe de ponctuation ni majuscule.
    bonnes:
    - o1
  indices:
    relance: Observe la formule d'ouverture au début du message et la signature à la fin.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : les bulles de dialogue caractérisent une bande dessinée (« comic strip »), pas une carte postale.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : une liste d''ingrédients numérotés se trouve dans une recette de cuisine.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : les cartes postales respectent la ponctuation et comportent des majuscules aux prénoms et lieux.'
  solution: 'Elle commence souvent par « Dear... » et se termine par un prénom. C''est exact : les cartes postales s''ouvrent
    par « Dear... » suivi du prénom du destinataire et se terminent par une signature.'
- id: nblm-si-tu-vois-une-illustration-de-plage-acc-2
  type: choix
  difficulte: 2
  enonce: Si tu vois une illustration de plage accompagnant le titre « My holidays », que t'indiquent ces éléments avant de
    lire le texte ?
  reponse:
    options:
    - id: o1
      texte: Ils donnent l'idée principale du texte, qui traite des vacances.
    - id: o2
      texte: Ils traduisent chaque mot du texte en français.
    - id: o3
      texte: Ils indiquent que le texte est une publicité pour du matériel d'école.
    - id: o4
      texte: Ils remplacent complètement le texte qu'il ne faut plus lire.
    bonnes:
    - o1
  indices:
    relance: Associe le sens du mot « holidays » et l'image de la plage au sujet général.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : les visuels et titres donnent le thème global, ils ne fournissent pas une traduction mot à
      mot.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : l''image de plage et le mot « holidays » renvoient aux vacances, non aux fournitures scolaires.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : l''image aide à comprendre, mais elle vient en appui du texte sans le remplacer.'
  solution: 'Ils donnent l''idée principale du texte, qui traite des vacances. C''est juste : le titre et l''image associés
    permettent d''anticiper le sujet général avant la lecture détaillée.'
- id: nblm-dans-un-texte-court-en-anglais-a-quoi-se-3
  type: choix
  difficulte: 2
  enonce: Dans un texte court en anglais, à quoi sert principalement le repérage des chiffres et des nombres ?
  reponse:
    options:
    - id: o1
      texte: À trouver rapidement des informations précises comme une date, un prix ou un âge.
    - id: o2
      texte: À deviner si le texte est un poème ou une chanson.
    - id: o3
      texte: À compter le nombre exact de mots difficiles dans le document.
    - id: o4
      texte: À savoir si le texte contient des fautes de grammaire.
    bonnes:
    - o1
  indices:
    relance: Pense aux renseignements concrets apportés par les chiffres dans la vie quotidienne (prix, heure, âge).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la nature poétique ou musicale d''un texte dépend de sa mise en forme et de son rythme, pas
      de la présence de chiffres.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : les nombres dans le texte donnent des informations sur le sujet, ils ne servent pas à mesurer
      la difficulté.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : les chiffres apportent du sens au contenu et n''indiquent pas la correction grammaticale.'
  solution: 'À trouver rapidement des informations précises comme une date, un prix ou un âge. C''est exact : les chiffres
    sont des repères faciles qui apportent des données concrètes (âge, prix, heure, date).'
- id: nblm-quelle-caracteristique-visuelle-permet-d-4
  type: choix
  difficulte: 2
  enonce: Quelle caractéristique visuelle permet d'identifier une bande dessinée (« comic strip ») en anglais ?
  reponse:
    options:
    - id: o1
      texte: La présence de bulles contenant les paroles des personnages.
    - id: o2
      texte: Une formule d'adresse « Dear... » suivie d'une signature en bas.
    - id: o3
      texte: Un prix écrit en gros caractères avec un produit illustré.
    - id: o4
      texte: Une suite d'étapes numérotées décrivant une préparation.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au support dans lequel s'inscrivent les paroles des personnages de BD.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : cette présentation est celle d''une lettre ou d''une carte postale.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : un prix en gros et un produit correspondent généralement à une publicité.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : des étapes numérotées décrivent le déroulement d''une recette ou d''un mode d''emploi.'
  solution: 'La présence de bulles contenant les paroles des personnages. C''est correct : les bulles de dialogue et le découpage
    en vignettes sont propres à la bande dessinée.'
- id: nblm-quelle-est-la-meilleure-methode-pour-com-5
  type: choix
  difficulte: 2
  enonce: Quelle est la meilleure méthode pour comprendre un texte court en anglais au CM1 ?
  reponse:
    options:
    - id: o1
      texte: S'appuyer sur les images, les mots connus et les chiffres pour dégager le sens général.
    - id: o2
      texte: Traduire obligatoirement chaque mot dans le dictionnaire, un par un.
    - id: o3
      texte: Ignorer le titre et les illustrations pour se concentrer sur les mots inconnus.
    - id: o4
      texte: Abandonner la lecture dès qu'un mot est inconnu.
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments d'aide qui permettent de comprendre sans traduire chaque mot.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : chercher à traduire mot à mot ralentit la lecture et empêche de comprendre l''idée générale.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le titre et les images sont des aides essentielles pour orienter la compréhension.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : on peut comprendre le message global d''un texte même si quelques mots restent inconnus.'
  solution: 'S''appuyer sur les images, les mots connus et les chiffres pour dégager le sens général. C''est exact : il faut
    utiliser les repères visuels et le vocabulaire connu sans chercher à tout traduire.'
- id: nblm-quels-sont-les-deux-elements-essentiels-6
  type: choix
  difficulte: 3
  enonce: Quels sont les DEUX éléments essentiels sur lesquels s'appuyer pour comprendre un texte court illustré en anglais
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Les indices visuels fournis par les images et les illustrations.
    - id: o2
      texte: Les mots simples et familiers déjà appris en classe.
    - id: o3
      texte: La recherche systématique de la traduction de tous les mots du texte.
    - id: o4
      texte: La récitation complète des règles de grammaire complexes.
    bonnes:
    - o1
    - o2
  indices:
