format: 2
notion: cm1-eoi-exprimer-emotions-souhaits
version: 2
etat: verifiee
declencheurs:
- dire qu'on est content ou fatigué en anglais
- réagir à une bonne nouvelle en anglais
- dire aïe ou super en anglais
- dire wow ou oh no
- dire que je suis triste en anglais
- réagir quand un copain est triste en anglais
- dire j'ai peur en anglais
- I am sad ou I am happy
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
- cm1-eoi-echanger-informations
couverture: Cette fiche porte sur exprimer des émotions simples et réagir avec des mots ou des onomatopées. Elle ne couvre
  pas l'échange d'informations factuelles (voir « échanger des informations »).
essentiel: 'En anglais, tu peux dire comment tu te sens avec des phrases toutes faites. Le plus souvent, tu utilises « I am
  » (je suis) suivi d''un adjectif : « I am happy » (je suis content), « I am sad » (je suis triste), « I am tired » (je suis
  fatigué), « I am scared » (j''ai peur).


  En classe, ce rituel revient souvent au début de la séance. La maitresse demande « How are you today? » (comment vas-tu
  aujourd''hui ?) et chacun répond avec son émotion : « I am happy! » ou « I am tired. ».


  Quand l''autre te répond, tu réagis à ce qu''il dit. S''il est content, tu peux dire « Great! » (super !). S''il est triste
  ou malade, tu dis gentiment « Oh, I''m sorry. » (oh, je suis désolé).


  Pour réagir très vite, tu utilises des exclamations et des onomatopées. Une onomatopée est un mot qui imite un bruit ou
  un cri. « Wow! » montre la surprise ou l''admiration. « Oh no! » montre la déception ou l''inquiétude. « Ouch! » veut dire
  « aïe ! » quand on a mal. Attention : ces mots ne sont pas les mêmes qu''en français.


  On peut aussi accepter ou refuser une proposition en montrant ce qu''on ressent. Si un camarade dit « Let''s play! » (jouons
  !), tu peux répondre « Yes, great! » si tu as envie, ou « No, thank you. » si tu n''as pas envie. Écouter une chanson est
  aussi une bonne occasion de dire si tu es content ou triste.

  '
methode:
- 'Demande-toi d''abord ce que tu ressens : content, triste, fatigué, effrayé, surpris.'
- Dis « I am » suivi de l'adjectif qui correspond à cette émotion.
- 'Pour réagir très vite, choisis une exclamation toute faite : Wow!, Oh no!, Ouch!'
- Écoute ce que ressent l'autre avant de réagir.
- 'Réagis à sa réponse : « Great! » si c''est une bonne nouvelle, « Oh, I''m sorry. » si c''est triste.'
vocabulaire:
- terme: I am happy / I am sad
  definition: je suis content / je suis triste.
- terme: I am tired
  definition: je suis fatigué.
- terme: I am scared
  definition: j'ai peur.
- terme: Wow!
  definition: une exclamation de surprise ou d'admiration.
- terme: Oh no!
  definition: une exclamation de déception ou d'inquiétude.
- terme: Ouch!
  definition: une onomatopée de douleur, comme « aïe ! ».
- terme: onomatopée
  definition: un mot qui imite un bruit ou un cri.
erreurs_frequentes:
- Utiliser « Aïe ! » à la française au lieu de l'onomatopée anglaise « Ouch! ».
- Confondre « happy » (content) et « scared » (effrayé), qui expriment des émotions opposées.
- Oublier « I am » et dire seulement l'adjectif, ou dire « I happy » sans « am ».
- Répondre « Great! » à quelqu'un qui est triste, au lieu de « Oh, I'm sorry. ».
exemple:
  enonce: Tu te fais mal au doigt en jouant, puis ton ami te demande « Are you OK? ». Que dis-tu en anglais ?
  solution: 'D''abord, tu réagis avec l''onomatopée anglaise de la douleur : « Ouch! ». Ensuite, tu peux dire comment tu te
    sens, par exemple « I am OK, thank you. » si ça va mieux.'
exercices:
- id: dire-content
  type: choix
  difficulte: 1
  enonce: Comment dis-tu « je suis content » en anglais ?
  reponse:
    options:
    - id: a
      texte: I am happy
    - id: b
      texte: I am scared
    - id: c
      texte: I am tired
    bonnes:
    - a
  indices:
    relance: Ce mot ressemble au mot anglais qui veut dire heureux.
    methode: « scared » et « tired » ne correspondent pas à la joie.
    etape: Le bon adjectif commence par la lettre H.
  pieges:
  - si:
      contient:
      - b
    relance: « scared » veut dire « effrayé », pas « content ».
  - si:
      contient:
      - c
    relance: « tired » veut dire « fatigué », pas « content ».
  solution: « I am happy » signifie « je suis content ».
- id: onomatopee-douleur
  type: texte_court
  difficulte: 1
  enonce: Quelle onomatopée anglaise dit-on quand on se fait mal, à la place de « aïe » ?
  reponse:
    acceptees:
    - ouch
    fautes_tolerees: 1
  indices:
    relance: Ce mot très court commence par la lettre O.
    methode: Pense au mot que disent les personnages anglais quand ils se cognent.
    etape: Le mot rime avec « pouch ».
  pieges:
  - si:
      valeur: aie
    relance: « Aïe » est le mot français. Quel est le mot anglais équivalent ?
  solution: « Ouch! » est l'onomatopée anglaise pour la douleur.
- id: association-emotions
  type: association
  difficulte: 2
  enonce: Associe chaque adjectif anglais à l'émotion qu'il exprime.
  reponse:
    gauche:
    - id: a
      texte: happy
    - id: b
      texte: scared
    - id: c
      texte: tired
    droite:
    - id: x
      texte: content
    - id: y
      texte: effrayé
    - id: z
      texte: fatigué
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Repère d'abord le mot qui ressemble le plus à son équivalent français.
    methode: « tired » ressemble un peu à un mot que tu connais peut-être déjà en sport.
    etape: '« happy » est le mot le plus simple à reconnaitre : associe-le d''abord à « content ».'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre « effrayé » et « fatigué ».
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un en pensant à une situation où tu ressens cette émotion.
  solution: happy = content ; scared = effrayé ; tired = fatigué.
- id: deception
  type: choix
  difficulte: 1
  enonce: Ton équipe vient de perdre le match. Quelle exclamation anglaise exprime ta déception ?
  reponse:
    options:
    - id: a
      texte: Oh no!
    - id: b
      texte: Wow!
    - id: c
      texte: Hello!
    bonnes:
    - a
  indices:
    relance: Es-tu surpris, content, ou déçu quand ton équipe perd ?
    methode: Cherche l'exclamation qui montre qu'une chose ne s'est pas passée comme tu voulais.
    etape: La bonne exclamation contient le mot « no ».
  pieges:
  - si:
      contient:
      - b
    relance: « Wow! » exprime plutôt la surprise ou l'admiration, pas la déception.
  - si:
      contient:
      - c
    relance: « Hello! » sert à saluer quelqu'un, pas à exprimer une émotion.
  solution: « Oh no! » exprime la déception ou l'inquiétude.
- id: situation-reaction
  type: association
  difficulte: 2
  enonce: Associe chaque situation à la réaction anglaise qui convient.
  reponse:
    gauche:
    - id: a
      texte: Tu ouvres un cadeau surprise.
    - id: b
      texte: Tu te cognes le pied contre la table.
    - id: c
      texte: 'Il pleut : la sortie au parc est annulée.'
    droite:
    - id: x
      texte: Wow!
    - id: y
      texte: Ouch!
    - id: z
      texte: Oh no!
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Dans quelle situation as-tu mal ?
    methode: 'Pense à l''émotion de chaque situation : surprise, douleur, déception.'
    etape: Le cadeau surprise donne une émotion de surprise et d'admiration.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle des réactions sert quand on a mal ?
  - si:
      diagnostic: associations_fausses
    relance: Nomme d'abord l'émotion de chaque situation, puis cherche l'exclamation qui la montre.
  solution: Cadeau surprise = Wow! ; pied cogné = Ouch! ; sortie annulée = Oh no!
- id: reagir-ami-triste
  type: choix
  difficulte: 2
  enonce: Ton ami te dit « I am sad. » Que réponds-tu gentiment ?
  reponse:
    options:
    - id: a
      texte: Oh, I'm sorry.
    - id: b
      texte: Great!
    - id: c
      texte: Wow!
    bonnes:
    - a
  indices:
    relance: Comment se sent ton ami ? Que lui dirais-tu en français ?
    methode: Cherche la formule qui veut dire « je suis désolé ».
    etape: La bonne formule contient le mot « sorry ».
  pieges:
  - si:
      contient:
      - b
    relance: « Great! » veut dire « super ! ». Ce n'est pas gentil quand ton ami est triste.
  - si:
      contient:
      - c
    relance: « Wow! » montre la surprise ou l'admiration, pas de la gentillesse pour un ami triste.
  solution: '« Oh, I''m sorry. » veut dire « oh, je suis désolé » : c''est une réaction gentille.'
- id: dire-triste
  type: texte_court
  difficulte: 3
  enonce: 'Complète en anglais pour dire que tu es triste : « I am ... ». Écris seulement le mot qui manque.'
  reponse:
    acceptees:
    - sad
    - i am sad
    fautes_tolerees: 0
  indices:
    relance: C'est le contraire de « happy ».
    methode: Après « I am », on met l'adjectif qui dit l'émotion.
    etape: Le mot a trois lettres et commence par « s ».
  pieges:
  - si:
      valeur: happy
    relance: « happy » veut dire « content ». Toi, tu cherches le mot pour « triste ».
  - si:
      valeur: tired
    relance: « tired » veut dire « fatigué ». Toi, tu cherches le mot pour « triste ».
  - si:
      valeur: scared
    relance: « scared » veut dire « effrayé ». Toi, tu cherches le mot pour « triste ».
  solution: On dit « I am sad. » (je suis triste).
- id: rituel-humeur
  type: ouverte
  difficulte: 3
  enonce: Au début de la journée, on te demande « How are you today? ». Réponds en anglais avec ton émotion, puis ajoute une
    exclamation. Ensuite, pose la même question à quelqu'un et réagis à sa réponse.
  criteres:
  - L'élève dit son émotion avec « I am » suivi d'un adjectif (happy, sad, tired, scared).
  - L'élève utilise au moins une exclamation ou onomatopée anglaise (Wow!, Oh no!, Ouch!, Great!).
  - L'élève pose la question « How are you? » et réagit à la réponse de l'autre (Great! ou Oh, I'm sorry.).
  indices:
    relance: Comment te sens-tu aujourd'hui ?
    methode: Commence par « I am », ajoute ton émotion, puis pose la question à ton tour.
    etape: Par exemple, commence par « I am happy! ».
  solution: 'Exemple : « I am happy! Wow, it''s sunny! How are you? » — « I am tired. » — « Oh, I''m sorry. »'
