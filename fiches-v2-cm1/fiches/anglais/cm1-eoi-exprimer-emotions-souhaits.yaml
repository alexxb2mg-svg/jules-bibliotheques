format: 2
notion: cm1-eoi-exprimer-emotions-souhaits
version: 1
etat: verifiee
declencheurs:
- dire qu'on est content ou fatigué en anglais
- réagir à une bonne nouvelle en anglais
- dire aïe ou super en anglais
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
- cm1-eoi-echanger-informations
couverture: Cette fiche porte sur exprimer des émotions simples et réagir avec des mots ou des onomatopées. Elle ne couvre
  pas l'échange d'informations factuelles (voir « échanger des informations »).
essentiel: 'Pour dire comment tu te sens en anglais, tu utilises « I am » suivi d''un adjectif : « I am happy »

  (je suis content), « I am tired » (je suis fatigué), « I am scared » (j''ai peur).

  Tu peux aussi utiliser des petites exclamations toutes faites pour réagir, comme « Wow! » (pour

  la surprise) ou « Oh no! » (pour la déception).

  Certaines onomatopées anglaises sont différentes du français, par exemple « Ouch! » pour dire

  « aïe ! » quand on a mal.

  '
methode:
- 'Choisis d''abord l''émotion que tu ressens : content, triste, fatigué, effrayé...'
- Utilise « I am » suivi de l'adjectif qui correspond à cette émotion.
- Pour réagir vite à une situation, utilise une exclamation toute faite comme « Wow! » ou « Ouch! ».
vocabulaire:
- terme: I am happy
  definition: je suis content
- terme: I am scared
  definition: j'ai peur
- terme: Wow!
  definition: exclamation de surprise
- terme: Ouch!
  definition: exclamation de douleur, comme « aïe ! »
erreurs_frequentes:
- Utiliser « Aïe ! » à la française au lieu de l'onomatopée anglaise « Ouch! ».
- Confondre « happy » (content) et « scared » (effrayé), qui expriment des émotions opposées.
exemple:
  enonce: Tu te fais mal au doigt en jouant. Que dis-tu en anglais pour réagir ?
  solution: 'Tu dis « Ouch! » : c''est l''onomatopée anglaise pour exprimer une douleur soudaine.'
exercices:
- id: dire-content
  type: choix
  difficulte: 1
  enonce: Comment dis-tu « je suis content » en anglais ?
  reponse:
    options:
    - id: a
      texte: I am happy
    - id: b
      texte: I am scared
    - id: c
      texte: I am tired
    bonnes:
    - a
  indices:
    relance: Ce mot ressemble au mot anglais qui veut dire heureux.
    methode: « scared » et « tired » ne correspondent pas à la joie.
    etape: Le bon adjectif commence par la lettre H.
  pieges:
  - si:
      contient:
      - b
    relance: « scared » veut dire « effrayé », pas « content ».
  - si:
      contient:
      - c
    relance: « tired » veut dire « fatigué », pas « content ».
  solution: « I am happy » signifie « je suis content ».
- id: onomatopee-douleur
  type: texte_court
  difficulte: 1
  enonce: Quelle onomatopée anglaise dit-on quand on se fait mal, à la place de « aïe » ?
  reponse:
    acceptees:
    - ouch
    fautes_tolerees: 1
  indices:
    relance: Ce mot très court commence par la lettre O.
    methode: Pense au mot que disent les personnages anglais quand ils se cognent.
    etape: Le mot rime avec « pouch ».
  pieges:
  - si:
      valeur: aie
    relance: « Aïe » est le mot français. Quel est le mot anglais équivalent ?
  solution: « Ouch! » est l'onomatopée anglaise pour la douleur.
- id: association-emotions
  type: association
  difficulte: 2
  enonce: Associe chaque adjectif anglais à l'émotion qu'il exprime.
  reponse:
    gauche:
    - id: a
      texte: happy
    - id: b
      texte: scared
    - id: c
      texte: tired
    droite:
    - id: x
      texte: content
    - id: y
      texte: effrayé
    - id: z
      texte: fatigué
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Repère d'abord le mot qui ressemble le plus à son équivalent français.
    methode: « tired » ressemble un peu à un mot que tu connais peut-être déjà en sport.
    etape: '« happy » est le mot le plus simple à reconnaitre : associe-le d''abord à « content ».'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre « effrayé » et « fatigué ».
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un en pensant à une situation où tu ressens cette émotion.
  solution: happy = content ; scared = effrayé ; tired = fatigué.
