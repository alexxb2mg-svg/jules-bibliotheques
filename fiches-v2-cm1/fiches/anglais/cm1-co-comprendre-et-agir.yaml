# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-co-comprendre-et-agir
version: 2
etat: verifiee
declencheurs:
- faire ce que dit une consigne en anglais
- suivre les règles d'un jeu expliqué en anglais
- comprendre une recette de cuisine en anglais
- comprendre stand up et sit down
- que veut dire you can't
- comprendre in on under
- dessiner ce qu'on entend en anglais
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
- cm1-co-comprendre-message-oral-court
couverture: Cette fiche porte sur la compréhension de consignes pour agir (jeux, recettes, tâches). Elle ne couvre pas la
  compréhension générale de messages oraux (voir « comprendre un message oral court »).
essentiel: 'Comprendre et agir, c''est écouter une consigne courte en anglais, puis FAIRE ce qu''elle demande. Tu n''as pas
  besoin de traduire chaque mot : tu cherches ce qu''il faut faire, et où.


  Les consignes utilisent souvent l''impératif : la phrase commence directement par le verbe d''action. En classe, tu entends
  « Stand up! » (lève-toi), « Sit down! » (assieds-toi), « Open your book. » (ouvre ton livre), « Listen! » (écoute). On les
  retrouve dans les règles d''un jeu (« Jump! », saute) ou dans les étapes d''une recette (« Cut the apple. », coupe la pomme).


  Le petit mot « can » t''indique ce qui est permis ou possible : « You can jump. » veut dire « tu peux sauter ». Avec « can''t
  », c''est le contraire : « You can''t run here. » veut dire « tu ne peux pas courir ici ». Une consigne qui commence par
  « Don''t » est aussi une interdiction : « Don''t talk! » (ne parle pas).


  Les mots de lieu te disent où placer un objet ou où aller : « in » (dans), « on » (sur), « under » (sous). Par exemple :
  « Put the ball under the chair. » (mets le ballon sous la chaise).


  Pour comprendre, tu t''aides aussi des mots de ton environnement : la famille, l''école, les loisirs, la météo. Si tu entends
  « It''s raining. Take your umbrella! », le mot « raining » (il pleut) t''aide à comprendre pourquoi il faut prendre ton
  parapluie. Souvent, tu montres que tu as compris en agissant ou en choisissant la bonne image.

  '
methode:
- Écoute la consigne en entier avant d'agir.
- 'Repère le verbe d''action au début de la phrase : il te dit ce qu''il faut faire.'
- Repère l'objet dont on parle (book, pencil, ball...) et sa couleur s'il y en a une.
- Repère le mot de lieu (in, on, under) si la consigne parle d'un endroit.
- Si tu entends « can », « can't » ou « Don't », demande-toi si c'est permis ou interdit.
- Fais l'action, puis vérifie qu'elle correspond bien à ce que tu as entendu.
vocabulaire:
- terme: in
  definition: dans
- terme: 'on'
  definition: sur
- terme: under
  definition: sous
- terme: can
  definition: 'pouvoir : avoir le droit ou être capable de faire quelque chose.'
- terme: can't
  definition: 'ne pas pouvoir : ce n''est pas permis ou pas possible.'
- terme: impératif
  definition: la forme du verbe pour donner une consigne ou un ordre (Sit down!).
erreurs_frequentes:
- Confondre les mots de lieu « in », « on » et « under ».
- Ne pas repérer le verbe d'action principal dans une consigne.
- Confondre « can » (on peut) et « can't » (on ne peut pas).
- 'Mélanger les couleurs et les objets : dans « red pencil », c''est le crayon qui est rouge.'
- Agir avant d'avoir écouté la consigne jusqu'au bout.
exemple:
  enonce: Le professeur dit « Put your pencil on the table. » Que dois-tu faire ?
  solution: Le verbe d'action est « Put » (mets, pose). L'objet est « your pencil » (ton crayon). Le mot de lieu « on » veut
    dire « sur ». Tu poses donc ton crayon sur la table.
exercices:
- id: mot-sur
  type: choix
  difficulte: 1
  enonce: Quel mot anglais signifie « sur » ?
  reponse:
    options:
    - id: a
      texte: 'on'
    - id: b
      texte: in
    - id: c
      texte: under
    bonnes:
    - a
  indices:
    relance: Pense à un objet posé au-dessus d'une table, pas dedans ni dessous.
    methode: 'Il y a trois petits mots de lieu à ne pas confondre : dans, sur, sous.'
    etape: Élimine « in » (dans) et « under » (sous).
  pieges:
  - si:
      contient:
      - b
    relance: « in » veut dire « dans ». Quel est le mot pour « sur » ?
  - si:
      contient:
      - c
    relance: « under » veut dire « sous ». Quel est le mot pour « sur » ?
  solution: « on » signifie « sur ».
- id: association-lieux
  type: association
  difficulte: 1
  enonce: Associe chaque mot anglais de lieu à sa traduction.
  reponse:
    gauche:
    - id: a
      texte: in
    - id: b
      texte: 'on'
    - id: c
      texte: under
    droite:
    - id: x
      texte: dans
    - id: y
      texte: sur
    - id: z
      texte: sous
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Imagine un crayon : dans la trousse, sur la table, sous la table.'
    methode: Associe chaque mot à une image mentale simple.
    etape: '« in » va avec « dans » : commence par cette paire.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre « sur » et « sous ».
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un avec une image mentale (dans, sur, sous).
  solution: in = dans ; on = sur ; under = sous.
- id: comprendre-consigne-jeu
  type: choix
  difficulte: 2
  enonce: Dans un jeu, tu entends « You can jump three times. » Que comprends-tu ?
  reponse:
    options:
    - id: a
      texte: Tu as le droit de sauter trois fois
    - id: b
      texte: Tu dois obligatoirement sauter trois fois
    - id: c
      texte: Tu ne peux pas sauter
    bonnes:
    - a
  indices:
    relance: Le mot « can » exprime-t-il une obligation ou une possibilité ?
    methode: « can » indique que tu as la capacité ou le droit de faire quelque chose, pas une obligation.
    etape: « can jump » veut dire « peux sauter », pas « dois sauter ».
  pieges:
  - si:
      contient:
      - b
    relance: « can » n'exprime pas une obligation, mais une possibilité ou une autorisation.
  - si:
      contient:
      - c
    relance: '« can » est une forme positive : elle exprime bien une capacité, pas une interdiction.'
  solution: '« can » exprime une capacité ou une autorisation : tu as le droit de sauter trois fois.'
- id: consignes-de-classe
  type: association
  difficulte: 1
  enonce: Associe chaque consigne de classe à l'action qu'elle demande.
  reponse:
    gauche:
    - id: a
      texte: Stand up!
    - id: b
      texte: Sit down!
    - id: c
      texte: Open your book.
    droite:
    - id: x
      texte: se lever
    - id: y
      texte: s'asseoir
    - id: z
      texte: ouvrir son livre
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Quelle consigne parle d'un objet de ta trousse ou de ton cartable ?
    methode: « up » fait penser au haut, « down » fait penser au bas.
    etape: '« Open your book » contient le mot « book » : c''est le livre.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à « up » (vers le haut) et « down » (vers le bas).
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque consigne en cherchant d'abord le mot que tu connais (book, up, down).
  solution: Stand up! = se lever ; Sit down! = s'asseoir ; Open your book. = ouvrir son livre.
- id: fermer-la-porte
  type: texte_court
  difficulte: 2
  enonce: 'Le professeur veut que tu fermes la porte. Complète sa consigne en anglais : « ... the door, please. »'
  reponse:
    acceptees:
    - close
    fautes_tolerees: 1
  indices:
    relance: Quel est le contraire de « open » (ouvrir) ?
    methode: Une consigne commence par le verbe d'action, sans sujet devant.
    etape: C'est aussi le verbe pour refermer ton livre à la fin de la leçon.
  pieges:
  - si:
      valeur: open
    relance: « Open » veut dire « ouvrir ». Ici, il faut fermer la porte.
  solution: On dit « Close the door, please. » (ferme la porte, s'il te plait).
- id: interdiction
  type: choix
  difficulte: 2
  enonce: Tu entends « You can't run in the classroom. » Que comprends-tu ?
  reponse:
    options:
    - id: a
      texte: Tu n'as pas le droit de courir dans la classe
    - id: b
      texte: Tu dois courir dans la classe
    - id: c
      texte: Tu peux courir dans la classe
    bonnes:
    - a
  indices:
    relance: Le mot « can't » est-il pareil que « can » ?
    methode: « can » veut dire « peux » ; « can't » veut dire le contraire.
    etape: '« can''t » = « ne peux pas » : la phrase exprime une interdiction.'
  pieges:
  - si:
      contient:
      - b
    relance: Rien dans la phrase ne t'oblige à courir. Regarde bien la fin du mot « can ».
  - si:
      contient:
      - c
    relance: '« can''t » n''est pas « can » : la petite fin « ''t » change le sens.'
  solution: '« You can''t run » veut dire « tu ne peux pas courir » : c''est une interdiction.'
- id: recette-banane
  type: ordre
  difficulte: 2
  enonce: Voici une recette en anglais. Range les étapes dans l'ordre.
  reponse:
    elements:
    - id: prendre
      texte: First, take two bananas.
    - id: couper
      texte: Then, cut the bananas.
    - id: bol
      texte: Put the pieces in a bowl.
    - id: manger
      texte: Finally, eat!
  indices:
    relance: 'Que fais-tu en tout premier dans une recette : couper, ou prendre les ingrédients ?'
    methode: Repère les mots « First » (d'abord), « Then » (ensuite) et « Finally » (enfin).
    etape: L'étape qui commence par « First » vient en premier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Peut-on mettre les morceaux (pieces) dans le bol avant de couper les bananes
      ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord « First » (début) et « Finally » (fin), puis place les deux autres étapes.
  solution: First, take two bananas. → Then, cut the bananas. → Put the pieces in a bowl. → Finally, eat!
- id: bonne-image
  type: choix
  difficulte: 3
  enonce: Tu entends « Put the red pencil in the blue box. » Quelle image correspond à la consigne ?
  reponse:
    options:
    - id: a
      texte: Un crayon rouge dans une boite bleue
    - id: b
      texte: Un crayon bleu dans une boite rouge
    - id: c
      texte: Un crayon rouge posé sur une boite bleue
    bonnes:
    - a
  indices:
    relance: Quelle couleur va avec le crayon, et laquelle avec la boite ?
    methode: En anglais, la couleur se place juste avant l'objet. Puis vérifie le mot de lieu.
    etape: « red pencil » = crayon rouge. Il reste à trouver la couleur de la boite et le mot de lieu.
  pieges:
  - si:
      contient:
      - b
    relance: 'Regarde à quel mot est collée chaque couleur : « red pencil », « blue box ».'
  - si:
      contient:
      - c
    relance: Le mot de lieu n'est pas « on » (sur). Écoute-le encore.
  solution: « red pencil » = crayon rouge, « blue box » = boite bleue, « in » = dans.
- id: donner-des-consignes
  type: ouverte
  difficulte: 3
  enonce: 'Joue au jeu des consignes avec quelqu''un de ta famille : donne-lui trois consignes en anglais (se lever, s''asseoir,
    poser un objet quelque part), puis vérifie qu''il les a bien faites.'
  criteres:
  - Les trois consignes sont en anglais et commencent par un verbe d'action (Stand up, Sit down, Put...).
  - Au moins une consigne utilise un mot de lieu (in, on, under).
  - L'élève vérifie que chaque action réalisée correspond à sa consigne.
  indices:
    relance: Quelles consignes entends-tu souvent en classe ?
    methode: Commence chaque consigne par le verbe, puis ajoute un objet et un mot de lieu si besoin.
    etape: Par exemple, commence par « Stand up! ».
  solution: 'Exemple : « Stand up! » « Sit down! » « Put the spoon on the table. »'
- id: nblm-quelle-forme-verbale-utilise-t-on-le-plu-1
  type: choix
  difficulte: 2
  enonce: Quelle forme verbale utilise-t-on le plus souvent en anglais pour donner une consigne de classe directe comme «
    Stand up ! » ou « Take a pencil ! » ?
  reponse:
    options:
    - id: o1
      texte: L'impératif
    - id: o2
      texte: Le futur
    - id: o3
      texte: Le passé composé
    - id: o4
      texte: Le conditionnel
    bonnes:
    - o1
  indices:
    relance: Pense au mode verbal qu'on utilise pour donner une instruction directe sans mettre de pronom sujet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges: []
  solution: L'impératif. C'est exact ! Les consignes orales en anglais utilisent l'impératif pour indiquer directement l'action
    à réaliser sans sujet devant le verbe.
- id: nblm-dans-les-regles-d-un-jeu-expliquees-en-a-2
  type: choix
  difficulte: 2
  enonce: Dans les règles d'un jeu expliquées en anglais, si l'animateur dit « Put the card ON the box », où dois-tu poser
    la carte ?
  reponse:
    options:
    - id: o1
      texte: Sur la boîte
    - id: o2
      texte: Dans la boîte
    - id: o3
      texte: Sous la boîte
    - id: o4
      texte: À côté de la boîte
    bonnes:
    - o1
  indices:
    relance: Réfléchis au sens du mot de lieu « on » quand on parle de la surface d'un objet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre « on » (sur) avec « in » (dans).'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre « on » (sur) avec « under » (sous).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : méconnaître le sens des prépositions de lieu principales du programme (« in », « on », « under
      »).'
  solution: Sur la boîte. C'est juste ! Le mot de lieu « on » indique que l'objet doit être posé sur la surface de la boîte.
- id: nblm-si-tu-ecoutes-ou-lis-les-etapes-d-une-re-3
  type: choix
  difficulte: 2
  enonce: Si tu écoutes ou lis les étapes d'une recette de cuisine en anglais et qu'on te dit « Cut the apple », quelle action
    dois-tu effectuer ?
  reponse:
    options:
    - id: o1
      texte: Couper la pomme
    - id: o2
      texte: Mélanger la pomme
    - id: o3
      texte: Mettre la pomme dans le bol
    - id: o4
      texte: Laver la pomme
    bonnes:
    - o1
  indices:
    relance: Cherche la traduction française du verbe d'action « cut ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre le verbe « cut » (couper) avec le verbe « mix » (mélanger).'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre le verbe « cut » (couper) avec le verbe « put » (mettre).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : deviner une action possible au lieu d''identifier la traduction du verbe « cut ».'
  solution: Couper la pomme. Bravo ! Le verbe d'action « cut » signifie « couper » et indique l'action précise à réaliser.
- id: nblm-dans-une-consigne-ou-la-regle-d-un-jeu-e-4
  type: choix
  difficulte: 2
  enonce: Dans une consigne ou la règle d'un jeu en anglais, que signifie le mot « can » quand tu l'entends ?
  reponse:
    options:
    - id: o1
      texte: Il indique la capacité ou l'autorisation de faire quelque chose
    - id: o2
      texte: Il indique une interdiction absolue de jouer
    - id: o3
      texte: Il indique qu'il faut poser un objet sous la table
    - id: o4
      texte: Il désigne le nom d'un ustensile de cuisine
    bonnes:
    - o1
  indices:
    relance: Pense au verbe français qui exprime la possibilité ou l'autorisation (« pouvoir »).
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre l''autorisation ou la capacité (« can ») avec une interdiction.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre le verbe modal « can » avec une préposition de lieu comme « under ».'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre le verbe modal « can » avec un nom d''objet.'
  solution: Il indique la capacité ou l'autorisation de faire quelque chose. Exact ! Le mot « can » permet d'exprimer la capacité
    ou le droit/l'autorisation d'effectuer une action.
- id: nblm-pour-bien-comprendre-et-executer-une-con-5
  type: choix
  difficulte: 2
  enonce: Pour bien comprendre et exécuter une consigne orale en anglais sans se bloquer, quel est le premier élément essentiel
    à repérer dans la phrase ?
  reponse:
    options:
    - id: o1
      texte: Le verbe d'action principal
    - id: o2
      texte: Chaque mot un par un en traduisant tout dans sa tête
    - id: o3
      texte: Seulement le tout dernier mot de la phrase
    - id: o4
      texte: Le prénom de la personne qui parle
    bonnes:
    - o1
  indices:
    relance: C'est le mot clé qui indique l'action à faire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : chercher à tout traduire mot à mot au lieu de repérer l''action principale.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : ignorer le verbe au début de la consigne et se focaliser uniquement sur la fin.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : chercher un mot d''identification au lieu de repérer l''ordre ou l''instruction.'
  solution: Le verbe d'action principal. C'est la bonne méthode ! Le verbe d'action te dit immédiatement quelle tâche tu dois
    accomplir.
- id: nblm-quels-sont-les-deux-mots-de-lieu-en-angl-6
  type: choix
  difficulte: 3
  enonce: Quels sont les deux mots de lieu en anglais qui permettent de savoir exactement où placer un objet ou où se positionner
    dans une consigne ? (Choisis 2 réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: in
    - id: o2
      texte: under
    - id: o3
      texte: jump
    - id: o4
      texte: stand
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux mots de lieu qui se traduisent par « dans » et « sous ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « jump » est un verbe d''action (sauter), pas une préposition de lieu.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « stand » est un verbe d''action (se tenir debout), pas un mot de positionnement.'
  solution: in ; under. Exact ! « In » est un mot de lieu essentiel qui signifie « dans ».
- id: nblm-en-anglais-quel-mot-de-lieu-faut-il-util-7
  type: texte_court
  difficulte: 1
  enonce: En anglais, quel mot de lieu faut-il utiliser dans une consigne pour dire de poser un objet « sous » la table ?
  reponse:
    acceptees:
    - under
    fautes_tolerees: 1
  indices:
    relance: Ce mot anglais de 5 lettres commence par un « u » et signifie « sous ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: under. Bravo ! « Under » est le mot de lieu exact pour dire « sous ».
- id: nblm-dans-une-recette-de-cuisine-en-anglais-q-8
  type: texte_court
  difficulte: 1
  enonce: Dans une recette de cuisine en anglais, quel verbe à l'impératif signifie « mélanger » les ingrédients ?
  reponse:
    acceptees:
    - mix
    fautes_tolerees: 1
  indices:
    relance: Ce verbe court de 3 lettres commence par la lettre « m » et finit par « x ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: mix. C'est exact ! « Mix » est le verbe d'action qui signifie « mélanger ».
