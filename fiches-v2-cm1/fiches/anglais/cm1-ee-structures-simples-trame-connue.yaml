format: 2
notion: cm1-ee-structures-simples-trame-connue
version: 2
etat: verifiee
declencheurs:
- écrire une carte postale en anglais
- décrire un objet familier en anglais à l'écrit
- écrire une phrase sur soi avec le présent simple
- écrire un petit message électronique en anglais
- postcard
- Dear Grandma
- See you soon
- write an email
- my bike is blue
prerequis:
- cm1-ee-raconter
essentiel: 'Écrire en anglais en s''appuyant sur une trame connue, c''est reprendre un modèle déjà vu en classe et changer
  seulement quelques mots. Le modèle te donne la structure de la phrase. Tu la remplis avec tes propres idées.


  Pour parler de toi, des autres ou d''un personnage réel ou imaginaire, tu utilises le présent simple. Avec « I », « you
  », « we » et « they », le verbe garde sa forme de base : « I like dogs » (j''aime les chiens). Avec « he », « she », « it
  » ou un prénom, on ajoute un « s » au verbe : « She likes cats », « Tom plays football ».


  Pour décrire un objet ou un lieu familier, tu nommes la chose puis tu ajoutes un ou deux mots simples, comme une couleur
  ou une taille : « My bike is blue. » « My school is big and old. » Pour un objet déjà nommé, tu peux écrire « It is... »
  (il est, elle est).


  Les articles se placent devant le nom. On écrit « a » ou « an » devant un nom au singulier : « a house », « an apple ».
  « An » se met devant un mot qui commence par une voyelle. Au pluriel, on ne met pas « a » : « two houses ».


  Pour écrire un courrier à un proche (carte postale, message électronique court, lettre), on suit toujours le même modèle
  avec des blocs tout faits. On commence par une formule (« Dear Sam, » ou « Hi Sam, »), on écrit quelques phrases simples,
  puis on finit par une formule (« Love, » ou « See you soon, ») et sa signature.


  Exemple de carte postale : « Dear Grandma, I am in London. It is rainy. I like the parks. Love, Léa. »

  '
methode:
- Relis le modèle connu (carte postale, message, description) et repère les mots que tu peux changer.
- Choisis de qui ou de quoi tu parles, puis écris le sujet de ta phrase.
- Écris le verbe au présent simple et ajoute un « s » seulement avec « he », « she », « it » ou un prénom.
- Mets « a » ou « an » devant un nom au singulier (« an » devant une voyelle).
- Pour décrire, ajoute un ou deux mots simples déjà appris (couleur, taille).
- Pour un courrier, vérifie que tu as la formule du début, ton message, la formule de fin et ta signature.
vocabulaire:
- terme: présent simple
  definition: le temps qu'on utilise pour dire ce qu'on aime, ce qu'on fait souvent ou comment sont les choses.
- terme: a / an
  definition: un ou une, devant un nom au singulier (« an » devant une voyelle).
- terme: he likes / she likes
  definition: il aime / elle aime (le verbe prend un « s »).
- terme: It is...
  definition: il est... ou elle est..., pour décrire un objet ou un lieu.
- terme: Dear... / Hi...
  definition: cher ou chère... / salut..., pour commencer un courrier.
- terme: Love, / See you soon,
  definition: je t'embrasse / à bientôt, pour finir un courrier avant de signer.
- terme: postcard
  definition: une carte postale, qu'on envoie souvent pendant les vacances.
erreurs_frequentes:
- Oublier le « s » du verbe avec « he », « she », « it » ou un prénom (« she like » au lieu de « she likes »).
- Ajouter un « s » au verbe avec « I » ou « they » (« I likes » au lieu de « I like »).
- Utiliser « a » devant un mot qui commence par une voyelle (« a apple » au lieu de « an apple »).
- Oublier la formule du début ou de la fin d'un courrier, ou oublier de signer.
- Écrire mot à mot comme en français au lieu de suivre le modèle connu.
exemple:
  enonce: En suivant le modèle « My friend Tom likes football. », écris une phrase pour dire que ton amie Lucy aime les chats.
  solution: « Lucy likes cats. » On garde la structure du modèle et on change seulement le prénom et ce qu'elle aime. Avec
    « Lucy » (comme « she »), le verbe « like » prend un « s » au présent simple. Au pluriel, « cats » n'a pas d'article.
exercices:
- id: accord-verbe-presente
  type: choix
  difficulte: 1
  enonce: Quelle phrase est correctement écrite au présent simple ?
  reponse:
    options:
    - id: a
      texte: She likes chocolate.
    - id: b
      texte: She like chocolate.
    - id: c
      texte: She liking chocolate.
    bonnes:
    - a
  indices:
    relance: Avec "she", le verbe au présent simple doit se terminer par une lettre en plus.
    methode: Avec "he", "she" ou "it", on ajoute un "s" à la fin du verbe au présent simple.
    etape: '"Like" devient "likes" avec "she".'
  pieges:
  - si:
      contient:
      - b
    relance: 'Il manque le "s" à la fin de "like" : avec "she", le verbe doit se terminer par "s".'
  - si:
      contient:
      - c
    relance: '"Liking" n''est pas la forme du présent simple ici. Il faut simplement ajouter un "s" à "like".'
  solution: '"She likes chocolate." est correcte : le verbe prend un "s" avec "she".'
- id: verbe-mon-frere
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase avec le verbe « play » au présent simple : « My brother ___ football. »'
  reponse:
    acceptees:
    - plays
    fautes_tolerees: 0
  indices:
    relance: Qui fait l'action ? Quel petit mot anglais pourrait remplacer « my brother » ?
    methode: Avec « he », « she » ou « it », le verbe au présent simple prend une lettre de plus à la fin.
    etape: « My brother » se remplace par « he ». Pense à ce que devient « like » avec « he » dans la leçon.
  pieges:
  - si:
      valeur: play
    relance: Avec « I » ou « they », ce serait juste. Mais ici, c'est « my brother », comme « he ». Que manque-t-il ?
  - si:
      valeur: playing
    relance: Cette forme n'est pas celle du présent simple ici. Garde le verbe de base et ajoute seulement une lettre.
  solution: « My brother plays football. » « My brother » = « he », donc le verbe « play » prend un « s ».
- id: article-correct
  type: texte_court
  difficulte: 2
  enonce: 'Complète : "I have ___ apple." (j''ai une pomme). Quel article manque ?'
  reponse:
    acceptees:
    - an
    fautes_tolerees: 0
  indices:
    relance: Le mot "apple" commence par une voyelle.
    methode: 'Devant un mot qui commence par une voyelle, on n''utilise pas "a" : il faut une autre forme, avec un "n" en
      plus.'
    etape: '"Apple" commence par la lettre "a", qui est une voyelle.'
  pieges:
  - si:
      valeur: a
    relance: '"A" se met devant une consonne. "Apple" commence par une voyelle : il faut une autre forme.'
  solution: 'L''article manquant est "an" : "I have an apple.".'
- id: verbe-etre-description
  type: texte_court
  difficulte: 2
  enonce: 'Tu décris ta chambre. Complète avec le verbe être : « My bedroom ___ small and blue. »'
  reponse:
    acceptees:
    - is
    fautes_tolerees: 0
  indices:
    relance: Ta chambre, c'est une seule chose. Quel petit mot anglais pourrait la remplacer ?
    methode: Avec « I », le verbe être fait « am ». Avec « he », « she » ou « it », il a une autre forme de deux lettres.
    etape: '« My bedroom » se remplace par « it ». Relis la phrase modèle de la leçon : « My bike ... blue. »'
  pieges:
  - si:
      valeur: are
    relance: Cette forme va avec « you », « we » ou « they ». Ici, il n'y a qu'une seule chambre.
  - si:
      valeur: am
    relance: Cette forme va seulement avec « I ». Ici, on parle de ta chambre, pas de toi.
  solution: « My bedroom is small and blue. » Pour une seule chose (« it »), le verbe être fait « is ».
- id: ordre-carte-postale
  type: ordre
  difficulte: 2
  enonce: Range ces éléments d'une carte postale dans l'ordre logique.
  reponse:
    elements:
    - id: a
      texte: Dear Sam,
    - id: b
      texte: I am on holiday in Spain. The weather is sunny.
    - id: c
      texte: See you soon, Léa
  indices:
    relance: Quel élément ouvre toujours une carte postale, et lequel la termine avec une signature ?
    methode: 'Une carte postale suit toujours le même modèle : formule d''ouverture, message, formule de fin.'
    etape: '"Dear Sam," est la formule qui ouvre la carte postale.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux éléments voisins sont inversés. Lequel contient le message, et lequel contient la signature ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par la formule d'ouverture, puis le message, puis la formule de fin avec la signature.
  solution: D'abord "Dear Sam,", puis "I am on holiday in Spain. The weather is sunny.", puis "See you soon, Léa".
- id: association-objets-lieux
  type: association
  difficulte: 2
  enonce: Associe chaque objet ou lieu familier à sa description en anglais.
  reponse:
    gauche:
    - id: a
      texte: My house
    - id: b
      texte: My bike
    - id: c
      texte: My school
    droite:
    - id: x
      texte: It is white and small.
    - id: y
      texte: It is blue and fast.
    - id: z
      texte: It is big and old.
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par l''objet qui a des roues : c''est souvent décrit comme rapide.'
    methode: Chaque objet ou lieu a une description avec deux adjectifs simples.
    etape: '"My bike" (mon vélo) est souvent décrit comme "blue and fast" (bleu et rapide).'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère la description de l'école.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le vélo, rapide, puis distingue la maison et l'école.
  solution: '"My house" = blanche et petite ; "My bike" = bleu et rapide ; "My school" = grande et ancienne.'
- id: formule-debut-courrier
  type: choix
  difficulte: 2
  enonce: Tu écris un message électronique à ta grand-mère. Quelle formule choisis-tu pour COMMENCER ton message ?
  reponse:
    options:
    - id: a
      texte: Dear Grandma,
    - id: b
      texte: Love,
    - id: c
      texte: See you soon,
    bonnes:
    - a
  indices:
    relance: Parmi ces formules, lesquelles servent plutôt à terminer un courrier, juste avant la signature ?
    methode: 'Rappelle-toi le modèle du courrier : une formule pour saluer la personne, le message, une formule pour dire
      au revoir.'
    etape: La bonne formule contient le nom de la personne à qui tu écris.
  pieges:
  - si:
      contient:
      - b
    relance: Cette formule veut dire « je t'embrasse ». On l'écrit à la fin, juste avant de signer.
  - si:
      contient:
      - c
    relance: Cette formule veut dire « à bientôt ». On l'écrit plutôt à la fin du message.
  solution: « Dear Grandma, » (chère mamie) ouvre le message. « Love, » et « See you soon, » servent à le terminer, avant
    la signature.
- id: deux-phrases-correctes
  type: choix
  difficulte: 3
  enonce: Coche les DEUX phrases correctement écrites au présent simple.
  reponse:
    options:
    - id: a
      texte: He has a dog.
    - id: b
      texte: He have a dog.
    - id: c
      texte: I likes pizza.
    - id: d
      texte: We play in the park.
    bonnes:
    - a
    - d
  indices:
    relance: Pour chaque phrase, regarde d'abord le sujet, puis la fin du verbe.
    methode: Avec « I », « you », « we », « they », le verbe garde sa forme de base. Avec « he », « she », « it », il change.
    etape: Avec « he », le verbe « have » change de forme (comme « like » qui prend un « s »). Avec « I », le verbe ne prend
      pas de « s ».
  pieges:
  - si:
      contient:
      - b
    relance: Avec « he », le verbe « have » ne garde pas sa forme de base. Que devient-il ?
  - si:
      contient:
      - c
    relance: Avec « I », le verbe garde sa forme de base, sans « s ».
  solution: « He has a dog. » (avec « he », « have » devient « has ») et « We play in the park. » (avec « we », forme de base).
    « He have » et « I likes » sont fausses.
- id: carte-postale-a-un-proche
  type: ouverte
  difficulte: 3
  enonce: 'Écris une petite carte postale en anglais à un proche (ami, grand-parent, cousin). Suis le modèle : une formule
    de début, trois phrases simples sur toi, un lieu ou une activité, une formule de fin et ta signature.'
  criteres:
  - La carte commence par une formule (« Dear... » ou « Hi... ») et finit par une formule (« Love, » ou « See you soon, »)
    suivie d'une signature.
  - Il y a au moins trois phrases simples au présent simple, avec le bon verbe (un « s » seulement avec « he », « she », «
    it » ou un prénom).
  - Au moins une phrase décrit un lieu ou un objet avec un mot simple (couleur, taille, temps qu'il fait), avec « a », « an
    » ou « the » bien utilisés.
  indices:
    relance: Où es-tu, qu'est-ce que tu vois, qu'est-ce que tu aimes ?
    methode: Reprends le modèle de la leçon et change seulement les noms, les lieux et les mots de description.
    etape: 'Commence ainsi : « Dear Grandma, I am in ... » puis ajoute deux phrases.'
  solution: 'Exemple possible : « Dear Grandma, I am at the beach with Mum. The sea is blue and the sand is hot. I play with
    my cousin Tom. He likes ice cream. See you soon, Léa. » On y trouve une formule de début, des phrases au présent simple
    (« He likes » avec un « s »), une description (« The sea is blue ») et une formule de fin avec la signature.'
