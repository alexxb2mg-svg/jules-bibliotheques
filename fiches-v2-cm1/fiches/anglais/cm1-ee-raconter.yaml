    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o1
    relance: 'Erreur fréquente : en anglais, contrairement au français, l''adjectif ne prend jamais de « s » au pluriel.'
  - si:
