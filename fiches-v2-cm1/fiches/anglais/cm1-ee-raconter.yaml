format: 2
notion: cm1-ee-raconter
version: 1
etat: verifiee
declencheurs:
- raconter une journée à l'écrit en anglais
- écrire la date du jour en anglais
- décrire un animal ou un objet en anglais avec un adjectif
- écrire plusieurs phrases simples à la suite en anglais
prerequis: []
couverture: Travaille l'écriture de quelques phrases simples juxtaposées pour raconter, nommer, caractériser ou situer dans
  le temps. Ne couvre pas encore les récits longs ni les temps du passé.
essentiel: 'Raconter à l''écrit en anglais, c''est écrire quelques phrases simples à la suite, avec des mots déjà connus.


  On peut nommer et décrire des personnes, des objets ou des lieux avec un adjectif : "a big dog" (un grand

  chien), "a red car" (une voiture rouge). L''adjectif se place avant le nom en anglais, et il ne change jamais

  de forme (pas d''accord comme en français).


  On peut compter simplement : "I have two brothers" (j''ai deux frères). On peut situer dans le temps en donnant

  la date du jour : "Today is Monday, the 3rd of March" (aujourd''hui, on est lundi 3 mars).


  Pour se présenter à l''écrit, on utilise des phrases simples toutes faites, mises l''une après l''autre : "My

  name is Léo. I am nine. I live in Paris."

  '
methode:
- Choisis des phrases simples et courtes que tu connais déjà, plutôt que d'inventer des structures compliquées.
- Place l'adjectif avant le nom qu'il décrit ("a big dog", pas "a dog big").
- Souviens-toi que l'adjectif anglais ne s'accorde jamais, même au pluriel ("two big dogs").
- Pour la date, donne le jour de la semaine puis le nombre du mois ("Monday, the 3rd of March").
- Juxtapose plusieurs phrases simples les unes après les autres pour raconter, sans les relier de façon compliquée.
vocabulaire:
- terme: big / small
  definition: grand / petit
- terme: Today is...
  definition: aujourd'hui, on est...
- terme: I have / I am
  definition: j'ai / je suis
erreurs_frequentes:
- Accorder l'adjectif anglais au pluriel comme en français ("reds cars" au lieu de "red cars").
- Placer l'adjectif après le nom comme en français ("a car red" au lieu de "a red car").
- Oublier de mettre une majuscule aux jours de la semaine et aux mois en anglais.
exemple:
  enonce: Écris une phrase pour décrire un chat noir et petit.
  solution: '"I have a small black cat." (j''ai un petit chat noir) : les adjectives "small" et "black" sont placés avant
    le nom "cat" et ne s''accordent pas.'
exercices:
- id: place-adjectif
  type: choix
  difficulte: 1
  enonce: Quelle phrase respecte la place de l'adjectif en anglais ?
  reponse:
    options:
    - id: a
      texte: I have a big dog.
    - id: b
      texte: I have a dog big.
    - id: c
      texte: I have a dogs big.
    bonnes:
    - a
  indices:
    relance: En anglais, l'adjectif se place toujours avant le nom qu'il décrit.
    methode: Compare la place de "big" par rapport à "dog" dans chaque phrase.
    etape: Dans la bonne phrase, "big" est placé juste avant "dog".
  pieges:
  - si:
      contient:
      - b
    relance: Ici l'adjectif "big" est placé après le nom, comme en français. En anglais, il se place avant.
  - si:
      contient:
      - c
    relance: Cette phrase place l'adjectif après le nom et ajoute un "s" à "dog" sans raison ici.
  solution: '"I have a big dog." place correctement l''adjectif "big" avant le nom "dog".'
- id: ecrire-la-date
  type: texte_court
  difficulte: 2
  enonce: 'Complète : "Today is Monday, the 3rd ___ March." (aujourd''hui, on est lundi 3 mars). Quel petit mot manque ?'
  reponse:
    acceptees:
    - of
    fautes_tolerees: 0
  indices:
    relance: C'est un tout petit mot de deux lettres qui relie le nombre du jour au nom du mois.
    methode: 'La structure de la date en anglais est : jour de la semaine, "the" + nombre + un petit mot de deux lettres +
      mois.'
    etape: Le mot manquant se place juste entre "3rd" et "March".
  pieges:
  - si:
      valeur: the
    relance: '"The" est déjà présent avant le nombre. Cherche le mot qui manque entre le nombre et le mois.'
  solution: 'Le mot manquant est "of" : "Today is Monday, the 3rd of March.".'
- id: ordre-presentation-ecrite
  type: ordre
  difficulte: 2
  enonce: Range ces phrases dans un ordre logique pour se présenter à l'écrit.
  reponse:
    elements:
    - id: a
      texte: My name is Léo.
    - id: b
      texte: I am nine years old.
    - id: c
      texte: I live in Paris.
  indices:
    relance: 'Quelle information donne-t-on en premier quand on se présente : son prénom, son âge, ou sa ville ?'
    methode: On commence en général par son prénom, puis on donne son âge, puis d'autres informations.
    etape: '"My name is Léo." est la phrase qui ouvre la présentation.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux phrases voisines sont inversées. Laquelle donne l'âge, et laquelle donne la ville ?
  - si:
      diagnostic: ordre_faux
    relance: 'Commence par le prénom, puis l''âge, puis la ville : c''est l''ordre le plus naturel.'
  solution: D'abord "My name is Léo.", puis "I am nine years old.", puis "I live in Paris.".
- id: association-adjectifs-contraires
  type: association
  difficulte: 2
  enonce: Associe chaque adjectif anglais à son contraire.
  reponse:
    gauche:
    - id: a
      texte: big
    - id: b
      texte: happy
    - id: c
      texte: old
    droite:
    - id: x
      texte: small
    - id: y
      texte: sad
    - id: z
      texte: young
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par l''adjectif le plus facile : le contraire de "big" (grand).'
    methode: Chaque adjectif a un seul contraire parmi les trois proposés.
    etape: '"Big" (grand) a pour contraire "small" (petit).'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère le contraire de "old" (vieux).
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord "big"/"small", puis distingue les deux autres paires.
  solution: '"big" ≠ "small" ; "happy" ≠ "sad" ; "old" ≠ "young".'
