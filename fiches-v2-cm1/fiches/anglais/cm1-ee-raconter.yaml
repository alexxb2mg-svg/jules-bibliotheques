# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-ee-raconter
version: 2
etat: verifiee
declencheurs:
- raconter une journée à l'écrit en anglais
- écrire la date du jour en anglais
- décrire un animal ou un objet en anglais avec un adjectif
- écrire plusieurs phrases simples à la suite en anglais
- today is monday
- a big dog
- three black cats
- i have two brothers
prerequis: []
essentiel: 'Raconter à l''écrit en anglais, c''est écrire quelques phrases simples à la suite. Tu utilises des phrases que
  tu connais déjà par cœur : c''est ton répertoire mémorisé. Tu peux raconter une chose vraie ou une histoire inventée.


  Pour te présenter, tu mets des phrases toutes faites l''une après l''autre : « My name is Léo. I am nine. I live in Paris.
  I have got a cat. »


  Tu peux nommer des personnes, des objets ou des lieux avec les mots de l''école, de la famille, de la maison : « my teacher
  », « my sister », « my bedroom ». Pour les caractériser, ajoute un adjectif : « a big dog » (un grand chien), « a red car
  » (une voiture rouge).


  En anglais, l''adjectif se place avant le nom. Il ne change jamais : « a red car », « two red cars ». C''est le nom qui
  prend un « s » au pluriel, pas l''adjectif. C''est la règle d''accord à retenir.


  Pour dénombrer, tu mets un nombre devant le nom : « I have two brothers » (j''ai deux frères), « There are three cats »
  (il y a trois chats).


  Pour situer ton texte dans le temps, écris la date du jour : « Today is Monday, the 3rd of March. » Les jours et les mois
  prennent toujours une majuscule en anglais.

  '
methode:
- Commence par la date du jour, avec une majuscule au jour et au mois.
- Choisis des phrases courtes que tu connais déjà (My name is..., I have..., I like...).
- Place l'adjectif avant le nom qu'il décrit ("a big dog", pas "a dog big").
- Au pluriel, ajoute « s » au nom, mais jamais à l'adjectif ("two big dogs").
- Écris plusieurs phrases simples les unes après les autres, sans les relier de façon compliquée.
- Relis-toi en vérifiant les majuscules et le point à la fin de chaque phrase.
vocabulaire:
- terme: big / small
  definition: Grand / petit, deux adjectifs contraires.
- terme: Today is...
  definition: Aujourd'hui, on est... On l'écrit avant la date du jour.
- terme: I have / I am
  definition: J'ai / je suis.
- terme: adjectif
  definition: Un mot qui dit comment est une personne ou une chose (grand, rouge, gentil).
- terme: pluriel
  definition: Quand il y en a plusieurs. En anglais, le nom prend souvent un « s ».
- terme: There is / There are
  definition: Il y a (un seul) / il y a (plusieurs).
erreurs_frequentes:
- Accorder l'adjectif anglais au pluriel comme en français ("reds cars" au lieu de "red cars").
- Placer l'adjectif après le nom comme en français ("a car red" au lieu de "a red car").
- Oublier de mettre une majuscule aux jours de la semaine et aux mois en anglais.
- Oublier le « s » du nom au pluriel (« two cat » au lieu de « two cats »).
exemple:
  enonce: Écris une phrase pour décrire un chat noir et petit.
  solution: '"I have a small black cat." (j''ai un petit chat noir). Les adjectifs "small" et "black" sont placés avant le
    nom "cat" et ne s''accordent pas.'
exercices:
- id: place-adjectif
  type: choix
  difficulte: 1
  enonce: Quelle phrase respecte la place de l'adjectif en anglais ?
  reponse:
    options:
    - id: a
      texte: I have a big dog.
    - id: b
      texte: I have a dog big.
    - id: c
      texte: I have a dogs big.
    bonnes:
    - a
  indices:
    relance: En anglais, l'adjectif se place toujours avant le nom qu'il décrit.
    methode: Compare la place de "big" par rapport à "dog" dans chaque phrase.
    etape: Dans la bonne phrase, "big" est placé juste avant "dog".
  pieges:
  - si:
      contient:
      - b
    relance: Ici l'adjectif "big" est placé après le nom, comme en français. En anglais, il se place avant.
  - si:
      contient:
      - c
    relance: Cette phrase place l'adjectif après le nom et ajoute un "s" à "dog" sans raison ici.
  solution: '"I have a big dog." place correctement l''adjectif "big" avant le nom "dog".'
- id: majuscule-jour
  type: choix
  difficulte: 1
  enonce: Quelle date est bien écrite en anglais ?
  reponse:
    options:
    - id: a
      texte: Today is Friday.
    - id: b
      texte: Today is friday.
    - id: c
      texte: today is friday
    bonnes:
    - a
  indices:
    relance: Regarde la première lettre du jour de la semaine.
    methode: En anglais, les jours de la semaine commencent toujours par une majuscule, et la phrase aussi.
    etape: Une seule phrase a une majuscule au début de la phrase et au début du jour.
  pieges:
  - si:
      contient:
      - b
    relance: Le début de la phrase est juste. Mais en anglais, le jour de la semaine prend aussi une majuscule.
  - si:
      contient:
      - c
    relance: Il manque deux majuscules et le point. Regarde le début de la phrase et le jour.
  solution: « Today is Friday. » est juste. La phrase commence par une majuscule, le jour aussi, et un point termine la phrase.
- id: ecrire-la-date
  type: texte_court
  difficulte: 2
  enonce: 'Complète : "Today is Monday, the 3rd ___ March." (aujourd''hui, on est lundi 3 mars). Quel petit mot manque ?'
  reponse:
    acceptees:
    - of
    fautes_tolerees: 0
  indices:
    relance: Il manque un tout petit mot qui relie le nombre du jour au nom du mois.
    methode: 'La structure de la date en anglais est : jour de la semaine, "the" + nombre + un petit mot de liaison + mois.'
    etape: Le mot manquant se place juste entre "3rd" et "March".
  pieges:
  - si:
      valeur: the
    relance: '"The" est déjà présent avant le nombre. Cherche le mot qui manque entre le nombre et le mois.'
  solution: 'Le mot manquant est "of" : "Today is Monday, the 3rd of March.".'
- id: ordre-presentation-ecrite
  type: ordre
  difficulte: 2
  enonce: Range ces lignes dans l'ordre pour écrire un petit message où tu te présentes à Sam.
  reponse:
    elements:
    - id: a
      texte: Hi Sam!
    - id: b
      texte: My name is Léo. I am nine years old.
    - id: c
      texte: See you soon! Léo
  indices:
    relance: Par quoi commence un message, et par quoi se termine-t-il ?
    methode: Un message commence par une salutation, continue avec les phrases, et finit par un au revoir et la signature.
    etape: '"Hi Sam!" ouvre le message.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux lignes voisines sont inversées. Où place-t-on la signature, au début ou à la fin ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par la salutation, puis présente-toi, puis dis au revoir et signe.
  solution: D'abord "Hi Sam!", puis "My name is Léo. I am nine years old.", puis "See you soon! Léo".
- id: association-adjectifs-contraires
  type: association
  difficulte: 2
  enonce: Associe chaque adjectif anglais à son contraire.
  reponse:
    gauche:
    - id: a
      texte: big
    - id: b
      texte: happy
    - id: c
      texte: old
    droite:
    - id: x
      texte: small
    - id: y
      texte: sad
    - id: z
      texte: young
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par l''adjectif le plus facile : le contraire de "big" (grand).'
    methode: Chaque adjectif a un seul contraire parmi les trois proposés.
    etape: '"Big" (grand) a pour contraire "small" (petit).'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère le contraire de "old" (vieux).
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord "big"/"small", puis distingue les deux autres paires.
  solution: '"big" ≠ "small" ; "happy" ≠ "sad" ; "old" ≠ "young".'
- id: pluriel-adjectif
  type: choix
  difficulte: 2
  enonce: Tu veux écrire « J'ai trois chats noirs. » Quelle phrase est juste ?
  reponse:
    options:
    - id: a
      texte: I have three black cats.
    - id: b
      texte: I have three blacks cats.
    - id: c
      texte: I have three black cat.
    bonnes:
    - a
  indices:
    relance: Au pluriel, quel mot prend un « s » en anglais, le nom ou l'adjectif ?
    methode: L'adjectif anglais ne change jamais. Seul le nom prend un « s » quand il y en a plusieurs.
    etape: Cherche la phrase où « black » n'a pas de « s » et où le nom de l'animal en a un.
  pieges:
  - si:
      contient:
      - b
    relance: L'adjectif « black » ne prend jamais de « s », même au pluriel. C'est une règle anglaise.
  - si:
      contient:
      - c
    relance: Il y a trois chats. Le nom doit donc prendre un « s » au pluriel.
  solution: « I have three black cats. » L'adjectif « black » reste invariable, et le nom « cats » prend un « s » car il y
    en a trois.
- id: denombrer-famille
  type: texte_court
  difficulte: 2
  enonce: 'Écris en anglais le mot qui manque : « I have two ___. » (J''ai deux sœurs.)'
  reponse:
    acceptees:
    - sisters
    fautes_tolerees: 0
  indices:
    relance: Quel est le mot anglais pour « sœur » ? Il y en a deux.
    methode: On prend le mot pour « sœur » et on ajoute la marque du pluriel à la fin.
    etape: Le mot pour « sœur » au singulier est « sister ». Que faut-il ajouter pour en avoir deux ?
  pieges:
  - si:
      valeur: sister
    relance: Il y a deux sœurs. N'oublie pas la marque du pluriel à la fin du nom.
  - si:
      valeur: brothers
    relance: « brothers » veut dire « frères ». Ici, on parle de sœurs.
  solution: On écrit « I have two sisters. ». « sister » prend un « s » car il y en a deux.
- id: carnet-de-vacances
  type: choix
  difficulte: 3
  enonce: 'Lis ce petit texte : « Today is Saturday. I am at the beach with my dad. The sea is blue. There are two small boats.
    » Quelle phrase française le résume bien ?'
  reponse:
    options:
    - id: a
      texte: Samedi, je suis à la plage avec mon papa. La mer est bleue et il y a deux petits bateaux.
    - id: b
      texte: Dimanche, je suis à la piscine avec ma maman. Il y a deux grands bateaux.
    - id: c
      texte: Samedi, je suis à la plage avec mon papa. La mer est verte et il y a trois bateaux.
    bonnes:
    - a
  indices:
    relance: Repère le jour, le lieu, la personne, la couleur de la mer et le nombre de bateaux.
    methode: Vérifie chaque information du texte anglais dans la phrase française. Une seule erreur suffit pour l'écarter.
    etape: « Saturday » est samedi, « beach » est la plage et « dad » est le papa. Regarde maintenant la couleur et le nombre.
  pieges:
  - si:
      contient:
      - b
    relance: Le texte dit « Saturday » et « my dad ». Le jour et la personne ne vont pas.
  - si:
      contient:
      - c
    relance: Le début est juste. Mais quelle est la couleur de la mer, et combien y a-t-il de bateaux ?
  solution: 'Le texte dit : samedi (« Saturday »), à la plage (« beach ») avec mon papa (« my dad »), la mer est bleue («
    blue »), deux petits bateaux (« two small boats »).'
- id: ma-journee-imaginee
  type: ouverte
  difficulte: 3
  enonce: Écris quatre phrases en anglais pour raconter une journée, vraie ou inventée. Commence par la date du jour, puis
    présente-toi, puis décris un lieu ou un animal avec un adjectif, puis donne un nombre.
  criteres:
  - La date est écrite avec une majuscule au jour et au mois (Today is Wednesday, the 5th of May.).
  - Une phrase décrit un lieu, une personne ou un animal avec un adjectif placé avant le nom.
  - Une phrase contient un nombre avec un nom au pluriel bien écrit (two cats, three friends...).
  indices:
    relance: Par quelle phrase toute faite commences-tu pour donner la date ?
    methode: Utilise les phrases de la fiche (Today is..., My name is..., I have...) et change seulement quelques mots.
    etape: Pour la description, choisis un animal et ajoute un adjectif de couleur ou de taille devant.
  solution: 'Exemple : « Today is Wednesday, the 5th of May. My name is Inès. I am at the zoo. I can see a big lion. There
