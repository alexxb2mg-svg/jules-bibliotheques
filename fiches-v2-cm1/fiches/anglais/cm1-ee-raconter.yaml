    relance: En anglais, les adjectifs qualificatifs n'ont pas de marque de genre (féminin) ni de nombre (pluriel).
  solution: Il ne change jamais et reste invariable (ex. « two big dogs »). Bravo ! L'adjectif anglais ne s'accorde jamais,
