- id: nblm-ou-se-place-l-adjectif-qualificatif-quan-1
  type: choix
  difficulte: 2
  enonce: Où se place l'adjectif qualificatif quand tu décris un animal ou un objet en anglais à l'écrit ?
  reponse:
    options:
    - id: o1
      texte: Avant le nom qu'il décrit (ex. « a big dog »)
    - id: o2
      texte: Après le nom qu'il décrit (ex. « a dog big »)
    - id: o3
      texte: Entre le sujet et le verbe de la phrase
    - id: o4
      texte: Tout à la fin de la phrase après un tiret
    bonnes:
    - o1
  indices:
    relance: Pense à la position du mot descriptif par rapport au mot désignant l'animal ou l'objet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, c'est l'ordre du français. En anglais, l'adjectif se place obligatoirement devant le nom.
  - si:
      contient:
      - o3
    relance: L'adjectif qualifie directement le nom et se place juste devant lui, pas entre le sujet et le verbe.
  - si:
      contient:
      - o4
    relance: L'adjectif ne se met pas à la fin avec un tiret ; il précède directement le nom qu'il qualifie.
  solution: Avant le nom qu'il décrit (ex. « a big dog »). C'est exact ! En anglais, l'adjectif qualificatif se place toujours
    avant le nom qu'il décrit.
