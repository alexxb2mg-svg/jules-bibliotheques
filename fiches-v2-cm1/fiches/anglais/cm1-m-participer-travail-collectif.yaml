format: 2
notion: cm1-m-participer-travail-collectif
version: 2
etat: verifiee
declencheurs:
- dire en anglais qu'on a compris ou pas compris
- accueillir un camarade en anglais dans un jeu ou un travail de groupe
- demander à un camarade s'il est d'accord en anglais
- donner un tour de rôle à un camarade en anglais
- your turn my turn
- do you agree
- what do you think
- travail de groupe en anglais
- jouer avec un correspondant anglais
prerequis: []
essentiel: 'Participer à un travail de groupe en anglais, c''est utiliser des phrases toutes prêtes pour que tout le monde
  travaille ensemble. Ces phrases s''apprennent par cœur.


  Pour accueillir quelqu''un, on dit « Welcome! » (bienvenue !) ou « Come in! » (entre !). Pour donner le tour, on dit « Your
  turn! » (à toi !). Pour le prendre, on dit « My turn! » (à moi !).


  On peut donner de petites consignes à son groupe, toujours les mêmes : « Listen! » (écoutez !), « Look! » (regardez !),
  « Be quiet, please. » (silence, s''il vous plait), « Let''s go! » (on y va !).


  Pour demander l''avis des autres, on dit « What do you think? » (qu''est-ce que tu en penses ?). Pour demander un coup de
  main, on dit « Can you help me? » (tu peux m''aider ?).


  Pour dire où on en est : « I understand » (j''ai compris) ou « I don''t understand » (je n''ai pas compris), « I agree »
  (je suis d''accord), « It''s OK » (tout va bien). On peut aussi demander aux autres : « Do you understand? », « Do you agree?
  », « Is there a problem? » (il y a un problème ?).


  Avec un correspondant d''un autre pays, on montre qu''on s''intéresse à lui avec des mots simples comme « Great! » (super
  !) ou « Really? » (c''est vrai ?), un sourire, un pouce levé ou un signe de tête.

  '
methode:
- Accueille le camarade avec « Welcome! » au début du jeu ou du travail.
- Donne le tour avec « Your turn! » et prends-le avec « My turn! ».
- Demande l'avis du groupe avec « What do you think? » ou « Do you agree? ».
- Dis clairement « I understand » ou « I don't understand » pour que le groupe sache où tu en es.
- Vérifie que tout le monde suit avec « Do you understand? » ou « Is there a problem? ».
- Montre ton intérêt avec un mot simple (Great!, Really?) et un geste (sourire, pouce levé).
vocabulaire:
- terme: Welcome!
  definition: Bienvenue ! On le dit pour accueillir quelqu'un qui arrive.
- terme: Your turn! / My turn!
  definition: À toi ! / À moi ! On le dit pour donner ou prendre son tour.
- terme: I understand / I don't understand
  definition: J'ai compris / je n'ai pas compris.
- terme: I agree / Do you agree?
  definition: Je suis d'accord / est-ce que tu es d'accord ?
- terme: What do you think?
  definition: Qu'est-ce que tu en penses ? On le dit pour demander l'avis de quelqu'un.
- terme: Is there a problem?
  definition: Il y a un problème ? On le dit pour vérifier que tout va bien.
erreurs_frequentes:
- Ne jamais dire si on a compris ou pas, ce qui bloque le travail du groupe.
- Oublier de donner le tour à un camarade avec "Your turn!", ce qui coupe l'échange.
- Confondre "I agree" (je suis d'accord) et "I understand" (j'ai compris), qui ne veulent pas dire la même chose.
- Décider seul sans demander l'avis des autres avec « What do you think? ».
exemple:
  enonce: Dans un jeu de groupe, c'est au tour de ton camarade de jouer, mais il a l'air perdu. Que lui dis-tu ?
  solution: Tu lui dis « Your turn! » (à toi !) pour lui indiquer que c'est son tour. Puis tu lui demandes « Do you understand?
    » (tu as compris ?) pour vérifier qu'il sait quoi faire.
exercices:
- id: accueillir-un-camarade
  type: choix
  difficulte: 1
  enonce: Un nouveau camarade rejoint ton groupe de travail. Que lui dis-tu pour l'accueillir ?
  reponse:
    options:
    - id: a
      texte: Welcome!
    - id: b
      texte: Goodbye!
    - id: c
      texte: Sorry!
    bonnes:
    - a
  indices:
    relance: Cherche le mot qui sert à accueillir quelqu'un qui arrive, pas à le quitter ni à s'excuser.
    methode: Le mot qui veut dire "bienvenue" en anglais sert à accueillir quelqu'un.
    etape: Cherche, parmi les trois options, celle qui veut dire "bienvenue".
  pieges:
  - si:
      contient:
      - b
    relance: '"Goodbye" sert à dire au revoir, pas à accueillir quelqu''un qui arrive.'
  - si:
      contient:
      - c
    relance: '"Sorry" sert à s''excuser, pas à accueillir un nouveau camarade.'
  solution: '"Welcome!" est la formule pour accueillir un camarade qui rejoint le groupe.'
- id: dire-quon-a-compris
  type: texte_court
  difficulte: 1
  enonce: Comment dit-on "j'ai compris" en anglais, en deux mots ?
  reponse:
    acceptees:
    - I understand
    - i understand
    fautes_tolerees: 1
  indices:
    relance: La phrase commence par "I" (je).
    methode: Le verbe "understand" veut dire "comprendre".
    etape: Le verbe de cette phrase veut dire "comprendre".
  pieges:
  - si:
      valeur: i agree
    relance: '"I agree" veut dire "je suis d''accord", pas "j''ai compris". Cherche une autre phrase.'
  solution: '"I understand" veut dire "j''ai compris".'
- id: demander-avis
  type: choix
  difficulte: 1
  enonce: Ton groupe doit choisir une couleur pour une affiche. Tu veux connaitre l'avis de ta camarade. Que lui dis-tu ?
  reponse:
    options:
    - id: a
      texte: What do you think?
    - id: b
      texte: How old are you?
    - id: c
      texte: Goodbye!
    bonnes:
    - a
  indices:
    relance: Cherche la question qui demande ce que pense l'autre personne.
    methode: Le verbe « think » veut dire « penser ».
    etape: Une des questions demande l'âge. Ce n'est pas l'avis. Il reste une question.
  pieges:
  - si:
      contient:
      - b
    relance: Cette question demande l'âge de ta camarade, pas son avis sur la couleur.
  - si:
      contient:
      - c
    relance: « Goodbye! » sert à dire au revoir. Tu veux au contraire continuer à travailler avec elle.
  solution: « What do you think? » veut dire « qu'est-ce que tu en penses ? ». C'est la question pour demander un avis.
- id: ordre-tour-de-role
  type: ordre
  difficulte: 2
  enonce: Range ces phrases dans l'ordre logique d'un jeu de groupe où l'on passe le tour à un camarade.
  reponse:
    elements:
    - id: a
      texte: My turn! I choose a card.
    - id: b
      texte: OK, that's a good choice.
    - id: c
      texte: Your turn now!
  indices:
    relance: Quelle phrase indique que c'est à quelqu'un de commencer, et laquelle passe le tour ensuite ?
    methode: On commence par jouer son tour, puis on réagit au choix, puis on passe le tour.
    etape: '"My turn! I choose a card." est la première phrase du tour de jeu.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux phrases voisines sont inversées. Laquelle réagit au choix, et laquelle passe le tour ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par jouer son tour, puis réagis, puis passe le tour au camarade.
  solution: D'abord "My turn! I choose a card.", puis "OK, that's a good choice.", puis "Your turn now!".
- id: association-formules-groupe
  type: association
  difficulte: 2
  enonce: Associe chaque phrase anglaise à ce qu'elle permet de faire dans un travail de groupe.
  reponse:
    gauche:
    - id: a
      texte: Welcome!
    - id: b
      texte: Your turn!
    - id: c
      texte: There's a problem.
    droite:
    - id: x
      texte: Accueillir quelqu'un
    - id: y
      texte: Donner le tour à quelqu'un
    - id: z
      texte: Signaler une difficulté
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par la phrase la plus facile à reconnaitre : celle qui accueille quelqu''un.'
    methode: 'Chaque phrase a une seule fonction : accueillir, donner le tour, ou signaler un problème.'
    etape: '"Welcome!" sert à accueillir quelqu''un.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère la phrase qui signale un problème.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord l'accueil, puis distingue le tour de rôle et le problème.
  solution: '"Welcome!" = accueillir quelqu''un ; "Your turn!" = donner le tour ; "There''s a problem." = signaler une difficulté.'
- id: demander-accord
  type: texte_court
  difficulte: 2
  enonce: 'Tu proposes une idée à ton groupe et tu veux savoir si tout le monde est d''accord. Complète la question : « Do
    you ___? »'
  reponse:
    acceptees:
    - agree
    fautes_tolerees: 1
  indices:
    relance: C'est le même verbe que dans « je suis d'accord », sans le « I ».
    methode: Pour poser une question, on met « Do you » devant le verbe, puis un point d'interrogation.
    etape: Le verbe cherché commence par la lettre « a » et a cinq lettres.
  pieges:
  - si:
      valeur: understand
    relance: « Do you understand? » demande si on a compris. Ici, tu veux savoir si les autres sont d'accord.
  - si:
      valeur: like
    relance: « Do you like? » demande ce qu'on aime. Ici, tu veux savoir si les autres sont d'accord avec ton idée.
  solution: 'On demande « Do you agree? » : est-ce que vous êtes d''accord ?'
- id: consigne-de-groupe
  type: choix
  difficulte: 2
  enonce: Ton groupe fait trop de bruit et vous n'entendez plus la maitresse. Quelle consigne donnes-tu à ton groupe ?
  reponse:
    options:
    - id: a
      texte: Be quiet, please.
    - id: b
      texte: Let's go!
    - id: c
      texte: Welcome!
    bonnes:
    - a
  indices:
    relance: Tu veux que ton groupe parle moins fort. Quelle phrase demande le calme ?
    methode: Le mot « please » rend la consigne polie. Cherche la consigne qui demande le silence.
    etape: « Let's go! » veut dire « on y va ! » et « Welcome! » veut dire « bienvenue ! ». Il reste une consigne.
  pieges:
  - si:
      contient:
      - b
    relance: « Let's go! » veut dire « on y va ! ». Cela ne fait pas baisser le bruit.
  - si:
      contient:
      - c
    relance: « Welcome! » sert à accueillir quelqu'un. Ici, tu veux demander le calme.
  solution: « Be quiet, please. » veut dire « silence, s'il vous plait ». C'est une consigne courte, toujours la même.
- id: reagir-correspondant
  type: association
  difficulte: 3
  enonce: Pendant un échange avec une classe anglaise, associe chaque phrase à ce qu'elle exprime.
  reponse:
    gauche:
    - id: a
      texte: Great!
    - id: b
      texte: Really?
    - id: c
      texte: Can you help me?
    - id: d
      texte: It's OK.
    droite:
    - id: w
      texte: Montrer qu'on trouve ça super
    - id: x
      texte: Montrer qu'on est surpris et intéressé
    - id: y
      texte: Demander un coup de main
    - id: z
      texte: Dire que tout va bien
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Quelle phrase est une question qui demande de l'aide ?
    methode: Le mot « help » veut dire « aider ». Les phrases très courtes sont des réactions.
    etape: « Great! » veut dire « super ! ». Associe-le en premier.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle des phrases est une question qui montre la surprise ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par « Can you help me? », qui contient le mot « help », puis place les trois autres.
  solution: « Great! » = super ; « Really? » = surprise et intérêt ; « Can you help me? » = demander de l'aide ; « It's OK.
    » = tout va bien.
- id: jeu-de-societe-en-anglais
  type: ouverte
  difficulte: 3
  enonce: 'Joue à un jeu de société (cartes, dés, petits chevaux) avec quelqu''un de ta famille, en anglais. Écris ensuite
    quatre phrases que tu as utilisées : une pour accueillir, une pour donner le tour, une pour demander si l''autre a compris
    et une pour demander son avis.'
  criteres:
  - Les quatre phrases sont en anglais et correspondent aux quatre situations demandées.
  - Les formules apprises sont bien écrites (Welcome!, Your turn!, Do you understand?, What do you think?...).
  - L'élève dit en français à quel moment du jeu il a utilisé chaque phrase.
  indices:
    relance: Que dis-tu au tout début, quand ton partenaire s'assoit pour jouer ?
    methode: Reprends les phrases de la fiche une par une et cherche à quel moment du jeu chacune sert.
    etape: Pour donner le tour, tu peux utiliser « Your turn! ».
  solution: 'Exemple : « Welcome! » quand mon frère s''assoit. « Your turn! » après avoir lancé le dé. « Do you understand?
    » quand j''explique la règle. « What do you think? » pour choisir qui commence.'
