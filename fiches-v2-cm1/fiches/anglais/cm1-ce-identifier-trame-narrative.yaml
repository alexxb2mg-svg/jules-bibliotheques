format: 2
notion: cm1-ce-identifier-trame-narrative
version: 3
etat: verifiee
declencheurs:
- comprendre l'histoire d'un texte anglais illustré
- repérer qui fait quoi dans un récit en anglais
- reconnaitre une phrase négative en anglais
- trouver un mot de liaison dans un texte anglais
- lire une histoire en anglais
- doesn't like
- shy brave happy
- mother father sister
- wakes up
prerequis:
- cm1-ce-comprendre-textes-courts-simples
essentiel: 'La trame narrative, c''est la structure d''une histoire : qui sont les personnages, ce qu''ils font, et dans quel
  ordre. Une histoire a un début, un milieu et une fin.


  Dans un court récit illustré, les images t''aident beaucoup. Regarde-les avant de lire : elles montrent les personnages,
  le lieu et les actions. Tu peux alors deviner le sens des mots que tu ne connais pas.


  Les personnages sont souvent des membres de la famille : « mother » (mère), « father » (père), « sister » (sœur), « brother
  » (frère). Des mots simples disent leur caractère : « happy » (heureux), « shy » (timide), « brave » (courageux).


  Les récits parlent souvent des activités de tous les jours. Les verbes reviennent : « wake up » (se réveiller), « eat »
  (manger), « go » (aller), « play » (jouer), « read » (lire). Au présent, avec « he » ou « she », le verbe prend un « s »
  : « Tom wakes up ».


  Une phrase simple suit presque toujours le même ordre : qui (« Emma »), puis l''action (« plays »), puis le reste (« in
  the garden »). Elle peut être affirmative : « Emma likes cats. » Elle peut être négative : la marque de la négation est
  « not », souvent collée au verbe avec « n''t » (« don''t », « doesn''t », « isn''t »). « Emma doesn''t like cats. » veut
  dire le contraire !


  Les connecteurs sont des petits mots qui relient les actions dans le temps : « first » (d''abord), « then » (ensuite), «
  after » (après), « finally » (enfin). Ils te donnent l''ordre de l''histoire.

  '
methode:
- Regarde les images pour deviner les personnages, le lieu et ce qui se passe.
- Repère les mots de la famille et les traits de caractère pour savoir qui est qui.
- Repère les verbes d'action pour comprendre ce que fait chaque personnage.
- Cherche « not » ou « n't » dans chaque phrase pour savoir si elle est affirmative ou négative.
- Repère les connecteurs (« first », « then », « after », « finally ») pour remettre les moments dans l'ordre.
- Raconte-toi l'histoire en français en trois moments, début, milieu et fin, pour vérifier que tu as compris.
vocabulaire:
- terme: trame narrative
  definition: la structure d'une histoire, avec les personnages, les actions et leur ordre.
- terme: récit illustré
  definition: une courte histoire accompagnée d'images qui aident à la comprendre.
- terme: phrase négative
  definition: une phrase qui dit non, avec la marque de la négation « not » ou « n't ».
- terme: connecteur
  definition: un petit mot qui relie les actions, comme « first », « then », « after », « finally ».
- terme: don't / doesn't
  definition: marque la négation avec la plupart des verbes au présent (« doesn't » avec « he » ou « she »).
- terme: happy / shy / brave
  definition: heureux / timide / courageux.
erreurs_frequentes:
- Ne pas remarquer « don't », « doesn't » ou « not » et comprendre l'inverse de ce que dit la phrase.
- Confondre les personnages de la famille entre eux (« mother », « sister », « brother »...).
- Ignorer les connecteurs et perdre l'ordre des événements.
- Lire le texte sans regarder les images, alors qu'elles aident à deviner le sens.
- Vouloir traduire chaque mot au lieu de chercher qui fait quoi et dans quel ordre.
exemple:
  enonce: 'Un récit dit : « First, Emma wakes up. Then, she doesn''t eat breakfast. Finally, she goes to school. » Que se
    passe-t-il en deuxième ?'
  solution: En deuxième, Emma ne prend pas de petit-déjeuner (« she doesn't eat breakfast »). Le mot « doesn't » montre que
    c'est une phrase négative. L'ordre est donné par les connecteurs « First » (d'abord), « Then » (ensuite) et « Finally
    » (enfin).
exercices:
- id: reperer-personnage
  type: choix
  difficulte: 1
  enonce: Dans un récit, on lit "My brother is very shy." Qui est "my brother" ?
  reponse:
    options:
    - id: a
      texte: Un membre de la famille
    - id: b
      texte: Un jour de la semaine
    - id: c
      texte: Un animal
    bonnes:
    - a
  indices:
    relance: '"Brother" appartient au champ lexical de la famille.'
    methode: 'Cherche à quel groupe de mots appartient "brother" : famille, jours, ou animaux ?'
    etape: '"Brother" veut dire "frère" : à quel groupe de personnes appartient un frère ?'
  pieges:
  - si:
      contient:
      - b
    relance: '"Brother" n''est pas un jour de la semaine. Pense au sens du mot : qui peut-il désigner ?'
  - si:
      contient:
      - c
    relance: '"Brother" ne désigne pas un animal, mais une personne de la famille.'
  solution: '"My brother" désigne un membre de la famille : le frère.'
- id: mot-negation
  type: texte_court
  difficulte: 1
  enonce: Dans la phrase "She doesn't like spiders.", quel mot montre que la phrase est négative ?
  reponse:
    acceptees:
    - doesn't
    - does not
    fautes_tolerees: 1
  indices:
    relance: Cherche le mot qui contient une apostrophe suivie de "t".
    methode: En anglais, la négation avec la plupart des verbes au présent s'ajoute avec un petit mot qui contient "n't".
    etape: Le mot juste après "She" et avant "like" porte la négation.
  pieges:
  - si:
      valeur: spiders
    relance: '"Spiders" (araignées), c''est ce dont on parle, pas le mot de négation. Cherche le mot qui contient "n''t".'
  solution: '"Doesn''t" (ou "does not") est le mot qui rend la phrase négative.'
- id: traits-de-caractere
  type: association
  difficulte: 1
  enonce: Dans une histoire, les personnages sont décrits avec des mots anglais. Relie chaque trait de caractère à sa traduction.
  reponse:
    gauche:
    - id: happy
      texte: happy
    - id: shy
      texte: shy
    - id: brave
      texte: brave
    droite:
    - id: heureux
      texte: heureux
    - id: timide
      texte: timide
    - id: courageux
      texte: courageux
    paires:
      happy: heureux
      shy: timide
      brave: courageux
  indices:
    relance: Un de ces mots anglais ressemble beaucoup à un mot français. Lequel ?
    methode: Commence par le mot transparent, puis pense à un personnage qui sourit et à un personnage qui n'ose pas parler.
    etape: '« Brave » ressemble au français « brave » : un chevalier brave n''a pas peur. Il te reste deux mots.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pense à un enfant qui se cache derrière sa maman, puis à un enfant qui rit.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le mot qui ressemble au français, puis place les deux autres.
  solution: « happy » = heureux ; « shy » = timide ; « brave » = courageux.
- id: phrase-negative-a-trouver
  type: choix
  difficulte: 2
  enonce: Quelle phrase de ce récit est une phrase négative ?
  reponse:
    options:
    - id: a
      texte: Tom doesn't play tennis.
    - id: b
      texte: Tom plays tennis.
    - id: c
      texte: Tom is happy.
    bonnes:
    - a
  indices:
    relance: Une phrase négative contient la marque de la négation. Laquelle de ces phrases en a une ?
    methode: Cherche dans chaque phrase « not » ou un mot terminé par « n't ».
    etape: Les phrases avec « plays » et « is happy » disent oui. Regarde la phrase qui reste.
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase dit que Tom joue au tennis. Elle dit oui. Cherche la marque de la négation.
  - si:
      contient:
      - c
    relance: Cette phrase dit que Tom est heureux. Il n'y a ni « not » ni « n't ». Regarde encore.
  solution: '« Tom doesn''t play tennis. » est négative : « doesn''t » est la marque de la négation. Elle veut dire que Tom
    ne joue pas au tennis.'
- id: connecteur-manquant
  type: texte_court
  difficulte: 2
  enonce: 'Complète le récit avec le connecteur qui veut dire « ensuite » : « First, Lily eats breakfast. ___, she goes to
    school. Finally, she plays with her friends. »'
  reponse:
    acceptees:
    - then
    - next
    - after that
    fautes_tolerees: 0
  indices:
    relance: Le récit commence par « First » et se termine par « Finally ». Quel petit mot vient au milieu ?
    methode: Relis la liste des connecteurs de la leçon et cherche celui qui annonce l'action suivante.
    etape: Relis l'exemple de la leçon avec Emma. Quel connecteur vient entre « First » et « Finally » ?
  pieges:
  - si:
      valeur: finally
    relance: Ce connecteur annonce la fin de l'histoire, et il est déjà utilisé. Il faut celui du milieu.
  - si:
      valeur: first
    relance: Ce connecteur annonce le début, et il est déjà utilisé. Il faut celui qui veut dire « ensuite ».
  solution: '« Then, she goes to school. » « Then » veut dire ensuite : d''abord Lily mange, ensuite elle va à l''école, enfin
    elle joue.'
- id: ordre-histoire
  type: ordre
  difficulte: 2
  enonce: Range ces trois moments d'un récit dans l'ordre logique, en t'aidant des connecteurs.
  reponse:
    elements:
    - id: a
      texte: First, Tom wakes up and gets dressed.
    - id: b
      texte: Then, he has breakfast with his family.
    - id: c
      texte: Finally, he walks to school with his sister.
  indices:
    relance: Quel mot indique le début de l'histoire, et quel mot en indique la fin ?
    methode: '"First" marque le début, "Then" la suite, "Finally" la fin de l''histoire.'
    etape: '"First, Tom wakes up..." est la première phrase de l''histoire.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux moments voisins sont inversés. Repère lequel commence par "Then" et lequel par "Finally".
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la phrase avec "First", puis celle avec "Then", puis celle avec "Finally".
  solution: D'abord "First, Tom wakes up and gets dressed.", puis "Then, he has breakfast with his family.", puis "Finally,
    he walks to school with his sister.".
- id: association-personnages-actions
  type: association
  difficulte: 2
  enonce: Associe chaque personnage à ce qu'il fait dans le récit.
  reponse:
    gauche:
    - id: a
      texte: The mother
    - id: b
      texte: The sister
    - id: c
      texte: The dog
    droite:
    - id: x
      texte: cooks dinner
    - id: y
      texte: reads a book
    - id: z
      texte: plays in the garden
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par le personnage qui n''est pas une personne : c''est souvent celui qui joue dehors.'
    methode: 'Chaque personnage a une seule action associée dans le récit : cuisiner, lire, ou jouer.'
    etape: '"The mother cooks dinner" : la mère est associée à l''action de cuisiner.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère le personnage associé à la lecture.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le chien, qui joue dans le jardin, puis distingue les deux personnes.
  solution: '"The mother" = cuisine le diner ; "The sister" = lit un livre ; "The dog" = joue dans le jardin.'
- id: ben-au-parc
  type: choix
  difficulte: 3
  enonce: 'Lis le récit : « Ben is shy. First, he goes to the park. He doesn''t play with the other children. Then, his sister
    arrives. Finally, they play together and Ben is happy. » Que fait Ben au parc AVANT l''arrivée de sa sœur ?'
  reponse:
    options:
    - id: a
      texte: Il ne joue pas avec les autres enfants.
    - id: b
      texte: Il joue avec les autres enfants.
    - id: c
      texte: Il joue avec sa sœur.
    bonnes:
    - a
  indices:
    relance: Quel connecteur annonce l'arrivée de la sœur ? Regarde la phrase juste avant.
    methode: Repère les connecteurs pour trouver le bon moment, puis cherche si la phrase est affirmative ou négative.
    etape: La phrase juste avant « Then » parle de Ben et des autres enfants. Contient-elle « n't » ?
  pieges:
  - si:
      contient:
      - b
    relance: Relis bien la phrase sur les autres enfants. Il y a la marque de la négation. Que veut-elle dire ?
  - si:
      contient:
      - c
    relance: Ben joue avec sa sœur, mais à quel moment ? Regarde le connecteur « Finally ».
  solution: 'Avant l''arrivée de sa sœur, Ben ne joue pas avec les autres enfants : « He doesn''t play » est une phrase négative.
    Il est timide (« shy »). Ensuite (« Then ») sa sœur arrive, et enfin (« Finally ») ils jouent ensemble et Ben est heureux
    (« happy »).'
- id: raconter-en-trois-moments
  type: ouverte
  difficulte: 3
  enonce: Relis l'histoire de Ben (exercice précédent). Raconte-la en français en trois moments, ou dessine-la en trois images
    avec une phrase sous chaque image.
  criteres:
  - Les trois moments sont dans le bon ordre (début au parc, arrivée de la sœur, jeu ensemble), en suivant « First », « Then
    », « Finally ».
  - La phrase négative est bien comprise (Ben ne joue pas avec les autres enfants au début).
  - Le caractère de Ben est indiqué au début et à la fin (timide, puis heureux).
  indices:
    relance: Qui est le personnage principal, et comment se sent-il au début ?
    methode: Utilise les trois connecteurs du texte pour découper l'histoire en trois parties.
    etape: 'Tu peux commencer ainsi : « D''abord, Ben, qui est timide, va au parc... »'
  solution: 'Exemple possible : D''abord, Ben, qui est timide, va au parc mais il ne joue pas avec les autres enfants. Ensuite,
    sa sœur arrive. Enfin, ils jouent ensemble et Ben est heureux.'
- id: nblm-dans-un-recit-illustre-en-anglais-a-quoi-1
  type: choix
  difficulte: 2
  enonce: Dans un récit illustré en anglais, à quoi servent principalement les images pour un élève de CM1 ?
  reponse:
    options:
    - id: o1
      texte: À deviner qui sont les personnages et à comprendre l'histoire sans tout traduire.
    - id: o2
      texte: À remplacer le texte pour ne pas avoir à lire les mots en anglais.
    - id: o3
      texte: À donner la traduction en français de chaque phrase au bas de la page.
    - id: o4
      texte: À indiquer seulement le nombre de pages ou le prix du livre.
    bonnes:
    - o1
  indices:
    relance: Pense à la façon dont les dessins t'aident à comprendre ce qui se passe dans l'histoire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : les illustrations accompagnent la lecture du texte mais ne remplacent pas les mots.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : les images fournissent un contexte visuel, pas une traduction mot à mot.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : les illustrations aident à comprendre le déroulement du récit, pas les informations techniques
      du livre.'
  solution: À deviner qui sont les personnages et à comprendre l'histoire sans tout traduire. C'est exact ! Les images apportent
    des indices visuels pour comprendre l'histoire même si l'on ne connaît pas tous les mots.
- id: nblm-dans-une-phrase-en-anglais-quel-element-2
  type: choix
  difficulte: 2
  enonce: Dans une phrase en anglais, quel élément indique qu'il s'agit d'une phrase négative au présent ?
  reponse:
    options:
    - id: o1
      texte: L'utilisation de « don't » ou « doesn't » devant le verbe.
    - id: o2
      texte: La présence d'un mot de liaison comme « then » au début de la phrase.
    - id: o3
      texte: L'emploi d'un adjectif de caractère comme « happy » ou « brave ».
    - id: o4
      texte: L'utilisation d'un mot de la famille comme « mother » ou « brother ».
    bonnes:
    - o1
  indices:
    relance: Regarde les petits mots qui s'ajoutent devant le verbe pour dire le contraire d'une action.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : « then » est un connecteur temporel (« ensuite »), pas une marque de négation.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : « happy » ou « brave » qualifient un personnage, ils ne rendent pas la phrase négative.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : un mot de la famille indique de qui on parle, pas si la phrase est affirmative ou négative.'
  solution: L'utilisation de « don't » ou « doesn't » devant le verbe. C'est juste ! Les formes « don't » ou « doesn't » (avec
    « not ») servent à marquer la négation au présent.
- id: nblm-dans-les-phrases-first-emma-wakes-up-the-3
  type: choix
  difficulte: 2
  enonce: Dans les phrases « First, Emma wakes up. Then, she goes to school », quel est le mot de liaison qui indique la suite
    des événements ?
  reponse:
    options:
    - id: o1
      texte: Then
    - id: o2
      texte: First
    - id: o3
      texte: Wakes up
    - id: o4
      texte: School
    bonnes:
    - o1
  indices:
    relance: Recherche le mot qui signifie « ensuite » ou « puis ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : « first » indique la toute première étape (« d''abord »), pas la suite de l''histoire.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : « wakes up » est le verbe d''action (« se réveiller »), pas un mot de liaison.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : « school » est un nom de lieu (« l''école »).'
  solution: Then. C'est exact ! « Then » signifie « ensuite » ou « puis » et permet de suivre l'enchaînement des actions.
- id: nblm-que-comprend-un-eleve-qui-lit-la-phrase-4
  type: choix
  difficulte: 2
  enonce: Que comprend un élève qui lit la phrase « She doesn't like cats » dans un récit en anglais ?
  reponse:
    options:
    - id: o1
      texte: Elle n'aime pas les chats.
    - id: o2
      texte: Elle aime beaucoup les chats.
    - id: o3
      texte: Elle a un chat à la maison.
    - id: o4
      texte: Elle joue avec son chat.
    bonnes:
    - o1
  indices:
    relance: Sois très attentif au mot « doesn't » placé devant le verbe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ne pas remarquer la marque négative « doesn''t » conduit à comprendre la phrase affirmative
      inverse.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : confondre l''expression d''une préférence (« like ») avec le fait de posséder un animal.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : confondre le verbe de goût (« like ») avec un verbe d''action (« play »).'
  solution: Elle n'aime pas les chats. C'est juste ! « Doesn't » exprime la négation, ce qui indique qu'elle n'aime pas les
    chats.
- id: nblm-quel-connecteur-temporel-utilise-t-on-po-5
  type: choix
  difficulte: 2
  enonce: Quel connecteur temporel utilise-t-on pour introduire la toute dernière étape d'un récit en anglais ?
  reponse:
    options:
    - id: o1
      texte: Finally
    - id: o2
      texte: First
    - id: o3
      texte: Then
    - id: o4
      texte: After
    bonnes:
    - o1
  indices:
    relance: Recherche le mot de liaison qui annonce la fin d'un récit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : « first » s''emploie au tout début du récit (« d''abord »).'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : « then » sert pour les étapes intermédiaires du récit (« ensuite »).'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : « after » signifie « après », mais n''indique pas forcément la conclusion de l''histoire.'
  solution: Finally. C'est exact ! « Finally » signifie « enfin » ou « finalement » et marque la fin de la trame narrative.
- id: nblm-quelles-sont-les-deux-bonnes-methodes-po-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX bonnes méthodes pour réussir à repérer la trame narrative d'un récit en anglais ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Repérer les verbes d'action pour comprendre ce que fait chaque personnage.
    - id: o2
      texte: Repérer les connecteurs de temps (first, then, finally) pour suivre l'ordre des événements.
    - id: o3
      texte: Chercher à traduire chaque mot en français sans regarder les images.
    - id: o4
      texte: Mémoriser uniquement les chiffres du texte en ignorant les personnages.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux indices qui te permettent de savoir QUI agit et DANS QUEL ORDRE.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : traduire mot à mot bloque la compréhension globale au lieu de s''appuyer sur le sens général
      et les images.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : les chiffres donnent des détails précis mais ne permettent pas de suivre la trame d''une
      histoire.'
  solution: Repérer les verbes d'action pour comprendre ce que fait chaque personnage ; Repérer les connecteurs de temps (first,
    then, finally) pour suivre l'ordre des événements. C'est juste ! Les verbes d'action permettent de savoir « qui fait quoi
    » dans le texte.
- id: nblm-quel-mot-de-liaison-anglais-signifie-d-a-7
  type: texte_court
  difficulte: 1
  enonce: Quel mot de liaison anglais signifie « d'abord » pour commencer un récit ?
  reponse:
    acceptees:
    - First
    fautes_tolerees: 1
  indices:
    relance: Ce mot de liaison commence par la lettre F et veut dire « d'abord ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: First. C'est exact ! 'First' est le mot de liaison qui indique le début des événements d'une histoire.
