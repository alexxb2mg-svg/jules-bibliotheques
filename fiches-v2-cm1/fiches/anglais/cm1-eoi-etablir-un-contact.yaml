format: 2
notion: cm1-eoi-etablir-un-contact
version: 2
etat: verifiee
declencheurs:
- comment dire bonjour en anglais
- comment je me présente en anglais
- comment demander le prénom de quelqu'un en anglais
- comment dire au revoir poliment en anglais
- what's your name
- nice to meet you
- no thank you
- how are you
- well done en anglais
prerequis: []
essentiel: 'Établir un contact, c''est ouvrir une petite conversation en anglais, la faire vivre un peu, puis la fermer poliment.


  Pour ouvrir, on salue : « Hello » ou « Hi » (plus familier), « Good morning » le matin, « Good afternoon » l''après-midi.
  Pour se présenter, on dit « My name is... » (je m''appelle...). Pour présenter quelqu''un, on dit « This is Tom. » (voici
  Tom). À une première rencontre, on ajoute « Nice to meet you » (ravi de te rencontrer).


  Les formules de politesse sont indispensables : « please » (s''il te plait), « thank you » (merci), « sorry » (pardon).


  On réagit aussi à ce que l''autre propose. Pour accepter : « Yes, please! » ou « OK! ». Pour refuser poliment : « No, thank
  you. ». Pour féliciter : « Well done! » (bravo !). Pour s''excuser : « Sorry! ».


  Pour relancer la conversation, on pose une petite question en montant la voix à la fin : « And you? » (et toi ?), « How
  old are you? » (quel âge as-tu ?), « Where do you live? » (où habites-tu ?). Si l''autre parle trop vite, on dit « Slowly,
  please. » (lentement, s''il te plait).


  Pour fermer la conversation, on utilise des mots très simples : « OK », « Thank you », « Goodbye », « Bye » ou « See you
  » (à bientôt).

  '
methode:
- Ouvre la conversation avec une salutation adaptée au moment de la journée (Hello, Good morning).
- Présente-toi avec « My name is... » et demande le prénom de l'autre avec « What's your name? ».
- Pense à « please » quand tu demandes, à « thank you » quand on t'aide, à « sorry » si tu gênes.
- Réagis à une proposition (Yes, please! / No, thank you.) ou félicite (Well done!).
- Relance avec une petite question (And you?) en montant la voix à la fin.
- Ferme la conversation avec « Thank you » et un mot d'au revoir (Goodbye, See you).
vocabulaire:
- terme: Hello / Hi
  definition: Bonjour (Hi est plus familier).
- terme: My name is... / This is...
  definition: Je m'appelle... / voici... (pour présenter quelqu'un).
- terme: What's your name?
  definition: Comment tu t'appelles ?
- terme: How are you? / I'm fine, thank you.
  definition: Comment vas-tu ? / je vais bien, merci.
- terme: Yes, please! / No, thank you.
  definition: Oui, s'il te plait ! / non, merci. Pour accepter ou refuser poliment.
- terme: Well done!
  definition: Bravo ! On le dit pour féliciter quelqu'un.
- terme: Goodbye / Bye / See you
  definition: Au revoir / salut / à bientôt.
erreurs_frequentes:
- Répondre "Thank you" à la question "What's your name?" au lieu de dire son prénom.
- Confondre "Nice to meet you" (pour une première rencontre) avec une formule d'au revoir.
- Oublier de dire "please" quand on demande quelque chose à quelqu'un en anglais.
- Refuser par un simple « No! » sec, au lieu de « No, thank you. ».
exemple:
  enonce: 'Un élève anglais te dit : "Hi! What''s your name?" Que réponds-tu ?'
  solution: Tu réponds par exemple « Hi! My name is Léo. And you? » (salut, je m'appelle Léo. Et toi ?). Tu donnes ton prénom
    juste après « My name is », puis tu relances avec « And you? ».
exercices:
- id: bonne-salutation
  type: choix
  difficulte: 1
  enonce: Tu croises ton correspondant anglais le matin, à l'école. Que dis-tu pour le saluer ?
  reponse:
    options:
    - id: a
      texte: Good morning!
    - id: b
      texte: Goodbye!
    - id: c
      texte: Thank you!
    bonnes:
    - a
  indices:
    relance: Cherche le mot qui sert à saluer quelqu'un, pas à le remercier ni à le quitter.
    methode: Cherche l'expression qui se dit au tout début de la journée, quand on arrive et qu'on voit quelqu'un.
    etape: 'Une des trois phrases sert à dire bonjour : c''est celle qui contient le mot "morning".'
  pieges:
  - si:
      contient:
      - b
    relance: '"Goodbye" sert à quitter quelqu''un, pas à le saluer en arrivant. Cherche une autre phrase.'
  - si:
      contient:
      - c
    relance: '"Thank you" sert à remercier, pas à dire bonjour. Cherche la phrase de salutation du matin.'
  solution: '"Good morning!" est la formule pour saluer quelqu''un le matin, quand on arrive.'
- id: refuser-poliment
  type: choix
  difficulte: 1
  enonce: 'Chez ta correspondante, sa maman te propose : « Do you want some milk? » Tu n''en veux pas. Que réponds-tu poliment
    ?'
  reponse:
    options:
    - id: a
      texte: No, thank you.
    - id: b
      texte: Yes, please!
    - id: c
      texte: Goodbye!
    bonnes:
    - a
  indices:
    relance: Tu ne veux pas de lait. Tu dois refuser, mais gentiment.
    methode: Pour refuser poliment, on dit non et on ajoute le mot qui veut dire « merci ».
    etape: « Yes » veut dire oui. Cherche la réponse qui commence par « No ».
  pieges:
  - si:
      contient:
      - b
    relance: « Yes, please! » veut dire « oui, s'il vous plait ». Tu acceptes le lait, alors que tu n'en veux pas.
  - si:
      contient:
      - c
    relance: « Goodbye! » veut dire au revoir. Tu ne pars pas, tu réponds juste à une proposition.
  solution: « No, thank you. » veut dire « non, merci ». C'est la façon polie de refuser.
- id: demander-prenom
  type: texte_court
  difficulte: 2
  enonce: Comment demande-t-on le prénom de quelqu'un en anglais ? Écris la question complète.
  reponse:
    acceptees:
    - What's your name?
    - What is your name?
    fautes_tolerees: 1
  indices:
    relance: Cette question commence par le mot interrogatif qui veut dire "quoi" ou "quel".
    methode: 'La structure est : mot interrogatif + "is" + "your" + le mot anglais pour « prénom ».'
    etape: La question commence par « What » et se termine par le mot anglais qui veut dire « nom » ou « prénom ».
  pieges:
  - si:
      valeur: how are you
    relance: '"How are you?" demande comment va la personne, pas comment elle s''appelle. Cherche une autre question.'
  solution: '"What''s your name?" (ou "What is your name?") est la question pour demander le prénom de quelqu''un.'
- id: ordre-mini-dialogue
  type: ordre
  difficulte: 2
  enonce: Remets ce court dialogue de présentation dans l'ordre logique.
  reponse:
    elements:
    - id: a
      texte: Hi! What's your name?
    - id: b
      texte: My name is Sam.
    - id: c
      texte: Nice to meet you, Sam!
  indices:
    relance: Quelle phrase pose la question du prénom, et laquelle réagit après avoir entendu la réponse ?
    methode: Un dialogue de présentation commence par une salutation et une question, puis vient la réponse, puis la réaction.
    etape: '"Hi! What''s your name?" est la première réplique : elle ouvre la conversation.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux répliques voisines sont inversées. Laquelle donne le prénom, et laquelle réagit ensuite ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la question du début, puis la réponse avec le prénom, puis la réaction finale.
  solution: D'abord "Hi! What's your name?", puis "My name is Sam.", puis "Nice to meet you, Sam!".
- id: association-formules
  type: association
  difficulte: 2
  enonce: Associe chaque phrase anglaise à ce qu'elle permet de faire.
  reponse:
    gauche:
    - id: a
      texte: Hello!
    - id: b
      texte: Goodbye!
    - id: c
      texte: Thank you!
    - id: d
      texte: Sorry!
    droite:
    - id: x
      texte: Saluer quelqu'un
    - id: y
      texte: Quitter quelqu'un poliment
    - id: z
      texte: Remercier quelqu'un
    - id: w
      texte: S'excuser
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: 'Commence par la phrase la plus simple à reconnaitre : "Hello!" sert à saluer.'
    methode: 'Chaque phrase a une seule fonction : saluer, quitter, remercier ou s''excuser.'
    etape: '"Goodbye!" se dit quand on part : associe-la à "quitter quelqu''un poliment".'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Repère la phrase qui sert à s''excuser : elle contient "Sorry".'
  - si:
      diagnostic: associations_fausses
    relance: Commence par "Hello!", la plus facile, puis distingue les trois autres une par une.
  solution: '"Hello!" = saluer ; "Goodbye!" = quitter poliment ; "Thank you!" = remercier ; "Sorry!" = s''excuser.'
- id: feliciter
  type: choix
  difficulte: 2
  enonce: Ton correspondant marque un but au football. Que lui dis-tu pour le féliciter ?
  reponse:
    options:
    - id: a
      texte: Well done!
    - id: b
      texte: Sorry!
    - id: c
      texte: Nice to meet you!
    bonnes:
    - a
  indices:
    relance: Tu veux lui dire « bravo ! ».
    methode: Une phrase sert à s'excuser, une autre à une première rencontre. Il en reste une pour féliciter.
    etape: « Sorry! » veut dire « pardon ». Ce n'est pas un bravo.
  pieges:
  - si:
      contient:
      - b
    relance: « Sorry! » sert à s'excuser. Ton camarade n'a rien fait de mal, il a marqué un but.
  - si:
      contient:
      - c
    relance: « Nice to meet you! » se dit quand on rencontre quelqu'un pour la première fois, pas pour féliciter.
  solution: « Well done! » veut dire « bravo ! ». C'est la formule pour féliciter.
- id: relancer-and-you
  type: texte_court
  difficulte: 2
  enonce: Ta correspondante te demande « How are you? ». Tu réponds « I'm fine, thank you. ». Pour lui retourner la question,
    tu ajoutes « And ___? » (Et toi ?). Quel mot manque ?
  reponse:
    acceptees:
    - you
    fautes_tolerees: 0
  indices:
    relance: C'est le petit mot qui veut dire « toi » ou « tu » en anglais.
    methode: Pour retourner une question, on dit « And » suivi du mot qui désigne la personne à qui on parle.
    etape: Ce mot se trouve déjà dans la question « How are ...? » de ta correspondante.
  pieges:
  - si:
      valeur: me
    relance: « me » veut dire « moi ». Ici, tu veux parler de ta correspondante, pas de toi.
  solution: On dit « And you? », qui veut dire « et toi ? ». On monte la voix à la fin, car c'est une question.
- id: presenter-un-ami
  type: choix
  difficulte: 3
  enonce: Tu veux présenter ton ami Hugo à ta correspondante anglaise, Lucy. Quelle suite de phrases convient ?
  reponse:
    options:
    - id: a
      texte: Lucy, this is Hugo. Hugo, this is Lucy.
    - id: b
      texte: Lucy, my name is Hugo.
    - id: c
      texte: Lucy, goodbye Hugo.
    bonnes:
    - a
  indices:
    relance: Tu ne parles pas de toi, tu présentes une autre personne. Quelle formule sert à dire « voici » ?
    methode: Pour présenter quelqu'un, on dit « This is » suivi de son prénom. On peut le faire dans les deux sens.
    etape: Une seule réponse utilise « this is ».
  pieges:
  - si:
      contient:
      - b
    relance: « My name is Hugo » voudrait dire que c'est toi qui t'appelles Hugo. Or tu présentes ton ami.
  - si:
      contient:
      - c
    relance: « goodbye » sert à dire au revoir. Ici, Lucy et Hugo font connaissance.
  solution: « Lucy, this is Hugo. Hugo, this is Lucy. » On présente chacun à l'autre avec « This is... » (voici...).
- id: dialogue-complet
  type: ouverte
  difficulte: 3
  enonce: Écris un petit dialogue de 6 répliques entre toi et un enfant anglais qui arrive dans ta classe. Il faut une salutation,
    une présentation, une petite question pour relancer, une formule de politesse et un au revoir. Joue-le ensuite à voix
    haute avec quelqu'un de ta famille.
  criteres:
  - Le dialogue s'ouvre par une salutation et se ferme par un mot d'au revoir.
  - Il contient une présentation (My name is...) et une question de relance (And you?, How old are you?...).
  - Il contient au moins une formule de politesse (please, thank you, sorry).
  indices:
    relance: Que dit-on en tout premier quand on voit quelqu'un arriver ?
    methode: Suis l'ordre de la fiche. Saluer, se présenter, relancer, être poli, puis dire au revoir.
    etape: Pour relancer, tu peux demander l'âge avec « How old are you? ».
  solution: 'Exemple : « Hello! » — « Hi! » — « My name is Léa. What''s your name? » — « My name is Jack. » — « How old are
    you? » — « I''m nine. Thank you! Goodbye! »'
