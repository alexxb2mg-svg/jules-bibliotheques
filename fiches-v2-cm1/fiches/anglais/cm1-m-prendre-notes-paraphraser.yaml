    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : rédiger une phrase trop longue fait perdre du temps et fait manquer les informations suivantes.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : les nombres et les prix sont précisément des détails factuels essentiels à noter.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la prise de notes se fait pendant l''écoute de l''information.'
  solution: Noter directement l'information importante, c'est-à-dire le prix (« 5 pounds » ou « 5£ »). C'est exact. En prise
