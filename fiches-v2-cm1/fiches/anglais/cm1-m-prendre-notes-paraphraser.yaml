format: 2
notion: cm1-m-prendre-notes-paraphraser
version: 2
etat: verifiee
declencheurs:
- noter un prix ou un nombre entendu en anglais
- traduire une consigne anglaise pour un camarade
- recopier une liste de mots anglais sans erreur
- aider un camarade à comprendre une consigne en anglais
- prendre des notes en anglais
- redire avec ses propres mots
- noter une date en anglais
prerequis:
- cm1-ee-epeler-copier-ecrire-sous-dictee
couverture: Travaille le fait de noter des informations simples (nombres, prix, dates, noms) et de traduire une consigne simple
  pour aider un camarade. Ne couvre pas la prise de notes sur un texte long ni la traduction de phrases complexes.
essentiel: 'Prendre des notes, c''est écrire vite une information utile qu''on vient d''entendre ou de lire. Ce peut être
  un nombre, un prix, une date, un prénom ou un lieu. Tu n''écris pas toute la phrase, seulement l''information dont tu as
  besoin.


  Pour bien noter, concentre-toi sur les mots utiles et laisse de côté le reste. Dans « The pen costs two pounds », l''information
  utile est le prix : deux livres (la monnaie anglaise), que tu peux noter « 2 £ ».


  Recopier une liste de mots connus en anglais demande de l''attention. Les mots anglais ne s''écrivent pas toujours comme
  ils se prononcent. Vérifie donc chaque lettre en relisant ta copie, mot par mot. Tu peux aussi écrire sous la dictée ou
  épeler des mots très courants que tu connais déjà, par exemple pour aider un camarade.


  Paraphraser, c''est redire la même idée autrement, avec ses propres mots. En classe d''anglais, cela sert souvent à aider
  un camarade : tu lui redis une consigne en français. Par exemple, si la maitresse dit « Open your book », tu peux dire à
  ton camarade « Elle dit d''ouvrir ton livre ».


  Pour paraphraser, ne traduis pas mot à mot. Repère d''abord l''action demandée (le verbe), puis redis l''idée générale simplement.
  Vérifie à la fin que ta phrase garde bien le sens de départ.

  '
methode:
- 'Écoute ou lis en te concentrant sur les mots utiles : chiffres, prix, dates, prénoms, lieux.'
- Note juste l'information utile, pas toute la phrase.
- Pour une liste de mots, recopie lentement puis relis chaque mot lettre par lettre.
- Pour aider un camarade, repère d'abord le verbe d'action de la consigne.
- Redis la consigne en français avec tes propres mots, sans traduire mot à mot.
- Vérifie que ta note ou ta reformulation garde bien le sens de départ.
vocabulaire:
- terme: prendre des notes
  definition: écrire vite les informations utiles qu'on entend ou qu'on lit, pour s'en souvenir.
- terme: paraphraser
  definition: redire la même idée autrement, avec ses propres mots.
- terme: to translate
  definition: traduire.
- terme: a note
  definition: une note, ce qu'on écrit pour se souvenir de quelque chose.
- terme: to help
  definition: aider.
- terme: pound
  definition: livre, la monnaie du Royaume-Uni (symbole £).
erreurs_frequentes:
- Vouloir tout noter au lieu de se concentrer sur l'information utile (le nombre, le prix, le prénom).
- Traduire mot à mot au lieu de redire l'idée générale avec ses propres mots.
- Ne pas vérifier sa copie d'une liste de mots et laisser passer une lettre oubliée.
- Écrire un mot anglais comme on l'entend, par exemple « tri » au lieu de « three ».
exemple:
  enonce: 'Ta maitresse dit en anglais : « Open your book on page ten. » Ton camarade n''a pas compris. Que notes-tu pour
    toi, et que lui dis-tu en français ?'
  solution: 'Pour toi, tu notes juste l''information utile : « page 10 ». À ton camarade, tu dis : « Elle dit d''ouvrir ton
    livre à la page dix. » Tu as repéré l''action (open, ouvrir) et l''information (page ten). Tu redis l''idée avec tes propres
    mots, sans traduire chaque mot un par un.'
exercices:
- id: information-utile-a-noter
  type: choix
  difficulte: 1
  enonce: 'Un camarade anglais te dit : « The pen costs two pounds. » Que notes-tu pour t''en souvenir ?'
  reponse:
    options:
    - id: a
      texte: 'Le prix : deux livres'
    - id: b
      texte: La couleur du stylo
    - id: c
      texte: Le jour de la semaine
    bonnes:
    - a
  indices:
    relance: La phrase donne surtout une information sur combien coute le stylo.
    methode: 'Le mot « costs » (coute) introduit toujours un prix : c''est l''information utile à noter.'
    etape: « Two pounds » est le prix donné dans la phrase.
  pieges:
  - si:
      contient:
      - b
    relance: La phrase ne parle pas de la couleur du stylo. Cherche l'information vraiment donnée.
  - si:
      contient:
      - c
    relance: Aucun jour de la semaine n'est mentionné dans cette phrase. Cherche l'information sur le prix.
  solution: 'L''information utile à noter est le prix : deux livres (« two pounds »).'
- id: traduire-une-consigne
  type: texte_court
  difficulte: 2
  enonce: Ta maitresse dit « Stand up, please. » Traduis cette consigne en français pour un camarade, en un seul mot-clé.
  reponse:
    acceptees:
    - lève-toi
    - levez-vous
    - debout
    fautes_tolerees: 2
  indices:
    relance: « Stand up » est un verbe d'action très courant en classe.
    methode: Ces deux mots anglais te disent de changer de position, de la position assise à une autre.
    etape: Ces deux mots anglais désignent l'action de se mettre en position verticale.
  pieges:
  - si:
      valeur: please
    relance: '« Please » veut dire « s''il te plait » : ce n''est pas l''action demandée. Cherche le verbe.'
  solution: « Stand up » veut dire « lève-toi » ou « debout ».
- id: ordre-etapes-paraphrase
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour aider un camarade à comprendre une consigne en anglais.
  reponse:
    elements:
    - id: a
      texte: Écouter la consigne en entier
    - id: b
      texte: Repérer le verbe d'action principal
    - id: c
      texte: Redire la consigne en français avec ses propres mots
    - id: d
      texte: Vérifier que le camarade a bien compris
  indices:
    relance: Quelle étape se fait avant même de commencer à parler à son camarade ?
    methode: On écoute d'abord tout, puis on repère l'action, puis on explique, puis on vérifie.
    etape: Écouter la consigne en entier est la première étape.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle consiste à repérer le verbe, et laquelle à reformuler ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par écouter, puis repère l'action, puis reformule en français, et vérifie à la fin.
  solution: D'abord écouter la consigne en entier, puis repérer le verbe d'action, puis redire la consigne en français avec
    ses propres mots, enfin vérifier que le camarade a compris.
- id: association-notes-informations
  type: association
  difficulte: 2
  enonce: Associe chaque phrase entendue à l'information à noter.
  reponse:
    gauche:
    - id: a
      texte: My name is Tom.
    - id: b
      texte: It costs five pounds.
    - id: c
      texte: I am ten years old.
    - id: d
      texte: I live in London.
    droite:
    - id: x
      texte: Un prénom
    - id: y
      texte: Un prix
    - id: z
      texte: Un âge
    - id: w
      texte: Un lieu
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: 'Commence par la phrase la plus facile : celle qui donne un prénom.'
    methode: 'Chaque phrase donne un seul type d''information : prénom, prix, âge ou lieu.'
    etape: '« My name is Tom » donne un prénom : associe-la à « un prénom ».'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère la phrase qui donne un prix, avec le mot « costs ».
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le prénom, puis distingue le prix, l'âge et le lieu.
  solution: « My name is Tom » = un prénom ; « It costs five pounds » = un prix ; « I am ten years old » = un âge ; « I live
    in London » = un lieu.
- id: noter-un-nombre
  type: nombre
  difficulte: 1
  enonce: 'Tu entends : « The bus leaves at twelve. » Note en chiffres l''heure du départ du bus.'
  reponse:
    valeur: '12'
  indices:
    relance: Quel mot de la phrase est un nombre ?
    methode: Les nombres de dix à vingt se disent ten, eleven, twelve, thirteen...
    etape: « Twelve » vient juste après « eleven », qui vient juste après « ten ».
  pieges:
  - si:
      valeur: '2'
    relance: « Two » veut dire deux. Ici, le mot entendu est plus long, il commence par « tw » mais c'est un autre nombre.
  - si:
      valeur: '20'
    relance: Vingt se dit « twenty ». Le mot entendu est plus petit que vingt.
  solution: « Twelve » veut dire douze. On note 12.
- id: copie-sans-faute
  type: choix
  difficulte: 2
  enonce: Tu recopies la liste « red, blue, green, yellow ». Quelle copie est sans faute ?
  reponse:
    options:
    - id: a
      texte: red, blue, green, yellow
    - id: b
      texte: red, blu, green, yelow
    - id: c
      texte: rad, blue, grin, yellow
    bonnes:
    - a
  indices:
    relance: Compare chaque mot copié avec le modèle, lettre par lettre.
    methode: Les mots anglais ne s'écrivent pas comme ils se prononcent. Il faut vérifier chaque lettre.
    etape: Regarde d'abord le mot « blue » dans chaque copie. Est-ce qu'il a bien sa dernière lettre ?
  pieges:
  - si:
      contient:
      - b
    relance: Dans cette copie, deux mots ont perdu une lettre. Compare « blue » et « yellow » avec le modèle.
  - si:
      contient:
      - c
    relance: Dans cette copie, deux mots ont une lettre changée. Compare « red » et « green » avec le modèle.
  solution: La copie « red, blue, green, yellow » est identique au modèle, lettre par lettre.
- id: paraphrase-juste
  type: choix
  difficulte: 3
  enonce: La maitresse dit « Take your pencil and draw a cat. » Quelle phrase en français aide le mieux ton camarade ?
  reponse:
    options:
    - id: a
      texte: Elle dit de prendre ton crayon et de dessiner un chat.
    - id: b
      texte: Prends ton crayon et un chat.
    - id: c
      texte: Elle parle d'un chat.
    bonnes:
    - a
  indices:
    relance: La consigne demande deux actions. Lesquelles ?
    methode: Repère les deux verbes d'action (take, draw), puis vérifie que la phrase en français garde les deux.
    etape: « Take » veut dire prendre et « draw » veut dire dessiner. Quelle phrase garde les deux actions ?
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase oublie une action. Que faut-il faire avec le chat ?
  - si:
      contient:
      - c
    relance: Cette phrase est trop vague. Ton camarade ne saura pas ce qu'il doit faire.
  solution: « Elle dit de prendre ton crayon et de dessiner un chat. » La phrase garde les deux actions (prendre, dessiner)
    sans traduire mot à mot.
- id: noter-et-expliquer
  type: ouverte
  difficulte: 3
  enonce: 'Un adulte te lit lentement : « Hello! My name is Sarah. I am eleven. I live in Leeds. I like horses. » Note les
    informations utiles, puis explique en français à quelqu''un qui est Sarah.'
  criteres:
  - L'élève note au moins trois informations utiles (prénom, âge, ville, gout) sans recopier toutes les phrases.
  - L'élève redit les informations en français avec ses propres mots, sans traduire mot à mot.
  - Les informations notées et redites gardent le sens de départ (Sarah, 11 ans, Leeds, les chevaux).
  indices:
    relance: Quelles informations donnent un prénom, un âge et un lieu ?
    methode: Note seulement les mots utiles, puis fais une phrase en français à partir de tes notes.
    etape: 'Commence ta note par le prénom. Puis tu peux dire : « Elle s''appelle... »'
  solution: 'Notes : « Sarah, 11 ans, Leeds, chevaux ». En français : « Elle s''appelle Sarah, elle a onze ans, elle habite
    à Leeds et elle aime les chevaux. »'
- id: nblm-que-dois-tu-noter-en-priorite-lorsque-tu-1
  type: choix
  difficulte: 2
  enonce: Que dois-tu noter en priorité lorsque tu écoutes un message en anglais pour prendre des notes efficacement ?
  reponse:
    options:
    - id: o1
      texte: Uniquement les informations utiles comme les prix ou les nombres.
    - id: o2
      texte: Tous les mots de la phrase sans en oublier un seul.
    - id: o3
      texte: Seulement les mots difficiles que tu ne comprends pas.
    - id: o4
      texte: La traduction intégrale de chaque phrase en français.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui est vraiment important et rapide à écrire pour garder une trace.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : chercher à tout réécrire fait perdre du temps au lieu de cibler l''essentiel.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : il faut noter les informations clés compréhensibles (prix, nombres) et non les mots inconnus
      inutiles.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : traduire chaque mot n''est pas une prise de notes rapide et efficace.'
  solution: Uniquement les informations utiles comme les prix ou les nombres. C'est exact. Prendre des notes consiste à relever
    les éléments essentiels comme un nombre, un prix ou un prénom sans tout réécrire.
- id: nblm-la-maitresse-dit-open-your-book-on-page-2
  type: choix
  difficulte: 2
  enonce: 'La maîtresse dit : « Open your book on page ten. » Ton camarade n''a pas compris. Que dois-tu faire pour l''aider
    à paraphraser la consigne ?'
  reponse:
    options:
    - id: o1
      texte: Lui expliquer en français avec tes propres mots qu'il faut ouvrir le livre à la page 10.
    - id: o2
      texte: Traduire mot à mot chaque terme anglais dans l'ordre exact sans réfléchir au sens.
    - id: o3
      texte: Répéter la phrase en anglais plus fort sans rien expliquer.
    - id: o4
      texte: Lui dire de chercher tous les mots dans un dictionnaire.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la meilleure façon d'exprimer le sens global de la consigne en français.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la traduction mot à mot rend souvent la phrase lourde ou confuse.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : répéter en anglais n''aide pas un camarade qui ne comprend pas la langue.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la médiation demande d''aider directement son camarade et non de le renvoyer à une recherche
      complexe.'
  solution: Lui expliquer en français avec tes propres mots qu'il faut ouvrir le livre à la page 10. C'est exact. Paraphraser
    consiste à transmettre l'idée générale de la consigne en français pour que le camarade comprenne.
- id: nblm-comment-dois-tu-proceder-pour-recopier-u-3
  type: choix
  difficulte: 2
  enonce: Comment dois-tu procéder pour recopier une liste de mots anglais sans faire d'erreur ?
  reponse:
    options:
    - id: o1
      texte: Relire attentivement ta copie lettre par lettre pour vérifier qu'aucune lettre n'a été oubliée.
    - id: o2
      texte: Recopier le plus vite possible sans te relire.
    - id: o3
      texte: Changer l'orthographe des mots si la prononciation anglaise est différente.
    - id: o4
      texte: Recopier seulement la première lettre de chaque mot.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qu'il faut faire une fois que tu as fini d'écrire chaque mot.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : recopier trop vite sans se relire fait laisser passer des lettres oubliées.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : il faut respecter strictly le modèle écrit sans inventer une orthographe phonétique.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : une copie complète exige de réécrire le mot entier avec toutes ses lettres.'
  solution: Relire attentivement ta copie lettre par lettre pour vérifier qu'aucune lettre n'a été oubliée. C'est exact. La
    vérification lettre par lettre permet d'éviter les erreurs d'inattention et les oublis.
- id: nblm-dans-le-cadre-de-la-mediation-en-classe-4
