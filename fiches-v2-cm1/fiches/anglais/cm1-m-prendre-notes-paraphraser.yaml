  difficulte: 2
  enonce: Dans le cadre de la médiation en classe, quel est ton rôle quand tu aides un camarade à comprendre une consigne
    anglaise ?
  reponse:
    options:
    - id: o1
      texte: Avoir recours à la traduction ou la reformulation pour lui expliquer le sens de la consigne.
    - id: o2
      texte: Faire l'exercice à sa place sans lui expliquer ce qu'il faut faire.
    - id: o3
      texte: Lui interdire de parler français et lui dire de se débrouiller.
    - id: o4
      texte: Ignorer les consignes du professeur et inventer une autre activité.
    bonnes:
    - o1
  indices:
    relance: 'Considère l''objectif de la médiation : transmettre clairement le message de l''enseignant.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : faire à la place du camarade ne l''aide pas à comprendre la consigne.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : le rôle du médiateur est d''apporter une aide bienveillante et non de bloquer l''échange.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : l''explication doit rester fidèle à la consigne donnée par le professeur.'
  solution: Avoir recours à la traduction ou la reformulation pour lui expliquer le sens de la consigne. C'est exact. La médiation
    permet d'utiliser la traduction ou l'explication pour débloquer la compréhension d'un pair.
- id: nblm-si-tu-entends-un-document-oral-en-anglai-5
  type: choix
  difficulte: 2
  enonce: Si tu entends un document oral en anglais mentionnant un prix (« five pounds »), quelle est la bonne attitude pour
    prendre des notes ?
  reponse:
    options:
    - id: o1
      texte: Noter directement l'information importante, c'est-à-dire le prix (« 5 pounds » ou « 5£ »).
    - id: o2
      texte: Rédiger une longue phrase complète racontant qui vend l'objet.
    - id: o3
      texte: Ignorer le prix car les chiffres ne sont pas importants.
    - id: o4
      texte: Attendre la fin du cours pour demander à l'enseignant de réexpliquer.
    bonnes:
    - o1
  indices:
