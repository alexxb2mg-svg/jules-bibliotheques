format: 2
notion: cm1-m-prendre-notes-paraphraser
version: 1
etat: verifiee
declencheurs:
- noter un prix ou un nombre entendu en anglais
- traduire une consigne anglaise pour un camarade
- recopier une liste de mots anglais sans erreur
- aider un camarade à comprendre une consigne en anglais
prerequis:
- cm1-ee-epeler-copier-ecrire-sous-dictee
couverture: Travaille le fait de noter des informations simples (nombres, prix, noms) et de traduire une consigne simple pour
  aider un camarade. Ne couvre pas la prise de notes sur un texte long ni la traduction de phrases complexes.
essentiel: 'Prendre des notes, c''est écrire rapidement une information utile qu''on vient d''entendre ou de lire, comme un

  prix, un nombre ou un prénom.


  Paraphraser, c''est redire la même idée autrement, souvent en passant d''une langue à l''autre pour aider un

  camarade à comprendre une consigne. Par exemple, si la maitresse dit "Open your book", tu peux dire à ton

  camarade "elle dit d''ouvrir ton livre".


  Pour bien noter une information, il faut se concentrer sur les mots utiles (chiffres, prix, prénoms) et

  laisser de côté le reste. On peut aussi recopier une liste de mots connus sans faute, en vérifiant chaque

  lettre.

  '
methode:
- 'Écoute ou lis en te concentrant sur les mots utiles : chiffres, prix, prénoms, lieux.'
- Note juste l'information utile, pas toute la phrase.
- Pour aider un camarade, redis la consigne en français avec tes propres mots, sans traduire mot à mot.
- Vérifie que ta note ou ta traduction garde bien le sens de départ.
- Relis ta copie d'une liste de mots pour vérifier qu'aucune lettre ne manque.
vocabulaire:
- terme: to translate
  definition: traduire
- terme: a note
  definition: une note, ce qu'on écrit pour se souvenir de quelque chose
- terme: to help
  definition: aider
erreurs_frequentes:
- Vouloir tout noter au lieu de se concentrer sur l'information utile (le nombre, le prix, le prénom).
- Traduire mot à mot au lieu de redire l'idée générale avec ses propres mots.
- Ne pas vérifier sa copie d'une liste de mots et laisser passer une lettre oubliée.
exemple:
  enonce: 'Ta maitresse dit en anglais : "Open your book on page ten." Ton camarade n''a pas compris. Que lui dis-tu en français
    ?'
  solution: 'Tu peux lui dire : "Elle dit d''ouvrir ton livre à la page dix." Tu redis l''idée avec tes propres mots, sans
    traduire chaque mot un par un.'
exercices:
- id: information-utile-a-noter
  type: choix
  difficulte: 1
  enonce: 'Un camarade anglais te dit : "The pen costs two pounds." Que notes-tu pour t''en souvenir ?'
  reponse:
    options:
    - id: a
      texte: 'Le prix : deux livres'
    - id: b
      texte: La couleur du stylo
    - id: c
      texte: Le jour de la semaine
    bonnes:
    - a
  indices:
    relance: La phrase donne surtout une information sur combien coute le stylo.
    methode: 'Le mot "costs" (coute) introduit toujours un prix : c''est l''information utile à noter.'
    etape: '"Two pounds" est le prix donné dans la phrase.'
  pieges:
  - si:
      contient:
      - b
    relance: La phrase ne parle pas de la couleur du stylo. Cherche l'information vraiment donnée.
  - si:
      contient:
      - c
    relance: Aucun jour de la semaine n'est mentionné dans cette phrase. Cherche l'information sur le prix.
  solution: 'L''information utile à noter est le prix : deux livres ("two pounds").'
- id: traduire-une-consigne
  type: texte_court
  difficulte: 2
  enonce: Ta maitresse dit "Stand up, please." Traduis cette consigne en français pour un camarade, en un seul mot-clé.
  reponse:
    acceptees:
    - lève-toi
    - levez-vous
    - debout
    fautes_tolerees: 2
  indices:
    relance: '"Stand up" est un verbe d''action très courant en classe.'
    methode: Ces deux mots anglais te disent de changer de position, de la position assise à une autre.
    etape: Ces deux mots anglais désignent l'action de se mettre en position verticale.
  pieges:
  - si:
      valeur: please
    relance: '"Please" veut dire "s''il te plait" : ce n''est pas l''action demandée. Cherche le verbe.'
  solution: '"Stand up" veut dire "lève-toi" ou "debout".'
- id: ordre-etapes-paraphrase
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour aider un camarade à comprendre une consigne en anglais.
  reponse:
    elements:
    - id: a
      texte: Écouter la consigne en entier
    - id: b
      texte: Repérer le verbe d'action principal
    - id: c
      texte: Redire la consigne en français avec ses propres mots
  indices:
    relance: Quelle étape se fait avant même de commencer à parler à son camarade ?
    methode: On écoute d'abord tout, puis on repère l'action, puis on explique.
    etape: Écouter la consigne en entier est la première étape.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle consiste à repérer le verbe, et laquelle à reformuler ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par écouter, puis repère l'action, puis reformule en français.
  solution: D'abord écouter la consigne en entier, puis repérer le verbe d'action, puis redire la consigne en français avec
    ses propres mots.
- id: association-notes-informations
  type: association
  difficulte: 2
  enonce: Associe chaque phrase entendue à l'information à noter.
  reponse:
    gauche:
    - id: a
      texte: My name is Tom.
    - id: b
      texte: It costs five pounds.
    - id: c
      texte: I am ten years old.
    droite:
    - id: x
      texte: Un prénom
    - id: y
      texte: Un prix
    - id: z
      texte: Un âge
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par la phrase la plus facile : celle qui donne un prénom.'
    methode: 'Chaque phrase donne un seul type d''information : prénom, prix, ou âge.'
    etape: '"My name is Tom" donne un prénom : associe-la à "un prénom".'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère la phrase qui donne un prix.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le prénom, puis distingue le prix et l'âge.
  solution: '"My name is Tom" = un prénom ; "It costs five pounds" = un prix ; "I am ten years old" = un âge.'
