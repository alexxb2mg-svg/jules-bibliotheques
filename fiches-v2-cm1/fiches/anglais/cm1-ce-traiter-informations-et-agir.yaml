format: 2
notion: cm1-ce-traiter-informations-et-agir
version: 2
etat: verifiee
declencheurs:
- suivre une recette de cuisine en anglais
- comprendre une consigne écrite en anglais
- reconnaitre un ordre écrit en anglais
- trouver le bon ingrédient dans une recette anglaise
- cut the apple
- mix the eggs
- recette de pancakes en anglais
- scissors glue ruler
- spoon bowl knife
prerequis:
- cm1-ce-comprendre-textes-courts-simples
essentiel: 'Lire pour agir, c''est lire une consigne, un mode d''emploi ou une recette, puis faire les bons gestes dans le
  bon ordre.


  Les consignes écrites utilisent l''impératif. Le verbe est en premier, sans « I » ni « you » devant. Exemples : « Cut the
  apple » (coupe la pomme), « Mix the eggs » (mélange les œufs), « Put the sugar in the bowl » (mets le sucre dans le bol),
  « Open your book » (ouvre ton livre). Quand tu lis le verbe, tu fais le geste.


  Une recette a deux parties. D''abord la liste des ingrédients (« ingredients ») : ce qu''il faut acheter ou sortir du placard.
  Ensuite les étapes, numérotées 1, 2, 3... : ce qu''il faut faire, dans l''ordre. Une image accompagne souvent chaque étape
  : elle t''aide à comprendre l''action.


  Il faut aussi reconnaitre les objets. Les ustensiles de cuisine : « a bowl » (un bol), « a spoon » (une cuillère), « a knife
  » (un couteau), « a glass » (un verre). Les fournitures scolaires : « a pencil » (un crayon), « scissors » (des ciseaux),
  « glue » (de la colle), « a ruler » (une règle).


  Attention à ne pas confondre un ingrédient (ce qu''on mange : « sugar », « milk ») et un ustensile (l''objet qui sert :
  « spoon », « bowl »).

  '
methode:
- 'Repère d''abord le verbe au début de chaque phrase : c''est lui qui dit quoi faire.'
- Utilise l'image à côté de chaque étape pour vérifier que tu as bien compris l'action.
- Repère les mots des ingrédients ou des fournitures pour savoir quel objet utiliser.
- 'Suis l''ordre des étapes numérotées : ne fais pas une étape avant une autre.'
- Si un mot est inconnu, regarde l'image ou le contexte de la phrase pour deviner son sens.
vocabulaire:
- terme: cut / mix / put
  definition: Couper / mélanger / mettre. Ce sont des verbes à l'impératif dans une recette.
- terme: impératif
  definition: La forme du verbe qui donne un ordre ou une consigne, placée en début de phrase.
- terme: ingredients
  definition: Les ingrédients d'une recette, ce qu'on va manger.
- terme: a bowl / a spoon / a knife
  definition: Un bol / une cuillère / un couteau, des ustensiles de cuisine.
- terme: scissors / glue / a ruler
  definition: Des ciseaux / de la colle / une règle, des fournitures scolaires.
erreurs_frequentes:
- Ne pas suivre l'ordre des étapes et mélanger les actions de la recette.
- Confondre un nom d'ingrédient avec un nom d'ustensile (par exemple "sugar" et "spoon").
- Chercher à traduire chaque mot au lieu de s'aider des images pour comprendre l'action.
- Lire la consigne sans faire le geste demandé par le verbe.
exemple:
  enonce: 'Une recette dit : "1. Cut the banana. 2. Put it in the bowl. 3. Mix with milk." Que fais-tu en premier ?'
  solution: Tu coupes la banane en premier (« Cut the banana »), car c'est l'étape numéro 1. Le verbe à l'impératif « Cut
    » dit exactement quoi faire. Ensuite tu la mets dans le bol, puis tu mélanges avec le lait.
exercices:
- id: reperer-verbe-consigne
  type: choix
  difficulte: 1
  enonce: Dans la consigne "Put the pencil in your bag.", quel verbe dit ce qu'il faut faire ?
  reponse:
    options:
    - id: a
      texte: Put
    - id: b
      texte: Pencil
    - id: c
      texte: Bag
    bonnes:
    - a
  indices:
    relance: Le verbe d'une consigne à l'impératif est toujours le premier mot de la phrase.
    methode: 'Cherche le mot qui dit une action : mettre, prendre, couper...'
    etape: 'Le premier mot de la phrase veut dire "mets" : c''est l''action demandée.'
  pieges:
  - si:
      contient:
      - b
    relance: '"Pencil" (crayon) est l''objet, pas l''action à faire. Cherche le verbe.'
  - si:
      contient:
      - c
    relance: '"Bag" (sac) est l''endroit où mettre le crayon, pas le verbe d''action.'
  solution: '"Put" (mets) est le verbe qui dit quoi faire dans cette consigne.'
- id: geste-consigne
  type: choix
  difficulte: 1
  enonce: 'Sur ta fiche de travail, il est écrit : « Cut the picture. » Quel geste fais-tu ?'
  reponse:
    options:
    - id: a
      texte: Je découpe l'image avec des ciseaux.
    - id: b
      texte: Je colorie l'image.
    - id: c
      texte: Je colle l'image dans mon cahier.
    bonnes:
    - a
  indices:
    relance: Le premier mot de la consigne est le verbe. Que veut dire « Cut » ?
    methode: Repère le verbe au début de la phrase, puis fais le geste qu'il demande.
    etape: Dans une recette, « Cut the banana » veut dire « coupe la banane ».
  pieges:
  - si:
      contient:
      - b
    relance: Colorier se dirait « Colour ». Ici, le verbe est « Cut ».
  - si:
      contient:
      - c
    relance: Coller se dirait « Glue » ou « Stick ». Relis le verbe au début de la consigne.
  solution: « Cut » veut dire « coupe » ou « découpe ». Tu découpes l'image avec des ciseaux.
- id: ingredient-recette
  type: texte_court
  difficulte: 2
  enonce: 'Une recette dit : "Mix the flour, the eggs and the milk." Écris un des trois ingrédients cités.'
  reponse:
    acceptees:
    - flour
    - the flour
    - eggs
    - the eggs
    - milk
    - the milk
    - farine
    - oeufs
    - œufs
    - lait
    fautes_tolerees: 1
  indices:
    relance: Trois ingrédients sont donnés juste après le verbe "Mix" (mélange).
    methode: 'Cherche les mots séparés par des virgules et par "and" : ce sont les ingrédients.'
    etape: 'Trois mots sont cités juste après le verbe "Mix", séparés par une virgule et par "and" : donne l''un de ces trois
      mots.'
  pieges:
  - si:
      valeur: mix
    relance: '"Mix" est le verbe de la consigne (mélanger), pas un ingrédient. Cherche un des mots après ce verbe.'
  solution: Les ingrédients cités sont "flour" (farine), "eggs" (œufs) et "milk" (lait).
- id: ordre-etapes-recette
  type: ordre
  difficulte: 2
  enonce: Range ces trois étapes d'une recette dans l'ordre logique.
  reponse:
    elements:
    - id: a
      texte: Cut the strawberries.
    - id: b
      texte: Put them in a bowl.
    - id: c
      texte: Add some sugar and mix.
  indices:
    relance: Quelle étape doit se faire avant de pouvoir mettre les fraises dans un bol ?
    methode: On coupe d'abord l'ingrédient, puis on le place dans un récipient, puis on termine la préparation.
    etape: '"Cut the strawberries" doit être fait avant de les mettre dans un bol.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle consiste à mettre les fraises dans le bol, et laquelle à ajouter
      le sucre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord l'étape de découpe, puis celle de mise en bol, puis celle du mélange final.
  solution: D'abord "Cut the strawberries.", puis "Put them in a bowl.", puis "Add some sugar and mix.".
- id: association-objets-usage
  type: association
  difficulte: 2
  enonce: Associe chaque objet à son usage.
  reponse:
    gauche:
    - id: a
      texte: Scissors
    - id: b
      texte: A spoon
    - id: c
      texte: A pencil
    droite:
    - id: x
      texte: Cut paper
    - id: y
      texte: Mix or eat food
    - id: z
      texte: Write on paper
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par l''objet utilisé pour couper : cherche celui qui a une paire de lames.'
    methode: 'Chaque objet a un usage précis : couper, mélanger/manger, ou écrire.'
    etape: '"Scissors" (ciseaux) servent à couper le papier.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère l'objet qui sert à écrire.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord les ciseaux (couper), puis distingue la cuillère et le crayon.
  solution: '"Scissors" = couper le papier ; "A spoon" = mélanger ou manger ; "A pencil" = écrire sur le papier.'
- id: ingredient-ou-ustensile
  type: choix
  difficulte: 2
  enonce: Dans la liste « sugar, bowl, butter, spoon », quels mots sont des ingrédients (des choses qu'on mange) ? (Il y a
    deux bonnes réponses.)
  reponse:
    options:
    - id: a
      texte: sugar
    - id: b
      texte: bowl
    - id: c
      texte: butter
    - id: d
      texte: spoon
    bonnes:
    - a
    - c
  indices:
    relance: Demande-toi pour chaque mot si on peut le manger, ou si c'est un objet de cuisine.
    methode: Les ingrédients se mangent. Les ustensiles servent à préparer ou à manger, mais on ne les mange pas.
    etape: « bowl » est un bol. Il est en vaisselle, on ne le mange pas.
  pieges:
  - si:
      contient:
      - b
    relance: « bowl » est un bol. C'est un ustensile, pas un ingrédient.
  - si:
      contient:
      - d
    relance: « spoon » est une cuillère. On mange avec, mais on ne la mange pas.
  solution: « sugar » (sucre) et « butter » (beurre) sont des ingrédients. « bowl » (bol) et « spoon » (cuillère) sont des
    ustensiles.
- id: fourniture-demandee
  type: texte_court
  difficulte: 3
  enonce: 'La consigne dit : « Take your ruler and draw a line. » De quelle fourniture as-tu besoin ? Écris le mot anglais.'
  reponse:
    acceptees:
    - ruler
    - a ruler
    - your ruler
    fautes_tolerees: 1
  indices:
    relance: La phrase contient deux verbes, « Take » et « draw ». Quel objet faut-il prendre ?
    methode: Après le verbe « Take » (prends), on trouve l'objet à prendre.
    etape: Le mot cherché vient juste après « Take your ». C'est l'objet qui sert à tracer un trait droit.
  pieges:
  - si:
      valeur: line
    relance: « line » est le trait que tu vas tracer, pas la fourniture. Cherche l'objet après « Take your ».
  - si:
      valeur: pencil
    relance: Un crayon peut servir, mais la consigne nomme une autre fourniture. Relis ce qui suit « Take your ».
  solution: Il faut la règle, « ruler ». La consigne veut dire « prends ta règle et trace un trait ».
- id: recette-salade-fruits
  type: choix
  difficulte: 3
  enonce: 'Recette : « Fruit salad. Ingredients: 2 bananas, 1 apple, 10 grapes. 1. Cut the fruit. 2. Put it in a bowl. 3.
    Add orange juice. » Combien de bananes faut-il ?'
  reponse:
    options:
    - id: a
      texte: Deux bananes
    - id: b
      texte: Une banane
    - id: c
      texte: Dix bananes
    bonnes:
    - a
  indices:
    relance: Les quantités sont dans la partie « Ingredients », pas dans les étapes.
    methode: Repère le mot « bananas » dans la liste, puis lis le nombre écrit juste devant.
    etape: Attention, il y a plusieurs nombres dans la recette. Prends seulement celui qui est devant « bananas ».
  pieges:
  - si:
      contient:
      - b
    relance: Le nombre 1 est devant « apple » (pomme), et c'est aussi le numéro de la première étape. Regarde devant « bananas
      ».
  - si:
      contient:
      - c
    relance: Le nombre 10 est devant « grapes » (raisins). Regarde le nombre devant « bananas ».
  solution: 'Dans la liste des ingrédients, on lit « 2 bananas » : il faut deux bananes.'
- id: ma-recette-en-anglais
  type: ouverte
  difficulte: 3
  enonce: 'Avec un adulte, prépare une recette simple (une salade de fruits, une tartine). Écris ensuite la recette en anglais
    : la liste des ingrédients, puis trois étapes numérotées qui commencent chacune par un verbe à l''impératif. Dessine une
    image pour chaque étape.'
  criteres:
  - La recette a une liste d'ingrédients en anglais.
  - Les trois étapes sont numérotées et chacune commence par un verbe à l'impératif (Cut, Put, Mix, Add...).
  - Chaque étape a un dessin qui montre l'action.
  indices:
    relance: Quels aliments as-tu utilisés ? Commence par les écrire en anglais.
    methode: Reprends les verbes de la fiche (cut, put, mix, add) et mets-en un au début de chaque étape.
    etape: Ta première étape peut commencer par « Cut ».
  solution: 'Exemple : Ingredients: bread, butter, jam. 1. Cut the bread. 2. Put butter on the bread. 3. Add some jam. (Avec
    un dessin pour chaque étape.)'
- id: nblm-dans-une-consigne-ecrite-en-anglais-quel-1
  type: choix
  difficulte: 2
  enonce: Dans une consigne écrite en anglais, quelle est la particularité d'une phrase qui donne un ordre à l'impératif ?
  reponse:
    options:
    - id: o1
      texte: Le verbe d'action est placé au début de la phrase, sans sujet devant.
    - id: o2
      texte: Le verbe est toujours placé à la toute fin de la phrase.
    - id: o3
      texte: La phrase commence obligatoirement par le mot 'please'.
    - id: o4
      texte: Il y a toujours le pronom sujet 'you' devant le verbe.
    bonnes:
    - o1
  indices:
    relance: Pense aux phrases de recette comme 'Cut the apple' ou 'Mix the eggs'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : en anglais, le verbe à l''impératif ne se met pas à la fin, mais au tout début.'
  - si:
      contient:
      - o3
    relance: Attention, même si 'please' est poli, l'ordre à l'impératif commence d'abord par le verbe d'action.
  - si:
      contient:
      - o4
    relance: 'C''est faux : à l''impératif affirmatif, il n''y a pas de pronom sujet devant le verbe.'
  solution: Le verbe d'action est placé au début de la phrase, sans sujet devant. C'est exact ! À l'impératif affirmatif en
    anglais, le verbe est placé directement en premier pour donner l'ordre.
