    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : écrire « ze » au lieu de « the » en se basant sur une mauvaise prononciation.'
  - si:
      contient:
