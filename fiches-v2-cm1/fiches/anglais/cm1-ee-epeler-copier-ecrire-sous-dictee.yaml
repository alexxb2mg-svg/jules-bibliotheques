  - si:
      contient:
      - o4
    relance: 'Erreur : la dictée en anglais demande d''écrire le mot anglais entendu.'
  solution: 'Aux lettres qui se prononcent différemment du français, comme le groupe « th ». C''est exact : les sons anglais
