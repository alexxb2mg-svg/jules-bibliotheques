format: 2
notion: cm1-m-identifier-reperes-culturels
version: 2
etat: verifiee
declencheurs:
- connaitre une fête typique des pays anglophones
- reconnaitre une différence de vie entre la France et l'Angleterre
- expliquer une coutume anglaise à un camarade
- reconnaitre un repère culturel du monde anglophone
- Thanksgiving dinner
- drive on the left
- full English breakfast
- Merry Christmas
- Happy Halloween
prerequis: []
essentiel: 'Un repère culturel, c''est une habitude, une fête ou une façon de vivre qui fait partie de la vie d''un pays.
  En comparant la France et les pays où on parle anglais, on peut trouver une similitude (c''est pareil) ou une différence
  (ce n''est pas pareil).


  Une similitude : on fête Noël (« Christmas ») en France et aussi en Angleterre, le 25 décembre.


  Des fêtes sont très importantes dans les pays anglophones. En Angleterre, on fête beaucoup Halloween, le 31 octobre, avec
  des citrouilles et des déguisements. Aux États-Unis, on fête Thanksgiving (« Thanksgiving Day ») le quatrième jeudi de novembre,
  avec un grand repas en famille.


  Des différences de la vie de tous les jours : en Angleterre, on roule à gauche (« they drive on the left »), alors qu''en
  France on roule à droite. Le petit-déjeuner anglais traditionnel (« a full English breakfast ») est plus copieux que le
  petit-déjeuner français, avec des œufs et du bacon.


  Pour parler d''une différence, tu peux utiliser des formules toutes faites : « In France, we drive on the right. In England,
  they drive on the left. » Pour une fête, on souhaite : « Merry Christmas! », « Happy Halloween! », « Happy Thanksgiving!
  ». Tu peux aussi montrer une différence par un geste, par exemple montrer la gauche avec la main.


  Le Royaume-Uni et les États-Unis n''ont pas toutes les mêmes fêtes. Et une habitude différente n''est ni meilleure ni moins
  bonne : elle est juste différente.

  '
methode:
- Lis ou écoute ce que fait l'autre pays (fête, repas, façon de vivre).
- Demande-toi si on fait la même chose en France ou non.
- Dis si c'est une similitude (pareil) ou une différence (pas pareil).
- Pour une fête, retiens sa période de l'année et sa formule (Halloween en octobre, Thanksgiving en novembre, Christmas en
  décembre).
- 'Explique la différence avec une formule simple ou un geste : « In France, we... In England, they... ».'
- Rappelle-toi qu'une habitude différente n'est ni meilleure ni moins bonne, juste différente.
vocabulaire:
- terme: repère culturel
  definition: une habitude, une fête ou une façon de vivre typique d'un pays.
- terme: similitude
  definition: un point commun, quelque chose qui est pareil dans les deux pays.
- terme: différence culturelle
  definition: quelque chose qui ne se fait pas de la même façon dans les deux pays.
- terme: Halloween
  definition: fête du 31 octobre, avec citrouilles et déguisements, très fêtée dans les pays anglophones.
- terme: Thanksgiving
  definition: fête américaine du quatrième jeudi de novembre, avec un grand repas en famille.
- terme: they drive on the left
  definition: ils roulent à gauche (au Royaume-Uni).
- terme: Merry Christmas!
  definition: joyeux Noël, la formule qu'on écrit ou qu'on dit pour Noël.
erreurs_frequentes:
- Confondre Halloween et Thanksgiving, qui n'ont pas la même date ni le même pays.
- Croire que tous les pays anglophones ont les mêmes habitudes (le Royaume-Uni et les États-Unis ne fêtent pas tout pareil).
- Croire que tout est différent, alors qu'il y a aussi des similitudes, comme Noël.
- Penser qu'une habitude différente de la sienne est forcément une erreur ou moins bien.
exemple:
  enonce: Un correspondant américain te dit qu'il fête un grand repas en famille fin novembre. De quelle fête parle-t-il,
    et est-ce une similitude ou une différence avec la France ?
  solution: 'Il parle de « Thanksgiving », une fête américaine du quatrième jeudi de novembre, où les familles se réunissent
    autour d''un grand repas. On ne fête pas Thanksgiving en France : c''est une différence culturelle. Tu peux lui écrire
    « Happy Thanksgiving! ».'
exercices:
- id: identifier-la-fete
  type: choix
  difficulte: 1
  enonce: Quelle fête est associée aux citrouilles et aux déguisements, le 31 octobre, dans les pays anglophones ?
  reponse:
    options:
    - id: a
      texte: Halloween
    - id: b
      texte: Thanksgiving
    - id: c
      texte: Christmas
    bonnes:
    - a
  indices:
    relance: Cette fête a lieu à la fin du mois d'octobre.
    methode: Les citrouilles et les déguisements sont les symboles de cette fête d'automne.
    etape: Cherche, parmi les trois options, celle qui a lieu le 31 octobre.
  pieges:
  - si:
      contient:
      - b
    relance: '"Thanksgiving" a lieu en novembre, avec un grand repas, pas de citrouilles ni de déguisements.'
  - si:
      contient:
      - c
    relance: '"Christmas" (Noël) a lieu en décembre, sans lien avec les citrouilles.'
  solution: '"Halloween", le 31 octobre, est associée aux citrouilles et aux déguisements.'
- id: noel-dans-les-deux-pays
  type: choix
  difficulte: 1
  enonce: On fête Noël (« Christmas ») le 25 décembre en France et aussi en Angleterre. Comment appelle-t-on ce repère culturel
    ?
  reponse:
    options:
    - id: a
      texte: Une similitude
    - id: b
      texte: Une différence
    bonnes:
    - a
  indices:
    relance: Est-ce que les deux pays font la même chose, ou pas ?
    methode: Si c'est la même chose dans les deux pays, c'est un point commun. Sinon, c'est l'autre mot.
    etape: Les deux pays fêtent Noël le même jour. C'est donc un point commun.
  pieges:
  - si:
      contient:
      - b
    relance: On parle de différence quand les deux pays ne font pas la même chose. Ici, est-ce le cas ?
  solution: 'C''est une similitude : on fête Noël le 25 décembre en France comme en Angleterre.'
- id: cote-de-conduite
  type: texte_court
  difficulte: 2
  enonce: 'Au Royaume-Uni, de quel côté de la route conduit-on ? Écris un seul mot : "gauche" ou "droite".'
  reponse:
    acceptees:
    - gauche
    fautes_tolerees: 0
  indices:
    relance: C'est le côté opposé à celui utilisé en France.
    methode: En France on conduit à droite ; au Royaume-Uni, c'est l'inverse.
    etape: Le mot attendu est le contraire de "droite".
  pieges:
  - si:
      valeur: droite
    relance: C'est le côté utilisé en France. Au Royaume-Uni, c'est l'autre côté.
  solution: Au Royaume-Uni, on conduit à gauche.
- id: formule-they-drive
  type: texte_court
  difficulte: 2
  enonce: 'Tu expliques une différence à ton correspondant anglais. Complète la formule en anglais : « In France, we drive
    on the right. In England, they drive on the ___. »'
  reponse:
    acceptees:
    - left
    fautes_tolerees: 1
  indices:
    relance: En Angleterre, roule-t-on du même côté qu'en France ?
    methode: « Right » veut dire droite. Cherche le mot anglais qui veut dire le contraire.
    etape: Relis le vocabulaire de la leçon sur la façon de conduire en Angleterre.
  pieges:
  - si:
      valeur: right
    relance: C'est le côté de la France. En Angleterre, c'est l'autre côté.
  solution: « In England, they drive on the left. » En Angleterre, on roule à gauche ; en France, à droite.
- id: ordre-fetes-annee
  type: ordre
  difficulte: 2
  enonce: Range ces trois fêtes des pays anglophones dans l'ordre de l'année, de la plus tôt à la plus tard.
  reponse:
    elements:
    - id: a
      texte: Halloween (31 octobre)
    - id: b
      texte: Thanksgiving (fin novembre, aux États-Unis)
    - id: c
      texte: Christmas (25 décembre)
  indices:
    relance: Quelle fête a lieu en octobre, et laquelle a lieu en décembre ?
    methode: Range les fêtes selon le mois indiqué entre parenthèses.
    etape: Halloween, en octobre, arrive en premier dans l'année.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux fêtes voisines sont inversées. Laquelle a lieu en novembre, et laquelle en décembre ?
  - si:
      diagnostic: ordre_faux
    relance: 'Suis l''ordre des mois : octobre, puis novembre, puis décembre.'
  solution: D'abord Halloween (31 octobre), puis Thanksgiving (fin novembre), puis Christmas (25 décembre).
- id: association-pays-habitudes
  type: association
  difficulte: 2
  enonce: Associe chaque habitude à sa description.
  reponse:
    gauche:
    - id: a
      texte: Driving in the United Kingdom
    - id: b
      texte: Thanksgiving
    - id: c
      texte: A full English breakfast
    droite:
    - id: x
      texte: On conduit à gauche
    - id: y
      texte: Un grand repas de fin novembre aux États-Unis
    - id: z
      texte: Un petit-déjeuner copieux avec œufs et bacon
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par l''habitude la plus facile à reconnaitre : celle liée à la conduite.'
    methode: 'Chaque habitude est associée à un seul repère culturel : conduite, fête, ou repas.'
    etape: '"Driving in the United Kingdom" est associée au fait de conduire à gauche.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère la description du petit-déjeuner anglais.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la conduite à gauche, puis distingue la fête et le petit-déjeuner.
  solution: '"Driving in the United Kingdom" = conduire à gauche ; "Thanksgiving" = grand repas de fin novembre aux États-Unis
    ; "A full English breakfast" = petit-déjeuner copieux avec œufs et bacon.'
- id: formules-de-fete
  type: association
  difficulte: 2
  enonce: Tu écris une carte à un ami anglophone. Relie chaque formule toute faite au jour où on l'utilise.
  reponse:
    gauche:
    - id: merry-christmas
      texte: Merry Christmas!
    - id: happy-halloween
      texte: Happy Halloween!
    - id: happy-thanksgiving
      texte: Happy Thanksgiving!
    droite:
    - id: decembre
      texte: Le 25 décembre
    - id: octobre
      texte: Le 31 octobre
    - id: novembre
      texte: Le quatrième jeudi de novembre, aux États-Unis
    paires:
      merry-christmas: decembre
      happy-halloween: octobre
      happy-thanksgiving: novembre
  indices:
    relance: Chaque formule contient le nom d'une fête. Te souviens-tu de la date de chacune ?
    methode: Repère le nom de la fête dans la formule, puis cherche sa date dans la leçon.
    etape: « Christmas », c'est Noël. Pense au jour où on fête Noël.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Laquelle de ces fêtes a lieu en automne, avec des citrouilles ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par Noël, que tu connais bien, puis place les deux autres fêtes.
  solution: « Merry Christmas! » le 25 décembre ; « Happy Halloween! » le 31 octobre ; « Happy Thanksgiving! » le quatrième
    jeudi de novembre, aux États-Unis.
- id: deux-differences
  type: choix
  difficulte: 3
  enonce: Coche les DEUX phrases qui décrivent une différence entre la France et l'Angleterre.
  reponse:
    options:
    - id: a
      texte: En Angleterre, on roule à gauche.
    - id: b
      texte: Le petit-déjeuner anglais traditionnel est plus copieux, avec des œufs et du bacon.
    - id: c
      texte: On fête Noël le 25 décembre dans les deux pays.
    - id: d
      texte: En Angleterre, on ne fête jamais Noël.
    bonnes:
    - a
    - b
  indices:
    relance: Pour chaque phrase, demande-toi si on fait pareil en France ou non.
    methode: Écarte d'abord ce qui est pareil dans les deux pays, puis ce qui est faux.
    etape: Noël est fêté dans les deux pays. Cherche les deux phrases qui parlent de la route et du repas du matin.
  pieges:
  - si:
      contient:
      - c
    relance: Cette phrase décrit quelque chose de pareil dans les deux pays. Est-ce vraiment une différence ?
  - si:
      contient:
      - d
    relance: Cette phrase est fausse. Relis la leçon sur Noël en Angleterre.
  solution: 'Les deux différences : en Angleterre on roule à gauche (en France à droite), et le petit-déjeuner anglais traditionnel
    est plus copieux, avec des œufs et du bacon. Noël le 25 décembre est une similitude, et il est faux de dire qu''on ne
    fête pas Noël en Angleterre.'
- id: expliquer-a-un-camarade
  type: ouverte
  difficulte: 3
  enonce: Explique à un camarade ou à quelqu'un de ta famille un repère culturel du monde anglophone. Dis s'il s'agit d'une
    similitude ou d'une différence avec la France, et utilise une formule toute faite en anglais ou un geste.
  criteres:
  - L'élève présente un repère culturel vu dans la leçon (une fête, la conduite à gauche, le petit-déjeuner anglais...).
  - L'élève dit clairement si c'est une similitude ou une différence avec la France, en comparant les deux pays.
  - L'élève utilise une formule en anglais (« Happy Halloween! », « they drive on the left »...) ou un geste, et ne juge pas
    l'autre habitude comme moins bonne.
  indices:
    relance: Quel repère culturel de la leçon t'a le plus étonné ?
    methode: 'Dis ce qu''on fait là-bas, puis ce qu''on fait en France, puis conclus : pareil ou pas pareil.'
    etape: 'Tu peux commencer ainsi : « En Angleterre, on roule... alors qu''en France... »'
  solution: 'Exemple possible : En Angleterre, on roule à gauche, alors qu''en France on roule à droite. C''est une différence
    culturelle. En anglais, on dit « In England, they drive on the left. » en montrant la gauche avec la main. Ce n''est pas
    mieux ou moins bien, c''est juste différent.'
