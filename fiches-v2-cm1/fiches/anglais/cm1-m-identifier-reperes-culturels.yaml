  enonce: Comment se distingue le petit-déjeuner traditionnel anglais (« full English breakfast ») du petit-déjeuner français
    ?
  reponse:
    options:
    - id: o1
      texte: Il est plus copieux et contient des aliments salés comme des œufs et du bacon.
    - id: o2
      texte: Il se compose uniquement d'une boisson chaude et d'un croissant.
    - id: o3
      texte: Il est composé seulement de fruits glacés.
    - id: o4
      texte: Il est strictement identique au petit-déjeuner français.
    bonnes:
    - o1
  indices:
    relance: Cherche le repas du matin qui inclut des ingrédients salés comme le bacon.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Incorrect : la formule viennoiserie est typique du petit-déjeuner français.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : la fiche mentionne des œufs et du bacon pour le petit-déjeuner anglais.'
  - si:
      contient:
      - o4
    relance: 'Erreur : la fiche le présente justement comme une différence de vie quotidienne entre les deux pays.'
  solution: 'Il est plus copieux et contient des aliments salés comme des œufs et du bacon. C''est la bonne réponse : le petit-déjeuner
    anglais est salé et plus copieux qu''en France.'
- id: nblm-quelle-attitude-un-eleve-doit-il-adopter-4
  type: choix
  difficulte: 2
  enonce: Quelle attitude un élève doit-il adopter lorsqu'il découvre une coutume ou une habitude anglaise différente de la
    sienne ?
  reponse:
    options:
    - id: o1
      texte: Comprendre qu'une habitude différente n'est ni meilleure ni moins bonne, juste différente.
    - id: o2
      texte: Penser que la coutume anglaise est une erreur parce qu'elle diffère de la coutume française.
    - id: o3
      texte: Moquer la tradition anglaise devant ses camarades.
    - id: o4
      texte: Remplacer immédiatement toutes ses habitudes françaises par les habitudes anglaises.
    bonnes:
    - o1
  indices:
    relance: Pense à la notion de tolérance et au fait qu'une habitude différente est simplement autre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : il ne faut pas considérer qu''une habitude étrangère est mauvaise ou fausse.'
  - si:
      contient:
      - o3
    relance: 'Incorrect : le programme vise le respect et la tolérance envers les autres cultures.'
  - si:
      contient:
      - o4
    relance: 'Incorrect : il s''agit de reconnaître et comprendre les repères culturels, pas d''abandonner sa culture.'
  solution: 'Comprendre qu''une habitude différente n''est ni meilleure ni moins bonne, juste différente. C''est exact : l''objectif
    est d''observer les différences culturelles avec ouverture d''esprit et sans jugement.'
