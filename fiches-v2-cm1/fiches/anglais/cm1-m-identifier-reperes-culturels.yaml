format: 2
notion: cm1-m-identifier-reperes-culturels
version: 1
etat: verifiee
declencheurs:
- connaitre une fête typique des pays anglophones
- reconnaitre une différence de vie entre la France et l'Angleterre
- expliquer une coutume anglaise à un camarade
- reconnaitre un repère culturel du monde anglophone
prerequis: []
couverture: Travaille le repérage de quelques différences culturelles simples et connues entre la France et des pays anglophones
  (fêtes, habitudes). Ne couvre pas une étude civilisationnelle approfondie.
essentiel: 'Identifier un repère culturel, c''est reconnaitre une habitude ou une fête différente entre la France et les

  pays où on parle anglais.


  Par exemple, en Angleterre, on fête Noël ("Christmas") mais aussi Halloween de façon très importante, avec des

  citrouilles et des déguisements, le 31 octobre. Aux États-Unis, on fête Thanksgiving ("Thanksgiving Day") le

  quatrième jeudi de novembre, avec un grand repas en famille.


  En Angleterre, on roule à gauche ("they drive on the left"), alors qu''en France on roule à droite. Le petit-

  déjeuner anglais traditionnel ("a full English breakfast") est plus copieux que le petit-déjeuner français,

  avec des œufs et du bacon.


  Reconnaitre ces différences aide à comprendre que les habitudes ne sont pas les mêmes partout, sans qu''une

  façon de faire soit meilleure qu''une autre.

  '
methode:
- Repère si l'habitude ou la fête existe aussi en France, ou si elle est différente.
- Associe chaque fête à sa période de l'année (Halloween en octobre, Thanksgiving en novembre, Christmas en décembre).
- 'Compare simplement : "en France on fait ça, en Angleterre on fait plutôt ça".'
- N'oublie pas qu'une habitude différente n'est ni meilleure ni moins bonne, juste différente.
vocabulaire:
- terme: Halloween
  definition: fête du 31 octobre, avec citrouilles et déguisements, très fêtée dans les pays anglophones
- terme: Thanksgiving
  definition: fête américaine de fin novembre, avec un grand repas en famille
- terme: they drive on the left
  definition: ils roulent à gauche (au Royaume-Uni)
erreurs_frequentes:
- Confondre Halloween et Thanksgiving, qui n'ont pas la même date ni la même origine.
- Croire que toutes les habitudes des pays anglophones sont identiques entre elles (le Royaume-Uni et les États-Unis ne fêtent
  pas tout pareil).
- Penser qu'une habitude différente de la sienne est forcément une erreur.
exemple:
  enonce: Un correspondant américain te dit qu'il fête un grand repas en famille fin novembre, avec de la dinde. De quelle
    fête parle-t-il ?
  solution: Il parle de "Thanksgiving", une fête américaine du quatrième jeudi de novembre, où les familles se réunissent
    autour d'un grand repas.
exercices:
- id: identifier-la-fete
  type: choix
  difficulte: 1
  enonce: Quelle fête est associée aux citrouilles et aux déguisements, le 31 octobre, dans les pays anglophones ?
  reponse:
    options:
    - id: a
      texte: Halloween
    - id: b
      texte: Thanksgiving
    - id: c
      texte: Christmas
    bonnes:
    - a
  indices:
    relance: Cette fête a lieu à la fin du mois d'octobre.
    methode: Les citrouilles et les déguisements sont les symboles de cette fête d'automne.
    etape: Cherche, parmi les trois options, celle qui a lieu le 31 octobre.
  pieges:
  - si:
      contient:
      - b
    relance: '"Thanksgiving" a lieu en novembre, avec un grand repas, pas de citrouilles ni de déguisements.'
  - si:
      contient:
      - c
    relance: '"Christmas" (Noël) a lieu en décembre, sans lien avec les citrouilles.'
  solution: '"Halloween", le 31 octobre, est associée aux citrouilles et aux déguisements.'
- id: cote-de-conduite
  type: texte_court
  difficulte: 2
  enonce: 'Au Royaume-Uni, de quel côté de la route conduit-on ? Écris un seul mot : "gauche" ou "droite".'
  reponse:
    acceptees:
    - gauche
    fautes_tolerees: 0
  indices:
    relance: C'est le côté opposé à celui utilisé en France.
    methode: En France on conduit à droite ; au Royaume-Uni, c'est l'inverse.
    etape: Le mot attendu est le contraire de "droite".
  pieges:
  - si:
      valeur: droite
    relance: C'est le côté utilisé en France. Au Royaume-Uni, c'est l'autre côté.
  solution: Au Royaume-Uni, on conduit à gauche.
- id: ordre-fetes-annee
  type: ordre
  difficulte: 2
  enonce: Range ces trois fêtes des pays anglophones dans l'ordre de l'année, de la plus tôt à la plus tard.
  reponse:
    elements:
    - id: a
      texte: Halloween (31 octobre)
    - id: b
      texte: Thanksgiving (fin novembre, aux États-Unis)
    - id: c
      texte: Christmas (25 décembre)
  indices:
    relance: Quelle fête a lieu en octobre, et laquelle a lieu en décembre ?
    methode: Range les fêtes selon le mois indiqué entre parenthèses.
    etape: Halloween, en octobre, arrive en premier dans l'année.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux fêtes voisines sont inversées. Laquelle a lieu en novembre, et laquelle en décembre ?
  - si:
      diagnostic: ordre_faux
    relance: 'Suis l''ordre des mois : octobre, puis novembre, puis décembre.'
  solution: D'abord Halloween (31 octobre), puis Thanksgiving (fin novembre), puis Christmas (25 décembre).
- id: association-pays-habitudes
  type: association
  difficulte: 2
  enonce: Associe chaque habitude à sa description.
  reponse:
    gauche:
    - id: a
      texte: Driving in the United Kingdom
    - id: b
      texte: Thanksgiving
    - id: c
      texte: A full English breakfast
    droite:
    - id: x
      texte: On conduit à gauche
    - id: y
      texte: Un grand repas de fin novembre aux États-Unis
    - id: z
      texte: Un petit-déjeuner copieux avec œufs et bacon
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par l''habitude la plus facile à reconnaitre : celle liée à la conduite.'
    methode: 'Chaque habitude est associée à un seul repère culturel : conduite, fête, ou repas.'
    etape: '"Driving in the United Kingdom" est associée au fait de conduire à gauche.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère la description du petit-déjeuner anglais.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la conduite à gauche, puis distingue la fête et le petit-déjeuner.
  solution: '"Driving in the United Kingdom" = conduire à gauche ; "Thanksgiving" = grand repas de fin novembre aux États-Unis
    ; "A full English breakfast" = petit-déjeuner copieux avec œufs et bacon.'
