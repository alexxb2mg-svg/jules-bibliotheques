# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-eoc-se-presenter-exprimer-gouts
version: 2
etat: verifiee
declencheurs:
- se présenter en anglais avec son prénom et son âge
- dire ce qu'on aime en anglais
- présenter un copain de la classe en anglais
- my name is
- his name her name
- i like swimming
- morning afternoon evening
- he likes football
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
- cm1-eoc-reperes-phonologiques
couverture: Cette fiche porte sur se présenter et exprimer ses gouts avec des phrases simples au présent. Elle ne couvre pas
  les descriptions plus longues de l'environnement (voir « décrire son environnement »), ni le prétérit (hors programme de
  CM1).
essentiel: 'Pour te présenter en anglais, tu utilises des phrases très simples au présent : « My name is Léa » (je m''appelle
  Léa), « I am ten years old » (j''ai dix ans). Pour bien les dire, tu peux d''abord écouter un modèle, le répéter, puis le
  réciter tout seul.


  Pour présenter un camarade, tu passes à la troisième personne. Pour un garçon : « His name is Tom. He is nine. » Pour une
  fille : « Her name is Emma. She is ten. » Le verbe change aussi : « I like », mais « he likes » et « she likes ».


  Pour dire ce que tu aimes, tu utilises « I like » suivi d''un nom (« I like apples ») ou d''une activité en « -ing » («
  I like swimming », j''aime nager).


  Tu peux décrire en quelques mots une personne, un objet ou un animal familier : « My dog is small and black. » Le mot «
  and » te permet de relier plusieurs éléments dans la même phrase.


  Pour parler de tes habitudes, tu nommes les moments de la journée : « in the morning » (le matin), « in the afternoon »
  (l''après-midi), « in the evening » (le soir). Par exemple : « I go to school in the morning. I play football in the afternoon.
  »

  '
methode:
- Écoute d'abord un modèle de présentation, puis répète-le à voix haute.
- 'Commence par ton prénom, puis ton âge : « My name is... », « I am... years old ».'
- Pour présenter quelqu'un d'autre, remplace « my » par « his » (pour un garçon) ou « her » (pour une fille).
- Avec « he » ou « she », ajoute un « s » au verbe, comme dans « she likes ».
- Pour exprimer un gout, utilise « I like » suivi d'un nom ou d'une activité en « -ing ».
- Relie tes idées avec « and » et ajoute un moment de la journée si tu parles d'une habitude.
vocabulaire:
- terme: My name is...
  definition: je m'appelle...
- terme: I am ... years old
  definition: j'ai ... ans.
- terme: His name is... / Her name is...
  definition: il s'appelle... (pour un garçon) / elle s'appelle... (pour une fille).
- terme: I like swimming
  definition: j'aime nager.
- terme: morning / afternoon / evening
  definition: le matin / l'après-midi / le soir.
- terme: présent
  definition: le temps du verbe qui sert à parler de ce qui est vrai maintenant ou de ses habitudes.
erreurs_frequentes:
- 'Utiliser « his » pour une fille ou « her » pour un garçon : il faut bien choisir selon la personne.'
- Oublier le « -ing » après « like » pour une activité, par exemple dire « I like swim » au lieu de « I like swimming ».
- Oublier le « s » du verbe avec he ou she, par exemple dire « he like » au lieu de « he likes ».
- Dire « I have ten years », comme en français, au lieu de « I am ten years old ».
exemple:
  enonce: Tu veux dire que ton camarade, un garçon prénommé Léo, aime jouer au football l'après-midi. Comment le dis-tu en
    anglais ?
  solution: Tu dis « His name is Léo. He likes playing football in the afternoon. ». « His » car c'est un garçon. « Likes
    » avec un « s » car on parle de lui (he). « Playing » avec « -ing » car c'est une activité. « In the afternoon » veut
    dire l'après-midi.
exercices:
- id: se-presenter-nom
  type: texte_court
  difficulte: 1
  enonce: Comment dit-on « je m'appelle » en anglais pour commencer à se présenter ? Réponds par les trois premiers mots.
  reponse:
    acceptees:
    - my name is
    - my name's
    fautes_tolerees: 2
  indices:
    relance: En anglais, on ne dit pas « je m'appelle ». On dit plutôt « mon nom est ».
    methode: Pense à la formule que tu utilises toujours pour donner ton prénom en anglais.
    etape: Le deuxième mot est « name », suivi du verbe être conjugué.
  pieges:
  - si:
      valeur: i am
    relance: « I am » sert plutôt à donner ton âge ou un état. Quelle formule sert précisément à donner ton prénom ?
  solution: On dit « My name is » pour donner son prénom.
- id: his-ou-her
  type: choix
  difficulte: 1
  enonce: Tu veux dire « elle s'appelle Emma ». Que dis-tu ?
  reponse:
    options:
    - id: a
      texte: Her name is Emma
    - id: b
      texte: His name is Emma
    - id: c
      texte: My name is Emma
    bonnes:
    - a
  indices:
    relance: 'Emma est une fille : quel mot utilise-t-on pour parler d''une fille ?'
    methode: « her » s'utilise pour une fille, « his » pour un garçon.
    etape: Élimine l'option qui parle d'un garçon et celle qui parle de toi.
  pieges:
  - si:
      contient:
      - b
    relance: '« his » s''utilise pour un garçon. Emma est une fille : quel mot faut-il utiliser ?'
  - si:
      contient:
      - c
    relance: « My name is » veut dire je m'appelle. Ici, tu parles d'Emma, pas de toi.
  solution: '« Her name is Emma » : « her » car Emma est une fille.'
- id: exprimer-gout
  type: choix
  difficulte: 1
  enonce: Comment dit-on « j'aime nager » en anglais ?
  reponse:
    options:
    - id: a
      texte: I like swimming
    - id: b
      texte: I like swim
    - id: c
      texte: I am swimming
    bonnes:
    - a
  indices:
    relance: Après « I like » suivi d'une activité, le verbe se termine souvent par trois lettres particulières.
    methode: 'Pense à la terminaison des activités après « like » : elle se termine en « -ing ».'
    etape: Élimine la phrase qui veut dire « je suis en train de nager ». Puis regarde la fin du verbe.
  pieges:
  - si:
      contient:
      - b
    relance: Après « like » suivi d'une activité, il manque la terminaison « -ing ».
  - si:
      contient:
      - c
    relance: « I am swimming » veut dire « je suis en train de nager », pas « j'aime nager ».
  solution: « I like swimming » signifie « j'aime nager », avec « -ing » après « like ».
- id: moments-de-la-journee
  type: association
  difficulte: 1
  enonce: Associe chaque moment de la journée en anglais à sa traduction.
  reponse:
    gauche:
    - id: a
      texte: morning
    - id: b
      texte: afternoon
    - id: c
      texte: evening
    droite:
    - id: x
      texte: le matin
    - id: y
      texte: l'après-midi
    - id: z
      texte: le soir
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Un de ces mots contient le mot « noon », qui veut dire midi.
    methode: « After » veut dire après. Que veut dire « après midi » ?
    etape: On dit « Good morning » quand on arrive à l'école le matin. Continue avec les deux autres mots.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Pense à « after » (après) et « noon » (midi).
  - si:
      diagnostic: associations_fausses
    relance: Range les moments dans l'ordre de la journée, du lever au coucher, puis associe-les.
  solution: morning = le matin ; afternoon = l'après-midi ; evening = le soir.
- id: presenter-un-copain
  type: choix
  difficulte: 2
  enonce: Ton copain Léo aime lire. Comment le dis-tu en anglais ?
  reponse:
    options:
    - id: a
      texte: He likes reading.
    - id: b
      texte: He like reading.
    - id: c
      texte: I likes reading.
    bonnes:
    - a
  indices:
    relance: Tu parles de Léo, donc de « he ». Que devient le verbe like avec he ?
    methode: Avec he ou she, le verbe au présent prend une lettre de plus à la fin.
    etape: Élimine d'abord la phrase qui parle de toi (I). Puis regarde la fin du verbe.
  pieges:
  - si:
      contient:
      - b
    relance: Avec « he », le verbe like change un peu. Qu'est-ce qui manque à la fin ?
  - si:
      contient:
      - c
    relance: « I » veut dire je, c'est toi. Ici, tu parles de Léo. Et avec I, on ne met pas de « s ».
  solution: « He likes reading. » On parle de Léo (he), donc on ajoute un « s » à like.
- id: dire-son-age
  type: texte_court
  difficulte: 2
  enonce: Comment dis-tu « j'ai dix ans » en anglais ?
  reponse:
    acceptees:
    - i am ten years old
    - i'm ten years old
    - i am ten
    - i'm ten
    fautes_tolerees: 2
  indices:
    relance: En anglais, on ne dit pas « j'ai » pour l'âge, on dit « je suis ».
    methode: Commence par « I am », puis le nombre en anglais, puis deux petits mots qui veulent dire « ans d'âge ».
    etape: Le nombre dix se dit « ten ». Ajoute-le après « I am ».
  pieges:
  - si:
      valeur: i have ten years
    relance: En anglais, on n'utilise pas « have » pour l'âge. On utilise le verbe être.
  solution: On dit « I am ten years old » (ou « I'm ten »). En anglais, on utilise le verbe être pour dire son âge.
- id: decrire-un-animal
  type: choix
  difficulte: 3
  enonce: Tu veux dire que ton chien est petit et noir. Quelle phrase est correcte ?
  reponse:
    options:
    - id: a
      texte: My dog is small and black.
    - id: b
      texte: My dog are small and black.
    - id: c
      texte: My dog is small or black.
    bonnes:
    - a
  indices:
    relance: Ton chien a les deux qualités en même temps. Quel petit mot relie les deux ?
    methode: Vérifie deux choses, le verbe être avec un seul chien, et le mot qui relie les deux adjectifs.
    etape: Pour un seul chien, on utilise le verbe « is ». Il reste à choisir entre « and » et « or ».
  pieges:
  - si:
      contient:
      - b
    relance: Tu parles d'un seul chien. Avec un seul chien, quel verbe être utilise-t-on ?
  - si:
      contient:
      - c
    relance: « Or » veut dire ou, il propose un choix. Ton chien est petit et noir en même temps.
  solution: « My dog is small and black. » « Is » pour un seul chien, et « and » pour relier les deux adjectifs.
- id: presenter-en-continu
  type: ouverte
  difficulte: 3
  enonce: 'Prépare une petite présentation de trois phrases en anglais : ton prénom, ton âge, une chose que tu aimes et le
    moment où tu la fais. Récite-la à un adulte.'
  criteres:
  - L'élève utilise correctement « My name is » suivi d'un prénom et « I am ... years old » pour son âge.
  - L'élève utilise correctement « I like » suivi d'une activité en « -ing » ou d'un nom.
  - L'élève nomme un moment de la journée (morning, afternoon ou evening) ou relie deux éléments avec « and ».
  indices:
    relance: Commence toujours par te présenter avant de parler de tes gouts.
    methode: 'Utilise les formules apprises : « My name is », « I am ... years old » et « I like ».'
    etape: Écris d'abord « My name is... » puis ajoute « I am... » et « I like... ».
  solution: 'Par exemple : « My name is Léa. I am nine years old. I like reading in the evening. » (Je m''appelle Léa. J''ai
    neuf ans. J''aime lire le soir.)'
- id: nblm-comment-dit-on-correctement-je-m-appelle-1
  type: choix
  difficulte: 2
  enonce: Comment dit-on correctement « Je m'appelle Thomas » en anglais pour se présenter ?
  reponse:
    options:
    - id: o1
      texte: My name is Thomas.
    - id: o2
      texte: I call me Thomas.
    - id: o3
      texte: His name is Thomas.
    - id: o4
      texte: My name Thomas.
    bonnes:
    - o1
  indices:
    relance: Pense à la formule d'introduction de soi qui utilise le mot 'name'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une traduction littérale du français (« Je m'appelle ») qui ne s'utilise pas en anglais.
  - si:
      contient:
      - o3
    relance: « His name is » sert à présenter un autre garçon, pas à se présenter soi-même.
  - si:
      contient:
      - o4
    relance: Il manque le verbe « is » entre « name » et le prénom.
  solution: My name is Thomas. C'est la formule correcte en anglais pour se présenter avec son prénom.
- id: nblm-quelle-phrase-permet-d-indiquer-correcte-2
  type: choix
  difficulte: 2
  enonce: Quelle phrase permet d'indiquer correctement son âge en anglais ?
  reponse:
    options:
    - id: o1
      texte: I am nine years old.
    - id: o2
      texte: I have nine years.
    - id: o3
      texte: My age is nine years.
    - id: o4
      texte: I am nine years.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi qu'en anglais, on utilise le verbe être ('I am') et non le verbe avoir pour l'âge.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une traduction calquée du français (« j'ai neuf ans ») ; en anglais, on n'utilise pas le verbe « have »
      pour donner son âge.
  - si:
      contient:
      - o3
    relance: Ce n'est pas la structure naturelle enseignée au CM1 pour exprimer son âge.
  - si:
      contient:
      - o4
    relance: Il manque l'adjectif « old » à la fin de l'expression « years old ».
  solution: I am nine years old. En anglais, on utilise le verbe « be » (I am) suivi de l'âge et de « years old ».
- id: nblm-pour-presenter-une-camarade-de-classe-fi-3
  type: choix
  difficulte: 2
  enonce: Pour présenter une camarade de classe fille nommée Sarah, quelle structure dois-tu utiliser ?
  reponse:
    options:
    - id: o1
      texte: Her name is Sarah.
    - id: o2
      texte: His name is Sarah.
    - id: o3
      texte: My name is Sarah.
    - id: o4
      texte: She name is Sarah.
    bonnes:
    - o1
  indices:
    relance: Fais bien attention à choisir le mot qui correspond au genre féminin pour dire 'son prénom'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: « His » s'utilise uniquement pour présenter un garçon.
  - si:
      contient:
      - o3
    relance: « My name is » sert à se présenter soi-même, pas à présenter quelqu'un d'autre.
  - si:
      contient:
      - o4
    relance: « She » est un pronom sujet ; pour exprimer la possession (« son nom »), il faut utiliser « Her ».
  solution: Her name is Sarah. On utilise le déterminant possessif « Her » pour présenter une fille.
- id: nblm-ton-camarade-leo-est-un-garcon-comment-d-4
  type: choix
  difficulte: 2
  enonce: Ton camarade Léo est un garçon. Comment dis-tu en anglais qu'il s'appelle Léo ?
  reponse:
    options:
    - id: o1
      texte: His name is Léo.
    - id: o2
      texte: Her name is Léo.
    - id: o3
      texte: He name is Léo.
    - id: o4
      texte: His name Léo.
    bonnes:
    - o1
  indices:
    relance: Repère le mot possessif qui désigne un garçon ('son prénom à lui').
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: « Her » s'utilise pour présenter une fille.
  - si:
      contient:
      - o3
    relance: « He » est un pronom sujet (« il ») et non un adjectif possessif (« son »).
  - si:
      contient:
      - o4
    relance: Il manque le verbe « is » dans la phrase.
  solution: His name is Léo. « His » est le possessif utilisé pour faire référence à un garçon.
- id: nblm-quelle-est-la-forme-correcte-pour-dire-j-5
  type: choix
  difficulte: 2
  enonce: Quelle est la forme correcte pour dire « J'aime nager » en anglais ?
  reponse:
    options:
    - id: o1
      texte: I like swimming.
    - id: o2
      texte: I like swim.
    - id: o3
      texte: I am like swimming.
    - id: o4
      texte: I like to swimming.
    bonnes:
    - o1
  indices:
    relance: Pense au suffixe spécial qu'on ajoute au verbe d'action après le verbe 'like'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : il ne faut pas oublier le suffixe « -ing » au verbe d''action après « like ».'
  - si:
      contient:
      - o3
    relance: Il ne faut pas ajouter le verbe « am » devant « like ».
  - si:
      contient:
      - o4
    relance: On ne met pas la préposition « to » devant le verbe quand celui-ci porte déjà la marque « -ing ».
  solution: I like swimming. Après le verbe « like », le verbe d'action prend le suffixe « -ing ».
- id: nblm-quelles-sont-les-deux-phrases-correctes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX phrases correctes pour exprimer ce qu'on aime ou présenter un camarade en anglais ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: I like playing football.
    - id: o2
      texte: Her name is Emma.
    - id: o3
      texte: I like swim.
    - id: o4
      texte: His name is Sarah.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche la phrase qui utilise le suffixe '-ing' après 'like' et celle qui emploie le bon possessif pour une fille.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Cette phrase est incorrecte car il manque la terminaison « -ing » au verbe d'action (« swimming »).
  - si:
      contient:
      - o4
    relance: Cette phrase est incorrecte car « His » s'utilise pour un garçon, alors que Sarah est un prénom féminin.
  solution: I like playing football ; Her name is Emma. Cette phrase est correcte car le verbe « play » prend la terminaison
    « -ing » après « like ».
- id: nblm-complete-la-phrase-pour-presenter-un-cam-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase pour présenter un camarade garçon : « ___ name is Paul. »'
  reponse:
    acceptees:
    - His
    fautes_tolerees: 1
  indices:
    relance: C'est le mot possessif anglais employé pour dire 'Son' quand on parle d'un garçon.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: His. On utilise « His » devant « name » pour présenter un garçon.
- id: nblm-complete-la-phrase-suivante-pour-dire-qu-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase suivante pour dire que tu aimes lire : « I like ___ (read). »'
  reponse:
    acceptees:
    - reading
    fautes_tolerees: 1
  indices:
    relance: N'oublie pas d'ajouter les trois lettres '-ing' à la fin du verbe 'read'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: reading. Après « I like », le verbe « read » (lire) prend la terminaison « -ing », ce qui donne « reading ».
