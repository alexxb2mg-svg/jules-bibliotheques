# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-m-expliciter-message-pour-autrui
version: 2
etat: verifiee
declencheurs:
- expliquer un panneau anglais à quelqu'un
- montrer du doigt une information importante en anglais
- aider une personne qui a besoin de quelque chose en anglais
- attirer l'attention sur une affiche ou un programme en anglais
- he is hungry
- she is thirsty
- look over there
- c'est quoi exit
- on the left on the right
prerequis: []
essentiel: 'Parfois, quelqu''un ne comprend pas l''anglais, ou ne voit pas une information. Tu peux l''aider : tu repères
  l''information utile et tu la lui montres avec des mots simples et des gestes.


  D''abord, tu peux dire ce dont une autre personne a besoin. On parle d''elle avec « He is » (il est) ou « She is » (elle
  est) : « He is hungry » (il a faim), « She is thirsty » (elle a soif), « He is cold » (il a froid), « She is tired » (elle
  est fatiguée). On peut aussi dire « He needs help » (il a besoin d''aide).


  Pour attirer l''attention, on utilise des verbes de perception : « Look! » (regarde !), « Listen! » (écoute !), « I can
  see... » (je vois...). Ces mots disent à l''autre de regarder ou d''écouter.


  Pour situer une information, on utilise des petits mots de lieu : « here » (ici), « there » (là-bas), « on the left » (à
  gauche), « on the right » (à droite), « up » (en haut), « down » (en bas). Exemple : « Look! The toilets are on the left.
  »


  Les panneaux, les affiches, les programmes et les dépliants donnent des informations courtes : une heure, un prix, un lieu.
  L''information importante est souvent écrite en gros ou montrée par un symbole : une flèche pour la sortie (« Exit »), une
  horloge pour l''heure.


  Joins toujours le geste à la parole : tu pointes du doigt l''information en même temps que tu la dis. Le geste aide beaucoup
  l''autre à comprendre.

  '
methode:
- Repère sur le panneau ou l'affiche ce qui est écrit en gros ou montré par un symbole.
- Attire l'attention avec un verbe de perception, comme « Look! » ou « Listen! ».
- Situe l'information avec un mot de lieu (here, there, on the left, on the right).
- Pointe du doigt l'information en même temps que tu la nommes.
- Pour le besoin d'une autre personne, dis « He is... », « She is... » ou « He needs... ».
- Vérifie que la personne a bien compris avant de passer à autre chose.
vocabulaire:
- terme: Look! / Listen!
  definition: Regarde ! / Écoute ! Ce sont des verbes de perception pour attirer l'attention.
- terme: here / there
  definition: Ici (tout près) / là-bas (plus loin).
- terme: on the left / on the right
  definition: À gauche / à droite.
- terme: hungry / thirsty
  definition: Qui a faim / qui a soif.
- terme: He needs help
  definition: Il a besoin d'aide.
- terme: Exit
  definition: La sortie, le mot écrit sur les panneaux au-dessus des portes.
erreurs_frequentes:
- Ne pas montrer du doigt l'information alors qu'un geste aide beaucoup à se faire comprendre.
- Confondre "I'm hungry" (j'ai faim) et "I'm thirsty" (j'ai soif).
- Oublier d'attirer l'attention avec "Look!" avant de donner une information importante.
- Dire « I am hungry » pour parler d'un camarade, au lieu de « He is hungry » ou « She is hungry ».
- Confondre « on the left » (à gauche) et « on the right » (à droite).
exemple:
  enonce: Tu vois un panneau anglais avec une flèche vers la gauche et le mot "Exit". Comment attires-tu l'attention d'un
    camarade sur la sortie ?
  solution: Tu dis « Look! Exit! On the left. » (regarde ! la sortie ! à gauche). En même temps, tu pointes du doigt la flèche
    du panneau. Ton camarade comprend avec tes mots et avec ton geste.
exercices:
- id: bon-mot-pour-un-besoin
  type: choix
  difficulte: 1
  enonce: Tu as très soif. Quelle phrase dis-tu pour l'indiquer ?
  reponse:
    options:
    - id: a
      texte: I'm thirsty.
    - id: b
      texte: I'm hungry.
    - id: c
      texte: I'm cold.
    bonnes:
    - a
  indices:
    relance: Cherche le mot anglais qui correspond exactement à "soif".
    methode: Élimine le mot qui parle de manger et celui qui parle de la température.
    etape: '"Hungry" parle de la faim et "cold" du froid. Il reste une phrase.'
  pieges:
  - si:
      contient:
      - b
    relance: '"Hungry" veut dire "qui a faim", pas "qui a soif". Cherche une autre phrase.'
  - si:
      contient:
      - c
    relance: '"Cold" veut dire "froid", pas "soif". Cherche la phrase qui parle de boire.'
  solution: '"I''m thirsty." indique qu''on a soif.'
- id: besoin-autre-personne
  type: choix
  difficulte: 1
  enonce: Ta petite sœur a faim, mais elle ne parle pas anglais. Que dis-tu à la dame anglaise pour l'aider ?
  reponse:
    options:
    - id: a
      texte: She is hungry.
    - id: b
      texte: I am hungry.
    - id: c
      texte: She is cold.
    bonnes:
    - a
  indices:
    relance: Tu parles de ta sœur, pas de toi. Par quel mot commence la phrase ?
    methode: Pour parler d'une fille ou d'une femme, on commence par « She is ». Ensuite on dit le besoin.
    etape: Deux phrases commencent par « She is ». Laquelle parle de manger ?
  pieges:
  - si:
      contient:
      - b
    relance: « I am » veut dire « je suis ». Ici, tu parles de ta sœur, pas de toi.
  - si:
      contient:
      - c
    relance: « cold » veut dire « froid ». Ta sœur n'a pas froid, elle a faim.
  solution: « She is hungry. » veut dire « elle a faim ». On utilise « She » pour parler de sa sœur.
- id: symbole-panneau
  type: texte_court
  difficulte: 2
  enonce: Un panneau montre une flèche avec le mot "Exit". Que signifie ce mot en français ? Écris juste le mot.
  reponse:
    acceptees:
    - sortie
    fautes_tolerees: 1
  indices:
    relance: C'est le mot qu'on voit souvent au-dessus des portes dans les lieux publics.
    methode: '"Exit" est un mot anglais très court utilisé sur les panneaux.'
    etape: Le mot français correspondant désigne l'endroit par où on sort.
  pieges:
  - si:
      valeur: entrée
    relance: '"Entrance" voudrait dire "entrée". "Exit" désigne le contraire : par où on sort.'
  solution: '"Exit" veut dire "sortie" en français.'
- id: ordre-attirer-attention
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour montrer une information importante à quelqu'un.
  reponse:
    elements:
    - id: a
      texte: Dire "Look!" pour attirer l'attention
    - id: b
      texte: Pointer du doigt l'information sur le panneau
    - id: c
      texte: Nommer l'information avec un mot simple
  indices:
    relance: Quelle étape se fait en tout premier, avant même de montrer quoi que ce soit du doigt ?
    methode: On attire d'abord l'attention, puis on montre, puis on nomme l'information.
    etape: Dire "Look!" est la toute première étape.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle consiste à pointer, et laquelle à nommer l'information ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par attirer l'attention, puis montre du doigt, puis nomme l'information.
  solution: D'abord dire "Look!", puis pointer du doigt l'information, puis la nommer avec un mot simple.
- id: association-besoins-phrases
  type: association
  difficulte: 2
  enonce: Associe chaque besoin à la phrase anglaise qui l'exprime.
  reponse:
    gauche:
    - id: a
      texte: Avoir faim
    - id: b
      texte: Avoir froid
    - id: c
      texte: Avoir besoin d'aide
    droite:
    - id: x
      texte: I'm hungry.
    - id: y
      texte: I'm cold.
    - id: z
      texte: I need help.
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Commence par le besoin le plus facile à reconnaitre : celui qui contient le mot "hungry".'
    methode: Chaque besoin correspond à une phrase précise en anglais.
    etape: '"Avoir faim" correspond à "I''m hungry.".'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère la phrase qui demande de l'aide.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la faim, puis distingue le froid et le besoin d'aide.
  solution: '"Avoir faim" = "I''m hungry." ; "Avoir froid" = "I''m cold." ; "Avoir besoin d''aide" = "I need help.".'
- id: situer-information
  type: association
  difficulte: 2
  enonce: Associe chaque mot de lieu anglais à son sens en français.
  reponse:
    gauche:
    - id: a
      texte: on the left
    - id: b
      texte: on the right
    - id: c
      texte: here
    - id: d
      texte: there
    droite:
    - id: w
      texte: à gauche
    - id: x
      texte: à droite
    - id: y
      texte: ici
    - id: z
      texte: là-bas
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Commence par « here », le mot qu'on dit en montrant un endroit tout près.
    methode: « left » et « right » sont deux côtés. « here » et « there » disent si c'est près ou loin.
    etape: « on the right » se dit du côté de la main avec laquelle beaucoup d'enfants écrivent.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie la gauche et la droite.
  - si:
      diagnostic: associations_fausses
    relance: Sépare d'abord les deux côtés (left, right), puis le près et le loin (here, there).
  solution: « on the left » = à gauche ; « on the right » = à droite ; « here » = ici ; « there » = là-bas.
- id: verbe-de-perception
  type: texte_court
  difficulte: 2
  enonce: 'Le haut-parleur de la gare annonce un train. Tu veux que ton papa écoute bien l''annonce. Complète en anglais :
    « ___! » (Écoute !)'
  reponse:
    acceptees:
    - Listen
    - listen
    fautes_tolerees: 1
  indices:
    relance: Une annonce, ça ne se regarde pas, ça s'entend.
    methode: On utilise un verbe de perception qui parle des oreilles, pas des yeux.
    etape: Ce n'est pas « Look! », qui parle des yeux. Cherche l'autre verbe de perception de la fiche.
  pieges:
  - si:
      valeur: look
    relance: « Look! » veut dire « regarde ! ». Pour une annonce, il faut utiliser les oreilles.
  solution: On dit « Listen! », qui veut dire « écoute ! ».
- id: lire-un-programme
  type: choix
  difficulte: 3
  enonce: 'Au musée, ton cousin ne lit pas l''anglais. Le programme dit : « Dinosaur show: 3 o''clock. Room 2, on the right.
    » Quelle phrase française lui donne la bonne information ?'
  reponse:
    options:
    - id: a
      texte: Le spectacle des dinosaures est à 3 heures, salle 2, à droite.
    - id: b
      texte: Le spectacle des dinosaures est à 2 heures, salle 3, à droite.
    - id: c
      texte: Le spectacle des dinosaures est à 3 heures, salle 2, à gauche.
    bonnes:
    - a
  indices:
    relance: Repère trois informations dans le programme. Une heure, un numéro de salle et un côté.
    methode: « o'clock » donne l'heure, « Room » donne la salle, « on the right » ou « on the left » donne le côté.
    etape: Le nombre devant « o'clock » est l'heure. Le nombre après « Room » est la salle.
  pieges:
  - si:
      contient:
      - b
    relance: Tu as inversé l'heure et la salle. Quel nombre est devant « o'clock » ?
  - si:
      contient:
      - c
    relance: L'heure et la salle sont justes. Mais « on the right », c'est de quel côté ?
  solution: Le spectacle est à 3 heures (« 3 o'clock »), salle 2 (« Room 2 »), à droite (« on the right »).
- id: guide-touriste
  type: ouverte
  difficulte: 3
  enonce: 'Imagine qu''un enfant anglais visite ton école. Écris trois petites phrases en anglais pour l''aider : une pour
    attirer son attention, une pour lui montrer où est un lieu (avec un mot de lieu), une pour dire ce dont il a besoin. Dessine
    le geste que tu fais.'
  criteres:
  - Une phrase utilise un verbe de perception (Look!, Listen!).
  - Une phrase situe un lieu avec un mot appris (here, there, on the left, on the right).
  - Une phrase dit le besoin de l'enfant avec « He is... », « She is... » ou « He needs... », et le geste est dessiné.
  indices:
    relance: Quel lieu de l'école un visiteur cherche-t-il en premier ? La cantine, les toilettes, la cour ?
    methode: Reprends les trois familles de mots de la fiche, perception, lieu et besoin, et fais une phrase avec chacune.
    etape: Pour la première phrase, tu peux commencer par « Look! ».
  solution: 'Exemple : « Look! » (je montre le panneau). « The toilets are on the left. » (je tends le bras à gauche). « He
    is hungry. » (je montre la cantine).'
- id: nblm-que-peux-tu-dire-en-anglais-pour-attirer-1
  type: choix
  difficulte: 2
  enonce: Que peux-tu dire en anglais pour attirer l'attention d'un camarade avant de lui montrer un panneau ou une affiche
    ?
  reponse:
    options:
    - id: o1
      texte: Look!
    - id: o2
      texte: Listen!
    - id: o3
      texte: Stop!
    - id: o4
      texte: Goodbye!
    bonnes:
    - o1
  indices:
    relance: Réfléchis au mot anglais qui signifie 'regarde'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ''Listen!'' demande d''écouter un son, pas de regarder une affiche.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : ''Stop!'' sert à interrompre une action, pas à attirer l''attention sur un support écrit.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ''Goodbye!'' est une formule pour dire au revoir, pas pour présenter un panneau.'
  solution: Look!. C'est le terme approprié pour interpeller quelqu'un et lui demander de regarder un document visuel.
- id: nblm-si-un-eleve-anglophone-a-faim-et-veut-l-2
  type: choix
  difficulte: 2
  enonce: Si un élève anglophone a faim et veut l'exprimer, quelle phrase utilise-t-il pour indiquer son besoin ?
  reponse:
    options:
    - id: o1
      texte: I'm hungry
    - id: o2
      texte: I'm thirsty
    - id: o3
      texte: I'm cold
    - id: o4
      texte: I'm tired
    bonnes:
    - o1
  indices:
    relance: Pense au mot anglais utilisé pour parler de la nourriture et de la faim.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ''I''m thirsty'' signifie ''j''ai soif'' (besoin de boire), à ne pas confondre avec la faim.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : ''I''m cold'' signifie ''j''ai froid'', ce qui exprime une sensation thermique.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : ''I''m tired'' signifie ''je suis fatigué'', ce qui exprime un besoin de repos.'
  solution: I'm hungry. C'est l'expression exacte pour exprimer le besoin de manger (avoir faim).
- id: nblm-quel-geste-essentiel-accompagne-la-parol-3
  type: choix
  difficulte: 2
  enonce: Quel geste essentiel accompagne la parole pour montrer une information importante sur une affiche à quelqu'un ?
  reponse:
    options:
    - id: o1
      texte: Pointer du doigt l'information précise sur le document
    - id: o2
      texte: Garder ses mains derrière le dos
    - id: o3
      texte: Fermer les yeux pendant qu'on explique
    - id: o4
      texte: Cacher le panneau avec une feuille
    bonnes:
    - o1
  indices:
    relance: Pense au geste naturel de la main qui sert à indiquer un endroit ou un objet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : sans geste pour désigner l''emplacement, l''interlocuteur ne sait pas où regarder.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : ne pas regarder le document empêche de guider l''attention de l''autre personne.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : masquer le panneau rend la lecture et l''explicitation impossibles.'
  solution: Pointer du doigt l'information précise sur le document. Montrer du doigt en même temps qu'on parle permet de désigner
    clairement l'élément visuel visé.
- id: nblm-quels-elements-visuels-d-un-panneau-ou-d-4
  type: choix
  difficulte: 2
  enonce: Quels éléments visuels d'un panneau ou d'une affiche dois-tu repérer en priorité pour en expliciter le message ?
  reponse:
    options:
    - id: o1
      texte: Les mots en gros caractères et les symboles (flèches, horloges)
    - id: o2
      texte: Les petites lignes tout en bas de la page
    - id: o3
      texte: La couleur du fond du panneau uniquement
    - id: o4
      texte: Le nom de l'imprimeur du document
    bonnes:
    - o1
  indices:
    relance: Cherche ce qui est écrit le plus gros ou représenté sous forme d'image ou de signe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : se concentrer sur les détails secondaires fait manquer le message principal.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la couleur de fond ne donne pas l''information spécifique du message.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : l''identité de l''imprimeur n''est pas une information utile pour le lecteur.'
  solution: Les mots en gros caractères et les symboles (flèches, horloges). Les gros caractères et les symboles visuels mettent
    directement en évidence l'information clé.
- id: nblm-quelle-expression-en-anglais-permet-d-in-5
  type: choix
  difficulte: 2
  enonce: Quelle expression en anglais permet d'indiquer clairement que l'on a besoin d'aide ?
  reponse:
    options:
    - id: o1
      texte: I need help
    - id: o2
      texte: I need a book
    - id: o3
      texte: I'm happy
    - id: o4
      texte: Look at the book
    bonnes:
    - o1
  indices:
    relance: Recherche la phrase avec le mot anglais 'help'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ''I need a book'' exprime le besoin d''un livre (matériel scolaire), pas d''aide générale.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : ''I''m happy'' exprime la joie et non une difficulté ou un besoin d''aide.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : cette phrase donne une consigne de lecture mais ne signale pas un besoin d''aide.'
  solution: I need help. C'est la formule exacte pour demander ou signaler un besoin d'assistance.
- id: nblm-quelles-sont-les-deux-actions-a-combiner-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX actions à combiner pour bien attirer l'attention et désigner une information sur un programme
    ou une affiche ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Utiliser le mot 'Look!' pour interpeller l'interlocuteur
    - id: o2
      texte: Pointer du doigt l'information sur le support
    - id: o3
      texte: Chuchoter sans montrer le document
    - id: o4
      texte: Cacher le titre de l'affiche avec sa main
    bonnes:
    - o1
    - o2
  indices:
    relance: Choisis un mot d'interpellation verbale et un geste d'indication avec la main.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : chuchoter sans désigner le support ne permet pas d''expliciter le message.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : masquer le titre prive la personne de l''élément clé de compréhension.'
  solution: Utiliser le mot 'Look!' pour interpeller l'interlocuteur ; Pointer du doigt l'information sur le support. Dire
    'Look!' permet de capter l'attention orale de l'autre personne avant de lui montrer l'information.
- id: nblm-quel-mot-anglais-manque-pour-attirer-l-a-7
  type: texte_court
  difficulte: 1
  enonce: 'Quel mot anglais manque pour attirer l''attention d''un camarade sur un panneau : ''... ! Exit!'' ?'
  reponse:
    acceptees:
    - Look
    fautes_tolerees: 1
  indices:
    relance: C'est le verbe anglais de 4 lettres qui sert à dire 'regarde'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: Look. Le mot 'Look' est le verbe d'action utilisé pour attirer l'attention visuelle d'une personne.
- id: nblm-quel-mot-anglais-complete-la-phrase-i-m-8
  type: texte_court
  difficulte: 1
  enonce: Quel mot anglais complète la phrase 'I'm ...' pour exprimer le besoin de boire (avoir soif) ?
  reponse:
    acceptees:
    - thirsty
    fautes_tolerees: 1
  indices:
    relance: C'est l'adjectif anglais commençant par 'th' qui désigne la soif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: thirsty. L'adjectif 'thirsty' exprime la soif et le besoin de boire en anglais.
