# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-eoc-decrire-environnement-et-gouts
version: 2
etat: verifiee
declencheurs:
- décrire ce qu'il y a dans sa chambre en anglais
- dire qu'on adore ou qu'on déteste un aliment en anglais
- décrire l'école en anglais avec des phrases simples
- there is a
- this ou that
- he has got
- i love it
- my favourite food
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
- cm1-eoc-se-presenter-exprimer-gouts
couverture: Cette fiche porte sur décrire son environnement proche et exprimer ses gouts avec des phrases simples préparées
  à l'avance. Elle ne couvre pas le récit d'une histoire (voir la fiche « raconter »).
essentiel: 'Pour décrire ton environnement proche (ta chambre, ta classe, ta maison, ta rue), tu utilises des phrases simples
  au présent. Tu peux préparer ce que tu vas dire avant de parler.


  Pour dire ce qui se trouve quelque part, tu dis « There is a table » (il y a une table). Pour dire ce que quelqu''un possède,
  tu dis « I have got a cat » (j''ai un chat), « You have got a cat » (tu as un chat), mais « He has got a cat » ou « She
  has got a cat » (il ou elle a un chat). Au présent, avec he et she, le verbe change souvent : « I like », mais « she likes
  ».


  Les petits mots devant les noms comptent. « A » veut dire un ou une, « the » veut dire le, la ou les. Pour montrer un objet,
  tu dis « this » quand il est près de toi (ce livre-ci) et « that » quand il est loin (ce livre-là). Ce sont des adjectifs
  démonstratifs.


  Tu peux relier deux idées avec « and » (et) : « I have got a bed and a desk. » Tu peux proposer un choix avec « or » (ou)
  : « Tea or milk? ».


  Pour tes gouts, il y a des degrés : « I hate » (je déteste), « I don''t like » (je n''aime pas), « I like » (j''aime), «
  I love » (j''adore). Tu peux aussi dire « my favourite colour is blue » (ma couleur préférée est le bleu). Pour montrer
  ton enthousiasme, tu peux dire avec force une phrase exclamative : « I love it! ».

  '
methode:
- 'Choisis d''abord ce que tu veux décrire : un objet, une pièce, un lieu proche de toi.'
- Prépare quelques phrases simples avant de parler.
- Utilise « there is » pour dire qu'il y a quelque chose, ou « I have got » pour dire que tu possèdes quelque chose.
- Montre un objet avec « this » s'il est près de toi, ou « that » s'il est loin.
- Relie tes phrases avec « and » ou propose un choix avec « or ».
- 'Pour tes gouts, choisis le bon mot selon l''intensité : « hate », « don''t like », « like » ou « love ».'
vocabulaire:
- terme: There is
  definition: il y a.
- terme: I have got / he has got
  definition: j'ai / il a (pour dire ce qu'on possède).
- terme: this / that
  definition: ce, cette, ici près de toi (this) ou là-bas, loin de toi (that) ; ce sont des adjectifs démonstratifs.
- terme: love / hate
  definition: adorer / détester.
- terme: favourite
  definition: préféré, préférée.
- terme: phrase exclamative
  definition: une phrase dite avec force, qui se termine par un point d'exclamation, comme « I love it! ».
erreurs_frequentes:
- Confondre « love » (adorer) et « like » (aimer), qui n'expriment pas la même intensité.
- Oublier « got » après « I have » pour dire qu'on possède quelque chose.
- Dire « he have got » ou « she like » au lieu de « he has got » et « she likes ».
- Utiliser « this » pour un objet loin de soi, au lieu de « that ».
exemple:
  enonce: Tu veux dire qu'il y a un chat dans ta chambre, que ta sœur a un chien, et que tu adores les chats. Comment le dis-tu
    en anglais ?
  solution: Tu dis « There is a cat in my room. My sister has got a dog. I love cats! ». « There is » sert à dire que le chat
    est là. « Has got » s'utilise pour ta sœur (elle). « Love » dit que ton gout est très fort, et le point d'exclamation
    montre ton enthousiasme.
exercices:
- id: il-y-a
  type: texte_court
  difficulte: 1
  enonce: Comment dit-on « il y a » en anglais pour commencer à décrire ta chambre ? Réponds par deux mots.
  reponse:
    acceptees:
    - there is
    - there's
    fautes_tolerees: 1
  indices:
    relance: Tu ne dis pas que l'objet est à toi. Tu dis seulement qu'il est là, quelque part.
    methode: Pense à la formule que tu utilises pour dire que quelque chose est présent quelque part.
    etape: La formule complète commence par « There » suivi d'un petit verbe être.
  pieges:
  - si:
      valeur: i have
    relance: « I have » sert plutôt à dire que tu possèdes quelque chose. Quelle formule dit qu'il y a quelque chose à un
      endroit ?
  solution: On dit « There is » pour dire qu'il y a quelque chose.
- id: aimer-ou-adorer
  type: choix
  difficulte: 1
  enonce: Quel mot anglais exprime un gout plus fort que « like » (aimer) ?
  reponse:
    options:
    - id: a
      texte: love
    - id: b
      texte: hate
    - id: c
      texte: have
    bonnes:
    - a
  indices:
    relance: Ce mot exprime que tu aimes énormément quelque chose, plus que « like ».
    methode: « hate » est le contraire de « like », pas un gout plus fort dans le même sens.
    etape: Élimine le mot qui veut dire détester et celui qui veut dire avoir.
  pieges:
  - si:
      contient:
      - b
    relance: « hate » veut dire détester, c'est le contraire d'aimer. Quel mot exprime un gout plus fort mais positif ?
  - si:
      contient:
      - c
    relance: « have » veut dire avoir, ce n'est pas un mot de gout.
  solution: « love » signifie « adorer », un gout plus fort que « like ».
- id: association-gouts
  type: association
  difficulte: 2
  enonce: Associe chaque mot anglais de gout à sa traduction.
  reponse:
    gauche:
    - id: a
      texte: like
    - id: b
      texte: love
    - id: c
      texte: hate
    droite:
    - id: x
      texte: aimer
    - id: y
      texte: adorer
    - id: z
      texte: détester
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Range ces trois mots du sentiment le plus négatif au plus positif : détester, aimer, adorer.'
    methode: « hate » est à l'opposé de « love » ; « like » est entre les deux.
    etape: Commence par associer « hate », le mot négatif, à « détester ».
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Repense à l''intensité de chaque mot : aimer, adorer ou détester.'
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot un par un en pensant à l'intensité du sentiment exprimé.
  solution: like = aimer ; love = adorer ; hate = détester.
- id: this-ou-that
  type: choix
  difficulte: 2
  enonce: Tu montres l'arbre au fond de la cour, loin de toi. Que dis-tu ?
  reponse:
    options:
    - id: a
      texte: That tree is big.
    - id: b
      texte: This tree is big.
    - id: c
      texte: A tree is big.
    bonnes:
    - a
  indices:
    relance: L'arbre est-il près de toi ou loin de toi ?
    methode: Un des deux mots démonstratifs sert pour ce qui est près, l'autre pour ce qui est loin.
    etape: « This » s'utilise pour un objet tout près de toi. Ici, l'arbre est au fond de la cour.
  pieges:
  - si:
      contient:
      - b
    relance: « This » sert pour un objet près de toi. L'arbre est loin, au fond de la cour.
  - si:
      contient:
      - c
    relance: « A » veut dire un, il ne sert pas à montrer un objet précis.
  solution: « That tree is big. » On utilise « that » pour montrer un objet loin de soi.
- id: verbe-avec-she
  type: choix
  difficulte: 2
  enonce: Tu veux dire « Ma sœur aime les chats ». Quelle phrase est correcte ?
  reponse:
    options:
    - id: a
      texte: My sister likes cats.
    - id: b
      texte: My sister like cats.
    - id: c
      texte: My sister liking cats.
    bonnes:
    - a
  indices:
    relance: Ta sœur, c'est « she ». Que se passe-t-il pour le verbe avec she ?
    methode: Au présent, avec he ou she, on ajoute une lettre à la fin du verbe.
    etape: On dit « I like », mais avec she, le verbe prend une lettre en plus à la fin.
  pieges:
  - si:
      contient:
      - b
    relance: Avec « I » ou « you », on dit « like ». Avec ta sœur (she), le verbe change un peu.
  - si:
      contient:
      - c
    relance: La forme en « -ing » ne s'utilise pas seule ici. Le verbe doit être au présent.
  solution: « My sister likes cats. » Avec she (ma sœur), on ajoute un « s » au verbe like.
- id: et-ou-ou
  type: texte_court
  difficulte: 2
  enonce: 'Complète en anglais : « I have got a bed ___ a desk. » (tu as les deux). Écris seulement le mot qui manque.'
  reponse:
    acceptees:
    - and
    fautes_tolerees: 0
  indices:
    relance: Tu as le lit ET le bureau. Quel petit mot anglais veut dire « et » ?
    methode: Un petit mot sert à ajouter une chose, un autre sert à choisir entre deux choses.
    etape: « Or » veut dire ou, pour un choix. Ici, il faut le mot qui ajoute.
  pieges:
  - si:
      valeur: or
    relance: « Or » veut dire ou, pour choisir. Ici, tu as les deux objets.
  solution: On écrit « and » (et) car on ajoute un objet. « I have got a bed and a desk. »
- id: phrase-enthousiaste
  type: choix
  difficulte: 3
  enonce: Ton ami te montre son nouveau vélo. Quelle phrase montre que tu l'adores, avec enthousiasme ?
  reponse:
    options:
    - id: a
      texte: I love it!
    - id: b
      texte: There is a bike.
    - id: c
      texte: I don't like it.
    bonnes:
    - a
  indices:
    relance: Quelle phrase dit un gout très fort et positif ?
    methode: Cherche un verbe de gout fort et un point d'exclamation.
    etape: Une phrase décrit seulement, une autre dit que tu n'aimes pas. Il en reste une.
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase dit seulement qu'il y a un vélo. Elle ne dit pas ton gout.
  - si:
      contient:
      - c
    relance: « I don't like » veut dire je n'aime pas. Ce n'est pas de l'enthousiasme.
  solution: « I love it! » dit que tu adores le vélo, et le point d'exclamation montre ton enthousiasme.
- id: decrire-sa-chambre
  type: ouverte
  difficulte: 3
  enonce: Prépare trois phrases simples en anglais pour décrire ta chambre et dire ce que tu aimes ou adores dedans. Dis-les
    à voix haute à un adulte.
  criteres:
  - L'élève utilise correctement « There is » ou « I have got » pour décrire un objet.
  - L'élève utilise correctement « like », « love » ou « hate » pour exprimer un gout.
  - L'élève relie au moins deux éléments avec « and » ou utilise « this » ou « that » pour montrer un objet.
  indices:
    relance: Commence par décrire un objet présent dans ta chambre.
    methode: Utilise « There is » pour l'objet, puis « I like » ou « I love » pour ton gout.
    etape: Écris d'abord « There is... » puis ajoute une phrase avec « I like » ou « I love ».
  solution: 'Par exemple : « There is a bed and a lamp in my room. I love this lamp! I have got a red chair. » (Il y a un
    lit et une lampe dans ma chambre. J''adore cette lampe ! J''ai une chaise rouge.)'
- id: nblm-comment-dis-tu-en-anglais-il-y-a-un-lit-1
  type: choix
  difficulte: 2
  enonce: Comment dis-tu en anglais « Il y a un lit dans ma chambre » pour décrire ce qu'il y a dans ta chambre ?
  reponse:
    options:
    - id: o1
      texte: There is a bed in my bedroom.
    - id: o2
      texte: I have a bed in my bedroom.
    - id: o3
      texte: This is a bed in my bedroom.
    - id: o4
      texte: I love a bed in my bedroom.
    bonnes:
    - o1
  indices:
    relance: Pense au mot anglais à deux mots qui signifie « il y a » pour décrire une pièce.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : il manque le mot ''got'' pour former la structure de possession ''I have got'' vue dans la fiche.'
  - si:
      contient:
      - o3
    relance: 'Erreur : ''this'' sert à montrer un objet précis proche de soi (''ce/cette''), et non à dire ''il y a''.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ''love'' exprime un goût fort (''adorer'') et non la présence d''un objet.'
  solution: There is a bed in my bedroom. C'est la bonne réponse. 'There is' signifie 'il y a' pour indiquer la présence d'un
    objet dans son environnement proche.
- id: nblm-tu-veux-dire-en-anglais-que-tu-adores-le-2
  type: choix
  difficulte: 2
  enonce: Tu veux dire en anglais que tu ADORES les pommes (et pas seulement que tu les aimes). Quelle phrase dois-tu choisir
    ?
  reponse:
    options:
    - id: o1
      texte: I love apples.
    - id: o2
      texte: I like apples.
    - id: o3
      texte: I hate apples.
    - id: o4
      texte: There is apples.
    bonnes:
    - o1
  indices:
    relance: Choisis le verbe anglais qui exprime une intensité plus forte que 'like'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ''like'' signifie seulement ''aimer'', ce qui n''exprime pas l''intensité forte d''« adorer
      ».'
  - si:
      contient:
      - o3
    relance: 'Erreur : ''hate'' signifie ''détester'', soit l''opposé complet d''adorer.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ''There is'' sert à décrire la présence d''un objet (''il y a''), pas à exprimer un goût.'
  solution: I love apples. C'est la bonne réponse. 'Love' exprime une forte intensité ('adorer'), supérieure à 'like'.
- id: nblm-quelle-formule-anglaise-utilises-tu-pour-3
  type: choix
  difficulte: 2
  enonce: Quelle formule anglaise utilises-tu pour indiquer que tu DÉTESTES un aliment, comme le fromage ?
  reponse:
    options:
    - id: o1
      texte: I hate cheese.
    - id: o2
      texte: I don't love cheese.
    - id: o3
      texte: I like cheese.
    - id: o4
      texte: This is cheese.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi du mot anglais court en 4 lettres qui veut dire 'détester'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : pour exprimer le fait de détester au CM1, la fiche recommande d''utiliser directement le verbe ''hate''.'
  - si:
      contient:
      - o3
    relance: 'Erreur : ''like'' signifie ''aimer'', c''est le contraire de détester.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ''This is'' permet de montrer du fromage (''c''est du fromage''), pas d''exprimer son goût.'
  solution: I hate cheese. C'est la bonne réponse. 'Hate' est le verbe exact pour exprimer le dégoût ou le fait de détester
    un aliment.
- id: nblm-pour-decrire-ce-que-tu-possedes-dans-ta-4
  type: choix
  difficulte: 2
  enonce: Pour décrire ce que tu possèdes dans ta chambre ou ton école, quelle est la structure correcte en anglais ?
  reponse:
    options:
    - id: o1
      texte: I have got a book.
    - id: o2
      texte: I have a book.
    - id: o3
      texte: I am got a book.
    - id: o4
      texte: There is got a book.
    bonnes:
    - o1
  indices:
    relance: N'oublie pas le petit mot à 3 lettres qui accompagne souvent 'I have' pour exprimer ce qu'on possède.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : oublier le mot ''got'' après ''I have'' lorsqu''on exprime la possession selon la fiche.'
  - si:
      contient:
      - o3
    relance: 'Erreur : il ne faut pas confondre le verbe être (''I am'') avec le verbe avoir (''I have'').'
  - si:
      contient:
      - o4
    relance: 'Erreur : on ne mélange pas ''There is'' (il y a) et ''got''.'
  solution: I have got a book. C'est la bonne réponse. En anglais au CM1, on utilise 'I have got' pour exprimer la possession
    d'un objet.
- id: nblm-en-classe-ou-dans-ta-chambre-quel-mot-an-5
  type: choix
  difficulte: 2
  enonce: 'En classe ou dans ta chambre, quel mot anglais utilises-tu pour montrer un objet précis qui est proche de toi (par
    exemple : « ce stylo ») ?'
  reponse:
    options:
    - id: o1
      texte: this
    - id: o2
      texte: there
    - id: o3
      texte: that
    - id: o4
      texte: hate
    bonnes:
    - o1
  indices:
    relance: Recherche le petit mot de 4 lettres commençant par 'th' qui veut dire 'ce' ou 'cette'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : ''there'' s''utilise dans ''there is'' (il y a) et ne signifie pas ''ce/cette''.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ''hate'' est un verbe qui veut dire ''détester'', pas un mot pour désigner un objet.'
  solution: this. C'est la bonne réponse. 'This' signifie 'ce' ou 'cette' pour montrer un objet proche de soi.
- id: nblm-quels-mots-anglais-peux-tu-utiliser-pour-6
  type: choix
  difficulte: 3
  enonce: Quels mots anglais peux-tu utiliser pour relier ou associer deux éléments quand tu décris ton école ou tes goûts
    ? (Sélectionne les 2 bonnes réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: and
    - id: o2
      texte: or
    - id: o3
      texte: but
    - id: o4
      texte: got
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux mots anglais de 2 ou 3 lettres qui correspondent à « et » et « ou ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur : ''but'' (mais) n''est pas parmi les connecteurs principaux ''et'' / ''ou'' indiqués dans le programme
      pour cette notion.'
  - si:
      contient:
      - o4
    relance: 'Erreur : ''got'' s''utilise avec ''have'' pour la possession (''I have got'') et n''est pas un mot de liaison.'
  solution: and ; or. C'est une bonne réponse. 'And' signifie 'et' et permet de relier deux éléments simples.
- id: nblm-complete-la-phrase-pour-dire-en-anglais-7
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase pour dire en anglais que tu DÉTESTES le poisson : « I ____ fish. »'
  reponse:
    acceptees:
    - hate
    fautes_tolerees: 1
  indices:
    relance: Ce verbe anglais de 4 lettres signifie 'détester'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: hate. Le verbe 'hate' signifie 'détester' en anglais et complète parfaitement la phrase pour exprimer un goût
    négatif.
- id: nblm-complete-la-phrase-pour-decrire-ce-qu-il-8
  type: texte_court
  difficulte: 1
  enonce: 'Complète la phrase pour décrire ce qu''il y a dans ta classe à l''école : « ____ is a desk in my classroom. » (en
    deux mots)'
  reponse:
    acceptees:
    - There is
    fautes_tolerees: 1
  indices:
    relance: Ces deux mots anglais traduisent l'expression française « il y a ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: There is. L'expression 'There is' signifie 'il y a' au singulier et sert à décrire la présence d'un objet dans
    son environnement.
