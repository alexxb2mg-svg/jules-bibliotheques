# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-co-comprendre-message-oral-court
version: 2
etat: verifiee
declencheurs:
- comprendre ce que dit la maitresse en anglais en classe
- comprendre un petit dialogue en anglais
- reconnaitre si quelqu'un est content ou triste rien qu'à sa voix en anglais
- stand up sit down
- open your book
- who where when
- his ou her qui c'est
- happy sad angry
prerequis:
- cm1-six-activites-langagieres
- cm1-niveau-vise-a1
couverture: Cette fiche porte sur la compréhension de messages oraux courts (consignes de classe, petites conversations).
  Elle ne couvre pas le suivi d'une histoire longue (voir la fiche « suivre le fil d'une histoire simple »).
essentiel: 'En classe, le professeur donne des consignes en anglais. Tu dois toutes les comprendre, comme « stand up » (lève-toi),
  « sit down » (assieds-toi) ou « open your book » (ouvre ton livre).


  Dans une conversation simple, tu comprends des mots familiers et des expressions courtes, si la personne parle lentement
  et très distinctement. Tu n''as pas besoin de comprendre chaque mot : repère les mots connus, comme les salutations (« hello
  », « good morning »), la famille, l''école ou les thèmes vus en classe.


  Les mots pour poser une question s''appellent des pronoms interrogatifs : « who » (qui), « what » (quoi, quel), « where
  » (où), « when » (quand). Ils t''aident à savoir ce qu''on te demande.


  Pour savoir de qui on parle, écoute les petits mots. « He » veut dire il, « she » veut dire elle. « His » veut dire son
  ou sa quand c''est à un garçon, « her » quand c''est à une fille. Exemple : « This is her bag » veut dire que le sac est
  à une fille.


  Écoute aussi les mots de gout et de dégout : « I like » (j''aime), « I love » (j''adore), « I don''t like » (je n''aime
  pas), « I hate » (je déteste).


  Enfin, la voix et les gestes montrent l''humeur. Une voix joyeuse dit « happy » (content), une voix qui tremble dit « sad
  » (triste), une voix forte et dure dit « angry » (en colère). Tu peux aussi découper le message en petits blocs et deviner
  si c''est une plaisanterie.

  '
methode:
- Écoute d'abord pour repérer si c'est une consigne de classe, une question ou une petite conversation.
- Repère les mots que tu connais déjà (salutations, famille, école, objets connus), sans chercher à tout comprendre.
- Si c'est une question, cherche le mot interrogatif (who, what, where, when) pour savoir ce qu'on te demande.
- Repère les petits mots qui disent de qui on parle (he, she, his, her) et les verbes de gout (like, love, hate).
- 'Écoute le ton de la voix et regarde les gestes pour deviner l''humeur : joie, tristesse ou colère.'
vocabulaire:
- terme: he
  definition: il, pour parler d'un garçon ou d'un homme.
- terme: she
  definition: elle, pour parler d'une fille ou d'une femme.
- terme: his / her
  definition: son ou sa, « his » quand l'objet est à un garçon, « her » quand il est à une fille.
- terme: pronom interrogatif
  definition: un mot qui sert à poser une question, comme « who » (qui) ou « where » (où).
- terme: happy
  definition: content, contente.
- terme: sad
  definition: triste.
- terme: angry
  definition: en colère.
erreurs_frequentes:
- Confondre « he » et « she » alors qu'ils désignent un garçon ou une fille différents.
- Choisir « his » ou « her » selon l'objet, comme en français ; en anglais, cela dépend de la personne à qui est l'objet.
- Confondre « where » (où) et « when » (quand), qui se ressemblent à l'oral.
- Vouloir comprendre chaque mot au lieu de repérer les mots connus et le sens général.
- Ne pas s'aider du ton de la voix pour deviner l'humeur de la personne qui parle.
exemple:
  enonce: Le professeur dit « Where is Tom? He is sad today » d'une voix douce. Que comprends-tu ?
  solution: '« Where » veut dire où : le professeur demande où est Tom. « He » montre qu''on parle d''un garçon, Tom. « Sad
    » veut dire triste : Tom est triste aujourd''hui. La voix douce montre que le professeur n''est pas en colère, il s''inquiète
    pour Tom.'
exercices:
- id: he-ou-she
  type: choix
  difficulte: 1
  enonce: Quel mot utilise-t-on en anglais pour parler d'une fille ?
  reponse:
    options:
    - id: a
      texte: she
    - id: b
      texte: he
    - id: c
      texte: they
    bonnes:
    - a
  indices:
    relance: Ce mot désigne une personne féminine, pas masculine.
    methode: Il y a un mot pour un garçon et un mot différent pour une fille ; l'un commence par h, l'autre par s.
    etape: Regarde bien la première lettre de chaque option pour distinguer garçon et fille.
  pieges:
  - si:
      contient:
      - b
    relance: « he » sert à parler d'un garçon. Quel est le mot pour une fille ?
  - si:
      contient:
      - c
    relance: « they » sert à parler de plusieurs personnes. Quel mot désigne une seule fille ?
  solution: « she » signifie « elle », pour parler d'une fille ou d'une femme.
- id: consigne-classe
  type: association
  difficulte: 1
  enonce: Associe chaque consigne de classe en anglais à son sens en français.
  reponse:
    gauche:
    - id: a
      texte: Stand up
    - id: b
      texte: Sit down
    - id: c
      texte: Open your book
    - id: d
      texte: Listen
    droite:
    - id: x
      texte: Lève-toi
    - id: y
      texte: Assieds-toi
    - id: z
      texte: Ouvre ton livre
    - id: w
      texte: Écoute
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Ce sont des consignes que tu entends très souvent en classe d'anglais.
    methode: 'Repère d''abord les deux consignes opposées : se lever et s''asseoir.'
    etape: « Stand up » et « sit down » sont deux actions contraires.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Repense aux deux consignes opposées : se lever et s''asseoir.'
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque consigne une par une en pensant au geste qu'elle demande.
  solution: Stand up = lève-toi ; sit down = assieds-toi ; open your book = ouvre ton livre ; listen = écoute.
- id: reconnaitre-humeur
  type: choix
  difficulte: 2
  enonce: Une personne parle en anglais d'une voix tremblante et des larmes dans la voix. Quelle humeur ressens-tu ?
  reponse:
    options:
    - id: a
      texte: Elle est triste (sad)
    - id: b
      texte: Elle est contente (happy)
    - id: c
      texte: Elle est en colère
    bonnes:
    - a
  indices:
    relance: Une voix qui tremble avec des larmes ressemble-t-elle à de la joie ou à de la peine ?
    methode: Pense à comment ta propre voix change quand tu as du chagrin.
    etape: Élimine d'abord la joie, puis demande-toi si les larmes vont avec une voix forte et dure ou avec du chagrin.
  pieges:
  - si:
      contient:
      - c
    relance: La colère s'entend plutôt à une voix forte et dure, pas à des larmes.
  - si:
      contient:
      - b
    relance: Une personne contente a une voix gaie, pas une voix qui tremble avec des larmes.
  solution: Une voix tremblante avec des larmes indique généralement la tristesse (sad).
- id: mot-triste
  type: texte_court
  difficulte: 2
  enonce: Comment dit-on « triste » en anglais ?
  reponse:
    acceptees:
    - sad
    fautes_tolerees: 1
  indices:
    relance: C'est le mot de l'humeur qu'on entend dans une voix qui tremble.
    methode: Pense au contraire de « happy ».
    etape: Relis la fin de la fiche, sur l'humeur des personnes.
  pieges:
  - si:
      valeur: happy
    relance: « happy » veut dire content. Quel est le mot qui veut dire triste, son contraire ?
  solution: « sad » signifie triste.
- id: mots-interrogatifs
  type: association
  difficulte: 2
  enonce: Associe chaque mot interrogatif anglais à son sens en français.
  reponse:
    gauche:
    - id: a
      texte: Who
    - id: b
      texte: Where
    - id: c
      texte: When
    - id: d
      texte: What
    droite:
    - id: x
      texte: Qui
    - id: y
      texte: Où
    - id: z
      texte: Quand
    - id: w
      texte: Quoi, quel
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Ces mots servent tous à poser une question. Lequel demande une personne ?
    methode: Pense à des questions de classe que tu connais, comme « What is your name? » pour demander le prénom.
    etape: « Where is my pencil? » demande l'endroit où se trouve le crayon. Continue avec les autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Attention, deux mots se ressemblent beaucoup à l'oral.
  - si:
      diagnostic: associations_fausses
    relance: Prends une question connue pour chaque mot (le prénom, un endroit, un moment) et retrouve ce qu'elle demande.
  solution: Who = qui ; where = où ; when = quand ; what = quoi, quel.
- id: a-qui-est-le-sac
  type: choix
  difficulte: 2
  enonce: Tu entends « This is her bag ». À qui est le sac ?
  reponse:
    options:
    - id: a
      texte: À une fille
    - id: b
      texte: À un garçon
    - id: c
      texte: À toi
    bonnes:
    - a
  indices:
    relance: Quel petit mot, juste avant « bag », dit à qui est l'objet ?
    methode: « his » s'emploie quand l'objet est à un garçon, « her » quand il est à une personne féminine.
    etape: Ici, le mot est « her ». Est-ce le mot pour un garçon ou pour une fille ?
  pieges:
  - si:
      contient:
      - b
    relance: Pour un garçon, on dirait « his bag ». Quel mot as-tu entendu ici ?
  - si:
      contient:
      - c
    relance: Pour dire que le sac est à toi, on dirait « your bag ». Ici, on parle de quelqu'un d'autre.
  solution: « Her » veut dire son ou sa quand c'est à une fille ou une femme. Le sac est donc à une fille.
- id: gout-et-humeur
  type: choix
  difficulte: 3
  enonce: Une fille dit d'une voix forte, en tapant du pied, « I hate rainy days! ». Que comprends-tu ?
  reponse:
    options:
    - id: a
      texte: Elle déteste les jours de pluie et elle est en colère
    - id: b
      texte: Elle adore les jours de pluie et elle est contente
    - id: c
      texte: Elle aime un peu les jours de pluie et elle est triste
    bonnes:
    - a
  indices:
    relance: Quel verbe de gout entends-tu ? Est-il positif ou négatif ?
    methode: Utilise deux indices à la fois, le verbe de gout et la façon dont elle parle (voix, gestes).
    etape: « I love » voudrait dire j'adore. Le verbe entendu ici est son contraire. Et une voix forte avec un pied qui tape,
      c'est quelle humeur ?
  pieges:
  - si:
      contient:
      - b
    relance: Le verbe entendu n'est pas « love ». Et une voix forte avec un pied qui tape montre-t-elle de la joie ?
  - si:
      contient:
      - c
    relance: Une voix forte et un pied qui tape, ce n'est pas de la tristesse. Et le verbe entendu est-il « like » ?
  solution: « I hate » veut dire je déteste. La voix forte et le pied qui tape montrent la colère. Elle déteste les jours
    de pluie et elle est en colère.
- id: ecouter-a-la-maison
  type: ouverte
  difficulte: 3
  enonce: Demande à un adulte de te dire lentement en anglais « Where is my cat? I am sad », avec une voix triste. Écris en
    français ce que tu as compris et les indices qui t'ont aidé.
  criteres:
  - L'élève explique la question (où est mon chat) en s'appuyant sur le mot « where ».
  - L'élève trouve l'humeur (la tristesse) grâce au mot « sad » ou au ton de la voix.
  - L'élève cite au moins un indice qui l'a aidé (un mot connu, la voix ou un geste).
  indices:
    relance: Quel mot de question entends-tu au début ?
    methode: Repère d'abord le mot de question, puis le mot connu qui parle d'un animal, puis écoute la voix.
    etape: 'Tu peux commencer ainsi : « La personne demande... parce que j''ai entendu le mot... ».'
  solution: 'Exemple : « La personne demande où est son chat, j''ai reconnu where et cat. Elle est triste : elle dit sad et
    sa voix est triste. »'
- id: nblm-quand-la-maitresse-dit-en-classe-open-yo-1
  type: choix
  difficulte: 2
  enonce: 'Quand la maîtresse dit en classe : « Open your book », que dois-tu faire ?'
  reponse:
    options:
    - id: o1
      texte: Ouvrir ton livre
    - id: o2
      texte: Fermer ton cahier
    - id: o3
      texte: Te lever de ta chaise
    - id: o4
      texte: Écrire dans ton cahier
    bonnes:
    - o1
  indices:
    relance: Pense au verbe « open » et au mot « book » que tu utilises tous les jours à l'école.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, « open » veut dire ouvrir et non fermer, et « book » désigne le livre.
  - si:
      contient:
      - o3
    relance: Se lever se dit « Stand up » en anglais, pas « Open your book ».
  - si:
      contient:
      - o4
    relance: Écrire se dit « Write », il ne faut pas confondre les consignes de classe.
  solution: Ouvrir ton livre. C'est la bonne réponse ! « Open your book » est une consigne de classe qui signifie « ouvre
    ton livre ».
- id: nblm-comment-peux-tu-savoir-si-une-personne-e-2
  type: choix
  difficulte: 2
  enonce: Comment peux-tu savoir si une personne est contente ou triste quand elle parle en anglais ?
  reponse:
    options:
    - id: o1
      texte: En écoutant le ton de sa voix
    - id: o2
      texte: En comptant le nombre de mots qu'elle prononce
    - id: o3
      texte: En traduisant absolument tous les mots un par un
    - id: o4
      texte: En lui demandant d'écrire son message sur une feuille
    bonnes:
    - o1
  indices:
    relance: Fais attention aux sons et à la façon dont la voix monte ou tremble.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le nombre de mots ne donne pas d'indication sur l'émotion de la personne.
  - si:
      contient:
      - o3
    relance: Il ne faut pas chercher à tout traduire, l'écoute du ton de la voix suffit pour deviner l'humeur.
  - si:
      contient:
      - o4
    relance: À l'oral, c'est l'écoute de la voix qui t'aide à comprendre l'émotion, pas l'écrit.
  solution: En écoutant le ton de sa voix. C'est exact ! Le ton de la voix permet de deviner l'humeur de la personne qui parle
    (joie, tristesse ou colère).
- id: nblm-dans-un-petit-dialogue-en-anglais-quel-p-3
  type: choix
  difficulte: 2
  enonce: Dans un petit dialogue en anglais, quel pronom te permet de savoir qu'on parle d'une fille ou d'une femme ?
  reponse:
    options:
    - id: o1
      texte: she
    - id: o2
      texte: he
    - id: o3
      texte: happy
    - id: o4
      texte: book
    bonnes:
    - o1
  indices:
    relance: Recherche le pronom personnel anglais qui veut dire « elle ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention à ne pas confondre : « he » signifie « il » et désigne un garçon ou un homme.'
  - si:
      contient:
      - o3
    relance: « Happy » est un adjectif qui veut dire « content », ce n'est pas un pronom.
  - si:
      contient:
      - o4
    relance: « Book » est un nom commun qui signifie « livre ».
  solution: she. Bravo ! Le pronom « she » signifie « elle » et désigne une fille ou une femme.
- id: nblm-selon-le-programme-officiel-a-quelle-con-4
  type: choix
  difficulte: 2
  enonce: Selon le programme officiel, à quelle condition peux-tu comprendre des mots dans une conversation simple en anglais
    ?
  reponse:
    options:
    - id: o1
      texte: Si l'interlocuteur parle lentement et très distinctement
    - id: o2
      texte: Si la personne parle très vite comme à la télévision
    - id: o3
      texte: Seulement si la personne parle en français en même temps
    - id: o4
      texte: Uniquement si tu connais déjà tous les mots du dictionnaire
    bonnes:
    - o1
  indices:
    relance: Réfléchis au rythme et à la clarté de la voix de la personne qui te parle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Si le débit est trop rapide, il devient très difficile de comprendre la conversation.
  - si:
      contient:
      - o3
    relance: Tu peux comprendre directement l'anglais sans passer par le français si le débit est adapté.
  - si:
      contient:
      - o4
    relance: Tu n'as pas besoin de tout connaître, quelques mots familiers suffisent si l'expression est lente et claire.
  solution: Si l'interlocuteur parle lentement et très distinctement. C'est exact ! En CM1, il faut que la personne parle
    lentement et clairement pour pouvoir isoler les mots connus.
- id: nblm-la-maitresse-dit-en-classe-stand-up-plea-5
  type: choix
  difficulte: 2
  enonce: 'La maîtresse dit en classe : « Stand up, please » d''une voix calme. Que dois-tu comprendre et faire ?'
  reponse:
    options:
    - id: o1
      texte: Te lever calmement
    - id: o2
      texte: T'asseoir sur ta chaise
    - id: o3
      texte: Ouvrir ton cahier de texte
    - id: o4
      texte: Parler fort avec ton voisin
    bonnes:
    - o1
  indices:
    relance: Pense à la consigne de classe qui te demande de te mettre debout.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: S'asseoir se dit « Sit down » et non « Stand up ».
  - si:
      contient:
      - o3
    relance: C'est une consigne pour te mettre debout, pas pour utiliser ton matériel.
  - si:
      contient:
      - o4
    relance: Le ton calme de la maîtresse indique de respecter le calme de la classe.
  solution: Te lever calmement. Exact ! « Stand up » est la consigne pour se lever, et le ton calme montre qu'il faut le faire
    posément.
- id: nblm-quels-sont-les-deux-elements-qui-t-aiden-6
  type: choix
  difficulte: 3
  enonce: Quels sont les DEUX éléments qui t'aident à comprendre un message oral en anglais sans connaître tous les mots ?
    (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Les mots familiers que tu connais déjà (école, famille...)
    - id: o2
      texte: Le ton de la voix de la personne qui parle
    - id: o3
      texte: La couleur des vêtements de la personne
    - id: o4
      texte: Le nombre de pages de ton manuel d'anglais
    bonnes:
    - o1
    - o2
  indices:
    relance: 'Pense à ce que tu entends : les mots que tu reconnais et la façon dont la voix résonne.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: La couleur des habits n'apporte aucune information sur le sens du message oral.
  - si:
      contient:
      - o4
    relance: Le nombre de pages du livre n'a pas de lien avec l'écoute d'un message oral.
  solution: Les mots familiers que tu connais déjà (école, famille...) ; Le ton de la voix de la personne qui parle. C'est
    juste ! Repérer des mots connus t'aide à comprendre l'idée générale de la phrase.
- id: nblm-quel-mot-anglais-court-de-3-lettres-sign-7
  type: texte_court
  difficulte: 1
  enonce: Quel mot anglais court de 3 lettres signifie « triste » quand tu l'entends dans une conversation ?
  reponse:
    acceptees:
    - sad
    fautes_tolerees: 1
  indices:
    relance: C'est un mot de 3 lettres qui s'oppose à « happy ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: sad. C'est exact ! Le mot « sad » signifie « triste » en anglais.
- id: nblm-quel-pronom-anglais-de-2-lettres-permet-8
  type: texte_court
  difficulte: 1
  enonce: Quel pronom anglais de 2 lettres permet de savoir qu'on parle d'un garçon ?
  reponse:
    acceptees:
    - he
    fautes_tolerees: 1
  indices:
    relance: Il se compose de la lettre H suivie d'une voyelle.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: he. Bravo ! Le pronom « he » signifie « il » et désigne un garçon ou un homme.
sources:
