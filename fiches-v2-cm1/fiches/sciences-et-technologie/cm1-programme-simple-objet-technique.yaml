format: 2
notion: cm1-programme-simple-objet-technique
version: 1
etat: verifiee
declencheurs:
- faire avancer un robot
- bloc qui fait quoi
- décrire un programme avec des mots
- comparer deux trajets de robot
- comportement d'un personnage virtuel
prerequis: []
essentiel: 'On peut traduire un programme simple en langage naturel : décrire avec des mots ce que fait chaque bloc ou instruction
  sur le comportement d''un objet technique (robot, personnage virtuel).


  On associe chaque bloc à son effet observable, par exemple un bloc qui fait avancer un robot ou un bloc qui le fait tourner.


  On utilise un programme pour agir sur le comportement d''un objet technique et obtenir un comportement attendu. On peut
  aussi comparer plusieurs programmes qui font parcourir le même trajet à un robot, pour identifier le programme le plus efficace.'
methode:
- Observer chaque bloc ou instruction du programme.
- Associer chaque bloc à son effet observable sur le comportement de l'objet technique.
- Traduire le programme en langage naturel, avec des phrases simples.
- Utiliser le programme pour vérifier qu'il obtient le comportement attendu.
erreurs_frequentes:
- Décrire un programme sans relier chaque bloc à son effet observable sur l'objet.
- Utiliser un programme sans vérifier s'il produit bien le comportement attendu.
- Comparer des programmes sans identifier lequel est le plus efficace pour la tâche demandée.
exemple:
  enonce: Un programme fait avancer un robot puis tourner à droite. Comment traduire ce programme en langage naturel ?
  solution: 'On décrit avec des mots l''effet de chaque bloc : « le robot avance tout droit, puis il tourne à droite » ; chaque
    bloc du programme est ainsi associé à son effet observable.'
exercices:
- id: traduire-bloc-avance
  type: texte_court
  difficulte: 1
  enonce: 'Un programme contient un seul bloc « avancer ». Que fait le robot avec ce programme, en un mot : il avance ou il
    tourne ?'
  reponse:
    acceptees:
    - avance
    fautes_tolerees: 1
  indices:
    relance: Le nom du bloc dit déjà ce qu'il fait.
    methode: Chaque bloc a un effet observable qui correspond à son nom.
    etape: Le mot cherché est le même que le nom du bloc, sans changement.
  pieges:
  - si:
      valeur: tourne
    relance: Le bloc s'appelle « avancer », pas « tourner », donc son effet correspond à avancer.
  solution: Avec ce programme, le robot avance, car c'est l'effet observable du bloc « avancer ».
- id: comparer-programmes-efficaces
  type: choix
  difficulte: 2
  enonce: Deux programmes font parcourir le même trajet avec obstacles à un robot. Comment savoir lequel est le plus efficace
    ?
  reponse:
    options:
    - id: a
      texte: En comparant par exemple le temps mis par chaque programme pour parcourir le trajet
    - id: b
      texte: En comptant le nombre de blocs, le plus court gagne toujours
    - id: c
      texte: On ne peut pas comparer deux programmes différents
    bonnes:
    - a
  indices:
    relance: Que peut-on mesurer pour dire qu'un programme fonctionne mieux qu'un autre ?
    methode: On peut comparer le résultat obtenu par chaque programme, par exemple le temps ou la réussite du trajet.
    etape: Élimine les réponses qui ne proposent pas de vraie comparaison des résultats.
  pieges:
  - si:
      contient:
      - b
    relance: Un programme plus court n'est pas toujours le plus efficace, ce qui compte c'est le résultat obtenu.
  - si:
      contient:
      - c
    relance: On peut très bien comparer deux programmes qui font la même tâche, en observant leurs résultats.
  solution: On compare les deux programmes, par exemple le temps mis pour parcourir le trajet en évitant les obstacles, pour
    identifier le plus efficace.
- id: utilite-associer-bloc-effet
  type: ouverte
  difficulte: 2
  enonce: Explique en deux ou trois phrases à quoi sert d'associer chaque bloc d'un programme à son effet observable sur un
    robot.
  criteres:
  - L'élève comprend que cela permet de savoir ce que fait chaque instruction.
  - L'élève relie cette association à la possibilité de traduire le programme en langage naturel.
  indices:
    relance: Sans cette association, peut-on savoir ce que fait chaque bloc du programme ?
    methode: Associer un bloc à son effet permet de comprendre et de décrire le programme avec des mots.
    etape: Commence ainsi « Cela sert à... »
  solution: Cela sert à comprendre ce que fait chaque instruction du programme et permet de traduire le programme en langage
    naturel, avec des phrases simples.
- id: pourquoi-programmer-robot
  type: choix
  difficulte: 1
  enonce: Pourquoi écrit-on un programme pour un robot ou un objet technique ?
  reponse:
    options:
    - id: a
      texte: Pour agir sur son comportement et obtenir un résultat attendu
    - id: b
      texte: Pour le rendre plus lourd
    - id: c
      texte: Pour changer sa couleur
    bonnes:
    - a
  indices:
    relance: Que veut-on obtenir de l'objet technique en le programmant ?
    methode: Un programme agit sur le comportement de l'objet, par exemple pour le faire se déplacer.
    etape: Élimine les réponses qui ne parlent pas du comportement de l'objet.
  pieges:
  - si:
      contient:
      - b
    relance: Un programme ne change pas le poids d'un objet, il agit sur son comportement.
  - si:
      contient:
      - c
    relance: Un programme ne change pas la couleur d'un objet, il agit sur son comportement.
  solution: On écrit un programme pour agir sur le comportement de l'objet technique et obtenir un comportement attendu, comme
    le déplacement d'un robot.
- id: verifier-programme-fonctionne
  type: texte_court
  difficulte: 2
  enonce: 'Après avoir écrit un programme pour un robot, que doit-on faire pour savoir s''il est réussi : le lire seulement,
    ou aussi le tester en le faisant fonctionner ? (réponds en un mot : tester)'
  reponse:
    acceptees:
    - tester
    fautes_tolerees: 1
  indices:
    relance: La lecture seule suffit-elle à savoir si le robot va bien se comporter ?
    methode: On utilise le programme pour vérifier qu'il obtient bien le comportement attendu.
    etape: Le mot cherché est une action qu'on fait avec le robot, pas seulement avec les yeux.
  pieges:
  - si:
      valeur: lire
    relance: Lire le programme ne suffit pas pour vérifier qu'il fonctionne réellement sur le robot.
  solution: On doit aussi tester le programme en le faisant fonctionner sur l'objet technique, pas seulement le lire.
