format: 2
notion: cm1-programme-simple-objet-technique
version: 3
etat: verifiee
declencheurs:
- faire avancer un robot
- bloc qui fait quoi
- décrire un programme avec des mots
- comparer deux trajets de robot
- comportement d'un personnage virtuel
- scratch
- robot qui tourne
- instruction répéter
- programmer un déplacement
- le robot ne fait pas ce que je veux
prerequis: []
essentiel: 'Un programme est une suite d''instructions qu''une machine exécute dans l''ordre, l''une après l''autre. Avec
  des blocs (par exemple sur un logiciel de programmation ou un petit robot de classe), chaque bloc est une instruction.


  Chaque bloc a un effet observable : on voit ce qu''il fait. « Avancer de 1 case » fait avancer le robot d''une case. « Tourner
  à droite » le fait pivoter d''un quart de tour vers la droite, sans changer de case. « Répéter 3 fois » refait 3 fois les
  blocs placés à l''intérieur.


  Traduire un programme en langage naturel, c''est le dire avec des mots, bloc par bloc : « le robot avance de 2 cases, puis
  il tourne à droite, puis il avance de 1 case ». L''ordre compte : si on échange deux blocs, le robot ne fait plus le même
  trajet.


  On écrit un programme pour obtenir un comportement attendu : par exemple, amener le robot jusqu''à une case cible sans toucher
  les obstacles. Pour savoir si le programme est réussi, on le teste : on le fait fonctionner et on observe. S''il ne fait
  pas ce qu''on voulait, on cherche le bloc qui pose problème et on le corrige.


  Plusieurs programmes peuvent faire parcourir le même trajet. On peut les comparer pour trouver le plus efficace : par exemple
  celui qui met le moins de temps, ou celui qui utilise un bloc « répéter » au lieu d''écrire plusieurs fois le même bloc.

  '
methode:
- Lire les blocs du programme dans l'ordre, du haut vers le bas.
- Associer chaque bloc à son effet observable sur le comportement de l'objet technique.
- Traduire le programme en langage naturel, avec des phrases simples reliées par « puis ».
- Tester le programme en le faisant fonctionner, et comparer le comportement obtenu au comportement attendu.
- Si le résultat n'est pas le bon, repérer le bloc fautif, le corriger et tester à nouveau.
vocabulaire:
- terme: programme
  definition: une suite d'instructions qu'une machine exécute dans l'ordre
- terme: instruction
  definition: un ordre donné à la machine, souvent représenté par un bloc
- terme: bloc
  definition: une pièce d'un programme visuel qui représente une instruction
- terme: effet observable
  definition: ce que l'on voit l'objet faire quand une instruction est exécutée
- terme: langage naturel
  definition: la langue de tous les jours, avec des mots et des phrases
- terme: tester
  definition: faire fonctionner le programme pour vérifier qu'il produit le comportement attendu
- terme: boucle
  definition: un bloc « répéter » qui refait plusieurs fois les instructions placées à l'intérieur
erreurs_frequentes:
- Décrire un programme sans relier chaque bloc à son effet observable sur l'objet.
- Utiliser un programme sans vérifier s'il produit bien le comportement attendu.
- Comparer des programmes sans identifier lequel est le plus efficace pour la tâche demandée.
- Oublier que l'ordre des blocs compte, et lire le programme dans le désordre.
- Croire que « tourner » fait aussi avancer le robot, alors qu'il pivote sur place.
exemple:
  enonce: 'Un programme contient ces blocs : « avancer de 2 cases », « tourner à droite », « avancer de 1 case ». Comment
    traduire ce programme en langage naturel ?'
  solution: 'On décrit avec des mots l''effet de chaque bloc, dans l''ordre : « le robot avance de 2 cases tout droit, puis
    il pivote vers la droite sur place, puis il avance de 1 case dans la nouvelle direction ». Chaque bloc est ainsi associé
    à son effet observable.'
exercices:
- id: traduire-bloc-avance
  type: texte_court
  difficulte: 1
  enonce: 'Un programme contient un seul bloc « avancer ». Que fait le robot avec ce programme, en un mot : il avance ou il
    tourne ?'
  reponse:
    acceptees:
    - avance
    fautes_tolerees: 1
  indices:
    relance: Le nom du bloc dit déjà ce qu'il fait.
    methode: Chaque bloc a un effet observable qui correspond à son nom.
    etape: Le mot cherché vient du même verbe que le nom du bloc.
  pieges:
  - si:
      valeur: tourne
    relance: Le bloc ne s'appelle pas « tourner », donc son effet n'est pas de tourner.
  solution: Avec ce programme, le robot avance, car c'est l'effet observable de ce bloc.
- id: cases-avec-repeter
  type: nombre
  difficulte: 2
  enonce: 'Un robot exécute ce programme : « répéter 3 fois : avancer de 2 cases ». De combien de cases avance-t-il en tout
    ?'
  reponse:
    valeur: 6
    forme: entier
  indices:
    relance: Le bloc « répéter » refait plusieurs fois ce qui est à l'intérieur. Combien de fois ici ?
    methode: À chaque passage, le robot avance du même nombre de cases. On ajoute donc ce nombre autant de fois qu'il y a
      de passages.
    etape: Après le premier passage, le robot a avancé de 2 cases. Continue avec le deuxième, puis le troisième.
  pieges:
  - si:
      valeur: 2
    relance: Tu as compté un seul passage. Le bloc « répéter » fait recommencer l'instruction plusieurs fois.
  - si:
      valeur: 5
    relance: Tu as additionné les deux nombres du programme. Il faut plutôt ajouter les cases de chaque passage.
  solution: 'Le robot avance de 2 cases, 3 fois de suite : 2 + 2 + 2 = 6. Il avance de 6 cases en tout.'
- id: ordre-traduction-programme
  type: ordre
  difficulte: 2
  enonce: 'Un robot doit faire ce trajet : avancer de 3 cases, puis tourner à gauche, puis avancer de 1 case, puis allumer
    sa lumière. Range les blocs du programme dans le bon ordre.'
  reponse:
    elements:
    - id: avancer-3
      texte: Avancer de 3 cases
    - id: tourner
      texte: Tourner à gauche
    - id: avancer-1
      texte: Avancer de 1 case
    - id: lumiere
      texte: Allumer la lumière
  indices:
    relance: Un programme s'exécute dans l'ordre, du premier bloc au dernier. Relis le trajet décrit.
    methode: Chaque mot « puis » sépare deux blocs. Le bloc écrit avant « puis » vient avant dans le programme.
    etape: Le premier bloc est celui que le robot fait avant de tourner.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux blocs voisins sont inversés. Relis le trajet mot à mot, dans l'ordre des « puis ».
  - si:
      diagnostic: ordre_faux
    relance: L'ordre des blocs doit suivre exactement l'ordre du trajet décrit dans l'énoncé.
  solution: Avancer de 3 cases, puis tourner à gauche, puis avancer de 1 case, puis allumer la lumière.
- id: effet-tourner-sur-place
  type: choix
  difficulte: 2
  enonce: Que fait un robot de sol quand il exécute le bloc « tourner à droite » ?
  reponse:
    options:
    - id: a
      texte: Il pivote d'un quart de tour vers la droite, sans changer de case
    - id: b
      texte: Il avance d'une case vers la droite
    - id: c
      texte: Il recule d'une case
    bonnes:
    - a
  indices:
    relance: Ce bloc change-t-il la case où se trouve le robot, ou seulement la direction dans laquelle il regarde ?
    methode: Tourner et avancer sont deux instructions différentes. Pour changer de case, il faut un bloc « avancer ».
    etape: Élimine les options où le robot change de case.
  pieges:
  - si:
      contient:
      - b
    relance: Pour aller sur la case de droite, il faudrait tourner puis avancer. Ce bloc seul ne fait pas avancer.
  - si:
      contient:
      - c
    relance: Reculer est une autre instruction. Ce bloc ne fait pas changer le robot de case.
  solution: Le robot pivote d'un quart de tour vers la droite, sur place. Il ne change de case qu'avec un bloc « avancer ».
- id: comparer-programmes-efficaces
  type: choix
  difficulte: 2
  enonce: Deux programmes font parcourir le même trajet avec obstacles à un robot. Comment savoir lequel est le plus efficace
    ?
  reponse:
    options:
    - id: a
      texte: En comparant par exemple le temps mis par chaque programme pour parcourir le trajet
    - id: b
      texte: En comptant le nombre de blocs, le plus court gagne toujours
    - id: c
      texte: On ne peut pas comparer deux programmes différents
    bonnes:
    - a
  indices:
    relance: Que peut-on mesurer pour dire qu'un programme fonctionne mieux qu'un autre ?
    methode: On peut comparer le résultat obtenu par chaque programme, par exemple le temps ou la réussite du trajet.
    etape: Élimine les réponses qui ne proposent pas de vraie comparaison des résultats.
  pieges:
  - si:
      contient:
      - b
    relance: Un programme plus court n'est pas toujours le plus efficace, ce qui compte c'est le résultat obtenu.
  - si:
      contient:
      - c
    relance: On peut très bien comparer deux programmes qui font la même tâche, en observant leurs résultats.
  solution: On compare les deux programmes, par exemple le temps mis pour parcourir le trajet en évitant les obstacles, pour
    identifier le plus efficace.
- id: pourquoi-programmer-robot
  type: choix
  difficulte: 1
  enonce: Pourquoi écrit-on un programme pour un robot ou un objet technique ?
  reponse:
    options:
    - id: a
      texte: Pour agir sur son comportement et obtenir un résultat attendu
    - id: b
      texte: Pour le rendre plus lourd
    - id: c
      texte: Pour changer sa couleur
    bonnes:
    - a
  indices:
    relance: Que veut-on obtenir de l'objet technique en le programmant ?
    methode: Un programme agit sur ce que fait l'objet, par exemple pour le faire se déplacer.
    etape: Élimine les réponses qui ne parlent pas de ce que fait l'objet.
  pieges:
  - si:
      contient:
      - b
    relance: Un programme ne change pas le poids d'un objet, il agit sur ce qu'il fait.
  - si:
      contient:
      - c
    relance: Un programme ne change pas la couleur d'un objet, il agit sur ce qu'il fait.
  solution: On écrit un programme pour agir sur le comportement de l'objet technique et obtenir un comportement attendu, comme
    le déplacement d'un robot.
- id: verifier-programme-fonctionne
  type: texte_court
  difficulte: 1
  enonce: 'Après avoir écrit un programme pour un robot, que doit-on faire pour savoir s''il est réussi : le lire seulement,
    ou aussi le faire fonctionner pour l''essayer ? Réponds par un seul verbe.'
  reponse:
    acceptees:
    - tester
    - le tester
    - essayer
    - l'essayer
    fautes_tolerees: 1
  indices:
    relance: La lecture seule suffit-elle à savoir si le robot va bien se comporter ?
    methode: On fait fonctionner le programme pour vérifier qu'il obtient bien le comportement attendu.
    etape: Le mot cherché est une action qu'on fait avec le robot, pas seulement avec les yeux.
  pieges:
  - si:
      valeur: lire
    relance: Lire le programme ne suffit pas pour vérifier qu'il fonctionne réellement sur le robot.
  solution: On doit aussi tester le programme en le faisant fonctionner sur l'objet technique, pas seulement le lire.
- id: corriger-programme-robot
  type: choix
  difficulte: 3
  enonce: 'Le robot doit avancer de 2 cases puis tourner à droite. Ton camarade a écrit : « tourner à droite », puis « avancer
    de 2 cases ». En testant, le robot part dans la mauvaise direction. Comment corriger le programme ?'
  reponse:
    options:
    - id: a
      texte: Échanger les deux blocs, puis tester à nouveau
    - id: b
      texte: Ajouter un deuxième bloc « tourner à droite » à la fin
    - id: c
      texte: Garder le programme, le robot finira par arriver
    bonnes:
    - a
  indices:
    relance: Dis avec des mots ce que fait le robot avec le programme écrit, bloc par bloc.
    methode: Compare l'ordre des blocs écrits avec l'ordre du trajet demandé. Les bons blocs sont-ils déjà là ?
    etape: Les deux blocs nécessaires sont présents. C'est leur place qui pose problème.
  pieges:
  - si:
      contient:
      - b
    relance: Ajouter un bloc changerait encore le trajet. Les bons blocs sont déjà là, regarde plutôt leur ordre.
  - si:
      contient:
      - c
    relance: Un programme fait exactement ce qui est écrit. Si on ne le change pas, le robot refera la même erreur.
  solution: 'Le robot tourne d''abord, puis avance : il part dans la mauvaise direction. Il faut échanger les deux blocs (avancer
    de 2 cases, puis tourner à droite), puis tester à nouveau.'
- id: utilite-associer-bloc-effet
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases à quoi sert d'associer chaque bloc d'un programme à son effet observable sur un
    robot.
  criteres:
  - L'élève comprend que cela permet de savoir ce que fait chaque instruction.
  - L'élève relie cette association à la possibilité de traduire le programme en langage naturel.
  - L'élève indique que cela aide à trouver et corriger un bloc qui ne donne pas le comportement attendu.
  indices:
    relance: Sans cette association, peut-on savoir ce que fait chaque bloc du programme ?
    methode: Associer un bloc à son effet permet de comprendre et de décrire le programme avec des mots.
    etape: Commence ainsi « Cela sert à... »
  solution: Cela sert à comprendre ce que fait chaque instruction du programme et permet de traduire le programme en langage
    naturel, avec des phrases simples. Si le robot ne fait pas ce qu'on attend, on peut ainsi retrouver le bloc fautif et
    le corriger.
