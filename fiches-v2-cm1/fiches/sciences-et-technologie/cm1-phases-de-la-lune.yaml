  solution: croissant ; pleine lune. Le croissant est une phase où une fine partie éclairée est visible.
- id: nblm-quel-mot-scientifique-designe-un-cycle-c-7
  type: texte_court
  difficulte: 1
  enonce: Quel mot scientifique désigne un cycle complet des phases de la Lune ?
  reponse:
    acceptees:
    - lunaison
    fautes_tolerees: 1
  indices:
    relance: Ce terme masculin commence par la lettre L.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
