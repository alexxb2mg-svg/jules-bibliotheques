format: 2
notion: cm1-phases-de-la-lune
version: 1
etat: verifiee
declencheurs:
- forme de la lune ce soir
- pleine lune
- croissant de lune
- lune change de forme
- observer la lune plusieurs fois
- lunaison
prerequis: []
essentiel: "La Lune n'a pas toujours la même forme vue depuis la Terre : elle passe par plusieurs phases qui se\n  répètent\
  \ (nouvelle lune, croissant, pleine lune, etc.).\n\n\n  En observant et en schématisant la Lune pendant deux lunaisons (deux\
  \ cycles complets), on constate qu'il existe\n  un cycle et on peut nommer les différentes phases."
methode:
- Observer la Lune dans le ciel, si possible chaque soir ou chaque nuit dégagée.
- Schématiser la forme observée (dessin simple de la partie éclairée visible).
- Répéter l'observation pendant deux lunaisons (deux cycles).
- Comparer les schémas pour constater qu'un cycle de phases se répète, et nommer chaque phase.
vocabulaire:
- terme: lunaison
  definition: un cycle complet des phases de la Lune, entre deux nouvelles lunes par exemple
- terme: phase de la Lune
  definition: la forme observée de la partie éclairée de la Lune, à un moment donné
erreurs_frequentes:
- Observer une seule fois et croire que la forme de la Lune ne change jamais.
- Oublier de schématiser régulièrement, ce qui empêche de voir le cycle.
- Ne pas observer assez longtemps (une seule lunaison ne suffit pas toujours à bien voir la répétition).
exemple:
  enonce: Comment savoir si la forme de la Lune suit un cycle qui se répète ?
  solution: 'On observe et on schématise la Lune régulièrement pendant deux lunaisons : si les mêmes formes reviennent dans
    le même ordre, cela confirme l''existence d''un cycle.'
exercices:
- id: nombre-lunaisons-observation
  type: choix
  difficulte: 1
  enonce: Pendant combien de lunaisons (cycles complets) observe-t-on la Lune en classe pour être sûr qu'un cycle se répète
    ?
  reponse:
    options:
    - id: a
      texte: Une seule lunaison
    - id: b
      texte: Deux lunaisons
    - id: c
      texte: Dix lunaisons
    bonnes:
    - b
  indices:
    relance: Il faut voir le cycle au moins revenir une fois, donc plus d'une seule fois complète.
    methode: Une seule lunaison montre le cycle une fois, mais ne prouve pas qu'il se répète. Il faut le voir recommencer.
    etape: 'Élimine l''option la plus longue : dix lunaisons n''est pas la durée indiquée par le texte officiel.'
  pieges:
  - si:
      contient:
      - a
    relance: Une seule lunaison montre le cycle une fois, mais ne prouve pas la répétition. Combien de fois faut-il l'observer
      pour être sûr ?
  - si:
      contient:
      - c
    relance: Dix lunaisons, c'est bien plus que nécessaire. Le texte officiel indique un nombre plus petit.
  solution: Deux lunaisons.
- id: action-a-chaque-observation
  type: texte_court
  difficulte: 1
  enonce: Que doit faire l'élève à chaque observation de la Lune, pour garder une trace de ce qu'il voit ?
  reponse:
    acceptees:
    - schematiser
    - dessiner
    fautes_tolerees: 1
  indices:
    relance: 'Ce n''est pas seulement regarder : il faut faire quelque chose pour garder un souvenir précis de la forme observée.'
    methode: Il doit représenter par un dessin simple la forme éclairée de la Lune qu'il observe.
    etape: Le mot du texte officiel commence par « schéma ».
  pieges:
  - si:
      valeur: observer
    relance: Observer, c'est regarder, mais il faut aussi faire une trace de ce qu'on voit. Quel geste permet de garder cette
      trace ?
  solution: Il doit schématiser la forme observée, pour pouvoir comparer les observations plus tard.
- id: une-seule-observation-limite
  type: choix
  difficulte: 2
  enonce: Pourquoi observer la Lune une seule fois ne suffit-il pas pour comprendre ses phases ?
  reponse:
    options:
    - id: a
      texte: Parce qu'une seule observation ne montre qu'une forme à un instant donné, et ne permet pas de voir le cycle se
        répéter
    - id: b
      texte: Parce que la Lune est invisible la plupart du temps
    - id: c
      texte: Parce que la Lune change de forme toutes les cinq minutes
    bonnes:
    - a
  indices:
    relance: 'Réfléchis à ce qu''une seule observation te montre : une forme unique, ou l''évolution dans le temps ?'
    methode: Pour voir un cycle, il faut plusieurs observations réparties dans le temps, pas une seule photo instantanée.
    etape: Élimine les deux options qui inventent des faits faux sur la Lune.
  pieges:
  - si:
      contient:
      - b
    relance: La Lune est visible régulièrement dans le ciel, ce n'est pas la bonne raison.
  - si:
      contient:
      - c
    relance: 'La Lune ne change pas de forme aussi vite : ses phases évoluent sur plusieurs jours, pas en quelques minutes.'
  solution: Une seule observation ne montre qu'une forme à un instant donné ; il faut plusieurs observations réparties dans
    le temps pour voir le cycle des phases se répéter.
- id: etapes-etude-phases
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes de la démarche pour étudier les phases de la Lune en classe.
  reponse:
    elements:
    - id: observer
      texte: Observer la Lune dans le ciel
    - id: schematiser
      texte: Schématiser la forme observée
    - id: repeter
      texte: Répéter l'observation pendant deux lunaisons
    - id: comparer
      texte: Comparer les schémas pour constater le cycle et nommer les phases
  indices:
    relance: Que fait-on en tout premier, avant même de pouvoir dessiner quoi que ce soit ?
    methode: On regarde d'abord la Lune, puis on la dessine, puis on répète cela plusieurs fois, puis on compare tous les
      dessins à la fin.
    etape: La première étape est d'observer la Lune dans le ciel.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Deux étapes voisines sont inversées. Rappelle-toi : on observe d''abord, puis on schématise ce qu''on a vu.'
  - si:
      diagnostic: ordre_faux
    relance: Repère la toute première étape (observer) et la toute dernière (comparer les schémas), puis range les deux autres
      entre elles.
  solution: On observe la Lune, puis on schématise la forme observée, puis on répète l'observation pendant deux lunaisons,
    puis on compare les schémas pour constater le cycle et nommer les phases.
- id: expliquer-methode-cycle
  type: ouverte
  difficulte: 3
  enonce: Un camarade affirme que la Lune change de forme au hasard, sans aucune règle. Explique en deux ou trois phrases
    comment tu pourrais lui montrer qu'il existe bien un cycle qui se répète.
  criteres:
  - L'élève propose d'observer et de schématiser la Lune régulièrement sur une longue période (au moins deux lunaisons).
  - L'élève explique qu'il faut comparer les schémas obtenus pour voir si les mêmes formes reviennent dans le même ordre.
  - L'élève conclut que la répétition des mêmes formes dans le même ordre prouve l'existence d'un cycle, contre l'idée du
    hasard.
  indices:
    relance: Comment prouver qu'un phénomène se répète, plutôt que d'affirmer que c'est le hasard ?
    methode: Observe et schématise la Lune pendant longtemps, puis compare les formes obtenues à différentes dates.
    etape: 'Tu peux commencer ainsi : « Je vais observer et schématiser la Lune chaque soir pendant... »'
  solution: Je vais observer et schématiser la Lune chaque soir pendant deux lunaisons. En comparant mes schémas, je verrai
    que les mêmes formes (nouvelle lune, croissant, pleine lune...) reviennent dans le même ordre à intervalles réguliers.
    Cette répétition prouve qu'il existe un cycle, et non un changement au hasard.
