format: 2
notion: cm1-phases-de-la-lune
version: 3
etat: verifiee
declencheurs:
- forme de la lune ce soir
- pleine lune
- croissant de lune
- lune change de forme
- observer la lune plusieurs fois
- lunaison
- lune toute ronde
- moitié de lune
- lune en forme de c
prerequis: []
essentiel: 'La Lune ne garde pas toujours la même forme quand on la regarde depuis la Terre. Un soir, on voit un fin croissant.
  Quelques jours plus tard, on voit une moitié de disque, puis un disque tout rond. Chaque forme s''appelle une phase de la
  Lune.


  Ce que l''on voit, c''est la partie éclairée de la Lune. Pendant un temps, cette partie grandit : on dit que la Lune est
  croissante. Ensuite, elle diminue : la Lune est décroissante.


  Voici les phases principales, dans l''ordre. La nouvelle lune : on ne la voit presque pas. Le premier croissant. Le premier
  quartier : une moitié de disque. La pleine lune : un disque entièrement éclairé. Le dernier quartier : l''autre moitié.
  Le dernier croissant. Puis la nouvelle lune revient.


  Un cycle complet des phases s''appelle une lunaison. Les phases reviennent toujours dans le même ordre : ce n''est pas le
  hasard, c''est un cycle.


  Pour le découvrir, on observe la Lune régulièrement, par exemple chaque soir où le ciel est dégagé. À chaque fois, on schématise
  la partie éclairée : un dessin simple, avec la date. En classe, on fait cela pendant deux lunaisons, pour vérifier que le
  cycle se répète.


  Une seule observation ne suffit pas : elle montre une forme, pas le cycle. On range donc ses schémas par date. On voit alors
  la partie éclairée grandir, puis diminuer, puis recommencer.

  '
methode:
- Observer la Lune dans le ciel, si possible chaque soir ou chaque nuit dégagée.
- Schématiser la forme observée (dessin simple de la partie éclairée visible) et noter la date.
- Répéter l'observation pendant deux lunaisons (deux cycles).
- Ranger les schémas par date et regarder si la partie éclairée grandit ou diminue.
- Comparer les schémas pour constater qu'un cycle de phases se répète, et nommer chaque phase.
vocabulaire:
- terme: lunaison
  definition: un cycle complet des phases de la Lune, entre deux nouvelles lunes par exemple
- terme: phase de la Lune
  definition: la forme observée de la partie éclairée de la Lune, à un moment donné
- terme: nouvelle lune
  definition: la phase où l'on ne voit presque pas la Lune
- terme: pleine lune
  definition: la phase où l'on voit un disque entièrement éclairé
- terme: quartier
  definition: la phase où l'on voit une moitié de disque éclairée (premier ou dernier quartier)
- terme: croissant
  definition: la phase où l'on voit seulement une fine partie éclairée, en forme d'arc
- terme: schématiser
  definition: faire un dessin simple qui montre l'essentiel de ce que l'on observe
erreurs_frequentes:
- Observer une seule fois et croire que la forme de la Lune ne change jamais.
- Oublier de schématiser régulièrement, ce qui empêche de voir le cycle.
- Ne pas observer assez longtemps (une seule lunaison ne suffit pas toujours à bien voir la répétition).
- 'Confondre premier quartier et dernier quartier : il faut regarder de quel côté la moitié est éclairée.'
- Croire que la Lune disparaît vraiment à la nouvelle lune, alors qu'on ne voit simplement pas sa partie éclairée.
exemple:
  enonce: Comment savoir si la forme de la Lune suit un cycle qui se répète ?
  solution: 'On observe et on schématise la Lune régulièrement pendant deux lunaisons, en notant la date de chaque dessin.
    On range ensuite les schémas dans l''ordre des dates : on voit la partie éclairée grandir (croissant, premier quartier,
    pleine lune), puis diminuer (dernier quartier, dernier croissant, nouvelle lune). Si les mêmes formes reviennent dans
    le même ordre pendant la deuxième lunaison, cela confirme l''existence d''un cycle.'
exercices:
- id: nombre-lunaisons-observation
  type: choix
  difficulte: 1
  enonce: Pendant combien de lunaisons (cycles complets) observe-t-on la Lune en classe pour être sûr qu'un cycle se répète
    ?
  reponse:
    options:
    - id: a
      texte: Une seule lunaison
    - id: b
      texte: Deux lunaisons
    - id: c
      texte: Dix lunaisons
    bonnes:
    - b
  indices:
    relance: Il faut voir le cycle au moins revenir une fois, donc plus d'une seule fois complète.
    methode: Une seule lunaison montre le cycle une fois, mais ne prouve pas qu'il se répète. Il faut le voir recommencer.
    etape: 'Élimine l''option la plus longue : dix lunaisons n''est pas la durée indiquée par le texte officiel.'
  pieges:
  - si:
      contient:
      - a
    relance: Une seule lunaison montre le cycle une fois, mais ne prouve pas la répétition. Combien de fois faut-il l'observer
      pour être sûr ?
  - si:
      contient:
      - c
    relance: Dix lunaisons, c'est bien plus que nécessaire. Le texte officiel indique un nombre plus petit.
  solution: Deux lunaisons.
- id: nom-disque-entier
  type: texte_court
  difficulte: 1
  enonce: Ce soir, la Lune est un disque bien rond, entièrement éclairé. Comment s'appelle cette phase de la Lune ?
  reponse:
    acceptees:
    - pleine lune
    - la pleine lune
    fautes_tolerees: 1
  indices:
    relance: Il ne manque aucun morceau au disque. La partie éclairée est-elle petite, moyenne ou la plus grande possible
      ?
    methode: Chaque phase a un nom. Cherche celle où tout le disque est visible, pas seulement une moitié ou un croissant.
    etape: Écarte les phases où l'on ne voit qu'une partie du disque (croissant, quartier) ou presque rien. Quelle phase reste
      ?
  pieges:
  - si:
      valeur: nouvelle lune
    relance: À la nouvelle lune, on ne voit presque rien. Ici, tout le disque est éclairé.
  - si:
      valeur: premier quartier
    relance: Au premier quartier, on ne voit qu'une moitié du disque. Ici, on le voit en entier.
  solution: C'est la pleine lune, la phase où le disque est entièrement éclairé.
- id: action-a-chaque-observation
  type: texte_court
  difficulte: 1
  enonce: Que doit faire l'élève à chaque observation de la Lune, pour garder une trace de ce qu'il voit ?
  reponse:
    acceptees:
    - schematiser
    - dessiner
    fautes_tolerees: 1
  indices:
    relance: 'Ce n''est pas seulement regarder : il faut faire quelque chose pour garder un souvenir précis de la forme observée.'
    methode: Il doit représenter par un dessin simple la forme éclairée de la Lune qu'il observe.
    etape: Tu as une feuille et un crayon. Que fais-tu de la forme éclairée que tu vois dans le ciel ?
  pieges:
  - si:
      valeur: observer
    relance: Observer, c'est regarder, mais il faut aussi faire une trace de ce qu'on voit. Quel geste permet de garder cette
      trace ?
  solution: Il doit schématiser la forme observée, pour pouvoir comparer les observations plus tard.
- id: une-seule-observation-limite
  type: choix
  difficulte: 2
  enonce: Pourquoi observer la Lune une seule fois ne suffit-il pas pour comprendre ses phases ?
  reponse:
    options:
    - id: a
      texte: Parce qu'une seule observation ne montre qu'une forme à un instant donné, et ne permet pas de voir le cycle se
        répéter
    - id: b
      texte: Parce que la Lune est invisible la plupart du temps
    - id: c
      texte: Parce que la Lune change de forme toutes les cinq minutes
    bonnes:
    - a
  indices:
    relance: 'Réfléchis à ce qu''une seule observation te montre : une forme unique, ou l''évolution dans le temps ?'
    methode: Pour voir un cycle, il faut plusieurs observations réparties dans le temps, pas une seule photo instantanée.
    etape: Élimine les deux options qui inventent des faits faux sur la Lune.
  pieges:
  - si:
      contient:
      - b
    relance: La Lune est visible régulièrement dans le ciel, ce n'est pas la bonne raison.
  - si:
      contient:
      - c
    relance: 'La Lune ne change pas de forme aussi vite : ses phases évoluent sur plusieurs jours, pas en quelques minutes.'
  solution: Une seule observation ne montre qu'une forme à un instant donné ; il faut plusieurs observations réparties dans
    le temps pour voir le cycle des phases se répéter.
- id: etapes-etude-phases
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes de la démarche pour étudier les phases de la Lune en classe.
  reponse:
    elements:
    - id: observer
      texte: Observer la Lune dans le ciel
    - id: schematiser
      texte: Schématiser la forme observée
    - id: repeter
      texte: Répéter l'observation pendant deux lunaisons
    - id: comparer
      texte: Comparer les schémas pour constater le cycle et nommer les phases
  indices:
    relance: Que fait-on en tout premier, avant même de pouvoir dessiner quoi que ce soit ?
    methode: On regarde d'abord la Lune, puis on la dessine, puis on répète cela plusieurs fois, puis on compare tous les
      dessins à la fin.
    etape: La première étape est d'observer la Lune dans le ciel.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Deux étapes voisines sont inversées. Rappelle-toi : on observe d''abord, puis on schématise ce qu''on a vu.'
  - si:
      diagnostic: ordre_faux
    relance: Repère la toute première étape (observer) et la toute dernière (comparer les schémas), puis range les deux autres
      entre elles.
  solution: On observe la Lune, puis on schématise la forme observée, puis on répète l'observation pendant deux lunaisons,
    puis on compare les schémas pour constater le cycle et nommer les phases.
- id: ordre-phases-lunaison
  type: ordre
  difficulte: 2
  enonce: Range ces phases de la Lune dans l'ordre où on les observe pendant une lunaison, en commençant par la nouvelle lune.
  reponse:
    elements:
    - id: nouvelle-lune
      texte: Nouvelle lune (on ne voit presque rien)
    - id: premier-quartier
      texte: Premier quartier (une moitié de disque)
    - id: pleine-lune
      texte: Pleine lune (le disque entier)
    - id: dernier-quartier
      texte: Dernier quartier (l'autre moitié du disque)
  indices:
    relance: Après la nouvelle lune, la partie éclairée grandit-elle ou diminue-t-elle ?
    methode: La partie éclairée grandit jusqu'au disque entier, puis elle diminue. Range les phases de la plus petite partie
      visible à la plus grande, puis la moitié qui reste.
    etape: Parmi ces quatre phases, celle qui suit la nouvelle lune est la moitié de disque qui grandit, le « premier » quartier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux phases voisines sont inversées. Le disque entier arrive-t-il avant ou après la première moitié ?
  - si:
      diagnostic: ordre_faux
    relance: 'Pense au mot « premier » et au mot « dernier » : l''un vient avant le disque entier, l''autre après.'
  solution: Nouvelle lune, puis premier quartier, puis pleine lune, puis dernier quartier. Ensuite la nouvelle lune revient
    et une nouvelle lunaison commence.
- id: associer-forme-phase
  type: association
  difficulte: 3
  enonce: Relie chaque forme observée au nom de la phase de la Lune.
  reponse:
    gauche:
    - id: a
      texte: On ne voit presque rien de la Lune
    - id: b
      texte: Un disque entièrement éclairé
    - id: c
      texte: Une moitié de disque éclairée, qui va grandir les jours suivants
    - id: d
      texte: Une moitié de disque éclairée, qui va diminuer les jours suivants
    droite:
    - id: w
      texte: Nouvelle lune
    - id: x
      texte: Pleine lune
    - id: y
      texte: Premier quartier
    - id: z
      texte: Dernier quartier
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Commence par les deux formes les plus faciles, celle où l'on ne voit rien et celle où l'on voit tout.
    methode: Pour les deux moitiés, regarde si la partie éclairée va grandir ou diminuer. Le « premier » quartier arrive pendant
      que la Lune grandit.
    etape: La moitié qui va grandir arrive avant le disque entier, dans la première partie de la lunaison.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux moitiés de disque, ce sont elles qu'on confond le plus.
  - si:
      diagnostic: associations_fausses
    relance: 'Reprends dans l''ordre de la lunaison : on ne voit rien, puis une moitié qui grandit, puis tout, puis une moitié
      qui diminue.'
  solution: 'On ne voit presque rien : nouvelle lune. Disque entier : pleine lune. Moitié qui va grandir : premier quartier.
    Moitié qui va diminuer : dernier quartier.'
- id: expliquer-methode-cycle
  type: ouverte
  difficulte: 3
  enonce: Un camarade affirme que la Lune change de forme au hasard, sans aucune règle. Explique en deux ou trois phrases
    comment tu pourrais lui montrer qu'il existe bien un cycle qui se répète.
  criteres:
  - L'élève propose d'observer et de schématiser la Lune régulièrement sur une longue période (au moins deux lunaisons).
  - L'élève explique qu'il faut comparer les schémas obtenus pour voir si les mêmes formes reviennent dans le même ordre.
  - L'élève conclut que la répétition des mêmes formes dans le même ordre prouve l'existence d'un cycle, contre l'idée du
    hasard.
  indices:
    relance: Comment prouver qu'un phénomène se répète, plutôt que d'affirmer que c'est le hasard ?
    methode: Observe et schématise la Lune pendant longtemps, puis compare les formes obtenues à différentes dates.
    etape: 'Tu peux commencer ainsi : « Je vais observer et schématiser la Lune chaque soir pendant... »'
  solution: Je vais observer et schématiser la Lune chaque soir pendant deux lunaisons. En comparant mes schémas, je verrai
    que les mêmes formes (nouvelle lune, croissant, pleine lune...) reviennent dans le même ordre à intervalles réguliers.
    Cette répétition prouve qu'il existe un cycle, et non un changement au hasard.
