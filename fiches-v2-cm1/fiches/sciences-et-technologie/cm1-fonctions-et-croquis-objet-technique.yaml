format: 2
notion: cm1-fonctions-et-croquis-objet-technique
version: 3
etat: verifiee
declencheurs:
- à quoi ça sert cette pièce
- dessiner un objet à main levée
- ce qui protège la tête
- assembler des morceaux ensemble
- casque de vélo composants
- pourquoi ce bouchon
- croquis légendé
- fonction d'un objet
- pourquoi c'est en plastique
- sous-ensemble d'un vélo
prerequis: []
essentiel: 'Un objet technique est un objet fabriqué par l''être humain pour répondre à un besoin : un stylo pour écrire,
  un casque pour protéger la tête, une lampe de poche pour éclairer.


  Il est fait de plusieurs composants (des pièces), qui ont chacun une forme et un matériau. Chaque élément assure une fonction
  : c''est-à-dire à quoi il sert. Sur un stylo à bille, le bouchon protège la pointe, le tube contient l''encre, la bille
  dépose l''encre sur la feuille en roulant.


  La forme et le matériau ne sont pas choisis au hasard. On peut justifier chaque choix par la fonction. La coque d''un casque
  de vélo est en plastique dur pour résister aux chocs. La mousse à l''intérieur est molle pour amortir. La sangle se ferme
  sous le menton pour que le casque reste en place.


  Plusieurs composants qui travaillent ensemble forment un sous-ensemble. Sur un vélo, les pédales, le pédalier, la chaîne
  et le pignon forment le sous-ensemble qui fait avancer la roue arrière. Les poignées de frein, les câbles et les patins
  forment le sous-ensemble qui freine.


  Pour représenter un objet, on fait un croquis à main levée : un dessin rapide, sans règle, qui montre les éléments importants.
  On ajoute une légende : des traits qui partent de chaque élément vers son nom, et parfois sa fonction. Un croquis légendé
  permet d''expliquer comment l''objet fonctionne.

  '
methode:
- Observer chaque composant, forme ou matériau de l'objet technique.
- Pour chaque élément, identifier la fonction qu'il assure et justifier son utilité.
- Expliquer le choix d'un matériau ou d'une forme par la fonction (dur pour résister, mou pour amortir, souple pour plier).
- Repérer les sous-ensembles, c'est-à-dire les groupes de composants qui fonctionnent ensemble.
- Réaliser un croquis à main levée, puis le légender avec le nom (et la fonction) de chaque élément.
vocabulaire:
- terme: objet technique
  definition: un objet fabriqué par l'être humain pour répondre à un besoin
- terme: composant
  definition: une pièce de l'objet technique, avec une forme et un matériau
- terme: fonction
  definition: ce à quoi sert un élément de l'objet (protéger, contenir, amortir, éclairer)
- terme: sous-ensemble
  definition: un groupe de composants qui fonctionnent ensemble pour une partie du fonctionnement
- terme: croquis à main levée
  definition: un dessin rapide, fait sans règle, qui montre les éléments importants d'un objet
- terme: légende
  definition: les mots reliés par des traits aux éléments d'un croquis, pour les nommer et expliquer leur rôle
erreurs_frequentes:
- Décrire un objet sans justifier l'utilité de chaque élément par sa fonction.
- Confondre un composant isolé et un sous-ensemble, qui regroupe plusieurs composants.
- Faire un croquis sans légende, qui n'explique pas le fonctionnement de l'objet.
- Croire que le matériau est choisi pour la couleur ou la beauté, au lieu de la fonction.
- Passer trop de temps sur les détails du dessin au lieu de montrer les éléments utiles.
exemple:
  enonce: Pourquoi un stylo à bille a-t-il un bouchon, et pourquoi ce bouchon a-t-il une petite agrafe ?
  solution: 'Le bouchon assure une fonction technique : il protège la pointe du stylo et empêche l''encre de sécher ou de
    tacher. La petite agrafe est une forme choisie pour une autre fonction : accrocher le stylo à une poche ou à un cahier.'
exercices:
- id: fonction-mousse-casque
  type: texte_court
  difficulte: 1
  enonce: 'Sur un casque de vélo, quelle est la fonction de la mousse intérieure : elle protège, ou elle décore ? (réponds
    en un mot)'
  reponse:
    acceptees:
    - protège
    - protege
    - elle protège
    fautes_tolerees: 1
  indices:
    relance: Pense à ce qui amortit un choc en cas de chute.
    methode: Chaque partie du casque assure une fonction technique utile.
    etape: La mousse est molle et absorbe les chocs contre la tête.
  pieges:
  - si:
      valeur: décore
    relance: La mousse n'est pas là pour l'apparence, elle sert à autre chose de plus utile en cas de chute.
  solution: La mousse intérieure protège la tête, elle amortit les chocs.
- id: composant-vs-sous-ensemble
  type: choix
  difficulte: 2
  enonce: Quelle est la différence entre un composant et un sous-ensemble d'un objet technique ?
  reponse:
    options:
    - id: a
      texte: Un composant est un élément isolé, un sous-ensemble regroupe plusieurs composants qui fonctionnent ensemble
    - id: b
      texte: Un composant est plus grand qu'un sous-ensemble
    - id: c
      texte: Il n'y a aucune différence entre les deux
    bonnes:
    - a
  indices:
    relance: Un sous-ensemble contient-il un seul élément, ou plusieurs ?
    methode: Un sous-ensemble regroupe plusieurs composants qui travaillent ensemble pour une partie du fonctionnement.
    etape: Élimine les réponses qui ne parlent pas de regroupement de composants.
  pieges:
  - si:
      contient:
      - b
    relance: La taille n'est pas le critère, c'est le regroupement de plusieurs éléments qui compte.
  - si:
      contient:
      - c
    relance: Il y a bien une différence, réfléchis à ce que regroupe un sous-ensemble par rapport à un composant.
  solution: Un composant est un élément isolé de l'objet, un sous-ensemble regroupe plusieurs composants qui fonctionnent
    ensemble.
- id: association-composant-fonction
  type: association
  difficulte: 2
  enonce: Relie chaque composant d'un stylo à bille à sa fonction.
  reponse:
    gauche:
    - id: a
      texte: Le bouchon
    - id: b
      texte: Le tube
    - id: c
      texte: La bille
    droite:
    - id: x
      texte: Contient l'encre
    - id: y
      texte: Protège la pointe
    - id: z
      texte: Dépose l'encre sur la feuille en roulant
    paires:
      a: y
      b: x
      c: z
  indices:
    relance: Pense à ce qui touche la feuille, ce qui contient le liquide, et ce qui protège la pointe.
    methode: Chaque composant du stylo a une fonction précise et différente des autres.
    etape: Commence par le tube, qui est un réservoir.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse, revérifie quel composant assure quelle fonction.
  - si:
      diagnostic: associations_fausses
    relance: Repense à ce qui protège, ce qui contient, et ce qui dépose l'encre en roulant.
  solution: Le bouchon protège la pointe, le tube contient l'encre, la bille dépose l'encre sur la feuille en roulant.
- id: materiau-coque-casque
  type: choix
  difficulte: 2
  enonce: La coque extérieure d'un casque de vélo est en plastique dur. Pourquoi a-t-on choisi ce matériau ?
  reponse:
    options:
    - id: a
      texte: Pour résister aux chocs et aux frottements sur la route en cas de chute
    - id: b
      texte: Parce que le plastique dur est plus joli
    - id: c
      texte: Pour que le casque soit le plus lourd possible
    bonnes:
    - a
  indices:
    relance: Un matériau est choisi pour la fonction de l'élément. Que doit faire la coque quand le cycliste tombe ?
    methode: La mousse, à l'intérieur, amortit. La coque, à l'extérieur, est la première à toucher le sol.
    etape: Élimine l'option qui parle d'apparence et celle qui gênerait le cycliste.
  pieges:
  - si:
      contient:
      - b
    relance: L'apparence n'est pas la raison du choix. Pense à ce qui arrive à la coque pendant une chute.
  - si:
      contient:
      - c
    relance: Un casque lourd fatiguerait le cou. Le matériau est choisi pour une fonction de protection.
  solution: La coque est en plastique dur pour résister aux chocs et aux frottements, la mousse intérieure amortissant le
    reste du choc.
- id: sous-ensemble-velo
  type: choix
  difficulte: 3
  enonce: Sur un vélo, quels composants font partie du sous-ensemble qui transmet l'effort des jambes jusqu'à la roue arrière
    ?
  reponse:
    options:
    - id: a
      texte: Les pédales
    - id: b
      texte: La chaîne
    - id: c
      texte: La sonnette
    - id: d
      texte: Le guidon
    bonnes:
    - a
    - b
  indices:
    relance: Suis le chemin de l'effort, depuis les pieds du cycliste jusqu'à la roue arrière.
    methode: Un sous-ensemble regroupe des composants qui travaillent ensemble pour une même fonction. Ici, la fonction est
      de faire tourner la roue arrière.
    etape: Élimine le composant qui sert à prévenir les piétons et celui qui sert à diriger.
  pieges:
  - si:
      contient:
      - c
    relance: La sonnette sert à prévenir, elle ne fait pas avancer le vélo.
  - si:
      contient:
      - d
    relance: Le guidon sert à diriger le vélo, pas à faire tourner la roue arrière.
  - si:
      diagnostic: incomplet
    relance: Il manque un composant. L'effort part des pieds et doit arriver jusqu'à la roue arrière.
  solution: Les pédales et la chaîne font partie de ce sous-ensemble (avec le pédalier et le pignon). La sonnette et le guidon
    ont d'autres fonctions.
- id: element-croquis-legende
  type: texte_court
  difficulte: 1
  enonce: Sur un croquis, comment appelle-t-on les mots reliés par des traits aux éléments de l'objet, pour les nommer ?
  reponse:
    acceptees:
    - legende
    - la legende
    fautes_tolerees: 1
  indices:
    relance: Sous une photo dans un journal, il y a souvent une phrase qui explique l'image. On utilise le même mot.
    methode: Ces mots nomment chaque élément du dessin et peuvent indiquer sa fonction.
    etape: Ce mot désigne aussi la phrase qui explique une image sous une photo, ou les symboles expliqués à côté d'une carte.
  pieges:
  - si:
      valeur: titre
    relance: Le titre nomme le dessin en entier. Ici, on cherche les mots qui nomment chaque élément.
  solution: C'est la légende. Un croquis légendé nomme chaque élément et aide à expliquer le fonctionnement.
- id: identifier-fonction-non-utile
  type: choix
  difficulte: 1
  enonce: Sur un objet technique, pourquoi identifie-t-on la fonction de chaque composant ?
  reponse:
    options:
    - id: a
      texte: Pour comprendre à quoi sert chaque élément et justifier son utilité
    - id: b
      texte: Pour compter le nombre de pièces
    - id: c
      texte: Pour connaître le prix de l'objet
    bonnes:
    - a
  indices:
    relance: Que cherche-t-on à comprendre quand on observe chaque partie d'un objet ?
    methode: On veut savoir pourquoi chaque élément est là et ce qu'il apporte à l'objet.
    etape: Élimine les réponses qui ne parlent pas d'utilité ou de fonctionnement.
  pieges:
  - si:
      contient:
      - b
    relance: Compter les pièces ne dit rien sur leur utilité, ce n'est pas le but recherché.
  - si:
      contient:
      - c
    relance: Le prix n'est pas lié à la fonction technique d'un composant.
  solution: On identifie la fonction de chaque composant pour comprendre à quoi il sert et justifier son utilité dans l'objet.
- id: role-croquis-legende
  type: ouverte
  difficulte: 3
  enonce: Tu dois faire le croquis légendé d'une lampe de poche. Explique en deux ou trois phrases comment tu t'y prends,
    et ce que ton croquis doit permettre de comprendre.
  criteres:
  - L'élève dessine à main levée les éléments importants (par exemple l'ampoule, les piles, l'interrupteur, le boîtier).
  - L'élève ajoute une légende qui nomme les éléments et, si possible, leur fonction.
  - L'élève explique que le croquis légendé doit permettre de comprendre le fonctionnement de l'objet.
  indices:
    relance: Un dessin seul, sans mots autour, explique-t-il comment marche l'objet ?
    methode: Dessine rapidement les éléments utiles, puis relie chacun à son nom et à sa fonction par un trait.
    etape: Commence ainsi « Je dessine à main levée... »
  solution: 'Je dessine à main levée le boîtier, les piles, l''interrupteur et l''ampoule. Je relie chaque élément par un
    trait à son nom et à sa fonction : les piles fournissent l''énergie, l''interrupteur allume ou éteint, l''ampoule éclaire.
    Ainsi, mon croquis légendé explique comment la lampe fonctionne, pas seulement à quoi elle ressemble.'
- id: nblm-pourquoi-un-stylo-a-bille-a-t-il-un-bouc-1
  type: choix
  difficulte: 2
  enonce: Pourquoi un stylo à bille a-t-il un bouchon ?
  reponse:
    options:
    - id: o1
      texte: Il protège la pointe du stylo et permet de l'accrocher.
    - id: o2
      texte: Il sert seulement à décorer le stylo sans utilité technique.
    - id: o3
      texte: Il contient l'encre nécessaire pour pouvoir écrire.
    - id: o4
      texte: Il permet de faire sortir la bille quand on appuie dessus.
    bonnes:
    - o1
  indices:
    relance: Pense à la protection de la pointe lorsque le stylo est rangé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : chaque élément d''un objet technique a une fonction précise, il ne sert pas seulement
      à décorer.'
  - si:
      contient:
      - o3
    relance: 'Attention à ne pas confondre les pièces : c''est le tube qui contient l''encre, pas le bouchon.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : le bouchon est une pièce amovible de protection, il n''actionne pas le mécanisme de la bille.'
  solution: 'Il protège la pointe du stylo et permet de l''accrocher. C''est exact : le bouchon assure une fonction technique
    en protégeant la pointe et en permettant l''accrochage.'
- id: nblm-sur-un-casque-de-velo-quels-composants-a-2
  type: choix
  difficulte: 2
  enonce: Sur un casque de vélo, quels composants assurent principalement la fonction de protéger la tête contre les chocs
    ?
  reponse:
    options:
    - id: o1
      texte: La coque extérieure et la mousse de protection.
    - id: o2
      texte: La sangle d'attache sous le menton.
    - id: o3
      texte: La molette de réglage située à l'arrière.
    - id: o4
      texte: Les motifs colorés peints sur le casque.
    bonnes:
    - o1
  indices:
    relance: Pense aux éléments solides et rembourrés qui recouvrent le crâne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la sangle sert à maintenir le casque sur la tête, mais elle ne protège pas directement contre
      le choc.'
  - si:
      contient:
      - o3
    relance: 'Confusion de fonctions : la molette permet d''ajuster la taille du casque, pas d''amortir les chocs.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : les motifs sont esthétiques et ne constituent pas une solution de protection.'
  solution: 'La coque extérieure et la mousse de protection. C''est juste : la coque et la mousse forment la structure de
    protection qui absorbe les impacts.'
- id: nblm-comment-appelle-t-on-un-dessin-realise-r-3
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on un dessin réalisé rapidement sans règle ni compas pour représenter un objet technique ?
  reponse:
    options:
    - id: o1
      texte: Un croquis à main levée.
    - id: o2
      texte: Un schéma fait à l'ordinateur.
    - id: o3
      texte: Une photographie en couleur.
    - id: o4
      texte: Une maquette en trois dimensions.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au terme utilisé pour un dessin fait sans instruments de géométrie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Attention : une photo est une prise de vue réelle, pas un dessin manuel.'
  - si:
      contient:
      - o4
    relance: 'Confusion d''outil : une maquette est un objet fabriqué en volume, pas un dessin.'
  solution: 'Un croquis à main levée. C''est exact : le croquis à main levée permet de représenter les formes d''un objet
    sans instruments de tracé.'
- id: nblm-quelle-erreur-frequente-faut-il-eviter-l-4
  type: choix
  difficulte: 2
  enonce: Quelle erreur fréquente faut-il éviter lors de la réalisation du dessin d'un objet technique ?
  reponse:
    options:
    - id: o1
      texte: Faire un croquis sans légende.
    - id: o2
      texte: Utiliser un crayon à papier pour dessiner.
    - id: o3
      texte: Représenter plusieurs pièces de l'objet.
    - id: o4
      texte: Indiquer le nom de l'objet sous le dessin.
    bonnes:
    - o1
  indices:
    relance: Pense aux annotations textuelles nécessaires pour faire comprendre le rôle des composants.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est incorrect : le crayon à papier est l''outil tout à fait adapté pour réaliser un croquis.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : il est au contraire nécessaire de dessiner les pièces pour comprendre l''assemblage.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : nommer l''objet représenté est une bonne pratique et non une erreur.'
  solution: 'Faire un croquis sans légende. C''est exact : un croquis sans légende est une erreur fréquente car il n''explique
    pas le fonctionnement de l''objet.'
- id: nblm-dans-un-objet-technique-pourquoi-se-pose-5
  type: choix
  difficulte: 2
  enonce: Dans un objet technique, pourquoi se poser la question « à quoi ça sert cette pièce ? » pour chaque composant ?
  reponse:
    options:
    - id: o1
      texte: Pour justifier l'utilité de chaque élément par sa fonction.
    - id: o2
      texte: Pour compter le nombre total de pièces dans la boîte.
    - id: o3
      texte: Pour deviner le prix de vente de l'objet au magasin.
    - id: o4
      texte: Pour savoir dans quel pays l'objet a été fabriqué.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au lien entre le rôle d'un élément et le fonctionnement global de l'objet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : se demander à quoi sert une pièce concerne son rôle, pas seulement le dénombrement.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la fonction technique n''indique pas la valeur financière de l''objet.'
  - si:
      contient:
      - o4
    relance: 'C''est une confusion : l''origine géographique n''a pas de lien direct avec la fonction technique du composant.'
  solution: 'Pour justifier l''utilité de chaque élément par sa fonction. C''est tout à fait juste : chaque composant ou matériau
    répond à une fonction précise qui justifie sa présence.'
