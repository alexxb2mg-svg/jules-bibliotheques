format: 2
notion: cm1-changements-morphologiques-puberte
version: 3
etat: generee
declencheurs:
- grandir très vite
- poils qui apparaissent
- silhouette qui change
- courbe qui monte fort
- est-ce que c'est normal de changer
- pas au même âge que les copains
- mon corps change
- devenir ado
prerequis: []
essentiel: 'La puberté est une période de la vie où le corps change et commence à ressembler à un corps d''adulte. Ces changements
  de forme et de taille du corps s''appellent des changements morphologiques.


  Pendant la puberté, la taille et la masse du corps augmentent beaucoup. Des poils apparaissent : c''est le développement
  de la pilosité. Les organes génitaux externes se développent. La silhouette change aussi : les seins et les hanches peuvent
  se développer.


  La puberté ne commence pas au même âge pour tout le monde. Dans une même classe, un élève peut avoir déjà beaucoup grandi
  alors que son voisin n''a pas encore commencé. La puberté n''a pas non plus les mêmes effets chez chacun. Tous ces changements
  sont normaux.


  Une courbe de croissance montre la taille (ou la masse) d''une personne au fil des années. Pendant la puberté, la courbe
  monte beaucoup plus vite que d''habitude. En comparant les courbes de plusieurs personnes, on voit que cette montée rapide
  n''arrive pas au même moment pour tout le monde.


  Il est normal de se poser des questions sur ces changements. On peut en parler avec un adulte de confiance, par exemple
  un parent, l''infirmière ou l''infirmier scolaire, ou un médecin.

  '
methode:
- Observer des documents qui décrivent les changements du corps à la puberté.
- 'Repérer les principaux changements : taille, masse, pilosité, silhouette, organes génitaux externes.'
- Vérifier que chaque changement repéré touche bien la forme ou la taille du corps.
- Lire une courbe de croissance pour repérer le moment où elle monte le plus vite.
- Comparer plusieurs courbes de croissance pour constater que ce moment varie selon les personnes.
vocabulaire:
- terme: puberté
  definition: la période de la vie où le corps change et commence à ressembler à un corps d'adulte
- terme: changement morphologique
  definition: un changement de la forme ou de la taille du corps
- terme: pilosité
  definition: l'ensemble des poils qui poussent sur le corps
- terme: silhouette
  definition: la forme générale du corps, vue de loin
- terme: courbe de croissance
  definition: un graphique qui montre comment la taille ou la masse d'une personne change au fil des années
erreurs_frequentes:
- Croire que la puberté se produit au même âge pour tout le monde.
- Croire qu'un changement plus précoce ou plus tardif que chez les camarades n'est pas normal.
- Croire que la puberté a exactement les mêmes effets chez chaque personne.
- Confondre les changements liés à la puberté avec d'autres changements qui n'y sont pas liés (comme la couleur des yeux).
- Sur une courbe de croissance, regarder seulement la taille atteinte au lieu de regarder à quel moment la courbe monte le
  plus vite.
exemple:
  enonce: Sur une courbe de croissance, comment repérer la période de la puberté ?
  solution: 'On cherche la partie où la courbe de taille (ou de masse) monte beaucoup plus vite que d''habitude : la taille
    augmente plus en une année que les années d''avant. C''est la phase d''augmentation rapide caractéristique de la puberté.'
exercices:
- id: liste-changements-puberte
  type: choix
  difficulte: 1
  enonce: Parmi ces changements, lesquels peuvent se produire à la puberté ?
  reponse:
    options:
    - id: a
      texte: Augmentation de la taille
    - id: b
      texte: Développement de la pilosité
    - id: c
      texte: Changement de couleur des yeux
    - id: d
      texte: Développement des organes génitaux externes
    bonnes:
    - a
    - b
    - d
  indices:
    relance: Un de ces changements n'est pas cité parmi les transformations de la puberté.
    methode: Les changements de la puberté touchent la taille, la masse, la pilosité, la silhouette, les organes génitaux
      externes.
    etape: La couleur des yeux ne fait pas partie des changements liés à la puberté.
  pieges:
  - si:
      contient:
      - c
    relance: La couleur des yeux ne change pas à la puberté, ce n'est pas un des changements décrits.
  - si:
      diagnostic: incomplet
    relance: Plusieurs changements corrects sont listés ici, vérifie que tu les as tous cochés.
  solution: La puberté peut apporter une augmentation de la taille, le développement de la pilosité et celui des organes génitaux
    externes. La couleur des yeux ne change pas.
- id: age-different-normal
  type: choix
  difficulte: 1
  enonce: Deux camarades du même âge n'ont pas commencé leur puberté au même moment. Est-ce normal ?
  reponse:
    options:
    - id: a
      texte: Oui, c'est normal
    - id: b
      texte: Non, il faut consulter un médecin obligatoirement
    - id: c
      texte: Non, l'un des deux a un problème
    bonnes:
    - a
  indices:
    relance: La puberté se produit-elle au même âge pour tout le monde ?
    methode: La puberté se produit à des âges différents selon les individus.
    etape: Élimine les réponses qui présentent cette situation comme un problème.
  pieges:
  - si:
      contient:
      - b
    relance: Ce n'est pas un problème médical en soi ; la puberté arrive naturellement à des âges différents.
  - si:
      contient:
      - c
    relance: Aucun des deux camarades n'a de problème ; ces différences d'âge sont normales.
  solution: Oui, c'est normal, la puberté se produit à des âges différents selon les individus.
- id: nom-des-poils
  type: texte_court
  difficulte: 1
  enonce: À la puberté, des poils apparaissent sur certaines parties du corps. Quel mot désigne l'ensemble des poils du corps
    ?
  reponse:
    acceptees:
    - pilosité
    - la pilosité
    fautes_tolerees: 1
  indices:
    relance: C'est un mot de la leçon, plus savant que le simple mot « poils ».
    methode: Relis la liste des changements de la puberté dans ta leçon. Un mot savant parle des poils.
    etape: Dans la leçon, on parle du « développement de la ... » pour dire que les poils apparaissent. Quel est ce mot ?
  pieges:
  - si:
      valeur: poils
    relance: Oui, il s'agit des poils, mais on cherche le mot savant qui désigne leur ensemble.
  solution: C'est la pilosité. À la puberté, on parle du développement de la pilosité.
- id: lecture-courbe-croissance
  type: texte_court
  difficulte: 2
  enonce: 'Sur une courbe de croissance, comment se comporte la ligne pendant la puberté : elle monte lentement, ou elle monte
    vite ? (réponds en un mot : vite ou lentement)'
  reponse:
    acceptees:
    - vite
    fautes_tolerees: 1
  indices:
    relance: Pense à ce que montre une augmentation rapide de taille sur un graphique.
    methode: Pendant la puberté, la taille et la masse augmentent beaucoup plus que d'habitude.
    etape: Si la taille augmente beaucoup en peu de temps, la ligne se redresse-t-elle ou reste-t-elle presque plate ?
  pieges:
  - si:
      valeur: lentement
    relance: 'C''est l''inverse : pendant la puberté, la courbe monte plus fort que d''habitude, pas plus doucement.'
  solution: Pendant la puberté, la courbe de croissance monte vite, plus vite qu'avant ou après cette période.
- id: relier-changement-categorie
  type: association
  difficulte: 2
  enonce: Relie chaque observation au changement de la puberté qui lui correspond.
  reponse:
    gauche:
    - id: obs-poils
      texte: Des poils poussent sous les bras
    - id: obs-taille
      texte: Le pantalon de l'an dernier est devenu trop court
    - id: obs-hanches
      texte: Les hanches s'élargissent
    droite:
    - id: chg-pilosite
      texte: Développement de la pilosité
    - id: chg-taille
      texte: Augmentation de la taille
    - id: chg-silhouette
      texte: Changement de la silhouette
    paires:
      obs-poils: chg-pilosite
      obs-taille: chg-taille
      obs-hanches: chg-silhouette
  indices:
    relance: Pour chaque observation, demande-toi quelle partie du corps change.
    methode: Les poils concernent la pilosité, la longueur du corps concerne la taille, la forme du corps concerne la silhouette.
    etape: 'Commence par le pantalon trop court : qu''est-ce qui a changé chez la personne qui le porte ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la définition de silhouette, puis vérifie tes liens.
  - si:
      diagnostic: associations_fausses
    relance: Reprends une observation à la fois et cherche le mot de la leçon qui la décrit.
  solution: Les poils sous les bras correspondent au développement de la pilosité. Le pantalon trop court montre l'augmentation
    de la taille. Les hanches qui s'élargissent montrent un changement de la silhouette.
- id: element-non-morphologique
  type: choix
  difficulte: 2
  enonce: Lequel de ces éléments n'est PAS un changement morphologique du corps à la puberté ?
  reponse:
    options:
    - id: a
      texte: L'élargissement des hanches
    - id: b
      texte: La note obtenue à un contrôle
    - id: c
      texte: Le développement des seins
    bonnes:
    - b
  indices:
    relance: Deux de ces trois éléments concernent le corps qui change physiquement.
    methode: Un changement morphologique touche la forme ou la taille du corps, pas une note scolaire.
    etape: Élimine les deux réponses qui parlent du corps.
  pieges:
  - si:
      contient:
      - a
    relance: L'élargissement des hanches est bien un changement morphologique cité dans le cours.
  - si:
      contient:
      - c
    relance: Le développement des seins est bien un changement morphologique cité dans le cours.
  solution: La note à un contrôle n'a rien à voir avec un changement morphologique du corps. L'élargissement des hanches et
    le développement des seins sont des changements morphologiques possibles à la puberté.
- id: annee-qui-monte-vite
  type: nombre
  difficulte: 3
  enonce: Sur la courbe de croissance de Léo, sa taille passe de 140 cm à 144 cm pendant une première année, puis de 144 cm
    à 152 cm l'année suivante. De combien de centimètres a-t-il grandi pendant l'année où sa courbe monte le plus vite ?
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Combien a-t-il grandi la première année ? Et la deuxième ?
    methode: Pour chaque année, calcule la différence entre la taille de la fin et la taille du début, puis garde la plus
      grande.
    etape: 'Première année : 144 − 140. Fais le même calcul pour la deuxième année, puis compare.'
  pieges:
  - si:
      valeur: 4
    relance: C'est ce qu'il a grandi la première année. Pendant l'autre année, a-t-il grandi plus ?
  - si:
      valeur: 12
    relance: Tu as calculé ce qu'il a grandi en tout sur les deux années. On demande une seule année, celle où la courbe monte
      le plus vite.
  solution: 'Première année : 144 − 140 = 4 cm. Deuxième année : 152 − 144 = 8 cm. La courbe monte le plus vite la deuxième
    année : Léo a grandi de 8 cm.'
- id: comparaison-courbes-eleves
  type: ouverte
  difficulte: 2
  enonce: On compare les courbes de croissance de plusieurs élèves du même âge. Explique en deux ou trois phrases ce que cette
    comparaison peut montrer sur la puberté.
  criteres:
  - L'élève comprend que la phase d'augmentation rapide n'arrive pas au même moment pour tous.
  - L'élève relie cela au caractère normal de ces différences.
  - L'élève décrit la phase de puberté sur la courbe comme le moment où la courbe monte plus vite que d'habitude.
  indices:
    relance: Est-ce que la phase d'augmentation rapide arrive au même moment pour tous les élèves ?
    methode: Chaque élève a sa propre courbe, la puberté peut arriver plus tôt ou plus tard selon la personne.
    etape: Commence ainsi « Cette comparaison montre que... »
  solution: Cette comparaison montre que la phase d'augmentation rapide de la puberté ne se produit pas au même moment pour
    tous les élèves. C'est normal, car la puberté se produit à des âges différents selon les individus.
- id: nblm-que-se-passe-t-il-au-niveau-de-la-taille-1
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il au niveau de la taille et de la masse corporelle d'un enfant au moment de la puberté ?
  reponse:
    options:
    - id: o1
      texte: Elles augmentent beaucoup plus vite que d'habitude.
    - id: o2
      texte: Elles s'arrêtent complètement de changer.
    - id: o3
      texte: Elles diminuent fortement pendant quelques mois.
    - id: o4
      texte: Elles augmentent exactement au même rythme régulier qu'en maternelle.
    bonnes:
    - o1
  indices:
    relance: Observe l'évolution de la croissance durant cette période particulière.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la puberté est au contraire une période d''augmentation rapide de la taille et de la masse
      corporelle, et non un arrêt.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le corps ne rétrécit pas à la puberté, la taille et la masse augmentent.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la puberté se traduit par une hausse beaucoup plus rapide que le rythme habituel de l''enfance.'
  solution: 'Elles augmentent beaucoup plus vite que d''habitude. C''est exact : la puberté se caractérise par une accélération
    rapide de la croissance en taille et en masse.'
- id: nblm-un-eleve-constate-que-son-copain-commenc-2
  type: choix
  difficulte: 2
  enonce: Un élève constate que son copain commence à grandir et à changer avant lui. Que faut-il en penser ?
  reponse:
    options:
    - id: o1
      texte: C'est tout à fait normal, car la puberté ne se produit pas au même âge pour tout le monde.
    - id: o2
      texte: Ce n'est pas normal, tous les enfants doivent changer exactement au même âge.
    - id: o3
      texte: Cela signifie que l'un des deux enfants a un problème de santé.
    - id: o4
      texte: Seuls les garçons connaissent des changements à la puberté.
    bonnes:
    - o1
  indices:
    relance: Pense aux variations d'âge de déclenchement de la puberté entre individus.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que la puberté survient au même âge chez tous les camarades.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : un changement plus précoce ou plus tardif que chez les copains est parfaitement normal.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la puberté concerne tous les individus, filles et garçons.'
  solution: 'C''est tout à fait normal, car la puberté ne se produit pas au même âge pour tout le monde. C''est exact : le
    moment où commence la puberté varie selon les personnes, c''est un phénomène naturel.'
- id: nblm-comment-repere-t-on-la-periode-de-la-pub-3
  type: choix
  difficulte: 2
  enonce: Comment repère-t-on la période de la puberté sur une courbe de croissance ?
  reponse:
    options:
    - id: o1
      texte: On repère la période où la courbe monte beaucoup plus vite que d'habitude.
    - id: o2
      texte: On cherche l'endroit où la courbe devient complètement plate et horizontale.
    - id: o3
      texte: On observe le moment où la courbe descend brutalement.
    - id: o4
      texte: Il est impossible de lire la puberté sur une courbe de croissance.
    bonnes:
    - o1
  indices:
    relance: Regarde la pente de la ligne sur le graphique lors de la poussée de croissance.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : une courbe plate indique une croissance stagnante, alors que la puberté correspond à un pic
      de croissance.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : la courbe de taille ne descend pas au cours de la croissance.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la courbe de croissance permet au contraire d''identifier très clairement la poussée de la
      puberté.'
  solution: 'On repère la période où la courbe monte beaucoup plus vite que d''habitude. C''est exact : la phase d''augmentation
    rapide de la courbe indique la période de la puberté.'
- id: nblm-parmi-les-propositions-suivantes-quel-ch-4
  type: choix
  difficulte: 2
  enonce: Parmi les propositions suivantes, quel changement corporel apparaît à la puberté ?
  reponse:
    options:
    - id: o1
      texte: Le développement de la pilosité.
    - id: o2
      texte: Le changement définitif de la couleur des yeux.
    - id: o3
      texte: L'apparition de nouveaux doigts aux mains.
    - id: o4
      texte: La poussée d'une deuxième paire d'oreilles.
    bonnes:
    - o1
  indices:
    relance: Pense aux poils qui commencent à pousser sur le corps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : confondre les modifications de la puberté avec la couleur des yeux qui ne change pas à cet
      âge.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le nombre de doigts reste le même tout au long de la vie.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : la structure des organes des sens ne se multiplie pas à la puberté.'
  solution: 'Le développement de la pilosité. C''est exact : l''apparition et le développement des poils (pilosité) font partie
    des modifications du corps à la puberté.'
- id: nblm-a-la-puberte-la-silhouette-se-modifie-qu-5
  type: choix
  difficulte: 2
  enonce: À la puberté, la silhouette se modifie. Quels autres développements corporels peut-on observer ?
  reponse:
    options:
    - id: o1
      texte: Le développement des seins, des hanches et des organes génitaux externes.
    - id: o2
      texte: Le rétrécissement des épaules et du buste.
    - id: o3
      texte: La perte totale des os des membres inférieurs.
    - id: o4
      texte: La transformation des cheveux en plumes.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi des parties du corps qui évoluent et modifient la silhouette.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : le corps développe ses formes et grandit, il ne rétrécit pas.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : le squelette se consolide et grandit pendant la puberté.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : les êtres humains développent de la pilosité, pas des plumes.'
  solution: 'Le développement des seins, des hanches et des organes génitaux externes. C''est exact : ces modifications physiques
    participent à la transformation de la silhouette à la puberté.'
- id: nblm-quelles-sont-les-deux-affirmations-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX affirmations correctes concernant la puberté et ses transformations ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Tous les changements physiques de la puberté sont normaux.
    - id: o2
      texte: En comparant plusieurs courbes de croissance, on voit que la puberté arrive à des moments différents selon les
        personnes.
    - id: o3
      texte: Avoir des changements plus tardifs que ses camarades signifie qu'on a une anomalie.
    - id: o4
      texte: La puberté se déclenche exactement au même âge chez tous les enfants du monde.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les deux faits qui soulignent la variabilité et le caractère normal de ces changements.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : croire qu''un décalage par rapport aux copains n''est pas normal.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : la puberté ne se produit pas au même âge pour tout le monde.'
  solution: 'Tous les changements physiques de la puberté sont normaux ; En comparant plusieurs courbes de croissance, on
    voit que la puberté arrive à des moments différents selon les personnes. C''est exact : la puberté est une étape de développement
    naturelle et normale pour le corps humain.'
- id: nblm-sur-un-graphique-la-ligne-qui-permet-de-7
  type: texte_court
  difficulte: 1
  enonce: Sur un graphique, la ligne qui permet de suivre l'évolution de la taille et de repérer la poussée de la puberté
    s'appelle la courbe de _______.
  reponse:
    acceptees:
    - croissance
    fautes_tolerees: 1
  indices:
    relance: Ce mot désigne l'action de grandir pour un être vivant.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'croissance. C''est exact : la courbe de croissance permet de repérer la phase d''augmentation rapide de la taille
    lors de la puberté.'
- id: nblm-le-developpement-de-la-designe-le-moment-8
  type: texte_court
  difficulte: 1
  enonce: Le développement de la _______ désigne le moment où les poils commencent à pousser sur le corps à la puberté.
  reponse:
    acceptees:
    - pilosité
    fautes_tolerees: 1
  indices:
    relance: C'est le terme scientifique lié aux poils.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'pilosité. C''est exact : la pilosité désigne l''ensemble des poils qui se développent sur le corps à la puberté.'
