format: 2
notion: cm1-mesurer-distance-et-duree
version: 3
etat: verifiee
declencheurs:
- combien de temps ça a pris
- combien de mètres
- distance parcourue
- chronomètre déclenché
- mètre pour mesurer
- quelle est la durée
- petite voiture qui roule
- mètre ruban
- temps de la course
prerequis: []
essentiel: 'Quand un objet se déplace (une petite voiture, une bille, un camarade qui court), on peut mesurer deux choses
  différentes. La distance, c''est la longueur du chemin parcouru. La durée, c''est le temps que dure le déplacement.


  Pour mesurer une distance, on repère d''abord un point de départ et un point d''arrivée, par exemple avec une craie ou un
  bout de scotch. Puis on mesure l''écart entre les deux avec un instrument adapté : une règle ou un mètre ruban. On peut
  aussi utiliser un gabarit : une bande de longueur connue que l''on reporte plusieurs fois. La distance s''écrit avec une
  unité de longueur : le centimètre (cm) ou le mètre (m).


  Attention au point de départ. Si une bille part de la graduation 10 cm et s''arrête à la graduation 40 cm, elle n''a pas
  parcouru 40 cm, mais l''écart entre les deux : 30 cm.


  Une durée est l''intervalle entre deux instants : l''instant où l''objet part et l''instant où il arrive. On la mesure avec
  un chronomètre : on le déclenche au départ et on l''arrête à l''arrivée. La durée s''écrit avec une unité de temps : la
  seconde (s) ou la minute (min).


  Un instant, c''est un moment précis (« la voiture part maintenant »). Une durée, c''est le temps qui s''écoule entre deux
  instants. Si on lit l''heure au départ et à l''arrivée, la durée est l''écart entre les deux heures.


  Distance et durée ne se confondent pas : une voiture peut parcourir une petite distance pendant une longue durée, si elle
  roule lentement.

  '
methode:
- Repérer clairement le point de départ et le point d'arrivée du déplacement.
- Choisir un instrument adapté à la distance (règle, mètre, gabarit) ou à la durée (chronomètre).
- Mesurer la distance parcourue entre le point de départ et le point d'arrivée.
- Déclencher le chronomètre à l'instant du départ et l'arrêter à l'instant de l'arrivée.
- Si l'instrument ne commence pas à zéro, calculer l'écart entre la valeur d'arrivée et la valeur de départ.
- Écrire chaque résultat avec son unité (cm ou m pour la distance, s ou min pour la durée).
vocabulaire:
- terme: distance
  definition: l'écart mesuré entre un point de départ et un point d'arrivée
- terme: durée
  definition: l'intervalle de temps entre un instant de départ et un instant d'arrivée
- terme: instant
  definition: un moment précis, comme le moment où l'objet part
- terme: chronomètre
  definition: un instrument qui mesure une durée, que l'on déclenche puis que l'on arrête
- terme: gabarit
  definition: un objet de longueur connue que l'on reporte plusieurs fois pour mesurer une distance
- terme: instrument de mesure
  definition: un outil qui permet de mesurer, comme une règle, un mètre ou un chronomètre
erreurs_frequentes:
- Oublier de bien fixer le point de départ avant de commencer à mesurer.
- Confondre distance parcourue et durée du trajet.
- Utiliser un instrument mal adapté (par exemple un mètre trop court pour une longue distance).
- Lire seulement la graduation d'arrivée alors que l'objet n'est pas parti de zéro.
- Oublier l'unité, ou écrire une unité de temps pour une distance.
exemple:
  enonce: Une petite voiture roule sur la table de la classe. Comment mesurer la distance qu'elle a parcourue et le temps
    que ça a pris ?
  solution: 'On marque le point de départ et le point d''arrivée avec un repère, puis on mesure la distance entre les deux
    avec un mètre (par exemple 60 cm). On mesure la durée du déplacement avec un chronomètre déclenché au départ et arrêté
    à l''arrivée (par exemple 4 s). On écrit : distance parcourue 60 cm, durée 4 s.'
exercices:
- id: definition-duree
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une durée, exactement ?
  reponse:
    options:
    - id: a
      texte: La longueur du chemin parcouru par l'objet
    - id: b
      texte: L'intervalle entre deux instants, celui de départ et celui d'arrivée
    - id: c
      texte: Le poids de l'objet qui se déplace
    bonnes:
    - b
  indices:
    relance: Une durée concerne le temps qui passe, pas la longueur du trajet ni le poids de l'objet.
    methode: Cherche l'option qui parle de deux instants (un début et une fin), sans parler de longueur ni de poids.
    etape: 'Élimine d''abord l''option qui parle de longueur : c''est la définition de la distance, pas de la durée.'
  pieges:
  - si:
      contient:
      - a
    relance: Cette option décrit la distance parcourue, pas la durée. Cherche l'option qui parle du temps entre deux instants.
  - si:
      contient:
      - c
    relance: Le poids n'a aucun rapport avec le temps qui passe. Cherche l'option qui parle de deux instants.
  solution: 'Une durée est l''intervalle entre deux instants : l''instant de départ et l''instant d''arrivée.'
- id: repere-fin-trajet
  type: texte_court
  difficulte: 1
  enonce: Lors d'une course d'EPS, comment appelle-t-on le repère qui marque la fin du trajet d'un camarade, une fois qu'on
    a déjà repéré le point de départ ?
  reponse:
    acceptees:
    - point d'arrivee
    - arrivee
    fautes_tolerees: 1
  indices:
    relance: C'est le repère opposé au point de départ, à l'autre bout du trajet.
    methode: Ce repère se trouve là où le camarade s'arrête de courir.
    etape: Un trajet a deux repères. Le premier est le point de départ. Comment appelle-t-on la ligne qu'on franchit à la
      fin d'une course ?
  pieges:
  - si:
      valeur: chronometre
    relance: Le chronomètre sert à mesurer une durée, pas à repérer un point du trajet. Cherche le nom du repère de fin de
      course.
  solution: 'C''est le point d''arrivée : avec le point de départ déjà repéré, on peut mesurer la distance entre les deux.'
- id: instrument-duree
  type: texte_court
  difficulte: 2
  enonce: Quel instrument utilise-t-on typiquement pour mesurer la durée du déplacement d'un objet roulant ?
  reponse:
    acceptees:
    - chronometre
    fautes_tolerees: 1
  indices:
    relance: Quel instrument sert à mesurer un temps qui passe ?
    methode: Cet instrument se déclenche au départ de l'objet et s'arrête à son arrivée.
    etape: On le déclenche au départ et on l'arrête à l'arrivée. On s'en sert aussi en EPS pour une course. Quel est son nom
      ?
  pieges:
  - si:
      valeur: metre
    relance: Le mètre sert à mesurer une distance, pas une durée. Cherche l'instrument qui mesure le temps.
  solution: On utilise un chronomètre (ou un autre instrument de mesure adapté) déclenché au départ et arrêté à l'arrivée.
- id: instruments-usages
  type: association
  difficulte: 2
  enonce: Relie chaque instrument à ce qu'il permet de mesurer lors du déplacement d'un objet.
  reponse:
    gauche:
    - id: a
      texte: Mètre ou gabarit
    - id: b
      texte: Chronomètre
    droite:
    - id: x
      texte: La distance parcourue par l'objet
    - id: y
      texte: La durée du déplacement de l'objet
    paires:
      a: x
      b: y
  indices:
    relance: L'un des deux instruments mesure une longueur, l'autre mesure un temps.
    methode: Le mètre ou le gabarit servent à mesurer un écart entre deux points (une longueur). Le chronomètre sert à mesurer
      un intervalle de temps.
    etape: 'Commence par le chronomètre : est-ce qu''il mesure une longueur ou un temps ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une des deux associations est fausse. Rappelle-toi : le mètre mesure une longueur, le chronomètre mesure un
      temps.'
  - si:
      diagnostic: associations_fausses
    relance: 'Repense à ce que mesure chaque instrument : le mètre sert aux longueurs, le chronomètre au temps qui passe.'
  solution: Le mètre ou le gabarit mesurent la distance parcourue. Le chronomètre mesure la durée du déplacement.
- id: ordre-mesure-distance
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour mesurer la distance parcourue par un objet qui se déplace sur une table.
  reponse:
    elements:
    - id: depart
      texte: Repérer le point de départ de l'objet
    - id: arrivee
      texte: Repérer le point d'arrivée de l'objet
    - id: choisir
      texte: Choisir un instrument adapté à l'écart repéré (mètre, gabarit)
    - id: mesurer
      texte: Mesurer l'écart entre le point de départ et le point d'arrivée
  indices:
    relance: Que dois-tu identifier en tout premier, avant même de sortir un instrument de mesure ?
    methode: Il faut d'abord repérer les deux points du trajet, puis choisir l'instrument, puis mesurer l'écart entre eux.
    etape: La première étape est de repérer le point de départ de l'objet.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Deux étapes voisines sont inversées. Rappelle-toi : on repère d''abord les deux points, avant de mesurer l''écart
      entre eux.'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord les deux points extrêmes (départ et arrivée), puis choisis l'instrument, puis mesure l'écart entre
      les deux.
  solution: On repère le point de départ, puis le point d'arrivée, puis on choisit un instrument adapté (mètre ou gabarit),
    puis on mesure l'écart entre les deux points.
- id: distance-graduations-bille
  type: nombre
  difficulte: 2
  enonce: Une bille roule le long d'un mètre ruban posé par terre. Elle part de la graduation 20 cm et s'arrête à la graduation
    95 cm. Quelle distance a-t-elle parcourue, en centimètres ?
  reponse:
    valeur: 75
    forme: entier
  indices:
    relance: La bille n'est pas partie du zéro du mètre ruban. Que faut-il faire avec les deux graduations ?
    methode: La distance, c'est l'écart entre l'arrivée et le départ. On enlève la graduation de départ à la graduation d'arrivée.
    etape: Compte d'abord de 20 jusqu'à 90, puis ajoute ce qui reste jusqu'à 95.
  pieges:
  - si:
      valeur: 95
    relance: Tu as lu seulement la graduation d'arrivée. Mais la bille n'est pas partie de zéro, elle est partie de la graduation
      20.
  - si:
      valeur: 115
    relance: Tu as additionné les deux graduations. La distance est un écart entre deux points, il faut plutôt soustraire.
  solution: 'La distance est l''écart entre les deux graduations : 95 − 20 = 75. La bille a parcouru 75 cm.'
- id: duree-chronometre-voiture
  type: nombre
  difficulte: 2
  enonce: Le chronomètre tourne déjà. La petite voiture part quand il affiche 3 secondes et arrive quand il affiche 11 secondes.
    Quelle est la durée du trajet, en secondes ?
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: La durée commence-t-elle au zéro du chronomètre, ou à l'instant où la voiture part ?
    methode: 'Une durée est l''intervalle entre deux instants : on enlève l''instant de départ à l''instant d''arrivée.'
    etape: Compte les secondes une par une, à partir de l'instant du départ, jusqu'à l'instant de l'arrivée.
  pieges:
  - si:
      valeur: 11
    relance: Ton nombre est ce qu'affiche le chronomètre à l'arrivée. Mais la voiture n'est pas partie à zéro seconde.
  - si:
      valeur: 14
    relance: Tu as additionné les deux instants. Une durée est un intervalle entre eux, il faut plutôt soustraire.
  solution: 'La durée est l''intervalle entre l''instant de départ et l''instant d''arrivée : 11 − 3 = 8. Le trajet a duré
    8 secondes.'
- id: duree-entre-deux-heures
  type: nombre
  difficulte: 3
  enonce: Au cross de l'école, la course de Léa commence à 10 h 15 min. Léa franchit l'arrivée à 10 h 27 min. Combien de minutes
    sa course a-t-elle duré ?
  reponse:
    valeur: 12
    forme: entier
  indices:
    relance: Quels sont les deux instants de cette course ? La durée est l'écart entre eux.
    methode: Les heures sont les mêmes au départ et à l'arrivée. Compare seulement les minutes.
    etape: Compte de 15 jusqu'à 20, puis de 20 jusqu'à 27, et additionne les deux morceaux.
  pieges:
  - si:
      valeur: 27
    relance: Ton nombre, ce sont les minutes de l'instant d'arrivée. Mais la course n'a pas commencé à 10 h pile.
  - si:
      valeur: 42
    relance: Tu as additionné les minutes des deux instants. Une durée est un écart, il faut plutôt soustraire.
  solution: La durée est l'intervalle entre 10 h 15 min et 10 h 27 min. Les heures sont les mêmes, donc 27 − 15 = 12. La course
    a duré 12 minutes.
- id: expliquer-mesure-voiture
  type: ouverte
  difficulte: 3
  enonce: Une voiture télécommandée roule dans la cour de récréation. Explique en deux ou trois phrases comment mesurer à
    la fois la distance qu'elle parcourt et la durée de son trajet.
  criteres:
  - L'élève propose de repérer un point de départ et un point d'arrivée avant de mesurer.
  - L'élève propose un instrument adapté pour la distance (mètre, gabarit) et un pour la durée (chronomètre).
  - L'élève relie correctement la durée à un intervalle entre deux instants (départ et arrivée).
  indices:
    relance: Que dois-tu marquer avant de commencer à mesurer quoi que ce soit ?
    methode: Repère les deux points du trajet, choisis un mètre pour la distance et un chronomètre pour la durée.
    etape: 'Tu peux commencer ainsi : « Je marque d''abord le point de départ... »'
  solution: Je marque d'abord le point de départ et le point d'arrivée de la voiture. Je mesure la distance entre les deux
    points avec un mètre. Je déclenche un chronomètre au moment du départ et je l'arrête au moment de l'arrivée, ce qui me
    donne la durée du trajet.
- id: nblm-lorsqu-une-petite-voiture-roule-sur-une-1
  type: choix
  difficulte: 2
  enonce: Lorsqu'une petite voiture roule sur une table, quel instrument utilise-t-on comme mètre pour mesurer la distance
    parcourue entre le point de départ et le point d'arrivée ?
  reponse:
    options:
    - id: o1
      texte: Un mètre
    - id: o2
      texte: Un chronomètre
    - id: o3
      texte: Une balance
    - id: o4
      texte: Un thermomètre
    bonnes:
    - o1
  indices:
    relance: Pense à l'outil qui sert à mesurer un écart de longueur.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : le chronomètre sert à mesurer une durée (le temps), pas une distance.'
  - si:
      contient:
      - o3
    relance: Attention, la balance sert à mesurer la masse, pas une distance.
  - si:
      contient:
      - o4
    relance: Attention, le thermomètre sert à mesurer la température.
  solution: Un mètre. C'est exact, le mètre est l'instrument adapté pour mesurer l'écart de distance entre le point de départ
    et l'arrivée.
- id: nblm-pour-savoir-combien-de-temps-ca-a-pris-a-2
  type: choix
  difficulte: 2
  enonce: Pour savoir combien de temps ça a pris à un objet pour effectuer son trajet, comment utilise-t-on le chronomètre
    ?
  reponse:
    options:
    - id: o1
      texte: Le chronomètre déclenché au départ est arrêté à l'arrivée.
    - id: o2
      texte: Le chronomètre déclenché à l'arrivée est arrêté plus tard.
    - id: o3
      texte: Le chronomètre est utilisé pour mesurer l'écart en mètres.
    - id: o4
      texte: Le chronomètre est déclenché au départ mais n'est jamais arrêté.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux deux moments clés du déplacement où il faut agir sur l'appareil.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur : si on le déclenche à l''arrivée, on ne mesure pas la durée du trajet effectué.'
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : la distance en mètres se mesure avec un mètre, pas avec un chronomètre.'
  - si:
      contient:
      - o4
    relance: Incorrect, il faut impérativement l'arrêter à l'arrivée pour connaître la durée exacte.
  solution: Le chronomètre déclenché au départ est arrêté à l'arrivée. C'est la bonne méthode pour mesurer l'intervalle de
    temps précis du déplacement.
- id: nblm-en-sciences-quelle-est-la-duree-exacte-d-3
  type: choix
  difficulte: 2
  enonce: En sciences, quelle est la durée exacte d'un déplacement ?
  reponse:
    options:
    - id: o1
      texte: L'intervalle de temps entre l'instant de départ et l'instant d'arrivée.
    - id: o2
      texte: L'écart mesuré entre le point de départ et le point d'arrivée.
    - id: o3
      texte: Le nombre total de mètres parcourus par l'objet.
    - id: o4
      texte: L'instant précis où l'objet s'arrête.
    bonnes:
    - o1
  indices:
    relance: Pense au temps qui s'écoule entre le début et la fin du trajet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : ceci est la définition de la distance, pas de la durée.'
  - si:
      contient:
      - o3
    relance: Faux, le nombre de mètres correspond à la distance.
  - si:
      contient:
      - o4
    relance: Attention, cela désigne un instant précis, pas un intervalle de temps.
  solution: L'intervalle de temps entre l'instant de départ et l'instant d'arrivée. Exact ! La durée mesure le temps écoulé
    entre l'instant de départ et l'instant d'arrivée.
- id: nblm-pour-mesurer-combien-de-metres-un-objet-4
  type: choix
  difficulte: 2
  enonce: Pour mesurer combien de mètres un objet a parcourus, quelle étape est indispensable avant de mesurer ?
  reponse:
    options:
    - id: o1
      texte: Bien fixer et repérer le point de départ.
    - id: o2
      texte: Changer la vitesse de l'objet pendant le parcours.
    - id: o3
      texte: Mesurer la température de la pièce.
    - id: o4
      texte: Peser l'objet sur une balance.
    bonnes:
    - o1
  indices:
    relance: Cherche ce qu'il faut obligatoirement marquer au début du trajet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Incorrect, modifier la vitesse n'aide pas à mesurer la distance.
  - si:
      contient:
      - o3
    relance: Inutile, la température n'a pas de rapport avec la distance.
  - si:
      contient:
      - o4
    relance: Attention, la masse de l'objet ne donne pas la distance parcourue.
  solution: Bien fixer et repérer le point de départ. Tout à fait, l'une des erreurs fréquentes est d'oublier de bien fixer
    le point de départ avant de mesurer.
