    - id: o2
      texte: Utiliser un chronomètre pour mesurer une durée.
    - id: o3
      texte: Repérer le point de départ et le point d'arrivée.
    - id: o4
      texte: Mesurer un écart de longueur avec un mètre.
    bonnes:
