format: 2
notion: cm1-espece-et-classification-emboitee
version: 3
etat: verifiee
declencheurs:
- qui est plus proche de qui
- se reproduire entre eux
- lien de parenté entre animaux
- groupes qui s'emboîtent
- attributs communs
- descendance fertile
- classer des animaux
- boîtes dans des boîtes
- chat et chien cousins
- qu'est-ce qu'une espèce
prerequis: []
essentiel: 'Une espèce est un ensemble d''individus interféconds, c''est-à-dire capables de se reproduire entre eux et d''avoir
  des petits qui pourront eux aussi se reproduire. Tous les chats forment une espèce, tous les chiens en forment une autre.
  Un chat et un chien ne peuvent pas avoir de petits ensemble : ce sont deux espèces différentes.


  Ce n''est pas la ressemblance qui compte. Un caniche et un saint-bernard ne se ressemblent pas du tout, pourtant ils sont
  de la même espèce : ils peuvent se reproduire ensemble.


  Pour savoir « qui est plus proche de qui », on classe quelques espèces selon leurs attributs. Un attribut, c''est ce qu''une
  espèce possède et qu''on peut observer. Par exemple : des poils, des plumes, des écailles, quatre membres, des mâchoires,
  un squelette interne.


  On construit des groupes emboîtés, comme des boîtes rangées les unes dans les autres. Une grande boîte contient toutes les
  espèces qui partagent un attribut (par exemple, un squelette interne). Dedans, une boîte plus petite regroupe celles qui
  ont en plus un autre attribut (par exemple, quatre membres). Et ainsi de suite.


  Attention : on classe selon ce que les êtres vivants ont, pas selon ce qu''ils n''ont pas, ni selon l''endroit où ils vivent.
  « Vit dans l''eau » n''est pas un attribut : le dauphin vit dans l''eau mais il respire avec des poumons et allaite ses
  petits, comme le chat.


  Plus deux espèces se retrouvent ensemble dans des petites boîtes, plus elles partagent d''attributs, et plus elles sont
  proches parentes. Le chat et le chien, qui partagent les poils, sont plus proches entre eux que du lézard.

  '
methode:
- Observer les attributs (caractéristiques) de chaque espèce de la collection étudiée.
- Noter dans un tableau, pour chaque espèce, les attributs qu'elle possède.
- Repérer les attributs partagés par plusieurs espèces.
- Dessiner une grande boîte autour des espèces qui partagent l'attribut le plus répandu, puis des boîtes plus petites à l'intérieur.
- Déduire de ces groupes emboîtés quelles espèces sont les plus proches parentes (celles qui sont ensemble dans la plus petite
  boîte).
vocabulaire:
- terme: espèce
  definition: un ensemble d'individus interféconds, capables de se reproduire entre eux
- terme: interféconds
  definition: capables d'avoir ensemble des petits, eux-mêmes capables de se reproduire
- terme: attribut
  definition: une caractéristique qu'une espèce possède et qu'on peut observer (poils, plumes, mâchoires)
- terme: classification en groupes emboîtés
  definition: un classement d'espèces en groupes de plus en plus précis, rangés les uns dans les autres, selon les attributs
    qu'elles partagent
- terme: lien de parenté
  definition: la proximité entre deux espèces, d'autant plus grande qu'elles partagent d'attributs
erreurs_frequentes:
- Croire qu'une espèce est définie par la ressemblance physique et non par la capacité à se reproduire entre eux.
- Classer des espèces sans s'appuyer sur des attributs identifiés et partagés.
- Classer selon le milieu de vie (vit dans l'eau, vole) au lieu de ce que l'espèce possède.
- Classer selon ce qu'une espèce n'a pas (« n'a pas de pattes ») au lieu de ce qu'elle a.
- Confondre classification (groupes emboîtés selon des attributs) et identification (retrouver le nom d'une espèce avec une
  clé de détermination).
exemple:
  enonce: On étudie un chat, un chien et un poisson. Comment savoir lesquels sont les plus proches parents avec une classification
    en groupes emboîtés ?
  solution: 'On repère les attributs : les trois ont un squelette interne, donc une grande boîte les contient tous. Le chat
    et le chien ont en plus quatre membres et des poils, donc on dessine une petite boîte autour d''eux deux, à l''intérieur
    de la grande. Le chat et le chien sont donc plus proches parents entre eux qu''avec le poisson.'
exercices:
- id: definition-espece
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qui définit une espèce, selon la biologie ?
  reponse:
    options:
    - id: a
      texte: Le fait que les individus se ressemblent physiquement
    - id: b
      texte: Le fait que les individus soient capables de se reproduire entre eux et d'avoir une descendance
    - id: c
      texte: Le fait que les individus vivent dans le même endroit
    bonnes:
    - b
  indices:
    relance: 'Deux animaux peuvent se ressembler sans appartenir à la même espèce : quel est le vrai critère ?'
    methode: Le critère n'est ni l'aspect ni le lieu de vie, mais la capacité à avoir des petits ensemble.
    etape: Élimine les options qui parlent de ressemblance ou de lieu de vie.
  pieges:
  - si:
      contient:
      - a
    relance: La ressemblance physique n'est pas le critère principal. Deux individus peuvent se ressembler sans être de la
      même espèce.
  - si:
      contient:
      - c
    relance: Vivre au même endroit n'est pas non plus le critère. Pense à ce qui permet d'avoir des petits ensemble.
  solution: Une espèce est un ensemble d'individus interféconds, donc capables de se reproduire entre eux et d'avoir une descendance.
- id: descendance-impossible
  type: texte_court
  difficulte: 1
  enonce: Deux animaux qui ne peuvent pas se reproduire ensemble et avoir de descendance appartiennent-ils à la même espèce
    ? Réponds par oui ou par non.
  reponse:
    acceptees:
    - non
  indices:
    relance: 'Qu''est-ce qui définit une espèce : l''aspect, ou le fait d''avoir des petits ensemble ?'
    methode: 'Relis la définition d''une espèce : elle repose sur l''interfécondité, pas sur la ressemblance.'
    etape: Si deux animaux ne peuvent pas se reproduire entre eux, ils ne remplissent pas la condition d'interfécondité.
  pieges:
  - si:
      valeur: oui
    relance: 'Réfléchis à la définition d''une espèce : elle exige que les individus puissent se reproduire ensemble. Est-ce
      le cas ici ?'
  solution: 'Non : une espèce est un ensemble d''individus interféconds, donc capables de se reproduire entre eux ; s''ils
    ne le peuvent pas, ils n''appartiennent pas à la même espèce.'
- id: chiens-differents-meme-espece
  type: choix
  difficulte: 2
  enonce: Un caniche et un saint-bernard ne se ressemblent pas du tout, mais ils peuvent avoir des chiots ensemble, et ces
    chiots pourront à leur tour avoir des petits. Que peut-on en conclure ?
  reponse:
    options:
    - id: a
      texte: Ils appartiennent à la même espèce
    - id: b
      texte: Ils appartiennent à deux espèces différentes, car ils ne se ressemblent pas
    - id: c
      texte: On ne peut rien conclure sans connaître leur couleur
    bonnes:
    - a
  indices:
    relance: Le critère qui définit une espèce, est-ce la ressemblance ou la capacité à se reproduire ensemble ?
    methode: Si deux individus peuvent avoir ensemble des petits eux-mêmes capables de se reproduire, ils sont interféconds.
    etape: Élimine les options qui s'appuient sur l'apparence (ressemblance ou couleur).
  pieges:
  - si:
      contient:
      - b
    relance: La ressemblance n'est pas le critère. Que dit l'énoncé sur leurs chiots ?
  - si:
      contient:
      - c
    relance: La couleur fait partie de l'apparence, ce n'est pas elle qui définit l'espèce.
  solution: Ils sont interféconds (ils ont ensemble des petits qui peuvent se reproduire), donc ils appartiennent à la même
    espèce, même s'ils ne se ressemblent pas.
- id: proximite-parente
  type: texte_court
  difficulte: 2
  enonce: 'Dans une classification en groupes emboîtés de 4 espèces, comment sait-on que deux espèces sont proches parentes
    ? Réponds avec le mot-clé : qu''est-ce qu''elles doivent partager en grand nombre ?'
  reponse:
    acceptees:
    - attributs
    - des attributs
    fautes_tolerees: 1
  indices:
    relance: Pense à ce qui permet de regrouper des espèces ensemble dans un même groupe emboîté.
    methode: Deux espèces proches parentes se retrouvent dans les mêmes groupes emboîtés, les plus petits et les plus précis,
      car elles partagent beaucoup de ces caractéristiques communes.
    etape: Ce mot est employé dans la fiche pour parler de ce qu'une espèce possède et qu'on peut observer (poils, plumes...).
  pieges:
  - si:
      valeur: couleur
    relance: 'La couleur seule ne suffit pas : c''est un ensemble plus large de caractéristiques communes qui compte.'
  solution: Deux espèces sont proches parentes quand elles partagent beaucoup d'attributs et se retrouvent dans les mêmes
    groupes emboîtés, les plus petits et les plus précis.
- id: attribut-ou-pas
  type: choix
  difficulte: 2
  enonce: Parmi ces propositions, lesquelles sont de vrais attributs, utilisables pour une classification en groupes emboîtés
    ?
  reponse:
    options:
    - id: a
      texte: A des plumes
    - id: b
      texte: A des poils
    - id: c
      texte: Vit dans l'eau
    - id: d
      texte: N'a pas de pattes
    bonnes:
    - a
    - b
  indices:
    relance: Un attribut, c'est quelque chose que l'espèce possède et qu'on peut observer sur elle.
    methode: On ne classe ni selon l'endroit où l'animal vit, ni selon ce qu'il n'a pas. On garde seulement ce qu'il possède.
    etape: Élimine l'option qui parle d'un milieu de vie et celle qui parle d'une absence.
  pieges:
  - si:
      contient:
      - c
    relance: Le milieu de vie n'est pas un attribut. Le dauphin vit dans l'eau, mais il allaite ses petits comme le chat.
  - si:
      contient:
      - d
    relance: On ne classe pas selon ce qu'une espèce n'a pas. Cherche seulement ce qu'elle possède.
  - si:
      diagnostic: incomplet
    relance: Il y a plus d'un vrai attribut dans la liste. Cherche tout ce que l'animal possède vraiment.
  solution: « A des plumes » et « a des poils » sont des attributs, car ils décrivent ce que l'animal possède. « Vit dans
    l'eau » est un milieu de vie et « n'a pas de pattes » est une absence, on ne les utilise pas.
- id: plus-proche-du-chat
  type: choix
  difficulte: 3
  enonce: 'Dans une classification, la grande boîte « squelette interne » contient : chat, lapin, lézard, truite. Dedans,
    la boîte « quatre membres » contient chat, lapin, lézard. Dedans encore, la boîte « poils » contient chat et lapin. Quelle
    espèce est la plus proche parente du chat ?'
  reponse:
    options:
    - id: a
      texte: Le lapin
    - id: b
      texte: Le lézard
    - id: c
      texte: La truite
    bonnes:
    - a
  indices:
    relance: Cherche la plus petite boîte qui contient le chat. Qui est avec lui dedans ?
    methode: Plus deux espèces sont ensemble dans une petite boîte, plus elles partagent d'attributs, donc plus elles sont
      proches.
    etape: Regarde la boîte « poils », la plus petite des trois.
  pieges:
  - si:
      contient:
      - b
    relance: Le lézard partage la boîte « quatre membres » avec le chat, mais il n'est pas dans la plus petite boîte.
  - si:
      contient:
      - c
    relance: La truite n'est que dans la grande boîte. C'est l'espèce la moins proche du chat ici.
  solution: Le lapin, car il est avec le chat dans la plus petite boîte (« poils ») ; il partage avec lui le squelette interne,
    les quatre membres et les poils.
- id: choix-attributs-observables
  type: choix
  difficulte: 2
  enonce: Pourquoi utilise-t-on des attributs « facilement identifiables et reconnaissables » pour classer les espèces d'une
    collection en classe ?
  reponse:
    options:
    - id: a
      texte: Pour que les élèves puissent observer eux-mêmes ces attributs et construire la classification à partir de leurs
        propres observations
    - id: b
      texte: Parce que les scientifiques n'ont pas d'autres attributs à disposition
    - id: c
      texte: Pour que la classification soit plus rapide à faire, même sans observation
    bonnes:
    - a
  indices:
    relance: Qui doit pouvoir observer ces attributs en classe ?
    methode: L'objectif est que les élèves eux-mêmes puissent observer et utiliser ces attributs pour construire la classification.
    etape: Élimine les options qui ne parlent pas du rôle des élèves dans l'observation.
  pieges:
  - si:
      contient:
      - b
    relance: Il existe d'autres attributs, mais on choisit ceux qui sont observables par les élèves. Pense à qui doit pouvoir
      les reconnaître.
  - si:
      contient:
      - c
    relance: 'Au contraire, l''observation reste indispensable : on choisit des attributs faciles à observer, pas une classification
      sans observation.'
  solution: Pour que les élèves puissent observer eux-mêmes ces attributs sur les espèces et construire la classification
    à partir de leurs propres observations.
- id: expliquer-classification-4-especes
  type: ouverte
  difficulte: 3
  enonce: 'On étudie quatre espèces : un chat, un chien, un lézard et un poisson. Explique en deux ou trois phrases comment
    tu procéderais pour construire une classification en groupes emboîtés et en déduire les liens de parenté.'
  criteres:
  - L'élève propose d'observer les attributs de chaque espèce (par exemple présence de poils, de quatre membres, de squelette
    interne).
  - L'élève explique qu'il regroupe les espèces qui partagent le plus d'attributs dans des groupes emboîtés.
  - L'élève déduit un lien de parenté cohérent avec les attributs partagés (par exemple chat et chien plus proches entre eux).
  indices:
    relance: Que dois-tu observer en premier sur chaque espèce, avant de pouvoir les regrouper ?
    methode: Observe les attributs de chaque espèce, repère ceux qui sont partagés, puis forme des groupes emboîtés selon
      ces partages.
    etape: 'Tu peux commencer ainsi : « J''observe d''abord les attributs de chaque espèce, comme... »'
  solution: J'observe d'abord les attributs de chaque espèce, comme le squelette interne, les quatre membres ou les poils.
    Les quatre ont un squelette interne (grande boîte) ; le chat, le chien et le lézard ont quatre membres (boîte plus petite)
    ; seuls le chat et le chien ont des poils (plus petite boîte). Le chat et le chien sont donc les plus proches parents
    parmi les quatre espèces.
- id: nblm-comment-la-science-definit-elle-une-espe-1
  type: choix
  difficulte: 2
  enonce: Comment la science définit-elle une espèce d'êtres vivants ?
  reponse:
    options:
    - id: o1
      texte: Un ensemble d'individus interféconds, capables de se reproduire entre eux.
    - id: o2
      texte: Un ensemble d'animaux qui ont exactement la même couleur et la même taille.
    - id: o3
      texte: Un groupe d'animaux qui vivent obligatoirement dans le même milieu de vie.
    - id: o4
      texte: Un classement d'animaux réalisé uniquement avec une clé de détermination.
    bonnes:
    - o1
  indices:
    relance: Pense au terme scientifique qui concerne la capacité des individus à se reproduire entre eux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : la simple ressemblance physique extérieure ne suffit pas à définir une espèce.'
  - si:
      contient:
      - o3
    relance: Le milieu de vie ne définit pas l'espèce ; des individus d'une même espèce peuvent habiter dans des lieux différents.
  - si:
      contient:
      - o4
    relance: La clé de détermination sert à retrouver le nom d'une espèce (identification), pas à la définir.
  solution: 'Un ensemble d''individus interféconds, capables de se reproduire entre eux. C''est la définition exacte de l''espèce
    : des individus capables de se reproduire entre eux (interféconds).'
- id: nblm-sur-quoi-se-base-t-on-pour-regrouper-les-2
  type: choix
  difficulte: 2
  enonce: Sur quoi se base-t-on pour regrouper les espèces dans une classification en groupes emboîtés ?
  reponse:
    options:
    - id: o1
      texte: Sur les attributs (caractéristiques physiques) qu'elles partagent.
    - id: o2
      texte: Sur leur taille ou leur poids mesurés avec une balance.
    - id: o3
      texte: Sur leur utilité ou leur gentillesse envers les humains.
    - id: o4
      texte: Sur l'ordre alphabétique des noms d'espèces.
    bonnes:
    - o1
  indices:
    relance: Cherche ce que possèdent ou partagent plusieurs espèces au niveau de leur anatomie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La taille ou la masse ne sont pas des attributs retenus pour établir les groupes emboîtés.
  - si:
      contient:
      - o3
    relance: La classification scientifique repose sur des attributs identifiés, et non sur des appréciations personnelles.
  - si:
      contient:
      - o4
    relance: L'ordre alphabétique ne reflète pas les caractéristiques partagées par les êtres vivants.
  solution: Sur les attributs (caractéristiques physiques) qu'elles partagent. Les espèces qui partagent le plus d'attributs
    identifiés sont regroupées ensemble.
- id: nblm-que-permet-de-deduire-une-classification-3
  type: choix
  difficulte: 2
  enonce: Que permet de déduire une classification en groupes emboîtés ?
  reponse:
    options:
    - id: o1
      texte: Les liens de parenté entre les espèces (« qui est plus proche de qui »).
    - id: o2
      texte: L'âge précis et la date de naissance de chaque animal.
    - id: o3
      texte: La quantité exacte de nourriture consommée par jour.
    - id: o4
      texte: Le nom du prédateur qui va manger l'animal dans l'écosystème.
    bonnes:
    - o1
  indices:
    relance: Pense à la formule qui cherche à savoir « qui est plus proche de qui ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Cette classification établit des liens de parenté entre espèces, pas l'âge individuel d'un animal.
  - si:
      contient:
      - o3
    relance: Les besoins alimentaires quotidiens ne sont pas déduits de la classification emboîtée.
  - si:
      contient:
      - o4
    relance: Les relations de prédation appartiennent aux réseaux alimentaires, pas à la classification emboîtée.
  solution: 'Les liens de parenté entre les espèces (« qui est plus proche de qui »). C''est le rôle fondamental de cette
    classification : déterminer quelles espèces sont les plus proches parentes.'
- id: nblm-quelle-erreur-frequente-faut-il-eviter-c-4
  type: choix
  difficulte: 2
  enonce: Quelle erreur fréquente faut-il éviter concernant la définition d'une espèce ?
  reponse:
    options:
    - id: o1
      texte: Croire qu'une espèce se définit uniquement par la ressemblance physique.
    - id: o2
      texte: Penser que les individus d'une même espèce sont capables de se reproduire entre eux.
    - id: o3
      texte: Chercher à repérer les attributs communs entre plusieurs espèces.
    - id: o4
      texte: Observer attentivement les caractéristiques des animaux.
    bonnes:
    - o1
  indices:
    relance: Demande-toi si deux animaux qui se ressemblent font toujours partie de la même espèce.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Ce n'est pas une erreur, c'est au contraire la définition scientifique exacte de l'espèce.
  - si:
      contient:
      - o3
    relance: Rechercher les attributs partagés est la bonne méthode scientifique pour classer.
  - si:
      contient:
      - o4
    relance: L'observation scientifique est une étape indispensable et correcte.
  solution: 'Croire qu''une espèce se définit uniquement par la ressemblance physique. C''est l''erreur classique : la ressemblance
    ne suffit pas, c''est la capacité à se reproduire entre eux (interfécondité) qui compte.'
- id: nblm-quelle-est-la-difference-entre-classer-e-5
  type: choix
  difficulte: 2
  enonce: Quelle est la différence entre classer et identifier des espèces ?
  reponse:
    options:
    - id: o1
      texte: Classer regroupe les espèces selon des attributs partagés, alors qu'identifier consiste à retrouver le nom d'une
        espèce avec une clé.
    - id: o2
      texte: Classer donne un prénom aux animaux, tandis qu'identifier étudie leur mode de reproduction.
    - id: o3
      texte: Il n'y a aucune différence, ce sont deux termes totalement identiques.
    - id: o4
      texte: Identifier sert uniquement pour les plantes, alors que classer sert uniquement pour les animaux.
    bonnes:
    - o1
  indices:
    relance: L'un utilise une clé de détermination pour trouver un nom, l'autre forme des groupes emboîtés.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Ni la classification ni l'identification ne servent à donner des prénoms.
  - si:
      contient:
      - o3
    relance: Confondre classification et identification est une erreur fréquente.
  - si:
      contient:
      - o4
    relance: Les deux méthodes s'appliquent à l'ensemble des êtres vivants (animaux, végétaux, etc.).
  solution: 'Classer regroupe les espèces selon des attributs partagés, alors qu''identifier consiste à retrouver le nom d''une
    espèce avec une clé. C''est exact : la classification établit des groupes emboîtés par attributs, alors que l''identification
    retrouve un nom précis à l''aide d''une clé de détermination.'
- id: nblm-lorsqu-on-etudie-un-chat-un-chien-et-un-6
  type: choix
  difficulte: 3
  enonce: Lorsqu'on étudie un chat, un chien et un poisson dans une classification emboîtée, quelles affirmations sont vraies
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Le chat et le chien partagent plus d'attributs entre eux (4 pattes, poils) qu'avec le poisson.
    - id: o2
      texte: Le chat et le chien forment un groupe emboîté plus proche, lui-même emboîté avec le poisson dans un groupe plus
        large.
    - id: o3
      texte: Le poisson et le chien sont les plus proches parents car ils vivent dans le même jardin.
    - id: o4
      texte: Le chat est plus proche parent du poisson que du chien.
