# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-mesures-meteorologiques
version: 1
etat: verifiee
declencheurs:
- combien de pluie
- vitesse du vent
- relevé chaque jour
- tableau de température
- capteur météo
- comparer janvier juillet
prerequis: []
essentiel: 'On mesure la météo avec des capteurs adaptés : le thermomètre mesure la température, le pluviomètre mesure la
  quantité de pluie, l''anémomètre mesure le vent (direction et vitesse).


  On fait des relevés réguliers, par exemple chaque jour, en notant la date de chaque mesure. On représente ensuite ces mesures
  dans un tableau ou un graphique, avec les unités adaptées.


  En comparant les mesures dans le temps, on peut décrire les variations météorologiques d''un lieu au cours d''une journée,
  d''une semaine, d''un mois ou d''une saison.'
methode:
- 'Choisir le bon capteur selon ce qu''on veut mesurer : thermomètre pour la température, pluviomètre pour la pluie, anémomètre
  pour le vent.'
- Faire des relevés réguliers en notant la date de chaque mesure.
- Représenter les mesures dans un tableau ou un graphique avec les unités adaptées.
- Comparer plusieurs relevés dans le temps pour décrire une variation.
erreurs_frequentes:
- Confondre les trois capteurs et ce qu'ils mesurent chacun.
- Oublier les unités dans un tableau ou un graphique de mesures météorologiques.
- Tirer une conclusion sur une variation à partir d'une seule mesure, sans en comparer plusieurs dans le temps.
exemple:
  enonce: Comment savoir si janvier a été plus pluvieux que juillet dans son école ?
  solution: On relève chaque jour, pendant ces deux mois, les mesures du pluviomètre, on les représente dans un tableau ou
    un graphique avec les unités adaptées, puis on compare les totaux des deux mois.
exercices:
- id: capteur-vent
  type: texte_court
  difficulte: 1
  enonce: Quel capteur utilise-t-on pour mesurer la vitesse du vent ?
  reponse:
    acceptees:
    - anémomètre
    fautes_tolerees: 1
  indices:
    relance: Son nom commence par « ané ».
    methode: Ce capteur mesure aussi la direction du vent.
    etape: Ce n'est ni le thermomètre ni le pluviomètre.
  pieges:
  - si:
      valeur: thermomètre
    relance: Le thermomètre mesure la température, pas le vent.
  - si:
      valeur: pluviomètre
    relance: Le pluviomètre mesure la pluie, pas le vent.
  solution: L'anémomètre mesure la vitesse (et la direction) du vent.
- id: capteur-association
  type: association
  difficulte: 1
  enonce: Relie chaque capteur à ce qu'il mesure.
  reponse:
    gauche:
    - id: a
      texte: Thermomètre
    - id: b
      texte: Pluviomètre
    - id: c
      texte: Anémomètre
    droite:
    - id: x
      texte: La température
    - id: y
      texte: La quantité de pluie
    - id: z
      texte: Le vent
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Le nom du capteur commence souvent comme ce qu'il mesure.
    methode: Pluviomètre vient de « pluie », anémomètre mesure le vent, thermomètre mesure la température.
    etape: Commence par le thermomètre, le plus facile à relier.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien laquelle des trois est mal reliée.
  - si:
      diagnostic: associations_fausses
    relance: Repense au nom de chaque capteur pour deviner ce qu'il mesure.
  solution: Le thermomètre mesure la température, le pluviomètre la quantité de pluie, l'anémomètre le vent.
- id: pourquoi-tableau-graphique
  type: choix
  difficulte: 2
  enonce: Pourquoi représenter les mesures météorologiques dans un tableau ou un graphique plutôt que de les garder seulement
    en tête ?
  reponse:
    options:
    - id: a
      texte: Pour comparer facilement les mesures entre elles dans le temps
    - id: b
      texte: Pour rendre la météo plus jolie
    - id: c
      texte: Pour éviter d'utiliser un capteur
    bonnes:
    - a
  indices:
    relance: Que permet une représentation qu'on ne peut pas faire de tête ?
    methode: Un tableau ou un graphique aide à voir des variations entre plusieurs mesures.
    etape: Élimine les deux réponses qui ne parlent pas de comparaison.
  pieges:
  - si:
      contient:
      - b
    relance: Le but n'est pas esthétique, mais de mieux comparer les mesures.
  - si:
      contient:
      - c
    relance: Il faut toujours un capteur pour obtenir une mesure ; le tableau sert à représenter ces mesures.
  solution: Cela permet de comparer facilement les mesures entre elles dans le temps et de constater des variations.
- id: durees-variations
  type: choix
  difficulte: 1
  enonce: Sur quelles durées peut-on observer des variations météorologiques ?
  reponse:
    options:
    - id: a
      texte: La journée
    - id: b
      texte: La semaine
    - id: c
      texte: La saison
    - id: d
      texte: La couleur du ciel uniquement
    bonnes:
    - a
    - b
    - c
  indices:
    relance: Pense à des durées qui vont de très courtes à très longues.
    methode: On peut observer des variations de la journée jusqu'à la saison, mais pas sur « la couleur du ciel ».
    etape: Élimine l'option qui n'est pas une durée.
  pieges:
  - si:
      contient:
      - d
    relance: La couleur du ciel n'est pas une durée, ce n'est pas une réponse possible ici.
  - si:
      diagnostic: incomplet
    relance: Il existe plusieurs bonnes durées, vérifie que tu les as toutes cochées.
  solution: On peut observer des variations sur une journée, une semaine, un mois ou une saison.
- id: pourquoi-relever-souvent
  type: ouverte
  difficulte: 2
  enonce: Explique en deux ou trois phrases pourquoi il vaut mieux relever la température plusieurs jours de suite plutôt
    qu'une seule fois pour connaître les variations météorologiques d'un mois.
  criteres:
  - L'élève comprend qu'une seule mesure ne montre pas de variation.
  - L'élève relie plusieurs relevés réguliers à la possibilité de comparer et de voir une évolution.
  indices:
    relance: Est-ce qu'une seule mesure permet de voir un changement dans le temps ?
    methode: Il faut plusieurs mesures, à des dates différentes, pour comparer et voir une variation.
    etape: Commence ainsi « Avec une seule mesure, on ne peut pas... », puis explique ce qu'il faut faire à la place.
  solution: Avec une seule mesure, on ne peut pas savoir si la température varie, car on n'a rien à comparer. En relevant
    la température plusieurs jours de suite, on peut comparer les mesures entre elles et voir comment elle évolue au cours
    du mois.
