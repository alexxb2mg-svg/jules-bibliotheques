      - o4
    relance: 'C''est la méthode correcte : le pluviomètre est le capteur adapté.'
  solution: Oublier d'indiquer les unités dans un tableau ou un graphique de mesures ; Tirer une conclusion sur une variation
    à partir d'une seule mesure isolée. C'est bien une erreur classique identifiée dans la fiche de méthode.
