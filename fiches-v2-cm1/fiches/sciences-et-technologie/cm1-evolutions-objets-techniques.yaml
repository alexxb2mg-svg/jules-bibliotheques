format: 2
notion: cm1-evolutions-objets-techniques
version: 3
etat: verifiee
declencheurs:
- avant et maintenant
- objet qui a changé
- comparer deux époques
- boire à table ou en randonnée
- objet différent selon le lieu
- train d'autrefois
- comment c'était avant
prerequis: []
essentiel: 'Un objet technique est un objet fabriqué par l''être humain pour répondre à un besoin. Par exemple, un verre répond
  au besoin de boire, un train au besoin de se déplacer.


  Les objets techniques évoluent. Plusieurs contextes peuvent expliquer ces évolutions :

  - le contexte historique : l''objet change au fil du temps, d''une époque à une autre ;

  - le contexte géographique : l''objet change selon le lieu ;

  - le contexte économique : l''objet change selon ce qu''il coûte ;

  - le contexte culturel : l''objet change selon les habitudes des gens ;

  - le contexte technologique : l''objet change grâce à de nouvelles inventions ou de nouveaux matériaux ;

  - le développement durable : l''objet change pour moins abîmer la planète.


  Pour repérer une évolution, on compare deux objets utilisés dans des situations analogues, c''est-à-dire pour le même besoin,
  à des époques ou dans des contextes différents. Par exemple, on compare une lampe à huile d''autrefois et une lampe à ampoule
  d''aujourd''hui : les deux servent à éclairer.


  Un même besoin peut aussi être satisfait par des objets différents selon le contexte d''utilisation. Pour s''hydrater, on
  utilise un verre à table, une gourde à l''école, une poche à eau en randonnée, une perfusion à l''hôpital quand un patient
  ne peut pas boire seul.

  '
methode:
- Identifier le besoin auquel répond l'objet (boire, se déplacer, s'éclairer...).
- Choisir deux situations analogues, pour le même besoin, à des époques ou dans des contextes différents.
- Identifier l'objet technique utilisé dans chaque situation.
- Comparer les deux objets pour repérer ce qui a évolué (matériaux, forme, énergie, usage).
- 'Nommer le contexte qui explique l''évolution : historique, géographique, économique, culturel, technologique ou développement
  durable.'
vocabulaire:
- terme: objet technique
  definition: un objet fabriqué par l'être humain pour répondre à un besoin
- terme: besoin
  definition: ce que l'on veut faire ou obtenir grâce à l'objet, par exemple boire ou se déplacer
- terme: contexte historique
  definition: l'époque à laquelle un objet est utilisé, qui explique son évolution au fil du temps
- terme: contexte géographique
  definition: le lieu où un objet est utilisé, qui explique qu'il soit différent ailleurs
- terme: développement durable
  definition: une manière de répondre à nos besoins en abîmant le moins possible la planète
- terme: situations analogues
  definition: deux situations qui se ressemblent, où l'on cherche à satisfaire le même besoin
erreurs_frequentes:
- Comparer deux objets qui ne répondent pas au même besoin, ce qui empêche de voir une évolution.
- Oublier de préciser le contexte (historique, géographique...) de chaque objet comparé.
- Croire qu'un seul type de contexte peut expliquer toutes les évolutions d'un objet.
- Croire qu'un objet plus récent est toujours meilleur pour tous les usages, sans penser au contexte d'utilisation.
exemple:
  enonce: Comment le besoin de s'hydrater est-il satisfait différemment selon le contexte ?
  solution: 'À table on utilise un verre et une carafe, à l''école une gourde, en randonnée une poche à eau, à l''hôpital
    une perfusion : le même besoin (boire) est satisfait par des objets techniques différents selon le contexte.'
exercices:
- id: contextes-evolution
  type: choix
  difficulte: 1
  enonce: Parmi ces éléments, lesquels peuvent expliquer l'évolution d'un objet technique ?
  reponse:
    options:
    - id: a
      texte: Le contexte historique
    - id: b
      texte: La couleur préférée d'un élève
    - id: c
      texte: Le contexte technologique
    - id: d
      texte: Le développement durable
    bonnes:
    - a
    - c
    - d
  indices:
    relance: Un de ces éléments n'est pas un contexte cité dans le cours.
    methode: Le cours cite les contextes historique, géographique, économique, culturel, technologique, et le développement
      durable.
    etape: La couleur préférée d'un élève n'est pas un contexte d'évolution d'un objet.
  pieges:
  - si:
      contient:
      - b
    relance: Une préférence personnelle n'est pas un contexte d'évolution d'un objet technique.
  - si:
      diagnostic: incomplet
    relance: Plusieurs contextes corrects sont proposés ici, vérifie que tu les as tous cochés.
  solution: Le contexte historique, le contexte technologique et le développement durable peuvent expliquer une évolution.
    Une préférence de couleur ne le peut pas.
- id: comparer-objets-memes-besoins
  type: choix
  difficulte: 1
  enonce: Pour bien comparer deux objets et voir leur évolution, que doivent-ils satisfaire ?
  reponse:
    options:
    - id: a
      texte: Un besoin identique dans les deux situations
    - id: b
      texte: Deux besoins totalement différents
    - id: c
      texte: Peu importe le besoin
    bonnes:
    - a
  indices:
    relance: Si les deux objets ne servent pas à faire la même chose, peut-on vraiment parler d'évolution ?
    methode: On compare des situations analogues, c'est-à-dire deux objets utilisés pour le même usage.
    etape: Élimine la réponse qui dit que le besoin n'a pas d'importance.
  pieges:
  - si:
      contient:
      - b
    relance: Si les besoins sont trop éloignés, la comparaison ne permet pas de voir une évolution.
  - si:
      contient:
      - c
    relance: Le besoin compte beaucoup, sinon on compare deux objets qui n'ont rien à voir entre eux.
  solution: Ils doivent répondre à un besoin identique dans les deux situations, sinon la comparaison ne montre pas une évolution
    mais deux objets différents.
- id: meme-besoin-objets-differents
  type: association
  difficulte: 2
  enonce: Relie chaque lieu à l'objet utilisé pour boire dans ce contexte.
  reponse:
    gauche:
    - id: a
      texte: À table
    - id: b
      texte: À l'école
    - id: c
      texte: En randonnée
    droite:
    - id: x
      texte: Un verre
    - id: y
      texte: Une gourde
    - id: z
      texte: Une poche à eau
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Ces trois objets répondent tous au même besoin, boire, mais adaptés au lieu.
    methode: Pense à ce que l'on transporte facilement à l'école, ou en marchant longtemps en randonnée.
    etape: Le verre est utilisé quand on est assis à table, sans le transporter.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse, regarde bien quel objet est le plus pratique pour chaque lieu.
  - si:
      diagnostic: associations_fausses
    relance: Repense au lieu où l'on est assis, où l'on transporte peu, ou où l'on marche longtemps.
  solution: À table on utilise un verre, à l'école une gourde, en randonnée une poche à eau, pour le même besoin de boire.
- id: evolution-et-contexte
  type: association
  difficulte: 2
  enonce: Relie chaque évolution d'un objet au contexte qui l'explique le mieux.
  reponse:
    gauche:
    - id: evo-ampoule
      texte: La lampe à huile a été remplacée par la lampe électrique quand on a inventé l'ampoule
    - id: evo-gourde
      texte: On remplace les bouteilles en plastique jetables par des gourdes réutilisables
    - id: evo-traineau
      texte: Dans les pays très enneigés, on se déplace parfois en traîneau plutôt qu'en vélo
    droite:
    - id: ctx-techno
      texte: Contexte technologique
    - id: ctx-durable
      texte: Développement durable
    - id: ctx-geo
      texte: Contexte géographique
    paires:
      evo-ampoule: ctx-techno
      evo-gourde: ctx-durable
      evo-traineau: ctx-geo
  indices:
    relance: Pour chaque évolution, cherche la raison du changement.
    methode: Une nouvelle invention renvoie au contexte technologique, moins de déchets au développement durable, un lieu
      différent au contexte géographique.
    etape: 'Commence par le traîneau : qu''est-ce qui est différent, l''époque ou le lieu ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Cherche dans chaque phrase le mot qui donne la raison du changement.
  - si:
      diagnostic: associations_fausses
    relance: Repère les indices dans les phrases (inventé, jetables, pays) et relis la liste des contextes de ta leçon.
  solution: L'ampoule est une invention (contexte technologique). La gourde réutilisable évite des déchets (développement
    durable). Le traîneau est adapté aux pays enneigés (contexte géographique).
- id: explique-evolution-transport
  type: ouverte
  difficulte: 2
  enonce: Explique en deux ou trois phrases ce que veut dire « le transport ferroviaire a évolué dans un contexte historique
    ».
  criteres:
  - L'élève comprend que le train d'aujourd'hui est différent de celui du passé.
  - L'élève relie cette différence à un contexte historique (l'évolution au fil du temps).
  - L'élève cite au moins un exemple de changement (énergie, vitesse, confort, matériaux).
  indices:
    relance: Le train d'aujourd'hui ressemble-t-il à celui utilisé il y a longtemps ?
    methode: Le contexte historique concerne l'évolution d'un objet au fil du temps.
    etape: Commence ainsi « Cela veut dire que le train... »
  solution: Cela veut dire que le train a changé au fil du temps. Autrefois, il roulait grâce à une machine à vapeur ; aujourd'hui,
    beaucoup de trains roulent à l'électricité et vont plus vite. Cette évolution s'explique par le contexte historique, c'est-à-dire
    les différentes époques.
- id: hopital-hydratation
  type: choix
  difficulte: 2
  enonce: À l'hôpital, quel objet technique répond au besoin de s'hydrater quand un patient ne peut pas boire seul ?
  reponse:
    options:
    - id: a
      texte: Une perfusion
    - id: b
      texte: Une poche à eau
    - id: c
      texte: Un verre
    bonnes:
    - a
  indices:
    relance: Cet objet fait entrer un liquide directement dans le corps, sans que le patient boive.
    methode: Chaque contexte a son objet adapté pour le même besoin de boire.
    etape: Le verre et la poche à eau supposent que le patient boive lui-même.
  pieges:
  - si:
      contient:
      - b
    relance: La poche à eau est utilisée en randonnée, pas à l'hôpital pour un patient qui ne peut pas boire seul.
  - si:
      contient:
      - c
    relance: Le verre suppose que le patient puisse boire seul, ce qui n'est pas toujours possible à l'hôpital.
  solution: C'est la perfusion, utilisée à l'hôpital pour répondre au besoin de s'hydrater dans ce contexte particulier.
- id: nom-contexte-epoque
  type: texte_court
  difficulte: 2
  enonce: On compare un téléphone de l'époque de tes grands-parents et un téléphone d'aujourd'hui. Quel contexte, dans la
    leçon, parle des différentes époques et du temps qui passe ? (un mot)
  reponse:
    acceptees:
    - historique
    - contexte historique
    - le contexte historique
    fautes_tolerees: 1
  indices:
    relance: La comparaison se fait entre deux époques différentes.
    methode: Le contexte qui parle du temps qui passe, des époques, porte un nom dans ta leçon.
    etape: Pense à la matière de l'école où l'on étudie le passé, les rois, les époques. Quel adjectif en vient ?
  pieges:
  - si:
      valeur: géographique
    relance: Le contexte géographique parle du lieu. Ici, ce qui change, c'est l'époque.
  - si:
      valeur: technologique
    relance: Les inventions ont joué un rôle, mais la question demande le contexte qui parle des époques et du temps qui passe.
  solution: C'est le contexte historique, car on compare deux objets utilisés à deux époques différentes pour le même besoin,
    téléphoner.
- id: comparer-deux-eclairages
  type: ouverte
  difficulte: 3
  enonce: Choisis deux objets qui servent à s'éclairer, l'un d'autrefois et l'autre d'aujourd'hui. Explique en trois phrases
    ce qui a évolué et quel contexte l'explique.
  criteres:
  - L'élève choisit deux objets qui répondent bien au même besoin (s'éclairer), à deux époques différentes.
  - L'élève décrit au moins une différence précise (énergie, matériau, forme, sécurité).
  - L'élève nomme un contexte qui explique l'évolution (historique, technologique, développement durable).
  indices:
    relance: Comment s'éclairait-on avant l'électricité ?
    methode: Nomme les deux objets, compare ce qui les fait fonctionner, puis nomme le contexte.
    etape: Tu peux commencer ainsi « Autrefois, on s'éclairait avec une bougie... ».
  solution: Autrefois, on s'éclairait avec une bougie, qui brûle et peut provoquer un incendie. Aujourd'hui, on utilise une
    lampe à ampoule électrique, plus sûre et qui éclaire mieux. Cette évolution s'explique par le contexte historique et le
    contexte technologique, avec l'invention de l'ampoule.
- id: nblm-pour-satisfaire-le-meme-besoin-de-boire-1
  type: choix
  difficulte: 2
  enonce: Pour satisfaire le même besoin de boire (s'hydrater), pourquoi utilise-t-on un verre à table et une poche à eau
    en randonnée ?
  reponse:
    options:
    - id: o1
      texte: Parce que l'objet technique s'adapte au contexte d'utilisation et au lieu.
    - id: o2
      texte: Parce que le verre et la poche à eau ne répondent pas du tout au même besoin.
    - id: o3
      texte: Parce qu'il est impossible d'emporter de l'eau en randonnée.
    - id: o4
      texte: Parce qu'un verre est le seul objet qui existe pour s'hydrater.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui change entre le moment où l'on mange assis à la maison et celui où l'on marche en nature.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : croire que ce sont deux besoins différents, alors qu''ils répondent tous les deux au besoin
      de s''hydrater.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la poche à eau est justement conçue pour transporter de l''eau facilement en randonnée.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : il existe de nombreux objets techniques pour s''hydrater selon le contexte (gourde, verre,
      poche à eau).'
  solution: Parce que l'objet technique s'adapte au contexte d'utilisation et au lieu. C'est exact ! Un même besoin (boire)
    est satisfait par des objets différents selon le lieu ou la situation.
- id: nblm-pour-etudier-l-evolution-d-un-objet-tech-2
  type: choix
  difficulte: 2
  enonce: Pour étudier l'évolution d'un objet technique entre le train d'autrefois à vapeur et le TGV d'aujourd'hui (avant
    et maintenant), quelle condition essentielle faut-il respecter ?
  reponse:
    options:
    - id: o1
      texte: Il faut comparer des objets qui répondent au même besoin (se déplacer).
    - id: o2
      texte: Il faut comparer deux objets qui n'ont aucun rapport entre eux.
    - id: o3
      texte: Il faut supposer qu'une seule cause explique tous les changements.
    - id: o4
      texte: Il faut oublier de préciser l'époque des objets comparés.
    bonnes:
    - o1
  indices:
    relance: Si deux objets ne servent pas à la même chose, peut-on vraiment dire que l'un est l'évolution de l'autre ?
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : comparer deux objets qui ne répondent pas au même besoin empêche de voir une véritable évolution.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : croire qu''un seul type de contexte explique toutes les évolutions d''un objet.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : oublier le contexte historique empêche de comprendre l''évolution entre avant et maintenant.'
  solution: Il faut comparer des objets qui répondent au même besoin (se déplacer). C'est juste ! Pour observer une évolution
    au fil du temps, il est indispensable de comparer deux objets répondant au même besoin.
- id: nblm-lorsqu-un-objet-a-change-entre-autrefois-3
  type: choix
  difficulte: 2
  enonce: Lorsqu'un objet a changé entre autrefois et aujourd'hui, quelles caractéristiques compare-t-on pour repérer son
    évolution ?
  reponse:
    options:
    - id: o1
      texte: Ses matériaux, sa forme et son usage.
    - id: o2
      texte: Uniquement la couleur du magasin où on l'achète.
    - id: o3
      texte: Seulement le nom de la personne qui l'utilise.
    - id: o4
      texte: Uniquement son prix sans observer sa fabrication.
    bonnes:
    - o1
  indices:
    relance: Regarde ce qui transforme la fabrication physique et l'utilisation de l'objet au fil du temps.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est incorrect : le lieu de vente ne constitue pas une caractéristique technique de l''objet.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : l''utilisateur ne définit pas la structure technique de l''objet.'
  - si:
      contient:
      - o4
    relance: 'C''est incomplet : l''étude technique exige de comparer la forme, les matériaux et l''usage.'
  solution: Ses matériaux, sa forme et son usage. C'est exact ! La comparaison des matériaux, de la forme et de l'usage permet
    d'identifier précisément ce qui a évolué.
- id: nblm-quel-objet-technique-est-utilise-special-4
  type: choix
  difficulte: 2
  enonce: Quel objet technique est utilisé spécialement à l'hôpital pour répondre au besoin de s'hydrater selon le contexte
    ?
  reponse:
    options:
    - id: o1
      texte: La perfusion.
    - id: o2
      texte: La gourde.
    - id: o3
      texte: La poche à eau.
    - id: o4
      texte: Le verre.
    bonnes:
    - o1
  indices:
    relance: Cherche l'objet médical cité dans la fiche qui permet d'apporter de l'eau à un patient.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : la gourde est l''objet adapté pour l''école ou les sorties sportives.'
  - si:
      contient:
      - o3
    relance: 'C''est incorrect : la poche à eau est la réponse adaptée à la randonnée.'
  - si:
      contient:
      - o4
    relance: 'C''est inexact : le verre est la réponse classique utilisée à table.'
  solution: La perfusion. C'est exact ! À l'hôpital, la perfusion est la réponse technique adaptée au contexte médical.
- id: nblm-en-dehors-du-contexte-historique-au-fil-5
  type: choix
  difficulte: 2
  enonce: En dehors du contexte historique (au fil du temps), dans quels autres contextes un objet technique peut-il évoluer
    ?
  reponse:
    options:
    - id: o1
      texte: Géographique, économique, culturel, technologique ou du développement durable.
    - id: o2
      texte: Uniquement selon la météo du jour même.
    - id: o3
      texte: Uniquement selon la taille du cartable de l'élève.
    - id: o4
      texte: Un objet ne peut jamais évoluer autrement qu'avec le temps.
    bonnes:
    - o1
  indices:
    relance: Pense aux lieux (géographie), aux ressources économiques et au respect de la planète.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : la météo au quotidien n''est pas un contexte d''évolution globale retenu.'
  - si:
      contient:
      - o3
    relance: 'C''est incorrect : la taille d''un cartable n''est pas un contexte d''évolution pour tous les objets techniques.'
  - si:
      contient:
      - o4
    relance: 'Erreur fréquente : croire que seul le temps explique la diversité des objets techniques.'
  solution: Géographique, économique, culturel, technologique ou du développement durable. C'est juste ! Un objet varie selon
    le lieu, la culture, l'économie, la technologie ou l'environnement.
- id: nblm-quelles-sont-les-deux-erreurs-frequentes-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux erreurs fréquentes à éviter quand on veut comparer des objets pour observer leur évolution
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Comparer deux objets qui ne répondent pas au même besoin.
    - id: o2
      texte: Oublier de préciser le contexte (historique, géographique) des objets comparés.
    - id: o3
      texte: Comparer le train d'autrefois et le train d'aujourd'hui.
    - id: o4
      texte: Comparer les matériaux et la forme de deux objets de même besoin.
    bonnes:
    - o1
    - o2
  indices:
    relance: Trouve les deux pièges décrits dans la rubrique des erreurs fréquentes de la fiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est une excellente démarche pour comparer deux époques et observer une évolution, pas une erreur !
  - si:
      contient:
      - o4
    relance: C'est au contraire la méthode recommandée dans la fiche pour repérer ce qui a changé.
  solution: Comparer deux objets qui ne répondent pas au même besoin ; Oublier de préciser le contexte (historique, géographique)
    des objets comparés. C'est exact ! Si les deux objets ne satisfont pas le même besoin, on ne peut pas observer une évolution.
- id: nblm-pour-etudier-l-evolution-d-un-objet-entr-7
