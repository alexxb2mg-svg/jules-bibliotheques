format: 2
notion: cm1-ombres-et-materiaux-lumiere
version: 2
etat: verifiee
declencheurs:
- silhouette au sol
- laisse passer un peu de lumière
- lampe de poche et objet
- se voit net à travers
- projeter une ombre sur un mur
- devant le soleil
- ombres chinoises
- pourquoi mon ombre grandit
prerequis: []
essentiel: 'Face à la lumière, les matériaux ne se comportent pas tous de la même façon. Un matériau transparent laisse bien
  passer la lumière et on voit net à travers, comme une vitre. Un matériau opaque ne laisse pas passer la lumière, comme le
  carton ou le bois. Un matériau translucide laisse passer un peu de lumière, mais on ne voit pas net à travers, comme le
  papier calque ou une vitre de salle de bain.


  Une ombre apparaît quand un objet opaque est placé entre une source de lumière (le Soleil, une lampe) et un écran (un mur,
  le sol). L''objet bloque la lumière : derrière lui, il manque de la lumière. Une ombre, c''est donc un manque de lumière.


  Il y a deux sortes d''ombres. L''ombre propre est sur l''objet lui-même : c''est la partie de l''objet qui n''est pas éclairée.
  L''ombre portée est projetée sur le sol ou sur l''écran, à côté ou derrière l''objet.


  La position et la taille de l''ombre portée dépendent de trois éléments : la source de lumière, l''objet opaque et l''écran.
  Plus l''objet est proche de la lampe, plus son ombre portée est grande. Plus l''objet est proche de l''écran, plus son ombre
  est petite. Si on déplace la lampe sur le côté, l''ombre part de l''autre côté.


  Pour comprendre l''effet d''un élément, on le fait varier seul en gardant les deux autres fixes. Sinon, on ne sait plus
  lequel a changé l''ombre.

  '
methode:
- 'Classer les matériaux en les testant face à une lumière : transparent, opaque ou translucide.'
- 'Pour produire une ombre : placer un objet opaque entre une source de lumière et un écran (ou le sol).'
- Distinguer sur l'objet l'ombre propre (la partie non éclairée de l'objet) de l'ombre portée (projetée à côté).
- 'Pour faire varier la taille ou la position de l''ombre : déplacer l''écran, ou la source, ou l''objet, en gardant les deux
  autres éléments constants.'
- Noter à chaque essai ce qu'on a changé et ce qu'on observe sur l'ombre.
vocabulaire:
- terme: source de lumière
  definition: un objet qui produit de la lumière, comme le Soleil ou une lampe
- terme: transparent
  definition: un matériau qui laisse bien passer la lumière et à travers lequel on voit net
- terme: opaque
  definition: un matériau qui ne laisse pas passer la lumière
- terme: translucide
  definition: un matériau qui laisse passer un peu de lumière, mais à travers lequel on ne voit pas net
- terme: ombre propre
  definition: la partie de l'objet lui-même qui n'est pas éclairée par la source de lumière
- terme: ombre portée
  definition: l'ombre projetée par un objet opaque sur le sol ou sur un écran
erreurs_frequentes:
- Confondre l'ombre propre (sur l'objet) et l'ombre portée (sur le sol ou l'écran).
- Croire qu'un objet translucide est transparent (on ne voit pas net à travers un translucide).
- Faire varier plusieurs éléments à la fois (source, objet, écran) et ne plus savoir ce qui a changé l'ombre.
- Croire que rapprocher l'objet de la lampe rend l'ombre plus petite, alors qu'elle devient plus grande.
- Croire qu'une ombre est une chose qui sort de l'objet, alors que c'est un manque de lumière.
exemple:
  enonce: Comment obtenir une grande ombre portée sur un mur avec une lampe de poche et un objet opaque ?
  solution: 'On garde la lampe et le mur fixes, et on rapproche l''objet opaque de la lampe : plus l''objet est proche de
    la source de lumière, plus son ombre portée est grande.'
exercices:
- id: classement-materiaux
  type: association
  difficulte: 1
  enonce: 'Relie chaque matériau à sa catégorie : transparent, opaque ou translucide.'
  reponse:
    gauche:
    - id: a
      texte: Une vitre
    - id: b
      texte: Un carton
    - id: c
      texte: Du papier calque
    droite:
    - id: x
      texte: Transparent
    - id: y
      texte: Opaque
    - id: z
      texte: Translucide
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Teste chacun devant une lumière : vois-tu net à travers, un peu flou, ou rien du tout ?'
    methode: Un matériau transparent laisse voir net, un opaque bloque tout, un translucide laisse passer la lumière mais
      flou.
    etape: 'Commence par le carton : la lumière passe-t-elle à travers ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repense à la différence entre translucide (flou) et transparent (net).
  - si:
      diagnostic: associations_fausses
    relance: 'Le carton bloque toute la lumière : c''est opaque. La vitre laisse voir net : transparente. Le papier calque
      laisse passer un peu de lumière, mais flou : translucide.'
  solution: La vitre est transparente (on voit net à travers), le carton est opaque (aucune lumière ne passe), le papier calque
    est translucide (la lumière passe mais on ne voit pas net).
- id: emplacement-ombre-propre
  type: choix
  difficulte: 1
  enonce: Sur ton propre corps éclairé par le Soleil, où se trouve ton ombre propre ?
  reponse:
    options:
    - id: a
      texte: Sur le sol, à côté de toi
    - id: b
      texte: Sur ton corps, la partie non éclairée par le Soleil
    bonnes:
    - b
  indices:
    relance: L'ombre propre n'est pas projetée sur le sol, elle est sur l'objet lui-même.
    methode: Cherche la partie de ton corps qui n'est pas touchée par la lumière du Soleil, par exemple ton dos si le Soleil
      est devant toi.
    etape: 'Élimine l''option qui parle du sol : c''est la définition de l''ombre portée, pas de l''ombre propre.'
  pieges:
  - si:
      contient:
      - a
    relance: Ce que tu décris est l'ombre portée, projetée sur le sol. L'ombre propre est directement sur ton corps.
  solution: L'ombre propre est la partie de ton corps qui n'est pas éclairée par le Soleil (par exemple le dos, si le Soleil
    est devant toi).
- id: objet-qui-fait-ombre
  type: choix
  difficulte: 1
  enonce: Avec une lampe, lequel de ces objets donne l'ombre la plus sombre sur le mur ?
  reponse:
    options:
    - id: a
      texte: Une plaque de bois
    - id: b
      texte: Une vitre
    - id: c
      texte: Une feuille de papier calque
    bonnes:
    - a
  indices:
    relance: Quel objet bloque toute la lumière ?
    methode: Une ombre bien sombre apparaît derrière un objet opaque, qui ne laisse passer aucune lumière.
    etape: Élimine l'objet à travers lequel on voit net, puis celui qui laisse passer un peu de lumière.
  pieges:
  - si:
      contient:
      - b
    relance: La vitre est transparente, elle laisse passer presque toute la lumière. Son ombre est à peine visible.
  - si:
      contient:
      - c
    relance: Le papier calque est translucide, il laisse passer un peu de lumière. Son ombre est donc plus claire.
  solution: La plaque de bois est opaque, elle bloque toute la lumière et donne l'ombre la plus sombre.
- id: reduire-ombre-portee
  type: texte_court
  difficulte: 2
  enonce: Tu veux rendre une ombre portée plus petite sans bouger la lampe ni l'écran. Quel élément dois-tu déplacer, et en
    le rapprochant de quoi (la lampe ou l'écran) ?
  reponse:
    acceptees:
    - objet vers l'ecran
    - rapprocher l'objet de l'ecran
    - l'objet vers l'écran
    fautes_tolerees: 1
  indices:
    relance: 'Un seul élément doit bouger : lequel reste-t-il, puisque la lampe et l''écran sont fixes ?'
    methode: 'C''est l''objet opaque qui doit se déplacer. Réfléchis : plus il est loin de la lampe, plus son ombre est petite.'
    etape: Rapproche l'objet de l'écran (donc éloigne-le de la lampe) pour réduire la taille de l'ombre.
  pieges:
  - si:
      valeur: objet vers la lampe
    relance: Rapprocher l'objet de la lampe agrandit l'ombre, ça ne la réduit pas. Essaie l'inverse.
  solution: On déplace l'objet vers l'écran, donc en l'éloignant de la source de lumière, la taille de l'ombre portée diminue.
- id: ordre-taille-ombre
  type: ordre
  difficulte: 2
  enonce: 'La lampe et le mur ne bougent pas. On place une figurine à trois endroits : à 20 cm de la lampe, à 60 cm de la
    lampe, puis tout près du mur. Range ces trois positions de celle qui donne la plus grande ombre à celle qui donne la plus
    petite.'
  reponse:
    elements:
    - id: pres-lampe
      texte: À 20 cm de la lampe
    - id: milieu
      texte: À 60 cm de la lampe
    - id: pres-mur
      texte: Tout près du mur
  indices:
    relance: Où l'ombre est-elle la plus grande, quand l'objet est près de la lampe ou près du mur ?
    methode: Plus l'objet est proche de la lampe, plus son ombre portée est grande.
    etape: La plus grande ombre est obtenue avec la figurine la plus proche de la lampe.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux positions voisines sont inversées. Laquelle des deux est la plus proche de la lampe ?
  - si:
      diagnostic: ordre_faux
    relance: As-tu rangé dans le bon sens ? On commence par la plus grande ombre, donc par la figurine la plus proche de la
      lampe.
  solution: À 20 cm de la lampe l'ombre est la plus grande, puis à 60 cm elle est plus petite, et tout près du mur elle est
    la plus petite.
- id: variables-ombre
  type: ouverte
  difficulte: 2
  enonce: Cite les trois éléments qui, une fois positionnés, déterminent la position et la taille d'une ombre portée. Explique
    en une phrase le principe pour étudier l'effet d'un seul de ces éléments.
  criteres:
  - 'L''élève cite les trois éléments : la source de lumière, l''objet opaque, l''écran (ou le sol).'
  - L'élève explique qu'il faut faire varier un seul élément à la fois en gardant les deux autres fixes.
  indices:
    relance: 'Pense à ce qui produit une ombre : une lumière, un objet qui la bloque, et une surface où elle se projette.'
    methode: 'Nomme les trois éléments, puis explique la règle : ne changer qu''un seul élément à la fois pour observer son
      effet précis.'
    etape: Le premier élément est la source de lumière.
  solution: Les trois éléments sont la source de lumière, l'objet opaque et l'écran (ou le sol). Pour étudier l'effet d'un
    seul élément, il faut le faire varier seul en gardant les deux autres fixes, sinon on ne sait plus lequel a changé l'ombre.
- id: compter-materiaux-opaques
  type: nombre
  difficulte: 2
  enonce: 'Lina teste six objets devant une lampe : une vitre, un livre, du papier calque, une planche de bois, une bouteille
    d''eau en verre transparent et une assiette en métal. Combien de ces objets sont opaques ?'
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Pour chaque objet, la lumière passe-t-elle à travers ?
    methode: Un objet opaque ne laisse passer aucune lumière. Barre ceux qui laissent passer de la lumière, nette ou floue.
    etape: Les objets transparents sont la vitre et la bouteille. Le papier calque est translucide. Compte les autres.
  pieges:
  - si:
      valeur: 4
    relance: As-tu compté le papier calque ? Il laisse passer un peu de lumière, il est translucide, pas opaque.
  - si:
      valeur: 2
    relance: Il en manque un. Le livre, la planche de bois et l'assiette en métal bloquent-ils tous la lumière ?
  solution: Le livre, la planche de bois et l'assiette en métal sont opaques, soit 3 objets. La vitre et la bouteille sont
    transparentes, le papier calque est translucide.
- id: pourquoi-un-seul-parametre
  type: choix
  difficulte: 3
  enonce: Pourquoi ne faut-il faire varier qu'un seul élément à la fois (source, objet ou écran) quand on étudie une ombre
    portée ?
  reponse:
    options:
    - id: a
      texte: Parce que sinon on ne sait plus quel élément a causé le changement observé sur l'ombre
    - id: b
      texte: Parce que la lumière s'éteint si on bouge deux éléments en même temps
    - id: c
      texte: Parce que le règlement de la classe l'interdit
    bonnes:
    - a
  indices:
    relance: 'Pense à ce qu''on cherche à comprendre : le lien entre un élément et un effet précis sur l''ombre.'
    methode: Si deux éléments changent en même temps, il devient impossible de savoir lequel des deux a produit le changement
      observé.
    etape: Élimine les réponses qui ne parlent pas de la fiabilité de l'observation.
  pieges:
  - si:
      contient:
      - b
    relance: Bouger un objet n'éteint pas la lumière. Pense plutôt à ce qu'on ne peut plus distinguer si deux choses changent
      en même temps.
  - si:
      contient:
      - c
    relance: 'Ce n''est pas une question de règlement, mais de méthode scientifique : pourquoi isoler un seul changement à
      la fois ?'
  solution: 'Si on fait varier plusieurs éléments à la fois, on ne peut plus savoir lequel a réellement causé le changement
    observé sur l''ombre : il faut isoler un seul paramètre pour comprendre son effet précis.'
