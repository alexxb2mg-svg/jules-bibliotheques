  enonce: Comment appelle-t-on la mémoire qui garde une information peu de temps, à l'inverse de celle qui la garde longtemps
    ? (deux mots)
  reponse:
    acceptees:
    - mémoire à court terme
    - court terme
    fautes_tolerees: 2
  indices:
    relance: Cette mémoire garde une information juste le temps de l'utiliser.
    methode: Cette mémoire sert à retenir une information juste le temps de s'en servir, puis on l'oublie.
    etape: Pense au numéro qu'on vient d'entendre et qu'on oublie juste après. La leçon donne un nom à cette mémoire.
  pieges:
  - si:
      valeur: mémoire à long terme
    relance: La mémoire à long terme garde une information longtemps ; ici, on cherche celle qui la garde peu de temps.
  solution: C'est la mémoire à court terme, qui garde une information peu de temps, contrairement à la mémoire à long terme.
