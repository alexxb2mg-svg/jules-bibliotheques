    methode: Le cerveau peut interpréter une image différemment de sa réalité physique mesurée.
    etape: Commence ainsi « Cette situation montre que le cerveau... »
  solution: Cette situation montre que le cerveau peut percevoir le monde différemment de sa réalité physique. Si on mesure
    les deux traits avec une règle, ils ont la même longueur, mais l'illusion fait que le cerveau les interprète comme différents.
