format: 2
notion: cm1-cerveau-grandes-fonctions
version: 3
etat: verifiee
declencheurs:
- deux traits différents
- se concentrer sur une tâche
- retenir une leçon
- illusion d'optique
- comment on rêve
- ce qu'on ressent tous pareil
- à quoi sert le cerveau
- j'oublie tout
prerequis: []
essentiel: 'Le cerveau est un organe situé dans la tête. Il participe à de nombreuses fonctions : percevoir le monde avec
  les sens (voir, entendre, toucher, sentir, goûter), commander les mouvements, parler, apprendre et mémoriser, ressentir
  des émotions, et produire des rêves pendant le sommeil.


  Nos sens recueillent des informations, et le cerveau les interprète. Parfois, il se trompe : c''est une illusion sensorielle.
  Par exemple, deux traits de même longueur peuvent sembler de longueurs différentes. Si on les mesure avec une règle, on
  découvre qu''ils sont égaux : notre perception est différente de la réalité physique.


  Pour savoir si tout le monde perçoit la même chose, on compare ce que l''on ressent avec ce que ressentent ses camarades.


  On peut choisir une stratégie pour mieux se concentrer : ranger sa table, couper les bruits, faire une seule chose à la
  fois. On peut aussi choisir une stratégie pour mémoriser : répéter, réciter à voix haute, faire un dessin, revoir la leçon
  plusieurs jours de suite. Ensuite, on vérifie si la stratégie a bien marché.


  La mémoire à court terme garde une information peu de temps, juste le temps de s''en servir (un numéro qu''on vient d''entendre).
  La mémoire à long terme la garde longtemps (une poésie apprise et revue plusieurs fois).

  '
methode:
- Localiser le cerveau dans la tête sur un schéma du corps.
- Observer une illusion sensorielle et décrire ce qu'on perçoit.
- Mesurer la réalité physique (avec une règle, par exemple) et la comparer à ce qu'on a perçu.
- Comparer sa perception d'une illusion avec celle d'un camarade.
- Choisir une stratégie de concentration ou de mémorisation, la tester, puis vérifier si elle a bien marché.
vocabulaire:
- terme: cerveau
  definition: l'organe situé dans la tête qui permet de percevoir, bouger, parler, apprendre, ressentir et rêver
- terme: perception
  definition: la manière dont le cerveau comprend ce que nos sens lui transmettent
- terme: illusion sensorielle
  definition: une situation où ce que l'on perçoit est différent de la réalité physique
- terme: mémoire à court terme
  definition: la mémoire qui garde une information peu de temps, juste le temps de s'en servir
- terme: mémoire à long terme
  definition: la mémoire qui garde une information longtemps
- terme: attention
  definition: la capacité de se concentrer sur une seule tâche
erreurs_frequentes:
- Croire que le cerveau ne sert qu'à réfléchir, sans penser aux perceptions, aux mouvements, aux émotions ou aux rêves.
- Croire que ce que l'on perçoit correspond toujours exactement à la réalité physique.
- Confondre la mémoire à court terme (courte durée) et la mémoire à long terme (longue durée).
- Croire qu'il suffit de lire une leçon une seule fois pour la garder longtemps en mémoire.
- Croire que ce sont les yeux qui se trompent dans une illusion, alors que c'est l'interprétation du cerveau.
exemple:
  enonce: Une illusion d'optique fait paraître deux traits de même longueur comme différents. Que montre cette expérience
    ?
  solution: 'On mesure les deux traits avec une règle : ils ont la même longueur. Pourtant, on les voit différents. Cette
    expérience montre que la perception du monde par le cerveau peut être différente de la réalité physique.'
