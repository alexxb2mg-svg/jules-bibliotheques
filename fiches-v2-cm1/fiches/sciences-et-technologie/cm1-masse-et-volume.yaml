format: 2
notion: cm1-masse-et-volume
version: 3
etat: verifiee
declencheurs:
- peser un caillou
- plus lourd que
- bol vide et plein
- balance à plateaux
- comparer deux poids
- farine dans un bol
- peser du lait
- lequel est le plus léger
prerequis: []
essentiel: 'La masse d''un objet dit s''il est lourd ou léger. On l''exprime en grammes (g) ou en kilogrammes (kg).


  Attention, masse et volume, ce n''est pas pareil. Le volume, c''est la place que prend un objet. Un gros ballon de baudruche
  prend beaucoup de place mais il est très léger. Une petite bille de métal prend peu de place et peut être plus lourde.


  Pour comparer les masses de deux objets, on utilise un dispositif simple, qu''on peut fabriquer en classe : une poulie et
  une cordelette, une balance romaine, une balance à fléau ou une balance à plateaux. L''objet le plus lourd fait pencher
  le dispositif de son côté. Si rien ne penche, les deux objets ont la même masse.


  Pour mesurer une masse, on utilise une balance : balance romaine, balance à plateaux ou balance électronique. On peut peser
  un solide (une pomme, un caillou) ou un liquide (de l''eau, du lait).


  Un liquide, de la farine ou du sucre se pèsent dans un récipient. Pour ne pas compter le récipient, on tare la balance :
  on pose le récipient vide, on appuie sur « tare », l''écran revient à zéro, puis on verse.


  Sans tare, on pèse le récipient vide, puis le récipient plein, et on calcule la différence. Par exemple, un bol vide de
  150 g et un bol plein de 420 g : 420 − 150 = 270 g de farine.

  '
methode:
- Décider si l'on veut comparer deux masses ou mesurer une masse.
- 'Pour comparer : poser un objet de chaque côté du dispositif et regarder de quel côté ça penche.'
- Vérifier la comparaison avec un autre dispositif (poulie, balance romaine, à fléau, à plateaux).
- 'Pour mesurer un solide : le poser sur la balance et lire le résultat en grammes ou en kilogrammes.'
- 'Pour mesurer un liquide ou de la poudre : poser le récipient vide, tarer, puis verser et lire.'
- 'Sans tare : peser le récipient vide, puis plein, et calculer la différence.'
vocabulaire:
- terme: masse
  definition: ce qui dit si un objet est lourd ou léger, mesuré en grammes ou en kilogrammes
- terme: volume
  definition: la place que prend un objet, qui ne dit pas s'il est lourd ou léger
- terme: tare
  definition: la fonction d'une balance qui remet l'affichage à zéro quand un récipient vide est posé dessus
- terme: balance à plateaux
  definition: un dispositif qui compare deux masses en montrant lequel des deux plateaux penche
- terme: balance électronique
  definition: une balance qui affiche directement la masse sur un écran
- terme: poulie
  definition: une petite roue sur laquelle passe une cordelette, qu'on peut utiliser pour comparer deux masses
erreurs_frequentes:
- Oublier de tarer la balance et donc compter la masse du récipient dans le résultat.
- Confondre masse et volume (un gros objet n'est pas forcément le plus lourd).
- Croire que le plateau qui monte porte l'objet le plus lourd, alors que c'est celui qui descend.
- Additionner la masse du récipient et la masse affichée au lieu de faire une soustraction.
- Ne vérifier le résultat qu'avec un seul dispositif sans le tester avec un autre.
exemple:
  enonce: Comment peser seulement la farine contenue dans un bol, sans balance à tare ?
  solution: 'On pèse le bol vide (par exemple 150 g), puis le bol avec la farine dedans (par exemple 420 g). On calcule la
    différence : masse de la farine = masse (bol + farine) − masse (bol vide) = 420 − 150 = 270 g.'
exercices:
- id: nom-fonction-remise-a-zero
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle la fonction d'une balance qui remet l'affichage à zéro quand on pose dessus un récipient vide
    ?
  reponse:
    acceptees:
    - tare
    fautes_tolerees: 1
  indices:
    relance: Cette fonction permet de ne pas compter le poids du récipient dans le résultat.
    methode: 'Relis le vocabulaire de ta leçon : un mot désigne cette remise à zéro.'
    etape: Pense au bouton de la balance électronique sur lequel on appuie juste après avoir posé le bol vide. Quel mot est
      écrit dessus ?
  pieges:
  - si:
      valeur: zéro
    relance: 'Ce n''est pas le mot « zéro » lui-même : c''est le nom de la fonction de la balance qui fait cette remise à
      zéro.'
  solution: 'C''est la fonction « tare » : elle remet le poids à zéro avec le récipient vide posé dessus.'
- id: instrument-pas-une-masse
  type: choix
  difficulte: 1
  enonce: Parmi ces objets, lequel ne sert PAS à mesurer une masse ?
  reponse:
    options:
    - id: a
      texte: Balance romaine
    - id: b
      texte: Balance à plateaux
    - id: c
      texte: Chronomètre
    - id: d
      texte: Balance électronique
    bonnes:
    - c
  indices:
    relance: 'Trois de ces objets ont un point commun : lequel sert à autre chose qu''à peser ?'
    methode: Trois de ces objets sont des balances qui mesurent une masse. Le quatrième sert à mesurer un temps qui passe.
    etape: Élimine les trois noms qui contiennent le mot « balance ».
  pieges:
  - si:
      contient:
      - a
    relance: La balance romaine sert bien à mesurer une masse. Cherche l'objet qui n'est pas une balance.
  - si:
      contient:
      - b
    relance: La balance à plateaux sert bien à comparer ou mesurer des masses. Cherche l'objet qui n'est pas une balance.
  - si:
      contient:
      - d
    relance: La balance électronique sert bien à mesurer une masse. Cherche l'objet qui n'est pas une balance.
  solution: Le chronomètre mesure une durée, pas une masse. Les balances romaine, à plateaux et électronique servent toutes
    à mesurer une masse.
- id: plateau-qui-descend
  type: choix
  difficulte: 1
  enonce: Sur une balance à plateaux, on pose une pomme d'un côté et une mandarine de l'autre. Le plateau de la pomme descend,
    celui de la mandarine monte. Quel fruit a la plus grande masse ?
  reponse:
    options:
    - id: a
      texte: La pomme
    - id: b
      texte: La mandarine
    - id: c
      texte: Les deux ont la même masse
    bonnes:
    - a
  indices:
    relance: De quel côté penche la balance ?
    methode: Sur une balance à plateaux, l'objet le plus lourd fait descendre son plateau.
    etape: Regarde quel plateau est descendu, puis cherche quel fruit est posé dessus.
  pieges:
  - si:
      contient:
      - b
    relance: Le plateau qui monte porte l'objet le plus léger. Regarde plutôt le plateau qui descend.
  - si:
      contient:
      - c
    relance: Si les deux masses étaient égales, la balance resterait bien droite. Est-ce le cas ici ?
  solution: La pomme a la plus grande masse, car son plateau descend. La mandarine est plus légère, son plateau monte.
- id: masse-farine
  type: nombre
  difficulte: 2
  enonce: Un bol vide pèse 150 g. Avec de la farine dedans, il pèse 420 g. Quelle est la masse de la farine, en grammes ?
  reponse:
    valeur: 270
    forme: entier
  indices:
    relance: Utilise la différence entre le bol plein et le bol vide.
    methode: Masse de la farine = masse (bol + farine) − masse (bol vide).
    etape: Calcule 420 − 150.
  pieges:
  - si:
      valeur: 570
    relance: As-tu additionné les deux masses au lieu de faire une soustraction ? Il faut retirer le poids du bol vide.
  - si:
      valeur: 420
    relance: 420 g, c'est le poids du bol avec la farine dedans, pas la farine seule. Retire le poids du bol vide.
  solution: 420 − 150 = 270 g de farine.
- id: etapes-peser-sans-tare
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour peser du sucre dans un pot, sans balance à tare.
  reponse:
    elements:
    - id: peser-vide
      texte: Peser le pot vide
    - id: verser
      texte: Verser le sucre dans le pot
    - id: peser-plein
      texte: Peser le pot avec le sucre dedans
    - id: calculer
      texte: Calculer la différence entre les deux pesées
  indices:
    relance: Que dois-tu peser avant même de mettre le sucre dans le pot ?
    methode: Pèse d'abord le pot seul, puis ajoute le sucre, puis pèse à nouveau, puis fais un calcul.
    etape: La première étape est de peser le pot vide, avant d'y verser quoi que ce soit.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux doit se faire en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la toute première étape (peser le pot vide) et la toute dernière (le calcul), puis range les deux
      autres entre elles.
  solution: On pèse le pot vide, puis on verse le sucre, puis on pèse le pot plein, puis on calcule la différence entre les
    deux pesées.
- id: dispositif-usage
  type: association
  difficulte: 2
  enonce: Relie chaque dispositif à ce qu'il permet de faire.
  reponse:
    gauche:
    - id: a
      texte: Poulie et cordelette
    - id: b
      texte: Balance électronique
    - id: c
      texte: Balance à fléau fabriquée en classe
    droite:
    - id: x
      texte: Comparer deux objets en observant lequel fait pencher le système
    - id: y
      texte: Mesurer une masse précise en grammes ou en kilogrammes
    paires:
      a: x
      b: y
      c: x
  indices:
    relance: Un dispositif donne un nombre précis, les deux autres montrent seulement lequel est le plus lourd.
    methode: 'La balance électronique affiche un nombre : c''est une mesure. La poulie et la balance à fléau fabriquée en
      classe montrent seulement un côté qui penche : c''est une comparaison.'
    etape: 'Commence par la balance électronique : que fait-elle apparaître sur son écran ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Demande-toi laquelle donne un nombre précis, et lesquelles montrent juste un
      côté qui penche.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la balance électronique, qui donne un nombre précis. Les deux autres dispositifs servent à comparer.
  solution: La poulie et cordelette et la balance à fléau fabriquée en classe servent à comparer deux objets (un côté penche).
    La balance électronique sert à mesurer une masse précise.
- id: ranger-trois-objets
  type: ordre
  difficulte: 2
  enonce: 'Avec une balance à plateaux, on observe deux choses : le livre est plus lourd que la trousse, et la trousse est
    plus lourde que la gomme. Range ces trois objets du plus léger au plus lourd.'
  reponse:
    elements:
    - id: gomme
      texte: La gomme
    - id: trousse
      texte: La trousse
    - id: livre
      texte: Le livre
  indices:
    relance: Lequel de ces trois objets n'est jamais le plus lourd dans les deux comparaisons ?
    methode: Relis chaque comparaison et note, à chaque fois, quel objet est le plus léger des deux.
    etape: Lis la deuxième comparaison et cherche lequel des deux objets est le plus léger.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux objets voisins sont inversés. Relis la comparaison qui parle de ces deux objets.
  - si:
      diagnostic: ordre_faux
    relance: On commence par le plus léger. As-tu rangé dans le bon sens, du plus léger au plus lourd ?
  solution: 'La gomme est plus légère que la trousse, et la trousse plus légère que le livre. L''ordre est donc : la gomme,
    la trousse, le livre.'
- id: oubli-de-tare-lait
  type: nombre
  difficulte: 3
  enonce: Léa veut peser du lait. Elle a oublié de tarer la balance. Son bol vide pèse 120 g et l'écran affiche 380 g avec
    le lait dedans. Quelle est la masse du lait seul, en grammes ?
  reponse:
    valeur: 260
    forme: entier
  indices:
    relance: Le nombre affiché compte-t-il seulement le lait, ou aussi autre chose ?
    methode: L'écran affiche la masse du bol et du lait ensemble. Retire la masse du bol vide.
    etape: Pose la soustraction 380 − 120.
  pieges:
  - si:
      valeur: 500
    relance: Tu as ajouté la masse du bol. Or le bol est déjà compté dans le nombre affiché. Il faut l'enlever.
  - si:
      valeur: 380
    relance: Ce nombre compte aussi le bol, car la balance n'a pas été tarée. Que dois-tu enlever ?
  solution: 'L''écran compte le bol et le lait. Masse du lait = 380 − 120 = 260 g. Vérification : 260 + 120 = 380.'
- id: peser-sucre-sans-tare
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases comment tu ferais pour connaître exactement la masse du sucre contenu dans un
    pot, sans utiliser la fonction tare.
  criteres:
  - L'élève propose de peser le pot vide, puis le pot avec le sucre dedans.
  - L'élève propose de calculer la différence entre les deux pesées.
  - L'élève ne compte pas le poids du pot dans le résultat final.
  indices:
    relance: Que peux-tu peser avant de mettre le sucre dans le pot ?
    methode: Pèse le pot vide, puis le pot plein, puis fais un calcul entre les deux résultats.
    etape: 'Tu peux commencer ainsi : « Je pèse d''abord le pot vide... »'
  solution: 'Je pèse d''abord le pot vide, par exemple 200 g. Puis je verse le sucre et je pèse le pot plein, par exemple
    350 g. Je calcule la différence : 350 − 200 = 150 g, c''est la masse du sucre seul.'
