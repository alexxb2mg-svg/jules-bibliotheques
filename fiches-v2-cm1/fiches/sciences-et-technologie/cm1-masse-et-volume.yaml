format: 2
notion: cm1-masse-et-volume
version: 1
etat: verifiee
declencheurs:
- peser un caillou
- plus lourd que
- bol vide et plein
- balance à plateaux
- comparer deux poids
- farine dans un bol
prerequis: []
essentiel: "La masse dit si un objet est lourd ou léger. On la compare avec un dispositif simple (poulie et cordelette,\n\
  \  balance romaine, à fléau, à plateaux) : l'objet le plus lourd fait pencher la balance de son côté.\n\n\n  On peut aussi\
  \ mesurer la masse avec une balance (romaine, à plateaux, électronique), en grammes ou en kilogrammes.\n\n\n  Pour peser\
  \ un liquide ou des grains dans un récipient, sans compter le poids du récipient, on utilise la fonction\n  « tare » de\
  \ la balance (elle remet à zéro avec le récipient posé), ou on pèse le récipient vide puis plein et\n  on calcule la différence."
methode:
- Choisir un dispositif de comparaison (poulie, balance romaine, à fléau, à plateaux) ou une balance de mesure.
- 'Pour comparer : observer de quel côté ça penche, l''objet le plus lourd fait pencher son côté.'
- Pour vérifier, refaire la comparaison avec un autre dispositif.
- 'Pour mesurer une masse : peser directement, ou tarer la balance avec le récipient vide avant d''ajouter la matière.'
- 'Sans tare : peser le récipient vide, peser le récipient plein, calculer la différence.'
vocabulaire:
- terme: masse
  definition: ce qui dit si un objet est lourd ou léger, mesuré en grammes ou en kilogrammes
- terme: tare
  definition: la fonction d'une balance qui remet le poids à zéro quand un récipient vide est posé dessus
- terme: balance à plateaux
  definition: un dispositif qui compare deux masses en montrant lequel des deux plateaux penche
erreurs_frequentes:
- Oublier de tarer la balance et donc compter la masse du récipient dans le résultat.
- Confondre masse et volume (un gros objet n'est pas forcément le plus lourd).
- Ne vérifier le résultat qu'avec un seul dispositif sans tester sa robustesse avec un autre.
exemple:
  enonce: Comment peser seulement la farine contenue dans un bol, sans balance à tare ?
  solution: "On pèse le bol vide, puis le bol avec la farine dedans, puis on calcule la différence : masse de la\n    farine\
    \ = masse (bol + farine) − masse (bol vide)."
exercices:
- id: nom-fonction-remise-a-zero
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle la fonction d'une balance qui remet le poids à zéro quand on pose dessus un récipient vide ?
  reponse:
    acceptees:
    - tare
    fautes_tolerees: 1
  indices:
    relance: Cette fonction permet de ne pas compter le poids du récipient dans le résultat.
    methode: 'Relis le vocabulaire de ta leçon : un mot désigne cette remise à zéro.'
    etape: Le mot commence par « t » et a 4 lettres.
  pieges:
  - si:
      valeur: zéro
    relance: 'Ce n''est pas le mot « zéro » lui-même : c''est le nom de la fonction de la balance qui fait cette remise à
      zéro.'
  solution: 'C''est la fonction « tare » : elle remet le poids à zéro avec le récipient vide posé dessus.'
- id: instrument-pas-une-masse
  type: choix
  difficulte: 1
  enonce: Parmi ces objets, lequel ne sert PAS à mesurer une masse ?
  reponse:
    options:
    - id: a
      texte: Balance romaine
    - id: b
      texte: Balance à plateaux
    - id: c
      texte: Chronomètre
    - id: d
      texte: Balance électronique
    bonnes:
    - c
  indices:
    relance: 'Trois de ces objets ont un point commun : lequel sert à autre chose qu''à peser ?'
    methode: Trois de ces objets sont des balances qui mesurent une masse. Le quatrième sert à mesurer un temps qui passe.
    etape: Élimine les trois noms qui contiennent le mot « balance ».
  pieges:
  - si:
      contient:
      - a
    relance: La balance romaine sert bien à mesurer une masse. Cherche l'objet qui n'est pas une balance.
  - si:
      contient:
      - b
    relance: La balance à plateaux sert bien à comparer ou mesurer des masses. Cherche l'objet qui n'est pas une balance.
  - si:
      contient:
      - d
    relance: La balance électronique sert bien à mesurer une masse. Cherche l'objet qui n'est pas une balance.
  solution: Le chronomètre mesure une durée, pas une masse. Les balances romaine, à plateaux et électronique servent toutes
    à mesurer une masse.
- id: masse-farine
  type: nombre
  difficulte: 2
  enonce: Un bol vide pèse 150 g. Avec de la farine dedans, il pèse 420 g. Quelle est la masse de la farine, en grammes ?
  reponse:
    valeur: 270
    forme: entier
  indices:
    relance: Utilise la différence entre le bol plein et le bol vide.
    methode: Masse de la farine = masse (bol + farine) − masse (bol vide).
    etape: Calcule 420 − 150.
  pieges:
  - si:
      valeur: 570
    relance: As-tu additionné les deux masses au lieu de faire une soustraction ? Il faut retirer le poids du bol vide.
  - si:
      valeur: 420
    relance: 420 g, c'est le poids du bol avec la farine dedans, pas la farine seule. Retire le poids du bol vide.
  solution: 420 − 150 = 270 g de farine.
- id: etapes-peser-sans-tare
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour peser du sucre dans un pot, sans balance à tare.
  reponse:
    elements:
    - id: peser-vide
      texte: Peser le pot vide
    - id: verser
      texte: Verser le sucre dans le pot
    - id: peser-plein
      texte: Peser le pot avec le sucre dedans
    - id: calculer
      texte: Calculer la différence entre les deux pesées
  indices:
    relance: Que dois-tu peser avant même de mettre le sucre dans le pot ?
    methode: Pèse d'abord le pot seul, puis ajoute le sucre, puis pèse à nouveau, puis fais un calcul.
    etape: La première étape est de peser le pot vide, avant d'y verser quoi que ce soit.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle des deux doit se faire en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la toute première étape (peser le pot vide) et la toute dernière (le calcul), puis range les deux
      autres entre elles.
  solution: On pèse le pot vide, puis on verse le sucre, puis on pèse le pot plein, puis on calcule la différence entre les
    deux pesées.
- id: dispositif-usage
  type: association
  difficulte: 2
  enonce: Relie chaque dispositif à ce qu'il permet de faire.
  reponse:
    gauche:
    - id: a
      texte: Poulie et cordelette
    - id: b
      texte: Balance électronique
    - id: c
      texte: Balance à plateaux
    droite:
    - id: x
      texte: Comparer deux objets en observant lequel fait pencher le système
    - id: y
      texte: Mesurer une masse précise en grammes ou en kilogrammes
    paires:
      a: x
      b: y
      c: x
  indices:
    relance: Un dispositif donne un nombre précis, les deux autres montrent seulement lequel est le plus lourd.
    methode: 'La balance électronique affiche un nombre : c''est une mesure. La poulie et la balance à plateaux montrent seulement
      un côté qui penche : c''est une comparaison.'
    etape: 'Commence par la balance électronique : que fait-elle apparaître sur son écran ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Demande-toi laquelle donne un nombre précis, et lesquelles montrent juste un
      côté qui penche.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la balance électronique, qui donne un nombre précis. Les deux autres dispositifs servent à comparer.
  solution: La poulie et cordelette et la balance à plateaux servent à comparer deux objets (un côté penche). La balance électronique
    sert à mesurer une masse précise.
- id: peser-sucre-sans-tare
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases comment tu ferais pour connaître exactement la masse du sucre contenu dans un
    pot, sans utiliser la fonction tare.
  criteres:
  - L'élève propose de peser le pot vide, puis le pot avec le sucre dedans.
  - L'élève propose de calculer la différence entre les deux pesées.
  - L'élève ne compte pas le poids du pot dans le résultat final.
  indices:
    relance: Que peux-tu peser avant de mettre le sucre dans le pot ?
    methode: Pèse le pot vide, puis le pot plein, puis fais un calcul entre les deux résultats.
    etape: 'Tu peux commencer ainsi : « Je pèse d''abord le pot vide... »'
  solution: 'Je pèse d''abord le pot vide, par exemple 200 g. Puis je verse le sucre et je pèse le pot plein, par exemple
    350 g. Je calcule la différence : 350 − 200 = 150 g, c''est la masse du sucre seul.'
