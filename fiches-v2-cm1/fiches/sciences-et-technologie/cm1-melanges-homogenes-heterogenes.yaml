    relance: 'Erreur : le tamisage est une technique de tri de solides, pas un état de mélange.'
  - si:
      contient:
      - o4
    relance: 'Faux : le mot filtré désigne un liquide passé dans un filtre, pas la nature du mélange obtenu avec le sel.'
  solution: 'Un mélange homogène. Exact : on obtient un mélange homogène car on ne distingue plus le sel de l''eau à l''œil
    nu.'
- id: nblm-si-tu-ajoutes-du-sel-cuillere-apres-cuil-4
  type: choix
  difficulte: 2
  enonce: Si tu ajoutes du sel cuillère après cuillère dans de l'eau et que tout à coup ça ne se dissout plus, quelle étape
