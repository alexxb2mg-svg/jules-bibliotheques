    - id: o1
      texte: La décantation
    - id: o2
      texte: La filtration
    - id: o3
      texte: Le tamisage
    - id: o4
      texte: La dissolution
    bonnes:
    - o1
  indices:
    relance: Pense au verbe qui signifie laisser reposer un liquide pour que le dépôt se forme au fond.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
