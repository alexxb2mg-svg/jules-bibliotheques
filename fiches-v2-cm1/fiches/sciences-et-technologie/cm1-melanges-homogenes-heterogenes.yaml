      texte: Le sable et l'eau traversent tous les deux le filtre à café.
    - id: o3
      texte: Le sable se dissout dans le filtre à café.
    - id: o4
      texte: Le filtre se dissout dans l'eau.
    bonnes:
    - o1
  indices:
    relance: Compare la taille des grains de sable avec les petits trous du filtre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : les grains de sable sont trop gros pour passer à travers les trous du filtre.'
  - si:
      contient:
      - o3
    relance: 'Erreur : le filtre ne fait pas dissoudre le solide, il le bloque mécaniquement.'
  - si:
      contient:
      - o4
    relance: 'Faux : le papier du filtre reste solide et retient le sable.'
  solution: 'Le filtre retient le sable et laisse passer l''eau claire. C''est juste : le sable est un solide non dissous,
    ses grains sont retenus par le filtre à café.'
- id: nblm-quand-on-observe-du-sel-qui-fond-dans-l-3
  type: choix
  difficulte: 2
  enonce: Quand on observe du sel qui fond dans l'eau (expression populaire pour dire qu'il se dissout) jusqu'à devenir invisible,
