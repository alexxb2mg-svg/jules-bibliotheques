    relance: 'Erreur : le tamisage sert à séparer des solides de tailles différentes avec des grilles.'
  - si:
      contient:
      - o4
    relance: 'Faux : la dissolution est le fait qu''un solide se mélange de manière invisible dans un liquide.'
  solution: 'La décantation. C''est exact : la décantation consiste à laisser reposer le mélange pour que les particules lourdes
    se déposent au fond.'
- id: nblm-si-l-on-veut-separer-du-sable-melange-a-2
