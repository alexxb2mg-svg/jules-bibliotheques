    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : la décantation est l''action de laisser se déposer un solide non dissous.'
  - si:
      contient:
      - o3
    relance: 'Erreur : la filtration est une méthode pour séparer un solide d''un liquide.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''évaporation est le passage de l''eau liquide à l''état de vapeur.'
