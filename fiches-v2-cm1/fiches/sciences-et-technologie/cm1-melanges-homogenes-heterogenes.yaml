    relance: 'Faux : le sel dissous traverse le filtre à café sans être retenu.'
  solution: 'Dans un mélange hétérogène, on distingue plusieurs constituants à l''œil nu ; Le tamisage permet de séparer des
    solides de tailles différentes. C''est exact : la définition d''un mélange hétérogène est qu''on y voit encore les éléments.'
