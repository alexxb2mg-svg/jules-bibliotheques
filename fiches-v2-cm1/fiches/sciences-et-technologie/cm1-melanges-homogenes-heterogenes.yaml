format: 2
notion: cm1-melanges-homogenes-heterogenes
version: 3
etat: generee
declencheurs:
- eau trouble
- sel qui fond dans l'eau
- séparer du sable
- filtre à café
- récupérer l'eau claire
- ça ne se dissout plus
- sucre qui disparaît dans l'eau
- eau boueuse qui repose
- trier avec une passoire
prerequis: []
essentiel: 'Un mélange contient plusieurs constituants, c''est-à-dire plusieurs matières mélangées. On distingue deux sortes
  de mélanges.


  Dans un mélange hétérogène, on voit encore à l''œil nu les différents constituants : de l''eau et du sable, de l''eau et
  de l''huile, des cailloux et du sable. Dans un mélange homogène, on ne les distingue plus : l''eau salée bien mélangée ressemble
  à de l''eau seule.


  Pour séparer les constituants d''un mélange de solides ou d''un mélange solide-liquide, on utilise trois techniques. Le
  tamisage sépare des solides de tailles différentes : on passe le mélange dans des tamis, en commençant par les mailles les
  plus larges. La décantation consiste à laisser reposer le mélange : les solides se déposent au fond et on récupère le liquide
  clair au-dessus. La filtration fait passer le mélange à travers un filtre (filtre à café, tissu, papier absorbant) : le
  solide reste dans le filtre, le liquide passe.


  Certains solides se dissolvent dans l''eau, comme le sel ou le sucre : c''est la dissolution. D''autres ne se dissolvent
  pas, comme le sable. Un solide dissous n''a pas disparu : on ne le voit plus, mais il est toujours dans l''eau. Un filtre
  ne peut pas le retenir.


  Si on ajoute du sel cuillère par cuillère dans un verre d''eau, en mélangeant bien, il arrive un moment où le sel ne se
  dissout plus et reste au fond : c''est la saturation. Pour en rendre compte avec des nombres, on compte les cuillères rases
  dissoutes avant la saturation, toujours avec la même quantité d''eau.

  '
methode:
- 'Observer le mélange : voit-on encore les constituants (hétérogène) ou non (homogène) ?'
- 'Pour séparer des solides de tailles différentes : tamiser en commençant par le tamis aux mailles les plus larges, puis
  les plus petites.'
- 'Pour clarifier un mélange eau-terre : attendre que les solides se déposent au fond (décantation), puis récupérer l''eau
  claire.'
- 'Pour séparer un liquide et un solide non dissous : filtrer avec un filtre à café, un tissu ou du papier absorbant.'
- 'Pour tester la dissolution et la saturation : ajouter le solide cuillère rase par cuillère rase dans une quantité d''eau
  mesurée, mélanger, et compter les cuillères dissoutes jusqu''à ce que le solide reste au fond.'
vocabulaire:
- terme: mélange homogène
  definition: un mélange où l'on ne distingue plus les constituants qui le composent
- terme: mélange hétérogène
  definition: un mélange où l'on voit encore les constituants qui le composent
- terme: tamisage
  definition: une technique qui sépare des solides de tailles différentes à l'aide de tamis
- terme: décantation
  definition: une technique où l'on laisse reposer le mélange pour que les solides se déposent au fond
- terme: filtration
  definition: une technique où l'on fait passer le mélange à travers un filtre qui retient le solide
- terme: dissolution
  definition: le fait qu'un solide se mélange à l'eau au point de ne plus être visible
- terme: saturation
  definition: le moment où un liquide ne peut plus dissoudre de solide supplémentaire
erreurs_frequentes:
- Tamiser en commençant par les mailles les plus petites au lieu des plus larges.
- Croire qu'un solide dissous a disparu, alors qu'il est toujours présent mais invisible.
- 'Essayer de récupérer un solide dissous avec un filtre (impossible : c''est justement le signe qu''il est dissous).'
- Ne pas contrôler précisément les quantités (cuillère rase, volume mesuré) et obtenir des résultats différents à chaque essai.
- 'Croire qu''un mélange de deux liquides est toujours homogène : l''eau et l''huile restent séparées, le mélange est hétérogène.'
exemple:
  enonce: On mélange des cailloux, du gravier et du sable dans un seau. Comment les séparer ?
  solution: 'On utilise des tamis dans le bon ordre : d''abord le tamis aux mailles les plus larges (il garde les cailloux),
    puis un tamis aux mailles plus petites (il garde le gravier), le sable passe à travers tous les tamis. C''est un tamisage
    : il sépare des solides de tailles différentes.'
exercices:
- id: type-eau-huile
  type: choix
  difficulte: 1
  enonce: 'De l''eau et de l''huile dans un verre : quel type de mélange est-ce ?'
  reponse:
    options:
    - id: a
      texte: Un mélange homogène, car on ne voit qu'un seul liquide
    - id: b
      texte: Un mélange hétérogène, car on voit deux liquides séparés
    bonnes:
    - b
  indices:
    relance: Peux-tu distinguer les deux liquides à l'œil, ou forment-ils une seule masse uniforme ?
    methode: 'Regarde bien le verre : l''huile flotte-t-elle sur l''eau, séparée, ou est-ce un seul liquide uniforme ?'
    etape: L'huile flotte sur l'eau, sans se mélanger avec elle.
  pieges:
  - si:
      contient:
      - a
    relance: 'Regarde à nouveau le verre : vois-tu vraiment un seul liquide uniforme, ou deux couches distinctes ?'
  solution: 'C''est un mélange hétérogène : on voit deux liquides séparés, l''huile flotte sur l''eau.'
- id: methode-eau-terre
  type: texte_court
  difficulte: 1
  enonce: Quelle méthode permet de récupérer de l'eau claire à partir d'un mélange d'eau et de terre, en laissant simplement
    reposer le mélange sans rien ajouter ?
  reponse:
    acceptees:
    - décantation
    - la décantation
    fautes_tolerees: 1
  indices:
    relance: Cette méthode consiste à attendre, sans agiter, que quelque chose se passe au fond du récipient.
    methode: Pense au mot du cours qui désigne le fait de laisser les solides se déposer au fond.
    etape: 'Relis les trois techniques de la leçon : laquelle demande seulement de laisser reposer le mélange ?'
  pieges:
  - si:
      valeur: filtration
    relance: 'La filtration utilise un filtre. Ici, on ne fait qu''attendre sans rien ajouter : quel est ce mot ?'
  solution: 'C''est la décantation : on laisse les solides se déposer au fond du récipient, puis on récupère l''eau claire.'
- id: quels-solides-se-dissolvent
  type: choix
  difficulte: 1
  enonce: Tu verses une cuillère de chaque solide dans un verre d'eau et tu mélanges bien. Lesquels se dissolvent dans l'eau
    ? Choisis toutes les bonnes réponses.
  reponse:
    options:
    - id: a
      texte: Le sel
    - id: b
      texte: Le sucre
    - id: c
      texte: Le sable
    - id: d
      texte: De petits cailloux
    bonnes:
    - a
    - b
  indices:
    relance: Après avoir mélangé, lesquels ne voit-on plus du tout dans l'eau ?
    methode: Un solide qui se dissout devient invisible dans l'eau. Un solide qui ne se dissout pas reste visible, souvent
      au fond.
    etape: Les petits cailloux restent au fond du verre, même après avoir bien mélangé. Teste ainsi les trois autres.
  pieges:
  - si:
      contient:
      - c
    relance: Après avoir mélangé, le sable est-il devenu invisible, ou le vois-tu encore au fond ?
  - si:
      contient:
      - d
    relance: Les petits cailloux disparaissent-ils dans l'eau quand on mélange ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé un, mais il y en a un autre qui devient invisible dans l'eau.
  solution: 'Le sel et le sucre se dissolvent dans l''eau : on ne les voit plus. Le sable et les petits cailloux ne se dissolvent
    pas : ils restent visibles au fond.'
- id: ordre-tamisage
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre d'utilisation les tamis pour séparer un mélange de cailloux, gravier et sable.
  reponse:
    elements:
    - id: large
      texte: Tamis aux mailles les plus larges (retient les cailloux)
    - id: moyen
      texte: Tamis aux mailles moyennes (retient le gravier)
    - id: fin
      texte: Le sable passe à travers tous les tamis
  indices:
    relance: 'Quel tamis utilise-t-on en premier : celui aux mailles les plus larges ou les plus petites ?'
    methode: On commence toujours par le tamis aux mailles les plus larges, puis on continue avec des mailles de plus en plus
      petites.
    etape: 'La première étape est le tamis aux mailles les plus larges, qui retient les plus gros éléments : les cailloux.'
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Deux étapes sont inversées. Rappelle-toi : on commence par les mailles les plus larges.'
  - si:
      diagnostic: ordre_faux
    relance: 'Repense à l''ordre des tailles : cailloux (gros), gravier (moyen), sable (fin). Les tamis suivent cet ordre
      du plus large au plus petit.'
  solution: On utilise d'abord le tamis aux mailles les plus larges (il garde les cailloux), puis un tamis aux mailles plus
    petites (il garde le gravier), le sable passe à travers tous les tamis.
- id: saturation-sucre
  type: texte_court
  difficulte: 2
  enonce: Tu ajoutes du sucre dans un verre d'eau, cuillère par cuillère, et à un moment il reste au fond sans plus se dissoudre.
    Comment appelle-t-on ce phénomène ?
  reponse:
    acceptees:
    - saturation
    - la saturation
    fautes_tolerees: 1
  indices:
    relance: 'Ce n''est pas la dissolution : c''est le moment où l''eau ne peut plus en dissoudre. Quel mot du cours le désigne
      ?'
    methode: Ce phénomène se produit quand le liquide ne peut plus dissoudre de solide supplémentaire.
    etape: Relis la fin de la leçon, l'expérience du sel ajouté cuillère par cuillère. Quel mot nomme ce moment ?
  pieges:
  - si:
      valeur: dissolution
    relance: 'La dissolution, c''est quand le sucre se dissout. Ici, il ne se dissout justement plus : quel est ce mot précis
      ?'
  solution: 'C''est le phénomène de saturation : l''eau ne peut plus dissoudre de sucre supplémentaire.'
- id: association-methodes-usages
  type: association
  difficulte: 2
  enonce: Relie chaque méthode de séparation à la situation dans laquelle on l'utilise.
  reponse:
    gauche:
    - id: a
      texte: Tamisage
    - id: b
      texte: Décantation
    - id: c
      texte: Filtration
    droite:
    - id: x
      texte: Séparer des solides de tailles différentes (cailloux, gravier, sable)
    - id: y
      texte: Laisser les solides se déposer au fond d'un liquide, sans rien ajouter
    - id: z
      texte: Faire passer un mélange à travers un filtre à café ou un tissu
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Chaque méthode correspond à un geste différent : trier avec des mailles, attendre, ou faire passer à travers
      un filtre.'
    methode: Une méthode utilise des tamis de tailles différentes. Une autre ne demande aucun outil, juste du temps. La dernière
      utilise un filtre.
    etape: 'Commence par la méthode qui ne demande aucun outil particulier : quel geste fait-on ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Repense à ce qui différencie tamisage et filtration : l''un trie par taille,
      l''autre fait passer à travers un filtre.'
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord la méthode qui ne demande aucun outil, seulement du temps. Puis distingue les deux autres.
  solution: Le tamisage sépare des solides de tailles différentes. La décantation laisse les solides se déposer au fond sans
    rien ajouter. La filtration fait passer le mélange à travers un filtre.
- id: compter-cuilleres-saturation
  type: nombre
  difficulte: 3
  enonce: Sam verse du sucre, cuillère rase par cuillère rase, dans un verre d'eau, en mélangeant bien. Après 6 cuillères,
    tout le sucre est dissous. Il ajoute encore 3 cuillères rases. À la fin, il reste au fond l'équivalent d'1 cuillère rase
    de sucre qui ne se dissout plus. Combien de cuillères rases de sucre se sont dissoutes en tout ?
  reponse:
    valeur: 8
    forme: entier
  indices:
    relance: Combien de cuillères Sam a-t-il versées en tout ? Et combien ne se sont pas dissoutes ?
    methode: Calcule d'abord le nombre total de cuillères versées, puis enlève celles qui restent au fond.
    etape: En tout, Sam a versé 6 + 3 cuillères rases. Il faut maintenant enlever ce qui reste au fond.
  pieges:
  - si:
      valeur: 9
    relance: 9, c'est tout ce que Sam a versé. Mais une partie n'est pas dissoute. Que dois-tu enlever ?
  - si:
      valeur: 10
    relance: Le sucre resté au fond ne s'est pas dissous. Faut-il l'ajouter ou l'enlever ?
  - si:
      valeur: 6
    relance: Une partie des 3 cuillères ajoutées s'est aussi dissoute avant la saturation. Combien ?
  solution: 'Sam a versé 6 + 3 = 9 cuillères rases en tout. 1 cuillère rase reste au fond sans se dissoudre. Donc 9 − 1 =
    8 cuillères rases se sont dissoutes. Vérification : 8 + 1 = 9.'
- id: expliquer-separation-mel
  type: ouverte
  difficulte: 3
  enonce: Tu as un mélange de sel, de sable et d'eau. Explique en deux ou trois phrases comment séparer le sable de l'eau
    salée, puis comment savoir si le sel est bien dissous.
  criteres:
  - L'élève propose de filtrer (ou décanter) pour séparer le sable, non dissous, de l'eau salée.
  - L'élève explique qu'on ne peut plus récupérer le sel avec un filtre car il est dissous, donc invisible.
  - L'élève relie correctement le vocabulaire (filtration ou décantation, dissolution) à ce qu'il décrit.
  indices:
    relance: 'Le sable ne se dissout pas dans l''eau : comment peux-tu le séparer du liquide ?'
    methode: Utilise un objet qui retient le solide pendant que le liquide passe à travers.
    etape: 'Tu peux commencer ainsi : « Je fais passer le mélange à travers... »'
  solution: 'Je filtre le mélange avec un filtre à café ou un tissu : le sable, non dissous, reste dans le filtre, tandis
    que l''eau salée passe à travers, car le sel est dissous et invisible dans l''eau. Je ne peux pas récupérer le sel avec
    ce filtre : c''est justement la preuve qu''il est bien dissous.'
- id: nblm-en-classe-on-laisse-reposer-de-l-eau-tro-1
  type: choix
  difficulte: 2
  enonce: En classe, on laisse reposer de l'eau trouble mélangée à de la terre jusqu'à ce que la terre se dépose au fond.
