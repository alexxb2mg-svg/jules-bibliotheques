format: 2
notion: cm1-cycle-de-vie-des-animaux
version: 2
etat: verifiee
declencheurs:
- pourquoi la poule pond un œuf
- naître du ventre de la mère
- comment naissent les chatons
- se développer dans les voies génitales
- sortie hors de l'œuf
- fécondation interne ou externe
- animaux qui pondent des œufs
- bébé animal dans le ventre
- œufs de grenouille
prerequis: []
essentiel: 'Le développement d''un animal se fait en plusieurs étapes, toujours dans le même ordre. D''abord la fécondation,
  puis le développement de l''embryon, puis la naissance ou l''éclosion.


  La fécondation est la première étape. C''est le début de la vie du futur petit : après elle, un embryon commence à se former.
  Elle peut être interne (à l''intérieur du corps de la femelle) ou externe (à l''extérieur de son corps, par exemple dans
  l''eau).


  Ensuite, l''embryon se développe. Chez un animal ovipare, il se développe dans un œuf pondu à l''extérieur du corps de la
  mère. Chez un animal vivipare, il se développe dans les voies génitales de la femelle, c''est-à-dire à l''intérieur de son
  ventre, jusqu''à la naissance.


  La fin du développement porte deux noms différents. L''éclosion, c''est la sortie de la larve ou du jeune hors de l''œuf
  : le poussin casse sa coquille. La naissance, c''est la sortie du petit hors du corps de sa mère : la chatte met au monde
  ses chatons.


  Le type de fécondation est lié au mode de reproduction. Un animal vivipare a toujours une fécondation interne. Un animal
  ovipare peut avoir une fécondation interne, comme la poule, ou une fécondation externe, comme la grenouille, dont les œufs
  sont fécondés dans l''eau. Une fécondation externe va donc toujours avec un animal ovipare.


  Quelques exemples. La poule est ovipare. La grenouille est ovipare : de son œuf sort une larve, le têtard. Le chat, le chien
  et la vache sont vivipares.

  '
methode:
- 'Repérer l''étape de fécondation : c''est le début du développement de l''animal.'
- 'Chercher où elle a lieu : dans le corps de la femelle (interne) ou dehors, par exemple dans l''eau (externe).'
- 'Observer où se développe l''embryon : dans un œuf pondu (ovipare) ou dans le corps de la mère (vivipare).'
- 'Repérer l''étape de fin de développement : éclosion (pour un œuf) ou naissance (pour un vivipare).'
- 'Vérifier la cohérence : un vivipare a une fécondation interne ; une fécondation externe va avec un ovipare.'
vocabulaire:
- terme: fécondation
  definition: la première étape du développement, après laquelle un embryon commence à se former
- terme: fécondation interne
  definition: une fécondation qui a lieu à l'intérieur du corps de la femelle
- terme: fécondation externe
  definition: une fécondation qui a lieu à l'extérieur du corps de la femelle, par exemple dans l'eau
- terme: embryon
  definition: le tout début du futur petit, qui se développe dans un œuf ou dans le corps de la mère
- terme: ovipare
  definition: un animal dont l'embryon se développe dans un œuf pondu à l'extérieur du corps de la mère
- terme: vivipare
  definition: un animal dont l'embryon se développe dans les voies génitales de la femelle, jusqu'à la naissance
- terme: éclosion
  definition: la sortie de la larve ou du jeune hors de l'œuf, chez les animaux ovipares
erreurs_frequentes:
- Croire que tous les animaux qui pondent des œufs sont identiques (certains ovipares ont une fécondation interne, d'autres
  externe).
- 'Croire qu''une fécondation interne donne toujours un vivipare : la poule a une fécondation interne et pond pourtant des
  œufs.'
- Confondre éclosion (sortie de l'œuf) et naissance (sortie directe du corps de la mère).
- Oublier l'étape de développement de l'embryon entre la fécondation et l'éclosion ou la naissance.
exemple:
  enonce: Une poule pond un œuf qui éclot plus tard. Est-elle ovipare ou vivipare ? Et sa fécondation est-elle interne ou
    externe ?
  solution: 'La poule est ovipare : son embryon se développe dans un œuf pondu à l''extérieur de son corps, jusqu''à l''éclosion
    du poussin. Sa fécondation est interne : elle a lieu dans le corps de la poule, avant la ponte. C''est l''exemple d''un
    ovipare à fécondation interne.'
exercices:
- id: chat-ovipare-vivipare
  type: choix
  difficulte: 1
  enonce: Un chat met bas des chatons déjà formés, sans œuf visible. Le chat est-il ovipare ou vivipare ?
  reponse:
    options:
    - id: a
      texte: Ovipare
    - id: b
      texte: Vivipare
    bonnes:
    - b
  indices:
    relance: 'Où l''embryon du chaton s''est-il développé : dans un œuf, ou dans le corps de la mère ?'
    methode: Sans œuf pondu à l'extérieur, l'embryon s'est forcément développé à l'intérieur du corps de la mère.
    etape: 'Aucun œuf n''est pondu : élimine l''option ovipare.'
  pieges:
  - si:
      contient:
      - a
    relance: 'Un animal ovipare pond un œuf visible à l''extérieur. Ici, il n''y a pas d''œuf : réfléchis à l''autre mode
      de reproduction.'
  solution: 'Le chat est vivipare : l''embryon se développe dans les voies génitales de la mère jusqu''à la naissance.'
- id: ordre-etapes-developpement
  type: ordre
  difficulte: 1
  enonce: Range dans l'ordre les étapes du développement d'un animal.
  reponse:
    elements:
    - id: fecondation
      texte: Fécondation
    - id: developpement
      texte: Développement de l'embryon
    - id: naissance
      texte: Naissance (ou éclosion)
  indices:
    relance: Que faut-il en premier pour qu'un embryon existe ?
    methode: Le point de départ crée l'embryon, ensuite l'embryon grandit, et à la fin le petit sort.
    etape: Commence par l'étape qui fait exister l'embryon.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Deux étapes voisines sont inversées. Rappelle-toi : l''embryon doit d''abord exister avant de se développer.'
  - si:
      diagnostic: ordre_faux
    relance: La sortie du petit vient forcément en dernier. Demande-toi ce qui doit se passer juste avant.
  solution: Fécondation, puis développement de l'embryon, puis naissance (ou éclosion selon le mode de reproduction).
- id: trier-vivipares
  type: choix
  difficulte: 1
  enonce: Parmi ces animaux, lesquels sont vivipares ? Choisis toutes les bonnes réponses.
  reponse:
    options:
    - id: a
      texte: Le chien
    - id: b
      texte: La poule
    - id: c
      texte: La vache
    - id: d
      texte: La grenouille
    bonnes:
    - a
    - c
  indices:
    relance: Pour chaque animal, demande-toi si la mère pond des œufs ou si les petits sortent de son ventre.
    methode: Un vivipare ne pond pas d'œuf, son petit se développe dans le corps de la mère. Élimine les animaux qui pondent.
    etape: 'Commence par la poule : pond-elle des œufs ? Fais de même pour les trois autres.'
  pieges:
  - si:
      contient:
      - b
    relance: Le poussin sort d'une coquille. Est-ce qu'il s'est développé dans le ventre de la poule ?
  - si:
      contient:
      - d
    relance: Le têtard sort d'un œuf pondu dans l'eau. Est-ce le cas d'un vivipare ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé un vivipare, mais il y en a un autre. Relis chaque animal.
  solution: 'Le chien et la vache sont vivipares : leurs petits se développent dans le corps de la mère. La poule et la grenouille
    pondent des œufs : elles sont ovipares.'
- id: difference-eclosion-naissance
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne la sortie de la larve ou du jeune hors d'un œuf, chez les animaux ovipares ?
  reponse:
    acceptees:
    - eclosion
    fautes_tolerees: 1
  indices:
    relance: 'Pense aux deux modes de reproduction : ce mot concerne uniquement celui où il y a un œuf.'
    methode: C'est le moment où le jeune casse la coquille de l'œuf et en sort.
    etape: Le mot commence par « écl » et a 8 lettres.
  pieges:
  - si:
      valeur: naissance
    relance: La naissance concerne les animaux vivipares, sans œuf. Cherche le mot qui concerne la sortie d'un œuf.
  solution: L'éclosion est la sortie de la larve ou du jeune hors de l'œuf (animaux ovipares), la naissance est la sortie
    directe du corps de la mère (animaux vivipares).
- id: fecondation-mode-reproduction
  type: association
  difficulte: 2
  enonce: Relie chaque mode de reproduction à l'endroit où se développe l'embryon.
  reponse:
    gauche:
    - id: a
      texte: Ovipare
    - id: b
      texte: Vivipare
    droite:
    - id: x
      texte: Dans un œuf pondu à l'extérieur du corps de la mère
    - id: y
      texte: Dans les voies génitales de la femelle, jusqu'à la naissance
    paires:
      a: x
      b: y
  indices:
    relance: Un mode implique un œuf visible à l'extérieur, l'autre non.
    methode: Ovipare contient l'idée d'« œuf » ; vivipare contient l'idée de « vie » directement dans le corps.
    etape: 'Commence par ovipare : où se trouve l''œuf, à l''intérieur ou à l''extérieur du corps de la mère ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une association est fausse. Demande-toi pour chaque mode : y a-t-il un œuf pondu, oui ou non ?'
  - si:
      diagnostic: associations_fausses
    relance: 'Repense à l''origine des mots : ovipare (œuf) et vivipare (vie, développement direct dans le corps).'
  solution: L'ovipare se développe dans un œuf pondu à l'extérieur du corps de la mère. Le vivipare se développe dans les
    voies génitales de la femelle, jusqu'à la naissance.
- id: grenouille-type-fecondation
  type: choix
  difficulte: 2
  enonce: Chez la grenouille, la femelle pond ses œufs dans l'eau et le mâle les féconde aussitôt, dans l'eau. Quel est le
    type de fécondation de la grenouille ?
  reponse:
    options:
    - id: a
      texte: Une fécondation interne
    - id: b
      texte: Une fécondation externe
    bonnes:
    - b
  indices:
    relance: La fécondation se passe-t-elle dans le corps de la femelle, ou en dehors ?
    methode: Relis l'énoncé et cherche où se trouvent les œufs au moment où le mâle les féconde.
    etape: Les œufs sont déjà pondus, dans l'eau. Sont-ils encore dans le corps de la femelle ?
  pieges:
  - si:
      contient:
      - a
    relance: Interne veut dire « dans le corps de la femelle ». Or les œufs sont déjà dans l'eau quand ils sont fécondés.
  solution: 'La fécondation de la grenouille est externe : elle a lieu dans l''eau, hors du corps de la femelle. La grenouille
    est donc ovipare.'
- id: ordre-developpement-poussin
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes du développement d'un poussin.
  reponse:
    elements:
    - id: fecondation-interne
      texte: Fécondation dans le corps de la poule
    - id: ponte
      texte: La poule pond l'œuf
    - id: embryon-dans-oeuf
      texte: L'embryon se développe dans l'œuf couvé
    - id: eclosion-poussin
      texte: Le poussin casse sa coquille et sort
  indices:
    relance: 'Chez la poule, la fécondation est interne : se passe-t-elle avant ou après que l''œuf soit pondu ?'
    methode: 'Suis le trajet du futur poussin : d''abord dans le corps de la poule, puis dans l''œuf dehors, puis hors de
      l''œuf.'
    etape: La première étape a lieu à l'intérieur du corps de la poule.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Deux étapes voisines sont inversées. Une fécondation interne a lieu dans le corps de la mère : l''œuf n''est
      pas encore dehors.'
  - si:
      diagnostic: ordre_faux
    relance: La sortie du poussin hors de la coquille vient forcément en dernier. Reconstruis l'ordre à partir du début.
  solution: 'Fécondation dans le corps de la poule (fécondation interne), puis ponte de l''œuf, puis développement de l''embryon
    dans l''œuf couvé, puis éclosion : le poussin casse sa coquille et sort.'
- id: animal-fecondation-mode
  type: association
  difficulte: 3
  enonce: Relie chaque animal à sa description.
  reponse:
    gauche:
    - id: poule
      texte: La poule
    - id: grenouille
      texte: La grenouille
    - id: chienne
      texte: La chienne
    droite:
    - id: interne-ovipare
      texte: Fécondation interne, puis ponte d'un œuf
    - id: externe-ovipare
      texte: Fécondation externe dans l'eau, puis développement dans l'œuf
    - id: interne-vivipare
      texte: Fécondation interne, puis développement dans le corps de la mère
    paires:
      poule: interne-ovipare
      grenouille: externe-ovipare
      chienne: interne-vivipare
  indices:
    relance: Pour chaque animal, pose deux questions. Où a lieu la fécondation ? Y a-t-il un œuf pondu ?
    methode: 'Rappelle-toi : un vivipare a toujours une fécondation interne, et un ovipare peut avoir l''une ou l''autre.'
    etape: 'Commence par l''animal qui ne pond pas d''œuf : ses petits naissent directement du ventre de la mère.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie les deux animaux qui pondent des œufs, et où leurs œufs sont fécondés.
  - si:
      diagnostic: associations_fausses
    relance: Commence par trouver l'animal dont les œufs sont fécondés dans l'eau, puis l'animal qui ne pond pas.
  solution: 'La poule : fécondation interne, puis ponte d''un œuf (ovipare). La grenouille : fécondation externe dans l''eau,
    développement dans l''œuf (ovipare). La chienne : fécondation interne, puis développement des chiots dans son corps (vivipare).'
- id: expliquer-fecondation-mode
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases pourquoi on met en relation le type de fécondation (interne ou externe) avec le
    mode de reproduction ovipare ou vivipare d'un animal. Donne un exemple d'animal.
  criteres:
  - L'élève explique que la fécondation est la première étape, avant le développement de l'embryon.
  - L'élève relie un type de fécondation (interne ou externe) au mode de reproduction (ovipare ou vivipare), avec un exemple
    d'animal juste.
  - L'élève utilise correctement le vocabulaire (fécondation, ovipare, vivipare) sans les confondre.
  indices:
    relance: Pense à ce qui se passe avant même que l'embryon commence à se développer.
    methode: La fécondation peut se faire dans le corps de la mère (interne) ou à l'extérieur (externe), et ce choix est lié
      à la suite du développement de l'animal.
    etape: 'Tu peux commencer ainsi : « La fécondation est la première étape, elle peut être interne ou externe... »'
  solution: 'La fécondation est la première étape du développement d''un animal : elle peut être interne (à l''intérieur du
    corps de la mère) ou externe (à l''extérieur). Ce type de fécondation est lié au mode de reproduction : un animal vivipare
    a toujours une fécondation interne suivie d''un développement dans le corps de la mère (le chat), tandis qu''un animal
    ovipare peut avoir une fécondation interne (la poule) ou externe (la grenouille), mais l''embryon se développe ensuite
    dans un œuf pondu à l''extérieur.'
