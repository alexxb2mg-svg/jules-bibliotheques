    relance: 'Erreur typique : négliger sa propre observation au profit de l''outil numérique.'
  - si:
      contient:
      - o4
    relance: Faux, une observation incomplète risque de mener à une mauvaise identification.
  solution: Observer attentivement l'espèce avant de la nommer ; Suivre la clé de détermination question par question. C'est
    juste, l'observation attentive des critères est la toute première étape.
