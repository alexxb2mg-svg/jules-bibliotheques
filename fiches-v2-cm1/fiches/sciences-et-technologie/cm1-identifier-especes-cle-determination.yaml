format: 2
notion: cm1-identifier-especes-cle-determination
version: 3
etat: verifiee
declencheurs:
- reconnaître une plante
- quel est le nom de cet animal
- questions les unes après les autres
- vérifier avec une application
- observer avant de nommer
- proposer plusieurs noms possibles
- clé de détermination
- c'est quoi cet insecte
- reconnaître un arbre avec ses feuilles
- application qui reconnaît les plantes
prerequis:
- cm1-espece-et-classification-emboitee
essentiel: 'Identifier une espèce, c''est retrouver son nom à partir de ce que l''on observe. Pour cela, on utilise une clé
  de détermination.


  Une clé de détermination pose des questions successives sur l''aspect de l''être vivant. À chaque question, il n''y a que
  deux choix possibles, par exemple : « Il a six pattes ? » ou « Il a huit pattes ? ». Selon la réponse, la clé envoie vers
  une nouvelle question, et ainsi de suite, jusqu''au nom de l''espèce.


  Pour bien utiliser la clé, il faut d''abord observer attentivement : la forme, la couleur, la taille, le nombre de pattes
  ou d''ailes, la forme des feuilles. Une loupe aide beaucoup. On ne saute aucune question : on les suit dans l''ordre.


  On peut ensuite confronter son résultat avec une application numérique qui reconnaît les espèces sur une photo, grâce à
  l''intelligence artificielle. Cette application ne donne pas une réponse sûre : elle propose plusieurs noms possibles, classés
  du plus probable au moins probable. C''est à nous de vérifier si sa proposition correspond à ce que l''on a observé.


  L''application sert à vérifier, pas à remplacer. Le vrai travail, celui qu''on apprend, c''est d''observer, de décrire et
  d''identifier soi-même.


  Attention : identifier (retrouver le nom avec une clé) n''est pas classer (ranger plusieurs espèces dans des groupes emboîtés
  selon leurs attributs).

  '
methode:
- 'Observer attentivement l''espèce à identifier : forme, couleur, taille, nombre de pattes, forme des feuilles.'
- Lire la première question de la clé et choisir la réponse qui correspond à l'observation.
- Suivre la clé question par question, sans en sauter, jusqu'au nom de l'espèce.
- Si possible, confronter le résultat avec une application numérique d'identification.
- Comparer les deux résultats et vérifier que le nom proposé correspond bien à ce que l'on a observé.
vocabulaire:
- terme: clé de détermination
  definition: un outil qui pose des questions successives sur l'aspect d'une espèce pour arriver à son nom
- terme: identification
  definition: le fait de retrouver le nom d'une espèce déjà connue, à partir de son aspect observé
- terme: critère
  definition: un détail observable utilisé par la clé pour choisir entre deux réponses (nombre de pattes, forme des feuilles)
- terme: application d'identification
  definition: un outil numérique qui propose, à partir d'une photo, plusieurs noms d'espèces classés par probabilité
- terme: probable
  definition: qui a de bonnes chances d'être vrai, sans être certain
erreurs_frequentes:
- Se fier uniquement à une application numérique sans avoir observé et décrit l'espèce soi-même.
- Confondre identification (retrouver le nom avec une clé) et classification (regrouper des espèces par attributs).
- Croire qu'une application numérique donne toujours une réponse unique et certaine.
- Sauter une question de la clé ou répondre sans avoir bien observé, ce qui mène à un mauvais nom.
- Prendre automatiquement le premier nom proposé par l'application sans le comparer à son observation.
exemple:
  enonce: Avec une clé de détermination, comment trouver le nom d'une petite bête trouvée sous une pierre, qui a 8 pattes
    ?
  solution: 'On observe d''abord la petite bête à la loupe et on compte ses pattes : 8. On lit la première question de la
    clé, par exemple « 6 pattes ou 8 pattes ? », et on suit le chemin « 8 pattes ». On répond ainsi à chaque question jusqu''au
    nom, par exemple « araignée ». On peut ensuite vérifier avec une application, en gardant un regard critique sur ses propositions.'
exercices:
- id: outil-questions-successives
  type: texte_court
  difficulte: 1
  enonce: Quel outil utilise-t-on en priorité pour identifier une espèce à l'aide de questions successives sur son aspect
    ?
  reponse:
    acceptees:
    - cle de determination
  indices:
    relance: C'est un outil sur papier, utilisé avant toute application numérique.
    methode: Cet outil pose une question après l'autre, chacune sur l'aspect de l'espèce, jusqu'à trouver son nom.
    etape: Son nom contient un mot qui désigne aussi l'objet qui ouvre une porte.
  pieges:
  - si:
      valeur: application numerique
    relance: L'application numérique est un outil de confirmation, mais l'outil utilisé en priorité, avec des questions successives,
      a un autre nom.
  solution: Une clé de détermination.
- id: suivre-cle-petite-bete
  type: texte_court
  difficulte: 2
  enonce: 'Voici une petite clé de détermination. Question 1 : a-t-il 6 pattes ? Si oui, va à la question 2. Si non (8 pattes),
    c''est une araignée. Question 2 : a-t-il des ailes couvertes de petites écailles colorées ? Si oui, c''est un papillon.
    Si non, c''est une fourmi. Tu observes une petite bête à 6 pattes, sans ailes. Quel est son nom ?'
  reponse:
    acceptees:
    - fourmi
    - une fourmi
    fautes_tolerees: 1
  indices:
    relance: Commence par la question 1. Ta petite bête a 6 pattes, où dois-tu aller ensuite ?
    methode: Réponds à chaque question avec ton observation, puis suis le chemin indiqué jusqu'à un nom.
    etape: À la question 2, ta petite bête n'a pas d'ailes. Lis ce que dit la clé pour la réponse « non ».
  pieges:
  - si:
      valeur: araignee
    relance: L'araignée a 8 pattes. Ta petite bête en a 6, donc à la question 1 tu dois répondre oui.
  - si:
      valeur: papillon
    relance: Le papillon a des ailes. Ta petite bête n'en a pas, donc à la question 2 tu dois répondre non.
  solution: 'Question 1 : 6 pattes, donc oui, on va à la question 2. Question 2 : pas d''ailes, donc non. C''est une fourmi.'
- id: pourquoi-pas-reponse-unique
  type: choix
  difficulte: 1
  enonce: Une application numérique propose plusieurs noms possibles pour une plante observée, classés par probabilité. Pourquoi
    ne donne-t-elle pas une seule réponse certaine ?
  reponse:
    options:
    - id: a
      texte: Parce que l'identification à partir d'une photo reste incertaine, l'application propose des hypothèses classées
        par probabilité
    - id: b
      texte: Parce que l'application ne fonctionne pas correctement
    - id: c
      texte: Parce qu'il n'existe qu'une seule plante possible dans chaque cas
    bonnes:
    - a
  indices:
    relance: Une photo montre-t-elle toujours tous les détails d'une plante ?
    methode: Ces outils reconnaissent une image mais ne peuvent jamais être sûrs à 100 %, donc ils proposent plusieurs hypothèses
      classées.
    etape: Élimine les réponses qui inventent un dysfonctionnement ou une situation irréaliste.
  pieges:
  - si:
      contient:
      - b
    relance: 'L''application fonctionne normalement : ce n''est pas un problème technique. Pense plutôt à la nature de la
      reconnaissance par photo.'
  - si:
      contient:
      - c
    relance: 'Il existe souvent plusieurs espèces qui se ressemblent : ce n''est pas parce qu''une seule plante est possible.'
  solution: Les outils d'identification ne donnent pas une réponse unique mais proposent des hypothèses classées selon un
    degré de probabilité, car l'identification à partir d'une photo reste incertaine.
- id: identifier-ou-classer
  type: association
  difficulte: 2
  enonce: Relie chaque activité au bon mot.
  reponse:
    gauche:
    - id: a
      texte: Retrouver le nom d'une araignée avec des questions successives
    - id: b
      texte: Ranger le chat, le lapin et le lézard dans des boîtes emboîtées
    droite:
    - id: x
      texte: Identifier
    - id: y
      texte: Classer
    paires:
      a: x
      b: y
  indices:
    relance: L'une des activités cherche un nom, l'autre range plusieurs espèces en groupes.
    methode: Identifier, c'est retrouver le nom d'une espèce. Classer, c'est regrouper des espèces selon leurs attributs.
    etape: Commence par l'activité qui utilise des questions successives, comme une clé de détermination.
  pieges:
  - si:
      diagnostic: associations_fausses
    relance: Les deux mots sont inversés. Lequel des deux sert à trouver un nom ?
  solution: Retrouver le nom d'une araignée avec des questions, c'est identifier. Ranger plusieurs espèces dans des boîtes
    emboîtées, c'est classer.
- id: observer-avant-application
  type: choix
  difficulte: 2
  enonce: Pourquoi l'élève doit-il d'abord observer et décrire l'espèce avant d'utiliser une application numérique ?
  reponse:
    options:
    - id: a
      texte: Parce que l'application ne doit pas remplacer le travail d'observation, de description et d'identification par
        l'élève, qui sont des objectifs d'apprentissage
    - id: b
      texte: Parce que les applications sont interdites à l'école
    - id: c
      texte: Parce qu'observer prend plus de temps que d'utiliser l'application
    bonnes:
    - a
  indices:
    relance: Que ne doit pas remplacer l'application, selon le texte officiel ?
    methode: L'observation et la description par l'élève sont des compétences à apprendre, l'application ne fait que vérifier
      ensuite.
    etape: Élimine les réponses qui parlent d'interdiction ou de durée, sans lien avec l'apprentissage.
  pieges:
  - si:
      contient:
      - b
    relance: Les applications ne sont pas interdites, elles servent au contraire à vérifier une identification. Pense plutôt
      à ce qui doit être appris par l'élève d'abord.
  - si:
      contient:
      - c
    relance: La durée n'est pas la vraie raison. Pense à ce que l'élève doit apprendre à faire lui-même.
  solution: Parce que l'utilisation d'une application ne doit pas se substituer au travail d'observation, de description et
    d'identification par les élèves, qui sont des objectifs d'apprentissage.
- id: application-propositions-critique
  type: choix
  difficulte: 3
  enonce: 'Tu as observé une plante à fleurs jaunes et feuilles très découpées. L''application propose : 1. bouton d''or (fleurs
    jaunes, feuilles découpées), 2. pissenlit (fleurs jaunes, feuilles allongées dentées), 3. coquelicot (fleurs rouges).
    Que fais-tu ?'
  reponse:
    options:
    - id: a
      texte: Je compare chaque proposition avec mes observations et je garde celle qui correspond, en vérifiant avec la clé
    - id: b
      texte: Je choisis la troisième proposition, au hasard
    - id: c
      texte: J'arrête d'observer, l'application a forcément raison
    bonnes:
    - a
  indices:
    relance: L'application donne des hypothèses. Qui doit décider laquelle correspond à la plante observée ?
    methode: Compare la couleur des fleurs et la forme des feuilles de chaque proposition avec ce que tu as vu toi-même.
    etape: Élimine le choix au hasard et l'idée que l'application est toujours sûre.
  pieges:
  - si:
      contient:
      - b
    relance: Choisir au hasard ne sert à rien. Et le coquelicot a des fleurs rouges, pas jaunes.
  - si:
      contient:
      - c
    relance: L'application propose des noms probables, pas certains. C'est ton observation qui permet de vérifier.
  solution: Je compare chaque proposition avec mes observations. Le bouton d'or a des fleurs jaunes et des feuilles découpées,
    comme ma plante ; je le confirme avec la clé de détermination.
- id: etapes-identification-arbre
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour identifier un arbre de la cour de l'école.
  reponse:
    elements:
    - id: observer
      texte: Observer les feuilles, l'écorce, la forme de l'arbre
    - id: suivre-cle
      texte: Suivre la clé de détermination question par question
    - id: trouver-nom
      texte: Trouver le nom de l'espèce grâce à la clé
    - id: verifier
      texte: Vérifier le résultat avec une application numérique
  indices:
    relance: Que dois-tu faire en tout premier, avant même d'ouvrir la clé de détermination ?
    methode: On observe d'abord l'espèce, puis on suit la clé étape par étape jusqu'au nom, et on vérifie ensuite avec un
      outil numérique.
    etape: La première étape est d'observer les feuilles, l'écorce, la forme de l'arbre.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Deux étapes voisines sont inversées. Rappelle-toi : on observe d''abord, avant de suivre la clé de détermination.'
  - si:
      diagnostic: ordre_faux
    relance: Repère la toute première étape (observer) et la toute dernière (vérifier avec l'application), puis range les
      deux autres entre elles.
  solution: On observe les feuilles, l'écorce, la forme de l'arbre, puis on suit la clé de détermination question par question,
    puis on trouve le nom de l'espèce, puis on vérifie éventuellement avec une application numérique.
- id: expliquer-demarche-identification
  type: ouverte
  difficulte: 3
  enonce: Un camarade veut identifier un insecte trouvé dans le jardin en utilisant uniquement une application numérique,
    sans l'observer d'abord. Explique en deux ou trois phrases pourquoi ce n'est pas la bonne démarche, et ce qu'il devrait
    faire à la place.
  criteres:
  - L'élève explique que l'application ne doit pas remplacer l'observation et la description par l'élève lui-même.
  - L'élève propose d'observer d'abord l'insecte, puis d'utiliser une clé de détermination.
  - L'élève mentionne que l'application peut ensuite servir à vérifier le résultat, sans donner une certitude absolue.
  indices:
    relance: Que doit faire l'élève avant même de sortir son téléphone ?
    methode: Il doit observer et décrire l'insecte lui-même, puis suivre une clé de détermination, et seulement ensuite vérifier
      avec l'application.
    etape: 'Tu peux commencer ainsi : « Il devrait d''abord observer l''insecte... »'
  solution: Il devrait d'abord observer l'insecte attentivement (forme, couleur, taille) et suivre une clé de détermination
    question par question, car c'est cette démarche d'observation et d'identification qu'il doit apprendre. L'application
    numérique peut ensuite l'aider à vérifier son résultat, mais elle ne donne pas une réponse certaine et ne doit pas remplacer
    son propre travail.
- id: nblm-pour-reconnaitre-une-plante-dans-la-cour-1
  type: choix
  difficulte: 2
  enonce: Pour reconnaître une plante dans la cour, que fait une clé de détermination ?
  reponse:
    options:
    - id: o1
      texte: Elle pose des questions les unes après les autres sur l'aspect de la plante.
    - id: o2
      texte: Elle regroupe les espèces selon leurs attributs communs.
    - id: o3
      texte: Elle donne immédiatement le nom sans poser de questions.
    - id: o4
      texte: Elle mesure automatiquement la taille de la plante.
    bonnes:
    - o1
  indices:
    relance: Pense à la manière dont cet outil te guide étape par étape grâce à l'aspect du végétal.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : ceci est la définition de la classification en groupes emboîtés, pas de l''identification.'
  - si:
      contient:
      - o3
    relance: Faux, une clé nécessite de répondre à une série de questions étape par étape.
  - si:
      contient:
      - o4
    relance: Faux, la clé ne mesure rien automatiquement, c'est un outil guidant l'observation.
  solution: Elle pose des questions les unes après les autres sur l'aspect de la plante. C'est exact, la clé de détermination
    fonctionne en posant des questions successives sur l'aspect observé.
- id: nblm-que-doit-faire-un-eleve-avant-d-essayer-2
  type: choix
  difficulte: 2
  enonce: Que doit faire un élève avant d'essayer de trouver quel est le nom de cet animal ?
  reponse:
    options:
    - id: o1
      texte: L'observer attentivement pour repérer sa forme, sa couleur et ses détails.
    - id: o2
      texte: Prendre immédiatement une photo avec une application sans le regarder.
    - id: o3
      texte: Deviner le nom au hasard parmi une liste d'animaux.
    - id: o4
      texte: Le classer dans un groupe emboîté avant de le regarder.
    bonnes:
    - o1
  indices:
    relance: Pense aux premières étapes indispensables de la méthode scientifique avec tes yeux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : se fier uniquement à une application numérique sans observer l''animal soi-même.'
  - si:
      contient:
      - o3
    relance: Faux, l'identification repose sur des critères d'observation précis et non sur le hasard.
  - si:
      contient:
      - o4
    relance: Faux, il faut toujours observer l'animal avant toute démarche scientifique.
  solution: L'observer attentivement pour repérer sa forme, sa couleur et ses détails. C'est juste, l'observation et la description
    personnelles sont l'étape indispensable avant toute identification.
- id: nblm-quel-est-le-role-principal-d-une-applica-3
  type: choix
  difficulte: 2
  enonce: Quel est le rôle principal d'une application numérique basée sur l'intelligence artificielle ?
  reponse:
    options:
    - id: o1
      texte: Vérifier ou valider une identification faite par l'élève.
    - id: o2
      texte: Remplacer complètement le travail d'observation de l'élève.
    - id: o3
      texte: Garantir une réponse unique et certaine à 100 % à chaque fois.
    - id: o4
      texte: Créer de nouvelles espèces animales ou végétales.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la différence entre un outil d'aide à la confirmation et une certitude absolue.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : croire que la technologie remplace le travail d''observation et de réflexion.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : croire qu''une application numérique donne toujours une certitude absolue.'
  - si:
      contient:
      - o4
    relance: Faux, l'application sert uniquement à identifier des êtres vivants existants.
  solution: Vérifier ou valider une identification faite par l'élève. C'est exact, ces outils numériques permettent de vérifier
    ou valider un résultat d'observation.
- id: nblm-pourquoi-une-application-d-identificatio-4
  type: choix
  difficulte: 2
  enonce: Pourquoi une application d'identification peut-elle proposer plusieurs noms possibles pour une espèce ?
  reponse:
    options:
    - id: o1
      texte: Parce qu'elle indique les identifications les plus probables plutôt qu'une réponse unique.
    - id: o2
      texte: Parce qu'un même animal appartient à plusieurs espèces en même temps.
    - id: o3
      texte: Parce que l'application ne fonctionne jamais correctement.
    - id: o4
      texte: Parce qu'elle confond la clé de détermination avec la classification.
    bonnes:
    - o1
  indices:
    relance: Pense au fonctionnement de l'intelligence artificielle qui évalue les ressemblances.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, chaque individu n'appartient qu'à une seule espèce.
  - si:
      contient:
      - o3
    relance: Faux, la proposition de plusieurs choix probables est le fonctionnement normal de l'IA.
  - si:
      contient:
      - o4
    relance: Faux, les réponses multiples s'expliquent par le mode de calcul probabiliste de l'outil.
  solution: Parce qu'elle indique les identifications les plus probables plutôt qu'une réponse unique. C'est juste, l'IA fonctionne
    par calcul de probabilités et propose les choix les plus proches.
- id: nblm-quelle-est-la-difference-entre-l-identif-5
  type: choix
  difficulte: 2
  enonce: Quelle est la différence entre l'identification et la classification d'un être vivant ?
  reponse:
    options:
    - id: o1
      texte: L'identification retrouve le nom d'une espèce, alors que la classification regroupe les espèces par attributs.
    - id: o2
      texte: L'identification utilise un ordinateur et la classification utilise un livre.
    - id: o3
      texte: Il n'y en a aucune, ce sont deux mots pour dire exactement la même chose.
    - id: o4
      texte: La classification concerne seulement les animaux et l'identification seulement les plantes.
    bonnes:
    - o1
  indices:
    relance: 'Réfléchis à ce que l''on cherche à trouver : un nom individuel ou des groupes partagés.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, les deux démarches peuvent utiliser des supports papier ou numériques.
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre retrouver un nom précis et organiser en groupes emboîtés.'
  - si:
      contient:
      - o4
    relance: Faux, l'identification et la classification s'appliquent à tous les êtres vivants.
  solution: L'identification retrouve le nom d'une espèce, alors que la classification regroupe les espèces par attributs.
    C'est exact, retrouver un nom avec une clé est distinct de regrouper par attributs partagés.
- id: nblm-quelles-sont-les-deux-etapes-indispensab-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux étapes indispensables menées par l'élève pour identifier un être vivant ? (plusieurs réponses
