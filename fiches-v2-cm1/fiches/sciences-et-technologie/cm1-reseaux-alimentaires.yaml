format: 2
notion: cm1-reseaux-alimentaires
version: 3
etat: verifiee
declencheurs:
- qui mange qui
- flèches de nourriture
- chenille et oiseau
- besoins des plantes
- surpêche poissons
- feuille mangée
- manger pour grandir
- plante dans le placard
prerequis:
- cm1-definir-un-ecosysteme
essentiel: 'Pour grandir, un animal doit manger. Sa nourriture vient d''autres êtres vivants : des plantes ou d''autres animaux.
  Grâce à cette nourriture, l''animal produit sa propre matière : il grandit et grossit. Plus il mange, plus il peut produire
  de matière. Un veau grandit en buvant du lait puis en mangeant de l''herbe.


  Les plantes ne mangent pas d''autres êtres vivants. Elles fabriquent leur propre matière, appelée matière organique, mais
  elles ont des besoins, comme l''eau et la lumière.


  On peut trouver ces besoins par une expérience. On formule d''abord une hypothèse, par exemple « la plante a besoin de lumière
  pour pousser ». On réalise l''expérience : deux plantes pareilles, arrosées pareil, l''une à la lumière, l''autre dans un
  placard. Une seule chose change entre les deux. On observe les résultats, puis on dit si l''hypothèse est validée ou non.


  Un réseau alimentaire montre qui mange qui dans un milieu. On le dessine avec des flèches qui vont de l''être vivant mangé
  vers celui qui le mange. Par exemple, feuille → chenille → oiseau.


  Les actions humaines peuvent changer le nombre d''individus d''une espèce : la surpêche fait diminuer les poissons, l''utilisation
  de pesticides fait disparaître des insectes. Cela a des conséquences sur tout le réseau. Les animaux qui mangeaient cette
  espèce manquent de nourriture.

  '
methode:
- 'Pour tracer une flèche du réseau : partir de l''être vivant mangé, arriver vers celui qui le mange.'
- Vérifier chaque flèche en lisant « est mangé par » à sa place.
- 'Pour une expérience sur les besoins des plantes : formuler une hypothèse, la tester, puis regarder les résultats.'
- Dans l'expérience, ne changer qu'une seule chose entre les deux plantes (par exemple la lumière).
- Pour envisager une conséquence sur le réseau, se demander qui mangeait l'espèce dont le nombre a changé.
vocabulaire:
- terme: réseau alimentaire
  definition: un schéma qui montre, avec des flèches, qui mange qui dans un milieu
- terme: matière organique
  definition: la matière qui forme les êtres vivants, fabriquée par les plantes et récupérée par les animaux en mangeant
- terme: hypothèse
  definition: une idée que l'on propose avant une expérience et que l'on va vérifier
- terme: proie
  definition: un animal qui est mangé par un autre animal
- terme: prédateur
  definition: un animal qui en mange un autre pour se nourrir
- terme: surpêche
  definition: le fait de pêcher trop de poissons, plus qu'il n'en naît
erreurs_frequentes:
- Tracer la flèche du réseau alimentaire dans le mauvais sens (du mangeur vers le mangé au lieu de l'inverse).
- Oublier que les plantes ont elles aussi des besoins qu'on peut tester par une expérience.
- Ne pas relier une baisse du nombre d'individus d'une espèce aux espèces qui en dépendaient pour se nourrir.
- Changer plusieurs choses à la fois entre les deux plantes de l'expérience, et ne plus savoir laquelle a eu un effet.
- Croire qu'un animal peut grandir sans manger, alors que sa matière vient de sa nourriture.
exemple:
  enonce: Une chenille mange des feuilles, un oiseau mange la chenille. Comment représenter ce réseau alimentaire ?
  solution: 'On dessine une flèche de la feuille vers la chenille (la feuille est mangée par la chenille), puis une flèche
    de la chenille vers l''oiseau (la chenille est mangée par l''oiseau) : feuille → chenille → oiseau. Les flèches vont du
    mangé vers le mangeur.'
exercices:
- id: sens-fleche-reseau
  type: choix
  difficulte: 1
  enonce: Dans un réseau alimentaire, le lapin mange de l'herbe. On trace une flèche entre l'herbe et le lapin. Dans quel
    sens va-t-elle ?
  reponse:
    options:
    - id: a
      texte: Du mangé vers le mangeur
    - id: b
      texte: Du mangeur vers le mangé
    - id: c
      texte: Cela dépend de la taille des animaux
    bonnes:
    - a
  indices:
    relance: Pense à qui « donne » sa matière à qui dans cette relation.
    methode: La flèche se lit « est mangé par ». Essaie les deux sens avec l'herbe et le lapin.
    etape: 'Dans l''exemple de la chenille : la flèche part de la feuille et arrive à la chenille.'
  pieges:
  - si:
      contient:
      - b
    relance: C'est l'inverse ! La flèche part de l'être vivant mangé, pas de celui qui mange.
  - si:
      contient:
      - c
    relance: La taille des animaux ne change pas le sens de la flèche, seule la relation qui mange qui compte.
  solution: 'La flèche va du mangé vers le mangeur : de l''herbe vers le lapin.'
- id: etapes-experience-plante
  type: ordre
  difficulte: 1
  enonce: Range dans l'ordre les étapes d'une expérience pour savoir si une plante a besoin de lumière.
  reponse:
    elements:
    - id: hypothese
      texte: Formuler une hypothèse
    - id: experience
      texte: Réaliser l'expérience
    - id: resultats
      texte: Exploiter les résultats
    - id: conclusion
      texte: Valider ou non l'hypothèse
  indices:
    relance: Que doit-on imaginer avant même de commencer à manipuler ?
    methode: On imagine d'abord une hypothèse, puis on teste, puis on regarde ce qui s'est passé, puis on conclut.
    etape: La toute première étape est de formuler une hypothèse, avant de toucher aux plantes.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux étapes voisines sont inversées. Laquelle doit venir en premier entre elles deux ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la première étape (hypothèse) et la dernière (conclusion), puis place les deux du milieu.
  solution: On formule d'abord une hypothèse, puis on réalise l'expérience, puis on exploite les résultats, puis on valide
    ou non l'hypothèse.
- id: matiere-animal-nourriture
  type: texte_court
  difficulte: 1
  enonce: 'Un veau grandit en buvant du lait. D''où vient la matière qui lui permet de grandir : de sa nourriture, ou de rien
    du tout ? (réponds en un mot : nourriture ou rien)'
  reponse:
    acceptees:
    - nourriture
    fautes_tolerees: 1
  indices:
    relance: Un animal peut-il grandir sans manger ?
    methode: Un animal grandit en consommant quelque chose qui vient d'autres êtres vivants.
    etape: Le mot à écrire est celui qui désigne ce que mange le veau.
  pieges:
  - si:
      valeur: lait
    relance: Le lait est un exemple précis, mais la réponse générale est un mot plus large qui désigne tout ce qu'un être
      vivant consomme.
  solution: 'La matière vient de sa nourriture : un animal produit de la matière (il grandit) grâce à ce qu''il mange.'
- id: ordre-chaine-foret
  type: ordre
  difficulte: 2
  enonce: Dans une forêt, le renard mange le mulot, et le mulot mange des glands. Range ces êtres vivants dans l'ordre des
    flèches du réseau alimentaire, en commençant par celui qui est mangé en premier.
  reponse:
    elements:
    - id: gland
      texte: Le gland
    - id: mulot
      texte: Le mulot
    - id: renard
      texte: Le renard
  indices:
    relance: Lequel de ces trois êtres vivants ne mange aucun des deux autres ?
    methode: Les flèches vont du mangé vers le mangeur. On commence donc par celui qui est mangé et ne mange personne.
    etape: Le gland est mangé par le mulot. Qui mange le mulot ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Deux êtres vivants voisins sont inversés. Relis qui mange qui dans l'énoncé.
  - si:
      diagnostic: ordre_faux
    relance: As-tu commencé par le mangeur au lieu du mangé ? La flèche part de ce qui est mangé.
  solution: 'Gland → mulot → renard : le gland est mangé par le mulot, qui est mangé par le renard.'
- id: besoin-plante-lumiere
  type: choix
  difficulte: 2
  enonce: Deux plantes identiques sont arrosées pareil, mais l'une reste à la lumière et l'autre dans un placard fermé. Après
    une semaine, laquelle a le mieux poussé ?
  reponse:
    options:
    - id: a
      texte: Celle qui est restée à la lumière
    - id: b
      texte: Celle qui est restée dans le placard
    - id: c
      texte: Les deux ont poussé pareil
    bonnes:
    - a
  indices:
    relance: La lumière est-elle un besoin des plantes pour produire de la matière organique ?
    methode: Une plante qui manque de lumière a plus de mal à produire de la matière organique.
    etape: Élimine l'option qui dit que les deux ont poussé pareil. Une plante dans le noir peut-elle produire sa matière
      aussi bien ?
  pieges:
  - si:
      contient:
      - b
    relance: Sans lumière, une plante a plus de mal à produire de la matière organique, elle pousse donc moins bien.
  - si:
      contient:
      - c
    relance: La lumière est un besoin des plantes. Une plante privée de lumière pousse-t-elle aussi bien qu'une autre ?
  solution: 'C''est celle qui est restée à la lumière : la lumière est un besoin des plantes pour produire de la matière organique.'
- id: experience-bien-construite
  type: choix
  difficulte: 2
  enonce: Tom veut savoir si une plante a besoin d'eau. Quelle expérience est bien construite ?
  reponse:
    options:
    - id: a
      texte: Deux plantes à la lumière, l'une arrosée, l'autre non
    - id: b
      texte: Une plante arrosée à la lumière, une plante non arrosée dans le placard
    - id: c
      texte: Une seule plante, arrosée tous les jours
    bonnes:
    - a
  indices:
    relance: Combien de choses doivent changer entre les deux plantes ?
    methode: Pour tester l'eau, seule l'eau doit être différente entre les deux plantes. Tout le reste doit être pareil.
    etape: Cherche l'expérience où les deux plantes ont la même lumière.
  pieges:
  - si:
      contient:
      - b
    relance: Ici, l'eau et la lumière changent toutes les deux. Si une plante pousse mal, on ne saura pas pourquoi.
  - si:
      contient:
      - c
    relance: Avec une seule plante, on ne peut rien comparer. Il faut une plante arrosée et une plante non arrosée.
  solution: Il faut deux plantes placées à la lumière, l'une arrosée et l'autre non. Seule l'eau change, donc on saura si
    c'est elle qui a un effet.
- id: chenilles-et-mesanges
  type: nombre
  difficulte: 3
  enonce: Dans un jardin, un couple de mésanges trouvait 40 chenilles par jour pour nourrir ses petits. Après l'utilisation
    d'un pesticide, il n'en trouve plus que 15 par jour. Combien de chenilles par jour manquent maintenant aux mésanges ?
  reponse:
    valeur: 25
    forme: entier
  indices:
    relance: Combien de chenilles les mésanges trouvaient-elles avant ? Et après ?
    methode: Calcule la différence entre le nombre de chenilles d'avant et celui d'après.
    etape: Pose la soustraction 40 − 15.
  pieges:
  - si:
      valeur: 55
    relance: Tu as additionné les deux nombres. On cherche combien il en manque, c'est une différence.
  - si:
      valeur: 15
    relance: C'est le nombre de chenilles qu'elles trouvent encore. On demande combien il en manque.
  solution: '40 − 15 = 25. Il manque 25 chenilles par jour : les petits des mésanges risquent de manquer de nourriture.'
- id: consequence-surpeche
  type: ouverte
  difficulte: 2
  enonce: Dans un réseau alimentaire marin, la surpêche fait disparaître beaucoup de sardines. Explique en deux ou trois phrases
    ce qui peut se passer pour les animaux qui mangeaient des sardines.
  criteres:
  - L'élève relie la disparition des sardines au manque de nourriture pour les prédateurs de sardines.
  - L'élève comprend que cela peut perturber tout le réseau alimentaire.
  indices:
    relance: Qui mangeait les sardines avant la surpêche ?
    methode: Si les sardines disparaissent, leurs prédateurs n'ont plus assez de nourriture.
    etape: Commence ainsi « Les animaux qui mangeaient des sardines... », puis explique la conséquence.
  solution: Les animaux qui mangeaient des sardines risquent de manquer de nourriture, car il y a moins de sardines à manger.
    Cela peut perturber tout le réseau alimentaire, jusqu'à d'autres espèces plus éloignées.
- id: nblm-dans-un-reseau-alimentaire-que-signifie-1
  type: choix
  difficulte: 2
  enonce: Dans un réseau alimentaire, que signifie la flèche tracée entre la feuille mangée et la chenille ?
  reponse:
    options:
    - id: o1
      texte: Elle va de la feuille vers la chenille et signifie « est mangé par ».
    - id: o2
      texte: Elle va de la chenille vers la feuille et signifie « mange ».
    - id: o3
      texte: Elle montre que la chenille donne de la nourriture à la feuille.
    - id: o4
      texte: Elle indique que la feuille et la chenille se mangent entre elles.
    bonnes:
    - o1
  indices:
    relance: Pense au sens de circulation de la nourriture, du vivant consommé vers celui qui le consomme.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : la flèche ne va pas du mangeur vers le mangé, mais du mangé vers le mangeur.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la feuille est mangée par la chenille, elle ne reçoit pas de nourriture de sa part.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : la feuille est un végétal qui ne mange pas d''animaux.'
  solution: 'Elle va de la feuille vers la chenille et signifie « est mangé par ». C''est exact : la flèche part toujours
    de l''être vivant mangé (la feuille) vers celui qui le mange (la chenille).'
- id: nblm-si-une-chenille-mange-une-feuille-et-qu-2
  type: choix
  difficulte: 2
  enonce: Si une chenille mange une feuille et qu'un oiseau mange la chenille, comment représenter correctement ce réseau
    alimentaire avec des flèches de nourriture ?
  reponse:
    options:
    - id: o1
      texte: Feuille → Chenille → Oiseau
    - id: o2
      texte: Oiseau → Chenille → Feuille
    - id: o3
      texte: Chenille → Feuille → Oiseau
    - id: o4
      texte: Feuille ← Chenille ← Oiseau
    bonnes:
    - o1
  indices:
    relance: 'Rappelle-toi l''exemple chenille et oiseau : les flèches partent toujours de l''aliment vers le consommateur.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur classique : les flèches sont inversées et vont du mangeur vers le mangé au lieu de l''inverse.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la chenille est mangée par l''oiseau et mange la feuille, l''ordre indiqué n''est pas logique.'
  - si:
      contient:
      - o4
    relance: 'Attention : les flèches pointent dans le mauvais sens.'
  solution: 'Feuille → Chenille → Oiseau. C''est correct : la flèche va de la feuille mangée vers la chenille, puis de la
    chenille vers l''oiseau.'
- id: nblm-comment-un-animal-grandit-il-et-produit-3
  type: choix
  difficulte: 2
  enonce: Comment un animal grandit-il et produit-il de la matière dans un réseau alimentaire pour répondre à la question
    « qui mange qui » ?
  reponse:
    options:
    - id: o1
      texte: En mangeant de la nourriture qui provient d'autres êtres vivants.
    - id: o2
      texte: En fabriquant sa nourriture uniquement grâce à la lumière du Soleil.
    - id: o3
      texte: En buvant uniquement de l'eau sans jamais consommer d'aliments.
    - id: o4
      texte: En se reposant simplement sans dépenser d'énergie.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qu'un animal doit consommer pour obtenir la matière nécessaire à sa croissance.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : fabriquer de la matière uniquement avec de la lumière et de l''eau est propre aux plantes, pas aux
      animaux.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : l''eau seule ne suffit pas à un animal pour produire sa matière corporelle.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : le repos ne crée pas de matière sans apport de nourriture.'
  solution: 'En mangeant de la nourriture qui provient d''autres êtres vivants. C''est juste : un animal produit de la matière
    en consommant d''autres êtres vivants ; plus il mange, plus il peut grandir.'
- id: nblm-quelle-est-la-methode-scientifique-pour-4
  type: choix
  difficulte: 2
  enonce: Quelle est la méthode scientifique pour identifier les besoins des plantes (eau, lumière) afin qu'elles produisent
    de la matière ?
  reponse:
    options:
    - id: o1
      texte: Formuler une hypothèse, réaliser une expérience, puis analyser les résultats.
    - id: o2
      texte: Observer une plante dans la nature sans jamais faire de test.
    - id: o3
      texte: Supposer que les plantes mangent d'autres êtres vivants comme les animaux.
    - id: o4
      texte: Changer tous les paramètres en même temps au hasard.
    bonnes:
    - o1
  indices:
    relance: Pense aux étapes de la démarche scientifique pour tester si un élément est indispensable aux végétaux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Une simple observation ne permet pas de prouver scientifiquement quel élément précis est indispensable.
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : les plantes fabriquent leur propre matière à partir d''eau et de lumière, et non en mangeant
      d''autres organismes.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : en sciences, il faut tester un paramètre précis pour valider une hypothèse.'
  solution: 'Formuler une hypothèse, réaliser une expérience, puis analyser les résultats. C''est exact : pour prouver les
    besoins des plantes, on formule une hypothèse qu''on teste par une expérience puis on observe les résultats.'
- id: nblm-si-une-action-humaine-entraine-la-surpec-5
  type: choix
  difficulte: 2
  enonce: Si une action humaine entraîne la surpêche des poissons dans un milieu marin, quelle est la conséquence sur le réseau
    alimentaire ?
  reponse:
    options:
    - id: o1
      texte: Cela peut avoir des conséquences sur tout le réseau, car les espèces qui se nourrissaient de ces poissons manqueront
        de nourriture.
    - id: o2
      texte: Cela n'a aucun impact car chaque espèce vit de manière totalement indépendante.
    - id: o3
      texte: Les prédateurs des poissons vont voir leur population augmenter automatiquement.
    - id: o4
      texte: Tous les végétaux marins vont immédiatement cesser de pousser.
    bonnes:
    - o1
  indices:
    relance: Demande-toi ce qui arrive aux animaux qui se nourrissaient des poissons péchés en trop grande quantité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur : les êtres vivants d''un réseau sont interconnectés par leurs relations alimentaires.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : si leur nourriture diminue, les prédateurs ont au contraire plus de difficultés à survivre.'
  - si:
      contient:
      - o4
    relance: 'C''est incorrect : les plantes dépendent de l''eau et de la lumière, pas directement de la surpêche des poissons.'
  solution: 'Cela peut avoir des conséquences sur tout le réseau, car les espèces qui se nourrissaient de ces poissons manqueront
    de nourriture. C''est tout à fait juste : si le nombre d''individus d''une espèce baisse, les espèces dépendantes dans
    le réseau en subissent l''impact.'
- id: nblm-quelles-sont-les-deux-propositions-vraie-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX propositions vraies concernant les règles de représentation et d'analyse d'un réseau alimentaire
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Chaque flèche doit être tracée en partant de l'être vivant mangé vers celui qui le mange.
    - id: o2
      texte: Une baisse du nombre d'individus d'une espèce peut impacter les espèces qui en dépendaient pour se nourrir.
    - id: o3
      texte: La flèche doit toujours aller du mangeur vers la proie qu'il a capturée.
    - id: o4
      texte: Les plantes n'ont aucun besoin particulier et ne font pas partie des réseaux alimentaires.
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux règles correctes concernant le sens de la flèche et les impacts entre espèces.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : orienter la flèche du mangeur vers le mangé est un contresens classique.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : les plantes ont des besoins (eau, lumière) et constituent la base de nombreux réseaux alimentaires.'
  solution: 'Chaque flèche doit être tracée en partant de l''être vivant mangé vers celui qui le mange ; Une baisse du nombre
    d''individus d''une espèce peut impacter les espèces qui en dépendaient pour se nourrir. C''est juste : la flèche indique
    le passage de la nourriture du mangé vers le consommateur.'
