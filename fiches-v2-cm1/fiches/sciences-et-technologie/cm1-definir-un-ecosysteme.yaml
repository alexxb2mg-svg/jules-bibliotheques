format: 2
notion: cm1-definir-un-ecosysteme
version: 3
etat: verifiee
declencheurs:
- mare de l'école
- grenouilles et algues
- coopération entre animaux
- qui est prédateur
- caractéristiques d'un milieu
- fourmis et pucerons
- animaux qui s'entraident
- milieu sec et chaud
prerequis: []
essentiel: 'Un écosystème, c''est un ensemble formé de trois choses : les êtres vivants d''un lieu, leur milieu de vie, et
  les relations entre eux. Une mare, une haie ou un coin de la cour de l''école peuvent être étudiés comme des écosystèmes.


  Pour décrire un milieu, on observe, on mesure et on fait des expériences près de chez soi. On relève ses caractéristiques
  géographiques : l''altitude (la hauteur du lieu) et la latitude (sa position entre l''équateur et un pôle). On relève aussi
  ses caractéristiques physicochimiques : l''humidité, la pluviométrie (la quantité de pluie), la luminosité et la température,
  qu''on mesure avec un thermomètre.


  On décrit aussi la biodiversité du milieu : ce sont toutes les espèces différentes qui y vivent. Plus il y a d''espèces
  différentes, plus la biodiversité est grande.


  La présence des êtres vivants dépend des caractéristiques du milieu. Dans un désert très chaud et très sec, peu d''espèces
  peuvent vivre, car il fait très chaud et il y a très peu d''eau.


  Deux espèces différentes peuvent avoir des relations. Dans la coopération, les deux espèces s''entraident : une fourmi protège
  des pucerons et se nourrit de leur miellat. Dans la prédation, une espèce, le prédateur, mange l''autre, la proie : une
  libellule qui attrape un moustique.

  '
methode:
- 'Repérer les trois éléments d''un écosystème : les êtres vivants, leur milieu de vie, leurs relations.'
- Mesurer les caractéristiques du milieu avec un instrument adapté (thermomètre pour la température, par exemple).
- Recenser les espèces différentes présentes pour décrire la biodiversité.
- Relier la présence ou l'absence d'êtres vivants aux caractéristiques mesurées du milieu.
- 'Pour une relation entre deux espèces, se demander : est-ce que les deux y gagnent quelque chose (coopération), ou est-ce
  que l''une mange l''autre (prédation) ?'
vocabulaire:
- terme: écosystème
  definition: un ensemble formé par des êtres vivants, leur milieu de vie et leurs relations
- terme: milieu de vie
  definition: le lieu où vivent des êtres vivants, avec ses caractéristiques comme la température ou l'humidité
- terme: biodiversité
  definition: l'ensemble des espèces différentes qui vivent dans un milieu
- terme: pluviométrie
  definition: la quantité de pluie qui tombe dans un lieu
- terme: coopération
  definition: une relation où deux espèces différentes s'entraident
- terme: prédation
  definition: une relation où une espèce, le prédateur, mange une autre espèce, la proie
erreurs_frequentes:
- Oublier le milieu de vie ou les relations, et ne penser qu'aux êtres vivants pour définir un écosystème.
- Confondre coopération (les deux espèces s'entraident) et prédation (une espèce mange l'autre).
- Décrire le milieu sans le relier aux êtres vivants qui y habitent.
- Croire que la biodiversité, c'est le nombre total d'animaux, alors que c'est le nombre d'espèces différentes.
exemple:
  enonce: Dans une mare, il y a des grenouilles, des libellules et des algues. Comment décrire cet écosystème ?
  solution: On décrit le milieu de vie (température de l'eau, luminosité, humidité), les êtres vivants présents (grenouilles,
    libellules, algues) et leurs relations (les libellules peuvent être prédatrices d'insectes, les algues profitent de la
    lumière et de l'eau).
exercices:
- id: trois-elements-ecosysteme
  type: texte_court
  difficulte: 1
  enonce: Un écosystème, c'est un ensemble d'êtres vivants, leur milieu de vie et... quoi d'autre ? (un mot)
  reponse:
    acceptees:
    - relations
    - les relations
    - leurs relations
    fautes_tolerees: 1
  indices:
    relance: Pense à ce qui se passe entre deux espèces différentes qui vivent au même endroit.
    methode: Relis la première phrase de ton cours sur l'écosystème.
    etape: Une fourmi aide des pucerons, une libellule mange un moustique. Comment appelle-t-on ces liens entre espèces ?
  pieges:
  - si:
      valeur: animaux
    relance: Les animaux font partie des êtres vivants, déjà cités. Cherche le troisième élément, celui entre les espèces.
  solution: Un écosystème est un ensemble d'êtres vivants, leur milieu de vie et leurs relations.
- id: type-relation-fourmis-pucerons
  type: choix
  difficulte: 1
  enonce: Une fourmi protège des pucerons et se nourrit de leur miellat ; en échange les pucerons sont protégés des prédateurs.
    Comment nomme-t-on cette relation ?
  reponse:
    options:
    - id: a
      texte: La coopération
    - id: b
      texte: La prédation
    - id: c
      texte: La pluviométrie
    bonnes:
    - a
  indices:
    relance: Est-ce que les deux espèces y gagnent quelque chose, ou est-ce que l'une mange l'autre ?
    methode: Vérifie si la fourmi mange les pucerons, ou si les deux espèces s'entraident.
    etape: 'Ici, personne n''est mangé : les deux espèces s''aident. Quel mot correspond ?'
  pieges:
  - si:
      contient:
      - b
    relance: Dans la prédation, une espèce mange l'autre. Ici, est-ce que la fourmi mange les pucerons ?
  - si:
      contient:
      - c
    relance: La pluviométrie est une mesure de la pluie dans un milieu, pas une relation entre deux espèces.
  solution: 'C''est une relation de coopération : la fourmi et les pucerons s''entraident tous les deux.'
- id: caracteristique-et-sens
  type: association
  difficulte: 1
  enonce: Relie chaque caractéristique d'un milieu à ce qu'elle décrit.
  reponse:
    gauche:
    - id: temperature
      texte: La température
    - id: luminosite
      texte: La luminosité
    - id: pluviometrie
      texte: La pluviométrie
    - id: altitude
      texte: L'altitude
    droite:
    - id: chaud-froid
      texte: S'il fait chaud ou froid
    - id: lumiere
      texte: La quantité de lumière
    - id: pluie
      texte: La quantité de pluie qui tombe
    - id: hauteur
      texte: La hauteur du lieu
    paires:
      temperature: chaud-froid
      luminosite: lumiere
      pluviometrie: pluie
      altitude: hauteur
  indices:
    relance: Cherche, dans chaque mot, un petit mot que tu connais déjà.
    methode: Dans « luminosité », on entend un mot proche de lumière. Dans « pluviométrie », un mot proche de pluie.
    etape: 'Commence par la température : avec un thermomètre, que sait-on du lieu ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis le début de chaque mot et cherche le petit mot caché dedans.
  - si:
      diagnostic: associations_fausses
    relance: Reprends un mot à la fois et relis le vocabulaire de ta leçon avant de relier.
  solution: La température dit s'il fait chaud ou froid, la luminosité donne la quantité de lumière, la pluviométrie la quantité
    de pluie, l'altitude la hauteur du lieu.
- id: caracteristiques-mesurables-milieu
  type: choix
  difficulte: 2
  enonce: Parmi ces éléments, lesquels peut-on mesurer pour décrire un milieu ?
  reponse:
    options:
    - id: a
      texte: La température
    - id: b
      texte: L'humidité
    - id: c
      texte: La gentillesse des animaux
    - id: d
      texte: La luminosité
    bonnes:
    - a
    - b
    - d
  indices:
    relance: Pense à ce qu'on mesure avec un instrument, comme un thermomètre.
    methode: Une caractéristique physicochimique se mesure avec un capteur ou un instrument précis.
    etape: La gentillesse ne se mesure avec aucun instrument. Les trois autres, oui.
  pieges:
  - si:
      contient:
      - c
    relance: La gentillesse n'est pas une caractéristique physique qu'on peut mesurer avec un instrument.
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé, mais pas toutes les caractéristiques mesurables. Regarde à nouveau chaque proposition.
  solution: On peut mesurer la température, l'humidité et la luminosité (aussi la pluviométrie, l'altitude, la latitude).
    La gentillesse n'est pas une caractéristique physique mesurable.
- id: relation-libellule-insecte
  type: texte_court
  difficulte: 2
  enonce: Une libellule attrape et mange un moustique. Quel mot désigne ce type de relation entre deux espèces ?
  reponse:
    acceptees:
    - prédation
    fautes_tolerees: 1
  indices:
    relance: Une espèce mange-t-elle l'autre, ou s'entraident-elles ?
    methode: Quand une espèce mange une autre espèce, ce n'est pas de la coopération.
    etape: Dans cette relation, la libellule est le prédateur et le moustique est la proie. Quel nom de relation vient du
      mot « prédateur » ?
  pieges:
  - si:
      valeur: coopération
    relance: 'Dans la coopération, les deux espèces s''entraident. Ici, la libellule mange le moustique : est-ce un échange
      entre les deux ?'
  solution: 'C''est une relation de prédation : la libellule est le prédateur, le moustique est la proie.'
- id: ecosysteme-complet
  type: choix
  difficulte: 2
  enonce: Laquelle de ces descriptions présente un écosystème complet ?
  reponse:
    options:
    - id: a
      texte: Les poissons et les grenouilles d'une mare
    - id: b
      texte: L'eau, la vase et la température d'une mare
    - id: c
      texte: Les êtres vivants d'une mare, l'eau et la vase où ils vivent, et les relations entre eux
    bonnes:
    - c
  indices:
    relance: Combien d'éléments faut-il pour former un écosystème ?
    methode: Un écosystème réunit trois éléments. Vérifie lesquels sont présents dans chaque description.
    etape: Pour chaque description, coche dans ta tête les êtres vivants, le milieu de vie et les relations.
  pieges:
  - si:
      contient:
      - a
    relance: Ici, il n'y a que des êtres vivants. Où sont le milieu de vie et les relations ?
  - si:
      contient:
      - b
    relance: Ici, il n'y a que le milieu de vie. Où sont les êtres vivants et leurs relations ?
  solution: 'Seule la dernière description réunit les trois éléments d''un écosystème : les êtres vivants, leur milieu de
    vie (l''eau, la vase) et leurs relations.'
- id: comparer-biodiversite-cour
  type: nombre
  difficulte: 3
  enonce: 'Dans la cour, la classe compte les espèces différentes. Sous la haie, à l''ombre et au frais : 5 espèces d''insectes
    et 3 espèces de plantes. Sur le goudron, au soleil : 1 espèce d''insecte et 1 espèce de plante. Combien d''espèces de
    plus y a-t-il sous la haie que sur le goudron ?'
  reponse:
    valeur: 6
    forme: entier
  indices:
    relance: Combien d'espèces en tout sous la haie ? Et sur le goudron ?
    methode: Additionne les espèces de chaque endroit, puis calcule la différence entre les deux totaux.
    etape: 'Sous la haie : 5 + 3. Sur le goudron : 1 + 1. Il reste à comparer.'
  pieges:
  - si:
      valeur: 8
    relance: C'est le nombre d'espèces sous la haie. On demande combien il y en a de plus que sur le goudron.
  - si:
      valeur: 10
    relance: Tu as additionné toutes les espèces des deux endroits. On demande une différence.
  - si:
      valeur: 2
    relance: C'est le nombre d'espèces sur le goudron. Compare-le avec celui de la haie.
  solution: 'Sous la haie : 5 + 3 = 8 espèces. Sur le goudron : 1 + 1 = 2 espèces. Différence : 8 − 2 = 6 espèces de plus
    sous la haie : la biodiversité y est plus grande.'
- id: milieu-et-especes
  type: ouverte
  difficulte: 2
  enonce: Une classe observe un désert très sec et très chaud. Explique en deux ou trois phrases pourquoi peu d'espèces y
    vivent.
  criteres:
  - L'élève relie la présence d'espèces aux caractéristiques du milieu (chaleur, sécheresse).
  - L'élève comprend que peu d'espèces supportent des conditions aussi difficiles.
  - L'élève emploie le mot biodiversité, ou explique qu'il y a peu d'espèces différentes dans ce milieu.
  indices:
    relance: Quelles caractéristiques physiques du désert rendent la vie difficile ?
    methode: Pense à la chaleur et au manque d'eau, puis relie ces caractéristiques au nombre d'espèces qui peuvent vivre
      là.
    etape: Commence ainsi « Dans ce désert, la température est très élevée et il y a peu d'eau... », puis continue.
  solution: Dans ce désert, la température est très élevée et il y a très peu d'eau (faible humidité). Seules quelques espèces
    adaptées à la chaleur et à la sécheresse peuvent y vivre, ce qui explique la faible biodiversité de ce milieu.
- id: nblm-dans-la-mare-de-l-ecole-quels-sont-les-t-1
  type: choix
  difficulte: 2
  enonce: Dans la mare de l'école, quels sont les trois éléments indispensables pour définir cet écosystème ?
  reponse:
    options:
    - id: o1
      texte: Les êtres vivants, leur milieu de vie et les relations entre eux
    - id: o2
      texte: Uniquement les animaux et les végétaux qui y habitent
    - id: o3
      texte: Seulement la température et l'eau de la mare
    - id: o4
      texte: Uniquement les relations de prédation entre les espèces
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux trois composantes fondamentales qui forment un écosystème complet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur fréquente d'oublier le milieu de vie et les relations pour ne penser qu'aux êtres vivants.
  - si:
      contient:
      - o3
    relance: C'est faux car la température et l'eau ne sont que des caractéristiques du milieu, il manque les êtres vivants
      et leurs relations.
  - si:
      contient:
      - o4
    relance: C'est incomplet car les relations ne forment pas un écosystème sans le milieu de vie et les organismes.
  solution: Les êtres vivants, leur milieu de vie et les relations entre eux. C'est exact, un écosystème regroupe les êtres
    vivants, le milieu de vie et toutes leurs interactions.
- id: nblm-quelle-mesure-permet-de-decrire-une-cara-2
  type: choix
  difficulte: 2
  enonce: Quelle mesure permet de décrire une caractéristique physique du milieu de vie dans un écosystème ?
  reponse:
    options:
    - id: o1
      texte: La température
    - id: o2
      texte: Le nombre d'animaux observés
    - id: o3
      texte: La couleur de la peau des grenouilles
    - id: o4
      texte: Le nom des espèces de plantes présentées
    bonnes:
    - o1
  indices:
    relance: Cherche un paramètre de l'environnement qu'on peut mesurer avec un instrument comme un thermomètre.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur car le comptage des animaux concerne les êtres vivants et non un paramètre du milieu.
  - si:
      contient:
      - o3
    relance: C'est faux, l'apparence physique des animaux est un trait biologique de l'espèce, pas du milieu de vie.
  - si:
      contient:
      - o4
    relance: C'est incorrect, l'identification des espèces concerne la biodiversité et non une mesure physique du milieu.
  solution: La température. C'est juste, la température est une grandeur physique mesurable qui caractérise le milieu de vie.
- id: nblm-quelle-relation-existe-t-il-entre-la-fou-3
  type: choix
  difficulte: 2
  enonce: Quelle relation existe-t-il entre la fourmi qui protège les pucerons et se nourrit de leur miellat ?
  reponse:
    options:
    - id: o1
      texte: La coopération
    - id: o2
      texte: La prédation
    - id: o3
      texte: La compétition
    - id: o4
      texte: La décomposition
    bonnes:
    - o1
  indices:
    relance: Réfléchis au terme scientifique pour désigner une entraide où les deux espèces sont gagnantes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une confusion fréquente : la fourmi ne dévore pas le puceron, elle le protège et récolte son miellat.'
  - si:
      contient:
      - o3
    relance: C'est faux car les deux espèces travaillent ensemble au lieu de s'affronter pour une même ressource.
  - si:
      contient:
      - o4
    relance: C'est incorrect, la décomposition concerne la transformation de la matière morte et non une entraide entre organismes
      vivants.
  solution: La coopération. C'est exact, la fourmi et le puceron s'entraident et bénéficient tous les deux de cette relation.
- id: nblm-dans-une-relation-de-predation-au-sein-d-4
  type: choix
  difficulte: 2
  enonce: Dans une relation de prédation au sein d'un écosystème, qui est le prédateur ?
  reponse:
    options:
    - id: o1
      texte: L'espèce qui mange une autre espèce appelée la proie
    - id: o2
      texte: L'espèce qui est mangée par un autre animal
    - id: o3
      texte: L'espèce qui protège un autre animal en échange de nourriture
    - id: o4
      texte: Le paramètre qui mesure la luminosité du milieu
    bonnes:
    - o1
  indices:
    relance: Pense à la définition de l'animal chasseur par rapport à l'animal chassé.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une confusion classique : l''animal qui se fait manger est la proie, pas le prédateur.'
  - si:
      contient:
      - o3
    relance: C'est faux, cette description correspond à une relation de coopération et non de prédation.
  - si:
      contient:
      - o4
    relance: C'est une erreur majeure car la luminosité est une caractéristique physique du milieu, pas un organisme prédateur.
  solution: L'espèce qui mange une autre espèce appelée la proie. C'est juste, le prédateur est l'organisme qui capture et
    consomme la proie pour se nourrir.
- id: nblm-dans-la-mare-de-l-ecole-ou-vivent-des-gr-5
  type: choix
  difficulte: 2
  enonce: Dans la mare de l'école où vivent des grenouilles et des algues, quel rôle ont les algues dans cet écosystème ?
  reponse:
    options:
    - id: o1
      texte: Elles profitent de la lumière et de l'eau du milieu pour se développer
    - id: o2
      texte: Elles sont des prédatrices qui mangent les grenouilles
    - id: o3
      texte: Elles constituent le milieu de vie sans être des êtres vivants
    - id: o4
      texte: Elles servent uniquement d'instrument pour mesurer la température
    bonnes:
    - o1
  indices:
    relance: Considère le besoin des végétaux aquatiques par rapport au milieu dans lequel ils vivent.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est faux, les algues sont des végétaux et ne chassent pas les animaux de la mare.
  - si:
      contient:
      - o3
    relance: C'est une erreur car les algues sont bien des organismes vivants et non des éléments minéraux du milieu.
  - si:
      contient:
      - o4
    relance: C'est incorrect, la température se mesure avec un thermomètre et non avec un végétal.
  solution: Elles profitent de la lumière et de l'eau du milieu pour se développer. C'est exact, les algues sont des êtres
    vivants végétaux qui utilisent l'eau et la lumière du milieu de vie.
- id: nblm-quelles-sont-les-deux-affirmations-corre-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux affirmations correctes concernant les caractéristiques d'un milieu et sa biodiversité ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: La température, l'humidité et la luminosité sont des caractéristiques du milieu
    - id: o2
      texte: Plus il y a d'espèces différentes dans un milieu, plus sa biodiversité est grande
    - id: o3
      texte: Un écosystème est composé uniquement de caractéristiques physiques sans êtres vivants
    - id: o4
      texte: La biodiversité diminue lorsque le nombre d'espèces augmente dans le milieu
    bonnes:
    - o1
    - o2
  indices:
    relance: Recherche la définition des facteurs du milieu et le lien entre le nombre d'espèces et la biodiversité.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est faux car un écosystème comprend obligatoirement des êtres vivants en interaction avec le milieu.
  - si:
      contient:
      - o4
    relance: 'C''est une erreur de logique : la biodiversité est plus forte quand le nombre d''espèces différentes est élevé.'
  solution: La température, l'humidité et la luminosité sont des caractéristiques du milieu ; Plus il y a d'espèces différentes
    dans un milieu, plus sa biodiversité est grande. C'est juste, ces mesures physiques servent à décrire précisément le milieu
    de vie.
- id: nblm-lorsque-deux-especes-differentes-s-entra-7
  type: texte_court
  difficulte: 1
  enonce: 'Lorsque deux espèces différentes s''entraident dans un écosystème, cette relation s''appelle la :'
  reponse:
    acceptees:
    - coopération
    fautes_tolerees: 1
  indices:
    relance: Pense au nom donné à l'association bénéfique comme celle entre la fourmi et le puceron.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: coopération. C'est le terme exact pour désigner l'entraide mutuelle entre deux espèces.
- id: nblm-plus-un-milieu-accueille-d-especes-diffe-8
  type: texte_court
  difficulte: 1
  enonce: 'Plus un milieu accueille d''espèces différentes d''êtres vivants, plus sa est grande :'
  reponse:
