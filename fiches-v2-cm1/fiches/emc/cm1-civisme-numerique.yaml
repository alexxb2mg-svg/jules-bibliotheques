    - id: b
      texte: Répondre seul pour comprendre ce qu'il veut
    - id: c
      texte: Ne rien faire et continuer comme si de rien n'était
    bonnes:
    - a
  indices:
    relance: Qui peut t'aider à évaluer si une situation en ligne est dangereuse ?
    methode: Face à un message étrange, la bonne réaction est toujours d'en parler à un adulte de confiance.
    etape: Répondre seul, ou ne rien faire, ne protège pas.
  pieges:
  - si:
      contient:
      - b
    relance: Répondre seul à un inconnu peut être dangereux. Il vaut mieux en parler d'abord à un adulte.
  - si:
      contient:
      - c
    relance: Ne rien faire ne règle pas le problème. Il vaut mieux en parler à un adulte de confiance.
  solution: Face à un message étrange d'un inconnu, il faut en parler tout de suite à un adulte de confiance.
