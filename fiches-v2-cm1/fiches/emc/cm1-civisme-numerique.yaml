format: 2
notion: cm1-civisme-numerique
version: 2
etat: verifiee
declencheurs:
- bien se comporter sur internet
- ne pas partager n'importe quelle photo
- faire une recherche sérieuse sur internet
- alerter un adulte devant un danger en ligne
- une image qui fait peur
- poster la photo d'un copain
- un inconnu dans un jeu en ligne
- trop de temps sur les écrans
prerequis:
- cm1-civisme-action-bien-public
essentiel: 'Le civisme numérique, c''est se comporter de façon responsable quand on utilise Internet, une tablette, un ordinateur
  ou un téléphone. En ligne, on respecte les autres comme dans la cour de l''école.


  Avant de partager, on réfléchit. On ne publie pas la photo d''un camarade sans lui demander son accord. On ne donne jamais
  ses informations personnelles (son adresse, son mot de passe) à un inconnu. On ne transmet pas une information sans savoir
  si elle est vraie.


  Faire une recherche en ligne sérieuse, c''est choisir des mots précis, regarder qui a écrit la page, et comparer plusieurs
  sites. Tout ce qu''on lit sur Internet n''est pas forcément vrai.


  La sobriété numérique, c''est utiliser le numérique seulement quand c''est utile. Les appareils et Internet consomment de
  l''énergie. On éteint l''ordinateur quand on a fini, on évite les recherches inutiles, on ne regarde pas des vidéos pendant
  des heures. C''est aussi un geste pour l''environnement.


  En ligne, on peut rencontrer une situation de danger : un message inquiétant, une image qui choque, un inconnu qui pose
  des questions bizarres. Il faut la reconnaître, puis se mettre en sécurité : on ne répond pas, on ferme la page ou on éteint
  l''écran. Ensuite, on alerte tout de suite un adulte de confiance, un parent ou un enseignant. Ce n''est pas « rapporter
  », c''est se protéger.

  '
methode:
- Avant de publier, se demander si cela respecte les autres et si on a leur accord.
- Avant de partager une information, vérifier d'où elle vient et la comparer avec un autre site.
- Garder pour soi ses informations personnelles (adresse, mot de passe).
- Se demander si l'usage de l'écran est utile, ou si on peut l'éteindre.
- 'Face à un danger en ligne : ne pas répondre, fermer la page ou éteindre l''écran.'
- Prévenir tout de suite un adulte de confiance.
vocabulaire:
- terme: civisme numérique
  definition: le fait de se comporter de façon responsable quand on utilise Internet et les outils numériques
- terme: sobriété numérique
  definition: le fait de limiter son usage du numérique à ce qui est vraiment utile, pour économiser de l'énergie
- terme: recherche en ligne
  definition: le fait de chercher une information sur Internet, en vérifiant d'où elle vient
- terme: informations personnelles
  definition: ce qui permet de te reconnaître ou de te trouver, comme ton adresse ou ton mot de passe
- terme: adulte de confiance
  definition: un adulte que tu connais bien et qui peut t'aider, comme un parent ou un enseignant
erreurs_frequentes:
- Croire que tout ce qu'on lit sur Internet est forcément vrai.
- Penser qu'on peut gérer seul une situation inquiétante rencontrée en ligne.
- Oublier que laisser des appareils allumés inutilement n'est pas un comportement sobre.
- Publier la photo d'un camarade sans lui demander s'il est d'accord.
- Croire que prévenir un adulte, c'est « rapporter », alors que c'est se protéger.
exemple:
  enonce: Que dois-tu faire si un inconnu te demande des informations personnelles en ligne ?
  solution: Je ne réponds pas et je ne donne ni mon adresse ni mon mot de passe. Je ferme la conversation pour me mettre en
    sécurité. Puis j'en parle immédiatement à un adulte de confiance, un parent ou un enseignant.
exercices:
- id: reagir-message-inconnu
  type: choix
  difficulte: 1
  enonce: Que dois-tu faire si un inconnu t'envoie un message étrange en ligne ?
  reponse:
    options:
    - id: a
      texte: En parler tout de suite à un adulte de confiance
    - id: b
      texte: Répondre seul pour comprendre ce qu'il veut
    - id: c
      texte: Ne rien faire et continuer comme si de rien n'était
    bonnes:
    - a
  indices:
    relance: Qui peut t'aider à évaluer si une situation en ligne est dangereuse ?
    methode: Face à un message étrange, la bonne réaction est toujours d'en parler à un adulte de confiance.
    etape: Répondre seul, ou ne rien faire, ne protège pas.
  pieges:
  - si:
      contient:
      - b
    relance: Répondre seul à un inconnu peut être dangereux. Il vaut mieux en parler d'abord à un adulte.
  - si:
      contient:
      - c
    relance: Ne rien faire ne règle pas le problème. Il vaut mieux en parler à un adulte de confiance.
  solution: Face à un message étrange d'un inconnu, il faut en parler tout de suite à un adulte de confiance.
- id: definir-sobriete-numerique
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'un comportement de sobriété numérique ?
  reponse:
    options:
    - id: a
      texte: Éteindre les appareils numériques quand on ne les utilise pas
    - id: b
      texte: Laisser tous les écrans allumés toute la journée
    - id: c
      texte: Faire le plus de recherches possible sur Internet, même inutiles
    bonnes:
    - a
  indices:
    relance: Le mot « sobriété » fait penser à limiter, à ne pas gaspiller.
    methode: La sobriété numérique, c'est utiliser le numérique seulement quand c'est utile.
    etape: Élimine les réponses qui décrivent un usage excessif.
  pieges:
  - si:
      contient:
      - b
    relance: Laisser les écrans allumés inutilement est le contraire de la sobriété numérique.
  - si:
      contient:
      - c
    relance: 'Faire des recherches inutiles consomme de l''énergie pour rien : ce n''est pas sobre.'
  solution: Éteindre les appareils numériques quand on ne les utilise pas est un comportement de sobriété numérique.
- id: mot-sobriete
  type: texte_court
  difficulte: 1
  enonce: 'Complète le nom de ce comportement : utiliser les écrans et Internet seulement quand c''est utile, pour économiser
    de l''énergie, c''est la … numérique.'
  reponse:
    acceptees:
    - sobriété
    - sobriete
    - sobriété numérique
    fautes_tolerees: 1
  indices:
    relance: Ce mot veut dire « ne pas en faire trop, ne pas gaspiller ».
    methode: Relis le vocabulaire de la fiche. Un des mots parle d'économiser l'énergie.
    etape: Le mot commence par « sob- ».
  pieges:
  - si:
      valeur: économie
    relance: C'est bien l'idée. Mais quel mot précis désigne le fait de limiter son usage du numérique ?
  solution: C'est la sobriété numérique. On utilise le numérique seulement quand c'est utile.
- id: photo-camarade
  type: choix
  difficulte: 2
  enonce: Tu as pris une photo drôle d'un camarade. Tu veux la publier en ligne. Que fais-tu d'abord ?
  reponse:
    options:
    - id: a
      texte: Je lui demande s'il est d'accord
    - id: b
      texte: Je la publie tout de suite, puisque c'est moi qui l'ai prise
    - id: c
      texte: Je l'envoie à toute la classe sans rien dire
    bonnes:
    - a
  indices:
    relance: Cette photo montre qui ? À qui appartient son image ?
    methode: Avant de partager l'image de quelqu'un, on pense à ce qu'il pourrait ressentir.
    etape: Une photo drôle pour toi peut gêner ou blesser la personne sur la photo.
  pieges:
  - si:
      contient:
      - b
    relance: Tu as pris la photo, mais c'est ton camarade qu'on voit dessus. Que faut-il savoir avant de la publier ?
  - si:
      contient:
      - c
    relance: L'envoyer à toute la classe, c'est aussi la partager. Ton camarade est-il d'accord ?
  solution: Je lui demande d'abord s'il est d'accord. S'il refuse, je ne publie pas la photo.
- id: recherche-serieuse
  type: choix
  difficulte: 2
  enonce: Pour un exposé, tu trouves une information étonnante sur un site Internet. Que fais-tu ?
  reponse:
    options:
    - id: a
      texte: Je la vérifie sur un autre site sérieux ou avec un adulte
    - id: b
      texte: Je la recopie tout de suite, car tout ce qui est sur Internet est vrai
    - id: c
      texte: Je la partage à mes amis avant de la vérifier
    bonnes:
    - a
  indices:
    relance: Une information trouvée sur un seul site est-elle forcément vraie ?
    methode: Une recherche sérieuse compare plusieurs sources avant de croire une information.
    etape: Élimine les réponses où l'information est utilisée sans contrôle.
  pieges:
  - si:
      contient:
      - b
    relance: Tout ce qui est sur Internet n'est pas vrai. Que faut-il faire avant de l'utiliser ?
  - si:
      contient:
      - c
    relance: Partager une information non vérifiée peut répandre une erreur. Que faut-il faire d'abord ?
  solution: Je vérifie l'information sur un autre site sérieux ou avec un adulte avant de l'utiliser.
- id: associer-situation-comportement
  type: association
  difficulte: 2
  enonce: Associe chaque situation au bon comportement civique numérique.
  reponse:
    gauche:
    - id: a
      texte: Une information trouvée en ligne semble fausse
    - id: b
      texte: Un ordinateur reste allumé sans être utilisé
    - id: c
      texte: Un inconnu demande une photo en ligne
    droite:
    - id: x
      texte: Ne pas la partager sans vérifier
    - id: y
      texte: L'éteindre
    - id: z
      texte: En parler à un adulte de confiance
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque situation, quelle est la réaction la plus responsable ?
    methode: 'Repère le mot-clé de chaque situation : information, appareil allumé, demande d''un inconnu.'
    etape: Une information fausse ne doit pas être partagée sans vérification.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque situation.
  - si:
      diagnostic: associations_fausses
    relance: 'Repère d''abord la situation la plus dangereuse : la demande d''un inconnu, qui appelle un adulte.'
  solution: Une information douteuse ne doit pas être partagée sans vérification. Un appareil non utilisé doit être éteint.
    Une demande d'un inconnu doit être signalée à un adulte de confiance.
- id: ordre-danger-en-ligne
  type: ordre
  difficulte: 3
  enonce: Sur une tablette, une image qui te choque apparaît soudain. Range ces actions dans le bon ordre.
  reponse:
    elements:
    - id: reconnaitre
      texte: Je reconnais que cette image me met mal à l'aise
    - id: securite
      texte: Je ferme la page ou j'éteins l'écran
    - id: alerter
      texte: Je préviens tout de suite un adulte de confiance
    - id: expliquer
      texte: J'explique à l'adulte ce que j'ai vu, sans avoir honte
  indices:
    relance: Avant d'agir, que dois-tu remarquer ?
    methode: 'On suit trois temps : reconnaître le danger, se mettre en sécurité, alerter.'
    etape: Tu ne peux pas raconter à l'adulte avant de l'avoir prévenu.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux actions voisines sont inversées. Laquelle doit venir en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par ce que tu ressens devant l'image, puis protège-toi avant d'aller chercher de l'aide.
  solution: Je reconnais que l'image me met mal à l'aise, je ferme la page ou j'éteins l'écran, je préviens tout de suite
    un adulte de confiance, puis je lui explique ce que j'ai vu.
- id: expliquer-civisme-numerique
  type: ouverte
  difficulte: 3
  enonce: Explique ce qu'est le civisme numérique, avec un exemple lié au partage d'informations et un exemple lié à la sécurité
    en ligne.
  criteres:
  - L'élève définit le civisme numérique comme un comportement responsable en ligne.
  - L'élève donne un exemple lié à la vérification ou au partage d'informations.
  - L'élève donne un exemple lié à la sécurité (reconnaître un danger, alerter un adulte).
  indices:
    relance: Pense à ce que tu dois vérifier avant de partager quelque chose, et à qui prévenir en cas de danger.
    methode: Donne d'abord un exemple sur le partage d'informations, puis un exemple sur la sécurité.
    etape: 'Tu peux commencer ainsi : « Le civisme numérique, c''est... »'
  solution: Le civisme numérique, c'est se comporter de façon responsable en ligne. Par exemple, je ne partage pas une information
    sans vérifier si elle est vraie. Si je rencontre une situation étrange ou inquiétante, comme un message d'un inconnu,
    j'en parle tout de suite à un adulte de confiance.
