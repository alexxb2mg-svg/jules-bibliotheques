format: 2
notion: cm1-fraternite-valeur-republique
version: 3
etat: verifiee
declencheurs:
- pourquoi il faut s'entraider entre citoyens
- le mot écrit sur les frontons des écoles
- écouter l'avis des autres pendant un débat
- pourquoi on ne se moque pas de l'avis d'un camarade
- liberté égalité et quoi
- pas d'accord avec mon copain
- couper la parole en classe
- donner son avis poliment
prerequis: []
couverture: Ne détaille pas l'histoire de la devise républicaine.
essentiel: 'La fraternité est une valeur de la République française, avec la liberté et l''égalité. C''est aussi un principe
  de la République. Elle apparaît dans la devise « Liberté, Égalité, Fraternité », écrite sur le fronton des écoles et des
  mairies.


  Être fraternel, c''est se sentir solidaire des autres, comme des frères et sœurs, même sans lien de famille. On s''entraide,
  on se soutient, on ne laisse personne de côté. Par exemple, aider un camarade en difficulté, même s''il n''est pas un ami
  proche, ou accueillir un nouvel élève à la récréation.


  La fraternité se vit aussi pendant un débat réglé. Un débat réglé est un échange d''opinions organisé, avec des règles.
  On lève la main pour parler, on attend son tour, on écoute jusqu''au bout.


  Dans un débat, chacun peut exprimer son opinion personnelle. Mais on tient compte de la sensibilité des autres : on choisit
  des mots respectueux, sans blesser ceux qui pensent autrement. On critique une idée, jamais la personne.


  Nuancer son propos, c''est ne pas dire les choses de façon trop tranchée. On dit « je pense que » ou « parfois », plutôt
  que « c''est nul » ou « jamais ». Modérer son attitude, c''est rester calme et ne pas couper la parole, même quand on n''est
  pas d''accord.

  '
methode:
- Lever la main et attendre son tour pour parler.
- Écouter l'avis de l'autre jusqu'au bout, sans couper la parole.
- Donner son opinion en commençant par « je pense que ».
- Nuancer son propos et choisir des mots qui ne blessent pas.
- Rester calme, même quand on n'est pas d'accord.
- Relier ce comportement à la fraternité, valeur de la devise républicaine.
vocabulaire:
- terme: fraternité
  definition: le fait de se sentir solidaire des autres et de les soutenir, comme des frères et sœurs, même sans lien de famille
- terme: débat réglé
  definition: un échange d'opinions organisé, où chacun respecte des règles pour s'exprimer et écouter les autres
- terme: devise
  definition: une courte phrase qui résume les valeurs d'un pays
- terme: opinion
  definition: ce que l'on pense personnellement d'un sujet
- terme: nuancer
  definition: dire les choses avec prudence, sans être trop catégorique
- terme: solidarité
  definition: le fait de s'entraider et de se soutenir les uns les autres
erreurs_frequentes:
- Croire que la fraternité ne concerne que les membres d'une même famille.
- Penser qu'un débat réglé permet de dire n'importe quoi sur les autres, sans les respecter.
- Confondre fraternité (solidarité entre citoyens) et simple amitié entre proches.
- 'Croire que dans un débat, il faut gagner : le but est d''échanger et d''écouter.'
exemple:
  enonce: Donne un exemple de fraternité dans la vie de la classe.
  solution: Aider un camarade qui a des difficultés à comprendre un exercice, même s'il n'est pas un ami proche, est un exemple
    de fraternité. C'est être solidaire, comme le demande la devise de la République.
exercices:
- id: identifier-devise-republicaine
  type: texte_court
  difficulte: 1
  enonce: Avec « Liberté » et « Égalité », quel est le troisième mot de la devise de la République française ?
  reponse:
    acceptees:
    - fraternité
    fautes_tolerees: 1
  indices:
    relance: Ce mot fait penser à la solidarité entre des frères et sœurs.
    methode: Ce mot est écrit sur le fronton des écoles, avec « Liberté » et « Égalité ».
    etape: C'est aussi le nom de la valeur dont parle toute cette leçon.
  pieges:
  - si:
      valeur: solidarité
    relance: La solidarité est une idée proche, mais le mot exact de la devise est plus précis.
  solution: Le troisième mot de la devise est « Fraternité ».
- id: identifier-exemple-fraternite
  type: choix
  difficulte: 1
  enonce: Lequel de ces comportements montre de la fraternité ?
  reponse:
    options:
    - id: a
      texte: Aider un camarade en difficulté, même s'il n'est pas un ami proche
    - id: b
      texte: N'aider que ses meilleurs amis
    - id: c
      texte: Ignorer un camarade qui a besoin d'aide
    bonnes:
    - a
  indices:
    relance: La fraternité se limite-t-elle aux amis proches, ou concerne-t-elle tout le monde ?
    methode: La fraternité, c'est être solidaire de tous, pas seulement de ses proches.
    etape: Deux réponses limitent l'aide à un petit groupe ou la refusent.
  pieges:
  - si:
      contient:
      - b
    relance: La fraternité concerne tous les citoyens, pas seulement ses amis les plus proches.
  - si:
      contient:
      - c
    relance: Ignorer un camarade en difficulté est le contraire de la fraternité.
  solution: Aider un camarade en difficulté, même s'il n'est pas un ami proche, montre de la fraternité.
- id: phrase-nuancee
  type: choix
  difficulte: 2
  enonce: Pendant un débat sur la cantine, quelle phrase est nuancée et respectueuse ?
  reponse:
    options:
    - id: a
      texte: Je pense que les repas sont parfois trop salés
    - id: b
      texte: La cantine, c'est nul, et ceux qui l'aiment sont nuls aussi
    - id: c
      texte: Tu dis n'importe quoi, tais-toi
    bonnes:
    - a
  indices:
    relance: Quelle phrase donne un avis sans blesser personne ?
    methode: Une phrase nuancée commence souvent par « je pense » et évite les mots comme « nul » ou « toujours ».
    etape: Élimine les phrases qui s'en prennent aux personnes.
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase est très tranchée et blesse ceux qui pensent autrement. Est-elle nuancée ?
  - si:
      contient:
      - c
    relance: Cette phrase coupe la parole à l'autre et le vexe. Respecte-t-elle les règles du débat ?
  solution: « Je pense que les repas sont parfois trop salés » est nuancée et respectueuse. Elle donne un avis sans blesser.
- id: associer-regle-debat
  type: association
  difficulte: 2
  enonce: Associe chaque règle du débat réglé à sa description.
  reponse:
    gauche:
    - id: a
      texte: Nuancer son propos
    - id: b
      texte: Modérer son attitude
    droite:
    - id: x
      texte: Ne pas dire les choses de façon trop tranchée
    - id: y
      texte: Rester calme et ne pas couper la parole
    paires:
      a: x
      b: y
  indices:
    relance: L'une des règles concerne ce que l'on dit, l'autre concerne comment on se comporte.
    methode: « Nuancer » concerne les mots choisis. « Modérer son attitude » concerne le comportement.
    etape: « Nuancer son propos » veut dire éviter les phrases trop catégoriques.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux définitions.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord « nuancer son propos », qui concerne les mots utilisés, pas l'attitude.
  solution: Nuancer son propos, c'est éviter les phrases trop tranchées. Modérer son attitude, c'est rester calme et ne pas
    couper la parole.
- id: reperer-comportements-fraternels
  type: choix
  difficulte: 2
  enonce: Coche tous les comportements fraternels.
  reponse:
    options:
    - id: a
      texte: Montrer la cour de l'école à un nouvel élève
    - id: b
      texte: Écouter calmement un camarade qui n'a pas le même avis que moi
    - id: c
      texte: Rire quand un camarade se trompe au tableau
    - id: d
      texte: Refuser de prêter un crayon à un élève qui n'est pas mon ami
    bonnes:
    - a
    - b
  indices:
    relance: Quels comportements montrent qu'on se soucie de tous, même de ceux qui ne sont pas nos amis ?
    methode: Un comportement fraternel accueille, aide ou respecte les autres.
    etape: Il y a deux bonnes réponses.
  pieges:
  - si:
      contient:
      - c
    relance: Rire d'une erreur peut blesser. Est-ce être solidaire ?
  - si:
      contient:
      - d
    relance: La fraternité ne se limite pas aux amis. Est-ce fraternel de refuser ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé un comportement, mais il y en a un autre. Relis toutes les propositions.
  solution: Montrer la cour à un nouvel élève et écouter calmement un avis différent sont des comportements fraternels.
- id: ordre-prendre-parole-debat
  type: ordre
  difficulte: 3
  enonce: Pendant un débat réglé, tu veux répondre à un camarade. Range ces actions dans l'ordre.
  reponse:
    elements:
    - id: ecouter
      texte: J'écoute mon camarade jusqu'au bout
    - id: lever
      texte: Je lève la main
    - id: attendre
      texte: J'attends qu'on me donne la parole
    - id: parler
      texte: Je donne mon avis avec des mots respectueux
  indices:
    relance: Que fais-tu pendant que ton camarade parle encore ?
    methode: On écoute d'abord, on demande la parole ensuite, on parle enfin.
    etape: On ne peut pas parler avant d'avoir reçu la parole.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux actions voisines sont inversées. Laquelle vient avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par ce que tu fais quand ton camarade parle encore, et termine par ton avis.
  solution: J'écoute mon camarade jusqu'au bout, je lève la main, j'attends qu'on me donne la parole, puis je donne mon avis
    avec des mots respectueux.
- id: expliquer-fraternite-debat
  type: ouverte
  difficulte: 3
  enonce: Explique ce qu'est la fraternité, puis donne un exemple de comportement fraternel lors d'un débat réglé en classe.
  criteres:
  - L'élève définit la fraternité comme une valeur de solidarité entre citoyens, présente dans la devise de la République.
  - L'élève donne un exemple de comportement fraternel dans un débat (écouter, respecter un avis différent).
  - L'élève montre comment nuancer son propos ou modérer son attitude (phrase en « je pense que », rester calme).
  indices:
    relance: Pense à la devise de la République, puis à comment bien se comporter pendant un débat.
    methode: Définis d'abord la fraternité, puis relie-la à un exemple concret de débat en classe.
    etape: 'Tu peux commencer ainsi : « La fraternité est une valeur de la République qui... »'
  solution: La fraternité est une valeur de la République qui signifie être solidaire des autres, même sans lien de famille.
    Lors d'un débat réglé en classe, un comportement fraternel consiste à écouter l'avis d'un camarade avec lequel on n'est
    pas d'accord, sans le couper ni le juger.
- id: nblm-ou-retrouve-t-on-la-devise-republicaine-1
  type: choix
  difficulte: 2
  enonce: Où retrouve-t-on la devise républicaine « Liberté, Égalité, Fraternité » dans notre vie quotidienne ?
  reponse:
    options:
    - id: o1
      texte: Sur le fronton des écoles et des mairies.
    - id: o2
      texte: Uniquement dans les livres de famille.
    - id: o3
      texte: Seulement sur les cartes d'anniversaire.
    - id: o4
      texte: Sur les cahiers d'exercices personnels des élèves.
    bonnes:
    - o1
  indices:
    relance: Pense aux bâtiments publics de ta commune ou à l'entrée de ton école.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : la fraternité républicaine est une valeur publique qui concerne tous les citoyens, elle est donc
      inscrite sur les bâtiments de la République.'
  - si:
      contient:
      - o3
    relance: Non, c'est la devise officielle de la République française, pas une formule privée d'amitié.
  - si:
      contient:
      - o4
    relance: Non, elle est gravée sur le fronton des mairies et des écoles.
  solution: Sur le fronton des écoles et des mairies. C'est exact. La devise républicaine est inscrite officiellement sur
    le fronton des bâtiments publics comme les écoles et les mairies.
- id: nblm-pourquoi-faut-il-s-entraider-entre-citoy-2
  type: choix
  difficulte: 2
  enonce: Pourquoi faut-il s'entraider entre citoyens au nom de la fraternité ?
  reponse:
    options:
    - id: o1
      texte: Parce que la fraternité signifie se sentir solidaire et se soutenir comme des frères et sœurs, même sans lien
        de famille.
    - id: o2
      texte: Parce qu'il faut aider uniquement les membres de sa propre famille.
    - id: o3
      texte: Parce qu'on doit obligatoirement devenir le meilleur ami de tous les citoyens.
    - id: o4
      texte: Parce que cela permet de recevoir une récompense financière.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au lien de solidarité qui rassemble tous les citoyens de la République.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : la fraternité républicaine dépasse la famille biologique pour unir tous les citoyens.'
  - si:
      contient:
      - o3
    relance: 'Attention à ne pas confondre fraternité et amitié : la fraternité est une solidarité entre citoyens, pas une
      amitié intime.'
  - si:
      contient:
      - o4
    relance: L'entraide citoyenne est un acte de solidarité désintéressé pour le bien commun.
  solution: Parce que la fraternité signifie se sentir solidaire et se soutenir comme des frères et sœurs, même sans lien
    de famille. Exactement ! La fraternité pousse les citoyens à être solidaires, à s'entraider et à ne laisser personne de
    côté.
- id: nblm-pendant-un-debat-regle-en-classe-comment-3
  type: choix
  difficulte: 2
  enonce: Pendant un débat réglé en classe, comment se manifeste la fraternité ?
  reponse:
    options:
    - id: o1
      texte: En écoutant les opinions des autres avec respect, même quand on n'est pas d'accord.
    - id: o2
      texte: En coupant la parole à ceux qui ne pensent pas comme nous.
    - id: o3
      texte: En imposant son avis en parlant plus fort que les autres.
    - id: o4
      texte: En refusant de participer au débat.
    bonnes:
    - o1
  indices:
    relance: Pense à l'attitude à adopter lorsque quelqu'un exprime une idée différente de la tienne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Non, couper la parole manque de respect envers ses camarades et enfreint les règles du débat.
  - si:
      contient:
      - o3
    relance: Non, la fraternité demande de rester calme et de modérer son attitude.
  - si:
      contient:
      - o4
    relance: Un débat réglé permet l'échange et l'écoute mutuelle, il demande la participation respectueuse de chacun.
  solution: En écoutant les opinions des autres avec respect, même quand on n'est pas d'accord. Bravo ! Dans un débat réglé,
    la fraternité consiste à respecter la parole de chacun et à écouter toutes les opinions.
- id: nblm-pourquoi-est-il-important-de-ne-pas-se-m-4
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il important de ne pas se moquer de l'avis d'un camarade lors d'un débat ?
  reponse:
    options:
    - id: o1
      texte: Parce qu'il faut s'exprimer avec des mots respectueux sans blesser ceux qui pensent différemment.
    - id: o2
      texte: Parce que tout le monde doit obligatoirement avoir exactement la même opinion.
    - id: o3
      texte: Parce que seuls les adultes ont le droit de donner leur avis.
    - id: o4
      texte: Parce que la moquerie est autorisée seulement après le débat.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que ressent un camarade si l'on se moque de ce qu'il pense.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Non, dans un débat chacun peut avoir un avis différent ; l'important est de l'exprimer dans le respect.
  - si:
      contient:
      - o3
    relance: Non, les élèves aussi apprennent à débattre et à donner leur avis dans le respect des règles.
  - si:
      contient:
      - o4
    relance: Se moquer d'un camarade est contraire à la fraternité et au respect, pendant comme après le débat.
  solution: Parce qu'il faut s'exprimer avec des mots respectueux sans blesser ceux qui pensent différemment. Tout à fait.
    La fraternité exige le respect d'autrui pour ne blesser personne, quelles que soient ses convictions.
- id: nblm-lequel-de-ces-comportements-illustre-con-5
  type: choix
  difficulte: 2
  enonce: Lequel de ces comportements illustre concrètement la fraternité à l'école ?
  reponse:
    options:
    - id: o1
      texte: Aider un camarade qui a des difficultés à comprendre un exercice, même s'il n'est pas un ami proche.
    - id: o2
      texte: Ne prêter ses affaires qu'à son meilleur ami.
    - id: o3
      texte: Rire quand un élève se trompe en répondant à une question.
    - id: o4
      texte: Garder toutes les explications pour soi pour avoir la meilleure note.
    bonnes:
    - o1
  indices:
    relance: Recherche une action d'entraide envers un élève qui n'est pas forcément ton copain.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : s''entraider uniquement entre amis proches relève de l''amitié, pas de la fraternité qui s''adresse
      à tous.'
  - si:
      contient:
      - o3
    relance: Se moquer d'un camarade va à l'encontre de la fraternité et du respect.
  - si:
      contient:
      - o4
    relance: La fraternité consiste à partager et s'entraider, non à agir de manière égoïste.
  solution: Aider un camarade qui a des difficultés à comprendre un exercice, même s'il n'est pas un ami proche. C'est exact
    ! Apporter son aide à un camarade en difficulté est un bel exemple de fraternité et de solidarité.
- id: nblm-quelles-sont-les-deux-attitudes-indispen-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux attitudes indispensables pour participer à un débat réglé dans un esprit fraternel ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Nuancer son propos en évitant de dire les choses de façon trop tranchée.
    - id: o2
      texte: Modérer son attitude en restant calme et sans couper la parole.
    - id: o3
      texte: Dire n'importe quoi sur les autres participants.
    - id: o4
      texte: Imposer son idée en refusant d'écouter les autres.
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche deux règles qui aident à garder son calme et à exprimer ses idées avec mesure.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est une erreur : un débat réglé n''autorise jamais les attaques ni le manque de respect envers autrui.'
  - si:
      contient:
      - o4
    relance: Non, un débat fraternel nécessite de savoir écouter les arguments des autres.
  solution: Nuancer son propos en évitant de dire les choses de façon trop tranchée ; Modérer son attitude en restant calme
    et sans couper la parole. Oui ! Nuancer ses propos permet d'échanger de manière apaisée sans imposer violemment son avis.
- id: nblm-inscrite-sur-le-fronton-des-ecoles-la-es-7
  type: texte_court
  difficulte: 1
  enonce: Inscrite sur le fronton des écoles, la ... est une valeur fondamentale de la République avec la liberté et l'égalité.
  reponse:
    acceptees:
    - fraternité
    fautes_tolerees: 1
  indices:
    relance: C'est le troisième mot de la devise de la République française.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: fraternité. Le mot « fraternité » complète la devise républicaine « Liberté, Égalité, Fraternité ».
- id: nblm-comment-appelle-t-on-un-echange-d-opinio-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on un échange d'opinions organisé où chacun respecte des règles pour s'exprimer et écouter ? C'est
    un ...
  reponse:
    acceptees:
    - débat réglé
    fautes_tolerees: 1
  indices:
    relance: C'est une expression composée de deux mots qui désigne une discussion organisée en classe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: débat réglé. Un « débat réglé » est une discussion encadrée par des règles de respect et d'écoute mutuelle.
