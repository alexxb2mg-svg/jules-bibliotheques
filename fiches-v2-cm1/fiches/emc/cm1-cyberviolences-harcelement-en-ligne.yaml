- id: nblm-est-ce-que-les-lois-protegent-les-person-5
  type: choix
  difficulte: 2
  enonce: Est-ce que les lois protègent les personnes victimes de cyberviolences sur Internet ?
  reponse:
    options:
    - id: o1
      texte: Oui, car personne n'a le droit de faire du mal, en ligne comme dans la vraie vie
    - id: o2
      texte: Non, car ce qui se passe sur Internet n'est pas grave
    - id: o3
      texte: Non, les lois ne s'appliquent qu'à l'école
    - id: o4
      texte: Oui, mais uniquement si la victime est un adulte
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi si la règle interdisant de faire du mal s'applique aussi en ligne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : penser que le virtuel n''est pas grave est faux, le harcèlement fait beaucoup de mal.'
  - si:
      contient:
      - o3
    relance: 'Faux : les lois s''appliquent partout, dans la rue comme sur Internet.'
  - si:
      contient:
      - o4
    relance: 'Faux : les enfants et les élèves sont également protégés par la loi.'
  solution: 'Oui, car personne n''a le droit de faire du mal, en ligne comme dans la vraie vie. C''est juste : la loi protège
    les victimes et interdit de faire du mal à autrui, y compris derrière un écran.'
- id: nblm-quelles-personnes-sont-des-adultes-de-co-6
  type: choix
  difficulte: 3
  enonce: Quelles personnes sont des adultes de confiance à qui tu peux parler si tu es victime ou témoin de moqueries répétées
    sur les réseaux ? (plusieurs réponses possibles)
  reponse:
    options:
