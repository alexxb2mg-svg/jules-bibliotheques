format: 2
notion: cm1-cyberviolences-harcelement-en-ligne
version: 3
etat: verifiee
declencheurs:
- des messages méchants reçus sur internet
- que faire si on reçoit un message blessant
- des moqueries répétées sur les réseaux
- comment se protéger sur internet et à qui le dire
- on se moque de moi en ligne
- photo de moi partagée sans accord
- méchancetés dans le groupe de classe
- insultes dans un jeu en ligne
prerequis:
- cm1-civisme-numerique
essentiel: 'Les cyberviolences sont des actes méchants ou violents faits à travers Internet, un téléphone ou une tablette.
  Par exemple : un message blessant, une moquerie dans les commentaires d''un jeu en ligne, ou une photo de quelqu''un partagée
  sans son accord.


  Derrière l''écran, il y a toujours une vraie personne. Des mots écrits blessent autant que des mots dits en face. Et un
  message ou une photo peut être vu par beaucoup de monde, très vite.


  Quand ces actes se répètent envers la même personne, on parle de harcèlement en ligne. Un seul message méchant est déjà
  une cyberviolence. Si cela recommence encore et encore, par exemple des moqueries chaque soir contre le même élève dans
  un groupe de discussion, c''est du harcèlement.


  Le harcèlement fait beaucoup de mal à la personne qui le subit. Elle peut avoir peur, se sentir seule, avoir honte, même
  si tout se passe derrière un écran.


  La règle est claire : personne n''a le droit de faire du mal à une autre personne, en ligne comme dans la vraie vie. Internet
  n''est pas un endroit sans règles. Des lois interdisent le harcèlement et protègent les victimes.


  Victime ou témoin, on ne reste jamais seul avec ce problème. On ne répond pas par la méchanceté, on ne partage pas le message
  blessant et on ne s''en moque pas. On en parle tout de suite à un adulte de confiance (parent, enseignant). On peut aussi
  appeler le 3018. C''est le numéro national contre le harcèlement, gratuit et confidentiel.

  '
methode:
- 'Repérer l''acte : un message blessant, une moquerie, une photo partagée sans accord, sur Internet ou par téléphone.'
- Se demander si l'acte se répète envers la même personne. Si oui, c'est du harcèlement en ligne.
- Se souvenir de la règle et de la loi qui interdisent de faire du mal aux autres, en ligne comme ailleurs.
- Ne pas répondre par la méchanceté, ne pas partager le message, ne pas en rire.
- En parler tout de suite à un adulte de confiance ou appeler le 3018.
vocabulaire:
- terme: cyberviolence
  definition: un acte violent ou méchant fait à travers Internet ou un téléphone
- terme: harcèlement en ligne
  definition: des cyberviolences répétées envers la même personne
- terme: victime
  definition: la personne qui subit le mal qu'on lui fait
- terme: témoin
  definition: une personne qui voit ce qui se passe, sans être celle qui fait du mal ni celle qui le subit
- terme: adulte de confiance
  definition: un adulte proche à qui on peut tout dire pour être aidé, comme un parent ou un enseignant
- terme: confidentiel
  definition: ce qu'on dit reste secret entre soi et la personne qui écoute
erreurs_frequentes:
- Croire que ce qui se passe en ligne n'est « pas si grave » que dans la vraie vie.
- Penser qu'il faut régler seul un problème de cyberviolence, sans en parler à un adulte.
- Confondre une plaisanterie partagée entre amis et un acte répété qui fait du mal à quelqu'un.
- Croire qu'on ne fait rien de mal quand on partage ou qu'on rit d'un message moqueur écrit par un autre.
- Penser qu'Internet n'a pas de règles et que la loi ne s'y applique pas.
exemple:
  enonce: Que dois-tu faire si tu es témoin de messages blessants envoyés plusieurs fois à un camarade ?
  solution: 'Ces messages blessants se répètent envers la même personne : c''est du harcèlement en ligne. Je ne les partage
    pas et je n''en ris pas. J''en parle tout de suite à un adulte de confiance, comme un enseignant ou un parent, ou j''appelle
    le 3018. Je ne dois jamais rester seul avec ce genre de situation.'
exercices:
- id: definir-cyberviolence
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une cyberviolence ?
  reponse:
    options:
    - id: a
      texte: Un acte violent ou méchant fait à travers Internet ou un téléphone
    - id: b
      texte: Un jeu vidéo violent
    - id: c
      texte: Un message gentil envoyé à un ami
    bonnes:
    - a
  indices:
    relance: Une cyberviolence concerne-t-elle un jeu, ou un comportement envers une personne ?
    methode: Une cyberviolence est un acte qui fait du mal à une personne, en ligne ou par téléphone.
    etape: Élimine la réponse qui parle d'un jeu et celle qui décrit un message gentil.
  pieges:
  - si:
      contient:
      - b
    relance: 'Un jeu vidéo violent n''est pas en soi une cyberviolence : il s''agit d''un acte fait à une personne réelle.'
  - si:
      contient:
      - c
    relance: 'Un message gentil n''est pas une cyberviolence : c''est même le contraire.'
  solution: Une cyberviolence est un acte violent ou méchant fait à travers Internet ou un téléphone.
- id: reconnaitre-numero-aide
  type: texte_court
  difficulte: 1
  enonce: Quel numéro national, gratuit et confidentiel, peux-tu appeler si tu es victime ou témoin de harcèlement en ligne
    ?
  reponse:
    acceptees:
    - '3018'
    fautes_tolerees: 0
  indices:
    relance: C'est un numéro court, spécialement créé contre le harcèlement.
    methode: Ce numéro figure souvent sur les affiches contre le harcèlement, à l'école.
    etape: Relis la fin de la leçon, là où elle dit à qui parler quand on est victime ou témoin.
  pieges:
  - si:
      valeur: '17'
    relance: Le 17 est le numéro de la police. Cherche plutôt le numéro spécifique contre le harcèlement.
  solution: Le 3018 est le numéro national, gratuit et confidentiel, contre le harcèlement, y compris en ligne.
- id: reperer-cyberviolences
  type: choix
  difficulte: 1
  enonce: Coche toutes les situations qui sont des cyberviolences.
  reponse:
    options:
    - id: photo
      texte: Partager la photo d'un camarade sans son accord pour se moquer de lui
    - id: commentaire
      texte: Écrire des moqueries sous la vidéo d'un élève
    - id: anniversaire
      texte: Envoyer un message de joyeux anniversaire à sa cousine
    - id: insulte
      texte: Envoyer un message blessant à quelqu'un dans un jeu en ligne
    bonnes:
    - photo
    - commentaire
    - insulte
  indices:
    relance: Pour chaque situation, demande-toi si quelqu'un risque d'être blessé ou humilié.
    methode: Une cyberviolence fait du mal à une personne à travers un écran. Il peut y avoir plusieurs bonnes réponses.
    etape: Une seule situation fait plaisir à la personne qui la reçoit. Laisse-la de côté et regarde les autres.
  pieges:
  - si:
      contient:
      - anniversaire
    relance: Ce message fait-il du mal à ta cousine, ou lui fait-il plaisir ?
  - si:
      diagnostic: incomplet
    relance: Tu en as trouvé, mais pas toutes. Relis chaque situation en pensant à la personne qui la subit.
  solution: 'Sont des cyberviolences : partager la photo d''un camarade sans son accord pour se moquer, écrire des moqueries
    sous la vidéo d''un élève, envoyer un message blessant dans un jeu en ligne. Le message d''anniversaire est un message
    gentil.'
- id: distinguer-acte-harcelement
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qui distingue le harcèlement en ligne d'une cyberviolence isolée ?
  reponse:
    options:
    - id: a
      texte: Le harcèlement se répète dans le temps envers la même personne
    - id: b
      texte: Le harcèlement se produit une seule fois
    - id: c
      texte: Le harcèlement n'a lieu qu'entre adultes
    bonnes:
    - a
  indices:
    relance: Le mot « harcèlement » fait penser à quelque chose qui dure, qui revient.
    methode: Un acte isolé peut être une cyberviolence ; s'il se répète envers la même personne, cela devient du harcèlement.
    etape: Élimine la réponse qui dit « une seule fois », et celle qui parle uniquement d'adultes.
  pieges:
  - si:
      contient:
      - b
    relance: 'C''est l''inverse : le harcèlement se caractérise justement par la répétition.'
  - si:
      contient:
      - c
    relance: Le harcèlement en ligne peut concerner des enfants et des adolescents, pas seulement des adultes.
  solution: Le harcèlement en ligne se distingue par la répétition d'actes de cyberviolence envers la même personne.
- id: nommer-actes-repetes
  type: texte_court
  difficulte: 2
  enonce: Chaque soir depuis un mois, des élèves envoient des moqueries à Tom dans un groupe de discussion. Comment appelle-t-on
    ces cyberviolences qui se répètent envers la même personne ?
  reponse:
    acceptees:
    - harcèlement en ligne
    - harcèlement
    - cyberharcèlement
    - harcèlement sur internet
    fautes_tolerees: 1
  indices:
    relance: Les moqueries reviennent tous les soirs. Quel mot de la leçon parle d'actes qui se répètent ?
    methode: Relis le vocabulaire. Une cyberviolence isolée et des cyberviolences répétées ne portent pas le même nom.
    etape: C'est le mot de la leçon qui parle de cyberviolences répétées contre la même personne. Relis sa définition.
  pieges:
  - si:
      valeur: cyberviolence
    relance: Chaque message est bien une cyberviolence. Mais quand cela recommence tous les soirs contre Tom, quel mot plus
      précis emploie-t-on ?
  - si:
      valeur: moquerie
    relance: Ce sont des moqueries, oui. Quel nom donne-t-on quand elles se répètent contre la même personne ?
  solution: 'C''est du harcèlement en ligne (on dit aussi cyberharcèlement) : des cyberviolences répétées envers la même personne,
    ici Tom.'
- id: classer-situations
  type: association
  difficulte: 2
  enonce: Relie chaque situation à ce qu'elle est.
  reponse:
    gauche:
    - id: un-message
      texte: Un élève envoie une fois un message blessant à un camarade
    - id: tous-les-jours
      texte: Plusieurs élèves se moquent tous les jours de la même camarade en ligne
    - id: devoirs
      texte: Deux amis s'envoient des messages pour s'aider à faire leurs devoirs
    droite:
    - id: cyberviolence-isolee
      texte: Une cyberviolence isolée
    - id: harcelement
      texte: Du harcèlement en ligne
    - id: pas-de-cyberviolence
      texte: Pas une cyberviolence
    paires:
      un-message: cyberviolence-isolee
      tous-les-jours: harcelement
      devoirs: pas-de-cyberviolence
  indices:
    relance: Dans quelle situation personne n'est blessé ?
    methode: 'Pose-toi deux questions pour chaque situation : quelqu''un est-il blessé ? Est-ce que cela se répète envers
      la même personne ?'
    etape: Les messages pour les devoirs ne font de mal à personne. Pour les deux autres, regarde combien de fois cela se
      produit.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Regarde bien quelle situation se produit une fois et laquelle se répète.
  - si:
      diagnostic: associations_fausses
    relance: Commence par la situation où personne n'est blessé, puis cherche celle qui se répète.
  solution: 'Un message blessant envoyé une fois : une cyberviolence isolée. Des moqueries tous les jours contre la même camarade
    : du harcèlement en ligne. Des messages pour s''aider aux devoirs : pas une cyberviolence.'
- id: regle-et-loi-en-ligne
  type: choix
  difficulte: 2
  enonce: Lina dit que sur Internet, on peut écrire tout ce qu'on veut sur les autres. Qu'en penses-tu ?
  reponse:
    options:
    - id: regles
      texte: Elle a tort, la règle et la loi interdisent de faire du mal aux autres, en ligne comme dans la vraie vie
    - id: libre
      texte: Elle a raison, Internet est un endroit sans règles
    - id: adultes
      texte: Elle a raison, seuls les adultes doivent respecter des règles en ligne
    bonnes:
    - regles
  indices:
    relance: Une moquerie écrite sur un écran fait-elle moins mal qu'une moquerie dite dans la cour ?
    methode: Rappelle-toi ce que dit la leçon sur les lois et les victimes de cyberviolences.
    etape: Derrière l'écran, il y a une vraie personne. Les règles qui la protègent changent-elles quand on est en ligne ?
  pieges:
  - si:
      contient:
      - libre
    relance: Les personnes qu'on blesse en ligne sont-elles moins protégées que dans la vraie vie ? Relis ce que dit la leçon
      sur les lois.
  - si:
      contient:
      - adultes
    relance: La règle de ne pas faire de mal aux autres concerne-t-elle seulement les adultes, ou tout le monde ?
  solution: Lina a tort. Personne n'a le droit de faire du mal à une autre personne, en ligne comme dans la vraie vie. Des
    lois interdisent le harcèlement et protègent les victimes de cyberviolences.
- id: reagir-dans-l-ordre
  type: ordre
  difficulte: 3
  enonce: Tu vois qu'un camarade reçoit des moqueries dans le groupe de la classe. Range les actions dans l'ordre où tu les
    fais.
  reponse:
    elements:
    - id: voir
      texte: Je remarque les moqueries envoyées à mon camarade
    - id: ne-pas-partager
      texte: Je ne réponds pas méchamment, je ne partage pas et je n'en ris pas
    - id: parler
      texte: J'en parle tout de suite à un adulte de confiance ou j'appelle le 3018
    - id: aide
      texte: L'adulte prend la situation en main pour protéger mon camarade
  indices:
    relance: Par quoi tout commence, et par quoi tout se termine ?
    methode: D'abord on remarque le problème, ensuite on évite de l'aggraver, puis on demande de l'aide.
    etape: Tout commence quand tu remarques les moqueries. Que fais-tu juste après, avant même d'aller voir quelqu'un ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux actions voisines sont inversées. L'adulte peut-il agir avant que tu lui en aies parlé ?
  - si:
      diagnostic: ordre_faux
    relance: Repère la première action (tu remarques) et la dernière (quelqu'un d'autre agit), puis range les deux autres.
  solution: 1. Je remarque les moqueries. 2. Je ne réponds pas méchamment, je ne partage pas et je n'en ris pas. 3. J'en parle
    tout de suite à un adulte de confiance ou j'appelle le 3018. 4. L'adulte prend la situation en main pour protéger mon
    camarade.
- id: expliquer-conduite-a-tenir
  type: ouverte
  difficulte: 3
  enonce: Explique ce que tu dois faire si tu es témoin de cyberviolences envers un camarade, sans décrire les messages eux-mêmes.
  criteres:
  - L'élève indique qu'il ne faut pas rester seul avec cette situation.
  - L'élève indique qu'il faut en parler à un adulte de confiance ou appeler le 3018.
  - L'élève indique qu'il ne faut ni partager les messages, ni en rire, ni répondre par la méchanceté.
  indices:
    relance: Pense à qui peut t'aider si tu vois qu'un camarade reçoit des messages blessants.
    methode: Rappelle-toi qu'il ne faut jamais gérer ce genre de situation seul, et qu'il ne faut pas aggraver les choses.
    etape: 'Tu peux commencer ainsi : « Si je suis témoin de cyberviolences... »'
  solution: Si je suis témoin de cyberviolences, je ne partage pas les messages et je n'en ris pas. Je ne reste pas seul avec
    cette information. J'en parle tout de suite à un adulte de confiance, comme un enseignant ou un parent, ou j'appelle le
    3018, le numéro gratuit et confidentiel contre le harcèlement.
- id: nblm-comment-appelle-t-on-des-actes-violents-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on des actes violents ou méchants qui se répètent envers la même personne sur Internet ou un téléphone
    ?
  reponse:
    options:
    - id: o1
      texte: Le harcèlement en ligne
    - id: o2
      texte: Une simple blague entre amis
    - id: o3
      texte: Un jeu collectif
    - id: o4
      texte: Le civisme numérique
    bonnes:
    - o1
  indices:
    relance: Pense au mot qui désigne des attaques méchantes et répétées sur les réseaux ou par téléphone.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : des actes méchants répétés qui font du mal ne sont pas une simple plaisanterie partagée.'
  - si:
      contient:
      - o3
    relance: 'Faux : faire du mal de façon répétée à quelqu''un n''est jamais un jeu.'
  - si:
      contient:
      - o4
    relance: 'Faux : le civisme numérique désigne au contraire un comportement responsable et respectueux en ligne.'
  solution: 'Le harcèlement en ligne. C''est la bonne réponse : lorsque des cyberviolences se répètent envers la même personne,
    il s''agit d''un harcèlement en ligne.'
- id: nblm-que-designent-les-cyberviolences-lorsqu-2
  type: choix
  difficulte: 2
  enonce: Que désignent les cyberviolences lorsqu'on reçoit des messages blessants ou des moqueries sur Internet ?
  reponse:
    options:
    - id: o1
      texte: Des actes violents ou méchants faits à travers Internet ou un téléphone
    - id: o2
      texte: Des règles de politesse à appliquer en classe
    - id: o3
      texte: Des conseils pour économiser de l'énergie
    - id: o4
      texte: Un mode de vote pour choisir des délégués
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi ce que signifie le préfixe « cyber » associé au mot violence.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : les règles de politesse concernent la civilité, pas les cyberviolences.'
  - si:
      contient:
      - o3
    relance: 'Faux : cela concerne la sobriété numérique.'
  - si:
      contient:
      - o4
    relance: 'Faux : cela concerne la démocratie et les élections.'
  solution: 'Des actes violents ou méchants faits à travers Internet ou un téléphone. C''est exact : les cyberviolences regroupent
    tous les actes méchants réalisés via un écran ou un téléphone.'
- id: nblm-si-tu-recois-un-message-blessant-ou-mech-3
  type: choix
  difficulte: 2
  enonce: Si tu reçois un message blessant ou méchant sur Internet, quelle est la règle essentielle à suivre ?
  reponse:
    options:
    - id: o1
      texte: Ne jamais rester seul et en parler tout de suite à un adulte de confiance
    - id: o2
      texte: Garder le problème pour soi et attendre que ça passe
    - id: o3
      texte: Répondre en envoyant des messages encore plus méchants
    - id: o4
      texte: Cacher son téléphone sous son lit sans rien dire à personne
    bonnes:
    - o1
  indices:
    relance: Pense à ce que tu dois faire pour te protéger et obtenir de l'aide.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : il ne faut surtout pas garder ce problème secret ni rester seul.'
  - si:
      contient:
      - o3
    relance: 'Faux : répondre par la violence n''est pas une solution et aggrave la situation.'
  - si:
      contient:
      - o4
    relance: 'Faux : cacher le problème ne le résout pas, il faut demander de l''aide à un adulte.'
  solution: 'Ne jamais rester seul et en parler tout de suite à un adulte de confiance. C''est la bonne réaction : il faut
    immédiatement avertir un adulte de confiance comme un parent ou un enseignant.'
- id: nblm-quel-est-le-numero-national-gratuit-et-c-4
  type: choix
  difficulte: 2
  enonce: Quel est le numéro national gratuit et confidentiel à appeler en cas de harcèlement en ligne ?
  reponse:
    options:
    - id: o1
      texte: Le 3018
    - id: o2
      texte: Le 112
    - id: o3
      texte: Le 15
    - id: o4
      texte: Le 17
    bonnes:
    - o1
  indices:
