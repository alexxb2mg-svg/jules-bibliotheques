- id: ordre-election-delegues
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes de l'élection des délégués de la classe.
  reponse:
    elements:
    - id: candidats
      texte: Des élèves se présentent comme candidats
    - id: voter
      texte: Chaque élève vote en secret
    - id: compter
      texte: On compte les bulletins
    - id: resultat
      texte: On annonce les élèves qui ont le plus de voix
  indices:
    relance: Peut-on voter s'il n'y a encore personne à choisir ?
    methode: Une élection suit toujours le même chemin, des candidats jusqu'au résultat.
    etape: On ne peut compter les bulletins qu'une fois que tout le monde a voté.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par les élèves qui veulent être choisis, et termine par l'annonce.
  solution: Des élèves se présentent comme candidats, chaque élève vote en secret, on compte les bulletins, puis on annonce
