format: 2
notion: cm1-democratie-suffrage-direct
version: 1
etat: verifiee
declencheurs:
- comment on élit le président de la France
- pourquoi les citoyens votent
- comment fonctionne un vote dans la classe
- qui décide des lois dans un pays démocratique
prerequis: []
couverture: Se limite au sens du mot « démocratie », au fonctionnement du suffrage direct et à une première approche de la
  démocratie scolaire, en s'appuyant sur des exemples simples (élection du président de la République, vote dans la classe).
  Ne détaille pas les mécanismes complets des institutions françaises ni le contenu juridique précis de la Déclaration des
  droits de l'homme et du citoyen.
essentiel: 'Une démocratie est un système où le pouvoir appartient au peuple, c''est-à-dire à l''ensemble des citoyens.


  Dans une démocratie, les citoyens participent aux décisions, notamment en votant. Voter, c''est choisir, parmi plusieurs
  personnes ou propositions, celle que l''on préfère.


  En France, le président de la République est élu au suffrage direct : ce sont les citoyens eux-mêmes qui votent directement
  pour choisir le président, sans intermédiaire.


  Dans une démocratie, tous les citoyens sont égaux devant la loi : chacun a le droit de voter et chaque voix compte de la
  même façon.


  On peut retrouver ces principes à petite échelle dans une classe ou une école, par exemple lorsque les élèves votent pour
  élire des délégués.

  '
methode:
- 'Repérer qui prend la décision : une seule personne, ou l''ensemble des citoyens.'
- Vérifier si le vote se fait directement par les citoyens (suffrage direct) ou par des intermédiaires.
- 'Relier l''exemple étudié (élection, vote de classe) aux principes de la démocratie : participation et égalité.'
vocabulaire:
- terme: démocratie
  definition: un système où le pouvoir appartient à l'ensemble des citoyens, qui participent aux décisions
- terme: suffrage direct
  definition: un vote où les citoyens choisissent eux-mêmes directement une personne ou une proposition, sans intermédiaire
erreurs_frequentes:
- Croire qu'une seule personne peut décider seule dans une démocratie.
- Confondre suffrage direct (les citoyens votent eux-mêmes) et une décision prise par une seule autorité sans vote.
- Penser que voter n'est utile que pour les adultes, alors que la démocratie scolaire permet aussi aux élèves de participer.
exemple:
  enonce: Explique comment le président de la République est élu en France.
  solution: 'Le président de la République est élu au suffrage direct : ce sont les citoyens français qui votent eux-mêmes
    directement pour choisir le président, parmi plusieurs candidats.'
exercices:
- id: definir-democratie
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une démocratie ?
  reponse:
    options:
    - id: a
      texte: Un système où le pouvoir appartient à l'ensemble des citoyens
    - id: b
      texte: Un système où une seule personne décide de tout, sans vote
    - id: c
      texte: Un système où seuls les plus riches peuvent voter
    bonnes:
    - a
  indices:
    relance: 'Dans une démocratie, qui participe aux décisions : une seule personne, ou tous les citoyens ?'
    methode: Le mot « démocratie » vient du grec et signifie « le pouvoir du peuple ».
    etape: Élimine les réponses où une seule personne, ou un petit groupe, décide seul.
  pieges:
  - si:
      contient:
      - b
    relance: C'est le contraire d'une démocratie, où une seule personne déciderait sans vote.
  - si:
      contient:
      - c
    relance: Dans une démocratie, tous les citoyens ont le droit de voter, quels que soient leurs revenus.
  solution: Une démocratie est un système où le pouvoir appartient à l'ensemble des citoyens.
- id: identifier-suffrage-direct
  type: choix
  difficulte: 1
  enonce: Comment le président de la République est-il élu en France ?
  reponse:
    options:
    - id: a
      texte: Au suffrage direct, par les citoyens eux-mêmes
    - id: b
      texte: Par une seule personne qui choisit pour tout le monde
    - id: c
      texte: Par tirage au sort parmi les citoyens
    bonnes:
    - a
  indices:
    relance: Qui vote directement pour choisir le président en France ?
    methode: Le suffrage direct veut dire que les citoyens votent eux-mêmes, sans intermédiaire.
    etape: Ce n'est ni une seule personne qui décide, ni un tirage au sort.
  pieges:
  - si:
      contient:
      - b
    relance: Dans une démocratie, ce ne sont pas une seule personne qui choisit, mais les citoyens qui votent.
  - si:
      contient:
      - c
    relance: L'élection du président ne se fait pas par tirage au sort, mais par un vote direct des citoyens.
  solution: Le président de la République est élu au suffrage direct, par les citoyens eux-mêmes.
- id: associer-democratie-principe
  type: association
  difficulte: 2
  enonce: Associe chaque exemple au principe de démocratie qu'il illustre.
  reponse:
    gauche:
    - id: a
      texte: Tous les citoyens ont le droit de voter
    - id: b
      texte: Chaque voix compte de la même façon
    - id: c
      texte: Les élèves votent pour élire leurs délégués
    droite:
    - id: x
      texte: Participation des citoyens
    - id: y
      texte: Égalité devant la loi
    - id: z
      texte: Démocratie scolaire
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Repère dans chaque exemple le mot-clé : voter, égalité, délégués.'
    methode: Associe chaque exemple au principe le plus proche du mot-clé qu'il contient.
    etape: « Tous les citoyens ont le droit de voter » concerne la participation.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque exemple.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord l'exemple sur les délégués de classe, lié à la démocratie scolaire.
  solution: Le droit de vote de tous les citoyens illustre la participation. Chaque voix qui compte pareil illustre l'égalité
    devant la loi. Le vote des délégués illustre la démocratie scolaire.
- id: expliquer-suffrage-direct
  type: ouverte
  difficulte: 3
  enonce: Explique ce qu'est le suffrage direct, en donnant l'exemple de l'élection du président de la République et un exemple
    de vote dans la classe.
  criteres:
  - L'élève explique que le suffrage direct signifie que les citoyens votent eux-mêmes, sans intermédiaire.
  - L'élève donne l'exemple de l'élection présidentielle française.
  - L'élève relie cette notion à un exemple de vote dans la classe ou l'école (élection de délégués).
  indices:
    relance: Pense à qui vote directement pour élire le président, et à comment on élit les délégués dans une classe.
    methode: Explique d'abord le principe du suffrage direct, puis illustre-le avec les deux exemples.
    etape: 'Tu peux commencer ainsi : « Le suffrage direct, c''est... »'
  solution: Le suffrage direct, c'est le fait que les citoyens votent eux-mêmes directement, sans intermédiaire. En France,
    le président de la République est élu ainsi, par tous les citoyens qui votent. Dans une classe, on retrouve ce principe
    quand les élèves votent directement pour élire leurs délégués.
