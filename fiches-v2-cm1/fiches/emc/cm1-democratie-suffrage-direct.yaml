    relance: Dans quelle situation tous les élèves participent-ils à la décision ?
    methode: Une décision démocratique est prise par tous, et chaque voix compte de la même façon.
    etape: Élimine la situation où une seule personne décide, et celle où certains sont écartés.
  pieges:
  - si:
