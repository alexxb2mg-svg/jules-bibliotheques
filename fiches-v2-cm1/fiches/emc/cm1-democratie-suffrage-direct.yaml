format: 2
notion: cm1-democratie-suffrage-direct
version: 3
etat: verifiee
declencheurs:
- comment on élit le président de la France
- pourquoi les citoyens votent
- comment fonctionne un vote dans la classe
- qui décide des lois dans un pays démocratique
- élire les délégués
- glisser un bulletin dans l'urne
- le peuple qui décide
- c'est quoi une élection
prerequis: []
couverture: Ne détaille pas les mécanismes complets des institutions françaises ni le texte juridique précis de la Déclaration
  des droits de l'homme et du citoyen.
essentiel: 'Une démocratie est un système où le pouvoir appartient au peuple, c''est-à-dire à l''ensemble des citoyens. Les
  citoyens participent aux décisions, notamment en votant.


  Voter, c''est choisir, parmi plusieurs personnes ou propositions, celle que l''on préfère. Une élection est un vote pour
  choisir une personne. Chacun vote librement, et la personne qui a le plus de voix est élue.


  Le suffrage direct, c''est quand les citoyens votent eux-mêmes, sans intermédiaire. En France, le président de la République
  est élu au suffrage direct : les citoyens votent directement pour le choisir.


  La Déclaration des droits de l''homme et du citoyen donne de grands principes de la démocratie. La souveraineté populaire
  : le pouvoir vient du peuple (article 3). La volonté générale : la loi exprime ce que veulent les citoyens, et tous sont
  égaux devant la loi (article 6). La séparation des pouvoirs : ceux qui font les lois ne sont pas ceux qui jugent, pour que
  personne n''ait tous les pouvoirs (article 16).


  On retrouve ces principes à l''école. C''est la démocratie scolaire : les élèves élisent leurs délégués, chaque voix compte
  de la même façon, et les règles de la classe s''appliquent à tous.

  '
methode:
- 'Repérer qui prend la décision : une seule personne, ou l''ensemble des citoyens.'
- Vérifier si chacun a le droit de voter et si chaque voix compte pareil.
- Vérifier si le vote se fait directement par les citoyens (suffrage direct) ou par des intermédiaires.
- Relier l'exemple à un principe (souveraineté populaire, égalité devant la loi, séparation des pouvoirs).
- Comparer avec un vote dans la classe ou dans l'école.
vocabulaire:
- terme: démocratie
  definition: un système où le pouvoir appartient à l'ensemble des citoyens, qui participent aux décisions
- terme: suffrage direct
  definition: un vote où les citoyens choisissent eux-mêmes directement une personne ou une proposition, sans intermédiaire
- terme: citoyen
  definition: une personne qui fait partie d'un pays, avec des droits, comme celui de voter, et des devoirs
- terme: souveraineté populaire
  definition: l'idée que le pouvoir appartient au peuple
- terme: égalité devant la loi
  definition: la même loi s'applique à tous, de la même façon
- terme: séparation des pouvoirs
  definition: le fait que les pouvoirs sont partagés entre plusieurs personnes, pour que personne ne les ait tous
erreurs_frequentes:
- Croire qu'une seule personne peut décider seule dans une démocratie.
- Confondre suffrage direct (les citoyens votent eux-mêmes) et une décision prise par une seule autorité sans vote.
- Penser que voter n'est utile que pour les adultes, alors que la démocratie scolaire permet aussi aux élèves de participer.
- Croire qu'un délégué de classe peut tout décider seul, alors qu'il représente les élèves et respecte les règles.
exemple:
  enonce: Explique comment le président de la République est élu en France.
  solution: 'Le président de la République est élu au suffrage direct : ce sont les citoyens français qui votent eux-mêmes
    directement pour choisir le président, parmi plusieurs candidats. Chaque voix compte de la même façon.'
exercices:
- id: definir-democratie
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une démocratie ?
  reponse:
    options:
    - id: a
      texte: Un système où le pouvoir appartient à l'ensemble des citoyens
    - id: b
      texte: Un système où une seule personne décide de tout, sans vote
    - id: c
      texte: Un système où seuls les plus riches peuvent voter
    bonnes:
    - a
  indices:
    relance: 'Dans une démocratie, qui participe aux décisions : une seule personne, ou tous les citoyens ?'
    methode: Le mot « démocratie » vient du grec et signifie « le pouvoir du peuple ».
    etape: Élimine les réponses où une seule personne, ou un petit groupe, décide seul.
  pieges:
  - si:
      contient:
      - b
    relance: C'est le contraire d'une démocratie, où une seule personne déciderait sans vote.
  - si:
      contient:
      - c
    relance: Dans une démocratie, tous les citoyens ont le droit de voter, quels que soient leurs revenus.
  solution: Une démocratie est un système où le pouvoir appartient à l'ensemble des citoyens.
- id: identifier-suffrage-direct
  type: choix
  difficulte: 1
  enonce: Comment le président de la République est-il élu en France ?
  reponse:
    options:
    - id: a
      texte: Au suffrage direct, par les citoyens eux-mêmes
    - id: b
      texte: Par une seule personne qui choisit pour tout le monde
    - id: c
      texte: Par tirage au sort parmi les citoyens
    bonnes:
    - a
  indices:
    relance: Qui vote directement pour choisir le président en France ?
    methode: Le suffrage direct veut dire que les citoyens votent eux-mêmes, sans intermédiaire.
    etape: Ce n'est ni une seule personne qui décide, ni un tirage au sort.
  pieges:
  - si:
      contient:
      - b
    relance: Dans une démocratie, ce n'est pas une seule personne qui choisit, mais les citoyens qui votent.
  - si:
      contient:
      - c
    relance: L'élection du président ne se fait pas par tirage au sort, mais par un vote direct des citoyens.
  solution: Le président de la République est élu au suffrage direct, par les citoyens eux-mêmes.
