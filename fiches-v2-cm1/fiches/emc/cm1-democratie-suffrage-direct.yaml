format: 2
notion: cm1-democratie-suffrage-direct
version: 2
etat: verifiee
declencheurs:
- comment on élit le président de la France
- pourquoi les citoyens votent
- comment fonctionne un vote dans la classe
- qui décide des lois dans un pays démocratique
- élire les délégués
- glisser un bulletin dans l'urne
- le peuple qui décide
- c'est quoi une élection
prerequis: []
couverture: Ne détaille pas les mécanismes complets des institutions françaises ni le texte juridique précis de la Déclaration
  des droits de l'homme et du citoyen.
essentiel: 'Une démocratie est un système où le pouvoir appartient au peuple, c''est-à-dire à l''ensemble des citoyens. Les
  citoyens participent aux décisions, notamment en votant.


  Voter, c''est choisir, parmi plusieurs personnes ou propositions, celle que l''on préfère. Une élection est un vote pour
  choisir une personne. Chacun vote librement, et la personne qui a le plus de voix est élue.


  Le suffrage direct, c''est quand les citoyens votent eux-mêmes, sans intermédiaire. En France, le président de la République
  est élu au suffrage direct : les citoyens votent directement pour le choisir.


  La Déclaration des droits de l''homme et du citoyen donne de grands principes de la démocratie. La souveraineté populaire
  : le pouvoir vient du peuple (article 3). La volonté générale : la loi exprime ce que veulent les citoyens, et tous sont
  égaux devant la loi (article 6). La séparation des pouvoirs : ceux qui font les lois ne sont pas ceux qui jugent, pour que
  personne n''ait tous les pouvoirs (article 16).


  On retrouve ces principes à l''école. C''est la démocratie scolaire : les élèves élisent leurs délégués, chaque voix compte
  de la même façon, et les règles de la classe s''appliquent à tous.

  '
methode:
- 'Repérer qui prend la décision : une seule personne, ou l''ensemble des citoyens.'
- Vérifier si chacun a le droit de voter et si chaque voix compte pareil.
- Vérifier si le vote se fait directement par les citoyens (suffrage direct) ou par des intermédiaires.
- Relier l'exemple à un principe (souveraineté populaire, égalité devant la loi, séparation des pouvoirs).
- Comparer avec un vote dans la classe ou dans l'école.
vocabulaire:
- terme: démocratie
  definition: un système où le pouvoir appartient à l'ensemble des citoyens, qui participent aux décisions
- terme: suffrage direct
  definition: un vote où les citoyens choisissent eux-mêmes directement une personne ou une proposition, sans intermédiaire
- terme: citoyen
  definition: une personne qui fait partie d'un pays, avec des droits, comme celui de voter, et des devoirs
- terme: souveraineté populaire
  definition: l'idée que le pouvoir appartient au peuple
- terme: égalité devant la loi
  definition: la même loi s'applique à tous, de la même façon
- terme: séparation des pouvoirs
  definition: le fait que les pouvoirs sont partagés entre plusieurs personnes, pour que personne ne les ait tous
erreurs_frequentes:
- Croire qu'une seule personne peut décider seule dans une démocratie.
- Confondre suffrage direct (les citoyens votent eux-mêmes) et une décision prise par une seule autorité sans vote.
- Penser que voter n'est utile que pour les adultes, alors que la démocratie scolaire permet aussi aux élèves de participer.
- Croire qu'un délégué de classe peut tout décider seul, alors qu'il représente les élèves et respecte les règles.
exemple:
  enonce: Explique comment le président de la République est élu en France.
  solution: 'Le président de la République est élu au suffrage direct : ce sont les citoyens français qui votent eux-mêmes
    directement pour choisir le président, parmi plusieurs candidats. Chaque voix compte de la même façon.'
exercices:
- id: definir-democratie
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une démocratie ?
  reponse:
    options:
    - id: a
      texte: Un système où le pouvoir appartient à l'ensemble des citoyens
    - id: b
      texte: Un système où une seule personne décide de tout, sans vote
    - id: c
      texte: Un système où seuls les plus riches peuvent voter
    bonnes:
    - a
  indices:
    relance: 'Dans une démocratie, qui participe aux décisions : une seule personne, ou tous les citoyens ?'
    methode: Le mot « démocratie » vient du grec et signifie « le pouvoir du peuple ».
    etape: Élimine les réponses où une seule personne, ou un petit groupe, décide seul.
  pieges:
  - si:
      contient:
      - b
    relance: C'est le contraire d'une démocratie, où une seule personne déciderait sans vote.
  - si:
      contient:
      - c
    relance: Dans une démocratie, tous les citoyens ont le droit de voter, quels que soient leurs revenus.
  solution: Une démocratie est un système où le pouvoir appartient à l'ensemble des citoyens.
- id: identifier-suffrage-direct
  type: choix
  difficulte: 1
  enonce: Comment le président de la République est-il élu en France ?
  reponse:
    options:
    - id: a
      texte: Au suffrage direct, par les citoyens eux-mêmes
    - id: b
      texte: Par une seule personne qui choisit pour tout le monde
    - id: c
      texte: Par tirage au sort parmi les citoyens
    bonnes:
    - a
  indices:
    relance: Qui vote directement pour choisir le président en France ?
    methode: Le suffrage direct veut dire que les citoyens votent eux-mêmes, sans intermédiaire.
    etape: Ce n'est ni une seule personne qui décide, ni un tirage au sort.
  pieges:
  - si:
      contient:
      - b
    relance: Dans une démocratie, ce n'est pas une seule personne qui choisit, mais les citoyens qui votent.
  - si:
      contient:
      - c
    relance: L'élection du président ne se fait pas par tirage au sort, mais par un vote direct des citoyens.
  solution: Le président de la République est élu au suffrage direct, par les citoyens eux-mêmes.
- id: mot-voter
  type: texte_court
  difficulte: 1
  enonce: Dans une démocratie, comment appelle-t-on l'action de choisir une personne ou une proposition en donnant sa voix
    ?
  reponse:
    acceptees:
    - voter
    - le vote
    - vote
    fautes_tolerees: 1
  indices:
    relance: Dans la classe, que fait-on pour élire les délégués ?
    methode: On glisse un bulletin dans une urne. Quel verbe décrit cette action ?
    etape: Le mot commence par « vo- ».
  pieges:
  - si:
      valeur: élire
    relance: Élire, c'est choisir une personne. Quel mot plus général désigne le fait de donner sa voix ?
  solution: C'est voter. Voter, c'est choisir en donnant sa voix.
- id: reperer-situation-democratique
  type: choix
  difficulte: 2
  enonce: Dans une classe, laquelle de ces façons de choisir le jeu de la fête est démocratique ?
  reponse:
    options:
    - id: a
      texte: Chaque élève vote, et le jeu qui a le plus de voix est choisi
    - id: b
      texte: L'élève le plus grand choisit seul pour toute la classe
    - id: c
      texte: Seuls les garçons ont le droit de voter
    bonnes:
    - a
  indices:
    relance: Dans quelle situation tous les élèves participent-ils à la décision ?
    methode: Une décision démocratique est prise par tous, et chaque voix compte de la même façon.
    etape: Élimine la situation où une seule personne décide, et celle où certains sont écartés.
  pieges:
  - si:
      contient:
      - b
    relance: Une seule personne décide pour tous. Les autres élèves participent-ils ?
  - si:
      contient:
      - c
    relance: Une partie de la classe ne peut pas voter. Est-ce que tout le monde est égal ?
  solution: Le choix est démocratique quand chaque élève vote et que le jeu qui a le plus de voix est choisi.
- id: associer-democratie-principe
  type: association
  difficulte: 2
  enonce: Associe chaque exemple au principe de démocratie qu'il illustre.
  reponse:
    gauche:
    - id: a
      texte: Tous les citoyens ont le droit de voter
    - id: b
      texte: Chaque voix compte de la même façon
    - id: c
      texte: Les élèves votent pour élire leurs délégués
    droite:
    - id: x
      texte: Participation des citoyens
    - id: y
      texte: Égalité devant la loi
    - id: z
      texte: Démocratie scolaire
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Repère dans chaque exemple le mot-clé : voter, égalité, délégués.'
    methode: Associe chaque exemple au principe le plus proche du mot-clé qu'il contient.
    etape: « Tous les citoyens ont le droit de voter » concerne la participation.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque exemple.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord l'exemple sur les délégués de classe, lié à la démocratie scolaire.
  solution: Le droit de vote de tous les citoyens illustre la participation. Chaque voix qui compte pareil illustre l'égalité
    devant la loi. Le vote des délégués illustre la démocratie scolaire.
- id: associer-principe-ddhc
  type: association
  difficulte: 3
  enonce: Associe chaque grand principe de la Déclaration des droits de l'homme et du citoyen à ce qu'il veut dire.
  reponse:
    gauche:
    - id: a
      texte: Souveraineté populaire
    - id: b
      texte: Égalité devant la loi
    - id: c
      texte: Séparation des pouvoirs
    droite:
    - id: x
      texte: Le pouvoir vient du peuple
    - id: y
      texte: La même loi s'applique à tous
    - id: z
      texte: Personne n'a tous les pouvoirs à la fois
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Dans « souveraineté populaire », quel mot fait penser au peuple ?
    methode: Cherche dans chaque principe un mot qui se retrouve dans sa définition (peuple, égalité, séparer).
    etape: Séparer les pouvoirs, c'est les partager entre plusieurs personnes.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis le principe sur les pouvoirs.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le principe qui contient le mot « populaire ». Il parle de qui ?
  solution: La souveraineté populaire veut dire que le pouvoir vient du peuple. L'égalité devant la loi veut dire que la même
    loi s'applique à tous. La séparation des pouvoirs veut dire que personne n'a tous les pouvoirs à la fois.
- id: ordre-election-delegues
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes de l'élection des délégués de la classe.
  reponse:
    elements:
    - id: candidats
      texte: Des élèves se présentent comme candidats
    - id: voter
      texte: Chaque élève vote en secret
    - id: compter
      texte: On compte les bulletins
    - id: resultat
      texte: On annonce les élèves qui ont le plus de voix
  indices:
    relance: Peut-on voter s'il n'y a encore personne à choisir ?
    methode: Une élection suit toujours le même chemin, des candidats jusqu'au résultat.
    etape: On ne peut compter les bulletins qu'une fois que tout le monde a voté.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par les élèves qui veulent être choisis, et termine par l'annonce.
  solution: Des élèves se présentent comme candidats, chaque élève vote en secret, on compte les bulletins, puis on annonce
    les élèves qui ont le plus de voix.
- id: expliquer-suffrage-direct
  type: ouverte
  difficulte: 3
  enonce: Explique ce qu'est le suffrage direct, en donnant l'exemple de l'élection du président de la République et un exemple
    de vote dans la classe.
  criteres:
  - L'élève explique que le suffrage direct signifie que les citoyens votent eux-mêmes, sans intermédiaire.
  - L'élève donne l'exemple de l'élection présidentielle française.
  - L'élève relie cette notion à un exemple de vote dans la classe ou l'école (élection de délégués).
  indices:
    relance: Pense à qui vote directement pour élire le président, et à comment on élit les délégués dans une classe.
    methode: Explique d'abord le principe du suffrage direct, puis illustre-le avec les deux exemples.
    etape: 'Tu peux commencer ainsi : « Le suffrage direct, c''est... »'
  solution: Le suffrage direct, c'est le fait que les citoyens votent eux-mêmes directement, sans intermédiaire. En France,
    le président de la République est élu ainsi, par tous les citoyens qui votent. Dans une classe, on retrouve ce principe
    quand les élèves votent directement pour élire leurs délégués.
