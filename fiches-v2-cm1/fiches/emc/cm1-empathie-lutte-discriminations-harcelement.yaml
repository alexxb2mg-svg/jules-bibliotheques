format: 2
notion: cm1-empathie-lutte-discriminations-harcelement
version: 3
etat: verifiee
declencheurs:
- se mettre à la place de quelqu'un qui souffre
- pourquoi il faut se soucier des autres
- ne penser qu'à soi ou penser aux autres
- comprendre ce que ressent un camarade triste
- il pense qu'à lui
- personne veut jouer avec lui
- défendre un camarade embêté
- aider quelqu'un qui pleure
prerequis:
- cm1-egalite-en-droit-dignite-personne
essentiel: 'L''empathie, c''est la capacité à comprendre et à ressentir ce que vit une autre personne. On se met à sa place.
  On se demande : « Comment je me sentirais, moi, si cela m''arrivait ? »


  L''empathie permet de remarquer qu''un camarade est triste, seul ou blessé. Elle donne envie de l''écouter, de l''aider
  ou d''aller chercher un adulte. Elle aide aussi à réfléchir avant de parler ou d''agir.


  L''empathie est un moteur pour lutter contre ce qui fait du mal aux autres. Une discrimination, c''est traiter quelqu''un
  moins bien à cause d''une différence. La violence peut être physique (frapper, pousser) ou verbale (insulter, se moquer).
  Le harcèlement, ce sont des moqueries ou des violences répétées contre la même personne. Les cyberviolences sont des violences
  faites sur Internet ou par téléphone.


  Quand on se met à la place de la victime, on comprend que ce n''est jamais « pour rire ». Alors on refuse de participer,
  on soutient la victime et on prévient un adulte de confiance.


  L''égoïsme, c''est ne penser qu''à soi, sans se soucier des autres. L''altruisme, c''est le contraire : se soucier du bien-être
  des autres. En classe, on définit ces deux mots en discutant ensemble. Garder le ballon pour soi toute la récréation, c''est
  égoïste. Prêter sa règle à un voisin qui l''a oubliée, c''est altruiste.

  '
methode:
- 'Observer la personne : son visage, ses gestes, ses mots.'
- Se mettre à sa place et se demander ce qu'elle ressent.
- Repérer s'il s'agit d'une moquerie, d'une mise à l'écart, d'une violence ou de harcèlement.
- 'Choisir une action bienveillante : écouter, soutenir, refuser de participer.'
- Prévenir un adulte de confiance quand quelqu'un souffre ou est en danger.
vocabulaire:
- terme: empathie
  definition: la capacité à comprendre et à ressentir ce que vit une autre personne, en se mettant à sa place
- terme: altruisme
  definition: le fait de se soucier du bien-être des autres, parfois avant le sien
- terme: égoïsme
  definition: le fait de ne penser qu'à soi-même, sans se soucier des autres
- terme: discrimination
  definition: le fait de traiter une personne moins bien qu'une autre à cause d'une différence
- terme: harcèlement
  definition: des moqueries ou des violences répétées contre la même personne
- terme: cyberviolence
  definition: une violence faite sur Internet ou par téléphone, par exemple des messages méchants
erreurs_frequentes:
- Confondre empathie (comprendre ce que ressent l'autre) et sympathie (aimer quelqu'un).
- 'Confondre égoïsme et altruisme : l''un pense à soi, l''autre pense aux autres.'
- Croire que l'empathie ne sert qu'à être gentil, alors qu'elle aide aussi à comprendre pourquoi certains comportements font
  du mal.
- 'Penser que rire d''une moquerie sans rien dire n''est pas grave : ce rire encourage celui qui se moque.'
exemple:
  enonce: Explique comment l'empathie peut aider à lutter contre le harcèlement.
  solution: Grâce à l'empathie, un élève peut imaginer ce que ressent un camarade harcelé et comprendre que c'est douloureux,
    même si les autres disent que c'est « pour rire ». Cela l'aide à ne jamais participer, à soutenir son camarade (lui parler,
    rester avec lui) et à prévenir un adulte de confiance.
exercices:
- id: definir-empathie
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que l'empathie ?
  reponse:
    options:
    - id: a
      texte: La capacité à comprendre et à ressentir ce que vit une autre personne
    - id: b
      texte: Le fait de ne penser qu'à soi-même
    - id: c
      texte: Le fait d'ignorer les sentiments des autres
    bonnes:
    - a
  indices:
    relance: L'empathie tourne-t-elle autour de soi, ou autour des autres ?
    methode: L'empathie, c'est se mettre à la place d'une autre personne pour comprendre ce qu'elle ressent.
    etape: Élimine les réponses qui parlent d'ignorer ou de ne penser qu'à soi.
  pieges:
  - si:
      contient:
      - b
    relance: C'est plutôt la définition de l'égoïsme, le contraire de l'empathie.
  - si:
      contient:
      - c
    relance: Ignorer les sentiments des autres est le contraire de l'empathie.
  solution: L'empathie est la capacité à comprendre et à ressentir ce que vit une autre personne.
- id: mot-egoisme
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le fait de ne penser qu'à soi, sans se soucier des autres ?
  reponse:
    acceptees:
    - égoïsme
    - egoisme
    fautes_tolerees: 1
  indices:
    relance: C'est le contraire de l'altruisme.
    methode: Pense au mot qu'on emploie pour un enfant qui garde tout pour lui, puis cherche le nom qui va avec.
    etape: Relis le dernier paragraphe de l'essentiel. Garder le ballon pour soi toute la récréation montre ce défaut.
  pieges:
  - si:
      valeur: altruisme
    relance: L'altruisme, c'est penser aux autres. Le mot cherché veut dire l'inverse.
  - si:
      valeur: méchanceté
    relance: On peut ne penser qu'à soi sans être méchant. Quel mot précis désigne le fait de penser seulement à soi ?
  solution: L'égoïsme, c'est le fait de ne penser qu'à soi, sans se soucier des autres. Son contraire est l'altruisme.
- id: distinguer-egoisme-altruisme
  type: association
  difficulte: 2
  enonce: 'Associe chaque comportement à la notion qu''il illustre : égoïsme ou altruisme.'
  reponse:
    gauche:
    - id: a
      texte: Partager son goûter avec un camarade qui n'en a pas
    - id: b
      texte: Garder toutes les affaires communes pour soi
    droite:
    - id: x
      texte: Altruisme
    - id: y
      texte: Égoïsme
    paires:
      a: x
      b: y
  indices:
    relance: L'un des deux comportements profite à une autre personne, l'autre ne profite qu'à soi-même.
    methode: Repère si le comportement pense d'abord à soi ou d'abord aux autres.
    etape: 'Partager avec quelqu''un d''autre profite à cette personne : c''est de l''altruisme.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux comportements.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le comportement de partage, qui illustre l'altruisme.
  solution: Partager son goûter illustre l'altruisme. Garder les affaires communes pour soi illustre l'égoïsme.
- id: role-empathie-discrimination
  type: choix
  difficulte: 2
  enonce: En quoi l'empathie peut-elle aider à lutter contre les discriminations ?
  reponse:
    options:
    - id: a
      texte: Elle aide à comprendre la souffrance causée par une discrimination et à ne pas la reproduire
    - id: b
      texte: Elle n'a aucun lien avec les discriminations
    - id: c
      texte: Elle sert uniquement à se faire des amis
    bonnes:
    - a
  indices:
    relance: Se mettre à la place de la personne discriminée aide-t-il à comprendre pourquoi c'est injuste ?
    methode: L'empathie permet d'imaginer ce que ressent une personne discriminée, et donc d'éviter ce comportement.
    etape: Élimine la réponse qui nie tout lien, et celle qui réduit l'empathie à l'amitié.
  pieges:
  - si:
      contient:
      - b
    relance: L'empathie a justement un lien fort avec la lutte contre les discriminations.
  - si:
      contient:
      - c
    relance: 'L''empathie va au-delà de l''amitié : elle aide aussi à comprendre la souffrance des autres.'
  solution: L'empathie aide à comprendre la souffrance causée par une discrimination et donc à ne pas la reproduire.
- id: reconnaitre-harcelement
  type: choix
  difficulte: 2
  enonce: Laquelle de ces situations est du harcèlement ?
  reponse:
    options:
    - id: a
      texte: Un groupe se moque chaque jour du même élève
    - id: b
      texte: Deux amis se disputent une fois, puis se réconcilient
    - id: c
      texte: Un élève rate son tir au football et ses camarades l'encouragent
    bonnes:
    - a
  indices:
    relance: Le harcèlement arrive-t-il une seule fois, ou revient-il souvent ?
    methode: Cherche une situation où la même personne subit des moqueries ou des violences, encore et encore.
    etape: Une dispute qui se termine par une réconciliation ne se répète pas. Des encouragements ne font pas de mal.
  pieges:
  - si:
      contient:
      - b
    relance: Une dispute unique, suivie d'une réconciliation, n'est pas du harcèlement. Qu'est-ce qui se répète contre la
      même personne ?
  - si:
      contient:
      - c
    relance: Encourager un camarade, c'est le soutenir. Cherche une situation qui fait souffrir quelqu'un, encore et encore.
  solution: Un groupe qui se moque chaque jour du même élève, c'est du harcèlement, car les moqueries sont répétées contre
    la même personne.
- id: associer-violences
  type: association
  difficulte: 2
  enonce: Associe chaque comportement au mot qui le désigne.
  reponse:
    gauche:
    - id: a
      texte: Pousser un camarade dans le rang
    - id: b
      texte: Insulter un camarade
    - id: c
      texte: Envoyer des messages méchants à un camarade sur un téléphone
    - id: d
      texte: Refuser un élève dans un jeu à cause de son origine
    droite:
    - id: x
      texte: Violence physique
    - id: y
      texte: Violence verbale
    - id: z
      texte: Cyberviolence
    - id: w
      texte: Discrimination
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Lequel de ces comportements touche le corps ? Lequel passe par des mots dits à voix haute ?
    methode: Physique veut dire « avec le corps », verbal veut dire « avec des mots », cyber veut dire « par un écran ».
    etape: Écarter quelqu'un à cause d'une différence, c'est le traiter moins bien que les autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis le comportement qui passe par un écran.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le comportement qui touche le corps, puis par celui qui passe par un téléphone.
  solution: Pousser est une violence physique. Insulter est une violence verbale. Les messages méchants par téléphone sont
    une cyberviolence. Refuser un élève à cause de son origine est une discrimination.
- id: agir-avec-empathie
  type: ordre
  difficulte: 3
  enonce: À la récréation, tu vois un camarade seul et triste. Range ces actions dans l'ordre où tu les fais.
  reponse:
    elements:
    - id: remarquer
      texte: Je remarque que mon camarade est seul et triste
    - id: imaginer
      texte: Je me mets à sa place et j'imagine ce qu'il ressent
    - id: ecouter
      texte: Je vais lui parler et je l'écoute
    - id: prevenir
      texte: S'il me dit qu'on l'embête souvent, je préviens un adulte de confiance
  indices:
    relance: Que faut-il faire en tout premier pour pouvoir aider quelqu'un ?
    methode: On voit d'abord, puis on comprend, puis on agit.
    etape: Avant d'aller lui parler, tu dois d'abord t'apercevoir qu'il ne va pas bien.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux actions voisines sont inversées. Laquelle doit venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Pars de ce que tu vois, termine par l'aide d'un adulte, puis range les deux autres actions entre les deux.
  solution: Je remarque qu'il est seul et triste, je me mets à sa place, je vais lui parler et je l'écoute, puis, si on l'embête
    souvent, je préviens un adulte de confiance.
- id: expliquer-empathie-altruisme
  type: ouverte
  difficulte: 3
  enonce: Explique ce qu'est l'empathie et donne un exemple simple de comportement altruiste qui aide à lutter contre le harcèlement,
    sans décrire de scène violente.
  criteres:
  - L'élève définit l'empathie comme la capacité à comprendre ce que ressent une autre personne.
  - L'élève donne un exemple concret et bienveillant de comportement altruiste (soutenir, écouter, en parler à un adulte).
  - L'élève relie l'empathie au refus du harcèlement (comprendre que cela fait souffrir, refuser d'y participer).
  indices:
    relance: Pense à ce que tu pourrais faire pour soutenir un camarade qui se sent seul ou triste.
    methode: Définis d'abord l'empathie, puis donne un exemple d'action bienveillante qui en découle.
    etape: 'Tu peux commencer ainsi : « L''empathie, c''est... »'
  solution: L'empathie, c'est se mettre à la place d'une autre personne pour comprendre ce qu'elle ressent. Par exemple, si
    un camarade semble triste ou isolé, je peux aller lui parler, l'écouter, et si besoin en parler à un adulte de confiance
    pour l'aider.
