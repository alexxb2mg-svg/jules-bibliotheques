format: 2
notion: cm1-empathie-lutte-discriminations-harcelement
version: 1
etat: verifiee
declencheurs:
- se mettre à la place de quelqu'un qui souffre
- pourquoi il faut se soucier des autres
- ne penser qu'à soi ou penser aux autres
- comprendre ce que ressent un camarade triste
prerequis:
- cm1-egalite-en-droit-dignite-personne
couverture: Se limite à la définition de l'empathie et à son rôle protecteur contre les discriminations et le harcèlement,
  avec une première distinction égoïsme/altruisme. Ne décrit pas de scénario violent détaillé ; oriente vers l'écoute et l'entraide.
essentiel: 'L''empathie, c''est la capacité à comprendre et à ressentir ce que vit une autre personne, en se mettant à sa
  place.


  Grâce à l''empathie, on comprend mieux pourquoi une discrimination, une moquerie ou du harcèlement font du mal à quelqu''un.
  Cela aide à ne pas reproduire ces comportements et à soutenir une personne qui en est victime.


  L''égoïsme, c''est le fait de ne penser qu''à soi-même, sans se soucier des autres. L''altruisme, c''est le contraire :
  c''est le fait de se soucier du bien-être des autres, parfois même avant le sien.


  Développer l''empathie aide à construire une classe et une société où chacun se sent respecté et écouté.

  '
methode:
- Se mettre à la place de la personne concernée pour imaginer ce qu'elle ressent.
- Se demander si un comportement montre de l'empathie, de l'égoïsme ou de l'altruisme.
- 'Relier l''empathie à la lutte contre les discriminations et le harcèlement : comprendre pour agir avec bienveillance.'
vocabulaire:
- terme: empathie
  definition: la capacité à comprendre et à ressentir ce que vit une autre personne, en se mettant à sa place
- terme: altruisme
  definition: le fait de se soucier du bien-être des autres, parfois avant le sien
erreurs_frequentes:
- Confondre empathie (comprendre ce que ressent l'autre) et sympathie (aimer quelqu'un).
- 'Confondre égoïsme et altruisme : l''un pense à soi, l''autre pense aux autres.'
- Croire que l'empathie ne sert qu'à être gentil, alors qu'elle aide aussi à comprendre pourquoi certains comportements font
  du mal.
exemple:
  enonce: Explique comment l'empathie peut aider à lutter contre le harcèlement.
  solution: Grâce à l'empathie, un élève peut imaginer ce que ressent un camarade harcelé et comprendre que c'est douloureux.
    Cela peut l'aider à le soutenir et à ne jamais participer à ce genre de comportement.
exercices:
- id: definir-empathie
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que l'empathie ?
  reponse:
    options:
    - id: a
      texte: La capacité à comprendre et à ressentir ce que vit une autre personne
    - id: b
      texte: Le fait de ne penser qu'à soi-même
    - id: c
      texte: Le fait d'ignorer les sentiments des autres
    bonnes:
    - a
  indices:
    relance: L'empathie tourne-t-elle autour de soi, ou autour des autres ?
    methode: L'empathie, c'est se mettre à la place d'une autre personne pour comprendre ce qu'elle ressent.
    etape: Élimine les réponses qui parlent d'ignorer ou de ne penser qu'à soi.
  pieges:
  - si:
      contient:
      - b
    relance: C'est plutôt la définition de l'égoïsme, le contraire de l'empathie.
  - si:
      contient:
      - c
    relance: Ignorer les sentiments des autres est le contraire de l'empathie.
  solution: L'empathie est la capacité à comprendre et à ressentir ce que vit une autre personne.
- id: distinguer-egoisme-altruisme
  type: association
  difficulte: 2
  enonce: 'Associe chaque comportement à la notion qu''il illustre : égoïsme ou altruisme.'
  reponse:
    gauche:
    - id: a
      texte: Partager son goûter avec un camarade qui n'en a pas
    - id: b
      texte: Garder toutes les affaires communes pour soi
    droite:
    - id: x
      texte: Altruisme
    - id: y
      texte: Égoïsme
    paires:
      a: x
      b: y
  indices:
    relance: L'un des deux comportements profite à une autre personne, l'autre ne profite qu'à soi-même.
    methode: Repère si le comportement pense d'abord à soi ou d'abord aux autres.
    etape: 'Partager avec quelqu''un d''autre profite à cette personne : c''est de l''altruisme.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les deux comportements.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord le comportement de partage, qui illustre l'altruisme.
  solution: Partager son goûter illustre l'altruisme. Garder les affaires communes pour soi illustre l'égoïsme.
- id: role-empathie-discrimination
  type: choix
  difficulte: 2
  enonce: En quoi l'empathie peut-elle aider à lutter contre les discriminations ?
  reponse:
    options:
    - id: a
      texte: Elle aide à comprendre la souffrance causée par une discrimination et à ne pas la reproduire
    - id: b
      texte: Elle n'a aucun lien avec les discriminations
    - id: c
      texte: Elle sert uniquement à se faire des amis
    bonnes:
    - a
  indices:
    relance: Se mettre à la place de la personne discriminée aide-t-il à comprendre pourquoi c'est injuste ?
    methode: L'empathie permet d'imaginer ce que ressent une personne discriminée, et donc d'éviter ce comportement.
    etape: Élimine la réponse qui nie tout lien, et celle qui réduit l'empathie à l'amitié.
  pieges:
  - si:
      contient:
      - b
    relance: L'empathie a justement un lien fort avec la lutte contre les discriminations.
  - si:
      contient:
      - c
    relance: 'L''empathie va au-delà de l''amitié : elle aide aussi à comprendre la souffrance des autres.'
  solution: L'empathie aide à comprendre la souffrance causée par une discrimination et donc à ne pas la reproduire.
- id: expliquer-empathie-altruisme
  type: ouverte
  difficulte: 3
  enonce: Explique ce qu'est l'empathie et donne un exemple simple de comportement altruiste qui aide à lutter contre le harcèlement,
    sans décrire de scène violente.
  criteres:
  - L'élève définit l'empathie comme la capacité à comprendre ce que ressent une autre personne.
  - L'élève donne un exemple concret et bienveillant de comportement altruiste (soutenir, écouter, en parler à un adulte).
  indices:
    relance: Pense à ce que tu pourrais faire pour soutenir un camarade qui se sent seul ou triste.
    methode: Définis d'abord l'empathie, puis donne un exemple d'action bienveillante qui en découle.
    etape: 'Tu peux commencer ainsi : « L''empathie, c''est... »'
  solution: L'empathie, c'est se mettre à la place d'une autre personne pour comprendre ce qu'elle ressent. Par exemple, si
    un camarade semble triste ou isolé, je peux aller lui parler, l'écouter, et si besoin en parler à un adulte de confiance
    pour l'aider.
