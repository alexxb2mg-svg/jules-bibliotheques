format: 2
notion: cm1-egalite-en-droit-dignite-personne
version: 3
etat: verifiee
declencheurs:
- pourquoi tout le monde a les mêmes droits
- se moquer de quelqu'un à cause de ses croyances
- respecter les différences entre les gens
- pourquoi c'est interdit de traiter quelqu'un moins bien qu'un autre
- pas la même religion
- les filles ont les mêmes droits
- on rigole de son accent
- personne n'a le droit de me frapper
prerequis: []
essentiel: 'L''égalité en droit signifie que toutes les personnes ont les mêmes droits. Peu importe leur origine, leur religion,
  leurs croyances, leur apparence, qu''elles soient filles ou garçons, avec ou sans handicap. Être égaux en droit ne veut
  pas dire être tous pareils : on reste différents, mais on a les mêmes droits.


  La dignité de la personne humaine, c''est le respect dû à chaque être humain, simplement parce qu''il est une personne.
  Personne ne doit être humilié, rabaissé, insulté ou maltraité. Chacun mérite le respect, même s''il est différent de nous.


  Une discrimination, c''est le fait de traiter une personne moins bien qu''une autre, à cause d''une différence. Par exemple,
  refuser un enfant dans une équipe à cause de son origine, ou dire « pas de filles dans ce jeu ». C''est injuste et contraire
  à l''égalité en droit. Une atteinte à la personne, c''est faire du mal à quelqu''un, par des mots ou par des gestes.


  Chacun a droit au respect de son intégrité : son corps et sa personne doivent être respectés. Personne n''a le droit de
  te frapper, de te toucher si tu ne veux pas, ou de t''humilier. Et toi non plus, tu n''as pas ce droit envers les autres.


  Dans les activités de groupe, on respecte les autres dans leur diversité. Chacun peut avoir ses croyances et ses convictions.
  La tolérance, c''est accepter qu''un camarade pense ou croie autrement que soi, sans se moquer de lui.

  '
methode:
- Lire la situation et repérer qui est traité différemment.
- Chercher la raison de ce traitement (origine, religion, apparence, handicap, fille ou garçon…).
- Se demander si cette raison est juste, ou s'il s'agit d'une discrimination.
- Vérifier si quelqu'un est humilié ou blessé, ce qui est une atteinte à sa dignité.
- Proposer une réaction respectueuse (inclure, dire que ce n'est pas juste, prévenir un adulte).
vocabulaire:
- terme: égalité en droit
  definition: le fait que toutes les personnes ont les mêmes droits, quelles que soient leurs différences
- terme: dignité
  definition: le respect dû à chaque être humain, simplement parce qu'il est une personne
- terme: discrimination
  definition: le fait de traiter une personne moins bien qu'une autre à cause d'une différence
- terme: intégrité
  definition: le fait que ton corps et ta personne doivent être respectés par tous
- terme: tolérance
  definition: le fait d'accepter que les autres pensent ou croient autrement que soi
- terme: conviction
  definition: une idée à laquelle une personne tient beaucoup
erreurs_frequentes:
- Croire que l'égalité signifie que tout le monde est identique, alors qu'elle signifie que tout le monde a les mêmes droits
  malgré les différences.
- Ne pas reconnaître une discrimination quand elle est indirecte ou discrète.
- Penser qu'une moquerie répétée à cause d'une différence n'est pas grave.
- Croire que la tolérance oblige à penser comme les autres, alors qu'elle demande seulement de les respecter.
exemple:
  enonce: Donne un exemple de situation où l'égalité en droit n'est pas respectée.
  solution: 'Refuser de laisser un enfant jouer avec les autres à cause de sa religion est une discrimination : cela ne respecte
    pas l''égalité en droit ni la dignité de cet enfant. Il faudrait l''inviter à jouer comme tout le monde.'
exercices:
- id: definir-egalite-droit
  type: choix
  difficulte: 1
  enonce: Que signifie « l'égalité en droit » ?
  reponse:
    options:
    - id: a
      texte: Toutes les personnes ont les mêmes droits, quelles que soient leurs différences
    - id: b
      texte: Toutes les personnes doivent penser et croire exactement la même chose
    - id: c
      texte: Seules certaines personnes ont des droits
    bonnes:
    - a
  indices:
    relance: L'égalité en droit concerne-t-elle les droits des personnes, ou leurs goûts et opinions ?
    methode: L'égalité en droit, c'est avoir les mêmes droits, tout en restant différents les uns des autres.
    etape: Élimine la réponse qui dit que tout le monde doit être identique, et celle qui exclut certaines personnes.
  pieges:
  - si:
      contient:
      - b
    relance: 'L''égalité en droit ne demande pas de penser pareil : elle garantit les mêmes droits malgré les différences.'
  - si:
      contient:
      - c
    relance: C'est le contraire de l'égalité en droit, qui concerne justement tout le monde.
  solution: L'égalité en droit signifie que toutes les personnes ont les mêmes droits, quelles que soient leurs différences.
- id: reconnaitre-discrimination
  type: choix
  difficulte: 1
  enonce: Laquelle de ces situations est une discrimination ?
  reponse:
    options:
    - id: a
      texte: Refuser qu'un enfant joue avec les autres à cause de sa religion
    - id: b
      texte: Proposer à tous les enfants de jouer ensemble, quelles que soient leurs différences
    - id: c
      texte: Aider un camarade qui a du mal à comprendre une leçon
    bonnes:
    - a
  indices:
    relance: Laquelle de ces situations traite une personne moins bien qu'une autre, à cause d'une différence ?
    methode: Une discrimination écarte une personne à cause d'une caractéristique qui n'a rien à voir avec ses actes.
    etape: Deux réponses décrivent des comportements respectueux des autres.
  pieges:
  - si:
      contient:
      - b
    relance: Proposer à tous de jouer ensemble respecte justement l'égalité, ce n'est pas une discrimination.
  - si:
      contient:
      - c
    relance: Aider un camarade est un geste d'entraide, pas une discrimination.
  solution: Refuser qu'un enfant joue avec les autres à cause de sa religion est une discrimination.
- id: mot-tolerance
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le fait d'accepter qu'un camarade pense ou croie autrement que soi, sans se moquer de lui ?
  reponse:
    acceptees:
    - tolérance
    - tolerance
    fautes_tolerees: 1
  indices:
    relance: On emploie ce mot quand on respecte les idées des autres, même si on ne les partage pas.
    methode: Relis le vocabulaire de la fiche. Un mot parle d'accepter les croyances des autres.
    etape: Relis le dernier paragraphe de l'essentiel de ta leçon, sur les croyances et les convictions.
  pieges:
  - si:
      valeur: égalité
    relance: L'égalité parle des droits de chacun. Quel mot désigne le fait d'accepter des idées différentes des siennes ?
  - si:
      valeur: respect
    relance: Tu es proche. Quel mot plus précis désigne le fait d'accepter les croyances et les idées des autres ?
  solution: C'est la tolérance. Être tolérant, c'est accepter que les autres pensent ou croient autrement.
- id: reperer-situations-injustes
  type: choix
  difficulte: 2
  enonce: Coche toutes les situations où l'égalité ou la dignité n'est pas respectée.
  reponse:
    options:
    - id: a
      texte: Dans un jeu, des enfants disent « pas de filles avec nous »
    - id: b
      texte: Un élève se fait traiter de noms méchants à cause de son accent
    - id: c
      texte: La maîtresse donne à chaque élève le même temps pour finir l'exercice
    - id: d
      texte: Un groupe invite un nouveau camarade à jouer
    bonnes:
    - a
    - b
  indices:
    relance: Dans quelles situations une personne est-elle écartée ou blessée à cause d'une différence ?
    methode: Pour chaque situation, demande-toi si quelqu'un est traité moins bien ou humilié.
    etape: Il y a deux bonnes réponses. Les situations où tout le monde est traité pareil ne sont pas injustes.
  pieges:
  - si:
      contient:
      - c
    relance: Donner le même temps à chacun, c'est traiter tout le monde de la même façon. Est-ce injuste ?
  - si:
      contient:
      - d
    relance: Inviter un nouveau camarade, c'est l'inclure. Est-ce une atteinte à sa dignité ?
  - si:
      diagnostic: incomplet
    relance: Tu as trouvé une situation, mais il y en a une autre. Relis-les toutes.
  solution: Refuser les filles dans un jeu est une discrimination. Traiter quelqu'un de noms méchants à cause de son accent
    porte atteinte à sa dignité. Les deux autres situations respectent l'égalité.
- id: associer-notion-definition-egalite
  type: association
  difficulte: 2
  enonce: Associe chaque mot à sa définition.
  reponse:
    gauche:
    - id: a
      texte: Dignité
    - id: b
      texte: Discrimination
    - id: c
      texte: Égalité en droit
    droite:
    - id: x
      texte: Le respect dû à chaque être humain
    - id: y
      texte: Traiter une personne moins bien qu'une autre à cause d'une différence
    - id: z
      texte: Avoir les mêmes droits malgré les différences
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Relis attentivement chaque définition avant de l'associer au bon mot.
    methode: 'Repère le mot-clé de chaque définition : respect, traitement inégal, mêmes droits.'
    etape: « Le respect dû à chaque être humain » correspond au mot « dignité ».
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque définition.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord « dignité », liée au mot « respect ».
  solution: Dignité est le respect dû à chaque être humain. Discrimination est le fait de traiter une personne moins bien
    à cause d'une différence. Égalité en droit est le fait d'avoir les mêmes droits malgré les différences.
- id: respecter-integrite
  type: choix
  difficulte: 2
  enonce: Pendant un jeu, un camarade te tire les cheveux alors que tu lui as dit d'arrêter. Que dit la règle du respect de
    l'intégrité ?
  reponse:
    options:
    - id: a
      texte: Il n'a pas le droit, car ton corps doit être respecté
    - id: b
      texte: Il a le droit, puisque c'est un jeu
    - id: c
      texte: Il a le droit, s'il est plus grand que toi
    bonnes:
    - a
  indices:
    relance: Tu lui as dit d'arrêter. Doit-il en tenir compte ?
    methode: L'intégrité, c'est le respect du corps et de la personne de chacun, dans tous les jeux.
    etape: Ni le jeu ni la taille ne donnent le droit de faire mal à quelqu'un.
  pieges:
  - si:
      contient:
      - b
    relance: Un jeu ne donne pas le droit de faire mal, surtout quand l'autre a dit d'arrêter.
  - si:
      contient:
      - c
    relance: Être plus grand ne donne aucun droit en plus. Tout le monde a les mêmes droits.
  solution: Il n'a pas le droit, car ton corps doit être respecté. Tu peux lui redire non et prévenir un adulte s'il continue.
- id: reagir-mise-a-l-ecart
  type: ordre
  difficulte: 3
  enonce: À la récréation, des élèves refusent qu'une camarade joue avec eux à cause de son origine. Range ces actions dans
    le bon ordre.
  reponse:
    elements:
    - id: reperer
      texte: Je remarque que ma camarade est écartée à cause de son origine
    - id: dire
      texte: Je dis aux autres que ce n'est pas juste
    - id: inviter
      texte: Après l'avoir dit, j'invite ma camarade à jouer avec moi
    - id: prevenir
      texte: Si cela recommence, je préviens un adulte
  indices:
    relance: Que faut-il d'abord comprendre avant de réagir ?
    methode: On repère l'injustice, on la dit, on agit pour la personne, et on demande de l'aide si cela continue.
    etape: Prévenir un adulte vient si la situation se répète.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux actions voisines sont inversées. Laquelle vient avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Pars de ce que tu remarques et termine par ce que tu fais si la situation se répète.
  solution: Je remarque qu'elle est écartée à cause de son origine, je dis que ce n'est pas juste, je l'invite à jouer, puis,
    si cela recommence, je préviens un adulte.
- id: proposer-situation-egalite
  type: ouverte
  difficulte: 3
  enonce: Décris une situation fictive et simple dans laquelle l'égalité en droit n'est pas respectée, explique pourquoi c'est
    injuste et propose une façon de réagir.
  criteres:
  - L'élève décrit une situation fictive, simple, sans violence détaillée et sans personne réelle nommée.
  - L'élève explique en quoi cette situation est contraire à l'égalité en droit ou à la dignité.
  - L'élève propose une réaction respectueuse (inclure la personne, dire que c'est injuste, prévenir un adulte).
  indices:
    relance: Pense à une situation où une personne est traitée différemment à cause de qui elle est.
    methode: Décris d'abord la situation, puis explique pourquoi elle ne respecte pas l'égalité, enfin dis comment réagir.
    etape: 'Tu peux commencer ainsi : « Dans une situation fictive... »'
  solution: Dans une situation fictive, un enfant est écarté d'un jeu collectif parce qu'il porte des vêtements différents
    des autres. C'est injuste, car cela ne respecte ni l'égalité en droit, ni la dignité de cet enfant, qui mérite le même
    respect que les autres. On peut dire que ce n'est pas juste et l'inviter à jouer.
- id: nblm-pourquoi-tout-le-monde-a-t-il-les-memes-1
  type: choix
  difficulte: 2
  enonce: Pourquoi tout le monde a-t-il les mêmes droits dans la société ?
  reponse:
    options:
    - id: o1
      texte: Parce que l'égalité en droit garantit les mêmes droits à tous, quelles que soient leurs origines ou leurs croyances.
    - id: o2
      texte: Parce que tout le monde doit penser de la même façon et avoir les mêmes goûts.
    - id: o3
      texte: Parce que seules les personnes nées dans le même pays peuvent avoir des droits.
    - id: o4
      texte: Parce que les droits dépendent de la couleur des vêtements que l'on porte.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que garantit la loi pour chaque personne, peu importe ce qui la rend unique.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : l''égalité ne signifie pas être tous identiques ou penser pareil, mais avoir les
      mêmes droits.'
  - si:
      contient:
      - o3
    relance: 'C''est inexact : l''origine d''une personne ne doit pas lui enlever ses droits fondamentaux.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : les droits fondamentaux sont universels et ne dépendent pas de critères superficiels.'
  solution: 'Parce que l''égalité en droit garantit les mêmes droits à tous, quelles que soient leurs origines ou leurs croyances.
    C''est exact : la loi accorde les mêmes droits à chaque être humain, sans distinction liée à ses caractéristiques personnelles.'
- id: nblm-que-se-passe-t-il-si-un-eleve-se-moque-d-2
  type: choix
  difficulte: 2
  enonce: Que se passe-t-il si un élève se moque d'un camarade à cause de ses croyances ou de sa religion ?
  reponse:
    options:
    - id: o1
      texte: Il ne respecte pas la dignité de son camarade ni la liberté de croyance de chacun.
    - id: o2
      texte: C'est une simple plaisanterie sans importance si cela fait rire les autres.
    - id: o3
      texte: C'est autorisé à l'école car les croyances ne sont pas protégées par les règles de la classe.
    - id: o4
      texte: C'est normal si le camarade ne croit pas à la même chose que la majorité de la classe.
    bonnes:
    - o1
  indices:
    relance: Pense à ce que l'on doit appliquer face aux convictions et choix de chacun à l'école.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : rabaisser quelqu''un pour ses croyances cause de la peine et manque de respect.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : à l''école comme ailleurs, le respect de la diversité des convictions est obligatoire.'
  - si:
      contient:
      - o4
    relance: 'C''est inexact : chaque personne a le droit d''avoir ses propres convictions sans être rejetée.'
  solution: 'Il ne respecte pas la dignité de son camarade ni la liberté de croyance de chacun. C''est juste : respecter la
    dignité d''une personne exige de respecter la diversité de ses croyances et de ne pas la rabaisser.'
- id: nblm-que-signifie-reellement-respecter-les-di-3
  type: choix
  difficulte: 2
  enonce: Que signifie réellement « respecter les différences entre les gens » à l'école ?
  reponse:
    options:
    - id: o1
      texte: Accepter que chacun soit unique tout en accordant la même valeur et les mêmes droits à tous.
    - id: o2
      texte: Obliger tout le monde à s'habiller et agir exactement de la même manière.
    - id: o3
      texte: Séparer les élèves dans la cour en fonction de leur apparence ou de leur handicap.
    - id: o4
      texte: Ignorer totalement les camarades qui ne nous ressemblent pas.
    bonnes:
    - o1
  indices:
    relance: Pense à la différence entre accorder la même valeur à chacun et forcer tout le monde à être pareil.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur classique : l''égalité n''est pas l''uniformité, chacun a le droit d''être différent.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : exclure ou séparer des élèves à cause d''une différence est contraire au principe d''égalité.'
  - si:
      contient:
      - o4
    relance: 'C''est inexact : respecter les différences implique l''accueil de chacun et non l''ignorance.'
  solution: 'Accepter que chacun soit unique tout en accordant la même valeur et les mêmes droits à tous. C''est exact : la
    diversité est une richesse et l''égalité garantit le même respect pour tous malgré nos différences.'
- id: nblm-pourquoi-est-il-interdit-par-la-loi-de-t-4
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il interdit par la loi de traiter une personne moins bien qu'une autre à cause de sa différence ?
  reponse:
    options:
    - id: o1
      texte: Parce que cela s'appelle une discrimination et que c'est une injustice contraire à l'égalité en droit.
    - id: o2
      texte: Parce que cela risquerait seulement de fâcher les adultes de l'école.
    - id: o3
      texte: Parce que c'est autorisé pendant les cours mais interdit pendant la récréation.
    - id: o4
      texte: Parce que seuls les adultes ont le droit de choisir qui ils respectent.
    bonnes:
    - o1
  indices:
    relance: Cherche le terme qui désigne le fait de défavoriser quelqu'un en raison de ce qu'il est.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est inexact : ce n''est pas seulement une question d''humeur des adultes, mais un principe fondamental de
      justice et de loi.'
  - si:
      contient:
      - o3
    relance: 'C''est faux : la discrimination est interdite partout et tout le temps.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : les enfants comme les adultes doivent respecter l''égalité en droit.'
  solution: 'Parce que cela s''appelle une discrimination et que c''est une injustice contraire à l''égalité en droit. C''est
    exact : traiter moins bien une personne en raison d''une caractéristique personnelle est une discrimination interdite.'
- id: nblm-qu-est-ce-que-la-dignite-de-la-personne-5
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que la dignité de la personne humaine ?
  reponse:
    options:
    - id: o1
      texte: C'est le respect dû à chaque être humain, simplement parce qu'il est une personne.
    - id: o2
      texte: C'est une récompense accordée uniquement si l'on a de très bonnes notes.
    - id: o3
      texte: C'est le droit d'imposer ses choix aux autres sans les écouter.
    - id: o4
      texte: C'est une règle réservée aux personnes célèbres ou importantes.
    bonnes:
    - o1
  indices:
    relance: Rappelle-toi pourquoi chaque individu mérite de ne jamais être rabaissé ou humilié.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est faux : la dignité n''est pas un prix, elle appartient à chaque personne dès sa naissance.'
  - si:
      contient:
      - o3
    relance: 'C''est inexact : la dignité n''a rien à voir avec le fait d''avoir du pouvoir sur autrui.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : la dignité concerne absolument tous les êtres humains.'
  solution: 'C''est le respect dû à chaque être humain, simplement parce qu''il est une personne. C''est exact : la dignité
    appartient à tout être humain, sans condition, et interdit de l''humilier ou de le rabaisser.'
- id: nblm-parmi-les-situations-suivantes-lesquelle-6
  type: choix
  difficulte: 3
  enonce: Parmi les situations suivantes, lesquelles respectent l'égalité en droit et la dignité des personnes ? (Choisis
    2 bonnes réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Inviter un camarade en situation de handicap à participer au jeu de ballon pendant la récréation.
    - id: o2
      texte: Écouter avec calme et respect un élève qui explique une tradition liée à ses croyances.
    - id: o3
      texte: Refuser qu'une fille soit capitaine d'équipe en sport au prétexte que c'est réservé aux garçons.
    - id: o4
      texte: Donner des rôles importants uniquement aux élèves qui partagent la même origine.
    bonnes:
    - o1
    - o2
  indices:
    relance: Pense aux comportements qui accueillent et valorisent chaque élève sans le rejeter.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
