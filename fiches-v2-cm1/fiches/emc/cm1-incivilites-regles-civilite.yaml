    - id: o1
      texte: La vie en communauté devient plus difficile et moins agréable pour tout le monde.
    - id: o2
      texte: Cela n'a aucune conséquence grave tant que la loi n'est pas violée.
    - id: o3
      texte: Cela permet d'augmenter la liberté de chaque individu dans la rue.
    - id: o4
      texte: Cela transforme automatiquement les incivilités en règles de civilité.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'effet de la répétition des petits manques de respect sur le groupe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une idée reçue : les petits gestes irrespectueux répétés gâchent le quotidien de tous.'
  - si:
      contient:
      - o3
    relance: L'incivilité ne crée pas de liberté positive, elle gêne et perturbe la vie des autres.
  - si:
      contient:
      - o4
    relance: Ce n'est pas parce que beaucoup de gens font un geste déplacé que celui-ci devient poli ou acceptable.
  solution: La vie en communauté devient plus difficile et moins agréable pour tout le monde. Même si chaque incivilité paraît
    petite, leur accumulation dégrade la qualité de la vie en collectivité.
- id: nblm-parmi-les-situations-suivantes-laquelle-5
