    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: C'est un exemple de règle de civilité et d'attention aux autres, non une incivilité.
  - si:
      contient:
      - o4
    relance: Dire bonjour et merci est une règle élémentaire de politesse qui facilite la vie sociale.
  solution: Jeter un papier d'emballage au sol dans la rue ; Faire beaucoup de bruit tard le soir en faisant la fête. Abandonner
    ses déchets par terre salit l'espace public et perturbe le bien-être collectif.
