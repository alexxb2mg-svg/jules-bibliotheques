format: 2
notion: cm1-incivilites-regles-civilite
version: 3
etat: verifiee
declencheurs:
- pourquoi c'est grave de couper la file d'attente
- des comportements qui gênent les autres
- pourquoi il ne faut pas crier dans le bus
- des gestes qui dérangent la vie ensemble
- jeter un papier par terre
- dire merci et s'il te plaît
- laisser sa place à une mamie
- faire du bruit le soir
prerequis:
- cm1-civisme-action-bien-public
essentiel: 'Les règles de civilité sont des règles simples de la vie en société. Elles permettent à chacun de bien vivre avec
  les autres, à l''école, dans la rue, dans les transports ou à la maison.


  Il y a des règles de politesse : dire bonjour, merci, s''il te plaît, pardon. Il y a des règles de respect des autres :
  attendre son tour, ne pas couper la parole, ne pas crier dans un lieu calme. Dans le bus, on laisse sa place à une personne
  qui en a besoin. Il y a aussi des règles de respect des lieux communs : garder propres la cour, la rue ou le parc, prendre
  soin du matériel.


  Une incivilité, c''est un comportement qui ne respecte pas ces règles. Elle n''est pas forcément interdite par la loi, mais
  elle gêne les autres. Par exemple : jeter un papier par terre, doubler dans une file d''attente, faire du bruit tard le
  soir, bousculer quelqu''un sans s''excuser.


  Les incivilités nuisent à la vie en commun. Elles salissent les lieux de tous, rendent les situations injustes ou fatiguent
  les autres. Une seule paraît petite, mais quand beaucoup de personnes en font, la vie devient désagréable pour tout le monde.


  Appliquer les règles de civilité, c''est penser aux autres. Si on a commis une incivilité, on peut la réparer : s''excuser,
  ramasser ce qu''on a jeté, laisser passer la personne qu''on a doublée.

  '
methode:
- Repérer le lieu et les personnes présentes (classe, cantine, bus, rue).
- Se demander si le comportement gêne quelqu'un.
- Comparer ce comportement à une règle de civilité connue (politesse, respect du tour, respect des lieux communs).
- Expliquer en quoi ce comportement nuit à la vie en commun.
- Choisir la bonne attitude, ou réparer l'incivilité (s'excuser, ramasser, laisser passer).
vocabulaire:
- terme: incivilité
  definition: un comportement qui ne respecte pas les règles de la vie en société, sans être forcément interdit par la loi
- terme: civilité
  definition: l'ensemble des règles de politesse et de respect qui permettent de bien vivre ensemble
- terme: politesse
  definition: les mots et les gestes qui montrent qu'on respecte les autres, comme dire bonjour ou merci
- terme: lieu commun
  definition: un endroit qui est à tout le monde, comme la cour, la rue, le parc ou le bus
- terme: vie en commun
  definition: le fait de vivre ensemble, au même endroit, avec d'autres personnes
erreurs_frequentes:
- Croire qu'une incivilité est la même chose qu'un crime ou un délit puni par la loi.
- Penser qu'une petite incivilité n'a pas d'importance parce qu'elle est faite par une seule personne.
- Confondre incivilité (jeter un papier par terre) et simple maladresse involontaire (trébucher).
- Croire que la politesse ne sert à rien, alors qu'elle rend la vie avec les autres plus agréable.
exemple:
  enonce: Donne un exemple d'incivilité dans les transports en commun et explique pourquoi cela dérange.
  solution: 'Parler très fort au téléphone dans le bus est une incivilité : cela dérange les autres passagers qui souhaitent
    un trajet calme. La bonne attitude est de parler doucement ou d''attendre d''être descendu.'
exercices:
- id: definir-incivilite
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qu'une incivilité ?
  reponse:
    options:
    - id: a
      texte: Un comportement qui ne respecte pas les règles de la vie en société
    - id: b
      texte: Un crime puni par la loi
    - id: c
      texte: Un accident involontaire
    bonnes:
    - a
  indices:
    relance: Une incivilité est-elle toujours punie par la police, ou gêne-t-elle simplement les autres ?
    methode: Une incivilité ne respecte pas les règles de vie en commun, mais n'est pas forcément un crime.
    etape: Élimine la réponse qui parle de crime et celle qui parle d'accident.
  pieges:
  - si:
      contient:
      - b
    relance: Un crime est puni par la loi. Une incivilité est plus légère, même si elle dérange.
  - si:
      contient:
      - c
    relance: Un accident est involontaire. Une incivilité est un comportement, pas un accident.
  solution: Une incivilité est un comportement qui ne respecte pas les règles de la vie en société, sans être forcément un
    crime.
- id: reconnaitre-exemple-incivilite
  type: choix
  difficulte: 1
  enonce: Lequel de ces comportements est une incivilité ?
  reponse:
    options:
    - id: a
      texte: Doubler tout le monde dans une file d'attente
    - id: b
      texte: Attendre son tour patiemment
    - id: c
      texte: Aider une personne âgée à porter ses sacs
    bonnes:
    - a
  indices:
    relance: Lequel de ces trois comportements ne respecte pas une règle de civilité ?
    methode: Une incivilité gêne les autres et ne respecte pas une règle simple, comme le respect du tour.
    etape: Deux réponses décrivent des comportements respectueux des autres.
  pieges:
  - si:
      contient:
      - b
    relance: Attendre son tour est justement une règle de civilité respectée, pas une incivilité.
  - si:
      contient:
      - c
    relance: Aider quelqu'un est un comportement civique, pas une incivilité.
  solution: Doubler tout le monde dans une file d'attente est une incivilité, car cela ne respecte pas la règle du tour.
- id: mot-civilite
  type: texte_court
  difficulte: 1
  enonce: 'Complète : dire bonjour, attendre son tour et garder la rue propre, ce sont des règles de …'
  reponse:
    acceptees:
    - civilité
    - civilite
    - politesse
    fautes_tolerees: 1
  indices:
    relance: Ces règles permettent de bien vivre ensemble en société. Comment s'appellent-elles ?
    methode: Relis le début de l'essentiel de ta leçon. Il dit comment s'appellent ces règles.
    etape: Une incivilité, c'est ne pas respecter ces règles. Ce sont donc les règles de quoi ?
  pieges:
  - si:
      valeur: civisme
    relance: Le civisme est proche, mais ici on parle de règles simples de la vie en société, comme dire bonjour. Relis ta
      leçon.
  solution: Ce sont des règles de civilité (on dit aussi des règles de politesse et de respect).
- id: appliquer-regle-bus
  type: choix
  difficulte: 2
  enonce: Dans le bus, tu es assis. Une dame âgée monte et il n'y a plus de place libre. Que fais-tu ?
  reponse:
    options:
    - id: a
      texte: Je lui propose ma place
    - id: b
      texte: Je fais semblant de ne pas la voir
    - id: c
      texte: Je pose mon sac sur le siège d'à côté
    bonnes:
    - a
  indices:
    relance: Qui a le plus besoin d'être assis dans ce bus ?
    methode: Une règle de civilité dans les transports est de penser aux personnes qui en ont besoin.
    etape: Faire semblant de ne pas voir, ou prendre plus de place, ne l'aide pas.
  pieges:
  - si:
      contient:
      - b
    relance: Faire semblant de ne pas la voir ne l'aide pas. Que pourrais-tu faire pour elle ?
  - si:
      contient:
      - c
    relance: Ton sac prend une place dont quelqu'un pourrait avoir besoin. Que peux-tu faire pour cette dame ?
  solution: Je lui propose ma place, car elle en a plus besoin que moi. C'est une règle de civilité dans les transports.
- id: associer-incivilite-consequence
  type: association
  difficulte: 2
  enonce: Associe chaque incivilité à sa conséquence sur la vie en commun.
  reponse:
    gauche:
    - id: a
      texte: Jeter un papier par terre
    - id: b
      texte: Parler très fort au téléphone dans le bus
    - id: c
      texte: Doubler dans une file d'attente
    droite:
    - id: x
      texte: Salit l'espace commun
    - id: y
      texte: Dérange les autres passagers
    - id: z
      texte: Rend l'attente injuste pour les autres
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Pour chaque incivilité, demande-toi précisément ce qu'elle gêne.
    methode: Repère le lien direct entre l'action et sa conséquence sur les autres.
    etape: Jeter un papier par terre salit un lieu utilisé par tous.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis chaque incivilité.
  - si:
      diagnostic: associations_fausses
    relance: 'Repère d''abord l''incivilité qui salit un lieu commun : jeter un papier par terre.'
  solution: Jeter un papier par terre salit l'espace commun. Parler fort au téléphone dérange les autres passagers. Doubler
    dans une file rend l'attente injuste pour les autres.
- id: associer-lieu-regle
  type: association
  difficulte: 2
  enonce: Associe chaque lieu à une règle de civilité qu'on y applique.
  reponse:
    gauche:
    - id: a
      texte: À la bibliothèque
    - id: b
      texte: À la cantine
    - id: c
      texte: Au parc
    - id: d
      texte: En entrant chez la boulangère
    droite:
    - id: w
      texte: Je parle à voix basse
    - id: x
      texte: J'attends mon tour avec mon plateau
    - id: y
      texte: Je jette mes déchets dans la poubelle
    - id: z
      texte: Je dis bonjour
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Dans quel lieu les gens lisent-ils en silence ?
    methode: Pour chaque lieu, imagine ce qui pourrait gêner les autres, puis choisis la règle qui l'évite.
    etape: Le plateau fait penser au repas de midi à l'école.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la règle liée aux déchets.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le lieu où l'on lit en silence, puis par celui où l'on mange à l'école.
  solution: À la bibliothèque, je parle à voix basse. À la cantine, j'attends mon tour avec mon plateau. Au parc, je jette
    mes déchets dans la poubelle. Chez la boulangère, je dis bonjour en entrant.
- id: reparer-incivilite
  type: ordre
  difficulte: 3
  enonce: En courant dans le couloir, tu bouscules un camarade et ses affaires tombent. Range ces actions dans le bon ordre.
  reponse:
    elements:
    - id: arreter
      texte: Je m'arrête au lieu de continuer à courir
    - id: excuser
      texte: Je lui dis pardon
    - id: ramasser
      texte: Après mes excuses, je l'aide à ramasser ses affaires
    - id: marcher
      texte: Je repars en marchant dans le couloir
  indices:
    relance: Peux-tu t'excuser si tu continues à courir ?
    methode: D'abord on s'arrête, ensuite on s'excuse et on répare, enfin on change d'attitude.
    etape: La dernière action montre que tu as compris la règle du couloir.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux actions voisines sont inversées. Laquelle vient en premier ?
  - si:
      diagnostic: ordre_faux
    relance: Commence par la première chose à faire quand on a bousculé quelqu'un, et termine par la façon de repartir.
  solution: Je m'arrête, je lui dis pardon, je l'aide à ramasser ses affaires, puis je repars en marchant.
- id: proposer-exemple-incivilite-quotidien
  type: ouverte
  difficulte: 3
  enonce: Décris une incivilité que tu as déjà observée dans la vie quotidienne, explique pourquoi elle nuit à la vie en commun,
    et dis quelle règle de civilité il aurait fallu appliquer.
  criteres:
  - L'élève décrit une incivilité concrète et réaliste, sans nommer de personne réelle.
  - L'élève explique en quoi ce comportement nuit à d'autres personnes.
  - L'élève propose la règle de civilité ou la bonne attitude qui aurait évité cette gêne.
  indices:
    relance: Pense à un moment où quelqu'un n'a pas respecté une règle simple de politesse ou de partage.
    methode: Décris d'abord le comportement, puis explique qui il dérange et pourquoi, enfin donne la bonne attitude.
    etape: 'Tu peux commencer ainsi : « Une incivilité que j''ai déjà vue, c''est... »'
  solution: Une incivilité que j'ai déjà vue, c'est une personne qui a doublé tout le monde dans une file d'attente. Cela
    dérange les autres personnes qui attendaient patiemment leur tour, et cela leur paraît injuste. Il aurait fallu respecter
    son tour et se placer à la fin de la file.
- id: nblm-qu-est-ce-qu-une-incivilite-dans-la-vie-1
  type: choix
  difficulte: 2
  enonce: Qu'est-ce qu'une incivilité dans la vie de tous les jours ?
  reponse:
    options:
    - id: o1
      texte: Un comportement qui ne respecte pas les règles de la vie en société, sans être forcément interdit par la loi.
    - id: o2
      texte: Un crime très grave qui est obligatoirement puni par une peine de prison.
    - id: o3
      texte: Une simple maladresse involontaire, comme faire tomber son stylo par terre.
    - id: o4
      texte: Une règle officielle écrite dans la loi pour organiser les élections.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui distingue le manque de politesse d'une infraction grave à la loi.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente : une incivilité nuit à la vie commune mais n''est pas un crime ou un délit au sens
      de la loi.'
  - si:
      contient:
      - o3
    relance: Une maladresse est un accident non intentionnel, alors qu'une incivilité est un comportement irrespectueux des
      règles.
  - si:
      contient:
      - o4
    relance: Une incivilité n'est pas une règle de loi, c'est au contraire le non-respect des règles du bien vivre ensemble.
  solution: 'Un comportement qui ne respecte pas les règles de la vie en société, sans être forcément interdit par la loi.
    C''est la définition exacte de l''incivilité : un manquement aux règles de civilité qui gêne les autres, sans constituer
    un délit pénal.'
- id: nblm-pourquoi-est-il-grave-de-couper-la-file-2
  type: choix
  difficulte: 2
  enonce: Pourquoi est-il grave de couper la file d'attente ou de doubler les autres ?
  reponse:
    options:
    - id: o1
      texte: Parce que cela ne respecte pas le tour des autres et rend la vie en commun moins agréable.
    - id: o2
      texte: Parce que c'est un crime puni immédiatement par les tribunaux.
    - id: o3
      texte: Parce que cela permet aux personnes les plus pressées de passer en premier.
    - id: o4
      texte: Parce que la loi interdit strictly de marcher rapidement à côté d'une file.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au principe de respect de l'ordre d'arrivée de chacun.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur fréquente de confondre incivilité et crime : couper la file gêne les autres mais n''est pas
      un crime.'
  - si:
      contient:
      - o3
    relance: Penser uniquement à son propre intérêt au détriment des autres constitue précisément une attitude incivique.
  - si:
      contient:
      - o4
    relance: Ce n'est pas la vitesse de marche qui est en cause, mais le fait de ne pas attendre son tour.
  solution: Parce que cela ne respecte pas le tour des autres et rend la vie en commun moins agréable. Respecter son tour
    dans une file d'attente est une règle de civilité qui garantit l'équité et la tranquillité de tous.
- id: nblm-pourquoi-ne-faut-il-pas-crier-ou-parler-3
  type: choix
  difficulte: 2
  enonce: Pourquoi ne faut-il pas crier ou parler très fort au téléphone dans le bus ?
  reponse:
    options:
    - id: o1
      texte: Parce que cela dérange les autres passagers qui souhaitent faire un trajet calme.
    - id: o2
      texte: Parce que le chauffeur a le droit de confisquer le téléphone portable.
    - id: o3
      texte: Parce qu'il est totalement interdit de prononcer un seul mot dans les transports.
    - id: o4
      texte: Parce que le bruit produit dans le bus n'a aucun impact sur l'entourage.
    bonnes:
    - o1
  indices:
    relance: Pense au besoin de tranquillité de l'ensemble des passagers.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le chauffeur n'est pas là pour confisquer les téléphones ; il s'agit avant tout de respecter les personnes autour
      de soi.
  - si:
      contient:
      - o3
    relance: On peut discuter calmement dans le bus, c'est l'excès de bruit qui pose problème et gêne les passagers.
  - si:
      contient:
      - o4
    relance: Crier ou parler fort nuit directement à la tranquillité des personnes qui partagent le même espace.
  solution: Parce que cela dérange les autres passagers qui souhaitent faire un trajet calme. Ne pas faire trop de bruit dans
    les transports partagés préserve le confort et la sérénité des autres usagers.
- id: nblm-quelle-est-la-consequence-si-plusieurs-p-4
