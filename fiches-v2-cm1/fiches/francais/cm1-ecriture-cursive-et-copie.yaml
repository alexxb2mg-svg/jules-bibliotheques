  difficulte: 2
  enonce: Pourquoi la méthode consistant à copier un texte lettre par lettre est-elle déconseillée ?
  reponse:
    options:
    - id: o1
      texte: Parce qu'elle est très lente, fatigante et entraîne de nombreuses erreurs
    - id: o2
      texte: Parce qu'elle empêche le stylo de fonctionner correctement
    - id: o3
      texte: Parce qu'elle est réservée uniquement aux cours de dessin
    - id: o4
      texte: Parce qu'elle oblige à écrire de la main gauche
    bonnes:
    - o1
  indices:
    relance: Réfléchis au temps perdu et à la fatigue visuelle provoquée par des coups d'œil incessants.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : le fonctionnement du stylo ne dépend pas de la méthode de lecture de l''élève.'
  - si:
      contient:
      - o3
    relance: 'Faux : ce n''est pas une technique de dessin mais une mauvaise habitude de copie.'
  - si:
      contient:
      - o4
    relance: 'Faux : la méthode de copie ne change pas la main utilisée pour écrire.'
  solution: 'Parce qu''elle est très lente, fatigante et entraîne de nombreuses erreurs. C''est exact : multiplier les allers-retours
