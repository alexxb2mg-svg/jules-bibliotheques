    relance: 'Recherche les deux éléments essentiels du texte écrit : l''écriture des mots et les signes de ponctuation.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Faux : alterner les couleurs n''aide pas à repérer les erreurs et surcharge la présentation.'
  - si:
      contient:
      - o4
    relance: 'Faux : compter les syllabes orales n''est pas une méthode de vérification d''un texte copié.'
  solution: 'Vérifier l''orthographe des mots en les comparant avec le modèle ; Vérifier la ponctuation (majuscules, points,
