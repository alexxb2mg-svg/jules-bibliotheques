format: 2
notion: cm1-ecriture-cursive-et-copie
version: 3
etat: verifiee
declencheurs:
- écriture attachée
- copier un texte sans erreur
- écrire proprement
- recopier une leçon
- stratégie pour copier vite
- copier lettre par lettre trop lent
- lettres attachées
- recopier sans fautes
- mon écriture est illisible
prerequis: []
essentiel: 'En CM1, tu continues à t''entraîner aux gestes de l''écriture cursive. C''est l''écriture attachée : les lettres
  d''un mot sont reliées entre elles. Tu as commencé à l''apprendre plus tôt à l''école.


  Écrire à la main sert à deux choses. Tu copies des textes (une leçon, un poème, les devoirs). Tu produis aussi tes propres
  textes (une réponse, un récit).


  Copier demande des stratégies, c''est-à-dire des façons de faire efficaces. Il ne faut pas recopier lettre par lettre :
  c''est lent et fatigant. Il faut mémoriser un groupe de mots, l''écrire sans regarder le modèle, puis revenir au modèle
  pour le groupe suivant.


  Par exemple, pour « Le chat noir dort près du feu. », tu peux retenir « Le chat noir dort », l''écrire, puis retenir « près
  du feu. » et l''écrire.


  Après la copie, tu relis. Tu compares mot à mot avec le modèle. Tu vérifies l''orthographe (les mots bien écrits) et la
  ponctuation (points, virgules, majuscules).


  Le but du CM1 : recopier un texte de plusieurs lignes, assez vite, sans erreur d''orthographe ni de ponctuation. L''écriture
  doit être lisible (on peut la lire), régulière (des lettres de même taille) et soignée.


  La mise en forme compte aussi : on respecte les marges, on va à la ligne comme dans le modèle et on garde la page propre.
  Une bonne copie, c''est un texte que tout le monde peut relire facilement.

  '
methode:
- Lire d'abord tout le texte ou une phrase entière avant de commencer à écrire.
- Mémoriser un groupe de mots (pas seulement une lettre) avant de l'écrire.
- Écrire ce groupe de mots sans regarder à nouveau le modèle, si possible.
- Vérifier ensuite l'orthographe et la ponctuation en comparant avec le texte d'origine.
- 'Soigner la présentation : écriture régulière, lisible, marges respectées.'
vocabulaire:
- terme: écriture cursive
  definition: l'écriture attachée, où les lettres d'un mot sont reliées entre elles.
- terme: copie
  definition: un texte recopié à partir d'un modèle, sans rien changer.
- terme: stratégie de copie
  definition: une façon efficace de copier, par exemple mémoriser un groupe de mots avant de l'écrire.
- terme: ponctuation
  definition: les signes qui organisent les phrases, comme le point, la virgule ou le point d'interrogation.
- terme: lisible
  definition: se dit d'une écriture que l'on peut lire facilement.
- terme: mise en forme
  definition: la présentation du texte sur la page, avec les marges, les retours à la ligne et la propreté.
erreurs_frequentes:
- Copier lettre par lettre, ce qui est très lent et fatigant.
- Oublier de vérifier la ponctuation après avoir copié une phrase.
- Ne pas relire son texte copié pour repérer les erreurs.
- Oublier un mot ou une ligne entière en revenant au modèle au mauvais endroit.
- Écrire des lettres de tailles très différentes, ce qui rend la copie difficile à relire.
exemple:
  enonce: 'Tu dois recopier la phrase : « Le vieux chêne se dressait fièrement au milieu de la clairière. » Comment procéder
    efficacement ?'
  solution: On lit toute la phrase. On mémorise un premier groupe, « Le vieux chêne se dressait fièrement », et on l'écrit
    sans regarder. On revient au modèle pour mémoriser le second groupe, « au milieu de la clairière. », et on l'écrit. Enfin,
    on compare mot à mot avec le modèle pour vérifier l'orthographe (chêne, fièrement, clairière) et la ponctuation (majuscule
    au début, point à la fin).
exercices:
- id: meilleure-strategie
  type: choix
  difficulte: 1
  enonce: Quelle est la meilleure stratégie pour copier un texte rapidement et sans erreur ?
  reponse:
    options:
    - id: a
      texte: Mémoriser un groupe de mots avant de l'écrire, puis vérifier
    - id: b
      texte: Copier lettre par lettre en regardant le modèle à chaque lettre
    - id: c
      texte: Écrire vite sans jamais relire ensuite
    bonnes:
    - a
  indices:
    relance: 'Pense à ce qui permet d''aller plus vite : mémoriser une lettre à la fois, ou un groupe de mots ?'
    methode: Élimine la stratégie qui ne permet jamais de corriger d'erreurs.
    etape: Mémoriser plusieurs mots d'un coup évite de revenir sans cesse au modèle.
  pieges:
  - si:
      contient:
      - b
    relance: 'Copier lettre par lettre est très lent et fatigant : ce n''est pas la meilleure stratégie.'
  - si:
      contient:
      - c
    relance: Ne jamais relire empêche de repérer les erreurs d'orthographe ou de ponctuation.
  solution: La meilleure stratégie est de mémoriser un groupe de mots avant de l'écrire, puis de vérifier l'orthographe et
    la ponctuation en comparant avec le modèle.
- id: erreur-a-eviter
  type: choix
  difficulte: 1
  enonce: Pourquoi copier lettre par lettre est-il une mauvaise stratégie ?
  reponse:
    options:
    - id: a
      texte: Parce que c'est très lent et fatigant
    - id: b
      texte: Parce que cela rend l'écriture plus soignée
    - id: c
      texte: Parce que c'est interdit par le professeur
    bonnes:
    - a
  indices:
    relance: Pense au temps que ça prend de revenir sans cesse regarder le modèle.
    methode: Compare avec le fait de mémoriser un groupe entier de mots d'un coup.
    etape: Recopier une lettre puis regarder à nouveau le modèle, puis recopier une autre lettre... cela prend beaucoup de
      temps.
  pieges:
  - si:
      contient:
      - b
    relance: Ce n'est pas une question de soin de l'écriture, mais de vitesse et de fatigue.
  - si:
      contient:
      - c
    relance: 'Ce n''est pas interdit, mais ce n''est pas efficace : c''est trop lent.'
  solution: Copier lettre par lettre est très lent et fatigant, car il faut revenir sans cesse regarder le modèle au lieu
    de mémoriser un groupe de mots entier.
- id: nom-ecriture-attachee
  type: texte_court
  difficulte: 1
  enonce: 'Complète avec le mot de la leçon : l''écriture … est l''écriture attachée, où les lettres d''un mot sont reliées
    entre elles.'
  reponse:
    acceptees:
    - cursive
    - écriture cursive
    - l'écriture cursive
    fautes_tolerees: 1
  indices:
    relance: Relis le début de l'essentiel de la leçon.
    methode: 'Le mot cherché n''est pas « attachée » : c''est le nom que la leçon donne à cette écriture.'
    etape: Relis le vocabulaire de la leçon. Cherche l'expression qui a pour définition « l'écriture attachée ».
  pieges:
  - si:
      valeur: attachée
    relance: C'est le mot de tous les jours. La consigne demande l'autre nom, celui de la leçon.
  solution: L'écriture cursive est l'écriture attachée, où les lettres d'un mot sont reliées entre elles.
- id: ordre-etapes-copie
  type: ordre
  difficulte: 2
  enonce: Remets dans l'ordre les étapes pour bien copier une phrase.
  reponse:
    elements:
    - id: lire
      texte: Lire la phrase entière
    - id: memoriser
      texte: Retenir un groupe de mots dans sa tête
    - id: ecrire
      texte: Écrire ce groupe sans regarder le modèle
    - id: comparer
      texte: Comparer sa copie avec le modèle, mot à mot
  indices:
    relance: Que fais-tu en tout premier, avant même de prendre ton stylo ?
    methode: Pense à la méthode de la leçon. On ne peut pas écrire un groupe de mots avant de l'avoir retenu.
    etape: La vérification ne peut se faire qu'à la toute fin, quand il y a quelque chose à vérifier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque ! Deux étapes qui se suivent sont échangées. Peux-tu écrire un groupe de mots que tu n'as pas encore
      retenu ?
  - si:
      diagnostic: ordre_faux
    relance: Reprends depuis le début. Que fais-tu avant de prendre ton stylo, et que fais-tu à la toute fin ?
  solution: 'Ordre : lire la phrase entière, retenir un groupe de mots, l''écrire sans regarder le modèle, puis comparer sa
    copie avec le modèle mot à mot.'
- id: copie-parfaite
  type: choix
  difficulte: 2
  enonce: 'Le modèle est : « Où est mon cartable ? » Quelle copie est parfaite ?'
  reponse:
    options:
    - id: a
      texte: « Où est mon cartable ? »
    - id: b
      texte: « Ou est mon cartable ? »
    - id: c
      texte: « Où est mon cartable. »
    - id: d
      texte: « où est mon cartable ? »
    bonnes:
    - a
  indices:
    relance: Compare chaque copie avec le modèle, signe par signe.
    methode: Vérifie trois choses dans chaque copie, l'accent, la majuscule et le signe à la fin.
    etape: Une copie a perdu son accent, une autre sa majuscule, une autre son signe de fin. Il en reste une.
  pieges:
  - si:
      contient:
      - b
    relance: Regarde bien le premier mot. Il manque quelque chose sur une lettre.
  - si:
      contient:
      - c
    relance: Regarde le signe à la fin. Est-ce le même que dans le modèle ?
  - si:
      contient:
      - d
    relance: Regarde la première lettre de la phrase. Une phrase commence par une majuscule.
  solution: La copie a est parfaite. La copie b a oublié l'accent de « Où », la copie c a remplacé le point d'interrogation
    par un point, la copie d a oublié la majuscule.
- id: copier-groupes-de-mots
  type: texte_court
  difficulte: 2
  enonce: 'Recopie ce texte court en mémorisant des groupes de mots plutôt que des lettres : « La pluie tombait doucement
    sur le toit de la maison. »'
  reponse:
    acceptees:
    - La pluie tombait doucement sur le toit de la maison.
    - la pluie tombait doucement sur le toit de la maison
    fautes_tolerees: 1
  indices:
    relance: Découpe la phrase en deux ou trois groupes de mots à mémoriser.
    methode: Lis toute la phrase, mémorise un groupe, écris-le sans regarder, puis passe au groupe suivant.
    etape: Un premier groupe possible est « La pluie tombait doucement », un second « sur le toit de la maison. »
  pieges:
  - si:
      valeur: La pluie tombe doucement sur le toit de la maison
    relance: 'Attention au temps du verbe : relis bien la phrase modèle, il faut recopier exactement « tombait ».'
  solution: 'Le texte doit être recopié sans erreur d''orthographe ni de ponctuation, avec une écriture cursive lisible et
    régulière : « La pluie tombait doucement sur le toit de la maison. »'
- id: probleme-et-verification
  type: association
  difficulte: 3
  enonce: Relie chaque problème trouvé dans une copie à ce qu'il fallait vérifier.
  reponse:
    gauche:
    - id: point-oublie
      texte: Le point de la fin a disparu.
    - id: mot-mal-ecrit
      texte: « chêne » est écrit « chaine ».
    - id: lettres-inegales
      texte: Certaines lettres sont énormes, d'autres minuscules.
    - id: texte-colle-au-bord
      texte: Le texte touche le bord de la feuille.
    droite:
    - id: ponctuation
      texte: la ponctuation
    - id: orthographe
      texte: l'orthographe
    - id: regularite
      texte: la régularité de l'écriture
    - id: marges
      texte: la mise en forme (les marges)
    paires:
      point-oublie: ponctuation
      mot-mal-ecrit: orthographe
      lettres-inegales: regularite
      texte-colle-au-bord: marges
  indices:
    relance: Pour chaque problème, demande-toi s'il concerne un signe, un mot, la forme des lettres ou la place sur la page.
    methode: Les signes comme le point font partie de la ponctuation ; la façon d'écrire un mot, c'est l'orthographe.
    etape: La taille des lettres concerne la façon de former l'écriture, pas les mots eux-mêmes.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis le problème qui parle de la page et celui qui parle des lettres.
  - si:
      diagnostic: associations_fausses
    relance: Reprends un problème à la fois. Est-ce un signe, un mot, la taille des lettres ou la place sur la feuille ?
  solution: 'Point oublié : la ponctuation. « chaine » au lieu de « chêne » : l''orthographe. Lettres de tailles différentes
    : la régularité de l''écriture. Texte collé au bord : la mise en forme (les marges).'
- id: chronometrer-copie
  type: ouverte
  difficulte: 2
  enonce: Chronomètre-toi pour recopier cinq lignes de ton livre de lecture. Relis ensuite pour corriger d'éventuelles erreurs.
  criteres:
  - La copie est lisible et régulière.
  - La copie ne comporte pas d'erreur d'orthographe ni de ponctuation après relecture.
  - L'élève indique le temps mis, pour pouvoir le comparer à un prochain essai.
  indices:
    relance: Ne regarde pas le modèle à chaque lettre.
    methode: Mémorise des groupes de mots, comme dans la méthode, avant d'écrire.
    etape: Vérifie la ponctuation à la fin de chaque phrase copiée.
  solution: La copie est lisible, sans erreur après relecture, et le temps mis diminue avec l'entraînement régulier de cette
    stratégie.
- id: nblm-comment-appelle-t-on-egalement-l-ecritur-1
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on également l'écriture cursive que tu travailles en CM1 pour écrire à la main ?
  reponse:
    options:
    - id: o1
      texte: L'écriture attachée
    - id: o2
      texte: L'écriture imprimée
    - id: o3
      texte: L'écriture informatique
    - id: o4
      texte: L'écriture en majuscules
    bonnes:
    - o1
  indices:
    relance: Pense au geste de la main qui relie les lettres les unes aux autres sans lever le crayon.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : l''écriture imprimée ou scripte comporte des lettres séparées, contrairement à la cursive.'
  - si:
      contient:
      - o3
    relance: 'Faux : l''écriture informatique s''effectue sur un clavier et n''est pas une écriture manuscrite.'
  - si:
      contient:
      - o4
    relance: 'Faux : l''écriture en majuscules ne désigne pas le tracé continu des lettres liées.'
  solution: 'L''écriture attachée. C''est exact : l''écriture cursive est couramment appelée écriture attachée, car les lettres
    sont liées entre elles.'
- id: nblm-quelle-est-la-meilleure-strategie-pour-r-2
  type: choix
  difficulte: 2
  enonce: Quelle est la meilleure stratégie pour recopier une leçon rapidement et sans erreur ?
  reponse:
    options:
    - id: o1
      texte: Mémoriser des groupes de mots entiers avant de les écrire
    - id: o2
      texte: Copier lettre par lettre en levant les yeux à chaque fois
    - id: o3
      texte: Écrire le plus vite possible sans jamais relire sa feuille
    - id: o4
      texte: Recopier seulement les mots faciles et sauter les autres
    bonnes:
    - o1
  indices:
    relance: Cherche la méthode qui consiste à garder plusieurs mots dans sa mémoire avant de poser son crayon.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : copier lettre par lettre est trop lent, fatigant et fait perdre le sens de ce qu''on écrit.'
  - si:
      contient:
      - o3
    relance: 'Faux : sans relecture, on risque de laisser des oublis ou des fautes d''orthographe.'
  - si:
      contient:
      - o4
    relance: 'Faux : recopier une leçon exige d''écrire l''intégralité du texte sans rien omettre.'
  solution: 'Mémoriser des groupes de mots entiers avant de les écrire. C''est exact : retenir une unité de sens ou un groupe
    de mots évite les allers-retours inutiles et accélère la copie.'
- id: nblm-que-faut-il-faire-en-tout-premier-lieu-a-3
  type: choix
  difficulte: 2
  enonce: Que faut-il faire en tout premier lieu avant de commencer à écrire une phrase à recopier ?
  reponse:
    options:
    - id: o1
      texte: Lire d'abord toute la phrase ou tout le texte pour en comprendre le sens
    - id: o2
      texte: Commencer à écrire immédiatement le premier mot dès qu'on le voit
    - id: o3
      texte: Compter le nombre total de lettres présentes dans la phrase
    - id: o4
      texte: Recopier d'abord la ponctuation à la fin de la ligne
    bonnes:
    - o1
  indices:
    relance: Pense à l'action d'observation globale avec les yeux qu'il faut faire avant le tracé manuscrit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : écrire sans lecture préalable augmente le risque d''erreurs et de coupures maladroites.'
  - si:
      contient:
      - o3
    relance: 'Faux : compter les lettres n''apporte rien à la compréhension ni à la mémorisation du texte.'
  - si:
      contient:
      - o4
    relance: 'Faux : on recopie le texte dans l''ordre de la lecture, du début vers la fin.'
  solution: 'Lire d''abord toute la phrase ou tout le texte pour en comprendre le sens. C''est exact : lire la phrase entière
    permet de comprendre ce qu''on va recopier et de mieux mémoriser les mots.'
- id: nblm-pourquoi-la-methode-consistant-a-copier-4
