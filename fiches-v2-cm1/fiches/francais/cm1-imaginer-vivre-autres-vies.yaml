      - o2
    relance: 'Erreur typique : confondre la projection par l''imagination avec une obligation réelle.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : réduire la lecture d''œuvres à un exercice de grammaire.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : croire que la lecture doit être neutre et sans sentiment.'
  solution: Ils aident le lecteur à se projeter dans des existences nouvelles et différentes de la sienne. Les récits de vie
