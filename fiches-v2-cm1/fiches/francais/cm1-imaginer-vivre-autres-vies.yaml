# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-imaginer-vivre-autres-vies
version: 3
etat: verifiee
declencheurs:
- se mettre à la place d'un personnage
- imaginer une autre vie
- s'identifier à un personnage
- vivre une aventure à travers un livre
- je lui ressemble pas du tout
- ce que je ferais à sa place
- personnage d'un autre pays
- j'aurais pas fait comme lui
prerequis:
- cm1-merveilleux-etrange
essentiel: 'Quand on lit, on peut vivre d''autres vies que la sienne. On part sur une île déserte, dans un autre pays ou à
  une autre époque, sans quitter sa chaise. On s''immerge dans un univers étranger ou insolite, c''est-à-dire très différent
  du nôtre, parfois surprenant.


  Parfois, on s''identifie à un personnage : on se reconnaît en lui, on ressent ce qu''il ressent, comme si on était à sa
  place. Par exemple, tu as peur avec l''héroïne quand elle se perd dans la forêt, ou tu es content quand elle retrouve son
  chemin.


  Parfois, au contraire, on se démarque du personnage : on se dit « moi, je n''aurais pas fait ça ». On n''est pas d''accord
  avec ses choix, et c''est aussi une manière de s''engager dans sa lecture. Pas besoin de ressembler à un personnage pour
  aimer son histoire.


  S''engager personnellement, c''est donner son avis, comparer avec sa propre vie, se demander ce qu''on aurait fait. On le
  fait avec des œuvres intégrales, c''est-à-dire des livres lus en entier, ou avec des extraits choisis. Ces œuvres peuvent
  être patrimoniales, donc anciennes, ou contemporaines, donc écrites à notre époque.


  La littérature de jeunesse offre beaucoup de récits de vie, qui aident à se projeter dans des existences nouvelles. Imaginer
  la vie d''un enfant très différent de toi développe l''empathie : la capacité à comprendre ce que ressent quelqu''un d''autre.


  Ces lectures développent aussi la sensibilité et la créativité, et elles donnent encore plus envie de lire.

  '
methode:
- Repérer qui est le personnage principal et dans quel univers il vit.
- Relever ce que le personnage ressent à un moment précis de l'histoire.
- Se demander en quoi cette vie ressemble ou diffère de la sienne.
- Imaginer ce que l'on ressentirait et ce que l'on ferait à la place du personnage.
- Dire si l'on est d'accord ou non avec ses choix, en donnant une raison.
vocabulaire:
- terme: s'identifier
  definition: se reconnaître dans un personnage, comme si on était à sa place.
- terme: se démarquer
  definition: se sentir différent d'un personnage et ne pas être d'accord avec ses choix.
- terme: empathie
  definition: la capacité à ressentir ce qu'une autre personne ou un personnage peut ressentir.
- terme: œuvre intégrale
  definition: un livre lu en entier, du début à la fin.
- terme: insolite
  definition: ce qui est inhabituel et surprenant.
- terme: contemporain
  definition: qui est écrit à notre époque.
erreurs_frequentes:
- Résumer seulement l'histoire sans se demander ce que l'on ressentirait à la place du personnage.
- Croire qu'on doit forcément ressembler au personnage pour apprécier l'histoire.
- Dire « je ne suis pas d'accord avec lui » sans expliquer pourquoi.
- Confondre ce que ressent le personnage et ce que ressent le lecteur.
exemple:
  enonce: Dans un roman, un enfant vit seul sur une île après un naufrage. Comment un lecteur peut-il « vivre une autre vie
    » en lisant ce livre ?
  solution: 'Le lecteur peut s''imaginer à la place de l''enfant : ressentir sa solitude, sa peur la première nuit, puis sa
    fierté quand il construit une cabane. Il n''a jamais vécu de naufrage, mais il se projette dans cette existence nouvelle.
    Il peut aussi se démarquer : « moi, j''aurais d''abord cherché de l''eau ». Dans les deux cas, il s''engage dans sa lecture.'
exercices:
- id: sens-identification
  type: choix
  difficulte: 1
  enonce: Que signifie « s'identifier à un personnage » quand on lit un livre ?
  reponse:
    options:
    - id: a
      texte: Se reconnaître dans le personnage, comme si on était à sa place
    - id: b
      texte: Écrire le même prénom que le personnage sur son cahier
    - id: c
      texte: Dessiner le portrait du personnage
    - id: d
      texte: Compter le nombre de fois où le personnage apparaît
    bonnes:
    - a
  indices:
    relance: Le mot « identifier » vient de « identité ». Que fait-on avec sa propre identité par rapport au personnage ?
    methode: S'identifier, c'est un lien intérieur avec un personnage, ressentir ce qu'il ressent.
    etape: C'est un lien intérieur, pas une action matérielle comme dessiner ou écrire un prénom.
  pieges:
  - si:
      contient:
      - b
    relance: S'identifier n'est pas une action matérielle comme écrire un prénom, c'est un lien intérieur avec le personnage.
  - si:
      contient:
      - c
    relance: Dessiner le portrait est une activité créative différente, ce n'est pas s'identifier au personnage.
  - si:
      contient:
      - d
    relance: Compter ses apparitions ne dit rien de ce que tu ressens pour lui. Cherche un lien intérieur.
  solution: S'identifier à un personnage, c'est se reconnaître en lui, comme si on ressentait ce qu'il ressent, à sa place.
- id: existence-nouvelle
  type: choix
  difficulte: 2
  enonce: Un élève lit un roman sur un enfant qui vit seul sur une île après un naufrage. En quoi cette lecture lui permet-elle
    de « vivre une autre vie » ?
  reponse:
    options:
    - id: a
      texte: En se projetant dans une existence très différente de la sienne, même s'il ne l'a jamais vécue
    - id: b
      texte: En apprenant à naviguer sur un vrai bateau
    - id: c
      texte: En mémorisant uniquement le vocabulaire maritime du livre
    - id: d
      texte: En comparant le nombre de pages du livre à un autre roman
    bonnes:
    - a
  indices:
    relance: Le lecteur vit-il réellement un naufrage ? Que fait-il à la place ?
    methode: Vivre une autre vie par la lecture, c'est se projeter par l'imagination, pas vivre réellement la même situation.
    etape: Le lecteur s'imagine à la place du personnage, ressent sa solitude, sans avoir vécu de naufrage lui-même.
  pieges:
  - si:
      contient:
      - b
    relance: Il ne s'agit pas d'apprendre une compétence pratique réelle, mais de se projeter par l'imagination dans une vie
      différente.
  - si:
      contient:
      - c
    relance: Apprendre des mots est utile, mais vivre une autre vie, c'est ressentir ce que vit le personnage.
  - si:
      contient:
      - d
    relance: Le nombre de pages ne fait pas voyager. Que fait l'imagination du lecteur ?
  solution: Le lecteur se projette par l'imagination dans une existence très différente de la sienne, en ressentant ce que
    vivrait le personnage, sans l'avoir vécu lui-même.
- id: developpe-quoi
  type: choix
  difficulte: 2
  enonce: Selon le programme, que développe la lecture de récits de vie très différents de la sienne, en plus du goût pour
    la lecture ?
  reponse:
    options:
    - id: a
      texte: La sensibilité, l'empathie et la créativité
    - id: b
      texte: Uniquement la rapidité de lecture
    - id: c
      texte: Uniquement la connaissance de la grammaire
    - id: d
      texte: Uniquement la mémoire des dates historiques
    bonnes:
    - a
  indices:
    relance: 'Relis la fin de l''essentiel : trois qualités personnelles sont citées.'
    methode: Le texte insiste sur des qualités humaines développées par l'identification aux personnages.
    etape: Ces qualités concernent la capacité à ressentir et à imaginer, pas des connaissances scolaires précises.
  pieges:
  - si:
      contient:
      - b
    relance: Lire vite n'est pas ce que développe particulièrement ce type de lecture. Pense à ressentir et imaginer.
  - si:
      contient:
      - c
    relance: La grammaire n'est pas ce que développe particulièrement ce type de lecture, selon le programme.
  - si:
      contient:
      - d
    relance: Les dates, c'est plutôt l'histoire. Ici, il s'agit de ressentir et d'imaginer.
  solution: Cela développe la sensibilité, l'empathie et la créativité du lecteur, en plus de renforcer son goût pour la lecture.
- id: identifier-ou-demarquer
  type: association
  difficulte: 1
  enonce: Relie chaque réaction de lecteur à ce qu'elle montre.
  reponse:
    gauche:
    - id: tremble
      texte: « J'ai tremblé avec Max quand il était perdu dans la tempête. »
    - id: pas-fait
      texte: « Moi, je n'aurais jamais abandonné mon ami comme Zoé l'a fait. »
    - id: meme-peur
      texte: « Comme Nour, j'ai peur le premier jour dans une nouvelle école. »
    - id: pas-d-accord
      texte: « Je ne suis pas d'accord avec Arthur, il aurait dû dire la vérité. »
    droite:
    - id: identifie
      texte: Le lecteur s'identifie au personnage
    - id: demarque
      texte: Le lecteur se démarque du personnage
    paires:
      tremble: identifie
      pas-fait: demarque
      meme-peur: identifie
      pas-d-accord: demarque
  indices:
    relance: Dans chaque phrase, le lecteur se sent-il proche du personnage ou différent de lui ?
    methode: S'identifier, c'est ressentir la même chose. Se démarquer, c'est ne pas être d'accord avec ses choix.
    etape: Repère les phrases qui contiennent « Moi, je n'aurais » ou « pas d'accord ».
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis les phrases où le lecteur ressent la même chose que le personnage.
  - si:
      diagnostic: associations_fausses
    relance: Cherche d'abord les phrases où le lecteur dit qu'il aurait agi autrement.
  solution: Le lecteur s'identifie quand il tremble avec Max ou a la même peur que Nour. Il se démarque quand il dit qu'il
    n'aurait pas abandonné son ami ou qu'Arthur aurait dû dire la vérité.
- id: mot-empathie
  type: texte_court
  difficulte: 2
  enonce: Quel mot désigne la capacité à comprendre et à ressentir ce que ressent une autre personne ou un personnage ?
  reponse:
    acceptees:
    - empathie
    - l'empathie
    fautes_tolerees: 2
  indices:
    relance: C'est une qualité que développent les récits de vie, avec la sensibilité et la créativité.
    methode: Relis le vocabulaire de la fiche. Le mot désigne le fait de se mettre à la place de l'autre pour ressentir.
    etape: Relis la fin de la leçon, là où elle parle des récits de vie et de la vie d'un enfant très différent de toi.
  pieges:
  - si:
      valeur: sensibilité
    relance: La sensibilité, c'est être touché par les choses. Le mot cherché parle de ressentir ce que vit quelqu'un d'autre.
  - si:
      valeur: créativité
    relance: La créativité, c'est inventer. Le mot cherché parle de comprendre les sentiments d'un autre.
  solution: 'L''empathie : la capacité à ressentir ce qu''une autre personne ou un personnage peut ressentir.'
- id: oeuvres-pour-s-engager
  type: choix
  difficulte: 2
  enonce: Avec quelles lectures peut-on s'engager personnellement, en s'identifiant aux personnages ou en s'en démarquant
    ?
  reponse:
    options:
    - id: a
      texte: Avec des œuvres anciennes ou récentes, lues en entier ou en extraits choisis
    - id: b
      texte: Seulement avec des livres très récents
    - id: c
      texte: Seulement avec des livres lus en entier, jamais avec un extrait
    - id: d
      texte: Seulement avec des livres dont le héros a le même âge que soi
    bonnes:
    - a
  indices:
    relance: Les options b, c et d contiennent toutes le mot « seulement ». Est-ce que le programme est aussi strict ?
    methode: Le programme parle d'œuvres patrimoniales ou contemporaines, d'œuvres intégrales ou d'extraits choisis.
    etape: Patrimonial veut dire ancien, contemporain veut dire récent. Quelle option garde les deux ?
  pieges:
  - si:
      contient:
      - b
    relance: Les œuvres anciennes, celles du patrimoine, permettent aussi de vivre d'autres vies.
  - si:
      contient:
      - c
    relance: Un extrait bien choisi peut déjà faire réagir et donner envie de se mettre à la place du personnage.
  - si:
      contient:
      - d
    relance: Pas besoin de ressembler au personnage. On peut vivre la vie d'un adulte ou d'un enfant d'une autre époque.
  solution: On s'engage dans la lecture d'œuvres patrimoniales (anciennes) ou contemporaines (récentes), lues en entier ou
    en extraits choisis.
- id: ce-que-ressent-le-lecteur
  type: choix
  difficulte: 3
  enonce: Lis ce passage. « Amina regardait le bateau s'éloigner. Son grand frère partait pour un long voyage. Elle serra
    fort le petit caillou qu'il lui avait donné. » Quelle phrase montre qu'un lecteur s'identifie à Amina ?
  reponse:
    options:
    - id: a
      texte: « J'ai eu la gorge serrée, comme quand ma grande sœur est partie en colonie. »
    - id: b
      texte: « Le passage parle d'un bateau et d'un caillou. »
    - id: c
      texte: « Amina a un grand frère. »
    bonnes:
    - a
  indices:
    relance: Deux phrases ne font que résumer le texte. Laquelle parle de ce que le lecteur ressent ?
    methode: S'identifier, c'est relier le sentiment du personnage à quelque chose qu'on a soi-même vécu ou ressenti.
    etape: Cherche la phrase où le lecteur dit « je » et compare avec sa propre vie.
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase décrit le texte, mais le lecteur ne dit rien de ce qu'il ressent.
  - si:
      contient:
      - c
    relance: C'est une information juste, mais elle ne montre aucun lien entre le lecteur et Amina.
  solution: 'La phrase a : le lecteur ressent la même tristesse qu''Amina et la relie à un moment de sa propre vie. Les phrases
    b et c résument seulement le texte.'
- id: journal-du-personnage
  type: ouverte
  difficulte: 3
  enonce: Choisis un personnage d'un livre que tu as lu. Écris quelques lignes de son journal, à la première personne, comme
    si tu étais lui. Puis dis en une phrase si tu aurais fait comme lui.
  criteres:
  - L'élève écrit à la première personne (« je ») et respecte ce que vit le personnage dans le livre.
  - L'élève exprime au moins un sentiment du personnage.
  - L'élève dit s'il aurait agi de la même façon, avec une raison.
  indices:
    relance: Choisis un moment fort de l'histoire, où le personnage ressent quelque chose d'intense.
    methode: Écris comme si tu étais lui, avec « je », puis ajoute ce qu'il ressent à ce moment-là.
    etape: Pour finir, écris une phrase comme « Moi, à sa place, j'aurais... parce que... ».
  solution: 'Exemple : « Cher journal, aujourd''hui je suis arrivé seul sur l''île. J''avais peur, mais j''ai trouvé une source.
    » Puis : « Moi, à sa place, j''aurais aussi cherché de l''eau en premier, parce que c''est vital. »'
- id: nblm-que-signifie-s-identifier-a-un-personnag-1
  type: choix
  difficulte: 2
  enonce: Que signifie « s'identifier » à un personnage dans une histoire ?
  reponse:
    options:
    - id: o1
      texte: Se reconnaître dans le personnage et ressentir ce qu'il vit comme si on était à sa place
    - id: o2
      texte: Recopier la description physique du personnage dans son cahier de classe
    - id: o3
      texte: Chercher uniquement les fautes d'orthographe dans le texte du livre
    - id: o4
      texte: Changer le nom du personnage par son propre prénom sur la couverture
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui se passe dans ta tête quand tu te mets dans la peau du héros.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre l''immersion dans la lecture avec un simple exercice de copie.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : adopter une posture de correction au lieu d''entrer dans l''univers du récit.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre l''identification littéraire avec une modification matérielle du livre.'
  solution: 'Se reconnaître dans le personnage et ressentir ce qu''il vit comme si on était à sa place. C''est la définition
    exacte : s''identifier consiste à se reconnaître dans le personnage et à vivre ses émotions à sa place.'
- id: nblm-qu-est-ce-que-l-empathie-chez-un-lecteur-2
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que l'empathie chez un lecteur selon la fiche de la notion ?
  reponse:
    options:
    - id: o1
      texte: La capacité à ressentir ce qu'une autre personne ou un personnage peut éprouver
    - id: o2
      texte: L'obligation de ressembler physiquement au personnage principal de l'histoire
    - id: o3
      texte: La faculté de lire une page complète sans s'arrêter ni faire de pause
    - id: o4
      texte: Le fait d'apprendre par cœur le dictionnaire pour comprendre tous les mots
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que tu ressens quand un personnage vit un moment triste ou joyeux.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : croire qu''il faut ressembler au personnage pour ressentir ses émotions.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre la sensibilité du lecteur avec la vitesse de lecture.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre l''empathie avec l''étude pure du vocabulaire.'
  solution: La capacité à ressentir ce qu'une autre personne ou un personnage peut éprouver. L'empathie est la capacité d'un
