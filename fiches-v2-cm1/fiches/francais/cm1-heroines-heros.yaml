# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-heroines-heros
version: 3
etat: verifiee
declencheurs:
- c'est quoi un héros
- pourquoi ce personnage est courageux
- un héros a-t-il peur
- les valeurs d'un héros
- personnage qui sauve les autres
- qualités d'une héroïne
- le héros a des défauts
- pourquoi il aide son ami
prerequis:
- cm1-cours-moyen-sept-oeuvres
essentiel: 'Une héroïne ou un héros est souvent le personnage principal d''une histoire : celui qui agit, qui ose, qui change
  le cours des choses. On les rencontre dans les œuvres anciennes (la littérature patrimoniale) et dans les livres écrits
  pour les jeunes (la littérature de jeunesse).


  On découvre des héros dans beaucoup de genres : l''épopée, le roman, la fable, le conte, la nouvelle et la pièce de théâtre.
  Une héroïne a la même place qu''un héros : une fille ou une femme peut être le personnage qui agit et défend des valeurs.


  Un héros n''est pas toujours un super-héros. Il n''est pas forcément grand, fort ou parfait. Dans le conte de Perrault,
  le Petit Poucet est le plus petit de ses frères, mais c''est lui qui trouve comment les sauver.


  Pour comprendre un héros, on cherche ses motivations : ce qui le pousse à agir. Il peut agir pour sauver quelqu''un, pour
  réparer une injustice ou pour tenir une promesse.


  Un héros peut aussi avoir des fragilités : il a peur, il doute, il se trompe parfois. Ces fragilités le rendent plus humain.
  Avoir peur et agir quand même, c''est justement du courage.


  Enfin, on s''interroge sur les valeurs morales et culturelles que porte le personnage : le courage, la justice, la loyauté,
  l''entraide, la générosité. On se demande aussi si on est d''accord avec ses choix, et pourquoi.

  '
methode:
- Identifier le personnage principal de l'histoire et ce qu'il accomplit.
- Chercher ce qui motive ce personnage à agir.
- 'Repérer ses éventuelles peurs ou fragilités : un héros peut avoir peur.'
- S'interroger sur les valeurs que ce personnage défend (le courage, l'entraide, la justice...).
- Donner ton avis sur ses choix en t'appuyant sur un passage précis du texte.
vocabulaire:
- terme: motivation
  definition: la raison qui pousse un personnage à agir
- terme: fragilité
  definition: une peur, un doute ou une faiblesse d'un personnage, qui le rend humain
- terme: personnage principal
  definition: le personnage dont l'histoire raconte surtout les actions
- terme: valeur
  definition: une idée importante qui guide nos actions, comme le courage, la justice ou la loyauté
- terme: loyauté
  definition: le fait de rester fidèle à quelqu'un, de ne pas le trahir
- terme: littérature patrimoniale
  definition: des œuvres anciennes que l'on continue de lire et de transmettre, comme les contes de Perrault ou les fables
    de La Fontaine
erreurs_frequentes:
- Croire qu'un héros ou une héroïne n'a jamais peur ni de doutes.
- Ne retenir que les actions du personnage sans réfléchir à ses motivations ni à ses valeurs.
- Penser qu'un héros doit forcément être grand, fort ou avoir des super-pouvoirs.
- Croire que seuls les garçons ou les hommes peuvent être des héros.
exemple:
  enonce: Dans une histoire, un jeune garçon a très peur mais décide quand même d'aider son ami en danger. Peut-on dire que
    c'est un héros ?
  solution: 'Oui : avoir peur ne l''empêche pas d''être un héros. Sa fragilité, c''est sa peur. Sa motivation, c''est sauver
    son ami. Il agit malgré sa peur, poussé par des valeurs comme l''entraide, la loyauté et le courage.'
exercices:
- id: heros-et-peur
  type: choix
  difficulte: 1
  enonce: Un personnage a très peur mais décide quand même d'aider son ami en danger. Peut-on encore le considérer comme un
    héros ?
  reponse:
    options:
    - id: a
      texte: Oui, avoir peur n'empêche pas d'être un héros si on agit quand même
    - id: b
      texte: Non, un vrai héros n'a jamais peur
    - id: c
      texte: Non, dès qu'un personnage a peur, ce n'est plus un héros
    - id: d
      texte: Cela dépend uniquement de son âge
    bonnes:
    - a
  indices:
    relance: Ce qui compte pour un héros, est-ce de ne jamais avoir peur, ou d'agir malgré sa peur ?
    methode: Un héros peut avoir des fragilités, comme la peur ; ce qui compte, c'est qu'il agit quand même.
    etape: Le personnage agit malgré sa peur, poussé par une valeur comme l'entraide.
  pieges:
  - si:
      contient:
      - b
    relance: 'Un héros peut avoir peur : ce qui définit son courage, c''est d''agir malgré cette peur, pas de ne jamais la
      ressentir.'
  - si:
      contient:
      - c
    relance: 'La peur ne retire pas le statut de héros : au contraire, agir malgré la peur montre le courage du personnage.'
  - si:
      contient:
      - d
    relance: L'âge ne décide pas qui est un héros. Regarde plutôt ce que le personnage fait malgré sa peur.
  solution: Oui, avoir peur ne l'empêche pas d'être un héros. Ce qui compte, c'est qu'il agit malgré sa fragilité, poussé
    par une valeur comme l'entraide ou le courage.
- id: genres-heros
  type: choix
  difficulte: 1
  enonce: Dans quels types d'œuvres peut-on découvrir des héroïnes et des héros, selon le programme ?
  reponse:
    options:
    - id: a
      texte: Épopée, roman, fable, conte, nouvelle, pièce de théâtre
    - id: b
      texte: Uniquement dans les bandes dessinées de super-héros
    - id: c
      texte: Uniquement dans les fables de La Fontaine
    - id: d
      texte: Uniquement dans les films
    bonnes:
    - a
  indices:
    relance: Le programme cite plusieurs genres littéraires, pas un seul type d'œuvre.
    methode: 'Relis l''essentiel : plusieurs genres sont cités ensemble comme sources possibles de héros.'
    etape: Les genres cités incluent à la fois des textes anciens (épopée) et plus variés (roman, conte, théâtre...).
  pieges:
  - si:
      contient:
      - b
    relance: Les bandes dessinées de super-héros ne sont pas le seul type d'œuvre cité par le programme.
  - si:
      contient:
      - c
    relance: Les fables de La Fontaine sont un exemple parmi d'autres genres cités, pas le seul.
  - si:
      contient:
      - d
    relance: Le programme parle d'œuvres écrites, de livres et de textes, pas seulement de films.
  solution: On découvre des héroïnes et des héros à travers l'épopée, le roman, la fable, le conte, la nouvelle et la pièce
    de théâtre.
- id: motivation-mot
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la raison qui pousse un personnage à agir ? (un seul mot)
  reponse:
    acceptees:
    - motivation
    - la motivation
    - sa motivation
    - motivations
    fautes_tolerees: 1
  indices:
    relance: Quand un héros sauve son ami, on se demande pourquoi il le fait. Quel nom donne-t-on à ce « pourquoi » ?
    methode: Cherche dans le vocabulaire de la fiche le mot qui désigne ce qui pousse quelqu'un à faire quelque chose.
    etape: Ce mot est un nom de la même famille que le verbe « motiver ».
  pieges:
  - si:
      valeur: fragilité
    relance: La fragilité, c'est une peur ou un doute. Ici, on cherche la raison qui fait agir le personnage.
  - si:
      valeur: valeur
    relance: Une valeur est une idée importante, comme le courage. Le mot cherché désigne la raison précise d'agir.
  solution: 'On appelle cela la motivation : la raison qui pousse un personnage à agir.'
- id: motivation-vs-action
  type: choix
  difficulte: 2
  enonce: Un élève décrit seulement ce que fait un personnage (« il sauve son ami ») sans expliquer pourquoi il le fait. Que
    lui manque-t-il pour bien analyser ce personnage ?
  reponse:
    options:
    - id: a
      texte: Réfléchir à la motivation du personnage, c'est-à-dire pourquoi il agit ainsi
    - id: b
      texte: Rien, décrire l'action suffit toujours
    - id: c
      texte: Compter le nombre de pages du livre
    - id: d
      texte: Changer le titre du livre
    bonnes:
    - a
  indices:
    relance: 'Relis l''essentiel : que cherche-t-on à comprendre en plus des actions d''un personnage ?'
    methode: Il ne suffit pas de dire ce que fait le personnage, il faut aussi comprendre pourquoi il le fait et quelles valeurs
      il porte.
    etape: Ce qui manque, c'est la raison pour laquelle le personnage agit.
  pieges:
  - si:
      contient:
      - b
    relance: 'Décrire seulement l''action ne suffit pas : il faut aussi chercher la motivation et les valeurs du personnage.'
  - si:
      contient:
      - c
    relance: Le nombre de pages ne dit rien sur le personnage. Demande-toi pourquoi il agit.
  - si:
      contient:
      - d
    relance: Le titre du livre ne change rien à l'analyse du personnage. Demande-toi pourquoi il agit.
  solution: Il manque la réflexion sur la motivation du personnage, c'est-à-dire ce qui le pousse à agir, ainsi que les valeurs
    qu'il défend.
- id: valeurs-et-actions
  type: association
  difficulte: 2
  enonce: Relie chaque action d'un personnage à la valeur qu'elle montre le mieux.
  reponse:
    gauche:
    - id: partage
      texte: Elle partage son repas avec un enfant qui n'a rien à manger.
    - id: secret
      texte: Il garde le secret de son ami, même quand on le menace.
    - id: defense
      texte: Elle prend la défense d'un camarade accusé à tort.
    - id: foret
      texte: Il entre dans la forêt sombre malgré sa peur pour retrouver sa sœur.
    droite:
    - id: generosite
      texte: la générosité
    - id: loyaute
      texte: la loyauté
    - id: justice
      texte: la justice
    - id: courage
      texte: le courage
    paires:
      partage: generosite
      secret: loyaute
      defense: justice
      foret: courage
  indices:
    relance: Pour chaque action, demande-toi quelle idée importante guide le personnage.
    methode: 'Rappelle-toi le sens de chaque valeur : donner aux autres, rester fidèle, défendre ce qui est juste, agir malgré
      la peur.'
    etape: Commence par l'action où le personnage a peur mais avance quand même.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association ne va pas. Relis la définition de la loyauté et celle de la justice.
  - si:
      diagnostic: associations_fausses
    relance: Reprends une action à la fois et cherche la valeur qui l'explique le mieux.
  solution: Partager son repas montre la générosité ; garder le secret de son ami montre la loyauté ; défendre un camarade
    accusé à tort montre la justice ; entrer dans la forêt malgré sa peur montre le courage.
- id: analyser-un-heros
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour analyser une héroïne ou un héros.
  reponse:
    elements:
    - id: lire
      texte: Lire l'histoire en entier
    - id: reperer
      texte: Repérer le personnage principal et ce qu'il accomplit
    - id: pourquoi
      texte: Chercher pourquoi il agit et ce qui lui fait peur
    - id: valeurs
      texte: Dire quelles valeurs il défend et donner son avis
  indices:
    relance: Peux-tu parler d'un personnage si tu n'as pas encore lu son histoire ?
    methode: On part du texte, puis de ce que fait le personnage, puis de ses raisons, et on termine par ce qu'il défend.
    etape: Donner son avis vient à la toute fin. Que faut-il avoir fait juste avant de chercher pourquoi le héros agit ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Laquelle vient avant l''autre ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la toute première étape et la toute dernière, puis range celles du milieu.
  solution: On lit l'histoire en entier, on repère le personnage et ce qu'il accomplit, on cherche pourquoi il agit et ce
    qui lui fait peur, puis on dit quelles valeurs il défend et on donne son avis.
- id: petit-heros-fable
  type: choix
  difficulte: 3
  enonce: Dans la fable de La Fontaine « Le Lion et le Rat », un petit rat libère le lion pris dans un filet en rongeant une
    maille. Que nous apprend ce personnage sur les héros ?
  reponse:
    options:
    - id: a
      texte: Un personnage petit et faible peut accomplir une action héroïque
    - id: b
      texte: Seuls les personnages les plus forts peuvent sauver les autres
    - id: c
      texte: Le héros est toujours le roi des animaux
    - id: d
      texte: Un héros doit toujours être un être humain
    bonnes:
    - a
  indices:
    relance: Qui est le plus fort des deux animaux ? Et qui sauve l'autre ?
    methode: Un héros se reconnaît à ce qu'il fait, pas à sa taille ou à sa force.
    etape: C'est le plus petit des deux qui sauve le plus fort.
  pieges:
  - si:
      contient:
      - b
    relance: Dans cette fable, le plus fort est prisonnier. Qui le sauve ?
  - si:
      contient:
      - c
    relance: Ici, le lion est le roi des animaux, mais c'est lui qui a besoin d'aide. Regarde qui agit.
  - si:
      contient:
      - d
    relance: Dans une fable, les personnages sont souvent des animaux. Un animal peut donc être le héros de l'histoire.
  solution: Le rat est petit et faible, mais c'est lui qui sauve le lion. Un personnage petit et faible peut donc accomplir
    une action héroïque.
- id: presenter-un-heros
  type: ouverte
  difficulte: 3
  enonce: Choisis une héroïne ou un héros d'un livre ou d'un conte que tu as lu. En quatre ou cinq phrases, dis ce qu'il accomplit,
    pourquoi il agit, une de ses fragilités et une valeur qu'il défend.
  criteres:
  - L'élève nomme le personnage et dit ce qu'il accomplit dans l'histoire.
  - L'élève explique la motivation du personnage et cite au moins une de ses fragilités (peur, doute, erreur).
  - L'élève nomme une valeur (courage, justice, loyauté, entraide...) et la relie à une action précise du personnage.
  indices:
    relance: Pense au personnage d'un livre que tu as aimé. Qu'est-ce qu'il fait de remarquable ?
    methode: 'Réponds à quatre questions dans l''ordre : que fait-il ? pourquoi ? de quoi a-t-il peur ? quelle valeur montre-t-il
      ?'
    etape: Tu peux commencer par « Le héros de mon livre s'appelle… ; il… ».
  solution: Réussite si tu dis ce que fait le personnage, pourquoi il agit, une de ses fragilités, et une valeur reliée à
    une de ses actions.
