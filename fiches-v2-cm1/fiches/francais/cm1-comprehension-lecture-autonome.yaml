# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-comprehension-lecture-autonome
version: 3
etat: verifiee
declencheurs:
- comprendre ce que je lis
- trouver la réponse dans le texte
- information cachée
- sous-entendu
- comprendre tout seul un texte
- lire entre les lignes
- reconnaître un poème ou du théâtre
prerequis:
- cm1-fluidite-lecture
essentiel: 'Comprendre un texte tout seul demande des stratégies. Il ne suffit pas de lire les mots : il faut se représenter
  ce qui se passe, comme un film dans sa tête.


  Certaines informations sont explicites : elles sont écrites noir sur blanc dans le texte. Pour les retrouver, on revient
  dans le texte et on cherche la phrase qui les dit.


  D''autres informations sont implicites : elles ne sont pas écrites, mais on peut les deviner grâce à des indices. Dans «
  Léo enfila son manteau et son écharpe : la neige tombait depuis le matin », le texte ne dit pas qu''il fait froid. Pourtant
  on le comprend grâce au manteau, à l''écharpe et à la neige. Une information implicite s''appuie toujours sur des indices
  du texte, pas sur ce qu''on imagine sans raison.


  Pour bien comprendre, on fait aussi attention aux mots qui désignent les personnages. « Il », « le garçon », « l''enfant
  » peuvent tous désigner Léo. Il faut savoir de qui on parle.


  On peut aussi reconnaître le genre d''un texte grâce à sa mise en page. Un poème est écrit en vers, des lignes souvent courtes,
  avec parfois des rimes. Une pièce de théâtre montre le nom du personnage avant chaque réplique. Un texte narratif raconte
  une histoire en paragraphes.


  Quand on ne comprend plus, on s''arrête, on relit le passage et on cherche les indices.

  '
methode:
- Lire le texte en entier une première fois pour comprendre l'histoire dans les grandes lignes.
- 'Repérer les informations explicites : ce qui est écrit clairement dans le texte.'
- 'Chercher les informations implicites : ce que l''on comprend sans que ce soit écrit, grâce aux indices.'
- Vérifier de qui parle chaque pronom ou chaque mot qui désigne un personnage.
- Regarder la mise en page (vers, dialogue, paragraphes) pour identifier le genre du texte.
- Pour répondre à une question, revenir dans le texte et montrer la phrase ou l'indice qui justifie la réponse.
vocabulaire:
- terme: explicite
  definition: une information écrite clairement dans le texte
- terme: implicite
  definition: une information non écrite, que l'on comprend grâce à des indices
- terme: indice
  definition: un mot ou un détail du texte qui aide à deviner une information
- terme: vers
  definition: une ligne d'un poème, souvent courte, qui peut rimer avec une autre
- terme: réplique
  definition: ce que dit un personnage dans une pièce de théâtre
erreurs_frequentes:
- Répondre de mémoire sans revenir vérifier dans le texte.
- Confondre ce qui est écrit dans le texte et ce qu'on imagine sans indice.
- Ne pas reconnaître un poème ou un extrait de théâtre à cause de sa mise en page particulière.
- Se tromper de personnage parce qu'on n'a pas vérifié qui désigne « il » ou « elle ».
exemple:
  enonce: 'Dans ce texte : « Léo enfila son manteau et son écharpe avant de sortir : la neige tombait depuis le matin. » Que
    peut-on deviner sans que ce soit écrit ?'
  solution: 'Le texte ne dit pas qu''il fait froid, mais on le devine (information implicite) : Léo met un manteau et une
    écharpe, et il neige.'
exercices:
- id: explicite-ou-implicite
  type: choix
  difficulte: 1
  enonce: Dans le texte « Marion regarda le ciel se couvrir de nuages noirs et courut ramasser le linge étendu dans le jardin
    », comment appelle-t-on l'information « il va bientôt pleuvoir », qui n'est pas écrite mais qu'on devine ?
  reponse:
    options:
    - id: a
      texte: Une information explicite
    - id: b
      texte: Une information implicite
    - id: c
      texte: Une information fausse
    - id: d
      texte: Un titre
    bonnes:
    - b
  indices:
    relance: Est-ce que la phrase « il va pleuvoir » est écrite mot pour mot dans le texte ?
    methode: Une information peut être écrite noir sur blanc, ou bien seulement devinée grâce à des indices du texte. Laquelle
      des deux est-ce ici ?
    etape: 'Ici, l''information se devine grâce aux nuages noirs et à Marion qui court : elle n''est pas écrite.'
  pieges:
  - si:
      contient:
      - a
    relance: Une information explicite serait écrite mot pour mot dans le texte. Ici, il faut la deviner grâce à des indices.
  - si:
      contient:
      - c
    relance: 'L''information n''est pas fausse : elle est simplement sous-entendue, pas écrite directement.'
  solution: 'C''est une information implicite : le texte ne dit pas « il va pleuvoir », mais on le devine grâce aux nuages
    noirs et à Marion qui se dépêche de rentrer le linge.'
- id: info-explicite-texte
  type: texte_court
  difficulte: 1
  enonce: « Le samedi matin, Nadia allait au marché avec son grand-père. Ils achetaient toujours des pommes. » Avec qui Nadia
    allait-elle au marché ?
  reponse:
    acceptees:
    - avec son grand-père
    - son grand-père
    - grand-père
    fautes_tolerees: 2
  indices:
    relance: La réponse est écrite dans le texte. Relis la première phrase.
    methode: Pour une information explicite, on retrouve la phrase qui la dit et on recopie les bons mots.
    etape: Cherche le mot qui suit « avec » dans la première phrase.
  pieges:
  - si:
      valeur: les pommes
    relance: Les pommes, c'est ce qu'ils achetaient. La question demande avec qui elle y allait.
  solution: 'avec son grand-père : c''est écrit dans la première phrase, c''est une information explicite.'
- id: qui-est-il
  type: choix
  difficulte: 1
  enonce: « Tom appela son chien. Rex accourut en remuant la queue. Il sauta dans les bras de son maître. » Qui saute dans
    les bras de son maître ?
  reponse:
    options:
    - id: a
      texte: Tom
    - id: b
      texte: Rex
    - id: c
      texte: le maître de Tom
    bonnes:
    - b
  indices:
    relance: Qui a un maître dans ce texte ?
    methode: Le pronom « Il » reprend un personnage déjà nommé. Cherche lequel peut sauter dans les bras de son maître.
    etape: Tom appelle son chien. Comment s'appelle le chien ?
  pieges:
  - si:
      contient:
      - a
    relance: Tom ne peut pas sauter dans ses propres bras. Le maître, c'est lui.
  - si:
      contient:
      - c
    relance: Le maître ne saute pas dans ses propres bras. Relis la deuxième phrase.
  solution: 'Rex, le chien : « Il » reprend Rex, qui vient d''accourir, et son maître est Tom.'
- id: implicite-indices
  type: choix
  difficulte: 2
  enonce: « Inès souffla les huit bougies pendant que toute la famille chantait. Puis elle déchira le papier de ses cadeaux.
    » Que peut-on comprendre, même si ce n'est pas écrit ?
  reponse:
    options:
    - id: a
      texte: C'est l'anniversaire d'Inès.
    - id: b
      texte: Inès part en vacances.
    - id: c
      texte: Inès est malade.
    bonnes:
    - a
  indices:
    relance: Quand souffle-t-on des bougies en chantant et en ouvrant des cadeaux ?
    methode: Rassemble les indices du texte (bougies, chanson, cadeaux) et cherche la situation qui va avec tous.
    etape: Huit bougies, cela peut aussi dire quel âge elle a.
  pieges:
  - si:
      contient:
      - b
    relance: Aucun indice du texte ne parle de voyage ou de valise.
  - si:
      contient:
      - c
    relance: Aucun indice ne parle de maladie. Une information implicite s'appuie toujours sur des indices du texte.
  solution: 'C''est l''anniversaire d''Inès : le texte ne le dit pas, mais les bougies, la chanson et les cadeaux sont des
    indices. On devine même qu''elle a huit ans.'
- id: genre-mise-en-page
  type: choix
  difficulte: 2
  enonce: Un texte est composé de lignes courtes qui riment deux à deux. À quel genre appartient-il le plus probablement ?
  reponse:
    options:
    - id: a
      texte: Un poème
    - id: b
      texte: Un texte documentaire
    - id: c
      texte: Une pièce de théâtre
    - id: d
      texte: Un texte narratif en prose
    bonnes:
    - a
  indices:
    relance: Quel genre de texte est reconnaissable à ses vers et à ses rimes ?
    methode: 'Pense aux caractéristiques d''écriture propres à chaque genre : dialogue pour le théâtre, vers et rimes pour
      la poésie.'
    etape: Des lignes courtes qui riment ont une mise en page bien particulière, différente d'un texte en prose ou d'un dialogue
      de théâtre.
  pieges:
  - si:
      contient:
      - c
    relance: Une pièce de théâtre se reconnaît plutôt au nom des personnages suivi de leurs répliques, pas aux rimes.
  - si:
      contient:
      - d
    relance: Un texte narratif en prose s'écrit en paragraphes continus, pas en lignes courtes et rimées.
  - si:
      contient:
      - b
    relance: Un texte documentaire donne des informations en paragraphes, souvent avec des titres et des images, pas en lignes
      qui riment.
  solution: 'C''est probablement un poème : les vers courts et les rimes sont des caractéristiques de la mise en page d''un
    poème.'
- id: genre-et-indice
  type: association
  difficulte: 2
  enonce: Relie chaque genre de texte à l'indice de mise en page qui permet de le reconnaître.
  reponse:
    gauche:
    - id: a
      texte: poème
    - id: b
      texte: pièce de théâtre
    - id: c
      texte: texte narratif
    droite:
    - id: x
      texte: des vers, des lignes courtes qui peuvent rimer
    - id: y
      texte: le nom du personnage avant chaque réplique
    - id: z
      texte: une histoire racontée en paragraphes
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Dans quel genre de texte les personnages parlent-ils chacun à leur tour, avec leur nom devant ?
    methode: Pense à la forme de chaque texte sur la page, avant même de le lire.
    etape: Les rimes vont avec un genre bien précis. Commence par lui.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel de ces genres s'écrit en paragraphes ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par le genre qui a des rimes, puis par celui où l'on lit le nom des personnages.
  solution: poème-des vers qui peuvent rimer, pièce de théâtre-le nom du personnage avant chaque réplique, texte narratif-une
    histoire en paragraphes.
- id: strategie-comprehension
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour bien comprendre un texte tout seul.
  reponse:
    elements:
    - id: lecture-globale
      texte: Lire le texte en entier pour comprendre l'histoire dans les grandes lignes
    - id: explicite
      texte: Repérer les informations explicites, écrites clairement
    - id: implicite
      texte: Chercher les informations implicites, grâce aux indices
    - id: justifier
      texte: Revenir dans le texte pour montrer la phrase ou l'indice qui justifie ta réponse
  indices:
    relance: Que fait-on en tout premier, avant même de chercher des informations précises ?
    methode: On commence par une vue d'ensemble du texte, puis on cherche des informations de plus en plus précises.
    etape: La première étape est de lire le texte en entier, sans encore chercher de détail.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque. Deux étapes voisines sont inversées : laquelle vient avant l''autre ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la lecture globale, tout au début, avant de chercher les informations explicites et implicites.
  solution: On lit d'abord le texte en entier, on repère les informations explicites, puis les informations implicites, et
    on revient dans le texte pour justifier sa réponse.
- id: justifier-implicite
  type: ouverte
  difficulte: 3
  enonce: « Quand Sami rentra, ses chaussures laissèrent des traces de boue sur le carrelage. Sa mère soupira en prenant la
    serpillière. » Que peut-on deviner sur l'humeur de la mère ? Cite les indices du texte qui te le font penser.
  criteres:
  - L'élève dit que la mère est agacée, ennuyée ou mécontente.
  - L'élève cite au moins un indice du texte (elle soupire, elle doit nettoyer la boue).
  - L'élève ne s'appuie pas sur des idées absentes du texte.
  indices:
    relance: Que fait la mère quand elle voit la boue ?
    methode: Une information implicite se justifie toujours par des mots du texte. Repère les gestes de la mère.
    etape: On soupire souvent quand quelque chose nous ennuie. Qu'est-ce qui l'oblige à prendre la serpillière ?
  solution: 'La mère est agacée ou ennuyée : ce n''est pas écrit, mais elle soupire et doit nettoyer la boue laissée par les
    chaussures de Sami.'
- id: nblm-dans-un-texte-comment-appelle-t-on-une-i-1
  type: choix
  difficulte: 2
  enonce: Dans un texte, comment appelle-t-on une information qui est écrite clairement, noir sur blanc ?
  reponse:
    options:
    - id: o1
      texte: Une information explicite
    - id: o2
      texte: Une information implicite
    - id: o3
      texte: Un sous-entendu
    - id: o4
      texte: Une information imaginaire
    bonnes:
    - o1
  indices:
    relance: Pense au mot qui désigne ce qui est exprimé très clairement.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, l'information implicite n'est pas écrite directement ; il faut la deviner grâce à des indices.
  - si:
      contient:
      - o3
    relance: Un sous-entendu est une information cachée ou non dite clairement, c'est donc de l'implicite.
  - si:
      contient:
      - o4
    relance: Une information imaginaire est inventée par le lecteur et ne s'appuie pas sur le texte.
  solution: Une information explicite. C'est exact ! Une information explicite est rédigée clairement et directement dans
    le texte.
- id: nblm-quand-tu-dois-deviner-une-information-ca-2
  type: choix
  difficulte: 2
  enonce: Quand tu dois deviner une information cachée dans le texte sans qu'elle soit écrite directement, que cherches-tu
    ?
  reponse:
    options:
    - id: o1
      texte: Une information implicite
    - id: o2
      texte: Une information explicite
    - id: o3
      texte: Un titre de chapitre
    - id: o4
      texte: Une faute d'orthographe
    bonnes:
    - o1
  indices:
    relance: C'est le terme opposé à 'explicite'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Non, l'information explicite est déjà écrite clairement noir sur blanc.
  - si:
      contient:
      - o3
    relance: Le titre de chapitre est une information visible et explicite.
  - si:
      contient:
      - o4
    relance: Les fautes d'orthographe ne sont pas des informations cachées du texte.
  solution: Une information implicite. Bravo ! L'information implicite se comprend grâce aux indices laissés par l'auteur.
- id: nblm-quelle-est-l-erreur-frequente-a-eviter-q-3
  type: choix
  difficulte: 2
  enonce: Quelle est l'erreur fréquente à éviter quand on cherche à comprendre tout seul un texte ?
  reponse:
    options:
    - id: o1
      texte: Répondre de mémoire sans revenir vérifier dans le texte
    - id: o2
      texte: Relire le texte une deuxième fois
    - id: o3
      texte: Regarder la mise en page du document
    - id: o4
      texte: Chercher des indices dans les phrases
    bonnes:
    - o1
  indices:
    relance: Pense à ce réflexe essentiel qu'il faut avoir après une première lecture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Relire le texte est une très bonne stratégie de compréhension.
  - si:
      contient:
      - o3
    relance: Observer la mise en page permet de reconnaître le genre du texte, ce n'est pas une erreur.
  - si:
      contient:
      - o4
    relance: Chercher des indices est nécessaire pour déduire les sous-entendus.
  solution: Répondre de mémoire sans revenir vérifier dans le texte. C'est bien cela ! Il faut toujours retourner au texte
    pour vérifier ses réponses.
- id: nblm-comment-reconnaitre-qu-un-texte-est-un-p-4
  type: choix
  difficulte: 2
  enonce: Comment reconnaître qu'un texte est un poème grâce à sa mise en page et ses caractéristiques d'écriture ?
  reponse:
    options:
    - id: o1
      texte: Grâce à sa mise en page en vers et à la présence de rimes
    - id: o2
      texte: Parce qu'il présente des dialogues de théâtre avec les noms des personnages
    - id: o3
      texte: Parce qu'il n'y a aucun paragraphe ni saut de ligne
    - id: o4
      texte: Parce qu'il donne des explications scientifiques illustrées
    bonnes:
    - o1
  indices:
    relance: Observe la forme des lignes et le retour des mêmes sons en fin de ligne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: La mise en page du dialogue avec le nom des personnages correspond au théâtre.
  - si:
      contient:
      - o3
    relance: Un poème est au contraire structuré en strophes et en vers.
  - si:
      contient:
      - o4
    relance: Un document scientifique est un texte documentaire, pas un poème.
  solution: Grâce à sa mise en page en vers et à la présence de rimes. Exactement ! Les vers (lignes courtes) et les rimes
    caractérisent le poème.
- id: nblm-dans-la-phrase-leo-enfila-son-manteau-et-5
  type: choix
  difficulte: 2
  enonce: 'Dans la phrase « Léo enfila son manteau et son écharpe avant de sortir : la neige tombait depuis le matin », quelle
    est l''information implicite ?'
  reponse:
    options:
    - id: o1
      texte: Il fait très froid dehors
    - id: o2
      texte: Le personnage s'appelle Léo
    - id: o3
      texte: La neige tombait depuis le matin
    - id: o4
      texte: Léo met un manteau et une écharpe
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce que le manteau, l'écharpe et la neige t'indiquent sur la température.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une information explicite car le prénom Léo est écrit noir sur blanc.
  - si:
      contient:
      - o3
    relance: C'est écrit directement dans la phrase, c'est donc une information explicite.
  - si:
      contient:
      - o4
    relance: Cette action est directement décrite dans le texte, elle est explicite.
  solution: Il fait très froid dehors. Bravo ! Le texte ne dit pas le mot 'froid', mais la neige, le manteau et l'écharpe
    permettent de le deviner.
- id: nblm-quelles-sont-les-deux-bonnes-methodes-po-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les DEUX bonnes méthodes pour bien comprendre un texte en autonomie ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Lire le texte en entier une première fois pour comprendre l'histoire dans les grandes lignes
    - id: o2
      texte: Chercher les informations implicites en s'appuyant sur les indices du texte
    - id: o3
      texte: Inventer des réponses sans tenir compte des indices du texte
    - id: o4
      texte: Sauter les passages difficiles sans chercher à les comprendre
    bonnes:
    - o1
    - o2
  indices:
    relance: Repère la première étape de lecture et la façon de découvrir les sous-entendus.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Non, une information implicite s'appuie toujours sur des indices réels du texte.
  - si:
      contient:
      - o4
    relance: Pour bien comprendre, il faut s'arrêter sur les passages importants et chercher leur sens.
  solution: Lire le texte en entier une première fois pour comprendre l'histoire dans les grandes lignes ; Chercher les informations
    implicites en s'appuyant sur les indices du texte. C'est juste ! La première lecture globale permet de saisir l'histoire
    dans son ensemble.
- id: nblm-une-information-qui-n-est-pas-ecrite-dir-7
  type: texte_court
  difficulte: 1
  enonce: Une information qui n'est pas écrite directement mais que l'on comprend grâce à des indices est une information
    _____ .
  reponse:
    acceptees:
    - implicite
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par un 'i' et s'oppose à 'explicite'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: implicite. C'est exact ! Le mot 'implicite' qualifie une information sous-entendue qu'on devine grâce aux indices.
- id: nblm-une-information-qui-est-ecrite-clairemen-8
  type: texte_court
  difficulte: 1
  enonce: Une information qui est écrite clairement, noir sur blanc dans le texte, est une information _____ .
  reponse:
    acceptees:
    - explicite
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par un 'e' et s'oppose à 'implicite'.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: explicite. Bravo ! L'adjectif 'explicite' désigne tout ce qui est formulé clairement dans le texte.
sources:
- titre: Éduscol, « Exemples pour la mise en œuvre du programme de français en CM1 » (2025), p. 3
