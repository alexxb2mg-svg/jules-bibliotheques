# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-se-decouvrir-saffirmer
version: 3
etat: verifiee
declencheurs:
- se découvrir à travers un livre
- personnage qui change au fil de l'histoire
- rencontre qui transforme un personnage
- trouver sa place parmi les autres
- personnage qui prend confiance en lui
- grandir dans une histoire
- héros timide qui ose enfin
- personnage différent à la fin
- oser dire non dans l'histoire
prerequis: []
essentiel: 'Se découvrir, c''est apprendre qui l''on est vraiment : ce qu''on aime, ce qui nous fait peur, ce dont on est
  capable. S''affirmer, c''est oser le montrer aux autres, par exemple en donnant son avis ou en disant non.


  C''est une aventure à la fois intime et collective. Intime, parce qu''elle se passe à l''intérieur de soi. Collective, parce
  qu''on change aussi grâce aux autres : amis, famille, adultes, et même adversaires.


  On rencontre cette aventure chez les personnages des récits, des romans, des bandes dessinées et des pièces de théâtre.
  Face aux défis de l''existence (une peur, une injustice, un départ, une dispute), ils se construisent et se redéfinissent.


  Ce qui les fait changer, ce sont leurs rencontres et leur propre cheminement. Le cheminement, c''est le chemin intérieur
  que fait le personnage, étape par étape. Par exemple, une fille qui n''osait pas jouer à la récréation finit par proposer
  un jeu, après qu''une camarade l''a invitée.


  Un personnage n''est pas tout gentil ou tout méchant. Il peut être courageux et avoir peur en même temps, ou se tromper
  puis réparer son erreur. C''est cela, la complexité humaine.


  Pour bien lire ces histoires, compare le personnage au début et à la fin, et cherche ce qui l''a fait changer. En classe,
  on en parle ensemble : ces lectures et ces échanges t''aident, toi aussi, à grandir.

  '
methode:
- Repérer un personnage qui change au cours de l'histoire.
- Décrire ce personnage au début de l'histoire avec deux ou trois mots.
- Identifier l'événement ou la rencontre qui provoque ce changement.
- Décrire comment le personnage est différent à la fin de l'histoire par rapport au début.
- Chercher un moment où le personnage montre deux sentiments à la fois (peur et courage, par exemple).
- Faire le lien, si possible, avec sa propre expérience de grandir ou de changer.
vocabulaire:
- terme: personnage
  definition: une personne, un animal ou une créature qui agit dans une histoire.
- terme: se découvrir
  definition: apprendre qui l'on est vraiment, ce qu'on aime et ce dont on est capable.
- terme: s'affirmer
  definition: oser montrer aux autres qui l'on est, donner son avis ou dire non.
- terme: rencontre
  definition: le moment où un personnage fait la connaissance de quelqu'un qui va compter pour lui.
- terme: cheminement
  definition: le chemin intérieur que fait un personnage, étape par étape, au fil de l'histoire.
- terme: complexité humaine
  definition: le fait qu'une personne ne soit jamais toute d'une pièce, mais ait des qualités et des défauts mêlés.
erreurs_frequentes:
- Décrire un personnage seulement au début ou seulement à la fin, sans voir son évolution.
- Ne pas relier le changement du personnage à un événement précis de l'histoire.
- Ranger un personnage dans une seule case (« il est méchant ») alors qu'il a plusieurs facettes.
- Confondre ce qui arrive au personnage (l'événement) et ce que cela change en lui (son évolution).
exemple:
  enonce: Au début d'un roman, un enfant timide n'ose pas parler en classe. À la fin, il prend la parole devant tout le monde
    après s'être fait un nouvel ami. Comment ce personnage s'est-il découvert ?
  solution: 'Au début, l''enfant est timide et silencieux. Puis il rencontre un nouvel ami : cette rencontre lui donne confiance
    en lui. À la fin, il ose prendre la parole devant toute la classe. Il s''est découvert (il sait maintenant qu''il en est
    capable) et il s''est affirmé (il le montre aux autres). Son changement vient d''une rencontre et de son propre cheminement.'
exercices:
- id: reperer-evolution
  type: choix
  difficulte: 1
  enonce: Qu'est-ce qui montre qu'un personnage « se découvre » au fil d'une histoire ?
  reponse:
    options:
    - id: a
      texte: Il change ou grandit à cause de ce qu'il vit ou de qui il rencontre
    - id: b
      texte: Il garde exactement le même caractère du début à la fin
    - id: c
      texte: Il n'apparaît que dans un seul chapitre du livre
    bonnes:
    - a
  indices:
    relance: Pense à un personnage qui, à la fin de l'histoire, n'est plus tout à fait comme au début.
    methode: Élimine l'option qui décrit un personnage qui ne bouge pas du tout.
    etape: 'Se découvrir, c''est évoluer grâce à ce qu''on vit : rencontres, épreuves, décisions.'
  pieges:
  - si:
      contient:
      - b
    relance: Si le personnage garde exactement le même caractère, il ne s'est pas découvert ni affirmé.
  - si:
      contient:
      - c
    relance: Le nombre de chapitres où il apparaît ne dit rien sur son évolution intérieure.
  solution: Un personnage se découvre quand il change ou grandit à cause de ce qu'il vit ou de qui il rencontre, au fil de
    l'histoire.
- id: identifier-declencheur
  type: texte_court
  difficulte: 1
  enonce: Dans l'exemple de l'enfant timide, quel événement a déclenché son changement ?
  reponse:
    acceptees:
    - la rencontre avec un nouvel ami
    - il s'est fait un nouvel ami
    - un nouvel ami
    - la rencontre d'un ami
    fautes_tolerees: 2
  indices:
    relance: 'Relis l''exemple : que se passe-t-il juste avant que l''enfant prenne la parole devant tout le monde ?'
    methode: Cherche l'événement précis, pas juste le résultat (« il parle en classe »).
    etape: Juste avant qu'il prenne la parole, l'enfant vit une nouvelle relation avec quelqu'un de son âge.
  pieges:
  - si:
      valeur: il parle en classe
    relance: Ça, c'est le résultat du changement, pas ce qui l'a déclenché. Que se passe-t-il juste avant ?
  solution: C'est la rencontre avec un nouvel ami qui lui donne confiance en lui et le pousse à s'affirmer.
- id: vrai-faux-decouverte
  type: choix
  difficulte: 1
  enonce: Un personnage qui se découvre dans une histoire agit-il forcément tout seul, sans jamais être influencé par les
    autres ?
  reponse:
    options:
    - id: a
      texte: Non, il se construit souvent grâce à ses rencontres avec les autres
    - id: b
      texte: Oui, il ne dépend jamais des autres personnages
    bonnes:
    - a
  indices:
    relance: 'Repense à l''exemple de l''enfant timide : qui l''a aidé à changer ?'
    methode: La consigne officielle parle de personnages qui se construisent « au gré de leurs rencontres ».
    etape: Une rencontre avec un autre personnage (ami, adulte, ennemi) déclenche souvent le changement.
  pieges:
  - si:
      contient:
      - b
    relance: Dans les histoires étudiées, les personnages se transforment justement grâce à leurs rencontres, pas seuls.
  solution: 'Non : un personnage se découvre et s''affirme souvent grâce à ses rencontres avec les autres, pas seul dans son
    coin.'
- id: supports-des-recits
  type: association
  difficulte: 2
  enonce: Relie chaque forme de récit à ce qui la caractérise.
  reponse:
    gauche:
    - id: roman
      texte: Un roman
    - id: bande-dessinee
      texte: Une bande dessinée
    - id: piece-de-theatre
      texte: Une pièce de théâtre
    droite:
    - id: long-recit
      texte: Un long récit écrit en phrases, découpé en chapitres
    - id: cases-bulles
      texte: Une histoire racontée en images, dans des cases, avec des bulles
    - id: dialogues-joues
      texte: Un texte fait de répliques, écrit pour être joué par des comédiens
    paires:
      roman: long-recit
      bande-dessinee: cases-bulles
      piece-de-theatre: dialogues-joues
  indices:
    relance: Pense à l'objet lui-même. Lequel a des images ? Lequel est fait pour une scène ?
    methode: Commence par la forme que tu reconnais le plus facilement, puis place les deux autres.
    etape: Dans un de ces textes, les personnages parlent tour à tour devant un public. Lequel ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une association est fausse. Vérifie en pensant aux images et aux comédiens.
  - si:
      diagnostic: associations_fausses
    relance: Reprends une forme à la fois et demande-toi comment on la lit, ou comment on la regarde.
  solution: Le roman est un long récit écrit en phrases et découpé en chapitres. La bande dessinée raconte en images, dans
    des cases, avec des bulles. La pièce de théâtre est faite de répliques, écrites pour être jouées. Dans les trois, on peut
    suivre un personnage qui se découvre.
- id: etapes-du-cheminement
  type: ordre
  difficulte: 2
  enonce: Voici l'histoire de Lina, mélangée. Range les étapes dans l'ordre de son cheminement.
  reponse:
    elements:
    - id: seule
      texte: Lina, nouvelle à l'école, reste seule dans un coin de la cour.
    - id: invitation
      texte: Un garçon de sa classe l'invite à jouer au ballon avec son équipe.
    - id: epreuve
      texte: Lina rate un tir et a envie d'abandonner, mais l'équipe l'encourage.
    - id: affirmation
      texte: À la fin de l'année, c'est Lina qui propose les nouveaux jeux à toute la cour.
  indices:
    relance: Où en est Lina tout au début ? Et tout à la fin ?
    methode: Place d'abord la situation de départ et la situation finale, puis range les deux étapes du milieu.
    etape: Lina ne peut pas rater un tir avant d'avoir été invitée à jouer. Quelle étape vient donc en deuxième ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées. Laquelle doit arriver d'abord pour que l'autre soit possible ?
  - si:
      diagnostic: ordre_faux
    relance: Cherche d'abord la Lina du début, seule et timide, puis celle de la fin, sûre d'elle.
  solution: Lina est seule dans la cour (situation de départ), un garçon l'invite à jouer (la rencontre), elle rate un tir
    mais l'équipe l'encourage (l'épreuve), puis elle propose elle-même les jeux (elle s'est affirmée).
- id: personnage-complexe
  type: choix
  difficulte: 3
  enonce: 'Lis ce petit texte. « Hugo tremblait. Il avait peur des chiens. Pourtant, quand le gros chien aboya contre sa petite
    sœur, il se plaça devant elle et cria : Va-t''en ! » Que montre ce passage sur Hugo ?'
  reponse:
    options:
    - id: a
      texte: Hugo a peur et, en même temps, il est capable de courage pour protéger sa sœur
    - id: b
      texte: Hugo n'a peur de rien, il est toujours courageux
    - id: c
      texte: Hugo est seulement peureux, il ne fait rien
    - id: d
      texte: Hugo n'aime pas sa sœur
    bonnes:
    - a
  indices:
    relance: Relève ce que ressent Hugo au début du texte, puis ce qu'il fait ensuite.
    methode: Un personnage peut ressentir une chose et agir autrement. Cherche le mot qui marque l'opposition.
    etape: Le mot « Pourtant » annonce une opposition. Que ressent Hugo ? Et que fait-il malgré cela ?
  pieges:
  - si:
      contient:
      - b
    relance: Relis la première phrase. Que fait Hugo au début, et pourquoi ?
  - si:
      contient:
      - c
    relance: Relis la fin du texte. Hugo reste-t-il immobile ?
  - si:
      contient:
      - d
    relance: Qui Hugo protège-t-il en se plaçant devant le chien ?
  solution: 'Hugo tremble, il a peur des chiens. Pourtant, il se met devant sa sœur et crie : il a peur et il est courageux
    à la fois. Un personnage n''est pas tout d''une pièce : c''est la complexité humaine.'
- id: personnage-avant-apres
  type: ouverte
  difficulte: 2
  enonce: Choisis un personnage d'un livre que tu as lu qui change au cours de l'histoire. Décris-le au début, puis à la fin.
  criteres:
  - L'élève nomme un personnage précis d'un livre lu.
  - L'élève décrit le personnage au début de l'histoire.
  - L'élève décrit le personnage à la fin, en montrant une différence claire avec le début.
  indices:
    relance: Compare son caractère, ses peurs ou ses envies au début et à la fin.
    methode: Note d'abord trois mots pour le décrire au début, puis trois mots pour le décrire à la fin.
    etape: Cherche un moment de l'histoire où ce personnage agit différemment de ce qu'il aurait fait au début.
  solution: La réponse doit citer un personnage précis et montrer une différence claire entre son état au début de l'histoire
    et son état à la fin.
- id: evenement-declencheur-ouvert
  type: ouverte
  difficulte: 2
  enonce: Quel événement ou quelle rencontre a provoqué ce changement chez le personnage que tu as choisi ?
  criteres:
  - L'élève cite un événement ou une rencontre précise de l'histoire, pas une impression générale.
  - L'élève relie clairement cet événement au changement observé chez le personnage.
  indices:
    relance: Cherche un moment précis de l'histoire, pas une impression générale.
    methode: 'Demande-toi : juste avant ce changement, que vient-il de se passer pour le personnage ?'
    etape: Un événement déclencheur est souvent une rencontre, une épreuve ou une décision qu'il prend.
  solution: La réponse doit citer un événement ou une rencontre précise de l'histoire, et expliquer en quoi il a changé le
    personnage.
- id: nblm-selon-le-programme-officiel-et-la-fiche-1
  type: choix
  difficulte: 2
  enonce: Selon le programme officiel et la fiche de CM1, comment est décrite l'aventure de se découvrir à travers la lecture
    de récits ?
  reponse:
    options:
    - id: o1
      texte: Une aventure à la fois intime et collective.
    - id: o2
      texte: Une expérience uniquement individuelle et solitaire.
    - id: o3
      texte: Un exercice d'apprentissage de règles de grammaire.
    - id: o4
      texte: Une compétition de vitesse de lecture entre élèves.
    bonnes:
    - o1
  indices:
    relance: 'Réfléchis aux deux dimensions : ce que l''on ressent en soi-même et ce que l''on partage avec le groupe.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : la découverte de soi ne se fait pas seulement seul dans son coin, elle passe aussi par le
      partage et le rapport aux autres.'
  - si:
      contient:
      - o3
    relance: 'Erreur de domaine : cela concerne l''étude de la langue et non la culture littéraire et artistique.'
  - si:
      contient:
      - o4
    relance: 'Erreur de sens : l''objectif est la compréhension des êtres humains et le plaisir de lire, pas une compétition
      sportive ou de vitesse.'
  solution: Une aventure à la fois intime et collective. C'est exact. Se découvrir touche à sa propre réflexion personnelle
    (intime) tout en s'enrichissant grâce aux échanges avec la classe (collective).
- id: nblm-face-aux-defis-de-l-existence-dans-une-h-2
  type: choix
  difficulte: 2
  enonce: Face aux défis de l'existence dans une histoire, que font les personnages au fil de leur cheminement ?
  reponse:
    options:
    - id: o1
      texte: Ils se construisent et se redéfinissent au gré de leurs rencontres.
    - id: o2
      texte: Ils restent strictement identiques du début à la fin du récit.
    - id: o3
      texte: Ils abandonnent immédiatement dès qu'un obstacle apparaît.
    - id: o4
      texte: Ils oublient totalement leur passé et leurs expériences.
    bonnes:
    - o1
  indices:
    relance: Pense à la manière dont un voyage ou une épreuve transforme la personnalité d'un héros.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : ne pas remarquer l''évolution morale et psychologique d''un personnage au cours d''une histoire.'
  - si:
      contient:
      - o3
    relance: 'Erreur d''interprétation : face aux défis, les personnages apprennent à surmonter les difficultés et à se renforcer.'
  - si:
      contient:
      - o4
    relance: 'Erreur de logique : c''est au contraire en tirant des leçons de leur vécu et de leurs rencontres qu''ils grandissent.'
  solution: Ils se construisent et se redéfinissent au gré de leurs rencontres. C'est exact. Les épreuves et les personnes
    croisées permettent aux personnages de changer, d'apprendre sur eux-mêmes et de mûrir.
- id: nblm-dans-l-exemple-de-la-fiche-un-enfant-tim-3
  type: choix
  difficulte: 2
  enonce: Dans l'exemple de la fiche, un enfant timide n'ose pas prendre la parole en classe. Quel événement provoque son
    changement et lui permet de s'affirmer ?
  reponse:
    options:
    - id: o1
      texte: La rencontre avec un nouvel ami.
    - id: o2
      texte: La recherche d'un mot dans le dictionnaire.
    - id: o3
      texte: Un déménagement dans une autre ville.
    - id: o4
      texte: Une punition donnée par l'enseignant.
    bonnes:
    - o1
  indices:
    relance: Recherche l'événement relationnel positif mentionné dans l'exemple pratique de la fiche.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de facteur : le dictionnaire sert à vérifier le sens des mots, mais la transformation du personnage vient
      d''une relation humaine.'
  - si:
      contient:
      - o3
    relance: 'Erreur de contexte : dans l''exemple précis de la fiche, le déclencheur est la rencontre amicale faite en classe.'
  - si:
      contient:
      - o4
    relance: 'Erreur de compréhension : le personnage prend confiance grâce à un lien positif d''amitié, pas sous le coup
      d''une punition.'
  solution: La rencontre avec un nouvel ami. C'est exact. Cette relation d'amitié lui donne confiance en lui et l'aide à surmonter
    sa timidité pour s'exprimer devant les autres.
- id: nblm-selon-la-methode-de-la-fiche-quelle-dema-4
  type: choix
  difficulte: 2
  enonce: Selon la méthode de la fiche, quelle démarche essentielle faut-il suivre pour bien analyser un personnage qui grandit
    dans une histoire ?
  reponse:
    options:
    - id: o1
      texte: Comparer le personnage au début et à la fin de l'histoire pour voir son évolution.
    - id: o2
      texte: Décrire le personnage uniquement au tout premier chapitre.
    - id: o3
      texte: Compter le nombre exact de mots dans chaque paragraphe.
    - id: o4
      texte: Ne s'intéresser qu'aux décors sans observer le personnage.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux deux moments clés qu'il faut observer pour mesurer le chemin parcouru par le personnage.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : s''arrêter au début empêche de voir comment le personnage se construit et se redéfinit au
      fil du récit.'
  - si:
      contient:
      - o3
    relance: 'Erreur de méthode : le comptage des mots ne donne aucune information sur la transformation morale ou psychologique
      du personnage.'
  - si:
      contient:
      - o4
    relance: 'Erreur de démarche : pour comprendre la notion, l''attention doit se porter sur le personnage, ses actes et
      ses rencontres.'
  solution: Comparer le personnage au début et à la fin de l'histoire pour voir son évolution. C'est exact. Il faut observer
    la différence entre le début et la fin, et identifier l'événement qui a provoqué ce changement.
- id: nblm-grace-aux-lectures-et-aux-echanges-menes-5
  type: choix
  difficulte: 2
  enonce: Grâce aux lectures et aux échanges menés en classe sur cette notion, quel est le bénéfice principal pour l'élève
    de CM1 ?
  reponse:
    options:
    - id: o1
      texte: Il s'ouvre à la complexité humaine et grandit lui aussi.
    - id: o2
      texte: Il apprend par cœur des listes de titres sans les lire.
    - id: o3
      texte: Il devient capable de résoudre des problèmes de géométrie complexe.
    - id: o4
      texte: Il évite de se poser des questions sur les sentiments des autres.
    bonnes:
    - o1
  indices:
    relance: Pense à ce que l'étude des sentiments et des parcours de personnages apporte à l'élève dans sa propre vie.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur de perspective : la culture littéraire vise l''épanouissement personnel et la réflexion, pas la mémorisation
      mécanique.'
  - si:
      contient:
      - o3
    relance: 'Erreur de matière : la géométrie relève des mathématiques et non de la culture littéraire en français.'
  - si:
      contient:
      - o4
    relance: 'Erreur de sens : ces lectures encouragent au contraire le développement de l''empathie et la compréhension des
      émotions.'
  solution: Il s'ouvre à la complexité humaine et grandit lui aussi. C'est exact. En découvrant le cheminement des personnages
    et en partageant ses réflexions, l'élève mûrit et comprend mieux les autres.
- id: nblm-quels-supports-et-genres-litteraires-per-6
  type: choix
  difficulte: 3
  enonce: Quels supports et genres littéraires permettent d'aborder la notion « Se découvrir, s'affirmer dans le rapport aux
    autres » au CM1 ? (2 bonnes réponses) (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Les récits et romans de littérature de jeunesse.
    - id: o2
      texte: Les bandes dessinées et pièces de théâtre.
    - id: o3
      texte: Les annuaires téléphoniques.
    - id: o4
      texte: Les répertoires de règles d'orthographe.
    bonnes:
    - o1
    - o2
