format: 2
notion: cm1-poesie-gout-des-mots
version: 2
etat: verifiee
declencheurs:
- les mots qui sonnent bien
- recueil de poésie
- jeux de mots amusants
- vers qui riment
- image poétique bizarre
- poème à écouter
- sons qui reviennent dans un texte
- inventer une rime
- écrire un poème
- un poème ancien
prerequis: []
essentiel: 'Lire et écouter de la poésie, c''est savourer le goût des mots : leur son, leur rythme et les images qu''ils font
  naître.


  En classe, on découvre un recueil de poèmes, c''est-à-dire un livre qui rassemble plusieurs poèmes. Ces poèmes et textes
  poétiques viennent de siècles différents : certains ont été écrits il y a très longtemps, comme les fables de Jean de La
  Fontaine ou les poèmes de Victor Hugo, d''autres sont plus récents.


  Un poème est souvent écrit en vers : chaque ligne est un vers, et un groupe de vers forme une strophe. Les vers peuvent
  se terminer par des rimes, des mots qui finissent par le même son (lune / plume). Le poète joue aussi avec les sons qui
  reviennent dans un vers.


  Face à un poème, ton ressenti compte. On développe une façon personnelle de lire, fondée sur la sensibilité à la langue
  et sur l''émotion qu''elle procure. Deux lecteurs peuvent ressentir des choses différentes : l''un trouve un poème triste,
  l''autre apaisant. L''important est de dire ce que tu ressens et de citer les mots qui te l''ont fait ressentir.


  La poésie s''écarte parfois des règles habituelles de la grammaire et du vocabulaire : ce sont des écarts à la norme. Le
  poète peut inventer un mot, changer l''ordre des mots, ou donner un geste humain à un objet : « la lune se penche à la fenêtre
  du ciel ». C''est une image poétique, un lien inattendu entre les mots, le monde et soi.


  Tu apprends à reconnaître ces écarts, puis à en jouer toi-même : inventer une rime, créer une image, fabriquer un mot nouveau.

  '
methode:
- Lire ou écouter le poème une première fois pour ressentir son ambiance générale.
- Repérer les mots ou les sons qui reviennent, les rimes, les images créées par les mots.
- Chercher les mots ou les tournures qui s'écartent de la façon habituelle de parler ou d'écrire.
- Exprimer ce que le poème fait ressentir, en citant les mots qui produisent cet effet.
- Pour créer, partir d'un thème, chercher des mots qui riment, puis inventer une image.
vocabulaire:
- terme: rime
  definition: deux mots qui se terminent par le même son, à la fin de deux vers
- terme: image poétique
  definition: une façon de dire les choses qui s'écarte du sens habituel des mots pour créer une émotion
- terme: vers
  definition: une ligne d'un poème
- terme: strophe
  definition: un groupe de vers, séparé des autres par une ligne blanche.
- terme: recueil
  definition: un livre qui rassemble plusieurs poèmes.
- terme: écart à la norme
  definition: une façon d'écrire qui ne suit pas les règles habituelles, faite exprès par le poète.
erreurs_frequentes:
- Vouloir absolument comprendre chaque mot d'un poème comme dans un texte explicatif.
- Ne pas remarquer les sonorités (rimes, répétitions) qui font aussi le sens d'un poème.
- Prendre une image poétique pour une erreur qu'il faudrait corriger.
- Dire « j'aime » ou « je n'aime pas » sans citer les mots qui produisent cet effet.
- Croire qu'un poème doit forcément rimer.
exemple:
  enonce: 'Dans un poème, on lit : « La lune se penche à la fenêtre du ciel. » Pourquoi cette phrase n''est-elle pas « normale
    » ?'
  solution: 'Dans la réalité, la lune ne peut pas « se pencher » : seule une personne fait ce geste. Le ciel n''a pas non
    plus de « fenêtre ». Le poète s''écarte volontairement du sens habituel des mots. Il crée une image poétique : la lune
    devient une personne curieuse qui regarde le monde. Cette image peut donner une impression de douceur ou de mystère.'
exercices:
- id: definition-poeme
  type: choix
  difficulte: 1
  enonce: Quel texte est écrit pour que les mots soient choisis surtout pour leurs sons et leurs images ?
  reponse:
    options:
    - id: a
      texte: Un poème
    - id: b
      texte: Un bulletin météo
    - id: c
      texte: Une recette de cuisine
    - id: d
      texte: La liste des devoirs
    bonnes:
    - a
  indices:
    relance: Pense à un texte où les mots peuvent rimer et créer des images, plus qu'à un texte qui donne juste des informations.
    methode: Élimine les textes qui servent seulement à informer ou à donner des instructions précises.
    etape: Un bulletin météo et une recette donnent des informations exactes, sans jouer avec les sons des mots. Que reste-t-il
      ?
  pieges:
  - si:
      contient:
      - b
    relance: Un bulletin météo donne des informations précises sur le temps, il ne joue pas avec les sons des mots.
  - si:
      contient:
      - c
    relance: Une recette explique des étapes à suivre dans l'ordre, elle ne cherche pas à créer des images avec les mots.
  - si:
      contient:
      - d
    relance: Une liste de devoirs sert à ne rien oublier, elle ne joue pas avec les sons ni les images des mots.
  solution: Un poème est un texte où les mots sont choisis pour leurs sons (comme les rimes) et pour les images qu'ils créent,
    pas seulement pour informer.
- id: trouver-une-rime
  type: texte_court
  difficulte: 1
  enonce: Trouve un mot différent de « chat » qui rime avec lui (qui se termine par le même son).
  reponse:
    acceptees:
    - rat
    - plat
    - repas
    - chocolat
    - bras
    - tas
    - drap
    - climat
    fautes_tolerees: 1
  indices:
    relance: Dis « chat » à voix haute et écoute bien le son de la fin du mot.
    methode: Cherche un mot qui se termine par le même son « a », même s'il ne s'écrit pas pareil.
    etape: 'Pense à un animal, ou à ce qu''on mange à midi : un mot qui finit par ce même son « a ».'
  pieges:
  - si:
      valeur: chat
    relance: Il faut un mot différent de « chat », qui se termine juste par le même son que lui.
  - si:
      valeur: chien
    relance: « Chien » ne se termine pas par le même son que « chat ». Écoute la fin des deux mots.
  solution: 'Par exemple « rat », « plat » ou « repas » : ces mots se terminent par le même son que « chat », ils riment avec
    lui.'
- id: nom-ligne-poeme
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on une ligne d'un poème ?
  reponse:
    acceptees:
    - un vers
    - vers
    - le vers
    fautes_tolerees: 1
  indices:
    relance: Relis le vocabulaire de la leçon.
    methode: Ce mot très court se prononce comme une couleur, mais ne s'écrit pas pareil.
    etape: Il s'écrit avec quatre lettres et se termine par un s.
  pieges:
  - si:
      valeur: une strophe
    relance: Une strophe est un groupe de plusieurs lignes. On cherche le nom d'une seule ligne.
  - si:
      valeur: une rime
    relance: La rime est le son répété à la fin des lignes. On cherche le nom de la ligne elle-même.
  solution: Une ligne d'un poème s'appelle un vers. Un groupe de vers forme une strophe.
- id: reconnaitre-image-poetique
  type: choix
  difficulte: 2
  enonce: Dans la phrase « La lune se penche à la fenêtre du ciel », que fait le poète ?
  reponse:
    options:
    - id: a
      texte: Il donne à la lune un geste humain pour créer une image poétique
    - id: b
      texte: Il décrit exactement ce qui se passe vraiment dans le ciel
    - id: c
      texte: Il fait une erreur de grammaire qu'il faudrait corriger
    bonnes:
    - a
  indices:
    relance: Est-ce qu'une lune peut vraiment « se pencher », comme une personne ?
    methode: Une image poétique prête souvent à une chose (la lune, le vent...) un geste ou un sentiment humain.
    etape: 'La lune ne peut pas se pencher pour de vrai : le poète parle d''elle comme s''il s''agissait d''une personne.'
  pieges:
  - si:
      contient:
      - b
    relance: 'Une lune ne peut pas vraiment se pencher : ce n''est donc pas une description exacte de la réalité.'
  - si:
      contient:
      - c
    relance: 'Ce n''est pas une erreur : le poète le fait volontairement pour créer une émotion.'
  solution: 'Le poète prête à la lune un geste humain (« se pencher ») : c''est une image poétique, qui s''écarte du sens
    habituel des mots pour créer une émotion.'
- id: associer-rimes
  type: association
  difficulte: 2
  enonce: Relie chaque mot à celui avec lequel il rime.
  reponse:
    gauche:
    - id: a
      texte: ballon
    - id: b
      texte: jour
    - id: c
      texte: main
    - id: d
      texte: souris
    droite:
    - id: x
      texte: bonbon
    - id: y
      texte: tambour
    - id: z
      texte: demain
    - id: w
      texte: tapis
    paires:
      a: x
      b: y
      c: z
      d: w
  indices:
    relance: Dis chaque mot de gauche à voix haute et écoute bien le son de sa fin.
    methode: Cherche, parmi les mots de droite, celui qui se termine par exactement le même son.
    etape: « Ballon » se termine par le son « on », comme un des mots de droite.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule paire ne rime pas vraiment. Réécoute la fin de chaque mot que tu as associé.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque mot de gauche un par un et écoute le son final avant de choisir son partenaire.
  solution: ballon rime avec bonbon, jour rime avec tambour, main rime avec demain, souris rime avec tapis.
- id: reperer-ecart-norme
  type: choix
  difficulte: 2
  enonce: Laquelle de ces phrases s'écarte volontairement des règles habituelles pour créer un effet poétique ?
  reponse:
    options:
    - id: a
      texte: « Le vent chantonne une berceuse aux arbres endormis. »
    - id: b
      texte: « Le vent souffle fort sur la plage aujourd'hui. »
    - id: c
      texte: « Demain, il y aura du vent dans le nord du pays. »
    bonnes:
    - a
  indices:
    relance: Dans quelle phrase le vent et les arbres font-ils des choses que seuls les humains font ?
    methode: Un écart à la norme poétique donne souvent à une chose un geste ou un état humain.
    etape: Un arbre peut-il vraiment dormir ? Le vent peut-il chanter une berceuse ?
  pieges:
  - si:
      contient:
      - b
    relance: Cette phrase décrit simplement la réalité, sans image. Le vent souffle vraiment.
  - si:
      contient:
      - c
    relance: Cette phrase donne une information, comme un bulletin météo. Elle ne joue pas avec les mots.
  solution: '« Le vent chantonne une berceuse aux arbres endormis » : le vent chante et les arbres dorment comme des personnes.
    Le poète s''écarte du sens habituel des mots pour créer une image douce.'
- id: mots-inventes
  type: association
  difficulte: 3
  enonce: Un poète a inventé des mots nouveaux en collant le début d'un mot et la fin d'un autre. Relie chaque mot inventé
    aux deux mots qui ont servi à le fabriquer.
  reponse:
    gauche:
    - id: nuageton
      texte: « Dans le ciel bleu, un nuageton broute les étoiles. »
    - id: papillunette
      texte: « Ma papillunette s'envole quand je lis. »
    - id: chocolune
      texte: « Ce soir, la chocolune fond dans la nuit. »
    droite:
    - id: nuage-mouton
      texte: nuage + mouton
    - id: papillon-lunette
      texte: papillon + lunette
    - id: chocolat-lune
      texte: chocolat + lune
    paires:
      nuageton: nuage-mouton
      papillunette: papillon-lunette
      chocolune: chocolat-lune
  indices:
    relance: Lis chaque mot inventé à voix haute, lentement, en écoutant son début et sa fin.
    methode: Le début du mot inventé vient du premier mot, la fin vient du second.
    etape: Un mot inventé qui broute fait penser à un animal qui mange de l'herbe.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Regarde bien les premières lettres de chaque mot inventé.
  - si:
      diagnostic: associations_fausses
    relance: Reprends un mot inventé à la fois. Par quelles lettres commence-t-il ? Par quel son finit-il ?
  solution: « nuageton » vient de nuage + mouton, « papillunette » de papillon + lunette, « chocolune » de chocolat + lune.
    Le poète joue avec les mots en s'écartant volontairement du vocabulaire habituel.
- id: vers-sur-la-pluie
  type: ouverte
  difficulte: 3
  enonce: Invente une courte phrase poétique de deux vers qui riment, sur le thème de la pluie.
  criteres:
  - Le texte comporte bien deux vers (deux lignes courtes).
  - Les deux vers se terminent par le même son (ils riment).
  - Le texte évoque la pluie par une image, même simple.
  indices:
    relance: Cherche d'abord deux mots qui se terminent par le même son, en lien avec la pluie.
    methode: Pense à un mot qui parle de la pluie (goutte, ciel, nuage...) et cherche un mot qui rime avec lui.
    etape: Tu peux commencer par « La pluie tombe sur le toit... » puis trouver un deuxième vers qui rime avec « toit ».
  solution: 'Par exemple : « La pluie tombe sur le toit, / Le chat se cache, il a froid. » : deux vers qui riment (toit /
    froid) et qui évoquent la pluie par une image.'
