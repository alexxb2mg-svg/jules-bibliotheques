    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : analyser la grammaire n''est pas le but premier lors de l''écoute d''un poème.'
  - si:
      contient:
      - o3
    relance: 'Attention : la couverture du livre est un détail visuel extérieur au texte poétique.'
  - si:
      contient:
      - o4
    relance: 'Confusion : écouter demande de la concentration pour ressentir, pas de parler par-dessus.'
  solution: 'Aux mots qui sonnent bien, au rythme et à l''ambiance générale. C''est juste : l''écoute permet d''apprécier
