# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-accorder-sujet-verbe
version: 3
etat: verifiee
declencheurs:
- accord sujet verbe
- le verbe s'accorde
- j'accorde mal le verbe
- accord du participe passé
- auxiliaire être
- est tombée
- sujet loin du verbe
- terminaison ent ou e
prerequis:
- cm1-chaine-accords-groupe-nominal
- cm1-analyser-phrase-simple
essentiel: 'Le verbe s''accorde toujours avec son sujet, en personne et en nombre. Elle chante, nous chantons, les enfants
  chantent : la terminaison change avec le sujet.


  Pour bien accorder, il faut d''abord trouver le sujet. On pose la question « qui est-ce qui ? » devant le verbe. Quand le
  sujet est un groupe nominal, on cherche son nom noyau : c''est lui qui commande l''accord. Dans « Le chat des voisins miaule
  », le nom noyau est « chat », au singulier : le verbe est donc au singulier, même si « voisins » est au pluriel.


  Pour vérifier, on remplace le sujet par un pronom : « le chat des voisins » devient « il », « ma sœur et moi » devient «
  nous ».


  Il faut mémoriser les marques de personne des verbes fréquents. Au présent, avec nous, le verbe se termine souvent par -ons
  ; avec vous, par -ez ; avec ils ou elles, par -nt. Quand on change le sujet ou le temps d''une phrase, on change aussi la
  terminaison du verbe : « Le chien aboie » devient « Les chiens aboient ».


  Au passé composé, le participe passé s''accorde avec le sujet seulement quand le verbe est employé avec l''auxiliaire être.
  Anna est tombée dans le jardin : « tombée » s''accorde avec Anna, au féminin singulier. Les garçons sont partis : « partis
  » est au masculin pluriel.


  Il ne faut pas confondre les variations du verbe avec celles du nom. Il élève, tu élèves, elles élèvent : ce sont des formes
  du verbe élever. Une élève, des élèves : ce sont des formes du nom. Le nom prend un s au pluriel, le verbe prend -nt après
  ils ou elles.

  '
methode:
- Repérer le verbe, puis trouver son sujet avec la question « qui est-ce qui ? ».
- Si le sujet est un groupe nominal, chercher son nom noyau.
- Remplacer le sujet par un pronom (il, elle, nous, ils...) pour vérifier sa personne et son nombre.
- Accorder le verbe en personne et en nombre avec ce sujet, grâce aux marques de personne apprises.
- Si le verbe est au passé composé avec l'auxiliaire être, accorder aussi le participe passé avec le sujet, en genre et en
  nombre.
- Vérifier que tu n'as pas confondu la terminaison du verbe avec celle d'un nom qui lui ressemble.
vocabulaire:
- terme: sujet
  definition: le mot ou le groupe qui répond à la question « qui est-ce qui ? » posée devant le verbe, et qui commande son
    accord
- terme: nom noyau
  definition: le nom principal du groupe nominal sujet, avec lequel le verbe s'accorde
- terme: auxiliaire
  definition: le verbe être ou avoir utilisé avec le participe passé pour former un temps composé
- terme: participe passé
  definition: la forme du verbe utilisée avec un auxiliaire (mangé, tombée...)
erreurs_frequentes:
- Oublier d'accorder le participe passé avec le sujet quand l'auxiliaire est être.
- Accorder le participe passé avec le sujet même quand l'auxiliaire est avoir (dans les cas simples étudiés au CM1, il reste
  invariable).
- Confondre la terminaison d'un verbe et celle d'un nom qui se prononce pareil.
- Accorder le verbe avec le nom le plus proche au lieu du nom noyau du sujet (« le chat des voisins miaulent »).
exemple:
  enonce: Accorde le participe passé dans « Les filles sont (tomber) dans la cour. »
  solution: 'Les filles sont tombées dans la cour : l''auxiliaire être impose l''accord du participe passé avec le sujet les
    filles (féminin pluriel).'
exercices:
- id: accord-chien-aboie
  type: texte_court
  difficulte: 1
  enonce: 'Accorde le verbe entre parenthèses : « Le chien (aboyer, présent) fort. »'
  reponse:
    acceptees:
    - aboie
    fautes_tolerees: 1
  indices:
    relance: Le sujet le chien est à la 3e personne du singulier.
    methode: Au présent, un verbe du 1er groupe à la 3e personne du singulier se termine par e.
    etape: Conjugue aboyer à la 3e personne du singulier du présent.
  solution: 'aboie : le chien aboie fort (3e personne du singulier du présent).'
- id: trouver-sujet-noyau
  type: choix
  difficulte: 1
  enonce: Dans « Le chat des voisins miaule. », avec quel mot le verbe miaule s'accorde-t-il ?
  reponse:
    options:
    - id: a
      texte: chat
    - id: b
      texte: voisins
    - id: c
      texte: le
    bonnes:
    - a
  indices:
    relance: Qui est-ce qui miaule ? Les voisins, ou un animal ?
    methode: Le verbe s'accorde avec le nom noyau du groupe sujet, pas avec le nom le plus proche de lui.
    etape: Le groupe sujet est formé de quatre mots. Cherche le nom principal de ce groupe.
  pieges:
  - si:
      contient:
      - b
    relance: Ce sont les voisins qui miaulent ? Ce nom est le plus proche du verbe, mais ce n'est pas le nom noyau du sujet.
  - si:
      contient:
      - c
    relance: « le » est un déterminant. Le verbe s'accorde avec un nom.
  solution: 'chat : le sujet est « le chat des voisins », son nom noyau est chat (singulier). Le verbe miaule est donc au
    singulier.'
- id: accord-ils-finissent
  type: texte_court
  difficulte: 1
  enonce: Transforme la phrase en mettant le sujet au pluriel. « L'élève finit son dessin. » devient « Les élèves ... leur
    dessin. » Écris seulement le verbe.
  reponse:
    acceptees:
    - finissent
    fautes_tolerees: 1
  indices:
    relance: Remplace « les élèves » par un pronom. Lequel ?
    methode: Avec un sujet à la 3e personne du pluriel, le verbe au présent se termine par -ent.
    etape: Les élèves, c'est « ils ». Conjugue finir avec « ils » au présent, en gardant le radical du pluriel des verbes
      en -ir.
  pieges:
  - si:
      valeur: finit
    relance: Le sujet est au pluriel. Remplace-le par « ils ».
  - si:
      valeur: finis
    relance: Le s du nom élèves ne va pas sur le verbe. Avec « ils », quelle terminaison prend le verbe ?
  solution: 'finissent : Les élèves finissent leur dessin. Le sujet passe au pluriel (les élèves = ils, 3e personne du pluriel),
    donc le verbe prend la marque -ent.'
- id: accord-marie-paul
  type: texte_court
  difficulte: 2
  enonce: 'Accorde le participe passé : « Marie et Paul sont (partir) tôt ce matin. »'
  reponse:
    acceptees:
    - partis
    fautes_tolerees: 0
  indices:
    relance: 'Le sujet est composé de deux personnes : quel est son nombre et son genre ?'
    methode: Avec l'auxiliaire être, le participe passé s'accorde avec le sujet ; un groupe masculin et féminin ensemble s'accorde
      au masculin pluriel.
    etape: Marie et Paul forment un sujet pluriel, avec au moins un masculin.
  pieges:
  - si:
      valeur: parties
    relance: 'Le sujet contient un masculin (Paul) : l''accord au féminin n''est pas correct ici.'
  - si:
      valeur: parti
    relance: Combien de personnes s'en vont ? Le sujet est-il singulier ?
  solution: 'partis : Marie et Paul sont partis tôt ce matin (sujet pluriel, masculin car il y a un masculin dans le groupe).'
- id: choix-verbe-ou-nom
  type: choix
  difficulte: 2
  enonce: Dans « Les élèves élèvent leur voix. », que représente le mot « élèvent » ?
  reponse:
    options:
    - id: a
      texte: un nom au pluriel
    - id: b
      texte: un verbe conjugué
    - id: c
      texte: un adjectif
    bonnes:
    - b
  indices:
    relance: Ce mot a-t-il un sujet qui commande son accord, comme un verbe ?
    methode: Un mot dont la forme dépend du sujet en personne et en nombre appartient à cette catégorie, pas à celle d'un
      nom fixe.
    etape: « Les élèves » est le sujet de ce mot, qui indique une action.
  pieges:
  - si:
      contient:
      - a
    relance: 'Ce mot n''est pas précédé d''un déterminant et indique une action : ce n''est pas un nom.'
  - si:
      contient:
      - c
    relance: Un adjectif qualifie un nom. Ici, le mot dit ce que font les élèves.
  solution: 'un verbe conjugué : élèvent vient du verbe élever, conjugué avec le sujet les élèves.'
- id: participe-etre-ou-avoir
  type: choix
  difficulte: 2
  enonce: Dans quelle phrase le participe passé est-il bien accordé ?
  reponse:
    options:
    - id: a
      texte: Ma tante est arrivée hier.
    - id: b
      texte: Ma tante a mangées une pomme.
    - id: c
      texte: Ma tante est arrivé hier.
    bonnes:
    - a
  indices:
    relance: Regarde l'auxiliaire de chaque phrase. Est-ce être ou avoir ?
    methode: Avec être, le participe passé s'accorde avec le sujet. Avec avoir, dans les cas simples, il ne s'accorde pas
      avec le sujet.
    etape: Le sujet « ma tante » est féminin singulier. Vérifie chaque participe passé.
  pieges:
  - si:
      contient:
      - b
    relance: L'auxiliaire est avoir. Ici le participe passé ne s'accorde pas avec le sujet, et en plus le sujet est au singulier.
  - si:
      contient:
      - c
    relance: L'auxiliaire est être. Le participe passé doit donc s'accorder avec « ma tante », au féminin.
  solution: 'Ma tante est arrivée hier : auxiliaire être, le participe passé s''accorde avec le sujet ma tante (féminin singulier,
    donc e).'
- id: association-accords
  type: association
  difficulte: 2
  enonce: Relie chaque sujet à la forme verbale correctement accordée du verbe chanter au présent.
  reponse:
    gauche:
    - id: a
      texte: Elle
    - id: b
      texte: Nous
    - id: c
      texte: Les enfants
    droite:
    - id: x
      texte: chante
    - id: y
      texte: chantons
    - id: z
      texte: chantent
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Vérifie la personne et le nombre de chaque sujet avant de choisir la terminaison du verbe.
    methode: 'Chaque personne du présent a une terminaison propre : -e, -ons, -ent selon le sujet.'
    etape: Elle est 3e singulier, Nous est 1re pluriel, Les enfants est 3e pluriel.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie bien la personne de chaque sujet.
  - si:
      diagnostic: associations_fausses
    relance: Commence par Nous, sa terminaison est la plus facile à reconnaître.
  solution: Elle-chante, Nous-chantons, Les enfants-chantent.
- id: sujet-compose-moi
  type: texte_court
  difficulte: 3
  enonce: 'Accorde le participe passé : « Ma sœur et moi, nous sommes (rentrer) tard. » (Je suis un garçon.)'
  reponse:
    acceptees:
    - rentrés
    fautes_tolerees: 0
  indices:
    relance: Avec quel auxiliaire le verbe est-il conjugué ?
    methode: Avec être, le participe passé s'accorde avec le sujet en genre et en nombre. Un groupe mêlant féminin et masculin
      s'accorde au masculin pluriel.
    etape: Le sujet est « ma sœur et moi », soit deux personnes, une fille et un garçon.
  pieges:
  - si:
      valeur: rentré
    relance: Vous êtes deux. Le participe passé doit être au pluriel.
  - si:
      valeur: rentrées
    relance: Le sujet contient un garçon, donc l'accord ne peut pas être au féminin.
  solution: 'rentrés : auxiliaire être, sujet pluriel (deux personnes) avec un masculin, donc masculin pluriel.'
- id: ouverte-accord-sujet-verbe
  type: ouverte
  difficulte: 3
  enonce: 'Conjugue et accorde correctement : « Ma sœur et moi (aller, présent) au marché » puis explique comment tu as trouvé
    l''accord.'
  criteres:
  - L'élève propose la forme correcte allons.
  - L'élève explique que le sujet ma sœur et moi correspond à la 1re personne du pluriel (nous).
  - L'élève relie la terminaison -ons à la personne nous.
  indices:
    relance: Remplace le sujet composé par le pronom qui lui correspond.
    methode: Quand le sujet contient moi, on utilise la 1re personne du pluriel, comme si le sujet était nous.
    etape: Ma sœur et moi équivaut à nous.
  solution: Ma sœur et moi allons au marché. Le sujet ma sœur et moi équivaut à nous (1re personne du pluriel), donc le verbe
    aller se conjugue allons.
