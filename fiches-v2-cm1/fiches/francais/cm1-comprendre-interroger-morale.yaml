# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-comprendre-interroger-morale
version: 3
etat: verifiee
declencheurs:
- qu'est-ce que la justice
- ce que le personnage aurait dû faire
- la morale de l'histoire
- fable avec une leçon
- c'est juste ou pas juste
- le personnage a-t-il bien agi
- respecter ceux qui sont différents
- une histoire qui fait réfléchir
prerequis:
- cm1-imaginer-vivre-autres-vies
essentiel: 'Certaines histoires font réfléchir à la façon de bien vivre ensemble. En lisant une œuvre entière ou des extraits,
  on découvre des fondements de la vie en commun : la justice, la tolérance, la liberté, le respect des différences et la
  préservation de l''environnement.


  La justice, c''est traiter chacun de façon équitable. La tolérance, c''est accepter que les autres pensent ou vivent autrement
  que soi. La liberté, c''est pouvoir choisir et agir, sans empêcher les autres d''être libres. Le respect des différences,
  c''est ne pas rejeter quelqu''un parce qu''il est différent. Préserver l''environnement, c''est protéger la nature pour
  tous.


  Les personnages agissent selon des valeurs morales, c''est-à-dire des idées de ce qui est bien : être honnête, être courageux,
  aider les autres, partager. Certains personnages, au contraire, mentent, trichent ou ne pensent qu''à eux.


  Pour comprendre une histoire, on se demande pourquoi un personnage agit ainsi. On s''interroge aussi sur les conséquences
  de son action sur le collectif : le groupe, le village, la société. Une seule personne qui triche peut rompre la confiance
  de tout un groupe.


  Souvent, une fable se termine par une morale : une phrase qui donne la leçon de l''histoire.


  On n''est pas obligé d''être d''accord avec tout ce qu''on lit. Développer son esprit critique, c''est donner son avis et
  l''expliquer avec des arguments tirés du texte. Développer sa sensibilité, c''est être attentif à ce que l''histoire te
  fait ressentir : colère, tristesse, admiration.

  '
methode:
- Repérer une action importante d'un personnage dans l'histoire.
- Se demander si cette action est juste ou injuste, et pourquoi.
- Identifier les conséquences de cette action sur les autres personnages ou sur le groupe.
- Nommer la valeur en jeu (justice, honnêteté, tolérance, liberté, respect…).
- Donner ton propre avis et l'expliquer avec un passage du texte.
vocabulaire:
- terme: valeur morale
  definition: ce qui guide les actions d'un personnage, comme la justice, l'honnêteté ou le respect des autres
- terme: collectif
  definition: le groupe, la société dans son ensemble, par opposition à une seule personne
- terme: morale
  definition: la leçon d'une histoire, souvent écrite à la fin d'une fable.
- terme: justice
  definition: le fait de traiter chacun de façon équitable, sans favoriser personne.
- terme: tolérance
  definition: le fait d'accepter que les autres pensent ou vivent différemment de soi.
- terme: esprit critique
  definition: la capacité à réfléchir par soi-même et à expliquer son avis.
erreurs_frequentes:
- Juger une action sans expliquer pourquoi elle est juste ou injuste.
- Ne pas relier l'action du personnage à ses conséquences sur les autres.
- Confondre ce que le personnage pense avec ce que pense l'auteur ou le lecteur.
- Donner son avis sans s'appuyer sur un passage du texte.
exemple:
  enonce: Dans une fable, un renard trompe un corbeau pour lui voler son fromage. Quelle valeur morale ce récit interroge-t-il
    ?
  solution: 'Le renard flatte le corbeau en lui faisant des compliments qui ne sont pas sincères : il ment pour obtenir le
    fromage. Ce récit interroge donc l''honnêteté. Il pose aussi une question sur la confiance : le corbeau a cru les belles
    paroles du renard. La morale avertit que celui qui flatte vit aux dépens de celui qui l''écoute. On peut en discuter :
    est-il juste de tromper quelqu''un, même s''il est vaniteux ?'
exercices:
- id: fondements-vie-commun
  type: choix
  difficulte: 1
  enonce: Parmi ces propositions, laquelle N'EST PAS citée par le programme comme fondement de la vie en commun étudié à travers
    la lecture ?
  reponse:
    options:
    - id: a
      texte: La justice
    - id: b
      texte: La vitesse de lecture
    - id: c
      texte: La tolérance
    - id: d
      texte: La liberté
    bonnes:
    - b
  indices:
    relance: Relis le premier paragraphe de l'essentiel.
    methode: Le programme cite la justice, la tolérance, la liberté, le respect des différences et la préservation de l'environnement.
    etape: Trois de ces quatre options sont citées dans l'essentiel. Cherche celle qui n'a rien à voir avec le vivre-ensemble.
  pieges:
  - si:
      contient:
      - a
    relance: La justice fait bien partie des fondements cités par le programme.
  - si:
      contient:
      - c
    relance: La tolérance fait bien partie des fondements cités par le programme.
  - si:
      contient:
      - d
    relance: La liberté fait bien partie des fondements cités par le programme.
  solution: La vitesse de lecture n'est pas un fondement de la vie en commun. Le programme cite la justice, la tolérance,
    la liberté, le respect des différences et la préservation de l'environnement.
- id: renard-corbeau
  type: choix
  difficulte: 2
  enonce: Dans une fable, un renard trompe un corbeau pour lui voler son fromage. Quelle valeur morale ce récit interroge-t-il
    principalement ?
  reponse:
    options:
    - id: a
      texte: L'honnêteté, car le renard trompe l'autre pour son propre intérêt
    - id: b
      texte: La préservation de l'environnement
    - id: c
      texte: La vitesse de course des animaux
    - id: d
      texte: La couleur du fromage
    bonnes:
    - a
  indices:
    relance: Que fait exactement le renard pour obtenir le fromage ? Est-ce honnête ?
    methode: Cherche la valeur morale liée à tromper quelqu'un pour son propre intérêt.
    etape: 'Le renard ment et flatte le corbeau pour lui voler son bien : cela interroge l''honnêteté.'
  pieges:
  - si:
      contient:
      - b
    relance: La préservation de l'environnement n'est pas le sujet de cette fable, qui parle plutôt de tromperie.
  - si:
      contient:
      - c
    relance: Personne ne fait la course dans cette fable. Regarde plutôt ce que fait le renard pour obtenir le fromage.
  - si:
      contient:
      - d
    relance: La couleur du fromage n'est pas une valeur morale. Pense à la façon dont le renard se comporte.
  solution: 'Ce récit interroge l''honnêteté : le renard trompe le corbeau pour son propre intérêt, ce qui pose la question
    de ce qui est juste envers autrui.'
- id: definir-tolerance
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le fait d'accepter que les autres pensent ou vivent différemment de soi ?
  reponse:
    acceptees:
    - la tolérance
    - tolérance
    - tolerance
    fautes_tolerees: 2
  indices:
    relance: C'est l'un des fondements de la vie en commun cités dans l'essentiel.
    methode: Relis le vocabulaire de la leçon et cherche la définition qui parle d'accepter les différences.
    etape: Relis le premier paragraphe de l'essentiel. Le mot cherché y est expliqué juste après « La justice ».
  pieges:
  - si:
      valeur: la justice
    relance: La justice, c'est traiter chacun de façon équitable. On cherche le mot qui veut dire accepter les différences.
  - si:
      valeur: la liberté
    relance: La liberté, c'est pouvoir choisir et agir. On cherche le mot qui veut dire accepter les différences.
  solution: C'est la tolérance, le fait d'accepter que les autres pensent ou vivent différemment de soi.
- id: consequences-collectif
  type: choix
  difficulte: 2
  enonce: Pourquoi s'interroge-t-on aussi sur les conséquences des actions d'un personnage sur le collectif, et pas seulement
    sur lui-même ?
  reponse:
    options:
    - id: a
      texte: Parce qu'une action peut avoir des effets sur le groupe ou la société, pas seulement sur celui qui agit
    - id: b
      texte: Parce que le collectif n'a aucun rapport avec les actions des personnages
    - id: c
      texte: Parce que seul le personnage principal compte dans une histoire
    - id: d
      texte: Parce que cela permet de compter le nombre de personnages du livre
    bonnes:
    - a
  indices:
    relance: Une tromperie comme celle du renard ne touche-t-elle que lui, ou aussi le corbeau et la confiance entre eux ?
    methode: Les actions des personnages ont souvent des conséquences qui dépassent leur seule personne, sur les autres ou
      sur le groupe.
    etape: Réfléchis à ce que ressent le corbeau après avoir été trompé, et à ce que cela peut changer dans ses relations
      avec les autres.
  pieges:
  - si:
      contient:
      - b
    relance: Au contraire, les actions d'un personnage touchent souvent le groupe autour de lui.
  - si:
      contient:
      - c
    relance: 'Les autres personnages et le collectif comptent aussi : les actions d''un personnage les affectent souvent.'
  - si:
      contient:
      - d
    relance: Il ne s'agit pas de compter les personnages, mais de réfléchir aux effets d'une action sur eux.
  solution: Parce qu'une action a souvent des effets sur les autres personnages ou sur le groupe, pas seulement sur celui
    qui agit, ce qui permet de développer l'esprit critique du lecteur.
- id: situation-et-valeur
  type: association
  difficulte: 2
  enonce: Relie chaque situation d'une histoire à la valeur qu'elle interroge.
  reponse:
    gauche:
    - id: partage
      texte: Le roi garde tout le blé pour lui pendant que le village a faim.
    - id: accueil
      texte: Les enfants refusent de jouer avec la nouvelle élève parce qu'elle a un accent.
    - id: foret
      texte: Un géant coupe tous les arbres de la forêt sans se soucier des animaux.
    - id: prison
      texte: Un oiseau est enfermé dans une cage et rêve de voler.
    droite:
    - id: justice
      texte: la justice
    - id: differences
      texte: le respect des différences
    - id: environnement
      texte: la préservation de l'environnement
    - id: liberte
      texte: la liberté
    paires:
      partage: justice
      accueil: differences
      foret: environnement
      prison: liberte
  indices:
    relance: Pour chaque situation, demande-toi ce qui pose problème.
    methode: Garder tout pour soi est injuste ; rejeter quelqu'un parce qu'il est différent manque de respect.
    etape: Être enfermé, c'est ne plus pouvoir aller où l'on veut.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis la situation du géant et celle de l'oiseau.
  - si:
      diagnostic: associations_fausses
    relance: Reprends une situation à la fois. Qui est touché, et qu'est-ce qui n'est pas respecté ?
  solution: 'Le roi qui garde le blé : la justice. Les enfants qui rejettent la nouvelle élève : le respect des différences.
    Le géant qui coupe la forêt : la préservation de l''environnement. L''oiseau en cage : la liberté.'
- id: reconnaitre-morale
  type: choix
  difficulte: 2
  enonce: Dans la fable « Le Lièvre et la Tortue », le lièvre se moque de la lente tortue et s'amuse en chemin. La tortue
    avance sans s'arrêter et gagne la course. Quelle est la morale de cette fable ?
  reponse:
    options:
    - id: a
      texte: Rien ne sert de courir, il faut partir à point.
    - id: b
      texte: Les lièvres courent plus vite que les tortues.
    - id: c
      texte: Il ne faut jamais faire de course.
    bonnes:
    - a
  indices:
    relance: Une morale est une leçon de vie, pas une simple information sur les animaux.
    methode: Demande-toi pourquoi le lièvre, pourtant rapide, a perdu.
    etape: Le lièvre court plus vite, pourtant il perd. Qu'a-t-il fait de son temps ? Et la tortue ?
  pieges:
  - si:
      contient:
      - b
    relance: C'est vrai, mais ce n'est pas une leçon de vie. Et dans la fable, c'est la tortue qui gagne !
  - si:
      contient:
      - c
    relance: La fable ne dit pas qu'il est mal de faire une course. Elle montre ce qui a fait perdre le lièvre.
  solution: 'La morale est « Rien ne sert de courir, il faut partir à point » : il vaut mieux commencer à temps et persévérer
    que compter sur son talent en perdant son temps.'
- id: avis-sur-personnage
  type: ouverte
  difficulte: 3
  enonce: Dans une histoire, Jules trouve un porte-monnaie dans la cour et le garde pour lui. Penses-tu qu'il a bien agi ?
    Explique ton avis et dis quelles conséquences son geste peut avoir pour les autres.
  criteres:
  - L'élève donne clairement son avis (il a bien agi ou mal agi).
  - L'élève explique son avis avec au moins une raison (« parce que… »).
  - L'élève cite au moins une conséquence pour les autres (la personne qui a perdu son porte-monnaie, la confiance dans la
    classe…).
  indices:
    relance: Mets-toi à la place de la personne qui a perdu son porte-monnaie.
    methode: Donne ton avis, puis une raison avec « parce que », puis une conséquence pour les autres.
    etape: Pense à la valeur en jeu, par exemple l'honnêteté.
  solution: 'Par exemple : « Je pense que Jules a mal agi, parce que ce porte-monnaie appartient à quelqu''un d''autre. La
    personne qui l''a perdu est triste, et si tout le monde faisait pareil, plus personne ne se ferait confiance dans la classe.
    » Réussite si l''avis est expliqué et relié à une conséquence pour les autres.'
- id: nblm-dans-une-fable-avec-une-lecon-comme-cell-1
  type: choix
  difficulte: 2
  enonce: Dans une fable avec une leçon comme celle du Renard et du Corbeau, qu'apprend le lecteur en observant la ruse du
    renard ?
  reponse:
    options:
    - id: o1
      texte: Ce récit interroge l'honnêteté et montre ce qui est juste ou pas juste envers autrui.
    - id: o2
      texte: C'est un exercice de grammaire pour repérer les compléments d'objet.
    - id: o3
      texte: Cela sert uniquement à apprendre des mots difficiles par cœur.
    - id: o4
      texte: Il faut toujours encourager la ruse malhonnête dans la vie quotidienne.
    bonnes:
    - o1
  indices:
    relance: Pense à la leçon de la fable et à la manière dont elle questionne le comportement des personnages.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre l''étude de la morale de l''histoire avec un exercice d''analyse grammaticale.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : réduire la portée morale d''un récit à une simple liste de vocabulaire.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : juger l''action sans mesurer ses conséquences négatives sur les autres et sur le collectif.'
  solution: 'Ce récit interroge l''honnêteté et montre ce qui est juste ou pas juste envers autrui. C''est la bonne réponse
    : la fable permet de réfléchir aux valeurs morales comme l''honnêteté et d''évaluer si une action est juste ou pas juste.'
- id: nblm-qu-est-ce-que-la-justice-parmi-les-fonde-2
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que la justice parmi les fondements de la vie en commun abordés en CM1 ?
  reponse:
    options:
    - id: o1
      texte: Une valeur morale essentielle qui guide les actions pour respecter le droit et le collectif.
    - id: o2
      texte: Une règle d'orthographe pour accorder le sujet avec le verbe.
    - id: o3
      texte: L'obligation pour tous les élèves d'avoir exactement la même opinion.
    - id: o4
      texte: La punition systématique de tous les personnages d'un livre.
    bonnes:
    - o1
  indices:
    relance: Réfléchis aux principes moraux qui permettent d'assurer une bonne vie en communauté.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre une valeur morale avec une règle de grammaire ou d''orthographe.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre la justice avec l''absence de pensée individuelle ou le refus de la tolérance.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : réduire la justice à la punition sans comprendre le respect des droits de chacun.'
  solution: 'Une valeur morale essentielle qui guide les actions pour respecter le droit et le collectif. C''est la bonne
    réponse : la justice fait partie des fondements de la vie en commun avec la tolérance, la liberté et le respect des différences.'
- id: nblm-lorsqu-on-s-interroge-sur-ce-que-le-pers-3
  type: choix
  difficulte: 2
  enonce: Lorsqu'on s'interroge sur ce que le personnage aurait dû faire dans un récit, quel élément est indispensable d'analyser
    ?
  reponse:
    options:
    - id: o1
      texte: Les conséquences de ses actions et leurs effets sur le collectif.
    - id: o2
      texte: La couleur du manteau ou l'apparence physique du personnage.
    - id: o3
      texte: Le nombre de paragraphes rédigés par l'auteur dans le chapitre.
    - id: o4
      texte: Le temps qu'il fait dans l'histoire au moment de l'action.
    bonnes:
    - o1
  indices:
    relance: Pense à l'impact que produit l'acte d'un individu sur l'ensemble du groupe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : s''arrêter à un détail esthétique ou physique au lieu d''analyser la portée morale de l''action.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre la réflexion sur la morale avec le découpage de la mise en page.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : se focaliser sur le cadre décoratif plutôt que sur la portée éthique du comportement.'
  solution: 'Les conséquences de ses actions et leurs effets sur le collectif. C''est la bonne réponse : comprendre la morale
    implique d''évaluer les répercussions des choix du personnage sur les autres.'
- id: nblm-quelle-est-l-erreur-frequente-a-eviter-l-4
  type: choix
  difficulte: 2
  enonce: Quelle est l'erreur fréquente à éviter lorsqu'on cherche à déterminer si une action « c'est juste ou pas juste »
    ?
  reponse:
    options:
    - id: o1
      texte: Juger une action sans expliquer pourquoi elle est juste ou injuste.
    - id: o2
      texte: Expliquer précisément les raisons de son choix en s'appuyant sur le texte.
    - id: o3
      texte: Relier l'action d'un personnage à ses conséquences sur autrui.
    - id: o4
      texte: Identifier la valeur morale qui guide le comportement du héros.
    bonnes:
    - o1
  indices:
    relance: 'Rappelle-toi qu''une seule affirmation ne suffit pas : il faut étayer son jugement avec des explications.'
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : penser qu''argumenter est une erreur, alors qu''il s''agit de la méthode recommandée.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : croire que mesurer les conséquences est fautif, alors que c''est une étape clé.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : rejeter l''identification de la valeur morale alors que cela constitue le cœur de la leçon.'
  solution: 'Juger une action sans expliquer pourquoi elle est juste ou injuste. C''est la bonne réponse : donner un avis
    sans justification est l''erreur typique identifiée dans la fiche de notion.'
- id: nblm-dans-le-programme-de-francais-en-cm1-que-5
  type: choix
  difficulte: 2
  enonce: Dans le programme de français en CM1, que permet de développer la réflexion sur les valeurs morales portées par
    les personnages ?
  reponse:
    options:
    - id: o1
      texte: L'esprit critique du lecteur et sa propre sensibilité.
    - id: o2
      texte: La capacité à lire 110 mots par minute à voix haute.
    - id: o3
      texte: La connaissance des règles de formation du passé composé.
    - id: o4
      texte: L'art de copier un texte sans regarder le modèle.
    bonnes:
    - o1
  indices:
    relance: Cherche la compétence personnelle et intellectuelle que le lecteur construit en analysant le bien et le mal.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre les objectifs de fluidité de lecture avec le développement de l''esprit critique.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : mélanger un objectif de culture littéraire et morale avec un objectif de conjugaison.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre la réflexion morale avec les stratégies de copie et d''écriture cursive.'
  solution: 'L''esprit critique du lecteur et sa propre sensibilité. C''est la bonne réponse : interroger la morale développe
    la capacité de jugement critique et la sensibilité de l''élève.'
