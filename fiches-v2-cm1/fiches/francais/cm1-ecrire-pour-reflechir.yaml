# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-ecrire-pour-reflechir
version: 3
etat: verifiee
declencheurs:
- résumer une leçon
- noter les idées importantes
- surligner les infos importantes
- donner son avis par écrit
- écrire pour comprendre
- reformuler avec ses propres mots
- trier les infos d'un texte
- écrire pour retenir
prerequis: []
essentiel: 'Écrire ne sert pas seulement à raconter une histoire. Écrire aide aussi à réfléchir, à apprendre et à mémoriser.


  D''abord, on peut écrire pour repérer et trier les informations importantes d''un texte. On souligne ou on surligne seulement
  l''essentiel : le personnage principal, le titre, les informations utiles. Puis on les note en liste ou en phrases courtes.
  Si tout est souligné, plus rien ne ressort.


  Ensuite, on peut écrire pour expliquer son point de vue. Ce sont des écrits réflexifs courts. Un avis ne suffit pas : il
  faut une raison. « J''ai aimé ce livre » est un avis. « J''ai aimé ce livre parce que l''héroïne ne renonce jamais » est
  un avis justifié.


  On peut aussi reformuler l''essentiel d''une leçon avec ses propres mots, avec l''aide du professeur et des camarades. Reformuler,
  ce n''est pas recopier. C''est redire l''idée autrement, comme si on l''expliquait à un camarade absent. C''est ainsi qu''on
  s''approprie la leçon.


  Enfin, on écrit de courtes phrases pour s''entraîner. Après une leçon de grammaire, on écrit des phrases qui appliquent
  la règle. Après avoir appris des mots nouveaux, on les emploie dans ses propres phrases pour bien les mémoriser.

  '
methode:
- Lire le texte ou la leçon en entier une première fois.
- Surligner ou souligner seulement les informations les plus importantes.
- Classer ces informations sous forme de liste ou de phrases courtes.
- Reformuler l'essentiel avec ses propres mots, sans recopier le texte entier.
- Comparer sa reformulation avec celle d'un camarade ou du professeur.
- Réemployer la règle ou les mots nouveaux dans une ou deux phrases à soi.
vocabulaire:
- terme: reformuler
  definition: redire une idée avec ses propres mots, sans recopier.
- terme: information importante (pertinente)
  definition: une information utile pour comprendre l'essentiel, et non un petit détail.
- terme: point de vue
  definition: ce que l'on pense d'une chose, son avis.
- terme: justifier
  definition: donner la raison qui explique son avis, souvent avec « parce que ».
- terme: écrit réflexif
  definition: un écrit court où l'on explique ce que l'on pense ou ce que l'on a compris.
erreurs_frequentes:
- Recopier tout le texte au lieu de n'en garder que l'essentiel.
- Donner un avis sans jamais l'expliquer (« j'ai aimé » sans dire pourquoi).
- Souligner presque tout le texte, si bien que rien ne ressort.
- Reprendre les phrases exactes de la leçon au lieu de les dire avec ses propres mots.
exemple:
  enonce: Après une leçon sur le cycle de l'eau, résume-la en une phrase avec tes propres mots.
  solution: 'Par exemple : « L''eau s''évapore, forme des nuages, retombe en pluie, puis rejoint les rivières » : une phrase
    courte qui reprend l''essentiel sans recopier la leçon entière.'
exercices:
- id: reformuler-ou-recopier
  type: choix
  difficulte: 1
  enonce: Pour t'approprier l'essentiel d'une leçon, que vaut-il mieux faire ?
  reponse:
    options:
    - id: a
      texte: Reformuler la leçon avec ses propres mots, en une phrase courte
    - id: b
      texte: Recopier la leçon entièrement, mot pour mot
    - id: c
      texte: Ne rien écrire et essayer de tout retenir de mémoire
    bonnes:
    - a
  indices:
    relance: 'Pense à ce qui aide vraiment à comprendre : recopier sans réfléchir, ou reformuler avec ses propres mots ?'
    methode: Élimine l'option qui ne demande aucun travail de reformulation.
    etape: Reformuler avec ses propres mots oblige à avoir compris l'idée, pas seulement à la recopier.
  pieges:
  - si:
      contient:
      - b
    relance: 'Recopier mot pour mot ne demande pas de comprendre l''idée : ce n''est pas la meilleure façon de se l''approprier.'
  - si:
      contient:
      - c
    relance: Écrire, même une phrase courte, aide à trier et fixer les idées importantes.
  solution: Il vaut mieux reformuler l'essentiel avec ses propres mots, en une phrase courte, plutôt que de tout recopier
    ou de ne rien écrire.
- id: avis-justifie
  type: choix
  difficulte: 1
  enonce: Quelle phrase est un avis correctement justifié sur un livre lu ?
  reponse:
    options:
    - id: a
      texte: J'ai aimé ce livre parce que le personnage principal est courageux.
    - id: b
      texte: J'ai aimé ce livre.
    - id: c
      texte: Ce livre parle d'un personnage.
    bonnes:
    - a
  indices:
    relance: Un avis justifié explique toujours pourquoi, avec une raison précise.
    methode: Cherche la phrase qui contient un « parce que » suivi d'une vraie raison.
    etape: Les deux autres phrases donnent soit un avis sans raison, soit juste une information sans avis.
  pieges:
  - si:
      contient:
      - b
    relance: 'Cette phrase donne un avis mais sans jamais expliquer pourquoi : il manque la justification.'
  - si:
      contient:
      - c
    relance: Cette phrase donne une information, mais ce n'est pas un avis personnel.
  solution: '« J''ai aimé ce livre parce que le personnage principal est courageux » est un avis justifié : il donne une raison
    précise.'
- id: souligner-infos
  type: texte_court
  difficulte: 2
  enonce: Dans la phrase « Le renard vit la nuit et se nourrit de petits animaux », quel est le nom de l'animal dont on parle
    ?
  reponse:
    acceptees:
    - le renard
    - renard
    fautes_tolerees: 1
  indices:
    relance: Cherche le sujet de la phrase, celui dont on parle tout du long.
    methode: Repère le mot qui revient au début de la phrase et qui désigne un animal.
    etape: C'est un animal qui vit la nuit et mange de petits animaux.
  pieges:
  - si:
      valeur: la nuit
    relance: « La nuit » indique un moment, pas l'animal dont on parle.
  solution: 'L''animal dont on parle est le renard : c''est l''information la plus importante à retenir en premier.'
- id: info-pas-importante
  type: choix
  difficulte: 2
  enonce: 'Voici le mot donné aux familles : « La sortie au musée aura lieu mardi. Le car part à 8 h devant l''école. Chaque
    élève apporte un pique-nique. Le car est bleu. » Quelle information n''est PAS importante à noter dans son cahier ?'
  reponse:
    options:
    - id: a
      texte: La sortie a lieu mardi.
    - id: b
      texte: Le car part à 8 h devant l'école.
    - id: c
      texte: Il faut apporter un pique-nique.
    - id: d
      texte: La couleur du car.
    bonnes:
    - d
  indices:
    relance: 'Pour chaque information, demande-toi : si je l''oublie, est-ce que je rate quelque chose pour la sortie ?'
    methode: Une information importante est utile pour savoir quand venir, où aller et quoi apporter. Un détail ne change
      rien.
    etape: Imagine le matin de la sortie. Quelle information ne t'aide ni à venir à l'heure ni à avoir ton repas ?
  pieges:
  - si:
      contient:
      - a
    relance: Sans le jour, tu ne saurais pas quand venir. C'est une information utile.
  - si:
      contient:
      - b
    relance: Sans l'heure et le lieu, tu risques de rater le car. C'est utile.
  - si:
      contient:
      - c
    relance: Sans cette information, tu n'aurais rien à manger à midi. C'est utile.
  solution: 'La couleur du car n''est pas importante : elle ne change rien pour la sortie. On note le jour (mardi), l''heure
    et le lieu (8 h devant l''école) et le pique-nique.'
- id: ecrit-et-but
  type: association
  difficulte: 2
  enonce: Relie chaque petit écrit à ce qu'il t'aide à faire.
  reponse:
    gauche:
    - id: a
      texte: Une liste des informations soulignées dans un texte
    - id: b
      texte: « Je pense que... parce que... »
    - id: c
      texte: La leçon redite en deux phrases avec mes mots
    - id: d
      texte: Trois phrases à moi avec les mots nouveaux de la semaine
    droite:
    - id: w
      texte: trier les informations importantes
    - id: x
      texte: expliquer mon point de vue
    - id: y
      texte: m'approprier la leçon
    - id: z
      texte: mémoriser le vocabulaire appris
    paires:
      a: w
      b: x
      c: y
      d: z
  indices:
    relance: Lequel de ces écrits donne un avis avec une raison ?
    methode: Pour chaque écrit, demande-toi ce que tu fais en l'écrivant ; trier, donner ton avis, redire une leçon ou employer
      des mots.
    etape: La liste des informations soulignées sert à trier. Continue avec les trois autres écrits.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Regarde bien l'écrit qui utilise les mots nouveaux de la semaine.
  - si:
      diagnostic: associations_fausses
    relance: Commence par l'écrit qui contient « parce que » ; il sert à justifier un avis.
  solution: 'Liste des informations soulignées : trier les informations. « Je pense que... parce que... » : expliquer son
    point de vue. Leçon redite avec mes mots : m''approprier la leçon. Phrases avec les mots nouveaux : mémoriser le vocabulaire.'
- id: ordre-resumer-texte
  type: ordre
  difficulte: 3
  enonce: Range dans l'ordre les étapes pour résumer un texte documentaire.
  reponse:
    elements:
    - id: lire
      texte: Lire le texte en entier une première fois
    - id: souligner
      texte: Souligner les informations les plus importantes
    - id: noter
      texte: Noter ces informations en liste courte
    - id: reformuler
      texte: Écrire le résumé avec mes propres mots
  indices:
    relance: Peux-tu souligner les informations importantes d'un texte que tu n'as pas encore lu ?
    methode: On va du texte entier vers l'essentiel, puis de l'essentiel vers ses propres phrases.
    etape: On commence par lire le texte en entier. Que fait-on juste après, crayon en main ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux étapes voisines sont inversées ; laquelle doit forcément venir avant l'autre ?
  - si:
      diagnostic: ordre_faux
    relance: Repère l'étape qui commence tout et celle qui termine par ton propre texte, puis place les deux autres.
  solution: On lit le texte en entier, on souligne les informations importantes, on les note en liste, puis on écrit le résumé
    avec ses propres mots.
- id: resumer-lecon-eau
  type: ouverte
  difficulte: 2
  enonce: Lis un court texte documentaire sur un animal. Souligne le nom de l'animal et deux informations importantes à son
    sujet, puis résume-le en une phrase avec tes propres mots.
  criteres:
  - L'élève identifie le nom de l'animal.
  - L'élève relève deux informations importantes, pas des détails secondaires.
  - La phrase de résumé reprend l'essentiel sans être une copie du texte.
  indices:
    relance: 'Ne souligne pas plus de trois éléments : choisis les plus importants.'
    methode: Distingue une information essentielle (ce que fait l'animal, où il vit) d'un détail secondaire.
    etape: Une fois les informations soulignées, reformule-les en une seule phrase avec tes propres mots.
  solution: Réussite si les éléments soulignés sont vraiment les informations essentielles et si la phrase de résumé reprend
    l'idée sans recopier le texte.
- id: reformuler-lecon-grammaire
  type: ouverte
  difficulte: 3
  enonce: Résume en une phrase l'essentiel d'une leçon de grammaire récente, avec tes propres mots.
  criteres:
  - La phrase reprend l'idée essentielle de la leçon.
  - La phrase n'est pas une copie du texte du professeur.
  - La phrase est courte et compréhensible sans avoir la leçon sous les yeux.
  indices:
    relance: 'N''utilise pas les mots exacts de la leçon : reformule avec les tiens.'
    methode: 'Demande-toi : si je devais expliquer cette règle à un camarade absent, que dirais-je en une phrase ?'
    etape: Commence par « Cette leçon explique que... » puis termine avec l'idée principale.
  solution: La phrase doit reprendre l'idée essentielle de la leçon de grammaire sans être une copie du texte du professeur.
