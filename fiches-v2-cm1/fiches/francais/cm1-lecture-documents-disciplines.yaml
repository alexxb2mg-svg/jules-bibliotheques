# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-lecture-documents-disciplines
version: 3
etat: verifiee
declencheurs:
- lire un document en sciences
- d'où vient ce document
- lire un tableau
- chercher une réponse dans un texte documentaire
- plusieurs documents sur le même sujet
- qui a écrit ce document
- texte avec des images
- légende sous la photo
prerequis:
- cm1-comprehension-lecture-autonome
essentiel: 'Pour apprendre dans toutes les matières (sciences, histoire, géographie...), il faut savoir lire différents documents.
  On ne les lit pas tous de la même façon.


  On commence par donner la nature du document : est-ce un texte, une image, un tableau, un graphique, une carte, une photographie
  ? Puis on cherche sa source : qui l''a écrit ou publié, d''où il vient, parfois sa date. La source est souvent écrite en
  petit, sous le document.


  Chaque genre de document a ses caractéristiques. Un récit raconte une histoire avec des personnages. Un texte documentaire
  donne des informations, avec un titre, des intertitres et souvent des images légendées. Un tableau range des informations
  en lignes et en colonnes. Une carte montre un lieu vu d''en haut, avec une légende. Une frise chronologique range des événements
  dans l''ordre du temps.


  Pour trouver une réponse, on lit d''abord la question. On repère le mot important de la question, puis on le cherche dans
  le document, en s''aidant du titre, des intertitres et des légendes. On n''est pas obligé de tout relire.


  Un document composite mélange plusieurs types d''informations : un texte et une image, un plan et une légende. Il faut les
  mettre en lien. Par exemple, le texte dit « regarde le numéro 2 », et c''est la légende du plan qui dit ce qu''est le numéro
  2.

  '
methode:
- 'Identifier la nature du document : texte, image, tableau, graphique, carte, photographie...'
- Repérer sa source si elle est indiquée (auteur, livre, site, date).
- Lire la question ou la consigne avant de chercher dans le document, et repérer son mot important.
- Parcourir le document pour trouver les informations utiles, en s'aidant du titre, des intertitres et des légendes.
- Dans un document composite, relier le texte et l'image (ou la légende) pour trouver la réponse complète.
- Répondre par une phrase, puis vérifier que la réponse est bien dans le document.
vocabulaire:
- terme: source
  definition: 'l''origine d''un document : qui l''a écrit ou publié, d''où il vient'
- terme: document composite
  definition: un document qui mélange plusieurs types d'informations, comme du texte et une image
- terme: nature d'un document
  definition: le type de document, par exemple un texte, un tableau, une carte ou une photographie
- terme: légende
  definition: un petit texte qui explique une image, ou la liste qui dit ce que veulent dire les couleurs et les signes d'une
    carte
- terme: texte documentaire
  definition: un texte qui donne des informations vraies sur un sujet, pour apprendre
- terme: intertitre
  definition: un petit titre à l'intérieur d'un texte, qui annonce le contenu d'une partie
erreurs_frequentes:
- Ne pas regarder la légende d'une image ou d'un graphique avant de répondre.
- Confondre la nature d'un document (par exemple prendre un tableau pour un texte).
- Chercher la réponse sans avoir lu la question, ce qui fait perdre du temps.
- Confondre le titre d'un document et sa source.
- Dans un document composite, lire seulement le texte et oublier l'image ou le plan.
exemple:
  enonce: On te donne une image légendée « Le cycle de l'eau, éditions Sciences Jeunesse, 2020 » qui montre des flèches entre
    un nuage, la pluie et une rivière. Quelle est la nature de ce document et sa source ?
  solution: C'est une image (un schéma avec des flèches) accompagnée d'une légende. Son titre est « Le cycle de l'eau ». Sa
    source, c'est-à-dire d'où il vient, est « éditions Sciences Jeunesse, 2020 ».
exercices:
- id: nature-document
  type: choix
  difficulte: 1
  enonce: On te donne un document qui range le nombre d'habitants de plusieurs villes en lignes et en colonnes. Quelle est
    la nature de ce document ?
  reponse:
    options:
    - id: a
      texte: Un texte narratif
    - id: b
      texte: Un tableau de chiffres
    - id: c
      texte: Une photographie
    - id: d
      texte: Un poème
    bonnes:
    - b
  indices:
    relance: Ce document range des informations en lignes et en colonnes. Comment appelle-t-on ce type de présentation ?
    methode: 'La nature d''un document, c''est son type : texte, image, tableau, graphique, photographie.'
    etape: Des chiffres rangés en lignes et en colonnes forment un tableau.
  pieges:
  - si:
      contient:
      - a
    relance: Un texte narratif raconte une histoire avec des phrases. Ici, ce sont des chiffres rangés en lignes et en colonnes.
  - si:
      contient:
      - c
    relance: Une photographie est une image. Ici, il s'agit de chiffres présentés en lignes et en colonnes.
  - si:
      contient:
      - d
    relance: Un poème est un texte écrit en vers. Ici, ce sont des chiffres rangés en lignes et en colonnes.
  solution: La nature du document est un tableau de chiffres.
- id: reperer-source
  type: choix
  difficulte: 1
  enonce: 'Sous le tableau de chiffres est écrit « Source : recensement 2023 ». Que désigne cette mention ?'
  reponse:
    options:
    - id: a
      texte: Le titre du document
    - id: b
      texte: L'origine du document, d'où viennent les informations
    - id: c
      texte: Une légende d'image
    - id: d
      texte: Une consigne à suivre
    bonnes:
    - b
  indices:
    relance: Le mot « source » est écrit juste avant. Que veut dire ce mot ?
    methode: La source d'un document indique qui l'a écrit ou publié, ou d'où viennent les informations.
    etape: « Recensement 2023 » indique d'où viennent les chiffres du tableau.
  pieges:
  - si:
      contient:
      - a
    relance: Un titre annonce le sujet du document, ce n'est pas la même chose que la source.
  - si:
      contient:
      - c
    relance: Une légende accompagne une image pour l'expliquer. Ici, il s'agit d'indiquer d'où viennent les chiffres.
  - si:
      contient:
      - d
    relance: Une consigne dit ce qu'il faut faire. Ici, la mention dit d'où viennent les chiffres.
  solution: La source d'un document indique son origine, ici « recensement 2023 ».
- id: genre-texte-abeilles
  type: choix
  difficulte: 1
  enonce: Un texte donne des informations vraies sur la vie des abeilles. Il a un titre, des intertitres et une photo légendée.
    Quel est son genre ?
  reponse:
    options:
    - id: a
      texte: un texte documentaire
    - id: b
      texte: un conte
    - id: c
      texte: un poème
    - id: d
      texte: une recette de cuisine
    bonnes:
    - a
  indices:
    relance: Ce texte raconte-t-il une histoire inventée, ou sert-il à apprendre des choses vraies ?
    methode: Un texte qui informe, avec des intertitres et des images légendées, sert à apprendre dans une matière comme les
      sciences.
    etape: Les intertitres et la photo légendée sont des caractéristiques d'un texte qui sert à informer.
  pieges:
  - si:
      contient:
      - b
    relance: Un conte raconte une histoire inventée, souvent avec du merveilleux. Ici, le texte donne des informations vraies.
  - si:
      contient:
      - c
    relance: Un poème est écrit en vers. Ici, le texte est découpé en parties avec des intertitres pour informer.
  - si:
      contient:
      - d
    relance: Une recette explique comment préparer un plat. Ici, on apprend la vie des abeilles.
  solution: 'C''est un texte documentaire : il donne des informations vraies, avec un titre, des intertitres et une photo
    légendée.'
- id: document-composite
  type: texte_court
  difficulte: 2
  enonce: Comment appelle-t-on un document qui mélange plusieurs types d'informations, par exemple un texte et une photo légendée
    ?
  reponse:
    acceptees:
    - document composite
    fautes_tolerees: 1
  indices:
    relance: Ce document est fait de plusieurs éléments différents assemblés ensemble.
    methode: Cherche dans ta leçon le mot qui désigne un document mélangeant texte et image.
    etape: Relis la partie de la leçon qui parle d'un texte relié à un plan et à sa légende.
  pieges:
  - si:
      valeur: document mixte
    relance: C'est proche de l'idée, mais ce n'est pas le mot exact utilisé dans la leçon. Relis le vocabulaire de la fiche.
  solution: 'On appelle cela un document composite : il faut mettre en lien le texte et l''image pour le comprendre en entier.'
- id: genres-et-caracteristiques
  type: association
  difficulte: 2
  enonce: Relie chaque genre de document à sa caractéristique principale.
  reponse:
    gauche:
    - id: carte
      texte: une carte
    - id: frise
      texte: une frise chronologique
    - id: tableau
      texte: un tableau
    - id: recit
      texte: un récit
    droite:
    - id: vu-d-en-haut
      texte: montre un lieu vu d'en haut, avec une légende
    - id: ordre-du-temps
      texte: range des événements dans l'ordre du temps
    - id: lignes-colonnes
      texte: range des informations en lignes et en colonnes
    - id: histoire
      texte: raconte une histoire avec des personnages
    paires:
      carte: vu-d-en-haut
      frise: ordre-du-temps
      tableau: lignes-colonnes
      recit: histoire
  indices:
    relance: Pense à un document de chaque sorte que tu as déjà vu dans ton cahier de géographie, d'histoire ou de lecture.
    methode: Pour chaque genre, demande-toi ce qu'il montre ou ce qu'il sert à faire.
    etape: Commence par le genre qui sert à raconter, puis par celui qui range des dates.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association ne va pas. Lequel montre un lieu, lequel range des informations en cases ?
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque genre un par un et demande-toi à quoi il sert.
  solution: La carte montre un lieu vu d'en haut avec une légende ; la frise chronologique range des événements dans l'ordre
    du temps ; le tableau range des informations en lignes et en colonnes ; le récit raconte une histoire avec des personnages.
- id: trouver-dans-tableau
  type: texte_court
  difficulte: 2
  enonce: 'Voici un tableau : « Livres empruntés à la bibliothèque de l''école — lundi : 12 ; mardi : 18 ; jeudi : 9 ; vendredi
    : 15 ». Quel jour a-t-on emprunté le moins de livres ?'
  reponse:
    acceptees:
    - jeudi
    - le jeudi
    fautes_tolerees: 1
  indices:
    relance: Le mot important de la question est « le moins ». Cherches-tu le plus grand ou le plus petit nombre ?
    methode: Compare les quatre nombres du tableau, puis lis le jour écrit à côté du plus petit.
    etape: Le plus petit des quatre nombres est plus petit que 10.
  pieges:
  - si:
      valeur: mardi
    relance: Mardi, c'est le jour où l'on a emprunté le plus de livres. La question demande le moins.
  - si:
      valeur: lundi
    relance: Lundi, on a emprunté 12 livres. Y a-t-il un nombre encore plus petit dans le tableau ?
  solution: 'Le plus petit nombre du tableau est 9 (9 est plus petit que 12, 15 et 18) : c''est le jeudi qu''on a emprunté
    le moins de livres.'
- id: repondre-avec-un-document
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour répondre à une question avec un document.
  reponse:
    elements:
    - id: question
      texte: Lire la question et repérer son mot important
    - id: choisir
      texte: Choisir le document qui parle du sujet de la question
    - id: chercher
      texte: Chercher le mot important dans le titre, les intertitres et les légendes
    - id: repondre
      texte: Écrire la réponse par une phrase
  indices:
    relance: Peut-on savoir quoi chercher dans un document avant d'avoir lu la question ?
    methode: On sait d'abord ce que l'on cherche, on choisit ensuite le bon document, on cherche dedans, et on répond en dernier.
    etape: La lecture de la question vient en premier, l'écriture de la réponse vient en dernier.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Laquelle doit venir avant l''autre ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la toute première étape (la question) et la toute dernière (la réponse), puis range les deux autres.
  solution: On lit la question et on repère son mot important, on choisit le document qui parle de ce sujet, on cherche le
    mot important dans le titre, les intertitres et les légendes, puis on écrit la réponse par une phrase.
- id: composite-jardin
  type: choix
  difficulte: 3
  enonce: 'Un document composite contient un texte et un plan. Le texte dit : « Les élèves de CM1 s''occupent de l''endroit
    numéro 2. » La légende du plan dit : « 1 = potager, 2 = mare, 3 = compost. » De quel endroit s''occupent les élèves de
    CM1 ?'
  reponse:
    options:
    - id: a
      texte: du potager
    - id: b
      texte: de la mare
    - id: c
      texte: du compost
    - id: d
      texte: On ne peut pas le savoir avec ce document.
    bonnes:
    - b
  indices:
    relance: Le texte donne un numéro. Où peux-tu trouver ce que veut dire ce numéro ?
    methode: Dans un document composite, on relie les informations du texte et celles de l'image ou de la légende.
    etape: Cherche le numéro donné par le texte dans la légende du plan.
  pieges:
  - si:
      contient:
      - a
    relance: Le potager porte le numéro 1. Quel numéro le texte donne-t-il ?
  - si:
      contient:
      - c
    relance: Le compost porte le numéro 3. Quel numéro le texte donne-t-il ?
  - si:
      contient:
      - d
    relance: Le texte seul ne suffit pas, mais la légende du plan complète l'information. Relie les deux.
  solution: Le texte donne le numéro 2 ; dans la légende du plan, le numéro 2 correspond à la mare. Les élèves de CM1 s'occupent
    donc de la mare.
- id: presenter-un-document
  type: ouverte
  difficulte: 3
  enonce: Choisis un document dans ton livre de sciences, d'histoire ou de géographie. Écris trois ou quatre phrases pour
    dire sa nature, sa source (si elle est indiquée) et une information que tu y as trouvée.
  criteres:
  - L'élève donne correctement la nature du document (texte, tableau, carte, photographie...).
  - L'élève cite la source du document, ou dit qu'elle n'est pas indiquée.
  - L'élève donne une information exacte trouvée dans le document, en disant où il l'a trouvée (titre, légende, texte).
  indices:
    relance: Regarde d'abord le document en entier. Est-ce un texte, une image, un tableau, une carte ?
    methode: Cherche en petit sous le document le nom d'un livre, d'un site ou d'un auteur, puis lis le titre et les légendes.
    etape: Tu peux commencer par « Ce document est… ; il vient de… ».
  solution: Réussite si tu donnes la nature du document, sa source (ou le fait qu'elle manque) et une information exacte,
    en disant où tu l'as trouvée.
- id: nblm-quand-on-etudie-un-document-en-sciences-1
  type: choix
  difficulte: 2
  enonce: Quand on étudie un document en sciences ou en histoire, que désigne sa « source » ?
  reponse:
    options:
    - id: o1
      texte: L'origine du document, c'est-à-dire qui l'a écrit ou publié et d'où il vient.
    - id: o2
      texte: Le résumé du contenu écrit dans la leçon.
    - id: o3
      texte: Le nombre total de pages du livre.
    - id: o4
      texte: La liste des mots difficiles soulignés en rouge.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui indique qui a créé le document ou où il a été publié.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, le résumé présente le contenu du document, pas son origine ou son auteur.
  - si:
      contient:
      - o3
    relance: 'Erreur fréquente : le nombre de pages est une donnée matérielle, cela n''explique pas d''où vient le document.'
  - si:
      contient:
      - o4
    relance: Faux, la liste des mots fait partie du texte ou du vocabulaire, ce n'est pas la source du document.
  solution: L'origine du document, c'est-à-dire qui l'a écrit ou publié et d'où il vient. C'est exact. La source indique l'auteur,
    le livre, le site ou la date d'origine du document.
- id: nblm-quelle-est-la-meilleure-methode-pour-tro-2
  type: choix
  difficulte: 2
  enonce: Quelle est la meilleure méthode pour trouver rapidement la réponse à une question dans un texte documentaire ?
  reponse:
    options:
    - id: o1
      texte: Lire la question avant de parcourir le document en s'aidant des titres et des légendes.
    - id: o2
      texte: Lire tout le document mot à mot du début à la fin sans regarder la question.
    - id: o3
      texte: Recopier le premier paragraphe du texte sans vérifier la question.
    - id: o4
      texte: Regarder seulement la première image sans lire le moindre titre.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à l'étape primordiale à accomplir avant de parcourir le document.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : lire tout le texte sans connaître la question fait perdre beaucoup de temps.'
  - si:
      contient:
      - o3
    relance: Attention, le premier paragraphe ne contient pas forcément la réponse recherchée.
  - si:
      contient:
      - o4
    relance: Faux, ignorer les titres et le texte empêche de trouver l'information précise.
  solution: Lire la question avant de parcourir le document en s'aidant des titres et des légendes. Exact ! Savoir ce que
    l'on cherche avant de lire permet d'orienter sa recherche sans tout lire inutilement.
- id: nblm-en-classe-de-sciences-tu-observes-un-doc-3
  type: choix
  difficulte: 2
  enonce: En classe de sciences, tu observes un document présenté sous forme de colonnes et de lignes avec des nombres. Quelle
    est la nature de ce document ?
  reponse:
    options:
    - id: o1
      texte: Un tableau.
    - id: o2
      texte: Un texte narratif.
    - id: o3
      texte: Une photographie.
    - id: o4
      texte: Un poème.
    bonnes:
    - o1
  indices:
    relance: Pense à la forme d'organisation des données avec des lignes et des colonnes.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Faux, une photographie est une prise de vue réelle, pas une grille structurée en lignes et colonnes.
  - si:
      contient:
      - o4
    relance: Faux, un poème est écrit en vers et en strophes, ce n'est pas une grille de données.
  solution: Un tableau. C'est juste ! Une présentation organisée en lignes et en colonnes avec des données est un tableau.
- id: nblm-comment-appelle-t-on-un-document-qui-mel-4
  type: choix
  difficulte: 2
  enonce: Comment appelle-t-on un document qui mélange plusieurs types d'informations, comme du texte et un schéma ?
  reponse:
    options:
    - id: o1
      texte: Un document composite.
    - id: o2
      texte: Un document imaginaire.
    - id: o3
      texte: Un roman policier.
    - id: o4
      texte: Un texte poétique.
    bonnes:
    - o1
  indices:
    relance: Ce mot signifie qu'il est composé de plusieurs éléments différents.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, un document documentaire repose sur des faits réels, pas sur de l'imaginaire.
  - si:
      contient:
      - o3
    relance: Faux, le roman policier est un genre littéraire de fiction, pas un type de document scientifique.
  - si:
      contient:
      - o4
    relance: Faux, un texte poétique vise la sensibilité du langage et les rimes, pas la combinaison d'informations.
  solution: Un document composite. Exact ! Un document composite rassemble différents supports (texte, image, schéma, tableau).
- id: nblm-avant-de-repondre-a-des-questions-sur-un-5
  type: choix
  difficulte: 2
  enonce: Avant de répondre à des questions sur une image ou un schéma scientifique, quel élément est-il essentiel de lire
    ?
  reponse:
    options:
    - id: o1
      texte: La légende de l'image ou du schéma.
    - id: o2
      texte: Le sommaire du manuel de français.
    - id: o3
      texte: Le numéro de la page uniquement.
    - id: o4
      texte: Le nom de l'imprimeur du livre.
    bonnes:
    - o1
  indices:
    relance: C'est le court texte placé sous l'image qui en explique le contenu.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Faux, le sommaire du livre donne la liste des chapitres, pas le sens d'un schéma précis.
  - si:
      contient:
      - o3
    relance: Attention, le numéro de page n'apporte aucune explication sur le contenu du schéma.
  - si:
      contient:
      - o4
    relance: Faux, l'imprimeur n'explique pas les informations représentées sur le schéma.
  solution: La légende de l'image ou du schéma. C'est juste ! La légende explique ce que représente l'image ou les symboles
    utilisés.
- id: nblm-quand-tu-etudies-plusieurs-documents-qui-6
  type: choix
  difficulte: 3
  enonce: Quand tu étudies plusieurs documents qui traitent du même sujet en sciences ou en histoire, quelles sont les deux
    démarches utiles à effectuer ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Mettre en lien les informations des différents documents pour compléter sa réponse.
    - id: o2
      texte: Repérer ce qui rapproche et ce qui différencie les documents.
    - id: o3
      texte: Ignorer le deuxième document et ne lire que le premier.
    - id: o4
      texte: Recopier les deux documents sans chercher à répondre à la question.
