# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-volume-annuel-lectures
version: 3
etat: verifiee
declencheurs:
- combien de livres lire cette année
- lire des livres anciens
- roman de littérature jeunesse
- objectif de lecture de l'année
- tenir un carnet de lecteur
- livre classique ou livre récent
- combien de livres il me manque
prerequis:
- cm1-appropriation-oeuvre-lue
essentiel: 'Au CM1, le programme officiel fixe un nombre minimum de livres à lire dans l''année. Il y a deux catégories, et
  il faut compter chacune à part.


  Première catégorie : au moins 2 œuvres du patrimoine. Ce sont des textes anciens, connus depuis longtemps et transmis de
  génération en génération, comme les fables de La Fontaine ou les contes de Perrault.


  Deuxième catégorie : au moins 5 ouvrages de littérature de jeunesse. Ce sont des livres écrits spécialement pour les enfants,
  souvent plus récents : romans, albums, bandes dessinées.


  Au total, cela fait au moins 2 + 5 = 7 livres dans l''année. Attention : lire 7 livres de littérature de jeunesse ne suffit
  pas, car il manquerait les œuvres du patrimoine. Il faut les deux.


  Lire ne suffit pas : il faut aussi garder trace de ses lectures. Par exemple, dans un carnet de lecture, on note le titre,
  l''auteur, la catégorie du livre et ce qu''on en a pensé.


  Enfin, on partage ses lectures avec les autres : on présente un livre à la classe, on conseille un titre à un camarade,
  on en discute ensemble.

  '
methode:
- Noter chaque livre lu dans un carnet de lecture, avec son titre et son auteur.
- Classer le livre dans sa catégorie, œuvre du patrimoine ou littérature de jeunesse.
- Compter séparément les livres de chaque catégorie.
- Comparer chaque compte au minimum attendu, 2 pour le patrimoine et 5 pour la jeunesse.
- Calculer ce qui manque dans chaque catégorie, puis choisir les prochaines lectures.
- Partager ses lectures, par exemple en présentant un livre à la classe.
vocabulaire:
- terme: œuvre du patrimoine
  definition: un texte ancien, connu depuis longtemps et transmis de génération en génération, comme une fable de La Fontaine.
- terme: littérature de jeunesse
  definition: des livres écrits spécialement pour les enfants, souvent plus récents.
- terme: carnet de lecture
  definition: un cahier personnel où l'on garde trace des livres lus et de ce qu'on en a pensé.
- terme: auteur
  definition: la personne qui a écrit le livre.
- terme: au moins
  definition: le plus petit nombre demandé ; on peut en faire plus, mais pas moins.
erreurs_frequentes:
- Ne lire que des œuvres du patrimoine ou que de la littérature de jeunesse, sans varier.
- Compter tous les livres ensemble au lieu de vérifier chaque catégorie séparément.
- Croire que « au moins 5 » veut dire « exactement 5 », alors qu'on peut en lire plus.
- Lire des livres sans en garder aucune trace pour pouvoir les partager plus tard.
exemple:
  enonce: Noé a lu 2 œuvres du patrimoine et 4 ouvrages de littérature de jeunesse depuis la rentrée. A-t-il atteint l'objectif
    de l'année pour le CM1 ?
  solution: 'Pas encore. On vérifie chaque catégorie séparément. Patrimoine : il en faut au moins 2, Noé en a lu 2, cette
    catégorie est complète. Littérature de jeunesse : il en faut au moins 5, il en a lu 4, il lui en manque 5 - 4 = 1. Il
    lui reste donc 1 livre à lire au minimum.'
exercices:
- id: nombre-patrimoine
  type: nombre
  difficulte: 1
  enonce: Combien d'œuvres du patrimoine au minimum un élève de CM1 doit-il lire dans l'année, selon le programme ?
  reponse:
    valeur: 2
    forme: entier
  indices:
    relance: C'est un petit nombre, moins que le nombre d'ouvrages de littérature de jeunesse.
    methode: Le programme distingue deux catégories, les œuvres du patrimoine et la littérature de jeunesse, avec un nombre
      minimum pour chacune.
    etape: Le nombre minimum d'œuvres du patrimoine est inférieur à 5.
  pieges:
  - si:
      valeur: 5
    relance: 5 est le nombre minimum d'ouvrages de littérature de jeunesse, pas d'œuvres du patrimoine.
  - si:
      valeur: 7
    relance: 7 est le nombre total minimum de livres, pas seulement les œuvres du patrimoine.
  solution: Il faut lire au moins 2 œuvres issues du patrimoine dans l'année de CM1.
- id: nombre-jeunesse
  type: nombre
  difficulte: 1
  enonce: Combien d'ouvrages de littérature de jeunesse au minimum un élève de CM1 doit-il lire dans l'année ?
  reponse:
    valeur: 5
    forme: entier
  indices:
    relance: C'est un nombre plus grand que celui des œuvres du patrimoine.
    methode: 'Additionne les deux catégories : le total minimum de livres dans l''année est de 7.'
    etape: Si le total est 7 et les œuvres du patrimoine sont 2, combien reste-t-il pour la littérature de jeunesse ?
  pieges:
  - si:
      valeur: 2
    relance: 2 est le nombre minimum d'œuvres du patrimoine, pas d'ouvrages de littérature de jeunesse.
  - si:
      valeur: 3
    relance: 'Recompte : le total des deux catégories doit être d''au moins 7 livres dans l''année.'
  solution: Il faut lire au moins 5 ouvrages de littérature de jeunesse dans l'année de CM1.
- id: classer-les-livres
  type: association
  difficulte: 1
  enonce: Relie chaque livre à sa catégorie.
  reponse:
    gauche:
    - id: fables
      texte: Un recueil de fables de La Fontaine
    - id: contes
      texte: Un recueil de contes de Perrault
    - id: roman-recent
      texte: Un roman paru l'an dernier, écrit pour les enfants de 9 à 11 ans
    - id: album
      texte: Un album illustré récent pour les enfants
    droite:
    - id: patrimoine
      texte: Œuvre du patrimoine
    - id: jeunesse
      texte: Littérature de jeunesse
    paires:
      fables: patrimoine
      contes: patrimoine
      roman-recent: jeunesse
      album: jeunesse
  indices:
    relance: Pour chaque livre, demande-toi s'il est connu depuis très longtemps ou s'il est récent.
    methode: Les œuvres du patrimoine sont anciennes et transmises de génération en génération. La littérature de jeunesse
      est écrite pour les enfants, souvent récemment.
    etape: Les fables de La Fontaine et les contes de Perrault sont lus depuis très longtemps. Et les deux autres livres ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Regarde bien si chaque livre est ancien ou récent.
  - si:
      diagnostic: associations_fausses
    relance: Cherche d'abord les livres les plus anciens, ils vont dans la même catégorie.
  solution: 'Œuvres du patrimoine : les fables de La Fontaine et les contes de Perrault, connus depuis très longtemps. Littérature
    de jeunesse : le roman récent et l''album récent, écrits pour les enfants.'
- id: objectif-atteint
  type: choix
  difficulte: 2
  enonce: Léa a lu 1 œuvre du patrimoine et 3 ouvrages de littérature de jeunesse depuis la rentrée. A-t-elle atteint l'objectif
    de l'année pour le CM1 ?
  reponse:
    options:
    - id: a
      texte: Non, il lui manque des œuvres du patrimoine et de la littérature de jeunesse
    - id: b
      texte: Oui, elle a déjà atteint l'objectif
    - id: c
      texte: Non, il ne lui manque que des œuvres du patrimoine
    - id: d
      texte: Non, il ne lui manque que de la littérature de jeunesse
    bonnes:
    - a
  indices:
    relance: Compare le nombre de livres lus par Léa dans chaque catégorie avec les minimums attendus.
    methode: 'Il faut vérifier séparément les deux catégories : œuvres du patrimoine et littérature de jeunesse.'
    etape: Léa a lu 1 œuvre du patrimoine sur 2 attendues, et 3 ouvrages de littérature de jeunesse sur 5 attendus.
  pieges:
  - si:
      contient:
      - b
    relance: Compte les livres de Léa dans chaque catégorie. Chaque catégorie est-elle complète ?
  - si:
      contient:
      - c
    relance: 'Regarde aussi la littérature de jeunesse : Léa en a lu 3, mais il en faut 5. Il lui en manque aussi.'
  - si:
      contient:
      - d
    relance: 'Regarde aussi les œuvres du patrimoine : Léa en a lu 1, mais il en faut 2. Il lui en manque aussi.'
  solution: Non, il lui manque 1 œuvre du patrimoine (elle en a lu 1 sur 2) et 2 ouvrages de littérature de jeunesse (elle
    en a lu 3 sur 5).
- id: livres-qui-manquent
  type: nombre
  difficulte: 2
  enonce: Tom a lu 1 œuvre du patrimoine et 2 ouvrages de littérature de jeunesse. Combien de livres doit-il encore lire,
    au minimum, pour atteindre l'objectif du CM1 ?
  reponse:
    valeur: 4
    forme: entier
  indices:
    relance: Calcule ce qui manque dans chaque catégorie, puis additionne.
    methode: 'Patrimoine : 2 attendus moins ce qu''il a lu. Jeunesse : 5 attendus moins ce qu''il a lu.'
    etape: Il lui manque 2 - 1 = 1 œuvre du patrimoine. Combien lui manque-t-il en littérature de jeunesse ?
  pieges:
  - si:
      valeur: 3
    relance: 3, c'est ce que Tom a déjà lu. Calcule ce qui lui manque.
  - si:
      valeur: 7
    relance: 7, c'est le total minimum de l'année. Retire ce que Tom a déjà lu.
  - si:
      valeur: 1
    relance: Tu as compté seulement le patrimoine. Regarde aussi la littérature de jeunesse.
  solution: Il manque 2 - 1 = 1 œuvre du patrimoine et 5 - 2 = 3 ouvrages de littérature de jeunesse, soit 1 + 3 = 4 livres
    au minimum.
- id: sept-de-jeunesse
  type: choix
  difficulte: 3
  enonce: Sami a lu 7 ouvrages de littérature de jeunesse et aucune œuvre du patrimoine. A-t-il atteint l'objectif du CM1
    ?
  reponse:
    options:
    - id: a
      texte: Non, il lui manque 2 œuvres du patrimoine
    - id: b
      texte: Oui, car il a lu 7 livres en tout
    - id: c
      texte: Non, il lui manque 5 ouvrages de littérature de jeunesse
    bonnes:
    - a
  indices:
    relance: Le total est bon, mais chaque catégorie est-elle complète ?
    methode: Vérifie les deux catégories séparément, pas seulement le total.
    etape: Combien d'œuvres du patrimoine Sami a-t-il lues, et combien en faut-il au minimum ?
  pieges:
  - si:
      contient:
      - b
    relance: Le total est bon. Mais le programme demande aussi un minimum d'œuvres du patrimoine. Combien en a-t-il lu ?
  - si:
      contient:
      - c
    relance: Sami a lu 7 ouvrages de jeunesse, il en faut au moins 5. Cette catégorie est déjà complète.
  solution: Non. La littérature de jeunesse est complète (7, il en faut au moins 5), mais il n'a lu aucune œuvre du patrimoine
    alors qu'il en faut au moins 2. Il lui manque 2 - 0 = 2 œuvres du patrimoine.
- id: garder-trace
  type: texte_court
  difficulte: 1
  enonce: Comment s'appelle le cahier personnel où l'on note les livres lus et ce qu'on en a pensé ?
  reponse:
    acceptees:
    - carnet de lecture
    - un carnet de lecture
    - le carnet de lecture
    - carnet de lecteur
    - cahier de lecture
    fautes_tolerees: 2
  indices:
    relance: C'est un petit cahier qui t'accompagne toute l'année.
    methode: On y garde trace de ses lectures pour pouvoir les partager plus tard.
    etape: Relis le vocabulaire de la leçon. Un des mots désigne ce cahier personnel.
  pieges:
  - si:
      valeur: cahier de brouillon
    relance: Le brouillon sert à préparer un texte. Quel cahier sert à garder trace de ses lectures ?
  solution: 'Le carnet de lecture : on y note le titre, l''auteur et ce qu''on a pensé de chaque livre lu.'
- id: presenter-un-livre
  type: ouverte
  difficulte: 2
  enonce: Choisis un livre que tu as lu cette année. Écris sa fiche pour ton carnet de lecture, puis une phrase pour le conseiller
    à un camarade.
  criteres:
  - L'élève donne le titre et l'auteur du livre, et dit à quelle catégorie il appartient.
  - L'élève donne son avis et le justifie par une raison.
  - L'élève écrit une phrase qui donne envie de lire le livre.
  indices:
    relance: Commence par le titre et l'auteur, tu les trouves sur la couverture.
    methode: Ensuite, dis à quelle catégorie appartient le livre, puis ce que tu en as pensé et pourquoi.
    etape: Pour conseiller le livre, tu peux commencer par « Je te conseille ce livre parce que... ».
  solution: 'Exemple de réponse : « Titre et auteur du livre. Catégorie : littérature de jeunesse. Mon avis : j''ai aimé ce
    livre parce que le héros est courageux. Je te conseille ce livre parce que l''aventure est pleine de suspense. »'
