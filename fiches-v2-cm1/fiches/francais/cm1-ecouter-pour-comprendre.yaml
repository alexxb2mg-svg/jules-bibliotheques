  reponse:
    options:
    - id: o1
      texte: Rester concentré pendant toute l'écoute sur le but recherché, sans se laisser distraire.
    - id: o2
      texte: Attendre la fin du cours pour demander à un camarade de lui donner ses notes.
    - id: o3
      texte: Rêver à d'autres choses pendant que le professeur ou l'intervenant parle.
    - id: o4
      texte: Écrire sans s'arrêter tout ce qu'il entend sans chercher à comprendre le sens.
    bonnes:
    - o1
  indices:
    relance: Pense à la posture à adopter pendant l'écoute pour maintenir son attention.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Cela ne développe pas son autonomie ni sa capacité à comprendre par lui-même.
  - si:
      contient:
      - o3
    relance: Se laisser distraire est l'inverse de la concentration requise pour l'écoute active.
  - si:
      contient:
      - o4
    relance: Écrire de façon mécanique sans écouter activement empêche d'identifier l'essentiel.
  solution: Rester concentré pendant toute l'écoute sur le but recherché, sans se laisser distraire. L'écoute active exige
    un maintien continu de l'attention orientée vers l'objectif.
