format: 2
notion: cm1-ecouter-pour-comprendre
version: 3
etat: verifiee
declencheurs:
- j'ai pas écouté
- comprendre ce qu'on entend
- reportage à la radio
- interview
- on m'a raconté une histoire
- j'écoute pas bien
- écoute active
- redire ce que j'ai entendu
- écouter un conte
prerequis: []
essentiel: 'Écouter pour comprendre, ce n''est pas seulement entendre des sons. C''est garder toute son attention sur ce que
  dit quelqu''un. On appelle cela l''écoute active.


  Avant d''écouter, tu te demandes ce que tu cherches : une information précise, une histoire, un avis ? C''est ton but. Pendant
  l''écoute, tu restes concentré sur ce but, sans te laisser distraire.


  Tu peux écouter une personne (la maîtresse, un camarade, un invité) ou un média, comme la radio ou la télévision. Il existe
  plusieurs genres de discours. Dans une interview, une personne pose des questions et une autre répond. Dans un reportage,
  un journaliste raconte et montre un événement réel. Dans un conte, quelqu''un raconte une histoire inventée, avec des personnages.


  Pour montrer que tu as compris, tu redis les informations importantes avec tes propres mots : c''est reformuler. Tu relies
  les informations entre elles, dans l''ordre, au lieu de les répéter en désordre. Exemple : « Le reportage explique que le
  renard vit la nuit et se cache dans un terrier. »


  Tu peux aussi deviner ce qui n''est pas dit clairement. Si on entend « Léa revient de la cour, les genoux pleins de terre,
  en se frottant le coude », on devine qu''elle est tombée.


  Enfin, écouter un texte peut te faire ressentir quelque chose : peur, rire, surprise, tristesse. Tu peux le dire et expliquer
  pourquoi.

  '
methode:
- 'Avant d''écouter, se demander ce qu''on cherche : une information précise, une histoire, un avis ?'
- Pendant l'écoute, rester concentré sur le but recherché, sans se laisser distraire.
- Repérer de quel genre de discours il s'agit (interview, reportage, histoire).
- Repérer les personnages, le lieu, le moment et les événements importants.
- Reformuler avec ses propres mots ce qui a été dit, en reliant les informations dans l'ordre.
- Dire ce que le texte a fait ressentir, en expliquant pourquoi.
vocabulaire:
- terme: écoute active
  definition: une attention orientée vers un but, pas seulement entendre
- terme: reformuler
  definition: redire une idée entendue avec ses propres mots
- terme: interview
  definition: un échange où une personne pose des questions et une autre y répond
- terme: reportage
  definition: un récit d'un journaliste qui montre et raconte un événement réel
- terme: média
  definition: un moyen de diffuser des informations à beaucoup de gens, comme la radio ou la télévision
erreurs_frequentes:
- Répéter mot pour mot ce qui a été dit au lieu de reformuler avec ses propres mots.
- Ne retenir qu'un détail et oublier les informations essentielles du message.
- Ne pas relier les informations entre elles pour comprendre ce qui n'est pas dit clairement.
- Écouter sans savoir ce qu'on cherche, et se laisser distraire.
- Confondre une interview (questions et réponses) et un reportage (un journaliste raconte un événement).
exemple:
  enonce: 'Tu écoutes ce reportage : « Le renard vit la nuit. Il mange des petits animaux et des fruits. Il creuse un terrier
    pour se cacher. » Explique en une phrase ce que tu as compris.'
  solution: 'Je peux dire : le reportage explique que le renard vit la nuit (c''est un animal nocturne), qu''il se nourrit
    de petits animaux et de fruits, et qu''il se cache dans un terrier.'
exercices:
- id: definir-ecoute-active
  type: choix
  difficulte: 1
  enonce: Qu'est-ce que l'« écoute active » ?
  reponse:
    options:
    - id: a
      texte: Une attention orientée vers un but précis, pas seulement entendre des sons
    - id: b
      texte: Le simple fait d'entendre un bruit sans y prêter attention
    - id: c
      texte: Répéter mot pour mot tout ce qu'on a entendu
    bonnes:
    - a
  indices:
    relance: Le mot « active » indique qu'il y a un effort, pas juste une perception passive.
    methode: Élimine l'option qui décrit juste le fait d'entendre sans réfléchir.
    etape: L'écoute active suppose de savoir pourquoi on écoute, et de rester concentré sur ce but.
  pieges:
  - si:
      contient:
      - b
    relance: Entendre sans y prêter attention n'est pas de l'écoute active, c'est justement ce qu'il faut éviter.
  - si:
      contient:
      - c
    relance: 'Répéter mot pour mot n''est pas reformuler ni comprendre : ce n''est pas le but de l''écoute active.'
  solution: 'L''écoute active est une attention orientée vers un but précis : on écoute pour trouver quelque chose, pas juste
    pour entendre des sons.'
- id: reformuler-ou-repeter
  type: choix
  difficulte: 1
  enonce: Pour montrer que tu as bien compris un message oral, que dois-tu faire ?
  reponse:
    options:
    - id: a
      texte: Reformuler avec tes propres mots ce qui a été dit
    - id: b
      texte: Répéter mot pour mot les phrases entendues
    - id: c
      texte: Ne retenir qu'un seul détail au hasard
    bonnes:
    - a
  indices:
    relance: Reformuler prouve que tu as compris l'idée, pas juste mémorisé des mots.
    methode: Élimine l'option qui ne demande aucune compréhension personnelle.
    etape: Utiliser tes propres mots pour redire l'idée montre que tu l'as vraiment saisie.
  pieges:
  - si:
      contient:
      - b
    relance: Répéter mot pour mot ne prouve pas forcément que tu as compris, seulement que tu as mémorisé.
  - si:
      contient:
      - c
    relance: Ne retenir qu'un détail au hasard fait perdre les informations essentielles du message.
  solution: Il faut reformuler avec tes propres mots ce qui a été dit, ce qui montre une vraie compréhension du message.
- id: vocabulaire-reformuler
  type: texte_court
  difficulte: 1
  enonce: Quel mot désigne le fait de redire une idée entendue avec ses propres mots ?
  reponse:
    acceptees:
    - reformuler
    - la reformulation
    fautes_tolerees: 1
  indices:
    relance: C'est ce que tu fais pour montrer à la maîtresse que tu as compris, sans répéter ses phrases.
    methode: Relis le vocabulaire de la leçon et cherche le verbe qui parle de « tes propres mots ».
    etape: C'est le contraire de « répéter mot pour mot ».
  pieges:
  - si:
      valeur: répéter
    relance: Répéter, c'est redire exactement les mêmes mots. Le mot cherché signifie redire avec d'autres mots.
  solution: 'Le mot est « reformuler » : redire une idée entendue avec ses propres mots.'
- id: etapes-ecoute-active
  type: ordre
  difficulte: 2
  enonce: Range ces actions dans l'ordre où tu les fais quand tu écoutes un reportage pour l'expliquer ensuite.
  reponse:
    elements:
    - id: but
      texte: Je me demande ce que je cherche à savoir
    - id: reperer
      texte: Je repère les informations importantes pendant que j'écoute
    - id: reformuler
      texte: Je redis l'essentiel avec mes propres mots
  indices:
    relance: Qu'est-ce qu'on fait avant même que le reportage commence ?
    methode: Pense à trois moments, avant, pendant et après l'écoute, et place une action dans chacun.
    etape: La première action se fait avant d'écouter, quand tu choisis ton but. Laquelle vient pendant l'écoute ?
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: Presque. Deux actions voisines sont inversées. Peux-tu redire un message que tu n'as pas encore écouté ?
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord ce qu'on fait avant d'écouter, puis ce qu'on fait une fois l'écoute terminée.
  solution: 'Avant : je me demande ce que je cherche à savoir. Pendant : je repère les informations importantes. Après : je
    redis l''essentiel avec mes propres mots.'
- id: genres-de-discours
  type: association
  difficulte: 2
  enonce: Relie chaque genre de discours entendu à ce qui le caractérise.
  reponse:
    gauche:
    - id: interview
      texte: une interview
    - id: reportage
      texte: un reportage
    - id: conte
      texte: un conte
    droite:
    - id: questions
      texte: une personne pose des questions, une autre y répond
    - id: evenement
      texte: un journaliste raconte et montre un événement réel
    - id: invente
      texte: quelqu'un raconte une histoire inventée, avec des personnages
    paires:
      interview: questions
      reportage: evenement
      conte: invente
  indices:
    relance: Lequel de ces trois genres raconte quelque chose qui n'a pas vraiment existé ?
    methode: Pour chaque genre, demande-toi qui parle, et si ce qu'on entend est réel ou inventé.
    etape: Un seul de ces genres parle de personnages inventés. Entre les deux autres, lequel est fait de questions ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel des deux genres réels est un échange entre deux personnes ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par le conte, le seul genre inventé, puis demande-toi lequel des deux autres est un dialogue.
  solution: 'Interview : une personne pose des questions, une autre y répond. Reportage : un journaliste raconte et montre
    un événement réel. Conte : une histoire inventée, avec des personnages.'
- id: deviner-non-dit
  type: choix
  difficulte: 3
  enonce: 'Tu entends : « Léa revient de la cour. Ses genoux sont pleins de terre et elle se frotte le coude en grimaçant.
    » Qu''est-ce qui lui est sans doute arrivé ?'
  reponse:
    options:
    - id: a
      texte: Elle est tombée pendant la récréation
    - id: b
      texte: Elle a gagné une course
    - id: c
      texte: Elle a mangé son goûter
    bonnes:
    - a
  indices:
    relance: La phrase ne le dit pas directement. Quels indices donne-t-elle sur son corps ?
    methode: Relie les indices entre eux, la terre sur les genoux, le coude qu'elle frotte, la grimace, et cherche ce qui
      les explique tous.
    etape: On grimace quand on a mal. Qu'est-ce qui peut faire mal au coude et salir les genoux ?
  pieges:
  - si:
      contient:
      - b
    relance: Gagner une course rend content. Pourquoi Léa grimacerait-elle et se frotterait-elle le coude ?
  - si:
      contient:
      - c
    relance: Le goûter n'explique ni la terre sur les genoux ni le coude douloureux. Relie ces deux indices.
  solution: 'Elle est sans doute tombée : la terre sur les genoux, le coude qu''elle frotte et sa grimace le montrent, même
    si ce n''est pas dit.'
- id: raconter-histoire-entendue
  type: ouverte
  difficulte: 2
  enonce: Demande à un adulte de te raconter à voix haute une courte histoire (5 phrases). Redis-la ensuite avec tes propres
    mots, sans regarder de texte.
  criteres:
  - L'élève retrouve les personnages de l'histoire.
  - L'élève retrouve le lieu et les événements principaux, dans l'ordre.
  - L'élève reformule avec ses propres mots, sans réciter par cœur.
  indices:
    relance: Retiens qui fait quoi, où et quand.
    methode: Utilise des phrases comme « La personne dit que… » pour introduire ta reformulation.
    etape: Raconte les événements dans l'ordre où ils se sont passés dans l'histoire.
  solution: Réussite si tu retrouves les personnages, le lieu et les événements principaux, dans l'ordre, sans réciter par
    cœur.
- id: publicite-info-ressenti
  type: ouverte
  difficulte: 2
  enonce: Écoute une publicité ou une annonce à la radio ou à la télévision. Dis ce qu'elle explique et ce qu'elle te fait
    ressentir.
  criteres:
  - L'élève distingue clairement l'information donnée par la publicité.
  - L'élève exprime sa réaction personnelle (ressenti), justifiée par une raison.
  indices:
    relance: Sépare bien l'information (ce qui est dit) de ton ressenti (ce que ça te fait).
    methode: Commence par « La publicité explique que... » puis continue par « Elle me fait ressentir... parce que... ».
    etape: N'oublie pas de justifier ton ressenti par une raison précise.
  solution: Réussite si tu distingues clairement l'information donnée et ta réaction personnelle, justifiée par une raison.
- id: nblm-d-apres-la-fiche-de-la-notion-que-signif-1
  type: choix
  difficulte: 2
  enonce: D'après la fiche de la notion, que signifie vraiment « écouter pour comprendre ce qu'on entend » ?
  reponse:
    options:
    - id: o1
      texte: Garder toute son attention orientée vers un but pour retenir les informations importantes.
    - id: o2
      texte: Entendre des sons en arrière-plan tout en faisant autre chose sans se concentrer.
    - id: o3
      texte: Répéter par cœur toutes les phrases entendues sans en chercher le sens.
    - id: o4
      texte: Attendre la fin du document pour deviner le sujet au hasard.
    bonnes:
    - o1
  indices:
    relance: Réfléchis à la différence entre entendre un bruit et faire attention au message.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Entendre simplement des bruits n'est pas une écoute active axée sur la compréhension.
  - si:
      contient:
      - o3
    relance: Répéter mot pour mot est une erreur fréquente et ne prouve pas qu'on a compris.
  - si:
      contient:
      - o4
    relance: Il faut maintenir son attention pendant toute l'écoute et non deviner à la fin.
  solution: 'Garder toute son attention orientée vers un but pour retenir les informations importantes. C''est la définition
    exacte de l''écoute active : une attention orientée vers ce qu''on cherche à savoir.'
- id: nblm-tu-ecoutes-un-reportage-a-la-radio-sur-l-2
  type: choix
  difficulte: 2
  enonce: Tu écoutes un reportage à la radio sur les animaux. Pour bien comprendre ce qu'on entend, quelle est la première
    étape de la méthode ?
  reponse:
    options:
    - id: o1
      texte: Se demander avant d'écouter ce qu'on cherche à savoir (une information, une histoire...).
    - id: o2
      texte: Retenir uniquement un petit détail amusant et oublier l'information principale.
    - id: o3
      texte: Dire « j'écoute pas bien » et s'arrêter d'écouter dès la première phrase.
    - id: o4
      texte: Recopier immédiatement toutes les phrases du journaliste sans réfléchir.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qu'il faut faire avant même de lancer l'écoute.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: C'est une erreur classique de ne retenir qu'un détail au lieu des informations essentielles.
  - si:
      contient:
      - o3
    relance: Il faut maintenir son attention active pendant toute l'écoute au lieu d'abandonner.
  - si:
      contient:
      - o4
    relance: La compréhension demande de reformuler avec ses propres mots, pas de copier mot pour mot.
  solution: Se demander avant d'écouter ce qu'on cherche à savoir (une information, une histoire...). Avant l'écoute, se fixer
    un but permet de savoir quelles informations importantes repérer.
- id: nblm-lors-de-l-ecoute-d-une-interview-un-elev-3
  type: choix
  difficulte: 2
  enonce: 'Lors de l''écoute d''une interview, un élève affirme : « J''ai tout répété mot pour mot, donc j''ai compris ! ».
    Quelle erreur commet-il ?'
  reponse:
    options:
    - id: o1
      texte: Répéter mot pour mot ne prouve pas qu'on a compris ; il faut reformuler avec ses propres mots.
    - id: o2
      texte: Il aurait dû enregistrer l'interview sur son téléphone au lieu d'écouter.
    - id: o3
      texte: Il fallait inventer des fausses réponses qui ne sont pas dans l'interview.
    - id: o4
      texte: Une interview ne contient jamais aucune information importante.
    bonnes:
    - o1
  indices:
    relance: Pense au sens du verbe « reformuler » dans la leçon.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Un enregistrement ne remplace pas le travail de compréhension et de réflexion de l'auditeur.
  - si:
      contient:
      - o3
    relance: Comprendre signifie retenir les vraies informations transmises, pas inventer de faux détails.
  - si:
      contient:
      - o4
    relance: Une interview est au contraire un support média riche en informations explicites et implicites.
  solution: 'Répéter mot pour mot ne prouve pas qu''on a compris ; il faut reformuler avec ses propres mots. La fiche indique
    que répéter mot pour mot est une erreur : il faut redire les idées avec son propre vocabulaire.'
- id: nblm-un-camarade-te-raconte-on-m-a-raconte-un-4
  type: choix
  difficulte: 2
  enonce: 'Un camarade te raconte : « On m''a raconté une histoire, mais je n''ai pas compris car les détails étaient mélangés.
    » Que dit la fiche à ce sujet ?'
  reponse:
    options:
    - id: o1
      texte: Il faut relier les informations entendues entre elles au lieu de les laisser dans le désordre.
    - id: o2
      texte: Il faut dire « j'ai pas écouté » et refuser d'écouter d'autres histoires.
    - id: o3
      texte: Il faut ne retenir que le dernier mot du récit et ignorer tout le reste.
    - id: o4
      texte: Il faut apprendre la liste de tous les mots de l'histoire par ordre alphabétique.
    bonnes:
    - o1
  indices:
    relance: Cherche ce qui permet de donner une cohérence globale à plusieurs éléments entendus.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Refuser d'écouter n'aide pas à construire une posture d'auditeur concentré.
  - si:
      contient:
      - o3
    relance: Oublier l'essentiel du message empêche de saisir la globalité de l'histoire.
  - si:
      contient:
      - o4
    relance: Comprendre une histoire repose sur la logique des événements, pas sur un classement de mots.
  solution: Il faut relier les informations entendues entre elles au lieu de les laisser dans le désordre. Pour montrer qu'on
    a compris, il faut mettre en lien les informations entendues.
- id: nblm-un-eleve-dit-j-ecoute-pas-bien-en-classe-5
  type: choix
  difficulte: 2
  enonce: 'Un élève dit : « J''écoute pas bien en classe, je me laisse souvent distraire. » Que doit-il appliquer pour réussir
