# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-analyser-groupe-nominal
version: 3
etat: verifiee
declencheurs:
- groupe nominal
- nom noyau
- épithète
- déterminant nom adjectif
- le petit chat
- quel est le noyau
- épithète nom adjectif
- adjectif avant ou après le nom
prerequis:
- cm1-identifier-mots-selon-nature
essentiel: 'Le groupe nominal (GN) est un groupe de mots construit autour d''un nom. Il est formé d''un déterminant, d''un
  nom noyau, et parfois d''un ou plusieurs adjectifs qui apportent une précision.


  Le nom noyau est le mot le plus important du groupe : c''est lui qui donne son sens principal au groupe. Dans « le petit
  chat noir », le noyau est « chat ». Pour le trouver, on retire les autres mots : il reste le nom, et le groupe parle toujours
  de la même chose.


  Au CM1, on rencontre trois constructions. Déterminant + Nom : le chat. Déterminant + Nom + Adjectif : le chat noir. Déterminant
  + Adjectif + Nom : le petit chat. On peut aussi trouver un adjectif de chaque côté : le petit chat noir.


  Quand un adjectif est placé directement à côté du nom, sans préposition (comme « de » ou « à ») entre les deux, il occupe
  la fonction épithète. Dans « une avocate remarquable », l''adjectif « remarquable » est épithète du nom « avocate ». Un
  adjectif épithète peut se trouver avant ou après le nom.


  L''adjectif épithète peut souvent être supprimé : la phrase reste correcte, mais elle est moins précise. Le nom noyau, lui,
  ne peut pas être supprimé.

  '
methode:
- Repérer le groupe nominal dans la phrase (souvent introduit par un déterminant).
- 'Trouver le nom noyau : le mot autour duquel le groupe est construit.'
- Vérifier en supprimant les autres mots du groupe ; le nom noyau doit rester.
- 'Repérer si un adjectif est directement relié au nom, sans préposition : c''est un adjectif épithète.'
- Regarder des deux côtés du nom, car un adjectif épithète peut être placé avant ou après.
- 'Identifier l''ordre des mots : Dét. + Nom, Dét. + Nom + Adj., ou Dét. + Adj. + Nom.'
vocabulaire:
- terme: groupe nominal (GN)
  definition: groupe formé d'un déterminant, d'un nom noyau et éventuellement d'une expansion
- terme: nom noyau
  definition: le nom principal autour duquel s'organise le groupe nominal
- terme: déterminant
  definition: le petit mot placé devant le nom, qui ouvre le groupe nominal (le, une, ces, mon...)
- terme: épithète
  definition: fonction d'un adjectif directement relié au nom, sans préposition
- terme: expansion du nom
  definition: un mot ou un groupe de mots qui ajoute une précision au nom, comme un adjectif épithète
erreurs_frequentes:
- Confondre le nom noyau avec le déterminant ou l'adjectif du groupe nominal.
- Oublier l'adjectif épithète quand il est placé avant le nom (le petit chat).
- Découper mal le groupe nominal en oubliant un de ses éléments.
- Penser qu'un adjectif épithète se place toujours après le nom.
exemple:
  enonce: Dans le groupe nominal « le petit chat noir », trouve le nom noyau et les adjectifs épithètes.
  solution: 'Le nom noyau est chat. Les adjectifs épithètes sont petit (placé avant) et noir (placé après) : ils sont tous
    deux directement reliés au nom, sans préposition.'
exercices:
- id: noyau-maison
  type: texte_court
  difficulte: 1
  enonce: Dans « une grande maison blanche », donne le nom noyau.
  reponse:
    acceptees:
    - maison
    fautes_tolerees: 1
  indices:
    relance: Quel mot est le plus important, celui autour duquel le groupe est construit ?
    methode: Le nom noyau porte le sens principal du groupe nominal, les autres mots l'accompagnent.
    etape: 'Retire le déterminant et l''adjectif : quel mot reste ?'
  pieges:
  - si:
      valeur: grande
    relance: Ce mot est un adjectif qui précise le nom, ce n'est pas le nom noyau.
  - si:
      valeur: blanche
    relance: Ce mot dit de quelle couleur est la chose. C'est un adjectif, pas le nom noyau.
  solution: 'maison : c''est le nom noyau autour duquel s''organise le groupe.'
- id: construction-gn
  type: choix
  difficulte: 1
  enonce: Quelle est la construction du groupe nominal « le chat noir » ?
  reponse:
    options:
    - id: a
      texte: Déterminant + Nom
    - id: b
      texte: Déterminant + Nom + Adjectif
    - id: c
      texte: Déterminant + Adjectif + Nom
    bonnes:
    - b
  indices:
    relance: L'adjectif est-il placé avant ou après le nom ?
    methode: Observe l'ordre des trois éléments du groupe nominal pour choisir la bonne construction.
    etape: Dans le chat noir, l'adjectif noir vient après le nom chat.
  pieges:
  - si:
      contient:
      - c
    relance: Dans cette construction, l'adjectif serait placé avant le nom. Vérifie l'ordre des mots ici.
  - si:
      contient:
      - a
    relance: Le groupe compte trois mots. Un des mots dit comment est le chat ; ne l'oublie pas.
  solution: 'Déterminant + Nom + Adjectif : l''adjectif noir suit le nom chat.'
- id: noyau-dans-phrase
  type: texte_court
  difficulte: 1
  enonce: Dans la phrase « Mon vieux vélo rouillé grince. », donne le nom noyau du groupe sujet.
  reponse:
    acceptees:
    - vélo
    fautes_tolerees: 1
  indices:
    relance: Qu'est-ce qui grince ? Quel objet ?
    methode: Trouve le groupe sujet, puis retire le déterminant et les adjectifs.
    etape: Le groupe sujet compte quatre mots. Deux d'entre eux disent comment est l'objet.
  pieges:
  - si:
      valeur: vieux
    relance: Ce mot dit comment est l'objet. C'est un adjectif.
  - si:
      valeur: rouillé
    relance: Ce mot décrit l'objet. C'est un adjectif, il peut être supprimé.
  solution: 'vélo : le groupe sujet est « mon vieux vélo rouillé », le nom noyau est vélo, entouré de deux adjectifs épithètes.'
- id: reperer-epithete
  type: texte_court
  difficulte: 2
  enonce: Dans « une avocate remarquable », quel mot est épithète ?
  reponse:
    acceptees:
    - remarquable
    fautes_tolerees: 1
  indices:
    relance: Cherche l'adjectif directement relié au nom, sans préposition.
    methode: L'adjectif épithète se trouve juste à côté du nom qu'il qualifie, sans mot entre les deux.
    etape: Le mot avocate est le nom noyau ; quel adjectif le qualifie directement ?
  pieges:
  - si:
      valeur: avocate
    relance: Ce mot est le nom noyau. L'épithète est un adjectif qui le précise.
  solution: 'remarquable : cet adjectif est directement relié au nom avocate, sans préposition, il occupe la fonction épithète.'
- id: epithete-avant-nom
  type: choix
  difficulte: 2
  enonce: Dans « un joli bouquet », le mot « joli » est-il un adjectif épithète ?
  reponse:
    options:
    - id: a
      texte: Oui, il est directement relié au nom, même s'il est placé avant.
    - id: b
      texte: Non, car un adjectif épithète est toujours placé après le nom.
    - id: c
      texte: Non, car c'est le nom noyau.
    bonnes:
    - a
  indices:
    relance: Y a-t-il un mot comme « de » ou « à » entre « joli » et « bouquet » ?
    methode: Un adjectif épithète est relié au nom sans préposition. Sa place, avant ou après, ne change pas sa fonction.
    etape: Pense au groupe « le petit chat ». Où se trouve « petit » ?
  pieges:
  - si:
      contient:
      - b
    relance: Pense à « le petit chat » ou « une belle voiture ». L'adjectif peut aussi être placé avant le nom.
  - si:
      contient:
      - c
    relance: De quoi parle-t-on ? D'un joli, ou d'un bouquet ? Le nom noyau est l'autre mot.
  solution: 'Oui : « joli » est un adjectif épithète du nom bouquet. Il est relié au nom sans préposition, même s''il est
    placé avant.'
- id: construire-gn
  type: texte_court
  difficulte: 2
  enonce: 'Construis un groupe nominal de type Déterminant + Adjectif + Nom avec le déterminant « une », le nom « voiture
    » et un de ces adjectifs : belle, petite, grande, jolie, vieille.'
  reponse:
    acceptees:
    - la belle voiture
    - une belle voiture
    - la petite voiture
    - une petite voiture
    - la grande voiture
    - une grande voiture
    - la jolie voiture
    - une jolie voiture
    - la vieille voiture
    - une vieille voiture
    fautes_tolerees: 2
  indices:
    relance: L'adjectif doit se placer avant le nom, comme dans « le petit chat ».
    methode: Choisis un déterminant, puis un adjectif avant le nom voiture.
    etape: Place l'adjectif juste avant voiture, précédé d'un déterminant.
  solution: la belle voiture (déterminant la, adjectif belle, nom noyau voiture).
- id: association-elements-gn
  type: association
  difficulte: 2
  enonce: Relie chaque mot à son rôle dans le groupe nominal « cette petite fille curieuse ».
  reponse:
    gauche:
    - id: a
      texte: cette
    - id: b
      texte: fille
    - id: c
      texte: curieuse
    droite:
    - id: x
      texte: déterminant
    - id: y
      texte: nom noyau
    - id: z
      texte: adjectif épithète
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Cherche lequel précède le groupe, lequel porte le sens principal, lequel qualifie le nom après lui.
    methode: Le déterminant ouvre le groupe, le nom noyau porte le sens principal, l'adjectif épithète qualifie directement
      le nom.
    etape: 'Pose-toi une question pour chaque mot : ouvre-t-il le groupe, porte-t-il le sens principal, ou précise-t-il le
      nom ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie lequel des trois mots porte le sens principal du groupe.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le mot qui ouvre le groupe, tout à gauche.
  solution: cette-déterminant, fille-nom noyau, curieuse-adjectif épithète.
- id: gn-et-construction
  type: association
  difficulte: 3
  enonce: Relie chaque groupe nominal à sa construction.
  reponse:
    gauche:
    - id: a
      texte: un oiseau
    - id: b
      texte: un oiseau bleu
    - id: c
      texte: un bel oiseau
    droite:
    - id: x
      texte: Déterminant + Nom
    - id: y
      texte: Déterminant + Nom + Adjectif
    - id: z
      texte: Déterminant + Adjectif + Nom
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Combien de mots compte chaque groupe ?
    methode: Trouve d'abord le nom noyau oiseau, puis regarde si un adjectif est placé avant ou après lui.
    etape: Le groupe de deux mots n'a pas d'adjectif. Pour les deux autres, regarde la place de l'adjectif.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Regarde où se trouve l'adjectif par rapport à oiseau.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le groupe le plus court, puis compare la place de « bleu » et celle de « bel ».
  solution: un oiseau-Dét. + Nom, un oiseau bleu-Dét. + Nom + Adj., un bel oiseau-Dét. + Adj. + Nom.
- id: ouverte-analyse-gn
  type: ouverte
  difficulte: 3
  enonce: 'Analyse le groupe nominal « un grand jardin fleuri » : donne le déterminant, le nom noyau et les adjectifs épithètes.'
  criteres:
  - L'élève identifie « un » comme déterminant.
  - L'élève identifie « jardin » comme nom noyau.
  - L'élève identifie « grand » et « fleuri » comme adjectifs épithètes.
  indices:
    relance: Repère d'abord le mot qui ouvre le groupe, puis le mot le plus important, puis les mots qui le qualifient.
    methode: Passe en revue chaque mot du groupe et identifie sa fonction dans le groupe nominal.
    etape: 'Retire les mots un par un : celui qu''on ne peut pas retirer est le nom noyau. Regarde ensuite de chaque côté
      de lui.'
  solution: 'Déterminant : un. Nom noyau : jardin. Adjectifs épithètes : grand (placé avant) et fleuri (placé après), tous
    deux directement reliés au nom sans préposition.'
- id: nblm-dans-le-groupe-nominal-le-petit-chat-que-1
  type: choix
  difficulte: 2
  enonce: Dans le groupe nominal « le petit chat », quel est le nom noyau ?
  reponse:
    options:
    - id: o1
      texte: chat
    - id: o2
      texte: petit
    - id: o3
      texte: le
    - id: o4
      texte: petit chat
    bonnes:
    - o1
  indices:
    relance: Recherche le nom principal autour duquel s'organise tout le groupe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur typique : ''petit'' est un adjectif qualificatif qui apporte une précision, ce n''est pas
      le nom noyau.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur typique : ''le'' est un déterminant (article défini), il introduit le nom mais n''est pas
      le nom noyau.'
  solution: 'chat. C''est juste : ''chat'' est le nom principal qui donne son sens essentiel au groupe nominal.'
- id: nblm-quelle-est-la-structure-du-groupe-nomina-2
  type: choix
  difficulte: 2
  enonce: Quelle est la structure du groupe nominal « un manteau rouge » ?
  reponse:
    options:
    - id: o1
      texte: Déterminant + Nom + Adjectif
    - id: o2
      texte: Déterminant + Adjectif + Nom
    - id: o3
      texte: Adjectif + Nom + Déterminant
    - id: o4
      texte: Déterminant + Nom
    bonnes:
    - o1
  indices:
    relance: Observe bien la place de chacun des trois mots composant ce groupe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur typique : l''adjectif ''rouge'' est placé après le nom ''manteau'', et non avant.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur typique : le groupe nominal commence toujours par le déterminant ''un''.'
  - si:
      contient:
      - o4
    relance: 'C''est une erreur typique : cette analyse oublie l''adjectif ''rouge'' qui complète le nom.'
  solution: 'Déterminant + Nom + Adjectif. C''est juste : ''un'' est le déterminant, ''manteau'' est le nom noyau, et ''rouge''
    est l''adjectif placé après le nom.'
- id: nblm-dans-le-groupe-nominal-une-avocate-remar-3
  type: choix
  difficulte: 2
  enonce: Dans le groupe nominal « une avocate remarquable », quelle est la fonction de l'adjectif « remarquable » ?
  reponse:
    options:
    - id: o1
      texte: Épithète
    - id: o2
      texte: Nom noyau
    - id: o3
      texte: Déterminant
    - id: o4
      texte: Sujet
    bonnes:
    - o1
  indices:
    relance: Pense au terme grammatical désignant un adjectif directement rattaché à un nom.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur typique : ''remarquable'' est un adjectif qui qualifie le nom, ce n''est pas le nom principal.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur typique : le déterminant est l''article ''une'', pas l''adjectif.'
  - si:
      contient:
      - o4
    relance: 'C''est une erreur typique : ''sujet'' est une fonction dans la phrase entière, alors qu''ici on demande la fonction
      de l''adjectif dans le groupe nominal.'
  solution: 'Épithète. C''est juste : l''adjectif ''remarquable'' est directement relié au nom ''avocate'' sans préposition,
    il occupe donc la fonction épithète.'
- id: nblm-de-quels-elements-indispensables-est-con-4
  type: choix
  difficulte: 2
  enonce: De quels éléments indispensables est constitué au minimum un groupe nominal simple ?
  reponse:
    options:
    - id: o1
      texte: Un déterminant et un nom noyau
    - id: o2
      texte: Un nom et un verbe
    - id: o3
      texte: Un adjectif et un verbe
    - id: o4
      texte: Uniquement un adjectif épithète
    bonnes:
    - o1
  indices:
    relance: Pense aux deux éléments de base que l'on retrouve toujours dans un groupe nominal simple.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur typique : le verbe n''appartient pas au groupe nominal, il forme le groupe verbal dans la
      phrase.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur typique : un groupe nominal ne contient pas obligatoirement de verbe et ne peut se réduire
      à un adjectif.'
  - si:
      contient:
      - o4
    relance: 'C''est une erreur typique : un adjectif ne peut pas exister seul sans le nom qu''il accompagne.'
  solution: 'Un déterminant et un nom noyau. C''est juste : la structure minimale d''un groupe nominal est composée d''un
    déterminant et d''un nom noyau.'
- id: nblm-dans-le-groupe-nominal-le-petit-chat-noi-5
  type: choix
  difficulte: 2
  enonce: Dans le groupe nominal « le petit chat noir », quels mots ont la fonction d'adjectif épithète ?
  reponse:
    options:
    - id: o1
      texte: petit et noir
    - id: o2
      texte: le et petit
    - id: o3
      texte: chat
    - id: o4
      texte: uniquement petit
    bonnes:
    - o1
  indices:
    relance: Cherche tous les mots qui apportent des précisions directement au nom noyau.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'C''est une erreur typique : ''le'' est un déterminant et non un adjectif épithète.'
  - si:
      contient:
      - o3
    relance: 'C''est une erreur typique : ''chat'' est le nom noyau autour duquel s''organise le groupe.'
  - si:
      contient:
      - o4
    relance: 'C''est une erreur typique : c''est un oubli, car l''adjectif ''noir'' placé après le nom est aussi une épithète.'
  solution: 'petit et noir. C''est juste : ''petit'' (placé avant) et ''noir'' (placé après) sont tous les deux des adjectifs
    directement reliés au nom ''chat''.'
- id: nblm-dans-le-groupe-nominal-le-grand-chien-qu-6
  type: choix
  difficulte: 3
  enonce: Dans le groupe nominal « le grand chien », quelles sont les deux analyses correctes ? (2 réponses) (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: « chien » est le nom noyau.
    - id: o2
      texte: « grand » est un adjectif épithète.
    - id: o3
      texte: « le » est un adjectif épithète.
    - id: o4
      texte: « grand » est le nom noyau.
    bonnes:
    - o1
    - o2
  indices:
    relance: Identifie la nature du nom principal et la fonction de l'adjectif qui l'accompagne.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est une erreur typique : ''le'' est un déterminant (article défini), pas un adjectif.'
  - si:
      contient:
      - o4
    relance: 'C''est une erreur typique : ''grand'' est un adjectif qualificatif, pas le nom principal.'
  solution: '« chien » est le nom noyau ; « grand » est un adjectif épithète. C''est juste : ''chien'' est le nom principal
    qui donne son sens au groupe nominal.'
- id: nblm-comment-appelle-t-on-le-nom-principal-au-7
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on le nom principal autour duquel s'organise un groupe nominal ?
  reponse:
    acceptees:
    - nom noyau
    fautes_tolerees: 1
  indices:
    relance: Il s'agit d'une expression en deux mots désignant le nom central du groupe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'nom noyau. C''est juste : le nom noyau est le mot central et essentiel du groupe nominal.'
- id: nblm-quelle-est-la-fonction-d-un-adjectif-dir-8
  type: texte_court
  difficulte: 1
  enonce: Quelle est la fonction d'un adjectif directement relié au nom sans préposition ?
  reponse:
    acceptees:
    - épithète
    fautes_tolerees: 1
  indices:
    relance: Ce mot commence par la lettre 'é' et désigne cette fonction de l'adjectif.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'épithète. C''est juste : l''adjectif directement rattaché au nom dans le groupe nominal est une épithète.'
