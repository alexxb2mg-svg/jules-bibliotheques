  difficulte: 2
  enonce: Relie chaque groupe de lettres (dans le mot entre parenthèses) au son qu'il fait.
  reponse:
    gauche:
    - id: ph
      texte: ph (photo)
    - id: eau
      texte: eau (bateau)
    - id: ein
      texte: ein (peinture)
    - id: tion
      texte: tion (addition)
    droite:
    - id: son-f
      texte: se lit comme f
    - id: son-o
      texte: se lit comme o
    - id: son-in
      texte: se lit comme in
    - id: son-sion
      texte: se lit comme sion
    paires:
      ph: son-f
      eau: son-o
      ein: son-in
      tion: son-sion
  indices:
    relance: Dis chaque mot entre parenthèses à voix haute et écoute le son du groupe de lettres.
    methode: Un graphème complexe est un groupe de plusieurs lettres qui ne fait qu'un seul son.
    etape: Commence par le mot qui désigne un bateau et écoute sa fin.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association ne va pas. Redis chaque mot lentement à voix haute.
  - si:
      diagnostic: associations_fausses
    relance: Prends les mots un par un et dis-les à voix haute en écoutant le son du groupe de lettres.
  solution: ph se lit comme f (photo), eau se lit comme o (bateau), ein se lit comme in (peinture), tion se lit comme sion
