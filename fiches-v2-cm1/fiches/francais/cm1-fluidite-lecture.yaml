    - id: b
      texte: 110 mots par minute
    - id: c
      texte: 150 mots par minute
    - id: d
      texte: 200 mots par minute
    bonnes:
    - b
  indices:
    relance: Ce n'est ni un tout petit nombre, ni un très grand nombre.
    methode: Le programme de CM1 fixe un objectif précis. Il est écrit à la fin de la leçon.
    etape: Relis le dernier paragraphe de la leçon, celui qui parle du but en CM1.
  pieges:
  - si:
      contient:
      - a
    relance: 90 mots par minute est un peu en dessous de l'objectif du CM1. Vise un chiffre légèrement plus grand.
  - si:
      contient:
      - c
    relance: 150 mots par minute est trop rapide pour l'objectif du CM1. Cherche un chiffre plus proche de cent.
  - si:
      contient:
      - d
    relance: 200 mots par minute, c'est presque le double de l'objectif du CM1. Cherche un chiffre proche de cent.
  solution: L'objectif en CM1 est de lire correctement environ 110 mots par minute en moyenne.
- id: pause-virgule
  type: choix
  difficulte: 1
  enonce: Quand tu lis à voix haute et que tu rencontres une virgule, que dois-tu faire ?
  reponse:
    options:
    - id: a
      texte: Faire une petite pause
    - id: b
      texte: Continuer sans t'arrêter
    - id: c
      texte: Monter la voix comme pour une question
    - id: d
      texte: Lire plus vite jusqu'au point
    bonnes:
    - a
  indices:
    relance: La ponctuation sert à découper la phrase pour qu'on la comprenne. Que fait la voix à cet endroit ?
    methode: Chaque signe de ponctuation se fait entendre ; la virgule demande moins de temps d'arrêt que le point.
    etape: Au point, on s'arrête un peu plus longtemps qu'à la virgule.
  pieges:
  - si:
      contient:
      - b
    relance: Sans arrêt, la phrase devient difficile à comprendre pour ceux qui écoutent. La virgule est un signal.
  - si:
      contient:
      - c
    relance: On monte la voix pour une question, au point d'interrogation. La virgule demande autre chose.
  - si:
      contient:
      - d
    relance: Accélérer rend la lecture difficile à suivre. La virgule demande au contraire de ralentir un instant.
  solution: 'À la virgule, on fait une petite pause : elle aide à comprendre et à se faire comprendre.'
- id: mot-irregulier
  type: choix
  difficulte: 2
  enonce: Lequel de ces mots est un mot fréquent mais irrégulier, dont l'écriture ne se prononce pas comme on l'attend ?
  reponse:
    options:
    - id: a
      texte: journal
    - id: b
      texte: oignon
    - id: c
      texte: table
    - id: d
      texte: école
    bonnes:
    - b
  indices:
    relance: 'Regarde bien les lettres de chaque mot : l''un d''eux se prononce différemment de ce que ses lettres laissent
      penser.'
    methode: 'Essaie de prononcer chaque mot lettre par lettre : le mot irrégulier surprend, comme second ou monsieur.'
    etape: Dans le mot cherché, deux lettres écrites au début ne s'entendent pas comme d'habitude.
  pieges:
  - si:
      contient:
      - a
    relance: journal se lit comme il s'écrit, lettre après lettre. Ce n'est pas le mot irrégulier.
  - si:
      contient:
      - c
    relance: table se prononce exactement comme on l'écrit. Cherche un mot qui te surprend à l'oral.
  - si:
      contient:
      - d
    relance: école se lit comme il s'écrit. Cherche un mot qui te surprend à l'oral.
  solution: 'oignon est un mot fréquent irrégulier : sa prononciation ne suit pas simplement ses lettres, comme second, monsieur,
    œufs, femme ou chœur.'
- id: e-qui-se-lit-a
  type: choix
  difficulte: 2
  enonce: Dans lequel de ces mots fréquents la lettre « e » qui suit le f se lit-elle comme un « a » ?
  reponse:
    options:
    - id: a
      texte: femme
    - id: b
      texte: ferme
    - id: c
      texte: fête
    - id: d
      texte: fenêtre
    bonnes:
    - a
  indices:
    relance: Dis chaque mot à voix haute. Dans lequel entends-tu « fa » au début ?
    methode: Un mot irrégulier ne se lit pas comme ses lettres le laissent penser ; il faut le mémoriser.
    etape: Le mot cherché désigne une personne.
  pieges:
  - si:
      contient:
      - b
    relance: Dans ferme, on entend « fèr ». Cherche un mot où l'on entend « fa ».
  - si:
      contient:
      - c
    relance: Dans fête, on entend « fè ». Cherche un mot où l'on entend « fa ».
  - si:
      contient:
      - d
    relance: Dans fenêtre, on entend « fe ». Cherche un mot où l'on entend « fa ».
  solution: 'Dans femme, le e se lit comme un a : c''est un mot fréquent irrégulier à mémoriser.'
- id: graphemes-complexes
