    fautes_tolerees: 1
  indices:
    relance: Pense à l'adjectif qui désigne une lecture faite sans faire de bruit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: silencieuse. C'est exact ! La lecture silencieuse s'effectue dans sa tête, sans émettre de son.
