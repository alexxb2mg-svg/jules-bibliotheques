format: 2
notion: cm1-fluidite-lecture
version: 3
etat: verifiee
declencheurs:
- lire vite
- je bute sur les mots
- je lis trop lentement
- mots par minute
- lecture silencieuse
- je confonds les lettres
- lire une page entière
- chronomètre en lecture
prerequis: []
essentiel: 'Lire avec fluidité, c''est lire un texte sans effort, sans buter sur les mots. En CM1, tu dois pouvoir lire ainsi
  un texte d''une page, dans ta tête (lecture silencieuse) ou à voix haute.


  Pour bien lire à voix haute un texte court, il faut d''abord le préparer. On le lit une première fois en silence, on repère
  les mots difficiles, on cherche leur sens, puis on s''entraîne à les dire.


  Il ne faut pas confondre les graphèmes, c''est-à-dire les lettres ou groupes de lettres qui font un son. Certains sont complexes
  : « ph » se lit comme f (photo), « eau » se lit comme o (bateau), « ein » se lit comme in (peinture), « tion » se lit souvent
  comme sion (addition).


  Il faut aussi reconnaître très vite des mots fréquents mais irréguliers, qui ne se lisent pas comme on l''attend : second,
  monsieur, oignon, œufs, femme ou chœur. Plus tu en mémorises, plus ta lecture devient facile.


  Une bonne lecture à voix haute tient compte de la ponctuation. On fait une petite pause à la virgule, une pause plus longue
  au point. On fait entendre la question au point d''interrogation. Ces pauses aident à comprendre et à se faire comprendre.


  Le but en CM1 est de lire correctement environ 110 mots par minute en moyenne. Lire vite ne suffit pas : il faut lire juste,
  sans sauter ni deviner de mots.

  '
methode:
- Lire le texte une première fois dans sa tête pour repérer les mots difficiles.
- Chercher le sens des mots inconnus ou demander de l'aide.
- S'entraîner à lire les mots difficiles à voix haute, seul, en regardant bien toutes leurs lettres.
- Repérer la ponctuation (virgules, points, points d'interrogation) pour savoir où faire les pauses.
- Relire le texte à voix haute en marquant les pauses aux virgules et aux points.
vocabulaire:
- terme: fluidité
  definition: la capacité à lire un texte sans effort, sans buter sur les mots
- terme: mot irrégulier
  definition: un mot fréquent dont l'écriture ne se prononce pas comme on l'attend, par exemple oignon
- terme: lecture silencieuse
  definition: lire un texte dans sa tête, sans le dire à voix haute
- terme: graphème
  definition: une lettre ou un groupe de lettres qui écrit un son, comme « ch » ou « eau »
- terme: ponctuation
  definition: les signes comme la virgule, le point ou le point d'interrogation, qui découpent les phrases
erreurs_frequentes:
- Lire sans préparation un texte inconnu à voix haute, ce qui fait buter sur les mots difficiles.
- Ne pas s'arrêter aux points et aux virgules, ce qui rend la lecture difficile à comprendre pour les autres.
- Deviner un mot au lieu de bien regarder toutes ses lettres.
- Lire un graphème complexe lettre par lettre (lire « p-h » au lieu de f dans photo).
- Vouloir lire très vite en oubliant de lire juste.
exemple:
  enonce: 'Prépare puis lis à voix haute : « Le corbeau, honteux et confus, jura, mais un peu tard, qu''on ne l''y prendrait
    plus. »'
  solution: On lit d'abord la phrase en silence pour repérer « honteux », « confus » et « jura ». On remarque le graphème
    « eau » de corbeau, qui se lit o. Puis on la lit à voix haute en marquant une petite pause à chaque virgule et une pause
    plus longue au point, sans buter sur les mots déjà repérés.
