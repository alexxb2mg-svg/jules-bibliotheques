  enonce: En classe de CM1, l'objectif moyen de fluidité est de lire correctement environ 110 _____ par minute.
  reponse:
    acceptees:
    - mots
    fautes_tolerees: 1
  indices:
    relance: Pense au terme qui désigne les unités que l'on compte pour mesurer la vitesse de lecture.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: mots. Bravo ! La vitesse de lecture se mesure en nombre de mots par minute (MPM).
