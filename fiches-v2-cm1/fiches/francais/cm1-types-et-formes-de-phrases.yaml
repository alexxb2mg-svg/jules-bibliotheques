    - id: o2
      texte: La forme exclamative
    - id: o3
      texte: Le type déclaratif
    - id: o4
      texte: Le type impératif
    bonnes:
    - o1
    - o2
  indices:
    relance: Deux choix désignent des caractéristiques (formes) et deux autres désignent des types.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur classique : le déclaratif est un type de phrase (pour donner une information), non une forme.'
  - si:
      contient:
      - o4
    relance: 'Erreur classique : l''impératif est un type de phrase (pour donner un ordre), non une forme.'
  solution: La forme négative ; La forme exclamative. La négation est une forme de phrase qui s'associe à un type.
- id: nblm-quel-type-de-phrase-est-utilise-pour-pos-7
  type: texte_court
  difficulte: 1
  enonce: Quel type de phrase est utilisé pour poser une question ?
  reponse:
    acceptees:
    - type interrogatif
    fautes_tolerees: 1
  indices:
    relance: C'est l'adjectif qualificatif formé à partir du mot interrogation.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
