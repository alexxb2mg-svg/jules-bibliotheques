format: 2
notion: cm1-types-et-formes-de-phrases
version: 3
etat: verifiee
declencheurs:
- phrase interrogative
- phrase exclamative
- point d'interrogation
- type de phrase
- phrase négative
- poser une question à l'écrit
- transformer une phrase
- phrase qui donne un ordre
- poser une question avec est-ce que
- ne pas dans une phrase
prerequis: []
essentiel: 'Une phrase a un type, et elle peut aussi avoir une forme particulière. Il existe trois types de phrases ; chaque
  type sert à quelque chose de différent.


  Le type déclaratif sert à raconter ou à donner une information : « Le facteur distribue le courrier. » Le type interrogatif
  sert à poser une question ; la phrase se termine par un point d''interrogation : « Où est mon cartable ? » Le type impératif
  (on dit aussi injonctif) sert à donner un ordre, un conseil ou une consigne : « Ouvrez la fenêtre. » Le sujet n''y est pas
  exprimé.


  On peut poser une même question de plusieurs façons. À l''oral, il suffit souvent de faire monter la voix : « Tu viens ?
  » On peut ajouter « est-ce que » : « Est-ce que tu viens ? » On peut inverser le sujet et le verbe, reliés par un trait
  d''union : « Viens-tu ? » On peut aussi utiliser un mot interrogatif comme qui, quand, où, pourquoi. À l''écrit, on n''oublie
  jamais le point d''interrogation.


  En plus de son type, une phrase peut être de forme négative. Elle dit alors le contraire de la phrase affirmative, avec
  deux mots qui entourent le verbe conjugué : ne... pas, ne... jamais, ne... plus. « Il pleut. » devient « Il ne pleut pas.
  »


  Une phrase peut aussi être de forme exclamative : elle marque une émotion forte (joie, surprise, peur, colère) et se termine
  par un point d''exclamation : « Quelle belle journée ! »


  On peut transformer une phrase d''un type à un autre, ou d''une forme à une autre. Dans un texte, ces choix ont un effet
  : une question attire l''attention, une exclamation fait entendre l''émotion d''un personnage, un ordre fait agir.

  '
methode:
- 'Repérer si la phrase donne une information, pose une question ou donne un ordre : c''est le type.'
- 'Vérifier si la phrase porte en plus une négation (ne...pas) ou une forte émotion : c''est la forme.'
- Pour transformer une phrase en question, essayer l'inversion du sujet ou « est-ce que ».
- Pour transformer une phrase à la forme négative, ajouter ne...pas autour du verbe.
- 'Vérifier la ponctuation finale : point, point d''interrogation ou point d''exclamation.'
vocabulaire:
- terme: type de phrase
  definition: 'déclaratif, interrogatif ou impératif : ce que fait la phrase (informer, questionner, ordonner)'
- terme: forme de phrase
  definition: 'négative ou exclamative : une caractéristique qui s''ajoute au type de la phrase'
- terme: phrase déclarative
  definition: une phrase qui raconte ou donne une information, terminée le plus souvent par un point
- terme: phrase interrogative
  definition: une phrase qui pose une question, terminée par un point d'interrogation
- terme: phrase impérative
  definition: une phrase qui donne un ordre, un conseil ou une consigne, sans sujet exprimé ; on dit aussi injonctive
- terme: inversion du sujet
  definition: placer le sujet après le verbe pour poser une question, comme dans « Viens-tu ? »
erreurs_frequentes:
- Confondre le type et la forme d'une phrase (croire que « négative » est un type de phrase).
- Oublier d'inverser le sujet et le verbe pour transformer une phrase déclarative en question.
- Mettre un point d'interrogation à une question indirecte (Je te demande si tu viens.) alors qu'elle n'en prend pas.
- Oublier le « ne » à l'écrit dans une phrase négative (« Il pleut pas » au lieu de « Il ne pleut pas »).
- Oublier le trait d'union entre le verbe et le sujet inversé (« Viens tu » au lieu de « Viens-tu »).
exemple:
  enonce: Transforme la phrase « Tu manges ta soupe. » en phrase de type interrogatif, de trois façons différentes.
  solution: 'Avec l''intonation (à l''oral) : « Tu manges ta soupe ? ». Avec « est-ce que » : « Est-ce que tu manges ta soupe
    ? ». Avec l''inversion du sujet : « Manges-tu ta soupe ? » (le verbe passe avant le sujet, relié par un trait d''union).
    Dans les trois cas, on écrit un point d''interrogation à la fin.'
exercices:
- id: type-ordre
  type: choix
  difficulte: 1
  enonce: Quel est le type de la phrase « Ouvrez la fenêtre ! » ?
  reponse:
    options:
    - id: a
      texte: déclaratif
    - id: b
      texte: interrogatif
    - id: c
      texte: impératif
    bonnes:
    - c
  indices:
    relance: Cette phrase donne-t-elle une information, pose-t-elle une question, ou donne-t-elle un ordre ?
    methode: Un des trois types sert à donner un ordre ou une consigne, sans sujet exprimé.
    etape: 'Le verbe « Ouvrez » n''a pas de sujet exprimé : cela donne un ordre.'
  pieges:
  - si:
      contient:
      - a
    relance: Une phrase déclarative donne une information, elle ne donne pas d'ordre. Relis la phrase.
  - si:
      contient:
      - b
    relance: Il n'y a pas de point d'interrogation ni de question posée ici.
  solution: 'Type impératif : la phrase donne un ordre, avec le verbe à l''impératif et un point d''exclamation pour la forme.'
- id: choix-forme
  type: choix
  difficulte: 1
  enonce: La phrase « Quelle belle journée ! » est de quelle forme, en plus de son type déclaratif ?
  reponse:
    options:
    - id: a
      texte: négative
    - id: b
      texte: exclamative
    - id: c
      texte: interrogative
    bonnes:
    - b
  indices:
    relance: Cette phrase exprime-t-elle une émotion forte ?
    methode: Une des formes de phrase marque une émotion forte, souvent avec une ponctuation particulière à la fin.
    etape: La ponctuation à la fin de cette phrase n'est pas un simple point.
  pieges:
  - si:
      contient:
      - a
    relance: Il n'y a ni « ne » ni « pas » dans cette phrase. Regarde plutôt le signe à la fin.
  - si:
      contient:
      - c
    relance: Il n'y a pas de point d'interrogation ni de question posée dans cette phrase.
  solution: 'Forme exclamative : elle exprime une émotion forte, marquée par le point d''exclamation.'
- id: association-types
  type: association
  difficulte: 1
  enonce: Relie chaque phrase à son type.
  reponse:
    gauche:
    - id: a
      texte: Le chat dort sur le canapé.
    - id: b
      texte: Où habites-tu ?
    - id: c
      texte: Range ta chambre.
    droite:
    - id: x
      texte: déclaratif
    - id: y
      texte: interrogatif
    - id: z
      texte: impératif
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: 'Repère la ponctuation et le sens de chaque phrase : information, question ou ordre.'
    methode: Le point simple accompagne souvent le déclaratif, le point d'interrogation l'interrogatif, l'absence de sujet
      exprimé l'impératif.
    etape: Commence par la phrase qui se termine par un point d'interrogation, puis cherche celle qui n'a pas de sujet.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie la ponctuation de chaque phrase.
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque phrase et demande-toi si elle informe, pose une question ou donne un ordre.
  solution: a-déclaratif (information), b-interrogatif (question, point d'interrogation), c-impératif (ordre, pas de sujet
    exprimé).
- id: transformation-interrogative
  type: texte_court
  difficulte: 2
  enonce: Transforme la phrase « Tu as fini tes devoirs. » en question avec « est-ce que ».
  reponse:
    acceptees:
    - Est-ce que tu as fini tes devoirs ?
    fautes_tolerees: 2
  indices:
    relance: Place « est-ce que » en tête de phrase.
    methode: Ajouter « est-ce que » devant une phrase déclarative permet de la transformer en question sans inverser le sujet.
    etape: Garde la phrase telle quelle et ajoute « Est-ce que » devant, puis le point d'interrogation.
  pieges:
  - si:
      valeur: As-tu fini tes devoirs ?
    relance: C'est une transformation correcte, mais avec inversion du sujet. Ici, utilise plutôt « est-ce que ».
  solution: Est-ce que tu as fini tes devoirs ?
- id: interrogation-inversion
  type: texte_court
  difficulte: 2
  enonce: Transforme « Tu viens à la fête. » en phrase interrogative en utilisant l'inversion du sujet.
  reponse:
    acceptees:
    - Viens-tu à la fête ?
    - viens-tu à la fête
    fautes_tolerees: 0
  indices:
    relance: Dans l'inversion du sujet, on change l'ordre entre le verbe et le pronom sujet.
    methode: Place le verbe en premier, relie-le au sujet par un trait d'union, puis termine par un point d'interrogation.
    etape: Le verbe est « viens » et le sujet est « tu ».
  pieges:
  - si:
      valeur: Est-ce que tu viens à la fête ?
    relance: Cette question est juste mais elle utilise « est-ce que ». La consigne demande l'inversion du sujet.
  solution: Viens-tu à la fête ? (le verbe passe avant le sujet, relié par un trait d'union).
- id: transformer-negative
  type: texte_court
  difficulte: 2
  enonce: Transforme la phrase « Il pleut ce matin. » à la forme négative avec ne... pas.
  reponse:
    acceptees:
    - Il ne pleut pas ce matin.
    - il ne pleut pas ce matin
    fautes_tolerees: 0
  indices:
    relance: À la forme négative, deux petits mots entourent le verbe conjugué.
    methode: Repère le verbe conjugué, puis place la négation de part et d'autre de ce verbe.
    etape: Le verbe conjugué est « pleut ».
  pieges:
  - si:
      valeur: Il pleut pas ce matin.
    relance: À l'écrit, la négation a besoin de deux mots, pas d'un seul. Il manque quelque chose avant le verbe.
  solution: Il ne pleut pas ce matin. (on encadre le verbe « pleut » avec « ne » et « pas »).
- id: type-et-forme
  type: texte_court
  difficulte: 3
  enonce: Donne le type et la forme de la phrase « Ne mange pas ce fruit ! »
  reponse:
    acceptees:
    - impératif, négative et exclamative
    - type impératif, forme négative et exclamative
    - impératif, négative, exclamative
    - impérative, négative et exclamative
    - type impératif, formes négative et exclamative
    fautes_tolerees: 2
  indices:
    relance: Cherche d'abord si c'est un ordre, une question ou une information, puis s'il y a une négation ou une émotion
      forte.
    methode: Le type dépend de l'intention (informer, questionner, ordonner) ; la forme s'ajoute (négative, exclamative).
    etape: « Ne...pas » indique une forme, le point d'exclamation en indique une autre.
  pieges:
  - si:
      valeur: déclaratif
    relance: Cette phrase donne-t-elle un ordre ? Regarde le verbe « mange » sans sujet exprimé.
  solution: 'Type impératif, forme négative et exclamative : la phrase donne un ordre (mange à l''impératif), avec la négation
    ne...pas et le point d''exclamation.'
- id: effet-dans-texte
  type: choix
  difficulte: 3
  enonce: 'Dans un conte, le héros découvre un trésor et s''écrie : « Que c''est magnifique ! » Quel est l''effet de cette
    phrase exclamative dans le texte ?'
  reponse:
    options:
    - id: a
      texte: Elle montre l'émotion du personnage, ici son émerveillement
    - id: b
      texte: Elle pose une question au lecteur
    - id: c
      texte: Elle donne un ordre à un autre personnage
    - id: d
      texte: Elle dit le contraire de ce qui se passe
    bonnes:
    - a
  indices:
    relance: Que ressent le héros au moment où il découvre le trésor ?
    methode: Dans un texte, la forme exclamative sert à faire entendre une émotion forte.
    etape: Le point d'exclamation montre ici la joie et l'admiration du personnage.
  pieges:
  - si:
      contient:
      - b
    relance: Il n'y a pas de point d'interrogation, le personnage n'attend pas de réponse.
  - si:
      contient:
      - c
    relance: Le personnage ne demande à personne d'agir. Que ressent-il ?
  - si:
      contient:
      - d
    relance: Dire le contraire, c'est le rôle de la forme négative. Ici, il n'y a pas de ne... pas.
  solution: 'La phrase exclamative montre l''émotion forte du personnage : son émerveillement devant le trésor.'
- id: ouverte-transformation
  type: ouverte
  difficulte: 3
  enonce: Écris une phrase de type déclaratif sur un match de football, puis transforme-la en phrase de type interrogatif
    et en phrase de forme négative.
  criteres:
  - L'élève propose une phrase déclarative correcte.
  - L'élève transforme correctement en phrase interrogative (inversion, est-ce que ou mot interrogatif).
  - L'élève transforme correctement en phrase négative (ne...pas ou une autre négation).
  indices:
    relance: Commence par une phrase simple qui informe sur un match, puis applique les transformations une par une.
    methode: Pour la question, utilise l'inversion ou « est-ce que ». Pour la négation, encadre le verbe par ne...pas.
    etape: 'Exemple de départ : « L''équipe gagne le match. »'
  solution: 'Déclarative : L''équipe gagne le match. Interrogative : Est-ce que l''équipe gagne le match ? Négative : L''équipe
    ne gagne pas le match.'
