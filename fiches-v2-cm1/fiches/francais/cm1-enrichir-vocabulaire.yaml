- id: nblm-dans-quelles-matieres-du-programme-de-cm-5
  type: choix
  difficulte: 2
  enonce: Dans quelles matières du programme de CM1 dois-tu chercher à enrichir ton vocabulaire ?
  reponse:
    options:
    - id: o1
