- id: nblm-quelles-sont-les-deux-methodes-efficaces-6
  type: choix
  difficulte: 3
  enonce: Quelles sont les deux méthodes efficaces pour deviner le sens d'un mot inconnu dans un texte ? (plusieurs réponses
    possibles)
  reponse:
    options:
    - id: o1
      texte: Observer la morphologie du mot (son préfixe, son radical ou son suffixe).
    - id: o2
      texte: S'aider du contexte en lisant attentivement les mots qui entourent le mot inconnu.
    - id: o3
      texte: Effacer le mot avec un effaceur pour ne pas avoir à le lire.
    - id: o4
      texte: Inventer une définition au hasard sans regarder la phrase.
    bonnes:
    - o1
    - o2
  indices:
    relance: L'une des méthodes observe l'intérieur du mot, l'autre observe l'extérieur du mot.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'C''est faux : effacer le mot n''aide pas à apprendre et empêche de comprendre la phrase.'
  - si:
      contient:
      - o4
    relance: 'C''est faux : inventer au hasard sans s''appuyer sur les indices conduit à de mauvaises réponses.'
  solution: 'Observer la morphologie du mot (son préfixe, son radical ou son suffixe) ; S''aider du contexte en lisant attentivement
    les mots qui entourent le mot inconnu. C''est juste : analyser les morceaux qui forment le mot aide à comprendre sa signification.'
- id: nblm-pour-verifier-l-hypothese-que-tu-as-fait-7
  type: texte_court
  difficulte: 1
  enonce: Pour vérifier l'hypothèse que tu as faite sur le sens d'un mot que tu ne connais pas, dans quel outil de référence
    dois-tu chercher ?
  reponse:
    acceptees:
    - le dictionnaire
    fautes_tolerees: 1
  indices:
    relance: C'est un ouvrage où tous les mots sont classés par ordre alphabétique avec leur définition.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
