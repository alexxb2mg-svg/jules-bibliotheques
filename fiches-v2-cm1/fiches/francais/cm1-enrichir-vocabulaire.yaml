    relance: 'C''est une erreur fréquente : on apprend de nouveaux mots spécifiques dans toutes les disciplines.'
  - si:
      contient:
      - o3
    relance: L'apprentissage méthodique du vocabulaire s'effectue en classe dans les différentes leçons.
  - si:
