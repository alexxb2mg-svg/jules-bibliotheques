format: 2
notion: cm1-enrichir-vocabulaire
version: 3
etat: verifiee
declencheurs:
- mot que je connais pas
- c'est quoi ce mot
- chercher dans le dictionnaire
- mot inconnu dans un texte
- sens d'un mot selon le contexte
- préfixe et suffixe
- famille de mots
- un mot qui a plusieurs sens
prerequis: []
essentiel: 'Enrichir son vocabulaire, c''est apprendre de nouveaux mots dans toutes les matières : en sciences (évaporation),
  en histoire (château fort), en mathématiques (périmètre), pas seulement en français.


  Un même mot peut avoir plusieurs sens. Le mot « vue » sert dans « une belle vue » (un paysage), « avoir une bonne vue »
  (la capacité de voir) et « un point de vue » (une opinion). C''est la phrase qui dit quel sens choisir.


  Quand tu rencontres un mot inconnu en lisant, tu as deux aides.


  La première aide, c''est la formation du mot. Beaucoup de mots sont construits avec des morceaux. Le radical porte le sens
  principal. Le préfixe se place devant et change le sens : « re- » veut souvent dire « à nouveau » (relire), « dé- » ou «
  in- » expriment souvent le contraire (démonter, invisible). Le suffixe se place à la fin : « -eur » désigne souvent celui
  qui fait l''action (un nageur). Les mots construits sur le même radical forment une famille : terre, terrain, enterrer,
  souterrain.


  La deuxième aide, c''est le contexte : les mots et les phrases autour du mot inconnu. Dans « Le marin hissa la voile pour
  que le bateau avance », on devine que « hisser » veut dire monter, lever.


  Ensuite, tu vérifies ton idée dans le dictionnaire. Les mots y sont rangés dans l''ordre alphabétique. Quand un mot a plusieurs
  sens, chaque sens est numéroté : tu choisis celui qui va avec ta phrase.


  Enfin, pour garder un mot, il faut le réemployer : à l''oral, dans tes écrits, dans d''autres matières.

  '
methode:
- Repérer le mot inconnu dans la phrase que tu lis.
- Observer les morceaux du mot (préfixe, radical, suffixe) pour voir s'ils t'aident à deviner le sens.
- Chercher un mot de la même famille que tu connais déjà.
- Regarder les mots autour de lui (le contexte) pour deviner de quoi on parle.
- Vérifier ton hypothèse dans le dictionnaire et choisir le sens qui va avec la phrase.
- Réutiliser le mot appris plus tard pour te l'approprier durablement.
vocabulaire:
- terme: contexte
  definition: les mots et phrases autour d'un mot, qui aident à comprendre son sens
- terme: morphologie
  definition: la façon dont un mot est formé, à partir de plus petits morceaux de sens
- terme: radical
  definition: la partie du mot qui porte son sens principal (terr- dans terrain, enterrer)
- terme: préfixe
  definition: un morceau placé devant le radical, qui change le sens du mot (re- dans relire)
- terme: suffixe
  definition: un morceau placé à la fin du mot, qui forme un nouveau mot (-eur dans nageur)
- terme: famille de mots
  definition: les mots formés sur le même radical, qui ont un sens proche
- terme: polysémie
  definition: le fait qu'un même mot ait plusieurs sens selon la phrase
erreurs_frequentes:
- Sauter un mot inconnu sans essayer de deviner son sens.
- Ne pas vérifier son hypothèse dans le dictionnaire quand on n'est pas sûr.
- Oublier qu'un même mot peut avoir plusieurs sens selon la phrase où il apparaît.
- Prendre le premier sens du dictionnaire sans vérifier qu'il va avec la phrase.
exemple:
  enonce: 'Le mot « vue » apparaît dans ces phrases : « une belle vue », « avoir une bonne vue », « un point de vue ». Explique
    en une phrase pourquoi c''est le même mot mais pas le même sens.'
  solution: 'C''est le même mot « vue », mais son sens change selon la phrase : le paysage qu''on voit, la capacité de voir,
    ou une opinion.'
exercices:
- id: que-faire-mot-inconnu
  type: choix
  difficulte: 1
  enonce: Tu rencontres un mot inconnu en lisant un texte. Que fais-tu en priorité ?
  reponse:
    options:
    - id: a
      texte: Observer les morceaux du mot et le contexte pour deviner son sens
    - id: b
      texte: Sauter le mot sans chercher à comprendre
    - id: c
      texte: Arrêter complètement ta lecture
    bonnes:
    - a
  indices:
    relance: Pense à ce qui permet de continuer à comprendre le texte malgré un mot inconnu.
    methode: Élimine les options qui empêchent de progresser dans la compréhension.
    etape: La méthode conseille d'observer la formation du mot et les mots autour de lui.
  pieges:
  - si:
      contient:
      - b
    relance: Sauter le mot sans chercher à comprendre risque de faire perdre le sens général du texte.
  - si:
      contient:
      - c
    relance: 'Il n''est pas nécessaire d''arrêter sa lecture : on peut chercher à deviner le sens du mot.'
  solution: Il faut observer les morceaux du mot et le contexte (les mots autour) pour deviner son sens, puis vérifier au
    besoin dans le dictionnaire.
- id: definir-contexte
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on les mots et phrases autour d'un mot, qui aident à comprendre son sens ?
  reponse:
    acceptees:
    - le contexte
    - contexte
    fautes_tolerees: 1
  indices:
    relance: Ce mot est utilisé dans la méthode pour désigner ce qui entoure un mot inconnu.
    methode: Relis la partie de la leçon qui parle de la deuxième aide pour comprendre un mot inconnu.
    etape: Ce mot est aussi utilisé pour dire « la situation dans laquelle un mot est employé ».
  pieges:
  - si:
      valeur: la morphologie
    relance: La morphologie parle de la formation du mot lui-même, pas des mots qui l'entourent.
  solution: 'On appelle cela le contexte : les mots et phrases autour d''un mot, qui aident à comprendre son sens.'
- id: definir-morphologie
  type: choix
  difficulte: 1
  enonce: Que désigne la « morphologie » d'un mot ?
  reponse:
    options:
    - id: a
      texte: La façon dont un mot est formé, à partir de plus petits morceaux de sens
    - id: b
      texte: Les mots qui entourent un mot dans une phrase
    - id: c
      texte: La définition d'un mot dans le dictionnaire
    bonnes:
    - a
  indices:
    relance: 'Pense aux morceaux qui composent un mot : préfixe, radical, suffixe.'
    methode: Élimine l'option qui décrit le contexte, et celle qui décrit une définition de dictionnaire.
    etape: La morphologie concerne la formation interne du mot, pas ce qui l'entoure.
  pieges:
  - si:
      contient:
      - b
    relance: Ce que tu décris là, c'est le contexte, pas la morphologie.
  - si:
      contient:
      - c
    relance: 'La définition dans le dictionnaire n''est pas la morphologie : elle donne le sens, pas la formation du mot.'
  solution: La morphologie est la façon dont un mot est formé, à partir de plus petits morceaux de sens (comme des préfixes
    ou des suffixes).
- id: prefixe-re
  type: choix
  difficulte: 1
  enonce: Dans les mots relire, refaire et repeindre, que veut dire le morceau « re- » ?
  reponse:
    options:
    - id: a
      texte: à nouveau
    - id: b
      texte: le contraire
    - id: c
      texte: celui qui fait l'action
    bonnes:
    - a
  indices:
    relance: Si tu relis une histoire, c'est la première fois que tu la lis ?
    methode: Compare chaque mot avec le mot sans « re- » (lire, faire, peindre). Qu'est-ce que le préfixe ajoute ?
    etape: Repeindre un mur, c'est le peindre encore une fois.
  pieges:
  - si:
      contient:
      - b
    relance: Le contraire de lire, ce n'est pas relire. Relis l'exemple du mur repeint.
  - si:
      contient:
      - c
    relance: Ce sens-là est celui du suffixe -eur, placé à la fin du mot (un lecteur). Ici, le morceau est placé devant.
  solution: '« re- » veut dire « à nouveau » : relire, c''est lire encore une fois ; refaire, faire encore une fois.'
- id: sens-par-contexte
  type: choix
  difficulte: 2
  enonce: '« Après la longue marche, Tom était exténué : il s''endormit tout de suite. » Que veut dire « exténué » ?'
  reponse:
    options:
    - id: a
      texte: très fatigué
    - id: b
      texte: très content
    - id: c
      texte: très en colère
    bonnes:
    - a
  indices:
    relance: Que s'est-il passé avant, et que fait Tom juste après ?
    methode: Utilise le contexte. Les mots autour d'« exténué » expliquent dans quel état Tom se trouve.
    etape: Une longue marche, puis il s'endort tout de suite. Qu'est-ce que cela dit de son état ?
  pieges:
  - si:
      contient:
      - b
    relance: Être content n'explique pas pourquoi il s'endort tout de suite. Regarde ce qu'il vient de faire.
  - si:
      contient:
      - c
    relance: Rien dans la phrase ne parle de colère. Relis ce qu'il a fait avant de s'endormir.
  solution: '« exténué » veut dire très fatigué : on le devine grâce au contexte (une longue marche, puis il s''endort tout
    de suite). On peut le vérifier dans le dictionnaire.'
- id: mot-et-matiere
  type: association
  difficulte: 2
  enonce: Relie chaque mot nouveau à la matière où tu l'as sans doute rencontré.
  reponse:
    gauche:
    - id: a
      texte: évaporation
    - id: b
      texte: périmètre
    - id: c
      texte: château fort
    droite:
    - id: x
      texte: sciences
    - id: y
      texte: mathématiques
    - id: z
      texte: histoire
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Lequel de ces mots parle de l'eau qui se transforme ?
    methode: 'Pour chaque mot, pense à une leçon où tu l''as entendu : une expérience, une mesure, une époque.'
    etape: Le mot qui sert à mesurer le tour d'une figure va avec une matière où l'on calcule.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Repère le mot qui parle du Moyen Âge.
  - si:
      diagnostic: associations_fausses
    relance: Commence par le mot qui désigne le tour d'une figure, puis place les deux autres.
  solution: évaporation-sciences (l'eau qui devient vapeur), périmètre-mathématiques (le tour d'une figure), château fort-histoire
    (le Moyen Âge).
- id: polysemie-vue
  type: ouverte
  difficulte: 2
  enonce: 'Le mot « vue » apparaît dans ces phrases : « une belle vue », « avoir une bonne vue », « un point de vue ». Explique
    en une phrase pourquoi c''est le même mot mais pas le même sens.'
  criteres:
  - L'élève identifie que c'est le même mot dans les trois phrases.
  - L'élève explique que le sens change selon la phrase (paysage, capacité de voir, opinion).
  - L'élève dit que ce sont les mots autour (le contexte) qui permettent de choisir le bon sens.
  indices:
    relance: 'Pense à ce que veut dire « vue » dans chaque phrase : est-ce toujours la même idée ?'
    methode: 'Compare le sens de « vue » dans chaque exemple : un paysage, une capacité, une opinion.'
    etape: Un mot qui change de sens selon la phrase où il apparaît est un mot polysémique.
  solution: 'C''est le même mot « vue », mais son sens change selon la phrase : le paysage qu''on voit, la capacité de voir,
    ou une opinion.'
- id: deviner-mot-inconnu
  type: ouverte
  difficulte: 2
  enonce: Trouve un mot inconnu dans un livre ou un texte que tu lis. Essaie de deviner son sens grâce au contexte, puis vérifie
    dans le dictionnaire.
  criteres:
  - L'élève propose un sens plausible avant de vérifier dans le dictionnaire.
  - L'élève compare son hypothèse avec la définition trouvée et la corrige si besoin.
  - L'élève réemploie le mot dans une phrase à lui.
  indices:
    relance: Relis la phrase entière et la phrase d'avant.
    methode: Compare ton hypothèse avec la définition trouvée dans le dictionnaire.
    etape: Si ton hypothèse est fausse, note pourquoi le contexte t'a trompé.
  solution: Réussite si tu proposes un sens plausible avant de vérifier, et si tu corriges ton hypothèse si besoin.
- id: trois-sens-tete
  type: ouverte
  difficulte: 3
  enonce: 'Cite trois façons différentes d''utiliser le mot « tête » (par exemple : « avoir mal à la tête », « la tête d''un
    cortège », ...).'
  criteres:
  - L'élève propose trois emplois différents du mot « tête ».
  - Les trois emplois correspondent à des sens réellement différents (corps, direction, position).
  - L'élève écrit chaque emploi dans une phrase ou une expression complète.
  indices:
    relance: Pense au corps, mais aussi à d'autres domaines (un groupe, un classement).
    methode: Cherche des expressions différentes utilisant « tête » dans des contextes variés.
    etape: Un des sens concerne la partie du corps, un autre concerne quelqu'un qui dirige, un autre le début d'une file.
  solution: 'Réussite avec trois emplois différents du mot « tête », par exemple : partie du corps, personne qui dirige, début
    d''une file.'
