    - id: o2
      texte: Se cacher / Se dissimuler
    - id: o3
      texte: Chaud / Froid
    - id: o4
      texte: Grand / Petit
    bonnes:
    - o1
    - o2
  indices:
    relance: Sélectionne les deux paires où un mot peut en remplacer un autre pour dire la même chose.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: 'Erreur typique : « chaud » et « froid » sont des mots contraires (antonymes).'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : « grand » et « petit » sont des antonymes, pas des synonymes.'
  solution: 'Jouer / S''amuser ; Se cacher / Se dissimuler. C''est juste : ce sont deux verbes synonymes de sens proche.'
- id: nblm-quel-terme-designe-un-mot-de-sens-contra-7
  type: texte_court
  difficulte: 1
  enonce: Quel terme désigne un mot de sens contraire par rapport à un autre mot ?
  reponse:
