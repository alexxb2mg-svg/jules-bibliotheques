- id: nblm-comment-appelle-t-on-la-base-ou-l-origin-8
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la base ou l'origine commune partagée par les mots d'une même famille de mots ?
  reponse:
    acceptees:
    - Racine
    fautes_tolerees: 1
  indices:
    relance: C'est le noyau commun qui donne son sens fondamental à la famille de mots.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: 'Racine. C''est exact : la racine (ou le radical) est la partie commune des mots d''une même famille.'
