format: 2
notion: cm1-relations-entre-mots
version: 2
etat: verifiee
declencheurs:
- synonyme d'un mot
- antonyme d'un mot
- mot contraire
- même famille de mots
- mot qui veut dire pareil
- un mot pour un autre
- le contraire de
- remplacer un mot répété
prerequis: []
essentiel: 'Les mots ne vivent pas seuls : ils sont reliés entre eux. Ils peuvent se ressembler par leur forme (on parle de
  relations morphologiques) ou par leur sens (on parle de relations sémantiques).


  Des mots de la même famille se ressemblent parce qu''ils sont construits sur la même base, le radical. Jardin, jardinier,
  jardinage et jardiner ont le même radical. On peut ajouter un morceau devant le radical, un préfixe (faire, défaire), ou
  derrière, un suffixe (jardin, jardinier). Certaines familles sont plus cachées : cœur, cardiaque, cordial parlent tous du
  cœur.


  Deux mots sont des synonymes quand leurs sens sont proches et qu''on peut parfois les remplacer l''un par l''autre : jouer
  et s''amuser, se cacher et se dissimuler, commencer et débuter. Les synonymes servent à éviter de répéter un mot dans un
  texte.


  Attention, un synonyme ne convient pas toujours : il dépend de la phrase. On peut dire « un grand arbre » ou « un immense
  arbre », mais pour « mon grand frère », immense ne veut plus dire la même chose.


  Deux mots sont des antonymes quand ils ont des sens contraires : chaud et froid, monter et descendre. Parfois, l''antonyme
  se fabrique avec un préfixe : possible et impossible, faire et défaire.


  Un synonyme ou un antonyme doit toujours être de la même classe grammaticale que le mot de départ : à un nom correspond
  un nom, à un verbe un verbe, à un adjectif un adjectif.

  '
methode:
- Identifier la classe grammaticale du mot de départ (nom, verbe, adjectif...).
- Chercher un mot de sens proche (synonyme) de la même classe grammaticale.
- Chercher un mot de sens contraire (antonyme) de la même classe grammaticale, en pensant aussi aux préfixes (im-, dé-).
- Pour une famille de mots, repérer le radical commun aux mots.
- Remettre le mot trouvé dans la phrase pour vérifier que le sens convient ; au besoin, vérifier dans un dictionnaire.
vocabulaire:
- terme: synonymie
  definition: relation entre des mots de sens proche, de même classe grammaticale
- terme: antonymie
  definition: relation entre des mots de sens contraire, de même classe grammaticale
- terme: famille de mots
  definition: ensemble de mots ayant en commun une même racine ou un même radical
- terme: radical
  definition: la partie commune aux mots d'une même famille, comme jardin dans jardinier
- terme: préfixe
  definition: un morceau ajouté devant le radical pour former un nouveau mot, comme dé- dans défaire
- terme: suffixe
  definition: un morceau ajouté après le radical pour former un nouveau mot, comme -ier dans jardinier
erreurs_frequentes:
- Proposer un synonyme d'une autre classe grammaticale que le mot de départ (par exemple un adjectif pour un verbe).
- Confondre un mot de la même famille avec un simple synonyme.
- Croire qu'un antonyme est toujours l'exact opposé, alors que certains couples ont des nuances intermédiaires (entre chaud
  et froid, il y a tiède).
- Croire qu'un synonyme convient dans toutes les phrases, sans vérifier le sens.
- Croire que deux mots qui commencent pareil sont forcément de la même famille (lait et laisser n'ont pas le même radical).
exemple:
  enonce: Donne un synonyme et un antonyme du mot « grand » (adjectif), puis un mot de sa famille.
  solution: 'Synonyme possible : immense (adjectif, sens proche). Antonyme possible : petit (adjectif, sens contraire). Mot
    de la même famille : grandir (même radical grand-).'
exercices:
- id: definir-synonymie
  type: choix
  difficulte: 1
  enonce: Que veut dire que deux mots sont des « synonymes » ?
  reponse:
    options:
    - id: a
      texte: Leurs sens sont proches et on peut parfois les remplacer l'un par l'autre
    - id: b
      texte: Ils ont des sens complètement contraires
    - id: c
      texte: Ils partagent la même racine mais des sens très différents
    bonnes:
    - a
  indices:
    relance: Pense à deux mots qu'on pourrait utiliser l'un à la place de l'autre dans une phrase.
    methode: Élimine l'option qui décrit des mots de sens contraires (ce sont des antonymes).
    etape: '« Jouer » et « s''amuser » sont des synonymes : ils ont un sens proche.'
  pieges:
  - si:
      contient:
      - b
    relance: Des mots de sens contraires sont des antonymes, pas des synonymes.
  - si:
      contient:
      - c
    relance: Partager la même racine avec des sens différents décrit plutôt une famille de mots, pas la synonymie.
  solution: Deux mots sont des synonymes quand leurs sens sont proches et qu'on peut parfois les remplacer l'un par l'autre.
- id: antonyme-possible
  type: choix
  difficulte: 1
  enonce: Quel est l'antonyme de l'adjectif « possible » ?
  reponse:
    options:
    - id: a
      texte: impossible
    - id: b
      texte: possiblement
    - id: c
      texte: pouvoir
    - id: d
      texte: facile
    bonnes:
    - a
  indices:
    relance: Cherche un adjectif qui veut dire le contraire, « qui ne peut pas se faire ».
    methode: Un antonyme peut se fabriquer en ajoutant un préfixe devant le mot de départ.
    etape: Le préfixe à ajouter s'écrit avec deux lettres et commence par i.
  pieges:
  - si:
      contient:
      - b
    relance: Possiblement n'est pas un adjectif et ne veut pas dire le contraire. Cherche un adjectif de sens contraire.
  - si:
      contient:
      - c
    relance: Pouvoir est un verbe de la même famille, pas un adjectif de sens contraire.
  - si:
      contient:
      - d
    relance: Facile n'est pas le contraire de possible. Une chose possible peut être difficile.
  solution: 'L''antonyme de possible est impossible : on ajoute le préfixe im- devant le mot.'
- id: meme-classe-grammaticale
  type: choix
  difficulte: 1
  enonce: Quelle règle doit toujours respecter un synonyme ou un antonyme par rapport au mot de départ ?
  reponse:
    options:
    - id: a
      texte: Il doit être de la même classe grammaticale (nom, verbe, adjectif...)
    - id: b
      texte: Il doit commencer par la même lettre
    - id: c
      texte: Il doit avoir le même nombre de syllabes
    bonnes:
    - a
  indices:
    relance: Pense à ce qui doit rester identique entre le mot de départ et son synonyme ou son antonyme.
    methode: Élimine les options qui parlent de la forme du mot (lettre, syllabes) plutôt que de sa nature grammaticale.
    etape: À un verbe correspond un verbe, à un nom correspond un nom.
  pieges:
  - si:
      contient:
      - b
    relance: La première lettre n'a aucun rapport avec la règle de synonymie ou d'antonymie.
  - si:
      contient:
      - c
    relance: Le nombre de syllabes n'a aucun rapport avec la règle de synonymie ou d'antonymie.
  solution: 'Un synonyme ou un antonyme doit toujours respecter la classe grammaticale du mot de départ : à un nom correspond
    un nom, à un verbe correspond un verbe.'
- id: radical-jardin
  type: texte_court
  difficulte: 2
  enonce: Quel est le radical commun aux mots jardinier, jardinage et jardiner ?
  reponse:
    acceptees:
    - jardin
    - le jardin
    fautes_tolerees: 1
  indices:
    relance: Cherche le morceau qui se répète au début des trois mots.
    methode: Le radical, c'est la partie commune ; enlève les fins -ier, -age et -er.
    etape: Ce radical est lui-même un nom, l'endroit où l'on plante des fleurs et des légumes.
  pieges:
  - si:
      valeur: jardinier
    relance: Jardinier est un des mots de la famille. Enlève sa fin -ier pour trouver la partie commune.
  solution: 'Le radical commun est jardin : jardin + ier, jardin + age, jardin + er.'
- id: ranger-familles
  type: association
  difficulte: 2
  enonce: Range ces mots en deux familles selon leur racine.
  reponse:
    gauche:
    - id: a
      texte: cardiaque
    - id: b
      texte: cordial
    - id: c
      texte: national
    - id: d
      texte: international
    droite:
    - id: x
      texte: famille de cœur
    - id: z
      texte: famille de nation
    paires:
      a: x
      b: x
      c: z
      d: z
  indices:
    relance: Cherche le morceau de mot qui revient dans chaque famille.
    methode: Repère la racine commune à chaque groupe de deux mots, puis le mot simple d'où elle vient.
    etape: Deux mots parlent d'un organe du corps, les deux autres d'un pays et de ses habitants.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Reprends chaque mot et cherche sa racine d'origine.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord les mots qui parlent du cœur, puis ceux qui parlent d'un pays ou d'une nation.
  solution: 'Famille de cœur : cardiaque, cordial. Famille de nation : national, international.'
- id: associer-synonymes
  type: association
  difficulte: 2
  enonce: Relie chaque mot à son synonyme.
  reponse:
    gauche:
    - id: cacher
      texte: se cacher
    - id: jouer
      texte: jouer
    - id: commencer
      texte: commencer
    - id: content
      texte: content
    droite:
    - id: dissimuler
      texte: se dissimuler
    - id: amuser
      texte: s'amuser
    - id: debuter
      texte: débuter
    - id: joyeux
      texte: joyeux
    paires:
      cacher: dissimuler
      jouer: amuser
      commencer: debuter
      content: joyeux
  indices:
    relance: Pour chaque mot, cherche à droite un mot de sens proche et de la même classe.
    methode: Remplace le mot de gauche par celui de droite dans une petite phrase ; si le sens reste le même, c'est un synonyme.
    etape: Le seul adjectif de gauche va avec le seul adjectif de droite.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association ne va pas. Essaie chaque paire dans une phrase comme « Les enfants… dans la cour ».
  - si:
      diagnostic: associations_fausses
    relance: Commence par repérer la classe de chaque mot (verbe ou adjectif), puis cherche le sens proche.
  solution: se cacher → se dissimuler, jouer → s'amuser, commencer → débuter, content → joyeux.
- id: antonyme-monter
  type: texte_court
  difficulte: 2
  enonce: Trouve un antonyme du verbe « monter ».
  reponse:
    acceptees:
    - descendre
    fautes_tolerees: 1
  indices:
    relance: 'Le verbe contraire de monter évoque le sens inverse : aller vers le bas.'
    methode: Pense à ce que fait un ascenseur quand il ne monte pas.
    etape: Ce verbe commence par « d ».
  pieges:
  - si:
      valeur: tomber
    relance: « Tomber » évoque une chute involontaire, pas simplement le contraire de « monter ».
  solution: 'Antonyme de monter : descendre.'
- id: synonyme-regarder
  type: texte_court
  difficulte: 2
  enonce: Trouve un synonyme du verbe « regarder ».
  reponse:
    acceptees:
    - observer
    - voir
    - contempler
    - examiner
    fautes_tolerees: 1
  indices:
    relance: Cherche un verbe qui veut dire presque la même chose que « regarder ».
    methode: 'Pense à un scientifique qui étudie quelque chose avec attention : quel verbe utilise-t-il ?'
    etape: Ce verbe commence par « o ».
  pieges:
  - si:
      valeur: écouter
    relance: « Écouter » concerne l'ouïe, pas la vue. Cherche un verbe proche de « regarder ».
  solution: 'Synonyme de regarder : observer (par exemple).'
- id: carte-d-un-mot
  type: ouverte
  difficulte: 3
  enonce: Choisis un mot (par exemple « content »). Donne un synonyme, un antonyme et deux mots de sa famille, puis écris
    une phrase avec l'un de ces mots.
  criteres:
  - Le synonyme et l'antonyme ont un sens juste et sont de la même classe grammaticale que le mot choisi.
  - Les deux mots de la famille ont bien le même radical que le mot choisi.
  - La phrase est correcte et emploie l'un des mots trouvés avec le bon sens.
  indices:
    relance: Commence par dire si ton mot est un nom, un verbe ou un adjectif.
    methode: Pour le synonyme, cherche un sens proche ; pour l'antonyme, un sens contraire (pense aux préfixes) ; pour la
      famille, garde le radical.
    etape: Pour content, tu peux chercher un adjectif qui veut dire « plein de joie ».
  solution: 'Exemple : content. Synonyme : joyeux. Antonyme : triste (ou mécontent). Famille : contentement, mécontent. Phrase
    : Le maître est content de notre travail. Réussite si les quatre mots sont justes et la phrase correcte.'
