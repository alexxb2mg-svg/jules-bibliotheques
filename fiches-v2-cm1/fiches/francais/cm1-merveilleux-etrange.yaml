# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-merveilleux-etrange
version: 1
etat: verifiee
declencheurs:
- histoire qui fait peur
- monde imaginaire
- un événement inexplicable
- conte fantastique
- objet magique qui parle
prerequis:
- cm1-heroines-heros
essentiel: 'Se confronter au merveilleux et à l''étrange, c''est découvrir des mondes imaginaires et éveiller sa sensibilité
  à l''inconnu.


  Cela permet d''explorer des sentiments universels : la peur, le désir d''évasion et la curiosité pour l''inexplicable.


  Lire ce type de textes permet d''allier la découverte du texte littéraire à une réflexion sur notre rapport à l''inexplicable,
  au rêve et à la peur.


  Cela aide aussi à développer l''esprit critique et la créativité.'
methode:
- Repérer ce qui, dans l'histoire, n'existe pas dans la réalité (un événement magique, une créature étrange...).
- Identifier les sentiments que l'histoire fait naître (peur, curiosité, envie de s'évader).
- Réfléchir à pourquoi ce phénomène étrange ou merveilleux paraît inexplicable.
vocabulaire:
- terme: merveilleux
  definition: ce qui relève de la magie ou de l'impossible dans un récit, comme dans les contes
- terme: étrange
  definition: ce qui paraît inexplicable ou inquiétant, sans être forcément magique
erreurs_frequentes:
- Confondre le merveilleux (magie, contes) avec un simple récit réaliste.
- Ne pas chercher à comprendre ce que l'histoire fait ressentir (peur, évasion, curiosité).
exemple:
  enonce: Dans un conte, une horloge se met à parler à minuit et personne ne peut expliquer pourquoi. Qu'est-ce qui relève
    du merveilleux ou de l'étrange dans cet extrait ?
  solution: Une horloge qui parle est un événement impossible dans la réalité (merveilleux) et le fait que personne ne puisse
    l'expliquer crée un sentiment d'étrangeté et de curiosité.
exercices:
- id: reconnaitre-merveilleux
  type: choix
  difficulte: 1
  enonce: Dans un récit, une horloge se met à parler à minuit. Qu'est-ce qui rend cet événement merveilleux ?
  reponse:
    options:
    - id: a
      texte: C'est un événement impossible dans la réalité
    - id: b
      texte: L'horloge est très ancienne
    - id: c
      texte: L'histoire se passe la nuit
    - id: d
      texte: L'horloge est décrite avec beaucoup de détails
    bonnes:
    - a
  indices:
    relance: Est-ce qu'une horloge peut vraiment parler dans la vie réelle ?
    methode: Le merveilleux désigne ce qui est impossible dans la réalité, comme la magie dans les contes.
    etape: 'Une horloge qui parle n''existe pas dans la réalité : c''est cela qui relève du merveilleux.'
  pieges:
  - si:
      contient:
      - c
    relance: Le fait que ce soit la nuit n'a rien de magique en soi. Cherche ce qui est impossible dans la réalité.
  - si:
      contient:
      - b
    relance: L'ancienneté de l'horloge n'a rien de magique en soi. Cherche ce qui est impossible dans la réalité.
  solution: 'Une horloge qui parle est un événement impossible dans la réalité : c''est ce qui relève du merveilleux.'
- id: sentiment-etrange
  type: choix
  difficulte: 2
  enonce: Personne ne peut expliquer pourquoi l'horloge parle. Quel sentiment cela crée-t-il principalement chez le lecteur
    ?
  reponse:
    options:
    - id: a
      texte: Un sentiment d'étrangeté et de curiosité pour l'inexplicable
    - id: b
      texte: Un sentiment d'ennui, car rien d'intéressant ne se passe
    - id: c
      texte: Un sentiment de certitude, car tout est bien expliqué
    - id: d
      texte: Aucun sentiment particulier
    bonnes:
    - a
  indices:
    relance: Que ressent-on face à un phénomène qu'on ne peut pas expliquer ?
    methode: Le merveilleux et l'étrange éveillent des sentiments comme la peur, le désir d'évasion et la curiosité pour l'inexplicable.
    etape: L'absence d'explication rend l'événement étrange, ce qui crée de la curiosité, voire de l'inquiétude.
  pieges:
  - si:
      contient:
      - c
    relance: Au contraire, le texte insiste sur le fait que personne ne peut expliquer le phénomène, ce qui exclut la certitude.
  solution: Le fait que personne ne puisse expliquer le phénomène crée un sentiment d'étrangeté et de curiosité pour l'inexplicable.
- id: objectifs-lecture-merveilleux
  type: choix
  difficulte: 2
  enonce: Selon le programme, que développe la lecture d'œuvres merveilleuses ou étranges, en plus de la découverte du texte
    littéraire ?
  reponse:
    options:
    - id: a
      texte: L'esprit critique et la créativité
    - id: b
      texte: Uniquement la mémorisation de l'orthographe
    - id: c
      texte: Uniquement la vitesse de lecture
    - id: d
      texte: Uniquement la connaissance des chiffres romains
    bonnes:
    - a
  indices:
    relance: 'Relis la dernière phrase de l''essentiel : deux compétences sont citées, en plus de la lecture elle-même.'
    methode: 'Le texte insiste sur des compétences plus larges que la seule lecture : la réflexion et l''imagination.'
    etape: Les deux compétences citées sont liées à la réflexion et à l'invention personnelle.
  pieges:
  - si:
      contient:
      - b
    relance: L'orthographe n'est pas ce que développe particulièrement ce type de lecture, selon le programme.
  - si:
      contient:
      - c
    relance: La vitesse de lecture n'est pas ce que développe particulièrement ce type de lecture, selon le programme.
  solution: Se confronter au merveilleux et à l'étrange aide à développer l'esprit critique et la créativité.
