# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-merveilleux-etrange
version: 3
etat: verifiee
declencheurs:
- histoire qui fait peur
- monde imaginaire
- un événement inexplicable
- conte fantastique
- objet magique qui parle
- animaux qui parlent dans un conte
- fée et sorcière
- histoire bizarre et mystérieuse
prerequis:
- cm1-heroines-heros
essentiel: 'Se confronter au merveilleux et à l''étrange, c''est lire des histoires qui nous emmènent dans des mondes imaginaires.
  Ces lectures éveillent notre sensibilité à l''inconnu.


  Le merveilleux, c''est ce qui est impossible dans la vraie vie mais normal dans l''histoire : une fée qui exauce un vœu,
  un loup qui parle, une citrouille changée en carrosse. On le trouve surtout dans les contes. Personne ne s''en étonne, car
  la magie fait partie de ce monde.


  L''étrange, c''est ce qui paraît bizarre, mystérieux ou inquiétant, et que personne n''arrive à expliquer. Par exemple,
  chaque nuit, la poupée du grenier change de place, sans que l''on sache pourquoi. Le personnage se pose des questions, et
  le lecteur aussi.


  Ces histoires font naître trois grands sentiments, que tout le monde connaît. La peur, quand on frissonne devant un château
  sombre. Le désir d''évasion, l''envie de partir loin dans un autre monde. La curiosité pour l''inexplicable, l''envie de
  savoir le fin mot du mystère.


  En lisant, on découvre un texte littéraire, mais on réfléchit aussi : pourquoi aime-t-on avoir peur dans un livre ? Que
  rêve-t-on d''autre ? Qu''est-ce qu''on ne sait pas expliquer ?


  Ces lectures développent l''esprit critique, c''est-à-dire savoir distinguer le vrai de l''inventé. Elles développent aussi
  la créativité, quand à ton tour tu inventes un monde ou un mystère.

  '
methode:
- Repérer ce qui, dans l'histoire, n'existe pas dans la réalité (un événement magique, une créature étrange).
- Se demander si les personnages trouvent cela normal (merveilleux) ou bizarre et inquiétant (étrange).
- Relever les mots du texte qui créent la peur ou le mystère (nuit, ombre, bruit, silence).
- Identifier les sentiments que l'histoire fait naître (peur, curiosité, envie de s'évader).
- Distinguer ce qui serait possible dans la vraie vie de ce qui est inventé.
vocabulaire:
- terme: merveilleux
  definition: ce qui relève de la magie ou de l'impossible dans un récit, comme dans les contes.
- terme: étrange
  definition: ce qui paraît inexplicable ou inquiétant, sans être forcément magique.
- terme: imaginaire
  definition: ce qui est inventé et n'existe pas dans la réalité.
- terme: inexplicable
  definition: qu'on ne peut pas expliquer, dont on ne trouve pas la cause.
- terme: évasion
  definition: le fait de s'échapper en pensée de sa vie de tous les jours, vers un autre monde.
- terme: esprit critique
  definition: la capacité à réfléchir pour distinguer le vrai de l'inventé.
erreurs_frequentes:
- Confondre le merveilleux (magie, contes) avec un simple récit réaliste.
- Ne pas chercher à comprendre ce que l'histoire fait ressentir (peur, évasion, curiosité).
- Croire que tout ce qui fait peur est forcément magique, alors que l'étrange peut rester sans magie.
- Croire que ce qui arrive dans un conte pourrait arriver dans la vraie vie.
exemple:
  enonce: Dans un conte, une horloge se met à parler à minuit et personne ne peut expliquer pourquoi. Qu'est-ce qui relève
    du merveilleux ou de l'étrange dans cet extrait ?
  solution: 'Une horloge qui parle est un événement impossible dans la réalité : c''est le merveilleux. Le fait que personne
    ne puisse l''expliquer, et que cela arrive à minuit, crée un sentiment d''étrangeté et de curiosité : on a envie de savoir
    pourquoi, et on peut même avoir un peu peur.'
exercices:
- id: reconnaitre-merveilleux
  type: choix
  difficulte: 1
  enonce: Dans un récit, une horloge se met à parler à minuit. Qu'est-ce qui rend cet événement merveilleux ?
  reponse:
    options:
    - id: a
      texte: C'est un événement impossible dans la réalité
    - id: b
      texte: L'horloge est très ancienne
    - id: c
      texte: L'histoire se passe la nuit
    - id: d
      texte: L'horloge est décrite avec beaucoup de détails
    bonnes:
    - a
  indices:
    relance: Est-ce qu'une horloge peut vraiment parler dans la vie réelle ?
    methode: Le merveilleux désigne ce qui est impossible dans la réalité, comme la magie dans les contes.
    etape: Une horloge qui parle n'existe pas dans la vraie vie. Quelle option le dit ?
  pieges:
  - si:
      contient:
      - b
    relance: L'ancienneté de l'horloge n'a rien de magique en soi. Cherche ce qui est impossible dans la réalité.
  - si:
      contient:
      - c
    relance: Le fait que ce soit la nuit n'a rien de magique en soi. Cherche ce qui est impossible dans la réalité.
  - si:
      contient:
      - d
    relance: Une description détaillée n'a rien de magique. Cherche ce qui est impossible dans la réalité.
  solution: 'Une horloge qui parle est un événement impossible dans la réalité : c''est ce qui relève du merveilleux.'
- id: sentiment-etrange
  type: choix
  difficulte: 2
  enonce: Personne ne peut expliquer pourquoi l'horloge parle. Quel sentiment cela crée-t-il principalement chez le lecteur
    ?
  reponse:
    options:
    - id: a
      texte: Un sentiment d'étrangeté et de curiosité pour l'inexplicable
    - id: b
      texte: Un sentiment d'ennui, car rien d'intéressant ne se passe
    - id: c
      texte: Un sentiment de certitude, car tout est bien expliqué
    - id: d
      texte: Aucun sentiment particulier
    bonnes:
    - a
  indices:
    relance: Que ressent-on face à un phénomène qu'on ne peut pas expliquer ?
    methode: Le merveilleux et l'étrange éveillent des sentiments comme la peur, le désir d'évasion et l'envie de comprendre
      un mystère.
    etape: Quand on ne sait pas pourquoi une chose arrive, on a envie de le découvrir, et on peut aussi s'inquiéter.
  pieges:
  - si:
      contient:
      - b
    relance: Une horloge qui parle à minuit, est-ce vraiment un moment où rien ne se passe ?
  - si:
      contient:
      - c
    relance: Au contraire, le texte insiste sur le fait que personne ne peut expliquer le phénomène, ce qui exclut la certitude.
  - si:
      contient:
      - d
    relance: Un mystère laisse-t-il vraiment le lecteur indifférent ? Imagine que cela t'arrive.
  solution: Le fait que personne ne puisse expliquer le phénomène crée un sentiment d'étrangeté et de curiosité pour l'inexplicable.
- id: objectifs-lecture-merveilleux
  type: choix
  difficulte: 2
  enonce: Selon le programme, que développe la lecture d'œuvres merveilleuses ou étranges, en plus de la découverte du texte
    littéraire ?
  reponse:
    options:
    - id: a
      texte: L'esprit critique et la créativité
    - id: b
      texte: Uniquement la mémorisation de l'orthographe
    - id: c
      texte: Uniquement la vitesse de lecture
    - id: d
      texte: Uniquement la connaissance des chiffres romains
    bonnes:
    - a
  indices:
    relance: 'Relis la fin de l''essentiel : deux qualités sont citées, en plus de la lecture elle-même.'
    methode: 'Le texte insiste sur des qualités plus larges que la seule lecture : la réflexion et l''imagination.'
    etape: Les deux qualités citées sont liées à la réflexion et à l'invention personnelle.
  pieges:
  - si:
      contient:
      - b
    relance: L'orthographe n'est pas ce que développe particulièrement ce type de lecture, selon le programme.
  - si:
      contient:
      - c
    relance: La vitesse de lecture n'est pas ce que développe particulièrement ce type de lecture, selon le programme.
  - si:
      contient:
      - d
    relance: Les chiffres romains n'ont rien à voir avec ces lectures. Pense à réfléchir et à inventer.
  solution: Se confronter au merveilleux et à l'étrange aide à développer l'esprit critique et la créativité.
- id: reel-ou-imaginaire
  type: association
  difficulte: 1
  enonce: Relie chaque phrase à ce qu'elle décrit.
  reponse:
    gauche:
    - id: tapis
      texte: Le tapis s'envola au-dessus des toits.
    - id: chat
      texte: Le chat dormait au soleil sur le rebord de la fenêtre.
    - id: renard
      texte: Le renard salua le corbeau et lui fit un compliment.
    - id: bus
      texte: Ce matin, le bus est arrivé en retard à cause de la pluie.
    droite:
    - id: possible
      texte: Possible dans la vraie vie
    - id: impossible
      texte: Impossible dans la vraie vie, donc merveilleux
    paires:
      tapis: impossible
      chat: possible
      renard: impossible
      bus: possible
  indices:
    relance: Pour chaque phrase, demande-toi si tu pourrais la voir en vrai, dans ta rue ou chez toi.
    methode: Un objet qui vole tout seul ou un animal qui parle n'existent que dans les histoires.
    etape: Deux phrases décrivent des choses qu'on voit tous les jours. Lesquelles ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Un animal peut-il vraiment parler ?
  - si:
      diagnostic: associations_fausses
    relance: Reprends chaque phrase et imagine-la dans ta vraie vie. Est-ce possible ?
  solution: 'Possibles : le chat qui dort au soleil et le bus en retard. Impossibles, donc merveilleux : le tapis qui s''envole
    et le renard qui parle, comme dans les fables et les contes.'
- id: trois-sentiments
  type: association
  difficulte: 2
  enonce: Relie chaque passage au sentiment qu'il fait surtout naître chez le lecteur.
  reponse:
    gauche:
    - id: couloir
      texte: Dans le couloir noir, des pas approchaient. Lou retint son souffle.
    - id: ile
      texte: 'Au-delà de la mer, une île de nuages flottait : on disait qu''on y vivait sans jamais vieillir.'
    - id: lettre
      texte: Chaque matin, une lettre sans signature attendait Paul sur son bureau. Qui l'écrivait ?
    droite:
    - id: peur
      texte: La peur
    - id: evasion
      texte: Le désir d'évasion
    - id: curiosite
      texte: La curiosité pour l'inexplicable
    paires:
      couloir: peur
      ile: evasion
      lettre: curiosite
  indices:
    relance: Imagine-toi dans chaque passage. Que ressens-tu ?
    methode: Cherche les mots qui font frissonner, ceux qui font rêver d'ailleurs, et ceux qui posent une question sans réponse.
    etape: Un passage se termine par une question. Quel sentiment pousse à chercher la réponse ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Il reste une association à revoir. Lequel de ces passages donne envie de partir loin ?
  - si:
      diagnostic: associations_fausses
    relance: Commence par le passage le plus inquiétant, celui où l'on retient son souffle dans le noir.
  solution: 'Le couloir noir et les pas qui approchent font naître la peur. L''île de nuages fait rêver d''un autre monde
    : c''est le désir d''évasion. La lettre mystérieuse pousse à chercher qui l''écrit : c''est la curiosité pour l''inexplicable.'
- id: merveilleux-ou-etrange
  type: choix
  difficulte: 3
  enonce: 'Lis ce passage. « Depuis trois nuits, le piano du salon jouait tout seul, toujours la même mélodie. Maman avait
    vérifié : la pièce était fermée à clé. Léo n''en dormait plus. » Ce passage relève surtout...'
  reponse:
    options:
    - id: a
      texte: de l'étrange, car personne ne comprend ce qui se passe et cela inquiète
    - id: b
      texte: du merveilleux, car tout le monde trouve normal qu'un piano joue seul
    - id: c
      texte: d'un récit réaliste, car un piano peut jouer seul dans la vraie vie
    bonnes:
    - a
  indices:
    relance: Comment réagissent les personnages ? Trouvent-ils cela normal ?
    methode: Dans le merveilleux, la magie est acceptée sans surprise. Dans l'étrange, les personnages s'inquiètent et ne
      comprennent pas.
    etape: Maman vérifie la porte et Léo ne dort plus. Que montrent ces réactions ?
  pieges:
  - si:
      contient:
      - b
    relance: Si tout le monde trouvait cela normal, Maman vérifierait-elle la porte ? Léo dormirait-il ?
  - si:
      contient:
      - c
    relance: Un piano dans une pièce fermée à clé peut-il jouer tout seul dans la vraie vie ?
  solution: 'C''est l''étrange : un piano qui joue seul dans une pièce fermée est inexplicable, et les personnages s''en inquiètent
    (Maman vérifie la porte, Léo ne dort plus). Dans le merveilleux, la magie paraîtrait normale à tous.'
- id: mot-impossible
  type: texte_court
  difficulte: 2
  enonce: Dans les contes, une fée, une baguette magique ou un loup qui parle sont des éléments impossibles dans la vraie
    vie. Quel mot désigne ce type d'éléments magiques ?
  reponse:
    acceptees:
    - merveilleux
    - le merveilleux
    fautes_tolerees: 2
  indices:
    relance: Relis le vocabulaire de la fiche. Deux mots sont proches, l'un parle de magie, l'autre de mystère inquiétant.
    methode: Ici, la magie est acceptée par tous comme normale. Lequel des deux mots convient ?
    etape: Ce n'est pas l'étrange, qui inquiète sans être forcément magique. C'est l'autre mot de la leçon.
  pieges:
  - si:
      valeur: étrange
    relance: L'étrange, c'est ce qui inquiète sans être forcément magique. Ici, il s'agit de magie acceptée par tous.
  - si:
      valeur: imaginaire
    relance: C'est proche, mais il existe un mot plus précis pour la magie des contes.
  solution: 'C''est le merveilleux : la magie et l''impossible, acceptés comme normaux dans les contes.'
- id: inventer-un-mystere
  type: ouverte
  difficulte: 3
  enonce: Invente le début d'une histoire étrange (trois ou quatre phrases) qui se passe dans un lieu que tu connais, comme
    ta chambre, l'école ou le jardin.
  criteres:
  - Le texte décrit un lieu réel et familier.
  - Un événement inexplicable s'y produit.
  - Le texte fait naître un sentiment (peur, curiosité) par le choix des mots ou la réaction d'un personnage.
  indices:
    relance: Pars d'un endroit que tu connais bien, puis imagine une chose qui ne devrait pas s'y produire.
    methode: Ajoute la réaction d'un personnage qui ne comprend pas, et des mots comme « silence », « ombre » ou « soudain
      ».
    etape: Tu peux commencer par « Ce soir-là, dans ma chambre, ... ».
  solution: 'Exemple : « Ce soir-là, dans ma chambre, la lampe s''alluma toute seule. Puis la page de mon livre se tourna,
    sans un souffle de vent. Je restai immobile, le cœur battant. Qui était là ? »'
