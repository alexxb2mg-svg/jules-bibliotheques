  difficulte: 2
  enonce: Selon la fiche de cours et les programmes de CM1, que permet d'explorer la découverte de mondes imaginaires dans
    la notion du merveilleux et de l'étrange ?
  reponse:
    options:
    - id: o1
      texte: Des sentiments universels comme la peur, le désir d'évasion et la curiosité pour l'inexplicable.
    - id: o2
      texte: Uniquement des faits historiques réels et documentés.
    - id: o3
      texte: Des règles complexes d'accord en grammaire.
    - id: o4
      texte: Des cours de calcul mental et de géométrie.
    bonnes:
    - o1
  indices:
    relance: Pense aux émotions et aux réactions suscitées par les récits extraordinaires.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, les mondes imaginaires relèvent de la fiction et non de faits historiques réels.
  - si:
      contient:
      - o3
    relance: Cette notion concerne la culture littéraire et l'étude des récits, pas la grammaire.
  - si:
      contient:
      - o4
    relance: Le calcul mental relève des mathématiques, pas de l'entrée littéraire sur l'imaginaire.
  solution: Des sentiments universels comme la peur, le désir d'évasion et la curiosité pour l'inexplicable. C'est exact,
    la découverte de mondes imaginaires permet d'aborder des sentiments universels comme la peur, l'évasion et la curiosité.
