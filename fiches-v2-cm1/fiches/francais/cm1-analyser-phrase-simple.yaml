format: 2
notion: cm1-analyser-phrase-simple
version: 3
etat: verifiee
declencheurs:
- complément circonstanciel
- complément d'objet
- groupe sujet
- qu'est-ce que le sujet
- manipulation syntaxique
- COD
- COI
- trouver le sujet du verbe
- c'est qui encadrer
- déplacer un groupe
prerequis:
- cm1-types-et-formes-de-phrases
essentiel: 'Une phrase simple s''organise autour d''un verbe conjugué. Ce verbe a un sujet. Pour trouver le verbe, change
  le moment de la phrase : « Le chien aboie » devient « Hier, le chien aboyait ». Le mot qui change est le verbe conjugué.


  Le groupe sujet règle l''accord du verbe : « Le facteur distribue le courrier » / « Les facteurs distribuent le courrier
  ». Le sujet peut être un pronom personnel (Nous partons), un groupe nominal (Le petit chat dort) ou plusieurs noms (Tom
  et Zoé chantent). Pour le repérer, on l''encadre par « c''est… qui » ou on le remplace par un pronom.


  Le verbe peut avoir un complément d''objet. On ne peut en général ni le supprimer ni le déplacer. S''il est placé sans préposition
  après le verbe, c''est un complément d''objet direct (COD) : « Le facteur distribue le courrier ». S''il est introduit par
  une préposition comme à ou de, c''est un complément d''objet indirect (COI) : « Le facteur parle à sa collègue ».


  Les groupes circonstanciels donnent des précisions : où, quand, comment. On peut les déplacer ou les supprimer, la phrase
  reste correcte. « Chaque matin, le chat mange » = « Le chat mange chaque matin » = « Le chat mange ».


  Pour analyser une phrase, on la manipule : on déplace un groupe, on le supprime, on le remplace (substitution), on ajoute
  un mot (addition) ou on l''encadre. Ces manipulations servent aussi à améliorer tes écrits.

  '
methode:
- Repérer le verbe conjugué en changeant le temps de la phrase (hier, demain).
- Trouver le groupe sujet en posant « qui est-ce qui fait l'action ? » ou en encadrant par « c'est... qui ».
- Chercher s'il y a un complément d'objet directement après le verbe ou introduit par une préposition.
- 'Repérer les groupes qui peuvent être déplacés ou supprimés sans rendre la phrase incorrecte : ce sont des compléments circonstanciels.'
- Vérifier en manipulant la phrase (déplacement, suppression, remplacement).
vocabulaire:
- terme: groupe sujet (GS)
  definition: le groupe qui règle l'accord du verbe
- terme: complément d'objet direct (COD)
  definition: complément du verbe non introduit par une préposition
- terme: complément d'objet indirect (COI)
  definition: complément du verbe introduit par une préposition
- terme: complément circonstanciel
  definition: groupe qui précise où, quand ou comment, et qu'on peut déplacer ou supprimer
- terme: manipulation syntaxique
  definition: déplacement, suppression, substitution, addition ou encadrement d'un groupe pour l'identifier
- terme: verbe conjugué
  definition: le mot de la phrase qui change quand on change le temps ou la personne
erreurs_frequentes:
- 'Confondre complément d''objet et complément circonstanciel : le complément d''objet ne peut généralement pas être supprimé
  ni déplacé.'
- Oublier de vérifier la préposition pour distinguer COD et COI.
- Chercher le sujet juste avant le verbe, alors qu'un groupe sujet peut être plus long ou inversé.
- Ne garder qu'un seul nom quand le sujet en contient plusieurs (Tom et Zoé).
exemple:
  enonce: Dans la phrase « Le facteur donne une lettre à ma voisine. », identifie le groupe sujet, le COD et le COI.
  solution: 'Groupe sujet : le facteur. COD : une lettre (donne quoi ? une lettre, sans préposition). COI : à ma voisine (donne
    à qui ? à ma voisine, avec la préposition à).'
exercices:
- id: sujet-galoper
  type: texte_court
  difficulte: 1
  enonce: Dans la phrase « Les chevaux galopent dans la prairie. », donne le groupe sujet.
  reponse:
    acceptees:
    - les chevaux
    fautes_tolerees: 2
  indices:
    relance: Pose la question « qui est-ce qui galope ? ».
    methode: Le groupe sujet répond à la question « qui est-ce qui fait l'action ? ».
    etape: 'Le verbe est galopent : qui galope ?'
  pieges:
  - si:
      valeur: dans la prairie
    relance: Ce groupe donne un lieu, il ne répond pas à « qui est-ce qui galope ? ».
  solution: 'les chevaux : ce groupe répond à la question « qui est-ce qui galope ? » et règle l''accord du verbe.'
- id: verbe-conjugue
  type: texte_court
  difficulte: 1
  enonce: Écris le verbe conjugué de la phrase « Chaque soir, mon chien guette mon père devant la porte. »
  reponse:
    acceptees:
    - guette
    fautes_tolerees: 1
  indices:
    relance: Quel mot change si tu commences la phrase par « Hier soir » ?
    methode: Change le temps de la phrase. Le seul mot qui change de forme est le verbe conjugué.
    etape: Récris toute la phrase en commençant par « Hier soir ». Compare-la mot par mot avec la phrase de départ.
  pieges:
  - si:
      valeur: mon chien
    relance: C'est le groupe sujet, il dit qui fait l'action. Quel mot dit ce que fait le chien ?
  - si:
      valeur: chien
    relance: Ce mot est un nom, il fait partie du groupe sujet. Quel mot dit ce que fait le chien ?
  solution: 'guette : si on écrit « Hier soir », il devient guettait. C''est le verbe conjugué (infinitif guetter).'
- id: remplacer-pronom
  type: texte_court
  difficulte: 1
  enonce: Remplace le groupe sujet par un pronom personnel dans « Le facteur distribue le courrier. »
  reponse:
    acceptees:
    - Il distribue le courrier.
    fautes_tolerees: 2
  indices:
    relance: 'Le facteur, c''est une personne : quel pronom personnel le remplace ?'
    methode: Un groupe nominal sujet désignant une personne se remplace par il ou elle selon le genre.
    etape: 'Le facteur est masculin singulier : quel pronom choisir ?'
  pieges:
  - si:
      valeur: Ils distribuent le courrier.
    relance: Il n'y a qu'un facteur. Le pronom doit rester au singulier.
  solution: Il distribue le courrier.
- id: types-de-sujets
  type: association
  difficulte: 2
  enonce: Relie chaque phrase à la sorte de sujet qu'elle contient.
  reponse:
    gauche:
    - id: nous-partons
      texte: Nous partons en classe verte.
    - id: petit-chat
      texte: Le petit chat dort sur le lit.
    - id: tom-zoe
      texte: Tom et Zoé chantent au spectacle.
    droite:
    - id: pronom
      texte: un pronom personnel
    - id: groupe-nominal
      texte: un groupe nominal
    - id: plusieurs-noms
      texte: plusieurs noms
    paires:
      nous-partons: pronom
      petit-chat: groupe-nominal
      tom-zoe: plusieurs-noms
  indices:
    relance: Dans chaque phrase, qui est-ce qui fait l'action ?
    methode: Trouve le sujet de chaque phrase, puis regarde s'il remplace un nom, s'il est construit autour d'un nom, ou s'il
      contient plusieurs noms reliés par « et ».
    etape: Dans la troisième phrase, le sujet contient deux prénoms reliés par « et ». Classe ensuite les deux autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Quel sujet est un petit mot qui remplace des personnes ?
  - si:
      diagnostic: associations_fausses
    relance: Encadre chaque sujet par « c'est… qui », puis regarde s'il contient un nom, deux noms ou aucun nom.
  solution: 'Nous partons : pronom personnel. Le petit chat dort : groupe nominal (déterminant + adjectif + nom). Tom et Zoé
    chantent : plusieurs noms.'
- id: choix-cod-coi
  type: choix
  difficulte: 2
  enonce: Dans « Le facteur parle à sa collègue. », comment appelle-t-on le groupe « à sa collègue » ?
  reponse:
    options:
    - id: a
      texte: complément d'objet direct
    - id: b
      texte: complément d'objet indirect
    - id: c
      texte: complément circonstanciel
    bonnes:
    - b
  indices:
    relance: Ce groupe est-il introduit par une préposition ?
    methode: Un complément d'objet introduit par une préposition est indirect.
    etape: 'Le mot « à » introduit ce groupe : c''est une préposition.'
  pieges:
  - si:
      contient:
      - a
    relance: Un complément d'objet direct n'est pas introduit par une préposition. Regarde le mot « à ».
  - si:
      contient:
      - c
    relance: Peux-tu supprimer ce groupe sans rendre la phrase bizarre ? Le verbe parler à quelqu'un en a besoin ici.
  solution: 'complément d''objet indirect : le groupe est introduit par la préposition à.'
- id: cod-ou-cc
  type: choix
  difficulte: 2
  enonce: Dans « Les chevaux galopent dans la prairie chaque matin. », que sont « dans la prairie » et « chaque matin » ?
  reponse:
    options:
    - id: a
      texte: des compléments d'objet
    - id: b
      texte: des compléments circonstanciels
    - id: c
      texte: le groupe sujet
    bonnes:
    - b
  indices:
    relance: Peux-tu supprimer ou déplacer ces deux groupes sans rendre la phrase incorrecte ?
    methode: Un groupe qu'on peut déplacer ou supprimer est un complément circonstanciel.
    etape: '« Les chevaux galopent. » reste correct sans ces deux groupes : ils donnent le lieu et le temps.'
  pieges:
  - si:
      contient:
      - a
    relance: 'Le verbe galoper n''a pas de complément d''objet ici : peux-tu supprimer ces groupes ?'
  - si:
      contient:
      - c
    relance: Qui est-ce qui galope ? Ce n'est aucun de ces deux groupes.
  solution: 'des compléments circonstanciels : ils précisent le lieu et le temps, et peuvent être déplacés ou supprimés.'
- id: association-fonctions
  type: association
  difficulte: 2
  enonce: Relie chaque groupe à sa fonction dans la phrase « Le chat mange des croquettes le matin ».
  reponse:
    gauche:
    - id: a
      texte: le chat
    - id: b
      texte: des croquettes
    - id: c
      texte: le matin
    droite:
    - id: x
      texte: groupe sujet
    - id: y
      texte: complément d'objet direct
    - id: z
      texte: complément circonstanciel
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Cherche d'abord qui fait l'action, puis ce qui est mangé, puis ce qui donne un moment.
    methode: Le sujet répond à qui est-ce qui, le COD répond à quoi sans préposition, le complément circonstanciel donne temps
      ou lieu et peut être supprimé.
    etape: 'Pose les trois questions : qui est-ce qui mange ? Le chat mange quoi ? Quand ? Puis essaie de supprimer chaque
      groupe.'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Vérifie laquelle répond à qui, laquelle à quoi, laquelle à quand.
  - si:
      diagnostic: associations_fausses
    relance: Essaie de déplacer chaque groupe en début de phrase. Celui qui peut bouger n'est pas un complément d'objet.
  solution: le chat-groupe sujet, des croquettes-complément d'objet direct, le matin-complément circonstanciel.
- id: manipulation-circonstanciel
  type: choix
  difficulte: 3
  enonce: Tu veux vérifier que « après l'école » est un groupe circonstanciel dans « Inès joue au foot après l'école. ». Quelle
    manipulation choisis-tu ?
  reponse:
    options:
    - id: a
      texte: Je le déplace en début de phrase, ou je le supprime, et je vérifie que la phrase reste correcte
    - id: b
      texte: Je l'encadre par « c'est… qui »
    - id: c
      texte: Je le remplace par le pronom il
    bonnes:
    - a
  indices:
    relance: Qu'est-ce qui distingue un groupe circonstanciel d'un complément d'objet ?
    methode: Un groupe circonstanciel peut bouger dans la phrase et peut disparaître. Choisis la manipulation qui teste cela.
    etape: Essaie « Après l'école, Inès joue au foot. » puis « Inès joue au foot. » La phrase est-elle toujours correcte ?
  pieges:
  - si:
      contient:
      - b
    relance: Encadrer par « c'est… qui » sert à trouver le sujet. Quelle manipulation montre qu'un groupe peut bouger ?
  - si:
      contient:
      - c
    relance: Remplacer par il sert surtout pour un groupe sujet. Un groupe circonstanciel, lui, peut bouger ou disparaître.
  solution: 'On le déplace (« Après l''école, Inès joue au foot. ») ou on le supprime (« Inès joue au foot. ») : la phrase
    reste correcte, donc c''est un groupe circonstanciel.'
- id: ouverte-analyse
  type: ouverte
  difficulte: 3
  enonce: 'Analyse la phrase « Ma sœur range ses jouets dans le coffre chaque soir. » : donne le groupe sujet, le complément
    d''objet et un complément circonstanciel.'
  criteres:
  - L'élève identifie « ma sœur » comme groupe sujet.
  - L'élève identifie « ses jouets » comme complément d'objet direct.
  - L'élève identifie « dans le coffre » ou « chaque soir » comme complément circonstanciel.
  indices:
    relance: Cherche d'abord qui range, puis ce qui est rangé, puis les précisions de lieu ou de temps.
    methode: Utilise les questions qui est-ce qui, range quoi, et vérifie ce qui peut être déplacé ou supprimé.
    etape: 'Le verbe conjugué est « range » : qui range ?'
  solution: 'Groupe sujet : ma sœur. Complément d''objet direct : ses jouets. Compléments circonstanciels : dans le coffre
    (lieu) et chaque soir (temps), tous deux déplaçables ou supprimables.'
