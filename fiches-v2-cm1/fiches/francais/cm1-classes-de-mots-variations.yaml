    - id: o2
      texte: L'adjectif
    - id: o3
      texte: Le déterminant
    - id: o4
      texte: Le pronom personnel
    bonnes:
    - o1
  indices:
    relance: Cherche la classe de mots qui ne subit aucune variation de genre ou de nombre.
