format: 2
notion: cm1-classes-de-mots-variations
version: 3
etat: verifiee
declencheurs:
- ce mot change
- genre du mot
- nombre du mot
- variation
- masculin féminin
- singulier pluriel
- mon amie
- pourquoi on dit mon
- ce cet cette ces
- son sa ses leur
- mot qui prend un s au pluriel
prerequis:
- cm1-identifier-mots-selon-nature
essentiel: 'Certains mots changent de forme selon la phrase : on dit qu''ils varient. Ils peuvent varier selon quatre critères.


  Le genre : masculin ou féminin (un voisin, une voisine). Le nombre : singulier ou pluriel (un chat, des chats). La personne
  : qui parle ou de qui on parle (je chante, nous chantons). Le temps : quand l''action se passe (il chante, il chantait).


  Cinq classes de mots peuvent varier. Le nom varie en nombre, et parfois en genre (un lion, une lionne). Le déterminant et
  l''adjectif varient en genre et en nombre pour s''accorder avec le nom (un petit chien, des petites chiennes). Le pronom
  personnel varie en personne, en nombre et parfois en genre (il, elle, ils, elles). Le verbe varie en personne, en nombre
  et en temps.


  D''autres classes ne varient jamais : on les dit invariables. C''est le cas de l''adverbe (vite, très) et des conjonctions
  (et, mais).


  Les déterminants sont à connaître par cœur. Articles : le, la, l'', les, un, une, des. Possessifs : mon, ma, mes, ton, ta,
  tes, son, sa, ses, notre, votre, leur, nos, vos, leurs. Démonstratifs : ce, cet, cette, ces.


  Attention aux formes particulières. Devant un nom masculin qui commence par une voyelle, « ce » devient « cet » : cet arbre.
  Devant un nom féminin qui commence par une voyelle, « ma » devient « mon » : mon amie (et non « ma amie »), pour que ce
  soit plus facile à dire.


  Quand tu écris, tu t''appuies sur ces connaissances pour bien accorder. En cas de doute, tu vérifies dans un outil de référence
  : un tableau des déterminants, un aide-mémoire ou un tableau de conjugaison.

  '
methode:
- Identifier la classe grammaticale du mot que tu observes.
- Vérifier s'il varie en genre (masculin/féminin).
- Vérifier s'il varie en nombre (singulier/pluriel).
- Pour un verbe, vérifier aussi s'il varie en personne et en temps.
- Utiliser un tableau ou un aide-mémoire pour vérifier les formes correctes.
vocabulaire:
- terme: genre
  definition: masculin ou féminin, une des variations possibles d'un mot
- terme: nombre
  definition: singulier ou pluriel, une des variations possibles d'un mot
- terme: personne
  definition: indique qui parle ou de qui l'on parle (je, tu, il, nous, vous, ils).
- terme: temps
  definition: indique quand se passe l'action du verbe (passé, présent, futur).
- terme: invariable
  definition: se dit d'un mot qui ne change jamais de forme, comme un adverbe.
- terme: déterminant possessif
  definition: un déterminant qui indique à qui appartient quelque chose (mon, ta, ses, leur...).
- terme: déterminant démonstratif
  definition: un déterminant qui sert à montrer (ce, cet, cette, ces).
erreurs_frequentes:
- Oublier d'accorder le déterminant possessif ou démonstratif avec le nom qu'il précède.
- 'Confondre les critères de variation : croire qu''un adverbe varie alors qu''il est invariable.'
- Ne pas vérifier ses réponses avec un outil de référence en cas de doute.
- Écrire « ce arbre » au lieu de « cet arbre » devant un nom masculin qui commence par une voyelle.
- Accorder le nom au pluriel mais oublier l'adjectif (« des fleurs rouge » au lieu de « des fleurs rouges »).
exemple:
  enonce: Pourquoi dit-on « mon amie » et non « ma amie », alors qu'amie est féminin ?
  solution: « Amie » est un nom féminin, mais il commence par une voyelle. Dire « ma amie » ferait se heurter deux sons «
    a ». Devant un nom féminin qui commence par une voyelle, le déterminant possessif « ma » est donc remplacé par « mon »
    pour faciliter la prononciation. De même, on dit « ton école » et « son histoire ». C'est une forme particulière à mémoriser.
exercices:
- id: pluriel-cheval
  type: texte_court
  difficulte: 1
  enonce: Mets au pluriel le groupe nominal « ce cheval blanc ».
  reponse:
    acceptees:
    - ces chevaux blancs
    fautes_tolerees: 1
  indices:
    relance: Le déterminant démonstratif, le nom et l'adjectif doivent tous varier.
    methode: Le pluriel de cheval est irrégulier, il ne se forme pas simplement avec un s.
    etape: Ce devient ces, cheval devient chevaux (pluriel irrégulier), blanc devient blancs.
  pieges:
  - si:
      valeur: ces chevals blancs
    relance: 'Le pluriel de cheval n''est pas régulier : ce n''est pas chevals.'
  solution: ces chevaux blancs (le déterminant, le nom et l'adjectif varient tous en nombre).
- id: genre-garcon
  type: texte_court
  difficulte: 1
  enonce: Change le genre du groupe nominal « un petit garçon » (utilise un autre nom si besoin).
  reponse:
    acceptees:
    - une petite fille
    fautes_tolerees: 2
  indices:
    relance: Le déterminant et l'adjectif doivent aussi changer de genre.
    methode: Choisis un nom féminin correspondant, puis accorde le déterminant et l'adjectif.
    etape: un devient une, petit devient petite, garçon devient un nom féminin équivalent.
  solution: 'une petite fille : le déterminant, l''adjectif et le nom sont tous accordés au féminin.'
- id: ce-ou-cet
  type: choix
  difficulte: 1
  enonce: 'Complète avec le bon déterminant démonstratif : « … oiseau chante dans le jardin. »'
  reponse:
    options:
    - id: a
      texte: Cet
    - id: b
      texte: Ce
    - id: c
      texte: Cette
    - id: d
      texte: Ces
    bonnes:
    - a
  indices:
    relance: « Oiseau » est-il masculin ou féminin, singulier ou pluriel ?
    methode: Regarde aussi la première lettre du nom. Le déterminant change de forme devant une voyelle.
    etape: « Oiseau » est masculin singulier et commence par une voyelle.
  pieges:
  - si:
      contient:
      - b
    relance: Dis à voix haute « ce oiseau ». Devant une voyelle, le déterminant masculin prend une autre forme.
  - si:
      contient:
      - c
    relance: « Cette » s'emploie devant un nom féminin. On dit « un oiseau ».
  - si:
      contient:
      - d
    relance: « Ces » s'emploie au pluriel. Ici, il n'y a qu'un seul oiseau.
  solution: '« Cet oiseau » : « oiseau » est masculin singulier et commence par une voyelle, donc « ce » devient « cet ».'
- id: choix-classe-variable
  type: choix
  difficulte: 2
  enonce: Parmi ces classes de mots, laquelle NE varie JAMAIS en genre ni en nombre ?
  reponse:
    options:
    - id: a
      texte: l'adverbe
    - id: b
      texte: l'adjectif
    - id: c
      texte: le déterminant
    bonnes:
    - a
  indices:
    relance: Repère la classe de mots qui reste toujours identique, quelle que soit la phrase.
    methode: Une seule des trois classes proposées est invariable, les deux autres s'accordent avec le nom.
    etape: L'adjectif et le déterminant s'accordent avec le nom noyau, contrairement à un des trois mots proposés.
  pieges:
  - si:
      contient:
      - b
    relance: L'adjectif varie bien en genre et en nombre pour s'accorder avec le nom.
  - si:
      contient:
      - c
    relance: Le déterminant varie bien, par exemple « le », « la », « les ».
  solution: 'l''adverbe : cette classe de mots est invariable, contrairement au déterminant et à l''adjectif.'
- id: possessif-pluriel
  type: texte_court
  difficulte: 2
  enonce: 'Complète avec le déterminant possessif qui convient : « Les enfants rangent … cartables. » (les cartables appartiennent
    aux enfants)'
  reponse:
    acceptees:
    - leurs
    fautes_tolerees: 0
  indices:
    relance: Les cartables appartiennent à plusieurs personnes, les enfants.
    methode: Compte d'abord les possesseurs (un seul ou plusieurs), puis compte les objets possédés.
    etape: Il y a plusieurs cartables, donc le déterminant se met au pluriel.
  pieges:
  - si:
      valeur: leur
    relance: Il y a plusieurs cartables. Le déterminant possessif doit être au pluriel, lui aussi.
  - si:
      valeur: ses
    relance: « Ses » s'emploie quand il y a un seul possesseur. Ici, les cartables appartiennent à plusieurs enfants.
  solution: '« Les enfants rangent leurs cartables » : plusieurs possesseurs (les enfants) et plusieurs objets (les cartables),
    donc « leurs » avec un s.'
- id: association-variations
  type: association
  difficulte: 2
  enonce: Relie chaque mot de « Elle chantait, nous chantons » à ce qui le décrit.
  reponse:
    gauche:
    - id: a
      texte: chantait
    - id: b
      texte: chantons
    - id: c
      texte: nous
    droite:
    - id: x
      texte: verbe qui a varié en temps (imparfait)
    - id: y
      texte: verbe conjugué à la 1re personne du pluriel (présent)
    - id: z
      texte: pronom personnel, qui varie selon la personne
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Cherche quel mot indique un moment passé, quel mot indique l'action au présent, quel mot remplace un nom.
    methode: Le verbe peut varier en temps et en personne, le pronom personnel varie aussi selon la personne.
    etape: Deux de ces mots sont des verbes, un seul n'en est pas un. Commence par lui.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Distingue bien le critère du temps et celui de la personne.
  solution: chantait est un verbe à l'imparfait (variation de temps), chantons est un verbe à la 1re personne du pluriel,
    nous est un pronom personnel qui varie selon la personne.
- id: classer-variables-invariables
  type: association
  difficulte: 3
  enonce: Relie chaque mot de la phrase « Les petites chattes courent très vite. » à sa classe grammaticale.
  reponse:
    gauche:
    - id: les
      texte: Les
    - id: petites
      texte: petites
    - id: souris
      texte: chattes
    - id: courent
      texte: courent
    - id: vite
      texte: vite
    droite:
    - id: determinant
      texte: déterminant (varie en genre et en nombre)
    - id: adjectif
      texte: adjectif (varie en genre et en nombre)
    - id: nom
      texte: nom (varie en nombre)
    - id: verbe
      texte: verbe (varie en personne, en nombre et en temps)
    - id: adverbe
      texte: adverbe (invariable)
    paires:
      les: determinant
      petites: adjectif
      souris: nom
      courent: verbe
      vite: adverbe
  indices:
    relance: Commence par trouver le verbe, puis le nom noyau du groupe sujet.
    methode: Le déterminant est placé devant le nom, l'adjectif donne une précision sur le nom.
    etape: Un des mots ne change jamais de forme, même si on met la phrase au singulier. Lequel, et quelle classe est invariable
      ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Relis le mot qui précise le nom et celui qui précise le verbe.
  - si:
      diagnostic: associations_fausses
    relance: Reprends mot par mot. Lequel indique l'action ? Lequel est le nom ? Lequel ne change jamais ?
  solution: 'Les : déterminant. petites : adjectif. chattes : nom. courent : verbe. vite : adverbe, invariable.'
- id: ouverte-variations
  type: ouverte
  difficulte: 3
  enonce: Explique pourquoi on écrit « mon amie » et non « ma amie », en citant la classe de mots concernée.
  criteres:
  - L'élève identifie le déterminant possessif comme classe de mots concernée.
  - L'élève explique que c'est pour faciliter la prononciation devant une voyelle.
  - L'élève donne un autre exemple du même cas (ton école, son histoire…).
  indices:
    relance: Pense à la classe de mots qui précède amie et à ce qui commence le mot amie.
    methode: Un déterminant possessif féminin peut prendre une forme particulière devant un nom commençant par une voyelle.
    etape: 'amie commence par une voyelle : cela impose une forme spéciale du déterminant.'
  solution: On écrit mon amie car le déterminant possessif féminin « ma » devient « mon » devant un nom féminin qui commence
    par une voyelle, pour faciliter la prononciation.
- id: nblm-quels-sont-les-deux-criteres-de-variatio-1
  type: choix
  difficulte: 2
  enonce: Quels sont les deux critères de variation principaux pour le nom, l'adjectif et le déterminant ?
  reponse:
    options:
    - id: o1
      texte: Le genre (masculin / féminin) et le nombre (singulier / pluriel)
    - id: o2
      texte: Le temps et la personne
    - id: o3
      texte: Le radical et le suffixe
    - id: o4
      texte: La nature et la fonction
    bonnes:
    - o1
  indices:
    relance: Pense aux catégories qui indiquent si un mot est masculin ou féminin, singulier ou pluriel.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : confondre les critères des noms et adjectifs avec ceux du verbe, qui varie en temps et en personne.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : confondre les éléments de construction du mot (morphologie) avec ses critères de variation
      grammaticale.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : confondre les notions d''analyse grammaticale (nature/fonction) avec les marques de variation
      du mot.'
  solution: Le genre (masculin / féminin) et le nombre (singulier / pluriel). C'est exact ! D'après la fiche de la notion,
    le genre et le nombre sont les deux critères fondamentaux de variation pour ces classes de mots.
- id: nblm-parmi-les-classes-grammaticales-suivante-2
  type: choix
  difficulte: 2
  enonce: Parmi les classes grammaticales suivantes, laquelle est invariable et ne change donc pas de forme ?
