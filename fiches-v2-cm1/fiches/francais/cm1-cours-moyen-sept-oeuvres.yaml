# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-cours-moyen-sept-oeuvres
version: 2
etat: verifiee
declencheurs:
- sept livres à lire dans l'année
- conte, fable ou pièce de théâtre à lire
- livres étudiés en classe cette année
- œuvre complète
- lire un livre en entier
- c'est quoi un album
- livre documentaire en classe
- la maîtresse nous lit un livre
prerequis:
- cm1-volume-annuel-lectures
essentiel: 'Au cours moyen, c''est-à-dire en CM1 et en CM2, les professeurs font lire aux élèves au moins sept œuvres complètes
  chaque année.


  Une œuvre complète, c''est un livre lu en entier, du début à la fin. Lire seulement quelques pages d''un roman, c''est lire
  un extrait : cela ne compte pas comme une œuvre complète.


  Ces sept œuvres viennent de deux grandes familles. Il y a les œuvres du patrimoine, anciennes et connues depuis longtemps,
  et la littérature de jeunesse, écrite pour les enfants.


  Les œuvres sont de genres variés. Un conte raconte une histoire souvent magique (« Il était une fois... »). Une fable est
  une courte histoire, souvent avec des animaux, qui donne une leçon, la morale. Un poème joue avec les mots et les sons.
  Une pièce de théâtre est écrite pour être jouée.


  On lit aussi des récits, des albums, où les images et le texte racontent ensemble, et des textes documentaires, qui donnent
  des informations vraies sur le monde, par exemple sur les volcans ou les animaux.


  Il y a plusieurs façons de lire ces œuvres. Le professeur peut lire à voix haute pour toute la classe : c''est la lecture
  offerte. Les élèves lisent aussi à voix haute, ou en silence, chacun pour soi. On peut enfin écouter une lecture enregistrée.

  '
methode:
- Vérifier que le livre a été lu en entier, et pas seulement un extrait.
- Repérer, au fil de l'année, les œuvres complètes étudiées en classe.
- 'Identifier le genre de chaque œuvre : conte, fable, poème, pièce de théâtre, album, texte documentaire.'
- Noter chaque œuvre lue dans une liste, avec son genre.
- Compter les œuvres lues et calculer combien il en manque pour arriver à sept.
vocabulaire:
- terme: œuvre complète
  definition: un livre entier, et non un simple extrait.
- terme: extrait
  definition: un morceau choisi dans un livre, pas le livre entier.
- terme: fable
  definition: une courte histoire, souvent avec des animaux, qui se termine par une leçon appelée la morale.
- terme: album
  definition: un livre où les images et le texte racontent l'histoire ensemble.
- terme: texte documentaire
  definition: un texte qui donne des informations vraies sur le monde.
- terme: lecture offerte
  definition: une lecture faite à voix haute par le professeur pour toute la classe.
erreurs_frequentes:
- Croire qu'un seul genre (par exemple uniquement des contes) suffit à remplir l'objectif de l'année.
- Confondre un extrait de texte et une œuvre complète.
- Penser que seuls les romans comptent, alors qu'un album ou un texte documentaire peuvent aussi être des œuvres à lire.
- Croire qu'une œuvre lue par le professeur à voix haute ne compte pas.
exemple:
  enonce: 'En classe, on a lu cette année en entier : un recueil de fables, un album, une pièce de théâtre et un roman. Ces
    œuvres correspondent-elles à ce que demande le programme au cours moyen ?'
  solution: 'Oui, ce sont bien des œuvres complètes de genres variés (fables, album, théâtre, récit), comme le prévoit le
    programme. Mais l''année n''est pas finie : le programme demande au moins sept œuvres complètes par an. Il en manque encore
    7 - 4 = 3.'
exercices:
- id: nombre-oeuvres-cm
  type: nombre
  difficulte: 1
  enonce: Au cours moyen, combien d'œuvres complètes au minimum les professeurs font-ils lire aux élèves chaque année ?
  reponse:
    valeur: 7
    forme: entier
  indices:
    relance: 'Ce nombre correspond au total des deux catégories d''œuvres : patrimoine et littérature de jeunesse.'
    methode: Additionne le minimum d'œuvres du patrimoine (2) et le minimum de littérature de jeunesse (5).
    etape: 2 œuvres du patrimoine plus 5 ouvrages de littérature de jeunesse font un total de combien ?
  pieges:
  - si:
      valeur: 5
    relance: 5 est seulement le nombre d'ouvrages de littérature de jeunesse. Il faut ajouter les œuvres du patrimoine.
  - si:
      valeur: 2
    relance: 2 est seulement le nombre d'œuvres du patrimoine. Il faut ajouter la littérature de jeunesse.
  solution: Au cours moyen, les professeurs font lire au moins 7 œuvres complètes par an (sept œuvres).
- id: genres-non-au-programme
  type: choix
  difficulte: 1
  enonce: Parmi ces genres, lequel n'est PAS cité par le programme comme œuvre à lire au cours moyen ?
  reponse:
    options:
    - id: a
      texte: Un conte
    - id: b
      texte: Un manuel de mathématiques
    - id: c
      texte: Une pièce de théâtre
    - id: d
      texte: Un texte documentaire
    bonnes:
    - b
  indices:
    relance: 'Relis la liste des genres cités : contes, récits, fables, poèmes, pièces de théâtre, albums, textes documentaires.'
    methode: Un manuel scolaire n'est pas une œuvre littéraire ou documentaire au sens du programme de lecture.
    etape: Trois de ces quatre genres sont explicitement cités dans le programme. Cherche celui qui n'y figure pas.
  pieges:
  - si:
      contient:
      - a
    relance: Le conte fait bien partie des genres cités par le programme.
  - si:
      contient:
      - c
    relance: La pièce de théâtre fait bien partie des genres cités par le programme.
  - si:
      contient:
      - d
    relance: Le texte documentaire fait bien partie des genres cités par le programme.
  solution: Un manuel de mathématiques n'est pas un genre cité par le programme, qui parle de contes, récits, fables, poèmes,
    pièces de théâtre, albums et textes documentaires.
- id: oeuvre-complete-ou-extrait
  type: choix
  difficulte: 2
  enonce: Une classe a lu seulement trois pages d'un roman, choisies par le professeur, sans lire le reste du livre. Est-ce
    une œuvre complète ?
  reponse:
    options:
    - id: a
      texte: Non, ce n'est qu'un extrait, pas une œuvre complète
    - id: b
      texte: Oui, trois pages suffisent à compter comme une œuvre complète
    - id: c
      texte: Oui, si le professeur le décide, cela compte toujours comme une œuvre complète
    - id: d
      texte: Cela dépend uniquement du nombre d'élèves dans la classe
    bonnes:
    - a
  indices:
    relance: Une œuvre complète, c'est un livre entier. Trois pages représentent-elles le livre entier ?
    methode: Distingue bien un extrait (une partie d'un livre) d'une œuvre complète (le livre en entier).
    etape: Si seulement trois pages sont lues, le reste du livre n'a pas été lu.
  pieges:
  - si:
      contient:
      - b
    relance: Trois pages ne représentent qu'une petite partie du livre, pas le livre entier.
  - si:
      contient:
      - c
    relance: 'Ce n''est pas une décision du professeur qui change la définition : une œuvre complète reste un livre entier.'
  - si:
      contient:
      - d
    relance: Le nombre d'élèves ne change rien. Demande-toi seulement si le livre a été lu en entier.
  solution: Non, ce n'est qu'un extrait. Une œuvre complète est un livre entier, pas seulement quelques pages choisies.
- id: reconnaitre-les-genres
  type: association
  difficulte: 2
  enonce: Relie chaque genre à sa description.
  reponse:
    gauche:
    - id: conte
      texte: Un conte
    - id: fable
      texte: Une fable
    - id: theatre
      texte: Une pièce de théâtre
    - id: documentaire
      texte: Un texte documentaire
    droite:
    - id: magie
      texte: Une histoire souvent magique qui commence par « Il était une fois »
    - id: morale
      texte: Une courte histoire avec des animaux qui se termine par une leçon
    - id: jouee
      texte: Un texte écrit pour être joué par des comédiens
    - id: informations
      texte: Un texte qui donne des informations vraies sur le monde
    paires:
      conte: magie
      fable: morale
      theatre: jouee
      documentaire: informations
  indices:
    relance: Commence par le genre que tu reconnais le plus facilement.
    methode: Pour chaque genre, demande-toi s'il raconte une histoire inventée, s'il se joue, ou s'il informe.
    etape: Un seul de ces genres ne raconte pas une histoire inventée. Lequel ?
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Il reste une association à corriger. Pense à la leçon finale et à la formule « Il était une fois ».
  - si:
      diagnostic: associations_fausses
    relance: Reprends un genre à la fois et pense à un livre de ce genre que tu as déjà lu.
  solution: 'Le conte : une histoire souvent magique (« Il était une fois »). La fable : une courte histoire avec des animaux
    et une leçon, la morale. La pièce de théâtre : un texte écrit pour être joué. Le texte documentaire : des informations
    vraies sur le monde.'
- id: oeuvres-restantes
  type: nombre
  difficulte: 2
  enonce: En mars, une classe de CM1 a lu 4 œuvres complètes depuis la rentrée. Combien doit-elle encore en lire, au minimum,
    avant la fin de l'année ?
  reponse:
    valeur: 3
    forme: entier
  indices:
    relance: Combien d'œuvres complètes faut-il lire au minimum dans l'année ?
    methode: Fais une soustraction entre le nombre attendu et le nombre déjà lu.
    etape: Calcule 7 moins le nombre d'œuvres déjà lues.
  pieges:
  - si:
      valeur: 4
    relance: 4, c'est ce que la classe a déjà lu. Cherche ce qu'il reste à lire.
  - si:
      valeur: 11
    relance: Tu as additionné. Il faut retirer ce qui est déjà lu du total attendu.
  solution: 'Il faut au moins 7 œuvres complètes dans l''année. 7 - 4 = 3 : la classe doit encore lire au moins 3 œuvres.'
- id: facon-de-lire
  type: texte_court
  difficulte: 1
  enonce: Comment appelle-t-on la lecture que le professeur fait à voix haute pour toute la classe ?
  reponse:
    acceptees:
    - lecture offerte
    - la lecture offerte
    - une lecture offerte
    fautes_tolerees: 2
  indices:
    relance: Le professeur fait un cadeau à la classe en lisant pour elle.
    methode: Le nom est formé du mot « lecture » suivi d'un adjectif.
    etape: L'adjectif vient du verbe « offrir ».
  pieges:
  - si:
      valeur: lecture silencieuse
    relance: Dans la lecture silencieuse, chacun lit pour soi sans parler. Ici, c'est le professeur qui lit à voix haute.
  - si:
      valeur: lecture enregistrée
    relance: Une lecture enregistrée s'écoute sur un appareil. Ici, le professeur lit lui-même devant la classe.
  solution: 'C''est la lecture offerte : le professeur lit à voix haute une œuvre pour toute la classe.'
- id: annee-variee
  type: choix
  difficulte: 3
  enonce: Voici les listes de lecture de trois classes de CM1 à la fin de l'année. Laquelle respecte le mieux le programme
    ?
  reponse:
    options:
    - id: a
      texte: Sept contes lus en entier, tous du même recueil
    - id: b
      texte: Sept livres lus en entier, dont des fables, un album, une pièce de théâtre, des récits et un documentaire
    - id: c
      texte: Dix extraits de romans différents, de deux pages chacun
    bonnes:
    - b
  indices:
    relance: Le programme demande un nombre minimum d'œuvres, mais aussi des œuvres complètes et variées.
    methode: 'Vérifie trois choses pour chaque liste : le nombre d''œuvres, s''il s''agit de livres entiers, et la variété
      des genres.'
    etape: Une liste ne contient que des extraits, une autre qu'un seul genre. Que reste-t-il ?
  pieges:
  - si:
      contient:
      - a
    relance: Il y a bien sept œuvres complètes, mais toutes du même genre. Le programme demande des genres variés.
  - si:
      contient:
      - c
    relance: Dix, c'est beaucoup, mais ce sont des extraits. Est-ce que ce sont des œuvres complètes ?
  solution: 'La liste b : sept livres lus en entier, de genres variés (fables, album, théâtre, récits, documentaire). La liste
    a n''a qu''un seul genre, et la liste c ne contient que des extraits.'
- id: ma-liste-de-lecture
  type: ouverte
  difficulte: 2
  enonce: Fais la liste des livres que ta classe a lus en entier depuis la rentrée. Écris le genre de chacun, puis dis combien
    il en manque pour arriver à sept.
  criteres:
  - L'élève cite des livres lus en entier, sans y mettre de simples extraits.
  - L'élève donne un genre correct pour chaque livre (conte, fable, poème, théâtre, album, récit, documentaire).
  - L'élève calcule juste combien d'œuvres il reste à lire pour atteindre sept.
  indices:
    relance: Pense aux livres lus en classe, y compris ceux que le professeur a lus à voix haute.
    methode: Pour chaque livre, demande-toi s'il raconte une histoire magique, s'il se joue, s'il a une morale ou s'il informe.
    etape: Compte les livres de ta liste, puis fais 7 moins ce nombre.
  solution: 'Exemple : « Un recueil de fables (fable), un album (album), un roman (récit). Nous avons lu 3 œuvres, il en manque
    7 - 3 = 4. »'
