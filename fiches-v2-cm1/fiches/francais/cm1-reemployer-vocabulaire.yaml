format: 2
notion: cm1-reemployer-vocabulaire
version: 1
etat: verifiee
declencheurs:
- réutiliser un mot appris
- employer un mot nouveau
- utiliser un mot dans une rédaction
- mot polysémique
- mot qui a plusieurs sens
- éviter de répéter le même mot
prerequis: []
essentiel: 'Réemployer le vocabulaire, c''est utiliser à bon escient, à l''oral comme à l''écrit, les mots que tu as appris,
  pour te les approprier durablement.


  Certains mots ont plusieurs sens selon le contexte : on dit qu''ils sont polysémiques. Tu dois apprendre à bien les utiliser
  dans différentes matières.


  Réemployer un mot appris dans un exposé ou une rédaction montre que tu l''as vraiment compris, pas seulement mémorisé pour
  un contrôle.


  Tu peux t''aider d''outils comme une liste de synonymes ou d''antonymes pour améliorer un texte que tu écris.

  '
methode:
- Repérer, dans une liste de mots appris, ceux qui correspondent à ce que tu veux dire.
- Vérifier que le sens du mot correspond bien à la situation (surtout pour un mot polysémique).
- Utiliser le mot dans une phrase complète, à l'oral ou à l'écrit.
- Relire ou réécouter pour vérifier que le mot est employé correctement.
- Réutiliser régulièrement les mots appris dans de nouvelles situations pour ne pas les oublier.
vocabulaire:
- terme: mot polysémique
  definition: un mot qui a plusieurs sens selon le contexte où il est employé
erreurs_frequentes:
- Employer un mot polysémique avec le mauvais sens pour la situation.
- N'utiliser un mot appris qu'une seule fois puis l'oublier.
- Ne pas relire son texte pour vérifier que le vocabulaire appris est bien utilisé.
exemple:
  enonce: 'Le mot « feuille » est polysémique. Utilise-le dans deux phrases avec un sens différent : une en lien avec les
    arbres, une en lien avec l''école.'
  solution: 'Exemple : « La feuille de l''arbre est tombée. » (partie d''une plante) et « J''ai pris une feuille pour écrire.
    » (papier).'
exercices:
- id: definir-polysemique
  type: choix
  difficulte: 1
  enonce: Que veut dire qu'un mot est « polysémique » ?
  reponse:
    options:
    - id: a
      texte: Il a plusieurs sens selon le contexte où il est employé
    - id: b
      texte: Il n'a qu'un seul sens possible, toujours le même
    - id: c
      texte: Il ne peut être utilisé qu'à l'écrit, jamais à l'oral
    bonnes:
    - a
  indices:
    relance: Pense au mot « vue » ou « tête », qui changent de sens selon la phrase.
    methode: Élimine l'option qui décrit un mot n'ayant qu'un seul sens.
    etape: '« Poly- » veut dire « plusieurs » : un mot polysémique a plusieurs sens.'
  pieges:
  - si:
      contient:
      - b
    relance: 'C''est le contraire : un mot polysémique a justement plusieurs sens, pas un seul.'
  - si:
      contient:
      - c
    relance: Un mot polysémique peut être utilisé aussi bien à l'oral qu'à l'écrit.
  solution: Un mot polysémique a plusieurs sens selon le contexte où il est employé.
- id: pourquoi-reemployer
  type: choix
  difficulte: 1
  enonce: Pourquoi est-il utile de réemployer un mot appris dans un exposé ou une rédaction ?
  reponse:
    options:
    - id: a
      texte: Cela montre qu'on a vraiment compris le mot, pas seulement mémorisé pour un contrôle
    - id: b
      texte: Cela permet d'oublier plus vite le mot une fois le contrôle passé
    - id: c
      texte: Cela n'a aucune utilité particulière
    bonnes:
    - a
  indices:
    relance: Pense à la différence entre mémoriser un mot pour un contrôle et vraiment se l'approprier.
    methode: Élimine les options qui ne valorisent pas la compréhension durable du mot.
    etape: Réutiliser un mot dans différentes situations aide à ne pas l'oublier et à bien le comprendre.
  pieges:
  - si:
      contient:
      - b
    relance: Au contraire, réemployer un mot aide à ne pas l'oublier, pas à l'oublier plus vite.
  - si:
      contient:
      - c
    relance: 'Réemployer un mot a une vraie utilité : cela montre une compréhension durable, pas juste ponctuelle.'
  solution: Réemployer un mot appris montre qu'on l'a vraiment compris, pas seulement mémorisé pour un contrôle, et aide à
    se l'approprier durablement.
- id: outil-ameliorer-texte
  type: texte_court
  difficulte: 1
  enonce: Quel type de liste peux-tu utiliser pour trouver un mot différent et améliorer un texte que tu écris ?
  reponse:
    acceptees:
    - une liste de synonymes
    - liste de synonymes
    - des synonymes
    - synonymes
    fautes_tolerees: 2
  indices:
    relance: Pense à des mots qui veulent dire presque la même chose que celui que tu utilises trop souvent.
    methode: 'Relis l''essentiel de la leçon : quel outil est cité pour améliorer un texte ?'
    etape: Ce mot est le même que dans la notion « établir des relations entre les mots » vue précédemment.
  pieges:
  - si:
      valeur: un dictionnaire
    relance: Un dictionnaire donne des définitions, mais l'outil cité ici sert précisément à trouver des mots de sens proche.
  solution: On peut utiliser une liste de synonymes (ou d'antonymes) pour améliorer un texte que l'on écrit.
- id: deux-sens-feuille
  type: ouverte
  difficulte: 2
  enonce: 'Le mot « feuille » est polysémique. Utilise-le dans deux phrases avec un sens différent : une en lien avec les
    arbres, une en lien avec l''école.'
  criteres:
  - La première phrase utilise « feuille » au sens de partie d'une plante ou d'un arbre.
  - La seconde phrase utilise « feuille » au sens de papier utilisé à l'école.
  indices:
    relance: Pense à une feuille qui tombe d'un arbre, et à une feuille sur laquelle on écrit.
    methode: Écris d'abord la phrase sur l'arbre, puis la phrase sur l'école, en gardant le même mot « feuille ».
    etape: Une feuille d'arbre pousse et tombe ; une feuille d'école sert à écrire ou dessiner.
  solution: 'Exemple : « La feuille de l''arbre est tombée. » (partie d''une plante) et « J''ai pris une feuille pour écrire.
    » (papier).'
- id: deux-sens-champ
  type: ouverte
  difficulte: 2
  enonce: Écris deux phrases en réemployant le mot « champ » avec deux sens différents (un lien avec l'agriculture, un lien
    avec un domaine d'étude comme « le champ lexical »).
  criteres:
  - La première phrase utilise « champ » au sens de terrain cultivé.
  - La seconde phrase utilise « champ » au sens d'un ensemble de mots ou d'idées liées à un thème.
  indices:
    relance: Pense à un terrain cultivé par un agriculteur, et à un ensemble de mots liés à un même thème.
    methode: Écris d'abord la phrase sur l'agriculture, puis la phrase sur le vocabulaire, en gardant le mot « champ ».
    etape: Un « champ lexical » regroupe les mots liés à une même idée, comme la mer.
  solution: 'Exemple : « Le paysan laboure son champ. » et « Le champ lexical de la mer contient le mot vague. »'
- id: remplacer-dire
  type: ouverte
  difficulte: 3
  enonce: Dans une rédaction que tu écris, remplace le verbe « dire » utilisé trois fois par trois synonymes différents (expliquer,
    raconter, affirmer par exemple).
  criteres:
  - Les trois occurrences du verbe « dire » sont remplacées par des synonymes.
  - Chaque synonyme convient au sens exact de la phrase où il est utilisé.
  - La répétition du mot « dire » est évitée.
  indices:
    relance: Choisis un synonyme adapté au sens exact de chaque phrase.
    methode: Repère les trois phrases contenant « dire » et cherche, pour chacune, un synonyme qui garde le même sens.
    etape: Par exemple, « expliquer » convient pour donner une raison, « raconter » pour une histoire, « affirmer » pour une
      certitude.
  solution: Réussite si les trois synonymes conviennent au sens de chaque phrase et évitent la répétition du mot « dire ».
