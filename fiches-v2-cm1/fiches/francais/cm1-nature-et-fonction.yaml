# Fiche v2 (format : docs/FICHES-V2.md). EXPÉRIMENTALE tant que `relecture.statut` n'est pas `relue`.
# Licence : voir `sources` et le bibliotheque.yaml du dossier. Relecture bienvenue.
format: 2
notion: cm1-nature-et-fonction
version: 3
etat: verifiee
declencheurs:
- nature d'un mot
- classe grammaticale
- fonction d'un mot
- c'est quoi comme mot
- nature ou fonction
- quelle nature
- rôle du mot dans la phrase
- différence nature fonction
prerequis:
- cm1-analyser-phrase-simple
essentiel: 'Chaque mot d''une phrase peut être décrit de deux façons : par sa nature et par sa fonction. Ce sont deux questions
  différentes.


  La nature d''un mot, on dit aussi sa classe grammaticale, répond à la question « Quelle sorte de mot est-ce ? ». Par exemple
  : nom, verbe, adjectif, adverbe, déterminant, conjonction, pronom. Un mot garde toujours la même nature, quelle que soit
  la phrase : « chat » est toujours un nom.


  La fonction répond à une autre question : « Quel rôle joue ce mot, ou ce groupe de mots, dans cette phrase ? ». Par exemple,
  il peut être sujet ou complément. La fonction dépend de la phrase.


  Compare « Le chat dort. » et « Je caresse le chat. ». Dans les deux phrases, « le chat » est un groupe nominal : sa nature
  ne change pas. Dans la première, il est sujet du verbe « dort ». Dans la seconde, il est complément du verbe « caresse ».


  À l''inverse, des mots de natures différentes peuvent avoir la même fonction. Dans « Le facteur travaille. » et « Il travaille.
  », le groupe nominal « le facteur » et le pronom « Il » sont tous les deux sujets. On le vérifie en remplaçant l''un par
  l''autre.


  Le verbe est le pivot de la phrase : c''est autour de lui que s''organisent les autres éléments, comme le sujet. Pour trouver
  une fonction, pars donc toujours du verbe.

  '
methode:
- Pour trouver la nature d'un mot, se demander à quelle catégorie il appartient (nom, verbe, adjectif...).
- Pour trouver la fonction d'un mot ou d'un groupe, repérer d'abord le verbe de la phrase.
- Se demander quel rôle le mot ou le groupe joue autour de ce verbe, dans cette phrase précise.
- Se rappeler qu'un nom propre, un pronom ou un groupe nominal, même différents en nature, peuvent avoir la même fonction
  (sujet).
- 'Utiliser la substitution pour vérifier : remplacer un groupe nominal sujet par un pronom personnel.'
vocabulaire:
- terme: nature (ou classe grammaticale)
  definition: 'la catégorie d''un mot : nom, verbe, adjectif, adverbe, déterminant, conjonction, pronom'
- terme: fonction
  definition: le rôle que joue un mot ou un groupe dans une phrase précise, comme sujet
- terme: sujet
  definition: la fonction du mot ou du groupe qui répond à la question « qui est-ce qui ? » posée devant le verbe
- terme: complément
  definition: une fonction de mot ou de groupe qui complète le verbe ou la phrase
- terme: pivot de la phrase
  definition: le verbe, autour duquel s'organisent les autres éléments de la phrase
erreurs_frequentes:
- 'Confondre nature et fonction : dire qu''un mot « est sujet » comme s''il s''agissait de sa nature.'
- Penser qu'un mot change de nature selon la phrase, alors que seule sa fonction peut changer.
- Oublier que des mots de natures différentes (nom propre, pronom, groupe nominal) peuvent avoir la même fonction.
- Chercher la fonction d'un mot sans regarder le verbe de la phrase.
exemple:
  enonce: Dans la phrase « Il distribue le courrier. », quelle est la nature du mot « Il » et quelle est sa fonction ?
  solution: '« Il » est un pronom personnel : c''est sa nature, elle ne change jamais. Dans cette phrase, il occupe la fonction
    de sujet du verbe « distribue », car il répond à la question « qui est-ce qui distribue le courrier ? ».'
exercices:
- id: nature-il
  type: choix
  difficulte: 1
  enonce: Quelle est la nature du mot « Il » dans « Il travaille fort. » ?
  reponse:
    options:
    - id: a
      texte: nom
    - id: b
      texte: pronom personnel
    - id: c
      texte: déterminant
    bonnes:
    - b
  indices:
    relance: Ce mot remplace-t-il un nom ?
    methode: Une des trois catégories proposées remplace un nom et peut être sujet.
    etape: '« Il » ne se place pas devant un nom : il remplace un nom déjà connu.'
  pieges:
  - si:
      contient:
      - c
    relance: Un déterminant se place toujours devant un nom. Est-ce le cas ici ?
  - si:
      contient:
      - a
    relance: Un nom désigne une personne, un animal ou une chose. Ici, le mot ne fait que remplacer quelqu'un dont on a déjà
      parlé.
  solution: 'pronom personnel : il remplace un nom et occupe ici la fonction de sujet.'
- id: question-du-role
  type: choix
  difficulte: 1
  enonce: Ta maîtresse demande « Quel rôle joue ce groupe de mots dans la phrase ? ». Que cherche-t-elle ?
  reponse:
    options:
    - id: a
      texte: sa nature
    - id: b
      texte: sa fonction
    - id: c
      texte: son nombre de lettres
    bonnes:
    - b
  indices:
    relance: La question parle-t-elle de la sorte de mot, ou de ce que le groupe fait dans cette phrase précise ?
    methode: Une des deux notions répond à « quelle sorte de mot ? », l'autre à « quel rôle dans la phrase ? ».
    etape: La sorte de mot ne change jamais. Ce qu'on te demande ici dépend de la phrase.
  pieges:
  - si:
      contient:
      - a
    relance: La nature, c'est la sorte de mot (nom, verbe...). Or la question parle du rôle dans la phrase.
  - si:
      contient:
      - c
    relance: Compter les lettres ne dit rien sur la grammaire de la phrase. Relis bien la question de la maîtresse.
  solution: 'Elle cherche la fonction : le rôle que joue le groupe dans cette phrase (par exemple sujet ou complément).'
- id: fonction-facteur
  type: texte_court
  difficulte: 1
  enonce: Dans « Le facteur travaille. », quelle est la fonction du groupe « le facteur » ?
  reponse:
    acceptees:
    - sujet
    fautes_tolerees: 1
  indices:
    relance: Ce groupe répond-il à « qui est-ce qui travaille ? ».
    methode: Le groupe qui répond à qui est-ce qui fait l'action occupe une fonction bien précise dans la phrase.
    etape: Pose la question « qui est-ce qui travaille ? ».
  solution: 'sujet : le groupe le facteur répond à qui est-ce qui travaille.'
- id: remplacement-pronom
  type: texte_court
  difficulte: 1
  enonce: Remplace le groupe nominal sujet par un pronom personnel dans « Ma sœur range sa chambre. »
  reponse:
    acceptees:
    - Elle range sa chambre.
    fautes_tolerees: 2
  indices:
    relance: « Ma sœur » désigne une personne féminine.
    methode: Un groupe nominal sujet se remplace par un pronom de même genre et de même nombre.
    etape: Remplace ma sœur par le pronom qui convient.
  solution: Elle range sa chambre.
- id: meme-fonction
  type: choix
  difficulte: 2
  enonce: Dans « Le facteur travaille. » et « Il travaille. », qu'est-ce qui ne change pas entre les deux sujets ?
  reponse:
    options:
    - id: a
      texte: la nature
    - id: b
      texte: la fonction
    - id: c
      texte: le nombre de mots
    bonnes:
    - b
  indices:
    relance: 'Le facteur est un groupe nominal, Il est un pronom personnel : la catégorie change-t-elle ?'
    methode: Le rôle joué dans la phrase peut rester le même même si la catégorie du mot change.
    etape: Les deux mots jouent le même rôle devant le verbe travaille.
  pieges:
  - si:
      contient:
      - a
    relance: 'Groupe nominal et pronom personnel sont deux catégories différentes : la nature change bien.'
  - si:
      contient:
      - c
    relance: « Le facteur » compte deux mots, « Il » un seul. Ce nombre change donc. Cherche autre chose.
  solution: 'la fonction : dans les deux phrases, le groupe occupe la fonction de sujet, même si sa nature change (groupe
    nominal puis pronom).'
- id: fonction-change-chat
  type: choix
  difficulte: 2
  enonce: Dans « Je caresse le chat. », quelle est la fonction du groupe « le chat » ?
  reponse:
    options:
    - id: a
      texte: sujet du verbe
    - id: b
      texte: complément du verbe
    - id: c
      texte: déterminant
    bonnes:
    - b
  indices:
    relance: Qui est-ce qui caresse ? Est-ce le chat ?
    methode: Trouve d'abord le verbe et son sujet. Le groupe « le chat » vient après le verbe et dit ce qu'on caresse.
    etape: Le sujet de « caresse » est « Je ». Le groupe « le chat » joue donc un autre rôle.
  pieges:
  - si:
      contient:
      - a
    relance: Pose la question « qui est-ce qui caresse ? ». La réponse n'est pas le chat.
  - si:
      contient:
      - c
    relance: Déterminant est une nature, pas une fonction. Et « le chat » est un groupe entier.
  solution: 'complément du verbe : le sujet est « Je » (qui est-ce qui caresse ? je). Le groupe nominal « le chat » complète
    le verbe caresse. Sa nature reste groupe nominal, mais sa fonction n''est pas la même que dans « Le chat dort. ».'
- id: association-nature-fonction
  type: association
  difficulte: 2
  enonce: Relie chaque mot à sa nature dans la phrase « Le petit chat dort calmement ».
  reponse:
    gauche:
    - id: a
      texte: le
    - id: b
      texte: petit
    - id: c
      texte: calmement
    droite:
    - id: x
      texte: déterminant
    - id: y
      texte: adjectif
    - id: z
      texte: adverbe
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Cherche lequel se place devant le nom, lequel précise le nom, lequel précise le verbe.
    methode: Le déterminant précède le nom, l'adjectif qualifie le nom, l'adverbe est invariable et précise souvent le verbe.
    etape: 'Pour chaque mot, demande-toi : est-il devant le nom, précise-t-il le nom, ou précise-t-il le verbe ?'
  pieges:
  - si:
      diagnostic: une_erreur
    relance: 'Une seule association est fausse. Repère celui qui précise le verbe : il se termine souvent par -ment.'
  - si:
      diagnostic: associations_fausses
    relance: Commence par le mot placé juste devant le nom chat, puis par celui qui précise le verbe dort.
  solution: le-déterminant, petit-adjectif, calmement-adverbe.
- id: trier-nature-ou-fonction
  type: association
  difficulte: 3
  enonce: Ces mots servent à décrire les mots d'une phrase. Relie chacun à ce qu'il désigne, une nature ou une fonction.
  reponse:
    gauche:
    - id: a
      texte: adjectif
    - id: b
      texte: sujet
    - id: c
      texte: pronom
    - id: d
      texte: complément
    droite:
    - id: x
      texte: une nature
    - id: y
      texte: une fonction
    paires:
      a: x
      b: y
      c: x
      d: y
  indices:
    relance: Lesquels de ces mots disent quelle sorte de mot c'est ? Lesquels disent un rôle dans la phrase ?
    methode: 'Pour chaque mot, demande-toi : est-ce une catégorie qui ne change jamais, ou un rôle qui dépend de la phrase
      ?'
    etape: Un nom, un verbe, un déterminant sont des catégories. Range adjectif et pronom avec eux, puis regarde les deux
      autres.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association est fausse. Lequel de ces mots répond à « qui est-ce qui ? » devant le verbe ?
  - si:
      diagnostic: associations_fausses
    relance: Pense à la liste des sortes de mots (nom, verbe, adjectif...). Les mots de cette liste vont ensemble.
  solution: 'Natures : adjectif et pronom (des sortes de mots). Fonctions : sujet et complément (des rôles dans la phrase).'
- id: ouverte-nature-fonction
  type: ouverte
  difficulte: 3
  enonce: Dans la phrase « Les enfants chantent une chanson joyeuse. », explique la différence entre la nature et la fonction
    du groupe « les enfants ».
  criteres:
  - L'élève indique que « les enfants » est un groupe nominal (nature).
  - L'élève indique que « les enfants » occupe la fonction de sujet.
  - L'élève explique que la nature ne change pas d'une phrase à l'autre, alors que la fonction dépend de la phrase.
  indices:
    relance: Pense à ce qu'est ce groupe (sa catégorie) et à son rôle dans cette phrase précise.
    methode: La nature reste toujours la même, la fonction dépend de la phrase.
    etape: Ce groupe répond à qui est-ce qui chante.
  solution: '« Les enfants » est un groupe nominal : c''est sa nature. Dans cette phrase, il occupe la fonction de sujet du
    verbe chantent, car il répond à qui est-ce qui chante.'
- id: nblm-qu-est-ce-que-la-nature-d-un-mot-aussi-a-1
  type: choix
  difficulte: 2
  enonce: Qu'est-ce que la nature d'un mot (aussi appelée sa classe grammaticale) ?
  reponse:
    options:
    - id: o1
      texte: C'est la catégorie à laquelle appartient le mot, et elle ne change pas quelle que soit la phrase.
    - id: o2
      texte: C'est le rôle que joue le mot dans une phrase précise, comme sujet ou complément.
    - id: o3
      texte: C'est le fait d'être placé au début ou à la fin de la phrase.
    - id: o4
      texte: C'est une étiquette qui change à chaque fois qu'on change de phrase.
    bonnes:
    - o1
  indices:
    relance: Pense à ce qui définit l'identité fixe d'un mot dans le dictionnaire.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Attention, cela définit la fonction du mot dans la phrase, pas sa nature.
  - si:
      contient:
      - o3
    relance: 'Erreur classique : la place du mot dans la phrase ne définit pas sa classe grammaticale.'
  - si:
      contient:
      - o4
    relance: 'Faux : un mot garde toujours la même nature, c''est sa fonction qui peut changer selon la phrase.'
  solution: C'est la catégorie à laquelle appartient le mot, et elle ne change pas quelle que soit la phrase. C'est exact
    ! La nature (ou classe grammaticale) est l'identité fixe du mot (nom, verbe, adjectif, etc.).
- id: nblm-dans-une-phrase-a-quoi-correspond-la-fon-2
  type: choix
  difficulte: 2
  enonce: Dans une phrase, à quoi correspond la fonction d'un mot ou d'un groupe de mots ?
  reponse:
    options:
    - id: o1
      texte: Au rôle que joue ce mot ou ce groupe dans cette phrase précise, comme être sujet.
    - id: o2
      texte: À sa classe grammaticale comme nom, verbe ou adjectif.
    - id: o3
      texte: Au nombre de lettres que contient le mot.
    - id: o4
      texte: Au fait qu'il soit au masculin ou au féminin.
    bonnes:
    - o1
  indices:
    relance: Réfléchis au rôle ou au travail que le mot accomplit dans la phrase.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Attention : nom, verbe ou adjectif sont des natures (ou classes grammaticales), pas des fonctions.'
  - si:
      contient:
      - o3
    relance: La longueur d'un mot n'a rien à voir avec sa fonction grammaticale.
  - si:
      contient:
      - o4
    relance: Le genre (masculin/féminin) est une variation du mot, pas sa fonction dans la phrase.
  solution: Au rôle que joue ce mot ou ce groupe dans cette phrase précise, comme être sujet. Bravo ! La fonction indique
    le travail ou le rôle du mot dans la phrase.
- id: nblm-dans-la-phrase-il-distribue-le-courrier-3
  type: choix
  difficulte: 2
  enonce: Dans la phrase « Il distribue le courrier », quelle est la nature du mot « Il » et quelle est sa fonction ?
  reponse:
    options:
    - id: o1
      texte: 'Nature : pronom personnel ; Fonction : sujet du verbe distribuer.'
    - id: o2
      texte: 'Nature : sujet ; Fonction : pronom personnel.'
    - id: o3
      texte: 'Nature : nom propre ; Fonction : complément d''objet.'
    - id: o4
      texte: 'Nature : adjectif ; Fonction : verbe.'
    bonnes:
    - o1
  indices:
    relance: Demande-toi d'abord quelle est la catégorie du mot « Il », puis quel est son rôle face au verbe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur fréquente : tu as inversé la nature (pronom personnel) et la fonction (sujet).'
  - si:
      contient:
      - o3
    relance: 'Attention : « Il » n''est pas un nom propre et il n''est pas complément ici.'
  - si:
      contient:
      - o4
    relance: 'Faux : « Il » n''est ni un adjectif ni un verbe.'
  solution: 'Nature : pronom personnel ; Fonction : sujet du verbe distribuer. Excellente réponse ! « Il » est par nature
    un pronom personnel et joue ici le rôle de sujet.'
- id: nblm-est-il-possible-que-des-mots-de-natures-4
  type: choix
  difficulte: 2
  enonce: Est-il possible que des mots de natures différentes occupent la même fonction dans des phrases différentes ?
  reponse:
    options:
    - id: o1
      texte: Oui, un nom propre, un pronom ou un groupe nominal peuvent tous avoir la fonction de sujet.
    - id: o2
      texte: Non, seul un groupe nominal a le droit d'être sujet d'un verbe.
    - id: o3
      texte: Non, si deux mots ont la même fonction, ils ont obligatoirement la même nature.
    - id: o4
      texte: Oui, mais uniquement si les mots sont des adjectifs qualificatifs.
    bonnes:
    - o1
  indices:
    relance: Pense aux différents mots qu'on peut utiliser pour faire l'action de manger.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Faux : un pronom ou un nom propre peuvent aussi être sujets d''un verbe.'
  - si:
      contient:
      - o3
    relance: 'Erreur classique : des mots de catégories différentes peuvent exercer la même fonction.'
  - si:
      contient:
      - o4
    relance: 'Incomplet et faux : d''autres classes de mots comme les pronoms ou les noms peuvent partager la même fonction.'
  solution: Oui, un nom propre, un pronom ou un groupe nominal peuvent tous avoir la fonction de sujet. Exact ! Par exemple,
    « Jules », « Il » et « Le garçon » ont des natures différentes mais peuvent tous être sujets.
- id: nblm-quel-element-est-considere-comme-le-pivo-5
  type: choix
  difficulte: 2
  enonce: Quel élément est considéré comme le pivot de la phrase, autour duquel s'organisent les autres mots ?
  reponse:
    options:
    - id: o1
      texte: Le verbe (ou le groupe verbal).
    - id: o2
      texte: Le déterminant.
    - id: o3
      texte: L'adverbe.
    - id: o4
      texte: La conjonction de coordination.
    bonnes:
    - o1
  indices:
    relance: Trouve le mot d'action ou d'état qui s'accorde avec le sujet.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: Le déterminant introduit le nom dans le groupe nominal, mais ce n'est pas le pivot de toute la phrase.
  - si:
      contient:
      - o3
    relance: L'adverbe apporte des précisions mais n'est pas le pivot central de la phrase.
  - si:
      contient:
      - o4
    relance: La conjonction sert à relier des éléments, mais elle n'est pas le centre de la phrase.
  solution: Le verbe (ou le groupe verbal). C'est bien cela ! Le verbe est le cœur de la phrase autour duquel s'articulent
    le sujet et les compléments.
- id: nblm-parmi-les-propositions-suivantes-lesquel-6
  type: choix
  difficulte: 3
  enonce: Parmi les propositions suivantes, lesquelles désignent une nature (ou classe grammaticale) d'un mot ? (plusieurs
    réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Adjectif
    - id: o2
      texte: Adverbe
    - id: o3
      texte: Sujet
    - id: o4
      texte: Complément
    bonnes:
    - o1
    - o2
  indices:
    relance: Cherche les étiquettes fixes du dictionnaire, pas le rôle du mot dans la phrase.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o3
    relance: Attention, « sujet » est une fonction dans la phrase, pas une classe grammaticale !
  - si:
      contient:
      - o4
    relance: Attention, « complément » est un rôle dans la phrase, donc une fonction !
  solution: Adjectif ; Adverbe. Juste ! L'adjectif est une catégorie de mots (sa nature).
- id: nblm-quel-autre-terme-utilise-t-on-couramment-7
  type: texte_court
  difficulte: 1
  enonce: Quel autre terme utilise-t-on couramment pour désigner la nature d'un mot ?
  reponse:
    acceptees:
    - classe grammaticale
    fautes_tolerees: 1
  indices:
    relance: Ce terme est composé de deux mots et commence par « classe... ».
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: classe grammaticale. C'est exact ! On parle indifféremment de la nature ou de la classe grammaticale d'un mot.
- id: nblm-un-mot-garde-toujours-la-meme-nature-en-8
  type: texte_court
  difficulte: 1
  enonce: Un mot garde toujours la même nature. En revanche, dans une phrase, qu'est-ce qui peut changer selon la façon dont
    le mot est utilisé ?
  reponse:
    acceptees:
    - sa fonction
    fautes_tolerees: 1
  indices:
    relance: C'est le mot qui désigne le rôle ou le travail accompli par le mot dans la phrase.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  solution: sa fonction. Bravo ! C'est la fonction d'un mot qui change selon son rôle dans chaque phrase.
