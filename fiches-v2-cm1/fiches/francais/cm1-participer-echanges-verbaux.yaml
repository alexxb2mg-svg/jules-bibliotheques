  difficulte: 3
  enonce: Quelles sont les deux règles fondamentales à respecter pour bien échanger avec les autres lors d'un travail de groupe
    ? (plusieurs réponses possibles)
  reponse:
    options:
    - id: o1
      texte: Attendre son tour de parole sans couper la parole aux camarades
    - id: o2
      texte: Parler de façon claire avec un volume adapté à toute la classe
    - id: o3
      texte: Parler en même temps que son voisin pour exprimer son idée plus vite
    - id: o4
      texte: Répéter exactement la même idée qu'un camarade sans rien ajouter
    bonnes:
    - o1
    - o2
  indices:
    relance: Réfléchis aux bonnes habitudes qui permettent à chacun d'être écouté et compris au sein du groupe.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
