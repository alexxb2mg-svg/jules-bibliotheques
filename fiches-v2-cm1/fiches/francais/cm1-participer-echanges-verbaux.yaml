    - id: o2
      texte: Répéter la phrase d'un camarade pour parler plus longtemps
    - id: o3
      texte: Prendre la parole sans lever la main ni attendre l'accord
    - id: o4
      texte: Changer complètement de sujet sans aucun rapport avec le thème
    bonnes:
    - o1
  indices:
    relance: Réfléchis à ce qui enrichit la réflexion collective par rapport à ce qui a déjà été dit.
    methode: Élimine d'abord les propositions qui contredisent le cours, puis choisis parmi celles qui restent.
    etape: Commence par repérer le mot-clé de la question dans ton cours.
  pieges:
  - si:
      contient:
      - o2
    relance: 'Erreur typique : la répétition d''une idée déjà exprimée est une erreur fréquente qui n''enrichit pas le débat.'
  - si:
      contient:
      - o3
    relance: 'Erreur typique : intervenir sans y être autorisé rompt les règles de la communication en classe.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : les interventions doivent rester axées sur le thème du débat pour construire une réflexion
