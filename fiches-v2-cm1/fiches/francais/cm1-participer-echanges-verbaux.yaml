    relance: 'Erreur typique : parler en même temps qu''un autre crée du brouhaha et empêche toute écoute attentive.'
  - si:
      contient:
      - o4
    relance: 'Erreur typique : répéter sans apporter d''élément nouveau ne fait pas progresser la discussion du groupe.'
  solution: 'Attendre son tour de parole sans couper la parole aux camarades ; Parler de façon claire avec un volume adapté
    à toute la classe. C''est juste : attendre son tour est essentiel pour ne pas interrompre le fil de la réflexion de l''autre.'
- id: nblm-pour-respecter-les-regles-de-la-communic-7
  type: texte_court
