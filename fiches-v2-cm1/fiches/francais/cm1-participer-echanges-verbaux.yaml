- id: nblm-apres-avoir-pris-le-temps-de-discuter-en-5
  type: choix
  difficulte: 2
  enonce: Après avoir pris le temps de discuter en classe, que signifie « porter un regard critique sur l'oral produit » ?
  reponse:
