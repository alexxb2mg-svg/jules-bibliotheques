format: 2
notion: cm1-memoriser-orthographe-mots
version: 2
etat: verifiee
declencheurs:
- comment ça s'écrit
- faute d'orthographe
- mot de la même famille
- lettre muette
- dictée de mots
- mémoriser un mot
- métier au féminin
- lettre qu'on n'entend pas
- écrire sans faute
prerequis: []
essentiel: 'Les mots les plus fréquents, tu les lis et tu les écris tous les jours. Pour bien les orthographier, tu peux t''appuyer
  sur des régularités et sur la façon dont les mots sont formés, plutôt que d''apprendre chaque mot seul.


  Beaucoup de mots ont une famille : d''autres mots formés sur la même base, qu''on appelle le radical. Chercher un mot de
  la même famille aide à retrouver une lettre muette, une lettre qu''on écrit mais qu''on n''entend pas. Laid se termine par
  d, car on entend ce d dans laideur. Progrès prend un s, car on l''entend dans progresser.


  Le féminin aide aussi : on entend le t de petit dans petite, et le d de grand dans le mot au féminin. Un verbe peut aider
  : le t de chant s''entend dans chanter.


  D''autres mots suivent la règle d''un groupe régulier. Les noms de métiers en -teur ont souvent un féminin en -trice : agriculteur,
  agricultrice ; directeur, directrice. Attention, d''autres font -euse : chanteur, chanteuse.


  Quand tu lis, observe comment les mots sont construits : un même radical se retrouve dans plusieurs mots (dent, dentiste,
  dentaire). C''est la dimension morphologique des mots, leur forme.


  Pour les mots irréguliers très fréquents, il n''y a pas de règle simple : il faut les mémoriser directement, en les observant,
  en les copiant et en les écrivant plusieurs fois de mémoire.

  '
methode:
- Observer le mot et repérer la lettre ou le son qui fait hésiter.
- Chercher un mot de la même famille (ou le féminin, ou un verbe) où la lettre douteuse s'entend.
- Vérifier si le mot appartient à un groupe régulier, comme les métiers en -teur/-trice.
- Pour un mot irrégulier fréquent, le copier puis l'écrire plusieurs fois de mémoire.
- Relire ton texte pour vérifier l'orthographe des mots appris.
vocabulaire:
- terme: orthographe lexicale
  definition: la façon correcte d'écrire un mot, sans compter les accords
- terme: famille de mots
  definition: un groupe de mots formés sur la même base, comme hasard et hasardeux
- terme: radical
  definition: la partie commune aux mots d'une même famille, comme dent dans dentiste et dentaire
- terme: lettre muette
  definition: une lettre que l'on écrit mais que l'on n'entend pas, comme le d final de laid
- terme: régularité
  definition: une règle qui marche pour beaucoup de mots du même groupe
- terme: mot irrégulier
  definition: un mot fréquent qui ne suit pas de règle simple et qu'il faut apprendre par cœur
erreurs_frequentes:
- Oublier une lettre muette qu'on retrouverait en cherchant un mot de la même famille.
- Ne pas utiliser la régularité d'un groupe de mots pour écrire un mot nouveau du même type.
- Confondre deux mots qui se prononcent presque pareil mais s'écrivent différemment.
- Choisir un mot qui ressemble au son mais n'est pas de la même famille (lait pour laid).
- Appliquer une régularité à un mot qui ne la suit pas (chanteur ne fait pas « chantrice »).
exemple:
  enonce: Comment savoir que « progrès » s'écrit avec un s final, grâce à un mot de sa famille ?
  solution: 'On cherche un mot de la même famille : le verbe progresser. Dans progresser, on entend le son du s. Cela confirme
    que progrès s''écrit avec un s final, même si on ne l''entend pas.'
exercices:
- id: lettre-muette-grand
  type: choix
  difficulte: 1
  enonce: Quel mot t'aide à savoir que « grand » se termine par un d ?
  reponse:
    options:
    - id: a
      texte: grande
    - id: b
      texte: gras
    - id: c
      texte: graine
    - id: d
      texte: gramme
    bonnes:
    - a
  indices:
    relance: Cherche le mot où l'on entend clairement le son « d » à la fin.
    methode: Le féminin d'un adjectif fait souvent entendre sa lettre muette finale.
    etape: Dis « une … maison » avec le mot grand au féminin.
  pieges:
  - si:
      contient:
      - b
    relance: Gras n'est pas de la même famille que grand, et on n'y entend pas de « d ».
  - si:
      contient:
      - c
    relance: Graine commence pareil, mais ce n'est pas un mot de la famille de grand.
  - si:
      contient:
      - d
    relance: Gramme commence pareil, mais ce mot n'a rien à voir avec grand.
  solution: 'Le féminin grande fait entendre le d : donc grand s''écrit avec un d final.'
- id: famille-hasard
  type: texte_court
  difficulte: 1
  enonce: Écris un mot de la famille de « hasard » qui commence aussi par hasard- (verbe à l'infinitif).
  reponse:
    acceptees:
    - hasarder
    fautes_tolerees: 1
  indices:
    relance: Pense à un verbe qui veut dire agir sans être sûr du résultat.
    methode: Cherche un mot construit sur la même base que hasard, avec une terminaison de verbe à l'infinitif.
    etape: Le mot commence par hasard- et se termine par -er.
  pieges:
  - si:
      valeur: hasardeux
    relance: 'C''est bien un mot de la famille, mais c''est un adjectif : le mot demandé est un verbe à l''infinitif.'
  solution: 'hasarder : ce verbe partage la même base que hasard, ce qui aide à mémoriser son orthographe.'
- id: feminin-instituteur
  type: texte_court
  difficulte: 1
  enonce: Écris le féminin du mot « instituteur », sur le modèle agriculteur / agricultrice.
  reponse:
    acceptees:
    - institutrice
    fautes_tolerees: 1
  indices:
    relance: Dans agriculteur / agricultrice, quelle terminaison remplace -eur au féminin ?
    methode: Le groupe -eur devient -rice au féminin dans ce type de mots de métier.
    etape: Remplace la fin -eur d'instituteur par -rice.
  pieges:
  - si:
      valeur: instituteuse
    relance: Ce n'est pas la terminaison régulière de ce groupe de métiers. Revois agriculteur / agricultrice.
  solution: institutrice, comme agriculteur devient agricultrice.
- id: choix-lettre-muette
  type: choix
  difficulte: 2
  enonce: Quel mot de la même famille que « laid » permet de retrouver sa lettre finale ?
  reponse:
    options:
    - id: a
      texte: laideur
    - id: b
      texte: laisser
    - id: c
      texte: lait
    bonnes:
    - a
  indices:
    relance: Cherche un mot où l'on entend clairement la lettre finale de laid.
    methode: Un mot de la même famille garde souvent la même base à l'écrit.
    etape: Le mot cherché commence par laid- et se termine par -eur.
  pieges:
  - si:
      contient:
      - b
    relance: 'Ce mot ne partage pas la base de laid : sa base est laiss-, pas laid-.'
  - si:
      contient:
      - c
    relance: 'Ce mot se prononce presque pareil mais n''a pas la même base : il ne t''aide pas à retrouver la lettre de laid.'
  solution: 'laideur : cette famille de mots permet d''entendre le d final de laid.'
- id: famille-dent
  type: texte_court
  difficulte: 2
  enonce: Écris un mot de la famille de « dent » dans lequel on entend la lettre finale muette de dent.
  reponse:
    acceptees:
    - dentiste
    - dentaire
    - dentifrice
    - dentition
    - un dentiste
    - le dentifrice
    fautes_tolerees: 1
  indices:
    relance: Pense à la personne qui soigne les dents, ou à ce que tu mets sur ta brosse à dents.
    methode: Un mot de la même famille garde le même radical, ici dent-, et ajoute une fin.
    etape: Le mot commence par dent- ; il suffit d'y ajouter une terminaison.
  pieges:
  - si:
      valeur: danse
    relance: Danse se prononce un peu pareil au début, mais ce n'est pas un mot de la famille de dent.
  solution: 'dentiste (ou dentaire, dentifrice) : on y entend le t, ce qui confirme que dent s''écrit avec un t final.'
- id: association-lettres-muettes
  type: association
  difficulte: 2
  enonce: Relie chaque mot qui finit par une lettre muette au mot de sa famille qui fait entendre cette lettre.
  reponse:
    gauche:
    - id: chant
      texte: chant
    - id: bavard
      texte: bavard
    - id: tapis
      texte: tapis
    - id: petit
      texte: petit
    droite:
    - id: chanter
      texte: chanter
    - id: bavarder
      texte: bavarder
    - id: tapisser
      texte: tapisser
    - id: petite
      texte: petite
    paires:
      chant: chanter
      bavard: bavarder
      tapis: tapisser
      petit: petite
  indices:
    relance: Chaque mot de gauche a un mot de sa famille à droite. Lequel commence de la même façon ?
    methode: Garde le début du mot (son radical) et cherche à droite le mot qui le reprend.
    etape: Commence par le mot qui désigne ce que l'on met par terre dans un salon.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule association ne va pas. Vérifie que chaque paire garde bien le même début de mot.
  - si:
      diagnostic: associations_fausses
    relance: Prends un mot de gauche, lis son début, puis cherche à droite le mot qui commence exactement pareil.
  solution: chant → chanter (on entend le t), bavard → bavarder (le d), tapis → tapisser (le s), petit → petite (le t).
- id: association-metiers
  type: association
  difficulte: 2
  enonce: Relie chaque métier au masculin à sa forme au féminin.
  reponse:
    gauche:
    - id: a
      texte: agriculteur
    - id: b
      texte: directeur
    - id: c
      texte: chanteur
    droite:
    - id: x
      texte: agricultrice
    - id: y
      texte: directrice
    - id: z
      texte: chanteuse
    paires:
      a: x
      b: y
      c: z
  indices:
    relance: Deux métiers suivent le modèle -eur/-rice, un seul suit un autre modèle.
    methode: Vérifie chaque paire en te demandant si le féminin se termine par -rice ou par -euse.
    etape: agriculteur et directeur suivent -eur/-rice. Pour chanteur, la terminaison féminine est différente.
  pieges:
  - si:
      diagnostic: une_erreur
    relance: Une seule paire est fausse. Vérifie la terminaison féminine de chaque métier un par un.
  - si:
      diagnostic: associations_fausses
    relance: Repère d'abord les deux métiers qui suivent le modèle -eur/-rice avant de traiter le troisième.
  solution: agriculteur → agricultrice, directeur → directrice (modèle -eur/-rice), chanteur → chanteuse (modèle -eur/-euse).
- id: ordre-methode
  type: ordre
  difficulte: 2
  enonce: Range dans l'ordre les étapes pour retrouver l'orthographe d'un mot fréquent grâce à sa famille.
  reponse:
    elements:
    - id: observer
      texte: Observer le mot à orthographier
    - id: chercher
      texte: Chercher un mot de la même famille
    - id: comparer
      texte: Comparer les deux mots pour retrouver la lettre douteuse
    - id: ecrire
      texte: Écrire le mot avec la bonne orthographe
  indices:
    relance: Que dois-tu faire en tout premier, avant même de chercher un autre mot ?
    methode: Pars du mot à écrire, puis cherche de l'aide, puis compare, puis conclus.
    etape: Observer vient en premier, écrire vient en dernier. Range les deux étapes du milieu.
  pieges:
  - si:
      diagnostic: inversion_voisine
    relance: 'Presque : deux étapes voisines sont inversées. Laquelle vient avant l''autre ?'
  - si:
      diagnostic: ordre_faux
    relance: Repère d'abord la toute première étape et la toute dernière, puis range les deux du milieu.
  solution: Observer le mot, chercher un mot de la même famille, comparer les deux mots, puis écrire le mot correctement.
- id: ouverte-strategie
  type: ouverte
  difficulte: 3
  enonce: Explique en deux ou trois phrases comment tu ferais pour être sûr d'écrire correctement un mot difficile de ton
    cahier.
  criteres:
  - L'élève propose de chercher un mot de la même famille.
  - L'élève mentionne l'idée de mémoriser directement les mots irréguliers fréquents.
  - L'élève donne un exemple de mot dont il a retrouvé une lettre grâce à sa famille ou à son féminin.
  indices:
    relance: Que peux-tu faire quand un mot te semble difficile à écrire ?
    methode: Pense à la famille du mot, puis à la mémorisation directe si le mot est irrégulier.
    etape: Tu peux commencer par « D'abord, je cherche... ».
  solution: D'abord, je cherche un mot de la même famille pour retrouver une lettre douteuse (par exemple laideur pour laid).
    Si le mot est irrégulier et très fréquent, je le mémorise directement en l'écrivant plusieurs fois. Enfin, je relis mon
    texte pour vérifier.
