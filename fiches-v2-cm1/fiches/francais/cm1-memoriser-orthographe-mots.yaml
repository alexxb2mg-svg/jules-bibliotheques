  solution: Elle indique que « progrès » se termine par un « s » muet. C'est exact ! On entend clairement la consonne [s]
    dans le verbe « progresser », ce qui confirme le « s » muet à la fin de « progrès ».
- id: nblm-quelle-est-la-meilleure-methode-pour-mem-3
  type: choix
  difficulte: 2
  enonce: Quelle est la meilleure méthode pour mémoriser un mot fréquent mais irrégulier ?
  reponse:
