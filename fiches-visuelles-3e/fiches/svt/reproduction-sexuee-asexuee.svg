<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reproduction sexuée avec deux parents et fécondation, reproduction asexuée avec un seul parent et des clones">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="200" y="18" text-anchor="middle" dominant-baseline="central">Reproduction sexuée : deux parents</text>
<text class="th" x="555" y="18" text-anchor="middle" dominant-baseline="central">Reproduction asexuée</text>
<line x1="432" y1="10" x2="432" y2="430" stroke="#D3D1C7" stroke-width="1"/>

<g class="c-blue"><rect x="20" y="40" width="160" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="100" y="57" text-anchor="middle" dominant-baseline="central">Parent mâle</text>
<text class="ts" x="100" y="75" text-anchor="middle" dominant-baseline="central">patrimoine génétique</text></g>
<g class="c-coral"><rect x="220" y="40" width="160" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="300" y="57" text-anchor="middle" dominant-baseline="central">Parent femelle</text>
<text class="ts" x="300" y="75" text-anchor="middle" dominant-baseline="central">patrimoine génétique</text></g>

<line x1="100" y1="90" x2="100" y2="118" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="90" x2="300" y2="112" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><circle cx="100" cy="134" r="9" stroke-width="1"/></g>
<path d="M109 134 C118 128 124 140 133 134 C140 129 146 138 152 134" fill="none" stroke="#185FA5" stroke-width="1.5"/>
<g class="c-blue"><text class="th" x="100" y="160" text-anchor="middle" dominant-baseline="central">spermatozoïde</text>
<text class="ts" x="100" y="177" text-anchor="middle" dominant-baseline="central">gamète mâle</text></g>
<g class="c-coral"><circle cx="300" cy="136" r="22" stroke-width="1"/>
<text class="th" x="300" y="172" text-anchor="middle" dominant-baseline="central">ovule</text>
<text class="ts" x="300" y="189" text-anchor="middle" dominant-baseline="central">gamète femelle</text></g>

<line x1="112" y1="190" x2="186" y2="250" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="290" y1="202" x2="214" y2="250" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="th" x="200" y="214" text-anchor="middle" dominant-baseline="central">fécondation</text>

<path d="M200 254 A22 22 0 0 0 200 298 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<path d="M200 254 A22 22 0 0 1 200 298 Z" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="ts" x="232" y="270" text-anchor="start" dominant-baseline="central">cellule-œuf :</text>
<text class="ts" x="232" y="286" text-anchor="start" dominant-baseline="central">moitié père, moitié mère</text>

<line x1="200" y1="300" x2="200" y2="326" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="90" y="330" width="220" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="348" text-anchor="middle" dominant-baseline="central">Descendant unique</text>
<text class="ts" x="200" y="366" text-anchor="middle" dominant-baseline="central">nouvelle combinaison génétique,</text>
<text class="ts" x="200" y="381" text-anchor="middle" dominant-baseline="central">différent de ses deux parents</text></g>
<text class="ts" x="200" y="416" text-anchor="middle" dominant-baseline="central">Chez l'être humain : 23 + 23 = 46 chromosomes</text>

<g class="c-green"><rect x="475" y="40" width="160" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="57" text-anchor="middle" dominant-baseline="central">Un seul parent</text>
<text class="ts" x="555" y="75" text-anchor="middle" dominant-baseline="central">fraisier, géranium…</text></g>
<line x1="555" y1="90" x2="555" y2="126" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="475" y="130" width="160" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="147" text-anchor="middle" dominant-baseline="central">Un fragment</text>
<text class="ts" x="555" y="165" text-anchor="middle" dominant-baseline="central">bouture, stolon, tubercule</text></g>
<text class="ts" x="555" y="200" text-anchor="middle" dominant-baseline="central">pas de gamètes,</text>
<text class="ts" x="555" y="216" text-anchor="middle" dominant-baseline="central">pas de fécondation</text>
<line x1="540" y1="230" x2="500" y2="266" class="arr" marker-end="url(#arrow)"/>
<line x1="570" y1="230" x2="610" y2="266" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="450" y="270" width="100" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="287" text-anchor="middle" dominant-baseline="central">Clone</text>
<text class="ts" x="500" y="305" text-anchor="middle" dominant-baseline="central">identique</text></g>
<g class="c-green"><rect x="560" y="270" width="100" height="48" rx="8" stroke-width="0.5"/>
<text class="th" x="610" y="287" text-anchor="middle" dominant-baseline="central">Clone</text>
<text class="ts" x="610" y="305" text-anchor="middle" dominant-baseline="central">identique</text></g>
<g class="c-green"><text class="ts" x="555" y="346" text-anchor="middle" dominant-baseline="central">même patrimoine génétique</text>
<text class="ts" x="555" y="362" text-anchor="middle" dominant-baseline="central">que le parent</text></g>
</svg>
