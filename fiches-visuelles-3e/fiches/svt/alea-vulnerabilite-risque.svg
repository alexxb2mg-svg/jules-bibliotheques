<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tableau croisant aléa faible ou fort et vulnérabilité faible ou forte : le risque est élevé seulement quand les deux sont présents">
<g class="c-gray"><text class="th" x="287" y="24" text-anchor="middle" dominant-baseline="central">vulnérabilité faible</text>
<text class="ts" x="287" y="42" text-anchor="middle" dominant-baseline="central">peu de personnes exposées, bien préparées</text>
<text class="th" x="545" y="24" text-anchor="middle" dominant-baseline="central">vulnérabilité forte</text>
<text class="ts" x="545" y="42" text-anchor="middle" dominant-baseline="central">beaucoup de personnes, mal protégées</text>
<text class="th" x="80" y="120" text-anchor="middle" dominant-baseline="central">aléa fort</text>
<text class="ts" x="80" y="138" text-anchor="middle" dominant-baseline="central">phénomène intense</text>
<text class="ts" x="80" y="154" text-anchor="middle" dominant-baseline="central">ou fréquent</text>
<text class="th" x="80" y="262" text-anchor="middle" dominant-baseline="central">aléa faible</text>
<text class="ts" x="80" y="280" text-anchor="middle" dominant-baseline="central">phénomène modéré</text>
<text class="ts" x="80" y="296" text-anchor="middle" dominant-baseline="central">ou rare</text></g>

<g class="c-green"><rect x="160" y="64" width="254" height="136" rx="8" stroke-width="0.5"/>
<text class="th" x="287" y="92" text-anchor="middle" dominant-baseline="central">risque faible</text>
<text class="ts" x="287" y="118" text-anchor="middle" dominant-baseline="central">séisme violent dans un désert :</text>
<text class="ts" x="287" y="136" text-anchor="middle" dominant-baseline="central">presque personne n'est exposé</text>
<text class="ts" x="287" y="162" text-anchor="middle" dominant-baseline="central">(ou ville aux normes parasismiques)</text></g>
<g class="c-red"><rect x="418" y="64" width="254" height="136" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="92" text-anchor="middle" dominant-baseline="central">risque majeur</text>
<text class="ts" x="545" y="118" text-anchor="middle" dominant-baseline="central">séisme violent sous une grande</text>
<text class="ts" x="545" y="136" text-anchor="middle" dominant-baseline="central">ville aux bâtiments fragiles :</text>
<text class="ts" x="545" y="162" text-anchor="middle" dominant-baseline="central">catastrophe possible</text></g>
<g class="c-green"><rect x="160" y="206" width="254" height="136" rx="8" stroke-width="0.5"/>
<text class="th" x="287" y="234" text-anchor="middle" dominant-baseline="central">risque très faible</text>
<text class="ts" x="287" y="260" text-anchor="middle" dominant-baseline="central">petite crue dans une prairie</text>
<text class="ts" x="287" y="278" text-anchor="middle" dominant-baseline="central">sans habitation</text></g>
<g class="c-amber"><rect x="418" y="206" width="254" height="136" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="234" text-anchor="middle" dominant-baseline="central">risque modéré</text>
<text class="ts" x="545" y="260" text-anchor="middle" dominant-baseline="central">petite crue dans un quartier</text>
<text class="ts" x="545" y="278" text-anchor="middle" dominant-baseline="central">construit en zone inondable :</text>
<text class="ts" x="545" y="296" text-anchor="middle" dominant-baseline="central">caves et rez-de-chaussée inondés</text></g>
<text class="ts" x="20" y="360" text-anchor="start" dominant-baseline="central">Même aléa, risque différent : tout dépend de la vulnérabilité des personnes et des biens exposés.</text>
</svg>
