<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Plante chlorophyllienne : prélèvements, photosynthèse, sève brute et sève élaborée, stockage">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="0" y="300" width="680" height="112" fill="#F1EFE8"/>
<line x1="0" y1="300" x2="680" y2="300" stroke="#88877F" stroke-width="1"/>
<text class="ts" x="664" y="316" text-anchor="end" dominant-baseline="central">sol</text>
<text class="ts" x="664" y="284" text-anchor="end" dominant-baseline="central">air</text>

<g class="c-amber"><circle cx="60" cy="56" r="26" stroke-width="1"/>
<text class="th" x="60" y="100" text-anchor="middle" dominant-baseline="central">lumière</text></g>
<line x1="92" y1="66" x2="206" y2="112" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="90" y1="82" x2="200" y2="136" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-green"><text class="th" x="370" y="22" text-anchor="middle" dominant-baseline="central">Feuilles : photosynthèse</text>
<text class="ts" x="370" y="42" text-anchor="middle" dominant-baseline="central">la chlorophylle capte la lumière, des sucres sont fabriqués</text></g>

<rect x="332" y="96" width="16" height="204" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<g class="c-green"><ellipse cx="270" cy="128" rx="64" ry="20" stroke-width="1" transform="rotate(-20 270 128)"/>
<ellipse cx="410" cy="150" rx="64" ry="20" stroke-width="1" transform="rotate(20 410 150)"/>
<ellipse cx="340" cy="84" rx="14" ry="26" stroke-width="1"/></g>

<text class="ts" x="20" y="214" text-anchor="start" dominant-baseline="central">CO₂ de l'air :</text>
<text class="ts" x="20" y="230" text-anchor="start" dominant-baseline="central">entre dans la feuille</text>
<line x1="120" y1="200" x2="214" y2="152" class="arr" marker-end="url(#arrow)"/>

<line x1="476" y1="186" x2="560" y2="186" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="566" y="180" text-anchor="start" dominant-baseline="central">O₂ rejeté</text>
<text class="ts" x="566" y="196" text-anchor="start" dominant-baseline="central">dans l'air</text>

<line x1="320" y1="392" x2="320" y2="148" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="th" x="310" y="222" text-anchor="end" dominant-baseline="central">sève brute</text>
<text class="ts" x="310" y="240" text-anchor="end" dominant-baseline="central">eau + sels minéraux</text>
<text class="ts" x="310" y="256" text-anchor="end" dominant-baseline="central">des racines vers les feuilles</text></g>

<line x1="360" y1="178" x2="360" y2="352" stroke="#3B6D11" stroke-width="2.5" marker-end="url(#arrow)"/>
<g class="c-green"><text class="th" x="372" y="222" text-anchor="start" dominant-baseline="central">sève élaborée</text>
<text class="ts" x="372" y="240" text-anchor="start" dominant-baseline="central">sucres fabriqués par les feuilles</text>
<text class="ts" x="372" y="256" text-anchor="start" dominant-baseline="central">vers toute la plante</text></g>

<path d="M340 300 L340 390 M340 322 L296 368 M340 340 L392 368 M340 356 L304 402 M296 368 L270 380" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linecap="round"/>
<g class="c-blue"><text class="ts" x="20" y="340" text-anchor="start" dominant-baseline="central">racines et poils absorbants :</text>
<text class="ts" x="20" y="356" text-anchor="start" dominant-baseline="central">prélèvent l'eau et les sels minéraux</text></g>

<g class="c-green"><ellipse cx="428" cy="378" rx="34" ry="18" stroke-width="1"/>
<text class="th" x="474" y="370" text-anchor="start" dominant-baseline="central">stockage des réserves</text>
<text class="ts" x="474" y="388" text-anchor="start" dominant-baseline="central">tubercule, racine, fruits, graines</text></g>
<line x1="392" y1="368" x2="396" y2="372" stroke="#5F5E5A" stroke-width="2"/>

<text class="ts" x="20" y="428" text-anchor="start" dominant-baseline="central">bleu : sève brute · vert : production et sève élaborée · orange : lumière · pas à l'échelle</text>
</svg>
