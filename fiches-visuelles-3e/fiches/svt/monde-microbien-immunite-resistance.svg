<text class="th" x="110" y="196" text-anchor="middle" dominant-baseline="central">1. Avant</text>
<text class="ts" x="110" y="216" text-anchor="middle" dominant-baseline="central">quelques bactéries sont</text>
<text class="ts" x="110" y="232" text-anchor="middle" dominant-baseline="central">résistantes, par hasard</text>
<text class="ts" x="110" y="248" text-anchor="middle" dominant-baseline="central">(mutation de leur ADN)</text>
<text class="th" x="340" y="196" text-anchor="middle" dominant-baseline="central">2. Antibiotique</text>
<text class="ts" x="340" y="216" text-anchor="middle" dominant-baseline="central">les sensibles meurent,</text>
<text class="ts" x="340" y="232" text-anchor="middle" dominant-baseline="central">les résistantes survivent</text>
<text class="th" x="570" y="196" text-anchor="middle" dominant-baseline="central">3. Quelques jours après</text>
<text class="ts" x="570" y="216" text-anchor="middle" dominant-baseline="central">les résistantes se sont</text>
<text class="ts" x="570" y="232" text-anchor="middle" dominant-baseline="central">multipliées : l'antibiotique</text>
<text class="ts" x="570" y="248" text-anchor="middle" dominant-baseline="central">n'agit presque plus</text>
<g class="c-red"><rect x="20" y="272" width="640" height="44" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="286" text-anchor="middle" dominant-baseline="central">Plus on utilise d'antibiotiques, plus on sélectionne de bactéries résistantes :</text>
<text class="ts" x="340" y="302" text-anchor="middle" dominant-baseline="central">un enjeu majeur de santé publique.</text></g>
