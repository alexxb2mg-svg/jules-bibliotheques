<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trajet des messages nerveux pour attraper une balle">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="20" y="18" text-anchor="start" dominant-baseline="central">Exemple : attraper une balle qu'on te lance</text>

<g class="c-blue"><rect x="20" y="40" width="150" height="50" rx="8" stroke-width="0.8"/>
<text class="th" x="95" y="56" text-anchor="middle" dominant-baseline="central">Œil</text>
<text class="ts" x="95" y="75" text-anchor="middle" dominant-baseline="central">voit la balle arriver</text>
<rect x="20" y="130" width="150" height="50" rx="8" stroke-width="0.8"/>
<text class="th" x="95" y="146" text-anchor="middle" dominant-baseline="central">Oreille</text>
<text class="ts" x="95" y="165" text-anchor="middle" dominant-baseline="central">entend « attrape ! »</text>
<rect x="20" y="220" width="150" height="50" rx="8" stroke-width="0.8"/>
<text class="th" x="95" y="236" text-anchor="middle" dominant-baseline="central">Peau de la main</text>
<text class="ts" x="95" y="255" text-anchor="middle" dominant-baseline="central">sent le contact</text></g>

<line x1="173" y1="65" x2="246" y2="118" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="173" y1="155" x2="246" y2="148" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="173" y1="245" x2="246" y2="180" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="ts" x="95" y="292" text-anchor="middle" dominant-baseline="central">récepteurs sensoriels</text></g>

<g class="c-purple"><rect x="250" y="90" width="180" height="110" rx="12" stroke-width="1"/>
<text class="th" x="340" y="112" text-anchor="middle" dominant-baseline="central">Cerveau</text>
<text class="ts" x="340" y="136" text-anchor="middle" dominant-baseline="central">reçoit les messages</text>
<text class="ts" x="340" y="154" text-anchor="middle" dominant-baseline="central">les intègre (les combine)</text>
<text class="ts" x="340" y="172" text-anchor="middle" dominant-baseline="central">élabore une réponse</text>
<rect x="270" y="245" width="140" height="44" rx="8" stroke-width="1"/>
<text class="th" x="340" y="267" text-anchor="middle" dominant-baseline="central">Moelle épinière</text></g>
<line x1="340" y1="202" x2="340" y2="241" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>

<g class="c-coral"><rect x="510" y="242" width="150" height="50" rx="8" stroke-width="0.8"/>
<text class="th" x="585" y="258" text-anchor="middle" dominant-baseline="central">Muscles du bras</text>
<text class="ts" x="585" y="277" text-anchor="middle" dominant-baseline="central">se contractent</text>
<text class="ts" x="458" y="252" text-anchor="middle" dominant-baseline="central">nerf moteur</text></g>
<line x1="413" y1="267" x2="506" y2="267" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>

<g class="c-blue"><text class="ts" x="215" y="40" text-anchor="middle" dominant-baseline="central">nerfs</text>
<text class="ts" x="215" y="54" text-anchor="middle" dominant-baseline="central">sensitifs</text></g>

<line x1="20" y1="318" x2="60" y2="318" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="68" y="318" text-anchor="start" dominant-baseline="central">message sensitif : vers les centres nerveux</text>
<line x1="360" y1="318" x2="400" y2="318" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<text class="ts" x="408" y="318" text-anchor="start" dominant-baseline="central">message moteur : vers les muscles</text>
<g class="c-purple"><text class="ts" x="340" y="350" text-anchor="middle" dominant-baseline="central">Centres nerveux (système nerveux central) = cerveau + moelle épinière. Trajets simplifiés.</text></g>
</svg>
