relecture: {statut: a_relire}
generation: {par: "projet-jules", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: formule
    type: formule
    expression: "[gamète mâle] + [gamète femelle] → [cellule-œuf]"
    termes:
      "gamète mâle": {couleur: bleu, legende: "la cellule reproductrice du père : le **spermatozoïde** chez les Vertébrés, contenu dans le **grain de pollen** chez les plantes à fleurs"}
      "gamète femelle": {couleur: orange, legende: "la cellule reproductrice de la mère : l'**ovule** chez les Vertébrés, contenu dans l'ovule de la fleur chez les plantes"}
      "cellule-œuf": {couleur: violet, legende: "la cellule formée par la **fécondation** : elle réunit les deux patrimoines génétiques"}
    jules: "Ça, c'est la **reproduction sexuée**. Chaque gamète n'apporte que la **moitié** du patrimoine d'un parent : chez l'être humain, 23 chromosomes + 23 chromosomes donnent les 46 de la cellule-œuf."

  - id: carte
    type: carte
    noeuds:
      - {id: reproduction, titre: "Reproduction", sous_titre: "produire de nouveaux individus", principal: true}
      - {id: sexuee, titre: "Sexuée", sous_titre: "2 gamètes, fécondation, descendant différent"}
      - {id: asexuee, titre: "Asexuée", sous_titre: "1 seul parent, clone identique"}
      - {id: milieu, titre: "Milieu", sous_titre: "rencontre des gamètes, dissémination"}
      - {id: populations, titre: "Populations", sous_titre: "le nombre de jeunes qui survivent"}
    liens:
      - {de: reproduction, vers: sexuee}
      - {de: reproduction, vers: asexuee}
      - {de: reproduction, vers: milieu}
      - {de: reproduction, vers: populations}
    jules: "La question à te poser : y a-t-il **fusion de deux gamètes** ? Si oui, c'est sexué et le descendant est unique ; si non, c'est asexué et on obtient des **clones**."

  - id: schema
    type: schema
    titre: "Sexuée ou asexuée : ce que reçoit le descendant"
    svg: "reproduction-sexuee-asexuee.svg"
    jules: "Deux enfants des mêmes parents (sauf les **vrais jumeaux**) reçoivent des combinaisons différentes : c'est pour ça que frères et sœurs ne se ressemblent pas totalement. Une bouture, elle, est une **copie génétique** de sa plante mère."

  - id: schema-fleur
    type: schema
    titre: "Chez une plante à fleurs : de la fleur à la nouvelle plante"
    svg: "reproduction-sexuee-asexuee-fleur.svg"
    jules: "Une plante ne se déplace pas : ce sont le **vent**, l'**eau** et les **animaux** qui transportent son pollen puis ses graines. Les graines crochues s'accrochent aux poils, les graines légères et ailées volent au vent."

  - id: graphe
    type: graphe
    gabarit: arbre-generations
    curseurs:
      - {id: curseur-gen, nom: gen, min: 1, max: 4, pas: 1, depart: 2}
      - {id: curseur-mode, nom: mode, min: 0, max: 1, pas: 1, depart: 0}
    lectures:
      - {si: "mode == 0", texte: "Reproduction **asexuée** : un seul parent, des descendants **identiques** à lui (des **clones**), et ça va vite."}
      - {si: "mode == 1", texte: "Reproduction **sexuée** : deux parents, des **gamètes** qui se rencontrent, des descendants **tous différents**."}
      - {si: "mode == 0 && gen >= 3", texte: "Si le milieu change (maladie, sécheresse), des clones tous identiques risquent de **disparaître ensemble**."}
    jules: "Chaque carte est un individu, chaque bande un **gène**, sa couleur la version du gène. mode 0 : asexuée, mode 1 : sexuée ; gen : le nombre de générations. Passe de 0 à 1 et regarde les couleurs : toutes pareilles, puis toutes mélangées."

  - id: methode
    type: methode
    etapes:
      - "Chercher s'il y a **fusion de deux gamètes** (fécondation) : oui, reproduction **sexuée** ; non, reproduction **asexuée**."
      - "Comparer le descendant au parent : **identique** génétiquement (un clone), ou **différent** des deux parents."
      - "Pour une plante à fleurs, suivre le trajet : pollen → **pollinisation** → fécondation → graine dans un fruit."
      - "Repérer le mode de **dissémination** (vent, eau, animaux) et le relier au milieu où vit l'espèce."
    jules: "Beaucoup de plantes font **les deux** : le fraisier fait des fleurs et des fraises (sexuée) et aussi des **stolons** qui s'enracinent (asexuée)."

  - id: piege
    type: piege
    mauvaise_idee: "Une bouture ou un stolon donne une plante **génétiquement différente** de la plante mère."
    pourquoi_faux: "Il n'y a ni gamètes ni fécondation : la nouvelle plante provient d'un **morceau** de la plante mère, avec exactement le même patrimoine génétique."
    bonne_idee: "Reproduction **asexuée** = un seul parent = **clone** identique. Seule la reproduction sexuée crée des descendants différents."
    jules: "Autre confusion : un **gamète** est une cellule reproductrice, alors qu'une **graine** ou un **œuf** sont le résultat de la fécondation."

  - id: exemple
    type: exemple
    situation: "Un jardinier plante un stolon de fraisier : la tige rampante s'est enracinée et porte une petite plante."
    conclusion: "Un seul parent, pas de gamètes : c'est une reproduction **asexuée**. La nouvelle plante est un **clone** du fraisier d'origine, avec les mêmes caractères génétiques (même variété de fraises)."
    jules: "C'est pour cela que les jardiniers bouturent : ils sont **sûrs de garder** une variété qu'ils aiment, ce que les graines ne garantissent pas."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Vocabulaire à connaître : spermatozoïde et ovule (Vertébrés), grain de pollen et ovule (plantes à fleurs), **fécondation**, **clone**, **dissémination**."
