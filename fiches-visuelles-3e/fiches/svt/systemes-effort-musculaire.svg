<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Poumons, cœur, muscles et centres nerveux pendant un effort">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="395" y1="14" x2="395" y2="54" class="arr" marker-end="url(#arrow)"/>
<line x1="445" y1="54" x2="445" y2="14" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><text class="ts" x="385" y="28" text-anchor="end" dominant-baseline="central">air inspiré : O₂ entre</text></g>
<g class="c-blue"><text class="ts" x="455" y="28" text-anchor="start" dominant-baseline="central">air expiré : CO₂ rejeté</text></g>

<g class="c-gray"><rect x="330" y="60" width="180" height="50" rx="8" stroke-width="0.8"/>
<text class="th" x="420" y="76" text-anchor="middle" dominant-baseline="central">Poumons</text>
<text class="ts" x="420" y="95" text-anchor="middle" dominant-baseline="central">échanges de gaz avec le sang</text></g>

<g class="c-gray"><rect x="360" y="205" width="120" height="50" rx="8" stroke-width="0.8"/>
<text class="th" x="420" y="221" text-anchor="middle" dominant-baseline="central">Cœur</text>
<text class="ts" x="420" y="240" text-anchor="middle" dominant-baseline="central">pompe le sang</text></g>

<g class="c-gray"><rect x="330" y="350" width="180" height="50" rx="8" stroke-width="0.8"/>
<text class="th" x="420" y="366" text-anchor="middle" dominant-baseline="central">Muscles en effort</text>
<text class="ts" x="420" y="385" text-anchor="middle" dominant-baseline="central">se contractent davantage</text></g>
<text class="ts" x="420" y="420" text-anchor="middle" dominant-baseline="central">consomment plus de dioxygène et de nutriments, rejettent plus de CO₂</text>

<line x1="480" y1="114" x2="462" y2="200" stroke="#A32D2D" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="462" y1="260" x2="480" y2="346" stroke="#A32D2D" stroke-width="2.5" marker-end="url(#arrow)"/>
<g class="c-red"><text class="ts" x="500" y="160" text-anchor="start" dominant-baseline="central">sang riche</text>
<text class="ts" x="500" y="176" text-anchor="start" dominant-baseline="central">en dioxygène</text>
<text class="ts" x="500" y="300" text-anchor="start" dominant-baseline="central">O₂ et nutriments</text>
<text class="ts" x="500" y="316" text-anchor="start" dominant-baseline="central">vers les muscles</text></g>

<line x1="360" y1="346" x2="378" y2="260" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="378" y1="200" x2="360" y2="114" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="ts" x="350" y="152" text-anchor="end" dominant-baseline="central">sang riche en</text>
<text class="ts" x="350" y="168" text-anchor="end" dominant-baseline="central">dioxyde de carbone</text></g>

<g class="c-purple"><rect x="20" y="200" width="180" height="60" rx="8" stroke-width="0.8"/>
<text class="th" x="110" y="220" text-anchor="middle" dominant-baseline="central">Système nerveux</text>
<text class="ts" x="110" y="240" text-anchor="middle" dominant-baseline="central">centres nerveux, nerfs</text></g>
<line x1="110" y1="197" x2="324" y2="92" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="203" y1="230" x2="354" y2="230" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="110" y1="263" x2="324" y2="372" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<g class="c-purple"><text class="ts" x="20" y="120" text-anchor="start" dominant-baseline="central">augmente la fréquence</text>
<text class="ts" x="20" y="136" text-anchor="start" dominant-baseline="central">respiratoire</text>
<text class="ts" x="210" y="216" text-anchor="start" dominant-baseline="central">accélère le cœur</text>
<text class="ts" x="20" y="330" text-anchor="start" dominant-baseline="central">commande la</text>
<text class="ts" x="20" y="346" text-anchor="start" dominant-baseline="central">contraction</text></g>

<text class="ts" x="20" y="430" text-anchor="start" dominant-baseline="central">Pas à l'échelle.</text>
</svg>
