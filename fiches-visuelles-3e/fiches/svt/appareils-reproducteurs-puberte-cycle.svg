<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cycle féminin : ovaire et muqueuse de l'utérus sur 28 jours">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="20" y="20" dominant-baseline="central">Dans l'ovaire</text>
<text class="ts" x="660" y="20" text-anchor="end" dominant-baseline="central">pas à l'échelle</text>
<g class="c-pink"><circle cx="100" cy="62" r="6" stroke-width="1"/><circle cx="190" cy="62" r="10" stroke-width="1"/><circle cx="280" cy="62" r="15" stroke-width="1"/>
<circle cx="320" cy="62" r="15" stroke-width="1"/><circle cx="360" cy="46" r="5" stroke-width="1"/>
<circle cx="450" cy="62" r="15" stroke-width="1"/><circle cx="570" cy="62" r="8" stroke-width="1"/>
<text class="ts" x="190" y="96" text-anchor="middle" dominant-baseline="central">un follicule mûrit</text>
<text class="th" x="340" y="96" text-anchor="middle" dominant-baseline="central">ovulation</text>
<text class="ts" x="340" y="112" text-anchor="middle" dominant-baseline="central">l'ovule est libéré</text>
<text class="ts" x="510" y="96" text-anchor="middle" dominant-baseline="central">corps jaune : progestérone</text></g>
<line x1="334" y1="56" x2="352" y2="49" stroke="#993556" stroke-width="1.2" marker-end="url(#arrow)"/>

<text class="th" x="20" y="146" dominant-baseline="central">Dans l'utérus : épaisseur de la muqueuse</text>
<path d="M60 190 C90 200 110 228 140 232 C200 232 260 205 320 192 C380 178 420 162 460 158 C520 155 570 155 600 156 V250 H60 Z" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>
<g class="c-red"><rect x="60" y="164" width="80" height="20" rx="4" stroke-width="0.5"/>
<text class="ts" x="100" y="174" text-anchor="middle" dominant-baseline="central">règles</text></g>
<g class="c-pink"><text class="ts" x="470" y="200" text-anchor="middle" dominant-baseline="central">la muqueuse s'épaissit et se prépare</text>
<text class="ts" x="470" y="216" text-anchor="middle" dominant-baseline="central">à accueillir un éventuel embryon</text></g>

<line x1="60" y1="256" x2="620" y2="256" class="arr" marker-end="url(#arrow)"/>
<line x1="60" y1="252" x2="60" y2="262" stroke="#5F5E5A" stroke-width="1"/>
<line x1="140" y1="252" x2="140" y2="262" stroke="#5F5E5A" stroke-width="1"/>
<line x1="320" y1="252" x2="320" y2="262" stroke="#5F5E5A" stroke-width="1"/>
<line x1="600" y1="252" x2="600" y2="262" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="60" y="274" text-anchor="middle" dominant-baseline="central">jour 1</text>
<text class="ts" x="140" y="274" text-anchor="middle" dominant-baseline="central">jour 5</text>
<text class="ts" x="320" y="274" text-anchor="middle" dominant-baseline="central">jour 14</text>
<text class="ts" x="600" y="274" text-anchor="middle" dominant-baseline="central">jour 28</text>
<line x1="320" y1="120" x2="320" y2="250" class="leader"/>

<text class="ts" x="20" y="304" dominant-baseline="central">Sans fécondation, la muqueuse se détache : ce sont les règles, jour 1 du cycle suivant.</text>
<text class="ts" x="20" y="322" dominant-baseline="central">Cycle moyen de 28 jours : la durée varie d'une femme à l'autre et d'un cycle à l'autre.</text>
</svg>
