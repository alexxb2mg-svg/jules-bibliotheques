<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arbre de parenté de cinq Vertébrés, de la truite à Homo sapiens, avec les caractères partagés">
<text class="th" x="60" y="52" text-anchor="middle" dominant-baseline="central">Truite</text>
<text class="th" x="180" y="52" text-anchor="middle" dominant-baseline="central">Grenouille</text>
<text class="th" x="300" y="52" text-anchor="middle" dominant-baseline="central">Souris</text>
<text class="th" x="420" y="52" text-anchor="middle" dominant-baseline="central">Chimpanzé</text>
<g class="c-blue"><text class="th" x="620" y="52" text-anchor="middle" dominant-baseline="central">Homo sapiens</text></g>

<g stroke="#5F5E5A" stroke-width="2" stroke-linecap="round">
<line x1="100" y1="380" x2="620" y2="70"/>
<line x1="150" y1="350" x2="60" y2="70"/>
<line x1="250" y1="291" x2="180" y2="70"/>
<line x1="370" y1="219" x2="300" y2="70"/>
<line x1="480" y1="154" x2="420" y2="70"/>
</g>

<g fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5">
<circle cx="150" cy="350" r="5"/><circle cx="250" cy="291" r="5"/><circle cx="370" cy="219" r="5"/><circle cx="480" cy="154" r="5"/>
</g>
<g class="c-amber"><text class="ts" x="494" y="166" text-anchor="start" dominant-baseline="central">ancêtre commun</text></g>

<g fill="#993C1D" stroke="none">
<rect x="118" y="360" width="14" height="5" transform="rotate(-31 125 363)"/>
<rect x="193" y="318" width="14" height="5" transform="rotate(-31 200 320)"/>
<rect x="303" y="252" width="14" height="5" transform="rotate(-31 310 255)"/>
<rect x="418" y="185" width="14" height="5" transform="rotate(-31 425 188)"/>
</g>

<g class="c-coral"><text class="th" x="148" y="378" text-anchor="start" dominant-baseline="central">Vertébrés</text>
<text class="ts" x="148" y="396" text-anchor="start" dominant-baseline="central">squelette interne, colonne vertébrale</text></g>
<g class="c-coral"><text class="th" x="222" y="326" text-anchor="start" dominant-baseline="central">Tétrapodes</text>
<text class="ts" x="222" y="344" text-anchor="start" dominant-baseline="central">quatre membres</text></g>
<g class="c-coral"><text class="th" x="332" y="258" text-anchor="start" dominant-baseline="central">Mammifères</text>
<text class="ts" x="332" y="276" text-anchor="start" dominant-baseline="central">poils, mamelles (allaitement)</text></g>
<g class="c-coral"><text class="th" x="447" y="190" text-anchor="start" dominant-baseline="central">Primates</text>
<text class="ts" x="447" y="208" text-anchor="start" dominant-baseline="central">ongles plats, pouce opposable</text></g>

<text class="ts" x="660" y="420" text-anchor="end" dominant-baseline="central">Un caractère apparu sur une branche est partagé</text>
<text class="ts" x="660" y="436" text-anchor="end" dominant-baseline="central">par toutes les espèces situées au-dessus. Pas à l'échelle du temps.</text>
</svg>
