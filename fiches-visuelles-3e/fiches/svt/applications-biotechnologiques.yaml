blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: biotech, titre: "Biotechnologies", sous_titre: "utiliser le vivant en laboratoire", principal: true}
      - {id: culture, titre: "Culture de cellules", sous_titre: "cellules qui se multiplient hors de l'organisme"}
      - {id: ogm, titre: "OGM", sous_titre: "un gène ajouté ou modifié par l'être humain"}
      - {id: clonage, titre: "Clonage", sous_titre: "copie génétique d'un seul individu"}
      - {id: selection, titre: "Sélection", sous_titre: "choisir les reproducteurs, depuis des millénaires"}
    liens:
      - {de: biotech, vers: culture}
      - {de: biotech, vers: ogm}
      - {de: biotech, vers: clonage}
      - {de: biotech, vers: selection}
    jules: "Ces techniques prolongent une pratique très ancienne : depuis les débuts de l'agriculture, l'être humain **choisit les individus** qu'il fait se reproduire. Les biotechnologies vont **plus vite** et visent un gène précis."

  - id: schema
    type: schema
    titre: "Obtenir un maïs OGM résistant à un insecte"
    svg: "applications-biotechnologiques.svg"
    jules: "Un OGM est possible parce que **tous les êtres vivants** lisent leurs gènes de la même façon : un gène de bactérie, placé dans une cellule de maïs, y fait fabriquer la même **toxine**."

  - id: schema-clonage
    type: schema
    titre: "Le clonage de la brebis Dolly"
    svg: "applications-biotechnologiques-clonage.svg"
    jules: "Dolly ressemble à la brebis A, qui a donné le **noyau**, et pas à B ni à C : c'est le noyau qui contient l'essentiel du **patrimoine génétique**."

  - id: methode
    type: methode
    etapes:
      - "Repérer ce que fait l'être humain : il **choisit des reproducteurs** (sélection), il **ajoute un gène** (OGM) ou il **copie un individu** (clonage)."
      - "Pour un OGM, trouver le **gène ajouté**, l'organisme d'où il vient et le caractère qu'il donne."
      - "Pour un clone, repérer **qui a fourni le noyau** : c'est à lui que le clone est génétiquement identique."
      - "Pour une culture de cellules, dire à quoi elle sert : **recherche**, test de médicaments, production de substances utiles."
      - "Terminer par les **enjeux** : bénéfices attendus, risques, questions éthiques et règles de la loi."
    jules: "Au brevet, on attend souvent un avis argumenté : donne **un avantage** et **un risque ou une limite**, sans jugement tout fait."

  - id: piege
    type: piege
    mauvaise_idee: "Un OGM, c'est la même chose qu'une variété obtenue en **croisant** des plantes pendant des années."
    pourquoi_faux: "Le croisement mélange des patrimoines génétiques entiers sur de nombreuses générations. Un OGM reçoit **un gène précis**, en laboratoire, parfois venu d'une **autre espèce**."
    bonne_idee: "**Sélection** : on choisit les reproducteurs. **OGM** : on modifie directement le patrimoine génétique en laboratoire."
    jules: "Autre piège : un clone a le même patrimoine génétique, mais il n'est pas **identique en tout** : son environnement et son vécu le rendent unique."

  - id: exemple
    type: exemple
    situation: "Une variété de maïs a reçu, en laboratoire, un gène de bactérie qui lui fait produire une toxine contre la pyrale, une chenille qui ronge ses tiges. Un autre maïs a été obtenu en croisant pendant des années les plants les plus productifs."
    conclusion: "Le premier est un **OGM** : son patrimoine génétique a été modifié directement, avec un gène d'une autre espèce. Le second est issu d'une **sélection** classique, sans modification en laboratoire."
    jules: "Enjeux du maïs résistant : moins d'**insecticide** pulvérisé, mais un risque que les insectes deviennent **résistants** à la toxine. La culture des OGM est très **encadrée par la loi**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Exemple utile de culture de cellules : on fait se multiplier des **cellules humaines** en laboratoire pour tester l'effet d'un **médicament** avant de le donner à des patients."
