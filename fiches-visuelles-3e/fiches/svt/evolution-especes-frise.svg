<svg width="100%" viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frise simplifiée de l'histoire de la vie sur Terre">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="30" y1="110" x2="668" y2="110" stroke="#5F5E5A" stroke-width="3" marker-end="url(#arrow)"/>
<text class="ts" x="668" y="94" text-anchor="end" dominant-baseline="central">aujourd'hui</text>

<g class="c-gray"><circle cx="40" cy="110" r="7" stroke-width="1.5"/>
<text class="th" x="30" y="50" text-anchor="start" dominant-baseline="central">il y a 4,6 milliards d'années</text>
<text class="ts" x="30" y="68" text-anchor="start" dominant-baseline="central">formation de la Terre</text></g>
<line x1="40" y1="78" x2="40" y2="101" class="leader"/>

<g class="c-teal"><circle cx="150" cy="110" r="7" stroke-width="1.5"/>
<text class="th" x="150" y="150" text-anchor="middle" dominant-baseline="central">vers 3,5 milliards d'années</text>
<text class="ts" x="150" y="168" text-anchor="middle" dominant-baseline="central">premières traces fossiles de vie</text>
<text class="ts" x="150" y="184" text-anchor="middle" dominant-baseline="central">(stromatolithes, bactéries)</text></g>
<line x1="150" y1="119" x2="150" y2="140" class="leader"/>

<g class="c-teal"><circle cx="350" cy="110" r="7" stroke-width="1.5"/>
<text class="th" x="350" y="50" text-anchor="middle" dominant-baseline="central">vers 540 millions d'années</text>
<text class="ts" x="350" y="68" text-anchor="middle" dominant-baseline="central">grande diversification des animaux</text></g>
<line x1="350" y1="78" x2="350" y2="101" class="leader"/>

<g class="c-red"><circle cx="430" cy="110" r="7" stroke-width="1.5"/>
<text class="th" x="430" y="150" text-anchor="middle" dominant-baseline="central">il y a 252 millions d'années</text>
<text class="ts" x="430" y="168" text-anchor="middle" dominant-baseline="central">la plus grande extinction</text>
<text class="ts" x="430" y="184" text-anchor="middle" dominant-baseline="central">(fin du Permien)</text></g>
<line x1="430" y1="119" x2="430" y2="140" class="leader"/>

<g class="c-red"><circle cx="560" cy="110" r="7" stroke-width="1.5"/>
<text class="th" x="560" y="50" text-anchor="middle" dominant-baseline="central">il y a 66 millions d'années</text>
<text class="ts" x="560" y="68" text-anchor="middle" dominant-baseline="central">disparition des dinosaures</text></g>
<line x1="560" y1="78" x2="560" y2="101" class="leader"/>

<g class="c-teal"><circle cx="640" cy="110" r="7" stroke-width="1.5"/>
<text class="th" x="660" y="150" text-anchor="end" dominant-baseline="central">vers 300 000 ans</text>
<text class="ts" x="660" y="168" text-anchor="end" dominant-baseline="central">premiers Homo sapiens</text></g>
<line x1="640" y1="119" x2="640" y2="140" class="leader"/>

<g class="c-teal"><circle cx="36" cy="226" r="6" stroke-width="1.5"/>
<text class="ts" x="48" y="226" text-anchor="start" dominant-baseline="central">apparition d'espèces</text></g>
<g class="c-red"><circle cx="196" cy="226" r="6" stroke-width="1.5"/>
<text class="ts" x="208" y="226" text-anchor="start" dominant-baseline="central">disparition d'espèces (crise)</text></g>
<text class="ts" x="660" y="226" text-anchor="end" dominant-baseline="central">Pas à l'échelle du temps.</text>
</svg>
