<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Méiose et fécondation : tableau de croisement de deux parents porteurs Aa">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-blue"><text class="th" x="170" y="20" text-anchor="middle" dominant-baseline="central">Père Aa, porteur sain</text>
<rect x="150" y="38" width="14" height="72" rx="7" stroke-width="1"/>
<rect x="178" y="38" width="14" height="72" rx="7" stroke-width="1"/>
<text class="th" x="140" y="70" text-anchor="end" dominant-baseline="central">A</text>
<text class="th" x="202" y="70" text-anchor="start" dominant-baseline="central">a</text></g>
<line x1="150" y1="70" x2="164" y2="70" stroke="#185FA5" stroke-width="3"/>
<line x1="178" y1="70" x2="192" y2="70" stroke="#185FA5" stroke-width="3"/>

<g class="c-coral"><text class="th" x="510" y="20" text-anchor="middle" dominant-baseline="central">Mère Aa, porteuse saine</text>
<rect x="490" y="38" width="14" height="72" rx="7" stroke-width="1"/>
<rect x="518" y="38" width="14" height="72" rx="7" stroke-width="1"/>
<text class="th" x="480" y="70" text-anchor="end" dominant-baseline="central">A</text>
<text class="th" x="542" y="70" text-anchor="start" dominant-baseline="central">a</text></g>
<line x1="490" y1="70" x2="504" y2="70" stroke="#993C1D" stroke-width="3"/>
<line x1="518" y1="70" x2="532" y2="70" stroke="#993C1D" stroke-width="3"/>

<text class="ts" x="340" y="60" text-anchor="middle" dominant-baseline="central">une paire de</text>
<text class="ts" x="340" y="76" text-anchor="middle" dominant-baseline="central">chromosomes chacun</text>

<line x1="160" y1="118" x2="132" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="180" y1="118" x2="208" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="118" x2="472" y2="150" class="arr" marker-end="url(#arrow)"/>
<line x1="520" y1="118" x2="548" y2="150" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="250" y="132" text-anchor="start" dominant-baseline="central">méiose</text>
<text class="th" x="430" y="132" text-anchor="end" dominant-baseline="central">méiose</text>

<g class="c-blue"><circle cx="125" cy="180" r="24" stroke-width="1"/>
<text class="th" x="125" y="180" text-anchor="middle" dominant-baseline="central">A</text>
<circle cx="215" cy="180" r="24" stroke-width="1"/>
<text class="th" x="215" y="180" text-anchor="middle" dominant-baseline="central">a</text>
<text class="ts" x="170" y="220" text-anchor="middle" dominant-baseline="central">spermatozoïdes : A ou a</text>
<text class="ts" x="170" y="236" text-anchor="middle" dominant-baseline="central">(1 chance sur 2 chacun)</text></g>

<g class="c-coral"><circle cx="465" cy="180" r="24" stroke-width="1"/>
<text class="th" x="465" y="180" text-anchor="middle" dominant-baseline="central">A</text>
<circle cx="555" cy="180" r="24" stroke-width="1"/>
<text class="th" x="555" y="180" text-anchor="middle" dominant-baseline="central">a</text>
<text class="ts" x="510" y="220" text-anchor="middle" dominant-baseline="central">ovules : A ou a</text>
<text class="ts" x="510" y="236" text-anchor="middle" dominant-baseline="central">(1 chance sur 2 chacun)</text></g>

<line x1="200" y1="250" x2="300" y2="286" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="250" x2="380" y2="286" class="arr" marker-end="url(#arrow)"/>
<text class="th" x="340" y="262" text-anchor="middle" dominant-baseline="central">fécondation</text>

<g class="c-blue"><text class="th" x="305" y="306" text-anchor="middle" dominant-baseline="central">A</text>
<text class="th" x="375" y="306" text-anchor="middle" dominant-baseline="central">a</text></g>
<g class="c-coral"><text class="th" x="252" y="342" text-anchor="middle" dominant-baseline="central">A</text>
<text class="th" x="252" y="382" text-anchor="middle" dominant-baseline="central">a</text></g>
<rect x="270" y="322" width="70" height="40" class="box"/>
<rect x="340" y="322" width="70" height="40" class="box"/>
<rect x="270" y="362" width="70" height="40" class="box"/>
<g class="c-red"><rect x="340" y="362" width="70" height="40" stroke-width="1.5"/></g>
<text class="th" x="305" y="342" text-anchor="middle" dominant-baseline="central"><tspan fill="#993C1D">A</tspan><tspan fill="#185FA5">A</tspan></text>
<text class="th" x="375" y="342" text-anchor="middle" dominant-baseline="central"><tspan fill="#993C1D">A</tspan><tspan fill="#185FA5">a</tspan></text>
<text class="th" x="305" y="382" text-anchor="middle" dominant-baseline="central"><tspan fill="#993C1D">a</tspan><tspan fill="#185FA5">A</tspan></text>
<text class="th" x="375" y="382" text-anchor="middle" dominant-baseline="central"><tspan fill="#993C1D">a</tspan><tspan fill="#185FA5">a</tspan></text>

<text class="ts" x="20" y="330" text-anchor="start" dominant-baseline="central">bleu : allèle venu</text>
<text class="ts" x="20" y="346" text-anchor="start" dominant-baseline="central">du père</text>
<text class="ts" x="20" y="370" text-anchor="start" dominant-baseline="central">corail : allèle venu</text>
<text class="ts" x="20" y="386" text-anchor="start" dominant-baseline="central">de la mère</text>

<text class="th" x="440" y="322" text-anchor="start" dominant-baseline="central">Pour chaque enfant :</text>
<text class="ts" x="440" y="344" text-anchor="start" dominant-baseline="central">AA ou Aa : non atteint,</text>
<text class="ts" x="440" y="360" text-anchor="start" dominant-baseline="central">3 chances sur 4 (75 %)</text>
<g class="c-red"><text class="ts" x="440" y="382" text-anchor="start" dominant-baseline="central">aa : atteint,</text>
<text class="ts" x="440" y="398" text-anchor="start" dominant-baseline="central">1 chance sur 4 (25 %)</text></g>

<text class="ts" x="340" y="432" text-anchor="middle" dominant-baseline="central">Chaque gamète reçoit un seul chromosome de chaque paire, donc un seul allèle de chaque gène.</text>
</svg>
