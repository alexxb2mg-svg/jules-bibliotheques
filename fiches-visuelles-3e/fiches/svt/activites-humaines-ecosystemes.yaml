relecture: {statut: a_relire}
generation: {par: "projet-jules", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: ecosysteme, titre: "Écosystème", sous_titre: "biotope + biocénose", principal: true}
      - {id: biotope, titre: "Biotope", sous_titre: "le milieu : sol, eau, climat"}
      - {id: biocenose, titre: "Biocénose", sous_titre: "les êtres vivants"}
      - {id: activites, titre: "Activités humaines", sous_titre: "agriculture, ville, pêche"}
      - {id: biodiversite, titre: "Biodiversité", sous_titre: "espèces et milieux"}
    liens:
      - {de: ecosysteme, vers: biotope}
      - {de: ecosysteme, vers: biocenose}
      - {de: activites, vers: ecosysteme, libelle: "modifient"}
      - {de: ecosysteme, vers: biodiversite, libelle: "abrite"}
    jules: "Un écosystème n'est pas un simple paysage : c'est un **milieu** et des **êtres vivants** qui interagissent (se nourrir, polliniser, se faire concurrence). Toucher à l'un, c'est toucher à l'autre."

  - id: schema-chaine
    type: schema
    titre: "Un impact qui se propage dans l'écosystème"
    svg: "activites-humaines-ecosystemes.svg"
    jules: "Les insecticides ne visent que les insectes, et pourtant les **oiseaux** et les **plantes** en souffrent aussi : c'est l'**effet en chaîne**, dû aux relations alimentaires et à la pollinisation."

  - id: schema-echelles
    type: schema
    titre: "Des impacts locaux ou globaux, nuisibles ou bénéfiques"
    svg: "activites-humaines-ecosystemes-echelles.svg"
    jules: "Un corail blanchi a perdu les algues qui vivent en lui et le nourrissent : si l'eau reste trop chaude trop longtemps, il meurt. Les émissions faites en Europe peuvent donc toucher un **récif** à l'autre bout du monde."

  - id: methode
    type: methode
    etapes:
      - "Décrire l'écosystème : son **biotope** (sol, eau, climat) et sa **biocénose** (les êtres vivants et leurs relations)."
      - "Identifier l'activité humaine et ce qu'elle change : le milieu, une espèce, ou les **relations** entre espèces."
      - "Suivre les **effets en chaîne** : qui mange qui, qui pollinise qui, qui dépend de quel milieu."
      - "Caractériser l'impact : son **rythme** (ponctuel ou continu), sa nature (nuisance ou bénéfice), son importance (local ou global), sa variabilité."
      - "Proposer une mesure qui limite l'impact ou restaure le milieu."
    jules: "Une pollution **ponctuelle** (un rejet accidentel) et une pollution **continue** (un rejet chaque jour) n'ont pas les mêmes effets : le milieu peut se remettre de la première, pas toujours de la seconde."

  - id: piege
    type: piege
    mauvaise_idee: "Une activité humaine qui ne touche qu'**une espèce** n'a pas d'effet sur le reste de l'écosystème."
    pourquoi_faux: "Les espèces d'un écosystème sont **reliées** : chaînes alimentaires, pollinisation, compétition. Si une espèce baisse, celles qui en dépendent sont touchées à leur tour."
    bonne_idee: "Pour analyser un impact, on suit les **interactions** entre espèces : l'effet peut se propager bien au-delà de l'espèce visée."
    jules: "Autre piège : croire que toute action humaine est forcément **nuisible**. Replanter des haies, restaurer une mare ou créer une réserve naturelle peut **enrichir** un écosystème."

  - id: exemple
    type: exemple
    situation: "Une forêt tropicale est abattue pour cultiver du soja ou élever du bétail : c'est la **déforestation**."
    calcul: "Biotope modifié : le sol n'est plus protégé par les arbres et s'érode, le climat local devient plus sec et plus chaud. Biocénose bouleversée : les espèces qui vivaient dans la forêt disparaissent ou partent."
    conclusion: "La déforestation modifie à la fois le **biotope** et la **biocénose** : c'est tout l'écosystème qui change, et la biodiversité recule. Elle libère aussi du CO₂, ce qui ajoute un impact **global**."
    jules: "Les arbres stockent beaucoup de carbone : quand on les brûle ou qu'ils se décomposent, ce carbone repart dans l'air sous forme de **CO₂**, un gaz à effet de serre."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Méthode express : **milieu** touché, **espèces** touchées, **effets en chaîne**, puis échelle locale ou globale."
