blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: classification, titre: "Classification", sous_titre: "ranger les êtres vivants selon leur parenté", principal: true}
      - {id: caracteres, titre: "Caractères partagés", sous_titre: "hérités d'un ancêtre commun"}
      - {id: groupes, titre: "Groupes emboîtés", sous_titre: "Vertébrés, Mammifères, Primates…"}
      - {id: evolution, titre: "Évolution", sous_titre: "les espèces descendent d'ancêtres communs"}
      - {id: homme, titre: "Homo sapiens", sous_titre: "un Vertébré, un Mammifère, un Primate"}
    liens:
      - {de: classification, vers: caracteres}
      - {de: classification, vers: groupes}
      - {de: classification, vers: evolution}
      - {de: classification, vers: homme}
    jules: "On ne range plus les êtres vivants selon ce qu'ils **ne sont pas** ni selon leur allure, mais selon les **caractères qu'ils possèdent en commun**. Les comparaisons d'**ADN** confirment ou corrigent ces parentés."

  - id: schema
    type: schema
    titre: "Un arbre de parenté : chaque caractère apparaît une fois, puis se transmet"
    svg: "relations-parente-classification.svg"
    jules: "Lis l'arbre par les **nœuds** : l'Homme et le chimpanzé partagent l'**ancêtre commun le plus récent**, donc ce sont les plus proches parents du schéma. La souris est plus proche de nous que la grenouille."

  - id: methode
    type: methode
    etapes:
      - "Faire un tableau : les espèces en lignes, les **caractères** (colonne vertébrale, quatre membres, poils, mamelles…) en colonnes, et cocher ceux que chaque espèce **possède**."
      - "Regrouper les espèces qui partagent un caractère : elles forment un **groupe**, et les groupes s'**emboîtent** les uns dans les autres."
      - "Conclure : plus deux espèces partagent de caractères, plus leur **ancêtre commun** est récent et plus elles sont **proches parentes**."
      - "Placer Homo sapiens : **Vertébré** (colonne vertébrale), **Mammifère** (poils, mamelles), **Primate** (ongles plats, pouce opposable)."
    jules: "Ne regroupe jamais par une **absence** : « pas de pattes » réunirait le serpent et le ver de terre, qui ne sont pas proches parents."

  - id: piege
    type: piege
    mauvaise_idee: "On classe les êtres vivants d'après leur **aspect extérieur** : le dauphin ressemble à un poisson, c'est donc un poisson."
    pourquoi_faux: "Deux espèces peuvent se ressembler parce qu'elles vivent dans le **même milieu**, sans être proches parentes. La classification repose sur les **caractères hérités** d'un ancêtre commun."
    bonne_idee: "Le dauphin a des **mamelles**, allaite ses petits et respire avec des poumons : c'est un **Mammifère**, plus proche parent de la souris que de la truite."
    jules: "Et l'être humain n'est pas classé à part : c'est un **animal**, rangé comme les autres selon ses caractères."

  - id: exemple
    type: exemple
    situation: "On compare quatre espèces pour quatre caractères : colonne vertébrale, quatre membres, poils, mamelles. Truite : 1 seul. Grenouille : 2. Chimpanzé : les 4. Homo sapiens : les 4."
    calcul: "Homo sapiens et chimpanzé : 4 caractères communs. Homo sapiens et grenouille : 2. Homo sapiens et truite : 1."
    conclusion: "Le **chimpanzé** est le plus proche parent de l'Homme parmi ces espèces, puis la grenouille, puis la truite. Ils partagent un **ancêtre commun** récent."
    jules: "Attention : l'Homme ne **descend pas** du chimpanzé. Les deux espèces descendent d'un **ancêtre commun**, qui vivait il y a environ 7 millions d'années."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "La classification n'est **pas figée** : de nouveaux fossiles ou de nouvelles comparaisons d'ADN peuvent déplacer une espèce dans l'arbre."
