<svg width="100%" viewBox="0 0 680 310" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Digestion des grosses molécules et absorption par une villosité">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="20" y="18" text-anchor="start" dominant-baseline="central">Digestion : grosses molécules → petites</text>
<text class="ts" x="97" y="42" text-anchor="middle" dominant-baseline="central">dans les aliments</text>
<text class="ts" x="327" y="42" text-anchor="middle" dominant-baseline="central">nutriments</text>

<g class="c-gray"><rect x="20" y="56" width="155" height="44" rx="8" stroke-width="0.8"/>
<text class="th" x="97" y="71" text-anchor="middle" dominant-baseline="central">Amidon</text>
<text class="ts" x="97" y="88" text-anchor="middle" dominant-baseline="central">pain, pâtes, riz</text>
<rect x="20" y="114" width="155" height="44" rx="8" stroke-width="0.8"/>
<text class="th" x="97" y="129" text-anchor="middle" dominant-baseline="central">Protéines</text>
<text class="ts" x="97" y="146" text-anchor="middle" dominant-baseline="central">viande, œufs, lentilles</text>
<rect x="20" y="172" width="155" height="44" rx="8" stroke-width="0.8"/>
<text class="th" x="97" y="187" text-anchor="middle" dominant-baseline="central">Lipides</text>
<text class="ts" x="97" y="204" text-anchor="middle" dominant-baseline="central">beurre, huile</text></g>

<line x1="180" y1="78" x2="244" y2="78" stroke="#854F0B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="180" y1="136" x2="244" y2="136" stroke="#854F0B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="180" y1="194" x2="244" y2="194" stroke="#854F0B" stroke-width="2" marker-end="url(#arrow)"/>
<g class="c-amber"><text class="ts" x="212" y="64" text-anchor="middle" dominant-baseline="central">enzymes</text>
<text class="ts" x="212" y="122" text-anchor="middle" dominant-baseline="central">enzymes</text>
<text class="ts" x="212" y="180" text-anchor="middle" dominant-baseline="central">enzymes</text></g>

<g class="c-red"><rect x="250" y="56" width="155" height="44" rx="8" stroke-width="0.8"/>
<text class="th" x="327" y="78" text-anchor="middle" dominant-baseline="central">Glucose</text>
<rect x="250" y="114" width="155" height="44" rx="8" stroke-width="0.8"/>
<text class="th" x="327" y="136" text-anchor="middle" dominant-baseline="central">Acides aminés</text>
<rect x="250" y="172" width="155" height="44" rx="8" stroke-width="0.8"/>
<text class="th" x="327" y="187" text-anchor="middle" dominant-baseline="central">Acides gras</text>
<text class="ts" x="327" y="204" text-anchor="middle" dominant-baseline="central">et glycérol</text></g>
<text class="ts" x="20" y="244" text-anchor="start" dominant-baseline="central">Eau, sels minéraux, vitamines : déjà assez petits,</text>
<text class="ts" x="20" y="260" text-anchor="start" dominant-baseline="central">ils passent dans le sang sans être digérés.</text>

<text class="th" x="560" y="18" text-anchor="middle" dominant-baseline="central">Une villosité</text>
<path d="M505 240 L505 90 Q505 48 555 48 Q605 48 605 90 L605 240" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="470" y1="240" x2="640" y2="240" stroke="#5F5E5A" stroke-width="1.5"/>
<path d="M535 240 L535 100 Q555 72 575 100 L575 240" fill="none" stroke="#A32D2D" stroke-width="2.5"/>
<circle cx="478" cy="100" r="4" fill="#A32D2D"/><circle cx="470" cy="140" r="4" fill="#A32D2D"/><circle cx="480" cy="180" r="4" fill="#A32D2D"/>
<circle cx="636" cy="120" r="4" fill="#A32D2D"/><circle cx="642" cy="170" r="4" fill="#A32D2D"/>
<line x1="485" y1="102" x2="529" y2="112" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="477" y1="140" x2="529" y2="148" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="487" y1="180" x2="529" y2="186" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="629" y1="122" x2="581" y2="130" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="635" y1="170" x2="581" y2="176" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-red"><text class="ts" x="470" y="72" text-anchor="middle" dominant-baseline="central">nutriments</text>
<text class="ts" x="555" y="258" text-anchor="middle" dominant-baseline="central">vaisseaux sanguins (en rouge)</text></g>
<text class="ts" x="555" y="276" text-anchor="middle" dominant-baseline="central">paroi de l'intestin grêle :</text>
<text class="ts" x="555" y="292" text-anchor="middle" dominant-baseline="central">des millions de villosités</text>
<text class="ts" x="20" y="292" text-anchor="start" dominant-baseline="central">Pas à l'échelle.</text>
</svg>
