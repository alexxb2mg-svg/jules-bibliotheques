<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Le trajet des aliments dans le tube digestif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="230" y="16" width="180" height="46" rx="18" stroke-width="1"/>
<text class="th" x="320" y="31" text-anchor="middle" dominant-baseline="central">Bouche</text>
<text class="ts" x="320" y="49" text-anchor="middle" dominant-baseline="central">mastication, salive</text>
<rect x="270" y="80" width="100" height="30" rx="8" stroke-width="1"/>
<text class="th" x="320" y="95" text-anchor="middle" dominant-baseline="central">Œsophage</text>
<rect x="230" y="128" width="180" height="50" rx="18" stroke-width="1"/>
<text class="th" x="320" y="144" text-anchor="middle" dominant-baseline="central">Estomac</text>
<text class="ts" x="320" y="163" text-anchor="middle" dominant-baseline="central">brassage, suc gastrique acide</text>
<rect x="230" y="196" width="180" height="76" rx="12" stroke-width="2"/>
<text class="th" x="320" y="214" text-anchor="middle" dominant-baseline="central">Intestin grêle</text>
<text class="ts" x="320" y="234" text-anchor="middle" dominant-baseline="central">fin de la digestion</text>
<text class="ts" x="320" y="252" text-anchor="middle" dominant-baseline="central">absorption des nutriments</text>
<rect x="230" y="290" width="180" height="50" rx="12" stroke-width="1"/>
<text class="th" x="320" y="306" text-anchor="middle" dominant-baseline="central">Gros intestin</text>
<text class="ts" x="320" y="325" text-anchor="middle" dominant-baseline="central">absorbe surtout de l'eau</text>
<rect x="250" y="358" width="140" height="44" rx="8" stroke-width="1"/>
<text class="th" x="320" y="372" text-anchor="middle" dominant-baseline="central">Anus</text>
<text class="ts" x="320" y="390" text-anchor="middle" dominant-baseline="central">résidus évacués (selles)</text></g>
<line x1="320" y1="63" x2="320" y2="77" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="111" x2="320" y2="125" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="179" x2="320" y2="193" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="273" x2="320" y2="287" class="arr" marker-end="url(#arrow)"/>
<line x1="320" y1="341" x2="320" y2="355" class="arr" marker-end="url(#arrow)"/>

<g class="c-amber"><rect x="20" y="20" width="150" height="40" rx="8" stroke-width="0.8"/>
<text class="th" x="95" y="40" text-anchor="middle" dominant-baseline="central">Glandes salivaires</text>
<rect x="20" y="170" width="150" height="40" rx="8" stroke-width="0.8"/>
<text class="th" x="95" y="190" text-anchor="middle" dominant-baseline="central">Foie : bile</text>
<rect x="20" y="226" width="150" height="40" rx="8" stroke-width="0.8"/>
<text class="th" x="95" y="246" text-anchor="middle" dominant-baseline="central">Pancréas</text></g>
<line x1="172" y1="40" x2="226" y2="40" stroke="#854F0B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="172" y1="195" x2="226" y2="218" stroke="#854F0B" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="172" y1="246" x2="226" y2="240" stroke="#854F0B" stroke-width="2" marker-end="url(#arrow)"/>

<g class="c-red"><rect x="500" y="196" width="160" height="76" rx="12" stroke-width="1"/>
<text class="th" x="580" y="214" text-anchor="middle" dominant-baseline="central">Sang</text>
<text class="ts" x="580" y="234" text-anchor="middle" dominant-baseline="central">nutriments distribués</text>
<text class="ts" x="580" y="252" text-anchor="middle" dominant-baseline="central">à toutes les cellules</text>
<text class="ts" x="455" y="220" text-anchor="middle" dominant-baseline="central">absorption</text></g>
<line x1="414" y1="236" x2="496" y2="236" stroke="#A32D2D" stroke-width="2.5" marker-end="url(#arrow)"/>

<g class="c-amber"><circle cx="28" cy="420" r="6" stroke-width="1"/>
<text class="ts" x="40" y="420" text-anchor="start" dominant-baseline="central">sucs digestifs (enzymes, bile)</text></g>
<g class="c-red"><circle cx="258" cy="420" r="6" stroke-width="1"/>
<text class="ts" x="270" y="420" text-anchor="start" dominant-baseline="central">passage dans le sang</text></g>
<text class="ts" x="660" y="420" text-anchor="end" dominant-baseline="central">Pas à l'échelle.</text>
<text class="ts" x="500" y="300" text-anchor="start" dominant-baseline="central">Ce qui n'est pas absorbé</text>
<text class="ts" x="500" y="316" text-anchor="start" dominant-baseline="central">ne passe jamais dans le sang.</text>
</svg>
