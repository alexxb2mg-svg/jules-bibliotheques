<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Protocole d'obtention d'un maïs OGM résistant à un insecte, en six étapes">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-coral"><rect x="20" y="24" width="196" height="88" rx="8" stroke-width="0.5"/>
<text class="th" x="118" y="44" text-anchor="middle" dominant-baseline="central">1. Une bactérie du sol</text>
<text class="ts" x="118" y="64" text-anchor="middle" dominant-baseline="central">a un gène qui lui fait</text>
<text class="ts" x="118" y="80" text-anchor="middle" dominant-baseline="central">produire une toxine</text>
<text class="ts" x="118" y="96" text-anchor="middle" dominant-baseline="central">mortelle pour des chenilles</text></g>
<g class="c-coral"><rect x="242" y="24" width="196" height="88" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="44" text-anchor="middle" dominant-baseline="central">2. Isoler le gène</text>
<text class="ts" x="340" y="64" text-anchor="middle" dominant-baseline="central">on repère le gène</text>
<text class="ts" x="340" y="80" text-anchor="middle" dominant-baseline="central">de la toxine</text>
<text class="ts" x="340" y="96" text-anchor="middle" dominant-baseline="central">et on le copie</text></g>
<g class="c-green"><rect x="464" y="24" width="196" height="88" rx="8" stroke-width="0.5"/>
<text class="th" x="562" y="44" text-anchor="middle" dominant-baseline="central">3. L'insérer</text>
<text class="ts" x="562" y="64" text-anchor="middle" dominant-baseline="central">le gène est ajouté</text>
<text class="ts" x="562" y="80" text-anchor="middle" dominant-baseline="central">à l'ADN de cellules</text>
<text class="ts" x="562" y="96" text-anchor="middle" dominant-baseline="central">de maïs</text></g>

<g class="c-green"><rect x="464" y="184" width="196" height="88" rx="8" stroke-width="0.5"/>
<text class="th" x="562" y="204" text-anchor="middle" dominant-baseline="central">4. Cultiver les cellules</text>
<text class="ts" x="562" y="224" text-anchor="middle" dominant-baseline="central">sur un milieu nutritif,</text>
<text class="ts" x="562" y="240" text-anchor="middle" dominant-baseline="central">en laboratoire :</text>
<text class="ts" x="562" y="256" text-anchor="middle" dominant-baseline="central">elles se multiplient</text></g>
<g class="c-green"><rect x="242" y="184" width="196" height="88" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="204" text-anchor="middle" dominant-baseline="central">5. Obtenir des plants</text>
<text class="ts" x="340" y="224" text-anchor="middle" dominant-baseline="central">les cellules modifiées</text>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">redonnent des plantes</text>
<text class="ts" x="340" y="256" text-anchor="middle" dominant-baseline="central">entières</text></g>
<g class="c-green"><rect x="20" y="184" width="196" height="88" rx="8" stroke-width="0.5"/>
<text class="th" x="118" y="204" text-anchor="middle" dominant-baseline="central">6. Un maïs OGM</text>
<text class="ts" x="118" y="224" text-anchor="middle" dominant-baseline="central">il fabrique la toxine :</text>
<text class="ts" x="118" y="240" text-anchor="middle" dominant-baseline="central">il résiste à la pyrale,</text>
<text class="ts" x="118" y="256" text-anchor="middle" dominant-baseline="central">une chenille ravageuse</text></g>

<line x1="218" y1="68" x2="240" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="440" y1="68" x2="462" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="562" y1="114" x2="562" y2="182" class="arr" marker-end="url(#arrow)"/>
<line x1="462" y1="228" x2="440" y2="228" class="arr" marker-end="url(#arrow)"/>
<line x1="240" y1="228" x2="218" y2="228" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="340" y="138" text-anchor="middle" dominant-baseline="central">orange : ce qui vient de la bactérie</text></g>
<g class="c-green"><text class="ts" x="340" y="156" text-anchor="middle" dominant-baseline="central">vert : le maïs et ses cellules</text></g>

<text class="ts" x="20" y="302" text-anchor="start" dominant-baseline="central">Un seul gène, choisi, est ajouté : on sait quel caractère on donne à la plante.</text>
<text class="ts" x="20" y="320" text-anchor="start" dominant-baseline="central">La sélection classique, elle, croise des individus sur de nombreuses générations.</text>
</svg>
