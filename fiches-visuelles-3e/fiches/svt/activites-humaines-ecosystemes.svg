<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Un écosystème formé du biotope et de la biocénose ; des insecticides font baisser les insectes, ce qui se répercute en chaîne sur les autres êtres vivants">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="20" y="20" width="640" height="270" rx="10" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/>
<text class="th" x="36" y="40" text-anchor="start" dominant-baseline="central">Écosystème = biotope + biocénose</text>

<g class="c-amber"><rect x="36" y="64" width="150" height="190" rx="8" stroke-width="0.5"/>
<text class="th" x="111" y="88" text-anchor="middle" dominant-baseline="central">Biotope</text>
<text class="ts" x="111" y="112" text-anchor="middle" dominant-baseline="central">le milieu de vie :</text>
<text class="ts" x="111" y="130" text-anchor="middle" dominant-baseline="central">sol, eau, lumière,</text>
<text class="ts" x="111" y="148" text-anchor="middle" dominant-baseline="central">température, climat</text></g>
<line x1="190" y1="150" x2="226" y2="150" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<g class="c-green"><text class="th" x="440" y="72" text-anchor="middle" dominant-baseline="central">Biocénose : les êtres vivants en interaction</text></g>
<g class="c-green"><rect x="232" y="100" width="80" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="272" y="118" text-anchor="middle" dominant-baseline="central">plantes</text>
<text class="ts" x="272" y="136" text-anchor="middle" dominant-baseline="central">à fleurs</text></g>
<g class="c-green"><rect x="334" y="100" width="116" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="392" y="118" text-anchor="middle" dominant-baseline="central">insectes</text>
<text class="ts" x="392" y="136" text-anchor="middle" dominant-baseline="central">chenilles, abeilles</text></g>
<g class="c-green"><rect x="472" y="100" width="84" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="514" y="118" text-anchor="middle" dominant-baseline="central">mésanges</text>
<text class="ts" x="514" y="136" text-anchor="middle" dominant-baseline="central">insectivores</text></g>
<g class="c-green"><rect x="576" y="100" width="76" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="614" y="118" text-anchor="middle" dominant-baseline="central">éperviers</text>
<text class="ts" x="614" y="136" text-anchor="middle" dominant-baseline="central">rapaces</text></g>
<line x1="314" y1="126" x2="330" y2="126" class="arr" marker-end="url(#arrow)"/>
<line x1="452" y1="126" x2="468" y2="126" class="arr" marker-end="url(#arrow)"/>
<line x1="558" y1="126" x2="572" y2="126" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="440" y="92" text-anchor="middle" dominant-baseline="central">flèche : « est mangé par »</text>
<path d="M392 154 Q332 190 272 154" fill="none" stroke="#3B6D11" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-green"><text class="ts" x="332" y="190" text-anchor="middle" dominant-baseline="central">pollinisation</text></g>

<g class="c-red"><text class="th" x="392" y="222" text-anchor="middle" dominant-baseline="central">1. insectes ↓</text>
<text class="ts" x="514" y="170" text-anchor="middle" dominant-baseline="central">2. moins de</text>
<text class="ts" x="514" y="186" text-anchor="middle" dominant-baseline="central">nourriture ↓</text>
<text class="ts" x="614" y="170" text-anchor="middle" dominant-baseline="central">3. à leur</text>
<text class="ts" x="614" y="186" text-anchor="middle" dominant-baseline="central">tour ↓</text>
<text class="ts" x="272" y="222" text-anchor="middle" dominant-baseline="central">4. moins de fruits</text></g>

<g class="c-red"><rect x="36" y="316" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="131" y="335" text-anchor="middle" dominant-baseline="central">Déforestation, béton</text>
<text class="ts" x="131" y="354" text-anchor="middle" dominant-baseline="central">détruit ou modifie le milieu</text></g>
<g class="c-red"><rect x="300" y="316" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="395" y="335" text-anchor="middle" dominant-baseline="central">Insecticides</text>
<text class="ts" x="395" y="354" text-anchor="middle" dominant-baseline="central">épandus sur les cultures</text></g>
<line x1="111" y1="314" x2="111" y2="258" stroke="#A32D2D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="392" y1="314" x2="392" y2="234" stroke="#A32D2D" stroke-width="2" marker-end="url(#arrow)"/>
<g class="c-red"><text class="ts" x="20" y="394" text-anchor="start" dominant-baseline="central">Effet en chaîne : même des espèces non touchées directement par l'activité sont affectées.</text></g>
<text class="ts" x="20" y="416" text-anchor="start" dominant-baseline="central">En rouge : activités humaines et leurs effets. Exemple simplifié : un vrai écosystème compte bien plus d'espèces.</text>
</svg>
