blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: terre, titre: "La Terre, planète active", sous_titre: "rocheuse, 3e planète du Soleil", principal: true}
      - {id: plaques, titre: "Plaques lithosphériques", sous_titre: "rigides, quelques cm par an"}
      - {id: seismes, titre: "Séismes", sous_titre: "rupture brutale des roches"}
      - {id: volcans, titre: "Volcans", sous_titre: "remontée de magma"}
      - {id: eres, titre: "Ères géologiques", sous_titre: "4,6 milliards d'années d'histoire"}
    liens:
      - {de: terre, vers: plaques, libelle: "surface découpée en"}
      - {de: plaques, vers: seismes, libelle: "aux limites"}
      - {de: plaques, vers: volcans, libelle: "aux limites"}
      - {de: terre, vers: eres, libelle: "histoire"}
    jules: "La Terre est une **planète tellurique** (rocheuse), comme Mercure, Vénus et Mars ; Jupiter, Saturne, Uranus et Neptune sont des **planètes gazeuses**, plus grosses et plus loin du Soleil. Sa chaleur interne fait bouger les plaques : c'est la **dynamique interne**."

  - id: schema-plaques
    type: schema
    titre: "Coupe de la lithosphère : dorsale et subduction"
    svg: "geodynamique-globale.svg"
    jules: "Attention : sous les plaques, le manteau n'est **pas liquide**. Il est solide mais très chaud, et se déforme lentement, comme de la pâte ; le **magma** ne se forme qu'en quelques endroits, surtout aux limites de plaques."

  - id: schema-eres
    type: schema
    titre: "Les grandes ères géologiques (frise simplifiée)"
    svg: "geodynamique-globale-eres.svg"
    jules: "Les limites des ères correspondent à de grandes **crises biologiques** : beaucoup d'espèces disparaissent en peu de temps, d'autres se diversifient ensuite. La plus connue est celle d'il y a 66 millions d'années, qui a fait disparaître les **dinosaures** (sauf les oiseaux, leurs descendants)."

  - id: methode
    type: methode
    etapes:
      - "Situer la Terre : 3e planète à partir du Soleil, une **planète tellurique** (rocheuse), plus petite et plus proche du Soleil que les planètes gazeuses."
      - "Distinguer la **lithosphère** (croûte + haut du manteau, rigide, environ 100 km d'épaisseur) de l'**asthénosphère** en dessous (manteau chaud et déformable)."
      - "Sur une carte, repérer les **limites de plaques** : c'est là que se concentrent les séismes et la plupart des volcans."
      - "Nommer le mouvement à la limite : les plaques **s'écartent** (dorsale), l'une **plonge** sous l'autre (subduction) ou deux continents **entrent en collision** (chaîne de montagnes)."
      - "Relier le phénomène observé au mouvement : séisme = roches qui cassent brusquement ; volcan = magma qui remonte."
    jules: "Le **foyer** d'un séisme est l'endroit en profondeur où les roches cassent ; l'**épicentre** est le point de la surface juste au-dessus. Les ondes sismiques partent du foyer dans toutes les directions."

  - id: piege
    type: piege
    mauvaise_idee: "Les continents sont **immobiles** : la carte du monde a toujours été la même."
    pourquoi_faux: "Les plaques bougent, mais **très lentement** : quelques centimètres par an, à peu près la vitesse de pousse des ongles. Sur des millions d'années, cela fait des milliers de kilomètres."
    bonne_idee: "Les plaques se déplacent sans cesse de **quelques cm par an**. Une plaque n'est pas un continent : elle peut porter un continent et une **partie d'océan**."
    jules: "Calcul rapide : 2 cm par an pendant 100 millions d'années, c'est 2 000 km. L'Atlantique s'est ouvert ainsi, la **dorsale** au milieu de l'océan continue de l'élargir."

  - id: exemple
    type: exemple
    situation: "Autour de l'océan Pacifique, on trouve de très nombreux volcans et séismes : c'est la **ceinture de feu** (Japon, Indonésie, Andes, Alaska…)."
    calcul: "Sur une carte, ces volcans et séismes dessinent une ligne qui suit les bords de la **plaque Pacifique** et de ses voisines : ce sont des limites de plaques, surtout des zones de subduction."
    conclusion: "Ces phénomènes ne sont pas dus au hasard : là, une plaque plonge sous une autre. Les frottements font casser les roches (**séismes**) et la plaque qui plonge fait naître du **magma** qui remonte (volcans)."
    jules: "À l'inverse, le centre des grandes plaques est beaucoup plus calme : la région de Paris, loin de toute limite de plaques, n'a que des **séismes faibles** et aucun volcan actif."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "À retenir en trois mots : **écartement** (dorsale, volcans), **subduction** (séismes et volcans), **collision** (montagnes, comme l'Himalaya ou les Alpes)."
