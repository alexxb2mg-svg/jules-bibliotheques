<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comportements et effets sur le système nerveux">
<text class="th" x="175" y="18" text-anchor="middle" dominant-baseline="central">Favorable au système nerveux</text>
<text class="th" x="505" y="18" text-anchor="middle" dominant-baseline="central">Perturbe le système nerveux</text>
<g class="c-green"><rect x="20" y="36" width="310" height="112" rx="10" stroke-width="0.8"/>
<text class="th" x="175" y="58" text-anchor="middle" dominant-baseline="central">Dormir assez</text>
<text class="ts" x="175" y="82" text-anchor="middle" dominant-baseline="central">8 à 10 h par nuit à l'adolescence</text>
<text class="ts" x="175" y="100" text-anchor="middle" dominant-baseline="central">le cerveau récupère et consolide</text>
<text class="ts" x="175" y="118" text-anchor="middle" dominant-baseline="central">ce qui a été appris dans la journée</text>
<rect x="20" y="166" width="310" height="112" rx="10" stroke-width="0.8"/>
<text class="th" x="175" y="188" text-anchor="middle" dominant-baseline="central">S'entraîner, apprendre</text>
<text class="ts" x="175" y="212" text-anchor="middle" dominant-baseline="central">répéter un geste ou une leçon</text>
<text class="ts" x="175" y="230" text-anchor="middle" dominant-baseline="central">renforce les connexions entre neurones</text>
<text class="ts" x="175" y="248" text-anchor="middle" dominant-baseline="central">le geste devient plus rapide et précis</text></g>
<g class="c-red"><rect x="350" y="36" width="310" height="112" rx="10" stroke-width="0.8"/>
<text class="th" x="505" y="58" text-anchor="middle" dominant-baseline="central">Drogues, alcool, tabac</text>
<text class="ts" x="505" y="82" text-anchor="middle" dominant-baseline="central">leurs molécules agissent sur les synapses :</text>
<text class="ts" x="505" y="100" text-anchor="middle" dominant-baseline="central">imitent ou dérèglent les neurotransmetteurs</text>
<text class="ts" x="505" y="118" text-anchor="middle" dominant-baseline="central">réflexes ralentis, risque de dépendance</text>
<rect x="350" y="166" width="310" height="112" rx="10" stroke-width="0.8"/>
<text class="th" x="505" y="188" text-anchor="middle" dominant-baseline="central">Dopage, manque de sommeil</text>
<text class="ts" x="505" y="212" text-anchor="middle" dominant-baseline="central">des produits dopants masquent la fatigue</text>
<text class="ts" x="505" y="230" text-anchor="middle" dominant-baseline="central">et poussent le corps au-delà de ses limites ;</text>
<text class="ts" x="505" y="248" text-anchor="middle" dominant-baseline="central">trop peu dormir gêne attention et mémoire</text></g>
</svg>
