<svg width="100%" viewBox="0 0 680 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="L'effet de serre : la lumière du Soleil chauffe le sol, le sol émet des infrarouges, les gaz à effet de serre en renvoient une partie vers le sol ; les activités humaines renforcent cet effet">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-amber"><circle cx="58" cy="56" r="36" stroke-width="0.5"/>
<text class="th" x="58" y="56" text-anchor="middle" dominant-baseline="central">Soleil</text></g>
<g class="c-amber"><text class="ts" x="104" y="100" text-anchor="start" dominant-baseline="central">lumière du Soleil :</text>
<text class="ts" x="104" y="116" text-anchor="start" dominant-baseline="central">elle traverse l'atmosphère</text></g>

<text class="ts" x="330" y="36" text-anchor="start" dominant-baseline="central">une partie s'échappe vers l'espace</text>

<g class="c-gray"><rect x="20" y="136" width="640" height="70" rx="4" stroke-width="0.5"/>
<text class="th" x="460" y="156" text-anchor="start" dominant-baseline="central">atmosphère</text>
<text class="ts" x="460" y="174" text-anchor="start" dominant-baseline="central">gaz à effet de serre :</text>
<text class="ts" x="460" y="190" text-anchor="start" dominant-baseline="central">vapeur d'eau, CO₂, CH₄…</text></g>

<g class="c-gray"><rect x="20" y="320" width="640" height="40" rx="4" stroke-width="0.5"/>
<text class="th" x="340" y="340" text-anchor="middle" dominant-baseline="central">sol et océans, chauffés par la lumière</text></g>

<line x1="80" y1="94" x2="168" y2="314" stroke="#BA7517" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="280" y1="316" x2="300" y2="140" stroke="#D85A30" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="304" y1="132" x2="318" y2="46" stroke="#D85A30" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="200" x2="420" y2="314" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arrow)"/>

<g class="c-coral"><text class="ts" x="268" y="246" text-anchor="end" dominant-baseline="central">le sol émet</text>
<text class="ts" x="268" y="262" text-anchor="end" dominant-baseline="central">des infrarouges</text>
<text class="ts" x="268" y="278" text-anchor="end" dominant-baseline="central">(de la chaleur)</text>
<text class="ts" x="398" y="240" text-anchor="start" dominant-baseline="central">les gaz à effet de serre en renvoient</text>
<text class="ts" x="398" y="256" text-anchor="start" dominant-baseline="central">une partie vers le sol : il se réchauffe</text></g>

<g class="c-red"><rect x="20" y="376" width="640" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="395" text-anchor="middle" dominant-baseline="central">Depuis l'ère industrielle : l'effet de serre est renforcé</text>
<text class="ts" x="340" y="416" text-anchor="middle" dominant-baseline="central">charbon, pétrole et gaz brûlés, forêts détruites → plus de CO₂ dans l'air → réchauffement</text></g>
</svg>
