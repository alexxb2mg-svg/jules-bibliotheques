<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Contamination, infection, réaction immunitaire et moyens de lutte">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="20" y1="18" x2="656" y2="18" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="20" y="30" dominant-baseline="central">le temps passe</text>

<g class="c-red"><rect x="20" y="44" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="63" text-anchor="middle" dominant-baseline="central">contamination</text>
<text class="ts" x="120" y="81" text-anchor="middle" dominant-baseline="central">le microbe entre dans le corps</text></g>
<line x1="226" y1="72" x2="256" y2="72" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="262" y="44" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="357" y="63" text-anchor="middle" dominant-baseline="central">infection</text>
<text class="ts" x="357" y="81" text-anchor="middle" dominant-baseline="central">il se multiplie</text></g>
<line x1="458" y1="72" x2="478" y2="72" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="484" y="44" width="176" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="572" y="63" text-anchor="middle" dominant-baseline="central">réaction immunitaire</text>
<text class="ts" x="572" y="81" text-anchor="middle" dominant-baseline="central">le corps élimine le microbe</text></g>

<line x1="105" y1="140" x2="105" y2="106" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="20" y="140" width="170" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="157" text-anchor="middle" dominant-baseline="central">hygiène</text>
<text class="ts" x="105" y="175" text-anchor="middle" dominant-baseline="central">empêche la contamination</text></g>
<line x1="206" y1="206" x2="206" y2="106" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="20" y="206" width="220" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="130" y="223" text-anchor="middle" dominant-baseline="central">antiseptique</text>
<text class="ts" x="130" y="241" text-anchor="middle" dominant-baseline="central">désinfecte la peau, une plaie</text></g>
<line x1="357" y1="140" x2="357" y2="106" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="252" y="140" width="210" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="357" y="157" text-anchor="middle" dominant-baseline="central">antibiotique</text>
<text class="ts" x="357" y="175" text-anchor="middle" dominant-baseline="central">tue les bactéries, pas les virus</text></g>
<line x1="572" y1="140" x2="572" y2="106" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="474" y="140" width="196" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="572" y="157" text-anchor="middle" dominant-baseline="central">vaccination</text>
<text class="ts" x="572" y="175" text-anchor="middle" dominant-baseline="central">prépare la réaction à l'avance</text></g>
<g class="c-blue"><text class="ts" x="572" y="214" text-anchor="middle" dominant-baseline="central">fièvre, inflammation :</text>
<text class="ts" x="572" y="230" text-anchor="middle" dominant-baseline="central">signes que le corps se défend</text></g>

<g class="c-gray"><rect x="20" y="282" width="640" height="78" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="302" text-anchor="middle" dominant-baseline="central">Le microbiote : les micro-organismes utiles que nous hébergeons</text>
<text class="ts" x="340" y="322" text-anchor="middle" dominant-baseline="central">dans l'intestin, sur la peau, dans la bouche ; la plupart sont inoffensifs ou utiles</text>
<text class="ts" x="340" y="340" text-anchor="middle" dominant-baseline="central">ils aident à digérer certaines fibres, produisent des vitamines, occupent la place des pathogènes</text></g>
</svg>
