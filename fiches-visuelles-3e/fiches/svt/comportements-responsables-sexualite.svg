<svg width="100%" viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Étapes menant à une grossesse et méthodes contraceptives qui les bloquent">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="15" y="18" dominant-baseline="central">Les étapes vers une grossesse</text>
<g class="c-pink"><rect x="15" y="34" width="140" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="85" y="52" text-anchor="middle" dominant-baseline="central">ovulation</text>
<text class="ts" x="85" y="70" text-anchor="middle" dominant-baseline="central">l'ovaire libère</text>
<text class="ts" x="85" y="86" text-anchor="middle" dominant-baseline="central">un ovule</text></g>
<line x1="159" y1="67" x2="181" y2="67" class="arr" marker-end="url(#arrow)"/>
<g class="c-pink"><rect x="185" y="34" width="140" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="255" y="52" text-anchor="middle" dominant-baseline="central">fécondation</text>
<text class="ts" x="255" y="70" text-anchor="middle" dominant-baseline="central">ovule + spermatozoïde</text>
<text class="ts" x="255" y="86" text-anchor="middle" dominant-baseline="central">dans la trompe</text></g>
<line x1="329" y1="67" x2="351" y2="67" class="arr" marker-end="url(#arrow)"/>
<g class="c-pink"><rect x="355" y="34" width="140" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="425" y="52" text-anchor="middle" dominant-baseline="central">nidation</text>
<text class="ts" x="425" y="70" text-anchor="middle" dominant-baseline="central">l'embryon s'implante</text>
<text class="ts" x="425" y="86" text-anchor="middle" dominant-baseline="central">dans l'utérus</text></g>
<line x1="499" y1="67" x2="521" y2="67" class="arr" marker-end="url(#arrow)"/>
<g class="c-pink"><rect x="525" y="34" width="140" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="595" y="52" text-anchor="middle" dominant-baseline="central">grossesse</text>
<text class="ts" x="595" y="70" text-anchor="middle" dominant-baseline="central">environ 9 mois</text></g>

<g class="c-green"><text class="th" x="480" y="118" dominant-baseline="central">En vert : les méthodes</text>
<text class="th" x="480" y="136" dominant-baseline="central">qui bloquent une étape</text></g>
<path d="M70 150 V104 M60 104 H80" stroke="#3B6D11" stroke-width="2" fill="none"/>
<g class="c-green"><rect x="15" y="150" width="125" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="77" y="167" text-anchor="middle" dominant-baseline="central">pilule, implant</text>
<text class="ts" x="77" y="185" text-anchor="middle" dominant-baseline="central">hormones qui</text>
<text class="ts" x="77" y="200" text-anchor="middle" dominant-baseline="central">bloquent l'ovulation</text></g>
<path d="M148 226 V104 M138 104 H158" stroke="#3B6D11" stroke-width="2" fill="none"/>
<g class="c-green"><rect x="15" y="226" width="160" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="243" text-anchor="middle" dominant-baseline="central">pilule d'urgence</text>
<text class="ts" x="95" y="261" text-anchor="middle" dominant-baseline="central">retarde l'ovulation,</text>
<text class="ts" x="95" y="276" text-anchor="middle" dominant-baseline="central">à prendre au plus vite</text></g>
<path d="M230 150 V104 M220 104 H240" stroke="#3B6D11" stroke-width="2" fill="none"/>
<g class="c-green"><rect x="185" y="150" width="150" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="260" y="167" text-anchor="middle" dominant-baseline="central">préservatif</text>
<text class="ts" x="260" y="185" text-anchor="middle" dominant-baseline="central">barrière : empêche</text>
<text class="ts" x="260" y="200" text-anchor="middle" dominant-baseline="central">la rencontre</text></g>
<path d="M350 226 V120 H300 V104 M290 104 H310 M350 120 H440 V104 M430 104 H450" stroke="#3B6D11" stroke-width="2" fill="none"/>
<g class="c-green"><rect x="270" y="226" width="170" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="355" y="243" text-anchor="middle" dominant-baseline="central">stérilet</text>
<text class="ts" x="355" y="261" text-anchor="middle" dominant-baseline="central">placé dans l'utérus, gêne</text>
<text class="ts" x="355" y="276" text-anchor="middle" dominant-baseline="central">fécondation et nidation</text></g>

<g class="c-green"><rect x="470" y="150" width="195" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="567" y="167" text-anchor="middle" dominant-baseline="central">seul le préservatif</text>
<text class="ts" x="567" y="185" text-anchor="middle" dominant-baseline="central">protège aussi des IST</text>
<text class="ts" x="567" y="200" text-anchor="middle" dominant-baseline="central">(voir le schéma suivant)</text></g>
<text class="ts" x="15" y="312" dominant-baseline="central">Retrait ou calcul des dates : très peu fiables, ce ne sont pas des contraceptions.</text>
<text class="ts" x="15" y="330" dominant-baseline="central">Pour choisir : médecin, sage-femme, centre de santé sexuelle, infirmière scolaire.</text>
</svg>
