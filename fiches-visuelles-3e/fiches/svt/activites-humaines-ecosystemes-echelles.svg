<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Deux exemples : un impact direct et local (parking sur une zone humide) et un impact indirect et global (gaz à effet de serre, réchauffement, coraux) ; et des actions humaines bénéfiques">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="175" y="20" text-anchor="middle" dominant-baseline="central">Impact direct et local</text>
<text class="th" x="505" y="20" text-anchor="middle" dominant-baseline="central">Impact indirect et global</text>

<g class="c-red"><rect x="40" y="40" width="270" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="175" y="59" text-anchor="middle" dominant-baseline="central">Un parking est construit</text>
<text class="ts" x="175" y="78" text-anchor="middle" dominant-baseline="central">sur une zone humide (une mare, un marais)</text></g>
<line x1="175" y1="98" x2="175" y2="130" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="134" width="270" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="175" y="153" text-anchor="middle" dominant-baseline="central">Le milieu disparaît, sur place</text>
<text class="ts" x="175" y="173" text-anchor="middle" dominant-baseline="central">grenouilles, libellules, plantes d'eau</text>
<text class="ts" x="175" y="190" text-anchor="middle" dominant-baseline="central">perdent leur habitat, tout de suite</text></g>

<g class="c-red"><rect x="370" y="40" width="270" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="505" y="59" text-anchor="middle" dominant-baseline="central">Gaz à effet de serre émis</text>
<text class="ts" x="505" y="78" text-anchor="middle" dominant-baseline="central">transports, usines, chauffage, élevage</text></g>
<line x1="505" y1="98" x2="505" y2="130" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="370" y="134" width="270" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="505" y="154" text-anchor="middle" dominant-baseline="central">Réchauffement climatique</text></g>
<line x1="505" y1="176" x2="505" y2="204" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="370" y="208" width="270" height="74" rx="8" stroke-width="0.5"/>
<text class="th" x="505" y="227" text-anchor="middle" dominant-baseline="central">Des océans plus chauds</text>
<text class="ts" x="505" y="247" text-anchor="middle" dominant-baseline="central">les coraux blanchissent et peuvent</text>
<text class="ts" x="505" y="264" text-anchor="middle" dominant-baseline="central">mourir, loin des lieux d'émission</text></g>

<g class="c-green"><rect x="40" y="306" width="600" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="326" text-anchor="middle" dominant-baseline="central">Des actions humaines peuvent aussi être bénéfiques</text>
<text class="ts" x="340" y="348" text-anchor="middle" dominant-baseline="central">replanter des haies, restaurer une zone humide, créer une réserve naturelle</text></g>
<text class="ts" x="660" y="388" text-anchor="end" dominant-baseline="central">En rouge : l'action humaine ; en vert : une action favorable</text>
</svg>
