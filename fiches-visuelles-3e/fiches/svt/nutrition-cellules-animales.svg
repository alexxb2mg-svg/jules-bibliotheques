<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Poumons, intestin, cœur et sang apportent dioxygène et nutriments aux cellules et remportent leurs déchets">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-blue"><text class="ts" x="20" y="48" text-anchor="start" dominant-baseline="central">air inspiré : apporte O₂</text></g>
<g class="c-coral"><text class="ts" x="20" y="68" text-anchor="start" dominant-baseline="central">air expiré : emporte CO₂</text></g>
<line x1="176" y1="50" x2="213" y2="50" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="213" y1="66" x2="176" y2="66" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="215" y="30" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="300" y="49" text-anchor="middle" dominant-baseline="central">Poumons</text>
<text class="ts" x="300" y="67" text-anchor="middle" dominant-baseline="central">système respiratoire</text></g>

<line x1="270" y1="88" x2="270" y2="138" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="th" x="260" y="113" text-anchor="end" dominant-baseline="central">O₂</text></g>
<line x1="330" y1="138" x2="330" y2="88" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="th" x="340" y="113" text-anchor="start" dominant-baseline="central">CO₂</text></g>

<g class="c-gray"><rect x="215" y="140" width="170" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="300" y="162" text-anchor="middle" dominant-baseline="central">Cœur et sang</text>
<text class="ts" x="300" y="184" text-anchor="middle" dominant-baseline="central">le cœur propulse le sang</text>
<text class="ts" x="300" y="202" text-anchor="middle" dominant-baseline="central">dans les vaisseaux</text>
<text class="ts" x="300" y="218" text-anchor="middle" dominant-baseline="central">(système cardiovasculaire)</text></g>

<line x1="300" y1="288" x2="300" y2="232" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-green"><text class="th" x="310" y="260" text-anchor="start" dominant-baseline="central">nutriments</text></g>

<g class="c-green"><rect x="215" y="290" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="300" y="309" text-anchor="middle" dominant-baseline="central">Intestin grêle</text>
<text class="ts" x="300" y="327" text-anchor="middle" dominant-baseline="central">système digestif</text></g>
<text class="ts" x="20" y="310" text-anchor="start" dominant-baseline="central">aliments</text>
<text class="ts" x="20" y="326" text-anchor="start" dominant-baseline="central">digérés</text>
<line x1="90" y1="318" x2="212" y2="318" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><text class="ts" x="300" y="364" text-anchor="middle" dominant-baseline="central">microbiote : bactéries de l'intestin qui aident à digérer</text></g>

<g class="c-blue"><text class="ts" x="442" y="141" text-anchor="middle" dominant-baseline="central">O₂</text></g>
<line x1="387" y1="152" x2="497" y2="152" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-green"><text class="ts" x="442" y="171" text-anchor="middle" dominant-baseline="central">nutriments</text></g>
<line x1="387" y1="182" x2="497" y2="182" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="442" y="203" text-anchor="middle" dominant-baseline="central">CO₂, déchets</text></g>
<line x1="497" y1="214" x2="387" y2="214" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="500" y="140" width="160" height="90" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="162" text-anchor="middle" dominant-baseline="central">Cellules</text>
<text class="ts" x="580" y="184" text-anchor="middle" dominant-baseline="central">de tous les organes :</text>
<text class="ts" x="580" y="202" text-anchor="middle" dominant-baseline="central">muscles, cerveau, peau…</text>
<text class="ts" x="580" y="218" text-anchor="middle" dominant-baseline="central">produisent de l'énergie</text></g>

<line x1="386" y1="228" x2="497" y2="300" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="452" y="258" text-anchor="start" dominant-baseline="central">déchets (urée)</text></g>
<g class="c-coral"><rect x="500" y="290" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="309" text-anchor="middle" dominant-baseline="central">Reins</text>
<text class="ts" x="580" y="327" text-anchor="middle" dominant-baseline="central">déchets rejetés : urine</text></g>

<text class="ts" x="20" y="400" text-anchor="start" dominant-baseline="central">vert : nutriments · bleu : dioxygène · orange : CO₂ et autres déchets · pas à l'échelle</text>
</svg>
