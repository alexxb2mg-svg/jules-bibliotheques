<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Commande hormonale des testicules et des ovaires">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="240" y="16" width="200" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="33" text-anchor="middle" dominant-baseline="central">hypophyse</text>
<text class="ts" x="340" y="51" text-anchor="middle" dominant-baseline="central">glande sous le cerveau</text></g>
<line x1="280" y1="70" x2="240" y2="120" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400" y1="70" x2="440" y2="120" stroke="#854F0B" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-amber"><text class="ts" x="250" y="88" text-anchor="end" dominant-baseline="central">FSH et LH</text>
<text class="ts" x="430" y="88" dominant-baseline="central">FSH et LH</text>
<text class="ts" x="340" y="104" text-anchor="middle" dominant-baseline="central">hormones dans le sang</text></g>

<text class="th" x="40" y="112" text-anchor="start" dominant-baseline="central">Homme</text>
<g class="c-blue"><rect x="40" y="126" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="143" text-anchor="middle" dominant-baseline="central">testicules</text>
<text class="ts" x="170" y="161" text-anchor="middle" dominant-baseline="central">fonctionnent dès la puberté</text></g>
<line x1="102" y1="180" x2="102" y2="212" class="arr" marker-end="url(#arrow)"/>
<line x1="237" y1="180" x2="237" y2="212" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="40" y="218" width="125" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="102" y="240" text-anchor="middle" dominant-baseline="central">spermatozoïdes</text>
<text class="ts" x="102" y="280" text-anchor="middle" dominant-baseline="central">en continu,</text>
<text class="ts" x="102" y="296" text-anchor="middle" dominant-baseline="central">des millions par jour</text></g>
<g class="c-amber"><rect x="175" y="218" width="125" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="237" y="240" text-anchor="middle" dominant-baseline="central">testostérone</text>
<text class="ts" x="237" y="280" text-anchor="middle" dominant-baseline="central">mue de la voix,</text>
<text class="ts" x="237" y="296" text-anchor="middle" dominant-baseline="central">poils, muscles</text></g>

<text class="th" x="640" y="112" text-anchor="end" dominant-baseline="central">Femme</text>
<g class="c-pink"><rect x="380" y="126" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="510" y="143" text-anchor="middle" dominant-baseline="central">ovaires</text>
<text class="ts" x="510" y="161" text-anchor="middle" dominant-baseline="central">fonctionnent dès la puberté</text></g>
<line x1="442" y1="180" x2="442" y2="212" class="arr" marker-end="url(#arrow)"/>
<line x1="577" y1="180" x2="577" y2="212" class="arr" marker-end="url(#arrow)"/>
<g class="c-pink"><rect x="380" y="218" width="125" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="442" y="240" text-anchor="middle" dominant-baseline="central">ovules</text>
<text class="ts" x="442" y="280" text-anchor="middle" dominant-baseline="central">un par cycle,</text>
<text class="ts" x="442" y="296" text-anchor="middle" dominant-baseline="central">environ chaque mois</text></g>
<g class="c-amber"><rect x="515" y="218" width="125" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="577" y="232" text-anchor="middle" dominant-baseline="central">œstrogènes</text>
<text class="ts" x="577" y="250" text-anchor="middle" dominant-baseline="central">et progestérone</text>
<text class="ts" x="577" y="280" text-anchor="middle" dominant-baseline="central">seins, poils,</text>
<text class="ts" x="577" y="296" text-anchor="middle" dominant-baseline="central">cycle de l'utérus</text></g>

<g class="c-amber"><rect x="40" y="318" width="600" height="36" rx="8" stroke-width="0.5"/>
<text class="ts" x="340" y="336" text-anchor="middle" dominant-baseline="central">Les hormones : des messagers chimiques transportés par le sang jusqu'aux organes</text></g>
</svg>
