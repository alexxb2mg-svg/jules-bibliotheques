<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="70" y1="260" x2="650" y2="260" class="arr" marker-end="url(#arrow)"/>
<line x1="70" y1="260" x2="70" y2="30" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="650" y="280" text-anchor="end" dominant-baseline="central">temps</text>
<text class="ts" x="0" y="0" text-anchor="middle" dominant-baseline="central" transform="translate(40 150) rotate(-90)">anticorps dans le sang</text>

<line x1="110" y1="260" x2="110" y2="62" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
