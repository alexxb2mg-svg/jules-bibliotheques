<g class="c-coral"><text class="ts" x="116" y="48" dominant-baseline="central">1er contact (vaccin)</text>
<text class="ts" x="396" y="48" dominant-baseline="central">2e contact (vrai microbe)</text></g>

<path d="M72 258 H170 C190 256 200 212 222 210 C250 208 270 236 330 244 C350 246 370 247 390 247 C400 247 404 160 420 105 C430 88 440 86 460 90 C520 100 580 130 640 148" fill="none" stroke="#185FA5" stroke-width="2.5"/>

<g class="c-blue"><text class="ts" x="226" y="190" text-anchor="middle" dominant-baseline="central">réponse lente et faible</text>
<text class="ts" x="470" y="180" dominant-baseline="central">réponse rapide et forte</text>
<text class="ts" x="470" y="196" dominant-baseline="central">grâce aux lymphocytes mémoire</text></g>

<line x1="112" y1="276" x2="176" y2="276" stroke="#5F5E5A" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="144" y="296" text-anchor="middle" dominant-baseline="central">délai long</text>
<line x1="392" y1="276" x2="410" y2="276" stroke="#5F5E5A" stroke-width="1" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="401" y="296" text-anchor="middle" dominant-baseline="central">délai court</text>
