<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Frise simplifiée des ères géologiques, du Précambrien au Cénozoïque, avec deux grandes crises biologiques">
<text class="ts" x="20" y="22" text-anchor="start" dominant-baseline="central">formation de la Terre</text>
<g class="c-red"><text class="ts" x="380" y="30" text-anchor="middle" dominant-baseline="central">crise</text>
<text class="ts" x="520" y="30" text-anchor="middle" dominant-baseline="central">crise</text></g>

<g class="c-gray"><rect x="20" y="46" width="210" height="70" stroke-width="0.5"/>
<text class="th" x="125" y="68" text-anchor="middle" dominant-baseline="central">Précambrien</text>
<text class="ts" x="125" y="88" text-anchor="middle" dominant-baseline="central">premières formes de vie,</text>
<text class="ts" x="125" y="103" text-anchor="middle" dominant-baseline="central">longtemps unicellulaires</text></g>
<g class="c-teal"><rect x="230" y="46" width="150" height="70" stroke-width="0.5"/>
<text class="th" x="305" y="68" text-anchor="middle" dominant-baseline="central">Paléozoïque</text>
<text class="ts" x="305" y="88" text-anchor="middle" dominant-baseline="central">ère primaire</text>
<text class="ts" x="305" y="103" text-anchor="middle" dominant-baseline="central">poissons, forêts</text></g>
<g class="c-teal"><rect x="380" y="46" width="140" height="70" stroke-width="0.5"/>
<text class="th" x="450" y="68" text-anchor="middle" dominant-baseline="central">Mésozoïque</text>
<text class="ts" x="450" y="88" text-anchor="middle" dominant-baseline="central">ère secondaire</text>
<text class="ts" x="450" y="103" text-anchor="middle" dominant-baseline="central">dinosaures</text></g>
<g class="c-teal"><rect x="520" y="46" width="140" height="70" stroke-width="0.5"/>
<text class="th" x="590" y="68" text-anchor="middle" dominant-baseline="central">Cénozoïque</text>
<text class="ts" x="590" y="88" text-anchor="middle" dominant-baseline="central">tertiaire, quaternaire</text>
<text class="ts" x="590" y="103" text-anchor="middle" dominant-baseline="central">mammifères, humains</text></g>

<path d="M380 38 L380 124" fill="none" stroke="#A32D2D" stroke-width="3"/>
<path d="M520 38 L520 124" fill="none" stroke="#A32D2D" stroke-width="3"/>

<line x1="20" y1="116" x2="20" y2="130" stroke="#5F5E5A" stroke-width="1"/>
<line x1="230" y1="116" x2="230" y2="130" stroke="#5F5E5A" stroke-width="1"/>
<line x1="660" y1="116" x2="660" y2="130" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="20" y="144" text-anchor="start" dominant-baseline="central">−4,6 milliards</text>
<text class="ts" x="20" y="160" text-anchor="start" dominant-baseline="central">d'années</text>
<text class="ts" x="230" y="144" text-anchor="middle" dominant-baseline="central">−540 millions</text>
<text class="ts" x="230" y="160" text-anchor="middle" dominant-baseline="central">d'années</text>
<text class="ts" x="380" y="144" text-anchor="middle" dominant-baseline="central">−252 millions</text>
<text class="ts" x="380" y="160" text-anchor="middle" dominant-baseline="central">d'années</text>
<text class="ts" x="520" y="144" text-anchor="middle" dominant-baseline="central">−66 millions</text>
<text class="ts" x="520" y="160" text-anchor="middle" dominant-baseline="central">d'années</text>
<text class="ts" x="660" y="144" text-anchor="end" dominant-baseline="central">aujourd'hui</text>

<g class="c-red"><rect x="150" y="186" width="250" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="275" y="206" text-anchor="middle" dominant-baseline="central">Fin du Paléozoïque</text>
<text class="ts" x="275" y="226" text-anchor="middle" dominant-baseline="central">la plus grande extinction connue,</text>
<text class="ts" x="275" y="241" text-anchor="middle" dominant-baseline="central">liée à un volcanisme géant</text></g>
<g class="c-red"><rect x="420" y="186" width="240" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="206" text-anchor="middle" dominant-baseline="central">Fin du Mésozoïque</text>
<text class="ts" x="540" y="226" text-anchor="middle" dominant-baseline="central">disparition des dinosaures</text>
<text class="ts" x="540" y="241" text-anchor="middle" dominant-baseline="central">(sauf les oiseaux) : astéroïde</text></g>

<text class="ts" x="20" y="280" text-anchor="start" dominant-baseline="central">Pas à l'échelle : le Précambrien dure à lui seul près de 88 % de l'histoire de la Terre.</text>
</svg>
