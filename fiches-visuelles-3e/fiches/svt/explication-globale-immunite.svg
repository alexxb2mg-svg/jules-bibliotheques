<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Les lignes de défense de l'organisme">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="20" y="16" width="400" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="220" y="33" text-anchor="middle" dominant-baseline="central">1. Barrières : peau, muqueuses</text>
<text class="ts" x="220" y="51" text-anchor="middle" dominant-baseline="central">mucus, larmes : la plupart des microbes n'entrent pas</text></g>
<line x1="120" y1="72" x2="120" y2="100" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="134" y="86" dominant-baseline="central">une plaie : le microbe entre</text></g>

<g class="c-blue"><rect x="20" y="106" width="400" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="220" y="123" text-anchor="middle" dominant-baseline="central">2. Réaction rapide, en quelques heures</text>
<text class="ts" x="220" y="141" text-anchor="middle" dominant-baseline="central">inflammation ; les phagocytes englobent et digèrent</text></g>
<line x1="120" y1="162" x2="120" y2="190" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="134" y="176" dominant-baseline="central">si le microbe se multiplie encore</text></g>

<text class="th" x="220" y="208" text-anchor="middle" dominant-baseline="central">3. Réaction spécifique, en quelques jours</text>
<g class="c-blue"><rect x="20" y="222" width="195" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="117" y="239" text-anchor="middle" dominant-baseline="central">lymphocytes B</text>
<text class="ts" x="117" y="257" text-anchor="middle" dominant-baseline="central">produisent les anticorps</text></g>
<g class="c-blue"><rect x="225" y="222" width="195" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="322" y="239" text-anchor="middle" dominant-baseline="central">lymphocytes T</text>
<text class="ts" x="322" y="257" text-anchor="middle" dominant-baseline="central">tuent les cellules infectées</text></g>
<line x1="120" y1="276" x2="120" y2="300" class="arr" marker-end="url(#arrow)"/>

<g class="c-blue"><rect x="20" y="306" width="400" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="220" y="323" text-anchor="middle" dominant-baseline="central">4. Mémoire : des lymphocytes mémoire restent</text>
<text class="ts" x="220" y="341" text-anchor="middle" dominant-baseline="central">au contact suivant, réaction plus rapide : principe du vaccin</text></g>

<text class="ts" x="660" y="16" text-anchor="end" dominant-baseline="central">pas à l'échelle</text>
<g class="c-coral"><circle cx="550" cy="120" r="36" stroke-width="1"/>
<text class="th" x="550" y="120" text-anchor="middle" dominant-baseline="central">microbe</text></g>
<path d="M544 86 L550 74 L556 86 Z M586 114 L598 120 L586 126 Z M514 114 L502 120 L514 126 Z" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<path d="M0 18 V0 L-8 -10 M0 0 L8 -10" transform="translate(550 62) rotate(180)" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<path d="M0 18 V0 L-8 -10 M0 0 L8 -10" transform="translate(608 120) rotate(-90)" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<path d="M0 18 V0 L-8 -10 M0 0 L8 -10" transform="translate(492 120) rotate(90)" fill="none" stroke="#185FA5" stroke-width="2.5" stroke-linecap="round"/>
<g class="c-blue"><text class="ts" x="562" y="42" dominant-baseline="central">anticorps</text></g>
<line x1="606" y1="88" x2="594" y2="114" class="leader"/>
<g class="c-coral"><text class="ts" x="606" y="80" dominant-baseline="central">antigène</text></g>
<text class="ts" x="550" y="176" text-anchor="middle" dominant-baseline="central">chaque anticorps se fixe</text>
<text class="ts" x="550" y="192" text-anchor="middle" dominant-baseline="central">sur un antigène précis</text>

<g class="c-blue"><circle cx="550" cy="270" r="42" stroke-width="1"/></g>
<g class="c-coral"><circle cx="538" cy="262" r="8" stroke-width="1"/><circle cx="562" cy="280" r="8" stroke-width="1"/></g>
<g class="c-blue"><text class="ts" x="550" y="328" text-anchor="middle" dominant-baseline="central">phagocyte : il englobe</text>
<text class="ts" x="550" y="344" text-anchor="middle" dominant-baseline="central">et digère les microbes</text></g>
</svg>
