<text class="th" x="20" y="104" text-anchor="start" dominant-baseline="central">Neurone 1</text>
<text class="ts" x="20" y="124" text-anchor="start" dominant-baseline="central">présynaptique</text>
<text class="th" x="520" y="160" text-anchor="middle" dominant-baseline="central">Neurone 2</text>
<text class="ts" x="520" y="180" text-anchor="middle" dominant-baseline="central">postsynaptique</text>

<g class="c-amber"><text class="ts" x="130" y="40" text-anchor="middle" dominant-baseline="central">vésicules remplies de</text>
<text class="ts" x="130" y="56" text-anchor="middle" dominant-baseline="central">neurotransmetteurs</text>
<text class="ts" x="330" y="30" text-anchor="middle" dominant-baseline="central">fente synaptique</text>
<text class="ts" x="330" y="46" text-anchor="middle" dominant-baseline="central">(libération chimique)</text>
<text class="ts" x="440" y="60" text-anchor="start" dominant-baseline="central">récepteurs</text></g>
<line x1="160" y1="66" x2="222" y2="112" class="leader"/>
<line x1="330" y1="56" x2="330" y2="112" class="leader"/>
<line x1="436" y1="62" x2="358" y2="128" class="leader"/>

<line x1="30" y1="212" x2="170" y2="212" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="ts" x="20" y="232" text-anchor="start" dominant-baseline="central">influx nerveux</text>
<text class="ts" x="20" y="248" text-anchor="start" dominant-baseline="central">(signal électrique)</text></g>
<line x1="380" y1="230" x2="640" y2="230" stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="ts" x="510" y="246" text-anchor="middle" dominant-baseline="central">nouveau message électrique</text></g>

<text class="ts" x="340" y="286" text-anchor="middle" dominant-baseline="central">1. l'influx arrive  →  2. neurotransmetteurs libérés  →  3. fixés sur les récepteurs</text>
<text class="ts" x="340" y="312" text-anchor="middle" dominant-baseline="central">Sens unique : toujours du neurone 1 vers le neurone 2.</text>
<text class="ts" x="340" y="332" text-anchor="middle" dominant-baseline="central">Pas à l'échelle : la fente synaptique est plus fine qu'un millième de millimètre.</text>
</svg>
