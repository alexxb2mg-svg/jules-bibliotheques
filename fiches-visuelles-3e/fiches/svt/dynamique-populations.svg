<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ce qui fait varier l'effectif d'une population : naissances, arrivées, décès, départs et facteurs du milieu">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-green"><text class="th" x="95" y="30" text-anchor="middle" dominant-baseline="central">font augmenter</text></g>
<g class="c-coral"><text class="th" x="585" y="30" text-anchor="middle" dominant-baseline="central">font diminuer</text></g>

<g class="c-green"><rect x="20" y="48" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="70" text-anchor="middle" dominant-baseline="central">naissances</text></g>
<g class="c-green"><rect x="20" y="108" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="122" text-anchor="middle" dominant-baseline="central">arrivées</text>
<text class="ts" x="95" y="140" text-anchor="middle" dominant-baseline="central">individus qui immigrent</text></g>
<line x1="172" y1="72" x2="236" y2="88" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="172" y1="128" x2="236" y2="112" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-gray"><rect x="240" y="60" width="200" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="82" text-anchor="middle" dominant-baseline="central">Population</text>
<text class="ts" x="340" y="102" text-anchor="middle" dominant-baseline="central">une espèce, un milieu</text>
<text class="ts" x="340" y="120" text-anchor="middle" dominant-baseline="central">effectif = nombre d'individus</text></g>

<line x1="444" y1="88" x2="508" y2="72" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="444" y1="112" x2="508" y2="128" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="510" y="48" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="585" y="70" text-anchor="middle" dominant-baseline="central">décès</text></g>
<g class="c-coral"><rect x="510" y="108" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="585" y="122" text-anchor="middle" dominant-baseline="central">départs</text>
<text class="ts" x="585" y="140" text-anchor="middle" dominant-baseline="central">individus qui émigrent</text></g>

<text class="t" x="340" y="178" text-anchor="middle" dominant-baseline="central">naissances + arrivées  &gt;  décès + départs  →  la population augmente</text>
<text class="ts" x="340" y="198" text-anchor="middle" dominant-baseline="central">dans le cas contraire, elle diminue ; si les deux s'équilibrent, elle reste stable</text>

<g class="c-amber"><text class="th" x="340" y="236" text-anchor="middle" dominant-baseline="central">Facteurs du milieu qui agissent sur les naissances, les décès et les départs</text></g>
<g class="c-amber"><rect x="20" y="256" width="120" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="80" y="273" text-anchor="middle" dominant-baseline="central">nourriture</text>
<text class="ts" x="80" y="291" text-anchor="middle" dominant-baseline="central">abondante ou rare</text></g>
<g class="c-amber"><rect x="150" y="256" width="120" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="210" y="273" text-anchor="middle" dominant-baseline="central">prédateurs</text>
<text class="ts" x="210" y="291" text-anchor="middle" dominant-baseline="central">nombreux ou non</text></g>
<g class="c-amber"><rect x="280" y="256" width="120" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="273" text-anchor="middle" dominant-baseline="central">maladies</text>
<text class="ts" x="340" y="291" text-anchor="middle" dominant-baseline="central">parasites</text></g>
<g class="c-amber"><rect x="410" y="256" width="120" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="470" y="273" text-anchor="middle" dominant-baseline="central">température</text>
<text class="ts" x="470" y="291" text-anchor="middle" dominant-baseline="central">climat, sécheresse</text></g>
<g class="c-amber"><rect x="540" y="256" width="120" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="600" y="273" text-anchor="middle" dominant-baseline="central">compétition</text>
<text class="ts" x="600" y="291" text-anchor="middle" dominant-baseline="central">pour l'espace</text></g>
</svg>
