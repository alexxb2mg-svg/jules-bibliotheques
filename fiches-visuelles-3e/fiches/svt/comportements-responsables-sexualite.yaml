blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: responsable, titre: "Sexualité responsable", sous_titre: "des choix libres et éclairés", principal: true}
      - {id: respect, titre: "Respect de l'autre", sous_titre: "consentement libre, à chaque fois"}
      - {id: contraception, titre: "Contraception", sous_titre: "éviter une grossesse non désirée"}
      - {id: ist, titre: "Prévention des IST", sous_titre: "préservatif, dépistage, vaccins"}
      - {id: procreation, titre: "Choix de la procréation", sous_titre: "avoir un enfant, et quand"}
    liens:
      - {de: responsable, vers: respect}
      - {de: responsable, vers: contraception}
      - {de: responsable, vers: ist}
      - {de: responsable, vers: procreation}
    jules: "Le **consentement** passe avant tout : chacun peut dire non, à tout moment, même en cours de route. Sans accord clair et libre, il n'y a pas de consentement."

  - id: schema-methodes
    type: schema
    titre: "Où agit chaque méthode sur le chemin vers une grossesse"
    svg: "comportements-responsables-sexualite.svg"
    jules: "Une grossesse suppose trois étapes : **ovulation**, **rencontre des gamètes** (fécondation dans la trompe), **nidation** de l'embryon dans l'utérus. Chaque méthode contraceptive bloque l'une d'elles."

  - id: schema-protection
    type: schema
    titre: "Grossesse et IST : qui protège de quoi ?"
    svg: "comportements-responsables-sexualite-protection.svg"
    jules: "Un seul moyen coche les deux cases : le **préservatif**, masculin ou féminin. Pilule, implant ou stérilet évitent une grossesse mais **ne protègent pas** des IST."

  - id: methode
    type: methode
    etapes:
      - "Vérifier le **consentement** de chacun : un accord libre, clair, qui peut être retiré à tout moment."
      - "Choisir une **contraception** adaptée, avec l'aide d'un médecin, d'une sage-femme ou d'un centre de santé sexuelle."
      - "Se protéger des **IST** avec le préservatif, tant que les deux partenaires n'ont pas fait de dépistage."
      - "En cas d'oubli ou d'accident de préservatif : **contraception d'urgence** le plus tôt possible, disponible en pharmacie sans ordonnance."
      - "Se faire **dépister** après une prise de risque, même sans aucun symptôme."
    jules: "Contre certaines IST, il existe aussi des **vaccins** : contre les papillomavirus (proposé entre 11 et 14 ans, filles et garçons) et contre l'hépatite B."

  - id: piege
    type: piege
    mauvaise_idee: "Avec la pilule, on est aussi protégé des infections sexuellement transmissibles."
    pourquoi_faux: "La pilule empêche l'**ovulation**, donc la grossesse. Elle n'empêche pas le contact entre les muqueuses et les liquides sexuels, par où passent les **microbes** des IST."
    bonne_idee: "Seul le **préservatif** protège à la fois d'une grossesse non désirée et des IST. Contraception et prévention des IST sont **deux enjeux différents**."
    jules: "Autre idée fausse : « elle n'a aucun symptôme, donc pas d'IST ». Beaucoup d'IST, comme la **chlamydiose**, passent inaperçues : seul un **dépistage** permet de le savoir."

  - id: exemple-double
    type: exemple
    situation: "Un couple récent utilise la pilule. Aucun des deux n'a fait de dépistage des IST."
    calcul: "La pilule évite la **grossesse** mais pas les **IST** ; le préservatif empêche le contact direct entre muqueuses et liquides."
    conclusion: "Le couple associe **pilule et préservatif** (la « double protection »), puis peut arrêter le préservatif quand les deux dépistages sont négatifs et qu'ils se sont engagés à être fidèles."
    jules: "Le dépistage se fait par une simple prise de sang ou un prélèvement, dans un centre de dépistage **gratuit** ou chez un médecin, de façon confidentielle."

  - id: exemple-ist
    type: exemple
    situation: "Une IST comme la chlamydiose ne donne souvent aucun symptôme pendant des mois."
    calcul: "Sans dépistage, elle n'est pas soignée : elle peut se transmettre à d'autres partenaires et abîmer les **trompes**."
    conclusion: "Une IST non traitée peut rendre **stérile** : la prévention et le dépistage protègent aussi la **fertilité** future."
    jules: "La chlamydiose est due à une **bactérie** : elle se soigne avec un antibiotique. Le **VIH**, lui, est un virus : les traitements le contrôlent sans le faire disparaître."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Les quatre piliers : **consentement**, **contraception**, **préservatif** contre les IST, **dépistage**. Pour une question, ton infirmière scolaire est là, en toute confidentialité."
