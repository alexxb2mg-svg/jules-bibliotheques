<text class="ts" x="76" y="128" text-anchor="start" dominant-baseline="central">70 → 150 battements</text></g>
<g class="c-blue"><text class="ts" x="317.0" y="230.4" text-anchor="start" dominant-baseline="central">fréquence respiratoire : 15 → 40 mouvements</text></g>
<text class="ts" x="20" y="362" text-anchor="start" dominant-baseline="central">Valeurs typiques d'un collégien, elles varient d'une personne à l'autre.</text>
<text class="ts" x="20" y="380" text-anchor="start" dominant-baseline="central">Les deux fréquences montent pendant l'effort, puis redescendent lentement.</text>
