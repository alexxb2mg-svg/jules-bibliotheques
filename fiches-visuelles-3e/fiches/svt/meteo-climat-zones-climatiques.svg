<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M313.8 361.7 L186.2 361.7 A160 160 0 0 0 250.0 375.0 A160 160 0 0 0 313.8 361.7 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<path d="M186.2 361.7 L313.8 361.7 A160 160 0 0 0 396.7 278.8 L103.3 278.8 A160 160 0 0 0 186.2 361.7 Z" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<path d="M103.3 278.8 L396.7 278.8 A160 160 0 0 0 396.7 151.2 L103.3 151.2 A160 160 0 0 0 103.3 278.8 Z" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<path d="M103.3 151.2 L396.7 151.2 A160 160 0 0 0 313.8 68.3 L186.2 68.3 A160 160 0 0 0 103.3 151.2 Z" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<path d="M186.2 68.3 L313.8 68.3 A160 160 0 0 0 250.0 55.0 A160 160 0 0 0 186.2 68.3 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<line x1="90.0" y1="215" x2="410.0" y2="215" stroke="#993C1D" stroke-width="0.8" stroke-dasharray="4 3"/>
<g class="c-blue"><text class="th" x="310" y="36" text-anchor="middle" dominant-baseline="central">zone polaire</text></g>
<g class="c-green"><text class="th" x="295" y="102" text-anchor="middle" dominant-baseline="central">zone tempérée</text></g>
<g class="c-coral"><text class="th" x="295" y="187" text-anchor="middle" dominant-baseline="central">zone chaude</text></g>
<g class="c-coral"><text class="ts" x="295" y="243" text-anchor="middle" dominant-baseline="central">(intertropicale)</text></g>
<g class="c-green"><text class="th" x="295" y="328" text-anchor="middle" dominant-baseline="central">zone tempérée</text></g>
<g class="c-blue"><text class="th" x="310" y="394" text-anchor="middle" dominant-baseline="central">zone polaire</text></g>
<line x1="296" y1="46" x2="266" y2="60" class="leader"/>
<line x1="296" y1="384" x2="266" y2="370" class="leader"/>
<text class="ts" x="320" y="68" text-anchor="start" dominant-baseline="central">66,5° N</text>
<text class="ts" x="403" y="151" text-anchor="start" dominant-baseline="central">23,5° N</text>
<text class="ts" x="416" y="215" text-anchor="start" dominant-baseline="central">équateur 0°</text>
<text class="ts" x="403" y="279" text-anchor="start" dominant-baseline="central">23,5° S</text>
<text class="ts" x="320" y="362" text-anchor="start" dominant-baseline="central">66,5° S</text>
<line x1="20" y1="199" x2="87.8" y2="199" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="20" y1="231" x2="87.8" y2="231" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M90.8 199.0 A160 160 0 0 0 90.8 231.0" fill="none" stroke="#993C1D" stroke-width="5"/>
<line x1="20" y1="65" x2="191.3" y2="65" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="20" y1="95" x2="141.2" y2="95" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M194.3 65.0 A160 160 0 0 0 144.2 95.0" fill="none" stroke="#185FA5" stroke-width="5"/>
<text class="ts" x="20" y="22" text-anchor="start" dominant-baseline="central">rayons du Soleil (même faisceau)</text>
<text class="ts" x="20" y="249" text-anchor="start" dominant-baseline="central">même faisceau</text>
<g class="c-blue"><rect x="470" y="40" width="190" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="60" text-anchor="middle" dominant-baseline="central">Près des pôles</text>
<text class="ts" x="565" y="82" text-anchor="middle" dominant-baseline="central">rayons rasants : l'énergie</text>
<text class="ts" x="565" y="98" text-anchor="middle" dominant-baseline="central">est étalée sur une grande</text>
<text class="ts" x="565" y="114" text-anchor="middle" dominant-baseline="central">surface</text>
<text class="th" x="565" y="138" text-anchor="middle" dominant-baseline="central">il fait froid</text></g>
<g class="c-coral"><rect x="470" y="270" width="190" height="120" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="290" text-anchor="middle" dominant-baseline="central">Près de l'équateur</text>
<text class="ts" x="565" y="312" text-anchor="middle" dominant-baseline="central">rayons presque verticaux :</text>
<text class="ts" x="565" y="328" text-anchor="middle" dominant-baseline="central">l'énergie est concentrée</text>
<text class="ts" x="565" y="344" text-anchor="middle" dominant-baseline="central">sur une petite surface</text>
<text class="th" x="565" y="368" text-anchor="middle" dominant-baseline="central">il fait chaud</text></g>
<text class="ts" x="20" y="420" text-anchor="start" dominant-baseline="central">Pas à l'échelle. Vents, courants océaniques, relief et océan nuancent ensuite ces grandes zones.</text>
</svg>