<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La Terre éclairée par le Soleil : l'énergie reçue est concentrée à l'équateur et étalée aux pôles, d'où les zones chaude, tempérées et polaires">
