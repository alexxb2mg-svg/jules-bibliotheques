<svg width="100%" viewBox="0 0 680 366" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tableau : quels moyens évitent une grossesse et lesquels protègent des IST">
<text class="th" x="370" y="22" text-anchor="middle" dominant-baseline="central">évite une grossesse ?</text>
<text class="th" x="560" y="22" text-anchor="middle" dominant-baseline="central">protège des IST ?</text>
<g class="c-gray"><rect x="20" y="44" width="250" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="32" y="56" dominant-baseline="central">préservatif</text>
<text class="ts" x="32" y="72" dominant-baseline="central">masculin ou féminin</text></g>
<g class="c-green"><rect x="290" y="44" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="370" y="63" text-anchor="middle" dominant-baseline="central">oui</text></g>
<g class="c-green"><rect x="480" y="44" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="560" y="63" text-anchor="middle" dominant-baseline="central">oui</text></g>
<g class="c-gray"><rect x="20" y="90" width="250" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="32" y="102" dominant-baseline="central">pilule</text>
<text class="ts" x="32" y="118" dominant-baseline="central">hormones, chaque jour</text></g>
<g class="c-green"><rect x="290" y="90" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="370" y="109" text-anchor="middle" dominant-baseline="central">oui</text></g>
<g class="c-red"><rect x="480" y="90" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="560" y="109" text-anchor="middle" dominant-baseline="central">non</text></g>
<g class="c-gray"><rect x="20" y="136" width="250" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="32" y="148" dominant-baseline="central">implant</text>
<text class="ts" x="32" y="164" dominant-baseline="central">sous la peau du bras</text></g>
<g class="c-green"><rect x="290" y="136" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="370" y="155" text-anchor="middle" dominant-baseline="central">oui</text></g>
<g class="c-red"><rect x="480" y="136" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="560" y="155" text-anchor="middle" dominant-baseline="central">non</text></g>
<g class="c-gray"><rect x="20" y="182" width="250" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="32" y="194" dominant-baseline="central">stérilet</text>
<text class="ts" x="32" y="210" dominant-baseline="central">placé dans l'utérus</text></g>
<g class="c-green"><rect x="290" y="182" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="370" y="201" text-anchor="middle" dominant-baseline="central">oui</text></g>
<g class="c-red"><rect x="480" y="182" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="560" y="201" text-anchor="middle" dominant-baseline="central">non</text></g>
<g class="c-gray"><rect x="20" y="228" width="250" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="32" y="240" dominant-baseline="central">pilule d'urgence</text>
<text class="ts" x="32" y="256" dominant-baseline="central">après un rapport à risque</text></g>
<g class="c-green"><rect x="290" y="228" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="370" y="247" text-anchor="middle" dominant-baseline="central">en secours</text></g>
<g class="c-red"><rect x="480" y="228" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="560" y="247" text-anchor="middle" dominant-baseline="central">non</text></g>
<g class="c-gray"><rect x="20" y="274" width="250" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="32" y="286" dominant-baseline="central">vaccins</text>
<text class="ts" x="32" y="302" dominant-baseline="central">papillomavirus, hépatite B</text></g>
<g class="c-red"><rect x="290" y="274" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="370" y="293" text-anchor="middle" dominant-baseline="central">non</text></g>
<g class="c-green"><rect x="480" y="274" width="160" height="38" rx="6" stroke-width="0.5"/>
<text class="th" x="560" y="293" text-anchor="middle" dominant-baseline="central">certaines IST</text></g>
<text class="ts" x="20" y="334" dominant-baseline="central">IST : infections sexuellement transmissibles (VIH, chlamydiose, papillomavirus, syphilis...).</text>
<text class="ts" x="20" y="352" dominant-baseline="central">Après une prise de risque : dépistage, même sans symptôme.</text>
</svg>
