<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Les mesures face au risque : l'atténuation agit sur l'aléa ; la prévision, la prévention, la protection et l'adaptation réduisent la vulnérabilité">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="20" y="20" width="240" height="138" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="44" text-anchor="middle" dominant-baseline="central">Atténuation</text>
<text class="ts" x="140" y="68" text-anchor="middle" dominant-baseline="central">agir sur la cause du phénomène :</text>
<text class="ts" x="140" y="86" text-anchor="middle" dominant-baseline="central">émettre moins de gaz à effet</text>
<text class="ts" x="140" y="104" text-anchor="middle" dominant-baseline="central">de serre (risques liés au climat)</text>
<text class="ts" x="140" y="128" text-anchor="middle" dominant-baseline="central">impossible pour un séisme</text></g>

<g class="c-gray"><rect x="290" y="20" width="180" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="380" y="36" text-anchor="middle" dominant-baseline="central">Prévision</text>
<text class="ts" x="380" y="56" text-anchor="middle" dominant-baseline="central">surveiller le phénomène</text>
<text class="ts" x="380" y="72" text-anchor="middle" dominant-baseline="central">et alerter la population</text></g>
<g class="c-gray"><rect x="480" y="20" width="180" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="570" y="36" text-anchor="middle" dominant-baseline="central">Prévention</text>
<text class="ts" x="570" y="56" text-anchor="middle" dominant-baseline="central">ne pas construire en zone</text>
<text class="ts" x="570" y="72" text-anchor="middle" dominant-baseline="central">à risque, informer</text></g>
<g class="c-gray"><rect x="290" y="92" width="180" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="380" y="108" text-anchor="middle" dominant-baseline="central">Protection</text>
<text class="ts" x="380" y="128" text-anchor="middle" dominant-baseline="central">digues, bâtiments</text>
<text class="ts" x="380" y="144" text-anchor="middle" dominant-baseline="central">parasismiques</text></g>
<g class="c-gray"><rect x="480" y="92" width="180" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="570" y="108" text-anchor="middle" dominant-baseline="central">Adaptation</text>
<text class="ts" x="570" y="128" text-anchor="middle" dominant-baseline="central">vivre avec : maisons</text>
<text class="ts" x="570" y="144" text-anchor="middle" dominant-baseline="central">surélevées, autres cultures</text></g>

<line x1="140" y1="160" x2="140" y2="198" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="150" y="179" text-anchor="start" dominant-baseline="central">réduit</text>
<line x1="475" y1="160" x2="475" y2="198" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="485" y="179" text-anchor="start" dominant-baseline="central">réduisent</text>

<g class="c-coral"><rect x="20" y="202" width="240" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="140" y="222" text-anchor="middle" dominant-baseline="central">Aléa</text>
<text class="ts" x="140" y="244" text-anchor="middle" dominant-baseline="central">le phénomène : séisme, crue, cyclone</text></g>
<g class="c-blue"><rect x="290" y="202" width="370" height="62" rx="8" stroke-width="0.5"/>
<text class="th" x="475" y="222" text-anchor="middle" dominant-baseline="central">Vulnérabilité</text>
<text class="ts" x="475" y="244" text-anchor="middle" dominant-baseline="central">personnes et biens exposés, et leur fragilité</text></g>

<line x1="160" y1="266" x2="300" y2="308" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="266" x2="380" y2="308" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="220" y="312" width="240" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="331" text-anchor="middle" dominant-baseline="central">Risque</text>
<text class="ts" x="340" y="350" text-anchor="middle" dominant-baseline="central">aléa et vulnérabilité réunis</text></g>
<text class="ts" x="660" y="388" text-anchor="end" dominant-baseline="central">Aucune mesure n'annule le risque : elles le réduisent.</text>
</svg>
