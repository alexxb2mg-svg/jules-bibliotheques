<svg width="100%" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clonage de la brebis Dolly : noyau d'une cellule de la brebis A placé dans un ovule sans noyau de la brebis B, embryon porté par la brebis C">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-blue"><rect x="20" y="20" width="200" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="120" y="40" text-anchor="middle" dominant-baseline="central">Brebis A (face blanche)</text>
<text class="ts" x="120" y="60" text-anchor="middle" dominant-baseline="central">cellule de mamelle :</text>
<text class="ts" x="120" y="78" text-anchor="middle" dominant-baseline="central">on prélève son noyau (ADN)</text></g>
<g class="c-gray"><rect x="460" y="20" width="200" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="40" text-anchor="middle" dominant-baseline="central">Brebis B (face noire)</text>
<text class="ts" x="560" y="60" text-anchor="middle" dominant-baseline="central">un de ses ovules :</text>
<text class="ts" x="560" y="78" text-anchor="middle" dominant-baseline="central">on lui retire son noyau</text></g>

<line x1="140" y1="98" x2="236" y2="146" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="ts" x="150" y="130" text-anchor="end" dominant-baseline="central">noyau de A</text></g>
<line x1="540" y1="98" x2="444" y2="146" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="530" y="130" text-anchor="start" dominant-baseline="central">ovule sans noyau</text>

<g class="c-blue"><rect x="240" y="120" width="200" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="140" text-anchor="middle" dominant-baseline="central">Cellule reconstituée</text>
<text class="ts" x="340" y="160" text-anchor="middle" dominant-baseline="central">noyau de A dans l'ovule</text>
<text class="ts" x="340" y="176" text-anchor="middle" dominant-baseline="central">de B : elle devient un embryon</text></g>

<line x1="340" y1="194" x2="340" y2="222" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="240" y="226" width="200" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="246" text-anchor="middle" dominant-baseline="central">Brebis C, mère porteuse</text>
<text class="ts" x="340" y="266" text-anchor="middle" dominant-baseline="central">l'embryon se développe</text>
<text class="ts" x="340" y="282" text-anchor="middle" dominant-baseline="central">dans son utérus</text></g>

<line x1="442" y1="262" x2="470" y2="262" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="474" y="226" width="186" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="567" y="246" text-anchor="middle" dominant-baseline="central">Dolly, née en 1996</text>
<text class="ts" x="567" y="266" text-anchor="middle" dominant-baseline="central">même noyau (ADN) que A :</text>
<text class="ts" x="567" y="282" text-anchor="middle" dominant-baseline="central">un clone (face blanche)</text></g>

<g class="c-blue"><text class="ts" x="20" y="240" text-anchor="start" dominant-baseline="central">bleu : le patrimoine</text>
<text class="ts" x="20" y="256" text-anchor="start" dominant-baseline="central">génétique de la brebis A</text></g>
<text class="ts" x="20" y="322" text-anchor="start" dominant-baseline="central">Aucun spermatozoïde, aucune fécondation : Dolly n'a qu'un « parent » génétique. Pas à l'échelle.</text>
</svg>
