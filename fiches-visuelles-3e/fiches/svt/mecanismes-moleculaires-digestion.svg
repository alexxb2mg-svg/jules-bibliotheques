<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Les enzymes découpent les grosses molécules en nutriments qui passent dans le sang">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="20" y="20" dominant-baseline="central">1. L'enzyme reconnaît une molécule précise et la découpe</text>
<text class="ts" x="660" y="42" text-anchor="end" dominant-baseline="central">pas à l'échelle</text>
<line x1="40" y1="80" x2="150" y2="80" stroke="#854F0B" stroke-width="2"/>
<g class="c-amber"><circle cx="40" cy="80" r="10" stroke-width="1"/><circle cx="62" cy="80" r="10" stroke-width="1"/><circle cx="84" cy="80" r="10" stroke-width="1"/><circle cx="106" cy="80" r="10" stroke-width="1"/><circle cx="128" cy="80" r="10" stroke-width="1"/><circle cx="150" cy="80" r="10" stroke-width="1"/>
<text class="ts" x="95" y="112" text-anchor="middle" dominant-baseline="central">amidon : longue chaîne</text>
<text class="ts" x="95" y="128" text-anchor="middle" dominant-baseline="central">de glucose</text></g>
<line x1="170" y1="80" x2="214" y2="80" class="arr" marker-end="url(#arrow)"/>
<line x1="250" y1="62" x2="272" y2="62" stroke="#854F0B" stroke-width="2"/>
<g class="c-amber"><circle cx="250" cy="62" r="10" stroke-width="1"/><circle cx="272" cy="62" r="10" stroke-width="1"/></g>
<path d="M226 74 H242 L250 82 H272 L280 74 H300 V104 H226 Z" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<line x1="261" y1="48" x2="261" y2="76" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="3 2"/>
<g class="c-blue"><text class="th" x="263" y="93" text-anchor="middle" dominant-baseline="central">amylase</text>
<text class="ts" x="263" y="120" text-anchor="middle" dominant-baseline="central">l'enzyme coupe</text>
<text class="ts" x="263" y="136" text-anchor="middle" dominant-baseline="central">puis ressort intacte</text></g>
<line x1="318" y1="80" x2="362" y2="80" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><circle cx="390" cy="80" r="10" stroke-width="1"/><circle cx="425" cy="72" r="10" stroke-width="1"/><circle cx="455" cy="88" r="10" stroke-width="1"/><circle cx="488" cy="74" r="10" stroke-width="1"/><circle cx="520" cy="86" r="10" stroke-width="1"/><circle cx="552" cy="76" r="10" stroke-width="1"/>
<text class="ts" x="471" y="112" text-anchor="middle" dominant-baseline="central">petits sucres, puis glucose :</text>
<text class="ts" x="471" y="128" text-anchor="middle" dominant-baseline="central">molécules séparées</text></g>

<text class="th" x="20" y="166" dominant-baseline="central">2. Une enzyme par type de molécule</text>
<g class="c-amber"><rect x="20" y="182" width="180" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="204" text-anchor="middle" dominant-baseline="central">amidon</text></g>
<line x1="206" y1="204" x2="244" y2="204" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="250" y="182" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="350" y="196" text-anchor="middle" dominant-baseline="central">amylase</text>
<text class="ts" x="350" y="214" text-anchor="middle" dominant-baseline="central">salive, pancréas</text></g>
<line x1="456" y1="204" x2="494" y2="204" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="500" y="182" width="160" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="196" text-anchor="middle" dominant-baseline="central">glucose</text>
<text class="ts" x="580" y="214" text-anchor="middle" dominant-baseline="central">dernière étape : intestin</text></g>

<g class="c-amber"><rect x="20" y="236" width="180" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="258" text-anchor="middle" dominant-baseline="central">protéines</text></g>
<line x1="206" y1="258" x2="244" y2="258" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="250" y="236" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="350" y="250" text-anchor="middle" dominant-baseline="central">protéases</text>
<text class="ts" x="350" y="268" text-anchor="middle" dominant-baseline="central">estomac, pancréas, intestin</text></g>
<line x1="456" y1="258" x2="494" y2="258" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="500" y="236" width="160" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="258" text-anchor="middle" dominant-baseline="central">acides aminés</text></g>

<g class="c-amber"><rect x="20" y="290" width="180" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="304" text-anchor="middle" dominant-baseline="central">lipides</text>
<text class="ts" x="110" y="322" text-anchor="middle" dominant-baseline="central">les graisses</text></g>
<line x1="206" y1="312" x2="244" y2="312" class="arr" marker-end="url(#arrow)"/>
<g class="c-blue"><rect x="250" y="290" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="350" y="304" text-anchor="middle" dominant-baseline="central">lipase</text>
<text class="ts" x="350" y="322" text-anchor="middle" dominant-baseline="central">surtout du pancréas</text></g>
<line x1="456" y1="312" x2="494" y2="312" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="500" y="290" width="160" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="304" text-anchor="middle" dominant-baseline="central">acides gras</text>
<text class="ts" x="580" y="322" text-anchor="middle" dominant-baseline="central">et glycérol</text></g>

<text class="th" x="20" y="366" dominant-baseline="central">3. Seules les petites molécules traversent la paroi de l'intestin grêle</text>
<text class="ts" x="20" y="394" dominant-baseline="central">cavité de l'intestin</text>
<g class="c-gray"><rect x="300" y="382" width="18" height="70" stroke-width="0.5"/>
<text class="ts" x="309" y="464" text-anchor="middle" dominant-baseline="central">paroi</text></g>
<g class="c-green"><circle cx="160" cy="412" r="8" stroke-width="1"/><circle cx="182" cy="412" r="8" stroke-width="1"/>
<text class="ts" x="20" y="412" dominant-baseline="central">nutriments</text></g>
<line x1="196" y1="412" x2="424" y2="412" class="arr" marker-end="url(#arrow)"/>
<line x1="120" y1="440" x2="208" y2="440" stroke="#854F0B" stroke-width="2"/>
<g class="c-amber"><circle cx="120" cy="440" r="8" stroke-width="1"/><circle cx="142" cy="440" r="8" stroke-width="1"/><circle cx="164" cy="440" r="8" stroke-width="1"/><circle cx="186" cy="440" r="8" stroke-width="1"/><circle cx="208" cy="440" r="8" stroke-width="1"/>
<text class="ts" x="20" y="440" dominant-baseline="central">amidon</text></g>
<line x1="222" y1="440" x2="292" y2="440" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><text class="ts" x="226" y="455" dominant-baseline="central">bloqué</text></g>
<g class="c-gray"><rect x="432" y="386" width="140" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="502" y="404" text-anchor="middle" dominant-baseline="central">sang</text>
<text class="ts" x="502" y="422" text-anchor="middle" dominant-baseline="central">vers les cellules</text></g>
</svg>
