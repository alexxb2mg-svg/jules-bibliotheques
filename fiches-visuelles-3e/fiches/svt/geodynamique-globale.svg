<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coupe simplifiée de la lithosphère : une dorsale où les plaques s'écartent et une zone de subduction où une plaque plonge sous un continent">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="182" y="24" text-anchor="middle" dominant-baseline="central">Dorsale</text>
<text class="ts" x="182" y="42" text-anchor="middle" dominant-baseline="central">les plaques s'écartent,</text>
<text class="ts" x="182" y="58" text-anchor="middle" dominant-baseline="central">le magma remonte</text>
<line x1="182" y1="68" x2="182" y2="134" class="leader"/>

<text class="th" x="400" y="24" text-anchor="middle" dominant-baseline="central">Subduction</text>
<text class="ts" x="400" y="42" text-anchor="middle" dominant-baseline="central">une plaque plonge</text>
<text class="ts" x="400" y="58" text-anchor="middle" dominant-baseline="central">sous l'autre</text>
<line x1="410" y1="68" x2="438" y2="152" class="leader"/>

<text class="th" x="590" y="24" text-anchor="middle" dominant-baseline="central">Volcan</text>
<text class="ts" x="590" y="42" text-anchor="middle" dominant-baseline="central">le magma formé en</text>
<text class="ts" x="590" y="58" text-anchor="middle" dominant-baseline="central">profondeur remonte</text>
<line x1="578" y1="68" x2="566" y2="96" class="leader"/>

<text class="ts" x="310" y="148" text-anchor="middle" dominant-baseline="central">fond de l'océan</text>

<g class="c-coral"><rect x="20" y="200" width="640" height="180" rx="4" stroke-width="0.5"/>
<text class="th" x="250" y="300" text-anchor="middle" dominant-baseline="central">asthénosphère</text>
<text class="ts" x="250" y="320" text-anchor="middle" dominant-baseline="central">manteau très chaud, solide mais</text>
<text class="ts" x="250" y="336" text-anchor="middle" dominant-baseline="central">qui se déforme lentement</text></g>

<polygon points="20,160 178,160 178,200 20,200" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="186,160 440,160 590,350 562,376 420,200 186,200" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<polygon points="440,160 470,128 660,128 660,215 483,215" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1"/>

<polygon points="176,200 188,200 186,160 178,160" fill="#F0997B" stroke="#993C1D" stroke-width="1"/>
<path d="M560 304 L560 128" fill="none" stroke="#D85A30" stroke-width="3" stroke-dasharray="6 4"/>
<polygon points="532,128 560,96 588,128" fill="#F0997B" stroke="#993C1D" stroke-width="1"/>

<line x1="160" y1="190" x2="70" y2="190" class="arr" marker-end="url(#arrow)"/>
<line x1="206" y1="180" x2="330" y2="180" class="arr" marker-end="url(#arrow)"/>
<line x1="652" y1="150" x2="610" y2="150" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="268" y="216" text-anchor="middle" dominant-baseline="central">quelques cm par an</text>

<text class="th" x="610" y="190" text-anchor="middle" dominant-baseline="central">continent</text>
<text class="ts" x="100" y="170" text-anchor="middle" dominant-baseline="central">plaque A</text>
<text class="ts" x="380" y="180" text-anchor="middle" dominant-baseline="central">plaque B</text>

<path d="M182 140 l5 7 l-5 7 l-5 -7 z" fill="#A32D2D"/>
<path d="M455 170 l5 7 l-5 7 l-5 -7 z" fill="#A32D2D"/>
<path d="M490 214 l5 7 l-5 7 l-5 -7 z" fill="#A32D2D"/>
<path d="M525 258 l5 7 l-5 7 l-5 -7 z" fill="#A32D2D"/>
<path d="M560 302 l5 7 l-5 7 l-5 -7 z" fill="#A32D2D"/>

<rect x="20" y="400" width="22" height="14" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="50" y="407" text-anchor="start" dominant-baseline="central">lithosphère : rigide, en plaques</text>
<rect x="250" y="400" width="22" height="14" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="ts" x="280" y="407" text-anchor="start" dominant-baseline="central">matière chaude : asthénosphère, magma</text>
<path d="M530 400 l5 7 l-5 7 l-5 -7 z" fill="#A32D2D"/>
<text class="ts" x="544" y="407" text-anchor="start" dominant-baseline="central">foyer de séisme</text>
<text class="ts" x="20" y="444" text-anchor="start" dominant-baseline="central">Troisième limite possible : la collision de deux continents fait naître une chaîne de montagnes.</text>
<text class="ts" x="660" y="462" text-anchor="end" dominant-baseline="central">Coupe simplifiée, pas à l'échelle</text>
</svg>
