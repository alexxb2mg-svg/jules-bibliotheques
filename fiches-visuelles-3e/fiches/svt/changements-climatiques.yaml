generation: {par: "projet-jules", le: "2026-09-26", paquet: "fiche-visuelle/54903c0860"}
abreviations: {ppm: "partie par million : ici, nombre de molécules de CO₂ pour un million de molécules d'air"}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: climat, titre: "Le climat change", sous_titre: "hier et aujourd'hui", principal: true}
      - {id: passe, titre: "Changements passés", sous_titre: "causes naturelles, très lents"}
      - {id: actuel, titre: "Changement actuel", sous_titre: "gaz à effet de serre humains"}
      - {id: vivants, titre: "Êtres vivants", sous_titre: "se déplacent ou déclinent"}
    liens:
      - {de: climat, vers: passe, libelle: "temps géologiques"}
      - {de: climat, vers: actuel, libelle: "depuis 1850 environ"}
      - {de: actuel, vers: vivants, libelle: "conséquences"}
    jules: "Il y a environ **20 000 ans**, au plus fort de la dernière glaciation, le niveau des mers était environ 120 m plus bas et de grands glaciers couvraient le nord de l'Europe. Le climat a donc **toujours varié**, mais lentement."

  - id: schema-serre
    type: schema
    titre: "L'effet de serre, naturel puis renforcé"
    svg: "changements-climatiques.svg"
    jules: "Sans effet de serre naturel, la température moyenne de la Terre serait d'environ **−18 °C** au lieu de 15 °C : il est **indispensable à la vie**. Le problème, c'est son renforcement par nos émissions."

  - id: schema-vitesse
    type: schema
    titre: "Un réchauffement beaucoup plus rapide que dans le passé"
    svg: "changements-climatiques-vitesse.svg"
    jules: "Ce qui inquiète les scientifiques du GIEC, c'est surtout la **vitesse** du changement actuel : les écosystèmes ont eu des milliers d'années pour s'adapter aux changements passés, quelques décennies seulement aujourd'hui."

  - id: methode
    type: methode
    etapes:
      - "Situer le changement dans le temps : **temps géologiques** (milliers à millions d'années) ou période **actuelle** (depuis l'ère industrielle, vers 1850)."
      - "Chercher la cause : **naturelle** (orbite de la Terre autour du Soleil, volcanisme intense) ou **humaine** (combustion du charbon, du pétrole et du gaz, déforestation)."
      - "Relier cause et effet : plus de **gaz à effet de serre** (surtout le CO₂) → effet de serre renforcé → hausse de la température moyenne."
      - "Décrire les conséquences sur les êtres vivants : **déplacement** vers le nord ou en altitude, recul ou disparition locale des espèces qui ne suivent pas."
    jules: "Le taux de CO₂ de l'air était d'environ **280 ppm** avant l'ère industrielle ; il dépasse **420 ppm** dans les années 2020, un niveau jamais atteint depuis au moins 800 000 ans d'après les bulles d'air piégées dans les glaces."

  - id: piege
    type: piege
    mauvaise_idee: "L'effet de serre est une **pollution** causée par l'être humain, il faudrait le supprimer."
    pourquoi_faux: "L'**effet de serre naturel** existe depuis toujours et rend la Terre habitable. Ce qui pose problème, c'est son **renforcement** par les gaz à effet de serre que nous ajoutons."
    bonne_idee: "Effet de serre naturel = **indispensable** ; effet de serre renforcé par les activités humaines = cause du **réchauffement actuel**."
    jules: "Autre confusion fréquente : croire que le climat n'avait jamais changé avant nous. Il a beaucoup changé, mais pour des causes **naturelles** et bien plus **lentement**."

  - id: exemple
    type: exemple
    situation: "La chenille processionnaire du pin, un insecte qui ne supporte pas les hivers trop froids, était limitée à la moitié sud de la France dans les années 1970. Elle a progressé vers le nord et atteint aujourd'hui la région parisienne."
    calcul: "Hivers plus doux → la chenille survit plus au nord → son **aire de répartition** remonte vers le nord. En montagne, de nombreuses plantes montent de même en **altitude**."
    conclusion: "Le réchauffement climatique **déplace** les êtres vivants vers des zones plus fraîches ; les espèces qui ne peuvent pas se déplacer assez vite (plantes des sommets, espèces des pôles) **déclinent**."
    jules: "Une espèce qui vit déjà au sommet d'une montagne ne peut plus monter : c'est pour cela que les **espèces de haute montagne** et celles des pôles sont parmi les plus menacées."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Trois idées à retenir : le climat a **toujours varié** ; le réchauffement actuel est dû aux **activités humaines** ; il est **très rapide**."
