blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: puberte, titre: "Puberté", sous_titre: "les appareils reproducteurs deviennent fonctionnels", principal: true}
      - {id: hormones, titre: "Hormones", sous_titre: "messagers chimiques transportés par le sang"}
      - {id: homme, titre: "Chez l'homme", sous_titre: "testicules : spermatozoïdes en continu"}
      - {id: femme, titre: "Chez la femme", sous_titre: "ovaires : un ovule par cycle"}
      - {id: maitrise, titre: "Maîtrise de la reproduction", sous_titre: "contraception, aide à la procréation"}
    liens:
      - {de: puberte, vers: hormones, libelle: "déclenchée par"}
      - {de: hormones, vers: homme}
      - {de: hormones, vers: femme}
      - {de: hormones, vers: maitrise, libelle: "base de"}
    jules: "La puberté commence en général entre **10 et 16 ans**, souvent un peu plus tôt chez les filles. Chacun a son rythme : un décalage de deux ou trois ans avec ses amis est normal."

  - id: schema-hormones
    type: schema
    titre: "La commande hormonale, du cerveau aux organes reproducteurs"
    svg: "appareils-reproducteurs-puberte.svg"
    jules: "Deux étages de commande : le **cerveau** (l'hypophyse, sous le cerveau) envoie des hormones aux **testicules** ou aux **ovaires**, qui produisent à leur tour les gamètes et les hormones sexuelles."

  - id: schema-cycle
    type: schema
    titre: "Le cycle féminin, environ 28 jours"
    svg: "appareils-reproducteurs-puberte-cycle.svg"
    jules: "L'**ovulation** a lieu environ 14 jours **avant** les règles suivantes. Si l'ovule n'est pas fécondé, la muqueuse de l'utérus se détache : ce sont les **règles**, et un nouveau cycle commence."

  - id: graphe
    type: graphe
    gabarit: cycle-menstruel
    curseurs:
      - {id: curseur-jour, nom: jour, min: 1, max: 28, pas: 1, depart: 1}
    lectures:
      - {si: "jour <= 5", texte: "**Règles** : la paroi de l'utérus, qui n'a pas servi, s'élimine avec un peu de sang."}
      - {si: "jour > 5 && jour < 14", texte: "Un **follicule** mûrit dans l'ovaire ; ses hormones, les **œstrogènes**, font épaissir la paroi de l'utérus."}
      - {si: "jour >= 14 && jour <= 16", texte: "**Ovulation** : l'ovaire libère un ovule, vers le 14e jour."}
      - {si: "jour > 16", texte: "La **progestérone** garde la paroi épaisse pour un éventuel embryon ; sans fécondation, les hormones baissent et de nouvelles règles commencent."}
    jules: "jour fait tourner le repère sur la roue d'un cycle moyen de 28 jours. Regarde en même temps l'**ovaire**, la paroi de l'**utérus** et les **hormones**. La durée réelle d'un cycle varie d'une personne à l'autre."

  - id: methode
    type: methode
    etapes:
      - "Nommer l'**organe** qui produit les gamètes : les **testicules** (spermatozoïdes) ou les **ovaires** (ovules)."
      - "Préciser le rythme : production **continue** chez l'homme, **cyclique** chez la femme (environ un ovule par mois)."
      - "Relier chaque hormone sexuelle à son organe : **testostérone** (testicules), œstrogènes et progestérone (ovaires)."
      - "Remonter à la commande : l'**hypophyse**, sous le cerveau, stimule les testicules et les ovaires par ses hormones (FSH et LH)."
      - "Expliquer les transformations de la puberté par l'action des **hormones** transportées par le sang."
    jules: "Le trajet des gamètes : spermatozoïdes des testicules vers les **spermiductes** puis l'urètre ; ovule de l'ovaire vers la **trompe**, où a lieu la fécondation, puis l'utérus."

  - id: piege
    type: piege
    mauvaise_idee: "Comme les ovules, les spermatozoïdes sont produits une fois par mois."
    pourquoi_faux: "Les testicules produisent des spermatozoïdes **en continu**, des millions chaque jour, de la puberté jusqu'à la fin de la vie. Seuls les ovaires fonctionnent par **cycles**."
    bonne_idee: "Homme : production **continue** de spermatozoïdes. Femme : **un ovule par cycle** d'environ 28 jours, de la puberté à la ménopause (vers 50 ans)."
    jules: "Ne confonds pas non plus l'**hormone** et l'**organe** : la testostérone est produite par les testicules, les œstrogènes et la progestérone par les ovaires."

  - id: exemple-puberte
    type: exemple
    situation: "Entre 12 et 14 ans, la voix de Karim mue, des poils apparaissent et sa taille augmente vite."
    calcul: "À la puberté, l'hypophyse stimule les **testicules**, qui se mettent à produire de la **testostérone** et des spermatozoïdes."
    conclusion: "Transportée par le **sang**, la testostérone agit sur tout le corps : cordes vocales, pilosité, muscles. C'est un contrôle **hormonal**."
    jules: "Chez les filles, ce sont les **œstrogènes** produits par les ovaires qui font se développer les seins et apparaître les premières règles."

  - id: exemple-cycle
    type: exemple
    situation: "Les règles de Chloé ont commencé le 1er mars ; ses cycles durent 28 jours."
    calcul: "Ovulation vers le jour 14 : autour du **14 mars**. Règles suivantes : 1er mars + 28 jours, soit le **29 mars**."
    conclusion: "Le cycle relie les deux organes : l'**ovaire** libère un ovule vers le 14e jour, l'**utérus** prépare sa muqueuse ; sans fécondation, les règles reviennent."
    jules: "La durée des cycles varie d'une personne à l'autre et d'un mois à l'autre, surtout au début : la date d'ovulation n'est **jamais sûre**, ce n'est pas une méthode de contraception."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "À retenir : **hypophyse** (le chef d'orchestre), **testicules** et testostérone, **ovaires** avec œstrogènes et progestérone, et le cycle de 28 jours en moyenne."
