<text class="ts" x="115" y="208" text-anchor="middle" dominant-baseline="central">8 claires, 2 foncées</text>
<text class="ts" x="115" y="224" text-anchor="middle" dominant-baseline="central">(la forme foncée vient</text>
<text class="ts" x="115" y="240" text-anchor="middle" dominant-baseline="central">d'une mutation, au hasard)</text>
<text class="ts" x="340" y="208" text-anchor="middle" dominant-baseline="central">suie des usines : troncs noircis</text>
<g class="c-red"><text class="ts" x="340" y="224" text-anchor="middle" dominant-baseline="central">les oiseaux repèrent et mangent</text>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">surtout les claires (croix)</text></g>
<text class="ts" x="565" y="208" text-anchor="middle" dominant-baseline="central">les foncées survivent et se</text>
<text class="ts" x="565" y="224" text-anchor="middle" dominant-baseline="central">reproduisent plus : 7 sur 10</text>
<text class="ts" x="565" y="240" text-anchor="middle" dominant-baseline="central">sont foncées</text>
