<ellipse cx="48" cy="276" rx="7" ry="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="ts" x="62" y="276" text-anchor="start" dominant-baseline="central">phalène claire</text>
<ellipse cx="186" cy="276" rx="7" ry="9" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8"/>
<ellipse cx="198" cy="276" rx="7" ry="9" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="ts" x="212" y="276" text-anchor="start" dominant-baseline="central">phalène foncée</text>
<text class="ts" x="660" y="276" text-anchor="end" dominant-baseline="central">Effectifs simplifiés, pas à l'échelle.</text>
<g class="c-red"><rect x="20" y="300" width="640" height="84" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="322" text-anchor="middle" dominant-baseline="central">Sélection naturelle : un tri passif, sans intention</text>
<text class="ts" x="340" y="344" text-anchor="middle" dominant-baseline="central">Le milieu ne crée pas la couleur foncée : il avantage les phalènes qui l'avaient déjà.</text>
<text class="ts" x="340" y="364" text-anchor="middle" dominant-baseline="central">Mieux camouflées, elles vivent plus longtemps, ont plus de descendants et leur transmettent l'allèle.</text></g>
</svg>
