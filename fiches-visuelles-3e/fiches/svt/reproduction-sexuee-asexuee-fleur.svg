<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cycle d'une plante à fleurs : fleur, pollinisation, fécondation, fruit et graines, dissémination, germination">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-coral"><rect x="20" y="30" width="190" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="115" y="48" text-anchor="middle" dominant-baseline="central">1. La fleur</text>
<text class="ts" x="115" y="67" text-anchor="middle" dominant-baseline="central">étamines : grains de pollen</text>
<text class="ts" x="115" y="83" text-anchor="middle" dominant-baseline="central">pistil : ovaire et ovules</text></g>
<g class="c-coral"><rect x="245" y="30" width="190" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">2. Pollinisation</text>
<text class="ts" x="340" y="67" text-anchor="middle" dominant-baseline="central">le pollen est transporté</text>
<text class="ts" x="340" y="83" text-anchor="middle" dominant-baseline="central">par le vent ou les insectes</text></g>
<g class="c-coral"><rect x="470" y="30" width="190" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="48" text-anchor="middle" dominant-baseline="central">3. Fécondation</text>
<text class="ts" x="565" y="67" text-anchor="middle" dominant-baseline="central">gamète mâle du pollen</text>
<text class="ts" x="565" y="83" text-anchor="middle" dominant-baseline="central">+ gamète femelle de l'ovule</text></g>

<g class="c-green"><rect x="470" y="200" width="190" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="218" text-anchor="middle" dominant-baseline="central">4. Fruit et graines</text>
<text class="ts" x="565" y="237" text-anchor="middle" dominant-baseline="central">l'ovule devient la graine,</text>
<text class="ts" x="565" y="253" text-anchor="middle" dominant-baseline="central">l'ovaire devient le fruit</text></g>
<g class="c-green"><rect x="245" y="200" width="190" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="218" text-anchor="middle" dominant-baseline="central">5. Dissémination</text>
<text class="ts" x="340" y="237" text-anchor="middle" dominant-baseline="central">graines emportées par le</text>
<text class="ts" x="340" y="253" text-anchor="middle" dominant-baseline="central">vent, l'eau ou les animaux</text></g>
<g class="c-green"><rect x="20" y="200" width="190" height="68" rx="8" stroke-width="0.5"/>
<text class="th" x="115" y="218" text-anchor="middle" dominant-baseline="central">6. Germination</text>
<text class="ts" x="115" y="237" text-anchor="middle" dominant-baseline="central">la graine donne</text>
<text class="ts" x="115" y="253" text-anchor="middle" dominant-baseline="central">une nouvelle plante</text></g>

<line x1="212" y1="64" x2="242" y2="64" class="arr" marker-end="url(#arrow)"/>
<line x1="437" y1="64" x2="467" y2="64" class="arr" marker-end="url(#arrow)"/>
<line x1="565" y1="100" x2="565" y2="197" class="arr" marker-end="url(#arrow)"/>
<line x1="468" y1="234" x2="438" y2="234" class="arr" marker-end="url(#arrow)"/>
<line x1="243" y1="234" x2="213" y2="234" class="arr" marker-end="url(#arrow)"/>
<line x1="115" y1="198" x2="115" y2="101" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><text class="ts" x="340" y="130" text-anchor="middle" dominant-baseline="central">rencontre des gamètes</text></g>
<g class="c-green"><text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">dispersion et installation dans un nouveau milieu</text></g>

<text class="ts" x="20" y="296" text-anchor="start" dominant-baseline="central">Le milieu compte : le vent, l'eau et les animaux transportent le pollen et les graines ;</text>
<text class="ts" x="20" y="313" text-anchor="start" dominant-baseline="central">seule une graine tombée dans un lieu favorable (humidité, température douce) germe.</text>
</svg>
