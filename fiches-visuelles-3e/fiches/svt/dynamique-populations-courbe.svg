<svg width="100%" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Allure de l'évolution de l'effectif d'une population dans le temps : croissance, palier fixé par le milieu, chute possible">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="70" y1="262" x2="650" y2="262" class="arr" marker-end="url(#arrow)"/>
<line x1="70" y1="262" x2="70" y2="26" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="648" y="280" text-anchor="end" dominant-baseline="central">temps</text>
<text class="ts" x="80" y="24" text-anchor="start" dominant-baseline="central">effectif (nombre d'individus)</text>

<line x1="70" y1="90" x2="640" y2="90" stroke="#88877F" stroke-width="1" stroke-dasharray="6 4"/>
<text class="ts" x="640" y="74" text-anchor="end" dominant-baseline="central">limite fixée par le milieu (nourriture, espace…)</text>

<path d="M72 248 C180 244 230 110 360 94 C420 88 480 91 520 91" fill="none" stroke="#3B6D11" stroke-width="2.5"/>
<path d="M520 91 C560 94 590 160 636 190" fill="none" stroke="#993C1D" stroke-width="2.5" stroke-dasharray="7 4"/>

<g class="c-green"><text class="th" x="90" y="118" text-anchor="start" dominant-baseline="central">1. Croissance</text>
<text class="ts" x="90" y="136" text-anchor="start" dominant-baseline="central">naissances &gt; décès</text></g>
<g class="c-green"><text class="th" x="440" y="116" text-anchor="middle" dominant-baseline="central">2. Palier</text>
<text class="ts" x="440" y="134" text-anchor="middle" dominant-baseline="central">naissances ≈ décès</text></g>
<g class="c-coral"><text class="th" x="630" y="214" text-anchor="end" dominant-baseline="central">3. Chute possible</text>
<text class="ts" x="630" y="232" text-anchor="end" dominant-baseline="central">sécheresse, maladie…</text></g>

<text class="ts" x="70" y="300" text-anchor="start" dominant-baseline="central">Allure générale d'une population qui s'installe dans un milieu (sans valeurs, pas à l'échelle).</text>
</svg>
