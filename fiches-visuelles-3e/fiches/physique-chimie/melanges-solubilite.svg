<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dissolution du sel jusqu'à saturation, liquides miscibles et non miscibles">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="41" y="80" width="88" height="79" fill="#B5D4F4"/>
<path d="M40 50 L40 160 L130 160 L130 50" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="th" x="85" y="180" text-anchor="middle" dominant-baseline="central">eau</text>
<text class="ts" x="85" y="197" text-anchor="middle" dominant-baseline="central">le solvant</text>

<text class="th" x="155" y="115" text-anchor="middle" dominant-baseline="central">+</text>
<polygon points="175,160 200,132 225,160" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text class="th" x="200" y="180" text-anchor="middle" dominant-baseline="central">sel</text>
<text class="ts" x="200" y="197" text-anchor="middle" dominant-baseline="central">le soluté</text>

<line x1="240" y1="115" x2="300" y2="115" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="270" y="102" text-anchor="middle" dominant-baseline="central">agiter</text>

<rect x="321" y="80" width="88" height="79" fill="#B5D4F4"/>
<path d="M320 50 L320 160 L410 160 L410 50" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="th" x="365" y="180" text-anchor="middle" dominant-baseline="central">eau salée</text>
<text class="ts" x="365" y="197" text-anchor="middle" dominant-baseline="central">la solution, homogène</text>

<line x1="425" y1="115" x2="485" y2="115" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="455" y="90" text-anchor="middle" dominant-baseline="central">encore</text>
<text class="ts" x="455" y="102" text-anchor="middle" dominant-baseline="central">du sel</text>

<rect x="506" y="80" width="88" height="79" fill="#B5D4F4"/>
<polygon points="508,159 520,146 540,142 560,143 580,147 592,159" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<path d="M505 50 L505 160 L595 160 L595 50" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="th" x="550" y="180" text-anchor="middle" dominant-baseline="central">solution saturée</text>
<text class="ts" x="550" y="197" text-anchor="middle" dominant-baseline="central">du sel reste au fond</text>

<g class="c-gray"><rect x="80" y="216" width="520" height="34" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="233" text-anchor="middle" dominant-baseline="central">masse de la solution = masse de l'eau + masse du sel dissous</text></g>

<rect x="146" y="300" width="88" height="79" fill="#B5D4F4"/>
<path d="M145 270 L145 380 L235 380 L235 270" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="th" x="190" y="400" text-anchor="middle" dominant-baseline="central">eau + alcool</text>
<text class="ts" x="190" y="417" text-anchor="middle" dominant-baseline="central">une seule phase : miscibles</text>

<rect x="406" y="340" width="88" height="39" fill="#B5D4F4"/>
<rect x="406" y="300" width="88" height="40" fill="#FAC775"/>
<line x1="406" y1="340" x2="494" y2="340" stroke="#5F5E5A" stroke-width="1"/>
<path d="M405 270 L405 380 L495 380 L495 270" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="480" y1="320" x2="520" y2="320" class="leader"/>
<line x1="480" y1="360" x2="520" y2="360" class="leader"/>
<g class="c-amber"><text class="t" x="526" y="320" text-anchor="start" dominant-baseline="central">huile (au-dessus)</text></g>
<g class="c-blue"><text class="t" x="526" y="360" text-anchor="start" dominant-baseline="central">eau</text></g>
<text class="th" x="450" y="400" text-anchor="middle" dominant-baseline="central">eau + huile</text>
<text class="ts" x="450" y="417" text-anchor="middle" dominant-baseline="central">deux couches : non miscibles</text>
</svg>
