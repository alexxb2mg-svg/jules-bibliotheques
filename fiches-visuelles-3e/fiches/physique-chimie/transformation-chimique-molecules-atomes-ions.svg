<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Modèle moléculaire de 2 H2 + O2 donne 2 H2O">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-blue"><rect x="30" y="24" width="250" height="210" rx="10" stroke-width="0.5"/>
<text class="th" x="155" y="44" text-anchor="middle" dominant-baseline="central">Réactifs (avant)</text></g>
<g class="c-coral"><rect x="400" y="24" width="250" height="210" rx="10" stroke-width="0.5"/>
<text class="th" x="525" y="44" text-anchor="middle" dominant-baseline="central">Produit (après)</text></g>

<g stroke="#5F5E5A" stroke-width="1.2">
<circle cx="72" cy="100" r="11" fill="#FFFFFF"/><circle cx="92" cy="100" r="11" fill="#FFFFFF"/>
<circle cx="72" cy="160" r="11" fill="#FFFFFF"/><circle cx="92" cy="160" r="11" fill="#FFFFFF"/>
<circle cx="190" cy="130" r="17" fill="#F09595"/><circle cx="220" cy="130" r="17" fill="#F09595"/>
</g>
<text class="th" x="140" y="130" text-anchor="middle" dominant-baseline="central">+</text>
<text class="t" x="82" y="200" text-anchor="middle" dominant-baseline="central">2 H₂</text>
<text class="ts" x="82" y="218" text-anchor="middle" dominant-baseline="central">dihydrogène</text>
<text class="t" x="205" y="200" text-anchor="middle" dominant-baseline="central">O₂</text>
<text class="ts" x="205" y="218" text-anchor="middle" dominant-baseline="central">dioxygène</text>

<line x1="292" y1="130" x2="388" y2="130" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="116" text-anchor="middle" dominant-baseline="central">donne</text>

<g stroke="#5F5E5A" stroke-width="1.2">
<circle cx="452" cy="142" r="11" fill="#FFFFFF"/><circle cx="488" cy="142" r="11" fill="#FFFFFF"/><circle cx="470" cy="122" r="17" fill="#F09595"/>
<circle cx="562" cy="142" r="11" fill="#FFFFFF"/><circle cx="598" cy="142" r="11" fill="#FFFFFF"/><circle cx="580" cy="122" r="17" fill="#F09595"/>
</g>
<text class="t" x="525" y="200" text-anchor="middle" dominant-baseline="central">2 H₂O</text>
<text class="ts" x="525" y="218" text-anchor="middle" dominant-baseline="central">eau</text>

<circle cx="60" cy="266" r="9" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="ts" x="76" y="266" text-anchor="start" dominant-baseline="central">atome d'hydrogène H</text>
<circle cx="240" cy="266" r="12" fill="#F09595" stroke="#5F5E5A" stroke-width="1.2"/>
<text class="ts" x="258" y="266" text-anchor="start" dominant-baseline="central">atome d'oxygène O</text>

<g class="c-gray"><rect x="30" y="296" width="620" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="315" text-anchor="middle" dominant-baseline="central">Les liaisons se cassent, les atomes se réassemblent autrement.</text>
<text class="ts" x="340" y="335" text-anchor="middle" dominant-baseline="central">Aucun atome ne disparaît, aucun n'apparaît : la masse totale se conserve.</text></g>
</svg>
