notion: classification-periodique
titre: "Symboles, classification périodique et formules"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020) — BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027) — éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - id: formule
    type: formule
    expression: "[2] [N][₂][O]"
    termes:
      "2": {couleur: violet, legende: "le coefficient, devant la formule : le nombre de molécules (ici 2 molécules de protoxyde d'azote)"}
      N: {couleur: bleu, legende: "un symbole d'élément : N pour l'azote. Une majuscule commence toujours un nouveau symbole"}
      "₂": {couleur: rouge, legende: "l'indice (ici 2), en bas à droite du symbole : le nombre d'atomes de cet élément dans une molécule"}
      O: {couleur: vert, legende: "O pour l'oxygène, sans indice : un seul atome d'oxygène dans chaque molécule"}
    jules: "Lis une formule de gauche à droite : un symbole, puis son indice s'il y en a un. Et le nombre devant ?"

  - id: carte
    type: carte
    noeuds:
      - {id: classification, titre: "Classification", sous_titre: "118 éléments rangés", principal: true}
      - {id: symbole, titre: "Symbole", sous_titre: "Majuscule (+ minuscule)"}
      - {id: colonne, titre: "Colonne", sous_titre: "une famille d'éléments"}
      - {id: formule, titre: "Formule chimique", sous_titre: "symboles + indices"}
      - {id: coefficient, titre: "Coefficient", sous_titre: "nombre de molécules"}
    liens:
      - {de: classification, vers: symbole}
      - {de: classification, vers: colonne}
      - {de: classification, vers: formule}
      - {de: classification, vers: coefficient}
    jules: "Les symboles ne sont pas toujours l'initiale du nom français : sodium, or et argent viennent du latin. Où les retrouver sans les deviner ?"

  - id: schema
    type: schema
    titre: "Les 18 premiers éléments de la classification"
    svg: "classification-periodique.svg"
    jules: "Regarde une ligne, puis une colonne. Dans quel sens le numéro atomique augmente-t-il, et que partagent les éléments d'une même colonne ?"

  - id: methode
    type: methode
    etapes:
      - "Pour trouver un symbole : chercher le nom de l'élément dans la classification ; respecter la majuscule puis la minuscule."
      - "Pour lire une formule : repérer chaque symbole (une majuscule commence un nouveau symbole), puis lire l'indice qui le suit (aucun indice = 1 atome)."
      - "Pour compter les atomes de plusieurs molécules : multiplier le nombre d'atomes d'une molécule par le nombre placé devant la formule."
      - "Formules à connaître : O₂ dioxygène, H₂ dihydrogène, N₂ diazote, H₂O eau, CO₂ dioxyde de carbone, CH₄ méthane, N₂O protoxyde d'azote."
    jules: "À l'étape 2, compte les majuscules : elles te disent combien d'éléments différents contient la molécule."

  - id: piege
    type: piege
    mauvaise_idee: "Dans H₂O, le O n'a pas de chiffre, donc il n'y a pas d'atome d'oxygène à compter."
    pourquoi_faux: "Un symbole écrit sans indice représente un atome : l'indice 1 ne s'écrit jamais."
    bonne_idee: "Pas d'indice = 1 atome. H₂O : 2 atomes d'hydrogène et 1 atome d'oxygène, soit 3 atomes par molécule."
    jules: "Avant de compter, repasse chaque symbole du doigt et dis son nombre d'atomes à voix haute, même quand il n'y a pas de chiffre."

  - id: exemple
    type: exemple
    situation: "Le protoxyde d'azote, un gaz à effet de serre, a pour formule N₂O. Que signifie cette formule ?"
    calcul: "N₂ : symbole N (azote) et indice 2, donc 2 atomes d'azote. O : symbole O (oxygène) sans indice, donc 1 atome d'oxygène. Total : 2 + 1 = 3 atomes."
    conclusion: "Une molécule de N₂O contient 2 atomes d'azote et 1 atome d'oxygène, soit 3 atomes."
    jules: "NO₂ existe aussi, et ce n'est pas la même molécule. Qu'est-ce qui change entre N₂O et NO₂ ?"

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Les cartes mémoire sont idéales pour retenir les symboles : nom d'un côté, symbole de l'autre."
