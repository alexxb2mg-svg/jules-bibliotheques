<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="105" y="34" text-anchor="middle">Réservoir</text>
<text class="ts" x="340" y="34" text-anchor="middle">Convertisseur</text>
<text class="ts" x="560" y="34" text-anchor="middle">Formes d'énergie obtenues</text>
<g class="node c-gray"><rect x="30" y="110" width="150" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="130" text-anchor="middle" dominant-baseline="central">Pile</text>
<text class="ts" x="105" y="150" text-anchor="middle" dominant-baseline="central">énergie chimique</text></g>
<line x1="182" y1="140" x2="274" y2="140" class="arr" marker-end="url(#fleche)"/>
<text class="ts" x="228" y="112" text-anchor="middle">énergie</text>
<text class="ts" x="228" y="128" text-anchor="middle">électrique</text>
<g class="node c-gray"><ellipse cx="340" cy="140" rx="62" ry="34" stroke-width="0.5"/>
<text class="th" x="340" y="140" text-anchor="middle" dominant-baseline="central">Lampe</text></g>
<line x1="398" y1="126" x2="466" y2="94" class="arr" marker-end="url(#fleche)"/>
<line x1="398" y1="154" x2="466" y2="186" class="arr" marker-end="url(#fleche)"/>
<g class="node c-teal"><rect x="470" y="60" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="79" text-anchor="middle" dominant-baseline="central">Énergie lumineuse</text>
<text class="ts" x="560" y="97" text-anchor="middle" dominant-baseline="central">utile : elle éclaire</text></g>
<g class="node c-coral"><rect x="470" y="164" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="560" y="183" text-anchor="middle" dominant-baseline="central">Énergie thermique</text>
<text class="ts" x="560" y="201" text-anchor="middle" dominant-baseline="central">perdue : la lampe chauffe</text></g>
<g class="c-gray"><rect x="30" y="250" width="620" height="60" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="270" text-anchor="middle" dominant-baseline="central">Combustible brûlé (charbon, pétrole, gaz, bois) : énergie chimique → thermique,</text>
<text class="t" x="340" y="290" text-anchor="middle" dominant-baseline="central">et la combustion rejette du dioxyde de carbone (CO₂).</text></g>
