notion: transformation-chimique-molecules-atomes-ions
titre: "La transformation chimique : les atomes se réarrangent"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020) — BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027) — éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - id: formule
    type: formule
    expression: "[2 H₂ + O₂] → [2 H₂O]"
    termes:
      "2 H₂ + O₂": {couleur: bleu, legende: "les réactifs, consommés : ici 2 molécules de dihydrogène et 1 molécule de dioxygène"}
      "2 H₂O": {couleur: rouge, legende: "le produit, formé : 2 molécules d'eau. Le nombre devant une formule compte les molécules"}
    jules: "La flèche se lit « donne », pas « égale ». De chaque côté, on doit retrouver les mêmes atomes, en même nombre."

  - id: carte
    type: carte
    noeuds:
      - {id: transfo, titre: "Transformation chimique", sous_titre: "réactifs → produits", principal: true}
      - {id: especes, titre: "Nouvelles espèces", sous_titre: "repérées par un test"}
      - {id: atomes, titre: "Atomes conservés", sous_titre: "donc la masse aussi"}
      - {id: physique, titre: "Transformation physique", sous_titre: "fusion, dissolution…"}
      - {id: ion, titre: "Molécule et ion", sous_titre: "l'ion porte une charge"}
    liens:
      - {de: transfo, vers: especes}
      - {de: transfo, vers: atomes}
      - {de: transfo, vers: physique}
      - {de: transfo, vers: ion}
    jules: "Une fusion et une combustion changent toutes deux l'aspect de la matière. Laquelle fait apparaître une nouvelle espèce ?"

  - id: schema
    type: schema
    titre: "Ce qui se passe à l'échelle des atomes"
    svg: "transformation-chimique-molecules-atomes-ions.svg"
    jules: "Compte les boules de chaque couleur à gauche puis à droite. Qu'est-ce qui a changé : les atomes, ou la façon dont ils sont liés ?"

  - id: methode
    type: methode
    etapes:
      - "Faire la liste des espèces avant et après : si une nouvelle espèce apparaît, c'est une transformation chimique."
      - "Identifier les produits grâce aux tests caractéristiques (eau de chaux qui se trouble, sulfate de cuivre anhydre qui bleuit…)."
      - "Dans une équation, les réactifs sont à gauche de la flèche, les produits à droite."
      - "Pour compter les atomes : multiplier l'indice (petit chiffre après le symbole) par le coefficient (nombre devant la formule)."
      - "Pour une masse, en système fermé : masse des produits formés = masse des réactifs consommés."
    jules: "À l'étape 4, 2 H₂O ne contient pas 2 atomes d'hydrogène. Refais le calcul avec le schéma sous les yeux."

  - id: piege
    type: piege
    mauvaise_idee: "Quand le sucre se dissout dans l'eau ou quand la glace fond, c'est une transformation chimique."
    pourquoi_faux: "Aucune nouvelle espèce n'apparaît : l'eau reste de l'eau et le sucre reste du sucre. C'est une transformation physique."
    bonne_idee: "On parle de transformation chimique seulement si des réactifs disparaissent et que de nouvelles espèces (les produits) apparaissent."
    jules: "Pose-toi toujours la même question : après, y a-t-il une espèce chimique qui n'existait pas avant ?"

  - id: exemple
    type: exemple
    situation: "Du carbone brûle dans le dioxygène : C + O₂ → CO₂. 3 g de carbone réagissent avec 8 g de dioxygène. Quelle masse de dioxyde de carbone se forme ?"
    calcul: "Avant : 1 atome C et 2 atomes O. Après : 1 atome C et 2 atomes O, réunis dans une molécule de CO₂. Les atomes se conservent, donc la masse aussi : 3 g + 8 g = 11 g."
    conclusion: "Il se forme 11 g de dioxyde de carbone."
    jules: "Si l'on brûlait le carbone à l'air libre, le gaz s'échapperait. La masse aurait-elle vraiment disparu ?"

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à compter les atomes de chaque côté d'une équation : coefficient et indice, toujours les deux."
