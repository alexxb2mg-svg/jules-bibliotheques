notion: expression-litterale-energie-cinetique
titre: "L'énergie cinétique : Ec = ½ m v²"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020), BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027), éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - id: formule
    type: formule
    expression: "[Ec] = ½ × [m] × [v]²"
    termes:
      Ec: {couleur: orange, legende: "l'**énergie cinétique**, en joules (J)"}
      m: {couleur: vert, legende: "la **masse** de l'objet, en **kilogrammes (kg)** : des grammes se divisent par 1 000"}
      v: {couleur: bleu, legende: "la **vitesse**, en **mètres par seconde (m/s)** : des km/h se divisent par 3,6"}
    jules: "Deux grandeurs seulement, mais elles ne jouent pas le même rôle : l'une est **élevée au carré**. Laquelle, et qu'est-ce que cela change ?"

  - id: carte
    type: carte
    noeuds:
      - {id: ec, titre: "Énergie cinétique Ec", sous_titre: "énergie liée au mouvement, en J", principal: true}
      - {id: masse, titre: "Masse m", sous_titre: "en kg ; proportionnelle"}
      - {id: vitesse, titre: "Vitesse v", sous_titre: "en m/s ; au carré"}
      - {id: freinage, titre: "Distance de freinage", sous_titre: "plus longue si Ec est grande"}
    liens:
      - {de: ec, vers: masse, libelle: "dépend de"}
      - {de: ec, vers: vitesse, libelle: "dépend surtout de"}
      - {de: ec, vers: freinage, libelle: "explique"}
    jules: "Pour s'arrêter, un véhicule doit perdre toute son **énergie cinétique**. Relie cette idée au **carré de la vitesse** : que penses-tu de la vitesse en ville ?"

  - id: schema
    type: schema
    titre: "Même objet, trois vitesses"
    svg: "expression-litterale-energie-cinetique.svg"
    jules: "Compare la hauteur des barres quand la vitesse est multipliée par 2, puis par 3. Retrouve ces facteurs à partir de v² avec des nombres simples."

  - id: methode
    type: methode
    etapes:
      - "Convertir la masse en **kg** et la vitesse en **m/s**."
      - "Calculer d'abord **v²** (la vitesse multipliée par elle-même)."
      - "Multiplier par la masse, puis par ½ (ou diviser par 2)."
      - "Écrire le résultat en **joules (J)**."
    jules: "L'ordre compte : le **carré** ne porte que sur la **vitesse**, pas sur la masse ni sur le ½."

  - id: piege
    type: piege
    mauvaise_idee: "Calculer ½ × m × v, en oubliant de mettre la vitesse **au carré**."
    pourquoi_faux: "Dans la formule, c'est **v² = v × v** qui intervient : sans le carré, le résultat est faux et on sous-estime l'effet de la vitesse."
    bonne_idee: "Calculer **v² en premier**, l'écrire sur la copie, puis multiplier par m et par ½."
    jules: "Un bon réflexe : écris toujours la ligne « v² = … » avant de continuer ton calcul."

  - id: exemple
    type: exemple
    situation: "Un cycliste et son vélo ont une masse totale de 80 kg et roulent à 36 km/h. Quelle est leur énergie cinétique ?"
    calcul: "Conversion : v = 36 ÷ 3,6 = 10 m/s. Puis v² = 10 × 10 = 100, et Ec = ½ × 80 × 100 = **4 000 J**."
    conclusion: "L'énergie cinétique du cycliste et de son vélo vaut **4 000 J**."
    jules: "Sans la **conversion en m/s**, le résultat aurait été beaucoup trop grand : vérifie toujours les **unités** avant de remplacer."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi surtout sur les conversions (g en kg, km/h en m/s) : c'est là que se cachent la plupart des erreurs."
