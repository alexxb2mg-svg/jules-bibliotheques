notion: expression-litterale-energie-cinetique
titre: "L'énergie cinétique : Ec = ½ m v²"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020), BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027), éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
variables: {Ec: "l'énergie cinétique, en joules (J)", m: "la masse de l'objet, en kilogrammes (kg)", v: "la vitesse, en mètres par seconde (m/s)"}
blocs:
  - id: formule
    type: formule
    expression: "[Ec] = ½ × [m] × [v]²"
    termes:
      Ec: {couleur: orange, legende: "l'**énergie cinétique**, en joules (J)"}
      m: {couleur: vert, legende: "la **masse** de l'objet, en **kilogrammes (kg)** : des grammes se divisent par 1 000"}
      v: {couleur: bleu, legende: "la **vitesse**, en **mètres par seconde (m/s)** : des km/h se divisent par 3,6"}
    jules: "C'est la **vitesse** qui est au carré, pas la masse. Masse doublée : Ec doublée ; vitesse doublée : Ec **multipliée par 4**. La vitesse pèse donc bien plus lourd que la masse."

  - id: carte
    type: carte
    noeuds:
      - {id: ec, titre: "Énergie cinétique Ec", sous_titre: "énergie liée au mouvement, en J", principal: true}
      - {id: masse, titre: "Masse m", sous_titre: "en kg ; proportionnelle"}
      - {id: vitesse, titre: "Vitesse v", sous_titre: "en m/s ; au carré"}
      - {id: freinage, titre: "Distance de freinage", sous_titre: "plus longue si Ec est grande"}
    liens:
      - {de: ec, vers: masse, libelle: "dépend de"}
      - {de: ec, vers: vitesse, libelle: "dépend surtout de"}
      - {de: ec, vers: freinage, libelle: "explique"}
    jules: "Pour s'arrêter, un véhicule doit perdre toute son **énergie cinétique**. Avec le **carré de la vitesse**, rouler à 50 km/h au lieu de 30 km/h multiplie Ec par presque 3 : d'où les limitations en ville."

  - id: schema
    type: schema
    titre: "Même objet, trois vitesses"
    svg: "expression-litterale-energie-cinetique.svg"
    jules: "Vitesse × 2 : Ec × 4, car 2 × 2 = 4. Vitesse × 3 : Ec × 9, car 3 × 3 = 9. Les barres grandissent bien plus vite que la vitesse : c'est l'effet du **carré**."

  - id: graphe-ec
    type: graphe
    gabarit: courbe-energie-cinetique
    curseurs:
      - {id: curseur-v, nom: v, min: 0, max: 40, pas: 2, depart: 10}
      - {id: curseur-m, nom: m, min: 500, max: 2000, pas: 250, depart: 1000}
    lectures:
      - {si: "v == 0", texte: "À l'arrêt, l'**énergie cinétique** est nulle : le point est à l'origine."}
      - {si: "v > 0 && v < 20", texte: "Monte v pas à pas : le point ne monte pas d'autant à chaque pas, il monte **de plus en plus vite**. La courbe n'est pas une droite."}
      - {si: "v >= 20", texte: "De 10 à 20 m/s, la vitesse double et l'énergie cinétique est **multipliée par 4** : c'est le **carré** de v. D'où une **distance de freinage** qui grandit si vite."}
      - {si: "m >= 1500", texte: "Véhicule plus lourd : à la même vitesse, il a plus d'énergie cinétique. Ec est **proportionnelle** à m."}
    jules: "v : la vitesse en m/s ; m : la masse du véhicule en kg. La courbe grise est celle d'une voiture de 1 000 kg : change m, la courbe s'étire ; change v, le point monte de plus en plus vite."

  - id: methode
    type: methode
    etapes:
      - "Convertir la masse en **kg** et la vitesse en **m/s**."
      - "Calculer d'abord **v²** (la vitesse multipliée par elle-même)."
      - "Multiplier par la masse, puis par ½ (ou diviser par 2)."
      - "Écrire le résultat en **joules (J)**."
    jules: "Le **carré** ne porte que sur la **vitesse**, pas sur la masse ni sur le ½. Et ½ × m × v² donne le même résultat que m × v² ÷ 2 : choisis l'écriture la plus simple pour toi."

  - id: piege
    type: piege
    mauvaise_idee: "Calculer ½ × m × v, en oubliant de mettre la vitesse **au carré**."
    pourquoi_faux: "Dans la formule, c'est **v² = v × v** qui intervient : sans le carré, le résultat est faux et on sous-estime l'effet de la vitesse."
    bonne_idee: "Calculer **v² en premier**, l'écrire sur la copie, puis multiplier par m et par ½."
    jules: "Réflexe : écris toujours la ligne « v² = … » avant de continuer. Avec v = 10 m/s, oublier le carré donne un résultat **10 fois trop petit** (10 au lieu de 100)."

  - id: exemple
    type: exemple
    situation: "Un cycliste et son vélo ont une masse totale de 80 kg et roulent à 36 km/h. Quelle est leur énergie cinétique ?"
    calcul: "Conversion : v = 36 ÷ 3,6 = 10 m/s. Puis v² = 10 × 10 = 100, et Ec = ½ × 80 × 100 = **4 000 J**."
    conclusion: "L'énergie cinétique du cycliste et de son vélo vaut **4 000 J**."
    jules: "Sans **conversion**, on aurait calculé ½ × 80 × 36² = 51 840 J, près de 13 fois trop. Retiens : km/h ÷ 3,6 = m/s, car 1 km = 1 000 m et 1 h = 3 600 s."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Les conversions à connaître : grammes ÷ 1 000 = **kilogrammes**, km/h ÷ 3,6 = **m/s**. Exemples : 500 g = 0,5 kg et 72 km/h = 20 m/s."
