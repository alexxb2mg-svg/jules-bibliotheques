<line x1="480" y1="448" x2="520" y2="448" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
<g class="c-blue"><text class="ts" x="528" y="448" text-anchor="start" dominant-baseline="central">on refroidit</text></g>
