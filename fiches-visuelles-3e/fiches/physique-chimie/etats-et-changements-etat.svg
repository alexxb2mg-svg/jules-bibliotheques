<g class="c-blue"><text class="t" x="498" y="214" text-anchor="start" dominant-baseline="central">liquéfaction</text></g>

<line x1="150" y1="448" x2="190" y2="448" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
