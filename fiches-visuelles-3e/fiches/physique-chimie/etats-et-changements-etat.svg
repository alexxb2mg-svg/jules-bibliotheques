<text class="th" x="130" y="318" text-anchor="middle" dominant-baseline="central">Solide</text>
<text class="ts" x="130" y="404" text-anchor="middle" dominant-baseline="central">serrées et ordonnées</text></g>
<g fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1">
<circle cx="94" cy="342" r="7"/><circle cx="112" cy="342" r="7"/><circle cx="130" cy="342" r="7"/><circle cx="148" cy="342" r="7"/><circle cx="166" cy="342" r="7"/>
