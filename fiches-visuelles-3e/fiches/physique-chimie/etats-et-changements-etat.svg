<text class="ts" x="550" y="404" text-anchor="middle" dominant-baseline="central">serrées mais désordonnées</text></g>
<g fill="#B4B2A9" stroke="#5F5E5A" stroke-width="1">
<circle cx="506" cy="346" r="7"/><circle cx="521" cy="339" r="7"/><circle cx="538" cy="347" r="7"/><circle cx="554" cy="340" r="7"/><circle cx="570" cy="348" r="7"/><circle cx="587" cy="342" r="7"/>
