<g class="c-blue"><text class="t" x="340" y="400" text-anchor="middle" dominant-baseline="central">solidification</text></g>

<line x1="172" y1="294" x2="265" y2="146" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
