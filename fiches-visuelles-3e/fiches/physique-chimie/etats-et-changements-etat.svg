<line x1="228" y1="340" x2="452" y2="340" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="452" y1="384" x2="228" y2="384" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
