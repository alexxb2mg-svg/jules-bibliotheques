<g class="c-blue"><text class="t" x="182" y="214" text-anchor="end" dominant-baseline="central">condensation</text></g>

<line x1="508" y1="294" x2="415" y2="146" stroke="#993C1D" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="440" y1="146" x2="533" y2="294" stroke="#185FA5" stroke-width="2" marker-end="url(#arrow)"/>
