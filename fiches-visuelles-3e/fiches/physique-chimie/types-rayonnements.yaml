notion: types-rayonnements
titre: "La lumière et ses cousins invisibles"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020) — BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027) — éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: rayonnements, titre: "Les rayonnements", sous_titre: "même nature que la lumière", principal: true}
      - {id: visible, titre: "Lumière visible", sous_titre: "la seule que l'œil voit"}
      - {id: invisibles, titre: "Rayonnements invisibles", sous_titre: "radio, infrarouge, UV, X..."}
      - {id: energie, titre: "Énergie transportée", sous_titre: "UV, X, gamma : se protéger"}
      - {id: vide, titre: "Dans le vide", sous_titre: "tous à environ 300 000 km/s"}
    liens:
      - {de: rayonnements, vers: visible, libelle: "on voit"}
      - {de: rayonnements, vers: invisibles, libelle: "on ne voit pas"}
      - {de: rayonnements, vers: energie, libelle: "danger"}
      - {de: rayonnements, vers: vide, libelle: "vitesse"}
    jules: "Ondes radio, infrarouge, rayons X : ce sont des rayonnements comme la lumière. Qu'est-ce qui les distingue alors de la lumière visible ?"

  - id: schema
    type: schema
    titre: "Les familles de rayonnements"
    svg: "types-rayonnements.svg"
    jules: "Repère la lumière visible au milieu. Pourquoi les rayonnements de droite demandent-ils une protection, et pas ceux de gauche ?"

  - id: methode
    type: methode
    etapes:
      - "Repérer l'usage ou l'effet décrit (voir, communiquer, chauffer, radiographier, bronzer)."
      - "Associer cet usage au type de rayonnement."
      - "Se rappeler que tous se propagent dans le vide à environ 300 000 km/s."
      - "Pour une durée de trajet : t = d ÷ v, avec d en km et v en km/s."
    jules: "« Infra » veut dire en dessous et « ultra » au-delà : ces préfixes t'aident à placer les rayonnements autour du visible."

  - id: piege
    type: piege
    mauvaise_idee: "Les ondes radio ont besoin d'air pour se propager, comme le son."
    pourquoi_faux: "Les ondes radio sont un rayonnement, de même nature que la lumière : elles traversent le vide de l'espace."
    bonne_idee: "Tous les rayonnements se propagent dans le vide, à environ 300 000 km/s. C'est le son qui a besoin d'un milieu matériel."
    jules: "Une radio reçoit un rayonnement, puis son haut-parleur produit un son. Lequel des deux pourrait traverser l'espace ?"

  - id: exemple
    type: exemple
    situation: "Pourquoi peut-on communiquer par radio avec des astronautes dans l'espace, alors qu'on ne pourrait pas les entendre crier ?"
    calcul: "Ondes radio : un rayonnement, qui se propage dans le vide. Cri : un son, qui a besoin d'un milieu matériel."
    conclusion: "Les ondes radio traversent le vide de l'espace, le son ne le peut pas."
    jules: "Compare ce dont chaque signal a besoin pour avancer. Dans l'espace, que manque-t-il au son ?"

  - id: exemple-calcul
    type: exemple
    situation: "Un signal radio est envoyé vers la Lune, à environ 384 000 km. Les ondes radio vont à environ 300 000 km/s. Combien de temps met-il ?"
    calcul: "t = d ÷ v = 384 000 km ÷ 300 000 km/s = 1,28 s."
    conclusion: "Le signal met environ 1,3 s pour atteindre la Lune."
    jules: "Distance en km, vitesse en km/s : le résultat sort directement en secondes. Vérifie qu'il est raisonnable."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi à associer chaque usage de la vie courante à son rayonnement."
