<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Courbe de la température de la glace pure chauffée, avec un palier à 0 °C">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="90" y1="300" x2="90" y2="34" class="arr" marker-end="url(#arrow)"/>
<line x1="90" y1="300" x2="650" y2="300" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="100" y="40" text-anchor="start" dominant-baseline="central">température (°C)</text>
<text class="ts" x="648" y="318" text-anchor="end" dominant-baseline="central">temps</text>

<line x1="84" y1="100" x2="90" y2="100" class="arr"/>
<line x1="84" y1="220" x2="90" y2="220" class="arr"/>
<line x1="84" y1="280" x2="90" y2="280" class="arr"/>
<text class="ts" x="80" y="100" text-anchor="end" dominant-baseline="central">20 °C</text>
<text class="ts" x="80" y="220" text-anchor="end" dominant-baseline="central">0 °C</text>
<text class="ts" x="80" y="280" text-anchor="end" dominant-baseline="central">-10 °C</text>
<line x1="90" y1="220" x2="208" y2="220" class="leader"/>
<line x1="210" y1="220" x2="210" y2="300" class="leader"/>
<line x1="420" y1="220" x2="420" y2="300" class="leader"/>

<polyline points="92,280 210,220" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round"/>
<polyline points="420,220 600,112" fill="none" stroke="#185FA5" stroke-width="3" stroke-linecap="round"/>
<line x1="210" y1="220" x2="420" y2="220" stroke="#993C1D" stroke-width="4" stroke-linecap="round"/>

<g class="c-blue"><text class="t" x="168" y="270" text-anchor="start" dominant-baseline="central">solide</text>
<text class="t" x="530" y="192" text-anchor="start" dominant-baseline="central">liquide</text></g>
<g class="c-coral"><text class="th" x="315" y="202" text-anchor="middle" dominant-baseline="central">solide + liquide</text>
<text class="ts" x="315" y="240" text-anchor="middle" dominant-baseline="central">palier : la glace fond,</text>
<text class="ts" x="315" y="257" text-anchor="middle" dominant-baseline="central">la température reste à 0 °C</text></g>
<text class="ts" x="210" y="316" text-anchor="middle" dominant-baseline="central">début</text>
<text class="ts" x="420" y="316" text-anchor="middle" dominant-baseline="central">fin</text>

<g class="c-gray"><rect x="60" y="340" width="560" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="362" text-anchor="middle" dominant-baseline="central">Corps pur : température constante pendant tout le changement d'état.</text></g>
</svg>
