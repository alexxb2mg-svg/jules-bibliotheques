<svg width="100%" viewBox="0 0 680 290" xmlns="http://www.w3.org/2000/svg">
<title>Les familles de rayonnements</title>
<desc>Six familles de rayonnements rangées de la moins à la plus énergétique : ondes radio, micro-ondes, infrarouge, lumière visible, ultraviolets, rayons X et gamma.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M14,50 V44 H334 V50" fill="none" stroke="#88877f" stroke-width="1"/>
<text class="ts" x="174" y="36" text-anchor="middle">invisibles</text>
<path d="M344,50 V44 H444 V50" fill="none" stroke="#88877f" stroke-width="1"/>
<text class="ts" x="394" y="36" text-anchor="middle">visible</text>
<path d="M454,50 V44 H664 V50" fill="none" stroke="#88877f" stroke-width="1"/>
<text class="ts" x="559" y="36" text-anchor="middle">invisibles</text>
<g class="c-gray"><rect x="12" y="58" width="104" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="64" y="80" text-anchor="middle">Ondes radio</text>
<text class="ts" x="64" y="100" text-anchor="middle">radio, wifi,</text>
<text class="ts" x="64" y="115" text-anchor="middle">portable</text></g>
<g class="c-gray"><rect x="122" y="58" width="104" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="174" y="80" text-anchor="middle">Micro-ondes</text>
<text class="ts" x="174" y="100" text-anchor="middle">four à</text>
<text class="ts" x="174" y="115" text-anchor="middle">micro-ondes</text></g>
<g class="c-gray"><rect x="232" y="58" width="104" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="284" y="80" text-anchor="middle">Infrarouge</text>
<text class="ts" x="284" y="100" text-anchor="middle">télécommande,</text>
<text class="ts" x="284" y="115" text-anchor="middle">chaleur</text></g>
<g class="c-amber"><rect x="342" y="58" width="104" height="66" rx="8" stroke-width="1"/>
<text class="th" x="394" y="80" text-anchor="middle">Visible</text>
<text class="ts" x="394" y="100" text-anchor="middle">couleurs de</text>
<text class="ts" x="394" y="115" text-anchor="middle">l'arc-en-ciel</text></g>
<g class="c-red"><rect x="452" y="58" width="104" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="504" y="80" text-anchor="middle">Ultraviolets</text>
<text class="ts" x="504" y="100" text-anchor="middle">bronzage,</text>
<text class="ts" x="504" y="115" text-anchor="middle">coups de soleil</text></g>
<g class="c-red"><rect x="562" y="58" width="104" height="66" rx="8" stroke-width="0.5"/>
<text class="th" x="614" y="80" text-anchor="middle">Rayons X, γ</text>
<text class="ts" x="614" y="100" text-anchor="middle">radiographie</text></g>
<line x1="20" y1="148" x2="660" y2="148" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="168" text-anchor="middle">de plus en plus d'énergie transportée</text>
<path d="M454,184 V190 H664 V184" fill="none" stroke="#A32D2D" stroke-width="1"/>
<g class="c-red"><text class="th" x="559" y="210" text-anchor="middle">dangereux : on s'en protège</text></g>
<g class="c-gray"><rect x="40" y="228" width="600" height="44" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="250" text-anchor="middle" dominant-baseline="central">Tous se propagent dans le vide, à environ 300 000 km/s</text></g>
</svg>
