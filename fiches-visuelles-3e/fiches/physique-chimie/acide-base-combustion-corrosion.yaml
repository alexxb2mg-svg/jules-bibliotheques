notion: acide-base-combustion-corrosion
titre: "pH, combustions, corrosion et gaz à effet de serre"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020) — BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027) — éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
variables: {pH: "le pH de la solution, sans unité, de 0 à 14"}
blocs:
  - id: formule
    type: formule
    expression: "[CH₄] + 2 [O₂] → [CO₂] + 2 H₂O"
    termes:
      "CH₄": {couleur: orange, legende: "le **combustible** (ici le méthane, le gaz de cuisine) : il brûle"}
      "O₂": {couleur: bleu, legende: "le **comburant**, le dioxygène de l'air : sans lui, pas de combustion"}
      "CO₂": {couleur: rouge, legende: "le **dioxyde de carbone** formé : un gaz à effet de serre, qui trouble l'**eau de chaux**"}
    jules: "Le CO₂ se repère avec l'**eau de chaux**, qui se trouble ; l'eau formée bleuit le **sulfate de cuivre anhydre**. Et on retrouve bien 1 C, 4 H et 4 O de chaque côté de la flèche."

  - id: carte
    type: carte
    noeuds:
      - {id: chimie, titre: "Chimie du quotidien", sous_titre: "des transformations à repérer", principal: true}
      - {id: ph, titre: "pH", sous_titre: "acide, neutre ou basique"}
      - {id: combustion, titre: "Combustion", sous_titre: "combustible + dioxygène"}
      - {id: corrosion, titre: "Corrosion", sous_titre: "fer + dioxygène + eau"}
      - {id: ges, titre: "Gaz à effet de serre", sous_titre: "CO₂, CH₄, N₂O"}
    liens:
      - {de: chimie, vers: ph}
      - {de: chimie, vers: combustion}
      - {de: chimie, vers: corrosion}
      - {de: chimie, vers: ges}
    jules: "Le réactif commun, c'est le **dioxygène**. Sans lui, une flamme s'éteint (on étouffe un feu avec une couverture) et le fer ne rouille pas. S'il en manque un peu à une combustion, il se forme du **monoxyde de carbone**, un gaz toxique."

  - id: schema-ph
    type: schema
    titre: "L'échelle de pH, de 0 à 14"
    svg: "acide-base-combustion-corrosion.svg"
    jules: "L'acide le plus fort est du côté de **0**, la base la plus forte du côté de 14. Astuce : A comme Acide, au début de l'échelle. Diluer un acide dans l'eau fait **remonter son pH vers 7**, sans jamais le dépasser."

  - id: schema-oxygene
    type: schema
    titre: "Combustion et corrosion : deux transformations avec le dioxygène"
    svg: "acide-base-combustion-corrosion-oxygene.svg"
    jules: "Un clou dans de l'eau privée d'air, ou dans de l'air très sec, ne rouille pas : il faut le **dioxygène et l'eau en même temps**. Le sel accélère la rouille : les voitures rouillent plus vite en bord de mer."

  - id: graphe
    type: graphe
    gabarit: echelle-ph
    curseurs:
      - {id: curseur-ph, nom: ph, min: 0, max: 14, pas: 0.5, depart: 7}
    lectures:
      - {si: "ph > 2 && ph < 7", texte: "Solution **acide** : plus d'**ions H⁺** que d'ions HO⁻. Plus le pH est petit, plus elle est acide."}
      - {si: "ph <= 2", texte: "Solution **très acide** : beaucoup d'**ions H⁺**. Elle est **corrosive** : on la manipule avec **gants et lunettes**."}
      - {si: "ph == 7", texte: "Solution **neutre** : **autant** d'ions H⁺ que d'ions HO⁻, comme l'eau pure."}
      - {si: "ph > 7", texte: "Solution **basique** : plus d'**ions HO⁻** que d'ions H⁺. À partir de pH 12, elle est **corrosive** aussi : **gants et lunettes**."}
    jules: "Fais glisser le repère : les ions rouges (H⁺) gagnent du côté acide, les bleus (HO⁻) du côté basique. Aux deux bouts de l'échelle (pH 2 ou moins, 12 ou plus), le pictogramme rappelle le danger : **gants et lunettes**."

  - id: methode
    type: methode
    etapes:
      - "Mesurer le pH : déposer une goutte de solution sur le **papier pH** avec un agitateur et comparer la couleur à l'échelle, ou plonger la sonde du **pH-mètre**."
      - "Comparer à 7 : en dessous, **acide** ; égal, **neutre** ; au-dessus, **basique**."
      - "Relier au microscopique : dans une solution acide, les **ions H⁺** sont plus nombreux que les **ions HO⁻** ; dans une solution basique, c'est l'inverse."
      - "Pour une combustion : identifier le **combustible**, le **comburant** (dioxygène) et les produits, puis les tester (eau de chaux pour le CO₂)."
      - "Pour une corrosion : vérifier si le **dioxygène et l'eau** sont présents tous les deux."
    jules: "Sécurité : **lunettes et gants** pour les acides et les bases concentrés. Pour diluer, on verse toujours **l'acide dans l'eau**, jamais l'inverse : la chaleur dégagée pourrait faire gicler l'acide."

  - id: piege
    type: piege
    mauvaise_idee: "Plus le pH est grand, plus la solution est **acide**."
    pourquoi_faux: "C'est l'inverse : un pH **inférieur à 7** indique une solution acide, et **plus il est petit**, plus elle est acide."
    bonne_idee: "pH < 7 : **acide** (d'autant plus que le pH est petit). pH = 7 : **neutre**. pH > 7 : **basique** (d'autant plus que le pH est grand)."
    jules: "Pour ne plus te tromper : pH **petit** = beaucoup d'**ions H⁺** = acide. L'eau pure est à 7, pile au milieu. Un pH de 2 est donc plus acide qu'un pH de 5."

  - id: exemple
    type: exemple
    situation: "Au papier pH, un élève mesure pH = 4 pour un soda et pH = 11 pour une lessive diluée."
    calcul: "4 < 7 et 11 > 7."
    conclusion: "Le soda est **acide** : il contient plus d'ions H⁺ que d'ions HO⁻. La lessive est **basique** : elle contient plus d'ions HO⁻ que d'ions H⁺."
    jules: "Une solution acide contient aussi des ions HO⁻, seulement **moins** que d'ions H⁺. À pH 7, il y en a **autant** des deux : c'est pour ça que l'eau pure est neutre."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Les trois gaz à effet de serre : **CO₂** (combustions), **CH₄** (méthane : élevage, déchets), **N₂O** (engrais). Pour ranger des solutions, trie leurs pH du plus petit (le plus acide) au plus grand (le plus basique)."
