notion: elements-terre-univers
titre: "D'où viennent les éléments chimiques ?"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020) — BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027) — éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: matiere, titre: "La matière de l'Univers", sous_titre: "partout les mêmes éléments", principal: true}
      - {id: big-bang, titre: "Big Bang", sous_titre: "hydrogène et hélium"}
      - {id: etoiles, titre: "Cœur des étoiles", sous_titre: "fabrique C, O, Si, Fe…"}
      - {id: terre, titre: "Soleil et Terre", sous_titre: "nés d'un nuage enrichi"}
    liens:
      - {de: matiere, vers: big-bang, libelle: "au début"}
      - {de: big-bang, vers: etoiles, libelle: "puis"}
      - {de: etoiles, vers: terre, libelle: "dispersion"}
    jules: "Sur Terre, dans le Soleil ou dans une étoile lointaine, on retrouve les **mêmes sortes d'atomes**. Comment peut-on le savoir sans y aller ?"

  - id: schema
    type: schema
    titre: "L'histoire des atomes, et où ils se trouvent aujourd'hui"
    svg: "elements-terre-univers.svg"
    jules: "Compare les deux barres : les couleurs ne sont pas du tout réparties de la même façon. Qu'est-ce que cela t'apprend sur la Terre par rapport au reste de l'Univers ?"

  - id: methode
    type: methode
    etapes:
      - "Se demander où l'on se place : dans **tout l'Univers**, ou seulement sur Terre (**croûte terrestre**) ? Les éléments abondants ne sont pas les mêmes."
      - "Classer l'élément : **léger** (hydrogène, hélium, formés juste après le Big Bang) ou **lourd** (fabriqué dans les étoiles) ?"
      - "Pour une ressource : est-elle **abondante ou rare** sur Terre ? Se renouvelle-t-elle à l'échelle d'une vie humaine ? Peut-on la **recycler** ?"
    jules: "La première étape évite la plupart des erreurs : une question sur l'Univers et une question sur la Terre n'ont pas la même réponse."

  - id: piege
    type: piege
    mauvaise_idee: "L'oxygène est l'élément **le plus abondant de l'Univers**, puisqu'il y en a partout sur Terre."
    pourquoi_faux: "C'est vrai pour la **croûte terrestre**, pas pour l'Univers : les étoiles et les nuages de gaz, qui forment l'essentiel de la matière observable, sont surtout faits d'**hydrogène et d'hélium**."
    bonne_idee: "Dans l'Univers, **l'hydrogène domine** (environ 74 % de la masse des atomes), puis l'hélium (environ 24 %). Dans la croûte terrestre, ce sont **l'oxygène et le silicium**."
    jules: "La Terre n'est qu'un tout petit morceau de l'Univers. Ce qui est vrai chez nous l'est-il forcément ailleurs ?"

  - id: exemple
    type: exemple
    situation: "Le fer contenu dans notre sang existait-il déjà juste après le Big Bang ?"
    calcul: "Juste après le Big Bang : seulement des éléments légers (hydrogène, hélium). Le fer est un élément lourd : il a été fabriqué plus tard, **au cœur d'étoiles massives**, puis dispersé dans l'espace à leur mort."
    conclusion: "Non : ce fer vient d'étoiles disparues avant la naissance du Soleil. Les atomes de notre corps ont été **fabriqués dans des étoiles**."
    jules: "Tu peux refaire ce raisonnement pour le carbone ou l'oxygène de ton corps : la question clé est **« léger ou lourd ? »**."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Entraîne-toi aussi sur les ressources : pourquoi recycler un vieux téléphone plutôt que de le jeter ?"
