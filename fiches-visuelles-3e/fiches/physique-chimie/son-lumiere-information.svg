<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg">
<title>Chaîne de transmission d'une information</title>
<desc>Un émetteur produit un signal qui se propage jusqu'à un récepteur ; un code commun leur permet de se comprendre. En bas, la comparaison entre signal sonore et signal lumineux.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="240" y="14" width="200" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="34" text-anchor="middle" dominant-baseline="central">Code commun</text>
<text class="ts" x="340" y="52" text-anchor="middle" dominant-baseline="central">connu à l'avance des deux</text></g>
<line x1="240" y1="48" x2="120" y2="106" class="leader"/>
<line x1="440" y1="48" x2="560" y2="106" class="leader"/>
<g class="c-blue"><rect x="20" y="108" width="180" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="130" text-anchor="middle" dominant-baseline="central">Émetteur</text>
<text class="ts" x="110" y="150" text-anchor="middle" dominant-baseline="central">lampe, sifflet, sirène</text></g>
<g class="c-amber"><rect x="250" y="108" width="180" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="130" text-anchor="middle" dominant-baseline="central">Signal</text>
<text class="ts" x="340" y="150" text-anchor="middle" dominant-baseline="central">se propage dans un milieu</text></g>
<g class="c-blue"><rect x="480" y="108" width="180" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="570" y="130" text-anchor="middle" dominant-baseline="central">Récepteur</text>
<text class="ts" x="570" y="150" text-anchor="middle" dominant-baseline="central">œil, oreille, micro</text></g>
<line x1="202" y1="138" x2="246" y2="138" class="arr" marker-end="url(#arrow)"/>
<line x1="432" y1="138" x2="476" y2="138" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="20" y="200" width="310" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="175" y="222" text-anchor="middle" dominant-baseline="central">Signal sonore</text>
<text class="ts" x="175" y="244" text-anchor="middle" dominant-baseline="central">a besoin d'un milieu matériel</text>
<text class="ts" x="175" y="262" text-anchor="middle" dominant-baseline="central">environ 340 m/s dans l'air</text></g>
<g class="c-amber"><rect x="350" y="200" width="310" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="505" y="222" text-anchor="middle" dominant-baseline="central">Signal lumineux</text>
<text class="ts" x="505" y="244" text-anchor="middle" dominant-baseline="central">traverse aussi le vide</text>
<text class="ts" x="505" y="262" text-anchor="middle" dominant-baseline="central">environ 300 000 km/s</text></g>
</svg>
