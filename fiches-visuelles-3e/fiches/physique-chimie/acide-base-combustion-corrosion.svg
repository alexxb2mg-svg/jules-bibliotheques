<g class="c-red"><rect x="40" y="222" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="135" y="241" text-anchor="middle" dominant-baseline="central">Acide : pH &lt; 7</text>
<text class="ts" x="135" y="259" text-anchor="middle" dominant-baseline="central">plus d'ions H⁺ que d'ions HO⁻</text></g>
<g class="c-gray"><rect x="245" y="222" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="241" text-anchor="middle" dominant-baseline="central">Neutre : pH = 7</text>
<text class="ts" x="340" y="259" text-anchor="middle" dominant-baseline="central">autant d'ions H⁺ que HO⁻</text></g>
<g class="c-blue"><rect x="450" y="222" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="545" y="241" text-anchor="middle" dominant-baseline="central">Basique : pH &gt; 7</text>
<text class="ts" x="545" y="259" text-anchor="middle" dominant-baseline="central">plus d'ions HO⁻ que d'ions H⁺</text></g>
