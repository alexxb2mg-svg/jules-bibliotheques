<svg width="100%" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Combustion et corrosion : deux transformations avec le dioxygène">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="20" y="24" text-anchor="start" dominant-baseline="central">Combustion</text>
<g class="c-coral"><rect x="20" y="42" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="100" y="61" text-anchor="middle" dominant-baseline="central">combustible</text>
<text class="ts" x="100" y="79" text-anchor="middle" dominant-baseline="central">bois, carbone, méthane…</text></g>
<text class="th" x="195" y="70" text-anchor="middle" dominant-baseline="central">+</text>
<g class="c-coral"><rect x="210" y="42" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="290" y="61" text-anchor="middle" dominant-baseline="central">dioxygène O₂</text>
<text class="ts" x="290" y="79" text-anchor="middle" dominant-baseline="central">le comburant</text></g>
<line x1="378" y1="70" x2="428" y2="70" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="436" y="42" width="224" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="548" y="61" text-anchor="middle" dominant-baseline="central">dioxyde de carbone + eau</text>
<text class="ts" x="548" y="79" text-anchor="middle" dominant-baseline="central">si la combustion est complète</text></g>
<g class="c-red"><text class="ts" x="660" y="116" text-anchor="end" dominant-baseline="central">Manque de dioxygène : du monoxyde de carbone CO peut se former (gaz toxique).</text></g>

<text class="th" x="20" y="158" text-anchor="start" dominant-baseline="central">Corrosion du fer</text>
<g class="c-gray"><rect x="20" y="176" width="120" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="80" y="204" text-anchor="middle" dominant-baseline="central">fer</text></g>
<text class="th" x="155" y="204" text-anchor="middle" dominant-baseline="central">+</text>
<g class="c-gray"><rect x="170" y="176" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="235" y="195" text-anchor="middle" dominant-baseline="central">dioxygène</text>
<text class="ts" x="235" y="213" text-anchor="middle" dominant-baseline="central">de l'air</text></g>
<text class="th" x="315" y="204" text-anchor="middle" dominant-baseline="central">+</text>
<g class="c-gray"><rect x="330" y="176" width="110" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="385" y="195" text-anchor="middle" dominant-baseline="central">eau</text>
<text class="ts" x="385" y="213" text-anchor="middle" dominant-baseline="central">l'humidité</text></g>
<line x1="448" y1="204" x2="498" y2="204" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="506" y="176" width="154" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="583" y="195" text-anchor="middle" dominant-baseline="central">rouille</text>
<text class="ts" x="583" y="213" text-anchor="middle" dominant-baseline="central">poreuse, ronge le fer</text></g>
<text class="ts" x="20" y="252" text-anchor="start" dominant-baseline="central">Il faut les deux, dioxygène et eau ; le sel accélère la rouille. Protection : peinture, couche de zinc.</text>

<g class="c-red"><rect x="20" y="280" width="640" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="299" text-anchor="middle" dominant-baseline="central">Gaz à effet de serre issus de transformations chimiques</text>
<text class="ts" x="340" y="319" text-anchor="middle" dominant-baseline="central">CO₂ (combustions du bois, du charbon, du pétrole, du gaz) · CH₄ (élevage, déchets) · N₂O (engrais)</text></g>
</svg>
