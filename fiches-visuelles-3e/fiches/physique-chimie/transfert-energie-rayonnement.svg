<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="20" y="150" width="640" height="70" rx="6" stroke-width="0.5"/></g>
<text class="th" x="650" y="170" text-anchor="end">Atmosphère</text>
<text class="ts" x="650" y="188" text-anchor="end">gaz à effet de serre :</text>
<text class="ts" x="650" y="206" text-anchor="end">vapeur d'eau, CO₂, CH₄</text>
<g class="c-amber"><circle cx="90" cy="60" r="32" stroke-width="1"/>
<text class="th" x="90" y="60" text-anchor="middle" dominant-baseline="central">Soleil</text></g>
<line x1="98" y1="94" x2="128" y2="312" stroke="#854F0B" stroke-width="2.5" marker-end="url(#fleche)"/>
<text class="ts" x="112" y="252" text-anchor="end" fill="#854F0B">rayonnement</text>
<text class="ts" x="112" y="268" text-anchor="end" fill="#854F0B">du Soleil</text>
<line x1="240" y1="314" x2="220" y2="26" stroke="#993C1D" stroke-width="2" marker-end="url(#fleche)"/>
<text class="ts" x="234" y="40" fill="#993C1D">une partie repart</text>
<text class="ts" x="234" y="56" fill="#993C1D">vers l'espace</text>
<line x1="380" y1="314" x2="408" y2="222" stroke="#993C1D" stroke-width="2" marker-end="url(#fleche)"/>
<text class="ts" x="372" y="262" text-anchor="end" fill="#993C1D">infrarouge émis</text>
<text class="ts" x="372" y="278" text-anchor="end" fill="#993C1D">par le sol</text>
<text class="ts" x="425" y="208" text-anchor="middle">absorbé</text>
<line x1="442" y1="222" x2="470" y2="312" stroke="#993C1D" stroke-width="2" marker-end="url(#fleche)"/>
<text class="ts" x="480" y="262" fill="#993C1D">une partie</text>
<text class="ts" x="480" y="278" fill="#993C1D">renvoyée au sol</text>
<g class="c-gray"><rect x="20" y="316" width="640" height="44" rx="6" stroke-width="0.5"/>
<text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central">Sol : il absorbe le rayonnement, s'échauffe et émet de l'infrarouge</text></g>
<text class="ts" x="340" y="384" text-anchor="middle">Plus de CO₂ (combustions) : plus d'infrarouge absorbé et renvoyé, la température moyenne augmente.</text>
</svg>
