<svg width="100%" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
<title>Domaines de fréquences et écho</title>
<desc>En haut, les infrasons, les sons audibles entre 20 Hz et 20 000 Hz et les ultrasons. En bas, l'aller-retour du son lors d'un écho sur une falaise.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="fl-son" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#185FA5"/></marker></defs>
<text class="th" x="340" y="20" text-anchor="middle">1. Ce que l'oreille humaine entend</text>
<text class="ts" x="175" y="44" text-anchor="middle">20 Hz</text>
<text class="ts" x="485" y="44" text-anchor="middle">20 000 Hz</text>
<line x1="175" y1="50" x2="175" y2="118" class="leader"/>
<line x1="485" y1="50" x2="485" y2="118" class="leader"/>
<g class="c-gray"><rect x="20" y="56" width="150" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="95" y="78" text-anchor="middle">Infrasons</text>
<text class="ts" x="95" y="98" text-anchor="middle">séismes, éléphants</text></g>
<g class="c-teal"><rect x="180" y="56" width="300" height="58" rx="8" stroke-width="1"/>
<text class="th" x="330" y="78" text-anchor="middle">Sons audibles</text>
<text class="ts" x="330" y="98" text-anchor="middle">voix, musique, bruits</text></g>
<g class="c-gray"><rect x="490" y="56" width="170" height="58" rx="8" stroke-width="0.5"/>
<text class="th" x="575" y="78" text-anchor="middle">Ultrasons</text>
<text class="ts" x="575" y="98" text-anchor="middle">chauves-souris, dauphins</text></g>
<line x1="30" y1="138" x2="650" y2="138" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="30" y="158">grave</text>
<text class="ts" x="340" y="158" text-anchor="middle">fréquence en hertz (Hz) de plus en plus grande</text>
<text class="ts" x="650" y="158" text-anchor="end">aigu</text>
<text class="ts" x="660" y="178" text-anchor="end" font-style="italic">échelle non respectée</text>
<line x1="20" y1="192" x2="660" y2="192" class="leader"/>
<text class="th" x="340" y="216" text-anchor="middle">2. L'écho : un aller-retour</text>
<circle cx="70" cy="282" r="11" fill="#ffffff" stroke="#1a1a18" stroke-width="2"/>
<path d="M70,293 V340 M70,306 L54,322 M70,306 L86,322 M70,340 L56,370 M70,340 L84,370" fill="none" stroke="#1a1a18" stroke-width="2"/>
<polygon points="560,236 640,236 660,370 540,370" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="th" x="600" y="296" text-anchor="middle">falaise</text>
<line x1="20" y1="370" x2="660" y2="370" stroke="#1a1a18" stroke-width="1.5"/>
<line x1="100" y1="266" x2="548" y2="266" stroke="#185FA5" stroke-width="2" marker-end="url(#fl-son)"/>
<g class="c-blue"><text class="ts" x="320" y="256" text-anchor="middle">aller : distance D</text></g>
<line x1="548" y1="310" x2="100" y2="310" stroke="#185FA5" stroke-width="2" marker-end="url(#fl-son)"/>
<g class="c-blue"><text class="ts" x="320" y="330" text-anchor="middle">retour : distance D</text></g>
<line x1="70" y1="388" x2="552" y2="388" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="310" y="406" text-anchor="middle">D : distance entre la personne et la falaise</text>
<g class="c-blue"><text class="th" x="340" y="430" text-anchor="middle">Trajet total du son = 2 × D</text></g>
</svg>
