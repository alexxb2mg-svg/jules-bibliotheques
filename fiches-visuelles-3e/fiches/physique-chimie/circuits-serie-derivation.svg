<svg width="100%" viewBox="0 0 680 370" xmlns="http://www.w3.org/2000/svg">
<title>Circuit en série et circuit en dérivation</title>
<desc>À gauche, une pile, deux lampes et un ampèremètre en série, un voltmètre aux bornes de L2. À droite, une pile, un ampèremètre dans la branche principale et deux lampes dans deux branches dérivées.</desc>
<line x1="340" y1="16" x2="340" y2="326" class="leader"/>
<text class="th" x="175" y="24" text-anchor="middle">Circuit en série</text>
<text class="ts" x="175" y="42" text-anchor="middle">une seule boucle</text>
<path d="M50,189 V130 H300 V260 H50 V201" fill="none" stroke="#1a1a18" stroke-width="2"/>
<path d="M190,130 V80 H250 V130" fill="none" stroke="#1a1a18" stroke-width="2"/>
<line x1="34" y1="189" x2="66" y2="189" stroke="#1a1a18" stroke-width="2"/>
<line x1="42" y1="201" x2="58" y2="201" stroke="#1a1a18" stroke-width="5"/>
<text class="t" x="28" y="186" text-anchor="end">+</text>
<text class="ts" x="74" y="199">pile</text>
<circle cx="130" cy="130" r="13" fill="#ffffff" stroke="#1a1a18" stroke-width="2"/>
<line x1="120.8" y1="120.8" x2="139.2" y2="139.2" stroke="#1a1a18" stroke-width="1.5"/>
<line x1="120.8" y1="139.2" x2="139.2" y2="120.8" stroke="#1a1a18" stroke-width="1.5"/>
<circle cx="220" cy="130" r="13" fill="#ffffff" stroke="#1a1a18" stroke-width="2"/>
<line x1="210.8" y1="120.8" x2="229.2" y2="139.2" stroke="#1a1a18" stroke-width="1.5"/>
<line x1="210.8" y1="139.2" x2="229.2" y2="120.8" stroke="#1a1a18" stroke-width="1.5"/>
<text class="ts" x="130" y="164" text-anchor="middle">L1</text>
<text class="ts" x="220" y="164" text-anchor="middle">L2</text>
<circle cx="190" cy="130" r="3.5" fill="#1a1a18"/>
<circle cx="250" cy="130" r="3.5" fill="#1a1a18"/>
<circle cx="220" cy="80" r="13" fill="#ffffff" stroke="#993C1D" stroke-width="2"/>
<text class="th" x="220" y="80" text-anchor="middle" dominant-baseline="central">V</text>
<g class="c-coral"><text class="ts" x="240" y="66">U2</text></g>
<circle cx="300" cy="195" r="13" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
<text class="th" x="300" y="195" text-anchor="middle" dominant-baseline="central">A</text>
<polygon points="80,125 90,130 80,135" fill="#185FA5"/>
<g class="c-blue"><text class="ts" x="85" y="118" text-anchor="middle">I</text></g>
<polygon points="180,255 170,260 180,265" fill="#185FA5"/>
<g class="c-blue"><text class="ts" x="175" y="280" text-anchor="middle">I</text></g>
<g class="c-blue"><text class="th" x="175" y="304" text-anchor="middle">Même intensité I partout</text></g>
<g class="c-coral"><text class="th" x="175" y="324" text-anchor="middle">U pile = U1 + U2</text></g>
<text class="th" x="510" y="24" text-anchor="middle">Circuit en dérivation</text>
<text class="ts" x="510" y="42" text-anchor="middle">deux boucles (deux branches)</text>
<path d="M390,189 V130 H630 V260 H390 V201" fill="none" stroke="#1a1a18" stroke-width="2"/>
<line x1="520" y1="130" x2="520" y2="260" stroke="#1a1a18" stroke-width="2"/>
<line x1="374" y1="189" x2="406" y2="189" stroke="#1a1a18" stroke-width="2"/>
<line x1="382" y1="201" x2="398" y2="201" stroke="#1a1a18" stroke-width="5"/>
<text class="t" x="368" y="186" text-anchor="end">+</text>
<text class="ts" x="414" y="199">pile</text>
<circle cx="455" cy="130" r="13" fill="#ffffff" stroke="#185FA5" stroke-width="2"/>
<text class="th" x="455" y="130" text-anchor="middle" dominant-baseline="central">A</text>
<polygon points="483,125 493,130 483,135" fill="#185FA5"/>
<g class="c-blue"><text class="ts" x="488" y="118" text-anchor="middle">I</text></g>
<circle cx="520" cy="130" r="3.5" fill="#1a1a18"/>
<circle cx="520" cy="260" r="3.5" fill="#1a1a18"/>
<text class="ts" x="530" y="120">nœud</text>
<text class="ts" x="530" y="280">nœud</text>
<circle cx="520" cy="200" r="13" fill="#ffffff" stroke="#1a1a18" stroke-width="2"/>
<line x1="510.8" y1="190.8" x2="529.2" y2="209.2" stroke="#1a1a18" stroke-width="1.5"/>
<line x1="510.8" y1="209.2" x2="529.2" y2="190.8" stroke="#1a1a18" stroke-width="1.5"/>
<circle cx="630" cy="200" r="13" fill="#ffffff" stroke="#1a1a18" stroke-width="2"/>
<line x1="620.8" y1="190.8" x2="639.2" y2="209.2" stroke="#1a1a18" stroke-width="1.5"/>
<line x1="620.8" y1="209.2" x2="639.2" y2="190.8" stroke="#1a1a18" stroke-width="1.5"/>
<text class="ts" x="538" y="204">L1</text>
<text class="ts" x="648" y="204">L2</text>
<polygon points="515,155 520,165 525,155" fill="#185FA5"/>
<g class="c-blue"><text class="ts" x="508" y="164" text-anchor="end">I1</text></g>
<polygon points="625,155 630,165 635,155" fill="#185FA5"/>
<g class="c-blue"><text class="ts" x="618" y="164" text-anchor="end">I2</text></g>
<g class="c-coral"><text class="th" x="510" y="304" text-anchor="middle">Même tension U pour chaque branche</text></g>
<g class="c-blue"><text class="th" x="510" y="324" text-anchor="middle">I = I1 + I2</text></g>
<text class="ts" x="340" y="356" text-anchor="middle">Voltmètre (V) toujours en dérivation · Ampèremètre (A) toujours en série</text>
</svg>
