<svg width="100%" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
<g fill="none" stroke="#444441" stroke-width="2">
<polyline points="160,142 160,60 282,60"/>
<polyline points="318,60 460,60 460,110"/>
<polyline points="460,190 460,240 160,240 160,158"/>
<polyline points="460,90 560,90 560,132"/>
<polyline points="560,168 560,210 460,210"/>
</g>
<line x1="140" y1="142" x2="180" y2="142" stroke="#444441" stroke-width="2"/>
<line x1="150" y1="158" x2="170" y2="158" stroke="#444441" stroke-width="5"/>
<text class="ts" x="188" y="138">+</text>
<text class="t" x="132" y="155" text-anchor="end">générateur</text>
<circle cx="300" cy="60" r="18" fill="#FFFFFF" stroke="#444441" stroke-width="2"/>
<text class="th" x="300" y="60" text-anchor="middle" dominant-baseline="central">A</text>
<text class="ts" x="300" y="28" text-anchor="middle">ampèremètre en série : I, en A</text>
<rect x="446" y="110" width="28" height="80" fill="#FFFFFF" stroke="#444441" stroke-width="2"/>
<text class="t" x="436" y="155" text-anchor="end">appareil</text>
<circle cx="460" cy="90" r="3.5" fill="#444441"/>
<circle cx="460" cy="210" r="3.5" fill="#444441"/>
<circle cx="560" cy="150" r="18" fill="#FFFFFF" stroke="#444441" stroke-width="2"/>
<text class="th" x="560" y="150" text-anchor="middle" dominant-baseline="central">V</text>
<text class="ts" x="586" y="138">voltmètre en</text>
<text class="ts" x="586" y="154">dérivation :</text>
<text class="ts" x="586" y="170">U, en V</text>
<text class="th" x="340" y="276" text-anchor="middle">P = U × I : puissance reçue par l'appareil, en watts (W)</text>
<g class="node c-blue"><rect x="40" y="298" width="290" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="185" y="318" text-anchor="middle" dominant-baseline="central">E = P × t en joules</text>
<text class="ts" x="185" y="338" text-anchor="middle" dominant-baseline="central">P en W, t en s : E en J</text></g>
<g class="node c-teal"><rect x="350" y="298" width="290" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="318" text-anchor="middle" dominant-baseline="central">E = P × t en kilowattheures</text>
<text class="ts" x="495" y="338" text-anchor="middle" dominant-baseline="central">P en kW, t en h : E en kWh</text></g>
<text class="t" x="340" y="392" text-anchor="middle">1 kW = 1 000 W · 1 h = 3 600 s · 1 kWh = 3 600 000 J</text>
</svg>
