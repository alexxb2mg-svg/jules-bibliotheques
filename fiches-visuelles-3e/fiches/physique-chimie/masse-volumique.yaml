notion: masse-volumique
titre: "La masse volumique : ρ = m ÷ V"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020) — BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027) — éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
variables: {ρ: "la masse volumique, en g/cm³, kg/L ou kg/m³", m: "la masse, en g ou en kg", V: "le volume, en cm³ (mL), L ou m³"}
blocs:
  - id: formule
    type: formule
    expression: "[ρ] = [m] ÷ [V]"
    termes:
      "ρ": {couleur: rouge, legende: "la **masse volumique** (lettre grecque « rhô ») : en g/cm³ (= g/mL), en kg/L ou en kg/m³"}
      m: {couleur: bleu, legende: "la **masse** de l'échantillon, mesurée avec une **balance** (g ou kg)"}
      V: {couleur: vert, legende: "le **volume** de l'échantillon, mesuré avec une **éprouvette graduée** (mL = cm³, L ou m³)"}
    jules: "Astuce du triangle : m en haut, ρ et V en bas ; cache la grandeur cherchée, il reste la formule. Repère à connaître : l'eau vaut **1 g/cm³**, donc 1 L d'eau pèse **1 kg**."

  - id: carte
    type: carte
    noeuds:
      - {id: rho, titre: "Masse volumique ρ", sous_titre: "masse d'un volume unité", principal: true}
      - {id: mesurer, titre: "La mesurer", sous_titre: "balance + éprouvette"}
      - {id: identifier, titre: "Identifier", sous_titre: "comparer à un tableau"}
      - {id: flotter, titre: "Flotter ou couler", sous_titre: "comparer au liquide"}
      - {id: temperature, titre: "Température", sous_titre: "en général, baisse à chaud"}
    liens:
      - {de: rho, vers: mesurer}
      - {de: rho, vers: identifier}
      - {de: rho, vers: flotter}
      - {de: rho, vers: temperature}
    jules: "Un gros bloc de fer et un petit clou ont la même masse volumique, 7,87 g/cm³. Ce qui change entre eux, c'est la **masse** et le **volume** ; mais leur quotient m ÷ V reste le même, car c'est la même **matière**."

  - id: schema
    type: schema
    titre: "Mesurer la masse volumique d'un solide irrégulier"
    svg: "masse-volumique.svg"
    jules: "Le volume de l'objet, c'est l'eau qu'il déplace : **V₂ − V₁**, pas V₂. Par exemple, si le niveau passe de 50 mL à 62 mL, l'objet fait 12 mL, soit **12 cm³**."

  - id: graphe
    type: graphe
    gabarit: flotte-coule
    curseurs:
      - {id: curseur-rho, nom: masse_volumique, min: 0.2, max: 8, pas: 0.1, depart: 0.9}
      - {id: curseur-volume, nom: volume, min: 10, max: 100, pas: 10, depart: 30}
    lectures:
      - {si: "masse_volumique < 1", texte: "Le bloc est **moins dense** que l'eau (1 g/cm³) : il **flotte**. La part qui dépasse est d'autant plus grande que ρ est petite."}
      - {si: "masse_volumique == 1", texte: "Même masse volumique que l'eau : le bloc ne monte pas et ne tombe pas, il reste **entre deux eaux**."}
      - {si: "masse_volumique > 1", texte: "Le bloc est **plus dense** que l'eau : il **coule** et repose au fond."}
      - {si: "volume >= 60", texte: "Un gros bloc est plus **lourd** (la jauge monte : m = ρ × V), mais sa **masse volumique** n'a pas changé : il flotte ou coule comme le petit."}
    jules: "Grossis le bloc avec volume : la jauge de masse monte, mais le bloc ne change pas de comportement. Change masse_volumique : 0,9 ressemble à la glace (elle flotte), 7,9 au fer (il coule). C'est la **matière** qui décide, pas la taille."

  - id: methode
    type: methode
    etapes:
      - "Écrire la **relation utile** : ρ = m ÷ V, ou m = ρ × V, ou V = m ÷ ρ."
      - "Vérifier les **unités** : g et cm³ donnent des g/cm³ ; kg et m³ donnent des kg/m³. Rappels : 1 mL = 1 cm³, 1 L = 1 000 mL, 1 m³ = 1 000 L."
      - "Faire le calcul, puis écrire le résultat **avec son unité**."
      - "Contrôler l'**ordre de grandeur** : un métal a une masse volumique de plusieurs g/cm³, un liquide courant autour de 1 g/cm³ (eau : 1 g/cm³ = 1 000 kg/m³)."
      - "Pour **identifier une matière** : comparer la valeur trouvée au tableau et choisir **la plus proche**."
    jules: "Un métal **plus léger que l'eau**, ce serait bien étrange : c'est le signe d'une erreur. Repères en g/cm³ : huile 0,9 ; eau 1 ; aluminium 2,7 ; fer 7,9 ; or 19,3."

  - id: piege
    type: piege
    mauvaise_idee: "Calculer **V ÷ m** pour trouver la masse volumique."
    pourquoi_faux: "La masse volumique est une **masse par unité de volume** : c'est la masse qu'on divise par le volume, pas l'inverse."
    bonne_idee: "**ρ = m ÷ V**. Aide-toi de l'unité : des g/cm³, ce sont des grammes « par » centimètre cube, donc une **masse divisée par un volume**."
    jules: "Lis l'unité à voix haute : g/cm³, « grammes **par** cm³ », donc g ÷ cm³. Avec V ÷ m pour le bloc de l'exemple, tu trouverais environ 0,13 : moins que l'huile, impossible pour un **métal**."

  - id: exemple
    type: exemple
    situation: "Un bloc de métal a un volume de 30 cm³ et une masse de 237 g. De quel métal peut-il s'agir ?"
    calcul: "ρ = m ÷ V = 237 g ÷ 30 cm³ = **7,9 g/cm³**."
    conclusion: "7,9 g/cm³ est très proche de la masse volumique du fer (7,87 g/cm³) : le bloc est **probablement en fer**."
    jules: "En gardant g et cm³, le résultat sort **directement en g/cm³**, comme dans le tableau. Pour comparer : en aluminium (2,7 g/cm³), ces 30 cm³ ne pèseraient que 81 g ; l'écart est net, ce n'est pas de l'aluminium."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Retiens l'égalité : **1 g/cm³ = 1 kg/L = 1 000 kg/m³**. Le fer, 7,87 g/cm³, vaut donc 7 870 kg/m³ : un cube de fer d'un mètre de côté pèse près de 8 tonnes."
