<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="30" y="26">1. Un convertisseur (lampe, moteur) : il ne stocke pas d'énergie</text>
<line x1="40" y1="92" x2="250" y2="92" class="arr" marker-end="url(#fleche)"/>
<text class="t" x="145" y="82" text-anchor="middle">énergie reçue</text>
<g class="node c-gray"><rect x="255" y="64" width="160" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="335" y="92" text-anchor="middle" dominant-baseline="central">Convertisseur</text></g>
<line x1="417" y1="80" x2="486" y2="64" class="arr" marker-end="url(#fleche)"/>
<line x1="417" y1="104" x2="486" y2="122" class="arr" marker-end="url(#fleche)"/>
<g class="node c-teal"><rect x="490" y="40" width="160" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="570" y="62" text-anchor="middle" dominant-baseline="central">Énergie utile</text></g>
<g class="node c-coral"><rect x="490" y="98" width="160" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="570" y="115" text-anchor="middle" dominant-baseline="central">Énergie perdue</text>
<text class="ts" x="570" y="133" text-anchor="middle" dominant-baseline="central">thermique, vers l'air</text></g>
<text class="th" x="340" y="178" text-anchor="middle">énergie reçue = énergie utile + énergie perdue</text>
<line x1="30" y1="198" x2="650" y2="198" class="leader"/>
<text class="th" x="30" y="226">2. Un système qui stocke de l'énergie (batterie en charge, eau qui chauffe)</text>
<line x1="40" y1="284" x2="250" y2="284" class="arr" marker-end="url(#fleche)"/>
<text class="t" x="145" y="274" text-anchor="middle">énergie reçue</text>
<g class="node c-gray"><rect x="255" y="252" width="160" height="64" rx="8" stroke-width="0.5"/>
<text class="th" x="335" y="274" text-anchor="middle" dominant-baseline="central">Système</text>
<text class="ts" x="335" y="294" text-anchor="middle" dominant-baseline="central">énergie stockée</text></g>
<line x1="417" y1="284" x2="620" y2="284" class="arr" marker-end="url(#fleche)"/>
<text class="t" x="518" y="274" text-anchor="middle">énergie cédée</text>
<text class="t" x="340" y="342" text-anchor="middle">reçue plus grande que cédée : l'énergie stockée augmente</text>
<text class="t" x="340" y="362" text-anchor="middle">reçue plus petite que cédée : l'énergie stockée diminue</text>
<g class="c-gray"><rect x="30" y="376" width="620" height="36" rx="8" stroke-width="0.5"/>
<text class="t" x="340" y="394" text-anchor="middle" dominant-baseline="central">L'énergie ne se crée pas et ne disparaît pas : elle se transfère ou se convertit.</text></g>
</svg>
