notion: formes-energie
titre: "Les formes d'énergie"
matiere: physique-chimie
niveau: 3e
auteurs: ["projet-jules"]
licence: CC-BY-SA-4.0
sources:
  - titre: "Programme d'enseignement du cycle des approfondissements (cycle 4) — volet 3, Physique-Chimie (annexe 3, arrêté du 17-7-2020), BO n° 31 du 30 juillet 2020"
    url: "https://eduscol.education.fr/document/621/download"
    licence: etalab-2.0
  - titre: "Enseigner au cycle 4 (page de référence listant les programmes en vigueur en 2026-2027), éduscol"
    url: "https://eduscol.education.gouv.fr/4362/enseigner-au-cycle-4"
    licence: etalab-2.0
relecture: {statut: a_relire}
blocs:
  - id: carte
    type: carte
    noeuds:
      - {id: energie, titre: "L'énergie", sous_titre: "en joules (J), plusieurs formes", principal: true}
      - {id: mouvement, titre: "Mouvement et position", sous_titre: "cinétique, potentielle"}
      - {id: temperature, titre: "Température", sous_titre: "thermique"}
      - {id: stockee, titre: "Stockée dans la matière", sous_titre: "chimique, nucléaire"}
      - {id: transportee, titre: "Transportée", sous_titre: "électrique, lumineuse"}
    liens:
      - {de: energie, vers: mouvement}
      - {de: energie, vers: temperature}
      - {de: energie, vers: stockee}
      - {de: energie, vers: transportee}
    jules: "Les **sept formes** à retenir : cinétique, potentielle de position, thermique, chimique, nucléaire, électrique et lumineuse. Chez toi : énergie chimique dans une pile ou le gaz, électrique dans les fils, lumineuse émise par une lampe."

  - id: schema
    type: schema
    titre: "Chaîne énergétique d'une lampe de poche"
    svg: "formes-energie.svg"
    jules: "La pile est le **réservoir** (énergie chimique), la lampe le **convertisseur** : elle reçoit de l'énergie électrique et fournit de la lumière, utile. Elle chauffe aussi : cette **énergie thermique** est perdue, cédée à l'air."

  - id: methode
    type: methode
    etapes:
      - "Repérer d'où vient l'énergie : le **réservoir**, ou la forme d'énergie reçue."
      - "Repérer l'objet qui transforme l'énergie : le **convertisseur**."
      - "Nommer les formes d'énergie obtenues : l'**énergie utile** d'abord, puis l'**énergie thermique** souvent perdue."
      - "Se demander s'il y a une **combustion** (charbon, pétrole, gaz, bois) pour savoir si du CO₂ est émis."
    jules: "L'étape 3 est la plus oubliée : presque tous les convertisseurs **chauffent**, et cette **énergie thermique** est le plus souvent perdue. C'est pour ça qu'un chargeur ou un ordinateur est tiède après usage."

  - id: piege
    type: piege
    mauvaise_idee: "Un pot de fleurs immobile au bord d'un balcon a de l'**énergie cinétique**, puisqu'il pourrait tomber."
    pourquoi_faux: "L'énergie cinétique est liée à la **vitesse** : un objet immobile n'en a pas. Ce qui compte ici, c'est la **hauteur**."
    bonne_idee: "**Énergie cinétique** : liée à la vitesse (mouvement). **Énergie potentielle de position** : liée à la hauteur de l'objet."
    jules: "S'il bouge, l'objet a de l'énergie **cinétique** ; s'il est en hauteur, de l'énergie **potentielle de position**. Un objet qui tombe a les deux : sa hauteur diminue pendant que sa vitesse augmente."

  - id: exemple
    type: exemple
    situation: "Un barbecue brûle du charbon de bois pour cuire des aliments. Quelle est sa **chaîne énergétique**, et émet-il du dioxyde de carbone ?"
    calcul: "Réservoir : le charbon de bois (énergie chimique). Convertisseur : le foyer, où a lieu la combustion. Formes obtenues : énergie thermique (utile, pour cuire) et énergie lumineuse (les braises rougeoient)."
    conclusion: "Le barbecue convertit de l'**énergie chimique** en **énergie thermique** ; comme il y a combustion, il rejette du dioxyde de carbone (CO₂)."
    jules: "Ici, l'énergie thermique est l'**énergie utile**, alors que dans la lampe elle était **perdue** : tout dépend de ce qu'on attend de l'appareil. Retiens aussi : toute combustion (charbon, bois, gaz, pétrole) rejette du CO₂."

  - id: renfort
    type: renfort
    liens:
      - {icone: "✏️", titre: "Exercices corrigés", description: "déjà dans la leçon", outil: "lecon"}
      - {icone: "🃏", titre: "Cartes mémoire", description: "outil à venir"}
    jules: "Exemple tout fait : une bouilloire reçoit de l'**énergie électrique** et la convertit en **énergie thermique**, utile pour chauffer l'eau. Pas de combustion dans la bouilloire, donc pas de CO₂ rejeté par elle."
